  trans: '

    # 当她向我寻求帮助时……


    当她向我倾诉自己的遭遇时，这并非我第一次听说，甚至亲身体验类似情况。作为一名科技领域的单身女性，我曾需要谨慎而有策略地引导一位男性同事，打消他对我的个人兴趣。在职场环境中，如果拒绝被视为针对个人，很可能会升级为大多数管理者都难以处理的尴尬局面（更不用说这对女性本身有多不自在）。作为她的导师，我能够建议她如何积极应对，以期问题得到解决。


    在她最近一次技术评审后，情况变得明朗：他不仅将她的工作成果据为己有，还将功劳归功于她团队中的其他人，而且他对两个项目的破坏行为已经影响了她在管理层眼中的地位。我之前已指导过她如何追踪并记录他的行为，重点是寻求解决方案，而非指责。由于她的经理并未意识到这种行为对她个人职业生涯以及整个公司有多大的破坏性，我建议她将问题上报给人力资源部门。正如我此前所述，我建议只有在掌握充分文件证据，并且目标明确是“教育”而非“惩罚”时，才去找
    HR。很多时候，HR 能提供的帮助是有限的。简在处理 HR 事宜时做得非常出色，她将重点放在其不当行为导致的收入损失以及额外消耗的资源/时间上。与 HR 的对质过程相当令人不适，但经过审查发现，他的行为给公司造成了超过
    82 万美元的收入损失。HR 最终决定因其在处理流程中伪造文件以及骚扰行为而解雇他。


    在会议期间，简不小心透露了是我在建议她如何与约翰互动以解决问题。在他被解雇后，约翰找到了我的一个博客网站，发现了一个漏洞（他是一名`.Net Developer`），并黑了网站，导致我的两个博客宕机四天。尽管我有多个博客备份，但他的攻击主要集中在网站图片上（因为我有很多用于界面教学支持的截图）。这件事表明，像约翰这样，认为自己的破坏行为理所应当的人，几乎让我损失了
    8 年的技术内容。


    你开始意识到情况的严重性。约翰的行为是如此狭隘，仅仅因为世界没有按照他想要的方式运转或回应，这种心态大多数人难以理解。尽管约翰在入侵我的博客网站方面做得“出色”，因为我对
    PHP 版本了解不足，但他也没能有效隐藏自己的行踪。幸运的是，我的主机提供商正在追查此事。


    我还要再次强调，这类人并非按性别划分，因为在职场中不尊重女性的不仅仅是男性。女性同样容易对女性产生偏见，就像男性对女性产生偏见一样。虽然我可能不认同那些属于对立阵营的人，但我们之前已经讨论过偏见产生的原因，并且知道只有明确的界限和规章制度才能消除他们在生产力、收入、员工流动率以及个人职业发展方面造成的代价。通过提供倾听的耳朵和如何有效处理问题的选择来支持那些受到这种破坏性行为影响的人，也同样重要。我无法告诉你，多年来，仅仅通过与我交谈那些有影响的事件，就帮助了多少我指导过的女性。


    我每周仍然会收到许多来自寻求支持、指导或赞助的女性的联系，我努力为她们每一个人提供帮助。我也注意到，过去一年里，这个数字有所下降。我也知道下降的原因，这很大程度上涉及到一种概念验证，这在我现在所属的社区中也是一个持续进行中的工作。


    ## 细节之处见真章


    2012 年，我在丹佛参加了我的第一个地区性微软数据库活动（SQL Saturday）并发表了演讲。当我进入会场环顾四周时，我被女性与男性的比例惊呆了。此前四年我一直在
    Oracle 的活动中演讲，已经习惯了在任何我演讲的活动中女性占比都不到 10%的情况。当我开始盘点时，我很快发现，微软活动中的女性比例达到了 40%。我立刻在演讲者休息室问组织者：“你们都是从哪儿找来这么多女性的？！？”我当时刚刚为两个
    Oracle 用户组（落基山 Oracle 用户组 RMOUG 和 Oracle 开发者工具用户组 ODTUG）建立了“科技女性”（WIT）组织。我正在自学，当两位演讲者
    Jen 和 Sean McCown（Twitter 上的 MidnightDBA）向我透露微软 PASS（SQL Server 专业协会）组织是如何建立他们的
    WIT 社区时，我非常感兴趣。他们社区从一开始就让男性作为盟友，认为女性首先作为技术专业人士、其次才是女性融入社区，并通过坦诚的讨论来解决挑战，这些做法引起了我的共鸣。我从这次会面中搜集了所有能获取的信息，并带回去付诸实践。


    尽管在我更为传统的 Oracle 社区中确实遇到了一些阻力，但也同样受到了许多人的欢迎，并通过小规模复制他们的努力取得了显著成功。我意识到并理解，Oracle
    社区的成员平均年龄比微软社区的大十岁。我注意到，当 Oracle 社区的女性仍然盛装出席活动和会议时，微软社区则选择了低调随意的着装，通常穿着更休闲的服饰，相比严格的着装要求，这反而提供了更少暗示性的衣着。微软的活动对社区免费开放，演讲者和志愿者奉献时间，这使得推动志愿服务精神成为可能，并要求更强的包容性。PASS
    从一开始就进行的坦诚对话最终促成了为所有 PASS 活动采纳行为准则，并在其他会议活动中成为常态；他们还拥有一个 800 骚扰举报热线以及多元/包容性会议来促进教育，而
    Oracle 社区的大部分活动至今仍缺乏这些。由于 PASS 组织对其地区用户组采用高度集中的管理模式，他们更倾向于分享和协作。社区对他们有更深层次的、既得的利益关系，包括当社区要求变革时。没有什么是完美的，但它是一个由成员推动变革的强大平台。


    在任何微软活动中，其他与会者更可能向我提出技术问题，进行技术性对话，我也更可能被当作一个技术专家来对待。而在 Oracle 活动中，当我发表演讲时被问及“你的孩子在哪里”是常有的事，但在微软活动中几乎从未发生过。在社交媒体、电子邮件以及活动中，存在强烈的技术层面互动，包括关于哪些变革对社区有益的开放、较少限制的讨论。男性往往是首先发问，询问社区和活动如何才能更具包容性的人，我注意到他们更倾向于提问，而不是假设什么能有利于多元化和包容性。

    '
- fmt: '# 排版后内容


    加入社区后，同行们纷纷伸出援手，提供赞助和指导。这是我在 Oracle 社区中很少经历的，我意识到这有多么宝贵。尽管有更多女性，你可能会认为争夺那个女性“配额位置”的竞争会更激烈，但我从未经历过这种情况。一部分区域性活动致力于实现
    40% 女性演讲者的目标，这种代表性有助于推动他人接受，将女性视为技术专家而非异类。我不再那么有压力去充当女性中的“代言人”（因为有很多女性在发言和贡献），也有了更多机会去单纯地做出贡献。


    在融入 Microsoft 社区后，我在不到一年的时间里完成了在 Oracle 社区需要七年才能实现的事情。我成为了本地 Microsoft SQL Server
    用户组的主席。我在最大的年度 PASS 会议上演讲，撰写文章和书籍，并进行指导。我曾被提名 MVP，并且如预期的那样，一旦成为 Microsoft 员工就放弃了它，因为
    MVP 计划是一个 Microsoft 客户认可计划。


    随着我过去一年的职业生涯转向 Microsoft 技术，我经常被问及是否会离开 Oracle 社区。一些人对此表示担忧，因为他们知道最初参与的女性就很少，并且他们对持续存在的偏见感到沮丧，这种偏见影响了较老的技术为女性建立可持续的技术倡议。


    随着时间的推移，我仍然有机会为 Oracle 社区做出贡献，并且每当机会出现时，我都乐于这样做，但机会比 Microsoft 社区少。随着我转向分析、DevOps
    和 Microsoft 数据平台，我参加 Oracle 活动的机会自然会减少。加上在 Microsoft 社区中较少出现的常见障碍的挑战，进一步减少了为 Oracle
    社区做贡献的机会。这些“障碍”包括过度的审查、被劝阻不要像男性同行那样争取相同的成就，甚至我的一些内容被归功于同行。


    我发现，在一个强大且专注的 WIT 倡议存在的情况下，这类障碍会显著减少，这种倡议得到了像我在 Microsoft 社区中所经历的那种社区层面的专门支持。


    这导致我选择更多地关注 Microsoft 方面，这不是出于选择或对 Oracle 社区的不满，而是因为 Microsoft 的成功。这让我能更频繁地取得与男性同行相同的成就。我仍然热爱
    Oracle 技术，并在社区中有许多很好的朋友，但目前，投资需要更多与成为技术专家无关的时间与精力。作为曾深度参与这两个社区和公司的人，我意识到 Oracle
    的多元化和包容性倡议不够成熟。我也认为，为了拥抱云，由于他们比其他供应商更晚涉足云技术，他们别无选择，只能营造一种更具竞争力、更“传统”的氛围，这种氛围可能对女性吸引力较小。他们的会议仍然给参会的女性带来太多尴尬局面，导致不当行为（这通常是由于无限制饮酒、以男性为导向的会后活动，以及有限或不存在的行为准则政策），使得女性选择拒绝参加活动。


    在发现参加不当行为少得多的会议是什么感觉后，我发现当这种情况真的发生时，我的耐心大大减少了。在我最近一次参加 Oracle 大型活动时，我经历了两次不愉快的情况，我的第一个想法是：“我已经五十多岁了，这不应该再发生了！”我的第二个想法是赞扬
    Oracle 社区中年轻一代的男性盟友，他们认识到这种情况不能继续下去，并且在每一次事件中都挺身而出反对违规者。尽管女性可以为自己挺身而出，但当面对一个已经表现出对女性缺乏职业尊重的人时，我们发现我们的男性盟友在教化这些少数害群之马方面要成功得多。


    尽管我们经常听到女性在科技领域的“兄弟程序员”经历，但我发现年轻一代的男性更有可能成为我们的盟友。这很大程度上可能归因于女性进入职场的时间。那些成为盟友的男性，大多数在成长过程中母亲都在工作。随着多样性和包容性持续发展，这种代表性可以为后代带来巨大的改变——我们可以肯定的一件事就是变化会发生。


    这就是让我与 Oracle 社区保持联系的原因，也是我看到的希望所在。要求年长的技术专家改变他们的方式可能很苛刻，但同时，我们又在多大程度上要求女性在进入技术领域贡献专业知识时做出改变？许多年轻一代是解决
    Oracle 社区当前挑战的关键。Oracle 在开发和黑客马拉松方面进行了巨大的投入，以接纳更新、更年轻的技术专家。所有人都能从中获得巨大的价值。随着年轻一代帮助老一代摆脱旧有的偏见，年轻一代的技术专家将从老一代的技术经验中受益。通过拓宽老一代的视野并改变偏见，他们可能成为解决我在某些社区中看到的问题的关键部分。通过减轻老一代的偏见，并指导/赞助年轻的技术专家（因为我认为针对一个少数群体的偏见往往会助长对另一个群体的偏见，产生多米诺骨牌效应），遏制年龄歧视偏见的次要目标也将成为总体目标的一部分。


    我担心年龄歧视在像 Oracle 这样的社区中正成为一个更大的偏见问题，并且我相信它对技术的整体质量有着巨大的影响。我认识到自己在年龄歧视方面的偏见。根据我的经验，如果有人逼我撤回他们不同意的技术陈述，或者更奇怪的是，逼我停止写博客，那么这个人有超过
    90% 的几率是男性，并且年龄与我相仿或更大。如果一位女性质疑女性在技术领域偏见的有效性，或者质疑我的决定/着装/选择，她很可能也在 50 岁以上。当你对年长的技术专家感到焦虑时，你会意识到这可能是源于经验的偏见，但如果你不加以控制，它带来的影响不会改变。改变是困难的，我们的经历会强烈地影响我们的思维方式和预期。


    作为一个以对技术领域中的每个人价值为傲的人，你希望每个人都能成功。我的一个朋友，Niall Litchfield，曾说过：“不造成伤害。”我认为这也适用于任何处于竞争行业中的人。先与自己竞争，再与他人竞争，但无论如何，不要对他人造成伤害。'
  raw: 'Upon joining the community, peers reached out offering sponsorship and mentoring.
    This was something I experienced rarely in the Oracle community, and I recognized
    how valuable this was. Although there were more women, you’d think there would
    be more competition for that “quota spot” for a woman, yet I never experienced
    it. A percentage of the regional events strived for goals of 40% women speakers,
    and the representation helped drive acceptance for others to view women as technologists
    instead of oddities. There was less pressure on me to be “the voice” among the
    women (as there were so many of us speaking and contributing) and more opportunity
    to just contribute.


    Upon immersing myself in the Microsoft community, I was able to accomplish in
    less than a year what took me 7 years in the Oracle community. I became president
    of my local Microsoft SQL Server user group. I was speaking at the largest annual
    PASS conference, writing articles and books, and mentoring. I’d been nominated
    for my MVP and as expected gave it up once I became a Microsoft employee since
    the MVP program is a Microsoft customer recognition program.


    As my career in the last year has redirected to Microsoft technologies, I’m regularly
    asked if I’ll depart from the Oracle community. A few have stressed concern over
    this occurring, as they know there are so fewer women involved to begin with and
    as well as their frustration with a continued bias impacting older technologies
    from creating self-sustaining women in technology initiative.


    As time goes by, I’m still offered opportunities to contribute to the Oracle community
    and enjoy doing so whenever the opportunity arises, but it’s less likely than
    those for the Microsoft community. With my shift to analytics, DevOps, and the
    Microsoft Data Platform, there’s simply going to be less opportunities for me
    to contribute to Oracle events. The added challenge of the common hurdles that
    are rarer to occur in the Microsoft community decreases the opportunity to contribute
    to the Oracle community further. These “hurdles” consist of excessive scrutiny,
    being dissuaded from trying out for the same achievements as my male peers and
    even having some my content credited to peers.


    I discovered that these types of hurdles are significantly less in the presence
    of a strong and dedicated WIT initiative which has a dedicated buy-in from the
    community like I’ve experienced in the Microsoft one.


    It has resulted in me making a choice to focus more on the Microsoft side, not
    out of choice or displeasure with the Oracle community, but due to Microsoft’s
    success. It has resulted me accomplishing the same as my male peers, more often.
    I still love Oracle technology and have incredible friends within the community,
    but currently, the investment requires more time and effort that has little to
    do with being a technologist. As someone who was a significant part of both community
    and companies, I’m aware that Oracle possesses a less mature diversity and inclusion
    initiative. I also have the opinion, that to embrace the cloud, as they approached
    cloud technology later than other vendors, they had no choice but to create a
    competitive, more “traditional” atmosphere that may be less attractive to women.
    Their conferences still result in too many awkward situations for women who attend,
    resulting in inappropriate behavior (which is often due to unlimited drinking,
    male-oriented after-events, and/or limited to non-existent code of conduct policies)
    and women choosing to decline from attending events.


    After discovering what it was like to attend conferences with far lesser inappropriate
    behavior, I found that my patience when it does happen is far less. During my
    last big Oracle event I experienced two uncomfortable situations, and my first
    thought was, “I’m in my fifties now, this shouldn’t be happening anymore!” My
    second thought was to applaud the male allies from the younger generation in the
    Oracle community that recognize it can’t continue and, in each instance, stood
    up to the offenders. As much as a woman can stand up for herself, when dealing
    with someone who’s already demonstrated they have less respect for women in a
    professional environment, we discover our male allies are far more successful
    educating these few, bad apples.


    As much as we hear about “brogrammer” experiences that women in technology have,
    I’ve discovered men from younger generations are more likely to be our allies.
    Much of this may be due to when women entered the workforce. Most men who are
    allies, had mothers who worked while they were growing up. This representation
    can make a huge difference for the coming generations as diversity and inclusion
    continue to ramp up—the one thing we can count on happening is change.


    This is what helps hold me to the Oracle community and where I see the silver
    lining. It can be harsh to ask older technologists to change their ways, but at
    the same time, how much have we asked women to change as they’ve come into technology
    to lend their expertise? Many in the younger generation are the answer to the
    challenges the Oracle community is experiencing. Oracle has made a huge investment
    into development and hackathons to embrace newer and younger technologists. There
    is incredible value to be gained by all. As the younger generation helps the older
    generation evolve from older bias, the younger generation of technologists get
    to benefit from the technical experience of the older generation. By broadening
    the older generation’s outlook and changing the bias, they may be a critical part
    of overcoming the problems I see in some communities. By lessening the bias of
    the older generation and mentoring/sponsoring younger technologists (as I feel
    bias against one minority has a tendency to feed bias toward another, creating
    a domino effect), a secondary goal of deterring ageism bias will be part of the
    overall goal.


    I fear ageism is becoming a larger bias issue in communities like Oracle, and
    I believe it is incredibly impacting to the overall quality of the technology.
    I recognize my own bias around ageism. In my experiences, if I’ve been cornered
    by someone who would demand I redact a technical statement they didn’t agree with
    or, even odder, demand I stop blogging, there’s over a 90% chance they’re male
    and my age or older. If a woman is questioning the validity of women in technology
    bias or questioning my decision/dress/choices, she’s most likely the same—50+
    years old. Being anxious around technologists that are older than you, you realize
    that this may be a bias grown out of experience, but it doesn’t change the impact
    if you don’t keep it in check. Change is difficult, and our experiences can strongly
    influence the way we think and our expectations.


    As someone who prides themselves on everyone’s value in technology, you want everyone
    to be successful. A friend of mine, Niall Litchfield, once said, “Do no harm,”
    and I think this also goes for anyone who is in a competitive industry. Compete
    with yourself first, compete with others second, but whatever you do, do no harm
    to others.'
