  trans: '

    # 自信


    我们常听说女性不如男性自信，这一点也不奇怪，因为从小到大，我们常被要求反思自己的想法，却很少被鼓励去承担风险。花点时间教会自己进行经过权衡的冒险。你克服的风险越多，就会对自己越有信心。每次开会时，都致力于做出一个扎实的贡献。每个季度接手一个新项目，主动去做别人都不想做或最具挑战性的那个。这份努力会是值得的，自信则是锦上添花。学会优雅地失败。正如你会反复听我说起，成功者与失败者之间唯一的区别就是坚持。学会“装到你成功为止”（fake
    it till you make it）。在我的职业生涯中，与 95%的男性共事时，我总是惊叹于男人们常常只掌握完成任务所需 10%的知识，却表现得像专家一样。这不是害怕失败，而是知道可能会失败，但学习与成功的机会更大。这是女性应该向男性同行学习的重要一课。他们从小就被赋予这种心态，这在商界极其有益。


    # 无所畏惧


    要领导他人，就必须有人愿意追随。女性不应害怕听到自己的声音。学会自信地表达，并且表达得体。去掉那种让陈述听起来像提问的“升调”。站着对一群人讲话时，要占据空间——双脚与肩同宽，说话时不要害怕用手势。不要试图让自己显得“渺小”，就像女性在文化上被教导的那样，交叉双腿坐着。说话时要学会清晰地发音。女性，尤其是那些对各类科技感兴趣的，往往倾向于语速较快。为了帮助听众理解，要学会清晰发音，以消除沟通误解。


    在进入会议室或在众人面前发言前，务必准备好关键论点并清晰列出数据。男性从小被培养去识别和辩论细节，这对那些被教导要接纳并转化细节以使说话者感到被接纳的女性来说，可能会非常沮丧。要准备好充分阐述自己的观点，同时也要利用机会请辩论者私下继续讨论，以便你能实现最初的目标。不要让那个人把你“带进兔子洞”，陷入偏离主题的闲聊中。


    如果你发现自己的完美主义影响了变得更无所畏惧的能力，考虑寻找方法来解决它。有句谚语说：“你想要的一切都在恐惧的另一边。”害怕不完美往往源于我们对批评的恐惧。女性承受着来自四面八方的批评；要足够自信地将这一切抛诸脑后，去承担看似不可能的事情，确实困难。这时，向知己倾诉、进行冥想/瑜伽，或寻找其他排解方式来抚慰这些恐惧，就显得尤为重要。


    如果被“内心的魔鬼”，即你自己的消极想法或行为所困扰，可以考虑在日记中记录下这些想法和行为。这将给你时间去制定一个行动计划，以应对当它们真正发生时该如何反应，然后付诸行动。开始记下对抗消极想法的方法。例如：


    *“我永远无法在股东面前发言。”*


    开始列出你可以提高演讲技巧的方法。加入当地的`Toastmasters`演讲俱乐部，寻找能帮助你进步的同伴，并拥有一个安全的环境来磨练你的演讲技巧。


    这也将使你能够追踪自己的进步，以及持续出现的机会。


    # 赞助人与导师


    对于身处高管层的人来说，这两者甚至更为重要。像`LinkedIn`和`Twitter`这样的社交媒体平台，让你能够轻松接触到那些对你职业生涯的成功产生巨大影响的人。主动联系他们，无论这看起来多么令人畏惧。建立一个与你职业目标一致的、强大的个人品牌。确保拥有不仅能提供指导，而且在你有困难时、当你不在场时能在一旁提供支持的人。


    除了辅导方面的挑战，处于领导层的女性在薪资上也难以与男性同行达到同等水平。^(⁸⁴) 与技术类特定职位不同，领导岗位的薪资范围差异很大。没有明确的薪资预期，这正是你的人脉网络极具价值之处。我们需要无所畏惧地询问周围人的薪酬，也要勇于争取自己应得的价值。


    在谈判上一份职位时，招聘代表问我是否“固守”于之前的薪资，因为新职位包含高额的销售奖金作为一部分。我不假思索地回答：“我想如果我不坚持自己的薪资底线，那我就辜负了科技界所有女性。”电话那头传来笑声，但并未继续追问。两周后，他们回复，同意了我之前的薪资水平，并额外增加了
    30%的奖金涨幅。这是我的瞬间反应，但正是因为我已决定坚守薪资预期，才得以在换工作时保住了期望的薪资涨幅。我们是专业人士，我们的时间理应与男性同行一样得到同等的报酬。'
- fmt: "### Be Recognized\n\nSociety has raised us that humility is attractive. Where\
    \ men are told the successful are confident, women who are shy and soft spoken\
    \ are often displayed as appealing.^([^(85)](#fn85)) Women who own who they are\
    \ and are confident about it can be viewed as unattractive, untrustworthy, or\
    \ worse. Due to this, we’re less likely to discuss our accomplishments and may\
    \ even be viewed as intimidating.\n\nWomen who are looking to advance to leadership\
    \ positions must be willing to lead by example, recognizing their accomplishments\
    \ and those of their team. As much as we hear that a manager who identifies their\
    \ team’s accomplishments is a true leader, if the woman isn’t visible enough to\
    \ gain the management position to begin with, it’s all for naught. Unlike your\
    \ male counterparts, you will have to highlight your contributions more or face\
    \ the undeniable issue of invisibility.\n\nDon’t allow others to remove your course\
    \ by adding negatives to your path. Women who are natural leaders will be called\
    \ “bossy” or instead of being assertive will be referred to as “aggressive.”\n\
    \n1. Correct these negative terms for women who are performing no different than\
    \ their male peers.\n2. Don’t let it deter you from your course toward a position\
    \ of leadership.\n\nAs you begin to succeed and move up, remember to pay it all\
    \ forward. The best way to have more women in leadership positions and to make\
    \ women the norm in leadership is to lift as you rise. Reach out and sponsor or\
    \ mentor the women around you. Help them to achieve what you are achieving so\
    \ that we all do better.\n\nWomen make up 50% of the workplace, yet their numbers\
    \ aren’t showing in technology or leadership (Figure [4-1](#469679_1_En_4_Chapter.xhtml#Fig1)).^([^(86)](#fn86))\n\
    \n![../images/469679_1_En_4_Chapter/469679_1_En_4_Fig1_HTML.jpg](images/469679_1_En_4_Chapter/469679_1_En_4_Fig1_HTML.jpg)\n\
    \n**Figure 4-1** Women in the workplace study, 2018 corporate pipeline\n\nTo make\
    \ this change, we need to take more risks and prepare them for more challenging\
    \ demands. As much as I have offered in recommendations for women to change, it\
    \ also requires a change in our world, too. Anyone will tell you, culture is one\
    \ of the most difficult things to change. We need to continue to raise our voice\
    \ and the women around us, and this means ALL OF US. Women can’t do it alone,\
    \ and this means that the men in our world are part of this solution, too.\n\n\
    Footnotes [1](#469679_1_En_4_Chapter.xhtml#Fn1_source) [2](#469679_1_En_4_Chapter.xhtml#Fn2_source)\
    \ [3](#469679_1_En_4_Chapter.xhtml#Fn3_source) [4](#469679_1_En_4_Chapter.xhtml#Fn4_source)\
