    # 7. Stories from the Trenches


    I was lucky enough to be sponsored to be part of a book series, called *Let Them
    Finish, Stories from the Trenches*, and it makes you realize how powerful each
    of our stories are. It’s not just someone speaking for you, but your own voice,
    your own experience, and a collaboration through similarities that bring bias
    and progress to light. I’d already wanted to have a chapter surrounding the same
    in my own book. As I’ve been known to share, I receive between 10 and 30 emails
    per week from the community looking for guidance and support and sometimes to
    simply vent. It’s therapeutic to share one’s challenges, as well as it bonds us,
    especially when we realize that we’re not alone.


    I had reached out early on and asked some of my peers if they were interested
    in sharing a story of what it was like to be a woman in technology. In an effort
    to demonstrate the similarities with which bias impacts all diversity, I also
    reached out to those of racial diversity and sexual/gender orientation to ask
    for their contribution, too. Technology has so much to gain when we allow everyone
    to contribute fully to the industry, so it was important to me to try to give
    as many as I possibly could a voice.


    I offered the opportunity to contribute, either by name, initials, or with anonymity,
    and with a focus on education, not persecution. Anonymity was important, as with
    the experience of bias, we can also feel embarrassment. We don’t want to be viewed
    as a victim or feel that we’re now open to judgment. I know one of the first emotions
    I experience when I’ve dealt with uncomfortable situations of bias—it isn’t anger,
    it isn’t frustration, but without a doubt, embarrassment. I’m embarrassed that
    I have to deal with the bias and that we’re still unable to move past it all.


    All the experiences in this chapter were shared with the permission of the contributors.
    Although it may seem odd that I must mention this, any similarities to individuals
    you know or think you know should not be assumed. I can’t recall how often I’ve
    written about my own or other’s experiences in blogs, articles, etc., and there’s
    nothing more awkward than telling someone who’s contacted you and is angry about
    a story they think is about them that it’s not.


    Realizing that more open dialogue and stronger diversity and inclusion initiatives
    would then, in turn, build more comfort in open discussion among the community,
    I wasn’t surprised when I experienced a stark difference in individuals’ choices
    to share their stories. The women who were involved in communities with more open
    communication were more likely to contribute and were less likely to desire anonymity.
    If the community possessed a strong Women in Technology initiative, women were
    over 40% more likely to want to contribute (outside of time constraints, which
    decreased the number significantly).


    I’m starting with Ruth’s story, as she is someone who’s part of “soft tech,” often
    having to deal with bias during her long career. She’s warm, supportive, and friendly.
    She, like many women I know, has a tendency to look internally for answers to
    her problems and is incredibly resourceful in the way she reaches deep and inspects
    her career, even now that she’s retired.'
