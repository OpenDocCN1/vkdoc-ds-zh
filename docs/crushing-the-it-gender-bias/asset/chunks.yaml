    industry, having retired, but for the women, there was a drastic difference. Eight
    of the thirteen women I’d worked with had left the technical industry. Three had
    retired but retired early (in their 50s), while the rest had left to pursue different
    industries, often with more diversity. These were intriguing numbers, and I realized
