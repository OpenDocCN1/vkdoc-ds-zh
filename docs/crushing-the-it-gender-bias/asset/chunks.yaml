  trans: '

    # 演好角色 *vs.* 做好角色


    衡量一个技术领域成功与否，事件并非唯一的区别。我注意到很多同行在职业生涯的某个阶段选择离职——通常是在进入管理层的早期，他们的职业生涯便停滞不前。他们的男性同行会继续进步，而他们却原地踏步。当领导层中大多数是男性时，她们往往不知道该效仿谁（图
    8-2）。


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig2_HTML.png](img/469679_1_En_8_Fig2_HTML.png)


    图 8-2. 美国顶尖科技公司中的领导层 *vs.* 技术岗位占比^(¹³⁶)


    我刚加入微软时，就看到自己所在的部门中有许多女性担任领导职务。凯特·约翰逊（Kate Johnson）是负责微软所有公共及私营业务领域的副总裁，她很友善地在
    `LinkedIn` 上与我联系，甚至回复了我的信息，她是我现在所在公司女性领导层的一个代表。另一个我们经常听到并非常钦佩的人是托妮·汤斯-惠特利（Toni
    Townes-Whitley），她是美国受监管行业的总裁。她对自己所展现的能力极为自信，在面向大量听众演讲时，她能迅速与他们建立起非凡的联系。还有其他一些领导岗位的人，比如微软的首席无障碍官珍妮·莱-弗勒里（Jenny
    Lay-Flurrie），你可能一开始不会注意到她，但我在入职后不久了解到她们的事迹后，也深受打动。如果你好奇为什么珍妮对我有如此大的激励作用，那是因为她患有重度耳聋，并且一直是微软人工智能项目中的关键推动力量，该项目专注于为残障人士提供包容性。这些项目包括一个
    `PowerPoint` 插件，它可以自动将演讲者的话语转换为字幕，甚至可以利用同样是微软开发的自动翻译技术，将其翻译成不同的语言。这仅仅是技术如何成为推动多元化和包容性解决方案的一部分，让每个人都能更多地参与到我们周围世界中的又一个例子。


    我还印象深刻地看到，微软董事会成员中有 30% 是女性，这个比例并不像我们期望的那么普遍。^(¹³⁷)


    微软首席执行官萨提亚·纳德拉（Satya Nadella）在会议、晋升和我们的团队中花费了大量时间来表彰她们。为了帮助摆脱招聘实践中固有的偏见，微软在数据显示公司内部多元化程度有所下降后，将高管奖金与多元化目标挂钩。^(¹³⁸)
    为了让公司对求职者更具吸引力，公司制定了清晰明确的职业发展路径，甚至提供了推动自身职业发展的方法。在甲骨文公司，我为我们的联合首席执行官萨弗拉·卡茨（Safra
    Katz）感到无比自豪，但那时公司并没有一个全球性的愿景认为多元化是重要的。偶尔你会听到同事开的玩笑，说马克·赫德（Mark Hurd）才是真正的 CEO，萨弗拉·卡茨不可能靠自己获得这个职位。无论她在能力或知识方面如何比较，都无法消除那些影响她在公司内部声誉的偏见。尽管持有这种观点的人只是少数，但正如我们本章前面所讨论的，这种毒性可能致命，而允许这些声音被听到的沉默，也如震耳欲聋的噪音一般，揭示了偏见对领导层的影响。


    尽管在甲骨文工作，你会熟悉领导层缺乏多元化的现状，除了少数常见的刻板印象之外，没有任何公开的数据能够证实实际经历或显示出变革的意愿。最近，甲骨文超过 4000
    名员工因性别偏见导致的薪资不一致问题提起了诉讼。^(¹³⁹) 只有时间和法院才能决定这个案件的最终结果，但当你读到一家你钦佩的公司经历这样的事情时，无论如何都会感到难受。许多公司都在法庭上遇到过类似的挑战，甚至包括我现在工作的公司。有助于改变这种局面的一个方法是，在涉及多元化和包容性时，对你所做的一切保持透明。


    微软与谷歌、苹果及其他科技巨头一样，会发布关于其多元化和多元化举措的信息，并努力强调其重要性。2018 年的结果已经出现在 `Forbes`^(¹⁴⁰) 和其他主要媒体的文章中，讨论这些增长及其对公司的重要性。考虑到公司的规模，在多元化方面产生影响并非易事。从实习生到领导层，每个领域的增长都只略高于
    1%，但当你认识到实习生往往是未来的技术专家时，新的数据就很有希望了：2018 年实习生中女性比例从 42.5% 增长了超过 2%。


    最大的成功也是最艰巨的挑战之一，那就是技术岗位的种族多元化（图 8-3）。报告显示，在过去 4 年中，黑人和拉丁裔员工数量增长了 33%。尽管从占所有员工的百分比来看，这个数字仍然是个位数，但这是一个他们可以引以为傲的增长，并且希望在未来的岁月里能够持续下去。


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig3_HTML.png](img/469679_1_En_8_Fig3_HTML.png)


    图 8-3. 美国技术岗位中的多元化程度^(¹⁴¹)


    拥有这类公开信息让我看到了希望，并帮助我坚定了理解：能够产生实际结果的多元化和包容性举措，与那些仅仅是为了“打个勾”敷衍了事的举措相比，是何等重要。你必须看到公司内部发生真正的变化，即使是很小的变化。这种变化不应仅仅体现在技术岗位女性的增加上，还应体现在领导层的代表比例上。如果你看不到这一点，你或许不会认同“你无法成为你看不到的人”这种说法，但这确实会让你在没有任何路径指引的情况下，更难开辟自己的道路。


    我在微软社区取得的成就，与我在甲骨文社区相比，速度如此之快，原因不在于我的经验，而在于我们讨论过的——通常在于赞助。在微软的任何活动上，都会有 2-3 倍于以往的人找到我，问我是否愿意去另一个活动演讲、投稿一篇文章，或者参加某个专业团体的社交聚会。我经常目睹其他女性被问及是否考虑提交论文摘要去会议演讲、写书或参与特别活动。我亲眼目睹对他人的赞助越多，就越认识到，反过来，我自己也能获得更多的赞助。这是一种“传递善意”的举措，聚焦于团结一致——每个人都是“大家庭”的一部分，每个人都应该尽力相互支持。


    考虑到我所经历的一切，以及我指导和支持过的每一个人，很难想象有什么能阻止我继续推动“科技女性”计划，但我意识到，成为多元化和包容性社区的一员也会带来副作用。


    在拥有多元化和包容性举措的社区中，通常存在两种情景：


    1.  除了空洞的举措之外，多元化和包容性是一个讳莫如深的话题，收效甚微。

