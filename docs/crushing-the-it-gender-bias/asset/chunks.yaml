  trans: '

    # 通往你的人生之路


    周围人的意见——家人、朋友、顾问和同辈——很容易让你偏离自己的道路。我们的家人可能出于好意，但他们眼中的我们往往不是“现在的我们”，而是“过去的我们”。我仍会时常提醒自己，我的孩子们已经成年了，并试着回想自己在他们这个年纪时的状态。我那时怀揣什么梦想？我拥有哪些资源，或者我在自己身上发现了什么？我经常告诉孩子要提前规划。他们希望未来是什么样的？他们的目标是什么？能否将这些目标分解成小任务，一步步去实现？拥有一份清晰的目标和步骤清单，能够确保你最终实现那些整体看来似乎遥不可及的成就。


    首先，列一个大纲，并将其分为三类：


    * **职业发展**

    * **个人生活**

    * **超越自我**


    这份清单应保持在较高层次，以免陷入过多细节，或让你觉得难以获得那些小小的成就感。同时，也要学会奖励自己取得的小成就。正如我之前所说，行动本身蕴含着力量，但如果你不肯定那些微小的成功，你将没有精力去跨越那些巨大的障碍。


    当你开始构建这份清单时，请记住，并不存在我们在电视节目和书籍中听到的那种理想的工作/生活平衡，让你获得个人成功感。就连亚马逊 CEO 杰夫·贝佐斯也声称，“工作/生活平衡”这个说法会消磨人的意志。^(⁵⁹)
    对有些人而言，成功可能意味着他们每天都能按时接孩子放学。对另一些人来说，成功可能意味着每天有固定时间去健身房锻炼，或者拥有一笔培训预算来提升专业知识，或者是以上各种元素的组合。你会注意到，我并没有提及我自己在很多人眼中成功的标志（演讲、写作和职业发展）。你的道路意味着，这种平衡将为你量身定制一套属于你职业、个人生活甚至更高层面的需求组合。这与我认为什么重要毫无关系，而这也是你在寻求指导和导师时的关键考量因素。


    在考量职业清单时，我希望你不要考虑从 HR 那里听来的标准工作福利或待遇，而是思考什么能让你的生活更轻松、更高效、更满意。在识别什么对你重要、能确保你履行职业和个人责任时，要跳出思维定式。需求并不等同于欲望，但这并不意味着在我们逐步构建道路时，你会对欲望毫不在意：


    *   我需要灵活的工作时间/兼职/合同职位。

    *   我需要一位不事无巨细的管理者/来自领导的明确期望。

    *   我需要一个协作的团队/独立工作的环境。

    *   我需要能够在家人需要我的时候，随时在他们身边。

    *   我需要一份有技术挑战、专注于数据科学/编程/项目管理的职业。

    *   我需要远程/在办公室办公。


    你的欲望清单应该作为第二份清单，以及你未来道路的延伸。


    *   你想做什么？**以从现在起 5 个月、2 年、5 年为时间节点来规划。**

    *   你想去哪里？**你是想走技术路线、管理路线、进入一个不同行业，还是可能创业？**

    *   你想达成什么？**你是渴望成为引领团队的人，还是更倾向于合作和/或支持的角色？**

    *   你对职业成功的定义是什么？**不要让杂志或媒体告诉你成功是什么。成功是对你个人和职业生活感到满意。这个定义也会变化，所以如果你的成功观随时间改变，不要惩罚自己。**


    ## 这是关乎个人的


    我们常被告知个人生活与职业必须分开，但随着技术的进步和职业的要求，职业渗透到个人生活中是自然而然的事。作为女性，我们仍然承担着[更多的家庭责任](https://www.bls.gov/news.release/atus.nr0.htm)。^(⁶⁰)
    根据美国劳工统计局的最新数据，平均每天仍有 49%的女性从事某种家务劳动，*而*男性只有 19%。^(⁶¹) 研究同样表明，谁来做家务仍然是夫妻争吵的首要话题，并且我们发现，社会自然地对那些传统上更偏向女性而非男性责任的家务活赋予了更少的价值。^(⁶²)


    这会对女性的职业道路产生重大影响，因为对她们个人时间的需求（在某些人看来）会成为支付女性更低薪酬的借口。我曾与值得信赖的同事公开辩论过这个话题，最终不得不构建出以下公式：


    ![../images/469679_1_En_4_Chapter/469679_1_En_4_Figa_HTML.jpg](img/469679_1_En_4_Figa_HTML.jpg)


    真正的公式要复杂得多，但为了尽可能简单地解释：


    ![../images/469679_1_En_4_Chapter/469679_1_En_4_Figb_HTML.jpg](img/469679_1_En_4_Figb_HTML.jpg)


    最终得出


    ![../images/469679_1_En_4_Chapter/469679_1_En_4_Figc_HTML.jpg](img/469679_1_En_4_Figc_HTML.jpg)


    我曾有过一些同事，他们在办公室待上 10 多个小时，却为企业创造极少甚至没有价值。他们只完成一些基础任务，却没有改进任何能为公司增加收入或显著提升团队表现的流程。每周在办公桌前坐
    50 个小时或更久却贡献甚微，不应让这样的人比另一位每周出勤 40 小时、但任务表现远超平均水平、积极主动和/或为团队带来改进的员工更优秀。企业开始意识到这一点，并基于这项研究重新调整他们眼中优秀团队成员的标准。^(⁶³)


    尽管有了这些认识，职场妈妈承受的压力依然存在巨大的偏见。不仅仅是个人责任的需求在影响着我们看待职业女性的方式。^(⁶⁴) 从整体文化来看，人们认为职场女性比男性同行能力更差、投入更少、更不勤奋。^(⁶⁵)
    在开始这场讨论之前，我必须首先明确：目标是要摆脱偏见，专注于平等，*而不是*让女性看上去比男性同事更优秀。

    '
- fmt: '### Limitation Bias Persists


    In a strongly supported Pew Study, 54% of men with children under the age of 17
    believe that having a full-time mother is the most ideal situation to raise a
    child.^([^(66)](#fn66)) The percentage additions added when women were added to
    the research undoubtedly increased significantly, as this is a cultural perception
    as much as it is a nature one.


    Research performed as part of a thesis released in 2006,^([^(67)](#fn67)) my `Marietta
    College`, and authored by `Kelly McIntosh` and `William Bauer`, `PhD`, has demonstrated
    that both working mothers and stay-at-home mothers resulted in little difference
    in a child’s upbringing. Where the nonworking parent was able to offer more personal
    time to the child when they were young, along with support system during activities,
    children of working parents performed better in school and were more independent.
    As women’s education and careers have increased, so have their pay, which has
    increased the services and care that their children receive. We often hear, “it
    takes a village to raise a child” and for those parents without the support system
    of a family or friends to help them, these services can benefit everyone in the
    family. The takeaway from the research was that, no matter if you’re a stay-at-home
    mother or a working mother, neither is better than the other for your children,
    and it should be a family choice. The research demonstrated over anything else
    that American culture still has a significant bias and debate on women working
    outside the home even though the data proves otherwise.


    ### No Kiddie Table


    We then reach into the next frontier that causes many discomforts, and that’s
    the challenges of working women who don’t desire children of their own. Although
    logic would tell us that it isn’t different from a man not desiring children,
    the secondary bias toward women to not trust or believe them leave them in a very
    challenging position.^([^(68)](#fn68)) Upon interviewing for an opportunity or
    a promotion, it’s not uncommon for these women to be questioned about their intent
    to have children at some later point in their lives. Although it’s none of their
    peers’ or employer’s business, they’re doubted on their decision to not have children
    and often told, “You’ll change your mind.” It’s also not uncommon for women who’ve
    chosen not to have children to be told it’s “selfish” of them, and as a mother
    myself, I find it just the opposite. When one decides to have children, the common
    reason is they want a child to love, to carry on their bloodline, or to satisfy
    other desires. It’s not an unselfish act to choose to have a child. The unselfishness
    comes later in the form of the love you [hopefully] show the child and how you
    raise the child to become a valuable member of society. Once you’ve done so, then
    you’ve fulfilled your obligation outside of your desire to have one, but rarely
    was it a decision that’s made without a desire to be fulfilled. We even read articles
    how women who never have children will more likely be unfulfilled. As we’ve already
    established, the idea that only traditional choices will lead to satisfaction
    is a myth—each woman has her own path and what will fulfill the list of requirements
    to decide if she’s been successful in her life or not is as unique as she is.


    My youngest sister, `Kimberly`, is a woman who decided she was happier being an
    aunt and decided against having children. She’s incredibly inspiring, has a master’s
    in law, works in intellectual content for a great company, and enjoys her life
    in the bay area. I don’t see her being able to provide more value to the world
    if she had decided to become a mother. She’s incredibly independent, has a full
    life, with a busy, successful career, and travels whenever she can. My middle
    sister, on the other hand, worked part-time for most of her life, and she prioritized
    motherhood. `Kristi` found her satisfaction with a more traditional choice, and
    I don’t think she would have been as satisfied with `Kimberly`’s path. It’s all
    about owning our individual paths, and we should all have the opportunity to claim
    the one that fits our unique selves, not just the traditional norms or what the
    media deems as a success.


    My own decision on motherhood was somewhere in between my siblings. I am the mother
    of three biological children and two older stepchildren. Although I had more children
    than my middle sister, I always worked, returning to work after the end of a short
    maternity leave with each child. I am happiest when I’m busy, and this translated
    clearly with me as a working mother. I love my children and even had a live-in
    nanny while my children were quite young (it’s not as glamorous as it sounds and
    when you have three children, it’s often cheaper than traditional daycare.) I
    was a single mother while my children were young, and having a live-in nanny offered
    a more traditional upbringing for my children while I was able to pursue my career
    to afford to care for them in the best way possible. It was my path—my journey.
    My second nanny is one of my best friends 15 years later. She was a single, new
    mother when I hired her to be my live-in nanny and the arrangement, although not
    a traditional one (where the nanny doesn’t have children) worked well. She was
    able to stay at home with her baby, and I had someone to live at home with my
    three children. I didn’t choose to switch to standard, afterschool daycare until
    all the children were old enough to attend school.'
