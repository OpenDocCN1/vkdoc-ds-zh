    # 直截了当，但不要过于直白


    母亲随着年龄增长变得温和了，现在她常会告诉我们她爱我们。但我觉得，小时候我更多的是让她感到疲惫，而非愉悦。她那种务实直率的沟通风格，带来了一种生活哲学：**“用心去感受，用头脑去思考，说出你的真实想法，不要把这两者混淆。”**
    尽管她觉得我需要说出真实想法，但母亲对大多数事情似乎都不愿发表意见，这让我只能自己摸索。而这也恰恰教会我，我的直觉比周围任何人都更准确，并让我学会相信自己——当你在专业团队中属于少数派时，这是一种巨大的力量。


    “直觉”这个词在职场中会引起各种有趣的回应。我从不否认自己拥有强烈的直觉，但我常常思考，为什么在讨论男性时，我们更可能说他们“相信自己的直觉”（trusting
    their gut），而形容女性时，对同样甚至更敏锐的能力，却用“直觉”（intuition）这个词，仿佛它是虚无缥缈的东西。我的直觉，不过是我对情境和他人高度敏锐的观察力。我获取信息，并能看到全局，但如果有人想贬低这种能力，就会称之为“直觉”；而当他们想认可一位男性同事的类似能力时，就称之为“本能”。这往往源于我们不信任女性。向人们指出这类偏见非常重要——不是以对抗的方式，而是作为讨论，要认识到贡献者的价值正被区别对待。


    我们确实不信任女性。已经有[文章](https://www.huffingtonpost.com/damon-young/men-just-dont-trust-women_b_6714280.html)^(¹⁹)收集数据并记录了这一现象，探讨其成因。我们常常告诉女孩，从很小的时候起，她们就是在“反应过度”或“情绪化”。男孩被教导要压抑情绪，而我们却向女性解释，她们天生就是*感性*而非理性或逻辑的，并且她们的情绪在任何情况下都显得夸张。


    男性从小就被教育要为自己的信念和言论挺身而出，这是“信任男人说的话”这种旧习的遗存。而另一方面，女性却经常被要求分析和自我怀疑：


    *   “你觉得你是不是反应过度了？”

    *   “你觉得你是不是误解了他/她的意思？”

    *   “你为什么不给他/她一个机会？”（这通常发生在女性对自己接触的人做出判断之后。）

    *   “你确定你听对了吗？”


    我坚信，这就是为什么研究发现女性比男性更容易患上“冒名顶替综合征”，以及为什么她们被认为不够果断的原因。^(²⁰) 我们告诉女孩要怀疑自己的诸多想法和决定，难怪她们总是自我怀疑。


    ## 相信自己


    如我所说，我天性孤僻。我喜欢特立独行，我的直觉敏锐地告诉我，什么时候问题是别人的，而不是我的错。随着我磨练这些技能，它在我成长过程中给了我巨大的帮助，我开始相信自己胜过任何人。这也需要足够自力更生的能力去独自前行。我学会了享受独处，而不是渴望那些可能质疑我自信的人的陪伴。这带来了一个有趣的效果——我更能抵御欺凌，并且倾向于为身边的人挺身而出。


    当我面对那些偏见更深的人时，如果我雄心勃勃地努力达成和男性同事一样的目标，他们的不适感很快就会暴露出来。公司可以选择建设性地处理这个问题，也可以任由其演变成霸凌。我都经历过。我无意主动与霸凌者挑起对抗；我只是按照我认为能为公司创造最大价值的水平去工作，但当霸凌者的行为倾向被发现时，通常为时已晚，无法避免冲突。请记住——我的意图是明确的，并期望他人也能以同样的方式回应。事实是，偏见是无意识的，它往往既让表现出偏见的人感到困扰，也让被针对的人感到沮丧。施害者通常意识到自己的行为有些不公或不正确，但由于偏见更为微妙，并且成长经历告诉他们这种偏见是可以接受的（例如，家庭中母亲全职在家的状况更好，或者女性在技术领域不如男性有能力），而不是他们亲身经历的那样，这会导致施害者将怒火发泄在目标身上，而不是向内寻找解决方案。


    不过，这也是解决这个问题的部分答案。它不是完整的解决方案，但你的处理方式可能有助于找到解决办法：


    1.  当你被要求分析或自我怀疑时，首先调查一下向你提出这个要求的人的动机。这通常是无意的，但你可能会发现其根源在于个人不安全感、对女性抱负的不适，或其他偏见。

    2.  认识到这一点后，你就可以得出结论，问题出在对方身上，而不是你，然后你可以根据情况，做出是否要继续进行下去的决定。仅仅知道这是别人的问题，并不能自动让你继续前进，但它应该促使你反思：是否有一个合理的理由，阻碍你实现下一步目标。

    3.  不要害怕就该挑战与对方进行坦诚的沟通。你应该能很快判断出，这是否是一个教育对方的机会，或者此人是否已拒绝成长。

    4.  如果需要第三方作为调解人，请考虑一位专注于发展和解决问题，而不是偏袒任何一方的人。

    5.  随着你的职业发展和成熟，你可能会发现自己越来越不在意、也必须越来越不在意他人的看法。雪莉·桑德伯格即使面对多数人的反对，也能坚持做自己认为正确的事，这比刚进入科技公司第一年的简容易得多。行动就是力量，你做得越多，成就越大，坚持做对的事，而不是别人对你的期望，就会变得越容易。

    6.  也要知道何时该离开。人们离开的不是公司，而是他们的经理。如果你经理的偏见限制了你的发展，那就去寻找一家拥有能促进你成长的经理的新公司。

    '
- fmt: '# The Collaboration Killer


    As we are challenged to succeed with lacking trust and opportunities, bias can
    also result in lacking collaboration.^([^(21)](#fn21)) Some men may collaborate
    less with female peers due to simple social awkwardness. Others will do less collaboration
    due to insecurities. As women are often competing, we may find some women who
    are less likely to collaborate with other women. This collaboration can not only
    limit learning opportunities, it can also impact professional advancement, career
    satisfaction, and the business from receiving the benefit of potential reached
    by the individual employees. In meetings and e-mails, women may receive less feedback
    or no response at all, which leads to women communicating less. I have experienced
    this myself and know it exists. I have responded to an e-mail chain (more than
    once), and while there is considerable interaction between peers, I would receive
    none or very little response. At times, it would be the extent I would check with
    a trusted confidant to find out if my e-mails were being received by the group.
    I found that I was also more likely to receive a response offline or only one-on-one.
    I noticed that this often happened when I offered a technical solution in interactions.
    It led me to accept that there was discomfort acknowledging that a woman had come
    up with the solution.


    These types of interactions can lead to women being bypassed for promotions and
    raises more often, as they are invisible to management due to lacking collaboration
    that would demonstrate their contributions.^([^(22)](#fn22)) As they are already
    less viewed as leaders, to not acknowledge when they solve problems or take on
    challenges can create even more "invisible leaders" of the women in tech.^([^(23)](#fn23))


    Steve Martin said, "be so good, they can''t ignore you," but as we''ve already
    discussed, women can become less visible than their male peers even when they
    outperform. To overcome this, I recommend that women keep a weekly status of their
    productivity. Send the status to your manager as part of the process, even if
    he/she has no request of it. If they ask, simply respond, "No one knows what I
    do, and I''d be negligent if I didn''t let you know the value I bring if anyone
    asks you." This is a service you''re doing for them, but it also creates visibility
    for you.


    Don''t be afraid to let people know what you are doing and what you''ve accomplished.
    We have already established that society has a discomfort with women''s ambition.
    A while back, I was at a speaker dinner. I''d been introduced to another speaker,
    and although I was in numerous technical conversations in the session we''d originally
    met in, he assumed I was in marketing. The data he''d already received in our
    interactions made this assumption odd, but then he confirmed, with all the technology
    I seemed to know, I must have an interesting technical history and asked what
    I''d done. I gave him a high level of my career, but once I finished, he said,
    "Well, I''m not as good at self-promotion as you are, but…" It was clear to me
    that he was uncomfortable with a woman who was comfortable with her accomplishments.
    At the same time, I wouldn''t have answered any differently if asked to do so
    again—this was his problem, not mine. I wasn''t looking for his approval of my
    path, and after a few months, I earned his respect, and he has relaxed with me
    significantly.


    # Navigating Up


    I do have a strong resume/CV, but this comes from working in numerous industries
    and technologies.


    I can''t see how I would have received the experience or exposure I have if I''d
    stayed at one company for 5–10 years. There''s one male peer in the community
    that introduces me to others and has joked, "Kellyn can''t keep a job…" because
    I have accepted new opportunities approximately every 2 years. I quickly correct
    him and ask how is it a negative thing to be in the top 1% of your field in salary
    and experience? I pass this recommendation onto those technical professionals
    I mentor—only stay at jobs 2–3 years, and I advise this for several reasons:


    1. Most companies don''t offer a pension, so current retirement plans can be rolled
    over to a new company.


    2. Technology changes fast and to move to a new company can offer new opportunities
    to learn. A technologist with 10 years of experience at one company rarely can
    compete technically with another who''s had 10 years of experience with five companies.


    3. The average raise is 2–7%, where a position with a new company can offer anywhere
    from 10 to 30% raise. This is a significant jump, and with gender pay gap due
    to time away from work to raise children and loss of promotion due to gender bias,
    this can really shrink that gap.


    A resume that displays work experience with changes of every 2 years rarely will
    be viewed negatively by Information Technology professionals who are looking to
    hire you. The amount of experience and pay increase that can be used to benefit
    your next career move will far outweigh any drawbacks.


