  trans: '

    ## 快乐、光鲜的人们


    在我所关注的技术界女性专题讨论会中，超过 98%的参与者都是那些看似拥有一切的女性。组建一个技术界女性专题讨论会本应是一个合乎逻辑的过程，但通常，它们让与会者坐在那些成就似乎遥不可及的代表面前，或者让听众在活动结束后感觉自己像个失败者。一个专题讨论会应当既能激励人心，又能引起与会者的共鸣。这个讨论会也必须让人有代入感，所以如果它看起来不真实，就容易导致会议失败。谢丽尔·桑德伯格（Sheryl
    Sandburg），尽管她在她的书*《向前一步》*中显得平易近人，但仍然遭受了难以置信的大量批评。^((46)) 我们一直在讨论我们对自己女性的批评有多么严苛。有人会质疑一位女性为什么选择工作、是否待在家里、是选择“向前一步”还是退居幕后。对于谢丽尔来说，在那个管理级别上，女性的代表性实在太少，以至于对于那些并不梦想成为
    C 级高管（`CEO`、`COO`、`CIO`等）的人来说，她仍然是一位她们无法产生共鸣的女性。


    在我设计的每一个技术界女性专题讨论会中，我都尝试邀请一位 C 级高管，但也会把我自己——一位拥有独特技术职业道路的女性——包括进来。然后，我还会尝试邀请一位处于职业生涯中期的女性、一位刚刚开始成长的女性，以及一位男性。正如我经常说的，我们都是解决方案的一部分，而我始终拒绝参加任何一个不包括男性的技术界女性专题讨论会。你不想搞一个全是男性的技术界女性专题讨论会——那完全没意义，但让男性参与对话的唯一方式就是让他们也感到受欢迎。要做到这点，邀请一位能在讨论会上解释他们如何能更好地成为包容性盟友的男性，会产生巨大的不同。


    作为多元化和包容性倡议的一部分，“科技界女性”计划已经取得了长足的进步，但在我看来，其中许多计划仍“缺乏力度”。换句话说，它们仅仅讨论女性技术职业面临的挑战，却忘记了跟进，去创建能够改变现状的流程和政策。当女性和有色人种无法晋升到管理岗位时，你就能识别出这类计划。他们无法代表自己，也无法影响那些导致现状的偏见。现有的这些倡议必须成熟起来，不能只停留在谈论问题上，而应切实采取行动。我们必须能够看到一个清晰的路径，让女性和有色人种能够被提拔到管理和领导岗位。我还发现，这些计划往往会回避真实的对话。它们总是只要求宣扬积极、让人感觉良好的言论。对于任何想要避免关于性别和偏见的尴尬对话的人来说，这些团体很棒。它们对于社交活动很好，但如果一位女性的技术职业因本书讨论过的任何挑战而停滞不前，这些活动很可能会让她无法找到如何建设性应对这些挑战的方案。一位我在多个项目上合作的女性将这些团体称为“开心/快乐的人们”。认识到这种区别以及这些团体提供的价值（只是与那些直面偏见和挑战的团体所提供价值不同）很重要。我们都是解决方案的一部分。


    ## 职称浪潮


    我们的文化常常低估女性的能力，即便有“每个成功男人的背后，都有一个伟大的女人”这样的说法，但我们仍会将男人的成就归功于他本人。当情况反转过来时，男性依旧被归功的现象非常普遍。由于我和我丈夫在同一行业、服务于相同的团体，他经常对人们因我正在做、且与他完全无关的工作而感谢或祝贺他感到恼火。我意识到，这在科技界的女性与其男性同事之间一定也时有发生。这不仅发生在那些可能羞于谈论自己成就的女性身上，也发生在那些显然已经完成了工作，但功劳却毫无悬念地被归给她们的男性同事的人们身上。


    我收到过无数封（多到数不清）来自女性的电子邮件，她们觉得自己的工作成果被归功于他人。她们已经意识到了这对职业生涯的影响，比如晋升被绕过、项目机会错失。当管理者相信一项成就是由完成它的技术专家以外的其他人所达成时，管理者很难做出恰当的奖励。这正是我们的盟友发挥作用的时候，也是每个人都是解决方案一部分的时刻。他们挺身而出，纠正那些将科技界女性所取得的成就归功于他人的错误信息。每一件本该属于她们的小小成就被归给他人，都是她们职业道路上的一次倒退。


    ### 循序渐进


    为了吸引最优秀的应聘者，职称必须与机会相匹配。我拥有非常罕见的技术、演讲和管理技能组合。这使我能够创建自己的职称，从而以我希望的方式引导我的职业生涯。在一家前雇主雇佣我接替某人时，他们合并了两个职位。尽管我不属于市场部，但这个职位却包含了令人厌烦的“市场”一词作为职称的一部分。我谨慎且策略性地作为录用条件的一部分进行了协商，让经理知道这个职称是阻止我签字的唯一因素。我得以立即在`LinkedIn`上使用我偏好的职称，并且在六个月内，官方的职称也在`HR`内部完成了更改。


    如果有人声称职称在一家公司里不重要，首先要做的事就是识别说出这句话的人的职称。对于那些已经取得成就的人来说，可能会有一种自然反应，即保护自己的地位，阻止他人取得同样的成就，并让人感觉难以企及。我们都想变得特别。这本身没有错，除非它被用来影响他人的道路。一旦你识别出这个人的职称，并判断他们是否已经获得某个高职称是影响因素，那么就专注于职称这个方面，并再次提出你的要求。当女性讨论她们提出职称要求遭拒的经历时，一些用来描述她们的词语会反复出现：


    *   野心太大

    *   权力欲强

    *   咄咄逼人

    *   玩弄权术（等级制度可能被视为如此）

    *   缺乏团队精神


    职称不仅对你当前或即将担任的职位重要。它也会引导你在未来获得更高的薪水和更好的机会。拥有“主管”头衔，你获得的薪水和奖金会比没有这个头衔时更高。当有人在`HR`核实你的工作经历时，“代理主管”这个头衔几乎毫无意义。如今很少有公司会使用专业推荐人，而且，收集这些信息的人很少会知道你曾是“代理主管”，也不在乎这一点，他们只想知道你是否履行了你所担任职称的职责。

    '
- fmt: '# Mansplain It to Me


    “Mansplaining” can be an infuriating experience for most women. The official definition
    of mansplaining is, “the explanation of something by a man, typically to a woman,
    in a manner regarded as condescending or patronizing.”^([^(47)](#fn47)) If women
    take the time to explain why someone shouldn’t do it, then we often sound like
    the pot calling the kettle black. You will rarely find someone with strong leadership
    skills mansplaining. The need to do so is sourced from personality traits that
    aren’t keen to a strong leader as this personality trait is sourced on insecurities.


    Research will also add that mansplaining sources from how men and women differ
    on how they view networking.^([^(48)](#fn48)) Where women may shut out another
    woman they are competing with, a man will try to “one up” the other man, as they
    view the competition more like a ladder, with a challenge to demonstrate who is
    smartest at the top. This need to outsmart each other can bleed over to proving
    themselves as worthwhile in a woman’s eyes while competing with other men, causing
    them to explain factual data, even on topics the woman he’s explaining it to may
    be more educated on.


    I’ve had my share of mansplaining. An interesting situation came up recently where
    I was speaking at a conference in Quebec. A fellow speaker began to explain to
    me, in detail, what it meant to be French–Canadian. He stated that he wasn’t French–Canadian
    himself, but that I needed to know the ire between the Canadians and French–Canadian
    all sourced from a specific historical incident. He continued to drive the point
    home for over 20 minutes, and I noted that the other speakers around the table
    had either put on earbuds, were busy on tasks, or looked at me and rolled their
    eyes. Noticing their behavior, I was confident that I wasn’t the only one recognizing
    that the individual explanation was going on a bit too long and he trying to impress
    me more than was required to get his point across. Yes, he wasn’t trying to mansplain
    purposefully, but he was doing so, nonetheless. At no time did he ask what my
    nationality was, and to be honest, he had made it clear that he’d known who I
    was since 2009. I wasn’t able to get many words in edgewise, but I’d hoped to
    redirect the conversation by explaining that my family came to Ontario through
    Nova Scotia in the late 1700s. I concluded that I must not have explained I was
    French–Canadian very well and let him finish and then depart.


    One of the speakers who’d had his earbuds in took them out and shook his head,
    laughing. He said, “Good ol’ <insert name>, he’s a consultant and he’s seen your
    name on every consulting contract he’s signed. He should have known better than
    to explain what a French–Canadian is to you!” My maiden name, `PotVin`, translates
    directly from French as “bottle of wine,” but in Quebec, it’s slang for bribe.
    What I didn’t know was that every contract is in French and requires you to sign
    off that you won’t accept any “bribes.” It’s part of the code of conduct, but
    just as slang has become part of standard American language, so has it become
    part of Quebec French. Quebec is one of the oldest areas settled in the Americas
    and in the olden days, even before the fur trade, alcohol was currency. In New
    Jersey, you might often here the slang term “grease money” for a bribe; in Quebec,
    they use `potvin`.


    When mansplaining does happen to you, it’s important to find a way to offer inner
    peace by understanding the source or need to “mansplain.” It sources from culture—a
    culture that expects a man to know the answers and solutions to every problem
    to move ahead of those around him. The need to explain in detail vs. courteously
    taking the time to find out if the woman already has the information is moot.
    Mansplaining, at times, can also offer a way to compensate for insecurities—a
    need to be more intelligent, especially when trying to impress the woman or group
    that they’re faced with. Keep in mind that simple nervousness or anxiety may play
    into their choice to behave this way. Frustrating as it is, if the individual
    isn’t known for the behavior (or it’s the first time you’ve experienced it), I
    recommend trying to be gracious, giving the offender a pass. If it continues for
    a lengthy time or it impacts your ability to perform your duties or complete a
    task, let’s say a one-time meeting where your first impression or performance
    is essential, don’t hesitate to interrupt the “mansplainer.” I prefer the choice
    of “do no harm,” but when so many women are bypassed for promotions, titles, and
    opportunities to shine due to these types of behaviors, then those are the reasons
    to deter the behavior and speak up.


    Interrupting with a simple, “As I was saying…” or “Please, let me finish…” may
    be an easier way to allow your voice to be heard without pointing out that the
    peer was mansplaining. If I do have to point out that mansplaining is occurring,
    I’ll attempt to make a joke of it, “Please, do explain my role to me further…”
    or “Really?? Is that what my product does??” For an “accidental mansplainer,”
    they will quickly recognize the mistake, and not only will the behavior stop,
    it will rarely happen again.


    For the repeat offender, there may be a lack of respect for women that is included
    with insecurities and lack of self-awareness. These rare few may require a different
    approach. Locating a male peer that is sensitive to the situation and that the
    offender respects will be one of the best options. The offender will be more likely
    to listen to the male peer, and as we’ve discussed, we need to keep our eye on
    the goal, which is education, not persecution. We are all part of the solution,
    and having men help other men overcome bias and limitations is as important as
    is our role in helping women move past their own bias.'
