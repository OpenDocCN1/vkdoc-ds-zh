- fmt: '# Judgment Day


    Each gender may do it differently, but we both do it. While many men are judged
    on their abilities, women are often still judged on their appearance.^([^(115)](#fn115))
    When we isolate to attire, men are accused of observing women’s on level of male
    attraction and women judge other women’s attire on level of acceptance. Women’s
    clothing overall is more restrictive, less comfortable, and simply more impacted
    by changing fashion, which can add up to a combination that’s created multimillion
    dollar industries of fashion clothing lines, magazines, and online content.


    My reason for focusing on this topic is if a woman in tech is spending time adjusting
    clothes ten times per hour, this is mental energy that isn’t available for productive
    endeavors and adds up to 5 minutes lost per day. I’m highly distractible and discovered
    that I was able to concentrate better when I was more comfortable. Once arthritis
    developed in my feet, I no longer could wear heels but settled happily into wearing
    combat boots. I didn’t want to be traditional “nurses shoes” (not that there’s
    anything wrong with them, they just didn’t meet my personal style), but I made
    a decision not to have my feet hurt anymore. From there, I started to identify
    what pieces of clothing distracted me and replaced them in my wardrobe.


    * Socks with fell down were replaced with those that stayed in place on my ankles.

    * Any clothing that was uncomfortable in any way—cut in, binding, tight, or restrictive—was
    replaced with comfortable, well-fitting clothes without a need to adjust.

    * Bike shorts under dresses so I wouldn’t mind walking upstairs that were exposed
    to the lower floors.

    * Shoes and boots that are top-notch quality, but nothing with a heel or pointed
    toe.

    * I learned to dress in layers, so I was more likely to be comfortable, no matter
    the temperature.


    All of these clothing choices were to support my personal style—the materials
    wash and wear well, but the rule is, I must be comfortable and love the article
    of clothing. The extra time saved from adjusting and distraction from discomfort
    can then be used to continue focusing on the task at hand. I applaud the women
    at conferences/events wearing 4-inch heels (that they can even stand in them!),
    but any woman who is competing with men in tech is already pressured to perform
    at a higher level, and to do that, you need every edge you can get.^([^(116)](#fn116))
    This is one more area you may be expelling mental energy that you didn’t even
    realize—adjusting clothing hourly to keep up your appearance in clothing that
    is incredibly unforgiving.


    Be you, but find a way to be a comfortable you to be the best you.


    # Speeding Up


    As women begin to fear their ambition less and desire to do more with their technical
    careers, they begin to move beyond just doing a good job technically. As their
    male peers have achieved—writing, presenting to audiences, and achieving positions
    on boards, so shall women. As many have discovered, they might receive mixed signals
    from other women who’ve pioneered before them and with good reason. We unconsciously
    still move one woman up, expecting another to step down to make room for her.
    This is one of the complexities that continues to hinder women’s advancement in
    the workplace. Until we recognize this and address it, along with treating women
    in technology as technologists, I don’t see it changing.


    I also recommend running for a board position. Start out with a local community
    or technical group and move onto higher positions from there. It is not only beneficial
    to your career, it’s even more so for the boards that are progressive and seek
    women out. Women board members must be offered the same respect and opportunities
    as their male peers. As women are less likely to view board positions as a “tick
    on their resume” vs. a position that requires their full contribution, women board
    members can be amazingly effective for any board.^([^(117)](#fn117)) To quote
    Tina Fey, “Bitches get stuff done.”


    Board positions are an incredible opportunity for those that want to do more,
    but so are conference events, panels, and event organizing in your industry. Helping
    be part of the change and supporting local organizations can introduce you to
    your local network. The question by many is how to get introduced and become part
    of groups and events, such as conferences.


    As diversity and inclusion becomes more important to tech conferences, conference
    organizers are just as often perplexed with low turnout of women attendees and
    speakers. With the importance of attendance to the success of any event, reaching
    out to the women in the industry to improve upon this is a great idea. If you
    have chosen to attend an event, review what social and after events are available
    for attendees. You might be surprised how male oriented both they, as well as
    vendor offerings, are, but this is something I believe can change with increased
    diversity numbers.


    I admit, I’m unaware of any women in my circle who hasn’t experienced an awkward
    interaction at a technical conference due to over indulgence of alcohol, booth
    babes, and male-focused attractions. For those events hoping to raise the number
    of abstract submissions from women speakers, consider sending invitations to submit
    an abstract to potential speakers and to previous attendees. Changing abstract
    submissions from a proposal of competition to an invitation doesn’t change how
    the abstracts are accepted but does change the perception for the submitter.


    If we want more inclusion of women at technical conferences, a change has to occur
    about what makes a successful event for everyone who attends. Only a small percentage
    of women will voice a frustration with male-oriented technical events.^([^(118)](#fn118))
    Another small percentage will claim it doesn’t bother them, having grown immune
    to it, and a majority will just deal with the discomfort until they decide they
    have something better to do. This creates a situation that isn’t self-sustaining
    and will never improve.


    There has to be a large investment in the next generation, too. Not just changing
    what is, but what is to come. We’re seeing monstrous initiatives into Science,
    Technology, Engineering, and Mathematics (STEM) education. We also need to move
    the needle on cultural changes in how we view girls, not just at the critical
    age milestones^([^(119)](#fn119)) (5, 8, 12, and 15) but also from the point of
    how culture views them from before birth.'
