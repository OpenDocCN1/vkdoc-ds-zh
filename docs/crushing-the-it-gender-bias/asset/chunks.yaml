  trans: '

    # 自我价值


    薪酬福利是性别薪资差距的核心问题，尽管一些网站声称能提供薪资透明度，但人们对此议题仍存在显著分歧。^(⁴⁰) 在我指导男性和女性时，发现女性需要薪资指导的比例与男性相比存在明显差异。我深知这些女性面临的挑战。我可以相当直接，也不怕问别人可能回避的问题，但我也有外交手腕，尽管这并非总能让我在各种情况下都成功。


    大约在 2010 年，我注意到自己的薪资与男性同龄人之间存在鸿沟。那些经验更少、责任更轻的男性获得的加薪幅度和"官方"头衔都超过了我。我并不害怕在欢乐时光和社交活动中与男性同事打成一片，而且我发现，喝了一两杯啤酒后，男性们就开始讨论那些我们一直被告知不宜谈及的话题。他们开始分享自己的薪资，以及他们是如何获得了那些我曾被告知不可能、不符合上层管理当前风格、或此前根本不存在的头衔的。普遍的说法是，男性会要求女性不会要求的头衔和加薪，但几乎在每一个案例中，这都并非事实。事实上，我的研究表明，女性往往比涉及的男性更直接，但她们的诉求却被忽视了。^(⁴¹)


    我想起自己曾经的一份合同；在那期间，公司一直表示非常希望我成为全职员工。当合同最后一天录用通知书送达时，书面上的薪资比我与他们讨论过的少了 20000 美元。CIO
    对我感到失望并不意外，并解释了事情的原委。在我合同到期前一个月，他们聘用了一位应用经理，而她接受了一个与其职位预期相比**非常低**的薪资。她入职后，公司进行了一次重组，我被安排向她汇报工作。而我当时并不知道，公司有一项规定：任何员工的薪资都不能超过其直属上司的
    5%。因此，由于汇报关系的变更，我的录用条件受到了影响。


    需要明确的是，这位新应用经理能力很强，并且拥有出色的领导才能。在她上任仅几周内，我就与她建立了良好的工作关系，也很乐意为她工作。直到今天，我既不知道她是否不清楚自己应得的薪资，还是出于其他原因仅仅接受了一份低薪报价，但我从未问过。


    我与应用经理和 CIO 就如何处理这份不足的录用条件讨论了一段时间，我们都认为进行薪资谈判是上策。他们不想失去我，但也有点担心。CEO 并非以人际交往能力著称，每个人似乎，嗯，都很怕他。我很有信心，凭借我的薪资历史和经验，这不会成为问题；并且有了应用经理的支持，谈判成功的几率非常高。


    一周后，我们会见了 CEO。虽然他并非最亲切的人，但他问了一些我觉得相当合理的问题，于是我们开始了谈判。应用经理非常明确地表示，基于我的技术能力和我所取得的成就，她觉得我要求薪资是应得的，而且她对我挣得比她多没有意见。CEO
    结束了会议，但对他将如何回应谈判没有给出任何暗示，只是要求给他一些时间研究一下。


    ## 感谢参与


    当天晚上，我接到了派遣公司的电话。他们非常慌张，只是说 CEO 联系了他们，他们不知道如何告诉我这个消息，因为他们听到的关于我的都是好评，但 CEO 只是说我的合同到期了，他们决定不再续约。我的服务不再被需要了。他们谨慎地告诉我不要联系他们，也不要就这个决定提出任何异议，因为
    CEO 可能会让我在这个行业里日子难过。当时，我的职业生涯还没有达到今天的高度，虽然感到震惊，但我默默地接受了他们的话和这个决定。我很沮丧，受到如此对待，但家里有三个孩子要养，我掸了掸身上的尘土，投出了简历，三天之内就被一家新公司录用了，薪资比我之前要求的还高。


    现在你可能会想，故事到此结束了，但并没有。之后发生的一件事让我对接受低薪的影响有了深刻的认识。前一家公司在接下来的几个月里，一直以那份低薪报价招聘我的替代者。我仍然会和前同事一起吃午饭，得知他们终于招到了人，而且我认识他们选中的那个女人。我还是个`初级
    DBA`的时候，和她丈夫共事过，而她的闺蜜是“安”。我很惊讶地听说这个女人，“琼”，以那么低的薪资接受了这个职位，考虑到她高级别的技能水平。一年后，我和安再次共事。我问她为什么觉得琼会接受这份工作。安说琼的丈夫收入很高，而且琼在上一份工作中遇到了职场霸凌的问题，于是决定接受这份低薪报价，以摆脱之前的环境。


    不过，琼也没待多久。不到一年，她就离开了，因为她很难全身心投入一个薪水与自身价值不符的岗位。随后，公司用新的候选人填补了 DBA 的职位，每年都换不止一个人，薪资却始终维持着那个低标准。从与前同事的交谈中得知，工作质量下降了，CEO
    也越来越觉得数据库管理员对公司没什么价值。在我与前同事的最后一次互动中，听说他们正在考虑完全取消团队中的数据库管理员职位，转而由应用部门来支持数据库。


    关于接受低薪（即使只是为了摆脱糟糕的工作环境）的影响，我们学到了什么？


    每当有女性接受了低薪，这影响的往往不仅仅是她个人的生活质量，还会影响到她周围的女性。这可能会拖累她们，长期影响她们的薪资水平。大多数公司在任何招聘流程的谈判阶段，都会询问候选人之前或现在职位的薪资，而这部分数据也会作为主要公司背景调查的一部分提供。


    对于开出低薪的公司来说，其影响可能不那么明显。为高技术职位提供低薪会影响候选人的质量，并且往往会因为员工满意度不足，导致公司在员工投入和人员流动方面付出更高的代价。

