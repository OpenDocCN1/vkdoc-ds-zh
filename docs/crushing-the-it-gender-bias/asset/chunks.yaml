- fmt: '# Self-Worth


    Salary and benefits are at the center of the gender pay gap, with sites that claim
    to provide salary transparency, yet there is significant disagreement on the topic.^([^(40)](#fn40))
    As I mentored men and women, there was a distinct difference in the percentage
    of salary mentoring that was required for the women *vs.* the men. I understood
    the challenges these women were facing. I can be quite direct, and I’m not afraid
    to ask questions that others might avoid, but I also have a knack for diplomacy,
    although it hasn’t always granted me success in every situation.


    Around 2010, I noticed a gulf in my salary *vs.* my male peers. Men who had less
    experience and less responsibility were gaining higher salary increases and “official”
    titles than I was receiving. I wasn’t afraid of hanging out with the guys in happy
    hour and networking events, and I found that after a beer or two, the guys started
    to discuss topics that we’d always been told were off limits. They started to
    share their salaries and how they’d been offered titles that I’d been told weren’t
    an option, against the current preferred style of upper management or hadn’t previously
    existed. The common story was that men were asking for titles and salary increases
    that women weren’t, yet in almost every instance, none of this had occurred. In
    fact, my research showed that women were often more direct than the men involved,
    yet the conversation was dismissed.^([^(41)](#fn41))


    I was reminded of a contract I’d held; all the while, the company had discussed
    how strongly they wanted to bring me on full time. When the offer arrived the
    last day of my contract, the salary on paper was $20,000 less than I had discussed
    with them. The CIO wasn’t surprised by my disappointment and proceeded to explain
    what had happened. A month before my contract was up, they had hired an Applications
    Manager, and she had accepted a very low salary *vs.* what would have been expected
    for someone in her position. After she was hired, a reorganization occurred that
    moved me to report to her, and unbeknownst to me, there was a company policy that
    no employee could make within 5% of the manager they reported to, so my offer
    was impacted due to the reporting change.


    To make this very clear, the new Application Manager was quite competent and had
    excellent leadership skills. I had already built a solid rapport with her and
    enjoyed working for her in just the few weeks she’d been on the job. To this day,
    I don’t know if she were unaware of what she should have been paid or simply accepted
    a low offer because of another reason, but never did ask.


    The Application Manager, the CIO, and I spoke for some time about how to handle
    the insufficient offer and felt that a salary negotiation would be the best course
    of action. They didn’t want to lose me, but they were a bit worried. The CEO was
    not known for his people skills and everyone seemed, well, scared of him. I was
    confident that due to my salary history and experience that it wouldn’t be an
    issue and that with the support of the Application Manager, the chance of a successful
    negotiation was very high.


    We met with the CEO the next week, and although he was not the most personable
    man, he asked me questions I found fair enough, and we proceeded with the negotiation.
    The Application Manager made it very clear that due to my technical skills and
    all that I accomplished, she felt I deserved the salary I was requesting and that
    she had no issue with me making more than her. The CEO closed the meeting with
    no indication one way or the other on how he would answer the negotiation but
    asked for some time to investigate the request.


    ## Thanks for Playing


    I received a call that evening from my contracting company. They were quite flustered
    and simply said that they’d been contacted by the CEO and that they weren’t sure
    how to tell me this, as they hadn’t heard anything but great things about me,
    but that the CEO simply stated that my contract was up and that they had decided
    not to renew. My services were no longer required. I was cautiously told to not
    contact them and not to raise any argument regarding the decision that the CEO
    could make it difficult for me in the industry. At the time, my career wasn’t
    where it is today, and although taken aback, I quietly accepted what I was told
    and accepted the decision. I was frustrated at being treated in such a way, but
    having three children to feed, I brushed myself off, put my resume out, and within
    three days was hired at a new company at a salary over what I had originally asked
    for from the previous.


    Now you might think this is where the story ends, but no, there’s a follow-up
    that offered insight into the impact of accepting a low salary. The previous company
    interviewed for my replacement, at the low salary offer for quite a few months.
    I still went to lunch with a previous coworker and was informed that they’d finally
    hired someone, and I knew the woman they’d chosen. I’d worked with her husband
    back when I was a `Jr. DBA`, and her best friend had been “Ann.” I was very surprised
    to hear that this woman, “June,” had accepted the position at such a low rate,
    considering her senior level of skills, and Ann and I worked together again a
    year later. I asked her why she thought June had taken the job. Ann said June’s
    husband was making a very good living and that June had experienced some issues
    in her previous job with a workplace bully and decided to accept the low salary
    offer to leave the previous situation.


    June didn’t stay for very long, though. Within a year, she left, having a difficult
    time dedicated to a position that she wasn’t being paid what she was worth. Subsequently,
    the company replaced the DBA position with new candidates, more than one per year,
    at the same, low salary rate. From discussions with previous coworkers, the quality
    degraded, and the CEO became more and more concerned that database administrators
    weren’t very valuable to the company. In the last interaction I had with my previous
    coworkers, I heard, they were considering scrapping the position of database administrator
    completely from the team and simply have databases supported by the application
    department.


    What have we learned about the impact of low salary acceptance, even when it’s
    just to get out of a miserable work environment?


    Every time a woman does accept a low salary, it often impacts more than just her
    quality of life, but other women around her. It can impact their salary rate for
    the long term by setting her back. Most companies will ask in the negotiation
    phase of any hiring process what the candidate made at her or his previous or
    current position, and this is data provided as part of employment verification
    with most major companies.


    The impact to the company making the low offer may not be as apparent. Offering
    low salaries for highly technical positions impacts the quality of the candidates
    received and often costs the company more in dedication and turnover due to lack
    of satisfaction.'
