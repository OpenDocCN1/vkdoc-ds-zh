- '# 引言


  当我职业生涯刚刚开始时，我所在的团队由五位女数据库管理员组成。在九个月内，其中一位与我同时入职的五人之一离开了这个行业。她年轻、单身，拥有计算机科学学位，主攻数据库技术，并且没有孩子。我很难理解，如果我这样一个离婚、带着三个孩子、还有一个年幼婴儿、且没有计算机科学学位的人都能坚持下去，她为什么却不能。


  在接下来的六年里，我忙于自己的事业和抚养孩子，以至于没有注意到，我已经从全女性的数据库管理员团队变成了团队中唯一的女性。随着我职业生涯的不断推进，我原先认为女性是数据库管理员、男性从事网络和服务器管理的传统观念发生了变化，以至于男性从事信息技术、女性在这个行业中是少数派的文化常态，变成了我周围的现实。


  直到一位同行遭遇的令人不安的情况迫使我审视真正的罪魁祸首，我才发现大多数关于歧视和骚扰的政策很少能够有效遏制影响多元化的性别偏见。我觉得有必要发声，但显然我需要开始研究以理解这一切。偏见是一种复杂的生物学机制，历史上作为启发式思维的一部分发展而来，并由经验和文化教养塑造而成。历史上，启发式特质被构建出来，是为了保护我们避免食用与已知有毒植物相似的植物，或避免类似之前使我们陷入危险的環境情境。我们通过经验和榜样学习，但为了做到这一点，人类会简化和分类周围环境，以减轻对安全问题深入探究的需求。举一个危险性较低的启发式思维例子：如果我递给你一个青柠，你会预期拿到一个小的、圆的、绿色的柑橘类水果。相反，如果我递给你一个红色的指橙，一种原产于澳大利亚、形似香蕉的青柠家族少数派，那么会有一定比例的人很难接受它是一个青柠的事实。它不符合他们对青柠外观的预期。这种偏见来源的保護機制虽然有着重要的目的，即用于识别环境危险，如有毒食物和物理威胁，但也会在这种无害的情况下出现，导致一定比例的个体拒绝不符合他们预期标准的青柠。我们都受启发式思维的影响，无论男女，尽管某些人格类型更依赖于他们的启发式倾向。他们不喜欢走出舒适区，不喜欢打破传统，也不喜欢接受改变。


  本书的总体目标是：如果我们不知道有问题，又如何去解决它？由于我们对启发式思维的使用是一種保護措施，它可能是无意识的，并且由于偏见的一部分建立在文化和教养之上，启发式思维可以无缝地融入我们的社会。本书的第二个目标是分享见解、知识和支持，以帮助行业中的女性取得成功。


  我自己的旅程让我意识到文化和偏见是多么难以解决，更不用说改变了。但变化可以带来巨大的成长和惠及每个人的益处。没有这种变化，科技行业的增长就会受阻；它无法充分发展和发挥其潜力。由缺乏多样性的科技行业生产的产品，其满足其所应代表的客户需求的能力将是有限的。


  '
- '# 致谢


  我要感谢我出色的丈夫蒂姆·戈尔曼，感谢他巨大的支持和爱。拥有一位真正重视婚姻平等的伴侣，在这个世界上能产生令人难以置信的变化。蒂姆，你是我在这场我们称之为生活、爱与科技的旅程中的伴侣。我无法奢求有更好的人与我分享这段旅程。


  我还要感谢微软，它证明了无论多样性和包容性面临多少挑战，它都证明了微小而真实的改变能带来不同。当我开始意识到改变需要从我身边的人做起，并且我无法改变世界时，微软选择了专注于他们能在公司内部改变的事情，而这已经显现出成效。


  如今，我在微软工作已有一年，在行业里也已有 20 年经验。我正在一个拥有两名以上女性的团队中工作。这是 15 年多来的第一次。在一个五人的团队中，有三位是女性，其中两位担任深度技术岗位。微软是我经历过的唯一一家将多样性和包容性作为每天更高优先级事项并融入每个目标的公司。这不仅仅是为了在检查清单上打勾。这种改变科技行业现状并致力于带来改变的政策，甚至能为我这样身经百战的“女战士”带来和平与和谐。


  '
- '# 关于作者


  '
- '# 1. 故事背后的数字


  事实是由证据和数据支持的信息，而观点则基于个人经验和看法。由于偏见源于个人的经历和观点，一些读者怀疑其存在也是很自然的。本章将涵盖一些亲身经历以及背后的数据，以帮助我们在这段旅程中前行。




  ## 我对偏见的认识


  在这个行业摸爬滚打了十年后，我迎来了与一位女性同僚合作的最后机会之一，我们称她为"安"。早在 2004 年，安曾是我的首席数据库管理员，我非常尊重她的技术能力及其领导才能。在目睹了她前一年充满挑战和混乱管理决策的遭遇后，她被迫离开了我们共同任职的公司。她与一位男性同僚"乔治"之间产生了冲突，矛盾持续升级，却未得到管理层或人力资源部门的调解，最终她选择辞职。我对自己无法提供帮助感到无力，因为我和这两位当事人都是朋友，并且当初推荐了他们各自的职位，使他们得以入职这家公司。我确信无疑地意识到，我亲眼目睹了乔治因安的天然领导力而产生的不安全感。


  数据库管理员的工作往往压力巨大，而我们所在公司由于业务需求，压力更甚于平均水平。当灾难降临时，安表现得冷静而深思熟虑；而乔治，无论技术多么精湛，却总是脾气暴躁，动辄对周围的人发火。虽然对乔治的行为感到失望，但更让我沮丧的是管理层——他们看不到安的领导才能，反而在雇佣两人仅仅一个月后，就让乔治晋升到了安之上。当初我推荐雇佣他们时，明确建议让安担任领导角色，让乔治承担执行任务，因为他正如我所评价的那样，是一匹"老黄牛"——我自己也属于这种类型，所以很容易识别。


  随着安和乔治之间的矛盾激化，人力资源部门几乎无力掌控局面。安离开了公司，并在不久后从技术界退休。安的离职对我打击很大，我试图弄明白当初如何才能帮上更多忙。几个月后，我也离开了这家公司，失去了两位同僚，也失去了一位朋友。我失去了安这位同僚，因为我觉得自己辜负了她；也失去了乔治这个朋友兼同僚，因为我不确定究竟是谁辜负了我们所有人。


  不久后，我联系了安并约她共进午餐。初次见面时，她给出的离开技术行业的理由听起来合情合理，但从她说话的方式、语气中的伤感，以及我对她经历的了解来看，我知道事情远不止如此。


  安起初不愿多说，但当我强调自己为所发生的一切感到困扰时，她似乎因找到倾诉对象而松了口气。我承认自己在应对整个事件时存在失误，不确定当初如何能在前公司更好地支持她。我与她进行了长谈，并在接下来的几个月里多次交流。她描述了数十年来阻碍她职业发展的种种挫折以及持续不断的小挑战。这些情况中没有一件是明目张胆的歧视，但全都是难以明确界定的显性偏见。她曾试图解决，却屡屡惨败，因为这些情况都处于灰色地带。而她向我倾诉得越多，我越意识到自己也曾经历过许多类似的挑战。和安一样，我过去并未将这些归为性别问题，只是单纯以为只有自己遇到这种情况。在我职业生涯的这个阶段，"偏见"这个词很少被提及（即便有也很少）。而此时此刻，我们正在说出无数女性默默诅咒却不敢言说的心声。


  ## 女性同僚的消失


  我与安的经历发生在 2011 年，比谢丽尔·桑德伯格出版其畅销书《向前一步》早了两年。当时无论是纸质媒体还是网络上，关于女性在科技行业面临挑战的报道都少之又少。当我发现越来越多女性处于岌岌可危的境地时，我开始深入探究这些挑战，试图理解我们世界中偏见的根源。那时，在我自己的职业圈子里，我曾与
  50 多位男性和 13 位女性数据库管理员共事。经过快速研究（图 1-1），我发现我的一位前男性同僚已退休离开数据库管理行业，但女性同僚的情况则截然不同。与我共事的十三位女性中，有八位已经离开了技术行业。三人虽然退休，但都属于提前退休（五十多岁），其余人则转行进入了其他通常更多元化的领域。这些数字引人深思，我意识到自己必须深入挖掘，了解背后的原因。


  ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig1_HTML.png](img/469679_1_En_1_Fig1_HTML.png)


  图 1-1. 我数据库职业生涯中的同行业同僚史及女性同僚的消失


  天生的好奇心使我成为敏锐的观察者，但即使是自己的偏见也会蒙蔽你的双眼。我突然面对这个事实，意识到从我第一份数据库管理员工作起，偏见就已存在。当时我与另一位女性"黛比"同时被聘为数据库管理员，但我们两人都没有相关经验。黛比刚毕业，拥有计算机科学学位并专攻数据库技术。她单身未婚，没有孩子；而我已婚，有三个孩子（包括一个新生儿），并且没有任何数据库技术的学位或认证。她似乎凭借多年的正规教育迅速适应了工作，而我则全靠自己的天分和才智艰难支撑，希望没人注意到我对数据库知之甚少。黛比拥有技能，而我则是那个"假装直到成功"的人。


  入职九个月后，黛比找到我说："凯琳，我是一名在科技行业工作的黑人女性。这行真的干不下去，我决定转到项目管理团队去。"虽然感到惊讶，但我理解她离开的原因。我们的团队领导能力很差，而项目管理团队则由一位极具天赋且天生具备领导才能的女性领导。我记得自己当时想："如果她拥有所有这些优势都无法坚持，那我又怎么可能做得到？"我从宏观层面接受了她离开的原因，但并未将偏见的影响、女性在科技行业的处境以及多元化等因素纳入考量。我自己的偏见告诉我，这只是她个人的决定，而我的白人特权或类似的挑战与我的成功和失败毫无关系。




  ## 数字中的力量


  数据（图 1-2）显示，有色人种在科技行业中的占比极低。不分性别来看，黑人在科技岗位中仅占不到 3%，而西班牙裔占比不到 5%。^(¹) 美国国家科学基金会统计了那些拥有技术学位但从事非技术领域工作（或持有技术学位却处于失业状态）的人群数据，发现有色人种男性和女性的比例远高于白人男性。^(²)


  ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig2_HTML.jpg](img/469679_1_En_1_Fig2_HTML.jpg)


  图 1-2. 有色人种在科技行业中的未被充分利用


  我们科技界的许多人都已注意到缺乏多样性的问题，而不仅仅是行业中的女性人数稀少。当我开始在技术活动中演讲时，我注意到有色人种之间会相互联系，并且无论旨在促进多元与包容的举措看起来多么有力，有色人种似乎始终难以真正突破并实现代表性。


  这一挑战可能部分源于经济因素以及我们资助学校的方式（图 1-3）。除了有色人种面临更高的贫困风险外，学校的资金依赖于当地学区的房产税。如果一名学生已经身处低收入家庭，并且所属学区也属于低收入地区，那么该学区的学生人均教育支出从当地企业和房产税中获得的资金，将远少于那些税收资金更为充裕的学区。


  ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig3_HTML.jpg](img/469679_1_En_1_Fig3_HTML.jpg)


  图 1-3. 美国各学区学生人均支出


  学校资源有限，以及教育侧重点与劳动力需求之间的脱节（图 1-4），进一步加剧了这一挑战。1980 年我上高中时，学校提供了学习`Basic`编程语言的课程，以及计算机体系结构课程。三十年后，我的孩子们正在上学，然而仍有
  41 个州不要求高中文凭必须完成任何技术教育。


  ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig4_HTML.png](img/469679_1_En_1_Fig4_HTML.png)


  图 1-4. 空缺技术岗位 vs. 计算机科学毕业生


  在学校能接触到计算机课程的孩子，更可能学习的是办公软件技术（电子表格、文字处理文档和演示文稿），*而非*实际的批判性思维或编程教育。科罗拉多州是美国大学受教育人口比例最高的州之一，但我的孩子若想参加`Java`编程课程，就必须去职业学校学习。我所在学区的职业学校已经背负着“学业困难学生才会去”的污名，这对技术的未来意味着什么？


  美国劳工统计局预计，到 2020 年将有 140 万个新的技术岗位需要由熟练劳动力来填补，但根据计算机科学教育统计，美国届时大约只有 40 万计算机科学毕业生能填补这些岗位。^(³)
  教育的目的是为年轻人未来做准备，但如果我们继续将中等教育（读写算）的重点放在文学、历史和生物上，并将技术视为“社团”或“课后活动”，那么我们永远无法将技术作为未来就业核心来教授。有多少英语文学专业和历史专业的学生目前正在从事本领域工作或处于失业状态？我们教授文学、历史和生物，是认为学生可能有热情和机会将其作为职业。难道我们不应用同样的投入去教授技术，使之成为毕业的基石吗？鉴于未来十年我们对技术人才的需求比例，我们看待技术教育的方式必须改变。


  因此，我支持许多将技术带给公立学校系统之外孩子的草根项目。`Black Girls Code`广为人知，但亚特兰大由 Jeremy Harms 运营的`Vine
  City Code Crew`也是一个绝佳范例，它将编程带入城市中心的孩子中间——这些孩子可能因家庭低收入而无法在家中培养对编程的热爱，或因学校资源匮乏而错失机会。创始人
  Kira Wetzel 创办了`Girls + Data`（我最初是通过 Mindy Curnett 了解到的），该项目为女孩们提供了在更轻松的环境中学习编程的机会，培养未来的技术人才。寻找这些能让原本无缘接触技术的孩子了解技术的草根组织并不难。只需要在`meetup.com`上注册一个账号并进行搜索；随着越来越多人认识到培养技术创造者（而不仅仅是消费者）的重要性，这样的组织每天都在涌现。




  ### 科技——女性的舞台


  随着岁月的流逝，我发现自己从最初全是女性数据库管理员（DBA）的团队，逐渐变成了一个高级 DBA 团队中几乎唯一的女性 DBA（图 1-5）。


  ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig5_HTML.png](img/469679_1_En_1_Fig5_HTML.png)


  图 1-5. 我历任团队成员中的女性同龄人数量


  由于经济和个人需求，我需要独自承担抚养孩子的责任。而 DBA 这份职业，以其灵活的工作时间、补休制度和远程办公的可能性，正好能够应对孩子生病在家、家长会，以及作为单亲监护人所需处理的其他事务。


  当普通人想到技术专业人士时，脑海中往往会浮现两种相互矛盾的刻板印象：


  -   第一种是四十多岁、长发、衣着邋遢的男性，坐在黑暗里，面前摆着游戏屏幕、一袋奇多和一瓶功能饮料。

  -   第二种则是传统意义上的“书呆子”，穿着整洁但过时的衣服，胸前口袋插着笔，戴着一副黑框眼镜。


  这两种“刻板印象”都不符合实际情况。科技领域的多样性正在日益增长，并且与日俱增。也正因如此，技术工作听起来可能不像是一个有孩子的年轻母亲该待的地方。然而事实上，我发现我的数据库管理员工作，比大多数做护士或房产经纪的朋友，更能支持职场母亲的需求。如果我需要在周末或晚上工作，我通常可以在家办公。如果需要带孩子去看医生或参加家长会，也很容易安排，同样，待在家里照顾生病的孩子并同时工作也并非难事。随着技术的进步，这一切也变得越来越容易。在过去的十年里，我得以远程办公，最大限度地利用我的时间，减少了通勤，从而能更高效地服务于公司，也更好地照顾家庭。


  对于那些认为科技行业的工作就是每周工作 60-80 小时、必须第一个到办公室、最后一个离开的人，我想说，这并非因为技术本身是个糟糕的职业选择，而是因为这些例子代表了糟糕的工作环境和糟糕的领导力。这种情况并非不存在，但随着我职业生涯的成熟，我发现，与其说是追求工作与生活的平衡，不如说是找到适合自己的平衡点。


  我曾因需要远程办公或请假带孩子看医生，而受到同事和经理的严厉评判，他们质疑我对工作的投入。但我会提醒他们，关注我的工作产出效率，以及我（即使在承担家庭责任时）的**可联系性**。这才是重要的，这才是衡量工作表现和最终业绩的关键。有一种明显的偏见，将价值与每周的工作时长挂钩，但这是职场中一个巨大的谬误。如果你能在
  40-45 小时内完成另一个员工需要 60-90 小时才能完成的工作，那么哪个员工更有价值？如果一个在家办公的员工可以随时待命，那么每晚待到晚上 7-9 点又真的能提供什么价值呢？我们是在为生产力**与**“瞎忙活”赋予价值吗？我们都需要学会如何“面试”公司，弄清楚他们看重的是什么，因为这决定了你对工作、对职业、最终对公司业绩的满意程度。


  正如你所猜到的，我是弹性工作制的坚定支持者，特别是那些允许远程办公的。虽然面对面的交流对于同事、经理和客户来说价值巨大，但对于技术工作，有相当一部分是无需在办公室进行的独立工作时间。在这种时候，员工是被当作专业人士聘用的，也应该被如此对待，允许他们远程办公。这样做能为公司节省大量成本（比如工伤保险、办公空间和资源方面），好处并非单向的。不过，男女在申请弹性工作制时，所受到的对待存在差异。


  2017 年，福尔曼大学对 600 名工作年龄的成年人进行了一项调查。研究人员向受访者展示了一段他们认为是员工与人力资源部门之间的对话，并改变了对话内容，使其包含或不包含对弹性工作制的不同请求，同时改变了提出请求者的性别。有些请求与家庭无关，有些则是因为育儿需要。受访者需要根据“讨喜度”、“对工作的投入度”、“可靠性”来评判这些请求，并且假设自己是人力资源代表，是否会批准该请求。结果显示，受访者给男性的“讨喜度”平均打分为
  70%，而女性仅为 57%。他们认为男性更投入、更可靠，尽管请求的内容完全相同，只是性别被改变了。


  尽管研究清楚地表明，男性更有可能获得弹性工作制而不受同样的负面评价，但我却很少见到我的男性同事申请休假。相反，我更多是看到他们将家庭责任推给妻子，这样他们就能避免向老板申请弹性。我理解他们为什么这么做——开口请假确实令人不快。作为一个离异的家长，在我获得作为雇佣条件之一的弹性工作制之前，我很少能享受到这种“奢侈”。我的前夫往往指望不上，所以我承认，为了避免和他发生争执，我更倾向于寻找那些支持弹性工作制的公司。


  除了弹性工作制，薪酬也很重要，这对大多数人来说都是如此。正如我所说，我既是有经济责任的家长，也是监护家长，因此薪酬在潜在职位的考量中占据很高的比重。


  我花了很多年才学会如何争取在科技行业取得成功所需的条件。我先是学着争取让工作日更高效所需的条件，然后努力学会如何争取让生活更成功所需的条件，再之后才是我的职业生涯。我们通常能被赋予的许多改变，都必须“推销”给公司。让企业明白，投资于员工能为他们带来价值，这应该成为每份简历上突出且备受追捧的技能。




  ## STEM 领域的挑战


  2011 年对我来说是意义重大的一年。在“安”离开后，我开始联系许多我发现已经离开这个行业的女性。我与她们进行了一些坦诚、开放的对话，收集了她们对我疑问的回答，以了解她们离开的原因，并在存在文化模式时将其记录下来。其中一些同行已经准备好与我谈论偏见问题，她们似乎卸下了沉默的负担；而另一些人则对自己离开的原因讳莫如深。更常见的是，我发现她们和我一样，都被教导不要讨论偏见这个话题，我们也从未承认过它的存在。社会教会了我们如何巧妙地制造借口来为所发生的事情辩解，而如果我们真的对现实发出声音，就有可能被认为“不够酷”。


  科技领域的许多女性并不符合传统“邻家女孩”的模式。我们可能拥有古怪的特质、兴趣和行为，让人们试图理解我们行为的动机。为了应对这一点，我们仍然会落入一种预期的行为模式。我们变成了“酷女孩”，而不是简单地拥抱真实的自我；我们可能会假装喜欢运动、低俗的笑话和传统的男性消遣方式。由于我们热爱
  STEM（科学、技术、工程和数学）领域，我们那些更传统的女性同龄人可能会拒绝让我们融入她们的圈子。每个人都渴望被喜欢，因此我们自然会尝试找到一个能被接纳的群体。如果我们的同性群体不接受我们，我们就会做出让步，以符合周围男性最认可的“不像其他女孩”的酷酷形象。我们常常会选择更男性化的消遣方式，并表现出较少的女性特质，这能在一定程度上保护我们免受不必要的好意。无论我们偏离这一切有多远，我们仍然是文化和偏见的产物。尽管我们喜欢声称自己独立自主，但自我们从子宫中娩出的那一刻起，我们就被塑造了——被穿上蓝色或粉色的衣服，被给予男孩或女孩的玩具，男孩被告知不要哭，女孩被告知她们有多漂亮，这一切甚至发生在我们学会爬行之前。


  这些数字是惊人的，并且随着我们阅读本书的各个章节，这些数字还会累积增加。在文化和偏见之间，存在着一个持续的关于接纳的挑战。但得益于过去几年的行动倡议，我已经从少数敢于直言的人之一，变成了定期发声的数千人之一。有了所有这些倡议，许多人担心数字并没有像预期的那样增长，但当增长停滞时，我并没有感到太惊讶。我在为他人提供指导方面非常成功，但这从来都不是传统的指导方式，而且鉴于我们起点很低，这在这个阶段根本无法自我维持。就像一棵小树苗，它需要呵护和滋养才能成长为更强大的存在，直到它拥有足以支撑自己的根系和坚实的基础。


  我希望这本书能向其他人提供洞见，告诉他们如何以女性所需的方式指导她们走向成功，同时也能展示出赞助、建立人脉以及给予女性那些我们周围人常常避而不谈的选择是多么重要。在文化上，男孩们被培养时不仅掌握了“技能”，还获得了这些重要的机会；而女孩们则只能自己摸索，独自前行。女性几乎不知道如何从专业同行那里获得赞助，她们更可能被教导的是如何调情。我们被指导如何吸引别人的注意，却没有学会如何建立人脉、构建关系网络来促进自己的职业发展。我们因“被看到”而获得奖励，而非“被听到”；我们被教导在商界要学会积极倾听他人发言，而正是这些人，在奇怪为什么我们不更频繁地发言。我们没有接受过如何在这些未知的商业领域取得成功的教育，同时却又经常被告知，我们的一些最大优势在商界反而是劣势。


  幸运的是，我一直是一个尊重数据甚于观点的人。并不是说我不重视经验，恰恰相反。我对各种情况有着极其敏锐和准确的直觉，但总是用数据来确保我的观察不会因为我自己或他人的偏见而变得盲目。这种观察技巧让我以及那些前来寻求我见解的人受益匪浅。这也是一项用于审视技术环境的技能——不遗漏任何信息，收集所有数据来理解复杂的状况。由于偏见往往是无意识的，我自身的成长背景、性别和经历可能会蒙蔽我的视野，因此在做出决定、制定行动计划或提出解决方案之前，收集数据并进行研究至关重要。


  正如我所说，当我最初注意到有如此多的女性同行正在离开这个行业时，我开始进行研究。令人惊讶的是，2011 年可用的数据非常有限。我常常不确定该研究什么，但我知道在我的观察中，一些模式正在形成，而它们背后一定有原因。


  斯坦福大学的性别研究网站以及随后雪莉·康奈尔的 TED 演讲，提供了最早的数据来解释我所熟悉这些模式。该网站上的文章是最早以科学的方式记录性别偏见的研究成果之一，提供了与我开始记录的模式相匹配的数据。我很欣赏雪莉的演讲，因为她以教育大众为基础，用科学的方法审视数据。她的演讲发人深省，数据也令人难以忽视，即使有很多人难以接受。这是一个宏大的话题，所以我并非要强加于人，但始终愿意讨论。专注于教育和开放对话的最大积极面之一，就是有越来越多的人想要参与这些对话。


  挑战存在着显著差异，这不仅取决于文化，还取决于地域。我住在科罗拉多州，该州女性离开科技行业的比例远高于全国平均水平，尽管我们拥有全美最高的大学学历人口比例之一。全国平均水平是女性在职业生涯的
  4 年内会离开科技行业，而科罗拉多州则不到 4 年。犹他州是我们的邻州，但由于地理位置和文化的不同，那里一个用户组的女性主席并不太担心如何留住科技领域的女性。她最大的挑战是让女性接受高等教育，因为那里的许多女性被期望大学一毕业就结婚。这种差异是文化性的，因为两州之间不仅存在教育差异，还存在宗教差异。




  ## 意外踏入技术之路


  我在近 30 岁时才进入技术领域，那是 20 世纪 90 年代末，正值数据库职业发展的黄金时期。我毫不羞赧地承认，自己并没有计算机科学学位。由于一种疾病影响了我
  20 多岁头几年的生活，我几乎没有什么大学学历可以倚仗。


  22 岁那年，我开始出现奇怪的偏头痛，这与我从十几岁起就患有的偏头痛模式不同。这些新的“偏头痛”大约每六个月发作一次，带来一种碾压般的剧痛，常常像刀割一样从大脑右后侧向上蔓延，并伴有麻木和视力丧失。视力丧失主要在左侧，活动能力也同样受损。疼痛会持续几个小时，一旦消退，我便无精打采，会睡上一两天。由于看医生费用高昂，而当时我是一名审计员，经济上并不稳定，而且保险对许多项目都有免责条款，除非万不得已，我都不愿就医。


  经历了数次这样的偏头痛和两天的昏睡后，我意识到左眼视野仍缺失了大约 10%，这足以让我去寻求专业医疗帮助。我被转诊给一位神经科医生，他为我做了核磁共振后，告知我患过中风，而且这已经不是第一次了。那
  10%的视力缺失是永久性的，但我的“中风”并非典型类型。大多数中风是由高血压和血管堵塞引起的，然而血液检测显示我存在出血问题，而且血压极低。进一步的血液检测发现我自身免疫抗体呈阳性，于是风湿免疫科医生也加入进来开始研究。


  在接下来的四年里，我经历了五次确诊的中风。到 1993 年，医生告诉我，最好的情况是到 40 岁时失明，最坏的情况则是死亡。我立即寻求了第二诊疗意见，幸运地找到了一位对查明病因感兴趣的神经科医生。而自身免疫性疾病的特点就是，每个人的病因都独一无二。对我来说，1994
  年底生下第一个儿子的孕期，在很大程度上给出了答案——它让我进入了缓解期。当我的自身免疫问题在 2004 年再次出现时，起初与关节有关（类似类风湿性关节炎），到
  2014 年则定型为结缔组织病，但再也没有回到过去那种使人衰弱的血管疾病状态。


  不过，那些年来的中风还是对我造成了严重损伤。我缺失了近 9 年的记忆；左眼视野失去 48%，需要接受语言和物理治疗，并且再也无法胜任之前的审计员工作。在脑子恢复期间，我仍需谋生，于是去了
  Kinney 鞋店工作。是的，我在零售店卖鞋。我在接受物理治疗的同时慢慢康复，而我的语言模式也受到了影响，所以还需要进行语言治疗。如今大多数人看不出来，因为我是一名专业演讲者，但我的“大脑词库”仍有些问题，有时会念错一些单词。请对我多一点耐心——考虑到我已经取得了多大的进步，这根本不算什么。除了这一点和我的视野缺失外，几乎看不出二十多年前我经历过什么。


  然而，康复之路并不简单。我记得 25 年前在鞋店工作时，坐在一堆鞋子前，需要按尺码把它们整理到鞋架上。这个简单的任务花了我好几天。我非常沮丧，因为我脑子里就是想不明白怎么先把
  5 码放好，然后是 5.5 码，接着是 6 码，如此类推。关键在于，我向来非常执着。有老板说我固执，有时甚至有点偏执，但这在我中风康复过程中帮了大忙。我只是拒绝放弃，不断尝试，最终把整个鞋架的鞋子都按顺序放好了。在我大脑恢复的过程中，我以这种方式应对每一个挑战，虽然第一次很少成功，但拒绝放弃，坚持到底。


  我前面的路还很长。我年轻时学到的所有知识都荡然无存。我必须重新学习开车，方向感也受到了影响。我们就不提有多少次我发现自己到了城市*相反*的一边，而不是我要去的地方了——如果你对丹佛有所了解，就会知道这是一座非常容易辨认方向的城市。只有西边有山，而且几乎在任何地方都能看到它们。我很难回忆起自己当时为什么连方向都分不清。我也不会再记账或使用其他学过的基本技能了。就像整理鞋架一样，我不断尝试，直到最终成功。


  伴随记忆的丧失，在最后一次中风大约六个月后，我的脑雾开始散去。我发现自己嫁给了一个我几乎不记得曾约会过的男人，更别提结婚了，而且我当时已怀第一个孩子五个月。我努力康复，变得独立，并在最后一次中风后不到一年就成了单亲妈妈。这本该是一个令人恐惧的前景，但我想我当时太忙于每天在小事上取得成功，以至于无暇过多考虑自己冒的风险。现在回顾过去，我敢肯定地说，没有什么比当时的情况更令人望而生畏了，这可能也是我现在看起来如此无所畏惧的原因。


  随着大脑的恢复，我从卖鞋转而到 Circuit City 卖电脑。公司发现我有软件天赋，于是我开始做桌面支持。我后来与两个年幼孩子的父亲结了婚，他建议我去 US
  West（现为 Centurylink）做一名桌面支持专家。他明确表示我已经准备好了，因为他手下的“一些人年薪 4 万美元，却连在`C:/`提示符下加载微软 Windows
  都不会。”我以一名桌面支持人员的身份开始了工作，毫无网络或办公室环境的工作经验。与现在一样，我接手了别人都不愿碰的挑战，而这些挑战恰好是数据库应用程序。似乎很少有人具备这方面的专业知识，但我阅读了所有能找到的资料，并努力靠自己解决问题。当时
  Oracle 还是 16 位版本，7.3.4 版刚刚发布。我发现一个荒唐的现象：如果使用不同版本的多个 Oracle 应用程序，用户居然需要在不同的工作站上运行每个程序。我找到了一种方法，通过切换
  Windows 95 中的`win.ini`文件来改变 Oracle 目录的路径，从而实现了他们声称不可能做到的事——一个工作站运行多个 Oracle 应用程序。Oracle
  公司询问能否派代表来审查我的脚本和配置，审查完成后，他们向 US West 的首席技术经理建议“把她培养成 DBA”。




  '
- '# 2. 女性在科技领域面临挑战背后的复杂性


  我当年在为多家公司工作、推进职业生涯时，丝毫未曾预料到 15 年后自己会为甲骨文效力。我的职业生涯带来了绝佳机遇，让我能与业界优秀的人才、导师以及我崇拜的偶像共事。它教会我如何避免早年经历过的某些陷阱，而我所学到的坚韧、导师的指引以及他人的赞助支持，正是我能在科技领域持续成功、而他人却错失机遇的关键所在。我的亲身经历、他人愿与我分享自身故事的能力，以及我收集的数据，让我对女性在科技领域（WIT）面临的挑战与机遇有了极为宏观的认知。


  我从所有经历中学到的是：万事皆有因，每个挑战都蕴含着益处，而单纯的“行动”本身就蕴藏着巨大的力量。


  我本人有着奇特的病史和非传统的科技领域入行经历，这也从多方面说明了为何这些故事需要被分享。该领域的大多数人并非拥有计算机科学学位的大学毕业生。事实上，他们更可能来自多元背景，或是被发现对科技有天然亲和力，又或是出于需求满足而成为了“意外踏入科技领域的人”。每个人都是复杂的生命体，要理解他们各自是谁，需要围绕性别、成长背景和文化进行深入探讨，并且必须包含研究数据。我在此的目标是坦诚探讨这些话题，讨论我们是成长背景、经历和所获机遇的产物，以及这些因素如何决定成功与失败之间的差异。


  脚注 ¹ ² ³


  ## 女性在科技领域面临挑战背后的复杂性


  我很想说，我们对科技领域女性及信息问题所有挫败感的简单根源在于性别，但实际情况比这更复杂。一部分人会告诉你，男性和女性在生理上存在差异，这就能解释一切。尽管他们关于差异存在的观点是正确的，但研究表明，考虑到所有差异，最终数据并不足以解释我们今天所看到的巨大排斥鸿沟。


  科学研究已证实，男性比女性拥有更多的灰质。同时，这些研究也证明女性比男性拥有更多的白质。^(⁴) 灰质用于从视觉、肌肉控制到决策等一切功能，而白质则用于加速突触间的连接。这导致女性的神经连接比男性传导更快，尽管男性拥有更大量的灰质——科学家用此来解释为什么男性和女性的平均智商总体相当。神经回路图谱显示，女性左右半球的连接远比男性更紧密，而男性的前后连接则更紧密。虽然男性在协调和感知任务上通常优于女性，但女性在复杂的社交情境和多任务处理中能更有效地互动。对于男性大脑优越的每一个领域，科学家都在女性大脑中发现了相应的补偿性平衡特征。


  ### 失调还是动态？


  以注意力缺陷障碍（ADD/ADHD）为例，[研究](https://www.understood.org/en/learning-attention-issues/child-learning-disabilities/add-adhd/adhd-in-girls)^(⁵)表明，男孩和女孩受到的影响不同，因为颞叶活动低下的影响非常显著。问题不在于医学专业人士认为女孩患
  ADD 的可能性更小，而是由于大脑生理差异对症状的影响以及文化期望，导致女孩被诊断的频率较低。


  我在家中三个女孩中排行老大，也是我们这一代第一个出生的女孩。任何熟悉出生顺序研究的人或许更能理解，是什么在驱动我、让我较少受到多动症（ADHD）挑战或行业其他女性经历的影响。


  长子/女更可能模仿父母，并对自己抱有很高的期望。^(⁶) 我从一开始就表现出多动症倾向，高度活跃且容易分心。我提出很多问题，当答案不能满足我时（我的母亲经常被我无休止的问题惹恼），我会无畏地自己去寻找答案。


  ### 男孩更有趣


  我记得和我的年长表哥们一起玩耍，努力跟上他们的节奏。他们和我妹妹们一样，身材高大，浅棕色头发，蓝色眼睛。而我身材娇小，坐不住，渴望做他们正在做的任何事情。我们在密歇根湖沿岸的密歇根上半岛乡村长大，夏季有大量时间在户外活动。如果男孩们要挑战对方站在小溪里，看谁能在冰冷的水中坚持最久，那我也会加入。这种竞争性游戏和其他冒险活动，常常让大人们为我——一个在这些大男孩中的小女孩——担心。我记得他们忧心忡忡地喊我，不让我跟着男孩们干那些事。我会不停地问为什么我不能玩和他们一样的游戏，直到他们被问烦了，丢下一句“因为你是个小女孩。”
  这种情况频繁发生，让我将“女孩”与“受限制”联系在了一起。到五岁时，我记得我想成为一个男孩，因为那似乎就是自由和乐趣的代名词。


  ### 邻家女孩


  作为三姐妹中的老大，我有两个妹妹，很幸运，但中间的妹妹是邻家女孩的理想形象。我的妹妹克丽丝蒂留着金色长卷发，蓝色大眼睛，她周围的成年人很快就将她视为女孩应有的完美典范。她是一个甜美随和的孩子，比她那个精力旺盛、留着深色精灵短发、充满好奇心的姐姐更坐得住。我很快注意到大人们如何称赞她漂亮的金色卷发和随和的性格。我意识到她在成长过程中有多么轻松——她仅仅通过自己的外貌和行为就满足了他们的期望。她是我们的《小妇人》中的艾米，^(⁷)
  随着我们长大，我对她得到的关注愈发羡慕。


  事实是，草总是那边更绿。文化可能对我们抱有期望，有些人自然更能适应，但这也有其弊端。克丽丝蒂在 43 岁时被诊断出癌症。她从一个健康快乐的母亲（有两个孩子）和妻子（有一位爱她的丈夫），迅速意识到她原本设想孩子离巢后实现梦想的承诺，很快就被这种毁灭性疾病扼杀了。我们深入谈过她对未来的期望，尽管她的未来正在迅速消逝。她告诉我，有一个出版过不止一本书的姐姐和另一个正在攻读硕士学位的妹妹，让她意识到，无论她多么热爱自己的生活和家庭，她有一些梦想被搁置了，因为文化教育她要把一切置于自己的欲望之前。


  正如她身边如此多的女性一样，她只是在许多方面遵循着文化对我们的教导。我们听到，自己的梦想常被视为自私，而我们要做的是照顾周围的人。“Carpe diem”（抓住当下）这句格言，在意外降临时变成了未兑现的承诺。克丽丝蒂在确诊后仅仅
  100 天就去世了，她永远不会被遗忘，但梦想却未能实现。她的离世，让我找到了更强大的内心力量，也让我对童年时代不肯安坐、驱使我竭尽全力取得成就这件事，再无任何遗憾。




  ## 非主管的“超能力者”


  我无法安于现状，这驱使我去承担比许多同龄人更繁重的工作量。我并非在与他人竞争，我只与自己较劲，但对某些人来说，他们很难不把我视为竞争对手。我喜欢忙碌，并且极度厌恶无所事事。比起无事可做，我宁愿做些乏味的任务；而患有
  ADHD（注意力缺陷多动障碍）意味着，只要有机会，我就乐于接受有挑战性的工作。哪个雇主不想要一个积极高效、热爱忙碌的员工呢？管理层了解每位员工的工作量至关重要，但我们这种家长式的工作环境，却可能让能力不足的领导者挑拨员工彼此对立。这引发了女性在行业内最常见的一些抱怨。


  除了创意或工作成果被他人据为己有，大多数从事科技行业的女性，其表现水平都高于同龄男性同事，然而这些男同事却更有可能获得晋升、加薪和更高职位。^(⁸)  我指导过的一位女性喜欢说：“平庸的女性没有立足之地。”我可以证明，我身边职场女性的能力都非同凡响。即使像我这样直言不讳的人，也多次在事实上扮演着“主管”的角色，却既无正式头衔也无相应薪酬。当我指导过越来越多行业内的女性后，我才恍然大悟：这并非个例，而是其他女性同样普遍面临的境遇。


  尽管这些女性在履行相关职责，并且通常比她们的男性同行做得更好，但到了提拔某人进入领导岗位的时候，她们却被忽视或跳过。这些故事显示出明显的偏见：做决策的管理者要么不把女性视为领导角色，要么想当然地认为女性对管理人员不感兴趣。


  这种偏见的另一种表现形式是：认为女性愿意“自愿”做更多工作，或者想当然地认为她们甘愿默默付出，而男性则更倾向于设定界限，除非有明确的晋升或经济回报预期。^(⁹)  由于我们对女性抱负的不适应，即使女性真的设定了这些期望，也可能会招致怨恨，或被贴上“不讨喜”或“难以管理”的标签。^(¹⁰)


  对女性而言，设定期望并识别出何时被分配了超出职责范围的不公平责任固然重要，但当她们试图这样做时，却如同一把双刃剑。这就像走钢丝，我们需要小心翼翼，确保在划定这些界限时，不会触发任何人的偏见，也不会因设定边界而遭遇怨恨的反噬。一旦确定管理层愿意坦诚对话，就很有必要通过比较你与男性同事被寄予的期望，来辨明这种要求上的差异是否源于偏见。在这种情况下，你可以向管理层提出以下一些礼貌而直接的问题：


  *   “我和 XXXX 的职位相同，应该承担类似的工作任务，对吗？”


  *   “你会把这个<行政任务>分配给 XXXX 吗？”


  *   “对于我未能获得那个<技术性或高规格>项目，您能否给我一些建设性的反馈？”


  不带指责地询问经理，请他诚实地审视分配给你与其他团队成员的任务。如果你担心自己的情绪会泄露这次谈话有多么令人困扰，那么在去找经理谈话之前，先找一位值得信赖的朋友或同事进行角色扮演演练。


  如果讨论的是你正在履行某个岗位的职责，但一位男性同事却被考虑晋升，以下几点或许会有帮助：


  1.  事先做些研究，弄清楚你是否在流程的任何一个环节曾被考虑过。如果没有，就问原因何在。这可能只是一个简单的疏忽，当然，也可能是偏见所致。


  2.  弄清楚你的男性同事为什么被考虑。通过一次对话，对情况的解释可能会让管理层意识到之前的疏忽。与管理层冷静地沟通，或许能帮助他们认识到你也是一个候选人。


  3.  一如既往，目标始终是教育和达成目标，而非追究责难。如果你感觉自己变得越来越沮丧，可以考虑先感谢他们的时间，待自己整理好思绪后再重新讨论此事。




  ## 孤独之地


  根据任何一份特定女性科技从业者调查所涵盖的岗位，女性仅占技术职位的 13% 至 26%。^(¹¹) 由于团队通常由四到五人组成，这往往让女性技术专家成为团队中唯一的女性。作为群体中的少数派，一般的科技工作氛围比其他大多数部门显得更缺乏吸引力。在我们努力让更多女性进入科技领域的同时，这一现实目前可能让这个地方对女性而言显得格外孤独。我非常感激我的男性同事，但我发现，拥有女性同事能提供男性同事很少能给予的互动。对一个全男性团队而言，工作场所中的同事情谊优势是任何福利都无法弥补的。


  由于我们处在一个父权社会，女性的需求历来由他人决定，而当我们今天成为某个行业的少数派时，这种影响仍有所残留。许多人声称女性天生不倾向于科技领域，但如果我们回顾早期的
  STEM 教育，就会知道这并不成立。如果我们想理性地看待这个问题，还需要审视家用电脑曾经的营销方式以及科技职场氛围。


  大量数据表明，在企业计算兴起之初，计算机工作被视为“行政性”工作，因此由女性承担。即便当时女性在劳动力中所占比例极低，1960 年仍有 27% 的女性从事该行业。这一切在
  20 世纪 80 年代发生了改变，随着家用电脑成为现实，电视上开始出现面向男孩推销电脑的广告。到 1990 年，计算机科学领域的女性比例约为 35%^(¹²)；而
  20 年内，这一比例下降至如今的不足 20%。图 2-1 展示了 STEM 职业中女性比例随时间的变化。


  ![../images/469679_1_En_2_Chapter/469679_1_En_2_Fig1_HTML.png](img/469679_1_En_2_Fig1_HTML.png)


  图 2-1. 1965-2014 年女性在主要职业中的增长情况。数据来自 [`https://www.npr.org/sections/money/2014/10/21/357629765/when-women-stopped-coding`](https://www.npr.org/sections/money/2014/10/21/357629765/when-women-stopped-coding)


  当科技席卷全国并纳入教育体系时，它并未被分解为批判性思维、语言和电子学，而是被捆绑成一个复杂的学科。女孩从小就被教导，聪明是一种竞争，而男孩不喜欢与她们所吸引的对象竞争。^(¹³)
  到八九岁时，这一点便体现在年轻女孩对其 STEM 教育技能的看法上，表现为否认自身能力并犹豫不决。问题不在于她们做不到，而在于“女孩不擅长数学”这一观念的积极强化和持续反馈。这种反馈常被认为是导致女孩尽管在多项研究中数学和科学成绩优于男孩，却仍声称自己能力较弱的原因。


  与此同时，有科学数据显示，女孩在学习新语言时表现优于男孩，但几乎没有研究解释为何她们在计算机语言学习方面同样不出众。^(¹⁴) 我们也可以从先前女孩在数学教育中取得成功的相关数据推断，由于该语言被归类为科学或数学的一部分，因此对成功可能性的预期会影响最终结果。


  关于女孩如何学习以及我们如何教授编程的研究，促使像“女孩编程”（Girls Develop It）和“黑人女孩编程”（Black Girls Code）这样的团体致力于改变文化对女孩接触编程的影响，以及计算机语言的教学方式。它们更新了“女孩不擅长数学或科学”的陈旧偏见，重新思考
  STEM 教育的授课方式，并时常消除其中的文化偏见。这些项目的[成功](https://www.wraltechwire.com/2014/04/15/girl-develop-it-rdu-is-a-huge-and-growing-success-14415/)^(¹⁵)
  不言自明。“黑人女孩编程”的创始人[金伯利·布莱恩特](http://www.blackgirlscode.com/about-bgc.html)^(16))
  不断分享着与我自身经历以及我认识的几乎所有科技女性相似的故事，这些故事正是该项目的推动力。这些项目旨在以更符合女孩学习方式的方式教授技术，项目更注重协作，而不是将孤立编程作为初始学习方法。“女孩不擅长数学”之类的偏见在这些团体中不被接受，因为所有参与者本身性别相同，性别因素便被排除在方程之外。


  我曾注意到许多来自中东和印度国家的女性，她们的 STEM 技能远超美国女性。当我质疑这些国家的教育体系是否远胜于美国时，却找不到相关数据。一个持续出现的趣闻是，即便在她们祖国存在强烈的针对女性外出工作的文化偏见，这些女性也常常在与男性同伴分开的学校就读——这让我想起了“女孩编程”和“黑人女孩编程”项目的成功。那些在性别隔离环境中长大的人推测，这消除了课堂上与男性同伴的竞争挑战，使她们只需与女性同伴竞争。我注意到，她们专注于高等数学和科学导向的中等教育，更少担心男性同学对她们的看法，而更多关注如何作为成年人从教育中获益最大化。当男孩们正在形成自身竞争天性时，移除他们早期竞争方式带来的文化影响，似乎促使这些女性在成为年轻成人后更加坚定自信。这证明了我们不同文化之间的偏见差异，以及这些差异如何影响女性的教育质量。



  ## 福利部门


  教师岗位可能会宣传对在职父母有吸引力的福利待遇，因为人们知道大多数教师是女性且处于育龄。如果你去问硅谷的普通专业人士，一份技术工作最理想的福利是什么，你很可能会听到以下回答：


  -   休闲星期五

  -   游戏室

  -   欢乐时光或精酿啤酒时间

  -   豆袋椅或其他休闲坐席区

  -   零食和饮料


  上面的清单读起来像是游戏玩家的梦想，但对普通职场母亲来说并非如此。大约在 2009 年，这是任何希望吸引顶尖技术人才的公司都会提供的清单。人力资源部门已经开始摆脱这种刻板印象，但很多时候，IT
  管理层和 IT 团队并没有。由于男性在该领域占主导地位，福利自然主要面向大多数人。我上一家公司的本地办公室仍然有零食间、啤酒冰箱和游戏室。男同事们每周至少去玩一次飞盘高尔夫。团队氛围很好，但办公室里的少数女性几乎总是与这些活动格格不入。我是一个常被排除在外的“怪女人”，因为我在科技行业摸爬滚打二十年后，已经明白这类社交的重要性。我也承认，刚入职时我曾把技术支持经理误认为是办公室经理，因为我只收到她发来的邮件，通知我们她订了什么零食，或者完成了哪些行政工作。我感到很糟糕，因为我自己的偏见和知识并没有让我避开这个问题。我不明白为什么这些任务会落到她头上，但正如我们所知，这类任务可能被视为行政工作，而女性很可能会被分配这些任务，即使她的职位头衔本应有所不同。


  公司开始认识到技术员工性别多元化的价值，并利用不再局限于传统的福利待遇来吸引更多女性。^(¹⁷) 零食正从刻板的程序员/游戏玩家类型的奇多和功能饮料转向健康选择（谢天谢地，男同事们也同样支持这一改变）。团体外出活动设计得更具包容性，让所有人都能参与，我们也看到健身房会员、多元化团体、哺乳室等福利的出现。


  我们看到更灵活的工作安排，以及根据生产力而非在办公室的时长来进行绩效评估。最大的挑战是让管理层接受这一点，因为男性同事发现，他们和女性一样欣赏更好的工作/生活平衡和更健康的选择。这从来不是为了剥夺那些已经在职的人的利益，而是为了向那些从一开始就应该被包括在内的人表示欢迎。


  ## 从一开始


  虽然我已经谈到了成长环境和性别，但我们是否意识到，我们甚至在出生之前就被性别所定义？随着医学的进步，父母很少会对孩子的性别感到意外。有了这些信息，我们用粉色和蓝色装饰育儿室，购买具有性别区分的玩具，并根据我们孩子的性别预期，以不同的方式与他们互动。


  有一部很棒的[视频](https://www.youtube.com/watch%253Fv%253DnWu44AqF0iI%2526feature%253Dshare)，^(¹⁸)
  其中两个小孩穿着与他们的性别相反的服装。在与他们互动的大人面前，完全没有提及幼儿的性别。孩子们被放在一个摆满各种玩具的房间里，结果反复发现，大人们会把汽车和卡车递给“男孩”，并以更多肢体活动的方式与“他”互动。“女孩”则被递给洋娃娃，互动方式也更具养育性。他们也用更温柔的语气与他们认为的“女孩”说话。如果“男孩”摔倒了，大人会建议他自己站起来，拍拍身上的灰，而“女孩”则常常得到帮助和安抚。


  当大人们得知孩子们的真实性别时，他们明显感到惊讶，并且意识到自己与每个孩子的互动方式有多么不同。他们没有意识到自己根据*认为*的孩子的性别而产生的性别偏见和选择。我想起我的二姐在成长过程中受到多少关注。我很瘦，留着黑色短发。我表现得更像男孩，更可能坐不住，典型的
  ADHD 代表。我的妹妹则是小女孩模范行为的缩影。她有着金色的长发和蓝色的大眼睛，能够安静地坐着而不必经常被责骂。当我们和妈妈一起外出时，人们会走到我们面前，很快就把注意力集中在
  Kristi 身上，告诉她她是个多么漂亮的小女孩，接着常常会有人评价说我妈妈“有幸生了两种不同类型的孩子”。这是一种委婉的说法，意思是一个孩子符合他们对女性性别的期望，同时又没有冒犯另一个不符合期望的孩子。


  有趣的是，我妈妈在成长过程中大部分时间都和她父亲在一起。我理解她和他的联系，因为他是我最喜欢的约瑟夫爷爷。她最好的朋友是一个也想成为男孩的小女孩，一有机会就穿男孩衣服。她的成长经历造就了一个展现出更男性化沟通风格的女人。如果你问性别怎么能和沟通挂钩，我们先引用一句话：


  > **男人互相侮辱却并不当真。女人互相赞美却并非真心。**


  上面这句话描述了男性和女性如何以不同的方式建立社交和联系。当男人讨论体育并成为朋友时，他们会用女性通常不会用的方式戏谑地互相侮辱。我丈夫是三个男孩中的老二。他讲了一些他们之间互相搞的恶作剧。听了这些故事后，我不确定大多数男孩是如何平安长大成人的。关于恶作剧、侮辱和相互挑战的故事数不胜数。有些故事会让他妈妈担心，但俗话说，“男孩子就是男孩子。”
  这种行为有多少是由我们抚养他们的方式差异造成的？


  当一个女人遇到另一个女人时，传统的女性沟通者会赞美对方的容貌或衣着。“我喜欢你的鞋子！” 或者“你的发型太棒了。” 我也有男性化的沟通风格，当女性赞美我的外表时，我仍然会给出尴尬的回应。我会怯生生地说谢谢，但这种女性化的社交方式不是我从小熟悉的。我曾经是个笨拙的孩子，成长过程中女性朋友不多，而且如前所述，我妈妈不会用这种方式与其他女性沟通或社交。来自母亲的赞美转瞬即逝，少之又少。这些赞美是大多数女性被教育用来彼此联系的方式。如果一个男人走近另一个男人说：“喜欢你的发型”，对方的反应通常会非常尴尬。这种沟通风格也导致女性更习惯听到赞美，但在互动中接受批评的准备不足。当批评反馈不具备建设性时，对女性来说可能意味着某人不想与她们建立联系或社交，这也是为什么我们常听说女性更敏感。真相可能更复杂，因为我们在文化上倾向于将赞美作为一种社交方式。另一方面，男性在应该接受有价值的建设性批评时可能学不到东西，但当处于对立位置时，他们更可能泰然处之。这是一个我们两个性别可以互相学习的沟通领域。




  ## 直截了当，但不要过于直白


  母亲随着年龄增长变得温和了，现在她常会告诉我们她爱我们。但我觉得，小时候我更多的是让她感到疲惫，而非愉悦。她那种务实直率的沟通风格，带来了一种生活哲学：**“用心去感受，用头脑去思考，说出你的真实想法，不要把这两者混淆。”**
  尽管她觉得我需要说出真实想法，但母亲对大多数事情似乎都不愿发表意见，这让我只能自己摸索。而这也恰恰教会我，我的直觉比周围任何人都更准确，并让我学会相信自己——当你在专业团队中属于少数派时，这是一种巨大的力量。


  “直觉”这个词在职场中会引起各种有趣的回应。我从不否认自己拥有强烈的直觉，但我常常思考，为什么在讨论男性时，我们更可能说他们“相信自己的直觉”（trusting
  their gut），而形容女性时，对同样甚至更敏锐的能力，却用“直觉”（intuition）这个词，仿佛它是虚无缥缈的东西。我的直觉，不过是我对情境和他人高度敏锐的观察力。我获取信息，并能看到全局，但如果有人想贬低这种能力，就会称之为“直觉”；而当他们想认可一位男性同事的类似能力时，就称之为“本能”。这往往源于我们不信任女性。向人们指出这类偏见非常重要——不是以对抗的方式，而是作为讨论，要认识到贡献者的价值正被区别对待。


  我们确实不信任女性。已经有[文章](https://www.huffingtonpost.com/damon-young/men-just-dont-trust-women_b_6714280.html)^(¹⁹)收集数据并记录了这一现象，探讨其成因。我们常常告诉女孩，从很小的时候起，她们就是在“反应过度”或“情绪化”。男孩被教导要压抑情绪，而我们却向女性解释，她们天生就是*感性*而非理性或逻辑的，并且她们的情绪在任何情况下都显得夸张。


  男性从小就被教育要为自己的信念和言论挺身而出，这是“信任男人说的话”这种旧习的遗存。而另一方面，女性却经常被要求分析和自我怀疑：


  *   “你觉得你是不是反应过度了？”

  *   “你觉得你是不是误解了他/她的意思？”

  *   “你为什么不给他/她一个机会？”（这通常发生在女性对自己接触的人做出判断之后。）

  *   “你确定你听对了吗？”


  我坚信，这就是为什么研究发现女性比男性更容易患上“冒名顶替综合征”，以及为什么她们被认为不够果断的原因。^(²⁰) 我们告诉女孩要怀疑自己的诸多想法和决定，难怪她们总是自我怀疑。


  ### 相信自己


  如我所说，我天性孤僻。我喜欢特立独行，我的直觉敏锐地告诉我，什么时候问题是别人的，而不是我的错。随着我磨练这些技能，它在我成长过程中给了我巨大的帮助，我开始相信自己胜过任何人。这也需要足够自力更生的能力去独自前行。我学会了享受独处，而不是渴望那些可能质疑我自信的人的陪伴。这带来了一个有趣的效果——我更能抵御欺凌，并且倾向于为身边的人挺身而出。


  当我面对那些偏见更深的人时，如果我雄心勃勃地努力达成和男性同事一样的目标，他们的不适感很快就会暴露出来。公司可以选择建设性地处理这个问题，也可以任由其演变成霸凌。我都经历过。我无意主动与霸凌者挑起对抗；我只是按照我认为能为公司创造最大价值的水平去工作，但当霸凌者的行为倾向被发现时，通常为时已晚，无法避免冲突。请记住——我的意图是明确的，并期望他人也能以同样的方式回应。事实是，偏见是无意识的，它往往既让表现出偏见的人感到困扰，也让被针对的人感到沮丧。施害者通常意识到自己的行为有些不公或不正确，但由于偏见更为微妙，并且成长经历告诉他们这种偏见是可以接受的（例如，家庭中母亲全职在家的状况更好，或者女性在技术领域不如男性有能力），而不是他们亲身经历的那样，这会导致施害者将怒火发泄在目标身上，而不是向内寻找解决方案。


  不过，这也是解决这个问题的部分答案。它不是完整的解决方案，但你的处理方式可能有助于找到解决办法：


  1.  当你被要求分析或自我怀疑时，首先调查一下向你提出这个要求的人的动机。这通常是无意的，但你可能会发现其根源在于个人不安全感、对女性抱负的不适，或其他偏见。

  2.  认识到这一点后，你就可以得出结论，问题出在对方身上，而不是你，然后你可以根据情况，做出是否要继续进行下去的决定。仅仅知道这是别人的问题，并不能自动让你继续前进，但它应该促使你反思：是否有一个合理的理由，阻碍你实现下一步目标。

  3.  不要害怕就该挑战与对方进行坦诚的沟通。你应该能很快判断出，这是否是一个教育对方的机会，或者此人是否已拒绝成长。

  4.  如果需要第三方作为调解人，请考虑一位专注于发展和解决问题，而不是偏袒任何一方的人。

  5.  随着你的职业发展和成熟，你可能会发现自己越来越不在意、也必须越来越不在意他人的看法。雪莉·桑德伯格即使面对多数人的反对，也能坚持做自己认为正确的事，这比刚进入科技公司第一年的简容易得多。行动就是力量，你做得越多，成就越大，坚持做对的事，而不是别人对你的期望，就会变得越容易。

  6.  也要知道何时该离开。人们离开的不是公司，而是他们的经理。如果你经理的偏见限制了你的发展，那就去寻找一家拥有能促进你成长的经理的新公司。




  ## 协作杀手


  当我们因信任缺失和机会不足而难以成功时，偏见也可能导致协作匮乏。^(²¹) 有些男性可能仅仅因为社交尴尬而不太与女性同事合作，另一些人则会因不安全感而减少协作。由于女性常处于竞争环境中，我们可能会发现有些女性也不太愿意与其他女性合作。这种协作缺失不仅会限制学习机会，还可能影响职业发展、工作满意度，以及企业从员工个人潜能中获益的能力。在会议和电子邮件中，女性可能收到更少的反馈，甚至毫无回应，这导致女性发言减少。我亲身经历过这种情况，深知其存在。我曾多次加入邮件讨论，虽然同事之间互动频繁，但我却收不到任何回应或只有零星回复。有时我甚至需要向信任的密友确认，我的邮件是否被群组收到。我还发现自己更可能在线下或仅在一对一交流中获得回复。我注意到，这种情况往往发生在我提出技术解决方案时。这让我不得不承认，人们对于承认解决方案出自女性之手感到不适。


  这类互动常常导致女性在晋升和加薪时被忽视，因为缺乏展示其贡献的协作机会，她们在管理层面前变得"隐形"。^(²²) 既然女性本就被较少视为领导者，当她们解决问题或迎接挑战时得不到认可，科技行业就会产生更多"隐形领导者"。^(²³)


  史蒂夫·马丁说过："做到优秀，让他们无法忽视你。"但正如我们之前讨论过的，即使女性表现更出色，也可能比男性同事更不显眼。要克服这一点，我建议女性每周记录自己的工作成果。即使经理没有要求，也要将这份记录作为流程的一部分发送给他/她。如果对方询问，只需回答："没人知道我在做什么，如果有人问起你，我不让你了解我带来的价值，那就是我的失职。"这不仅是在为他们提供服务，也能为你自己创造可见度。


  不要害怕让别人知道你在做什么以及取得了什么成就。我们已经认识到，社会对女性的野心存在不适感。不久前，我参加一个演讲晚宴时被介绍给另一位演讲者。尽管我们在最初见面的环节中参与了多次技术讨论，他还是误以为我从事市场营销。基于我们互动中他已知的信息，这个假设显得很奇怪，但他随后确认道：鉴于我似乎了解这么多技术，我的技术背景一定很有趣，并问我做过什么。我简要介绍了自己的职业生涯，但等我讲完后，他说："嗯，我不像你那么擅长自我推销，但是……"显然，他对一个坦然面对自身成就的女性感到不适。同时，如果再有人问起，我依然会如此回答——这是他的问题，不是我的。我不需要他对我的经历表示认可。几个月后，我赢得了他的尊重，他对我也放松了许多。


  ## 向上攀升


  我的简历确实很有分量，但这得益于我在多个行业和技术领域的工作经历。


  如果我长期待在一家公司 5-10 年，我不可能获得如今的经验或视野。业界有位男性同行在向别人介绍我时曾开玩笑说："凯琳待不长……"因为我差不多每两年就接受新的机会。我会迅速纠正他，并反问：在薪水和经验上处于领域前
  1% 有什么不好？我将这个建议传授给我指导的技术专业人士——只在一家公司待 2-3 年，我有几个理由：


  1. 大多数公司不提供养老金，因此现有退休计划可以转入新公司。

  2. 技术日新月异，跳槽到新公司能提供新的学习机会。在一家公司有 10 年经验的技术人员，通常很难与在五家公司各有 10 年经验的人竞争。

  3. 平均加薪幅度为 2-7%，而新公司的职位可以提供 10-30%的加薪幅度。这是一次显著提升，考虑到因育儿而中断工作造成的性别薪资差距，以及因性别偏见导致的晋升损失，这能有效缩小差距。


  对于想招聘你的信息技术专业人士来说，一份每两年更换工作的简历很少会得到负面评价。由此获得的经验和薪资增长将对你的下一份职业发展大有裨益，超过任何可能的弊端。


