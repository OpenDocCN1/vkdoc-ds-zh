- "# 1. 开启你的 Data Studio 之旅\n\n构建你的第一份 Data Studio 报告\n\n> *问题催人奋进。问题让我们看见生活的美好。永远不要停止提问。*\n\
  > \n> ——彼得·考德隆，《你好，世界》(自出版，2019 年)\n\n如今被视为“数据专家”或“数据大师”的大多数人，或许看起来像“巫师”，但他们也曾是初学者。某天，某件事促使他们决定开始尝试使用数据可视化工具。也许是一个周末或一个晚上，他们没有瘫在电视机前，而是选择打开笔记本电脑，开始摆弄一款数据工具。对他们来说，这个过程起初相当令人沮丧，因为坦率地讲，文档通常不怎么好，示例也往往更难以理解。在我的个人旅程中，我发现即使是为了完成一些我认为非常基础的任务，我也可能花上数小时去理解各种概念和想法。我最终找到了自己的路，但过程充满了压力和痛苦的学习经历。\n\
  \n好消息是，我们将一起踏上这段旅程。在本章中，我将引导你迈出使用 Data Studio 的第一步，并与你并肩作战，直到你准备好独当一面。\n\n所以，拉把椅子坐下，确保手边有一杯好喝的饮料，我们就要开始尝试在\
  \ Data Studio 中构建你的第一份数据报告了。\n\n## 开启你的数据之旅\n\n我总是说，不是你找到了数据，而是数据找到了你。我曾与来自各行各业的无数人合作过，他们对数据的理解和兴趣处于不同阶段。通过我在各种会议和聚会上进行的演讲，我有幸遇到了许多正处于对数据产生兴趣初期阶段的人。最令我惊叹的是，他们来自如此多样的背景。他们唯一的共同点是，都曾面临一个让自己陷入困境的挑战或十字路口。他们知道自己理解中缺少了某一块，并正在寻找数据的“超级英雄”来拯救他们。\n\
  \n我当然希望数据是一颗神奇的子弹，可以简单启动就能解决问题；然而，在现实中，找到数据仅仅是旅程的开始。对一些人来说，他们在数据之路上走了一段后，可能会发现自己已经足够了，于是转向其他感兴趣的事情。而对另一些人来说，他们将被推向每周都在涌现的、大量精彩的新数据工作专业领域。\n\
  \n数据科学家、数据工程师、人工智能工程师——这些几年前还相当罕见的新角色，现在在大多数组织中都变得越来越普遍。可以说，如今即使要成为一名相当称职的数字营销经理，也需要具备以前只有数据分析师才需要的数据素养水平。\n\
  \n无论你选择哪条路（或者不选），我学到一个突出的事实是：每个人都能从数据可视化技能中获益。它可以帮助你：\n\n- 用数据讲故事\n- 带领你的受众与你一同踏上旅程\n\
  - 帮助你的受众理解你的数据并从中提炼洞察\n\n就我个人而言，我发现我的大脑就是无法处理成堆的数字或文字。我使用数据可视化作为探索和理解数字的方法。这就像查看一张海滩图片与感受指间沙粒、聆听海浪拍岸之间的区别。\n\
  \n数据可视化让数据变得鲜活，并将其转化为真实的东西。\n\n## 企业对数据的态度\n\n在我的职业生涯中，一个分水岭般的发现是：企业在使用数据方面，与人们非常相似。数据的使用方式因人们的生活和经历而存在巨大差异。有些人高度依赖数据生活，无论是分析预算、规划未来，还是优化账单、通勤，甚至是在哪里购买日用品。另一些人则随遇而安，依靠自己的个性和直觉来获取生活中想要的东西。\n\
  \n当你开始将数据应用于企业时，首先需要了解这家企业对数据的态度。在公司的文化中，数据要么是业务的核心驱动力，要么是上级强加给别人的烦恼，其唯一使命就是阻止别人做自己想做的事。\n\
  \n我认为企业是极其复杂且重要的实体，不能依赖数据来做决策是行不通的。一个好的品牌或产品只能带你走这么远，之后你就需要开始理解市场和商业目标才能成功。当我遇到那些嘲笑数据的人时，我总是强调一点：数据从来不是企业的首要任务，直到它成为*首要*任务（当事情进展不顺时，这种情况会以难以置信的速度和突然性发生）。\n\
  \n在大学时，我忍受着无数枯燥乏味的统计学课程，并痛恨它们从不实用，总是停留在理论层面。如果我当时知道这些知识的应用前景，我可能仍然不会喜欢它们，因为它们对我来说不够真实。我非常希望当时能有真实世界的例子来教我数据这门手艺的方方面面。作为一个通过实践来学习的人，这是我能理解任何事物的最有效方式，而这也正是我试图通过这本书做到的。\n\
  \n那么，让我们一起继续深入 Data Studio 的旅程吧。我深情地回忆着自己的旅程，并希望我能为你缩短一些痛苦的过程，分享一些我在熟练掌握数据的道路上，迈出各种步伐（以及误入歧途）时所积累的积极经验。\n\
  \n\n\n"
- '# 记住：你是一位数据开发者


  当人们听到“开发者”这个词时，他们对这个角色的含义会有一些先入为主的看法。最常见的印象是，开发者是天才能以计算机般的方式在脑中处理海量算法来生成代码。这是一种误解。开发者只是普通人，他们投入时间学习编程语言，并理解所用技术的工具、技巧、细微差别和特性以产出成果。任何专业工作，无论是砌砖工、水管工还是开发者，都需要你学习行业工具来建造人们所需的东西。按我的定义，开发者就是从无到有创造事物的人。房地产开发商买下一块土地，建造房屋供人居住。Web
  开发者则从零开始构建应用或网站。


  在大多数传统、行动缓慢的组织中，负责为企业创建仪表板的人员，其职位通常包含“分析师”或“数据经理”等字眼。如果你在这样的组织工作，我希望你能跳出“分析师”的框架，开始将自己视为一名“开发者”，并在构建数据可视化报告时采用开发者的思维方式。


  在一些更具前瞻性的组织中，专门从事仪表板构建或数据管道创建的人员的职位通常被称为 BI（商业智能）开发者或数据工程师。


  通过迈出这精神上的第一步，称自己为开发者，你将把以下三个事实牢记于心：


  1.  作为构建企业依赖其进行进度跟踪和决策的数据可视化系统的人，你和那些确保电商网站正常运行的人同样有价值。

  2.  你的工作可以对企业的成功产生至关重要的影响。

  3.  掌握数据开发技能的同时，也肩负着责任，要确保你开发的内容质量高、准确无误，并且适合其预期用途。


  在我为企业构建数据报告的过程中，得益于使用了通常被视为开发流程的方法。这不是因为我试图把事情搞得更复杂，而是为了专注于交付可靠且可维护的数据可视化成果。数据开发者的角色可能是现代企业中最具影响力的角色之一，因此我们有必要做好工作，把事情弄对。恭喜你，欢迎进入开发者的世界！


  '
- "# 开始入门：你好，世界！\n\n每当开发者开始学习一门新的编程语言时，他们通常从编写一个在屏幕上显示“Hello World”的程序开始。既然你们都是新兴的数据可视化开发者，我们将通过使用\
  \ Data Studio 向世界问好，来开启我们的旅程。我们将创建一个简单的报告，从 CSV 文件中提取数据。\n\n**注意**：Google Data Studio\
  \ 在不断进化，并推出新版本和功能。因此，本书中的截图可能与你在屏幕上看到的略有不同。\n\n## 步骤 1：设置 Google 账户\n\nData Studio\
  \ 是一款任何人都可以免费使用的工具。要访问 Data Studio，你需要拥有一个支持 Google 服务的账户。好消息！如果你有 Google、Gmail\
  \ 或 G Suite 企业账户，你已经可以开始了，并可以跳到下一步。\n\n对于那些还没有 Google 账户的人，你可以访问此网址：[`https://accounts.google.com/signup/v2/webcreateaccount`](https://accounts.google.com/signup/v2/webcreateaccount)。\n\
  \n在此页面上，你可以决定是注册一个新的 Gmail.com 地址，还是将现有的电子邮件激活为 Google 账户。输入你想用于新 Gmail 地址的用户名，或点击“改用我的当前电子邮件地址”，如图\
  \ 1-1 所示。\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig1_HTML.jpg](img/485069_1_En_1_Fig1_HTML.jpg)\n\
  \n**图 1-1**  \n使用新的 Gmail 地址或现有电子邮件地址设置你的新 Google 账户\n\n填写注册表格中的详细信息以继续。\n\n## 步骤\
  \ 2：打开 Data Studio\n\n拥有 Google 账户后，前往 [`https://datastudio.google.com`](https://datastudio.google.com)\
  \ 打开 Data Studio 主屏幕。\n\nData Studio 主屏幕（图 1-2）是你进入 Data Studio 世界的发射台。在创建第一个仪表板之前，让我们先熟悉一下界面（图\
  \ 1-3）。它由四个关键部分组成：\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig3_HTML.jpg](img/485069_1_En_1_Fig3_HTML.jpg)\n\
  \n**图 1-3**  \nData Studio 界面\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig2_HTML.jpg](img/485069_1_En_1_Fig2_HTML.jpg)\n\
  \n**图 1-2**  \nData Studio 主页\n\n1.  **模板库** 提供了一种快速开始创建新仪表板的方式。你可以使用空白报告，也可以使用\
  \ Data Studio 团队创建的预制模板。要使用预制模板，请点击右上角的“所有模板”按钮。\n\n2.  **报告组织区域** 位于模板栏正下方，是一组用于按以下条件对报告进行排序的组织列或筛选器：\n\
  \    *   名称\n    *   所有者\n    *   上次打开时间\n\n3.  **左侧菜单** 让你能够快速进行以下操作：\n    *  \
  \ 创建新报告\n    *   访问由他人创建并分享给你的报告\n    *   访问你创建或从他人处复制的报告\n    *   查看已删除报告的回收站\n\
  \n4.  **顶部的搜索栏** 是一个方便的工具，可以让你按名称搜索报告。\n\n\n\n## 步骤 3：创建空白报告\n\n要创建空白报告，请点击屏幕左上角的“创建”加号图标，然后选择`报告`，或者点击模板栏中的加号图标。\n\
  \nData Studio 界面乍一看总是很吓人。别担心。读完本书后，你就会对界面了如指掌，因为你会用到它的所有功能。现在，我们只快速浏览一下界面的主要核心区域：\n\
  \n- 报告标题\n- 共享按钮\n- 查看/编辑模式按钮\n- 主工具栏\n- 报告画布\n- 配置面板\n\n> **注意**：你可能会看到一个介绍画面，帮助你连接数据源。我们很快就会讲到这一点，但现在先把它关掉，这样你就能进入主界面。\n\
  \n### 步骤 3.1：为报告命名\n\n点击屏幕左上角的“未命名报告”文本，为你的报告重命名。选择一个容易理解的名字，例如“学习 - Hello World”。然后，按`Enter`键或在名称框外点击一下。\n\
  \n保持工作区整洁并保护数据是个好习惯。我学到的一个有用习惯是，在开始新报告时，我总是会先重命名它，而不是使用 Data Studio 给的默认名称。\n\n\
  最好的名字是那些容易记住，并且包含你将来在列表中查找时可能会搜索的术语。为报告选择一个好名字，就像给未来的自己写一封情书。你会很高兴自己花了这点时间，为以后省下了额外寻找的时间。我无法告诉你，仅仅因为起了一个好报告名，我就节省了多少时间。\n\
  \n我最常用的名字是：\n\n- 对于我正在服务的客户或品牌，我会使用`“品牌 - 获客报告”`或`品牌 A - YouTube 周报`。\n- 如果我只是创建一个新报告来试用某个功能，我会用`“Playground”`这个词来描述它——例如，`“计算字段\
  \ Playground”`。\n- 如果我只是创建一个临时报告来试验某些东西，那么最好的名字就是`“delete me”`，这样在我查找重要内容时，它就不会成为另一个需要打开的报告。\n\
  \n## 步骤 4：创建你的第一个数据连接\n\n当我们考虑构建 Data Studio 报告时，这有点像做水管工。我们希望让水从外部流到我们的主水槽，在那里我们可以用它来洗涤、烹饪和饮用。要让这第一个报告工作起来，我们需要连接到我们的主要“数据”水源。在这个例子中，我们将从一个\
  \ CSV 文件获取数据。\n\n### 步骤 4.1：下载示例 CSV 文件\n\n我们将直接连接到最基本的数据源：一个 CSV 文件。在本示例中，我们将使用一个我用文本编辑器创建的简单文本文件。该文件采用一种名为“逗号分隔值”文件（简称\
  \ CSV）的标准格式。如果有一种通用语言用于系统间交换数据，那么 CSV 很可能就是它。\n\n从本书的源代码中下载示例 CSV 文件（`Ch1_ExampleCSV.csv`），该代码可在\
  \ [`www.apress.com/9781484251553`](http://www.apress.com/9781484251553) 获取。\n\n\
  人们使用的大多数平台通常都支持将数据导出为 CSV，因此这个练习将是你会反复使用的一种技术。\n\n### 步骤 4.2：将 CSV 文件上传到 Data Studio\n\
  \n现在我们已经拿到了数据文件，需要把它转换成 Data Studio 可以访问和操作的形式。我们通过点击工具栏中的“添加数据”按钮来实现。然后你会看到一长串不同类型的数据源。在本书编写时，我们有：\n\
  \n- **Google 连接器** – 这包括常见的连接器，如 Google Ads、Google Analytics 和 Google Sheets。我发现这些连接器通常最可靠，因为它们是由\
  \ Google 内部团队构建并直接得到 Google 支持的。\n- **合作伙伴连接器** – 这些连接器由第三方公司创建，通常需要付费才能使用。这些公司通常直接提供对插件的支持；不过，如果你依赖它们进行报告，体验可能会参差不齐。你通常得依赖创建它们的公司来进行修改，因为你无法看到它们的代码。并非所有这些连接器都有庞大的支持团队，解决你遇到的任何问题可能需要很长时间。话虽如此，其中一些连接器功能非常强大，比如非常流行的`“Supermetrics”`连接器，它可以让你连接到\
  \ Google Search Console、Facebook Insights，甚至像 Stripe 这样的支付服务提供商。\n- **开源连接器** –\
  \ 这些数据源通常由更广泛的社区成员构建，并贡献给 Data Studio 以造福他人。它们的优点是你可以直接看到它们的代码，因此如果你的项目相关，你可以对其进行修改。大多数这些连接器都是免费的；但与其他开源项目一样，你需要依赖其他人来修复任何问题。\n\
  \n我们现在要使用的连接器叫做`“文件上传”`。选择它之后，你需要将 CSV 文件拖入上传框，或者点击按钮在你的电脑上浏览该文件。\n\n系统会要求你授权 Data\
  \ Studio 将此文件上传到你的 Google Cloud Storage。本书不会对 Google Cloud Storage 进行详细介绍，但你可以把它想象成互联网上某个地方的安全硬盘。Google\
  \ 负责托管、保护和管理访问权限，因此你无需担心未经授权的人员访问它。点击`授权`和`接受`，以授予 Google Data Studio 访问你的存储空间的权限。\n\
  \n一旦你批准 Google 将你的 CSV 文件存储到 Google Cloud Storage 中，我们就终于可以上传数据了。\n\n几秒钟后，文件的状态会从`上传中`变为`处理中`，再变为`已上传`。\n\
  \n你会看到页面底部有四个状态字段。它们包括：\n\n- 你上传的文件名\n- 文件上传的时间\n- 文件大小\n- 文件状态\n\n`已上传`状态旁边有一个方便的绿色小点，这表明\
  \ Google 对数据满意，你可以继续连接了。\n\n文件上传完成后，你可以通过点击文件名来重命名数据源。你应该始终为你的数据源起一个容易理解的名字。这将有助于你以后识别它。一点前期的清理工作会在后期为你省去很多麻烦，尤其是当你有数百个数据源散落在数据源文件夹中时。对于这个练习，我们将其命名为`“Hello\
  \ World - CSV”`。参见图 1-4。\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig4_HTML.jpg](img/485069_1_En_1_Fig4_HTML.jpg)\n\
  \n*图 1-4 – 上传 CSV 文件数据源*\n\n选择蓝色的`“添加”`按钮，你就可以选择 CSV 文件将其上传到你的账户。\n\n\n### 步骤 4.3：编辑连接并授权访问\
  \ Google 云端硬盘\n\n此时会弹出一个关于向此报告添加数据的小对话框。只需点击“添加到报告”即可。Google 会请求权限，以便在你的 Google\
  \ 云端硬盘中创建新的 Google Data Studio 报告。\n\n**注意**\n\n我个人觉得这一步有点令人困惑，因为我平时向云端硬盘添加 Google\
  \ 文档或表格时，并不需要请求权限。我不明白为什么 Google 对 Data Studio 文档的处理方式有所不同。希望 Google 能在未来移除这一步骤，让用户操作更简便。\n\
  \n对话框关闭后，你会返回 Google Data Studio 报告编辑器主界面。恭喜你，现在你已经成功创建了第一个 Data Studio 连接。接下来，我们可以专注于在屏幕上展示数据，让全世界看到你的问候。\n\
  \n## 步骤 5：在 Data Studio 中显示 CSV 数据\n\n现在，我们准备向世界展示你的数据。在菜单栏中，你会看到一个名为“添加图表”的按钮。点击它，你可以从多种数据可视化方式中进行选择。我们稍后会详细介绍这些选项。现在，只需选择第一个图标（简单表格）。屏幕上会出现一个带有小表格图标的大矩形。Data\
  \ Studio 要求你选择表格的放置位置。目前，只需将其整齐地放置在页面顶部的主要画布区域即可。请参见图 1-5。\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig5_HTML.jpg](img/485069_1_En_1_Fig5_HTML.jpg)\n\
  \n**图 1-5** Data Studio 中的第一个表格\n\n仿佛魔法一般，你可以看着第一个数据表格逐渐显现。我相信你之前在很多程序中都见过表格，但 Data\
  \ Studio 之所以成为数据分析领域的变革者，就在于这个小小表格的强大和灵活性。我觉得它就像公路赛车中的喷气背包——如果你想领先，只需启动火箭引擎，就能超越其他竞争对手。\n\
  \n## 本章小结\n\n在本章中，你从零开始，为 Data Studio 打下了基础。我们从一个文件中提取数据，并在 Data Studio 中建立了连接。然后使用表格控件在屏幕上显示数据，从而向世界发出问候。\n\
  \n在下一章中，你将接到第一个 Data Studio 任务，并为一个小型企业构建基础仪表盘。\n\n"
- "# 2. 报告制作\n\n手动电子表格与 Data Studio 报告\n\n> *我从不教导我的学生，我只尝试提供他们能够学习的条件。*\n> \n> ——阿尔伯特·爱因斯坦，理论物理学家\n\
  \n你在第 1 章中创建的第一个“Hello World”Data Studio 报告似乎只是个开始！原本只是个人练习项目，如今已演变为你的第一个仪表盘制作机会。\n\
  \n我发现，分享你热衷的事情总是有益的。如果某件事让你充满热情，那么志同道合的人自然会被你吸引。你还会发现，以前未曾注意的机会也会随之出现。\n\n通过构建一个小项目来学习新技术，是最有效的方法。如果你能在学习项目中有所收获，那你就是极其幸运的少数人。就我而言，我花了很多业余时间学习\
  \ Data Studio，并且乐在其中，因为我喜欢它处理数据时的创造性。孩子们入睡后，我会坐在厨房桌旁，而不是瘫在电视机前，尝试在 Data Studio 中构建一些有趣的东西。\n\
  \n**提示**\n\n花几分钟思考一下，你想用 Data Studio 构建什么样的项目。可以是个人用途，比如绘制你一周的运动距离曲线；也可以是工作相关，比如自动化你的报告流程。\n\
  \n那么，让我们开始第一个小项目吧——为我们的朋友赫尔曼制作一份销售报告。\n\n## 帮助赫尔曼的蛋糕与咖啡店\n\n赫尔曼经营自己的咖啡店和面包店已有两年，积累了相当忠实的顾客群。一些老主顾甚至称他为“赫尔曼大叔”，因为他总能娓娓道来，分享故事。\n\
  \n他过去在城中老街区做摩托车修理工，但随着科技公司不断涌入，他发现向他们售卖咖啡和蛋糕能带来丰厚的利润。事实证明，科技从业者非常喜欢有格调、独特的场所来休闲和工作。由于大部分时间与摩托车爱好者为伴，他有很多精彩的故事，常常一边招待顾客享用热饮和糕点，一边娓娓道来。\n\
  \n如今，他曾经投入摩托车生意的热情，已完全转移到咖啡店上。他专注于提供最优质的有机素食，并痴迷于调配咖啡，力求让其味道比街角店铺好上十倍。\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig1_HTML.jpg](img/485069_1_En_2_Fig1_HTML.jpg)\n\
  \n**图 2-1** 赫尔曼的咖啡店\n\n你能运用新学的 Data Studio 技巧（图 2-1），帮助他更好地了解自己的业务吗？如果你能帮他增加收入，他将以一个月免费咖啡和纸杯蛋糕作为答谢。\n\
  \n**注意**\n\n学习期间免费工作是没问题的。但一旦掌握了技能，就别指望再免费干活了。任何人都不应被期待用免费劳动换取所谓的“未来”收益或晋升机会——那些机会很少能真正转化为实惠。如果有人需要你的技能，他们就该付钱。至于赫尔曼，我们这次就放过他，接受咖啡和蛋糕的报酬吧——毕竟，这是检验\
  \ Data Studio 能力、为作品集构建第一个项目的绝佳方式。\n\n\n## 报告中应展示哪些信息？\n\n每当遇到新客户或业务相关方时，我都会花时间通过四个关键问题来了解他们：\n\
  \n1. **他们当前的目标是什么？** 他们对业务的主要目标是什么？\n2. **他们需要哪些信息？** 哪些信息能帮助他们推动这一目标？\n3. **他们的数据专业水平如何？**\
  \ 他们在使用和理解数据方面有多熟练？\n4. **应该如何呈现数据？** 以何种最佳方式传递数据，才能让受众清晰理解？\n\n第一个问题是最需要理解的核心。所有人都在努力达成某些目标，因此如果你能与他们建立共识，合作起来就会更加顺畅。\n\
  \n明确哪些具体信息能帮助他们实现目标，这是第二个问题。通常，大多数人会带着他们认为自己需要的需求清单来找你。作为数据相关方，你的职责是理解这些需求，并确保它们确实能助力对方达成目标。如果做不到，很快就会发现——因为根本没人会看你的报告。\n\
  \n随着你产出更多报告，你将积累经验，学会过滤“多余噪音”，并能捕捉到各种信号——这些信号表明对方并不确定自己真正想要什么，只是在凭感觉猜测。这时你便可以介入，引导他们转向更具体、更有帮助的方向。\n\
  \n受众的数据专业水平体现在第三个问题中，但在合作初期极难准确判断。而且，大多数人很少会一开始就如实回答这个问题。当你直截了当地询问他们对数据的了解程度时，人们通常会非常戒备。与其直接提问，不如采用更好的技巧来获取这类信息。\n\
  \n我曾遇到有人告诉我他们“一直在用”`Google Analytics`，但当我查看他们的`Google Analytics`账户时，却发现这些账户几乎没怎么使用（而且很多时候数据都不准确）。这种情况不仅限于经理级别；我有过几次与自称专家的高级数据总监共事的经历，结果惊讶地发现他们连用户转化率或跳出率这样简单的概念都不理解。他们虽然身居高位却不了解数据分析的基础知识，但这并不意味着你无法教他们新东西。如果你面对的是数据经验不太丰富的用户，那么用简单清晰的方式给出答案将至关重要。\n\
  \n另一方面，有些用户非常专业，如果你只给他们简单答案而不提供细节，他们很快就会感到沮丧，并且不信任你给出的结果。\n\n第四个问题“应该如何呈现”是最重要的。你构建仪表盘的经验越丰富，就越能有效推动业务进展。\n\
  \n## 了解赫尔曼的需求\n\n> *世界上大多数人做决策时，要么靠猜测，要么凭直觉。他们要么运气好，要么会犯错。*\n>\n> ——苏海尔·多希，Mixpanel\
  \ 首席执行官\n\n当你开始与新客户或利益相关者合作时，需要努力了解他们的需求。对于赫尔曼的咖啡店来说，这一点相当明确。他通过专注于建立客户关系、提供优质的受欢迎产品，实现了店铺的自然增长。在过去，这已经足够，但如今，如果你不用数据来驱动业务，你看到的只是“冰山一角”。\n\
  \n赫尔曼提出的要求是：请你用数据来帮助他赚更多钱。这是一个相当宏大的要求，我们很可能无法完全实现。很多人只是假设在业务上挥舞数据的“魔法棒”就能立刻变出钱来。赫尔曼显然也是这类人。这正是你需要帮助对方理解数据在价值链中位置的关键时刻。\n\
  \n你的回答应该始终如一。你要向赫尔曼解释，通过数据我们能够更好地了解情况，从而为他的决策提供参考。有时这会带来更多利润，有时则不会。\n\n当你告诉大多数企业主可能无法完全满足他们的预期时，他们多少会有点不安，但这没关系。与其试图交付不切实际的结果，不如先管理好对方的期望。重要的是建立良好的成果展示记录，这样你就能在与潜在客户/内部团队合作初期就建立起信任。\n\
  \n你能给任何人的一个保证是：通过让数据可视且易于获取，你可以帮助人们做出更明智的决策，从而推动业务增长。\n\n回到与赫尔曼的会议，根据上一节的内容，你列出了想问他四个关键问题。\n\
  \n### 他当前的目标是什么？\n\n赫尔曼告诉你，他希望能提高咖啡店的销售额。如果他能实现这个目标，就可以在城市的另一个科技区开一家新店。\n\n### 他需要哪些信息？\n\
  \n赫尔曼说，他目前每天用一份简单的`Excel`文档记录营业收入，然后发给会计录入财务系统。每周结束时，他会收到一封邮件报告，其中列出了最畅销的产品。他利用这些信息来订购原材料，并规划下周要销售的商品。\n\
  \n### 他的数据专业水平如何？\n\n赫尔曼向你承认，他在数据方面其实力不从心。他知道什么卖得好，但对电子表格中一些常用工具完全没概念。他表示，每周从会计那里收到汇总数据就已经很满意了。\n\
  \n\n\n### 数据应以何种形式呈现给他？\n\n找到正确格式的最简单方法是向利益相关者索要他们之前的报告。从他们已知且熟悉的内容入手，只要操作简单即可。\n\
  \n你可能会暗自思考：“等等，用新颖、炫酷又精简的新东西开始不是更好吗？”\n\n诀窍在于：这个步骤的目标不是给他们展示炫酷的东西，而是试图与客户建立信任。\n\
  \n让我用一个小故事来说明这一点。\n\n几年前，我听说了一位专门使用 Adobe Photoshop 的设计师。他曾受邀参加一个市场调研活动，有机会试用一款\
  \ Photoshop 的新竞品。对方花了很长时间展示这款产品及其所有功能，包括他们引以为傲的独特全新导航。演示结束后，他们问大家希望看到哪些改进。这位设计师举手说道：\n\
  \n“你们就不能把导航做成跟 Photoshop 一样吗？”\n\n现场一片沉默。按他的要求做会延迟产品发布，也意味着要放弃他们引以为傲的华丽导航功能。他们没有听取他的意见，也没有满足他对延续性的首要需求。这位设计师希望能够交付工作，而不需要经历大量额外的学习过程。\n\
  \n不用说，那款竞品软件如今已不复存在。Adobe 的工具仍然是设计师们最常用的软件。我不禁想，如果那家公司当初听取了目标用户的意见，结果会怎样？\n\n同样地，如果你希望用户通过你的工具建立信任，那么最简单的开始方式就是复制他们熟悉的内容。Data\
  \ Studio 的关键特性之一就是它能非常快速地制作新报告的原型。一旦人们看到屏幕上那熟悉的旧报告，你就能吸引他们的注意力，并可以开始迭代他们的数据报告。\n\
  \n当我们拿到赫尔曼的报告样本时，它看起来像是一个由密密麻麻数字组成的大表格。那是一份产品列表，每个产品旁边列出了销售量。每项旁边还有百分比符号，显示销售额相比前一周是上升还是下降。\n\
  \n## Data Studio 如何帮助赫尔曼\n\n在回顾了赫尔曼对四个关键问题的回答后，你很清楚赫尔曼需要哪些帮助。他需要：\n\n1.  **及时的信息**\
  \ —— 他没有获得做出决策所需的及时信息。他必须等到周末，会计师把数据发回来。\n2.  **消除重复劳动** —— 目前赫尔曼需要将销售数据输入电子表格，然后通过邮件发给会计师。会计师再将销售额录入会计程序/电子表格，然后发回销售表现报告。之后赫尔曼还需要审核和分析结果。\n\
  \n如果你能向赫尔曼展示如何使用 Data Studio 获取他的销售数据，自动处理这些数据，并从原始电子表格数据生成报告，那么你就能帮助他更快地做出决策。他也不再需要付钱给会计师来录入数据并把结果返回给他。相反，他可以专注于根据数据推动改进。\n\
  \n你同时猜测，鉴于赫尔曼如此专注于他的产品，如果他能自己掌控数据，他将能够针对数据提出更好的问题。从长远来看，这可能是他最大的收获。\n\n赫尔曼把他最近从会计师那里收到的几份报告转发给你，这样你就能看到报告有什么变化。好消息是，我们肯定能对其加以改进！我们开始工作吧。\n\
  \n## 为赫尔曼的蛋糕咖啡店构建报告\n\n### 步骤 1：将数据上传到 Google 电子表格\n\n第一步是从谷歌表格中获取赫尔曼的数据。\n\n为了完成此练习，你需要从本书的源代码中下载一份赫尔曼蛋糕咖啡店的销售数据（`DS\
  \ – Coffee Shop.xlsx`）。访问 [`www.apress.com/9781484851553`](http://www.apress.com/9781484851553)\
  \ 并点击下载源代码按钮。\n\n将你的数据电子表格上传到 Google 云端硬盘。\n\n访问 [`https://docs.google.com/spreadsheets/u/0/?tgif=d`](https://docs.google.com/spreadsheets/u/0/%253Ftgif%253Dd)\
  \ 打开 Google 表格。\n\n新建一个表格，然后进入：文件 ➤ 导入 ➤ 上传。浏览并上传 `DS – Coffee Shop.xlsx` 文件。\n\n\
  确保电子表格命名为“`DS - Coffee Shop`”。如果需要修改，双击表格左上角的文件名进行更改。完成后按回车键或点击其他位置。\n\n### 步骤 2：清洗数据\n\
  \n接下来，我们需要清洗数据，使其准备好被使用。\n\n清洗过程的目标是：\n\n-   将数据整理成表格形式。\n-   确保每一列只包含一类数据。\n- \
  \  检查没有任何字段存在空白条目。\n-   确保所有字段的数据格式正确且一致。例如，确保日期格式为 `dd/mm/yyyy`。\n\n我最喜欢的一位数据团队负责人曾这样告诫那些试图在数据上偷工减料的开发人员，他反复强调一句口头禅：\n\
  \n> *垃圾进……垃圾出*\n\n你应该把 Data Studio 报告想象成办公室里那种高档净水器。如果出水不干净，它会立即停止使用，并需要报修工程师。\n\
  \n同样地，你的 Data Studio 报告也应该是经过过滤和清洗的，以供用户使用。任何包含错误数据的数据源，都应该导致用户呼唤工程师（也就是你！）来调查并解决问题。\n\
  \n> **提示**  \n> 在制作报告时，请考虑如何让用户在遇到数据问题时向你发出警报。我总是在所有报告的同一位置放置我的联系方式，以便人们有疑问时可以联系我。我们将在后续章节讨论这一点。\n\
  \n#### 应该在何处进行数据清洗？\n\n我认识很多人，他们认为在报告工具中清洗数据就可以了，不需要在数据源中进行。我通常认为这是一种巨大的反模式（一种会让你后悔的不良做法）。\n\
  \n经验法则是：在数据源头修正数据，在 Data Studio 中调整数据。\n\nData Studio 有许多强大的功能，可以帮你完成部分清洗工作，但我倾向于用它们来做一些小的修正或让数据更易使用。我建议人们尽可能在数据的原始源头完成清洗工作，因为：\n\
  \n-   这能保持事情简单，你只需要在一个地方查找和修复数据问题。\n-   这减少了为多个报告重复进行清洗的工作量。\n\n有时我们在 Data Studio\
  \ 中做了一些调整，如果这些调整很明显将会长期存在，我可能会将这个改动回滚到原始数据源中，以便让 Data Studio 运行得更快。\n\n#### 在专业环境中如何进行数据清洗？\n\
  \n当你在办公室进行数据清洗时，可以直接通过修改电子表格来完成，或者在某些企业中，数据团队会使用名为 SQL 的脚本语言来处理包含数百万行数据的数据库。\n\n\
  信不信由你，小型电子表格和大型数据库背后遵循的原理基本相同。由于 SQL 和数据库本身是极其庞大的主题（甚至可以写出好几本书），我们将仅限于清洗我们从赫尔曼周销售数据创建的电子表格。幸运的是，这份数据已经很干净了，所以我们可以继续往下进行。\n\
  \n\n\n### 第 3 步：创建 Data Studio 报告\n\n打开 Data Studio 并创建一个新的空白报告。将其命名为 `“DS - Coffee\
  \ Shop.”`。如需复习如何创建新报告，请参阅第 1 章。\n\n### 第 4 步：创建与 Google 表格的数据连接\n\n数据的奇妙之处在于它总是在变化。与上一章中我们创建与文件的静态连接不同，在本章中，我们将建立一个与实时\
  \ Google Sheets 文档的动态连接。当 Google Sheets 中的数据发生变化时，我们会看到 Data Studio 的内容也随之改变。要创建与\
  \ Google 表格的数据连接，请执行以下操作：\n\n1. 点击 `“添加数据”`。\n2. 在“Google 连接器”列表中找到 `“Google Sheets”`\
  \ 并点击它。如果这是你第一次将 Google 表格连接到 Data Studio，则需要授权。\n3. 找到 Hermann 的销售报告：`“DS - Coffee\
  \ Shop.”`。\n4. 选择该文件，然后选择 `“菜单”`（Google 表格中的第一个标签页）。\n5. 点击右上角的蓝色“连接”按钮，然后点击 `添加`，再点击\
  \ `添加到报告`。\n\n### 第 5 步：创建数据的原始表格视图\n\n每当我开始查看所需数据时，我发现理解数据最简单的方法是使用表格控件来查看原始数据。这在我们深入细节获取所需信息之前，能提供一个数据概览。同时，这也有利于进行初步的质量检查，并再次确认数据存在且格式符合预期。\n\
  \n要创建数据的原始表格视图：\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig2_HTML.jpg](img/485069_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2：向 Data Studio 报告添加原始表格\n\n1. 点击 `“添加图表”`，然后选择顶部行中的第一个表格图标，如图 2-2 所示。\n2.\
  \ 点击您想要放置表格的矩形区域，您将看到来自 Google 表格的数据随之出现。\n\n现在我们已经成功将数据从 Google Sheets 导入表格中，我们可以开始尝试让数据对我们的客户有用。\n\
  \n#### 帮助用户向数据提问\n\n基于这些数据，我们将尝试帮助 Hermann 更详细地了解他的销售数据。一个好的起点是进行一些探索性数据分析，以了解数据的形态。我们可以利用数据回答的一些更简单的问题包括：\n\
  \n-   哪些产品是他的主要销售额来源？\n-   顾客购买最多的口味类型是什么？\n-   这些产品的销售额与去年相比如何？\n\n数据的原始表格并不能清晰地告诉我们销售情况。它只是向我们展示了一堆文本和数字，这让我们的大脑很难处理和解读。我们希望报告能替我们完成繁重的处理工作，帮助用户理解数据。我们可以通过将原始表格转换为更具视觉化的形式（例如饼图）来实现这一点。通过在\
  \ Data Studio 报告中添加饼图，我们为用户提供了一种更轻松的数据解读方式。人类是视觉动物，我们通过感官来理解周围的世界。数据世界也大致相同：通过在报告中添加视觉元素来引导用户了解信息所传达的内容，可以让他们专注于对自己最重要的事情。\n\
  \n#### 添加饼图\n\n要添加饼图以显示销售明细：\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig3_HTML.jpg](img/485069_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3：添加饼图\n\n1. 点击 `“添加图表”`，然后选择第一个饼图控件（图 2-3）。\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig4_HTML.jpg](img/485069_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4：按产品名称划分的饼图\n\n2. 点击您想要放置图表的位置。\n\n当我们首次添加饼图时，Data Studio 默认显示数据集中的第一个字段\
  \ `“Product Name”`（产品名称）。它默认还向我们显示今年的数据。如图 2-4 所示：\n\n-   我们的畅销产品是 `“Banana Loaf”`（香蕉面包），紧随其后的是美味的薰衣草纸杯蛋糕。经典的老式巧克力蛋糕位列第三。\n\
  -   排名前四的产品约占总销售额的 50%。\n-   排名前四的每一款产品的销量大致相当。\n\n## 第 6 步：复制饼图并将维度更改为“产品类型”\n\n\
  让我们通过复制饼图并将维度更改为产品类型，从不同角度查看数据，以获得不同的视角（图 2-5）。为此：\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig5_HTML.jpg](img/485069_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5：按产品类型划分的饼图\n\n1. 右键单击饼图并选择 `复制`。\n2. 将复制的饼图拖到原始饼图的正右侧。\n3. 选中新的饼图，然后在右侧面板的\
  \ `“维度”` 下点击 `“Product Name”`（产品名称），并选择 `“Product Type”`（产品类型）。\n\n当我们选择名为 `“Product\
  \ Type”`（产品类型）的维度时，我们指示 Data Studio 重新处理表格中的数据，不再按产品名称分组，而是按产品类型分组。通过更改所使用的这个 `“维度”`，它改变了我们查看数据的视角，并从不同的角度展示数据。维度（和指标）是数据报告的基本构建块，我们将在本书接下来的几章中进一步探讨它们。\n\
  \n现在，让我们欣赏一下饼图的这个小改动如何帮助我们更深入地了解销售数据。当我们通过 `“product type”`（产品类型）的视角查看销售数据时，我们可以看到：\n\
  \n-   令人惊讶的是，我们近 50% 的销售额来自纸杯蛋糕。\n-   三分之一的销售额来自蛋糕。\n\n\n\n### 步骤 7：使用评分卡控件展示销量\n\
  \n所有报告都需要认识到信息存在重要性层级。回想一下学生时代从老师那里收到的成绩单。你最想了解的关键信息是各科目的分数。如果分数被埋没在几段关于学习努力程度的评语底部，你会作何感想？想必会感到非常沮丧和困惑，不明白他们为何要隐藏如此重要的信息。同理，我们需要使用评分卡来向报告读者突出显示最重要的信息。\n\
  \n通常使用评分卡来展示我们常说的“KPI”，即关键绩效指标。\n\n我见过关于 KPI 最精炼的定义来自英国《公司法》，其中将 KPI 定义为“可据此有效衡量公司业务发展、绩效或状况的参考因素”。\n\
  \n要在报告中添加显示已售数量的评分卡：\n\n1.  点击主工具栏中的“添加图表”按钮。\n2.  选择“评分卡”字样下方的第一个图标。\n3.  点击并拖拽出一个框，指定评分卡的放置位置（理想位置是报告左上角）。\n\
  4.  默认情况下，它会显示产品名称的记录计数，因此你需要将维度更改为已售数量。\n\n现在你会看到带有“已售数量”标签的评分卡（图 2-6）。\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig6_HTML.jpg](img/485069_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n已售数量评分卡\n\n对于赫尔曼来说，他的 KPI 将是产品销售数量，因此这需要在报告中立即展示。我们使用评分卡控件在报告顶部显示已售产品数量。\n\
  \n提示\n\n在报告中使用评分卡时，请尽量控制数量。过多的评分卡会使用户感到困惑。如果你发现一张报告上要放置超过五个评分卡，就该考虑是否应该使用表格或条形图等替代展示方式了。\n\
  \n### 步骤 8：为评分卡添加日期对比\n\n我们已经使用饼图展示了每种产品的销售额规模，现在可以进入分析的下一个阶段。数据总是在变化。今天成立的情况，明天不一定依然成立。\n\
  \n> *我不创造趋势。我只是发现趋势并加以利用。*\n> \n> ——迪克·克拉克，美国电台主持人\n\n人们的时尚、品味和趋势会定期变化，企业需要利用数据来应对这些变化。如果你能够跟踪客户品味的变化，甚至发掘新客户的品味并加以利用，那么你就赢了。\n\
  \n我们将帮助赫尔曼开启了解影响其业务的趋势的旅程，并让他了解销售额随时间的变化情况。希望通过这样做，我们能够识别出他尚未想到的一些机会。\n\n通过检查我们的\
  \ Google Sheets 数据，我们知道有一个“日期”字段。使用“日期/时间”数据非常强大，因为我们可以探索去年和今年之间发生了哪些变化。我们将首先向他展示销售额随时间的变化情况。现在我们选择要比较的日期区间。点击“对比数据范围”按钮。我们可以选择与以下项对比：\n\
  \n- 无\n- 上一周期\n- 去年\n- 固定/高级\n\n“上一周期”选项可能是 Data Studio 中最强大的功能之一。它会将你当前查看的时间段与上一个相等时间段进行比较。因此，你可以使用此控件进行周环比、月环比，甚至年同比对比，以查看销售额的变化。\n\
  \n现在我们想保持简单，所以选择“去年”，然后点击“应用”完成我们的“同比评分卡”。\n\n一两秒后，你将看到评分卡下方“47%”旁边出现一个绿色箭头（图 2-7）。这表明自去年以来，产品销量增长了\
  \ 47%，对赫尔曼来说是一个惊人的成果。\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig7_HTML.jpg](img/485069_1_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7\n\n显示对比结果的评分卡\n\n既然你已经学会了如何在评分卡上进行基本的日期范围对比，好消息是，你同样可以对表格进行相同的操作。何不尝试对你已有的数据表格进行年同比对比，看看赫尔曼的哪些产品推动了他自去年以来的销售增长？\n\
  \n## 回归根本\n\n正如本章我们尝试用数据解决“现实”问题一样，这项尝试最有价值的一点是，你会开始意识到知识中存在空白，并且有新的东西需要学习。\n\n\
  从你初次使用 Data Studio 工具的经历来看，你可能已经注意到到处都在使用许多新的概念和术语。别担心，随着我们阅读本书的深入，你会逐渐掌握它们的。\n\n\
  提示\n\nData Studio 文档团队还维护了一个方便的术语表（[`https://support.google.com/datastudio/topic/6302375`](https://support.google.com/datastudio/topic/6302375)）。\n\
  \n## 小结\n\n做一些简单的事情，比如更深入地了解你的数据，对每个企业都至关重要。在本章中，我们拿了一个简单的 Google Sheets 数据表，没有将其作为静态数据集搁置，而是使用\
  \ Data Studio 让数据生动起来。我们能够识别出：\n\n- 客户哪些产品销量最高\n- 哪些产品类型最受欢迎\n- 销售额随时间的变化情况\n\n\
  我们尝试了一些简单的控件，如表格、评分卡和饼图，甚至还开始进行了一些今年与去年的基本比较。\n\n在接下来的章节中，我们将进一步拓展这些内容。但希望你现在已经对使用\
  \ Data Studio 界面探索数据有了良好的感觉。\n\n"
- "# 3. 指标和维度\n\n有用的数据可视化\n\n> *当你意识到所查看的每条数据都在驱动行动时，你便明白自己身处网络洞察的世界……*\n> \n> ——阿维纳什·考希克，谷歌数字营销布道师^(¹)\n\
  \n在上一章中，我们需要使用维度和指标来制作报告。让我们继续努力理解这些是什么。\n\n几乎所有与数据相关的事情都可以归结为指标和维度。\n\n\n\n## 指标\n\
  \nData Studio 帮助中心词汇表对指标的定义极其复杂：\n\n> *对一组数值应用的特定聚合。指标是来自底层数据集的聚合，或是隐式或显式应用聚合函数（如\
  \ `COUNT()`、`SUM()` 或 `AVG()`）的结果。指标本身没有定义好的值集合，因此你不能像对*[维度](https://support.google.com/datastudio/answer/6303401)*那样按它进行分组。*^(²)\n\
  \n让我们试着简化这个定义。指标是一种将数值分配给事物规模的方法。一个指标可以精炼地概括为：\n\n> *你拥有某种特定事物的数量。*\n\n想想第一章中的赫尔曼。作为一家现代蛋糕店的老板，他关心的是统计某一天卖出了多少蛋糕，或者他们用完了多少原料。\n\
  \n其他指标的示例包括：\n\n* 温度计上的温度\n* 游戏节目中获得的分数\n* 医学研究中的人数\n* 网站用户数，即在给定数据时期内访问你网站的人数\n\
  * 线上销售产品产生的销售收入\n* 一天内向用户展示的错误数量\n* 某个地区的平均降雨量\n\n### 聚合指标\n\n指标也可以复杂得多。我们可能关心数字随时间如何变化，或者不同时间段之间如何比较。\n\
  \n蛋糕店老板可以简单地衡量卖出的蛋糕数量，但他也可能想查明某一天卖出了多少蛋糕。\n\n1. 与特定时期相比，销售额是增长还是下降，它们是缓慢增长还是快速下降\n\
  2. 销售额与上周、上个月相比如何\n\n当你分析一个“集合”的指标时，这被称为聚合它们或将其汇总。聚合本身会成为新的指标。聚合使我们能够比较、分析和追踪数据趋势，从而发现洞见。\n\
  \n请注意，一个指标既可以是原始数值，也可以是聚合结果。聚合可以成为一个新的指标，即使在它的公式中使用了其他指标，它本身也成为了一个指标。\n\n我们稍后会更详细地讨论聚合，但\
  \ Data Studio 词汇表对指标的定义提到了三种：\n\n* **`Count()` 或计数指标** – 例如，某一天卖出了多少蛋糕。\n* **`Sum()`\
  \ 或求和指标** – 这可以是通过现金和信用卡销售蛋糕，在蛋糕店获得的所有收入的总和。\n* **`Avg()` 或平均值指标** – 这可以是每周在 bakery\
  \ 工作的平均员工数（面包师、收银员等）。\n\n## 维度\n\n遗憾的是，在理解数据时，一个指标或聚合并不能让你看到全貌。你需要更多信息才能判断你所拥有的数据是否有用。\n\
  \n通过指标，我们能够真正理解数量方面，但我们如何理解质量的价值呢？这就是维度发挥作用的地方。\n\nData Studio 词汇表将维度定义为：\n\n> *一组你可以据此对数据进行分组的值。维度是信息的类别。这些类别中包含的值通常是该数据的名称、描述或其他特征。*^(³)\n\
  \n这是一个相当简单的解释，但我认为我们可以做得更好，让它更容易理解：\n\n> *维度是你所计数的对象的名称、描述或其他特征。*\n\n想象一下采集食物的穴居人。仅仅知道他们在一天内采集了\
  \ 100 颗浆果并不能区分生死。而知道他们采集了 50 颗美味的浆果和 50 颗有毒的浆果，这才是生死攸关的区别。这个至关重要的额外“维度”立刻使信息变得更有价值和有用。它将在未来帮助他们改变选择采集浆果的灌木丛，并为他们的未来提供一个“更健康”的前景。\n\
  \n与穴居人不同，对于大多数现代人来说，他们的数据不会在字面意义上决定生死，而是决定他们的事业在努力中能否成功。我们都希望在工作生活中获胜，因此确保拥有正确的维度来区分优劣将是我们工作的重要组成部分。\n\
  \n回顾我们在上一节中提到的指标示例，让我们为其中一些添加维度。了解维度会改变你从一个指标中接收到的信息。维度在以下列表中已加粗：\n\n* 一场体育比赛中 **各队**\
  \ 获得的进球或得分\n* 医学研究中的人数，以及了解他们的 **年龄、身高或健康水平**\n* 按 **来源国家、使用的设备类型，或是否购买** 划分的网站用户\n\
  * 线上销售产品的销售收入，按 **按国家划分的销售额或按类别划分的销售额** 细分\n* 一天内向用户展示的错误数量，按 **错误类型以及错误对客户影响的严重程度**\
  \ 细分\n\n如果你在寻找数据的维度时遇到困难，只需向自己描述它。如果你听到诸如“按……细分”或“每……”之类的神奇短语，你就会知道这些元素正在划分数据，并且在大多数情况下，能让你更好地了解维度如何影响你所计数指标。\n\
  \n让我们想想赫尔曼的蛋糕店。就我们的蛋糕而言，我们可以想到哪些信息有助于进一步了解哪些产品卖得好？\n\n我们知道我们在卖蛋糕，但还有其他维度可以从数据中细分出来，为我们提供更多背景信息。仅仅知道我们卖出了\
  \ 100 个蛋糕，并不能真正帮助我们的团队了解他们未来应该生产哪些类型的蛋糕。\n\n你通常可以通过查看你销售的产品，或询问企业或其客户，了解他们认为影响产品销量的“决定性因素”是什么，从而找出你所售蛋糕的最重要特征。仅仅问面包师产品之间有什么不同就是一个很好的开始。\n\
  \n* 蛋糕的尺寸是多少？是茶点蛋糕、杯子蛋糕，还是多层婚礼蛋糕？\n* 蛋糕的味道是什么？巧克力味、香草味、胡萝卜味还是香蕉味？\n* 蛋糕的装饰主题是什么？是只在顶部覆有糖霜的普通蛋糕，还是为一对即将结婚的新人精心装饰的蛋糕？\n\
  \n\n\n从烘焙店的例子可以看出，有很多决定因素与我们正在进行的销售相关。了解某些口味更受欢迎是一项至关重要的知识，因为这意味着烘焙师可以重点展示这些最受欢迎的口味。\n\
  \n最后要记住的一点是：大多数现代企业分析的都是“多维”数据——这意味着数据并非仅仅依赖于单一维度来解释。以我们的蛋糕为例，烘焙店会销售众多口味的纸杯蛋糕，但针对每一种口味，我们可能又有多种不同味道的奶油糖霜。我们还可能有多种不同的主题，而这些主题的销售情况又会根据星期几或季节的不同而有所差异。例如，无糖蛋糕可能会在某些特定人群中销量很好。\n\
  \n这就是优秀的数据开发者或数据可视化工程师的用武之地。维度为指标提供了背景信息，并帮助理解数据。你有能力在数据集上“尝试”一组维度，看看它是否能为最终用户提供更多洞察。你也可以查看数据是否与你试图实现的业务目标有很强的关联性。\n\
  \n## 本章小结\n\n在本章中，我们讨论了指标本身或聚合后的指标如何变得有价值，尤其是在结合维度考虑其背景信息时。\n\n脚注 1 2 3\n\n"
- "# 4. 在线调查\n\n案例研究：用户画像分析\n\n> *事实上，现代教学方法尚未完全扼杀神圣的好奇心，这简直就是一个奇迹。*\n> \n> ——阿尔伯特·爱因斯坦，理论物理学家\n\
  \n既然我们已经在前几章介绍了一些基础知识，让我们看看如何将 Google Data Studio 应用于另一个真实场景：分析在线调查产生的数据，为一位客户收集客户信息。本章基于我们为一家知名旅行公司所做的真实项目。客户无需昂贵的可视化工具就能获得对其客户数据的交互式分析，这不仅成本效益高，而且极其有用。这为我们的客户提供了洞察力，他们可以利用这些洞察来制定内容和营销策略，从而更精准地定位客户。\n\
  \n## 了解旅行公司的需求\n\n首先，我们需要进一步了解客户的需求。作为一家知名的旅行公司，他们希望我们帮助他们了解他们的客户是谁。\n\n## 收集数据\n\
  \n下一步是收集数据。我们向客户的客户发送了大约一万封电子邮件，邀请他们使用 `SurveyMonkey` 填写一份调查问卷。\n\n问卷询问了关于客户自身的问题：\n\
  \n*   性别\n*   年龄段\n*   薪资范围\n*   婚姻状况\n*   子女（及孙辈）情况\n*   职位头衔\n\n以及他们对方网站/服务的看法：\n\
  \n*   度假频率\n*   度假的原因\n*   是否喜欢网站的某些方面\n*   是否喜欢服务的某些方面\n\n我们还设置了自由文本问题，即一个文本框，允许他们输入信息，例如他们认为网站是否缺少某些内容，从而对一些关键问题获得更开放的回复。\n\
  \n在收到所有提交结果（约 5,000 份问卷）后，我们准备整理数据以用于报告。\n\n## 准备数据\n\n下一步是在将数据导入 Data Studio 之前对其进行准备。`SurveyMonkey`\
  \ 能够将结果导出为 `xls` 文件，这是一种我们可以轻松导入 Google Sheets 的格式。将结果上传到 Google Sheets 后，我们开始清理数据。\n\
  \n正如第 2 章所述，清理数据意味着确保数据集中的任何内容都是有效的。例如，尽管我们使用了公司的邮件列表（假设这些人希望收到关于该服务的联系），我们仍然收到了来自不想被打扰的人的“垃圾”回复。我们还必须删除任何被视为\
  \ `null` 或空白的回复。我们还需要确保所有列都有唯一的名称。别担心——每个数据集都会有问题。\n\n在这个案例中，我们处理的是一个相对较小的数据集，大约\
  \ 5,000 份问卷，我们可以直接从 Google Sheets 导入到 Data Studio。如果我们有更大的数据集，可以首先将其上传到 Google BigQuery，然后再以类似的方式导入到\
  \ Data Studio。\n\n清理完数据后，我们就准备将其导入 Data Studio。请确保您在同一帐户中有权限访问该 Google Sheets 文件，并且文件名是合适的。\n\
  \n在 Data Studio 中，首先创建一个报告。系统会提示您向报告添加数据源。只需点击 Google Sheets 选项（图 4-1）。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig1_HTML.jpg](img/485069_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n用于选择 Google Sheets 的点击按钮\n\n## 设计报告\n\n接下来，我们需要设计报告，使其既实用又美观。我们可以通过结构化数据呈现方式并保持元素在整个报告中的一致性来实现这一点。\n\
  \n保持报告中元素的一致性始终是件好事。这有助于增强整体连贯性，与公司品牌建立联系，并且视觉上令人愉悦。\n\n让一切看起来一致意味着你的客户会觉得报告更易于阅读。\n\
  \n### 页眉栏\n\n你可以做的一件事是添加一个包含公司徽标的页眉栏。你也可以使用纯文本页眉，但如果你有徽标，使用徽标看起来效果更好。\n\n要上传图片，请点击工具栏中的“图片”图标，并选择“从计算机上传”或“按网址上传”，具体取决于你的实际情况。然后，将徽标放置在报告页面的顶部某处。右键点击徽标并选择“设为报告级别”。这意味着如果你的报告有多页，该徽标将出现在每一页的顶部。\n\
  \n### 配色主题\n\n另一件可以做的事情是为报告设置一个配色主题，使其在整体上保持一致。如果你为其制作报告的公司有配色方案，你可以通过从图像（可以是公司的徽标，甚至是他们网站的截图）中提取配色方案，将其融入到你的报告中。\n\
  \n在工具栏上点击 `主题和布局`，在右侧窗格中点击 `从图像中提取主题`（图 4-2）。你可以从计算机上传图像，也可以按网址上传。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig2_HTML.jpg](img/485069_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n提取图像调色板按钮的截图\n\n然后你可以从生成的三款主题中进行选择。如果喜欢某一款，点击它并按下“应用”。如果你觉得提取结果的颜色多样性或对比度不足，可以手动编辑配色主题，使你的报告更好地符合公司或客户的风格。点击\
  \ `主题和布局` 窗格中的 `自定义` 按钮。\n\n### 页脚栏\n\n此外，考虑在报告底部创建一个页脚栏，其中包含如何联系你的信息，或者如果你是一家代理机构或内部团队，可以放置一个链接指向你的联系信息，以便有人需要调整某些内容时可以联系你。\n\
  \n你可以使用文本工具输入这些信息，并将其放置在页面底部。\n\n\n\n### 精细到颗粒度\n\n计划在展示数据时，将概览信息置于顶部，然后逐步深入到更详细和颗粒化的数据。通常，从较长的页面开始，然后从中进行精简会更容易。\n\
  \n我还建议对内容采用三分法或五五分原则——这意味着您可以将表格和图表设置为页面宽度的三分之一、三分之二或一半。您可以在报告三分之二和一半的位置画一条线，以此作为版面布局的参考线。您可以使用工具栏中的\
  \ `Line` 工具来实现。\n\n## 将数据添加到页面\n\n接下来，我们需要向报告中添加数据。如前所述，最好从概览数据开始，再逐步深入到细节。一个不错的方法是从饼图开始。\n\
  \n尽管饼图通常被认为对用户不太友好，因为难以解读精确的数值，但您仍可以在页面顶部使用它们（或环形图）来表示关键的筛选组。通过启用 `Interactions\
  \ – Apply Filter` 设置，几乎任何图表都可以与筛选器配合使用。这意味着，如果您点击环形图或饼图中的某个扇区，它将把这个筛选条件应用到数据源。\n\
  \n通常，我们会将此设置应用于所有其他图表和表格——这样，当人们点击数据行或数据切片时，所有这些图表和表格都能对报告进行筛选（见图 4-3）。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig3_HTML.jpg](img/485069_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3：“应用筛选器”按钮\n\n现在，我们拥有了一种非常直观的方式来查看报告中的数据，并且能够快速向下钻取来自同一数据源的所有表格和信息。如果我们有多个数据源，它通常只会应用于来自同一数据源的元素（如果您不希望筛选器应用于整个报告，也可以使用图表组）。\n\
  \n仅凭这些信息列表，对市场经理来说可能是有用的，但他们可能已经知道其中的大部分内容。因此，为了使其更有价值，我们将维度组合在一起；这能让我们获得更深入的洞察。我们可以使用数据透视表，或更图形化地使用堆叠图来实现。例如，如果我们使用堆叠柱状图，可以结合性别、婚姻状况以及是否有孩子等数据。见图\
  \ 4-4。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig4_HTML.jpg](img/485069_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4：堆叠柱状图\n\n至此，我们可以看到，此表单中的大多数受访者已婚，且年龄大多在 55 岁以上。这促使我们思考：*数据中是否存在任何偏差？这些人是否更有可能填写调查问卷？*\n\
  \n数据透视表也能提供更深入的洞察，尤其是在使用热力图的情况下。这可以与营销人员用于决策的问题结合起来。\n\n数据透视表热力图（图 4-5）将购买频率与人口统计信息结合在了一起。根据此图，营销应针对更成熟的群体，以吸引频繁购买的忠实客户。\n\
  \n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig5_HTML.jpg](img/485069_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5：按年龄显示购买频率的数据透视表示例\n\n您可以将此表与其他相关的可视化图表（图 4-6）结合起来，观察与其中一个交互时如何影响另一个。这些数据之间的关系可能非常吸引人，而创建这些交互的最简单可视化工具就是饼图。然而，如前所述，我们应尽量避免使用饼图，因为人类不擅长解读和比较角度。许多专家建议，对于简单的筛选，改用树图或柱状图。尽管如此，饼图仍然是下拉框的一个不错的替代方案。\n\
  \n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig6_HTML.jpg](img/485069_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6：饼图和树图演示如何展示可用作筛选器的数据\n\n两种图表类型都可以设置成应用筛选器，这意味着它们可以与驱动决策的更详细信息一起使用。例如，它们可以用来理解网站上某个特定功能的影响。\n\
  \n## 自由文本分析\n\n调查中有一些自由文本框，我们可以从多个不同的角度进行分析。如果有足够的条目，很可能会出现一些重叠或实质相同的回答。这可能有点挑战性，但通过一些分析，我们可以进一步挖掘数据。\n\
  \n在调查中，我们询问了产品描述中是否有遗漏的内容。图 4-7 显示了最主要的回答。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig7_HTML.jpg](img/485069_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7：针对问题“产品描述中是否有遗漏？”的自由文本结果表\n\n理想情况下，我们希望整合相似的结果，并移除 `null`，或将其替换为“无回答”。\n\
  \n-   对所有回答执行 `Lowercase`（转换为小写）和 `Trim`（去除空格）操作\n-   使用 `Case`（条件判断）语句来整合常见的模式\n\
  \n最终，最好能使用机器学习进行智能提取，这可以低成本且越来越容易地实现，但那是另一本书的主题了。目前，我们可以使用 `Data Studio` 中的工具来处理。\n\
  \n`Null` 可以很容易地在格式设置中（缺失数据）替换为 `no data`，同时，我们还可以改进文本处理，对较长的回答将其更改为 `Wrap Text`（自动换行）。见图\
  \ 4-8。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig8_HTML.jpg](img/485069_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8：表格的格式选项\n\n我们还可以为常用词添加额外的分类。社区选择器中有一些词云可视化选项，但没有一个完全符合我们的需求。所以，第一部分几乎是手动分析；当我们发现常见模式时，就可以使用\
  \ `case` 语句——例如，如果我们想突出特定的主题——有些人提到了图片，有些人提到了游泳池，有些人提到了厨房。\n\n在图 4-9 中，我们可以看到如果文本包含特定单词，我们如何对其进行分类，这允许我们根据输入了特定关键词（如图\
  \ 4-10 所示）的人员来筛选报告。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig9_HTML.jpg](img/485069_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9：包含条件判断语句的自定义字段\n\n一个小问题是，使用此方法，每个条目只能归入一个主题。因此，如果它提到了照片或图片，就不会再被计入“游泳池”主题；正因如此，`case`\
  \ 规则的顺序/优先级非常重要。此外，这确实让我们有能力创建一个简单的下拉列表，以便您发现和分析常见主题。当然，此下拉列表也会应用于报告中的所有其他数据。见图\
  \ 4-10。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig10_HTML.jpg](img/485069_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10：下拉筛选器中的分类文本\n\n## 最终结果\n\n所以，现在我们拥有一个基于调查数据的交互式报告，它允许营销人员深入其中并形成自己的洞察。最棒的是——对其进行调整和改进非常容易。见图\
  \ 4-11。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig11_HTML.jpg](img/485069_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11：使用热力图数据透视表和环形图输出数据\n\n\n好的，作为高级文档工程师和翻译员，我将严格按照您的要求，完成以下翻译工作。\n\n\n## 回顾\n\
  \nGoogle Data Studio 不仅仅是分析数据的前端工具。它可以作为调查数据的展示层，就像`Excel`这类工具一样，但它能让数据在线化，并可供所有人访问。\n\
  \n我们可以使用简单的字符串函数在工具内改进和清理数据，还可以应用其他转换，基于自由文本或整合某些维度来创建自定义字段。最终，Google Data Studio\
  \ 是一种将数据集以易于理解的方式呈现出来的强大方法。对某些人来说，这是比 Google Sheets 等复杂后端工具更好的前端，但必须注意确保数据一开始就采用正确的格式。\n\
  \n"
- '# 5. 市场营销数据可视化


  > *“请你告诉我，我该走哪条路？”爱丽丝问。*

  >

  > *“那很大程度上取决于你想去哪儿。”猫说。*

  >

  > *“我去哪儿都无所谓。”爱丽丝说。*

  >

  > *“那你走哪条路都无关紧要。”猫说。*

  >

  > ——*《爱丽丝梦游仙境》*，刘易斯·卡罗尔


  在本章中，我们将聚焦于世界上一些最佳、最具变革潜力的数据源，即网站分析（也称为站点内分析），并学习如何在报告中呈现这些数据。


  ## 网站分析的价值


  大多数企业都是数据工厂，源源不断地输出关于自身运营状况的数据。就像真正的工厂一样，这些数据流永不停歇，除非有人搞砸了或者企业停止交易。数据可视化工程师的职责，就是将这些数据流转化为企业可用于驱动价值的洞察。将来自众多数据源的信息进行加工，将是您新掌握的
  Data Studio 技能所能处理、混合和合并的最有价值的贡献之一，这能带来大量的洞察和影响力。


  网络商店现在被视为公司业务的重要组成部分，因此查看网络商店的网络分析很有价值，因为您可以了解网站如何以及为何工作，以及如何改进它以推动更多业务。


  网站分析提供了许多从根本上改变企业绩效的绝佳机会，然而许多企业都犯了同样的错误：轻视它，甚至完全忽视它。


  对我来说，站点内网站分析的一个简单定义是：


  > *我的网站发生了什么？*


  已经有整本书籍专门论述分析这一主题，内容详尽。我在此不会复述同样的信息，而是会引导您去一个能提供高层总结的资料来源。


  请查阅维基百科的网络分析页面，在我看来，那里有着最好的定义之一：[`https://en.wikipedia.org/wiki/Web_analytics#Web_analytics_technologies`](https://en.wikipedia.org/wiki/Web_analytics%2523Web_analytics_technologies)。


  我建议您快速浏览一遍，试图为自己建立一些关于分析的背景知识，尤其要阅读一下关于更常见的“站点内网络分析”部分。


  ### 可视化您的受众规模


  网络分析能影响到大量潜在客户，以至于人们很难理解它的强大之处。如果只看数字，3000 人和 30000 人看起来可能非常相似。


  这里有一个真实的例子。在为一位客户研究网站分析数据后，我建议我们为一家家具零售商增加一个“推荐朋友”计划。我们不必深究原因，但可以说数据引导我朝那个方向思考。由于他们每月有数百万的访客访问他们的网站，这个推荐计划能够非常迅速地扩展规模。仅过了一两个月，我们就发现他们非常迅速地获得了大量新客户。当我在演示文稿中向他们展示新客户的数量时，我记得反应平淡，因为这仍然被视为公司的一个小型渠道。


  几周后，当我再次展示这些数字时，我尝试让报告更具吸引力。我没有报告新客户的实际数量，而是向他们展示了一张特定足球场的图片，并说我们可以用从“推荐朋友”计划来的新客户填满这个球场的两倍。得到的反应是掌声！这是同样的数据，同样的结果，呈现给两个相似的团队，但呈现方式不同。


  ### Google Analytics


  自十多年前首次创建以来，Google Analytics 已成为最流行的网站分析选择。现在很难找到一个网站没有使用其代码追踪部分信息。可以说，Google Analytics
  的一个关键缺点，也是 Data Studio 诞生的主要原因之一，就是为了创建简单且引人入胜的仪表盘平台。图 5-1 展示了旧的 Google Analytics
  仪表盘。


  ![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig1_HTML.jpg](img/485069_1_En_5_Fig1_HTML.jpg)


  图 5-1


  旧的 Google Analytics 仪表盘


  Google Analytics 多年来一直内置仪表盘功能；然而，在大多数国家，这从未得到广泛应用，因为：


  *   它要求用户登录 Google Analytics。

  *   Google Analytics 仪表盘难以共享和更改。

  *   您可用的数据控件数量有限。


  让我们开始使用 Google Analytics 进行数据可视化。


  ## 开始使用 Google Analytics 进行可视化


  要做的第一件事是获取数据进行分析。为了学习，我们将使用一些练习数据，并且为了快速上手，我们将使用模板。


  ### 获取练习用市场营销数据


  在我们开始处理数据之前，我们需要获得一些可以进行练习的数据。Google Analytics 团队提供了几个可以在 Data Studio 中使用的数据集，以帮助我们所有人学习。


  我们将在下一个练习中使用的数据集是 Google 商品商店数据，它包含了访问 [`https://shop.googlemerchandisestore.com/`](https://shop.googlemerchandisestore.com/)
  的所有访客和客户。见图 5-2。这些数据的一大优点是，它有效地让我们了解了真实网站数据的样貌，而无需投入巨资建立我们自己的网站。需要注意的一点是，数据中偶尔会出现一些通常不合逻辑的异常情况；不过，我很确定这是因为这些数据是为了演示某些功能而创建的。总的来说，这些数据对于大多数学习目的来说非常合适；但是，在将其与您自己的数据进行比较时要谨慎。另外，不用担心破坏账户的潜在风险。您不会做错任何可能损坏数据的事情。


  ![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig2_HTML.jpg](img/485069_1_En_5_Fig2_HTML.jpg)


  图 5-2


  来自模板库的 Google Analytics 商品报告




  ### 获取 Google Analytics 演示数据


  可以通过链接访问演示数据。


  ![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig3_HTML.jpg](img/485069_1_En_5_Fig3_HTML.jpg)


  **图 5-3**

  Google Analytics 演示账号


  1. 请确保您已注册 Google Analytics 账号，方法是访问 [`https://analytics.google.com`](https://analytics.google.com)
  并登录或创建账号。

  2. 访问演示账号帮助中心文章 ([`https://support.google.com/analytics/answer/6367342`](https://support.google.com/analytics/answer/6367342))。

  3. 点击“访问演示账号”按钮。

  4. 这会将演示账号添加到您的 Google Analytics 账号中。您可以通过点击页面顶部的“账号选择器”，然后选择“演示账号”（如图 5-3 所示）来确认此操作。


  如果您使用的是真实的 Google Analytics 数据，只需使用真实账号重复上述步骤即可。


  ### 使用 Data Studio 模板创建报告


  在快速开始构建您自己的 Data Studio 报告时，模板非常有用。您可以利用它向业内高手学习正确的方法。让我们从学习如何从模板库构建您自己的报告开始。


  选择屏幕右侧的`模板库`按钮。


  当您选择`模板库`按钮后，您将看到由 Google Analytics 团队制作的各种报告的完整列表（图 5-4）。


  ![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig4_HTML.jpg](img/485069_1_En_5_Fig4_HTML.jpg)


  **图 5-4**

  模板库提供了大量可供使用的模板


  选择底部行中的 `Google 商品商店` 作为模板。然后点击页面蓝色条中的“使用模板”。


  选择相关报告并点击“使用模板”后，您可以选择使用现有数据源或创建自己的数据源。


  由于并非所有人都能访问包含实时数据的分析账号，幸运的是，Google 设法分享了其 Google 商品商店的数据——这是您在学习过程中尝试的绝佳资源。


  接下来，点击“新数据源”下的“选择数据源”。您将看到一个类似于图 5-5 的界面。只需从“数据源”下方的下拉菜单中选择 `Google Analytics 演示`
  数据。


  ![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig5_HTML.jpg](img/485069_1_En_5_Fig5_HTML.jpg)


  **图 5-5**

  复制报告选项


  选择 `复制报告`，然后双击报告名称并将其命名为“GA 学习报告”。


  然后您就可以开始探索这份新报告了。我强烈建议大家点击各个报告，并查看它们在“属性面板”中的属性。


  现在，您可以使用 Google 提供的任何现有模板来创建自己的报告。


  ### 使用更多演示数据进行练习


  学习新技能的最佳方法是足够多次地模仿专家的做法，直到它成为您的第二天性。这将帮助您开始构建 Data Studio 技能，使其成为您的本能，从而使您能够更专注于报告的内容，而非报告的创建。


  幸运的是，Data Studio 有两个主要场所，您可以在那里学习如何可视化那些经常使用数据的人提供的数据：


  * 模板库 ([`https://datastudio.google.com/u/0/navigation/reporting`](https://datastudio.google.com/u/0/navigation/reporting))

  * Data Studio 报告库 ([`https://datastudio.google.com/gallery`](https://datastudio.google.com/gallery))


  现在，我们将重点放在模板库上，以便快速上手。对于那些希望为自己的网站构建报告的用户，Google 团队通过其模板库提供了大量预制报告。模板库如图 5-6 所示。


  ![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig6_HTML.jpg](img/485069_1_En_5_Fig6_HTML.jpg)


  **图 5-6**

  模板库


  当您浏览到 Data Studio 主页时，通常可以在页面顶部找到这些模板。


  Data Studio 一直在不断发展，并且总有新的改进可以添加到您的报告中。


  ## 本章小结


  在本章中，我们讨论了网站分析的价值，并使用演示账号和模板测试了 Google Analytics 的可视化功能。


