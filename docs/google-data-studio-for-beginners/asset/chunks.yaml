  trans: '

    # 首次混合：选择两个数据源并混合数据


    混合数据有两种方法。最简单且通常是入门方式的做法是，直接将两个图表混合在一起。如果你想合并两个图表，只需同时选中这两个图表（先选中第一个，按住 `shift`
    键，再选中第二个），然后右键单击（Mac 系统上按住 `control` 键单击），选择“混合数据”（Blend data）（图 6-1）。如果 Google
    数据洞察能找到一个公共键（例如 `date`），它就能神奇地自动完成操作，令人惊叹——突然间，我们就在一个图表上拥有了两个数据源。


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig1_HTML.jpg](img/485069_1_En_6_Fig1_HTML.jpg)


    **图 6-1** – 通过选中两个图表来混合数据


    如果你发现一个数据源与另一个数据源的量级完全不同，例如，我们将网站流量与天气数据合并，我们可以将其中一个系列分配到时间序列图表的右侧 Y 轴，以便两者都能以更合适的比例显示。你可以在
    `图表` ➤ `表格` ➤ `样式` 窗格（图 6-2）中访问这些选项。如此简单，如此强大，并且适用于大多数基于时间的图表。如果你已经合并了两个图表以创建第三个图表，你可以成功删除前两个图表。


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig2_HTML.jpg](img/485069_1_En_6_Fig2_HTML.jpg)


    **图 6-2** – 将第二个指标移至右侧 Y 轴


    ## 添加更多数据或更改混合


    如果我们使用第一种方法（选中两个图表并点击 `混合数据` 选项）合并了两个数据源，我们可能会发现想要添加一个过滤器，或者添加一个图表中原本没有的指标，我们可以编辑这个混合。混合后的数据源会像前两个数据源一样被添加到你的数据源列表中——它通常被糟糕地命名为“混合数据
    (1)”。让我们先修改它的名称。如果我们点击数据源旁边的铅笔图标（图 6-3），在屏幕右侧窗格中，你可以看到“数据源名称”并进行编辑（图 6-4）。


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig4_HTML.jpg](img/485069_1_En_6_Fig4_HTML.jpg)


    **图 6-4** – 数据混合的初始名称


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig3_HTML.jpg](img/485069_1_En_6_Fig3_HTML.jpg)


    **图 6-3** – 编辑数据源名称


    只要数据匹配允许，我们可以添加更多的指标和维度；如果数据没有正确的键，或者数据无法匹配，这当然不会生效，或者会给出错误的结果。


    一个例子是与着陆页匹配的指标，包括转化率和跳出率——但如果我们使用页面浏览量指标，这些数据就不会正确。


    我们可以编辑新连接的名称、添加维度、添加指标，还可以添加使用原始两个连接的计算指标——例如，我们可以找出从 Google Search Console 到
    Google Analytics 的点击与会话之比，看看自然流量匹配程度如何（图 6-5）。


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig5_HTML.jpg](img/485069_1_En_6_Fig5_HTML.jpg)


    **图 6-5** – 混合中的计算指标


    ## 混合的关键


    请记住，混合需要一个键来关联——这个键可以像 `date` 一样简单，如果两个数据源的时间范围重叠且粒度相似，通常可以匹配。对于更复杂的情况，我们可能需要稍微修改数据，以确保双方能够匹配。


    一个例子是获取 Google Search Console (GSC) 的页面级数据和 Google Analytics 的数据。我们可以使用 Google
    演示帐户进行此示例（图 6-6）。我们可以很快发现两件事：在 Search Console 中，它是完整的 URL，但在 Google Analytics
    中，它只跟踪页面路径。


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig6_HTML.jpg](img/485069_1_En_6_Fig6_HTML.jpg)


    **图 6-6** – 比较将要混合的维度的表格


    我们还可以看到，GSC 中的大小写与 Google Analytics 中的不同，这是因为有人对其进行了过滤；这些差异使得混合更具挑战性，但两者都很容易克服。图
    6-7 展示了如何编辑一个字段。


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig7_HTML.jpg](img/485069_1_En_6_Fig7_HTML.jpg)


    **图 6-7** – 编辑字段


    我们也可以使用字符串函数将所有内容转换为小写并移除域名，这样两个“着陆页”就相同了。


    ## 手动创建混合


    我们可能想要合并来自 Google Search Console 和 Google Analytics 的某个页面的指标，但这样做时，我们会遇到一些初始问题——首先，将你的第一个数据源——Google
    Search Console 添加到页面——我们此处使用 Google 演示帐户。


    我们希望在单个表格中看到来自 Google Search Console 的展示次数、点击次数，以及来自 Google Analytics 的跳出率和转化率。


    让我们以这个页面为例：


    `shop.googlemerchandisestore.com/Google+Redesign/Shop+by+Brand/YouTube`


    在 Google Search Console 中，这是着陆页 URL，但在 Google Analytics 中，着陆页看起来像这样：


    ```

    /google+redesign/shop+by+brand/youtube

    ```


    全部小写且没有域名（和子域名），因此我们编辑数据源（尽管我们无法对演示帐户执行此操作，所以请跟随着操作）。首先，点击已添加到报表中的数据源旁边的铅笔图标；其次，我们需要通过点击
    `添加字段` 按钮来添加一个新字段（因为我们无法修改原始数据源）。


    我们可以使用 `lower` 函数将其转换为小写，保存，并给它一个新名称；然而，我们打算一步完成两个操作，以便输出与前面的示例匹配，另一个操作是移除 URL
    的域名部分；为此，我使用了 `replace` 命令，最后为其命名并点击保存。我打算将其命名为 `着陆路径 (Landing Path)`，因为这很好地反映了它的本质。


    所以现在当我们把它添加回报表时，它会匹配 Google Analytics (GA) 中的数据，这意味着它已经准备好进行混合了！


    选中第一个数据源（来自 Google Search Console）后，点击 `混合数据`，然后点击“添加另一个数据源”；现在我们就能得到一个包含来自 Google
    Analytics 和 Google Search Console 的指标的表格——一个包含所有页面所有指标的单一表格。


    我们可以更进一步，对页面进行分组，这对于电子商务网站来说就变得非常激动人心了——有多少流量进入了产品页面、分类页面和博客站点——突然间，我们就对网站的运行方式有了深入的了解；要做到这一点，我们可以使用
    `case` 语句对页面进行分组，但您需要提前对数据进行处理，确保混合双方匹配。见图 6-8 至图 6-12。


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig9_HTML.jpg](img/485069_1_En_6_Fig9_HTML.jpg)


    **图 6-9** – 使用 `case` 语句对页面进行分类


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig8_HTML.jpg](img/485069_1_En_6_Fig8_HTML.jpg)


    **图 6-8** – 用于将着陆页文本转换为小写并去除域名的公式


    这正是营销经理们喜欢的综合性报告，粒度足够细，可以获取洞察，同时又足够宏观，可以看到趋势和变化。


    `case` 语句是一种绝佳的方式，可以回顾性地对内容进行分组以进行分析和观察趋势，因为它可以使用正则表达式，这比其他更简单的匹配方式更强大。

