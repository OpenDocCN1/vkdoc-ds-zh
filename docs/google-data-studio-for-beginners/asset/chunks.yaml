    # 哎呀，蜘蛛图表！


    雷达图，或称“蜘蛛图”，在一般商业咨询和战略分析中是一种非常有用的数据可视化工具。它以简洁优雅的方式回答了这样一个问题：“我们应该把重点放在哪里？”


    蜘蛛图由多条等角线组成，每条线代表不同的度量指标。在图 7-9 的蜘蛛图中，我们绘制了三名学生的得分情况。


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig9_HTML.jpg](img/485069_1_En_7_Fig9_HTML.jpg)


    图 7-9

    “蜘蛛图”


    在这个蜘蛛图中，我们可以这样解读：学生 1 在英语、数学和法语等科目上表现确实不错，但在舞蹈和体育等身体活动方面却是全班最差的。因此，老师可以通过鼓励该学生多参加体育活动，或者尝试找到他们喜欢并能得到锻炼的事情来帮助他们。


    在所有老师中，数学老师似乎让所有学生都持续获得了更好的成绩，因此应该对其工作予以表扬。


    简单而强大。


    > **提示**：筛选功能同样适用于社区可视化图表。因此，如果你想将一组学生单独提取到他们自己的图表中，只需复制图表并添加一个筛选器即可。


    这款蜘蛛图社区可视化图表是使用一个名为“Chart.js”的免费开源图表库创建的，该库功能强大且制作精良。此外，它还具有对任何人开放使用或共享的价值。


    ## 回顾


    在本章中，我们深入探讨了如何让你的 Data Studio 报表看起来更具定制化，以及如何整合其他数据源。最后，我们回顾了几款流行的 Data Studio
    社区可视化图表。


    # 8. 何必止步于此？


    Data Studio 的唯一限制是你的想象力


    > *路？我们要去的地方，不需要路。*

    >

    > ——埃米特·布朗博士，《回到未来》（1985 年）


    我（格里）几乎可以称得上过度使用 Data Studio 了。当我想要可视化或分析某些东西时，令人惊讶的是，在审计客户的分析数据时，我经常求助于 Google
    Data Studio。我会创建尽可能长的页面，并连用多个表格来展示问题，周围配上一些文字说明。利用自定义格式，我可以突出关键问题，然后从那里开始监控它们是否已被解决。我会为每个广告活动创建可视化图表，并用它来展示我希望客户查看、交互但不能编辑的数据表格。


    数据通常很有趣，常常很美观，有时甚至令人着迷。关键在于解读。如果你还没有机会阅读史蒂芬·都伯纳和史蒂芬·列维特合著的《魔鬼经济学》（2005 年），书中解释了为什么相关性不等于因果性，这绝对是关于如何解读数据的一本推荐读物。


    想想数学家亚伯拉罕·沃尔德在考虑如何最大限度地减少轰炸机被敌方炮火击落时，将幸存者偏差纳入计算中的那个不可思议的故事。他提出，不要在弹孔多的地方增加装甲，而应该在弹孔少的地方增加装甲。理由是，在这些区域被击中的飞机很可能没能返航，因此无法被计数。为了本书的目的，这个故事和其中的数学原理被过度简化了，但你明白了其中的道理。关键是，没有全局图景，数据常常毫无意义。相关性并不总是等于因果性。有时它只是随机的，有时则出于其他原因。


    令人惊讶的是，有多少数字营销人员是“渠道中心论者”。他们只关注自己渠道的表现，在观察表现下降或上升时，不考虑来自其他渠道的蚕食效应。Google Data
    Studio (GDS) 使我们能够共享来自整个业务部门的数据子集，从而让我们拥有更广阔的视野。我们能够有效地开始看到缺失的部分，然后我们就真正知道该在哪里加固飞机或改善业务了。


    如果有效使用，Google Data Studio 能帮助我们接触到更完整的图景。这是一个工具，它能将通常难以整合的、来自多个数据源的数据汇集到一个地方，并且如果配置正确，它还能为我们提供准确的图景。


    到现在为止，我们希望你已经看到了 GDS 如何让你追溯性地清理数据，如何让你对数据进行细分和共享，如何为更多人提供更完整的图景，并且如何构成一个出色的演示层。


    在本章中，我们将讨论一些使用 Google Data Studio 的有趣方式。


    ## 博客效果


    我（格里）所在的公司通过游戏化的方式激励员工撰写更多博客文章：谁的博客文章在年底前获得最多浏览量，谁就获胜。我没花多少时间就使用 Data Studio 为这个激励活动创建了一个可视化图表。


    考虑到目标受众（我的队友）的需求和习惯，我点击 **“共享”** 下拉按钮，选择 **“嵌入报表”**（图 8-1）来嵌入报表。然后我将报表的尺寸设置为手机屏幕大小，启用了嵌入功能，并分享了“嵌入”网址（图
    8-2）。这意味着团队可以在手机上查看它，而无需使用工作电脑。


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig2_HTML.jpg](img/485069_1_En_8_Fig2_HTML.jpg)


    图 8-2

    报表的嵌入选项，附有适合在手机上查看的推荐尺寸


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig1_HTML.jpg](img/485069_1_En_8_Fig1_HTML.jpg)


    图 8-1

    嵌入报表选项


    在我报表的一张图表中，如图 8-3 所示，我们可以清楚地看到，目前领先的是那篇关于 Python 脚本、增长最稳定的文章。与作者分享内容数据，会促使他们创作更多、质量更高的内容。一个内容仪表盘可以展示所选文章的排名关键词，或者该页面的参与度。我还创建了额外的标签页来追踪数据的其他视图，部分原因是为了确保所有参与度指标设置正确，并且我们还把作者作为一个自定义维度追踪到分析系统中。


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig3_HTML.jpg](img/485069_1_En_8_Fig3_HTML.jpg)


    图 8-3

    某代理商网站上博客文章的累计页面浏览量


    在 Data Studio 中创建这个小组件，促使更多同事开始制作报表，并关注交付质量。记住，如果你尝试这个，你可以按照自己的喜好设计报表样式，并将其嵌入到随时间变化的网页中。


    ## 广告活动效果迷你报告


    对于我们做的每一个代理商广告活动，我们都会快速创建一个广告活动效果报告，通常基于 Google Analytics 数据，但经常定制以提取诸如视频分享（包括
    YouTube 数据）之类的互动行为。当公关团队记录媒体报道时，这些数据会进入一个 `BigQuery` 表（甚至存储截图），然后可以被接入，瞬间变成一个可以轻松与客户共享并提供内部进度报告的报表。


    将来自多个数据源的数据在报表中合并、混合，并且可以轻松快速地与客户共享，这在几年前我们还只能梦想。

