  raw: '## How to Use Calculated Metrics in Blends


    I (Gerry) once worked on a project where we were unsure about the accuracy of
    Google after a migration. We wanted to compare the organic traffic to the clicks,
    and so we followed the steps of combining the clicks to the organic traffic –
    a graph of Clicks from Google Search Console and a graph of Google Organic traffic
    (created by adding a filter to a graph of sessions). See Figure [6-10](#485069_1_En_6_Chapter.xhtml#Fig10).


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig10_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Applying a filter to a graph


    We selected both graphs and blended. The graph that came out was perfect, but
    we wanted to be able to calculate the difference between the two – so we add in
    other metrics. See Figure [6-11](#485069_1_En_6_Chapter.xhtml#Fig11).


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig11_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig11_HTML.jpg)


    Figure 6-11


    Adding additional metrics


    Adding metrics gives us the ability to include a new calculated metric based on
    these two. See Figure [6-12](#485069_1_En_6_Chapter.xhtml#Fig12).


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig12_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig12_HTML.jpg)


    Figure 6-12


    Calculating a metric within a blend


    And suddenly we get a running relationship between the clicks into the website
    and the data – ideally if you have filtered to just organic, it typically lies
    within the range of 0.5 and 1.5 and is something I often test when auditing websites.
    As it is a ratio, it is important to set the aggregation to “Average”; else it
    might start to become incorrect when displayed later.


    Using the average number in the graph, I usually set it to being on the right-hand
    side while still displaying the other two numbers and making it bolder; this can
    be done by clicking on the graph and clicking into the style tab of the configuration.


    The opportunities with blended data are only really limited by your imagination –
    it is always worth making sure that the blends are accurate and that nothing is
    being aggregated or you are doing anything that delivers incorrect results but
    discovering sources of data and the impact on others is a marketing analyst’s
    dream.


    ## Recap


    Blending of data is initially quite daunting, but by following the steps and knowing
    what you want to achieve, hopefully you can see that it is a good option which
    isn’t as challenging as it would appear on the outside. It is powerful and can
    deliver to you insights that wouldn’t normally be available.


    Remember that the key must match up and that the data must be able to match using
    this key and everything else will fall into place. Blending two charts is the
    easiest way to get started, but from there it can be increasingly more intricate.


    # 7. Custom Data Visualizations


    Over the course of the previous chapters, we have been showing you how to connect
    your business data to Data Studio and make it actionable. The challenge is that
    despite Data Studio being a superbly flexible tool, there are always going to
    be use cases that it’s not able to solve for. This is due to the fact that if
    Data Studio was to cover everything, it would reach the point where it starts
    to become bloated and harder to maintain (as well as needing an army of developers
    to keep it going)!


    The aim for most data products, as well as Data Studio, is simply to cover the
    majority of use cases in an easy way, and create frameworks to allow others to
    extend Data Studio to answer their own use cases.


    Typically, these “extensions” would require someone who knows how to use JavaScript,
    in order to build out this functionality. When it comes to actually using these
    extensions in your reports, you don’t need to know any programming languages,
    and they will function in exactly the same way as your other elements in Data
    Studio.


    ## What Customizations Does Data Studio Offer?


    There are two types of customizations that you can leverage if you want to extend
    Data Studio:


    *   Custom community connectors


    *   Custom community visualizations


    ## Custom Community Connectors


    If you find that the platform that you are using doesn’t have the ability to connect
    into Data Studio or one of the standard file formats that it uses, then you can
    choose to build your own community connector.


    Custom community connectors are the standard way to connect Data Studio to pretty
    much any data source you can think of if the readily available connectors do not
    suffice.


    Community connectors are usually built using Apps Script which is Google’s standard
    scripting language for building add-ons for Google’s suite of productivity tools.


    The scope of building a connector is actually pretty straightforward if you have
    used Apps Script previously. Google has provided a great deal of useful resources
    on their developer site ([`https://developers.google.com/datastudio/connector`](https://developers.google.com/datastudio/connector))
    including some premade templates.


    Tip


    If you are interested in learning more about Apps Script and seeing what else
    you can build with it, then you can find out more at [`https://developers.google.com/apps-script`](https://developers.google.com/apps-script).


    Once a Data Studio connector has been created, then it can be shared with others
    either by publishing it in the Data Studio Connector Gallery or by sharing a link.
    The Connector Gallery will require someone at Google to review and pre-approve
    it prior to publishing.


    ## Custom Community Visualizations


    Custom community visualizations are a newer feature than custom connectors and
    give you access to make your reports look beautiful and bespoke. A custom visualization
    can be added when you are not satisfied with any preexisting ways that will adequately
    display the data you are trying to show.


    As an example, if I worked for a theater company, and I wanted to display critics’
    review scores and reviews, I would want to find a way to process the data into
    a final star rating visualization for my report. I could think about potentially
    using something like a “Scorecard” or a “bar graph” control, but it won’t give
    me the instant understanding when compared with a user seeing several stars next
    to a review. If you look at Figure [7-1](#485069_1_En_7_Chapter.xhtml#Fig1), you
    can see an example of the “Customer Reviews” visualization by Baguette Engineering
    which displays


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig1_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    “Customer Reviews” visualization by Baguette Engineering


    *   Name of the item being reviewed (in this case Movie Name)


    *   Star rating out of five


    *   Date that the review was posted


    *   Quote or comment from the review'
  trans: "\n# 如何在数据混合中使用计算指标\n\n我（格里）曾参与一个项目，当时我们不确定迁移后谷歌数据的准确性。我们想将自然流量与点击量进行比较，于是按照步骤将点击量与自然流量结合起来——即来自\
    \ Google Search Console 的点击量图表和谷歌自然流量图表（通过对会话图表添加过滤器创建）。见图 6-10。\n\n![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig10_HTML.jpg](img/485069_1_En_6_Fig10_HTML.jpg)\n\
    \n**图 6-10** 对图表应用过滤器\n\n我们同时选中这两个图表并进行混合。生成的图表很完美，但我们希望能计算两者之间的差值——于是我们添加了其他指标。见图\
    \ 6-11。\n\n![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig11_HTML.jpg](img/485069_1_En_6_Fig11_HTML.jpg)\n\
    \n**图 6-11** 添加额外指标\n\n添加指标使我们能够纳入基于这两者的全新计算指标。见图 6-12。\n\n![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig12_HTML.jpg](img/485069_1_En_6_Fig12_HTML.jpg)\n\
    \n**图 6-12** 在混合中计算指标\n\n突然间，我们得到了网站点击量与数据之间的动态关系——理想情况下，如果你已过滤为仅自然流量，该值通常落在 0.5\
    \ 到 1.5 之间，这也是我在审计网站时经常测试的内容。由于这是一个比率，将聚合设置为`\"平均\"`很重要；否则，后续显示时可能会变得不准确。\n\n\
    使用图表中的平均值，我通常将其设置在右侧，同时仍显示其他两个数值，并使其更粗体显示；这可以通过点击图表并进入配置的样式选项卡来实现。\n\n混合数据的机会实际上只受限于你的想象力——确保混合准确无误，没有发生任何聚合操作，或没有做出任何导致错误结果的行为总是值得的；但发现数据来源及其对其他数据的影响，是每个营销分析师的梦想。\n\
    \n## 回顾\n\n数据混合一开始可能令人望而生畏，但通过遵循步骤并明确目标，希望你能看到它是一个不错的选择，并没有看上去那么具有挑战性。它功能强大，能为你提供通常无法获得的洞察。\n\
    \n请记住，键必须匹配，并且数据必须能够使用这个键进行匹配，其他一切就会水到渠成。混合两个图表是最简单的入门方式，但从此处开始，可以变得越来越复杂。\n\n\
    # 7. 自定义数据可视化\n\n在前几章中，我们一直向你展示如何将业务数据连接到 Data Studio 并使其可操作。挑战在于，尽管 Data Studio\
    \ 是一个极其灵活的工具，但总会有它无法解决的用例。这是因为如果 Data Studio 要涵盖所有内容，它就会变得臃肿且难以维护（同时还需要一支庞大的开发者团队来维持其运行）！\n\
    \n大多数数据产品（包括 Data Studio）的目标，仅仅是以简单的方式覆盖大多数用例，并创建框架，让其他人能够扩展 Data Studio 以满足自己的用例。\n\
    \n通常，这些“扩展”需要了解如何使用 JavaScript 的人来构建此功能。但在报表中实际使用这些扩展时，你不需要了解任何编程语言，它们的工作方式与 Data\
    \ Studio 中的其他元素完全相同。\n\n## Data Studio 提供哪些自定义功能？\n\n如果你想扩展 Data Studio，可以利用两种类型的自定义功能：\n\
    \n- 自定义社区连接器\n- 自定义社区可视化\n\n## 自定义社区连接器\n\n如果你发现所使用的平台无法连接到 Data Studio 或它使用的标准文件格式之一，那么你可以选择构建自己的社区连接器。\n\
    \n如果现成的连接器不够用，自定义社区连接器是将 Data Studio 连接到你能想到的几乎任何数据源的标准方式。\n\n社区连接器通常使用 Apps Script\
    \ 构建，这是谷歌的标准脚本语言，用于为谷歌的生产力工具套件构建附加组件。\n\n如果你之前使用过 Apps Script，那么构建连接器的范围实际上相当简单。谷歌在其开发者网站（`https://developers.google.com/datastudio/connector`）上提供了大量有用的资源，包括一些预制的模板。\n\
    \n> **提示**\n> \n> 如果你有兴趣了解更多关于 Apps Script 的信息，并想看看还能用它构建什么，那么你可以在 `https://developers.google.com/apps-script`\
    \ 找到更多信息。\n\n一旦创建了 Data Studio 连接器，就可以通过将其发布到 Data Studio 连接器库或共享链接的方式与他人分享。连接器库需要谷歌人员先进行审核和预先批准，然后才能发布。\n\
    \n## 自定义社区可视化\n\n自定义社区可视化是比自定义连接器更新的功能，它能让你制作出美观且定制的报表。当你对所有现有的、能够充分展示你想展示的数据的方式都不满意时，可以添加自定义可视化。\n\
    \n例如，如果我受雇于一家剧院公司，想要展示评论家的评分和评论，我会想在报表中找到一种方法将数据处理成最终的星级评分可视化效果。我可能会考虑使用“记分卡”或“条形图”控件之类的东西，但与用户看到评论旁边的几颗星相比，它不会给我那种瞬间的理解。如果你查看图\
    \ 7-1，可以看到由 Baguette Engineering 开发的“客户评论”可视化示例，它显示了\n\n![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig1_HTML.jpg](img/485069_1_En_7_Fig1_HTML.jpg)\n\
    \n**图 7-1** 由 Baguette Engineering 开发的“客户评论”可视化\n\n- 被评论项目的名称（此处为电影名称）\n- 满分五星的星级评分\n\
    - 评论发布的日期\n- 评论中的引述或评论\n"
- fmt: '# How to Add a Custom Visualization to Your Reports


    In order to create the review visualization in Figure [7-1](#485069_1_En_7_Chapter.xhtml#Fig1),
    all we need to do is


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig2_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    “Manage Added Data Sources” screen


    Table 7-1


    Data for the “Customer Reviews” table


    | Review ID | Name | Review Date | Comment | Ratings 0–5 |

    | --- | --- | --- | --- | --- |

    | 1 | Movie Name | 20190512 | It was a triumph | 5 |

    | 2 | Action Movie | 20190515 | It was bad | 2 |

    | 3 | Sci-fi Movie | 20190516 | It was great | 4 |


    1.  Create a Google Sheets file which looks like Table [7-1](#485069_1_En_7_Chapter.xhtml#Tab1).


    2.  Open the Data Studio report for the dashboard that you are working on.


    3.  Connect your “Customer Reviews” Google Sheets data source by going into the
    `Resource` menu ➤ `Manage Added Data Sources` and clicking `Add a Data Source`
    in the bottom left corner (Figure [7-2](#485069_1_En_7_Chapter.xhtml#Fig2)).


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig3_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Add custom reviews button


    1.  Select `Google Sheets Connector` and select your “Customer Reviews” file.


    2.  Click the `Add` button to start the data flowing, then click the `Add to report`
    button.


    3.  Click the `Add Custom Visualization` button in the toolbar. The button will
    look like a series of shapes followed by the plus sign (Figure [7-3](#485069_1_En_7_Chapter.xhtml#Fig3)).


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig4_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Community Visualizations screen


    1.  The Community visualization panel will open (as seen in Figure [7-4](#485069_1_En_7_Chapter.xhtml#Fig4)),
    then select `Explore More` to see the full list of current community visualizations.


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig5_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    “Community Visualizations Disabled” error message is shown when you haven’t allowed
    the use of Community Visualizations in your data source


    1.  Select “Customer Reviews” and then click and drag where you want it to appear
    on your report.


    2.  You should be seeing an error screen which says “Community Visualizations
    Disabled” (as shown in Figure [7-5](#485069_1_En_7_Chapter.xhtml#Fig5)). Don’t
    panic, as this is expected.


    ### Privacy and the “Community Visualizations Disabled” Error


    The `Community Visualizations Disabled` error is a very common error that comes
    up regularly with users of Data Studio. The issue occurs because, by default,
    we didn’t authorize the use of community visualizations as part of our data source
    setup process.


    Despite the frightening term, the occurrence of this error is a reflection of
    a protective default setting in Data Studio. Since community visualizations may
    contain code from third parties, you need to consider potential risks before you
    enable them.


    The main consideration is around assessing the level of risk to your data. You
    are relying on the developer of that community visualization to be trustworthy
    with your data and that their visualization will not generate any errors with
    the presentation of the data.


    Google has therefore added this extra safeguard to your data sources that requires
    you to `opt in` to allow community visualizations. Whenever I opt in, I usually
    do


    *   A little more checking on the results of the visualization just in case there
    is an error.


    *   A little more consideration about how risky the data is. Since third-party
    code is involved, you should also consider the worst-case scenario that the code
    could stop working or could be broken by a new release.


    Whenever you create a new data visualization source, you should think about whether
    you would want to have Community Visualization data accessing this data. For example,
    the movie reviews data is a low-risk data source and would be fine to pass through
    a Community Visualization.


    After our risk assessment, we can proceed to remove the error and activate the
    data source for use with community visualizations, following the next few steps:


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig6_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig6_HTML.jpg)


    Figure 7-6


    Enabling Community Visualizations access


    1.  Start by selecting `Resource` ➤ `Manage Added Data Sources` button.


    2.  Click the `Edit` button next to the Data Source you want to modify. In the
    top row you will see there is a `Community Visualization access` tab.


    3.  Once you select the `Community Visualization access` tab, you just need to
    switch it to `ON` and click `Save` (as shown in Figure [7-6](#485069_1_En_7_Chapter.xhtml#Fig6)),
    then click the `Finished` button.


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig7_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig7_HTML.jpg)


    Figure 7-7


    In order for the community visualization to work, you need to make sure that the
    correct fields are dragged into the data fields with the same name


    1.  You will now likely see that your custom visualization has appeared. This
    is not quite a time to celebrate yet as there is a bit more work to be done. If
    you click the custom visualization, you will notice that the dimensions and metrics
    probably aren’t mapped to the correct fields.


    2.  In order for the community visualization to work, you need to make sure that
    the correct fields are dragged into the data fields with the same name (as shown
    in Figure [7-7](#485069_1_En_7_Chapter.xhtml#Fig7)).


    1.  Make sure you have a look at the `Style` tab in the Data Studio right-hand
    pane, and you will also see you can select which row to use as the basis for your
    review visualization.


    That’s it – you have a working community visualization working in your report.
    Now that you have seen how easy it is to add, let’s explore some of the other
    options we have for custom data visualization.


    ## Examples of Community Visualizations


    Now that we have got our hands on community visualizations, let’s look at a few
    more.


    When exploring which community visualizations I can use, I generally perform the
    same thought process:


    1.  What does my data look like?


    2.  What impact do I want from the data report?


    3.  How do I make my report look visually appealing?


    4.  Can I find a community visualization that will do some of the hard work for
    me?


    Step 4 always has me diving into the `3 dots` menu on each community visualization,
    specifically the `Learn More` option (shown in Figure [7-8](#485069_1_En_7_Chapter.xhtml#Fig8)).


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig8_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig8_HTML.jpg)


    Figure 7-8


    The `3 dots menu` for custom visualizations


    Each of the community visualizations comes with a `demo report` which allows people
    to see what the visualization should look like and also check for any errors.
    Let’s take a deeper look at another community visualization chart called the `radar
    chart` or what most people call it in analytics… the spider chart.'
