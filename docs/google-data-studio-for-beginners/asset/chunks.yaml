- fmt: "# How to Use Calculated Metrics in Blends\n\nI (Gerry) once worked on a project\
    \ where we were unsure about the accuracy of Google after a migration. We wanted\
    \ to compare the organic traffic to the clicks, and so we followed the steps of\
    \ combining the clicks to the organic traffic – a graph of Clicks from Google\
    \ Search Console and a graph of Google Organic traffic (created by adding a filter\
    \ to a graph of sessions). See Figure [6-10](#485069_1_En_6_Chapter.xhtml#Fig10).\n\
    \n![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig10_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig10_HTML.jpg)\n\
    \n**Figure 6-10** Applying a filter to a graph\n\nWe selected both graphs and\
    \ blended. The graph that came out was perfect, but we wanted to be able to calculate\
    \ the difference between the two – so we add in other metrics. See Figure [6-11](#485069_1_En_6_Chapter.xhtml#Fig11).\n\
    \n![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig11_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig11_HTML.jpg)\n\
    \n**Figure 6-11** Adding additional metrics\n\nAdding metrics gives us the ability\
    \ to include a new calculated metric based on these two. See Figure [6-12](#485069_1_En_6_Chapter.xhtml#Fig12).\n\
    \n![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig12_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig12_HTML.jpg)\n\
    \n**Figure 6-12** Calculating a metric within a blend\n\nAnd suddenly we get a\
    \ running relationship between the clicks into the website and the data – ideally\
    \ if you have filtered to just organic, it typically lies within the range of\
    \ 0.5 and 1.5 and is something I often test when auditing websites. As it is a\
    \ ratio, it is important to set the aggregation to `\"Average\"`; else it might\
    \ start to become incorrect when displayed later.\n\nUsing the average number\
    \ in the graph, I usually set it to being on the right-hand side while still displaying\
    \ the other two numbers and making it bolder; this can be done by clicking on\
    \ the graph and clicking into the style tab of the configuration.\n\nThe opportunities\
    \ with blended data are only really limited by your imagination – it is always\
    \ worth making sure that the blends are accurate and that nothing is being aggregated\
    \ or you are doing anything that delivers incorrect results but discovering sources\
    \ of data and the impact on others is a marketing analyst’s dream.\n\n## Recap\n\
    \nBlending of data is initially quite daunting, but by following the steps and\
    \ knowing what you want to achieve, hopefully you can see that it is a good option\
    \ which isn’t as challenging as it would appear on the outside. It is powerful\
    \ and can deliver to you insights that wouldn’t normally be available.\n\nRemember\
    \ that the key must match up and that the data must be able to match using this\
    \ key and everything else will fall into place. Blending two charts is the easiest\
    \ way to get started, but from there it can be increasingly more intricate.\n\n\
    # 7. Custom Data Visualizations\n\nOver the course of the previous chapters, we\
    \ have been showing you how to connect your business data to Data Studio and make\
    \ it actionable. The challenge is that despite Data Studio being a superbly flexible\
    \ tool, there are always going to be use cases that it’s not able to solve for.\
    \ This is due to the fact that if Data Studio was to cover everything, it would\
    \ reach the point where it starts to become bloated and harder to maintain (as\
    \ well as needing an army of developers to keep it going)!\n\nThe aim for most\
    \ data products, as well as Data Studio, is simply to cover the majority of use\
    \ cases in an easy way, and create frameworks to allow others to extend Data Studio\
    \ to answer their own use cases.\n\nTypically, these “extensions” would require\
    \ someone who knows how to use JavaScript, in order to build out this functionality.\
    \ When it comes to actually using these extensions in your reports, you don’t\
    \ need to know any programming languages, and they will function in exactly the\
    \ same way as your other elements in Data Studio.\n\n## What Customizations Does\
    \ Data Studio Offer?\n\nThere are two types of customizations that you can leverage\
