    \ authorize it if it’s your first time connecting a Google Sheet to Data Studio.\n\
    \n3.  Locate Hermann’s sales report: “DS - Coffee Shop.”\n\n4.  Select the file\
    \ and select “Menu” (the first tab in the Google Sheet).\n\n5.  Click the blue\
    \ connect button in the top right-hand corners, then click Add, then Add to Report.\n\
    \n### Step 5: Create a Raw Table View of the Data\n\nWhenever I start looking\
    \ at the data that I need, I find that the easiest way to understand it is to\
    \ use table control to investigate the raw data. This gives an overview of the\
    \ data before we zoom down into the detail to get the information we need. It’s\
    \ also handy for doing some initial quality checking and double checking that\
    \ the data is there and it’s in the format we expect.\n\nTo create a raw table\
    \ view of the data:\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig2_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig2_HTML.jpg)\n\
    \nFigure 2-2\n\nAdding a raw table to your Data Studio report\n\n1.  Click “Add\
    \ a chart” and select the first table icon on the top row as shown in Figure [2-2](#485069_1_En_2_Chapter.xhtml#Fig2).\n\
    \n2.  Click the rectangle where you would like to place the table and you will\
    \ see the data from your Google Sheet appear.\n\nNow that we have the data successfully\
    \ coming through from Google Sheets into our table, we can start to try and make\
    \ the data useful to our client.\n\n#### Helping Users to Ask Questions of the\
    \ Data\n\nBased on the data, we are going to try and help Hermann to understand\
    \ his sales data in a bit more detail. A good starting point is to do some exploratory\
    \ data analysis to understand the shape of the data. Some of the simpler questions\
    \ we can answer using the data are\n\n*   What products are responsible for the\
    \ majority of his sales?\n\n*   What types of flavors are customers buying the\
    \ most of?\n\n*   How do the sales of these products compare vs. last year?\n\n\
    A raw table of data doesn’t really give us a clear indication of what’s going\
    \ on with the sales. It just displayed to us a wall of text and numbers, which\
    \ is difficult for our brains to process and interpret. We want the report to\
    \ do the heavy processing for us to help our users understand the data. We can\
    \ do this with by transforming the raw table into something more visual, such\
    \ as a pie chart. By adding a pie chart to the Data Studio report, we are gifting\
    \ the user an easier way to interpret the data. Humans are visual creatures and\
    \ we relate to the world around us by using our senses to understand the world\
    \ of us. The world of data is much the same; by adding visual features to the\
    \ report that guide the user as to what the information is saying, it lets them\
    \ focus on what is most important for them.\n\n#### Add a Pie Chart\n\nTo add\
    \ a pie chart to show the breakdown of sales:\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig3_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig3_HTML.jpg)\n\
    \nFigure 2-3\n\nAdding a pie chart\n\n1.  Click “Add a chart” and select the first\
    \ Pie Chart control (Figure [2-3](#485069_1_En_2_Chapter.xhtml#Fig3)).\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig4_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig4_HTML.jpg)\n\
    \nFigure 2-4\n\nPie chart according to product name\n\n1.  Click where you want\
    \ to place the chart.\n\n    When we first add the pie chart, Data Studio defaults\
    \ to showing the first field in the data set which is “Product Name.” It also\
    \ defaults to showing us the data from this year. As you can see from Figure [2-4](#485069_1_En_2_Chapter.xhtml#Fig4):\n\
    \    *   Our top selling product is “Banana Loaf,” closely followed by the delicious\
    \ Lavender Cupcake. Good old traditional Chocolate Cake is sitting in at third\
    \ most popular.\n\n    *   Our top four products account for roughly 50% of our\
    \ total sales.\n\n    *   Each one of our top four products is selling roughly\
    \ the same proportion of units.\n\n## Step 6: Duplicate the Pie Chart and Change\
    \ the Dimension to “Product Type”\n\nLet’s take a different view of the data to\
    \ get a different perspective by duplicating the pie chart and changing the dimension\
    \ to product type (Figure [2-5](#485069_1_En_2_Chapter.xhtml#Fig5)). To do this:\n\
    \n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig5_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig5_HTML.jpg)\n\
    \nFigure 2-5\n\nPie chart according to Product Type\n\n1.  Right-click the pie\
    \ chart and select Duplicate.\n\n2.  Drag the pie chart immediately to the right\
    \ of the original pie chart.\n\n3.  Select the new pie chart and click “Product\
    \ Name” in the right Panel under “Dimension” and select “Product Type.”\n\nWhen\
    \ we selected the dimension called “Product Type,” we told Data Studio to reprocess\
    \ the data in our table, and instead of grouping it by product name, we should\
    \ instead group it by product type. By changing this “dimension” that it uses,\
    \ it changes the lens that we use to look at the data and shows it from a different\
    \ perspective. Dimensions (and metrics) are the fundamental building blocks for\
    \ data reporting, and we will be exploring these further in the next few chapters\
    \ in the book.\n\nFor now, let’s just admire how the small change to our pie chart\
    \ has helped us to understand the sales data even more. When we view the sales\
    \ data through the lens of “product type,” we can see\n\n*   Nearly 50% of our\
    \ sales come surprisingly from cupcakes.\n\n*   A third of our sales come from\
    \ cakes."
  trans: '

    ### 第 3 步：创建 Data Studio 报告


    打开 Data Studio 并创建一个新的空白报告。将其命名为 `“DS - Coffee Shop.”`。如需复习如何创建新报告，请参阅第 1 章。


    ### 第 4 步：创建与 Google 表格的数据连接


    数据的奇妙之处在于它总是在变化。与上一章中我们创建与文件的静态连接不同，在本章中，我们将建立一个与实时 Google Sheets 文档的动态连接。当 Google
    Sheets 中的数据发生变化时，我们会看到 Data Studio 的内容也随之改变。要创建与 Google 表格的数据连接，请执行以下操作：


    1. 点击 `“添加数据”`。

    2. 在“Google 连接器”列表中找到 `“Google Sheets”` 并点击它。如果这是你第一次将 Google 表格连接到 Data Studio，则需要授权。

    3. 找到 Hermann 的销售报告：`“DS - Coffee Shop.”`。

    4. 选择该文件，然后选择 `“菜单”`（Google 表格中的第一个标签页）。

    5. 点击右上角的蓝色“连接”按钮，然后点击 `添加`，再点击 `添加到报告`。


    ### 第 5 步：创建数据的原始表格视图


    每当我开始查看所需数据时，我发现理解数据最简单的方法是使用表格控件来查看原始数据。这在我们深入细节获取所需信息之前，能提供一个数据概览。同时，这也有利于进行初步的质量检查，并再次确认数据存在且格式符合预期。


    要创建数据的原始表格视图：


    ![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig2_HTML.jpg](img/485069_1_En_2_Fig2_HTML.jpg)


    图 2-2：向 Data Studio 报告添加原始表格


    1. 点击 `“添加图表”`，然后选择顶部行中的第一个表格图标，如图 2-2 所示。

    2. 点击您想要放置表格的矩形区域，您将看到来自 Google 表格的数据随之出现。


    现在我们已经成功将数据从 Google Sheets 导入表格中，我们可以开始尝试让数据对我们的客户有用。


    #### 帮助用户向数据提问


    基于这些数据，我们将尝试帮助 Hermann 更详细地了解他的销售数据。一个好的起点是进行一些探索性数据分析，以了解数据的形态。我们可以利用数据回答的一些更简单的问题包括：


    -   哪些产品是他的主要销售额来源？

    -   顾客购买最多的口味类型是什么？

    -   这些产品的销售额与去年相比如何？


    数据的原始表格并不能清晰地告诉我们销售情况。它只是向我们展示了一堆文本和数字，这让我们的大脑很难处理和解读。我们希望报告能替我们完成繁重的处理工作，帮助用户理解数据。我们可以通过将原始表格转换为更具视觉化的形式（例如饼图）来实现这一点。通过在
    Data Studio 报告中添加饼图，我们为用户提供了一种更轻松的数据解读方式。人类是视觉动物，我们通过感官来理解周围的世界。数据世界也大致相同：通过在报告中添加视觉元素来引导用户了解信息所传达的内容，可以让他们专注于对自己最重要的事情。


    #### 添加饼图


    要添加饼图以显示销售明细：


    ![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig3_HTML.jpg](img/485069_1_En_2_Fig3_HTML.jpg)


    图 2-3：添加饼图


    1. 点击 `“添加图表”`，然后选择第一个饼图控件（图 2-3）。


    ![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig4_HTML.jpg](img/485069_1_En_2_Fig4_HTML.jpg)


    图 2-4：按产品名称划分的饼图


    2. 点击您想要放置图表的位置。


    当我们首次添加饼图时，Data Studio 默认显示数据集中的第一个字段 `“Product Name”`（产品名称）。它默认还向我们显示今年的数据。如图
    2-4 所示：


    -   我们的畅销产品是 `“Banana Loaf”`（香蕉面包），紧随其后的是美味的薰衣草纸杯蛋糕。经典的老式巧克力蛋糕位列第三。

    -   排名前四的产品约占总销售额的 50%。

    -   排名前四的每一款产品的销量大致相当。


    ## 第 6 步：复制饼图并将维度更改为“产品类型”


    让我们通过复制饼图并将维度更改为产品类型，从不同角度查看数据，以获得不同的视角（图 2-5）。为此：


    ![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig5_HTML.jpg](img/485069_1_En_2_Fig5_HTML.jpg)


    图 2-5：按产品类型划分的饼图


    1. 右键单击饼图并选择 `复制`。

    2. 将复制的饼图拖到原始饼图的正右侧。

    3. 选中新的饼图，然后在右侧面板的 `“维度”` 下点击 `“Product Name”`（产品名称），并选择 `“Product Type”`（产品类型）。


    当我们选择名为 `“Product Type”`（产品类型）的维度时，我们指示 Data Studio 重新处理表格中的数据，不再按产品名称分组，而是按产品类型分组。通过更改所使用的这个
    `“维度”`，它改变了我们查看数据的视角，并从不同的角度展示数据。维度（和指标）是数据报告的基本构建块，我们将在本书接下来的几章中进一步探讨它们。


    现在，让我们欣赏一下饼图的这个小改动如何帮助我们更深入地了解销售数据。当我们通过 `“product type”`（产品类型）的视角查看销售数据时，我们可以看到：


    -   令人惊讶的是，我们近 50% 的销售额来自纸杯蛋糕。

    -   三分之一的销售额来自蛋糕。

