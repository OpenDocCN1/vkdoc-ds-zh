- fmt: "### To Get Access to Google Analytics Demo Data\n\nAccessing the Demo data\
    \ can be done via a link.\n\n![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig3_HTML.jpg](images/485069_1_En_5_Chapter/485069_1_En_5_Fig3_HTML.jpg)\n\
    \nFigure 5-3\nThe Google Analytics Demo account\n\n1. Make sure you have registered\
    \ for a Google Analytics account by visiting [`https://analytics.google.com`](https://analytics.google.com)\
    \ and signing in or creating an account.\n2. Visit the Demo Account Help Center\
    \ article ([`https://support.google.com/analytics/answer/6367342`](https://support.google.com/analytics/answer/6367342)).\n\
    3. Click the button that says “Access Demo Account.”\n4. This will add the demo\
    \ account to your Google Analytics account. You will be able to confirm this by\
    \ clicking the “account picker” at the top of the page and selecting the “Demo\
    \ Account” as shown in Figure [5-3](#485069_1_En_5_Chapter.xhtml#Fig3).\n\nIf\
    \ you were using real Google Analytics data, you would do the same steps as the\
    \ aforementioned except with a real Google Analytics account.\n\n### Creating\
    \ a Report with a Data Studio Template\n\nTemplates are really useful when it\
    \ comes to getting a jump start on building your own Data Studio reports. You\
    \ can use it to learn from some of the best in the industry about the right way\
    \ to do things. Let’s start by learning how to build your own reports from the\
    \ Gallery.\n\nSelect the `Template Gallery` button on the right-hand side of the\
    \ screen.\n\nWhen you select the `Template Gallery` button, you will see a full\
    \ list of the various reports that have been made by the Google Analytics team\
    \ (Figure [5-4](#485069_1_En_5_Chapter.xhtml#Fig4)).\n\n![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig4_HTML.jpg](images/485069_1_En_5_Chapter/485069_1_En_5_Fig4_HTML.jpg)\n\
    \nFigure 5-4\nThe Template Gallery has a wide selection of templates you can use\n\
    \nSelect `Google Merchandise Store` as the template on the bottom row. Then Select\
    \ “Use Template” on the blue bar across the page.\n\nOnce you have selected the\
    \ relevant report and chosen “Use Template,” you are given the option to either\
    \ use an existing source or create your own.\n\nSince not all of you will have\
    \ access to an analytics account with live data, Google have luckily managed to\
    \ share the data from their Google Merchandise Store – which is a great resource\
    \ to try out when you are learning.\n\nNext, click “Select a Data Source” under\
    \ “New Data Source.” You will see a screen similar to Figure [5-5](#485069_1_En_5_Chapter.xhtml#Fig5).\
    \ Simply select the `Google Analytics Demo` data from the drop-down menu below\
    \ “Data Source.”\n\n![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig5_HTML.jpg](images/485069_1_En_5_Chapter/485069_1_En_5_Fig5_HTML.jpg)\n\
    \nFigure 5-5\nThe copy report options\n\nSelect `Copy Report` and double-click\
    \ the report name and label it as “GA Learning Report.”\n\nYou are then good to\
    \ go to start exploring the new report. I thoroughly encourage you all to click\
    \ the various reports and look at the properties for each of these reports in\
    \ the “Properties Panel.”\n\nYou now can use any of the existing templates that\
    \ Google has provided to create your own report.\n\n### Practicing with More Demo\
    \ Data\n\nThe best way to learn any new skill is to copy what an expert does enough\
    \ times so that it becomes second nature to you. This will let you start to build\
    \ up your Data Studio skills so it become second nature to you and you can focus\
    \ more on the content of the report than the making of the report.\n\nLuckily\
    \ Data Studio has two main places where you can learn how to visualize data from\
    \ people who use it all the time:\n\n* The Template Gallery ([`https://datastudio.google.com/u/0/navigation/reporting`](https://datastudio.google.com/u/0/navigation/reporting))\n\
    * The Data Studio Report Gallery ([`https://datastudio.google.com/gallery`](https://datastudio.google.com/gallery))\n\
    \nRight now we are going to focus on the Template Gallery to get us up and running.\
    \ For those of you who are looking to build your own reports for your websites,\
    \ the Google team produces a lot of premade reports via its Template Gallery.\
    \ The Template Gallery is shown in Figure [5-6](#485069_1_En_5_Chapter.xhtml#Fig6).\n\
    \n![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig6_HTML.jpg](images/485069_1_En_5_Chapter/485069_1_En_5_Fig6_HTML.jpg)\n\
    \nFigure 5-6\nThe Template Gallery\n\nYou can usually find these listed along\
    \ the top of the page when you browse to the Data Studio home page.\n\nData Studio\
    \ is always evolving, and there are always new improvements that you can add to\
    \ your reports.\n\n### Recap\n\nIn this chapter, we talked about the value of\
    \ website analytics, and we tested out visualizing Google Analytics using a demo\
    \ account and templates.\n\n## 6. Blends of Data\n\nCombining Sources to Gain\
    \ Better Insight\n\n> *The important thing is to not stop questioning. Curiosity\
    \ has its own reason for existing.*\n> \n> —Albert Einstein, theoretical physicist\n\
    \nOften a single source of data gives you some helpful insights, and by now you’ll\
    \ have learned that including multiple data sources into a report allows you to\
    \ present more of a complete picture. But when you blend multiple data sources\
    \ into a single table, graph, or calculation, this can bring far more insight\
    \ into the relationships and you can answer more of the why questions.\n\nSome\
    \ questions blends can answer:\n\n- Is our store traffic dropping on hot and sunny\
    \ days?\n- Is the paid brand traffic impacting our brand organic?\n- Can I see\
    \ a table with organic impressions, clicks, and conversions by page?\n\nIdeas\
    \ of what can be blended are limitless, and for digital marketers, especially\
    \ in SEO (search engine optimization), this will often lead you to pull data in\
    \ from multiple sources such as crawler data, weather, product stock data, and\
    \ more.\n\nIn this chapter, we will go through the process of making some simple\
    \ blends to see if we can give better insight and work through some real-world\
    \ problems and solutions.\n\nGoogle Data Studio Blends use something called an\
    \ outer left join, which means that, for example, if you are combining two sets\
    \ of data about a web page, the first set will have all the rows in it but the\
    \ second will only have where the two have a match.\n\nYou can blend two or three\
    \ different analytics accounts, for instance, which would allow you to see a cumulative\
    \ or comparative view of data. This is very useful within a migration or when\
    \ you have a different account on different subdomains. Although, it is worth\
    \ noting that some sitewide metrics won’t be available if users cross multiple\
    \ properties."
