    \ employees to write more blog posts by gamifying it: whoever’s blog post has\
    \ driven the most views by the end of the year wins. It didn’t take me long to\
    \ create a visualization for this incentive using Data Studio.\n\nConsidering\
    \ the needs and habits of my target audience (my teammates), I chose to embed\
    \ the report by clicking the Share drop-down button and selecting Embed report\
    \ (Figure [8-1](#485069_1_En_8_Chapter.xhtml#Fig1)). I then made the dimensions\
    \ of the report mobile phone size, enabled embedding, and shared the “embed” URL\
    \ (Figure [8-2](#485069_1_En_8_Chapter.xhtml#Fig2)). This means the team can check\
    \ it on their phone and see it without being on their work computer.\n\n![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig2_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig2_HTML.jpg)\n\
    \nFigure 8-2\n\nEmbed options for a report with recommended sizes to see on a\
    \ mobile\n\n![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig1_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig1_HTML.jpg)\n\
    \nFigure 8-1\n\nEmbed report option\n\nIn one of the charts on my report, shown\
    \ in Figure [8-3](#485069_1_En_8_Chapter.xhtml#Fig3), we can clearly see that\
    \ the winner at the moment is the one with the steadiest growth written on Python\
    \ scripts. Sharing data on content with writers pushes them to create more and\
    \ better quality. A content dashboard can show the keywords that are ranking for\
    \ a selected post or the engagement with that page. I created additional tabs\
    \ to track additional views of the data, partly to make sure that all the engagement\
    \ metrics were set up right and we also track the author as a custom dimension\
    \ into our analytics.\n\n![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig3_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig3_HTML.jpg)\n\
    \nFigure 8-3\n\nCumulative page views for blog posts on an agency website\n\n\
    Creation of this widget in Data Studio has led to more colleagues producing reports\
    \ and caring about the quality of the delivery. Remember, if you try this out,\
    \ you can style the report however you like and embed it into web pages that change\
    \ in time.\n\n## Campaign Performance Mini Reports\n\nFor every agency campaign\
    \ that we do, we quickly create a campaign performance report, typically based\
    \ on Google Analytics data but often shaped to pull out interactions such as video\
    \ shares (including YouTube data). When the Public Relations team records coverage,\
    \ it goes into a BigQuery table (it even stores screenshots) that can then be\
    \ pulled through, and suddenly it becomes a report that can be easily shared with\
    \ a client as well as providing internal progress reporting.\n\nCombining, blending\
    \ data from multiple sources within reports that are easily and quickly shared\
    \ with clients was something we could only dream about a few years ago."
