- fmt: "As you can see from the bakery example, there are lots of deciding factors\
    \ that can be described in relation to the sales we are making. Understanding\
    \ that certain flavors are more popular is a vital piece of knowledge, as it means\
    \ that the baker can showcase these most popular flavors.\n\nOne final thing to\
    \ keep in mind: most modern businesses analyze data that is “multidimensional”\
    \ – meaning it doesn’t just rely on a single dimension to explain the data. Thinking\
    \ about our cakes example, the bakery will sell a multitude of cupcake flavors,\
    \ but with each of these flavors, we might have a multitude of different flavors\
    \ of buttercream icing. We might also have a multitude of different themes, and\
    \ each of these themes may sell differently depending on the day of the week or\
    \ season. For example, sugar-free cakes will likely sell well to certain populations.\n\
    \nThis is where being a good data developer or data visualization engineer comes\
    \ in. Dimensions add context to a metric and bring understanding to the data.\
    \ You have the ability to “try on” a set of dimensions on a data set to see if\
    \ it provides more insight for the end user. You can also see if the data has\
    \ a strong correlation with the business goals that you are trying to achieve.\n\
    \n## Recap\n\nIn this chapter, we talked about how metrics by themselves or aggregated\
    \ can be valuable, especially when given context by considering dimensions as\
    \ well.\n\nFootnotes [1](#485069_1_En_3_Chapter.xhtml#Fn1_source) [2](#485069_1_En_3_Chapter.xhtml#Fn2_source)\
    \ [3](#485069_1_En_3_Chapter.xhtml#Fn3_source)\n\n# 4. An Online Survey\n\nA Case\
    \ Study Profile Analysis\n\n> *It is, in fact, nothing short of a miracle that\
    \ the modern methods of instruction have not yet entirely strangled the holy curiosity\
    \ of inquiry.*\n> \n> —Albert Einstein, theoretical physicist\n\nNow that we’ve\
    \ covered some basics in the previous chapters, let’s see how we can use Google\
    \ Data Studio for another real-world situation: analyzing the data resulting from\
    \ an online survey to gather customer information for a client. This chapter is\
    \ based on a real-life project that we did for a popular travel company. For a\
    \ client to get an interactive analysis of their customer data without expensive\
    \ visualization tools is not only cost-efficient but also incredibly useful. It\
    \ gave our client insight that they could use to develop their content and marketing\
    \ strategy to better target the customers.\n\n## Finding Out What Travel Company\
    \ Needs\n\nFirst, we needed to find out more about our client’s needs. As a popular\
    \ travel company, they wanted us to take a look at who their customers were.\n\
    \n## Gathering the Data\n\nThe next step was to gather the data. We sent about\
    \ ten thousand emails to our client’s customers and asked them to fill out a survey\
    \ using `SurveyMonkey`.\n\nThe survey asked questions about the customers themselves:\n\
    \n*   Gender\n*   Age range\n*   Salary range\n*   Marital status\n*   Kids (and\
    \ grandkids)\n*   Job title\n\nAnd about their view of the website/service:\n\n\
    *   How often they holidayed\n*   Reasons for going on a holiday\n*   Did they\
    \ like aspects of the website\n*   Did they like aspects of the service\n\nWe\
    \ also had free text questions, a text box allowing them to type information such\
    \ as if they thought something was missing from the website, allowing more open\
    \ responses to some key questions.\n\nOnce all submissions were received (about\
    \ 5,000 surveys), we’re ready to prepare the data for the report.\n\n## Preparing\
    \ the Data\n\nThe next step was to prepare the data before we could feed it into\
    \ Data Studio. `SurveyMonkey` is able to export the results into an `xls` file,\
    \ which is a format we could easily import into Google Sheets. After uploading\
    \ the results to Google Sheets, we started cleaning up the data.\n\nAs discussed\
    \ in Chapter [2](#485069_1_En_2_Chapter.xhtml), clean up entails ensuring that\
    \ nothing in the data set is invalid. For instance, despite us using the company’s\
    \ mailing list, presumably of people who wish to be contact about the service,\
    \ we still received “junk” responses from people who did not want to be bothered.\
    \ We also had to remove anything that is considered a `null`, or blank, response.\
    \ We also needed to make sure that all columns have unique names. Don’t worry\
    \ – every data set has issues.\n\nIn this case, we were dealing with a relatively\
    \ small data set of about 5,000 surveys, and we can pull it directly from Google\
    \ Sheets into Data Studio. If we had a larger data set, we could upload it into\
    \ Google BigQuery first and pull it into Data Studio in a similar way.\n\nAfter\
    \ we cleaned up the data, we were then ready to pull it into Data Studio. Make\
    \ sure you have access to the Google Sheet in the same account and the file name\
    \ is appropriate.\n\nIn Data Studio, start by creating a report. It will then\
    \ ask you to add a data source to the report. Simply click the Google Sheets option\
    \ (Figure [4-1](#485069_1_En_4_Chapter.xhtml#Fig1)).\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig1_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1\n\nThe button to click for Google Sheets\n\n## Designing the Report\n\
    \nNext, we need to design the report to make it useful and aesthetically pleasing.\
    \ We can do this by structuring the presentation of data and making elements consistent\
    \ throughout.\n\nIt’s always nice to have elements that are consistent through\
    \ the report. This promotes a sense of cohesiveness, a connection to the company’s\
    \ branding, and it is aesthetically pleasing.\n\nGetting things looking consistent\
    \ means that your clients will find the report easier to read.\n\n### Header Bar\n\
    \nOne thing you can do is add a header bar that has the company’s logo. You can\
    \ do this with a plain text header as well, but a logo looks nice if you have\
    \ it.\n\nTo upload a graphic, click the Image icon in the toolbar and select “upload\
    \ from computer” or “by URL,” whichever is applicable for you. Then, place the\
    \ logo somewhere at the top of the report page. Right-click the logo and select\
    \ “Make report level.” This means that the logo will appear at the top of every\
    \ page if your report has more than one page.\n\n### Color Theme\n\nAnother thing\
    \ you can do is set a color theme for the report so it is consistent throughout.\
    \ If the company you are producing the report for has a color scheme, you can\
    \ incorporate it into your report by extracting the color scheme from an image,\
    \ which can be the company’s logo or even a screenshot of their website.\n\nOn\
    \ the toolbar click `Theme and Layout`, and on the right pane click `Extract theme\
    \ from image` (Figure [4-2](#485069_1_En_4_Chapter.xhtml#Fig2)). You can either\
    \ upload the image from computer or by URL.\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig2_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig2_HTML.jpg)\n\
    \nFigure 4-2\n\nScreenshot of button to extract an image palette\n\nYou can then\
    \ select from three generated themes. If you like one, click it and press apply.\
    \ If you find the output of the extraction doesn’t have enough color diversity\
    \ or contrast, you can manually edit the color theme to make your report better\
    \ fit your company or clients style. Click the `customize` button in the `Theme\
    \ and Layout` pane.\n\n### Footer Bar\n\nAlso consider creating a footer at the\
    \ bottom of the report with information on how to contact you, or information\
    \ here on how to get elements fixed up, if you are an agency or in house team\
    \ a link to your contact details if someone wants something fixed.\n\nYou can\
    \ use the text tool to type in this information and place it at the bottom of\
    \ the page."
