  raw: '### How Should the Data Be Presented to Him?


    The simplest technique to finding the right format is to ask the stakeholders
    for their old reports. Start with what they know and what they’re familiar with,
    as long as it’s simple to do so.


    You are probably thinking to yourself. “Hold up, surely it’s better to start with
    something new, shiny and streamlined?”


    Here is the trick though: the aim of this step is not to give them something shiny,
    but rather you are trying to build up trust with the client.


    Let me illustrate this with a short story.


    A few years ago, I heard from a designer who worked exclusively with Adobe Photoshop.
    He had been invited to a market research opportunity where he was given the chance
    to review a new rival to Photoshop. They spent a long time presenting it and showing
    off the product and all the features including its unique new navigation that
    they were extremely proud of. At the end of the session, they asked the group
    what improvements they would like to see. This designer said he put up his hand
    and said:


    “Can’t you just make the navigation the same as Photoshop?”


    He was met with silence. To do what he asked would have delayed the product, and
    also meant dropping the fancy navigation feature that they were so proud of. They
    didn’t listen to him and his primary need for continuity. The designer wanted
    to be able to deliver work without going through lots of additional learning.


    Needless to say, the other tool isn’t around anymore. Adobe’s tools are still
    the most popular software for designers. I wonder what would have happened if
    that other company had listened to their target audience?


    Much in the same way if you want your users to build up trust with your tools,
    then the simplest way to start is to replicate what they know. One of the key
    features that Data Studio has is that it’s super quick to prototype up new reports.
    Once people recognize their old friendly reports sitting on their screens, you
    will have their attention and can start to iterate their data reports.


    When we got a copy of Hermann’s reporting, it looked like a big table with a wall
    of numbers. It was a list of products, with the numbers sold next to each item.
    Next to each item he could see a percentage sign that says whether sales have
    gone up or down from the previous week.


    ## How Data Studio Can Help Hermann


    After reviewing Hermann’s answers to the four key questions, it’s clear to you
    where Hermann needs help. He needs


    1.  **Timely information** – He’s not getting timely information to make decisions.
    He needs to wait for the end of the week when his accountant sends the data back.


    2.  **Removing duplicated efforts** – Currently Hermann has to type his sales
    data into a spreadsheet and then email it to the accountant. The accountant will
    enter the sales into an accounting program/spreadsheet and then send back the
    sales reports of what’s doing well. Hermann will then need to review and analyze
    the results.


    If you can show Hermann how to use Data Studio to take his sales data and automatically
    process it and generate a report from the raw spreadsheet data, then you could
    help him to make decisions faster. He also wouldn’t need to pay the accountant
    to enter the data and return the data back to him. Instead he can focus on driving
    the improvements can come from the data.


    You also suspect that since Hermann is so focused on his products, he will be
    able to ask much better questions of his data if he is able to take control of
    it himself. This might be the largest win for him in the long run.


    Hermann forwards you the last few reports that he received from his accountant
    so you can see what reporting has changed. The good news is that we can definitely
    improve on it! Let’s crack on with the work.


    ## Building a Report for Hermann’s Cake and Coffee Shop


    ### Step 1: Upload the Data into a Google Spreadsheet


    The first step is to get Hermann’s data from a Google Sheet.


    For this exercise, you’ll need to download a copy of Hermann’s Cake and Coffee
    Shop sales data (DS – Coffee Shop.xlsx) from the source code for this book. Go
    to [`www.apress.com/9781484251553`](http://www.apress.com/9781484251553) and click
    the download source code button.


    Take your data spreadsheet and upload it to Google Drive.


    Open up Google Sheets by visiting [`https://docs.google.com/spreadsheets/u/0/?tgif=d`](https://docs.google.com/spreadsheets/u/0/%253Ftgif%253Dd).


    Create a new sheet and go to File ➤ Import ➤ Upload. Browse for the DS – Coffee
    Shop.xlsx file and upload it.


    Make sure the spreadsheet is named “DS - Coffee Shop.” If you need to fix it,
    double-click the file name at the top left of the sheet and change it. Hit enter
    or click elsewhere when you’re done.


    ### Step 2: Clean the Data


    Next, we need to do clean the data so it’s good to be consumed.


    The aim of the cleaning process is to


    *   Get your data into a table format.


    *   Ensure that each column contains only one set of data.


    *   Check none of the fields have blank entries.


    *   Make sure that all the fields have the data in the correct consistent format.
    For example, you need to make sure that dates are in the format dd/mm/yyyy.


    One of my favorite data team leaders used to repeat the same mantra over and over
    whenever developers would try to cut corners with data:


    > *Rubbish in…Rubbish out*


    You should think of your Data Studio reports as being as clean as one of those
    fancy filtered water dispensers that you see in offices. Having water come out
    of them that is not clean would immediately result in them being taken out of
    service and an engineer being called.


    This is much in the same way your Data Studio reports should be filtered and clean
    for your users to consume. Any data source that is infected with bad data should
    result in them calling in an engineer (you!) to investigate and fix the issue.


    Tip


    Whenever you make a report, think about how you can let your users alert you if
    there is an issue with the data. I always put my contact details in the same place
    for all my reports so I am able to be contacted if people have questions. We’ll
    talk about this in a later chapter.


    #### Where Should Cleaning Be Done?


    I know a lot of people who say that it’s fine to do the cleaning of the data in
    the reporting tool and not in the source. I generally consider this a massive
    anti-pattern (a bad practice that you end up regretting).


    The rule of thumb is to fix the data in source but tweak the data in Data Studio.


    Data Studio has a lot of powerful features that can do some of the cleaning for
    you, but I tend to use these for more minor fixes or to make the data easier to
    consume. I recommend that people do as much of the cleaning as they can in the
    original source of the data as


    *   It keeps things simple as you only have to look in one place for any fixes
    to your data.


    *   It’s less work to have to replicate your cleaning over multiple reports.


    Some of the tweaks that we do in Data Studio over time, if they are clear that
    they are going to be there to stay, I might roll that change back into the source
    data just to give Data Studio that extra kick of speed.


    #### How Is Data Cleaning Done in Professional Environments?


    When you are working on doing your data cleaning in an office, you may do this
    work by simply modifying a spreadsheet, or in some businesses, the data teams
    will use a scripting language called SQL to manipulate databases with millions
    of lines on it.


    Believe it or not, the principles behind both small spreadsheets and large databases
    are pretty much the same. Since SQL and databases are such massive subjects themselves
    (and can span volumes of their own books), we will limit ourselves hereto just
    doing the cleaning in the spreadsheet we created from Hermann’s weekly sales data.
    Luckily, it’s already pretty clean, so we can continue on.'
  trans: "\n### 数据应以何种形式呈现给他？\n\n找到正确格式的最简单方法是向利益相关者索要他们之前的报告。从他们已知且熟悉的内容入手，只要操作简单即可。\n\
    \n你可能会暗自思考：“等等，用新颖、炫酷又精简的新东西开始不是更好吗？”\n\n诀窍在于：这个步骤的目标不是给他们展示炫酷的东西，而是试图与客户建立信任。\n\
    \n让我用一个小故事来说明这一点。\n\n几年前，我听说了一位专门使用 Adobe Photoshop 的设计师。他曾受邀参加一个市场调研活动，有机会试用一款\
    \ Photoshop 的新竞品。对方花了很长时间展示这款产品及其所有功能，包括他们引以为傲的独特全新导航。演示结束后，他们问大家希望看到哪些改进。这位设计师举手说道：\n\
    \n“你们就不能把导航做成跟 Photoshop 一样吗？”\n\n现场一片沉默。按他的要求做会延迟产品发布，也意味着要放弃他们引以为傲的华丽导航功能。他们没有听取他的意见，也没有满足他对延续性的首要需求。这位设计师希望能够交付工作，而不需要经历大量额外的学习过程。\n\
    \n不用说，那款竞品软件如今已不复存在。Adobe 的工具仍然是设计师们最常用的软件。我不禁想，如果那家公司当初听取了目标用户的意见，结果会怎样？\n\n\
    同样地，如果你希望用户通过你的工具建立信任，那么最简单的开始方式就是复制他们熟悉的内容。Data Studio 的关键特性之一就是它能非常快速地制作新报告的原型。一旦人们看到屏幕上那熟悉的旧报告，你就能吸引他们的注意力，并可以开始迭代他们的数据报告。\n\
    \n当我们拿到赫尔曼的报告样本时，它看起来像是一个由密密麻麻数字组成的大表格。那是一份产品列表，每个产品旁边列出了销售量。每项旁边还有百分比符号，显示销售额相比前一周是上升还是下降。\n\
    \n## Data Studio 如何帮助赫尔曼\n\n在回顾了赫尔曼对四个关键问题的回答后，你很清楚赫尔曼需要哪些帮助。他需要：\n\n1.  **及时的信息**\
    \ —— 他没有获得做出决策所需的及时信息。他必须等到周末，会计师把数据发回来。\n2.  **消除重复劳动** —— 目前赫尔曼需要将销售数据输入电子表格，然后通过邮件发给会计师。会计师再将销售额录入会计程序/电子表格，然后发回销售表现报告。之后赫尔曼还需要审核和分析结果。\n\
    \n如果你能向赫尔曼展示如何使用 Data Studio 获取他的销售数据，自动处理这些数据，并从原始电子表格数据生成报告，那么你就能帮助他更快地做出决策。他也不再需要付钱给会计师来录入数据并把结果返回给他。相反，他可以专注于根据数据推动改进。\n\
    \n你同时猜测，鉴于赫尔曼如此专注于他的产品，如果他能自己掌控数据，他将能够针对数据提出更好的问题。从长远来看，这可能是他最大的收获。\n\n赫尔曼把他最近从会计师那里收到的几份报告转发给你，这样你就能看到报告有什么变化。好消息是，我们肯定能对其加以改进！我们开始工作吧。\n\
    \n## 为赫尔曼的蛋糕咖啡店构建报告\n\n### 步骤 1：将数据上传到 Google 电子表格\n\n第一步是从谷歌表格中获取赫尔曼的数据。\n\n\
    为了完成此练习，你需要从本书的源代码中下载一份赫尔曼蛋糕咖啡店的销售数据（`DS – Coffee Shop.xlsx`）。访问 [`www.apress.com/9781484851553`](http://www.apress.com/9781484851553)\
    \ 并点击下载源代码按钮。\n\n将你的数据电子表格上传到 Google 云端硬盘。\n\n访问 [`https://docs.google.com/spreadsheets/u/0/?tgif=d`](https://docs.google.com/spreadsheets/u/0/%253Ftgif%253Dd)\
    \ 打开 Google 表格。\n\n新建一个表格，然后进入：文件 ➤ 导入 ➤ 上传。浏览并上传 `DS – Coffee Shop.xlsx` 文件。\n\
    \n确保电子表格命名为“`DS - Coffee Shop`”。如果需要修改，双击表格左上角的文件名进行更改。完成后按回车键或点击其他位置。\n\n###\
    \ 步骤 2：清洗数据\n\n接下来，我们需要清洗数据，使其准备好被使用。\n\n清洗过程的目标是：\n\n-   将数据整理成表格形式。\n-   确保每一列只包含一类数据。\n\
    -   检查没有任何字段存在空白条目。\n-   确保所有字段的数据格式正确且一致。例如，确保日期格式为 `dd/mm/yyyy`。\n\n我最喜欢的一位数据团队负责人曾这样告诫那些试图在数据上偷工减料的开发人员，他反复强调一句口头禅：\n\
    \n> *垃圾进……垃圾出*\n\n你应该把 Data Studio 报告想象成办公室里那种高档净水器。如果出水不干净，它会立即停止使用，并需要报修工程师。\n\
    \n同样地，你的 Data Studio 报告也应该是经过过滤和清洗的，以供用户使用。任何包含错误数据的数据源，都应该导致用户呼唤工程师（也就是你！）来调查并解决问题。\n\
    \n> **提示**  \n> 在制作报告时，请考虑如何让用户在遇到数据问题时向你发出警报。我总是在所有报告的同一位置放置我的联系方式，以便人们有疑问时可以联系我。我们将在后续章节讨论这一点。\n\
    \n#### 应该在何处进行数据清洗？\n\n我认识很多人，他们认为在报告工具中清洗数据就可以了，不需要在数据源中进行。我通常认为这是一种巨大的反模式（一种会让你后悔的不良做法）。\n\
    \n经验法则是：在数据源头修正数据，在 Data Studio 中调整数据。\n\nData Studio 有许多强大的功能，可以帮你完成部分清洗工作，但我倾向于用它们来做一些小的修正或让数据更易使用。我建议人们尽可能在数据的原始源头完成清洗工作，因为：\n\
    \n-   这能保持事情简单，你只需要在一个地方查找和修复数据问题。\n-   这减少了为多个报告重复进行清洗的工作量。\n\n有时我们在 Data Studio\
    \ 中做了一些调整，如果这些调整很明显将会长期存在，我可能会将这个改动回滚到原始数据源中，以便让 Data Studio 运行得更快。\n\n#### 在专业环境中如何进行数据清洗？\n\
    \n当你在办公室进行数据清洗时，可以直接通过修改电子表格来完成，或者在某些企业中，数据团队会使用名为 SQL 的脚本语言来处理包含数百万行数据的数据库。\n\
    \n信不信由你，小型电子表格和大型数据库背后遵循的原理基本相同。由于 SQL 和数据库本身是极其庞大的主题（甚至可以写出好几本书），我们将仅限于清洗我们从赫尔曼周销售数据创建的电子表格。幸运的是，这份数据已经很干净了，所以我们可以继续往下进行。\n"
- fmt: '### Step 3: Create a Data Studio Report


    Open up Data Studio and create a new blank report. Title it `“DS - Coffee Shop.”`
    Refer to Chapter [1](#485069_1_En_1_Chapter.xhtml) if you need a refresher on
    how to create a new report.


    ### Step 4: Create a Data Connection to the Google Sheet


    The wonderful thing about data is that it’s always changing. Unlike in the previous
    chapter, where we created a static connection to a file, in this chapter, we are
    building a living, breathing connection to a live Google Sheets document. When
    the Google Sheets data changes, then we will see our Data Studio content change
    too. To create a data connection to the Google Sheet, do the following:


    1. Click `“Add data.”`

    2. Locate `“Google Sheets”` in the Google Connectors list and click it. You will
    need to authorize it if it’s your first time connecting a Google Sheet to Data
    Studio.

    3. Locate Hermann’s sales report: `“DS - Coffee Shop.”`

    4. Select the file and select `“Menu”` (the first tab in the Google Sheet).

    5. Click the blue connect button in the top right-hand corner, then click `Add`,
    then `Add to Report`.


    ### Step 5: Create a Raw Table View of the Data


    Whenever I start looking at the data that I need, I find that the easiest way
    to understand it is to use table control to investigate the raw data. This gives
    an overview of the data before we zoom down into the detail to get the information
    we need. It’s also handy for doing some initial quality checking and double checking
    that the data is there and it’s in the format we expect.


    To create a raw table view of the data:


    ![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig2_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig2_HTML.jpg)


    Figure 2-2: Adding a raw table to your Data Studio report


    1. Click `“Add a chart”` and select the first table icon on the top row as shown
    in Figure [2-2](#485069_1_En_2_Chapter.xhtml#Fig2).

    2. Click the rectangle where you would like to place the table and you will see
    the data from your Google Sheet appear.


    Now that we have the data successfully coming through from Google Sheets into
    our table, we can start to try and make the data useful to our client.


    #### Helping Users to Ask Questions of the Data


    Based on the data, we are going to try and help Hermann to understand his sales
    data in a bit more detail. A good starting point is to do some exploratory data
    analysis to understand the shape of the data. Some of the simpler questions we
    can answer using the data are:


    - What products are responsible for the majority of his sales?

    - What types of flavors are customers buying the most of?

    - How do the sales of these products compare vs. last year?


    A raw table of data doesn’t really give us a clear indication of what’s going
    on with the sales. It just displayed to us a wall of text and numbers, which is
    difficult for our brains to process and interpret. We want the report to do the
    heavy processing for us to help our users understand the data. We can do this
    by transforming the raw table into something more visual, such as a pie chart.
    By adding a pie chart to the Data Studio report, we are gifting the user an easier
    way to interpret the data. Humans are visual creatures and we relate to the world
    around us by using our senses to understand the world. The world of data is much
    the same; by adding visual features to the report that guide the user as to what
    the information is saying, it lets them focus on what is most important for them.


    #### Add a Pie Chart


    To add a pie chart to show the breakdown of sales:


    ![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig3_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig3_HTML.jpg)


    Figure 2-3: Adding a pie chart


    1. Click `“Add a chart”` and select the first Pie Chart control (Figure [2-3](#485069_1_En_2_Chapter.xhtml#Fig3)).


    ![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig4_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig4_HTML.jpg)


    Figure 2-4: Pie chart according to product name


    2. Click where you want to place the chart.


    When we first add the pie chart, Data Studio defaults to showing the first field
    in the data set which is `“Product Name.”` It also defaults to showing us the
    data from this year. As you can see from Figure [2-4](#485069_1_En_2_Chapter.xhtml#Fig4):


    - Our top selling product is `“Banana Loaf,”` closely followed by the delicious
    Lavender Cupcake. Good old traditional Chocolate Cake is sitting in at third most
    popular.

    - Our top four products account for roughly 50% of our total sales.

    - Each one of our top four products is selling roughly the same proportion of
    units.


    ## Step 6: Duplicate the Pie Chart and Change the Dimension to “Product Type”


    Let’s take a different view of the data to get a different perspective by duplicating
    the pie chart and changing the dimension to product type (Figure [2-5](#485069_1_En_2_Chapter.xhtml#Fig5)).
    To do this:


    ![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig5_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig5_HTML.jpg)


    Figure 2-5: Pie chart according to Product Type


    1. Right-click the pie chart and select `Duplicate`.

    2. Drag the pie chart immediately to the right of the original pie chart.

    3. Select the new pie chart and click `“Product Name”` in the right Panel under
    `“Dimension”` and select `“Product Type.”`


    When we selected the dimension called `“Product Type,”` we told Data Studio to
    reprocess the data in our table, and instead of grouping it by product name, we
    should instead group it by product type. By changing this `“dimension”` that it
    uses, it changes the lens that we use to look at the data and shows it from a
    different perspective. Dimensions (and metrics) are the fundamental building blocks
    for data reporting, and we will be exploring these further in the next few chapters
    in the book.


    For now, let’s just admire how the small change to our pie chart has helped us
    to understand the sales data even more. When we view the sales data through the
    lens of `“product type,”` we can see:


    - Nearly 50% of our sales come surprisingly from cupcakes.

    - A third of our sales come from cakes.'
