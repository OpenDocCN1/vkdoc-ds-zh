    \ slower-moving organizations, the people who are responsible for creating dashboards\
    \ in a business would have a job title that includes the term “analyst” or “data\
    \ manager.” If you work in one of these organizations, I want you to take a step\
    \ out of the “analyst” box and start to think of yourself as being a “developer”\
    \ and adopting a developer mindset when it comes to building out your data visualization\
    \ reports.\n\nIn some more forward-thinking organizations, the job title given\
    \ to those people who specialize in building dashboards or creating data pipelines\
    \ is usually called BI (business intelligence) developers or data engineers.\n\
    \nBy taking this first mental step forward and calling yourself a developer, you\
    \ are bringing these three facts to the front of your mind:\n\n1.  As someone\
    \ who builds data visualization systems that businesses rely on for progress and\
    \ decision making, you are just as valuable as someone who makes an ecommerce\
    \ store work correctly.\n\n2.  Your work can have the vital impact on a business\
    \ to help them succeed.\n\n3.  With data development skills, comes the duty to\
    \ have care that what you are developing is quality, accurate, and fit for its\
    \ intended purpose.\n\nWhen I have built data reports for businesses, I have benefited\
    \ from using processes that are typically associated as being developer processes.\
    \ Not because I try to make things more complicated but rather to focus on delivering\
    \ trusted and maintainable data visualizations. The data developer roles are probably\
    \ one of the most impactful roles that exists in a modern business, so it’s up\
    \ to us to do the work to get things right. So congratulations on entering the\
    \ world of being a developer!\n\n## Getting Started: Hello World!\n\nWhenever\
    \ any developer starts a new programming language, they typically start off with\
    \ writing a program that shows the words “Hello World” on the screen. Since you\
    \ are all burgeoning data visualization developers, we are going to kick off our\
    \ journey by using Data Studio to say hello to the world. We’re going to create\
    \ a simple report that pulls data from a CSV file.\n\nNote\n\nGoogle Studio is\
    \ constantly evolving with new releases and features. As such, the screenshots\
    \ in this book may look slightly different from what you see on your screen.\n\
    \n### Step 1: Getting Setup with a Google Account\n\nData Studio is a free tool\
    \ for anyone to use. In order to access Data Studio, you need to have a Google-enabled\
    \ account. Good news! If you have a Google, Gmail, or a G Suite business account,\
    \ you are ready to get started and you can skip to the next step.\n\nFor those\
    \ of you who don’t have a Google Account, you can visit this URL: [`https://accounts.google.com/signup/v2/webcreateaccount`](https://accounts.google.com/signup/v2/webcreateaccount).\n\
    \nOn this page you can decide if you want to sign up for a new Gmail.com address\
    \ or to activate an existing email as a Google Account. Either type in the username\
    \ you want to use for your new Gmail address or click “Use my current email address\
    \ instead” as shown in Figure [1-1](#485069_1_En_1_Chapter.xhtml#Fig1).\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig1_HTML.jpg](images/485069_1_En_1_Chapter/485069_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1\n\nSetting up your new Google Account using a new Gmail address or\
    \ an existing email address\n\nFill in the sign-up form with your details to continue.\n\
    \n### Step 2: Open Up Data Studio\n\nAfter you have a Google Account, head on\
    \ over to [`https://datastudio.google.com`](https://datastudio.google.com) to\
    \ open up the Data Studio home screen.\n\nThe Data Studio home screen (Figure\
    \ [1-2](#485069_1_En_1_Chapter.xhtml#Fig2)) is your launch pad into the world\
    \ of Data Studio. Before we create our first dashboard, let’s get familiar with\
    \ the interface (Figure [1-3](#485069_1_En_1_Chapter.xhtml#Fig3)). It’s made up\
    \ of four key parts:\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig3_HTML.jpg](images/485069_1_En_1_Chapter/485069_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nData Studio interface\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig2_HTML.jpg](images/485069_1_En_1_Chapter/485069_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2\n\nData Studio home page\n\n1.  **The Template Gallery** gives you\
    \ a quick way to get started with a new dashboard. You can either use a blank\
    \ report or use a premade template that was created by the Data Studio team. To\
    \ jump in with a premade template, press the “All Templates” button in the top\
    \ right-hand corner.\n\n2.  **The Report Organizer area** is just below the template\
    \ bar, and it is a set of organizational columns or filters that allow you to\
    \ sort your reports based on\n    *   Name\n\n    *   Owner\n\n    *   Last opened\n\
    \n3.  **The left menu** gives you a quick way to\n    *   Create new reports\n\
    \n    *   Access reports that were created by others and shared with you\n\n \
    \   *   Access reports that you created or copied from others\n\n    *   View\
    \ the trash for any reports you have deleted\n\n4.  **The search bar** at the\
    \ top is a handy tool to let you search for reports by name."
  trans: "\n# 记住：你是一位数据开发者\n\n当人们听到“开发者”这个词时，他们对这个角色的含义会有一些先入为主的看法。最常见的印象是，开发者是天才能以计算机般的方式在脑中处理海量算法来生成代码。这是一种误解。开发者只是普通人，他们投入时间学习编程语言，并理解所用技术的工具、技巧、细微差别和特性以产出成果。任何专业工作，无论是砌砖工、水管工还是开发者，都需要你学习行业工具来建造人们所需的东西。按我的定义，开发者就是从无到有创造事物的人。房地产开发商买下一块土地，建造房屋供人居住。Web\
    \ 开发者则从零开始构建应用或网站。\n\n在大多数传统、行动缓慢的组织中，负责为企业创建仪表板的人员，其职位通常包含“分析师”或“数据经理”等字眼。如果你在这样的组织工作，我希望你能跳出“分析师”的框架，开始将自己视为一名“开发者”，并在构建数据可视化报告时采用开发者的思维方式。\n\
    \n在一些更具前瞻性的组织中，专门从事仪表板构建或数据管道创建的人员的职位通常被称为 BI（商业智能）开发者或数据工程师。\n\n通过迈出这精神上的第一步，称自己为开发者，你将把以下三个事实牢记于心：\n\
    \n1.  作为构建企业依赖其进行进度跟踪和决策的数据可视化系统的人，你和那些确保电商网站正常运行的人同样有价值。\n2.  你的工作可以对企业的成功产生至关重要的影响。\n\
    3.  掌握数据开发技能的同时，也肩负着责任，要确保你开发的内容质量高、准确无误，并且适合其预期用途。\n\n在我为企业构建数据报告的过程中，得益于使用了通常被视为开发流程的方法。这不是因为我试图把事情搞得更复杂，而是为了专注于交付可靠且可维护的数据可视化成果。数据开发者的角色可能是现代企业中最具影响力的角色之一，因此我们有必要做好工作，把事情弄对。恭喜你，欢迎进入开发者的世界！\n\
    \n# 开始入门：你好，世界！\n\n每当开发者开始学习一门新的编程语言时，他们通常从编写一个在屏幕上显示“Hello World”的程序开始。既然你们都是新兴的数据可视化开发者，我们将通过使用\
    \ Data Studio 向世界问好，来开启我们的旅程。我们将创建一个简单的报告，从 CSV 文件中提取数据。\n\n**注意**：Google Data\
    \ Studio 在不断进化，并推出新版本和功能。因此，本书中的截图可能与你在屏幕上看到的略有不同。\n\n## 步骤 1：设置 Google 账户\n\n\
    Data Studio 是一款任何人都可以免费使用的工具。要访问 Data Studio，你需要拥有一个支持 Google 服务的账户。好消息！如果你有 Google、Gmail\
    \ 或 G Suite 企业账户，你已经可以开始了，并可以跳到下一步。\n\n对于那些还没有 Google 账户的人，你可以访问此网址：[`https://accounts.google.com/signup/v2/webcreateaccount`](https://accounts.google.com/signup/v2/webcreateaccount)。\n\
    \n在此页面上，你可以决定是注册一个新的 Gmail.com 地址，还是将现有的电子邮件激活为 Google 账户。输入你想用于新 Gmail 地址的用户名，或点击“改用我的当前电子邮件地址”，如图\
    \ 1-1 所示。\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig1_HTML.jpg](img/485069_1_En_1_Fig1_HTML.jpg)\n\
    \n**图 1-1**  \n使用新的 Gmail 地址或现有电子邮件地址设置你的新 Google 账户\n\n填写注册表格中的详细信息以继续。\n\n##\
    \ 步骤 2：打开 Data Studio\n\n拥有 Google 账户后，前往 [`https://datastudio.google.com`](https://datastudio.google.com)\
    \ 打开 Data Studio 主屏幕。\n\nData Studio 主屏幕（图 1-2）是你进入 Data Studio 世界的发射台。在创建第一个仪表板之前，让我们先熟悉一下界面（图\
    \ 1-3）。它由四个关键部分组成：\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig3_HTML.jpg](img/485069_1_En_1_Fig3_HTML.jpg)\n\
    \n**图 1-3**  \nData Studio 界面\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig2_HTML.jpg](img/485069_1_En_1_Fig2_HTML.jpg)\n\
    \n**图 1-2**  \nData Studio 主页\n\n1.  **模板库** 提供了一种快速开始创建新仪表板的方式。你可以使用空白报告，也可以使用\
    \ Data Studio 团队创建的预制模板。要使用预制模板，请点击右上角的“所有模板”按钮。\n\n2.  **报告组织区域** 位于模板栏正下方，是一组用于按以下条件对报告进行排序的组织列或筛选器：\n\
    \    *   名称\n    *   所有者\n    *   上次打开时间\n\n3.  **左侧菜单** 让你能够快速进行以下操作：\n    *\
    \   创建新报告\n    *   访问由他人创建并分享给你的报告\n    *   访问你创建或从他人处复制的报告\n    *   查看已删除报告的回收站\n\
    \n4.  **顶部的搜索栏** 是一个方便的工具，可以让你按名称搜索报告。\n"
- fmt: '### Step 3: Create a Blank Report


    To create a blank report, click the “Create” plus icon either in the upper left
    corner of the screen and select `Report`, or you click the plus icon in the template
    bar.


    The Data Studio interface always looks quite intimidating at first glance. Don’t
    worry. By the end of this book, you will know the interface like the back of your
    hand as you will have used all the features on it. For now, we will just run through
    the main core areas of the interface:


    - The report title

    - The sharing button

    - The view/edit mode button

    - The primary toolbar

    - The reporting canvas

    - The configuration panel


    > **Note**: You might see an introduction screen to help you connect a data source.
    We’ll get to that shortly, but for now, just close it so you can get to the main
    interface.


    #### Step 3.1: Name Your Report


    Click the text “Untitled report” in the upper left corner of the screen to rename
    your report. Choose something easy to understand, such as “Learning - Hello World.”
    Then, press `Enter` or click away from the name box.


    It’s good practice to keep your workspace tidy and protect your data. One useful
    habit that I have learned is that I will always start a new report by renaming
    it from the default name that Data Studio gives it.


    The best names are those that are memorable and include the terms that you are
    likely to search for when trying to find it in a list. Choosing a good name for
    a report is like writing a love letter to yourself in the future. You will feel
    so happy that you took the time to save yourself that extra time trying to find
    it. I can’t tell you the amount of time that I have saved just by having a good
    report name.


    My most common names that I use are:


    - For clients or brands I am working for, I use `“Brand - Acquisition report”`
    or `BrandA - YouTube weekly report`.

    - If I am just creating a new report to play around with a feature, I use the
    term `“Playground”` to describe it – for example, `“Calculated fields Playground.”`

    - If I am just creating a temporary report to experiment with something, then
    the best possible name to use is simply `“delete me”` so it doesn’t become another
    report to open when I am looking for something important.


    ### Step 4: Creating Your First Data Connection


    When we think about building a Data Studio report, it’s a little like being a
    plumber. We want to make the water flow from the outside to our main sink where
    we can make use of it for washing, cooking, and drinking. To get this first report
    working, we need to make a connection to our main “data” water supply. In this
    case, we will be getting data from a CSV file.


    #### Step 4.1: Download the Sample CSV File


    We are going to connect directly to the most basic possible data source: a CSV
    file. For this example, we are going to use a simple text file that I created
    using a text editor. The file is in a standard format called a “comma separated
    values” file (or CSV for short). If there was a universal language for exchanging
    data between systems, then CSV would probably be it.


    Download the sample CSV file (`Ch1_ExampleCSV.csv`) from the book’s source code,
    available at [`www.apress.com/9781484251553`](http://www.apress.com/9781484251553).


    Most platforms that people use will usually have support for exporting their data
    into CSV, so this exercise is going to be a technique that you are going to use
    over and over.


    #### Step 4.2: Upload the CSV File to Data Studio


    Now that we have got our file of data, we need to get it put into a form that
    Data Studio can access and manipulate. We do this by clicking the “Add data” button
    from the toolbar. You’ll then see a long list of different types of data sources.
    At the time of print, we have:


    - **Google Connectors** – This includes common connectors such as Google Ads,
    Google Analytics, and Google Sheets. I find that these connectors are generally
    the most reliable as they have been built by the internal Google teams and are
    directly supported by Google.

    - **Partner Connectors** – The partner connectors have been created by third-party
    companies and generally require you to pay for their use. These companies generally
    support the plug-ins directly; however, you may have mixed experiences if you
    rely on these for your reporting. You generally have to rely on the company that
    created them to make changes as you can’t see the code for them. Not all of these
    connectors have large support teams and can take a long time to address any issues
    that you have. Having said that, some of these connectors are extremely powerful
    such as the very popular `“Supermetrics”` connector which lets you connect to
    Google Search Console, Facebook Insights, and even to payment providers such as
    Stripe.

    - **Open Source Connectors** – These are data sources that are generally built
    by wider community members and are contributed to Data Studio for the benefit
    of others. The advantage of these is that you can directly see the code for them
    and thus can change them if it’s relevant for your project. Most of these connectors
    are free; however, like other open source projects, you are reliant on other people
    to fix any issues.


    The connector that we want to use right now is called `“File Upload.”` Once you
    have selected it, you need to drag your CSV file into the upload box, or click
    the button to browse for the file on your computer.


    You will be asked to Authorize access for Data Studio to upload this file to your
    Google Cloud Storage. We won’t go into too much detail on Google Cloud Storage
    in this book, but you can think about it as being a secure hard disk somewhere
    on the Internet. Google does the hard work of hosting, securing, and protecting
    access to it so you don’t have to worry about unauthorized people having access
    to it. Click `Authorize` and `Accept` to give Google Data Studio access to your
    storage.


    Once you have approved Google to store your CSV file into Google Cloud Storage,
    we are finally ready to upload our data.


    After a few seconds, the status of the file has changed from `uploading` to `processing`
    to `uploaded`.


    You will see there are four status fields at the bottom of the page. These include:


    - The file name you uploaded

    - When the file was uploaded

    - Size of the file

    - Status of the file


    The `Uploaded` status has a handy little green dot next to it, which indicates
    that Google is happy with the data and you are good to continue connecting.


    Once the file is done uploading, you have the option to rename the source by clicking
    the file name. You should always give your data sources an easy-to-understand
    name. This will help you identify it later on. A bit of tidying up front will
    save you a lot of pain at the end, especially when you have hundreds of data sources
    littering your data sources folder. For this exercise, let’s call it `“Hello World
    - CSV.”` See Figure [1-4](#485069_1_En_1_Chapter.xhtml#Fig4).


    ![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig4_HTML.jpg](images/485069_1_En_1_Chapter/485069_1_En_1_Fig4_HTML.jpg)


    *Figure 1-4 – Uploading a CSV file data source*


    Selecting the blue `“Add”` button will let you select the CSV file to upload it
    to your account.'
