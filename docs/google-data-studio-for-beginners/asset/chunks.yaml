  trans: "\n从烘焙店的例子可以看出，有很多决定因素与我们正在进行的销售相关。了解某些口味更受欢迎是一项至关重要的知识，因为这意味着烘焙师可以重点展示这些最受欢迎的口味。\n\
    \n最后要记住的一点是：大多数现代企业分析的都是“多维”数据——这意味着数据并非仅仅依赖于单一维度来解释。以我们的蛋糕为例，烘焙店会销售众多口味的纸杯蛋糕，但针对每一种口味，我们可能又有多种不同味道的奶油糖霜。我们还可能有多种不同的主题，而这些主题的销售情况又会根据星期几或季节的不同而有所差异。例如，无糖蛋糕可能会在某些特定人群中销量很好。\n\
    \n这就是优秀的数据开发者或数据可视化工程师的用武之地。维度为指标提供了背景信息，并帮助理解数据。你有能力在数据集上“尝试”一组维度，看看它是否能为最终用户提供更多洞察。你也可以查看数据是否与你试图实现的业务目标有很强的关联性。\n\
    \n## 本章小结\n\n在本章中，我们讨论了指标本身或聚合后的指标如何变得有价值，尤其是在结合维度考虑其背景信息时。\n\n脚注 1 2 3\n\n# 4.\
    \ 在线调查\n\n案例研究：用户画像分析\n\n> *事实上，现代教学方法尚未完全扼杀神圣的好奇心，这简直就是一个奇迹。*\n> \n> ——阿尔伯特·爱因斯坦，理论物理学家\n\
    \n既然我们已经在前几章介绍了一些基础知识，让我们看看如何将 Google Data Studio 应用于另一个真实场景：分析在线调查产生的数据，为一位客户收集客户信息。本章基于我们为一家知名旅行公司所做的真实项目。客户无需昂贵的可视化工具就能获得对其客户数据的交互式分析，这不仅成本效益高，而且极其有用。这为我们的客户提供了洞察力，他们可以利用这些洞察来制定内容和营销策略，从而更精准地定位客户。\n\
    \n## 了解旅行公司的需求\n\n首先，我们需要进一步了解客户的需求。作为一家知名的旅行公司，他们希望我们帮助他们了解他们的客户是谁。\n\n## 收集数据\n\
    \n下一步是收集数据。我们向客户的客户发送了大约一万封电子邮件，邀请他们使用 `SurveyMonkey` 填写一份调查问卷。\n\n问卷询问了关于客户自身的问题：\n\
    \n*   性别\n*   年龄段\n*   薪资范围\n*   婚姻状况\n*   子女（及孙辈）情况\n*   职位头衔\n\n以及他们对方网站/服务的看法：\n\
    \n*   度假频率\n*   度假的原因\n*   是否喜欢网站的某些方面\n*   是否喜欢服务的某些方面\n\n我们还设置了自由文本问题，即一个文本框，允许他们输入信息，例如他们认为网站是否缺少某些内容，从而对一些关键问题获得更开放的回复。\n\
    \n在收到所有提交结果（约 5,000 份问卷）后，我们准备整理数据以用于报告。\n\n## 准备数据\n\n下一步是在将数据导入 Data Studio\
    \ 之前对其进行准备。`SurveyMonkey` 能够将结果导出为 `xls` 文件，这是一种我们可以轻松导入 Google Sheets 的格式。将结果上传到\
    \ Google Sheets 后，我们开始清理数据。\n\n正如第 2 章所述，清理数据意味着确保数据集中的任何内容都是有效的。例如，尽管我们使用了公司的邮件列表（假设这些人希望收到关于该服务的联系），我们仍然收到了来自不想被打扰的人的“垃圾”回复。我们还必须删除任何被视为\
    \ `null` 或空白的回复。我们还需要确保所有列都有唯一的名称。别担心——每个数据集都会有问题。\n\n在这个案例中，我们处理的是一个相对较小的数据集，大约\
    \ 5,000 份问卷，我们可以直接从 Google Sheets 导入到 Data Studio。如果我们有更大的数据集，可以首先将其上传到 Google\
    \ BigQuery，然后再以类似的方式导入到 Data Studio。\n\n清理完数据后，我们就准备将其导入 Data Studio。请确保您在同一帐户中有权限访问该\
    \ Google Sheets 文件，并且文件名是合适的。\n\n在 Data Studio 中，首先创建一个报告。系统会提示您向报告添加数据源。只需点击\
    \ Google Sheets 选项（图 4-1）。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig1_HTML.jpg](img/485069_1_En_4_Fig1_HTML.jpg)\n\
    \n图 4-1\n\n用于选择 Google Sheets 的点击按钮\n\n## 设计报告\n\n接下来，我们需要设计报告，使其既实用又美观。我们可以通过结构化数据呈现方式并保持元素在整个报告中的一致性来实现这一点。\n\
    \n保持报告中元素的一致性始终是件好事。这有助于增强整体连贯性，与公司品牌建立联系，并且视觉上令人愉悦。\n\n让一切看起来一致意味着你的客户会觉得报告更易于阅读。\n\
    \n### 页眉栏\n\n你可以做的一件事是添加一个包含公司徽标的页眉栏。你也可以使用纯文本页眉，但如果你有徽标，使用徽标看起来效果更好。\n\n要上传图片，请点击工具栏中的“图片”图标，并选择“从计算机上传”或“按网址上传”，具体取决于你的实际情况。然后，将徽标放置在报告页面的顶部某处。右键点击徽标并选择“设为报告级别”。这意味着如果你的报告有多页，该徽标将出现在每一页的顶部。\n\
    \n### 配色主题\n\n另一件可以做的事情是为报告设置一个配色主题，使其在整体上保持一致。如果你为其制作报告的公司有配色方案，你可以通过从图像（可以是公司的徽标，甚至是他们网站的截图）中提取配色方案，将其融入到你的报告中。\n\
    \n在工具栏上点击 `主题和布局`，在右侧窗格中点击 `从图像中提取主题`（图 4-2）。你可以从计算机上传图像，也可以按网址上传。\n\n![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig2_HTML.jpg](img/485069_1_En_4_Fig2_HTML.jpg)\n\
    \n图 4-2\n\n提取图像调色板按钮的截图\n\n然后你可以从生成的三款主题中进行选择。如果喜欢某一款，点击它并按下“应用”。如果你觉得提取结果的颜色多样性或对比度不足，可以手动编辑配色主题，使你的报告更好地符合公司或客户的风格。点击\
    \ `主题和布局` 窗格中的 `自定义` 按钮。\n\n### 页脚栏\n\n此外，考虑在报告底部创建一个页脚栏，其中包含如何联系你的信息，或者如果你是一家代理机构或内部团队，可以放置一个链接指向你的联系信息，以便有人需要调整某些内容时可以联系你。\n\
    \n你可以使用文本工具输入这些信息，并将其放置在页面底部。\n"
- fmt: '### Detailed to Granular


    Plan to present the data with an overview at the top, then work your way down
    to more detailed and granular data. It is often easier to start with a longer
    page, then trim it down from there.


    I would also recommend using a rule of thirds or 50/50 for content – meaning that
    you make tables and charts either one-third, two-thirds, or 50/50 – you can draw
    a line two-thirds across the report and halfway so you can use these as guidelines
    for layout. You can use the `Line` tool in the toolbar for this purpose.


    ## Getting Data onto the Page


    Next, we need to add data to the report. As we mentioned earlier, it is a good
    idea to start with overview data before drilling down into the details. A good
    way to do this is to start with a pie chart.


    Although pie charts are often considered to be bad for users as it is hard to
    interpret exact values, you can use them (or a doughnut chart) at the top for
    key groups to be used as filters. Almost any chart can be used with a filter by
    setting the `Interactions – Apply Filter` to be enabled. This will mean that if
    you click a segment within the doughnut or pie, it will apply this to the data
    source.


    Generally, we will apply this to all the other charts and tables – allowing them
    all to be able to filter the report as people click into rows or slices of data
    (see Figure [4-3](#485069_1_En_4_Chapter.xhtml#Fig3)).


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig3_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig3_HTML.jpg)


    Figure 4-3: `Apply Filter` button


    We now have a very visual way of seeing the data within the report and being able
    to quickly drill downward across all tables and information from the same data
    source. If we have multiple data sources, it will normally only apply to elements
    from the same source (you can also use groups of charts if you do not want filters
    to apply to the entire report).


    A list of this information alone is potentially useful to a marketing manager,
    but they probably already know most of this, and so to make it more useful, we
    combine dimensions together; it gives us a little more insight. We can do this
    using pivot tables or more graphically using stack charts. For example, if we
    use a stacked bar chart, we can combine our data on gender, marital status, and
    if they have kids. See Figure [4-4](#485069_1_En_4_Chapter.xhtml#Fig4).


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig4_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig4_HTML.jpg)


    Figure 4-4: Stacked bar chart


    At this point now we can see that most of the respondents in this form are married
    and most are over 55 years old. This prompts us to consider: *Is any bias in the
    data? Are these people more likely to fill in a survey?*


    A pivot table can also give us greater insights, especially if we use a heatmap.
    This combined with the questions that marketers can use to make decisions.


    The pivot table heatmap (Figure [4-5](#485069_1_En_4_Chapter.xhtml#Fig5)) combines
    purchase frequency with demographic information. According to this, the marketing
    should target people who are more mature for frequent loyal customers.


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig5_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig5_HTML.jpg)


    Figure 4-5: Example of a pivot table showing purchase frequency by age


    You can combine this table with other relevant visualizations (Figure [4-6](#485069_1_En_4_Chapter.xhtml#Fig6))
    and watch how when interacting with one it impacts another. These relationships
    with data can be quite hypnotic, and the easiest visualization for creating these
    interactions is pie charts. However, as mentioned before, we should try to avoid
    pie charts as humans are not very good at reading and comparing angles. Many experts
    suggest using either a treemap or a bar chart instead for simple filters. Despite
    that, pie charts are still a decent alternative to using a drop-down box.


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig6_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig6_HTML.jpg)


    Figure 4-6: Pie chart and Treemap demonstrating how to show data that can be used
    as a filter


    Either type can be made to apply a filter, which means that they can be used alongside
    the more detailed information that is driving decisions. For instance, they can
    be used to understand the impact of a particular feature on a website.


    ## Free Text Analysis


    There were a number of free text boxes in the survey that we can look at in several
    different ways. If there are enough entries, it’s possible that there will be
    some overlap or essentially the same response. It can be a little challenging,
    but with a little analysis we can take the data a little further.


    In the survey, we asked if there was anything missing in the product description.
    Figure [4-7](#485069_1_En_4_Chapter.xhtml#Fig7) shows the top results.


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig7_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig7_HTML.jpg)


    Figure 4-7: Table showing free text results for the question "Was there anything
    missing from the product description?"


    Ideally we would like to consolidate similar results and remove the `null`, or
    replace it with no response.


    -   `Lowercase` and `Trim` all responses

    -   `Case` statement to consolidate common patterns


    Ultimately it would be good to do smart extraction using machine learning, which
    can be done cheaply and increasingly easily, but that’s the subject for a separate
    book. For now, we can work with the tools in `Data Studio`.


    `Null` can be easily replaced by `no data` in the formatting (missing data), and
    while we are there, we can improve the text handling, changing it to `Wrap Text`
    for longer answers. See Figure [4-8](#485069_1_En_4_Chapter.xhtml#Fig8).


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig8_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig8_HTML.jpg)


    Figure 4-8: Formatting options for a table


    We can also include additional classifications for common words. There are some
    word cloud visualizations within the community selectors, but none of these quite
    meet our needs. So the first part of this is almost by-hand analysis; when we
    spot common patterns, we can use the case statement – if there are particular
    themes we want to bring out, for instance – some mentioned images, some mentioned
    pools, and some mentioned kitchens.


    In Figure [4-9](#485069_1_En_4_Chapter.xhtml#Fig9), we can see how we can classify
    the text if it includes a specific word, which allows us to filter the report
    by people who entered a particular keyword such as in Figure [4-10](#485069_1_En_4_Chapter.xhtml#Fig10).


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig9_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig9_HTML.jpg)


    Figure 4-9: Custom field with case statement


    One minor issue is that using this method, they can only fit into one theme, and
    so if it mentioned photos or images, then it won’t also be counted as being in
    pool; as such, the order/prioritization of the case rules is important. Besides,
    this does give us the ability to create a simple drop-down so you can spot and
    analyze common themes, and of course this drop-down will also apply to all other
    data in the report. See Figure [4-10](#485069_1_En_4_Chapter.xhtml#Fig10).


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig10_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig10_HTML.jpg)


    Figure 4-10: Classified text in a drop-down filter


    ## Final Result


    So now we have an interactive report based on survey data that allows a marketer
    to drill into this and develop insights of their own, the best thing – it is quite
    easy to tweak and improve. See Figure [4-11](#485069_1_En_4_Chapter.xhtml#Fig11).


    ![../images/485069_1_En_4_Chapter/485069_1_En_4_Fig11_HTML.jpg](images/485069_1_En_4_Chapter/485069_1_En_4_Fig11_HTML.jpg)


    Figure 4-11: Outputting the data with heatmap pivot tables and doughnut charts'
