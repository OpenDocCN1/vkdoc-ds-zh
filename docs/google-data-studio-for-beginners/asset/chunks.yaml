  trans: "\n# 1. 开启你的 Data Studio 之旅\n\n构建你的第一份 Data Studio 报告\n\n> *问题催人奋进。问题让我们看见生活的美好。永远不要停止提问。*\n\
    > \n> ——彼得·考德隆，《你好，世界》(自出版，2019 年)\n\n如今被视为“数据专家”或“数据大师”的大多数人，或许看起来像“巫师”，但他们也曾是初学者。某天，某件事促使他们决定开始尝试使用数据可视化工具。也许是一个周末或一个晚上，他们没有瘫在电视机前，而是选择打开笔记本电脑，开始摆弄一款数据工具。对他们来说，这个过程起初相当令人沮丧，因为坦率地讲，文档通常不怎么好，示例也往往更难以理解。在我的个人旅程中，我发现即使是为了完成一些我认为非常基础的任务，我也可能花上数小时去理解各种概念和想法。我最终找到了自己的路，但过程充满了压力和痛苦的学习经历。\n\
    \n好消息是，我们将一起踏上这段旅程。在本章中，我将引导你迈出使用 Data Studio 的第一步，并与你并肩作战，直到你准备好独当一面。\n\n所以，拉把椅子坐下，确保手边有一杯好喝的饮料，我们就要开始尝试在\
    \ Data Studio 中构建你的第一份数据报告了。\n\n## 开启你的数据之旅\n\n我总是说，不是你找到了数据，而是数据找到了你。我曾与来自各行各业的无数人合作过，他们对数据的理解和兴趣处于不同阶段。通过我在各种会议和聚会上进行的演讲，我有幸遇到了许多正处于对数据产生兴趣初期阶段的人。最令我惊叹的是，他们来自如此多样的背景。他们唯一的共同点是，都曾面临一个让自己陷入困境的挑战或十字路口。他们知道自己理解中缺少了某一块，并正在寻找数据的“超级英雄”来拯救他们。\n\
    \n我当然希望数据是一颗神奇的子弹，可以简单启动就能解决问题；然而，在现实中，找到数据仅仅是旅程的开始。对一些人来说，他们在数据之路上走了一段后，可能会发现自己已经足够了，于是转向其他感兴趣的事情。而对另一些人来说，他们将被推向每周都在涌现的、大量精彩的新数据工作专业领域。\n\
    \n数据科学家、数据工程师、人工智能工程师——这些几年前还相当罕见的新角色，现在在大多数组织中都变得越来越普遍。可以说，如今即使要成为一名相当称职的数字营销经理，也需要具备以前只有数据分析师才需要的数据素养水平。\n\
    \n无论你选择哪条路（或者不选），我学到一个突出的事实是：每个人都能从数据可视化技能中获益。它可以帮助你：\n\n- 用数据讲故事\n- 带领你的受众与你一同踏上旅程\n\
    - 帮助你的受众理解你的数据并从中提炼洞察\n\n就我个人而言，我发现我的大脑就是无法处理成堆的数字或文字。我使用数据可视化作为探索和理解数字的方法。这就像查看一张海滩图片与感受指间沙粒、聆听海浪拍岸之间的区别。\n\
    \n数据可视化让数据变得鲜活，并将其转化为真实的东西。\n\n## 企业对数据的态度\n\n在我的职业生涯中，一个分水岭般的发现是：企业在使用数据方面，与人们非常相似。数据的使用方式因人们的生活和经历而存在巨大差异。有些人高度依赖数据生活，无论是分析预算、规划未来，还是优化账单、通勤，甚至是在哪里购买日用品。另一些人则随遇而安，依靠自己的个性和直觉来获取生活中想要的东西。\n\
    \n当你开始将数据应用于企业时，首先需要了解这家企业对数据的态度。在公司的文化中，数据要么是业务的核心驱动力，要么是上级强加给别人的烦恼，其唯一使命就是阻止别人做自己想做的事。\n\
    \n我认为企业是极其复杂且重要的实体，不能依赖数据来做决策是行不通的。一个好的品牌或产品只能带你走这么远，之后你就需要开始理解市场和商业目标才能成功。当我遇到那些嘲笑数据的人时，我总是强调一点：数据从来不是企业的首要任务，直到它成为*首要*任务（当事情进展不顺时，这种情况会以难以置信的速度和突然性发生）。\n\
    \n在大学时，我忍受着无数枯燥乏味的统计学课程，并痛恨它们从不实用，总是停留在理论层面。如果我当时知道这些知识的应用前景，我可能仍然不会喜欢它们，因为它们对我来说不够真实。我非常希望当时能有真实世界的例子来教我数据这门手艺的方方面面。作为一个通过实践来学习的人，这是我能理解任何事物的最有效方式，而这也正是我试图通过这本书做到的。\n\
    \n那么，让我们一起继续深入 Data Studio 的旅程吧。我深情地回忆着自己的旅程，并希望我能为你缩短一些痛苦的过程，分享一些我在熟练掌握数据的道路上，迈出各种步伐（以及误入歧途）时所积累的积极经验。\n"
- fmt: "# Remember: You Are a Data Developer\n\nWhen people hear the word “developer,”\
    \ they have several preconceived ideas about what that role means. The most common\
    \ impression is that a developer is someone who is a genius and is able to process\
    \ massive algorithms in their head in a computer-like way to produce code. This\
    \ is a misguided idea. Developers are just regular people who have invested their\
    \ time to learn a programming language and to understand the tools, techniques,\
    \ nuances, and quirks of the technology they are using to produce results. Any\
    \ professional job, be it a bricklayer, plumber, or indeed a developer, requires\
    \ you to learn the tools of the trade to build what people need. A developer,\
    \ by my definition, is simply someone who creates something out of nothing. A\
    \ property developer takes a piece of land and produces homes for people to live\
    \ in. A web developer produces apps or websites from nothing.\n\nIn most older,\
    \ slower-moving organizations, the people who are responsible for creating dashboards\
    \ in a business would have a job title that includes the term “analyst” or “data\
    \ manager.” If you work in one of these organizations, I want you to take a step\
    \ out of the “analyst” box and start to think of yourself as being a “developer”\
    \ and adopting a developer mindset when it comes to building out your data visualization\
    \ reports.\n\nIn some more forward-thinking organizations, the job title given\
    \ to those people who specialize in building dashboards or creating data pipelines\
    \ is usually called BI (business intelligence) developers or data engineers.\n\
    \nBy taking this first mental step forward and calling yourself a developer, you\
    \ are bringing these three facts to the front of your mind:\n\n1.  As someone\
    \ who builds data visualization systems that businesses rely on for progress and\
    \ decision making, you are just as valuable as someone who makes an ecommerce\
    \ store work correctly.\n\n2.  Your work can have the vital impact on a business\
    \ to help them succeed.\n\n3.  With data development skills, comes the duty to\
    \ have care that what you are developing is quality, accurate, and fit for its\
    \ intended purpose.\n\nWhen I have built data reports for businesses, I have benefited\
    \ from using processes that are typically associated as being developer processes.\
    \ Not because I try to make things more complicated but rather to focus on delivering\
    \ trusted and maintainable data visualizations. The data developer roles are probably\
    \ one of the most impactful roles that exists in a modern business, so it’s up\
    \ to us to do the work to get things right. So congratulations on entering the\
    \ world of being a developer!\n\n# Getting Started: Hello World!\n\nWhenever any\
    \ developer starts a new programming language, they typically start off with writing\
    \ a program that shows the words “Hello World” on the screen. Since you are all\
    \ burgeoning data visualization developers, we are going to kick off our journey\
    \ by using Data Studio to say hello to the world. We’re going to create a simple\
    \ report that pulls data from a CSV file.\n\n**Note**: Google Studio is constantly\
    \ evolving with new releases and features. As such, the screenshots in this book\
    \ may look slightly different from what you see on your screen.\n\n## Step 1:\
    \ Getting Setup with a Google Account\n\nData Studio is a free tool for anyone\
    \ to use. In order to access Data Studio, you need to have a Google-enabled account.\
    \ Good news! If you have a Google, Gmail, or a G Suite business account, you are\
    \ ready to get started and you can skip to the next step.\n\nFor those of you\
    \ who don’t have a Google Account, you can visit this URL: [`https://accounts.google.com/signup/v2/webcreateaccount`](https://accounts.google.com/signup/v2/webcreateaccount).\n\
    \nOn this page you can decide if you want to sign up for a new Gmail.com address\
    \ or to activate an existing email as a Google Account. Either type in the username\
    \ you want to use for your new Gmail address or click “Use my current email address\
    \ instead” as shown in Figure [1-1](#485069_1_En_1_Chapter.xhtml#Fig1).\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig1_HTML.jpg](images/485069_1_En_1_Chapter/485069_1_En_1_Fig1_HTML.jpg)\n\
    \n**Figure 1-1**  \nSetting up your new Google Account using a new Gmail address\
    \ or an existing email address\n\nFill in the sign-up form with your details to\
    \ continue.\n\n## Step 2: Open Up Data Studio\n\nAfter you have a Google Account,\
    \ head on over to [`https://datastudio.google.com`](https://datastudio.google.com)\
    \ to open up the Data Studio home screen.\n\nThe Data Studio home screen (Figure\
    \ [1-2](#485069_1_En_1_Chapter.xhtml#Fig2)) is your launch pad into the world\
    \ of Data Studio. Before we create our first dashboard, let’s get familiar with\
    \ the interface (Figure [1-3](#485069_1_En_1_Chapter.xhtml#Fig3)). It’s made up\
    \ of four key parts:\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig3_HTML.jpg](images/485069_1_En_1_Chapter/485069_1_En_1_Fig3_HTML.jpg)\n\
    \n**Figure 1-3**  \nData Studio interface\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig2_HTML.jpg](images/485069_1_En_1_Chapter/485069_1_En_1_Fig2_HTML.jpg)\n\
    \n**Figure 1-2**  \nData Studio home page\n\n1.  **The Template Gallery** gives\
    \ you a quick way to get started with a new dashboard. You can either use a blank\
    \ report or use a premade template that was created by the Data Studio team. To\
    \ jump in with a premade template, press the “All Templates” button in the top\
    \ right-hand corner.\n\n2.  **The Report Organizer area** is just below the template\
    \ bar, and it is a set of organizational columns or filters that allow you to\
    \ sort your reports based on:\n    * Name\n    * Owner\n    * Last opened\n\n\
    3.  **The left menu** gives you a quick way to:\n    * Create new reports\n  \
    \  * Access reports that were created by others and shared with you\n    * Access\
    \ reports that you created or copied from others\n    * View the trash for any\
    \ reports you have deleted\n\n4.  **The search bar** at the top is a handy tool\
    \ to let you search for reports by name."
