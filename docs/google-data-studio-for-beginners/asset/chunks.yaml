- fmt: "# 1. Starting Your Data Studio Journey\n\nBuilding Your First Data Studio\
    \ Report\n\n> *Questions are good. Questions allow us to see the beauty of life.\
    \ Never stop asking questions.*\n> \n> —Peter Cawdron, *Hello World* (self-published,\
    \ 2019)\n\nMost people who are seen as “data experts” or “data gurus” may seem\
    \ like they are “wizards” now, but they were all beginners once. One day, something\
    \ happened that made them decide that they wanted to start experimenting with\
    \ a data visualization tool. Maybe one weekend or one evening instead of slumping\
    \ in front of the TV, they decided to fire up their laptop and start experimenting\
    \ with a data tool. For them it would have been quite frustrating, as frankly\
    \ the documentation is usually not great, and examples are often harder to understand.\
    \ I found on my personal journey that I could sink hours into understanding various\
    \ concepts and ideas even to do things that I felt were quite basic. I managed\
    \ to find my way through, but not without a lot of stress and painful learning.\n\
    \nThe good news is that we are going to do this journey together. In this chapter,\
    \ I am going to take you through your first steps with Data Studio and work with\
    \ you until you are ready to go out and hold your own.\n\nSo pull up a chair,\
    \ make sure you have a nice drink next to you, and we are going to start experimenting\
    \ with building your very first data report in Data Studio.\n\n## Starting Your\
    \ Data Journey\n\nI always say you don’t find data but rather data finds you.\
    \ I have worked with countless people across a wide variety of industries, each\
    \ of whom was at different stages of data understanding and interest. Through\
    \ my talks at conferences and meetups, I have had the pleasure of encountering\
    \ people who are at the early stages of their interest in data. What I find most\
    \ remarkable is just how many different backgrounds people come from. The one\
    \ common thing they all share is that they found themselves at a challenge or\
    \ a crossroad where they were stuck. They knew that there was a missing piece\
    \ in their understanding and were seeking for data to fly in and be the superhero\
    \ to save them.\n\nI would love for data to be a magic bullet that can simply\
    \ be switched on to solve problems; however, in reality, finding the data is just\
    \ the beginning of the journey. For some people, they will get part way down the\
    \ data road and discover they have enough and veer off to something else they\
    \ find interesting. For others, they will be thrust forward into the multitude\
    \ of wonderful new data job specializations that are sprouting weekly.\n\nData\
    \ scientist, data engineer, artificial intelligence engineer are all new roles\
    \ that were quite rare a few years ago but are becoming increasingly commonplace\
    \ in most organizations. You could argue that to even be a reasonably effective\
    \ digital marketing manager nowadays takes the level of data literacy that previously\
    \ would have been required of a data analyst.\n\nWhatever path you take (or not)\
    \ the one standout fact that I have learned is that everyone can benefit from\
    \ data visualization skills. It helps you to\n\n- Tell stories with your data\n\
    - Take your audience on a journey with you\n- Help your audience to understand\
    \ your data and decide insights from it\n\nOn a personal level, I find that my\
    \ brain just doesn’t process a wall of numbers or text. I use data visualization\
    \ as a method to explore and understand numbers. It’s the difference between looking\
    \ at a picture of a beach and feeling the sand between my fingers and hearing\
    \ the sea wash up on the shore.\n\nData visualization brings the data to life\
    \ and turns it into something real.\n\n## Business Attitudes to Data\n\nOne of\
    \ the watershed discoveries that I have made in my career is that businesses are\
    \ a lot like people when it comes to their use of data. The use of data varies\
    \ drastically based on people’s lives and experiences. Some people live their\
    \ lives highly dependent on data, be it analyzing budgets, planning their future,\
    \ or optimizing things like their bills, their commute, or even where they buy\
    \ their groceries. Other people just go with the flow and rely on their personalities\
    \ and instincts to help them get what they want in life.\n\nWhen you start applying\
    \ data to a business, you first need to understand the business’ attitude to data.\
    \ Within the company’s culture, data is either a core driver of the business or\
    \ an annoyance foisted upon others from those above with the sole mission to prevent\
    \ others from doing what they want.\n\nI think businesses are far too complicated\
    \ and important entities not to rely on data for making decisions. There is only\
    \ so far that a good brand or product will take you, before you need to start\
    \ understanding the market and business goals to succeed. When I encounter people\
    \ who scoff at data, I always put the point that data is never the priority for\
    \ a business until it becomes *the* priority (and this happens incredibly rapidly\
    \ and very suddenly when things stop going well).\n\nWhen I was at university,\
    \ I would sit through endless boring classes on stats and would hate that it was\
    \ never practical, always theoretical. Had I known what applications it would\
    \ have, I probably still wouldn’t have enjoyed it as it wasn’t real for me. I\
    \ thoroughly wish that I would have had real-world examples to teach me the various\
    \ aspects of the craft of data. As someone who learns by doing, this is the most\
    \ effective way for me to understand anything, and that’s what I have tried to\
    \ do with this book.\n\nSo let’s continue our journey into Data Studio together.\
    \ I remember my journey fondly, and I hope I can shortcut some of the pain and\
    \ share some of the positive experiences that I picked up as I took my various\
    \ steps (and missteps) on the path to being comfortable with data."
