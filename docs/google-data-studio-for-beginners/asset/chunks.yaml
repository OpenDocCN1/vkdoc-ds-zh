- fmt: "#### Step 4.3: Edit Connection and Authorize Access to Google Drive\n\nYou\
    \ will see a little pop-up dialog about adding data to this report. For now, just\
    \ go ahead and click “Add to Report.” Google will request the permission to create\
    \ a new Google Data Studio Report in your Google Drive.\n\n**Note**\n\nI personally\
    \ find this step a little confusing, as I don’t normally have to ask for permission\
    \ to add a Google Doc or Google Sheet to my Google Drive. I am not sure why Google\
    \ treats a Data Studio document any differently. I hope Google is able to remove\
    \ it and make things simpler for users in the near future.\n\nAfter the dialog\
    \ box, you will return to the main Google Data Studio report editor screen. You\
    \ can now celebrate as you have successfully created your first Data Studio connection.\
    \ Now we can focus on showing the data on screen for the world to see your greeting.\n\
    \n### Step 5: Display the Data from the CSV in Data Studio\n\nNow we are ready\
    \ to show off your data to the world. In the menu bar, you will see a button that\
    \ says “Add a chart.” When you click it, you can select from a multitude of different\
    \ ways to visualize your data. We will go into these later on in more detail.\
    \ For now, just select the first icon for a simple table. You will see a large\
    \ rectangle appear on the screen with a small table icon in it. Data Studio is\
    \ asking you where you would like to place this table. For now, just place it\
    \ somewhere nice and tidy at the top of the page, where it is showing on the main\
    \ canvas. See Figure [1-5](#485069_1_En_1_Chapter.xhtml#Fig5).\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig5_HTML.jpg](images/485069_1_En_1_Chapter/485069_1_En_1_Fig5_HTML.jpg)\n\
    \n**Figure 1-5** Our first table in Data Studio\n\nAs if by magic, you can stare\
    \ as your first data table fades into existence. I am sure you have seen tables\
    \ show up in many programs before; however, what makes Data Studio a game changer\
    \ for data people is just how powerful and flexible that little table is. I like\
    \ to think of it as being a jetpack, when you are in a road race. If you want\
    \ to get ahead, just whack on those rockets to blast ahead of the rest of the\
    \ pack.\n\n## Recap\n\nIn this chapter, you have started from zero and built up\
    \ a foundation for Data Studio. We have taken some data that was held in a file\
    \ and connected to it in Data Studio. We have used a table control to display\
    \ it on screen so we can say hello to the world.\n\nIn the next chapter, you will\
    \ get your first ever Data Studio assignment and build a basic dashboard for a\
    \ small business.\n\n# 2. Reporting\n\nManual Spreadsheets and Data Studio Reports\n\
    \n> *I never teach my pupils, I only attempt to provide the conditions in which\
    \ they can learn.*\n> \n> —Albert Einstein, theoretical physicist\n\nIt looks\
    \ like your first “Hello World” Data Studio report from Chapter [1](#485069_1_En_1_Chapter.xhtml)\
    \ was just the start! What started as a personal practice session in building\
    \ your first report has snowballed into your first dashboarding opportunity.\n\
    \nI have found that sharing what you are passionate about is always a good thing.\
    \ If it’s something that really excites you, then people with similar interests\
    \ are naturally pulled toward you. You will also see opportunities materialize\
    \ from places you weren’t aware of before.\n\nThere is nothing more useful than\
    \ learning a new technology by building a small project with it. If you can earn\
    \ something for your learning projects, then you are in a very exclusive band\
    \ of people and super lucky. In my case, I spent a lot of my spare time learning\
    \ Data Studio, and I enjoyed it because I like the creative aspect of what Data\
    \ Studio could do with my data. I would park out on my kitchen table after the\
    \ kids went to sleep, and instead of slumping in front of the TV, I would try\
    \ to build something cool in Data Studio.\n\n**Tip**\n\nTake a few minutes to\
    \ think about what kind of projects you would like to build with Data Studio.\
    \ It could be something personal like plotting the distance you exercise in a\
    \ week. It could be work related like automating your own reporting.\n\nSo, let’s\
    \ get started with our first little project and help our friend Hermann by making\
    \ a sales report.\n\n## Helping Hermann’s Cake and Coffee Shop\n\nHermann has\
    \ been running his own coffee shop and bakery for the last two years and has built\
    \ up quite the loyal following. Some of his most loyal customers even call him\
    \ “Uncle H” as he’s always around to share a story.\n\nHe used to be a motorbike\
    \ mechanic in one of the older parts of the city but found that with all the tech\
    \ companies moving in, he could make quite a lucrative business from selling them\
    \ coffee and cakes. It turns out that techies really love having cool and unique\
    \ places to hang out and work. Having spent most of his time hanging out with\
    \ bikers, he has a lot of great stories which he would often entertain his patrons\
    \ with over a nice hot drink and pastry.\n\nNowadays, the fervor which he used\
    \ to devote to his motorcycle business has been transferred into his coffee shop.\
    \ He focuses on having the finest organic and vegan food, and he is obsessed about\
    \ tuning his coffee so that his coffee is ten times better than the shops down\
    \ the road.\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig1_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig1_HTML.jpg)\n\
    \n**Figure 2-1** Hermann’s coffee shop\n\nHow can you help him to understand a\
    \ bit more about his business using your new Data Studio techniques (Figure [2-1](#485069_1_En_2_Chapter.xhtml#Fig1))?\
    \ He will pay you with free coffees and cupcakes for a month if you can help him\
    \ to make more money.\n\n**Note**\n\nIt’s OK to do work for free while you are\
    \ learning. Once you have the skills though, don’t expect to work for free. No\
    \ one should ever be expected to give something for free in return for getting\
    \ some “future” benefit or promotion. It is very rare for those opportunities\
    \ to materialize into something lucrative. If someone wants your skills, they\
    \ should pay you. When it comes to Hermann, we will let him off this time with\
    \ the coffee and cakes offer after all it’s a really good way to see what we can\
    \ do with Data Studio and build that first project for our portfolio."
