  trans: "\n### 获取 Google Analytics 演示数据\n\n可以通过链接访问演示数据。\n\n![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig3_HTML.jpg](img/485069_1_En_5_Fig3_HTML.jpg)\n\
    \n**图 5-3**\nGoogle Analytics 演示账号\n\n1. 请确保您已注册 Google Analytics 账号，方法是访问 [`https://analytics.google.com`](https://analytics.google.com)\
    \ 并登录或创建账号。\n2. 访问演示账号帮助中心文章 ([`https://support.google.com/analytics/answer/6367342`](https://support.google.com/analytics/answer/6367342))。\n\
    3. 点击“访问演示账号”按钮。\n4. 这会将演示账号添加到您的 Google Analytics 账号中。您可以通过点击页面顶部的“账号选择器”，然后选择“演示账号”（如图\
    \ 5-3 所示）来确认此操作。\n\n如果您使用的是真实的 Google Analytics 数据，只需使用真实账号重复上述步骤即可。\n\n### 使用\
    \ Data Studio 模板创建报告\n\n在快速开始构建您自己的 Data Studio 报告时，模板非常有用。您可以利用它向业内高手学习正确的方法。让我们从学习如何从模板库构建您自己的报告开始。\n\
    \n选择屏幕右侧的`模板库`按钮。\n\n当您选择`模板库`按钮后，您将看到由 Google Analytics 团队制作的各种报告的完整列表（图 5-4）。\n\
    \n![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig4_HTML.jpg](img/485069_1_En_5_Fig4_HTML.jpg)\n\
    \n**图 5-4**\n模板库提供了大量可供使用的模板\n\n选择底部行中的 `Google 商品商店` 作为模板。然后点击页面蓝色条中的“使用模板”。\n\
    \n选择相关报告并点击“使用模板”后，您可以选择使用现有数据源或创建自己的数据源。\n\n由于并非所有人都能访问包含实时数据的分析账号，幸运的是，Google\
    \ 设法分享了其 Google 商品商店的数据——这是您在学习过程中尝试的绝佳资源。\n\n接下来，点击“新数据源”下的“选择数据源”。您将看到一个类似于图\
    \ 5-5 的界面。只需从“数据源”下方的下拉菜单中选择 `Google Analytics 演示` 数据。\n\n![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig5_HTML.jpg](img/485069_1_En_5_Fig5_HTML.jpg)\n\
    \n**图 5-5**\n复制报告选项\n\n选择 `复制报告`，然后双击报告名称并将其命名为“GA 学习报告”。\n\n然后您就可以开始探索这份新报告了。我强烈建议大家点击各个报告，并查看它们在“属性面板”中的属性。\n\
    \n现在，您可以使用 Google 提供的任何现有模板来创建自己的报告。\n\n### 使用更多演示数据进行练习\n\n学习新技能的最佳方法是足够多次地模仿专家的做法，直到它成为您的第二天性。这将帮助您开始构建\
    \ Data Studio 技能，使其成为您的本能，从而使您能够更专注于报告的内容，而非报告的创建。\n\n幸运的是，Data Studio 有两个主要场所，您可以在那里学习如何可视化那些经常使用数据的人提供的数据：\n\
    \n* 模板库 ([`https://datastudio.google.com/u/0/navigation/reporting`](https://datastudio.google.com/u/0/navigation/reporting))\n\
    * Data Studio 报告库 ([`https://datastudio.google.com/gallery`](https://datastudio.google.com/gallery))\n\
    \n现在，我们将重点放在模板库上，以便快速上手。对于那些希望为自己的网站构建报告的用户，Google 团队通过其模板库提供了大量预制报告。模板库如图 5-6\
    \ 所示。\n\n![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig6_HTML.jpg](img/485069_1_En_5_Fig6_HTML.jpg)\n\
    \n**图 5-6**\n模板库\n\n当您浏览到 Data Studio 主页时，通常可以在页面顶部找到这些模板。\n\nData Studio 一直在不断发展，并且总有新的改进可以添加到您的报告中。\n\
    \n### 本章小结\n\n在本章中，我们讨论了网站分析的价值，并使用演示账号和模板测试了 Google Analytics 的可视化功能。\n\n## 6.\
    \ 数据混合\n\n组合数据源以获得更深入的洞察\n\n> *重要的是不要停止提问。好奇心有其存在的理由。*\n> \n> ——阿尔伯特·爱因斯坦，理论物理学家\n\
    \n通常，单一数据源能为您提供一些有用的见解。到目前为止，您已经了解到，在报告中包含多个数据源可以让您呈现更全面的图景。但是，当您将多个数据源混合到单个表格、图表或计算中时，这可以带来关于数据关系的更多洞察，并且您可以回答更多的“为什么”问题。\n\
    \n混合数据分析可以回答的一些问题：\n\n- 在炎热晴朗的日子里，我们的商店流量是否在下降？\n- 付费品牌流量是否影响了我们的品牌自然流量？\n- 能否看到一个按页面显示自然展示次数、点击次数和转化次数的表格？\n\
    \n可以混合的数据想法是无限的。对于数字营销人员，尤其是从事 SEO（搜索引擎优化）的人员来说，这通常会引导您从多个来源提取数据，例如爬虫数据、天气数据、产品库存数据等。\n\
    \n在本章中，我们将逐步创建一些简单的混合数据，看看是否能提供更好的洞察，并解决一些实际问题。\n\nGoogle Data Studio 混合使用了所谓的左外连接。这意味着，例如，如果您正在组合关于网页的两组数据，第一组将包含所有行，而第二组仅包含两者匹配的行。\n\
    \n例如，您可以混合两个或三个不同的分析账号，这将使您能够查看数据的累积或比较视图。这在迁移过程中或当您在不同的子域上拥有不同账号时非常有用。不过，值得注意的是，如果用户跨越多个媒体资源，某些网站范围的指标可能无法获取。\n"
- fmt: '# The First Blend: Select Two and Blend Data


    There are two approaches to blending data. The one that is easiest and often a
    way to start is to just blend two charts together. If you have two charts that
    you would like to combine, simply right select both (select the first, hold down
    `shift`, and select the second) and then right-click (or control click a Mac)
    and “Blend data” (Figure 6-1). If Google Data Studio can find a common key such
    as `date`, it will magically just work, amazing – suddenly we have two data sources
    over one chart.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig1_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig1_HTML.jpg)


    **Figure 6-1** – Blending data with two charts selected


    If you find that one source is at a completely different scale to the other, such
    as if we combined traffic to the website and weather, we can assign one of the
    series to the right axis of a time series chart, allowing for both to be displayed
    at a scale more appropriate. You can access these options in the `Chart` ➤ `Table`
    ➤ `Style` pane (Figure 6-2). So simple, so powerful, and works with most time-based
    charts. If you’ve combined two charts to make a third, you can successfully delete
    the first two.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig2_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig2_HTML.jpg)


    **Figure 6-2** – Moving the second metric to the right axis


    ## Adding in More Data or Changing the Blends


    If we combined two data sources using the first method (two charts and hitting
    `blend data` option), we might discover we wanted to add a filter, or another
    metric to the graph which isn’t there, we can edit this blend. The blended data
    source is added to your list of data sources in the same way the first two are
    – it is typically badly named “Blended data (1).” Let us change the name of it
    first. If we click the pencil next to the data source (Figure 6-3), on the right
    side of the screen pane, you can see “data source name” and edit it (Figure 6-4).


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig4_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig4_HTML.jpg)


    **Figure 6-4** – A data blend’s initial name


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig3_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig3_HTML.jpg)


    **Figure 6-3** – Edit the data source name


    We can add in more metrics and dimensions providing the matchup will allow it;
    if the data doesn’t have the right key or if the data can’t be matched, this of
    course won’t work or will give you incorrect results.


    An example would be metrics that match with a landing page including conversion
    rate and bounce rate – but if we were using page view metrics, these wouldn’t
    be correct.


    We can edit the name of the new connection, add in dimensions and add in metrics,
    and we can also add in calculated metrics that use both of the original connections
    – for instance, we could find the ratio of clicks to sessions from Google Search
    Console to Google Analytics, how closely organic traffic matches up (Figure 6-5).


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig5_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig5_HTML.jpg)


    **Figure 6-5** – A calculated metric in a blend


    ## The Key to Blending


    Remember that the blend needs something to key into – this can be as simple as
    `date` which will usually match if the two data sources overlap and are both similarly
    granular. For anything more complicated, we might need to modify the data slightly
    to make sure both sides match.


    An example would be taking the page level data from Google Search Console (GSC)
    and the data from Google Analytics. We can use the Google Demo account for this
    example (Figure 6-6). Two things we can see quite quickly are that in Search Console
    it is the full URL but in Google Analytics it is just the page path that is tracked.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig6_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig6_HTML.jpg)


    **Figure 6-6** – Tables comparing the dimensions that will be blended


    We can also see that capitalization in GSC is different to that in Google Analytics,
    as someone has filtered it; these discrepancies make blending a little more challenging,
    but both are easy to overcome. Figure 6-7 shows how you would edit a field.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig7_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig7_HTML.jpg)


    **Figure 6-7** – Editing a field


    We can also use string functions to lowercase everything and remove the domain
    so both “landing pages” are the same.


    ## Manually Creating Blends


    We might want to combine a page’s metrics from both Google Search Console and
    Google Analytics, but if we do this, we run into a couple of initial issues –
    first add your first data source – Google Search Console to the page – we are
    using the Google demo account for this.


    We want to see the impressions, clicks from Google Search Console, bounce rate
    and conversion rate from Google Analytics in a single table.


    Let’s take this page:


    `shop.googlemerchandisestore.com/Google+Redesign/Shop+by+Brand/YouTube`


    In Google Search Console, this is the landing page URL, but in Google Analytics,
    the landing page looks like this:


    ```

    /google+redesign/shop+by+brand/youtube

    ```


    All lowercase and without the domain (and subdomain), so we edit the data source
    (though we can’t do this with the demo account, so just follow along). First click
    the pencil from the data source already added to your report; second, we need
    to add a new field (as we can’t modify the source) by clicking the `Add a field`
    button.


    We can convert this to lowercase using the `lower` function, save this, and give
    it a new name; however, we are going to do two steps in one, so as the output
    matches the preceding example, the other operation is removing the domain part
    of the URL; for that, I am using the `replace` command before finally naming it
    something and clicking save. I am going to name it `Landing Path` as this is a
    good reflection of what it is.


    So now when we add it back to the report, it matches the data in Google Analytics
    (GA), which means it is ready to blend!


    With the first data source selected (from Google Search Console), click `blend
    data` and then “add another data source”; now we get to have a table with metrics
    from both Google Analytics and Google Search Console – a single table with all
    the metrics for all the pages.


    We can take this a step further and group pages, and this is where it gets really
    exciting on an ecommerce website – how much traffic is coming to a product page,
    a category page, and the blog site – suddenly we have insight into how the website
    is working; to do this, we can group pages using the `case` statement, but you
    need to do this to the data in advance, blends on both sides that match. See Figures
    6-8 through 6-12.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig9_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig9_HTML.jpg)


    **Figure 6-9** – Using the `case` statement to classify pages


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig8_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig8_HTML.jpg)


    **Figure 6-8** – Formula to lowercase and strip out text from the landing page


    This is the sort of comprehensive reporting that marketing managers love, granular
    enough that you can get insights but top level enough that you can see trends
    and movements.


    The `case` statement is an incredible way of retrospectively grouping content
    to analyze and see trends, as it can use a regular expression as it is a more
    powerful way than other simpler matches.'
  raw: '## The First Blend: Select Two and Blend Data


    There are two approaches to blending data. The one that is easiest and often a
    way to start is to just blend two charts together. If you have two charts that
    you would like to combine, simply right select both (select the first, hold down
    shift, and select the second) and then right-click (or control click a Mac) and
    “Blend data” (Figure [6-1](#485069_1_En_6_Chapter.xhtml#Fig1)). If Google Data
    Studio can find a common key such as date, it will magically just work, amazing –
    suddenly we have two data sources over one chart.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig1_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Blending data with two charts selected


    If you find that one source is at a completely different scale to the other, such
    as if we combined traffic to the website and weather, we can assign one of the
    series to the right axis of a time series chart, allowing for both to be displayed
    at a scale more appropriate. You can access these options in the Chart ➤Table
    ➤ Style pane (Figure [6-2](#485069_1_En_6_Chapter.xhtml#Fig2)). So simple, so
    powerful, and works with most time-based charts. If you’ve combined two charts
    to make a third, you can successfully delete the first two.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig2_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Moving the second metric to the right axis


    ## Adding in More Data or Changing the Blends


    If we combined two data sources using the first method (two charts and hitting
    blend data option), we might discover we wanted to add a filter, or another metric
    to the graph which isn’t there, we can edit this blend. The blended data source
    is added to your list of data sources in the same way the first two are – it is
    typically badly named “Blended data (1).” Let us change the name of it first.
    If we click the pencil next to the data source (Figure [6-3](#485069_1_En_6_Chapter.xhtml#Fig3)),
    on the right side of the screen pane, you can see “data source name” and edit
    it (Figure [6-4](#485069_1_En_6_Chapter.xhtml#Fig4)).


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig4_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    A data blend’s initial name


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig3_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Edit the data source name


    We can add in more metrics and dimensions providing the matchup will allow it;
    if the data doesn’t have the right key or if the data can’t be matched, this of
    course won’t work or will give you incorrect results.


    An example would be metrics that match with a landing page including conversion
    rate and bounce rate – but if we were using page view metrics, these wouldn’t
    be correct.


    We can edit the name of the new connection, add in dimensions and add in metrics,
    and we can also add in calculated metrics that use both of the original connections –
    for instance, we could find the ratio of clicks to sessions from Google Search
    Console to Google Analytics, how closely organic traffic matches up (Figure [6-5](#485069_1_En_6_Chapter.xhtml#Fig5)).


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig5_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    A calculated metric in a blend


    ## The Key to Blending


    Remember that the blend needs something to key into – this can be as simple as
    date which will usually match if the two data sources overlap and are both similarly
    granular. For anything more complicated, we might need to modify the data slightly
    to make sure both sides match.


    An example would be taking the page level data from Google Search Console (GSC)
    and the data from Google Analytics. We can use the Google Demo account for this
    example (Figure [6-6](#485069_1_En_6_Chapter.xhtml#Fig6)). Two things we can see
    quite quickly are that in Search Console it is the full URL but in Google Analytics
    it is just the page path that is tracked.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig6_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Tables comparing the dimensions that will be blended


    We can also see that capitalization in GSC is different to that in Google Analytics,
    as someone has filtered it; these discrepancies make blending a little more challenging,
    but both are easy to overcome. Figure [6-7](#485069_1_En_6_Chapter.xhtml#Fig7)
    shows how you would edit a field.


    ![../images/485069_1_En_6_Chapter/485069_1_En_6_Fig7_HTML.jpg](images/485069_1_En_6_Chapter/485069_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Editing a field


    We can also use string functions to lowercase everything and remove the domain
    so both “landing pages” are the same.


    ## Manually Creating Blends


    We might want to combine a page’s metrics from both Google Search Console and
    Google Analytics, but if we do this, we run into a couple of initial issues –
    first add your first data source – Google Search Console to the page – we are
    using the Google demo account for this.


    We want to see the impressions, clicks from Google Search Console, bounce rate
    and conversion rate from Google Analytics in a single table.


    Let’s take this page:


    `shop.googlemerchandisestore.com/Google+Redesign/Shop+by+Brand/YouTube`


    In Google Search Console, this is the landing page URL, but in Google Analytics,
    the landing page looks like this:


    ```

