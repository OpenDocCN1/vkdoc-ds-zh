- fmt: '# Yikes, Spiders!


    The radar chart or “spider chart” is a very useful data visual when it comes to
    general business consulting and strategy. There is an elegant simplicity in the
    way that it can answer the question: “Where should we focus?”


    The spider chart is made up of several equiangular lines which represent different
    metrics. In the spider chart in Figure [7-9](#485069_1_En_7_Chapter.xhtml#Fig9),
    we have plotted the scores of three pupils on the chart.


    ![../images/485069_1_En_7_Chapter/485069_1_En_7_Fig9_HTML.jpg](images/485069_1_En_7_Chapter/485069_1_En_7_Fig9_HTML.jpg)


    Figure 7-9


    The “spider chart”


    In the spider diagram, we can read it as follows. Person 1 is really doing well
    at subjects like English, Maths, and French but is doing the poorest in the class
    for physical activities such as dancing and sport. The teacher could thus help
    them by encouraging more physical sports with the student or trying to find something
    that they would enjoy and get exercise.


    Of all the teachers, it looks like the Maths teacher is consistently getting the
    better grades for all the students so should be commended on their work.


    Simple and powerful.


    > **Tip**: Filters work the same way with community visualizations. Thus, if you
    want to break out a set of students into their own charts, then you would just
    need to duplicate the chart and add a filter.


    The spider chart community visualization was created using a free and open charting
    library called “Chart.js” which is really vibrant and well made. Additionally,
    it has the value of being open for anyone to use or share.


    ## Recap


    In this chapter, we have deep dived into how to make your Data Studio reports
    look more customized and how you integrate other data sources. We finished off
    by reviewing a few of the popular Data Studio Community Visualizations.


    # 8. Why Stop There?


    Data Studio Is Limited Only by Your Imagination


    > *Roads? Where we’re going, we don’t need roads.*

    >

    > —Dr. Emmett Brown in *Back to the Future* (1985)


    I (Gerry) am almost guilty of overusing Data Studio. When I want to visualize
    or analyze something, it is surprising how often I turn to Google Data Studio
    while auditing a client’s analytics. I will create the longest possible page and
    use table after table to demonstrate issues with a little text around it. Using
    custom formatting I can highlight key issues, and from there we can monitor them
    to see if they have been fixed up. I will create visualizations of every campaign
    and will use it to present tables of data that I want clients to see, interact
    with, but not to edit.


    Data is often interesting, often beautiful, and sometimes hypnotic. Critically
    it is all about interpretation. If you haven’t had the opportunity to read *Freakonomics*
    by Stephen J. Dubner and Steven Levitt (2005), it explains why correlation isn’t
    the same as causation, and it is definitely a recommended read on how to interpret
    data.


    Think about the incredible story of how mathematician Abraham Wald factored survivorship
    bias into his calculations when considering how to minimize bomber losses to enemy
    fire. Rather than putting more armor where there were more bullet holes, he said
    they should put more armor where there were fewer bullet holes. The reasoning
    was that the planes that were hit in these areas probably didn’t make it back
    and therefore couldn’t be counted. This is an oversimplification of the story
    and the mathematics for the sake of this book, but you get the idea. The point
    is that without the full picture, data is often meaningless. Correlation doesn’t
    always equal causation. Sometimes it is simply random and sometimes there are
    other reasons.


    It is amazing how many digital marketers are “channel centric.” They focus only
    on how their own channel is performing, and when looking at drops or rises in
    performance, they don’t look at cannibalization from other channels. Google Data
    Studio (GDS) gives us the ability to share subsets of data from across the business,
    which allows us to have a broader view. We can effectively start to see the missing
    pieces, and we can then really know where to armor the plane or improve the business.


    When used effectively, Google Data Studio helps give us that access to the more
    complete picture. It is a tool that gives us far more data sources in a single
    place, data that normally is challenging to combine, and it gives us an accurate
    picture if configured correctly.


    By now, we hope that you have seen how GDS allows you to retrospectively clean
    up data, it allows you to segment and share it, it gives more people a more complete
    picture, and it makes an awesome presentation layer.


    In this chapter, we’ll go over some interesting ways you can use Google Data Studio.


    ## Blog Performance


    The agency that I (Gerry) worked had incentivized the employees to write more
    blog posts by gamifying it: whoever’s blog post has driven the most views by the
    end of the year wins. It didn’t take me long to create a visualization for this
    incentive using Data Studio.


    Considering the needs and habits of my target audience (my teammates), I chose
    to embed the report by clicking the **Share** drop-down button and selecting **Embed
    report** (Figure [8-1](#485069_1_En_8_Chapter.xhtml#Fig1)). I then made the dimensions
    of the report mobile phone size, enabled embedding, and shared the “embed” URL
    (Figure [8-2](#485069_1_En_8_Chapter.xhtml#Fig2)). This means the team can check
    it on their phone and see it without being on their work computer.


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig2_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Embed options for a report with recommended sizes to see on a mobile


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig1_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Embed report option


    In one of the charts on my report, shown in Figure [8-3](#485069_1_En_8_Chapter.xhtml#Fig3),
    we can clearly see that the winner at the moment is the one with the steadiest
    growth written on Python scripts. Sharing data on content with writers pushes
    them to create more and better quality. A content dashboard can show the keywords
    that are ranking for a selected post or the engagement with that page. I created
    additional tabs to track additional views of the data, partly to make sure that
    all the engagement metrics were set up right and we also track the author as a
    custom dimension into our analytics.


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig3_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Cumulative page views for blog posts on an agency website


    Creation of this widget in Data Studio has led to more colleagues producing reports
    and caring about the quality of the delivery. Remember, if you try this out, you
    can style the report however you like and embed it into web pages that change
    in time.


    ## Campaign Performance Mini Reports


    For every agency campaign that we do, we quickly create a campaign performance
    report, typically based on Google Analytics data but often shaped to pull out
    interactions such as video shares (including YouTube data). When the Public Relations
    team records coverage, it goes into a `BigQuery` table (it even stores screenshots)
    that can then be pulled through, and suddenly it becomes a report that can be
    easily shared with a client as well as providing internal progress reporting.


    Combining, blending data from multiple sources within reports that are easily
    and quickly shared with clients was something we could only dream about a few
    years ago.'
