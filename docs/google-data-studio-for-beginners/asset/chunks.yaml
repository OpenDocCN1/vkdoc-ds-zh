    \ and instead of leaving it as a static data set, we used Data Studio to bring\
    \ the data alive. We could identify\n\n*   What products were selling the most\
    \ for the client\n\n*   What product types were most popular\n\n*   How much sales\
    \ had changed over time\n\nWe tried out some simple controls such as tables, scorecards,\
    \ and pie charts and even started doing some basic comparisons of this year vs.\
    \ last year.\n\nIn the next chapters, we will expand on this, but hopefully you\
    \ now have a good feel for using the Data Studio interface to explore your data.\n\
    \n# 3. Metrics and Dimensions\n\nHelpful Data Visualizations\n\n> *You know you\
    \ live in the world of Web Insights when you realize that every piece of data\
    \ you look at drives action….*\n> \n> —Avinash Kaushik, Digital Marketing Evangelist,\
    \ Google^([¹](#fn1))\n\nIn the previous chapter, we needed to use dimensions and\
    \ metrics to make our reports. Let’s continue trying to understand what these\
    \ are.\n\nJust about anything to do with data can be boiled down to the metrics\
    \ and dimensions."
  trans: "\n## 步骤 7：使用评分卡控件展示销量\n\n所有报告都需要认识到信息存在重要性层级。回想一下学生时代从老师那里收到的成绩单。你最想了解的关键信息是各科目的分数。如果分数被埋没在几段关于学习努力程度的评语底部，你会作何感想？想必会感到非常沮丧和困惑，不明白他们为何要隐藏如此重要的信息。同理，我们需要使用评分卡来向报告读者突出显示最重要的信息。\n\
    \n通常使用评分卡来展示我们常说的“KPI”，即关键绩效指标。\n\n我见过关于 KPI 最精炼的定义来自英国《公司法》，其中将 KPI 定义为“可据此有效衡量公司业务发展、绩效或状况的参考因素”。\n\
    \n要在报告中添加显示已售数量的评分卡：\n\n1.  点击主工具栏中的“添加图表”按钮。\n2.  选择“评分卡”字样下方的第一个图标。\n3.  点击并拖拽出一个框，指定评分卡的放置位置（理想位置是报告左上角）。\n\
    4.  默认情况下，它会显示产品名称的记录计数，因此你需要将维度更改为已售数量。\n\n现在你会看到带有“已售数量”标签的评分卡（图 2-6）。\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig6_HTML.jpg](img/485069_1_En_2_Fig6_HTML.jpg)\n\
    \n图 2-6\n\n已售数量评分卡\n\n对于赫尔曼来说，他的 KPI 将是产品销售数量，因此这需要在报告中立即展示。我们使用评分卡控件在报告顶部显示已售产品数量。\n\
    \n提示\n\n在报告中使用评分卡时，请尽量控制数量。过多的评分卡会使用户感到困惑。如果你发现一张报告上要放置超过五个评分卡，就该考虑是否应该使用表格或条形图等替代展示方式了。\n\
    \n## 步骤 8：为评分卡添加日期对比\n\n我们已经使用饼图展示了每种产品的销售额规模，现在可以进入分析的下一个阶段。数据总是在变化。今天成立的情况，明天不一定依然成立。\n\
    \n> *我不创造趋势。我只是发现趋势并加以利用。*\n> \n> ——迪克·克拉克，美国电台主持人\n\n人们的时尚、品味和趋势会定期变化，企业需要利用数据来应对这些变化。如果你能够跟踪客户品味的变化，甚至发掘新客户的品味并加以利用，那么你就赢了。\n\
    \n我们将帮助赫尔曼开启了解影响其业务的趋势的旅程，并让他了解销售额随时间的变化情况。希望通过这样做，我们能够识别出他尚未想到的一些机会。\n\n通过检查我们的\
    \ Google Sheets 数据，我们知道有一个“日期”字段。使用“日期/时间”数据非常强大，因为我们可以探索去年和今年之间发生了哪些变化。我们将首先向他展示销售额随时间的变化情况。现在我们选择要比较的日期区间。点击“对比数据范围”按钮。我们可以选择与以下项对比：\n\
    \n- 无\n- 上一周期\n- 去年\n- 固定/高级\n\n“上一周期”选项可能是 Data Studio 中最强大的功能之一。它会将你当前查看的时间段与上一个相等时间段进行比较。因此，你可以使用此控件进行周环比、月环比，甚至年同比对比，以查看销售额的变化。\n\
    \n现在我们想保持简单，所以选择“去年”，然后点击“应用”完成我们的“同比评分卡”。\n\n一两秒后，你将看到评分卡下方“47%”旁边出现一个绿色箭头（图\
    \ 2-7）。这表明自去年以来，产品销量增长了 47%，对赫尔曼来说是一个惊人的成果。\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig7_HTML.jpg](img/485069_1_En_2_Fig7_HTML.jpg)\n\
    \n图 2-7\n\n显示对比结果的评分卡\n\n既然你已经学会了如何在评分卡上进行基本的日期范围对比，好消息是，你同样可以对表格进行相同的操作。何不尝试对你已有的数据表格进行年同比对比，看看赫尔曼的哪些产品推动了他自去年以来的销售增长？\n\
    \n## 回归根本\n\n正如本章我们尝试用数据解决“现实”问题一样，这项尝试最有价值的一点是，你会开始意识到知识中存在空白，并且有新的东西需要学习。\n\n\
    从你初次使用 Data Studio 工具的经历来看，你可能已经注意到到处都在使用许多新的概念和术语。别担心，随着我们阅读本书的深入，你会逐渐掌握它们的。\n\
    \n提示\n\nData Studio 文档团队还维护了一个方便的术语表（[`https://support.google.com/datastudio/topic/6302375`](https://support.google.com/datastudio/topic/6302375)）。\n\
    \n## 小结\n\n做一些简单的事情，比如更深入地了解你的数据，对每个企业都至关重要。在本章中，我们拿了一个简单的 Google Sheets 数据表，没有将其作为静态数据集搁置，而是使用\
    \ Data Studio 让数据生动起来。我们能够识别出：\n\n- 客户哪些产品销量最高\n- 哪些产品类型最受欢迎\n- 销售额随时间的变化情况\n\n\
    我们尝试了一些简单的控件，如表格、评分卡和饼图，甚至还开始进行了一些今年与去年的基本比较。\n\n在接下来的章节中，我们将进一步拓展这些内容。但希望你现在已经对使用\
    \ Data Studio 界面探索数据有了良好的感觉。\n\n# 3. 指标和维度\n\n有用的数据可视化\n\n> *当你意识到所查看的每条数据都在驱动行动时，你便明白自己身处网络洞察的世界……*\n\
    > \n> ——阿维纳什·考希克，谷歌数字营销布道师^(¹)\n\n在上一章中，我们需要使用维度和指标来制作报告。让我们继续努力理解这些是什么。\n\n几乎所有与数据相关的事情都可以归结为指标和维度。\n"
- fmt: '# Metrics


    Data Studio’s Help center glossary defines metrics in a really overly complicated
    way:


    > *A specific aggregation applied to a set of values.Metrics are aggregations
    that come from the underlying data set, or are the result of implicitly or explicitly
    applying an aggregation function, such as `COUNT()`, `SUM()`, or `AVG()`. The
    metric itself has no defined set of values, so you can’t group by it, as you can
    with a* [dimension](https://support.google.com/datastudio/answer/6303401)*.*^([²](#fn2))


    Let’s try to simplify this definition. Metrics are a way of apportioning a value
    to the size of an item. A metric can be succinctly boiled down to


    > *How many of a certain thing you have.*


    Consider Hermann from Chapter [1](#485069_1_En_1_Chapter.xhtml). As the owner
    of a modern cake shop, he is interested in counting how many cakes are sold in
    a particular day or how many ingredients they have used up.


    Other examples of metrics include


    * The temperature on a thermometer

    * The number of points awarded in a game show

    * Number of people in a medical study

    * Website users, that is, how many people arrived on your website in a given data
    period

    * Sales revenue from selling your products online

    * Number of errors shown to users in a day

    * The average amount of rain in a region


    ## Aggregating Metrics


    Metrics can also be much more sophisticated. We could be interested in understanding
    how the numbers change over time or how they compare between time periods.


    The owner of the cake shop could simply measure the number of cakes sold, but
    he could also be interested in finding out how many of the cakes were sold in
    a given day.


    1. Whether sales were increased or decreased compared to a certain period of time,
    and are they growing slowly or are they declining rapidly

    2. How the number of sales compared to last week, last month


    When you analyze a “collection” of metrics, this is known as aggregating them
    or bringing them together. Aggregations become themselves new metrics. Aggregating
    allows us to compare, analyze, and trend data to find insight.


    Note that it is possible for a metric to be one raw number or it can be an aggregation.
    An aggregation can become a new metric, and even while using other metrics within
    its formula, it becomes itself a metric.


    We will come back to aggregations in more detail later on, but the Data Studio
    glossary definition of metric mentions three:


    * **`Count()` or Counting metrics** – An example of this would be how many cakes
    were sold in a given day.

    * **`Sum()` or Sum of metrics** – This could be the sum of all the revenue earned
    from selling cakes in the cake shop through cash and credit card sales.

    * **`Avg()` or Average of metrics** – This could be the average number of bakery
    staff (bakers, cashiers, etc.) working in a week.


    # Dimensions


    Unfortunately, a metric or aggregation doesn’t give you the full picture when
    it comes to understanding your data. You need to have more information in order
    to work out whether the data you have is useful.


    With metrics we are able to really understand the quantity side, but how do we
    understand how to put a value on quality? This is where dimensions come to our
    rescue.


    The Data Studio glossary defines dimensions as being:


    > *A set of values by which you can group your data. Dimensions are categories
    of information. The values contained in those categories are typically names,
    descriptions or other characteristics of that data.*^([³](#fn3))


    This is a pretty simple explanation, but I think we can do a little better at
    making it easy to understand:


    > *Dimensions are the names, descriptions or other characteristics of the things
    you are counting.*


    Consider cavemen foragers. Just knowing that they have collected 100 berries in
    a day isn’t the difference between life and death. Knowing that they have collected
    50 delicious berries and 50 poisonous berries is the difference between life and
    death. This crucial extra “dimension” to the data immediately makes the information
    far more valuable and useful. It will help them in the future alter the bushes
    they chose to collect berries from and give them a “healthier” outlook for the
    future.


    Unlike cavemen, for most modern people, their data won’t be the difference between
    literal life and death but rather will be whether their business succeeds or fails
    in its endeavors. We all want to win in our work life, so making sure that we
    have the right dimensions to understand good from bad will be a crucial part of
    our job.


    Recall the examples of metrics we covered in the previous section, and let’s add
    dimensions to some of them. Knowing the dimensions changes the information that
    you are receiving from a metric. The dimensions are bolded in the following list:


    * The number of goals or points scored at a sports match **by each team**

    * Number of people in a medical study as well as understanding their **age, height,
    or fitness level**

    * Website users separated **by country of origin, type of device they use, or
    whether they buy or not**

    * Sales revenue from selling your products online, broken down into **sales per
    country or sales per category**

    * Number of errors shown to users in a day broken out **by error type and how
    severe the errors are at impacting customers**


    If you are ever struggling to find the dimensions of your data, just describe
    it to yourself. If you hear magic phrases like “broken out by” or “per,” you will
    know that these elements are dividing up the data and can, in most cases, give
    you better idea about how dimensions are influencing the metrics you are counting.


    Let’s think about Hermann’s cake shop. What information can we think about when
    it comes to our cakes that can help understand a bit more about what is selling
    well?


    We know that we are selling cakes, but there are other dimensions that we can
    break out from the data to give us a little more context. Just knowing that we
    are selling 100 cakes doesn’t really help our team to know what types of cakes
    that they should produce in the future.


    You can usually find out what are the most important characteristics of the cakes
    you sell by looking at the product you are selling or asking the business or its
    customers to give you some information about what they think is the “deciding
    factor” that influences the sales of the product. Just asking the baker what the
    differences are between the products is a great start.


    * What size are the cakes? Are they teacakes, cupcakes, or multitiered wedding
    cakes?

    * What flavors are the cakes? Chocolate, Vanilla, Carrot, or Banana flavor?

    * What theme is the decoration for the cake? Is it a plain cake with just frosting
    on top, or is exquisitely decorated for a couple’s forthcoming wedding?'
