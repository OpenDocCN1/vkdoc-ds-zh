- fmt: "## Step 7: Use Scorecard Control to Show Sales\n\nWith all reports, it’s important\
    \ to recognize that there is a hierarchy of importance. Think back to your report\
    \ cards that you received from your teacher at school. The most important information\
    \ that you wanted to know was what your grade was for each subject. How would\
    \ you have felt if the grade was hidden away at the bottom of several paragraphs\
    \ of comments about how hard you worked? You would have been very frustrated and\
    \ confused about why they had hidden away such important information. Much in\
    \ the same way, we need to use scorecards to highlight the most important information\
    \ to readers of our report.\n\nTypically use scorecards to show off what we typically\
    \ call “KPIs,” or key performance indicators.\n\nThe best and most concise definition\
    \ of KPI I have seen comes from the UK’s Company Act where they define KPIs as\
    \ “factors by reference to which the development, performance or position of the\
    \ business of the company can be measured effectively.”\n\nTo add a scorecard\
    \ that shows the number sold to your report:\n\n1. Click the “Add a chart” button\
    \ in the main toolbar.\n2. Select the first icon below the word “Scorecard.”\n\
    3. Click and drag a box to indicate where you want the scorecard placed (ideally\
    \ in the top left of the report).\n4. By default, it’ll show the record count\
    \ for the product names, so you’ll need to change the dimension to number sold.\n\
    \nYou will now see the scorecard with the “Number Sold” label (Figure [2-6](#485069_1_En_2_Chapter.xhtml#Fig6)).\n\
    \n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig6_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig6_HTML.jpg)\n\
    \nFigure 2-6\n\nScorecard for number sold\n\nFor Hermann, his KPI is going to\
    \ be how much product he sells so this is something to show immediately in the\
    \ report. We use the scorecard control to show the number of products sold at\
    \ the top of the report.\n\nTip\n\nWhen it comes to putting scorecards onto your\
    \ reports, try to use as few as possible. Too many scorecards can confuse the\
    \ user. If you find you are putting more than five scorecards on a report, it’s\
    \ time to think whether you should use an alternative presentation like a table\
    \ or bar chart.\n\n## Step 8: Add a Date Comparison to the Scorecard\n\nNow that\
    \ we have used pie charts to show how big the sales of each product are, we can\
    \ move on to the next stage of our analysis. Data is always changing. What is\
    \ true for today is not always guaranteed to be true tomorrow.\n\n> *I don’t set\
    \ trends. I just find out what they are and exploit them.*\n> \n> —Dick Clark,\
    \ American radio personality\n\nPeople’s fashion, tastes, and trends change regularly,\
    \ and it’s up to businesses to use data to respond to these changes. If you are\
    \ able to follow the changes in your customers’ tastes or even seek out new customers’\
    \ tastes to exploit, then you are winning.\n\nWe are going to help Hermann start\
    \ on his journey of understanding what trends are affecting his business and give\
    \ him an idea of what has changed over time with his sales. We hope that by doing\
    \ this we might be able to identify some opportunities that he hasn’t thought\
    \ of yet.\n\nWe know from inspecting our Google Sheets data that we have a field\
    \ for “date.” Using “date/time” data is really powerful as we can explore what\
    \ changes have happened between last year and this year. We are going to start\
    \ by showing him how much sales have changed over time. We are now going to choose\
    \ the date period that we are going to compare against. Select the “comparison\
    \ data range” button. We can choose to compare against\n\n- None\n- Previous period\n\
    - Previous year\n- Fixed/advanced\n\nThe “previous period” option is perhaps one\
    \ of the most powerful features in Data Studio. It will take the current time\
    \ period that you are looking at and compare it against the previous equivalent\
    \ time period. You can thus use this control to compare week on week, month on\
    \ month, or even year on year to see how your sales are changing.\n\nWe want to\
    \ keep things simple for now so we are going to select “Last Year” and press “Apply”\
    \ to complete our “Year on Year Scorecard.”\n\nAfter a second or two, you will\
    \ see below your scorecard a green arrow appear next to “47%” (Figure [2-7](#485069_1_En_2_Chapter.xhtml#Fig7)).\
    \ This shows that the number of products sold has gone up 47% since last year\
    \ which is an amazing result for Hermann.\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig7_HTML.jpg](images/485069_1_En_2_Chapter/485069_1_En_2_Fig7_HTML.jpg)\n\
    \nFigure 2-7\n\nScorecard showing comparison\n\nNow that you know how to do basic\
    \ comparisons with date ranges on scorecards, the good news is that you can do\
    \ the same thing for tables too. Why don’t you try do the comparison year on year\
    \ for the table of data you have and see which of Hermann’s products are responsible\
    \ for driving his improvement in sales since last year.\n\n## Back to the Books\n\
    \nOne of the most valuable things about trying to use data to solve a “real” world\
    \ problem as we did in this chapter is that you begin to realize that there are\
    \ gaps in your knowledge and there are new things that you need to learn.\n\n\
    From your first experiences using the Data Studio tool, you probably noticed there\
    \ are so many new concepts and terms being used all over the place. Don’t worry,\
    \ you’ll get the hang of them as we go through the book.\n\nTip\n\nData Studio’s\
    \ documentation team also maintains a handy glossary of terms ([`https://support.google.com/datastudio/topic/6302375`](https://support.google.com/datastudio/topic/6302375)).\n\
    \n## Recap\n\nDoing something simple like understanding more about your data is\
    \ vital to every business. In this chapter, we took a simple Google Sheet of data,\
    \ and instead of leaving it as a static data set, we used Data Studio to bring\
    \ the data alive. We could identify\n\n- What products were selling the most for\
    \ the client\n- What product types were most popular\n- How much sales had changed\
    \ over time\n\nWe tried out some simple controls such as tables, scorecards, and\
    \ pie charts and even started doing some basic comparisons of this year vs. last\
    \ year.\n\nIn the next chapters, we will expand on this, but hopefully you now\
    \ have a good feel for using the Data Studio interface to explore your data.\n\
    \n# 3. Metrics and Dimensions\n\nHelpful Data Visualizations\n\n> *You know you\
    \ live in the world of Web Insights when you realize that every piece of data\
    \ you look at drives action….*\n> \n> —Avinash Kaushik, Digital Marketing Evangelist,\
    \ Google^([¹](#fn1))\n\nIn the previous chapter, we needed to use dimensions and\
    \ metrics to make our reports. Let’s continue trying to understand what these\
    \ are.\n\nJust about anything to do with data can be boiled down to the metrics\
    \ and dimensions."
