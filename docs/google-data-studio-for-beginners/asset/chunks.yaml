    \ who say that it’s fine to do the cleaning of the data in the reporting tool\
    \ and not in the source. I generally consider this a massive anti-pattern (a bad\
    \ practice that you end up regretting).\n\nThe rule of thumb is to fix the data\
    \ in source but tweak the data in Data Studio.\n\nData Studio has a lot of powerful\
    \ features that can do some of the cleaning for you, but I tend to use these for\
    \ more minor fixes or to make the data easier to consume. I recommend that people\
    \ do as much of the cleaning as they can in the original source of the data as:\n\
    \n- It keeps things simple as you only have to look in one place for any fixes\
    \ to your data.\n- It’s less work to have to replicate your cleaning over multiple\
    \ reports.\n\nSome of the tweaks that we do in Data Studio over time, if they\
    \ are clear that they are going to be there to stay, I might roll that change\
