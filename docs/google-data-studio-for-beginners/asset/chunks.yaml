- fmt: '# Front End for Back Office Data


    Another thing about Data Studio is that it can be an awesome front end for back
    office data if we can pull it into Google Sheets or a database. For example, I
    once had to create a visualization of how many vacation days our team had already
    booked, had planned for the future, and had already taken. The data was already
    in a spreadsheet format, so it was an easy thing to pull into Data Studio. One
    thing I had to do was create a new sheet to clean the data. I ensured columns
    were correctly lined up so we could quickly see by team and then by person how
    much was left, taken, booked. Once I fed it into Data Studio, we magically had
    a report that would automatically update.


    Data Studio is a versatile data visualization tool. It is not just for marketing
    data. I often find that friends who work in other roles or industries are pleasantly
    surprised when you can take their data and visualize it in Data Studio.


    ## Embedded Forms


    You could also embed a form on your Data Studio Report. For example, I wanted
    to embed a form on a report that asks people to recommend who I should follow
    on Twitter (Figure [8-4](#485069_1_En_8_Chapter.xhtml#Fig4)). This is a quick
    report that you could make in a few minutes. I created a Google Form that asks
    for a Twitter handle, the person’s name, and why I should them. I took the URL
    for the Google Form, went into my Google Studio report, clicked the Embed URL
    button on the toolbar, placed the form on the page, and put the URL in the “External
    Content URL” field (Figure [8-5](#485069_1_En_8_Chapter.xhtml#Fig5)).


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig5_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig5_HTML.jpg)


    Figure 8-5: URL for an embedded form


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig4_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig4_HTML.jpg)


    Figure 8-4: Embedding a form into a Google Data Studio report allowing you to
    add in more data


    This took minutes to build, but if I had developed it as without Data Studio,
    it would probably have taken a day or two to create. It is sharable and other
    people can embed this into their own website.


    Although in this example I have shown how a form can be used to display data on
    a report, you can also use a form to get feedback on a report. As we mentioned
    earlier in this book, it’s a good idea to put a footer bar with your contact details
    in case someone has a question or correction. You can do this by embedding a form
    on the last page of the report for feedback or for change requests for the report.
    It is a smart way of letting users submit changes and tracking them, which is
    a quick win.


    ## Tips and Tricks


    Data Studio has so many hacks and hidden methods that allow you to speed up things,
    and every few weeks an update to Data Studio brings even more. Here are a few
    of the best hacks I’ve found out there:


    - **Don’t reinvent the wheel** – You can get so much inspiration from templates
    and examples out there. You don’t need to start from scratch every time if you
    have a good example on hand. Templates are available at `datastudio.google.com/gallery`.
    There are some amazing ones that can inspire or become your starter.


    - **See if your reports are being used** – You can add an analytics code snippet
    to your report templates to check usage and if people are engaging with them.
    It’s amazing how many reports are created and not used. It’s also interesting
    to see which ones are or some are used daily. An analytics code snippet can show
    you which ones need cleaning up, consolidating, or removing.


    - **Chart styles can be copied** – You can copy and paste (Paste special ➤ Paste
    style only) the styling of one chart to another so the style is consistent throughout
    your reports, including rounded edges, line thickness, and colors. When I found
    out about this, I couldn’t believe how much time this would have saved me in the
    past!


    - **Apply interactions filter to nearly everything** – Almost everything can filter
    everything else, which gives it some serious power to allow you to drill into
    what you want. If you want this to apply to just a subset, you can group them,
    including date filters.


    - **Advanced dates** – Some clients may need to see year-on-year performance,
    but at a day-by-day level as opposed to date-by-date. This is generally the case
    when a business follows a very trend-driven calendar. As this isn’t a built-in
    option, we have to get a little bit more technical to achieve this. Under your
    comparison date range selector, select “Advanced” from the list options. Once
    this has been done, you need to choose a fixed start date. To do this, go back
    to the previous calendar year and select the day that corresponds with the first
    date in the current year. After you’ve done this, it’s time to set the end date.
    To do this, simply select “Today,” “Minus” and then enter 365 as the number of
    days.


    - **Retrospectively clean parameters from landing pages** – Though we try to have
    the cleanest data going in, if you are using Google Analytics, filters allow you
    to clean up some of the strange issues, but you can’t do this retrospectively
    like you can in Data Studio. This is where custom fields can be used. Creating
    a new field in your data like this:


    ```

    REGEXP_REPLACE(Landing Page, ‘\\?.+’, ”)

    ```


    strips out any of the odd parameters that social networks such as Facebook and
    Twitter can append. We found that by applying that to one report, some socially
    shared posts doubled in visits. You can also strip off and consolidate trailing
    slashes `REGEXP_REPLACE(Page,"./","")`.


    - **Clearly identify report metrics** – Have guides that don’t just say what the
    metric is but what it means. You might need to add a glossary at the end of the
    report explaining some business metrics or simple analytics definitions such as
    what is a session or what the bounce rate means. On a side note, always include
    the y-axis label on charts, as it is frustrating trying to decipher metrics in
    Google Data Studio without it.


    - **Use a Swatch to create a color style sheet** – If you want to style your charts
    and your assets quickly, you can’t use CSS but you can import a graphic block
    that you can create in PowerPoint or some other quick graphic editor. Take a few
    colors from a client’s website or logo to ensure that we are using their own branding
    throughout their reports.


    Many thanks to Al Wightman, Omi Sido, Jill Quick, and Nick Wilsdon for their contributions.


    There are plenty of other hacks out there, and more that haven’t been discovered
    yet.


    ## Web Vitals


    Google, itself, uses Data Studio as a front end for some data sources now. An
    example of this is the Web Vitals project (`https://web.dev/vitals/`), which is
    a set of data points that show Google’s view of your site. You can find out from
    real users experiences stored in a Google BigQuery table that they’ve made public
    and they have made it accessible through a Data Studio report which is easily
    configured to be focused on your site (or a site belonging to a competitor). See
    Figure [8-6](#485069_1_En_8_Chapter.xhtml#Fig6).


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig6_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig6_HTML.jpg)


    Figure 8-6: The Google Data Studio template for Web Vitals


    As tools, services, and public data sets increasingly provide access to their
    data in Data Studio, it is clear it isn’t going away any time soon.


    The combination of data sources and visualizations means tracking is possible
    more than ever with simple visualization.'
