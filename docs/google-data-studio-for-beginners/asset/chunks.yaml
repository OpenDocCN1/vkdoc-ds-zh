    \ Take a few colors from a client’s website or logo to ensure that we are using\
    \ their own branding throughout their reports.\n\n    Many thanks to Al Wightman,\
    \ Omi Sido, Jill Quick, and Nick Wilsdon for their contributions.\n\nThere are\
    \ plenty of other hacks out there, and more that haven’t been discovered yet.\n\
    \n### Web Vitals\n\nGoogle, itself, uses Data Studio as a front end for some data\
    \ sources now. An example of this is the Web Vitals project ([`https://web.dev/vitals/`](https://web.dev/vitals/)),\
    \ which is a set of data points that show Google’s view of your site. You can\
    \ find out from real users experiences stored in a Google BigQuery table that\
    \ they’ve made public and they have made it accessible through a Data Studio report\
    \ which is easily configured to be focused on your site (or a site belonging to\
    \ a competitor). See Figure [8-6](#485069_1_En_8_Chapter.xhtml#Fig6).\n\n![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig6_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig6_HTML.jpg)\n\
    \nFigure 8-6\n\nThe Google Data Studio template for Web Vitals\n\nAs tools, services,\
    \ and public data sets increasingly provide access to their data in Data Studio,\
    \ it is clear it isn’t going away any time soon.\n\nThe combination of data sources\
    \ and visualizations means tracking is possible more than ever with simple visualization."
  trans: '

    # 后台数据的前端展示


    数据工作室的另一个妙用在于，如果我们能将数据拉取到 Google 表格或数据库中，它就可以成为后台数据的出色前端界面。例如，我曾需要创建一个可视化报告，展示我们团队已预订、计划预订和已休完的假期天数。这些数据已经是电子表格格式，因此很容易导入数据工作室。我需要做的一件事是创建一个新的工作表来清理数据。我确保各列正确对齐，以便我们能够快速按团队，然后按个人查看剩余、已休和已预订的天数。一旦我将数据输入数据工作室，我们就神奇地获得了一份会自动更新的报告。


    数据工作室是一个多功能的数据可视化工具。它不仅适用于营销数据。我经常发现，从事其他角色或行业的朋友，当你能够获取他们的数据并在数据工作室中进行可视化时，他们会感到惊喜。


    ## 嵌入表单


    你还可以在数据工作室报告中嵌入一个表单。例如，我想在一个报告中嵌入一个表单，让人们推荐我应该在 Twitter 上关注谁（图 8-4）。这是一份只需几分钟就能完成的快速报告。我创建了一个
    Google 表单，用于收集 Twitter 账号、用户姓名以及关注理由。我获取了 Google 表单的 URL，进入我的 Google 数据工作室报告，点击工具栏上的“嵌入
    URL”按钮，将表单放置在页面上，并在“外部内容 URL”字段中粘贴了该 URL（图 8-5）。


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig5_HTML.jpg](img/485069_1_En_8_Fig5_HTML.jpg)


    图 8-5：嵌入表单的 URL


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig4_HTML.jpg](img/485069_1_En_8_Fig4_HTML.jpg)


    图 8-4：在 Google 数据工作室报告中嵌入表单，允许您添加更多数据


    这仅需几分钟就能搭建完成，但如果我用其他方式开发，可能需要一两天才能完成。它易于共享，其他人也可以将其嵌入到他们自己的网站中。


    尽管在这个例子中，我展示了如何使用表单在报告中显示数据，但您也可以使用表单来获取关于报告本身的反馈。正如我们在本书前面提到的，一个很好的做法是放置一个包含您联系方式的页脚栏，以备有人提出问题或更正。您可以通过在报告的最后一页嵌入一个表单来实现这一点，用于收集对报告的反馈或修改请求。这是一种让用户提交更改并进行跟踪的巧妙方法，可以快速见效。


    ## 技巧与窍门


    数据工作室拥有许多能加速工作的技巧和隐藏方法，并且每隔几周的数据工作室更新都会带来更多功能。以下是我发现的一些最佳技巧：


    - **不要重复造轮子** – 您可以从现有的模板和示例中获得大量灵感。如果您手头有好的示例，就无需每次都从头开始。模板可以在 `datastudio.google.com/gallery`
    找到。那里有一些非常棒的模板，可以激发您的灵感或成为您的起点。


    - **查看您的报告是否被使用** – 您可以在报告模板中添加分析代码段，以检查使用情况以及用户是否在与之互动。令人惊讶的是，有多少报告被创建出来却无人问津。了解哪些报告被使用或哪些被日常使用也很有趣。分析代码段可以向您显示哪些报告需要清理、合并或删除。


    - **图表样式可以复制** – 您可以将一个图表的样式复制并粘贴（选择性粘贴 ➤ 仅粘贴样式）到另一个图表，以确保报告中样式的一致性，包括圆角、线条粗细和颜色。当我发现这个功能时，我简直不敢相信它过去能为我节省多少时间！


    - **将交互过滤器应用于几乎所有内容** – 几乎所有内容都可以过滤其他所有内容，这赋予了它强大的能力，让您可以深入探究您想要的数据。如果您希望此操作仅应用于某个子集，可以将它们分组，包括日期过滤器。


    - **高级日期** – 一些客户可能需要查看逐年的性能对比，但需要的是逐日级别而非逐日对比。这在业务遵循高度趋势驱动的日历时通常是这种情况。由于这不是内置选项，我们需要采用一些技术手段来实现。在您的比较日期范围选择器下，从列表选项中选择“高级”。完成此操作后，您需要选择一个固定的开始日期。为此，请返回到上一个日历年度，并选择与当前年度第一天对应的日期。完成此操作后，就该设置结束日期了。为此，只需选择“今天”、“减去”，然后输入
    365 作为天数即可。


    - **追溯清理着陆页中的参数** – 尽管我们力求输入最干净的数据，但如果您使用 Google Analytics（分析），过滤器可以帮助您清理一些奇怪的问题，但您无法像在数据工作室中那样进行追溯清理。这时就可以使用自定义字段了。在您的数据中创建一个如下所示的新字段：


    ```

    REGEXP_REPLACE(着陆页, ''\\?.+'', "")

    ```


    可以去除诸如 Facebook 和 Twitter 等社交网络可能附加的任何奇怪参数。我们发现，将此项应用于一个报告后，一些社交分享帖子的访问量翻了一番。您还可以去除并合并尾部斜杠
    `REGEXP_REPLACE(页面,"./","")`。


    - **清晰标识报告指标** – 提供指南，不仅要说明指标是什么，还要说明其含义。您可能需要在报告末尾添加一个术语表，用以解释一些业务指标或简单的分析定义，例如什么是会话或跳出率是什么意思。顺便提一下，始终在图表中包含
    Y 轴标签，因为没有它，在 Google 数据工作室中解读指标会非常令人沮丧。


    - **使用色板创建颜色样式表** – 如果您想快速为图表和素材资源设置样式，您不能使用 CSS，但可以导入一个您可以在 PowerPoint 或其他快速图形编辑器中创建的图形块。从客户的网站或徽标中选取几种颜色，以确保在整个报告中都使用他们自己的品牌标识。


    非常感谢 Al Wightman、Omi Sido、Jill Quick 和 Nick Wilsdon 的贡献。


    还有很多其他的技巧，以及更多尚未被发现。


    ## 网页指标


    Google 本身现在也将数据工作室用作某些数据源的前端界面。这方面的一个例子是 Web Vitals 项目（`https://web.dev/vitals/`），它是一组数据点，展示了
    Google 对您网站的看法。您可以从他们公开的 Google BigQuery 表中获取真实用户的经验数据，并且他们通过一个数据工作室报告使其可访问，该报告可以轻松配置为聚焦于您的网站（或竞争对手的网站）。请参见图
    8-6。


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig6_HTML.jpg](img/485069_1_En_8_Fig6_HTML.jpg)


    图 8-6：用于 Web Vitals 的 Google 数据工作室模板


    随着越来越多的工具、服务和公共数据集在数据工作室中提供对其数据的访问，很明显它不会在短期内消失。


    数据源和可视化的结合意味着，只需简单的可视化，就可以实现前所未有的追踪可能性。

    '
- fmt: '### Hack in the Data Through Google Sheets


    There is an increasing number of connectors out there now. Despite that, within
    the marketing world, there are always data sources that aren’t easily available.
    For this reason, you can connect to these data sources, such as `IFTTT` (If This
    Then That), by connecting to `Google Sheets` (Figure [8-7](#485069_1_En_8_Chapter.xhtml#Fig7)).


    ![../images/485069_1_En_8_Chapter/485069_1_En_8_Fig7_HTML.jpg](images/485069_1_En_8_Chapter/485069_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    *IFTTT samples that can be used to pull data into Sheets*


    You can track tweets about conferences (if they have a hashtag or common name)
    straight into a `Google Sheet`, and from there we can see the types, frequency,
    and who is tweeting the most in an almost live `Data Studio` report.


    We can also track how often people complete tasks in `Data Studio` by hooking
    our project management tool to `Google Sheets` through `Asana` – a total view
    of how a business operates results in informed leadership delivering better results.


    A popular task within any company is to look at the team allocation, how much
    time is dedicated to a client vs. how much they are paying, who is overworked,
    and who is underutilized. While it is possible to do much of this in a spreadsheet,
    by using the APIs within `Data Studio` gives you a live dashboard that gives you
    the ability to look quickly and efficiently at status. If you can look at this
    dashboard live as we go along, it gives you the ability to effectively slot in
    new projects and client requests or compensating for an underperforming team member.


    ## Recap


    Ultimately, `Google Data Studio` makes data that is often locked in silos more
    accessible. If it was once hidden in a spreadsheet or unavailable in a datastore,
    it is now accessible, throughout businesses and even sometimes publicly available
    online.


    And of course, if you have come to the end of this book and you’ve built something
    inspirational or entertaining, feel free to share it with us on Twitter!


