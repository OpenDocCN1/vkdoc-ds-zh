  trans: "#### 步骤 4.3：编辑连接并授权访问 Google 云端硬盘\n\n此时会弹出一个关于向此报告添加数据的小对话框。只需点击“添加到报告”即可。Google\
    \ 会请求权限，以便在你的 Google 云端硬盘中创建新的 Google Data Studio 报告。\n\n**注意**\n\n我个人觉得这一步有点令人困惑，因为我平时向云端硬盘添加\
    \ Google 文档或表格时，并不需要请求权限。我不明白为什么 Google 对 Data Studio 文档的处理方式有所不同。希望 Google 能在未来移除这一步骤，让用户操作更简便。\n\
    \n对话框关闭后，你会返回 Google Data Studio 报告编辑器主界面。恭喜你，现在你已经成功创建了第一个 Data Studio 连接。接下来，我们可以专注于在屏幕上展示数据，让全世界看到你的问候。\n\
    \n### 步骤 5：在 Data Studio 中显示 CSV 数据\n\n现在，我们准备向世界展示你的数据。在菜单栏中，你会看到一个名为“添加图表”的按钮。点击它，你可以从多种数据可视化方式中进行选择。我们稍后会详细介绍这些选项。现在，只需选择第一个图标（简单表格）。屏幕上会出现一个带有小表格图标的大矩形。Data\
    \ Studio 要求你选择表格的放置位置。目前，只需将其整齐地放置在页面顶部的主要画布区域即可。请参见图 1-5。\n\n![../images/485069_1_En_1_Chapter/485069_1_En_1_Fig5_HTML.jpg](img/485069_1_En_1_Fig5_HTML.jpg)\n\
    \n**图 1-5** Data Studio 中的第一个表格\n\n仿佛魔法一般，你可以看着第一个数据表格逐渐显现。我相信你之前在很多程序中都见过表格，但\
    \ Data Studio 之所以成为数据分析领域的变革者，就在于这个小小表格的强大和灵活性。我觉得它就像公路赛车中的喷气背包——如果你想领先，只需启动火箭引擎，就能超越其他竞争对手。\n\
    \n## 本章小结\n\n在本章中，你从零开始，为 Data Studio 打下了基础。我们从一个文件中提取数据，并在 Data Studio 中建立了连接。然后使用表格控件在屏幕上显示数据，从而向世界发出问候。\n\
    \n在下一章中，你将接到第一个 Data Studio 任务，并为一个小型企业构建基础仪表盘。\n\n# 2. 报告制作\n\n手动电子表格与 Data Studio\
    \ 报告\n\n> *我从不教导我的学生，我只尝试提供他们能够学习的条件。*\n> \n> ——阿尔伯特·爱因斯坦，理论物理学家\n\n你在第 1 章中创建的第一个“Hello\
    \ World”Data Studio 报告似乎只是个开始！原本只是个人练习项目，如今已演变为你的第一个仪表盘制作机会。\n\n我发现，分享你热衷的事情总是有益的。如果某件事让你充满热情，那么志同道合的人自然会被你吸引。你还会发现，以前未曾注意的机会也会随之出现。\n\
    \n通过构建一个小项目来学习新技术，是最有效的方法。如果你能在学习项目中有所收获，那你就是极其幸运的少数人。就我而言，我花了很多业余时间学习 Data Studio，并且乐在其中，因为我喜欢它处理数据时的创造性。孩子们入睡后，我会坐在厨房桌旁，而不是瘫在电视机前，尝试在\
    \ Data Studio 中构建一些有趣的东西。\n\n**提示**\n\n花几分钟思考一下，你想用 Data Studio 构建什么样的项目。可以是个人用途，比如绘制你一周的运动距离曲线；也可以是工作相关，比如自动化你的报告流程。\n\
    \n那么，让我们开始第一个小项目吧——为我们的朋友赫尔曼制作一份销售报告。\n\n## 帮助赫尔曼的蛋糕与咖啡店\n\n赫尔曼经营自己的咖啡店和面包店已有两年，积累了相当忠实的顾客群。一些老主顾甚至称他为“赫尔曼大叔”，因为他总能娓娓道来，分享故事。\n\
    \n他过去在城中老街区做摩托车修理工，但随着科技公司不断涌入，他发现向他们售卖咖啡和蛋糕能带来丰厚的利润。事实证明，科技从业者非常喜欢有格调、独特的场所来休闲和工作。由于大部分时间与摩托车爱好者为伴，他有很多精彩的故事，常常一边招待顾客享用热饮和糕点，一边娓娓道来。\n\
    \n如今，他曾经投入摩托车生意的热情，已完全转移到咖啡店上。他专注于提供最优质的有机素食，并痴迷于调配咖啡，力求让其味道比街角店铺好上十倍。\n\n![../images/485069_1_En_2_Chapter/485069_1_En_2_Fig1_HTML.jpg](img/485069_1_En_2_Fig1_HTML.jpg)\n\
    \n**图 2-1** 赫尔曼的咖啡店\n\n你能运用新学的 Data Studio 技巧（图 2-1），帮助他更好地了解自己的业务吗？如果你能帮他增加收入，他将以一个月免费咖啡和纸杯蛋糕作为答谢。\n\
    \n**注意**\n\n学习期间免费工作是没问题的。但一旦掌握了技能，就别指望再免费干活了。任何人都不应被期待用免费劳动换取所谓的“未来”收益或晋升机会——那些机会很少能真正转化为实惠。如果有人需要你的技能，他们就该付钱。至于赫尔曼，我们这次就放过他，接受咖啡和蛋糕的报酬吧——毕竟，这是检验\
    \ Data Studio 能力、为作品集构建第一个项目的绝佳方式。"
- fmt: '## What Information Should You Show in Your Reports?


    Whenever I meet a new client or business stakeholders, I always try and take the
    time to understand them with four key questions:


    1. **What is their current goal?** What is their main goal for the business?

    2. **What information do they need?** What information do they need to help drive
    this goal?

    3. **What is their level of data expertise?** How sophisticated are they in using
    and understanding data?

    4. **How should it be presented to them?** What’s the best way to deliver data
    that is being clearly understood by the audience?


    The first question is the most important one to understand. All people are trying
    to achieve something, so if you can make sure you have built alignment with them,
    it makes it easier for you to work together.


    Identifying the exact information that will help them toward that goal is the
    next question. Typically most people will come to you with a set of requirements
    that they believe they need. It’s up to you as the data person to understand those
    requirements and make sure that they are really helping them to achieve what they
    need. If they don’t, you will find out really quickly because no one will look
    at your reports.


    As you produce more reports, you will pick up experience with being able to filter
    out the “extra noise” and will be able to hear the various cues that indicate
    that the person is not sure of what they want or need and is just using their
    best guess. This will let you step in and guide them toward something more concrete
    and helpful.


    The audience’s data expertise is covered in the third question, and it’s extremely
    difficult to gauge at the start of your working relationship with them. It’s also
    a question that most people will very rarely answer truthfully up front. People
    are generally very defensive when you ask straight out about how much they know
    about data. Instead of asking people outright, there are much better techniques
    to get this information.


    I have had people tell me that they use `Google Analytics` “all the time” yet,
    when I look at their `Google Analytics` accounts, I can see that the accounts
    are hardly used (and in many cases giving inaccurate data). It’s not just at manager
    level, I have several experiences of working with extremely senior data directors
    who claimed to be experts, and I was surprised to find out that they didn’t understand
    simple concepts such as user conversions or bounce rate. Just because they got
    to their position without knowing the fundamentals of data analytics doesn’t mean
    you can’t teach them something new. If you are dealing with people who are not
    very sophisticated in terms of their data experience, then being able to give
    them answers in a simple and clear way will be vital.


    On the other hand, some users are extremely sophisticated, and if you give them
    simple answers and no detail, they will quickly become frustrated and not trust
    the results you are giving them.


    The fourth question, “How should it be presented,” is the most important one.
    The more you practice building dashboards, the more effective you will be at getting
    traction in your business.


    ## Finding Out What Hermann Needs


    > *Most of the world will make decisions by either guessing or using their gut.
    They will be either lucky or wrong.*

    >

    > —Suhail Doshi, the CEO of Mixpanel


    When you start working with a new client or stakeholder, you need to try and understand
    what their need is. For Hermann’s coffee shop, it’s pretty clear. He has grown
    his shop organically by focusing on building relationships with customers and
    having a great quality set of products that people love. In the old days, that
    was enough, but nowadays, if you aren’t using data to drive your business, then
    you are only seeing a “slice” of the picture.


    Hermann’s brief is to challenge you to use data to help him make more money. This
    is a pretty big ask and one we are unlikely to be able to fulfill. A lot of people
    just assume that waving the data “magic wand” on their business will suddenly
    materialize into money. Hermann is clearly one of these people. This is typically
    the part where you try and help them understand where data sits in the food chain.


    Your answer should always be the same. You explain to Hermann that together we
    can use data to try understand better what’s going on which can help inform his
    decisions. Sometimes that leads to more money being made, sometimes it doesn’t.


    Most business owners will look a little uncomfortable when you tell them that
    you might not be able to give them what they are expecting, but that’s OK. It’s
    better to make sure you manage people’s expectations instead of trying to deliver
    something that’s not realistic. The important thing is build up a good history
    of showing results and you will be able to use this to build trust early on with
    potential customers/internal teams.


    The one guarantee that you can give anyone is that by making his data visible
    and easily accessible you can help to make smarter decisions in order to grow
    any business.


    Back to your meeting with Hermann, you have a list of the four key questions you
    would like to ask him based on the previous section.


    ### What Is His Current Goal?


    Hermann tells you that he’s looking to grow the amount of sales for the coffee
    shop. If he is able to do this, he will be able to open up a new coffee shop in
    one of the other tech districts in the city.


    ### What Information Does He Need?


    Hermann says that he currently logs the takings each day in a simple `Excel` document
    that he sends off to his accountant to enter into his accounts system. He then
    gets a report emailed to him at the end of the week with what the top selling
    products were. He uses this information to order his ingredients and plan for
    what he’s going to sell the following week.


    ### What Is His Level of Data Expertise?


    Hermann admits to you that he’s out of his depth when it comes to data. He knows
    what sells but he has no idea about using some of the common tools in spreadsheets.
    He says that he’s quite happy with getting the overview data every week from his
    accountant.'
