- fmt: '## Recap


    Google Data Studio isn’t just a front end for your analytics data. It can be a
    presentation layer for survey data, much like a tool like `Excel` can be, but
    makes the data online and accessible for everyone.


    Data can be improved and cleaned within the tool using simple string functions,
    and additional transformations can be applied to create custom fields based on
    free text or by consolidating some dimensions. Ultimately Google Data Studio is
    a powerful way of taking data sets and presenting them in easy-to-understand ways.
    For some this is a far better front-end to complex back-end tools such as Google
    Sheets, but care must be taken to make sure the data is in the right format to
    start.


    # 5. Marketing Data Visualization


    > *Would you tell me, please, which way I ought to go from here?*

    >

    > *That depends a good deal on where you want to get to, said the Cat.*

    >

    > *I don’t much care where—said Alice.*

    >

    > *Then it doesn’t matter which way you go, said the Cat.*

    >

    > —*Alice’s Adventures in Wonderland*, Lewis Carroll


    In this chapter, we are going to zoom in on some of the best and most potentially
    transformative source of data in the world, namely, website analytics (also known
    as on-site analytics), and learn how to present the date in a report.


    ## The Value of Website Analytics


    The majority of businesses are data factories, spilling out conveyor belts of
    data about what’s going on with the business. Like a real factory, these conveyor
    belts never stop unless someone breaks something or the business stops trading.
    It’s the job of the data visualization engineer to turn these conveyor belts of
    data into insights that can be used by business to drive value. Molding products
    out of these multitude of data sources will be one of the most valuable contributions
    that your new Data Studio skills will be able to process, mix up, and merge, which
    will drive a lot of insight and impact.


    Webstores are now considered significant contributors to a company’s business,
    so looking at the web analytics for a webstore is valuable because you can then
    understand how and why the website works and how it can be made better to drive
    even more business.


    Website analytics offer so many wonderful opportunities to fundamentally change
    businesses performance, and yet so many businesses make the same error of simply
    downplaying it or worse ignoring it all together.


    For me the simple definition of what on-site web analytics is:


    > *What’s going on with my website?*


    Entire books have been written on the subject of analytics, which go into massive
    amounts of detail. I am not going to regurgitate the same information here but
    rather direct you to a source that will give you a high-level summary.


    Check out the Wikipedia web analytics page which is in my opinion one of the best
    worded definitions out there: [`https://en.wikipedia.org/wiki/Web_analytics#Web_analytics_technologies`](https://en.wikipedia.org/wiki/Web_analytics%2523Web_analytics_technologies).


    I recommend that you skim through it to try and give yourself some context about
    of analytics and in particular have a read of the section on the more common “On-site
    web analytics.”


    ### Visualizing the Size of Your Audience


    Web analytics can affect a large number of potential customers that it’s difficult
    to understand just how powerful it can be. 3,000 people can look very similar
    to 30,000 people if you are only looking at numbers.


    Here’s a real-life example. After spending time looking at the data in the web
    analytics for a client, I recommended that we add a “Refer a friend” program to
    a furniture retailer. We don’t have to go into why, but let’s just say the data
    pointed me in that direction. Since they literally had millions of visitors coming
    to their site every month, the referral program was able to scale really quickly.
    It was only a month or two later where we found that they had acquired a lot of
    new customers really quickly. When I showed them the number of new customers in
    a slide deck, I remember getting a lukewarm reaction as it was still considered
    only a small channel for the business.


    When I presented the numbers a few weeks later, I tried to make the report more
    engaging. Instead of reporting the actual number of new customers, I showed them
    a picture of a particular football stadium and said we could fill one of them
    twice over with the new customers that have come in from the “Refer a friend”
    program. The reaction was to applaud! This was the same data, and same results
    presented to two similar teams, but presented in different ways.


    ### Google Analytics


    Google Analytics has become the most popular choice for web analytics since it
    was first created over 10 years ago. It’s quite difficult to find a website where
    there isn’t some portion of the site tracked using its code. Arguably one of the
    key drawbacks about Google Analytics and one of the main reasons why Data Studio
    was born was so as to create a simple and engaging platform for dashboards. Figure
    [5-1](#485069_1_En_5_Chapter.xhtml#Fig1) shows the old Google Analytics dashboard.


    ![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig1_HTML.jpg](images/485069_1_En_5_Chapter/485069_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    The old Google Analytics dashboard


    Google Analytics has had built-in features for dashboarding for many years; however,
    in most countries, this has never had widespread usage because


    *   It required users to log in to Google Analytics.


    *   Google Analytics dashboards are complicated to share and change.


    *   You are limited in the amount of data controls that you can use.


    Let’s get started visualizing with Google Analytics.


    ## Starting Out Visualizing Google Analytics


    The first thing to do is get data to analyze. For the sake of learning, we are
    going to use some practice data, and so we can get started quickly, we are going
    to use templates.


    ### Getting Access to Practice Marketing Data


    Before we get started with some data wrangling, we will need to get hold of some
    data that we can practice on. The Google Analytics team has provided several data
    sets that can be used in Data Studio to help us all to learn.


    The data set that we are going to use for the next exercise is the Google Merchandise
    Store data, which is made up of all the visitors and customers who visit [`https://shop.googlemerchandisestore.com/`](https://shop.googlemerchandisestore.com/).
    See Figure [5-2](#485069_1_En_5_Chapter.xhtml#Fig2). The great thing about this
    data is that it effectively allows us to learn what real website data looks like
    without having to invest thousands in building out our own site. One point to
    note is that there are usually some oddities that occasionally crop up in the
    data which don’t normally make sense; however, I am pretty sure that this is down
    to the data being created for the purpose of demonstrating certain features. Generally
    speaking, the data is perfect for most learning purposes; however, be wary of
    comparing it to your own. Also don’t worry about the potential risk of breaking
    the account. There is nothing you can do wrong that could damage the data.


    ![../images/485069_1_En_5_Chapter/485069_1_En_5_Fig2_HTML.jpg](images/485069_1_En_5_Chapter/485069_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    The Google Analytics Merchandise Report from the Template Gallery'
