- fmt: "### How Should the Data Be Presented to Him?\n\nThe simplest technique to\
    \ finding the right format is to ask the stakeholders for their old reports. Start\
    \ with what they know and what they’re familiar with, as long as it’s simple to\
    \ do so.\n\nYou are probably thinking to yourself. “Hold up, surely it’s better\
    \ to start with something new, shiny and streamlined?”\n\nHere is the trick though:\
    \ the aim of this step is not to give them something shiny, but rather you are\
    \ trying to build up trust with the client.\n\nLet me illustrate this with a short\
    \ story.\n\nA few years ago, I heard from a designer who worked exclusively with\
    \ Adobe Photoshop. He had been invited to a market research opportunity where\
    \ he was given the chance to review a new rival to Photoshop. They spent a long\
    \ time presenting it and showing off the product and all the features including\
    \ its unique new navigation that they were extremely proud of. At the end of the\
    \ session, they asked the group what improvements they would like to see. This\
    \ designer said he put up his hand and said:\n\n“Can’t you just make the navigation\
    \ the same as Photoshop?”\n\nHe was met with silence. To do what he asked would\
    \ have delayed the product, and also meant dropping the fancy navigation feature\
    \ that they were so proud of. They didn’t listen to him and his primary need for\
    \ continuity. The designer wanted to be able to deliver work without going through\
    \ lots of additional learning.\n\nNeedless to say, the other tool isn’t around\
    \ anymore. Adobe’s tools are still the most popular software for designers. I\
    \ wonder what would have happened if that other company had listened to their\
    \ target audience?\n\nMuch in the same way if you want your users to build up\
    \ trust with your tools, then the simplest way to start is to replicate what they\
    \ know. One of the key features that Data Studio has is that it’s super quick\
    \ to prototype up new reports. Once people recognize their old friendly reports\
    \ sitting on their screens, you will have their attention and can start to iterate\
    \ their data reports.\n\nWhen we got a copy of Hermann’s reporting, it looked\
    \ like a big table with a wall of numbers. It was a list of products, with the\
    \ numbers sold next to each item. Next to each item he could see a percentage\
    \ sign that says whether sales have gone up or down from the previous week.\n\n\
    ## How Data Studio Can Help Hermann\n\nAfter reviewing Hermann’s answers to the\
    \ four key questions, it’s clear to you where Hermann needs help. He needs:\n\n\
    1. **Timely information** – He’s not getting timely information to make decisions.\
    \ He needs to wait for the end of the week when his accountant sends the data\
    \ back.\n2. **Removing duplicated efforts** – Currently Hermann has to type his\
    \ sales data into a spreadsheet and then email it to the accountant. The accountant\
    \ will enter the sales into an accounting program/spreadsheet and then send back\
    \ the sales reports of what’s doing well. Hermann will then need to review and\
    \ analyze the results.\n\nIf you can show Hermann how to use Data Studio to take\
    \ his sales data and automatically process it and generate a report from the raw\
    \ spreadsheet data, then you could help him to make decisions faster. He also\
    \ wouldn’t need to pay the accountant to enter the data and return the data back\
    \ to him. Instead he can focus on driving the improvements that can come from\
    \ the data.\n\nYou also suspect that since Hermann is so focused on his products,\
    \ he will be able to ask much better questions of his data if he is able to take\
    \ control of it himself. This might be the largest win for him in the long run.\n\
    \nHermann forwards you the last few reports that he received from his accountant\
    \ so you can see what reporting has changed. The good news is that we can definitely\
    \ improve on it! Let’s crack on with the work.\n\n## Building a Report for Hermann’s\
    \ Cake and Coffee Shop\n\n### Step 1: Upload the Data into a Google Spreadsheet\n\
    \nThe first step is to get Hermann’s data from a Google Sheet.\n\nFor this exercise,\
    \ you’ll need to download a copy of Hermann’s Cake and Coffee Shop sales data\
    \ (DS – Coffee Shop.xlsx) from the source code for this book. Go to [`www.apress.com/9781484851553`](http://www.apress.com/9781484851553)\
    \ and click the download source code button.\n\nTake your data spreadsheet and\
    \ upload it to Google Drive.\n\nOpen up Google Sheets by visiting [`https://docs.google.com/spreadsheets/u/0/?tgif=d`](https://docs.google.com/spreadsheets/u/0/%253Ftgif%253Dd).\n\
    \nCreate a new sheet and go to File ➤ Import ➤ Upload. Browse for the `DS – Coffee\
    \ Shop.xlsx` file and upload it.\n\nMake sure the spreadsheet is named `“DS -\
    \ Coffee Shop.”` If you need to fix it, double-click the file name at the top\
    \ left of the sheet and change it. Hit enter or click elsewhere when you’re done.\n\
    \n### Step 2: Clean the Data\n\nNext, we need to clean the data so it’s good to\
    \ be consumed.\n\nThe aim of the cleaning process is to:\n\n- Get your data into\
    \ a table format.\n- Ensure that each column contains only one set of data.\n\
    - Check none of the fields have blank entries.\n- Make sure that all the fields\
    \ have the data in the correct consistent format. For example, you need to make\
    \ sure that dates are in the format `dd/mm/yyyy`.\n\nOne of my favorite data team\
    \ leaders used to repeat the same mantra over and over whenever developers would\
    \ try to cut corners with data:\n\n> *Rubbish in…Rubbish out*\n\nYou should think\
    \ of your Data Studio reports as being as clean as one of those fancy filtered\
