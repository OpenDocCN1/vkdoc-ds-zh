- "# 3. 开源分析\n\n免费的颠覆性力量\n\n在各类软件领域中，自由与开源软件的影响力与日俱增。在本章中，我们将探讨以下问题：\n\n* 什么是自由与开源软件？\n\
  * 自由与开源软件如何体现其商业价值？\n* 分析领域有哪些领先的自由与开源软件项目？\n\n自由与开源软件最显著的特质在于其缺失的部分：软件许可费。在本章中，我们将证明自由与开源软件是可行的，并且它正在颠覆分析软件行业中的现有企业。\n\
  \n## 开源基础\n\n开源软件的精确定义存在一些争议。我们首先回顾各种相互竞争的定义，然后介绍开源软件项目的基础知识，包括治理、许可、代码管理与分发，以及软件捐赠问题。\n\
  \n\n\n### 定义\n\n像“自由”和“开源”这样的词看似含义明确。然而，在软件领域，它们却有多重含义。\n\n在标准的商业软件许可模式下，开发者提供软件使用许可，以换取许可费。许可可能是永久性的，也可能是有限期的。此外，还可能存在其他限制：例如指定用户、特定计算设备或特定应用。开发者以编译形式分发软件，通常附带一个许可密钥，用于防止超出软件许可范围的使用。这些措施保护了开发者对软件知识产权的经济利益。\n\
  \n自由及开源软件则运行在一种完全不同的模式下。开发者分发软件源代码本身，并附带一份授予检查、修改和重新分发代码权利的许可。开发者对软件知识产权不主张任何经济权利，并且放弃因使用软件而收取许可费。\n\
  \n有两个组织，即开放源代码促进会（OSI）和自由软件基金会（FSF），它们对“自由软件”和“开源软件”的定义略有不同：\n\n-   自由软件基金会发布了《自由软件定义》，该定义规定，如果用户能够运行、研究、重新分发以及分发软件的修改版本，则该软件便是自由的。\n\
  -   开放源代码促进会发布了《开源定义》，该定义详细说明了开源软件的十项标准，包括访问源代码、重新分发的权利等等。\n\n《自由软件定义》定义了一组权利；如果软件用户能够行使这些权利，该软件就是“自由的”。（“自由”指的是“被解放”的意义，而不仅仅是“免费”。）《开源定义》定义了一组特征；如果软件具备这些特征，它就是“开源的”。无论是《自由软件定义》还是《开源定义》，都没有明确说明开发者不得收取许可费；源代码的分发使得收费变得不可能。\n\
  \n假设玛丽根据某种开源许可发布了某款软件的源代码。乔拿到了玛丽的源代码，并以 100 美元的价格不加修改地重新分发。客户很快会发现，他们不需要为能从玛丽那里免费获得的东西向乔付费。如果乔通过以商业许可发布该软件来隐藏其来源，玛丽可以起诉乔侵犯了她的开源许可。\n\
  \n这两个组织之间的差异主要是哲学层面的。自由软件基金会源于自由软件运动，该运动主张专有软件和普遍的知识产权“不应该”存在，这是一种本质上的政治观点。自由软件基金会成立于\
  \ 1985 年，赞助了大规模协作项目 GNU 项目。\n\n与自由软件基金会相反，开放源代码促进会认为开源是一种更好、更实用的软件开发方式，并回避政治激进主义。撇开政治分歧不谈，两者之间几乎没有实际差异，并且大多数开源许可证都符合这两个组织的标准。\n\
  \n虽然所有开源软件都是“自由的”，因为任何人都可以在不支付许可费的情况下获取源代码，但并非所有“免费”软件都是开源的。商业软件供应商可以且确实会向用户免费提供闭源或专有软件。他们这样做可能是为了建立商业软件产品的知名度和试用机会，允许进行评估，或者采用双重许可模式（我们将在本章后面进一步讨论）。\n\
  \n类似地，并非所有标榜为“开放”的软件都是“开源”的。商业供应商有时会将软件标记为“开放”，因为它有公开的 API，或者因为它实现了如 ANSI SQL 这样的开放标准。定价和文档并不会使一个封闭的产品变得开放；当且仅当软件是根据自由及开源许可证分发时，它才是自由和开放的。\n\
  \n在尊重自由软件基金会和开放源代码促进会之间差异的同时，在本章及全书范围内，我们将使用术语“开源”来表示符合这两个组织定义的软件。\n\n### 项目管理\n\
  \n开源软件项目，如同任何其他项目一样，需要一个职责明确的组织结构。它们还需要一个法律框架来拥有软件资产并向用户发放许可。像 `R` 和 `Python` 这样的大型项目，拥有自己的治理框架；我们将在本章后面单独讨论。在本节中，我们将介绍两个实体，即\
  \ Apache 软件基金会和 Eclipse 基金会，它们共同管理着许多广泛使用的开源项目。\n\nApache 软件基金会（ASF）是一个由个人和企业捐赠资助的\
  \ 501(c)(3) 慈善组织，其使命是为公共利益提供软件。为了支持这一使命，ASF 提供了一个用于知识产权管理的法律框架，接受捐赠和贡献的软件，并根据自由及开源许可证分发软件。ASF\
  \ 目前支持超过 350 个开源项目。根据其 2013 年（可获取其 IRS 备案的最新年份）的数据，ASF 报告了 110 万美元的捐赠和 65.3 万美元的运营费用。\n\
  \n每个 ASF 项目都在一个项目管理委员会（PMC）的指导下运作，其成员从项目的提交者中选举产生。PMC 负责监督项目，定义发布策略，设定社区和技术方向，并管理各个版本的发布。PMC\
  \ 有责任确保项目遵循 ASF 设定的核心要求，例如关于法律方面和品牌形象的规则。\n\nApache 项目包括贡献者和提交者。贡献者以各种方式支持项目，但只有提交者才能在源代码仓库中创建新的修订版本。\n\
  \nApache 项目通常作为孵化器项目开始。在孵化阶段，项目建立其 PMC，确保符合 Apache 的法律标准，并开始构建社区。当一个项目达到一组既定的项目目标时，它就会毕业并晋升为\
  \ Apache 顶级项目。截至 2016 年 4 月，有 56 个项目处于孵化状态；其中，20 个项目已在计划中超过一年。在孵化器计划的整个生命周期中，截至\
  \ 2016 年 4 月，已有 159 个项目毕业成为顶级项目；42 个项目在毕业前退出，主要是由于不活跃。\n\nEclipse 基金会是一个 501(c)(6)\
  \ 非营利性质的会员制支持公司，负责支持并维护 Eclipse——一个开源软件开发平台。该基金会还支持本章后面讨论的商业智能平台 BIRT。\n\n\n\n###\
  \ 开源许可证\n\n在 1988 年《伯尔尼公约》实施之前，未经版权声明分发的软件即进入公有领域。根据《伯尔尼公约》，软件在创作完成时自动获得版权。《伯尔尼公约》还规定了较长的版权保护期限；自\
  \ 1988 年以来，尚无已知的软件达到版权保护期结束并进入公有领域的案例。1988 年已处于公有领域的软件，例如 `BASIC` 编程语言，仍保留在公有领域。\n\
  \n由于版权自动附着于软件，因此需要开源许可证来明确放弃用户享有的版权特权。`开源促进会`（`OSI`）和`自由软件基金会`（`FSF`）分别针对开源和自由软件许可证发布了各自的指导方针。\n\
  \n根据追踪开源软件项目的私营公司 `Black Duck Software` 的数据，目前有超过 2,400 种独特的软件许可证在使用。最受欢迎的¹许可证包括\
  \ `MIT` 许可证、`GNU 通用公共许可证`（`GPL`）2.0 版和 3.0 版、`Apache 许可证 2.0` 以及 `BSD 许可证 2.0`。所有这些许可证均符合\
  \ `OSI` 和 `FSF` 的标准。\n\n`MIT 许可证` ：一种由`麻省理工学院`（`MIT`）开发的自由且宽松的软件许可证。`MIT` 许可证明确授予最终用户使用、复制、修改、合并、出版、分发、再许可和销售其所附软件的权利。\n\
  \n宽松型软件许可证授予被许可方根据不同的许可证重新分发衍生软件的权利。换句话说，开发者可以修改根据宽松型许可证获得的软件，并根据商业许可证重新分发它。\n\n\
  `GNU 通用公共许可证` ：一种最初为`自由软件基金会`开发的自由但非宽松（即“著佐权”）的软件许可证。`GPL` 授予被许可方运行、研究、重新分发和改进其所附软件的权利。1991\
  \ 年发布的 2.0 版与 2007 年发布的 3.0 版在知识产权法的具体细节上有所不同。\n\n著佐权（或称限制性软件）许可证规定，任何基于该许可证分发的软件衍生的软件，都必须以相同的许可证进行分发。换句话说，如果开发者修改了根据\
  \ `GPL` 许可证分发的软件，那么修改后的软件也必须根据 `GPL` 许可证分发。\n\n`Apache 软件许可证` ：一种由`阿帕奇软件基金会`（`ASF`）开发的自由且宽松的软件许可证。所有\
  \ `ASF` 项目以及许多其他非 `ASF` 项目均根据此许可证分发软件。该许可证授予用户使用、分发、修改和重新分发衍生软件的权利。虽然用户可以根据不同的许可证分发修改后的软件，但代码中未修改的部分必须保留在\
  \ `Apache` 许可证下。\n\n`BSD 许可证` ：1989 年为操作系统`伯克利软件发行版`开发的一系列自由且宽松的软件许可证。有几种不同的版本（称为\
  \ 2-条款、3-条款和 4-条款许可证），`BSD` 许可证的拥护者认为它比专有许可证更具兼容性。最初的 `BSD` 许可证不符合 `OSI` 标准，但修改后的版本符合。\n\
  \n### 代码管理与分发\n\n每个开源项目都必须决定如何以及在何处存储源代码，如何维护版本和修订版，以及如何向潜在用户分发代码。\n\n较大的项目运营自己的分发平台。例如，`R\
  \ 项目`运营着`综合 R 档案网络`（`CRAN`），这是一个由全球超过 100 个 `FTP` 和网络服务器组成的网络，存储着 `R` 语言相同的最新版本代码和文档。同样，`Python\
  \ 软件基金会`托管着一个包含 `Python` 参考实现的存储库。商业开源供应商通常运营自己的分发平台。\n\n处于早期开发阶段的软件项目无力开发自己的代码管理系统。有两个开源项目是开源社区的关键推动者：`Subversion`\
  \ 和 `Git`。\n\n`Apache Subversion` 是一个软件版本和修订控制系统，被开源软件社区和企业用户广泛使用。私营的软件和应用生命周期代码管理公司\
  \ `Collabnet` 于 2000 年开发了 `Subversion` 的原始版本，并于 2009 年将其捐赠给`阿帕奇软件基金会`（`ASF`）。`ASF`\
  \ 根据 `Apache` 许可证分发该软件。虽然 `Subversion` 本身缺乏用户界面，但许多商业和开源的客户端（即`集成开发环境`，`IDE`）都可以与\
  \ `Subversion` 协同工作。\n\n`Git` 是一个免费且开源的分发式版本控制系统，由致力于 `Linux` 内核的一个团队从 2005 年开始开发；该软件在\
  \ `GPL` 许可证下可用。`Git` 本身通过命令行界面运行。`GitHub` 是一家成立于 2008 年的私营初创公司，它提供了基于 web 的 `Git`\
  \ 版本，同时还具有访问控制、缺陷跟踪、功能请求和任务管理等其他功能。`GitHub` 声称拥有超过 1200 万用户和 3500 万个项目。\n\n\n\n\
  ### 捐赠软件\n\n很少有开源项目是从零开始的。大多数情况下，项目始于一个作为学术研究项目或商业项目开发的软件核心。版权所有者将源代码捐赠给致力于开源软件的实体，例如\
  \ Apache 软件基金会（ASF）。\n\n此类捐赠的例子包括：\n\n- `Spark`，一个分布式内存项目，于 2013 年由加州大学捐赠给 ASF。\n\
  - `Storm`，一个流式分析引擎，于 2011 年由 Twitter 捐赠²给 ASF。\n- `Hawq`，一个基于 Hadoop 的 SQL 引擎，于\
  \ 2015 年由 Pivotal Software 捐赠³给 ASF。\n- `Impala`，一个分析型数据库，于 2015 年由 Cloudera 捐赠⁴给\
  \ ASF。\n- `SystemML`，一种机器学习语言，于 2015 年由 IBM 捐赠⁵给 ASF。\n\n这些捐赠背后的动机各不相同。在某些情况下，原始软件开发人员认为该项目作为商业企业不太可能成功。与其进一步投资，原始开发者会将项目捐赠给开源社区，获得开发成本的税收减免，并收获一些商誉。⁶\n\
  \n捐赠也可能是由战略方向的改变所驱动的。例如，当 Pivotal 将其商业模式从软件开发转向服务交付时，它将其大部分软件资产捐赠给了开源社区。在此转变之前的两年里，该公司从服务收入中获得的收益远高于软件许可收入。\n\
  \n当收购公司认定所收购的软件不属于其核心业务时，企业收购也可能触发软件捐赠。Twitter 在 2011 年收购 Backtype 时获得了 `Storm`\
  \ 软件资产；此后不久，该公司就将该软件捐赠给了开源社区。\n\n就学术软件项目而言，大学很少有意愿或基础设施来管理其核心使命之外的软件项目。加州大学伯克利分校\
  \ AMPLab 的研究人员将 `Spark` 作为一个研究项目进行开发；大学持有软件版权，但将其捐赠给了 ASF。\n\n公司决定捐赠软件项目可能会或可能不会传递有关该项目潜在价值的信息。Apache\
  \ `Hive`，一种用于 `Hadoop` 数据仓库的软件，是一个非常成功的项目。Facebook 开发了原始软件并于 2008 年将其捐赠⁷给 ASF；自那以后，许多其他贡献者对其进行了增强。Hortonworks\
  \ 投资了 `Stinger` 项目来改进该软件，该软件被广泛使用并包含在每个商业 `Hadoop` 发行版中。\n\n`Hadoop` 是一个用于分布式计算和存储的开源框架。我们将在第四章讨论\
  \ `Hadoop` 及其生态系统。\n\n另一方面，已捐赠死亡项目的骨架遍布开源世界。例如，Apache `SAMOA`，一个由 Yahoo 于 2013 年捐赠⁸给\
  \ ASF 的流处理框架，至今仍处于孵化器状态，其整个生命周期内仅有七位贡献者。\n\n## 开源商业模式\n\n在专有许可模式下，软件开发者投入时间和金钱开发软件，期望未来的软件许可费收入能收回投资并带来利润。一旦开发完成，向新客户交付一份软件副本的边际成本极低；因此，成功的软件产品能带来非凡的投资回报。\n\
  \n版权法授予开发者复制软件的专有权；因此，开发者在该产品上拥有经济垄断权。开发者试图通过将产品定位为能为客户带来独特、无可替代的价值来最大化这些权利的价值。这种差异化可以通过软件特性、文档、技术支持、培训，或者通过品牌和营销来实现。\n\
  \n客户对软件的初始选择发生在竞争市场中。虽然开发者试图使软件独一无二，但客户通常有多个选项可供选择，并可以争取最优惠的价格。\n\n然而，企业软件是复杂的，实施起来具有挑战性，并且可能需要大量的定制化；因此，选择标准化于某一专有软件产品的组织面临供应商锁定的风险，即由于高昂的转换成本，客户缺乏议价能力。\n\
  \n永久许可，即开发者授予客户永久使用该软件的权利，是对锁定问题的一种回应。在永久许可下，客户在最初选择软件（此时客户拥有最大的议价能力）时向开发者支付一次性费用；作为回报，开发者授予“永久”使用该软件的许可。\n\
  \n永久许可存在两个问题。首先，高昂的初始成本导致评估和购买周期非常长，并相应导致采用率低。第二个问题涉及持续的软件开发和维护。很少有软件产品在开发完成后能长期保持领先水平。客户期望软件能够持续改进；这需要与软件开发者建立持续的合作关系。永久许可非但没有使开发者和用户的利益一致，反而创造了一种激励，使软件供应商在产品售出后忽视客户需求。\n\
  \n除了采用速度较慢之外，专有软件许可还造成了另外三个抑制创新的问题。\n\n首先，需要许可证密钥和其他必要机制，通过防止未经授权（例如，未授权）的使用来保护开发者在软件中的经济利益。这些不仅让用户感到烦恼，还可能使软件难以集成到企业中。\n\
  \n第二个问题是以编译形式分发软件的必要性，这样用户就无法检查源代码。这在分析领域是一个关键限制，用户依赖开发者来准确实现算法，而微小的编码错误可能产生虚假结果。\n\
  \n第三，专有许可关系使开发者和用户处于一种保持距离甚至对立的关系中。如果用户被软件锁定且转换成本高昂，开发者几乎没有动力去添加所请求的功能。当开发者设定增强功能的优先级时，尚未被锁定的潜在客户比现有客户拥有更大的影响力。\n\
  \n开源软件最显著的特点是免除了软件许可费。虽然这对用户来说是一个明显的好处，但它也引出了一个显而易见的问题：如果没有可能从许可费中获得收入，为什么还会有人一开始就创建软件呢？\n\
  \n\n\n### 开源软件的动机与商业模式\n\n#### 动机分析\n\n动机是多元的。在某些情况下，利他主义和政治因素显然是推动力。软件开发人员可能受到使命感或创造更美好世界的愿望所激励。至少，对开源项目的部分贡献正是出于这种动机。\n\
  \n另一种情况是，开发者可能相信，如果软件项目成功并获得广泛采纳，将会带来通过定制化、服务、培训等产生收入的辅助机会。我们将在本章后面讨论这些方法。\n\n由于没有许可费用，试用、采纳和使用的障碍不复存在。开源软件的潜在用户无需经历漫长且充满对抗性的谈判——在这种谈判中，他们往往缺乏为自己争取最佳利益所需的信息。相反，潜在用户只需检查软件并进行试用。如果他们担心确保内部计算的正确性，只需检查代码即可。\n\
  \n与商业许可软件相比，开源软件拥有更高的采纳率和使用率，因此开源开发者能够受益于快速且丰富的用户反馈。此外，由于用户可以将增强功能回馈给项目，开源软件拥有潜在规模更大的贡献者群体。综合这两个因素，开源软件项目的发展速度通常远超专有软件项目。\n\
  \n#### 为何选择开源语言\n\n出于多种原因，开源语言是定制开发的最佳选择。首先，开放且可自由获取的源代码使企业能够轻松地将分析应用程序与其他生产应用程序集成。其次，开源软件的商业模式确保企业能够充分实现其定制开发投资所创造的价值。\n\
  \n大多数商业分析软件包都包含专有编程语言，例如`SAS`编程语言（`SPL`）。虽然法院已宣布`SAS`编程语言属于公共领域，但使用`SPL`编写的代码需要商业运行时编译器才能执行，用户必须向`SAS`或第三方获得许可。这使得它成为开发者的糟糕选择，并且缺乏开源语言的颠覆性潜力。\n\
  \n#### 社区开源模型\n\n在社区开发模型下，项目拥有广泛的贡献者基础，他们独立工作，几乎不受中央权威机构的指导。许多用户同时也是贡献者。项目本身设有管理代码提交的标准，以及限制恶意行为者提交恶意代码的测试协议。\n\
  \n社区项目通常选择两种组织模型之一：\n\n- 在自上而下模型下，项目随每个版本分发源代码，但只有核心开发团队可以在版本之间访问和修改代码。\n- 在自下而上模型下，所有开发者随时都可以访问源代码。\n\
  \n在折衷模型下，项目分为两个层级：一个核心平台和运行在该核心平台上的软件包。项目治理机构对核心平台的提交进行严格控制，但对软件包提交的直接控制极少。核心团队负责核心平台的增强，而软件包开发者则对其发布的软件包负责。\n\
  \n商业企业通常在社区开源项目的周边运营，提供支持、咨询、教育和培训。这些企业可能得到项目治理机构的认可，也可能没有。它们对项目的总体方向影响相对较小。\n\n\
  经验丰富的软件工程师和开源理论家`Eric S. Raymond`在《大教堂与集市》中倡导自下而上模型，认为更多的目光关注软件能加速开发、提高质量并加快问题解决速度。另一方面，缺乏强有力的中央权威机构来建立设计标准（例如）会导致解决类似问题的方法复杂且不一致，使得最终产品难以导航和使用。\n\
  \n分析领域社区开源的最佳例子是`R`项目和`Python`，我们将在本章后面深入讨论。虽然`Apache Hadoop`是一个社区开源项目，但大多数组织使用基于`Apache\
  \ Hadoop`的商业支持产品，这些产品与开源核心有很大不同。\n\n#### 商业与混合开源模型\n\n在纯商业开源模型下，商业企业寻求在开源软件许可模型的约束内定义可持续的商业模式。该企业控制项目治理，并且大多数贡献者是该企业的员工。商业开源模型有两种不同的类型：开源核心模型和服务模型。\n\
  \n采用开源核心模型的公司提供多个软件版本，其中至少一个版本在开源许可下可用，至少一个版本在商业许可下可用。通常，商业版本具有开源版本中没有的额外功能。这种模式使潜在客户可以免费且不受限制地评估基础软件，并为选择功能更丰富版本的用户提供收入来源。\n\
  \n这种模式的例子包括：\n\n- `Talend`将`Talend Open Studio`作为开源软件提供，并提供其他几个商业许可的软件产品。\n- `Oracle`提供开源的`Oracle\
  \ R Distribution`和商业许可的`Oracle R Enterprise`，后者包含额外功能。\n\n采用服务模型的商业企业仅以开源许可分发软件，并向用户销售服务。服务可能包括云服务、技术支持订阅、培训以及实施或定制开发的专业咨询服务。\n\
  \n这种模式的例子包括：\n\n- `H2O.ai`分发`H2O`（一个开源机器学习软件包），并向用户群销售订阅服务。\n- `Google`分发`TensorFlow`（一个开源深度学习软件包），并在其云平台上销售该软件的托管服务。\n\
  \n在混合商业模式下，商业企业不控制项目治理，但通过在项目治理机构中担任角色来施加强大影响。商业企业的员工对开源项目做出重要贡献，但其他人也同样如此。\n\n\
  这方面最好的例子是`Apache`项目，其中`Apache`软件基金会的治理模型禁止任何商业企业进行独家控制：\n\n- `Databricks`主导`Apache\
  \ Spark`的开发，并提供云服务、培训、认证和会议。\n- `Hortonworks`对`Apache Hadoop`项目的方向施加强大影响，并提供自己的开源`Hadoop`发行版以及服务与培训。\n\
  \n总的来说，商业企业在开源软件中扮演着关键角色，它们激发对项目的兴趣，并向企业提供推动价值所需的必要服务。然而，也有许多广泛使用的开源项目没有商业生态系统的例子。\n\
  \n\n\n## 开源分析\n\n开源商业模式在新兴分析技术中非常普遍。因此，我们在其他章节中涵盖了特定的开源项目：\n\n*   第四章：`Apache Hadoop`及其生态系统。\n\
  *   第五章：`Apache Spark`及其他内存平台。\n*   第六章：流式分析，包括`Apache Flink`、`Apache Storm`及其他软件包。\n\
  *   第八章：机器学习与深度学习，包括`CNTK`、`DL4J`、`H2O`、`TensorFlow`、`Theano`及其他软件包。\n\n在关系型数据库中，开源软件`MySQL`和`PostgreSQL`在\
  \ 2016 年 4 月的 DB-Engines 排名中分别位列第二和第五。开源 NoSQL 数据库`MongoDB`、`Cassandra`和`Redis`则位列第四、第八和第九。总体而言，在最受欢迎的十大数据库中，开源数据库占据了其中五个席位。\n\
  \n`DB-Engines`通过追踪在 Google 和 Bing 上的提及次数、Google Trends 中的搜索热度、Stack Overflow 和 DBA\
  \ Stack Exchange 上的技术讨论频率、Indeed 和 Simply Hired 上的职位数量、LinkedIn 个人资料中的提及次数以及 Twitter\
  \ 上的提及次数来衡量数据库的受欢迎程度。\n\n2013 年 1 月，开源数据库在`DB-Engines`衡量的总人气中占比 36%；到 2016 年 4 月，这一比例已升至\
  \ 45%。在宽列存储、图数据库、文档存储、时序数据库、键值数据存储和搜索引擎等特定数据库类别中，开源占据了主导地位。\n\n三个商业驱动的开源项目提供了集成的商业智能平台：`Jaspersoft`、`Pentaho`和`Talend`。这三个项目都采用开放核心模式运营，并提供包含额外功能的商业许可版本。\n\
  \n*   `Jaspersoft`社区版包含用于 ETL 和报表的工具（包括移动设备 BI 和 OLAP）。\n*   `Pentaho`社区版提供商业分析、数据集成、报表、聚合、模式定义和元数据管理工具。\n\
  *   `Talend`开放工作室包含可扩展的 ETL、数据质量和主数据管理功能。\n\n商业智能与报表工具项目（即`BIRT`）是一个社区开源项目，也是 Eclipse\
  \ 基金会的一个顶级项目。`BIRT`的功能包括报表设计器和报表执行引擎。OpenText 的子公司 Actuate 提供技术支持和咨询，但`BIRT`是独立管理的。\n\
  \n有两个商业驱动的开源项目用于高级分析：`RapidMiner`和`KNIME`。这两个项目都起源于欧洲的学术项目，并为业务用户提供了可视化界面。`RapidMiner`对其最新版本的软件进行商业许可，并以免费开源许可方式分发先前版本。`KNIME`在开源许可下分发其基础平台，并以商业许可方式提供扩展功能。我们将在第九章自助分析中分别讨论这些项目。\n\
  \n在本章中，我们涵盖了三种分析编程语言：`R`、`Python`和`Scala`。`R`是统计学家和分析师专门为分析而开发的工具；`Python`是一种具有丰富分析能力的通用编程语言。`Scala`则是一种优雅的编程工具，以其强大的\
  \ Spark API 而闻名。\n\n尽管`R`的分析功能目前仍超越`Python`，但`Python`正在迅速追赶。目前，在分析领域使用`R`的人数多于`Python`，但这种局面也在迅速改变。\n\
  \n许可协议是`R`和`Python`之间的一个关键区别。`R`的 GPL 许可对商业开发者来说是一颗“毒丸”，因为基于`R`开发的产品只能作为开源软件重新分发。这对于`Python`来说不是问题，因为`Python`的许可协议是宽松的。与`R`封闭的治理模式相比，`Python`的治理模式也更加开放和广泛。\n\
  \n对于以获取洞察为首要目标的分析师来说，`R`广泛的分析工具和可视化能力使其成为首选。另一方面，对于以构建嵌入分析功能的应用程序为目标的分析开发者来说，`Python`的通用功能使其成为最佳选择。\n\
  \n尽管具有软件工程背景的开发者和数据科学家对`Scala`的兴趣日益增长，但其原生分析能力仍然有限。我们在本章中包含`Scala`主要是因为它是指挥 Spark\
  \ 分布式分析平台的主要接口之一。\n\n\n\n### R 项目\n\nR 项目（简称“R”）是一个流行的免费开源语言，专为统计分析、图形绘制和高级分析而设计。它可在多种平台上运行，并支持丰富的功能。尽管\
  \ R 存在一些限制，但它被研究人员和统计学家广泛使用，以至于许多人称其为高级分析领域的通用语言。\n\n`Ross Ihaka` 和 `Robert Gentleman`\
  \ 在 1993 年使用 S 编程语言的语法编写了 R 的原始代码库。1995 年，他们根据自由软件基金会的 GNU 许可证发布了源代码¹³。\n\n随着贡献者将现有软件包移植到\
  \ R 并从头开发新功能，用户的兴趣稳步增长。`Ihaka` 和 `Gentleman` 于 1997 年成立了 R 核心开发团队，以领导核心软件环境的持续改进。R\
  \ 核心开发团队负责开发 R 核心软件，而个人开发者则贡献具有特定功能的软件包。代码库是多样化的；截至 2.13.1 版本，22% 的代码是 R 本身，52%\
  \ 是 C 语言，26% 是 Fortran。¹⁴\n\n2002 年，`Ihaka` 和 `Gentleman` 将该软件捐赠给了位于奥地利维也纳的非营利性公益组织——R\
  \ 统计计算基金会。该基金会持有并管理版权，并作为项目的官方发言机构。基金会的管理权归属一个自我遴选的正会员团体，他们因对项目的（非金钱）贡献而被选出；截至目前，有\
  \ 29 位正会员来自美国、加拿大、英国、挪威、丹麦、德国、法国、瑞士、意大利、奥地利、印度、新西兰和澳大利亚。¹⁵\n\nR 基金会在 GNU 许可证下分发\
  \ R。该许可证使得商业软件开发者难以向 R 增加价值，因为任何修改或增强都会成为免费分发的一部分。分发使用 R 构建的商业应用程序的开发者必须分发增强后的源代码。此要求不适用于仅为内部使用而使用\
  \ R 构建应用程序的企业。\n\nR 支持从头到尾的分析项目，包括：\n\n*   数据导入和导出，包括与大多数商业和开源数据库的接口\n*   自定义编程，包括条件语句、循环和递归操作\n\
  *   数据管理和存储\n*   数组和矩阵操作\n*   探索性分析、发现和统计\n*   图形和可视化\n*   统计建模和机器学习\n*   内容分析\n\
  \nR 发行版包含 14 个“基础”软件包，支持基本的统计、图形和有用的实用程序。用户可以有选择地从`CRAN`或其他存档中添加软件包。由于广泛的开发者社区和较低的贡献门槛，R\
  \ 提供的功能广度远远超过商业分析软件。\n\n截至 2016 年 4 月，全球所有主要存储库中共有 11,531 个 R 软件包，其中 8,239 个位于综合\
  \ R 存档网络（`CRAN`），这是使用最广泛的 R 存档¹⁶。虽然这些统计数据展示了 R 所包含功能的惊人广度，但它们作为实用性度量却具有误导性。由于软件包开发者彼此独立工作，功能上存在大量重叠；在一个存储库中搜索支持“线性回归”的软件包会返回\
  \ 50 多个结果。软件包的质量、文档和开发者支持也不均衡；因此，普通用户倾向于依赖有限数量的软件包。\n\n开源 R 完全在内存中运行。由于缺乏内存外操作能力，如果用户尝试处理大于内存的数据集，R\
  \ 将会失败。\n\n`plyr` 软件包为用户提供了一个框架，用于分割大型数据集、对每个数据子集应用函数，并组合结果。`dplyr` 软件包扩展了这个框架，并提供了一套高效的数据处理工具，以及连接到流行开源数据库（如\
  \ `PostgreSQL`、`MySQL` 和 `Google BigQuery`）的接口。\n\n在 R 中还有其他几个用于处理大数据的开源软件包。这些包括：\n\
  \n*   R 中的大数据编程（`pbdR`），一套旨在支持多种高性能计算方法的软件包\n*   简单工作站网络（`snow`）支持在使用 R 的工作站网络上进行并行计算\n\
  *   `Rdsm` 为 R 实现了一个线程编程环境，无论是在集群机器上还是在单个多核机器上\n\n通常，这些软件包最适合于易并行任务。然而，预测分析中的许多任务并非易并行；对于这些任务，分布式平台是更好的工具。我们将在本章后面讨论这些。\n\
  \n大多数大数据平台都支持 R 接口，以便 R 用户可以向数据平台传递命令。这些接口并不会“让 R 在数据库中运行”；它们会将 R 命令转换为特定于平台的命令，然后将结果作为\
  \ R 对象返回给用户。这些接口的质量、实用性和支持水平因平台而异；大多数供应商不提供对 R 代码本身的支持或保证。\n\n微软提供增强的开源 R 发行版和具有附加功能的商业许可版本，特别是分析超出计算机主内存大小数据的能力。微软为实施\
  \ R 的组织提供技术支持、培训和咨询服务。\n\n甲骨文提供免费的增强型 R 发行版（`Oracle R Distribution`）。它还将增强版（`Oracle\
  \ R Enterprise`）与 `Oracle Data Mining` 捆绑在 `Oracle Advanced Analytics Option` 中，用于\
  \ `Oracle Big Data Appliance`。甲骨文为那些获得了 `Advanced Analytics Option` 或 `Big Data\
  \ Appliance` 许可的客户提供对 `Oracle R Enterprise` 的技术支持。\n\nTibco 提供 `Tibco Enterprise\
  \ Runtime for R`（`TERR`），这是一个由专业程序员从头开始编写的商业 R 实现。因此，它通常速度更快，内存管理更好。特别是，其优化以其他语言风格编写的循环的能力比开源\
  \ R 更快。\n\nR 核心发行版包含一个用于交互式使用和脚本开发的极简界面。大多数用户更喜欢使用集成开发环境（IDE）；其中最流行的是 `RStudio`。`RStudio`\
  \ 提供其软件的开源版本和商业许可版本；商业版本包括用于企业部署的附加功能。\n\n很难准确说出有多少人使用 R。2009 年，《纽约时报》报道¹⁷用户基数为\
  \ 25 万；其他人估计用户基数达数百万。¹⁸\n\n分析师的调查通常显示 R 是当今最流行的分析工具之一，但这些调查的抽样方法使得难以将其推广到总体人群。\n\
  \n数据挖掘网站 `KDnuggets.com` 定期对其读者进行投票；每年，它都会要求读者指出在过去 12 个月中“用于实际项目”的分析软件工具。在 2016\
  \ 年的投票中，49% 的受访者表示他们使用 R 的频率高于其他任何工具。\n\n`Rexer Analytics` 对在职数据挖掘人员进行年度调查。在 2013\
  \ 年调查的分析师中，70% 表示他们使用 R，高于 2011 年的 48%。\n\n`O'Reilly Media` 对数据科学家的追踪调查收集了在职数据科学家的薪资和工具使用信息。在截至\
  \ 2015 年 9 月的 12 个月中，52% 的受访者报告使用 R，排名第三，仅次于 `SQL` 和 `Microsoft Excel`。\n\n\n  \n\
  表 3-1 汇总了三次调查的结果。  \n\n**表 3-1.** 分析编程工具使用情况：`R`  \n\n| | | | `R` 的响应结果 |  \n| ---\
  \ | --- | --- | --- |  \n| 调查 | 日期 | 问题 | 使用百分比 | 排名 |  \n| --- | --- | --- | ---\
  \ | --- |  \n| KDnuggets ¹⁹ | 2016 年 6 月 | 过去 12 个月中，你在实际项目中使用过哪些分析、大数据、数据挖掘或数据科学软件？\
  \ | 49% | 1 |  \n| Rexer ²⁰ | 2013 年第一季度 | 过去一年中，你使用了哪些（分析）工具？（总计） | 70% | 1 | \
  \ \n| O’Reilly Media ²¹ | 2015 年 9 月 | 你使用哪些编程语言（用于数据科学）？ | 52% | 3 |  \n\nTIOBE\
  \ 编程社区指数是衡量编程语言相对流行度的指标，它综合了面向分析的语言和通用语言。该指数基于心智占有率，通过搜索结果等指标进行衡量。截至 2015 年 5 月，`R`\
  \ 在 100 种排名语言中位列第 12²²，较 2014 年 5 月的第 33 位有所上升。然而，`R` 是与分析相关的排名第一的特定应用语言（此处可能包含\
  \ SAS 的排名）。（在排名前十之后，该指数的排名波动较大。）  \n\n`R` 的主要优势在于其功能性、可扩展性和低拥有成本。免费分发消除了进入门槛，使用户能够快速上手。\
  \  \n\n`R` 的主要劣势在于其类似市集的特性，这在新手看来表现为大量相互冲突且冗余的功能、松散的标准以及参差不齐的质量。虽然有经验的用户往往乐于享受 `R`\
  \ 的多样性和社区开发，但习惯商业产品的用户可能会觉得它缺乏吸引力。  \n\n## Python  \n\nPython 是一种脚本语言，其语法使程序员能够编写高效简洁的代码。虽然它在分析功能上不如\
  \ `R` 丰富，但 Python 在科学计算方面的能力正在迅速扩展。  \n\n1989 年，吉多·范罗苏姆在荷兰国家数学与计算机科学研究中心（CWI）工作期间，开始将\
  \ Python 作为业余项目进行开发。²³ 在 CWI 内部使用后，范罗苏姆于 1991 年在 `alt.sources` 发布了 0.9.0 版本。随着用户和贡献者群体的不断壮大，代码库稳步扩展²⁴，分别于\
  \ 1994 年达到 1.0 版本，2000 年达到 2.0 版本，2008 年达到 3.0 版本。  \n\n1995 年，麻省理工学院的吉姆·胡格宁基于 `matrix-sig`\
  \ 兴趣小组的理念，开发了 Python 扩展模块 `Numeric`。在随后的几年里，来自科学和工程界的一群 Python 用户为 `Numeric` 做出了贡献，并开发了其他用于科学计算的包。2003\
  \ 年，特拉维斯·奥利芬特、埃里克·琼斯和皮亚鲁·彼得森发布了 `SciPy` 包，该包提供了运行在 `Numeric` 之上的标准数值运算。大约在同一时间，费尔南多·佩雷斯发布了\
  \ `IPython` 的第一个版本，这是一个旨在服务科学界的交互式开发环境。²⁵  \n\nPython 软件基金会（PSF）成立于 2001 年，拥有 Python\
  \ 2.1 及以上版本的知识产权，并根据 Python 软件基金会许可证（PSFL）发布开源许可证。PSFL 已获得开放源代码促进会和自由软件基金会的批准；它允许开发者修改代码并制作衍生作品，而无需公开源代码。这使得\
  \ Python 成为一个具有吸引力的开发平台。  \n\nPSF 负责生产用 C 语言编写的核心 Python 发行版（`CPython`），并促进 Python\
  \ 用户和贡献者社区的发展。基金会董事会由 11 名董事组成，由社区投票成员每年选举产生。  \n\n作为一种通用语言，Python 原生支持分析语言所需的核心功能，例如数据导入和程序控制。对于高级分析，两个包（`NumPy`\
  \ 和 `SciPy`）提供了基础函数。`NumPy` 和 `SciPy` 共同提供了交互式 shell、数据处理工具、多维数组、稀疏矩阵处理、统计函数、线性代数、优化、空间分析以及与\
  \ `R` 的接口。  \n\n在数据操作和分析方面，许多 Python 用户使用 `pandas`，这是一个设计用于处理结构化数据的包。`Pandas` 支持类似\
  \ SQL 的操作，例如连接、合并、分组、插入和删除。它还处理更复杂的操作，例如缺失值处理和时间序列功能。  \n\n用于高级分析的最丰富且最广泛使用的 Python\
  \ 包是 `scikit-learn`。该包包含用于分类、回归和聚类的算法，包括逻辑回归、朴素贝叶斯分类器、支持向量机、集成模型（梯度提升和随机森林）以及 K\
  \ 均值。该包还包括用于降维、模型选择和预处理的工具。  \n\n`Pybrain` 专为入门级 Python 用户设计。它支持有监督和无监督学习、强化学习以及黑箱优化等多种技术。该包侧重于网络架构。\
  \  \n\n`Pattern` 明确设计用于支持网络挖掘。该包包括用于网络服务、网络爬虫和域名解析、自然语言处理、机器学习和网络分析的工具。  \n\n许多\
  \ Python 包支持高度专业化和高级的分析。举例如下：  \n\n\n\n*   `NuPic` 包支持层次时间记忆（HTM）算法，这是贝叶斯技术的一种扩展，可用于异常检测和流式分析。\n\
  *   `Nilearn` 包为神经影像数据提供多变量分析。\n*   `Hebel` 支持通过`CUDA`（使用`PyCUDA`）进行 GPU 加速的深度学习神经网络。\n\
  \nPython 功能的发展速度惊人。2014 年 5 月底，Python 包索引（`PyPI`）中仅有超过 44,000 个包。一年后的 2015 年 5 月底，列出的包已超过\
  \ 60,700 个。其中，有 4,007 个被标记为科学/工程类。\n\n与 R 语言一样，Python 也受内存限制，无法处理大于内存的数据集。与 R 语言一样，专家级程序员可以绕过这一限制，但这会抵消使用高级语言的部分初衷。\n\
  \n`IPython.parallel` 提供了一种用于并行和分布式计算的架构，使用户能够：\n\n*   使用`IPython`可视化大型分布式数据集\n*\
  \   对易于并行化的任务（如模型评分）进行并行化执行\n*   编写自定义代码以并行化并非易于并行化的算法\n\n可扩展的机器学习平台（如 Apache Spark\
  \ 和 H2O）消除了在后一种情况下编写自定义代码的需要。这些平台支持 Python API。\n\n大多数大规模并行处理（MPP）数据库将 Python 脚本作为表函数运行。IBM\
  \ PureData、Pivotal Greenplum 和 Teradata Aster 支持此功能；Teradata 数据库不支持。\n\nContinuum\
  \ Analytics 发布了 Anaconda，这是一个免费的 Python 发行版，包含多项针对科学计算和预测分析的增强功能。这些功能包括：\n\n*  \
  \ 为科学、数学、工程和数据分析预选的 Python 包\n*   一个包含每个包最新版本的在线仓库\n*   一组用于 Microsoft Excel 的插件\n\
  \nAnaconda 的商业服务器版本包括技术支持、带有图形用户界面的私有安全包仓库、自定义安装程序和镜像，以及全面的许可。\n\nPython 用户可用的集成开发环境（IDE）种类繁多。`IPython`项目（`ipython.org`）提供了一种用于交互式计算的架构，包括交互式\
  \ shell、基于浏览器的笔记本、可视化支持、可嵌入的 Python 解释器以及一个用于并行计算的框架。\n\nRodeo 是最近推出的一款专为数据科学设计的\
  \ IDE。\n\nPython 在 TIOBE 编程社区指数中一直位列最受欢迎的编程语言之一。然而，虽然这个指数反映了 Python 的总体流行度，但它对 Python\
  \ 作为分析语言的流行度却说明甚少。许多 Python 用户并不将其用于分析。\n\n在本章前面描述的三项分析师调查（见表 3-2）中，Python 的排名低于\
  \ R 语言，但高于除 SQL 之外的所有其他语言。分析师对 Python 的使用正在快速增长，KDnuggets 的年度调查也显示了这一点；在最近一次投票中，报告的\
  \ Python 使用率从 2014 年的 20%飙升至 2016 年的 46%。\n\n表 3-2.\n\n分析编程工具使用情况：Python\n\n| |\
  \ | | Python 的响应 |\n| --- | --- | --- | --- |\n| 调查 | 日期 | 问题 | 使用百分比 | 排名 |\n|\
  \ --- | --- | --- | --- | --- |\n| KDnuggets | 2016 年 6 月 | 在过去 12 个月中，您在真实项目中使用过哪些分析、大数据、数据挖掘或数据科学软件？\
  \ | 46% | 2 |\n| Rexer ²⁶ | 2013 年第一季度 | 您在过去一年中使用了哪些（分析）工具？（总计） | 24% | 3 |\n|\
  \ O’Reilly Media ²⁷ | 2015 年 9 月 | 您使用哪些编程语言（进行数据科学）？ | 51% | 4 |\n\n作为一种具备生产能力的脚本语言，Python\
  \ 是分析应用程序的绝佳工具。Python 支持强大的测试框架，使得代码能够直接从开发阶段无缝过渡到部署阶段。由于 Python 在开发者中被广泛使用，数据科学家使用它可以减少或消除有时会阻碍预测模型部署的文化障碍。\n\
  \nPython 宽松的开源许可是其另一个关键优势。开发者可以无需许可地使用、销售或分发基于 Python 的应用程序。\n\n与 R 语言和最终用户分析工具相比，Python\
  \ 的可视化更困难，且吸引力较低。虽然 Python 的统计和机器学习能力正在增长，但仍不及 R 语言。由于其作为通用脚本语言的历史，Python 社区对背景是统计学和数据挖掘而非软件工程的分析师和潜在用户吸引力较小。\n\
  \n### Scala\n\n为应对 Java 编程语言的局限性，Martin Odersky 在瑞士洛桑联邦理工学院（EPFL）工作期间开始了 Scala 的研究。²⁸\
  \ 2004 年，Scala 团队向公众发布了可在 Java 和 .NET 平台上运行的软件。Odersky 于 2011 年创办了 Typesafe 公司，提供商业支持与培训；2012\
  \ 年，该公司从 Greylock Partners 和其他风险投资公司筹集了 1400 万美元。²⁹\n\nEPFL 持有 2011 年之前所有 Scala\
  \ 开发的版权；Typesafe 和 EPFL 共同持有 2011 年及之后增强功能的版权。最终用户许可证采用开源修改版 BSD 许可。\n\nScala 的原生分析能力尚不成熟。`ScalaNLP`\
  \ 是科学计算和机器学习中最广泛使用的 Scala 包。该包包含几个相关的库：\n\n*   `Breeze` 支持数值计算、线性代数、优化和信号处理\n* \
  \  `Breeze-viz` 用于可视化\n*   `Epic` 是一个自然语言处理组件，具有八种语言的解析能力：英语、巴斯克语、法语、德语、匈牙利语、韩语、波兰语和瑞典语\n\
  *   `Junto` 支持半监督学习，包括标签传播、吸附和改良吸附\n*   `Nak` 是一个机器学习库，支持 k-means 聚类、逻辑回归、支持向量机、朴素贝叶斯和神经网络\n\
  *   `Puck` 支持在 GPU 芯片上进行自然语言处理\n\nScala 的其他包包括：\n\n*   `Bioscala` 支持生物信息学，包括 DNA\
  \ 和 RNA 测序\n*   `Chalk` 是一个用于自然语言处理的库\n*   `Figaro` 是一个用于开发概率模型的包\n\n使用 Scala 的数据科学家可以处理\
  \ Apache Spark；对 Spark 的兴趣正推动着对 Scala 的兴趣。\n\n截至 2016 年 5 月，Scala 在 TIOBE 编程社区指数中排名第\
  \ 32 位，远低于 R 语言和 Python。在本章前面引用的 2016 年 KDnuggets 投票中，6%的受访者表示他们在过去一年中使用过 Scala。\n\
  \n作为一种分析编程语言，Scala 的主要优势在于其 Spark API，该 API 比其 Python API 更强大。Scala 的主要弱点是缺乏成熟的原生分析能力。\n\
  \n\n\n## 开源的力量：颠覆传统\n\n开源商业模式通过两种方式颠覆了既有的软件市场。\n\n首先，由于没有软件许可费用，开源软件在试用阶段不存在任何初始门槛。商业软件供应商倾向于开发日益复杂且功能丰富的产品，以证明其许可费用的合理性，而开源软件则以显著更低的总成本提供基础价值。这是一个典型的“低端颠覆”案例：现有产品的功能远超许多潜在客户的实际需求。\n\
  \n例如，大多数商业统计软件包都包含一系列令人眼花缭乱的统计和机器学习技术，其价格从几百到几千美元不等。但如果从业者只需要使用线性回归，开源的 `R` 语言就提供了一个绝佳的替代方案。\n\
  \n其次，由于开源软件开发节奏快且与用户互动密切，开发者往往首先在开源软件中引入最具创新性的技术。商业软件供应商通常会根据短期收入影响来设定功能增强的优先级；而针对小众市场的增强功能，或需要一段时间才能成熟的新方法，其优先级往往较低。相比之下，开源软件对创新者不设任何门槛。\n\
  \n以随机森林为例，这是一种当今非常流行且被广泛使用的机器学习技术。Leo Breiman 详细阐述该技术的原始论文首次发表于 2001 年³⁰。此后不久，在\
  \ 2002 年 4 月，开发者就将 Breiman 的 Fortran 代码移植到 R 语言，并发布了 `randomForest` 软件包。而这距离业界领先的商业统计与机器学习软件供应商\
  \ `SAS` 在其任何产品中提供该技术，又过去了整整 10 年。\n\n开源软件开发固有的创新特性，使其能够为那些行业巨头未能有效解决的问题提供方案。在下一章中，我们将讨论开源的\
  \ Hadoop 及其生态系统，以及它是如何永久性地颠覆了数据仓库行业。\n\n脚注\n\n1[`http://www.blackducksoftware.com/top-20-open-source-licenses`](http://www.blackducksoftware.com/top-20-open-source-licenses)\n\
