- '# 9. 自助分析


  热潮与现实


  大约 15 年前，作者参加了一场由某供应商举办的销售演示会，会上他们极力推销一款自动化预测分析工具。该供应商的价值主张是：“购买我们的软件，你就可以解雇你的 SAS
  程序员了。”


  不幸的是，对于那位销售代表来说，当时在座的每位客户都是 SAS 程序员。


  这个故事凸显了那些相信软件能够实现分析民主化的人面临的一个基本问题：最关心分析、对分析最富热情的人，并不害怕学习`SAS`、`Python`和`R`这类分析编程语言。


  此外，由于他们对自己交付成果的准确性和有效性负有责任，因此他们需要的工具必须能让他们掌控整个过程。这就是为什么分析就业市场上的专家坚称，编写代码的能力是做这份工作*绝对*不可或缺的。¹


  所谓“公民数据科学家”的想法，到此也就止步了。


  三十年来，商业供应商一直宣称他们的分析软件“易于使用”或“自助式”，然而，除了`Microsoft Excel`之外，其他工具的采用率仍然很低。原因有以下几点：


  *   许多管理者对分析工作缺乏需求感或兴趣。

  *   对于确实看重分析的管理者来说，将具体工作委托给他人相对容易。

  *   让软件易于使用是一回事；让数据易于访问和导航则完全是另一回事。经过二十年的数据仓库建设，企业数据对于管理者的问题而言，仍然混乱、不完整或毫无关联。


  与此同时，对分析编程语言的兴趣正在蓬勃发展，数据科学家的就业市场也十分强劲。这是因为严重的分析问题需要严肃认真的人去解决——那些有动力深入挖掘数据的人。


  在本章中，我们将审视自助分析的逻辑——它在哪些场景下合理，在哪些场景下又不合理。我们将描述组织中截然不同的用户角色，并讨论专家在高级分析中的作用。最后，我们将通过调研自助分析领域的六项创新来结束本章。


  ## 自助分析的逻辑


  供应商主导的关于自助分析的讨论，往往存在于一个每个人拥有相同技能和兴趣的魔幻世界中。管理者最好能对其组织中的实际用户角色，以及自助分析适用的用例保持现实的认识。



  ### 用户金字塔


  在大多数组织中，员工的分析技能差异巨大——从几乎毫无技能的一端到世界级专家的另一端。造成这些差异的因素有很多：背景、教育、培训、组织角色以及内在动力。


  在大型组织中，分析用户往往呈“金字塔”结构，如图 9-1 所示。我们将纯粹分析技能最低的用户称为“消费者”，他们目前是规模最大的群体；在大型组织中，这类用户可能有数千人之多。需要指出的是，这里仅指纯粹的分析技能；人们可能在其它领域拥有高超的技能，但在数据分析方面培训有限或兴趣不足。


  ![A367683_1_En_9_Fig1_HTML.jpg](img/A367683_1_En_9_Fig1_HTML.jpg)


  图 9-1. 用户金字塔


  另一方面，分析专家通常人数较少。然而，他们通过分析创造了与之不成比例的巨大价值。


  商业软件供应商倾向于通过“易用”的应用程序瞄准普通用户。普通用户是最大的受众群体，有潜力销售更多“席位”，且对现有工具忠诚度较低。而专业用户和专家用户则往往对现有工具非常忠诚。他们投入了多年时间来培养技能，掌握了所选工具，并且对“易用”工具并不感兴趣。


  ### 价值链中的角色


  关于组织中分析工作的严肃讨论，应首先认识到用户需求各异、不尽相同。这看似显而易见，但人们经常听到供应商将其工具描述为企业的完整解决方案，仿佛所有用户都有着相同的需求。


  用户画像是一种描述某类用户如何与系统交互的模型。当然，每个用户都不同，每个组织也各有差异。在硅谷，有些初创公司的“业务用户”活跃地使用着`SQL`和`Python`；而另一些公司里，“业务用户”却在为
  Microsoft Excel 而挣扎。我们提出这个模型并非为了给人们贴标签，而是将其作为一个框架，帮助管理者理解其所在组织的需求。


  #### 专家


  专家用户精通分析软件和编程语言。他们将 100% 的时间用于分析工作。他们将分析视为职业选择和职业发展路径，并投入了必要的教育和培训。他们的头衔和背景在不同行业以及同行业内各不相同。


  **开发者。** 这些用户接受过关于组织数据和软件的深入培训，其主要角色是开发分析应用程序。除了技术培训，开发人员对组织的数据源有透彻理解，能够编写复杂的`SQL`表达式，并接受过一种或多种编程语言的培训。虽然传统上他们隶属于
  IT 部门，但当业务部门希望控制优先级和任务排队时，他们也可能雇佣自己的开发者。


  **数据科学家。** 数据科学家是主要角色为从复杂数据中产生洞见，并为应用程序开发部署预测模型的个人。他们的背景和培训涵盖编程语言、统计学和机器学习。数据科学家通常具有工程或计算机科学背景，并且偏好使用诸如`Scala`、`Java`或`Python`之类的编程语言。他们往往对开源分析工具有强烈偏好；最优秀的数据科学家会积极为一个或多个开源项目做出贡献，并可能参与数据科学竞赛。


  **分析专家。** 分析专家担任诸如统计学家、生物统计学家、精算师或风险分析师等职位，通常拥有在高级分析领域具有历史渊源的学科背景学位。他们理解统计学和机器学习，并在应用分析领域拥有丰富的工作经验。分析专家倾向于使用类似`SAS`或`R`这样的高级分析编程语言进行工作，相对于带有图形用户界面的软件包，他们更偏爱这些语言。他们的工作成果可能是管理报告、图表和表格，或预测模型规范。


  #### 分析师


  这些用户精通使用终端用户分析软件，例如`Excel`、`SPSS`或`Tableau`。他们在工作中积极使用分析工具，但不会创建生产级应用程序。他们通常认同于某个业务职能部门，如市场或财务，并将分析视为实现该目标的手段。


  **战略分析师。** 战略分析师的主要角色是为高级管理人员执行临时分析；他们可能隶属于某个业务部门，或隶属于一个专门为高管团队提供支持的团队。战略分析师非常了解其组织及行业，并熟悉数据源。他们能够执行简单的`SQL`查询，并且能将`SQL`与其他工具结合使用。他们偏好带有图形用户界面的工具。战略分析师的工作成果侧重于图表、可视化和故事叙述。


  **职能分析师。** 职能分析师的主要角色是承担某项分析工作职能，例如信用分析师或市场分析师。这些角色需要一定的分析技能以及领域知识。职能分析师偏好使用相对易用、带有图形界面的工具。他们可能接受过一些统计学和机器学习的培训。与战略分析师类似，他们也许能够执行简单的`SQL`查询。他们精通
  Microsoft Office，并偏好使用能与 Office 直接集成的工具。职能分析师的工作成果可能是电子表格、报告或演示文稿。


  #### 消费者


  信息消费者的工具相关技能最少，更倾向于信息以易于检索和消化的形式呈现。


  **业务领导者。** 业务领导者对组织的绩效指标非常关注，他们要求这些指标及时、准确，并能发送到移动设备或浏览器。他们可能对有限的向下钻取功能感兴趣，但很少愿意花费大量时间搜索信息。


  **信息用户。** 信息用户是需要信息来执行特定工作角色的员工，例如处理客户服务电话、审核保险索赔、执行律师助理任务等。他们在业务流程中的角色决定了其信息需求。虽然信息用户可能不涉及数学计算，但他们关心所用系统的整体效用、性能和可靠性。




  ### 专家的角色


  软件供应商总是吹嘘其产品“易于使用”。这并非新鲜事。在 20 世纪 80 年代和 90 年代，分析软件供应商 SPSS 将其基于 Windows 的界面定位为
  SAS 的简易替代品，而 SAS 直到 2004 年推出 SAS Enterprise Guide 才提供类似的用户界面。在 90 年代和 21 世纪初，Cognos
  声称其产品针对的是业务用户，以区别于 Business Objects 和 MicroStrategy 等更复杂的产品。


  尽管供应商的说法与此相反，但自助式分析仍是一个难以实现的目标。大型企业拥有成千上万的 BI 工具用户，但绝大多数是“消费者”，他们使用的是由专家开发的报告、视图或仪表板中的信息。大多数组织仍保留着专家团队，其唯一职责就是开发供他人使用的报告或
  OLAP 多维数据集。


  BI 专家之所以长期存在，主要有两个原因：


  -   **一致性**。衡量绩效仍然是商业智能的主要用例。大多数组织希望跨职能进行一致的衡量，而不希望各团队自行衡量或“操纵”指标。

  -   **数据集成**。很少有组织能实现理论家所构想的数仓“理想国”。虽然 BI 工具拥有设计精良的用户端“界面”，但集成数据源的“后端”却和源数据本身一样混乱复杂。


  `Hadoop` 使用的普及加剧了 BI 的数据集成问题，至少暂时如此。大多数传统 BI 平台无法与 `Hadoop 1.0` 配合使用。像 Datameer
  和 Pentaho 这样的初创公司试图填补这一空白，但收效甚微；而对于希望标准化单一 BI 平台的企业来说，仅用于 `Hadoop` 的专用工具并不令人满意。


  即使是相对熟练的用户，`Hadoop` 也会带来问题。习惯于在数据仓库设备上使用 `SQL` 进行交互式分析的分析师，若要在 `Hadoop` 上使用 `Hive`
  或 `Pig` 进行同样的分析将会举步维艰。正如第四、五章所述，`Hadoop` 的交互式查询工具在过去几年中已大有改进，但早期投资于 `Hadoop` 的公司也为此增加了具备必要技能的新专家层。


  预测分析仍然是专家的领域，尽管易用的工具已经面世多年。在诸如欺诈检测和风险管理等战略性及“硬性资金”应用中尤其如此，在这些领域，预测模型的质量可能意味着业务成功与失败的差别。


  分析专家为高管提供审计师所称的“认证功能”——对分析结果的正确性和完整性进行独立认证。对于预测模型，专家要证明模型预测良好，能恰当地将误报和漏报降至最低，并且不会鼓励逆向选择。很少有高管具备必要的培训和知识，能够自行验证复杂分析的质量。对独立认证的需求是组织将战略分析项目外包给顾问的主要原因之一。


  简而言之，组织雇佣专家和专业人员并不是因为他们掌握分析编程语言的技能。雇佣他们主要是看中他们的领域专业知识、对自己所提供分析结果的负责能力，以及愿意为其分析的有效性承担责任。


  借用医学领域的类比，机器人现在能够执行最复杂的开心手术。这并不会消除对心脏病专家的需求，尽管可能会改变工作的性质。病人不太可能完全将诊断交给机器，机器也不具备病人所看重的“床边关怀”方式。


  ### 对自助服务的平衡看法


  虽然绩效衡量和战略分析仍将掌握在专家和专业人员手中，但自助式分析在两种用例下最为适用：探索和业务规划。


  **探索与洞察**。在采取行动之前，管理者希望了解问题或机遇的基本面貌。这自然引出了诸如以下问题：


  -   我们在新泽西州有多少客户？

  -   上周有多少购物者购买了我们的品牌狗粮？

  -   我们在五大湖区的门店销售趋势如何？


  探索非常适合自助式分析，原因有三。首先，将工作交给专家会减慢流程。专家通常积压了大量工作；一项任务可能专家只需一小时完成，但由于队列中的先前请求，请求者可能要等上一周才能看到结果。


  其次，将分析工作交给专家会产生潜在的误解。请求者必须准备一份规范说明；请求会变得越来越详细，而专家则养成了完全按照请求者要求去做的习惯，而不是深入洞察请求者试图解决什么问题。


  第三，探索本质上是迭代的；一个问题的答案会引出更多问题。专家模式不利于迭代，因为每个周期都需要再次提出请求，再次排队等待，并增加更多产生误解的可能性。


  从功能角度看，交互式查询和可视化是探索工具的关键需求。一个灵活的后端，能够轻松集成多种不同数据源，是绝对必要的。管理者在探索中可能需要的额外功能包括简单的时间序列分析、简单的预测建模、基本内容分析和地图功能。


  **业务规划**。管理者确定机遇后，下一步是行动计划；这反过来又会引发许多战术性问题。例如，一旦决定在现有客户中开展营销活动以刺激特定产品的购买，管理者可能想知道：


  -   有多少客户购买过此产品？

  -   这些客户的平均购买量是多少？

  -   有多少客户在过去 12 个月内购买过该产品，但在过去 3 个月内没有购买？


  与探索一样，管理者在制定业务计划时非常看重速度和自助服务。然而，在规划中，管理者更需要量化和数值分析，而非简单的可视化。此时，有趣的趋势和假设远没有硬数字来得重要。


  预测分析在业务规划中扮演着更重要的角色。管理者关心的是预测特定决策的影响：


  -   预期的响应率和转化率是多少？

  -   我们可以预期多少信贷损失？

  -   如果我们不采取行动，预期的流失率是多少？


  因此，用于预测分析的自助式工具可以在业务规划中发挥作用，前提是它们完全透明且“防傻瓜”。一个“防傻瓜”工具具有内置的约束和指导原则，可防止经验不足的用户得出虚假的洞见。




  ## 自助分析领域的创新


  在接下来的部分中，我们将讨论六项自助分析创新：


  -   数据可视化：`Tableau` 将简洁的界面（适用于基础可视化）与强大的数据访问引擎相结合。

  -   数据混合：`Alteryx` 和 `ClearStory Data` 在处理来自不同数据源的数据混合问题方面采取了截然不同的方法。

  -   Hadoop 上的 BI：`AtScale` 和 `Platfora` 展示了在 Hadoop 上实现商业智能的两种不同方式。

  -   洞察即服务：`Domo` 帮助高管避开 IT 瓶颈。

  -   业务用户分析：`KNIME`、`RapidMiner` 和 `Alpine` 为业务用户提供了不同的可扩展分析方法。

  -   自动化机器学习：`DataRobot` 提供了一个自动化机器学习平台。


  在前面的章节中，我们重点介绍了开源工具。本章中我们介绍的所有软件均采用商业许可。在每个类别中，我们都会介绍一个或多个体现该创新点的供应商。


  ### 数据可视化


  一图胜千言。


  数据可视化旨在通过统计图形、图表和信息图来进行探索、交流信息以及说服他人。作为一种探索工具，可视化能帮助分析师快速识别数据中有意义的模式，而这些模式仅凭数值分析很难发现。作为一种交流工具，可视化能让复杂的关系变得清晰易懂。可视化也是一种强大的说服工具。


  同时，可视化也是一种说谎和误导他人的好方法。数据可视化本身并不比其使用者期望的更具“科学性”。每个管理者都应该理解可视化的修辞手法，哪怕只是为了识别欺骗。


  与分析世界中的多数事物一样，可视化并非新鲜事物。统计学家早已认识到数据可视化的价值。1977 年，普林斯顿大学统计学系创始主任约翰·图基提出了箱线图的概念。如图
  9-2 所示的箱线图，是一种比较多个数据分布的便捷方式。


  ![A367683_1_En_9_Fig2_HTML.jpg](img/A367683_1_En_9_Fig2_HTML.jpg)


  图 9-2. 箱线图


  耶鲁大学政治学、统计学和计算机科学教授爱德华·塔夫特于 1982 年出版了《定量信息的视觉呈现》。由于出版商缺乏兴趣，塔夫特自行出版了这本书；如今，它仍是 `Amazon.com`
  上的畅销书。塔夫特引用了可追溯至 1686 年的可视化案例，指出许多最佳可视化作品诞生于计算机时代之前，那时艺术家们用手工绘制图表。


  数据可视化顾问、《信息仪表盘设计》一书的作者斯蒂芬·菲认为，视觉信息仅有八种类型：


  -   时间序列图，展示数值随时间的变化

  -   按数量排序的排名

  -   部分与整体的关系

  -   两组数值之间的差异，例如预测收入与实际收入

  -   按区间统计的数值计数或频率

  -   两组配对数值的比较，以显示相关性（或缺乏相关性）

  -   一组无序项目的名义比较

  -   数据的地理空间展示，在地图上显示数值或度量


  在初步数据分析中，统计学家和预测建模者会使用散点图和频率分布来理解数据中的关系。散点图显示两个变量之间的线性和非线性关系，这有助于加速模型开发。简单的图形也是一种极佳的数据质量检查手段，因为分析师可以通过几个可视化图快速识别数据中的问题。


  统计学家和市场研究人员使用可视化来传达复杂的发现。当以数字表格形式呈现时，多个变量之间的相关性难以解释；但若以热力图形式呈现（如图 9-3 所示），模式则更容易掌握。


  ![A367683_1_En_9_Fig3_HTML.jpg](img/A367683_1_En_9_Fig3_HTML.jpg)


  图 9-3. 在 `RapidMiner` 中创建的关联热力图


  像决策树这样的技术之所以流行，是因为它们易于可视化。例如，图 9-4 展示了泰坦尼克号沉没时幸存者的特征：头等舱和二等舱的女性、三等舱的年轻女性，以及 13 岁以下的男孩，其存活率远高于其他乘客。


  ![A367683_1_En_9_Fig4_HTML.jpg](img/A367683_1_En_9_Fig4_HTML.jpg)


  图 9-4. 泰坦尼克号幸存者决策树（来源：`RapidMiner`）




  #### 论证可视化的重要性


  为了论证可视化的重要性，`SAS` 于 1980 年在其统计软件中新增了 `SAS/GRAPH`。`SAS/GRAPH` 是 `SAS` 推出的首个新功能扩展。虽然它面向批处理任务，但功能极其强大；`SAS`
  程序员只需几行代码就能生成数百张图表。作为项目导入数据后的第一步，分析师可以利用图表全面审视潜在预测因子，并制定后续分析计划。


  20 世纪 90 年代涌现的商业智能供应商，包括 `Business Objects`、`Cognos` 和 `MicroStrategy`，均在其产品中集成了图形与可视化功能，并配备了报表和仪表盘工具。


  图形功能也在开源软件 `R` 及其生态系统包的吸引力中占据了重要地位。`R` 用户可以从广泛的标准图表和专用图表中做出选择，构建图形应用程序，并发布交互式图形。2007
  年推出的 `ggplot2` 包因其相对易用且功能多样，吸引了大量新用户加入 `R` 的阵营。


  讨论近期自助式可视化的兴起时，不能不提 `Tableau`。斯坦福大学的研究人员于 2003 年创立了 `Tableau Software`，旨在将他们研发的创新可视化工具商业化。`Tableau`
  稳步增长，2011 年收入达到 6200 万美元；随后业绩腾飞，收入增长了十倍，达到 6.54 亿美元。


  通过这种方式，`Tableau` 超越了 `Actuate`、`Hexagon`、`Panorama Software`、`Autodesk`、`TIBCO`、`Information
  Builders`、`ESRI`、`Qlik Tech` 和 `MicroStrategy`，在 `IDC` 的商业智能和分析工具软件排名中位列第六。`Tableau`
  还超过了行业资深企业 `FICO`、`Infor`、`Adobe` 和 `Informatica`，在 `IDC` 的整体商业分析软件行业排名中升至第八位。


  `Tableau` 于 2013 年 5 月上市，估值达到 30 亿美元。从创立到首次公开募股，`Tableau` 为投资者创造的价值⁴ 在 2009 年至 2014
  年间仅次于另外三家初创公司。


  考虑到 `Tableau` 的图形能力并不比大多数竞争性商业智能工具更强，甚至远不及用户在 `SAS` 和 `R` 中能实现的功能，其成功令人惊讶。`Tableau`
  与其他工具的关键区别在于其简单性和数据源连接能力。传统的 BI 工具旨在与组织的数据仓库集成。虽然它们的图形功能不难使用，但每个数据源都需要复杂的配置。这使得它们缺乏灵活性，进行临时分析需要较高的技能水平。


  对于 `SAS` 和 `R` 这类工具来说，可视化是一个两步过程：第一步检索数据，第二步创建可视化。虽然这些工具功能强大且高度灵活，但需要专业知识才能成功使用。`Tableau`
  的核心创新⁵ 是一种名为 `VizQL`（可视查询语言）的查询语言。`VizQL` 结合了 `SQL` 和一种用于渲染图形的语言，使得临时可视化仅需一步即可完成。`Tableau`
  将其查询语言与极其广泛的数据源连接能力相结合，这些数据源包括 `Microsoft Excel` 和 `Access`；文本文件；来自 `SAS`、`SPSS`
  和 `R` 的统计文件；关系数据库；`NoSQL` 数据存储；`Hadoop`；`Apache Spark`；企业应用程序（包括 `SAP` 和 `Salesforce`）；`Google
  Analytics`；以及其他众多数据源。


  可以说，`Tableau` 的成功并非因为其功能繁多，而是因为它将少数几件事做得非常出色，而它做得出色的正是用户所需。`Tableau` 的简洁性使其易于使用。结合其强大的数据源连接能力，`Tableau`
  在多样化和复杂的数据中作为临时探索工具表现出色。根据传统数据仓库理论，这种用例本不应存在，因为数据仓库理论要求将数据整合到单一数据存储中。`Tableau` 非凡的商业成功证明了传统数据仓库理论在多大程度上已不再适用。


  ### 数据混合


  数据混合工具使业务用户能够混合和清理来自多个来源的数据。这些工具提供了丰富的功能来访问不同的数据源、选择数据、转换数据，并将其组合成一个单一数据集用于分析。大多数工具还具备一定能力来分析混合后的数据。


  根据数据仓库理论，终端用户不应需要数据混合工具；原则上，数据仓库流程应执行所有必要的处理步骤，向终端用户呈现已经过清理、标准化并适合分析形式的数据。


  -   在许多组织中，预算限制使数据仓库团队无法跟上数据的爆炸式增长。

  -   即使是资金充足的数据仓库团队，也会有大量积压工作，导致将新数据源纳入仓库的时间大幅延迟。

  -   许多分析是临时性的，不值得投资于永久性的数据仓库数据供给。


  关于最后一点，一个例子是，许多营销项目使用外部供应商，而营销活动可能只进行一两次。寻求准备活动分析报告的营销分析师，必须将外部供应商提供的数据与组织数据仓库中的数据合并，以生成一份完整的报告。


  许多初创公司提供数据混合工具，包括 `Alteryx` 和 `ClearStory Data`。


  1997 年，三位企业家创立了一家名为 `SRC LLC` 的咨询公司；该公司提供地图绘制和人口统计分析的自定义解决方案。两年后，`SRC` 中标成为美国人口调查局的技术提供商；在接下来的几年里，该公司开发了几款用于地理空间分析的新软件产品。


  `SRC` 于 2006 年推出了 `Alteryx`。`Alteryx` 是一个提供用于分析空间和非空间数据的统一环境的软件包，简化了混合来自多个数据库的数据的任务；精简了空间分析；并使用户能够发布包含地图、图表、表格和图形的集成报告。


  2010 年，`SRC` 的创始人将公司更名为 `Alteryx Inc.`，以便专注于这一产品⁶。`Alteryx` 已通过三轮风险投资共筹集了 1.63 亿美元；最近一轮融资额为
  8500 万美元，于 2015 年 10 月结束。


  截至 2016 年 6 月，`Alteryx Analytics` 已发布第 10 版。`Alteryx Designer` 环境使业务用户能够构建工作流，以准备、混合和分析来自广泛来源和数据类型的数据，包括：


  -   数据仓库和关系数据库

  -   云和企业应用程序

  -   `Hadoop` 和 `NoSQL` 数据存储

  -   社交媒体平台

  -   来自诸如 `Experian`、`Dun & Bradstreet` 和美国人口调查局等供应商的打包数据

  -   `Microsoft Office` 和统计软件包


  为了进行更深入的分析，`Alteryx` 提供了基于开源软件 `R` 构建的基本描述性和预测性分析，以及地理空间分析。用户可以将分析结果导出为 `Microsoft
  Office` 格式、`Adobe PDF`、`HTML` 和其他常见格式。`Alteryx` 与领先的可视化工具（如 `Tableau`、`Qlik`、`Microsoft
  Power BI` 和 `Salesforce Wave`）集成。


  图 9-5 显示了 `Alteryx Designer` 桌面界面。


  ![A367683_1_En_9_Fig5_HTML.jpg](img/A367683_1_En_9_Fig5_HTML.jpg)


  图 9-5. Alteryx Designer


  `Alteryx Server` 版本运行在 `Microsoft Windows Server` 上。`Alteryx Server` 通过下推 SQL 支持可扩展分析，该技术将用户请求传输到数据存储进行本地执行，无需移动数据。第
  10 版支持针对 `Amazon Redshift`、`Apache Hive`、`Apache Impala`、`Microsoft SQL Server`
  和 `Azure SQL Data Warehouse`、`Oracle Database`、`Apache Spark SQL` 和 `Teradata Database`
  的下推 SQL。




  #### ClearStory Data 采用与众不同的数据混合方法


  ClearStory Data 成立于 2011 年，并于 2013 年将其 ClearStory 产品推向市场。ClearStory 是一款内存可视化与协作应用，集成了推理引擎和数据混合能力。该平台完全在
  Apache Spark 上运行（本章前面章节以及第二章已讨论过 Spark）。


  基于 Spark 的数据摄取能力，ClearStory 使组织能够整合不同的内部和外部数据源。支持的内部数据源包括：


  - 关系型数据库，包括 Oracle、SQL Server、Amazon Redshift、MySQL 和 PostgreSQL

  - Hadoop

  - 多种格式的文件

  - 适用于企业应用的 API，例如 Salesforce


  通过与数据提供商合作，ClearStory 提供了多个预定义的外部数据源：


  - 人口统计数据，包括特定地点的美国人口普查数据

  - 来自多家提供商的企业概况数据

  - 市场与销售情报数据，包括媒体支出和按产品品类划分的销售额

  - 宏观经济数据，如 GDP、通货膨胀率、失业率和商品价格

  - 来自 Twitter 及其他平台的社交媒体数据

  - 天气数据


  一旦数据源在 ClearStory 中注册，应用的推理引擎会收集描述数据形态的关键统计信息，以及关于其结构和语义的信息。当用户请求分析时，ClearStory
  会利用这些信息，根据用户试图解决的问题推荐其他数据。ClearStory 的数据混合引擎将数据与公共维度进行匹配，使用户能够整合来自不同来源的数据。


  截至 2015 年底，投资者已向 ClearStory Data 提供了 3000 万美元的风险投资。最近一轮融资发生在 2014 年 3 月，是由 DAG Ventures
  领投的 2100 万美元 B 轮融资，Andreessen Horowitz、Google Ventures、Khosla Ventures 以及 Kleiner
  Perkins Caufield & Byers 参与了投资。


  ### Hadoop 上的 BI


  如第四章所述，组织正在大力投资 Hadoop。与传统数据仓库相比，Hadoop 的成本显著降低，使其成为一种颇具吸引力的替代方案，尤其适用于价值尚未确定的数据。


  然而，Hadoop 的使用难度远高于传统数据仓库。对于习惯于配合数据仓库使用商业智能工具的最终用户来说，Hadoop 的使用几乎难如登天。即便是比 MapReduce
  更容易使用的 Hive 和 Pig 等工具，也仅适合高级用户。


  随着存储在 Hadoop 中的数据量不断增长，对能够处理这些数据的商业用户工具的需求也日益增加。AtScale 和 Platfora 是两家初创公司，它们解决此问题的方法截然不同。AtScale
  提供了一个中间层，使现有的商业智能工具能够处理 Hadoop 数据。而 Platfora 则创建了一个专用的数据集市来支持其自身的最终用户工具。我们接下来将讨论这两家初创公司。


  #### AtScale


  AtScale 由雅虎资深员工于 2013 年创立，于 2015 年 4 月从隐身模式中亮相；同时，它宣布了 700 万美元的 A 轮融资。与本章介绍的其他 BI
  初创公司不同，AtScale 不提供自己的 BI 最终用户客户端。相反，AtScale 遵循的原则是，大多数组织已经配备了 BI 工具，因此它在后台运行，使这些工具能够与
  Hadoop 数据存储协同工作。


  理论上，大多数 BI 工具可以通过 JDBC API 直接连接到 Hive 表或 Spark DataFrame。但实际上，除非数据已经结构化，并且按照所有需要的度量、维度和关系进行了聚合，否则用户将不得不在
  BI 工具和 Hive、Pig 或编程 API 之间来回切换。很少有业务用户具备执行此操作所需的技能，因此组织必须指派一名开发人员，将数据迁移到别处，或实施并维护一个专用的“BI-on-Hadoop”工具。


  边缘节点是位于 Hadoop 集群外围的一台服务器，通常用于协调与其他应用的交互。边缘集群与边缘节点类似，但它由 Hadoop 集群外围的一组服务器组成，而非单台服务器。


  AtScale 引擎位于 Hadoop 集群的一个边缘节点上。通过用户通过基于 web 的 AtScale Cube Designer 输入，AtScale 与
  Hive 元数据存储进行交互，以创建和维护一个虚拟的维度数据模型，即“多维数据集”。用户可以根据需要指定用于下钻的层级结构、计算字段和其他维度，以表示当前的业务问题。基础数据不会更改或移动，因此用户可以根据同一数据为不同目的指定不同的多维数据集。BI
  工具（如 Microsoft Excel 或 Tableau）通过 ODBC、JDBC 或 OLE DB 向 AtScale 提交 SQL 或 MDX 请求。最终用户可以直接从
  Excel 等工具中进行操作，如图 9-6 所示。


  ![A367683_1_En_9_Fig6_HTML.jpg](img/A367683_1_En_9_Fig6_HTML.jpg)


  图 9-6. 搭载 AtScale 侧车的 Microsoft Excel


  AtScale 通过可用的 SQL 引擎（例如 Hive on Tez、Spark SQL 或 Cloudera Impala）开发并提交优化后的查询，然后将结果返回给
  BI 工具，供其进一步处理并呈现给最终用户。用户可以选择保留或删除已创建的任何聚合表。AtScale 提供了用于管理聚合表的工具，以及安排多维数据集生成和更新的能力。




  #### AtScale 支持的 BI 工具与生态系统


  `AtScale`支持流行的 BI 工具：`Tableau`、`Microsoft Excel`、`Qlik`、`Spotfire`、`MicroStrategy`、`PowerBI`、`JasperSoft`、`SAP
  Business Objects`和`IBM Cognos`。它适用于`Cloudera`、`Hortonworks`、`MapR`和`HDInsights`
  Hadoop 发行版；`Hive on Tez`、`Spark SQL`和`Cloudera Impala` SQL 引擎；以及广泛的数据存储格式选择，包括`Parquet`、`RC`、`ORC`、`Sequence`、文本文件和`Hive
  SerDe`。在安全性方面，该软件提供基于角色的访问控制，以选择性地向跨部门和跨组织的用户授予数据访问权限。该应用程序维护已执行查询的审计跟踪，以便组织能够跟踪请求量、请求的数据和运行时间。


  `Ben Werther`，一位来自`Siebel`、`Microsoft`和`Greenplum`的资深人士，于 2011 年创立了`Platfora`，获得了由`Andreessen
  Horowitz`领投的风险投资家提供的 570 万美元资金⁸。该公司于 2012 年 10 月结束隐秘模式，并在此后不久完成了 2000 万美元的“B”轮融资⁹。该公司于
  2014 年 3 月又筹集了 3800 万美元¹⁰。（作者注：2016 年 7 月 21 日，基于云的软件供应商`Workday`宣布计划以未公开金额收购`Platfora`。）


  #### Platfora 平台概述


  `Platfora`提供了一个端到端的数据仓库和 BI 平台，运行在`Hadoop`旁边的边缘集群上。`Platfora Server`是一个分布式内存引擎；它操作从`Hadoop`中提取的数据副本。


  在最终用户处理数据之前，管理员会从源数据中定义结构化的`Platfora`数据集。除了定义数据结构，管理员还定义数据集的访问权限。


  最终用户（通过浏览器界面操作）使用已定义的数据集来指定他们所需数据的视图。`Platfora`将这些请求转换为`MapReduce`或`Spark`作业，提交执行，并将结果以`Platfora`专有的文件格式写回`HDFS`。它还会在本地磁盘上保留一份视图副本，并在目录中注册关于该视图的元数据。


  `Platfora`提供了一个用户友好的界面，便于业务用户使用。当用户探索和分析数据时，`Platfora`会针对本地视图副本生成内存中的查询。如果要查询的数据超过`Platfora`集群的可用内存，查询会溢出到磁盘或失败。


  在大多数情况下，`Platfora`仅处理已加载到`Hadoop`中的数据；它从其他来源拉取小型数据集的能力有限。`Platfora`适用于大多数`Hadoop`发行版；它可以使用存储在`HDFS`、`Hive`、`MapR
  FS`、上传文件中的数据，也可以使用`Amazon Web Services`的`S3`文件系统。


  ### 洞察即服务（Insight-as-a-Service）


  许多高管对他们所认为的 IT 组织缺乏响应性和服务质量差感到沮丧。出于对速度的需求，他们寻求能够立即提供所需绩效指标和洞察的服务。


  过去，绕过 IT 组织很困难，因为 IT 实际控制着所有数据。如今，随着许多业务流程通过托管服务和软件即服务（`Software-as-a-Service`）交付，大量数据已经驻留在云端。此外，随着职能领导越来越多地控制技术支出，他们实际上“拥有”数据。


  提供预打包云解决方案的供应商满足了这些高管的需求。其中一家供应商`Domo`展示了洞察即服务概念的力量。


  `Domo`，一家位于犹他州盐湖城的初创公司，采用了一种截然不同的 BI 方法。`Domo`不再推广另一套工具，而是将自己定位为面向繁忙高管的解决方案，这些高管因传统
  BI 工具的延迟和局限性而感到沮丧。`Domo`通过打包的基于云的软件即服务交付模式，为这些高管提供了完全绕过 IT 瓶颈的手段。


  成功企业家`Josh James`于 2010 年创立了该公司。`James`于 1996 年共同创立了成功的网络分析初创公司`Omniture`，并带领该公司于
  2009 年以 18 亿美元成功出售给`Adobe Systems`。2010 年末，`James`收购了一家提供可视化软件的小公司，并将合并后的实体更名为`Domo`。凭借充足的资本——来自
  45 位投资者的 4.84 亿美元，共计八轮融资，包括`Andreessen Horowitz`、`Fidelity Investments`、`Jeff Bezos`、`Morgan
  Stanley`和`T. Rowe Price`——`Domo`在隐秘模式下运营了近五年，以开发和改进其产品。


  一家以隐秘模式运营的公司不会向公众披露其产品或服务的信息；这样做是为了让潜在竞争对手无法预判其产品，并留出足够时间来开发适销对路的产品。公司可能会向投资者或顾问披露信息，但必须严格遵守保密协议。由于不进行营销，以隐秘模式运营的公司很少有收入或客户，因此公司可能需要大量资金才能长期保持隐秘模式。


  `Domo`于 2015 年 4 月结束隐秘模式¹¹，并推出了一款高度成熟的产品。围绕标准 BI 功能（包括查询、报表、仪表板和警报）的核心，`Domo`提供预构建的基于角色和基于行业的解决方案以及专为决策支持设计的应用程序。面向用户的功能运行在`Amazon
  Web Services`¹²上经过修改的 MPP 列式数据库上。


  `Domo`还预构建了超过 350 个数据源连接器，以加速数据集成。这个连接器库包括最广泛使用的数据库和应用程序；仅营销领域就有 51 个连接器，包括`Adobe
  Analytics`、`Facebook`、`Google AdWords`、`HubSpot`、`IBM Digital Analytics`、`Klout`、`Marketo`、`Salesforce`、`SurveyMonkey`、`Twitter`、`Webtrends`、`YouTube`等。


  结合从本地系统安全传输数据的功能，这些预构建的连接器和解决方案使`Domo`能够承诺快速实现价值。此外，`Domo`专注于提供集成且可定制的基于角色的决策解决方案，这使其与传统
  BI 工具有所区别。


  当`Domo`于 2015 年 4 月结束隐秘模式时，它声称拥有超过 1,000 家付费客户，并在 2014 年实现了 5000 万美元的年销售额。




  #### 商业用户分析


  商业供应商们积极竞相推出既易用又强大的预测分析软件。这并非新现象；以下列表列出了五款此类产品及其推出年份。

  - `Angoss KnowledgeSeeker` (1984 年)

  - `SAS JMP` (1989 年)

  - `Dell Statistica` (1986 年)

  - `IBM SPSS Modeler` (1994 年)

  - `SAP InfiniteInsight` (1998 年)


  有三款相对较新的产品值得更详细地讨论：`KNIME` 和 `RapidMiner` 于 2006 年推出，以及 `Alpine` 于 2011 年推出。`KNIME`
  和 `RapidMiner` 采用开放核心模型运营；各自提供开源版本以及商业许可的扩展插件。这三款产品都适用于大数据，能与 `Hadoop` 进行下推式集成；`Alpine`
  还提供与特定数据仓库设备的集成。


  `KNIME`（与“lime”押韵）是一个用于数据集成、商业智能和高级分析的开源平台。该平台基于 `Eclipse`，使用 `Java` 编写，其特点是拥有采用工作流模式的图形用户界面。用户通过拖放工具构建任务管道，并以交互模式或批处理执行模式运行它们。图
