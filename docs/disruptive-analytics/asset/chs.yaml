  \n\n```markdown\n\n# Hadoop 生态系统\n\n## 自下而上的颠覆\n\n2003 年，道格·卡廷和迈克·卡法雷拉致力于构建一个能够搜索并索引整个互联网的网络爬虫。他们需要一种将数据分布到多台机器上的方法，因为单台机器无法处理如此庞大的数据量。\n\
  \n为了控制成本，他们希望使用廉价的通用硬件。这意味着他们需要具备容错能力的软件，这样即使任意一台机器发生故障，系统也能继续运行。\n\n在工作的早期阶段，他们排除了使用关系型数据库的可能性。他们的数据包含多种多样的数据结构和数据类型，没有预定义的数据模型。将这些数据映射到关系型数据结构中会耗费大量时间——即便这种映射在理论上可行。\n\
  \n借鉴谷歌工程师发表的两篇论文，卡廷和卡法雷拉开发了一个分布式文件系统和编程框架。这个文件系统如今被称为 Hadoop 分布式文件系统，即`HDFS`，它内置了冗余机制，因此如果集群中的任何一台机器发生故障，系统可以继续使用其他机器上的副本进行工作。\n\
  \n编程框架`MapReduce`为开发人员提供了一种将工作负载分发到集群节点并收集结果的方法。借助`MapReduce`，开发人员无需显式地并行化任务，这既节省了时间，又简化了编程任务。此外，它还将编码层与集群管理分离开来，使得可以在不更改程序的情况下修改集群配置。使用`MapReduce`编写、用于在一个集群上运行的程序，可以在具有不同配置的其他集群上无需修改即可运行。\n\
  \n卡廷和卡法雷拉将`HDFS`和`MapReduce`设计为一个协同工作的系统。2006 年，他们将代码贡献给了 Apache 软件基金会，作为 Apache\
  \ Hadoop 的核心。\n\n早期的 Hadoop 版本难以使用，分析师可用的工具很少。对于大多数企业而言，Hadoop 不过是令人好奇的新奇玩意。然而，互联网公司迅速采用了这项技术。2008\
  \ 年，雅虎宣布¹其使用 Hadoop 进行 TB 级排序创下了纪录；此后不久，Facebook 披露²其每天将 15TB 数据摄入到其基于 Hadoop 的\
  \ 2.5PB 数据仓库中。\n\n2009 年，当 Cloudera 和 MapR 推出商业支持的发行版时，Hadoop 的通用适用性向前迈进了一步。2013\
  \ 年，Hadoop 团队引入了`YARN`，这是一个资源管理器。此举意义重大，以至于社区创造了“**Hadoop 2.0**”一词来描述该项目的新阶段。\n\n\
  自此以后，企业采用率呈现爆炸式增长：\n\n*   根据 Wikibon 的估计，所有拥有大数据的组织中，有三分之一已将 Hadoop 集群投入生产。³\n*\
  \   Ovum 分析师托尼·贝尔估计⁴，到 2014 年初，已部署了 1000 个 Hadoop 集群。\n*   领先的 Hadoop 发行商报告称每季度有\
  \ 50 至 75 家新客户采购。\n*   最成熟老练的用户拥有超过 1000 个节点的集群。⁵\n*   Gartner 在 2015 年对其首席信息官小组进行的一项调查⁶显示，2016\
  \ 年 Hadoop 用户群可能翻倍。\n*   行业分析机构 Forrester 预测⁷，到 2017 年，100%的大型企业将采用 Hadoop。\n\n\
  在本章中，我们将涵盖 Hadoop 及其生态系统的基本原理；Hadoop 的经济性；NoSQL 数据存储简介；以及 Hadoop 中的分析技术回顾。\n\n##\
  \ Hadoop 及其生态系统\n\n现代关系型数据库管理系统是一个复杂的技术组合：包含文件系统、查询引擎、备份与恢复工具、脚本语言、批量加载工具、安全系统以及管理与治理工具。Hadoop\
  \ 将这些组件解耦为许多独立的软件组件，这些组件可以独立运行。\n\n定义 Hadoop 有三种方式：\n\n*   **Apache Hadoop**：Apache\
  \ 软件基金会的一个用于分布式计算和存储的项目。\n*   **“核心 Hadoop”**：一组广泛使用的、对 Apache Hadoop 功能进行补充的开源组件集合。\n\
  *   **Hadoop 生态系统**：围绕 Apache Hadoop 发展起来的、由开源项目、商业软件供应商和服务提供商组成的网络。\n\n每个 Apache\
  \ 项目都独立运作；这使得快速创新和发展成为可能。然而，每个项目只支持单一的功能，因此用户通常需要将来自多个项目的软件组合成一个可工作的系统。\n\n商业供应商销售包含\
  \ Apache Hadoop 在内的开源和专有组件捆绑包。这些通常被称为 Hadoop 发行版，尽管 Apache 许可协议禁止供应商使用该术语。⁸\n\n\
  ### Apache Hadoop\n\nApache Hadoop 是 Apache 软件基金会的一个顶级项目，基金会拥有其代码并以免费使用许可进行分发。Hadoop\
  \ 遵循 Apache 的标准治理模型运作。项目团队由一个项目管理委员会（PMC）和若干提交者（均为志愿软件开发人员）组成。PMC 负责确定软件增强和缺陷修复的优先级。团队大约每三个月发布一个新版本，基于提交者的投票共识。\n\
  \nHadoop 支持在通用硬件上进行大规模、容错的分布式计算。它包含三个主要组件：\n\n*   **Hadoop 分布式文件系统（`HDFS`）**：一个用\
  \ Java 实现的分布式文件系统。\n*   **`MapReduce`**：一个用于处理分布式数据集的处理框架。\n*   **`YARN`**：一个资源管理和调度应用程序。\n\
  \n在 Hadoop 1.0 下，`HDFS`包含一个名称节点和一个或多个数据节点。名称节点充当目录，跟踪系统中存储的文件；数据节点则存储实际数据。在`HDFS`下，一个文件被分布存储在多个数据节点上。\n\
  \n`MapReduce` 1.0 引擎由一个作业跟踪节点和一个或多个任务跟踪节点组成。在标准配置中，集群中的每台服务器上都安装一个任务跟踪节点和一个数据节点，另外指定一台或多台服务器来支持名称节点和作业跟踪节点。\n\
  \n用户通过编写`MapReduce`程序（由映射器和化简器组成）来查询存储在`HDFS`中的数据。映射器负责执行如选择、过滤和排序等操作；化简器则对映射器的结果执行汇总操作。用户可以利用这些基本操作来支持广泛的业务应用。\n\
  \n有意向的用户可以直接从 Apache 软件基金会获取 Apache Hadoop。\n\n```\n\n\n### Hadoop 2.0\n\n在 Hadoop\
  \ 的第一代中，工作负载管理被硬编码到 `MapReduce` 中，这使得在集群中与其他处理模型共同部署软件变得困难。2013 年底 `YARN` 的引入标志着\
  \ Hadoop 的第二代，即 Hadoop 2.0。`YARN` 是代码重构的结果，它将 `JobTracker` 和 `TaskTracker` 的角色拆分为三个独立的实体：\n\
  \n-   `ResourceManager`：一个调度器，负责将集群中的计算资源分配给应用程序。\n-   `NodeManager`：部署在 Hadoop\
  \ 集群的每个节点上，该组件在 `ResourceManager` 的指导下管理其节点上的资源。\n-   `ApplicationMaster`：在集群上运行特定作业，从\
  \ `ResourceManager` 获取计算资源，并与 `NodeManager` 协作管理该作业可用的资源。\n\n`YARN` 和 Hadoop 2.0\
  \ 对商业分析产生了巨大影响。在 Hadoop 1.0 下，分析应用程序部署在 Hadoop 旁边；用户要么物理地将数据从 Hadoop 中提取出来并移动到分析应用程序，要么将他们的命令转换为\
  \ `MapReduce` 以在 Hadoop 中直接执行。\n\n移动非常大的数据集是不切实际的（有时也是不可能的）；此外，即使对于训练有素的分析师来说，`MapReduce`\
  \ 的学习曲线也非常陡峭。一些软件供应商尝试构建工具，在后台自动转换为 `MapReduce`，但收效有限。\n\n`YARN` 允许将分析应用程序直接部署在\
  \ Hadoop 集群上，与 `MapReduce` 共同部署。分析应用程序可以直接消费存储在 `HDFS` 中的数据，而无需通过 `MapReduce` 引擎传递命令。`YARN`\
  \ 充当资源的“交通警察”，管理 `MapReduce` 作业与共同部署的软件之间的冲突。\n\n### 基于 Hadoop 的解决方案\n\n2009 年，初创公司\
  \ Cloudera 推出了第一个由 Hadoop 驱动的商业支持软件。Cloudera 将 Apache Hadoop 与其他几个组件捆绑在一起，形成了一个完整的数据管理包。他们将该捆绑包命名为\
  \ Cloudera Data Hub (`CDH`)，并提供技术支持和咨询服务。\n\n同样成立于 2009 年的 `MapR` 提供了一个竞争的 Hadoop\
  \ 捆绑包，其中包含许多旨在实现高可用性的修改。`MapR` 还提供了一个选项，可以用专有文件系统（`MapR-FS`）来代替，以获得更好的性能和易用性。\n\n\
  早期的 Hadoop 采用者雅虎（Yahoo）发布了其自有的捆绑包好几年，但没有提供技术支持。2011 年，雅虎将其 Hadoop 资产剥离给一家新公司 Hortonworks，该公司强调“纯粹的”开源\
  \ Hadoop 方法。Hortonworks 的软件中不包含任何专有组件，完全依靠技术支持和咨询服务来获得收入。\n\n领先的 Hadoop 公司之间的竞争非常激烈；每家都试图通过服务、支持和产品增强来提高其捆绑包的价值。因此，核心\
  \ Hadoop 项目变得越来越稳定和功能丰富。\n\n在实验室环境之外，很少有企业使用纯粹的 Apache Hadoop，而是依赖基于 Hadoop 的商业捆绑包之一。截至\
  \ 2016 年 7 月，这些包括：\n\n-   Amazon Elastic MapReduce\n-   Cloudera Data Hub (`CDH`)\n\
  -   Hortonworks Data Platform\n-   IBM Infosphere BigInsights\n-   MapR\n\n企业依赖商业捆绑包有几个原因。首先，商业捆绑包包含额外的组件，这些组件支持数据平台所需的功能：实施、维护、配置、安全等。\n\
  \n商业供应商会测试捆绑包中所有组件的互操作性，然后为客户提供技术支持和咨询服务。这些服务提供了巨大的价值，因为它们简化了部署并缩短了实现价值的时间。\n\n\
  与发布新版本频繁且不规律的 Apache Hadoop 相比，商业供应商还提供了更稳定的发布节奏。企业通常倾向于避免频繁升级软件所带来的成本和风险。\n\n由于商业供应商相互竞争并寻求产品差异化，每个供应商都用不同的软件捆绑包来补充\
  \ Apache Hadoop。下面列出的九个组件包含在每个发行版中。\n\n-   Apache Flume：用于收集、聚合和移动日志数据的分布式服务。\n\
  -   Apache HBase：分布式列式数据库。\n-   Apache Hive：类 SQL 查询引擎。\n-   Apache Oozie：工作流调度器。\n\
  -   Apache Parquet：列式存储格式。\n-   Apache Pig：高级 MapReduce 脚本语言。\n-   Apache Spark：分布式内存计算框架，包含用于\
  \ SQL、流处理、机器学习和图分析的库。\n-   Apache Sqoop：用于在关系型数据库和 Hadoop 之间进行数据传输的工具。\n-   Apache\
  \ Zookeeper：分布式集群配置服务。\n\n除了这些通用分发的组件之外，还有许多其他 Apache 开源项目支持数据管理所需的功能。下面列出的项目包含在部分（而非全部）商业\
  \ Hadoop 发行版中：\n\n-   Accumulo：宽列数据存储。\n-   Atlas：用于数据治理的元数据仓库。\n-   Avro：远程过程调用和数据序列化框架。\n\
  -   Falcon：定义、调度和监控数据管理策略的数据治理引擎。\n-   Knox：提供身份验证和安全访问的系统。\n-   Ranger：全面的安全管理。\n\
  -   Sentry：提供基于角色的授权。\n-   Slider：用于部署和监控在 `YARN` 下运行的应用程序的工具。\n-   Storm：分布式实时计算系统。\n\
  -   Tez：加速 `MapReduce` 操作的软件。\n\n商业供应商在其产品中混合使用 Apache 开源项目、非 Apache 开源软件和专有软件。Hortonworks\
  \ 只捆绑开源软件。\n\n\n\n### 性能改进\n\n与高性能数据仓库设备相比，Hadoop 速度较慢，但正在快速改进。性能问题部分归因于该平台尚不成熟；数据仓库设备拥有复杂的查询优化器，能够加速每次操作的运行时间。Hadoop\
  \ 的优化器仍处于早期开发阶段。\n\n`MapReduce` 将高级任务（例如 SQL 操作）分解为多个步骤。每次处理数据后，它会将中间结果保存到磁盘；因此，复杂分析在\
  \ `MapReduce` 中的运行速度显著慢于数据仓库设备。对于迭代算法（例如 k-means 聚类或随机梯度下降算法）而言尤其如此。\n\n领先的商业供应商对这一性能问题有着不同的处理方式。Cloudera\
  \ 采纳了 `Apache Spark`，而 Hortonworks 则推崇 `Apache Tez`。\n\n`Apache Spark` 是一个用于分布式内存处理的框架。类似任务在\
  \ `Spark` 中的运行速度远快于 `MapReduce`，因为 `Spark` 将中间结果保留在内存中，而不是持久化到磁盘。我们将在第五章详细讨论 `Spark`，该章节涵盖内存分析。\n\
  \n`Apache Tez` 采取了不同的方法。`Tez` 在后台运行，将程序逻辑建模为有向无环图（`DAG`），并动态重构和简化代码。因此，`Tez` 的工作方式类似于关系数据库中的查询优化器。虽然\
  \ `Tez` 减少了实现复杂分析所需的 `MapReduce` 步骤数量，但它并未改变 `MapReduce` 需要将中间结果持久化到磁盘的必要性。\n\n\
  Cloudera 在 2013 年认可了 `Spark`，并宣布将在其下一个版本中包含 `Spark`。其他供应商也纷纷效仿，因此到 2014 年 6 月，所有商业\
  \ Hadoop 供应商都已认可 `Spark` 并将其纳入其产品中。\n\n2015 年 9 月，Cloudera 宣布了其所谓的“统一平台计划”，根据该计划，它打算让\
  \ `Spark` 成为其 Hadoop 版本中的主要计算平台，将 `MapReduce` 降级为针对新应用程序的次要地位。这并不意味着 `MapReduce`\
  \ 已死；存在大量现有程序将继续在 `MapReduce` 中运行。\n\n使用 `Tez`，Hortonworks 的 Stinger 项目提高了 `Hive`\
  \ 的性能。然而，为机器学习规划的扩展尚未实现，并且 `Tez` 似乎是一条技术死胡同。\n\n## Hadoop 的经济性\n\n两个关键因素推动了 Hadoop\
  \ 的采用。首先是灵活性——能够在未预先定义结构的情况下捕获和保留数据，使企业能够更快地采取行动。其次是成本：Hadoop 和 NoSQL 数据库每单位数据的成本远低于传统数据仓库。\n\
  \nHadoop 和关系数据库就像苹果和橘子：它们做的事情非常不同。Hadoop 加载速度快，并且不需要预定义结构；因此，它非常适合支持新数字经济产生的大量非结构化数据。然而，Hadoop\
  \ 相对难以查询，并且其对请求的运行时性能相对较慢。\n\n关系数据库——以及基于它们的数据仓库——需要预定义的数据模型，这可能需要耗费大量时间和成本来构建。但它们相对易于查询，并且可以调优以获得极快的运行时性能。\n\
  \nHadoop 提供了成本极低的存储；据一位分析师称，Hadoop 每 TB 的成本为 1000 到 2000 美元。与 Hadoop 相比，`Teradata`\
  \ 数据仓库每 TB 的成本可能高达 69,000 美元。\n\n`Apache Hadoop` 本身是免费且开源的；商业捆绑包需要许可，但每个分销商都提供免费版本，使用户能够以极低成本甚至零成本开始使用。Hadoop\
  \ 的成本模型与用户需求平滑扩展。换句话说，向 Hadoop 集群添加另一个节点相对容易，并且这样做的增量成本很小。\n\n来自领先供应商的数据仓库构建成本高昂，且成本是“前端加载”的——组织仅在起步阶段就需要支付高昂的费用。此外，数据仓库成本往往是“块状”的——扩展单元庞大且昂贵。\n\
  \nHadoop 的颠覆源于 Hadoop 生态系统的商业模式。对于拥有快速扩展的非结构化数据量的组织而言，相对于传统数据仓库，Hadoop 的低成本、敏捷性和可扩展性极具吸引力。\n\
  \n基于设备、列式数据库或内存数据库构建的数据仓库对于高价值和频繁使用的数据仍然具有吸引力。对于组织愿意支付高溢价的高价值数据的高并发访问，高性能数据仓库仍然是最佳选择。\n\
  \nHadoop 主要分销商中，只有 Hortonworks 是一家上市公司。Hortonworks 的财务披露显示了快速增长。2015 年第二季度，该公司增加了\
  \ 119 名客户，比上一季度增长 27%；收入比 2015 年第一季度增长 35%，比 2014 年第二季度增长 154%。\n\n\n\n## NoSQL\
  \ 数据存储\n\nNoSQL 意为“不仅是 SQL”。NoSQL 数据库不要求用户在加载数据之前定义逻辑结构；相反，用户可在分析数据时定义结构。这使得它们非常适合处理图像、音频、视频、机器生成的日志、文档、社交媒体文本以及其他格式多样的数据。\n\
  \n从技术上讲，Hadoop 是一种 NoSQL 数据存储，Hadoop 生态系统包含了像 HBase 这样流行的 NoSQL 数据存储。此外，一些 NoSQL\
  \ 数据存储可以利用 HDFS 或 Hadoop 生态系统的其他组件。\n\nNoSQL 数据存储主要有四种类型：\n\n- **键值数据存储**：一种数据存储方法，其中表中的记录可以具有不同的字段结构，这与关系数据库中每条记录具有相同字段结构的情况相反。每条记录都有一个唯一的键。示例包括`Redis`、`Memcached`、`DynamoDB`和`Riak`。\n\
  - **宽列数据存储**：键值数据存储与列式数据存储的混合体；具有高度可扩展性。示例包括`Apache Cassandra`和`Apache HBase`。\n\
  - **文档数据存储**：专为存储和检索文档而设计的数据库，例如新闻文章、美国证券交易委员会文件或研究论文。示例包括`MongoDB`、`CouchDB`和`Couchbase`。\n\
  - **图数据库**：旨在以数学图的形式表示数据的数据存储，包含节点、边和属性。`Neo4j`是此类中的主要代表。\n\n目前有许多 NoSQL 数据库在使用中。我们在此简要描述最流行的五种：\n\
  \n- **MongoDB**：最流行的文档数据库，广泛用作生产级网站和服务的后端。由 MongoDB 公司于 2007 年开发，该公司提供商业支持；该软件采用\
  \ GPU 和 Apache 许可证，是免费且开源的。\n- **Apache Cassandra**：一种分布式宽列数据存储，由 Facebook 开发并于\
  \ 2008 年捐赠给开源社区。Apache 软件基金会于 2009 年接纳 Cassandra 为孵化器项目，并于 2010 年将其提升为顶级项目。\n- **Redis**：一种高性能内存键值数据存储。由\
  \ Redis Labs 开发和支持，该数据库采用 BSD 许可证，是免费且开源的。Redis Labs 提供`Redis Cloud`和`Memcached\
  \ Cloud`作为数据库服务。\n- **Apache HBase**：一种基于谷歌 BigTable 的高性能 NoSQL 列式数据存储。2006 年，Powerset\
  \ 的开发人员使用谷歌 BigTable 框架构建了自家的海量可扩展列式数据存储，以支持自然语言搜索引擎。微软于 2008 年收购了 Powerset，并将该数据存储资产捐赠给了\
  \ Apache 软件基金会。起初，开发作为 Hadoop 的子项目进行；2010 年，Apache 将该项目提升为顶级项目，即`Apache HBase`。\n\
  - **Neo4j**：一种开源图数据库，由 Neo Technology 开发和支持。Neo 根据 GPL 和 AGPL 开源许可证以及商业许可证提供增强版软件。该产品的首个版本于\
  \ 2010 年发布。\n\n目前，NoSQL 数据存储最广泛地用于运营类应用程序，作为分析型数据存储的使用有限。这主要是由于缺乏与 SQL 等价的标准接口。像`Python`和`R`这样的分析编程语言可以与最流行的数据库交互，但这些工具的使用仅限于专业分析人员和开发人员。\n\
  \n行业分析师预计该类别将迎来洗牌，他们认为即使是最流行的 NoSQL 数据库也缺乏可持续的商业模式。\n\n## Hadoop 中的分析\n\n在 Hadoop\
  \ 生态系统中，有许多支持分析的开源项目：用于 SQL 的`Hive`、`Impala`、`Spark`、`Drill`、`Presto`和`Phoenix`；用于\
  \ OLAP 的`Kylin`；用于机器学习的`Mahout`、`Spark`、`Flink`和`H2O`；用于图分析的`Giraph`和`Spark GraphX`；用于机器学习管道的`Zeppelin`；以及用于搜索和文本分析的`Lucene/Solr`。在\
  \ Hadoop 2.0 中，用于分析的商业软件包也越来越多。\n\n我们将本章分为两部分。在第一部分中，我们介绍 Hadoop 1.0 中可用的分析功能，这些功能与当时\
  \ Hadoop 之外可用的功能相比是初级的。在第二部分中，我们介绍 Hadoop 2.0 中的分析功能。我们将该回顾的范围限制在 SQL 引擎上，将机器学习引擎的覆盖推迟到第八章，将自助式\
  \ BI 推迟到第九章。\n\n### Hadoop 1.0\n\n在 Apache Hadoop 团队于 2013 年引入 YARN 之前，分析工作负载运行在\
  \ MapReduce 中，因为无法在 Hadoop 中同时运行替代编程框架。因此，分析工具充当了代理，将更高级别的任务转换为 MapReduce 命令，提交这些命令执行并处理结果集。\n\
  \n在本节中，我们讨论四个开源项目和一个商业产品。我们还注意到本书其他部分讨论的三个开源分析项目——`Jaspersoft`、`Pentaho`和`Talend`——开创了与\
  \ Hadoop 的集成。\n\n另外两个项目具有历史意义。由 Revolution Analytics 赞助的`rhadoop`项目支持与`HDFS`、`HBase`和`Avro`的连接，并为\
  \ R 用户在 MapReduce 中启用类似`dplyr`的操作。GitHub 统计数据显示，自 2013 年以来活动极少，自微软于 2015 年收购 Revolution\
  \ Analytics 以来几乎没有任何活动。`RHIPE`项目为 R 用户提供了类似的功能。代码贡献是零星的。\n\n本章前面讨论的 MapReduce 的局限性影响了这些早期将分析引入\
  \ Hadoop 的工作的性能和效用。随后，开发人员重新设计了`Apache Hive`以支持 Spark 和 Tez，从而有效地将其升级，以便在 Hadoop\
  \ 2.0 下使用。\n\n\n\n#### Apache Hive\n\n`Hive` 是一个开源数据仓库环境，旨在支持在 `Hadoop` 中执行类似 SQL\
  \ 的查询。最初设计为仅在 `MapReduce` 中运行，`Hive` 现在已能在 `Apache Tez` 中执行查询。`Hive` 是最成熟、分布最广的\
  \ SQL-on-Hadoop 项目。\n\nFacebook 的开发者于 2007 年开始开发 `Hive`，并于 2008 年将代码捐赠给 Apache 软件基金会，作为\
  \ `Hadoop` 的一个贡献子项目²¹。2010 年 9 月，`Hive` 毕业²²晋升为 `Apache` 顶级项目。`Hive` 的提交者包括来自 `Cloudera`、`Dropbox`、`Facebook`、`Hortonworks`、`InMobi`、`Intel`、`LinkedIn`、`Microsoft`、`NexR`、`Nutanix`、`Qubole`\
  \ 和 `Yahoo` 等科技领军企业的开发者。²³\n\n2014 年之前，`Hive` 通过 `MapReduce` 执行查询。因此，`Hive` 的运行时性能相对较慢，使其最适合于批处理\
  \ SQL。在 `Stinger` 和 `Stinger.next` 项目下，`Hortonworks` 投入了大量资源用于改进 `Hive`，主要目标如下：\n\
  \n-   将性能提升至亚秒级响应时间。\n-   将可扩展性扩展到 PB 级数据量。\n-   将 SQL 支持增强至完整的 ANSI 标准。\n\n`Stinger.next`\
  \ 计划的其他增强功能包括：\n\n-   流式数据摄入\n-   跨地域查询，即能够查询跨地理区域分布的数据集\n-   物化视图，即在内存中保存数据的多个视图\n\
  -   易用性增强\n-   简化部署\n\n为了提升性能，`Stinger` 团队重建了 `Hive`，使其利用 `Apache Tez`，这是一个能创建比通用\
  \ `MapReduce` 更高效执行计划的应用框架。`Tez` 将处理逻辑建模为有向无环图(DAG)，然后动态重构图以实现更高效的逻辑。根据 `Hortonworks`\
  \ 的说法，对于`TPC-DS`基准测试，`Hive on Tez` 的平均运行速度比传统 `Hive` 快 52 倍。²⁴\n\n与 `Stinger Initiative`\
  \ 同期，`Cloudera Labs` 的一个团队将 `Hive` 移植到 `Apache Spark` 上运行。该团队于 2016 年 4 月发布了²⁵ `Hive-on-Spark`\
  \ 的通用可用版本。\n\n`Hive` 被分发并支持于每个由 `Hadoop` 驱动的商业产品中，包括 `Cloudera CDH`、`MapR`、`Hortonworks\
  \ HDP` 和 `IBM Infosphere BigInsights`。`Hive` 的一个修改版本作为云服务在 Amazon Web Services 的\
  \ `Elastic MapReduce (EMR)` 中可用。该版本支持导入数据并写回 `Amazon S3`，以及指定外部元数据库。\n\n`Hive Server`\
  \ 是一个接口，使用户能够向 `Hive` 提交查询以执行并检索结果。（当前最新版本 `HiveServer2` 已在很大程度上取代了原始版的 `HiveServer1`。）`HiveServer2`\
  \ 支持使用流行的安全协议进行身份验证，包括 `Kerberos`、`SASL`、`LDAP`、`可插拔自定义身份验证` 和 `可插拔身份验证模块`。\n\n\
  `Hive` 支持一种类似 SQL 的语言，称为 `QL`（“`HiveQL`”）。`HiveQL` 包含 `ANSI SQL` 功能的一个子集，外加对 `MapReduce`、`JSON`\
  \ 和 `Thrift` 的额外支持。用户可以通过 `Java` 用户自定义函数（`UDF`）、用户自定义分析函数（`UDAF`）和用户自定义表函数（`UDTF`）来扩展\
  \ `Hive` 功能。\n\n`Hive` 可处理位于 `HDFS`、`HBase` 以及兼容文件系统（包括 `Amazon S3`）中的数据。\n\n根据\
  \ `OpenHub` 的统计²⁶，`Hive` 是一个非常活跃的项目，拥有 140 名贡献者和超过一百万行代码。代码库自 2013 年以来稳步扩展并显著加速。\n\
  \n`OpenHub` 数据库是 `Black Duck` 软件的一个项目，它会爬取开源代码仓库以生成关于贡献者和代码提交的统计数据。\n\n#### Apache\
  \ Pig\n\n`Apache Pig` 是一个 `Apache` 顶级项目。它包含一种高级的类 SQL 分析语言（“`Pig Latin`”），并配有一个编译器，该编译器将此语言转换为\
  \ `MapReduce`。\n\n`Yahoo` 的开发者于 2006 年夏天开始²⁷将 `Pig` 作为一个研究项目进行开发。`Yahoo` 将该软件捐赠给\
  \ Apache 软件基金会，基金会于 2007 年接受²⁸该项目进行孵育。一年后，`Pig` 毕业晋升为顶级项目。\n\n在 `Pig` 团队内部，有正在进行中的项目计划将\
  \ `Pig` 移植到 `Tez` 和 `Spark`。\n\n根据 `OpenHub` 的数据，`Pig` 远不如 `Hive` 活跃，拥有 28 名贡献者和\
  \ 37.6 万行代码。代码库在 2011 年达到顶峰，此后几乎没有新活动。\n\n#### Apache Mahout\n\n`Apache Mahout`\
  \ 是一个用于机器学习的开源项目，于 2008 年由 `Apache Lucene` 团队的几位开发者发起²⁹。该项目最初受斯坦福大学研究人员撰写的一篇论文³⁰启发而发展，但后来演变成——有些人认为退化成——包含多种方法的混合体。这种缺乏纪律性非但没有促进创新，反而导致项目沦为一系列开发和贡献的算法的松散集合。\n\
  \n`Mahout` 的某些算法使用 `MapReduce`，有些则不用；有些是分布式的，而另一些则运行在单节点上。许多贡献的算法后来因缺乏兴趣、用途和支持而被弃用并从项目中移除。\n\
  \n剩余的大部分算法使用 `MapReduce`，但自 2014 年起，所有新算法都必须使用 `Spark`。\n\n从团队于 2015 年 11 月发布的版本\
  \ `0.11.1` 开始，该项目包含了 `Samsara`，这是一个运行在 `Spark` 或 `H2O` 上用于线性代数的数学环境。\n\n`Mahout`\
  \ 的代码库³¹直到 2012 年都增长缓慢，但此后就再无增长。该项目几乎已死亡，在截至 2016 年 5 月的 12 个月内没有任何代码贡献。\n\n####\
  \ Apache Giraph\n\n图引擎可对表示为数学图的数据进行大规模计算。`Apache Giraph` 是一个开源的迭代式图处理引擎，其灵感来源于一篇\
  \ 2010 年论文³²中描述的 `Google Pregel` 图引擎；它使用了一种称为“批量同步并行”(BSP) 处理的并行化方法。`BSP` 提供了一个在分布式处理系统中管理进程和通信的框架。\n\
  \n`Giraph` 在 `MapReduce` 中实现了 `Pregel` 架构，并与 `HDFS` 文件或 `Hive` 表协同工作。`Giraph` 通过添加额外功能扩展了基本的\
  \ `Pregel` 模型，以实现更好的性能、可扩展性、实用性和容错能力。\n\nFacebook 使用³³ `Giraph` 来分析其用户的社会化图谱；该图谱拥有超过一万亿条边。为了满足需求，Facebook\
  \ 的开发团队修改了该软件，并将增强功能回馈给了开源项目。增强版的 `Giraph` 能够：\n\n-   从不同数据源读取边和节点数据\n-   处理任意数量的数据源\n\
  -   支持在 `Hadoop` 工作节点上进行多线程处理\n-   充分利用每台机器的内存\n-   在 `Hadoop` 集群中的多台机器间平衡聚合工作负载\n\
  \n2013 年，当 Facebook 首次公布³⁴其评估结果时，人们对 `Giraph` 的兴趣激增。自那时起，`Giraph` 的代码库一直缓慢³⁵但稳步地增长。\n\
  \n\n\n#### Datameer\n\n`Datameer` 是一家商业软件公司，率先在 Hadoop 上实现了商业智能。2009 年，Ajay Anand\
  \ 和 Stefan Groschupf 共同创立了 `Datameer`³⁶。当时，分析 Hadoop 中管理的数据只有寥寥几种选择：编写 `MapReduce`\
  \ 表达式，用 `Pig` 编程，或者在一个早期版本的 `Hive` 中执行基本的 SQL。所有这些选项都需要编程和技术技能，而这些技能在商业分析师中并不普遍。`Datameer`\
  \ 致力于让 Hadoop 数据变得易于访问。\n\n自 2009 年以来，`Datameer` 的产品经历了重大演变，现已发布 6.0 版本（截至 2016\
  \ 年 5 月）。该软件由一个驻留在 Hadoop 集群边缘节点上的应用服务器和数据库服务器组成。\n\n`Datameer` 应用服务器接收来自终端用户的请求（这些用户使用基于浏览器的界面工作），并将用户请求转化为\
  \ Hadoop 操作。该应用评估用户请求，并通过以下四个执行框架之一提交请求：\n\n* `MapReduce`：Hadoop 的默认计算框架，在没有其他替代方案时使用。\n\
  * `优化版 MapReduce`：当可用时，`Datameer` 会在 `Apache Tez` 上使用 `MapReduce`。（有关 `Tez` 的更多信息，请参见上一节关于\
  \ `Apache Hive` 的内容。）\n* `Spark`：当 `Spark` 可用时使用。\n* `单节点执行`：对于小任务，`Datameer` 在\
  \ Hadoop 集群的单个节点上运行该请求。\n\n`Datameer` 全面支持主要的 Hadoop 发行版。它还支持从多种数据源导入数据，包括关系型数据库、NoSQL\
  \ 数据库、`Hive`、Microsoft Office 格式、社交媒体文件、`HTML`、`JSON` 等等。数据导出功能则较为有限。同样重要的是，`Datameer`\
  \ 必须物理提取数据并将其移动到 Hadoop 中进行处理，因为它缺乏将 SQL 透传到外部数据库的功能。\n\n基于浏览器的 `Datameer` 用户界面以类似电子表格的形式显示结果，用户可以在其中添加函数和图表。\n\
  \n`Datameer` 已通过五轮风险投资筹集了 7650 万美元。其最新一轮融资是由总部位于新加坡的投资公司 `ST Telemedia` 领投的 4000\
  \ 万美元“D 轮”融资。在融资公告发布时，`Datameer` 声称³⁷拥有 200 家客户。\n\n### Hadoop 2.0\n\n如前所述，我们将本次回顾的范围限定在\
  \ SQL 引擎，并将其他分析工具的讨论推迟到后续章节。\n\nSQL 是分析领域的基础工具，几乎每个项目都需要用到它；许多项目只需要 SQL 即可。SQL 引擎是关系型数据库的内在组成部分；组织在将数据加载到数据库时，会将数据映射到\
  \ SQL 框架中。\n\n相比之下，SQL 并未内建于 Apache Hadoop 中；而是由称为 SQL 引擎的独立组件提供 SQL 功能。SQL 引擎接收用户的\
  \ SQL 命令，生成一个或多个数据请求，将这些请求提交给一个或多个数据存储，并将结果集返回给用户。\n\n虽然这些引擎常被称为 Hadoop 上的 SQL 引擎（SQL-on-Hadoop），但这个术语并不精确。一些引擎，如\
  \ `Hive` 和 `Impala`，仅在 Hadoop 内部、使用 Hadoop 数据源运行。其他引擎，如 `Spark`、`Drill` 和 `Presto`，则可以在\
  \ Hadoop 内部或外部运行，并能与多种不同的数据源协同工作。\n\n将 SQL 引擎从数据存储中解耦出来具有许多潜在优势。首先是专业化：SQL 引擎开发者可以专注于\
  \ SQL 接口和查询解析器的开发，而其他开发者则可以增强数据存储本身。\n\n将 SQL 引擎与文件系统分离也使用户能够在多个选项中进行选择。由于现代 SQL\
  \ 引擎在商业上与特定的数据存储没有绑定关系，组织可以实现“同类最佳”架构，根据最终用户的需求混合搭配 SQL 引擎。独立于数据存储运行还提供了跨多个数据存储进行“联邦”查询的潜力。\n\
  \nHadoop 在存储数据时，并不会事先将其映射到 SQL 框架中。因此，在 Hadoop 中，SQL 用户必须先*将数据映射到表结构中*，然后才能运行查询。\n\
  \n现代 SQL 引擎支持以下三种 SQL 处理模式中的一种或多种：\n\n* `批处理`：SQL 脚本在无人监督或关注的情况下对静态数据运行。批处理模式适用于长时间运行的查询，或计划重复执行的查询。通常用于提取、转换和加载（ETL）处理、评分或定时报告。\n\
  * `交互式`：SQL 脚本在静态数据上运行，同时用户等待响应。此模式通常需要较低的延迟：最长可达 20 分钟。通常用于临时查询和探索，其中问题可能是嵌套的。\n\
  * `流式处理`：SQL 脚本在动态数据上连续运行，跨越一个滑动时间窗口。流式处理模式需要非常高的性能。通常用于算法交易、实时广告定向投放以及类似应用。\n\n\
  `Hive`、`Spark SQL` 和 `Impala` 支持 `HiveQL`；`Presto` 和 `Drill` 支持 ANSI SQL。所有引擎都支持用户自定义函数（UDF）。`Hive`\
  \ 和 `Spark` 提供查询容错功能；其他引擎则没有。`Hive`、`Spark SQL` 和 `Impala` 是最成熟、功能最丰富的；`Presto`\
  \ 和 `Drill` 则成熟度最低。\n\n用户自定义函数（UDF）是由数据库用户提供的表达式、函数或代码片段，用于补充内置函数。UDF 的支持因平台而异，可能包括运行用\
  \ `C`、`Java`、`Python` 和 `R` 等语言编写的程序的能力。\n\n现在 Hadoop 上的 SQL 引擎数量过多，无法逐一详述。我们将在本章介绍\
  \ `Impala`、`Drill` 和 `Presto`，并在第五章介绍 `Spark SQL`。此外，还有几个项目值得简要介绍：\n\n\n\n#### SQL-on-Hadoop\
  \ 引擎\n\n- **Apache Tajo**：Tajo 是一款开源高性能 SQL 引擎。Apache 软件基金会于 2013 年 3 月接纳 Tajo 进行孵化，并于\
  \ 2014 年 3 月将其提升为顶级项目。总部位于韩国的初创公司 Gruter 主导 Tajo 的开发并提供商业支持。\n- **Apache Kylin**：Kylin\
  \ 提供快速的交互式 ANSI SQL 和 MOLAP 立方体功能，并集成了 BI 工具和企业级安全特性。Kylin 最初由 eBay 开发，于 2014 年\
  \ 11 月被接纳为 Apache 孵化器项目，并于 2015 年 11 月毕业成为顶级项目。\n- **Apache Phoenix**：Phoenix 是一个旨在与\
  \ Apache HBase 集成的关系数据库框架；它包含一个查询引擎、元数据仓库和 JDBC 驱动程序。Phoenix 将用户请求转换为原生 HBase 调用，绕过了\
  \ MapReduce；这使其运行速度远快于早期版本的 Hive。`Salesforce.com` 的工程师为内部应用开发了 Phoenix；该公司于 2013\
  \ 年将该项目捐赠给了开源社区。Apache 软件基金会于 2014 年 5 月将 Phoenix 提升为顶级项目。Hortonworks 在其产品中包含了 Phoenix。\n\
  - **Apache Trafodion**：Trafodion 是一个 SQL-on-HBase 引擎，为 BI 提供 ANSI SQL 支持以及 ODBC/JDBC\
  \ 连接。惠普实验室于 2014 年 6 月将 Trafodion 作为开源项目发布，并于 2015 年 1 月发布生产版本。Apache 软件基金会于 2015\
  \ 年 5 月接纳 Trafodion 为孵化器项目。\n- **Apache HAWQ**：目前处于 Apache 孵化器状态，HAWQ 是一个源自 Pivotal\
  \ Greenplum 数据库的 SQL on Hadoop 引擎。Pivotal Software 于 2015 年 6 月将该项目捐赠给了开源社区。\n-\
  \ **IBM Big SQL**：Big SQL 是 IBM 为其 Hadoop 发行版 InfoSphere BigInsights 提供的 SQL 接口；它可以查询\
  \ HDFS、HBase 以及 Big SQL 自身创建的特殊表。该产品包含一个将数据从关系数据库复制到 Big SQL 表的工具。\n- **Oracle Big\
  \ Data SQL**：Big Data SQL 是 Oracle 的产品，仅在 Oracle 大数据一体机上可用。它在单个查询中联合查询 Oracle 数据库、Oracle\
  \ Hadoop 和 Oracle NoSQL 数据库。该产品通过 Oracle 数据库的外部表扩展运行，并提供一种称为“查询特许经营”（Query Franchising）的能力，通过该能力，数据子系统上的代理使用等效运算符执行查询。\n\
  \n许多不同的因素都会影响引擎的运行时性能。这些因素包括数据的数量和类型、存储格式、系统基础设施、部署特性以及所测试查询的性质。毫不意外的是，由于上述因素的差异，已发布的基准测试结果往往相互矛盾。\n\
  \n## Apache Spark\n\nApache Spark 是一个分布式内存计算框架，带有用于 SQL、流处理、机器学习和图分析的库。凭借超过 1000\
  \ 名贡献者，它是 Apache 项目中最活跃的、Hadoop 生态系统中最活跃的，也是大数据领域中最活跃的项目。鉴于其重要性，我们在第五章中单独讨论 Spark，该章涵盖内存分析。\n\
  \n#### Apache Impala\n\nImpala 是一个用于 Hadoop 的大规模并行处理 (MPP) SQL 平台。该软件由 Cloudera\
  \ 开发和维护，采用 Apache 许可证，是免费且开源的。Cloudera 于 2012 年 10 月宣布该项目，并于 2013 年 5 月发布其通用版本。2015\
  \ 年，Cloudera 将 Impala 捐赠给了 Apache 软件基金会。\n\nApache Impala 对以流行的 Apache Hadoop 文件格式存储的数据运行快速的交互式\
  \ SQL 查询。Impala 与 Apache Hive 元存储集成，以在各组件之间共享数据库和表。这使得用户能够自由选择使用 Impala 或 Hive，而无需移动或复制数据。\n\
  \nImpala 支持 HiveQL，并内置了用于数学运算、数据类型转换、日期和时间操作、条件表达式以及字符串处理的函数。对于更高级的操作，Impala 支持带有统计功能（如计数、求和、平均值和中位数）的聚合函数，以及用于有序和分组统计的窗口函数。最后，Impala\
  \ 支持基本的用户定义函数 (UDF) 和用户定义聚合函数 (UDAF)，用于自定义操作。\n\n使用 Impala 的用户通过 Impala Shell 或任何符合\
  \ ODBC 或 JDBC 标准的客户端提交命令。\n\nImpala 直接对存储的数据进行操作，不使用中间计算层（例如 MapReduce 或 Spark）。它与\
  \ HBase 和 HDFS 协同工作，支持常见格式：文本、SequenceFiles、RCFiles、Apache Avro 和 Apache Parquet。Impala\
  \ 也能与亚马逊 Web 服务的 S3 文件格式协同工作。\n\n2014 年初，IBM 研究院发布了一项性能测试结果，该测试比较了 Hive、Hive on\
  \ Tez 和 Impala 在不同文件格式和压缩编解码器下的性能。测试协议采用了事务处理性能委员会发布的标准测试协议。\n\n在 IBM 的测试中，对于 TPC-H\
  \ 基准测试，Impala 的运行速度比 Hive on MapReduce 快 3-4 倍，比 Hive on Tez 快 2-3 倍。对于 TPC-DS 基准测试，Impala\
  \ 的运行速度比 Hive on MapReduce 快 8-10 倍，比 Hive on Tez 快约 4 倍。\n\nTPC-H 和 TPC-DS 是事务处理性能委员会发布的标准决策支持基准测试。这些基准测试由一系列典型的即席查询组成，模拟了典型用户的工作负载。\n\
  \n2014 年晚些时候，Cloudera 发布了其自身的基准测试结果，比较了 Impala、Spark SQL、Facebook Presto 和 Hive\
  \ on Tez 的性能。对于单用户查询，Impala 的性能优于所有替代方案，平均运行速度快 7 倍。对于多用户查询，Impala 进一步拉大了性能差距，平均运行速度快\
  \ 13 倍。\n\nCloudera、MapR、Oracle 和亚马逊 Web 服务都分发 Impala；Cloudera、MapR 和 Oracle 提供商业构建和安装支持。\n\
  \n\n\n#### Apache Drill\n\nApache Drill 是一个用于交互式分析的开源分布式软件框架。\n\n2010 年，一组谷歌工程师发表了一篇论文⁴⁴，描述了一个用于交互式即时查询分析的分布式系统，该系统旨在数秒内聚合万亿行的表。他们将这个系统命名为\
  \ `Dremel`。`Dremel` 启发了谷歌的 `BigQuery`，这是一个托管在谷歌云中的交互式即时查询系统。\n\n由 MapR 公司的 Ted Dunning\
  \ 领导的一组贡献者提议开发 `Dremel` 的开源版本，并更名为 `Drill`。2012 年 9 月，Apache 软件基金会接纳 `Drill` 作为孵化器项目。`Drill`\
  \ 于 2014 年 12 月毕业，成为顶级项目。2015 年 6 月，团队发布了该软件的 1.0 版本。`Drill` 的开发者社区包括 MapR、Intuit、Hortonworks、Elastic、LinkedIn、Pentaho、Cisco\
  \ 和威斯康星大学等机构的员工。\n\n`Drill` 允许用户查询带有或不带预定义模式的数据，并且能够查询非结构化或嵌套数据。它提供完整的 ANSI 标准 SQL，并与广泛使用的\
  \ BI 工具集成。`Drill` 可以跨多个数据源联合查询。\n\n潜在用户可以直接从项目网站下载并安装 `Drill`；MapR 也将 `Drill` 作为其\
  \ Hadoop 发行版的附加组件进行分发。\n\n用户可以将 `Drill` 部署为独立应用程序，或部署在任何 Hadoop 集群上。\n\n最终用户可以通过\
  \ ODBC 和 JDBC 驱动程序，使用 BI 工具（如 Tableau、MicroStrategy 或 Microsoft Excel）查询 `Drill`。`Drill`\
  \ 还支持用于自定义应用程序的 REST API，以及 Java 和 C 应用程序。\n\n`Drill` 目前支持以下数据源：\n\n-   Hadoop：Apache\
  \ Hadoop、MapR、Cloudera CDH 和 Amazon EMR\n-   NoSQL：MongoDB 和 HBase\n-   云存储：Amazon\
  \ S3、Google Cloud Storage、Azure Blog Storage 和 Swift\n\n尽管 Apache Drill 项目团队声称具备万亿行的可扩展性，但截至\
  \ 2015 年 6 月，尚无公开的基准测试或参考用户。`Drill` 作为交互式查询工具潜力巨大，但目前商业应用有限。\n\n`Drill` 拥有活跃的贡献者基础，其代码库自\
  \ 2014 年中期以来稳步扩展⁴⁵。\n\n#### Presto\n\nFacebook 拥有最大之一的活跃数据仓库，在几个大型 Hadoop 集群中存储了超过\
  \ 300 PB 的数据。为了满足对此资产进行 SQL 连接的需求，Facebook 工程师于 2007 年创建了 Hive 软件，用于查询这个庞大的数据存储。\n\
  \n如前所述，在其原始架构中，Hive 使用 `MapReduce` 作为计算引擎，这使其仅适用于批处理查询。2012 年，Facebook 工程师开发了一种更好的工具，用于快速交互式\
  \ SQL，称为 `Presto`。经过广泛的内部测试并在内部用户社区中推广后，Facebook 将代码分享给其他一些组织进行测试和反馈。2013 年底，Facebook\
  \ 将 `Presto` 代码捐赠给开源社区，并根据 Apache 2.0 许可证向所有用户开放。\n\nFacebook 报告称，它已成功将 `Presto`\
  \ 集群扩展至 1000 个节点。该公司还报告⁴⁶称，超过 1000 名员工在 `Presto` 上运行查询，每天在超过 1 PB 的数据上执行超过 30,000\
  \ 次查询。2015 年 5 月，开发者报告称，通过持续改进，新版本的速度显著提升。⁴⁷\n\n`Presto` 支持跨多种数据源（包括 Hive、Cassandra、关系型数据库或专有文件系统（如\
  \ Amazon Web Services 的 S3））进行 ANSI SQL 查询。`Presto` 查询可以联合来自多个来源的数据。用户可以通过 C、Java、Node.js、PHP、Python、R\
  \ 和 Ruby 提交查询。`Airpal` 是 Airbnb 开发的一个基于 Web 的查询执行工具，允许用户通过浏览器向 `Presto` 提交查询。\n\n\
  `Presto` 的用户群目前包括 Facebook、Airbnb 和 Dropbox。\n\n组织可以通过 Qubole 在本地或云端部署 `Presto`。2015\
  \ 年 6 月，Teradata 宣布⁴⁸计划开发并支持该项目。根据公布的三阶段计划，Teradata 提议将 `Presto` 集成到 Hadoop 生态系统中，使其能在\
  \ YARN 下运行，并通过 ODBC 和 JDBC 增强连接性⁴⁹。\n\nOpenHub 统计数据显示⁵⁰，`Presto` 是一个非常活跃的项目，代码库稳步扩展。\n\
  \n\n\n## 摘要\n\n尽管分析人士对于 Hadoop 的增长速度和企业渗透率存在一些争议，但毫无疑问，Hadoop 生态系统正在快速增长。我们从在生态系统中发挥关键作用的\
  \ Cloudera、Hortonworks、MapR、亚马逊云服务（Amazon Web Services）等公司的披露中了解到这一点。\n\n这种增长有两个原因。第一个原因是如第二章所述，文本、图像、音频、视频以及其他不适用于关系型数据库的数据如海啸般涌现。第二个原因是经济因素。Hadoop\
  \ 每 TB 的成本远低于其他数据管理工具。\n\n在 2014 年之前的 Hadoop 1.0 版本下，Hadoop 处理非关系型数据的能力是其主要的应用理由。对于分析而言，它并不是数据仓库设备的可靠竞争对手，因为它太不成熟、不稳定、原始、缓慢且难以使用。\n\
  \n自 Hadoop 2.0 实施以来，面向 Hadoop 的商业和开源软件包数量呈爆炸式增长。将替代编程框架与`MapReduce`结合使用的能力，使得运行最复杂的分析成为可能。\n\
  \n与此同时，该平台本身也已成熟。得益于与企业客户打交道的商业供应商的贡献，Hadoop 变得越来越稳定和安全。诸如`Tez`和`Spark`等旨在提升性能的项目，使\
  \ Hadoop 成为交互式分析的可靠平台。我们将在第五章详细讨论`Spark`。\n\n对于 SQL 分析而言，Hadoop 与关系型数据库的竞争力日益增强。在\
  \ Hadoop 1.0 下，`Hive`和`Pig`适用于高延迟的批处理程序；在语义上，它们支持 ANSI SQL 的一个子集。得益于`Stinger`项目，`Hive`现在在交互式分析方面与其他工具具有竞争力，`Impala`、`Spark\
  \ SQL`、`Drill`和`Presto`也是如此。并且，它们正在迅速接近完全符合 ANSI SQL 标准。\n\n此外，业务用户也越来越容易使用 Hadoop。得益于自助分析领域的多项创新，业务用户现在可以使用`Excel`和`Tableau`等工具直接操作\
  \ Hadoop。我们将在第九章介绍这些创新。\n\n随着 Hadoop 的成熟，它与传统数据仓库展开竞争，其颇具吸引力的经济性至关重要。拥有现有数据仓库的企业，在其现有平台即将退役时，有强大的经济动机用\
  \ Hadoop 替代现有平台。\n\nHadoop 的经济性使其对无法承担传统数据仓库成本的应用场景具有吸引力。更重要的是，Hadoop 的边际“沉没”成本使其成为回报未知的应用场景的理想选择。因此，Hadoop\
  \ 成为各类实验室、沙箱、臭鼬工厂以及创新的首选平台。\n\n### 脚注\n\n1 [`http://sortbenchmark.org/YahooHadoop.pdf`](http://sortbenchmark.org/YahooHadoop.pdf)\n\
