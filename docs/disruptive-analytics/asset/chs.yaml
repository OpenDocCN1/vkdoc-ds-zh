  #### 自动化机器学习


  精通机器学习的分析师供不应求。VentureBeat¹⁶、《华尔街日报》¹⁷、《芝加哥论坛报》¹⁸等诸多媒体都指出了这一短缺现象；麦肯锡的一份报告¹⁹预测，到
  2018 年为止，具备分析技能的人才将持续短缺。这种短缺如此紧迫，以至于《哈佛商业评论》建议²⁰你停止寻找，或者降低你的标准。


  我们能否将数据科学家的工作自动化？在 IT 商业边缘网站，Loraine Lawson 思考²¹人工智能是否会取代数据科学家。在《福布斯》杂志上，技术思想领袖
  Gil Press 自信地断言²²数据科学家将被工具取代；社交媒体整合商 Gnip 的首席数据科学家 Scott Hendrickson 对此表示赞同²³。


  面向数据科学家的数据挖掘网站 KDnuggets，最近发布了一项²⁴针对其成员的民意调查，询问大多数专家级数据科学家的工作何时会被自动化？只有 19%的受访者认为这些工作永远不会被自动化；51%的人表示将在未来
  10 年内实现自动化。


  自动化建模技术并非新鲜事物。1995 年，Unica Software 推出了模式识别工作台（PRW），这是一个通过自动化测试与学习来优化神经网络模型调优的软件包。三年后，Unica
  与 Group 1 Software（现归必能宝所有）合作，推出了`Model 1`工具，该工具能对四种预测模型进行自动化模型选择。历经数次品牌重塑，最初的 PRW
  产品如今以`IBM PredictiveInsight`的形式存在，作为 IBM 企业营销管理套件²⁵的一部分，以一组向导工具的形式销售。


  KXEN 成立于 1998 年，总部位于法国，其分析引擎围绕一种称为结构风险最小化的自动化模型选择技术²⁶构建。最初的产品具有基本的用户界面，主要依赖合作伙伴应用的
  API 调用；最近，KXEN 将自身重新定位为一种易于使用的营销分析解决方案，并试图直接向 C 级高管销售。这一努力取得了一定成功，促使该公司于 2013 年以约
  4000 万美元²⁷的价格出售给 SAP。


  来自 Unica、MarketSwitch 和 KXEN 早期的自动化尝试通过狭隘地定义问题“解决”了难题；它们将解决方案搜索的范围限制在少数算法上，以牺牲模型质量和鲁棒性为代价，将工程工作量降至最低。其次，通过将他们的工具定位为消除对专家分析师需求的手段，他们疏远了客户组织中那些对产品足够了解并能够充当拥护者²⁸的少数人。


  数据科学家称²⁹，他们 50-80%的时间都花在了数据整理上。理论上，这意味着组织可以通过改进数据仓库和管理实践来缓解数据科学家的短缺；在实践中，这并不容易做到。数据仓库建设成本高昂，而且数据科学家通常支持的前瞻性项目进展速度之快，是典型的数据仓库组织难以跟上的。大多数数据科学家认为数据整理是必要且不可避免的，而且在很大程度上他们是对的。




  自动化虽然无法完全替代人工，但可以显著减少数据整理（data wrangling）所耗费的时间、成本和精力。例如，与广泛使用的数据源的内置集成，最大限度地减少了提取和移动数据的时间和成本。数据仓库和商业智能平台的接口使数据科学家能够直接利用已经清洗过的数据，最大限度地减少重复劳动。能够自动检测和处理缺失数据、异常值、复杂分类字段或其他“有问题”数据类型的功能，使数据科学家能够“按原样”处理数据，并消除了手动处理的需要。


  除了基本的数据清洗和整合外，数据转换（“特征工程”）的要求完全取决于用于模型训练的算法。例如，某些算法仅适用于分类预测变量，因此输入数据集中的任何连续变量都必须进行分箱处理；而其他算法则有相反的要求。由于自动化特征工程与自动化模型规范和选择是内在关联的，因此二者必须联系起来。


  为给定问题和数据集确定正确算法的最佳方法是测试-学习法（test-and-learn approach），即数据科学家测试大量技术，并选择在最新数据上表现最佳的一种。（[没有免费午餐定理](http://www.no-free-lunch.org/)
  ³⁰ 正式阐述了这一概念。）潜在算法有数百种；最近的一项基准研究仅针对分类问题就测试了 ³¹ 179 种算法。


  在过去计算能力稀缺且昂贵时，建模人员通过将搜索范围限制在单一算法（或至多几种算法）来应对这一限制。他们通过贬低预测准确性的重要性，或坚持认为某一种技术优于所有其他技术来为这种做法辩护。这导致了不同算法倡导者之间无休止的、缺乏经验证据的争论。


  廉价且普及的计算能力一劳永逸地终结了这些争论；现在可以测试多种算法的能力，并选择最适合特定问题的算法。在高风险、高投入的分析领域——例如交易算法、灾难性风险分析和欺诈检测——模型准确性的微小改进都会对利润产生重大影响
  ³²，数据科学家有责任为客户提供最佳的预测结果。


  `SAS`和`IBM`最近将自动化建模功能引入了它们的数据挖掘工作台。2010 年，`SAS`推出了`SAS Rapid Predictive Modeler`（一款`SAS
  Enterprise Miner`的插件）。`Rapid Predictive Modeler`是一组 SAS 宏，支持诸如异常值识别、缺失值处理、变量选择和模型选择等任务。用户指定数据集和响应度量；`Rapid
  Predictive Modeler`会制定并执行一个测试计划，测量每次实验的结果。用户通过选择基本、中级或高级方法来控制执行时间。2015 年，`SAS`推出了`SAS
  Factory Miner`，一款基于`SAS Enterprise Miner`的更高级产品。


  `IBM SPSS Modeler`包含一组自动化数据准备功能，以及自动分类器、自动聚类和自动数值节点。自动化数据准备功能可以执行诸如缺失值插补、异常值处理、日期和时间准备、基本值筛选、分箱和变量重铸等任务。这三个建模节点使用户能够指定要包含在测试计划中的技术、指定模型选择规则，并设置模型训练的限制。


  开源`R`语言中的`caret`包是一套生产力工具，旨在加速模型规范和调优。该包包含用于虚拟编码、检测零方差预测变量以及识别相关预测变量的预处理工具；该包还包含支持模型训练和调优的工具。`caret`中的训练函数目前支持
  217 种建模技术；它还支持选定技术内的参数优化，但不支持跨技术优化。用户编写`R`脚本来调用该包，运行所需的训练任务并捕获结果。


  `Auto-WEKA`是另一个用于自动化机器学习的开源项目。`Auto-WEKA`于 2013 年首次发布，是由不列颠哥伦比亚大学和弗赖堡大学的四位研究人员共同推动的合作项目。`Auto-Weka`目前仅支持分类问题。该软件从
  39 种可用算法中选择一种学习算法，包括 2 种集成方法、10 种元方法和 27 种基础分类器。由于每种分类器都有许多可能的参数设置，搜索空间非常大；开发者使用贝叶斯优化来解决这个问题。


  机器学习挑战赛（`Challenges in Machine Learning`）是一个由美国国家科学基金会和商业赞助商支持的非营利组织。该组织每年组织 AutoML
  挑战赛，旨在构建能够自动化机器学习（用于回归和分类）的软件。最近一次会议于 2015 年 7 月在法国里尔举行，会上展示了自动化机器学习的最新进展，并举办了一场编程马拉松。


  `DataRobot`是一家由保险行业资深人士创立的波士顿初创公司，提供一种结合了内置专业知识和测试-学习法的机器学习平台。通过加快机器学习过程，`DataRobot`使组织能够显著提高数据科学家的生产力，并扩大分析师队伍，同时不牺牲质量。`DataRobot`组建了一支由
  Kaggle 竞赛获奖数据科学家组成的团队，利用他们的专业知识来识别新的机器学习算法、特征工程技术和优化方法。


  `DataRobot`平台使用并行处理来训练和评估 R、Python、H2O、Spark 和 XGBoost 中的数千个候选模型。它会搜索数百万种可能的算法、预处理步骤、特征、转换和调优参数组合，以为给定的数据集和预测问题识别最佳模型。


  `DataRobot`利用云（亚马逊网络服务）按需配置服务器，以满足大规模实验的需求；该软件也可用于本地部署和 Hadoop 环境。用户通过基于浏览器的界面或通过`R
  API`与该软件进行交互。


  2014 年 8 月，`DataRobot`在 A 轮风险投资融资中筹集了 2100 万美元。总部位于东京的 Recruit Holdings 于 2015 年
  11 月宣布了对`DataRobot`的投资。2016 年 2 月 11 日，`DataRobot`宣布在 B 轮融资中额外获得 3300 万美元。




  ## 新一代自助式分析


  在本章中，我们探讨了自助式分析的六项关键创新：


  - 通过 `Tableau` 及其仿效者实现的自助式可视化。

  - 通过 `Alteryx` 及类似产品实现的自助式数据混合。

  - `Hadoop` 中的商业智能（BI），尤其是像 `AtScale` 这样的中间件，使组织能够利用现有的 BI 资产。

  - 基于云的预建服务，如 `Domo`，使职能部门经理能够绕过 IT 瓶颈。

  - 面向业务的开源核心分析平台，如 `RapidMiner` 和 `KNIME`，支持专家与业务用户之间的协作。

  - 用于机器学习的开放透明专家系统，如 `DataRobot`，让更广泛的用户群体能够接触机器学习。


  像 `Tableau` 这样的自助式可视化工具，由于缺乏强大的数据混合能力，在处理单一的清洁数据表时效果最佳。因此，它们通常位于分析价值链的末端，便于专家与非专家用户之间的协作。例如，使用
  `Tableau` 的最终用户可以通过多种不同的方式对数据进行可视化；这为专家分析师节省了大量时间，因为他们只需提供一个表格或数据集，而无需制作数百张图表。


  将数据混合工具（如 `Alteryx`）和数据可视化工具（如 `Tableau`）相结合，能够提供一套强大的自助式能力。对于粗糙数据源的复杂数据混合，需要相对较高的
  `Alteryx` 技能水平，因此这种组合更适合业务分析师，而不适合普通信息用户。


  企业应努力实现“无处不在的 BI”——即最终用户应能使用相同的自助式工具，无论数据实际存储在何处。`Tableau` 部分实现了这一目标，因为它拥有灵活且易于配置的后端，可与多种数据存储方案配合使用。然而，直接将
  `Tableau` 指向 `Hadoop` 中的 `Hive` 元存储并非易事。`AtScale` 中间件使得访问 `Hadoop` 集群变得像访问关系型数据库一样简单。


  像 `Domo` 这样的分析即服务产品，旨在支持整个分析价值链。其价值主张在于为职能部门经理提供速度和简便性；通过预定义的报告和仪表板，他们可以快速交付关键信息，在很大程度上完全绕开
  IT 部门。


  像 `RapidMiner` 和 `KNIME` 这样的分析平台，介于分析编程语言（如 `Python` 和 `R`）与简单的桌面分析工具之间。凭借面向工作流的拖拽式界面，它们为业务分析师节省了时间，同时提供了丰富的分析功能。此外，它们还具有高度可扩展性，允许在工作流中嵌入用户自定义函数。


  像 `DataRobot` 这样的自动化机器学习工具，为专家数据科学家节省了大量时间，同时也扩大了组织内能够构建预测模型的人员范围。由于能够与生产系统紧密集成，它们极大地缩短了机器学习实现价值的时间。


  组织中的人员对分析有着多样化的需求；没有任何单一工具能够满足所有需求。即使企业在投资于具有广泛吸引力的简单工具，它们仍将继续雇佣专家。如果说有什么不同的话，那就是专家人才的市场比以往任何时候都更加紧俏。


