- '# Apress 商业：商业信息的公正之源


  Apress 商业类图书为从业者提供必要的信息和实用建议，每本书均由公认的专家为实践者撰写。商业世界各个领域的繁忙管理者和专业人士——无论其技术专业程度如何——都期待从我们的书中获得可操作的思路和工具，以解决问题、更新和提升专业技能、让工作生活更轻松，并抓住机遇。


  无论商业领域的主题是什么——创业、金融、销售、市场营销、管理、法规、信息技术等等——Apress 始终因提供客观信息和无偏见建议而备受赞誉，这些正是您在日常生活中追求卓越所需的。我们的作者没有个人偏见；他们明白自己只有一个使命——以简洁、准确且富有深刻见解的方式，提供满足读者真实需求的最新信息。


  在新闻媒体、互联网以及如今屡见不鲜的书籍中，要找到公正且真正为您着想的资讯越来越难。因此，我们希望您能享受本书，它经过精心编纂，以满足我们对质量和公正报道的标准。


  我们始终乐于收到您的反馈或对新作品的想法。或许您甚至想亲自写一本书。无论何种情况，请通过`editorial@apress.com`联系我们，编辑会迅速回复。顺便提一下，在本书末尾，您会找到一个有用的相关书目列表。请访问[`www.apress.com`](http://www.apress.com)注册订阅新闻通讯并获取未来购书的折扣。


  > Apress 商业团队


  ## 引言


  **颠覆**：在商业领域，指行业或商业战略的根本性变革，尤其涉及引入创造新市场的全新产品或服务。


  自 1979 年诞生以来，Teradata 一直引领数据仓库领域。该公司凭借技术实力建立了声誉，服务于沃尔玛和花旗银行等客户；分析师和实施人员均将其大规模并行数据库评为“同类最佳”。2007
  年从 NCR 分拆后，该公司实现了两位数的增长。


  2012 年 8 月 6 日，Teradata 发布了第二季度财报。业绩出色：收入增长 18%，每股收益增长 28%。Teradata 股价交易价为 80 美元，是四年前价值的五倍。


  “我们正在上调 2012 年固定汇率收入增长和每股收益的预期，”首席执行官迈克·科勒写道。


  事后看来，那一刻是 Teradata 的巅峰。在接下来的三年半里，该公司市值缩水 75%，因为它屡次未能达到收入和盈利目标。2015 年，科勒宣布重组并出售公司资产；几位高管离职。最终，在惨淡的第一季度财报发布后，科勒本人于
  2016 年 5 月卸任。


  管理层将销售疲软归咎于多种因素：销售周期长、经济疲软以及不利的汇率变动。但在此期间，全球商业分析支出有所增加，一些供应商报告了两位数的收入增长。


  将 Teradata 的困境归咎于领导不力或许很容易。但该公司过去几年的增长问题并非个例：同期，甲骨文和 IBM 收入下滑；微软和 SAP 未能持续增长，令投资者失望；SAS
  不得不撤回尴尬的两位数增长预测，仅录得个位数的低增长率。


  简而言之，尽管企业继续投资于分析领域，但它们并没有购买行业领导者所销售的产品。


  与此同时，源源不断的创新在商业分析市场中创造了新的价值网络：



  ## 开源分析


  开源软件在过去几年中取得了巨大的进步，在分析领域开辟了广阔天地。调查显示，在职的数据科学家更倾向于使用开源的`R`和`Python`，而非商业软件。像 Oracle、IBM
  和微软这样的技术领导者也竞相加入开源的行列。


  ## Hadoop 及其生态系统


  随着`Hadoop`的成熟，它成功地在与数据仓库一体机的竞争中胜出，甚至取代了它们。技术咨询公司 Gartner 估计，如今有 42% 的企业都在使用`Hadoop`。几年前，数据仓库供应商还对`Hadoop`嗤之以鼻；如今他们再也笑不出来了。


  '
- '# 内存分析


  随着内存成本的下降，任何组织都能负担得起快速、可扩展的高性能分析。采用开源项目`Apache Spark`（一个用于可扩展内存计算的开源项目）的情况呈指数级增长。`Spark`拥有超过一千名贡献者，是大数据领域最活跃的开源项目。


  #### 流式分析


  组织面临着日益增长的动态数据量，这在一定程度上是由物联网（`IoT`）驱动的。如今，在`Apache`生态系统中，至少有六个用于流式分析的开源项目。内存数据库正将自己定位为混合事务/分析处理（`HTAP`）的流式引擎。


  '
- '# 云端分析


  当`Amazon Web Services`在 2012 年推出其`Redshift`列式数据库时，它缺乏许多竞争对手数据仓库所具有的功能。然而，对许多企业来说，亚马逊提供了一个极具吸引力的价值主张：以`Teradata`仓库成本的一小部分，获得“足够好”的功能。主要的云服务商都报告了两位数的收入增长；Gartner
  估计有 44% 的企业在使用云服务。


  '
- '# 深度学习


  廉价的高性能计算能力使深度学习变得可行。`NVIDIA`发布了其用于深度学习的`DGX-1`芯片，其性能相当于 250 台服务器；`Cray`则宣布了其`Urika-GX`一体机，拥有高达
  1,728 个核心和 35 TB 的固态内存。与此同时，`Google`以开源方式发布了其`TensorFlow`框架，并声称已在“数百个”应用中使用了深度学习。


  '
- '# 自助式分析


  凭借易于学习的用户界面和强大的数据源连接器，`Tableau`颠覆了商业智能软件行业，并在老牌商业智能供应商艰难适应的同时，实现了十倍的增长。其他初创公司也纷纷定位自己，将自助服务模式引入其他领域，如`OLAP`和机器学习。


  ---


  这不是另一本炒作大数据的书。拍字节的数据如果不能回答某个业务问题，就一文不值；数字经济产生的海量数据只是管理者必须面对的一个事实。无论你管理一家跨国公司还是驾驶卡车，你的业务产生的数据都比以往任何时候都多；你要么利用它，要么舍弃它，但无论如何，你必须做出明智的决策。


  在一个被颠覆的商业分析市场中，管理者必须无情地将重点放在对洞察的需求上，然后构建满足这些需求的系统和流程。理解这些章节中描述的创新是实现这一目标的一步，但重点必须始终放在对洞察的需求以及提供洞察的价值链上。


  创新并非一蹴而就地完整诞生于发明家的头脑中；它们是长期修修补补过程的最终结果。我们在本书中描述的许多最重要的创新已有超过 50 年的历史；它们如今的出现是出于各种原因，例如计算成本的长期下降。我们在本书的几个地方提供了历史视角，以便读者能够区分哪些是真正的新事物，哪些仅仅是重新包装和更名。


  在本书的中间章节，我们概述了商业分析领域的一项关键创新。这些章节包含了关于现有软件产品和开源项目的详细信息。总的来说，我们的前提是这些行业领导者有充足的营销预算来建立其产品的知名度，因此我们不涵盖它们的产品。


  我们以一本管理者手册作为本书的结尾：从颠覆性创新中获利的特定策略。其中一些策略可能看起来激进；如果这让你感到不安，请放下这本书——它不适合你。但如果你准备好拥抱颠覆性创新，并从中获利，那就请继续读下去。


  '
