  \n\n\n## 分析简史\n\n构建分析价值链\n\n本章简要回顾现代企业计算时代的分析发展史。这一时期的业务分析发展历程，是从完全集成但封闭的系统，逐步走向开放、模块化且日益复杂的过程。\n\
  \n我们将本章分为三个主要部分：\n\n- 数据仓库诞生之前：统一封闭的系统为少数用户提供完整的分析价值链。\n- 数据仓库时代：开放标准实现了 ETL、数据管理和商业智能的解耦。\n\
  - 当今经济中颠覆既有价值链的关键趋势。\n\n在每个时期，我们都会探讨数据仓库、商业智能和预测分析的独立发展，并结合背景介绍两个出色的颠覆性分析实践案例。\n\
  \n### 数据仓库诞生之前\n\n在 1984 年首个数据仓库问世之前的几年中，分析领域呈现四大特征：\n\n- 以今天的标准来看，计算成本高昂，能够达到投资门槛的分析用例相对较少。\n\
  - 随着`IBM System/360`的推出，企业数据以复杂且专有格式的混乱状态迅速扩张。\n- 商业智能原始、昂贵且孤立。\n- 统计与机器学习主要作为学术工具，仅被少数与研究机构联系紧密的企业（如制药和保险行业）大规模使用。\n\
  \n1969 年，`IBM System/360 Model 75`大型计算机售价 350 万美元（相当于 2016 年的 2300 万美元）。这台计算机拥有数兆字节内存，每秒可执行数十万次加法运算¹。（相比之下，你口袋里的手机最多花费几百美元，拥有数吉字节内存，每秒可运行数百万次运算。）\n\
  \n随着 20 世纪 60 年代大型机系统上存储的数据量激增，数据组织本身成为了一个问题。文件结构往往复杂、多样且因应用而异，因此每次使用数据都需要进行定制分析²。为一个客户的文件系统编写的程序无法在另一客户的文件系统上运行。\n\
  \n企业数据杂乱无章的特性造成了恶性循环，催生了昂贵的定制化。提取、转换和加载（ETL）的程序必须作为定制代码编写；消费数据的报告也是如此。缺乏标准抑制了“现成”软件的市场；而没有现成软件，高管们便看不到标准化的价值。\n\
  \n早期统计和机器学习的工作大多在学术环境中进行。某些行业的少数大型公司大规模使用了统计方法，但在这一时期几乎没有机器学习在商业中应用的实例。\n\n数据仓库时代之前，颠覆性分析的最佳范例是信用评分。这一创新采用了保守的统计技术，且发生在企业信息技术主流之外。\n\
  \n#### 关系型数据库的诞生\n\n1970 年，IBM 研究中心的 E.F.科德发表³了一篇定义数据关系模型的论文。关系模型将所有数据表示为元组，即分组到关系中的有限有序元素列表。科德旨在定义一种用于查询的抽象层，使用户无需了解数据的内部组织方式和存储结构。通过分离数据的逻辑结构和物理结构，数据库管理员可以优化存储以反映查询流量和数据增长。\n\
  \n科德创造了`relational database`（关系型数据库）这一术语，用以描述基于关系模型组织的数据库。IBM 于 1974 年开始开发原型数据库（`System\
  \ R`）。该项目⁴分三个阶段推进：\n\n- 开发 SQL 接口（1974-1975 年）\n- 设计并构建一个可运行的系统（1976-1977 年）\n-\
  \ 在实际使用中进行评估（1978-1979 年）\n\n`System R`团队发表的论文启发加利福尼亚大学伯克利分校（UCB）的一个团队启动了竞争项目。由迈克尔·斯通布雷克领导的\
  \ UCB 团队将关系型数据库集成到一个名为交互式图形检索系统（`Ingres`）的现有项目中。`Ingres`的原始版本在开源许可证下分发，使用名为`Quel`的查询语言。\n\
  \n1977 年，拉里·埃里森与两位合伙人共同创立了软件开发实验室（1979 年更名为 Relational Software，1982 年更名为 Oracle\
  \ Systems，1995 年更名为 Oracle）。同样受科德的论文和`System R`启发，埃里森及其团队着手提供一款商业许可的关系型数据库管理系统（RDBMS）。\n\
  \n他们发布了数据库的第一个版本，品牌名为`Oracle`，使其成为首个商业化的 RDBMS。埃里森曾希望让`Oracle`与`System R`兼容，但 IBM\
  \ 拒绝透露其产品的详细信息。`Oracle`运行在数字设备公司的小型机上，而非 IBM 的大型机。\n\nIBM 则以较为缓慢的步伐继续开发`System/R`的商业版本。该公司于\
  \ 1981 年发布了适用于 VSE 和 VM/CMS 大型机操作系统的`SQL/DS`。两年后，IBM 发布了适用于 MVS 大型机操作系统的`DB2`。\n\
  \n早期关系型数据库的架构师们设计数据库以支持事务性应用，这是潜在投资的“低垂果实”。专门设计用于支持分析的分析型数据存储的概念，则是后来时代的产物。\n\n\n\
  \n#### 早期商业智能\n\n在组织拥有数据仓库之前，它们通过孤立系统以及报表编写系统来满足对管理信息的需求。\n\n规模更大、更精密的企业拥有决策支持系统（DSS）或高管信息系统（EIS），这些系统于\
  \ 20 世纪 60 年代引入。这些系统利用专有的文件系统和报表引擎，整合了从数据源到用户的整个商业智能流程。这些系统通常是定制构建的，因此构建、维护和修改的成本高昂；例如，仅仅增加一个报表就需要一个开发项目，并且可能耗时数月。\n\
  \n在大多数组织中，决策支持系统/高管信息系统是财务和管理会计系统的扩展，为高层管理者提供比财务会计所需更详细的公司财务状况视图。通常，负责这些应用的“数据处理”部门向首席财务官（CFO）或财务总监汇报。\n\
  \n对于决策支持系统/高管信息系统之外的信息需求，“数据处理”部门的程序员使用诸如`RPG`（即“报表程序生成器”，由 IBM 于 1959 年引入）等语言编写自定义程序。在许多情况下，程序直接从源系统（如薪资或应付账款系统）访问数据；而在其他情况下，“数据处理”部门从源系统创建定期的“快照”文件以支持报表编写。\n\
  \n如果一个报表需要来自多个源系统的数据，报表开发人员会将必要的合并操作直接构建到报表程序中。在大型组织中，确保来自不同系统的报表之间的一致性非常困难。各部门以不同方式定义指标，这导致在最高管理层出现相互矛盾的报表。\n\
  \n按照今天的标准，当时的报表节奏是缓慢的。大多数报表每月发布一次。在极少数情况下，对于最有价值的运营数据，报表可能会在夜间更新以便次日分发。开发报表既耗时又昂贵；由于成本原因，报表大多局限于高层管理者需要定期查看的高级指标。\n\
  \n#### 早期统计学与机器学习\n\n机器学习的根源在于 19 世纪初统计学家和社会科学家开发的技术。然而，在没有现代计算的情况下，科学家们只能使用相关性和回归等技术来分析最多几百个案例。20\
  \ 世纪 60 年代末和 70 年代统计软件包的引入，使得在更大的数据集上执行统计分析成为可能，尽管这些工具仅限有权访问大型计算机的人使用。\n\n1966 年，安东尼·巴尔（Anthony\
  \ Barr）和他在北卡罗来纳州立大学（NCSU）的研究生吉姆·古德奈特（Jim Goodnight）开始着手开发一个用于农业研究的统计软件包。美国国立卫生研究院（National\
  \ Institutes of Health）以及一个学术联盟（南方实验站大学统计学家组织）提供了启动资金。他们的主要目标是为 IBM System/360 大型计算机重新编写现有的统计库。\n\
  \n到 1970 年，古德奈特和巴尔有了该软件的工作版本，名为统计分析系统（Statistical Analysis System，简称 SAS）。北卡罗来纳州立大学免费向联盟内的其他大学分发该软件，并向对在大型机规模上运行统计感兴趣的制药公司和保险公司发放商业许可证。\n\
  \n六年后，超过 100 家组织使用了 SAS。1976 年，古德奈特与一些合伙人获得了该软件的版权，并成立了一家独立公司（SAS 研究所）来开发、支持和销售该产品。SAS\
  \ 与 IBM 形成了紧密的合作伙伴关系；IBM 需要 SAS 和其他独立软件供应商为其大型机创建有用的应用程序，而 SAS 则依赖于 IBM 的销售和营销实力以及\
  \ IBM 品牌的信誉。\n\n在统计软件发展的同时，来自不同学科的研究人员致力于开发更通用的机器学习方法。像决策树这样的技术源于社会科学以及分析“宽”格式分类调查数据的需要。CHAID（卡方自动交互检测）是最早以软件形式实现的树构建技术之一。在其最广泛使用的形式中，该方法可追溯到\
  \ Gordon V. Kass 于 1980 年发表的一篇论文，并借鉴了 20 世纪 50 年代和 60 年代开发的其他方法。\n\n另一种早期的决策树技术，即分类与回归树（CART），是基于\
  \ Leo Breiman 同名论文、由 Salford Systems 公司销售的一个应用程序的名称。CART 是一种非参数算法，用于学习和验证决策树模型。Salford\
  \ 于 1983 年发布了其第一个版本的 CART。\n\n在 20 世纪 40 年代，神经科学家试图通过开发大脑的类比模型来理解学习过程；从类比模型转换为软件后，这一研究方向发展成了我们现在所称的人工神经网络。早期的努力几乎没有展现出商业前景。在\
  \ 20 世纪 80 年代之前，研究人员无法解决所谓的“异或”（exclusive-or）问题，这是一个可以用日常语言表述为“二者只能选其一，不能兼得”的逻辑问题。面对这个问题的神经网络未能正确解决它。此外，能够训练神经网络的算法所需的计算能力，对大多数研究人员来说根本无法获得。\n\
  \n\n\n### 颠覆式分析：信用评分\n\n颠覆式分析的最佳案例之一诞生于数据仓库时代之前。1956 年，威廉·费尔和厄尔·艾萨克离开斯坦福研究所，创立了费尔·艾萨克公司（现简称\
  \ FICO）。他们着手开发能够预测行为的计算机程序，并向大型贷款机构推销⁹。\n\n当时的消费信贷与今天截然不同。全国性大型发卡机构发行的信用卡寥寥无几；大多数由银行发行的万事达卡和维萨卡都是地方银行作为整体银行关系的一部分而发行的。银行依赖地方信用局、客户关系以及大量人工判断来决定信贷；它们极为挑剔，因此由银行发行的信用卡申请难度更大。而零售商发行的信用卡在消费信贷中扮演着更重要的角色。\n\
  \nFICO 的首批客户是全国性的零售卡发卡机构，例如蒙哥马利沃德公司。这些公司拥有更大的资产组合，可以从统计模型带来的更高严谨性和精准度中获益。此外，由于运营地点分散、员工队伍庞大且客户群体多样化，大型零售发卡机构需要通过标准化的信用评分来确保一致性。\n\
  \n1970 年通过的《公平信用报告法》和 1974 年通过的《平等信用机会法》改变了信用局收集信息以及贷款机构使用信用局信息的规则。特别是《平等信用机会法》，为贷款机构设定了积极的举证义务，要求其证明贷款行为不基于种族、性别、婚姻状况等类别进行歧视。信用评分为贷款机构提供了一种评估信贷申请的中立¹⁰方式。\n\
  \n与此同时，三家公司——零售信用公司（现为 Equifax）、TRW 信息服务公司（现为 Experian）和 TransUnion——整合了信用局行业。尽管这三家公司没有一家拥有完整的全国数据库，但贷款机构通过与这三家合作，基本可以覆盖全美。\n\
  \n根据《公平信用报告法》，如果贷款机构获取了消费者的信用记录，就必须要么提供信贷要约，要么向消费者发送一封说明拒绝原因的函件。然而，如果贷款机构从一开始就没有获取该记录，则没有此义务——换句话说，如果贷款机构要求信用局仅提供符合特定标准的消费者的记录。FICO\
  \ 与贷款机构合作，定义了可执行的筛选规则，以在可预测的风险水平下最大化所选记录的数量。\n\n1987 年之前，FICO 为每个贷款机构构建定制化的预测模型。1987\
  \ 年，FICO 开发了一种通用信用评分，旨在为所有三大信用局提供一致且稳定的风险预测。（也就是说，无论原始信用数据来源如何，特定的评分值都具有相同的风险含义。）三大信用局各自在自己的数据库中实施了\
  \ FICO 评分模型，并向贷款机构按评分单价收费。\n\n信用评分的大规模部署，加上信用局信息的整合，催生了一个全国性的信用卡市场。拥有最佳信用评分运营的公司以牺牲地方和区域发卡机构为代价，建立了庞大的资产组合，许多后者退出了该行业。尽管有许多因素促成了这种整合，但以信用评分和预筛选形式呈现的分析技术发挥了关键作用，它促成了一种颠覆该行业的新商业模式。\n\
  \n### 数据仓库时代\n\n在第一章中，我们讨论了数据仓库、企业数据仓库和数据集市等术语的用法。对于这些术语的确切定义存在一些分歧；在本书中，我们将其定义如下：\n\
  \n-   分析型数据存储是一个为支持分析而设计和实现的数据集合。企业通过关系型数据库、Hadoop、NoSQL 数据库、专有软件或其他有组织的数据存储系统来实现数据存储。\n\
  -   数据仓库和数据集市都是分析型数据存储。\n-   数据仓库支持多个主题领域；数据集市支持一个主题领域。\n-   企业数据仓库支持企业所需的所有主题领域。\n\
  \n20 世纪 70 年代和 80 年代关系型数据库的引入彻底改变了企业数据管理，其影响程度堪比福特 T 型车对汽车工业的变革。T 型车标准化了汽车生产，降低了成本，使汽车进入了更大的市场，颠覆了当时昂贵的手工汽车制造行业。类似地，关系型数据库标准化了数据管理，为第三方软件开辟了市场，降低了成本，并颠覆了定制化专属应用程序的传统实践。\n\
  \n企业最初并未立即认识到分析型数据存储需要一种独特的数据库架构。专用分析型数据存储的理念是经过数年时间才逐渐形成的。数据库领域的远见者比尔·恩门在 20 世纪\
  \ 70 年代就提出了这一概念¹¹；IBM 的巴里·德夫林和保罗·墨菲在 1988 年发表的一篇文章中使用了“数据仓库”这一术语¹²。\n\n比尔·恩门于 1992\
  \ 年出版了《构建数据仓库》，这是第一部详细阐述数据仓库集成设计理论的专著。次年，关系型数据库的奠基人之一埃德加·F·科德发表了一篇论文¹³，概述了联机事务处理与联机分析处理之间的区别。\n\
  \n与此同时，在 20 世纪 70 年代末，加州理工学院的研究人员与花旗银行合作，详细设计了一种专门用于决策支持的并行关系型数据库。加州理工学院团队于 1979\
  \ 年创立了 Teradata，制定了商业计划，并于 1980 年获得了风险投资。1983 年底，Teradata 向富国银行交付了其首个系统。\n\n数据仓库的引入从根本上改变了分析价值链，即信息从记录系统传递到信息消费者的过程。决策支持系统/主管信息系统支持整个端到端流程，但彼此之间往往不兼容。数据仓库将该过程解耦为不同的部分：ETL（将数据从源系统传输到仓库）、仓库本身，以及完成到消费者价值链的商业智能。\n\
  \n\n\n#### 企业数据仓库运动\n\n20 世纪 90 年代，数据仓库理论与可扩展关系数据库技术相结合，形成了我们所说的企业数据仓库运动。这一运动反映出一种信念：组织应将投资集中式分析存储库视为战略要务。（毫不意外，数据仓库供应商对此强烈认同。）该运动的三大核心原则如下：\n\
  \n-   企业应将所有信息整合到单一的企业数据仓库（EDW）中。\n-   EDW 应作为企业中的**唯一真实数据源**。所有其他存储库都是“数据孤岛”，应予以摒弃。\n\
  -   来自源系统的所有数据必须先经过集中式的数据清洗和治理流程，之后才能被始终在数据仓库下游进行分析的用户使用。\n\n在这些原则的指导下，组织会构建企业级的抽象模型，即按主题领域（如营销、财务和运营）组织的数据模型。该模型以**一致**的方式，在全企业范围内表达业务实体（如客户、潜在客户、营销活动和交易）之间的关系。组织还会定义管理数据完整性和准确性的业务规则与标准。数据仓库团队依据已确认的数据模型和业务规则，将源系统的数据映射到该模型，然后构建用于提取、转换和加载数据的流程，从而将数据加载到仓库中。\n\
  \n能够支撑大型组织所有分析工作负载的数据仓库必须足够庞大，并且必须具备可扩展性，以便随着数据量的增长而扩展。Teradata 在 20 世纪 90 年代引领潮流，创下了其所能交付的数据仓库规模纪录：从\
  \ 1992 年的 1TB，到 1999 年突破 130TB。\n\n受“将企业数据仓库视为战略投资”这一信念的驱动，数据仓库软件与服务市场迅速增长。IBM、Oracle\
  \ 和 Teradata 占据了企业数据仓库市场的大部分份额，而 Sybase、Informix 和 Red Brick 则提供了创新的替代方案。开放标准的连接性和通用的\
  \ SQL 语言促进了供应商生态系统的成长：\n\n-   **ETL 供应商**，包括 Informatica 和 DataStage，提供用于构建和管理 EDW\
  \ 的工具。\n-   **商业智能（BI）供应商**，如 Business Objects、Cognos 和 MicroStrategy，提供报表和查询工具，使最终用户能够使用\
  \ EDW 中存储的数据。\n\nEDW 的倡导者认为，投资数据仓库比维护多个重叠的决策支持系统成本更低。这一论点在理论上合情合理，因为 ETL 流程可以被多个\
  \ BI 和分析用例共享。然而，任何投资数据仓库的组织是否真的因此实现了净节省，这一点值得怀疑。\n\n指标的一致性是企业数据仓库的另一个卖点。除非组织将所有数据导入一个拥有统一数据模型和业务规则的标准化数据平台，否则不同的应用程序可能会针对同一个业务事件产生不一致的指标。\n\
  \n倡导者还认为，EDW 通过标准化、数据清洗和遵守业务规则，建立了对数据的信任和信心。通过建立对数据的信心，企业数据仓库有助于构建基于数据和指标的管理文化。\n\
  \n20 世纪 90 年代，用于企业资源规划（ERP）和客户关系管理（CRM）的企业软件被广泛采用，加速了数据仓库和业务分析的发展。企业软件系统能够捕获关键业务流程的详细信息，并将数据质量控制下沉到数据产生的源头。EDW\
  \ 开发者可以只与一个源系统集成，而非多个；此外，由于企业软件系统拥有预定义的数据模型，ETL 流程可以部分预先构建。\n\n在 20 世纪 90 年代，大型组织大都投资了数据仓库项目，但其中许多未能达到预期：\n\
  \n-   1997 年，一项针对信息技术期刊上关于数据仓库文章的分析发现，有 279 个成功案例和 100 个失败案例¹⁴。\n-   2002 年，IT 分析公司\
  \ Cutter Consortium 的一项调查¹⁵显示，数据仓库项目的失败率为 41%。\n-   2005 年，咨询公司 Gartner 预测¹⁶，超过\
  \ 50%的数据仓库项目将接受度有限或在两年内失败。\n\n许多组织在没有明确商业理由的情况下就构建了企业数据仓库。EDW 的倡导者引用 1989 年电影《梦幻之地》中的一句台词，其中主角在一片玉米地里建了一个棒球场，期望棒球传奇人物的鬼魂会来打球，他们声称：“你建好了，他们就会来。”他们的论点是，如果一个组织建成了\
  \ EDW，最终用户就会出现，即使在项目启动时他们的用例尚未明确界定。\n\n实现指标一致的目标也被证明难以企及。公司发现，创建企业级数据模型困难重重，因为它需要潜在用户达成共识。美国一家大型消费银行在实施战略\
  \ CRM 项目时，成立了一个跨职能团队来定义企业数据模型。该团队为此苦战了 15 个月，之后向管理层报告称，他们陷入了不可调和的僵局，无法就如何定义“客户”达成一致。\n\
  \n简而言之，“孤岛式”报表系统中出现的不一致和相互冲突的衡量指标，并非仅仅源于技术过时。在某些情况下，它们反映了组织内部真实存在且持续不断的冲突与分歧，而无论是\
  \ EDW 还是任何其他技术，都无法为此提供简单的解决方案。\n\n集中式数据仓库项目进展缓慢。构建 EDW 的基础设施可能需要一年或更长时间。增加增量主题领域很少需要少于三到六个月。即使预算充裕且开发团队技术娴熟，职能经理们面对的积压工作也长达数年之久。\n\
  \n随着业务节奏的加快，集中式 EDW 的缓慢步伐使得 EDW 的理想与其在现有预算内所能实现的效果之间的差距日益扩大。精心设计的企业数据模型可能会因一次并购而变得过时。一家领先的银行（以卓越的数据仓库能力闻名）只是将被收购银行的数据用一个并行的模式加载到其数据仓库中，而不是将两个数据结构合并。寻求企业级视图的最终用户不得不编写\
  \ SQL 代码来跨越这两个模式进行连接，这是一项极其困难的任务。这种情况在被收购后持续了 11 年之久。\n\n\n\n"
- "# 排版后的文本\n\n那些不愿等待其 IT 部门通过企业数据仓库（EDW）交付所需成果的高管们，转而求助于外部供应商，包括咨询公司、营销服务提供商（MSP）和分析服务提供商（ASPs）。职能经理们还投资建设了自己的“非正规”数据集市，这些数据集市游离于\
  \ IT 治理范围之外。分析领域的领导者 SAS 公司直接向职能高管推销其 ETL 和数据管理工具。直到 2011 年，SAS 从数据集市软件中获得的收入几乎与其从预测分析软件中获得的收入持平。\n\
  \nOLAP 的理想一直秉持着“自助式”商业智能的目标，即业务用户无需 IT 支持即可访问数据。有远见者倾向于认为 SQL 与日常语言足够相似，任何业务用户都能对数据仓库进行查询。然而，几乎没有\
  \ EDW 实现过这一愿景。通常，IT 部门设计数据库模式是为了高效管理数据，而非便于导航。因此，只有训练有素的用户才能直接查询系统。各组织继续保留着专家团队，其唯一工作就是为职能经理创建报告和查询。对报告的需求往往超过供应；分析团队积压了大量工作，新提交的请求可能要排队数月之久。\n\
  \nEDW 远非企业中的单一真实信息来源，它仅仅是众多工具之一。通常，本应被 EDW 取代的系统从未退役，因此 EDW 只是增加了业务用户可以查询的数据库层。分析人员继续使用从源系统提取的数据编写定制报告，因为这是获取所需信息的唯一途径。\n\
  \n到 21 世纪初，分析型数据存储的潜在价值已得到明确确立。然而，高管们对于用一个统一的 EDW 架构来支持企业所有分析的愿景越来越持怀疑态度。\n\n##\
  \ 设备与列式数据存储\n\n随着对集中式企业数据仓库价值的质疑日益增多，数据库架构师将重心转向了分析型数据存储的应用和解决方案，包括营销活动管理、风险管理和行业解决方案。新的重心强调快速部署、简洁性和性能。\n\
  \n上世纪 90 年代，当企业大力投资 EDW 时，许多数据库架构师将用于联机事务处理（OLTP）系统的软件重新用于数据仓库。在大多数情况下，他们依赖定制数据建模和复杂的调优来支持\
  \ OLAP 类型的工作负载。Teradata 是个例外——该平台是专门为 OLAP 设计的——但来自 Oracle 和 IBM 的通用数据库软件占据了数据仓库软件市场的最大份额。\n\
  \n数据仓库资深人士福斯特·欣肖于 1999 年共同创立了 Netezza 公司。他创造了“数据仓库设备”一词，用以描述交付分析型数据存储的一种全新方式。欣肖认为，像消费电器一样，数据仓库设备应专为特定目的而构建，并在交付时立即产生价值。\n\
  \n为实现这一目标，数据仓库设备必须针对分析工作负载（如大块读取、表扫描和复杂查询）进行性能优化。它们必须是可扩展、容错且易于安装的，几乎无需或完全无需调优。\n\
  \nNetezza 于 2003 年发布了其首款数据仓库设备。Netezza 内部嵌入的实际技术并非独一无二；Teradata 多年来一直在提供大规模并行处理（MPP）数据库，而\
  \ Tandem 则是容错数据库的先驱。Netezza 的关键创新在于将这些技术整合到一个单一的软硬件融合、预装在硬件上、可立即使用的软件包中。\n\n明确针对分析工作负载是数据仓库设备价值的关键。传统的定制数据仓库之所以需要复杂的设计、配置和调优，正是因为它们是从通用数据库改造而来的。针对分析工作负载，使\
  \ Netezza 能够设计出一款交付后即可投入生产的设备。\n\nNetezza 通过两种方式大幅缩短了启动并运行分析型数据存储所需的时间。首先，它通过捆绑软件和硬件，消除了复杂配置和调优的需要。客户无需分别购买软件和硬件，再花费时间进行安装和配置。Netezza\
  \ 的客户购买的是设备，即已预装软件的硬件。\n\n其次，Netezza 消除了为用户预先汇总维度的需要。在大多数情况下，管理人员需要查看汇总统计信息，例如一组门店的总销售额，而不是这些门店的所有交易列表。传统数据仓库通过将数据预汇总到业务用户所需聚合级别的物理表中来满足这一需求。这种方法使数据库架构师能够在通用数据库的性能限制内满足需求。\n\
  \n然而，预汇总需要时间来实现，并且会增加数据库的开销。此外，管理人员通常很难精确说明他们希望如何看到业务事实的汇总。许多（如果不是大多数的话）最重要的业务问题都需要进行临时分析，其聚合规则无法预先指定。\n\
  \nNetezza 的客户无需将数据预汇总到维度中。相反，他们只需以最细粒度加载数据，并根据单个查询的需求汇总数据。凭借其高性能设计，Netezza 可以超越那些具有预汇总维度的数据仓库，并且无需复杂的需求分析和数据建模即可立即实现。\n\
  \n\n\n从 2004 年到 2007 年首次公开募股（IPO），Netezza 的收入每年增长超过 40%¹⁹。其他初创公司看准这一机遇，纷纷进入市场，包括\
  \ 2003 年的 Greenplum 和 DATAllegro，以及 2005 年的 Aster。\n\n21 世纪初，列式数据库在数据仓库领域引发了²⁰极大的兴趣。20\
  \ 世纪 90 年代初，初创公司 Expressway Technologies 发布了首个商业列式数据库，品牌名为`Expressway 103`。1995\
  \ 年，科学数据库供应商 Sybase 收购了该公司，并将该软件更名为`Sybase IQ`。\n\n2005 年，麻省理工学院的 Michael Stonebraker\
  \ 与几位学术同事共同推出了²¹C-Store，这是一个开源且针对读操作优化的列式数据库。凭借商业支持，Stonebraker 创立了 Vertica，并将其优化版本作为一体机推出。不久之后，一群投资者收购了失败的一体机供应商\
  \ Xprime 的知识产权，并将公司更名为 ParAccel，其目标是将面向列的解析一体机推向市场。\n\nSybase 和 Vertica 在超大型数据库领域取得了成功。2008\
  \ 年，Sybase IQ 交付了首个 PB 级数据仓库，创造了世界纪录²²；Vertica 则报告其已安装基础²³快速增长。\n\n在本世纪的头十年，提供一体机和列式数据存储的初创公司对领先的数据仓库供应商发起了挑战。到十年末，领先者要么通过收购创新者，要么推出自己版本的技术，从而吸收了这些创新者。\n\
  \n- Teradata 率先做出回应，于 2008 年推出²⁴了自己的数据仓库一体机。后来在 2011 年，Teradata 收购了 Aster。\n- 同年，Oracle\
  \ 宣布²⁵推出基于 Sun Microsystems 硬件的一体机。Oracle 于 2010 年收购了 Sun。\n- 在自研一体机失败后，IBM 于 2010\
  \ 年以 17 亿美元收购²⁶了 Netezza。\n- 软件巨头 SAP 于 2010 年以 51 亿美元收购了 Sybase。\n- EMC 于 2010\
  \ 年收购了 Greenplum。2013 年，EMC 将 Greenplum 剥离给 Pivotal Software，后者于 2015 年将软件资产开源。\n\
  - 2011 年，惠普终止了其 NeoView 一体机项目，并以未公开的价格收购了 Vertica。\n- 拥有大量收购软件资产组合的公司 Actian，于 2013\
  \ 年收购了 ParAccel。\n\n2010 年至 2013 年间的收购浪潮，实际上终结了一体机和列式数据存储对数据仓库行业领导者的颠覆性威胁。但正如我们将在本章后面看到的，其他更大的威胁此时才刚刚开始浮现。\n\
  \n#### MOLAP 与 ROLAP\n\n正如本章开头所述，数据仓库的引入催生了新一代的商业智能（BI）工具。SQL 查询语言和数据库连接的强大标准，促进了\
  \ Business Objects、Cognos 和 MicroStrategy 等独立 BI 软件供应商的发展。这些 BI 供应商致力于提升最终用户的易用性，并将数据库设计与构建工作主要交由数据库供应商和系统集成商完成。\n\
  \nBI 供应商分化为支持所谓`MOLAP`和`ROLAP`架构的两大阵营。在`MOLAP`（多维在线分析处理）模型下，应用在物理表中维护预定义的多维数据汇总（“多维数据集”）；当用户进行分析时，应用会与这些预先汇总好的多维数据集协同工作。应用会定期刷新多维数据集以反映新数据。\n\
  \n`MOLAP`的缺点在于需要预先汇总，这限制了用户分析只能针对预先定义好的维度。虽然 BI 供应商致力于让工具易于使用，但创建多维数据集的过程仍需要经过充分培训的开发人员来执行。毫不意外，负责\
  \ BI 系统的 IT 部门往往会积压大量工作，因此创建一个新的多维数据集所需的时间可能长达数月。\n\n另一方面，`ROLAP`（关系型在线分析处理）架构不将多维数据集作为物理对象进行维护。相反，它保留源数据库的元数据以及逻辑多维数据集规格，并根据用户请求按需生成多维数据集。由于`ROLAP`工具按需创建数据的用户视图，因此它们能提供“更新鲜”的分析。相比之下，`MOLAP`工具则通过预定的批处理过程来构建多维数据集，这个周期可以是一小时、一个季度，或介于两者之间的任何时间。\n\
  \n在 20 世纪 90 年代，基于`MOLAP`的 BI 工具比`ROLAP`工具更具优势，因为它们不依赖数据库的调优和性能来提供良好的用户体验。`ROLAP`相较于`MOLAP`的延迟优势并不具有决定性，因为源数据仓库的更新频率通常也很低。\n\
  \n数据仓库一体机和列式数据存储改变了这种计算方式。高性能的查询引擎决定性地将天平倾向了`ROLAP`工具。这些工具能够直接处理细粒度数据，即使面对最大的数据库，也可以在几秒钟内生成数据的用户视图。随着数据仓库更新节奏的加快，能够提供数据最新视图的\
  \ BI 系统具备了真正的优势。越来越多的领先 BI 供应商提供了同时具备`MOLAP`和`ROLAP`能力的工具。\n\n这一时期的 BI 工具还越来越多地将用户界面与从数据库检索数据后执行计算的功能分离开来。借助基于浏览器的\
  \ UI，计算功能驻留在 web 服务器上，而浏览器本身的用户界面不执行任何计算。\n\n\n\n#### 统计、机器学习与数据挖掘\n\n从 1984 年到\
  \ 2000 年，SAS 研究所的收入从 5000 万美元增长到超过 10 亿美元。在此期间，该公司成为高级分析商业软件的明确领导者。SAS 成功将其软件从 IBM\
  \ 大型机移植到多供应商的客户端-服务器架构。其他软件供应商，尤其是 SPSS，仍在竞争；但当 SPSS 因其易于使用的桌面工具而获得声誉时，商业客户却将 SAS\
  \ 视为适合商业工作负载的“工业强度”工具。\n\n在 1980 年代，机器学习作为一种可行的替代统计方法出现了。软件开发商提供了本章前面提到的 CHAID 和\
  \ CART 算法的稳定实现。神经网络研究者开发了反向传播技术以及“隐藏”层的概念。反向传播使神经网络能够以计算高效的方式解决异或逻辑问题，而隐藏层则使神经网络在许多情况下能够优于线性模型。\n\
  \n由 Thinking Machines 公司和 Cray Research 等公司开发和销售的商用超级计算机，为机器学习提供了可行的平台。通过在许多互联的机器上使用大规模并行计算，超级计算机按当时的标准提供了卓越的计算能力。为了为其机器寻找商业应用，超级计算机公司支持了机器学习的研究与开发。它们还提供了在其机器上运行的机器学习软件“套件”。\n\
  \n数据仓库领域的远见者早在 1980 年代就认识到了数据库中机器学习的潜力。领先的数据仓库软件供应商通过将功能构建到其产品中来回应这一需求：\n\n*   Teradata\
  \ 于 1987 年推出了其`Warehouse Miner`软件。\n*   IBM 于 1991 年随之推出了`Intelligent Miner for\
  \ DB2`。\n*   微软于 2000 年在`SQL Server`中添加了机器学习功能。\n*   Oracle 于 1999 年收购了 Thinking\
  \ Machines 的软件资产，将其重构以在`Oracle Database`中运行，并于 2002 年作为`Oracle Data Mining`发布。\n\
  \n大型大规模并行数据仓库提供了机器学习所需的计算能力。然而，与 SAS 和 SPSS 等工具相比，数据库内工具仍显原始；尽管在数据仓库中进行预测建模具有理论优势，但很少有在职分析师使用这一功能。\n\
  \n当超级计算机公司努力寻找可行的商业模式时，低成本的中小型计算机销量激增，并且这些计算机变得越来越强大。包括 HNC Software 在内的独立软件开发商开发了在这些机器上运行的软件。成立于\
  \ 1987 年的 NeuralWare 公司提供了首个商业可用的神经网络软件。\n\n从业者使用“数据挖掘”这一术语来描述在数据中发现新的、有效的和有用的模式与关系的过程。该术语的起源未知。学术统计学家使用密切相关的术语“数据挖掘”、“数据钓鱼”或“数据窥探”作为贬义词，来描述在没有假设的情况下进行的研究。\n\
  \n1994 年，英国公司 Integral Solutions Limited 成立了一个数据挖掘部门，开发和销售一个名为`Clementine`的数据挖掘软件产品。ISL\
  \ 团队拥有一套软件模块，这些模块是在多年的咨询工作中开发的，他们将其与一个可视化“工作流”界面相结合。`Clementine`包含了许多源自团队在客户项目经验中的创新功能：\n\
  \n*   支持“宽”表，并带有变量选择工具。\n*   探索非常大的决策树的工具。\n*   针对长时间运行的神经网络训练任务的持续准确率反馈。\n*   丰富的模型准确率诊断信息。\n\
  \n`Clementine`包含了决策树和神经网络算法，以及线性模型、时间序列、聚类和关联规则。该软件采用模块化和可扩展的设计，因此可以将其他算法插入到可视化界面中。\n\
  \n1996 年，Unica Software 发布了其`Pattern Recognition Workbench (PRW)`。`PRW`包含了线性模型、决策树和神经网络，并带有一个优化器，帮助用户训练和调优预测模型。\n\
  \n在 1990 年代，预测分析从业者就统计学和机器学习传统技术的相对优劣展开了长时间的辩论。Leo Breiman 于 2001 年发表的论文“统计建模：两种文化”捕捉到了这场辩论的精髓。\n\
  \n对于许多用户来说，机器学习在整个 1990 年代仍是一种新奇事物。受过经典统计技术训练的分析师反对他们所谓的“不透明性”和“缺乏可解释性”。对于许多商业问题而言，机器学习很少能比经典方法有足够大的性能提升，来证明其额外的时间和成本是合理的。\n\
  \n\n\n#### 颠覆性分析：欺诈检测\n\n1992 年，HNC 软件公司推出了³¹`Falcon 欺诈管理器`，这是一个围绕决策引擎构建的应用。HNC\
  \ 将目标锁定在信用卡欺诈上，这一问题在 1991 年给信用卡发卡机构造成了 5 亿美元的损失，几乎是 1990 年损失的两倍。\n\n对于预测分析而言，检测欺诈是一个极具挑战性的难题。欺诈交易非常罕见：每一千笔交易中仅有一笔，每四万个账户中仅有四个是欺诈账户。然而，每起欺诈事件都代价高昂；此外，即使欺诈者被抓获并起诉，追回款项的情况也极少发生，因此，在欺诈交易被授权之前就加以阻止至关重要。\n\
  \n信用卡发卡机构每年共同授权数十亿笔交易。每笔交易涉及四方——持卡人、商户、从商户处接收交易的银行以及发行信用卡的银行。支付网络（如万事达卡和维萨）将这四方连接在一起，并制定规则，规定发卡机构授权交易所需的时间。\n\
  \nHNC 的决策引擎捕捉了提交授权请求的每笔信用卡交易的数据，以及持卡人和商户的档案信息。该引擎将原始数据转化为数千个特征，以捕捉持卡人的消费模式，并对季节性等因素进行了调整。³²\n\
  \nFalcon 使用的预测模型是一个前馈神经网络，采用改进的反向传播训练算法进行训练。尽管 Falcon 会随每笔交易更新档案并实时计算分数，但模型本身是静态的；截至\
  \ 1999 年，HNC 每季度审查一次模型，每年更新一次。\n\nFalcon 解决方案的一个关键要素是写入每个客户合同中的数据联盟。HNC 要求客户提供使用该系统授权的详细交易数据。数据联盟产生了网络效应；随着更多客户获得该系统授权，Falcon\
  \ 对于其余客户变得更有价值、更具吸引力。在 2000 年，前 50 大维萨/万事达卡发卡机构中有 40 家使用了该系统，占全球卡交易量的 80%。\n\nFalcon\
  \ 是一项颠覆性创新，因为它促进了信用卡行业的整合。如果没有强大的欺诈检测，银行必须了解向其发卡的客户，而商户也必须了解出示信用卡的客户。自动化欺诈检测技术使得扩大信用卡用户群并提高商户对信用卡的接受度成为可能。2002\
  \ 年，Fair, Isaac (FICO) 以 8.1 亿美元（按 2016 年美元价值计算为 11 亿美元）的合并案收购了 HNC。\n\n### 当今关键趋势\n\
  \n要书写当前分析时代的完整历史还为时过早。相反，在本节中，我们将回顾当前影响分析价值链的两个关键趋势：经济的数字化转型和数据的爆炸式增长。在本书的其余部分，我们将介绍那些在某种程度上是对这些趋势回应的具体创新。\n\
  \n还有第三个趋势我们不做详细讨论，因为它已广为人知：摩尔定律的长期推进。我们将在后续章节中讨论计算成本的下降，特别是在对特定创新产生明确影响的地方。例如，计算成本的下降显然在内存分析的增长中发挥了作用。硬件成本的下降也与机器学习的兴起，尤其是深度学习的兴起密切相关。\n\
  \n#### 业务的数字化转型\n\n在 20 世纪 90 年代和 21 世纪初，许多企业投资于客户关系管理（CRM）和企业资源规划（ERP）等企业软件。企业软件将业务流程从纸质化或孤立系统转变为集成的数字化工作流。这种从模拟到数字的转换极大地扩展了企业数据的体量，因为数字化流程产生的数据量远超其模拟对应物。\n\
  \n企业转型所创造的数据量增长并未颠覆数据仓库生态系统。虽然数据量增加了，但数据是结构化的；可以通过添加主题领域，在现有的企业数据模型框架内进行处理。此外，企业系统将数据质量和业务规则前置到数据采集点，因此这些系统产生的数据质量比它们所取代的系统更高。\n\
  \n在市场营销等功能领域，数字媒体已取代模拟媒体，许多流程一直由广告公司和营销服务提供商（MSP）处理。对于大多数组织来说，来自外包流程的许多数据仍然留在第三方供应商的场所，IT\
  \ 部门无法看到。另一方面，数字营销机构、网络托管公司和数字先行者对这些数据却高度可见，他们不得不临时采用新技术来管理这些数据量。\n\n分析来自数字化流程的数据需要专业知识。例如，对于数字营销，分析师必须理解`会话化`、`PageRank`、`Cookie`、`标记`以及其他特定于新方法的概念。企业倾向于依赖其数字营销供应商来提供这些服务。因此，数字分析往往与传统分析分开发展。\n\
  \n业务流程的数字化转型也极大地影响了业务节奏。数字化流程比其模拟前身更加敏捷。例如，当营销人员使用直邮时，他们以周和月为单位来衡量营销活动的生命周期；一个组织良好、效率高的团队可以在八到十二周内开展一次直邮活动并收集反馈。对于电子邮件营销和网络媒体，营销人员则以小时为单位来衡量营销活动的生命周期。\n\
  \n业务节奏的加速显著改变了对分析的要求。在月度或周度报告就足够的地方，职能经理现在需要日报或时实报告，这对整个分析流程提出了新的要求。加速的节奏，加上需要根据实时洞察快速行动，促使管理者转向流式分析，我们将在第六章讨论这一点。\n\
  \n由于不愿等待企业数据仓库（EDW）满足其对分析的需求，职能经理们绕过了 IT 瓶颈，要么将分析外包，要么开发部门级解决方案。1996 年，高德纳曾自信地预测企业数据仓库将使像\
  \ Acxiom 和 Harte-Hanks 这样的营销服务提供商（MSP）倒闭；然而，MSP 却实现了两位数的增长。像 SAS 研究所这样的供应商利用职能经理的挫败感，推销能够让他们开发自己的部门级小型数据仓库的解决方案。\n\
  \n新型数据仓库设备成功响应了更快分析海量结构化数据的需求。像 Netezza、Greenplum、Aster 和 Vertica 这样的初创公司将创新设备推向市场，并成功销售给此前已标准化使用\
  \ Oracle、IBM 或 Teradata 的组织。Netezza 证明了自己能够提供一种在交付后一天内即可产生价值的设备。Vertica 的列式数据库被证明非常适合\
  \ PB 级的分析工作负载。\n\n\n\n我们在第五章讨论的内存数据库，是对结构化数据分析速度需求的一种自然延伸。职能经理对敏捷性和即时性的要求，使得我们在第九章介绍的自助分析服务备受重视。\n\
  \n业务流程的数字化转型从根本上改变了组织内部数据的“所有权”。2012 年，高德纳预测³³到 2017 年，首席营销官（CMO）将控制比首席信息官（CIO）更多的技术支出。尽管这种转变的规模存在一些争议³⁴，但显而易见的是，随着技术变得无处不在，CIO\
  \ 已不可能独占其治理权。\n\n对损益（P&L）负责的职能经理更倾向于选择速度和敏捷性，而非“企业级”考量。换句话说，如果一款营销解决方案支持快速实施并快速实现价值，而另一款解决方案是由\
  \ CIO 偏好的供应商销售的，那么 CMO 总是会选择前者而非后者。在大多数组织中，CMO 都能在这场争论中胜出。\n\n简而言之，业务逐步的数字化转型促使组织牺牲集权的“企业级”考量，转而支持那些能带来即时结果的方案。我们在第七章讨论的云计算，支撑并强化了这一趋势；它使职能经理能够用他们能掌控的运营资金来购买计算资源，而非他们无法掌控的资本资金。\n\
  \n#### 数据海啸\n\n除非你在过去几年一直与世隔绝，否则你很可能已经听说过，我们日益数字化的经济所释放出的海量数据。\n\n这场数据洪流的初现端倪是在\
  \ 2007 年，当时分析公司 IDC 发布了³⁵其关于数字宇宙的首份报告。该报告估计，前一年创建、捕获和复制的数据总量达 161 艾字节，这本身就是一个惊人的数字。更令人震惊的是：IDC\
  \ 预测，到 2010 年，新数据的年增长率将达到 57%，大约每 18 个月翻一番。\n\n这些新数据并非交易数据。经济中的交易总量增长缓慢，最多也就是较高的个位数；而且早在\
  \ 2007 年之前，经济中的大部分交易就已经被纳入数据仓库生态系统。\n\nIDC 将数字宇宙的扩张归因于三大模拟到数字的转换：\n\n*   胶片到数字图像采集\n\
  *   模拟到数字语音\n*   模拟到数字电视\n\n其中，从手机快照到医学图像的数字图像，构成了数字洪流中最大的组成部分。\n\nIDC 的分析侧重于数据的来源；影响存储数据增长的另一个因素是存储成本的急剧下降。这两个因素都发挥了作用。如果存储成本高昂，组织就会简单地丢弃数据或减少生成的数据量。\n\
  \n每 TB 的存储成本在本世纪头十年大幅下降，从 2000 年到 2005 年下降了 90%，从 2005 年到 2010 年又下降了 90%。廉价的存储意味着，保存所有数据通常比花时间筛选并找出哪些有价值更便宜、更具成本效益。\n\
  \n事实证明，IDC 2007 年的报告低估了创建和保留的数据量。该公司在随后的每一年都向上修正了其预测，在 2011 年报告³⁶数字宇宙已突破泽字节大关。智能电表、车辆遥测、RFID\
  \ 和智能传感器——即我们现在所说的物联网（IoT）——等数据生成技术的快速发展和采用，以及加速的社交媒体互动，共同推动了这一扩张。\n\n“每两天我们就会创造\
  \ 5 艾字节的数据，这相当于从人类文明诞生到 2003 年所创造的全部信息量³⁷”，谷歌首席执行官埃里克·施密特在 2010 年 8 月的 Techonomy\
  \ 大会上说道。他的目标定低了。IDC 最终放弃了报告数字宇宙的年度增量；2012 年，该公司预测³⁸到 2020 年数字宇宙将达到 40,000 艾字节——该数字在\
  \ 2014 年被 IDC 上调³⁹了 10%。\n\n数字宇宙的这种巨大扩张——从 2005 年的 130 艾字节到 2020 年的 44 泽字节——主要来自那些在数据仓库先驱确立其基本原则时尚不存在的信源。这些数据大部分是“非结构化的”——难以甚至无法映射到关系数据模型中：文本、文档、日志、图像、音频和视频。我们在第八章回顾的机器学习和深度学习，在理解和解释这些新数据方面发挥着关键作用。\n\
  \n虽然存储硬件的成本已经崩溃，但数据洪流影响着许多其他成本，包括软件和人员成本。降低计算成本的需求是促使组织采用我们将在第三章讨论的开源软件的诸多因素之一。复杂多样的数据类型推动了\
  \ Hadoop 及其生态系统（在第四章中讨论）的采用。\n\n\n\n## 总结\n\n回顾现代分析技术的发展史，我们能学到什么？\n\n统计学、机器学习和数据挖掘技术，与数据仓库及商业智能技术是各自独立发展起来的。尽管数据仓库理论家们主张数据挖掘“应该”属于数据仓库的一部分，而领先的数据库供应商也推出了“库内”数据挖掘，但实际用户却并不认同理论家的观点。总体来说，他们更倾向于使用基于服务器或桌面的独立工具，这些工具的功能远比“库内”数据挖掘工具丰富得多。\n\
  \n在这段历史中，我们可以找出两个基于预测分析的颠覆性创新的明确例子：信用评分和欺诈检测。值得注意的是，这两个应用都依赖于数据集成：信用评分依赖于汇集全国性的大规模信用记录数据库；欺诈检测则依赖于\
  \ `HNC Falcon` 核心的数据共享联盟。在这两个案例中，数据都来源于购买这些应用的用户的外部。\n\n然而，创新的数据仓库技术在这些颠覆性应用中并未扮演关键角色。`FICO`、征信机构和\
  \ `HNC` 在最初部署时，都依赖于保守的专有数据平台。（这些组织后来确实采用了现代数据仓库技术，但最初的创新使用的是传统文件系统。）\n\n数据仓库降低了商业智能的成本，并扩大了企业数据的访问范围。话虽如此，却很难找到一个纯粹基于企业数据仓库的颠覆性分析的例子。尽管其支持者声称如此，但企业数据仓库并非具有颠覆潜力的战略性投资。\n\
  \n企业数据仓库作为单一事实来源的愿景从未实现，即使在其炒作周期的顶峰时期也是如此。没有任何一家大型组织成功地将所有数据整合到一个集中的存储库中。如果说在 20\
  \ 世纪 90 年代实现统一企业数据仓库的愿景难以企及，那么在今天则肯定无法实现。原因很简单：数据量太大、数据种类太多、数据流动太快。\n\n企业数据仓库的理念或许已经消亡，但数据仓库本身会像现代城市中的大教堂一样留存下来。那些已经建立了数据仓库的组织不会弃之不用，有些组织甚至可能会新建。每个组织都需要衡量其绩效，而数据仓库非常擅长提供对一致性事务指标（比如指标）的广泛访问。但绩效衡量不具有颠覆性，也不是战略性的。它仅仅是做生意的成本，就像铅笔和办公空间一样。因此，管理数据仓库的高管们将面临持续的压力，要求以尽可能低的成本交付指标。\n\
  \n从技术角度来看，数据仓库本身正在被分解成模块化组件。我们将在第四章讨论的 `SQL` 引擎，独立于存储运行。第七章介绍的虚拟化和云计算技术，则将计算和存储与物理计算基础设施分离开来。\n\
  \n与此同时，最有趣、最具战略性和颠覆性的分析应用将在数据仓库的范畴之外构建，我们将在后续章节中看到这一点。\n\n### 脚注\n\n1  \n[`http://www.phonearena.com/news/A-modern-smartphone-or-a-vintage-supercomputer-which-is-more-powerful_id57149`](http://www.phonearena.com/news/A-modern-smartphone-or-a-vintage-supercomputer-which-is-more-powerful_id57149)\n\
