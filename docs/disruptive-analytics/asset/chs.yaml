  `KNIME Analytics Platform` 在运行 `Linux`、`Windows` 或 `Mac OS` 的单机上进行内存操作。该软件支持多线程，以便利用单机上的多核处理器。服务器和云扩展版本运行在相同的操作系统上。`KNIME.com
  AG` 在 `Cloudera`、`Hortonworks` 和 `MapR Hadoop` 发行版上支持 `Hive` 和 `Impala` 扩展；并在 `Cloudera`
