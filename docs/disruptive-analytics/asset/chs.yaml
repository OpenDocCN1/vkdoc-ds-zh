  `Spark` 进行数据预处理和操作。


  `KNIME.com AG` 为扩展软件提供商业技术支持。对于开源的 `KNIME Analytics Platform`，它提供详尽的产品文档和一个用于问题排查的社区论坛。该公司还认证提供咨询和支持服务的合作伙伴及经销商。


