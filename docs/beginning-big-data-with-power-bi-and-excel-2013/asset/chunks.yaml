    The next example will show number of orders by employee, by taking the following
    steps:


    Create a new Power View sheet by clicking `Power View` on the `Power View` tab.
    Enter the title "Orders by Employee." In the `Power View Fields` pane, select
    the `Last Name` field from the `Employees` table.


    Then select the `Order ID` field from the `Orders` table. The results are shown
    in Figure [6-30](#A978-1-4842-0529-7_6_Chapter.html#Fig30). Note that by default,
    it sums the `Order IDs`, which is a meaningless number.


    ![A978-1-4842-0529-7_6_Fig30_HTML.jpg](A978-1-4842-0529-7_6_Fig30_HTML.jpg)


    Figure 6-30. Table showing employees and orders


    In the `Fields` area of the `Power View Fields` pane, click the arrow after `Order
    ID` and select `Count (Non Blank)`. The results are shown in Figure [6-31](#A978-1-4842-0529-7_6_Chapter.html#Fig31).
    Note that a count of the orders is now shown in the table.


    ![A978-1-4842-0529-7_6_Fig31_HTML.jpg](A978-1-4842-0529-7_6_Fig31_HTML.jpg)


    Figure 6-31. Table showing employees and number of orders per employee


    To create a chart of the data, right-click the table and select `Copy`. Click
    in the blank area next to the table, right-click, and select `Paste` to get another
    copy of the table, as shown in Figure [6-32](#A978-1-4842-0529-7_6_Chapter.html#Fig32).


    ![A978-1-4842-0529-7_6_Fig32_HTML.jpg](A978-1-4842-0529-7_6_Fig32_HTML.jpg)


    Figure 6-32. Making a copy of the table prior to plotting


    To plot the chart, select the rightmost table that was just pasted, click the
    `Bar Chart` icon on the `Design` tab, and select `Stacked Bar` to get a bar chart,
    as shown in Figure [6-33](#A978-1-4842-0529-7_6_Chapter.html#Fig33).


    ![A978-1-4842-0529-7_6_Fig33_HTML.jpg](A978-1-4842-0529-7_6_Fig33_HTML.jpg)


    Figure 6-33. Bar chart of orders by employee


    ## Aggregating Orders by Product


    This example will show the number of orders by product. Follow these steps:


    Click `Power View Reports` on the Excel `Insert` tab. Select the `Product Name`
    field in the `products` table in the `Power View Fields` pane, as shown in Figure
    [6-34](#A978-1-4842-0529-7_6_Chapter.html#Fig34).


    ![A978-1-4842-0529-7_6_Fig34_HTML.jpg](A978-1-4842-0529-7_6_Fig34_HTML.jpg)


    Figure 6-34. Product list


    Next, select the `Quantity` field in the `Order Details` table, as shown in Figure
    [6-35](#A978-1-4842-0529-7_6_Chapter.html#Fig35). Note that the sum of the quantity
    is shown.


    ![A978-1-4842-0529-7_6_Fig35_HTML.jpg](A978-1-4842-0529-7_6_Fig35_HTML.jpg)


    Figure 6-35. Quantity of products ordered


    Click anywhere in the table and use the handles to expand it, as shown in Figure
    [6-36](#A978-1-4842-0529-7_6_Chapter.html#Fig36).


    ![A978-1-4842-0529-7_6_Fig36_HTML.jpg](A978-1-4842-0529-7_6_Fig36_HTML.jpg)


    Figure 6-36. Expanded view of table


    To create a chart, right-click the table and select `Copy`. Click to the right
    of the table on the design surface and select `Paste`. Then, on the `Design` tab,
    select `Bar Chart` and `Stacked Bar`. At the top of the design screen, enter the
    title "Product Quantity Sold." The result is shown in Figure [6-37](#A978-1-4842-0529-7_6_Chapter.html#Fig37).


    ![A978-1-4842-0529-7_6_Fig37_HTML.jpg](A978-1-4842-0529-7_6_Fig37_HTML.jpg)


    Figure 6-37. Bar chart of product quantity sold


