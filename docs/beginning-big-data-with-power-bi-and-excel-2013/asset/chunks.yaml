    ## Using the SUMX Function


    The `SUM` function can be used to sum a single column. By contrast, `SUMX` iterates
    through each column and performs a calculation. So, for instance, `SUMX` could
    be used to sum the product of price times quantity for each row. To do so, follow
    these steps:


    Select the next cell down in the first column of the calculation area. Enter the
    following formula to test `SUMX` and format it as currency, as shown in Figure
    [7-10](#A978-1-4842-0529-7_7_Chapter.html#Fig10):


    ```

    testsumx:=SUMX(dbo_FactSales,dbo_FactSales[UnitPrice]*dbo_FactSales[SalesQuantity])

    ```


    ![A978-1-4842-0529-7_7_Fig10_HTML.jpg](A978-1-4842-0529-7_7_Fig10_HTML.jpg)


    Figure 7-10. Using the `SUMX` function


    ## Using the CALCULATE Function


    The `CALCULATE()` function is used to calculate an expression based on a filter.
    The following example calculates total sales through the store channel. Follow
    these steps:


    Select the top leftmost cell in the Calculation area. Enter the formula, as shown
    in Figure [7-11](#A978-1-4842-0529-7_7_Chapter.html#Fig11). The DAX formula is:


    ```

    StoreSales:=CALCULATE(SUM(dbo_FactSales[TotalSales]), dbo_DimChannel[ChannelName]="Store")

    ```


    ![A978-1-4842-0529-7_7_Fig11_HTML.jpg](A978-1-4842-0529-7_7_Fig11_HTML.jpg)


    Figure 7-11. Using the `CALCULATE` function to show total store sales


    Note that the formula starts with a label, followed by a colon. `StoreSales` is
    both the label and identifier for this calculated field. `CALCULATE` will then
    sum the `TotalSales` field from the `dbo_FactSales` table, in which the channel
    name is equal to store. When typing a function name or field name, Intellisense
    pops up a list of what it thinks you want to enter. Highlight the desired value
    and press `Tab` to select.


    Note that the total sales number is not formatted. This can be corrected by selecting
    the field and clicking the down arrow after the `Format` icon on the ribbon and
    selecting `currency`. The column also needs to be expanded, which can be achieved
    by clicking the bar between column headings and dragging. The result is shown
    in Figure [7-12](#A978-1-4842-0529-7_7_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_7_Fig12_HTML.jpg](A978-1-4842-0529-7_7_Fig12_HTML.jpg)


    Figure 7-12. Formatting as currency'
  raw: '## Updating Formula Results


    There are two ways to update the results of formulas.


    Refreshing data involves updating the data in the underlying data source, such
    as SQL Server, MySQL, or Access.   Recalculating involves updating the results
    of formulas based on changes to the formulas.   Analyzing Sales Data


    This chapter will continue the example used at the end of [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html)—the
    Contoso database available for download from `Tinyurl.com/PowerPivotSamples`.
    Note that the URL is case-sensitive. Once the data is downloaded, open the PowerPivotTutorialSamples
    spreadsheet.


    One way of thinking about this example is to use a star model architecture that
    includes a fact table containing the numbers that have to be aggregated, surrounded
    by dimension tables, such as products and stores. In this example, the dboFactSales
    table is the fact table, as shown in Figure [7-1](#A978-1-4842-0529-7_7_Chapter.html#Fig1).
    To create this example, follow these steps:


    Click Manage on the PowerPivot tab and then click on Diagram View to see the tables
    in Diagram View as shown in Figure [7-1](#A978-1-4842-0529-7_7_Chapter.html#Fig1).
     


    ![A978-1-4842-0529-7_7_Fig1_HTML.jpg](A978-1-4842-0529-7_7_Fig1_HTML.jpg)


    Figure 7-1.


    Diagram ViewClick Data View and then click the dbo_FactSales tab at the bottom
    of the window to view the dbo_FactSales tab. Scroll all the way to the right and
    notice the final column, TotalProfit, which is a DAX calculated field based on
    TotalSales minus TotalCost, as shown in Figure [7-2](#A978-1-4842-0529-7_7_Chapter.html#Fig2).
    Click any cell in the column to see the formula displayed just below the ribbon.


    ![A978-1-4842-0529-7_7_Fig2_HTML.jpg](A978-1-4842-0529-7_7_Fig2_HTML.jpg)


    Figure 7-2.


    Calculated column


    ### Creating Measures or Calculated Fields


    This section shows how to create measures or calculated fields based on the data
    in the tables.


    To add a calculated field or measure, go to the first cell below the data grid
    at the bottom of the TotalProfit column and select the cell. Double-click the
    AutoSum icon on the tab to get the sum. If the calculation area or measure grid
    at the bottom of the data grid is not visible, click the Calculation Area icon
    at the right end of the tab.   Next, select the cell below the sum cell just created,
    click the down arrow after the AutoSum icon, and from the drop-down, select average,
    as shown in Figure [7-3](#A978-1-4842-0529-7_7_Chapter.html#Fig3). It may be necessary
    to expand the column to see the totals. Do that by clicking the bar separating
    the column headings, and when a double arrow appears, drag to the right. Note
    that an identifier “Sum of Total Profits” and “Average of Total Profits” is created.
    This identifier acts as both a label and a variable name used to reference the
    calculated field.


    ![A978-1-4842-0529-7_7_Fig3_HTML.jpg](A978-1-4842-0529-7_7_Fig3_HTML.jpg)


    Figure 7-3.


    Calculated fields  Follow the same steps with the Total Sales column to add the
    sum and average, as shown in Figure [7-4](#A978-1-4842-0529-7_7_Chapter.html#Fig4).


    ![A978-1-4842-0529-7_7_Fig4_HTML.jpg](A978-1-4842-0529-7_7_Fig4_HTML.jpg)


    Figure 7-4.


    Additional calculated fields


    ### Analyzing Profitability


    This example will show how to insert a new column to analyze the profitability
    of each transaction.


    Add a calculated column for profitability or profit divided by sales by clicking
    anywhere in the rightmost column named “Add Column” and pressing “=”. Then click
    the TotalProfit column, press /, and click the TotalSales column to define the
    formula and then press Enter. The result is shown in Figure [7-5](#A978-1-4842-0529-7_7_Chapter.html#Fig5).


    ![A978-1-4842-0529-7_7_Fig5_HTML.jpg](A978-1-4842-0529-7_7_Fig5_HTML.jpg)


    Figure 7-5.


    Calculated field for profit/sales  To format the column to display percentages,
    select the new column and then click the down arrow after Format on the Home tab
    and select Percentage. The result is shown in Figure [7-6](#A978-1-4842-0529-7_7_Chapter.html#Fig6).


    ![A978-1-4842-0529-7_7_Fig6_HTML.jpg](A978-1-4842-0529-7_7_Fig6_HTML.jpg)


    Figure 7-6.


    Formatting as percentage  To rename the column, right-click the column heading,
    select Rename Column, and enter Profit/Sales, as shown in Figure [7-7](#A978-1-4842-0529-7_7_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_7_Fig7_HTML.jpg](A978-1-4842-0529-7_7_Fig7_HTML.jpg)


    Figure 7-7.


    Renaming a calculated column  To create a calculated field that is the average
    of all the profit/sales, go down to the calculation area below the data area.
    Select the cell at the bottom of the Profit/Sales column and then click the down
    arrow after the AutoSum icon on the ribbon and select average. A calculated field
    will be created, as shown in Figure [7-8](#A978-1-4842-0529-7_7_Chapter.html#Fig8).
    Expand the column as necessary to display the full value.


    ![A978-1-4842-0529-7_7_Fig8_HTML.jpg](A978-1-4842-0529-7_7_Fig8_HTML.jpg)


    Figure 7-8.


    Average of Profit/Sales  To add calculated fields for minimum and maximum profit/sales,
    select the cell in the calculation area just below the one where the average is.
    Click the arrow after AutoSum on the ribbon, select maximum, and then repeat and
    select minimum. Calculated fields for average minimum and maximum will be created,
    as shown in Figure [7-9](#A978-1-4842-0529-7_7_Chapter.html#Fig9).


    ![A978-1-4842-0529-7_7_Fig9_HTML.jpg](A978-1-4842-0529-7_7_Fig9_HTML.jpg)


    Figure 7-9.


    Adding calculated fields for minimum and maximum profit/sales


    ## Using the SUMX Function


    The `SUM` function can be used to sum a single column. By contrast, `SUMX` iterates
    through each column and performs a calculation. So, for instance, `SUMX` could
    be used to sum the product of price time’s quantity for each row. To do so, follow
    these steps:


    Select the next cell down in the first column of the calculation area.   Enter
    the following formula to test `SUMX` and format it as currency, as shown in Figure
    [7-10](#A978-1-4842-0529-7_7_Chapter.html#Fig10):


    ![A978-1-4842-0529-7_7_Fig10_HTML.jpg](A978-1-4842-0529-7_7_Fig10_HTML.jpg)


    Figure 7-10.


    Using the `SUMX` function  


    `testsumx:=SUMX(dbo_FactSales,dbo_FactSales[UnitPrice]*dbo_FactSales[SalesQuantity])`


    ## Using the CALCULATE Function


    The `CALCULATE()` function is used to calculate an expression based on a filter.
    The following example calculates total sales through the store channel. Follow
    these steps:


    Select the top leftmost cell in the Calculation area.   Enter the formula, as
    shown in Figure [7-11](#A978-1-4842-0529-7_7_Chapter.html#Fig11). The DAX formula
    is


    ![A978-1-4842-0529-7_7_Fig11_HTML.jpg](A978-1-4842-0529-7_7_Fig11_HTML.jpg)


    Figure 7-11.


    Using the `CALCULATE` function to show total store sales  


    `StoreSales:=CALCULATE(SUM(dbo_FactSales[TotalSales]), dbo_DimChannel[ChannelName]="Store")`


    Note that the formula starts with a label, followed by a colon. StoreSales is
    both the label and identifier for this calculated field. `CALCULATE` will then
    sum the TotalSales field from the dbo_FactSales table, in which the channel name
    is equal to store. When typing a function name or field name, Intellisense pops
    up a list of what it thinks you want to enter. Highlight the desired value and
    press Tab to select.


    Note that the total sales number is not formatted. This can be corrected by selecting
    the field and clicking the down arrow after the Format icon on the ribbon and
    selecting currency. The column also needs to be expanded, which can be achieved
    by clicking the bar between column headings and dragging. The result is shown
    in Figure [7-12](#A978-1-4842-0529-7_7_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_7_Fig12_HTML.jpg](A978-1-4842-0529-7_7_Fig12_HTML.jpg)


    Figure 7-12.


    Formatting as currency'
