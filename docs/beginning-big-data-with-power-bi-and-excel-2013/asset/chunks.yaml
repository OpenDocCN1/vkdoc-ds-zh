- fmt: '# Adjusting Subtotals and Grand Totals


    The subtotals can be adjusted on the Pivot Table Tools Design tab. Click `Subtotals`
    to see the options.


    - Do not show subtotals

    - Show all subtotals at bottom of group

    - Show all subtotals at top of group


    Click `Grand Totals` to see the following options:


    - Off for rows and columns

    - On for rows and columns

    - On for rows only

    - On for columns only


    # Analyzing Sales by Day of Week


    It can be useful to analyze sales by day of the week. In this example, we have
    added a column for day of week, using the following steps:


    The formula will be automatically copied down the column, because this is a table.
    The result is as shown in Figure [3-13](#A978-1-4842-0529-7_3_Chapter.html#Fig13).


    ![A978-1-4842-0529-7_3_Fig13_HTML.jpg](A978-1-4842-0529-7_3_Fig13_HTML.jpg)


    Figure 3-13.


    Extracting day of week Save the spreadsheet. On the Insert tab, click `PivotTable`.
    Click OK in the `Create PivotTable` pop-up window to accept the default. Insert
    a column to the left of salesperson. Name the new column “day of week.” Enter
    the following formula in cell `B3`, to extract the day of week: `=TEXT(A3,"dddd")`
    If necessary, click Refresh on the Pivot Table Analyze tab to display the new
    column. On the PivotTable Fields tab, drag model to the Columns box, day of week
    to Rows, and Sum of price to Values to get the Pivot Table shown in Figure [3-14](#A978-1-4842-0529-7_3_Chapter.html#Fig14).


    ![A978-1-4842-0529-7_3_Fig14_HTML.jpg](A978-1-4842-0529-7_3_Fig14_HTML.jpg)


    Figure 3-14.


    Pivot Table of sales by day of week and model


    # Creating a Pivot Chart of Sales by Day of Week


    To get a visual representation of sales by day of the week, create a Pivot Chart
    from a Pivot Table. With the Pivot Table displayed on the screen, do the following:


    Go to the Pivot Table Tools Analyze tab and select `Pivot Chart`. From the `Insert
    Chart` pop-up shown in Figure [3-15](#A978-1-4842-0529-7_3_Chapter.html#Fig15),
    select the type of chart desired.


    ![A978-1-4842-0529-7_3_Fig15_HTML.jpg](A978-1-4842-0529-7_3_Fig15_HTML.jpg)


    Figure 3-15.


    Insert Chart dialog If a clustered column chart is selected, the results will
    be as shown in Figure [3-16](#A978-1-4842-0529-7_3_Chapter.html#Fig16).


    ![A978-1-4842-0529-7_3_Fig16_HTML.jpg](A978-1-4842-0529-7_3_Fig16_HTML.jpg)


    Figure 3-16.


    Pivot Chart for sales by day of week


    # Using Slicers


    Slicers can be used to filter data and to zoom in on specific field values in
    the Pivot Table. To set up a slicer, do the following:


    Go to the Pivot Table Tools Analyze tab and select `Insert Slicer`. From the `Insert
    Slicers` pop-up window, select the fields that you want to slice, such as salesperson
    and date, and click OK. The result is shown in Figure [3-17](#A978-1-4842-0529-7_3_Chapter.html#Fig17),
    which displays the sales by salesperson for each model and date… A specific salesperson
    can be selected, and the slicer menu can be selected to view sales for that salesperson.


    ![A978-1-4842-0529-7_3_Fig17_HTML.jpg](A978-1-4842-0529-7_3_Fig17_HTML.jpg)


    Figure 3-17.


    Filtering results using salesperson slicer


    # Adding a Time Line


    A time line can be added to slice by time intervals. To add a time line, do the
    following:


    From the Pivot Table Tool Analyze tab, select `Insert Timeline`. Select sell date
    in the `Insert Timeline` window and click OK. The time period for the time line
    can be selected by clicking the down arrow at the upper right of the Timeline
    window to select years, quarters, months, or days. As seen in Figure [3-18](#A978-1-4842-0529-7_3_Chapter.html#Fig18),
    Timeline and Slicer work together. A specific salesperson and date can be selected
    to view sales by that salesperson on that date.


    ![A978-1-4842-0529-7_3_Fig18_HTML.jpg](A978-1-4842-0529-7_3_Fig18_HTML.jpg)


    Figure 3-18.


    Filtering data with a time line plus salesperson slicer


    # Importing Pivot Table Data from the Azure Marketplace


    Data can be imported into a Pivot Table from the Azure Marketplace, which includes
    a wide variety of data, such as demographic, environmental, financial, retail,
    and sports. Some of the data is free, and some is not. The following example shows
    how to access free data.


    Go to the Azure Marketplace web site at `datamarket.azure.com/browse/data`. The
    screen shown in Figure [3-19](#A978-1-4842-0529-7_3_Chapter.html#Fig19) will appear
    as of August 2015.


    ![A978-1-4842-0529-7_3_Fig19_HTML.jpg](A978-1-4842-0529-7_3_Fig19_HTML.jpg)


    Figure 3-19.


    Azure data market browse screen The first time you use the site, you may be asked
    to fill in account information and to create a free account ID. If you already
    have a free Microsoft account, such as a `Hotmail.com` or `Outlook.com` account,
    you can use that. Click Data at the top of the screen. The screen shown in Figure
    [3-20](#A978-1-4842-0529-7_3_Chapter.html#Fig20) will appear.


    ![A978-1-4842-0529-7_3_Fig20_HTML.jpg](A978-1-4842-0529-7_3_Fig20_HTML.jpg)


    Figure 3-20.


    Azure Marketplace Scroll through the data sources. You may have to go through
    an additional sign-up process to use free data. For this example, we will use
    Real GDP Per Capita By State (1997–2011), as shown in Figure [3-21](#A978-1-4842-0529-7_3_Chapter.html#Fig21).
    If prompted, enter your Microsoft ID and agree to the terms of use.


    ![A978-1-4842-0529-7_3_Fig21_HTML.jpg](A978-1-4842-0529-7_3_Fig21_HTML.jpg)


    Figure 3-21.


    Real GDP all industries per state database Click `Explore this Dataset` in the
