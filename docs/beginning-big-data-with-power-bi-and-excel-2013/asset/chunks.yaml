  trans: '

    # 单表示例


    第一个示例将演示如何基于一张电子表格使用 Power View，该表格包含美国各州 1997 年至 2011 年每年的人均实际 GDP（国内生产总值）数据。从
    Azure 市场下载此数据的说明已在第 3 章中介绍。要创建 Power View 查询，请执行以下步骤：


    打开 Azure 电子表格中的 GDP 数据，如图 6-2 所示。


    ![A978-1-4842-0529-7_6_Fig2_HTML.jpg](img/A978-1-4842-0529-7_6_Fig2_HTML.jpg)


    图 6-2. 各州人均实际 GDP 数据电子表格


    单击 `Insert` 选项卡，选择 `Power View Reports`，然后等待 Power View 屏幕加载，如图 6-2 所示。如果系统提示安装
    SilverLight，请单击 `Yes`。请注意左侧的设计图面、右侧的 `Power View Fields` 窗格以及中间的 `Filters` 窗格。


    在屏幕右侧的 `Power View Fields` 窗格中，单击 `RealGDPByStatePerCapita` 左侧的右向三角形以展开字段。然后将
    `year` 字段拖到 `Filters` 窗格中，如图 6-3 所示。


    ![A978-1-4842-0529-7_6_Fig3_HTML.jpg](img/A978-1-4842-0529-7_6_Fig3_HTML.jpg)


    图 6-3. 设置筛选器


    要仅显示最近年份（即 2011 年），请在 `Filters` 窗格中单击 `Year` 右侧最左侧的图标以激活 `List Filter Mode`，查看年份列表并选中
    `2011`，如图 6-4 所示。


    ![A978-1-4842-0529-7_6_Fig4_HTML.jpg](img/A978-1-4842-0529-7_6_Fig4_HTML.jpg)


    图 6-4. 设置筛选器（展开视图）


    然后，在 `Power View Fields` 窗格中，单击 `Area` 和 `RealGDPPerCapita` 前面的复选框，即可创建一个表格，如图
    6-5 所示。


    ![A978-1-4842-0529-7_6_Fig5_HTML.jpg](img/A978-1-4842-0529-7_6_Fig5_HTML.jpg)


    图 6-5. 显示人均实际 GDP 总和的表格


    请注意，默认显示的是 `RealGDPPerCapita` 的总和，这没有实际意义。若要更改此设置，请在 `Power View Fields` 窗格底部，单击
    `RealGDPPerCapita` 后的向下箭头，然后选择 `Do Not Summarize`。但是，为了绘制后续图表，必须将其保留为 `Sum` 设置。结果如图
    6-6 所示。请注意表格右侧的滚动条，可用于滚动查看所有州。要展开表格，请单击表格并拖拽手柄。


    ![A978-1-4842-0529-7_6_Fig6_HTML.jpg](img/A978-1-4842-0529-7_6_Fig6_HTML.jpg)


    图 6-6. 显示各州人均实际 GDP 的表格


    可以通过单击提示 `Click here to add a title` 的位置并输入 `Real GDP Per Capita by State for
    2011` 来添加标题，如图 6-7 所示。


    ![A978-1-4842-0529-7_6_Fig7_HTML.jpg](img/A978-1-4842-0529-7_6_Fig7_HTML.jpg)


    图 6-7. 添加标题后的表格


    ## 以不同方式查看数据


    Power View 支持多种数据查看格式。选中 `Design` 选项卡后，单击左侧的 `Table` 图标可查看选项：表格、矩阵和卡片。卡片视图会为每个州创建一张卡片，如图
    6-8 所示。矩阵视图类似于表格，但允许向下钻取，后续示例中会进行演示。要返回表格格式，只需在 `Table` 图标下单击 `Table` 即可。


    ![A978-1-4842-0529-7_6_Fig8_HTML.jpg](img/A978-1-4842-0529-7_6_Fig8_HTML.jpg)


    图 6-8. 卡片视图


    ## 为单一年份创建条形图


    要创建显示各州人均实际 GDP 的条形图，请遵循以下步骤：


    单击表格中的任意位置，选中 `Design` 选项卡。单击 `Bar Chart`。选择 `Clustered Bar`。由于只有一个数据源，选择聚集条形图或堆积条形图会显示相同的结果。


    结果将如图 6-9 所示。2011 年每个州的人均 GDP 显示为单一条形。


    ![A978-1-4842-0529-7_6_Fig9_HTML.jpg](img/A978-1-4842-0529-7_6_Fig9_HTML.jpg)


    图 6-9. 条形图


    要调整图表大小，请单击图表并拖拽手柄。


    请注意，您可以将鼠标悬停在图表中的任意条形上，以查看该州的人均 GDP 值。


    ## 柱形图


    柱形图是条形图旋转 90 度后的形式，如图 6-10 所示。


    ![A978-1-4842-0529-7_6_Fig10_HTML.jpg](img/A978-1-4842-0529-7_6_Fig10_HTML.jpg)


    图 6-10. 柱形图


    ## 显示多个年份


    如果更改筛选器以包含多个年份（通过在 `Filters` 窗格的 `Years` 列表顶部单击 `All` 复选框），则表格中会为每个州生成每个年份的实例，如图
    6-11 所示。同时还需要在 `Power View Fields` 列表窗格中单击 `Year`，以便显示年份。


    ![A978-1-4842-0529-7_6_Fig11_HTML.jpg](img/A978-1-4842-0529-7_6_Fig11_HTML.jpg)


    图 6-11. 多个年份的人均实际 GDP 表格


    如果切换到矩阵视图，则显示如图 6-12 所示。请注意，需要指示 Power View 不要对年份进行求和：在 `Power View Fields` 窗格的
    `Fields` 部分，单击 `Year` 后的箭头，选择 `Do not summarize`。


    ![A978-1-4842-0529-7_6_Fig12_HTML.jpg](img/A978-1-4842-0529-7_6_Fig12_HTML.jpg)


    图 6-12. 多个年份人均 GDP 的矩阵视图


    ## 添加地图


    要使用地图显示数据，请遵循以下步骤：


    单击表格以激活 `Design` 选项卡。单击 `Map` 图标。如果显示的是世界地图，请使用右上角的 `Zoom` 和 `Pan` 图标仅显示地图的所需区域，如图
    6-13 所示。将鼠标悬停在一个气泡上可查看其关联的实际数值。


    ![A978-1-4842-0529-7_6_Fig13_HTML.jpg](img/A978-1-4842-0529-7_6_Fig13_HTML.jpg)


    图 6-13. 显示各州人均 GDP 的地图视图


    请注意，每个州显示的气泡大小与该州的人均 GDP 成比例。在 `Filters` 窗格中，可以选择单个或多个年份来查看这些年份的数据。


    ## 使用磁贴


    另一种查看数据的方式是使用磁贴。只需选择一个表格，然后单击 `Design` 工具栏上的 `Tiles` 图标即可看到显示效果，如图 6-14 所示。默认布局在显示顶部有一个选项卡条，允许单击每个州以查看该州的值。


    ![A978-1-4842-0529-7_6_Fig14_HTML.jpg](img/A978-1-4842-0529-7_6_Fig14_HTML.jpg)


    图 6-14. 磁贴格式


    另一种选择是磁贴流格式，磁贴位于底部，如图 6-15 所示。可以通过单击 `Design` 工具栏上的 `Tile Type` 图标在这两种视图之间切换。


    ![A978-1-4842-0529-7_6_Fig15_HTML.jpg](img/A978-1-4842-0529-7_6_Fig15_HTML.jpg)


    图 6-15. 磁贴流格式

