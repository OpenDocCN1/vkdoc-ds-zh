- fmt: '# Key Options on the Query Editor Home Ribbon


    This section covers key options on the Query Editor Home ribbon, which is shown
    in Figure [8-2](#A978-1-4842-0529-7_8_Chapter.html#Fig2).


    - `Close & Load`: Closes the editor and loads the data either into an Excel worksheet
    or into the data model

    - `Refresh Preview`: Refreshes the query, reprocessing all steps, and previewing
    the results

    - `Advanced Editor`: Shows the code used to extract the data in the `M` query
    language

    - `Choose Columns`/`Remove Columns`: Allows keeping or removing selected columns.
    Clicking the `Choose Columns` icon will show a list of columns that can be unchecked
    to remove, as shown in Figure [8-3](#A978-1-4842-0529-7_8_Chapter.html#Fig3).


    ![A978-1-4842-0529-7_8_Fig3_HTML.jpg](A978-1-4842-0529-7_8_Fig3_HTML.jpg)


    Figure 8-3. `Choose Columns` dialog


    - `Keep Rows`/`Remove Rows`: Allows keeping or removing selected rows

    - `Remove Duplicates`: Removes duplicates. Be careful about defining the criteria
    for duplicates. For example, in a list of stock prices by day, removing duplicates
    based only on the stock symbol would leave only one unique row for each stock.

    - `Sort`: Sorts columns in ascending or descending order. Remember that the Query
    Editor is only working a subset of the data. It might be better to wait until
    the data is loaded into a worksheet or data model before sorting.

    - `Split Column`: Splits columns based on a delimiter, such as a comma or space

    - `Group By`: Groups rows based on a field or fields


    ![A978-1-4842-0529-7_8_Fig2_HTML.jpg](A978-1-4842-0529-7_8_Fig2_HTML.jpg)


    Figure 8-2. Query Editor screen


    Note that another way to remove or filter out rows is by clicking the arrow to
    the right of the column heading and de-selecting values, as shown in Figure [8-2](#A978-1-4842-0529-7_8_Chapter.html#Fig2).


    ## A Simple Population


    This example will show how to use the `Data Catalog Search` option to retrieve
    population data in a tabular format for analysis. The `Data Catalog Search` option
    searches a curated data catalog of public data web sites, such as Wikipedia and
    the Census Bureau web site, and allows tables to be easily extracted from those
    web sites. It is not a full-featured search engine. It seems to understand searches
    that start with words such as "largest" or "most". It can also search corporate
    databases after being logged in to the corporate network. For this example, take
    the following steps.


    On the `Power Query` tab, click `Data Catalog Search`. In the `Search` pane to
    the right, enter "most populated countries." Hover the mouse pointer over the
    results to get a preview of the data. Then hover the mouse over the item in the
    list entitled "Secondary table—List of sovereign states and dependent territories
    by population density" from Wikipedia. The results are shown in Figure [8-4](#A978-1-4842-0529-7_8_Chapter.html#Fig4).
    Note the prompts at the bottom for `Load` and `Edit`.


    ![A978-1-4842-0529-7_8_Fig4_HTML.jpg](A978-1-4842-0529-7_8_Fig4_HTML.jpg)


    Figure 8-4. Preview of population data


    Click `Edit` on the lower left of the preview to load a subset of data from the
    table into the Query Editor, as shown in Figure [8-5](#A978-1-4842-0529-7_8_Chapter.html#Fig5).
    The table lists countries with their population and areas in square miles or square
    kilometers and shows their population density per square mile or square kilometer.


    ![A978-1-4842-0529-7_8_Fig5_HTML.jpg](A978-1-4842-0529-7_8_Fig5_HTML.jpg)


    Figure 8-5. Population data in Query Editor


    In the Query Editor, data can be manipulated by deleting rows or columns, splitting
    or merging columns, or removing duplicates. For example, to delete the columns
    for area or density in kilometers, select both columns by clicking the header
    of the first column to be deleted and Ctrl-click the header of the second column,
    as shown in Figure [8-6](#A978-1-4842-0529-7_8_Chapter.html#Fig6).


    ![A978-1-4842-0529-7_8_Fig6_HTML.jpg](A978-1-4842-0529-7_8_Fig6_HTML.jpg)


    Figure 8-6. Highlighting columns for deletion


    Then click `Remove Columns` under `Remove Columns` on the tab, to remove the selected
    columns. After the data is shaped the way you want, click `Close & Load`, to load
    the data into an Excel spreadsheet.


    ## Performance of S&P 500 Stock Index


    This example will show how to retrieve S&P 500 performance data, by taking the
    following steps:


    On the `Power Query` ribbon, click `Data Catalog Search`. In the search box, type
    "S&P 500 performance." Hover the mouse over the first link, labeled "Total annual
    returns...," as shown in Figure [8-7](#A978-1-4842-0529-7_8_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_8_Fig7_HTML.jpg](A978-1-4842-0529-7_8_Fig7_HTML.jpg)


    Figure 8-7. Data preview


    Click `Edit` in the lower left to load the data showing S&P 500 returns for every
    year from 1970 to 2013 into the Query Editor, as shown in Figure [8-8](#A978-1-4842-0529-7_8_Chapter.html#Fig8).


    ![A978-1-4842-0529-7_8_Fig8_HTML.jpg](A978-1-4842-0529-7_8_Fig8_HTML.jpg)


    Figure 8-8. Data in Query Editor


    Select the columns by clicking `Choose Columns` and unchecking columns that will
    not be included. For this example, the 5-, 10-, 15-, and 20-year return columns
    will be removed, as shown in Figure [8-9](#A978-1-4842-0529-7_8_Chapter.html#Fig9).
    Click `OK`.


    ![A978-1-4842-0529-7_8_Fig9_HTML.jpg](A978-1-4842-0529-7_8_Fig9_HTML.jpg)


    Figure 8-9. `Choose Columns` dialog


    To remove the four bottom rows, click `Remove Rows` and then `Remove Bottom Rows`
    and enter `4` as the number of rows to be removed, as shown in Figure [8-10](#A978-1-4842-0529-7_8_Chapter.html#Fig10),
    and click `OK`.


    ![A978-1-4842-0529-7_8_Fig10_HTML.jpg](A978-1-4842-0529-7_8_Fig10_HTML.jpg)


    Figure 8-10. `Remove Rows` dialog


    Then click `Close & Load` on the left side of the ribbon to import the data into
    a spreadsheet, to get the results shown in Figure [8-11](#A978-1-4842-0529-7_8_Chapter.html#Fig11).


    ![A978-1-4842-0529-7_8_Fig11_HTML.jpg](A978-1-4842-0529-7_8_Fig11_HTML.jpg)


    Figure 8-11. Data imported into a spreadsheet'
  raw: "### Key Options on the Query Editor Home Ribbon\n\nThis section covers key\
    \ options on the Query Editor Home ribbon, which is shown in Figure [8-2](#A978-1-4842-0529-7_8_Chapter.html#Fig2).\n\
    \n*   Close & Load: Closes the editor and loads the data either into an Excel\
    \ worksheet or into the data model\n*   Refresh Preview: Refreshes the query,\
    \ reprocessing all steps, and previewing the results\n*   Advanced Editor: Shows\
    \ the code used to extract the data in the M query language\n*   Choose Columns/Remove\
    \ Columns: Allows keeping or removing selected columns. Clicking the Choose Columns\
    \ icon will show a list of columns that can be unchecked to remove, as shown in\
    \ Figure [8-3](#A978-1-4842-0529-7_8_Chapter.html#Fig3).\n\n    ![A978-1-4842-0529-7_8_Fig3_HTML.jpg](A978-1-4842-0529-7_8_Fig3_HTML.jpg)\n\
    \n    Figure 8-3.\n\n    Choose Columns dialog\n*   Keep Rows/Remove Rows: Allows\
    \ keeping or removing selected rows\n*   Remove Duplicates: Removes duplicates.\
    \ Be careful about defining the criteria for duplicates. For example, in a list\
    \ of stock prices by day, removing duplicates based only on the stock symbol would\
    \ leave only one unique row for each stock.\n*   Sort: Sorts columns in ascending\
    \ or descending order. Remember that the Query Editor is only working a subset\
    \ of the data. It might be better to wait until the data is loaded into a worksheet\
    \ or data model before sorting.\n*   Split Column: Splits columns based on a delimiter,\
    \ such as a comma or space\n*   Group By: Groups rows based on a field or fields\n\
    \n![A978-1-4842-0529-7_8_Fig2_HTML.jpg](A978-1-4842-0529-7_8_Fig2_HTML.jpg)\n\n\
    Figure 8-2.\n\nQuery Editor screen\n\nNote that another way to remove or filter\
    \ out rows is by clicking the arrow to the right of the column heading and de-selecting\
    \ values, as shown in Figure [8-2](#A978-1-4842-0529-7_8_Chapter.html#Fig2).\n\
    \n## A Simple Population\n\nThis example will show how to use the Data Catalog\
    \ Search option to retrieve population data in a tabular format for analysis.\
    \ The Data Catalog Search option searches a curated data catalog of public data\
    \ web sites, such as Wikipedia and the Census Bureau web site, and allows tables\
    \ to be easily extracted from those web sites. It is not a full-featured search\
    \ engine. It seems to understand searches that start with words such as largest\
    \ or most. It can also search corporate databases after being logged in to the\
    \ corporate network. For this example, take the following steps.\n\nOn the Power\
    \ Query tab, click Data Catalog Search.   In the Search pane to the right, enter\
    \ “most populated countries.” Hover the mouse pointer over the results to get\
    \ a preview of the data. Then hover the mouse over the item in the list entitled\
    \ “Secondary table—List of sovereign states and dependent territories by population\
    \ density” from Wikipedia. The results are shown in Figure [8-4](#A978-1-4842-0529-7_8_Chapter.html#Fig4).\
    \ Note the prompts at the bottom for Load and Edit.\n\n![A978-1-4842-0529-7_8_Fig4_HTML.jpg](A978-1-4842-0529-7_8_Fig4_HTML.jpg)\n\
    \nFigure 8-4.\n\nPreview of population data   Click Edit on the lower left of\
    \ the preview to load a subset of data from the table into the Query Editor, as\
    \ shown in Figure [8-5](#A978-1-4842-0529-7_8_Chapter.html#Fig5). The table lists\
    \ countries with their population and areas in square miles or square kilometers\
    \ and shows their population density per square mile or square kilometer.\n\n\
    ![A978-1-4842-0529-7_8_Fig5_HTML.jpg](A978-1-4842-0529-7_8_Fig5_HTML.jpg)\n\n\
    Figure 8-5.\n\nPopulation data in Query Editor   In the Query Editor, data can\
    \ be manipulated by deleting rows or columns, splitting or merging columns, or\
    \ removing duplicates. For example, to delete the columns for area or density\
    \ in kilometers, select both columns by clicking the header of the first column\
    \ to be deleted and Ctrl-click the header of the second column, as shown in Figure\
    \ [8-6](#A978-1-4842-0529-7_8_Chapter.html#Fig6).\n\n![A978-1-4842-0529-7_8_Fig6_HTML.jpg](A978-1-4842-0529-7_8_Fig6_HTML.jpg)\n\
    \nFigure 8-6.\n\nHighlighting columns for deletion   Then click Remove Columns\
    \ under Remove Columns on the tab, to remove the selected columns.   After the\
    \ data is shaped the way you want, click Close & Load, to load the data into an\
    \ Excel spreadsheet.\n\n## Performance of S&P 500 Stock Index\n\nThis example\
    \ will show how to retrieve S&P 500 performance data, by taking the following\
    \ steps:\n\nOn the Power Query ribbon, click Data Catalog Search.   In the search\
    \ box, type “S&P 500 performance.” Hover the mouse over the first link, labeled\
    \ “Total annual returns...,” as shown in Figure [8-7](#A978-1-4842-0529-7_8_Chapter.html#Fig7).\n\
    \n![A978-1-4842-0529-7_8_Fig7_HTML.jpg](A978-1-4842-0529-7_8_Fig7_HTML.jpg)\n\n\
    Figure 8-7.\n\nData preview   Click Edit in the lower left to load the data showing\
    \ S&P 500 returns for every year from 1970 to 2013 into the Query Editor, as shown\
    \ in Figure [8-8](#A978-1-4842-0529-7_8_Chapter.html#Fig8).\n\n![A978-1-4842-0529-7_8_Fig8_HTML.jpg](A978-1-4842-0529-7_8_Fig8_HTML.jpg)\n\
    \nFigure 8-8.\n\nData in Query Editor   Select the columns by clicking Choose\
    \ Columns and unchecking columns that will not be included. For this example,\
    \ the 5-, 10-, 15-, and 20-year return columns will be removed, as shown in Figure\
    \ [8-9](#A978-1-4842-0529-7_8_Chapter.html#Fig9). Click OK.\n\n![A978-1-4842-0529-7_8_Fig9_HTML.jpg](A978-1-4842-0529-7_8_Fig9_HTML.jpg)\n\
    \nFigure 8-9.\n\nChoose Columns dialog   To remove the four bottom rows, click\
    \ Remove Rows and then Remove Bottom Rows and enter 4 as the number of rows to\
    \ be removed, as shown in Figure [8-10](#A978-1-4842-0529-7_8_Chapter.html#Fig10),\
    \ and click OK.\n\n![A978-1-4842-0529-7_8_Fig10_HTML.jpg](A978-1-4842-0529-7_8_Fig10_HTML.jpg)\n\
    \nFigure 8-10.\n\nRemove Rows dialog   Then click Close & Load on the left side\
    \ of the ribbon to import the data into a spreadsheet, to get the results shown\
    \ in Figure [8-11](#A978-1-4842-0529-7_8_Chapter.html#Fig11).\n\n![A978-1-4842-0529-7_8_Fig11_HTML.jpg](A978-1-4842-0529-7_8_Fig11_HTML.jpg)\n\
    \nFigure 8-11.\n\nData imported into a spreadsheet"
