    # 2013 年推荐的分析工具


    `Excel 2013` 试图通过推荐条件格式、图表、工具、汇总和数据透视表来预测你的需求。当高亮显示数据，或按下 `Ctrl+Q` 且选中数据范围内的任意单元格时，会显示一个包含多种格式选项的弹出窗口，如图
    10-1 所示。将鼠标悬停在条件格式选项上，会预览该条件格式应用于数据后的效果。


    ![A978-1-4842-0529-7_10_Fig1_HTML.jpg](img/A978-1-4842-0529-7_10_Fig1_HTML.jpg)


    图 10-1. 推荐的格式和分析选项


    在弹出窗口中点击 `汇总`，将显示 `汇总` 菜单，如图 10-2 所示。


    ![A978-1-4842-0529-7_10_Fig2_HTML.jpg](img/A978-1-4842-0529-7_10_Fig2_HTML.jpg)


    图 10-2. 汇总和统计选项


    向右滚动以高亮显示 `占总计的百分比`，将产生如图 10-3 所示的结果，其中每个项目右侧显示了其占总计的百分比。


    ![A978-1-4842-0529-7_10_Fig3_HTML.jpg](img/A978-1-4842-0529-7_10_Fig3_HTML.jpg)


    图 10-3. 百分比汇总


    ## 自定义状态栏


    请注意，`Excel` 窗口底部的状态栏会显示与高亮数据相关的统计数据，例如平均值、计数和总和。你可以通过右键单击状态栏并选择要显示的项目来自定义显示的值，如图
    10-4 所示。


    ![A978-1-4842-0529-7_10_Fig4_HTML.jpg](img/A978-1-4842-0529-7_10_Fig4_HTML.jpg)


    图 10-4. 自定义状态栏菜单


    例如，如果在 `自定义状态栏` 菜单中选中了 `最小值` 和 `最大值`，这些值将被添加到状态栏中，如图 10-5 所示。


    ![A978-1-4842-0529-7_10_Fig5_HTML.jpg](img/A978-1-4842-0529-7_10_Fig5_HTML.jpg)


    图 10-5. 添加了最小值和最大值后的状态栏


    ## 推断统计


    抽样涉及检查一个大群体中的一小部分，以便得出关于整个群体的结论。这被称为推断统计。要使样本能够代表更大的群体，样本的成员必须随机选择，这意味着群体中的每个成员被选中的机会与其他成员相同。目标是从样本中得出关于群体的可靠结论。确定样本量至关重要。样本的误差幅度计算为
    1 除以样本量的平方根。因此，随着样本量的增加，误差幅度会减小。


    通常，之所以使用样本，是因为调查整个群体在经济上不可行。大数据的承诺之一是，如果有可用的数据，则可以处理整个群体以获得更准确的结果。


    ## 描述性统计回顾


    描述性统计通过几个关键的计算值来汇总数据。图 10-6 显示了一个正态分布，或钟形曲线。任何值出现的频率由曲线的高度表示。例如，如果在多次试验中抛硬币十次，正面的平均次数将是五次。这是最常出现的结果，由曲线的最高点表示。次常见的结果是六次正面和四次反面，或六次反面和四次正面。出现九次正面和一次反面的情况则很少见。


    ![A978-1-4842-0529-7_10_Fig6_HTML.gif](img/A978-1-4842-0529-7_10_Fig6_HTML.gif)


    图 10-6. 钟形曲线


    ### 计算描述性统计


    最常见的计算统计值是平均数、中位数和众数。


    -   **平均数**，即平均值或算术平均数，通过将所有值相加并除以值的数量来计算。

    -   中间值称为**中位数**——即 50% 的值高于它、50% 的值低于它的那个数据点。

    -   出现频率最高的值称为**众数**。在钟形曲线中，中位数、众数和平均数相等。


    ### 离散程度度量


    然而，许多分布并不完全符合钟形曲线，因此我们需要离散程度的度量。**方差**衡量一组数值的分散程度。小方差表示数据点往往非常接近平均值，因此彼此也很接近，而大方差则表示数据点围绕平均值并彼此之间都非常分散。


    离散程度的一种度量是**标准差**，其计算方法是计算每个值与算术平均值的偏差，然后将其平方。计算这些平方值的算术平均值，然后取平方根来计算标准差，标准差用希腊字母
    sigma 表示。


    **68-95-99 规则**用于记忆正态分布平均值周围范围内值的百分比。换句话说，68.27% 的值落在平均值加减一个标准差的范围内；95.45% 的值落在平均值加减两个标准差的范围内；99.73%
    的值落在平均值加减三个标准差的范围内。这有时被称为**三西格玛经验法则**。请记住，此规则仅适用于正态分布。注意图 10-6 图示中显示与该规则相对应的百分比。


    例如，在房屋价值分析中，如果所有房屋的售价都在一个相当狭窄的范围内，比如 40 万到 60 万美元，那么方差和标准差就会相对较小。但是，如果有几栋高端房屋的售价超过
    100 万美元，那么方差和标准差就会较大。这就是为什么本章剩余部分描述的图形方法对于显示数值之间的关系非常有用。


    ### Excel 统计函数


    `Excel` 提供了大量函数来计算统计值。以下是一些较常用的函数。


    -   `Average(范围)`：计算一个数据范围或离散值列表的算术平均数。它会忽略空单元格或包含文本的单元格。

    -   `Averagea(范围)`：与 `Average` 相同，不同之处在于它将包含文本的单元格的值视为零。

    -   `Averageif(范围, 条件)`：根据用引号括起来的条件语句返回算术平均数。计算时不包含空单元格或包含文本的单元格。

    -   `Averageifs(范围, 条件 1, 条件 2)`：根据多个条件语句返回算术平均数。计算时不包含空单元格或包含文本的单元格。

    -   `Median(范围)`：计算中位数或中间值。

    -   `Mode(范围)`：计算出现频率最高的值，排除空单元格和未计数的包含文本的单元格。


    ## 数据图表化


    `Excel` 提供了多种以图形方式查看数据的方法。选择合适的图形工具来准确描绘数据非常重要，如下列表所述。


    -   柱形图和条形图：在一个轴上绘制类别变量，在另一个轴上绘制数值变量。

    -   XY 散点图：显示两个数值之间的关系。

    -   频率分布：仅涉及一个变量——它显示每个值有多少实例。它将各个测量值分组到类别或箱子中。在其最常见的形式中，变量的值位于水平（x）轴上，实例的频率位于垂直（y）轴上。

    -   直方图：是数值数据分布的图形表示。


    ## Excel 分析工具库


    本节将介绍如何使用 `Excel` 附带的 `Excel 分析工具库`。`分析工具库` 可用于执行复杂的统计计算，手动编程这些计算将非常耗时。

    '
- fmt: '### Enabling the Excel Analysis ToolPak


    Before use, it must be activated.


    To enable the Excel Analysis ToolPak, follow these steps:


    Click the `File` tab to see the Backstage View. Click `Options` at the bottom
    of the left pane. Select `Add-Ins` on the left pane. At the bottom of the window,
    select `Excel Add-Ins` and click `Go`, as shown in Figure 10-7.


    ![A978-1-4842-0529-7_10_Fig7_HTML.jpg](A978-1-4842-0529-7_10_Fig7_HTML.jpg)


    **Figure 10-7.** Excel Add-Ins screen


    Select `Analysis TookPak`, as shown in Figure 10-8, and click `OK`.


    ![A978-1-4842-0529-7_10_Fig8_HTML.jpg](A978-1-4842-0529-7_10_Fig8_HTML.jpg)


    **Figure 10-8.** Add-Ins pop-up


    After activation, the Analysis ToolPak can now be accessed by clicking `Data Analysis`
    on the right side of the `Data` tab in Excel.


    ### A Simple Example


    The following example will show how to use the Excel Analysis ToolPak to analyze
    some sample test scores.


    **Exercise 10-1.** Using the Analysis Toolpak


    Follow these steps to analyze the test score:


    Click `Data Analysis` on the right side of the `Data` tab. When the `Data Analysis`
    window appears, select `Descriptive Statistics`, as shown in Figure 10-9.


    ![A978-1-4842-0529-7_10_Fig9_HTML.jpg](A978-1-4842-0529-7_10_Fig9_HTML.jpg)


    **Figure 10-9.** Data Analysis tools


    Click `OK`. In the `Descriptive Statistics` dialog box, specify the input range
    and the output range and select summary statistics, as shown in Figure 10-10,
    and click `OK`.


    ![A978-1-4842-0529-7_10_Fig10_HTML.jpg](A978-1-4842-0529-7_10_Fig10_HTML.jpg)


    **Figure 10-10.** Descriptive Statistics dialog


    The results are shown in Figure 10-11.


    ![A978-1-4842-0529-7_10_Fig11_HTML.jpg](A978-1-4842-0529-7_10_Fig11_HTML.jpg)


    **Figure 10-11.** Descriptive Statistics output


    To plot a histogram using the Data Analysis ToolPak, go to the `Data` tab and
    click `Data Analytics`. Select `Histogram`, as shown in Figure 10-12.


    ![A978-1-4842-0529-7_10_Fig12_HTML.jpg](A978-1-4842-0529-7_10_Fig12_HTML.jpg)


    **Figure 10-12.** Selecting Histogram from the Data Analysis dialog


    Define the range and select chart output, as shown in Figure 10-13, and click
    `OK`.


    ![A978-1-4842-0529-7_10_Fig13_HTML.jpg](A978-1-4842-0529-7_10_Fig13_HTML.jpg)


    **Figure 10-13.** Histogram dialog


    The results are shown in Figure 10-14. This operation sets up bins, or categories,
    for classifying the data, which are used for plotting the histogram.


    ![A978-1-4842-0529-7_10_Fig14_HTML.jpg](A978-1-4842-0529-7_10_Fig14_HTML.jpg)


    **Figure 10-14.** Histogram plot


    ### Other Analysis ToolPak Functions


    The Analysis ToolPak includes other functions. Some of the most useful ones are
    listed following:


    *   The Anova tools provide different types of variance analysis. They test the
    randomness of the selection of two samples.

    *   The correlation coefficient is a value between -1 and +1 that measures how
    strongly two variables are related to each other. A +1 indicates a perfect positive
    correlation, meaning that the two variables move together. A -1 indicates a perfect
    negative correlation, meaning that the two variables move in opposition to each
    other. A positive correlation does not prove cause and effect. The Excel `CORREL`
    function can also be used to calculate correlation.

    *   Covariance is a measure of how much two random variables change together.

    *   Exponential smoothing is like a moving average used to forecast the next value
    in a time series.


    ## Using a Pivot Table to Create a Histogram


    A Pivot Table can also be used to create a more customized histogram.


    **Exercise 10-2.** A Customized Test Score Histogram Example


    Create a histogram that shows test score distributions by following these steps:


    Highlight the data to be plotted. Select the `Insert` tab and click `PivotTable`.
    Confirm the range and put the Pivot Table in the same worksheet with the location
    of F3, as shown in Figure 10-15.


    ![A978-1-4842-0529-7_10_Fig15_HTML.jpg](A978-1-4842-0529-7_10_Fig15_HTML.jpg)


    **Figure 10-15.** Create PivotTable dialog


    Drag scores to the `Rows` box, as shown in Figure 10-16.


    ![A978-1-4842-0529-7_10_Fig16_HTML.jpg](A978-1-4842-0529-7_10_Fig16_HTML.jpg)


    **Figure 10-16.** Test scores as rows


    Right-click the PivotTable column and select `Group`, as shown in Figure 10-17.


    ![A978-1-4842-0529-7_10_Fig17_HTML.jpg](A978-1-4842-0529-7_10_Fig17_HTML.jpg)


    **Figure 10-17.** Selecting Group from the context menu


    By default, the `Grouping` dialog box sets the lower range to the lowest score
    and the upper range to the highest score, with a default interval of 10, as shown
    in Figure 10-18. Click `OK`.


    ![A978-1-4842-0529-7_10_Fig18_HTML.jpg](A978-1-4842-0529-7_10_Fig18_HTML.jpg)


    **Figure 10-18.** Grouping dialog


    Drag the scores to the `Value` box. The result indicating the frequency for each
    grouping category is shown in Figure 10-19. Notice that the categories are approximately
    what the grading categories would be: 92 to 100 would be an A, 82 to 91 would
    be a B, etc.


    ![A978-1-4842-0529-7_10_Fig19_HTML.jpg](A978-1-4842-0529-7_10_Fig19_HTML.jpg)


    **Figure 10-19.** Grouping categories


    To plot a histogram, click the `Insert` tab and select `Column Chart`, `2D Column`.
    The result, which plots the frequency for each category, is shown in Figure 10-20.


    ![A978-1-4842-0529-7_10_Fig20_HTML.jpg](A978-1-4842-0529-7_10_Fig20_HTML.jpg)


    **Figure 10-20.** Histogram


    The chart can be tweaked by clicking a column and pressing `Ctrl+1` to open the
    `Format Data Series` pane on the right side of the screen. Adjust the `Gap Width`
    slider to zero to remove the space between columns.


    The title can be modified by clicking the title, which now says Total, and changing
    it to “Frequency Distribution of Test Scores,” as shown in Figure 10-21.


    ![A978-1-4842-0529-7_10_Fig21_HTML.jpg](A978-1-4842-0529-7_10_Fig21_HTML.jpg)


    **Figure 10-21.** Histogram with title'
