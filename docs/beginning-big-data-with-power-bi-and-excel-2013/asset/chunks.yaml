- fmt: '# Recommended Analytical Tools in 2013


    `Excel 2013` tries to anticipate your needs by recommending conditional formatting,
    charts, tools, totals, and Pivot Tables. When data is highlighted, or when `Ctrl+Q`
    is pressed, with any cell in the data range selected, a pop-up window with various
    formatting options is displayed, as shown in Figure [10-1](#A978-1-4842-0529-7_10_Chapter.html#Fig1).
    Moving the cursor over the conditional formatting options will show a preview
    of that conditional formatting on the data.


    ![A978-1-4842-0529-7_10_Fig1_HTML.jpg](A978-1-4842-0529-7_10_Fig1_HTML.jpg)


    Figure 10-1. Recommended format and analytics options


    Clicking `Totals` in the pop-up window will cause the `Totals` menu to be displayed,
    which is shown in Figure [10-2](#A978-1-4842-0529-7_10_Chapter.html#Fig2).


    ![A978-1-4842-0529-7_10_Fig2_HTML.jpg](A978-1-4842-0529-7_10_Fig2_HTML.jpg)


    Figure 10-2. Totals and statistical options


    Scrolling right to highlight `% Total` will produce the results shown in Figure
    [10-3](#A978-1-4842-0529-7_10_Chapter.html#Fig3), in which the percent of the
    total is shown to the right of each item.


    ![A978-1-4842-0529-7_10_Fig3_HTML.jpg](A978-1-4842-0529-7_10_Fig3_HTML.jpg)


    Figure 10-3. Percent totals


    ## Customizing the Status Bar


    Notice that the status bar at the bottom of the `Excel` window shows statistics
    related to the highlighted data, such as the average, count, and sum. You can
    customize the values shown by right-clicking the status bar and selecting the
    items you want displayed, as shown in Figure [10-4](#A978-1-4842-0529-7_10_Chapter.html#Fig4).


    ![A978-1-4842-0529-7_10_Fig4_HTML.jpg](A978-1-4842-0529-7_10_Fig4_HTML.jpg)


    Figure 10-4. Customize Status Bar menu


    If `Minimum` and `Maximum`, for example, are selected on the `Customize Status
    Bar` menu, those values will be added to the status bar, as shown in Figure [10-5](#A978-1-4842-0529-7_10_Chapter.html#Fig5).


    ![A978-1-4842-0529-7_10_Fig5_HTML.jpg](A978-1-4842-0529-7_10_Fig5_HTML.jpg)


    Figure 10-5. Status bar with Min and Max added


    ## Inferential Statistics


    Sampling involves examining a small portion of a large population in order to
    draw conclusions about the entire population. This is called inferential statistics.
    For a sample to be representative of the larger population, the members of the
    sample must be selected randomly, meaning that every member of the population
    has the same chance of being included as any other member. The objective is to
    draw reliable conclusions about the population from the sample. Determining the
    sample size is critical. The margin of error for a sample is calculated as one
    divided by the square root of the sample size. Thus, as the sample size increases,
    the margin of error decreases.


    Generally, a sample is used because it is not economically feasible to survey
    an entire population. One of the promises of big data is that if the data is available,
    an entire population can be processed for more accurate results.


    ## Review of Descriptive Statistics


    Descriptive statistics summarize data with a few key calculated values. Figure
    [10-6](#A978-1-4842-0529-7_10_Chapter.html#Fig6) shows a normal distribution or,
    bell, curve. The frequency with which any value occurs is represented by the height
    of the curve. For example, if a coin is tossed ten times over multiple trials,
    the average number of heads will be five. This is the result that will occur most
    frequently and is represented by the highest point of the curve. The next most
    common occurrence will be six heads and four tails or six tails and four heads.
    Rarely would there be nine heads and one tail.


    ![A978-1-4842-0529-7_10_Fig6_HTML.gif](A978-1-4842-0529-7_10_Fig6_HTML.gif)


    Figure 10-6. Bell curve


    ### Calculating Descriptive Statistics


    The most common calculated statistical values are mean, median, and mode.


    - The mean, the average or arithmetic mean, is computed by adding all the values
    and dividing by the number of values.

    - The middle value is called the median—the data point at which 50% of the values
    fall above it and 50% of the values fall below it.

    - The most frequent value is called the mode. In a bell curve, the median, mode,
    and mean are equal.


    ### Measures of Dispersion


    Many distributions don’t fit neatly into a bell curve, however, so we need measures
    of dispersion. The variance measures how far a set of numbers is spread out. A
    small variance indicates that the data points tend to be very close to the mean
    and, hence, to each other, while a high variance indicates that the data points
    are very spread out around the mean and from each other.


    One measure of dispersion is the standard deviation, which is calculated by computing
    the deviation of each value from the arithmetic mean and squaring them. The arithmetic
    mean of these squared values is calculated, and the square root taken to calculate
    the standard deviation is represented by the Greek letter sigma.


    The 68-95-99 rule is used to remember what percentage of values fall within a
    range around the mean of a normal distribution. In other words, 68.27% of the
    values are within the range of plus or minus one standard deviation; 95.45% of
    the values are in a range of plus or minus two standard deviations; and 99.73%
    of the values are within a range of plus or minus three standard deviations. This
    is sometimes called the Three Sigma Rule of Thumb. Remember that this rule only
    applies to a normal distribution. Notice the percentages shown in the illustration
    in Figure [10-6](#A978-1-4842-0529-7_10_Chapter.html#Fig6) that correspond to
    this rule.


    For example, in an analysis of home values, if all home sales fall within a fairly
    narrow range, such as $400,000 to $600,000, there would be a relatively small
    variance and standard deviation. However, if a couple of high-end homes sell for
    more than $1,000,000, there would be a larger variance and standard deviation.
    That is why the graphical approaches described in the remainder of this chapter
    are useful for showing relationships among values.


    ### Excel Statistical Functions


    `Excel` provides numerous functions to calculate statistical values. Here are
    a few of the more common ones.


    - `Average(range)`: Calculates the arithmetic mean of a range of data or a list
    of discrete values. It ignores empty cells or cells containing text.

    - `Averagea(range)`: Same as average, except that it assigns a value of zero to
    cells containing text.

    - `Averageif(range, condition)`: Returns an arithmetic mean based on a conditional
    statement enclosed in quotes. It does not include empty cells or cells containing
    text in calculations.

    - `Averageifs(range, condition1, condition2)`: Returns an arithmetic mean based
    on multiple conditional statements. It does not include empty cells or cells containing
    text in calculations.

    - `Median(range)`: Calculates the median or middle value.

    - `Mode(range)`: Calculates the most frequent value, excluding empty cells and
    cells containing text not counted.


    ## Charting Data


    `Excel` provides several ways of viewing data graphically. It is important to
    select the best graphical tool to accurately portray the data, as described in
    the list below.


    - Column and bar charts plot a category variable on one axis and a numeric variable
    on the other.

    - An XY scatter chart shows the relationship between two numeric values.

    - Frequency distributions deal with one variable only—it shows how many instances
    there are of each value. It groups individual measurements into classes or bins.
    In its most common form, the variable’s values are on the horizontal, or x, axis
    and the frequency of instances on the vertical, or y, axis.

    - A histogram is a graphical representation of the distribution of numerical data.


    ## Excel Analysis ToolPak


    This section will cover how to use the `Excel Analysis ToolPak`, which is included
    with `Excel`. The `Analysis ToolPak` can be used to perform sophisticated statistical
    calculations that would be very time-consuming to program in by hand.'
