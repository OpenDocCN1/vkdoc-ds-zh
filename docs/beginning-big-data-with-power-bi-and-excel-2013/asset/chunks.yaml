    # 客户与城市示例


    本示例将按城市显示客户。目标是显示来自每个城市的订单价值。请按照以下步骤操作：


    单击 Excel 的 `Insert` 选项卡上的 `Power View Reports`。从 `Customers` 表中选择 `company` 和
