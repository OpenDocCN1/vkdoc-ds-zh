    # 使用切片器


    切片器可用于筛选数据，并放大查看数据透视表中的特定字段值。要设置切片器，请执行以下操作：


    转到“数据透视表工具-分析”选项卡，选择`插入切片器`。在“插入切片器”弹出窗口中，选择要切片的字段，例如`销售人员`和`日期`，然后点击`确定`。结果如图
    3-17 所示，它显示了每个型号和日期下各销售人员的销售额……可以选中某个特定的销售人员，并选择切片器菜单来查看该销售人员的销售额。


