- fmt: '### The Data Life Cycle


    The data life cycle involves collecting and analyzing data to build predictive
    models, following these steps:


    Collect the data. Store the data. Query the data to identify patterns and make
    sense of it. Use visualization tools to find the business value. Predict future
    consumer behavior based on the data.


    ### Apache Hadoop


    `Hadoop` is an open source software framework written in `Java` for distributed
    storage and processing of very large datasets stored on commodity servers. It
    has built-in redundancy to handle hardware failures. `Hadoop` is based on two
    main technologies: `MapReduce` and the `Hadoop Distributed File System` (`HDFS`).
    `Hadoop` was created by Doug Cutting and Mike Cafarella in 2005.


    #### MapReduce Algorithm


    `MapReduce` was developed at Google and released through a 2004 paper describing
    how to use parallel processing to deal with large amounts of data. It was later
    released into the public domain. It involves a two-step batch process.


    First, the data is partitioned and sent to mappers, which generate key value pairs.
    The key value pairs are then collated, so that the values for each key are together,
    and then the reducer processes the key value pairs to calculate one value per
    key.


    One example that is often cited is a word count. It involves scanning through
    a manuscript and counting the instances of each word. In this example, each word
    is a key, and the number of times each word is used is the value.


    #### Hadoop Distributed File System (HDFS)


    `HDFS` is a distributed file system that runs on commodity servers. It is based
    on the `Google File System` (`GFS`). It splits files into blocks and distributes
    them among the nodes of the cluster. Data is replicated so that if one server
    goes down, no data is lost. The data is immutable, meaning that tables cannot
    be edited; it can only be written to once, like `CD-R`, which is based on write
    once read many. New data can be appended to an existing file, or the old file
    can be deleted and the new data written to a new file. `HDFS` is very expandable,
    by adding more servers to handle more data.


    Some implementations of `HDFS` are append only, meaning that underlying tables
    cannot be edited. Instead, writes are logged, and then the file is re-created.


    #### Commercial Implementations of Hadoop


    `Hadoop` is an open source Apache project, but several companies have developed
    their own commercial implementations. Hortonworks, which was founded by Doug Cutting
    and other former Yahoo! employees, is one of those companies that offers a commercial
    implementation. Other such companies include Cloudera and MapR. Another Hadoop
    implementation is Microsoft’s `HD Insight`, which runs on the `Azure` cloud platform.
    An example in [Chapter 11](#A978-1-4842-0529-7_11_Chapter.html) shows how to import
    an `HD Insight` database into `Power Query`.


    ### CAP Theorem


    An academic way to look at NoSQL databases includes the `CAP Theorem`. `CAP` is
    an acronym for Consistency, Availability, and Partition Tolerance. According to
    this theorem, any database can only have two of those attributes. Relational databases
    have consistency and partition tolerance. Large relational databases are weak
    on availability, because they have low latency when they are large. NoSQL databases
    offer availability and partition tolerance but are weak on consistency, because
    of a lack of fixed structure.


    ### NoSQL


    As discussed elsewhere in this book, `NoSQL` is a misnomer. It does not mean “no
    SQL.” A better term for this type of database might be non-relational. `NoSQL`
    is designed to access data that has no relational structure, with little or no
    schema. Early versions of `NoSQL` required a programmer to write a custom program
    to retrieve that data. More and more implementations of `NoSQL` databases today
    implement some form of SQL for retrieval of data. A May 29, 2015, article on Data
    Informed by Timothy Stephan entitled “What NoSQL Needs Most Is SQL” ( [`http://data-informed.com/what-nosql-needs-most-is-sql/`](http://data-informed.com/what-nosql-needs-most-is-sql/)
    ) makes the case for more SQL access to NoSQL databases.


    `NoSQL` is appropriate for “web scale” data, which is based on high volumes with
    millions of concurrent users.


    #### Characteristics of NoSQL Data


    `NoSQL` databases are used to access non-relational data that doesn’t fit into
    relational tables. Generally, relational databases are used for mission-critical
    transactional data. `NoSQL` databases are typically used for analyzing non-mission-critical
    data, such as log files.


    #### Implementations of NoSQL


    There are several categories of `NoSQL` databases:


    *   **Key-Value Stores**: This type of database stores data in rows, but the schema
    may differ from row to row. Some examples of this type of `NoSQL` database are
    `Couchbase`, `Redis`, and `Riak`.

    *   **Document Stores**: This type of database works with documents that are `JSON`
    objects. Each document has properties and values. Some examples are `CouchDB`,
    `Cloudant`, and `MongoDB`.

    *   **Wide Column Stores**: This type of database has column families that consist
    of individual column of key-value pairs. Some example of this type of database
    are `HBase` and `Cassandra`.

    *   **Graph**: Graph databases are good for social network applications. They
    have nodes that are like rows in a table. `Neo4j` is an example of this type of
    database.


    One product that allows accessing data from `Hadoop` is `Hive`, which provides
    an SQL-like language called `HiveQL` for querying `Hadoop`. Another product is
    `Pig`, which uses `Pig Latin` for querying. The saying is that 10 lines of `Pig
    Latin` do the work of 200 lines of `Java`.


    ### Spark


    Another technology that is receiving a lot of attention is `Apache Spark`—an open
    source cluster computing framework originally developed at UC Berkeley in 2009.
    It uses an in-memory technology that purportedly provides performance up to 100
    times faster than `Hadoop`. It offers `Spark SQL` for querying. IBM recently announced
    that it will devote significant resources to the development of `Spark`.


    ## Microsoft Self-Service BI


    Most of these big data and NoSQL technologies came out of search engine and online
    retailers that process vast amounts of data. For the smaller to medium-size organizations
    that are processing thousands or millions of rows of data, this book shows how
    to tap into Microsoft’s `Power BI` running on top of Excel.


    Much has been written about the maximum number of rows that can be loaded into
    `PowerPivot`. The following link to a blog post at Microsoft Trends documents
    loading 122 million records: [`www.microsofttrends.com/2014/02/09/how-much-data-can-powerpivot-really-manage-how-about-122-million-records`](http://www.microsofttrends.com/2014/02/09/how-much-data-can-powerpivot-really-manage-how-about-122-million-records)
    .


    ## Summary


    This chapter provides a brief history of the evolution of data analysis, culminating
    with the big data tools of today. It covers the evolution of data structures,
    from relational databases to the less structured data that `NoSQL` addresses.


    # 2. Excel As Database and Data Aggregator


    Spreadsheets have a long history of making data accessible to ordinary people.
    This chapter chronicles the evolution of Excel from spreadsheet to powerful database.
    It then shows how to import data from a variety of sources. Subsequent chapters
    will demonstrate how Excel with `Power BI` is now a powerful Business Intelligence
    tool.'
