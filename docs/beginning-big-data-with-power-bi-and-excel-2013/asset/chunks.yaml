- fmt: '# History of SQL


    SQL was first developed by IBM in the early 1970s and was called SEQUEL (Structured
    English Query Language). It was used to manipulate and retrieve data from early
    IBM relational database management systems (RDBMS). Because of trademark conflicts,
    SEQUEL was shortened to SQL. It was later implemented in other relational database
    management systems by Oracle and later Microsoft. In 1986, the American National
    Standards Institute (ANSI) issued an SQL standard. In my opinion, the correct
    pronunciation is S-Q-L, but some people still pronounce it Sequel.


    SQL is a declarative language, meaning that it specifies what results are wanted
    without defining the how. SQL consists of a Data Definition Language and a Data
    Manipulation Language. In Excel, mostly the query feature of the Data Manipulation
    Language is used, because the data definition is performed through Excel, by importing
    tables from other sources. SQL was originally based on the relational model, meaning
    that data is stored in multiple tables, based on a fixed structure.


    ## NoSQL


    As discussed in [Chapter 1](#A978-1-4842-0529-7_1_Chapter.html), the term NoSQL
    is a misnomer, because some NoSQL systems have an SQL interface. A more accurate
    term would be non-relational, or not only SQL. Relational databases have a fixed
    schema that must be defined before any data can be entered. By contrast, NoSQL
    databases can access data with different schemas. This is sometimes called schema
    on read.


    ## NewSQL


    NewSQL tries to be a compromise between relational and NoSQL systems. These systems
    use a relational architecture and have SQL as their primary interface but aspire
    to have the same scalability and flexibility as NoSQL systems.


    ## SQL++


    SQL++ is a new form of the language, which enhances traditional SQL and is based
    on a semi-structured data model that can access JSON data as well as traditional
    relational data. It is generally backward compatible with traditional SQL.


    One implementation of SQL++ is N1QL (pronounced “Nickel”), which is being developed
    by Couchbase based on a 2014 paper by Kian Win Ong, Yannis Papakonstantinou, and
    Romain Vernoux entitled “The SQL++ Unifying Semi-structured Query Language, and
    an Expressiveness Benchmark of SQL-on-Hadoop, NoSQL and NewSQL Databases.”


    ## SQL Syntax


    The mainstay of the SQL query language is the `SELECT` command. The syntax of
    that command is shown following. Note that clauses enclosed in square brackets
    are optional.


    ```

    SELECT [DISTINCT] <columns list>

    [AS <optional alias name for returned columns>]

    FROM <table name(s)>

    [WHERE <condition>]

    [GROUP BY <column expression for calculating aggregates>]

    [HAVING <group level filter condition>]

    [ORDER BY <sort order for the results table>]

    ```


    The `SELECT` clause names the columns or column expressions to be shown. An asterisk
    can be used to specify all columns. The `FROM` clause lists the table or tables
    to be accessed. The `WHERE` clause is used to provide a criteria for relating
    multiple tables and/or provides a row-level filter, which is used to eliminate
    rows that do not meet the desired condition. `GROUP BY` is used to arrange the
    results table in groups for data aggregation such as subtotaling. The `HAVING`
    clause provides a group-level filter for the results set. The `ORDER BY` clause
    is used to arrange the results table in the specified order. The methodology for
    doing this in PowerPivot and Excel will be demonstrated in this chapter.


    When using the `SELECT` statement, the following questions should be addressed:


    *   `SELECT`: What are the desired columns or columns expressions to be displayed?

    *   `FROM`: In what tables are these columns?

    *   `WHERE`: What are the conditions that link the tables? What are the selection
    criteria to eliminate unwanted rows?

    *   `GROUP BY`: What values are to be aggregated for such purposes as subtotals?

    *   `HAVING`: What conditions must each record meet to be included in the result
    table when using aggregation?

    *   `ORDER BY`: In what order should the results be presented?


    For example, the following SQL `SELECT` statement extracts the name and address
    fields from the `addrlist` table in which the zip code is equal to “94704.”


    ```

    SELECT name, address FROM addrlist WHERE zip="94704"

    ```


    ## SQL Aggregate Functions


    SQL includes various aggregate functions to allow calculating subtotals, subaverages,
    subcounts, etc., based on the condition in the `WHERE` clause.


    These functions include:


    *   `COUNT()`: Returns the number of non-empty rows for the conditions specified

    *   `SUM()`: Returns the sum of all values in the specified columns

    *   `MIN()`: Returns the lowest value in the specified column

    *   `MAX()`: Returns the largest value in the specified column

    *   `AVG()`: Returns the average value for the specified column


    The functions can be applied to the entire table or subsets of the table, as defined
    by the `WHERE` conditions. Look at these statements, for example:


    *   `SELECT COUNT(*) FROM offices`: Would return the number of rows in the `offices`
    table

    *   `SELECT COUNT(*) FROM office WHERE region="CH"`: Would return the number of
    offices in the Chicago region

    *   `SELECT SUM(sales) FROM offices`: Would return the sum of sales for all rows
    in the `offices` table

    *   `SELECT SUM(sales) FROM offices where region="CH"`: Would return the sum of
    the `sales` field for all offices in the Chicago region


    ## Subtotals


    It would be possible to display a count of all offices in each region, using the
    following statement:


    ```

    SELECT region, COUNT(*) FROM offices GROUP BY region

    ```


    Subtotals of sales for all regions could be generated using the following statement:


    ```

    SELECT region, SUM(sales) FROM offices GROUP BY region

    ```


    ## Joining Tables


    When querying multiple tables, it is best to use a `WHERE` clause to specify the
    condition for joining the tables. This is called an equijoin, because it is based
    on an equality test. If the `WHERE` clause is omitted, every row in the first
    table will be paired with every row in the second table. This is called the Cartesian
    product, or outer join of the two tables.'
  raw: '## History of SQL


    SQL was first developed by IBM in the early 1970s and was called SEQUEL (Structured
    English Query Language). It was used to manipulate and retrieve data from early
    IBM relational database management systems (RDBMS). Because of trademark conflicts,
    SEQUEL was shortened to SQL. It was later implemented in other relational database
    management systems by Oracle and later Microsoft. In 1986, the American National
    Standards Institute (ANSI) issued an SQL standard. In my opinion, the correct
    pronunciation is S-Q-L, but some people still pronounce it Sequel.


    SQL is a declarative language, meaning that it specifies what results are wanted
    without defining the how. SQL consists of a Data Definition Language and a Data
    Manipulation Language. In Excel, mostly the query feature of the Data Manipulation
    Language is used, because the data definition is performed through Excel, by importing
    tables from other sources. SQL was originally based on the relational model, meaning
    that data is stored in multiple tables, based on a fixed structure.


    ## NoSQL


    As discussed in [Chapter 1](#A978-1-4842-0529-7_1_Chapter.html), the term NoSQL
    is a misnomer, because some NoSQL systems have an SQL interface. A more accurate
    term would be non-relational, or not only SQL. Relational databases have a fixed
    schema that must be defined before any data can be entered. By contrast, NoSQL
    databases can access data with different schemas. This is sometimes called schema
    on read.


    ## NewSQL


    NewSQL tries to be a compromise between relational and NoSQL systems. These systems
    use a relational architecture and have SQL as their primary interface but aspire
    to have the same scalability and flexibility as NoSQL systems.


    ## SQL++


    SQL++ is a new form of the language, which enhances traditional SQL and is based
    on a semi-structured data model that can access JSON data as well as traditional
    relational data. It is generally backward compatible with traditional SQL.


    One implementation of SQL++ is N1QL (pronounced “Nickel”), which is being developed
    by Couchbase based on a 2014 paper by Kian Win Ong, Yannis Papakonstantinou, and
    Romain Vernoux entitled “The SQL++ Unifying Semi-structured Query Language, and
    an Expressiveness Benchmark of SQL-on-Hadoop, NoSQL and NewSQL Databases.”


    ## SQL Syntax


    The mainstay of the SQL query language is the `SELECT` command. The syntax of
    that command is shown following. Note that clauses enclosed in square brackets
    are optional.


