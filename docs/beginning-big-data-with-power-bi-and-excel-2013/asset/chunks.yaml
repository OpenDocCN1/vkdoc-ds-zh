    # 更新公式结果


    更新公式结果有两种方式。


    刷新数据涉及更新底层数据源中的数据，例如 SQL Server、MySQL 或 Access。重新计算则涉及根据公式的更改来更新公式的结果。


    ## 分析销售数据


    本章将继续使用第 4 章末尾的示例——可从 `Tinyurl.com/PowerPivotSamples` 下载的 Contoso 数据库。请注意，该 URL
    区分大小写。数据下载后，打开 `PowerPivotTutorialSamples` 电子表格。


    考虑该示例的一种方法是使用星型模型架构，该架构包含一个包含需要聚合的数字的事实表，周围环绕着维度表，例如产品和商店。在此示例中，`dboFactSales`
    表是事实表，如图 7-1 所示。要创建此示例，请按照以下步骤操作：


    单击 `PowerPivot` 选项卡上的 `Manage`，然后单击 `Diagram View`，以在图视图中查看表，如图 7-1 所示。


    ![A978-1-4842-0529-7_7_Fig1_HTML.jpg](img/A978-1-4842-0529-7_7_Fig1_HTML.jpg)


    图 7-1. 图视图


    单击 `Data View`，然后点击窗口底部的 `dbo_FactSales` 选项卡以查看 `dbo_FactSales` 选项卡。一直向右滚动，注意最后一列
    `TotalProfit`，它是一个基于 `TotalSales` 减去 `TotalCost` 的 DAX 计算字段，如图 7-2 所示。单击该列中的任意单元格，即可在功能区下方看到显示的公式。


    ![A978-1-4842-0529-7_7_Fig2_HTML.jpg](img/A978-1-4842-0529-7_7_Fig2_HTML.jpg)


    图 7-2. 计算列


    ## 创建度量值或计算字段


    本节介绍如何基于表中的数据创建度量值或计算字段。


    要添加计算字段或度量值，请转到 `TotalProfit` 列底部数据网格下方的第一个单元格，然后选中该单元格。双击选项卡上的 `AutoSum` 图标以获取总和。如果数据网格底部的计算区域或度量值网格不可见，请单击选项卡最右端的
    `Calculation Area` 图标。


    接下来，选中刚刚创建的总和单元格下方的单元格，单击 `AutoSum` 图标后的下箭头，然后从下拉菜单中选择 `average`，如图 7-3 所示。可能需要展开列才能看到总计。通过单击分隔列标题的栏，当出现双箭头时向右拖动即可。请注意，标识符
    `"Sum of Total Profits"` 和 `"Average of Total Profits"` 已创建。此标识符既充当标签，也充当用于引用计算字段的变量名。


    ![A978-1-4842-0529-7_7_Fig3_HTML.jpg](img/A978-1-4842-0529-7_7_Fig3_HTML.jpg)


    图 7-3. 计算字段


    对 `Total Sales` 列执行相同步骤，以添加总和与平均值，如图 7-4 所示。


    ![A978-1-4842-0529-7_7_Fig4_HTML.jpg](img/A978-1-4842-0529-7_7_Fig4_HTML.jpg)


    图 7-4. 其他计算字段


    ## 分析盈利能力


    本示例将展示如何插入新列来分析每笔交易的盈利能力。


    添加一个用于计算盈利能力（即利润除以销售额）的计算列：单击最右侧名为 `"Add Column"` 的列中的任意位置，然后按下 `"="`。接着单击 `TotalProfit`
    列，按下 `/`，再单击 `TotalSales` 列以定义公式，然后按 `Enter`。结果如图 7-5 所示。


    ![A978-1-4842-0529-7_7_Fig5_HTML.jpg](img/A978-1-4842-0529-7_7_Fig5_HTML.jpg)


    图 7-5. 利润/销售额的计算字段


    要将该列格式化为显示百分比，请选中新列，然后点击 `Home` 选项卡上 `Format` 后的下箭头，并选择 `Percentage`。结果如图 7-6
    所示。


    ![A978-1-4842-0529-7_7_Fig6_HTML.jpg](img/A978-1-4842-0529-7_7_Fig6_HTML.jpg)


    图 7-6. 格式化为百分比


    要重命名该列，请右键单击列标题，选择 `Rename Column`，然后输入 `Profit/Sales`，如图 7-7 所示。


    ![A978-1-4842-0529-7_7_Fig7_HTML.jpg](img/A978-1-4842-0529-7_7_Fig7_HTML.jpg)


    图 7-7. 重命名计算列


    要创建一个计算字段，用于计算所有利润/销售额的平均值，请进入数据区域下方的计算区域。在 `Profit/Sales` 列的底部选中单元格，然后点击功能区上的
    `AutoSum` 图标后的下箭头，并选择 `average`。将创建一个计算字段，如图 7-8 所示。根据需要展开列以显示完整值。


    ![A978-1-4842-0529-7_7_Fig8_HTML.jpg](img/A978-1-4842-0529-7_7_Fig8_HTML.jpg)


    图 7-8. 利润/销售额的平均值


    要为利润/销售额的最小值和最大值添加计算字段，请在计算区域中选择平均值下方的单元格。点击功能区上 `AutoSum` 后的箭头，选择 `maximum`，然后重复操作并选择
    `minimum`。将创建平均值、最小值和最大值的计算字段，如图 7-9 所示。


    ![A978-1-4842-0529-7_7_Fig9_HTML.jpg](img/A978-1-4842-0529-7_7_Fig9_HTML.jpg)


    图 7-9. 为利润/销售额的最小值和最大值添加计算字段


    ## 使用 SUMX 函数


    `SUM` 函数可用于对单列求和。相比之下，`SUMX` 会迭代每一列并执行计算。例如，`SUMX` 可用于对每一行的价格乘以数量的乘积求和。操作步骤如下：


    在计算区域第一列的下一个单元格中，输入以下公式来测试 `SUMX` 并将其格式化为货币，如图 7-10 所示：


    ```

    testsumx:=SUMX(dbo_FactSales,dbo_FactSales[UnitPrice]*dbo_FactSales[SalesQuantity])

    ```


    ![A978-1-4842-0529-7_7_Fig10_HTML.jpg](img/A978-1-4842-0529-7_7_Fig10_HTML.jpg)


    图 7-10. 使用 `SUMX` 函数


    ## 使用 CALCULATE 函数


    `CALCULATE()` 函数用于基于筛选器计算表达式。以下示例计算通过商店渠道的总销售额。操作步骤如下：


    选择计算区域最左上角的单元格。输入公式，如图 7-11 所示。DAX 公式为：


    ```

    StoreSales:=CALCULATE(SUM(dbo_FactSales[TotalSales]), dbo_DimChannel[ChannelName]="Store")

    ```


    ![A978-1-4842-0529-7_7_Fig11_HTML.jpg](img/A978-1-4842-0529-7_7_Fig11_HTML.jpg)


    图 7-11. 使用 `CALCULATE` 函数显示商店总销售额


    请注意，公式以标签开头，后跟冒号。`StoreSales` 既是此计算字段的标签，也是其标识符。然后 `CALCULATE` 将对 `dbo_FactSales`
    表中渠道名称等于 Store 的 `TotalSales` 字段求和。在键入函数名称或字段名称时，IntelliSense 会弹出一个列表，列出它认为您要输入的内容。高亮显示所需的值，然后按
    `Tab` 键选择。


    请注意，总销售额数字未设置格式。可以通过选中该字段，点击功能区上 `Format` 图标后的下箭头并选择 `currency` 来纠正。该列还需要展开，可以通过单击列标题之间的栏并拖动来实现。结果如图
    7-12 所示。


    ![A978-1-4842-0529-7_7_Fig12_HTML.jpg](img/A978-1-4842-0529-7_7_Fig12_HTML.jpg)


    图 7-12. 格式化为货币

