    ## Summary


    This chapter has shown several ways in which to use SQL with Excel and PowerPivot
    to summarize data from a large table or set of tables. It has demonstrated how
    to join tables based on specified conditions and how to use aggregation to extract
    summary statistics.


    # 6. Designing Reports with Power View


    Power View is a reporting tool that creates its own type of worksheet. For users
    who are not otherwise proficient in Excel, it is a way of creating a "sandbox"
    in which to explore a subset of the data without changing it. Power View allows
    bringing data to life by creating dashboards containing quick and easy visualizations
    based on PowerPivot models or PivotTables. It is possible to create multiple Power
    View worksheets based on the same data.


    ## Elements of the Power View Design Screen


    The Power View screen consists of the following elements, as shown in Figure 6-1:


    - A design surface on the left

    - A filters area in the middle, where data can be filtered based on field values

    - The **Power View Fields** pane, where the fields to be included in the report
    are selected. The top part includes all the available fields, and the bottom part
    shows the selected fields.


    ![A978-1-4842-0529-7_6_Fig1_HTML.jpg](A978-1-4842-0529-7_6_Fig1_HTML.jpg)


    **Figure 6-1.**


    Power View design surface.


    ## Considerations When Using Power View


    Always start with a table view, and then base the chart on the table. It is possible
    to add multiple tables and/or charts to the design surface. Simply click in a
    blank area to add a new chart.


    Include on the design surface only fields that are necessary for the report. Unless
    they are relevant to the report, it is generally a good idea not to include the
    key values that are used to link tables.


    ## Types of Fields


    There are generally two types of fields that are treated very differently:


    - Category or descriptive fields that are nonnumeric

    - Numeric fields that can include calculated fields or measures. The summation
    symbol (Σ) is used to indicate a numeric field whose aggregation type can be changed.


    ## Understanding How Data Is Summarized


    Perhaps the trickiest part of working with Power View is understanding how data
    is summarized. By default, numeric fields are summed, even if they are fields
    in which the sum makes no sense, such as ID number or year. The type of aggregation
    can be easily changed by clicking the down arrow after the field name in the lower
    part of the **Power View Field** pane. The aggregation choices are as follows:


    - Do Not Summarize

    - Sum

    - Average

    - Minimum

    - Maximum

    - Count (Not Blank)

    - Count (Distinct)


    Note that for data to be plotted on a chart, the field must be summarized using
    one of the preceding mathematical functions.'
