    6-23 所示。


    ![A978-1-4842-0529-7_6_Fig23_HTML.jpg](img/A978-1-4842-0529-7_6_Fig23_HTML.jpg)


    *图 6-23. 显示公司、城市和订单价格总计的表*


    基于 `order ID` 创建 `orders` 表与 `order price totals` 表之间的关系，如图 6-24 所示，然后单击 `OK`。


    ![A978-1-4842-0529-7_6_Fig24_HTML.jpg](img/A978-1-4842-0529-7_6_Fig24_HTML.jpg)


