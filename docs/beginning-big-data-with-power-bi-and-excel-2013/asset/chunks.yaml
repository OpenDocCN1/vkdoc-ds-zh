  raw: '## From Spreadsheet to Database


    The first spreadsheet program, VisiCalc (a contraction of visible calculator),
    was released in 1979 for the Apple II computer. It was the first “killer app.”
    A saying at the time was that “VisiCalc sold more Apples than Apple.” VisiCalc
    was developed by Dan Bricklin and Bob Franken. Bricklin was attending Harvard
    Business School and came up with the idea for the program after seeing a professor
    manually write out a financial model. Whenever the professor wanted to make a
    change, he had to erase the old data and rewrite the new data. Bricklin realized
    that this process could be automated, using an electronic spreadsheet running
    on a personal computer.


    In those days, most accounting data was trapped in mainframe programs that required
    a programmer to modify or access. For this reason, programmers were called the
    “high priests” of computing, meaning that end users had little control over how
    programs worked. VisiCalc was very easy to use for a program of that time. It
    was also very primitive, compared to the spreadsheets of today. For example, all
    columns had to be the same width in the early versions of VisiCalc.


    Success breeds competition. VisiCalc did not run on CP/M computers, which were
    the business computers of the day. CP/M, an acronym originally for Control Program/Monitor,
    but that later came to mean “Control Program for Microcomputers,” was an operating
    system used in the late 1970s and early 1980s. In 1980, Sorcim came out with SuperCalc
    as the spreadsheet for CP/M computers. Microsoft released Multiplan in 1982\.
    All of the spreadsheets of the day were menu-driven.


    When the IBM PC was released in August 1981, it was a signal to other large companies
    that the personal computer was a serious tool for big business. VisiCalc was ported
    to run on the IBM PC but did not take into account the enhanced hardware capabilities
    of the new computer.


    Seeing an opportunity, entrepreneur Mitch Kapor, a friend of the developers of
    VisiCalc, founded Lotus Development to write a spreadsheet specifically for the
    IBM PC. He called his spreadsheet program Lotus 1-2-3\. The name 1-2-3 indicated
    that it took the original spreadsheet functionality and added the ability to create
    graphic charts and perform limited database functionality such as simple sorts.


    Lotus 1-2-3 was the first software program to be promoted through television advertising.
    Lotus 1-2-3 became popular hand-in-hand with the IBM PC, and it was the leading
    spreadsheet through the early 1990s.


    Microsoft Excel was the first spreadsheet using the graphical user interface that
    was popularized by the Apple Macintosh. Excel was released in 1987 for the Macintosh.
    It was later ported to Windows. In the early 1990s, as Windows became popular,
    Microsoft packaged Word and Excel together into Microsoft Office and priced it
    aggressively. As a result, Excel displaced Lotus 1-2-3 as the leading spreadsheet.
    Today, Excel is the most widely used spreadsheet program in the world.


    More and more analysis features, such as Pivot Tables, were gradually introduced
    into Excel, and the maximum number of rows that could be processed was increased.
    Using VLOOKUP, it was possible to create simple relations between tables. For
    Excel 2010, Microsoft introduced PowerPivot as a separate download, which allowed
    building a data model based on multiple tables. PowerPivot ships with Excel 2013\.
    [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html) will discuss how to build data
    models using PowerPivot.


    ## Interpreting File Extensions


    The file extension indicates the type of data that is stored in a file. This chapter
    will show how to import a variety of formats into Excel’s native `.xlsx` format,
    which is required to use the advanced features of Power BI discussed in later
    chapters. This chapter will deal with files with the following extensions:


    *   `.xls`: Excel workbook prior to Excel 2007

    *   `.xlsx`: Excel workbook Excel 2007 and later; the second x was added to indicate
    that the data is stored in XML format

    *   `.xlsm`: Excel workbook with macros

    *   `.xltm`: Excel workbook template

    *   `.txt`: a file containing text

    *   `.xml`: a text file in XML format


    ## Using Excel As a Database


    By default, Excel works with tables consisting of rows and columns. Each row is
    a record that includes all the attributes of a single item. Each column is a field
    or attribute.


    A table should show the field names in the first row and have whitespace around
    it—a blank column on each side and a blank row above and below, unless the first
    row is row 1 or the first column is A. Click anywhere inside the table and press
    Ctrl`+`T to define it as a table, as shown in Figure [2-1](#A978-1-4842-0529-7_2_Chapter.html#Fig1).
    Notice the headers with arrows at the top of each column. Clicking the arrow brings
    up a menu offering sorting and filtering options.


    ![A978-1-4842-0529-7_2_Fig1_HTML.jpg](A978-1-4842-0529-7_2_Fig1_HTML.jpg)


    Figure 2-1.


    An Excel table


    Note that, with the current version of Excel, if you sort on one field, it is
    smart enough to bring along the related fields (as long as there are no blank
    columns in the range), as shown in Figure [2-2](#A978-1-4842-0529-7_2_Chapter.html#Fig2),
    where a sort is done by last name. To sort by first and last name, sort on first
    name first and then last name.


    ![A978-1-4842-0529-7_2_Fig2_HTML.jpg](A978-1-4842-0529-7_2_Fig2_HTML.jpg)


    Figure 2-2.


    Excel Table sorted by first and last name


