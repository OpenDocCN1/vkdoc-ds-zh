- fmt: '### Adding a 2D Chart


    A two dimensional chart for Property crime rate per 1,000 persons can be added
    by clicking `2D Chart` on the ribbon. The results are shown in Figure [9-16](#A978-1-4842-0529-7_9_Chapter.html#Fig16).


    ![A978-1-4842-0529-7_9_Fig16_HTML.jpg](A978-1-4842-0529-7_9_Fig16_HTML.jpg)


    Figure 9-16.


    #### 2D Chart Exercise 9-3: Plotting European Unemployment Rates Example


    This example will show how to load data about European unemployment rates into
    Power Query and how to plot it using Power Map. It will also show how to unpivot
    data in order to add a time animation. Follow these steps:


    Click the `Power Query` tab and select `Data Catalog Search`. Type “European Unemployment”
    into the search box. Hover the mouse over each of the results to get a preview
    of the data, as shown in Figure [9-17](#A978-1-4842-0529-7_9_Chapter.html#Fig17).


    ![A978-1-4842-0529-7_9_Fig17_HTML.jpg](A978-1-4842-0529-7_9_Fig17_HTML.jpg)


    Figure 9-17.


    Preview of European unemployment data


    Select `Edit`, at the bottom of the preview screen, to load the data into the
    Query Editor, as shown in Figure [9-18](#A978-1-4842-0529-7_9_Chapter.html#Fig18).


    ![A978-1-4842-0529-7_9_Fig18_HTML.jpg](A978-1-4842-0529-7_9_Fig18_HTML.jpg)


    Figure 9-18.


    Unemployment data in Query Editor


    Check the shape of the data to see if there are any extraneous columns. In this
    case, the columns include the country names and the unemployment rate by year
    and a key column that uses sequential numbering. Also, check the rows. Notice
    that there are rows for US and Japanese unemployment, as well as European.


    Also, check the data type for each column to see if it is the correct type. To
    check the data type, select the column by clicking the heading and note the data
    type shown in the upper right section of the ribbon. To change the data type,
    select a column, click the arrow after `Data Type` on the ribbon, and select the
    correct data type. Notice that the data type for 2005 and 2006 is text and that
    for the other years is `Decimal Number`. Use this approach to change the type
    of all numeric columns to `Decimal Number`.


    Check the column headings. Notice that the heading for the column with the country
    names is `Unemployment`, which is not descriptive. To change the column name,
    right-click the column heading and select `Rename`. Rename it to `country`, as
    shown in Figure [9-19](#A978-1-4842-0529-7_9_Chapter.html#Fig19). Notice that
    the column rename is listed under `Applied Steps` in the `Query Settings` pane
    on the right side of the screen.


    ![A978-1-4842-0529-7_9_Fig19_HTML.jpg](A978-1-4842-0529-7_9_Fig19_HTML.jpg)


    Figure 9-19.


    Query Editor after renaming country column


    When the data is shaped the way you want it, select `Close & Load` at the leftmost
    side of the Query Editor ribbon to load the data into a spreadsheet. Note that
    data can also be loaded into a Data Model, but for this example, a spreadsheet
    will be used.


    This would be a good time to save the spreadsheet and name it “European Unemployment.”


    To start the mapping, select the `Insert` tab and `Map` and then `Launch Power
    Map`.


    The screen shown in Figure [9-20](#A978-1-4842-0529-7_9_Chapter.html#Fig20) will
    appear. Note that in the `Layer` pane, on the right side of the screen, `country`
    is selected as the geographic field. Click `Next`.


    ![A978-1-4842-0529-7_9_Fig20_HTML.jpg](A978-1-4842-0529-7_9_Fig20_HTML.jpg)


    Figure 9-20.


    Country selected as geographic field


    Note that dots appear in each country that has data. Click `Map Labels` on the
    ribbon to display country names and select the numeric field that will be plotted.
    In this case, the 2012 unemployment rate will be checked, so that it can be plotted,
    as shown in Figure [9-21](#A978-1-4842-0529-7_9_Chapter.html#Fig21). Note that
    when the field is checked, it is added to the `Height` box. The default format
    is stacked column, and the default aggregation of the numeric values is sum. Pointing
    the mouse at a column on the map will display the unemployment rate for that country
    in 2012.


    ![A978-1-4842-0529-7_9_Fig21_HTML.jpg](A978-1-4842-0529-7_9_Fig21_HTML.jpg)


    Figure 9-21.


    2012 unemployment shown as a bar chart


    Change the aggregation to none by clicking the arrow at the right side of the
    `Height` box and selecting `No Aggregation`. Resize the legend box by clicking
    it and using the handles, and drag it to reposition it on the left side of the
    map, as shown in Figure [9-22](#A978-1-4842-0529-7_9_Chapter.html#Fig22).


    ![A978-1-4842-0529-7_9_Fig22_HTML.jpg](A978-1-4842-0529-7_9_Fig22_HTML.jpg)


    Figure 9-22.


    Map after moving legend box and changing aggregation to none


    Experiment with the different visualization formats by clicking the icons above
    the word `Height` in the `Layer` pane, to view the clustered column, bubble, heat
    map, and region. Note that because only one set of data is being shown, the clustered
    column and stacked column format are the same. A bubble view is shown in Figure
    [9-23](#A978-1-4842-0529-7_9_Chapter.html#Fig23).


    ![A978-1-4842-0529-7_9_Fig23_HTML.jpg](A978-1-4842-0529-7_9_Fig23_HTML.jpg)


    Figure 9-23.


    Bubble view


    To zoom in on a map, click the large `+` sign at the bottom right of the map or
    double-click an area of the map to zoom in.


    To change the opacity, size, or thickness of the bubble, click the gear icon on
    the right, at the top of the `Layer` pane. Figure [9-24](#A978-1-4842-0529-7_9_Chapter.html#Fig24)
    shows a heat map view with the color scale set to 180%, the radius of the heat
    map to 191%, and opacity at 99%. The legend box for `Layer 1` shows the color
    key based on the unemployment rate. Note that you can also decide whether to show
    zeroes, negatives, and nulls, by checking or unchecking the box.


    ![A978-1-4842-0529-7_9_Fig24_HTML.jpg](A978-1-4842-0529-7_9_Fig24_HTML.jpg)


    Figure 9-24.


    Heat map view


    ### Showing Two or More Values


    Two or more values can be displayed, such as showing unemployment rates in two
    different years. Using the example from the preceding section, Figure [9-25](#A978-1-4842-0529-7_9_Chapter.html#Fig25)
    shows the employment rates for 2011 (orange) and 2012 (blue) as a bubble. Pointing
    the mouse at the color on the bubble will show the unemployment rate for that
    year.


    ![A978-1-4842-0529-7_9_Fig25_HTML.jpg](A978-1-4842-0529-7_9_Fig25_HTML.jpg)


    Figure 9-25.


    Bubble view


    Figure [9-26](#A978-1-4842-0529-7_9_Chapter.html#Fig26) shows the unemployment
    rates for 2010 (orange) and 2011 (blue) as stacked bar columns. Pointing the mouse
    at the color on the stacked bar will show the unemployment rate for that year.


    ![A978-1-4842-0529-7_9_Fig26_HTML.jpg](A978-1-4842-0529-7_9_Fig26_HTML.jpg)


    Figure 9-26.


    Stacked bar view


    The same data shown with clustered columns, where the columns are side-by-side,
    is shown in Figure [9-27](#A978-1-4842-0529-7_9_Chapter.html#Fig27).


    ![A978-1-4842-0529-7_9_Fig27_HTML.jpg](A978-1-4842-0529-7_9_Fig27_HTML.jpg)


    Figure 9-27.


    Clustered column view'
