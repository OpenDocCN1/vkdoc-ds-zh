    ### 添加 2D 图表


    可以通过单击功能区上的`2D Chart`为每千人财产犯罪率添加二维图表。结果如图 9-16 所示。


    ![A978-1-4842-0529-7_9_Fig16_HTML.jpg](img/A978-1-4842-0529-7_9_Fig16_HTML.jpg)


    图 9-16.


    #### 2D 图表练习 9-3：绘制欧洲失业率示例


    本示例将展示如何将欧洲失业率数据加载到 Power Query 中，以及如何使用 Power Map 进行绘制。还将展示如何取消数据透视以添加时间动画。请按照以下步骤操作：


    单击`Power Query`选项卡，然后选择`Data Catalog Search`。在搜索框中输入“European Unemployment”。将鼠标悬停在各结果上方以预览数据，如图
    9-17 所示。


    ![A978-1-4842-0529-7_9_Fig17_HTML.jpg](img/A978-1-4842-0529-7_9_Fig17_HTML.jpg)


    图 9-17.


    欧洲失业数据预览


    在预览屏幕底部选择`Edit`，将数据加载到查询编辑器中，如图 9-18 所示。


    ![A978-1-4842-0529-7_9_Fig18_HTML.jpg](img/A978-1-4842-0529-7_9_Fig18_HTML.jpg)


    图 9-18.


    查询编辑器中的失业数据


    检查数据的形状，查看是否存在多余的列。在此例中，列包含国家名称、按年份划分的失业率以及一个使用顺序编号的键列。同时检查行。注意，数据中包含了美国、日本及欧洲的失业率行。


    另外，检查每一列的数据类型是否正确。要检查数据类型，请单击列标题选中该列，并注意功能区右上部分显示的数据类型。要更改数据类型，请选中一列，单击功能区上`Data
    Type`后的箭头，然后选择正确的数据类型。注意，2005 年和 2006 年的数据类型是文本，而其他年份的数据类型是`Decimal Number`。使用此方法将所有数值列的类型更改为`Decimal
    Number`。


    检查列标题。注意，包含国家名称的列的标题是`Unemployment`，这不够描述性。要更改列名，请右键单击该列标题并选择`Rename`。将其重命名为`country`，如图
    9-19 所示。注意，列的重命名操作会列在屏幕右侧`Query Settings`窗格的`Applied Steps`下。


    ![A978-1-4842-0529-7_9_Fig19_HTML.jpg](img/A978-1-4842-0529-7_9_Fig19_HTML.jpg)


    图 9-19.


    重命名国家列后的查询编辑器


    当数据形状达到要求后，在查询编辑器功能区最左侧选择`Close & Load`，将数据加载到电子表格中。请注意，数据也可以加载到数据模型中，但本示例将使用电子表格。


    此时建议保存电子表格并将其命名为“European Unemployment”。


    若要开始绘制地图，请选择`Insert`选项卡和`Map`，然后选择`Launch Power Map`。


    将出现如图 9-20 所示的屏幕。请注意，在屏幕右侧的`Layer`窗格中，`country`已被选为地理字段。单击`Next`。


    ![A978-1-4842-0529-7_9_Fig20_HTML.jpg](img/A978-1-4842-0529-7_9_Fig20_HTML.jpg)


    图 9-20.


    选择国家作为地理字段


    请注意，每个有数据的国家都出现了圆点。单击功能区上的`Map Labels`以显示国家名称，并选择将要绘制的数值字段。在此例中，将勾选 2012 年失业率以便绘制，如图
    9-21 所示。请注意，勾选该字段后，它会被添加到`Height`框中。默认格式为堆积柱状图，默认的数值聚合方式为求和。将鼠标指向地图上的柱状图将显示该国家
    2012 年的失业率。


    ![A978-1-4842-0529-7_9_Fig21_HTML.jpg](img/A978-1-4842-0529-7_9_Fig21_HTML.jpg)


    图 9-21.


    以柱状图显示的 2012 年失业率


    通过单击`Height`框右侧的箭头并选择`No Aggregation`，将聚合方式更改为无。通过单击图例框并使用手柄调整其大小，然后将其拖拽重新定位到地图左侧，如图
    9-22 所示。


    ![A978-1-4842-0529-7_9_Fig22_HTML.jpg](img/A978-1-4842-0529-7_9_Fig22_HTML.jpg)


    图 9-22.


    移动图例框并将聚合更改为无后的地图


    通过单击`Layer`窗格中`Height`字样上方的图标，尝试不同的可视化格式，以查看聚类柱状图、气泡图、热力图和区域图。注意，由于仅显示一组数据，聚类柱状图和堆积柱状图格式相同。气泡图视图如图
    9-23 所示。


    ![A978-1-4842-0529-7_9_Fig23_HTML.jpg](img/A978-1-4842-0529-7_9_Fig23_HTML.jpg)


    图 9-23.


    气泡图视图


    要放大地图，请单击地图右下角的大`+`号，或双击地图上的某个区域进行放大。


    要更改气泡的不透明度、大小或厚度，请单击`Layer`窗格右上角的齿轮图标。图 9-24 显示了一个热力图视图，其中颜色比例设置为 180%，热力图半径设置为
    191%，不透明度设置为 99%。`Layer 1`的图例框显示了基于失业率的颜色对应关系。请注意，您还可以通过勾选或取消勾选复选框来决定是否显示零值、负值和空值。


    ![A978-1-4842-0529-7_9_Fig24_HTML.jpg](img/A978-1-4842-0529-7_9_Fig24_HTML.jpg)


    图 9-24.


    热力图视图


    ### 显示两个或多个值


    可以显示两个或多个值，例如显示两个不同年份的失业率。使用上一节的示例，图 9-25 以气泡图形式显示了 2011 年（橙色）和 2012 年（蓝色）的失业率。将鼠标指向气泡上的颜色将显示该年份的失业率。


    ![A978-1-4842-0529-7_9_Fig25_HTML.jpg](img/A978-1-4842-0529-7_9_Fig25_HTML.jpg)


    图 9-25.


    气泡图视图


    图 9-26 以堆积柱状图形式显示了 2010 年（橙色）和 2011 年（蓝色）的失业率。将鼠标指向堆积柱状图上的颜色将显示该年份的失业率。


    ![A978-1-4842-0529-7_9_Fig26_HTML.jpg](img/A978-1-4842-0529-7_9_Fig26_HTML.jpg)


    图 9-26.


    堆积柱状图视图


    使用聚类柱状图（柱状图并排排列）显示的相同数据如图 9-27 所示。


    ![A978-1-4842-0529-7_9_Fig27_HTML.jpg](img/A978-1-4842-0529-7_9_Fig27_HTML.jpg)


    图 9-27.


    聚类柱状图视图

