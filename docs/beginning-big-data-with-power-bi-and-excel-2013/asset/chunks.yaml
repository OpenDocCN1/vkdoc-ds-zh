  trans: '

    # 4. 构建数据模型


    本章将介绍 Excel 数据模型，也称为 PowerPivot 数据模型。适用于 Excel 2013 的 PowerPivot 基于在 Excel 内部运行的
    SQL Server Analysis Services 2012 的表格引擎。数据模型允许关联多个表。它完全在内存中运行并对数据进行压缩，因此可以处理数百万行数据。


    Excel 数据模型是一个表的集合，其中包含表之间的关系。数据模型为 Power BI 提供了基础结构。本章将演示如何使用数据透视表从数据模型中的多个表中提取摘要信息。所使用的示例将从简单逐渐过渡到复杂。


    ## 启用 PowerPivot


    PowerPivot 随 Excel 2013 一同提供，但默认情况下未启用。要启用 PowerPivot，请按照以下步骤操作：


    单击 `文件` 选项卡以查看 Backstage 视图。单击左窗格底部的 `选项`。在左窗格中选择 `加载项`。在窗口底部，下拉 `管理` 后面的箭头，选择
    `COM 加载项`，然后单击 `转到`，如图 4-1 所示。


    ![A978-1-4842-0529-7_4_Fig1_HTML.jpg](img/A978-1-4842-0529-7_4_Fig1_HTML.jpg)


    图 4-1.


    Excel 选项屏幕 勾选 `Microsoft Office PowerPivot for Excel 2013`、`Microsoft Power Map
    for Excel` 和 `Power View`，如图 4-2 所示，然后单击 `确定`。


    ![A978-1-4842-0529-7_4_Fig2_HTML.jpg](img/A978-1-4842-0529-7_4_Fig2_HTML.jpg)


    图 4-2.


    COM 加载项对话框


    ## 关系数据库


    直到几年前，关系数据库还是最广泛使用的数据库类型。近几年来，NoSQL（或非关系型）数据库在日志数据和其他类型的大数据中变得流行起来。NoSQL 数据库将在后续章节中进行更详细的介绍。然而时至今日，大多数事务性业务数据仍存储在关系数据库中。


    关系数据库设计的原则之一是避免重复字段。如果遇到重复字段，数据会通过创建其他表来进行规范化，如第 1 章所述。例如，在一个人事示例中，员工表的主键将是员工的社会安全号码，因为它是唯一的，并且在财务报告中是必需的。员工会被分配到一个部门，但员工表中仅存储部门代码。部门代码是一个外键，指向部门表中的相应记录，该记录包含其他信息，例如部门办公室、部门经理和电话号码。因此，不必为每个员工记录重复部门信息。


    ## 数据库术语


    以下术语常用于描述关系数据库以及数据库中表之间的关系。


    * `字段` 是表中最小的数据单元。字段存储在 Excel 表的列中。

    * `记录` 是关于一个人或一件事的所有数据或信息。在 Excel 中，记录是表中的一行。

    * `表` 是数据库中按结构化格式存储的相关数据的集合。它由字段（列）和记录（行）组成。

    * `数据库` 是表的集合。

    * 关系表的`主键` 是唯一标识表中每条记录的一个或多个字段。对于涉及人员的数据，尤其是需要税务报告的数据，最常见的主键是社会安全号码。当然，在处理诸如社会安全号码之类的个人数据时，采取适当的安全措施至关重要。

    * `外键` 是一个表中的某个或多个字段，用于唯一标识另一个表中的一行。

    * `候选键` 是表中可以唯一标识任何记录而无需引用任何其他数据的一个或多个字段。每个表可能有一个或多个候选键，但会选择其中一个候选键作为主键。这通常是候选键中的最佳选择。

    * 当一个键由多个列组成时，称为`复合键`。

    * `关系` 允许基于键字段从多个表中访问数据。

    * `规范化` 是组织关系数据库中的表以最小化冗余的过程。规范化通常涉及将大表划分为较小的表，并定义它们之间的关系。

    * `第三范式` (3NF)，由关系数据库模型发明者 E. F. Codd 定义，消除了不依赖于主键的字段。要满足第三范式，表中的每个字段都必须依赖于该表的主键，并且只依赖于主键。这被称为消除传递依赖，即一个字段依赖于另一个非主键字段的情况。

    * `源表` 是关系开始所在的表。在下一节的示例中，员工表是源表。

    * `相关表` 是包含要查找的值的表。在以下示例中，部门表是相关表。

    '
- fmt: '# Creating a Data Model from Excel Tables


    This section will start with a simple example, to illustrate the principles of
    relating tables. In this example, a Data Model will be created from two small
    tables: `employee` and `department`. The tables are normalized, meaning that repeating
    fields have been eliminated. Instead of recording all the information about a
    single department in the employee record, only a department code is used. Then
    a relationship is defined between the `employee` and `department` table, so that
    the department information can be extracted from the `department` table.


    A Pivot Table can be used to extract meaningful information from a Data Model.
    To create a Pivot Table that draws on data from both tables to show average salary
    by department, do the following:


    Define each group of data as a table by clicking inside the table and pressing
    `Ctrl+T`. Click anywhere in the table and click the Table Tools Design tab. On
    the left side of the ribbon, type in a table name, in this case, `employees`,
    as shown in Figure 4-3. Also, rename the `departments`.


    ![A978-1-4842-0529-7_4_Fig3_HTML.jpg](A978-1-4842-0529-7_4_Fig3_HTML.jpg)


    Figure 4-3. Employee and department tables


    Highlight the `employee` table. Go to the Insert tab and select Pivot Table. In
    the Create PivotTable dialog, select Add this data to the Data Model and click
    OK, as shown in Figure 4-4.


    ![A978-1-4842-0529-7_4_Fig4_HTML.jpg](A978-1-4842-0529-7_4_Fig4_HTML.jpg)


    Figure 4-4. Create PivotTable dialog


    In the PivotTable Fields pane, click All (at the upper right), to see both tables,
    as shown in Figure 4-5. Drag the `deptname` field from the `department` table
    to the columns box. Drag Sum of salary from the `employees` table to values. Note
    the prompt “Relationships between tables may be needed.” Click Create.


    ![A978-1-4842-0529-7_4_Fig5_HTML.jpg](A978-1-4842-0529-7_4_Fig5_HTML.jpg)


    Figure 4-5. PivotTable showing total salaries by department


    As shown in Figure 4-6, select `employees` as the first table and `dept` as the
    foreign key. Select `departments` as the second table and `deptcode` as the primary
    key. Click OK. Note that the field names, as defined by the column headings, do
    not have to be the same.


    ![A978-1-4842-0529-7_4_Fig6_HTML.jpg](A978-1-4842-0529-7_4_Fig6_HTML.jpg)


    Figure 4-6. Create Relationship dialog


    Drag `lname` to the Rows box. The resulting Pivot Table, as shown in Figure 4-7,
    will display the sum of salaries by department.


    ![A978-1-4842-0529-7_4_Fig7_HTML.jpg](A978-1-4842-0529-7_4_Fig7_HTML.jpg)


    Figure 4-7. PivotTable showing employee salary by department


    To see instead the average salary by department, first remove the `lname` field
    from the Rows box and then in the PivotTable Fields pane, click the drop-down
    arrow next to Sum of salary in the Values box. Select value field setting and
    then average to see the average salary by department, as shown in Figure 4-8.


    ![A978-1-4842-0529-7_4_Fig8_HTML.jpg](A978-1-4842-0529-7_4_Fig8_HTML.jpg)


    Figure 4-8. PivotTable showing average salary by department


    This example showed how to relate two tables, `employees` and `departments`, using
    department code. `dept` is a foreign key in the `employees` table, and `deptcode`
    is the primary key for the `departments` table. The Pivot Table relates the two
    tables.


    # Loading Data Directly into the Data Model


    In this example, data will be loaded directly into the Data Model using an example
    from Microsoft’s Northwind Access Database. This example demonstrates running
    PowerPivot on top of Excel.


    To load data directly into the Data Model, do the following:


    Click the PowerPivot tab to open the ribbon. Click the Manage button at the top-left
    end of the ribbon. Once the PowerPivot window is open, you can load data by clicking
    From Database in the Get External Data group. This provides a choice of database
    sources, as shown in Figure 4-9. For this example, From Access will be selected.


    ![A978-1-4842-0529-7_4_Fig9_HTML.jpg](A978-1-4842-0529-7_4_Fig9_HTML.jpg)


    Figure 4-9. PowerPivot Get External Data group


    In the Table Import Wizard dialog, click the Browse button to find the Access
    file you want to import. For this example, `Database1` in the documents folder
    will be selected. This file is available from the Apress web site. Click Test
    Connection. If the test is successful, click Next.


    PowerPivot opens the Table Import Wizard, as shown in Figure 4-10, to step you
    through the process of loading data. Choose Select from a list of tables and views
    to choose the data to import. Click Next.


    ![A978-1-4842-0529-7_4_Fig10_HTML.jpg](A978-1-4842-0529-7_4_Fig10_HTML.jpg)


    Figure 4-10. Table Import Wizard


    Click the top-left box to select all tables, as shown in Figure 4-11. Note that
    in the lower right corner of the dialog, there is an option to Preview & Filter.
    This option can be used to select a subset of data from very large datasets. In
    this example, all rows in all tables will be imported. Click Finish to complete
    the import.


    ![A978-1-4842-0529-7_4_Fig11_HTML.jpg](A978-1-4842-0529-7_4_Fig11_HTML.jpg)


    Figure 4-11. Table Import Wizard—Select Tables and Views


    Relationships are automatically loaded into the data model, if they are present
    in the imported data. Note that PowerPivot tables are read-only, so that the data
    cannot be changed.


    To view relationships, go to the PowerPivot tab and select Manage to open the
    PowerPivot window. Then click the PowerPivot Diagram View at the right end of
    the ribbon to see the relationships between tables, and click Finish to complete
    the import, as shown in Figure 4-12.


    ![A978-1-4842-0529-7_4_Fig12_HTML.jpg](A978-1-4842-0529-7_4_Fig12_HTML.jpg)


    Figure 4-12. Diagram View


    # Creating a Pivot Table from Two Tables


    In this example, a Pivot Table will be created, based on the `inventory` and `products`
    tables. Notice in Figure 4-12 that the two tables are linked, based on product
    code. The Inventory table includes the on-hand data for each item in inventory,
    with a primary key of `ProductCode`. To find the full product name, a lookup has
    to be performed in the product table, based on product ID. To create a Pivot Table
    based on these two tables, do the following:


    Click Pivot Table on the File tab in the PowerPivot window and select PivotTable
    from the menu. Click OK to put the Pivot Table in a new worksheet. Click the arrow
    next to the `products` table in the Pivot Table Fields pane and drag the `ProductName`
    field to the Rows box. Then scroll up to go to the `inventory` table, click the
    left arrow to show the fields, and drag `OnHand` to the Values box. The results
    are shown in Figure 4-13, which indicates the sum of the on-hand values for each
    product.


    ![A978-1-4842-0529-7_4_Fig13_HTML.jpg](A978-1-4842-0529-7_4_Fig13_HTML.jpg)


    Figure 4-13. PivotTable showing product name and on-hand quantity'
  raw: '## Creating a Data Model from Excel Tables


    This section will start with a simple example, to illustrate the principles of
    relating tables. In this example, a Data Model will be created from two small
    tables: employee and department. The tables are normalized, meaning that repeating
    fields have been eliminated. Instead of recording all the information about a
    single department in the employee record, only a department code is used. Then
    a relationship is defined between the employee and department table, so that the
    department information can be extracted from the department table.


    A Pivot Table can be used to extract meaningful information from a Data Model.
    To create a Pivot Table that draws on data from both tables to show average salary
    by department, do the following:


    Define each group of data as a table by clicking inside the table and pressing
    Ctrl+T.   Click anywhere in the table and click the Table Tools Design tab. On
    the left side of the ribbon, type in a table name, in this case, employees, as
