- fmt: '# 4. Building a Data Model


    This chapter will cover the Excel Data Model also known as the PowerPivot Data
    Model. PowerPivot for Excel 2013 is based on the tabular engine of SQL Server
    Analysis Services 2012 running inside Excel. The Data Model allows relating of
    multiple tables. It runs completely in memory and compresses data so that it can
    process millions of rows.


    The Excel Data Model is a collection of tables, including the relationships between
    them. The Data Model provides the structure for Power BI. This chapter will demonstrate
    how to use Pivot Tables to extract summary information from multiple tables in
    a Data Model. The examples used will progress from the simple to the more complex.


    ## Enabling PowerPivot


    PowerPivot is included with Excel 2013, but it is not enabled by default. To enable
    PowerPivot, follow these steps:


    Click the `File` tab to see the Backstage view. Click `Options` at the bottom
    of the left pane. Select `Add-Ins` on the left pane. At the bottom of the window,
    pull down the arrow after `Manage`, select `COM Add-ins`, and click `Go`, as shown
    in Figure [4-1](#A978-1-4842-0529-7_4_Chapter.html#Fig1).


    ![A978-1-4842-0529-7_4_Fig1_HTML.jpg](A978-1-4842-0529-7_4_Fig1_HTML.jpg)


    Figure 4-1.


    Excel Options screen Check `Microsoft Office PowerPivot for Excel 2013`, `Microsoft
    Power Map for Excel`, and `Power View`, as shown in Figure [4-2](#A978-1-4842-0529-7_4_Chapter.html#Fig2),
    and click `OK`.


    ![A978-1-4842-0529-7_4_Fig2_HTML.jpg](A978-1-4842-0529-7_4_Fig2_HTML.jpg)


    Figure 4-2.


    COM Add-Ins dialog


    ## Relational Databases


    Until a few years ago, relational databases were the most widely used type of
    database. In the last few years, NoSQL (or nonrelational) databases have become
    popular for log data and other types of big data. NoSQL databases will be covered
    more extensively in future chapters. Still, today, the majority of transactional
    business data is stored in relational databases.


    One of the principles of relational database design is avoiding repeating fields.
    If repeating fields are encountered, the data is normalized by creating other
    tables, as described in [Chapter 1](#A978-1-4842-0529-7_1_Chapter.html). For instance,
    in a personnel example, the primary key of the employee table would be the employee
    Social Security number, because it is unique, and it is required for financial
    reporting. The employee would be assigned to a department, but only a department
    code would be stored in the employee table. The department code would be a foreign
    key that would point to the appropriate record in the department table, which
    would have other information, such as the department office, department manager,
    and phone number. Thus, the department information would not have to be repeated
    for each employee record.


    ## Database Terminology


    The following terms are commonly used to describe relational databases and the
    relationships between tables within a database.


    * A `field` is the smallest unit of data in a table. Fields are stored in columns
    in Excel tables.

    * A `record` is all of the data or information about one person or one thing.
    In Excel, a record is a row in a table.

    * A `table` is a collection of related data stored in a structured format within
    a database. It consists of fields (columns) and records (rows).

    * A `database` is a collection of tables.

    * The `primary key` of a relational table is a field (or fields) that uniquely
    identifies each record in the table. For data involving people, especially data
    that requires tax reporting, the most common primary key is a Social Security
    number. It is, of course, important to have proper security when dealing with
    personal data such as Social Security numbers.

    * A `foreign key` is a field or fields in one table that uniquely identifies a
    row of another table.

    * A `candidate key` is a field or fields in a table that can uniquely identify
    any record without referring to any other data. Each table may have one or more
    candidate keys, but one candidate key is selected as the primary key. This is
    usually the best among the candidate keys.

    * When a key is composed of more than one column, it is known as a `composite
    key`.

    * A `relationship` allows accessing data from multiple tables, based on a key
    field.

    * `Normalization` is the process of organizing the tables in a relational database
    to minimize redundancy. Normalization often involves dividing large tables into
    smaller tables and defining relationships between them.

    * `Third Normal Form` (3NF), defined by relational database model inventor E.
    F. Codd, eliminates fields not dependent on the primary key. To be in Third Normal
    Form, each field in a table must depend on the primary key, and only the primary
    key, of that table. This is called eliminating transitive tendencies, where one
    field depends on another field that is not the primary key.

    * A `source table` is the table wherein the relationship starts. In the example
    in the following section, the employee table is the source table.

    * The `related table` is the table that contains the values to look up. In the
    following example, the department table is the related table.'
