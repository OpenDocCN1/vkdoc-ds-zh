    # 从 Excel 表创建数据模型


    本节将以一个简单的示例开始，说明关联表的原则。在此示例中，将从两个小表 `employee` 和 `department` 创建一个数据模型。这些表是规范化的，意味着重复字段已被消除。不在员工记录中记录某个部门的所有信息，而仅使用一个部门代码。然后在
    `employee` 表和 `department` 表之间定义一个关系，以便可以从 `department` 表中提取部门信息。


    可以使用数据透视表从数据模型中提取有意义的信息。要创建一个利用两个表中的数据来显示按部门划分的平均薪资的数据透视表，请执行以下操作：


    通过单击表格内部并按 `Ctrl+T`，将每组数据定义为一个表。单击表中的任意位置，然后点击 `表工具` `设计` 选项卡。在功能区的左侧，键入表名称，在本例中为
    `employees`，如图 4-3 所示。另外，重命名 `departments` 表。


    ![A978-1-4842-0529-7_4_Fig3_HTML.jpg](img/A978-1-4842-0529-7_4_Fig3_HTML.jpg)


    图 4-3. 员工表和部门表


    选中 `employee` 表。转到 `插入` 选项卡，选择 `数据透视表`。在 `创建数据透视表` 对话框中，选择 `将此数据添加到数据模型`，然后点击
    `确定`，如图 4-4 所示。


    ![A978-1-4842-0529-7_4_Fig4_HTML.jpg](img/A978-1-4842-0529-7_4_Fig4_HTML.jpg)


    图 4-4. 创建数据透视表对话框


    在 `数据透视表字段` 窗格中，点击 `全部`（位于右上角），以查看两个表，如图 4-5 所示。将 `deptname` 字段从 `department`
    表拖到 `列` 框中。将 `Sum of salary` 从 `employees` 表拖到 `值` 框中。注意提示“可能需要表之间的关系”，点击 `创建`。


    ![A978-1-4842-0529-7_4_Fig5_HTML.jpg](img/A978-1-4842-0529-7_4_Fig5_HTML.jpg)


    图 4-5. 显示按部门划分的薪资总额的数据透视表


    如图 4-6 所示，选择 `employees` 作为第一个表，`dept` 作为外键。选择 `departments` 作为第二个表，`deptcode`
    作为主键。点击 `确定`。请注意，由列标题定义的字段名称不必相同。


    ![A978-1-4842-0529-7_4_Fig6_HTML.jpg](img/A978-1-4842-0529-7_4_Fig6_HTML.jpg)


    图 4-6. 创建关系对话框


    将 `lname` 拖到 `行` 框中。生成的数据透视表将显示按部门划分的薪资总额，如图 4-7 所示。


    ![A978-1-4842-0529-7_4_Fig7_HTML.jpg](img/A978-1-4842-0529-7_4_Fig7_HTML.jpg)


    图 4-7. 显示按部门划分的员工薪资的数据透视表


    若要改为显示按部门划分的平均薪资，首先从 `行` 框中移除 `lname` 字段，然后在 `数据透视表字段` 窗格中，点击 `值` 框中 `Sum of salary`
    旁边的下拉箭头。选择 `值字段设置`，然后选择 `平均值`，以查看按部门划分的平均薪资，如图 4-8 所示。


    ![A978-1-4842-0529-7_4_Fig8_HTML.jpg](img/A978-1-4842-0529-7_4_Fig8_HTML.jpg)


    图 4-8. 显示按部门划分的平均薪资的数据透视表


    此示例展示了如何使用部门代码关联两个表 `employees` 和 `departments`。`dept` 是 `employees` 表中的外键，而 `deptcode`
    是 `departments` 表的主键。数据透视表将这两者关联起来。


    # 直接将数据加载到数据模型中


    在此示例中，将使用来自 Microsoft Northwind Access 数据库的示例，将数据直接加载到数据模型中。此示例演示了在 Excel 之上运行
    PowerPivot。


    要将数据直接加载到数据模型中，请执行以下操作：


    点击 `PowerPivot` 选项卡以打开功能区。点击功能区左上角的 `管理` 按钮。打开 PowerPivot 窗口后，您可以通过点击 `获取外部数据`
    组中的 `从数据库` 来加载数据。这将提供数据库源的选择，如图 4-9 所示。在此示例中，将选择 `从 Access`。


    ![A978-1-4842-0529-7_4_Fig9_HTML.jpg](img/A978-1-4842-0529-7_4_Fig9_HTML.jpg)


    图 4-9. PowerPivot 获取外部数据组


    在 `表导入向导` 对话框中，点击 `浏览` 按钮以找到要导入的 Access 文件。在此示例中，将选择文档文件夹中的 `Database1`。该文件可从
    Apress 网站获取。点击 `测试连接`。如果测试成功，点击 `下一步`。


    PowerPivot 将打开 `表导入向导`，如图 4-10 所示，引导您完成加载数据的过程。选择 `从表和视图列表中选择` 以选择要导入的数据。点击 `下一步`。


    ![A978-1-4842-0529-7_4_Fig10_HTML.jpg](img/A978-1-4842-0529-7_4_Fig10_HTML.jpg)


    图 4-10. 表导入向导


    点击左上角的框以选择所有表，如图 4-11 所示。请注意，在对话框的右下角，有一个 `预览和筛选` 选项。此选项可用于从非常大的数据集中选择数据子集。在此示例中，将导入所有表中的所有行。点击
    `完成` 以完成导入。


    ![A978-1-4842-0529-7_4_Fig11_HTML.jpg](img/A978-1-4842-0529-7_4_Fig11_HTML.jpg)


    图 4-11. 表导入向导 — 选择表和视图


    如果导入的数据中存在关系，这些关系将自动加载到数据模型中。请注意，PowerPivot 表是只读的，因此无法更改数据。


    若要查看关系，请转到 `PowerPivot` 选项卡并选择 `管理` 以打开 PowerPivot 窗口。然后点击功能区右侧的 `PowerPivot 关系图视图`，以查看表之间的关系，并点击
    `完成` 以完成导入，如图 4-12 所示。


    ![A978-1-4842-0529-7_4_Fig12_HTML.jpg](img/A978-1-4842-0529-7_4_Fig12_HTML.jpg)


    图 4-12. 关系图视图


    # 从两个表创建数据透视表


    在此示例中，将基于 `inventory` 和 `products` 表创建一个数据透视表。请注意在图 4-12 中，这两个表是基于产品代码链接的。`Inventory`
    表包含库存中每个项目的现有数据，其主键为 `ProductCode`。要查找完整的产品名称，必须根据产品 ID 在 `product` 表中执行查找。要基于这两个表创建数据透视表，请执行以下操作：


    在 PowerPivot 窗口的 `文件` 选项卡上点击 `数据透视表`，然后从菜单中选择 `数据透视表`。点击 `确定` 将数据透视表放置在新工作表中。在
    `数据透视表字段` 窗格中点击 `products` 表旁边的箭头，然后将 `ProductName` 字段拖到 `行` 框中。然后向上滚动到 `inventory`
    表，点击左箭头显示字段，并将 `OnHand` 拖到 `值` 框中。结果如图 4-13 所示，该图显示了每个产品的现有值总和。


    ![A978-1-4842-0529-7_4_Fig13_HTML.jpg](img/A978-1-4842-0529-7_4_Fig13_HTML.jpg)


    图 4-13. 显示产品名称和现有数量的数据透视表

