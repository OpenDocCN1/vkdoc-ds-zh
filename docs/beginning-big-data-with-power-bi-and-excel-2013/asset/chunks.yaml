    ## 总结


    本章演示了如何将数据加载到 Power Query，如何在查询编辑器中塑造数据，以及如何将其加载到 Power Map 中以创建关于数据的可视化故事。演示了
    Power Map 的部分功能，例如创建二维和三维可视化，以及创建动画以显示随时间的变化。


    # 10. 统计计算


    Excel 提供了多种用于执行统计分析的内置工具。本章重点介绍其中一些工具，包括基本图表绘制和 Excel 分析工具库。讨论了描述性统计和推断性统计之间的区别，并介绍了
    Excel 的统计函数。

