    # 按员工生成订单总额报表


    本示例将按员工生成订单总额报表。要创建此报表，需要关联三个表：`employees`、`orders` 和 `order details`。


    在本示例中，请按照“导入外部数据库”一节中前一示例的步骤 1-6 进行操作。


    输入如图 5-12 所示的 SQL 语句，以提取所有订单中按员工细分的价格乘以数量的总和。单击**验证**以确保 SQL 语句输入正确。


    ![A978-1-4842-0529-7_5_Fig12_HTML.jpg](img/A978-1-4842-0529-7_5_Fig12_HTML.jpg)


    **图 5-12。**


    SQL 查询：

    ```

    Select employees.[last name], sum([order details].[unit price] * [order details].quantity)
    from employees, orders, [order details] where employees.id=orders.[employee id]
    and orders.[order id]=[order details].[order id] group by employees.[last name]

    ```


    请注意，基于图 5-3 所示的关系，使用两个关系来关联三个表。`orders` 表中没有显示任何字段，但该表被用作关联表。以下是本示例中使用的图 5-3 中的关系：

    - `employees.id=orders.[employee id]`

    - `orders.[order id]=[order details].[order id]`


    单击**完成**以执行 SQL 语句。生成的实际数据如图 5-14 所示——按员工列出的订单价值列表。


    ![A978-1-4842-0529-7_5_Fig14_HTML.jpg](img/A978-1-4842-0529-7_5_Fig14_HTML.jpg)


    **图 5-14。**


    按员工统计的订单总额。此查询生成八行，如图 5-13 所示。


    ![A978-1-4842-0529-7_5_Fig13_HTML.jpg](img/A978-1-4842-0529-7_5_Fig13_HTML.jpg)


    **图 5-13。**


    显示此查询生成了八行的成功屏幕。


    ## 使用 MSQuery


    另一种方法是结合 Microsoft Query 使用 SQL。本示例将演示另一种访问本章前面使用的 Northwind 数据库的方法。请按以下步骤操作：


    要输入 SQL 查询，请单击**菜单**栏下的 **SQL** 按钮，然后输入如图 5-20 所示的 SQL 查询。


    ![A978-1-4842-0529-7_5_Fig20_HTML.jpg](img/A978-1-4842-0529-7_5_Fig20_HTML.jpg)


    **图 5-20。**


    显示 SQL 查询的查询屏幕：

    ```

    Select sum([order details].[unit price] *[order details].quantity) from orders,[order
    details]

    ```


    单击**关闭**并展开显示表的窗口，以查看已定义的关系，如图 5-19 所示。


    ![A978-1-4842-0529-7_5_Fig19_HTML.jpg](img/A978-1-4842-0529-7_5_Fig19_HTML.jpg)


    **图 5-19。**


    显示表和关系的查询屏幕。使用**添加表**窗口，通过双击每个表来添加 `employees`、`orders` 和 `order detail` 表，如图
    5-18 所示。


    ![A978-1-4842-0529-7_5_Fig18_HTML.jpg](img/A978-1-4842-0529-7_5_Fig18_HTML.jpg)


    **图 5-18。**


    用于添加表的 Microsoft Query 窗口。选择之前下载的 `Database2`，如图 5-17 所示，然后单击**确定**。


    ![A978-1-4842-0529-7_5_Fig17_HTML.jpg](img/A978-1-4842-0529-7_5_Fig17_HTML.jpg)


    **图 5-17。**


    选择数据库窗口。在**选择数据源**窗口中选择 **MS Access Database**，如图 5-16 所示。取消选中窗口底部的“使用查询向导创建/编辑查询”。然后单击**确定**。


    ![A978-1-4842-0529-7_5_Fig16_HTML.jpg](img/A978-1-4842-0529-7_5_Fig16_HTML.jpg)


    **图 5-16。**


    选择数据源窗口。单击**数据**选项卡以查看功能区，然后单击**从其他来源**。接着单击菜单上的最后一项**来自 Microsoft Query**，如图
    5-15 所示。


    ![A978-1-4842-0529-7_5_Fig15_HTML.jpg](img/A978-1-4842-0529-7_5_Fig15_HTML.jpg)


    **图 5-15。**


    显示如何访问 Microsoft Query 的屏幕。对于提示“SQL Query can''t be represented graphically. Continue
    anyway?”，单击**确定**，如图 5-21 所示。


    ![A978-1-4842-0529-7_5_Fig21_HTML.jpg](img/A978-1-4842-0529-7_5_Fig21_HTML.jpg)


    **图 5-21。**


    Microsoft Query 弹出窗口。将显示单个数字的响应，如图 5-22 所示。


    ![A978-1-4842-0529-7_5_Fig22_HTML.jpg](img/A978-1-4842-0529-7_5_Fig22_HTML.jpg)


    **图 5-22。**


    查询结果。


    ## 总结


    本章展示了在 Excel 和 PowerPivot 中使用 SQL 来汇总来自大表或表集合数据的几种方法。它演示了如何根据指定条件联接表，以及如何使用聚合来提取汇总统计信息。


    # 6. 使用 Power View 设计报表


    Power View 是一种报表工具，可创建其自身类型的工作表。对于不精通 Excel 的用户而言，这是一种创建“沙盒”的方法，可以在不更改数据的情况下探索数据的子集。Power
    View 通过基于 PowerPivot 模型或数据透视表创建包含快速简便可视化效果的仪表板，来让数据变得生动。可以基于相同数据创建多个 Power View
    工作表。


    ## Power View 设计界面的元素


    Power View 界面包含以下元素，如图 6-1 所示：


    - 左侧的设计图面

    - 中间的筛选器区域，可以在此根据字段值筛选数据

    - **Power View 字段**窗格，在此选择要包含在报表中的字段。顶部包括所有可用字段，底部显示已选字段。


    ![A978-1-4842-0529-7_6_Fig1_HTML.jpg](img/A978-1-4842-0529-7_6_Fig1_HTML.jpg)


    **图 6-1。**


    Power View 设计图面。


    ## 使用 Power View 时的注意事项


    始终从表视图开始，然后基于该表创建图表。可以向设计图面添加多个表和/或图表。只需单击空白区域即可添加新图表。


    仅在设计图面上包含报表所必需的字段。一般来说，除非与报表相关，否则最好不要包含用于关联表的主键值。


    ## 字段类型


    通常有两种处理方式截然不同的字段类型：


    - 非数值的分类或描述性字段

    - 可包含计算字段或度量的数值字段。求和符号 (Σ) 用于指示可更改其聚合类型的数值字段。


    ## 理解数据的汇总方式


    使用 Power View 时，最棘手的部分可能在于理解数据的汇总方式。默认情况下，数值字段会被求和，即使这些字段（如 ID 号或年份）的求和毫无意义也是如此。聚合类型可以通过单击
    **Power View 字段**窗格下半部分中字段名称后的向下箭头轻松更改。聚合选项如下：


    - 不汇总

    - 求和

    - 平均值

    - 最小值

    - 最大值

    - 计数（非空）

    - 计数（非重复）


    请注意，要绘制图表，必须使用上述数学函数之一对字段进行汇总。

    '
- fmt: '# A Single Table Example


    This first example will show how to use Power View based on a single spreadsheet
    of the real GDP (gross domestic product) per capita data by state for each year
    from 1997 to 2011. The instructions to download this data from the Azure Marketplace
    were covered in [Chapter 3](#A978-1-4842-0529-7_3_Chapter.html). To create the
    Power View Query, perform the following steps:


    Open the GDP data from the Azure Spreadsheet, which is shown in Figure [6-2](#A978-1-4842-0529-7_6_Chapter.html#Fig2).


    ![A978-1-4842-0529-7_6_Fig2_HTML.jpg](A978-1-4842-0529-7_6_Fig2_HTML.jpg)


    Figure 6-2. Spreadsheet for real data by GDP per capita by state


    Click the `Insert` tab and select `Power View Reports`, then wait while the Power
    View screen loads, as shown in Figure [6-2](#A978-1-4842-0529-7_6_Chapter.html#Fig2).
    If prompted to install SilverLight, click `Yes`. Note the design surface on the
    left, the `Power View Fields` pane on the right, and the `Filters` pane in the
    middle.


    In the `Power View Fields` pane on the right side of the screen, click the right-facing
    triangle to the left of `RealGDPByStatePerCapita` to display the fields. Then
    drag the `year` field to the `Filters` pane, as shown in Figure [6-3](#A978-1-4842-0529-7_6_Chapter.html#Fig3).


    ![A978-1-4842-0529-7_6_Fig3_HTML.jpg](A978-1-4842-0529-7_6_Fig3_HTML.jpg)


    Figure 6-3. Setting a filter


    To display only the most recent year, 2011, click the leftmost icon to the right
    of `Year` in the `Filters` pane to activate the `List Filter Mode` to see the
    list of years and select `2011`, as shown in Figure [6-4](#A978-1-4842-0529-7_6_Chapter.html#Fig4).


    ![A978-1-4842-0529-7_6_Fig4_HTML.jpg](A978-1-4842-0529-7_6_Fig4_HTML.jpg)


    Figure 6-4. Setting a filter, expanded view


    Then, in the `Power View Fields` pane, click the box in front of `Area` and `RealGDPPerCapita`,
    and a table will be created, as shown in Figure [6-5](#A978-1-4842-0529-7_6_Chapter.html#Fig5).


    ![A978-1-4842-0529-7_6_Fig5_HTML.jpg](A978-1-4842-0529-7_6_Fig5_HTML.jpg)


    Figure 6-5. Table showing sum of real GDP per capita


    Note that by default, the sum of the `RealGDPPerCapita` is shown, which is meaningless.
    If you want to change that setting, at the bottom of the `Power View Fields` pane,
    click the down arrow after `RealGDPPerCapita` and select `Do Not Summarize`. However,
    to plot the charts shown following, it is necessary to leave it set to `Sum`.
    The results are shown in Figure [6-6](#A978-1-4842-0529-7_6_Chapter.html#Fig6).
    Note the scrollbar to the right of the table, which allows scrolling through all
    the states. To expand the table, click it and drag the handles.


    ![A978-1-4842-0529-7_6_Fig6_HTML.jpg](A978-1-4842-0529-7_6_Fig6_HTML.jpg)


    Figure 6-6. Table showing real GDP per Capita by state


    A title can be added by clicking where it says to `Click here to add a title`
    and entering `Real GDP Per Capita by State for 2011`, as shown in Figure [6-7](#A978-1-4842-0529-7_6_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_6_Fig7_HTML.jpg](A978-1-4842-0529-7_6_Fig7_HTML.jpg)


    Figure 6-7. Table with title added


    ## Viewing the Data in Different Ways


    Power View supports multiple formats for viewing data. With the `Design` tab selected,
    click the `Table` icon on the left to see the options: table, matrix, and card.
    The card view, which creates a card for each state, is shown in Figure [6-8](#A978-1-4842-0529-7_6_Chapter.html#Fig8).
    The matrix view is like a table but allows drilling down. It will be demonstrated
    in later examples. To go back to the table format, simply click `Table` under
    the `Table` icon.


    ![A978-1-4842-0529-7_6_Fig8_HTML.jpg](A978-1-4842-0529-7_6_Fig8_HTML.jpg)


    Figure 6-8. Card view


    ## Creating a Bar Chart for a Single Year


    To create a bar chart showing the real GDP per capita for each state, follow these
    steps:


    Click anywhere in the table and select the `Design` tab. Click `Bar Chart`. Select
    `Clustered Bar`. Because there is a single data source, either clustered or stacked
    will show the same result.


    The results will appear as shown in Figure [6-9](#A978-1-4842-0529-7_6_Chapter.html#Fig9).
    A single bar for GDP per capita is shown for each state for the year 2011.


    ![A978-1-4842-0529-7_6_Fig9_HTML.jpg](A978-1-4842-0529-7_6_Fig9_HTML.jpg)


    Figure 6-9. Bar chart


    To resize the chart, click it and drag the handles.


    Note that you can hover the mouse over any bar in the chart to see the GDP per
    capita value for that state.


    ## Column Chart


    A column chart is a bar chart flipped on its side, as shown in Figure [6-10](#A978-1-4842-0529-7_6_Chapter.html#Fig10).


    ![A978-1-4842-0529-7_6_Fig10_HTML.jpg](A978-1-4842-0529-7_6_Fig10_HTML.jpg)


    Figure 6-10. Column chart


    ## Displaying Multiple Years


    If the filter is changed to include multiple years, by clicking the `All` box
    at the top of the `Years` list in the `Filters` pane, an instance of the state
    for each year will be generated in the table, as shown in Figure [6-11](#A978-1-4842-0529-7_6_Chapter.html#Fig11).
    It is also necessary to click `Year` in the `Power View Fields` list pane, so
    that the year is displayed.


    ![A978-1-4842-0529-7_6_Fig11_HTML.jpg](A978-1-4842-0529-7_6_Fig11_HTML.jpg)


    Figure 6-11. Table for real GDP per capita for multiple years


    If the view is changed to matrix, then it appears as shown in Figure [6-12](#A978-1-4842-0529-7_6_Chapter.html#Fig12).
    Note that it is necessary to tell it not to sum the years, by clicking the arrow
    after `Year` in the `Fields` section of the `Power View Fields` pane and selecting
    `Do not summarize`.


    ![A978-1-4842-0529-7_6_Fig12_HTML.jpg](A978-1-4842-0529-7_6_Fig12_HTML.jpg)


    Figure 6-12. Matrix view of GDP per capita for multiple years


    ## Adding a Map


    To display the data using a map, follow these steps:


    Click the table to activate the `Design` tab. Click the `Map` icon. If a map of
    the world is displayed, use the `Zoom` and `Pan` icons at the upper right to display
    only the desired area of the map, as shown in Figure [6-13](#A978-1-4842-0529-7_6_Chapter.html#Fig13).
    Hover the mouse over a bubble to see the actual number associated with it.


    ![A978-1-4842-0529-7_6_Fig13_HTML.jpg](A978-1-4842-0529-7_6_Fig13_HTML.jpg)


    Figure 6-13. Map view showing GDP per capita by state


    Note that bubbles are displayed for each state proportional to the GDP per capita
    for that state. In the `Filters` pane, individual or multiple years can be selected
    to see the data for those years.


    ## Using Tiles


    Another way of viewing the data is by using tiles. Simply select a table and click
    the `Tiles` icon on the `Design` toolbar to see a display, as shown in Figure
    [6-14](#A978-1-4842-0529-7_6_Chapter.html#Fig14). The default layout has a tab
    strip at the top of the display that allows clicking each state to see the values
    for that state.


    ![A978-1-4842-0529-7_6_Fig14_HTML.jpg](A978-1-4842-0529-7_6_Fig14_HTML.jpg)


    Figure 6-14. Tile format


    An alternative is the tile flow format with the tiles at the bottom as shown in
    Figure [6-15](#A978-1-4842-0529-7_6_Chapter.html#Fig15). These views can be toggled
    by clicking on the `Tile Type` icon on the `Design` toolbar.


    ![A978-1-4842-0529-7_6_Fig15_HTML.jpg](A978-1-4842-0529-7_6_Fig15_HTML.jpg)


    Figure 6-15. Tile Flow format'
