    接下来，单击 `Fields` 列表中 `Price Total` 后的箭头，并选择 `Do Not Summarize`，如图 6-25 所示。请注意，现在显示的是每个订单的价值，而不是所有订单的总计。


    ![A978-1-4842-0529-7_6_Fig25_HTML.jpg](img/A978-1-4842-0529-7_6_Fig25_HTML.jpg)


    *图 6-25. 显示各订单总计的表*


    通过单击 `Design` 选项卡上的 `Table`，选择 `Matrix`，并单击 `Fit to Window` 来选择矩阵视图，结果将如图 6-26
    所示。请注意，已输入标题。您可以使用右侧的滚动条滚动视图。


    ![A978-1-4842-0529-7_6_Fig26_HTML.jpg](img/A978-1-4842-0529-7_6_Fig26_HTML.jpg)


    *图 6-26. 矩阵视图*


    单击表格显示区域右上角的弹出图标，结果将如图 6-27 所示。


    ![A978-1-4842-0529-7_6_Fig27_HTML.jpg](img/A978-1-4842-0529-7_6_Fig27_HTML.jpg)


    *图 6-27. 矩阵的弹出视图*


    要筛选出没有订单的记录，请将 `Price Total` 字段拖到 `Filters` 窗格，并将左侧滑块向右拖动到某个大于零的任意较小数值，如图 6-28
    所示。


    ![A978-1-4842-0529-7_6_Fig28_HTML.jpg](img/A978-1-4842-0529-7_6_Fig28_HTML.jpg)


    *图 6-28. 筛选出没有订单的公司*


    或者，单击 `Price Total` 字段名称，将筛选条件设置为大于或等于 1，然后单击 `Apply Filter`，如图 6-29 所示。


    ![A978-1-4842-0529-7_6_Fig29_HTML.jpg](img/A978-1-4842-0529-7_6_Fig29_HTML.jpg)


    *图 6-29. 筛选出没有订单公司的另一种方法*

