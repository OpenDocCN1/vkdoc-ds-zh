    导入文件时，最好使用文件的副本进行操作，这样原始文件保持不变，以防导入过程中文件损坏。


    图 2-4 展示了记事本中的一个逗号分隔文件。请注意，第一行由字段名称组成。所有字段由逗号分隔。Excel 知道如何将这种类型的文件读取到电子表格中。如果用
    Excel 打开这种格式的文本文件，它将显示为一个电子表格，如图 2-1 所示。


