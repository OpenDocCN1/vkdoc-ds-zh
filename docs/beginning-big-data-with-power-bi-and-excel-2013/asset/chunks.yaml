    # 关系示例


    在本示例中，将使用 Access 的 `database2`（罗斯文数据库）。部分导入的表如图 6-16 所示。该数据库可从 Apress 网站下载。


    ![A978-1-4842-0529-7_6_Fig16_HTML.jpg](img/A978-1-4842-0529-7_6_Fig16_HTML.jpg)


    *图 6-16. 罗斯文数据库表*


    按照第 4 章中描述的步骤导入 Access 数据。


    单击 `PowerPivot` 选项卡以打开功能区。单击功能区左上角的 `Manage` 按钮。打开 `PowerPivot` 窗口后，您可以通过单击 `Get
    External Data` 组中的 `From Database` 来加载数据。这将提供数据库源的选择。在本示例中，将选择 `From Access`。在
    `Table Import Wizard` 对话框中，单击 `Browse` 按钮找到要导入的 Access 文件。在本示例中，请使用 `Database2.accdb`。该文件可从
    Apress 网站获取。单击 `Test Connection`。如果测试成功，请单击 `Next`。


    `PowerPivot` 会打开 `Table Import Wizard`，引导您完成加载数据的过程。选择 `Select from a list of
    tables and views` 来选择要导入的数据。单击 `Next`。单击左上角的框以选择所有表。请注意，在该对话框的右下角有一个 `Preview
    & Filter` 选项。您可以使用此选项从非常大的数据集中选择数据子集。在本示例中，将导入所有表中的所有行。然后，单击 `Finish` 完成导入。导入的表如图
    6-16 所示。


    表之间的关系如图 6-17 所示。


    ![A978-1-4842-0529-7_6_Fig17_HTML.jpg](img/A978-1-4842-0529-7_6_Fig17_HTML.jpg)


    *图 6-17. 关系图视图*


    本示例将使用 `orders` 表中的 `customer ID` 与 `customers` 表中的 `ID` 字段之间的关系。


    关系的另一种视图如图 6-18 所示，可通过单击 `Data` 选项卡上的 `Relationships` 图标来访问。


    ![A978-1-4842-0529-7_6_Fig18_HTML.jpg](img/A978-1-4842-0529-7_6_Fig18_HTML.jpg)


    *图 6-18. 关系*


    要创建 Power View 报表，请按照以下步骤操作：


    单击 Excel 的 `Insert` 选项卡上的 `Power View Reports`。首先，从屏幕右侧的 `Power View Fields` 选项卡中选择字段以创建表。从
