    # 创建盈利能力的 KPI


    KPI（关键绩效指标）基于计算字段与值之间的关系。通过执行以下步骤为盈利能力创建 KPI：


    创建一个利润/销售额平均值的计算字段，如图 7-16 所示，输入以下公式：


    ![A978-1-4842-0529-7_7_Fig16_HTML.jpg](img/A978-1-4842-0529-7_7_Fig16_HTML.jpg)


    图 7-16. 创建利润/销售额平均值的计算字段


    `Average of Profit/Sales:=AVERAGE([Profit/Sales])`


    右键单击该计算字段，选择“创建 KPI”。输入绝对值 0.53（即 53%），调整滑块以使达到目标的值显示为绿色，如图 7-17 所示，然后单击“确定”。


    ![A978-1-4842-0529-7_7_Fig17_HTML.jpg](img/A978-1-4842-0529-7_7_Fig17_HTML.jpg)


    图 7-17. 定义 KPI


    # 创建按产品线显示盈利能力的数据透视表


    要创建按产品线显示盈利能力的数据透视表，请按以下步骤操作：


    1. 选择 `dbo_FactSales` 选项卡。

    2. 单击功能区上的“数据透视表”图标，然后选择“数据透视表”。

    3. 在“创建数据透视表”对话框中选择“新建工作表”，然后单击“确定”。

    4. 在“产品类别”表中选择“产品类别名称”字段。该字段将显示在屏幕右侧数据透视表窗格的“行”框中，如图 7-18 所示。


    ![A978-1-4842-0529-7_7_Fig18_HTML.jpg](img/A978-1-4842-0529-7_7_Fig18_HTML.jpg)


    图 7-18. 将产品类别名称插入数据透视表


    接下来，选择 `dbo_FactSales` 表中的“销售数量”字段以及位于字段列表底部的 `Average of Profit/Sales` 计算字段。单击该计算字段名称，然后选择“值”、“目标”和“状态”。该字段将显示在“值”框中，并创建一个数据透视表，如图
    7-19 所示。


    ![A978-1-4842-0529-7_7_Fig19_HTML.jpg](img/A978-1-4842-0529-7_7_Fig19_HTML.jpg)


    图 7-19. 将 KPI 添加到数据透视表


    # 总结


    本章介绍了如何使用 DAX 公式语言创建计算字段和计算列，以及如何创建关键绩效指标来监控业务活动。与引用特定单元格的 Excel 公式不同，DAX 公式引用的是列，但可以使用
    `CALCULATE()` 函数基于筛选条件计算表达式。


    # 8. Power Query


    Microsoft Power Query for Excel 是一种数据发现工具，用于从各种源导入数据，包括来自 OData、Hadoop 和 Azure
    Marketplace 等源的关联、半结构化和非结构化数据。它是一个自助式 ETL（导出、转换、加载）工具，用于提取、转换和加载数据。它比之前介绍的一些方法更强大。Microsoft
    会不断更新 Power Query，因此在本书出版时某些功能可能已发生变化。本章演示如何从 Web、表格格式、CSV 格式和 JSON 格式访问数据，然后使用
    Power Query 编辑器对数据进行整形，再导入 Excel。


    ## 安装 Power Query


    如果未显示 Power Query 选项卡，则需要安装它。对于 Excel 2010 和 2013，Power Query 可作为免费下载从 Microsoft
    获取。可以通过搜索“Power Query 下载”来访问下载链接。如果您安装了 32 位版本的 Excel，请务必安装 32 位版本；如果安装了 64 位版本，请安装
    64 位版本。安装后启用 Power Query 的步骤如下：


    1. 单击“文件”选项卡以查看 Backstage 视图。

    2. 单击左窗格底部的“选项”。

    3. 在左窗格中选择“加载项”。

    4. 在窗口底部，单击“管理”后的下拉箭头，选择“COM 加载项”，然后单击“转到”。

    5. 勾选“Microsoft Office PowerPivot for Excel 2013”、“Microsoft Power Map for Excel”和“Power
    View”，然后单击“确定”。


    安装完成后，Power Query 选项卡将可见。


    ## Power Query 功能区的主要选项


    本节将介绍 Power Query 功能区上最实用的选项，如图 8-1 所示。


    -   **来自 Web**：允许从特定网站提取表格

    -   **来自文件**：从 Excel、CSV、XML、文本文件或文件夹中的文件组导入

    -   **来自数据库**：从数据库导入，例如 SQL Server、Access、Oracle 和 MySQL

    -   **来自 Azure**：从 Azure 服务导入，例如 SQL Database、Market Place、HDInsight、Blob Storage
    和 Table Storage

    -   **来自其他源**：从包括 SharePoint 列表、OData 源、Hadoop (HDFS)、Facebook、Salesforce 对象和报表以及
    ODBC 的源导入

    -   **最近使用的源**：显示最近查询的源

    -   **来自表格的 Excel 数据**：从 Excel 电子表格导入一个区域

    -   **合并**：合并两个查询以添加列

    -   **追加**：将一个表追加到另一个结构相同的表

    -   **显示窗格**：切换屏幕右侧“工作簿查询”窗格的显示

    -   **数据源设置**：管理通过 Power Query 访问的数据源的设置

    -   **选项**：设置加载数据的选项

    -   **更新**：在线检查 Power Query 更新

    -   **数据目录搜索**：搜索精选的网站集并提取表格

    -   **我的数据目录查询**：允许与其他用户共享查询


    ![A978-1-4842-0529-7_8_Fig1_HTML.jpg](img/A978-1-4842-0529-7_8_Fig1_HTML.jpg)


    图 8-1. Power Query 功能区


    ## 使用查询编辑器


    Power Query 允许将数据子集导入查询编辑器，以便在将数据导入 Excel 或数据模型之前，通过删除不需要的行或列或创建计算列来对数据进行整形。查询编辑器中有三个选项卡：“开始”、“转换”和“添加列”。

