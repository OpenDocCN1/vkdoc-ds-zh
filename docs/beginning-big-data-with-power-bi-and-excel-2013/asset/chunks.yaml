  trans: '

    ### 大数据成本节约


    根据《华尔街日报》2014 年 7 月 1 日一篇题为《大数据削减成本》的文章，咨询公司高德纳（Gartner Inc.）研究总监克里斯·伊尔沃利诺（Chris
    Iervolino）援引道：“会计师和财务主管通常关注销售额和支出等细项，而非研究各类数据之间的关系。但那些成功整合这些信息流的公司已从大数据中获得了丰厚回报。”


    文中列举的实例如下：


    - 近期，通用汽车（General Motors）基于一项仅需数天而非数周的分析，比较成本与预期销售数据后，决定停止在欧洲销售雪佛兰汽车。

    -  Planet Fitness 能够根据跑步机在健身俱乐部高流量区域的摆放位置分析其使用情况，并进行轮换以均匀磨损。


    ## 大数据与政府


    政府正面临资金和人员有限但数据丰富的困境。不幸的是，大多数政府机构不知道如何利用现有数据，在恰当的时间将资源分配给合适的人。


    美国政府曾尝试通过网站 `USAspending.gov` 公开资金去向。位于硅谷中心的加利福尼亚州帕洛阿尔托市，则通过其网站 `data.cityofpaloalto.org`
    公开数据。该市利用数据的目标是打造敏捷、高效的政府。该网站提供城市运营的基本数据，包括树木的种植和修剪时间。


    ### 预测性警务


    预测性警务利用数据预测犯罪可能发生的地点，从而以最高效的方式分配警力资源。其目标是识别犯罪风险较高的人员和地点。


    ### 节约成本的成功案例


    2011 年 1 月 24 日《纽约客》杂志的一篇文章描述，三十多岁的医生杰弗里·布伦纳（Jeffrey Brenner）如何不顾警方反对，绘制新泽西州卡姆登市的犯罪和医疗急救统计数据，设计出一套节约成本的系统。他从三家主要医院获取了医疗账单记录，并收集了犯罪统计数据。他绘制了该市逐街区的彩色编码地图，根据居民产生的医院费用进行标注。他发现费用最高的两个街区包括一家大型疗养院和一个低收入住宅区。文章指出：“他发现，从
    2002 年 1 月到 2008 年 6 月，这两栋楼里的约 900 人累计产生了超过 4000 次医院就诊记录，以及约两亿美元的医疗账单。一位患者在五年内住院
    324 次。费用最高的患者给保险公司造成了 350 万美元的损失。” 他确定 1%的患者占了 30%的费用。


    布伦纳的目标是在削减成本的同时，最有效地帮助患者。他尝试锁定病情最严重的患者，提供预防性护理和健康监测，以及物质滥用的治疗，以尽量减少急诊就诊和住院。他建立了一个由执业护士和社会工作者组成的支持系统，为病情最严重的患者提供帮助。该方法的早期结果显示成本降低了
    56%。


    ## 物联网或工业互联网


    物联网指的是设备之间的机器对机器（M2M）通信，涉及网络连接，例如家庭照明和恒温器。思科系统公司则使用“万物互联”这一术语。


    《快公司》杂志 2014 年 7/8 月刊的一篇文章描述了通用电气公司（GE）如何使用“工业互联网”这一术语，其核心是将智能植入机器，收集并分析其数据以预测故障，从而实现问题的预判与纠正。一个例子是
    GE 的喷气发动机。GE 计划利用发动机产生的数据来预测何时需要维修某个部件，以便在故障发生前解决问题。GE 的假设是，生产率和可靠性的小幅提升可以带来巨大的经济效益。


    GE 还在研发 `trip-optimizer`——一种用于机车的智能巡航控制系统，它利用火车的地理位置、重量、速度、燃料消耗和地形来计算最佳速度，从而最大限度地减少燃料消耗。


    ### 麻省理工学院削减能源成本


    《华尔街日报》2014 年 9 月 28 日一篇题为《大数据降低建筑能耗》的文章描述了廉价传感器如何使实时收集能耗数据成为可能。例如，麻省理工学院（MIT）设有能源作战室，用于监控校园建筑的能源使用情况。能源泄漏可以被发现并纠正。


    ## 大数据革命与医疗保健


    麦肯锡公司 2013 年 4 月的一份题为《美国医疗保健的大数据革命：加速价值与创新》的报告描述了大数据的革命如何在医疗保健领域发生，其基础是制药公司将多年研究数据整合到医疗数据库中，以及医疗服务提供者将患者记录数字化。基于数据的循证医学正成为一种趋势。大数据算法正被用于提供最佳证据。


    医疗支出目前占美国国内生产总值（GDP）的 17%以上。麦肯锡估计，在医疗保健领域实施这些大数据策略可以使美国医疗费用降低 12%至 17%，每年节省 3000
    亿至 4500 亿美元。


    风险投资家维诺德·科斯拉（Vinod Khosla）在斯坦福大学医学院的生物医学大数据会议上发言时表示：“生物研究固然重要，但感觉数据科学对医学的贡献将超过所有生物科学的总和。”（引自
    2014 年 5 月 24 日《旧金山纪事报》）他接着说，人类的判断无法与能从数百万数据点中得出预测的机器学习系统相抗衡。他进一步预测，技术将取代医生 80%至
    90%的决策角色。

    '
- fmt: '### The Medicalized Smartphone


    A January 10, 2015, Wall Street Journal article reported that “the medicalized
    smartphone is going to upend every aspect of health care.” Attachments to smartphones
    are being developed that can measure blood pressure and even perform electrocardiograms.
    Wearable wireless sensors can track blood-oxygen and glucose levels, blood pressure,
    and heart rhythm. Watches will be coming out that can continually capture blood
    pressure and other vital signs. The result will be much more data and the potential
    for virtual physician visits to replace physical office visits.


    In December 2013, `IDC Health Insights` released a report entitled “U.S. Connected
    Health 2014 Top 10 Predictions: The New Care Delivery Model” that predicts a new
    health care delivery model involving mobile health care apps, telehealth, and
    social networking that will provide “more efficient and cost-effective ways to
    provide health care outside the four walls of the traditional healthcare setting.”
    According to the report, these changes will rely on four transformative technologies:


    Mobile | Big data analytics | Social | Cloud


    The report cites the `Smartphone Physical` project at Johns Hopkins. It uses “a
    variety of smartphone-based medical devices that can collect quantitative or qualitative
    data that is clinically relevant for a physical examination such as body weight,
    blood pressure, heart rate, blood oxygen saturation, visual acuity, optic disc
    and tympanic membrane images, pulmonary function values, electrocardiogram, heart
    and lung sounds and ultrasound visualization (such as carotid artery imaging).”


    According to the report, “With greater consumer uptake of mobile health, personal
    health, and fitness modeling, and social technologies, there will be a proliferation
    of consumer data across diverse data sources that will yield rich information
    about consumers.”


    A May 2011 paper by McKinsey & Company entitled “Big data: The next frontier for
    innovation, competition, and productivity” posits five ways in which using big
    data can create value, as follows:


    - Big data can unlock significant value by making information transparent and
    usable in much higher frequency.

    - As organizations create and store more transactional data in digital form, they
    can collect more accurate and detailed performance information on everything from
    product inventories to sick days, and therefore boost performance.

    - Big data allows ever-narrower segmentation of customers and, therefore, much
    more precisely tailored products or services.

    - Sophisticated analytics can substantially improve decision making.

    - Big data can be used to improve the development of the next generation of products
    and services.


    ## Improving Reliability of Industrial Equipment


    General Electric (GE) has made implementing the Industrial Internet a top priority,
    in order to improve the reliability of industrial equipment such as jet engines.
    The company now collects 50 million data points each day from 1.4 million pieces
    of medical equipment and 28,000 jet engines. The goal is to improve the reliability
    of the equipment. GE has developed `Predix`, which can be used to analyze data
    generated by other companies to build and deploy software applications.


    ## Big Data and Agriculture


    The goal of precision agriculture is to increase agricultural productivity to
    generate enough food as the population of the world increases. Data is collected
    on soil and air quality, elevation, nitrogen in soil, crop maturity, weather forecasts,
    equipment, and labor costs. The data is used to determine when to plant, irrigate,
    fertilize, and harvest. This is achieved by installing sensors to measure temperature
    and the humidity of soil. Pictures are taken of fields that show crop maturity.
    Predictive weather modeling is used to plan when to irrigate and harvest. The
    goal is to increase crop yields, decrease costs, save time, and use less water.


    ## Cheap Storage


    In the early 1940s, before physical computers came into general use, computer
    was a job title. The first wave of computing was about speeding up calculations.
    In 1946, the Electrical Numerical Integrator and Computer (ENIAC)—the first general
    purpose electronic computer—was installed at the University of Pennsylvania. The
    `ENIAC`, which occupied an entire room, weighed 30 tons, and used more than 18,000
    vacuum tubes, had been designed to calculate artillery trajectories. However,
    World War II was over by 1946, so the computer was then used for peaceful applications.


    ### Personal Computers and the Cost of Storage


    Personal computers came into existence in the 1970s with Intel chips and floppy
    drives for storage and were used primarily by hobbyists. In August 1981, the `IBM
    PC` was released with 5¼-inch floppy drives that stored 360 kilobytes of data.
    The fact that IBM, the largest computer company in the world, released a personal
    computer was a signal to other companies that the personal computer was a serious
    tool for offices. In 1983, `IBM` released the `IBM-XT`, which had a 10 megabyte
    hard drive that cost hundreds of dollars. Today, a terabyte hard drive can be
    purchased for less than \\$100. Multiple gigabyte flash drives can be purchased
    for under \\$10.


    ### Review of File Sizes


    Over the history of the personal computer, we have gone from kilobytes to megabytes
    and gigabytes and now terabytes and beyond, as storage needs have grown exponentially.
    Early personal computers had 640 kilobytes of RAM. Bill Gates, cofounder of Microsoft
    Corporation, reportedly said that no one would ever need more than 640 kilobytes.
    Versions of Microsoft’s operating system `MS-DOS` released during the 1980s could
    only address 640 kilobytes of RAM. One of the selling points of Windows was that
    it could address more than 640 kilobytes. Table 1-1 shows how data is measured.


    **Table 1-1. Measurement of Storage Capacity**


    | Unit | Power of 2 | Approximate Number |

    | --- | --- | --- |

    | Kilobytes | `2^10` | Thousands |

    | Megabytes | `2^20` | Millions |

    | Gigabytes | `2^30` | Billions |

    | Terabytes | `2^40` | Trillions |

    | Petabytes | `2^50` | Quadrillions |

    | Exabytes | `2^60` | Sextillions |

    | Zettabytes | `2^70` | Septillions |


    ### Data Keeps Expanding


    The New York Stock Exchange generates 4 to 5 terabytes of data every day. IDC
    estimates that the digital universe was 4.4 petabytes in 2013 and is forecasting
    a tenfold increase by 2920, to 44 zettabytes.


    We are also dealing with exponential growth in Internet connections. According
    to CISCO Systems, the 15 billion worldwide network connections today are expected
    to grow to 50 billion by 2020.'
