- fmt: '# Big Data Cost Savings


    According to a July 1, 2014, article in the Wall Street Journal entitled “Big
    Data Chips Away at Cost,” Chris Iervolino, research director at the consulting
    firm Gartner Inc., was quoted as saying “Accountants and finance executives typically
    focus on line items such as sales and spending, instead of studying the relationships
    between various sets of numbers. But the companies that have managed to reconcile
    those information streams have reaped big dividends from big data.”


    Examples cited in the article include the following:


    - Recently, General Motors made a decision to stop selling Chevrolets in Europe
    based on an analysis of costs compared to projected sales, based on analysis that
    took a few days rather than many weeks.

    - Planet Fitness has been able to analyze the usage of their treadmills based
    on their location in reference to high-traffic areas of the health club and to
    rotate them to even out wear on the machines.


    ## Big Data and Governments


    Governments are struggling with limited money and people but have an abundance
    of data. Unfortunately, most governmental organizations don’t know how to utilize
    the data that they have to get resources to the right people at the right time.


    The US government has made an attempt to disclose where its money goes through
    the web site `USAspending.gov`. The city of Palo Alto, California, in the heart
    of Silicon Valley, makes its data available through its web site `data.cityofpaloalto.org`.
    The goal of the city’s use of data is to provide agile, fast government. The web
    site provides basic data about city operations, including when trees are planted
    and trimmed.


    ### Predictive Policing


    Predictive policing uses data to predict where crime might occur, so that police
    resources can be allocated with maximum efficiency. The goal is to identify people
    and locations at increased risk of crime.


    ### A Cost-Saving Success Story


    A January 24, 2011, New Yorker magazine article described how 30-something physician
    Jeffrey Brenner mapped crime and medical emergency statistics in Camden, New Jersey,
    to devise a system that would cut costs, over the objections of the police. He
    obtained medical billing records from the three main hospitals and crime statistics.
    He made block-by-block maps of the city, color-coded by the hospital costs of
    the residents. He found that the two most expensive blocks included a large nursing
    home and a low-income housing complex. According to the article, “He found that
    between January 2002 and June of 2008 some nine hundred people in the two buildings
    accounted for more than four thousand hospital visits and about two hundred million
    dollars in health-care bills. One patient had three hundred and twenty-four admissions
    in five years. The most expensive patient cost insurers $3.5 million.” He determined
    that 1% of the patients accounted for 30% of the costs.


    Brenner’s goal was to most effectively help patients while cutting costs. He tried
    targeting the sickest patients and providing preventative care and health monitoring,
    as well as treatment for substance abuse, to minimize emergency room visits and
    hospitalization. He set up a support system involving a nurse practitioner and
    a social worker to support the sickest patients. Early results of this approach
    showed a 56% cost reduction.


    ## Internet of Things or Industrial Internet


    The Internet of Things refers to machine to machine (M2M) communication involving
    networked connectivity between devices, such as home lighting and thermostats.
    Cisco Systems uses the term Internet of Everything.


    An article in the July/August 2014 issue of Fast Company magazine described how
    General Electric Corporation (GE) is using the term Industrial Internet, which
    involves putting intelligence into machines to collect and analyze their data
    in order to predict failure, so that problems can be anticipated and corrected.
    One example is the GE jet engine. GE plans to use data generated from engines
    to predict when an engine part requires repairs, so that the problem can be corrected
    before a failure occurs. GE’s assumption is that small gains in productivity and
    reliability can drive massive economic benefits.


    GE is also working on trip-optimizer, an intelligent cruise control for locomotives,
    which use trains’ geographical location, weight, speed, fuel consumption, and
    terrain to calculate the optimal velocity to minimize fuel consumption.


    ### Cutting Energy Costs at MIT


    An article in the September 28, 2014, Wall Street Journal entitled “Big Data Cuts
    Buildings’ Energy Use” describes how cheap sensors are allowing collection of
    real-time data on how energy is being consumed. For example, the Massachusetts
    Institute of Technology (MIT) has an energy war room in which energy use in campus
    buildings is monitored. Energy leaks can be detected and corrected.


    ## The Big Data Revolution and Health Care


    An April 2013 report from McKinsey & Company entitled “The big-data revolution
    in US health care: Accelerating value and innovation” describes how a big data
    revolution is occurring in health care, based on pharmaceutical companies aggregating
    years of research into medical databases and health care providers digitizing
    patient records. There is a trend toward evidence-based medicine based on data.
    Big data algorithms are being used to provide the best evidence.


    Health care spending currently accounts for more than 17% of US gross domestic
    product (GDP). McKinsey estimates that implementation of these big data strategies
    in health care could reduce health expenses in the United States by 12% to 17%,
    saving between $300 billion to $450 billion per year.


    “Biological research will be important, but it feels like data science will do
    more for medicine than all the biological sciences combined,” according to the
    venture capitalist Vinod Khosla, speaking at the Stanford University School of
    Medicine’s Big Data in Biomedicine Conference (quoted in the San Francisco Chronicle,
    May 24, 2014). He went on to say that human judgment cannot compete against machine
    learning systems that derive predictions from millions of data points. He further
    predicted that technology will replace 80%–90% of doctors’ roles in decision making.'
