    # 故障排除


    Power Map 对数据类型要求非常严格。如果您希望绘制的数值数据未被当作数值型数据处理（表现为仅显示计数聚合），或者时间数据未被识别，请按以下步骤操作：


    检查列中是否存在无关的字符串数据，并删除包含字符串数据的行。确保数值数据列格式化为数字，日期列格式化为日期。更改格式后，单击 Power Map 功能区上的
    `Refresh Data`。


    ## 练习 9-1：绘制加利福尼亚州犯罪统计数据示例


    本示例演示如何使用 Power Query 按城市导入加利福尼亚州犯罪统计数据，以及如何使用 Power Map 绘制这些数据。


    进入 Power Query，在数据目录中搜索 `“California Cities by Population and Crime Rate.”`。将鼠标悬停在
    `“Cities—California locations by crime rate”` 上，选择 `Edit` 以加载到查询编辑器中。将出现如图 9-2
    所示的屏幕。


    ![A978-1-4842-0529-7_9_Fig2_HTML.jpg](img/A978-1-4842-0529-7_9_Fig2_HTML.jpg)


    **图 9-2.** 查询编辑器中的犯罪统计数据


    在查询编辑器中，单击 `Add Column` 选项卡。在该选项卡的左端，单击 `Add Custom Column`。为州创建一个新列。设置内容为 `="CA"`，如图
    9-3 所示。


    ![A978-1-4842-0529-7_9_Fig3_HTML.jpg](img/A978-1-4842-0529-7_9_Fig3_HTML.jpg)


    **图 9-3.** 添加“州”列


    通过右键单击列标题，选择 `Change Type`，然后选择 `Decimal Number`，检查所有数值列的数据类型是否为十进制数。同时，检查数值列中是否没有非数值数据。当数据满足要求后，单击功能区上的
    `Close & Load`，将其加载到电子表格中。电子表格应如图 9-4 所示。


    ![A978-1-4842-0529-7_9_Fig4_HTML.jpg](img/A978-1-4842-0529-7_9_Fig4_HTML.jpg)


    **图 9-4.** 犯罪数据加载到电子表格中


    再次检查数字字段中是否存在可能导致 Power Map 无法正确解释内容的非数值数据。由于并非所有行都在查询编辑器中显示，对于较大的数据集，这需要在将数据加载到
    Excel 后进行检查。如图 9-5 所示，数据的最后一行可能包含省略号。如果是这种情况，请右键单击该行并选择 `Delete Table Row` 来删除最后一行。


    ![A978-1-4842-0529-7_9_Fig5_HTML.jpg](img/A978-1-4842-0529-7_9_Fig5_HTML.jpg)


    **图 9-5.** 需要删除的包含省略号的最后一行


    通过高亮列（单击列顶部的字母）来检查每列的格式。右键单击选中的列，从上下文菜单中选择 `Format Cells`。对于人口、暴力犯罪和财产犯罪列，将格式设置为
    `Number`，小数点后保留 0 位，如图 9-6 所示。对于每千人的暴力犯罪和财产犯罪列，将格式设置为 `Number`，小数点后保留 2 位。


    ![A978-1-4842-0529-7_9_Fig6_HTML.jpg](img/A978-1-4842-0529-7_9_Fig6_HTML.jpg)


    **图 9-6.** 将列格式化为数字


    单击 `Insert` 选项卡，然后在 `Map` 下选择 `Launch Power Map`。如果您之前创建过地图，系统可能会提示您创建 `New Tour`。接受默认的地理字段
    `City`、`County` 和 `State`，如图 9-7 所示。单击 `Next`。


    ![A978-1-4842-0529-7_9_Fig7_HTML.jpg](img/A978-1-4842-0529-7_9_Fig7_HTML.jpg)


    **图 9-7.** 设置地理字段


    单击功能区上的 `Map Labels` 以显示城市名称。在“图层”窗格中，右键单击 `Property Crimes per 1,000 persons`，然后单击
    `Add to Height`，如图 9-8 所示。请注意，Bing 地图服务在右上角显示地理映射的置信度为 94%。如果您想返回并编辑地理字段，请单击 94%
    上方的图标。


    ![A978-1-4842-0529-7_9_Fig8_HTML.jpg](img/A978-1-4842-0529-7_9_Fig8_HTML.jpg)


    **图 9-8.** 设置绘图高度字段


    单击图例框并将其调整为更小，然后将其拖到地图的左上角。多次单击地图右下角的 `+` 号以放大。结果如图 9-9 所示。请注意，您可以将鼠标指向任何图形，以查看该城市犯罪率的详细信息。也可以双击任何位置进行放大。


    ![A978-1-4842-0529-7_9_Fig9_HTML.jpg](img/A978-1-4842-0529-7_9_Fig9_HTML.jpg)


    **图 9-9.** 带有图例和详细犯罪统计数据的地图


    ## 绘制多项统计数据


    可以绘制多项指标——财产犯罪和暴力犯罪统计数据。为此，我们继续上一节中的示例。


    ### 练习 9-2：绘制加利福尼亚州犯罪统计数据（第二部分）


    您可以按照以下步骤绘制财产犯罪和暴力犯罪统计数据：


    在“图层”窗格中，右键单击 `Property crime rate per 1,000 persons` 并选择 `Add to Height`，如图 9-10
    所示。


    ![A978-1-4842-0529-7_9_Fig10_HTML.jpg](img/A978-1-4842-0529-7_9_Fig10_HTML.jpg)


    **图 9-10.** 添加暴力犯罪指标


    请注意，默认视图是堆叠柱状图。可以通过单击堆叠柱状图右侧的图标将其更改为簇状柱状图，如图 9-11 所示。财产犯罪率以蓝色显示，暴力犯罪率以橙色显示。


    ![A978-1-4842-0529-7_9_Fig11_HTML.jpg](img/A978-1-4842-0529-7_9_Fig11_HTML.jpg)


    **图 9-11.** 同时显示财产犯罪率和暴力犯罪率指标


    单击功能区左端的 `Add Scene`。单击功能区上的 `Text Box` 图标，添加标题 `“California Cities Crime Rates,”`，如图
    9-12 所示。


    ![A978-1-4842-0529-7_9_Fig12_HTML.jpg](img/A978-1-4842-0529-7_9_Fig12_HTML.jpg)


    **图 9-12.** 为地图添加标题


    将视图更改为气泡视图，它类似于饼图。可以调整文本框的大小并将其拖到地图上的适当位置，如图 9-13 所示。


    ![A978-1-4842-0529-7_9_Fig13_HTML.jpg](img/A978-1-4842-0529-7_9_Fig13_HTML.jpg)


    **图 9-13.** 数据的气泡视图


    可以通过单击“图层”窗格右上角的齿轮图标，选择 `Layer Options`，然后调整大小滑块来调整气泡的大小，如图 9-14 所示。


    ![A978-1-4842-0529-7_9_Fig14_HTML.jpg](img/A978-1-4842-0529-7_9_Fig14_HTML.jpg)


    **图 9-14.** 调整气泡大小


    单击功能区左端的 `Add Scene`。另一种视图是热力图视图，如图 9-15 所示。请注意，加利福尼亚州最大的两个城市旧金山和洛杉矶的犯罪率最高。


    ![A978-1-4842-0529-7_9_Fig15_HTML.jpg](img/A978-1-4842-0529-7_9_Fig15_HTML.jpg)


    **图 9-15.** 数据的热力图视图

