    # 从 XML 导入数据


    可扩展标记语言（XML）是一种流行的数据存储格式。与 HTML 类似，它使用成对标签来定义每个元素。图 2-5 显示了 XML 格式下我们一直处理的数据。第一行是声明，指定了
    XML 版本、UTF 编码及其他信息。请注意将所有其他标签包围起来的 `donors` 根标签。


    ![A978-1-4842-0529-7_2_Fig5_HTML.jpg](img/A978-1-4842-0529-7_2_Fig5_HTML.jpg)


    图 2-5. XML 格式


    这些数据是自描述的。本例中的每一行或每一条记录都被一个 `donor` 标签包围。字段名称在开标签和闭标签中为每个字段重复出现了两次。该文件将作为扩展名为
    `.xml` 的文本文件保存。


    Excel 可以直接打开 XML 文件。在打开后弹出的第一个对话框中选择“作为 XML 表”。然后在下一个弹出的对话框中点击“是”，“Excel 将创建架构。”


    如图 2-6 所示，XML 文件可以在诸如 Internet Explorer 之类的网页浏览器中显示。请注意 `donor` 标签左侧的小加号和减号。点击减号可隐藏每条记录中的详细信息，点击加号则可显示详细信息。


    ![A978-1-4842-0529-7_2_Fig6_HTML.jpg](img/A978-1-4842-0529-7_2_Fig6_HTML.jpg)


    图 2-6. 在网页浏览器中显示的 XML 文件


    ## 导入带属性的 XML


    与 HTML 一样，XML 也可以包含属性。图 2-7 展示了一个将 `gender` 属性添加为 `donor` 标签一部分的例子。


    ![A978-1-4842-0529-7_2_Fig7_HTML.jpg](img/A978-1-4842-0529-7_2_Fig7_HTML.jpg)


    图 2-7. 带属性的 XML


    ```

    <donor gender = "female">

    ...

    </donor>

    ```


    关于属性的使用有两种不同的观点。一些人认为应该避免使用属性，所有值都应该以成对标签形式呈现。然而，也可能会遇到带属性的 XML。Excel 可以解释这两种格式。图
    2-8 显示了打开图 2-7 中的 XML 文件后，Excel 电子表格所显示的内容。


    ![A978-1-4842-0529-7_2_Fig8_HTML.jpg](img/A978-1-4842-0529-7_2_Fig8_HTML.jpg)


    图 2-8. 导入到 Excel 中的带属性 XML


    ## 导入 JSON 格式


    许多 NoSQL 数据以 JavaScript 对象表示法 (JSON) 格式存储。遗憾的是，Excel 不能直接读取 JSON 文件，因此必须使用一种中间格式才能将其导入
    Excel。图 2-9 以 JSON 格式展示了我们的示例文件。请注意其中的“名称-值”对，每当出现该字段的一个实例时，字段名称都会重复出现。


    ![A978-1-4842-0529-7_2_Fig9_HTML.jpg](img/A978-1-4842-0529-7_2_Fig9_HTML.jpg)


    图 2-9. JSON 格式


    由于 Excel 无法直接读取 JSON 文件，您必须将此 JSON 格式的数据转换成诸如 XML 之类的 Excel 可读格式。网络上有许多免费转换器可用，例如
    [`http://bit.ly/1s2Oi6L`](http://bit.ly/1s2Oi6L) 上的这个。


    该转换器的界面如图 2-10 所示。（请记住使用文件的副本进行操作，这样原始文件就不会被损坏。）可以将 JSON 文件粘贴到 JSON 窗口中，然后通过点击箭头将其转换为
    XML。结果会得到一个同名的 XML 文件，您可以直接从 Excel 中打开它。


    ![A978-1-4842-0529-7_2_Fig10_HTML.jpg](img/A978-1-4842-0529-7_2_Fig10_HTML.jpg)


    图 2-10. XML 与 JSON


    # 使用“数据”选项卡导入数据


    到目前为止，我们一直通过将文本文件直接导入 Excel 来创建新的电子表格。“数据”选项卡上的选项可用于从多种格式导入数据，并将其作为现有电子表格的一部分。


    ## 从网站上的表格导入数据


    例如，让我们看看如何从网站上的表格导入数据。


    要从网站上的表格导入数据，请执行以下操作：


    1. 点击“数据”选项卡以显示“数据”功能区。

    2. 点击`自网站`。

    3. 将出现一个浏览器窗口。输入您要访问的网站地址。我们将访问一个劳工统计局关于基于受教育程度的就业示例。本例中，我们将使用 [`http://www.bls.gov/emp/ep_table_education_summary.htm`](http://www.bls.gov/emp/ep_table_education_summary.htm)。

    4. 如图 2-11 所示，每个表格旁边会出现一个位于黄色小框中的黑色箭头。点击表格左上角黄色小框中的黑色箭头，它将变为绿色框中的对勾。点击`导入`。将出现如图
    2-12 所示的“导入数据”对话框。


    ![A978-1-4842-0529-7_2_Fig12_HTML.jpg](img/A978-1-4842-0529-7_2_Fig12_HTML.jpg)


    图 2-12. “导入数据”对话框


    ![A978-1-4842-0529-7_2_Fig11_HTML.jpg](img/A978-1-4842-0529-7_2_Fig11_HTML.jpg)


    图 2-11. 从网页导入数据


    5. 选择“新建工作表”，然后点击“确定”。该表格将被导入，如图 2-13 所示。可能需要在 Excel 中进行一些格式化，才能使表格完全符合您做进一步分析的要求。


    ![A978-1-4842-0529-7_2_Fig13_HTML.jpg](img/A978-1-4842-0529-7_2_Fig13_HTML.jpg)


    图 2-13. 从网页导入 Excel 的数据


    # 数据整理与数据清洗


    导入的数据很少直接是我们所需的格式。数据可能因以下原因而产生问题：


    - 数据不完整。

    - 数据不一致。

    - 数据格式错误。


    数据整理涉及将原始数据转换为可用格式。数据清洗意味着修正错误和不一致之处。Excel 提供了用于清洗和格式化数据的工具。


    ## 更正大小写


    Excel 提供的用于更正大小写的函数之一是 `Proper()` 函数。它会将每个单词的首字母大写，其余字母小写。图 2-14 显示了一些文本在执行该函数前后的样子。要使用
    `Proper()` 函数，如图 2-14 所示，请执行以下步骤：


    1. 在新的一列中，输入 `=Proper(`。

    2. 点击您要应用该函数的第一个单元格，然后输入右括号 (`)`)。接着按 Enter 键。

    3. 点击您刚刚输入公式的单元格，然后拖动该单元格右下角的填充柄，将公式复制到整列。

    4. 将单元格内容从公式转换为数值。对于少量单元格，可以通过选择每个单元格，按 F2 进行编辑，然后按 F9 转换为数值，最后按 Enter 键来完成。

    5. 对于大量单元格，请选择该列，右键点击，选择“复制”。然后选择要复制到的目标区域中的第一个单元格，按 `Ctrl` + `Alt` + `V` 打开“选择性粘贴”对话框，选择“数值”，然后点击“确定”。

    6. 然后您可以删除原始列：在该列任意位置右键点击，选择`删除` ➤ `整列`。


    ![A978-1-4842-0529-7_2_Fig14_HTML.jpg](img/A978-1-4842-0529-7_2_Fig14_HTML.jpg)


    图 2-14. `Proper()` 函数的使用

