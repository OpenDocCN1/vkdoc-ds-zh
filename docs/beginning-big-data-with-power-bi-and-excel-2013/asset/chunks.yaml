    # 调整小计与总计


    小计可以在“数据透视表工具-设计”选项卡中进行调整。点击`小计`查看相关选项。


    - 不显示小计

    - 在组的底部显示所有小计

    - 在组的顶部显示所有小计


    点击`总计`查看以下选项：


    - 对行和列禁用

    - 对行和列启用

