    点击屏幕中央的`探索此数据集`。数据将显示出来，如图 3-22 所示。请注意，屏幕右上角显示了 Excel (CSV)、PowerPivot 2010 和
    PowerPivot 2013 的下载选项。选择`PowerPivot 2013`。


    ![A978-1-4842-0529-7_3_Fig22_HTML.jpg](img/A978-1-4842-0529-7_3_Fig22_HTML.jpg)


