  trans: "\n# 按类别统计诺贝尔奖数量\n\n可以通过在`Group By...`对话框中点击加号选择第二个字段，按类别和年份等两个字段进行分组，如图\
    \ 8-34 所示。再次点击屏幕右侧`查询设置`窗格中`应用的步骤`列表底部`分组行`后的齿轮图标，即可重新打开`Group By...`对话框。\n\n\
    ![A978-1-4842-0529-7_8_Fig34_HTML.jpg](img/A978-1-4842-0529-7_8_Fig34_HTML.jpg)\n\
    \n图 8-34. 包含两个字段的`Group By`对话框\n\n结果如图 8-35 所示。\n\n![A978-1-4842-0529-7_8_Fig35_HTML.jpg](img/A978-1-4842-0529-7_8_Fig35_HTML.jpg)\n\
    \n图 8-35. 按类别和年份统计的诺贝尔奖数量\n\n要添加第三个字段以显示获奖者姓名，在`Group By...`对话框中再次点击`+`，并添加获奖者的姓氏，如图\
    \ 8-36 所示。\n\n![A978-1-4842-0529-7_8_Fig36_HTML.jpg](img/A978-1-4842-0529-7_8_Fig36_HTML.jpg)\n\
    \n图 8-36. 包含三个字段的`Group By...`对话框\n\n结果如图 8-37 所示。\n\n![A978-1-4842-0529-7_8_Fig37_HTML.jpg](img/A978-1-4842-0529-7_8_Fig37_HTML.jpg)\n\
    \n图 8-37. 按类别和年份显示诺贝尔奖及获奖者姓氏\n\n## 总结\n\n本章演示了如何使用 Power Query 从网站导入表格、从文件夹导入多个\
    \ CSV 文件以及导入 JSON 数据。示例展示了如何使用 Power Query 进行数据的提取、转换和加载。后续章节将提供更多使用 Power Query\
    \ 的示例。\n\n# 9. Power Map\n\nPower Map 是一个强大的可视化工具，能够利用必应地图技术将 Excel 中的地理空间数据绘制在地图上，从而创建二维和三维可视化效果。本章将演示如何通过\
    \ Power Query 导入数据，然后使用 Power Map 进行绘图。\n\n## 安装 Power Map\n\nPower Map 可通过 Excel\
    \ `插入`选项卡上的图标访问。如果未显示该图标，则可能意味着您未安装当前版本的 Power Map。如果遇到这种情况，请搜索“下载 Power Map”，然后从\
    \ Microsoft 下载最新版本。接着，按照以下步骤启用 Power Map：\n\n点击`文件`选项卡以显示 Backstage 视图。点击左窗格底部的`选项`。在左窗格中选择`加载项`。在窗口底部，点击`管理`后的下拉箭头，选择`COM\
    \ 加载项`，然后点击`转到`。勾选`Microsoft Office PowerPivot for Excel 2013`、`Microsoft Power\
    \ Map for Excel and Power View`，然后点击`确定`。\n\n## 绘制地图\n\n绘制地图的步骤包括：\n\n- 打开数据源，可以是电子表格或包含地理描述信息（如城市、州或地理坐标）的数据模型。\n\
    - 选择`插入`选项卡，点击`地图`和`加载 Power Map`。\n- 在屏幕右侧的`字段`列表窗格中，选择要映射的地理字段，例如城市和州或地理坐标，然后选择一个数据指标，例如人口。Power\
    \ Map 会调用必应地图服务在地图上定位地理位置，然后绘制指标值。\n- 默认会显示柱状图。可以通过点击相应的图标将其更改为气泡图或热力图。\n\nPower\
    \ Map 视频导览是一种动画功能，通过链接单个地图来讲述数据故事。可以根据数据创建视频来讲述故事。一个视频由多个导览组成，一个导览由多个场景组成。\n\n\
    ## Power Map 功能区主要选项\n\n本节将重点介绍 Power Map 功能区中的一些关键选项，如图 9-1 所示。\n\n- **导览部分**\n\
    \  - `播放导览`。播放已创建的导览。\n  - `添加场景`。向导览添加一个场景。\n  - `创建视频`。从导览创建视频。\n- **地图部分**\n\
    \  - `主题`。更改地图样式。\n  - `地图标签`。添加国家或城市名称。\n  - `平面地图`。在二维和三维视图之间切换。\n- **图层部分**\n\
    \  - `添加图层`。添加新图层。\n  - `刷新数据`。从数据源刷新数据。\n  - `形状`。选择柱状图的形状。\n- **插入部分**\n  -\
    \ `二维图表`。添加二维图表。\n  - `文本框`。在地图上添加文本框。\n  - `图例`。为地图添加图例。\n- **时间部分**\n  - `时间线`。在时间动画中显示或隐藏时间线。\n\
    \  - `日期与时间`。在时间动画中显示或添加日期和时间。\n- **视图部分**\n  - `导览编辑器`。显示或隐藏导览编辑器窗格（屏幕左侧）。\n\
    \  - `图层窗格`。显示或隐藏图层窗格（屏幕右侧）。\n\n![A978-1-4842-0529-7_9_Fig1_HTML.jpg](img/A978-1-4842-0529-7_9_Fig1_HTML.jpg)\n\
    \n图 9-1. Power Map 功能区\n"
- fmt: '# Troubleshooting


    Power Map is very particular about data types. If numeric data that you want to
    plot is not treated as numeric data, as evidenced by only showing a count aggregation,
    or if time data is not recognized, follow these steps:


    Check for any extraneous string data in the column and delete the row containing
    string data. Make sure that a numeric data column is formatted as a number and
    that a date column is formatted as date. After changing the format, click `Refresh
    Data` on the Power Map ribbon.


    ## Exercise 9-1. Mapping California Crime Statistics Example


    This example shows how to use Power Query to import California crime statistics
    by city and how to use Power Map to plot the data.


    Go to Power Query and do a Data Catalog search on "California Cities by Population
    and Crime Rate." Hover your mouse over "Cities—California locations by crime rate"
    and select `Edit` to load into the Query Editor. The screen shown in Figure 9-2
    will appear.


    ![A978-1-4842-0529-7_9_Fig2_HTML.jpg](A978-1-4842-0529-7_9_Fig2_HTML.jpg)

    Figure 9-2. Crime Statistics in Query Editor


    In Query Editor, click the `Add Column` tab. On the left end of the tab, click
    `Add Custom Column`. Create a new column for state. Set the contents `="CA"`,
    as shown in Figure 9-3.


    ![A978-1-4842-0529-7_9_Fig3_HTML.jpg](A978-1-4842-0529-7_9_Fig3_HTML.jpg)

    Figure 9-3. Adding a State column


    Check that the data type of all the numeric columns is a decimal number by right-clicking
    the column heading, selecting `Change Type`, and selecting `Decimal Number`. Also,
    check that there are no non-numeric values in numeric columns. When the data is
    the way you want it, click `Close & Load` on the ribbon, to load to a spreadsheet.
    The spreadsheet should appear as shown in Figure 9-4.


    ![A978-1-4842-0529-7_9_Fig4_HTML.jpg](A978-1-4842-0529-7_9_Fig4_HTML.jpg)

    Figure 9-4. Crime data loaded into spreadsheet


    Again, check for non-numeric values in number fields that could keep Power Map
    from interpreting the contents correctly. Because not all the rows are displayed
    in the Query Editor, for larger datasets, this has to be checked after loading
    the data into Excel. As shown in Figure 9-5, the last row of data may contain
    ellipses. If this is the case, delete that last row by right-clicking the row
    and selecting `Delete Table Row`.


    ![A978-1-4842-0529-7_9_Fig5_HTML.jpg](A978-1-4842-0529-7_9_Fig5_HTML.jpg)

    Figure 9-5. Ellipsis in the last row that has to be deleted


    Check the formatting of each column by highlighting the column, by clicking the
    letter at the top of the column. Right-click the selected column and select `Format
    Cells` from the Context menu. For the population, violent crimes, and property
    crimes columns, set the format to `Number`, with 0 places to the right of the
    point, as shown in Figure 9-6. For the violent crimes and property crimes per
    1,000 persons, set the format to `Number`, with 2 places to the right of the point.


    ![A978-1-4842-0529-7_9_Fig6_HTML.jpg](A978-1-4842-0529-7_9_Fig6_HTML.jpg)

    Figure 9-6. Formatting column as number


    Click the `Insert` tab and select `Launch Power Map` under `Map`. If you have
    previously created a map, you may be prompted to create a `New Tour`. Accept the
    default of `City`, `County`, and `State` as the geographic fields, as shown in
    Figure 9-7. Click `Next`.


    ![A978-1-4842-0529-7_9_Fig7_HTML.jpg](A978-1-4842-0529-7_9_Fig7_HTML.jpg)

    Figure 9-7. Setting the geographic fields


    Click `Map Labels` on the ribbon to display city names. In the Layer pane, right-click
    `Property Crimes per 1,000 persons` and then click `Add to Height`, as shown in
    Figure 9-8. Note that the Bing Mapping service is showing a certainty of 94% for
    the geographic mapping in the upper right corner. If you want to go back and edit
    the geographic fields, click the icon above the 94%.


    ![A978-1-4842-0529-7_9_Fig8_HTML.jpg](A978-1-4842-0529-7_9_Fig8_HTML.jpg)

    Figure 9-8. Setting field for height of plot


    Click the legend box and resize it to be smaller, then drag it to the upper left
    part of the map. Click the large `+` on the lower right side of the map several
    times to zoom in. The results are shown in Figure 9-9. Note that it is possible
    to point the mouse at any graphic, to see the details about that city crime rate.
    It is also possible to double-click any location, to zoom in.


    ![A978-1-4842-0529-7_9_Fig9_HTML.jpg](A978-1-4842-0529-7_9_Fig9_HTML.jpg)

    Figure 9-9. Map with legend and detailed crime statistics


    ### Plotting Multiple Statistics


    It is possible to plot multiple metrics—both property crime and violent crime
    statistics. To do this, let''s continue with the example from the preceding section.


    ## Exercise 9-2. Mapping California Crime Statistics, Part 2


    You can plot the property crime and violent crime statistics by following these
    steps:


    In the Layer pane, right-click `Property crime rate per 1,000 persons` and select
    `Add to Height`, as shown in Figure 9-10.


    ![A978-1-4842-0529-7_9_Fig10_HTML.jpg](A978-1-4842-0529-7_9_Fig10_HTML.jpg)

    Figure 9-10. Adding violent crimes metric


    Note that the default view is stacked column. This can be changed to clustered
    column by clicking the icon to the right of stacked column, as shown in Figure
    9-11. The property crime rate is shown in blue, and the violent crime rate in
    orange.


    ![A978-1-4842-0529-7_9_Fig11_HTML.jpg](A978-1-4842-0529-7_9_Fig11_HTML.jpg)

    Figure 9-11. Display of both property crime and violent crime metric


    Click `Add Scene` on the left end of the ribbon. Click the `Text Box` icon on
    the ribbon and add the title "California Cities Crime Rates," as shown in Figure
    9-12.


    ![A978-1-4842-0529-7_9_Fig12_HTML.jpg](A978-1-4842-0529-7_9_Fig12_HTML.jpg)

    Figure 9-12. Adding a title to the map


    Change the view to the bubble view, which is like a pie chart. The text box can
    be resized and dragged to the appropriate location on the map, as shown in Figure
    9-13.


    ![A978-1-4842-0529-7_9_Fig13_HTML.jpg](A978-1-4842-0529-7_9_Fig13_HTML.jpg)

    Figure 9-13. Bubble view of data


    The size of the bubbles can be adjusted by clicking the gear icon at the top right
    of the Layer pane, selecting `Layer Options`, and adjusting the size slider, as
    shown in Figure 9-14.


    ![A978-1-4842-0529-7_9_Fig14_HTML.jpg](A978-1-4842-0529-7_9_Fig14_HTML.jpg)

    Figure 9-14. Adjusting bubble size


    Click `Add Scene` on the left end of the ribbon. Another view is the heat map
    view shown in Figure 9-15. Note that San Francisco and Los Angeles, the two largest
    cities in California, have the most crime.


    ![A978-1-4842-0529-7_9_Fig15_HTML.jpg](A978-1-4842-0529-7_9_Fig15_HTML.jpg)

    Figure 9-15. Heat map view of data'
  raw: '## Troubleshooting


