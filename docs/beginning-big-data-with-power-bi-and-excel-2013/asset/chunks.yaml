    Clustered column view'
  trans: '

    ### 添加二维图表


    通过单击功能区上的`二维图表`，可以添加每千人财产犯罪率的二维图表。结果如图 9-16 所示。


    ![A978-1-4842-0529-7_9_Fig16_HTML.jpg](img/A978-1-4842-0529-7_9_Fig16_HTML.jpg)

    图 9-16.


    ### 二维图表练习 9-3：绘制欧洲失业率示例


    本示例将展示如何将欧洲失业率数据加载到 Power Query 中，以及如何使用 Power Map 进行绘制。同时，还将展示如何取消数据透视，以便添加时间动画。请按照以下步骤操作：


    单击`Power Query`选项卡，选择`数据目录搜索`。在搜索框中输入“European Unemployment”。将鼠标悬停在每个搜索结果上，预览数据，如图
    9-17 所示。


    ![A978-1-4842-0529-7_9_Fig17_HTML.jpg](img/A978-1-4842-0529-7_9_Fig17_HTML.jpg)

    图 9-17. 欧洲失业数据预览


    在预览屏幕底部选择`编辑`，将数据加载到`查询编辑器`中，如图 9-18 所示。


    ![A978-1-4842-0529-7_9_Fig18_HTML.jpg](img/A978-1-4842-0529-7_9_Fig18_HTML.jpg)

    图 9-18. `查询编辑器`中的失业数据


    检查数据形状，查看是否有无关列。在此例中，列包括国家名称、按年份划分的失业率以及一个使用顺序编号的关键列。同时，检查各行。请注意，其中包含美国、日本以及欧洲的失业数据行。


    另外，检查每列的数据类型是否正确。要检查数据类型，请单击列标题选中该列，并注意功能区右上角显示的数据类型。要更改数据类型，请选中一列，单击功能区上`数据类型`后的箭头，然后选择正确的数据类型。请注意，`2005`和`2006`的数据类型是文本，而其他年份的数据类型是`小数`。使用此方法将所有数值列的类型更改为`小数`。


    检查列标题。请注意，包含国家名称的列标题是`失业率`，这描述性不强。要更改列名，请右键单击列标题并选择`重命名`。将其重命名为`country`，如图 9-19
    所示。请注意，列重命名操作会列在屏幕右侧`查询设置`窗格的`应用的步骤`下。


    ![A978-1-4842-0529-7_9_Fig19_HTML.jpg](img/A978-1-4842-0529-7_9_Fig19_HTML.jpg)

    图 9-19. 重命名国家列后的`查询编辑器`


    当数据按照您的要求调整好形状后，选择`查询编辑器`功能区最左侧的`关闭并加载`，将数据加载到电子表格中。请注意，数据也可以加载到数据模型中，但本示例将使用电子表格。


    此时是保存电子表格并将其命名为“European Unemployment”的好时机。


    要开始创建地图，请选择`插入`选项卡，然后依次点击`地图`和`启动 Power Map`。


    将出现如图 9-20 所示的屏幕。请注意，在屏幕右侧的`图层`窗格中，`country`被选为地理字段。单击`下一步`。


    ![A978-1-4842-0529-7_9_Fig20_HTML.jpg](img/A978-1-4842-0529-7_9_Fig20_HTML.jpg)

    图 9-20. 选择国家作为地理字段


    请注意，每个有数据的国家都会出现圆点。单击功能区上的`地图标签`以显示国家名称，并选择要绘制的数值字段。在此例中，将勾选`2012`年的失业率以便进行绘制，如图
    9-21 所示。请注意，勾选该字段后，它将被添加到`高度`框中。默认格式为堆积柱形图，数值的默认聚合方式是求和。将鼠标指向地图上的柱子，将显示该国`2012`年的失业率。


    ![A978-1-4842-0529-7_9_Fig21_HTML.jpg](img/A978-1-4842-0529-7_9_Fig21_HTML.jpg)

    图 9-21. 以柱形图显示的`2012`年失业率


    通过单击`高度`框右侧的箭头并选择`不聚合`，将聚合方式更改为“无”。单击图例框并使用控制点调整其大小，然后将其拖拽到地图左侧重新定位，如图 9-22 所示。


    ![A978-1-4842-0529-7_9_Fig22_HTML.jpg](img/A978-1-4842-0529-7_9_Fig22_HTML.jpg)

    图 9-22. 移动图例框并将聚合方式更改为“无”后的地图


    通过单击`图层`窗格中`高度`字样上方的图标，尝试不同的可视化格式，以查看聚类柱形图、气泡图、热力图和区域图。请注意，由于只显示一组数据，聚类柱形图和堆积柱形图格式是相同的。气泡图视图如图
    9-23 所示。


    ![A978-1-4842-0529-7_9_Fig23_HTML.jpg](img/A978-1-4842-0529-7_9_Fig23_HTML.jpg)

    图 9-23. 气泡图视图


    要放大地图，请单击地图右下角的大`+`号，或双击地图上的某个区域进行放大。


    要更改气泡的不透明度、大小或粗细，请单击`图层`窗格顶部右侧的齿轮图标。图 9-24 显示了一个热力图视图，其中颜色标度设置为`180%`，热力图半径设置为`191%`，不透明度设置为`99%`。
    `图层 1`的图例框显示了基于失业率的颜色键。请注意，您还可以通过勾选或取消勾选复选框来决定是否显示零值、负值和空值。


    ![A978-1-4842-0529-7_9_Fig24_HTML.jpg](img/A978-1-4842-0529-7_9_Fig24_HTML.jpg)

    图 9-24. 热力图视图


    ### 显示两个或多个数值


    可以显示两个或多个数值，例如显示两个不同年份的失业率。使用上一节中的示例，图 9-25 以气泡形式显示了`2011`年（橙色）和`2012`年（蓝色）的失业率。将鼠标指向气泡上的颜色将显示该年份的失业率。


    ![A978-1-4842-0529-7_9_Fig25_HTML.jpg](img/A978-1-4842-0529-7_9_Fig25_HTML.jpg)

    图 9-25. 气泡图视图


    图 9-26 以堆积柱形图显示了`2010`年（橙色）和`2011`年（蓝色）的失业率。将鼠标指向堆积柱形图上的颜色将显示该年份的失业率。


    ![A978-1-4842-0529-7_9_Fig26_HTML.jpg](img/A978-1-4842-0529-7_9_Fig26_HTML.jpg)

    图 9-26. 堆积柱形图视图


    相同的数据以聚类柱形图显示（柱形并排排列），如图 9-27 所示。


    ![A978-1-4842-0529-7_9_Fig27_HTML.jpg](img/A978-1-4842-0529-7_9_Fig27_HTML.jpg)

    图 9-27. 聚类柱形图视图

    '
- fmt: '### Creating a 2D Chart


    A two-dimensional chart showing the progression over time can be plotted by checking
    a series of years and then clicking `2D Chart` on the ribbon. The result is shown
    in Figure [9-28](#A978-1-4842-0529-7_9_Chapter.html#Fig28). Hovering the mouse
    over the 2D chart will bring up a box with a down arrow after the title, which
    allows changing the chart type.


    ![A978-1-4842-0529-7_9_Fig28_HTML.jpg](A978-1-4842-0529-7_9_Fig28_HTML.jpg)


    Figure 9-28.


    ### 2D chart Exercise 9-4. Building A Time Animation Exercise


    It is possible to animate a presentation to show the map values at different times.
    To do this, it is necessary to unpivot the data to indicate that a value is shown
    for each country for each year. To start from scratch, go back to steps 1–3 at
    the beginning of “Exercise 9-3. Plotting European Unemployment Rates Example”
    to load the data into the Query Editor, or click `Recent Sources` on the PowerPivot
    tab and select the data there.


    In the Query Editor, click the first year column heading to select the column.
    Then `Ctrl`-click the other year column headings to select all year columns, or
    after selecting the first year column, `Shift`-click the last year column to select
    all year columns. Right-click one of the selected column headings and select `Unpivot
    Columns`, as shown in Figure [9-29](#A978-1-4842-0529-7_9_Chapter.html#Fig29).


    ![A978-1-4842-0529-7_9_Fig29_HTML.jpg](A978-1-4842-0529-7_9_Fig29_HTML.jpg)


    Figure 9-29.


    Context menu showing the `Unpivot Columns` option


    The results are shown in Figure [9-30](#A978-1-4842-0529-7_9_Chapter.html#Fig30).
    One row has been created for each country and year.


    ![A978-1-4842-0529-7_9_Fig30_HTML.jpg](A978-1-4842-0529-7_9_Fig30_HTML.jpg)


    Figure 9-30.


    Unpivoted data


    Note that the column containing the year is labeled `Attribute`, which is not
    descriptive. Right-click the column heading and select `Rename` to change the
    name to `year`. Make sure that only the `Attribute` column is selected. Then change
    the data type to date, by selecting the column and clicking the down arrow after
    `Data Type` on the top-right side of the ribbon and selecting `date`. Change the
    name of the unemployment column to `country`, change the name of the value column
    to `unemployment`, and change the type of the column to decimal number. After
    changing the type of the unemployment column to decimal number, all data will
    be right-justified. The data should appear as shown in Figure [9-31](#A978-1-4842-0529-7_9_Chapter.html#Fig31).
    Note that the Applied Steps are shown in the Query Settings pane on the right
    side of the screen.


    ![A978-1-4842-0529-7_9_Fig31_HTML.jpg](A978-1-4842-0529-7_9_Fig31_HTML.jpg)


    Figure 9-31.


    Spreadsheet after renaming columns


    Select `Close & Load` to save to a spreadsheet.


    At this point, it is important to check the columns for any extraneous data types.
    For example, if a date column has non-date values, it will not map properly. The
    best way to check is to sort the columns from lowest to highest and highest to
    lowest, by pulling down the arrow at the top of each numeric and date column.
    This process may reveal a row containing only dots, as shown in Figure [9-32](#A978-1-4842-0529-7_9_Chapter.html#Fig32).
    If this is the case, delete this row by highlighting the row, right-clicking,
    and selecting `delete` and `table rows`.


    ![A978-1-4842-0529-7_9_Fig32_HTML.jpg](A978-1-4842-0529-7_9_Fig32_HTML.jpg)


    Figure 9-32.


    Extraneous row containing ellipses at top


    Check the formatting on the year column by selecting the column and right-clicking,
    making sure that a date format is selected, as shown in Figure [9-33](#A978-1-4842-0529-7_9_Chapter.html#Fig33).


    ![A978-1-4842-0529-7_9_Fig33_HTML.jpg](A978-1-4842-0529-7_9_Fig33_HTML.jpg)


    Figure 9-33.


    Applying date format to year column


    Also, check the format for the unemployment column, making sure that it has a
    number format with two places to the right of the decimal point, as shown in Figure
    [9-34](#A978-1-4842-0529-7_9_Chapter.html#Fig34).


    ![A978-1-4842-0529-7_9_Fig34_HTML.jpg](A978-1-4842-0529-7_9_Fig34_HTML.jpg)


    Figure 9-34.


    Applying number format to unemployment column


    Then select the `Insert` tab and click `Map` and `Launch Power Map`.


    Click the `Refresh Data` icon on the ribbon. This is important for applying the
    formatting changes.


    Confirm that `country` is the geographic field by clicking `Next`, as shown in
    Figure [9-35](#A978-1-4842-0529-7_9_Chapter.html#Fig35).


    ![A978-1-4842-0529-7_9_Fig35_HTML.jpg](A978-1-4842-0529-7_9_Fig35_HTML.jpg)


    Figure 9-35.


    Defining geographic field


    Click `Map Labels` on the ribbon, then click the `unemployment` field to select
    the metric to be plotted and drag the legend box to the left, as shown in Figure
    [9-36](#A978-1-4842-0529-7_9_Chapter.html#Fig36).


