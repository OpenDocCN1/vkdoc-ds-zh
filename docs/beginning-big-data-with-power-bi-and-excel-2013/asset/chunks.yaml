    ## Understanding Data Analysis Expressions


    As explained in [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html), Data Analysis
    Expressions (DAX) is a formula language used to create calculated columns and
    fields based on the tabular data model of PowerPivot. DAX formulas differ from
    regular Excel formulas, which are cell-based, in that DAX formulas apply to all
    rows in the specified columns. DAX formulas are used in the following two contexts:


    Calculated columns. Calculated columns can be added to an existing PowerPivot
    table. When a column contains a formula, the value is calculated for each row.
    To create a formula, click any cell in a new column and press Enter to start entering
    a formula that is based on column references. Column names can be referenced by
    pointing to them with the mouse or by entering the names enclosed in square brackets.
    Columns from other worksheets can be referenced by entering the worksheet name
    before the column name. If the worksheet name contains a space, it can be enclosed
    in single quotes. Up to 64 levels of functions can be nested in a DAX expression.
      Calculated fields or measures. These are placed in the calculation area at the
    bottom of the PowerPivot window. Calculated fields often include aggregation functions,
    such as sum or average, which by default reference the entire column. DAX functions
    are very similar to Excel functions, but DAX functions are column-oriented. All
    available DAX functions can be viewed by clicking the fx icon on the Design tab
    of the PowerPivot window. When a calculated field is created, the formula is preceded
    by an identifier, which is like a variable name and can be used to reference the
    calculated field.   Caution


    When using DAX, it is best to avoid using the same name for a calculated field
    and a calculated column. To further avoid ambiguity, it is best when, referencing
    a column, to use the fully qualified column name, which includes the name of the
    worksheet.


    ### DAX Operators


    DAX uses the following:


