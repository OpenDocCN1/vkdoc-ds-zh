    ## Introduction


    This book is intended for anyone with a basic knowledge of Excel who wants to
    analyze and visualize data in order to get results. It focuses on understanding
    the underlying structure of data, so that the most appropriate tools can be used
    to analyze it. The early working title of this book was “Big Data for the Masses,”
    implying that these tools make Business Intelligence (BI) more accessible to the
    average person who wants to leverage his or her Excel skills to analyze large
    datasets.


    As discussed in [Chapter 1](#A978-1-4842-0529-7_1_Chapter.html), big data is more
    about volume and velocity than inherent complexity. This book works from the premise
    that many small- to medium-sized organizations can meet most of their data needs
    with Excel and Power BI. The book demonstrates how to import big data file formats
    such as `JSON`, `XML`, and `HDFS` and how to filter larger datasets down to thousands
    or millions of rows instead of billions.


    This book starts out by showing how to import various data formats into Excel
    ([Chapter 2](#A978-1-4842-0529-7_2_Chapter.html)) and how to use Pivot Tables
    to extract summary data from a single table ([Chapter 3](#A978-1-4842-0529-7_3_Chapter.html)).
    [Chapter 5](#A978-1-4842-0529-7_5_Chapter.html) demonstrates how to use Structured
    Query Language (SQL) in Excel. [Chapter 10](#A978-1-4842-0529-7_10_Chapter.html)
    offers a brief introduction to statistical analysis in Excel.


    This book primarily covers Power BI—Microsoft’s self-service BI tool—which includes
    the following Excel add-ins:


    - **PowerPivot**. This provides the repository for the data (see [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html))
    and the `DAX` formula language (see [Chapter 7](#A978-1-4842-0529-7_7_Chapter.html)).
    [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html) provides an example of processing
    millions of rows in multiple tables.

    - **Power View**. A reporting tool for extracting meaningful reports and creating
    some of the elements of dashboards (see [Chapter 6](#A978-1-4842-0529-7_6_Chapter.html))

    - **Power Query**. A tool to Extract, Transform, and Load (ETL) data from a wide
    variety of sources (see [Chapter 8](#A978-1-4842-0529-7_8_Chapter.html))

    - **Power Map**. A visualization tool for mapping data (see [Chapter 9](#A978-1-4842-0529-7_9_Chapter.html))


    [Chapter 11](#A978-1-4842-0529-7_11_Chapter.html) demonstrates how to use `HDInsight`
    (Microsoft’s implementation of Hadoop that runs on its Azure cloud platform) to
    import big data into Excel.


    This book is written for Excel 2013, but most of the examples it includes will
    work with Excel 2010, if the `PowerPivot`, `Power View`, `Power Query`, and `Power
    Map` add-ins are downloaded from Microsoft. Simply search on download and the
    add-in name to find the download link.


    ## Disclaimer


