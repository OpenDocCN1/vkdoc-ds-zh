    # 关系型数据库


    随着计算机的普及，存储的数据量日益增长，需要软件来组织这些数据。关系型数据库管理系统（`RDBMS`）基于 IBM 的 E. F. Codd 在 20 世纪
    70 年代初提出的关系模型。尽管早期工作由 IBM 完成，但第一个商业化的 `RDBMS` 是由 Oracle 公司在 1979 年发布的。


    关系型数据库将数据组织成由行和列组成的表，每一行都有一个唯一的键，称为主键。数据库是表的集合。数据库中的每个实体都有自己的表，行代表该实体的实例。列则存储属性或字段的值。


    关系代数由 IBM 的 Codd 首先提出，它为关系型数据库中存储的数据建模和定义查询提供了理论基础。关系型数据库支持选择、投影和连接。选择是指根据条件选取表中指定的行。投影是指选取特定的列或属性。连接是指根据条件将两个或多个表连接起来。


    正如第 5 章所讨论的，结构化查询语言（`SQL`）最初由 IBM 在 20 世纪 70 年代初开发。它用于操作和检索早期 IBM 关系型数据库管理系统（`RDBMS`）中的数据。后来，Oracle
    和微软也将其实现到各自的关系型数据库管理系统中。


    ## 规范化


    规范化是在数据库中组织数据的过程，主要目标如下：


    -   避免重复字段（除用于连接表的键字段外）。

    -   避免多重依赖，即避免依赖于主键以外的任何其他字段。


    存在多种范式，最常见的是第三范式（`3NF`），它基于消除传递依赖，也就是说，消除不依赖于主键的字段。换句话说，当每个字段都依赖于主键、整个主键、并且仅依赖于主键时，数据就符合
    `3NF`。


    图 1-4（与图 4-11 相同）展示了多个表之间的关系。带有箭头的线表示表之间的关系。主要有三种关系类型。


    -   **一对一**（`1-1`）：表示字段之间存在一一对应关系。通常，具有一一对应关系的字段应放在同一个表中。

    -   **一对多**：表示对于一个表中的每条记录，在对应表中存在多条记录。“多”由线条末端的箭头表示。“多”表示零到 n 个。例如，如图 1-4 所示，对于产品表中的每个产品代码，订单详情表中可能存在多个产品
    ID 实例，但每个产品 ID 仅与产品表中的一个产品代码相关联。

    -   **多对多**：表示一个实体的多个实例与另一个实体的多个实例之间的关系。例如，作者和书籍：每位作者可以有多本书，每本书也可以有多个作者。“多”表示零到
    n 个。


    ![A978-1-4842-0529-7_1_Fig4_HTML.jpg](img/A978-1-4842-0529-7_1_Fig4_HTML.jpg)


    图 1-4. 展示表之间的关系


    ## 个人电脑数据库软件


    20 世纪 80 年代，随着个人电脑的广泛使用，针对个人电脑的数据库程序被开发出来。`dBASE II` 是首批用于个人电脑的可编程关系型数据库系统之一，由加州帕萨迪纳喷气推进实验室（`JPL`）的
    Wayne Ratliff 开发。20 世纪 80 年代初，他与 George Tate 合作成立了 Ashton-Tate 公司来销售 `dBASE II`，并取得了巨大成功。20
    世纪 80 年代中期，功能增强的 `dBASE III` 发布。


    `dBASE` 程序是解释型执行的，这意味着它们比编译型程序（所有指令一次性翻译成机器语言）运行速度要慢。`Clipper` 于 1985 年作为 `dBASE`
    的编译版本发布，并变得非常流行。几年后，`FoxBase`（后来更名为 `FoxPro`）发布，并增加了更多增强功能。


    # 大数据与 NoSQL 的诞生


    因特网在 20 世纪 90 年代开始普及，这部分归功于万维网，它使网络更容易使用。相互竞争的搜索引擎使用户能够轻松找到数据。Google 成立于 1996
    年，它彻底改变了搜索方式。随着可用数据越来越多，试图将所有数据都塞进矩形表格的关系型数据库的局限性变得显而易见。


    1998 年，Carlo Strozzi 使用了 `NoSQL` 这个术语。据报道，他后来对使用这个术语感到后悔，认为 `NoRel`（非关系型）会是一个更好的术语。


    ## Hadoop 分布式文件系统 (HDFS)


    大数据技术的很大一部分来自搜索引擎公司。Hadoop 源于 Apple Nutch，这是一个于 2002 年启动的开源网络搜索引擎。它包含一个网络爬虫和搜索引擎，但无法扩展到处理数十亿个网页。


    2003 年，一篇描述 Google 分布式文件系统（`GFS`）架构的论文发表，Google 使用该系统来存储网页爬取和索引生成的大型文件。2004 年，一个开源版本作为
    Nutch 分布式文件系统（`NDFS`）发布。


    2004 年，Google 发表了一篇关于 `MapReduce` 的论文。到 2005 年，`MapReduce` 已被整合到 Nutch 中。`MapReduce`
    是一种批量查询过程，能够针对大型数据集运行临时查询。它解锁了以前被归档的数据。运行查询可能需要几分钟或更长时间。


    2006 年 2 月，Hadoop 被设立为一个独立的子项目。基于他与 Mike Cafarella 之前的工作，Doug Cutting 去 Yahoo!
    工作，Yahoo! 提供了资源，将 Hadoop 转变为对网络有用的工具。到 2008 年，Yahoo! 将其搜索索引建立在一个 Hadoop 集群之上。Hadoop
    这个名字来源于 Doug Cutting 的孩子给一个黄色填充大象玩偶起的名字。Hadoop 提供了一个可靠、可扩展的平台，用于在廉价的通用硬件上运行存储和分析。Hadoop
    是开源的。


    ## 大数据


    大数据没有单一的定义，但目前围绕它有很多炒作，所以其含义可能被稀释。普遍认为它是指结构不规则、涉及数百 TB 到 PB 及更高级别数据量的大规模数据。它可以包括来自金融交易、传感器、网络日志和社交媒体的数据。一个更具操作性的定义是，当组织的数据处理需求对于传统关系型数据库来说过大时，他们就必须使用大数据。


    大数据基于反馈经济，其中物联网将传感器放置在越来越多的设备上。随着医疗记录数字化、更多商店通过会员卡追踪消费者购买行为、以及人们佩戴健康追踪设备，产生的数据越来越多。通常，大数据更关注行为分析，而非传统关系型数据库擅长的交易监控。随着存储成本的下降，公司会追踪越来越多的数据，以寻找模式并构建预测模型。


    ## 三个 V


    表征大数据的一种方式是通过三个 V：


    -   **Volume（数据量）**：涉及多少数据？

    -   **Velocity（数据速度）**：数据产生有多快？

    -   **Variety（数据多样性）**：数据是否具有不规则的结构和格式？


    有时还会用到另外两个 V：


    -   **Variability（数据可变性）**：是否涉及多种具有不同解释的格式？

    -   **Veracity（数据真实性）**：数据有多准确？

