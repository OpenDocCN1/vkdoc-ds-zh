    # 从文件夹导入 CSV 文件


    有时 Hadoop 数据会以逗号分隔值（CSV）的文件形式存储。无需将其加载到 Hortonworks Sandbox 或其他产品中作为 Hadoop 数据进行处理，这些
    CSV 文件可以直接使用 Power Query 加载到 Excel 和 PowerPivot 中。下面的示例演示了如何操作。


    首先，从以下 URL 下载股市压缩文件：`s3.amazonaws.com/hortonassets/mstut/nyse.zip` 下载完成后，在浏览器的下载窗口中双击该文件将其打开，如图
    8-12 所示。


    ![A978-1-4842-0529-7_8_Fig12_HTML.jpg](img/A978-1-4842-0529-7_8_Fig12_HTML.jpg)


    图 8-12.


    下载窗口 将下载两个包含 `.csv` 文件的文件夹，如图 8-13 所示。


    ![A978-1-4842-0529-7_8_Fig13_HTML.jpg](img/A978-1-4842-0529-7_8_Fig13_HTML.jpg)


    图 8-13.


    显示文件文件夹的窗口 将文件夹 `nyse_prices` 拖到桌面上，以便更轻松地访问。打开 Excel，单击“Power Query”选项卡。依次选择“从文件”和“从文件夹”，如图
    8-14 所示。


    ![A978-1-4842-0529-7_8_Fig14_HTML.jpg](img/A978-1-4842-0529-7_8_Fig14_HTML.jpg)


    图 8-14.


    用于从文件文件夹导入的 Power Query 屏幕 单击“浏览”，然后从桌面上选择 `nyse_prices` 文件夹，如图 8-15 所示。单击“确定”。


    ![A978-1-4842-0529-7_8_Fig15_HTML.jpg](img/A978-1-4842-0529-7_8_Fig15_HTML.jpg)


    图 8-15.


    文件夹屏幕 结果是一个 `.csv` 文件列表，如图 8-16 所示。


    ![A978-1-4842-0529-7_8_Fig16_HTML.jpg](img/A978-1-4842-0529-7_8_Fig16_HTML.jpg)


    图 8-16.


    `.csv` 文件列表 要打开一个文件，请单击最左侧列中的“Binary”。在此示例中，选择第五行中的文件。该文件将在查询编辑器中打开，结果如图 8-17
    所示。请记住，查询编辑器只能包含总记录数的一个子集。


    ![A978-1-4842-0529-7_8_Fig17_HTML.jpg](img/A978-1-4842-0529-7_8_Fig17_HTML.jpg)


    图 8-17.


    导入到查询编辑器中的 CSV 文件 请注意，此文件包含每只股票在特定日期的开盘价、最高价、最低价、收盘价和交易量。在此示例中，将保留所有行和列。单击“关闭并加载”，将记录从查询编辑器加载到电子表格中。结果如图
    8-18 所示。


    ![A978-1-4842-0529-7_8_Fig18_HTML.jpg](img/A978-1-4842-0529-7_8_Fig18_HTML.jpg)


    图 8-18.


    加载到电子表格中的数据


    ## 分组依据


    要按特定类别进行分组，请进入查询编辑器并按照以下步骤操作：


    通过单击“Power Query”选项卡上的“启动编辑器”重新打开查询编辑器。然后依次单击“转换”和功能区左端的“分组依据”。在“分组依据”对话框中，选择
    `stock_symbol` 列作为分组依据条件，并将默认设置保留为“计数”，如图 8-19 所示。


    ![A978-1-4842-0529-7_8_Fig19_HTML.jpg](img/A978-1-4842-0529-7_8_Fig19_HTML.jpg)


    图 8-19.


