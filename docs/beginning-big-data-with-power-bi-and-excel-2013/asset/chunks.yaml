    relationships that have been defined, as shown in Figure [5-19](#A978-1-4842-0529-7_5_Chapter.html#Fig19).


    ![A978-1-4842-0529-7_5_Fig19_HTML.jpg](A978-1-4842-0529-7_5_Fig19_HTML.jpg)


    Figure 5-19.


    Query screen showing tables and relationships


