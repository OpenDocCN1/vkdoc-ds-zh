- fmt: '### Provisioning a Hadoop Cluster


    To provision a Hadoop Cluster, follow these steps:


    Click `+NEW` in the lower left corner of the screen. Select `Data Services ➤ HDInsight
    ➤ Hadoop` and fill in the values on the right side of the screen, as shown in
    Figure [11-7](#A978-1-4842-0529-7_11_Chapter.html#Fig7). Choose a cluster name.
    Two nodes should be sufficient for this example. Azure sets the default user name
    to `Admin`. You will need to create a password of at least ten characters, including
    at least one capital letter, one number, and one special character, and enter
    it twice, as prompted. Be sure to remember the password entered.


    ![A978-1-4842-0529-7_11_Fig7_HTML.jpg](A978-1-4842-0529-7_11_Fig7_HTML.jpg)


    Figure 11-7.


    Setting up the HDInsight cluster


    Click `Create HDInsight Cluster` at the bottom lower right of the screen. Then
    the screen shown in Figure [11-8](#A978-1-4842-0529-7_11_Chapter.html#Fig8) will
    appear after the cluster is created, which may take 20 minutes or more.


    ![A978-1-4842-0529-7_11_Fig8_HTML.jpg](A978-1-4842-0529-7_11_Fig8_HTML.jpg)


    Figure 11-8.


    Showing new cluster


    Click `HDInsight` from the left pane to see the list of clusters, as shown in
    Figure [11-9](#A978-1-4842-0529-7_11_Chapter.html#Fig9). The cluster that was
    just created should be shown.


    ![A978-1-4842-0529-7_11_Fig9_HTML.jpg](A978-1-4842-0529-7_11_Fig9_HTML.jpg)


    Figure 11-9.


    List of HDInsight clusters


    Select the cluster that was just created and click `Query Console` at the bottom
    of the screen. If requested, enter your admin username and password. The screen
    shown in Figure [11-10](#A978-1-4842-0529-7_11_Chapter.html#Fig10) will appear.


    ![A978-1-4842-0529-7_11_Fig10_HTML.jpg](A978-1-4842-0529-7_11_Fig10_HTML.jpg)


    Figure 11-10.


    HDInsight Query Console


    Scroll down to see Solutions With Sample Data. Click the `Hive Editor` tab at
    the top of the screen. In Hive Editor, enter a query name and accept the default
    SQL as `Select * from hivesampletable` to select all records as shown in Figure
    [11-11](#A978-1-4842-0529-7_11_Chapter.html#Fig11).


    ![A978-1-4842-0529-7_11_Fig11_HTML.jpg](A978-1-4842-0529-7_11_Fig11_HTML.jpg)


    Figure 11-11.


    SQL query to select all records


    Click `Submit`. To see the query results, click the query name at the bottom left
    of the screen, as shown in Figure [11-12](#A978-1-4842-0529-7_11_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_11_Fig12_HTML.jpg](A978-1-4842-0529-7_11_Fig12_HTML.jpg)


    Figure 11-12.


    Query results


    On the HD Query Console screen, click `File Browser` at the top of the screen.
    The results are shown in Figure [11-13](#A978-1-4842-0529-7_11_Chapter.html#Fig13).


    ![A978-1-4842-0529-7_11_Fig13_HTML.jpg](A978-1-4842-0529-7_11_Fig13_HTML.jpg)


    Figure 11-13.


    List of clusters


    Click the first item in the Name column on the left and then on your cluster name,
    to get the results shown in Figure [11-14](#A978-1-4842-0529-7_11_Chapter.html#Fig14).


    ![A978-1-4842-0529-7_11_Fig14_HTML.jpg](A978-1-4842-0529-7_11_Fig14_HTML.jpg)


    Figure 11-14.


    List of files in cluster


    ### Importing into Excel


    There are several ways to import this data into Excel. This section will demonstrate
    how to download the file to a text file with fixed-length fields.


    Follow these steps:


    | Old Name | New Name |

    | --- | --- |

    | `Column2` | `Datetime` |

    | `Column4` | `OS` |

    | `Column5` | `Manufacturer` |

    | `Coluimn6` | `Model` |

    | `Column7` | `State` |

    | `Column 8` | `Country` |

    | `Column10` | `Accesses` |


    Go back to the screen shown in Figure [11-12](#A978-1-4842-0529-7_11_Chapter.html#Fig12),
    by clicking `Job History` at the top of the screen and then clicking the query
    name. Then click `Download File`. The Job Log for the download is shown in Figure
    [11-15](#A978-1-4842-0529-7_11_Chapter.html#Fig15), which reports that 59,793
    rows were downloaded. The number you see may differ.


    ![A978-1-4842-0529-7_11_Fig15_HTML.jpg](A978-1-4842-0529-7_11_Fig15_HTML.jpg)


    Figure 11-15.


    Job Log for downloads


    Click the blue box at the bottom of the screen labeled `Download File`. When prompted
    for the program to use to open the file, select Notepad. The result will appear
    in Notepad, as shown in Figure [11-16](#A978-1-4842-0529-7_11_Chapter.html#Fig16).
    This appears to be a log file for web site accesses.


    ![A978-1-4842-0529-7_11_Fig16_HTML.jpg](A978-1-4842-0529-7_11_Fig16_HTML.jpg)


    Figure 11-16.


    Log file for web site accesses


    Do a `Save As` to save the file to the desktop, to make it easier to access. Open
    Excel and click the `Power Query` tab. Select `from File` and then `From Text`
    and `Browse` to find the downloaded file. The file will be loaded into the Query
    Editor, as shown in Figure [11-17](#A978-1-4842-0529-7_11_Chapter.html#Fig17).
    Note that Power Query parsed the fixed-length fields to neatly put all the data
    in separate columns, but there are no descriptive column headings.


    ![A978-1-4842-0529-7_11_Fig17_HTML.jpg](A978-1-4842-0529-7_11_Fig17_HTML.jpg)


    Figure 11-17.


    File loaded into Power Query


    To rename critical columns, right-click the column heading, select `Rename`, and
    enter a new descriptive name, as shown below.


    The result is shown in Figure [11-18](#A978-1-4842-0529-7_11_Chapter.html#Fig18).


    To load the data into a spreadsheet, click `Close & Load` on the left end of the
    ribbon and select `Close & Load`. The data is loaded into a spreadsheet, as shown
    in Figure [11-19](#A978-1-4842-0529-7_11_Chapter.html#Fig19).


    ![A978-1-4842-0529-7_11_Fig19_HTML.jpg](A978-1-4842-0529-7_11_Fig19_HTML.jpg)


    Figure 11-19.


    Data loaded into spreadsheet


    ![A978-1-4842-0529-7_11_Fig18_HTML.jpg](A978-1-4842-0529-7_11_Fig18_HTML.jpg)


    Figure 11-18.


    Power Query Editor after columns are renamed


    ### Creating a Pivot Table


    To create a Pivot Table to analyze accesses by state, manufacturer, and model,
    follow these steps:


    Click `Insert` and `Pivot Table`. Accept the default of putting it in a new worksheet.
    Drag `state` to the `Columns` box, `manufacturer` and `model` to the `Rows` box,
    and `accesses` to the `Values` box. The result, which shows accesses by manufacturer
    and model, is shown in Figure [11-20](#A978-1-4842-0529-7_11_Chapter.html#Fig20).


    ![A978-1-4842-0529-7_11_Fig20_HTML.jpg](A978-1-4842-0529-7_11_Fig20_HTML.jpg)


    Figure 11-20.


    Pivot Table showing accesses by manufacturer and model


    ### Creating a Map in Power Map


    This example shows how to map the data using Power Map. Follow these steps:


    With the data loaded into the spreadsheet, click the `Insert` tab and then `Map`
    and `Launch Power Map`. Accept the default of country and state as the default
    geographic fields and click `Next`, as shown in Figure [11-21](#A978-1-4842-0529-7_11_Chapter.html#Fig21).


    ![A978-1-4842-0529-7_11_Fig21_HTML.jpg](A978-1-4842-0529-7_11_Fig21_HTML.jpg)


    Figure 11-21.


    Selecting geographic fields


    Click `Accesses` for height and right-click `OS` and select `Set as Category`,
    as shown in Figure [11-22](#A978-1-4842-0529-7_11_Chapter.html#Fig22), which shows
    the map panned over to the United States.


    ![A978-1-4842-0529-7_11_Fig22_HTML.jpg](A978-1-4842-0529-7_11_Fig22_HTML.jpg)


    Figure 11-22.


    Map showing accesses by OS in the United States


    A similar display for Europe is shown in Figure [11-23](#A978-1-4842-0529-7_11_Chapter.html#Fig23).


    ![A978-1-4842-0529-7_11_Fig23_HTML.jpg](A978-1-4842-0529-7_11_Fig23_HTML.jpg)


    Figure 11-23.


    Map showing access by OS in Europe


    If you are finished with the HDInsight cluster you just created, delete it, so
    that you will not be charged for it.


    ## Summary


    This chapter has just scratched the surface of the power of creating and accessing
    Hadoop clusters in Azure and moving the data into Excel and Power Query for analysis
    using Pivot Tables and Power Map to provide a graphic display of the data broken
    out by OS.'
