- fmt: '### Enabling the Excel Analysis ToolPak


    Before use, it must be activated.


    To enable the Excel Analysis ToolPak, follow these steps:


    1. Click the `File` tab to see the Backstage View.

    2. Click `Options` at the bottom of the left pane.

    3. Select `Add-Ins` on the left pane.

    4. At the bottom of the window, select `Excel Add-Ins` and click `Go`, as shown
    in Figure [10-7](#A978-1-4842-0529-7_10_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_10_Fig7_HTML.jpg](A978-1-4842-0529-7_10_Fig7_HTML.jpg)

    *Figure 10-7. Excel Add-Ins screen*


    5. Select `Analysis TookPak`, as shown in Figure [10-8](#A978-1-4842-0529-7_10_Chapter.html#Fig8),
    and click `OK`.


    ![A978-1-4842-0529-7_10_Fig8_HTML.jpg](A978-1-4842-0529-7_10_Fig8_HTML.jpg)

    *Figure 10-8. Add-Ins pop-up*


    After activation, the Analysis ToolPak can now be accessed by clicking `Data Analysis`
    on the right side of the `Data` tab in Excel.


    ### A Simple Example


    The following example will show how to use the Excel Analysis ToolPak to analyze
    some sample test scores.


    **Exercise 10-1. Using the Analysis Toolpak**


    Follow these steps to analyze the test score:


    1. Click `Data Analysis` on the right side of the `Data` tab. When the `Data Analysis`
    window appears, select `Descriptive Statistics`, as shown in Figure [10-9](#A978-1-4842-0529-7_10_Chapter.html#Fig9).


    ![A978-1-4842-0529-7_10_Fig9_HTML.jpg](A978-1-4842-0529-7_10_Fig9_HTML.jpg)

    *Figure 10-9. Data Analysis tools*


    2. Click `OK`. In the `Descriptive Statistics` dialog box, specify the input range
    and the output range and select `summary statistics`, as shown in Figure [10-10](#A978-1-4842-0529-7_10_Chapter.html#Fig10),
    and click `OK`.


    ![A978-1-4842-0529-7_10_Fig10_HTML.jpg](A978-1-4842-0529-7_10_Fig10_HTML.jpg)

    *Figure 10-10. Descriptive Statistics dialog*


    The results are shown in Figure [10-11](#A978-1-4842-0529-7_10_Chapter.html#Fig11).


    ![A978-1-4842-0529-7_10_Fig11_HTML.jpg](A978-1-4842-0529-7_10_Fig11_HTML.jpg)

    *Figure 10-11. Descriptive Statistics output*


    3. To plot a histogram using the Data Analysis ToolPak, go to the `Data` tab and
    click `Data Analytics`. Select `Histogram`, as shown in Figure [10-12](#A978-1-4842-0529-7_10_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_10_Fig12_HTML.jpg](A978-1-4842-0529-7_10_Fig12_HTML.jpg)

    *Figure 10-12. Selecting Histogram from the Data Analysis dialog*


    4. Define the range and select `chart output`, as shown in Figure [10-13](#A978-1-4842-0529-7_10_Chapter.html#Fig13),
    and click `OK`.


    ![A978-1-4842-0529-7_10_Fig13_HTML.jpg](A978-1-4842-0529-7_10_Fig13_HTML.jpg)

    *Figure 10-13. Histogram dialog*


    The results are shown in Figure [10-14](#A978-1-4842-0529-7_10_Chapter.html#Fig14).
    This operation sets up bins, or categories, for classifying the data, which are
    used for plotting the histogram.


    ![A978-1-4842-0529-7_10_Fig14_HTML.jpg](A978-1-4842-0529-7_10_Fig14_HTML.jpg)

    *Figure 10-14. Histogram plot*


    ### Other Analysis ToolPak Functions


    The Analysis ToolPak includes other functions. Some of the most useful ones are
    listed following:


    - The `Anova` tools provide different types of variance analysis. They test the
    randomness of the selection of two samples.

    - The correlation coefficient is a value between -1 and +1 that measures how strongly
    two variables are related to each other. A +1 indicates a perfect positive correlation,
    meaning that the two variables move together. A -1 indicates a perfect negative
    correlation, meaning that the two variables move in opposition to each other.
    A positive correlation does not prove cause and effect. The Excel `CORREL` function
    can also be used to calculate correlation.

    - Covariance is a measure of how much two random variables change together.

    - Exponential smoothing is like a moving average used to forecast the next value
    in a time series.


    ## Using a Pivot Table to Create a Histogram


    A Pivot Table can also be used to create a more customized histogram.


    **Exercise 10-2. A Customized Test Score Histogram Example**


    Create a histogram that shows test score distributions by following these steps:


    1. Highlight the data to be plotted. Select the `Insert` tab and click `PivotTable`.

    2. Confirm the range and put the Pivot Table in the same worksheet with the location
    of `F3`, as shown in Figure [10-15](#A978-1-4842-0529-7_10_Chapter.html#Fig15).


    ![A978-1-4842-0529-7_10_Fig15_HTML.jpg](A978-1-4842-0529-7_10_Fig15_HTML.jpg)

    *Figure 10-15. Create PivotTable dialog*


    3. Drag `scores` to the `Rows` box, as shown in Figure [10-16](#A978-1-4842-0529-7_10_Chapter.html#Fig16).


    ![A978-1-4842-0529-7_10_Fig16_HTML.jpg](A978-1-4842-0529-7_10_Fig16_HTML.jpg)

    *Figure 10-16. Test scores as rows*


