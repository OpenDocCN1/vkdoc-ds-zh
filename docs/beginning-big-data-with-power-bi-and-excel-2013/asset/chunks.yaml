    *图 10-16. 成绩作为行*


    4. 右键单击数据透视表列，然后选择 `分组`，如图 10-17 所示。


    ![A978-1-4842-0529-7_10_Fig17_HTML.jpg](img/A978-1-4842-0529-7_10_Fig17_HTML.jpg)

    *图 10-17. 从上下文菜单中选择分组*


    5. 默认情况下，`分组` 对话框将起始值设为最低分，终止值设为最高分，默认间隔为 10，如图 10-18 所示。单击 `确定`。


    ![A978-1-4842-0529-7_10_Fig18_HTML.jpg](img/A978-1-4842-0529-7_10_Fig18_HTML.jpg)

