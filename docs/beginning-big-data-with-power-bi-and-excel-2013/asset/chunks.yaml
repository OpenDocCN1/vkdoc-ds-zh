    ### Other Analysis ToolPak Functions


    The Analysis ToolPak includes other functions. Some of the most useful ones are
    listed following:


    *   The Anova tools provide different types of variance analysis. They test the
    randomness of the selection of two samples.

    *   The correlation coefficient is a value between -1 and +1 that measures how
    strongly two variables are related to each other. A +1 indicates a perfect positive
    correlation, meaning that the two variables move together. A -1 indicates a perfect
    negative correlation, meaning that the two variables move in opposition to each
    other. A positive correlation does not prove cause and effect. The Excel `CORREL`
    function can also be used to calculate correlation.

    *   Covariance is a measure of how much two random variables change together.

    *   Exponential smoothing is like a moving average used to forecast the next value
    in a time series.


