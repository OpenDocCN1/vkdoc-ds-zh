  trans: '# 按员工生成订单总金额报告


    在此示例中，将生成一份按员工统计的订单总金额报告。要创建此报告，需要链接三个表：`employees`、`orders`和`order details`。


    对于此示例，请按照“导入外部数据库”部分中前一个示例的步骤 1-6 操作。


    输入以下 SQL 语句，如图 5-12 所示，以提取按员工细分的所有订单中单价乘以数量的总和。点击`Validate`确保 SQL 语句输入正确。


    ![A978-1-4842-0529-7_5_Fig12_HTML.jpg](img/A978-1-4842-0529-7_5_Fig12_HTML.jpg)


    图 5-12.


    SQL 查询语句 `Select employees.[last name], sum([order details].[unit price] * [order
    details].quantity) from employees, orders, [order details] where employees.id=orders.[employee
    id] and orders.[order id]=[order details].[order id] group by employees.[last
    name]`


    请注意，基于图 5-3 所示的关系，使用了两个关系来链接三个表。`orders`表中没有显示任何字段，但该表被用作链接表。以下是此示例中使用的图 5-3 中的关系：


    - `employees.id=orders.[employee id]`

    - `orders.[order id]=[order details].[order id]`


    点击`Finish`执行 SQL 语句。生成的实际数据如图 5-14 所示——按员工列出的订单价值。


    ![A978-1-4842-0529-7_5_Fig14_HTML.jpg](img/A978-1-4842-0529-7_5_Fig14_HTML.jpg)


    图 5-14.


    按员工统计的订单总价值


    该查询生成了八行数据，如图 5-13 所示。


    ![A978-1-4842-0529-7_5_Fig13_HTML.jpg](img/A978-1-4842-0529-7_5_Fig13_HTML.jpg)


    图 5-13.


    成功屏幕显示该查询生成的八行数据


    ## 使用 MSQuery


    另一种选择是使用带有 Microsoft Query 的 SQL。此示例将展示访问本章前面使用的`Northwind`数据库的另一种方法。请按照以下步骤操作：


    要输入 SQL 查询，请点击菜单栏下方的`SQL`按钮，并输入 SQL 查询，如图 5-20 所示。


    ![A978-1-4842-0529-7_5_Fig20_HTML.jpg](img/A978-1-4842-0529-7_5_Fig20_HTML.jpg)


    图 5-20.


    显示 SQL 查询的查询界面 `Select sum([order details].[unit price] *[order details].quantity)
    from orders,[order details]`


    点击`Close`并展开显示表格的窗口，以查看已定义的关系，如图 5-19 所示。


    ![A978-1-4842-0529-7_5_Fig19_HTML.jpg](img/A978-1-4842-0529-7_5_Fig19_HTML.jpg)


    图 5-19.


    显示表格和关系的查询界面


    使用`Add Tables`窗口，通过双击每个表格来添加`employees`、`orders`和`order detail`表，如图 5-18 所示。


    ![A978-1-4842-0529-7_5_Fig18_HTML.jpg](img/A978-1-4842-0529-7_5_Fig18_HTML.jpg)


    图 5-18.


    用于添加表格的 Microsoft Query 窗口


    选择之前下载的`Database2`，如图 5-17 所示，然后点击`OK`。


    ![A978-1-4842-0529-7_5_Fig17_HTML.jpg](img/A978-1-4842-0529-7_5_Fig17_HTML.jpg)


    图 5-17.


    选择数据库窗口


    在`Choose Data Source`窗口中选择`MS Access Database`，如图 5-16 所示。取消勾选窗口底部的“使用查询向导创建/编辑查询”。然后点击`OK`。


    ![A978-1-4842-0529-7_5_Fig16_HTML.jpg](img/A978-1-4842-0529-7_5_Fig16_HTML.jpg)


    图 5-16.


    选择数据源窗口


    点击`Data`选项卡查看功能区，然后点击“从其他来源”。接着点击菜单中的最后一项“来自 Microsoft Query”，如图 5-15 所示。


    ![A978-1-4842-0529-7_5_Fig15_HTML.jpg](img/A978-1-4842-0529-7_5_Fig15_HTML.jpg)


    图 5-15.


    显示如何访问 Microsoft Query 的屏幕


    对于“SQL 查询无法以图形方式表示。是否继续？”的提示，点击`OK`，如图 5-21 所示。


    ![A978-1-4842-0529-7_5_Fig21_HTML.jpg](img/A978-1-4842-0529-7_5_Fig21_HTML.jpg)


    图 5-21.


    Microsoft Query 弹出窗口


    单数字响应将显示出来，如图 5-22 所示。


    ![A978-1-4842-0529-7_5_Fig22_HTML.jpg](img/A978-1-4842-0529-7_5_Fig22_HTML.jpg)


    图 5-22.


    查询结果


    ## 总结


    本章展示了多种使用 SQL 与 Excel 和 PowerPivot 来从单个大表或一组表中汇总数据的方法。演示了如何根据指定条件连接表，以及如何使用聚合函数提取汇总统计信息。


    # 6. 使用 Power View 设计报表


    `Power View`是一种报表工具，可创建其自身类型的工作表。对于不精通 Excel 的用户而言，这是一种创建“沙盒”的方式，可以在不更改数据的情况下探索数据的子集。`Power
    View`通过创建包含基于 PowerPivot 模型或数据透视表的快速简便可视化效果的仪表板，让数据变得生动。可以基于同一数据创建多个`Power View`工作表。


    ## Power View 设计界面的元素


    `Power View`界面包含以下元素，如图 6-1 所示：


    - 左侧的设计图面

    - 中间的筛选器区域，可在此处根据字段值筛选数据

    - `Power View 字段`窗格，在此处选择要包含在报表中的字段。顶部包含所有可用字段，底部显示已选字段。


    ![A978-1-4842-0529-7_6_Fig1_HTML.jpg](img/A978-1-4842-0529-7_6_Fig1_HTML.jpg)


    图 6-1.


    Power View 设计图面


    ## 使用 Power View 时的注意事项


    始终从表格视图开始，然后基于该表格创建图表。可以向设计图面添加多个表格和/或图表。只需点击空白区域即可添加新图表。


    在设计图面上仅包含报表所需的字段。除非与报表相关，否则通常建议不要包含用于链接表的关键值。


    ## 字段类型


    通常有两种处理方式截然不同的字段类型：


    - 非数字的分类或描述性字段

    - 数字字段，可包含计算字段或度量值。求和符号用于指示可更改聚合类型的数字字段。


    ## 理解数据如何汇总


    使用`Power View`时，最棘手的部分可能就是理解数据如何汇总。默认情况下，数字字段会被求和，即使这些字段的求和没有意义（如 ID 号或年份）。可以通过点击`Power
    View 字段`窗格底部字段名称后的向下箭头轻松更改聚合类型。聚合选项如下：


    - 不汇总

    - 求和

    - 平均值

    - 最小值

    - 最大值

    - 计数(非空)

    - 计数(非重复)


    请注意，要将数据绘制到图表上，必须使用上述数学函数之一对字段进行汇总。'
- fmt: '# A Single Table Example


    This first example will show how to use Power View based on a single spreadsheet
    of the real GDP (gross domestic product) per capita data by state for each year
    from 1997 to 2011. The instructions to download this data from the Azure Marketplace
    were covered in [Chapter 3](#A978-1-4842-0529-7_3_Chapter.html). To create the
    Power View Query, perform the following steps:


    Open the GDP data from the Azure Spreadsheet, which is shown in Figure [6-2](#A978-1-4842-0529-7_6_Chapter.html#Fig2).


    ![A978-1-4842-0529-7_6_Fig2_HTML.jpg](A978-1-4842-0529-7_6_Fig2_HTML.jpg)


    Figure 6-2. Spreadsheet for real data by GDP per capita by state


    Click the `Insert` tab and select `Power View Reports`, then wait while the Power
    View screen loads, as shown in Figure [6-2](#A978-1-4842-0529-7_6_Chapter.html#Fig2).
    If prompted to install SilverLight, click `Yes`. Note the design surface on the
    left, the `Power View Fields` pane on the right, and the `Filters` pane in the
    middle.


    In the `Power View Fields` pane on the right side of the screen, click the right-facing
    triangle to the left of `RealGDPByStatePerCapita` to display the fields. Then
    drag the `year` field to the `Filters` pane, as shown in Figure [6-3](#A978-1-4842-0529-7_6_Chapter.html#Fig3).


    ![A978-1-4842-0529-7_6_Fig3_HTML.jpg](A978-1-4842-0529-7_6_Fig3_HTML.jpg)


    Figure 6-3. Setting a filter


    To display only the most recent year, 2011, click the leftmost icon to the right
    of `Year` in the `Filters` pane to activate the `List Filter Mode` to see the
    list of years and select `2011`, as shown in Figure [6-4](#A978-1-4842-0529-7_6_Chapter.html#Fig4).


    ![A978-1-4842-0529-7_6_Fig4_HTML.jpg](A978-1-4842-0529-7_6_Fig4_HTML.jpg)


    Figure 6-4. Setting a filter, expanded view


    Then, in the `Power View Fields` pane, click the box in front of `Area` and `RealGDPPerCapita`,
    and a table will be created, as shown in Figure [6-5](#A978-1-4842-0529-7_6_Chapter.html#Fig5).


    ![A978-1-4842-0529-7_6_Fig5_HTML.jpg](A978-1-4842-0529-7_6_Fig5_HTML.jpg)


    Figure 6-5. Table showing sum of real GDP per capita


    Note that by default, the sum of the `RealGDPPerCapita` is shown, which is meaningless.
    If you want to change that setting, at the bottom of the `Power View Fields` pane,
    click the down arrow after `RealGDPPerCapita` and select "Do Not Summarize." However,
    to plot the charts shown following, it is necessary to leave it set to `Sum`.
    The results are shown in Figure [6-6](#A978-1-4842-0529-7_6_Chapter.html#Fig6).
    Note the scrollbar to the right of the table, which allows scrolling through all
    the states. To expand the table, click it and drag the handles.


    ![A978-1-4842-0529-7_6_Fig6_HTML.jpg](A978-1-4842-0529-7_6_Fig6_HTML.jpg)


    Figure 6-6. Table showing real GDP per Capita by state


    A title can be added by clicking where it says to "Click here to add a title"
    and entering "Real GDP Per Capita by State for 2011," as shown in Figure [6-7](#A978-1-4842-0529-7_6_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_6_Fig7_HTML.jpg](A978-1-4842-0529-7_6_Fig7_HTML.jpg)


    Figure 6-7. Table with title added


    ## Viewing the Data in Different Ways


    Power View supports multiple formats for viewing data. With the `Design` tab selected,
    click the `Table` icon on the left to see the options: table, matrix, and card.
    The card view, which creates a card for each state, is shown in Figure [6-8](#A978-1-4842-0529-7_6_Chapter.html#Fig8).
    The matrix view is like a table but allows drilling down. It will be demonstrated
    in later examples. To go back to the table format, simply click `Table` under
    the `Table` icon.


    ![A978-1-4842-0529-7_6_Fig8_HTML.jpg](A978-1-4842-0529-7_6_Fig8_HTML.jpg)


    Figure 6-8. Card view


    ## Creating a Bar Chart for a Single Year


    To create a bar chart showing the real GDP per capita for each state, follow these
    steps:


    - Click anywhere in the table and select the `Design` tab.

    - Click `Bar Chart`.

    - Select `Clustered Bar`. Because there is a single data source, either clustered
    or stacked will show the same result.


    The results will appear as shown in Figure [6-9](#A978-1-4842-0529-7_6_Chapter.html#Fig9).
    A single bar for GDP per capita is shown for each state for the year 2011.


    ![A978-1-4842-0529-7_6_Fig9_HTML.jpg](A978-1-4842-0529-7_6_Fig9_HTML.jpg)


    Figure 6-9. Bar chart


    To resize the chart, click it and drag the handles.


    Note that you can hover the mouse over any bar in the chart to see the GDP per
    capita value for that state.


    ## Column Chart


    A column chart is a bar chart flipped on its side, as shown in Figure [6-10](#A978-1-4842-0529-7_6_Chapter.html#Fig10).


    ![A978-1-4842-0529-7_6_Fig10_HTML.jpg](A978-1-4842-0529-7_6_Fig10_HTML.jpg)


    Figure 6-10. Column chart


    ## Displaying Multiple Years


    If the filter is changed to include multiple years, by clicking the `All` box
    at the top of the `Years` list in the `Filters` pane, an instance of the state
    for each year will be generated in the table, as shown in Figure [6-11](#A978-1-4842-0529-7_6_Chapter.html#Fig11).
    It is also necessary to click `Year` in the `Power View Fields` list pane, so
    that the year is displayed.


    ![A978-1-4842-0529-7_6_Fig11_HTML.jpg](A978-1-4842-0529-7_6_Fig11_HTML.jpg)


    Figure 6-11. Table for real GDP per capita for multiple years


    If the view is changed to matrix, then it appears as shown in Figure [6-12](#A978-1-4842-0529-7_6_Chapter.html#Fig12).
    Note that it is necessary to tell it not to sum the years, by clicking the arrow
    after `Year` in the `Fields` section of the `Power View Fields` pane and selecting
    "Do not summarize."


    ![A978-1-4842-0529-7_6_Fig12_HTML.jpg](A978-1-4842-0529-7_6_Fig12_HTML.jpg)


    Figure 6-12. Matrix view of GDP per capita for multiple years


    ## Adding a Map


    To display the data using a map, follow these steps:


    - Click the table to activate the `Design` tab.

    - Click the `Map` icon. If a map of the world is displayed, use the `Zoom` and
    `Pan` icons at the upper right to display only the desired area of the map, as
    shown in Figure [6-13](#A978-1-4842-0529-7_6_Chapter.html#Fig13). Hover the mouse
    over a bubble to see the actual number associated with it.


    ![A978-1-4842-0529-7_6_Fig13_HTML.jpg](A978-1-4842-0529-7_6_Fig13_HTML.jpg)


    Figure 6-13. Map view showing GDP per capita by state


    Note that bubbles are displayed for each state proportional to the GDP per capita
    for that state. In the `Filters` pane, individual or multiple years can be selected
    to see the data for those years.


    ## Using Tiles


    Another way of viewing the data is by using tiles. Simply select a table and click
    the `Tiles` icon on the `Design` toolbar to see a display, as shown in Figure
    [6-14](#A978-1-4842-0529-7_6_Chapter.html#Fig14). The default layout has a tab
    strip at the top of the display that allows clicking each state to see the values
    for that state.


    ![A978-1-4842-0529-7_6_Fig14_HTML.jpg](A978-1-4842-0529-7_6_Fig14_HTML.jpg)


    Figure 6-14. Tile format


    An alternative is the tile flow format with the tiles at the bottom as shown in
    Figure [6-15](#A978-1-4842-0529-7_6_Chapter.html#Fig15). These views can be toggled
    by clicking on the `Tile Type` icon on the `Design` toolbar.


    ![A978-1-4842-0529-7_6_Fig15_HTML.jpg](A978-1-4842-0529-7_6_Fig15_HTML.jpg)


    Figure 6-15. Tile Flow format'
  raw: '## A Single Table Example


    This first example will show how to use Power View based on a single spreadsheet
    of the real GDP (gross domestic product) per capita data by state for each year
    from 1997 to 2011\. The instructions to download this data from the Azure Marketplace
    were covered in [Chapter 3](#A978-1-4842-0529-7_3_Chapter.html). To create the
    Power View Query, perform the following steps:


    Open the GDP data from the Azure Spreadsheet, which is shown in Figure [6-2](#A978-1-4842-0529-7_6_Chapter.html#Fig2).


    ![A978-1-4842-0529-7_6_Fig2_HTML.jpg](A978-1-4842-0529-7_6_Fig2_HTML.jpg)


    Figure 6-2.


    Spreadsheet for real data by GDP per capita by state  Click the Insert tab and
    select Power View Reports, then wait while the Power View screen loads, as shown
    in Figure [6-2](#A978-1-4842-0529-7_6_Chapter.html#Fig2). If prompted to install
    SilverLight, click Yes. Note the design surface on the left, the Power View Fields
    pane on the right, and the Filters pane in the middle.   In the Power View Fields
    pane on the right side of the screen, click the right-facing triangle to the left
    of RealGDPByStatePerCapita to display the fields. Then drag the year field to
    the Filters pane, as shown in Figure [6-3](#A978-1-4842-0529-7_6_Chapter.html#Fig3).


    ![A978-1-4842-0529-7_6_Fig3_HTML.jpg](A978-1-4842-0529-7_6_Fig3_HTML.jpg)


    Figure 6-3.


    Setting a filter  To display only the most recent year, 2011, click the leftmost
    icon to the right of Year in the Filters pane to activate the List Filter Mode
    to see the list of years and select 2011, as shown in Figure [6-4](#A978-1-4842-0529-7_6_Chapter.html#Fig4).


    ![A978-1-4842-0529-7_6_Fig4_HTML.jpg](A978-1-4842-0529-7_6_Fig4_HTML.jpg)


    Figure 6-4.


    Setting a filter, expanded view  Then, in the Power View Fields pane, click the
    box in front of Area and RealGDPPerCapita, and a table will be created, as shown
    in Figure [6-5](#A978-1-4842-0529-7_6_Chapter.html#Fig5).


    ![A978-1-4842-0529-7_6_Fig5_HTML.jpg](A978-1-4842-0529-7_6_Fig5_HTML.jpg)


    Figure 6-5.


    Table showing sum of real GDP per capita  Note that by default, the sum of the
    RealGDPPerCapita is shown, which is meaningless. If you want to change that setting,
    at the bottom of the Power View Fields pane, click the down arrow after RealGDPPerCapita
    and select “Do Not Summarize.” However, to plot the charts shown following, it
    is necessary to leave it set to Sum. The results are shown in Figure [6-6](#A978-1-4842-0529-7_6_Chapter.html#Fig6).
    Note the scrollbar to the right of the table, which allows scrolling through all
    the states. To expand the table, click it and drag the handles.


    ![A978-1-4842-0529-7_6_Fig6_HTML.jpg](A978-1-4842-0529-7_6_Fig6_HTML.jpg)


    Figure 6-6.


    Table showing real GDP per Capita by state  A title can be added by clicking where
    it says to “Click here to add a title” and entering “Real GDP Per Capita by State
    for 2011,” as shown in Figure [6-7](#A978-1-4842-0529-7_6_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_6_Fig7_HTML.jpg](A978-1-4842-0529-7_6_Fig7_HTML.jpg)


    Figure 6-7.


    Table with title added


    ## Viewing the Data in Different Ways


    Power View supports multiple formats for viewing data. With the Design tab selected,
    click the Table icon on the left to see the options: table, matrix, and card.
    The card view, which creates a card for each state, is shown in Figure [6-8](#A978-1-4842-0529-7_6_Chapter.html#Fig8).
    The matrix view is like a table but allows drilling down. It will be demonstrated
    in later examples. To go back to the table format, simply click Table under the
    Table icon.


    ![A978-1-4842-0529-7_6_Fig8_HTML.jpg](A978-1-4842-0529-7_6_Fig8_HTML.jpg)


    Figure 6-8.


    Card view


    ## Creating a Bar Chart for a Single Year


    To create a bar chart showing the real GDP per capita for each state, follow these
    steps:


    Click anywhere in the table and select the Design tab. Click Bar Chart. Select
    Clustered Bar. Because there is a single data source, either clustered or stacked
    will show the same result.   The results will appear as shown in Figure [6-9](#A978-1-4842-0529-7_6_Chapter.html#Fig9).
    A single bar for GDP per capita is shown for each state for the year 2011.


    ![A978-1-4842-0529-7_6_Fig9_HTML.jpg](A978-1-4842-0529-7_6_Fig9_HTML.jpg)


    Figure 6-9.


    Bar chart   To resize the chart, click it and drag the handles.  


    Note that you can hover the mouse over any bar in the chart to see the GDP per
    capita value for that state.


    ## Column Chart


    A column chart is a bar chart flipped on its side, as shown in Figure [6-10](#A978-1-4842-0529-7_6_Chapter.html#Fig10).


    ![A978-1-4842-0529-7_6_Fig10_HTML.jpg](A978-1-4842-0529-7_6_Fig10_HTML.jpg)


    Figure 6-10.


    Column chart


    ## Displaying Multiple Years


    If the filter is changed to include multiple years, by clicking the All box at
    the top of the Years list in the Filters pane, an instance of the state for each
    year will be generated in the table, as shown in Figure [6-11](#A978-1-4842-0529-7_6_Chapter.html#Fig11).
    It is also necessary to click Year in the Power View Fields list pane, so that
    the year is displayed.


    ![A978-1-4842-0529-7_6_Fig11_HTML.jpg](A978-1-4842-0529-7_6_Fig11_HTML.jpg)


    Figure 6-11.


    Table for real GDP per capita for multiple years


    If the view is changed to matrix, then it appears as shown in Figure [6-12](#A978-1-4842-0529-7_6_Chapter.html#Fig12).
    Note that it is necessary to tell it not to sum the years, by clicking the arrow
    after Year in the Fields section of the Power View Fields pane and selecting “Do
    not summarize.”


    ![A978-1-4842-0529-7_6_Fig12_HTML.jpg](A978-1-4842-0529-7_6_Fig12_HTML.jpg)


    Figure 6-12.


    Matrix view of GDP per capita for multiple years


    ## Adding a Map


    To display the data using a map, follow these steps:


    Click the table to activate the Design tab.   Click the Map icon. If a map of
    the world is displayed, use the Zoom and Pan icons at the upper right to display
    only the desired area of the map, as shown in Figure [6-13](#A978-1-4842-0529-7_6_Chapter.html#Fig13).
    Hover the mouse over a bubble to see the actual number associated with it.


    ![A978-1-4842-0529-7_6_Fig13_HTML.jpg](A978-1-4842-0529-7_6_Fig13_HTML.jpg)


    Figure 6-13.


    Map view showing GDP per capita by state  


    Note that bubbles are displayed for each state proportional to the GDP per capita
    for that state. In the Filters pane, individual or multiple years can be selected
    to see the data for those years.


    ## Using Tiles


    Another way of viewing the data is by using tiles. Simply select a table and click
    the Tiles icon on the Design toolbar to see a display, as shown in Figure [6-14](#A978-1-4842-0529-7_6_Chapter.html#Fig14).
    The default layout has a tab strip at the top of the display that allows clicking
    each state to see the values for that state.


    ![A978-1-4842-0529-7_6_Fig14_HTML.jpg](A978-1-4842-0529-7_6_Fig14_HTML.jpg)


    Figure 6-14.


    Tile format


    An alternative is the tile flow format with the tiles at the bottom as shown in
    Figure [6-15](#A978-1-4842-0529-7_6_Chapter.html#Fig15). These views can be toggled
    by clicking on the Tile Type icon on the Design toolbar.


    ![A978-1-4842-0529-7_6_Fig15_HTML.jpg](A978-1-4842-0529-7_6_Fig15_HTML.jpg)


    Figure 6-15.


    Tile Flow format'
  trans: '

    # 单个表格示例


    第一个示例将演示如何基于包含 1997 年至 2011 年各州实际人均 GDP（国内生产总值）数据的单个电子表格使用 Power View。从 Azure
    市场下载该数据的说明已在第 3 章中介绍。要创建 Power View 查询，请执行以下步骤：


    打开来自 Azure 电子表格的 GDP 数据，如图 6-2 所示。


    ![A978-1-4842-0529-7_6_Fig2_HTML.jpg](img/A978-1-4842-0529-7_6_Fig2_HTML.jpg)


    图 6-2. 各州实际人均 GDP 数据电子表格


    点击`插入`选项卡，选择`Power View 报表`，然后等待 Power View 屏幕加载，如图 6-2 所示。如果提示安装 SilverLight，请点击`是`。注意左侧的设计面板、右侧的`Power
    View 字段`窗格以及中间的`筛选器`窗格。


    在屏幕右侧的`Power View 字段`窗格中，点击`按州人均实际 GDP`左侧的右向三角形以展开字段。然后将`年份`字段拖拽到`筛选器`窗格中，如图 6-3
    所示。


    ![A978-1-4842-0529-7_6_Fig3_HTML.jpg](img/A978-1-4842-0529-7_6_Fig3_HTML.jpg)


    图 6-3. 设置筛选器


    为了仅显示最近一年，即 2011 年，请在`筛选器`窗格中点击`年份`右侧最左边的图标，激活`列表筛选模式`以查看年份列表，并选择`2011`，如图 6-4
    所示。


    ![A978-1-4842-0529-7_6_Fig4_HTML.jpg](img/A978-1-4842-0529-7_6_Fig4_HTML.jpg)


    图 6-4. 设置筛选器（展开视图）


    然后，在`Power View 字段`窗格中，勾选`地区`和`人均实际 GDP`前的复选框，将创建一个表格，如图 6-5 所示。


    ![A978-1-4842-0529-7_6_Fig5_HTML.jpg](img/A978-1-4842-0529-7_6_Fig5_HTML.jpg)


    图 6-5. 显示人均实际 GDP 总和的表格


    请注意，默认情况下显示的是`人均实际 GDP`的总和，这没有实际意义。如果您想更改此设置，请在`Power View 字段`窗格底部，点击`人均实际 GDP`后的下拉箭头，然后选择“不汇总”。然而，为了绘制后续的图表，必须将其保留为`总和`设置。结果如图
    6-6 所示。请注意表格右侧的滚动条，它可以滚动浏览所有州。要展开表格，请点击它并拖拽控制手柄。


    ![A978-1-4842-0529-7_6_Fig6_HTML.jpg](img/A978-1-4842-0529-7_6_Fig6_HTML.jpg)


    图 6-6. 按州显示人均实际 GDP 的表格


    可以通过点击显示“点击此处添加标题”的位置并输入“2011 年各州人均实际 GDP”来添加标题，如图 6-7 所示。


    ![A978-1-4842-0529-7_6_Fig7_HTML.jpg](img/A978-1-4842-0529-7_6_Fig7_HTML.jpg)


    图 6-7. 已添加标题的表格


    ## 以不同方式查看数据


    Power View 支持多种数据查看格式。选中`设计`选项卡后，点击左侧的`表格`图标即可查看选项：表格、矩阵和卡片。卡片视图会为每个州创建一张卡片，如图
    6-8 所示。矩阵视图与表格类似，但支持向下钻取。这将在后续示例中演示。要返回表格格式，只需点击`表格`图标下的`表格`即可。


    ![A978-1-4842-0529-7_6_Fig8_HTML.jpg](img/A978-1-4842-0529-7_6_Fig8_HTML.jpg)


    图 6-8. 卡片视图


    ## 创建单一年份的条形图


    要创建显示各州人均实际 GDP 的条形图，请按照以下步骤操作：


    -   点击表格中的任意位置，然后选择`设计`选项卡。

    -   点击`条形图`。

    -   选择`簇状条形图`。由于只有一个数据源，簇状或堆积条形图会显示相同的结果。


    结果将如图 6-9 所示。2011 年每个州的人均 GDP 显示为单个条形。


    ![A978-1-4842-0529-7_6_Fig9_HTML.jpg](img/A978-1-4842-0529-7_6_Fig9_HTML.jpg)


    图 6-9. 条形图


    要调整图表大小，请点击它并拖拽控制手柄。


    请注意，您可以将鼠标悬停在图表中的任何条形上，查看该州的人均 GDP 数值。


    ## 柱形图


    柱形图是条形图旋转 90 度后的形式，如图 6-10 所示。


    ![A978-1-4842-0529-7_6_Fig10_HTML.jpg](img/A978-1-4842-0529-7_6_Fig10_HTML.jpg)


    图 6-10. 柱形图


    ## 显示多个年份


    如果更改筛选器以包含多个年份，方法是点击`筛选器`窗格中`年份`列表顶部的`全选`框，则表格中会为每个年份生成一个州实例，如图 6-11 所示。同时还需要在`Power
    View 字段`列表窗格中勾选`年份`，以便显示年份信息。


    ![A978-1-4842-0529-7_6_Fig11_HTML.jpg](img/A978-1-4842-0529-7_6_Fig11_HTML.jpg)


    图 6-11. 多个年份的人均实际 GDP 表格


    如果将视图切换为矩阵，其显示效果则如图 6-12 所示。请注意，需要通过在`Power View 字段`窗格的`字段`部分中点击`年份`后的箭头并选择“不汇总”，来告知系统不要对年份进行求和。


    ![A978-1-4842-0529-7_6_Fig12_HTML.jpg](img/A978-1-4842-0529-7_6_Fig12_HTML.jpg)


    图 6-12. 多个年份 GDP 人均的矩阵视图


    ## 添加地图


    要使用地图显示数据，请按照以下步骤操作：


    -   点击表格以激活`设计`选项卡。

    -   点击`地图`图标。如果显示的是世界地图，请使用右上角的`缩放`和`平移`图标来仅显示地图的所需区域，如图 6-13 所示。将鼠标悬停在一个气泡上，即可查看其关联的实际数值。


    ![A978-1-4842-0529-7_6_Fig13_HTML.jpg](img/A978-1-4842-0529-7_6_Fig13_HTML.jpg)


    图 6-13. 显示各州人均 GDP 的地图视图


    请注意，为每个州显示的气泡大小与该州的人均 GDP 成正比。在`筛选器`窗格中，可以选择单个或多个年份来查看这些年份的数据。


    ## 使用磁贴


    查看数据的另一种方式是使用磁贴。只需选择一个表格，然后点击`设计`工具栏上的`磁贴`图标，即可看到如图 6-14 所示的显示效果。默认布局在显示顶部有一个标签条，允许点击每个州来查看该州的数值。


    ![A978-1-4842-0529-7_6_Fig14_HTML.jpg](img/A978-1-4842-0529-7_6_Fig14_HTML.jpg)


    图 6-14. 磁贴格式


    另一种选择是磁贴流格式，其磁贴在底部显示，如图 6-15 所示。可以通过点击`设计`工具栏上的`磁贴类型`图标在这些视图之间切换。


    ![A978-1-4842-0529-7_6_Fig15_HTML.jpg](img/A978-1-4842-0529-7_6_Fig15_HTML.jpg)


    图 6-15. 磁贴流格式

    '
- fmt: "# Relational Example\n\nFor this example, Access `database2` (the Northwind\
    \ Database) will be used. Some of the imported tables are shown in Figure 6-16.\
    \ This database can be downloaded from the Apress web site.\n\n![A978-1-4842-0529-7_6_Fig16_HTML.jpg](A978-1-4842-0529-7_6_Fig16_HTML.jpg)\n\
    \n*Figure 6-16. Northwind tables*\n\nFollow the steps described in Chapter 4 to\
    \ import Access data.\n\nClick the `PowerPivot` tab to open the ribbon. Click\
    \ the `Manage` button at the top-left end of the ribbon. Once the `PowerPivot`\
    \ window is open, you can load data by clicking `From Database` in the `Get External\
    \ Data` group. This provides a choice of database sources. For this example, `From\
    \ Access` will be selected. In the `Table Import Wizard` dialog, click the `Browse`\
    \ button to find the Access file you want to import. For this example, use `Database2.accdb`.\
    \ This file is available from the Apress web site. Click `Test Connection`. If\
    \ the test is successful, click `Next`. \n\n`PowerPivot` opens the `Table Import\
    \ Wizard` to take you through the process of loading data. Choose `Select from\
    \ a list of tables and views` to choose the data you want to import. Click `Next`.\
    \ Click the top-left box to select all tables. Note that in the lower right corner\
    \ of the dialog, there is an option to `Preview & Filter`. This option can be\
    \ used to select a subset of data from very large datasets. In this example, all\
    \ rows in all tables will be imported. Then click `Finish` to complete the import.\
    \ The tables imported are shown in Figure 6-16.\n\nThe relationships between the\
    \ tables are shown in Figure 6-17.\n\n![A978-1-4842-0529-7_6_Fig17_HTML.jpg](A978-1-4842-0529-7_6_Fig17_HTML.jpg)\n\
    \n*Figure 6-17. Diagram view*\n\nThis example will use the relation between `customer\
    \ ID` in the `orders` table and the `ID` field in the `customers` table.\n\nAnother\
    \ view of the relationships is shown in Figure 6-18, which is accessed by clicking\
    \ the `Relationships` icon on the `Data` tab.\n\n![A978-1-4842-0529-7_6_Fig18_HTML.jpg](A978-1-4842-0529-7_6_Fig18_HTML.jpg)\n\
    \n*Figure 6-18. Relationships*\n\nTo create a Power View report, follow these\
    \ steps:\n\nClick `Power View Reports` on the Excel `Insert` tab. First create\
    \ a table by selecting fields from the `Power View Fields` tab on the right side\
    \ of the screen. From the `customers` table, select the `company`, `first name`,\
