    # 从电子表格到数据库


    第一款电子表格程序`VisiCalc`（“可视计算器”的缩写）于 1979 年为苹果 II 型电脑发布。它是第一款“杀手级应用”。当时有种说法是“`VisiCalc`卖出的苹果电脑比苹果公司自己卖的还多”。`VisiCalc`由丹·布里克林和鲍勃·弗兰克斯顿开发。当时布里克林正在哈佛商学院就读，当他看到一位教授手动编写财务模型时，便萌生了开发该程序的想法。每当教授想要修改数据，就得擦掉旧数据重新写。布里克林意识到，这个过程可以通过在个人电脑上运行电子表格来自动化完成。


    在那个年代，大多数会计数据都困在需要程序员才能修改或访问的大型主机程序中。因此，程序员被称为计算机领域的“大祭司”，这意味着最终用户几乎无法控制程序的工作方式。对于当时来说，`VisiCalc`非常易于使用。但与今天的电子表格相比，它也非常原始。例如，在`VisiCalc`的早期版本中，所有列宽都必须相同。


    成功会招致竞争。`VisiCalc`无法在当时的商用计算机——CP/M 电脑上运行。CP/M 最初是 Control Program/Monitor（控制程序/监控器）的缩写，后来演变为“Control
    Program for Microcomputers”（微型计算机控制程序），是 20 世纪 70 年代末 80 年代初使用的一种操作系统。1980 年，Sorcim
    推出了`SuperCalc`，作为 CP/M 电脑的电子表格程序。微软于 1982 年发布了`Multiplan`。当时所有的电子表格程序都是菜单驱动的。


    1981 年 8 月，IBM PC 的发布向其他大公司传递了一个信号：个人电脑是处理大型业务的重要工具。`VisiCalc`被移植到 IBM PC 上运行，但并未充分利用新电脑增强的硬件功能。


    企业家米奇·卡普尔（`VisiCalc`开发者的朋友）看到了机会，创立了莲花发展公司（Lotus Development），专门为 IBM PC 编写电子表格程序。他将自己的电子表格程序命名为`Lotus
    1-2-3`。`1-2-3`这个名称表明，它在原始电子表格功能的基础上，增加了创建图表和执行简单排序等有限数据库功能的能力。


    `Lotus 1-2-3`是第一款通过电视广告推广的软件程序。它与 IBM PC 相辅相成，变得广受欢迎，并在整个 20 世纪 90 年代初期一直处于领先地位。


    微软的`Excel`是第一款使用图形用户界面的电子表格程序，该界面因苹果麦金塔电脑而普及。`Excel`于 1987 年在麦金塔电脑上发布，后来移植到了 Windows
    系统。20 世纪 90 年代初，随着 Windows 的普及，微软将 Word 和`Excel`打包成 Microsoft Office，并采取了激进的定价策略。结果，`Excel`取代了`Lotus
    1-2-3`，成为领先的电子表格程序。如今，`Excel`是全球使用最广泛的电子表格程序。


    越来越多的分析功能（如数据透视表）被逐步引入`Excel`，可处理的最大行数也得到了增加。利用`VLOOKUP`，可以在表格之间建立简单的关联。对于`Excel
    2010`，微软推出了可单独下载的`PowerPivot`，它允许基于多个表构建数据模型。`PowerPivot`随`Excel 2013`一起提供。第 4
    章将讨论如何使用`PowerPivot`构建数据模型。


    ## 解读文件扩展名


    文件扩展名指示了文件中存储的数据类型。本章将展示如何将多种格式的数据导入到 Excel 的原生`.xlsx`格式中，这是在后续章节中使用 Power BI
    高级功能所必需的。本章将处理具有以下扩展名的文件：


    - `.xls`：Excel 2007 之前的 Excel 工作簿

    - `.xlsx`：Excel 2007 及更高版本的 Excel 工作簿；添加的第二个 x 表示数据以 XML 格式存储

    - `.xlsm`：包含宏的 Excel 工作簿

    - `.xltm`：Excel 工作簿模板

    - `.txt`：包含文本的文件

    - `.xml`：XML 格式的文本文件


    ## 将 Excel 用作数据库


    默认情况下，Excel 使用由行和列组成的表格。每一行是一条记录，包含单个项目的所有属性。每一列是一个字段或属性。


    表格应在第一行显示字段名称，并且其周围应有空白区域——每侧有一个空白列，上下各有一个空白行，除非第一行就是第 1 行或第一列就是 A 列。单击表格中的任意位置，然后按`Ctrl`
    + `T`将其定义为表格，如图 2-1 所示。请注意每列顶部带有箭头的标题。单击箭头会弹出一个菜单，提供排序和筛选选项。


    ![A978-1-4842-0529-7_2_Fig1_HTML.jpg](img/A978-1-4842-0529-7_2_Fig1_HTML.jpg)


    图 2-1.


    一个 Excel 表格


    请注意，使用当前版本的 Excel 时，如果对某个字段进行排序，它会智能地同时移动相关字段（只要区域内没有空白列），如图 2-2 所示，这里按姓氏进行了排序。要按名和姓排序，可以先按名排序，再按姓排序。


    ![A978-1-4842-0529-7_2_Fig2_HTML.jpg](img/A978-1-4842-0529-7_2_Fig2_HTML.jpg)


    图 2-2.


    按名和姓排序后的 Excel 表格


    ## 从其他格式导入


    Excel 可用于从多种来源导入数据，包括文本文件中的文本、网站上的表格数据、XML 文件中的数据以及 JSON 格式的数据。本章将向您展示如何导入一些更常见的格式。第
    4 章将介绍如何使用 Power BI 连接多个表。


    ### 在 Excel 中打开文本文件


    Excel 可以打开逗号分隔、制表符分隔、固定长度字段和 XML 格式的文本文件，以及图 2-3 中显示的文件格式。当这些格式的文件在 Excel 中打开时，它们会自动转换为电子表格。


    ![A978-1-4842-0529-7_2_Fig3_HTML.jpg](img/A978-1-4842-0529-7_2_Fig3_HTML.jpg)


    图 2-3.


    可以导入 Excel 的文件格式


    导入文件时，最好对文件的副本进行操作，这样即使导入时文件损坏，原始文件也能保持不变。


    图 2-4 显示了记事本中的一个逗号分隔文件。请注意，第一行由字段名称组成。所有字段都用逗号分隔。Excel 知道如何将这种类型的文件读入电子表格。如果用
    Excel 打开这种格式的文本文件，它将显示为电子表格，如图 2-1 所示。


    ![A978-1-4842-0529-7_2_Fig4_HTML.jpg](img/A978-1-4842-0529-7_2_Fig4_HTML.jpg)


    图 2-4.


    逗号分隔值格式

