- fmt: '# 1. Big Data


    Electronic supplementary material The online version of this chapter (`doi:10.1007/978-1-4842-0529-7_1`)
    contains supplementary material, which is available to authorized users.


    The goal of business today is to unlock intelligence stored in data. We are seeing
    a confluence of trends leading to an exponential increase in available data, including
    cheap storage and the availability of sensors to collect data. Also, the Internet
    of Things, in which objects interact with other objects, will generate vast amounts
    of data.


    Organizations are trying to extract intelligence from unstructured data. They
    are striving to break down the divisions between silos. Big data and NoSQL tools
    are being used to analyze this avalanche of data.


    Big data has many definitions, but the bottom line involves extracting insights
    from large amounts of data that might not be obvious, based on smaller data sets.
    It can be used to determine which products to sell, by analyzing buying habits
    to predict what products customers want to purchase. This chapter will cover the
    evolution of data analysis tools from early primitive maps and graphs to the big
    data tools of today.


    ## Big Data As the Fourth Factor of Production


    Traditional economics, based on an industrial economy, teaches that there are
    three factors of production: land, labor, and capital. The December 27, 2012,
    issue of the Financial Times included an article entitled “Why ‘Big Data’ is the
    fourth factor of production,” which examines the role of big data in decision
    making. According to the article “As the prevalence of Big Data grows, executives
    are becoming increasingly wedded to numerical insight. But the beauty of Big Data
    is that it allows both intuitive and analytical thinkers to excel. More entrepreneurially
    minded, creative leaders can find unexpected patterns among disparate data sources
    (which might appeal to their intuitive nature) and ultimately use the information
    to alter the course of the business.”


    ## Big Data As Natural Resource


    IBM’s CEO Virginia Rometty has been quoted as saying “Big Data is the world’s
    natural resource for the next century.” She also added that data needs to be refined
    in order to be useful. IBM has moved away from hardware manufacturing and invested
    $30 billion to enhance its big data capabilities.


    Much of IBM’s investment in big data has been in the development of Watson—a natural
    language, question-answering computer. Watson was introduced as a Jeopardy! player
    in 2011, when it won against previous champions. It has the computing power to
    search 1 million books per second. It can also process colloquial English.


    One of the more practical uses of Watson is to work on cancer treatment plans
    in collaboration with doctors. To do this, Watson received input from 2 million
    pages of medical journals and 600,000 clinical records. When a doctor inputs a
    patient’s symptoms, Watson can produce a list of recommendations ranked in order
    of confidence of success.


    ## Data As Middle Manager


    An April 30, 2015, article in the Wall Street Journal by Christopher Mims entitled
    “Data Is Now the New Middle Manager” describes how some startup companies are
    substituting data for middle managers. According to the article “Startups are
    nimbler than they have ever been, thanks to a fundamentally different management
    structure, one that pushes decision-making out to the periphery of the organization,
    to the people actually tasked with carrying out the actual business of the company.
    What makes this relatively flat hierarchy possible is that front line workers
    have essentially unlimited access to data that used to be difficult to obtain,
    or required more senior management to interpret.” The article goes on to elaborate
    that when databases were very expensive and business intelligence software cost
    millions of dollars, it made sense to limit access to top managers. But that is
    not the case today. Data scientists are needed to validate the accuracy of the
    data and how it is presented. Mims concludes “Now that every employee can have
    tools to monitor progress toward any goal, the old role of middle managers, as
    people who gather information and make decisions, doesn’t fit into many startups.”


    ## Early Data Analysis


    Data analysis was not always sophisticated. It has evolved over the years from
    the very primitive to where we are today.


    ### First Time Line


    In 1765, the theologian and scientist Joseph Priestley created the first time
    line charts, in which individual bars were used to compare the life spans of multiple
    persons, such as in the chart shown in Figure `1-1`.


    ![A978-1-4842-0529-7_1_Fig1_HTML.jpg](A978-1-4842-0529-7_1_Fig1_HTML.jpg)


    Figure 1-1. An early time line chart


    ### First Bar Chart and Time Series


    The Scottish engineer William Playfair has been credited with inventing the line,
    bar, and pie charts. His time-series plots are still presented as models of clarity.
    Playfair first published The Commercial and Political Atlas in London in 1786.
    It contained 43 time-series plots and one bar chart. It has been described as
    the first major work to contain statistical graphs. Playfair’s Statistical Breviary,
    published in London in 1801, contains what is generally credited as the first
    pie chart. One of Playfair’s time-series charts showing the balance of trade is
    shown in Figure `1-2`.


    ![A978-1-4842-0529-7_1_Fig2_HTML.jpg](A978-1-4842-0529-7_1_Fig2_HTML.jpg)


    Figure 1-2. Playfair’s balance-of-trade time-series chart


    ### Cholera Map


    In 1854, the physician John Snow mapped the incidence of cholera cases in London
    to determine the linkage to contaminated water from a single pump, as shown in
    Figure `1-3`. Prior to that analysis, no one knew what caused cholera. This is
    believed to be the first time that a map was used to analyze how disease is spread.


    ![A978-1-4842-0529-7_1_Fig3_HTML.jpg](A978-1-4842-0529-7_1_Fig3_HTML.jpg)


    Figure 1-3. Cholera map


    ## Modern Data Analytics


    The Internet has opened up vast amounts of data. Google and other Internet companies
    have designed tools to access that data and make it widely available.


    ### Google Flu Trends


    In 2009, Google set up a system to track flu outbreaks based on flu-related searches.
    When the H1N1 crisis struck in 2009, Google’s system proved to be a more useful
    and timely indicator than government statistics with their natural reporting lags
    (Big Data by Viktor Mayer-Schonberger and Kenneth Cukier [Mariner Books, 2013]).
    However, in 2012, the system overstated the number of flu cases, presumably owing
    to media attention about the flu. As a result, Google adjusted its algorithm.


    ### Google Earth


    The precursor of Google Earth was developed in 2005 by the computer programmer
    Rebecca Moore, who lived in the Santa Cruz Mountains in California, where a timber
    company was proposing a logging operation that was sold as fire prevention. Moore
    used Google Earth to demonstrate that the logging plan would remove forests near
    homes and schools and threaten drinking water.


    ### Tracking Malaria


    A September 10, 2014, article in the San Francisco Chronicle reported that a team
    at the University of California, San Francisco (UCSF) is using Google Earth to
    track malaria in Africa and to track areas that may be at risk for an outbreak.
    According to the article, “The UCSF team hopes to zoom in on the factors that
    make malaria likely to spread: recent rainfall, plentiful vegetation, low elevations,
    warm temperatures, close proximity to rivers, dense populations.” Based on these
    factors, potential malaria hot spots are identified.'
