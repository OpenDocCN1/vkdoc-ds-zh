  trans: '

    # 从多个表创建数据透视表


    本示例将演示如何基于表之间的关系，从两个以上的表创建数据透视表。它将使用 Contoso 数据库中的 `PowerPivotTutorialSample`
    电子表格，该电子表格可从以下 URL 下载：`Tinyurl.com/PowerPivotSamples`。


    可以按照以下步骤，创建一个能够访问多个相关表中字段的数据透视表：


    从前述 URL 下载 `PowerPivotTutorialSample` 电子表格。单击 PowerPivot 选项卡上的 `Manage` 图标以打开
    PowerPivot 窗口。然后点击 `Diagram View` 查看关系图，如图 4-14 所示。请注意，箭头以某种不精确的方式显示关系：使用滚动条滚动字段名称不会改变箭头的位置。查看关系的一种更清晰的方式是最小化
    PowerPivot 窗口，然后单击数据选项卡上的 `Relationships`，以查看在 `Manage Relationships` 屏幕中链接的实际字段名称，如图
    4-15 所示。请注意，您也可以通过点击 PowerPivot 窗口设计选项卡上的 `Manage Relationships` 来查看类似视图。


    ![A978-1-4842-0529-7_4_Fig15_HTML.jpg](img/A978-1-4842-0529-7_4_Fig15_HTML.jpg)


    图 4-15. 管理关系屏幕


    ![A978-1-4842-0529-7_4_Fig14_HTML.jpg](img/A978-1-4842-0529-7_4_Fig14_HTML.jpg)


    图 4-14. 关系图视图


    要创建基于相关字段的数据透视表，请选择 PowerPivot 选项卡并单击 `Manage`。如果仍显示关系图视图，请单击 `Data View`。注意屏幕底部显示此示例中包含的表的选项卡。将创建一个数据透视表，用于链接
    `dbo_FactSales` 表与 `dbo_DimProduct` 表和 `dbo_DimDate` 表。该数据透视表的目的是按日期分析产品销量。


    单击 `Pivot Table` 并从下拉菜单中选择 `Pivot Table`。在 `Create PivotTable` 对话框中，通过单击 `OK`
    接受默认的 `New Worksheet`。


    在 `PivotTable Fields` 窗格中，表前面会显示一个向右箭头。单击向右箭头可查看该表中的字段。滚动到 `dbo_DimProduct` 表并单击箭头。将
    `ProductName` 字段拖到“行”框中。单击 `dbo_DimProduct` 表左侧的箭头以隐藏字段显示。滚动到 `dbo_DimDate` 表并单击箭头以查看字段。将
    `FullDateLabel` 字段拖到“列”框中。单击箭头以隐藏字段。滚动到 `dbo_FactSales` 表并单击箭头以查看字段。将 `SalesQuantity`
    字段拖到“值”框中。结果将如图 4-16 所示。之所以能够链接多个表中的字段，是因为存在图 4-15 中所示的关系。


    ![A978-1-4842-0529-7_4_Fig16_HTML.jpg](img/A978-1-4842-0529-7_4_Fig16_HTML.jpg)


    图 4-16. 显示按产品和日期划分的销售额的数据透视表


    若要通过按年份查看产品销售额来进一步修改数据透视表，请从“列”框中移除 `FullDateLabel`，并将其替换为 `DimDate` 表中的 `CalenderYear`。结果如图
    4-17 所示。


    ![A978-1-4842-0529-7_4_Fig17_HTML.jpg](img/A978-1-4842-0529-7_4_Fig17_HTML.jpg)


    图 4-17. 显示按产品和年份划分的销售额的数据透视表


    # 添加计算列


    可以使用数据分析表达式 (DAX) 将计算列添加到 PowerPivot 中的表。常规的 Excel 公式基于单元格。相比之下，DAX 公式基于列。DAX
    将在后续章节中更详细地介绍。此示例将展示如何设置计算列。要添加计算列，请执行以下步骤：


    选择 PowerPivot 选项卡并单击 `Manage`。通过单击显示区域底部的选项卡来选择 `dbo_FactSales` 表。向右滚动到 `TotalProfit`
    列。请注意，在右侧，列标题是 `Add Column`。选择该列中的任意单元格，然后键入 `=` 以开始公式。


    创建一个扩展价格列，该列是单价乘以数量的乘积。为此，在键入 `=` 后，单击 `SalesQuantity` 列，键入 `*`，然后单击单价数量。公式显示在图
    4-18 的公式栏中：`=[SalesQuantity]*[UnitPrice]`


    ![A978-1-4842-0529-7_4_Fig18_HTML.jpg](img/A978-1-4842-0529-7_4_Fig18_HTML.jpg)


    图 4-18. 添加计算列


    然后按 `Enter` 以完成公式。要重命名该列，请右键单击该列标题，选择 `Rename Column`，并将其命名为“扩展价格”。结果如图 4-19 所示。请注意，新列中的值与
    `TotalSales` 相同，但基于公式计算得出。


    ![A978-1-4842-0529-7_4_Fig19_HTML.jpg](img/A978-1-4842-0529-7_4_Fig19_HTML.jpg)


    图 4-19. 重命名为“扩展价格”的列


    使用 PowerPivot 计算列时，所有单元格都共享相同的公式。不可能使用涉及单个单元格的公式。聚合函数（如 `SUM()`、`Average()` 和
    `COUNT()`）可应用于整个列，以提取汇总数据。


    # 向数据模型添加计算字段


    此示例将展示如何使用计算字段设计一个数据透视表，以显示按月份划分的每个产品的销量。请按照以下步骤操作：


    单击 `Pivot Table` 图标并接受默认的新工作表。从 `dbo_DimDate` 表中，将 `CalenderMonthLabel` 字段拖到“行”框中。从
    `ProductCategory` 表中，将 `ProductCategoryName` 字段拖到“列”框中。从 `dbo_FactSales` 表中，将
    `SalesQuantity` 字段拖到“值”框中。


    要向数据模型添加计算字段，请执行以下步骤：


    在 PowerPivot 选项卡上，单击 `Calculated Field`。单击 `new Calculated Field`。从下拉列表中，选择计算字段所基于的表，此处为
    `dbo_FactSales`。将计算字段命名为“盈利能力”。单击 `Fx` 图标以查看函数。许多函数与基本的 Excel 函数相似。向下滚动到 `SUM()`，如图
    4-20 所示，然后单击 `OK`。


    ![A978-1-4842-0529-7_4_Fig20_HTML.jpg](img/A978-1-4842-0529-7_4_Fig20_HTML.jpg)


    图 4-20. 计算字段对话框


    在左括号之后，开始键入要使用的表名，此处为 `dbo_FactSales`。该表的字段随即会显示出来。向下滚动到 `dbo_FactSales[totalprofit]`
    并双击。键入右括号。然后键入 `/` 和 `sum(dbo_FactsSales[totalsales])` 并键入右括号。然后点击 `check formula`。如果公式测试无误，请点击
    `OK`。


    计算字段列将出现，如图 4-21 所示。


    ![A978-1-4842-0529-7_4_Fig21_HTML.jpg](img/A978-1-4842-0529-7_4_Fig21_HTML.jpg)


    图 4-21. 显示按月份划分的盈利能力和销售额的数据透视表


    # 总结


    本章介绍了如何在 PowerPivot 中构建数据模型。在后续章节中，将探讨数据模型更高级的功能。图 4-22 显示了为每个表下载的行数。请注意，`dbo_FactSales`
    表有近 400 万行。PowerPivot 支持此数量的行，但 Excel 不支持。


    ![A978-1-4842-0529-7_4_Fig22_HTML.jpg](img/A978-1-4842-0529-7_4_Fig22_HTML.jpg)


    图 4-22. 显示导入行数的表导入向导


    # 5. 在 Excel 中使用 SQL


    本章介绍如何在 Excel 中使用 SQL（结构化查询语言）来导入和操作大型数据文件的子集，并提取汇总统计数据。

