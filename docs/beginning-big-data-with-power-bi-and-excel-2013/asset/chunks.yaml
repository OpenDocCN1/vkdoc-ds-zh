- fmt: '# Importing an External Database


    This example will use the Access Northwind sample database. To execute this sample,
    take the following steps:


    Click `Test Connection`. If the connection tests OK, click `Next`. Select the
    second option, “Write a query that will specify the data to import,” as shown
    in Figure [5-2](#A978-1-4842-0529-7_5_Chapter.html#Fig2). Click `Next`.


    ![A978-1-4842-0529-7_5_Fig2_HTML.jpg](A978-1-4842-0529-7_5_Fig2_HTML.jpg)


    Figure 5-2. Select “Write a query that will specify the data to import”


    Click the `PowerPivot` tab to open the ribbon. Click the `Manage` button. On the
    `PowerPivot` tab, click “Get External Data” and “From Database.” Select “From
    Access.” Click `Browse` and select `Database2`, which was previously downloaded
    from the Northwind Database site, as shown in Figure [5-1](#A978-1-4842-0529-7_5_Chapter.html#Fig1).
    This file is also available for download from the Source Code/Downloads tab on
    the Apress book page at [`www.apress.com/9781484205303`](http://www.apress.com/9781484205303).


    ![A978-1-4842-0529-7_5_Fig1_HTML.jpg](A978-1-4842-0529-7_5_Fig1_HTML.jpg)


    Figure 5-1. Importing database with Table Import Wizard


    Before writing a query, it is helpful to know the structure and relationships
    defined in the database. When importing an Access database, the relationships
    defined in Access are imported, as shown in Figure [5-3](#A978-1-4842-0529-7_5_Chapter.html#Fig3).


    The first query will import all fields from the `orders` and `employees` tables,
    based on the relationship shown in Figure [5-3](#A978-1-4842-0529-7_5_Chapter.html#Fig3),
    where the `EmployeeId` field in the `Orders` table is linked to the `ID` field
    in the `Employees` table. In the SQL Statement window, enter the following SQL
    Statement: `SELECT * from orders, employees`


    ![A978-1-4842-0529-7_5_Fig3_HTML.jpg](A978-1-4842-0529-7_5_Fig3_HTML.jpg)


    Figure 5-3. Existing relationships


    Click `Finish` to see the results, which are shown in Figure [5-5](#A978-1-4842-0529-7_5_Chapter.html#Fig5).
    Click `Close` to access the data.


    ![A978-1-4842-0529-7_5_Fig5_HTML.jpg](A978-1-4842-0529-7_5_Fig5_HTML.jpg)


    Figure 5-5. Success screen showing 432 rows imported


    Then click `Validate`. The window will appear as shown in Figure [5-4](#A978-1-4842-0529-7_5_Chapter.html#Fig4),
    if the SQL is entered correctly.


    ![A978-1-4842-0529-7_5_Fig4_HTML.jpg](A978-1-4842-0529-7_5_Fig4_HTML.jpg)


    Figure 5-4. SQL select statement


    The actual data retrieved after clicking `Close` is shown in Figure [5-6](#A978-1-4842-0529-7_5_Chapter.html#Fig6).
    Note that 432 rows were imported, because no relationship was specified between
    the tables, so every row in the first table was paired with every row in the second
    table. Note that 432 is the product of 9 rows in the `employees` table and 48
    rows in the `orders` table.


    ![A978-1-4842-0529-7_5_Fig6_HTML.jpg](A978-1-4842-0529-7_5_Fig6_HTML.jpg)


    Figure 5-6. Results table from SQL query


    # Specifying a JOIN Condition and Selected Fields


    In this example, a join condition will be specified, so that only one order is
    imported for each employee. This example will show how to import only selected
    fields. Note that fields with spaces in them must to be enclosed in square brackets.
    When fields from multiple tables are imported, the field names are specified as
    `tablename.fieldname`.


    For this example, follow steps 1-6 from the example in the preceding “Importing
    an External Database” section and then complete the following steps:


    Enter the SQL statement, as shown in Figure [5-7](#A978-1-4842-0529-7_5_Chapter.html#Fig7).
    Note that the `WHERE` condition is specified, linking the two tables based on
    `employees.id=orders.[employee id]`. The employee last name will be displayed
    from the `employees` table. The employee ID will be displayed from both the `employees`
    and `orders` tables, to demonstrate that they are the same.


    ![A978-1-4842-0529-7_5_Fig7_HTML.jpg](A978-1-4842-0529-7_5_Fig7_HTML.jpg)


    Figure 5-7. SQL query `Select employees.id, employees.[last name],orders.[employee
    id] from employees, orders where employees.id=orders.[employee id]`


    Click `Close` to complete the procedure. The results are given in Figure [5-9](#A978-1-4842-0529-7_5_Chapter.html#Fig9),
    which shows the employee last name from the `employees` table and the employee
    ID from both the `employees` and `orders` tables.


    ![A978-1-4842-0529-7_5_Fig9_HTML.jpg](A978-1-4842-0529-7_5_Fig9_HTML.jpg)


    Figure 5-9. Result table from SQL query


    Now, click `Finish`. Note that because the condition is specified, only 48 rows
    (the number of records in the `orders` table) were imported, as shown in Figure
    [5-8](#A978-1-4842-0529-7_5_Chapter.html#Fig8).


    ![A978-1-4842-0529-7_5_Fig8_HTML.jpg](A978-1-4842-0529-7_5_Fig8_HTML.jpg)


    Figure 5-8. Success screen showing 48 rows imported


    Click `Validate` to ensure that the query is valid, as also shown in Figure [5-7](#A978-1-4842-0529-7_5_Chapter.html#Fig7).


    # Using SQL to Extract Summary Statistics


    SQL can be used to extract summary statistics from a table or tables using aggregation
    functions. This example will extract a single number — the sum of unit price times
    quantity from the `orders` and `orders detail` tables.


    For this example, follow steps 1-6 from the previous example in the “Importing
    an External Database” section.


    Enter the following SQL statement, as shown in Figure [5-10](#A978-1-4842-0529-7_5_Chapter.html#Fig10),
    to extract the sum of price times quantity for all records in the `orders` table.


    ![A978-1-4842-0529-7_5_Fig10_HTML.jpg](A978-1-4842-0529-7_5_Fig10_HTML.jpg)


    Figure 5-10. SQL query `Select sum([order details].[unit price] *[order details].quantity)
    from orders,[order details]`


    Press `Enter` and wait until the Success screen is shown. Then click `Close`.
    The result is shown in Figure [5-11](#A978-1-4842-0529-7_5_Chapter.html#Fig11).
    Notice that the result is a single number, which is the sum of price times quantity
    for all order detail records.


    ![A978-1-4842-0529-7_5_Fig11_HTML.jpg](A978-1-4842-0529-7_5_Fig11_HTML.jpg)


    Figure 5-11. Results is a single number'
