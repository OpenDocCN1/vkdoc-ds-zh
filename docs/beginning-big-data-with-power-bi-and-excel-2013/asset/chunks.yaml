    图 3-18.


    使用时间线和销售人员切片器筛选数据


    # 从 Azure 市场导入数据透视表数据


    可以从 Azure 市场导入数据到数据透视表，Azure 市场包含种类繁多的数据，例如人口统计、环境、金融、零售和体育数据。其中部分数据免费，部分收费。以下示例展示了如何访问免费数据。


    访问 Azure 市场网站 `datamarket.azure.com/browse/data`。截至 2015 年 8 月，将显示如图 3-19 所示的屏幕。


