- fmt: '### Importing Data from XML


    Extensible Markup Language (XML) is a popular format for storing data. As in HTML,
    it uses paired tags to define each element. Figure [2-5](#A978-1-4842-0529-7_2_Chapter.html#Fig5)
    shows the data we have been working with in XML format. The first line is the
    declaration that specifies the version of XML, UTF encoding, and other information.
    Note the `donors` root tag that surrounds all of the other tags.


    ![A978-1-4842-0529-7_2_Fig5_HTML.jpg](A978-1-4842-0529-7_2_Fig5_HTML.jpg)


    Figure 2-5. XML format


    The data is self-descriptive. Each row or record in this example is surrounded
    by a `donor` tag. The field names are repeated twice for each field in the opening
    and closing tags. This file would be saved as a text file with an `.xml` extension.


    An XML file can be opened directly by Excel. On the first pop-up after it opens,
    select "As an XML table." Then, on the next pop-up, click yes for "Excel will
    create the schema."


    As shown in Figure [2-6](#A978-1-4842-0529-7_2_Chapter.html#Fig6), XML files can
    be displayed in a web browser such as Internet Explorer. Note the small plus and
    minus signs to the left of the `donor` tab. Click minus to hide the details in
    each record. Click plus to show the details.


    ![A978-1-4842-0529-7_2_Fig6_HTML.jpg](A978-1-4842-0529-7_2_Fig6_HTML.jpg)


    Figure 2-6. XML file displayed in a web browser


    ### Importing XML with Attributes


    As does HTML, XML can have attributes. Figure [2-7](#A978-1-4842-0529-7_2_Chapter.html#Fig7)
    shows an example of adding a `gender` attribute as part of the `donor` tag.


    ![A978-1-4842-0529-7_2_Fig7_HTML.jpg](A978-1-4842-0529-7_2_Fig7_HTML.jpg)


    Figure 2-7. XML with attributes


    ```

    <donor gender = "female">

    ...

    </donor>

    ```


    There are two schools of thought about using attributes. Some people believe that
    attributes should be avoided and that all values should be presented in paired
    tags. However, XML with attributes may be encountered. Excel can interpret either
    format. Figure [2-8](#A978-1-4842-0529-7_2_Chapter.html#Fig8) shows the Excel
    spreadsheet that would be displayed by opening the XML file shown in Figure [2-7](#A978-1-4842-0529-7_2_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_2_Fig8_HTML.jpg](A978-1-4842-0529-7_2_Fig8_HTML.jpg)


    Figure 2-8. XML with attributes imported into Excel


    ### Importing JSON Format


    Much NoSQL data is stored in JavaScript Object Notation (JSON) format. Unfortunately,
    Excel does not read JSON files directly, so it is necessary to use an intermediate
    format to import them into Excel. Figure [2-9](#A978-1-4842-0529-7_2_Chapter.html#Fig9)
    shows our sample file in JSON format. Note the name-value pairs in which each
    field name is repeated every time there is an instance of that field.


    ![A978-1-4842-0529-7_2_Fig9_HTML.jpg](A978-1-4842-0529-7_2_Fig9_HTML.jpg)


    Figure 2-9. JSON format


    Because Excel cannot read JSON files directly, you would have to convert this
    JSON-formatted data into a format such as XML that Excel can read. A number of
    free converters are available on the Web, such as the one at [`http://bit.ly/1s2Oi6L`](http://bit.ly/1s2Oi6L).


    The interface for the converter is shown in Figure [2-10](#A978-1-4842-0529-7_2_Chapter.html#Fig10).
    (Remember to work with a copy of the file, so that the original will not be corrupted.)
    The JSON file can be pasted into the JSON window and then converted to XML by
    clicking the arrow. The result is an XML file having the same name and that you
    can open directly from Excel.


    ![A978-1-4842-0529-7_2_Fig10_HTML.jpg](A978-1-4842-0529-7_2_Fig10_HTML.jpg)


    Figure 2-10. XML and JSON


    ## Using the Data Tab to Import Data


    So far, we have been importing data from text files directly into Excel to create
    a new spreadsheet. The options on the Data tab can be used to import data from
    a variety of formats, as part of an existing spreadsheet.


    ### Importing Data from Tables on a Web Site


    As an example, let''s look at importing data from a table on a web site.


    To import data from a table on a web site, do the following:


    1. Click the Data tab to display the Data ribbon.

    2. Click From Web.

    3. A browser window will appear. Type in the address of the web site you want
    to access. We will access a Bureau of Labor Statistics example of employment based
    on educational attainment. For this example, we will use [`http://www.bls.gov/emp/ep_table_education_summary.htm`](http://www.bls.gov/emp/ep_table_education_summary.htm).

    4. As shown in Figure [2-11](#A978-1-4842-0529-7_2_Chapter.html#Fig11), a black
    arrow in a small yellow box will appear next to each table. Click the black arrow
    in the small yellow box at the upper left-hand corner of the table, and it will
    change to a check mark in a green box.

    5. Click Import. The Import Data dialog will appear as shown in Figure [2-12](#A978-1-4842-0529-7_2_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_2_Fig12_HTML.jpg](A978-1-4842-0529-7_2_Fig12_HTML.jpg)


    Figure 2-12. Import Data dialog


    ![A978-1-4842-0529-7_2_Fig11_HTML.jpg](A978-1-4842-0529-7_2_Fig11_HTML.jpg)


    Figure 2-11. Importing data from the Web


    6. Select new Worksheet and then OK. The table will be imported, as shown in Figure
    [2-13](#A978-1-4842-0529-7_2_Chapter.html#Fig13). Some formatting may be required
    in Excel to get the table to be precisely as you want it to be for further analysis.


    ![A978-1-4842-0529-7_2_Fig13_HTML.jpg](A978-1-4842-0529-7_2_Fig13_HTML.jpg)


    Figure 2-13. Data from the Web imported into Excel


    ## Data Wrangling and Data Scrubbing


    Imported data is rarely in the form in which it is needed. Data can be problematic
    for the following reasons:


    - It is incomplete.

    - It is inconsistent.

    - It is in the wrong format.


    Data wrangling involves converting raw data into a usable format. Data scrubbing
    means correcting errors and inconsistencies. Excel provides tools to scrub and
    format data.


    ### Correcting Capitalization


    One of the functions that Excel provides to correct capitalization is the `Proper()`
    function. It capitalizes the first letter of each word and lowercases the rest.
    Figure [2-14](#A978-1-4842-0529-7_2_Chapter.html#Fig14) shows some text before
    and after executing the function. To use the `Proper()` function, as shown in
    Figure [2-14](#A978-1-4842-0529-7_2_Chapter.html#Fig14), perform the following
    steps:


    1. In a new column, type "`=Proper(`."

    2. Click the first cell that you want to apply it to and then type the closing
    parentheses (`)`). Then press Enter.

    3. Click the cell in which you just entered the formula and then drag the fill
    handle in the lower right corner of the cell, to copy the formula down the column.

    4. Convert the content of the cells from formulas to values. For a small number
    of cells, do that by selecting each cell, pressing `F2` to edit, then pressing
    `F9` to convert to values, and then pressing Enter.

    5. For a larger number of cells, select the column, right-click, and select copy.
    Then select the top cell in the range to be copied to, press `Ctrl + Alt + V`,
    to open the Paste Special Box, select Values, and click OK.

    6. Then you can delete the original column by right-clicking anywhere in the column
    and selecting Delete ➤ Entire Column.


    ![A978-1-4842-0529-7_2_Fig14_HTML.jpg](A978-1-4842-0529-7_2_Fig14_HTML.jpg)


    Figure 2-14. Use of the `Proper()` function'
  raw: '### Importing Data from XML


    Extensible Markup Language (XML) is a popular format for storing data. As in HTML,
    it uses paired tags to define each element. Figure [2-5](#A978-1-4842-0529-7_2_Chapter.html#Fig5)
    shows the data we have been working with in XML format. The first line is the
    declaration that specifies the version of XML, UTF encoding, and other information.
    Note the donors root tag that surrounds all of the other tags.


    ![A978-1-4842-0529-7_2_Fig5_HTML.jpg](A978-1-4842-0529-7_2_Fig5_HTML.jpg)


    Figure 2-5.


    XML format


    The data is self-descriptive. Each row or record in this example is surrounded
    by a donor tag. The field names are repeated twice for each field in the opening
    and closing tags. This file would be saved as a text file with an `.xml` extension.


    An XML file can be opened directly by Excel. On the first pop-up after it opens,
    select “As an XML table.” Then, on the next pop-up, click yes for “Excel will
    create the schema.”


    As shown in Figure [2-6](#A978-1-4842-0529-7_2_Chapter.html#Fig6), XML files can
    be displayed in a web browser such as Internet Explorer. Note the small plus and
    minus signs to the left of the donor tab. Click minus to hide the details in each
    record. Click plus to show the details.


    ![A978-1-4842-0529-7_2_Fig6_HTML.jpg](A978-1-4842-0529-7_2_Fig6_HTML.jpg)


    Figure 2-6.


    XML file displayed in a web browser


    ### Importing XML with Attributes


    As does HTML, XML can have attributes. Figure [2-7](#A978-1-4842-0529-7_2_Chapter.html#Fig7)
    shows an example of adding a gender attribute as part of the donor tag


    ![A978-1-4842-0529-7_2_Fig7_HTML.jpg](A978-1-4842-0529-7_2_Fig7_HTML.jpg)


    Figure 2-7.


    XML with attributes


    `<donor gender = "female">`


    `...`


    `</donor>`


    There are two schools of thought about using attributes. Some people believe that
    attributes should be avoided and that all values should be presented in paired
    tags. However, XML with attributes may be encountered. Excel can interpret either
    format. Figure [2-8](#A978-1-4842-0529-7_2_Chapter.html#Fig8) shows the Excel
    spreadsheet that would be displayed by opening the XML file shown in Figure [2-7](#A978-1-4842-0529-7_2_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_2_Fig8_HTML.jpg](A978-1-4842-0529-7_2_Fig8_HTML.jpg)


    Figure 2-8.


    XML with attributes imported into Excel


    ### Importing JSON Format


    Much NoSQL data is stored in JavaScript Object Notation (JSON) format. Unfortunately,
    Excel does not read JSON files directly, so it is necessary to use an intermediate
    format to import them into Excel. Figure [2-9](#A978-1-4842-0529-7_2_Chapter.html#Fig9)
    shows our sample file in JSON format. Note the name-value pairs in which each
    field name is repeated every time there is an instance of that field.


    ![A978-1-4842-0529-7_2_Fig9_HTML.jpg](A978-1-4842-0529-7_2_Fig9_HTML.jpg)


    Figure 2-9.


    JSON format


    Because Excel cannot read JSON files directly, you would have to convert this
    JSON-formatted data into a format such as XML that Excel can read. A number of
    free converters are available on the Web, such as the one at [`http://bit.ly/1s2Oi6L`](http://bit.ly/1s2Oi6L)
    .


    The interface for the converter is shown in Figure [2-10](#A978-1-4842-0529-7_2_Chapter.html#Fig10).
    (Remember to work with a copy of the file, so that the original will not be corrupted.)
    The JSON file can be pasted into the JSON window and then converted to XML by
    clicking the arrow. The result is an XML file having the same name and that you
    can open directly from Excel.


    ![A978-1-4842-0529-7_2_Fig10_HTML.jpg](A978-1-4842-0529-7_2_Fig10_HTML.jpg)


    Figure 2-10.


    XML and JSON


    ## Using the Data Tab to Import Data


    So far, we have been importing data from text files directly into Excel to create
    a new spreadsheet. The options on the Data tab can be used to import data from
    a variety of formats, as part of an existing spreadsheet.


    ### Importing Data from Tables on a Web Site


    As an example, let’s look at importing data from a table on a web site.


    To import data from a table on a web site, do the following:


    Click the Data tab to display the Data ribbon.   Click From Web.   A browser window
    will appear. Type in the address of the web site you want to access. We will access
    a Bureau of Labor Statistics example of employment based on educational attainment.
    For this example, we will use [`http://www.bls.gov/emp/ep_table_education_summary.htm`](http://www.bls.gov/emp/ep_table_education_summary.htm)
    .   As shown in Figure [2-11](#A978-1-4842-0529-7_2_Chapter.html#Fig11), a black
    arrow in a small yellow box will appear next to each table. Click the black arrow
    in the small yellow box at the upper left-hand corner of the table, and it will
    change to a check mark in a green box. Click Import. The Import Data dialog will
    appear as shown in Figure [2-12](#A978-1-4842-0529-7_2_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_2_Fig12_HTML.jpg](A978-1-4842-0529-7_2_Fig12_HTML.jpg)


    Figure 2-12.


    Import Data dialog


    ![A978-1-4842-0529-7_2_Fig11_HTML.jpg](A978-1-4842-0529-7_2_Fig11_HTML.jpg)


    Figure 2-11.


    Importing data from the Web  Select new Worksheet and then OK. The table will
    be imported, as shown in Figure [2-13](#A978-1-4842-0529-7_2_Chapter.html#Fig13).
    Some formatting may be required in Excel to get the table to be precisely as you
    want it to be for further analysis.


    ![A978-1-4842-0529-7_2_Fig13_HTML.jpg](A978-1-4842-0529-7_2_Fig13_HTML.jpg)


    Figure 2-13.


    Data from the Web imported into Excel


    ## Data Wrangling and Data Scrubbing


    Imported data is rarely in the form in which it is needed. Data can be problematic
    for the following reasons:


    *   It is incomplete.

    *   It is inconsistent.

    *   It is in the wrong format.


    Data wrangling involves converting raw data into a usable format. Data scrubbing
    means correcting errors and inconsistencies. Excel provides tools to scrub and
    format data.


    ### Correcting Capitalization


    One of the functions that Excel provides to correct capitalization is the `Proper()`
    function. It capitalizes the first letter of each word and lowercases the rest.
    Figure [2-14](#A978-1-4842-0529-7_2_Chapter.html#Fig14) shows some text before
    and after executing the function. To use the `Proper()` function, as shown in
    Figure [2-14](#A978-1-4842-0529-7_2_Chapter.html#Fig14), perform the following
    steps:


    In a new column, type “`=Proper(`.”   Click the first cell that you want to apply
    it to and then type the closing parentheses (`)`). Then press Enter.   Click the
    cell in which you just entered the formula and then drag the fill handle in the
    lower right corner of the cell, to copy the formula down the column.   Convert
    the content of the cells from formulas to values. For a small number of cells,
    do that by selecting each cell, pressing F2 to edit, then pressing F9 to convert
    to values, and then pressing Enter.   For a larger number of cells, select the
    column, right-click, and select copy. Then select the top cell in the range to
    be copied to, press Ctrl`+`Alt`+`V, to open the Paste Special Box, select Values,
    and click OK.   Then you can delete the original column by right-clicking anywhere
    in the column and selecting Delete ➤ Entire Column.  


    ![A978-1-4842-0529-7_2_Fig14_HTML.jpg](A978-1-4842-0529-7_2_Fig14_HTML.jpg)


    Figure 2-14.


    Use of the `Proper()` function'
  trans: '

    ### 从 XML 导入数据


    可扩展标记语言（XML）是一种广为流行的数据存储格式。与 HTML 类似，它使用成对标签来定义每个元素。图 2-5 展示了我们一直操作的数据的 XML 格式。第一行是指明
    XML 版本、UTF 编码及其他信息的声明。请注意包裹所有其他标签的 `donors` 根标签。


    ![A978-1-4842-0529-7_2_Fig5_HTML.jpg](img/A978-1-4842-0529-7_2_Fig5_HTML.jpg)


    图 2-5. XML 格式


    这些数据是自描述的。在本示例中，每条记录（即每一行）都被一个 `donor` 标签包裹。每个字段的名称在开始和结束标签中各出现一次。该文件将保存为带有 `.xml`
    扩展名的文本文件。


    XML 文件可以直接用 Excel 打开。打开后弹出的第一个窗口中选择“作为 XML 表格”。然后在下一个弹出的窗口中，点击“是”以确认“Excel 将创建架构”。


    如图 2-6 所示，XML 文件可以在诸如 Internet Explorer 之类的网页浏览器中显示。请注意 `donor` 标签左侧的加号和减号。点击减号可隐藏每条记录中的详细信息，点击加号则可显示详细信息。


    ![A978-1-4842-0529-7_2_Fig6_HTML.jpg](img/A978-1-4842-0529-7_2_Fig6_HTML.jpg)


    图 2-6. 在网页浏览器中显示的 XML 文件


    ### 导入包含属性的 XML


    与 HTML 类似，XML 也可以包含属性。图 2-7 展示了一个将 `gender` 属性作为 `donor` 标签一部分的示例。


    ![A978-1-4842-0529-7_2_Fig7_HTML.jpg](img/A978-1-4842-0529-7_2_Fig7_HTML.jpg)


    图 2-7. 包含属性的 XML


    ```

    <donor gender = "female">

    ...

    </donor>

    ```


    关于属性的使用，存在两种观点。一些人认为应避免使用属性，所有值都应以成对标签呈现。然而，我们仍可能会遇到包含属性的 XML。Excel 能够解释这两种格式。图
    2-8 展示了打开图 2-7 中所示 XML 文件后显示的 Excel 电子表格。


    ![A978-1-4842-0529-7_2_Fig8_HTML.jpg](img/A978-1-4842-0529-7_2_Fig8_HTML.jpg)


    图 2-8. 包含属性并导入 Excel 的 XML


    ### 导入 JSON 格式


    许多 NoSQL 数据以 JavaScript 对象表示法（JSON）格式存储。遗憾的是，Excel 无法直接读取 JSON 文件，因此需要借助一种中间格式将其导入
    Excel。图 2-9 展示了我们的示例文件以 JSON 格式呈现的样子。请注意其中的名称-值对，每当出现某个字段的实例时，该字段名称就会重复出现。


    ![A978-1-4842-0529-7_2_Fig9_HTML.jpg](img/A978-1-4842-0529-7_2_Fig9_HTML.jpg)


    图 2-9. JSON 格式


    由于 Excel 无法直接读取 JSON 文件，你必须将这种 JSON 格式的数据转换为 Excel 能够读取的格式（如 XML）。网上有许多免费的转换工具，例如
    [`http://bit.ly/1s2Oi6L`](http://bit.ly/1s2Oi6L) 上的那个。


    该转换器的界面如图 2-10 所示。（请记住对文件的副本进行操作，以免损坏原始文件。）可以将 JSON 文件内容粘贴到 JSON 窗口中，然后点击箭头将其转换为
    XML。结果是一个同名的 XML 文件，你可以直接从 Excel 中打开它。


    ![A978-1-4842-0529-7_2_Fig10_HTML.jpg](img/A978-1-4842-0529-7_2_Fig10_HTML.jpg)


    图 2-10. XML 与 JSON


    ## 使用“数据”选项卡导入数据


    到目前为止，我们一直在将数据从文本文件直接导入 Excel 以创建新的电子表格。“数据”选项卡上的选项可用于将多种格式的数据导入到现有电子表格中。


    ### 从网站上的表格导入数据


    作为示例，我们来看一下从网站上的表格导入数据。


    要从网站上的表格导入数据，请执行以下操作：


    1.  单击“数据”选项卡以显示“数据”功能区。

    2.  单击“自网站”。

    3.  将会出现一个浏览器窗口。输入你要访问的网站地址。我们将访问一个劳工统计局关于按教育程度划分就业情况的示例。在本示例中，我们将使用[`http://www.bls.gov/emp/ep_table_education_summary.htm`](http://www.bls.gov/emp/ep_table_education_summary.htm)。

    4.  如图 2-11 所示，每个表格旁边会出现一个黄色小方框中的黑色箭头。点击表格左上角黄色小方框中的黑色箭头，它将变为绿色方框中的对勾。

    5.  单击“导入”。此时将出现“导入数据”对话框，如图 2-12 所示。


    ![A978-1-4842-0529-7_2_Fig12_HTML.jpg](img/A978-1-4842-0529-7_2_Fig12_HTML.jpg)


    图 2-12. “导入数据”对话框


    ![A978-1-4842-0529-7_2_Fig11_HTML.jpg](img/A978-1-4842-0529-7_2_Fig11_HTML.jpg)


    图 2-11. 从网页导入数据


    6.  选择“新工作表”，然后点击“确定”。表格将被导入，如图 2-13 所示。可能需要在 Excel 中进行一些格式设置，才能使表格完全符合后续分析的要求。


    ![A978-1-4842-0529-7_2_Fig13_HTML.jpg](img/A978-1-4842-0529-7_2_Fig13_HTML.jpg)


    图 2-13. 从网页导入到 Excel 的数据


    ## 数据整理与数据清洗


    导入的数据很少是直接可用的形式。数据可能存在以下问题：


    -   不完整。

    -   不一致。

    -   格式错误。


    数据整理涉及将原始数据转换为可用格式。数据清洗是指纠正错误和不一致性。Excel 提供了清洗和格式化数据的工具。


    ### 修正大小写


    Excel 提供的用于修正大小写的函数之一是 `Proper()` 函数。它会将每个单词的首字母大写，并将其余字母转换为小写。图 2-14 展示了一些文本在执行该函数前后的对比。要使用
    `Proper()` 函数（如图 2-14 所示），请执行以下步骤：


    1.  在新的一列中，输入“`=Proper(`”。

    2.  单击要应用此函数的第一个单元格，然后输入右括号 (`)`)。接着按 Enter 键。

    3.  单击刚才输入公式的单元格，然后拖动该单元格右下角的填充柄，将公式复制到整列。

    4.  将单元格的内容从公式转换为值。对于少量单元格，可以通过选中每个单元格，按 `F2` 进行编辑，再按 `F9` 转换为值，最后按 Enter 键来实现。

    5.  对于大量单元格，选择该列，右键单击，选择“复制”。然后选择要粘贴区域的最顶端的单元格，按 `Ctrl + Alt + V` 打开“选择性粘贴”对话框，选择“数值”，点击“确定”。

    6.  之后，你可以通过右键单击该列的任意位置，选择“删除” ➤ “整列”来删除原始列。


    ![A978-1-4842-0529-7_2_Fig14_HTML.jpg](img/A978-1-4842-0529-7_2_Fig14_HTML.jpg)


    图 2-14. `Proper()` 函数的使用

