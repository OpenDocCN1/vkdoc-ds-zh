- fmt: '# Calculating the Store Sales for 2009


    Calculated fields can be based on other calculated fields. The store sales for
    2009 can be calculated based on the total `StoreSales` calculated field. Follow
    these steps:


    Select the next cell in the leftmost calculation area. Enter the following formula:


    `StoreSales2009:=CALCULATE([StoreSales],LEFT(dbo_DimDate[Datekey],4)="2009")`


    The `LEFT` function is used to extract the year from the `Datekey` text string.
    The result is shown in Figure [7-13](#A978-1-4842-0529-7_7_Chapter.html#Fig13).


    ![A978-1-4842-0529-7_7_Fig13_HTML.jpg](A978-1-4842-0529-7_7_Fig13_HTML.jpg)


    Figure 7-13. Calculating the 2009 store sales


    Next, create a calculated field for store sales for the previous year, 2008, by
    entering the following DAX formula in the cell below, as shown in Figure [7-14](#A978-1-4842-0529-7_7_Chapter.html#Fig14).


    ![A978-1-4842-0529-7_7_Fig14_HTML.jpg](A978-1-4842-0529-7_7_Fig14_HTML.jpg)


    Figure 7-14. Calculating the 2008 store sales


    `StoreSales2008:=CALCULATE([StoreSales],LEFT(dbo_DimDate[Datekey],4)="2008")`


    Next, the year-over-year growth can be calculated by entering the following formula
    and changing the format to percent, as shown in Figure [7-15](#A978-1-4842-0529-7_7_Chapter.html#Fig15).
    The identifiers for the calculated fields have to be enclosed in square brackets.
    Note that sales decreased by 12% in 2009.


    ![A978-1-4842-0529-7_7_Fig15_HTML.jpg](A978-1-4842-0529-7_7_Fig15_HTML.jpg)


    Figure 7-15. Calculating a year or a year sales change


    `SalesChange:=([StoreSales2009]-[StoreSales2008])/[StoreSales2008]`


    # Creating a KPI for Profitability


    A KPI, or Key Performance Indicator, is based on the relationship between a calculated
    field and a value. Create a KPI for profitability by initiating the following
    steps:


    Create a calculated field for average of profit/sales, as shown in Figure [7-16](#A978-1-4842-0529-7_7_Chapter.html#Fig16),
    by entering the following formula:


    ![A978-1-4842-0529-7_7_Fig16_HTML.jpg](A978-1-4842-0529-7_7_Fig16_HTML.jpg)


    Figure 7-16. Creating calculate field for Average of Profit/Sales


    `Average of Profit/Sales:=AVERAGE([Profit/Sales])`


    Right-click the calculated field and select `Create KPI`. Enter an absolute value
    of .53, or 53%, and adjust the sliders so that green is displayed for values that
    meet the target, as shown in Figure [7-17](#A978-1-4842-0529-7_7_Chapter.html#Fig17),
    and click OK.


    ![A978-1-4842-0529-7_7_Fig17_HTML.jpg](A978-1-4842-0529-7_7_Fig17_HTML.jpg)


    Figure 7-17. Defining the KPI


    # Creating a Pivot Table Showing Profitability by Product Line


    To create a Pivot Table showing profitability by product line, follow these steps:


    1. Select the `dbo_FactSales` tab.

    2. Click the `Pivot Table` icon on the ribbon and select `Pivot Table`.

    3. Select `New Worksheet` in the `Create Pivot Table` dialog and click `OK`.

    4. Select the `Product Category Name` field in the `Product Category` table. It
    will appear in the `Rows` box in the Pivot Table pane on the right of the screen,
    as shown in Figure [7-18](#A978-1-4842-0529-7_7_Chapter.html#Fig18).


    ![A978-1-4842-0529-7_7_Fig18_HTML.jpg](A978-1-4842-0529-7_7_Fig18_HTML.jpg)


    Figure 7-18. Inserting product category name into Pivot Table


    Next, select the `Sales Quantity` field in the `dbo_FactSales` table and the `Average
    of Profit/Sales` calculated field, which appears at the bottom of the fields list.
    Click the calculated field name and select `values`, `goal`, and `status`. This
    field will appear in the `values` box, and a Pivot Table will be created, as shown
    in Figure [7-19](#A978-1-4842-0529-7_7_Chapter.html#Fig19).


    ![A978-1-4842-0529-7_7_Fig19_HTML.jpg](A978-1-4842-0529-7_7_Fig19_HTML.jpg)


    Figure 7-19. Adding the KPI into Pivot Table


    # Summary


    This chapter showed how to use the DAX formula language to create calculated fields
    and calculated columns and how to create Key Performance Indicators to monitor
    business activity. In contrast to Excel formulas, which reference specific cells,
    DAX formulas reference columns, but the `CALCULATE()` function can be used to
    calculate an expression based on a filter.


    # 8. Power Query


    Microsoft Power Query for Excel is a data-discovery tool for importing data from
    a wide variety of sources, including relational, semi-structured, and unstructured
    data available from sources such as `OData`, `Hadoop`, and `Azure Marketplace`.
    It is a self-service ETL (export, transform, load) tool for extracting, transforming,
    and loading data. It is more powerful than some of the approaches that have been
    covered previously. Microsoft is constantly updating Power Query, so some features
    may have changed by the time this book is published. This chapter demonstrates
    how to access data—from the Web, in table format, CSV format, and JSON format—and
    then shape it using the Power Query editor before importing it into Excel.


    ## Installing Power Query


    If the `Power Query` tab is not visible, you will have to install it. Power Query
    is available as a free download from Microsoft for Excel 2010 and 2013. The download
    link can be accessed by doing a search on “Power Query download.” Be sure to install
    the 32-bit version if you have installed the 32-bit version of Excel and the 64-bit
    version if you have the 64-bit version of Excel. To enable Power Query after installation,
    follow these steps:


    1. Click the `File` tab to see the Backstage View.

    2. Click `Options` at the bottom of the left pane.

    3. Select `Add-Ins` on the left pane.

    4. At the bottom of the window, pull down the arrow after `Manage` and select
    `Com Add-Ins` and click `Go`.

    5. Check `Microsoft Office PowerPivot for Excel 2013`, `Microsoft Power Map for
    Excel`, and `Power View`, and click `OK`.


    After installation, the `Power Query` tab will be visible.


    ## Key Options on Power Query Ribbon


    This section will cover the most useful options on the Power Query ribbon, which
    is shown in Figure [8-1](#A978-1-4842-0529-7_8_Chapter.html#Fig1).


    * **From Web**: Allows extracting tables from a specific web site

    * **From File**: Imports from Excel, CSV, XML, text files, or from a group of
    files in a folder

    * **From Database**: Imports from databases, such as SQL Server, Access, Oracle,
    and MySQL

    * **From Azure**: Imports from Azure services, such as SQL Database, Market Place,
    HDInsight, Blob Storage, and Table Storage

    * **From Other Sources**: Imports from sources including SharePoint Lists, OData
    feeds, Hadoop (HDFS), Facebook, Salesforce Objects and Reports, and ODBC

    * **Recent Sources**: Shows the source of recent queries

    * **From Table Excel Data**: Imports a range from an Excel spreadsheet

    * **Merge**: Merges two queries to add columns

    * **Append**: Appends one table to another with the same structure

    * **Show Pane**: Toggles the display of the Workbook Query pane on the right side
    of the screen

    * **Data Source Settings**: Manages setting for data sources that have been accessed
    through Power Query

    * **Options**: Sets options for loading data

    * **Update**: Checks online for Power Query updates

    * **Data Catalog Search**: Searches a curated set of web sites and extracts tables

    * **My Data Catalog Queries**: Allows sharing queries with other users


    ![A978-1-4842-0529-7_8_Fig1_HTML.jpg](A978-1-4842-0529-7_8_Fig1_HTML.jpg)


    Figure 8-1. Power Query ribbon


    ## Working with the Query Editor


    Power Query allows importing a subset of the data into the Query Editor, so that
    the data can be shaped by removing unneeded rows or columns or creating calculated
    columns before importing into Excel or into a data model. There are three tabs
    in Query Editor: `Home`, `Transform`, and `Add Column`.'
  raw: '## Calculating the Store Sales for 2009


    Calculated fields can be based on other calculated fields. The store sales for
    2009 can be calculated based on the total StoreSales calculated field. Follow
    these steps:


    Select the next cell in the leftmost calculation area.   Enter the following formula:
     


    `StoreSales2009:=CALCULATE([StoreSales],LEFT(dbo_DimDate[Datekey],4)="2009")`


    The `LEFT` function is used to extract the year from the Datekey text string.
    The result is shown in Figure [7-13](#A978-1-4842-0529-7_7_Chapter.html#Fig13).


    ![A978-1-4842-0529-7_7_Fig13_HTML.jpg](A978-1-4842-0529-7_7_Fig13_HTML.jpg)


    Figure 7-13.


    Calculating the 2009 store salesNext, create a calculated field for store sales
    for the previous year, 2008, by entering the following DAX formula in the cell
    below, as shown in Figure [7-14](#A978-1-4842-0529-7_7_Chapter.html#Fig14).


    ![A978-1-4842-0529-7_7_Fig14_HTML.jpg](A978-1-4842-0529-7_7_Fig14_HTML.jpg)


    Figure 7-14.


    Calculating the 2008 store sales  


    `StoreSales2008:=CALCULATE([StoreSales],LEFT(dbo_DimDate[Datekey],4)="2008")`


    Next, the year-over-year growth can be calculated by entering the following formula
    and changing the format to percent, as shown in Figure [7-15](#A978-1-4842-0529-7_7_Chapter.html#Fig15).
    The identifiers for the calculated fields have to be enclosed in square brackets.
    Note that sales decreased by 12% in 2009.


    ![A978-1-4842-0529-7_7_Fig15_HTML.jpg](A978-1-4842-0529-7_7_Fig15_HTML.jpg)


    Figure 7-15.


    Calculating a year or a year sales change  


    `SalesChange:=([StoreSales2009]-[StoreSales2008])/[StoreSales2008]`


    ## Creating a KPI for Profitability


    A KPI, or Key Performance Indicator, is based on the relationship between a calculated
    field and a value. Create a KPI for profitability by initiating the following
    steps:


    Create a calculated field for average of profit/sales, as shown in Figure [7-16](#A978-1-4842-0529-7_7_Chapter.html#Fig16),
    by entering the following formula:


    ![A978-1-4842-0529-7_7_Fig16_HTML.jpg](A978-1-4842-0529-7_7_Fig16_HTML.jpg)


    Figure 7-16.


    Creating calculate field for Average of Profit/Sales  


    `Average of Profit/Sales:=AVERAGE([Profit/Sales])`


    Right-click the calculated field and select Create KPI. Enter an absolute value
    of .53, or 53%, and adjust the sliders so that green is displayed for values that
    meet the target, as shown in Figure [7-17](#A978-1-4842-0529-7_7_Chapter.html#Fig17),
    and click OK.


    ![A978-1-4842-0529-7_7_Fig17_HTML.jpg](A978-1-4842-0529-7_7_Fig17_HTML.jpg)


    Figure 7-17.


    Defining the KPI


    ## Creating a Pivot Table Showing Profitability by Product Line


    To create a Pivot Table showing profitability by product line, follow these steps:


    Select the dbo_FactSales tab.   Click the Pivot Table icon on the ribbon and select
    Pivot Table.   Select New Worksheet in the Create Pivot Table dialog and click
    OK.   Select the Product Category Name field in the Product Category table. It
    will appear in the Rows box in the Pivot Table pane on the right of the screen,
    as shown in Figure [7-18](#A978-1-4842-0529-7_7_Chapter.html#Fig18).


    ![A978-1-4842-0529-7_7_Fig18_HTML.jpg](A978-1-4842-0529-7_7_Fig18_HTML.jpg)


    Figure 7-18.


    Inserting product category name into Pivot Table  Next, select the Sales Quantity
    field in the dbo_FactSales table and the Average of Profit/Sales calculated field,
    which appears at the bottom of the fields list. Click the calculated field name
    and select values, goal, and status. This field will appear in the values box,
    and a Pivot Table will be created, as shown in Figure [7-19](#A978-1-4842-0529-7_7_Chapter.html#Fig19).


    ![A978-1-4842-0529-7_7_Fig19_HTML.jpg](A978-1-4842-0529-7_7_Fig19_HTML.jpg)


    Figure 7-19.


    Adding the KPI into Pivot Table


    ## Summary


    This chapter showed how to use the DAX formula language to create calculated fields
    and calculated columns and how to create Key Performance Indicators to monitor
    business activity. In contrast to Excel formulas, which reference specific cells,
    DAX formulas reference columns, but the `CALCULATE()` function can be used to
    calculate an expression based on a filter.


    # 8. Power Query


    Microsoft Power Query for Excel is a data-discovery tool for importing data from
    a wide variety of sources, including relational, semi-structured, and unstructured
    data available from sources such as OData, Hadoop, and Azure Marketplace. It is
    a self-service ETL (export, transform, load) tool for extracting, transforming,
    and loading data. It is more powerful than some of the approaches that have been
    covered previously. Microsoft is constantly updating Power Query, so some features
    may have changed by the time this book is published. This chapter demonstrates
    how to access data—from the Web, in table format, CSV format, and JSON format—and
    then shape it using the Power Query editor before importing it into Excel.


    ## Installing Power Query


    If the Power Query tab is not visible, you will have to install it. Power Query
    is available as a free download from Microsoft for Excel 2010 and 2013\. The download
    link can be accessed by doing a search on “Power Query download.” Be sure to install
    the 32-bit version if you have installed the 32-bit version of Excel and the 64-bit
    version if you have the 64-bit version of Excel. To enable Power Query after installation,
    follow these steps:


    Click the File tab to see the Backstage View.   Click Options at the bottom of
    the left pane.   Select Add-Ins on the left pane.   At the bottom of the window,
    pull down the arrow after Manage and select Com Add-Ins and click Go.   Check
    Microsoft Office PowerPivot for Excel 2013, Microsoft Power Map for Excel, and
    Power View, and click OK.  


    After installation, the Power Query tab will be visible.


    ## Key Options on Power Query Ribbon


    This section will cover the most useful options on the Power Query ribbon, which
    is shown in Figure [8-1](#A978-1-4842-0529-7_8_Chapter.html#Fig1).


    *   From Web: Allows extracting tables from a specific web site

    *   From File: Imports from Excel, CSV, XML, text files, or from a group of files
    in a folder

    *   From Database: Imports from databases, such as SQL Server, Access, Oracle,
    and MySQL

    *   From Azure: Imports from Azure services, such as SQL Database, Market Place,
    HDInsight, Blob Storage, and Table Storage

    *   From Other Sources: Imports from sources including SharePoint Lists, OData
    feeds, Hadoop (HDFS), Facebook, Salesforce Objects and Reports, and ODBC

    *   Recent Sources: Shows the source of recent queries

    *   From Table Excel Data: Imports a range from an Excel spreadsheet

    *   Merge: Merges two queries to add columns

    *   Append: Appends one table to another with the same structure

    *   Show Pane: Toggles the display of the Workbook Query pane on the right side
    of the screen

    *   Data Source Settings: Manages setting for data sources that have been accessed
    through Power Query

    *   Options: Sets options for loading data

    *   Update: Checks online for Power Query updates

    *   Data Catalog Search: Searches a curated set of web sites and extracts tables

    *   My Data Catalog Queries: Allows sharing queries with other users


    ![A978-1-4842-0529-7_8_Fig1_HTML.jpg](A978-1-4842-0529-7_8_Fig1_HTML.jpg)


    Figure 8-1.


    Power Query ribbon


    ## Working with the Query Editor


    Power Query allows importing a subset of the data into the Query Editor, so that
    the data can be shaped by removing unneeded rows or columns or creating calculated
    columns before importing into Excel or into a data model. There are three tabs
    in Query Editor: Home, Transform, and Add Column.'
