    ### 启用 Excel 分析工具库


    使用前，必须先激活该工具。


    启用 Excel 分析工具库，请按以下步骤操作：


    1. 单击 `文件` 选项卡，打开 Backstage 视图。

    2. 单击左窗格底部的 `选项`。

    3. 在左窗格中选择 `加载项`。

    4. 在窗口底部，选择 `Excel 加载项` 并单击 `转到`，如图 10-7 所示。


    ![A978-1-4842-0529-7_10_Fig7_HTML.jpg](img/A978-1-4842-0529-7_10_Fig7_HTML.jpg)

    *图 10-7. Excel 加载项屏幕*


    5. 选择 `分析工具库`，如图 10-8 所示，并单击 `确定`。


    ![A978-1-4842-0529-7_10_Fig8_HTML.jpg](img/A978-1-4842-0529-7_10_Fig8_HTML.jpg)

    *图 10-8. 加载项弹出窗口*


    激活后，即可通过单击 Excel 中 `数据` 选项卡右侧的 `数据分析` 来访问分析工具库。


    ### 一个简单示例


    以下示例将演示如何使用 Excel 分析工具库分析一些样本考试成绩。


    **练习 10-1. 使用分析工具库**


    请按以下步骤分析考试成绩：


    1. 单击 `数据` 选项卡右侧的 `数据分析`。当 `数据分析` 窗口出现时，选择 `描述统计`，如图 10-9 所示。


    ![A978-1-4842-0529-7_10_Fig9_HTML.jpg](img/A978-1-4842-0529-7_10_Fig9_HTML.jpg)

    *图 10-9. 数据分析工具*


    2. 单击 `确定`。在 `描述统计` 对话框中，指定输入区域和输出区域，并选中 `汇总统计`，如图 10-10 所示，然后单击 `确定`。


    ![A978-1-4842-0529-7_10_Fig10_HTML.jpg](img/A978-1-4842-0529-7_10_Fig10_HTML.jpg)

    *图 10-10. 描述统计对话框*


