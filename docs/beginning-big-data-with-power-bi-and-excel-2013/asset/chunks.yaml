- fmt: '# Creating a Pivot Table from Multiple Tables


    This example will demonstrate how to create Pivot Tables from more than two tables,
    based on the relationships between the tables. It will use the `PowerPivotTutorialSample`
    spreadsheet from the Contoso database, which can be downloaded from the following
    URL: `Tinyurl.com/PowerPivotSamples`.


    A Pivot Table accessing fields from multiple related tables can be created by
    following these steps:


    Download the `PowerPivotTutorialSample` spreadsheet from the preceding URL. Click
    the **Manage** icon on the PowerPivot tab to open the PowerPivot window. Then
    click **Diagram View** to see the diagram of relationships, as shown in Figure
    [4-14](#A978-1-4842-0529-7_4_Chapter.html#Fig14). Note that the arrows show relations
    in a somewhat imprecise manner: using the scrollbar to scroll through the field
    names does not change the position of the arrow. A clearer way to see relationships
    is to minimize the PowerPivot window and click **Relationships** on the **Data**
    tab, to see the actual field names that are linked in the **Manage Relationships**
    screen, as shown in Figure [4-15](#A978-1-4842-0529-7_4_Chapter.html#Fig15). Note
    that you can also see a similar view by clicking **Manage Relationships** on the
    **Design** tab of the PowerPivot window.


    ![A978-1-4842-0529-7_4_Fig15_HTML.jpg](A978-1-4842-0529-7_4_Fig15_HTML.jpg)


    Figure 4-15. Manage Relationships screen


    ![A978-1-4842-0529-7_4_Fig14_HTML.jpg](A978-1-4842-0529-7_4_Fig14_HTML.jpg)


    Figure 4-14. Diagram view of relationships


    To create a Pivot Table based on related fields, select the **PowerPivot** tab
    and click **Manage**. If the **Diagram View** is still displayed, click **Data
    View**. Notice the tabs at the bottom of the screen that show the tables included
    in this example. A PivotTable will be created that links the `dbo_FactSales` table
    with the `dbo_DimProduct` table and the `dbo_DimDate` table. The purpose of the
    Pivot Table is to analyze product sales by date.


    Click **Pivot Table** and select **Pivot Table** from the drop-down. In the **Create
    PivotTable** dialog, accept the default of **New Worksheet** by clicking **OK**.


    In the **PivotTable Fields** pane, the tables will be shown preceded by a right-facing
    arrow. Click the right-facing arrow to see the fields in that table. Scroll to
    the `dbo_DimProduct` table and click the arrow. Drag the `ProductName` field to
    the **Rows** box. Click the arrow to the left of the `dbo_DimProduct` table to
    suppress the fields display. Scroll to the `dbo_DimDate` table and click the arrow,
    to see the fields. Drag the `FullDateLabel` field to the **Columns** box. Click
    the arrow to suppress the fields. Scroll to the `dbo_FactSales` table and click
    the arrow, to see the fields. Drag the `SalesQuantity` field to the **Values**
    box. The results will be shown in Figure [4-16](#A978-1-4842-0529-7_4_Chapter.html#Fig16).
    It is possible to link fields from multiple tables because of the relationships
    shown in Figure [4-15](#A978-1-4842-0529-7_4_Chapter.html#Fig15).


    ![A978-1-4842-0529-7_4_Fig16_HTML.jpg](A978-1-4842-0529-7_4_Fig16_HTML.jpg)


    Figure 4-16. PivotTable showing sales by product and date


    To further modify the Pivot Table by viewing sales by product by year, remove
    `FullDateLabel` from the **Columns** box and replace it with `CalenderYear` from
    the `DimDate` table. The results are shown in Figure [4-17](#A978-1-4842-0529-7_4_Chapter.html#Fig17).


    ![A978-1-4842-0529-7_4_Fig17_HTML.jpg](A978-1-4842-0529-7_4_Fig17_HTML.jpg)


    Figure 4-17. PivotTable showing sales by product and year


    ## Adding Calculated Columns


    Calculated columns can be added to a table in PowerPivot, using Data Analysis
    Expressions (DAX). Regular Excel formulas are based on cells. By contrast, DAX
    formulas are based on columns. DAX will be covered more extensively in future
    chapters. This example will show how to set up a calculated column. To add a calculated
    column, take the following steps:


    Select the **PowerPivot** tab and click **Manage**. Select the `dbo_FactSales`
    table by clicking the tab at the bottom of the display. Scroll to the right to
    the `TotalProfit` column. Note that to the right, the column heading is **Add
    Column**. Select any cell in that column and type `=` to start a formula.


    Create an extended price column that is the product of unit price times quantity.
    To do this, after typing `=`, click the `SalesQuantity` column, type `*`, and
    then click the `unit price` quantity. The formula is shown in Figure [4-18](#A978-1-4842-0529-7_4_Chapter.html#Fig18),
    in the formula bar: `=[SalesQuantity]*[UnitPrice]`


    ![A978-1-4842-0529-7_4_Fig18_HTML.jpg](A978-1-4842-0529-7_4_Fig18_HTML.jpg)


    Figure 4-18. Adding calculated column


    Then press **Enter** to complete the formula. To rename the column, right-click
    the column heading, select **Rename Column**, and name it “extended price.” The
    results are shown in Figure [4-19](#A978-1-4842-0529-7_4_Chapter.html#Fig19).
    Note that the values in the new column are the same as the `TotalSales` but are
    based on a formula.


    ![A978-1-4842-0529-7_4_Fig19_HTML.jpg](A978-1-4842-0529-7_4_Fig19_HTML.jpg)


    Figure 4-19. Column renamed “extended price”


    When using PowerPivot calculated columns, all cells share the same formulas. It
    is not possible to use formulas involving individual cells. Aggregation functions
    such as `SUM()`, `Average()`, and `COUNT()` can apply to an entire column, to
    extract summary data.


    ## Adding Calculated Fields to the Data Model


    This example will show how to design a Pivot Table that shows sales quantity by
    product by month, using calculated fields. To do this follows these steps:


    Click the **Pivot Table** icon and accept the default of a new sheet. From the
    `dbo_DimDate` table, drag the `CalenderMonthLabel` field to the **Rows** box.
    From the `ProductCategory` table, drag the `ProductCategoryName` field to the
    **Columns** box. From the `dbo_FactSales` table, drag the `SalesQuantity` field
    to the **Values** box.


    To add a calculated field to the data model, take the following steps:


    On the **PowerPivot** tab, click **Calculated Field**. Click **new Calculated
    Field**. From the drop-down, select the table on which the calculated field will
    be based, in this case, `dbo_FactSales`. Name the calculated field “profitability.”
    Click the **Fx** icon, to see the functions. Many of the functions are similar
    to basic Excel functions. Scroll down to `SUM()`, as shown in Figure [4-20](#A978-1-4842-0529-7_4_Chapter.html#Fig20),
    and click **OK**.


    ![A978-1-4842-0529-7_4_Fig20_HTML.jpg](A978-1-4842-0529-7_4_Fig20_HTML.jpg)


    Figure 4-20. Calculated Field dialog


    Following the left parenthesis, start typing the name of the table to use, in
    this case, `dbo_FactSales`. The fields for that table will then be displayed.
    Scroll down to `dbo_FactSales[totalprofit]` and double-click. Type the closing
    parenthesis. Then type `/` and `sum(dbo_FactsSales[totalsales])` and close the
    parenthesis. Then click **check formula**. If the formula tests OK, click **OK**.


    The calculated field column will appear as shown in Figure [4-21](#A978-1-4842-0529-7_4_Chapter.html#Fig21).


    ![A978-1-4842-0529-7_4_Fig21_HTML.jpg](A978-1-4842-0529-7_4_Fig21_HTML.jpg)


    Figure 4-21. PivotTable showing profitability and sales by month


    ## Summary


    This chapter provided an introduction to building a Data Model in PowerPivot.
    In future chapters, more advanced features of the Data Model will be explored.
    Figure [4-22](#A978-1-4842-0529-7_4_Chapter.html#Fig22) shows the number of rows
    downloaded for each table. Notice that the `dbo_FactSales` table has almost 4
    million rows. That number of rows is supported in PowerPivot but not in Excel.


    ![A978-1-4842-0529-7_4_Fig22_HTML.jpg](A978-1-4842-0529-7_4_Fig22_HTML.jpg)


    Figure 4-22. Table Import Wizard showing number of rows imported


    # Using SQL in Excel


    This chapter covers using SQL (Structured Query Language) in Excel to import and
    manipulate subsets of large data files and to extract summary statistics.'
