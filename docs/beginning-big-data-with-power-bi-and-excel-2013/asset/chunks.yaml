    函数、更新公式、计算字段、盈利能力

    - **数据库架构**

    - **数据表单**：数据模型、计算列、计算字段、候选键、复合键、数据库、启用 `PowerPivot`、创建 Excel 表、字段、外键、加载数据、3NF
    规范化、数据透视表、多表、两表、主键、记录、相关表、关系型数据库、关系、源表、表

    - **数据清洗**

    - **数据验证**

    - **数据整理**

    - **描述性统计**：钟形曲线、计算对话框、离散度度量、输出、Excel 2013 中的统计函数


