- fmt: '# Importing CSV Files from a Folder


    Sometimes Hadoop data will be stored in files with comma-separated values. Rather
    than loading it into Hortonworks Sandbox or some other product to be manipulated
    as a Hadoop, the files with comma-separated values can be loaded directly into
    Excel and PowerPivot, using Power Query. The following example demonstrates how
    to do this.


    First download the stock market zipped file from the following URL: `s3.amazonaws.com/hortonassets/mstut/nyse.zip`
    After the download is complete, double-click the file in your browsers download
    window to open it, as shown in Figure [8-12](#A978-1-4842-0529-7_8_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_8_Fig12_HTML.jpg](A978-1-4842-0529-7_8_Fig12_HTML.jpg)


    Figure 8-12.


    Download window Two folders of `.csv` files will be downloaded, as shown in Figure
    [8-13](#A978-1-4842-0529-7_8_Chapter.html#Fig13).


    ![A978-1-4842-0529-7_8_Fig13_HTML.jpg](A978-1-4842-0529-7_8_Fig13_HTML.jpg)


    Figure 8-13.


    Windows showing file folders Drag the folder `nyse_prices` to the desktop, to
    make it easier to access. Open Excel and click the Power Query tab. Select From
    File and From Folder, as shown in Figure [8-14](#A978-1-4842-0529-7_8_Chapter.html#Fig14).


    ![A978-1-4842-0529-7_8_Fig14_HTML.jpg](A978-1-4842-0529-7_8_Fig14_HTML.jpg)


    Figure 8-14.


    Power Query screen to import from File Folder Click Browse and select the `nyse_prices`
    folder from the desktop, as shown in Figure [8-15](#A978-1-4842-0529-7_8_Chapter.html#Fig15).
    Click OK.


    ![A978-1-4842-0529-7_8_Fig15_HTML.jpg](A978-1-4842-0529-7_8_Fig15_HTML.jpg)


    Figure 8-15.


    Folder screen The result is a list of `.csv` files, as shown in Figure [8-16](#A978-1-4842-0529-7_8_Chapter.html#Fig16).


    ![A978-1-4842-0529-7_8_Fig16_HTML.jpg](A978-1-4842-0529-7_8_Fig16_HTML.jpg)


    Figure 8-16.


    List of `.csv` files To open a file, click Binary in the leftmost column. For
    this example, select the file in the fifth row. The file is opened in the QueryEditor,
    and results are shown in Figure [8-17](#A978-1-4842-0529-7_8_Chapter.html#Fig17).
    Remember that the Query Editor can only contain a subset of the total number of
    records.


    ![A978-1-4842-0529-7_8_Fig17_HTML.jpg](A978-1-4842-0529-7_8_Fig17_HTML.jpg)


    Figure 8-17.


    CSV file imported into Query Editor Note that this file contains the opening,
    high, low, and closing stock price and volume for each stock on a given day. For
    this example, all rows and columns will be retained. Click Close & Load to load
    the records from the Query Editor into a spreadsheet. The results are shown in
    Figure [8-18](#A978-1-4842-0529-7_8_Chapter.html#Fig18).


    ![A978-1-4842-0529-7_8_Fig18_HTML.jpg](A978-1-4842-0529-7_8_Fig18_HTML.jpg)


    Figure 8-18.


    Data loaded into spreadsheet


    ## Group By


    To group by a specific category, go into the Query Editor and follow these steps:


    Reopen the Query Editor, by clicking Launch Editor on the Power Query tab. Then
    click Transform and Select Group By at the left end of the ribbon. In the Group
    By dialog, select the `stock_symbol` column as the Group By criteria and leave
    the default as Count, as shown in Figure [8-19](#A978-1-4842-0529-7_8_Chapter.html#Fig19).


    ![A978-1-4842-0529-7_8_Fig19_HTML.jpg](A978-1-4842-0529-7_8_Fig19_HTML.jpg)


    Figure 8-19.


    Group By dialog Click OK, and the results shown in Figure [8-20](#A978-1-4842-0529-7_8_Chapter.html#Fig20)
    will appear.


    ![A978-1-4842-0529-7_8_Fig20_HTML.jpg](A978-1-4842-0529-7_8_Fig20_HTML.jpg)


    Figure 8-20.


    Results after doing a Group By on `stock_symbol`


    ## Importing JSON


    This example shows how to use Power Query to extract JSON data from a web site.
    Figure [8-21](#A978-1-4842-0529-7_8_Chapter.html#Fig21) shows the raw JSON data
    on Nobel Prize winners.


    ![A978-1-4842-0529-7_8_Fig21_HTML.jpg](A978-1-4842-0529-7_8_Fig21_HTML.jpg)


    Figure 8-21.


    Raw JSON data


    To import the data using Power Query, follow these steps:


    Click the Power Query tab. Click From Web and enter the following URL, as shown
    in Figure [8-22](#A978-1-4842-0529-7_8_Chapter.html#Fig22), and click OK:


    ![A978-1-4842-0529-7_8_Fig22_HTML.jpg](A978-1-4842-0529-7_8_Fig22_HTML.jpg)


    Figure 8-22.


    Importing using the From Web option [`http://api.nobelprize.org/v1/laureate.json`](http://api.nobelprize.org/v1/laureate.json)
    The Query Editor will open. Click the Into Table icon at the upper left of the
    ribbon, as shown in Figure [8-23](#A978-1-4842-0529-7_8_Chapter.html#Fig23).


    ![A978-1-4842-0529-7_8_Fig23_HTML.jpg](A978-1-4842-0529-7_8_Fig23_HTML.jpg)


    Figure 8-23.


    The Convert screen for importing JSON The result, which displays only the column
    heading, is shown in Figure [8-24](#A978-1-4842-0529-7_8_Chapter.html#Fig24).


    ![A978-1-4842-0529-7_8_Fig24_HTML.jpg](A978-1-4842-0529-7_8_Fig24_HTML.jpg)


    Figure 8-24.


    Top-level JSON import Notice the expand button to the right of Value. Click that
    expand button. The results are shown in Figure [8-25](#A978-1-4842-0529-7_8_Chapter.html#Fig25).


    ![A978-1-4842-0529-7_8_Fig25_HTML.jpg](A978-1-4842-0529-7_8_Fig25_HTML.jpg)


    Figure 8-25.


    JSON column list Click the expand button again. The results are shown in Figure
    [8-26](#A978-1-4842-0529-7_8_Chapter.html#Fig26).


    ![A978-1-4842-0529-7_8_Fig26_HTML.jpg](A978-1-4842-0529-7_8_Fig26_HTML.jpg)


    Figure 8-26.


    Select columns dialog box Accept the defaults and click OK to get the results
    shown in Figure [8-27](#A978-1-4842-0529-7_8_Chapter.html#Fig27), which shows
    the actual records, with a single row for each Nobel laureate.


    ![A978-1-4842-0529-7_8_Fig27_HTML.jpg](A978-1-4842-0529-7_8_Fig27_HTML.jpg)


    Figure 8-27.


    JSON data in rows and columns. Scroll all the way to the right to find another
    expand button, as shown in Figure [8-28](#A978-1-4842-0529-7_8_Chapter.html#Fig28).


    ![A978-1-4842-0529-7_8_Fig28_HTML.jpg](A978-1-4842-0529-7_8_Fig28_HTML.jpg)


    Figure 8-28.


    Additonal columns Clicking this expand button will generate multiple rows for
    persons who won the Nobel Prize more than once, as shown in Figure [8-29](#A978-1-4842-0529-7_8_Chapter.html#Fig29).


    ![A978-1-4842-0529-7_8_Fig29_HTML.jpg](A978-1-4842-0529-7_8_Fig29_HTML.jpg)


    Figure 8-29.


    Expanded view with multiple rows for recipients of multiple Nobel Prizes Scrolling
    to the right, clicking the expand button again, and accepting the defaults, as
    shown in Figure [8-30](#A978-1-4842-0529-7_8_Chapter.html#Fig30), will expand
    some of the fields that were not shown before, such as the reason for the prize.


    ![A978-1-4842-0529-7_8_Fig30_HTML.jpg](A978-1-4842-0529-7_8_Fig30_HTML.jpg)


    Figure 8-30.


    Further expanding the rows The results are shown in Figure [8-31](#A978-1-4842-0529-7_8_Chapter.html#Fig31).


    ![A978-1-4842-0529-7_8_Fig31_HTML.jpg](A978-1-4842-0529-7_8_Fig31_HTML.jpg)


    Figure 8-31.


    Display showing reason (motivation) for Nobel Prize Decisions can be made about
    how to group the data. For example, to group the data by category, click the heading
    of the category column to select the desired category, then right-click and select
    Group By to see the Group By... dialog, as shown in Figure [8-32](#A978-1-4842-0529-7_8_Chapter.html#Fig32).


    ![A978-1-4842-0529-7_8_Fig32_HTML.jpg](A978-1-4842-0529-7_8_Fig32_HTML.jpg)


    Figure 8-32.


    Group By... dialog with single field Clicking OK will show a count of the prizes
    by category, as in Figure [8-33](#A978-1-4842-0529-7_8_Chapter.html#Fig33).


    ![A978-1-4842-0529-7_8_Fig33_HTML.jpg](A978-1-4842-0529-7_8_Fig33_HTML.jpg)


    Figure 8-33.'
