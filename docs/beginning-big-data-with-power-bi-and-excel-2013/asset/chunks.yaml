    2D chart Exercise 9-3\. Plotting European Unemployment Rates Example


    This example will show how to load data about European unemployment rates into
    Power Query and how to plot it using Power Map. It will also show how to unpivot
    data in order to add a time animation. Follow these steps:


    Click the Power Query tab and select Data Catalog Search.   Type “European Unemployment”
    into the search box. Hover the mouse over each of the results to get a preview
    of the data, as shown in Figure [9-17](#A978-1-4842-0529-7_9_Chapter.html#Fig17).


