  trans: '

    ### 启用 Excel 分析工具库


    在使用前，必须将其激活。


    要启用 Excel 分析工具库，请按照以下步骤操作：


    点击 `文件` 选项卡，进入 Backstage 视图。在左侧窗格底部点击 `选项`。在左侧窗格中选择 `加载项`。在窗口底部，选择 `Excel 加载项`
    并点击 `转到`，如图 10-7 所示。


    ![A978-1-4842-0529-7_10_Fig7_HTML.jpg](img/A978-1-4842-0529-7_10_Fig7_HTML.jpg)


    **图 10-7.** Excel 加载项界面


    选择 `分析工具库`，如图 10-8 所示，然后点击 `确定`。


    ![A978-1-4842-0529-7_10_Fig8_HTML.jpg](img/A978-1-4842-0529-7_10_Fig8_HTML.jpg)


    **图 10-8.** 加载项弹出窗口


    激活后，现在可以通过点击 Excel 中 `数据` 选项卡右侧的 `数据分析` 来访问分析工具库。


    ### 一个简单的示例


    以下示例将演示如何使用 Excel 分析工具库分析一些示例测试分数。


    **练习 10-1.** 使用分析工具库


    按照以下步骤分析测试分数：


    点击 `数据` 选项卡右侧的 `数据分析`。当 `数据分析` 窗口出现时，选择 `描述统计`，如图 10-9 所示。


    ![A978-1-4842-0529-7_10_Fig9_HTML.jpg](img/A978-1-4842-0529-7_10_Fig9_HTML.jpg)


    **图 10-9.** 数据分析工具


    点击 `确定`。在 `描述统计` 对话框中，指定输入区域和输出区域，选择汇总统计，如图 10-10 所示，然后点击 `确定`。


    ![A978-1-4842-0529-7_10_Fig10_HTML.jpg](img/A978-1-4842-0529-7_10_Fig10_HTML.jpg)


    **图 10-10.** 描述统计对话框


    结果如图 10-11 所示。


    ![A978-1-4842-0529-7_10_Fig11_HTML.jpg](img/A978-1-4842-0529-7_10_Fig11_HTML.jpg)


    **图 10-11.** 描述统计输出


    要使用数据分析工具库绘制直方图，请转到 `数据` 选项卡并点击 `数据分析`。选择 `直方图`，如图 10-12 所示。


    ![A978-1-4842-0529-7_10_Fig12_HTML.jpg](img/A978-1-4842-0529-7_10_Fig12_HTML.jpg)


    **图 10-12.** 从数据分析对话框中选择直方图


    定义区域并选择图表输出，如图 10-13 所示，然后点击 `确定`。


    ![A978-1-4842-0529-7_10_Fig13_HTML.jpg](img/A978-1-4842-0529-7_10_Fig13_HTML.jpg)


    **图 10-13.** 直方图对话框


    结果如图 10-14 所示。此操作设置了用于对数据进行分类的组距（即类别），这些类别将用于绘制直方图。


    ![A978-1-4842-0529-7_10_Fig14_HTML.jpg](img/A978-1-4842-0529-7_10_Fig14_HTML.jpg)


    **图 10-14.** 直方图


    ### 分析工具库的其他功能


    分析工具库还包含其他功能。以下列出了一些最常用的功能：


    *   方差分析工具提供不同类型的方差分析。它们用于检验两个样本选择的随机性。

    *   相关系数是介于 -1 和 +1 之间的一个值，用于衡量两个变量之间的相关强度。+1 表示完全正相关，意味着两个变量同步变动。-1 表示完全负相关，意味着两个变量反向变动。正相关并不能证明因果关系。Excel
    的 `CORREL` 函数也可用于计算相关系数。

    *   协方差衡量的是两个随机变量共同变化的程度。

    *   指数平滑类似于移动平均，用于预测时间序列中的下一个值。


    ## 使用数据透视表创建直方图


    数据透视表也可用于创建更定制化的直方图。


    **练习 10-2.** 一个定制化的测试分数直方图示例


    按照以下步骤创建一个显示测试分数分布的直方图：


    突出显示要绘制图表的数据。选择 `插入` 选项卡并点击 `数据透视表`。确认区域并将数据透视表放置在同一工作表的 F3 位置，如图 10-15 所示。


    ![A978-1-4842-0529-7_10_Fig15_HTML.jpg](img/A978-1-4842-0529-7_10_Fig15_HTML.jpg)


    **图 10-15.** 创建数据透视表对话框


    将分数拖到 `行` 框中，如图 10-16 所示。


