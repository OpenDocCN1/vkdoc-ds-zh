- fmt: '# Scatter Chart


    It is possible to see the visual relationship between two variables by plotting
    a scatter chart and then allowing the program to calculate the `R-squared` value.
    `R-squared` is a statistical measure of how close the data are to the fitted regression
    line—the best-fitting straight line through the points. It is also known as the
    coefficient of determination. `R-squared` values range from 0 to 100. An `R-squared`
    value of 100 means that all movements of one value are completely explained by
    movements of the other variable. `X` is the independent variable, and `y` is the
    dependent variable.


    ## Exercise 10-3. Grade-Absence Relationship Scatter Chart Example


    This example explores whether there is a relationship between class absences and
    numeric grades, with 1 being the lowest grade and 4 the highest. The grade data
    is shown in Figure [10-22](#A978-1-4842-0529-7_10_Chapter.html#Fig22).


    ![A978-1-4842-0529-7_10_Fig22_HTML.jpg](A978-1-4842-0529-7_10_Fig22_HTML.jpg)


    **Figure 10-22.** Grade and absence data


    Follow these steps:


    Highlight the data, click the **Insert** tab, and select **Scatter (X, Y)**, as
    shown in Figure [10-23](#A978-1-4842-0529-7_10_Chapter.html#Fig23).


    ![A978-1-4842-0529-7_10_Fig23_HTML.jpg](A978-1-4842-0529-7_10_Fig23_HTML.jpg)


    **Figure 10-23.** Insert Scatter (X, Y) or Bubble Chart option


    Select the **Scatter** option, as shown in Figure [10-24](#A978-1-4842-0529-7_10_Chapter.html#Fig24).


    ![A978-1-4842-0529-7_10_Fig24_HTML.jpg](A978-1-4842-0529-7_10_Fig24_HTML.jpg)


    **Figure 10-24.** Select Scatter option


    Click the `+` sign at the upper right of the chart and select **Axis Titles**,
    as shown in Figure [10-25](#A978-1-4842-0529-7_10_Chapter.html#Fig25).


    ![A978-1-4842-0529-7_10_Fig25_HTML.jpg](A978-1-4842-0529-7_10_Fig25_HTML.jpg)


    **Figure 10-25.** Select Axis Titles


    Click the **Axis Title** on the horizontal or `x` axis and change it to **Absences**.
    Change the label on the vertical, or `y`, axis to **Grades** and change the chart
    title to "Relationship between Grade and Absences," as shown in Figure [10-26](#A978-1-4842-0529-7_10_Chapter.html#Fig26).


    ![A978-1-4842-0529-7_10_Fig26_HTML.jpg](A978-1-4842-0529-7_10_Fig26_HTML.jpg)


    **Figure 10-26.** Chart with title


    Right-click the plot area and select **Add Trendline…**, as shown in Figure [10-27](#A978-1-4842-0529-7_10_Chapter.html#Fig27).


    ![A978-1-4842-0529-7_10_Fig27_HTML.jpg](A978-1-4842-0529-7_10_Fig27_HTML.jpg)


    **Figure 10-27.** Select Add Trendline…


    In the **Format Trendline** pane on the right, scroll down and select **Display
