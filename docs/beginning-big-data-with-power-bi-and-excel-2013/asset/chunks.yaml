    based on product ID. To create a Pivot Table based on these two tables, do the
    following:


    Click Pivot Table on the File tab in the PowerPivot window and select PivotTable
    from the menu.   Click OK to put the Pivot Table in a new worksheet.   Click the
    arrow next to the products table in the Pivot Table Fields pane and drag the ProductName
    field to the Rows box. Then scroll up to go to the inventory table, click the
    left arrow to show the fields, and drag OnHand to the Values box. The results
    are shown in Figure [4-13](#A978-1-4842-0529-7_4_Chapter.html#Fig13), which indicates
    the sum of the on-hand values for each product.


    ![A978-1-4842-0529-7_4_Fig13_HTML.jpg](A978-1-4842-0529-7_4_Fig13_HTML.jpg)


    Figure 4-13.


    PivotTable showing product name and on-hand quantity'
