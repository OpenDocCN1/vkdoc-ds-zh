    # 11. HDInsight


    [Chapter 1](#A978-1-4842-0529-7_1_Chapter.html) described Hadoop as an open source
    distributed file system that allows processing of vast amounts of data. Microsoft''s
    implementation of Hadoop on its Azure cloud platform is called `HDInsight`, which
    is designed to handle large amounts of data in the cloud. `HDInsight` uses Azure
    blob storage for storing the data, to make Hadoop available as a service in the
    cloud. Azure is useful for storing large datasets in the cloud in a cost-effective
    manner. Microsoft only charges for resources actually used.


    Apache Hive supports analysis of large datasets stored in Hadoop. Hive is a data
    warehouse infrastructure built on top of Hadoop for providing data summarization,
    query, and analysis. Originally developed by Facebook, it is now an open source
    Apache project.


    This chapter explores the easiest way to export data for analysis from Azure `HDInsight`
    into Excel.


    ## Getting a Free Azure Account


    Earlier chapters covered how to use the Azure Data Marketplace, which is essentially
    free for certain databases. The example in this chapter requires an Azure account.
    A 30-day trial account can be obtained by going to [`https://azure.microsoft.com/en-us/pricing/free-trial/`](https://azure.microsoft.com/en-us/pricing/free-trial/).


    The screen shown in Figure [11-1](#A978-1-4842-0529-7_11_Chapter.html#Fig1) will
    appear.


    ![A978-1-4842-0529-7_11_Fig1_HTML.jpg](A978-1-4842-0529-7_11_Fig1_HTML.jpg)


    Figure 11-1. Azure free trial screen as of July 2015


    Click `Try It now`, and you will be prompted to enter your information to set
    up a free one-month trial.


    ## Importing Hadoop Files into Power Query


    This example shows how to run a Hive query on a large dataset, using an `HDInsight`
    on Windows Azure Blob Storage. It then demonstrates how to use Power Query to
    import the data into Excel, so that it can be analyzed using Pivot Tables and
    Power Map.


    ### Creating an Azure Storage Account


    To do this tutorial, you need the Windows Azure account just created.


    Sign in to the Azure portal [`https://manage.windowsazure.com`](https://manage.windowsazure.com/).
    The screen shown in Figure [11-2](#A978-1-4842-0529-7_11_Chapter.html#Fig2) will
    appear. Log in with your Azure credentials.


    ![A978-1-4842-0529-7_11_Fig2_HTML.jpg](A978-1-4842-0529-7_11_Fig2_HTML.jpg)


    Figure 11-2. Microsoft Azure portal


    After logging in, click `+NEW` at the lower left-hand corner of the Azure portal
    screen, as shown in Figure [11-3](#A978-1-4842-0529-7_11_Chapter.html#Fig3). Highlight
    the new account and click `Manage Access Keys` at the bottom of the screen. The
    `Manage Access Keys` pop-up will appear, as shown in Figure [11-6](#A978-1-4842-0529-7_11_Chapter.html#Fig6).
    Notice the primary and secondary access keys. Clicking the icon to the right of
    the key will copy it to the clipboard. Click the check mark at the bottom right
    of the screen, to close the window.


    ![A978-1-4842-0529-7_11_Fig6_HTML.jpg](A978-1-4842-0529-7_11_Fig6_HTML.jpg)


    Figure 11-6. Manage Access Keys


    Click `Create Storage Account` in the lower right and wait for the account to
    be created. The resulting screen will appear, as shown in Figure [11-5](#A978-1-4842-0529-7_11_Chapter.html#Fig5).


    ![A978-1-4842-0529-7_11_Fig5_HTML.jpg](A978-1-4842-0529-7_11_Fig5_HTML.jpg)


    Figure 11-5. New storage account


    Select `Data Services` ➤ `Storage` and `Quick Create`, as shown in Figure [11-4](#A978-1-4842-0529-7_11_Chapter.html#Fig4).
    Enter a unique name for the URL. This example will use `testhive`. Select a location
    closest to where you are.


    ![A978-1-4842-0529-7_11_Fig4_HTML.jpg](A978-1-4842-0529-7_11_Fig4_HTML.jpg)


    Figure 11-4. Setting up a storage account in Azure


    ![A978-1-4842-0529-7_11_Fig3_HTML.jpg](A978-1-4842-0529-7_11_Fig3_HTML.jpg)


    Figure 11-3. Azure portal screen'
