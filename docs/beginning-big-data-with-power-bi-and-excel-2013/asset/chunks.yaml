    ## Summary


    This chapter has only begun to scratch the surface of the ability of Excel to
    calculate statistical values by using the Excel Analysis ToolPak. It has shown
    how to create visual displays of data, using the built-in charting tools. It has
    shown how to determine whether there is a relationship between two values. An
    entire book could be written on these topics.


    # 11. HDInsight


    [Chapter 1](#A978-1-4842-0529-7_1_Chapter.html) described Hadoop as an open source
    distributed file system that allows processing of vast amounts of data. Microsoft’s
    implementation of Hadoop on its Azure cloud platform is called HDInsight, which
    is designed to handle large amounts of data in the cloud. HDInsight uses Azure
    blob storage for storing the data, to make Hadoop available as a service in the
    cloud. Azure is useful for storing large datasets in the cloud in a cost-effective
    manner. Microsoft only charges for resources actually used.


    Apache Hive supports analysis of large datasets stored in Hadoop. Hive is a data
    warehouse infrastructure built on top of Hadoop for providing data summarization,
    query, and analysis. Originally developed by Facebook, it is now an open source
    Apache project.


    This chapter explores the easiest way to export data for analysis from Azure HDInsight
    into Excel.


