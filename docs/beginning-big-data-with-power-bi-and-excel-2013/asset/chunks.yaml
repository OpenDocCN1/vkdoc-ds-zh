    \ allows the creation of 2D and 3D visualizations by plotting Excel-based geospatial\
    \ data on a map, using Bing Map technology. This chapter demonstrates how to import\
    \ data using Power Query and then how to plot it using Power Map.\n\n## Installing\
    \ Power Map\n\nPower Map is accessed through an icon on the Excel Insert tab.\
    \ If that icon is not displayed, it may mean that you do not have the current\
    \ version of Power Map installed. If that is the case, do a search on “download\
    \ Power Map” and download the latest version from Microsoft. Then, to enable Power\
    \ Map, follow these steps:\n\nClick the File tab to see the Backstage View.  \
    \ Click Options at the bottom of the left pane.   Select Add-Ins on the left pane.\
    \   At the bottom of the window, pull down the arrow after Manage, select Com\
    \ Add-Ins, and click Go.   Check Microsoft Office PowerPivot for Excel 2013, Microsoft\
    \ Power Map for Excel and Power View, and click OK.\n\n## Plotting a Map\n\nThe\
    \ steps to plotting a map include the following:\n\nOpen a data source, which\
    \ may be a spreadsheet or a data model that includes geographic descriptors, such\
    \ as city and state or geographic coordinates.   Select the Insert tab and click\
    \ Map and Load Power Map.   In the Fields list pane on the right side of the screen,\
    \ select geographic fields to map to, such as city and state or geographic coordinates,\
    \ and then select a data metric, such as population. Power Map calls Bing Map\
    \ services to locate the geographic locations on a map, and then the metric value\
    \ is plotted.   By default, a column chart is displayed. This can be changed to\
    \ a bubble chart or heat map by clicking the appropriate icon.  \n\nA Power Map\
    \ video tour is an animation that tells a story about data by linking individual\
    \ maps. A video can be created to tell a story based on the data. A video is a\
    \ collection of tours, and a tour is a collection of scenes.\n\n## Key Power Map\
    \ Ribbon Options\n\nThis section highlights some of the key options on the Power\
    \ Map ribbon, which is shown in Figure [9-1](#A978-1-4842-0529-7_9_Chapter.html#Fig1).\n\
    \n*   Tour Section\n    *   Play Tour. Plays a tour already created\n    *   Add\
    \ Scene. Adds a scene to a tour\n    *   Create Video. Creates a video from tours\n\
    *   Map Section\n    *   Themes. Changes the map style\n    *   Map Labels. Adds\
    \ country or city names\n    *   Flat Map. Switches between 2D and 3D views\n\
    *   Layer Section\n    *   Add Layer. Adds a new layer\n    *   Refresh Data.\
    \ Refreshes data from the source\n    *   Shapes. Selects the shape of the bar\
    \ chart\n*   Insert Section\n    *   2D Chart. Adds a 2D chart\n    *   Text Box.\
    \ Adds a text box on the map\n    *   Legend. Adds a legend to the map\n*   Time\
    \ Section\n    *   Time Line. Shows or hides the time line in a time animation\n\
    \    *   Date & Time. Shows or adds the date and time in a time animation\n* \
    \  View Section\n    *   Tour Editor. Displays or hides the Tour Editor pane (left\
    \ side of screen)\n    *   Layer Pane. Displays or hides the Layer Pane (right\
    \ side of screen)\n\n![A978-1-4842-0529-7_9_Fig1_HTML.jpg](A978-1-4842-0529-7_9_Fig1_HTML.jpg)\n\
    \nFigure 9-1.\n\nPower Map ribbon"
  trans: "\n# 按类别统计的诺贝尔奖数量\n\n通过点击`Group By...`（分组依据）对话框中的加号来选择第二个字段，即可按两个字段（例如类别和年份）进行分组，如图\
    \ 8-34 所示。可再次点击屏幕右侧`查询设置`窗格中`应用的步骤`列表底部`分组行`后的齿轮图标，以重新打开`Group By...`对话框。\n\n\
    ![A978-1-4842-0529-7_8_Fig34_HTML.jpg](img/A978-1-4842-0529-7_8_Fig34_HTML.jpg)\n\
    \n**图 8-34.** 包含两个字段的`Group By`对话框\n\n结果如图 8-35 所示。\n\n![A978-1-4842-0529-7_8_Fig35_HTML.jpg](img/A978-1-4842-0529-7_8_Fig35_HTML.jpg)\n\
    \n**图 8-35.** 按类别和年份统计的诺贝尔奖数量\n\n若要添加第三个字段以显示获奖者姓名，请在`Group By...`对话框中再次选择`+`，并添加获奖者的姓氏，如图\
    \ 8-36 所示。\n\n![A978-1-4842-0529-7_8_Fig36_HTML.jpg](img/A978-1-4842-0529-7_8_Fig36_HTML.jpg)\n\
    \n**图 8-36.** 包含三个字段的`Group By...`对话框\n\n结果如图 8-37 所示。\n\n![A978-1-4842-0529-7_8_Fig37_HTML.jpg](img/A978-1-4842-0529-7_8_Fig37_HTML.jpg)\n\
    \n**图 8-37.** 按类别和年份显示诺贝尔奖及获奖者姓氏\n\n## 小结\n\n本章演示了如何使用 Power Query 从网站导入表格、从文件夹导入多个\
    \ CSV 文件以及导入 JSON 数据。这些示例展示了如何使用 Power Query 进行提取、转换和加载数据。后续章节将提供更多使用 Power Query\
    \ 的示例。\n\n# 9. Power Map\n\nPower Map 是一个强大的可视化工具，它利用必应地图技术，通过在三维地球仪上绘制基于 Excel\
    \ 的地理空间数据，创建二维和三维可视化效果。本章将演示如何使用 Power Query 导入数据，然后使用 Power Map 进行绘制。\n\n## 安装\
    \ Power Map\n\n可以通过 Excel `插入`选项卡上的图标访问 Power Map。如果该图标未显示，则可能意味着您未安装当前版本的 Power\
    \ Map。如果是这种情况，请搜索“下载 Power Map”，并从 Microsoft 下载最新版本。然后，按照以下步骤启用 Power Map：\n\n\
    1.  单击`文件`选项卡以进入 Backstage 视图。\n2.  单击左侧窗格底部的`选项`。\n3.  在左侧窗格中选择`加载项`。\n4.  在窗口底部，下拉`管理`后的箭头，选择`COM\
    \ 加载项`，然后单击`转到`。\n5.  勾选`Microsoft Office PowerPivot for Excel 2013`、`Microsoft\
    \ Power Map for Excel`和`Power View`，然后单击`确定`。\n\n## 绘制地图\n\n绘制地图的步骤包括：\n\n1. \
    \ 打开数据源，该数据源可以是包含地理描述符（如城市和州或地理坐标）的电子表格或数据模型。\n2.  选择`插入`选项卡，单击`地图`，再单击`加载 Power\
    \ Map`。\n3.  在屏幕右侧的`字段`列表窗格中，选择要映射到的地理字段（例如城市和州或地理坐标），然后选择一个数据指标（例如人口）。Power Map\
    \ 会调用必应地图服务来定位地图上的地理位置，然后绘制指标值。\n4.  默认情况下，会显示柱形图。可以通过单击相应的图标将其更改为气泡图或热力图。\n\n\
    Power Map 视频导览是一种通过链接单个地图来讲述数据故事的动画。可以根据数据创建视频来讲述故事。一个视频是导览的集合，而一个导览是场景的集合。\n\n\
    ## Power Map 功能区重要选项\n\n本节重点介绍 Power Map 功能区中的一些重要选项，如图 9-1 所示。\n\n-   **导览部分**\n\
    \    -   `播放导览`：播放已创建的导览。\n    -   `添加场景`：向导览添加一个场景。\n    -   `创建视频`：从导览创建视频。\n\
    -   **地图部分**\n    -   `主题`：更改地图样式。\n    -   `地图标签`：添加国家或城市名称。\n    -   `平面地图`：在二维和三维视图之间切换。\n\
    -   **图层部分**\n    -   `添加图层`：添加新图层。\n    -   `刷新数据`：从源刷新数据。\n    -   `形状`：选择条形图的形状。\n\
    -   **插入部分**\n    -   `二维图表`：添加二维图表。\n    -   `文本框`：在地图上添加文本框。\n    -   `图例`：在地图上添加图例。\n\
    -   **时间部分**\n    -   `时间线`：在时间动画中显示或隐藏时间线。\n    -   `日期和时间`：在时间动画中显示或添加日期和时间。\n\
    -   **视图部分**\n    -   `导览编辑器`：显示或隐藏`导览编辑器`窗格（屏幕左侧）。\n    -   `图层窗格`：显示或隐藏`图层窗格`（屏幕右侧）。\n\
    \n![A978-1-4842-0529-7_9_Fig1_HTML.jpg](img/A978-1-4842-0529-7_9_Fig1_HTML.jpg)\n\
    \n**图 9-1.** Power Map 功能区\n"
- fmt: '# Troubleshooting


    Power Map is very particular about data types. If numeric data that you want to
    plot is not treated as numeric data, as evidenced by only showing a count aggregation,
    or if time data is not recognized, follow these steps:


    Check for any extraneous string data in the column and delete the row containing
    string data. Make sure that a numeric data column is formatted as a number and
    that a date column is formatted as date. After changing the format, click `Refresh
    Data` on the Power Map ribbon.


    ## Exercise 9-1: Mapping California Crime Statistics Example


    This example shows how to use Power Query to import California crime statistics
    by city and how to use Power Map to plot the data.


    Go to Power Query and do a Data Catalog search on `“California Cities by Population
    and Crime Rate.”` Hover your mouse over `“Cities—California locations by crime
    rate”` and select `Edit` to load into the Query Editor. The screen shown in Figure
    [9-2](#A978-1-4842-0529-7_9_Chapter.html#Fig2) will appear.


    ![A978-1-4842-0529-7_9_Fig2_HTML.jpg](A978-1-4842-0529-7_9_Fig2_HTML.jpg)


    **Figure 9-2.** Crime Statistics in Query Editor


    In Query Editor, click the `Add Column` tab. On the left end of the tab, click
    `Add Custom Column`. Create a new column for state. Set the contents `="CA"`,
    as shown in Figure [9-3](#A978-1-4842-0529-7_9_Chapter.html#Fig3).


    ![A978-1-4842-0529-7_9_Fig3_HTML.jpg](A978-1-4842-0529-7_9_Fig3_HTML.jpg)


    **Figure 9-3.** Adding a State column


    Check that the data type of all the numeric columns is a decimal number by right-clicking
    the column heading, selecting `Change Type`, and selecting `Decimal Number`. Also,
    check that there are no non-numeric values in numeric columns. When the data is
    the way you want it, click `Close & Load` on the ribbon, to load to a spreadsheet.
    The spreadsheet should appear as shown in Figure [9-4](#A978-1-4842-0529-7_9_Chapter.html#Fig4).


    ![A978-1-4842-0529-7_9_Fig4_HTML.jpg](A978-1-4842-0529-7_9_Fig4_HTML.jpg)


    **Figure 9-4.** Crime data loaded into spreadsheet


    Again, check for non-numeric values in number fields that could keep Power Map
    from interpreting the contents correctly. Because not all the rows are displayed
    in the Query Editor, for larger datasets, this has to be checked after loading
    the data into Excel. As shown in Figure [9-5](#A978-1-4842-0529-7_9_Chapter.html#Fig5),
    the last row of data may contain ellipses. If this is the case, delete that last
    row by right-clicking the row and selecting `Delete Table Row`.


    ![A978-1-4842-0529-7_9_Fig5_HTML.jpg](A978-1-4842-0529-7_9_Fig5_HTML.jpg)


    **Figure 9-5.** Ellipsis in the last row that has to be deleted


    Check the formatting of each column by highlighting the column, by clicking the
    letter at the top of the column. Right-click the selected column and select `Format
    Cells` from the Context menu. For the population, violent crimes, and property
    crimes columns, set the format to `Number`, with 0 places to the right of the
    point, as shown in Figure [9-6](#A978-1-4842-0529-7_9_Chapter.html#Fig6). For
    the violent crimes and property crimes per 1,000 persons, set the format to `Number`,
    with 2 places to the right of the point.


    ![A978-1-4842-0529-7_9_Fig6_HTML.jpg](A978-1-4842-0529-7_9_Fig6_HTML.jpg)


    **Figure 9-6.** Formatting column as number


    Click the `Insert` tab and select `Launch Power Map` under `Map`. If you have
    previously created a map, you may be prompted to create a `New Tour`. Accept the
    default of `City`, `County`, and `State` as the geographic fields, as shown in
    Figure [9-7](#A978-1-4842-0529-7_9_Chapter.html#Fig7). Click `Next`.


    ![A978-1-4842-0529-7_9_Fig7_HTML.jpg](A978-1-4842-0529-7_9_Fig7_HTML.jpg)


    **Figure 9-7.** Setting the geographic fields


    Click `Map Labels` on the ribbon to display city names. In the Layer pane, right-click
    `Property Crimes per 1,000 persons` and then click `Add to Height`, as shown in
    Figure [9-8](#A978-1-4842-0529-7_9_Chapter.html#Fig8). Note that the Bing Mapping
    service is showing a certainty of 94% for the geographic mapping in the upper
    right corner. If you want to go back and edit the geographic fields, click the
    icon above the 94%.


    ![A978-1-4842-0529-7_9_Fig8_HTML.jpg](A978-1-4842-0529-7_9_Fig8_HTML.jpg)


    **Figure 9-8.** Setting field for height of plot


    Click the legend box and resize it to be smaller, then drag it to the upper left
    part of the map. Click the large `+` on the lower right side of the map several
    times to zoom in. The results are shown in Figure [9-9](#A978-1-4842-0529-7_9_Chapter.html#Fig9).
    Note that it is possible to point the mouse at any graphic, to see the details
    about that city crime rate. It is also possible to double-click any location,
    to zoom in.


    ![A978-1-4842-0529-7_9_Fig9_HTML.jpg](A978-1-4842-0529-7_9_Fig9_HTML.jpg)


    **Figure 9-9.** Map with legend and detailed crime statistics


    ## Plotting Multiple Statistics


    It is possible to plot multiple metrics—both property crime and violent crime
    statistics. To do this, let’s continue with the example from the preceding section.


    ### Exercise 9-2: Mapping California Crime Statistics, Part 2


    You can plot the property crime and violent crime statistics by following these
    steps:


    In the Layer pane, right-click `Property crime rate per 1,000 persons` and select
    `Add to Height`, as shown in Figure [9-10](#A978-1-4842-0529-7_9_Chapter.html#Fig10).


    ![A978-1-4842-0529-7_9_Fig10_HTML.jpg](A978-1-4842-0529-7_9_Fig10_HTML.jpg)


    **Figure 9-10.** Adding violent crimes metric


    Note that the default view is stacked column. This can be changed to clustered
    column by clicking the icon to the right of stacked column, as shown in Figure
    [9-11](#A978-1-4842-0529-7_9_Chapter.html#Fig11). The property crime rate is shown
    in blue, and the violent crime rate in orange.


    ![A978-1-4842-0529-7_9_Fig11_HTML.jpg](A978-1-4842-0529-7_9_Fig11_HTML.jpg)


    **Figure 9-11.** Display of both property crime and violent crime metric


    Click `Add Scene` on the left end of the ribbon. Click the `Text Box` icon on
    the ribbon and add the title `“California Cities Crime Rates,”` as shown in Figure
    [9-12](#A978-1-4842-0529-7_9_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_9_Fig12_HTML.jpg](A978-1-4842-0529-7_9_Fig12_HTML.jpg)


    **Figure 9-12.** Adding a title to the map


    Change the view to the bubble view, which is like a pie chart. The text box can
    be resized and dragged to the appropriate location on the map, as shown in Figure
    [9-13](#A978-1-4842-0529-7_9_Chapter.html#Fig13).


    ![A978-1-4842-0529-7_9_Fig13_HTML.jpg](A978-1-4842-0529-7_9_Fig13_HTML.jpg)


    **Figure 9-13.** Bubble view of data


    The size of the bubbles can be adjusted by clicking the gear icon at the top right
    of the Layer pane, selecting `Layer Options`, and adjusting the size slider, as
    shown in Figure [9-14](#A978-1-4842-0529-7_9_Chapter.html#Fig14).


    ![A978-1-4842-0529-7_9_Fig14_HTML.jpg](A978-1-4842-0529-7_9_Fig14_HTML.jpg)


    **Figure 9-14.** Adjusting bubble size


    Click `Add Scene` on the left end of the ribbon. Another view is the heat map
    view shown in Figure [9-15](#A978-1-4842-0529-7_9_Chapter.html#Fig15). Note that
    San Francisco and Los Angeles, the two largest cities in California, have the
    most crime.


    ![A978-1-4842-0529-7_9_Fig15_HTML.jpg](A978-1-4842-0529-7_9_Fig15_HTML.jpg)


    **Figure 9-15.** Heat map view of data'
