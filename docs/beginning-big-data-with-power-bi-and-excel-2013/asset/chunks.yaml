    - **Power View。** 一种用于提取有意义的报告并创建仪表板某些元素的报告工具（参见第 6 章）。\n- **Power Query。** 一种用于从各种来源提取、转换和加载（ETL）数据的工具（参见第\
    \ 8 章）。\n- **Power Map。** 一种用于数据可视化的地图工具（参见第 9 章）。\n\n第 11 章演示了如何使用 HDInsight（微软在\
    \ Azure 云平台上运行的 Hadoop 实现）将大数据导入 Excel。\n\n本书针对 Excel 2013 编写，但书中包含的大多数示例也适用于\
    \ Excel 2010，前提是从微软下载了 PowerPivot、Power View、Power Query 和 Power Map 加载项。只需搜索“下载”和加载项名称即可找到下载链接。\n\
