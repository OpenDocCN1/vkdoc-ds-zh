    ### Importing into Excel


    There are several ways to import this data into Excel. This section will demonstrate
    how to download the file to a text file with fixed-length fields.


    Follow these steps:


    | Old Name | New Name |

    | --- | --- |

    | Column2 | Datetime |

    | Column4 | OS |

    | Column5 | Manufacturer |

    | Coluimn6 | Model |

    | Column7 | State |

    | Column 8 | Country |

    | Column10 | Accesses |


    Go back to the screen shown in Figure [11-12](#A978-1-4842-0529-7_11_Chapter.html#Fig12),
    by clicking Job History at the top of the screen and then clicking the query name.
    Then click Download File.   The Job Log for the download is shown in Figure [11-15](#A978-1-4842-0529-7_11_Chapter.html#Fig15),
    which reports that 59,793 rows were downloaded. The number you see may differ.


    ![A978-1-4842-0529-7_11_Fig15_HTML.jpg](A978-1-4842-0529-7_11_Fig15_HTML.jpg)


    Figure 11-15.


    Job Log for downloads   Click the blue box at the bottom of the screen labeled
    Download File. When prompted for the program to use to open the file, select Notepad.
    The result will appear in Notepad, as shown in Figure [11-16](#A978-1-4842-0529-7_11_Chapter.html#Fig16).
    This appears to be a log file for web site accesses.


    ![A978-1-4842-0529-7_11_Fig16_HTML.jpg](A978-1-4842-0529-7_11_Fig16_HTML.jpg)


    Figure 11-16.


    Log file for web site accesses   Do a Save As to save the file to the desktop,
    to make it easier to access.   Open Excel and click the Power Query tab. Select
    from File and then From Text and Browse to find the downloaded file.   The file
    will be loaded into the Query Editor, as shown in Figure [11-17](#A978-1-4842-0529-7_11_Chapter.html#Fig17).
    Note that Power Query parsed the fixed-length fields to neatly put all the data
    in separate columns, but there are no descriptive column headings.


    ![A978-1-4842-0529-7_11_Fig17_HTML.jpg](A978-1-4842-0529-7_11_Fig17_HTML.jpg)


