    # 从文件夹导入 CSV 文件


    有时候，Hadoop 数据会以逗号分隔值的形式存储在文件中。无需将这些逗号分隔值文件加载到 Hortonworks Sandbox 或其他产品中作为 Hadoop
    数据处理，而是可以**直接**使用 Power Query 将它们加载到 Excel 和 PowerPivot 中。下面的示例演示了如何操作。


    首先，从以下 URL 下载股票市场压缩文件：`s3.amazonaws.com/hortonassets/mstut/nyse.zip` 下载完成后，在浏览器的下载窗口中双击该文件将其打开，如图
    8-12 所示。


    ![A978-1-4842-0529-7_8_Fig12_HTML.jpg](img/A978-1-4842-0529-7_8_Fig12_HTML.jpg)


    图 8-12.


    下载窗口 将会下载两个包含 `.csv` 文件的文件夹，如图 8-13 所示。


    ![A978-1-4842-0529-7_8_Fig13_HTML.jpg](img/A978-1-4842-0529-7_8_Fig13_HTML.jpg)


    图 8-13.


    显示文件文件夹的窗口 将文件夹 `nyse_prices` 拖到桌面上，以便于访问。打开 Excel 并点击“Power Query”选项卡。选择“从文件”和“从文件夹”，如图
    8-14 所示。


    ![A978-1-4842-0529-7_8_Fig14_HTML.jpg](img/A978-1-4842-0529-7_8_Fig14_HTML.jpg)


    图 8-14.


    用于从文件文件夹导入的 Power Query 界面 点击“浏览”并从桌面选择 `nyse_prices` 文件夹，如图 8-15 所示。点击“确定”。


    ![A978-1-4842-0529-7_8_Fig15_HTML.jpg](img/A978-1-4842-0529-7_8_Fig15_HTML.jpg)


    图 8-15.


    文件夹界面 结果是一个 `.csv` 文件的列表，如图 8-16 所示。


    ![A978-1-4842-0529-7_8_Fig16_HTML.jpg](img/A978-1-4842-0529-7_8_Fig16_HTML.jpg)


    图 8-16.


    `.csv` 文件列表 要打开一个文件，请点击最左侧列中的“二进制”。在本示例中，选择第五行的文件。该文件将在查询编辑器中打开，结果如图 8-17 所示。请记住，查询编辑器只能包含总记录数的一个子集。


    ![A978-1-4842-0529-7_8_Fig17_HTML.jpg](img/A978-1-4842-0529-7_8_Fig17_HTML.jpg)


    图 8-17.


    导入查询编辑器的 CSV 文件 请注意，此文件包含每个股票在特定日期的开盘价、最高价、最低价、收盘价和成交量。在本示例中，将保留所有行和列。点击“关闭并加载”以将记录从查询编辑器加载到电子表格中。结果如图
    8-18 所示。


    ![A978-1-4842-0529-7_8_Fig18_HTML.jpg](img/A978-1-4842-0529-7_8_Fig18_HTML.jpg)


    图 8-18.


    数据已加载到电子表格中


    ## 分组依据


    要按特定类别分组，请进入查询编辑器并按照以下步骤操作：


    重新打开查询编辑器，点击“Power Query”选项卡上的“启动编辑器”。然后点击功能区左端的“转换”和“分组依据”。在“分组依据”对话框中，选择 `stock_symbol`
    列作为分组依据条件，并保留默认的“计数”选项，如图 8-19 所示。


    ![A978-1-4842-0529-7_8_Fig19_HTML.jpg](img/A978-1-4842-0529-7_8_Fig19_HTML.jpg)


    图 8-19.


    “分组依据”对话框 点击“确定”，将出现如图 8-20 所示的结果。


    ![A978-1-4842-0529-7_8_Fig20_HTML.jpg](img/A978-1-4842-0529-7_8_Fig20_HTML.jpg)


    图 8-20.


    对 `stock_symbol` 执行分组依据后的结果


    ## 导入 JSON


    此示例演示如何使用 Power Query 从网站提取 JSON 数据。图 8-21 显示了关于诺贝尔奖得主的原始 JSON 数据。


    ![A978-1-4842-0529-7_8_Fig21_HTML.jpg](img/A978-1-4842-0529-7_8_Fig21_HTML.jpg)


    图 8-21.


    原始 JSON 数据


    要使用 Power Query 导入数据，请按照以下步骤操作：


    点击“Power Query”选项卡。点击“从 Web”，输入以下 URL，如图 8-22 所示，然后点击“确定”：


    `http://api.nobelprize.org/v1/laureate.json`


    ![A978-1-4842-0529-7_8_Fig22_HTML.jpg](img/A978-1-4842-0529-7_8_Fig22_HTML.jpg)


    图 8-22.


    使用“从 Web”选项导入 查询编辑器将打开。点击功能区左上角的“到表”图标，如图 8-23 所示。


    ![A978-1-4842-0529-7_8_Fig23_HTML.jpg](img/A978-1-4842-0529-7_8_Fig23_HTML.jpg)


    图 8-23.


    用于导入 JSON 的“转换”界面 结果仅显示列标题，如图 8-24 所示。


    ![A978-1-4842-0529-7_8_Fig24_HTML.jpg](img/A978-1-4842-0529-7_8_Fig24_HTML.jpg)


    图 8-24.


    顶级 JSON 导入 请注意“值”右侧的展开按钮。点击那个展开按钮。结果如图 8-25 所示。


    ![A978-1-4842-0529-7_8_Fig25_HTML.jpg](img/A978-1-4842-0529-7_8_Fig25_HTML.jpg)


    图 8-25.


    JSON 列列表 再次点击展开按钮。结果如图 8-26 所示。


    ![A978-1-4842-0529-7_8_Fig26_HTML.jpg](img/A978-1-4842-0529-7_8_Fig26_HTML.jpg)


    图 8-26.


    “选择列”对话框 接受默认设置并点击“确定”，得到如图 8-27 所示的结果，该结果显示实际记录，每位诺贝尔奖得主对应一行。


    ![A978-1-4842-0529-7_8_Fig27_HTML.jpg](img/A978-1-4842-0529-7_8_Fig27_HTML.jpg)


    图 8-27.


    行和列中的 JSON 数据。一直滚动到右侧以找到另一个展开按钮，如图 8-28 所示。


    ![A978-1-4842-0529-7_8_Fig28_HTML.jpg](img/A978-1-4842-0529-7_8_Fig28_HTML.jpg)


    图 8-28.


    其他列 点击此展开按钮将为多次获得诺贝尔奖的人生成多行，如图 8-29 所示。


    ![A978-1-4842-0529-7_8_Fig29_HTML.jpg](img/A978-1-4842-0529-7_8_Fig29_HTML.jpg)


    图 8-29.


    为多次获得诺贝尔奖的获奖者生成的展开视图（含多行） 向右滚动，再次点击展开按钮，并接受默认设置，如图 8-30 所示，将展开之前未显示的一些字段，例如获奖原因。


    ![A978-1-4842-0529-7_8_Fig30_HTML.jpg](img/A978-1-4842-0529-7_8_Fig30_HTML.jpg)


    图 8-30.


    进一步展开行 结果如图 8-31 所示。


    ![A978-1-4842-0529-7_8_Fig31_HTML.jpg](img/A978-1-4842-0529-7_8_Fig31_HTML.jpg)


    图 8-31.


    显示诺贝尔奖原因（动机）的视图 可以决定如何对数据进行分组。例如，要按类别对数据进行分组，请点击类别列的标题以选择所需类别，然后右键单击并选择“分组依据”以查看“分组依据...”对话框，如图
    8-32 所示。


    ![A978-1-4842-0529-7_8_Fig32_HTML.jpg](img/A978-1-4842-0529-7_8_Fig32_HTML.jpg)


    图 8-32.


    包含单个字段的“分组依据...”对话框 点击“确定”将显示按类别划分的获奖数量计数，如图 8-33 所示。


    ![A978-1-4842-0529-7_8_Fig33_HTML.jpg](img/A978-1-4842-0529-7_8_Fig33_HTML.jpg)


    图 8-33.

