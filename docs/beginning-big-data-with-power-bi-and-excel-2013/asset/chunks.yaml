  trans: '

    # 配置 Hadoop 集群


    要配置 Hadoop 集群，请按以下步骤操作：


    点击屏幕左下角的 `+NEW`。选择 `Data Services` ➤ `HDInsight` ➤ `Hadoop`，然后在屏幕右侧填写相关值，如图 11-7
    所示。选择一个集群名称。本例中，两个节点就足够了。Azure 将默认用户名设置为 `Admin`。您需要创建一个至少十位字符的密码，其中至少包含一个大写字母、一个数字和一个特殊字符，并根据提示输入两次。请务必记住您输入的密码。


    ![A978-1-4842-0529-7_11_Fig7_HTML.jpg](img/A978-1-4842-0529-7_11_Fig7_HTML.jpg)


    图 11-7. 设置 HDInsight 集群


    点击屏幕右下角的 `Create HDInsight Cluster`。然后，集群创建后（可能需要 20 分钟或更长时间），将出现如图 11-8 所示的屏幕。


    ![A978-1-4842-0529-7_11_Fig8_HTML.jpg](img/A978-1-4842-0529-7_11_Fig8_HTML.jpg)


    图 11-8. 显示新集群


    从左侧窗格中点击 `HDInsight` 以查看集群列表，如图 11-9 所示。应显示刚刚创建的集群。


    ![A978-1-4842-0529-7_11_Fig9_HTML.jpg](img/A978-1-4842-0529-7_11_Fig9_HTML.jpg)


    图 11-9. HDInsight 集群列表


    选择刚刚创建的集群，然后点击屏幕底部的 `Query Console`。如果系统提示，请输入您的管理员用户名和密码。将出现如图 11-10 所示的屏幕。


    ![A978-1-4842-0529-7_11_Fig10_HTML.jpg](img/A978-1-4842-0529-7_11_Fig10_HTML.jpg)


    图 11-10. HDInsight 查询控制台


    向下滚动以查看“带示例数据的解决方案”。点击屏幕顶部的 `Hive Editor` 选项卡。在 Hive 编辑器中，输入一个查询名称，并接受默认的 SQL
    `Select * from hivesampletable` 以选择所有记录，如图 11-11 所示。


    ![A978-1-4842-0529-7_11_Fig11_HTML.jpg](img/A978-1-4842-0529-7_11_Fig11_HTML.jpg)


    图 11-11. 用于选择所有记录的 SQL 查询


    点击 `Submit`。要查看查询结果，请点击屏幕左下角的查询名称，如图 11-12 所示。


    ![A978-1-4842-0529-7_11_Fig12_HTML.jpg](img/A978-1-4842-0529-7_11_Fig12_HTML.jpg)


    图 11-12. 查询结果


    在 HD 查询控制台屏幕上，点击屏幕顶部的 `File Browser`。结果如图 11-13 所示。


    ![A978-1-4842-0529-7_11_Fig13_HTML.jpg](img/A978-1-4842-0529-7_11_Fig13_HTML.jpg)


    图 11-13. 集群列表


    点击左侧 `Name` 列中的第一项，然后点击您的集群名称，将得到如图 11-14 所示的结果。


    ![A978-1-4842-0529-7_11_Fig14_HTML.jpg](img/A978-1-4842-0529-7_11_Fig14_HTML.jpg)


    图 11-14. 集群中的文件列表


    # 导入到 Excel


    有多种方法可以将这些数据导入 Excel。本节将演示如何将文件下载为具有固定长度字段的文本文件。


    通过点击屏幕顶部的 `Job History`，然后点击查询名称，返回到图 11-12 所示的屏幕。然后点击 `Download File`。下载的作业日志如图
    11-15 所示，其中显示已下载了 59,793 行。您看到的数字可能有所不同。


    ![A978-1-4842-0529-7_11_Fig15_HTML.jpg](img/A978-1-4842-0529-7_11_Fig15_HTML.jpg)


    图 11-15. 下载作业日志


    点击屏幕底部标有 `Download File` 的蓝色框。当提示选择用于打开文件的程序时，选择记事本。结果将显示在记事本中，如图 11-16 所示。这似乎是一个网站访问日志文件。


    ![A978-1-4842-0529-7_11_Fig16_HTML.jpg](img/A978-1-4842-0529-7_11_Fig16_HTML.jpg)


    图 11-16. 网站访问日志文件


    执行 `Save As` 将文件保存到桌面，以便更容易访问。打开 Excel，然后点击 `Power Query` 选项卡。选择“从文件”，然后选择“从文本”，并浏览找到下载的文件。


    该文件将被加载到查询编辑器中，如图 11-17 所示。请注意，Power Query 解析了固定长度的字段，将数据整齐地放入单独的列中，但没有描述性的列标题。


    ![A978-1-4842-0529-7_11_Fig17_HTML.jpg](img/A978-1-4842-0529-7_11_Fig17_HTML.jpg)


    图 11-17. 文件加载到 Power Query 中


    要重命名关键列，请右键单击列标题，选择“重命名”，然后输入新的描述性名称，如下所示。


    | 旧名称 | 新名称 |

    | --- | --- |

    | Column2 | 日期时间 |

    | Column4 | 操作系统 |

    | Column5 | 制造商 |

    | Column6 | 型号 |

    | Column7 | 州/省 |

    | Column8 | 国家/地区 |

    | Column10 | 访问次数 |


    结果如图 11-18 所示。要将数据加载到电子表格中，请点击功能区左端的 `Close & Load`，然后选择 `Close & Load`。数据将被加载到电子表格中，如图
    11-19 所示。


    ![A978-1-4842-0529-7_11_Fig18_HTML.jpg](img/A978-1-4842-0529-7_11_Fig18_HTML.jpg)


    图 11-18. 重命名列后的 Power Query 编辑器


    ![A978-1-4842-0529-7_11_Fig19_HTML.jpg](img/A978-1-4842-0529-7_11_Fig19_HTML.jpg)


    图 11-19. 数据加载到电子表格中


    # 创建数据透视表


    要创建数据透视表以按州、制造商和型号分析访问次数，请按以下步骤操作：


    点击 `Insert` 和 `Pivot Table`。接受默认设置，将其放入新工作表中。将 `state` 拖到 `Columns` 框中，将 `manufacturer`
    和 `model` 拖到 `Rows` 框中，并将 `accesses` 拖到 `Values` 框中。结果（显示按制造商和型号划分的访问次数）如图 11-20
    所示。


    ![A978-1-4842-0529-7_11_Fig20_HTML.jpg](img/A978-1-4842-0529-7_11_Fig20_HTML.jpg)


    图 11-20. 显示按制造商和型号划分的访问次数的数据透视表


    # 在 Power Map 中创建地图


    此示例演示如何使用 Power Map 映射数据。请按以下步骤操作：


    将数据加载到电子表格后，点击 `Insert` 选项卡，然后点击 `Map` 和 `Launch Power Map`。接受默认设置，将“国家/地区”和“州/省”作为默认地理字段，然后点击“下一步”，如图
    11-21 所示。


    ![A978-1-4842-0529-7_11_Fig21_HTML.jpg](img/A978-1-4842-0529-7_11_Fig21_HTML.jpg)


    图 11-21. 选择地理字段


    点击 `Accesses` 作为高度，右键单击 `OS` 并选择 `Set as Category`，如图 11-22 所示，该图显示了平移到美国的地图。


    ![A978-1-4842-0529-7_11_Fig22_HTML.jpg](img/A978-1-4842-0529-7_11_Fig22_HTML.jpg)


    图 11-22. 显示美国按操作系统划分的访问次数的地图


    欧洲的类似显示如图 11-23 所示。


    ![A978-1-4842-0529-7_11_Fig23_HTML.jpg](img/A978-1-4842-0529-7_11_Fig23_HTML.jpg)


    图 11-23. 显示欧洲按操作系统划分的访问次数的地图


    如果您用完了刚刚创建的 HDInsight 集群，请将其删除，以免产生费用。


    # 总结


    本章仅浅显地涉及了在 Azure 中创建和访问 Hadoop 集群，以及将数据导入 Excel 和 Power Query 进行使用数据透视表和 Power
    Map 分析、以提供按操作系统分类的数据图形显示的强大功能。

    '
