    # 散点图


    通过绘制散点图并让程序计算`R-squared`值，可以直观地观察两个变量之间的关系。`R-squared`是一种统计指标，用于衡量数据点与拟合回归线（即穿过数据点的最佳拟合直线）的接近程度，也称为决定系数。其取值范围为
    0 到 100。若`R-squared`值为 100，则表示一个变量的所有变动完全由另一个变量的变动所解释。`X`为自变量，`y`为因变量。


    ## 练习 10-3 成绩与缺勤关系散点图示例


    本示例探讨课堂缺勤次数与数字成绩之间是否存在关系，其中 1 为最低分，4 为最高分。成绩数据如图 10-22 所示。


    ![A978-1-4842-0529-7_10_Fig22_HTML.jpg](img/A978-1-4842-0529-7_10_Fig22_HTML.jpg)


    图 10-22 成绩与缺勤数据


    请按以下步骤操作：


    选中数据，点击`插入`选项卡，然后选择`散点图（X，Y）`，如图 10-23 所示。


    ![A978-1-4842-0529-7_10_Fig23_HTML.jpg](img/A978-1-4842-0529-7_10_Fig23_HTML.jpg)


    图 10-23 插入散点图（X，Y）或气泡图选项


    选择`散点图`选项，如图 10-24 所示。


    ![A978-1-4842-0529-7_10_Fig24_HTML.jpg](img/A978-1-4842-0529-7_10_Fig24_HTML.jpg)


    图 10-24 选择散点图选项


    点击图表右上角的`+`号，然后选择`坐标轴标题`，如图 10-25 所示。


    ![A978-1-4842-0529-7_10_Fig25_HTML.jpg](img/A978-1-4842-0529-7_10_Fig25_HTML.jpg)


    图 10-25 选择坐标轴标题


    点击水平或`x`轴上的`坐标轴标题`，并将其更改为`缺勤次数`。将垂直轴（即`y`轴）上的标签更改为`成绩`，并将图表标题更改为`“成绩与缺勤次数之间的关系”`，如图
    10-26 所示。


    ![A978-1-4842-0529-7_10_Fig26_HTML.jpg](img/A978-1-4842-0529-7_10_Fig26_HTML.jpg)


    图 10-26 带有标题的图表


    右键单击绘图区域，然后选择`添加趋势线...`，如图 10-27 所示。


    ![A978-1-4842-0529-7_10_Fig27_HTML.jpg](img/A978-1-4842-0529-7_10_Fig27_HTML.jpg)


    图 10-27 选择添加趋势线...


    在右侧的`设置趋势线格式`窗格中，向下滚动并勾选`显示公式`和`显示 R 平方值`，如图 10-28 所示。其中显示了线的公式（包含斜率和`y`截距）。请注意，`R-squared`值为`0.9603`（以小数形式显示），表明存在高度相关性。这是一种反向关系，意味着缺勤次数越多，成绩越低。


    ![A978-1-4842-0529-7_10_Fig28_HTML.jpg](img/A978-1-4842-0529-7_10_Fig28_HTML.jpg)


    图 10-28 显示公式和 R 平方值的图表


    ## 本章小结


    本章仅是初步探讨了 Excel 利用其分析工具库计算统计值的能力。本章介绍了如何使用内置图表工具创建数据的可视化展示，以及如何判断两个数值之间是否存在关系。这些主题足以写成一本专著。


    # 11. HDInsight


    第 1 章将 Hadoop 描述为一个开源的分布式文件系统，能够处理海量数据。微软在其 Azure 云平台上对 Hadoop 的实现称为`HDInsight`，旨在处理云中的大量数据。`HDInsight`使用
    Azure Blob 存储来存放数据，使 Hadoop 在云中作为一种服务提供。Azure 有助于以经济高效的方式在云中存储大型数据集。微软仅按实际使用的资源收费。


    Apache Hive 支持对存储在 Hadoop 中的大型数据集进行分析。Hive 是构建在 Hadoop 之上的数据仓库基础架构，用于提供数据汇总、查询和分析。它最初由
    Facebook 开发，现已成为一个 Apache 开源项目。


    本章探讨将数据从 Azure `HDInsight`导出到 Excel 进行分析的最简单方法。


    ## 获取免费 Azure 账户


    前面的章节介绍了如何使用 Azure Data Marketplace，此服务对于某些数据库基本上是免费的。本章的示例需要一个 Azure 账户。可以通过访问[`https://azure.microsoft.com/zh-cn/pricing/free-trial/`](https://azure.microsoft.com/zh-cn/pricing/free-trial/)获取
    30 天试用账户。


    随后会出现图 11-1 所示的界面。


    ![A978-1-4842-0529-7_11_Fig1_HTML.jpg](img/A978-1-4842-0529-7_11_Fig1_HTML.jpg)


    图 11-1 截至 2015 年 7 月的 Azure 免费试用界面


    点击`立即试用`，系统将提示您输入相关信息以设置一个月的免费试用。


    ## 将 Hadoop 文件导入 Power Query


    本示例演示如何使用 Windows Azure Blob Storage 上的`HDInsight`对大型数据集运行 Hive 查询。然后，演示如何使用 Power
    Query 将数据导入 Excel，以便使用数据透视表和 Power Map 进行分析。


    ### 创建 Azure 存储账户


    要完成本教程，您需要刚创建的 Windows Azure 账户。


    登录 Azure 门户[`https://manage.windowsazure.com`](https://manage.windowsazure.com/)。会出现图
    11-2 所示的界面。使用您的 Azure 凭据登录。


    ![A978-1-4842-0529-7_11_Fig2_HTML.jpg](img/A978-1-4842-0529-7_11_Fig2_HTML.jpg)


    图 11-2 Microsoft Azure 门户


    登录后，点击 Azure 门户屏幕左下角的`+新建`，如图 11-3 所示。突出显示新账户，然后点击屏幕底部的`管理访问密钥`。将出现`管理访问密钥`弹出窗口，如图
    11-6 所示。请注意主访问密钥和辅助访问密钥。点击密钥右侧的图标可将其复制到剪贴板。点击屏幕右下角的复选标记关闭窗口。


    ![A978-1-4842-0529-7_11_Fig6_HTML.jpg](img/A978-1-4842-0529-7_11_Fig6_HTML.jpg)


    图 11-6 管理访问密钥


    点击右下角的`创建存储账户`并等待账户创建完成。随后会出现如图 11-5 所示的界面。


    ![A978-1-4842-0529-7_11_Fig5_HTML.jpg](img/A978-1-4842-0529-7_11_Fig5_HTML.jpg)


    图 11-5 新建的存储账户


    依次选择`数据服务` ➤ `存储`和`快速创建`，如图 11-4 所示。为 URL 输入一个唯一的名称。本示例将使用`testhive`。选择离您最近的位置。


    ![A978-1-4842-0529-7_11_Fig4_HTML.jpg](img/A978-1-4842-0529-7_11_Fig4_HTML.jpg)


    图 11-4 在 Azure 中设置存储账户


    ![A978-1-4842-0529-7_11_Fig3_HTML.jpg](img/A978-1-4842-0529-7_11_Fig3_HTML.jpg)


    图 11-3 Azure 门户界面

