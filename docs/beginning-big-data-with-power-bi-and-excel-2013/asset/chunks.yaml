    Highlight the data, click the `Insert` tab, and select `Scatter (X, Y)`, as shown
    in Figure [10-23](#A978-1-4842-0529-7_10_Chapter.html#Fig23).


    ![A978-1-4842-0529-7_10_Fig23_HTML.jpg](A978-1-4842-0529-7_10_Fig23_HTML.jpg)


    Figure 10-23. Insert Scatter (X, Y) or Bubble Chart option


    Select the `Scatter` option, as shown in Figure [10-24](#A978-1-4842-0529-7_10_Chapter.html#Fig24).


