    使用销售人员切片器筛选结果


    # 添加时间线


    可以添加时间线以便按时间间隔进行切片。要添加时间线，请执行以下操作：


    在“数据透视表工具-分析”选项卡上，选择`插入时间线`。在“插入时间线”窗口中选择`销售日期`，然后点击`确定`。可以通过点击时间线窗口右上角的下拉箭头来选择年、季度、月或日，以确定时间线的时间段。如图
    3-18 所示，时间线和切片器可协同工作。可以选择特定的销售人员和日期，以查看该销售人员在该日期的销售额。


