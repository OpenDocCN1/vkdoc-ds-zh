  trans: '

    # 关系示例


    本示例将使用 Access 数据库 2（即 Northwind 数据库）。图 6-16 显示了部分已导入的表。该数据库可从 Apress 网站下载。


    ![A978-1-4842-0529-7_6_Fig16_HTML.jpg](img/A978-1-4842-0529-7_6_Fig16_HTML.jpg)


    图 6-16. Northwind 数据表


    请按照第 4 章中描述的步骤导入 Access 数据。


    点击 `PowerPivot` 选项卡以打开功能区。点击功能区左上角的 `Manage` 按钮。`PowerPivot` 窗口打开后，您可以点击 `Get
    External Data` 组中的 `From Database` 来加载数据。这将提供数据库源的选择。在本示例中，将选择 `From Access`。在
    `Table Import Wizard` 对话框中，点击 `Browse` 按钮找到您要导入的 Access 文件。本示例使用 `Database2.accdb`。此文件可从
    Apress 网站获取。点击 `Test Connection`。如果测试成功，点击 `Next`。


    `PowerPivot` 会打开 `Table Import Wizard` 引导您完成数据加载过程。选择 `Select from a list of tables
