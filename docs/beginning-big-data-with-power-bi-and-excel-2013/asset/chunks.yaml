    选中要转换的单元格区域。单击“数据”选项卡上的“分列”。在弹出的窗口中，选择“分隔符号”，如图 2-15 所示。然后点击“下一步”。


    ![A978-1-4842-0529-7_2_Fig15_HTML.jpg](img/A978-1-4842-0529-7_2_Fig15_HTML.jpg)


    图 2-15. “文本分列”对话框


    在下一个弹出的窗口（如图 2-16 所示）中，勾选“逗号”和“空格”作为分隔符，并预览结果。如果预览结果无误，点击“下一步”。将空格作为分隔符加入的原因是为了处理中间名缩写，在本例中，中间名缩写与其对应的名字之间是用空格分隔的。


    ![A978-1-4842-0529-7_2_Fig16_HTML.jpg](img/A978-1-4842-0529-7_2_Fig16_HTML.jpg)


