    在下一个弹出的窗口中，在“数据预览”区域选择每一列，并点击“文本”作为列数据格式，如图 2-17 所示。输入希望结果放置的目标位置，然后点击“完成”。


    ![A978-1-4842-0529-7_2_Fig17_HTML.jpg](img/A978-1-4842-0529-7_2_Fig17_HTML.jpg)


    图 2-17. “文本分列”的最后一步


    # 分割复杂的分隔字段


    对于单个字段中包含多个数据元素的更复杂情况，通常可以通过使用 Excel 的内置函数来解决。表 2-1 展示了一些可用于字符串操作的函数。


    表 2-1. 可用于字符串操作的函数


    | 函数 | 说明 |

    | --- | --- |

    | `LEN(text)` | 返回文本字符串中的字符数 |

    | `LEFT(text,num_chars)` | 返回由 `num_chars` 指定的最左边字符数 |

    | `RIGHT(text,num_chars)` | 返回由 `num_chars` 指定的最右边字符数 |

    | `MID(text,start,num_chars)` | 返回从 `start` 指定位置开始、由 `num_chars` 指定数量的字符 |

    | `SEARCH(find_text,within_text,start_num)` | 返回从左向右读取时，指定的 `find_text` 在 `within_text`
    中首次出现的位置。不区分大小写。`start_num` 指定要查找第几次出现的文本。默认值为 1。 |

    | `TRIM(text)` | 删除文本字符串中所有前导和尾随空格，但单词之间的单个空格除外 |

    | `CLEAN(text)` | 删除文本字符串中的所有非打印字符 |

    | `LOWER(text)` | 返回将所有字符转换为小写的字符串 |

    | `UPPER(text)` | 返回将所有字符转换为大写的字符串 |

    | `PROPER(text)` | 返回将每个单词首字母转换为大写的字符串 |


    函数可以嵌套。例如，我们可以使用以下公式提取姓氏：


    ```

    =LEFT(F7,SEARCH(",",F7)-1)

    ```


    此函数将提取从最左边到逗号位置的字符。要提取名字和中间名缩写，请使用以下公式：


    ```

    =RIGHT(F7,SEARCH(", ",F7)+1)

    ```


    # 删除重复项


    导入的数据中包含重复记录的情况并不少见。可以使用“数据”选项卡上的“删除重复项”选项来删除重复记录。


    最佳做法是始终使用原始文件的副本进行操作，以防止有效数据被误删。要删除重复项，只需选中包含重复值的列，然后点击“删除重复项”，如图 2-18 所示。确认包含重复项的列，然后点击“确定”。只有所有值都完全相同的行才会被删除。


    ![A978-1-4842-0529-7_2_Fig18_HTML.jpg](img/A978-1-4842-0529-7_2_Fig18_HTML.jpg)


    图 2-18. 删除重复项


    # 输入验证


    Excel 提供了检查有效输入的工具。如果数据无效，结果可能是“垃圾进，垃圾出 (GIGO)”。Excel 提供了通常与数据录入相关联的数据验证工具；但是，它们也可用于标记已录入数据中的单元格。在图
    2-19 所示的示例中，销售数字的有效范围是 0 到 20,000 美元，这是通过“数据”选项卡上的“数据验证”选项定义的。


    ![A978-1-4842-0529-7_2_Fig19_HTML.jpg](img/A978-1-4842-0529-7_2_Fig19_HTML.jpg)


    图 2-19. “数据验证”对话框


    任何超出此范围的值都可以通过在“数据”选项卡上“数据验证”下的“圈释无效数据”选项来突出显示。结果如图 2-20 所示。


    ![A978-1-4842-0529-7_2_Fig20_HTML.jpg](img/A978-1-4842-0529-7_2_Fig20_HTML.jpg)


    图 2-20. 以红色圆圈标记的无效数据


    # 使用数据记录单


    Excel 中一个隐藏且文档记录较少的功能是数据记录单功能。有时，以记录单形式（而非单纯的表格格式）显示每条记录的数据更易于阅读。默认情况下，工具栏上没有数据记录单图标。可以通过单击具有行标题的表格中的某个单元格，然后按
    `Alt`+`D`，再按 `O` 来访问数据记录单。也可以将数据记录单添加到快速访问工具栏。可通过以下步骤完成：


    单击快速访问工具栏（位于屏幕左上角）最右端的下拉箭头，然后点击“其他命令”，如图 2-21 所示。


    ![A978-1-4842-0529-7_2_Fig21_HTML.jpg](img/A978-1-4842-0529-7_2_Fig21_HTML.jpg)


    图 2-21. “自定义快速访问工具栏”菜单


    点击“其他命令”后，在屏幕顶部选择“不在功能区中的命令”。将出现如图 2-22 所示的屏幕。找到并选中“记录单”图标，然后按下中间的“添加” ➤ 按钮，将其添加到快速访问工具栏。


    ![A978-1-4842-0529-7_2_Fig22_HTML.jpg](img/A978-1-4842-0529-7_2_Fig22_HTML.jpg)


    图 2-22. 自定义快速访问工具栏菜单


    要使用数据记录单，请单击包含要在记录单中查看的数据的行。然后点击快速访问工具栏中的“记录单”图标，即可看到如图 2-23 所示的显示。可以在数据记录单中编辑字段。点击“下一条”和“上一条”按钮在记录间移动。


    ![A978-1-4842-0529-7_2_Fig23_HTML.jpg](img/A978-1-4842-0529-7_2_Fig23_HTML.jpg)


    图 2-23. 使用数据记录单


    # 选择记录


    可以使用数据记录单根据条件有选择地查看特定记录，步骤如下：


    1. 单击表格中的一个单元格。

    2. 单击快速访问工具栏中的“记录单”图标，或按 `Alt`+`D`，然后按 `O`。

    3. 在记录单中，点击“条件”，然后输入要使用的条件，例如 `城市=奥克兰`，如图 2-24 所示。


    ![A978-1-4842-0529-7_2_Fig24_HTML.jpg](img/A978-1-4842-0529-7_2_Fig24_HTML.jpg)


    图 2-24. 使用数据记录单根据条件选择记录


    然后点击“下一条”，“上一条”将仅显示满足指定条件的行。

