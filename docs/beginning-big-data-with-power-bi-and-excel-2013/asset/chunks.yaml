    点击表格中的任意位置，并使用手柄将其展开，如图 6-36 所示。


    ![A978-1-4842-0529-7_6_Fig36_HTML.jpg](img/A978-1-4842-0529-7_6_Fig36_HTML.jpg)


    图 6-36. 表格的展开视图


