    # 摘要


    本章介绍了如何将数据导入 Excel。图 2-1、2-2、2-4、2-5、2-6、2-7、2-9 和图 2-10 展示了表示相同数据的多种方式。Excel
    可以读取所有这些格式，但 JSON 除外，后者可以通过先将其转换为 XML 作为中间步骤来导入。你还学习了如何将 Excel 中的表格用作平面文件。第 3
    章将演示如何使用数据透视表从大型数据集中提取汇总数据。第 4 章将介绍如何设置关系数据模型。


    # 3. 数据透视表和数据透视图


    本章介绍如何使用数据透视表和数据透视图从单个表格中提取汇总数据。本章还描述了如何使用数据透视表从 Azure Data Marketplace 导入数据。第
    4 章将展示如何使用 Excel 数据模型从多个表格中提取汇总数据。


    ## Excel 2013 中的推荐数据透视表


    Excel 2013 尝试通过推荐条件格式、图表、工具和数据透视表来预测你的需求。当高亮显示数据，或选中数据区域中的任意单元格并按 `Ctrl+Q` 时，区域右下角会显示一个快速分析透镜按钮。点击该透镜会显示分析工具窗口，其中包含各种条件格式选项，如图
    3-1 所示。将光标移到某个条件格式选项上，会预览该条件格式应用于数据的效果。点击分析工具窗口右上角的 `表格` 选项卡，会显示几个建议的数据透视表。将鼠标悬停在每个数据透视表上会显示预览效果，如图
    3-2 所示。


    ![A978-1-4842-0529-7_3_Fig2_HTML.jpg](img/A978-1-4842-0529-7_3_Fig2_HTML.jpg)


    图 3-2. 数据透视表预览


    ![A978-1-4842-0529-7_3_Fig1_HTML.jpg](img/A978-1-4842-0529-7_3_Fig1_HTML.jpg)


    图 3-1. 分析工具窗口


    ## 定义数据透视表


    本节介绍如何基于一个假设的丰田销售数据的简单交易表来定义数据透视表。该交易表列出了交易记录，包括销售日期、车型、销售人员、颜色和售价，如图 3-3 所示。作为数据透视表基础的表应同时包含数值数据和类别字段，以便数值数据可以按类别进行划分和切分。


    ![A978-1-4842-0529-7_3_Fig3_HTML.jpg](img/A978-1-4842-0529-7_3_Fig3_HTML.jpg)


    图 3-3. 汽车销售交易表


    创建数据透视表不会更改底层数据；它实际上是获取数据的一个快照。当底层数据发生更改时，数据透视表不会自动刷新。要刷新，请点击数据透视表内的任意位置以高亮显示
    **数据透视表工具 - 分析** 选项卡，然后点击 `刷新`。


    ### 定义问题


    好的做法是思考清楚你想通过数据透视表回答哪些问题。一些典型问题如下：


    - 每天的平均销售额是多少？

    - 谁是最佳表现的销售人员？

    - 一周中哪几天的销售额最高？

    - 哪几个月的销售额最高？


    ### 创建数据透视表


    定义数据透视表的步骤如下：


    确保底层数据采用表格格式，第一行显示字段名称，并且数据周围有空白行和列，或者从第 1 行或 A 列开始。按 `Ctrl+T` 将数据定义为表格，如图 3-3
    所示。点击表格内的任意位置，然后高亮显示 **插入** 选项卡。点击 `数据透视表`。将出现如图 3-4 所示的界面。请注意，当前表格已被选中，并且默认情况下，数据透视表将放置在新工作表中。点击
    `确定`。


    ![A978-1-4842-0529-7_3_Fig4_HTML.jpg](img/A978-1-4842-0529-7_3_Fig4_HTML.jpg)


    图 3-4. 创建数据透视表对话框


    此时，你需要思考想要提取哪种类型的数据。我们将从每日销售汇总开始，并附带每日售出车型的细分情况。我们将通过将 `销售日期` 拖到 **列** 框，将 `车型`
    拖到 **行** 框，将 `价格` 拖到 **值** 框来实现，如图 3-5 所示。请注意，默认显示的是 `价格之和`。


    ![A978-1-4842-0529-7_3_Fig5_HTML.jpg](img/A978-1-4842-0529-7_3_Fig5_HTML.jpg)


    图 3-5. 显示按车型统计的汽车销售数量的基本数据透视表


    要将 `价格之和` 更改为 `价格计数`，请右键单击单元格 `A3`，或下拉 **值** 下 `价格计数` 上的箭头，选择“值字段设置”和 `计数`。结果如图
    3-6 所示。


    ![A978-1-4842-0529-7_3_Fig6_HTML.jpg](img/A978-1-4842-0529-7_3_Fig6_HTML.jpg)


    图 3-6. 显示按车型统计的汽车销售金额的数据透视表


    ### 更改数据透视表


    更改数据透视表非常容易。要将水平轴从日期更改为销售人员，只需点击 **列** 框中的 `销售日期`，将其拖回并选择“删除字段”。然后，将 `销售人员` 从字段列表拖到
    **列** 框。结果如图 3-7 所示。


    ![A978-1-4842-0529-7_3_Fig7_HTML.jpg](img/A978-1-4842-0529-7_3_Fig7_HTML.jpg)


    图 3-7. 显示按车型和销售人员统计的销售额的数据透视表


    ### 创建每日按销售人员的销售细分


    可以修改数据透视表以显示每天按销售人员和车型统计的销售额。只需将 `模型` 字段拖到 **列** 框，将 `销售人员` 和 `销售日期` 字段拖到 **行**
    框，这样 **行** 框中就会同时显示 `销售日期` 和 `销售人员`。结果如图 3-8 所示。


    ![A978-1-4842-0529-7_3_Fig8_HTML.jpg](img/A978-1-4842-0529-7_3_Fig8_HTML.jpg)


    图 3-8. 显示每日按销售人员和车型细分的销售情况的数据透视表


    ### 按月显示销售额


    要按月显示销售报表，请右键单击 `销售日期` 列中的任意单元格，然后从组合窗口中选择 `月`，如图 3-9 所示，再点击 `确定`。


    ![A978-1-4842-0529-7_3_Fig9_HTML.jpg](img/A978-1-4842-0529-7_3_Fig9_HTML.jpg)


    图 3-9. 选择按月分组的对话框


    生成的数据透视表如图 3-10 所示。


    ![A978-1-4842-0529-7_3_Fig10_HTML.jpg](img/A978-1-4842-0529-7_3_Fig10_HTML.jpg)


    图 3-10. 显示按月统计的销售人员和车型销售额的数据透视表


    ## 创建数据透视图


    要根据数据透视表创建数据透视图，请在屏幕上显示数据透视表的情况下，执行以下操作：


    转到 **数据透视表工具 - 分析** 选项卡，然后选择 `数据透视图`。从显示在图 3-11 中的“插入图表”弹出窗口中选择所需的图表类型，然后点击 `确定`。在此示例中，我们将使用堆积柱形图。


    ![A978-1-4842-0529-7_3_Fig11_HTML.jpg](img/A978-1-4842-0529-7_3_Fig11_HTML.jpg)


    图 3-11. 插入图表对话框


    结果将如图 3-12 所示显示。


    ![A978-1-4842-0529-7_3_Fig12_HTML.jpg](img/A978-1-4842-0529-7_3_Fig12_HTML.jpg)


    图 3-12. 带有数据透视表的数据透视图

