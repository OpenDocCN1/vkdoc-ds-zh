    [11-7](#A978-1-4842-0529-7_11_Chapter.html#Fig7). Choose a cluster name. Two nodes
    should be sufficient for this example. Azure sets the default user name to `Admin`.
    You will need to create a password of at least ten characters, including at least
    one capital letter, one number, and one special character, and enter it twice,
    as prompted. Be sure to remember the password entered.


