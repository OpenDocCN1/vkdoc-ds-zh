- fmt: '# Relational Example


    For this example, Access database2 (the Northwind Database) will be used. Some
    of the imported tables are shown in Figure [6-16](#A978-1-4842-0529-7_6_Chapter.html#Fig16).
    This database can be downloaded from the Apress web site.


    ![A978-1-4842-0529-7_6_Fig16_HTML.jpg](A978-1-4842-0529-7_6_Fig16_HTML.jpg)


    Figure 6-16. Northwind tables


    Follow the steps described in [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html)
    to import Access data.


    Click the `PowerPivot` tab to open the ribbon. Click the `Manage` button at the
    top-left end of the ribbon. Once the `PowerPivot` window is open, you can load
    data by clicking `From Database` in the `Get External Data` group. This provides
    a choice of database sources. For this example, `From Access` will be selected.
    In the `Table Import Wizard` dialog, click the `Browse` button to find the Access
    file you want to import. For this example, use `Database2.accdb`. This file is
    available from the Apress web site. Click `Test Connection`. If the test is successful,
    click `Next`.


    `PowerPivot` opens the `Table Import Wizard` to take you through the process of
    loading data. Choose `Select from a list of tables and views` to choose the data
    you want to import. Click `Next`. Click the top-left box to select all tables.
    Note that in the lower right corner of the dialog, there is an option to `Preview
    & Filter`. This option can be used to select a subset of data from very large
    datasets. In this example, all rows in all tables will be imported. Then click
    `Finish` to complete the import. The tables imported are shown in Figure [6-16](#A978-1-4842-0529-7_6_Chapter.html#Fig16).


    The relationships between the tables are shown in Figure [6-17](#A978-1-4842-0529-7_6_Chapter.html#Fig17).


    ![A978-1-4842-0529-7_6_Fig17_HTML.jpg](A978-1-4842-0529-7_6_Fig17_HTML.jpg)


    Figure 6-17. Diagram view


    This example will use the relation between `customer ID` in the `orders` table
    and the `ID` field in the `customers` table.


    Another view of the relationships is shown in Figure [6-18](#A978-1-4842-0529-7_6_Chapter.html#Fig18),
    which is accessed by clicking the `Relationships` icon on the `Data` tab.


    ![A978-1-4842-0529-7_6_Fig18_HTML.jpg](A978-1-4842-0529-7_6_Fig18_HTML.jpg)


    Figure 6-18. Relationships


    To create a Power View report, follow these steps:


    1.  Click `Power View Reports` on the Excel `Insert` tab.

    2.  First create a table by selecting fields from the `Power View Fields` tab
    on the right side of the screen.

    3.  From the `customers` table, select the `company`, `first name`, and `job title`
    fields, as shown in Figure [6-19](#A978-1-4842-0529-7_6_Chapter.html#Fig19).


    ![A978-1-4842-0529-7_6_Fig19_HTML.jpg](A978-1-4842-0529-7_6_Fig19_HTML.jpg)


    Figure 6-19. Table showing company, first name, and job title


    Next, select `Price Total` from the `Order Price Totals` table. Doing this depends
    on the relationship between the `customers` to `orders` table to the `order price
    totals` table. The results are shown in Figure [6-20](#A978-1-4842-0529-7_6_Chapter.html#Fig20).


    ![A978-1-4842-0529-7_6_Fig20_HTML.jpg](A978-1-4842-0529-7_6_Fig20_HTML.jpg)


    Figure 6-20. Table showing order totals


    Note that for companies with multiple orders, there are multiple rows shown in
    the table. A matrix view, shown in Figure [6-21](#A978-1-4842-0529-7_6_Chapter.html#Fig21),
    makes this more obvious.


    ![A978-1-4842-0529-7_6_Fig21_HTML.jpg](A978-1-4842-0529-7_6_Fig21_HTML.jpg)


    Figure 6-21. Matrix view


    ## Customer and City Example


    This example will show customers by city. The objective is to show the value of
    orders from each city. Follow these steps:


    1.  Click `Power View Reports` on the Excel `Insert` tab.

    2.  Select `company` and `city` from the `Customers` table, as shown in Figure
    [6-22](#A978-1-4842-0529-7_6_Chapter.html#Fig22). Adjust the width of the `company`
    column in the table, if necessary, by selecting the line between columns in the
    title bar and dragging.


    ![A978-1-4842-0529-7_6_Fig22_HTML.jpg](A978-1-4842-0529-7_6_Fig22_HTML.jpg)


    Figure 6-22. Company and city table


    3.  Select the `price total` field from the `order price totals` table. Note that
    a prompt appears to create a relation. Because no relation is created, the total
    of all orders is shown, as in Figure [6-23](#A978-1-4842-0529-7_6_Chapter.html#Fig23).


    ![A978-1-4842-0529-7_6_Fig23_HTML.jpg](A978-1-4842-0529-7_6_Fig23_HTML.jpg)


    Figure 6-23. Table showing company, city, and order price totals


    4.  Create the relationship between the `orders` table and the `order price totals`
    table based on the `order ID`, as shown in Figure [6-24](#A978-1-4842-0529-7_6_Chapter.html#Fig24),
    and click `OK`.


    ![A978-1-4842-0529-7_6_Fig24_HTML.jpg](A978-1-4842-0529-7_6_Fig24_HTML.jpg)


    Figure 6-24. Creating relationship between the orders and order price totals tables


    5.  Next, click the arrow after `Price Total` in the `Fields` list and select
    “Do Not Summarize,” as shown in Figure [6-25](#A978-1-4842-0529-7_6_Chapter.html#Fig25).
    Note that the value of each order is now shown, instead of the total of all orders.


    ![A978-1-4842-0529-7_6_Fig25_HTML.jpg](A978-1-4842-0529-7_6_Fig25_HTML.jpg)


    Figure 6-25. Table showing individual order totals


    6.  Selecting the matrix view by clicking `Table` on the `Design` tab and selecting
    `Matrix` and clicking “Fit to Window” will result in the display shown in Figure
    [6-26](#A978-1-4842-0529-7_6_Chapter.html#Fig26). Note that a title has been entered.
    The view can be scrolled using the scrollbars on the right.


    ![A978-1-4842-0529-7_6_Fig26_HTML.jpg](A978-1-4842-0529-7_6_Fig26_HTML.jpg)


    Figure 6-26. Matrix view


    7.  Clicking the pop-out icon at the upper right of the table display will result
    in the view shown in Figure [6-27](#A978-1-4842-0529-7_6_Chapter.html#Fig27).


    ![A978-1-4842-0529-7_6_Fig27_HTML.jpg](A978-1-4842-0529-7_6_Fig27_HTML.jpg)


    Figure 6-27. Pop-out view of the matrix


    8.  To filter out records that do not have an order, drag the `Price Total` field
    to the `Filters` pane and drag the left bar to the right to some arbitrary small
    number greater than zero, as shown in Figure [6-28](#A978-1-4842-0529-7_6_Chapter.html#Fig28).


    ![A978-1-4842-0529-7_6_Fig28_HTML.jpg](A978-1-4842-0529-7_6_Fig28_HTML.jpg)


    Figure 6-28. Filtering out companies with no orders


    Or click on the `Price Total` field name and set the filter as greater than or
    equal to 1 and click `Apply Filter`, as shown in Figure [6-29](#A978-1-4842-0529-7_6_Chapter.html#Fig29).


    ![A978-1-4842-0529-7_6_Fig29_HTML.jpg](A978-1-4842-0529-7_6_Fig29_HTML.jpg)


    Figure 6-29. Another way to filter out companies with no orders'
