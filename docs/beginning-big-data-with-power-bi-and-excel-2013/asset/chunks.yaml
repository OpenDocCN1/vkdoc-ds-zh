    6. 将 `成绩` 拖动到 `值` 框中。结果显示了每个分组类别的频率，如图 10-19 所示。请注意，这些类别大致相当于评分等级：92 到 100 分为
    A，82 到 91 分为 B，依此类推。


    ![A978-1-4842-0529-7_10_Fig19_HTML.jpg](img/A978-1-4842-0529-7_10_Fig19_HTML.jpg)

    *图 10-19. 分组类别*


    7. 要绘制直方图，请单击 `插入` 选项卡并选择 `柱形图`、`二维柱形图`。该结果绘制了每个类别的频率，如图 10-20 所示。


    ![A978-1-4842-0529-7_10_Fig20_HTML.jpg](img/A978-1-4842-0529-7_10_Fig20_HTML.jpg)

    *图 10-20. 直方图*


    8. 可以通过单击柱形并按 `Ctrl+1` 来调整图表，这将在屏幕右侧打开 `设置数据系列格式` 窗格。将 `间隙宽度` 滑块调整为零，以消除柱形之间的间距。

    9. 可以通过单击标题（目前显示为“总计”）来修改标题，将其更改为“考试成绩频数分布”，如图 10-21 所示。


    ![A978-1-4842-0529-7_10_Fig21_HTML.jpg](img/A978-1-4842-0529-7_10_Fig21_HTML.jpg)

    *图 10-21. 带标题的直方图*

