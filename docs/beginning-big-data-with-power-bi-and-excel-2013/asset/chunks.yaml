    can be selected by clicking the down arrow at the upper right of the Timeline
    window to select years, quarters, months, or days.   As seen in Figure [3-18](#A978-1-4842-0529-7_3_Chapter.html#Fig18),
    Timeline and Slicer work together. A specific salesperson and date can be selected
    to view sales by that salesperson on that date.


    ![A978-1-4842-0529-7_3_Fig18_HTML.jpg](A978-1-4842-0529-7_3_Fig18_HTML.jpg)


    Figure 3-18.


    Filtering data with a time line plus salesperson slicer


