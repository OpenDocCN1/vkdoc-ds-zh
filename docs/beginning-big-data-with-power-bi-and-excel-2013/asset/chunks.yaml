    # 7. 使用数据分析表达式 (DAX) 进行计算


    本章介绍如何使用数据分析表达式 (DAX) 进行计算，以及如何使用关键绩效指标 (KPI) 衡量绩效。重点将放在一些使用 DAX 和 KPI 的实际示例上。


    ## 理解数据分析表达式


    如第 4 章所述，数据分析表达式 (DAX) 是一种公式语言，用于基于 PowerPivot 的表格数据模型创建计算列和计算字段。DAX 公式与常规的、基于单元格的
    Excel 公式不同，DAX 公式适用于指定列中的所有行。DAX 公式在以下两种情况下使用：


    - **计算列**。计算列可以添加到现有的 PowerPivot 表中。当列包含公式时，会为每一行计算该值。要创建公式，请点击新列中的任意单元格，然后按 Enter
    键开始输入基于列引用的公式。可以通过鼠标指向列名或输入用方括号括起来的名称来引用列名。可以通过在列名前输入工作表名称来引用其他工作表中的列。如果工作表名称包含空格，则可以用单引号将其括起来。DAX
    表达式中最多可以嵌套 64 层函数。

    - **计算字段或度量值**。这些字段或度量值放置在 PowerPivot 窗口底部的计算区域。计算字段通常包含聚合函数，例如求和或平均值，默认情况下它们引用整个列。DAX
    函数与 Excel 函数非常相似，但 DAX 函数是面向列的。可以通过点击 PowerPivot 窗口 `设计` 选项卡上的 `fx` 图标来查看所有可用的
    DAX 函数。创建计算字段时，公式前面会有一个标识符，它类似于变量名，可用于引用该计算字段。


    **注意：** 使用 DAX 时，最好避免为计算字段和计算列使用相同的名称。为了进一步避免歧义，最好在引用列时使用完全限定的列名，其中包含工作表名称。


    ### DAX 运算符


    DAX 使用以下运算符：


    **标准算术运算符：**


    - `+` 加法

    - `-` 减法

    - `*` 乘法

    - `/` 除法

    - `^` 乘幂


    **比较运算符：**


    - `=` 等于

    - `>` 大于

    - `<` 小于

    - `>=` 大于或等于

    - `<=` 小于或等于

    - `<>` 不等于


    **文本串联运算符：**


    - `&` 连接


    **以及逻辑运算符：**


    - `&&` 与

    - `||` 或


    ### 本章使用的主要 DAX 函数总结


    - `SUM`：简单的求和，如同在 Excel 中一样

    - `SUMX`：逐行迭代以进行计算

    - `CALCULATE`：允许基于筛选条件进行计算

    - `LEFT`：从指定的文本字符串开头返回指定数量的字符

