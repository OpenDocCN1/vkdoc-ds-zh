- fmt: '# Summary


    This chapter has shown you how to import data into Excel. Figures [2-1](#A978-1-4842-0529-7_2_Chapter.html#Fig1),
    [2-2](#A978-1-4842-0529-7_2_Chapter.html#Fig2), [2-4](#A978-1-4842-0529-7_2_Chapter.html#Fig4),
    [2-5](#A978-1-4842-0529-7_2_Chapter.html#Fig5), [2-6](#A978-1-4842-0529-7_2_Chapter.html#Fig6),
    [2-7](#A978-1-4842-0529-7_2_Chapter.html#Fig7), [2-9](#A978-1-4842-0529-7_2_Chapter.html#Fig9),
    and [2-10](#A978-1-4842-0529-7_2_Chapter.html#Fig10) illustrate different ways
    of representing the same data. Excel can read all these formats, with the exception
    of JSON, which can be imported by converting it to XML as an intermediate step.
    You also saw how to use Tables in Excel as flat files. [Chapter 3](#A978-1-4842-0529-7_3_Chapter.html)
    will demonstrate how to use Pivot Tables to extract summary data from large datasets.
    [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html) will show you how to set up relational
    data models.


    # 3. Pivot Tables and Pivot Charts


    This chapter covers extracting summary data from a single table, using Pivot Tables
    and Pivot Charts. The chapter also describes how to import data from the Azure
    Data Marketplace, using Pivot Tables. [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html)
    will show how to extract summary data from multiple tables, using the Excel Data
    Model.


    ## Recommended Pivot Tables in Excel 2013


    Excel 2013 tries to anticipate your needs by recommending conditional formatting,
    charts, tools, and Pivot Tables. When data is highlighted or `Ctrl+Q` is pressed
    with any cell in the data range selected, a Quick Analysis Lens button is displayed
    at the lower right of the range. Clicking the lens will show the Analysis Tool
    window, which displays various conditional formatting options, as shown in Figure
    [3-1](#A978-1-4842-0529-7_3_Chapter.html#Fig1). Moving the cursor over a conditional
    formatting option will show a preview of that conditional formatting in the data.
    Clicking the Tables tab at the top right of the Analysis Tool window will result
    in several suggested Pivot Tables being shown. Hovering over each Pivot Table
    presents a preview, as shown in Figure [3-2](#A978-1-4842-0529-7_3_Chapter.html#Fig2).


    ![A978-1-4842-0529-7_3_Fig2_HTML.jpg](A978-1-4842-0529-7_3_Fig2_HTML.jpg)


    Figure 3-2. Pivot Table preview


    ![A978-1-4842-0529-7_3_Fig1_HTML.jpg](A978-1-4842-0529-7_3_Fig1_HTML.jpg)


    Figure 3-1. Analysis Tool window


    ## Defining a Pivot Table


    This section covers how to define a Pivot Table based on a simple transaction
    table of hypothetical Toyota sales data that lists transactions, including date
    of sale, model, salesperson, color, and selling price, as shown in Figure [3-3](#A978-1-4842-0529-7_3_Chapter.html#Fig3).
    Tables on which Pivot Tables are based should contain both numeric data and category
    fields, so that the numeric data can be sliced and diced by categories.


    ![A978-1-4842-0529-7_3_Fig3_HTML.jpg](A978-1-4842-0529-7_3_Fig3_HTML.jpg)


    Figure 3-3. Auto sales transaction table


    Creating a Pivot Table doesn’t change the underlying data; rather, it takes a
    snapshot of the data. When the underlying data is changed, the Pivot Table does
    not automatically refresh. To refresh, click anywhere within the Pivot Table to
    highlight the Pivot Table Tools Analyze tab and click Refresh.


    ### Defining Questions


    It is good practice to think through what questions you want answered by the Pivot
    Table. Some typical questions would be the following:


    - What are the average sales per day?

    - Who is the best performing salesperson?

    - What days of the week have the most sales?

    - What months have the highest sales?


    ### Creating a Pivot Table


    The steps to define a Pivot Table are as follows:


    Make sure that the underlying data is in table format, with the first row showing
    the field names, and that the data is surrounded by blank rows and columns or
    starts in row 1 or column A. Press `Ctrl+T` to define the data, as a table as
    shown in Figure [3-3](#A978-1-4842-0529-7_3_Chapter.html#Fig3). Click anywhere
    within the table and highlight the Insert tab. Click `PivotTable`. The screen
    shown in Figure [3-4](#A978-1-4842-0529-7_3_Chapter.html#Fig4) will appear. Note
    that the current table is selected and that by default, the Pivot Table will be
    placed in a new worksheet. Click `OK`.


    ![A978-1-4842-0529-7_3_Fig4_HTML.jpg](A978-1-4842-0529-7_3_Fig4_HTML.jpg)


    Figure 3-4. Create PivotTable dialog


    At this point, you have to think through what type of data you want to extract.
    We will start with a summary of sales per day, with a breakout of models sold
    per day. We will do this by dragging `sell date` to the Columns box, `model` to
    Rows, and `price` to Values, as shown in Figure [3-5](#A978-1-4842-0529-7_3_Chapter.html#Fig5).
    Note that the default display is `Sum of price`.


    ![A978-1-4842-0529-7_3_Fig5_HTML.jpg](A978-1-4842-0529-7_3_Fig5_HTML.jpg)


    Figure 3-5. Basic Pivot Table showing count of car sales by model


    To change `Sum of price` to `Count of price`, right-click cell `A3` or pull down
    the arrow on `Count of price` under Values and select “Summarize Values by” and
    count. The result is shown in Figure [3-6](#A978-1-4842-0529-7_3_Chapter.html#Fig6).


    ![A978-1-4842-0529-7_3_Fig6_HTML.jpg](A978-1-4842-0529-7_3_Fig6_HTML.jpg)


    Figure 3-6. Pivot Table showing value of car sales by model


    ### Changing the Pivot Table


    It is very easy to make changes to the Pivot Table. To change the horizontal axis
    from dates to salesperson, simply click `sell date` from the Columns box back
    and select “remove field.” Then drag `salesperson` from the Fields list to the
    Columns box. The result is shown in Figure [3-7](#A978-1-4842-0529-7_3_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_3_Fig7_HTML.jpg](A978-1-4842-0529-7_3_Fig7_HTML.jpg)


    Figure 3-7. Pivot Table showing sales by model and salesperson


    ### Creating a Breakdown of Sales by Salesperson for Each Day


    The Pivot Table can be modified to show the sales by salesperson and model for
    each day. Simply drag the `model` field to the Columns box and `salesperson` and
    `sell date` fields to the Rows box, so that both `sell date` and `salesperson`
    are shown in the Rows box. The results are shown in Figure [3-8](#A978-1-4842-0529-7_3_Chapter.html#Fig8).


    ![A978-1-4842-0529-7_3_Fig8_HTML.jpg](A978-1-4842-0529-7_3_Fig8_HTML.jpg)


    Figure 3-8. Pivot Table showing breakdown by salesperson and model for each day


    ### Showing Sales by Month


    To display a sales report by month, right-click any cell in the `sell date` column
    and select Months from the Grouping window, as shown in Figure [3-9](#A978-1-4842-0529-7_3_Chapter.html#Fig9),
    and click `OK`.


    ![A978-1-4842-0529-7_3_Fig9_HTML.jpg](A978-1-4842-0529-7_3_Fig9_HTML.jpg)


    Figure 3-9. Dialog to select grouping by month


    The resulting Pivot Table is shown in Figure [3-10](#A978-1-4842-0529-7_3_Chapter.html#Fig10).


    ![A978-1-4842-0529-7_3_Fig10_HTML.jpg](A978-1-4842-0529-7_3_Fig10_HTML.jpg)


    Figure 3-10. Pivot Table showing sales by salesperson and model by month


    ## Creating a Pivot Chart


    To create a Pivot Chart from a Pivot Table, with the Pivot Table displayed on
    the screen, do the following:


    Go to the Pivot Table Tools Analyze tab and select `Pivot Chart`. From the Insert
    Chart pop-up shown in Figure [3-11](#A978-1-4842-0529-7_3_Chapter.html#Fig11),
    select the type of chart desired and click `OK`. For this example, we will use
    a stacked column chart.


    ![A978-1-4842-0529-7_3_Fig11_HTML.jpg](A978-1-4842-0529-7_3_Fig11_HTML.jpg)


    Figure 3-11. Insert Chart dialog


    The result will be displayed as shown in Figure [3-12](#A978-1-4842-0529-7_3_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_3_Fig12_HTML.jpg](A978-1-4842-0529-7_3_Fig12_HTML.jpg)


    Figure 3-12. Pivot Chart with Pivot Table'
  raw: '## Summary


    This chapter has shown you how to import data into Excel. Figures [2-1](#A978-1-4842-0529-7_2_Chapter.html#Fig1),
    [2-2](#A978-1-4842-0529-7_2_Chapter.html#Fig2), [2-4](#A978-1-4842-0529-7_2_Chapter.html#Fig4),
    [2-5](#A978-1-4842-0529-7_2_Chapter.html#Fig5), [2-6](#A978-1-4842-0529-7_2_Chapter.html#Fig6),
    [2-7](#A978-1-4842-0529-7_2_Chapter.html#Fig7), [2-9](#A978-1-4842-0529-7_2_Chapter.html#Fig9),
    and [2-10](#A978-1-4842-0529-7_2_Chapter.html#Fig10) illustrate different ways
    of representing the same data. Excel can read all these formats, with the exception
    of JSON, which can be imported by converting it to XML as an intermediate step.
    You also saw how to use Tables in Excel as flat files. [Chapter 3](#A978-1-4842-0529-7_3_Chapter.html)
    will demonstrate how to use Pivot Tables to extract summary data from large datasets.
    [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html) will show you how to set up relational
    data models.


    # 3. Pivot Tables and Pivot Charts


    This chapter covers extracting summary data from a single table, using Pivot Tables
    and Pivot Charts. The chapter also describes how to import data from the Azure
    Data Marketplace, using Pivot Tables. [Chapter 4](#A978-1-4842-0529-7_4_Chapter.html)
    will show how to extract summary data from multiple tables, using the Excel Data
    Model.


    ## Recommended Pivot Tables in Excel 2013


    Excel 2013 tries to anticipate your needs by recommending conditional formatting,
    charts, tools, and Pivot Tables. When data is highlighted or Ctrl+Q is pressed
    with any cell in the data range selected, a Quick Analysis Lens button is displayed
    at the lower right of the range. Clicking the lens will show the Analysis Tool
    window, which displays various conditional formatting options, as shown in Figure
    [3-1](#A978-1-4842-0529-7_3_Chapter.html#Fig1). Moving the cursor over a conditional
    formatting option will show a preview of that conditional formatting in the data.
    Clicking the Tables tab at the top right of the Analysis Tool window will result
    in several suggested Pivot Tables being shown. Hovering over each Pivot Table
    presents a preview, as shown in Figure [3-2](#A978-1-4842-0529-7_3_Chapter.html#Fig2).


    ![A978-1-4842-0529-7_3_Fig2_HTML.jpg](A978-1-4842-0529-7_3_Fig2_HTML.jpg)


    Figure 3-2.


    Pivot Table preview


    ![A978-1-4842-0529-7_3_Fig1_HTML.jpg](A978-1-4842-0529-7_3_Fig1_HTML.jpg)


    Figure 3-1.


    Analysis Tool window


    ## Defining a Pivot Table


    This section covers how to define a Pivot Table based on a simple transaction
    table of hypothetical Toyota sales data that lists transactions, including date
    of sale, model, salesperson, color, and selling price, as shown in Figure [3-3](#A978-1-4842-0529-7_3_Chapter.html#Fig3).
    Tables on which Pivot Tables are based should contain both numeric data and category
    fields, so that the numeric data can be sliced and diced by categories.


    ![A978-1-4842-0529-7_3_Fig3_HTML.jpg](A978-1-4842-0529-7_3_Fig3_HTML.jpg)


    Figure 3-3.


    Auto sales transaction table


    Creating a Pivot Table doesn’t change the underlying data; rather, it takes a
    snapshot of the data. When the underlying data is changed, the Pivot Table does
    not automatically refresh. To refresh, click anywhere within the Pivot Table to
    highlight the Pivot Table Tools Analyze tab and click Refresh.


    ### Defining Questions


    It is good practice to think through what questions you want answered by the Pivot
    Table. Some typical questions would be the following:


    *   What are the average sales per day?

    *   Who is the best performing salesperson?

    *   What days of the week have the most sales?

    *   What months have the highest sales?


    ### Creating a Pivot Table


    The steps to define a Pivot Table are as follows:


    Make sure that the underlying data is in table format, with the first row showing
    the field names, and that the data is surrounded by blank rows and columns or
    starts in row 1 or column A. Press Ctrl+T to define the data, as a table as shown
    in Figure [3-3](#A978-1-4842-0529-7_3_Chapter.html#Fig3).  Click anywhere within
    the table and highlight the Insert tab. Click PivotTable. The screen shown in
    Figure [3-4](#A978-1-4842-0529-7_3_Chapter.html#Fig4) will appear. Note that the
    current table is selected and that by default, the Pivot Table will be placed
    in a new worksheet. Click OK.


    ![A978-1-4842-0529-7_3_Fig4_HTML.jpg](A978-1-4842-0529-7_3_Fig4_HTML.jpg)


    Figure 3-4.


    Create PivotTable dialog  At this point, you have to think through what type of
    data you want to extract. We will start with a summary of sales per day, with
    a breakout of models sold per day. We will do this by dragging sell date to the
    Columns box, model to Rows, and price to Values, as shown in Figure [3-5](#A978-1-4842-0529-7_3_Chapter.html#Fig5).
    Note that the default display is Sum of price.


    ![A978-1-4842-0529-7_3_Fig5_HTML.jpg](A978-1-4842-0529-7_3_Fig5_HTML.jpg)


    Figure 3-5.


    Basic Pivot Table showing count of car sales by model  To change Sum of price
    to Count of price, right-click cell A3 or pull down the arrow on Count of price
    under Values and select “Summarize Values by” and count. The result is shown in
    Figure [3-6](#A978-1-4842-0529-7_3_Chapter.html#Fig6).


    ![A978-1-4842-0529-7_3_Fig6_HTML.jpg](A978-1-4842-0529-7_3_Fig6_HTML.jpg)


    Figure 3-6.


    Pivot Table showing value of car sales by model


    ### Changing the Pivot Table


    It is very easy to make changes to the Pivot Table. To change the horizontal axis
    from dates to salesperson, simply click sell date from the Columns box back and
    select “remove field.” Then drag salesperson from the Fields list to the Columns
    box. The result is shown in Figure [3-7](#A978-1-4842-0529-7_3_Chapter.html#Fig7).


    ![A978-1-4842-0529-7_3_Fig7_HTML.jpg](A978-1-4842-0529-7_3_Fig7_HTML.jpg)


    Figure 3-7.


    Pivot Table showing sales by model and salesperson


    ### Creating a Breakdown of Sales by Salesperson for Each Day


    The Pivot Table can be modified to show the sales by salesperson and model for
    each day. Simply drag the model field to the Columns box and salesperson and sell
    date fields to the Rows box, so that both sell date and salesperson are shown
    in the Rows box. The results are shown in Figure [3-8](#A978-1-4842-0529-7_3_Chapter.html#Fig8).


    ![A978-1-4842-0529-7_3_Fig8_HTML.jpg](A978-1-4842-0529-7_3_Fig8_HTML.jpg)


    Figure 3-8.


    Pivot Table showing breakdown by salesperson and model for each day


    ### Showing Sales by Month


    To display a sales report by month, right-click any cell in the sell date column
    and select Months from the Grouping window, as shown in Figure [3-9](#A978-1-4842-0529-7_3_Chapter.html#Fig9),
    and click OK.


    ![A978-1-4842-0529-7_3_Fig9_HTML.jpg](A978-1-4842-0529-7_3_Fig9_HTML.jpg)


    Figure 3-9.


    Dialog to select grouping by month


    The resulting Pivot Table is shown in Figure [3-10](#A978-1-4842-0529-7_3_Chapter.html#Fig10).


    ![A978-1-4842-0529-7_3_Fig10_HTML.jpg](A978-1-4842-0529-7_3_Fig10_HTML.jpg)


    Figure 3-10.


    Pivot Table showing sales by salesperson and model by month


    ## Creating a Pivot Chart


    To create a Pivot Chart from a Pivot Table, with the Pivot Table displayed on
    the screen, do the following:


    Go to the Pivot Table Tools Analyze tab and select Pivot Chart.   From the Insert
    Chart pop-up shown in Figure [3-11](#A978-1-4842-0529-7_3_Chapter.html#Fig11),
    select the type of chart desired and click OK. For this example, we will use a
    stacked column chart.


    ![A978-1-4842-0529-7_3_Fig11_HTML.jpg](A978-1-4842-0529-7_3_Fig11_HTML.jpg)


    Figure 3-11.


    Insert Chart dialog  The result will be displayed as shown in Figure [3-12](#A978-1-4842-0529-7_3_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_3_Fig12_HTML.jpg](A978-1-4842-0529-7_3_Fig12_HTML.jpg)


    Figure 3-12.


    Pivot Chart with Pivot Table'
  trans: '

    # 总结


    本章展示了如何将数据导入 Excel。图 2-1、2-2、2-4、2-5、2-6、2-7、2-9 和 2-10 展示了表示相同数据的不同方式。Excel 可以读取所有这些格式，但
    JSON 格式除外，JSON 可以通过先将其转换为 XML 作为中间步骤来导入。您还了解了如何将 Excel 中的表格用作平面文件。第 3 章将演示如何使用数据透视表从大型数据集中提取汇总数据。第
    4 章将向您展示如何设置关系数据模型。


    # 3. 数据透视表和数据透视图


    本章介绍如何使用数据透视表和数据透视图从单个表中提取汇总数据。本章还描述了如何使用数据透视表从 Azure 数据市场导入数据。第 4 章将展示如何使用 Excel
    数据模型从多个表中提取汇总数据。


    ## Excel 2013 中推荐的数据透视表


    Excel 2013 尝试通过推荐条件格式、图表、工具和数据透视表来预测您的需求。当数据被高亮显示，或者在选择数据范围内的任意单元格时按下 `Ctrl+Q`，在该范围的右下角会显示一个快速分析透镜按钮。点击该透镜将显示分析工具窗口，其中显示各种条件格式选项，如图
    3-1 所示。将光标移动到某个条件格式选项上，将在数据中预览该条件格式的效果。单击分析工具窗口右上角的“表格”选项卡，将显示几个建议的数据透视表。将鼠标悬停在每个数据透视表上，会出现预览，如图
    3-2 所示。


    ![A978-1-4842-0529-7_3_Fig2_HTML.jpg](img/A978-1-4842-0529-7_3_Fig2_HTML.jpg)


    图 3-2. 数据透视表预览


    ![A978-1-4842-0529-7_3_Fig1_HTML.jpg](img/A978-1-4842-0529-7_3_Fig1_HTML.jpg)


    图 3-1. 分析工具窗口


    ## 定义数据透视表


    本节介绍如何基于一个假设的丰田汽车销售数据的简单交易表来定义数据透视表，该表列出了交易记录，包括销售日期、型号、销售人员、颜色和售价，如图 3-3 所示。作为数据透视表基础的表应同时包含数值数据和类别字段，以便能够按类别对数值数据进行各种维度的切分和汇总。


    ![A978-1-4842-0529-7_3_Fig3_HTML.jpg](img/A978-1-4842-0529-7_3_Fig3_HTML.jpg)


    图 3-3. 汽车销售交易表


    创建数据透视表不会更改基础数据；它只是对数据拍摄了一个快照。当基础数据发生更改时，数据透视表不会自动刷新。若要刷新，请单击数据透视表内的任意位置以高亮显示“数据透视表工具
    分析”选项卡，然后单击“刷新”。


    ### 定义问题


    预先思考您希望通过数据透视表回答哪些问题是一种良好的实践。一些典型的问题如下：


    - 每日平均销售额是多少？

    - 表现最佳的销售人员是谁？

    - 一周中的哪几天的销售额最高？

    - 哪几个月的销售额最高？


    ### 创建数据透视表


    定义数据透视表的步骤如下：


    确保基础数据采用表格格式，第一行显示字段名称，并且数据周围有空白行和列，或者从第 1 行或 A 列开始。按下 `Ctrl+T` 将数据定义为表格，如图 3-3
    所示。单击表格内的任意位置并突出显示“插入”选项卡。单击 `数据透视表`。将出现如图 3-4 所示的屏幕。请注意，已选中当前表格，并且默认情况下，数据透视表将被放置在一个新工作表中。单击
    `确定`。


    ![A978-1-4842-0529-7_3_Fig4_HTML.jpg](img/A978-1-4842-0529-7_3_Fig4_HTML.jpg)


    图 3-4. 创建数据透视表对话框


    此时，您需要考虑要提取哪种类型的数据。我们将从每日销售额的汇总开始，细分出每日售出的型号。我们将通过将 `销售日期` 拖到“列”框，将 `型号` 拖到“行”，并将
    `价格` 拖到“值”来实现，如图 3-5 所示。请注意，默认显示的是“价格之和”。


    ![A978-1-4842-0529-7_3_Fig5_HTML.jpg](img/A978-1-4842-0529-7_3_Fig5_HTML.jpg)


    图 3-5. 显示按型号统计的汽车销售数量的基本数据透视表


    要将“价格之和”更改为“价格计数”，请右键单击单元格 `A3`，或下拉“值”下“价格计数”旁边的箭头，选择“值字段设置”和“计数”。结果如图 3-6 所示。


    ![A978-1-4842-0529-7_3_Fig6_HTML.jpg](img/A978-1-4842-0529-7_3_Fig6_HTML.jpg)


    图 3-6. 显示按型号统计的汽车销售价值的数据透视表


    ### 更改数据透视表


    更改数据透视表非常容易。要将水平轴从日期更改为销售人员，只需单击“列”框中的 `销售日期` 并将其拖回，然后选择“删除字段”。接着从“字段”列表中将 `销售人员`
    拖到“列”框。结果如图 3-7 所示。


    ![A978-1-4842-0529-7_3_Fig7_HTML.jpg](img/A978-1-4842-0529-7_3_Fig7_HTML.jpg)


    图 3-7. 显示按型号和销售人员统计的销售额的数据透视表


    ### 创建每日每位销售人员的销售额细分


    可以修改数据透视表以显示每天的销售额（按销售人员和型号划分）。只需将 `型号` 字段拖到“列”框，并将 `销售人员` 和 `销售日期` 字段拖到“行”框，以便在“行”框中同时显示
    `销售日期` 和 `销售人员`。结果如图 3-8 所示。


    ![A978-1-4842-0529-7_3_Fig8_HTML.jpg](img/A978-1-4842-0529-7_3_Fig8_HTML.jpg)


    图 3-8. 显示每日按销售人员和型号细分的销售额的数据透视表


    ### 按月显示销售额


    要按月显示销售报告，请右键单击 `销售日期` 列中的任意单元格，并从“组合”窗口中选择“月”，如图 3-9 所示，然后单击 `确定`。


    ![A978-1-4842-0529-7_3_Fig9_HTML.jpg](img/A978-1-4842-0529-7_3_Fig9_HTML.jpg)


    图 3-9. 选择按月分组的对话框


    生成的数据透视表如图 3-10 所示。


    ![A978-1-4842-0529-7_3_Fig10_HTML.jpg](img/A978-1-4842-0529-7_3_Fig10_HTML.jpg)


    图 3-10. 显示按月统计的销售人员及型号销售额的数据透视表


    ## 创建数据透视图


    要从数据透视表创建数据透视图，请在屏幕上显示数据透视表，然后执行以下操作：


    转到“数据透视表工具 分析”选项卡并选择 `数据透视图`。从图 3-11 所示的“插入图表”弹出窗口中选择所需的图表类型，然后单击 `确定`。在此示例中，我们将使用堆积柱形图。


    ![A978-1-4842-0529-7_3_Fig11_HTML.jpg](img/A978-1-4842-0529-7_3_Fig11_HTML.jpg)


    图 3-11. 插入图表对话框


    结果将显示如图 3-12 所示。


    ![A978-1-4842-0529-7_3_Fig12_HTML.jpg](img/A978-1-4842-0529-7_3_Fig12_HTML.jpg)


    图 3-12. 带有数据透视表的数据透视图

