    ![A978-1-4842-0529-7_2_Fig3_HTML.jpg](A978-1-4842-0529-7_2_Fig3_HTML.jpg)


    Figure 2-3.


    File formats that can be imported into Excel


    When importing files, it is best to work with a copy of the file, so that the
    original file remains unchanged in case the file is corrupted when it is imported.


    Figure [2-4](#A978-1-4842-0529-7_2_Chapter.html#Fig4) shows a comma-delimited
    file in Notepad. Note that the first row consists of the field names. All fields
    are separated by commas. Excel knows how to read this type of file into a spreadsheet.
    If a text file in this format is opened with Excel, it will appear as a spreadsheet,
    as shown in Figure [2-1](#A978-1-4842-0529-7_2_Chapter.html#Fig1).


