- fmt: '# Relational Databases


    As computers became more widely available, more data was stored, and software
    was needed to organize that data. Relational database management systems (RDBMS)
    are based on the relational model developed by E. F. Codd at IBM in the early
    1970s. Even though the early work was done at IBM, the first commercial RDBMS
    were released by Oracle in 1979.


    A relational database organizes data into tables of rows and columns, with a unique
    key for each row, called the primary key. A database is a collection of tables.
    Each entity in a database has its own table, with the rows representing instances
    of that entity. The columns store values for the attributes or fields.


    Relational algebra, first described by Codd at IBM, provides a theoretical foundation
    for modeling the data stored in relational databases and defining queries. Relational
    databases support selection, projection, and joins. Selection means selecting
    specified rows of a table based on a condition. Projection entails selecting certain
    specified columns or attributes. Joins means joining two or more tables, based
    on a condition.


    As discussed in [Chapter 5](#A978-1-4842-0529-7_5_Chapter.html), Structured Query
    Language (SQL) was first developed by IBM in the early 1970s. It was used to manipulate
    and retrieve data from early IBM relational database management systems (RDBMS).
    It was later implemented in other relational database management systems by Oracle
    and later Microsoft.


    ## Normalization


    Normalization is the process of organizing data in a database with the following
    objectives:


    - To avoid repeating fields, except for key fields, which link tables

    - To avoid multiple dependencies, which means avoiding fields that depend on anything
    other than the primary key


    There are several normal forms, the most common being the Third Normal Form (3NF),
    which is based on eliminating transitive dependencies, meaning eliminating fields
    not dependent on the primary key. In other words, data is in the 3NF when each
    field depends on the primary key, the whole primary key, and nothing but the primary
    key.


    Figure [1-4](#A978-1-4842-0529-7_1_Chapter.html#Fig4), which is the same as Figure
    [4-11](#A978-1-4842-0529-7_4_Chapter.html#Fig11), shows relationships among multiple
    tables. The lines with arrows indicate relationships between tables. There are
    three primary types of relationships.


    - **One to one (1-1)** means that there is a one-to-one correspondence between
    fields. Generally, fields with a one-to-one correspondence would be in the same
    table.

    - **One to many** means that for each record in one table, there are many records
    in the corresponding table. The many is indicated by an arrow at the end of the
    line. Many means zero to n. For example, as shown in Figure [1-4](#A978-1-4842-0529-7_1_Chapter.html#Fig4),
    for each product code in the products table, there could be many instances of
    Product ID in the order details table, but each Product ID is associated with
    only one product code in the products table.

    - **Many to many** means a relationship from many of one entity to many of another
    entity. For example, authors and books: Each author can have many books, and each
    book can have many authors. Many means zero to n.


    ![A978-1-4842-0529-7_1_Fig4_HTML.jpg](A978-1-4842-0529-7_1_Fig4_HTML.jpg)


    *Figure 1-4. Showing relations among tables*


    ## Database Software for Personal Computers


    In the 1980s, database programs were developed for personal computers, as they
    became more widely used. dBASE II, one of the first relational programmable database
    systems for personal computers, was developed by Wayne Ratliff at the Jet Propulsion
    Lab (JPL) in Pasadena, California. In the early 1980s, he partnered with George
    Tate to form the Ashton-Tate company to market dBASE II, which became very successful.
    In the mid-1980s, dBASE III was released with enhanced features.


    dBASE programs were interpreted, meaning that they ran more slowly than a compiled
    program, where all the instructions are translated to machine language at once.
    Clipper was released in 1985 as a compiled version of dBASE and became very popular.
    A few years later, FoxBase, which later became FoxPro, was released with additional
    enhanced features.


    # The Birth of Big Data and NoSQL


    The Internet was popularized during the 1990s, owing in part to the World Wide
    Web, which made it easier to use. Competing search engines allowed users to easily
    find data. Google was founded in 1996 and revolutionized search. As more data
    became available, the limitations of relational databases, which tried to fit
    everything into rectangular tables, became clear.


    In 1998, Carlo Strozzi used the term NoSQL. He reportedly later regretted using
    that term and thought that NoRel, or non-relational, would have been a better
    term.


    ## Hadoop Distributed File System (HDFS)


    Much of the technology of big data came out of the search engine companies. Hadoop
    grew out of Apple Nutch, an open source web search engine that was started in
    2002. It included a web crawler and search engine, but it couldn''t scale to handle
    billions of web pages.


    A paper was published in 2003 that described the architecture of Google''s Distributed
    File System (GFS), which was being used by Google to store the large files generated
    by web crawling and indexing. In 2004, an open source version was released as
    the Nutch Distributed File System (NDFS).


    In 2004, Google published a paper about MapReduce. By 2005, MapReduce had been
    incorporated into Nutch. MapReduce is a batch query process with the ability to
    run ad hoc queries against a large dataset. It unlocks data that was previously
    archived. Running queries can take several minutes or longer.


    In February 2006, Hadoop was set up as an independent subproject. Building on
    his prior work with Mike Cafarella, Doug Cutting went to work for Yahoo!, which
    provided the resources to turn Hadoop into a system that could be a useful tool
    for the Web. By 2008, Yahoo! based its search index on a Hadoop cluster. Hadoop
    was titled based on the name that Doug Cutting''s child gave a yellow stuffed
    elephant. Hadoop provides a reliable, scalable platform for storage and analysis
    running on cheap commodity hardware. Hadoop is open source.


    ## Big Data


    There is no single definition of big data, but there is currently a lot of hype
    surrounding it, so the meaning can be diluted. It is generally accepted to mean
    large volumes of data with an irregular structure involving hundreds of terabytes
    of data into petabytes and higher. It can include data from financial transactions,
    sensors, web logs, and social media. A more operational definition is that organizations
    have to use big data when their data processing needs get too big for traditional
    relational databases.


    Big data is based on the feedback economy where the Internet of Things places
    sensors on more and more equipment. More and more data is being generated as medical
    records are digitized, more stores have loyalty cards to track consumer purchases,
    and people are wearing health-tracking devices. Generally, big data is more about
    looking at behavior, rather than monitoring transactions, which is the domain
    of traditional relational databases. As the cost of storage is dropping, companies
    track more and more data to look for patterns and build predictive models.


    ### The Three V''s


    One way of characterizing big data is through the three V''s:


    - **Volume**: How much data is involved?

    - **Velocity**: How fast is it generated?

    - **Variety**: Does it have irregular structure and format?


    Two other V''s that are sometimes used are:


    - **Variability**: Does it involve a variety of different formats with different
    interpretations?

    - **Veracity**: How accurate is the data?'
