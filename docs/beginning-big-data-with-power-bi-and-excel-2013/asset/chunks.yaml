    列。请注意，在其右侧，列标题是 **添加列**。选择该列中的任意单元格，然后键入 `=` 开始一个公式。


    创建一个扩展价格列，即单价乘以数量。为此，在键入 `=` 后，点击 `SalesQuantity` 列，键入 `*`，然后点击 `unit price` 数量。公式显示在图
