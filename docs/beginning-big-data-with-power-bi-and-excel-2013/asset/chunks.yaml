- fmt: '### Splitting Delimited Fields


    In some cases, first and last names are included in the same field and are separated
    by commas. These and similar fields can be split using the `Text to Columns` option
    on the `Data` tab.


    Highlight the range of cells that you want to convert. Click `Text to Columns`
    on the `Data` tab. In the pop-up window, select `Delimited`, as shown in Figure
    [2-15](#A978-1-4842-0529-7_2_Chapter.html#Fig15). Then click `Next`.


    ![A978-1-4842-0529-7_2_Fig15_HTML.jpg](A978-1-4842-0529-7_2_Fig15_HTML.jpg)


    Figure 2-15.


    `Convert Text to Columns` Dialog


    On the next pop-up window, shown in Figure [2-16](#A978-1-4842-0529-7_2_Chapter.html#Fig16),
    select `Comma` and `Space` as the delimiters and review the preview. If the preview
    looks right, click `Next`. The reason for including the space as a delimiter is
    to accommodate middle initials, which are, in this example, separated from their
    respective first names by a space.


    ![A978-1-4842-0529-7_2_Fig16_HTML.jpg](A978-1-4842-0529-7_2_Fig16_HTML.jpg)


    Figure 2-16.


    Data preview of `Text to Columns`


    In the next pop-up window, select each column in the `Data Preview` window and
    click `Text` as the format, as shown in Figure [2-17](#A978-1-4842-0529-7_2_Chapter.html#Fig17).
    Enter the destination where you want the results to appear, then click `Finish`.


    ![A978-1-4842-0529-7_2_Fig17_HTML.jpg](A978-1-4842-0529-7_2_Fig17_HTML.jpg)


    Figure 2-17.


    Last step of `Convert Text to Columns`


    ### Splitting Complex, Delimited Fields


    More complex cases involving multiple data elements in a single field can often
    be solved through using Excel’s built-in functions. Some of the functions that
    are available for string manipulation are shown in Table [2-1](#A978-1-4842-0529-7_2_Chapter.html#Tab1).


    Table 2-1.


    Available Functions for String Manipulation


    | Function | Description |

    | --- | --- |

    | `LEN(text)` | Returns the number of characters in the text string |

    | `LEFT(text,num_chars)` | Returns the leftmost number of characters specified
    by `num_chars` |

    | `RIGHT(text,num_chars)` | Returns the rightmost number of characters specified
    by `num_chars` |

    | `MID(text,start,num_chars)` | Returns the number of characters specified by
    `num_chars`, starting from the position specified by `start` |

    | `SEARCH(find_text,within_text,start_num)` | Returns the position at which the
    specified `find_text` starts in `within_text` when reading from left to right.
    Not case sensitive. `start_num` specifies the occurrence of the text that you
    want. The default is 1. |

    | `TRIM(text)` | Removes all leading and trailing spaces from a text string, except
    single spaces between words |

    | `CLEAN(text)` | Removes all non-printable characters from a text string |

    | `LOWER(text)` | Returns string with all characters converted to lower case |

    | `UPPER(text)` | Returns string with all characters converted to upper case |

    | `PROPER(text)` | Returns string with first letter of each word in upper case
    |


    Functions can be nested. For example, we could extract the last name by using
    the following formula:


    `=LEFT(F7,SEARCH(",",F7)-1)`


    This function would extract the leftmost characters up to the position of the
    comma. To extract the first name and middle initial, use the following:


    `=RIGHT(F7,SEARCH(", ",F7)+1)`


    ### Removing Duplicates


    It is not unusual for imported data to include duplicate records. Duplicate records
    can be removed by using the `Remove Duplicates` option on the `Data` tab.


    It is always a good idea to work with a copy of the original files, to prevent
    valid data from being deleted. To delete duplicates, simply highlight the columns
    that contain duplicate values and click `Remove Duplicates`, as shown in Figure
    [2-18](#A978-1-4842-0529-7_2_Chapter.html#Fig18). Confirm the columns that contain
    duplicates and click `OK`. Only the rows in which all the values are the same
    will be removed.


    ![A978-1-4842-0529-7_2_Fig18_HTML.jpg](A978-1-4842-0529-7_2_Fig18_HTML.jpg)


    Figure 2-18.


    Removing duplicates


    ## Input Validation


    Excel provides tools to check for valid input. If data is not valid, the result
    can be Garbage In, Garbage Out (GIGO). Excel provides data validation tools that
    are usually associated with data entry; however, they can be used to flag cells
    from data that has already been entered. In the example shown in Figure [2-19](#A978-1-4842-0529-7_2_Chapter.html#Fig19),
    the valid range for sales figures is 0 to $20,000, as defined through the `Data
    Validation` option on the `Data` tab.


    ![A978-1-4842-0529-7_2_Fig19_HTML.jpg](A978-1-4842-0529-7_2_Fig19_HTML.jpg)


    Figure 2-19.


    `Data Validation` dialog


    Any values outside of the range can be highlighted by selecting the `Circle Invalid
    Data` option under `Data Validation` on the `Data` tab. The result is shown in
    Figure [2-20](#A978-1-4842-0529-7_2_Chapter.html#Fig20).


    ![A978-1-4842-0529-7_2_Fig20_HTML.jpg](A978-1-4842-0529-7_2_Fig20_HTML.jpg)


    Figure 2-20.


    Invalid data flagged with red circle


    ## Working with Data Forms


    One of the hidden and less documented features in Excel is the `Data Forms` feature.
    Sometimes it is easier to read data in which each record is displayed as a form
    rather than just in tabular format. By default, there is no `Data Forms` icon
    on the toolbars. `Data Forms` can be accessed by clicking a cell in a table with
    row headings and pressing `Alt`+`D` and then `O` (as in Oscar). `Data Forms` can
    also be added to the `Quick Access Toolbar`. This can be done via the following
    steps:


    Click the down arrow at the rightmost end of the `Quick Access Toolbar` (located
    at the top-left section of the screen) and click `More Commands`, as shown in
    Figure [2-21](#A978-1-4842-0529-7_2_Chapter.html#Fig21).


    ![A978-1-4842-0529-7_2_Fig21_HTML.jpg](A978-1-4842-0529-7_2_Fig21_HTML.jpg)


    Figure 2-21.


    Customize `Quick Access Toolbar` menu


    After clicking `More Commands`, select `Commands Not in the Ribbon`, at the top
    of the screen. The screen shown in Figure [2-22](#A978-1-4842-0529-7_2_Chapter.html#Fig22)
    will appear. Find and select the icon for forms and press the `Add` button in
    the middle to put it on the `Quick Access Toolbar`.


    ![A978-1-4842-0529-7_2_Fig22_HTML.jpg](A978-1-4842-0529-7_2_Fig22_HTML.jpg)


    Figure 2-22.


    Customize the `Quick Access Toolbar` menu


    To use data forms, click the row that contains the data to be viewed in the form.
    Then click the `Form` icon in the `Quick Access Toolbar` to see the display shown
    in Figure [2-23](#A978-1-4842-0529-7_2_Chapter.html#Fig23). Fields can be edited
    in the data form. Click the `Find Next` and `Find Previous` buttons to move through
    the records.


    ![A978-1-4842-0529-7_2_Fig23_HTML.jpg](A978-1-4842-0529-7_2_Fig23_HTML.jpg)


    Figure 2-23.


    Using a data form


    ## Selecting Records


    Data forms can be used to selectively look at certain records based on a criterion
    by following these steps:


    1. Click a cell in the table.

    2. Click the `Form` icon in the `Quick Access Toolbar` or press `Alt`+`D`, then
    `O`.

    3. In the form, click `Criteria` and enter the criteria you want to use, such
    as `City=Oakland`, as shown in Figure [2-24](#A978-1-4842-0529-7_2_Chapter.html#Fig24).


    ![A978-1-4842-0529-7_2_Fig24_HTML.jpg](A978-1-4842-0529-7_2_Fig24_HTML.jpg)


    Figure 2-24.


    Using a data form to select records based on a criterion


    Then click `Find Next`, and `Find Previous` will only show rows that meet the
    designated criteria.'
