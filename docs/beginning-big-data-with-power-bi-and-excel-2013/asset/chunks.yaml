    # 查询编辑器主页功能区上的关键选项


    本节介绍查询编辑器主页功能区上的关键选项，如图 8-2 所示。


    - `Close & Load`：关闭编辑器并将数据加载到 Excel 工作表或数据模型中。

    - `Refresh Preview`：刷新查询，重新处理所有步骤并预览结果。

    - `Advanced Editor`：显示用于以 `M` 查询语言提取数据的代码。

    - `Choose Columns`/`Remove Columns`：允许保留或移除选定的列。单击 `Choose Columns` 图标会显示一个列列表，可以取消勾选以移除某些列，如图
    8-3 所示。


    ![A978-1-4842-0529-7_8_Fig3_HTML.jpg](img/A978-1-4842-0529-7_8_Fig3_HTML.jpg)


    图 8-3. `Choose Columns` 对话框


    - `Keep Rows`/`Remove Rows`：允许保留或移除选定的行。

    - `Remove Duplicates`：移除重复项。请谨慎定义重复项的判定条件。例如，在按天列出的股票价格列表中，如果仅根据股票代码移除重复项，则每个股票只会保留一行唯一数据。

    - `Sort`：按升序或降序对列进行排序。请记住，查询编辑器仅处理数据的子集。最好等到数据加载到工作表或数据模型中后再进行排序。

    - `Split Column`：基于分隔符（如逗号或空格）拆分列。

    - `Group By`：根据一个或多个字段对行进行分组。


    ![A978-1-4842-0529-7_8_Fig2_HTML.jpg](img/A978-1-4842-0529-7_8_Fig2_HTML.jpg)


    图 8-2. 查询编辑器界面


    请注意，移除或筛选行的另一种方法是点击列标题右侧的箭头并取消选中相应的值，如图 8-2 所示。


    ## 一个简单的人口示例


    本示例将展示如何使用 `Data Catalog Search` 选项以表格格式检索人口数据以供分析。`Data Catalog Search` 选项会搜索一个由公共数据网站（如
    Wikipedia 和美国人口普查局网站）组成的精选数据目录，并允许轻松从这些网站提取表格。它并非功能齐全的搜索引擎，似乎能够理解以“最大”或“最多”等词语开头的搜索。登录公司网络后，它也可以搜索公司数据库。对于此示例，请执行以下步骤。


    在 `Power Query` 选项卡上，单击 `Data Catalog Search`。在右侧的“搜索”窗格中，输入“most populated countries”。将鼠标指针悬停在结果上以预览数据。然后，将鼠标悬停在列表中来自
    Wikipedia 的标题为“Secondary table—List of sovereign states and dependent territories
    by population density”的条目上。结果如图 8-4 所示。请注意底部的 `Load` 和 `Edit` 提示。


    ![A978-1-4842-0529-7_8_Fig4_HTML.jpg](img/A978-1-4842-0529-7_8_Fig4_HTML.jpg)


    图 8-4. 人口数据预览


    单击预览左下方的 `Edit`，将表格中的数据子集加载到查询编辑器中，如图 8-5 所示。该表格列出了国家及其以平方英里或平方公里为单位的人口和面积，并显示了每平方英里或平方公里的人口密度。


    ![A978-1-4842-0529-7_8_Fig5_HTML.jpg](img/A978-1-4842-0529-7_8_Fig5_HTML.jpg)


    图 8-5. 查询编辑器中的入口数据


    在查询编辑器中，可以通过删除行或列、拆分或合并列或移除重复项来处理数据。例如，要删除以公里为单位的面积或密度列，请先单击要删除的第一列的列标题，然后按住 Ctrl
    键并单击第二列的列标题以选中这两列，如图 8-6 所示。


    ![A978-1-4842-0529-7_8_Fig6_HTML.jpg](img/A978-1-4842-0529-7_8_Fig6_HTML.jpg)


    图 8-6. 高亮显示要删除的列


    然后，在选项卡的 `Remove Columns` 下单击 `Remove Columns`，以移除选定的列。将数据调整为所需形状后，单击 `Close &
    Load`，将数据加载到 Excel 电子表格中。


    ## 标普 500 股票指数的表现


    本示例将展示如何检索标普 500 指数的表现数据，请执行以下步骤：


    在 `Power Query` 功能区上，单击 `Data Catalog Search`。在搜索框中，输入“S&P 500 performance”。将鼠标悬停在第一个链接（标题为“Total
    annual returns...”）上，如图 8-7 所示。


    ![A978-1-4842-0529-7_8_Fig7_HTML.jpg](img/A978-1-4842-0529-7_8_Fig7_HTML.jpg)


    图 8-7. 数据预览


    单击左下方的 `Edit`，将显示 1970 年至 2013 年每年标普 500 指数回报率的数据加载到查询编辑器中，如图 8-8 所示。


    ![A978-1-4842-0529-7_8_Fig8_HTML.jpg](img/A978-1-4842-0529-7_8_Fig8_HTML.jpg)


    图 8-8. 查询编辑器中的数据


    通过单击 `Choose Columns` 并取消勾选不需要的列来选择列。对于此示例，将移除 5 年、10 年、15 年和 20 年回报率列，如图 8-9
    所示。单击 `OK`。


    ![A978-1-4842-0529-7_8_Fig9_HTML.jpg](img/A978-1-4842-0529-7_8_Fig9_HTML.jpg)


    图 8-9. `Choose Columns` 对话框


    要移除底部的四行，请单击 `Remove Rows`，然后选择 `Remove Bottom Rows`，并输入 `4` 作为要移除的行数，如图 8-10
    所示，然后单击 `OK`。


    ![A978-1-4842-0529-7_8_Fig10_HTML.jpg](img/A978-1-4842-0529-7_8_Fig10_HTML.jpg)


    图 8-10. `Remove Rows` 对话框


    然后，单击功能区左侧的 `Close & Load`，将数据导入电子表格，结果如图 8-11 所示。


    ![A978-1-4842-0529-7_8_Fig11_HTML.jpg](img/A978-1-4842-0529-7_8_Fig11_HTML.jpg)


    图 8-11. 数据已导入电子表格

