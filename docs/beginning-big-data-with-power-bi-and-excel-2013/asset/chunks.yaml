    the size slider, as shown in Figure [9-14](#A978-1-4842-0529-7_9_Chapter.html#Fig14).


    ![A978-1-4842-0529-7_9_Fig14_HTML.jpg](A978-1-4842-0529-7_9_Fig14_HTML.jpg)


    Figure 9-14.


    Adusting bubble size   Click the Add Scene on the left end of the ribbon.   Another
    view is the heat map view shown in Figure [9-15](#A978-1-4842-0529-7_9_Chapter.html#Fig15).
    Note that San Francisco and Los Angeles, the two largest cities in California,
    have the most crime.


    ![A978-1-4842-0529-7_9_Fig15_HTML.jpg](A978-1-4842-0529-7_9_Fig15_HTML.jpg)


    Figure 9-15.


