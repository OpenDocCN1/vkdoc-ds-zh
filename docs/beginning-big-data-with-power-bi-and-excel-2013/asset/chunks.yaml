- fmt: '# Generating a Report of Total Order Value by Employee


    In this example, a report will be generated of total order value by employee.
    To create this report, three tables will be linked: `employees`, `orders`, and
    `order details`.


    For this example, follow steps 1-6 from the previous example in the "Importing
    an External Database" section.


    Enter the following SQL statements, as shown in Figure 5-12, to extract the sum
    of price times quantity for all orders broken down by employee. Click **Validate**
    to make sure that the SQL statement is entered correctly.


    ![A978-1-4842-0529-7_5_Fig12_HTML.jpg](A978-1-4842-0529-7_5_Fig12_HTML.jpg)


    **Figure 5-12.**


    SQL query:

    ```

    Select employees.[last name], sum([order details].[unit price] * [order details].quantity)
    from employees, orders, [order details] where employees.id=orders.[employee id]
    and orders.[order id]=[order details].[order id] group by employees.[last name]

    ```


    Note that two relationships are used to link three tables, based on the relationships
    shown in Figure 5-3. No fields are displayed from the `orders` table, but that
    table is used as a link table. The following are the relationships from Figure
    5-3 that are being used in this example:

    - `employees.id=orders.[employee id]`

    - `orders.[order id]=[order details].[order id]`


    Click **Finish** to execute the SQL statement. The actual data generated is shown
    in Figure 5-14—a listing of the value of orders by employees.


    ![A978-1-4842-0529-7_5_Fig14_HTML.jpg](A978-1-4842-0529-7_5_Fig14_HTML.jpg)


    **Figure 5-14.**


    Total value of orders by employee. This query generates eight rows, as shown in
    Figure 5-13.


    ![A978-1-4842-0529-7_5_Fig13_HTML.jpg](A978-1-4842-0529-7_5_Fig13_HTML.jpg)


    **Figure 5-13.**


    Success screen showing eight rows generated by this query.


