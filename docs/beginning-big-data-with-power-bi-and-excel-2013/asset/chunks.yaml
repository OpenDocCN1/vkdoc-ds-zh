    导入数据、试用屏幕、Azure 市场浏览屏幕、导入数据对话框、实际人均 GDP 记录、通过切片器导入 Excel


    ## B


    - **大数据**：农业、Apache Hadoop、商业实现、定义、HDFS、MapReduce、Apache Spark、特性

    - **霍乱地图**：成本节约、定义、Google 地球、Google 流感趋势、HDFS、工业设备、工业互联网、生命周期、医疗化智能手机、Microsoft、自助式
    BI、中层管理者、自然资源、个人电脑、预测性警务、关系型数据库、dBASE 程序、规范化、投影、选择、存储容量的作用、时间线图、时间序列图、追踪疟疾


    ## C


