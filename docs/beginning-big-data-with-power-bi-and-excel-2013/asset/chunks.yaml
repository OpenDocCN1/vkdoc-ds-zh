  trans: '好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。



    # 从 Excel 表格创建数据模型


    本节将以一个简单示例开始，说明关联表格的原理。在此示例中，我们将根据两个小表格（`employee` 和 `department`）来创建一个数据模型。这些表格是规范化的，这意味着重复的字段已被消除。在员工记录中，不再记录某个部门的所有信息，而仅使用一个部门代码。然后，在
    `employee` 和 `department` 表格之间定义一个关系，这样就可以从 `department` 表格中提取部门信息了。


    可以使用数据透视表从数据模型中提取有意义的信息。要创建一个利用两个表格的数据来显示各部门平均薪资的数据透视表，请执行以下操作：


    通过单击表格内部并按 `Ctrl+T`，将每个数据组定义为一个表格。单击表格中的任意位置，然后单击“表格工具设计”选项卡。在功能区的左侧，输入表格名称，在此示例中，输入
    `employees`，如图 4-3 所示。同时，将 `departments` 重命名。


    ![A978-1-4842-0529-7_4_Fig3_HTML.jpg](img/A978-1-4842-0529-7_4_Fig3_HTML.jpg)


    图 4-3. 员工和部门表格


    选中 `employee` 表格。转到“插入”选项卡，然后选择“数据透视表”。在“创建数据透视表”对话框中，选择“将此数据添加到数据模型”，然后单击“确定”，如图
    4-4 所示。


    ![A978-1-4842-0529-7_4_Fig4_HTML.jpg](img/A978-1-4842-0529-7_4_Fig4_HTML.jpg)


    图 4-4. “创建数据透视表”对话框


    在“数据透视表字段”窗格中，单击“全部”（位于右上角）以查看两个表格，如图 4-5 所示。将 `deptname` 字段从 `department` 表格拖到“列”框中。将“薪资总和”从
    `employees` 表格拖到“值”中。请注意提示“可能需要表格之间的关系”。单击“创建”。


    ![A978-1-4842-0529-7_4_Fig5_HTML.jpg](img/A978-1-4842-0529-7_4_Fig5_HTML.jpg)


    图 4-5. 按部门显示薪资总额的数据透视表


    如图 4-6 所示，选择 `employees` 作为第一个表格，`dept` 作为外键。选择 `departments` 作为第二个表格，`deptcode`
    作为主键。单击“确定”。请注意，由列标题定义的字段名称不必相同。


    ![A978-1-4842-0529-7_4_Fig6_HTML.jpg](img/A978-1-4842-0529-7_4_Fig6_HTML.jpg)


    图 4-6. “创建关系”对话框


    将 `lname` 拖到“行”框中。生成的数据透视表将显示按部门划分的薪资总额，如图 4-7 所示。


    ![A978-1-4842-0529-7_4_Fig7_HTML.jpg](img/A978-1-4842-0529-7_4_Fig7_HTML.jpg)


    图 4-7. 按部门显示员工薪资的数据透视表


    要改为查看各部门的平均薪资，首先从“行”框中删除 `lname` 字段，然后在“数据透视表字段”窗格中，单击“值”框中“薪资总和”旁边的下拉箭头。选择“值字段设置”，然后选择“平均值”以查看各部门的平均薪资，如图
    4-8 所示。


    ![A978-1-4842-0529-7_4_Fig8_HTML.jpg](img/A978-1-4842-0529-7_4_Fig8_HTML.jpg)


    图 4-8. 按部门显示平均薪资的数据透视表


    此示例展示了如何使用部门代码关联两个表格（`employees` 和 `departments`）。`dept` 是 `employees` 表格中的外键，`deptcode`
    是 `departments` 表格的主键。数据透视表关联了这两个表格。


    # 将数据直接加载到数据模型


    在本示例中，我们将使用 Microsoft 的 Northwind Access 数据库中的一个示例，将数据直接加载到数据模型中。本示例演示了在 Excel
    之上运行 PowerPivot。


    要将数据直接加载到数据模型，请执行以下操作：


    单击“PowerPivot”选项卡以打开功能区。单击功能区左上角的“管理”按钮。打开 PowerPivot 窗口后，可以通过单击“获取外部数据”组中的“从数据库”来加载数据。这将提供数据库源的选择，如图
    4-9 所示。在本示例中，将选择“从 Access”。


    ![A978-1-4842-0529-7_4_Fig9_HTML.jpg](img/A978-1-4842-0529-7_4_Fig9_HTML.jpg)


    图 4-9. PowerPivot“获取外部数据”组


    在“表导入向导”对话框中，单击“浏览”按钮找到要导入的 Access 文件。对于本示例，将选择文档文件夹中的 `Database1`。此文件可从 Apress
    网站获取。单击“测试连接”。如果测试成功，请单击“下一步”。


    PowerPivot 会打开“表导入向导”，如图 4-10 所示，引导您完成加载数据的过程。选择“从表和视图列表中选择”以选择要导入的数据。单击“下一步”。


    ![A978-1-4842-0529-7_4_Fig10_HTML.jpg](img/A978-1-4842-0529-7_4_Fig10_HTML.jpg)


    图 4-10. 表导入向导


    单击左上角的框以选择所有表格，如图 4-11 所示。请注意，在对话框的右下角，有一个“预览和筛选”选项。此选项可用于从非常大的数据集中选择数据子集。在此示例中，将导入所有表格中的所有行。单击“完成”以完成导入。


    ![A978-1-4842-0529-7_4_Fig11_HTML.jpg](img/A978-1-4842-0529-7_4_Fig11_HTML.jpg)


    图 4-11. 表导入向导 — 选择表和视图


    如果导入的数据中存在关系，这些关系将自动加载到数据模型中。请注意，PowerPivot 表格是只读的，因此无法更改数据。


    要查看关系，请转到“PowerPivot”选项卡并选择“管理”以打开 PowerPivot 窗口。然后，单击功能区右端的“PowerPivot 关系图视图”以查看表格之间的关系，并单击“完成”以完成导入，如图
    4-12 所示。


    ![A978-1-4842-0529-7_4_Fig12_HTML.jpg](img/A978-1-4842-0529-7_4_Fig12_HTML.jpg)


    图 4-12. 关系图视图


    # 从两个表格创建数据透视表


    在此示例中，将基于 `inventory` 和 `products` 表格创建一个数据透视表。请注意，在图 4-12 中，两个表格基于产品代码进行链接。Inventory
    表格包含库存中每个物料的现有量数据，主键为 `ProductCode`。要查找完整的产品名称，必须根据产品 ID 在产品表中执行查找。要基于这两个表格创建数据透视表，请执行以下操作：


    在 PowerPivot 窗口中，单击“文件”选项卡上的“数据透视表”，然后从菜单中选择“数据透视表”。单击“确定”将数据透视表放在新工作表中。在“数据透视表字段”窗格中，单击
    `products` 表格旁边的箭头，并将 `ProductName` 字段拖到“行”框中。然后向上滚动到 `inventory` 表格，单击左箭头显示字段，并将
    `OnHand` 拖到“值”框中。结果如图 4-13 所示，其中显示了每种产品的现有量总和。


    ![A978-1-4842-0529-7_4_Fig13_HTML.jpg](img/A978-1-4842-0529-7_4_Fig13_HTML.jpg)


    图 4-13. 显示产品名称和现有量的数据透视表

