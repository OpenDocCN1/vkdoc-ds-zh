    In some cases, first and last names are included in the same field and are separated
    by commas. These and similar fields can be split using the Text to Columns option
    on the Data tab.


    Highlight the range of cells that you want to convert.   Click Text to Columns
    on the Data tab. In the pop-up window, select Delimited, as shown in Figure [2-15](#A978-1-4842-0529-7_2_Chapter.html#Fig15).
    Then click Next.


    ![A978-1-4842-0529-7_2_Fig15_HTML.jpg](A978-1-4842-0529-7_2_Fig15_HTML.jpg)


    Figure 2-15.


    Convert Text to Columns Dialog  On the next pop-up window, shown in Figure [2-16](#A978-1-4842-0529-7_2_Chapter.html#Fig16),
    select Comma and Space as the delimiters and review the preview. If the preview
    looks right, click Next. The reason for including the space as a delimiter is
    to accommodate middle initials, which are, in this example, separated from their
    respective first names by a space.


    ![A978-1-4842-0529-7_2_Fig16_HTML.jpg](A978-1-4842-0529-7_2_Fig16_HTML.jpg)


    Figure 2-16.


    Data preview of Text to Columns  In the next pop-up window, select each column
    in the Data Preview window and click Text as the format, as shown in Figure [2-17](#A978-1-4842-0529-7_2_Chapter.html#Fig17).
    Enter the destination where you want the results to appear, then click Finish.


    ![A978-1-4842-0529-7_2_Fig17_HTML.jpg](A978-1-4842-0529-7_2_Fig17_HTML.jpg)


    Figure 2-17.


    Last step of Convert Text to Columns


    ### Splitting Complex, Delimited Fields


    More complex cases involving multiple data elements in a single field can often
    be solved through using Excel’s built-in functions. Some of the functions that
    are available for string manipulation are shown in Table [2-1](#A978-1-4842-0529-7_2_Chapter.html#Tab1).


    Table 2-1.


    Available Functions for String Manipulation


    | Function | Description |

    | --- | --- |

    | `LEN(text)` | Returns the number of characters in the text string |

    | `LEFT(text,num_chars)` | Returns the leftmost number of characters specified
    by `num_chars` |

    | `RIGHT(text,num_chars)` | Returns the rightmost number of characters specified
    by `num_chars` |

    | `MID(text,start,num_chars)` | Returns the number of characters specified by
    `num_chars`, starting from the position specified by `start` |

    | `SEARCH(find_text,within_text,start_num)` | Returns the position at which the
    specified `find_text` starts in `within_text` when reading from left to right.
    Not case sensitive. `start_num` specifies the occurrence of the text that you
    want. The default is 1. |

    | `TRIM(text)` | Removes all leading and trailing spaces from a text string, except
    single spaces between words |

    | `CLEAN(text)` | Removes all non-printable characters from a text string |

    | `LOWER(text)` | Returns string with all characters converted to lower case |

    | `UPPER(text)` | Returns string with all characters converted to upper case |

    | `PROPER(text)` | Returns string with first letter of each word in upper case
    |


    Functions can be nested. For example, we could extract the last name by using
    the following formula:


    `=LEFT(F7,SEARCH(",",F7)-1)`


    This function would extract the leftmost characters up to the position of the
    comma. To extract the first name and middle initial, use the following:


    `=RIGHT(F7,SEARCH(", ",F7)+1)`


    ### Removing Duplicates


    It is not unusual for imported data to include duplicate records. Duplicate records
    can be removed by using the Remove Duplicates option on the Data tab.


    It is always a good idea to work with a copy of the original files, to prevent
    valid data from being deleted. To delete duplicates, simply highlight the columns
    that contain duplicate values and click Remove Duplicates, as shown in Figure
    [2-18](#A978-1-4842-0529-7_2_Chapter.html#Fig18). Confirm the columns that contain
    duplicates and click OK. Only the rows in which all the values are the same will
    be removed.


    ![A978-1-4842-0529-7_2_Fig18_HTML.jpg](A978-1-4842-0529-7_2_Fig18_HTML.jpg)


    Figure 2-18.


    Removing duplicates


    ## Input Validation


    Excel provides tools to check for valid input. If data is not valid, the result
    can be Garbage In, Garbage Out (GIGO). Excel provides data validation tools that
    are usually associated with data entry; however, they can be used to flag cells
    from data that has already been entered. In the example shown in Figure [2-19](#A978-1-4842-0529-7_2_Chapter.html#Fig19),
    the valid range for sales figures is 0 to $20,000, as defined through the Data
    Validation option on the Data tab.


    ![A978-1-4842-0529-7_2_Fig19_HTML.jpg](A978-1-4842-0529-7_2_Fig19_HTML.jpg)


    Figure 2-19.


    Data Validation dialog


    Any values outside of the range can be highlighted by selecting the Circle Invalid
    Data option under Data Validation on the Data tab. The result is shown in Figure
    [2-20](#A978-1-4842-0529-7_2_Chapter.html#Fig20).


    ![A978-1-4842-0529-7_2_Fig20_HTML.jpg](A978-1-4842-0529-7_2_Fig20_HTML.jpg)


    Figure 2-20.


    Invalid data flagged with red circle


    ## Working with Data Forms


    One of the hidden and less documented features in Excel is the Data Forms feature.
    Sometimes it is easier to read data in which each record is displayed as a form
    rather than just in tabular format. By default, there is no Data Forms icon on
    the toolbars. Data Forms can be accessed by clicking a cell in a table with row
    headings and pressing Alt`+`D and then O (as in Oscar). Data Forms can also be
    added to the Quick Access Toolbar. This can be done via the following steps:


    Click the down arrow at the rightmost end of the Quick Access Toolbar (located
    at the top-left section of the screen) and click More Commands, as shown in Figure
    [2-21](#A978-1-4842-0529-7_2_Chapter.html#Fig21).


    ![A978-1-4842-0529-7_2_Fig21_HTML.jpg](A978-1-4842-0529-7_2_Fig21_HTML.jpg)


    Figure 2-21.


    Customize Quick Access Toolbar menu  After clicking More Commands, select “Commands
    Not in the Ribbon,” at the top of the screen. The screen shown in Figure [2-22](#A978-1-4842-0529-7_2_Chapter.html#Fig22)
    will appear. Find and select the icon for forms and press the Add ➤ button in
    the middle to put it on the Quick Access Toolbar.


    ![A978-1-4842-0529-7_2_Fig22_HTML.jpg](A978-1-4842-0529-7_2_Fig22_HTML.jpg)


    Figure 2-22.


    Customize the Quick Access Toolbar menu  To use data forms, click the row that
    contains the data to be viewed in the form. Then click the Form icon in the Quick
    Access Toolbar to see the display shown in Figure [2-23](#A978-1-4842-0529-7_2_Chapter.html#Fig23).
    Fields can be edited in the data form. Click the Find Next and Find Previous buttons
    to move through the records.


    ![A978-1-4842-0529-7_2_Fig23_HTML.jpg](A978-1-4842-0529-7_2_Fig23_HTML.jpg)


    Figure 2-23.


    Using a data form


    ## Selecting Records


    Data forms can be used to selectively look at certain records based on a criterion
    by following these steps:


    Click a cell in the table.   Click the Form icon in the Quick Access Toolbar or
    press Alt`+`D, then O.   In the form, click Criteria and enter the criteria you
    want to use, such as City=Oakland, as shown in Figure [2-24](#A978-1-4842-0529-7_2_Chapter.html#Fig24).


    ![A978-1-4842-0529-7_2_Fig24_HTML.jpg](A978-1-4842-0529-7_2_Fig24_HTML.jpg)


    Figure 2-24.


    Using a data form to select records based on a criterion   Then click Find Next,
    and Find Previous will only show rows that meet the designated criteria.'
  trans: '好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例格式，将给定的英文文本翻译成中文。



    ### 拆分分隔字段


    在某些情况下，名字和姓氏包含在同一个字段中，并用逗号分隔。这些字段以及类似的字段，可以使用“数据”选项卡上的“分列”选项进行拆分。


    选中要转换的单元格区域。单击“数据”选项卡上的“分列”。在弹出的窗口中，选择“分隔符号”，如图 2-15 所示。然后点击“下一步”。


    ![A978-1-4842-0529-7_2_Fig15_HTML.jpg](img/A978-1-4842-0529-7_2_Fig15_HTML.jpg)


    图 2-15.


    “文本分列向导”对话框


    在下一个弹出窗口中，如图 2-16 所示，选择“逗号”和“空格”作为分隔符，并预览结果。如果预览正确，点击“下一步”。将空格作为分隔符包含进来，是为了处理中间名缩写的情况，在本例中，中间名缩写与其各自的名字之间是用空格分隔的。


    ![A978-1-4842-0529-7_2_Fig16_HTML.jpg](img/A978-1-4842-0529-7_2_Fig16_HTML.jpg)


    图 2-16.


    “文本分列”的数据预览


    在下一个弹出窗口中，在“数据预览”窗口中选择每一列，并选择“文本”作为该列的格式，如图 2-17 所示。输入结果要放置的目标位置，然后点击“完成”。


    ![A978-1-4842-0529-7_2_Fig17_HTML.jpg](img/A978-1-4842-0529-7_2_Fig17_HTML.jpg)


    图 2-17.


    “文本分列向导”的最后一步


    ### 拆分复杂的分隔字段


    更复杂的情况（涉及单个字段中的多个数据元素）通常可以通过使用 Excel 的内置函数来解决。表 2-1 显示了可用于字符串操作的一些函数。


    表 2-1.


    可用于字符串操作的函数


    | 函数 | 说明 |

    | --- | --- |

    | `LEN(text)` | 返回文本字符串中的字符数 |

    | `LEFT(text,num_chars)` | 返回由 `num_chars` 指定的最左侧字符数 |

    | `RIGHT(text,num_chars)` | 返回由 `num_chars` 指定的最右侧字符数 |

    | `MID(text,start,num_chars)` | 从 `start` 指定的位置开始，返回由 `num_chars` 指定的字符数 |

    | `SEARCH(find_text,within_text,start_num)` | 从左到右读取时，返回指定的 `find_text` 在 `within_text`
    中开始的位置。不区分大小写。`start_num` 指定要查找的文本的出现次数。默认值为 1。 |

    | `TRIM(text)` | 删除文本字符串中所有前导和尾随空格，单词之间的单个空格除外 |

    | `CLEAN(text)` | 删除文本字符串中所有不可打印字符 |

    | `LOWER(text)` | 返回将所有字符转换为小写的字符串 |

    | `UPPER(text)` | 返回将所有字符转换为大写的字符串 |

    | `PROPER(text)` | 返回将每个单词的首字母转换为大写的字符串 |


    函数可以嵌套。例如，我们可以使用以下公式提取姓氏：


    `=LEFT(F7,SEARCH(",",F7)-1)`


    此函数将提取从最左侧到逗号位置的字符。要提取名字和中间名缩写，请使用以下公式：


    `=RIGHT(F7,SEARCH(", ",F7)+1)`


    ### 删除重复项


    导入的数据包含重复记录的情况并不少见。可以使用“数据”选项卡上的“删除重复项”选项来删除重复记录。


    为了不误删有效数据，最好始终使用原始文件的副本进行操作。要删除重复项，只需选中包含重复值的列，然后单击“删除重复项”，如图 2-18 所示。确认包含重复项的列，然后点击“确定”。只有所有值都相同的行才会被删除。


    ![A978-1-4842-0529-7_2_Fig18_HTML.jpg](img/A978-1-4842-0529-7_2_Fig18_HTML.jpg)


    图 2-18.


    删除重复项


    ## 输入验证


    Excel 提供了检查有效输入的工具。如果数据无效，结果可能会是“垃圾进，垃圾出”（GIGO）。Excel 提供了通常与数据输入相关的数据验证工具；但是，它们也可以用于标记已输入数据中的单元格。在图
    2-19 所示的示例中，通过“数据”选项卡上的“数据验证”选项，销售数据的有效范围定义为 0 到 $20,000。


    ![A978-1-4842-0529-7_2_Fig19_HTML.jpg](img/A978-1-4842-0529-7_2_Fig19_HTML.jpg)


    图 2-19.


    “数据验证”对话框


    任何超出此范围的值都可以通过选择“数据”选项卡上“数据验证”下的“圈释无效数据”选项来突出显示。结果如图 2-20 所示。


    ![A978-1-4842-0529-7_2_Fig20_HTML.jpg](img/A978-1-4842-0529-7_2_Fig20_HTML.jpg)


    图 2-20.


    用红色圆圈标记的无效数据


    ## 使用数据记录单


    Excel 中一个隐藏且文档记录较少的功能是“数据记录单”。有时，将每条记录显示为表单形式而不是单纯的表格格式，更便于阅读数据。默认情况下，工具栏上没有“数据记录单”图标。可以通过单击包含行标题的表格中的单元格，然后依次按下
    `Alt`+`D` 和 `O` 键来访问“数据记录单”。也可以将“数据记录单”添加到“快速访问工具栏”。这可以通过以下步骤完成：


    单击“快速访问工具栏”（位于屏幕左上角）最右侧的向下箭头，然后单击“其他命令”，如图 2-21 所示。


    ![A978-1-4842-0529-7_2_Fig21_HTML.jpg](img/A978-1-4842-0529-7_2_Fig21_HTML.jpg)


    图 2-21.


    自定义“快速访问工具栏”菜单


    点击“其他命令”后，在屏幕顶部选择“不在功能区中的命令”。将出现如图 2-22 所示的屏幕。找到并选择表单图标，然后按中间的“添加”按钮，将其放到“快速访问工具栏”上。


    ![A978-1-4842-0529-7_2_Fig22_HTML.jpg](img/A978-1-4842-0529-7_2_Fig22_HTML.jpg)


    图 2-22.


    自定义“快速访问工具栏”菜单


    要使用数据记录单，请单击包含要查看数据的行。然后，单击“快速访问工具栏”中的“记录单”图标，即可看到如图 2-23 所示的显示。可以在数据记录单中编辑字段。单击“下一条”和“上一条”按钮可以浏览记录。


    ![A978-1-4842-0529-7_2_Fig23_HTML.jpg](img/A978-1-4842-0529-7_2_Fig23_HTML.jpg)


    图 2-23.


    使用数据记录单


    ## 选择记录


    数据记录单可用于根据条件有选择地查看某些记录，步骤如下：


    1.  单击表格中的某个单元格。

    2.  单击“快速访问工具栏”中的“记录单”图标，或依次按 `Alt`+`D` 和 `O` 键。

    3.  在记录单中，单击“条件”并输入要使用的条件，例如 `城市=奥克兰`，如图 2-24 所示。


    ![A978-1-4842-0529-7_2_Fig24_HTML.jpg](img/A978-1-4842-0529-7_2_Fig24_HTML.jpg)


    图 2-24.


    使用数据记录单根据条件选择记录


    然后，单击“下一条”和“上一条”将仅显示符合指定条件的行。

