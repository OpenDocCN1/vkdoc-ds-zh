    \ such as category and year, by clicking the plus sign in the `Group By...` dialog\
    \ box to select a second field, as shown in Figure [8-34](#A978-1-4842-0529-7_8_Chapter.html#Fig34).\
    \ The `Group By...` dialog box can be accessed again by clicking the gear icon\
    \ after `Group Rows` at the bottom of the `Applied Steps` list in the `Query Setting`\
    \ pane on the right side of the screen.\n\n![A978-1-4842-0529-7_8_Fig34_HTML.jpg](A978-1-4842-0529-7_8_Fig34_HTML.jpg)\n\
    \n**Figure 8-34.** `Group By` dialog with two fields\n\nThe results are shown\
    \ in Figure [8-35](#A978-1-4842-0529-7_8_Chapter.html#Fig35).\n\n![A978-1-4842-0529-7_8_Fig35_HTML.jpg](A978-1-4842-0529-7_8_Fig35_HTML.jpg)\n\
    \n**Figure 8-35.** Count of Nobel Prizes by category and year\n\nTo add a third\
    \ field to show the name of the prize winner, select `+` again in the `Group By...`\
    \ dialog and add the surname of the winner, as shown in Figure [8-36](#A978-1-4842-0529-7_8_Chapter.html#Fig36).\n\
    \n![A978-1-4842-0529-7_8_Fig36_HTML.jpg](A978-1-4842-0529-7_8_Fig36_HTML.jpg)\n\
    \n**Figure 8-36.** `Group By...` dialog with three fields\n\nThe results are shown\
    \ in Figure [8-37](#A978-1-4842-0529-7_8_Chapter.html#Fig37).\n\n![A978-1-4842-0529-7_8_Fig37_HTML.jpg](A978-1-4842-0529-7_8_Fig37_HTML.jpg)\n\
    \n**Figure 8-37.** Display of Nobel Prizes by category and year, with surname\
    \ of recipient\n\n## Summary\n\nThis chapter has demonstrated how to use Power\
    \ Query to import tables from web sites, multiple CSV files from a folder, and\
    \ JSON data. The examples have shown how to use Power Query to extract, transform,\
    \ and load data. More examples of using Power Query will be provided in later\
    \ chapters.\n\n# 9. Power Map\n\nPower Map is a powerful visualization tool that\
    \ allows the creation of 2D and 3D visualizations by plotting Excel-based geospatial\
    \ data on a map, using Bing Map technology. This chapter demonstrates how to import\
    \ data using Power Query and then how to plot it using Power Map.\n\n## Installing\
    \ Power Map\n\nPower Map is accessed through an icon on the Excel `Insert` tab.\
    \ If that icon is not displayed, it may mean that you do not have the current\
    \ version of Power Map installed. If that is the case, do a search on \"download\
    \ Power Map\" and download the latest version from Microsoft. Then, to enable\
    \ Power Map, follow these steps:\n\n1. Click the `File` tab to see the Backstage\
    \ View.\n2. Click `Options` at the bottom of the left pane.\n3. Select `Add-Ins`\
    \ on the left pane.\n4. At the bottom of the window, pull down the arrow after\
    \ `Manage`, select `Com Add-Ins`, and click `Go`.\n5. Check `Microsoft Office\
    \ PowerPivot for Excel 2013`, `Microsoft Power Map for Excel` and `Power View`,\
    \ and click `OK`.\n\n## Plotting a Map\n\nThe steps to plotting a map include\
    \ the following:\n\n1. Open a data source, which may be a spreadsheet or a data\
    \ model that includes geographic descriptors, such as city and state or geographic\
    \ coordinates.\n2. Select the `Insert` tab and click `Map` and `Load Power Map`.\n\
    3. In the `Fields` list pane on the right side of the screen, select geographic\
    \ fields to map to, such as city and state or geographic coordinates, and then\
    \ select a data metric, such as population. Power Map calls Bing Map services\
    \ to locate the geographic locations on a map, and then the metric value is plotted.\n\
    4. By default, a column chart is displayed. This can be changed to a bubble chart\
    \ or heat map by clicking the appropriate icon.\n\nA Power Map video tour is an\
    \ animation that tells a story about data by linking individual maps. A video\
    \ can be created to tell a story based on the data. A video is a collection of\
    \ tours, and a tour is a collection of scenes.\n\n## Key Power Map Ribbon Options\n\
    \nThis section highlights some of the key options on the Power Map ribbon, which\
    \ is shown in Figure [9-1](#A978-1-4842-0529-7_9_Chapter.html#Fig1).\n\n- **Tour\
    \ Section**\n  - `Play Tour`. Plays a tour already created.\n  - `Add Scene`.\
    \ Adds a scene to a tour.\n  - `Create Video`. Creates a video from tours.\n-\
    \ **Map Section**\n  - `Themes`. Changes the map style.\n  - `Map Labels`. Adds\
    \ country or city names.\n  - `Flat Map`. Switches between 2D and 3D views.\n\
    - **Layer Section**\n  - `Add Layer`. Adds a new layer.\n  - `Refresh Data`. Refreshes\
    \ data from the source.\n  - `Shapes`. Selects the shape of the bar chart.\n-\
    \ **Insert Section**\n  - `2D Chart`. Adds a 2D chart.\n  - `Text Box`. Adds a\
    \ text box on the map.\n  - `Legend`. Adds a legend to the map.\n- **Time Section**\n\
    \  - `Time Line`. Shows or hides the time line in a time animation.\n  - `Date\
    \ & Time`. Shows or adds the date and time in a time animation.\n- **View Section**\n\
    \  - `Tour Editor`. Displays or hides the `Tour Editor` pane (left side of screen).\n\
    \  - `Layer Pane`. Displays or hides the `Layer Pane` (right side of screen).\n\
    \n![A978-1-4842-0529-7_9_Fig1_HTML.jpg](A978-1-4842-0529-7_9_Fig1_HTML.jpg)\n\n\
    **Figure 9-1.** Power Map ribbon"
