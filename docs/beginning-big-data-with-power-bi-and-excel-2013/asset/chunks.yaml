- fmt: '# 4. Building a Data Model


    This chapter will cover the Excel Data Model also known as the PowerPivot Data
    Model. `PowerPivot` for Excel 2013 is based on the tabular engine of SQL Server
    Analysis Services 2012 running inside Excel. The Data Model allows relating of
    multiple tables. It runs completely in memory and compresses data so that it can
    process millions of rows.


    The Excel Data Model is a collection of tables, including the relationships between
    them. The Data Model provides the structure for Power BI. This chapter will demonstrate
    how to use Pivot Tables to extract summary information from multiple tables in
    a Data Model. The examples used will progress from the simple to the more complex.


    ## Enabling PowerPivot


    `PowerPivot` is included with Excel 2013, but it is not enabled by default. To
    enable `PowerPivot`, follow these steps:


    Click the `File` tab to see the Backstage view. Click `Options` at the bottom
    of the left pane. Select `Add-Ins` on the left pane. At the bottom of the window,
    pull down the arrow after `Manage`, select `COM Add-ins`, and click `Go`, as shown
    in Figure [4-1](#A978-1-4842-0529-7_4_Chapter.html#Fig1).


    ![A978-1-4842-0529-7_4_Fig1_HTML.jpg](A978-1-4842-0529-7_4_Fig1_HTML.jpg)


    Figure 4-1.


    Excel Options screen Check `Microsoft Office PowerPivot for Excel 2013`, `Microsoft
    Power Map for Excel`, and `Power View`, as shown in Figure [4-2](#A978-1-4842-0529-7_4_Chapter.html#Fig2),
    and click `OK`.


    ![A978-1-4842-0529-7_4_Fig2_HTML.jpg](A978-1-4842-0529-7_4_Fig2_HTML.jpg)


    Figure 4-2.


    COM Add-Ins dialog


    ## Relational Databases


    Until a few years ago, relational databases were the most widely used type of
    database. In the last few years, `NoSQL` (or nonrelational) databases have become
    popular for log data and other types of big data. `NoSQL` databases will be covered
    more extensively in future chapters. Still, today, the majority of transactional
    business data is stored in relational databases.


    One of the principles of relational database design is avoiding repeating fields.
    If repeating fields are encountered, the data is normalized by creating other
    tables, as described in [Chapter 1](#A978-1-4842-0529-7_1_Chapter.html). For instance,
    in a personnel example, the primary key of the employee table would be the employee
    Social Security number, because it is unique, and it is required for financial
    reporting. The employee would be assigned to a department, but only a department
    code would be stored in the employee table. The department code would be a foreign
    key that would point to the appropriate record in the department table, which
    would have other information, such as the department office, department manager,
    and phone number. Thus, the department information would not have to be repeated
    for each employee record.


    ## Database Terminology


    The following terms are commonly used to describe relational databases and the
    relationships between tables within a database.


    - A field is the smallest unit of data in a table. Fields are stored in columns
    in Excel tables.

    - A record is all of the data or information about one person or one thing. In
    Excel, a record is a row in a table.

    - A table is a collection of related data stored in a structured format within
    a database. It consists of fields (columns) and records (rows).

    - A database is a collection of tables.

    - The primary key of a relational table is a field (or fields) that uniquely identifies
    each record in the table. For data involving people, especially data that requires
    tax reporting, the most common primary key is a Social Security number. It is,
    of course, important to have proper security when dealing with personal data such
    as Social Security numbers.

    - A foreign key is a field or fields in one table that uniquely identifies a row
    of another table.

    - A candidate key is a field or fields in a table that can uniquely identify any
    record without referring to any other data. Each table may have one or more candidate
    keys, but one candidate key is selected as the primary key. This is usually the
    best among the candidate keys.

    - When a key is composed of more than one column, it is known as a composite key.

    - A relationship allows accessing data from multiple tables, based on a key field.

    - Normalization is the process of organizing the tables in a relational database
    to minimize redundancy. Normalization often involves dividing large tables into
    smaller tables and defining relationships between them.

    - Third Normal Form (3NF), defined by relational database model inventor E. F.
    Codd, eliminates fields not dependent on the primary key. To be in Third Normal
    Form, each field in a table must depend on the primary key, and only the primary
    key, of that table. This is called eliminating transitive tendencies, where one
    field depends on another field that is not the primary key.

    - A source table is the table wherein the relationship starts. In the example
    in the following section, the employee table is the source table.

    - The related table is the table that contains the values to look up. In the following
    example, the department table is the related table.'
  raw: '# 4. Building a Data Model


    This chapter will cover the Excel Data Model also known as the PowerPivot Data
    Model. PowerPivot for Excel 2013 is based on the tabular engine of SQL Server
    Analysis Services 2012 running inside Excel. The Data Model allows relating of
    multiple tables. It runs completely in memory and compresses data so that it can
    process millions of rows.


    The Excel Data Model is a collection of tables, including the relationships between
    them. The Data Model provides the structure for Power BI. This chapter will demonstrate
    how to use Pivot Tables to extract summary information from multiple tables in
    a Data Model. The examples used will progress from the simple to the more complex.


    ## Enabling PowerPivot


    PowerPivot is included with Excel 2013, but it is not enabled by default. To enable
    PowerPivot, follow these steps:


    Click the File tab to see the Backstage view.   Click Options at the bottom of
    the left pane.   Select Add-Ins on the left pane.   At the bottom of the window,
    pull down the arrow after Manage, select COM Add-ins, and click Go, as shown in
    Figure [4-1](#A978-1-4842-0529-7_4_Chapter.html#Fig1).


    ![A978-1-4842-0529-7_4_Fig1_HTML.jpg](A978-1-4842-0529-7_4_Fig1_HTML.jpg)


    Figure 4-1.


    Excel Options screen   Check Microsoft Office PowerPivot for Excel 2013, Microsoft
    Power Map for Excel, and Power View, as shown in Figure [4-2](#A978-1-4842-0529-7_4_Chapter.html#Fig2),
    and click OK.


    ![A978-1-4842-0529-7_4_Fig2_HTML.jpg](A978-1-4842-0529-7_4_Fig2_HTML.jpg)


    Figure 4-2.


    COM Add-Ins dialog


    ## Relational Databases


    Until a few years ago, relational databases were the most widely used type of
    database. In the last few years, NoSQL (or nonrelational) databases have become
    popular for log data and other types of big data. NoSQL databases will be covered
    more extensively in future chapters. Still, today, the majority of transactional
    business data is stored in relational databases.


    One of the principles of relational database design is avoiding repeating fields.
    If repeating fields are encountered, the data is normalized by creating other
    tables, as described in [Chapter 1](#A978-1-4842-0529-7_1_Chapter.html). For instance,
    in a personnel example, the primary key of the employee table would be the employee
    Social Security number, because it is unique, and it is required for financial
    reporting. The employee would be assigned to a department, but only a department
    code would be stored in the employee table. The department code would be a foreign
    key that would point to the appropriate record in the department table, which
    would have other information, such as the department office, department manager,
    and phone number. Thus, the department information would not have to be repeated
    for each employee record.


    ## Database Terminology


    The following terms are commonly used to describe relational databases and the
    relationships between tables within a database.


    *   A field is the smallest unit of data in a table. Fields are stored in columns
    in Excel tables.

    *   A record is all of the data or information about one person or one thing.
    In Excel, a record is a row in a table.

    *   A table is a collection of related data stored in a structured format within
    a database. It consists of fields (columns) and records (rows).

    *   A database is a collection of tables.

    *   The primary key of a relational table is a field (or fields) that uniquely
    identifies each record in the table. For data involving people, especially data
    that requires tax reporting, the most common primary key is a Social Security
    number. It is, of course, important to have proper security when dealing with
    personal data such as Social Security numbers.

    *   A foreign key is a field or fields in one table that uniquely identifies a
    row of another table.

    *   A candidate key is a field or fields in a table that can uniquely identify
    any record without referring to any other data. Each table may have one or more
    candidate keys, but one candidate key is selected as the primary key. This is
    usually the best among the candidate keys.

    *   When a key is composed of more than one column, it is known as a composite
    key.

    *   A relationship allows accessing data from multiple tables, based on a key
    field.

    *   Normalization is the process of organizing the tables in a relational database
    to minimize redundancy. Normalization often involves dividing large tables into
    smaller tables and defining relationships between them.

    *   Third Normal Form (3NF), defined by relational database model inventor E.
    F. Codd, eliminates fields not dependent on the primary key. To be in Third Normal
    Form, each field in a table must depend on the primary key, and only the primary
    key, of that table. This is called eliminating transitive tendencies, where one
    field depends on another field that is not the primary key.

    *   A source table is the table wherein the relationship starts. In the example
    in the following section, the employee table is the source table.

    *   The related table is the table that contains the values to look up. In the
    following example, the department table is the related table.'
  trans: '

    # 4. 构建数据模型


    本章将介绍 Excel 数据模型，也称为 PowerPivot 数据模型。Excel 2013 的 `PowerPivot` 基于在 Excel 内部运行的
    SQL Server Analysis Services 2012 表格引擎。数据模型允许关联多个表格。它完全在内存中运行并压缩数据，从而能够处理数百万行数据。


    Excel 数据模型是表格的集合，包括它们之间的关系。该数据模型为 Power BI 提供了结构基础。本章将演示如何使用数据透视表从数据模型中的多个表格中提取汇总信息。所使用的示例将从简单逐步过渡到复杂。


    ## 启用 PowerPivot


    `PowerPivot` 包含在 Excel 2013 中，但默认情况下未启用。要启用 `PowerPivot`，请按照以下步骤操作：


    单击 `文件` 选项卡以查看 Backstage 视图。单击左窗格底部的 `选项`。在左窗格中选择 `加载项`。在窗口底部，下拉 `管理` 后的箭头，选择
    `COM 加载项`，然后单击 `转到`，如图 4-1 所示。


    ![A978-1-4842-0529-7_4_Fig1_HTML.jpg](img/A978-1-4842-0529-7_4_Fig1_HTML.jpg)


    图 4-1.


    Excel 选项屏幕 勾选 `Microsoft Office PowerPivot for Excel 2013`、`Microsoft Power Map
    for Excel` 和 `Power View`，如图 4-2 所示，然后单击 `确定`。


    ![A978-1-4842-0529-7_4_Fig2_HTML.jpg](img/A978-1-4842-0529-7_4_Fig2_HTML.jpg)


    图 4-2.


    COM 加载项对话框


    ## 关系数据库


    直到几年前，关系数据库还是使用最广泛的数据库类型。在过去几年中，`NoSQL`（或非关系型）数据库已变得流行，用于处理日志数据和其他类型的大数据。`NoSQL`
    数据库将在后续章节中进行更详细的介绍。尽管如此，今天大多数事务性业务数据仍然存储在关系数据库中。


    关系数据库设计的原则之一是避免重复字段。如果遇到重复字段，则通过创建其他表来对数据进行规范化，如第 1 章所述。例如，在一个人事示例中，员工表的主键是员工的社会保险号，因为它是唯一的，并且在财务报告中是必需的。员工会被分配到一个部门，但员工表中只存储部门代码。部门代码是一个外键，指向部门表中的相应记录，部门表包含其他信息，例如部门办公室、部门经理和电话号码。这样，部门信息就不必为每个员工记录重复存储。


    ## 数据库术语


    以下术语常用于描述关系数据库以及数据库中表之间的关系。


    - **字段**是表中最小的数据单元。字段存储在 Excel 表的列中。

    - **记录**是关于一个人或一件事的全部数据或信息。在 Excel 中，记录是表中的一行。

    - **表**是在数据库中以结构化格式存储的相关数据的集合。它由字段（列）和记录（行）组成。

    - **数据库**是表的集合。

    - **关系表的主键**是一个字段（或多个字段），用于唯一标识表中的每条记录。对于涉及人员的数据，尤其是需要税务报告的数据，最常见的主键是社会保险号。当然，在处理社会保险号等个人数据时，确保适当的安全性非常重要。

    - **外键**是一个表中的一个字段或多个字段，用于唯一标识另一表中的一行。

    - **候选键**是表中的一个字段或多个字段，可以在不引用任何其他数据的情况下唯一标识任何记录。每个表可能有一个或多个候选键，但其中一个候选键被选为主键。这通常是候选键中最好的一个。

    - 当键由多个列组成时，称为**复合键**。

    - **关系**允许基于关键字段从多个表中访问数据。

    - **规范化**是组织关系数据库中的表以最小化冗余的过程。规范化通常涉及将大表划分为小表，并定义它们之间的关系。

    - **第三范式 (3NF)**，由关系数据库模型发明者 E. F. Codd 定义，消除了不依赖于主键的字段。要符合第三范式，表中的每个字段必须依赖于该表的主键，并且仅依赖于主键。这被称为消除传递依赖，即一个字段依赖于另一个非主键字段的情况。

    - **源表**是关系起始的表。在下一节的示例中，员工表是源表。

    - **相关表**是包含要查找的值的表。在下面的示例中，部门表是相关表。

    '
- fmt: '# Creating a Data Model from Excel Tables


    This section will start with a simple example, to illustrate the principles of
    relating tables. In this example, a Data Model will be created from two small
    tables: `employee` and `department`. The tables are normalized, meaning that repeating
    fields have been eliminated. Instead of recording all the information about a
    single department in the employee record, only a department code is used. Then
    a relationship is defined between the `employee` and `department` table, so that
    the department information can be extracted from the `department` table.


    A Pivot Table can be used to extract meaningful information from a Data Model.
    To create a Pivot Table that draws on data from both tables to show average salary
    by department, do the following:


    Define each group of data as a table by clicking inside the table and pressing
    `Ctrl+T`. Click anywhere in the table and click the `Table Tools` `Design` tab.
    On the left side of the ribbon, type in a table name, in this case, `employees`,
    as shown in Figure[4-3](#A978-1-4842-0529-7_4_Chapter.html#Fig3). Also, rename
    the `departments`.


    ![A978-1-4842-0529-7_4_Fig3_HTML.jpg](A978-1-4842-0529-7_4_Fig3_HTML.jpg)


    Figure 4-3. Employee and department tables


    Highlight the `employee` table. Go to the `Insert` tab and select `PivotTable`.
    In the `Create PivotTable` dialog, select `Add this data to the Data Model` and
    click `OK`, as shown in Figure[4-4](#A978-1-4842-0529-7_4_Chapter.html#Fig4).


    ![A978-1-4842-0529-7_4_Fig4_HTML.jpg](A978-1-4842-0529-7_4_Fig4_HTML.jpg)


    Figure 4-4. Create PivotTable dialog


    In the `PivotTable Fields` pane, click `All` (at the upper right), to see both
    tables, as shown in Figure[4-5](#A978-1-4842-0529-7_4_Chapter.html#Fig5). Drag
    the `deptname` field from the `department` table to the `Columns` box. Drag `Sum
    of salary` from the `employees` table to `Values`. Note the prompt "Relationships
    between tables may be needed." Click `Create`.


    ![A978-1-4842-0529-7_4_Fig5_HTML.jpg](A978-1-4842-0529-7_4_Fig5_HTML.jpg)


    Figure 4-5. PivotTable showing total salaries by department


    As shown in Figure[4-6](#A978-1-4842-0529-7_4_Chapter.html#Fig6), select `employees`
    as the first table and `dept` as the foreign key. Select `departments` as the
    second table and `deptcode` as the primary key. Click `OK`. Note that the field
    names, as defined by the column headings, do not have to be the same.


    ![A978-1-4842-0529-7_4_Fig6_HTML.jpg](A978-1-4842-0529-7_4_Fig6_HTML.jpg)


    Figure 4-6. Create Relationship dialog


    Drag `lname` to the `Rows` box. The resulting Pivot Table, as shown in Figure[4-7](#A978-1-4842-0529-7_4_Chapter.html#Fig7),
    will display the sum of salaries by department.


    ![A978-1-4842-0529-7_4_Fig7_HTML.jpg](A978-1-4842-0529-7_4_Fig7_HTML.jpg)


    Figure 4-7. PivotTable showing employee salary by department


    To see instead the average salary by department, first remove the `lname` field
    from the `Rows` box and then in the `PivotTable Fields` pane, click the drop-down
    arrow next to `Sum of salary` in the `Values` box. Select `Value Field Setting`
    and then `Average` to see the average salary by department, as shown in Figure[4-8](#A978-1-4842-0529-7_4_Chapter.html#Fig8).


    ![A978-1-4842-0529-7_4_Fig8_HTML.jpg](A978-1-4842-0529-7_4_Fig8_HTML.jpg)


    Figure 4-8. PivotTable showing average salary by department


    This example showed how to relate two tables, `employees` and `departments`, using
    department code. `dept` is a foreign key in the `employees` table, and `deptcode`
    is the primary key for the `departments` table. The Pivot Table relates the two
    tables.


    # Loading Data Directly into the Data Model


    In this example, data will be loaded directly into the Data Model using an example
    from Microsoft''s Northwind Access Database. This example demonstrates running
    PowerPivot on top of Excel.


    To load data directly into the Data Model, do the following:


    Click the `PowerPivot` tab to open the ribbon. Click the `Manage` button at the
    top-left end of the ribbon. Once the PowerPivot window is open, you can load data
    by clicking `From Database` in the `Get External Data` group. This provides a
    choice of database sources, as shown in Figure[4-9](#A978-1-4842-0529-7_4_Chapter.html#Fig9).
    For this example, `From Access` will be selected.


    ![A978-1-4842-0529-7_4_Fig9_HTML.jpg](A978-1-4842-0529-7_4_Fig9_HTML.jpg)


    Figure 4-9. PowerPivot Get External Data group


    In the `Table Import Wizard` dialog, click the `Browse` button to find the Access
    file you want to import. For this example, `Database1` in the documents folder
    will be selected. This file is available from the Apress web site. Click `Test
    Connection`. If the test is successful, click `Next`.


    PowerPivot opens the `Table Import Wizard`, as shown in Figure[4-10](#A978-1-4842-0529-7_4_Chapter.html#Fig10),
    to step you through the process of loading data. Choose `Select from a list of
    tables and views` to choose the data to import. Click `Next`.


    ![A978-1-4842-0529-7_4_Fig10_HTML.jpg](A978-1-4842-0529-7_4_Fig10_HTML.jpg)


    Figure 4-10. Table Import Wizard


    Click the top-left box to select all tables, as shown in Figure[4-11](#A978-1-4842-0529-7_4_Chapter.html#Fig11).
    Note that in the lower right corner of the dialog, there is an option to `Preview
    & Filter`. This option can be used to select a subset of data from very large
    datasets. In this example, all rows in all tables will be imported. Click `Finish`
    to complete the import.


    ![A978-1-4842-0529-7_4_Fig11_HTML.jpg](A978-1-4842-0529-7_4_Fig11_HTML.jpg)


    Figure 4-11. Table Import Wizard—Select Tables and Views


    Relationships are automatically loaded into the data model, if they are present
    in the imported data. Note that PowerPivot tables are read-only, so that the data
    cannot be changed.


    To view relationships, go to the `PowerPivot` tab and select `Manage` to open
    the PowerPivot window. Then click the `PowerPivot Diagram View` at the right end
    of the ribbon to see the relationships between tables, and click `Finish` to complete
    the import, as shown in Figure[4-12](#A978-1-4842-0529-7_4_Chapter.html#Fig12).


    ![A978-1-4842-0529-7_4_Fig12_HTML.jpg](A978-1-4842-0529-7_4_Fig12_HTML.jpg)


    Figure 4-12. Diagram View


    # Creating a Pivot Table from Two Tables


    In this example, a Pivot Table will be created, based on the `inventory` and `products`
    tables. Notice in Figure[4-12](#A978-1-4842-0529-7_4_Chapter.html#Fig12) that
    the two tables are linked, based on product code. The `Inventory` table includes
    the on-hand data for each item in inventory, with a primary key of `ProductCode`.
    To find the full product name, a lookup has to be performed in the `product` table,
    based on product ID. To create a Pivot Table based on these two tables, do the
    following:


    Click `PivotTable` on the `File` tab in the PowerPivot window and select `PivotTable`
    from the menu. Click `OK` to put the Pivot Table in a new worksheet. Click the
    arrow next to the `products` table in the `PivotTable Fields` pane and drag the
    `ProductName` field to the `Rows` box. Then scroll up to go to the `inventory`
    table, click the left arrow to show the fields, and drag `OnHand` to the `Values`
    box. The results are shown in Figure[4-13](#A978-1-4842-0529-7_4_Chapter.html#Fig13),
    which indicates the sum of the on-hand values for each product.


    ![A978-1-4842-0529-7_4_Fig13_HTML.jpg](A978-1-4842-0529-7_4_Fig13_HTML.jpg)


    Figure 4-13. PivotTable showing product name and on-hand quantity'
