    spreadsheet.


    One way of thinking about this example is to use a star model architecture that
    includes a fact table containing the numbers that have to be aggregated, surrounded
    by dimension tables, such as products and stores. In this example, the `dboFactSales`
    table is the fact table, as shown in Figure [7-1](#A978-1-4842-0529-7_7_Chapter.html#Fig1).
    To create this example, follow these steps:


