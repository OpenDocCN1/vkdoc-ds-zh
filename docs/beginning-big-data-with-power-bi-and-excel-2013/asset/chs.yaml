  ## 总结


  本章演示了如何使用 Power Query 从网站导入表格、从文件夹导入多个 CSV 文件以及导入 JSON 数据。示例展示了如何使用 Power Query
  进行数据的提取、转换和加载。后续章节将提供更多使用 Power Query 的示例。


