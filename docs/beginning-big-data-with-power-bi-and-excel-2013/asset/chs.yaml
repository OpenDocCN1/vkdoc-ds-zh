- "# 9. Power Map\n\nPower Map 是一个强大的可视化工具，它利用必应地图技术，通过在三维地球仪上绘制基于 Excel 的地理空间数据，创建二维和三维可视化效果。本章将演示如何使用\
  \ Power Query 导入数据，然后使用 Power Map 进行绘制。\n\n## 安装 Power Map\n\n可以通过 Excel `插入`选项卡上的图标访问\
  \ Power Map。如果该图标未显示，则可能意味着您未安装当前版本的 Power Map。如果是这种情况，请搜索“下载 Power Map”，并从 Microsoft\
  \ 下载最新版本。然后，按照以下步骤启用 Power Map：\n\n1.  单击`文件`选项卡以进入 Backstage 视图。\n2.  单击左侧窗格底部的`选项`。\n\
  3.  在左侧窗格中选择`加载项`。\n4.  在窗口底部，下拉`管理`后的箭头，选择`COM 加载项`，然后单击`转到`。\n5.  勾选`Microsoft\
