- '# 7. 使用数据分析表达式 (DAX) 进行计算


  本章介绍如何使用数据分析表达式 (DAX) 进行计算，以及如何使用关键绩效指标 (KPI) 衡量绩效。本章将重点介绍一些使用 DAX 和 KPI 的实际示例。


  ## 理解数据分析表达式


  如第 4 章所述，数据分析表达式 (DAX) 是一种公式语言，用于基于 PowerPivot 的表格数据模型创建计算列和计算字段。DAX 公式与常规的、基于单元格的
  Excel 公式不同，因为 DAX 公式适用于指定列中的所有行。DAX 公式用于以下两种场景：


  **计算列。** 可以向现有的 PowerPivot 表添加计算列。当列包含公式时，将为每一行计算该值。要创建公式，请单击新列中的任意单元格，然后按 Enter
  键开始输入基于列引用的公式。可以通过鼠标指向列名或在方括号内输入名称来引用列名。可以通过在列名前输入工作表名称来引用其他工作表中的列。如果工作表名称包含空格，则可以将其括在单引号中。DAX
  表达式中最多可以嵌套 64 层函数。


  **计算字段（或度量值）。** 它们位于 PowerPivot 窗口底部的计算区域。计算字段通常包含聚合函数，例如 `sum` 或 `average`，这些函数默认引用整个列。DAX
  函数与 Excel 函数非常相似，但 DAX 函数是面向列的。可以通过点击 PowerPivot 窗口“`设计`”选项卡上的 `fx` 图标来查看所有可用的 DAX
  函数。创建计算字段时，公式前面会带有一个标识符，它类似于变量名，可用于引用该计算字段。


  > **警告：** 使用 DAX 时，最好避免为计算字段和计算列使用相同的名称。为了进一步避免歧义，最好在引用列时使用完全限定的列名，其中包含工作表的名称。


  ### DAX 运算符


  DAX 使用以下运算符：


  标准算术运算符：


  - `+` 加法

  - `-` 减法

  - `*` 乘法

  - `/` 除法

  - `^` 乘幂


  比较运算符：


  - `=` 等于

  - `>` 大于

  - `<` 小于

  - `>=` 大于或等于

  - `<=` 小于或等于

  - `<>` 不等于


  文本连接运算符：


  - `&` 连接


  以及逻辑运算符：


  - `&&` 与

  - `||` 或


  ### 本章使用的关键 DAX 函数摘要


  - `SUM`：简单求和，类似于 Excel 中的 SUM

  - `SUMX`：逐行迭代以进行计算

  - `CALCULATE`：允许基于筛选条件进行计算

  - `LEFT`：返回指定文本字符串开头指定数量的字符



  ## 更新公式结果


  有两种方法可以更新公式的结果。


  刷新数据涉及更新底层数据源中的数据，例如 SQL Server、MySQL 或 Access。重新计算则是根据公式的变更来更新公式结果。


