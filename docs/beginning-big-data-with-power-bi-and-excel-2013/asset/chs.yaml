- '# 大数据与 NoSQL 的诞生


  因特网在 20 世纪 90 年代开始普及，这部分归功于万维网，它使网络更容易使用。相互竞争的搜索引擎使用户能够轻松找到数据。Google 成立于 1996 年，它彻底改变了搜索方式。随着可用数据越来越多，试图将所有数据都塞进矩形表格的关系型数据库的局限性变得显而易见。


  1998 年，Carlo Strozzi 使用了 `NoSQL` 这个术语。据报道，他后来对使用这个术语感到后悔，认为 `NoRel`（非关系型）会是一个更好的术语。


  #### Hadoop 分布式文件系统 (HDFS)


  大数据技术的很大一部分来自搜索引擎公司。Hadoop 源于 Apple Nutch，这是一个于 2002 年启动的开源网络搜索引擎。它包含一个网络爬虫和搜索引擎，但无法扩展到处理数十亿个网页。


  2003 年，一篇描述 Google 分布式文件系统（`GFS`）架构的论文发表，Google 使用该系统来存储网页爬取和索引生成的大型文件。2004 年，一个开源版本作为
  Nutch 分布式文件系统（`NDFS`）发布。


  2004 年，Google 发表了一篇关于 `MapReduce` 的论文。到 2005 年，`MapReduce` 已被整合到 Nutch 中。`MapReduce`
  是一种批量查询过程，能够针对大型数据集运行临时查询。它解锁了以前被归档的数据。运行查询可能需要几分钟或更长时间。


  2006 年 2 月，Hadoop 被设立为一个独立的子项目。基于他与 Mike Cafarella 之前的工作，Doug Cutting 去 Yahoo! 工作，Yahoo!
  提供了资源，将 Hadoop 转变为对网络有用的工具。到 2008 年，Yahoo! 将其搜索索引建立在一个 Hadoop 集群之上。Hadoop 这个名字来源于
  Doug Cutting 的孩子给一个黄色填充大象玩偶起的名字。Hadoop 提供了一个可靠、可扩展的平台，用于在廉价的通用硬件上运行存储和分析。Hadoop
  是开源的。


  ## 大数据


  大数据没有单一的定义，但目前围绕它有很多炒作，所以其含义可能被稀释。普遍认为它是指结构不规则、涉及数百 TB 到 PB 及更高级别数据量的大规模数据。它可以包括来自金融交易、传感器、网络日志和社交媒体的数据。一个更具操作性的定义是，当组织的数据处理需求对于传统关系型数据库来说过大时，他们就必须使用大数据。


  大数据基于反馈经济，其中物联网将传感器放置在越来越多的设备上。随着医疗记录数字化、更多商店通过会员卡追踪消费者购买行为、以及人们佩戴健康追踪设备，产生的数据越来越多。通常，大数据更关注行为分析，而非传统关系型数据库擅长的交易监控。随着存储成本的下降，公司会追踪越来越多的数据，以寻找模式并构建预测模型。


  ## 三个 V


  表征大数据的一种方式是通过三个 V：


  -   **Volume（数据量）**：涉及多少数据？

  -   **Velocity（数据速度）**：数据产生有多快？

  -   **Variety（数据多样性）**：数据是否具有不规则的结构和格式？


  有时还会用到另外两个 V：


  -   **Variability（数据可变性）**：是否涉及多种具有不同解释的格式？

  -   **Veracity（数据真实性）**：数据有多准确？




  ### 数据生命周期


  数据生命周期涉及收集和分析数据以构建预测模型，遵循以下步骤：

  收集数据。存储数据。查询数据以识别模式并理解其含义。使用可视化工具发现商业价值。基于数据预测未来的消费者行为。


  ### Apache Hadoop


  `Hadoop` 是一个用 `Java` 编写的开源软件框架，用于对存储在商用服务器上的超大数据集进行分布式存储和处理。它具有内置的冗余机制来应对硬件故障。`Hadoop`
  基于两项主要技术：`MapReduce` 和 `Hadoop 分布式文件系统` (`HDFS`)。`Hadoop` 由 Doug Cutting 和 Mike
  Cafarella 于 2005 年创建。


  #### MapReduce 算法


  `MapReduce` 由谷歌开发，并通过一篇 2004 年的论文发布，该论文描述了如何使用并行处理来处理大量数据。之后它被发布到公共领域。它涉及一个两步批处理过程。


  首先，数据被分区并发送给映射器，映射器生成键值对。然后对这些键值对进行整理，使得每个键对应的值都在一起，接着归约器处理这些键值对，为每个键计算出一个值。


  一个常被引用的例子是单词计数。它涉及扫描一份手稿并统计每个单词出现的次数。在这个例子中，每个单词是一个键，每个单词被使用的次数是值。


  #### Hadoop 分布式文件系统 (HDFS)


  `HDFS` 是一个运行在商用服务器上的分布式文件系统。它基于 `Google 文件系统` (`GFS`)。它将文件分割成块并分布在集群的各个节点中。数据被复制，这样即使一台服务器宕机，也不会丢失数据。数据是不可变的，这意味着表无法被编辑；它只能被写入一次，类似于
  `CD-R`，即一次写入多次读取。新数据可以追加到现有文件中，或者可以删除旧文件并将新数据写入新文件。通过添加更多服务器来处理更多数据，`HDFS` 具有很强的可扩展性。


  `HDFS` 的某些实现是仅追加的，这意味着底层的表无法被编辑。相反，写入操作被记录下来，然后文件会被重新创建。


  #### Hadoop 的商业实现


  `Hadoop` 是一个 Apache 开源项目，但有几家公司已经开发了自己的商业实现。Hortonworks 由 Doug Cutting 和其他前雅虎员工创立，是提供商业实现的公司之一。其他此类公司包括
  Cloudera 和 MapR。另一个 Hadoop 实现是微软的 `HD Insight`，它运行在 `Azure` 云平台上。第 11 章 中的一个示例展示了如何将
  `HD Insight` 数据库导入到 `Power Query`。


  ### CAP 定理


  从学术角度看 NoSQL 数据库，绕不开 `CAP 定理`。`CAP` 是一致性（Consistency）、可用性（Availability）和分区容错性（Partition
  Tolerance）的缩写。根据该定理，任何数据库只能拥有其中两个属性。关系型数据库拥有一致性和分区容错性。大型关系型数据库在可用性方面较弱，因为当它们数据量很大时延迟会很高。NoSQL
  数据库提供可用性和分区容错性，但由于缺乏固定结构，在一致性方面较弱。


  ### NoSQL


  正如本书其他地方所讨论的，`NoSQL` 这个说法是用词不当的。它并不意味着“无 SQL”。对这种类型的数据库，更好的术语可能是非关系型。`NoSQL` 旨在访问没有关系结构、模式很少或没有模式的数据。早期版本的
  `NoSQL` 需要程序员编写自定义程序来检索数据。如今，越来越多的 `NoSQL` 数据库实现采用了某种形式的 SQL 来检索数据。2015 年 5 月 29
  日，Timothy Stephan 在 Data Informed 上发表了一篇题为“NoSQL 最需要的是 SQL”的文章（[`http://data-informed.com/what-nosql-needs-most-is-sql/`](http://data-informed.com/what-nosql-needs-most-is-sql/)），该文章主张为
  NoSQL 数据库提供更多的 SQL 访问方式。


  `NoSQL` 适用于“网络规模”的数据，这类数据基于高并发用户数达数百万的海量数据。


  #### NoSQL 数据的特点


  `NoSQL` 数据库用于访问不适合关系型表的非关系型数据。通常，关系型数据库用于关键事务性数据。`NoSQL` 数据库通常用于分析非关键数据，例如日志文件。


  #### NoSQL 的实现


  有几种 `NoSQL` 数据库的类别：


  *   **键值存储**：这类数据库以行的形式存储数据，但不同行的模式可能不同。这类 `NoSQL` 数据库的一些例子有 `Couchbase`、`Redis`
  和 `Riak`。

  *   **文档存储**：这类数据库处理作为 `JSON` 对象的文档。每个文档都有属性和值。一些例子有 `CouchDB`、`Cloudant` 和 `MongoDB`。

  *   **宽列存储**：这类数据库拥有列族，每个列族由键值对的列组成。这类数据库的一些例子有 `HBase` 和 `Cassandra`。

  *   **图数据库**：图数据库非常适合社交网络应用。它们拥有类似于表中行的节点。`Neo4j` 是这类数据库的一个例子。


  一个允许从 `Hadoop` 访问数据的产品是 `Hive`，它提供了一种类似 SQL 的语言，称为 `HiveQL`，用于查询 `Hadoop`。另一个产品是
  `Pig`，它使用 `Pig Latin` 进行查询。俗话说，10 行 `Pig Latin` 代码能完成 200 行 `Java` 代码的工作。


  ### Spark


  另一项备受关注的技术是 `Apache Spark`——一个最初于 2009 年在加州大学伯克利分校开发的开源集群计算框架。它使用内存技术，据称性能比 `Hadoop`
  快 100 倍。它提供 `Spark SQL` 用于查询。IBM 最近宣布将投入大量资源用于开发 `Spark`。


  ## Microsoft 自助式 BI


  大多数这些大数据和 NoSQL 技术源于处理海量数据的搜索引擎和在线零售商。对于处理数千行或数百万行数据的中小型组织，本书展示了如何利用在 Excel 之上运行的微软
  `Power BI`。


  关于可以加载到 `PowerPivot` 中的最大行数，已有大量讨论。以下链接指向 Microsoft Trends 上的一篇博客文章，记录了加载 1.22 亿条记录的情况：[`www.microsofttrends.com/2014/02/09/how-much-data-can-powerpivot-really-manage-how-about-122-million-records`](http://www.microsofttrends.com/2014/02/09/how-much-data-can-powerpivot-really-manage-how-about-122-million-records)。


  ## 总结


  本章简要介绍了数据分析的演变历史，最终落脚于当今的大数据工具。它涵盖了数据结构的演变，从关系型数据库到 `NoSQL` 所处理的非结构化数据。


