- '# 11. HDInsight


  第 1 章将 Hadoop 描述为一个开源的分布式文件系统，能够处理海量数据。微软在其 Azure 云平台上对 Hadoop 的实现称为`HDInsight`，旨在处理云中的大量数据。`HDInsight`使用
  Azure Blob 存储来存放数据，使 Hadoop 在云中作为一种服务提供。Azure 有助于以经济高效的方式在云中存储大型数据集。微软仅按实际使用的资源收费。


  Apache Hive 支持对存储在 Hadoop 中的大型数据集进行分析。Hive 是构建在 Hadoop 之上的数据仓库基础架构，用于提供数据汇总、查询和分析。它最初由
  Facebook 开发，现已成为一个 Apache 开源项目。


  本章探讨将数据从 Azure `HDInsight`导出到 Excel 进行分析的最简单方法。


