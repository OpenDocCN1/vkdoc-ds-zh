- '# 8. Power Query


  Microsoft Power Query for Excel 是一种数据发现工具，用于从各种来源导入数据，包括关系型、半结构化和非结构化数据，这些数据可从 `OData`、`Hadoop`
  和 `Azure Marketplace` 等来源获取。它是一个用于提取、转换和加载数据的自助式 ETL（导出、转换、加载）工具。它比之前介绍的一些方法更强大。微软在不断更新
  Power Query，因此，到本书出版时，某些功能可能已发生变化。本章演示如何从 Web、表格格式、CSV 格式和 JSON 格式访问数据，然后使用 Power
  Query 编辑器对数据进行塑形，最后将其导入 Excel。


  ## 安装 Power Query


  如果 `Power Query` 选项卡不可见，则必须安装它。Power Query 作为免费下载软件提供给 Excel 2010 和 2013 用户。可以通过搜索“Power
  Query 下载”来访问下载链接。如果安装了 32 位版本的 Excel，请务必安装 32 位版本；如果安装了 64 位版本的 Excel，请安装 64 位版本。安装后，按以下步骤启用
  Power Query：


  1. 单击 `文件` 选项卡以查看 Backstage 视图。

  2. 单击左侧窗格底部的 `选项`。

  3. 在左侧窗格中选择 `加载项`。

  4. 在窗口底部，单击 `管理` 后面的箭头，选择 `COM 加载项`，然后单击 `转到`。

  5. 勾选 `Microsoft Office PowerPivot for Excel 2013`、`Microsoft Power Map for Excel`
  和 `Power View`，然后单击 `确定`。


  安装后，`Power Query` 选项卡将可见。


  ## Power Query 功能区上的关键选项


  本节将介绍 Power Query 功能区上最有用的选项，如图 8-1 所示。


  * **来自 Web**：允许从特定网站提取表格

  * **来自文件**：从 Excel、CSV、XML、文本文件或文件夹中的一组文件导入

  * **来自数据库**：从数据库导入，例如 SQL Server、Access、Oracle 和 MySQL

  * **来自 Azure**：从 Azure 服务导入，例如 SQL Database、Market Place、HDInsight、Blob Storage
  和 Table Storage

  * **来自其他源**：从包括 SharePoint 列表、OData 源、Hadoop (HDFS)、Facebook、Salesforce 对象和报表以及
  ODBC 在内的源导入

  * **最近的源**：显示最近查询的源

  * **来自 Excel 表数据**：从 Excel 电子表格导入一个区域

  * **合并**：合并两个查询以添加列

  * **追加**：将一个表追加到另一个结构相同的表

  * **显示窗格**：切换屏幕右侧的工作簿查询窗格的显示

  * **数据源设置**：管理通过 Power Query 访问的数据源的设置

  * **选项**：设置用于加载数据的选项

  * **更新**：在线检查 Power Query 更新

  * **数据目录搜索**：搜索精选的网站集并提取表格

  * **我的数据目录查询**：允许与其他用户共享查询


  ![A978-1-4842-0529-7_8_Fig1_HTML.jpg](img/A978-1-4842-0529-7_8_Fig1_HTML.jpg)


  图 8-1. Power Query 功能区


  ## 使用查询编辑器


  Power Query 允许将数据子集导入查询编辑器，以便在将数据导入 Excel 或数据模型之前，通过删除不需要的行或列，或创建计算列来塑形数据。查询编辑器中有三个选项卡：`主页`、`转换`和`添加列`。




  ### 查询编辑器主页功能区上的关键选项


  本节介绍查询编辑器主页功能区上的关键选项，如图 8-2 所示。


  - `Close & Load`：关闭编辑器并将数据加载到 Excel 工作表或数据模型中。

  - `Refresh Preview`：刷新查询，重新处理所有步骤并预览结果。

  - `Advanced Editor`：显示用于以 `M` 查询语言提取数据的代码。

  - `Choose Columns`/`Remove Columns`：允许保留或移除选定的列。单击 `Choose Columns` 图标会显示一个列列表，可以取消勾选以移除某些列，如图
  8-3 所示。


  ![A978-1-4842-0529-7_8_Fig3_HTML.jpg](img/A978-1-4842-0529-7_8_Fig3_HTML.jpg)


  图 8-3. `Choose Columns` 对话框


  - `Keep Rows`/`Remove Rows`：允许保留或移除选定的行。

  - `Remove Duplicates`：移除重复项。请谨慎定义重复项的判定条件。例如，在按天列出的股票价格列表中，如果仅根据股票代码移除重复项，则每个股票只会保留一行唯一数据。

  - `Sort`：按升序或降序对列进行排序。请记住，查询编辑器仅处理数据的子集。最好等到数据加载到工作表或数据模型中后再进行排序。

  - `Split Column`：基于分隔符（如逗号或空格）拆分列。

  - `Group By`：根据一个或多个字段对行进行分组。


  ![A978-1-4842-0529-7_8_Fig2_HTML.jpg](img/A978-1-4842-0529-7_8_Fig2_HTML.jpg)


  图 8-2. 查询编辑器界面


  请注意，移除或筛选行的另一种方法是点击列标题右侧的箭头并取消选中相应的值，如图 8-2 所示。


