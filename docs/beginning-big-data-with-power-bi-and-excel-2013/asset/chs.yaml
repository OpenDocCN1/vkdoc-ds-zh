- '# 11. HDInsight


  第 1 章 将 Hadoop 描述为一个开源的分布式文件系统，能够处理海量数据。微软在其 Azure 云平台上实现的 Hadoop 称为 HDInsight，旨在处理云中的大量数据。HDInsight
  使用 Azure Blob 存储来存储数据，使 Hadoop 作为云中服务可用。Azure 对于以经济高效的方式在云中存储大型数据集非常有用。微软只根据实际使用的资源收费。


  Apache Hive 支持分析存储在 Hadoop 中的大型数据集。Hive 是建立在 Hadoop 之上的数据仓库基础设施，用于提供数据汇总、查询和分析。它最初由
  Facebook 开发，现已成为一个开源的 Apache 项目。


  本章探讨了将数据从 Azure HDInsight 导出到 Excel 进行分析的最简单方法。


