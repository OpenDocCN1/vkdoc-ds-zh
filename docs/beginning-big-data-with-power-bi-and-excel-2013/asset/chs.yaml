- '# 6. 使用 Power View 设计报表


  `Power View`是一种报表工具，可创建其自身类型的工作表。对于不精通 Excel 的用户而言，这是一种创建“沙盒”的方式，可以在不更改数据的情况下探索数据的子集。`Power
  View`通过创建包含基于 PowerPivot 模型或数据透视表的快速简便可视化效果的仪表板，让数据变得生动。可以基于同一数据创建多个`Power View`工作表。


  ## Power View 设计界面的元素


  `Power View`界面包含以下元素，如图 6-1 所示：


  - 左侧的设计图面

  - 中间的筛选器区域，可在此处根据字段值筛选数据

  - `Power View 字段`窗格，在此处选择要包含在报表中的字段。顶部包含所有可用字段，底部显示已选字段。


  ![A978-1-4842-0529-7_6_Fig1_HTML.jpg](img/A978-1-4842-0529-7_6_Fig1_HTML.jpg)


  图 6-1.


  Power View 设计图面


  ## 使用 Power View 时的注意事项


  始终从表格视图开始，然后基于该表格创建图表。可以向设计图面添加多个表格和/或图表。只需点击空白区域即可添加新图表。


  在设计图面上仅包含报表所需的字段。除非与报表相关，否则通常建议不要包含用于链接表的关键值。


  ## 字段类型


  通常有两种处理方式截然不同的字段类型：


  - 非数字的分类或描述性字段

  - 数字字段，可包含计算字段或度量值。求和符号用于指示可更改聚合类型的数字字段。


  ## 理解数据如何汇总


  使用`Power View`时，最棘手的部分可能就是理解数据如何汇总。默认情况下，数字字段会被求和，即使这些字段的求和没有意义（如 ID 号或年份）。可以通过点击`Power
  View 字段`窗格底部字段名称后的向下箭头轻松更改聚合类型。聚合选项如下：


  - 不汇总

  - 求和

  - 平均值

  - 最小值

  - 最大值

  - 计数(非空)

  - 计数(非重复)


  请注意，要将数据绘制到图表上，必须使用上述数学函数之一对字段进行汇总。



