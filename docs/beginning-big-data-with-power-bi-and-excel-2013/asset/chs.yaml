- '# 在 Excel 中使用 SQL


  本章介绍如何在 Excel 中使用 SQL（结构化查询语言）来导入和操作大型数据文件的子集，以及提取汇总统计信息。




  ## SQL 历史


  SQL 最早由 IBM 在 20 世纪 70 年代初开发，当时命名为 `SEQUEL`（结构化英语查询语言）。它用于操作和检索早期 IBM 关系数据库管理系统（RDBMS）中的数据。由于商标冲突，`SEQUEL`
  被简称为 `SQL`。随后，Oracle 和后来的 Microsoft 将其实现到其他关系数据库管理系统中。1986 年，美国国家标准协会（ANSI）发布了 SQL
  标准。在我看来，正确的发音是 `S-Q-L`，但有些人仍然将其读作 `Sequel`。


  SQL 是一种声明式语言，这意味着它指定了需要什么结果，而无需定义`如何`获取。SQL 由数据定义语言和数据操作语言组成。在 Excel 中，主要使用数据操作语言的查询功能，因为数据定义是通过
  Excel 从其他源导入表来完成的。SQL 最初基于关系模型，这意味着数据根据固定结构存储在多个表中。


  ## NoSQL


  如第 1 章所述，术语 `NoSQL` 是用词不当，因为某些 `NoSQL` 系统具有 SQL 接口。更准确的术语应该是*非关系型*，或*不仅仅是 SQL*。关系数据库具有固定的模式，必须在输入任何数据之前定义该模式。相比之下，`NoSQL`
  数据库可以访问具有不同模式的数据。这有时被称为*读取时定义模式*。


  ## NewSQL


  `NewSQL` 试图在关系型系统和 `NoSQL` 系统之间取得折衷。这些系统使用关系架构，并以 SQL 作为其主要接口，但力求拥有与 `NoSQL` 系统相同的可扩展性和灵活性。


  ## SQL++


  `SQL++` 是该语言的一种新形式，它增强了传统 SQL，并基于一种半结构化数据模型，该模型可以访问 JSON 数据以及传统的关系数据。它通常向后兼容传统 SQL。


  `SQL++` 的一种实现是 `N1QL`（发音为“Nickel”），由 Couchbase 基于 Kian Win Ong、Yannis Papakonstantinou
  和 Romain Vernoux 在 2014 年发表的论文《The SQL++ Unifying Semi-structured Query Language,
  and an Expressiveness Benchmark of SQL-on-Hadoop, NoSQL and NewSQL Databases》进行开发。


  ## SQL 语法


  SQL 查询语言的核心是 `SELECT` 命令。该命令的语法如下所示。请注意，方括号内的子句是可选的。


  ```

  SELECT [DISTINCT] <列列表>

  [AS <返回列的可选别名>]

  FROM <表名>

  [WHERE <条件>]

  [GROUP BY <用于计算聚合的列表达式>]

  [HAVING <组级过滤条件>]

  [ORDER BY <结果表的排序顺序>]

  ```


  `SELECT` 子句指定要显示的列或列表达式。可以使用星号来指定所有列。`FROM` 子句列出要访问的表。`WHERE` 子句用于提供关联多个表的条件，和/或提供行级过滤器，用于排除不符合所需条件的行。`GROUP
  BY` 用于将结果表按组排列以进行数据聚合，例如小计。`HAVING` 子句为结果集提供组级过滤器。`ORDER BY` 子句用于按指定顺序排列结果表。在 PowerPivot
  和 Excel 中执行此操作的方法将在本章中演示。


  当使用 `SELECT` 语句时，应解决以下问题：


  - `SELECT`：要显示哪些所需的列或列表达式？

  - `FROM`：这些列位于哪些表中？

  - `WHERE`：关联表的条件是什么？消除不需要的行的选择标准是什么？

  - `GROUP BY`：哪些值需要被聚合，例如用于小计目的？

  - `HAVING`：在使用聚合时，结果表中的每条记录必须满足哪些条件才能被包含？

  - `ORDER BY`：结果应以什么顺序呈现？


  例如，以下 SQL `SELECT` 语句从 `addrlist` 表中提取邮政编码等于“94704”的 name 和 address 字段。


  ```

  SELECT name, address FROM addrlist WHERE zip="94704"

  ```


  ## SQL 聚合函数


  SQL 包含各种聚合函数，允许根据 `WHERE` 子句中的条件计算小计、子平均值、子计数等。


  这些函数包括：


  - `COUNT()`：返回满足指定条件的非空行数

  - `SUM()`：返回指定列中所有值的总和

  - `MIN()`：返回指定列中的最小值

  - `MAX()`：返回指定列中的最大值

  - `AVG()`：返回指定列的平均值


  这些函数可以应用于整个表，也可以应用于由 `WHERE` 条件定义的子集。例如，查看以下语句：


  - `SELECT COUNT(*) FROM offices`：将返回 `offices` 表中的行数

  - `SELECT COUNT(*) FROM office WHERE region="CH"`：将返回芝加哥地区的办公室数量

  - `SELECT SUM(sales) FROM offices`：将返回 `offices` 表中所有行的销售额总和

  - `SELECT SUM(sales) FROM offices where region="CH"`：将返回芝加哥地区所有办公室 `sales` 字段的总和


  ## 小计


  可以使用以下语句显示每个地区的办公室总数：


  ```

  SELECT region, COUNT(*) FROM offices GROUP BY region

  ```


  可以使用以下语句生成所有地区的销售额小计：


  ```

  SELECT region, SUM(sales) FROM offices GROUP BY region

  ```


  ## 连接表


  在查询多个表时，最好使用 `WHERE` 子句来指定连接表的条件。这被称为*等值连接*，因为它基于相等性测试。如果省略 `WHERE` 子句，则第一个表中的每一行将与第二个表中的每一行配对。这被称为两个表的*笛卡尔积*，或*外连接*。




