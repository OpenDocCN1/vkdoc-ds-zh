- '# 2. Excel 作为数据库和数据聚合器


  电子表格在让普通民众访问数据方面有着悠久的历史。本章将追溯 Excel 从电子表格演变为强大数据库的历程。然后展示如何从各种来源导入数据。后续章节将演示 Excel
  结合 `Power BI` 如何成为强大的商业智能工具。




  ## 从电子表格到数据库


  首款电子表格程序`VisiCalc`（即“可视化计算器”的缩写）于 1979 年发布，专为 Apple II 计算机设计。它是第一款“杀手级应用”。当时有种说法是：“`VisiCalc`
  卖出的苹果电脑比苹果公司自己卖得还多。”`VisiCalc`由丹·布里克林和鲍勃·弗兰克斯顿开发。布里克林当时就读于哈佛商学院，在看到一位教授手动编写财务模型后，他萌生了开发该程序的想法。每当教授想要修改时，都必须擦除旧数据并重新写入新数据。布里克林意识到，这一过程可以通过在个人计算机上运行的电子表格实现自动化。


  在那个年代，大多数会计数据都困在主程序之中，需要程序员才能修改或访问。正因如此，程序员被称为计算机领域的“高级祭司”，这意味着最终用户对程序的运行方式几乎毫无控制权。就当时而言，`VisiCalc`非常易于使用。但与今天的电子表格相比，它仍然非常原始。例如，在`VisiCalc`的早期版本中，所有列都必须具有相同的宽度。


  成功必然引来竞争。`VisiCalc`无法在当时的商用计算机——CP/M 计算机上运行。CP/M 最初是“控制程序/监控器”的缩写，后来演变为“微型计算机控制程序”，是
  20 世纪 70 年代末至 80 年代初使用的一种操作系统。1980 年，Sorcim 公司推出了`SuperCalc`，作为 CP/M 计算机的电子表格程序。微软于
  1982 年发布了`Multiplan`。当时所有的电子表格程序都是菜单驱动的。


  1981 年 8 月，IBM PC 的发布向其他大公司释放了一个信号：个人计算机是大型企业的严肃工具。`VisiCalc`被移植到 IBM PC 上运行，但并未充分利用新计算机增强的硬件能力。


  看到这一机遇后，企业家米奇·卡普尔（`VisiCalc`开发者的朋友）创立了莲花发展公司（Lotus Development），专门为 IBM PC 编写了一款电子表格程序。他将这款程序命名为`Lotus
  1-2-3`。名称中的`1-2-3`表示它在原始电子表格功能的基础上，增加了创建图表以及执行简单排序等有限数据库功能的能力。


  `Lotus 1-2-3`是第一款通过电视广告推广的软件程序。它随 IBM PC 的流行而风靡一时，并在 20 世纪 90 年代初期一直保持领先地位。


  Microsoft Excel 是首款利用 Apple Macintosh 普及的图形用户界面的电子表格程序。Excel 于 1987 年发布，最初面向 Macintosh
  系统，随后被移植到 Windows 平台。20 世纪 90 年代初期，随着 Windows 的普及，微软将 Word 和 Excel 打包成 Microsoft
  Office，并采取了激进的定价策略。最终，Excel 取代了`Lotus 1-2-3`成为领先的电子表格程序。如今，Excel 是全球使用最广泛的电子表格程序。


  越来越多的分析功能（如数据透视表）被逐步引入 Excel，同时可处理的最大行数也不断增加。利用`VLOOKUP`函数，可以在表格之间建立简单的关系。对于 Excel
  2010，微软推出了可作为独立下载的`PowerPivot`，它允许基于多个表构建数据模型。`PowerPivot`随 Excel 2013 一同发布。第 4
  章将讨论如何使用`PowerPivot`构建数据模型。


  ### 解释文件扩展名


  文件扩展名指示了文件中存储的数据类型。本章将展示如何将各种格式的数据导入到 Excel 的原生`.xlsx`格式中，这是使用后续章节讨论的 Power BI 高级功能所必需的。本章将处理具有以下扩展名的文件：


  - `.xls`：Excel 2007 之前的 Excel 工作簿

  - `.xlsx`：Excel 2007 及更高版本的 Excel 工作簿；添加第二个 `x` 表示数据以 XML 格式存储

  - `.xlsm`：包含宏的 Excel 工作簿

  - `.xltm`：Excel 工作簿模板

  - `.txt`：包含文本的文件

  - `.xml`：XML 格式的文本文件


  ### 将 Excel 用作数据库


  默认情况下，Excel 处理由行和列组成的表格。每一行是一条记录，包含单个项目的所有属性。每一列是一个字段或属性。


  一个表格应在第一行显示字段名称，并在其周围留出空白区域——两侧各一个空白列，上下各一个空白行（除非第一行是第 1 行或第一列是 A 列）。单击表格内的任意位置，然后按`Ctrl
  + T`将其定义为表格，如图 2-1 所示。注意每列顶部带有箭头的标题。单击箭头会弹出一个菜单，提供排序和筛选选项。


  ![A978-1-4842-0529-7_2_Fig1_HTML.jpg](img/A978-1-4842-0529-7_2_Fig1_HTML.jpg)


  图 2-1. 一个 Excel 表格


  请注意，在当前版本的 Excel 中，如果你按某个字段排序，它会智能地带动相关字段（只要区域内没有空白列），如图 2-2 所示，这里按姓氏排序。若要按名和姓排序，则应先按名排序，再按姓氏排序。


  ![A978-1-4842-0529-7_2_Fig2_HTML.jpg](img/A978-1-4842-0529-7_2_Fig2_HTML.jpg)


  图 2-2. 按名和姓氏排序的 Excel 表格


  ### 从其他格式导入


  Excel 可用于从多种来源导入数据，包括存储在文本文件中的数据、网站表格中的数据、XML 文件中的数据以及 JSON 格式的数据。本章将向你展示如何导入一些较为常见的格式。第
  4 章将介绍如何使用 Power BI 关联多个表格。


  #### 在 Excel 中打开文本文件


  Excel 可以打开逗号分隔、制表符分隔、固定长度字段和 XML 格式的文本文件，以及图 2-3 所示的文件格式。当以这些格式中的任何一种打开文件时，它们会自动转换为电子表格。


  ![A978-1-4842-0529-7_2_Fig3_HTML.jpg](img/A978-1-4842-0529-7_2_Fig3_HTML.jpg)


  图 2-3. 可导入 Excel 的文件格式


  导入文件时，最好使用文件的副本进行操作，这样原始文件保持不变，以防导入过程中文件损坏。


  图 2-4 展示了记事本中的一个逗号分隔文件。请注意，第一行由字段名称组成。所有字段由逗号分隔。Excel 知道如何将这种类型的文件读取到电子表格中。如果用 Excel
  打开这种格式的文本文件，它将显示为一个电子表格，如图 2-1 所示。


  ![A978-1-4842-0529-7_2_Fig4_HTML.jpg](img/A978-1-4842-0529-7_2_Fig4_HTML.jpg)


  图 2-4. 逗号分隔值格式




  ### 从 XML 导入数据


  可扩展标记语言（XML）是一种流行的数据存储格式。与 HTML 类似，它使用成对标签来定义每个元素。图 2-5 显示了 XML 格式下我们一直处理的数据。第一行是声明，指定了
  XML 版本、UTF 编码及其他信息。请注意将所有其他标签包围起来的 `donors` 根标签。


  ![A978-1-4842-0529-7_2_Fig5_HTML.jpg](img/A978-1-4842-0529-7_2_Fig5_HTML.jpg)


  图 2-5. XML 格式


  这些数据是自描述的。本例中的每一行或每一条记录都被一个 `donor` 标签包围。字段名称在开标签和闭标签中为每个字段重复出现了两次。该文件将作为扩展名为 `.xml`
  的文本文件保存。


  Excel 可以直接打开 XML 文件。在打开后弹出的第一个对话框中选择“作为 XML 表”。然后在下一个弹出的对话框中点击“是”，“Excel 将创建架构。”


  如图 2-6 所示，XML 文件可以在诸如 Internet Explorer 之类的网页浏览器中显示。请注意 `donor` 标签左侧的小加号和减号。点击减号可隐藏每条记录中的详细信息，点击加号则可显示详细信息。


