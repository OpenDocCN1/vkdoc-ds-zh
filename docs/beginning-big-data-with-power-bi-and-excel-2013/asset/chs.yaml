  `StoreSales2008:=CALCULATE([StoreSales],LEFT(dbo_DimDate[Datekey],4)="2008")`


  接下来，可以通过输入以下公式计算同比增长率，并将格式更改为百分比，如图 7-15 所示。计算字段的标识符必须括在方括号中。请注意，2009 年的销售额下降了 12%。


