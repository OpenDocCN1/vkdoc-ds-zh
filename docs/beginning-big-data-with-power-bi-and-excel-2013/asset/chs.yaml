- '# 1. 大数据


  电子补充材料 本章的在线版本（doi:[10.​1007/​978-1-4842-0529-7_​1](http://dx.doi.org/10.1007/978-1-4842-0529-7_1)）包含补充材料，可供授权用户使用。


  当今商业的目标是挖掘数据中蕴藏的智能。我们正目睹多种趋势的汇聚，导致可用数据呈指数级增长，其中包括廉价的存储设备和用于收集数据的传感器的普及。此外，使物体相互交互的物联网也将产生海量数据。


  各类组织正试图从非结构化数据中提取智能。他们努力打破不同数据孤岛之间的壁垒。大数据和 NoSQL 工具正被用于分析这股数据洪流。


  大数据有许多定义，但其核心在于从大量数据中提取可能无法基于较小数据集发现的洞察。通过分析购买习惯来预测客户想要购买的产品，可用于确定销售哪些商品。本章将涵盖数据分析工具从早期原始地图和图表到当今大数据工具的演变历程。


  ## 大数据作为第四生产要素


  基于工业经济的传统经济学认为，存在三个生产要素：土地、劳动力和资本。2012 年 12 月 27 日的《金融时报》刊登了一篇题为《为何“大数据”是第四生产要素》的文章，探讨了大数据在决策中的作用。文章指出：“随着大数据的普及，高管们越来越依赖数字洞察。但大数据的魅力在于，它能让直觉型和分析型思考者都发挥出色。更具创业精神和创造力的领导者可以在不同的数据源中发现意想不到的模式（这可能会吸引他们直觉型的天性），并最终利用这些信息改变企业的方向。”


  ## 大数据作为自然资源


  IBM 首席执行官弗吉尼亚·罗梅蒂曾表示：“大数据是下个世纪世界的自然资源。”她还补充说，数据需要经过提炼才能发挥作用。IBM 已从硬件制造转型，并投资了 300
  亿美元用于增强其大数据能力。


  IBM 在大数据方面的投资很大一部分用于开发 Watson——一种自然语言问答计算机。Watson 于 2011 年作为《危险边缘！》的参赛者首次亮相，并击败了前任冠军。它具有每秒搜索
  100 万本书的计算能力，还能处理口语化的英语。


  Watson 更实际的应用之一是与医生合作制定癌症治疗方案。为此，Watson 接收了来自 200 万页医学期刊和 60 万份临床记录的信息。当医生输入患者的症状时，Watson
  可以生成一份按成功置信度排序的建议列表。


  ## 数据作为中层管理者


  2015 年 4 月 30 日，克里斯托弗·米姆斯在《华尔街日报》上发表了一篇题为《数据是新任中层管理者》的文章，描述了一些初创公司如何用数据取代中层管理者。文章指出：“初创公司比以往任何时候都更加灵活，这要归功于一种根本不同的管理结构，这种结构将决策权下放到组织的外围，即实际负责执行公司具体业务的人员手中。这种相对扁平化的层级结构之所以成为可能，是因为一线员工基本上可以无限制地访问过去难以获取或需要更高级管理层解读的数据。”文章进一步阐述，当数据库非常昂贵且商业智能软件耗资数百万美元时，限制只有高层管理者才能访问是有道理的。但如今情况已非如此。需要数据科学家来验证数据的准确性及其呈现方式。米姆斯总结道：“既然每位员工都能拥有监控任何目标进度的工具，那么中层管理者作为信息收集和决策者的旧角色，在许多初创公司中已不再适用。”


  ## 早期数据分析


  数据分析并非一开始就如此复杂。它历经多年，从非常原始的形式演变到今天的水平。


  ### 第一条时间线


  1765 年，神学家兼科学家约瑟夫·普里斯特利创建了第一条时间线图表，其中使用单个条形图来比较多位人物的寿命，如图 1-1 所示。


  ![A978-1-4842-0529-7_1_Fig1_HTML.jpg](img/A978-1-4842-0529-7_1_Fig1_HTML.jpg)


  图 1-1. 早期的时间线图表


  ### 第一个条形图和时间序列


  苏格兰工程师威廉·普莱费尔被誉为折线图、条形图和饼图的发明者。他的时间序列图至今仍被视为清晰的典范。普莱费尔于 1786 年在伦敦首次出版了《商业与政治地图集》。该地图集包含
  43 个时间序列图和一个条形图，被描述为第一部包含统计图表的重要著作。普莱费尔于 1801 年在伦敦出版的《统计概览》中包含了被普遍认为是第一个饼图的图表。图
  1-2 展示了普莱费尔绘制的一个显示贸易差额的时间序列图。


  ![A978-1-4842-0529-7_1_Fig2_HTML.jpg](img/A978-1-4842-0529-7_1_Fig2_HTML.jpg)


  图 1-2. 普莱费尔的贸易差额时间序列图


  ### 霍乱地图


  1854 年，医生约翰·斯诺绘制了伦敦霍乱病例的分布图，以确定其与单个水泵受污染水源之间的关联，如图 1-3 所示。在此分析之前，无人知晓霍乱的病因。这被认为是首次使用地图来分析疾病传播方式。


  ![A978-1-4842-0529-7_1_Fig3_HTML.jpg](img/A978-1-4842-0529-7_1_Fig3_HTML.jpg)


  图 1-3. 霍乱地图


  ## 现代数据分析


  互联网释放了海量数据。谷歌和其他互联网公司设计了访问这些数据并使其广泛可用的工具。


  ### 谷歌流感趋势


  2009 年，谷歌建立了一个系统，基于与流感相关的搜索来追踪流感爆发。当 2009 年 H1N1 危机爆发时，谷歌的系统被证明比存在自然报告滞后的政府统计数据更具实用性和及时性（《大数据》作者：维克托·迈尔-舍恩伯格和肯尼思·库克耶，Mariner
  Books, 2013 年）。然而，在 2012 年，该系统高估了流感病例的数量，推测是由于媒体对流感的关注所致。为此，谷歌调整了其算法。


  ### 谷歌地球


  谷歌地球的前身由计算机程序员丽贝卡·摩尔于 2005 年开发。她住在加利福尼亚州的圣克鲁斯山脉，那里一家木材公司提议开展一项以防火为名的伐木作业。摩尔使用谷歌地球来证明该伐木计划将清除住宅和学校附近的森林，并威胁到饮用水源。


  ### 追踪疟疾


  2014 年 9 月 10 日，《旧金山纪事报》的一篇文章报道，加州大学旧金山分校的一个团队正在使用谷歌地球追踪非洲的疟疾情况，并监测可能面临爆发风险的区域。文章称：“加州大学旧金山分校团队希望聚焦于促使疟疾传播的因素：近期降雨、植被茂密、低海拔、温暖气温、靠近河流、人口密集。”基于这些因素，可以识别出潜在的疟疾热点区域。




  ## 大数据成本节约


  根据 2014 年 7 月 1 日《华尔街日报》一篇题为"大数据削减成本"的文章，咨询公司高德纳研究总监克里斯·伊尔沃利诺表示："会计师和财务高管通常关注销售和支出等单项指标，而非研究不同数据集之间的关系。但那些成功整合这些信息流的公司，已从大数据中获得了巨大收益。"


  文中列举的案例如下：


  -   近期，通用汽车基于成本与预期销售额的分析，决定停止在欧洲销售雪佛兰品牌。这项分析仅用了**几天**时间，而非数周。

  -    Planet Fitness 能够根据跑步机在健身俱乐部高流量区域的位置来分析其使用情况，并轮换它们以平衡机器磨损。


  ## 大数据与政府


  政府资金和人力有限，但却拥有海量数据。遗憾的是，大多数政府机构不知道如何利用所掌握的数据，在正确的时间将资源分配给正确的人。


  美国政府曾试图通过网站 `USAspending.gov` 公开资金流向。位于硅谷中心的加利福尼亚州帕洛阿尔托市，则通过其网站 `data.cityofpaloalto.org`
  提供数据。该市利用数据的目标是实现敏捷、高效的政府运作。该网站提供城市运营的基本数据，包括树木的种植和修剪时间。


  ### 预测性警务


  预测性警务利用数据预测犯罪可能发生的地点，从而实现警力资源的高效配置。其目标是识别犯罪风险较高的人员和地点。


  ### 一个节约成本的成功案例


  2011 年 1 月 24 日《纽约客》杂志的一篇文章描述了一位三十多岁的医生杰弗里·布伦纳如何不顾警方反对，绘制新泽西州卡姆登市的犯罪和医疗急救统计数据，设计出一套能削减成本的系统。他获取了三家主要医院的医疗账单记录以及犯罪统计数据。他绘制了一幅幅逐街区的地图，并根据居民的住院费用进行颜色编码。他发现，费用最高的两个街区包括一家大型疗养院和一处低收入住宅区。据文章描述："他发现，从
  2002 年 1 月到 2008 年 6 月，这两栋楼里约 900 人产生了超过 4000 次就诊记录和约 2 亿美元的医疗账单。其中一名患者在五年内住院 324
  次。费用最高的患者给保险公司造成了 350 万美元的损失。"他确定，1%的患者承担了 30%的费用。


  布伦纳的目标是在削减成本的同时，最有效地帮助患者。他尝试锁定病情最严重的患者，提供预防性护理和健康监测，以及针对药物滥用的治疗，以最大限度地减少急诊就诊和住院次数。他建立了一个由执业护士和社会工作者组成的支持系统，来照护病情最严重的患者。这种方法的早期结果显示成本降低了
  56%。


  ## 物联网或工业互联网


  物联网指的是设备之间的机器对机器通信，涉及家庭照明、恒温器等设备间的网络连接。思科系统公司则使用"万物互联"这一术语。


  2014 年 7/8 月刊《快公司》杂志的一篇文章描述了通用电气公司如何使用"工业互联网"这一术语。这涉及将智能嵌入机器，以收集和分析其数据，从而预测故障，使问题得以预见和纠正。通用电气的喷气发动机就是一个例子。通用电气计划利用发动机产生的数据来预测发动机部件何时需要维修，从而在故障发生前解决问题。通用电气的设想是，生产力和可靠性方面的小幅提升也能带来巨大的经济效益。


  通用电气还在研发一款用于机车的智能巡航控制系统"行程优化器"。该系统利用火车的地理位置、重量、速度、燃油消耗和地形数据，计算出最佳速度，以最大限度地减少燃油消耗。


  ### 麻省理工学院削减能源成本


  2014 年 9 月 28 日《华尔街日报》一篇题为"大数据降低建筑能耗"的文章描述了廉价的传感器如何能够实时收集能源消耗数据。例如，麻省理工学院设立了一个能源作战室，用于监控校园建筑的能源使用情况。能源泄漏可以被发现并得到纠正。


  ## 大数据革命与医疗保健


  麦肯锡公司 2013 年 4 月一份题为"美国医疗保健行业的大数据革命：加速价值与创新"的报告指出，基于制药公司将多年研究成果整合到医学数据库中，以及医疗保健提供者将患者记录数字化，医疗保健领域正在经历一场大数据革命。基于数据的循证医学正成为一种趋势。大数据算法正被用来提供最佳证据。


  目前，医疗保健支出占美国国内生产总值的 17%以上。麦肯锡估计，在医疗保健领域实施这些大数据策略，可以使美国的医疗费用降低 12%至 17%，每年节省 3000
  亿至 4500 亿美元。


  "生物学研究固然重要，但感觉数据科学对医学的贡献将超过所有生物科学的总和。"风险投资家维诺德·科斯拉在斯坦福大学医学院生物医学大数据会议上如是说（引自 2014
  年 5 月 24 日《旧金山纪事报》）。他进一步表示，人类判断力无法与从数百万个数据点中得出预测的机器学习系统相抗衡。他还预测，技术将取代医生在决策中 80%–90%的角色。




  ### 医疗化智能手机


  2015 年 1 月 10 日，《**华尔街日报**》的一篇文章报道称，“医疗化智能手机将颠覆医疗保健的方方面面”。人们正在开发可测量血压甚至进行心电图的智能手机配件。可穿戴无线传感器能够追踪血氧和血糖水平、血压以及心律。即将推出的手表可持续采集血压和其他生命体征数据。其结果将是数据量大幅增加，并有可能用虚拟医生问诊取代实体门诊。


  2013 年 12 月，`IDC Health Insights` 发布了一份题为“美国互联健康 2014 年十大预测：新型护理交付模式”的报告。该报告预测了一种涉及移动医疗应用、远程医疗和社交网络的新型医疗保健交付模式，这种模式将“在传统医疗机构之外提供更高效、更具成本效益的医疗保健方式”。根据该报告，这些变革将依赖于四种变革性技术：


  移动  大数据分析  社交  云


  该报告引用了**约翰·霍普金斯大学**的“智能手机体检”项目。该项目“使用一系列基于智能手机的医疗设备，来收集对体检具有临床意义的定量或定性数据，例如体重、血压、心率、血氧饱和度、视力、视盘和鼓膜图像、肺功能值、心电图、心音和肺音以及超声可视化图像（如颈动脉成像）。”


  根据该报告，“随着消费者更多地采用移动健康、个人健康和健身建模以及社交技术，来自不同数据源的消费者数据将激增，从而产生关于消费者的丰富信息。”


  **麦肯锡公司**2011 年 5 月发表了一篇题为“大数据：创新、竞争与生产力的下一个前沿”的论文，提出了利用大数据创造价值的五种方式，具体如下：


  - 大数据可以通过提高信息的透明度和使用频率来释放巨大价值。

  - 随着组织以数字形式创建和存储更多交易数据，它们可以收集从产品库存到病假天数等所有方面更准确、更详细的绩效信息，从而提升绩效。

  - 大数据允许对客户进行更精细的细分，从而实现更精准定制的产品或服务。

  - 复杂的分析可以显著改善决策。

  - 大数据可用于改进下一代产品和服务的开发。


  ## 提高工业设备的可靠性


  为了提高喷气发动机等工业设备的可靠性，通用电气（GE）已将实施工业互联网作为首要任务。该公司现在每天从 140 万件医疗设备和 28,000 台喷气发动机中收集
  5000 万个数据点。目标是提高设备的可靠性。GE 开发了`Predix`，可用于分析其他公司生成的数据，以构建和部署软件应用程序。


  ## 大数据与农业


  精准农业的目标是提高农业生产力，以便在世界人口增长的情况下生产足够的粮食。收集的数据包括土壤和空气质量、海拔、土壤氮含量、作物成熟度、天气预报、设备和劳动力成本。这些数据用于确定何时种植、灌溉、施肥和收获。这是通过安装传感器来测量土壤温度和湿度来实现的。拍摄农田图像以显示作物成熟度。使用预测性天气模型来规划灌溉和收获时间。目标是提高作物产量、降低成本、节省时间和减少用水量。


  ## 廉价存储


  在 20 世纪 40 年代初期，物理计算机普及之前，“计算机”是一个工作岗位的名称。计算机的第一波浪潮是关于加速计算。1946 年，第一台通用电子计算机——电子数字积分器与计算机（`ENIAC`）——在宾夕法尼亚大学安装。`ENIAC`
  占据了一整个房间，重达 30 吨，使用了超过 18,000 个真空管，最初设计用于计算弹道轨迹。然而，到 1946 年二战已经结束，因此这台计算机被转而用于和平应用。


  ### 个人计算机与存储成本


  个人计算机诞生于 20 世纪 70 年代，采用英特尔芯片和软盘驱动器进行存储，主要供爱好者使用。1981 年 8 月，`IBM PC` 发布，配备了存储 360
  千字节数据的 5.25 英寸软盘驱动器。全球最大的计算机公司`IBM` 推出个人电脑这一事实向其他公司发出了一个信号：个人电脑是一种严肃的办公工具。1983 年，`IBM`
  发布了 `IBM-XT`，它配备了一个 10 兆字节的硬盘，售价数百美元。如今，一个太字节的硬盘可以以不到 100 美元的价格购得。多个吉字节的闪存盘只需不到
  10 美元即可买到。


  ### 文件大小回顾


  在个人计算机的发展历程中，随着存储需求的指数级增长，我们经历了从千字节到兆字节、吉字节，再到现在的太字节及更高容量。早期的个人计算机有 640 千字节的内存。据报道，**微软公司**联合创始人比尔·盖茨曾说过，没有人会需要超过
  640 千字节的内存。20 世纪 80 年代发布的**微软**操作系统 `MS-DOS` 的各个版本只能寻址 640 千字节的内存。`Windows` 的一个卖点就是它能寻址超过
  640 千字节的内存。表 [1-1] 显示了数据是如何衡量的。


