  #### 分析工具库的其他功能


  分析工具库还包含其他功能。以下列出了一些最常用的功能：


  *   方差分析工具提供不同类型的方差分析。它们用于检验两个样本选择的随机性。

  *   相关系数是介于 -1 和 +1 之间的一个值，用于衡量两个变量之间的相关强度。+1 表示完全正相关，意味着两个变量同步变动。-1 表示完全负相关，意味着两个变量反向变动。正相关并不能证明因果关系。Excel
  的 `CORREL` 函数也可用于计算相关系数。

  *   协方差衡量的是两个随机变量共同变化的程度。

  *   指数平滑类似于移动平均，用于预测时间序列中的下一个值。


