  CSV 文件可以直接使用 Power Query 加载到 Excel 和 PowerPivot 中。下面的示例演示了如何操作。


  首先，从以下 URL 下载股市压缩文件：`s3.amazonaws.com/hortonassets/mstut/nyse.zip` 下载完成后，在浏览器的下载窗口中双击该文件将其打开，如图
  8-12 所示。


