  本章将介绍 Excel 数据模型，也称为 PowerPivot 数据模型。Excel 2013 的 `PowerPivot` 基于在 Excel 内部运行的 SQL
  Server Analysis Services 2012 表格引擎。数据模型允许关联多个表格。它完全在内存中运行并压缩数据，从而能够处理数百万行数据。


