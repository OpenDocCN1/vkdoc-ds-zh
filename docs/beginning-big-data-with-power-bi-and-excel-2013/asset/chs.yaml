  ### 小结


  本章仅仅触及了 Excel 利用分析工具库计算统计值的表层能力。它展示了如何使用内置的图表工具创建数据的可视化显示，并演示了如何判断两个值之间是否存在关系。这些主题足以写成一整本书。


