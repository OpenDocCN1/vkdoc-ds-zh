  ## 散点图


  通过绘制散点图，可以让程序计算 `R-squared` 值，从而观察两个变量之间的视觉关系。`R-squared` 是一种统计度量，用于衡量数据与拟合回归线（即穿过数据点的最佳拟合直线）的接近程度，它也被称为决定系数。`R-squared`
  的取值范围是 0 到 100。`R-squared` 值为 100 表示一个变量的所有变动完全由另一个变量的变动解释。`x` 是自变量，`y` 是因变量。


  ### 练习 10-3. 成绩与缺勤关系散点图示例


  本示例探讨课堂缺勤次数与数字成绩之间是否存在关系，其中 1 表示最低成绩，4 表示最高成绩。成绩数据如图 10-22 所示。


