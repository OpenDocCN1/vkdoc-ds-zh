  ### 个人计算机的数据库软件


  20 世纪 80 年代，随着个人计算机的普及，专门为其开发的数据库程序应运而生。dBASE II 是首批用于个人计算机的可编程关系型数据库系统之一，由加州帕萨迪纳市喷气推进实验室（JPL）的韦恩·拉特利夫开发。20
  世纪 80 年代初，他与乔治·泰特合作成立了 Ashton-Tate 公司来销售 dBASE II，该系统大获成功。20 世纪 80 年代中期，发布了功能增强的
  dBASE III。


  dBASE 程序是解释执行的，这意味着它比将所有指令一次性翻译成机器语言的编译型程序运行得更慢。1985 年，Clipper 作为 dBASE 的编译版本发布，并变得非常流行。几年后，FoxBase（后来更名为
  FoxPro）发布，并增添了更多增强功能。


  ## 大数据与 NoSQL 的诞生


  互联网在 20 世纪 90 年代得到普及，这在一定程度上要归功于万维网，它使互联网的使用变得更加简单。相互竞争的搜索引擎让用户能够轻松找到数据。谷歌成立于 1996
  年，并彻底改变了搜索方式。随着越来越多数据的出现，试图将所有数据都塞进矩形表格的关系型数据库的局限性变得日益明显。


  1998 年，卡洛·斯特罗齐使用了术语 NoSQL。据报道，他后来对这个术语感到后悔，并认为 NoRel（即非关系型）或许是一个更好的选择。


  ### Hadoop 分布式文件系统（HDFS）


  大数据技术的许多成果都源于搜索引擎公司。Hadoop 起源于 2002 年启动的开源网络搜索引擎 Apple Nutch。它包含一个网络爬虫和搜索引擎，但无法扩展以处理数十亿个网页。


  2003 年，一篇描述谷歌分布式文件系统（GFS）架构的论文发表，该系统被谷歌用于存储网络爬取和索引过程中生成的大文件。2004 年，一个名为 Nutch 分布式文件系统（NDFS）的开源版本发布。


  2004 年，谷歌发表了一篇关于 MapReduce 的论文。到 2005 年，MapReduce 已被整合到 Nutch 中。MapReduce 是一种批处理查询过程，能够对大型数据集运行临时查询。它解锁了以前被归档的数据。运行查询可能需要几分钟甚至更长时间。


  2006 年 2 月，Hadoop 作为一个独立的子项目建立。基于他与迈克·卡法雷拉的先前工作，道格·卡廷加入了雅虎公司，雅虎提供了资源，使 Hadoop 成为对互联网有用的工具。到
  2008 年，雅虎将其搜索索引建立在 Hadoop 集群之上。Hadoop 这个名字源于道格·卡廷的孩子给一只黄色填充大象起的名字。Hadoop 提供了一个运行在廉价商用硬件上、可靠且可扩展的存储和分析平台。Hadoop
  是开源的。


  ## 大数据


  大数据没有一个统一的定义，但目前围绕它有许多炒作，这可能导致其含义被稀释。普遍认为，它指的是具有不规则结构、数据量巨大（从数百 TB 到 PB 乃至更高）的数据。它可以包括来自金融交易、传感器、网络日志和社交媒体等的数据。一个更具操作性的定义是：当组织的数据处理需求超出传统关系型数据库的能力范围时，它们就必须使用大数据。


  大数据基于反馈经济，物联网将传感器安装在越来越多的设备上。随着医疗记录数字化、更多商店通过会员卡追踪消费者购买行为、以及人们佩戴健康追踪设备，越来越多的数据正在被生成。通常，大数据更关注分析行为，而非监控事务——后者是传统关系型数据库的领域。随着存储成本的下降，企业追踪越来越多的数据以寻找模式并构建预测模型。


  ### 三个 V


  一种描述大数据特征的方式是通过三个 V：


  - **体量（Volume）**：涉及多少数据？

  - **速度（Velocity）**：数据产生得有多快？

  - **多样性（Variety）**：数据是否具有不规则的结构和格式？


  另外两个有时会提到的 V 是：


  - **易变性（Variability）**：是否涉及多种不同格式且解释各异的数据？

  - **准确性（Veracity）**：数据有多准确？




  ### 数据生命周期


  数据生命周期包括收集和分析数据以构建预测模型，遵循以下步骤：

  收集数据。存储数据。查询数据以识别模式并理解数据。使用可视化工具发现商业价值。基于数据预测未来消费者行为。


  ### Apache Hadoop


  `Hadoop` 是一个用 `Java` 编写的开源软件框架，用于对存储在商用服务器上的超大数据集进行分布式存储和处理。它具有内置的冗余机制来处理硬件故障。`Hadoop`
  基于两大核心技术：`MapReduce` 和 `Hadoop 分布式文件系统` (`HDFS`)。`Hadoop` 由 `Doug Cutting` 和 `Mike
  Cafarella` 于 2005 年创建。


  #### MapReduce 算法


  `MapReduce` 由 Google 开发，并通过 2004 年的一篇论文发布，该论文描述了如何使用并行处理来处理大量数据。随后它被发布到公共领域，涉及一个两步批处理过程。

  首先，数据被分区并发送给映射器（mapper），映射器生成键值对。然后对这些键值对进行整理，使得每个键对应的值聚合在一起，之后归约器（reducer）处理这些键值对，为每个键计算一个值。

  一个经常被引用的例子是单词计数。它涉及扫描一份文稿并统计每个单词出现的次数。在这个例子中，每个单词是一个键，每个单词被使用的次数就是值。


  #### Hadoop 分布式文件系统 (HDFS)


  `HDFS` 是一个运行在商用服务器上的分布式文件系统。它基于 `Google 文件系统` (`GFS`)。它将文件分割成块并分布到集群的各个节点中。数据会被复制，这样即使一台服务器宕机，也不会丢失数据。数据是不可变的，这意味着表不能被编辑；它只能被写入一次，就像
  `CD-R` 一样，基于一次写入多次读取。新数据可以追加到现有文件中，或者可以删除旧文件并将新数据写入新文件中。`HDFS` 具有很强的可扩展性，可以通过添加更多服务器来处理更多数据。

  `HDFS` 的某些实现是仅追加的，这意味着底层表不可编辑。相反，写入操作会被记录日志，然后文件会被重新创建。


  #### Hadoop 的商业化实现


  `Hadoop` 是一个开源的 Apache 项目，但有几家公司开发了自己的商业化实现。由 `Doug Cutting` 和其他前雅虎员工创立的 `Hortonworks`
  是提供商业化实现的公司之一。其他此类公司包括 `Cloudera` 和 `MapR`。另一个 `Hadoop` 实现是微软的 `HD Insight`，它运行在
  `Azure` 云平台上。第 11 章中的一个示例展示了如何将 `HD Insight` 数据库导入到 `Power Query` 中。


  ### CAP 定理


  一种理解 NoSQL 数据库的学术方式包括 `CAP 定理`。`CAP` 是 Consistency（一致性）、Availability（可用性）和 Partition
  Tolerance（分区容错性）的首字母缩写。根据该定理，任何数据库只能同时具备其中两个属性。关系型数据库具备一致性和分区容错性。大型关系型数据库在可用性方面较弱，因为在数据量大时延迟较高。NoSQL
  数据库提供可用性和分区容错性，但在一致性方面较弱，因为缺乏固定的结构。


  ## NoSQL


  正如本书其他地方所述，`NoSQL` 这个称谓其实是个误称。它并不意味着“不使用 SQL”。对这种类型的数据库，一个更好的术语可能是非关系型。`NoSQL` 设计用于访问没有关系结构、几乎没有或根本没有模式的数据。早期的
  `NoSQL` 版本要求程序员编写自定义程序来检索数据。如今，越来越多的 `NoSQL` 数据库实现采用某种形式的 `SQL` 来检索数据。2015 年 5 月
  29 日，`Timothy Stephan` 在 Data Informed 上发表了一篇题为“NoSQL 最需要的就是 SQL”（ [`http://data-informed.com/what-nosql-needs-most-is-sql/`](http://data-informed.com/what-nosql-needs-most-is-sql/)
  ）的文章，主张为 `NoSQL` 数据库提供更多的 `SQL` 访问方式。

  `NoSQL` 适用于“网络规模”的数据，这类数据的特点是数据量大且拥有数百万并发用户。


  #### NoSQL 数据的特征


  `NoSQL` 数据库用于访问不适合关系型表的非关系型数据。通常，关系型数据库用于关键业务的事务数据。`NoSQL` 数据库则通常用于分析非关键业务数据，如日志文件。


  #### NoSQL 的实现


  `NoSQL` 数据库有几种分类：

  *   **键值存储**：这种类型的数据库以行存储数据，但不同行的模式可能不同。此类 NoSQL 数据库的例子有 `Couchbase`、`Redis` 和 `Riak`。

  *   **文档存储**：这种类型的数据库处理作为 `JSON` 对象的文档。每个文档都有属性和值。一些例子包括 `CouchDB`、`Cloudant` 和
  `MongoDB`。

  *   **宽列存储**：这种类型的数据库拥有列族，列族由键值对的单个列组成。此类数据库的例子有 `HBase` 和 `Cassandra`。

  *   **图数据库**：图数据库非常适合社交网络应用。它们拥有类似于表中行的节点。`Neo4j` 是此类数据库的一个例子。


  一种允许访问 Hadoop 数据的产品是 `Hive`，它提供了一种类似 `SQL` 的语言 `HiveQL` 来查询 Hadoop。另一种产品是 `Pig`，它使用
  `Pig Latin` 进行查询。有一种说法是，10 行 `Pig Latin` 代码可以完成 200 行 `Java` 代码的工作量。


  ### Spark


  另一个备受关注的技术是 `Apache Spark`——一个最初于 2009 年在 `UC Berkeley` 开发的开源集群计算框架。它使用一种内存技术，据称性能比
  Hadoop 快 100 倍。它提供用于查询的 `Spark SQL`。IBM 最近宣布将投入大量资源用于 `Spark` 的开发。


  ## 微软自助式 BI


  这些大数据和 NoSQL 技术大多源自处理海量数据的搜索引擎和在线零售商。对于处理数千行或数百万行数据的中小型组织来说，本书将展示如何利用微软在 `Excel`
  之上的 `Power BI` 功能。

  关于可以加载到 `PowerPivot` 中的最大行数，已有大量讨论。下面链接到 Microsoft Trends 的一篇博客文章，其中记录了加载 1.22 亿条记录的过程：[`www.microsofttrends.com/2014/02/09/how-much-data-can-powerpivot-really-manage-how-about-122-million-records`](http://www.microsofttrends.com/2014/02/09/how-much-data-can-powerpivot-really-manage-how-about-122-million-records)。


  ## 总结


  本章简要介绍了数据分析的演变历史，最终介绍到当今的大数据工具。它涵盖了数据结构的演变，从关系型数据库到 NoSQL 所处理的非结构化程度更高的数据。


