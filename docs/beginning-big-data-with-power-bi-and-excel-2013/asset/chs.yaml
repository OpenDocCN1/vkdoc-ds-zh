- '# 8. Power Query


  Microsoft Power Query for Excel 是一种数据发现工具，用于从各种源导入数据，包括来自 OData、Hadoop 和 Azure Marketplace
  等源的关联、半结构化和非结构化数据。它是一个自助式 ETL（导出、转换、加载）工具，用于提取、转换和加载数据。它比之前介绍的一些方法更强大。Microsoft
  会不断更新 Power Query，因此在本书出版时某些功能可能已发生变化。本章演示如何从 Web、表格格式、CSV 格式和 JSON 格式访问数据，然后使用
  Power Query 编辑器对数据进行整形，再导入 Excel。


  ## 安装 Power Query


  如果未显示 Power Query 选项卡，则需要安装它。对于 Excel 2010 和 2013，Power Query 可作为免费下载从 Microsoft
  获取。可以通过搜索“Power Query 下载”来访问下载链接。如果您安装了 32 位版本的 Excel，请务必安装 32 位版本；如果安装了 64 位版本，请安装
  64 位版本。安装后启用 Power Query 的步骤如下：


  1. 单击“文件”选项卡以查看 Backstage 视图。

  2. 单击左窗格底部的“选项”。

  3. 在左窗格中选择“加载项”。

  4. 在窗口底部，单击“管理”后的下拉箭头，选择“COM 加载项”，然后单击“转到”。

  5. 勾选“Microsoft Office PowerPivot for Excel 2013”、“Microsoft Power Map for Excel”和“Power
  View”，然后单击“确定”。


  安装完成后，Power Query 选项卡将可见。


  ## Power Query 功能区的主要选项


  本节将介绍 Power Query 功能区上最实用的选项，如图 8-1 所示。


  -   **来自 Web**：允许从特定网站提取表格

  -   **来自文件**：从 Excel、CSV、XML、文本文件或文件夹中的文件组导入

  -   **来自数据库**：从数据库导入，例如 SQL Server、Access、Oracle 和 MySQL

  -   **来自 Azure**：从 Azure 服务导入，例如 SQL Database、Market Place、HDInsight、Blob Storage
  和 Table Storage

  -   **来自其他源**：从包括 SharePoint 列表、OData 源、Hadoop (HDFS)、Facebook、Salesforce 对象和报表以及
  ODBC 的源导入

  -   **最近使用的源**：显示最近查询的源

  -   **来自表格的 Excel 数据**：从 Excel 电子表格导入一个区域

  -   **合并**：合并两个查询以添加列

  -   **追加**：将一个表追加到另一个结构相同的表

  -   **显示窗格**：切换屏幕右侧“工作簿查询”窗格的显示

  -   **数据源设置**：管理通过 Power Query 访问的数据源的设置

  -   **选项**：设置加载数据的选项

  -   **更新**：在线检查 Power Query 更新

  -   **数据目录搜索**：搜索精选的网站集并提取表格

  -   **我的数据目录查询**：允许与其他用户共享查询


  ![A978-1-4842-0529-7_8_Fig1_HTML.jpg](img/A978-1-4842-0529-7_8_Fig1_HTML.jpg)


  图 8-1. Power Query 功能区


  ## 使用查询编辑器


  Power Query 允许将数据子集导入查询编辑器，以便在将数据导入 Excel 或数据模型之前，通过删除不需要的行或列或创建计算列来对数据进行整形。查询编辑器中有三个选项卡：“开始”、“转换”和“添加列”。




  ### 查询编辑器主页功能区上的关键选项


  本部分介绍查询编辑器主页功能区上的关键选项，如图 8-2 所示。


  - `Close & Load`：关闭编辑器并将数据加载到 Excel 工作表或数据模型中

  - `Refresh Preview`：刷新查询，重新处理所有步骤，并预览结果

  - `Advanced Editor`：显示用于以 M 查询语言提取数据的代码

  - `Choose Columns`/`Remove Columns`：允许保留或删除选定的列。单击 `Choose Columns` 图标将显示一个列列表，可以取消勾选以删除，如图
  8-3 所示。


  ![A978-1-4842-0529-7_8_Fig3_HTML.jpg](img/A978-1-4842-0529-7_8_Fig3_HTML.jpg)


  图 8-3. 选择列对话框


  - `Keep Rows`/`Remove Rows`：允许保留或删除选定的行

  - `Remove Duplicates`：删除重复项。注意定义重复项的标准。例如，在按日期的股票价格列表中，如果仅根据股票代码删除重复项，则每只股票只会保留一个唯一行。

  - `Sort`：按升序或降序对列进行排序。请记住，查询编辑器仅处理数据子集。最好等到数据加载到工作表或数据模型后再进行排序。

  - `Split Column`：基于分隔符（如逗号或空格）拆分列

  - `Group By`：基于一个或多个字段对行进行分组


  ![A978-1-4842-0529-7_8_Fig2_HTML.jpg](img/A978-1-4842-0529-7_8_Fig2_HTML.jpg)


  图 8-2. 查询编辑器屏幕


  请注意，另一种删除或筛选行的方法是单击列标题右侧的箭头并取消选择相应的值，如图 8-2 所示。


  ## 一个简单的人口数据示例


  本示例将演示如何使用 `Data Catalog Search` 选项以表格形式检索人口数据以供分析。`Data Catalog Search` 选项搜索一个经过整理的数据目录，其中包含公共数据网站（如
  Wikipedia 和美国人口普查局网站）的信息，并允许轻松从这些网站中提取表格。它不是一个功能完备的搜索引擎。它似乎能理解以 “largest” 或 “most”
  等词开头的搜索。登录公司网络后，它也可以搜索公司数据库。对于本示例，请执行以下步骤。


  在 `Power Query` 选项卡上，单击 `Data Catalog Search`。在右侧的“搜索”窗格中，输入“most populated countries”。将鼠标指针悬停在结果上可预览数据。然后，将鼠标悬停在列表中来自
  Wikipedia 的“Secondary table—List of sovereign states and dependent territories by
  population density”条目上。结果如图 8-4 所示。注意底部的 `Load` 和 `Edit` 提示。


  ![A978-1-4842-0529-7_8_Fig4_HTML.jpg](img/A978-1-4842-0529-7_8_Fig4_HTML.jpg)


  图 8-4. 人口数据预览


  单击预览左下角的 `Edit`，将表中的数据子集加载到查询编辑器中，如图 8-5 所示。该表列出了各个国家及其以平方英里或平方公里为单位的面积，并显示了每平方英里或每平方公里的人口密度。


  ![A978-1-4842-0529-7_8_Fig5_HTML.jpg](img/A978-1-4842-0529-7_8_Fig5_HTML.jpg)


  图 8-5. 查询编辑器中的入口数据


  在查询编辑器中，可以通过删除行或列、拆分或合并列、或删除重复项来操控数据。例如，要删除以公里为单位的面积或密度列，请先单击要删除的第一列的标题，然后按住 Ctrl
  键并单击第二列的标题以选中这两列，如图 8-6 所示。


  ![A978-1-4842-0529-7_8_Fig6_HTML.jpg](img/A978-1-4842-0529-7_8_Fig6_HTML.jpg)


  图 8-6. 高亮显示要删除的列


  然后在选项卡的 `Remove Columns` 下单击 `Remove Columns`，以删除选定的列。将数据塑形为所需格式后，单击 `Close & Load`，将数据加载到
  Excel 电子表格中。


  ## 标普 500 指数表现


  本示例将演示如何检索标普 500 指数的表现数据，请执行以下步骤：


  在 `Power Query` 功能区上，单击 `Data Catalog Search`。在搜索框中，键入“S&P 500 performance”。将鼠标悬停在第一个链接上，该链接标记为“Total
  annual returns...”，如图 8-7 所示。


  ![A978-1-4842-0529-7_8_Fig7_HTML.jpg](img/A978-1-4842-0529-7_8_Fig7_HTML.jpg)


