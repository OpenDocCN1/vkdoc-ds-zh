  ## 引言


  本书面向任何具备 Excel 基础知识、希望通过分析和可视化数据来获取成果的读者。它侧重于理解数据的底层结构，以便使用最合适的工具进行分析。本书早期的暂定书名是《大众大数据》，意指这些工具能让希望利用
  Excel 技能分析大型数据集的普通用户，更轻松地使用商业智能（BI）。


  正如第 1 章所讨论的，大数据更多关乎数量和速度，而非内在复杂性。本书基于这样一个前提：许多中小型组织可以借助 Excel 和 Power BI 满足其大部分数据处理需求。本书演示了如何导入诸如
  `JSON`、`XML` 和 `HDFS` 这样的大数据文件格式，以及如何将较大的数据集过滤到数千或数百万行，而非数十亿行。


  本书首先展示如何将各种数据格式导入 Excel（第 2 章），以及如何使用数据透视表从单个表格中提取汇总数据（第 3 章）。第 5 章演示了如何在 Excel
  中使用结构化查询语言（SQL）。第 10 章简要介绍了 Excel 中的统计分析。


  本书主要介绍微软的自助式 BI 工具——Power BI，它包含以下 Excel 加载项：


  - **PowerPivot**。提供数据存储库（见第 4 章）和 `DAX` 公式语言（见第 7 章）。第 4 章提供了一个在多个表中处理数百万行数据的示例。

  - **Power View**。一个用于提取有意义的报告和创建仪表盘某些元素的报告工具（见第 6 章）

  - **Power Query**。一个用于从各种来源提取、转换和加载（ETL）数据的工具（见第 8 章）

  - **Power Map**。一个用于地图数据可视化的工具（见第 9 章）


  第 11 章演示了如何使用 `HDInsight`（微软在其 Azure 云平台上运行的 Hadoop 实现）将大数据导入 Excel。


  本书是为 Excel 2013 编写的，但书中的大部分示例，如果从微软下载了 `PowerPivot`、`Power View`、`Power Query` 和
  `Power Map` 加载项，同样适用于 Excel 2010。只需搜索下载即可找到相应加载项的下载链接。


