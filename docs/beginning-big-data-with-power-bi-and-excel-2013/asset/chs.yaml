  ## 推断统计


  抽样涉及检查一个大规模总体的一个小部分，以便对整个总体得出结论。这被称为**推断统计**。为了使样本能代表更大的总体，样本成员必须被随机选择，这意味着总体中的每个成员都有与其他成员相同的被选中的机会。其目标是从样本中得出关于总体的可靠结论。确定样本大小至关重要。样本的误差幅度计算公式为
  1 除以样本大小的平方根。因此，随着样本大小的增加，误差幅度会减少。


  通常，使用样本是因为调查整个总体在经济上不可行。大数据的承诺之一是，如果数据可用，可以对整个总体进行处理以获得更准确的结果。


  ## 描述性统计回顾


  描述性统计通过几个关键的计算值来总结数据。图 10-6 显示了一个正态分布曲线或钟形曲线。任何值出现的频率由曲线的高度表示。例如，如果在多次试验中抛硬币十次，正面朝上的平均次数将是五次。这是最常出现的结果，由曲线的最高点表示。其次最常见的结果是六次正面和四次反面，或六次反面和四次正面。很少会出现九次正面和一次反面。


  ![A978-1-4842-0529-7_10_Fig6_HTML.gif](img/A978-1-4842-0529-7_10_Fig6_HTML.gif)


  图 10-6：钟形曲线


  ### 计算描述性统计


  最常见的计算统计值是均值、中位数和众数。


  -   **均值**：平均值或称算术平均值，通过将所有值相加并除以值的数量来计算。

  -   **中位数**：中间值称为中位数——即有 50% 的值高于它、50% 的值低于它的数据点。

  -   **众数**：出现频率最高的值称为众数。在钟形曲线中，中位数、众数和均值是相等的。


  ### 离散程度的度量


  然而，许多分布并不完全符合钟形曲线，因此我们需要离散程度的度量。方差衡量一组数字的分散程度。小方差表示数据点往往非常接近均值，因此也彼此接近；而大方差则表示数据点在均值周围以及彼此之间非常分散。


  离散程度的一种度量是**标准差**，计算方法是计算每个值与算术平均值的偏差并将其平方。计算这些平方值的算术平均值，然后取其平方根即可得到标准差，标准差用希腊字母
  sigma 表示。


  68-95-99 规则用于记住正态分布中落在均值周围某个范围内的值的百分比。换句话说，68.27% 的值落在正负一个标准差的范围内；95.45% 的值落在正负两个标准差的范围内；99.73%
  的值落在正负三个标准差的范围内。这有时被称为**三西格玛经验法则**。请记住，此规则仅适用于正态分布。请注意图 10-6 中显示的与此规则相对应的百分比。


  例如，在对房屋价值的分析中，如果所有房屋销售都落在一个相当狭窄的范围内，例如 40 万到 60 万美元，那么方差和标准差会相对较小。然而，如果几套高端住宅以超过
  100 万美元的价格售出，方差和标准差就会更大。这就是本章剩余部分描述的图形化方法对于展示值之间关系的原因。


  ### Excel 统计函数


  Excel 提供了大量函数来计算统计值。以下是一些较常见的函数。


  -   `Average(range)`：计算数据范围或离散值列表的算术平均值。它忽略空单元格或包含文本的单元格。

  -   `Averagea(range)`：与 `Average` 相同，不同之处在于它将包含文本的单元格赋值为零。

  -   `Averageif(range, condition)`：基于用引号括起来的条件语句返回算术平均值。它在计算中不包含空单元格或包含文本的单元格。

  -   `Averageifs(range, condition1, condition2)`：基于多个条件语句返回算术平均值。它在计算中不包含空单元格或包含文本的单元格。

  -   `Median(range)`：计算中间值或中位数。

  -   `Mode(range)`：计算出现频率最高的值，不计算空单元格和包含文本的单元格。


  ## 图表化数据


  Excel 提供了多种以图形方式查看数据的方法。选择最佳的图形工具来准确描绘数据非常重要，如下所述。


  -   柱形图和条形图将一个分类变量绘制在一个轴上，将一个数值变量绘制在另一个轴上。

  -   XY 散点图展示了两个数值之间的关系。

  -   频率分布仅处理一个变量——它显示每个值有多少个实例。它将单个测量值分组到类或箱中。在其最常见的形式中，变量的值位于水平轴（x 轴）上，实例的频率位于垂直轴（y
  轴）上。

  -   直方图是数值数据分布的图形表示。


