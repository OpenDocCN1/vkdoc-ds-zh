  ## 引言\n\n本书面向任何具备 Excel 基础知识、希望通过分析和可视化数据来获得结果的人士。书中的重点在于理解数据的底层结构，以便使用最合适的工具进行分析。本书早期的暂定书名是《大众大数据》，意指这些工具使商业智能（BI）更容易被希望利用其\
  \ Excel 技能分析大型数据集的普通人所掌握。\n\n如第 1 章所述，大数据更多关乎数据量和速度，而非其固有的复杂性。本书基于这样一个前提：许多中小型组织可以使用\
  \ Excel 和 Power BI 满足其大部分数据需求。本书演示了如何导入 JSON、XML 和 HDFS 等大数据文件格式，以及如何将较大的数据集筛选至数千或数百万行，而非数十亿行。\n\
  \n本书首先演示如何将各种数据格式导入 Excel（第 2 章），以及如何使用数据透视表从单个表中提取汇总数据（第 3 章）。第 5 章演示了如何在 Excel\
  \ 中使用结构化查询语言（SQL）。第 10 章简要介绍了 Excel 中的统计分析。\n\n本书主要介绍 Power BI——微软的自助式 BI 工具——它包含以下\
  \ Excel 加载项：\n\n- **PowerPivot。** 提供数据存储库（参见第 4 章）和 DAX 公式语言（参见第 7 章）。第 4 章提供了一个在多个表中处理数百万行数据的示例。\n\
  - **Power View。** 一种用于提取有意义的报告并创建仪表板某些元素的报告工具（参见第 6 章）。\n- **Power Query。** 一种用于从各种来源提取、转换和加载（ETL）数据的工具（参见第\
  \ 8 章）。\n- **Power Map。** 一种用于数据可视化的地图工具（参见第 9 章）。\n\n第 11 章演示了如何使用 HDInsight（微软在\
  \ Azure 云平台上运行的 Hadoop 实现）将大数据导入 Excel。\n\n本书针对 Excel 2013 编写，但书中包含的大多数示例也适用于 Excel\
