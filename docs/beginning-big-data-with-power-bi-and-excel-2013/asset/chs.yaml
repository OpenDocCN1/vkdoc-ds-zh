- '# 6. 使用 Power View 设计报表


  Power View 是一种报表工具，可创建其自身类型的工作表。对于不精通 Excel 的用户而言，这是一种创建“沙盒”的方法，可以在不更改数据的情况下探索数据的子集。Power
  View 通过基于 PowerPivot 模型或数据透视表创建包含快速简便可视化效果的仪表板，来让数据变得生动。可以基于相同数据创建多个 Power View
  工作表。


  ## Power View 设计界面的元素


  Power View 界面包含以下元素，如图 6-1 所示：


  - 左侧的设计图面

  - 中间的筛选器区域，可以在此根据字段值筛选数据

  - **Power View 字段**窗格，在此选择要包含在报表中的字段。顶部包括所有可用字段，底部显示已选字段。


  ![A978-1-4842-0529-7_6_Fig1_HTML.jpg](img/A978-1-4842-0529-7_6_Fig1_HTML.jpg)


  **图 6-1。**


  Power View 设计图面。


  ## 使用 Power View 时的注意事项


  始终从表视图开始，然后基于该表创建图表。可以向设计图面添加多个表和/或图表。只需单击空白区域即可添加新图表。


  仅在设计图面上包含报表所必需的字段。一般来说，除非与报表相关，否则最好不要包含用于关联表的主键值。


  ## 字段类型


  通常有两种处理方式截然不同的字段类型：


  - 非数值的分类或描述性字段

  - 可包含计算字段或度量的数值字段。求和符号 (Σ) 用于指示可更改其聚合类型的数值字段。


  ## 理解数据的汇总方式


  使用 Power View 时，最棘手的部分可能在于理解数据的汇总方式。默认情况下，数值字段会被求和，即使这些字段（如 ID 号或年份）的求和毫无意义也是如此。聚合类型可以通过单击
  **Power View 字段**窗格下半部分中字段名称后的向下箭头轻松更改。聚合选项如下：


  - 不汇总

  - 求和

  - 平均值

  - 最小值

  - 最大值

  - 计数（非空）

  - 计数（非重复）


  请注意，要绘制图表，必须使用上述数学函数之一对字段进行汇总。




