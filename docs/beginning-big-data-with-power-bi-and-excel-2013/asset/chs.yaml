  ## 散点图


  通过绘制散点图并让程序计算`R-squared`值，可以直观地观察两个变量之间的关系。`R-squared`是一种统计指标，用于衡量数据点与拟合回归线（即穿过数据点的最佳拟合直线）的接近程度，也称为决定系数。其取值范围为
  0 到 100。若`R-squared`值为 100，则表示一个变量的所有变动完全由另一个变量的变动所解释。`X`为自变量，`y`为因变量。


