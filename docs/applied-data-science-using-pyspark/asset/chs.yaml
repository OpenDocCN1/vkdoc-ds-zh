  \ `a (x[1],y[1],z[1])` 和 `b (x[2],y[2],z[2])` 之间的距离：\n\n`Distance[ab]=√(x1- x2)²\
  \ +(y1- y2)²+(z1- z2)²`\n\n还存在其他形式的距离度量，例如曼哈顿距离和切比雪夫距离。为了便于理解，请参考图 7-2。\n\n![](img/500182_2_En_7_Fig2_HTML.jpg)\n\
  \n**图 7-2**  \n距离度量\n\n点 `A` 和 `C` 之间的欧几里得距离是 5。你可以通过应用公式进行交叉验证。点 `A` 和 `C` 之间的曼哈顿距离计算为\
  \ `(A,B)` 和 `(B,C)` 之间距离的城市街区总和。由于其布局，它也被称为出租车几何，对于图 7-2，它被计算为笛卡尔坐标的绝对差。\n\n`曼哈顿距离\
  \ = |(x2 – x1)| + |(y2-y1)|`\n\n`曼哈顿距离 = |(4–1)| + |(5-1)|`\n\n`曼哈顿距离 = 7`\n\n向量空间中的切比雪夫距离是两个向量之间的距离，是它们沿任何坐标维度的差值的最大值。对于图\
  \ 7-2，可以使用以下公式计算：\n\n`切比雪夫距离 = max [(x2 – x1), (y2-y1)]`\n\n`切比雪夫距离 = max [(4 –\
  \ 1), (5-1)]`\n\n`切比雪夫距离 = 4`\n\n这种策略对于数值变量效果很好，但是如何将此技术应用于分类变量呢？假设你有一个名为“过去 5 年内是否有过购买”的变量，其值为是/否。你如何使用这个变量？请记住，我们在前面章节中介绍过独热编码。你可以使用独热编码将此分类变量（是/否）转换为数值变量。最终你会得到两个变量：一个代表“是”，另一个代表“否”。在实践中，你可能只需要一个变量，因为第二个变量可能与第一个变量完全共线。\n\
  \n如果你仔细观察数据，你会发现之前的变量范围是 1 到 10，而现在的新变量“过去 5 年内是否有过购买”的范围是 0 到 1。将这些变量组合在一起会导致偏差，因为当你计算距离时，新变量的影响可以忽略不计。你如何处理这种情况？是的，你可以使用归一化。*归一化*是一种缩放技术，可以将现有数据重新缩放到\
  \ [0,1] 的范围内。它使用以下公式计算：\n\n`X[normalized] = (X-X[min]) / (X[max] -X[min])`\n\n这是分割中广泛使用的技术。但要小心，因为你可能会丢失关于异常值的信息。\n\
  \n另一种广泛使用的缩放技术是*标准化*。不要将标准化与归一化混淆。在标准化中，你将数据重新缩放，使其均值为 0，标准差为 1。它使用以下公式计算：\n\n`X[standardized]\
  \ = X- X[mean] / X[standard_deviation]`\n\n\n\n"
- '# 使用杰卡德系数与汉明距离处理分类数据


  有时你可能会遇到只有分类数据的情况。是否存在比独热编码和欧氏距离更好的技术？答案是肯定的：杰卡德系数和汉明距离。我们在此重点介绍杰卡德系数，它涉及从数据中计算相异度矩阵。


  例如，在处理二元属性时，你可以创建一个列联表，其中 `a` 表示项目 `x` 和 `y` 中同时为 1 的特征数量；`b` 表示项目 `x` 中为 1 但项目
  `y` 中为 0 的特征数量；`c` 表示项目 `x` 中为 0 但项目 `y` 中为 1 的特征数量；`d` 表示项目 `x` 和 `y` 中同时为 0 的特征数量。特征总数为
  `z`，即 `z = a + b + c + d`（见表 7-5）。


  **表 7-5** 列联表


  | x | y |   |   |

  |---|---|---|---|

  |   | 1 | 0 | 合计 |

  | 1 | a | b | a+b |

  | 0 | c | d | c+d |

  | 合计 | a+c | b+d | z = (a+b+c+d) |


  你需要了解几个术语来计算相异度。


  - **对称二元变量** – 变量的两个层级具有相同权重。例如，硬币的正面和反面。

  - **非对称二元变量** – 两个层级的权重不同。例如，在医学检测结果中，阳性结果可能比阴性结果具有更高的权重。


  根据二元变量的类型，相异度的计算方式会有所不同。对称二元相异度可使用以下公式计算：


  `d(x,y) = (b + c) / (a + b + c + d)`


  非对称二元相异度可使用以下公式计算：


  `d(x,y) = (b + c) / (a + b + c)`


  请注意，在上述公式中，分母中忽略了 `d`；这是因为阴性结果的重要性很低甚至无关紧要。使用这种相异度度量，你可以通过以下公式计算 `x` 和 `y` 之间的相似距离：


  `相似度(x, y) = 1 – d(x, y)`


  `相似度(x, y) = 1 – ((b + c) / (a + b + c))`


  `相似度(x, y) = c / (a + b + c)`


  这种相似度度量被称为**杰卡德距离**。它可用于确定二元变量之间的相似度。但名义变量该如何处理呢？一种变通方法是将名义变量重新编码为多个二元变量。另一种技术是使用简单匹配系数，其计算公式如下：


  `简单匹配系数 = 匹配属性数量 / 属性总数`


  对于二元变量而言，该系数与对称二元相异度类似。上述系数给出了相异度指数。相似距离则通过用 1 减去该系数来计算：


  `简单匹配距离 = 1 - 简单匹配系数`


  现在我们沿用欧氏距离的示例来演示杰卡德距离。假设一家汽车经销商成功与三位车主达成交易，这三位车主拥有三辆不同品牌和型号的汽车。该经销商希望根据性能对这些车主的汽车进行分类。他们对这些汽车进行了不同的测试，以确定当前性能的相似度。未通过的测试用
  `Y` 表示，通过的测试用 `N` 表示。为方便起见，我们在此将它们分别转换为 1 和 0（见表 7-6）。


  **表 7-6** 杰卡德距离演示


  |       | 气候测试 | 机械测试 | 压力脉冲测试 | 排放台架测试 | 催化剂老化测试 | SHED 测试 |

  |-------|----------|------------|------------------|-----------------|-----------|------|

  | 汽车 1 | 1        | 0          | 1                | 0               | 0         |
  0    |

  | 汽车 2 | 1        | 0          | 1                | 0               | 1         |
  0    |

  | 汽车 3 | 1        | 1          | 0                | 0               | 0         |
  0    |


  你可以使用以下公式计算汽车之间的相异度：


  `d(汽车 1, 汽车 2) = 1 + 0 / (2 + 1 + 0)`


  `d(汽车 1, 汽车 2) = 0.33`


  这些数字是如何得出的？通过使用列联表，我们统计了表 7-6 中 `b` 和 `c` 的数量。对于汽车 1 和汽车 2，催化剂老化测试对应 `b`。这里没有 `c`
  值。同时请注意，这是非对称二元相似度，因此分母中不考虑 `d` 的值。从气候测试和压力脉冲测试中，我们知道 `a` 的计数为 2。要计算相似度，你需要用 1 减去这个指数：


  `相似度(汽车 1, 汽车 2) = 1 - 0.33`


  `相似度(汽车 1, 汽车 2) = 0.67`


  类似地，你可以计算其他观测值之间的差异，并创建一个相似度矩阵。




  ### 聚类类型


  广义上，聚类可分为层次聚类和非层次聚类方法。本节重点阐述这些聚类类型之间的差异，以及每种聚类类型可用的算法。顾名思义，层次聚类试图在其求解过程中构建一个聚类的层次结构。层次聚类进一步分为凝聚式聚类和分裂式聚类（见图
  7-3）。


  ![](img/500182_2_En_7_Fig3_HTML.png)


  **图 7-3** 层次聚类的类型


  - **凝聚式聚类：** 在此类聚类中，每个观测值最初自成一类，然后逐步向上合并，最终形成一个单一的聚类。这种方法也被称为*自底向上聚类*。

  - **分裂式聚类：** 在此类聚类中，所有观测值最初属于一个单一的聚类，然后在每次迭代中递归地分裂成更小的聚类。这种方法也被称为*自顶向下聚类*。


  图 7-3 以图形方式描绘了这两种方法。我们使用选自表 7-1 的数据来演示凝聚式聚类的例子。我们还计算了所有这些点的欧几里得距离（见表 7-8）。所有成对距离都列在表
  7-7 中。


  **表 7-8** 选定受访者的欧几里得距离


  |   | **1** | **2** | **6** | **7** | **11** | **12** |

  |---|-------|-------|-------|-------|--------|--------|

  | 1 | 0.00  | 1.41  | 9.00  | 8.56  | 9.00   | 8.56   |

  | 2 | 1.41  | 0.00  | 8.06  | 7.50  | 8.06   | 7.50   |

  | 6 | 9.00  | 8.06  | 0.00  | 1.12  | 12.73  | 11.67  |

  | 7 | 8.56  | 7.50  | 1.12  | 0.00  | 11.67  | 10.67  |

  | 11| 9.00  | 8.06  | 12.73 | 11.67 | 0.00   | 1.12   |

  | 12| 8.56  | 7.50  | 11.67 | 10.61 | 1.12   | 0.00   |


  **表 7-7** 凝聚式聚类示例


  | **受访者** | **安全性** | **燃油效率** |

  |----------------|------------|---------------------|

  | 1              | 10         | 10                  |

  | 2              | 9          | 9                   |

  | 6              | 10         | 1                   |

  | 7              | 9          | 1.5                 |

  | 11             | 1          | 10                  |

  | 12             | 1.5        | 9                   |


  请注意，这是一个对称矩阵；你可以使用其中一半来确定你的聚类。当你开始进行凝聚式聚类时，所有数据点都各自独立成类。根据上述数据，这里两个受访者之间观察到的最小距离是
  1.12，对应 (6,7) 和 (11,12)。这里出现了平局，那么算法将如何决定哪些对应该合并呢？存在内置规则来打破这种平局，我们假设它任意选择了 (6,7)。在第一步中，你会将它们聚类在一起，然后计算整体的异质性度量，这里等于
  1.12。请注意，当你开始聚类时，异质性度量为 0，因为所有数据点都在它们各自的独立类中。一旦你将 6 和 7 合并，下一个被合并的对是 (11,12)。异质性度量保持不变，因为这些点之间的成对距离仍然是
  1.12。在下一步中，(1,2) 将被合并在一起，因为它们具有最小的成对距离 1.41。现在平均异质性将上升到 1.21。这是通过计算 (1.12+1.12+1.41)/3
  得到的。重复这些步骤，直到所有观测值都落入一个单一的聚类中。


  你可能会想，如何选择正确的聚类数量呢？一种识别方法是确定异质性度量中的突变/波动。图 7-4 直观地展示了算法的工作原理。表 7-9 显示了这些步骤。


  **表 7-9** 聚类步骤


  | **步骤** | **聚类**                    | **异质性** |

  |----------|-----------------------------|-------------------|

  | 0        | 1 2 6 7 11 12               | 0                 |

  | 1        | 1 2 (**6 7**) 11 12         | 1.12              |

  | 2        | 1 2 (**6 7**) (**11 12**)   | 1.12              |

  | 3        | (**1 2**) (**6 7**) (**11 12**) | 1.21              |

  | 4        | (**1 2 6 7**) (11 12)       | 3.84              |

  | 5        | (**1 2 6 7 11 12**)         | 5.04              |


  ![](img/500182_2_En_7_Fig4_HTML.png)


  **图 7-4** *树状图：基于单链路的层次聚类。展示了质心和欧几里得距离*


  观察上述异质性度量，你可以看到从步骤 3 到步骤 4 以及从步骤 4 到步骤 5 的度量存在突变。这里可以得出两种可能的解决方案，即三聚类或四聚类解决方案。


  我们在这里使用的方法称为*单链路*。它在确定聚类度量和异质性时考虑最近邻。其他可用于考察相似性的方法包括：


  ![](img/500182_2_En_7_Fig5_HTML.png)


  **图 7-5** 树状图：基于全链路的层次聚类。展示了质心和欧几里得距离


  - **全链路：** 此方法使用聚类之间的最大距离来确定聚类距离，而不是使用最小距离。图 7-5 展示了聚类属性和距离如何变化。


  ![](img/500182_2_En_7_Fig6_HTML.png)


  **图 7-6** 树状图：基于平均链路的层次聚类。展示了质心和欧几里得距离


  - **平均链路：** 此方法使用聚类之间的成对平均距离来确定聚类距离。图 7-6 展示了聚类距离如何变化。

  - **质心链路：** 此方法在迭代步骤中使用聚类中心之间的距离来确定聚类距离。

  - **沃德法：** 此方法基于方差。它基于最小化聚类内观测值之间的聚类方差，并最大化跨聚类的聚类方差的原则。


  尽管层次聚类具有无需预先选择初始聚类数量的优势，但它是一种实现起来较为复杂的算法，尤其是在大数据环境下。它的时间和空间复杂度为 `O(n²log(n))`，其中
  `n` 是观测值的数量。这可能会减慢运算速度。从好的方面来看，它可以解释观测值是如何分组的。




  ### 二分 K 均值算法


  `BisectingKMeans` 是一种混合方法，结合了层次分裂聚类和非层次聚类的特点。我们将在下一节介绍`k-means`，这是一种较为流行的非层次聚类技术。`BisectingKMeans`
  在预先设定聚类数量方面与 `k-means` 类似。你可能会想，在没有任何数据先验知识的情况下，如何设定聚类数量。你可以使用之前介绍过的技术，例如异质性度量，以及其他距离度量方法，通过运行算法若干次迭代来确定聚类。


  让我们从理论上看看 `BisectingKMeans` 算法是如何工作的。由于这是一种分裂算法，它从顶部的单个聚类开始，然后迭代地划分数据。首先，你需要设定所需的聚类数量。


  开始时，所有数据都存在于一个聚类中（见图 7-7）。我们将数据分成两个聚类（见图 7-8）。


  ![](img/500182_2_En_7_Fig8_HTML.png)


  图 7-8


  步骤 2：二分 k-means


  ![](img/500182_2_En_7_Fig7_HTML.png)


  图 7-7


  步骤 1：二分 k-means


  前两个聚类是使用 `k-means` 划分的。随着聚类的分裂，会计算每个聚类的质心。然后，计算所有点与质心之间距离的平方和。这被称为距离/误差平方和（`SSE`）。`SSE`
  越高，聚类的异质性越大。在下一步中，我们选择所有聚类中 `SSE` 最高的那个，并将其分成两个聚类（见图 7-9）。


  ![](img/500182_2_En_7_Fig9_HTML.png)


  图 7-9


  步骤 3：二分 k-means


  在下一步中，我们查看这三个聚类的 `SSE`，并选择 `SSE` 最高的那个进行二分。我们重复这个过程，直到达到所需的聚类数量。该过程的低计算时间是相对于其他过程的一大优势。`BisectingKMeans`
  还能生成大小相似的聚类，这与 `k-means` 不同，后者的聚类大小差异很大。


  截至 3.0 版本，PySpark 尚未实现凝聚层次聚类。有一种使用 `BisectingKMeans` 函数的分裂层次聚类方法（自上而下）。为了演示，我们使用来自
  Kaggle 的信用卡数据（[`https://www.kaggle.com/arjunbhasin2013/ccdata`](https://www.kaggle.com/arjunbhasin2013/ccdata)）（见表
  7-10）。


  表 7-10


  信用卡数据集的元数据信息


  | **列名** | **定义** |

  | --- | --- |

  | `custid` | 信用卡持有者标识（分类变量） |

  | `balance` | 账户中可用于购物的余额 |

  | `balancefrequency` | 余额更新的频率；得分介于 0 和 1 之间（1 = 频繁更新，0 = 不频繁更新） |

  | `purchases` | 从账户进行的购买金额 |

  | `oneoffpurchases` | 单次最大购买金额 |

  | `installmentspurchases` | 分期付款的购买金额 |

  | `cashadvance` | 用户获得的预借现金金额 |

  | `purchasesfrequency` | 购买发生的频率；得分介于 0 和 1 之间（1 = 频繁购买，0 = 不频繁购买） |

  | `oneoffpurchasesfrequency` | 单次购买发生的频率（1 = 频繁购买，0 = 不频繁购买） |

  | `purchasesinstallmentsfrequency` | 分期购买发生的频率（1 = 频繁发生，0 = 不频繁发生） |

