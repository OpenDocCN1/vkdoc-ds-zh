  \ = \"y\"\nfrom pyspark.sql import functions as F\ndf = spark.read.csv(filename,\
  \ header=True, inferSchema=True, sep=';')\ndf = df.withColumn('label', F.when(F.col(\"\
  y\") == 'yes', 1).otherwise(0))\ndf = df.drop('y')\ntrain, test = df.randomSplit([0.7,\
  \ 0.3], seed=12345)\nfor k, v in df.dtypes:\nif v not in ['string']:\nprint(k)\n\
  df = df.select(['age', 'balance', 'day', 'duration', 'campaign', 'pdays', 'previous',\
  \ 'label'])\nfrom pyspark.ml.feature import VectorAssembler\nfrom pyspark.ml import\
  \ Pipeline\n"
- '# 将各个列组合成一个列 - ''features''

  def assemble_vectors(df, features_list, target_variable_name):

  stages = []

  #组合向量

  assembler = VectorAssembler(inputCols=features_list, outputCol=''features'')

  stages = [assembler]

  #选择所有列 + 目标变量 + 新创建的 ''features'' 列

  selectedCols = [target_variable_name, ''features'']

  #使用流水线按顺序处理

  pipeline = Pipeline(stages=stages)

  #组合器模型

  assembleModel = pipeline.fit(df)

  #在数据上应用组合器模型

  df = assembleModel.transform(df).select(selectedCols)

  return df

  #排除目标变量并选择所有其他特征向量

  features_list = df.columns

  #features_list = char_vars #此选项仅用于 ChiSqselector

  features_list.remove(''label'')

  '
- '# 在我们的数据框上应用该函数

  assembled_test_df = assemble_vectors(test, features_list, ''label'')

  print(sys.argv[1])

  '
- '# 来自参数的模型信息

  model_uri=sys.argv[1]

  print("model_uri:", model_uri)

  '
- '# 从 MLflow 加载 Spark ML 模型

  model = mlflow.spark.load_model(model_uri)

  print("model.type:", type(model))

  predictions = model.transform(assembled_test_df)

  print("predictions.type:", type(predictions))

  predictions.printSchema()

  df = predictions.select(''rawPrediction'',''probability'', ''label'', ''features'')

  df.show(5, False)

  ```


