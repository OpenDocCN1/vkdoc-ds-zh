  \ 先生，他是一位出色的导师和支持者。感谢所有在这段旅程中支持我的朋友和家人。\n\n> ——Ramcharan Kakarla\n\n### 关于作者\n\n\
  ### 关于技术审校者\n\n\n\n### 安装 Anaconda\n\n第一步是在 [`https://www.anaconda.com/download`](https://www.anaconda.com/download)\
  \ 下载 Anaconda。你可以免费下载个人版。我们建议使用最新版本的 Python（Python 3.11），因为我们在所有示例中都使用这个版本。如果你安装了其他版本，请相应调整你的代码。安装\
  \ Anaconda 后，你可以在终端/Anaconda 提示符下执行以下命令，以确认安装已成功完成。\n\n**注意：** Windows 用户应使用 Anaconda\
  \ 提示符，而不是命令提示符。安装 Anaconda 后，此选项将可用。\n\n```\nconda info\n```\n\n输出应如下所示。\n\n*终端/Anaconda\
  \ 提示符中显示的输出*\n\n```\n(base) sundar@Sundars-MacBook-Pro / % conda info\nactive environment\
  \ : base\nactive env location : /Users/sundar/anaconda3\nshell level : 1\nuser config\
  \ file : /Users/sundar/.condarc\npopulated config files : /Users/sundar/.condarc\n\
  conda version : 23.7.4\nconda-build version : 3.26.1\npython version : 3.11.5.final.0\n\
  virtual packages : __archspec=1=x86_64\n__osx=10.16=0\n__unix=0=0\nbase environment\
  \ : /Users/sundar/anaconda3  (writable)\nconda av data dir : /Users/sundar/anaconda3/etc/conda\n\
  conda av metadata url : None\nchannel URLs : https://repo.anaconda.com/pkgs/main/osx-64\n\
  https://repo.anaconda.com/pkgs/main/noarch\nhttps://repo.anaconda.com/pkgs/r/osx-64\n\
  https://repo.anaconda.com/pkgs/r/noarch\npackage cache : /Users/sundar/anaconda3/pkgs\n\
  /Users/sundar/.conda/pkgs\nenvs directories : /Users/sundar/anaconda3/envs\n/Users/sundar/.conda/envs\n\
  platform : osx-64\nuser-agent : conda/23.7.4 requests/2.31.0 CPython/3.11.5 Darwin/21.6.0\
  \ OSX/10.16 aau/0.4.2 c/1VatYgfffAMMKXQOgPBo-Q s/nX_yel1PDom6K2c64Czdcg e/u9Ki7wvzxHtwkihYPDu5wA\n\
  UID:GID : 501:20\nnetrc file : /Users/sundar/.netrc\noffline mode : False\n```\n\
  \n**注意：** 每个 `conda` 操作都以关键字 `conda` 开头。有关 `conda` 操作的更多信息，请在网络上搜索“Conda cheat sheet”，并遵循此处提供的文档：[`https://docs.conda.io/`](https://docs.conda.io/)。\n\
  \n### 创建 Conda 环境\n\n通常，编程语言有各种版本。当你在特定版本上创建程序并尝试在另一个版本上运行它时，成功执行的可能性取决于两个版本之间的差异。这可能是一种具有挑战性的体验。由于依赖关系，在旧版本上开发的程序可能会在新版本上出错。这就是虚拟环境发挥作用的地方。这些环境将依赖关系隔离到独立的沙箱中，从而更容易在相应的环境中运行程序或应用程序。Anaconda\
  \ 工具是一个开源平台，你可以在其中管理和运行你的 Python 程序和环境。你可以创建多个具有不同版本的环境，并根据需要在环境之间切换。在执行任何程序或应用程序之前，确定你当前所处的环境是一个好习惯。\n\
  \n我们重点关注 `conda` 速查表中用于创建环境的特定命令。语法如下：\n\n```\nconda create -–name ENVNAME python=3.11\n\
  ```\n\n在创建环境之前，使用另一个 Conda 命令列出你现有的环境。\n\n```\nconda env list\n```\n\n运行此命令后，你将获得以下输出。\n\
  \n*创建前的环境列表：*\n\n```\n# conda environments:\n#\nbase                  *  /Users/sundar/anaconda3\n\
  ```\n\n`base` 环境在 Anaconda 中默认存在。`base` 是活动环境，由其右侧的小星号 `*` 符号表示。这意味着你执行的任何 `conda`\
  \ 操作（`install`、`update` 或 `removal`）都将在默认的 `base` 环境中进行。\n\n现在你了解了 `base` 环境是什么，你可以创建自己的\
  \ PySpark 环境。在此示例中，我们将 `ENVNAME` 替换为我们想要调用的环境名称（`pyspark_env`）。\n\n```\nconda create\
  \ --name pyspark_env python=3.11\n```\n\n当提示用户输入时，键入 `y` 并按 Enter。最好手动键入此代码，而不是从文本中复制，因为缺少连字符可能会产生错误，例如\
  \ `\"CondaValueError: The target prefix is the base prefix. Aborting\"` 或 `\"conda:\
  \ error: unrecognized arguments: -–name.\"` 执行命令后，再次执行 `conda` 环境列表。这次，你会得到一个略有不同的输出。\n\
  \n*创建后的 Conda 环境*\n\n```\n# conda environments:\n#\nbase                  *  /Users/sundar/anaconda3\n\
  pyspark_env              /Users/sundar/anaconda3/envs/pyspark_env\n```\n\n请注意，已创建一个名为\
  \ `pyspark_env` 的新环境。但是，`base` 仍然是活动环境。你可以使用以下命令激活新环境 `pyspark_env`。\n\n*更改后的 Conda\
  \ 环境*\n\n```\nconda activate pyspark_env\n# conda environments:\n#\nbase       \
  \              /Users/sundar/anaconda3\npyspark_env           *  /Users/sundar/anaconda3/envs/pyspark_env\n\
  ```\n\n请注意，`*` 表示当前环境。从现在开始，所有 `conda` 操作都将在新的 PySpark 环境中执行。下一节将介绍 Spark 的安装过程。\n\
  \n### 下载并解压 Apache Spark\n\n你可以在 [`https://spark.apache.org/downloads.html`](https://spark.apache.org/downloads.html)\
  \ 下载最新版本的 Apache Spark。本书使用 Spark 3.5.0。（本书中的特定示例可能使用其他 Spark 版本，但大多数用例都在 Spark\
  \ 3.5.0 中展示。）访问该网站后，你可以选择一个 Spark 版本并下载相应的文件（参见图 1-1）。\n\n![图 1-1 Spark 下载](img/500182_2_En_1_Fig1_HTML.jpg)\n\
  \n解压文件；你也可以选择将其移动到一个特定文件夹。\n\n*Mac/Linux 用户*\n\n```\ntar -xzf spark-3.5.0-bin-hadoop3.tgz\n\
  mv spark-3.5.0-bin-hadoop3 /opt/spark-3.5.0\n```\n\n*Windows 用户*\n\n```\ntar -xzf\
  \ spark-3.5.0-bin-hadoop3.tgz\nmove spark-3.5.0-bin-hadoop3 C:\\Users\\\\spark-3.5.0\n\
  ```\n\n### 安装 Java 8 或更高版本\n\n你可以通过在终端/Anaconda 提示符下键入以下内容来检查系统中现有的 Java 版本：\n\n\
  ```\njava -version\njava version \"21.0.2\" 2024-01-16 LTS\nJava(TM) SE Runtime\
  \ Environment (build 21.0.2+13-LTS-58)\nJava HotSpot(TM) 64-Bit Server VM (build\
  \ 21.0.2+13-LTS-58, mixed mode, sharing)\n```\n\n最好使用 Java 8 或更高版本。你始终可以在 [`https://www.oracle.com/java/technologies/javase-downloads.html`](https://www.oracle.com/java/technologies/javase-downloads.html)\
  \ 下载最新版本。建议使用 Java 8 JDK。当你使用高于 8 的 Java 版本时，启动 PySpark 时可能会收到警告。但是，可以忽略这些警告。\n\n\
  Mac/Linux 用户可以继续下一节，Windows 用户可以继续名为“Windows 用户”的章节。\n\n### Mac 和 Linux 用户\n\n假设你已经完成了\
  \ Spark 下载，现在必须更新 `~/.bash_profile` 或 `~/.bashrc` 文件，以便找到 Spark 安装位置。此示例使用 `bash_profile`\
  \ 文件。在终端中，键入以下代码以打开文件：\n\n```\nvi ~/.bash_profile\n```\n\n文件打开后，键入 `i` 以插入内容。添加以下行来设置环境变量：\n\
  \n```\nexport SPARK_HOME=/opt/spark-3.5.0\nexport PATH=$SPARK_HOME/bin:$PATH\nexport\
  \ PYSPARK_PYTHON=python3\n```\n\n添加这些配置后，按 ESC，键入 `:wq!`，然后按 Enter 保存文件。要将这些更改应用到\
  \ `pyspark_env` 环境中，请在终端中运行以下命令：\n\n```\nsource ~/.bash_profile\n```\n\n当你重新启动系统时，将\
  \ `conda` 环境更改为 `pyspark_env` 以运行 PySpark。\n\n\n\n### Windows 用户\n\n假设您已完成 Spark\
  \ 下载，还需执行一些操作以确保 PySpark 安装按预期工作。由于您运行了 `move` 选项，您的 Spark 文件夹应位于此处提供的路径中：\n\n```\n\
  C:\\Users\\username\\spark-3.5.0\n```\n\n通过 Anaconda 提示符导航到此路径并运行以下代码：\n\n```\n\
  cd C:\\Users\\username\\spark-3.5.0\nmkdir hadoop\\bin\n```\n\n目录创建完成后，您必须下载 `winutils.exe`\
  \ 文件并将其添加到 Spark 安装中。如果没有 `winutils.exe` 文件，当您调用 PySpark 时，可能会遇到以下错误：\n\n```\n\"\
  ERROR Shell: Failed to locate the winutils binary in the hadoop binary path.....\"\
  \n```\n\n此外，将来尝试使用 `spark-submit` 工具时也可能出现错误。要解决这些错误，请从 [`https://github.com/cdarlint/winutils`](https://github.com/cdarlint/winutils)\
  \ 下载 `winutils.exe` 文件。根据您安装的 Hadoop 版本，您可能需要在此链接中选择合适的路径。导航到路径内的 `bin` 文件夹，点击 `winutils.exe`\
  \ 下载文件（见图 1-2）。\n\n![](img/500182_2_En_1_Fig2_HTML.jpg)\n\n图 1-2\n\nWinutils.exe\n\
  \n使用 Hadoop 3.3 版本的读者可以直接从此链接下载 `winutils.exe` 文件：[`https://github.com/cdarlint/winutils/blob/master/hadoop-3.3.5/bin/winutils.exe`](https://github.com/cdarlint/winutils/blob/master/hadoop-3.3.5/bin/winutils.exe)。将下载的文件放入您之前创建的\
  \ `hadoop\\bin` 路径中。或者，您也可以使用以下命令执行相同操作：\n\n```\nmove C:\\Users\\username\\Downloads\\\
  winutils.exe C:\\Users\\username\\spark-3.5.0\\hadoop\\bin\n```\n\n就是这样。您已基本完成。最后一步是配置环境变量。您可以在\
  \ Windows 中搜索“环境变量”，或通过选择系统属性 ➤ 高级 ➤ 环境变量来找到它们。在此示例中，我们在用户变量选项卡中添加几个变量。点击“新建”以查看图\
  \ 1-3 中所示的选项。\n\n![](img/500182_2_En_1_Fig3_HTML.jpg)\n\n图 1-3\n\n添加新的用户变量\n\n您需要添加三项内容：`SPARK_HOME`、`HADOOP_HOME`\
  \ 和 `PATH`。\n\n*SPARK_HOME*\n\n```\n变量名 – SPARK_HOME\n变量值 – C:\\Users\\username\\\
  spark-3.5.0\n```\n\n*HADOOP_HOME*\n\n```\n变量名 – HADOOP_HOME\n变量值 – C:\\Users\\username\\\
  spark-3.5.0\\hadoop\n```\n\n当用户变量选项卡中已存在 `PATH` 变量时，点击“编辑”并添加以下内容：\n\n```\nC:\\\
  Users\\username\\spark-3.5.0\\bin\n```\n\n就这样。您现在可以运行 PySpark 了。有时，根据 Spark 版本的不同，您可能需要添加另外两个环境变量——`SPARK_LOCAL_HOSTNAME`\
  \ 和 `JAVA_HOME`。这两个变量的设置如下：\n\n*SPARK_LOCAL_HOSTNAME*\n\n```\n变量名 – SPARK_LOCAL_HOSTNAME\n\
  变量值 – localhost\n```\n\n*JAVA_HOME*\n\n```\n变量名 – JAVA_HOME\n变量值 – C:\\Program Files\\\
  Java\\(您的 JDK 版本目录)\n```\n\n要应用所有这些环境更改，请重新启动 Anaconda 提示符，并将 `conda` 环境更改为 `pyspark_env`。\n\
  \n### 运行 PySpark\n\n现在一切就绪。在调用 `pyspark` 之前，您需要确保 `conda` 环境已设置为 `pyspark_env`。只需在终端/Anaconda\
  \ 提示符中调用 `pyspark`。您应该会看到以下弹出窗口。\n\n*在终端/Anaconda 提示符中运行 PySpark*\n\n```\nPython\
  \ 3.11.7 (main, Dec 15 2023, 12:09:04) [Clang 14.0.6 ] on darwin\nType \"help\"\
  , \"copyright\", \"credits\" or \"license\" for more information.\n24/01/19 21:22:55\
  \ WARN Utils: Your hostname, Sundars-MacBook-Pro.local resolves to a loopback address:\
  \ 127.0.0.1; using 192.168.68.53 instead (on interface en0)\n24/01/19 21:22:55 WARN\
  \ Utils: Set SPARK_LOCAL_IP if you need to bind to another address\nSetting default\
  \ log level to \"WARN\".\nTo adjust logging level use sc.setLogLevel(newLevel).\
  \ For SparkR, use setLogLevel(newLevel).\n24/01/19 21:22:56 WARN NativeCodeLoader:\
  \ Unable to load native-hadoop library for your platform... using builtin-java classes\
  \ where applicable\nWelcome to\n____              __\n/ __/__  ___ _____/ /__\n\
  _\\ \\/ _ \\/ _ `/ __/  '_/\n/__ / .__/\\_,_/_/ /_/\\_\\   version 3.5.0\n/_/\n\
  Using Python version 3.11.7 (main, Dec 15 2023 12:09:04)\nSpark context Web UI available\
  \ at http://192.168.68.53:4040\nSpark context available as 'sc' (master = local[*],\
  \ app id = local-1705720977191).\nSparkSession available as 'spark'.\n>>>\n```\n\
  \n太棒了！您现在可以进一步扩展设置，以便与 Jupyter IDE 配合使用。\n\n### Jupyter Notebook 扩展\n\n为此，您可能需要在\
  \ `pyspark_env` 环境中安装 Jupyter。您可以使用以下代码执行此操作。\n\n*Mac/Linux 用户*\n\n```\nconda install\
  \ jupyter\n```\n\n您需要将以下两行代码添加到您的 `~/.bash_profile` 或 `~/.bashrc` 设置中：\n\n```\n\
  export PYSPARK_DRIVER_PYTHON=jupyter\nexport PYSPARK_DRIVER_PYTHON_OPTS='notebook'\n\
  ```\n\n确保使用相应的代码应用环境中的当前更改：\n\n```\nsource ~/.bash_profile\nsource ~/.bashrc\n```\n\
  \n从现在开始，每当您调用 `pyspark` 时，它应自动调用一个 Jupyter Notebook 会话。如果浏览器没有自动打开，您可以复制链接并将其粘贴到浏览器中。\n\
  \n*Jupyter 调用链接*\n\n```\nJupyter Server 2.10.0 is running at:\n[I 2024-01-19 21:55:24.577\
  \ ServerApp] http://localhost:8888/tree?token=b365126767afe1edb9d2ccddf00e203e1d3808b031e1a807\n\
