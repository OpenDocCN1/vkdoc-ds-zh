  \ Java 版本以兼容 Spark。与 Python 一样，所有 PySpark DataFrame 变量都区分大小写。\n\n### 从文件读取数据\n\n\
  ```python\n# 这是数据文件所在的位置\nfile_location = \"movie_data_part1.csv\"\n# 文件类型，PySpark\
  \ 也可以读取其他格式，如 json、parquet、orc\nfile_type = \"csv\"\n# 顾名思义，如果存在底层现有模式，它可以读取该模式\n\
