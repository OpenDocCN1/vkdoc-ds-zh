  ```\n\n**注意**：上述步骤对于任何 PySpark 程序都是通用的。\n\n正如你从图 2-1 中回忆的那样，`SparkSession` 是入口点，并将你的\
  \ PySpark 代码连接到 Spark 集群。默认情况下，所有用于执行代码的已配置节点都处于集群模式设置中。\n\n现在，让我们读取你的第一个数据集。我们使用位于本地机器上、已暴露给\
