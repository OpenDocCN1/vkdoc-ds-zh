- "# 3. 实用函数与可视化\n\n在本章中，我们将探讨 PySpark 中几个高级函数的实用功能。为了加深理解，建议你回顾上一章，并在你选择的任意数据集上尝试以下操作。我们的重点是窗口函数以及其他对于开发和将\
  \ Spark 程序应用于大型数据集至关重要的主题。在本章结尾，我们还将介绍可视化和机器学习流程，为你顺利过渡到后续的机器学习章节做好准备。\n\n本章涵盖以下主题：\n\
  \n- 其他数据操作\n- 数据可视化\n- 机器学习概述\n\n## 其他数据操作\n\n首先，我们来回顾上一章未涵盖的一些数据操作。\n\n### 字符串函数\n\
  \n在本节中，我们将重新运行第 2 章中执行的命令。\n\n```\n# 重新运行以下命令以重新创建 budget_cat 变量\ndf_with_newcols\
  \ = df.select('id', 'budget',' popularity').\\\nwithColumn('budget_cat', when(df['budget']<10000000,'Small').when(df['budget']<100000000,'Medium').otherwise('Big')).\\\
  \nwithColumn('ratings', when(df['popularity']<3,'Low').when(df['popularity']<5,'Mid').otherwise('High'))\n\
  ```\n\n如果你想将 `budget_cat` 和 `ratings` 的值合并到单个列中，可以使用 `CONCAT` 函数来实现。此外，你还可以分别使用\
  \ `lower` 和 `trim` 函数将新列转换为小写并去除所有空白字符（参见图 3-1）。\n\n![](img/500182_2_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1 字符串函数的输出\n\n```\n# 连接两个变量\ndf_with_newcols=df_with_newcols.withColumn('BudgetRating_Category',concat(df_with_newcols.budget_cat,df_with_newcols.ratings))\n\
  # 将新变量转换为小写\ndf_with_newcols=df_with_newcols.withColumn('BudgetRating_Category',trim(lower(df_with_newcols.BudgetRating_Category)))\n\
  df_with_newcols.show()\n```\n\n### 注册 DataFrame\n\n到目前为止，你一直在使用 DataFrame 及其函数。如果能对这些\
  \ DataFrame 使用 SQL 函数，那岂不是太棒了？幸运的是，PySpark 允许你在 DataFrame 上运行 SQL 查询。Spark 会处理所有操作。为此，你需要使用\
  \ `createOrReplaceTempView` 函数将 DataFrame 注册为临时表，这会创建一个内存表。请记住，此表仅在其创建的 Spark 会话中可访问，并且数据以\
  \ Hive 的列式格式存储。这种设置让你可以像访问普通 SQL 表一样访问所有列。你还可以用不同的数据覆盖现有的临时表。尝试将 DataFrame 注册为临时表，看看简单的\
  \ SQL 查询如何在不使用任何函数的情况下实现所需结果（如图 3-2a 所示）。\n\n![](img/500182_2_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2a 在临时表上执行 Spark SQL 的输出\n\n```\n# 注册临时表\ndf_with_newcols.createOrReplaceTempView\
  \ ('temp_data')\n# 应用函数显示结果\nspark.sql('select ratings, count(ratings) from temp_data\
  \ group by ratings').show(False,10)\n```\n\n在最新版本的 Spark 中，你可以跳过此步骤，直接使用 `spark.sql`\
  \ 查询内存中的 DataFrame，而无需注册。你会发现结果完全相同（参见图 3-2b）。\n\n![](img/500182_2_En_3_Fig3_HTML.jpg)\n\
  \n图 3-2b 在现有 DataFrame 上执行 Spark SQL 的输出\n\n```\n# 使用 Spark 最新功能\nspark.sql('select\
  \ ratings, count(ratings) as ratings_count from {temp_df} group by ratings',temp_df=df_with_newcols).show()\n\
  ```\n\n使用字符串格式进行动态插入的替代查询：\n\n```\nspark.sql('SELECT ratings, COUNT(ratings) AS\
  \ ratings_count FROM {} GROUP BY ratings'.format(temp_df)).show()\n```\n\n\n\n###\
  \ 窗口函数\n\n窗口函数允许你跨一组与当前行相关的行执行计算。它们对于执行基于时间的分析函数特别有用。许多特征工程都依赖于窗口函数。这些函数可以分为三类：\n\
  \n1.  **聚合函数**：将多行分组以生成单个汇总值，例如 `sum`、`average`、`min`、`max` 或 `count`。\n2.  **排名函数**\n\
  3.  **分析函数**\n\n使用窗口函数时，你需要指定三个关键组件：\n\n-   **分区**：确定哪些行与当前行位于同一分区中。例如，要计算每年预算最高的电影，你可以按年份进行分区。\n\
  -   **排序**：定义如何对每个分区内的行进行排序，可以是升序或降序。\n-   **窗口框**：根据当前行的相对位置，指定在当前行上方或下方包含多少行。\n\
  \n`PySpark` 包含一组用于排名和分析操作的内置函数。表 3-1 提供了这些函数的简洁且有用的列表。\n\n**表 3-1** 窗口函数类型\n\n|\
  \ 类型 | 函数 |\n| --- | --- |\n| 排名 | `rank`、`denseRank`、`percentRank`、`rowNumber`、`ntile`\
  \ |\n| 分析 | `lead`、`lag`、`lastValue`、`firstValue`、`cumeDist` |\n\n通过以下图示，你将更好地理解这些概念。让我们计算流行度的十分位数。我们所说的十分位数是什么意思？如果你有分析背景，你可能已经了解十分位数。十分位数是将分布按升序或降序分成十个相等桶的过程。这些是评估预测模型性能的初始步骤。我们将在后续章节中更深入地探讨模型性能和验证统计信息。现在，让我们看看如何计算流行度的十分位数。\n\
  \n```\n# 导入窗口函数\nfrom pyspark.sql.window import *\n# 步骤 1：过滤缺失值\ndf_with_newcols=df_with_newcols.filter(\
  \ (df_with_newcols['popularity'].isNotNull()) & (~isnan(df_with_newcols['popularity']))\
  \ )\n# 步骤 2：应用窗口函数计算十分位数\ndf_with_newcols = df_with_newcols.select(\"id\",\"budget\"\
  ,\"popularity\", ntile(10).over(Window.partitionBy().orderBy(df_with_newcols['popularity'].desc())).alias(\"\
  decile_rank\"))\n# 步骤 3：显示值\ndf_with_newcols.groupby(\"decile_rank\").agg(min('popularity').alias('min_popularity'),max('popularity').alias('max_popularity'),count('popularity')).show()\n\
  ```\n\n让我们分解一下步骤 2 中发生的事情。我们使用了 `ntile` 函数，它将变量分布划分为 *n* 个桶。此外，我们使用分区指定了如何拆分分布。在这种情况下，由于我们没有对数据指定任何分区，它将默认使用所有数据。然后，我们利用\
  \ `orderBy` 按流行度值降序排列数据中的所有行。最后，使用 `alias` 函数重命名十分位列。由于 Spark 采用惰性求值，执行此命令不会立即返回结果。\n\
  \n转到步骤 3，我们正在执行一个动作。当我们执行此步骤时，底层计划会被执行，并计算出十分位数。在步骤 3 中，我们从分组的 DataFrame 中收集要在 `agg`\
  \ 函数中使用的所有统计信息。此外，我们还包含了聚合函数的最小值、最大值和计数值。我们期望每个十分位中的记录数大致相等，因此添加了 `count` 来验证这一点。结果如图\
  \ 3-3 所示。\n\n![](img/500182_2_En_3_Fig4_HTML.jpg)\n\n**图 3-3** 流行度十分位数的输出\n\n现在，我们对流行度评分在十个均匀分布的桶中的变化情况有了一个清晰的认识。假设你想知道\
  \ 1970 年第二受欢迎的电影是哪一部。如何使用你刚刚学到的函数找到它？\n\n在开始之前，请使用内存中的 DataFrame。如果我已经覆盖了数据怎么办？好吧，此时，如果你已经覆盖了\
  \ DataFrame，你总是可以重新加载数据。但是，请记住将变量转换为适当的数据类型。\n\n```\n# 步骤 1：导入窗口函数\nfrom pyspark.sql.window\
  \ import *\n# 步骤 2：选择所需的列子集\ndf_second_best = df.select('id', 'popularity', 'release_date')\n\
  # 步骤 3：从发布日期创建年份列\ndf_second_best=df_second_best.withColumn('release_year',year('release_date')).drop('release_date')\n\
  # 步骤 4：定义分区函数\nyear_window = Window.partitionBy(df_second_best['release_year']).orderBy(df_second_best['popularity'].desc())\n\
  # 步骤 5：应用分区函数\ndf_second_best=df_second_best.select('id', 'popularity', 'release_year',rank().over(year_window).alias(\"\
  rank\"))\n# 步骤 6：查找 1970 年的第二高评分\ndf_second_best.filter((df_second_best['release_year']==1970)\
  \ & (df_second_best['rank']==2)).show()\n```\n\n让我们回顾一下并观察前面步骤中发生的事情。首先，我们选择了所需的列，并从发布日期中提取了年份。从上一节中，你一定已经熟悉了这个步骤。在步骤\
  \ 4 中，我们定义了窗口函数。我们想按年份对数据进行分区。这样做的原因是我们想知道 1970 年的第二高评分。这个分区将允许我们按年份对数据中的所有流行度评分进行排名。在步骤\
  \ 5 中，我们使用了 `rank` 函数以及我们之前定义的 `window.partitionBy` 函数来得到所需的结果。等等——我们还没完成！我们想要识别\
  \ 1970 年的结果，因此我们将数据过滤到 1970 年，并提取行排名为 2 的数据子集，如步骤 6 所示。结果如图 3-4 所示。\n\n![](img/500182_2_En_3_Fig5_HTML.jpg)\n\
  \n**图 3-4** 1970 年第二高流行度评分的输出\n\n我们在这里使用了 `rank` 函数。`rank` 和 `denseRank` 之间有一个细微的区别——`rank`\
  \ 给出有序分区内的排名，并列项被赋予相同的排名。并列项之后的排名会被赋予更高的排名。如果你有两行排名为 2，则下一个排名将是 4。在 `denseRank`\
  \ 中，不会跳过任何排名，它们是连续的。你需要根据需求选择这些函数。\n\n让我们更进一步。如果你的问题是，当年票房最高的电影与其他电影之间的收入差异是多少？你需要先找出当年的票房冠军，然后计算某部电影的收入差异。以下代码演示了如何实现这一点。结果如图\
  \ 3-5 所示。\n\n![](img/500182_2_En_3_Fig6_HTML.jpg)\n\n**图 3-5** 与每年最高收入相比的收入差异输出\n\
  \n```\n# 步骤 1：导入窗口函数\nfrom pyspark.sql.window import *\n# 步骤 2：选择所需的列子集\ndf_revenue\
  \ = df.select('id', 'revenue', 'release_date')\n# 步骤 3：从发布日期创建年份列\ndf_revenue=df_revenue.withColumn('release_year',year('release_date')).drop('release_date')\n\
  # 步骤 4：定义分区函数及范围\nwindowRev =Window.partitionBy(df_revenue['release_year']).orderBy(df_revenue['revenue'].desc()).rangeBetween(-sys.maxsize,\
  \ sys.maxsize)\n# 步骤 5：应用分区函数计算收入差异\nrevenue_difference = (max(df_revenue['revenue']).over(windowRev)\
  \ - df_revenue['revenue'])\n# 步骤 6：最终数据\ndf_revenue.select('id', 'revenue', 'release_year',revenue_difference.alias(\"\
  revenue_difference\")).show(10,False)\n```\n\n你会注意到，在步骤 3 之前，与前面的示例相比没有太多变化。在步骤\
  \ 4 中，除了 `window.partitionBy` 函数之外，我们还加入了 `rangeBetween` 函数。此函数用于定义起点和终点（均包含）之间的边界。`rangeBetween`\
  \ 函数中的两个参数表示应包含该分区内的最小和最大可能值。转到步骤 5，我们识别窗口函数上的最大值，并从行值中减去它们。这产生了预期的输出，如步骤 6 所示。\n\
  \n窗口函数可能是一个开销较大的话题。然而，前面的示例应该能让你很好地了解如何利用这些函数的可能性。大多数 SQL 窗口函数都可以作为 `PySpark` 中的内置函数使用。\n\
  \n\n\n### 其他实用函数\n\n在本节中，我们将介绍前面章节未提及的其他实用函数。根据具体使用场景，它们可能非常有效。\n\n#### 收集列表（Collect\
  \ List）\n\n从之前的分析中我们知道，有些标题是重复的。假设你想找出所有重复出现标题“The Lost World”的年份。我们有一个名为`collect_list`的便捷函数可以实现此功能。在本演示中，我们将使用现有的\
  \ DataFrame。图 3-6 展示了之前的输出结果以供参考，而新的输出结果如图 3-7 所示。\n\n![](img/500182_2_En_3_Fig7_HTML.jpg)\n\
  \n图 3-6\n\n经过筛选、排序并包含单向频率的输出结果\n\n```\n# 步骤 1：从发布日期创建年份列\ndf=df.withColumn('release_year',year('release_date'))\n\
  # 步骤 2：应用 collect_list 函数收集所有出现项\ndf.filter(\"title=='The Lost World'\").groupby('title').agg(collect_list(\"\
  release_year\")).show(1,False)\n```\n\n![](img/500182_2_En_3_Fig8_HTML.jpg)\n\n\
  图 3-7\n\n`collect_list` 的输出结果\n\n我们来分解步骤 2：首先筛选出我们感兴趣的标题，然后按标题对 DataFrame 进行分组。这个特定标题出现了六次。`collect_list`函数收集了该标题对应的发布年份，并在输出中显示。\n\
  \n#### 抽样\n\n抽样在数据分析中占有特殊地位。简单来说，*样本*是总体中的一个子集。但究竟什么是总体？*总体*代表全部数据。在考虑你要研究的总体时，精确界定至关重要。例如，如果你将总体定义为亚马逊的所有活跃用户，这涵盖了所有亚马逊用户，无论其地区、语言或性别。然而，在现实场景中，获取总体数据可能具有挑战性，有时甚至不切实际。\n\
  \n我们使用样本来推断总体中发生的情况。然而，如果抽样执行不当，可能会显著影响你的结果。广义上讲，可用的抽样方法可分为概率抽样和非概率抽样技术。概率抽样技术涉及随机选择来选取样本，而非概率抽样技术则依赖主观判断。在数据科学中，我们通常采用概率抽样技术来对样本做出明智的决策。概率抽样方法中一些流行的抽样技术包括：简单随机抽样、系统随机抽样、分层随机抽样和整群抽样。\n\
  \n在简单随机抽样中，样本中的每个观测值都是随机选择的，确保所有观测值被选中的机会均等。简单随机抽样有两种变体。\n\n*   **有放回的简单随机抽样：**\
  \ 在此方法中，一旦从总体中随机选择一个观测值，在选取第二个观测值之前，它会放回数据集中。换句话说，一个观测值的选择不会影响其他观测值的结果。\n\n*   **无放回的简单随机抽样：**\
  \ 在此方法中，一旦从总体中随机选择一个观测值，在选取第二个观测值之前，它不会放回数据集中。换句话说，一个观测值的选择会显著影响其他观测值的结果。\n\n在分层抽样中，你从可以划分为子总体的总体中选取样本。例如，假设你知道在豪华车细分市场中，拥有特定品牌汽车的人口比例。那么，使用此技术选择样本时，你可以保持相同的比例。\n\
  \n现在，让我们探讨如何使用 PySpark 实现这些技术。\n\n```\n# PySpark 中的无放回简单随机抽样\ndf_sample = df.sample(False,\
  \ 0.4, 11)\ndf_sample.count()\n```\n\n输出：\n\n```\n\n```\n\n上述命令指定了三个参数。第一个参数`True/False`表示你是否希望进行有放回或无放回抽样。我们选择了`False`，表示希望进行无放回抽样。第二个参数是比例，表示你希望样本占总体的比例。第三个参数是种子，用于确保每次运行此代码段时都能得到相同的结果。\n\
  \n```\n# PySpark 中的有放回简单随机抽样\ndf_sample = df.sample(True, 0.4, 11)\ndf_sample.count()\n\
  ```\n\n输出：\n\n```\n\n```\n\n请注意，在这两种情况下，样本大小并不完全是我们请求的比例。这是因为 Spark 内部使用伯努利抽样技术来抽取样本。由于总体的每个元素都是单独被选入样本的，因此样本大小不是固定的，而是遵循二项分布。\n\
  \n```\n# PySpark 中的分层抽样\ndf_strat = df.sampleBy(\"release_year\", fractions={1959:\
  \ 0.2, 1960: 0.4, 1961: 0.4}, seed=11)\ndf_strat.count()\n```\n\n输出：\n\n```\n\n\
  ```\n\n分层抽样的语法与简单随机抽样略有不同。注意我们使用的是`sampleBy`函数而不是`sample`。这里的第一个参数是你想要分层的列。在这个例子中，我们使用的是发布年份。例如，假设我们知道\
  \ 1960 年和 1961 年发行的电影数量是 1959 年的两倍；那么我们将使用这个比例来定义我们的样本。这体现在第二个参数中。\n\n\n\n#### 缓存与持久化\n\
  \n缓存是 Spark 最重要的概念之一。如果使用得当，它能在运行大型程序时节省大量时间。那么什么是缓存呢？它是一种将数据临时保存在内存中的方式，这种做法在各类操作系统、软件和编程语言中都很常见。那么它为什么有用呢？因为如果你能将数据存储在内存中，就无需在每次访问\
  \ `DataFrame` 时重复计算，从而节省了昂贵的数据 I/O 操作成本。如果你要多次访问同一个 `DataFrame` 并执行多项操作，我们建议使用缓存。如果你只打算使用一次\
  \ `DataFrame`，或者数据很容易计算，那么缓存就没有必要了。\n\n读取数据后，你可以对 `DataFrame` 上的第一个查询进行缓存。第一个查询会以正常速度运行，但后续操作将受益于计算速度的提升。值得注意的是，缓存是惰性的，这意味着你对\
  \ `DataFrame` 的第一次操作会花费一些时间。你可以使用 `cache` 函数缓存任何 `DataFrame`。\n\n```\ndf.cache()\n\
  ```\n\n持久化具有类似的功能，或者可以看作是缓存的同义词。它们的区别在于存储级别设置。Spark 有五种存储类型。以下内容来自 Spark 文档。参见表\
  \ 3-2。\n\n*   `MEMORY_ONLY`：将 RDD 作为反序列化的 Java 对象存储在 JVM 中。如果 RDD 无法完全放入内存，则某些分区将不会被缓存，并在每次需要时重新计算。这是默认级别。\n\
  *   `MEMORY_ONLY_SER`：将 RDD 作为序列化的 Java 对象（每个分区一个字节数组）存储。这通常比反序列化对象更节省空间，尤其是在使用快速序列化器时，但读取时更消耗\
  \ CPU。\n*   `MEMORY_AND_DISK`：将 RDD 作为反序列化的 Java 对象存储在 JVM 中。如果 RDD 无法完全放入内存，则将无法放入的分区存储在磁盘上，并在需要时从磁盘读取。\n\
  *   `MEMORY_AND_DISK_SER`：类似于 `MEMORY_ONLY_SER`，但将无法放入内存的分区溢出到磁盘，而不是在每次需要时重新计算。\n\
  *   `DISK_ONLY`：仅将 RDD 分区存储在磁盘上。\n\n缓存将使用 `memory_only`。你可以使用 `persist` 函数对所有存储级别进行持久化：\n\
  \n```\ndf.persist()\n```\n\n如果你想手动移除存储级别中的数据，可以使用 `unpersist` 函数：\n\n表 3-2  \nSpark\
  \ 中的存储级别\n\n| 级别 | 占用空间 | CPU 时间 | 内存中 | 磁盘上 | 序列化 |\n| --- | --- | --- | --- |\
  \ --- | --- |\n| `MEMORY_ONLY` | 高 | 低 | 是 | 否 | 否 |\n| `MEMORY_ONLY_SER` | 低 |\
  \ 高 | 是 | 否 | 是 |\n| `MEMORY_AND_DISK` | 高 | 中 | 部分 | 部分 | 部分 |\n| `MEMORY_AND_DISK_SER`\
  \ | 低 | 高 | 部分 | 部分 | 是 |\n| `DISK_ONLY` | 低 | 高 | 否 | 是 | 是 |\n\n```\ndf.unpersist()\n\
  ```\n\n#### 保存数据\n\n完成所有数据操作后，你有多种保存数据集的选项，可以保存为 Hive 表或文本文件。我们先来看一个示例，了解如何使用 `write`\
  \ 和 `save` 方法将输出 `DataFrame` 保存为文本文件。在以下命令中，你可以指定输出文件的格式以及设置分隔符的选项。我们选择管道符作为分隔符用于演示，但你可以自定义并选择任何对数据集有意义的分隔符。\n\
  \n```\ndf.write.format('csv').option('delimiter', '|').save('output_df')\n```\n\n\
  假设你在集群上工作，并且数据有多个分区，你可以使用 `coalesce` 函数将它们一起保存到单个文件中。在这种情况下，你可以将前面的命令修改如下：\n\n```\n\
  df.coalesce(1).write.format('csv').option('delimiter', '|').save('output_coalesced_df')\n\
  ```\n\n如果你需要按某个列对数据进行分区以便于索引，可以在保存时使用 `partitionBy` 函数，如下所示：\n\n```\ndf.write.partitionBy('release_year').format('csv').option('delimiter',\
  \ '|').save('output_df_partitioned')\n```\n\n如果你想将数据保存为 Hive 表，可以使用 `saveAsTable`\
  \ 函数：\n\n```\ndf.write.saveAsTable('film_ratings')\n```\n\n#### Pandas 支持\n\n是的，我们正在使用\
  \ PySpark。但有时你可能希望将 PySpark `DataFrame` 转换为 pandas `DataFrame`。你可以通过 `toPandas()`\
  \ 函数来实现。警告：不要尝试在大型数据集上运行以下命令，否则会遇到内存问题。这是因为你正在将分布式数据集复制到本地内存。一旦创建了 pandas `DataFrame`，新创建的\
  \ pandas `DataFrame` 与 Spark 之间就没有任何连接了。\n\n```\n# Pandas 转 PySpark\ndf_pandas =\
  \ df.toPandas()\n# Pandas 转 PySpark\ndf_py = spark.createDataFrame(df_pandas)\n\
  ```\n\n\n\n#### 连接（Joins）\n\n图 3-8 以图形方式快速展示了所有连接类型。下一节将教你每种连接的具体用法及其工作原理。\n\n![](img/500182_2_En_3_Fig9_HTML.jpg)\n\
  \n图 3-8 连接类型\n\n连接是你在使用 DataFrame 时最频繁的操作之一。为了讲解连接，我们引入另一个包含额外信息的数据集，并将其与我们一直在使用的数据结合使用。详见表\
  \ 3-3。\n\n表 3-3 附加数据的元数据\n\n| 变量 | 描述 |\n| --- | --- |\n| `id` | 电影的唯一标识符 |\n| `cast`\
  \ | 演员表列表 |\n| `adult` | 指示电影是否为成人影片 |\n| `directors` | 导演信息 |\n| `vote_count` |\
  \ 总投票数（用于衡量人气） |\n| `spoken_languages` | 电影中使用语言的列表 |\n| `Poster_path` | 电影海报图片的存储路径\
  \ |\n| `homepage` | 电影网页（如果存在） |\n| `imdb_id` | 电影对应的 IMDB ID |\n| `genres` | 电影类型列表\
  \ |\n| `video` | 网站上的视频指示器 |\n\n首先，将此数据加载为一个新的 DataFrame，并选择所有 ID 非空的行，操作如下：\n\n\
  ```\n# 输入参数\nfile_location = \"movie_data_part2.csv\"\nfile_type = \"csv\"\ninfer_schema\
  \ = \"False\"\nfirst_row_is_header = \"True\"\ndelimiter = \"|\"\n# 整合所有选项以读取 csv\
  \ 文件\ndf_p1 = Spark.read.format(file_type) \\\n.option(\"inferSchema\", infer_schema)\
  \ \\\n.option(\"header\", first_row_is_header) \\\n.option(\"sep\", delimiter) \\\
  \n.load(file_location)\n# 将标识符转换为正确的数据类型\ndf_p1 = df_p1.withColumn('id',df_p1['id'].cast(\"\
  integer\"))\n# 过滤缺失值\ndf_p1=df_p1.filter((df_p1['id'].isNotNull()) & (~isnan(df_p1['id'])))\n\
  ```\n\n显而易见，两个数据集中共有的变量是 ID。我们将能够使用此标识符来连接 DataFrame。PySpark 提供了多种连接方式，下面逐一介绍。\n\
  \n- **内连接（Inner join）：** 此操作基于标识符连接两个 DataFrame，仅保留两者共有的行和列（见图 3-9）。\n\n```\n# 内连接\n\
  df.join(df_p1, df['id'] == df_p1['id'],'inner').printSchema()\ndf.join(df_p1, df['id']\
  \ == df_p1['id']).count()\n```\n\n![](img/500182_2_En_3_Fig10_HTML.jpg)\n\n图 3-9\
  \ 内连接的输出列和计数\n\nSpark 处理了 DataFrame 的连接，并将标识符包含了两次。作为良好实践，你可以将标识符重命名为相同名称，或者直接删除重复的标识符。\n\
  \n默认情况下，如果未传递任何参数，Spark 会使用内连接。\n\n- **左连接/左外连接（Left/Left outer join）：** 左连接基于标识符合并两个\
  \ DataFrame，保留左侧 DataFrame 的所有行，并匹配右侧 DataFrame 中与之共有的行。如果右侧 DataFrame 中没有对应的行，Spark\
  \ 会在所有列中插入空值。\n\n```\n# 左连接\ndf.join(df_p1, df['id'] == df_p1['id'],'left').count()\n\
  ```\n\n输出：\n\n- **右连接/右外连接（Right/Right outer join）：** 此操作基于标识符合并两个 DataFrame，保留右侧\
  \ DataFrame 的所有行，并匹配左侧 DataFrame 中与之共有的行。如果左侧 DataFrame 中没有对应的行，Spark 会在所有列中插入空值。\n\
  \n```\n# 右连接\ndf.join(df_p1, df['id'] == df_p1['id'],'right').count()\n```\n\n输出：\n\
  \n- **全外连接（Full outer join）：** 此操作基于标识符连接两个 DataFrame，保留左侧和右侧 DataFrame 中具有相同标识符的所有行。如果任一\
  \ DataFrame 中没有对应的行，Spark 会在所有列中插入空值。\n\n```\n# 外连接\ndf.join(df_p1, df['id'] ==\
  \ df_p1['id'],'outer').count()\n```\n\n输出：\n\n- **左反连接（Left Anti join）：** 此操作基于标识符连接两个\
  \ DataFrame，仅保留左侧 DataFrame 中存在于右侧 DataFrame 的那些行。同时，它只保留左侧 DataFrame 的模式（见图 3-10）。\n\
  \n```\n# 左反连接\ndf.join(df_p1, df['id'] == df_p1['id'],'left_anti').printSchema()\n\
  df.join(df_p1, df['id'] == df_p1['id'],'left_anti').count()\n```\n\n![](img/500182_2_En_3_Fig11_HTML.jpg)\n\
  \n图 3-10 左反连接的输出列和计数\n\n- **左半连接（Left Semi join）：** 此操作类似于内连接，区别在于它不会返回右侧 DataFrame\
  \ 中的列（见图 3-11）。\n\n```\n# 左半连接\ndf.join(df_p1, df['id'] == df_p1['id'],'left_semi').printSchema()\n\
  df.join(df_p1, df['id'] == df_p1['id'],'left_semi').count()\n```\n\n![](img/500182_2_En_3_Fig12_HTML.jpg)\n\
  \n图 3-11 左半连接的输出列和计数\n\n- **广播（Broadcasting）：** 有时你需要连接一个大型数据集（数百万行）和一个小型数据集（数百行）。为了高效地连接它们，Spark\
  \ 提供了另一个名为 `broadcast` 的函数。较小的 DataFrame 会被复制到集群的所有节点中。这提高了效率，因为 Spark 无需对较大的数据集进行任何数据混洗。以下是一个工作示例：\n\
  \n```\n# 广播连接\ndf.join(broadcast(df_p1), df['id'] == df_p1['id'],'left_semi').count()\n\
  ```\n\n输出：\n\n#### 删除重复项（Dropping Duplicates）\n\n在处理真实数据时，另一个你可能经常用到的便捷函数是 `dropDuplicates`。你可以删除单行或多行的重复项。假设你想删除\
  \ DataFrame 中所有标题和年份相同的重复行，可以使用以下命令：\n\n```\n# 删除重复项\ndf.dropDuplicates(['title','release_year']).count()\n\
  ```\n\n输出：\n\n```\n# 原始数据计数\ndf.count()\n```\n\n输出：\n\n\n\n#### 数据可视化\n\nSpark 没有内置的数据可视化包。Python\
  \ 拥有丰富的数据可视化包库，例如 `matplotlib` 和 `seaborn`。你可以将这些包与 DataFrames 结合使用，创建所需的图表。\n\n\
  退一步来看，你会发现可视化主要使用的是聚合数据。如果你需要理解一个连续变量，最佳图表是直方图。同样，对于分类数据，你可能希望看到分组图。因此，你可以利用 Spark\
  \ 的强大功能来计算这些聚合结果，然后借助 Python 中优秀的可视化包来呈现。\n\n首先，让我们绘制流行度数据的直方图（见图 3-12）：\n\n![](img/500182_2_En_3_Fig13_HTML.jpg)\n\
  \n图 3-12：流行度直方图\n\n```\n# 步骤 1：导入所需库\n%matplotlib inline\nimport pandas as pd\n\
  from matplotlib import pyplot as plt\nimport seaborn as sns\n# 步骤 2：在 Spark 中处理数据。我们可以使用\
  \ RDD 中的 histogram 函数\nhistogram_data = df.select('popularity').rdd.flatMap(lambda\
  \ x: x).histogram(25)\n# 步骤 3：将计算出的直方图数据加载到 pandas DataFrame 中以便绘图\nhist_df=pd.DataFrame(list(zip(*histogram_data)),\
  \ columns=['bin', 'frequency'])\n# 步骤 4：绘制数据\nsns.set(rc={\"figure.figsize\": (12,\
  \ 8)})\nsns.barplot(hist_df['bin'],hist_df['frequency'])\nplt.xticks(rotation=45)\n\
  plt.show()\n```\n\n我们来分解一下每个步骤中发生的事情。首先，我们导入了所需的库。所有与数据相关的繁重工作都在步骤 2 中完成。我们使用 RDD\
  \ API 中提供的 `histogram` 函数来离散化分布并计算分箱。在此过程中，我们要求它将数据离散化为 25 个桶。在步骤 3 中，我们在数据之上创建了一个\
  \ pandas DataFrame，然后使用它进行绘图。这就是诀窍所在：我们并没有直接使用 Python 中的直方图函数；所有计算都在 Spark 中完成。我们在直方图数据之上使用条形图来查看分布。正如你所见，由于尾部数值稀疏，该分布难以解释。\n\
  \n让我们尝试过滤数据，看看是否能更好地了解分布情况。\n\n```\n# 过滤数据以更好地理解数据\ndf_fil=df.filter('popularity<22')\n\
  # 在 Spark 中处理数据。我们可以使用 RDD 中的 histogram 函数\nhistogram_data = df_fil.select('popularity').rdd.flatMap(lambda\
  \ x: x).histogram(25)\n# 将计算出的直方图加载到 pandas DataFrame 中以便绘图\nhist_df=pd.DataFrame(list(zip(*histogram_data)),\
  \ columns=['bin', 'frequency'])\n# 绘制数据\nsns.set(rc={'figure.figsize':(11.7,8.27)})\n\
  sns.barplot(hist_df['bin'],hist_df['frequency'])\nplt.xticks(rotation=25)\nplt.title('流行度分布\
  \ - 数据已过滤')\nplt.show()\n```\n\n我们重复了相同的步骤，只是增加了过滤。现在我们得到了一个好得多的分布（见图 3-13）。\n\n\
  ![](img/500182_2_En_3_Fig14_HTML.jpg)\n\n图 3-13：过滤后的流行度直方图\n\n让我们尝试绘制另一个变量。假设你想知道数据集中\
  \ 1960 年至 1970 年间每年上映的电影数量。你可以通过以下命令来确定（见图 3-14）：\n\n![](img/500182_2_En_3_Fig15_HTML.jpg)\n\
  \n图 3-14：1960 年至 1970 年每年上映的电影数量\n\n```\n# 步骤 1：使用 Spark 函数准备数据并转换为 pandas DataFrame\n\
  df_cat=df.filter(\"(release_year>1959) and (release_year<1971)\").groupby('release_year').count().toPandas()\n\
  # 步骤 2：对值进行排序以便显示\ndf_cat=df_cat.sort_values(by=['release_year'], ascending=False)\n\
  # 步骤 3：绘制数据\nsns.set(rc={'figure.figsize':(11.7,8.27)})\nsns.barplot(df_cat['release_year'],df_cat['count'])\n\
  plt.xticks(rotation=25)\nplt.title('数据集中 1960 年至 1970 年每年上映的电影数量')\nplt.show()\n\
  ```\n\n练习 3-1 使用以下数据集：[`https://www.kaggle.com/kakarlaramcharan/tmdb-data-0920`](https://www.kaggle.com/kakarlaramcharan/tmdb-data-0920)。\n\
  \n## 练习 3-1：数据操作\n\n**问题 1：** 根据流行度，找出 2010 年第二受欢迎的电影。\n\n**问题 2：** 找出所有重复出现的片名，并显示它们重复出现的年份。\n\
  \n**问题 3：** 找出所有年份中按流行度排名靠前的电影。\n\n**问题 4：** 可视化 2014 年和 2015 年电影的预算。\n\n\n\n##\
  \ 机器学习简介\n\n在踏入机器学习的世界之前，你需要了解分析的发展历程。分析是对数据或统计信息的计算性分析，用于发现、解读和传达数据中有意义的模式。你可能会听到许多与分析相关的术语和流行词，但它们都服务于收集洞察和做出明智决策这一目的。\n\
  \n分析大致可分为以下几类（见图 3-15）：\n\n![](img/500182_2_En_3_Fig16_HTML.jpg)\n\n图 3-15\n\n分析概览\n\
  \n*   **描述性分析：** 该分析领域专注于创建报告和图表，以理解数据。\n*   **预测性分析：** 该分析领域与根据已发生事件估计未来会发生什么相关。它依赖历史数据进行预测。\n\
  *   **规范性分析：** 该分析领域专注于根据过去的数据确定需要采取什么行动。这包括决策优化。\n\n这些术语的使用方式常常会让初学者感到困惑。当然，它们之间存在重叠。机器学习是计算机科学的一个子领域，也被视为人工智能的一个子集。*预测性分析*指的是统计建模，是保险、银行和营销行业中常见的术语。*机器学习*是一个更广泛的术语，涵盖多个类别，包括：\n\
  \n*   **监督学习：** 在这种学习类型中，算法会获得一个带有目标标签或事件的历史数据集。该研究领域通过准确度指标进行验证。这也包括任何时间序列建模。\n\
  *   **无监督学习：** 在这种学习类型中，算法会获得一个没有目标标签或事件的历史数据集。其目的是识别数据中隐藏的模式或分段。\n\n在讨论监督和无监督方法中的学习技术类型之前，你需要了解数据类型。我们可以将数据大致分为定性数据和定量数据。\n\
  \n*定性数据*是无法测量的数据。这可以包括你车辆的颜色、婚姻状况、教育程度等。这些变量也可以称为分类变量。我们可以进一步将定性数据分类如下：\n\n*   **名义数据**\
  \ – 当数据有多个层级且没有自然顺序时，可视为名义数据。例如，你车辆的颜色或婚姻状况。\n*   **有序数据** – 当数据存在内在顺序时，可视为有序数据。例如，教育程度。在教育程度中，可以有多个层级，如高中以下、高中、本科和研究生。这些层级具有关联的排序。我们知道研究生处于较高端，而高中以下处于较低端。\n\
  \n*定量数据*是可以测量的数据。这可以包括年龄、距离等。定量数据可以进一步分为离散数据和连续数据：\n\n*   **离散数据** – 当数据为整数值时，可视为离散数据；例如，年龄（10,\
  \ 20）。\n*   **连续数据** – 当数据包含分数或小数时，可视为连续数据；例如，距离（40.71 英里, 59.82 英里）。\n\n我们专门用一章来讲解无监督学习/聚类，你将在其中学习这些不同的技术和方法（见图\
  \ 3-16）。\n\n![](img/500182_2_En_3_Fig17_HTML.jpg)\n\n图 3-16\n\n机器学习的分类\n\n了解这些数据类型为什么重要？因为它将帮助你确定可以应用哪些类型的算法。某些算法是为特定数据类型设计的。在监督学习中，有两类不同的算法：分类和回归：\n\
  \n*   **分类：** 在这类机器学习中，目标/事件数据是离散的。例如，预测可能流失的客户（0/1）或可能贷款违约的客户（0/1）。\n*   **回归：**\
  \ 在这类机器学习中，目标/事件数据是连续的。例如，根据给定参数预测房价（$）或预测客户在某个月的购买量。\n\n在后续章节中，我们将探讨哪些算法可以应用于这些方法中的每一种。\n\
  \n*聚类*可以定义为在数据集中对同质数据组进行分组。\n\n大多数数据专业人士在进行预测建模时会遵循一些标准方法论。其中之一是 CRISP-DM，即跨行业数据挖掘标准流程（见图\
  \ 3-17）。它包括六个主要阶段，如下所示：\n\n![](img/500182_2_En_3_Fig18_HTML.jpg)\n\n图 3-17\n\nCRISP-DM\
  \ 方法论\n\n1.  **业务理解：** 这是重要的第一步，涉及理解问题陈述并将其转化为数据问题。这源于业务需求。\n2.  **数据理解：** 此步骤包括数据收集和描述性数据分析，以探索数据并熟悉有趣的特征。\n\
  3.  **数据准备：** 这包括整合所有数据特征，并从数据集中创建额外的特征/变量。\n4.  **建模：** 这包括应用适当的算法，并在必要时进行迭代以创建更多变量。\n\
  5.  **评估：** 在构建一个或多个模型后，根据设定的验证标准选择一个模型。我们有一个单独的章节来帮助你理解所有模型评估和验证技术。我们还会寻求业务反馈，以确认模型是否实现了预期功能。\n\
  6.  **部署：** 这涉及将模型投入生产，并使模型评分可供业务中的各个利益相关者使用。\n\n数据从业者中另一种常见的标准框架是 SEMMA。SEMMA 代表抽样（Sample）、探索（Explore）、修改（Modify）、建模（Model）和评估（Assess）。该方法论由\
  \ SAS 在 CRISP-DM 之前引入。这种以建模为中心的方法不将业务输入作为其流程的一部分。如果你明确定义了业务目标，它在去中心化的组织中也能很好地发挥作用。\n\
  \n## 总结\n\n*   你探索了创建窗口函数的可能性，并思考了特定的业务问题。\n*   你学习了抽样、如何实现抽样以及其重要性。\n*   你学习了 `cache`\
  \ 和 `persist` 函数的机制以及何时使用它们。\n*   你学习了一些简单的可视化技巧。\n*   你现在已经掌握了机器学习的基础知识和框架。\n\n\
  干得好！下一章将介绍变量选择并讨论不同的技术。当你被数据淹没时，你总可以依靠变量选择这一章。它将帮助你识别信息量最大的关键变量。我们下一章见！\n\n\n\n"
- "# 4. 变量选择\n\n*变量选择*是一门艺术。本章旨在帮助你理解可用于在数据集中选择最佳特征的不同变量选择技术。这是数据科学中的关键流程之一。简单来说，假设你是一支足球队的教练。你想挑选最好的队伍来赢得世界杯。你需要每个位置上的最佳球员（*最佳特征*），并且你不希望在特定时间内有太多踢同一位置的球员（*多重共线性*）。在\
  \ PySpark 中，有多种方法可以完成这项任务。本章将介绍一些内置和自定义的变量选择技术（见图 4-1）。\n\n![](img/500182_2_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n变量选择\n\n接下来的页面将探讨每种技术背后的概念，通过手动计算来了解它们的工作原理 *（必要时）*，最后使用 PySpark 实现它们。在本章中，我们使用来自\
  \ UCI 机器学习库（网址为 [`https://archive.ics.uci.edu/ml/datasets/Bank+Marketing`](https://archive.ics.uci.edu/ml/datasets/Bank%252BMarketing)）的银行数据集。你需要从\
  \ `data` 文件夹下载 `bank.zip` 文件以获取 `bank-full.csv` 文件。在继续之前，请考虑图 4-2 中这种直观的变量选择方式。\n\
  \n![](img/500182_2_En_4_Fig2_HTML.jpg)\n\n图 4-2\n\n思考变量选择的直观方式\n\n在图 4-2 中，最初会考虑许多特征（显示在漏斗顶部）。然而，只有那些必需且关键的特征最终会通过变量选择技术被选中（漏斗底部）。通过选择正确的特征集（移除冗余或不相关的变量），可以提高模型的准确性和性能，从而缓解维度灾难。因此，变量选择是数据科学过程中一个迭代且关键的步骤。\n\
  \n## 探索性数据分析\n\n探索性数据分析（EDA）用于分析和研究数据集，通过汇总或可视化方法识别特征和模式。前面的章节已经通过大量代码示例广泛介绍了这个主题。我们建议你将这些代码片段应用于你处理的任何数据集。当你更好地理解数据时，你可以快速做出决策并解释决策背后的理由。EDA\
  \ 也可以成为变量选择过程中一个强大的第一步。如果你想知道如何操作，可以考虑基数（见本节定义）和缺失值。在进行任何机器学习练习时，检查这两点是一个好习惯。\n\n\
  让我们用这个房价示例来更好地理解基数和缺失值（见图 4-3）。\n\n![](img/500182_2_En_4_Fig3_HTML.jpg)\n\n图 4-3\n\
  \n房价数据集\n\n### 基数\n\n*基数* 是一个变量中唯一值的数量。假设你正在构建一个预测房价的模型。所有记录的 `房屋类型` 变量都是“独栋住宅”。在这种情况下，该变量的基数为\
  \ 1（“独栋住宅”）。`房屋类型` 没有提供任何有用信息，因为无论你选择哪条记录，该变量都提供相同的信息（“独栋住宅”）。因此，你可以省略此变量，并使用其他变量来构建预测模型。虽然你可以计算任何变量的基数，但基数对于分类变量更为有用。在图\
  \ 4-3 中，`房屋类型` 的基数为 3，表示有三个不同的值（“联排别墅”、“公寓”和“独栋住宅”）。\n\n### 缺失值\n\n顾名思义，缺失值指的是缺失的信息片段。你需要理解信息缺失背后的原因，以便构建更好的模型。通常，数据可能因以下三个原因而缺失：\n\
  \n- 随机缺失（MAR）\n- 完全随机缺失（MCAR）\n- 非随机缺失（MNAR）\n\n通过理解缺失信息的类型，你可以相应地处理数据。下一节将使用相同的房价示例来解释缺失值。\n\
  \n#### 随机缺失（MAR）\n\n当数据随机缺失时，缺失数据与观测数据之间存在关系。房价示例可以帮助解释这一点。当你仔细观察 `房屋类型` 和 `HOA\
  \ 费用`（业主协会费用）变量时，你会发现当 `房屋类型` 为“联排别墅”或“公寓”时，`HOA 费用` 有一个值；而当 `房屋类型` 为“独栋住宅”时，该费用缺失。这是有道理的，因为独栋住宅（在许多情况下）没有\
  \ HOA 费用。在这种情况下，“独栋住宅”的 `HOA 费用` 可以用零来填充。这种类型的缺失数据称为 *随机缺失（MAR）*。\n\n注意\n\n*填充*\
  \ 是数据科学文献中填充缺失值的一种方法。\n\n#### 完全随机缺失（MCAR）\n\n当数据完全随机缺失时，缺失数据与观测数据之间没有关系。考虑数据中的\
  \ `价格` 变量。其中一个房价缺失了。与 MAR 示例不同，你无法从这种缺失数据中推导出任何逻辑。信息缺失背后可能有很多原因。也许房子正在挂牌拍卖，或者房子是新建的，卖家尚未确定价格，或者可能有其他原因。无论如何，缺失的价格与观测数据无关。这是数据\
  \ *完全随机缺失（MCAR）* 的典型示例。要填充此数据，你可能需要使用自己的逻辑。我们确实有一些关于如何处理此类缺失数据的建议，如下所示：\n\n- 均值、中位数或众数填充\n\
  - 基于模型的填充（这将在后续章节中讨论）\n- 多重填充\n- 使用业务逻辑填充缺失信息\n- 删除缺失数据严重的特征（变量选择）\n- 删除包含缺失值的行（最不推荐，因为可能导致信息丢失）\n\
  \n如何使用业务逻辑来填充缺失信息？假设你在 Zillow 工作，并且知道只有当房子挂牌拍卖时，`价格` 信息才会缺失。在这种情况下，你的团队建议你对挂牌拍卖的房屋使用默认价格（比如\
  \ 1 美元）。然后，你就可以用 1 美元来填充价格。\n\n\n\n#### 非随机缺失（MNAR）\n\n当数据非随机缺失时，意味着数据未被收集。在当前示例中，我们不知道房屋的建造年份（`year`）。此信息缺失是因为我们在数据收集过程中未考虑`Year`变量。要解决此问题，您应理解并改进数据收集流程，以纳入缺失的信息。\n\
  \n我们已经详细讨论了缺失值的类型。您能否利用这一点来剔除数据集中的变量？可以。大多数数据科学从业者会根据数据缺失的百分比来剔除变量。例如，您可以剔除缺失值超过\
  \ 80%的变量。80%并非标准值，可根据具体情况调整。\n\n### 练习 4-1：缺失值与基数\n\n下载墨尔本住房数据集：[`https://www.kaggle.com/dansbecker/melbourne-housing-snapshot/data#`](https://www.kaggle.com/dansbecker/melbourne-housing-snapshot/data#)。\n\
  \n**问题 1：** 计算数据集中每个变量的基数。您能否根据基数剔除某些变量？（提示：查找基数为 1 的变量。）\n\n**问题 2：** 计算数据集中每个变量的缺失值百分比。您能否根据缺失值剔除某些变量？（提示：仅针对此练习，剔除缺失值超过\
  \ 45%的变量。）\n\n**问题 3：** 使用中位数填充`YearBuilt`列。（提示：对`relativeError`使用 0.1。）\n\n**问题\
  \ 4：** 填充`BuildingArea`列，创建一个名为`mean_imputed_BuildingArea`的新变量，并计算填充后的新均值。\n\n回到银行数据集，让我们加载数据集并执行基于探索性数据分析（EDA）的变量选择。\n\
  \n```\nfilename = \"bank-full.csv\"\ntarget_variable_name = \"y\" #此变量也可稍后设置\n```\n\
  \n使用以下代码加载数据：\n\n```\nfrom pyspark.sql import SparkSession\nspark = SparkSession.builder.getOrCreate()\n\
  df = spark.read.csv(filename, header=True, inferSchema=True, sep=';')\ndf.show()\n\
  ```\n\n您需要为此数据集提供分号（`;`）作为分隔符，否则无法正常工作。此外，请注意文件加载操作中的新选项`inferSchema`。启用此选项后，它会自动推断数据集中每列的数据类型。图\
  \ 4-4 展示了启用和未启用此选项时的模式推断结果。\n\n![](img/500182_2_En_4_Fig4_HTML.jpg)\n\n图 4-4  \n\
  `inferSchema`选项输出差异\n\n将数据加载到环境后，可参考以下代码开始探索数据：\n\n```\n#数据长度\ndf.count() #45211\n\
  #描述数据\ndf.describe().toPandas() #后续检查缺失值和基数\n#每个变量的类型\ndf.dtypes\ndf.printSchema()\n\
  #按分组统计单个变量计数\ndf.groupBy('education').count().show()\n#目标变量计数\ndf.groupBy(target_variable_name).count().show()\n\
  #多列分组\ndf.groupBy(['education',target_variable_name]).count().show()\n#列聚合\nfrom\
  \ pyspark.sql.functions import *\ndf.groupBy(target_variable_name).agg({'balance':'avg',\
  \ 'age': 'avg'}).show()\n```\n\n我们希望强调图 4-5 中描述的数据输出，并将其与之前讨论的基数和缺失值联系起来。`summary`列中的`count`行给出了变量中非缺失值的数量。总观测值与该列的差值即为每列中的缺失值总数。我们再查看两个统计量：`summary`列中的`min`和`max`行。当某个变量的`min`和`max`行值相同时，该变量的基数为\
  \ 1。如果无法理解，没关系。您可以使用以下代码执行这些检查。\n\n![](img/500182_2_En_4_Fig5_HTML.jpg)\n\n图 4-5\
  \  \n列聚合摘要\n\n### 代码 1：基数检查\n\n此代码片段允许您快速分析 Spark DataFrame 中每列的基数（唯一值的数量），根据指定阈值（`cut_off`）识别任何低基数列，并使用\
  \ pandas 以结构化格式检索结果，以便于操作和解释。\n\n```\n# 基数检查\nfrom pyspark.sql.functions import\
  \ approxCountDistinct, countDistinct\n\"\"\"\n注意：approxCountDistinct 和 countDistinct\
  \ 可互换使用。唯一的区别在于计算时间。\n\"approxCountDistinct\" 适用于大型数据集\n\"countDistinct\" 适用于中小型数据集。\n\
  \"\"\"\ndef cardinality_calculation(df, cut_off=1):\n    cardinality = df.select(*[approxCountDistinct(c).alias(c)\
  \ for c in df.columns])\n    ## 转换为 pandas 以进行高效计算\n    final_cardinality_df = cardinality.toPandas().transpose()\n\
  \    final_cardinality_df.reset_index(inplace=True)\n    final_cardinality_df.rename(columns={0:'Cardinality'},\
  \ inplace=True)\n    #选择基数为 1 的变量\n    vars_selected = final_cardinality_df['index']\n\
  \    [final_cardinality_df['Cardinality'] <= cut_off]\n    return final_cardinality_df,\
  \ vars_selected\ncardinality_df, cardinality_vars_selected = cardinality_calculation(df)\n\
  ```\n\n\n\n#### 代码 2：缺失值检查\n\n```python\n#缺失值检查\nfrom pyspark.sql.functions import\
  \ count, when, isnan, col\n# 如书中所述，miss_percentage 设置为 80%\ndef missing_calculation(df,\
  \ miss_percentage=0.80):\n#检查 NaN 和 null 值\nmissing =\ndf.select(*[count(when(isnan(c)\
  \ | col(c).isNull(), c)).alias(c) for c in df.columns])\n# 计算 DataFrame 的总长度\nlength_df\
  \ = df.count()\n## 转换为 pandas 以便高效计算\nfinal_missing_df = missing.toPandas().transpose()\n\
  final_missing_df.reset_index(inplace=True)\nfinal_missing_df.rename(columns={0:'missing_count'},\
  \ inplace=True)\nfinal_missing_df['missing_percentage'] =\nfinal_missing_df['missing_count']/length_df\n\
  #选择基数为 1 的变量\nvars_selected = final_missing_df['index'][final_missing_df['missing_percentage']\
  \ >= miss_percentage]\nreturn final_missing_df, vars_selected\nmissing_df, missing_vars_selected\
  \ = missing_calculation(df)\n```\n\n对于银行数据集，没有列因这两项检查而被剔除。然而，在实际数据集中，你会看到在执行基数和缺失值检查后，有少量列可以被删除。这就是你需要学习的基于\
  \ EDA 的变量选择技术的全部内容。在继续学习其他选择技术之前，我们还要在 EDA 中再进行一次特征工程练习。这将确保你的数据为下游任务做好准备。请记住图 4-4，其中我们仍然有一些字符串列。下一组选择技术要求所有列都是数值型（整数或浮点数）。\n\
  \n将字符串转换为数值可以通过以下选项之一实现：\n\n![](img/500182_2_En_4_Fig6_HTML.jpg)\n\n图 4-6\n\n独热编码器\n\
  \n1.  单独将列转换为所需的数据类型。这对于大型数据集来说很繁琐。\n\n2.  来自 `pyspark.ml.feature` 的 `OneHotEncoder`（适用于\
  \ Spark >= 3.0）或 `OneHotEncoderEstimator`（适用于 Spark >= 2.3）。此选项将为每个类别创建虚拟变量，从而增加你处理的特征数量。在此数据集中，`education`\
  \ 变量有四个类别：primary、secondary、tertiary 和 unknown。在此列上使用 `OneHotEncoder` 后，输出如图 4-6\
  \ 所示。*注意：PySpark 默认情况下不会产生像图* *4-6* *那样的输出；它需要使用前一章讨论的 UDF 函数进行一些调整。*\n\n![](img/500182_2_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n特征列模式\n\n![](img/500182_2_En_4_Fig7_HTML.jpg)\n\n图 4-7\n\n`StringIndexer`\
  \ 输出\n\n1.  来自 `pyspark.ml.feature` 的 `StringIndexer`。此选项为每个级别分配一个数字。最频繁出现的值将获得索引\
  \ 0，其次是次频繁的值，依此类推。使用 `StringIndexer` 对 `education` 变量的输出将如图 4-7 所示。尽管 `StringIndexer`\
  \ 的输出看起来像有序输出（递增顺序），但不应将其视为有序。大多数算法无法将此变量视为名义输出（互斥级别）。这是 `StringIndexer` 的缺点之一。\n\
  \n1.  最后一个选项是使用加权索引，例如证据权重（WOE），这将在本章后面讨论。它克服了 `StringIndexer` 和 `OneHotEncoder`\
  \ 面临的缺点。它使用目标群体与非目标群体的分布来为每个类别创建权重。\n\n此示例使用 `StringIndexer` 来转换所有列。代码如下所示。\n\n\
  #### 步骤 1：识别变量类型\n\n```python\n# 识别变量类型\ndef variable_type(df):\n# 使用 dtypes 来区分字符变量和数值变量\n\
  vars_list = df.dtypes\nchar_vars = [] #字符变量列表\nnum_vars = [] #数值变量列表\nfor i in vars_list:\n\
  if i[1] in ('string'):\nchar_vars.append(i[0])\nelse:\nnum_vars.append(i[0])\nreturn\
  \ char_vars, num_vars\n#在我们的 DataFrame 上应用 variable_type 函数\nchar_vars, num_vars\
  \ = variable_type(df)\n```\n\n#### 步骤 2：对字符列应用 `StringIndexer`\n\n对步骤 1 中识别的字符变量（`char_vars`）应用\
  \ `StringIndexer` 函数。代码如下：\n\n```python\nfrom pyspark.ml.feature import StringIndexer\n\
  from pyspark.ml import Pipeline\n#将每个类别列转换为索引\ndef category_to_index(df, char_vars):\n\
  char_df = df.select(char_vars)\nindexers =\n[StringIndexer(inputCol=c, outputCol=c+\"\
  _index\", handleInvalid=\"keep\") for c in char_df.columns]\npipeline = Pipeline(stages=indexers)\n\
  char_labels = pipeline.fit(char_df)\ndf = char_labels.transform(df)\nreturn df,\
  \ char_labels\n#在我们的 DataFrame 上应用 category_to_index 函数\ndf, char_labels = category_to_index(df,\
  \ char_vars)\n```\n\n这段代码中有几点需要强调。首先是 `StringIndexer` 操作，它接收一个输入列（`Education`）并生成一个输出列（`Education_index`）。需要注意的一点是\
  \ `handleInvalid` 选项，它被设置为 `keep`，*这样*当你在未来遇到新数据时它仍然可以工作。下一个选项是 `Pipeline` 选项，它按顺序执行步骤。我们将在后续章节中详细介绍管道。当前的\
  \ DataFrame 输出包含旧的字符串列和新的数值列。现在按如下方式将数据子集化为所需的列：\n\n```python\ndf = df.select([c\
  \ for c in df.columns if c not in char_vars])\n```\n\n最后，DataFrame 现在完全是数值型的。有兴趣将\
  \ `_index` 变量重命名为原始名称的人可以使用以下代码执行此操作：\n\n```python\n#将 _index 列重命名为原始变量名\ndef rename_columns(df,\
  \ char_vars):\nmapping = dict(zip([i + '_index' for i in char_vars], char_vars))\n\
  df = df.select([col(c).alias(mapping.get(c, c)) for c in df.columns])\nreturn df\n\
  # 对我们的 DataFrame 应用 rename_columns\ndf = rename_columns(df, char_vars)\n```\n\n\
  #### 步骤 3：对目标列应用 `StringIndexer`\n\n对目标变量 `y` 应用 `StringIndexer` 方法。该方法会创建一个输出列\
  \ `y_index`。由于 `y` 和 `y_index` 是重复列，我们提供了额外的代码来删除重复列并将 `y_index` 重命名为原始列名 `y`。代码如下：\n\
  \n```python\n# StringIndexer 初始化\nindexer = StringIndexer(inputCol='y', outputCol='y_index',\
  \ handleInvalid='skip')\nindexerModel = indexer.fit(df)\n# 使用拟合好的 StringIndexer\
  \ 模型转换 DataFrame\ndf = indexerModel.transform(df)\n# 删除现有的 \"y\" 列，以便将新的 \"y_index\"\
  \ 列重命名为 \"y\"\ndf = df.drop(df.y)\n# 将新的 \"y_index\" 列重命名为 \"y\"\ndf = df.withColumnRenamed('y_index',\
  \ 'y')\n```\n\n\n\n#### 步骤 4：组装特征\n\n最后一步是将各个变量组装成一个单一的特征向量。这样做很有用，因为你可以指向一个变量，而不必在后续步骤中提供各个变量。此外，你还可以选择使用\
  \ `StandardScaler` 或 `MinMaxScaler` 对 DataFrame 进行缩放。这可以通过以下代码实现：\n\n```python\n\
  #assemble features into one vector\nfrom pyspark.ml.feature import VectorAssembler\n\
  #assemble individual columns to one column - 'features'\ndef assemble_vectors(df,\
  \ features_list, target_variable_name):\n    stages = []\n    #assemble vectors\n\
  \    assembler = VectorAssembler(inputCols=features_list, outputCol='features')\n\
  \    stages = [assembler]\n    #select all the columns + target + newly created\
  \ 'features' column\n    selectedCols = [target_variable_name, 'features'] + features_list\n\
  \    #use pipeline to process sequentially\n    pipeline = Pipeline(stages=stages)\n\
  \    #assembler model\n    assembleModel = pipeline.fit(df)\n    #apply assembler\
  \ model on data\n    df = assembleModel.transform(df).select(selectedCols)\n   \
  \ return df\n# exclude target variable and select all other feature vectors\nfeatures_list\
  \ = df.columns\nfeatures_list.remove(target_variable_name)\n# apply the function\
  \ on our DataFrame\ndf = assemble_vectors(df, features_list, target_variable_name)\n\
  ```\n\n如果你希望查看组合特征向量的模式，可以使用以下代码：\n\n```python\ndf.schema[\"features\"].metadata[\"\
  ml_attr\"][\"attrs\"]\n```\n\n要将其转换为漂亮的 pandas DataFrame，可以使用以下代码：\n\n```python\n\
  import pandas as pd\nfeatures_df = pd.DataFrame()\n# Iterate over metadata attributes\
  \ in the 'features' column\nfor k, v in df.schema[\"features\"].metadata[\"ml_attr\"\
  ][\"attrs\"].items():\n    # Convert each attribute dict  'v' into Pandas dataframe\
  \ and append to feature_df\n    final = pd.DataFrame(v)\n    features_df = features_df.append(final,\
  \ ignore_index=True)\n```\n\n就是这样。现在你拥有了一个与下游任务兼容的 DataFrame（`df`）。需要注意的一点是，目标变量\
  \ `y` 在数值转换后看起来如图 4-9 所示。这是因为 `no` 选项的频率高于 `yes` 选项。你需要记住这一点，以便对结果的解释有意义。你也可以根据个人选择，显式地将目标变量转换为所需的数值映射。\n\
  \n![](img/500182_2_En_4_Fig9_HTML.jpg)\n\n**图 4-9** 最终目标映射\n\n**快速练习** 尝试在之前的步骤中使用\
  \ `StandardScaler` 和 `VectorAssembler` 创建一个缩放后的 DataFrame。（提示：你需要在阶段中添加缩放器模型以及组装器。）\n\
  \n## 内置变量选择过程：无目标变量\n\n在机器学习模型设置中，你可以在没有明确目标变量的情况下减少数据的维度。这种类型的降维被称为*数据压缩*。想象一个图像文件。你有多种方法压缩文件，从而减小文件大小。本节讨论\
  \ Spark ML 中现成的两种实现来执行这些任务：PCA 和 SVD。\n\n### 主成分分析（PCA）\n\n主成分分析（PCA）可用于识别大型数据集中的模式。它可以识别数据集中包含最多信息的变量。它是数据集的一种线性表示。如今，我们有像自编码器这样的深度学习算法，它们可以完成相同的工作，并且对于建模复杂的非线性关系非常有用。就本书的范围而言，我们专注于\
  \ PCA。一个通用的经验法则是：分布中心紧密围绕均值的变量通常包含最少的信息。下一节将通过一个简单的例子解释 PCA 的机制。\n\n#### 机制\n\n\
  假设有六位顾客在一年中的不同月份购买了同一品牌和型号的汽车。你想确定最能解释他们满意度的首要变量（见表 4-1）。\n\n**表 4-1** 样本数据\n\n\
  | 参与者 ID | 质量 | 可靠性 |\n| --- | --- | --- |\n| 1 | 10 | 6 |\n| 2 | 9 | 4 |\n| 3 |\
  \ 8 | 5 |\n| 4 | 3 | 3 |\n| 5 | 2 | 2 |\n| 6 | 1 | 1 |\n\n当你使用单个变量 `质量` 并绘制数据时，你会观察到参与者\
  \ 1 到 3 在线的上端彼此靠近，而其余三位参与者则在线的下端。即使只有一条数据线，你也可以推断出前三位参与者和后三位参与者是相似的。在二维空间中绘制这些数据表明，前三位参与者聚集在右上角，后三位参与者聚集在左下角（见图\
  \ 4-10a）。PCA 将指导你识别对这些变量聚类最重要的变量。让我们开始了解 PCA 是如何计算的。\n\n![](img/500182_2_En_4_Fig10_HTML.jpg)\n\
  \n**图 4-10a** 汽车满意度数据\n\n首先，计算两个变量的均值。`质量` 和 `可靠性` 的平均值分别为 5.5 和 3.5。我们将原点从图 4-10b\
  \ 中所示的 (0,0) 移动到 5.5 和 3.5。这是为了确保数据以原点为中心。\n\n![](img/500182_2_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-10b** 带坐标轴的汽车满意度数据\n\n现在我们尝试通过这些点拟合一条线，直到它很好地拟合数据，并且穿过原点。你如何定义这个标准并知道一条线是否拟合得好？嗯，你确实知道，当数据点到直线的投影距离最小时，就是最接近的拟合（点\
  \ 5 被投影到穿过原点的直线上）。同样的条件可以反过来表述为：一条最大化投影点到原点距离的直线（同一图中的深色阴影线）。PCA 通过最大化投影点到原点的平方距离之和来找到最佳拟合线（见图\
  \ 4-10c）。\n\n![](img/500182_2_En_4_Fig12_HTML.jpg)\n\n**图 4-10c** PCA 投影\n\n我们使用平方距离的原因是为了避免任何负值。我们通过旋转一条穿过原点的任意直线开始这个过程，并开始计算从原点到直线上投影点的距离。图\
  \ 4-10c 显示了投影点 5 到原点的距离。高亮的深色线表示该距离。为其余点计算类似的距离，以得出平方距离之和。比较所有这些距离，并选择具有*最大平方距离之和*的直线（见图\
  \ 4-10d）。\n\n![](img/500182_2_En_4_Fig13_HTML.jpg)\n\n**图 4-10d** PCA 线\n\n\n\n\
  该指示线最大化所有点之间距离的平方和。因此，这被视为 PC1，即第一主成分。假设这条线的斜率为 0.25，你可以推断出，在质量方向上每移动四个单位，可靠性就会上升一个单位。这伪性地表明数据在质量轴上完全分散。因此，质量在定义\
  \ PC1 中起着主要作用。该成分可以看作是四个单位质量和一个单位可靠性的线性组合。PC2 就是通过原点且垂直于 PC1 的直线。其变量比率将与 PC1 相反。该成分可以看作是四个单位可靠性和一个单位质量的线性组合。如果将两者都缩放为单位向量，就可以计算主成分的载荷得分。特征值是投影点与已识别主成分原点之间距离的平方和。你可以通过将每个主成分的特征值除以`(样本量\
  \ - 1)`来将其转换为变异量。\n\n以下是 PCA 的 PySpark 实现代码：\n\n```\nfrom pyspark.ml.feature import\
  \ PCA\nfrom pyspark.ml.linalg import Vectors\nno_of_components = 3 #自定义数量\n# 使用指定参数初始化\
  \ PCA\npca = PCA(k=no_of_components, inputCol=\"features\", outputCol=\"pcaFeatures\"\
  )\nmodel = pca.fit(df)\nresult = model.transform(df).select(\"pcaFeatures\")\nresult.show(truncate=False)\n\
  ```\n\n`pcaFeatures` 是 PCA 算法生成的简化特征集，可用于下游的机器学习过程。请注意，我们使用了 16 个输入变量，最终得到了三个成分。本质上，我们将维度大小缩减了五分之四（3/16\
  \ 个特征）。要获取每个变量的载荷得分，可以使用以下代码：\n\n```\nmodel.pc.toArray()\narray([[-3.41021399e-04,\
  \  2.79524640e-04,  2.58353293e-03],\n[-9.99998245e-01,  1.83654726e-03,  1.13892524e-04],\n\
  [-1.22934480e-05,  9.79995613e-04,  7.79347982e-03],\n[-1.83671689e-03, -9.99996986e-01,\
  \ -7.36955549e-04],\n[ 1.48468991e-05,  1.01391994e-03,  2.75121381e-03],\n[-1.13085547e-04,\
  \  7.49207153e-04, -9.99889046e-01],\n[-1.26153895e-05, -6.36100089e-06, -1.04654388e-02],\n\
  [-1.78789640e-05, -4.11817349e-05,  5.51411389e-04],\n[ 6.41085932e-06, -5.23364803e-05,\
  \ -1.45349520e-04],\n[-1.11185424e-05,  1.30366514e-05,  2.01500982e-04],\n[ 2.91665702e-06,\
  \  4.42643869e-06,  3.95562163e-05],\n[-1.12221341e-05,  1.26153926e-05,  6.17569266e-04],\n\
  [ 1.01623400e-05,  1.50687571e-05,  8.23933054e-05],\n[-5.68377754e-07,  6.95393403e-05,\
  \  1.03951369e-03],\n[-7.60886236e-05, -1.16754927e-04, -3.24662847e-03],\n[-8.55162111e-06,\
  \ -6.01853226e-05, -4.94522998e-03]])\n```\n\n现在，让我们将这些载荷得分映射到各个变量。我们使用的是之前提供给`assembler`函数的`features_list`变量。\n\
  \n**表 4-2.** 将载荷得分映射到各个变量\n\n| -![](img/500182_2_En_4_Figa_HTML.jpg) |\n\n你可以看到，`balance`变量主导了\
  \ PC1 成分，`duration`主导了 PC2 成分，而`pdays`主导了 PC3 成分。你应该对这些结果保持谨慎，因为输入数据并未标准化。连续特征因其高方差而主导了\
  \ PCA 的输出。你应该关注的另一个算法输出是每个成分解释的方差。在 PySpark 中，你可以使用以下代码来实现：\n\n```\nmodel.explainedVariance\n\
  #输出: DenseVector([0.9918, 0.0071, 0.0011])\n```\n\n你可以使用以下代码将这些值绘制成图表。这种图表称为碎石图。\n\
  \n```\nimport matplotlib.pyplot as plt\nimport numpy as np\nx = []\nfor i in range(0,\
  \ len(model.explainedVariance)):\n#提取解释方差值及累积和\nx.append('PC' + str(i + 1))\ny =\
  \ np.array(model.explainedVariance)\nz = np.cumsum(model.explainedVariance)\nplt.xlabel('主成分')\n\
  plt.ylabel('解释方差')\nplt.bar(x, y)\nplt.plot(x, z)\n```\n\n如图 4-10e 所示，第一主成分解释了数据中\
  \ 99%的方差。这是因为我们在使用 PCA 之前没有对 DataFrame 进行缩放。因此，让我们在使用 PCA 之前先用`StandardScaler`再运行一次。你会注意到解释方差图发生了巨大变化。\n\
  \n![](img/500182_2_En_4_Fig14_HTML.jpg)\n\n**图 4-10e** 解释方差\n\n```\nfrom pyspark.ml.feature\
  \ import VectorAssembler\nfrom pyspark.ml.feature import StandardScaler\n#将各个列组装并缩放到一个列\
  \ - 'features2'\ndef scaled_assemble_vectors(df, features_list, target_variable_name):\n\
  stages = []\n#组装向量\nassembler = VectorAssembler(inputCols=features_list, outputCol='assembled_features')\n\
  scaler = StandardScaler(inputCol=assembler.getOutputCol(), outputCol='features2')\n\
  stages = [assembler, scaler]\n#选择所有列 + 目标列 + 新创建的 'features' 列\nselectedCols = [target_variable_name,\
  \ 'features2'] + features_list\n#使用流水线顺序处理\npipeline = Pipeline(stages=stages)\n\
  #组装器模型\nscaleAssembleModel = pipeline.fit(df)\n#在数据上应用组装器模型\ndf = scaleAssembleModel.transform(df).select(selectedCols)\n\
  return df\nfeatures_list = df.columns\nfeatures_list.remove(target_variable_name)\n\
  df = scaled_assemble_vectors(df, features_list, target_variable_name)\nfrom pyspark.ml.feature\
  \ import PCA\nfrom pyspark.ml.linalg import Vectors\n# 对缩放后的特征执行 PCA\npca = PCA(k=3,\
  \ inputCol=\"features2\", outputCol=\"pcaFeatures\")\nmodel = pca.fit(df)\nresult\
  \ = model.transform(df).select(\"pcaFeatures\")\nresult.show(truncate=False)\n```\n\
  \n当你使用上述代码新创建的 DataFrame 运行 PCA 时，你会看到第一成分解释的方差发生了巨大变化（见图 4-10f）。在使用 PCA 时，你需要意识到这种情况，尤其是在处理连续变量和分类变量时。\n\
  \n![](img/500182_2_En_4_Fig15_HTML.jpg)\n\n**图 4-10f** 解释方差\n\n```\nmodel.explainedVariance\n\
  #输出: DenseVector([0.1434, 0.0987, 0.0787])\n```\n\n\n\n### 奇异值分解（SVD）\n\n最著名的矩阵分解方法是奇异值分解，简称\
  \ SVD。任何矩阵都可以通过 SVD 进行分解，因此它是一种更稳定的算法。SVD 将一个矩阵分解为三个矩阵：`U`、*Σ* 和 `V`，满足以下关系：\n\n\
  `A = U*Σ*V^T`，\n\n其中：\n\n- `A` 是原始矩阵，维度为 *r* `x` *c*。*r* 代表行数，*c* 代表列数。\n- `U` 是一个\
  \ *r* `x` *r* 的矩阵，也称为 `A` 的左奇异向量。\n- *Σ* 是一个 *r* `x` *c* 的对角矩阵。对角线上的值是原始矩阵 `A` 的奇异值。\n\
  - `V^T` 是一个 *c* `x` *c* 的矩阵，也称为 `A` 的右奇异向量。\n\n那么，这如何应用于变量选择的概念呢？答案在于 *Σ* 分量。假设你有一张包含\
  \ 1000 个特征的图像。使用 SVD，你可以通过访问 *Σ* 矩阵来获取前 *k* 个最大的奇异值。你根据希望在低维表示中保留的信息量来选择这个 *k* 值。在\
  \ PCA 场景中，你可以将其视为解释的方差。假设 1000 个特征中的前 100 (*k*) 个解释了数据中 80% 的信息，并且你认为这可以接受。那么，你将选取前\
  \ 100 个奇异值，并将 *Σ* 矩阵中其余的值替换为 0。然后，得到的低秩矩阵可用于创建原始数据的表示，如下所示：\n\n- `U` – *r* `x` *k*\
  \ 左奇异值\n- *Σ* – *k* `x` *k* 奇异值\n- `V^T` – *c* `x` *k* 右奇异值\n\nSVD 更多地用于图像数据压缩和图像恢复。由于矩阵分解的特性，它在协同过滤推荐系统中分解\
  \ `user x item` 矩阵方面也发挥着巨大作用。以下是用于在此数据中实现 SVD 的 PySpark 代码：\n\n```\nfrom pyspark.mllib.linalg\
  \ import Vectors\nfrom pyspark.mllib.linalg.distributed import RowMatrix\n# 将 DataFrame\
  \ 转换为 rdd\n# 将 df 转换为 RDD 并提取特征为数组\ndf_svd_vector = df.rdd.map(lambda x: x['features'].toArray())\n\
  # 从向量 RDD 创建一个 Rowmatrix\nmat = RowMatrix(df_svd_vector)\n# 计算前 5 个奇异值及对应的奇异向量。\n\
  svd = mat.computeSVD(5, computeU=True)\nU = svd.U       # U 因子是一个 RowMatrix。\ns\
  \ = svd.s       # 奇异值存储在一个本地稠密向量中。\nV = svd.V       # V 因子是一个本地稠密矩阵。\n```\n\n你可以阅读更多关于矩阵特征值分解的内容，以更深入地理解\
  \ SVD。现在，我们继续讨论基于目标的变量缩减。\n\n## 内置变量选择过程：结合目标变量\n\n本节探讨有监督的变量选择技术。\n\n### 卡方选择器\n\
  \n`ChiSq` 代表*卡方*。它也被称为“拟合优度”统计量，用符号 ***χ2*** 表示。它使用*卡方独立性检验*来选择最佳特征。当处理分类变量时，这种选择过程非常有用。如果你更倾向于使用连续变量，则需要在使用此技术之前将它们分箱处理。我们将使用泰坦尼克号数据集示例（`https://www.kaggle.com/c/titanic`）来详细解释卡方检验。\n\
  \n图 4-11 中所示的表格称为*列联表*。通过观察该表，你可以注意到女性幸存者的比例（231/340 = 67.9%）远高于男性幸存者的比例（109/340\
  \ = 32.0%）。这是否意味着 `Gender` 和 `Survived` 之间存在关系？嗯，你可以使用卡方检验来回答这个问题。在卡方检验中，原假设和备择假设如下：\n\
  \n![](img/500182_2_En_4_Fig16_HTML.jpg)\n\n图 4-11\n\n泰坦尼克号示例：性别与幸存情况\n\n- *原假设：两个变量之间没有关系。*\n\
  - *备择假设：两个变量之间存在关系。*\n\n我们对此检验使用 5% 的显著性水平。卡方检验的公式如下：\n\n![$$ {\\chi}²=\\sum \\\
  frac{{\\left(O-E\\right)}²}{E} $$](img/500182_2_En_4_Chapter_TeX_Equa.png)\n\n*χ2\
  \ – 卡方值，O – 观测数据，E – 期望数据*\n\n观测数据指的是前面表格中的数据。期望数据是根据总计计算得出的。表 4-3 提供了所有四个单元格的期望值。\n\
  \n表 4-3\n\n期望值\n\n| *性别 = 女性 且 幸存 = 否* | (312*549)/889 = 192.67 |\n| *性别 = 女性 且\
  \ 幸存 = 是* | (312*340)/889 = 119.32 |\n| *性别 = 男性 且 幸存 = 否* | (577*549)/889 = 356.32\
  \ |\n| *性别 = 男性 且 幸存 = 是* | (577*340)/889 = 220.67 |\n\n我们使用前面展示的公式计算了卡方值，并将*卡方*列求和，得到表\
  \ 4-4 中的总卡方值。\n\n表 4-4\n\n卡方值\n\n| 单元格 | 观测值 | 期望值 | 卡方值 |\n| --- | --- | --- |\
  \ --- |\n| *性别 = 女性 且 幸存 = 否* | 81 | 192.67 | 64.72 |\n| *性别 = 女性 且 幸存 = 是* | 231\
  \ | 119.32 | 104.51 |\n| *性别 = 男性 且 幸存 = 否* | 468 | 356.32 | 34.99 |\n| *性别 = 男性\
  \ 且 幸存 = 是* | 109 | 220.67 | 56.51 |\n|   |   | 总计 | 260.75 |\n\n最后一步是计算自由度，使用以下公式：\n\
  \n```\ndegrees_of_freedom 或 df = (r – 1) * (c – 1)\n```\n\n其中\n\n```\nr = 行数\nc\
  \ = 列数\n```\n\n在此示例中，*r* = 2（`Gender` 有两行），*c* = 2（`Survived` 有两列）。因此，自由度为 1。好了，万事俱备。现在我们可以使用卡方分布表（`https://people.richland.edu/james/lecture/m170/tbl-chi.html`）或在线卡方计算器（`https://stattrek.com/online-calculator/chi-square.aspx`）来计算\
  \ p 值。此实验的 p 值接近于 0。这意味着我们的结果是显著的，因此我们可以拒绝原假设。从而，我们可以得出结论：`Gender` 和 `Survived`\
  \ 之间存在关系。\n\n注意\n\n卡方检验对较小的频数很敏感。当单元格中的期望值小于 5 时，可能会导致结论出现错误。\n\n\n\n### 变量选择的相关性\n\
  \n这与变量选择有何关联？在此示例中，我们计算了一个卡方值（260.75），它揭示了`Gender`和`Survived`两个变量之间的关系。当关系较强时，卡方值会较高，反之亦然。在变量选择场景中，你可以选择卡方值较高的变量，因为它们与目标变量关系密切，从而能提升预测结果。\n\
  \n> **注意**  \n> 卡方检验不衡量关系的强度。你应该使用相关性（`correlation`）来确定关系的强度。\n\n基于卡方检验的选择代码如下所示。你可能需要重新运行组装后的向量，因为在此类选择中我们只处理分类变量。\n\
  \n```python\n# 仅选择数据集中存在的分类特征\nfeatures_list = char_vars  # 此选项仅用于 ChiSqSelector\n\
  # 在运行此代码前，请使用更新后的特征列表重新运行组装向量\nfrom pyspark.ml.feature import ChiSqSelector\nfrom\
  \ pyspark.ml.linalg import Vectors\n\n# 初始化 ChiSqSelector 实例\nselector = ChiSqSelector(numTopFeatures=6,\
  \ featuresCol=\"features\",\n                         outputCol=\"selectedFeatures\"\
  , labelCol=\"y\")\n# 在数据上拟合选择器\nchi_selector = selector.fit(df)\n# 获取结果数据集\nresult\
  \ = chi_selector.transform(df)\n# 输出结果\nprint(\"ChiSqSelector output with top %d\
  \ features selected\" % selector.getNumTopFeatures())\nprint(\"Selected Indices:\
  \ \", chi_selector.selectedFeatures)\nfeatures_df['chisq_importance'] = features_df['idx'].apply(lambda\
  \ x: 1 if x in chi_selector.selectedFeatures else 0)\nprint(features_df)\n```\n\n\
  我们已成功为分类变量实现了基于卡方检验的特征选择技术。\n\n### 基于模型的特征选择\n\n基于模型的特征选择需要你构建一个机器学习模型来找出重要特征。我们将在下一章详细讨论这些模型。现在，假设你想让计算机区分*狗*和*猫*。对人类来说，区分它们很容易，但对计算机来说，自己学会这一点却很难。这时就需要机器学习模型登场了。模型教会计算机寻找特定信息来区分狗和猫。模型用来学习的这些特定信息被称为*特征*。某个特征提供的信息越多，该特征对建模过程就越重要。\n\
  \n在 PySpark 中，基于树的方法（决策树、随机森林和梯度提升）默认提供了这一功能。本节侧重于特征重要性方面，而非实际模型。以下代码计算了特征重要性。我们在银行数据集示例中使用了随机森林。你可以用其他算法复现同样的过程。\n\
  \n```python\nfrom pyspark.ml.classification import RandomForestClassifier\n\nrf\
  \ = RandomForestClassifier(featuresCol='features', labelCol=target_variable_name)\n\
  rf_model = rf.fit(df)\nrf_model.featureImportances\n# 输出：\n# SparseVector(16, {0:\
  \ 0.0381, 1: 0.0088, 2: 0.0048, 3: 0.4557, 4: 0.002, 5: 0.0347, 6: 0.0313, 7: 0.0021,\
  \ 8: 0.0019, 9: 0.001, 10: 0.0001, 11: 0.0112, 12: 0.0017, 13: 0.0215, 14: 0.1484,\
  \ 15: 0.2366})\n```\n\n就这样，我们现在得到了特征重要性分数。我们可以使用以下代码来格式化输出。还记得我们在向量组装部分创建的`features_df`\
  \ DataFrame 吗？我们将在这里用到它。\n\n```python\nimport pandas as pd\n\nfeatures_df = pd.DataFrame()\n\
  for k, v in df.schema[\"features\"].metadata[\"ml_attr\"][\"attrs\"].items():\n\
  \    final = pd.DataFrame(v)\n    features_df = features_df.append(final, ignore_index=True)\n\
  \n# 临时输出 rf_output\nrf_output = rf_model.featureImportances\nfeatures_df['Importance']\
  \ = features_df['idx'].apply(lambda x: rf_output[x] if x in rf_output.indices else\
  \ 0)\n# 按重要性降序排序\nfeatures_df.sort_values(\"Importance\", ascending=False, inplace=True)\n\
  ```\n\n现在我们得到了一个漂亮的表格，如图 4-12 所示。最重要的特征是`duration`，其次是`poutcome`，依此类推。\n\n![Figure\
  \ 4-12](img/500182_2_En_4_Fig17_HTML.jpg)\n\n**图 4-12** 随机森林：特征重要性\n\n此外，你可以使用此表格创建特征重要性图，如图\
  \ 4-13 所示。\n\n![Figure 4-13](img/500182_2_En_4_Fig18_HTML.jpg)\n\n**图 4-13** 特征重要性图\n\
  \n```python\nimport matplotlib.pyplot as plt\n\n# 仅为了绘图，将其按升序排序\nfeatures_df.sort_values(\"\
  Importance\", ascending=True, inplace=True)\nplt.barh(features_df['name'], features_df['Importance'])\n\
  plt.title(\"Feature Importance Plot\")\nplt.xlabel(\"Importance Score\")\nplt.ylabel(\"\
  Variable Importance\")\n```\n\n很酷，对吧？你可以使用其他算法来完成同样的任务。然而，在处理大型数据集时，基于随机森林的特征选择会使过程变得简单得多。使用基于树的方法的一个缺点是，它使用训练数据集来计算特征重要性。这可能会夸大数值型和高基数变量的重要性。为了克服这一点，你可以使用*排列重要性*，它使用测试数据集来计算特征重要性。排列重要性超出了本书的讨论范围。\n\
  \n> **注意**  \n> 当你使用线性模型（如逻辑回归）时，请使用模型的系数来展示特征重要性。系数的*绝对值*越高，变量越重要，反之亦然。\n\n最后，我们关注*连续型*和*多项型*目标变量。\n\
  \n1.  对于连续型目标变量，你可以使用回归树（`RandomForestRegressor`或其他树模型），这些可以从`pyspark.ml.regression`模块中获取。对于连续模型，你需要使用`LinearRegression`模块而不是`LogisticRegression`。其余讨论的代码可以复用来计算特征重要性。\n\
  2.  对于多项型目标变量，你仍然可以使用本节讨论的基于树的模型，但线性模型`LogisticRegression`除外。在处理多项型目标变量时，使用逻辑回归计算特征重要性有点棘手。对于此类目标变量，我们建议你坚持使用基于树的模型。\n\
  \n到目前为止，我们一直在看代码，而没有深入探讨特征重要性计算背后的公式。别担心。在下一章讨论树模型时，我们会重新回顾这一节。\n\n**练习 4-2：基于模型的选择**\n\
  \n你可以使用银行数据集或住房数据集。\n\n**问题 1：** 实现决策树特征重要性。将其与随机森林的输出进行比较和对比。\n\n**问题 2：** 实现梯度提升树特征重要性。将其与随机森林的输出进行比较和对比。\n\
  \n**问题 3：** 实现逻辑回归特征重要性。将其与随机森林的输出进行比较和对比。（提示：使用逻辑回归的系数。注意：逻辑回归生成的是稠密向量而非稀疏向量。）\n\
  \n## 自定义变量选择过程\n\n本节介绍一些自定义的变量选择技术。\n\n\n\n### 使用证据权重的信息价值\n\n证据权重（`WOE`）和信息价值（`IV`）是进行变量转换和选择的简单而强大的技术。这些概念与逻辑回归建模技术密切相关。它们广泛应用于信用评分中，用于衡量好客户与坏客户的区分度。例如，如果你试图预测客户是否会违约，所有违约的客户将被视为事件，而未违约的客户则可视为非事件。\n\
  \n计算`WOE`和`IV`的公式如下：\n\n![$$ WOE=\\ln \\kern0.5em \\left(\\frac{\\mathrm{Event}\\\
  %}{\\mathrm{Non}\\kern0.17em \\mathrm{Event}\\%}\\right) $$](img/500182_2_En_4_Chapter_TeX_Equb.png)\n\
  \n![$$ IV=\\sum \\left( Event\\%- Non\\kern0.17em Event\\%\\right)\\ast \\ln \\\
  kern0.5em \\left(\\frac{\\mathrm{Event}\\%}{\\mathrm{Non}\\kern0.17em \\mathrm{Event}\\\
  %}\\right) $$](img/500182_2_En_4_Chapter_TeX_Equc.png)\n\n或者简化为：\n\n![$$ IV=\\sum\
  \ \\left( Event\\%- Non\\kern0.17em Event\\%\\right)\\ast (WOE) $$](img/500182_2_En_4_Chapter_TeX_Equd.png)\n\
  \n图 4-14 展示了如何计算这些值。\n\n![](img/500182_2_En_4_Fig19_HTML.jpg)\n\n**图 4-14** WOE\
  \ 和 IV 计算\n\n`WOE`转换的优点如下：\n\n1.  处理缺失值。\n2.  处理异常值。\n3.  转换基于分布的对数值，这与逻辑回归的输出函数一致。\n\
  4.  无需创建虚拟变量。\n5.  使用适当的分箱技术可以在自变量和因变量之间建立单调关系（递增或递减）。\n\n此外，`IV`值可用于根据图 4-15 所示的预测能力表来选择变量。\n\
  \n![](img/500182_2_En_4_Fig20_HTML.jpg)\n\n**图 4-15** IV 与预测能力\n\n如图 4-14 所示，计算`WOE`和`IV`需要类别数据。现在，你可能会想，对于连续变量该怎么办？如前所述，在执行`WOE`和`IV`计算之前，应使用适当的分箱技术将连续变量转换为分类变量。当连续变量数量较少时（例如少于十个），你可以创建自定义分箱，并将其用于`WOE`计算。即便如此，创建自定义分箱也是一项繁琐的任务。现在，考虑一个包含数百个连续变量的大型数据集。创建自定义分箱将是一场噩梦。这正是单调分箱发挥作用的地方。\n\
  \n#### 使用斯皮尔曼相关系数的单调分箱\n\n首先，让我们考虑一下*单调*的含义。见图 4-16。\n\n![](img/500182_2_En_4_Fig21_HTML.jpg)\n\
  \n**图 4-16** 单调与非单调\n\n如图 4-16 所示，在前两种情况下，随着 x 轴变量的增加，y 轴的值呈现单一趋势：增加或减少。这是一种单调关系。在第三种情况下，x\
  \ 轴变量的变化没有单一趋势：既不是持续增加也不是持续减少。因此，它是非单调的。在解释性目的方面，单调关系是有益的。当两个变量呈现单调关系时，你可以轻松地向非技术受众解释结果。例如，假设`balance`和`target`变量之间存在关系，如图\
  \ 4-17 所示。\n\n![](img/500182_2_En_4_Fig22_HTML.jpg)\n\n**图 4-17** 余额与目标分箱\n\n查看此图，你可以轻松地说：“随着余额增加，目标转化率增加。”这个结果对于非技术受众来说很容易理解。\n\
  \n要执行单调分箱，你需要了解斯皮尔曼相关系数。斯皮尔曼相关系数衡量两个变量之间单调关联的强度和方向。那么，它与皮尔逊相关系数有何不同？皮尔逊相关系数检验的是两个变量之间的线性关系，而斯皮尔曼相关系数衡量的是单调关系。在这种情况下，图\
  \ 4-16 中的第二个图对于皮尔逊相关系数来说可能具有中等程度的线性关系。然而，斯皮尔曼相关系数会将其视为强单调关系。斯皮尔曼相关系数也称为*秩相关系数*。\n\
  \n#### 如何手动计算斯皮尔曼相关系数？\n\n斯皮尔曼相关系数的公式如下：\n\n![$$ \\rho =1-\\frac{6\\sum {d}_i²}{n\\\
  left({n}²-1\\right)} $$](img/500182_2_En_4_Chapter_TeX_Eque.png)\n\n这里，`ρ`是斯皮尔曼相关系数，`d[i]`是配对秩次的差值，`n`是案例数量。当存在并列秩次时，你需要使用以下公式。秩次是结果集中的有序编号。\n\
  \n![$$ \\rho =\\frac{\\sum \\limits_i\\left({x}_i-\\overline{x}\\right)\\kern0.5em\
  \ \\left({y}_i-\\overline{y}\\right)}{\\sqrt{\\sum \\limits_i{\\left({x}_i-\\overline{x}\\\
  right)}²\\kern0.5em {\\sum}_i{\\left({y}_i-\\overline{y}\\right)}²}} $$](img/500182_2_En_4_Chapter_TeX_Equf.png)\n\
  \n这里，`i`是配对的分数。现在，我们仅使用第一个公式来计算斯皮尔曼相关系数（见图 4-18）。\n\n![](img/500182_2_En_4_Fig23_HTML.jpg)\n\
  \n**图 4-18** 斯皮尔曼相关系数计算\n\n使用`d[i]²`为 20，`n`为 7，你可以通过第一个公式计算`ρ`值：\n\n```\np = 1\
  \ - ((6*20)/(7*((7*7) - 1))) = 0.64285714\n```\n\n我们从数字 0.64 中推断出什么？通常，斯皮尔曼相关系数的取值范围是-1\
  \ 到+1。当该值接近 1 或-1 时，两个变量之间的单调关系越强。当该值接近 0 时，两个变量之间不存在单调关系。在这个例子中，数学和物理成绩表现出强单调关系。图\
  \ 4-19 展示了判断关系强度的指南。\n\n![](img/500182_2_En_4_Fig24_HTML.jpg)\n\n**图 4-19** 斯皮尔曼相关系数值指南\n\
  \n#### 如何使用斯皮尔曼相关系数为连续变量创建单调分箱？\n\n在单调分箱的代码中，请注意`mono_bin()`函数使用了一个`max_bin`选项。这是一个用户指定的值。对于连续变量，我们从用户提供的`max_bin`开始，并在每一步中减少分箱数量。我们根据`max_bin`创建分位数。接下来，我们根据新创建的分位数分箱和目标变量计算斯皮尔曼相关系数。直到我们在连续变量和目标变量之间建立强单调关系之前，我们会持续减少`max_bin`值以创建新的分位数并计算斯皮尔曼值。当两个变量之间达到强相关性时，分箱过程停止。\n\
  \n以下是计算`WOE`和`IV`的完整代码，包括针对连续变量的单调分箱选项。我们提供了从数据加载到`WOE`和`IV`计算的完整代码。此代码可用于任何数据集。并且，该代码作为自学材料提供。\n\
  \n\n\n```markdown\n# 默认参数\n\n```python\nfrom pyspark.sql import SparkSession\nspark\
  \ = SparkSession.builder.getOrCreate()\ndataset = 2 # 1 或 2\n```\n\n# 加载数据集\n\n\
  ```python\nfrom pyspark.sql import functions as F\n"
- "# 如果选项设置为 1，则加载银行数据集\nif dataset == 1:\n    target_variable_name = 'y'\n    # 文件位置和类型\n\
  \    file_location = '/FileStore/tables/bank_full.csv'\n    file_type = 'csv'\n\
  \    # CSV 选项\n    infer_schema = 'true'\n    first_row_is_header = 'true'\n   \
  \ delimiter = ';'\n    # 以下选项适用于 CSV 文件。对于其他文件类型，这些选项将被忽略。\n    df = spark.read.format(file_type)\
  \ \\\n        .option('inferSchema', infer_schema) \\\n        .option('header',\
  \ first_row_is_header) \\\n        .option('sep', delimiter) \\\n        .load(file_location)\n\
  \    df = df.withColumn(target_variable_name, F.when(df[target_variable_name] ==\
  \ 'no', 0).otherwise(1))\n"
- "# 如果选项未设置为 1，则加载住房数据集\nelse:\n    #filename = \"melb_data.csv\"\n    target_variable_name\
  \ = 'type'\n    file_location = '/FileStore/tables/melb_data.csv'\n    file_type\
  \ = 'csv'\n    # CSV 选项\n    infer_schema = 'true'\n    first_row_is_header = 'true'\n\
  \    delimiter = ','\n    # 以下选项适用于 CSV 文件。对于其他文件类型，这些选项将被忽略。\n    df = spark.read.format(file_type)\
  \ \\\n        .option('inferSchema', infer_schema) \\\n        .option('header',\
  \ first_row_is_header) \\\n        .option('sep', delimiter) \\\n        .load(file_location)\n\
  \    df = df.withColumn(target_variable_name, F.when(df[target_variable_name] ==\
  \ 'h', 0).otherwise(1))\ndf.show()\n"
- "# 目标变量检查\ndf.groupby(target_variable_name).count().show()\n```\n\n# 识别变量类型并执行一些操作\n\
  \n```python\ndef variable_type(df):\n    vars_list = df.dtypes\n    char_vars =\
  \ []\n    num_vars = []\n    for i in vars_list:\n        if i[1] in ('string'):\n\
  \            char_vars.append(i[0])\n        else:\n            num_vars.append(i[0])\n\
  \    return char_vars, num_vars\nchar_vars, num_vars = variable_type(df)\nif dataset\
  \ != 1:\n    char_vars.remove('Address')\n    char_vars.remove('SellerG')\n    num_vars.remove('Date')\n\
  \    char_vars.remove('Suburb')\n    num_vars.remove(target_variable_name)\nfinal_vars\
  \ = char_vars + num_vars\n```\n\n# WOE 和 IV 代码\n\n```python\nfrom pyspark.sql import\
  \ functions as F\nimport pandas as pd\nimport numpy as np\nfrom pyspark.ml.feature\
  \ import QuantileDiscretizer\nfrom pyspark.ml.feature import VectorAssembler\nimport\
  \ scipy.stats.stats as stats\n```\n\n## 默认参数\n\n- 用于斯皮尔曼相关性的 `rho` 值。您可以调整此值：`custom_rho\
  \ = 1`\n- 初始分箱的最大数量。它将从此数量开始递减。可调参数：`max_bin = 20`\n\n## 此函数基于 PySpark 输出计算 WOE\
  \ 和 IV 值。\n\n注意：此部分代码基于 Python 实现，以提高效率。\n\n```python\ndef calculate_woe(count_df,\
  \ event_df, min_value, max_value, feature):\n    # 实现 WOE 和 IV 计算图中所示的表格结构\n   \
  \ woe_df = pd.merge(left=count_df, right=event_df)\n    woe_df['min_value'] = min_value\n\
  \    woe_df['max_value'] = max_value\n    woe_df['non_event'] = woe_df['count']\
  \ - woe_df['event']\n    woe_df['event_rate'] = woe_df['event']/woe_df['count']\n\
  \    woe_df['nonevent_rate'] = woe_df['non_event']/woe_df['count']\n    woe_df['dist_event']\
  \ = woe_df['event']/woe_df['event'].sum()\n    woe_df['dist_nonevent'] = woe_df['non_event']/woe_df['non_event'].sum()\n\
  \    woe_df['woe'] = np.log(woe_df['dist_event']/woe_df['dist_nonevent'])\n    woe_df['iv']\
  \ = (woe_df['dist_event'] -\n                    woe_df['dist_nonevent'])*woe_df['woe']\n\
  \    woe_df['varname'] = [feature]* len(woe_df)\n    woe_df = woe_df[['varname','min_value',\
  \ 'max_value', 'count', 'event', 'non_event', 'event_rate', 'nonevent_rate', 'dist_event','dist_nonevent','woe',\
  \ 'iv']]\n    # 将无穷大值替换为零以进行 IV 计算\n    woe_df = woe_df.replace([np.inf, -np.inf],\
  \ 0)\n    # 特征 IV 值的总和\n    woe_df['iv'] = woe_df['iv'].sum()\n    return woe_df\n\
  ```\n\n## 与斯皮尔曼相关性一起实现的单调分箱函数\n\n```python\ndef mono_bin(temp_df, feature, target,\
  \ n = max_bin):\n    r = 0\n    while np.abs(r) < custom_rho and n > 1:\n      \
  \  try:\n            # 分位数离散器将数据切割成相等数量的观测值\n            qds = QuantileDiscretizer(numBuckets=n,\
  \ inputCol=feature, outputCol='buckets', relativeError=0.01)\n            bucketizer\
  \ = qds.fit(temp_df)\n            temp_df = bucketizer.transform(temp_df)\n    \
  \        # 创建 corr_df 是基于 Python 的实现，以提高效率；按组分组并计算特征和目标变量的平均值\n            corr_df\
  \ = temp_df.groupby('buckets').agg({feature:'avg', target:'avg'}).toPandas()\n \
  \           corr_df.columns = ['buckets', feature, target]\n            r, p = stats.spearmanr(corr_df[feature],\
  \ corr_df[target]) #斯皮尔曼相关性\n            # 如果未满足相关性条件，则减少分箱数量\n            n = n\
  \ - 1\n        except Exception as e:\n            n = n - 1\n    return temp_df\n\
  ```\n\n## 对数据集中的所有变量执行 WOE\n\n```python\ndef execute_woe(df, target):\n    count\
  \ = -1\n    for feature in final_vars:\n        # 如果特征不是目标列名则执行。作为额外检查提供。\n    \
  \    if feature != target:\n            count = count + 1\n            temp_df =\
  \ df.select([feature, target])\n            # 在进行 WOE 计算之前，对数值变量执行单调分箱\n       \
  \     if feature in num_vars:\n                temp_df = mono_bin(temp_df, feature,\
  \ target, n = max_bin)\n            # 对数值变量进行分组\n            grouped = temp_df.groupby('buckets')\n\
  \        else:\n            # 仅对分类变量进行分组\n            grouped = temp_df.groupby(feature)\n\
  \        #每个分组的计数和事件值\n        count_df = grouped.agg(F.count(target).alias('count')).toPandas()\n\
  \        event_df = grouped.agg(F.sum(target).alias('event')).toPandas()\n     \
  \   # 存储变量的最小值和最大值。对于分类变量，两者取相同值。\n        if feature in num_vars:\n           \
  \ min_value = grouped.agg(F.min(feature).alias('min')).toPandas()['min']\n     \
  \       max_value = grouped.agg(F.max(feature).alias('max')).toPandas()['max']\n\
  \        else:\n            min_value = count_df[feature]\n            max_value\
  \ = count_df[feature]\n        #计算 WOE 和 IV\n        temp_woe_df = calculate_woe(count_df,\
  \ event_df, min_value, max_value, feature)\n        #创建最终数据集\n        if count ==\
  \ 0:\n            final_woe_df = temp_woe_df\n        else:\n            final_woe_df\
  \ = final_woe_df.append(temp_woe_df, ignore_index=True)\n    # 创建单独的 IV 数据集\n  \
  \  iv = pd.DataFrame({'IV':final_woe_df.groupby('varname').iv.max()})\n    iv =\
  \ iv.reset_index()\n    return final_woe_df, iv\n```\n\n## 调用 WOE 和 IV 代码\n\n```python\n\
  output, iv = execute_woe(df, target_variable_name)\n```\n\n以上就是全部内容。现在您已经完成了证据权重和信息值的计算。\n\
  ```\n\n\n\n### 自定义转换器\n\n到目前为止，本章一直在介绍 Spark ML 中可用于执行变量选择的一些高级 API（前面讨论过的内置选择技术）。本节将创建一个自定义的\
  \ Spark ML 转换器来实现同样的功能。为什么我们需要讨论自定义转换器呢？\n\n花点时间思考一下前面用于变量选择的 `RandomForest` 代码：\n\
  \n```\nfrom pyspark.ml.classification import RandomForestClassifier\nrf = RandomForestClassifier(featuresCol='features',\
  \ labelCol=target_variable_name)\nrf_model = rf.fit(df)\nrf_model.featureImportances\n\
  ```\n\n仅用几行代码，我们就完成了以下操作：(1) 调用了 `RandomForest`；(2) 定义了一个 `RandomForest` 对象的实例；(3)\
  \ 在数据集上拟合模型；(4) 显示了重要性得分。这就是面向对象编程（OOP）的强大之处。以下是 OOP 概念的快速回顾：\n\n1. *类* – 用户定义的蓝图，用于创建对象实例。在第\
  \ 2 行中，`RandomForestClassifier` 是一个类，`rf` 是对象实例。\n\n2. *方法* – 在类内部编写的函数。在第 3 行中，`fit`\
  \ 函数就是一个方法。\n\n3. *抽象* – 这是一种概念，通过它只向用户展示必要的信息。这被称为实现隐藏。在前面展示的 `RandomForestClassifier`\
  \ 代码中，我们只提供了输入变量、目标和数据集来拟合模型。我们看不到关于随机森林模型如何在后台实现的任何细节。\n\n4. *封装* – 这是一种向用户隐藏信息的概念。这被称为信息隐藏。任何变量/方法都可以使用这种技术进行隐藏。变量/方法可以是*受保护的*（前面加单下划线，不能在类外部访问，但可以在类及其子类中访问），或者是*私有的*（前面加双下划线，只能在类内部访问）。当你查看源代码时，你可能仍然能看到这些变量/方法。所以，它们在概念上是隐藏的，但在视觉上并非不可见。\n\
  \n5. *继承* – 这是一种概念，通过它你可以继承父类的特性来创建子类。想象一个正方形对象。从技术上讲，它是一个所有边都相等的矩形。在这种情况下，`rectangle`\
  \ 是父类，`square` 是子类。\n\n6. *多态* – 这是一种概念，通过它你可以改变对象的特性。这意味着你可以让同一个对象执行除常规操作之外的多种操作。想想加法（`+`）符号。最初，它只能对数值变量求和。在\
  \ Python 中，当你在字符串之间使用加法时，它会将它们连接起来。当你执行这段代码——`print(\"Hello \" + \"World\")`——它会连接字符串以生成\
  \ `Hello World` 输出。在这种情况下，加法（`+`）符号既可以添加字符串，也可以添加数值。这就是多态的一个例子。\n\n使用 OOP 概念，你可以创建一个强大的机器学习类对象。这使得最终用户可以轻松使用你自己的代码。这些对象也更容易组合成一个单一的流水线或工作流，从而创建一个高效的端到端流程。下一节将快速介绍用于创建此类自定义代码的主要概念。\n\
  \n#### 流水线中的主要概念\n\n* *DataFrame*：在一个单一的机器学习数据集中组织的不同数据类型的集合。\n\n* *Estimator*：用于将一个函数*拟合*到\
  \ DataFrame。在 `RandomForestClassifier` 中，`fit` 函数就是 estimator。\n\n* *Transformer*：用于将一个\
  \ DataFrame *转换*为另一个。有时，transformer 需要先拟合一个函数才能应用。在 `RandomForestClassifier` 中，`predict`\
  \ 函数就是一个 transformer。\n\n* *Pipeline*：一个机器学习工作流或一系列步骤，用于获得最终结果。\n\n* *Parameter*：estimator\
  \ 和 transformer 使用统一的 API 来指定参数。\n\n本示例创建一个自定义的相关性 `class`，并将其用于变量选择。我们将演示流水线的用例。在查看任何实现之前，让我们快速浏览一下用于计算数据集相关性的代码。\n\
  \n```\nfrom pyspark.mllib.stat import Statistics\nimport pandas as pd\ncorrelation_type\
  \ = 'pearson' # 'pearson', 'spearman'\n#transformer function\nfeatures_df = pd.DataFrame()\n\
  for k, v in df.schema[\"features\"].metadata[\"ml_attr\"][\"attrs\"].items():\n\
  final = pd.DataFrame(v)\nfeatures_df=features_df.append(final,ignore_index=True)\n\
  column_names = list(features_df['name'])\ndf_vector = df.rdd.map(lambda x: x['features'].toArray())\n\
  #generate correlation-matrix using  Statistics.corr\nmatrix = Statistics.corr(df_vector,\
  \ method=correlation_type)\ncorr_df = pd.DataFrame(matrix, columns=column_names,\
  \ index=column_names)\n```\n\n前面的代码生成了一个包含相关性结果的 pandas DataFrame。我们将添加更多代码来扩展其功能。我们包含了一个选项，可以使用外部参数来查找相关性最强的变量。\n\
  \n```\n#transformer continuation\nfinal_corr_df = pd.DataFrame(corr_df.abs().unstack().sort_values(kind='quicksort')).reset_index()\n\
  final_corr_df.rename({'level_0': 'col1', 'level_1': 'col2', 0: 'correlation_value'},\
  \ axis=1, inplace=True)\nfinal_corr_df = final_corr_df[final_corr_df['col1'] !=\
  \ final_corr_df['col2']]\ncorrelation_cutoff = 0.65 #custom parameter\nfinal_corr_df[final_corr_df['correlation_value']\
  \ > correlation_cutoff]\n```\n\n我们建议你在使用自定义 `class` 之前，先感受一下前面的代码。\n\n```\n# Import\
