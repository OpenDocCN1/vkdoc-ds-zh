  \ \"请为相关性类型提供一个有效的选项。'pearson' 或 'spearman'。\"\n#self.correlation_type 是类参数\nself.correlation_type\
  \ = correlation_type\nassert 0.0  self.correlation_cutoff]\n# 返回完整的相关矩阵和筛选后的矩阵\n\
  return corr_df, shortlisted_corr_df\n```\n\n瞧！你现在有了一个自定义的相关性 `class`，它的工作方式与任何 Spark\
  \ ML 对象类似。这段代码可以保存在一个名为 `customcorrelation.py` 的独立 Python 文件中。让我们来测试这个新类。\n\n\n\n\
  ```python\nfrom customcorrelation import CustomCorrelation\nclf = CustomCorrelation(inputCol='features')\n\
  output, shorlisted_output = clf.transform(df)\n```\n\n仅此而已。你仅用三行代码就计算了数据集中输入特征之间的相关性。这与之前看到的\
  \ `RandomForestClassifier` 调用类似。有人可能会质疑，我们是否可以用用户自定义函数（`udfs`）实现同样的功能。从代码抽象的角度来看，你是对的；然而，`udfs`\
  \ 无法融入管道工作流。到目前为止的所有努力，都是为了确保工作流管道的兼容性。那么，我们也来测试一下这个特性。为了演示这一特性，我们将向量组装步骤和相关性步骤合并到一个管道中。如果你需要重新运行代码，需要执行到本章前面讨论的“步骤\
  \ 2：对字符列应用 `StringIndexer`”为止。\n\n```python\nfrom pyspark.ml.feature import VectorAssembler\n\
  from customcorrelation import CustomCorrelation\nfrom pyspark.ml import Pipeline\n\
  # 移除特征向量\ndf = df.drop(*['features2','features'])\n# 排除目标变量，选择所有其他特征向量\nfeatures_list\
