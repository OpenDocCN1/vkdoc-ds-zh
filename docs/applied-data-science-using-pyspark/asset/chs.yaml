  \ Plaza, New York, NY 10004, U.S.A.\n\n### 引言\n\n这本综合指南精选了日常使用案例，将引导你完成端到端的预测模型构建周期，包括最新的技术和行业诀窍。前三章从搭建环境开始，涵盖\
  \ PySpark 基础知识，并专注于数据操作。特征工程是数据科学专业人员花费 70% 时间的地方。在我们让你熟悉这门语言后，我们将在此基础上向你介绍现成的数学函数。在进入下一章之前，你将学习预测建模框架。\n\
  \n第 4 章深入探讨变量选择的艺术。它演示了 PySpark 中可用的各种选择技术。第 5、6 和 7 章将带你踏上机器学习算法的旅程，包括实现和微调技术。此外，这些章节解释了不同的验证指标以及如何使用它们来挑选最佳模型。第\
  \ 8 章和第 9 章将引导你了解各种机器学习管道，包括可用于将模型投入生产并通过 Docker/API 提供服务的方法。第 10 章包含一些技巧，可以帮助你优化程序和机器学习管道。在第\
  \ 11 章中，你将学习可用于从数据中释放全部价值的框架。最后，你将能够熟练地在数据科学应用中使用 PySpark。\n\n本书推荐给希望通过处理大数据集来释放并行计算能力的数据科学爱好者。也强烈推荐给希望在大数据环境中从传统语言转向开源的专业人士。对于希望从事大数据工作的学生来说，这也是一项增值内容。\n\
  \n#### 你将学到什么：\n\n- 端到端预测模型构建概述\n- 多种变量选择技术及其实现\n- 多种算法及其实现\n- 模型投入生产\n- 数据科学实验与技巧\n\
  - 建模框架\n\n#### 本书包含：\n\n- PySpark 数据科学解决方案的综合指南\n- 专门设计的练习，帮助你练习所学知识\n- 行业标准方法和流程，并通过示例实现\n\
  - 易于理解的结构，适合广泛的受众（从专业人士到学生）\n- 将数据科学解决方案从传统语言迁移到 PySpark 的建议\n- 精选的技巧和窍门，可帮助你完成日常工作\n\
