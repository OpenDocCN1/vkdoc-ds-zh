- "# 搭建 PySpark 环境\n\n本章专门讲解如何搭建 PySpark 环境。我们将讨论多种方案，你可以选择自己最喜欢的一种。如果你已经搭建好了环境，可以直接跳到本章后面的“基本操作”部分。\n\
  \n本章涵盖以下主题：\n\n- 使用 Anaconda 进行本地安装\n- 基于 Docker 的安装\n- Databricks 社区版\n- GitHub\
  \ codespaces\n\n## 使用 Anaconda 进行本地安装\n\n---\n\n**注意：** 以下内容摘自《Data Science with\
  \ PySpark》一书（ISBN 979-8-8688-0819-7，电子书 ISBN 979-8-8688-0820-3，[`doi.org/10.1007/979-8-8688-0820-3`](https://doi.org/10.1007/979-8-8688-0820-3)），©\
  \ Ramcharan Kakarla, Sundar Krishnan, Balaji Dhamodharan and Venkata Gunnu 2021,\
