  \n\n\n### 缺失值\n\n你可以使用 PySpark 的内置函数计算单列或多列中的缺失值，如下所示：\n\n```python\nfrom pyspark.sql.functions\
  \ import *\ndf.filter((df['popularity']=='')|df['popularity'].isNull()|isnan(df['popularity'])).count()\n\
  ```\n\n输出：\n\n```\n\n```\n\n我们来分解一下前面的命令，看看发生了什么。首先，在 DataFrame 上使用了 `filter` 函数，并基于\
  \ `OR` 条件传递了多个条件，在表达式中用 `|` 表示。在第一个条件中，我们搜索 `popularity` 列中存在的空字符串。在第二个条件中，我们使用\
  \ `.isNull()` 运算符，当 popularity 为 null 时返回 true；null 表示没有值或空值。在第三个条件中，我们使用 `isnan`\
  \ 来识别 NaN（非数字）。这些通常是未定义的数学运算的结果。\n\n如果需要计算 DataFrame 中所有的缺失值，可以使用以下命令：\n\n```python\n\
  df.select([count(when((col(c)=='') | col(c).isNull() |isnan(c), c)).alias(c) for\
  \ c in df.columns]).show()\n```\n\n此命令选择所有列，并在循环中运行前面的缺失检查。然后在此处使用 `when` 条件来子集化满足缺失值标准的行（见图\
  \ 2-5）。\n\n![](img/500182_2_En_2_Fig5_HTML.jpg)\n\n图 2-5\n\nDataFrame 所有列的缺失值输出\n\
  \n注意\n\n在运行任何排序操作之前，请确保导入 `pyspark.sql.functions`。\n\n### 单变量频数\n\n好的，让我们看看如何计算分类变量的频数（见图\
  \ 2-6）。术语提醒：分类变量是数据集中存在的字符串变量。让我们使用以下代码验证数据集中是否有重复的标题：\n\n![](img/500182_2_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n单变量频数输出\n\n```python\ndf.groupBy(df['title']).count().show()\n```\n\n\
  前面的命令给出了一个标题在数据集中出现的次数。通常，你可能希望查看排序后的数据，因此可以使用以下命令（见图 2-7）：\n\n![](img/500182_2_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7\n\n排序后的单变量频数输出\n\n```python\ndf.groupby(df['title']).count().sort(desc(\"\
  count\")).show(10, False)\n```\n\n注意\n\n`groupby` 是 `groupBy` 的别名；两种写法都有效。\n\n有不少标题是重复的。看起来缺少标题是最常见的问题。现实世界的数据可能很混乱。这很好，但你可能希望通过消除任何缺失值并添加额外的过滤器来微调结果，使其仅限制在出现次数超过四次的标题上。\n\
  \n### 排序和过滤单变量频数\n\n首先，过滤掉非空的值。我们使用了不等号（`!=` 和 `~`）来创建一个临时数据集，这样做是为了演示 `not` 条件的使用。\n\
  \n```python\n# 子集化并创建一个临时 DataFrame 以消除任何缺失值\ndf_temp=df.filter((df['title']!=\"\
  )&(df['title'].isNotNull()) & (~isnan(df['title'])))\n# 按 'title' 分组，统计出现次数，过滤出现次数超过四次的标题，按降序排序，并显示前几个结果\n\
  df_temp.groupby(df_temp['title']).count().filter(\"`count` >4\").sort(col(\"count\"\
  ).desc()).show(10,False)\n```\n\n如果你没有指定 `desc` 函数，结果将默认按升序排序（见图 2-8）。\n\n![](img/500182_2_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8\n\n经过过滤和排序的单变量频数输出\n\n```python\n# 以下命令用于查找重复出现四次或更多次的标题数量\ndf_temp.groupby(df_temp['title']).count().filter(\"\
  `count` >=4\").sort(col(\"count\").desc()).count()\n```\n\n输出：\n\n```\n\n# 以下命令用于删除我们在过程中创建的任何临时\
  \ DataFrame\ndel df_temp\n```\n\n在前面的命令中，你可能已经观察到有多种方法可以达到相同的结果。随着你对这门语言越来越熟练，你可能会形成自己的偏好。\n\
  \n### 变量类型转换\n\n正如你从元数据中观察到的，所有变量都被指示为字符串。在观察数据后，你知道其中一些字段是整数、浮点数或日期对象。如果数据类型没有被正确识别，某些操作可能会导致误导性的结果。我们强烈建议你在任何分析中尽职尽责地识别正确的数据类型。你现在将看到如何将其中一些变量转换为正确的数据类型。\n\
  \n如果你在识别数据类型时不仔细，可能会在转换时遇到数据丢失。例如，如果你将一个字符串列转换为数值列，结果列可能全是 null。在演示数据集的 `tagline`\
  \ 列上尝试此操作并观察结果。在应用任何转换之前探索数据集是一个好习惯。手动数据中的一些拼写错误（例如，`12,1` 而不是 `12.1`）也可能导致意外结果。\n\
  \n首先在转换前打印数据类型，将 `budget` 变量转换为 `float`，并观察变化（见图 2-9 和 2-10）。\n\n![](img/500182_2_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10\n\n转换后的数据类型\n\n![](img/500182_2_En_2_Fig9_HTML.jpg)\n\n图 2-9\n\n转换前的数据类型\n\
  \n```python\n#转换前\ndf.dtypes\n```\n\n```python\n#转换\ndf = df.withColumn('budget',df['budget'].cast(\"\
  float\"))\n#转换后\ndf.dtypes\n```\n\n使用了 `cast` 函数。还要注意，我们使用了名为 `.withColumn` 的附加函数。这是\
  \ PySpark 中最常用的函数之一。它用于更新数据类型的值，以及重命名和转换它们。它还可以创建新列（见图 2-11 和 2-12）。你将在后续内容中更好地理解它的用途。你可能想知道如何将该函数扩展到多个列。如果你已经知道数据类型，你可以使用已识别变量的列表并在循环中迭代它们。\n\
  \n```python\n#导入必要的库\nfrom pyspark.sql.types import *\n#识别并分配变量列表\nint_vars=['id']\n\
  float_vars=['budget', 'popularity', 'revenue']\ndate_vars=['release_date']\n#转换整数变量\n\
  for column in int_vars:\ndf=df.withColumn(column,df[column].cast(IntegerType()))\n\
  # 转换浮点变量\nfor column in float_vars:\ndf=df.withColumn(column,df[column].cast(FloatType()))\n\
  # 转换日期变量\nfor column in date_vars:\ndf=df.withColumn(column,df[column].cast(DateType()))\n\
  df.dtypes\n```\n\n```python\ndf.show(10,False)\n```\n\n![](img/500182_2_En_2_Fig12_HTML.jpg)\n\
  \n图 2-12\n\n更改数据类型后的数据概览\n\n![](img/500182_2_En_2_Fig11_HTML.jpg)\n\n图 2-11\n\n\
  转换后所有变量的数据类型\n\n在前面的输出中，如果你仔细观察，可以看到 `budget` 和 `revenue` 列的值显示方式有明显差异，它们带有一个 `.0`\
  \ 值，指示了数据类型。比较图 2-4 和图 2-12 以观察转换前后的这些差异。\n\n\n\n### 描述性统计\n\n要分析任何数据，你需要对数据类型、分布和离散程度有敏锐的理解。Spark\
  \ 拥有一套便捷的内置函数，可以让你更轻松地快速计算这些字段。Spark 中的 `describe` 函数非常实用，它能给出每列非缺失值的总数、均值/平均值、标准差以及最小值和最大值（见图\
  \ 2-13）。你可以转换这个 DataFrame 的输出，并在后续的缺失值插补中使用它。我们将在模型构建部分更深入地讨论这一点。\n\n![](img/500182_2_En_2_Fig13_HTML.jpg)\n\
  \n图 2-13  \nDescribe 函数输出\n\n```\ndf.describe()\n```\n\n这里展示的均值是算术平均值，即一组离散观测值的中心值。均值对于许多操作来说是一个很好的估计，但容易受到异常值的影响。异常值有可能显著影响均值。相比之下，中位数提供了更好的估计，因为它不受异常值的影响。然而，计算中位数在计算上可能代价高昂，尤其是因为需要进行排序。\n\
  \n在 Spark 中，由于排序，这个操作可能会消耗大量资源。为了加快计算速度，Spark 实现了一种经过速度优化的 Greenwald-Khanna 算法变体。用于计算中位数的函数是\
  \ `approxQuantile`。\n\n`approxQuantile` 函数需要传入三个参数，如下所示：\n\n- `col` – 数值列的名称。\n\
  - `probabilities` – 分位数概率的列表。每个数字必须属于 [0, 1]。例如，0 是最小值，0.5 是中位数，1 是最大值。\n- `relativeError`\
  \ – 要达到的相对目标精度 (>= 0)。如果设置为 0，则计算精确分位数，这可能非常昂贵。请注意，大于 1 的值也是可以接受的，但结果与设置为 1 相同。\n\
  \n让我们尝试计算 `budget` 列的中位数。\n\n```\n#由于预算中的未知值被标记为 0，让我们在计算中位数之前过滤掉这些值\ndf_temp =\
  \ df.filter((df['budget']!=0)&(df['budget'].isNotNull()) & (~isnan(df['budget'])))\n\
  #这里的第二个参数表示中位数值，即 0.5；你也可以尝试调整该值来计算其他百分位数\nmedian=df.approxQuantile('budget',[0.5],0.1)\n\
  #打印该值\nprint ('预算的中位数是 '+str(median))\n```\n\n输出：\n\n```\n预算的中位数是 [7000000.0]\n\
  ```\n\n如果你想一次性计算多个列的中位数，只需将第一个参数改为 `list` 即可。\n\n### 唯一值/不同值及其计数\n\n有时你可能只想了解一个变量内部的层级数量（基数）。你可以使用\
  \ Spark 中提供的 `countDistinct` 函数来确定这一点（见图 2-14）。\n\n![](img/500182_2_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14  \n不同标题计数输出\n\n```\n# 统计标题的不同出现次数\ndf.agg(countDistinct(col(\"title\")).alias(\"\
  count\")).show()\n```\n\n或者，你也可以使用 `distinct` 函数来查看不同的出现情况（见图 2-15）。\n\n![](img/500182_2_En_2_Fig15_HTML.jpg)\n\
  \n图 2-15  \n不同标题输出\n\n```\n# 统计标题的不同出现次数\ndf.select('title').distinct().show(10,False)\n\
  ```\n\n直观上，你可能还想按年份查看不同的标题。那么，让我们先从发布日期中提取年份。\n\n```\n# 从发布日期中提取年份\ndf_temp=df.withColumn('release_year',year('release_date'))\n\
  ```\n\n如果需要，你应该能够使用类似的函数从 `date` 变量中提取月份和日期。以下两个命令仅用于演示目的，并非获得所需输出所必需。第三个命令按年份获取不同计数（见图\
  \ 2-16）。\n\n![](img/500182_2_En_2_Fig16_HTML.jpg)\n\n图 2-16  \n按年份统计的不同标题计数\n\n\
  ```\n# 提取月份\ndf_temp=df_temp.withColumn('release_month',month('release_date'))\n\
  # 提取月份中的日期\ndf_temp=df_temp.withColumn('release_day',dayofmonth('release_date'))\n\
  # 按年份计算不同计数\ndf_temp.groupBy(\"release_year\").agg(countDistinct(\"title\")).show(10,False)\n\
  ```\n\n同样，你应该能够使用排序部分讨论的函数，按降序或升序对输出进行排序。\n\n\n\n### 过滤\n\nSpark 提供了多种过滤数据的方法。事实上，在进入本节之前，你就已经接触到了\
  \ `filter` 函数。这足以说明该函数即使在基本操作中也非常重要。在过滤时，你可能还会遇到 `where` 函数。这两个函数的工作方式相同。不过，`filter`\
  \ 是 Scala 中此类函数的标准名称，而 `where` 则更受 SQL 用户的青睐。\n\n```\n.where() = .filter()\n```\n\
  \n之前，你在 `filter` 中接触过包含 `or` 和 `and` 条件的用法。在本演示中，让我们尝试其他可用的数据过滤方法。假设你想过滤所有以 `Meet`\
  \ 开头的标题，该如何处理？如果你是 SQL 用户，只需使用 `like` 条件即可，如下所示。PySpark 提供了可用于此目的的正则表达式函数（见图 2-17）。\n\
  \n![](img/500182_2_En_2_Fig17_HTML.jpg)\n\n图 2-17\n\n使用“like”表达式过滤匹配项\n\n```\ndf.filter(df['title'].like('Meet%')).show(10,False)\n\
  ```\n\n现在，让我们找出*不以*“s”结尾的标题（见图 2-18）。\n\n![](img/500182_2_En_2_Fig18_HTML.jpg)\n\
  \n图 2-18\n\n使用“like”表达式过滤非匹配项\n\n```\ndf.filter(~df['title'].like('%s')).show(10,False)\n\
  ```\n\n如果你想查找包含“ove”的标题，可以使用 `rlike` 函数，这是一个正则表达式（regex；见图 2-19）。\n\n![](img/500182_2_En_2_Fig19_HTML.jpg)\n\
  \n图 2-19\n\n使用正则表达式过滤匹配项\n\n```\ndf.filter(df['title'].rlike('\\w*ove')).show(10,False)\n\
  ```\n\n上述表达式也可以重写如下：\n\n```\ndf.filter(df.title.contains('ove')).show()\n```\n\n\
  在某些情况下，你会有数千个列，并希望根据特定的前缀或后缀来识别或筛选这些列。你可以使用 `colRegex` 函数来实现这一点。首先，识别以“`re`”开头的变量（见图\
  \ 2-20）。\n\n![](img/500182_2_En_2_Fig20_HTML.jpg)\n\n图 2-20\n\n使用正则表达式按前缀过滤列\n\n\
  ```\ndf.select(df.colRegex(\"`re\\w*`\")).printSchema()\n```\n\n那么，如何识别以特定后缀结尾的变量呢？这里有三个以“e”结尾的变量；让我们看看能否通过调整之前的正则表达式来识别它们（见图\
  \ 2-21）。\n\n![](img/500182_2_En_2_Fig21_HTML.jpg)\n\n图 2-21\n\n使用正则表达式按后缀过滤列\n\n\
  ```\ndf.select(df.colRegex(\"`\\w*e`\")).printSchema()\n```\n\n正则表达式可能令人困惑，所以让我们简要回顾一下这个主题。通常，你可以通过元字符来识别所有字符和数字。正则表达式使用这些元字符来匹配任何字面量或字母数字表达式。以下是常用元字符的简短列表。\n\
  \n单个字符：\n\n*   `\\d` – 匹配 0 到 9 之间的数字\n*   `\\w` – 匹配所有大小写字母和 0 到 9 的数字 [A–Z a–z\
  \ 0–9]\n*   `\\s` – 空白字符\n*   `.` – 匹配任意单个字符\n\n你还有一组量词，用于指导搜索多少个字符，如下所示。\n\n量词：\n\
  \n*   `*` – 匹配 0 个或多个字符\n*   `+` – 匹配 1 个或多个字符\n*   `?` – 匹配 0 个或 1 个字符\n*   `{min,max}`\
  \ – 指定范围，匹配介于该范围（包括 `min, max`）之间的任意数量字符\n*   `{n}` – 精确匹配 *n* 个字符\n\n如果你回顾之前的两个表达式，会发现我们使用了\
  \ `\\w`，表示我们希望匹配所有字母数字字符，不区分大小写。在识别带有“re”前缀的变量的表达式中，`\\w` 后面跟着量词 `*`，表示我们希望包含“re”之后的所有字符。\n\
  \n### 创建新列\n\n创建新特征（列）在许多分析应用中起着关键作用。Spark 提供了多种创建新列的方法。最简单的方法是通过 `withColumn` 函数。假设你想计算流行度的方差。方差是衡量数值与均值离散程度的指标，由以下公式表示：\n\
  \n![$$ {\\mathrm{S}}²=\\sum {\\left({\\mathrm{X}}_i-\\overline{\\mathrm{X}}\\right)}²/\\\
  left(\\mathrm{n}-1\\right) $$](img/500182_2_En_2_Chapter_TeX_Equa.png)\n\n`x[i]`\
  \ – 单个观测值  \n`x` – 均值  \n`n` – 观测值总数\n\n那么，首先使用以下命令计算均值。当你需要特定统计量时，这里使用的 `agg` 函数比\
  \ `describe` 更好：\n\n```\n# 计算平均流行度\nmean_pop=df.agg({'popularity': 'mean'}).collect()[0]['avg(popularity)']\n\
  count_obs= df.count()\n```\n\n由于我们需要将这个值连同单个观测值一起使用，因此使用 `withColumn` 和 `lit` 函数将其添加到所有行中。`lit`\
  \ 函数是与列字面量交互的一种方式。当你想要直接创建一个包含某个值的列时，它非常有用。\n\n```\ndf=df.withColumn('mean_popularity',lit(mean_pop))\n\
  ```\n\n`mean_popularity` 列的所有行都具有相同的值。以下命令中的 `pow` 函数可以帮助你计算一个数的幂。这里，你需要计算平方数，因此传入参数\
  \ 2。\n\n```\n# 计算 'popularity' 列的方差\ndf=df.withColumn('varaiance',pow((df['popularity']-df['mean_popularity']),2))\n\
  variance_sum=df.agg({'varaiance': 'sum'}).collect()[0]['sum(varaiance)']\n```\n\n\
  上述命令将所有行的差值求和。在最后一步中，我们将总和除以观测值数量，从而得到结果。\n\n```\nvariance_population= variance_sum/(count_obs-1)\n\
  ```\n\n输出：\n\n```\n37.85868805766277\n```\n\n尽管这个方差计算涉及多个步骤，但目的是让你了解创建新特征可能涉及的操作。一旦你有了方差值，就可以基于它创建自定义变量。\n\
  \n让我们退一步思考。你可能会问：“如果我要创建多个变量，如何一次性完成并保持结构良好？”接下来，我们将为你介绍解决方案。假设你想创建能够将 `budget`\
  \ 和 `popularity` 变量分类为高、中、低的变量。首先，你需要定义高、中、低阈值的依据。以下阈值仅为方便起见；你可以根据更严格的分析来调整这些值。\n\
  \n以下代码定义了一个简单的 Python 函数。它向函数传递两个变量，并根据阈值决定返回新的变量，这两个变量都是字符串。\n\n```\ndef new_cols(budget,popularity):\n\
  if budget<10000000: budget_cat='Small'\nelif budget<100000000: budget_cat='Medium'\n\
  else: budget_cat='Big'\nif popularity<3: ratings='Low'\nelif popularity<5: ratings='Mid'\n\
  else: ratings='High'\nreturn budget_cat,ratings\n```\n\n现在，有趣的部分来了：我们将使用用户自定义函数。那么，什么是用户自定义函数？如果你来自\
  \ Python 世界，它们与 Pandas DataFrame 和 Series 的 `.map()` 和 `.apply()` 方法非常相似。简单来说，用户自定义函数允许开发者将\
  \ DataFrame 中行的值作为输入，并将其映射到整个 DataFrame。一个关键点是，你必须指定输出数据类型。不幸的是，这一点无法回避。当需要编写多个列时，这可能会很麻烦。之后我们将讨论另一种方法，可以作为替代方案。\n\
  \n\n\n在命令中，你定义了用户自定义函数。注意我们创建了`StructType`来保存新变量。我们还显式定义了将要返回的数据类型。我们知道两个返回类型都是字符串，因此我们使用`StringType()`。`StructType`对象定义了\
  \ Spark DataFrame 的模式。`StructType`对象包含一个`StructField`对象列表，这些对象定义了 DataFrame 中每个列的名称、类型和可空标志。\n\
  \n`StructType`对象有助于消除代码中的任何顺序依赖关系。我们这么说是什么意思？如果你有多个函数需要在最终步骤之前运行，你可以将它们全部包装在`StructType`下，以返回结果数组，而不是创建多个列。这对于读取和管理涉及各种转换和操作的长代码库非常有用。对于此示例，我们将把包含多个输出的`StructType`拆分为单独的列，以便进一步访问。\n\
  \n```\n# 在 DataFrame 上应用用户自定义函数\nudfB=udf(new_cols,StructType([StructField(\"budget_cat\"\
  , StringType(), True),StructField(\"ratings\", StringType(), True)]))\n```\n\n以下命令传递了一个具有两个输入列的用户自定义函数：`budget`和`popularity`：\n\
  \n```\ntemp_df=df.select('id','budget','popularity').withColumn(\"newcat\",udfB(\"\
  budget\",\"popularity\"))\n# 将结构类型列解包为单独的列，并删除结构类型\ndf_with_newcols = temp_df.select('id',\
  \ 'budget',' popularity', 'newcat').withColumn('budget_cat', temp_df.newcat.getItem('budget_cat')).withColumn('ratings',\
  \ temp_df.newcat.getItem('ratings')).drop('newcat')\ndf_with_newcols.show(15,False)\n\
  ```\n\n在以下命令中，请注意我们再次使用`withColumn`函数来提取`StructType`内的数据。由于我们拥有保存字符串数据类型的`StructType`，我们使用`getItem`函数来访问`StructType`中的元素。注意，我们一个接一个地连接函数，以便在一行中实现所需的输出（参见图\
  \ 2-22）。\n\n![](img/500182_2_En_2_Fig22_HTML.jpg)\n\n**图 2-22** 带有自定义列的新创建 DataFrame\
  \ 的输出\n\n实现相同结果的另一种方法是使用`when`函数。使用此函数的一个优点是你无需定义输出数据类型。这对于快速和粗略的操作非常方便。让我们使用`when`函数重新创建前面的列。\n\
  \n```\ndf_with_newcols = df.select('id', 'budget',' popularity').\\\nwithColumn('budget_cat',\
  \ when(df['budget']<10000000,'Small').when(df['budget']<100000000,'Medium').otherwise('Big')).\\\
  \nwithColumn('ratings', when(df['popularity']<3,'Low').when(df['popularity']<5,'Mid').otherwise('High'))\n\
  ```\n\n如果你观察前面的命令，可以看到我们连接了许多条件来定义新变量。这会产生与之前方式相同的输出。另一个有用的提示：通过结合使用`withColumn`和`when`函数，如果你使用相同的列名，可以更新现有列的值。你无需为操作创建新的临时\
  \ DataFrame（如图所示）。相反，你可以利用同一个 DataFrame 来更新或添加列值。\n\n### 删除和重命名列\n\n你可以随时使用`drop`函数删除一个或多个列。\n\
  \n```\ncolumns_to_drop=['budget_cat']\ndf_with_newcols=df_with_newcols.drop(*columns_to_drop)\n\
  ```\n\n你可以使用`printSchema`函数验证输出。\n\n重命名可以使用`withColumnRenamed`函数或`alias`函数来完成。\n\
  \n```\ndf_with_newcols = df_with_newcols.withColumnRenamed('id','film_id') .withColumnRenamed('ratings','film_ratings')\n\
  ```\n\n如果你想更改多个列名，可以尝试以下命令：\n\n```\n# 你可以在列表中定义所有变量更改\nnew_names = [('budget','film_budget'),('popularity','film_popularity')]\n\
  # 应用 alias 函数\ndf_with_newcols_renamed = df_with_newcols.select(list(map(lambda\
  \ old,new:col(old).alias(new),*zip(*new_names))))\n```\n\n上述两种方法具有相同的执行计划。你可以使用`printSchema`函数验证所有这些输出。\n\
  \n练习 2-1 请使用以下数据集：[`https://www.kaggle.com/kakarlaramcharan/tmdb-data-0920`](https://www.kaggle.com/kakarlaramcharan/tmdb-data-0920)。\n\
  \n\n\n### Spark 上的 Pandas API\n\n在结束本章之前，我们将探讨 Spark 近几个版本中新增的功能。其中一个亮点是 Spark 上\
  \ Pandas API 的集成。对于来自 pandas 世界的用户来说，这可能会改变游戏规则。只需一行代码，你就可以使用熟悉的方法，利用 Spark 的分布式计算能力。同样值得注意的是，Spark\
  \ 上的 pandas 比 DASK 快得多。如果你不了解 DASK，它是一个用于并行计算的开源 Python 库。\n\n请注意，在使用 Spark 上的 pandas\
  \ 时，会用到 `pyspark.pandas.frame.DataFrame` 类。`pandas-on-Spark` DataFrame 和 `Spark`\
  \ DataFrame 实际上是可互换的。让我们看看 DataFrame 的变体（见图 2-23）。如果你的 dataframe 类以 `pyspark` 开头，你可以确信它正在使用已配置的并行计算。如果不是，你可以将其更改为\
  \ Spark dataframe 或 pandas on Spark dataframe。不要将其与仅在单机上运行的核心 pandas dataframe 混淆。\n\
  \n![](img/500182_2_En_2_Fig23_HTML.jpg)\n\n图 2-23\n\nDataFrame 的类型\n\n```\n# Dataframe\
  \ 数据类型:\ndf_with_newcols_psd_multi_machine = df_with_newcols.pandas_api()\ndf_with_newcols_pandas_core_single_machine=df_with_newcols.toPandas()\n\
  print(\"分布式: 多机\")\nprint(f'df_with_newcols - spark dataframe : {type(df_with_newcols)}')\n\
  print(f'df_with_newcols_psd_multi_machine - pandas on spark: {type(df_with_newcols_psd_multi_machine)}')\n\
  print(\"非分布式: 单机\")\nprint(f'df_with_newcols_pandas_core_single_machine - 核心 Pandas:\
  \ {type(df_with_newcols_pandas_core_single_machine)}')\n```\n\n为了说明如何使用 `pandas\
  \ on spark` DataFrame 类，这里提供了一个示例（见图 2-24 和 2-25）：\n\n![](img/500182_2_En_2_Fig25_HTML.jpg)\n\
  \n图 2-25\n\nDataFrame 数据类型的输出\n\n![](img/500182_2_En_2_Fig24_HTML.jpg)\n\n图 2-24\n\
  \n通过 Pandas API 读取 csv 文件的输出\n\n```\n#Pandas on spark dataframe\nimport pyspark.pandas\
  \ as ps\ndf_pd_distributed=ps.read_csv(\"movie_data_part1.csv\",sep=\"|\")\ndf_pd_distributed[['budget','original_title','popularity']].head()\n\
  ```\n\n```\n#验证 dataframe 数据类型\nprint(f'DataFrame 数据类型: {type(df_pd_distributed)}')\n\
  ```\n\n在大多数情况下，当你调用 API 时，PySpark 和 Spark 上的 Pandas API 之间的类型转换是自动进行的。你可以使用 `dtypes`\
  \ 方法比较转换前后的两个 DataFrame。将 Spark 上的 Pandas API 转换为 PySpark 时也是如此。\n\nSpark 上的 Pandas\
  \ API 与 pandas 之间的类型转换也非常相似。请注意，某些数据类型是 pandas 独有的，目前尚未计划集成到 Spark 中。\n\n*   `pd.SparseDtype`\n\
  *   `pd.DatetimeTZDtype`\n*   `pd.UInt*Dtype`\n*   `pd.BooleanDtype`\n*   `pd.StringDtype`\n\
  \n`transform` 和 `apply` 方法可用于 Spark 上的 Pandas API 进行列操作。`Transform` 期望返回与输入 dataframe\
  \ 相同长度的行，而 `apply` 方法可以返回任意数量的行。除了这些方法之外，`pandas_on_spark.transform_batch` 和 `pandas_on_spark.apply_batch`\
  \ 也可用。这些批处理方法允许你调用一个接收并返回 pandas DataFrame 的函数。当你使用这些批处理方法时，Spark 会迭代一个大型 DataFrame，将其分解为多个批次，并为每个批次调用你指定的函数。在较大的数据集上应用这些方法时要小心；**建议所有批次\
  \ DataFrame 的索引对齐**。你可能会花费大量时间调试此错误。为避免这种情况，请预先对齐列的索引。\n\n```\n# 对列应用转换\nimport\
  \ pyspark.pandas as ps\ndef pandas_plus(pser):\nreturn (pser+1)  # 允许任意长度\ndf_pd_distributed_func=df_pd_distributed[['budget','popularity']].transform(pandas_plus)\n\
  df_pd_distributed_func.head()\ntype(df_pd_distributed_func)\n```\n\n![](img/500182_2_En_2_Fig26_HTML.jpg)\n\
  \n图 2-26\n\n使用 transform 进行数据转换的输出\n\n在上面的例子中，模式是通过取输出的前几行来推断的。这是一个简单的例子。通常的用例可能涉及几个昂贵的操作，例如在执行计划的上游进行数据混洗。Spark\
  \ 上的 Pandas API 最终会执行 Spark 作业两次——一次用于模式推断，一次用于使用该模式处理实际数据。\n\n为了避免这些后果，Spark 上的\
  \ Pandas API 有自己的类型提示风格来指定模式并避免模式推断。Spark 上的 Pandas API 理解返回类型中指定的类型提示，并将其转换为内部使用的\
  \ Pandas UDF 的 Spark 模式。类型提示的方式已经演变。\n\n```\ndef pandas_plus(pser) ->ps.DataFrame[int,float]:\n\
  return (pser+1)  # 允许任意长度\ndf_pd_distributed_func=df_pd_distributed[['budget','popularity']].transform(pandas_plus)\n\
  df_pd_distributed_func.head()\ntype(df_pd_distributed_func)\n```\n\n![](img/500182_2_En_2_Fig27_HTML.jpg)\n\
  \n图 2-27\n\n使用 transform 进行数据转换的输出\n\n请注意，一旦在函数定义中包含了类型提示，警告就消失了。最佳实践是使用类型提示来提高操作的性能，尤其是在使用\
  \ Spark 上的 Pandas API 时。\n\nSpark 上的 Pandas API 是一个集成层，用户必须注意避免意外的低效。一些需要遵循的最佳实践包括：\n\
  \n*   使用执行计划来了解数据将如何处理；你可以通过调用 `.spark.explain()` 方法来查看执行计划。\n*   在对 Spark 上的 Pandas\
  \ API 对象进行多次操作后，由于计划庞大且复杂，底层的 Spark 规划器可能会变慢。如果 Spark 计划变得巨大或需要很长时间，`DataFrame.spark.checkpoint()`\
  \ 或 `DataFrame.spark.local_checkpoint()` 可能会有所帮助。\n*   由于数据交换，像排序值这样的操作在并行或分布式环境中比在单内存机器上执行更具挑战性。\n\
  *   避免在单个分区上进行计算。如果你在未指定分区的情况下使用 rank，则可能会将所有数据放入单台机器的单个分区中。\n*   避免使用保留或重复的列名。\n\
  *   Spark 上的 Pandas API 默认禁止对不同 DataFrame（或 Series）进行操作，以防止昂贵的操作。减少对不同 DataFrame\
  \ 或 Series 的操作。\n\n### 练习 2-1：数据操作\n\n**问题 1：** 找出 2000 年至 2015 年间重复出现的标题，并统计标题数量。（提示：使用过滤器。）\n\
