  \n## 基于 Docker 的安装\n\n信不信由你，与本地安装相比，基于 Docker 的安装毫不费力。有些读者可能刚刚开始接触 Docker，而另一些读者可能已经很熟练了。本节向不熟悉\
  \ Docker 的读者介绍 Docker，并向您展示如何将 PySpark 与 Docker 结合使用。在进一步讨论之前，我们想澄清一点：Docker 是一个庞大的资源，本书无法涵盖所有内容。您可以阅读在线文章或购买一本专门介绍\
  \ Docker 的书籍。在这里，我们介绍使用 Docker 所需的基本概念。熟练的用户可以跳到本章的“创建简单的 Docker 镜像”部分。\n\n\n\n\
  ### 为什么需要使用 Docker？\n\n设想这样一个场景：你使用 `Python 2.7` 开发了一个应用程序。突然，你的学院或公司管理部门宣布要切换到\
  \ `Python 3.11` 或更高版本。你面临一个挑战：需要测试你的代码与新 Python 版本的兼容性，并在代码出错时进行更新。考虑到确保应用程序平稳运行所需的时间，这个过程可能会令人沮丧且繁琐。\n\
  \n在这种情况下，Docker 被证明非常有用。一旦你创建了一个 Docker 镜像，外部环境发生的变化就变得无关紧要了。你的应用程序在任何部署了 Docker\
  \ 的地方都能无缝运行。这一特性使 Docker 变得异常强大，并成为数据科学专业人士的重要工具。\n\n作为一名数据科学家，你可能会遇到需要开发和部署生产模型的情况。生产环境中的微小变化都有可能破坏你的代码和应用程序。因此，利用\
  \ Docker 可以简化你的工作，并确保操作更加顺畅。\n\n### 什么是 Docker？\n\nDocker 是一种平台即服务（PaaS）产品。你创建平台来运行你的应用程序。平台构建完成后，它可以托管在任何安装了\
  \ Docker 的地方。Docker 可以在多种主机操作系统上运行，包括 Mac、Windows、Linux 等。安装 Docker 应用程序后，你可以创建\
  \ Docker 镜像，这些镜像是构建容器和隔离系统环境的模板。在容器内部，你可以托管你的应用程序并安装其所有依赖项（`bins/libs`）。这种设置如图 1-4\
  \ 所示。\n\n![](img/500182_2_En_1_Fig4_HTML.jpg)\n\n图 1-4 Docker\n\n等等！这听起来像虚拟机。嗯，其实不是。Docker\
  \ 的内部工作机制有所不同。虽然每个虚拟机都需要自己的操作系统，但 Docker 允许共享操作系统。此外，与 Docker 相比，虚拟机消耗更多的磁盘空间，并且具有更高的开销利用率。接下来，你将创建一个简单的\
  \ Docker 镜像。\n\n### 创建一个简单的 Docker 镜像\n\n在创建镜像之前，请按以下步骤开通一个 Docker 账户：\n\n1.  在\
  \ [`https://hub.docker.com/signup`](https://hub.docker.com/signup) 创建一个 Docker Hub\
  \ 账户。\n2.  从 [`https://www.docker.com/get-started`](https://www.docker.com/get-started)\
  \ 下载 Docker Desktop。\n3.  安装 Docker Desktop，并使用 Docker Hub 的用户 ID/密码登录。\n\n要创建 Docker\
  \ 镜像，你需要一个 `Dockerfile`。Dockerfile 的命令可在此处获取：[`https://docs.docker.com/engine/reference/builder/`](https://docs.docker.com/engine/reference/builder/)。为了尝试一下，你将看到如何创建一个基本的\
  \ Python 镜像并在其中运行一个应用程序。使用文本编辑器，打开一个名为 `Dockerfile` 的新文件，并复制/粘贴以下命令：\n\n```\nFROM\
  \ python:3.11-slim\nCOPY test_script.py /\nCMD [\"python\", \"./test_script.py\"\
  ]\n```\n\n`test_script.py` 文件包含以下命令。为了使此代码正常工作，该文件应与 `Dockerfile` 位于同一位置：\n\n```\n\
  import time\nprint(\"Hello world!\")\nprint(\"The current time is - \", time.time())\n\
  ```\n\n这里发生了什么？你正在使用一个基础镜像，即 Python 3.11 的精简版。接下来，你将名为 `test_script.py` 的本地文件复制到\
  \ Docker 中。最后，你执行 `test_script.py` 文件。仅此而已。现在你可以使用 Docker 命令创建 Docker 镜像了。所有 Docker\
  \ 命令都提供在此处：[`https://docs.docker.com/engine/reference/commandline/docker/`](https://docs.docker.com/engine/reference/commandline/docker/)。对于这个简单的镜像创建，我们将关注以下两个命令：\n\
  \n*   `docker build`：创建镜像\n*   `docker run`：运行镜像\n\n在终端/命令提示符中，导航到 `Dockerfile`\
  \ 所在的文件夹，并运行以下命令：\n\n```\n# 使用指定的标签构建 Docker 镜像\ndocker build -t username/test_image\
  \ .\n# 运行一个 Docker 容器\ndocker run username/test_image\n```\n\n第一个命令创建镜像。`-t` 用于为镜像分配一个标签。你可以将\
  \ `username` 替换为你实际的 Docker Hub 用户名。确保在标签名称后面包含 `句点 (.)`。这将自动使用当前位置的 `Dockerfile`\
  \ 来创建镜像。第二个命令运行镜像。执行后，你应该会看到输出显示 `\"Hello, world! The current time is—` 等等等等。”\n\
  \n现在你应该对 Docker 有了基本的了解，接下来下载 PySpark Docker。\n\n### 下载 PySpark Docker\n\n按照以下步骤下载\
  \ PySpark Docker：\n\n![](img/500182_2_En_1_Fig5_HTML.jpg)\n\n图 1-5 PySpark 镜像\n\n\
  1.  前往 [`https://hub.docker.com/`](https://hub.docker.com/) 并搜索 PySpark 镜像。\n2.\
  \  导航到图 1-5 所示的镜像。\n3.  在终端/Anaconda 提示符中，输入以下代码并按回车键：\n\n    ```\n    docker pull\
  \ jupyter/pyspark-notebook\n    ```\n\n4.  镜像完全下载后，你可以运行以下代码来确认镜像存在：\n\n    ```\n\
  \    docker images\n    ```\n\n5.  值得注意的是，“latest”标签被应用于该镜像。此标签用于区分同名镜像的不同版本。\n\n\
  \n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n### 理解 PySpark Docker\
  \ 命令的逐步指南\n\n1.  从基本的 Docker `run` 命令开始，如代码清单 1-1 所示。\n\n```\ndocker run jupyter/pyspark-notebook:latest\n\
  [I 2024-01-21 19:09:27.110 ServerApp] http://79a9222b33d3:8888/lab?token=7b62b7b9c7f1aa378a6d1ebbdecc54cafbfcb877844e7ed9\n\
  [I 2024-01-21 19:09:27.110 ServerApp]     http://127.0.0.1:8888/lab?token=7b62b7b9c7f1aa378a6d1ebbdecc54cafbfcb877844e7ed9\n\
  代码清单 1-1\nDocker 基础运行命令\n```\n\n调用此命令后，您会看到几行输出，并出现一个链接，如上所示。\n\n当您在浏览器中复制并粘贴上述链接时，您将看不到\
  \ Jupyter 会话。这是因为 Docker 与外部世界之间没有建立连接。在下一步中，您将通过配置端口来设置连接。\n\n2.  您可以使用以下命令建立一个端口：\n\
  \n```\ndocker run -p 7777:8888 jupyter/pyspark-notebook:latest\n```\n\n我们在此选择两个不同的端口仅用于解释说明。执行此命令后，您将看到与代码清单\
  \ 1-1 中类似的输出。像之前一样复制粘贴链接，您仍然看不到任何会话。但是，如果使用端口 `7777` 而不是 `8888`，它就能正常工作。尝试使用此链接：`http://localhost:7777/`。您应该能够看到一个\
  \ Jupyter 会话。这是怎么回事呢？\n\n在 Docker 内部，Jupyter Notebook 会话运行在端口 `8888` 上。然而，当我们建立\
  \ Docker 连接时，我们明确指定 Docker 应使用端口 `7777` 与外部世界通信。端口 `7777` 成为了入口，因此我们看到了输出。现在您清楚了端口语法，可以像下面这样为两侧分配相同的端口。这次，显示的链接应该可以直接使用。\n\
  \n```\ndocker run -p 8888:8888 jupyter/pyspark-notebook:latest\n```\n\n3.  如果您想在\
  \ Docker 中访问外部文件怎么办？这同样可以通过一个简单的命令来实现：\n\n```\ndocker run -p 8888:8888 -v /Users/sundar/Desktop/Applied_DS_Second_Edition/:\
  \ /home/jovyan/work/ jupyter/pyspark-notebook:latest\n```\n\n让我们深入分析这个命令。正如您之前看到的端口映射，请注意符号\
  \ `-v` 后面跟着由 `:`（冒号）分隔的路径。`-v` 表示在调用 `docker` 命令时要挂载的卷。左侧是本地目录（`/Users/sundar/Desktop/Applied_DS_Second_Edition/`），右侧是\
  \ Docker 中的目录（`/home/jovyan/work`）。在下一步中，您将看到如何以交互模式调用 Docker 容器。\n\n4.  如何以交互/\
  \ bash 模式调用？使用以下命令：\n\n```\ndocker run -it -p 8888:8888 -v /Users/sundar/Desktop/Applied_DS_Second_Edition/:/home/jovyan/work/\
  \ jupyter/pyspark-notebook:latest bash\n```\n\n观察此命令中的两个变化。首先，添加了 `-it` 标签，表示启动一个交互式会话。其次，包含了\
  \ `bash` 命令来触发 shell。执行此命令后，您不会看到 Jupyter 会话链接。相反，您会进入一个 Linux shell 环境，允许您执行其他命令。此功能在各种场景下都很有用。例如，您可以在\
  \ Linux 环境中安装所需的软件包。导航到之前映射的文件夹，并使用以下命令启动 Jupyter Notebook：\n\n```\ncd /home/joyvan/work\n\
  jupyter notebook\n```\n\n您应该能够在 Jupyter 会话中看到文件和文件夹。\n\n5.  还有一些用于空间优化的标签。我们建议您在运行\
  \ Docker 时使用以下最终命令：\n\n```\ndocker run -it --rm --shm-size=1g --ulimit memlock=-1\
  \ -p 8888:8888 -v /Users/sundar/Desktop/Applied_DS_Second_Edition/:/home/jovyan/work/\
  \ jupyter/pyspark-notebook:latest\n```\n\n`--rm` 标签会在完成指定任务后删除容器。这适用于短期运行的容器。您明确告诉\
  \ Docker 守护进程，一旦此容器运行完毕，它应该清理文件并将其删除以节省磁盘空间。第二个标签 `--shm-size` 用于增加/减少共享内存大小。对于内存密集型容器，您可以使用此选项指定共享内存大小，通过提供对已分配内存的额外访问权限，帮助容器运行得更快。最后一个标签是\
  \ `--ulimit memlock=-1`，它为容器提供了无限的锁定内存地址空间。这将在容器调用期间锁定最大可用共享内存。您不必使用所有这些选项；但是，了解它们是有好处的。现在，您已经拥有了一个可与\
  \ Docker 一起正常运行的 PySpark 会话。\n\n## Databricks 社区版\n\n这适用于希望使用 Databricks 的用户。如果您的工作场所已经有\
