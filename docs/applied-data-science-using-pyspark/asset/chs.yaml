  二项式模型的方程如下：


  ```

  log(odds class1) = -3.47 + 0.008*age + 0*balance -0.0017*day + 0.0036*duration -
  0.128*campaign + 0.0021*pdays + 0.0859*previous

  ```


  类似地，多项式模型的方程如下：


  ```

  log(odds class0) = 1.735 -0.004*age – 0*balance + 0.0008*day - 0.0018*duration +
  0.064*campaign - 0.0011*pdays - 0.043*previous

  ```


  以及


  ```

  log(odds class1) = -1.735 +0.004*age + 0*balance - 0.0008*day + 0.0018*duration
  - 0.064*campaign + 0.0011*pdays + 0.043*previous

  ```


  在多项式模型的输出中，当你用类别 0 的系数减去类别 1 的系数时，你会得到类别 1 的二项式模型系数。截距也是如此。好了，现在我们来解释模型结果。


  #### 解释模型结果


  你遵循与解释线性回归系数相同的过程——保持所有其他变量不变，只改变你试图解释的变量。


  #### 二分类变量解释


  对于二分类变量，你使用上述方程计算两个类别的 `log(odds)`。例如，假设你的模型中包含性别（男性 = 0，女性 = 1）。那么，性别的影响通过以下方式衡量：


  ```

  log(odds class 1|Male) = Intercept + 0.16 * 0 + coef2 * var2 + ......

  log(odds class 1|Female) = Intercept + 0.16 * 1 + coef2 * var2 + ......

  log(odds class 1|Female) - log(odds class 1|Male) = 0.16

  ```


  通过保持所有其他因素不变，你得到二分类变量的系数作为 `log(odds)` 的差值。解释系数的最佳方法是使用优势比。让我们来操作一下。


  ![$$ Log\left(\frac{\mathrm{odds}\kern0.5em \mathrm{class}\kern0.5em 1\mid \mathrm{Female}}{\mathrm{odds}\kern0.5em
  \mathrm{class}\kern0.5em 1\mid \mathrm{Male}}\right)=0.16 $$](img/500182_2_En_5_Chapter_TeX_Equaf.png)


  ![$$ \frac{\mathrm{odds}\kern0.5em \mathrm{class}\kern0.5em 1\mid \mathrm{Female}}{\mathrm{odds}\kern0.5em
  \mathrm{class}\kern0.5em 1\mid \mathrm{Male}}={e}^{0.16}=1.173 $$](img/500182_2_En_5_Chapter_TeX_Equag.png)


  你取上述值与 1 的差值来解释优势比。女性属于类别 1 的优势比男性属于类别 1 的优势高出 17%。


  #### 连续变量解释


  让我们用 `age` 进行同样的计算。


  ![$$ Log\left(\frac{\mathrm{odds}\kern0.5em \mathrm{class}\kern0.5em 1\mid \mathrm{Age}=30}{\mathrm{odds}\kern0.5em
  \mathrm{class}\kern0.5em 1\mid \mathrm{Age}=29}\right)=-0.32 $$](img/500182_2_En_5_Chapter_TeX_Equah.png)


  ![$$ \frac{\mathrm{odds}\kern0.5em \mathrm{class}\kern0.5em 1\mid \mathrm{Age}=30}{\mathrm{odds}\kern0.5em
  \mathrm{class}\kern0.5em 1\mid \mathrm{Age}=29}={\mathrm{e}}^{-0.32}=0.73 $$](img/500182_2_En_5_Chapter_TeX_Equai.png)


  ```

  log(odds class 1|Age = 29) = Intercept - 0.32 * 29 + coef2 * var2 + ......

  log(odds class 1|Age = 30) = Intercept – 0.32 * 30 + coef2 * var2 + ......

  log(odds class 1| Age = 30) - log(odds class 1| Age = 29) = -0.32

  ```


  现在，1 – 0.73 = 0.27。当年龄增加一个单位时，一个人属于类别 1 的优势降低了 27%。


  以下是解释优势比的经验法则：


  1.  优势比为 1 意味着影响没有差异。

  2.  优势比大于 1 意味着随着变量的变化，优势增加。

  3.  优势比小于 1 意味着随着变量的变化，优势减少。


  ### 决策树


  到目前为止，我们已经讨论了用于回归和分类的线性方法。本节讨论可用于解决问题的非线性方法。总体而言，决策树背后的思想是生成一组“如果-那么规则”，并以树的形式表示它们。让我们可视化一个用于信用卡审批的简单决策树。




  ### 决策树解读


  -   树的根/父节点是`age`变量。因此，它是该决策树最重要的特征。

  -   叶节点是基于输入变量可以做出的决策。


