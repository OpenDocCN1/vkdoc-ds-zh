  ### 实时评分 API


  实时评分 API 用于实时对模型进行评分。它使您的模型能够嵌入到 Web 浏览器中，以获取预测并根据这些预测采取行动。这对于进行在线推荐、检查信用卡批准状态等非常有用。其应用范围非常广泛，使用
  Docker 管理此类 API 变得更加容易。此示例使用 Flask 实时实现模型（见图 9-4）。Flask 脚本存储在`pysparkapi/app.py`文件中。您可以参考本节代码，地址为：[`https://github.com/Apress/applied-data-science-using-pyspark/tree/main/Ch09/real_time_scoring`](https://github.com/Apress/applied-data-science-using-pyspark/tree/main/Ch09/real_time_scoring)。


  ![](img/500182_2_En_9_Fig4_HTML.jpg)


  图 9-4


  Flask API 就绪


  我们还修改了`Dockerfile`，将`app.py`文件复制到`/deploy`目录。在上一模块中，我们运行了`run.py`文件。在本模块中，这由`app.py`文件处理。以下是更新后的`Dockerfile`内容：


  ```

  FROM jupyter/pyspark-notebook:latest

  WORKDIR /deploy/

  COPY ./requirements.txt /deploy/

  RUN pip install -r requirements.txt

  EXPOSE 5000

  '
- '# Copy necessary files from local to container dir

  COPY ./file.pkl /deploy/

  COPY ./run.py /deploy/

  COPY ./helper.py /deploy/

  COPY ./assembleModel.h5 /deploy/assembleModel.h5

  COPY ./char_label_model.h5 /deploy/char_label_model.h5

  COPY ./clf_model.h5 /deploy/clf_model.h5

  COPY ./app.py /deploy/

  '
- '# Specify the entry point command to run when the container starts

  ENTRYPOINT ["python", "app.py"]

  ```


