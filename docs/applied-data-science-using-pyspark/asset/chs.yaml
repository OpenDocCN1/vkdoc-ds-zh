  \ | 观众的平均投票评分。 |\n\n### 数据操作\n\n我们将使用这些数据直到本章结束，以演示数据操作。\n\n一旦你使用上一章演示的任何方法建立了与\
  \ Spark 的连接，就可以启动 PySpark 会话，这可以通过以下代码完成：\n\n```python\nfrom pyspark.sql import\
