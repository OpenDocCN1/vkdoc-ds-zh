  # 使用管道按顺序处理\npipeline = Pipeline(stages=stages)\n# 管道模型\npipelineModel = pipeline.fit(df)\n\
  # 在数据上应用管道模型\noutput, shorlisted_output = pipelineModel.transform(df)\n```\n\n太棒了！现在，你可以实现自己的自定义转换器，并创建一个简洁的机器学习工作流。\n\
  \n## 基于投票的选择\n\n到目前为止，我们已经讨论了多种变量选择技术。如果能将所有变量选择方案整合到一个流程中，那岂不是很好？你可以通过基于投票的架构来实现这一点。其思路是应用多种技术来选择变量。当一种变量选择技术选中某个变量时，你就为该变量分配一个分数。换句话说，该技术为这个变量投了一票。最后，你计算每个变量的总得分，并选择得分最高的变量（见图\
