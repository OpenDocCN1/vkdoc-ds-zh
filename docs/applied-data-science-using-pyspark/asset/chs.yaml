  此模块筛选变量，并选择预测能力最强的顶级变量。它使用随机森林来识别顶级变量。你可以通过此链接访问此模块的代码：`https://github.com/Apress/applied-data-science-using-pyspark/blob/main/Ch08/Chapter8_automator/feature_selection.py`。


