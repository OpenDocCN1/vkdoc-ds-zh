  \ check=True)\nexcept subprocess.CalledProcessError as err:\nprint(f'Command failure\
  \ with {command}: {err}')\n```\n\n### 9.2.2 需要类似字节的对象\n\n返回值 `Result` 的 `stdout`\
  \ 属性是一个字节数组，而非字符串。如果尝试对其应用字符串操作（如 `.split()`），Python 会引发 `TypeError`：\n\nPython：\n\
  \n```\nIn : import subprocess\nIn : x = subprocess.run('dir', capture_output=True)\n\
