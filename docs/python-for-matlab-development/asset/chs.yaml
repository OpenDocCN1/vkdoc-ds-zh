  # 10. 面向对象编程


  `Python` 从核心上就是面向对象的。每个项目——变量、函数、运算符、异常、信号，甚至字符串字面量——都是一个对象。`MATLAB` 也支持面向对象编程，实际上比
  `Python` 更为严谨，但灵活性也稍差。


  两种语言都不强制要求定义类；基于常规过程的编程完全可行，甚至可能是大多数科学家和工程师的默认方式。然而，在 `Python` 中定义和使用类的便捷性，为刚接触面向对象的开发者尝试这种编程范式简化了路径。


  对于初学者来说，对象是类的一个实例，就像变量是数据类型的一个实例一样。例如，在我们定义 `j` 为整数之前，整数类型的概念必须存在。当然，`MATLAB` 和
  `Python` 预定义了许多有用的数据类型和容器。类可以被视为一种用户定义的容器，它可以包含函数，称为*方法*，这些方法对该容器中的数据进行操作。在使用对象之前，我们必须定义用来创建对象的*类*。




  ## 10.1 类


  以下是一个定义圆形的简单类示例。它包含三个变量 `x`、`y` 和 `r`，用于定义圆心和半径，以及一个方法 `area()`，用于返回圆的面积。变量 `x`、`y`、`r`
  被称为*实例*变量，因为从这个类创建的每个对象（即每个类实例）都会拥有自己独立的圆心和半径值。


  除了实例变量，我们还将定义一个*类*变量 `MAX_R`，它由该类创建的所有对象共享。


  Python 类需要一个名为 `__init__()` 的显式构造函数，其第一个参数始终是占位符 `self`。然后，可以使用点号表示法在类中创建任意命名的属性。最常见的情况是，通过
  `self.x = x` 这样的代码行，将构造函数的调用参数赋值给类属性。


  | MATLAB: | Python: |

  | --- | --- |

  | `% code/OO/Circle.m` `classdef` `Circle` `properties (Constant)` `MAX_R = 20;`
  `end` `properties` `x {mustBeNumeric}` `y {mustBeNumeric}` `r {mustBeNumeric}` `end`
  `methods` `function obj = Circle(x,y,r)` `obj.x = x;` `obj.y = y;` `obj.r = r;`
  `obj.perim = 2*r*pi;` `end` `function [A] = area(obj)` `A = pi*obj.r²;` `end` `end`
  `end` | `import numpy as np` `class Circle:` `MAX_R= 20` `def` `__init__(self, x,y,r):`
  `self.x = x` `self.y = y` `self.r = r` `if` `self.r > circle.MAX_R:` `print(''too
  big'')` `self.r = circle.MAX_R` `self.R = r` `def` `area(self):` `return` `np.pi*self.r**2`
  |


  定义了 `Circle` 类之后，我们将创建对象 `a` 和 `b`，它们是 `Circle` 的实例：


  | MATLAB: | Python: |

  | --- | --- |

  | `>> a = Circle(0,0,10);` `>> b = Circle(1,2,4);` `>> b.y` `2` `>> a.area()` `314.1592`
  | `In : a = Circle(0,0,10)` `In : b = Circle(1,2,4)` `In : b.y` `Out: 2` `In : a.area()`
  `Out: 314.1592` |


  从类创建对象（例如 `a = Circle(0,0,10)`）这一操作，会调用该类的*构造函数*方法——在 MATLAB 中是与类同名的函数，在 Python
  中是 `__init__()` 函数——并将提供的参数传递给它。


  ### 10.1.1 私有与公有


  大多数面向对象语言通过将属性和方法指定为公有或私有来严格控制对它们的访问权限。前者可以被其他对象访问，而后者只能被对象自身的成员查看和更新。


  MATLAB 有实现访问控制的机制，但 Python 在这方面要宽松得多，它依赖命名约定来表明开发者的意图。简而言之，Python 中以双下划线为前缀的类属性会通过*名称修饰*进行隐藏，使其看起来像是私有的。名称修饰仅仅是在变量内部添加类名作为前缀，因此一个执着的用户仍然能够访问到这些数据。以下示例展示了
  `Circle` 类的一个变体，它定义了一个额外的属性 `perim`，作为一个存储圆周长的私有变量。


  | MATLAB: | Python: |

  | --- | --- |

  | `% file: code/OO/Circle.m` `classdef` `Circle` `properties (Constant)` `MAX_R
  = 20;` `end` `properties (Access = private)` `perim` `end` `properties` `x {mustBeNumeric}`
  `y {mustBeNumeric}` `r {mustBeNumeric}` `end` `methods` `function` `obj = Circle(x,y,r)`
  `obj.x = x;` `obj.y = y;` `obj.r = r;` `obj.perim = 2*r*pi;` `end` `function [A]
  = area(obj)` `A = pi*obj.r²;` `end` `end` `end` | `# file: code/OO/circle.py` `import
  numpy as np` `class Circle:` `MAX_R= 20` `def` `__init__(self, x,y,r):` `self.x
  = x` `self.y = y` `self.R = r` `self.__perim = 2*r*np.pi;` `def` `area(self):` `return`
  `np.pi*self.r**2` |


  ### 10.1.2 自定义打印函数


  在 MATLAB 中，可以通过重载 `disp()` 函数来更改类的打印表示形式；在 Python 中，则可以通过定义自定义的 `__str__()` 方法来实现。以下函数可以添加到前面的
  `Circle` 类中，用于以紧凑格式打印圆的属性。请注意，`__str__()` 返回的是一个字符串，而不是直接调用打印函数。


  | MATLAB: | Python: |

  | --- | --- |

  | `function` `disp(obj)` `fprintf(''X: %5.2f Y: %5.2f '', ...` `obj.x, obj.y);`
  `fprintf(''R: %5.2f\n'', obj.r);` `end` | `def` `__str__(self):` `return` `f''X:
  {self.x:5.2f} '' \` `f''Y: {self.y:5.2f} '' \` `f''R: {self.R:5.2f}''` |


  我们自定义的输出结果如下所示：


  | MATLAB: | Python: |

  | --- | --- |

  | `>> c = Circle(.4,6.6, 3.14);` `>> disp(c)` `X: 0.40 Y: 6.60 R: 3.14` | `In :
  c = Circle(.4,6.6, 3.14)` `In : print(c)` `X: 0.40 Y: 6.60 R: 3.14` |


  ### 10.1.3 自定义异常


  随着代码库的增长，其可能失败的方式也会增多。异常处理器有助于管理故障模式，而自定义异常可以增强异常处理器的功能，与通用错误相比，它能产生更具揭示性且更特定于应用程序的错误状态。在
  MATLAB 和 Python 中都很容易添加自定义异常。以下示例实现了一个简单的电动汽车模拟器，当汽车电池电量耗尽时，会抛出 `BatteryEmptyError`
  异常。该异常在 MATLAB 的 2–4 行和 Python 的 3–4 行中定义。


  MATLAB:


  ```

  1   % code/OO/ecar_sim.m

  2   errID = ''ecar_sim:NotNumeric'';

  3   msg = ''BatteryEmptyError'';

  4   BatteryEmptyError = MException(errID,msg);

  5   charge = 80.0; % kWhr

  6   d_rate = 0.002;

  7   while true

  8       km   =  50*rand();

  9       kmph = 20 + 120*rand();

  10       discharge = d_rate*km*(20 + abs(kmph - 80))¹.4;

  11       charge = charge - discharge;

  12       if charge < 0

  13           throw(BatteryEmptyError)

  14       end

  15       fprintf('' %4.1f km at %6.2f km/hr remaining: %5.2f kWhr\n'',...

  16             km, kmph, charge);

  17   end

  ```


  Python:


  ```

  1   # code/OO/ecar_sim.py

  2   import numpy as np

  3   class BatteryEmptyError(Exception):

  4       pass

  5   charge = 80.0 # kWhr

  6   d_rate = 0.002

  7   while True:

  8       km   =  50*np.random.rand()

  9       kmph = 20 + 120*np.random.rand()

  10       discharge = d_rate*km*(20 + np.abs(kmph - 80))**1.4

  11       charge -= discharge

  12       if charge < 0:

  13           raise BatteryEmptyError

  14       print(f'' {km:4.1f} km at {kmph:6.2f} km/hr ''

  15             f''remaining: {charge:5.2f} kWhr'')

  ```


  两个程序的输出看起来类似；Python 的输出为：


