  \n## 在多台计算机上设置 Dask 集群\n\n在单台计算机上运行 dask 是代码开发和初始故障排查中有用的第一步。然而，它在性能方面无法令人满意。要真正受益于\
  \ dask 的强大功能，我们需要在多台计算机上运行它。\n\n可以通过多种方式设置 dask 集群：手动方式（使用 ssh）；使用 Kubernetes；使用\
  \ Helm；或使用针对 LSF、MOAB、Slurm 和 PBS 等作业调度器的 dask 专用配置。本节介绍如何使用 ssh 实现 dask 集群，这可能是普通用户最容易上手的方法。Kubernetes、Helm、LSF\
  \ 等可能需要同事、DevOps 专家或集群管理员协助设置。Ssh 方法意味着两个前提条件：统一的 Python 安装和所有计算机间的无缝`ssh`访问。\n\n\
  具体来说，所有计算机应具备：\n\n*   兼容（最好相同）的 Python 安装\n*   Python 可执行文件的相同路径\n*   设置和使用集群的用户的相同账户名\n\
  *   该用户账户在所有计算机间具有统一的、基于密钥的双向`ssh`访问权限\n*   相同的`ssh`端口\n*   防火墙规则开放，允许 ssh 以及 dask\
  \ 调度器和指标端口（默认情况下为 8786 和 8787）\n\n一旦满足这些条件，将集群中每台计算机的 IP 地址（或主机名，如果名称解析有效）添加到主机文件（`my_hosts.txt`表示该文件，如下所示）。主机文件中列出的第一台计算机将运行后台调度器进程，所有计算机都将运行后台工作进程。然后在控制台中调用`dask-ssh`来启动调度器和工作进程：\n\
  \n```\ndask-ssh --hostfile my_hosts.txt\n```\n\n警告！\n\n\n\n# 设置分布式 Dask 集群\n\n使用\
  \ `dask-ssh` 设置分布式 Dask 集群是**极其不安全**的！任何知道调度器 IP 地址和端口的用户都可以连接到你的集群，并在启动工作器的账户（即你的账户）下运行任意\
  \ Python 代码。\n\n设置安全的多用户 Dask 集群的正确方法是配置一个 `dask-gateway`<sup>84</sup>，它实现了身份验证层。\n\
  \n### 14.13.5 示例 2：多台计算机上的质因数之和\n\n一旦 Dask 集群中的计算机运行了调度器和工作器，我们就可以开始享受显著的性能提升。本节使用\
