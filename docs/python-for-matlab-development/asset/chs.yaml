  \nPython 四种赋值表达式中的最后一种，即海象运算符（`:=`），是在 Python 3.8 中引入的。它的工作方式类似于传统的赋值语句，但有一个附加效果：整个表达式（包括左侧和右侧）的值等于右侧的值。海象运算符在\
