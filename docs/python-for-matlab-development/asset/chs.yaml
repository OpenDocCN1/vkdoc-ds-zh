  以下示例展示了如何打印 `top_dir` 下每个文件的完整限定名称：\n\n| MATLAB: | Python: |\n| --- | --- |\n| `files\
  \ = dir(fullfile(... top_dir,'**'));` `files = files(~[files.isdir]);` `for i =\
  \ 1:size(files,1)` `fprintf('%s/%s\\n', ... files(i).folder, ... files(i).name)`\
