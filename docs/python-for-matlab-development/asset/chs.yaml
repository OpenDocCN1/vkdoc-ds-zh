  \ `>> a = [2 7; 3 8; 4 9]` `a =` `2   7` `3   8` `4   9` `>> b = [ 1 5]` `b =` `1\
  \   5` `>> a*b` `37` `43` `49` | `In : a = np.array([[2,7],[3,8],[4,9]])` `In :\
