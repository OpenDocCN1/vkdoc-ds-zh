  \n# 脚注\n\n# 15. 语言陷阱\n\n## 15.1 棘手的语言特性\n\nMATLAB 和 Python 都不是理想的语言。两者都有令人烦恼甚至危险的地方——至少对于不熟悉语言设计中微妙细节的新手程序员而言。对其中一种语言的批评者热衷于指出对方的缺陷，同时对自己偏爱的语言所遭受的批评却视而不见。\n\
  \n## 15.2 MATLAB\n\n*   **危险：** 混合类型的数学表达式会*向下*而非向上进行类型转换。\n\n```\n>> a = uint8(1)\
  \ - 0.6\na =\nuint8\n```\n\n结果得到 0 而不是 0.4，这令人震惊（或者更直白地说，完全错误）。MATLAB 在这一设计选择上独树一帜。C、C++、Fortran、Go、Java、JavaScript、Julia、Mathematica、OCaml、Python+NumPy、R、Rust\
  \ 和 Scala 都向上进行类型转换，并对上述计算得出预期的浮点值 0.4。不言而喻，MATLAB 的向下转换可能会导致毫无戒心的开发者得到错误的结果。\n\n\
  *   **危险：** MATLAB“命名空间中存在你能想到的一切函数”这一特性，会导致在装有相同版本 MATLAB 但不同工具箱的计算机上运行同一个 `.m`\
  \ 文件时产生意外行为。\n\n*   **令人烦恼：** 虽然一个 `.m` 文件可以包含多个函数，但除非将这些函数所在文件转换为类，否则其他 `.m` 文件无法调用其中任何一个。在不采用面向对象编程的大型项目中，代码最终会分散在数百个\
  \ `.m` 文件中。这给代码编辑、调试和项目文件管理增加了后勤上的麻烦。\n\n*   **令人烦恼：** 矩阵切片继承的是原始矩阵的维度，而不是切片自身的维度。例如，如果我们创建一个\
  \ 4D 矩阵，然后沿每个维度提取一个 1D 切片，结果是具有两、三或四个维度的数组：\n\n```\n>> a = rand(3,4,5,6);\n>> size(a)\n\
  3     4     5      6\n>> size(a(:,1,1,1))\n3     1\n>> size(a(1,:,1,1))\n1     4\n\
  >> size(a(1,1,:,1))\n1     1     5\n>> size(a(1,1,1,:))\n1     1     1       6\n\
  ```\n\n这会为诸如 `plot()` 这样无法处理超过两个维度的函数带来问题：\n\n```\n>> plot(a(:,1,1,1))   % 绘图成功\n\
  >> plot(a(1,:,1,1))   % 绘图成功\n>> plot(a(1,1,:,1))\n使用 plot 时出错\n数据不能超过两个维度。\n```\n\
  \n为了获得期望的行为——在此示例中即一个仅包含一个维度的切片——必须显式地对切片调用 `squeeze()`。\n\n*   **令人烦恼：** 默认的 Emacs\
  \ 键绑定（*control*-w 和 *control*-y 用于剪切和粘贴；*control*-x *control*-s 用于保存等）会激怒新的 MATLAB\
  \ 用户。世界其他地区已采用适用于 GUI 应用程序的 Windows 键绑定（*control*-c 和 *control*-v 用于剪切和粘贴；*control*-s\
  \ 用于保存等）。虽然 MATLAB IDE 允许用户将键绑定更改为 Windows 风格（主页/环境/偏好设置/键盘/快捷键/活动设置/Windows 默认设置），但似乎只有少数用户知道这一点，并继续使用默认设置。\n\
  \n\n```\n-   **令人困扰：** 无法将函数定义直接复制粘贴到 MATLAB 提示符中——`\"Error: Function definition\
  \ not supported in this context. Create functions in code file.\"` 这阻碍了对简单函数进行快速的沙盒测试。\n\
  -   **令人困扰：** 无法控制传递给 MATLAB 函数的参数是按值传递还是按引用传递。^((87)) 从技术上讲，所有参数都是按引用传递的，但 MATLAB\
  \ 的即时编译器会采用写时复制逻辑，该逻辑可能遵循也可能不遵循代码中对输入和输出参数的重复使用。如果即时编译器决定复制变量而非就地使用，则可能导致严重的性能损失。\n\
  -   **令人困扰：** 除非工具箱已经安装，否则无法确定一个 MATLAB 程序需要哪些工具箱。换句话说，如果从外部来源收到一个 MATLAB 程序，`matlab.codetools.requiredFilesAndProducts()`\
  \ 函数只会报告在运行该函数的计算机上已找到的程序所依赖的工具箱。\n-   **令人困扰：** 关键字 `end` 用于关闭索引范围、类、函数、`if` 块、`for`\
  \ 循环、`while` 循环、`switch/case` 语句、`try/catch` 块以及其他可能的语言结构。虽然 MATLAB 集成开发环境能轻松看出一个\
  \ `end` 关闭的是哪个结构，但在功能较弱的编辑器、纸质文档、网页、PDF 或 Word 文档中查看 m 文件时，这种配对会变得相当困难。\n-   **令人困扰：**\
  \ 这是函数还是数据结构？MATLAB 使用圆括号向函数传递参数*同时*也用于索引矩阵和元胞数组，这使得无法通过查看代码（例如 `grF(x)`）来判断符号 `grF`\
  \ 是函数还是数据容器。在 Python 中，你可以立即识别出 `grF(x)` 是函数调用，而 `grF[x]` 是索引过的数据容器。\n-   **令人困扰：**\
  \ 由 MathWorks 托管的 MATLAB File Exchange 是一个由用户贡献的 m 文件资源库，非常有价值。与 GitHub 或 SourceForge\
  \ 等其他代码分享网站不同，从 File Exchange 下载需要经过身份验证的登录。这一不便之处阻碍了 MATLAB 代码的分享。\n\n## 15.3 Python\n\
  \n-   **危险：** 列表和 NumPy 数组在使用标量索引进行索引时会进行边界检查，但使用索引范围时不会。这可能导致错误在程序中无声地传播（第 4.​3.​6\
  \ 节）。\n-   **危险：** 当等号右侧是一个数据结构时，左侧的变量会成为右侧数据的*引用*，而不是其副本（第 4.​8 节）。因此，如果 *A* 是一个列表、字典、NumPy\
  \ 数组等，那么赋值语句 *B* = *A* 会得到两个指向同一数据的变量。对 *A* 的更改会变成对 *B* 的更改，反之亦然。要使 *B* 包含 *A* 数据的副本，必须导入\
  \ `copy` 模块并使用其 `copy()` 或 `deepcopy()` 函数。不了解 Python 引用复制行为的开发者很可能会看到数据损坏以及代码计算结果错误。\n\
  -   **令人困扰：** 对于期望 `N` 出现的 MATLAB 程序员来说，索引切片 `M:N` 以及对 `range(N)` 和 `np.arange(N)`\
  \ 的调用令人抓狂。这些结构“不使用终值”的行为需要很长时间才能适应。\n-   **令人困扰：** NumPy 和 SciPy 都有一个名为 `linalg`\
  \ 的线性代数子模块，它们包含常用函数但功能不同。例如，`scipy.linalg.eig()` 可以解决标准 (*Ax* = *λx*) 和广义 (*Ax*\
  \ = *λBx*) 特征值问题，而 `numpy.linalg.eig()` 只解决标准问题。至少，这两个函数的内置文档中都应该有一个“另请参阅”条目，指向另一个模块中的对应函数。\n\
  ```\n\n\n# 内容排版\n\n- **烦人之处**：与 MATLAB 全面实现的稀疏矩阵相比，Python 的稀疏矩阵感觉像是二等公民。\n\n- **烦人之处**：类型转换\
  \ NumPy 数组需要与转换标量不同的表示法。以下示例展示了将标量和数组从整数转换为双精度浮点数的语法：\n\n```\nIn : I_scalar = 4\
  \  # 64 位整数\nIn : I_array  = np.array(([5, 6]), dtype=np.int64)\nIn : D_scalar =\
  \ np.double(I_scalar)        # <- 类型转换标量\nIn : D_array = I_array.astype(np.double)\
  \   # <- 类型转换数组\n```\n\n`I.astype(np.double)`这种表示法并不直观。如果能像编写`np.float(I)`这样来将 NumPy\
  \ 数组以及标量都转换为浮点数，会更清晰。\n\n- **烦人之处**：虚拟环境是一个累赘。它们迫使你将模块集合分散到多个环境中，然后还得记住哪个环境能做什么，从而增加了不必要的复杂性。\n\
