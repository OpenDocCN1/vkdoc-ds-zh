  2. Wes McKinney。 *Python for Data Analysis, 第 2 版*。O'Reilly Media，2017 年。\n\n# 脚注\n\
  \n# 14. 高性能计算\n\n从事大规模或长时间数值工作的工程师、科学家和数据分析师总是渴望更快的速度、更多的核心、内存、带宽和存储。就其本质而言，数值模型总能通过更高的分辨率、更精细的离散化以及一切——自由度、时间步长、频率区间、神经元、层数、迭代次数、像素、光线、案例——的丰富性来改进。MATLAB\
  \ 的很大一部分用户都属于这个对计算能力有强烈需求的人群。MathWorks 投入了大量精力，使其核心客户群能够最大限度地发挥 MATLAB 的性能。因此，性能问题将会引起许多研究\
  \ Python 的 MATLAB 用户的兴趣。\n\n在本章中，我们将研究使 Python 代码运行得更快的方法。推而广之，更快的 Python 代码可能意味着更快的\
  \ MATLAB 代码，因为 MATLAB 可以调用 Python。编写更快代码的步骤对于高性能计算（HPC）的实践者来说应该很熟悉：\n\n1.  对程序进行性能分析，了解时间消耗在哪里。\n\
  2.  尽可能消除冗余的 I/O 并批量处理 I/O 操作。\n3.  研究代码中耗时部分的算法复杂度。例如，是否存在可以用 O(*N* log *N*) 算法替代的\
  \ O(*N*²) 步骤？\n4.  启用编译器或解释器的优化功能。\n5.  将数据组织到连续的内存块中。\n6.  将算法中适合向量化的部分实现为向量操作。\n\
  7.  调用优化库中的函数（这些库通常用编译型语言编写）。\n8.  将工作任务分配到同一台机器的多个核心上。\n9.  使用拥有更多核心的硬件（特别是 GPU）。\n\
  10. 将工作任务分配到多台机器上。\n\n高性能计算中的一个基本挑战是，步骤 3-10 常常相互冲突，它们的相对收益会随着问题类型、规模和可用计算机硬件的变化而变化。在\
  \ GPU 上运行的 O(*N*²) 算法可能比在传统 CPU 上运行的 O(*N* log(*N*)) 算法更快，而一个在单台多核计算机上运行的通信密集型并行程序，可能比在多个由慢速网络连接的类似计算机上运行的同一程序还要快。在性能权衡空间中找到一个合适的平衡点，最终归结为你愿意投入多少精力来实现令人满意的速度提升。\n\
  \n## 14.1 提升 Python 代码速度的路径\n\n在前面列出的十个步骤中，我们将重点关注四个具有 Python 特定方面的步骤：\n\n1.  使用\
  \ Python 专用工具（如 Cython、Numba 和 Pythran）提升单 CPU 性能。\n2.  使用 `multiprocessing`、Pythran、Numba\
  \ 或 Dask 在多个核心上并行化代码。\n3.  用 C、C++ 或 Fortran 重写关键代码段，并为其创建 Python 接口模块。\n4.  使用\
  \ Dask 在多台计算机上并行化代码。\n\n正如我们将在本章末尾的实践指南（第 [14.12] 节(#516169_1_En_14_Chapter.xhtml#Sec28)和第\
  \ [14.14] 节(#516169_1_En_14_Chapter.xhtml#Sec51)）中看到的，MATLAB 程序也可以通过调用加速后的 Python\
  \ 代码来显著提高运行速度。\n\n\n\n## 14.2 参考问题\n\n我们将用两个程序来演示 Python 中的 HPC 技术。第一个程序用于计算曼德勃罗特集合的项，它看起来直截了当，但存在负载均衡方面的问题，使得向量化变得复杂。第二个程序是一个有限元求解器，更接近真实世界的问题。它涉及从数十兆字节的文本数据中加载数据，组装具有一百万个自由度的稀疏质量矩阵和刚度矩阵，并利用它们求解广义特征值问题。代码分布在多个文件和类中。\n\
  \n这些参考程序也使用 MATLAB 进行了实现，以便与 Python 版本进行性能比较。\n\n关于这些问题的最后一点说明是，它们的绝对性能数值并不是特别重要。这些参考问题被用作你希望进行的计算密集型工作的代表。其目的是展示寻找代码慢速部分、加速选项的详细步骤，并比较各种技术及其有效性。\n\
  \n### 14.2.1 曼德勃罗特集合\n\n“曼德勃罗特集合是满足以下条件的模长 ≤ 2 的复数 *c* 的集合：对于函数 *f**c* = *z*² +\
  \ *c*，当从 *z* = 0 开始迭代时，该函数不会发散，即序列 *f**c*, *f**c*) 等的绝对值保持有界。”^(⁶⁴) 换句话说，如果我们选择一个随机复数\
  \ *c*（模长 ≤ 2），并将复数 *z* 初始化为零，那么在第几次迭代 *i* 时，递推式 ![$$ {z}_{i+1}={z}_i²+c $$](img/516169_1_En_14_Chapter_TeX_IEq1.png)\
  \ 的值会超过 2？该集合通常被可视化为一个等值线图，其中迭代次数 *i* 是 *z* 的实部和虚部的函数。\n\n虽然这是一个“玩具”问题，但有几个方面使得计算曼德勃罗特集合的项对于说明\
  \ HPC 问题很有用：算法易于描述，可以用少量代码实现，可以向量化并轻松并行实现，同时具有不平凡的负载均衡方面，并且可以任意扩大规模。由此产生的迷人图像是一个不错的附加好处。\n\
  \n以下是我们顺序实现的参考代码：\n\n| MATLAB | Python |\n|--------|--------|\n| `% file: code/hpc/MB_main.m`<br>`main()`<br>**function**\
  \ `[i]=nIter(c, imax)`<br>&nbsp;&nbsp;&nbsp;&nbsp;`z = complex(0,0);`<br>&nbsp;&nbsp;&nbsp;&nbsp;`for\
  \ i = 0:imax-1`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`z = z*z + c;`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`if\
  \ abs(z) > 2`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`break`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`end`<br>&nbsp;&nbsp;&nbsp;&nbsp;`end`<br>`end`<br>**function**\
  \ `[img]=MB(Re,Im,imax)`<br>&nbsp;&nbsp;&nbsp;&nbsp;`nR = size(Im,2);`<br>&nbsp;&nbsp;&nbsp;&nbsp;`nC\
  \ = size(Re,2);`<br>&nbsp;&nbsp;&nbsp;&nbsp;`img = zeros(nR, nC, ...`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`'uint8');`<br>&nbsp;&nbsp;&nbsp;&nbsp;`for\
  \ i = 1:nR`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`for j = 1:nC`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`c\
  \ = complex(Re(j),Im(i));`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`img(i,j)\
  \ = nIter(c,imax);`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`end`<br>&nbsp;&nbsp;&nbsp;&nbsp;`end`<br>**end**\
  \ | `#!/usr/bin/env python3`<br>`# file: code/hpc/MB.py`<br>**import numpy as np**<br>**import\
  \ time**<br>**def** `nIter(c, imax):`<br>&nbsp;&nbsp;&nbsp;&nbsp;`z = complex(0,\
  \ 0)`<br>&nbsp;&nbsp;**for** `i` **in** `range(imax):`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`z\
  \ = z*z + c`<br>&nbsp;&nbsp;&nbsp;&nbsp;`if abs(z) > 2:`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`break`<br>&nbsp;&nbsp;&nbsp;&nbsp;`return\
  \ np.uint8(i)`<br>**def** `MB(Re, Im, imax):`<br>&nbsp;&nbsp;&nbsp;&nbsp;`nR = len(Im)`<br>&nbsp;&nbsp;&nbsp;&nbsp;`nC\
  \ = len(Re)`<br>&nbsp;&nbsp;&nbsp;&nbsp;`img = np.zeros((nR, nC),`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`dtype=np.uint8)`<br>&nbsp;&nbsp;**for**\
  \ `i` **in** `range(nR):`<br>&nbsp;&nbsp;&nbsp;&nbsp;**for** `j` **in** `range(nC):`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`c\
  \ = complex(Re[j],Im[i])`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`img[i,j] = nIter(c,imax)`<br>&nbsp;&nbsp;**return**\
  \ `img` |\n| **function** `[] = main()`<br>&nbsp;&nbsp;&nbsp;&nbsp;`imax = 255;`<br>&nbsp;&nbsp;&nbsp;&nbsp;`for\
