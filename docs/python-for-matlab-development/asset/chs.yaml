  >> plt = py.importlib.import_module(''matplotlib.pyplot'');

  >> plt.plot()

  ```


  ![](img/516169_1_En_1_Figa_HTML.jpg)


  解决方法是配置一个不同的 `matplotlib` 后端：Linux 和 macOS 上使用 `TkAgg`，Windows 上使用 `WXAgg`；详细内容见第
