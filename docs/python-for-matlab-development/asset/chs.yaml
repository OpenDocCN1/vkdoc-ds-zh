  \ Command '['ffmpeg', '-loglevel', 'quiett',\n'-i', 'triple-pendulum.mp4', 'triple-pendulum.webm']'\n\
  returned non-zero exit status 1.\n```\n\n在 MATLAB 中处理系统调用错误意味着检查非零错误状态；在 Python\
  \ 中则使用 `check=True` 调用 `subprocess.run()` 并捕获 `subprocess.CalledProcessError` 错误：\n\
