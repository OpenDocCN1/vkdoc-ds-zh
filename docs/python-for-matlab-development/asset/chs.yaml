  \n**生成器**——Python 中有而 MATLAB 中没有——与目录树遍历配合得很好。它们允许在找到文件后立即对其进行操作，然后再返回文件系统继续搜索。在\
  \ MATLAB 中，可以通过向搜索函数传递一个执行所需操作的回调函数来实现这一点——但回调函数会增加一层复杂度，使代码更难阅读。当然，也可以将额外的操作嵌入搜索函数内部，但这会破坏函数的通用性。\n\
  \n下面的 Python `find()` 函数是一个基于生成器的树遍历器，它返回所有找到的文件，或者可选地只返回具有特定文件扩展名的文件。我们将使用它来递归地遍历\
  \ `data/` 目录。每次找到一个 `.xlsx` 文件时，都会从中提取一些数据（这里，一个假设的 `extract_revenue()` 函数返回从文件中获取的值；参见第\
  \ 7.​7 节关于从 `.xlsx` 文件读取数据的内容）。\n\nPython:\n\n```\nimport os\ndef find(top_dir,\
  \ extension=None):\nfor root, dirs, files in os.walk(top_dir):\nfor F in files:\n\
  if extension and not F.endswith(extension):\ncontinue\nyield f'{root}{os.sep}{F}'\
  \  # <- yield 使 find() 成为一个生成器\n\ntotal_revenue = 0\nfor F in find('data', extension=\"\
  .xlsx\"):\ntotal_revenue += extract_revenue(F)\n```\n\n# 9. 与操作系统和外部可执行程序交互\n\n\
  复杂的工作流程很少只依赖于 MATLAB 或 Python。其他应用程序，无论是自定义的内部工具、商业仿真和建模套件，还是开源工具，都在更宏大的场景中扮演着重要角色。在本章中，我们将了解\
  \ Python 程序如何与底层操作系统和其他可执行程序交互。我们将读取和更改环境变量、调用其他程序并捕获其输出、监控主机计算机的内存和 CPU 使用情况，以及终止超过给定资源阈值的进程。\n\
  \n## 9.1 读取、设置环境变量\n\n在 Python 中，可以通过 `os.environ` 对象访问环境变量；在 MATLAB 中，则通过 `getenv()`\
  \ 函数访问：\n\n| MATLAB: | Python: |\n| --- | --- |\n| `>> getenv('HOME')` `ans = /home/al`\
  \ | `In : import os` `In : os.environ['HOME']` `Out: '/home/al'` |\n\n`os.environ`\
  \ 比 `getenv()` 更具优势，因为它的行为类似于字典。这允许你遍历所有已知的环境变量（回想一下第 4.​2.​3 节，格式选项 `<10s` 表示“一个字符串，宽度为\
  \ 10 个字符，左对齐”）：\n\nPython:\n\n```\nIn : for V in sorted(os.environ):\n...:     print(f'{V:<10s}\
  \ = {os.environ[V]}')\nAUTOJUMP_ERROR_PATH = /home/al/.local/share/autojump/errors.log\n\
  AUTOJUMP_SOURCED = 1\nCLUTTER_IM_MODULE = xim\nCOMPIZ_BIN_PATH = /usr/bin/\nCOMPIZ_CONFIG_PROFILE\
  \ = ubuntu\nCONDA_DEFAULT_ENV = base\nCONDA_EXE  = /usr/local/anaconda3/bin/conda\n\
  CONDA_PREFIX = /usr/local/anaconda3\n:\n```\n\nMATLAB 实现这一点则要困难得多。Stack Overflow\
  \ 上最常用的方法是解析对系统调用的输出结果，在 Linux 和 macOS 上调用 `env`，在 Windows 上调用 `set`。这一点将在第 9.2\
  \ 节中介绍，其中会描述两种语言中的系统调用。\n\n环境变量也可以通过编程方式设置，尽管程序所做的更改仅在其进程的生命周期内有效。当程序结束时，运行该程序的会话中的环境变量保持不变。\n\
  \n在 Python 中，可以像设置字典键一样简单地通过 `os.environ` 来赋值环境变量。MATLAB 则使用其 `setenv()` 函数来设置变量。\n\
  \n| MATLAB: | Python: |\n| --- | --- |\n| `>> setenv('N_CASES', '42')` `>> getenv('N_CASES')`\
  \ `ans = 42` | `In : import os` `In : os.environ['N_CASES'] = '42'` `In : os.environ['N_CASES']`\
  \ `Out: '42'` |\n\n两种语言都有一个共同的小问题：只允许使用字符串值。MATLAB 会接受一个整数并自动将其类型转换为字符串，但结果字符串可能并非预期的那样；整数\
  \ 42 会变成其 ASCII 字符等效的“`*`”。Python 则会抛出一个 `TypeError` 错误：\n\n| MATLAB: | Python:\
  \ |\n| --- | --- |\n| `>> setenv('A', 42)` `warning: implicit conversion from scalar\
  \ to sq_string` `>> getenv('A')` `ans = *` | `In : import os` `In : os.environ['N_CASES']\
  \ = 42` `Out: TypeError: str expected, not int` |\n\n\n\n## 9.2 调用外部可执行程序\n\n在 MATLAB\
  \ 中，外部系统调用通过 `system()` 函数实现；在 Python 中，则使用 `subprocess` 模块中的函数：`subprocess.run()`\
  \ 或 `subprocess.Popen()`。其中 `.run()` 函数与 MATLAB 的 `system()` 最为相似，而 `.Popen()` 允许用户编排整个应用程序链的执行过程，将一个程序的输出通过管道传递给下一个程序的输入。\n\
  \n尽管 `subprocess.run()` 与 `system()` 类似，但两者的运行方式存在显著差异。MATLAB 的 `system()` 只有 1\
  \ 个可选参数（`'-echo'`，用于额外在命令窗口中显示命令的输出；适用于与外部命令交互），而 Python 的 `subprocess.run()` 有\
  \ 14 个可选参数。其中最常用的参数——`check`、`capture_output`、`shell`、`timeout`——通过以下示例加以说明。\n\n\
  在第 9.1 节中，我们看到 MATLAB 需要调用操作系统的 `env`（Linux、macOS）或 `set`（Windows）命令来获取所有环境变量及其值的列表。虽然\
  \ Python 可以通过 `os.environ` 对象直接访问这些内容，但我们仍通过系统调用来完成相同任务。\n\nMATLAB：\n\n```\n>> [Status,\
  \ Result] = system('env');\n```\n\nPython：\n\n```\nIn : import subprocess\nIn :\
  \ Result = subprocess.run(['env'], capture_output=True)\n```\n\nMATLAB 的返回变量 `Status`\
  \ 和 `Result` 分别是一个 double 类型（值 0 表示命令成功运行；非零值表示错误）和一个包含命令全部 STDOUT 流的字符数组。可以通过 `strsplit(Result,\
  \ '\\n')` 按换行符分割 `Result`，从而迭代处理各输出行。\n\nPython 的 `Result` 是一个对象，其属性包括 `.returncode`（相当于\
  \ MATLAB 中的 `Status`）、`.stdout`（相当于 MATLAB 中的 `Result`）以及 `.stderr`（包含命令生成的错误信息，如果有的话）。奇怪的是，MATLAB\
  \ 的 `system()` 没有提供捕获 STDERR 的机制。\n\n我们继续以示例说明：迭代来自 `env` 系统调用的输出行，并提取环境变量的名称和值。\n\
  \nMATLAB：\n\n```\n[Status, Result] = system('env');\nlines = strsplit(Result, '\\\
  n');   % 从 Result 中分离各行\nfor i = 1:len(lines)\nX = strsplit(lines{i,1}, '=');\n\
  var = X{1,1};\nval = X{1,2};\nfprintf('%-10s : %s\\n', var, val);\nend\n```\n\n\
  Python：\n\n```\nimport subprocess\nResult = subprocess.run(['env'], capture_output=True)\n\
  lines = Result.stdout.decode() # 将字符数组转为字符串\nfor L in lines.split('\\n'):\nvar,\
  \ val = L.split('=')\nprint(f'{var:<10s} : {val}')\n```\n\n### 9.2.1 检查失败情况\n\n\
  外部可执行程序可能因多种原因失败：命令未找到、非法参数、缺失或格式错误的输入、处理错误、对输出位置的写入权限不足，等等。这些并非 Python 错误，因此默认情况下，如果提供给\
  \ `subprocess.run()` 的命令执行失败，函数仍会返回，Python 程序会继续运行。`Result.returncode` 将不为零，因此我们知道命令执行失败，但不知失败原因。\n\
  \n通过将可选关键字变量 `check` 设置为 `True`，可以改变这一行为。这样，外部可执行程序的失败会作为 `CalledProcessError` 异常传递到\
  \ Python 程序中。\n\n为了探究失败行为，我们将使用 `ffmpeg`（一款强大的音频和视频处理程序）将一个 MPEG4 视频文件转换为压缩率更高的\
  \ WebM 格式。作为输入文件，我们可以使用 Jake VanderPlas 创建的一个展示三摆混沌运动的 MPEG4 文件^(³¹)；该文件可从 [`http://jakevdp.github.io/videos/triple-pendulum.mp4`](http://jakevdp.github.io/videos/triple-pendulum.mp4)\
  \ 下载。\n\n用于转换文件的典型 `ffmpeg` 命令如下：\n\n```\nffmpeg -loglevel quiet -i triple-pendulum.mp4\
  \ triple-pendulum.webm\n```\n\n如果 `ffmpeg` 可执行程序位于环境的搜索路径中，并且输入文件可读，那么 Python 和\
  \ MATLAB 都应该能够顺利调用该命令并生成 WebM 文件。\n\n我们要研究的并非成功案例，而是失败情况。为了触发失败，我们将日志级别设置 `quiet`\
  \ 错误拼写为 `quiett`。\n\n在以下 Python 代码中，我们将在 `subprocess.run()` 的参数中启用可选的 `check` 选项。\n\
  \nMATLAB：\n\n```\n>> command = \"ffmpeg -loglevel quiett -i triple-pendulum.mp4\
  \ triple-pendulum.webm\";\n>> [Status, Result] = system(command);\n```\n\nPython：\n\
  \n```\nimport subprocess\ncommand = ['ffmpeg', '-loglevel', 'quiett', '-i',\n'triple-pendulum.mp4',\
  \ 'triple-pendulum.webm']\nResult = subprocess.run(command, check=True)\n```\n\n\
  MATLAB 和 Python 的错误信息如下所示：\n\nMATLAB：\n\n```\n>> [Status, Result] = system(command);\n\
  >> Status\n\n>> Result\n'[4;31mInvalid loglevel \"quiett\". Possible levels are\
  \ numbers or:\n[0m[4;31m\"quiet\"\n[0m[4;31m\"panic\"\n[0m[4;31m\"fatal\"\n[0m[4;31m\"\
  error\"\n[0m[4;31m\"warning\"\n[0m[4;31m\"info\"\n[0m[4;31m\"verbose\"\n[0m[4;31m\"\
  debug\"\n[0m[4;31m\"trace\"\n[0m'\n```\n\nPython：\n\n```\nIn : Result = subprocess.run(command,\
  \ check=True)\nInvalid loglevel \"quiett\". Possible levels are numbers or:\n\"\
