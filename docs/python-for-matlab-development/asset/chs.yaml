  \n大型项目的文件通常会分布在多级嵌套的目录中。通过编程方式遍历目录树——“遍历目录树”——是一项基本任务，可用于查找感兴趣的文件、汇总集合中的数据，或者仅仅是收集现有文件的元数据（例如文件数量、占用的空间大小、最新文件的添加时间）。\n\
