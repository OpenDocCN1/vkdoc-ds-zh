  In : v.reshape(1,3)       # 行\nOut: array([[1, 2, 3]])\nIn : v.reshape(3,1)    \
  \   # 列\narray([[1],\n       [2],\n       [3]])\n```\n\n```\nIn : v = np.array([1,\
