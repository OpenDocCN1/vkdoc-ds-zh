  \ Fortran 接口。\n\n## 14.13 使用 Dask 进行分布式内存并行处理\n\n前面的章节展示了将工作负载分布到计算机的多个核心上可以显著提升性能。我们还可以做得更好——好得多——通过将工作负载分布到多台计算机上。有几个\
  \ Python 模块，包括 Ray、^(⁷⁹) dispy^(⁸⁰) 和 dask^(⁸¹)，都可以轻松地运行一个将任务分发给多台计算机的 Python 程序。\n\
  \nDask 相对于其他模块有其优势，因为它还提供了一个外核数据容器，即 `dask` 数组，它支持对计算机内存无法容纳的大型数组进行计算，类似于 MATLAB\
  \ 的“tall 数组”。此外，`dask` 得到了 Coiled^(⁸²) 的支持，后者为 `dask` 作业提供商业支持和云计算服务。Coiled 每月为\
  \ `dask` 作业提供最多 100 个核心、总计 1000 小时的免费 CPU 时间，这对于无法访问高端计算集群的个人来说颇具吸引力。\n\n后续章节将使用\
  \ Dask 来演示分布式内存并行处理。主要的 `dask` 概念在第 14.13.2 节中介绍，但如果没有详细的示例，这些概念可能意义不大。第 14.13.3\
  \ 节将给出这样一个示例，我们将在该节中解决一个“易并行”且计算密集型的问题——对许多数字的质因数求和。首先，我们只使用单台计算机的多个核心。\n\n真正的乐趣要从我们使用多台计算机才开始。在我们能在多台计算机上运行\
  \ `dask` 之前，必须在这些计算机上启动后台调度程序和工作者作业；相关细节将在第 14.13.4 节中解释。一旦后台机制就绪，在第 14.13.5 节中，我们将在一组计算机上重新运行质因数求和问题，并看到一些不错的加速效果。\n\
  \n内存密集型作业会带来额外的复杂性。在第 14.13.6 节中，我们将使用一组只有 1 GB 内存的计算机制作我们在第 14.2 节中计算过的 Mandelbrot\
  \ 集合的十亿像素图像。不用说，我们必须采取预防措施以避免崩溃。\n\n最后，在第 14.13.7 节中，我们将结合使用 `dask` 积累的经验来解决一个与真实世界应用非常相似的问题。我们将使用一个包含\
  \ 50 万个自由度的模型，通过跨越数千个频率的频域解决方案，求解一个瞬态动态有限元问题。此类问题在单台计算机上可能需要数天时间，但我们将使用 Coiled 的云服务，在不到\
  \ 15 分钟内（无论通过 Python 还是 MATLAB）获得解决方案。\n\n### 14.13.1 并行 MATLAB\n\n与 Python 一样，MATLAB\
  \ 也可以在分布式内存集群和云集群上运行。最直接的方法是使用并行计算工具箱。其他选项包括使用 MATLAB Coder 或 MATLAB Compiler 创建可以发送到远程计算机的独立可执行文件。\n\
  \nMathWorks 还提供 MATLAB Online，并通过它提供 MATLAB in the Cloud，但其功能仅限于您的 MATLAB 许可证所启用的功能。换句话说，如果您没有并行计算工具箱或云使用的许可证，您将无法在云中的多台计算机上运行您的\
  \ `m-files`。\n\n如前所述（第 1.​3 节），本书的范围仅限于核心 MATLAB 产品，这排除了将纯 MATLAB 云解决方案与其对应的 Python\
  \ 解决方案进行比较的可能性。尽管如此，我们将在第 14.14 节中看到，混合 MATLAB/Python 代码在私有集群以及 Coiled 云上都运行得非常高效。\n\
  \n### 14.13.2 Dask 执行范式与性能预期\n\n\n\n# Dask 执行范式\n\nDask 的执行范式涵盖四个主要概念：\n\n- **集群**是任务所有者可以访问的计算机集合。集群中的计算机必须具有一致的\
  \ Python 安装环境，并包含 `dask` 和 `distributed` 模块。集群实际上可以小到只有你当前正在使用的单台计算机（此时 dask 任务会分布到该计算机的多个核心上），也可以是大型\
  \ HPC 计算集群（可选配 LSF、Slurm 或 PBS 等独立任务调度器）。在后一种情况下，用户必须在所有计算机上拥有相同的账户，能够无密码通过 `ssh`\
  \ 在计算机之间通信，或者能够通过单独的任务调度器向计算机提交任务。\n\n- **dask-scheduler** 和 **dask-worker** 是在集群计算机上运行的后台任务。调度器的实例运行在其中一台计算机上，而每个计算机上则运行一个工作节点实例。这些进程需要通过\
  \ `dask-ssh` 命令手动启动，或者由任务调度器特定的配置文件来启动和管理。\n\n- **客户端**是通过连接到 dask 调度器进程创建的 Python\
  \ 变量。\n\n- **延迟**任务是一个 Python 函数及其调用参数，它不会立即执行，而是被添加到一个待执行的任务列表中。\n\n一个支持 dask 的\
  \ Python 程序会先用延迟任务填充一个列表，然后将此列表传递给 `dask.compute()`。这个函数将任务交给 dask 调度器，调度器再将每个任务发送给下一个空闲的工作节点（可能运行在不同的计算机上）。工作节点接收到任务后，会使用用户提供的参数调用任务对应的用户定义函数，然后将返回值发送回调度器。`dask.compute()`\
  \ 从调度器获取任务的返回值，并将其追加到结果列表中。我们的程序负责设置好要并行执行的函数调用，而 dask 则处理其余的一切——将这些调用分配给处理器，序列化并通过网络发送输入参数，在远程计算机上执行调用，最后将返回值序列化并发送回启动任务的计算机。\n\
  \ndask 带来的便利性伴随着一定的性能代价，其大小取决于你可能只能有限控制的几个因素：\n\n- 负载均衡策略\n- 传递给远程执行函数或从其接收的数据量\n\
  - 网络速度\n- 计算机资源的均匀性\n\n最重要的是，dask 决定了如何以及何时传输数据。代码开发者通常很乐意卸下这个负担，即使计算/传输步骤的交错方式并不理想，但后续的并行效率可能会令人失望。“你的情况可能有所不同”这句谚语在并行处理中始终成立。\n\
  \n这一切听起来很复杂（在底层确实如此！）。我们究竟如何建立并运行一个分布式内存并行程序？如何能让代码运行得更快？唯一的方法就是通过示例来理解。\n\n###\
  \ 14.13.3 示例 1：单台计算机上的质因数之和\n\n我们的第一个示例是一个计算给定范围内所有数的不同质因数之和的程序。计算质因数本身这个困难的部分，由\
  \ SymPy 的 `primefactors()` 函数完成，该函数类似于 MATLAB 的 `factor()`。^(⁸³) 串行版本如下所示：\n\nMATLAB：\n\
  \n```\n% code/dask/prime_seq.m\nA = 2;\nB = 10000000;\nincr = 1;\n[S, dT] = my_fn(A,\
  \ B, incr);\nfprintf('A=%d B=%d, %.3f sec\\n',...\n         A, B, dT);\nfprintf('S=%ld\\\
  n', S);\nfunction [S, dT]=my_fn(A, B, incr)\ntic;\nS = 0;\n  for i = A:incr:B-1\n\
  \   S = S + sum(unique(factor(i)));\nend\ndT = toc;\nend\n```\n\nPython：\n\n```\n\
  #!/usr/bin/env python3\n"
- "# code/dask/prime_seq.py\nfrom sympy import primefactors\nimport time\ndef my_fn(a,\
  \ b, incr):\n    Ts = time.time()\n    s = 0\n    for x in range(a,b,incr):\n  \
