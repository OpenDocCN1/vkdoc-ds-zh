- '# 1.7 配方失效！MATLAB 崩溃了！（以及应对方法）


  MATLAB 和 Python（特别是 Anaconda 发行版）会在你的计算机上占据很大空间。除了其他文件外，每个软件都附带超过一千个共享库。其中一些库是两者共有的（例如
  ARPACK、BLAS、HDF5、英特尔数学核心函数库、JPEG、LAPACK、Qt、Xerces-C），但这些共有库往往版本不同且不兼容。


  这是一个问题。如果你在 MATLAB 中通过其 `py` 模块调用一个 Python 函数，而该函数加载了一个 Python 和 MATLAB 共有的共享库，那么加载的是
  MATLAB 的版本还是 Python 的版本？答案取决于包括环境变量在内的几个因素。如果你的环境设置不当，函数调用可能会调用不兼容的库例程，导致函数调用失败，或者
  MATLAB 崩溃。


  我能够设计出的对 MATLAB 最友好的环境是第 2.​5.​1 节中描述的 `matpy` 虚拟环境。`matpy` 无法阻止所有 MATLAB 崩溃。一个例子是将
