  \ MATLAB。\n\n## 14.5 分析 Python 代码\n\n任何性能提升尝试的第一步都是测量代码的缓慢之处。有时，这些位置很明显，可以在关键位置包裹简单的计时代码（如前面\
  \ FE 求解器所做的那样），以评估后续代码优化的有效性。然而，对于细粒度的结果，我们需要额外的分析工具。\n\n标准 Python 库包含两个模块，`cProfile`\
  \ 和 `profile`，它们以确定性的方式（相对于统计性的，后者不太精确）测量对各个 Python 函数的调用次数和花费的时间。结果以表格文本形式呈现。标准分析工具有三个缺点：\n\
  \n1.  结果粗糙；分辨率在函数级别。这掩盖了单个性能瓶颈行。\n\n2.  对于大型程序，文本表格可能难以解读。\n\n3.  仅分析 CPU 使用情况；没有分析内存使用情况的选项。\n\
  \nPython IDE（如 Spyder 和 PyCharm）与 MATLAB 的 IDE 一样，具有集成的分析功能，但 Python 版本基于 `cProfile`，因此仅提供函数级别的分辨率。MATLAB\
  \ 的 IDE 可以显示单行代码的分析结果。逐行结果对于性能调优至关重要，因此我们转向不随 Anaconda 附带且必须单独安装的工具。\n\n### 14.5.1\
  \ Scalene\n\nScalene [1] 是一个低开销的采样分析器，它还能额外报告 GPU 使用情况（如果检测到 GPU）、内存复制指标和内存消耗——所有这些都在逐行级别上进行。Scalene\
  \ 在 Python 代码分析工具中因其几个原因而独树一帜。其主要杀手级特性是，它将每一行的 CPU 结果细分为纯 Python 时间、底层编译库（称为“本机”时间）所花费的时间以及系统时间（用于\
  \ I/O 和与代码无关的操作）。这种分离有助于回答关于如何处理慢速代码行的隐含问题。如果大部分时间花在纯 Python 上，则可能有办法重写代码以调用更快的库函数。另一方面，如果大部分时间被底层库或系统占用，则改进的机会可能较小。Scalene\
  \ 也适用于多线程和多进程。\n\n以下命令用于分析 Mandelbrot 程序：\n\n```\n> scalene ./MB.py\n```\n\n其输出如下：\n\
  \n```\nMemory usage: =======#####==== (max: 117.00MB)\n./MB.py: % of time =  99.58%\
  \ out of  27.70s.\nLine |Time % |Time %  |Sys |Mem %  |Net   |Memory usage  |Copy\
  \   |\n|Python |native  |%   |Python |(MB)  |over time / % |(MB/s) |./MB.py\n-------+-------+--------+----+-------+------+--------------+-------+----------------------\n\
  1 |       |        |    |       |      |              |       |#!/usr/bin/env python3\n\
  2 |       |        |    |       |      |              |       |# code/hpc/MB.py\n\
  3 |       |        |    |       |      |              |       |import numpy as np\n\
  4 |       |        |    |       |      |              |       |import time\n5 |\
  \       |        |    |  100% |    3 |---           |       |def nIter(c, imax):\n\
  6 |    1% |        |    |  100% |   47 |-----         |       |  z = complex(0,\
  \ 0)\n7 |    6% |        |    |   99% |   46 |----          |       |  for i in\
  \ range(imax):\n8 |   43% |     1% |    |  100% | 3609 |===== 95%     |       |\
  \    z = z*z + c\n9 |   44% |     1% |    |  100% |-3608 |--------      |      \
  \ |    if abs(z) > 2:\n10 |       |        |    |       |  -57 |              |\
  \       |      break\n11 |       |        |    |       |      |              | \
  \      |  return i\n[... lines truncated...]\n```\n\n显示第 8 行和第 9 行是热点，消耗了近 90% 的求解时间。另一方面，内存结果则反直觉，因为峰值使用发生在仅对复数标量进行乘法和加法运算的行上。\n\
  \n默认情况下，`scalene` 会打印每个源文件中的每一行，无论其贡献是否显著。这对于大型程序来说显然过于冗长；在这种情况下，可以使用 `--reduced-profile`\
  \ 来修剪输出。结果也可以输出到 HTML 文件以简化浏览：\n\n```\n> scalene --html --outfile profile.html --reduced-profile\
  \ make_mesh.py\n```\n\n`profile.html` 中显示了单行最昂贵的代码（占总体 CPU 时间的 12%，用于返回单元刚度矩阵）的部分，在浏览器中看起来像这样：\n\
  \n![](img/516169_1_En_14_Figb_HTML.jpg)\n\n有趣的是，`scalene` 的结果表明时间花费在了复制内存上，而不是执行计算上。\n\
  \n\n\n### 14.5.2 Austin 和 FlameGraph\n\n`Austin`^(⁷¹)是另一种采样分析器。与`scalene`一样，它开销极低，无需修改被分析的代码，并且可以将结果发送到`FlameGraph`^(⁷²)等其他指标工具进行图形化显示。（MATLAB\
  \ 的分析器也能将时序结果以火焰图形式显示，不过使用的是石板灰配色方案，而非红色/橙色/黄色。）\n\n`FlameGraph`垂直展示调用栈，主程序位于底部。每个条形的宽度表示在\
  \ MATLAB 的某个特定函数或使用`austin`分析的某行代码上所花费的时间；代码热点会显示为最宽的条形。条形的左右排列是任意的，并不表示时间顺序执行顺序。条形的颜色也是任意的。垂直排列具有意义：一个条形所代表的代码会调用其正上方条形中的代码。最底部的条形自然是最宽的，因为它代表程序的主函数入口点。可识别的函数名称通常出现在从底部数起的第三或第四个条形中。\n\
  \n与`scalene`类似，`austin`从命令行调用。主要参数包括微秒单位的采样间隔以及要运行的 Python 程序（及参数）。输出可以直接写入文件，或者通过管道传递给`FlameGraph`。`FlameGraph`本身是一个命令行程序，它接受诸如显示结果的最小分辨率以及时序结果所采用的单位等参数。以下命令对*N*\
  \ = 1000 的曼德博集合程序进行分析，每 50 *μ*s 采集一次样本：\n\n```\n> austin -a -i 50 ./MB.py | flamegraph.pl\
  \ --minwidth 10 --countname=us > flame.svg\n```\n\n`FlameGraph`的`--minwidth 10`开关排除了那些会使条形宽度小于\
  \ 10 像素的条目。没有这个参数，图表会充斥着贡献微小、难以解读的条目。提高或降低这个像素宽度值，可以得到你感兴趣的解析度等级。`FlameGraph`的输出是一个可以通过网页浏览器查看的\
  \ SVG 文件。图中\n\n![](img/516169_1_En_14_Figc_HTML.jpg)\n\n显示大部分计算时间花费在第 8 行和第 9 行的`nIter()`函数中。回顾第\
  \ 14.2.1 节，`nIter()`的实现为：\n\nPython:\n\n```\n5   def nIter(c, imax):\n6     z =\
  \ complex(0, 0)\n7     for i in range(imax):\n8       z = z*z + c\n9       if abs(z)\
  \ > 2:\n10         break\n11     return i\n```\n\n第 8 行和第 9 行的计算工作发生在语句`z = z*z\
  \ + c`和`if abs(z) > 2`中。对`beam.4`算例的有限元求解器运行相同的分析命令，则会产生更复杂的图表。\n\n![](img/516169_1_En_14_Figd_HTML.jpg)\n\
  \n与曼德博集合的结果不同，这里没有明显的性能瓶颈。`FlameGraph`显示大部分执行时间发生在`make_model.py`的第 369 行，该行创建了全局质量矩阵和刚度矩阵：\n\
  \n```\n368 T_s = default_timer()\n369 K,M = m.KM()\n370 T_e = default_timer()\n\
  371 print(f'[K], [M] creation {m.nDof} dof : {T_e-T_s:.6f} s')\n```\n\n在调用栈中深入一层，`.KM()`方法内的第\
  \ 166 行是一个耗时点：\n\n```\n163       # sparse K in COO (coordinate) form\n164      \
  \ I, J, kV = [], [], []\n165       for eid in self.elem:\n166           self.add_element(eid,\
  \ kV, I, J, M)\n```\n\n## 14.6 使用`multiprocessing`进行多核计算\n\nPython 有一个`threading`模块，这让人相信它可以将工作分叉到多个线程。它可以做到，但这仅对于等待进行的\
  \ I/O 事件有效。通过这种方式提交的通用计算会被阻塞，以至于一次只运行一个线程，这使得它对非 I/O 任务毫无意义。要在计算机的多个核上同时运行任意代码，你需要使用\
  \ Python 的另一个标准模块`multiprocessing`。\n\n使用`multiprocessing`的最常见方式是建立一个工作进程池（通常是你想要运行的核数），然后将需要并行运行的函数提交到该进程池。以下代码展示了使用`multiprocessing`在三个核上运行曼德博集合计算的一种方法。工作通过以步长方式遍历`Im`数组的行来在各个核之间细分，步长等于我们将使用的核数。在我们的例子中，我们将设置`n_workers\
  \ = 3`，这样进程 0 获取第 0、3、6…行；进程 1 获取第 1、4、7…行；以此类推；这是通过`Im_subset = Im[i::n_workers]`这一行完成的。高亮显示的代码显示了为使用`multiprocessing`模块而应用的代码修改：\n\
  \nPython:\n\n```\n1   #!/usr/bin/env python3\n2   # code/hpc/MB_multi.py\n3   import\
  \ numpy as np\n4   import time\n5   from multiprocessing import Pool\n6   def nIter(c,\
  \ imax):\n7     z = complex(0, 0)\n8     for i in range(imax):\n9       z = z*z\
  \ + c\n10       if abs(z) > 2:\n11         break\n12     return np.uint8(i)\n\n\
  14   def MB(Re, Im, imax):\n15     nR = len(Im)\n16     nC = len(Re)\n17     img\
  \ = np.zeros((nR, nC), dtype=np.uint8)\n18     for i,I in enumerate(Im):\n19   \
  \    for j,R in enumerate(Re):\n20         c = complex(R, I)\n21         img[i,\
  \ j] = nIter(c, imax)\n22     return img\n\n24   def main():\n25     imax = 255\n\
  26     for N in [500, 1000, 2000, 5000 ]:\n27       T_s = time.time()\n28      \
  \ nR, nC = N, N\n29       Re = np.linspace(-0.7440, -0.7433, nC)\n30       Im =\
  \ np.linspace( 0.1315,  0.1322, nR)\n31       n_workers = 3\n32       img = np.zeros((nR,\
  \ nC), dtype=np.uint8)\n33       with Pool(n_workers) as pool:\n34           results\
  \ = []\n35           for i in range(n_workers):\n36               Im_subset = Im[i::n_workers]\n\
  37               results.append( pool.apply_async(\n38                       MB,\
  \ (Re, Im_subset, imax,)) )\n39           for i,R in enumerate(results):\n40   \
  \            img[i::n_workers, :] = R.get()\n41       print(N, time.time() - T_s)\n\
  42   if __name__ == '__main__': main()\n```\n\n第 35–38 行的循环很快就完成了，因为这些函数是异步提交给工作进程池的。只有在第\
  \ 40 行为每个提交的函数调用`.get()`方法时，多核上的计算才会开始。\n\n尽管`multiprocessing`忠实地让三个核保持忙碌，每个核处理总任务的三分之一，但表\
  \ 14-3 显示对于这个问题，其性能并不令人振奋。\n\n**表 14-3** *标量与向量化曼德博集合实现方式的执行时间（秒）*\n\n| N | MATLAB\
  \ 单核 | Python 单核 | Python `multiprocessing` + 3 核 |\n|---|---|---|---|\n| 500 |\
  \ 1.6 | 4.2 | 3.0 |\n| 1000 | 5.8 | 17.1 | 11.4 |\n| 2000 | 23.2 | 67.4 | 41.6 |\n\
  | 5000 | 145.1 | 420.0 | 250.0 |\n\n前方有更好的选择，因此为了节省篇幅，我将从未来的基准测试结果中省略`multiprocessing`的结果。\n\
  \n\n\n## 14.7 向量化\n\n对于 MATLAB 和 NumPy 而言，一种广为人知的优化技术是编写向量化代码——即对整个矩阵而非其索引项执行操作的代码。当矩阵中的所有项都需要执行相同的操作集时，与使用显式循环的标量代码相比，向量化通常能带来\
  \ 10 倍到 60 倍的性能提升。\n\n曼德勃罗集的一个有趣特征是，其计算量在解域内变化很大。向量化是否能提升性能尚不明确，因为收敛最慢的项决定了整个区域的计算速度。唯一确定的方法是实现向量形式的解法，然后比较性能。\n\
  \n以下向量解法大量使用了布尔索引掩码（第 11.​1.​14 节）。`Idx` 标识仍在积极更新的项，`New` 是在当前迭代中已收敛的项的集合。每次迭代结束时都会更新\
  \ `Idx`，以便将新收敛的项从后续细化中移除。只有当没有新项需要更新时，解法才算完成。\n\nMATLAB：\nPython：\n\n```\n% file:\
  \ code/hpc/MB_vectorized.m\nmain()\nfunction [img]=nIter(c, imax)\n[nR,nC]= size(c);\n\
  z = complex(zeros(nR,nC), ...\n             zeros(nR,nC));\nimg = zeros(nR,nC,'uint8');\n\
  Idx = ones(nR,nC,'logical');\nfor i = 0:imax-1\n    z(Idx) = z(Idx).*z(Idx)+ ...\n\
  \           + c(Idx);\n    New = (real(z).²+ ...\n           imag(z).² <= 4);\n\
  \    if ~any(New,'all')\n        break\n    end\n    img(New) = i;\n    Idx = Idx\
  \ & New;\nend\nend\nfunction [] = main()\nimax = 255;\nfor N = [500 1000 2000 5000]\n\
  \    tic\n    nR = N; nC = N;\n    Re = linspace(-0.7440,...\n                 \
  \ -0.7433, nC);\n    Im = linspace( 0.1315,...\n                   0.1322, nR);\n\
  \    [zR, zI] = meshgrid(Re,Im);\n    z_init = complex(zR,zI);\n    img = nIter(z_init,\
  \ imax);\n    fprintf('%5d %.3f\\n',N,toc);\nend\nend\n```\n\n```\n#!/usr/bin/env\
  \ python3\n"
- "# file: code/hpc/MB_vectorized.py\nimport numpy as np\nimport time\ndef nIter(c,\
  \ imax):\nnR,nC = c.shape\nz = np.zeros_like(c)\nimg = np.zeros(z.shape,\n     \
  \          dtype=np.uint8)\nIdx = np.ones(z.shape,\n              dtype=np.bool\
  \ )\n  for i in\nrange(imax):\nz[Idx] = z[Idx]*z[Idx] + \\\n         c[Idx]\nNew\
  \ = (z.real**2 +\n       z.imag**2 <= 4) \\\n      .reshape(nR,nC)\n    if not np.any(New):\n\
  \      break\nimg[New] = i\nIdx *= New\n  return img\ndef main():\nimax = 255\n\
  \  for N in\n[500,1000,2000,5000]:\nT_s = time.time()\nnR, nC = N, N\nRe = np.linspace(-0.7440,\n\
  \                 -0.7433, nC)\nIm = np.linspace( 0.1315,\n                   0.1322,\
  \ nR)\nzR,zI = np.meshgrid(Re,Im)\nz_init = zR + zI*(1j)\nimg = nIter(z_init, imax)\n\
  print(N, time.time() - T_s)\nif __name__ == '__main__': main()\n```\n\n性能结果（表 14-4）很有意思；向量化对\
  \ MATLAB 没有影响，但在 Python 中带来了 3 倍的加速。令人失望的是，Linux 上的 MATLAB 2020b 在计算 *N* = 5000\
  \ 的解时崩溃了。\n\n**表 14-4：** 标量与向量曼德勃罗实现执行时间（秒）\n\n| N | MATLAB 标量 | MATLAB 向量 | Python\
  \ 标量 | Python 向量 |\n|---|---|---|---|---|\n| 500 | 1.6 | 1.7 | 4.2 | 1.3 |\n| 1000\
  \ | 5.8 | 5.7 | 17.1 | 4.7 |\n| 2000 | 23.2 | 24.6 | 67.4 | 19.3 |\n| 5000 | 145.1\
  \ | *崩溃* | 420.0 | 184.4 |\n\n## 14.8 Cython\n\nCython⁷³ 是一个 Python 到 C 的编译器。虽然它没有实现完整的\
  \ Python 语言，但未实现的功能会按常规方式解释执行，只是不进行编译。\n\nCython 拥有两种强大的能力，可以使 Python 代码运行得更快。它能够：\n\
  \n*   将部分 Python 代码转换为 C，然后将 C 编译成优化的共享对象，该对象可作为 Python 模块加载。\n\n\n\n*   提供一个接口层，使得调用原生\
  \ C 和 C++ 库变得简单直接。\n\n### 14.8.1 使用 Cython 编译的 Python\n\n使用 Cython 生成编译后的 Python\
  \ 模块需要四个步骤：\n\n1.  将你希望编译的现有 Python 源文件中的函数复制到以 `.pyx`（而非 `.py`）结尾的新文件中。包含 `main()`\
  \ 的文件不会被编译，且必须保留在 `.py` 文件中。\n2.  在 `.pyx` 文件中，对希望提升速度的 Python 变量添加 C 语言类型注解。如果你的代码使用了\
  \ NumPy，还需添加一行与 NumPy `import` 对应的 `cimport` 语句。\n3.  创建一个设置文件（一个小的 Python 程序），告诉\
  \ Cython 需要编译哪些 `.pyx` 文件，并可选择指定要使用的编译器以及编译和链接标志。\n4.  运行设置文件来编译你的代码。\n\n以曼德勃罗集程序为例，前两个步骤通过左侧原始代码（不包括\
  \ `main()`）与右侧灰色显示的 Cython 增强代码的并排对比来展示。\n\n| Python，基线版本： | Python，含 Cython 注解：\
  \ |\n| --- | --- |\n| `1` `#!/usr/bin/env python3`<br>`2` `# cython/mb/MB_orig.py`<br>`3`<br>`4`\
  \ `import numpy as np`<br>`5` `import time`<br>`6` `def nIter(c, imax):`<br>`7`<br>`8`<br>`9`<br>`10`\
  \ `z = complex(0, 0)`<br>`11` `for i in range(imax):`<br>`12` `z = z*z + c`<br>`13`\
  \ `if abs(z) > 2:`<br>`14` `break`<br>`15` `return i`<br>`16`<br>`17` `def MB(Re,\
  \ Im, imax):`<br>`18`<br>`19`<br>`20`<br>`21` `nR = len(Im)`<br>`22` `nC = len(Re)`<br>`23`\
  \ `img = np.zeros((nR, nC))`<br>`24` `for i,I in enumerate(Im):`<br>`25` `for j,R\
  \ in enumerate(Re):`<br>`26` `c = complex(R, I)`<br>`27` `img[i, j] = nIter(c, imax)`<br>`28`\
  \ `return img` | `1` `#  cython/mb/MB_cython.pyx`<br>`2` `cimport numpy as np`<br>`3`\
  \ `import numpy as np`<br>`4` `import time`<br>`5` `def nIter(double complex c,`<br>`6`\
  \ `long imax):`<br>`7` `cdef int i`<br>`8` `cdef double complex z`<br>`9` `z = complex(0,\
  \ 0)`<br>`10` `for i in range(imax):`<br>`11` `z = z*z + c`<br>`12` `if z.real*z.real\
