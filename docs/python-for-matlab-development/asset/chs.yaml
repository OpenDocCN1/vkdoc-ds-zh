  41           client = MongoClient(''localhost:27017'')

  42       else:

  43           uri = "mongodb://%s:%s@%s/purchase_orders" % (

  44                   quote_plus(''al''),

  45                   quote_plus(''SuperSecret''),

  46                   quote_plus(''413.198.231.158:27027''))

  47           client = MongoClient(uri)

  48       db = client.purchase_orders

  49       all_PO = []

