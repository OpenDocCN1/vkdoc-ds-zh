  \ AND 和 OR 运算。\n\n### 11.1.17 面向对象编程与计算性能\n\n前一章的第 10.2 节提到面向对象编程可能对计算性能产生负面影响。为了演示这一点，我们将创建模拟球在矩形封闭区域内弹跳的仿真程序。一个仿真将使用常规的基于过程的编程方法，所有数据存储在数组中，而另一个则使用面向对象技术。该仿真有两个计算密集型部分：确定球之间的碰撞，以及更新发生碰撞的球对的速度向量。这里，我们将只实现仿真的碰撞检测部分。\n\
  \n如果我们将球的坐标和半径存储在常规数组中，就能充分利用向量化特性，在 MATLAB 和 Python 中轻松以 60 Hz 的频率计算一千个球之间的碰撞。两种语言都充分利用广播机制来计算碰撞矩阵，该矩阵是一个\
  \ *N* x *N* 的对称布尔矩阵，在包含 *N* 个球的仿真中，如果球 *i* 和球 *j* 接触，则在索引 (*i*, *j*) 和 (*j*, *i*)\
  \ 处为 1（MATLAB）或 `True`（Python）。\n\nMATLAB:\n```\n% 文件: code/OO/collision_matrix.m\n\
  function coll = collision_matrix(x,y,R)\ndx = x - x';\ndy = y - y';\nsep = sqrt(\
  \ dx.² + dy.² );\nsum_r = R + R';\ncoll = sep < sum_r;\nend\n% 文件: code/OO/run_sim.m\n\
  function res = run_sim(N, n_iter)\nfprintf('n balls=%d\\n', N)\nfor i = 1:n_iter\n\
  box_x = 10.;\nbox_y = 6.;\nr_min = 0.1;\nr_max = 0.3;\nx = r_max + (box_x-2*r_max)*rand(N,1);\n\
  y = r_max + (box_y-2*r_max)*rand(N,1);\nR = 0.1 + 0.8*rand(N,1);\ntic\ncoll = collision_matrix(x,\
  \ y, R);\nn_coll = (sum(sum(coll)) - N)/2;\nfprintf('n coll=%d Hz = %.2f\\n', n_coll,\
  \ 1/toc)\nend\nend\n```\n\nPython:\n```\n#!/usr/bin/env python3\n"
- '# 文件: code/OO/collision_matrix.py

  import numpy as np

  from numpy.random import rand

  import time

  def collision_matrix(x, y, R):

  """

  使用广播机制返回一个方形布尔矩阵，

  如果圆 i 和圆 j 相交，则在位置 [i,j] 和 [j,i] 处为 True。

  """

  dx = x[:,np.newaxis] - x[np.newaxis,:]

  dy = y[:,np.newaxis] - y[np.newaxis,:]

  sep = np.sqrt( dx**2 + dy**2 )

  sum_r = R[:,np.newaxis] + R[np.newaxis,:]

  return sep < sum_r

  def run_sim(N, n_iter):

  box_x, box_y = 10., 6.

  r_min, r_max = 0.1, 0.3

  print(f''n balls={N}'')

  for i in range(n_iter):

  x = r_max + (box_x-2*r_max)*rand(N)

  y = r_max + (box_y-2*r_max)*rand(N)

  R = 0.1 + 0.8*rand(N)

  T_s = time.time()

  coll = collision_matrix(x, y, R)

  n_coll = (np.sum(coll) - N)//2

  print(f''n coll={n_coll} Hz = ''

  f''{1/(time.time()-T_s):.2f}'')

  ```


