  \n图 12-19 MATLAB\n\n## 12.3 动画\n\nMatplotlib 可以像 MATLAB 一样制作动画。然而，除非动画很简单，否则避免使用全局变量可能是一个挑战。我们将从一个简单的程序开始，该程序绘制一个宽度随每一帧变化的椭圆。所有操作都封装在一个函数中，不需要全局变量。\n\
  \n动画的关键要素是 `A_values`（第 23 行 `FuncAnimation()` 的第三个参数）和第 18 行的 `update()` 函数。`A_values`\
  \ 是一个系数向量，用于缩放椭圆的宽度；其值从 0.9 下降到 0.1，然后又回到 0.9。每次调用 `update()` 时，会取出 `A_values` 中的下一个系数，并重新绘制椭圆的图像。\n\
  \nPython：\n\n```\n1   # file: code/plots/circle_ellipse.py\n2   import numpy as\
  \ np\n3   import matplotlib.pyplot as plt\n4   from matplotlib.animation import\
  \ FuncAnimation\n5   def circle_to_ellipse():\n6       fig, ax = plt.subplots()\n\
  7       T = np.linspace(0, 2*np.pi, 200)\n8       x = np.cos(T)\n9       y = np.sin(T)\n\
  10       curve, = plt.plot(x,y,'b')\n11       A_values = np.hstack([np.linspace(0.1,\
  \ 0.9, 100),\n12                             np.linspace(0.9, 0.1, 100)])\n13  \
  \     def init():\n14           ax.set_xlim(-1, 1)\n15           ax.set_ylim(-1,\
  \ 1)\n16           ax.set_aspect('equal')\n17           return curve,\n18      \
  \ def update(A):\n19           x = A*np.cos(T)\n20           y = np.sin(T)\n21 \
  \          curve, = plt.plot(x,y,'b')\n22           return curve,\n23       ani\
  \ = FuncAnimation(fig, update, A_values,\n24                           interval=20,\
  \ # 毫秒\n25                           init_func=init, blit=True)\n26       plt.show()\n\
  \n28   circle_to_ellipse()\n```\n\n![](img/516169_1_En_12_Figa_HTML.jpg)\n\n第二个动画示例展示了一个在抛物面碗中弹跳的球。它要复杂得多，并且使用全局变量来存储球的运动轨迹。\n\
