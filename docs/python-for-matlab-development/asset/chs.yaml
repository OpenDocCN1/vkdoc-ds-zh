  \ = np.linspace(-0.7440,`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`-0.7433,\
  \ nC)`<br>&nbsp;&nbsp;&nbsp;&nbsp;`Im = np.linspace( 0.1315,`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`0.1322,\
  \ nR)`<br>&nbsp;&nbsp;&nbsp;&nbsp;`img = MB(Re, Im, imax)`<br>&nbsp;&nbsp;&nbsp;&nbsp;`print(N,\
  \ time.time() - T_s)`<br>**if** `__name__ == '__main__': main()` |\n\n### 14.2.2\
  \ 二维有限元求解器\n\nPython 有许多优秀的有限元（FE）软件包。工业级应用包括 `deal.II`^(⁶⁵)、`FEniCS`^(⁶⁶)、`SfePy`^(⁶⁷)\
  \ 和 `Code-Aster`^(⁶⁸)。这些都是由众多领域专家开发的大型项目，拥有数十万行源代码。\n\n毋庸置疑，我们的第二个代表性程序只是这些高级程序的一个缩影。尽管我们的有限元求解器只实现了二维杆单元（基本上是线性弹簧），但它所执行的操作代表了许多有限元代码。我们的程序\n\
  \n1.  读取由 `triangle` [4] 程序创建的三角形单元和二维节点坐标的文本文件\n\n2.  根据三角形边创建杆单元\n\n3.  计算每个杆单元的刚度矩阵和质量矩阵，然后将它们插入到稀疏的全局刚度矩阵和质量矩阵\
  \ ***K*** 和 ***M*** 中\n\n4.  通过求解广义特征值问题 ***K***[*x*] = *λ***M***[*x*] 来计算无约束模型的振动模态\n\
  \n步骤 3 中生成的 ***K*** 异常稀疏；一个典型的由 `triangle` 输出导出的杆单元网格，每行或每列平均只有 14 个非零项。***M***\
  \ 是一个对角矩阵。因此，拥有 8 GB 内存的计算机可以很容易地处理具有一百万个自由度的模型。Python 和 MATLAB 有限元源文件的名称见附录 C；源文件本身可在本书的\
  \ Github 仓库中找到。^(⁶⁹)\n\n有限元求解器接受由 `triangle` 创建的任何二维网格。`triangle` 程序本身读取一个文本文件，该文件定义了待划分网格形状的外部（以及内部，如果有孔洞的话）边界。该输入文件，保存为\n\
  \n```\nbeam.poly\n"
- '# file:  beam.poly

  '
- '# 一个尺寸为 10 x 1 的矩形。

  4 2 0 0    # 四个顶点，二维

  '
- '# 节点 ID   X    Y

  1      0    0

  2     10    0

  3     10    1

  4      0    1

  4 0 # 四条边界线段，无标记

  '
- '# 边界 ID   节点 A   节点 B

  1             1        2

  2             2        3

  3             3        4

  4             4        1

  '
- "# 无孔洞\n```\n\n定义了一个 10 x 1 的矩形。以下是调用 `triangle` 可执行文件与 `beam.poly` 的命令行，用于创建五对\
  \ `beam.*.ele` 和 `beam.*.node` 文件，分辨率依次提高：\n\n```\n> triangle -pq34a.2 beam    \
  \    # -> beam.1.ele, beam.1.node\n> triangle -rpq34a.02 beam.1    # -> beam.2.ele,\
  \ beam.2.node\n> triangle -rpq34a.002 beam.2   # -> beam.3.ele, beam.3.node\n> triangle\
  \ -rpq34a.0002 beam.3  # -> beam.4.ele, beam.4.node\n> triangle -rpq34a.00002 beam.4\
  \ # -> beam.5.ele, beam.5.node\n```\n\n例如，来自 `beam.2.ele` 和 `beam.2.node` 的网格如下图所示：\n\
  \n![](img/516169_1_En_14_Figa_HTML.png)\n\n最后一对文件 `beam.5.ele` 和 `beam.5.node` 分别为\
  \ 32 MB 和 28 MB，定义了一个具有超过一百万个自由度的网格。\n\n## 14.3 参考硬件与操作系统\n\n本章余下部分用于基准测试的硬件、操作系统以及\
  \ MATLAB 和 Python 版本如下：\n\n*   2015 款 Dell XPS13 笔记本电脑\n*   4 核 i5-5200U CPU @ 2.2\
  \ GHz\n*   8 GB 内存\n*   Ubuntu 20.04\n*   MATLAB 2020b\n*   Anaconda Python 2020.07\n\
  \n虽然 Python 代码可以轻松运行在更快的云托管硬件上，但 MATLAB 代码由于许可证限制，只能绑定到这台机器上。\n\n## 14.4 基准性能\n\n\
