  \ 个 2.5 GHz 的 CPU 核心和 25 GB 存储空间。这些 VM 运行 Ubuntu 20.04.3 LTS，安装了 Anaconda 2021.05，并使用\
  \ `matpy` conda 环境（第 2.5.1 节）。\n\n第一步是登录到 18 台 VM 中的一台，并发出 `dask-ssh` 命令来启动调度器和工作器：\n\
  \n```\ndask-ssh --hostfile DigitalOcean_VMs.txt\n```\n\n其中 `DigitalOcean_VMs.txt`\
  \ 包含了所有 18 台计算机的 IP 地址。对 `prime_dask.py`（代码列表见第 14.13.3 节）需要做的唯一更改是将对 `Client(127.0.0.1:8786)`\
  \ 的调用替换为运行调度器的 VM 的 IP 地址，即 `DigitalOcean_VMs.txt` 中的第一个条目。第 17 行显示了可能的样子。\n\n最后，我们可以从任何能够连接到调度器的计算机上运行\
