  ax.set_aspect(''equal'')

  point, = ax.plot([], [], ''o'', markersize=25)

  trace, = ax.plot([], [], '',-'', lw=1)

  return fig

  def animate(i):

  global history_x, history_y

  if i == 0:

  history_x.clear()

  history_y.clear()

  history_x.append(pos[i,0])

  history_y.append(pos[i,1])

