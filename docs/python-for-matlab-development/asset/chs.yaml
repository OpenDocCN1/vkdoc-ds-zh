  \ double complex c`<br>`20` `nR = len(Im)`<br>`21` `nC = len(Re)`<br>`22` `img =\
  \ np.zeros((nR, nC), dtype=np.uint8)`<br>`23` `for i,I in enumerate(Im):`<br>`24`\
  \ `for j,R in enumerate(Re):`<br>`25` `c = complex(R, I)`<br>`26` `img[i, j] = nIter(c,\
  \ imax)`<br>`27` `return img` |\n\n适用于第三步的设置文件如下所示：\n\n```python\n"
- "# file: cython/mb/cython_setup.py\nimport os\nfrom setuptools import setup\nfrom\
  \ Cython.Build import cythonize\nimport numpy\nos.environ['CFLAGS'] = '-Ofast'\n\
  setup(\n    ext_modules=cythonize(\"MB_cython.pyx\"),\n    include_dirs=[numpy.get_include()]\n\
  )\n```\n\n最后，运行此设置文件来编译代码：\n\n```\n> python cython_setup.py build_ext --inplace\n\
  ```\n\n一次典型的调用会产生警告、新的 C 源文件，并希望最终生成一个以 `.pyx` 文件命名的共享对象。在我的 Linux 机器上，共享对象是 `MB_cython.cpython-38-x86_64-linux-gnu.so`。尽管名称很长，但在\
  \ Python 中通过 `import MB_cython` 即可导入。我们这番努力获得了什么？一个小型驱动程序加载编译后的模块并运行案例：\n\n```python\n\
  #!/usr/bin/env python3\n"
- '# cython/mb/main2.py

  from MB_cython import MB

  import numpy as np

  import time

  max_iter = 255

  nR, nC = 1000, 1000

  Re = np.linspace(-0.7440, -0.7433, nC)

  Im = np.linspace( 0.1315,  0.1322, nR)

  T_s = time.time()

  image = MB(Re, Im, max_iter)

  print(f''Cython time = {time.time() - T_s:.3f} sec'')

  ```


  对于 *N* = 1000 的情况，运行时间从 17.1 秒骤降至仅 1.85 秒。原始 Python 代码比 MATLAB 慢 3 倍，但经过 Cython
  增强，Python 的速度反而快了 3 倍。




  我们还能做得更好。回顾第[14.5.1]节和第[14.5.2]节的性能分析工作，结果显示`if abs(z) > 2:`是热点。复数的`abs()`函数会计算其模长，即实部和虚部平方和的平方根。由于这一行消耗了大量时间，我们应通过仅测试平方和来绕过平方根运算。这可以通过将左侧原代码的第
  13 行修改为右侧优化后的代码来实现：


  ```

  13   if abs(z) > 2:

  ```


  ```

  13   if z.real**2 + z.imag**2 > 4:

  ```


  这一行代码的优化将 *N* = 1000 时 Python+Cython 的时间从 1.85 秒减少到 1.01 秒，而 MATLAB 在等效修改后的时间从 5.8
  秒减少到 4.4 秒。


  ### 14.8.2 使用 Cython 实现并行 `for` 循环


  MATLAB 核心产品不包含 `parfor` 并行 `for` 循环命令——该功能仅在 MATLAB Coder 或并行计算工具箱中提供。因此，本书中的 MATLAB
  实现仅限于串行 `for` 循环。


  Cython 有一个 `prange()` 函数，允许编写并行 `for` 循环。在底层，这个 `prange()` 函数是通过 OpenMP 实现的，因此继承了
  OpenMP 的限制。Cython 文档展示了一些简单的并行 `for` 循环示例，但在实践中，非平凡的循环需要大量的代码调整才能克服诸如“Indexing Python
  object not allowed without gil”、“Constructing Python tuple not allowed without gil”和“Coercion
  from Python not allowed without the GIL”等编译错误。


  除非你的代码段包含基本的 `for` 循环，否则你将要么需要花费大量时间研读 Cython 文档，要么避免使用其 `prange()` 函数。第[14.9]节和第[14.10.1]节中描述的用于并行
  `for` 循环的 Pythran 和 Numba 选项要容易得多。


  ### 14.8.3 Cython 性能


  在 MATLAB 和 Python+Cython 实现中将 `abs(z)` 替换为 `z.real**2 + z.imag**2` 后，我们更新的性能如表[14-5]所示。


  **表 14-5** Mandelbrot 程序的执行时间（秒）


  | *N* | MATLAB | Python 基线 | Python+Cython |

  | --- | --- | --- | --- |

  | 500 | 1.3 | 4.2 | 0.25 |

  | 1000 | 4.4 | 17.1 | 1.01 |

  | 2000 | 17.7 | 67.4 | 4.03 |

  | 5000 | 112.5 | 420.0 | 25.18 |


  ## 14.9 Pythran


  Pythran [3] 与 Cython 类似，它从一个包含简单注释的 Python 函数文件创建一个编译后的二进制模块。与 Cython 相比，其主要优势在于所需的代码修改完全作为源代码注释实现。这意味着经过
  Pythran 增强的代码是纯 Python 代码；即使在没有 Pythran 编译器的系统上，该代码也能以相同的方式运行，只是速度会慢一些。另一个优势是使用
  OpenMP 进行 `for` 循环并行化很容易实现。


  与 Cython 相比，Pythran 也存在一些劣势：Pythran 支持的 Python 子集比 Cython 小。某些语句如 `with` 完全不支持，其他一些语句如
  f-string 支持有限。另一个缺点（截至 2021 年底）是该项目的文档网站缺乏足够的示例。为了全面了解 `#pythran` 指令可以采取的不同形式，最好的办法是下载项目的源代码，然后研究
  `pythran/tests/cases` 中的许多示例。


  ### 14.9.1 签名注释示例


  用于声明以下函数 `Fn()` 参数的 Pythran `#pythran export Fn` 指令能够理解下表中列出的数据类型。当左列包含“or”时，Pythran
  编译器将推断出所需的类型。类似地，“string or int”表示该函数将在给定位置接受字符串或整数参数。


  **表 14-6** Pythran 函数签名类型


  | 标量类型或数据容器 | Pythran 类型指定 |

  | --- | --- |

  | 字符串 | `str` |

  | 布尔 | `bool` |

  | 无符号 8 位整数 | `uint8` |

  | 无符号 16 位整数 | `uint16` |

  | 无符号 32 位整数 | `uint32` |

  | 无符号 64 位整数 | `uint64` |

  | 32 或 64 位整数 | `int` |

  | 字符串 *或* 整数 | `str or int` |

  | 8 位整数 | `int8` |

  | 16 位整数 | `int16` |

  | 32 位整数 | `int32` |

  | 64 位整数 | `int64` |

  | 32 或 64 位浮点 | `float` |

  | 32 位浮点 | `float32` |

  | 64 或 128 位复数 | `complex` |

  | 128 位复数 | `complex128` |

  | 整数列表 | `int list` |

  | 整数列表的列表 | `int list list` |

  | 浮点列表 | `float list` |

  | 1D 数组整数 | `int[]` 或 `int[:]` |

  | 1D 数组浮点 | `float[]` 或 `float[:]` |

  | 2D 数组整数 | `int[][]` 或 `int[:,:]` |

  | 2D 数组浮点 | `float[][]` 或 `float[:,:]` |

  | 字符串到整数的字典 | `str : int dict` |

  | 两个整数的元组 | `(int, int)` |


  因此，对于接受一个字符串、一个整数列表和一个 32 位浮点 2D 数组的函数 `Fn()`，其定义前的注释行应为：


  ```

  #pythran export Fn(str, int list, float32[])

  ```


  ### 14.9.2 使用 Pythran 编译的 Python；并行 `for` 循环


  与 Cython 一样，Mandelbrot 函数 `nIter()` 和 `MB()` 被分离到自己的文件中进行编译。只需要三个注释行就能让 Pythran
  编译我们的代码：


  ```

  '
- "# pythran/mb/MB_pythran.py\nimport numpy as np\n#pythran export nIter(complex,\
  \ int)\ndef nIter(c, imax):\n    z = complex(0, 0)\n    for i in range(imax):\n\
  \        z = z*z + c\n        if abs(z) > 2:\n            break\n    return np.uint8(i)\n\
  \n#pythran export MB(float [], float [], int)\ndef MB(Re, Im, imax):\n    nR = Im.shape[0]\n\
  \    nC = Re.shape[0]\n    img = np.zeros((nR, nC), dtype=np.uint8)\n    #omp parallel\
  \ for\n    for i, I in enumerate(Im):\n        for j, R in enumerate(Re):\n    \
  \        c = complex(R, I)\n            img[i, j] = nIter(c, imax)\n    return img\n\
  ```\n\n前两个注释定义了后面几行函数的签名（不包括返回类型，Pythran 会自动推断），第三个注释指定 `for i, I` 循环为并行循环。\n\n\
  使用以下命令编译函数：\n\n```\n> pythran -Ofast -fopenmp MB_pythran.py\n```\n\nPythran 需要 C\
  \ 头文件才能使用基本线性代数子程序（BLAS）。如果你的编译命令显示：\n\n```\nfatal error: cblas.h: No such file\
  \ or directory\n```\n\n并且没有创建共享对象文件，你需要下载并安装适合你操作系统的 BLAS 开发头文件。例如，在 Ubuntu 上，可以通过\
  \ `apt install libopenblas-dev` 解决。即使安装了头文件，你仍然可能看到“fatal error”，但共享对象文件已成功创建。\n\
  \n要禁止 `for` 循环的 OpenMP 并行化，可以从源代码中删除 `#omp parallel for` 注释，或者从编译命令中删除 `-fopenmp`\
  \ 开关。\n\n`pythran` 命令会产生一个以输入源文件命名的编译后共享对象文件（在我的电脑上是 `MB_pythran.cpython-38-x86_64-linux-gnu.so`）。用于运行\
  \ Pythran 编译模块的驱动程序与用于 Cython 编译模块的驱动程序相同。唯一的区别是加载的模块名称——`import MB_pythran` 而不是\
  \ `import MB_cython`：\n\n```\n#!/usr/bin/env python3\n"
- "# pythran/mb/MB_pythran_main.py\nimport numpy as np\nfrom MB_pythran import MB\n\
  import time\n\ndef main():\n    imax = 255\n    for N in [500, 1000, 2000, 5000]:\n\
  \        T_s = time.time()\n        nR, nC = N, N\n        Re = np.linspace(-0.7440,\
  \ -0.7433, nC)\n        Im = np.linspace( 0.1315,  0.1322, nR)\n        img = MB(Re,\
  \ Im, imax)\n        print(N, time.time() - T_s)\n\nif __name__ == '__main__': main()\n\
  ```\n\n### 14.9.3 Pythran 性能\n\n\n\n单核 Pythran 性能比单核 Cython 提升超过 2.5 倍，四核版本比单核快\
  \ 2.5 倍（表 14-7）。值得注意的是，相较于基线 Python 版本，性能提升了一个数量级，而实现这一提升仅需添加三行注释并在函数文件上调用 Pythran\
  \ 编译器。\n\n**表 14-7** Mandelbrot 程序执行时间（秒）\n\n| *N* | MATLAB 单核 | Python 基线 单核 |\
  \ Python + Cython 单核 | Python + Pythran 单核 | Python + Pythran 四核 |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| 500 | 1.3 | 4.2 | 0.25 | 0.10 | 0.05 |\n| 1000 |\
  \ 4.4 | 17.1 | 1.01 | 0.40 | 0.15 |\n| 2000 | 17.7 | 67.4 | 4.03 | 1.59 | 0.62 |\n\
  | 5000 | 112.5 | 420.0 | 25.18 | 9.93 | 3.88 |\n\n## 14.10 Numba\n\nNumba^((76))\
  \ 是一个专注于加速数值计算的 Python 即时（JIT）编译器。与 Cython 和 Pythran 类似，Numba 也允许编写并行 for 循环。同样，使用\
  \ Numba 所需的代码修改主要涉及类型定义。这些修改是纯 Python 的。此外，无需处理外部生成的源文件、语言或编译器。另一个好处是，需要加速的函数可以与未修改的函数（包括主程序）共存，无需将它们隔离到单独的文件中。基于这些原因，使用\
  \ Numba 增强的代码比使用 Cython 或 Pythran 增强的代码更方便使用和部署。\n\n通过以下步骤为 Python 添加 Numba 增强功能：\n\
  \n1.  导入 `numba` 模块，引入 `jit` 装饰器、要使用的数值数据类型，以及可选地引入用于编写并行 for 循环的 `prange` 函数。\n\
  2.  对每个需要提速的函数应用 `@jit()` 装饰器。该装饰器的参数是函数的签名，即其返回类型和每个输入参数的类型。该装饰器还接受其他关键字参数，例如 `nopython`\
  \ 和 `fastmath`。\n3.  可选地，使用 Numba 的并行 range 函数 `prange()` 重写 for 循环。\n\n使用 Numba\
  \ 增强的 Mandelbrot 程序如下所示：\n\n**Python:**\n\n```python\n#!/usr/bin/env python3\n"
- "# file: numba/mb/MB_numba.py\nimport numpy as np\nfrom numba import jit, prange,\
  \ uint8, int64, float64, complex128\nimport time\n\n@jit(uint8(complex128,int64),nopython=True,\
  \ fastmath=True)\ndef nIter(c, imax):\n    z = complex(0, 0)\n    for i in range(imax):\n\
  \        z = z*z + c\n        if z.real*z.real + z.imag*z.imag > 4:\n          \
  \  break\n    return i\n\n@jit(uint8:,:,\n     nopython=True, fastmath=True, parallel=True)\n\
  def MB(Re, Im, imax):\n    nR = len(Im)\n    nC = len(Re)\n    img = np.zeros((nR,\
  \ nC), dtype=np.uint8)\n    for i in prange(len(Im)):\n        I = Im[i]\n     \
  \   for j,R in enumerate(Re):\n            c = complex(R, I)\n            img[i,\
  \ j] = nIter(c, imax)\n    return img\n\ndef main():\n    imax = 255\n    for N\
  \ in [500, 1000, 2000, 5000]:\n        T_s = time.time()\n        nR, nC = N, N\n\
  \        Re = np.linspace(-0.7440, -0.7433, nC)\n        Im = np.linspace( 0.1315,\
  \ 0.1322, nR)\n        img = MB(Re, Im, imax)\n        T_e = time.time()\n     \
  \   print(f'{T_e - T_s:.3f}  {N:5d}')\nif __name__ == '__main__': main()\n```\n\n\
  `nIter()` 和 `MB()` 的 `@jit()` 装饰器可能看起来令人生畏，但其组成部分很直接。`nIter()` 返回一个标量 `uint8`。输入是一个双精度复数标量——`complex128`——和一个常规的\
  \ Python 整数标量 `int64`。因此，`nIter()` 的签名是 `uint8(complex128, int64)`。关键字参数 `nopython`\
  \ 和 `fastmath` 将在第 14.10.2 节中解释。`MB()` 函数返回一个 `uint8` 的二维数组，在 Numba 中表示为 `uint8[:,:]`。输入是一对一维双精度浮点数组和一个整数标量。因此，`MB()`\
  \ 的签名是 `uint8:,:`。`MB()` 的装饰器还有一个额外的关键字参数 `parallel=True`，表示使用了并行 range 函数 `prange()`。\n\
  \n### 14.10.1 使用 Numba 的并行 for 循环\n\nNumba 的 `prange()` 函数类似于 Cython 的。编写并行 for\
  \ 循环相当于将现有的 `for i in ...` 结构替换为 `for i in prange(N)`，其中 `N` 是一个整数标量。要求循环迭代一个整数范围可能意味着，如果现有循环迭代其他对象，则需要对该循环进行小幅修改。\n\
  \n在我们的例子中，我们必须将左侧的结构（它同时填充了索引 `i` 和第 `i` 个虚数标量值）替换为右侧的结构（它仅遍历索引）。标量值必须在后续行中提取：\n\
  \n| **Python，基线：** | **Python，Numba 并行 for：** |\n| --- | --- |\n| `for i,I in enumerate(Im):`\
  \ | `for i in prange(len(Im)):` `I = Im[i]` |\n\nNumba 负责将循环体中的工作分发到不同核心，以及聚合同时计算之间共享变量的结果。\n\
  \n### 14.10.2 Numba 关键字参数 `nopython`, `fastmath`\n\n`@jit()` 的关键字参数 `nopython`（通常设置为\
  \ `True`）指示 JIT 编译器完全跳过 Python 解释器，仅使用编译后的代码。这是推荐设置，甚至有其专用的装饰器：`@njit()` 等同于 `@jit(...,nopython=True)`。仅当编译失败时才应将该关键字设置为\
  \ `False`。\n\n关键字参数 `fastmath` 启用不安全的操作^((77))，例如假设输入永远不会是 NaN 或 Inf，并允许编译器重新排序浮点指令。当然，请比较\
  \ `fastmath=True` 开启与关闭时代码的输出，以确保结果不受影响。\n\n### 14.10.3 Numba 性能\n\n如表 14-8 所示，使用\
  \ Numba 增强的 Mandelbrot 程序性能令人惊叹。使用 Numba，纯 Python 代码的速度超过了 Cython 和 Pythran 编译的模块。\n\
  \n### 14.10.4 Numba 的限制\n\n虽然 Numba 的性能提升令人印象深刻，但它们也附带了一些限制。需要由 Numba 加速的函数应相对底层且计算密集。\n\
  \n**表 14-8** Mandelbrot 程序执行时间（秒）\n\n| *N* | MATLAB 单核 | Python 基线 单核 | Python +\
  \ Cython 单核 | Python + Pythran 单核 | Python + Pythran 四核 | Python + Numba 单核 | Python\
  \ + Numba 四核 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 500 | 1.3 |\
  \ 4.2 | 0.25 | 0.10 | 0.05 | 0.09 | 0.04 |\n| 1000 | 4.4 | 17.1 | 1.01 | 0.40 |\
  \ 0.15 | 0.36 | 0.15 |\n| 2000 | 17.7 | 67.4 | 4.03 | 1.59 | 0.62 | 1.44 | 0.62\
  \ |\n| 5000 | 112.5 | 420.0 | 25.18 | 9.93 | 3.88 | 8.95 | 3.71 |\n\n除非使用 Numba\
  \ 的包装器地址协议（Wrapper Address Protocol），^((78)) 否则通过 `@jit` 装饰的函数只能调用 NumPy 和标准库函数的一个子集。\n\
  \n\n\n# 排版后的内容\n\n在使用 `Numba` 进行优化尝试之前，先编写一个测试程序，其中包含执行所需加速计算所需的语言结构和函数调用。用 `@jit`\
  \ 修饰这些试验函数，然后运行程序以检查是否正常。如果看到类似如下的错误：\n\n```\nNameError: global name 'XYZ' is not\
  \ defined\n```\n\n并且在被 `@jit` 修饰的函数中存在对 `XYZ()` 的调用，这意味着 `Numba` 无法编译该函数。此时，你的选择包括：简化函数直至能被编译、回退到\
  \ `multiprocessing` 模块（第 14.6 节），或使用将在第 14.13 节介绍的 `dask`。\n\n## 14.11 f2py\n\n\
  `f2py` 是 `NumPy` 自带的一个命令行工具。它能让你比使用任何其他二进制接口工具都更轻松地，从经过特殊注释的 Fortran 代码创建已编译的 Python\
  \ 模块。`f2py` 带来两大重要优势：它能创建用于调用遗留 Fortran 代码的 Python 接口模块，并且能为用 Fortran 重写的 Python\
  \ 函数提供显著的计算加速。\n\n以下 Fortran 代码实现了 Mandelbrot 实现中较早出现的 `nIter()` 和 `MB()` 函数。定义输入和输出参数的五行\
  \ `cf2py` 代码，是 `f2py` 创建包含文档的 Python 接口所需的全部内容。\n\nFortran 代码：\n\n```\n1   c file:\
  \ code/f2py/mb.f\n2         integer function nIter(c, imax)\n3   cf2py intent(in)\
  \   :: c, imax\n4   cf2py intent(out)  :: nIter\n5         implicit none\n6    \
  \     complex*16 z, c\n7         integer i, imax\n8         nIter = imax\n9    \
  \     z = 0\n10         do i = 0,imax - 1\n11           z = z*z + c\n12        \
  \   if (zabs(z) .gt. 2.0) then\n13             nIter = i\n14             return\n\
  15           endif\n16         enddo\n17         nIter = imax\n18         end\n\n\
  20         subroutine MB(nR, nC, Re, Im, img, imax)\n21   cf2py intent(in)   ::\
  \ Re, Im, imax\n22   cf2py intent(out)  :: img\n23   cf2py intent(hide) :: nR, nC\n\
  24         implicit none\n25         integer nR, nC, nIter, imax, i, j, ij\n26 \
  \        integer(kind=2) img(nR*nC)\n27         real*8 Re(nR), Im(nC)\n28      \
  \   complex*16 c\n29         do i = 1,nR\n30           do j = 1,nC\n31         \
  \    c = cmplx(Re(i), Im(j))\n32             ij = (i-1)*nC+j\n33             img(ij)\
  \ = nIter(c,imax)\n34           enddo\n35         enddo\n36         end\n```\n\n\
  使用命令\n\n```\n> f2py -c --opt=\"-Ofast\" -m MB_fortran mb.f\n```\n\n会生成 Python/Fortran\
  \ 接口代码，使用系统的 Fortran 编译器编译该代码和前述 `mb.f`，然后将它们链接成一个编译好的 Python 模块 `MB_fortran`（在我的电脑上，该模块的全名是\
  \ `MB_fortran.cpython-38-x86_64-linux-gnu.so`）。\n\n除了编写接口代码，`f2py` 还会为每个函数生成文档：\n\
  \nPython 代码：\n\n```\nIn : import MB_fortran\nIn : MB_fortran.mb?\n调用签名: MB_fortran.mb(*args,\
  \ **kwargs)\n类型:           fortran\n字符串形式:    \n文档字符串:\nimg = mb(re,im,imax)\n针对\
  \ ``mb`` 的包装器。\n参数\n\nre : 输入 rank-1 array('d')，边界为 (nr)\nim : 输入 rank-1 array('d')，边界为\
  \ (nc)\nimax : 输入 int\n返回\n\nimg : rank-1 array('h')，边界为 (nr*nc)\n```\n\n这个驱动程序加载\
  \ Fortran 编译的模块，然后运行我们的基准测试案例：\n\nPython 代码：\n\n```\n#!/usr/bin/env python3\n"
- "# file: code/f2py/MB_main.py\nimport numpy as np\nimport time\nfrom MB_fortran\
  \ import mb\ndef main():\nimax = 255\nfor N in [500,1000,2000,5000]:\nT_s = time.time()\n\
  nR, nC = N, N\nRe = np.linspace(-0.7440, -0.7433, nC)\nIm = np.linspace( 0.1315,\
  \ 0.1322, nR)\nimg = np.zeros((nR*nC,), dtype=np.int16)\nimg = mb(Re, Im, imax).reshape(nR,nC)\n\
  print(N, time.time() - T_s)\nif __name__ == '__main__': main()\n```\n\n表 14-9 显示了\
  \ `f2py` 编译的模块与其他单 CPU 结果的对比情况。\n\n**表 14-9**  \nMandelbrot 程序的执行时间（秒）\n\n| N  \
  \  | MATLAB 1 核 | Python 基线 1 核 | Python+ Cython 1 核 | Python+ Pythran 1 核 | Python+\
  \ Numba 1 核 | Python+ f2py 1 核 |\n|------|-------------|------------------|---------------------|----------------------|--------------------|--------------------|\n\
  | 500  | 1.3         | 4.2              | 0.25                | 0.10           \
  \      | 0.09               | 0.10               |\n| 1000 | 4.4         | 17.1\
  \             | 1.01                | 0.40                 | 0.36              \
  \ | 0.40               |\n| 2000 | 17.7        | 67.4             | 4.03       \
  \         | 1.59                 | 1.44               | 1.60               |\n|\
  \ 5000 | 112.5       | 420.0            | 25.18               | 9.93           \
  \      | 8.95               | 10.05              |\n\n## 14.12 配方 14-1：在单台计算机上使用\
  \ Python 加速 MATLAB\n\n在 Mandelbrot 问题上，单 CPU 的 MATLAB 性能相比普通的单 CPU Python 实现表现不俗（表\
