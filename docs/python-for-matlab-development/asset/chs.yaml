  \ object is required, not 'str'\n```\n\n解决方法是将字节数组转换为字符串：\n\nPython：\n\n```\nIn\
  \ : import subprocess\nIn : x = subprocess.run('dir', capture_output=True)\nIn :\
  \ x.stdout.split('\\n')\nIn : str(x.stdout).split('\\n')\nOut: [\"b'data.h5\\\\\
  t\\\\t\\\\file_1.txt\\\\n'\"]\n```\n\n\n\n## 9.3 检查进程表与进程资源\n\n数值分析和模拟往往对资源消耗巨大。在启动长达数天的运行之前，密切关注\
  \ CPU、内存和文件系统使用情况，有助于了解程序的资源需求。部分工作可以通过代码性能分析完成（参见第 14.​5 节）。然而，性能分析无法回答诸如“我目前使用了多少内存/CPU/网络？”、“其他用户是否给我的机器造成了很大负载？”或“测试数据目录中还有多少磁盘空间？”等问题。\n\
  \n在查询计算机进程及其消耗的资源方面，`MATLAB` 有所欠缺。此类查询需要调用底层操作系统提供的外部工具——Windows 上的 Process Explorer、macOS\
  \ 上的 Activity Monitor，或 Linux/macOS 上的 `ps` 和 `top`。\n\n相比之下，`Python` 有一个模块 `psutil`^(³²)，它提供了一种与操作系统无关的方法，用于检查进程及其使用的资源，以及计算机的硬件，包括\
  \ CPU 负载、CPU 温度、内存、网络接口、存储、电池电量、风扇速度等。除了检查进程，`psutil` 还可以挂起、恢复和终止进程（前提是该进程属于发出这些命令的用户）。\n\
  \n有时，我会低估计算所需的内存量（例如，在第 14.​2.​2 节的有限元基准测试中，创建大型稀疏矩阵并计算其特征解时很容易发生），随着操作系统将所有时间花在将内存交换到磁盘上，我的计算机会陷入停滞。只能按电源键——这非常烦人。任何语言中任何耗内存的应用程序都可能出现此问题；`MATLAB`\
  \ 和 `Python` 在这方面并无特殊之处。\n\n`psutil` 使得编写一个任务守护程序变得简单，它可以杀死任何过度压榨计算机的进程。当我在进行一些挑战笔记本电脑硬件极限的计算时，我会在另一个终端中运行以下任务守护程序。如果某个运行因消耗过多内存和\
  \ CPU 周期而失控，守护程序会将其杀死，从而避免我进行既耗时又可能损坏文件系统的硬重启。^(³³) 关于其工作原理的几点说明：\n\n- 第 7 行：`max_L1`\
  \ 是一分钟平均负载，低于此值时程序不执行任何操作。负载为 1.0 意味着机器上的一个核心已满载。\n- 第 8 行：类似地，如果机器已用内存低于 `max_mem_fraction`，程序不执行任何操作。\n\
  - 第 17 行：程序运行在一个连续循环中，每次迭代后休眠 `refresh_sec` 秒。\n- 第 28 行：如果一分钟平均负载和内存比例超过限制，程序将遍历所有进程：\n\
  \  - 第 29 行：如果进程名称在 `ignore` 集合中，则继续检查下一个。\n- 第 31 行：如果进程不属于运行守护程序的用户，则跳过。`psutil`\
  \ 无法杀死其他用户拥有的进程。\n- 第 36 行：在 0.2 秒的时间间隔内测量进程的 CPU 负载。如果该值小于 `min_cpu_pct`，则循环继续处理下一个进程。\n\
  \n进程可能会在测量间隔结束前结束，因此此步骤可能失败；异常处理程序可防止程序因错误而终止。\n\n- 第 44 行：测量进程的内存。即使我们拥有该进程，此操作也可能失败，因此测量被包裹在另一个异常捕获器中。\n\
  - 第 50 行：最后，如果进程使用了机器上超过一半的内存，或者其内存正在被交换到磁盘，则杀死该进程。\n\n`Python`：\n\n```\n1   # 文件:\
  \ code/os/job_shepherd.py\n2   import os\n3   import psutil\n4   import time\n\n\
  6   refresh_sec = 1.0\n7   max_L1  = 1.5  # 一分钟平均负载\n8   max_mem_fraction = 0.5\n\
  9   min_cpu_pct = 50.0\n\n11   ignore = {\n12       'chrome', 'dbus-daemon', 'dconf-service',\
  \ 'firefox',\n13       'gnome-terminal-server', 'ssh-agent', 'systemd', 'vim', 'Xorg',\
  \ 'top'}\n\n15   uid_me  = psutil.Process( os.getpid() ).uids().real  # 我的用户 ID\
  \ #\n\n17   while True:\n18       L1, L5, L15 = psutil.getloadavg()\n19       mem\
  \ = psutil.virtual_memory()\n20       if L1  0.5 or pmem.swap > 0:\n51         \
  \      print(f'-> kill {proc.pid} name={proc.name()}')\n52               proc.kill()\n\
  53       time.sleep(refresh_sec)\n```\n\n如果你好奇想尝试一下，这里有一个小程序，最终会让你的计算机不堪重负。它会生成一个越来越大的随机数方阵，然后将其与一个随机向量相乘。如果内存消耗速度太慢，可以增加\
  \ `N` 的增量。同时，修改任务守护程序的常量——特别是 `ignore` 集合中的程序名称——以找到合适的度量标准，从而在你的计算机上杀死失控的进程。\n\n\
  `Python`：\n\n```\n#!/usr/bin/env python3\n"
- '# 文件: code/os/machine_buster.py

  import numpy as np

  N = 200

  while True:

  print(f''N = {N}'')

  a = np.random.rand(N,N)

  b = np.random.rand(N)

  a.dot(b)

  N += 200

