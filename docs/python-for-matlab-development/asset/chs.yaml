  \ `K-J` 项。\n\n### 3.4.3 起始、结束与负索引\n\n在 MATLAB 中，`end` 关键字除其他作用外，还表示数组中的最后一个元素。Python\
  \ 通过将缺失的结束范围标记视为数组或列表的结尾来简化这一概念。\n\n| MATLAB: | Python: |\n| --- | --- |\n| `>>\
