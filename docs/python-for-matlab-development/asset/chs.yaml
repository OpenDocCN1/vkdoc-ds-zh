  \ MATLAB 与 Cartopy\n\n不过，从 MATLAB 使用 Cartopy 存在一个重大挑战。当 Cartopy（0.18.0 版，截至 2021\
  \ 年 7 月为最新版本）尝试从地图服务下载影像图块时，会与 MATLAB 产生异常交互。可能会发生以下两种情况之一：要么出现此错误\n\n```\n或者生成的绘图根本缺少背景图像。\n\
  ```\n\n有一个变通方法，但需要修改 Cartopy 的文件 `cartopy/io/img_tiles.py`，使其使用 `requests` 模块而不是\
  \ Python 标准库中的 `urllib.request` 来下载图块。第一步是找到包含 `img_tiles.py` 的目录或文件夹。这可以在 `ipython`\
  \ 中通过导入 `cartopy.io` 然后检查其 `__path__` 属性来完成。在我的 Linux 计算机上，此目录是\n\n```\nipython:\n\
  \nIn : import cartopy.io\nIn : cartopy.io.__path__\nOut: ['/usr/local/anaconda3/2020.07/envs/matpy/lib/python3.8/site-packages/cartopy/io']\n\
  ```\n\n> **注意**：如果你在多个虚拟环境中安装了 Cartopy，则需要在你计划从中启动 MATLAB 的每个环境中编辑 `img_tiles.py`。\n\
  \n接下来，编辑 `img_tiles.py`，使其包含对 `requests` 的导入（右侧的第 41 行），并将对 `urlopen()`、`six.BytesIO()`\
  \ 和 `fh.close()` 的调用（左侧的第 190–193 行）替换为右侧突出显示的行。（实际行号会因你安装的 Cartopy 版本而异。）\n\n|\
  \ `img_tiles.py` 原始版本： | `img_tiles.py` 修复版本： |\n| --- | --- |\n| `39` `import numpy\
  \ as np`  `40`  `import six`  `41` `42`  `import cartopy` `43`  `import cartopy.crs\
  \ as ccrs` `188` `url = self._image_url(tile)` `189`  `try:` `190`    `request =\
  \ Request(url, headers={` `\"User-Agent\": self.user_agent})` `191`    `fh = urlopen(request)`\
  \ `192`    `im_data = six.BytesIO(fh.read())` `193`    `fh.close()` `194`    `img\
  \ = Image.open(im_data)` | `39`  `import numpy as np` `40`  `import six` `41` `import\
  \ requests` `42` `43`  `import cartopy` `44`  `import cartopy.crs as ccrs` `189`\
  \ `url = self._image_url(tile)` `190`  `try:` `191` `request = requests.get(url,`\
  \ `stream=True)` `192` `request.raw.decode content = True` `193` `img = Image.open(request.raw)`\
  \ |\n\n用于自动执行此补丁的实用程序 `patch_cartopy.py` 的源代码清单见附录 E。\n\n### 12.4.5 在 MATLAB 中避免使用\
  \ matplotlib 的 Qt 后段！\n\nMATLAB 使用 Qt 库来渲染图形。虽然 `matplotlib` 可以使用六种不同的图形库，但其默认使用\
  \ Qt。这是一个问题！Anaconda 发行版附带的 Qt 库不太可能与 MATLAB 自带的 Qt 库匹配。因此，如果你在 MATLAB 中使用 `matplotlib`\
  \ 的 `plt.show()` 命令，将会导致 MATLAB 崩溃。不过有一个简单的变通方法：只需将 `matplotlib` 配置为使用不同的后端即可。首先，我们查询\
  \ Python 安装以查看其当前使用的后端：\n\n```\nPython:\n\nIn : import matplotlib\nIn : matplotlib.get_backend()\n\
  Out: 'Qt5Agg'\n```\n\n`Qt5Agg` 在 MATLAB 中肯定是个问题。一个好的替代方案是 Linux 和 macOS 上的 `TkAgg`\
  \ 后端，以及 Windows 上的 `WXAgg` 后端。例如，在 Python 中切换到 `TkAgg` 后端的方法如下：\n\n```\nPython:\n\
  \nimport matplotlib\nmatplotlib.use('TkAgg')\n```\n\n在 MATLAB 中切换的方法如下：\n\n```\n\
  MATLAB 2020b:\n\nIm  = @py.importlib.import_module;\nmpl = Im('matplotlib');\nmpl.use('TkAgg')\n\
  ```\n\n## 12.5 配方 12-1：使用 Cartopy 在地图上绘制线条\n\n第 12.4.2 节中鲸鱼轨迹在 MATLAB 中的等效代码如下所示：\n\
