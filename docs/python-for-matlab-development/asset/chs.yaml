  \ | `~ x` |\n\n#### 11.1.11.4 转置与共轭转置运算\n\n数组转置在 MATLAB 和 NumPy 之间略有不同。在 MATLAB\
  \ 中，矩阵后的撇号返回转置（如果矩阵是实数矩阵）或复共轭转置（即 Hermite 转置，如果矩阵是复数矩阵）。在 Python 中，`.T` 方法对于实数和复数数组都返回（纯结构上的）转置。要获得共轭转置，必须首先调用\
