  \ Python 文件，对于这两个人来说可能会产生完全不同的结果——如果它甚至能通过语法检查的话。\n\n## 3.4 索引\n\n正如你在接下来的五个小节中将看到的，MATLAB\
  \ 和 Python 的索引方法和能力差异很大。\n\n### 3.4.1 方括号与圆括号\n\nPython 使用方括号（`[ ]`）来索引列表和数组，而 MATLAB\
  \ 对矩阵使用圆括号（`( )`），对元胞和表格则使用圆括号和花括号（`{ }`）的组合。这种差异值得注意，因为 MATLAB 在函数参数周围也使用圆括号。因此，在阅读\
