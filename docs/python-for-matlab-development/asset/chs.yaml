  \ |\n\n#### 11.1.13.3 广播示例 2：距离矩阵\n\n第 11.12.2 节展示了如何利用模拟退火这一随机优化技术解决旅行商问题。TSP 的代价函数是路径中相邻城市间距离的总和。城市位置保持不变，因此我们可以通过预先计算所有城市间的距离来加速\
  \ TSP 求解器的内循环。\n\n假设我们的城市位置可以用笛卡尔坐标 (*x*, *y*) 在二维网格上描述。表 11-3 显示了将在以下示例中使用的四个城市的位置。\n\
