  \ 解压到一个名为 `nat_earth` 的子目录中。我们将使用 `Cartopy` 的形状读取器加载国家形状和元数据，并据此构建一个字典 `shp`，以英文国家名称为键，边界几何形状为对应的值。为了增加趣味性，我们再构建第二个字典\
  \ `rec`，用于存储每个国家的元数据。\n\nPython:\n\n```python\nIn : from cartopy.io.shapereader\
