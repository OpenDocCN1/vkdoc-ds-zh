  \ `for F in files:` `full_path = f'{root}{os.sep}{F}'` `print(f'{full_path}')` `find('data')`\
  \ |\n\n在 Linux 系统上的输出结果如下：\n\n```\ndata/summary-2017.xlsx\ndata/summary-2018.xlsx\n\
