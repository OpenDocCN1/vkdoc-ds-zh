  ### 11.1.7 复标量与复数组


  MATLAB 和 NumPy 在创建复标量和复数组时采用了略微不同的方法。MATLAB 将 `i` 和 `j` 都视为 ![$$ \sqrt{-1} $$](img/516169_1_En_11_Chapter_TeX_IEq1.png)，但
  NumPy 只识别 `j`。两者也都支持接受实部和虚部参数的 `complex()` 函数：


  | MATLAB: | Python: |

  | --- | --- |

  | `>> 1+2i`   `1.0000 + 2.0000i``>> 3 - 4j`   `3.0000 - 4.0000i``>> complex(5,6)`   `5.0000
  + 6.0000i` | `In : 1+2i`    `1+2i``SyntaxError``: invalid syntax``In : 3 - 4j``Out:
  (3-4j)``In : complex(5,6)``Out: (5+6j)` |


  奇怪的是，无论是默认的 Python `complex()` 函数还是 NumPy 版本的 `np.complex()` 函数，都不接受数组参数。因此，要在 NumPy
  中从实部和虚部数组创建复数数值数组，必须将包含虚部的数组乘以复数单位值 `1j`：


  | MATLAB: | Python: |

  | --- | --- |

  | `>> N = ones(2,3);``>> complex(N, -5*N)` `1.00-5.00i 1.00-5.00i 1.00-5.00i` `1.00-5.00i
  1.00-5.00i 1.00-5.00i` | `In : N = np.ones((2,3))``In : N - 5*N*(1j)``array([[1.-5.j,
  1.-5.j, 1.-5.j],`       `[1.-5.j, 1.-5.j, 1.-5.j]])` |


  一旦我们有了一个复数变量，就可以类似地提取其实部和虚部：


  | MATLAB: | Python: |

  | --- | --- |

  | `>> z = complex([2.2;3.3],...`               `[-4.4;5.5])`   `2.2000 - 4.4000i`   `3.3000
  + 5.5000i``>> real(z)`    `2.2000`    `3.3000``>> imag(z)`   `-4.4000`    `5.5000`
  | `In : z=np.array([[2.2],[3.3]]) + (1j)*\``...:   np.array([[-4.4],[5.5]])``In
  : z``array([[2.2-4.4j],`       `[3.3+5.5j]])``In : z.real``array([[2.2],`       `[3.3]])``In
  : z.imag``array([[-4.4],`       `[ 5.5]])` |


  ### 11.1.8 线性索引


  MATLAB 矩阵允许*线性索引*，即可以使用单个标量索引来访问多维数组的元素。该标量索引是从数组开头到目标元素的偏移量，按列步进（或者更一般地说，最左侧维度的索引递增最快）。


  使用 NumPy 数组的 `.take()` 或 `.item()` 方法可以实现相同的功能。但请记住，(1) NumPy 数组是行优先的，因此访问相同元素需要不同的偏移量，以及
  (2) `.take()` 的参数是基于零索引的。


  在此示例中，我们从同一个数组中提取第 12 个元素——但得到了不同的结果，因为 MATLAB 按列计数，而 Python 按行计数。


  | MATLAB: | Python: |

  | --- | --- |

  | `>> a = [11 14 17 20 23;`        `12 15 18 21 24;`        `13 16 19 22 25];``>>
  a(12)`  `22` | `In : a = np.array(``[[11, 14, 17, 20, 23],``[12, 15, 18, 21, 24],``[13,
  16, 19, 22, 25]])``In : a.take(11)``Out: 16` |


  两种语言都有便捷函数，可以根据原始数组的形状返回与线性索引对应的行索引和列索引：


  | MATLAB: | Python: |

  | --- | --- |

  | `>> [r,c]=ind2sub([3,5],12)``r =  3``c =  4``>> sub2ind([3,5],3,4)`  `12` | `In
  : np.unravel_index(11,(3,5))``Out: (2, 1)``In : np.ravel_multi_index((2,1),(3,5))``Out:
  11` |


  `sub2ind()` 和 `np.ravel_multi_index()` 根据目标元素的索引，给出多维数组中的线性偏移量。


  `.take()` 方法还接受索引列表和一个可选参数，用于指定提取元素的维度。这在 MATLAB 中提取 NumPy 数组的行或列时非常有用，因为 MATLAB
  语法不允许使用括号索引 NumPy 数组。


  以下示例展示了如何使用 `.take()` 和 `axis` 关键字参数提取 `a` 的第一行和第三列：


  Python:


  ```

  In : a

  Out:

  array([[11, 14, 17, 20, 23],

  [12, 15, 18, 21, 24],

  [13, 16, 19, 22, 25]])

  In : a.take(0,axis=0)

  Out: array([11, 14, 17, 20, 23])

  In : a.take(2,axis=1)

  Out: array([17, 18, 19])

  ```


  此技术的实际应用出现在第 12.​7 节，其中在 MATLAB 内部从二维 NumPy 颜色映射数组中提取一维 RGBA 值的 NumPy 数组；其代码行如下：


  ```

  color = colors.take(col_ind + int64(4)*color_row);

  ```


  ### 11.1.9 从文本文件读写数组


  第 7.​1 和 7.​6 节介绍了通用数据的文本和二进制 I/O。此处，我们将专门针对数值数组与文本文件之间的 I/O 进行探讨。



  好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。



  #### 11.1.9.1 从文本文件读取数组


  在两种语言中，都可以通过多种方式从文本文件中读取数值，但最简单的方法是使用 MATLAB 的 `load()` 函数和 NumPy 的 `np.loadtxt()`。以下示例演示了如何读取包含以下
  3×2 矩阵的文本文件 `a.txt`：


  ```

  -3.2  4.3

  1.e-5 2.9

  6.6  -9.2

  ```


  MATLAB 和 Python 的加载函数都允许文件包含注释标记——即井号后面的任何文本——并且两者都会跳过空行。


  | MATLAB: | Python: |

  | --- | --- |

  | `>> a = load(''a.txt'')` `a =` `-3.2000e+00   4.3000e+00` `1.0000e-05   2.9000e+00`
  `6.6000e+00  -9.2000e+00` | `In : a = np.loadtxt(''a.txt'')` `In : a` `array([[-3.2e+00,  4.3e+00],`
  `[ 1.0e-05,  2.9e+00],` `[ 6.6e+00, -9.2e+00]])` |


  （有关从逗号分隔值文件读取数据，请参见第 7.1.5 节。）


  #### 11.1.9.2 将数组写入文本文件


  将数值数据写入文本文件也有多种方法，但简便方法仍然是使用单个函数调用——MATLAB 中的 `save()` 和 Python 中的 `np.savetxt()`。我们将使用从上一节的
  `a.txt` 文件加载的同一个 `a` 矩阵：


  | MATLAB: | Python: |

  | --- | --- |

  | `>> save("aM.txt","a","-ascii")` | `In : np.savetxt(''aP.txt'', a)` |


  这将产生以下文件：


  来自 MATLAB 的 `aM.txt`：


  ```

  -3.20000000e+00 4.30000000e+00

  1.00000000e-05 2.90000000e+00

  6.60000000e+00 -9.20000000e+00

  ```


  来自 Python 的 `aP.txt`：


  ```

  -3.200000000000000178e+00 4.299999999999999822e+00

  1.000000000000000082e-05 2.899999999999999911e+00

  6.599999999999999645e+00 -9.199999999999999289e+00

  ```


  `np.savetxt()` 的格式可以通过可选的 `fmt` 关键字参数进行配置：


  ```

  In : np.savetxt(''aP.txt'', a, fmt=''% 10.3f'')

  In : cat aP.txt

  -3.200      4.300

  0.000      2.900

  6.600     -9.200

  ```


  ### 11.1.10 从/向二进制文件读取/写入数组


  与文本文件的输入/输出相比，对数组进行二进制文件的输入/输出速度更快，并且几乎总是更节省空间。二进制 I/O 可以仅使用数组中数值数据的原始字节，也可以使用原始字节加上存储数组维度和数据类型的附加元数据。在这里，我们将介绍带元数据和不带元数据读取/写入的四种组合，并描述如何管理小端/大端字节转换。


  #### 11.1.10.1 从二进制文件读取原始数组


  这可以通过在 MATLAB 中以读取二进制模式打开文件，或使用 NumPy 的 `np.fromfile()` 函数来完成。以下示例演示了如何读取一个包含 64,800
  个单精度浮点数（例如，表示以 1° 经纬度间隔分布的海面温度）的二进制文件，使用本机字节序。


  | MATLAB: | Python: |

  | --- | --- |

  | `>> fh = fopen(''f64800.bin'');` `>> sst = fread(fh, [360 ...` `180], ''single'');`
  `>> fclose(fh);` | `In : sst = np.fromfile(''f64800.bin'',` `dtype=np.float32)`
  `In : sst = sst.reshape(360,180)` |


  给定同一个二进制文件，Python 和 MATLAB 将加载相同的一维数组元素。然而，如果将这些元素加载到二维或更高维度的数组中，两种语言在行主序和列主序上的差异意味着元素的排列顺序会不同。在前面的例子中，为了使
  MATLAB 中的 `sst(i+1,j+1)` 等于 Python 中的 `sst[i,j]`，MATLAB 的 `sst` 必须像这样加载：


  MATLAB:


  ```

  >> fh = fopen(''f64800.bin'');

  >> sst = fread(fh, 360*180, ''single'');

  >> fclose(fh);

  >> sst = reshape(sst,180,360)'';

  ```


  #### 11.1.10.2 将原始数组写入二进制文件


  数值数组可以轻松地写入二进制文件。这里，我们将写入上一个示例中使用的海面温度样本文件：


  | MATLAB: | Python: |

  | --- | --- |

  | `>> sst = single(rand(360,180))` `>> fh = fopen(''f64800.bin'',''w'');` `>> fwrite(fh,sst,''single'');`
  `>> fclose(fh);` | `In : sst = np.random.rand(360,` `180).astype(np.float32)` `In
  : sst.tofile(''f64800.bin'')` |


  #### 11.1.10.3 将数组与元数据一起写入二进制文件


  这创建了以后使用更方便的文件，因为数据类型和维度也一并存储了。缺点是这种文件格式对于其他应用程序来说更难处理。不带参数的 MATLAB 的 `save()` 会将一个或多个数组（或其他数据结构）写入二进制文件。保存的文件采用
  `.mat` 格式，包含 MATLAB 特定的头部信息，因此不仅包含数组字节的纯数值表示。


  NumPy 有一对类似的函数，`np.save()` 和 `np.savez()`，它们将一个或多个数组保存为 `.npy` 或 `.npz` 格式的文件。与
  `.mat` 文件类似，`.npy`/`.npz` 文件包含关于数组形状和类型的附加元数据。遗憾的是，默认情况下不会捕获数组本身的名称；要将此信息添加到 `.npz`
  文件中，必须使用 `array=name` 这种特殊的表示法来调用 `np.savez()`——在我们的例子中，就是 `X=X` 和 `Y=Y`。如果我们省略这一点，该函数会将我们的数组存储为名为
  `arr_0`, `arr_1` 等的名称。


  | MATLAB: | Python: |

  | --- | --- |

  | `>> X=reshape([-4:4], 3,3)''` `X =` `-4  -3  -2` `-1   0   1` `2   3   4` `>>
  Y = [pi e]` `Y =` `3.1416   2.7183` `>> save ''XY.mat''  X Y` | `In : X = np.arange(-4,5).reshape(3,3)`
  `In : X` `array([[-4, -3, -2],` `[-1,  0,  1],` `[ 2,  3,  4]])` `In : Y = np.array([np.pi,
  np.e])` `In : Y` `Out: array([3.14159265, 2.71828183])` `In : np.savez(''XY.npz'',
  X=X, Y=Y)` |


  使用 `np.save()` 或 `np.savez()` 保存 NumPy 数组比使用 `pickle` 模块（第 7.13 节）更高效，并且在不同的 Python
  版本间更具可移植性。


  在第 11.1.10.4 节中，我们将看到 `XY.mat` 和 `XY.npz` 可以分别使用 MATLAB 的 `load()` 函数和 NumPy 的 `np.loadz()`
  函数加载。


  在重新加载这些数组之前，我们将再写入一对二进制文件，这次只保存数值数据的字节。当为后续用其他语言（C、C++、Java、Fortran 等）编写的代码导入数据时，这非常有用，因为这些语言不理解
  `.mat` 或 `.npz` 格式。数组的纯二进制表示也使得 MATLAB 能够读取由 Python 写入二进制文件的数组（尽管反之则没有必要，因为 Python
  通过 SciPy 模块可以读取 `.mat` 文件，参见第 7.14 节）。


  MATLAB 中的原生二进制写入需要采用第 7.6 节中所示的写入技术。不过，NumPy 数组有一个方法 `.tofile()`，正是为此目的而设。在这两种情况下，我们预期数组
  `X` 生成的二进制文件都将有 9 个元素 × 每个元素 8 字节 = 72 字节。


  | **MATLAB:** | **Python:** |

  | --- | --- |

  | `>> fh = fopen(''Xm.bin'',''wb'');` `>> fwrite(fh, X, ''double'');` `>> fclose(fh);`
  `>> ls -l X?.bin` `-rw-rw-r-- 1 al al 72 Nov 15 15:27 Xm.bin` `-rw-rw-r-- 1 al al
  72 Nov 15 15:28 Xp.bin` | `In : X.tofile(''Xp.bin'')` |


