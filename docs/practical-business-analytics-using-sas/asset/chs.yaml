  \ 21% |\n| 4 | 81% | 19% |\n| 5 | 85% | 15% |\n| 6 | 85% | 15% |\n| 7 | 88% | 12%\
  \ |\n| 8 | 89% | 11% |\n| `N/A` | 1% | 99% |\n|   | 74% | 26% |\n\n在每人拥有一个储蓄账户的客户总数中，70%的人至少有一张信用卡。同样，拥有四个储蓄账户的客户中，81%的人有信用卡。在储蓄账户数量为`N/A`的组中，只有\
  \ 1%的人有信用卡，其余 99%的人没有任何信用卡。储蓄账户数量为 0 的组情况相同。\n\n0 个储蓄账户和`N/A`账户的客户中，分别有 1%是信用卡持有者。因此，一个很好的解决方案是将`N/A`替换为\
  \ 0，而不是使用总体均值 3。这是相对于另一个相关变量进行的插补。选择相关变量没有固定的经验法则，它取决于要解决的业务问题。\n\n**对于缺失值或异常值在\
  \ 10%至 50%之间的离散变量：**\n\n*   在这种情况下需要执行两项任务：基于相关变量插补缺失值，以及创建一个将缺失（标记为 1）与非缺失类别区分开的虚拟/指示变量。\n\
  *   第一项任务是确保没有缺失值。由于数据中有相当一部分缺失，务必在数据中标记缺失/非缺失记录。需要创建一个新的指示变量，用于捕获变量缺失与非缺失记录的信息。该变量将在后续分析中使用。如何创建指示变量已在前面章节中解释过。第二项任务是基于相关变量插补缺失值。\n\
  \n**对于缺失值或异常值超过 50%的离散变量：**\n\n需要创建一个新的指示变量，并删除原始变量，因为可用的数值百分比极小，无法使用。\n\n**对于缺失值或异常值少于\
  \ 10%的连续变量：**\n\n独立的插补就足够了。\n\n**对于缺失值或异常值在 10%至 50%之间的连续变量：**\n\n既需要创建指示变量，也需要对缺失值进行插补。\n\
  \n**对于缺失值或异常值超过 50%的连续变量：**\n\n创建一个指示变量，并删除原始变量。\n\n回到案例，到目前为止的问题如下：\n\n\n\n`RevolvingUtilizationOfUnsecuredL`（循环利用额度）是一个连续变量，约有\
  \ 5%的异常值。`MonthlyIncome`（月收入）是一个连续变量，有 20%的个案存在缺失值。`NumberOfTime30-59DaysPastDueNotWorse`（逾期\
  \ 30-59 天次数）、`NumberOfTime60-89DaysPastDueNotWorse`（逾期 60-89 天次数）和`NumberOfTimes90DaysLate`（逾期\
  \ 90 天及以上次数）均为离散变量，其取值为 96 和 98 时存在问题，这类错误占比小于 10%。`NumberOfDependents`（家属数量）是一个离散变量，约有\
  \ 2%的缺失值。\n\n以下各节将检查每个变量存在的问题，并对其进行相应处理。\n\n#### 清洗连续变量\n\n在前面的章节中，你在变量`RevolvingUtilizationOfUnsecuredL`中发现了异常值。现在你将尝试处理它们。\n\
  \n让我们从变量`RevolvingUtilizationOfUnsecuredL`（循环利用额度）开始。表 7-42 给出了该变量在`proc univariate`过程中的输出结果（取自表\
  \ 7-21）。\n\n**表 7-42.** `RevolvingUtilizationOfUnsecuredL`单变量分析的百分位数表\n\n| 百分位数\
  \ (定义 5) |\n| --- |\n| 百分位 | 估计值 |\n| :--- | :--- |\n| 100% 最大值 | 5070800% |\n|\
  \ 99% | 109% |\n| 95% | 100% |\n| 90% | 98% |\n| 75% Q3 | 56% |\n| 50% 中位数 | 15%\
  \ |\n| 25% Q1 | 3% |\n| 10% | 0% |\n| 5% | 0% |\n| 1% | 0% |\n| 0% 最小值 | 0% |\n\n\
  `RevolvingUtilizationOfUnsecuredL`是一个连续变量，大约有 5%的异常值。请参考图 7-10。\n\n![A978-1-4842-0043-8_7_Fig10_HTML.jpg](img/A978-1-4842-0043-8_7_Fig10_HTML.jpg)\n\
  \n**图 7-10.** 处理含 5%异常值的连续变量\n\n忽略异常值后的平均利用率可通过以下代码求得：\n\n`Title 'Proc Univariate\
  \ on utilization less than or equal to 100% ';`\n\n`Proc univariate data= cust_cred_raw_v1\
  \ plot;`\n`Var RevolvingUtilizationOfUnsecuredL;`\n`Where RevolvingUtilizationOfUnsecuredL<=\
  \ 1;`\n`run;`\n\n表 7-43 列出了此代码的输出。\n\n**表 7-43.** 带有条件`RevolvingUtilizationOfUnsecuredL<=1`的`proc\
  \ univariate`输出\n\n| 基本统计量 |\n| --- |\n| 位置度量 | 变异性度量 |\n| :--- | :--- |\n| 均值 |\
  \ 0.304325 | 标准差 | 0.33852 |\n| 中位数 | 0.143964 | 方差 | 0.11460 |\n| 众数 | 0.000000\
  \ | 极差 | 1.00000 |\n| | | 四分位距 | 0.49351 |\n\n由于异常值已被移除，新的均值 30.4%可以作为实际的集中趋势使用。以下代码通过使用均值替换异常值来执行独立插补：\n\
