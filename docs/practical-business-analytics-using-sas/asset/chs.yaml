  \ | Tau-a | 0.083 |\n| Pairs | 1403379324 | c | 0.832 |\n\n现在我们将详细讨论输出结果。\n\n从数据集中读取了大约\
  \ 150,000 条客户记录（表 11-19）并用于本次分析。其中有 139,974 个好账户和 10,026 个坏账户（表 11-20）。在现实生活中的银行贷款组合中，您会预期超过\
  \ 90% 的客户是好的。\n\n您可能会想，如果好坏账户已经给出，我们试图预测什么？为什么不直接使用它们？记住，这是历史数据，您已经知道谁好谁坏。您正尝试使用这些数据来拟合一个模型，该模型将根据给定的自变量（如收入、贷款、借记和利用率）预测（新客户的）违约概率。您可以将此模型用于未来新客户的贷款审批，即使他们不在历史数据中。对于所有未来客户，您将在贷款申请时收集自变量的数据，这些数据将用于评估每个客户的相关风险。\n\
