  \ 和 `IACF` 均衰减至零。TS 14 是一个 `ARMA` 过程。\n\n**时间序列图 15 (图 12-30):** `y[t] = 0.55 y[t-1]\
  \ + 0.35 y[t-2] + ε[t] - 0.5 ε[t-1]`\n\n![A978-1-4842-0043-8_12_Fig49_HTML.jpg](img/A978-1-4842-0043-8_12_Fig49_HTML.jpg)\n\
  \n**图 12-49.** 时间序列图 15 (图 12-30) 的 `ACF` 和 `PACF` 图\n\n注意，在图 12-49 中，`ACF`、`PACF`\
  \ 和 `IACF` 均衰减至零。TS 15 是一个 `ARMA` 过程。\n\n\n\n##### 使用 SCAN 和 ESACF 确定 ARMA 阶数 (p,q)\n\
  \n你已了解，仅通过观察 ACF、PACF 和 IACF 图形，无法识别 ARMA 过程中的阶数 `p` 和 `q`。幸运的是，有一些高级技术可用于确定 ARMA\
  \ 模型的阶数。要确定阶数，你需要计算另外两个函数：最小典型相关 (SCAN) 和扩展样本自相关函数 (ESACF)。它们由 Ruey Tsay 和 George\
  \ Tiao 开发。根据他们的研究，如果一个序列是 ARMA (`p`,`q`) 过程，那么 ESACF 图是一个以 (`p`,`q`) 为顶点的三角形，而 SCAN\
  \ 图是一个以 (`p`,`q`) 为顶点的矩形。该理论的细节超出了本书的范围；不过，和往常一样，你可以使用 SAS 计算 ESACF 和 SCAN 函数值，并得出\
  \ `p` 和 `q` 的值。以下是计算 ESACF 和 SCAN 函数值的 SAS 代码：\n\n```sas\nproc arima data= TS13\
  \ plots=all;\nidentify var=x    SCAN ESACF ;\nrun ;\n```\n\n你只需添加两个选项：`SCAN` 和 `ESACF`。这段代码会给出更详细的输出。你可以直接查看由\
  \ SCAN 和 ESACF 给出的最终综合建议（表 12-14）。\n\n表 12-14. 使用 SCAN 和 ESACF 确定 ARMA 过程阶数的 SAS\
  \ 输出\n\n| ARMA(p+d,q) 暂定阶数选择检验 |\n| --- |\n| SCAN | ESACF |\n| --- | --- |\n| p+d\
  \ | q | p+d | q |\n| 1 | 1 | 1 | 1 |\n| 4 | 0 | 5 | 4 |\n| 0 | 5 | 0 | 5 |\n\n由于你在此阶段之前已经检验了平稳性，这里可以简单地将\
  \ `d` 视为零。换句话说，在表 12-14 中，你可以将 `p+d` 视为 `p`。SCAN 函数的第一个建议是 ARMA(1,1)。ESACF 也建议将\
  \ ARMA(1,1) 作为首选。因此，所讨论的序列是 1,3。SCAN 和 ESACF 都给出了一些 `p` 和 `q` 的其他选项。通常，应选择参数较少的、较简单的模型，而非更复杂的模型。简单的模型能产生更好的预测。\n\
  \n如果你采用 `p=5` 且 `q=5` 的模型，那么模型方程中将有太多需要估计的参数。模型 (`p=5`,`q=5`) 将包含 `a1`、`a2`、`a3`、`a4`、`a5`\
  \ 以及 `b1`、`b2`、`b3`、`b4`、`b5` 作为参数。通常，参数过多的模型不够稳健，无法给出准确的预测。因此，更倾向于选择 `p<=2` 且 `q<=2`\
  \ 的较简单模型。如果 SCAN 和 ESACF 建议了多个选项，那么最好选择 `p` 和 `q` 值最小的模型。\n\n类似地，你可以为 TS 14 和 TS\
  \ 15 寻找 SCAN 和 ESACF。输出结果请参考表 12-15 和 12-16。\n\n```sas\nproc arima data = TS14 plots\
  \ = all;\nidentify var = x SCAN ESACF ;\nrun ;\n```\n\n表 12-15. 使用 SCAN 和 ESACF\
  \ 确定 ARMA 过程阶数的 SAS 输出\n\n| ARMA(p+d,q) 暂定阶数选择检验 |\n| --- |\n| SCAN | ESACF |\n\
  | --- | --- |\n| p+d | q | p+d | q |\n| 1 | 1 | 1 | 1 |\n| 3 | 0 | 2 | 1 |\n| 0\
  \ | 4 | 3 | 1 |\n|   |   | 5 | 1 |\n|   |   | 0 | 4 |\n\n同样，SCAN 和 ESACF 给出的首选都是\
  \ ARMA(1,1)。因此，TS 14 是一个 ARMA(1,1) 过程。\n\n```sas\nproc arima data= TS15 plots=all;\n\
  identify var=x    SCAN ESACF ;\nrun ;\n```\n\n表 12-16. 使用 SCAN 和 ESACF 确定 ARMA 过程阶数的\
  \ SAS 输出\n\n| ARMA(p+d,q) 暂定阶数选择检验 |\n| --- |\n| SCAN | ESACF |\n| --- | --- |\n\
  | p+d | q | p+d | q |\n| 2 | 1 | 2 | 1 |\n| 1 | 2 | 1 | 2 |\n| 4 | 0 |   |   |\n\
  \n你已拥有一个平稳序列，无需进一步差分。这意味着 `d` 可以取 `d=0`。SCAN 和 ESACF 都将 ARMA(2,1) 过程作为首选。因此，时间序列\
  \ TS 15 是一个 ARMA(2,1) 过程。\n\n让我们回顾一下目前所完成的工作。你希望预测未来的值。你需要使用 ARIMA 技术进行模型构建和预测。要使用\
  \ Box-Jenkins 方法构建模型，需要序列是平稳的。作为步骤 1 的一部分，你检验了平稳性。如果序列不平稳，你通过差分使其平稳。正是在这一步，确定了 ARIMA\
  \ (`p`, `d`, `q`) 中 `d` 的值。然后在步骤 2 中，你识别 `p` 和 `q` 的阶数。一旦确定了 `p` 和 `q`，你就可以写出模型的框架方程。例如，你将一个模型识别为\
  \ AR(1)，然后可以写出如下框架方程：\n\n`Y[t]= a[1]*Y[t-1]+ ε[t-1]`\n\n下一步，你需要找到 `a[1]` 的估计值。根据序列的类型——AR(p)、MA(q)\
  \ 或 ARMA(p,q)——你需要估计相应数量的参数。如果序列是 AR(2)，你需要估计两个参数。\n\n##### 识别 SAS 示例\n\n一个电子商务网站希望跟踪每日独立访客数量，并收集了近一年的数据。现在公司希望预测下一周的访客数量。在进行预测之前，你需要识别这是哪种类型的序列。\n\
  \n以下是识别每日独立访客数量的代码。输出结果请参考表 12-17 和图 12-50。\n\n```sas\nods graphics on; /* 显示图形的选项\
  \ */\nproc arima data = web_views plots = all;\nidentify var = Visitors stationarity\
  \ = (DICKEY) ;\nrun ;\n```\n\n表 12-17. web_views 序列上 PROC ARIMA 的输出\n\n| 变量名称 =\
