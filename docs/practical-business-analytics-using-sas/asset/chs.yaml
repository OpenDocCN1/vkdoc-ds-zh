  \ `ACF` 在滞后 3 处截尾。TS 12 是一个 3 阶 `MA` 过程。\n\n##### 识别 ARMA 过程的经验法则\n\n与纯 `AR` 和纯\
  \ `MA` 过程相比，识别 `ARMA` 过程的阶数较为困难。如果 `ACF` 衰减至零，则为 `AR` 过程，并且 `PACF` 给出了 `AR` 过程的阶数。如果\
  \ `IACF` 衰减至零，则为 `MA` 过程，其阶数通过查看 `ACF` 图来确定。但对于 `ARMA` 过程，`ACF`、`PACF` 和 `IACF`\
  \ 的行为均相同。虽然你可以快速识别出该过程是 `ARMA` 过程，但无法确定其阶数。因此，当序列是 `ARMA` 过程时，你无法通过查看 `ACF`、`PACF`\
  \ 和 `IACF` 图来确定其阶数。表 12-13 总结了经验法则。图 12-47 至图 12-49 给出了前面章节讨论的 `ARMA` 过程的 `ACF`、`PACF`\
