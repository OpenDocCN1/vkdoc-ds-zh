  \ 58。第 4 章 详细解释了`PROC CONTENTS`输出的解读。\n\n\n\n### 相关性与回归\n\n如前所述，相关性量化了两个变量之间的关系。它可以告诉我们两个变量之间的相关程度，通常用强关联、弱关联或无关联来判定。如果变量\
  \ A 和变量 B 之间存在强关联，那么给定 B 的值，就有可能准确预测 A 的值。同理，如果知道 B 的变化，也可以准确预测 A 的变化。在之前讨论的智能手机例子中，很自然会得出智能手机销量取决于价格的结论。为了量化这种关联，即判断这两个变量之间的紧密或强弱程度，可以使用相关性分析。以下是用于确定该关系的\
  \ SAS 代码：\n\n```\n/* 相关性分析 */\nproc corr data=   mobiles;\nvar price sales;\nrun\
  \ ;\n```\n\n表 9-10 显示了上述代码的输出结果。\n\n**表 9-10.** 手机数据集上 `PROC CORR` 的输出结果\n\n| 2\
  \ 个变量： | 价格 销量 |\n| --- | --- |\n| **简单统计量** | |\n| 变量 | N | 均值 | 标准差 | 总和 | 最小值\
  \ | 最大值 |\n| 价格 | 58 | 2121 | 2806 | 123030 | 51.00000 | 9840 |\n| 销量 | 58 | 9394688\
  \ | 3930243 | 544891907 | 777363 | 18414201 |\n\n| **皮尔逊相关系数，N = 58 在 H0: Rho=0\
  \ 下 Prob > \\|r\\|** |\n| --- |\n|   | 价格 | 销量 |\n| 价格 | 1.00000 | -0.21985 |\n\
  |   |   | 0.0973 |\n| 销量 | -0.21985 | 1.00000 |\n|   | 0.0973 |   |\n\n结果表明，价格与手机销量之间存在微弱的负相关关系（`r\
  \ = -0.219885`）。鉴于这种弱关系，分析师可能进一步有兴趣量化：当价格为 800 美元或 1500 美元时，会产生多少销售额。仅靠相关性在这里是不够的；分析师需要一个模型或方程式，当输入价格时，能够给出销售额。这就是回归分析发挥作用的地方。回归模型（图\
  \ 9-16）有助于在给定自变量（如价格）的值时，确定因变量（此处为销量）的值。\n\n![A978-1-4842-0043-8_9_Fig16_HTML.jpg](img/A978-1-4842-0043-8_9_Fig16_HTML.jpg)\n\
  \n**图 9-16.** 建模过程的图示\n\n前面的例子表明，相关性只是一个系数，它指示变量之间的关系是弱还是强。而回归则是一种建模技术，它以方程的形式给出两个变量之间的实际关系。给定自变量的值，该方程可用于获得因变量的估计值或预测值。因变量用\
  \ `Y` 表示，自变量（可以不止一个）用 `Xi`（`i=1,2,3,4...`）表示。\n\n表 9-11 列出了因变量和自变量的不同称呼。\n\n**表\
  \ 9-11.** 回归建模中 x 和 y 的不同称呼\n\n| x | y |\n| --- | --- |\n| 自变量 | 因变量 |\n| 输入 | 输出\
  \ |\n| 预测变量 | 响应变量 |\n| 输入读数 | 标签 |\n| 原因 | 结果 |\n| 解释变量 | 被解释变量 |\n| 回归变量 | 被回归变量\
  \ |\n| 控制变量 | 测量变量 |\n| 操纵变量 | 准则变量 |\n| 特征 | 实验变量 |\n| 暴露变量 | 结果变量 |\n| 右侧变量 |\
  \ 左侧变量 |\n\n### 估计示例\n\n以一家位于繁忙市区的快餐店为例。过去 30 天的数据显示，任意一天售出的汉堡数量与进店顾客数量成正比。店长想要预测当给定数量的顾客（比如\
  \ 4500 人）进店时，会售出多少个汉堡。\n\n以下是用于读取该店历史数据并找出顾客数量与汉堡销量之间相关性的 SAS 代码片段：\n\n```\n/* 导入汉堡销售数据*/\n\
  PROC IMPORT OUT= WORK.burgers\nDATAFILE= \"C:\\Users\\VENKAT\\Google Drive\\Training\\\
  Books\\Content\\\nRegression Analysis\\Burger_sales.csv\"\nDBMS=CSV REPLACE;\nGETNAMES=YES;\n\
  DATAROW= 2 ;\nRUN ;\n\n/* 顾客数量与汉堡销量之间的相关性*/\nproc corr data=   burgers;\nvar visitors\
  \ burgers;\nrun ;\n```\n\n表 9-12 显示了相关性分析的结果。\n\n**表 9-12.** 汉堡数据集上 `PROC CORR`\
