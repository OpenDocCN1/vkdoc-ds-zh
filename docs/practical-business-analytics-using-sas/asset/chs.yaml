  \n\n\n#### 日期区间\n\n你通常需要计算两个日期之间的区间。这并非简单地计算起始日期和结束日期之间的差值（以天数为单位）。差值可能以天、月、年或季度来表示。你可以使用\
  \ `INTCK` 函数来查找两个日期之间的区间长度。\n\n本例再次引用市场活动数据集。该数据集包含每次活动的开始日期和结束日期。你需要找出每次活动的持续时间。\n\
  \n代码如下：\n\n```\ndata market_campaign_v1;\nset market_campaign;\nDuration_days=INTCK('day',start_date,end_date);\
  \ /* 以天为单位查找持续时间 */\nDuration_months=INTCK('month',start_date,end_date); /* 以月为单位查找持续时间\
  \ */\nDuration_weeks=INTCK('week',start_date,end_date); /* 以周为单位查找持续时间 */\nrun;\n\
  \nproc print data=market_campaign_v1(obs=10) noobs;\nvar camp_id name Duration_days\
  \ Duration_months Duration_weeks;\nrun;\n```\n\n表 4-8 展示了输出结果的快照。\n\n**表 4-8.**\
  \ 使用 `INTCK` 函数以天、月和周为单位计算的活动持续时间\n\n| Camp_ID | Name | Duration_days | Duration_months\
