  \n#### 匹配合并：一个简短的案例研究\n\n您从某个电信案例研究中有两个数据集：账单数据和投诉数据。账单数据包含客户及账单相关的变量，而投诉数据包含过去六个月内客户提出的投诉类型。投诉数据还包含已销户客户的详细信息，这些客户不在账单数据中。您希望执行以下操作来准备数据以进行进一步分析：\n\
  \n-   按客户 ID 对账单数据进行排序并删除重复项。\n-   创建一个合并数据集，其中仅包含提出投诉的现有账单客户。您还需要在结果数据集中附加评论类型；将此数据集命名为\
  \ `active_complaints` 数据。\n-   将客户的账单详情附加到那些提出投诉的客户。您可能希望将其用于综合分析投诉和使用信息。\n-   将客户的投诉详情附加到那些正在积极支付账单的客户。您可能希望将其用于获取使用模式以及投诉类型。\n\
  \n以下是执行这些任务的代码和结果：\n\n按客户 ID 对账单数据进行排序并删除重复项。\n\n```\nproc sort data= bill nodupkey;\n\
  by cust_id;\nrun;\n```\n\n日志文件显示如下：\n\n```\nNOTE: There were 31183 observations\
  \ read from the data set WORK.BILL.\nNOTE: 13259 observations with duplicate key\
  \ values were deleted.\nNOTE: The data set WORK.BILL has 17924 observations and\
  \ 6 variables.\nNOTE: PROCEDURE SORT used (Total process time):\nreal time     \
  \      0.06 seconds\ncpu time            0.03 seconds\n```\n\n作为练习，您可以打印结果数据集的快照。\n\
  \n创建一个合并数据集，其中仅包含提出投诉的现有账单客户。在结果数据集中附加评论类型。将结果数据集命名为 `active_complaints`。\n\n```\n\
  proc sort data=    bill nodupkey;\nby cust_id;\nrun;\n\nproc sort data=    complaints\
  \ nodupkey;\nby cust_id;\nrun;\n\ndata active_complaints;\nmerge  bill(in=a)  complaints(in=b);\n\
  by     cust_id;\nif a and b;\nrun;\n\nproc print data= active_complaints(obs= 10\
  \ ) noobs;\nrun;\n```\n\n以下是上述代码的日志文件：\n\n```\nNOTE: There were 17924 observations\
