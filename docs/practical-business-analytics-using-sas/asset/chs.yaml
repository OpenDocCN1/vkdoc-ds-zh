  \nSAS 中还有许多其他的数值、字符和日期函数。它们大多数都很直观。这里不再一一列出，但你可以在需要时轻松地通过 Google 搜索找到它们。\n\n## 重要的\
  \ SAS 过程\n\n在本节中，你将看到 SAS 中一些重要的过程。数据步骤用于数据操作，而过程步骤则用于调用算法和预编写的 SAS 程序。SAS 过程在从生成简单的数据洞察到基于高级分析获得推论等各个方面都非常有用。\n\
  \n### 过程步\n\n过程步以关键字 `PROC` 开头，并且在 `PROC` 后面总是跟着一个过程名称。你需要清楚地理解 SAS 中函数和过程的区别。函数是一种例程。在接下来的部分中，你将从一个名为\
  \ `PROC CONTENTS` 的过程开始。\n\n### PROC CONTENTS\n\n`PROC CONTENTS` 提供 SAS 数据集的信息，类似于数据库表的元数据。在进行分析之前，始终建议先查看\
  \ `proc contents` 的输出，以快速获取关于数据（或者更准确地说，数据集）的一些信息。内容数据提供两个层面的信息。\n\n*   **数据集层面：**\
  \ 包括数据集的详细信息，如名称、总记录数、创建日期、变量数量、文件大小、文件位置和访问权限等。\n*   **变量层面：** 提供的详细信息包括变量的类型、变量的长度、变量的格式以及变量的标签。\n\
  \n`Proc contents` 可用于以下目的：\n\n*   快速检查数据集的总体详细信息，而不是打开或打印它\n*   将外部文件导入 SAS 后检查观测总数\n\
  *   检查数据集中是否存在某个变量\n*   验证变量的类型和格式\n\n#### PROC CONTENTS 示例\n\n以下代码显示 `sashelp`\
  \ 逻辑库中 `Stocks` 数据集的内容：\n\n```\nproc contents data=sashelp.stocks;\nrun;\n```\n\n\
  表 4-10 列出了此 SAS 代码的输出。\n\n**表 4-10.** 对 `sashelp.stocks` 执行 `PROC CONTENTS` 的 SAS\
