  \ | 整数 |\n| `NumberOfTime60-89DaysPastDueNotWorse` | 过去 2 年内借款人逾期 60 至 89 天但未超期的次数。该数据跨度为\
  \ 2 年。客户有多少次逾期 60 至 89 天但未超期？一次、两次、三次或五次？ | 整数 |\n| `NumberOfDependents` | 家庭中除申请人之外的受抚养人数（配偶、子女等）。\
  \ | 整数 |\n\n以下章节将使用简单的描述性统计技术来探索、验证和清洗信用风险数据。\n\n\n\n#### 导入数据\n\n以下 SAS 代码将 `.csv`\
