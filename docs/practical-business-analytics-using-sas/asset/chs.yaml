  | General_knowledge | 1 | 1.16697 | 0.10003 | 11.67 | <.0001 | 15.05316 |\n| Aptitude\
  \ | 1 | -0.13479 | 0.09683 | -1.39 | 0.1673 | 14.01316 |\n| Mathematics | 1 | -0.11081\
