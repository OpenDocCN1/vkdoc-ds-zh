  \n\n\n#### 使用模型进行预测\n\n银行可使用最终模型在审批贷款时量化每位客户的风险。该模型会给出违约概率，因此银行可以设定一个最低阈值——例如，如果模型显示某客户的违约概率超过\
  \ 50%，则拒绝其贷款申请。\n\n举例来说，考虑表 11-29 中列出的三位客户，以及他们贷款申请中提供的详细信息。\n\n**表 11-29.** 示例客户的贷款申请详情\n\
