  \ | 12.72 | <.0001 | 1.89073 |\n\n以下是检查表：\n\n- **回归假设**：已知数据未违反回归假设。\n- **F 检验**：结果良好；模型是显著的。\n\
  - **R 方**：超过 80% 的方差解释率表明拟合效果良好。\n- **调整 R 方**：与 R 方非常接近，因此模型中不存在无关值。\n- 所有 VIF\
  \ 值均在限值内；不存在多重共线性威胁。\n- 所有变量均通过 T 检验，表明它们对销售额都有显著影响。\n\n该模型已准备好用于智能手机销售预测。在给定 `评分`、`价格`、`新功能数量`\
  \ 和 `市场推广预算` 的值时，准确率将超过 80%。以下是用于预测的最终模型方程：\n\n## 结论\n\n在本章中，你从多元线性回归开始，以处理使用多个自变量的预测问题。你还学习了多元回归的拟合优度度量方法。多元回归有多个自变量，它们之间的相互依赖可能导致荒谬的结果。你学习了如何处理多重共线性问题。最后，你看到了一个在分析多元回归输出时可以使用的检查表。本章以基础水平简化并处理了几个概念。你可能需要参考专门的回归教科书来深入了解这些概念背后的理论。\n\
  \n我们讨论了线性回归。显然，你不能期望这个世界上的所有关系都是线性的。如果你遇到了因变量（y）和自变量（xi）之间的非线性关系，该怎么办？如何构建非线性回归线？假设条件有哪些变化？拟合优度度量方法是什么？该过程中还涉及哪些其他挑战？非线性回归是下一章的主题。敬请期待！\n\
  \n"
- "# 11. 逻辑回归\n\n在前面的章节中，我们详细介绍了相关性和线性回归建模。如果你想要量化两个变量之间的关系，可以使用相关系数。例如，你可以使用相关性来量化薪资与支出之间的关系。如果你需要根据其他变量来预测一个响应变量，只要关系是线性的，你就可以使用线性回归建模。例如，如果你想精确预测当某人薪资为\
  \ 10000 美元时他的支出是多少，只要支出和薪资符合直线图形，你就可以使用线性回归建模。在某些情况下，这种关系实际上并非线性，但你可以通过应用一些简单的数学变换使其变为线性；即便如此，你仍然可以使用线性回归建模。\n\
  \n线性回归建模是所有现实预测问题的解决方案吗？或者在某些情况下你需要应用不同的技术？让我们通过一个简单的例子来探讨这些问题。\n\n\n\n## 预测冰淇淋销售：示例\n\
  \n表 11-1 展示了一个包含冰淇淋店销售数据的表格快照。目前，你只记录了两个变量：顾客的年龄以及她是否购买冰淇淋。该数据集有一个名为 `buy_ind` 的指示变量，如果顾客购买冰淇淋，该变量取值为\
  \ 0，如果不购买，则取值为 1。你的任务是使用年龄作为自变量来预测冰淇淋销售情况（即 `buy_ind` 变量）。\n\n表 11-1. 冰淇淋销售数据\n\n\
  | 年龄 | buy_ind |\n| --- | --- |\n| 6 | 0 |\n| 25 | 0 |\n| 32 | 1 |\n| 44 | 1 |\n\
  | 34 | 1 |\n| 43 | 1 |\n| 72 | 1 |\n| 67 | 0 |\n| 58 | 1 |\n| ... | ... |\n| ...\
  \ | ... |\n| 58 | 1 |\n\n该数据集只有两个变量：`buy_ind` 和 `Age`。以下是用于导入数据并为响应变量构建简单线性回归线的\
  \ SAS 代码：\n\n```\n/* 导入冰淇淋销售数据 */\nPROC IMPORT OUT= WORK.ice_cream_sales\nDATAFILE=\
  \ \"C:\\Users\\VENKAT\\Google Drive\\Training\\Books\\Content\\8.\nLogistic Regression\\\
  Data Logistic Regression\\IceCream_sales.csv\"\nDBMS=CSV REPLACE;\nGETNAMES=YES;\n\
  DATAROW= 2;\nRUN;\n\n/* 拟合简单回归线以预测 buy_ind */\nproc reg data=ice_cream_sales;\n\
  model buy_ind=age;\nrun;\n```\n\n表 11-2 显示了上述代码的输出结果。\n\n表 11-2. 冰淇淋销售数据的 `PROC\
  \ REG` 输出\n\n| 读取的观测数 | 50 |\n| --- | --- |\n| 使用的观测数 | 50 |\n\n| 方差分析 |\n| 来源 |\
  \ 自由度 | 平方和 | 均方 | F 值 | Pr > F |\n| 模型 | 1 | 4.69353 | 4.69353 | 38.80 | <.0001\
  \ |\n| 误差 | 48 | 5.80647 | 0.12097 | | |\n| 修正合计 | 49 | 10.50000 | | | |\n\n| 均方根误差\
  \ | 0.34780 | R 方 | 0.4470 |\n| 因变量均值 | 0.70000 | 调整 R 方 | 0.4355 |\n| 变异系数 | 49.68641\
  \ | | |\n\n| 参数估计 |\n| 变量 | 自由度 | 参数估计 | 标准误差 | t 值 | Pr > &#124;t&#124; |\n| 截距\
  \ | 1 | 0.05851 | 0.11413 | 0.51 | 0.6105 |\n| 年龄 | 1 | 0.01489 | 0.00239 | 6.23\
  \ | <.0001 |\n\n以下是针对表 11-2 中输出的观察结果与推断：\n\n-   共有 50 个观测值用于构建此模型。\n-   F 检验的 P\
  \ 值小于 5%，这表明整体模型是显著的。\n-   R 方值偏低，表明模型拟合度不佳。换句话说，不能期望它做出令人满意的预测。\n-   `Age` 变量似乎对购买行为有显著影响。`Age`\
  \ 的 T 检验 P 值已表明了这一点。\n-   总之，你不能将此模型用于你的预测。其拟合度不佳。\n\n到目前为止，你已经学习了大量关于回归的知识，对冰淇淋销售数据进行模型拟合可能看起来是一项常规练习。你可以很容易地得出结论，该模型对数据的拟合度不佳。变量\
  \ `Age` 无法解释购买行为中的大部分变异，这意味着顾客是否购买冰淇淋并不能仅通过变量 `Age` 来估计。换句话说，仅仅知道顾客的具体年龄，你无法得出关于冰淇淋销售的任何信息。\n\
  \n再想想，当你仔细查看数据时，可以很容易地观察到其中的一个模式。你可以看到，当`顾客`年龄较小时，`buy_ind` 变量大多数时候为 0；当`顾客`年龄较大时，`buy_ind`\
  \ 大多数时候为 1。这表明年纪较大的人不购买冰淇淋。两个变量之间的散点图也印证了这一点（图 11-1）。\n\n![A978-1-4842-0043-8_11_Fig1_HTML.jpg](img/A978-1-4842-0043-8_11_Fig1_HTML.jpg)\n\
  \n图 11-1. 冰淇淋销售数据散点图\n\n图 11-1 显示，几乎所有 30 岁以下的顾客都购买了冰淇淋，而几乎所有 30 岁以上的顾客都没有购买。数据呈现某种明显的模式，但你却无法使用线性回归模型捕捉到它。也许线性回归线并不适合这些数据。请参见图\
  \ 11-2 和图 11-3。\n\n![A978-1-4842-0043-8_11_Fig2_HTML.jpg](img/A978-1-4842-0043-8_11_Fig2_HTML.jpg)\n\
  \n图 11-2. 直线并不适合冰淇淋销售数据\n\n![A978-1-4842-0043-8_11_Fig3_HTML.jpg](img/A978-1-4842-0043-8_11_Fig3_HTML.jpg)\n\
  \n图 11-3. 直线并不适合冰淇淋销售数据\n\n无论你应用何种优化技术，都无法得到一条能穿过数据核心的直线。如果你回顾一下第 9 章中的回归假设，你会意识到，当因变量（`buy_ind`）和自变量（`Age`）之间的关系不是线性时，你就不能应用线性回归模型。这里正是这种情况。\n\
  \n## 非线性回归\n\n如果 x 和 y 之间的关系是非线性的，并且无法通过数学变换将其转化为线性关系，那么你就需要拟合最佳适用的非线性曲线。任何非直线关系都被称为非线性。由于你无法为冰淇淋销售数据拟合线性回归线，让我们看看是否能拟合一条非线性曲线。图\
  \ 11-4 至图 11-8 是一些非线性表达式的示例。\n\n![A978-1-4842-0043-8_11_Fig4_HTML.jpg](img/A978-1-4842-0043-8_11_Fig4_HTML.jpg)\n\
  \n图 11-4. `Log(x)`\n\n![A978-1-4842-0043-8_11_Fig5_HTML.jpg](img/A978-1-4842-0043-8_11_Fig5_HTML.jpg)\n\
  \n图 11-5. 二次函数\n\n![A978-1-4842-0043-8_11_Fig6_HTML.jpg](img/A978-1-4842-0043-8_11_Fig6_HTML.jpg)\n\
  \n图 11-6. 指数函数\n\n![A978-1-4842-0043-8_11_Fig7_HTML.jpg](img/A978-1-4842-0043-8_11_Fig7_HTML.jpg)\n\
  \n图 11-7. 高斯函数\n\n![A978-1-4842-0043-8_11_Fig8_HTML.jpg](img/A978-1-4842-0043-8_11_Fig8_HTML.jpg)\n\
  \n图 11-8. Logit 函数\n\n在给出的所有非线性函数中，你可以看到逻辑曲线看起来非常适合这些数据，其中所有 Y 值要么为 0，要么为 1。逻辑曲线在\
  \ 0 和 1 附近有非常长的尾部，而除 0 和 1 之外的其他值则微乎其微。因此，对于只有两种结果（0 和 1）的数据类型，你可以选择逻辑回归。请注意，选择逻辑回归线背后的理论有些复杂，此处给出的逻辑仅为简化版本。\n\
  \n由于冰淇淋销售数据全部由 0 和 1 组成，让我们尝试拟合一条逻辑回归曲线。图 11-9 是该数据的一条假设的逻辑曲线。\n\n![A978-1-4842-0043-8_11_Fig9_HTML.jpg](img/A978-1-4842-0043-8_11_Fig9_HTML.jpg)\n\
  \n图 11-9. 穿过冰淇淋销售数据的一条假设的逻辑曲线\n\n线性回归有其直线方程。类似地，逻辑回归线也有其方程。由之前方程解释的逻辑函数，其值永远不会小于\
  \ 0，也永远不会大于 1。最大值是 1；当分子趋向于极大值时，分母也趋向于无穷大。例如，如果分子是 1,000,000，那么分母将为 1,000,001。在这种情况下，概率几乎为\
  \ 1。下限是 0；假设分子为 0.0000000001，分母为 1.0000000001，那么概率值几乎为 0。\n\n请注意，你并不是要预测 Y，而是要预测\
  \ Y=0 或 Y=1 的概率。由于 Y 仅取两个值，Y 本身几乎没有任何变异。因此，预测概率而非直接预测数值更有意义。\n\n\n\n## 逻辑回归\n\n\
  当你的响应变量只有两种结果时，逻辑回归可能是完美的选择。你在许多情况下都会遇到只有两种结果的情形，例如：回答问题时的是与否、游戏中的输与赢、客户销售中的买与不买、电话推销中的回应与无回应、网络分析中的点击与不点击、信用风险分析中的违约与不违约、调查分析中的满意与不满意等。使用线性回归无法预测这些分类结果，因为它需要数值型的因变量。\n\
  \n以下是上一节讨论的逻辑回归线方程，它适用于单个自变量。以下是适用于多个自变量的逻辑回归线方程：之前的方程可以用对数形式写成如下形式。`log odds probability`\
  \ 被称为对数几率概率。在这里，你试图拟合一条预测 Y 的对数几率而非其直接数值的直线。就像使用最小二乘法来拟合线性回归系数一样（请参阅第 9 章），如果你有一条逻辑回归线，将使用最大似然估计（MLE）方法来寻找贝塔系数。我们不会深入探讨\
  \ MLE 方法的细节，但你可以将其视为一种用于寻找逻辑回归线系数的优化技术。\n\n分析师必须首先通过观察因变量来判断逻辑回归的适用性，然后在 SAS 中应用逻辑回归过程，而不是通常的线性回归。你之前使用了\
  \ `PROC REG` 过程进行线性回归。为了在逻辑回归的情况下找出贝塔系数，你将使用 SAS 的 `PROC LOGISTIC` 过程。\n\n## 使用\
  \ SAS 进行逻辑回归\n\n你已发现线性回归并不适合拟合冰淇淋销售案例的回归线。你还发现逻辑回归线会是更好的拟合。现在，你将使用 SAS 创建一个逻辑回归模型。\n\
  \n以下是拟合所需逻辑回归线的 SAS 代码：\n\n```\nProc logistic data=ice_cream_sales;\nmodel buy_ind=age;\n\
  run;\n```\n\n以下是对代码的解释：\n\n*   `PROC LOGISTIC`：这会调用 SAS 中的逻辑回归线过程。\n*   `Data`：这指定了\
  \ `ice_cream_sales` 数据集。\n*   `Model`：这类似于线性回归线。等号左边是因变量，右边是自变量列表。多个自变量（如果有）之间用一个空格分隔。\n\
  \n上述代码试图对冰淇淋销售数据拟合一条逻辑回归线，这意味着你正在尝试估计逻辑回归方程中的贝塔系数，如下所示：此代码生成的输出如表 11-3 所示。\n\n**表\
  \ 11-3. 对冰淇淋销售数据执行 PROC LOGISTIC 的输出**\n\n| SAS 系统 |\n| --- |\n| LOGISTIC 过程 |\n\
  | 模型信息 |\n| 数据集 | WORK.ICE_CREAM_SALES |\n| 响应变量 | buy_ind |\n| 响应水平数 | 2 |\n| 模型\
  \ | 二元 logit |\n| 优化技术 | Fisher 得分法 |\n\n| 读取的观测数 | 50 |\n| 使用的观测数 | 50 |\n\n| 响应概况\
  \ |\n| 排序值 | buy_ind | 总频数 |\n| 1 | 0 | 15 |\n| 2 | 1 | 35 |\n| 建模的概率为 buy_ind=‘0’。\
  \ |\n\n| 模型收敛状态 |\n| 收敛准则（GCONV=1E-8）满足。 |\n\n| 模型拟合统计量 |\n| 准则 | 仅截距 | 截距和协变量 |\n\
  | AIC | 63.086 | 36.114 |\n| SC | 64.998 | 39.938 |\n| -2 对数似然 | 61.086 | 32.114\
  \ |\n\n| 全局零假设检验：BETA=0 |\n| 检验 | 卡方 | 自由度 | Pr > 卡方 |\n| 似然比 | 28.9720 | 1 | <.0001\
  \ |\n| 得分 | 22.3501 | 1 | <.0001 |\n| Wald | 10.8989 | 1 | 0.0010 |\n\n| 最大似然估计分析\
  \ |\n| 参数 | 自由度 | 估计值 | 标准误差 | Wald 卡方 | Pr > 卡方 |\n| 截距 | 1 | 3.8982 | 1.3446 |\
  \ 8.4044 | 0.0037 |\n| 年龄 | 1 | -0.1353 | 0.0410 | 10.8989 | 0.0010 |\n\n| 优势比估计\
  \ |\n| 效应 | 点估计 | 95% Wald 置信限 |\n| 年龄 | 0.873 | 0.806 | 0.947 |\n\n| 预测概率与观测响应的关联性\
  \ |\n| 一致百分比 | 92.0 | Somers’ D | 0.851 |\n| 不一致百分比 | 6.9 | Gamma | 0.861 |\n| 结百分比\
  \ | 1.1 | Tau-a | 0.365 |\n| 对子数 | 525 | C | 0.926 |\n\n### SAS 逻辑回归输出解释\n\n该输出包含若干度量指标和表格。以下各节将进行解释。\n\
  \n#### 输出第 1 部分：响应变量摘要\n\n表 11-4 展示了 LOGISTIC 过程。\n\n**表 11-4. 模型信息，PROC LOGISTIC\
  \ 的输出**\n\n| 模型信息 |\n| --- |\n| 数据集 | WORK.ICE_CREAM_SALES |\n| 响应变量 | buy_ind |\n\
  | 响应水平数 | 2 |\n| 模型 | 二元 logit |\n| 优化技术 | Fisher 得分法 |\n\n以下是对表 11-4 的解释：\n\n*\
  \   数据集：这是数据来源。\n*   响应变量：这是因变量或 Y 变量，在此示例中是购买指标。\n*   响应水平数：这是因变量的水平数量（通常为是/否）；在此示例中为\
  \ 1 或 0。\n*   模型：这是二元逻辑回归；等同于二元 logit。\n*   优化技术：使用哪种优化技术来寻找回归系数？SAS 会选择最合适的技术。\n\
  \n现在考虑表 11-5 中输出的更多表格。\n\n**表 11-5. PROC LOGISTIC 的输出表格**\n\n| 读取的观测数 | 50 |\n|\
  \ --- | --- |\n| 使用的观测数 | 50 |\n\n| 响应概况 |\n| 排序值 | buy_ind | 总频数 |\n| 1 | 0 | 15\
  \ |\n| 2 | 1 | 35 |\n| 建模的概率为 buy_ind=‘0’。 |\n\n以下是对表 11-5 的解释：\n\n*   读取的观测数：这是从数据集中读取的观测计数。\n\
  *   使用的观测数：这是用于创建模型的观测数量。数据中没有缺失值或默认值。如果有缺失值，SAS 将单独给出这些缺失值的计数。\n*   响应概况排序值：这是\
  \ SAS 对你提供的值进行排序的方式。它将 0 类别视为第一水平，将 1 类别视为第二水平。\n*   建模的概率为 `buy_ind=‘0’`：逻辑回归最终会给出\
  \ Y 的概率，Y 可以取 0 或 1。在此输出中，SAS 告知你模型是为 0 构建的；换句话说，输出的概率将针对 Y 为 0 的情况给出。默认情况下，SAS\
  \ 为较小的值构建模型。当你只有两个水平时，关系不大。如果 0 的概率是 65%，那么 1 的概率显然将是 35%。你可以使用 `descending` 选项（请参阅本章后面的案例研究，其中使用了带有此选项的\
  \ SAS 代码）来直接为较高顺序的值建模。根据输出，在冰淇淋销售示例中，模型是为 Y 为 0 的概率构建的，这意味着做出了购买决定。\n*   总频数：这是因变量中每个类别的频数。\n\
  \n\n\n#### 输出第 2 部分：模型拟合摘要\n\n在输出第 2 部分中，我们讨论模型的收敛状态和模型拟合统计量。请参考表 11-6。\n\n**表 11-6.**\
