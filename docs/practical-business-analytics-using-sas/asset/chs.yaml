  \ 的标准差相对较低（实际上为零）。\n\n### 医疗索赔示例\n\n假设一家医疗保险公司收集了一段时间内的索赔数据。以下是变量：\n\n*   `Patient_id`：患者\
  \ ID\n*   `Patient_Age`：患者年龄\n*   `Days_admitted_hosp`：住院天数\n*   `Num_medical_bills_submitted`：提交的医疗账单数量\n\
  *   `Claim_amount`：索赔金额\n\n以下是对 `Claim_amount` 进行集中趋势和离散度分析的 SAS 代码。输出结果请参考表 6-23。\n\
  \n```\nProc means data= health_claim  ;\nvar Claim_amount;\nrun;\n```\n\n**表 6-23.**\
  \ `proc means` 对 `health_claim` 数据集的输出结果\n\n| 分析变量 : Claim_amount |\n| --- |\n|\
  \ N | 均值 | 标准差 | 最小值 | 最大值 |\n| 50000 | 1537.48 | 3287.49 | 0 | 256058.00 |\n\n\
  平均索赔金额为 1,537 美元。最大索赔金额为 256,058 美元。索赔金额的标准差为 3,287.5 美元。\n\n以下是计算均值和单位数的代码：\n\n\
  ```\nProc means data= health_claim  meanmedian;\nvar  Claim_amount;\nrun;\n```\n\
  \n关于此代码的输出，请参考表 6-24。\n\n**表 6-24.** `claim_amount` 数据集的均值和单位数\n\n| 分析变量 : Claim_amount\
  \ |\n| --- |\n| 均值 | 单位数 |\n| 1537.48 | 438.00 |\n\n确实存在一些异常值。均值与单位数相差甚远。第 7 章将讨论如何处理异常值。\n\
  \n本章至此讨论了一些能够提供变量整体概况的度量指标。均值表示平均值，而方差和标准差表示离散度。还有一些额外的度量指标，例如分位数，有助于你全面理解变量。分位数能帮助你更好地理解变量的分布情况。在\
  \ SAS 中，你可以使用单变量分析获取分位数和箱线图，这些内容将在以下章节中介绍。\n\n\n\n## 分位数\n\n分位数即等分数据后的各个部分。分位数的例子包括百分位数、四分位数和十分位数，本节将讨论这些概念。百分位数是将变量值分成\
  \ 100 等份后的结果。\n\n例如，考虑 20 名学生的分数，按升序排列（表 6-25）。\n\n**表 6-25.** 20 名学生的分数\n\n| S1\
  \ | S2 | S3 | S4 | S5 | S6 | S7 | S8 | S9 | S10 | S11 | S12 | S13 | S14 | S15 |\
  \ S16 | S17 | S18 | S19 | S20 |\n| --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 37\
  \ | 58 | 40 | 55 | 67 | 75 | 35 | 40 | 56 | 37 | 60 | 52 | 57 | 66 | 43 | 74 | 75\
  \ | 63 | 72 | 54 |\n\n此处，中位数为 56.5，接近平均值的学生是 S9。这意味着 S9 几乎位于总体数据的 50%标记处（表 6-26）。\n\
  \n**表 6-26.** 总体的中位数\n\n| S7 | S1 | S10 | S3 | S8 | S15 | S12 | S20 | S4 | S9 |\
  \ S13 | S2 | S11 | S18 | S14 | S5 | S19 | S16 | S6 | S17 |\n| --- | --- | --- |\
  \ --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\
  \ --- | --- | --- | --- |\n| 35 | 37 | 37 | 40 | 40 | 43 | 52 | 54 | 55 | 56 | 57\
  \ | 58 | 60 | 63 | 66 | 67 | 72 | 74 | 75 | 75 |\n\n- 哪个学生在 100%的位置？请记住，这里相关的是 100%位置上的值，而不是\
  \ 100 分。整个变量被分成 100 份，每一份称为一个百分位数。现在，参考表 6-27 和表 6-28 以及下面的列表，来更好地理解百分位数，以及另外两个术语：十分位数和四分位数。\n\
  - 第 100 个百分位数的值是多少？它是不是最大值，即 75？\n- 第 50 个百分位数的值是多少？它是不是中位数值 56？这意味着 50%的个案小于 56，其余\
  \ 50%大于 56。\n- 第 10 个百分位数的值是多少？由于这里有 20 个数据点，每个数据点占总体的 5%，所以第 10 个百分位数对应第二个值，即 37。这意味着\
  \ 10%的个案小于 37，其余 90%大于 37。\n- 第 70 个百分位数是第 14 个值，即 63。这意味着 70%的个案小于 63，其余 30%大于\
  \ 63。\n\n**表 6-27.** 总体中不同的百分位数值\n\n| S7 | S1 | S10 | S3 | S8 | S15 | S12 | S20\
  \ | S4 | S9 | S13 | S2 | S11 | S18 | S14 | S5 | S19 | S16 | S6 | S17 |\n| --- |\
  \ --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\
  \ --- | --- | --- | --- | --- | --- |\n| 35 | 37 | 37 | 40 | 40 | 43 | 52 | 54 |\
  \ 55 | 56 | 57 | 58 | 60 | 63 | 66 | 67 | 72 | 74 | 75 | 75 |\n\n- 一个十分位数是变量的 1/10。在本例中，第一个十分位数等于第\
  \ 10 个百分位数（37），第二个十分位数等于第 20 个百分位数（40）。\n- 一个四分位数是变量的 1/4。在本例中，第一个四分位数等于第 25 个百分位数（40）。第二个四分位数等于第\
  \ 50 个百分位数，也就是中位数，它也等于第 5 个十分位数（56）。第三个四分位数等于第 75 个百分位数（66）。\n\n**表 6-28.** 总体中不同的四分位数值\n\
  \n| S7 | S1 | S10 | S3 | S8 | S15 | S12 | S20 | S4 | S9 | S13 | S2 | S11 | S18 |\
  \ S14 | S5 | S19 | S16 | S6 | S17 |\n| --- | --- | --- | --- | --- | --- | --- |\
  \ --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n\
  | 35 | 37 | 37 | 40 | 40 | 43 | 52 | 54 | 55 | 56 | 57 | 58 | 60 | 63 | 66 | 67\
  \ | 72 | 74 | 75 | 75 |\n\n第一个和第三个四分位数也分别被称为下四分位数和上四分位数。下四分位数和上四分位数之间的差值称为四分位距（表\
  \ 6-29）。它给出了中间 50%数值的分布范围。\n\n![A978-1-4842-0043-8_6_Figa_HTML.jpg](img/A978-1-4842-0043-8_6_Figa_HTML.jpg)\n\
  \n**表 6-29.** 四分位距\n\n| S7 | S1 | S10 | S3 | S8 | S15 | S12 | S20 | S4 | S9 | S13\
  \ | S2 | S11 | S18 | S14 | S5 | S19 | S16 | S6 | S17 |\n| --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- | --- |\n| 35 | 37 | 37 | 40 | 40 | 43 | 52 | 54 | 55 | 56 | 57 |\
  \ 58 | 60 | 63 | 66 | 67 | 72 | 74 | 75 | 75 |\n\n四分位距 = 66 – 40 = 26\n\n这个四分位距在识别异常值方面是一个有用的度量。在表\
  \ 6-29 的例子中，总体数据范围是 75 – 35 = 40，而四分位距，即中间 50%的范围，是 26，这看起来很合理。现在考虑表 6-30 中给出的例子。\n\
  \n**表 6-30.** 四分位距的另一个例子\n\n| S7 | S1 | S10 | S3 | S8 | S15 | S12 | S20 | S4 | S9\
  \ | S13 | S2 | S11 | S18 | S14 | S5 | S19 | S16 | S6 | S17 |\n| --- | --- | ---\
