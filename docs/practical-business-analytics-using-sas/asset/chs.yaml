  \ |\n| LAVA | 4 | 2100.00 |\n| LG | 361 | 13164.46 |\n| Lava | 25 | 1289.12 |\n\
  | Lemon | 1 | 999.00 |\n| MICROMAX | 19 | 4950.00 |\n| MOTOROLA | 19 | 22368.00\
  \ |\n| Micromax | 579 | 3550.90 |\n| Motorola | 259 | 13035.01 |\n| Nikon | 23 |\
  \ 9319.78 |\n| Nokia | 683 | 9919.18 |\n| Olympus | 4 | 4399.00 |\n| Samsung | 956\
  \ | 13313.62 |\n| Sony | 355 | 17242.56 |\n| Sony Eric | 62 | 16899.82 |\n| Soyer\
  \ | 7 | 1050.00 |\n| Spice | 80 | 3967.20 |\n| Videocon | 13 | 2840.92 |\n| Xolo\
  \ | 6 | 17937.50 |\n| Zen | 4 | 1999.00 |\n\n表 6-10 的输出显示了每个品牌的平均价格。我们将重点关注订单数超过\
  \ 30 个（>30）的品牌。整体平均标价为 11,598 美元。苹果的标价远高于此，而 Micromax 的平均标价则远低于整体平均水平。\n\n此代码帮助计算中位数：\n\
  \n```\nProc means data=online_sales median;\nvar listPrice;\nrun;\n```\n\n该代码的输出结果见表\
  \ 6-12。\n\n表 6-12. `listPrice`的中位数\n\n| 分析变量：listPrice |\n| --- |\n| 中位数 |\n| 8399.00\
  \ |\n\n中位数远低于均值，这表明存在一些高端的异常值。数据显示，此例中的异常值是苹果和黑莓的标价。\n\n以下是计算众数的代码：\n\n```\nProc\
  \ means data=online_sales mode;\nvar listPrice;\nrun;\n```\n\n该代码的输出结果见表 6-13。\n\
  \n表 6-13. `listPrice`的众数\n\n| 分析变量：listPrice |\n| --- |\n| 众数 |\n| 990.00 |\n\n\
  连续变量的众数值可能意义不大。让我们使用以下代码查找`shippingPeriod`（运输周期）的众数：\n\n```\nProc means data=online_sales\
  \ mode;\nvar shippingPeriod;\nrun;\n```\n\n该代码的输出结果见表 6-14。\n\n表 6-14. `shippingPeriod`的众数\n\
  \n| 分析变量：shippingPeriod |\n| --- |\n| 众数 |\n| 5 |\n\n大多数物品的运输周期是 5。这仅仅是出现最频繁的值。运输周期为\
  \ 5 天听起来比 4.98 天（均值）更合理。请看以下代码：\n\n```\nProc means data=online_sales mean;\nvar\
  \ shippingPeriod;\nrun;\n```\n\n该代码的输出结果见表 6-15。\n\n表 6-15. `shippingPeriod`的均值\n\
  \n| 分析变量：shippingPeriod |\n| --- |\n| 均值 |\n| 4.98 |\n\n之前示例讨论了不同变量的集中趋势。集中趋势给出了代表该变量的唯一数值。但问题仍然存在：仅凭此是否足够，还是需要其他度量来更好地理解该变量？\n\
  \n**安德森想过河**\n\n不会游泳的安德森先生想穿过一条小河。他询问邻居河的深度，邻居说平均深度是 4 英尺。安德森先生很高兴，开始过河。但他的高兴并未持续多久。原因在于，尽管平均深度是\
  \ 4 英尺，但有些地方的深度可能达到了 7 英尺，超过了安德森先生的身高。如果他当初询问了与平均深度的偏差、各点深度的不一致性，或者至少是河流深度的范围（除了平均深度之外），就不会差点溺水了。\n\
  \n因此，在所有情况下，仅了解平均值或中心值可能并不足够。偏离中心（或离散程度）或变量的分布范围也同样重要。接下来介绍几种离散程度的度量方法。\n\n\n\n\
  ### 什么是离散程度？\n\n离散程度是指数据的变异性——即变量值中的异常或不一致性。离散程度的度量并不反映数据的中间值，而是体现了数据的分布广度。\n\n\
  接下来，我们将讨论几种量化离散程度的度量方法。\n\n#### 极差\n\n`范围`是一种基础度量，用于解释数据中的离散程度或分布广度。`范围`的计算很简单：它是指变量最大值与最小值之间的差值。\n\
  \n`范围 = 最大值 – 最小值`\n\n在处理小数据集且需要快速估算范围时，`范围`是一种很好的离散度量方法。在引用范围时，最好同时给出最大值和最小值。\n\
  \n例如，你想寻找一款具备特定功能的智能手机。有九个品牌生产此类手机。表 6-16 列出了它们的售价。\n\n表 6-16. 智能手机品牌与价格\n\n| 编号\
  \ | 品牌-1 | 品牌-2 | 品牌-3 | 品牌-4 | 品牌-5 | 品牌-6 | 品牌-7 | 品牌-8 | 品牌-9 |\n| --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- |\n| 价格 | $4,700 | $4,800 | $8,900\
  \ | $6,000 | $2,900 | $7,400 | $3,300 | $7,800 | $3,900 |\n\n最高价为 $8,900，最低价为 $2,900；该价格变量的范围为\
  \ $8,900 – $2,900 = $6,000。\n\n尽管`范围`对于小样本来说是一种很好的度量，但需要一种更强大、更可靠的度量方法来量化数据中的实际离散程度。一种能考虑每条记录中分布情况（而非整体范围）的更细粒度的度量将满足这一需求。`方差`就是这样一种度量。\n\
  \n#### 方差\n\n数据中的整体分布需要被量化。例如，考虑一家初创公司的股票收盘价（单位：美元）（表 6-17、图 6-3 和图 6-4）。\n\n表 6-17.\
  \ 一家初创公司的股票价格\n\n| 日期 | 股票价格 |\n| --- | --- |\n| 1 | 66 |\n| 2 | 55 |\n| 3 | 60\
  \ |\n| 4 | 60 |\n| 5 | 77 |\n| 6 | 70 |\n| 7 | 79 |\n| 8 | 82 |\n| 9 | 77 |\n| 10\
  \ | 72 |\n| 11 | 75 |\n| 12 | 67 |\n| 均值 | 70 |\n\n![A978-1-4842-0043-8_6_Fig4_HTML.jpg](img/A978-1-4842-0043-8_6_Fig4_HTML.jpg)\n\
  \n图 6-4. 相对于均值的偏差；一家初创公司的股票价格\n\n![A978-1-4842-0043-8_6_Fig3_HTML.jpg](img/A978-1-4842-0043-8_6_Fig3_HTML.jpg)\n\
  \n图 6-3. 一家初创公司的股票价格（表 6-17）\n\n平均股价约为 $70。日期 1 与平均值的偏差为 4，日期 2 的偏差为 15。每个点相对于均值的这种偏差是离散程度的一个良好指标。有趣的是，所有这些偏差的总和始终为零。这一推论显而易见，因为均值位于中心，其他值分布在均值线的上下两侧。\n\
  \n平方偏差是次优选择。所有点的平方偏差平均值称为 `方差`，它能完美地量化离散程度。变量离散程度越小，意味着该变量在每个点上的取值几乎相同。这相当于偏差接近于零。平方偏差也将接近于零，因此可以得出结论：方差非常低。该特定股票过去\
  \ 12 天的方差为 67（表 6-18）。\n\n表 6-18. 股票价格的平方偏差\n\n| 日期 | 股票价格 | 均值 | 偏差 | 平方偏差 |\n\
  | --- | --- | --- | --- | --- |\n| 1 | 66 | 70 | -4 | 16 |\n| 2 | 55 | 70 | -15\
  \ | 225 |\n| 3 | 60 | 70 | -10 | 100 |\n| 4 | 60 | 70 | -10 | 100 |\n| 5 | 77 |\
  \ 70 | 7 | 49 |\n| 6 | 70 | 70 | 0 | 0 |\n| 7 | 79 | 70 | 9 | 81 |\n| 8 | 82 | 70\
  \ | 12 | 144 |\n| 9 | 77 | 70 | 7 | 49 |\n| 10 | 72 | 70 | 2 | 4 |\n| 11 | 75 |\
  \ 70 | 5 | 25 |\n| 12 | 67 | 70 | -3 | 9 |\n| 均值 | 70 | | 0 | 67 |\n\n`方差` 是相对于均值的平方偏差的平均值。这种相对于均值的平均平方偏差是最广泛使用的离散程度度量。在计算方差时，我们考虑了每个点\
  \ `xi`，这就是它成为有效离散程度度量的原因。\n\n在此公式中，\n\n- `N` 是观测总数。\n- `xi` 是 `x` 的第 i 个值。\n- `μ`\
  \ 是变量 `x` 的均值。\n\n同样，另一支股票（表 6-19）的每日值方差为 413。\n\n表 6-19. 一家初创公司的股票价格，另一个示例\n\n\
  | 日期 | 股票价格 | 平均值 | 偏差 | 平方偏差 |\n| --- | --- | --- | --- | --- |\n| 1 | 32 | 41\
  \ | -9 | 81 |\n| 2 | 28 | 41 | -13 | 169 |\n| 3 | 75 | 41 | 34 | 1156 |\n| 4 | 22\
  \ | 41 | -19 | 361 |\n| 5 | 41 | 41 | 0 | 0 |\n| 6 | 75 | 41 | 34 | 1156 |\n| 7\
  \ | 63 | 41 | 22 | 484 |\n| 8 | 25 | 41 | -16 | 256 |\n| 9 | 59 | 41 | 18 | 324\
  \ |\n| 10 | 19 | 41 | -22 | 484 |\n| 11 | 21 | 41 | -20 | 400 |\n| 12 | 32 | 41\
  \ | -9 | 81 |\n| 均值 | 41 | | 0 | 413 |\n\n注意\n\n尽管 `方差` 是量化离散程度的一种良好度量，但在将度量单位应用于计算出的数值时会面临挑战。\n\
  \n在表 6-18 的示例中，方差是 67。它是 67 平方美元吗？商人能理解吗？其他一些变量，如客户数量（平方客户）、年龄（年平方）等，也没有意义。在计算方差之后，必须将它们还原为原始的单位形式。由于方差是平均平方偏差，该值的平方根将与原始变量具有相同的单位。这被称为\
  \ `标准差`。\n\n#### 标准差\n\n`标准差` 是方差的平方根，由以下公式表示：`σ = √(Variance)`。这种度量也有助于比较，因为其单位与原始变量单位相同。股票价格示例中的标准差是\
  \ `√(67) = 8.2`。这意味着在平均股价 $70 的基础上存在 $8.2 的偏差。\n\n\n\n### 使用 SAS 计算离散度\n\nSAS 提供了便捷的过程来计算离散度的度量值。我们通过一些示例来帮助你理解。以下是计算标价方差的代码：\n\
  \n```\nProc means data=online_sales var;\nvar listPrice;\nrun;\n```\n\n关于此代码给出的方差，请参考表\
  \ 6-20。\n\n**表 6-20.** `online_sales` 的方差\n\n| 分析变量 : listPrice |\n| --- |\n| Variance\
  \ |\n| 112006391 |\n\n以下代码计算变量 `listPrice` 的标准差：\n\n```\nProc means data=online_sales\
  \ std ;\nvar listPrice;\nrun;\n```\n\n关于此代码给出的方差，请参考表 6-21。\n\n**表 6-21.** `online_sales`\
  \ 的方差\n\n| 分析变量: listPrice |\n| --- |\n| StdDev |\n| 10583.31 |\n\n仅通过观察方差无法判断其高低。只有当与原始变量单位进行比较时，方差的大小才有意义。例如，如果平均变量值达到数百万，那么\
  \ 1,000 的方差可能微不足道。以下代码计算每个品牌 `listPrice` 的标准差：\n\n```\n/* SD in list price for each\
  \ brand */\nProc means data=online_sales std ;\nvar listPrice;\nclass brand;\nrun;\n\
  ```\n\n关于此代码的输出，请参考表 6-22。\n\n**表 6-22.** `proc means` 对 `online_sales` 数据集的输出结果（按品牌计算的标准差）\n\
  \n| 分析变量 : listPrice |\n| --- |\n| 品牌 | N 个观测值 | StdDev |\n| Acer | 1 | . |\n| AirTyme\
  \ | 90 | 0 |\n| Airtyme | 89 | 133.04 |\n| Apple | 146 | 7290.86 |\n| Arise | 161\
  \ | 493.21 |\n| BlackBerr | 201 | 10270.17 |\n| Blackberr | 18 | 6220.25 |\n| Canon\
