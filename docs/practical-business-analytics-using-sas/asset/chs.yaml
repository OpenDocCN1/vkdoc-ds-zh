  \n图 12-50. 来自 web_views 序列 PROC ARIMA 输出的 ACF、PACF 和 IACF 图\n\n从表 12-17 中，你可以判断该过程是平稳的。ACF\
  \ 递减到零，因此该过程是一个 AR 过程。PACF 在滞后 1 阶处截尾。仔细观察 PACF 图可以发现，滞后 2 阶不显著。因此，独立访客时间序列是一个 AR(1)\
  \ 过程。该时间序列的框架方程如下：\n\n`Y[t]= a[1]*Y[t-1]+ ε[t-1]`\n\n如果你能估计出 `a[1]` 的值，那么你就可以使用该模型来预测下一周的独立访客数量，这也是最终目标。\n\
  \n\n\n#### 第三步：估计参数\n\n至此，你已得到模型方程。你也已将时间序列识别为 AR(p)、MA(q) 或 ARMA(p,q)。现在你需要找到模型参数。这个模型方程与第\
  \ 10 章中关于多元线性回归讨论的回归模型类似。简要回顾一下，请参考以下的方程类比。\n\n回归方程：`y = b0 + b1x1 + b2x2 + b3x3\
  \ + b4x4 + b5x5 + b6x6 . . . . . . . . + bpxp`\n\n时间序列方程：`Y[t] = a[1]*Y[t-1] + a[2]*Y[t-2]\
  \ + a[3]*Y[t-3] + . . . . .+ a[p]*Y[t-p] + ε[t] + b[1]*ε[t-1]+ b[2]*ε[t-2]. . .\
  \ . . . . .+ b[q]*ε[t-q]`\n\n如同寻找回归系数的方式，现在你需要使用某种优化技术来找到时间序列方程的参数。你可以使用最大似然估计技术来猜测模型参数。这一步相对容易。你只需在\
  \ SAS 代码中使用`estimate`选项。你需要通过指定阶数来明确模型方程。\n\n以下是用于估计参数的代码：\n\n```\nproc arima data=web_views;\n\
  identify var=Visitors ;\nestimate p=1 q=0 method=ML;\nrun;\n```\n\n之前你已经得出结论：独立访客时间序列是一个\
  \ AR(1) 过程。因此，`p=1`且`q=0`。`method=ML`选项表示最大似然方法。\n\n表 12-18 是这段代码生成的最大似然表。\n\n**表\
  \ 12-18.** `PROC ARIMA` 对 `web_views` 序列的输出：估计参数\n\n| 最大似然估计 |\n| --- |\n| 参数 |\
  \ 估计值 | 标准误差 | t 值 | 近似 Pr > &#124;t&#124; | 滞后 |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| MU | 8942.4 | 152.37003 | 58.69 | <.0001 | 0 |\n| AR1,1 | 0.68773 |\
  \ 0.03945 | 17.43 | <.0001 | 1 |\n\n`MU` 是截距，即序列的均值。`AR(1,1)` 的估计值（即 `a[1]`）为 0.68773。现在你可以写出更完整的模型方程，如下所示：\n\
  \n`Y[t] = (0.68773)*Y[t-1] + ε[t]`\n\n你可以用这个方程预测未来值。除了参数估计，SAS 还会生成详细的输出。以下是一些关于如何解读输出中不常见但重要的表格的注释。请参考表\
  \ 12-19。\n\n**表 12-19.** `PROC ARIMA` 对 `web_views` 序列的重要输出表：估计参数\n\n| 常数估计值 | 2792.49\
  \ |\n| 方差估计值 | 781147.7 |\n| 标准误差估计值 | 883.8256 |\n| AIC | 5580.809 |\n| SBC | 5588.467\
  \ |\n| 残差数量 | 340 |\n\nAIC 和 SBC 值能帮助你比较两个模型。通常倾向于选择 AIC 和 SBC 值较低的模型。较低的 Akaike\
  \ 信息准则（AIC）和 Schwarz 贝叶斯准则（SBC）值表明，使用当前估计值的模型是数据的正确拟合。这在尝试处理不同阶数时很有帮助，比如在 AR(1)、AR(2)\
  \ 或 ARMA(1,1) 等之间进行选择。请参考表 12-20 和图 12-51。图 12-51 之后提供了说明。\n\n![A978-1-4842-0043-8_12_Fig51_HTML.jpg](img/A978-1-4842-0043-8_12_Fig51_HTML.jpg)\n\
  \n**图 12-51.** 残差自相关检查，`PROC ARIMA` 对 `web_views` 序列的输出表；估计参数\n\n**表 12-20.** 残差的自相关检查，`PROC\
  \ ARIMA` 对 `web_views` 序列的输出表：估计参数\n\n| 残差的自相关检查 |\n| --- |\n| 至滞后阶 | 卡方 | 自由度 |\
  \ Pr > ChiSq | 自相关 |\n| --- | --- | --- | --- | --- |\n| 6 | 9.97 | 5 | 0.0761 |\
  \ -0.088 | 0.094 | 0.019 | 0.070 | -0.075 | 0.038 |\n| 12 | 12.67 | 11 | 0.3153\
  \ | 0.063 | -0.002 | 0.004 | -0.015 | 0.004 | -0.059 |\n| 18 | 17.03 | 17 | 0.4521\
  \ | 0.063 | -0.069 | 0.035 | 0.016 | 0.041 | 0.018 |\n| 24 | 24.50 | 23 | 0.3765\
  \ | 0.103 | -0.015 | 0.037 | -0.069 | 0.032 | -0.051 |\n| 30 | 28.42 | 29 | 0.4954\
  \ | 0.044 | 0.078 | -0.045 | -0.022 | 0.007 | 0.001 |\n| 36 | 34.61 | 35 | 0.4869\
  \ | 0.026 | 0.051 | 0.110 | 0.002 | -0.031 | 0.008 |\n| 42 | 40.64 | 41 | 0.4865\
  \ | 0.056 | -0.075 | -0.003 | 0.061 | -0.015 | 0.053 |\n| 48 | 50.06 | 47 | 0.3529\
  \ | -0.062 | 0.131 | 0.029 | 0.040 | -0.018 | 0.016 |\n\n残差自相关检查有助于你识别在构建模型后数据中是否还留有信息。模型应该足够好，能够提取数据中所有隐藏的模式。如果仍有一些趋势残留，那么你会在残差图中观察到它们。这些残差图显示在\
  \ ACF、PACF 和 IACF 中没有趋势。你还会观察到白噪声概率（图 12-51，右下角）可以忽略不计。\n\n例如，如果你尝试错误地拟合模型——换句话说，本应是\
  \ AR(1) 模型，你却尝试拟合了 ARMA(0,0) 模型——那么残差图会显示出趋势（图 12-52）。为了更好地理解，你可以将以下代码与之前的代码进行比较。除了\
  \ `p` 和 `q` 的值外，两者完全相同。\n\n```\nproc arima data=web_views;\nidentify var=Visitors\
  \ ;\nestimate p=0 q=0 method=ML;\nrun;\n```\n\n![A978-1-4842-0043-8_12_Fig52_HTML.jpg](img/A978-1-4842-0043-8_12_Fig52_HTML.jpg)\n\
  \n**图 12-52.** 残差自相关检查，选择错误模型\n\n你无法通过 AR(0,0) 模型提取所有信息。你会在残差的 ACF 图中看到一个趋势。白噪声概率也显著偏高。这表明模型中仍然残留了一些信息。这些残差信息需要被提取出来。\n\
  \n一旦完成模型参数的估计，剩下的就只有预测了。这是模型构建的最后一步。\n\n\n\n#### 第 4 步：利用模型进行预测\n\n到目前为止，你已经付出了大量努力来确定模型类型、估计参数并创建最终的模型方程。一旦你得到了最终方程，剩下的工作就是将历史值代入以获得预测值。像往常一样，SAS\
  \ 为你提供了帮助。你只需在代码中使用 `forecast` 选项即可。\n\n```sas\nproc arima data=web_views;\nidentify\
  \ var=Visitors;\nestimate p=1 q=0 method=ml;\nforecast lead=7;\nrun;\n```\n\n`lead=7`\
  \ 表示接下来的七个预测值，在本例中，这些值是指未来七天内可能访问的唯一访客数量。此代码还会向输出结果中追加两个新组件（预测表和预测图）。表 12-21 是预测表，图\
  \ 12-53 绘制了来自 SAS 输出的预测图。\n\n![A978-1-4842-0043-8_12_Fig53_HTML.jpg](img/A978-1-4842-0043-8_12_Fig53_HTML.jpg)\n\
  \n**图 12-53.** 访客的预测结果，SAS 输出\n\n**表 12-21.** 变量 Visitors 的未来七天预测，SAS 输出\n\n| 变量\
  \ Visitors 的预测值 | | | |\n| --- | --- | --- | --- |\n| 观测值 | 预测值 | 标准误差 | 95% 置信限\
  \ |\n| --- | --- | --- | --- |\n| 341 | 8139.5548 | 883.8256 | 6407.2885 | 9871.8211\
  \ |\n| 342 | 8390.2684 | 1072.6622 | 6287.8892 | 10492.6476 |\n| 343 | 8562.6905\
  \ | 1151.2361 | 6306.3092 | 10819.0718 |\n| 344 | 8681.2696 | 1186.5879 | 6355.6000\
  \ | 11006.9391 |\n| 345 | 8762.8194 | 1202.9463 | 6405.0880 | 11120.5508 |\n| 346\
  \ | 8818.9033 | 1210.6063 | 6446.1586 | 11191.6480 |\n| 347 | 8857.4736 | 1214.2123\
  \ | 6477.6612 | 11237.2861 |\n\n数据截止到观测值 340。从 341 到 347 的值是预测值，并附有 95% 的置信限一起显示。预计网站访客数量将稳步增长。如果看到急剧下降，则可以将其作为警报信号。如果预测值出现大幅增长，则可能需要加强网站的基础设施，包括服务器数量、网络带宽等。此外，还需要确保没有技术故障。在当前情况下，一切似乎都正常；预测的访客流量呈现可控的、稳定的增长。\n\
  \n至此，使用 Box-Jenkins ARIMA 方法进行时间序列分析和预测的流程就逻辑结束了。每位分析师都希望通过为现有的历史数据构建最佳模型来准确预测未来值。使用\
  \ Box-Jenkins 方法绝对可以实现这一目标。以下是构建时间序列模型时的一些建议：\n\n-   拥有足够的历史数据，至少 30 个数据点。确保不要涉及过多历史数据。只应考虑会对未来预测产生影响的历史值。\n\
  -   不要预测太远的未来。用一年的数据预测未来两年不是一个好主意。建议预测的未来数据点不要超过历史数据点的 10%。\n-   在构建模型之前移除异常值。\n\
  \n### 案例研究：使用 SAS 示例进行时间序列预测\n\nAir Voice 是一家拥有超过 7000 万客户的移动网络公司。该公司的客户服务中心每天处理数百万通电话。公司希望通过在约定的服务水平协议（SLA）内解决大部分客户查询来提高客户满意度。这可以通过每周预测呼叫次数来进行更好的资源规划来实现。以下是一个典型的呼叫量预测练习。\n\
  \n提供了过去 300 天的每日呼叫量数据。该数量以千为单位。以下是分析和预测未来呼叫量数值的步骤。\n\n#### 第 1 步：测试平稳性\n\n以下是用于测试平稳性的\
  \ SAS 代码。前面的章节已经对此进行了解释。请参考表 12-22 查看与此任务相关的 SAS 输出。\n\n```sas\nproc arima data=call_volume;\n\
  identify var=call_volume stationarity=(DICKEY);\nrun;\n```\n\n**表 12-22.** 测试 call_volume\
  \ 时间序列的平稳性，SAS 输出\n\n| 增广迪基-富勒单位根检验 | | | | | | |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 类型 | 滞后期 | Rho | Pr < Rho | Tau | Pr < Tau | F | Pr > F |\n|\
  \ --- | --- | --- | --- | --- | --- | --- | --- |\n| 零均值 | 0 | -0.3118 | 0.6116\
  \ | -0.75 | 0.3904 | | |\n| | 1 | -0.4327 | 0.5844 | -0.70 | 0.4139 | | |\n| | 2\
  \ | -0.3451 | 0.6040 | -0.74 | 0.3964 | | |\n| 单均值 | 0 | -17.2064 | 0.0217 | -3.26\
  \ | 0.0181 | 5.44 | 0.0242 |\n| | 1 | -39.0108 | 0.0016 | -4.71 | 0.0002 | 11.14\
  \ | 0.0010 |\n| | 2 | -25.7633 | 0.0026 | -3.87 | 0.0027 | 7.59 | 0.0010 |\n| 趋势\
  \ | 0 | -17.4227 | 0.1110 | -3.18 | 0.0899 | 5.31 | 0.1108 |\n| | 1 | -40.4434 |\
  \ 0.0007 | -4.70 | 0.0009 | 11.22 | 0.0010 |\n| | 2 | -26.2061 | 0.0169 | -3.79\
  \ | 0.0183 | 7.48 | 0.0191 |\n\n基于增广迪基-富勒检验中的单均值 P 值，该过程是平稳的。\n\n#### 第 2 步：使用 ACF\
  \ 和 PACF 图确定模型类型\n\n以下代码创建了 ACF 和 PACF 图，以便于确定模型类型。请参考图 12-54 查看与此任务相关的 SAS 输出。\n\
  \n```sas\nods graphics on;\nproc arima data=call_volume plots=all;\nidentify var=call_volume\
  \ stationarity=(DICKEY);\nrun;\n```\n\n![A978-1-4842-0043-8_12_Fig54_HTML.jpg](img/A978-1-4842-0043-8_12_Fig54_HTML.jpg)\n\
  \n**图 12-54.** 用于确定模型类型的 ACF 和 PACF 图，SAS 输出\n\nACF 呈衰减趋势。PACF 和 IACF 也趋近于零。这应该是一个\
  \ ARMA 过程。你将使用 `SCAN` 和 `ESACF` 选项来确定阶数。请参考以下 SAS 代码以及表 12-23 中的相关输出。\n\n```sas\n\
  proc arima data=call_volume plots=all;\nidentify var=call_volume SCAN ESACF;\nrun;\n\
  ```\n\n**表 12-23.** 用于查找 ARMA 过程阶数 p 和 q 的 SCAN 和 ESACF 表，SAS 输出\n\n| ARMA(p+d,q)\
  \ 暂定阶数选择检验 | |\n| --- | --- |\n| SCAN | ESACF |\n| --- | --- |\n| p+d | q |\n| 1\
  \ | 1 |\n| 5 | 0 |\n\n| p+d | q |\n| --- | --- |\n| 1 | 1 |\n| | |\n\n`SCAN` 和 `ESACF`\
  \ 给出的第一个选项都是 ARMA(1,1)。你将尝试估计参数 `a[1]` 和 `b[1]`。\n\n#### 第 3 步：估计参数\n\n请参考以下 SAS\
  \ 代码以及表 12-24 中的相关 SAS 输出，以找出模型方程参数。\n\n```sas\nproc arima data=call_volume plots=all;\n\
  identify var=call_volume SCAN ESACF;\nestimate p=1 q=1 method=ML;\nrun;\n```\n\n\
  **表 12-24.** 参数估计，来自 SAS 输出的最大似然估计表\n\n| 最大似然估计 | | | | |\n| --- | --- | --- | ---\
  \ | --- |\n| 参数 | 估计值 | 标准误差 | t 值 | 近似 Pr > \\|t\\| | 滞后期 |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| MU | 9825.6 | 201.76908 | 48.70 | <.0001 | 0 |\n| MA1,1\
  \ | -0.68286 | 0.04442 | -15.37 | <.0001 | 1 |\n| AR1,1 | 0.90783 | 0.02424 | 37.46\
  \ | <.0001 | 1 |\n\nAR 和 MA 参数值现已估计完成。模型方程如下：\n\n`y[t] = 9825.6 + 0.90783 * y[t-1]\
  \ + ε[t] - 0.68286 * ε[t-1]`\n\n\n\n#### 步骤 4：预测\n\n现在你可以预测下周的通话量。相应的 SAS 代码及其解读留作练习，供你自行完成。在前面的章节中，我已针对其他案例详细讨论过这一过程。可参考表\
  \ 12-25 查看 SAS 输出的相关部分。\n\n**表 12-25.** 通话量预测数据，SAS 输出\n\n| 变量 `Call_volume` 的预测值\
  \ |\n| --- |\n| 观测值 | 预测值 | 标准误差 | 95% 置信区间 |\n| 301 | 9876.9777 | 198.7791 | 9487.3779\
  \ | 10266.5776 |\n| 302 | 9872.2397 | 373.4869 | 9140.2188 | 10604.2607 |\n| 303\
  \ | 9867.9384 | 471.0529 | 8944.6917 | 10791.1852 |\n| 304 | 9864.0336 | 538.3305\
  \ | 8808.9252 | 10919.1420 |\n| 305 | 9860.4887 | 588.0196 | 8707.9914 | 11012.9860\
  \ |\n| 306 | 9857.2705 | 626.0134 | 8630.3068 | 11084.2342 |\n| 307 | 9854.3489\
  \ | 655.6732 | 8569.2530 | 11139.4449 |\n\n如表 12-25 所示，下周预计不会有大幅下降或增长。资源规划无需进行重大调整！\n\
  \n### 检验模型精度\n\n在任何模型构建工作中，检验模型精度都至关重要。残差图以及 AIC 和 SBC 值能告诉你模型的构建质量如何。为了检验预测精度，一个不错的做法是预留部分数据用于测试，之后再用它来检验模型精度。例如，在通话量预测数据中，你拥有\
  \ 300 天的数据。在这 300 天数据中，假设实际可用的只有 295 天，然后用接下来的 5 天数据来检验预测的精度。你利用模型预测这 5 天的数值。期望一个良好的模型能给出接近实际值的预测结果。请参考表\
  \ 12-26。\n\n**表 12-26.** 先前通话量示例中的预测值与误差\n\n| 天数 | 观测值 | 预测值 | 绝对误差 | 百分比误差 | 平方偏差\
  \ |\n| 296 | 9345.557 | 9407.4053 | 61.84803 | 0.7% | 3825.179 |\n| 297 | 9275.306\
  \ | 9444.8852 | 169.5787 | 1.8% | 28756.94 |\n| 298 | 9396.698 | 9478.9372 | 82.23937\
  \ | 0.9% | 6763.314 |\n| 299 | 9217.704 | 9509.8748 | 292.171 | 3.2% | 85363.87\
  \ |\n| 300 | 9533.522 | 9537.9828 | 4.461153 | 0.0% | 19.90189 |\n| | 122.1 | 1.3%\
  \ | 24945.8 |\n\n理想情况下，你希望误差为零或小于 5%。下面是一些衡量误差或精度的指标。在以下文本中，`Y[i]` 是实际值，`Ŷ[i]` 是预期值。\n\
  \n- **平均绝对偏差 (MAD)：** 绝对偏差的平均值。\n- **平均绝对百分比误差 (MAPE)：** 这是使用最广泛的指标。百分比偏差的平均值。\n\
  - **均方误差 (MSE)：** 平方偏差的平均值。\n- **均方根误差 (RMSE)：** 另一个相关指标，即 `sqrt(MSE)`。\n\n在上面的例子中，相关数值如下：\n\
  - `MAD` = 122.1\n- `MAPE` = 1.3%\n- `MSE` = 24,945.8\n- `RMSE` = 157.9\n\n通常，好的做法是保留\
  \ 5% 到 10% 的样本数据用于验证。具体的百分比取决于数据集的大小。\n\n## 结论\n\n在本章中，你了解了什么是时间序列过程。我讨论了应用最广泛的时间序列技术之一，即\
  \ Box–Jenkins ARIMA 技术。我还讨论了 ARIMA 模型构建的四大步骤。ARIMA 模型是众多模型类型之一。还有季节性 ARIMA 模型；有\
  \ ARIMAX 模型，它会使用一个自变量 `X` 以及 `Y` 的历史值；还有启发式 TSI 模型。我建议你在对 ARIMA 模型构建基础有扎实理解之后，再去研究其他时间序列技术。本章末尾讨论的模型精度检验方法应予以认真对待。对于分析师来说，在提供预测值时附上误差率是一个很好的实践。\n\
  \n"
- "# 13. 大数据分析入门\n\n至此，你已经阅读了关于商业分析的 12 个章节，现在能够理解构成这一领域的理论与实务。但学习的脚步永不停歇，尤其是在这样一个快速发展的领域。到现在，你可能已经意识到**大数据**正迅速流行起来。越来越多的组织，尤其是那些拥有大量访客流量的在线组织，每天都在产生前所未有的数据量，这些数据用传统技术几乎无法处理。\n\
  \n我们在第 1 章中对此略有提及，在本书的最后一章中，我们将扩展你的认知，让你能够领略大数据领域，并了解该领域专家们使用的工具和技术。\n\n### 传统数据处理工具\n\
  \n在日常工作中，你可能会使用以下一种或多种工具：\n- 文本编辑器/记事本：用于修改少量数据\n- Microsoft Excel：用于简单和中等程度的计算\n\
  - Microsoft Access/SQL：用于存储和查询关系型数据\n- SAS/R：用于高级分析\n- Tableau/QlikView：用于数据可视化和报告\n\
  \n你是否曾尝试用记事本打开一个 2GB 的文件？你是否处理过 4GB 的 Excel 文件？首先，有可能创建一个 4GB 的 Excel 文件吗？查询一个 10GB\
  \ 的数据库需要多长时间？你是否曾对 20GB 的数据集执行过回归分析之类的分析操作？SAS 或 R 在处理 20GB 数据时能否像处理相对较小的数据集那样高效？我们将提供一些例子，让你了解我们为何提出这些问题。\n\
  \n### 沃尔玛客户数据\n\n大约有 2.45 亿活跃客户和会员光顾沃尔玛，这些交易发生在 27 个国家的 71 个品牌下的 11,000 家门店，这其中包括其电子商务网站\
  \ (`http://corporate.walmart.com/our-story/`)。假设沃尔玛想了解其客户上个月的购买模式。让我们粗略估算一下沃尔玛一个月会产生多少数据。以下计算可能是一个保守的估计：\n\
  \n```text\n(245,000,000 客户) × (每月 2 次访问) × (每次购买 20 件商品) = 9,800,000,000 行\n```\n\
  \n一个月内可能有高达 98 亿行数据。对于每一行，沃尔玛都必须记录诸如日期戳、商品 ID、商品数量、商品价格、净价等详细信息。再次采用保守方法，假设每行至少有\
  \ 6 列。那么一个包含 98 亿行和 6 列的文件大小会是多少？一般来说，对于一个有 10,000 行、每行 6 列的 CSV 或 TXT 文件，文件大小大约在\
  \ 210KB 左右。基于此，一个包含 98 亿行的类似文件大小将约为 196GB。而这仅仅是基于账单交易的一个月保守估算。再想想客户的过往购买数据、人口统计数据、产品详情、门店详情等等。任何客户分析所需考虑的基础文件都将远大于我们估算的\
  \ 196GB。\n\n\n\n### Facebook 数据\n\n假设 Facebook（或同等规模的社交网络）想要构建一个高效的在线广告引擎。根据用户画像，Facebook\
  \ 希望在每个网页上展示最相关的广告，或者想要改进其信息流（News Feed）。我们来估算一下 Facebook 一个月内生成的最低数据量。\n\nFacebook\
  \ 拥有超过 10 亿用户，其中日活跃用户为 8.64 亿。为简单起见，我们将用户活动（如分享、点赞、状态更新、上传图片、登录和登出等）统一视为一次活动。考虑以下保守计算：\n\
  \n`(864,000,000 用户) × (每月 30 次活动) = 25,920,000,000 行`\n\n一个包含 259.2 亿行、6 列（例如）的文件，大小可能在\
  \ 510GB 左右。如果 Facebook 想要为其广告引擎进行任何有意义的分析，它至少需要处理这个量级的数据。这只是一个模拟示例，旨在让您对过程中涉及的数据量有一个直观感受。\n\
  \n请注意，沃尔玛和 Facebook 在数据量方面的估算都是保守的。实际涉及的数据规模可能要大得多。一些真实的业务场景可能需要您处理 PB 级的数据。什么是\
  \ PB？请参考表 13-1。\n\n**表 13-1.** 数据单位\n| 单位度量 | 换算关系 |\n| --- | --- |\n| 1GB 吉字节 |\
  \ 1024MB |\n| 1TB 太字节 | 1024GB |\n| 1PB 拍字节 | 1024TB = 1024GB × 1024GB = 1,048,576GB\
  \ |\n\n举个例子，一张典型的 DVD 存储约 4.7GB 数据。要存储 1PB 的数据，您需要 223,101 张 DVD。\n\n### 数据规模不断增长的实例\n\
  \n一些企业实时生产和分析的数据量，有时甚至超乎我们的想象。\n\n*   沃尔玛拥有一个超过 2.5 PB 数据的数据库。\n*   Facebook 每天处理\
  \ 300 PB 的数据。\n*   谷歌每天处理近 200 PB 的数据。\n*   NASA 存储和处理约 32 PB 的气候数据及相关模拟结果。\n* \
  \  欧洲核子研究中心（CERN）的大型强子对撞机（LHC）在 2012 年产生了 30TB 的数据。\n\n到现在，您可能已经清楚，传统工具无法处理如此庞大的数据量。大数据真的就意味着数据量大吗？大数据的定义是什么？\n\
  \n## 什么是大数据？\n\n大数据没有标准的定义。以下是互联网上流传的一些定义：\n\n*   任何难以用常规或传统数据处理工具处理的数据集都被称为大数据。\n\
  *   难以捕获、存储、处理、搜索、查询、传输、分析和可视化的数据被称为大数据。\n*   大数据是一个复杂、多样、快速增长且庞大的数据集，需要新的架构、技术和算法来分析它。\n\
  *   大数据是一个可以被分析和挖掘以获取洞见的数据集，但因其规模、复杂性和增长速度，传统工具无法处理它。\n\n接下来的两个部分基本上是对第 1 章中所讨论内容的修订。\n\
  \n### 大数据的三个主要组成部分\n\n大数据不仅仅关乎规模，尽管数据量是传统工具在处理它时失效的一个重要因素。大数据主要有三个组成部分：体量（Volume）、多样（Variety）和速度（Velocity）。传统的方法和工具在数据处理方面有其自身的局限性。以下要点进一步阐述了这些特性中的每一个：\n\
  \n**表 13-2.** 大数据与常规数据对比\n| 大数据 | 普通或常规数据 |\n| --- | --- |\n| 庞大的数据集。 | 数据集规模可控。\
  \ |\n| 非结构化数据，如文本、视频和音频。 | 通常是结构化数据，如数字和类别，但也可能采用其他形式。 |\n| 难以执行的查询和分析。 | 相对易于执行的查询和分析。\
  \ |\n| 需要新的分析方法论。 | 可以使用常规方法进行数据分析。 |\n| 需要 Apache Hadoop、Hive、HBase、Pig、Sqoop 等工具来处理大数据。\
  \ | 仅使用 SQL、SAS、R 和 Excel 等工具可能就足以处理传统数据。 |\n| 原始事务数据。 | 聚合、抽样或过滤后的数据。 |\n| 用于报告、基础分析和文本挖掘。高级分析在大数据中仍处于起步阶段。\
  \ | 用于报告、高级分析和预测建模。 |\n| 大数据分析需要编程技能（如 Java）和分析技能来执行分析（就目前而言）。 | 对于常规数据，分析技能已足够；高级分析工具不需要专业的编程技能。\
  \ |\n| PB/EB 级数据。数百万/数十亿账户。数十亿/万亿笔交易。 | MB/GB 级数据。数千/数百万账户。数百万笔交易。 |\n| 由大型金融机构、Facebook、谷歌、亚马逊、eBay、沃尔玛等产生。\
  \ | 主要由小型企业产生。 |\n\n*   **体量**：在大数据分析中，数据本身的规模巨大，以至于几乎不可能处理。到目前为止，我们已经提到了几个例子，再补充一些，信用卡公司的事务数据、移动电话公司的通话数据以及像亚马逊这样的大型零售商的账单数据都属于此类。规模被认为是定义大数据的首要特征。\n\
  *   **多样**：我们如今生成的数据类型不仅限于结构化的数值表格数据。例如，电信公司的音频文件、无数闭路摄像头的视频文件以及众多网站的博客数据。所有这些都属于非常规数据类型。此类别中的其他数据包括文本、数值数据、序列、时间序列、多维数组、XML、静态图像和社交媒体数据。这些类型的数据可能会与常规数据混合在一起。为此类数据准备分析显然并不简单。\n\
  *   **速度**：数据每天都在快速增长。在某些情况下，数据增长如此之快，以至于我们没有足够的时间去分析它。想象一下一级方程式赛车的场景。我们 invariably\
  \ 会在每辆超级赛车上安装一些传感器。分析这些传感器收集的数据，以便为下一圈提出改进建议。我们不可能，例如，花费三个月的时间来转换数据、为分析做准备、构建模型并最终验证它，以便在此基础上提出有用的建议。所有这些都必须在下一圈开始之前完成。这类分析甚至还会用到来自赛车传感器的实时数据流。表\
  \ 13-2 比较了大数据与常规数据。此处引自第 1 章以便随时参考。\n\n现在您知道大数据是复杂、庞大且快速增长的。同时，传统工具几乎无法处理这类数据。我们为什么真正需要分析大数据？难道我们不能简单地使用聚合数据或样本数据集，并坚持使用传统技术和工具吗？大数据分析在现实生活中有哪些应用？下一节将回答所有这些问题。\n\
  \n\n\n### 大数据分析的应用\n\n不久之前，以电子形式发送数据还不是普遍做法。我们过去常常将所有数据以纸质形式邮寄，整理成文件夹和捆包。随着计算机、智能手机和其他设备的出现，我们能够存储和处理海量数据。如今，数据正呈指数级增长。已有一些聪明的公司利用这些海量可用数据为自己谋利。以下是一些例子：\n\
  \n-   **电商零售商**：像亚马逊和 eBay 这样的在线零售商需要处理数百万在线客户购买数千种产品的业务。他们每天分析 PB 级的数据，以推荐合适的产品、改进搜索并提升服务质量。执行大数据分析可以揭示许多客户洞察，例如客户生命周期价值、客户忠诚度、产品热度等等。\n\
  -   **在线娱乐行业**：像 Netflix 这样的网站正在利用大数据分析来了解客户情绪。他们分析大数据以进行电影推荐，甚至根据需求进行票价定价。\n- \
  \  **汽车行业**：汽车制造商通过传感器从全球数百万辆汽车中收集数据。由于其规模庞大、种类繁多以及积累速度快，这些数据属于大数据的范畴。这些数据用于了解车型的维护问题、特定车型的优缺点、客户的驾驶习惯、事故原因、质量改进建议等等。\n\
  -   **电信行业**：除了账单和投诉数据外，电信公司还维护着通话详细记录数据（CDR）和短信数据。如今，智能手机已成为人类生活中不可或缺的一部分。通过分析\
  \ CDR 数据，我们可以获得关于人们习惯的一些重要分析，例如睡眠时间、最活跃时间段、工作时间、驾驶时间等等。市政部门可以利用这些数据，通过在合适的地点建设正确的基础设施来规划和管理城市。一旦分析模型到位，就会发现许多类似的应用。\n\
  -   **在线社交媒体行业**：大数据最知名的用户之一就是社交媒体行业。像 Facebook、Google+、Twitter 和 LinkedIn 这样的社交网站每天产生\
  \ PB 级的数据。他们分析这些数据用于好友推荐、广告管理、信息流管理等。\n\n这些只是几个例子。事实上，大数据分析也应用于制药行业的药物发明中。该行业使用模拟数据，而非传统的实验室实验。大数据的另一个用途是用于自动驾驶汽车的视频分析。此外，搜索引擎也在利用大数据进行索引、搜索和查询。大数据还被用于政治领域。许多知名政治家利用大数据分析，结合有针对性的电子邮件活动，来预估他们获胜的几率。所以，正如你所见，其用途和可能性超乎想象。\n\
  \n既然你已经熟悉了大数据的基本概念，我们将通过以下问题来讨论更多应用，其中许多问题在几年前还被认为是不切实际的想法：\n\n-   当我们在超市把一件商品放入购物车时，能否立即获得实时推荐和折扣（也许在手机上）？\n\
  -   一个百分之百由自动驾驶汽车组成的城市会是什么样？\n-   我们能否戴上某种眼镜，并获得其所见物体的完整信息？\n-   我们能否预测足球比赛进行过程中的结果及获胜概率的变化？\n\
  -   我们能否实时控制交通，并在高峰时段更好地管理它？\n-   我们能否创造一个能够理解人类语言并实时回应的机器人？\n-   我们能否拥有一部能感知我们血压水平的智能手机？能否有一个能在心脏病发作时发出警报的应用？\n\
  -   我们能否分析呼叫中心的历史语音数据，并自动解决客户疑问，而无需客服人员亲自回答？\n\n这一切看起来都太过先进，令人难以置信。但这都是大数据可以实现的可能性。不幸的是，大数据无法使用传统工具、旧技术或常规算法来处理；我们需要一个替代方案。\n\
  \n## 大数据问题的解决方案\n\n传统数据处理技术为何在处理大数据时失败，原因显而易见。常规工具将整个数据集视为一个单元。这样一来，处理 PB 级的数据将非常困难。有时甚至无法将大数据文件保存在一台机器上。我们需要拥有多个处理器的巨型超级计算机，才能用一台机器处理大数据。超级计算机并非简单的机器，其成本高达数百万美元。应对大数据挑战的解决方案是，使用计算机网络（例如局域网）连接多台计算机，编写代码的方式使得每台计算机都能独立理解和执行，最后将结果汇总成一个输出。这种技术称为分布式计算。\n\
  \n\n\n### 分布式计算\n\n即使在今天，处理大数据时，对强大计算能力的需求有时仍被列为一项主要限制。分布式计算在此类情况下表现良好。它遵循“分而治之”的原则。你不是将整个庞大数据集视为一个单一单元，而是可以将其切割成多个小块或小数据块。然后，你可以将这些相对较小的数据块保存到一组或一个计算设备网络中。这个网络中的每台计算机被称为一个**节点**。将数据分布到集群装置上是分布式计算的第一部分。第二部分是调整代码以适应这类计算机集群。以下几点总结了处理大数据的分布式计算方法：\n\
  \n- 将整体问题分解为更小的任务，并在多台独立计算机上执行这些小任务。这意味着将数据划分为更小的数据块，并将这些数据块存储在集群中的各个节点上。\n- 汇总所有独立机器的结果，并输出一个整合后的结果。\n\
  \n让我们以 Facebook 或类似的社交网站为例。一天之内，这个社交网站上会发生数十亿次活动。假设你想获取一天内状态更新的数量。想象一下，整个状态更新文件大小为\
  \ 500GB。下面可能是用于计算状态更新总数的简单 SQL 代码：\n\n`Select count(*) from feb_status /* feb_status\
  \ 是状态更新数据集的名称 */`\n\n这段代码会将整个 500GB 文件视为一个单元，并且可能会花费异常长的时间。如果你用一个由 20 台计算机组成的网络，将\
  \ 500GB 文件分成 10,000 个每个 50MB 的小块会怎样？你可以将这 10,000 个独立的数据块存储在这 20 台计算机上。这样做，你就把一个大计算任务分配到了\
  \ 20 台机器上。每台计算机可以本地计算状态更新的数量，然后汇总计数数据，得到所需的整合后的状态更新总数。所有 20 台机器都在独立的数据块上并行工作。如果使用传统方法和一台机器，整个计算任务需要\
  \ 20 小时，那么很自然地可以预期，采用这种分而治之的策略，只需要一个小时或更少的时间就能完成。实际上，使用分布式计算，完成整个任务所需的时间将远少于一个小时。\n\
  \n一台超级计算机也能高效地完成同样的任务。但总的来说，与一台大型超级计算机高昂的成本相比，即使是中小型企业也能负担得起一个由 20 台个人电脑组成的集群。此外，当没有大数据文件需要分析时，这\
  \ 20 台个人电脑还可以用于其他商业用途。另一方面，超级计算机只适用于高端任务，而这些任务可能并非总是存在。\n\n这种将一个大计算任务分解成更小的任务，并汇总中间结果以生成最终结果的编程模型被称为\
  \ `MapReduce` 编程模型。\n\n## 什么是 MapReduce？\n\n在分布式计算中，目标是解决一个全局性问题。你编写一个程序，将这个全局任务分解成更小的任务，并最终将这些任务分配给组成集群的各个独立机器。这个分解程序被称为\
  \ `map` 函数。一旦你完成了本地机器上的任务，你再编写另一个程序，汇总来自各个 `map` 函数的结果，以生成最终的整合结果。这个汇总函数被称为 `reduce`\
  \ 函数。我们将在以下章节讨论每个函数。\n\n### Map 函数\n\n`map` 函数会在所有独立的数据块上本地执行。`map` 函数的结果以键值对的形式输出。来自不同\
  \ `map` 函数的这些键值对携带着中间结果。通常，任何一个单独的 `map` 函数都与整体任务类似。唯一的区别是规模，`map` 函数的规模要小得多。`map`\
  \ 函数的输出被用作 `reduce` 函数的输入。\n\n### Reduce 函数\n\n`reduce` 函数获取来自 `map` 函数的中间结果，并创建最终输出。由\
  \ `map` 函数生成的键值对会在 `reduce` 函数中进行排序和聚合。`reduce` 函数并不作用于独立的数据块。实际上，它不与原始输入数据交互，原始输入数据只被提供给\
  \ `map` 函数。\n\n图 13-1 展示了一个 reduce 示意图，解释了用于处理大数据的整体 `MapReduce` 编程模型。这是一种处理大数据的经济高效的模型。\n\
  \n![A978-1-4842-0043-8_13_Fig1_HTML.jpg](img/A978-1-4842-0043-8_13_Fig1_HTML.jpg)\n\
  \n*图 13-1. `MapReduce` 如何处理大数据问题*\n\n除了 `MapReduce` 编程模型，以下流程也需要你的关注：\n\n- **集群搭建**：你通过创建一个由独立机器组成的网络来搭建一个集群。你可能需要系统管理员的帮助来搭建集群。\n\
  - **任务分配**：选择一些节点作为从节点，分配 `map` 任务，随后再分配 `reduce` 任务。你需要编写一个单独的函数来将工作分配给各个节点。\n\
  - **任务调度**：创建一个主节点，它将跟踪所有的 `MapReduce` 任务，即负责调度。你不能从 `reduce` 任务开始。但这并不意味着你需要等待所有\
  \ `map` 任务都完成。你可能需要编写一些单独的代码来进行任务调度。\n- **负载均衡**：会有挑战，例如集群中某个系统很慢。集群中的某些节点配置可能很好。为了达到期望的效率，你需要根据节点的容量来分配任务。这也可能需要你编写负载均衡的函数。\n\
  - **容错性**：如果其中一个节点突然宕机怎么办？有没有办法恢复该节点中的数据？或许将那个特定的数据块复制到另一台机器上并用作备份是个好主意。因此，在分发数据时，你可能还需要考虑数据复制的问题。\n\
  \n看起来 `MapReduce` 是解决大数据问题的一个方案，但正如你所见，有太多复杂且相互关联的任务，使得普通程序员难以尝试。你需要多种技能才能使用 `MapReduce`\
  \ 编程模型来解决大数据问题。如果能有一个现成的框架来处理搭建集群、添加和删除节点、分配工作、调度任务、负载均衡、容错等问题，那就太好了。Apache Hadoop\
  \ 就是一个这样流行的框架。Hadoop 是开源的，对于那些想要专注于 `MapReduce` 的人来说，它是一笔意外之财。\n\n## 什么是 Apache\
  \ Hadoop？\n\nHadoop 框架正是为了解决使用 `MapReduce` 编程模型进行分布式计算时所遇到的诸多挑战而生的。Hadoop 框架是一个基于\
  \ Linux 操作系统构建的开源工具。\n\nHadoop 是一个框架。它是一个用于编写和执行 `MapReduce` 及其他大数据任务的简化平台。Hadoop\
  \ 有两个主要组件：Hadoop 分布式文件系统（HDFS）和 `MapReduce`。我们将在以下章节详细探讨这两个组件。\n\n让我们明确几个事实。\n\n\
  - Hadoop 不是数据库。\n- Hadoop 不是大数据的同义词。\n- Hadoop 不是一种编程语言。\n\n\n\n### Hadoop 分布式文件系统\n\
  \n在分布式计算和 MapReduce 的世界中，不应存在异常大的文件。所有大文件都会被切分成小块。Hadoop 中的文件系统被称为 Hadoop 分布式文件系统（HDFS）。该系统中的每个文件大小不超过\
  \ 64MB。当你将任何文件从外部传输到 HDFS 时，它会被分割成 64MB 的块。在集群环境下，HDFS 会将文件切分成块并分发到集群内的不同节点。你可以将\
  \ HDFS 想象成一个将数据切分成小块的切割器。有了它，开发者无需担心数据的划分和分发。你只需要将文件从本地文件系统复制到 HDFS。事实上，HDFS 甚至会处理诸如数据块位置等细节。数据块会有副本；如果一个系统宕机，则会使用副本数据块。图\
  \ 13-2 展示了 HDFS 如何分发数据。\n\n![A978-1-4842-0043-8_13_Fig2_HTML.jpg](img/A978-1-4842-0043-8_13_Fig2_HTML.jpg)\n\
  \n图 13-2. HDFS 如何分发数据\n\n在图 13-2 中，每个块都被复制了三份。默认情况下，每个块大小为 64MB，并且在网络上会复制三份。\n\n\
  ### MapReduce\n\nMapReduce 是一种并行处理编程模型。与 HDFS 协同工作时，MapReduce 代码块在本地位置执行。HDFS 包含所有数据块及其相关信息。MapReduce\
  \ 包含所有任务相关信息。MapReduce 和 HDFS 共同处理大数据，几乎毫不费力。Hadoop 框架负责协调 MapReduce 代码与 HDFS 数据块之间的协作。在\
  \ Hadoop 中，MapReduce 代码块需要用 Java 语言编写。它针对每个本地数据块执行 map 代码，并执行 reduce 代码进行整合。\n\n\
  除了这两个主要组件，Hadoop 框架在以下过程中也发挥着关键作用：\n\n- **集群轻松构建**：Hadoop 允许用户快速设置集群网络。Hadoop 使得在不影响网络其他部分的情况下添加或移除节点变得极其简单。在\
  \ Hadoop 框架上，这就像添加或删除一个 IP 地址一样容易。没有 Hadoop，建立计算机集群并维护其进行一致性处理可能并不容易。\n- **存储轻松实现**：Hadoop\
  \ 选择一个节点作为主节点，称为名称节点（`NameNode`）。其余节点是从节点，称为数据节点（`DataNode`）。数据节点包含实际的数据块，而名称节点包含关于数据节点和数据块位置的信息（基本上是元数据）。Hadoop\
  \ 提供了选择哪些机器作为主节点和从节点的选项。\n- **作业调度轻松完成**：Hadoop 自动处理作业编排。MapReduce 会有多个需要在数据节点上执行的\
  \ map 和 reduce 任务。为了管理所有资源，Hadoop 有一个作业跟踪器（`JobTracker`）和任务跟踪器（`TaskTracker`）。作业跟踪器与主节点协同工作，其主要功能是将作业分配给多个任务跟踪器。任务跟踪器运行在不同的数据节点上。任务跟踪器将结果呈现给作业跟踪器并报告作业状态。\n\
  - **容错机制**：任务跟踪器定期向作业跟踪器发送一些心跳信号。这有助于作业跟踪器了解每个任务跟踪器的状态，即它是存活还是已宕机。如果作业跟踪器因故未收到某个任务跟踪器的心跳信号，它会迅速将任务分配给另一个运行在副本数据块上的任务跟踪器。\n\
  - **负载均衡**：Hadoop 会自动运行一些备份作业。如果一个节点很慢，并且拖慢了整个 MapReduce 进程，那么作业跟踪器会将那个特定任务分配给其他高速节点，从而减少分配给慢速机器的任务数量。\n\
  \n你可以看到，Hadoop 会自动处理许多与大数据处理相关的细节。所有这一切都以熟练的方式处理。开发者无需担心集群管理、可扩展性、容错、作业调度、负载均衡、数据分发等问题。此外，Hadoop\
  \ 是免费且开源的。有关 Hadoop 的一些有用资源，请参考表 13-3。\n\n表 13-3. Hadoop 相关资源\n\n| Hadoop 徽标 | ![A978-1-4842-0043-8_13_Figa_HTML.jpg](img/A978-1-4842-0043-8_13_Figa_HTML.jpg)\
  \ |\n| Hadoop 主页 | [`http://hadoop.apache.org/`](http://hadoop.apache.org/) |\n\
  | Hadoop 文档 | [`http://hadoop.apache.org/docs/current/`](http://hadoop.apache.org/docs/current/)\
  \ |\n| Hadoop 下载页面 | [`http://hadoop.apache.org/releases.html`](http://hadoop.apache.org/releases.html)\
  \ |\n\nHadoop 框架简化了许多任务。它自动处理了分布式计算中的许多关键组件。即使对于专业程序员来说，编写、调试和维护关键代码组件也可能很困难。核心的\
  \ MapReduce 编程以及与其他 Hadoop 组件的交互使用 Java 编程语言；你需要对 Java 编程有一定程度的熟悉才能有效地使用 Hadoop。代码算法的逻辑需要针对\
  \ MapReduce 编程模型进行调整。传统的 Java 代码以传统方式产生结果，但可能与 HDFS 和 MapReduce 的方式不同。如果有一些工具能够自动将你的传统\
  \ SQL 脚本或命令转换为 MapReduce 所需的格式，那岂不是很好？幸运的是，Hadoop 生态系统中提供了一些工具，可以帮助你简化 MapReduce\
  \ 编程。Apache 的 Hive、Pig、Sqoop 和 Mahout 是其中几个重要的工具。以下各节将详细介绍。\n\n### Apache Hive\n\
  \nHive 是数据仓库软件。你可以将其安装在 Hadoop 之上。Hive 会自动将传统的类 SQL 查询转换为 MapReduce 代码。查询使用 Hive\
  \ 查询语言（`HiveQL`）编写。`HiveQL` 类似于 SQL，对于数据分析师基于大数据生成一些基本商业智能（BI）报告非常有用。Hive 不能脱离 HDFS\
  \ 和 MapReduce 独立工作。Hive 最初由 Facebook 开发，后来公开发布。许多数据分析师使用 Hive 进行数据汇总、报告和分析。有关 Hive\
  \ 的一些基本资源，请参考表 13-4。\n\n表 13-4. Hive 相关资源\n\n| Hive 徽标 | ![A978-1-4842-0043-8_13_Figb_HTML.jpg](img/A978-1-4842-0043-8_13_Figb_HTML.jpg)\
  \ |\n| Hive 主页 | [`http://hive.apache.org/`](http://hive.apache.org/) |\n| Hive\
  \ 文档 | [`https://cwiki.apache.org/confluence/display/Hive/LanguageManual`](https://cwiki.apache.org/confluence/display/Hive/LanguageManual)\
  \ |\n| Hive 下载页面 | [`http://hive.apache.org/downloads.html`](http://hive.apache.org/downloads.html)\
  \ |\n\n\n\n### Apache Pig\n\n`Pig` 是一种主要用于提取、转换和加载（ETL）操作的软件。`Pig` 提供了一个用于并行执行数据流的引擎。类似于\
  \ `Hive`，`Pig` 也运行在 `Hadoop` 之上。你需要编写 `Pig Latin` 脚本来与 `Pig` 工具进行交互。`Pig Latin`\
  \ 脚本比 `Java MapReduce` 代码要简单得多。可以编写 `Pig Latin` 脚本来执行诸如 `join`、`sort`、`filter`、`load`、`transform`\
  \ 等数据处理操作。`Pig` 更偏向于数据处理和操作工具，而非数据分析工具。`Pig Latin` 可以进行扩展，以使用自定义的用户定义函数。`Pig` 最初由\
  \ Yahoo 开发，后来对外开源。就像所有 `Hive` 查询在执行前会自动转换为 `MapReduce` 代码一样，`Pig Latin` 脚本在内部也会被转换为\
  \ `MapReduce`。`Pig` 大大简化了为 ETL 编写 `MapReduce` 代码块的任务。有关 `Pig` 的一些基本资源，请参考表 13-5。\n\
  \n**表 13-5.** Pig 资源\n\n| Pig 标志 | ![A978-1-4842-0043-8_13_Figc_HTML.jpg](img/A978-1-4842-0043-8_13_Figc_HTML.jpg)\
  \ |\n| Pig 主页 | [`https://pig.apache.org/`](https://pig.apache.org/) |\n| Pig 文档\
  \ | [`http://pig.apache.org/docs/r0.12.1/index.html`](http://pig.apache.org/docs/r0.12.1/index.html)\
  \ |\n| Pig 下载页面 | [`http://pig.apache.org/`](http://pig.apache.org/) |\n\n还有其他一些实用工具可帮助大数据开发人员。与\
  \ `Hadoop` 交互、编写 `MapReduce` 代码以及对大数据进行分析，随着这些工具的出现，每天都在变得更容易。以下是 `Hadoop` 生态系统中一些更有用的工具。\n\
  \n### Hadoop 生态系统中的其他工具\n\n`Hadoop` 生态系统就像智能手机上的应用商店。`Hadoop` 生态系统中几乎拥有满足大数据处理所有需求的工具。更多详情请参考表\
