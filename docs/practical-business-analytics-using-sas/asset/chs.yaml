  \ 输出和列表输出之间绝对没有区别。在本书中，您将把 HTML 代码设置为默认的输出窗口。图 2-14 显示了之前打印代码的 HTML 输出。\n\n![A978-1-4842-0043-8_2_Fig14_HTML.jpg](img/A978-1-4842-0043-8_2_Fig14_HTML.jpg)\n\
  \n图 2-14. 典型的 HTML 输出\n\n### 资源管理器窗口\n\n资源管理器窗口为您所有的文件和逻辑库提供了一个便捷的访问点（见图 2-15）。逻辑库是存储数据集和其他\
