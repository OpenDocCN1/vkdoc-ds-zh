  \n图 3-24. 导入数据：`Mydata` 逻辑库的内容\n\n你保存的文件中的 SAS 代码如下：\n\n```\nPROC IMPORT OUT= MYDATA.sat_exam\n\
  DATAFILE= \"C:\\Users\\Documents\\Datasets\\SAT_Exam.csv\"\nDBMS=CSV REPLACE;\n\
  GETNAMES=YES;\nDATAROW= 2 ;\nRUN ;\n```\n\n以同样的方式，你可以使用导入向导导入不同类型的文件，例如 TXT 文件、Excel\
  \ 文件等。下一节将解释用于导入数据的 SAS 代码。\n\n### 使用代码导入\n\n在上一节中，你使用图形用户界面导入了数据。你也可以使用 `SAS` 代码导入数据。在分析数据时，数据导入后通常还需要一些数据操作代码，因此将数据导入代码写在同一个文件中会很方便。\n\
  \n#### 使用代码导入 CSV 文件\n\n以下代码将一个简单的 CSV 文件导入 `SAS`：\n\n```\nPROC IMPORT OUT= MYDATA.sat_exam\n\
  DATAFILE= \"C:\\Users\\Documents\\Datasets\\SAT_Exam.csv\"\nDBMS=CSV REPLACE;\n\
  GETNAMES=YES;\nDATAROW= 2 ;\nRUN ;\n```\n\n表 3-7 对此代码进行了解释。\n\n表 3-7. 导入 `.csv`\
  \ 文件的代码\n\n| SAS 语句 | 说明 |\n| --- | --- |\n| `PROC IMPORT` | 这是将数据导入 `SAS` 的过程。\
  \ |\n| `OUT= MYDATA.sat_exam` | 这是 `OUT` 关键字，用于指定 `SAS` 中的输出文件。这里，你将数据集导入并存储为 `Mydata`\
  \ 逻辑库中的 `sat_exam`。 |\n| `DATAFILE= \"C:\\Users\\Documents\\Datasets\\SAT_Exam.csv\"\
  ` | `DATAFILE` 关键字用于指定需要导入 `SAS` 的输入数据文件。你需要指定文件的完整文件夹路径及其扩展名。 |\n| `DBMS=CSV` |\
  \ `DBMS=CSV` 表示你要导入的文件类型。 |\n| `REPLACE;` | 如果已存在与 `MYDATA.sat_exam` 同名的文件，则此选项将替换该文件。请注意，第一个\
  \ SAS 语句在此结束，并且在此之前没有分号。 |\n| `GETNAMES=YES;` | 是否从导入文件中获取列名？是或否？ |\n| `DATAROW=2;`\
  \ | 数据从哪一行开始？在本例中，第一行是列名，数据从第二行开始。|\n\n以下是导入包含汉堡销售数据的 CSV 文件的代码：\n\n```\nPROC IMPORT\
  \ OUT= MYDATA.burger\nDATAFILE= \"C:\\Users\\Documents\\Datasets\\Burger_sales.csv\"\
  \nDBMS=CSV REPLACE;\nGETNAMES=YES;\nDATAROW= 2 ;\nRUN ;\n```\n\n执行此代码时，日志文件中的重要说明如下：\n\
  \n```\nNOTE: The infile 'C:\\Users\\Documents\\Datasets\\Burger_sales.csv' is:\n\
  Filename=C:\\Users\\Documents\\Datasets\\Burger_sales.csv,\nRECFM=V,LRECL=32767,\
  \ File Size (bytes)=375,\nLast Modified=10Jun2014:15:33:18,\nCreate Time=05Oct2014:17:02:57\n\
  NOTE: 35 records were read from the infile 'C:\\Users\\Documents\\Datasets\\Burger_sales.csv'.\n\
  The minimum record length was 8.\nThe maximum record length was 9.\nNOTE: The data\
  \ set MYDATA.BURGER has 35 observations and 2 variables.\nNOTE: DATA statement used\
  \ (Total process time):\nreal time           0.03 seconds\ncpu time            0.03\
  \ seconds\n35 rows created in MYDATA.BURGER                             from\nC:\\\
  Users\\Documents\\Datasets\\Burger_sales.csv.\nNOTE: MYDATA.BURGER data set was\
  \ successfully created.\nNOTE: PROCEDURE IMPORT used (Total process time):\nreal\
  \ time           0.10 seconds\ncpu time            0.10 seconds\n```\n\n让我们看看如何导入其他类型的文件。\n\
  \n#### 使用 SAS 代码导入 Excel 文件\n\n以下 Excel 导入代码中有一个额外的参数 `RANGE`。这指的是 Excel 工作表中的工作表名称。通常一个\
  \ Excel 文件包含多个工作表，因此你需要指定需要导入的工作表。\n\n```\nPROC IMPORT OUT= MYDATA.BURGER_sales_from_excel\n\
  DATAFILE= \"C:\\Users\\Documents\\Datasets\\Burger_sales.xls\"\nDBMS=EXCEL REPLACE;\n\
  RANGE=\"Burger_sales$\";\nGETNAMES=YES;\nRUN ;\n```\n\n以下是执行此代码时的日志消息：\n\n```\n\
  153  PROC IMPORT OUT= MYDATA.BURGER_sales_from_excel\n154              DATAFILE=\
  \ \"C:\\Users\\Documents\\Datasets\\Burger_sales.xls\"\n155              DBMS=EXCEL\
  \ REPLACE;\n156       RANGE=\"Burger_sales$\";\n157       GETNAMES=YES;\n158   \
  \  RUN;\nNOTE: MYDATA.BURGER_SALES_FROM_EXCEL data set was successfully created.\n\
  NOTE: PROCEDURE IMPORT used (Total process time):\nreal time           0.13 seconds\n\
  cpu time            0.06 seconds\n```\n\n类似地，以下代码导入一个文本文件：\n\n```\nPROC IMPORT OUT=\
  \ MYDATA.SAT_EXAM_data_from_text_file\nDATAFILE= \"C:\\Users\\Documents\\Datasets\\\
  SAT_Exam.txt\"\nDBMS=TAB REPLACE;\nGETNAMES=YES;\nDATAROW= 2 ;\nRUN ;\n```\n\n你可以使用\
  \ `PROC IMPORT` 导入各种类型的文件；唯一的变化是导入代码中的一些参数。\n\n\n\n## 数据操作\n\n你可以使用导入代码导入原始数据。大多数情况下，你需要对原始数据进行操作，以便为分析做好准备。在此过程中，你可能需要对数据进行子集选择、与其他数据集合并、创建新的计算变量、从现有变量派生变量等等。接下来的章节将引导你了解一些重要的步骤，在几乎任何分析的数据操作过程中，你都需要用到这些步骤。\n\
  \n### 复制 SAS 数据集\n\n假设你已经导入了一些数据，并且希望进一步准备数据以供分析。以下代码在 SAS 中创建了数据集的副本。为此，你可以在数据步骤中使用\
  \ `SET` 语句：\n\n```\ndata MYDATA.sat_exam_copy;\nset  MYDATA.sat_exam;\nrun;\n```\n\
  \n上述代码简单地将数据从 `sat_exam` 复制到`MYDATA` 逻辑库中的 `sat_exam_copy`。以下是此代码的日志文件：\n\n```\n\
  NOTE: MYDATA.SAT_EXAM_DATA_FROM_TEXT_FILE data set was successfully created.\nNOTE:\
  \ PROCEDURE IMPORT used (Total process time):\nreal time           0.60 seconds\n\
  cpu time            0.18 seconds\n\n1761  data MYDATA.sat_exam_copy;\n1762  set\
  \  MYDATA.sat_exam;\n1763  run;\n\nNOTE: There were 96 observations read from the\
  \ data set MYDATA.SAT_EXAM.\nNOTE: The data set MYDATA.SAT_EXAM_COPY has 96 observations\
  \ and 5 variables.\nNOTE: DATA statement used (Total process time):\nreal time \
  \          0.03 seconds\ncpu time            0.01 seconds\n```\n\n类似地，如果你想要将数据集复制到另一个逻辑库，例如\
  \ `Work`，那么你可以使用以下代码：\n\n```\ndata sat_exam_copy;\nset  MYDATA.sat_exam;\nrun;\n\
  ```\n\n以下是此代码的日志文件：\n\n```\nNOTE: There were 96 observations read from the data\
  \ set MYDATA.SAT_EXAM.\nNOTE: The data set MYDATA.SAT_EXAM_COPY has 96 observations\
  \ and 5 variables.\nNOTE: DATA statement used (Total process time):\nreal time \
  \          0.03 seconds\ncpu time            0.03 seconds\n```\n\n让我们使用一个市场活动数据的例子来更好地理解这个主题。以下代码导入了市场数据文件：\n\
