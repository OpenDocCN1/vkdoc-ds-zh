  \n图 8-19.\n\n学校健康检查数据的总体均值和样本均值\n\n你可以预期总体均值在 95% 的时间里会落在 38.96 和 41.76 之间。如果原假设超出了这些界限或这个区间，你就可以拒绝它。因此，在这种情况下，原假设\
  \ `H[0] = 30` 将被拒绝。\n\n表 8-5 总结了假设检验过程中的一些要点。我们使用前面讨论过的例子，即一家公司声称其客户群体中有 50% 是男性。\n\
