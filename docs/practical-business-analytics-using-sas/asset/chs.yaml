  \ SAS 创建图表和数据合并。此外，你还学习了分析学的基础知识以及 SAS 的基本编程——SAS 无疑是目前最广泛使用的分析工具。\n\n接下来，在第 5 章中，你将进入商业分析的世界，并运用到目前为止所学的概念。你将学习更多的编程和分析概念。在接下来的章节中，你将学习基本的描述性统计、相关性和预测建模。前几章掌握的\
