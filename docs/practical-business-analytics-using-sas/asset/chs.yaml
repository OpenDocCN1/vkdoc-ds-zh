  \n一个基于所有四个科目（`xi`）的相同历史数据的模型显示，数学和能力成绩根本没有影响。另一个基于相同数据但只有两个科目的模型却显示了完全相反的结果。为什么数学和能力在科学和常识存在的情况下变得不显著了？\n\
