  \ | 11/10/2008 | 01/11/2009 | 技术 | 36.6 | 2144 | 0.017071 |\n| 8 | Info WP CPG |\
  \ 11/10/2008 | 11/14/2010 | 营销 | 69.2 | 6657 | 0.010395 |\n| 9 | Cognos WP CPG |\
  \ 11/10/2008 | 11/12/2012 | 技术 | 38.5 | 8783 | 0.004383 |\n| 10 | HP WP CPG | 11/11/2008\
  \ | 11/06/2017 | 技术 | 29.4 | 1414 | 0.020792 |\n\n\n\n#### 使用 if-then-else 创建新变量\n\
  \n你可能需要使用 `if-then-else` 结构来创建包含诸如“高”、“中”、“低”、“是”或“否”等值的新分类变量。以下是使用 `if-then-else`\
  \ 结构创建变量的通用语法：\n\n```\ndata new_data;\nset old_data;\n<if then else statements>;\n\
  run;\n```\n\n接下来，我们再看一个示例：创建一个名为 `reach_ind`（覆盖范围指标）的新变量，当覆盖范围大于 66% 时取值为“高”，在 33%\
  \ 到 66% 之间时取值为“中”，低于 33% 时取值为“低”。\n\n```\nData MYDATA.market_v5;\nset  MYDATA.market;\n\
  if reach<33 then reach_ind='Low';\nelse if reach >=33 and reach <=66 then reach_ind='Med';\n\
  else reach_ind='High';\nrun;\n```\n\n表 3-14 列出了新数据集 `market_v5` 的快照。\n\n**表 3-14.**\
