  \n前文已讨论过连续变量和离散变量。在两个界限之间可取任意值的变量称为连续变量（例如，以英尺为单位的身高）。只能取有限个值的变量称为离散变量（例如，一个家庭中的孩子数量）。模拟手表的时间是连续变量，而数字手表的时间是离散变量。两者都显示时间，但模拟手表的精度不固定，数字手表则仅显示到其最小度量单位，甚至可精确到百分之一秒。\n\
  \n表 7-20 显示了给定数据中变量被划分为连续变量和离散变量的情况。\n\n运行基本内容查看和打印过程后，接下来是描述性统计。如前所述，没有捷径可走。每个变量都需要单独检查。在分析之前，一切都需要探索和验证。基本描述性分析的第一步是识别连续变量和离散变量。由于连续变量可取无限个值，频率表等组件会非常冗长。另一方面，离散变量取值个数可数，因此频率表有一定意义。\n\
