  \ R 方）结果。\n\n![A978-1-4842-0043-8_10_Fig6_HTML.jpg](img/A978-1-4842-0043-8_10_Fig6_HTML.jpg)\n\
  \n**图 10-6.** 三个模型的 `R-squared`（R 方）和调整后的 `R-squared`（调整 R 方）值\n\n当你仅使用 `x1`、`x2`\
  \ 和 `x3` 这三个变量构建模型时，`R-square`（R 方）和调整后的 `R-squared`（调整 R 方）值非常接近。当你不断添加越来越多的变量时，`R-square`（R\
  \ 方）与调整后的 `R-squared`（调整 R 方）值之间的差距会逐渐增大。尽管 `R-square`（R 方）是衡量 `y` 变异性解释程度的良好指标，但其公式仍存在一个小挑战。\n\
  \n\n\n### R 平方的局限性\n\n以下列出了 R 平方的局限性：\n\n-   当向模型添加一个新的自变量时，`R-squared` 值要么增加，要么保持不变。除非你移除一个变量，否则它永远不会减少。\n\
  -   一旦 `R-square` 值随着一组变量达到最大值，那么即使再向该组添加另一个自变量，该值也绝不会下降。`R-square` 值可能会出现微小的向上增长。即使新添加的变量对模型结果没有影响，`R-squared`\
  \ 值也可能会有一些微小的提升。\n-   这里有一个简单的方法来理解这个特性：`R-squared` 是模型中自变量列表所解释的总变异量。如果你添加了任何新的无关自变量，即一个与因变量无关或没有影响的变量，`R-square`\
  \ 值可能仍会略有增加，但绝不会减少。\n\n当一个变量对因变量有不错或很强的影响时，`R-squared` 值增加，这对（分析师来说）是有利的。但是，如果一个无关紧要或微不足道的变量被添加到模型中，`R-squared`\
  \ 值会发生什么变化呢？当你添加无关变量时，`R-squared` 值不会显示出显著的增长。但仍旧会有一个小的正增量。我们假设每添加这样一个无关变量，`R-squared`\
  \ 值只增加 0.5%。如果你添加了 50 个这样的无关变量，你可能会看到 `R-square` 值惊人地增长了 25%。无论如何衡量，这都不是一个可以忽略不计的增长。当数据中的观测值（记录或行）较少时，这种情况尤其容易发生。添加一个新变量会迅速产生影响，并观察到的\
  \ `R-squared` 值会增加。\n\n在前面的例子中，让我们分析最终模型（即表 10-15 中给出的模型 3）的输出结果。\n\n**表 10-15.\
