- '# 前言


  合著者文卡特·雷迪·科纳萨尼（Venkat Reddy Konasani）和我，谢伦德拉·卡德雷（Shailendra Kadre），都在印度班加罗尔的惠普公司工作。在他加入惠普之前很久，我们就已经是朋友了。我那时对商业分析越来越感兴趣，在工作中运用它，并考虑写一本关于这个主题的书。我知道他是一名商业分析培训师，并参加了他的一些培训课程。他高效、简洁的演讲风格给我留下了深刻的印象，更不用说他讲座的内容了。那时我意识到，他就是我理想中的合著伙伴。没过多久，我们就决定联手撰写这本书。


  但在开始编写这本书之前，我们花了几年的时间研究关于商业分析和预测建模的书籍。其中一些确实很棒。但大多数书籍在统计算法的理论和数学方面过于深入和详尽，而算法正是这个主题不可或缺的一部分。有些人喜欢这种风格的书籍，但大多数从业者——甚至是业内人士——并不具备所要求的深厚数学背景，也没有兴趣去学习。在职专业人士，尤其是刚接触商业分析领域的新手，对于大多数现有分析书籍中通常提供的统计算法深入理论讲解感到不太适应。因此，我们所察觉的市场需求是，为那些不需要了解细节就能在工作中取得成功的专业人士简化算法的呈现。此外，一旦入门，如果今后需要这种学术严谨性，人们随时可以查阅更高级的统计学文献。


  好消息是，如今的像 SAS 这样的分析软件，其设计初衷就是完成大部分数学计算。因此，我们强烈感觉到市场需要一本像这样的书，它既利用了软件的功能，同时又简化了过程中涉及的数学概念。怀着这样的动力，我们开始了工作，并坚信我们已经成功地向您展示了如何使用
  SAS 执行常见的分析程序，同时提供了所需的基础统计学知识。本书尽可能简化理论部分，同时使用大量真实的商业场景来解释这些概念及其在行业中的使用方式。文卡特在世界领先银行的工作经验，以及他作为分析培训师与学生打交道的丰富经验，在设计本书的案例研究和示例时发挥了重要作用。


  像往常一样，读者是最好的评判者，我们邀请您就这一点与我们进行积极的对话，以便后续版本能够不断改进。请随时通过 `shailendrakadre@gmail.com`
  和 `21.venkat@gmail.com` 联系我们。


  '
- '# 关于作者




  ![A978-1-4842-0043-8_BookFrontmatter_Fig1_HTML.jpg](img/A978-1-4842-0043-8_BookFrontmatter_Fig1_HTML.jpg)
  **文卡特·雷迪·科纳萨尼**毕业于印度孟买理工学院（IIT），获应用统计学与信息学技术硕士学位。他在预测建模、大数据分析以及包括 SAS 和 R 在内的多种分析软件工具领域拥有八年以上经验。其主要专长包括信用风险模型构建、客户体验管理、社交媒体分析、机器学习、自然语言处理、文本挖掘和大数据分析。他曾为多家知名机构和国际客户承担多个享有盛誉的分析项目。其中一些重大项目包括：GIS
  工具的分析插件、文本挖掘与社交媒体数据的推文情感分析、足球比赛预测模型构建、客户体验管理、消费信用卡和贷款的信用风险模型构建，以及使用 Tableau 实现消费信用风险指标的可视化。他在预测建模、社交媒体分析和数据分析方面拥有专长，并已将这些技能应用于为国际公司开展的项目中。


  ![A978-1-4842-0043-8_BookFrontmatter_Fig2_HTML.jpg](img/A978-1-4842-0043-8_BookFrontmatter_Fig2_HTML.jpg)
  **沙伊伦德拉·卡德雷**是来自印度班加罗尔的一名高级 IT 和管理顾问，也是 2011 年 Apress 出版的《走向企业：极客指南》一书的作者。该书涵盖了
  IT 运营管理和 IT 的商业方面。他撰写了多篇关于技术、IT 投资组合管理以及项目和计划管理的研究论文和文章。


  目前，他在惠普印度公司担任解决方案顾问。他在技术、项目管理、售前、企业销售和业务分析领域拥有 20 多年经验。他目前的兴趣包括业务分析和企业打印解决方案。


  沙伊伦德拉拥有印度德里理工学院（IIT）的机械工程硕士学位。他与妻子米纳克希、女儿内哈和儿子维韦克居住在印度班加罗尔。可通过 `shailendrakadre@gmail.com`
  与他联系。


