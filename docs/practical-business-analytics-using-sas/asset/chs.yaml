  \ R 方 | 0.9793 |\n| 因变量均值 | 155.96875 | 调整 R 方 | 0.9786 |\n| 变异系数 | 3.03866 | |\
  \ |\n\n| 参数估计 |\n| 变量 | 自由度 | 参数估计 | 标准误差 | t 值 | Pr > \\|t\\| | 方差膨胀因子 |\n| 截距\
