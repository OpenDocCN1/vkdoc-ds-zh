  \ 5。\n\n在此输出中，所有变量的`VIF`值都大于 5，但这并不意味着所有四个变量都相互关联。通常，`VIF`值是成对出现的。如果你从一对中移除一个变量，另一个变量会自动得到修正。例如，让我们从模型中移除`Science`，再次检查多重共线性。\n\
