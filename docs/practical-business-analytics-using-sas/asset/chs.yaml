  \ SAS 如何存储这些数据。第三个表格，可能是最重要的一个，是关于数据集中的变量及其属性。\n\n`PROC Contents` 的两个有用选项是 `VARNUM`\
  \ 和 `Short`。\n\n\n\n#### `VARNUM` 选项\n\n`Proc Contents` 输出中的变量默认按字母顺序排列，而非数据集中的原始出现顺序。若希望按数据集的原始顺序打印变量，可使用\
  \ `varnum` 选项。以下是使用此选项的代码：\n\n```\nproc contents data=sashelp.stocks varnum;\nrun;\n\
  ```\n\n表 4-11 列出了该代码的输出。可以看到，输出中第三个表格内的变量已按数据集的原始顺序打印，这与表 4-10 的字母顺序不同。\n\n**表 4-11.**\
