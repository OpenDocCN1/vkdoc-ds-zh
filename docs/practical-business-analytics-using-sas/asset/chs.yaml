  \ 错误分类的百分比 = 6.9\n- 结百分比 = 1.1 (100 – (92.0 + 6.9))\n\n你构建的冰淇淋销售模型是一个良好的预测模型，因为它的一致性百分比达到了\
  \ 92%。任何大于 70%的一致性都是好的；大于 80%则是理想的。\n\n### 使用逻辑回归进行预测\n\n逻辑回归直线可以通过将贝塔（beta）系数代入以下方程来表示：在冰淇淋销售示例中，你可以手动代入年龄值，计算出购买的概率，即`y=0`的概率。SAS\
  \ 输出中有一条注释写道：“被建模的概率是`buy_ind=‘0’`。”这意味着概率值是针对`buy_ind=0`的，或者换种说法，当你代入`Age`值时，你得到的是\
  \ 0 的概率。例如，假设你想找到一个 12 岁的人购买冰淇淋的概率。代入过程如下：0.907（几乎为 91%）\n\n### 逻辑回归中的多重共线性\n\n\
  如果你有多个自变量，那么不出意外地，你会得到多个贝塔系数。我们在第 10 章中讨论过回归中的多重共线性。这是自变量之间的相互依赖关系，它会通过增加贝塔系数的标准差来影响模型准确度。我们在线性回归中讨论了多重共线性的影响以及如何检测和消除它。那么，多重共线性在多元逻辑回归中是否也是一个问题呢？逻辑回归中的多重共线性有何不同？\n\
  \n图 11-10 展示了线性回归中的多重共线性。`X1`、`X2`、`X3`、`X4`、`X5`…`Xp`是自变量，`Y`是与所有这些变量线性相关的因变量。\n\
  \n![A978-1-4842-0043-8_11_Fig10_HTML.jpg](img/A978-1-4842-0043-8_11_Fig10_HTML.jpg)\n\
  \n图 11-10. 线性回归中的多重共线性\n\n这里需要注意一个事实：多重共线性与自变量相关，而它们与因变量的关系与此无关。无论是线性回归还是非线性回归，都可能出现自变量相互依赖的情况（图\
  \ 11-11）。\n\n![A978-1-4842-0043-8_11_Fig11_HTML.jpg](img/A978-1-4842-0043-8_11_Fig11_HTML.jpg)\n\
  \n图 11-11. 非线性回归中的多重共线性\n\n简单来说，多重共线性同样是逻辑回归中的一个问题。当你处理多重共线性时，因变量并不参与其中。因此，无论你构建的是线性还是非线性回归模型，这都无关紧要。多重共线性同样会影响逻辑回归模型的准确性。在拟合多元逻辑回归直线时，你必须警惕多重共线性。其处理步骤与线性回归中讨论的多重共线性相同，如下所示：\n\
  \n-   使用方差膨胀因子（VIF）值检测或确认多重共线性。如果 VIF 大于 5，则表示自变量之间存在某种多重共线性。\n-   一旦发现存在多重共线性，你可以通过查看各个变量的\
  \ Wald 卡方值，剔除其中一个有问题的变量。保留那些 Wald 卡方值较高的变量。\n\n\n\n#### `PROC LOGISTIC` 中无 VIF 选项\n\
  \n多重共线性与逻辑回归或线性回归无关。这种现象完全集中在自变量上。因此，SAS 在逻辑回归中没有单独的 `VIF` 选项。就多重共线性的检测而言，您必须遵循与线性回归相同的步骤。对于变量选择或剔除，可以使用逻辑回归。简单来说，`PROC\
  \ LOGISTIC` 没有 `VIF` 选项；只有 `PROC REG` 有该选项。\n\n如果您在逻辑回归中写入 `VIF` 选项，SAS 会报错。以下是一个示例：\n\
  \n`NOTE: SAS 系统因错误而停止处理此步骤。`\n\n```\n704 proc logistic data=loans_data;\n705 model\
  \ SeriousDlqin2yrs = utilization Age Num_loans Num_dependents MonthlyIncome\n705!\
  \ Num_Savings_Acccts DebtRatio/vif;\n---\n22\n202\nERROR 22-322: 语法错误，期望以下之一：;,\
  \ ABSFCONV, AGGREGATE, ALPHA,\nBACKWARD, BEST, BINWIDTH, BUILDRULE, CL, CLODDS,\
  \ CLPARM, CODING, CONVERGE,\nCORRB, COVB, CT, CTABLE, DETAILS, DSCALE, EXPB, FAST,\
  \ FCONV, FIRTH, GCONV,\nHIERARCHY, INCLUDE, INFLUENCE, IPLOTS, ITPRINT, L, LACKFIT,\
  \ LINK, MAXITER,\nMAXSTEP, NOCHECK, NODUMMYPRINT, NOFIT, NOINT, NOLOGSCALE, OFFSET,\
  \ OUTROC,\nPARMLABEL, PEVENT, PL, PLCL, PLCONV, PLRL, PPROB, PSCALE, RIDGING, RISKLIMITS,\n\
  ROCEPS, RSQUARE, SCALE, SELECTION, SEQUENTIAL, SINGULAR, SLE, SLENTRY, SLS,\nSLSTAY,\
  \ START, STB, STEPWISE, STOP, STOPRES, TECHNIQUE, WALDCL, WALDRL, XCONV.\nERROR\
  \ 202-322: 无法识别该选项或参数，将被忽略。\n706 run;\n```\n\n因此，在逻辑回归的情况下，您必须使用 `PROC REG` 并遵循第\
  \ 10 章中说明的流程。\n\n### 逻辑回归最终检查清单\n\n到目前为止，我们已经讨论了与回归分析相关的所有重要概念。逻辑回归只是另一种类型的回归。它是众多行业垂直领域中使用最广泛的非线性回归模型之一。以下是构建逻辑回归模型时要使用的检查清单：\n\
  \n- **适用性**：查看数据和因变量。它是否是分类变量？是/否、0/1、赢/输等，这些都是可以应用逻辑回归的响应变量结果类型。\n- **卡方值**：查看整体卡方值以判断模型是否显著。如果卡方检验失败，则立即停止；整体模型本身并不显著。卡方检验不会告诉我们关于模型精确准确性的任何信息。\n\
  - **VIF**：多重共线性问题需要以与线性回归模型相同的方式解决（使用带有 `VIF` 选项的 `PROC REG`）。通过剔除有问题的变量或使用 PCA\
  \ 或 FA 来识别并解决此问题，如第 10 章的回归分析中所述。\n- **整体准确度/一致性**：通过查看模型的一致性和 C 值来确定模型的准确性。值越高，模型越好。如果一致性和\
  \ C 值不令人满意，则可以考虑收集更多数据或添加更好、更具影响力的自变量，这将提高整体模型性能。\n- **个体影响/瓦尔德卡方值**：通过查看瓦尔德卡方值来查看每个变量的个体影响。剔除不显著的变量。\n\
  \n### 贷款违约预测案例研究\n\n正如我们在本书中所做的那样，我们将通过一个真实案例研究来复习本章学到的概念。\n\n#### 背景与问题陈述\n\nABC\
  \ 银行有一个个人贷款产品。在批准贷款之前，它需要非常确定客户的还款能力。该银行从潜在客户那里收到数千份贷款申请，它需要有一种无懈可击的科学方法来批准或拒绝贷款申请。该银行决定使用数据分析来判断与每位客户相关的风险。\n\
  \nABC 银行拥有大量关于客户档案、他们以前的贷款、他们的信用卡支出、他们的银行账户等方面的历史数据。该银行拥有信用良好和信用不良客户的历史数据。在批准贷款之前识别出信用不良的申请人为银行节省了数百万美元。因此，在批准贷款时量化与每位客户相关的风险非常重要。\n\
  \n#### 目标\n\n分析历史贷款数据并构建一个模型，该模型将帮助银行在批准贷款时，根据相关风险对客户进行区分。\n\n#### 数据集\n\n该银行的历史数据包含违约者和非违约者的记录。数据收集时间跨度为两年。该数据集有\
  \ 150,000 名客户的记录。它还有一个响应/因变量，用于指示每位客户的信用度。每条记录中还有一些预测变量/自变量，用于指示客户的财务健康状况。这里给出的数据集对于模型构建练习来说是相当干净的。数据验证和清理工作已经完成。此外，变量中没有异常值或缺失值。\n\
