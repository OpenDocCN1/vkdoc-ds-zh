  \ -0.16166          | 0.17645        | -0.92   | 0.4114             |\n\n从上述结果中可以得出以下几点观察：\n\
  \n-   数据中只有 13 条记录。这是一个小样本，因此可用于分析的观测值很少。\n-   根据 T 检验，大多数变量对因变量完全没有影响。T 检验中所有变量的\
  \ P 值都大于 5%。\n-   即使是 F 检验也告诉你，整体模型是不显著的，因为 F 检验的 P 值为 22.76%，大于神奇的 0.5% 阈值。\n-\
  \   但 `R-square` 值仍然是 81.74%。\n\n这就是我们想指出的关键点。`R-square` 值从模型 1 到模型 2 从 75% 跃升到\
  \ 76%，然后最终模型 3 达到了 82%。如果你向模型 3 添加更多变量，`R-squared` 值还会进一步增加。因此，在根据 `R-squared` 值推断任何结论时，你需要谨慎。\n\
  \n在回归分析中，观测值少而自变量多是一种非常脆弱的情况。这就好比添加无关的自变量并因 `R-square` 值的增加而兴奋，是在欺骗自己。但实际上，整个模型本身可能毫无价值。\n\
  \n`R-squared` 的这种行为表明，我们需要一种不同的度量标准，能够为任何给定模型的预测能力提供可靠的度量。调整后的 `R-squared` 正是为此而生。\n\
  \n#### 调整后的 R 平方\n\n调整后的 `R-squared` 也是从 `R-squared` 推导出来的。我们对这个新的度量标准有何期望？调整后的\
  \ `R-squared` 预期应满足以下要求：\n\n-   一种能够反映模型中解释变异情况的度量。\n-   一种能在添加无关变量时惩罚模型的度量。\n-\
  \   一种能同时考虑模型中观测值数量和自变量数量的度量。\n-   一种只有在添加了显著或影响大的自变量时才会增加的度量。当向模型添加任何无关紧要或微不足道的变量时，它会减少。\n\
  \n调整后的 `R-squared` 满足了所有这些期望。以下是调整后的 `R-squared` 的公式：\n\n```\n调整后 R² = 1 - ((1 -\
  \ R²) * (n - 1) / (n - k - 1))\n```\n\n其中：\n\n-   `R²` 是通常的 `R-squared`。\n-   `n`\
  \ 是记录数。\n-   `k` 是自变量的数量。\n\n调整后的 `R-squared` 为每添加一个新的无关变量向 `R-squared` 增加一个惩罚项。只有在向模型添加有意义或影响大的变量时，它才会显示出增加。\n\
  \n让我们重新审视一下 `R-squared` 和调整后的 `R-squared` 的对比图；参见图 10-7。\n\n![A978-1-4842-0043-8_10_Fig7_HTML.jpg](img/A978-1-4842-0043-8_10_Fig7_HTML.jpg)\n\
  \n**图 10-7. 三个模型的 `R-squared` 和调整后的 `R-squared`**\n\n观察调整后的 `R-squared` 值，你可以得出结论：模型只需三个变量（`x1`\
  \ 到 `x3`）就能发挥其最大潜力。随着你继续添加新变量（`x4` 到 `x8`），调整后的 `R-squared` 显示出下降趋势。这表明从 `x4` 到\
  \ `x8` 的所有后续变量都是无关变量，它们对 `y` 没有影响。\n\n\n\n### 调整 R 方：附加示例\n\n对于智能手机销售示例，你将首先观察完整模型的结果；换句话说，回归模型将使用所有五个自变量。\n\
