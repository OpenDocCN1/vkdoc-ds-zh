  | `Responses_online` | 0.99337 | 1.00000 |\n| `Responses_online` | <.0001 | |\n\n\
  皮尔逊相关系数表中的相关矩阵显示了相关系数及其 p 值。预算与响应之间的相关性为 99.3%（.99337），表明关联性很强。任何接近 1（或-1）的数字都表示强关联。\n\
  \n**注意：** 同一表中的 p 值显示为<.0001。该 p 值是对零假设进行检验的结果，即当前样本的相关系数不显著。如果 p 值小于 5%，我们拒绝该零假设，这意味着相关系数是显著的。\n\
  \n类似地，你可以使用以下代码找到广告牌广告预算与相应响应之间的相关性：\n\n```\nproc corr data=add_budget ;\nvar Live_Budget\
  \ Responses_live ;\nrun ;\n```\n\n上述代码生成的输出结果如表 9-3 所示。\n\n**表 9-3.** 数据集合`add_budget`上`PROC\
