  \ |\n\n### 检验\n\n检验的类型取决于样本统计量及其分布。如果你的样本统计量是大样本的样本均值，那么你使用 `Z` 检验。如果你处理的是小样本的样本均值，或者你不知道总体的标准差，那么你使用\
  \ `T` 检验。让我们来看一个关于均值的 `T` 检验以及其他一些检验示例。\n\n\n\n## 均值的 t 检验\n\n您使用均值的 t 检验来检验零假设，例如总体均值等于某个特定值。当样本量较小时，您使用\
  \ t 检验。当样本量较大时，抽样分布服从正态分布。但当样本量较小时，样本均值不服从正态分布。小样本（小于 30）的样本均值服从自由度为 `n-1` 的 t 分布（其中\
  \ `n` 是样本量）。t 分布与正态分布相似。随着样本量的增加，t 分布趋近于正态分布。当样本量较小或总体标准差未知时，您使用 t 检验。\n\n**注意**\n\
  \n简单来说，自由度是指可以独立选择以形成特定 t 分布的观测值数量。在接下来的案例研究中，您将进一步处理自由度。t 检验的检验统计量与 Z 检验的检验统计量相同，区别在于\
  \ t 检验中您不知道总体的标准差。\n\n让我们通过一个简短的案例研究来应用迄今为止讨论的概念。\n\n### 案例研究：在 SAS 中检验均值\n\n设想一个商业场景：一家智能电视公司的城市营销经理想要为其新型电视型号制定营销策略。她希望制定一个有效的策略来触达客户。为此，她需要了解所在城市客户家庭的平均月支出。当地一家市场研究公司给出的平均支出估算是\
  \ 4,500 美元。经理对这个数字的准确性并不十分确信。她希望在将这一数字用于制定营销策略之前对其进行验证。她建议她的一名团队成员收集一些随机选择的家庭支出的样本数据。表\
  \ 8-6 包含了 27 个家庭的样本数据。\n\n**表 8-6.** 家庭样本的月支出数据\n\n| 序号 | 支出 |\n| --- | --- |\n\
  | 1 | 4650 |\n| 2 | 4248 |\n| 3 | 4961 |\n| 4 | 3200 |\n| 5 | 4438 |\n| 6 | 4993\
  \ |\n| 7 | 4620 |\n| 8 | 1100 |\n| 9 | 4237 |\n| 10 | 4991 |\n| 11 | 4533 |\n| 12\
  \ | 4457 |\n| 13 | 4663 |\n| 14 | 4613 |\n| 15 | 4484 |\n| 16 | 4997 |\n| 17 | 5027\
