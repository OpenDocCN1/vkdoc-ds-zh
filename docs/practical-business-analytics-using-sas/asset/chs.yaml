  \ Bill | 90 | 75 |\n| 4 | Fred | . | 86 |\n| 5 | Jeff | 75 | . |\n| 6 | John | 60\
  \ | . |\n| 7 | Mark | 80 | 78 |\n\n### 带条件的混合\n\n有时情况要求你从一个数据集中获取所有观测值，而从另一个数据集中仅获取匹配的观测值。换句话说，你想要数据集\
  \ 2 中的所有观测值，以及数据集 1 中仅匹配的值。\n\n表 4-27 展示了数据集 1 的示例，其中数学成绩完全填满，而科学成绩列有一些空值。\n\n**表\
  \ 4-27.** 示例数据集 1（科学列有两个空值）\n\n| 观测序号 | 姓名 | 数学 | 科学 |\n| --- | --- | --- | ---\
  \ |\n| 1 | Andy | 78 | 56 |\n| 2 | Bill | 90 | 75 |\n| 3 | Mark | 80 | 78 |\n| 4\
  \ | Jeff | 75 | . |\n| 5 | John | 60 | . |\n\n表 4-28 展示了数据集 2 的示例，其中数学列有一些空值。\n\n\
  **表 4-28.** 示例数据集 2（`maths` 列有两个空值）\n\n| 观测序号 | 姓名 | 数学 | 科学 |\n| --- | --- | ---\
  \ | --- |\n| 1 | Andy | 78 | 56 |\n| 2 | Bill | 90 | 75 |\n| 3 | Mark | 80 | 78\
  \ |\n| 4 | Fred | . | 86 |\n| 5 | Alex | . | 77 |\n\n首先，你从数据集 1 中获取所有观测值，并从数据集 2\
  \ 中仅获取匹配的观测值。代码如下：\n\n```\ndata final;\nMerge data1(in=a) data2(in=b);\nby var;\n\
  if a;\nrun;\n```\n\n`if a` 语句将保留数据集 1 中的所有条目以及数据集 2 中仅匹配的记录。类似地，你可以使用以下代码进行反向操作：\n\
  \n```\ndata final1;\nMerge data1(in=a) data2(in=b);\nby var;\nif b;\nrun;\n```\n\
  \n`if b` 语句将保留数据集 2 中的所有条目以及数据集 1 中仅匹配的记录。\n\n如果你希望保留同时出现在两个数据集中的记录，可以使用 `if a and\
  \ b` 语句，如下所示：\n\n```\ndata final2;\nMerge data1(in=a) data2(in=b);\nby var;\nif\
  \ a and b;\nrun;\n```\n\n作为练习，你可以打印数据集 `final`、`final1` 和 `final2` 来验证结果。\n\n\n\n\
  ### 匹配合并\n\n在本节中，为了演示匹配合并的概念，您将使用数据合并部分中的 `students1` 和 `students2` 数据集。您可能还记得，这两个数据集都只有两列。以下代码用于保留\
  \ `students1` 中的所有记录，以及 `students2` 中的匹配记录：\n\n```\n/*matched merging example-1\
  \ */\nproc sort data=students1;\nby name;\nrun;\n\nproc sort data=students2;\nby\
  \ name;\nrun;\n\ndata studentmerge1;\nMerge students1(in=a) students2(in=b);\nby\
  \ name;\nif a;\nrun;\n```\n\n上述代码的日志文件如下：\n\n```\nNOTE: There were 5 observations\
