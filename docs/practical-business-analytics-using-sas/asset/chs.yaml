  \ SORT`\n\n数据排序用于按升序或降序排列数据或呈现结果。表 4-14 展示了相关代码及其解释。\n\n```\nproc sort data=<数据集>;\n\
  by <变量>;\nrun;\n```\n\n```\nproc sort data=<数据集> out=<新数据集>;\nby <变量>;\nrun;\n```\n\
  \n**表 4-14.** `proc sort` 通用代码及解释\n\n| 代码 | 解释 |\n| --- | --- |\n| `proc sort` |\
  \ 调用排序过程 |\n| `data=<数据集>;` | 数据集名称 |\n| `by <变量>;` | 排序变量 |\n\n`out=<新数据集>;` 选项用于避免排序后覆盖原始数据集。另需注意，若执行\
  \ `proc sort` 代码时发生错误，且未指定 `out` 选项，则可能丢失原始数据集。\n\n#### `PROC SORT` 示例\n\n电信账单数据包含客户\
  \ ID、账户开始日期、账单编号、账单金额及其他详细信息。你希望按账单金额对数据进行排序，并查看数据集中前 20 位付款额最高的客户。\n\n以下代码按账单金额排序，并将输出保存至另一个数据集。\n\
  \n```\nproc sort data=MYDATA.bill out=mydata.bill_top;\nby Bill_Amount;\nrun;\n\
  ```\n\n```\nproc print data=mydata.bill_top (obs=20);\nrun;\n```\n\n表 4-15 列出了此代码的结果。\n\
