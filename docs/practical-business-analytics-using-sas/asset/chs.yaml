  \    | 70%    | 70%    |\n| 年龄   | 34     | 40     | 50     |\n| 贷款笔数 | 2      |\
  \ 5      | 5      |\n| 家属人数 | 3      | 4      | 4      |\n| 月收入 | 8000   | 5000\
  \   | 2500   |\n| 负债率 | 20%    | 45%    | 55%    |\n\n将这些值代入逻辑回归方程，即可得到计算出的概率值（表\
  \ 11-30）：\n\n**表 11-30.** 预测的违约概率\n\n| 客户   | 预测违约概率 | 决策              |\n|----------|-----------------|-----------------------|\n\
  | 汤姆     | 0.0047 (5%)     | 批准贷款              |\n| 大卫     | 0.56 (56%)      | 拒绝贷款申请\
  \          |\n| 汉克斯   | 0.79 (79%)      | 拒绝贷款申请          |\n\n因此，只有汤姆获得了贷款。通常，银行可能不会拒绝所有概率超过\
  \ 50%的客户。他们可能会为高风险客户批准较低额度的贷款，或者收取更高的利率并降低贷款金额。表 11-31 可能是最终违约模型的一种适度实施示例。\n\n**表\
  \ 11-31.** 使用违约概率范围进行决策\n\n| 违约概率范围 | 决策                      |\n|-----------------|-----------------------------|\n\
  | 0%-45%          | 批准贷款申请                |\n| 45%-65%         | 批准贷款申请，但降低贷款额度\
  \ |\n| 65%             | 拒绝贷款申请                |\n\n银行会将此模型及决策表发送给一线团队，或者将模型安装在集中式系统中，供贷款处理团队访问。该模型将作为评估任何贷款申请的主要工具。这一决策方法科学合理，准确性较高，并基于对相关客户数据的分析。\n\
  \n## 结论\n\n本章我们讨论了线性回归不适用于二分因变量。逻辑曲线最适合此类因变量。如果因变量只有两个等级，则需要使用逻辑回归，也称为二项逻辑回归。如果响应变量有两个以上的等级，例如好/坏/不确定、赢/输/平局或满意/不满意/中性，则需要使用多项逻辑回归。\n\
  \n您学习了如何使用 SAS 拟合逻辑回归线，并观察了其输出（与线性回归相比）的一些异同。逻辑回归线也存在多重共线性问题；然而，处理多重共线性的过程与线性回归相同。此外还有其他非线性回归。逻辑回归并非唯一的非线性回归。完成本章后，您就结束了与回归相关的主题，接下来将在后续章节中学习其他建模方法，例如\
  \ ARIMA。\n\n"
- "# 12. 时间序列分析与预测\n\n在本章中，我们将直接通过几个示例介绍时间序列预测的概念。我们将讨论一家广受欢迎的银行，该银行已向客户提供信用卡服务超过十年。每个月，该银行都有一些客户申请破产。一些客户逾期超过六个月仍未偿还贷款，最终需要将其核销。显然，这对银行而言，无论是金额还是账户数量都是一种损失。银行能否主动预测其各个投资组合的这些损失？银行能否主动采取必要措施来控制损失，并判断未来损失是否会激增？银行如何根据历史数据预测此类损失？\n\
  \n让我们考虑另一个示例。一个联络中心或业务流程外包（BPO）流程每月接收并处理数千个电话。每天的来电数量并不相同。通话量因周末或工作日、早晨或傍晚而异。BPO\
  \ 中心能否预测通话量，以便更好地管理资源和员工排班？同样，一个问题随之而来：如何预测未来的通话量？\n\n另一个示例是一家笔记本电脑制造公司，其业务已开展了三十年。该公司有数款新机型将在未来几个月内推出。公司能否确定总体目标市场？能否根据历史数据预估未来两个季度的销售额？\n\
  \n许多公司跟踪与经济相关的变量，例如国内生产总值（GDP）、增长率指数、失业率等。基于历史数值，能否预测这些变量的未来值？如果可以，每个人都希望获得这些数据。\n\
  \n同样，能否根据过去几年的数据预测股票价格？能否预测网站的访问者数量？如何预测电视节目的观众人数？\n\n有许多这样的业务场景涉及预测随时间变化的变量。这些变量的预测时间线可以是天、月、季度、年，甚至秒和毫秒。基本上，任何代表时间线的单位都可以。对于大多数此类业务场景，您都可以使用时间序列分析和预测技术。这些技术是本章讨论的主题。\n\
  \n\n\n## 什么是时间序列过程？\n\n任何一个随时间变化的、且间隔固定的过程，都是时间序列过程。如果你谈论的是月度数据，且两个月之间的间隔是一个月，那么你每月都应该有一个变量值，才能将其定义为时间序列过程。\n\
  \n时间序列数据是从一个过程收集到的、具有相同时间间隔的观测值序列。简单来说，任何随时间测量的指标，只要任意两个连续时间点之间的时间间隔相同，就是一个时间序列过程。下文将展示一些时间序列图作为示例。\n\
  \n我们用 `Y[t]` 表示一个时间序列，其中 `Y` 是时间点 `t` 上的指标值。请参考表 12-1，该表以图 12-1 的形式呈现。这是一个语音处理业务流程外包公司过去两年的每日通话量示例。\n\
  \n![A978-1-4842-0043-8_12_Fig1_HTML.jpg](img/A978-1-4842-0043-8_12_Fig1_HTML.jpg)\n\
  \n**图 12-1.** 语音处理业务流程外包公司的每日通话量\n\n**表 12-1.** 语音处理业务流程外包公司每日通话量\n\n| 日期 | 表示符号\
  \ | 通话量 |\n| --- | --- | --- |\n| 2014/10/25 | `Y[t]` | 99,552 |\n| 2014/10/24 |\
  \ `Y[t-1]` | 113,014 |\n| 2014/10/23 | `Y[t-2]` | 118,502 |\n| 2014/10/22 | `Y[t-3]`\
  \ | 119,437 |\n| 2014/10/21 | | 123,410 |\n| 2014/10/20 | | 129,368 |\n| 2014/10/19\
  \ | | 135,961 |\n| 2014/10/18 | | 131,698 |\n| ... | ... | ... |\n| ... | ... |\
  \ ... |\n| 2014/2/23 | `Y[t-p]` | 113,214 |\n\n图 12-2 展示了笔记本电脑月度销售数据的时间序列示例。\n\n\
  ![A978-1-4842-0043-8_12_Fig2_HTML.jpg](img/A978-1-4842-0043-8_12_Fig2_HTML.jpg)\n\
  \n**图 12-2.** 笔记本电脑月度销售的时间序列数据\n\n图 12-3 展示了美国过去 50 年的国内生产总值时间序列图。该 GDP 按购买者价格计算，是经济体内所有常驻生产者创造的总附加值之和。在计算产品价值时，已适当考虑了产品税和补贴。没有必要深入了解\
  \ GDP 的具体计算方式。\n\n![A978-1-4842-0043-8_12_Fig3_HTML.jpg](img/A978-1-4842-0043-8_12_Fig3_HTML.jpg)\n\
  \n**图 12-3.** 美国 GDP 的时间序列数据（来源：世界银行，[`http://data.worldbank.org/country?display=graph`](http://data.worldbank.org/country?display=graph)）\n\
  \n图 12-4 展示了美国移动蜂窝网络订阅数（每百人）的时间序列图。\n\n![A978-1-4842-0043-8_12_Fig4_HTML.jpg](img/A978-1-4842-0043-8_12_Fig4_HTML.jpg)\n\
  \n**图 12-4.** 美国移动蜂窝网络订阅数，每百人（来源：世界银行，[`http://data.worldbank.org/indicator/IT.CEL.SETS.P2`](http://data.worldbank.org/indicator/IT.CEL.SETS.P2)）\n\
  \n## 时间序列分析的主要阶段\n\n在本章中，你已经看到了几个时间序列数据的示例。时间序列分析的目的是理解数据的历史时间线，通过分析揭示隐藏的模式，并最终对这些模式进行建模以用于预测。时间序列分析主要分为三个阶段（图\
  \ 12-5）。\n\n![A978-1-4842-0043-8_12_Fig5_HTML.jpg](img/A978-1-4842-0043-8_12_Fig5_HTML.jpg)\n\
  \n**图 12-5.** 时间序列分析的主要阶段：描述性分析 → 建模 → 预测未来值\n\n在描述性阶段，你试图理解时间序列的本质。你要尝试回答诸如趋势是上升还是下降、过程中是否存在季节性趋势等问题。在数据中寻找模式是至关重要的一步。在建模或模式发现阶段，你对时间序列数据的内在特性进行建模。在时间序列分析过程中，有几种寻找模式的方法。\n\
  \n一旦识别出模式，预测就相对容易了。利用模型预测未来值是很简单的。在下一节中，你将看到一些建模技术。在应用这些技术之前，先使用描述性统计方法对数据有一个基本的了解会有所帮助。在前面几章中，你已经学习了预测建模。通常，在预测建模中，你使用一组\
  \ `X` 变量值来预测因变量 `Y`。在时间序列分析中，情况则不同。这里，你使用 `Y` 的先前值来预测 `Y`。以下数学表示有助于进一步阐明这一区别：\n\n\
  | 预测建模 | `Y` 与 `X[1,] X[2,] ... X[p]` 的关系 |\n| 时间序列分析 | `Y` 与 `Y` 的关系（`Y[t]` 与 `Y[t-1]`\
  \ 的关系） |\n\n## 建模方法论\n\n对时间序列进行建模有几种技术，既有简单的，也有启发式的。所有这些建模技术主要可以分为两类：启发式方法和正规的统计方法。简单的启发式或直觉性方法存在一些主要缺陷。几乎没有什么统计检验来支持这些过于简化的启发式方法。因此，本书的讨论仅限于更科学的统计方法。主要焦点将放在\
  \ Box–Jenkins 方法（或 ARIMA 技术）上，这可能是时间序列领域最常用的技术之一。\n\n## Box–Jenkins 方法\n\nGeorge\
  \ Box 和 Gwilym Jenkins 推广了用于时间序列建模的自回归积分滑动平均（ARIMA）技术。ARIMA 方法实际上并非由 Box 和 Jenkins\
  \ 发明，但他们在简化该技术方面做出了重要贡献。为了理解使用 Box–Jenkins 方法进行模型构建，你首先需要理解诸如 `ARIMA`、`AR`、`MA`\
  \ 和 `ARMA` 过程等术语。\n\n### 什么是 ARIMA？\n\n如果一个时间序列模型遵循某些规则，则被称为 ARIMA 模型。其中一个规则是时间序列的值应落在特定范围内。本章后面的章节会再回到\
  \ ARIMA 的讨论。\n\n\n\n#### AR 过程\n\n自回归（AR）过程是指序列的当前值依赖于其先前值的过程。自回归也是一个形象化的名称，表明它是对自身进行的回归。自回归过程用`AR(p)`表示，其中`p`是自回归过程的阶数。在\
  \ AR 过程中，序列的当前值是先前值的因子。`P`决定了序列当前值依赖于多少个先前值。\n\n例如，考虑`Y[t]`、`Y[t-1]`、`Y[t-2]`、`Y[t-3]`、`Y[t-4]`、`Y[t-5]`、`Y[t-6]`、……、`Y[t-k]`，这些构成了一个时间序列。如果该序列是`AR(1)`序列，那么在给定时间`t`的`Y`值将是其在时间`t-1`时值的因子。\n\
  \n```\nY[t] = a[1]*Y[t-1] + ε[t]\n```\n\n`a[1]`是`Y[t-1]`对`Y[t]`影响的因子或量化影响，而`ε[t]`是在时间`t`的随机误差。`ε[t]`也被称为白噪声。当我说在任何给定时间`t`的`Y`值是其时间`t-1`时值的因子时，它可能并不完全等于`a[1]*Y[t-1]`。它可能略高于或略低于`a[1]*Y[t-1]`。但你无法精确说出`ε[t]`的值会是多少。它只是时间`t`上一个微小的随机值，可能为正也可能为负。这一项（`ε[t]`）在实际的时间序列模型中无法具体量化，因为它在不同的时间点取值不同。\n\
  \n对于一个`AR(2)`序列，时间`t`的`Y`值将是时间`t-1`和`t-2`时值的因子。\n\n```\nY[t] = a[1]*Y[t-1] + a[2]*Y[t-2]\
  \ + ε[t]\n```\n\n`a[1]`是`Y[t-1]`对`Y[t]`影响的因子或量化影响，而`a[2]`是`Y[t-2]`对`Y[t]`的量化影响。\n\
  \n同样地，对于一个`AR(p)`序列，`Y`将依赖于直到时间点`t-p`的先前`Y`值。\n\n```\nY[t] = a[1]*Y[t-1] + a[2]*Y[t-2]\
  \ + a[3]*Y[t-3] + ... + a[p]*Y[t-p] + ε[t]\n```\n\n`a[1]`、`a[2]`、`a[3]`、……、`a[p]`分别是`Y[t-1]`、`Y[t-2]`、……、`Y[t-p]`对`Y[t]`的量化影响。\n\
  \n让我们看一个销售领域的例子。如果你遇到一个销售序列，其中当前月的销售额依赖于前一个月的销售额，那么你将称其为`AR(1)`序列。\n\n下面的等式和图 12-6\
  \ 展示了一个针对时间序列销售数据的`AR(1)`过程：\n\n```\nY[t] = 0.76*Y[t-1] + ε[t]\n```\n\n![A978-1-4842-0043-8_12_Fig6_HTML.jpg](img/A978-1-4842-0043-8_12_Fig6_HTML.jpg)\n\
  \n图 12-6. 典型的 AR(1)时间序列方程图（产品销售额随时间变化）\n\n下面的等式和图 12-7 展示了一个针对不同产品的时间序列销售数据的`AR(2)`过程：\n\
  \n```\nY[t] = 0.45*Y[t-1] + 0.48*Y[t-2] + ε[t]\n```\n\n![A978-1-4842-0043-8_12_Fig7_HTML.jpg](img/A978-1-4842-0043-8_12_Fig7_HTML.jpg)\n\
  \n图 12-7. 典型的 AR(2)时间序列方程图（产品销售额随时间变化）\n\n请注意，图 12-6 和图 12-7 是典型示例，但并非每个`AR(1)`或`AR(2)`图形都会看起来像这样。即使在相同阶数的`AR(p)`过程中，时间序列图的形状也会因方程的不同而不同。仅通过观察时间序列曲线的形状来确定\
  \ AR 过程的阶数并不容易。\n\n#### MA 过程\n\n移动平均（MA）过程是一种时间序列过程，其中序列的当前值和先前值几乎相同。但序列的当前偏差依赖于之前的白噪声或误差或冲击（即`ε[t]`、`ε[t-1]`等）。通常，`ε[t]`被视为一个不可观测项。它可能是由于某些未知原因导致的当前序列微小的随机变化；也可能源于某些外部效应。例如，在研究销售趋势时，销售中观察到的微小随机变化可能是由外部因素如偶然的降雨、降雪或异常炎热天气造成的。在\
  \ AR 过程中，`Y[t]`依赖于`Y`的先前值，而在 MA 过程中，`Y[t-1]`完全不会出现。它关注的是序列中的短期冲击；MA 与长期趋势无关，不像 AR\
  \ 过程那样。在 MA 过程中，序列的当前值是先前误差的因子。就 MA 过程的表示法而言，`MA(q)`是`AR(p)`的对应物。这里`q`决定了有多少个先前的误差值会影响\
  \ MA 序列的当前值。`ε[t]`、`ε[t-1]`、`ε[t-3]`、……、`ε[t-k]`表示在时间`t`、`t-1`、……、`t-k`处的误差、冲击或白噪声。\n\
  \n如果一个序列是`MA(1)`，那么时间`t`的偏差将是时间`t`和`t-1`处误差的因子。\n\n```\nY[t] - μ = ε[t] + b[1]*ε[t-1]\n\
  ```\n\n在上面的等式中：\n\n- `b[1]`是`ε[t-1]`对当前偏差影响的因子或量化影响。\n- `μ`是整个序列的均值。\n- `Y[t] -\
  \ μ`是时间`t`的偏差。\n\n注意，此等式中没有`Y[t-1]`项。当前误差和先前误差仅构成等式的右侧部分。\n\n如果一个序列是`MA(2)`，那么时间`t`的偏差将是时间`t`、`t-1`和`t-2`处误差的因子。\n\
  \n```\nY[t] - μ = ε[t] + b[1]*ε[t-1] + b[2]*ε[t-2]\n```\n\n在上面的等式中：\n\n- `b[1]`和`b[2]`分别是`ε[t-1]`和`ε[t-2]`对当前偏差影响的因子或量化影响。\n\
  - `μ`是整个序列的均值。\n- `Y[t] - μ`是时间`t`的偏差。\n\n类似地，对于一个`MA(q)`序列，时间`t`的偏差将是时间`t`、`t-1`、……、`t-q`处误差的因子。\n\
  \n```\nY[t] - μ = ε[t] + b[1]*ε[t-1] + b[2]*ε[t-2] + ... + b[q]*ε[t-q]\n```\n\n\
  你可能会注意到，AR 分量是一个长期趋势分量，而 MA 分量则是一个短期分量。\n\n下面的等式和图 12-8 展示了一个针对时间序列销售数据的`MA(1)`过程：\n\
  \n```\nY[t] = ε[t] + 0.3*ε[t-1]\n```\n\n![A978-1-4842-0043-8_12_Fig8_HTML.jpg](img/A978-1-4842-0043-8_12_Fig8_HTML.jpg)\n\
  \n图 12-8. 典型的 MA(1)时间序列方程图（产品销售额随时间变化）\n\n下面的等式和图 12-9 展示了一个针对时间序列销售数据的`MA(2)`过程：\n\
  \n```\nY[t] = ε[t] + 0.1*ε[t-1] + 0.3*ε[t-2]\n```\n\n![A978-1-4842-0043-8_12_Fig9_HTML.jpg](img/A978-1-4842-0043-8_12_Fig9_HTML.jpg)\n\
  \n图 12-9. 典型的 MA(2)时间序列方程图（产品销售额随时间变化）\n\n正如对`AR(p)`序列所讨论的，任何`MA(q)`序列曲线的形状也取决于实际参数。即使两个`MA(q)`序列的阶数相同，它们的图形形状也可能根据各自方程中的实际参数值而有所不同。\n\
  \n\n\n#### ARMA 过程\n\n如果一个过程同时具备自回归过程和移动平均过程的特性，则称其为 ARMA 过程。在 ARMA 时间序列过程中，序列的当前值取决于其先前值。ARMA\
  \ 过程中与均值的微小偏差是先前误差的一个因素。你可以将 ARMA 过程视为一个同时具有长期趋势和短期季节性的序列。`ARMA(p,q)` 是 ARMA 过程的一般表示法，其中\
  \ `p` 是 AR 过程的阶数，`q` 是 MA 过程的阶数。\n\n例如，如果 `Y[t]`, `Y[t-1]`, `Y[t-2]`, `Y[t-3]`,\
  \ `Y[t-4]`, `Y[t-5]`, `Y[t-6]`, ..., `Y[t-k]` 是时间序列中的值，而 `ε[t]`, `ε[t-1]`, `ε[t-2]`,\
  \ ..., `ε[t-k]` 分别是时刻 `t`, `t-1`, `t-2`, ..., `t-k` 的误差，那么一个 `ARMA(1,1)` 过程可以写成如下形式：\n\
  \n```\nYt = a1*Yt-1 + εt + b1*εt-1\n```\n\n`a[1]` 是 `Y[t-1]` 对 `Y[t]` 的影响因子或量化影响，`ε[t]`\
  \ 是时刻 `t` 的随机误差。`b[1]` 是 `ε[t-1]` 对当前值的影响因子或量化影响。\n\n一个 `ARMA(2,1)` 过程可以写成如下形式：\n\
  \n```\nYt = a1*Yt-1 + a2*Yt-2 + εt + b1*εt-1\n```\n\n`a[1]` 和 `a[2]` 是 `Y[t-1]`\
  \ 和 `Y[t-2]` 对 `Y[t]` 的量化影响，`ε[t]` 是时刻 `t` 的随机误差。`b[1]` 是 `ε[t-1]` 对当前值的影响因子或量化影响。\n\
  \n类似地，通用的 `ARMA(p,q)` 过程可以写成如下形式：\n\n```\nY[t] = a[1]*Y[t-1] + a[2]*Y[t-2] + a[3]*Y[t-3]\
  \ + ... + a[p]*Y[t-p] + ε[t] + b[1]*ε[t-1] + b[2]*ε[t-2] + ... + b[q]*ε[t-q]\n```\n\
  \n`a[1]`, `a[2]`, `a[3]`, ..., `a[p]` 是 `Y[t-1]`, `Y[t-2]`, ..., `Y[t-p]` 对 `Y[t]`\
  \ 的量化影响，`b[1]`, `b[2]`, ..., `b[q]` 是 `ε[t-1]`, `ε[t-2]`, ..., `ε[t-q]` 对 `Y[t]`\
  \ 的影响因子或量化影响。\n\n图 12-10 中的方程和图形表示一个典型销售时间序列数据的 `ARMA(1,1)` 过程：\n\n```\nY[t] = 0.75*Y[t-1]\
  \ + ε[t] + 0.2*ε[t-1]\n```\n\n![A978-1-4842-0043-8_12_Fig10_HTML.jpg](img/A978-1-4842-0043-8_12_Fig10_HTML.jpg)\n\
  \n**图 12-10.** 一个典型的 `ARMA(1,1)` 时间序列方程图（产品销量随时间变化）\n\n图 12-11 中的以下方程和图形表示时间序列销售数据的\
  \ `ARMA(2,1)` 过程：\n\n```\nY[t] = 0.35*Y[t-1] + 0.45*Y[t-2] + ε[t] + 0.1*ε[t-1]\n\
  ```\n\n![A978-1-4842-0043-8_12_Fig11_HTML.jpg](img/A978-1-4842-0043-8_12_Fig11_HTML.jpg)\n\
  \n**图 12-11.** 一个典型的 `ARMA(2,1)` 时间序列方程图（产品销量随时间变化）\n\n现在你知道了什么是 ARMA 过程。并且你也能够构想一个通用\
  \ `ARMA(p,q)` 过程的方程。现在，你已经准备好学习用于时间序列建模的 Box–Jenkins ARIMA 方法。\n\n### 通过视力测量类比理解\
  \ ARIMA\n\n我将使用一个与视力测量和配镜处方相关的类比作为例子来解释一个严肃的概念。如今有很多复杂的设备用于测量人类视力。准确测量视力并获得正确的眼镜处方相对容易。但在几十年前，在今天这些精密且计算机化的视力测试仪器出现之前，医生是手动完成这项任务的。今天，几乎每个看过眼科医生的人都可能很容易认出图\
  \ 12-12 中展示的图片。它被称为斯内伦视力表（尽管这个名字不如视力表本身那样常见）。\n\n![A978-1-4842-0043-8_12_Fig12_HTML.jpg](img/A978-1-4842-0043-8_12_Fig12_HTML.jpg)\n\
  \n**图 12-12.** 一张斯内伦视力表（来源：维基百科）\n\n为了测试视力并开具眼镜处方，医生会进行一个小测试。过去，医生不使用特殊设备，而是有一个装满各种镜片（不同度数）的盒子。患者被要求坐在椅子上，并戴上空的镜架。医生会依次将不同度数的镜片放入镜架，并让患者阅读斯内伦视力表。例如，有些患者能读出最上面的七行，但在下面几行感到困难。然后医生移除第一个镜片，换上另一个。经过多次这样的反复，医生最终根据患者眼镜所需的精确镜片做出决定。有些患者被诊断为近视，有些则为远视。这个过程的基本假设是所有患者都是有读写能力的。但如果患者是文盲，一个字母都认不出来怎么办？\n\
  \n因此，视力测定和处方开具过程中的主要步骤可以列举如下：\n\n1. 假设患者有读写能力。\n2. 根据一些测试，确定是近视还是远视，并粗略估计视力状况。\n\
  3. 通过尝试各种镜片来精确估计视力。\n4. 使用测试结果开具处方。\n\n类似的类比可以应用于 Box–Jenkins 方法。假设你手头有一个时间序列，并且你想预测该序列中的一些未来值。你首先需要识别该时间序列过程是\
  \ AR 过程、MA 过程还是 ARMA 过程。你还需要识别 `AR(p)`、`MA(q)` 或 `ARMA(p,q)` 过程（视情况而定）的阶数 `p` 和\
  \ `q`。一旦你确定了序列的类型和阶数，就可以尝试写出序列方程。你已经熟悉了 `AR(p)`、`MA(q)` 和 `ARMA(p,q)` 方程。下一步是找到相应的参数，如\
  \ `a[1]`、`a[2]`、...、`a[p]` 以及 `b[1]`、`b[2]`、...、`b[q]`。在你开始识别模型之前，需要做一个假设：序列必须是平稳的（在接下来的章节中，我会详细解释平稳时间序列）。这是为了简化整个模型识别过程。表\
  \ 12-2 使用配镜处方的类似来说明 Box–Jenkins 方法。之后我将讨论 Box–Jenkins 方法中涉及的各个步骤。\n\n**表 12-2.**\
  \ 视力测试与 Box–Jenkins 方法之间的类比\n\n| 视力测试 | Box–Jenkins 方法 |\n| --- | --- |\n| 假设患者有读写能力。\
  \ | 假设时间序列是平稳的；否则，使其平稳化。 |\n| 根据一些测试，确定是近视还是远视，并粗略估计视力状况。 | 根据图形（ACF 和 PACF 函数，本章稍后会解释），确定模型是\
  \ AR、MA 还是 ARMA 过程。 |\n| 通过尝试各种镜片来精确估计视力。 | 估计参数，如 `a[1]`、`a[2]`、...、`a[p]` 以及 `b[1]`、`b[2]`、...、`b[q]`。\
  \ |\n| 使用测试结果开具处方。 | 使用最终模型进行预测。 |\n\n### Box–Jenkins 方法的步骤\n\n我将再次展示一个时间序列预测问题。考虑某只优质股票在一段时间内的一些时间序列数据。假设你有过去一年的股价数据。再假设你想预测接下来一周的股价。你将使用\
  \ Box–Jenkins 方法进行此预测。首先，你需要确保股价时间序列过程是平稳的。然后，你需要确定过程的类型，即哪种过程最接近股价数据遵循的模式。它是 AR\
  \ 过程、MA 过程还是 ARMA 过程？一旦你有了基本的模型方程，你就可以估计参数。成功完成所有这些步骤即完成了模型构建过程。现在你有了最终的方程，可用于预测所考虑股票的未来价值。在继续进行最终预测和模型部署之前，你还需要查看模型的准确性或误差率。接下来是对每一步的详细解释。\n\
  \n#### 步骤 1：检验时间序列是否平稳\n\n如果一个时间序列过程是平稳的，那么使用 Box–Jenkins 方法构建模型就会容易得多。\n\n\n\n\
  ##### 什么是平稳时间序列？\n\n克里斯·查特菲尔德博士在《时间序列分析：导论》（Chapman and Hall，2003）中指出：“如果时间序列的均值不存在系统性变化（无趋势），方差不存在系统性变化，且严格周期性变动已被移除，则该时间序列可称为平稳的。”平稳时间序列处于统计均衡状态。如果序列在特定范围内波动，且该序列均值和方差的历史或未来值不会异常偏高，那么该序列可被理解为平稳序列。在平稳时间序列过程中，均值和方差围绕单一数值波动。随着序列的增长，如果序列的均值和方差也趋于极度增大，则该序列被视为非平稳的。在非平稳时间序列中识别模式较为困难，模型构建也可能颇具挑战。非常数均值或非常数方差是非平稳时间序列过程的标志（图\
  \ 12-13）。这些过程也称为爆炸性过程。\n\n![A978-1-4842-0043-8_12_Fig13_HTML.jpg](img/A978-1-4842-0043-8_12_Fig13_HTML.jpg)\n\
  \n图 12-13.\n\n非平稳时间序列示例\n\n在某些情况下，识别非平稳时间序列较为容易。你需要问两个问题：\n\n*   在时间无穷大时，序列的均值会是多少？\n\
  *   在时间无穷大时，序列的方差会是多少？\n\n如果这两个问题中任一问题的答案是无穷大，那么你可以稳妥地得出结论：所考察的序列是非平稳的。随着非平稳序列的增长，你可以看到序列数值开始过度膨胀；事实上，它们很快就会趋于失控。在这种情况下，使用\
  \ Box-Jenkins 方法预测序列数值变得极为困难。现实场景中可能会遇到许多非平稳序列。你可能需要对其进行变换或差分以使其平稳。后续章节将详细介绍序列变换和差分的细节。\n\
  \n图 12-14 展示了一个平稳时间序列的示例图。\n\n![A978-1-4842-0043-8_12_Fig14_HTML.jpg](img/A978-1-4842-0043-8_12_Fig14_HTML.jpg)\n\
  \n图 12-14.\n\n平稳时间序列示例\n\n在图 12-14 中，序列图呈现出一定的稳定性。它并未从其均值线过度膨胀。在这种情况下，方差或均值的数值也将表现出稳定性或均衡状态。到目前为止，我已多次强调，仅凭曲线形状得出结论并非好方法。你需要一种经过科学验证的统计方法来判断序列是否平稳。事实上，曲线形状有时可能具有误导性，并导致错误结论。例如，让我们看看图\
  \ 12-15 所示的序列，该图展示了微软股票价格的每周波动。图中数据显示的是 2010 年 1 月至 2014 年 9 月微软的股票价格（来源：[`http://finance.yahoo.com/echarts?s=MSFT`](http://finance.yahoo.com/echarts?s=MSFT)）。仅凭曲线形状，你无法明确判断它是平稳序列还是非平稳序列。你需要一个可靠的检验来测试平稳性。\n\
  \n![A978-1-4842-0043-8_12_Fig15_HTML.jpg](img/A978-1-4842-0043-8_12_Fig15_HTML.jpg)\n\
  \n图 12-15.\n\n某上市公司每周股票价格的时间序列数据\n\n##### 使用 DF 检验测试平稳性\n\n要测试序列的平稳性，可以使用迪基-富勒检验。DF\
  \ 检验和增广迪基-富勒检验背后的实际理论较为复杂，超出了本书的讨论范围。以下是对 DF 检验的简化实用说明，可能足以满足实际应用需求。\n\nDF 检验的零假设和备择假设如下：\n\
  \n*   `H[0]`：序列不是平稳的。\n*   `H[1]`：序列是平稳的。\n\n因此，你执行 DF 检验并记录`P 值`。观察 DF 检验的`P 值`，如果`P\
  \ 值`小于 5%（0.05），则拒绝零假设，这相当于拒绝“序列不是平稳的”这一假设。因此，当 DF 检验的`P 值`小于 0.05 时，可得出序列平稳的结论。另一方面，如果`P\
  \ 值`大于 0.05，则继续接受零假设，这意味着序列不是平稳的。\n\n\n好的，作为高级文档工程师和翻译员，我将严格按照您的要求，将以下英文文本翻译成中文。\n\
  \n\n###### 用于检验平稳性的 SAS 代码\n\n以下是用于检验序列平稳性的 SAS 代码。假设微软股票价格数据已导入 SAS 环境，并存储在名为 `ms`\
  \ 的数据集中。\n\n```\nproc arima data= ms;\nidentify var= stock_price stationarity=(DICKEY);\n\
  run;\n```\n\n以下是对这段代码的解释：\n\n- `proc arima`：`arima` 是用于拟合 ARIMA 模型的过程。\n- `data=\
  \ ms;`：数据集名称为 `ms`。\n- `identify var= stock_price`：这指定了时间序列变量，在此例中为 `Adj_close`。\n\
