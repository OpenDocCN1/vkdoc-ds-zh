  \n让我们暂时忘记因变量，观察自变量之间的相互关联。代码如下：\n\n```\nproc corr data=sat_score;\nvar General_knowledge\
  \ Aptitude Mathematics Science ;\nrun;\n```\n\n表 10-23 显示了此代码的输出。\n\n**表 10-23.\
