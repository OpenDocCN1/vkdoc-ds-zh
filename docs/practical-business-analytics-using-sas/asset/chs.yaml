  \ 来执行操作。\n\n### 启动 Hive\n\n要启动 Hive，你只需输入命令 `hive`。请参考图 13-16。\n\n![A978-1-4842-0043-8_13_Fig16_HTML.jpg](img/A978-1-4842-0043-8_13_Fig16_HTML.jpg)\n\
  \n图 13-16. 启动 Hive\n\n`show tables` 命令将显示 Hive 中现有的表。此命令将显示 Hive 中的默认表和之前表名。请参考图\
  \ 13-17。\n\n![A978-1-4842-0043-8_13_Fig17_HTML.jpg](img/A978-1-4842-0043-8_13_Fig17_HTML.jpg)\n\
  \n图 13-17. Hive 中的现有表\n\n\n\n### 使用 Hive 创建表\n\n至此，您已了解到 Hive 就像是 Hadoop 上的一个 SQL\
  \ 引擎。接下来，如同在 SQL 中一样，您需要设计一个表并向其中填充数据。创建表所使用的代码请参考图 13-18。\n\n![A978-1-4842-0043-8_13_Fig18_HTML.jpg](img/A978-1-4842-0043-8_13_Fig18_HTML.jpg)\n\
  \n图 13-18. 在 Hive 中创建表\n\n现在表已创建完成，以下是用 HDFS 上的数据填充表的命令。请参考图 13-19。\n\n```\nLOAD\
  \ DATA INPATH '/user/hadoop/stack_over_data' INTO TABLE stack_data_table;\n```\n\
  \n![A978-1-4842-0043-8_13_Fig19_HTML.jpg](img/A978-1-4842-0043-8_13_Fig19_HTML.jpg)\n\
  \n图 13-19. 将数据加载到 Hive 表中\n\n### 使用 Hive 执行程序\n\n您在 Hive 中已有包含数据的表。现在需要编写 HiveSQL\
  \ 代码，代码将自动转换为 MapReduce 代码。请参考图 13-20。执行以下 HiveSQL 命令：\n\n```\nSelect count(*) from\
  \ stack_data_table ;\n```\n\n![A978-1-4842-0043-8_13_Fig20_HTML.jpg](img/A978-1-4842-0043-8_13_Fig20_HTML.jpg)\n\
  \n图 13-20. 执行 HiveSQL 命令\n\n### 查看 MapReduce 状态\n\n图 13-21 显示了 Map 和 Reduce 的状态。请注意，图中\
  \ Map 状态为 28%，Reduce 作业完成了 7%。\n\n![A978-1-4842-0043-8_13_Fig21_HTML.jpg](img/A978-1-4842-0043-8_13_Fig21_HTML.jpg)\n\
  \n图 13-21. MapReduce 中间状态\n\nMapReduce 完成后，您将获得结果。处理这些数据所花费的总时间约为五分钟。\n\n此处我们只是想计算总行数，这是此演示选择的业务问题。当您执行\
  \ HiveSQL 命令时，您会看到 Map 和 Reduce 作业自动启动。Map 作业将统计每个数据块中的行数；Reduce 作业用于汇总总计结果。\n\n\
  ### 最终结果\n\n最终结果显示共有 6,034,195 条记录（图 13-22）。原始数据输入文件中包含了近 600 万个问题。\n\n![A978-1-4842-0043-8_13_Fig22_HTML.jpg](img/A978-1-4842-0043-8_13_Fig22_HTML.jpg)\n\
  \n图 13-22. 最终的行计数；MapReduce 过程完成\n\n一旦您理解了基础知识，并掌握了如何获取行计数这类基本统计信息，您就可以编写相应的 HiveQL\
  \ 命令来获取其他结果，例如排名前十的话题、每个话题的频率等等。\n\n## 结论\n\n在本章中，您学习了如何处理一个基本的大数据问题。大数据分析是市场上最新的流行语。当今的大数据正处于其发展的初级阶段。该领域预计会有大量发展，特别是在预测建模、文本挖掘、视频分析和机器学习领域。目前，并非所有算法都被转换成\
  \ MapReduce 程序。但在不久的将来，我们可能会拥有一个能够在分布式平台上运行并为我们执行所有高级分析任务的工具。这是一个快速发展的领域，因此在不久的将来您可能会看到几种新工具。现在，作为练习，我们建议您对\
  \ Hadoop 生态系统中的其他组件做一些研究。\n\n\n\n"
