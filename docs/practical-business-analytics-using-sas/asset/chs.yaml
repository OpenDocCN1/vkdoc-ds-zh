  \ 25%中存在一些异常高的值。\n\n如果只有十名学生，情况会怎样（表 6-31）？以下是找到第一个四分位数的方法：第一个四分位数落在排名第二和第三的值之间。在这种情况下，通过求平均值来计算四分位数。第三个四分位数落在排名第七和第八的值之间。\n\
  \n**表 6-31.** 仅有十个观测值的四分位数\n\n| S7 | S1 | S10 | S3 | S8 | S15 | S12 | S20 | S4 |\
  \ S9 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 35 | 37\
  \ | 37 | 40 | 40 | 43 | 52 | 54 | 55 | 56 |\n\n第一个四分位数 = (37 + 37) / 2 = 37\n\n\
  第三个四分位数 = (52 + 54) / 2 = 53\n\n\n\n### 使用 SAS 计算分位数\n\n以下代码可得出一些重要的分位数。下一节将讨论的箱线图，也可以使用单变量分析来绘制，你正是用这种分析来获取分位数。\n\
  \n以下是针对在线销售示例中获取列表价格分位数的代码：\n\n```\nProc univariate data = online_sales ;\nvar listPrice\
  \ ;\nrun ;\n```\n\n`Proc univariate` 提供了关于某个变量的其他几种度量。本节仅考虑输出中的分位数表（表 6-32）。\n\n\
  表 6-32. 对 `online_sales` 执行 `Proc univariate` 得到的分位数\n\n| 分位数（定义 5） |\n| --- |\n\
  | 分位数 | 估计值 |\n| 100% 最大值 | 139990 |\n| 99% | 44500 |\n| 95% | 35198 |\n| 90% |\
  \ 28590 |\n| 75% Q3 | 15302 |\n| 50% 中位数 | 8399 |\n| 25% Q1 | 4110 |\n| 10% | 1559\
  \ |\n| 5% | 999 |\n| 1% | 849 |\n| 0% 最小值 | 849 |\n\n最低列表价格为 849 美元，最高为 139,990\
  \ 美元。第 25 百分位数，即第一四分位数，为 4,110 美元。第三四分位数值为 15,302 美元。四分位距为 15,302 – 4,110 = 11,192。分位数还显示，99%的商品列表价格小于或等于\
  \ 44,500 美元。139,990 美元的最大值看起来远大于 99%的值即 44,500 美元。这清晰表明了异常值的存在。在后面的章节中，我们将介绍一种识别异常值的方法。\n\
  \n### 健康索赔示例\n\n表 6-33 给出了取自医疗保健数据集的一个输出。对健康索赔数据进行单变量分析的代码如下：\n\n```\nProc univariate\
  \ data = health_claim ;\nvar Claim_amount ;\nrun;\n```\n\n表 6-33. `health_claim`\
  \ 示例的分位数\n\n| 分位数（定义 5） |\n| --- |\n| 分位数 | 估计值 |\n| 100% 最大值 | 256058 |\n| 99%\
  \ | 11428 |\n| 95% | 6149 |\n| 90% | 4368 |\n| 75% Q3 | 2044 |\n| 50% 中位数 | 438\
  \ |\n| 25% Q1 | 0 |\n| 10% | 0 |\n| 5% | 0 |\n| 1% | 0 |\n| 0% 最小值 | 0 |\n\n表 6-33\
  \ 中的输出显示，25%的客户没有索赔，50%的客户索赔金额为 438 美元。95%的客户索赔金额为 6,149 美元或更少，因此其余 5%的客户似乎有异常的索赔金额。或许有必要对这\
  \ 5%的客户进行过度的审查。可能需要检查他们的医疗账单数量、疾病类型等因素。\n\n### 箱线图\n\n箱线图可以显示变量中的异常值。箱线图是四分位数以及最小值和最大值的图形表示。箱线图使得解释变量的分布更容易。表\
  \ 6-33 使用表 6-34 中给出的示例数据说明了箱线图。\n\n箱线图显示以下值：\n\n- 最小值\n- 第一四分位数值\n- 中位数值\n- 第二四分位数值\n\
  - 最大值\n\n表 6-34. 一个示例总体\n\n| S7 | S1 | S10 | S3 | S8 | S15 | S12 | S20 | S4 | S9\
  \ | S13 | S2 | S11 | S18 | S14 | S5 | S19 | S16 | S6 | S17 |\n| --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- |\n| 35 | 37 | 37 | 40 | 40 | 43 | 52 | 54 | 55 | 56 |\
  \ 57 | 58 | 60 | 63 | 66 | 67 | 72 | 74 | 75 | 75 |\n\n图 6-5 展示了基于表 6-34 中数据的箱线图。\n\
  \n![A978-1-4842-0043-8_6_Fig5_HTML.jpg](img/A978-1-4842-0043-8_6_Fig5_HTML.jpg)\n\
  \n图 6-5. 表 6-34 的箱线图\n\n如果变量中存在与其他值差异很大的稀有值，它们将出现在箱体的上端或下端。异常值在箱线图中一目了然。图 6-6 给出的图显示所有值都分布良好。该变量中没有异常值。\n\
  \n![A978-1-4842-0043-8_6_Fig6_HTML.jpg](img/A978-1-4842-0043-8_6_Fig6_HTML.jpg)\n\
  \n图 6-6. 无异常值的箱线图\n\n例如，在表 6-35 中，有几个值远超中位数，且距离第三四分位数非常远。其箱线图如图 6-7 所示。\n\n表 6-35.\
  \ 包含异常值的示例总体\n\n| S7 | S1 | S10 | S3 | S8 | S15 | S12 | S20 | S4 | S9 | S13 | S2\
  \ | S11 | S18 | S14 | S5 | S19 | S16 | S6 | S17 |\n| --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 35 | 37 | 37 | 45 | 46 | 48 | 52 | 50 | 52 | 55 | 57 | 58 | 58\
  \ | 59 | 59 | 66 | 67 | 69 | 98 | 99 |\n\n![A978-1-4842-0043-8_6_Fig7_HTML.jpg](img/A978-1-4842-0043-8_6_Fig7_HTML.jpg)\n\
  \n图 6-7. 表 6-35 的箱线图\n\n识别异常值的一个简单方法是查看四分位距。如果存在超过三倍四分位距的值，它们可以被视为异常值（图 6-8）。在本例中，四分位距为\
  \ 59 – 46 = 13，但存在超过 59 + 3 * (13) = 59 + 39 = 98 的值。因此，值 98 和 99 是数据中的异常值。\n\n\
  ![A978-1-4842-0043-8_6_Fig8_HTML.jpg](img/A978-1-4842-0043-8_6_Fig8_HTML.jpg)\n\n\
  图 6-8. 使用箱线图识别异常值\n\n\n\n### 使用 SAS 创建箱线图\n\n如前所述，单变量分析会在输出中提供多个值。本节仅关注箱线图。只需在单变量代码中添加一个绘图选项即可。示例代码如下：\n\
  \n```\nProc univariate data=health_claim plot;\nvar Claim_amount;\nrun;\n```\n\n\
  生成的分位数和箱线图分别如表 6-36 和图 6-9 所示。\n\n**表 6-36.** 健康索赔示例的分位数表（`claim_amount`）\n\n| 分位数（定义\
  \ 5） | |\n| --- | --- |\n| 分位数 | 估计值 |\n| 100% 最大值 | 256058 |\n| 99% | 11428 |\n\
  | 95% | 6149 |\n| 90% | 4368 |\n| 75% Q3 | 2044 |\n| 50% 中位数 | 438 |\n| 25% Q1 |\
  \ 0 |\n| 10% | 0 |\n| 5% | 0 |\n| 1% | 0 |\n| 0% 最小值 | 0 |\n\n![A978-1-4842-0043-8_6_Fig9_HTML.jpg](img/A978-1-4842-0043-8_6_Fig9_HTML.jpg)\n\
  \n**图 6-9.** `health_claim` 数据集的箱线图（`claim_amount`）\n\n图 6-9 中的图形显示，整个箱子（第一四分位数、中位数和第三四分位数）紧贴在底部。这是因为存在一些离群高值。第一步是移除所有离群高值并重新绘制箱线图。仅考虑总体的前\
  \ 95%，也就是所有索赔金额低于 6,149 美元的客户。95% 这个值可以从分位数表（表 6-36）中找到。\n\n以下代码对 `claim_amount`\
  \ 施加了一个条件：\n\n```\nProc univariate data=health_claim plot;\nvar Claim_amount;\n\
  where Claim_amount < 6149;\nrun;\n```\n\n忽略离群值后，现在可以看到箱子（图 6-10）。\n\n![A978-1-4842-0043-8_6_Fig10_HTML.jpg](img/A978-1-4842-0043-8_6_Fig10_HTML.jpg)\n\
  \n**图 6-10.** 忽略离群值后 `claim_amount` 的箱线图\n\n以下代码为在线销售数据创建箱线图：\n\n```\nProc univariate\
  \ data=online_sales plot;\nvar listPrice;\nrun;\n```\n\n图 6-11 是生成的箱线图。\n\n![A978-1-4842-0043-8_6_Fig11_HTML.jpg](img/A978-1-4842-0043-8_6_Fig11_HTML.jpg)\n\
  \n**图 6-11.** `listPrice` 的箱线图\n\n再次出现了一些离群值（表 6-37）。\n\n**表 6-37.** 健康索赔示例的分位数表（`listPrice`）\n\
  \n| 分位数（定义 5） | |\n| --- | --- |\n| 分位数 | 估计值 |\n| 100% 最大值 | 139990 |\n| 99% |\
  \ 44500 |\n| 95% | 35198 |\n| 90% | 28590 |\n| 75% Q3 | 15302 |\n| 50% 中位数 | 8399\
  \ |\n| 25% Q1 | 4110 |\n| 10% | 1559 |\n| 5% | 999 |\n| 1% | 849 |\n| 0% 最小值 | 849\
  \ |\n\n考虑截至 99% 的值以观察箱子。离群值的剔除和处理将在第 7 章详细讨论。此示例简单地移除离群值并重新绘制箱线图（图 6-12），以清晰地显示箱子。参考以下代码：\n\
  \n```\nProc univariate data=online_sales plot;\nvar listPrice;\nwhere listPrice\
  \ < 44500;\nrun;\n```\n\n![A978-1-4842-0043-8_6_Fig12_HTML.jpg](img/A978-1-4842-0043-8_6_Fig12_HTML.jpg)\n\
  \n**图 6-12.** 移除离群值后 `listPrice` 的箱线图\n\n移除离群值后，箱子现在看起来在总体中分布得更好。\n\n## 双变量分析\n\n\
  到目前为止，您每次只考察了一个变量。双变量分析则是将两个变量放在一起分析。它回答了诸如两个变量之间的关联是什么、当一个变量增加时另一个变量会发生什么变化等问题。以下是一些示例：\n\
  \n- 如果学习小时数增加，考试成绩也会增加吗？\n- 如果教堂建筑数量增加，犯罪率会下降吗？\n- 如果汽车数量增加，平均年龄会下降吗？\n\n相关性用于量化两个变量之间的关联。相关性是进行双变量分析最常用的方法之一。后续章节将讨论相关性。\n\
  \n## 结论\n\n在本章中，您学习了如何使用一些非常基础的统计技术对数据进行基本报告和变量分析。您还看到了单变量分析在分析变量方面的用处。直到最近，即使是这种程度的统计分析也被认为是足够好的。但在过去几年中，情况发生了很大变化。现在，更先进和复杂的数据分析工具及技术被用作辅助高管决策的手段。在接下来的章节中，我们将带您了解一些经典和高级的数据分析技术。当您将\
  \ SAS 作为主要数据分析工具时，您将会体会到这些原本复杂的技术变得多么简单。\n\n"
- "# 数据探索、验证与数据清理\n\n为实际分析准备数据是任何分析项目的重要部分。原始数据来源多样，例如经典的关系型数据库、平面文件、电子表格，以及来自社交媒体文本等来源的非结构化数据。一个项目可能同时包含结构化和非结构化数据，更复杂的是，可能涉及众多数据源。正如您所料，数据将在质量和数量上都面临许多挑战。分析师需要首先从数据源读取数据（这本身可能就是一项艰巨的任务），然后对其进行解析，以便用于后续分析。SAS\
  \ 需要将数据转换为自身的数据集之后，才能使用其任何分析例程。简而言之，原始数据并不总能直接用于分析；在分析之前，需要对其进行验证和清理。\n\n考虑到这一主题的重要性，我们对其进行了足够详细的阐述。本章首先让您了解在为分析准备数据时可能遇到的一般性问题。然后，我们涵盖数据验证和清理的主题。最后，我们以一个银行业非常详细的案例研究来演示如何将概念应用于实际数据。\n\
  \n## 统计分析生命周期中的数据探索步骤\n\n前面的章节讨论了基础描述性统计的应用。已经确定，如果能有效运用，数据分析可以产生巨大的成果。图 7-1 回顾了统计分析中遵循的步骤。\n\
  \n![A978-1-4842-0043-8_7_Fig1_HTML.jpg](img/A978-1-4842-0043-8_7_Fig1_HTML.jpg)\n\
  \n**图 7-1.** 数据分析项目的步骤\n\n一旦确定了数据的业务目标，在继续分析过程之前，必须对数据有全面的理解。图 7-1 所示顺序中第二列的数据准备步骤提出了以下问题：\n\
  \n- 为什么理解和探索数据在统计分析中是如此重要的一步？\n- 为什么这个步骤需要与描述性分析和预测建模等其他重要步骤一同提及？\n\n以下示例将解答这两个问题。\n\
  \n\n\n### 示例：联系中心呼叫量\n\n考虑某个大型组织典型客户联系中心的呼叫量数据。表 7-1 中的数据快照仅包含三列。第一列是天数，第二列是当天的小时数，第三列是特定小时内的呼叫量（呼叫次数）。该数据连续记录了五天。\n\
  \n**表 7-1.** 呼叫量数据\n\n| 天数 | 小时 | 呼叫量 |\n| --- | --- | --- |\n| 1 | 1 | 3,504 |\n\
  | 1 | 2 | 3,378 |\n| 1 | 3 | 6,872 |\n| 1 | 4 | 5,993 |\n| 1 | 5 | 3,093 |\n| 1\
  \ | 6 | 3,512 |\n| 1 | 7 | 4,142 |\n| 1 | 8 | 6,441 |\n| 1 | 9 | 61,906 |\n| 1 |\
  \ 10 | 43,175 |\n| 1 | 11 | 49,989 |\n| 1 | 12 | 9,862 |\n| 1 | 13 | 18,231 |\n\
  | 1 | 14 | 46,282 |\n| 1 | 15 | 36,665 |\n\n假设你试图回答以下问题：平均呼叫次数是多少？前 8 小时的平均呼叫次数是否确实低于其余\
  \ 16 小时？需要运行以下 SAS 代码来实现这一分析：\n\n```\n/*Import the data set into SAS */\nPROC IMPORT\
  \ OUT = WORK.call_volume\nDATAFILE= \"D:\\Backup\\SkyDrive\\Books\\Content\\Chapter-12\
  \ Data Exploration and Cleaning\\Data sets\\Call_volume.csv\"\nDBMS=CSV REPLACE;\n\
  GETNAMES=YES;\nDATAROW= 2 ;\nRUN ;\n\n/*Get the contents of the SAS data set */\n\
  Proc contents data=WORK.call_volume varnum;\nrun ;\n```\n\n上述代码中的 `varnum` 选项会按照变量在原始数据集中出现的顺序列出它们。SAS\
  \ 通常按字母顺序打印变量。\n\n该代码的输出请参见表 7-2。\n\n**表 7-2.** `PROC CONTENTS` 的 SAS 输出变量列表\n\n\
  | 按创建顺序排列的变量 |\n| --- |\n| # | 变量 | 类型 | 长度 | 格式 | 输入格式 |\n| --- | --- | --- | ---\
  \ | --- | --- |\n| 1 | `Day` | 数值型 | 8 | BEST12. | BEST32. |\n| 2 | `Hour` | 数值型\
  \ | 8 | BEST12. | BEST32. |\n| 3 | `Volume` | 数值型 | 8 | BEST12. | BEST32. |\n\n\
  为了计算每小时平均呼叫量，需要执行 `PROC MEANS`。\n\n以下 SAS 代码用于计算变量 `call_volume` 的平均值。\n\n```\n\
  Title'Overall mean of the call volume';\nProc means data=WORK.call_volume ;\nvar\
  \ volume ;\nrun ;\n\nProc means data 默认输出表 7-3 所示的结果。\n```\n\n**表 7-3.** `call_volume`\
  \ 数据集的 `PROC MEANS` 输出\n\n| 分析变量 : 呼叫量 |\n| --- |\n| N | 平均值 | 标准差 | 最小值 | 最大值 |\n\
  | --- | --- | --- | --- | --- |\n| 120 | 168812.73 | 862472.38 | 0 | 7260664.00\
  \ |\n\n由于你只需要平均值，可以在代码中使用 `mean` 选项，如下所示：\n\n```\nTitle'Overall mean of the call\
  \ volume';\nproc means data=WORK.call_volume mean;\nvar volume ;\nrun ;\n```\n\n\
  表 7-4 显示了上述代码的输出。\n\n**表 7-4.** 变量 `volume` 的平均值\n\n| 平均值 |\n| 168,812.73 |\n\n\
  以下是计算前 8 小时平均呼叫量的代码。\n\n```\nTitle 'Mean of the call volume in 1 to 8 Hours';\n\
  proc means data=WORK.call_volume mean;\nvar volume;\nwhere Hour < 9 ;\nrun ;\n```\n\
  \n表 7-5 显示了上述代码的输出。\n\n**表 7-5.** 第 1 至 8 小时的平均呼叫量\n\n| 平均值 |\n| 417,169.30 |\n\n\
  以下是计算后 16 小时（即第 9 至 24 小时）平均呼叫量的代码。\n\n```\nTitle 'Mean of the call volume in 9\
  \ to 24 Hours';\nprocmeans data=WORK.call_volume mean;\nvar volume;\nwhere Hour\
  \ ge 9 ;\nrun ;\ntitle;\n```\n\n表 7-6 显示了上述代码的输出。\n\n**表 7-6.** 第 9 至 24 小时的平均呼叫量\n\
  \n| 平均值 |\n| 44,634.44 |\n\n在整个文件的所有呼叫次数中，整体平均值已在表 7-4 之前的 SAS 代码中计算得出。随后计算了前 8\
  \ 小时的平均值以及后 16 小时的平均值（表 7-5 和 7-6）。因此，一个简单的 `proc` means SAS 脚本即可帮助发现每小时平均呼叫次数为\
  \ 168,812。前 8 小时的平均每小时呼叫次数低于后 16 小时的假设并不成立。前 8 小时的呼叫率几乎是后 16 小时数据的 10 倍。\n\n现在，联系中心可以根据每小时平均呼叫量来部署资源。然而，经理审阅了这些结果并将其驳回。\n\
  \n驳回的原因如下。\n\n\n\n## 数据探索与验证的必要性\n\n为了说明数据探索与验证的必要性，我们将继续沿用同一个呼叫中心通话量示例进行阐述。\n\n\
  -   经理根据经验了解到，每小时的呼叫量平均值通常在 50,000 到 100,000 之间。\n-   他还质疑一天中前 8 小时（午夜 12 点至早上 8\
  \ 点）的呼叫量是否可能比后 16 小时更高。他的经验也告诉他，后 16 小时的呼叫率应该明显更高。\n\n他的这一信心促使我们需要重新审视这五天原始呼叫量数据的结果。\n\
