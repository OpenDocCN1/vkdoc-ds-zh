  \ 上找到。\n\n到目前为止，我们已经讨论了一些关于大数据的重要概念和工具。正如本书一贯的做法，我们将给出一个大数据分析的示例，以便您能实际了解大数据分析是如何进行的。\n\
  \n## 大数据分析示例\n\n在此示例中，我们将使用来自 Stack Overflow 网站 ([`http://stackoverflow.com/`](http://stackoverflow.com/))\
  \ 的数据。Stack Overflow 是一个私有网站，由 Jeff Atwood 和 Joel Spolsky 于 2008 年创建。该网站作为用户就广泛的计算机编程主题提出和回答问题的平台。如果您对任何编程语言有特定问题，可以登录\
  \ Stack Overflow 并提交您的问题。您甚至可以使用诸如 `C++`、`Java`、`database`、`SQL`、`PHP` 等关键词为问题添加标签。Stack\
  \ Overflow 有一个共享数据的门户。热衷于数据科学的科学家可以登录并从该门户下载数据。为了这个大数据示例，我们从这个网站下载了一个数据集。\n\n本示例旨在理解与大数据的各种概念。在此示例中，我们使用了一个\
  \ 7GB 的数据集。对于大数据来说，这个大小太小了，但出于实际考虑，我们在本例中将其限制在这个大小。以下是本示例中要遵循的步骤：\n\n审视业务问题  \n\
  获取数据集  \n启动 Hadoop  \n查看 Hadoop 组件  \n将数据从本地系统迁移到 Hadoop  \n在 HDFS 上查看数据  \n启动 Hive\
  \  \n使用 Hive 创建表  \n使用 Hive 执行程序  \n查看 MapReduce 状态  \n查看最终结果  \n\n让我们从业务问题开始。\n\
  \n### 审视业务问题\n\n业务方希望从给定文件中提取一些基本的描述性统计数据，例如问题总数和排名前十的话题。此外，还需要诸如唯一的用户总数、排名前十的用户以及这些用户的提问数等数据。您甚至可以进一步构建一个模型，当用户在\
  \ Stack Overflow 网站上输入任何问题时，该模型能够自动检测并建议标签。出于演示目的，我们仅尝试找出输入文件中提到的问题总数。\n\n### 获取数据集\n\
  \n该数据集来自 Stack Overflow。数据集的大小为 7GB，是一个文本文件。需要分析这个输入文件以找出基本的描述性统计数据。\n\n\n\n###\
  \ 启动 Hadoop\n\nHadoop 安装在 Linux 机器上。在本示例中，我们使用的是单节点（即伪集群）Hadoop 设置。基本上我们只在一台机器上工作。由于操作系统是\
  \ Linux，所有操作都将以在终端中执行的 Linux 命令形式进行。第一步是在 Linux 中打开一个终端。我们 Linux 机器的用户名是 `Hadoop`。如果用户名是\
  \ `neo`，那么你会看到 `neo@local host home`。请参考图 13-4。\n\n![A978-1-4842-0043-8_13_Fig4_HTML.jpg](img/A978-1-4842-0043-8_13_Fig4_HTML.jpg)\n\
