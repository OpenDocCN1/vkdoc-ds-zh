  \n\n\n#### 模型构建\n\n数据集中的响应变量是二元的。 `SeriousDlqin2yrs` 是您打算预测的因变量。它取两个值：\n\n- 1，是，破产或冲销：坏客户\n\
  - 0，否，破产或冲销：好客户\n\n逻辑回归是根据贷款数量、负债比率、月收入等特征预测客户违约概率的一个好选择。\n\n以下是构建逻辑回归线的代码：\n\n\
  ```\nproc logistic data=loans_data;\nmodel SeriousDlqin2yrs = utilization Age Num_loans\
  \ Num_dependents MonthlyIncome Num_Savings_Acccts DebtRatio;\nrun;\n```\n\n以下是执行先前代码时来自日志文件的信息：\n\
