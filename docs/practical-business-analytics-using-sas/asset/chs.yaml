  | 23 | 4972 |\n| 24 | 4983 |\n| 25 | 8300 |\n| 26 | 4516 |\n| 27 | 4426 |\n\n您正在尝试检验总体的平均月支出是否确实为\
  \ 4,500 美元。您正在检验总体均值，并且样本量较小，因此您使用 t 检验。以下是您遵循的步骤：\n\n**陈述零假设。**\n\n零假设（`H[0]`）：平均支出等于\
  \ 4,500 美元。\n\n备择假设（`H[1]`）：平均支出不等于 4,500 美元。\n\n**确定抽样分布和显著性水平。**\n\n您正在检验小样本的样本均值；因此，您将使用\
  \ t 分布。显著性水平与行业标准相同，即 5%。因此，抽样分布是自由度为 26 的 t 分布。t 分布并非对所有样本量都相同。提及 t 分布时需要同时说明其自由度，自由度等于样本量减\
  \ 1（`n-1`）。再次强调，t 分布的自由度是指可以独立选择以形成特定 t 分布的观测值数量。\n\n**做出推断。检验统计量。**\n\n要对整个总体做出推断，您需要使用自由度为\
  \ 26 的 t 分布计算 P 值。\n\n`P = (t > 0.93) 的概率`\n\n您可以使用分布表或任何工具中的 t 分布概率值来获得上述概率。P 值如下：\n\
  \n`P = 0.361`\n\n最终推断是 P 值远大于 0.05；因此，您没有足够证据拒绝零假设。换言之，您同意零假设，即市场研究团队给出的平均支出值是正确的，或者没有足够证据证明市场研究团队给出的值是错误的。\n\
  \n您还可以使用以下 SAS 代码执行相同的检验：\n\n```\nproc ttest data =Expenses H0 = 4500 ;\nvar expense;\n\
  run ;\n```\n\n-   SAS 代码中的 `H0` 选项指总体假设均值。\n-   数据集中的变量名是 `expense`。\n-   数据集名称是\
  \ `Expenses`。\n\n表 8-7 显示了此代码的输出。\n\n**表 8-7.** `proc ttest (Data = Expenses)` 的输出（t\
  \ 检验过程；变量：`expense`）\n\n| N | 均值 | 标准差 | 标准误差 | 最小值 | 最大值 |\n| --- | --- | --- |\
  \ --- | --- | --- |\n| 27 | 4744.6 | 1367.5 | 263.2 | 1100.0 | 9000.0 |\n\n| 均值\
  \ | 95% 置信区间均值 | 标准差 | 95% 置信区间标准差 |\n| --- | --- | --- | --- |\n| 4744.6 | 4203.6\
  \ | 5285.6 | 1367.5 | 1077.0 | 1874.1 |\n\n| DF | t 值 | Pr > &#124;t&#124; |\n|\
  \ --- | --- | --- |\n| 26 | 0.93 | 0.3613 |\n\n输出给出了样本量、样本均值、样本标准差以及变量 `expenses`\
  \ 的最小值和最大值。\n\n表 8-7 中的第三个表格对推断最为重要。它显示了 t 统计量值。t 统计量值由检验统计量方程计算得出。上述检验的 P 值为 0.3613。基于\
  \ P 值，您接受零假设。\n\n在表 8-7 输出表的第二个表格中，给出了均值的 95% 置信限。区间 (4203.6 到 5285.6) 有 95% 的概率包含总体均值。\n\
  \n### 其他检验示例\n\n表 8-8 包含其他类型检验的示例，包括 Z 检验、卡方检验等。\n\n**表 8-8.** 更多检验示例\n\n| 场景 |\
  \ 零假设 | 检验 |\n| --- | --- | --- |\n| 检验大样本的样本均值 | 总体均值 = X1。 | Z 检验 |\n| 检验小样本的样本均值\
  \ | 总体均值 = X2。 | t 检验 |\n| 检验两个变量的独立性 | 两个变量相互独立。 | 卡方检验 |\n| 检验两个变量间的相关性 | 两个变量间的相关性为零。\
  \ | 皮尔逊相关性检验 |\n| 检验自变量对因变量的显著性 | 回归模型中自变量的系数为零。 | 贝塔检验 |\n| 检验两个总体方差的差异 | 两个总体的方差无差异。\
  \ | F 检验 |\n| 检验总体中变量某个类别的比例 | 总体比例 = P1。 | 比例 Z 检验 |\n\n### 双尾检验与单尾检验\n\n在某些假设检验案例中，在临界区域内，与零假设相反的定义了备择假设，这被称为非方向性备择假设。到目前为止，我们仅讨论了非方向性备择假设。还存在方向性备择假设。让我们更深入地了解细节。\n\
  \n\n\n#### 双尾检验\n\n使用非定向假设进行的检验类型被称为双尾检验，因为决策关键区域位于分布的两个极端尾部。在非定向备择假设的情况下，关键区域可以在集中趋势的任意一侧（如图\
  \ 8-20 所示）。例如，在肥皂重量的例子中，原假设是肥皂平均重量为 250 克；备择假设则认为肥皂重量不等于 250 克。你抽取了 50 块肥皂的样本以检验这一假设。如果样本平均值远高于\
  \ 250 克或远低于 250 克，你可能想要拒绝原假设。你的决策与数值的方向无关。图 8-20 是非定向备择假设的一个示例。\n\n![A978-1-4842-0043-8_8_Fig20_HTML.jpg](img/A978-1-4842-0043-8_8_Fig20_HTML.jpg)\n\
  \n图 8-20. 非定向备择假设示例\n\n以下是一些熟悉的非定向假设实例：\n\n* 一般假设\n  * 原假设 `H[0]`：总体均值 = μ\n  *\
  \ 备择假设 `H[1]`：总体均值 ≠ μ\n* 肥皂重量示例\n  * 原假设 `H[0]`：肥皂平均重量 = 250 克\n  * 备择假设 `H[1]`：肥皂平均重量\
  \ ≠ 250 克\n* 性别比例示例\n  * 原假设 `H[0]`：男性比例 = 50%\n  * 备择假设 `H[1]`：男性比例 ≠ 50%\n\n在原假设的两侧将有两个临界值；关键区域将被分成两部分。如果检验统计量落入这两个关键区域中的任意一个，你将拒绝原假设。如果你决定接受原假设的最小显著性水平为\
  \ 5%，那么它将被分成两个 2.5%的部分，分别位于原假设的两侧。\n\n#### 单尾检验\n\n在单尾检验中，备择假设仅位于原假设的一侧。如果备择假设是在特定方向上定义的，那么你可能只能基于一个方向做出接受或拒绝的决定。在肥皂重量示例中，如果你将备择假设定义为定向的，那么它将如下所示：\n\
  \n* 原假设 `H[0]`：肥皂平均重量 = 250 克\n* 备择假设 `H[1]`：肥皂平均重量 > 250 克\n\n与定向假设相关的检验将只有一个临界值和一个关键区域，并且仅在一侧。关键区域如图\
  \ 8-21 所示。\n\n![A978-1-4842-0043-8_8_Fig21_HTML.jpg](img/A978-1-4842-0043-8_8_Fig21_HTML.jpg)\n\
  \n图 8-21. 定向备择假设（右尾检验）的临界值和关键区域\n\n最小显著性水平概率（通常接受值为 5%）将只考虑在分布的一侧。如果检验统计量落入那个 5%的关键区域，你将拒绝原假设。图\
  \ 8-21 中描绘的单尾检验是一个右尾检验，因为关键区域位于右侧。类似地，你也可以有单尾检验，其中关键区域位于左侧（图 8-22）。在同一个肥皂示例中，以下备择假设将导致左尾检验：\n\
  \n![A978-1-4842-0043-8_8_Fig22_HTML.jpg](img/A978-1-4842-0043-8_8_Fig22_HTML.jpg)\n\
  \n图 8-22. 定向备择假设（左尾检验）的临界值和关键区域\n\n* 原假设 `H[0]`：肥皂平均重量 = 250 克\n* 备择假设 `H[1]`：肥皂平均重量\
  \ < 250 克\n\n以下是定向假设的更多示例：\n\n* 一般假设（右尾检验）\n  * 原假设 `H[0]`：总体均值 = μ\n  * 备择假设 `H[1]`：总体均值\
  \ > μ\n* 一般假设（左尾检验）\n  * 原假设 `H[0]`：总体均值 = μ\n  * 备择假设 `H[1]`：总体均值 < μ\n* 性别比例示例（右尾检验）\n\
  \  * 原假设 `H[0]`：男性比例 = 50%\n  * 备择假设 `H[1]`：男性比例 > 50%\n* 性别比例示例（左尾检验）\n  * 原假设\
  \ `H[0]`：男性比例 = 50%\n  * 备择假设 `H[1]`：男性比例 < 50%\n\n定义备择假设将取决于你正在处理的业务目标和问题类型。例如，考虑一台将螺栓精确切割成\
  \ 50mm 的机器。将螺栓切割得明显小于 50mm 或明显大于 50mm 都是不合适的。因此，你可以采用非定向的备择假设。\n\n与双尾检验相比，单尾检验的唯一变化发生在做决策时。考虑表\
  \ 8-9 中给出的示例。\n\n表 8-9. 基于 P 值进行单尾和双尾检验的决策\n\n| 原假设与备择假设 | 检验类型 | 示例 P 值 | 推断 |\n\
  | --- | --- | --- | --- |\n| `H[0]`：总体均值 = μ；`H[1]`：总体均值 ≠ μ | 双尾检验 | `P=0.04` |\
  \ 接受原假设 |\n| 在上例中，关键区域在原假设的两侧。因此，每一侧的阈值将为 0.025（2.5%）。`P`值为 0.04 大于 0.025；因此，接受原假设。\
  \ |\n| `H[0]`：总体均值 = μ；`H[1]`：总体均值 > μ | 右尾检验 | `P=0.04` | 拒绝原假设 |\n| 在上例中，关键区域在原假设的单侧。因此，阈值将为\
  \ 0.05（5%）。`P`值为 0.04 小于 0.05；因此，拒绝原假设。 |\n\n**注意**\n你不能将“总体均值大于μ”作为原假设，因为当原假设是“总体均值大于μ”时，你无法知道样本均值的分布会是什么。中心极限定理仅适用于原假设——总体均值等于μ。\n\
  \n\n#### 测试中的误差\n\n在检验假设时，你总是通过抽取样本并对总体进行推断。在这个过程中，总会存在误差因素。如果总体规模非常大，那么可能无法获得 100%准确的结果。换言之，仅通过抽取样本很难总是轻松地对庞大总体做出推断。请考虑以下两个示例：\n\
  \n-   在蛋糕示例中，你通过品尝一小块样本对整个蛋糕做出判断。可能发生的情况是，只有你尝到的那块不好，而其余部分都很好。在这种情况下，你会对整个蛋糕做出错误推断。或者也可能出现相反情况：只有样本那块蛋糕是好的，但其余部分不好。你可能会继续购买该蛋糕，这无论如何都是个错误决定。\n\
  -   在肥皂重量示例中，可能发生的情况是，总体平均重量并不等于 250，但如果你的样本恰好显示平均重量为 250，你最终可能会接受原假设。也可能出现相反情况：如果你得到的一个样本的平均重量与原假设中的假设值相差甚远，你最终可能会拒绝原假设。\n\
  \n是的，存在错误拒绝原假设的可能，也存在错误接受原假设的可能。详情请参考表 8-10。\n\n**表 8-10.** 接受或拒绝原假设时的误差\n\n|  |\
  \ 原假设为真 | 原假设为假 |\n| --- | --- | --- |\n| 拒绝原假设 | 第一类错误 | 正确推断 |\n| 接受原假设 | 正确推断\
  \ | 第二类错误 |\n\n##### 第一类错误：原假设为真时拒绝它\n\n有时你的样本可能会欺骗你。通过观察从样本计算出的检验统计量，你最终可能错误地拒绝原假设。如果你在需要接受原假设时却拒绝了它，则称为第一类错误。正如你将在下文中了解到的，第一类错误由分析师在测试开始前就已确定。\n\
  \n你希望拒绝的`P`值最大值是多少？第一类错误的概率，也称为显著性水平，用`α`表示。是的！你确实可能错误地拒绝原假设，实际上，通常有 5%的概率会发生这种情况。这类似于彩票的例子。连续四年赢得全国性彩票的概率是存在的，但该概率非常小，可能小于`0.00000000000000000001`；因此，你拒绝原假设。所以，如果你看不到至少\
  \ 5%的显著性，你就不会购买彩票。因此，对于所有测试，显著性水平在开始时固定为 5%。有时也可能是 1%或 10%，具体取决于变量类型。\n\n图 8-23\
  \ 显示了检验统计量的分布。该分布表明，可能存在超过`C`的值，但得到`C`或更大值的概率小于 5%。因此，如果某个值落在`C`之外，即使原假设为真，你也会拒绝原假设。\n\
  \n![A978-1-4842-0043-8_8_Fig23_HTML.jpg](img/A978-1-4842-0043-8_8_Fig23_HTML.jpg)\n\
  \n**图 8-23.** 第一类错误的临界区域\n\n以下要点进一步阐明了显著性水平。显著性水平是：\n\n-   第一类错误的概率。\n-   也称为拒绝误差的概率。\n\
  -   也称为检验的规模。\n-   预先设定的错误拒绝原假设的概率。\n-   接受原假设所需的最小`P`值。\n\n每个检验都会从一个显著性水平开始，通常固定为\
  \ 5%、10%或 1%。\n\n##### 第二类错误：原假设为假时接受它\n\n第二类错误是指你错误地接受了原假设。它也称为接受误差。第二类错误的概率用`β`表示。例如，陷入典型的销售陷阱就是第二类错误的一个例子。假设一个销售员试图向你推销一个有缺陷的产品。他说该产品非常好（设为原假设）。如果你继续购买了该物品，那么你就是在接受一个错误的原假设。这就是第二类错误。第二类错误的概率，即`β`，用于计算检验的功效。\n\
  \n以下要点进一步阐明了检验的功效：\n\n- `1 - β`\n- `1 - P`（错误接受`H[0]`）\n- `1 - P`（当`H[0]`为假时接受`H[0]`）\n\
  - `P`（当`H[0]`为假时拒绝`H[0]`）\n\n##### 哪种错误更严重：第一类还是第二类？\n\n我们通常不能简单地说哪种错误更严重。这取决于原假设以及所考虑的问题。考虑表\
  \ 8-11 中演示的两种场景。在第一种场景中，第一类错误很危险；在第二种场景中，第二类错误很危险。\n\n**表 8-11.** 哪种错误更严重？示例场景\n\
  \n| 场景与原假设 | 第一类错误 | 第二类错误 |\n| --- | --- | --- |\n| 测试某种药物是否有毒 `H[0]:` 药物有毒 | 第一类错误是拒绝原假设（说该药物无毒），而实际上它有毒。声称该药物安全可能会产生严重后果。\
  \ | 第二类错误是接受原假设（说该药物有毒），而实际上它无毒。声称好的药物不安全可能不会造成重大损害。 |\n| 在发放大额个人贷款前测试客户资质好坏 `H[0]:`\
  \ 客户资质好 | 第一类错误是拒绝原假设（说客户资质差），而实际上客户资质好。你可能会失去一位好客户及其带来的利润。 | 第二类错误是接受原假设（说客户资质好），而实际上客户资质差。如果你批准了一笔坏账，这一个坏客户可能会通过卷款潜逃而吞噬掉\
  \ 100 位好客户带来的利润。 |\n\n**注意**\n\n尽管我们使用了“接受原假设”这一说法，但在实际检验中，你并非真正接受原假设。你要么拒绝原假设，要么无法拒绝原假设。我们使用“接受原假设”是为了便于理解。\n\
  \n## 结论\n\n本章讨论了统计学中最实用的概念之一——假设检验。这一概念甚至用于法庭审判中。中心极限定理及类似解释抽样统计量抽样分布的定理是假设检验的关键。`P`值有助于最终推断。显著性检验还用于许多其他统计概念，如回归、相关、独立性检验、自变量对因变量影响检验等。\n\
  \n到目前为止，你已经阅读了关于基础描述性统计、数据清洗技术以及检验统计显著性的章节。在接下来的章节中，你将学习一些预测建模技术，如线性回归、逻辑回归、时间序列预测等。\n\
  \n"
- "# 9. 相关性与线性回归\n\n在上一章中，我们介绍了如何为模型构建准备数据。在本章中，我们将讨论模型构建，这可能是数据分析项目中最重要的一步。我们将讨论最流行的模型构建技术——线性回归。我们将首先详细讨论相关性，然后讨论相关与回归之间的差异。最后，我们将展示一个使用线性回归进行建模的详细示例。我们将尽可能使用真实场景来解释这些概念。\n\
  \n\n## 什么是相关性？\n\n以下问题是否让你感到熟悉？\n\n-   学习时长与成绩之间是否存在关联？\n-   城市中教堂的数量与谋杀案的数量之间是否存在关联？\n\
  -   随着气温升高，毛衣的销量会发生什么变化？两者关系非常密切吗？\n-   天气变热时，冰淇淋的销量会发生什么变化？\n-   健康与国家的国内生产总值（GDP）之间是否存在关联？\n\
  -   你能量化一个城市的哮喘病例数量与空气污染水平之间的关联吗？\n-   平均收入与燃料消耗之间是否存在关联？\n\n在所有这些场景中，问题都围绕着两个因素是否相关。如果它们存在关联，其关联强度又如何？你可能知道哮喘病例与空气污染之间存在关联；你也知道学习时长与成绩之间存在关联。但这些关联的强度有多大？如何量化这种关联？是否存在衡量两个变量之间关联的度量标准？答案是肯定的。**相关性**就是一种量化两个变量之间关联的度量标准。\n\
  \n例如，假设一家新开的电商网站在广告牌和在线广告上投入了大量资金。它分两个阶段进行了一场声势浩大的广告宣传。第一阶段是广告牌广告，第二阶段是在线广告。广告牌和在线广告都获得了极佳的反响。现在的问题是，广告投入与响应数量之间是否存在关联？如果存在关联，关联强度如何？这种关联在在线营销和广告牌营销中是否有所不同？\n\
  \n下面的两个散点图展示了两种营销活动的预算与响应数量之间的关联。图 9-1 显示了在线业务中预算与响应数量之间的关联。你可以看到一条清晰且强烈的关联趋势，因为随着预算的增加，响应数量也在增加。图\
  \ 9-2 展示了广告牌宣传活动，其中没有如此清晰的趋势。\n\n![A978-1-4842-0043-8_9_Fig2_HTML.jpg](img/A978-1-4842-0043-8_9_Fig2_HTML.jpg)\n\
  \n图 9-2. 广告牌：按预算划分的响应数量\n\n![A978-1-4842-0043-8_9_Fig1_HTML.jpg](img/A978-1-4842-0043-8_9_Fig1_HTML.jpg)\n\
  \n图 9-1. 在线宣传活动：按预算划分的响应数量\n\n如上所述，相关性是一种可用于量化关联的技术。它为关联分配一个数值，告诉你给定变量之间相互依赖的程度。相关性技术会转化成一个度量指标，称为**相关系数**。相关系数用\
  \ `r` 表示。\n\n### 皮尔逊相关系数（r）\n\n皮尔逊相关系数是基于方差的概念定义的。它是衡量两个变量 `x` 和 `y` 之间线性关系或依赖程度的指标。其值在\
  \ `+1` 和 `-1` 之间（含两端）。值为 `1` 表示完全正相关，`0` 表示不存在相关性，`-1` 表示完全负相关。该系数在统计学和分析学中被广泛用作衡量两个变量之间线性相关程度的指标。\n\
  \n### 方差与协方差\n\n正如 第 6 章 所讨论的，方差让你了解给定变量内部的离散程度。如果有两个变量 `x` 和 `y`，那么 `x` 内部的离散程度和\
  \ `y` 内部的离散程度分别用它们的方差来表示。\n\n`x` 的方差如下：\n\n`y` 的方差如下：\n\n如果你想观察 `y` 相对于 `x` 的离散程度，那么可以使用**协方差**。因此，协方差总是涉及两个因子，可以将其理解为联合方差或平行方差。\n\
  \n`x` 和 `y` 之间的协方差如下：\n\n如你所见，协方差的公式看起来与相关性的公式相似，只是它考虑了 `x` 和 `y` 两者差分的计算。\n\n因此，皮尔逊相关性本质上就是协方差在两个个体方差乘积中所占的比例。如果两个变量彼此独立（即\
  \ `y` 的偏差不依赖于 `x` 的相应偏差），那么它们的协方差将接近于零，从而导致相关性为零。\n\n### 相关矩阵\n\n如果你有多个变量，例如 `x1`、`x2`、`x3`……`xn`，并且你对所有两两组合的相关性感兴趣，例如\
  \ `x1` 与 `x3`、`x2` 与 `x4`、`x1` 与 `x4` 等等，那么你可以将所有相关性组合表示为以下矩阵的形式。相关性只能在两个变量之间找到。相关性并不能告诉你\
  \ `x1` 同时与 `x2` 和 `x3` 的关联情况。\n\n| | `X[1]` | `X[2]` | `X[3]` |\n|--- |--- |---\
  \ |--- |\n|`X[1]` | `r[11]` | `r[12]` | `r[13]` |\n|`X[2]` | `r[21]` | `r[22]` |\
  \ `r[23]` |\n|`X[3]` | `r[31]` | `r[21]` | `r[33]` |\n\n| | `X[1]` | `X[2]` | `X[3]`\
  \ |\n|--- |--- |--- |--- |\n|`X[1]` | `x[1]` 与 `x[1]` 的相关性 | `x[1]` 与 `x[2]` 的相关性\
  \ | `x[1]` 与 `x[3]` 的相关性 |\n|`X[2]` | `x[2]` 与 `x[1]` 的相关性 | `x[2]` 与 `x[2]` 的相关性\
  \ | `x[2]` 与 `x[3]` 的相关性 |\n|`X[3]` | `x[3]` 与 `x[1]` 的相关性 | `x[3]` 与 `x[2]` 的相关性\
  \ | `x[2]` 与 `x[3]` 的相关性 |\n\n\n\n## 使用 SAS 计算相关系数\n\n在前面的电商示例中，假设你将所需数据加载到 SAS\
  \ 中，并找出在线营销和广告牌营销两种情况下预算与响应之间的相关性。代码如下：\n\n```\nPROC IMPORT OUT= WORK.add_budget\n\
  DATAFILE= \"C:\\Users\\VENKAT\\Google Drive\\Training\\Books\\Content\\Regression\
  \ Analysis\\Add_budget_data.xls\"\nDBMS=EXCEL REPLACE;\nRANGE=\"budget$\";\nGETNAMES=YES;\n\
  MIXED=NO;\nSCANTEXT=YES;\nUSEDATE=YES;\nSCANTIME=YES;\nRUN;\n```\n\n```\nproc contents\
  \ data= add_budget varnum;\nrun ;\n```\n\n表 9-1 显示了上述代码的输出结果。\n\n**表 9-1.** 数据集合`add_budget`上`PROC\
  \ CONTENTS`过程的输出结果\n\n| 按创建顺序排列的变量 |\n| --- |\n| # | 变量 | 类型 | 长度 | 标签 |\n| ---\
  \ | --- | --- | --- | --- |\n| 1 | `Day` | Num | 8 | 日期 |\n| 2 | `Online_Budget`\
  \ | Num | 8 | 在线预算 |\n| 3 | `Responses_online` | Num | 8 | `Responses_online` |\n\
  | 4 | `Live_Budget` | Num | 8 | 线下预算 |\n| 5 | `Responses_live` | Num | 8 | `Responses_live`\
  \ |\n\n用于寻找相关性的过程是`PROC CORR`。在代码中，我们需要指定数据集名称以及想要用于寻找相关性的变量名称。以下是使用`PROC CORR`的\
  \ SAS 代码：\n\n```\nproc corr data=add_budget ;\nvar Online_Budget Responses_online\
  \ ;\nrun ;\n```\n\n上述代码生成的结果如表 9-2 所示。\n\n**表 9-2.** 数据集合`add_budget`上`PROC CORR`过程的输出结果\n\
