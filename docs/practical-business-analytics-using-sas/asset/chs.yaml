  \ | 7.12 | <.0001 | 14.99448 |\n| 能力倾向 | 1 | -0.04114 | 0.14878 | -0.28 | 0.7828\
  \ | 13.91059 |\n| 数学 | 1 | 0.98752 | 0.02822 | 34.99 | <.0001 | 1.70601 |\n\n你可以看到，`mathematics`\
  \ 的 `VIF` 值发生了巨大变化。同样地，如果你移除 `mathematics`，你会看到 `science` 变量的 `VIF` 变为 1.7。\n\n\
  在面对多重共线性时，以下几点值得注意：\n\n-   `VIF` 是一种有助于检测多重共线性的度量。相关矩阵有时也会有所帮助，但 `VIF` 能处理所有变量的情况。\n\
  -   F 检验和 T 检验的表现相悖也是多重共线性的一个迹象。高 F 统计量和 R 方值会让你相信整个模型拟合得很好。而另一方面，T 检验可能表明大多数变量对\
  \ `y` 没有显著影响。这种情况是由多重共线性引起的。\n-   系数的符号错误或已知变量的反直觉估计是多重共线性的另一个迹象。\n-   你可以对样本或输入数据进行微小更改，并观察回归系数的变化。如果这些变化异常大，那么这就是多重共线性的一个迹象。\n\
  -   条件数是识别 beta 系数中高标准差的另一种方法。条件数不直接寻找自变量之间的关联，而是关注 beta 系数的预期方差。如果条件数很大，则表明存在多重共线性。根据经验，如果条件数大于\
  \ 30，就是多重共线性的一个信号。对这个话题更详细的讨论超出了本书的范围。\n-   容忍度是另一种用作多重共线性指标的度量。容忍度本质上就是 `VIF` 的倒数。因此，它并没有什么新意。\n\
  \n到目前为止，我们已经讨论了由多重共线性引起的挑战，也讨论了检测它的方法。在接下来的部分中，我们将讨论在构建回归模型时如何处理多重共线性。\n\n### 多重共线性的补救（处理多重共线性）\n\
  \n多重共线性在大多数情况下被视为一种冗余现象。这意味着模型中不需要所有涉及多重共线性的变量。模型中其他真正独立的变量足以解释最终因变量的变化。考虑使用 `X1`、`X2`、`X3`、`X4`\
  \ 和 `X5` 为 `Y` 构建一个模型。如果 `X2`、`X3` 和 `X5` 解释了 `X4` 中超过 80% 的变化，那么就没有必要在模型中保留 `X4`。你可以很顺利地从模型设定中删除\
  \ `X4`，然后仅使用 `X1`、`X2`、`X3` 和 `X5` 为 `Y` 重新构建一个足够精确的模型。\n\n#### 剔除问题变量\n\n在大多数情况下，你会继续从自变量列表中剔除有问题的变量。但你需要小心。你不能简单地删除所有\
  \ `VIF` 值大于 5 的变量。如前所述，`VIF` 值是成对出现的。如果你删除一个变量，另一个变量会自动调整。\n\n让我们来看一下 SAT 考试数据的\
  \ `VIF` 值（表 [10-31]）。\n\n表 10-31.\nSAT 考试数据的 VIF 值\n\n| 参数估计 |\n| --- |\n| 变量 |\
  \ 自由度 | 参数估计 | 标准误差 | t 值 | Pr > \\|t\\| | 方差膨胀因子 |\n| 截距 | 1 | -2.07199 | 2.13436\
  \ | -0.97 | 0.3342 | 0 |\n| 常识 | 1 | 1.16697 | 0.10003 | 11.67 | <.0001 | 15.05316\
  \ |\n| 能力倾向 | 1 | -0.13479 | 0.09683 | -1.39 | 0.1673 | 14.01316 |\n| 数学 | 1 | -0.11081\
  \ | 0.09887 | -1.12 | 0.2653 | 49.79461 |\n| 科学 | 1 | 1.09532 | 0.09689 | 11.30\
