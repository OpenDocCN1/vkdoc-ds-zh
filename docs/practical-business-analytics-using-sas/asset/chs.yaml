- '# 引言


  每当我们翻阅技术类书籍时，总会问自己一些特定问题，以决定这本书是否值得投入金钱、时间和精力。我们认为您可能也会如此，因此，针对您可能提出的问题，我们在此给出答案。


  ## 作者的教育背景和经验是什么？


  我们两人都是业务分析领域的在职专业人士，拥有多年处理实际业务问题的经验。我们目前都在班加罗尔的惠普印度公司工作。我们都毕业于印度顶尖的技术院校——印度理工学院（IIT），拥有工程学或统计学硕士学位。这是沙伊伦德拉在
  Apress 出版的第二本书，第一本是 2011 年出版的《走向企业：极客指南》。


  ## 本书涵盖哪些内容？


  本书基本上是使用 SAS 进行分析的入门课程。您将获得在该领域取得成功所需的基础知识。全书共 13 章，每章都经过独特设计，旨在帮助您逐步理解该主题。书中提供了大量包含数据和
  SAS 代码的真实案例，以便您在学完本书后，能够自如地处理实际的业务挑战。以下是各章内容简介：


  *   第 1 章从业务分析的基础知识开始，并介绍了一些用例，为后续章节铺垫背景。我们涵盖了一些最广泛使用的分析技术。接下来，我们将介绍分析工具，包括当今技术领域应用最广泛的分析工具：SAS。

  *   第 2、3、4 章传授使用 SAS 软件所需的基本代码级知识。在这些章节中，我们将讨论 SAS 的基础知识，接着是 SAS 中的数据处理，最后是重要的
  SAS 函数和过程。这些章节为您打下 SAS 软件的基础，这在整本书中，以及在处理业务分析的实际业务场景时，都是必需的。

  *   第 5 章和第 6 章涵盖统计学基础知识和简单的描述性统计技术。它们是统计学的基础构建章节。

  *   第 7 章——在您对统计学和 SAS 有了坚实基础之后——进入分析的生命周期步骤。任何分析问题的解决都始于数据探索、验证和数据清洗。在本章中，我们记录了行业中一些最具创意的数据清洗技术。

  *   第 8 章全部关于检验。假设检验是一个与许多其他统计主题相关联的概念。在本章中，我们以通俗易懂的方式解释了如何进行假设检验。

  *   第 9 章开启了高级主题的旅程。预测建模的第一步是相关性和回归。我们通过大量真实案例解释这些概念。

  *   第 10 章表明回归是一个庞大的主题；它需要一个以上的章节来解释。我们在本章中讨论多元回归，以及诸如多重共线性和调整后的 R 平方等概念。

  *   第 11 章解释了为什么逻辑回归是一种常用的预测建模技术。在本章中，我们讨论了使用逻辑回归进行模型构建。

  *   第 12 章演示了时间序列分析及其应用，以及如何实施 ARIMA 技术。

  *   第 13 章全部关于大数据。考虑到大数据分析领域的指数级增长和普及，我们认为以大数据的基础知识作为本书的结尾是合适的。最后一章通过实时数据和示例介绍了大数据，演示了
  Hadoop 的代码和使用。


  ## 本书未涵盖哪些内容？


  虽然本书能为您的分析和 SAS 基础知识打下良好基础，但以下主题留给您在更高级的资源中探索。此列表并非详尽无遗。


  *   高级 SAS 编程技术，例如宏

  *   高级分析概念，例如优化、高级运筹学技术、机器学习和决策树

  *   高级大数据概念，例如 MapReduce 编码


  ## 本书有哪些独特之处？


  我们尤为自豪的是本书简洁的呈现风格以及贴近实际、实践性强的真实案例。以下是本书的一些独特设计特点：


  *   从第一章到最后一章，书中包含大量示例。

  *   每个概念都通过业务场景或案例研究进行解释。

  *   它提供了理论与实践操作的恰当结合。

  *   它由目前正在分析领域为付费客户解决实际问题的行业专业人士撰写。

  *   它简化了复杂的统计概念。

  *   它提供了 SAS 代码和足够数量的数据集。

  *   本书自成体系。您不需要任何其他资源或参考资料就能掌握这些概念。


  ### 本书包含动手练习吗？


  是的！每章都有演示和动手示例。每个案例研究中使用的数据集均可通过本书在 Apress.com 上的网页获取。您可以下载数据和代码文件进行练习。



  ### 本书涵盖了哪些行业案例？


  本书中的案例并不局限于任何特定领域。我们尽量涵盖尽可能广泛的行业范围。以下是一些具体例子：


  - 银行业中的贷款违约者数据分析

  - 来自沃尔玛等零售商的案例

  - 分析学在社交媒体分析中的应用

  - 联络中心通话量数据分析

  - 智能手机销量预测分析

  - 客户画像变量之间的关联性分析

  - 股票价格预测

  - 制造工厂中的机器质量检测

  - 获取网站日志数据的洞察

  - 预测贷款数据中每个客户的相关风险

  - 以及更多例子


  ### 您将从本书中学到什么？


  本书将为您在业务分析和 SAS 方面打下扎实的实践基础。您将学到以下内容：


  - 如何将分析学应用于现实业务问题

  - 如何构建分析模型并从中得出有用的推论

  - 如何编写 SAS 程序以及如何在 SAS 中处理数据

  - 如何进行基本的描述性分析以从数据中获取洞察

  - 如何系统地探索、验证和清洗数据

  - 如何发现变量之间的关联性

  - 如何检验假设并从统计学角度接受或拒绝它

  - 如何利用多个独立因子预测因变量

  - 如何利用历史数据预测未来值

  - 如何计算获胜与失败的概率

  - 如何处理大数据

  - 以及更多内容


  ### 阅读本书需要哪些预备知识？


  本书不要求读者拥有研究生水平的数学或统计学背景。事实上，并不需要事先掌握统计学知识。具备高中水平的数学能力就足以理解本书中讲解的大部分概念。不过，需要具备基本的计算机和电子表格知识。对
  Microsoft Access 和 SQL 等数据库的初步了解也会有所帮助。具备基本的计算机编程知识则更佳。


  ### 本书适合哪些读者？


  本书适合在职专业人士、应届毕业生、学生以及分析学爱好者。在编写本书时，我们设想的读者群体如下：


  - 任何希望动手实践分析学的人

  - 希望提升分析技能的专业人士

  - 任何想要开始学习 SAS 的人

  - 统计学和商业分析专业的硕士和博士研究生

  - 任何希望进入零售、银行、保险和服务领域等分析领域的大学应届毕业生

  - 希望为研究生或本科生教授基础分析课程的讲师或教师

  - 非统计学背景的人士

  - 任何希望初步了解大数据分析的人




  ## 我能用这本书上分析学课程吗？


  当然可以！本书旨在传授概念，而非仅仅提供信息。所涵盖的所有概念都是独立的，无需参考其他资料。本书可轻松转化为一个学期的课程，作为 SAS、分析学和预测建模的入门教材。它适用于任何旨在向学生介绍商业分析学的本科或研究生课程。


  以下是为期一学期课程的建议教学计划，包含 30 节理论课和 12 节实验课。课程讲师可根据具体需求进行调整。


