  \ mean;\nvar volume;\nwhere Hour < 9 ;\nrun ;\n```\n\n表 7-9 显示了上述代码的输出结果。\n\n**表\
  \ 7-9.** 1 到 8 小时呼叫量的平均值\n\n| 平均 |\n| 4,247.72 |\n\n以下代码用于计算移除异常值后，后 16 小时的平均值。\n\
  \n```\nTitle '9 到 24 小时呼叫量的平均值';\nproc means data=WORK.call_Volume_subset mean;\n\
  var volume;\nwhere  Hour ge 9 ;\nrun ;\ntitle;\n```\n\n表 7-10 显示了上述代码的输出结果。\n\n\
  **表 7-10.** 9 到 24 小时呼叫量的平均值\n\n| 平均 |\n| 46,373.44 |\n\n修改后的数据集显示，每小时的平均呼叫量为 32,952。前\
  \ 8 小时的呼叫数量几乎是后 16 小时呼叫数量的十分之一。这些数字符合业务逻辑，也与经理的经验相符。分析推理的结果并非总是与经验一致。分析后，结果也可能相反。无论哪种情况，分析结果都应该具备合理性，并符合业务逻辑。在呼叫中心示例中，对原始数据进行的盲目平均计算得出了与业务实际情况相反的结果。而对数据的仔细检查则揭示了异常值的存在。\n\
  \n尽管 120 条记录中仅有 7 条存在问题，但结果却产生了巨大差异。在开始分析之前，养成例行检查数据的习惯总是一个好主意。\n\n## 真实世界数据的问题及解决方法\n\
  \n真实世界的数据通常是粗糙的，无法以其原始形式进行分析。以下是数据分析项目中经常遇到的一些挑战：\n\n-   真实世界数据通常包含缺失值，这些可能是未采集到或不可用的数据点。\n\
  -   数据集中经常包含异常值。例如，样本中少数几个人的月收入记录达到数百万。\n-   某些数据集中的一些字段有时是常量，例如在所有记录中看到 `age =\
  \ 11` 和 `number of personal loans = 6`。\n-   数据存在明显错误，例如 `number of dependents =\
  \ -3`。\n-   数据可能包含默认值，例如 `999999`、`1111111`、`#VALUE`、`NULL` 或 `N/A`。\n-   数据不完整，或者仅在汇总级别可用，而非交易级别，大多数经济指标便是如此。如果你在交易级别进行分析，可能会产生很大的误差。\n\
  -   数据量不足。分析所需的关键变量可能不存在于数据集中。\n\n\n\n### 缺失值\n\n缺失值和异常值是数据集中最常见的两个问题。数据不可用也是一个常见问题。有时，大量总体或样本数据中可能存在缺失值。以下是一些示例：\n\
  \n- 在涉及发展中国家和欠发达国家的信贷机构数据中，可能会存在大量缺失值。\n- 一项包含可选字段的市场调研，在设计上就必然会出现缺失值。\n\n### 异常值\n\
  \n异常值并非严格意义上的错误，但它们可能导致误导性的结果。异常值通常是指与该变量其他值差异极大的数值。例如，在某个数据列中，95% 的数据落在特定范围内，而其余\
  \ 5%的数据则完全不同，这可能会显著改变整体结果。这个问题在呼叫量示例中出现过。其他一些异常值的实例如下：\n\n- 保险理赔数据中，仅有 2%的索赔金额超过\
  \ 500 万美元，其余均低于 80 万美元。\n- 超级门店的客户消费数据中，一个月内仅有 4 位客户消费了 5 万美元，其余客户消费均低于 6000 美元。\n\
  \n以上仅是原始数据中可能存在的两个问题示例，这些数据可供分析。在数据集层面可能还存在其他若干问题，例如与变量类型（如日期、数字和字符）相关的格式挑战。变量长度可能不具有业务意义。此外，在将数据从一个数据库平台传输到另一个时，还可能产生其他多种数据问题。本章仅聚焦于与数据分析相关的问题。\n\
  \n### 手动检查数据集并非可行之策\n\n呼叫量示例中的数据量较小，使得手动查找数据异常成为可能。但对于包含众多变量的大型数据集而言，这并不可行。一个拥有超过\
  \ 100 个变量和 100 万条记录的数据集，不允许我们手动检查其中的异常值和其他数据相关问题。\n\n因此，在进行分析之前，你需要一种可靠、科学的方法来审视数据。数据探索过程应能凸显所有难以手动识别的隐蔽问题。\n\
  \n### 删除记录并非总是正确的方法\n\n能否简单地删除有问题的记录？这是正确的方法吗？如果不是，处理数据错误的最佳方式是什么？在识别出异常值和缺失值等问题后，人们很容易丢弃这些错误记录，然后继续进行余下的分析。但这样做也会失去一些宝贵的信息。\n\
  \n例如，考虑表 7-11 中给出的员工档案数据。该数据分为七列：\n\n**表 7-11. 员工档案数据**\n\n| 员工编号 | 姓名 | 年龄 | 学历\
  \ | 经验年限 | 性别 | 团队 |\n| --- | --- | --- | --- | --- | --- | --- |\n| `EMP001` |\
  \ - | 45 | 硕士 | 20 | 男 | 分析部 |\n| `EMP002` | 威尔 | 34 | 硕士 | 12 | 男 | - |\n| `EMP003`\
  \ | 怀特 | 35 | 博士 | 10 | - | IT 部 |\n| `EMP004` | 菲比 | - | 硕士 | 9 | 女 | IT 部 |\n\
  | `EMP005` | 杰克 | 32 | 学士 | - | 男 | 分析部 |\n| `EMP006` | 迈克 | 45 | - | 10 | 男 | 财务部\
  \ |\n\n- `EmpID`：员工编号\n- `Name`：员工姓名\n- `Age`：员工年龄\n- `Qualification`：员工学历\n- `Experience`：员工工作年限\n\
  - `Gender`：员工性别\n- `Team`：员工所在团队\n\n从这些列可以明显看出，每条记录至少缺少一个字段，因此删除含有缺失值的记录并非解决方案。你需要一个稳健且一致的解决方案。\n\
  \n## 理解与准备数据\n\n第 6 章使用了箱线图技术来识别变量中的异常值。为了全面理解数据，也可以在数据分析中使用一些简单的描述性统计技术和检查点。正如之前在呼叫量示例中讨论的那样，需要首先理解和清理数据。只有这样，数据才能准备好用于分析。以下各节将详细探讨数据探索、数据验证和数据清洗。\n\
  \n### 数据探索\n\n数据检查的第一步是全面理解数据及其结构的细微细节。需要回答以下问题：\n\n- 数据是如何构成的？\n- 变量有哪些？\n- 它们的类型是什么？\n\
  - 有多少个变量？\n- 有多少条记录？\n- 是否存在缺失值？\n\n### 数据验证\n\n数据验证将回答以下问题：\n\n- 所有值都正确吗？\n- 存在异常值吗？\n\
  - 变量类型正确吗？\n- 数据是否与数据字典（描述了数据集中所有涉及的变量）相匹配？\n\n所有这些问题都涉及对数据进行准确性检查。此步骤可以在数据探索期间执行，也可以作为一个单独的步骤进行。在此阶段，会用到简单的描述性统计技术。\n\
  \n### 数据清洗\n\n通过数据探索和数据验证，你可以识别出数据集中几乎所有的问题。接下来，需要清洗数据，使其准备好用于分析。异常值和缺失值，以及任何其他错误，都需要通过适当的替换进行修正。但是，当变量是离散型或连续型时，数据清洗的过程相同吗？如果数据中只有\
  \ 1%的值缺失怎么办？如果 30%的值缺失呢？对于 10%、30%和 90%的缺失值情况，处理方法是否相同？\n\n数据探索、验证和清洗的步骤在项目生命周期中会占用相当多的时间，有时甚至高达项目总可用人力的\
  \ 70%。而且没有捷径可走。你需要探索所有变量以理解和解决问题。本章后续主题将讨论如何使用一个信用风险案例研究来理解、验证和清洗数据。\n\n\n## 数据探索、验证与清洗案例研究：信用风险数据\n\
  \n以下是一个信用风险案例研究，我们在本章中会使用该案例来演示在实际分析过程开始之前，与数据准备相关的各个步骤和概念。\n\n### 信用评分系统\n\n参考：本案例研究使用的数据集基于\
  \ Kaggle 网站并获其许可使用，网址为 [`https://www.kaggle.com/c/GiveMeSomeCredit`](https://www.kaggle.com/c/GiveMeSomeCredit)。\n\
  \n众所周知，银行会提供多种产品，例如个人贷款、信用卡、抵押贷款和汽车贷款。每家银行都会在发放贷款或信用卡之前，评估与客户相关的风险。每个客户都基于一些关键参数进行评估，例如过往贷款次数、平均收入、年龄、受抚养人数等。银行会使用高级分析方法并构建预测模型，以在发卡或放贷前找到违约的概率。\n\
  \n历史客户付款和使用数据被用于构建预测模型，该模型将量化与每个客户相关的风险。银行会确定一个临界点，任何风险高于该临界点的客户都将被拒绝。这种量化风险的方法被称为信用评分。每个客户都会根据这个基于历史数据构建的模型获得一个信用评分。信用评分越高，客户获得信贷的可能性就越大。通常，信用评分范围在\
  \ 0 到 1000 之间，但这不是强制性的。例如，如果某个客户的信用评分为 850，她申请贷款或信用卡很可能会获批。另一方面，如果客户评分为 350，她获得信贷的可能性几乎为零。\n\
  \n在构建信用风险模型时，需要注意缺失值和异常值等数据错误。如果处理不当，一个错误可能会否定整个模型的可信度，而一笔重大的贷款违约就可能抵消从 100 个优质案例中获得的利润。该模型在任何情况下都必须稳健，因为没有银行愿意给一个不良客户打高分。因此，在涉及金融交易的模型中，数据探索、验证和清洗变得非常重要。\n\
  \n### 数据字典\n\n参考：基础数据集取自 Kaggle 并经过修改。\n\n表 7-12 和 7-13 给出的是用于构建预测模型的数据集。通常随数据一起提供的数据字典解释了所有变量的详细信息。每个变量都需要被检查，以便在必要时理解、验证和清理。以下是银行数据团队提供的信息。\n\
  \n提供了在过去两年业绩窗口期内收集的 250,000 名借款人的历史数据。这些数据的一部分用于构建模型，另一部分则留作测试和验证之用。\n\n数据集的文件名为\
  \ `Customer_loan_data.csv`，数据字典（变量详细信息）见表 7-12。\n\n**表 7-12. 示例数据字典**\n\n| 变量名称\
