  \ 误差 | 91 | 859.47379 | 9.44477 |   |   |\n| 校正总和 | 95 | 99899 |   |   |   |\n\n\
  | 均方根误差 | 3.07323 | R-Square | 0.9914 |\n| 因变量均值 | 155.96875 | 调整后 R-Sq | 0.9910\
  \ |\n| 变异系数 | 1.97042 |   |   |\n\n| 参数估计 |\n| 变量 | 自由度 | 参数估计值 | 标准误差 | t 值 | Pr\
