  \ 的 `VIF` 略高，你可以删除它。这里 `math` 和 `science` 的 `VIF` 值几乎相同，所以你保留最重要的变量（在业务问题的背景下）。否则，你可以继续删除\
  \ `VIF` 最高的变量。\n\n以下是剔除 `mathematics` 后的模型构建代码：\n\n```\nproc reg data=sat_score;\n\
  model SAT=General_knowledge Aptitude Science/VIF;\nrun;\n```\n\n输出结果请参考表 [10-32]。\n\
  \n表 10-32.\n剔除数学后 SAT 考试数据的 VIF 值\n\n| 参数估计 |\n| --- |\n| 变量 | 自由度 | 参数估计 | 标准误差\
