  | 科学 | 1 | 0.96503 | 0.06522 | 14.80 | <.0001 |\n\n输出现在出现了一个重要且巨大的变化。数学的贝塔系数如今为正。仅仅将一个数值从\
  \ 102 改为 60，数学系数就完全颠倒了过来。这正是我们试图强调的多重共线性所带来的不利影响。\n\n以下是在存在多重共线性的情况下，观察高标准差或系数变化的另一种方式：\n\
  \n- 我们来构建一个新模型：`Y` 对 `X1`、`X2` 和 `X3`。这里 `X2` 和 `X3` 之间存在显著的多重共线性关系。\n- 假设 `X3`\
  \ 与 `X2` 几乎呈线性关系。且 `X3` 约等于两倍的 `X2`，可表示为 `X3 ∼ 2X2`。\n- 假设最终模型方程为 `Y = X1 + 20X2\
  \ - 2X2`。请注意，`X2` 的系数为负（-2）。\n\n现在你将尝试证明，在存在多重共线性的情况下，系数极其不稳定，以至于它们甚至可能改变符号，而不会影响整个模型的预测能力（整体\
  \ R 方保持不变）。\n\n模型 `Y = X1 + 20X2 - 2X3`\n\n多重共线性 `X3 ∼ 2X2`\n\n重写模型 `Y = X1 + 14X2\
  \ + 6X2 - 2X3`\n\n重写模型 `Y ∼ X1 + 14X2 + 3X3 - 2X3` （代入 `X2 = X3/2`）\n\n重写模型 `Y ∼\
  \ X1 + 14X2 + X3`\n\n因此，由于多重共线性，原始模型 `Y = X1 + 20X2 - 2X3` 最终变成了 `Y ∼ X1 + 14X2\
  \ + X3`。`X3` 的系数从负变为正。类似地，你可以在这个模型上做文章，使系数几乎变为任何值。这正是我们讨论的问题——回归系数的不稳定性以及贝塔系数估计值的高标准差。\n\
  \n简而言之，如果模型中存在多重共线性，则回归系数不可用于任何有意义的分析。\n\n多重共线性的挑战引出了三个问题：\n\n- 多重共线性的成因是什么？\n-\
  \ 如何在模型中识别多重共线性的存在？\n- 一旦识别出多重共线性，解决之道是什么？如何将其影响降至最低？\n\n### 多重共线性的成因是什么？\n\n多重共线性本身并非分析中的任何错误所致。如果自变量之间存在一些相互依赖关系，分析方并无过错。分析者需要意识到这一点，并在构建精确回归模型时加以处理。以下是多重共线性的一些成因：\n\
  \n- 数据的收集方式可能导致多重共线性。收集数据时，你是否选择了所有独立且不相关的变量？\n- 解释同一信息的变量过多，可能是多重共线性的成因之一。例如，年均收入、平均纳税额和年净储蓄等变量在大多数情况下可能彼此相关。所有这些变量都在解释一个人的财务状况。\n\
  - 模型变量指定不准确可能是另一个原因。例如，变量 `X` 及其倍数同时出现在模型中。另一个例子是 `X` 和与 `X` 相关的多项式项同时出现在模型中。\n\
  - 拥有过多的自变量也可能导致多重共线性。在回归建模中，拥有过多自变量而记录过少从来都不是一个好主意。有时别无选择，只能继续。在这种情况下，分析者需要应对多重共线性的挑战。\n\
  \n\n\n### 多重共线性的识别\n\n正如你所见，多重共线性对分析人员来说是一个严峻的挑战。它由一些已知或未知的原因（有时是变量间未知的关系）引起。现在，你每时每刻都需要能够解释为什么两个变量是相关的。分析人员需要在模型构建阶段保持警惕并识别出多重共线性；否则，可能会导致不合理的推断。\n\
  \n多重共线性可以通过相关分析技术来识别。通过寻找相关性，你可以看到两个变量之间关联的强度。如果存在高度相关性，则表明模型存在多重共线性。存在相关性就足以说明存在多重共线性。但是，即使模型存在多重共线性，相关性也不一定总是很高。简单的相关性不足以识别所有类型的多重共线性。相关性仅仅是一种成对的关联度量，因此，如果一个自变量与两个或更多自变量关联较弱，你将无法量化这种关联。（如果成对关联很弱，多重共线性在相关性中就不会显现，你需要采用不同的度量标准。）所有这些关联的变量共同作用，可以有力地解释那个特定自变量中的变异。让我们举一个例子，其中`x2`、`x3`和`x5`与`x4`相关（图\
  \ 10-9）。\n\n![A978-1-4842-0043-8_10_Fig9_HTML.jpg](img/A978-1-4842-0043-8_10_Fig9_HTML.jpg)\n\
  \n**图 10-9.** 多重共线性：`x2`、`x3` 和 `x5` 与 `x4` 相关\n\n暂时忘记`Y`，看看这三个变量`x2`、`x3`和`x5`是否真的影响了`x4`的变化。你需要一个能够量化多个变量之间关系的度量标准。如何了解多个自变量对一个因变量的综合影响呢？在此上下文中，`x2`、`X3`、`X5`是自变量，而`x4`是因变量。请参考图\
  \ 10-10。\n\n![A978-1-4842-0043-8_10_Fig10_HTML.jpg](img/A978-1-4842-0043-8_10_Fig10_HTML.jpg)\n\
  \n**图 10-10.** `X4` 被视为因变量，而 `x2`、`x3` 和 `x5` 与 `x4` 相关\n\n我们使用这些自变量构建一个回归模型，并观察其`R\
  \ 平方`的值。如果对于模型`x4`与`x2`、`x3`和`x5`的`R 平方`值很高，那么变量`x4`就可以被其他三个变量所解释。这将表明存在相互依赖性或多重共线性。\n\
  \n为了检测一组自变量内部的多重共线性，你首先需要选择该组中的不同子集。为这些子集构建回归线，并检查每条回归线的`R 平方`值。\n\n以下是整体模型：\n\n\
  `y vs. y1, y2, y3………….yp`\n\n以下是用于检测多重共线性的模型：\n\n`x1 vs. x2, x3…….xp` → R 平方值 (`R²1`)\n\
  \n`x2 vs. x1, x3…….xp` → R 平方值 (`R²2`)\n\n…\n\n`xp vs. x1, x2, x3…….xp-1` → R 平方值\
  \ (`R²p`)\n\n最后，记录`R²1`、`R²2` …………`R²p`的值来检测多重共线性。\n\n如果`R 平方`值很高，则是多重共线性的一个迹象。`R\
  \ 平方`值超过 80% 通常被视为存在多重共线性的良好指标。\n\n### 方差膨胀因子 (VIF)\n\n`VIF` 是专门定义用来衡量多重共线性的指标。\n\
  \n因此，`R 平方`值越高，`VIF`值就越高。实际上，`VIF`会放大`R 平方`值。如果`R 平方`值为 80%，那么`VIF`值将为 5。请参考表 10-28。\n\
  \n**表 10-28.** R 平方和 VIF 值\n\n| R 平方 | 40% | 50% | 60% | 70% | 80% | 90% | 95% |\
  \ 98% | 99% |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n|\
  \ VIF | 1.7 | 2.0 | 2.5 | 3.3 | 5.0 | 10.0 | 20.0 | 50.0 | 100.0 |\n\n**注意：** 不要将此处的`R\
  \ 平方`与整体模型的`R 平方`值混淆。这个`R 平方`是通过在自变量之间构建模型计算得出的。\n\n如果某个变量的`VIF`值大于 5，则表明存在强多重共线性，并且该变量可被视为冗余。这是因为该变量\
  \ 80% 或更多的变异可以由其余的自变量解释。因此，在构建多元回归线时，查看`VIF`值是强制性的。\n\n我们再以 SAT 分数为例，计算`VIF`值以检查是否存在任何多重共线性。在这个模型中，你已经了解了一些情况，但我们将使用`VIF`值来确认这一点。SAS\
  \ 中的`PROC REG`有一个`VIF`选项，它可以计算每个变量的`VIF`值。你无需担心为自变量的不同组合分别计算每个`VIF`值。\n\n以下是在输出中显示`VIF`值的代码；你需要在模型语句中添加关键字`VIF`：\n\
  \n```\nproc reg data=sat_score;\nmodel SAT=General_knowledge Aptitude Mathematics\
  \ Science/VIF;\nrun;\n```\n\n表 10-29 显示了此代码的输出结果。\n\n**表 10-29.** `PROC REG` 在 `sat_score`\
  \ 上的输出\n\n| 读取的观测数 | 96 |\n| --- | --- |\n| 使用的观测数 | 96 |\n\n| 方差分析 |\n| 来源 | 自由度\
