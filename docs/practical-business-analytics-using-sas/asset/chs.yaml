  \ | 477 | 0.19 | 251503 | 100.00 |\n\n96 和 98 的问题似乎是一致的。这些是默认值吗？尽管百分比很低，但这个问题会造成困扰。在解决之前必须注意这一点。\n\
  \n目前的问题列表包括以下内容：\n\n-   循环利用率存在约 5% 的异常值。\n-   月收入在 20% 的案例中缺失。\n-   30 至 59 DPD、60\
