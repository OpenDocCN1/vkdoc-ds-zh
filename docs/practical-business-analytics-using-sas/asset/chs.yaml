  \ 3`处截断。TS 6 是一个 3 阶 AR 过程。\n\n##### 识别 MA 过程的经验法则\n\n识别 MA 过程的方法与识别 AR 过程几乎相同。对于\
  \ MA 过程，PACF 缓慢衰减，而 ACF 截断。由于在 MA 过程中，序列的当前值不直接依赖于过去的值，因此 ACF 会截断。序列的误差依赖于先前的误差。这是导致\
  \ PACF 缓慢衰减的原因。表 12-11 列出了识别 MA 过程的经验法则。\n\n表 12-11. 识别 MA 过程的经验法则\n\n| MA 过程 |\
  \ 行为 |\n| --- | --- |\n| ACF | 截断。截断的滞后阶数表示 MA 过程的阶数。 |\n| PACF | 缓慢衰减或逐渐消失至零。要么沿一个方向减小，要么以正弦波的形式减小。\
  \ |\n\nPACF 图有一个小问题。由于处理的是误差，其量级通常很小，因此 PACF 图不清晰，难以解释。你可以使用逆自相关函数（IACF）图作为 PACF\
  \ 图的替代。\n\n\n\n##### 逆自相关函数\n\n逆自相关函数是一种自相关函数，其中误差和实际序列值的作用相互交换。`ARMA(2,0)` 的 `ACF`\
  \ 图与 `ARMA(0,2)` 的 `IACF` 图看起来相同。你可以在分析中使用 `IACF` 作为 `PACF` 的替代品。对于某些模型，`IACF` 图会显示出清晰的趋势，因此易于解读。你可以将\
