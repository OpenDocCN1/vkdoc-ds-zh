  \n表 11-11 是一个重要的表格，因为你可以利用它来验证模型。它能让你了解错误分类的情况以及模型的有效性。较高的**一致百分比**始终是理想目标。`Somers'\
  \ D`、`Gamma`、`Tau-a` 和 `C` 这些统计量均仅来源于对错误分类与正确分类的对比。\n\n将实际因变量值为 `0` 的样本分类为 `0`，或赋予其较高概率，属于正确分类（无误差）。如果模型将实际值为\
  \ `0` 的样本分类为 `1`，或将实际值为 `1` 的样本分类为 `0`，或者当实际因变量值为 `1` 时却赋予 `0` 较高概率（反之亦然），则属于错误分类。我们将在“逻辑回归的拟合优度”一节中详细解释正确分类与错误分类。\n\
  \n**表 11-11.** 预测概率与观测响应的关联性，`PROC LOGISTIC` 的输出表\n\n| 预测概率与观测响应的关联性 | | |\n| ---\
  \ | --- | --- |\n| 一致百分比 | 92.0 | Somers' D | 0.851 |\n| 不一致百分比 | 6.9 | Gamma |\
  \ 0.861 |\n| 结百分比 | 1.1 | Tau-a | 0.365 |\n| 对子数 | 525 | C | 0.926 |\n\n### 自变量的个体影响\n\
  \n在线性回归模型中，你使用 P 值来检验自变量对因变量是否有显著影响。线性回归中的 beta 系数服从 T 分布，因此你通过 T 检验来查看每个变量的影响。而在逻辑回归中，beta\
  \ 系数服从卡方分布。因此，卡方检验的概率值（P 值）告诉你自变量在逻辑回归模型中的影响程度。\n\n逻辑回归中的卡方检验用于检验以下假设：\n\nH[0]：自变量对因变量没有显著影响。\n\
  \nH[1]：自变量对因变量有显著影响。\n\n你将查看卡方检验的 P 值来决定接受还是拒绝该假设。\n\n*   如果卡方检验的 P 值小于 5%，则拒绝原假设；你拒绝“该变量对因变量没有显著影响”的原假设。这意味着该变量有显著影响；因此，你将其保留在模型中。\n\
  *   如果卡方检验的 P 值大于 5%，则没有足够证据拒绝原假设。因此，你接受“该变量对因变量无显著影响”的原假设；于是，你将其从模型中剔除。从模型中剔除这些不显著的变量不会影响模型精度。\n\
  \n当你比较两个自变量以决定哪个变量影响更大时，可以查看 `Wald 卡方` 值。如果 `Wald 卡方` 值高，则 P 值低。例如，如果你正在比较收入与受抚养人数这两个自变量对响应变量的影响，那么\
  \ `Wald 卡方` 值较高的变量将被选中，因为它对因变量（或响应变量）的影响更大。\n\n表 11-12 是来自冰淇淋销售示例的卡方检验表。\n\n*  \
  \ H[0]：年龄对冰淇淋购买行为没有显著影响。\n*   H[1]：年龄对冰淇淋购买行为有显著影响。\n\n**表 11-12.** 卡方检验，`PROC LOGISTIC`\
  \ 的输出表\n\n| 最大似然估计分析 | | | | |\n| --- | --- | --- | --- | --- |\n| 参数 | 自由度 | 估计值\
  \ | 标准误差 | Wald 卡方 | Pr > 卡方 |\n| 截距 | 1 | 3.8982 | 1.3446 | 8.4044 | 0.0037 |\n\
  | 年龄 | 1 | -0.1353 | 0.0410 | 10.8989 | 0.0010 |\n\n`年龄` 变量的 P 值为 0.0010，小于 0.05（5%）。因此，你可以拒绝原假设，这意味着年龄对冰淇淋购买行为有显著影响。\n\
  \n### 逻辑回归的拟合优度\n\n在本节中，我们将详细讨论卡方检验以及一致性。\n\n#### 卡方检验\n\n卡方值及其相关的卡方检验是逻辑回归中拟合优度的基本衡量指标。卡方检验用于检验原假设：所有自变量的回归系数均为零，与备择假设：至少有一个自变量是显著的。卡方检验类似于线性回归中的\
  \ F 检验。\n\nH[0]：  \n*   β₁ = β₂ = ... = βₙ = 0。  \n*   这等同于。  \n*   这意味着整个模型不显著，或者说它没有解释力。\n\
  \nH[1]：  \n*   这等同于至少有一个 βᵢ ≠ 0。  \n*   这意味着至少有一个变量是显著的，或者说模型具有一定的解释力。\n\n如果卡方检验的\
  \ P 值大于 5%，则模型面临风险。如果 P 值大于 5%，则你必须接受原假设，这意味着整体模型不显著。继续前进没有意义，并且没有一个自变量对因变量有显著影响。这会促使你收集更多数据，寻找更具影响力的自变量。在\
  \ SAS 输出中，你会看到三个卡方检验——似然比、得分和 Wald——它们都服务于同一目的。通常，所有这些检验会显示相同的结果。\n\n\n\n#### 一致性\n\
  \n如前所述，一致性度量可以评估逻辑回归模型的准确度或拟合优度。本节将通过一个例子来帮助理解一致性和不一致性。\n\n设想一个简单的数据集，其中只有 10 个观测值。因变量有\
  \ 5 条记录取值为 1，另外 5 条取值为 0。构建模型后，你将确定每个记录因变量的预测概率。结果如表 11-13 所示。\n\n表 11-13. 因变量的预测概率\n\
  \n| 因变量 | 预测概率 |\n| --- | --- |\n| 0 | `P1` |\n| 0 | `P2` |\n| 0 | `P3` |\n| 0 |\
  \ `P4` |\n| 0 | `P5` |\n| 1 | `P6` |\n| 1 | `P7` |\n| 1 | `P8` |\n| 1 | `P9` |\n\
  | 1 | `P10` |\n\n利用 5 个 0 和 5 个 1 以及它们对应的概率，你可以组成 25 对组合。\n\n(0 `P1` – 1 `P6`),\
  \ (0 `P1` – 1 `P7`), (0 `P1` – 1 `P8`), (0 `P1` – 1 `P9`), (0 `P1` – 1 `P10`)\n\n\
  (0 `P2` – 1 `P6`), (0 `P2` – 1 `P7`), (0 `P2` – 1 `P8`), (0 `P2` – 1 `P9`), (0 `P2`\
  \ – 1 `P10`)\n\n(0 `P3` – 1 `P6`), (0 `P3` – 1 `P7`), (0 `P3` – 1 `P8`), (0 `P3`\
  \ – 1 `P9`), (0 `P3` – 1 `P10`)\n\n(0 `P4` – 1 `P6`), (0 `P4` – 1 `P7`), (0 `P4`\
  \ – 1 `P8`), (0 `P4` – 1 `P9`), (0 `P4` – 1 `P10`)\n\n(0 `P5` – 1 `P6`), (0 `P5`\
  \ – 1 `P7`), (0 `P5` – 1 `P8`), (0 `P5` – 1 `P9`), (0 `P5` – 1 `P10`)\n\n以第一对组合(0\
  \ `P1` – 1 `P6`)为例。如果你构建的模型是用于预测值为 0 的情况，那么`P1`应该高于`P6`。一个好的模型应该赋予 0 更高的概率，而赋予 1\
  \ 更低的概率。因此，在第一对中，`P1`应大于`P6`；在第二对中，`P1`应大于`P7`；在最后一对中，`P5`应大于`P10`。这种准确的分类被称为**一致性**。一致性百分比是指在所有可能的配对中，属于一致性案例的百分比。一致性百分比越高，模型的准确度就越高。\n\
  \n如果在第一对组合(0 `P1` – 1 `P6`)中，`P1`小于`P6`，那么这就不妙了。你构建模型是为了预测 0，但模型最终却为 1 赋予了更高的概率，为\
  \ 0 赋予了更低的概率。这种错误分类被称为**不一致性**。不一致配对占所有配对（所有可能的配对）的百分比被称为不一致性百分比。\n\n例如，从冰淇淋销售数据中取一对数据。\n\
  \n| 年龄 | 购买 |\n| --- | --- |\n| 6 | 0 |\n| 45 | 1 |\n\n这对数据是(0 `P1` – 1 `P2`)。如果你将年龄值代入模型，得到`p1\
  \ = 95%`，`p2 = 0.6%`。因此，你正确预测了：如果一个人是 6 岁，他购买冰淇淋的概率更高（`p1 = 95%`），而 45 岁的人购买的概率几乎为零（`p2\
  \ = 0.6%`）。这些预测实际上与表中的原始观测值相符。\n\n这就是我们对一个好模型的期望：当你观测到 0（实际值）并尝试预测它时，模型概率应给出相同的结论。同样，当你取值为\
  \ 1 并用模型进行预测时，模型也应给出相应的预测。当你取一对数据(0, 1)且概率为(0 `P1` – 1 `P2`)时，你至少期望模型给出的预测`P1`和`P2`满足`P1\
  \ > P2`。这就是一致性。反之则为不一致性。\n\n**结**（Tied）的情况是指我们的模型对 0 和 1 给出了相同的概率，例如对 0 和 1 都为 0.5。\n\
  \n表 11-14 是冰淇淋销售示例的输出结果。\n\n表 11-14. 预测概率与观测响应的关联性，`PROC LOGISTIC` 对冰淇淋销售数据的输出表\n\
  \n| 预测概率与观测响应的关联性 |\n| --- |\n| 一致百分比 | 92.0 | Somers’ D | 0.851 |\n| 不一致百分比 | 6.9\
  \ | Gamma | 0.861 |\n| 结百分比 | 1.1 | Tau-a | 0.365 |\n| 总配对 | 525 | c | 0.926 |\n\
