  \n\n\n####### ARIMA 过程中的积分分量\n\n在上一节中，你了解了如何通过差分使非平稳过程变得平稳。原始微软股票价格是几十美元的量级，而差分后的值（新的平稳序列）则是分数（小数）量级。请参考表\
  \ 12-6。\n\n差分后的序列是平稳的，可以使用 Box-Jenkins 方法进行分析。这个新序列可以是任意 `ARMA(p,q)` 过程。但是，该序列的预测值将只是分数形式。事实上，你对预测差分后的时间序列并不感兴趣。我们的主要兴趣在于预测实际的微软股票价格，显然不是差分后的序列。你仍然可以从差分序列中推导出原始序列的值。你需要对差分序列执行一个积分操作，这是差分的数学逆运算。你通过差分使序列变得平稳。现在，你对变换后的序列进行积分，使其恢复到原始形态。这里的差分阶数\
  \ (`d`) 为 1。你对股票价格序列进行的差分阶数也是 1。带有积分的 ARMA 序列也称为 ARIMA 序列。它表示为 `ARIMA(p,d,q)`，其中\
  \ `p` 是自回归（AR）分量的阶数，`d` 是积分的阶数，最后 `q` 是移动平均（MA）分量的阶数。\n\n在当前示例过程中所需的积分阶数是 1。这仅仅是因为为了使其平稳，你进行了一次差分。有些序列无需任何差分就是平稳的。对于这些时间序列，积分的阶数为\
  \ 0。以下是一些 ARIMA 过程的示例：\n\n`ARIMA(1,1,0)` 序列写为：\n\n```\n∆Y[t] = a[1]*∆Y[t-1] + ε[t]\n\
  ```\n\n`a[1]` 是 `∆Y[t-1]` 对 `∆Y[t]` 影响的因子或量化值，`ε[t]` 是时间 `t` 的随机误差，换句话说，`∆Y[t]=Y[t]-Y[t-1]`。\n\
  \n`ARIMA(2,1,0)` 序列写为：\n\n```\n∆Y[t] = a[1]*∆Y[t-1]+ a[2]*∆Y[t-2] + ε[t]\n```\n\n\
  `a[1]` 和 `a[2]` 是 `∆Y[t-1]` 和 `∆Y[t-2]` 对 `∆Y[t]` 影响的因子或量化值，`ε[t]` 是时间 `t` 的随机误差，换句话说，`∆Y[t]=Y[t]-Y[t-1]`。\n\
  \n`ARIMA(1,1,1)` 序列写为：\n\n```\n∆Y[t] = a[1]*∆Y[t-1]+ ε[t] + b[1]*ε[t-1]\n```\n\n\
  `a[1]` 是 `∆Y[t-1]` 对 `∆Y[t]` 影响的因子或量化值，`ε[t]` 和 `ε[t-1]` 分别是时间 `t` 和 `t-1` 的随机误差，换句话说，`∆Y[t]\
  \ = Y[t]-Y[t-1]`。\n\n####### 预测后的积分\n\n你可能想知道如何在预测后进行积分。表 12-6 显示了在微软股票价格示例中对原始序列差分后序列的形式。在这个例子中，你发现股票价格不是平稳的，但\
  \ `diff_stock_price` 是平稳的。\n\n现在假设你已经对 `diff_stock_price` 序列进行了分析并产生了三个预测值。请参考表\
  \ 12-8 中的观测值 11、12 和 13。\n\n**表 12-8.** 时间序列 `diff_stock_price` 中的预测值\n\n| 观测序号\
  \ | `stock_price` | `diff_stock_price` |\n| --- | --- | --- |\n| 1 | 27.05 | . |\n\
  | 2 | 27.23 | 0.18 |\n| 3 | 25.55 | -1.68 |\n| 4 | 24.86 | -0.69 |\n| 5 | 24.72\
  \ | -0.14 |\n| 6 | 24.64 | -0.08 |\n| 7 | 25.5 | 0.86 |\n| 8 | 25.41 | -0.09 |\n\
  | 9 | 25.34 | -0.07 |\n| 10 | 25.94 | 0.60 |\n| 11 |  | -0.10 |\n| 12 |  | 0.21\
  \ |\n| 13 |  | -0.11 |\n\n完成这一步后，你如何知道观测值 11、12 和 13 的股票价格呢？换句话说，这里的问题是如何将预测出的序列恢复到其原始单位？\n\
  \n你知道，在任何给定时间 `t` 的差分股票价格可以通过以下公式计算：\n\n-   时间 `t` 的 `Diff_stock_price` = (时间 `t`\
  \ 的股票价格) - (时间 `t-1` 的股票价格)\n\n在预测之前：\n\n-   时间 10 的 `Diff_stock_price` = (时间 10\
  \ 的股票价格) - (时间 9 的股票价格)\n-   时间 10 的 `Diff_stock_price` = 25.94 – 25.34\n-   时间\
  \ 10 的 `Diff_stock_price` = 0.60\n\n在预测之后：\n\n-   时间 11 的 `Diff_stock_price` = (时间\
  \ 11 的股票价格) - (时间 10 的股票价格)\n-   将此方程中的值代入（来自表 12-8），你得到：\n-   `-0.10 = 时间 11 的股票价格\
  \ - 25.94`\n-   `时间 11 的股票价格 = 25.94 - 0.10`\n-   `时间 11 的股票价格 = 25.84`\n\n类似地，\n\
  \n-   时间 12 的 `Diff_stock_price` = (时间 12 的股票价格) - (时间 11 的股票价格)\n-   `0.21 = 时间\
  \ 12 的股票价格 - 25.84`\n-   `时间 12 的股票价格 = 25.84 + 0.21`\n-   `时间 12 的股票价格 = 26.05`\n\
  \n重复同样的计算，你会得到时间点 13 的股票价格为 25.94 (表 12-9)。\n\n**表 12-9.** 时间序列 `stock_price` 和\
  \ `diff_stock_price` 中的预测值（积分后）\n\n| 观测序号 | `stock_price` | `diff_stock_price` |\n\
  | --- | --- | --- |\n| 1 | 27.05 | . |\n| 2 | 27.23 | 0.18 |\n| 3 | 25.55 | -1.68\
  \ |\n| 4 | 24.86 | -0.69 |\n| 5 | 24.72 | -0.14 |\n| 6 | 24.64 | -0.08 |\n| 7 |\
  \ 25.5 | 0.86 |\n| 8 | 25.41 | -0.09 |\n| 9 | 25.34 | -0.07 |\n| 10 | 25.94 | 0.60\
  \ |\n| 11 | 25.84 | -0.10 |\n| 12 | 26.05 | 0.21 |\n| 13 | 25.94 | -0.11 |\n\n经验法则是：在差分时减去前一个滞后值；在积分时加上前一个滞后值。一旦序列变得平稳，就可以进行分析，而预测也变得相对容易。下一步是确定序列的类型。它是\
  \ AR、MA 还是 ARMA？\n\n对于当前的示例序列，你已经确定了积分的阶数。现在你需要识别 `p` 和 `q`。这是下一步。\n\n#### 步骤 2：识别模型\n\
  \n模型识别是使用 Box-Jenkins 方法进行时间序列建模的重要步骤之一。最终的预测精度将取决于你识别模型的准确程度。模型识别包括找出时间序列过程的类型，即你处理的是\
  \ `AR(1)` 还是 `AR(2)`，或是 `MA(1)` 还是 `MA(2)`，或是 `ARMA(1,1)` 还是 `ARMA(2,1)` 等。通过识别序列的类型，你将对数据有一个基本了解。如果是\
  \ AR，那么你就知道当前序列的值依赖于之前的值。AR 序列具有长期趋势。如果是 MA，那么误差会产生一些影响。MA 序列有一些短期的季节性效应。实际上，你可以将\
  \ `ARMA(p,q)` 序列的基本形式写成：\n\n```\nY[t] = a[1]*Y[t-1] + a[2]*Y[t-2] + a[3]*Y[t-3]\
  \ + ... + a[p]*Y[t-p] + ε[t] + b[1]*ε[t-1] + b[2]*ε[t-2] + ... + b[q]*ε[t-q]\n```\n\
  \n识别模型绝非易事。仅凭观察序列图来断定序列的类型和阶数是不够的。你需要一些具体的指标来识别序列的类型和阶数。你需要使用自相关函数（ACF）和偏自相关函数（PACF）及其图来识别序列的类型。我将在接下来的章节中详细阐述这一点。首先，为了更好理解，让我们看一些时间序列方程及其图形。\n\
