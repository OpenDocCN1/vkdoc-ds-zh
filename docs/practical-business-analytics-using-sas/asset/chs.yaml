  \n*图 12-30.* 对应于`y[t] = 0.55y[t-1] + 0.35y[t-2] + ε[t] -0.5 ε[t-1]`的时间序列图\n\n仅凭简单观察就足以判断序列类型了吗？在图\
  \ 12-16 到 12-30 的时间序列图中，其中一些是 AR 过程。这里有 AR(1)、AR(2)、AR(3)的例子。一些是纯 MA 过程。这里有 MA(1)、MA(2)和\
  \ MA(3)的例子。还有一些序列是 ARMA 过程。\n\n在前面的例子中，我模拟了数据；因此，我可以写出方程。但在实际场景中，你并不会拥有模型方程。你只会拥有序列值和序列图。你知道，仅通过观察序列值，很难将这些序列归类为\
  \ AR、MA 或 ARMA。你需要一些具体的指标来识别序列的类型。你需要使用 ACF 和 PACF 函数及图形来识别序列的类型。我将在以下部分讨论这些主题。下面将\
  \ 15 个时间序列方程集中放在一起，以便你进行比较：\n\n`TS - 1:` `y[t] = 0.66 y[t-1] + ε[t]`\n\n`TS - 2:`\
  \ `y[t] = 0.83 y[t-1] + ε[t]`\n\n`TS - 3:` `y[t] = -0.95 y[t-1] + ε[t]`\n\n`TS -\
  \ 4:` `y[t] = 0.4 y[t-1] + 0.48 y[t-2] + ε[t]`\n\n`TS - 5:` `y[t] = 0.5 y[t-1] +\
  \ 0.4 y[t-2] + ε[t]`\n\n`TS - 6:` `y[t] = 0.3 y[t-1] + 0.33 y[t-2] + 0.26 y[t-3]\
  \ + ε[t]`\n\n`TS - 7:` `y[t] = ε[t] - 0.8 ε[t-1]`\n\n`TS - 8:` `y[t] = ε[t] + 0.66\
  \ ε[t-1]`\n\n`TS - 9:` `y[t] = ε[t] + 0.95 ε[t-1]`\n\n`TS - 10:` `y[t] = ε[t] -\
  \ 0.4 ε[t-1] - 0.38 ε[t-2]`\n\n`TS - 11:` `y[t] = ε[t] - 0.6 ε[t-1] - 0.3 ε[t-2]`\n\
  \n`TS - 12:` `y[t] = ε[t] - 0.55 ε[t-1] - 0.35 ε[t-2] - 0.15 ε[t-3]`\n\n`TS - 13:`\
  \ `y[t] = -0.95 y[t-1] + ε[t] - 0.8 ε[t-1]`\n\n`TS - 14:` `y[t] = 0.77 y[t-1] +\
  \ ε[t] + 0.6 ε[t-1]`\n\n`TS - 15:` `y[t] = 0.55 y[t-1] + 0.35 y[t-2] + ε[t] - 0.5\
  \ ε[t-1]`\n\n##### 自相关函数\n\n自相关是指`Y[t]`与`Y[t-1]`之间的相关性。通常，你会找出两个变量之间的相关性，但这里，你是在寻找`Y`与其自身先前值之间的相关性。自相关函数是这些在不同滞后阶数上的所有相关性的函数。ACF\
  \ 用`ρh`表示，其中`h`表示滞后阶数。\n\n- ACF(0)：滞后 0 阶的相关性 (`ρ[0]`) = `Y[t]` 与 `Y[t]` 的相关性 =\
  \ 1\n- ACF(1)：滞后 1 阶的相关性 (`ρ[1]`) = `Y[t]` 与 `Y[t-1]` 之间的相关性\n- ACF(2)：滞后 2 阶的相关性\
  \ (`ρ[2]`) = `Y[t]` 与 `Y[t-2]` 之间的相关性\n- ACF(3)：滞后 3 阶的相关性 (`ρ[3]`) = `Y[t]` 与 `Y[t-3]`\
  \ 之间的相关性\n\n使用自相关值绘制的图形被称为自相关图。图 12-31 展示了一个此类图的例子。x 轴是滞后阶数值，y 轴是自相关值。该图形可能因序列的类型而异。\n\
  \n![A978-1-4842-0043-8_12_Fig31_HTML.jpg](img/A978-1-4842-0043-8_12_Fig31_HTML.jpg)\n\
  \n*图 12-31.* 一个自相关图的示例\n\n在 AR 模型中，序列的当前值依赖于其先前值。你可以预期自相关会在 AR 模型中描绘出某种模式。\n\n\n\
  \n##### 偏自相关函数\n\n偏自相关函数是 `Y` 与其不同滞后阶数的先前取值之间的偏相关系数。偏相关系数是剔除其他变量影响后的相关系数。你可以将偏相关理解为排除了其他自变量影响后的相关系数，也可以将其视为排他性相关。\n\
  \n我们来看一个例子。你可以预期，信用评分会依赖于现有贷款数量、收入、逾期还款、信用历史长度以及受抚养人数。试图找出贷款数量与信用评分之间的简单相关性，会得到这两个变量之间的关联，但这也将包含所有其他变量对信用评分的影响。要找出偏相关，你需要先消除其他影响变量的效应。在实际应用中，你可以将偏相关系数视为回归系数。\n\
  \n对于信用评分的例子，方程如下：\n\n`信用评分 = β[0] + β[1] (贷款数量) + β[2] (逾期还款) + β[3] (信用历史长度) +\
  \ β[4] (受抚养人数)`\n\n假设不存在多重共线性，贷款数量与信用评分之间的偏相关系数为 `β[1]`。`β[1]` 是变量“贷款数量”对信用评分的排他性影响。现在你可以理解，偏相关系数是两个变量之间的量化关联，这种关联无法通过它们与任何其他变量的共同关联来解释。\n\
  \n在时间序列分析的语境中，偏自相关是通过将 `Y` 的过去值对当前值进行回归得到的。PACF 用 `θ[h]` 表示，其中 `h` 代表滞后阶数。\n\n-\
  \   `PACF(0)`：`lag0`（`θ[0]`）处的偏相关 = `Y[t]` 和 `Y[t]` 自身 = 1\n-   `PACF(1)`：`lag1`（`θ[1]`）处的偏相关\
  \ = 当 `Y[t-1]` 对 `Y[t]` 进行回归时，`Y[t-1]` 的回归系数\n-   `PACF(2)`：`lag2`（`θ[2]`）处的偏相关\
  \ = 当 `Y[t-1]` 和 `Y[t-2]` 对 `Y[t]` 进行回归时，`Y[t-2]` 的回归系数\n-   `PACF(3)`：`lag3`（`θ[3]`）处的偏相关\
  \ = 当 `Y[t-1]`、`Y[t-2]` 和 `Y[t-3]` 对 `Y[t]` 进行回归时，`Y[t-3]` 的回归系数\n\n使用偏自相关值绘制的图形称为偏自相关图。图\
  \ 12-32 显示了这样一个图的示例。x 轴表示滞后值，y 轴表示偏自相关值。与 ACF 一样，PACF 图也可能因序列类型而异。\n\n![A978-1-4842-0043-8_12_Fig32_HTML.jpg](img/A978-1-4842-0043-8_12_Fig32_HTML.jpg)\n\
  \n图 12-32. 偏自相关图示例\n\n在 MA 模型中，序列当前的误差依赖于其之前的误差值。你可以预期，在 MA 模型中偏自相关会遵循某种模式。\n\n\
  ##### 在 SAS 中创建 ACF 和 PACF 图\n\n使用 ACF 和 PACF 图，你可以了解序列的类型。这是时间序列分析过程中的第二步。你首先必须确保时间序列是平稳的。你可能需要不时地对序列进行差分以使其平稳；平稳后的序列即可用于分析。一旦序列准备就绪，你需要对其类型进行分类。简要回顾一下，为了识别序列的类型，你需要研究为该序列生成的\
  \ ACF 和 PACF 图。\n\n接下来是在 SAS 中创建 ACF 和 PACF 图的代码：\n\n```\nproc arima data=ts15 plots=all;\n\
  identify var=Series_Values ;\nrun ;\n```\n\n你需要使用 `plots=all` 选项来生成 ACF 和 PACF 图。SAS\
  \ 输出会给出四个图：\n\n- 原始序列图\n- ACF 图\n- PACF 图\n- IACF 图\n\n注意：IACF 代表逆自相关。这将在后续章节讨论。\n\
  \n##### 识别 AR 过程的经验法则\n\nAR 过程的 ACF 呈现拖尾或衰减至零。一旦你看到 ACF 图显示出向零递减的趋势，你就可以稳妥地得出结论：该过程类型是\
  \ AR。图 12-33 展示了一些示例。\n\n![A978-1-4842-0043-8_12_Fig33a_HTML.jpg](img/A978-1-4842-0043-8_12_Fig33a_HTML.jpg)\n\
  ![A978-1-4842-0043-8_12_Fig33b_HTML.jpg](img/A978-1-4842-0043-8_12_Fig33b_HTML.jpg)\n\
  ![A978-1-4842-0043-8_12_Fig33c_HTML.jpg](img/A978-1-4842-0043-8_12_Fig33c_HTML.jpg)\n\
  ![A978-1-4842-0043-8_12_Fig33d_HTML.jpg](img/A978-1-4842-0043-8_12_Fig33d_HTML.jpg)\n\
  \n图 12-33. 显示向零递减趋势的 ACF 图示例\n\n如果你在序列中观察到任何此类行为，那么你的序列中肯定存在 AR 成分。这意味着序列的当前值依赖于该序列的某些过去值。这就是为什么\
  \ ACF 函数会显示出相关性向零衰减或缓慢衰减的原因之一。`Y[t]` 依赖于 `Y[t-1]`，而 `Y[t-1]` 依赖于 `Y[t-2]`；因此，`Y[t]`\
  \ 间接依赖于 `Y[t-2]`。所以，`lag2` 处的相关略低于 `lag1` 处的相关。`lag3` 处的相关略低于 `lag2` 处的相关。因此，AR\
  \ 过程的 ACF 显示出向零缓慢递减的这种行为。\n\n但这只是故事的第一部分。AR 过程的阶数呢？你如何识别一个序列是 `AR(1)`、`AR(2)` 还是\
  \ `AR(p)`？你如何找到 `P` 的值？一旦你从 ACF 图中确认该过程是 AR，就需要查看 PACF 以确定序列的阶数。对于 AR 过程，PACF 会截尾。在几个滞后之后，将不再有显著的偏自相关值。滞后期数即指示了序列的阶数。例如，如果\
  \ ACF 缓慢衰减至零，且 PACF 函数在 `lag1` 处截尾，那么该 AR 过程的阶数为 1。如果 ACF 缓慢衰减至零，且 PACF 函数在 `lag2`\
  \ 处截尾，那么该 AR 过程的阶数为 2。图 12-34 展示了 AR 过程的一些 PACF 图示例。\n\n![A978-1-4842-0043-8_12_Fig34a_HTML.jpg](img/A978-1-4842-0043-8_12_Fig34a_HTML.jpg)\n\
  ![A978-1-4842-0043-8_12_Fig34b_HTML.jpg](img/A978-1-4842-0043-8_12_Fig34b_HTML.jpg)\n\
  ![A978-1-4842-0043-8_12_Fig34c_HTML.jpg](img/A978-1-4842-0043-8_12_Fig34c_HTML.jpg)\n\
  ![A978-1-4842-0043-8_12_Fig34d_HTML.jpg](img/A978-1-4842-0043-8_12_Fig34d_HTML.jpg)\n\
  \n图 12-34. AR 过程的 PACF 图示例\n\n从左上角顺时针计数，在图 1 中，你看到 PACF 在 `lag1` 处截尾。因此，该 AR 过程的阶数为\
  \ 1。`lag0` 处的偏相关值始终为 1。在图 2（右上角）中，PACF 也在 `lag1` 处截尾。在图 3（左下角）中，PACF 在 `lag2` 处截尾，因此该\
  \ AR 过程的阶数为 2。在最后一个图（右下角）中，PACF 在 `lag3` 处截尾；因此，该 AR 过程的阶数为 3。灰色带表示显著性界限。任何超出该带界限的滞后都是显著的。最后一个图看起来似乎是在\
  \ `lag4` 处截尾，但第四个 PACF 值不够显著，因为它位于灰色带的界限之内。\n\n\n\n以下是 AR 过程 PACF 图中截断点的理由。假设有一个\
  \ 1 阶 AR 过程；`Y[t-1]`对`Y[t]`有最大影响。如果你从`Y[t-1]`和`Y[t]`中移除先前的影响并计算相关性，那么你只会得到`lag1`的高相关性，而对于\
  \ AR(1) 过程，其余滞后项的影响可以忽略不计。类似地，对于一个 AR(2) 过程，`Y[t-1]`和`Y[t-2]`对`Y[t]`有最大影响。如果你从`Y[t-1]`、`Y[t-2]`和`Y[t]`中移除所有先前的影响，那么只有`lag1`和`lag2`的相关性会很高。对于\
  \ AR(2) 过程，超过`lag 2`的其余所有相关性都可以忽略不计。请参考表 12-10 的总结。\n\n表 12-10. 识别 AR(P) 过程的经验法则\n\
  \n| AR 过程 | 行为 |\n| --- | --- |\n| ACF | 缓慢衰减或逐渐消失至零。要么沿一个方向减小，要么以正弦波的形式减小。 |\n\
  | PACF | 截断。截断的滞后阶数表示 AR 过程的阶数。 |\n\n在图 12-16 到图 12-30 的模拟时间序列列表中，前六个图属于 AR 序列。让我们看看它们的\
  \ ACF 和 PACF 图（图 12-35 到图 12-40）。再次提醒，对于实际业务场景中的任何新序列，序列方程通常是未知的。这只是一个获取序列方程的练习。\n\
