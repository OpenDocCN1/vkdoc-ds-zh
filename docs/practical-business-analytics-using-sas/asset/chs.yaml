  - R 平方 = 0.7608，这可以通过 R 平方的实际公式来验证。\n\nR 平方值表明模型的准确率仅为 76.08%；换句话说，基于输入值 `x`（访客数）对\
  \ `y`（售出的汉堡数）的预测，其准确率仅为 76.08%。这足够好吗？也许不够，因为分析师通常寻找大于或等于 80% 的 R 平方值。\n\n## 回归假设\n\
  \n在汉堡示例中，您假设售出的汉堡数量与店内访客数量之间存在线性关系。但在实际应用中，情况可能并非如此。如果关系在真正意义上不是线性的，则不应尝试使用线性回归模型。还有其他可用的非线性技术来完成这项工作。以下是\
  \ R 平方值有效的一些假设。在某些情况下，本文还提供了测试这些假设的技术。\n\n### 线性假设\n\nR 平方值的计算基于一个假设，即自变量（`x`）和因变量（`y`）之间的关系是线性的。\n\
  \n考虑图 9-26 所示的图形。它或多或少地代表了 `y = e^x` 的关系。如果假设这里的拟合是一条直线，它将永远无法穿过大多数数据点。在这种情况下，R\
  \ 平方没有意义。\n\n![A978-1-4842-0043-8_9_Fig26_HTML.jpg](img/A978-1-4842-0043-8_9_Fig26_HTML.jpg)\n\
  \n**图 9-26.** `y` 和 `x` 之间的指数关系。在这里 R 平方没有意义。\n\n#### 线性关系的检测与违反线性假设的修正\n\n检测线性关系相当简单。在大多数情况下，从散点图中可以清晰地看出线性关系。因此，要找到线性拟合，您可以使用像\
  \ SAS 这样的分析软件为 `x` 和 `y` 绘制散点图。如果 `x` 和 `y` 之间的关系不是线性的，可以尝试进行变换，例如 `x` 的平方、`log(x)`、`e^x`、`sqrt(x)`\
  \ 等。数据的变换可以在任何标准统计学书籍中找到。\n\n我们之前讨论过如何在相关性分析中创建散点图。以下是在 SAS 中创建散点图的代码。以下代码是电信数据中客户满意度与服务得分的示例散点图。\n\
  \n```\n/* CSAT 与服务得分之间的散点图 */\nproc gplot data=telecom;\nplot C_sat*service;\nrun;\n\
  ```\n\n### 正态性\n\nR 平方的计算基于一个假设，即对于自变量 `x` 的每个值，因变量 `y` 都呈正态分布。\n\n理解这个假设的一个简单方法是看它的反面。换句话说，如果对于\
  \ `x` 的每个点，`y` 不是正态分布会怎样？如果对于 `x` 的某些观测值，`y` 是常数，而对于其余数据点，`y` 呈正态分布会怎样？这种情况下的图形可能类似于图\
  \ 9-27。\n\n![A978-1-4842-0043-8_9_Fig27_HTML.jpg](img/A978-1-4842-0043-8_9_Fig27_HTML.jpg)\n\
  \n**图 9-27.** `y` 对 `x` 的散点图，显示了两种趋势。\n\n图 9-27 中的图表显示，当 `x` 接近 10 的倍数时，`y` 的表现不同（假设所有其他值都表现正常）。您可以清楚地看到数据中的两种趋势。你不可能拟合出一条能穿过大多数数据点的直线。假设您拟合了一条线性回归线，那么误差（实际值与预测值之间的偏差）应该遵循均值为零的正态分布。正态性是计算回归系数时的一个基本假设。通常，异常值是违反此假设的主要原因。\n\
  \n图 9-28 中的图表显示了一些异常值；在此数据上拟合的模型将产生非正态的误差。如果尝试在此数据上拟合回归线，结果将是无效的。\n\n![A978-1-4842-0043-8_9_Fig28_HTML.jpg](img/A978-1-4842-0043-8_9_Fig28_HTML.jpg)\n\
  \n**图 9-28.** 带有异常值的 `y` 对 `x` 的散点图。\n\n\n\n#### 检测正态性关系并修正非正态性\n\n异常值检测及其处理已在第\
  \ 7 章的数据探索中讨论过。你需要遵循相同的流程来处理此处的异常值。缺失值和默认值是导致违反正态性假设的主要原因。\n\n正态性也可以通过两种图形来检测。\n\
  \n标准化残差的直方图应类似于均值为零的标准正态分布。\n\n图 9-29 中的图形显示残差大致遵循正态分布，而图 9-30 和图 9-31 中的图形是残差不遵循正态分布的示例。\n\
  \n![A978-1-4842-0043-8_9_Fig33_HTML.jpg](img/A978-1-4842-0043-8_9_Fig33_HTML.jpg)\n\
  \n图 9-33. 残差概率分布不遵循正态分布\n\n![A978-1-4842-0043-8_9_Fig32_HTML.jpg](img/A978-1-4842-0043-8_9_Fig32_HTML.jpg)\n\
  \n图 9-32. 接近正态的残差概率分布\n\n正态概率与残差概率分布图也称为`P-P`图。该图试图绘制一个完美的正态概率分布（`P`），并将其与残差概率分布（`P`）进行比较。正态概率与残差分布图（`P-P`图）包含两个部分：一条直线和多个点。如果分布是正态的，则`P-P`图中的所有点都应落在一对角线附近，表明残差概率分布（图中的点）与标准正态概率分布（线）几乎相同。如果该图看起来像字母`D`或其镜像，则表明存在异常值，或误差在均值的一侧过于集中。图\
  \ 9-32 和 9-33 给出了两种图形形状：一种可接受，另一种则指示异常值。\n\n![A978-1-4842-0043-8_9_Fig31_HTML.jpg](img/A978-1-4842-0043-8_9_Fig31_HTML.jpg)\n\
  \n图 9-31. 残差不遵循正态分布的另一个示例\n\n![A978-1-4842-0043-8_9_Fig30_HTML.jpg](img/A978-1-4842-0043-8_9_Fig30_HTML.jpg)\n\
  \n图 9-30. 残差不遵循正态分布\n\n![A978-1-4842-0043-8_9_Fig29_HTML.jpg](img/A978-1-4842-0043-8_9_Fig29_HTML.jpg)\n\
  \n图 9-29. 残差遵循正态分布\n\n要修正这种正态性违背，你需要应用异常值处理或对变量进行变换。异常值处理和缺失值处理在数据探索章节中已讨论。\n\n\
  ### 独立性假设：观测值是独立的\n\n`y`的独立性是尝试拟合线性回归时最常见的假设之一。你可以预期`y`的值依赖于自变量，但不依赖于其自身之前的值。例如，在分析一年的销售数据时，如果当前月份的销售额依赖于前一个月的销售额，那么`R-squared`就没有任何意义。\n\
  \n我们试图用`x`来预测`y`。如果`y`依赖于其自身的先前值，那么我们构建的模型就不稳健。变量`x`将永远无法解释`y`变量的自相关性。\n\n#### 检测和修正独立性违背\n\
  \n该假设的违背主要发生在时间序列数据中。自相关函数（`ACF`）图可以清晰地显示依赖关系。`ACF`图在时间序列分析章节中有说明。如果存在季节性依赖，则可能会得到季节性指数，并且可以相应地对数据进行调整。如果数据显示出明显的趋势，则可以使用某些平滑技术来修正或调整数据。在这种情况下，甚至可以考虑使用各种数学函数进行变量变换。\n\
  \n### 同方差性假设：在每个`X`值处`Y`的方差相同\n\n我们还假设`y`的方差在`x`的每个阶段是相同的，并且在`X`中没有特殊的区间使得`Y`的离散度不同。观察图\
  \ 9-34 中的图形，该图显示了在`x`的某些点上`y`的不同方差模式。在`x`的不同区间内具有不同方差称为异方差性。它与同方差性相反，同方差性意味着因变量在自变量的所有点上具有相同的方差。\n\
  \n![A978-1-4842-0043-8_9_Fig34_HTML.jpg](img/A978-1-4842-0043-8_9_Fig34_HTML.jpg)\n\
  \n图 9-34. 注意`y`在不同`x`区间内的不同方差模式\n\n在此图中，当`x`小于 40 时，`y`的方差似乎略小。在`x`介于 40 到 80 之间时，您会看到一个略有不同的方差模式。同样，在`x`超过\
  \ 80 之后，模式又不同了。在这种情况下，很难拟合一条回归线并期望它穿过数据的大多数点。如图 9-35 中的图形所示，直线拟合不能被视为整个数据集的最佳拟合。\n\
  \n![A978-1-4842-0043-8_9_Fig35_HTML.jpg](img/A978-1-4842-0043-8_9_Fig35_HTML.jpg)\n\
  \n图 9-35. 尝试在`y`和`x`之间拟合一条直线失败\n\n#### 检测同方差性违背并修正\n\n同样，`x`与`y`之间的散点图可以让你对同方差性有一个初步了解。一个更巧妙的方法是绘制残差与预测值（而非实际值）的图形。这可以让你了解`y`是增大还是减小、残差变异是增大还是减小，或者它是否在预测线周围随机分布。\n\
  \n图 9-36 和 9-37 中的图形展示了同方差性和异方差性的一些示例。\n\n![A978-1-4842-0043-8_9_Fig36_HTML.jpg](img/A978-1-4842-0043-8_9_Fig36_HTML.jpg)\n\
  \n图 9-36. 显示同方差性的图形\n\n残差或误差是实际值与预测值之间的差值。\n\n![A978-1-4842-0043-8_9_Fig37_HTML.jpg](img/A978-1-4842-0043-8_9_Fig37_HTML.jpg)\n\
  \n图 9-37. 显示异方差性的图形\n\n处理此问题的简单方法是对数据进行分段，并为不同区间构建不同的回归线。一般来说，如果前三个假设得到满足，那么异方差性可能根本不存在。作为经验法则，在尝试修正异方差性之前，需要先解决前三个假设的问题。\n\
  \n\n\n## 线性回归不适用的情况\n\n在前几节中，我们讨论了回归分析的四个主要假设。如果其中任何一个假设不成立，则不应应用线性回归建模。\n\n总结一下，这四个假设如下：\n\
  \n-   当 X 与 Y 之间的关系是非线性时，线性回归模型就不适用。其估计值将毫无意义。\n-   当误差不服从正态分布时，回归系数及其标准差可能不正确。如果误差分布是偏态的，系数估计背后的基本理论将不成立。在这种情况下，线性回归模型的作用不大。\n\
  -   当因变量的值之间存在依赖关系时，你在构建回归模型时就总是忽略了一个趋势。你试图捕捉的是 X 与 Y 之间的趋势。但如果 Y 与 Y 之间的关系仍未得到解释（Y\
  \ 可能依赖于其先前的值），你就无法拟合一条回归线。\n-   当 Y 的方差模式在整个 X 范围内不一致时，单一的整合线永远无法解释 Y 在 X 不同区间内的行为。在这种情况下，应用线性回归同样不是一个好主意。\n\
  \n## 简单回归：示例\n\n在回归主题的开头，我们讨论过手机销售数据。我们将使用回归技术来回答诸如：\n\n-   当价格上涨或下跌时，手机销量会发生什么变化？\n\
  -   在给定的价格水平下，某款手机型号的预计销量是多少？\n\n以下是通过价格预测销量的代码。\n\n```sas\nproc reg data= mobiles;\n\
  model sales=price;\nrun;\n```\n\n表 9-18 展示了此代码的结果。\n\n**表 9-18.** 手机数据集的 PROC REG\
