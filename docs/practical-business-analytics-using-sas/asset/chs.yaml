  \ | --- | --- | --- | --- | --- | --- | --- |\n\n因此，当缺失值过多时，应删除原始变量，并用指示变量替换。\n\n\
  \n\n##### 缺失值与异常值处理\n\n前面的主题讲解了如何探索和验证变量。在验证数据时，发现了一些缺失值和异常值的问题。图 7-9 中的图表展示了针对不同缺失值百分比的连续变量和离散变量，所对应的缺失值与异常值处理方法。你可以先从缺失值处理开始，然后再进行异常值处理。如果一个变量同时存在缺失值和异常值，也应遵循同样的顺序。\n\
  \n![A978-1-4842-0043-8_7_Fig9_HTML.jpg](img/A978-1-4842-0043-8_7_Fig9_HTML.jpg)\n\
  \n图 7-9. 如何处理缺失值与异常值\n\n此图表可用于数据清洗。变量分为两类：离散变量和连续变量。每个变量的缺失百分比可能不同。\n\n从实践角度来说，离散变量和连续变量中缺失值的可能百分比如下：\n\
  \n*   缺失值或异常值少于 10%的离散变量\n*   缺失值或异常值在 10%至 50%之间的离散变量\n*   缺失值或异常值超过 50%的离散变量\n\
  *   缺失值或异常值少于 10%的连续变量\n*   缺失值或异常值在 10%至 50%之间的连续变量\n*   缺失值或异常值超过 50%的连续变量\n\n\
  针对每种情况的处理方法如下。\n\n**对于缺失值或异常值少于 10%的离散变量：**\n\n表 7-38. 客户持有的储蓄账户数量\n\n| 账户数量 | 客户数量\
  \ |\n| --- | --- |\n| 0 | 2,505 |\n| 1 | 351,234 |\n| 2 | 339,778 |\n| 3 | 139,918\
  \ |\n| 4 | 124,044 |\n| 5 | 94,003 |\n| 6 | 74,325 |\n| 7 | 64,469 |\n| 8 | 1,456\
  \ |\n| `#N/A` | 34,530 |\n| 总计 | 1,226,262 |\n\n*   最好基于相关变量进行插补。由于离散变量有多个层级，独立的插补可能效果不佳。\n\
  *   以表 7-38 中“客户持有的储蓄账户数量”这一变量为例。\n\n在客户总数中，有 34,530 名客户的数据缺失。他们持有的账户数量未知。这约占总数据的\
  \ 2.8%。对数据进行的独立插补得出总体平均账户数为 2.7。可以简单地推断这 34,530 名客户每人持有三个账户，或者可以利用其他相关变量进行推断。\n\n\
  要选择最佳的相关变量进行插补，需要具备良好的业务洞察力。本例考虑另一个名为“信用卡持有者标识”的变量。该变量只取两个值：“是”或“否”。假设你试图使用这个标识来进行插补。这如何实现？为此，你需要更多信息。\n\
  \n在 1,226,262 名客户中，一些人有信用卡，一些人没有。表 7-39 仍然显示了持有 1、2、3、4 和 8 个储蓄账户的客户频数。在拥有一个储蓄账户的\
  \ 351,234 名客户中，有多少人有信用卡？多少人没有任何信用卡？有 339,778 名客户拥有两个储蓄账户，那么其中有多少人有信用卡？多少人没有卡？这些问题将通过一个简单的账户数量与信用卡标识的交叉关联表来解答。\n\
  \n表 7-39. 拥有储蓄账户和信用卡的客户频数（数据填写于表 7-40）\n\n|   | 信用卡持有者 | 客户数量 |\n| --- | --- | ---\
  \ |\n| 账户数量 | 是 | 否 |   |\n| 0 |   |   | 2,505 |\n| 1 |   |   | 351,234 |\n| 2 |\
  \   |   | 339,778 |\n| 3 |   |   | 139,918 |\n| 4 |   |   | 124,044 |\n| 5 |   |\
  \   | 94,003 |\n| 6 |   |   | 74,325 |\n| 7 |   |   | 64,469 |\n| 8 |   |   | 1,456\
  \ |\n| `N/A` |   |   | 34,530 |\n|   |   |   | 1,226,262 |\n\n表 7-40 中显示的储蓄账户数量与信用卡标识的交叉关联表，将决定`N/A`的正确替代值是什么。\n\
