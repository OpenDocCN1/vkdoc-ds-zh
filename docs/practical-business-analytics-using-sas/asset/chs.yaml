- "# 4. 重要的 SAS 函数和过程\n\n在上一章中，你学习了一些重要的数据操作技术。你通常会获取原始数据并为其分析做好准备。一旦最终数据准备就绪，你就可以继续进行分析。分析可能涉及以有意义的图形表示简单的汇总表，将简单的描述性统计应用于高级分析和预测建模。你可能需要高级算法和函数来执行分析。在学习分析工具时，了解如何使用一些重要的函数和算法至关重要。\n\
  \n在本章中，你将学习基本函数和重要的 SAS 过程。本章将讨论数值、字符和日期函数，以及一些重要的 SAS 过程，例如 `CONTENTS` 和 `SORT`。最后，你将学习一些图形函数，例如\
  \ `GCHART` 和 `GPLOT`。\n\n## SAS 函数\n\nSAS 为大多数数值、字符串和日期操作预置了例程。这些被称为函数。在 SAS 中使用函数与其他编程语言没有太大区别。事实上，它更简单。你需要编写函数名称并传递一些必需和可选参数。通常，每个函数都会带有括号。如果某个函数不需要参数，那么括号内将为空，如\
  \ `today()`。\n\n让我们从一个活动开始，准备一些数据供后续使用。让我们导入 `Market_data_two` 数据集，该数据集将在多个示例中使用。该数据集包含典型营销活动中使用的各种资产类型。名为\
  \ `White_Paper`、`Webinar`、`Software_Download`、`Free_Offer`、`Live_Event` 和 `Case_Study`\
  \ 的变量代表用于营销活动的不同资产类型。\n\n以下 SAS 代码导入并打印数据的一个快照：\n\n```\nPROC IMPORT\nOUT= WORK.market_asset\n\
  DATAFILE= \"C:\\Users\\ Documents\\Training\\Books\\Content\\4\\. SAS Programs and\
  \ Analytics\\Datasets\\Market_data_two.csv\"\nDBMS=CSV REPLACE;\nGETNAMES=YES;\n\
  DATAROW= 2;\nRUN;\n\nproc print\ndata=market_asset(obs= 10) noobs;\nrun;\n```\n\n\
  表 4-1 列出了此代码的结果。\n\n**表 4-1.** 市场资产数据快照\n\n| `id` | `name` | `num_assets` | `White_Paper`\
  \ | `Webinar` | `Software_Download` | `Free_Offer` | `Live_Event` | `Case_Study`\
  \ |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | Citrix WP_Q1_13\
  \ CPG | 8 | 3 | 2 | 0 | 3 | 0 | 0 |\n| 2 | Evergreen WP27 CPG | 0 | 0 | 0 | 0 |\
  \ 0 | 0 | 0 |\n| 3 | Stratus WP CPG | 3 | 0 | 0 | 0 | 0 | 0 | 0 |\n| 4 | Oco WP_PAN\
  \ CPG | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| 5 | DTI wp CPG | 0 | 0 | 0 | 0 | 0 | 0 |\
  \ 0 |\n| 6 | APSFC yourlessthan$2,Unlimiteddomains CPG | 0 | 0 | 0 | 0 | 0 | 0 |\
  \ 0 |\n| 7 | Hubspot WP CPG | 10 | 9 | 1 | 0 | 0 | 0 | 0 |\n| 8 | Info WP CPG |\
  \ 5 | 3 | 1 | 0 | 0 | 0 | 1 |\n| 9 | Cognos WP CPG | 3 | 3 | 0 | 0 | 0 | 0 | 0 |\n\
  | 10 | HP WP CPG | 2 | 2 | 0 | 0 | 0 | 0 | 0 |\n\n现在数据集已准备就绪，你将学习如何使用函数。\n\n###\
  \ 数值函数\n\n数值函数对数值变量执行算术运算。以下部分提供了一些示例。\n\n\n\n#### 数值函数示例：均值\n\n在本示例中，数值型 SAS 函数返回给定数量数值变量或一组数字的算术平均值。我们这里讨论的均值是*行级*的，而非某个特定列的均值。如果\
  \ `num_assets` 是字段名，那么 SAS 中（对 `num_assets` 计算的）均值与该行中的数值结果相同，因为它是行级均值。平均值或平均数通常针对多个变量计算，并在每一行中显示。\n\
  \n均值函数的语法如下：\n\n`MEAN (Var1, Var2, Var3...)`\n\n在第一个示例中，你将确定每个营销活动中 `White_Paper`\
  \ 和 `Case_Study` 这两个变量的平均值。以下代码用于计算平均值。此处你将使用在上一节中创建的数据集 `market_asset`。\n\n```\n\
  Data market_asset_v1;\nset market_asset;\nmean_val=Mean(White_Paper, Case_Study);\n\
