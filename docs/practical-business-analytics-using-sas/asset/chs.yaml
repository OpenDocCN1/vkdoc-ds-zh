  \ 02/26/2010 | 1208071592 | 2865 |\n\n## 使用 SAS 绘制图形\n\n在本节中，您将使用 SAS 绘制数据。SAS 可以生成日常业务中使用的大多数图形。您将使用\
  \ `GPLOT` 和 `GCHART` 过程来绘制图形。\n\n### PROC gplot 和 Gchart\n\n使用 `gplot` 和 `Gchart`\
  \ 过程，您可以绘制单变量和双变量图。例如，您想绘制一个展示预算与触达量之间关系的图形。随着市场活动预算的增加，触达量会发生什么变化？它会无条件增加吗？您可以通过观察预算与触达量之间的散点图来推断这些信息。\n\
  \n绘制散点图的通用代码如下：\n\n```\nproc gplot data= <data set>;\nplot y*x;\nrun ;\n```\n\n\
  表 4-21 解释了这段代码。\n\n**表 4-21. proc gplot 通用代码的代码说明**\n\n| 代码 | 说明 |\n| --- | ---\
  \ |\n| `proc gplot` | 调用 gplot 过程 |\n| `data=<data set>;` | 数据集名称 |\n| `plot y*x;`\
  \ | Y 与 X 之间的散点图 |\n\n以下是绘制预算与触达量之间散点图的代码：\n\n```\nsymbol i=none;\nproc gplot data=\
  \ market_asset;\nplot reach*budget;\nrun ;\n```\n\n图 4-1 显示了这段代码的结果。\n\n![A978-1-4842-0043-8_4_Fig1_HTML.jpg](img/A978-1-4842-0043-8_4_Fig1_HTML.jpg)\n\
  \n**图 4-1.** 触达量与预算的散点图（market_asset 数据集）\n\n从图 4-1 中无法得出明确的结论。预算中有几个极高的值。让我们为子集绘制一个散点图。\n\
  \n```\nproc gplot data= market_asset;\nplot reach*budget;\nwhere budget < 100000\
  \ ;\nrun ;\n```\n\n图 4-2 显示了这段代码的结果。\n\n![A978-1-4842-0043-8_4_Fig2_HTML.jpg](img/A978-1-4842-0043-8_4_Fig2_HTML.jpg)\n\
  \n**图 4-2.** 触达量与预算的散点图（market_asset 数据集，budget< 100000）\n\n这里也看不到任何明确的证据。它没有说明任何问题：如果预算增加，触达量会发生什么变化？\n\
  \n让我们尝试一个更小的预算子集。\n\n```\nproc gplot data= market_asset;\nplot reach*budget;\nwhere\
  \ budget < 1000 ;\nrun ;\n```\n\n图 4-3 显示了这段代码的结果。\n\n![A978-1-4842-0043-8_4_Fig3_HTML.jpg](img/A978-1-4842-0043-8_4_Fig3_HTML.jpg)\n\
  \n**图 4-3.** 触达量与预算的散点图（market_asset 数据集，budget< 1000）\n\n同样，触达量与预算之间没有明显的趋势。因此，您可能会得出结论：就本输入数据而言，预算和触达量并不相互依赖。\n\
  \n\n\n### 使用 SAS 绘制条形图和饼图\n\n你也可以使用 SAS 绘制条形图。为此，你需要使用`proc Gchart`。为了说明这一点，我们将再次使用相同的市场活动示例。这次你想要查看每个类别中的市场活动数量。代码如下：\n\
  \n```\nproc gchart data= market_asset;\nvbar category;\nRun ;\n```\n\n图 4-4 展示了这段代码的输出结果。\n\
  \n![A978-1-4842-0043-8_4_Fig4_HTML.jpg](img/A978-1-4842-0043-8_4_Fig4_HTML.jpg)\n\
  \n图 4-4.\n按类别统计的市场活动数量：使用 `proc gchart` 绘制的条形图\n\n类似地，你也可以使用以下代码基于相同的数据创建饼图：\n\n\
  ```\nproc gchart data= market_asset;\npie category ;\nRun ;\n```\n\n图 4-5 展示了这段代码的输出结果。\n\
  \n![A978-1-4842-0043-8_4_Fig5_HTML.jpg](img/A978-1-4842-0043-8_4_Fig5_HTML.jpg)\n\
  \n图 4-5.\n按类别统计的市场活动数量：使用 `proc gchart` 绘制的饼图\n\n你可以使用以下代码绘制相同的条形图和饼图的三维（3D）版本。请参见图\
  \ 4-6 和图 4-7。\n\n```\n/* 3D 条形图 */\nproc gchart data= market_asset;\nvbar3d category\
  \ ;\nRun ;\n\n/* 3D 饼图 */\nproc gchart data= market_asset;\npie3d category ;\nRun\
  \ ;\n```\n\n![A978-1-4842-0043-8_4_Fig7_HTML.jpg](img/A978-1-4842-0043-8_4_Fig7_HTML.jpg)\n\
  \n图 4-7.\n按类别统计的市场活动数量：使用 `proc gchart` 绘制的 3D 饼图\n\n![A978-1-4842-0043-8_4_Fig6_HTML.jpg](img/A978-1-4842-0043-8_4_Fig6_HTML.jpg)\n\
  \n图 4-6.\n按类别统计的市场活动数量：使用 `proc gchart` 绘制的 3D 条形图\n\n### PROC SQL\n\n对于具有数据库和 SQL\
  \ 背景的用户来说，`PROC SQL` 过程是一个福音。SAS 拥有一个 SQL 引擎，你可以通过使用 `PROC SQL` 来启用它。一旦在代码中使用了 `PROC\
  \ SQL` 语句，你就可以编写标准 SQL 命令来处理数据。最后，你需要使用 `QUIT` 语句来停止 SQL 引擎。下面是通用的代码模板：\n\n```\n\
  proc sql;\n<SQL Statements> ;\nQuit;\n```\n\n请注意，在 `proc sql` 中，你使用的是 `QUIT` 而不是通常的\
  \ `RUN` 语句。这只是为了停止 SQL 语句的执行。如果你不使用 `QUIT`，那么 SQL 引擎将持续运行，直到你显式地终止它。\n\n#### PROC\
  \ SQL 示例 1\n\n我们将再次使用你已经熟悉的市场活动数据。这次市场活动分析的管理员只想查看属于商业和金融类别的活动。首先，你在 SAS 中编写一些 SQL\
  \ 代码来获取所需的数据子集，并将其放入一个新的数据集中。这段代码非常简单明了。\n\n```\nproc sql ;\ncreate buss_fin /*\
  \ 这是新数据集 */\nas select *\nfrom  market_asset\nwhere Category= 'Business/Finance';\n\
  Quit ;\n```\n\n以下是上述代码的日志文件信息：\n\n```\n87   proc sql;\n88   create table buss_fin\n\
  89   as select *\n90   from  market_asset\n91   where Category= 'Business/Finance';\n\
  NOTE: Table WORK.BUSS_FIN created, with 713 rows and 7 columns.\n92   Quit;\nNOTE:\
  \ PROCEDURE SQL used (Total process time):\nreal time           0.01 seconds\ncpu\
  \ time            0.01 seconds\n```\n\n新数据集中有 713 行。我们打印前十个观测值，以便对数据有一个直观的感受。\n\n\
  ```\nproc print data=buss_fin(obs=10);\nrun;\n```\n\n表 4-22 列出了这段代码的输出结果。\n\n表 4-22.\n\
  `buss_fin` 数据集快照\n\n| Obs | Camp_ID | Name | start_date | end_date | Category |\
