  \n\n### 相关系数 (`r`) 的性质与局限性\n\n相关系数存在一些局限性。以下是相关系数的一些有趣的性质和局限性。\n\n- 相关系数介于 -1 和\
  \ +1 之间；`-1 ≤ r ≤ +1`。\n  - 当变量 `x` 和 `y` 之间存在完全正相关关系时，相关系数的最大值为 1；类似地，当存在完全负相关关系时，最小值为\
  \ -1。\n- 相关系数没有单位。\n  - 相关系数是一个系数，一个没有单位的数字。它的方差除以方差，单位相互抵消了。所以说相关系数是 0.75 米或 0.23\
  \ 公斤是错误的。\n- `r = 0` 表示不存在线性关联。\n  - 如果相关系数为零，则表示所研究的两个变量之间不存在线性关联。但它并不说明是否存在任何非线性关联。可能存在也可能不存在非线性关联。\n\
  - 相关系数不受原点和尺度变化的影响。\n  - 相关系数纯粹基于方差。它是分子上的协方差与分母上方差乘积的比值。方差不依赖于原点的变化。尺度的变化也不会影响相关系数。假设你将其中一个变量乘以\
  \ 10（尺度变化），相关系数将保持不变。因为相关系数是两个方差的比值，尺度的变化最终会相互抵消。\n- 如果两个变量是独立的，那么相关系数为零，但反之则不一定成立。如果相关系数为零，并不一定意味着两个变量是独立的。它们之间可能存在多项式（非线性）依赖关系。\n\
  \n### 相关系数局限性的一些示例\n\n在上节了解了相关系数的有趣特性之后，了解一下它的一些局限性也会有帮助。\n\n`r` 是线性关联的度量：虽然 `r`\
  \ 衡量两个变量近似于一条直线的程度，但它并不能真正衡量非线性关系的强度。\n\n例如，表 9-4 列出了两个变量 `x` 和 `y` 的表格。\n\n**表\
  \ 9-4.** `x` 和 `y` 的表格\n\n| `x` | `y` |\n| --- | --- |\n| -31 | 900 |\n| -25 | 625\
  \ |\n| -24 | 576 |\n| -19 | 361 |\n| -13 | 169 |\n| -6 | 36 |\n| -1 | 1 |\n| 3 |\
  \ 9 |\n| 10 | 100 |\n| 11 | 121 |\n| 14 | 196 |\n| 15 | 225 |\n| 24 | 576 |\n| 24\
  \ | 576 |\n| 29 | 841 |\n\n本例的相关系数为 -0.12，可以忽略不计。但简单浏览表格就会发现，`x` 和 `y` 通过方程 `y =\
  \ x²`（一个非线性方程）直接相关。\n\n图 9-5 至 9-9 展示了一些表示两个变量之间非线性关系的示例图。在所有这些情况下，仅测量相关系数并不足以预测关联的存在。\n\
