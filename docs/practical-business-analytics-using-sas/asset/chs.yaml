  \ 的案例中缺失。\n-   30 至 59 DPD、60 至 89 DPD 和 90 DPD 存在 96 和 98 的问题。\n-   家属人数缺失约 2%\
  \ 的值。\n\n\n\n## 数据准备中的缺失值与异常值处理\n\n完成内容填充、打印、单变量分析和频数统计等步骤后，数据探索和验证工作可能就接近尾声了。对部分变量执行这些操作时，前文提到的四个问题便浮现出来。其他变量也可能存在类似问题。请记录这些问题，并进入数据清洗的下一个步骤。这也被称为为分析准备数据。存在异常值固然是个问题，但简单地删除它们并非解决之道。\n\
  \n数据探索和验证之后，以下问题仍未得到解答：\n\n-   某些变量存在缺失值/异常值，但这些记录不能删除。\n-   某些变量缺失值/异常值的比例很高。能否删除这些变量？\n\
  -   某些变量缺失值/异常值的比例可以忽略不计。当缺失值比例为 2%、40%和 95%时，应分别如何处理？\n-   能否用其他值来替代缺失值？\n-   有些变量是离散型的，有些是连续型的。对于离散变量和连续变量，处理方法（删除或替代）是否相同？如果一个连续变量有\
  \ 20%的缺失值，而一个仅有四个级别的离散变量也有 20%的缺失值，它们能否采用相同的处理方法？带着这些问题，你现在可以进入数据准备过程的下一步。\n\n###\
  \ 第五步：缺失值与异常值处理\n\n前文已明确，因缺失值而删除记录并非良策。相反，可以采用一种称为“插补”的技术。该技术涉及用最佳可能的替代值来替换缺失/错误的值，以最大程度减少损失，同时获得准确结果。插补有不同类型；我们将讨论两种：独立插补和基于相关变量的插补。\n\
  \n#### 独立插补\n\n缺失值需要用均值或中位数来替换，具体取决于其余的值以及哪种选择更符合商业直觉。独立插补方便且易于实施。其假设是缺失值与现有值之间没有显著差异。\n\
  \n表 7-32 中的数据显示了 21 名运动员的年龄；其中一名运动员的年龄缺失。因为仅缺失一个值，所以用其余值的平均年龄 27 来替换该缺失值。（一般来说，运动员的年龄不会超过\
  \ 50 或 60 岁。）\n\n**表 7-32. 运动员年龄数据**\n\n| 年龄 | 30 | 25 | 29 | 29 | 26 | 26 | 25\
  \ | 30 | 27 | 27 | .... | 30 | 28 | 29 | 26 | 25 | 28 | 26 | 26 | 25 | 30 | 27 |\n\
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\
  \ --- | --- | --- | --- | --- | --- | --- | --- | --- |\n\n经过独立插补（使用其余年龄值的均值替换缺失值）后，新数据将如表\
  \ 7-33 所示。\n\n**表 7-33. 独立插补后的运动员年龄数据**\n\n| 年龄 | 30 | 25 | 29 | 29 | 26 | 26 |\
  \ 25 | 30 | 27 | 27 | 27 | 30 | 28 | 29 | 26 | 25 | 28 | 26 | 26 | 25 | 30 | 27\
  \ |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n\n如果只有少量数据缺失或属于异常值类别，独立插补是一种不错的方法。\n\
  \n#### 基于相关变量的插补\n\n在某些情况下，可以利用变量之间的关系进行插补。考虑表 7-34 中给出的数据，其中两列分别显示了运动员的比赛场次和年龄。\n\
  \n**表 7-34. 运动员年龄与出场次数对比**\n\n| 年龄 | 出场次数 |\n| --- | --- |\n| 25 | 201 |\n| 32 |\
  \ 265 |\n| 25 | 206 |\n| 19 | 154 |\n| 23 | 193 |\n| 31 | 257 |\n|   | 178 |\n|\
  \ 37 | 301 |\n| 33 | 268 |\n| 28 | 229 |\n| 24 | 194 |\n| 31 | 251 |\n| 30 | 247\
  \ |\n| 36 | 295 |\n| 38 | 312 |\n| 26 | 213 |\n| 40 | 330 |\n| 26 | 209 |\n| 40\
