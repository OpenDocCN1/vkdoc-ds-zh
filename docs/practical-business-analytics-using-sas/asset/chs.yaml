  \n\n\n##### 处理多重共线性\n\n再次强调，多重共线性仅受自变量列表影响的问题，与自变量和因变量之间的关系无关。无论你构建的是线性回归还是逻辑回归，多重共线性的处理方法都相同。\n\
  \n以下是使用 VIF 选项检测多重共线性的代码：\n\n```\nproc logistic data=loans_data;\nmodel SeriousDlqin2yrs\
  \ = utilization Age Num_loans Num_dependents MonthlyIncome Num_Savings_Acccts DebtRatio/vif;\n\
  run;\n```\n\n请记住，`PROC LOGISTIC` 没有 `VIF` 选项。如果使用了 `VIF` 选项，该过程代码会抛出错误，如下所示：\n\n\
  ```\nNOTE: The SAS System stopped processing this step because of errors.\n704 \
  \ proc logistic data=loans_data;\n705  model SeriousDlqin2yrs = utilization Age\
  \ Num_loans Num_dependents MonthlyIncome\n705! Num_Savings_Acccts DebtRatio/vif;\n\
  ---\n22\n202\nERROR 22-322: Syntax error, expecting one of the following: ;, ABSFCONV,\
  \ AGGREGATE, ALPHA,\nBACKWARD, BEST, BINWIDTH, BUILDRULE, CL, CLODDS, CLPARM, CODING,\
  \ CONVERGE,\nCORRB, COVB, CT, CTABLE, DETAILS, DSCALE, EXPB, FAST, FCONV, FIRTH,\
  \ GCONV,\nHIERARCHY, INCLUDE, INFLUENCE, IPLOTS, ITPRINT, L, LACKFIT, LINK, MAXITER,\n\
  MAXSTEP, NOCHECK, NODUMMYPRINT, NOFIT, NOINT, NOLOGSCALE, OFFSET, OUTROC,\nPARMLABEL,\
  \ PEVENT, PL, PLCL, PLCONV, PLRL, PPROB, PSCALE, RIDGING, RISKLIMITS,\nROCEPS, RSQUARE,\
  \ SCALE, SELECTION, SEQUENTIAL, SINGULAR, SLE, SLENTRY, SLS,\nSLSTAY, START, STB,\
