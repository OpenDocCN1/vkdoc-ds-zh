  \ | 4 | 1993 | Nov |\n| 12 | $353.00 | $266.00 | CANADA | EAST | EDUCATION | FURNITURE\
  \ | SOFA | 4 | 1993 | Dec |\n| 13 | $107.00 | $190.00 | CANADA | EAST | EDUCATION\
  \ | FURNITURE | SOFA | 1 | 1994 | Jan |\n| 14 | $354.00 | $139.00 | CANADA | EAST\
  \ | EDUCATION | FURNITURE | SOFA | 1 | 1994 | Feb |\n| 15 | $101.00 | $217.00 |\
  \ CANADA | EAST | EDUCATION | FURNITURE | SOFA | 1 | 1994 | Mar |\n| 16 | $553.00\
  \ | $560.00 | CANADA | EAST | EDUCATION | FURNITURE | SOFA | 2 | 1994 | Apr |\n\
  | 17 | $877.00 | $148.00 | CANADA | EAST | EDUCATION | FURNITURE | SOFA | 2 | 1994\
  \ | May |\n| 18 | $431.00 | $762.00 | CANADA | EAST | EDUCATION | FURNITURE | SOFA\
  \ | 2 | 1994 | Jun |\n| 19 | $511.00 | $457.00 | CANADA | EAST | EDUCATION | FURNITURE\
  \ | SOFA | 3 | 1994 | Jul |\n| 20 | $157.00 | $532.00 | CANADA | EAST | EDUCATION\
  \ | FURNITURE | SOFA | 3 | 1994 | Aug |\n\n类似地，你可以使用以下代码来计算 `actual` 变量的平均值：\n\n\
  ```\nproc means data=sashelp.prdsale;\nvar actual;\nrun;\n```\n\n执行上述代码后，日志文件显示没有错误，你会得到如下表\
  \ 2-2 所示的输出。\n\n**表 2-2.** SAS `means` 过程用于 `prdsale` 的输出\n\n| 分析变量 : ACTUAL 实际销售额\
  \ |\n| --- |\n| N | 均值 | 标准差 | 最小值 | 最大值 |\n| --- | --- | --- | --- | --- |\n| 1440\
  \ | 507.1784722 | 287.0313065 | 3.0000000 | 1000.00 |\n\n以下是另一个代码示例：\n\n```\ndata\
  \ income_data;\nInput income expenses;\nCards;\n1200 1000\n9000 600\n;\nrun;\n\n\
  Proc print data=income_data;\nRun;\n```\n\n这会生成如表 2-3 所示的输出。\n\n**表 2-3.** `income_data`\
  \ 的打印输出\n\n| Obs | income | expenses |\n| --- | --- | --- |\n| 1 | 1200 | 1000 |\n\
  | 2 | 9000 | 600 |\n\n### 使用日志文件调试 SAS 代码\n\n阅读日志文件是 SAS 程序执行的一个重要方面。通常，新手用户编写代码后倾向于直接查看输出，但查看日志文件同样重要。日志文件主要有三种通知类型：错误、警告和注释。\n\
  \n*   错误意味着存在语法或其他错误。有时错误会阻止脚本执行。\n*   警告表示 SAS 系统已自动纠正了你的错误并执行了代码。当 SAS 误判并执行时，这是很危险的。\n\
  *   注释在执行程序时提供关键步骤的实时注释。\n\n用于打印 `prdsale` 的 SAS 代码的日志文件提供以下信息：\n\n```\n31   proc\
  \ print data=sashelp.prdsale;\n32   run;\n\nNOTE: Writing HTML Body file: sashtml8.htm\n\
  NOTE: There were 1440 observations read from the data set SASHELP.PRDSALE.\nNOTE:\
  \ PROCEDURE PRINT used (Total process time):\n      real time           3.85 seconds\n\
  \      cpu time            3.79 seconds\n```\n\n来自日志文件的上述消息表明代码中没有错误迹象，并且从数据中读取了\
  \ 1,440 个观测值用于打印。\n\n用于计算平均值的 SAS 代码的日志文件提供以下信息。日志文件中的注释显示从数据集中读取了 1,440 个观测值。\n\
  \n```\n33   proc means data=sashelp.prdsale;\n34   var actual;\n35   run;\n\nNOTE:\
  \ Writing HTML Body file: sashtml9.htm\nNOTE: There were 1440 observations read\
  \ from the data set SASHELP.PRDSALE.\nNOTE: PROCEDURE MEANS used (Total process\
  \ time):\n      real time           0.25 seconds\n      cpu time            0.09\
  \ seconds\n```\n\n再次强调，没有错误，`means` 过程成功运行。\n\n以下是用于创建并打印 `income_data` 的第三个代码片段的日志文件：\n\
  \n```\n53   data income_data;\n54   Input income expenses;\n55   Cards;\n\nNOTE:\
  \ The data set WORK.INCOME_DATA has 2 observations and 2 variables.\nNOTE: DATA\
  \ statement used (Total process time):\n      real time           0.00 seconds\n\
  \      cpu time            0.00 seconds\n\n58   ;\n59   run;\n60   Proc print data=income_data;\n\
  61   Run;\n\nNOTE: Writing HTML Body file: sashtml11.htm\nNOTE: There were 2 observations\
  \ read from the data set WORK.INCOME_DATA.\nNOTE: PROCEDURE PRINT used (Total process\
  \ time):\n      real time             0.29 seconds\n      cpu time             \
  \ 0.18 seconds\n```\n\n日志文件未显示任何错误。如果你故意编写一些错误的语法并提交，你会看到日志文件中出现错误。\n\n以下代码在日志文件中生成了随后的消息。\n\
  \n```\nproc dataprinting data=sashelp.prdsale;\nrun;\n```\n\n```\n40   proc dataprinting\
  \ data=sashelp.prdsale;\nERROR: Procedure DATAPRINTING not found.\n41   run;\n\n\
  NOTE: The SAS System stopped processing this step because of errors.\nNOTE: PROCEDURE\
  \ DATAPRINTING used (Total process time):\n      real time           0.01 seconds\n\
  \      cpu time            0.00 seconds\n```\n\n错误被清楚地指出。\n\n以下是另一个错误示例：\n\n```\n\
  proc print data=sashelp.prdsales;\nrun;\n```\n\n```\n42   proc print data=sashelp.prdsales;\n\
  ERROR: File SASHELP.PRDSALES.DATA does not exist.\n43   run;\n\nNOTE: The SAS System\
  \ stopped processing this step because of errors.\nNOTE: PROCEDURE PRINT used (Total\
  \ process time):\n      real time           0.03 seconds\n      cpu time       \
  \     0.01 seconds\n```\n\n\n\n#### 日志文件中的警告示例\n\n以下代码用于将 SAS 帮助库中的 `prdsale` 数据集复制到一个新的数据文件中：\n\
  \n```\ndata new_data;\nset sashelp.prdsale;\nwhere actuals< 1000;\nrun;\n```\n\n\
  以下是上述代码对应的日志文件：\n\n```\n14   data new_data;\n15   set sashelp.prdsale;\n16   where\
  \ actuals<1000;\nERROR: Variable actuals is not on file SASHELP.PRDSALE.\n17   run;\n\
  NOTE: The SAS System stopped processing this step because of errors.\nWARNING: The\
  \ data set WORK.NEW_DATA may be incomplete.  When this step was stopped there were\n\
  0 observations and 10 variables.\nWARNING: Data set WORK.NEW_DATA was not replaced\
  \ because this step was stopped.\nNOTE: DATA statement used (Total process time):\n\
  real time           0.07 seconds\ncpu time            0.03 seconds\n```\n\n这些警告表明，SAS\
  \ 已经继续执行并创建了一个包含 **10 个变量**和 **0 个观测**的数据文件。\n\n### 编写、阅读日志文件以及调试的技巧\n\n以下是为初学者提供的关于编写和调试\
  \ SAS 程序的一些技巧：\n\n-   尽量保持日志文件整洁，在代码执行后将其清空。按 `Ctrl+E` 可清空日志文件。\n-   即使代码成功执行，也不要直接查看输出。养成先查看日志文件，然后再查看输出文件的习惯。\n\
  -   始终从日志信息开头的第一个错误开始排查。通常 SAS 只显示日志文件的最后几行，但多数情况下，如果你纠正了开头的几个错误，后面的错误可能会消失。不过，这取决于代码中包含的错误类型。\n\
  -   理解通知内容；日志文件中有三种类型的通知：错误、警告和提示。\n-   尽量避免以下几种最常见的错误。\n    -   缺少分号\n    -   在代码开头或更早的位置缺少分号，这可能导致在很靠后的语句中产生错误\n\
  \    -   缺少 `run` 语句\n    -   关键词和数据集名称拼写错误\n    -   引号和括号不匹配\n-   始终以注释的形式编写代码说明。\n\
  -   不要一次性运行整个 SAS 程序，尝试逐个执行代码片段。这样更容易定位错误。\n\n### 保存 SAS 文件\n\n你可以使用`文件`菜单中的`保存`或`另存为`选项，系统会提示你将\
  \ SAS 程序文件保存到所需位置，如图 2-24 所示。\n\n![A978-1-4842-0043-8_2_Fig24_HTML.jpg](img/A978-1-4842-0043-8_2_Fig24_HTML.jpg)\n\
  \n图 2-24. 保存 SAS 文件\n\n#### 练习\n\n以下是一些练习，旨在帮助你更熟悉阅读日志文件。\n\n编写并执行以下代码。查看日志文件并识别任何可能存在的错误。\n\
  \n```\nproc print data=sashelp.airr;run;\n```\n\n保存你的 SAS 文件，并使用`文件`菜单打开它。编写并执行以下代码。查看日志文件并识别任何可能存在的错误。\n\
  \n```\nproc print data=sashelp.buy;run;\n```\n\n## 结论\n\n本章向你介绍了 SAS 编程环境。讨论了在 SAS\
  \ Windows 环境中的导航、各种菜单选项以及一些快捷键图标。还讨论了如何编写简单的 SAS 代码以及如何阅读日志文件。在接下来的几章中，你将进一步学习 SAS\
  \ 编程的更多细节。后续，这些编程知识将帮助你在分析中通过编写 SAS 程序与 SAS 交互来分析数据。\n\n"
- "# 3. 使用 SAS 处理数据\n\n在上一章学习了 SAS 工具的基础知识之后，现在你可以学习 SAS 中的数据处理，这也是本章的重点。在学习任何分析工具时，你应该了解三个主要阶段：工具基础、基本数据处理以及重要的函数和统计算法（图\
  \ 3-1）。任何想要使用高级统计技术的分析师，都需要对像 SAS 这样的统计或分析工具的这三个领域有相当的了解。还有更高级的主题，例如使用宏和其他技巧来编写高效的代码，但随着你对工具熟悉程度的提高，你可以学习这些主题。\n\
  \n![A978-1-4842-0043-8_3_Fig1_HTML.jpg](img/A978-1-4842-0043-8_3_Fig1_HTML.jpg)\n\
  \n图 3-1. 学习 SAS 基础知识的三个阶段\n\n本章将重点介绍 SAS 中的数据处理。你将学习 SAS 数据集、SAS 逻辑库、SAS 语句、数据导入，并且你将学习如何导入数据、使用\
  \ SAS 结构（例如 `if-then-else`）、创建新变量等。所有这些都是使用 SAS 的基础工具。\n\n## SAS 数据集\n\n一个 SAS 数据集包含两个主要部分。第一部分是数据的描述性部分，类似于典型数据集的元数据。另一部分是数据部分，包含二维表格中典型的数据行和列。在本书中，每当我们提到数据集时，都指的是数据部分。SAS\
  \ 数据集具有 `.sas7bdat` 扩展名，并且可以在 SAS 环境中打开它们。\n\n你可能已经熟悉了许多其他用于存储数据的格式。常见的存储格式示例包括文本文件（`.txt`）和逗号分隔文件（`.csv`）。除了处理\
  \ SAS 数据之外，你还将学习如何从外部文件读取数据，这将在本章后续部分介绍。\n\n### SAS 数据集的描述性部分\n\n数据集的描述性部分包含元数据，即关于数据的数据。这主要是对\
  \ SAS 数据集中包含的变量和数据集的描述。你可以使用 SAS 中的简单 `contents` 过程（`PROC CONTENTS`）来获取这些元数据。描述性部分包含诸如数据集创建时间、存储位置、包含的变量和观测数、变量的数据类型等详细信息。下面是一个示例，展示了与\
  \ `PROC CONTENTS` 相关的代码和输出（表 3-1）。它打印了来自 `sashelp` 逻辑库中 `air` 数据集的描述性部分。\n\n```\n\
  proc contents data=sashelp.air;\nrun;\n```\n\n**表 3-1.** CONTENTS 过程\n\n| 数据集名称\
