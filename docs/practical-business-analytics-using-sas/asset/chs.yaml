  \ | 54.97 | <.0001 |\n\n从之前的输出中，你可以观察到以下几点：\n\n- `F-test`的`p-value`小于`0.0001`，远低于所需的\
  \ 5%的显著性水平，因此模型是显著的。\n- `R-squared`和调整后的`R-squared`值接近 100%。\n- `T-tests`的`P-values`表明所有变量对`y`都有显著影响。对于常识和科学，`P-values`均小于`0.0001`，这再次远优于`P-value`小于\
  \ 5%的必要条件。\n- 你可以继续使用该模型进行预测。\n\n###### 前一模型的一些令人惊讶的结果\n\n在同一个 SAT 分数示例中，当你咨询领域专家时，你会得知数学和能力是通过\
  \ SAT 考试取得好成绩所需的两项重要“必备”技能。领域专家根据她的经验告诉你，学生的 SAT 分数取决于他们在高中阶段的数学和能力成绩。但模型却讲述了相反的故事。\n\
  \n让我们仅用数学和能力成绩建立一个模型。如果它们确实不影响 SAT 分数，那么你应该会在`F-test`、`R-squared`值和`T-test`中看到所有负面的结果。\n\
