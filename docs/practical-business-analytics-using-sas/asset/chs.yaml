  \n以下是此示例的两个图（见图 9-10 和 9-11）。一张是包含 `y` 异常值的图，另一张是不包含它的图。可以很容易地注意到巨大的差异。从分析人员的角度来看，没有异常值的第二张图显然更有意义。\n\
  \n![A978-1-4842-0043-8_9_Fig11_HTML.jpg](img/A978-1-4842-0043-8_9_Fig11_HTML.jpg)\
  \  \n**图 9-11.** 不包含异常值的 `x`-`y` 图\n\n![A978-1-4842-0043-8_9_Fig10_HTML.jpg](img/A978-1-4842-0043-8_9_Fig10_HTML.jpg)\
  \  \n**图 9-10.** 包含异常值的 `x`-`y` 图\n\n\n\n#### 相关性 vs 因果关系\n\n你可以通过应用数学公式来计算相关系数（`r`）。仅通过查看`r`（一个数值），你就能判断两个变量之间关联的强度。然而，即使`r`显示出强关联，你也不能得出其中一个导致另一个的结论。考虑一个例子，两个任意变量：道路上的红色公交车数量与股票市场指数。你用这些变量绘制一张图，纯属巧合，这张图可能呈现出一条直线，显示出强烈的正相关。但常识方法会揭示，仅仅通过增加道路上的红色公交车，你无法预期股价会上升。尽管`r`显示出强烈的正相关，但实际上这两个变量并无关系。\n\
  \n有些相关性只是偶然的，但在实践中可能毫无意义。分析师或用户必须首先建立逻辑关系。换句话说，需要先建立逻辑联系（因果关系），然后才应该尝试量化这种关联，以使整个分析有意义。换言之，简单的相关性并不自动意味着现实世界中的因果关系。\n\
  \n有时，两个变量之间的正相关可能由第三个变量引起。例如，假设在现实世界数据中发现，城市中的火灾事故数量与冰淇淋销量之间通常存在高度相关性。显然，两者在逻辑上并无关联。但这种现象通常在夏季气温高时被观察到。正是温度这个第三个变量，推动了该城市的火灾事故和冰淇淋销售。\n\
  \n通常存在的关系类型如下：\n\n- 直接的因果关系；即，`x`导致`y`。例如，吸烟导致癌症。\n- 互为因果。有时`x`导致`y`，同时`y`也可能导致`x`。例如，想象肯德基和麦当劳位于同一条街区。肯德基销售额的增加导致麦当劳销售额的减少，而麦当劳销售额的增加导致肯德基销售额的减少。\n\
  - 由第三个变量引起的`y`与`x`之间的关系；前面讨论的火灾事故与冰淇淋销售案例就是这种情况的一个好例子。\n- 巧合关系或虚假相关性。牙刷销量与犯罪率之间的相关性可能只是偶然存在。如果碰巧，你得到城市每日牛奶销量与每日智能手机销量之间的`r`值为\
  \ 0.95（95%的相关性），这也只能出于偶然。\n\n总结来说，相关性的存在并不能确保任意两个变量之间存在任何因果关系或逻辑关系。相关性只是量化了由分析师定义或建立的因果关系。\n\
  \n#### 相关性示例\n\n现在我们将讨论一个电信服务提供商进行客户满意度调查的案例。客户的满意度（`c_sat`）取决于许多因素。主要因素包括服务质量、问题解决能力、呼叫中心响应和资费方案。该调查从超过\
  \ 1000 名随机选择的客户中收集数据。公司希望研究客户满意度与所有其他变量的关联，以便优化其未来的投资计划，这些计划旨在进一步提高客户满意度水平。\n\n\
  以下是调查数据的快照：\n\n```\nPROC IMPORT OUT= WORK.telecom\nDATAFILE= \"C:\\Users\\VENKAT\\\
  Google Drive\\Training\\Books\\Content\\Regression Analysis\\Telecom_Csat_correlation.csv\"\
  \nDBMS=CSV REPLACE;\nGETNAMES=YES;\nDATAROW= 2 ;\nRUN ;\nproc print data=telecom(obs=\
  \ 10 );\nrun ;\n```\n\n表 9-6 展示了这段代码的输出结果。\n\n**表 9-6.** 电信数据集上 PROC PRINT 的输出（obs=10）\n\
