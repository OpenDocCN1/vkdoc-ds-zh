  \ | 8 | DOLLAR8.2 | BEST32. | |\n| 2 | Date | 数值 | 8 | DATE. | DATE. | |\n| 4 |\
  \ High | 数值 | 8 | DOLLAR8.2 | BEST32. | |\n| 5 | Low | 数值 | 8 | DOLLAR8.2 | BEST32.\
  \ | |\n| 3 | Open | 数值 | 8 | DOLLAR8.2 | BEST32. | |\n| 1 | Stock | 字符 | 9 | | |\
