  \ | 1.58487 |\n\n这个模型看起来一切都很完美。没有多重共线性，因此你可以相信这些系数。两个变量的系数符号也直观上是正确的（从业务知识的角度来看）。\n\
  \n\n\n\n##### 处理多重共线性的其他方法\n\n尽管剔除问题变量是最常用的方法，但还有一些其他方式可以处理多重共线性。\n\n- 你可以使用主成分代替变量。主成分是变量的线性组合，能够解释数据中的最大方差。如果某些变量存在相互关联，你可以使用不相关的变量线性组合，而不是直接使用这些变量。\n\
  - 在充分理解多重共线性成因的基础上，分析师可以通过收集更多数据和更优的无偏样本来减少共线性。\n- 如果预测是唯一目标，且不关心`Y`与`xi`之间的关系，那么可以使用带有相互依赖自变量的同一模型。如果包含相关`Xi`的模型仍然具有较高的`R-squared`值，那么该模型可能足以满足预测需求。只有当需要分析自变量与因变量之间的一对一关系时，挑战才会出现。\n\
  - `岭回归`是另一种处理多重共线性的方法。`岭回归`背后的主要理念是：与其获得高标准差的无偏`beta`估计，不如获得标准差较小的有偏`beta`估计。因此，`岭回归`在寻找回归系数的最小二乘估计时，会对优化矩阵进行一些调整。具体细节超出了本书的讨论范围。\n\
  - 数据转换有时也能产生良好的结果。\n\n### 如何分析输出结果：线性回归最终检查清单\n\n在本章中，你学习了若干需要谨慎处理的评估指标和挑战。以下检查清单能为你提供帮助；你可以用缩写`FRAVT`来记住它，它代表`F\
  \ 检验`、`R 平方`、`调整后的 R 平方`、`VIF`和`T 检验`。\n\n#### 双重检查线性回归的假设\n\n在尝试构建模型之前，你必须确保数据（观测值）严格遵循所有回归假设。通常，这一过程会花费大量时间。许多分析师倾向于忽略这一步，想当然地认为所有回归假设都已满足。通常，会绘制`Xi`与`Y`变量之间的散点图来验证线性假设。通过这一步，你几乎能掌握\
  \ 90%关于异常值、非线性、异方差性等问题的信息。只有当所有回归假设都得到满足时，你才能进入下一个检查点——`F 检验`。大多数情况下，分析师是在分析进行到中途、出现问题时，才意识到可能存在假设违背的情况。\n\
  \n#### F 检验\n\n在此顺序中，首先需要关注的指标是`F 检验`。它能让你了解模型的整体显著性。如果`F 检验`显示模型不显著，则无需继续进行模型构建过程。你可以直接停止模型构建，并寻找其他影响变量来预测`y`。你可以搜索更多数据或进行更多研究，以检查整个模型构建过程中任何阶段是否存在重大错误。如果`F\
  \ 检验`通过，换句话说，模型被确定为显著，那么你可以进入下一个检查点——`R 平方`值。\n\n#### R 平方\n\n在确认模型显著之后，接下来看`R 平方`值。`R\
  \ 平方`会告诉你模型显著的程度。较高的`R 平方`值（大于 80%）表明模型解释了因变量中的最大变异。\n\n#### 调整后的 R 平方\n\n由于在使用多元回归方法时`R\
  \ 平方`存在一些缺点，你还必须查看`调整后的 R 平方`值，并确保没有冗余变量，或者模型没有因自变量过多而被过度设定。\n\n#### VIF\n\n下一步是确保自变量之间不存在多重共线性。你可以通过每个变量的`VIF`值来检查。如果检测到多重共线性，则需要对自变量进行适当处理，以准备一组独立的预测变量。\n\
  \n#### 每个变量的 T 检验\n\n清单中的最后一项是`T 检验`。`T 检验`的结果告诉你哪些变量影响最大。你可以安全地剔除所有不重要的变量，只保留影响最大的那些。有时，需要多次迭代模型才能识别并保留少数几个影响最大的变量。这可能需要在`R\
  \ 平方`值上做出一点妥协，以减少变量数量。\n\n\n\n#### 分析回归输出：最终检查表示例\n\n让我们再次观察智能手机销售数据的输出。假设分析师已经根据线性回归的所有假设对数据进行了验证。以下是代码、SAS\
  \ 输出（表 10-34）以及最终检查表步骤：\n\n```\nproc reg data= mobiles;\nmodel sales= Ratings Price\
  \ Num_new_features Stock_market_ind Market_promo_budget/vif;\nrun;\n```\n\n请参考表\
