  \ 创建新变量\n\n要创建一个新变量，你需要再次使用 `set` 语句以及 `new` 变量语句。以下是通用示例：\n\n```\ndata new_data;\n\
  set old_data;\n<新变量语句>;\nrun;\n```\n\n让我们尝试编写一些实际的 SAS 代码片段来详细说明之前的通用代码，以创建新变量。\n\
  \n通过增加 12% 的税费，创建一个新变量 `budget_new`。\n\n```\ndata MYDATA.market_v1;\nset MYDATA.market;\n\
  budget_new=budget* 1.12;\nrun;\n```\n\n上述代码的日志文件如下：\n\n```\nNOTE: There were 7843\
  \ observations read from the data set MYDATA.MARKET.\nNOTE: The data set MYDATA.MARKET_V1\
  \ has 7843 observations and 8 variables.\nNOTE: DATA statement used (Total process\
  \ time):\nreal time           0.01 seconds\ncpu time            0.01 seconds\n```\n\
  \n请注意 SAS 日志文件的第一行。它的含义如下：每当某条记录的 `budget` 值为缺失值时，`budget_new` 变量也将是缺失值。这是在 SAS\
  \ 中处理数据时需要记住的一个重要点。\n\n表 3-10 列出了新数据集 `market_v1` 的快照。\n\n**表 3-10.** 新数据集 `market_v1`\
