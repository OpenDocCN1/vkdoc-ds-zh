  \n> **注意：** 如前所述，DF 检验的精确解释较为复杂，超出了本书的讨论范围。以下是为统计学爱好者提供的一些注释。\n> \n> DF 检验有两组 P\
  \ 值：\n> - 第一组 P 值（`Pr<Rho`）用于直接检验单位根。查看这些 P 值（表 12-4），您可以得出结论：该序列是非平稳的。\n> - 第二组\
  \ P 值（`Pr<Tau`）用于检验差分后的`Y[t]`对常数、时间`t`、`Y[t-1]`以及差分后的`Y[t-1]`的回归。\n\n###### 实现平稳性\n\
  \n如果序列像前一个案例（图 12-15）那样是非平稳的，您可以对其进行差分以使其平稳。如果`Y[t]`是原始序列，则`∆Y[t] = Y[t] - Y[t-1]`。您不再使用原始序列值，而是考虑差分后的序列，如表\
  \ 12-5 所示。\n\n**表 12-5.** 差分后的序列数据\n\n| 时间 | `Y[t]` (原始序列) | `Y[t-1]` (原始序列的滞后值)\
  \ | `∆Y[t] = Y[t] - Y[t-1]` (差分后的序列) |\n| --- | --- | --- | --- |\n| 一月 | 200 |\
  \ - | - |\n| 二月 | 250 | 200 | 50 |\n| 三月 | 230 | 250 | -20 |\n| 四月 | 245 | 230 |\
  \ 15 |\n| 五月 | 280 | 245 | 35 |\n| 六月 | 256 | 280 | -24 |\n\n在前面的 Microsoft 示例中，股票价格时间序列是非平稳的。让我们使用以下\
  \ SAS 代码创建一个差分后的时间序列。这相当直接。\n\n```\ndata ms1;\nset ms;\ndiff_stock_price=stock_price-lag1(stock_price);\n\
  run;\n```\n\n`ms1`是新的数据集，`Lag1`表示`Y[t-1]`的值，`diff_stock_price`是新的差分序列。表 12-6 是差分序列的快照。\n\
  \n**表 12-6.** 差分后的股票价格时间序列快照\n\n| 观测值 | `stock_price` | `diff_stock_price` |\n|\
  \ --- | --- | --- |\n| 1 | 27.05 | . |\n| 2 | 27.23 | 0.18 |\n| 3 | 25.55 | -1.68\
  \ |\n| 4 | 24.86 | -0.69 |\n| 5 | 24.72 | -0.14 |\n| 6 | 24.64 | -0.08 |\n| 7 |\
  \ 25.5 | 0.86 |\n| 8 | 25.41 | -0.09 |\n| 9 | 25.34 | -0.07 |\n| 10 | 25.94 | 0.60\
  \ |\n\n请注意，有些序列即使经过一次差分后可能仍不平稳。这时您需要进行二次差分。如果二次差分也不起作用，您可能需要尝试其他变换，例如对数变换。\n\n现在，不再考虑原始序列（即股票价格`Y[t]`），而是考虑差分后的股票价格并检验其平稳性。以下是执行此检验的代码：\n\
  \n```\nproc arima data= ms1;\nidentify var=diff_stock_price stationarity=(DICKEY);\n\
  run;\n```\n\n表 12-7 展示了此代码的输出。同样，您只需关注输出中的“增广迪基-富勒单位根检验”表格，并将重点放在“单均值”部分。\n\n**表\
