  \n### 第 4 步：使用频率进行数据探索和验证\n\n第 4 步检查所有取值为可数个数的离散变量。频率表应该仅为离散变量和分类变量创建。对连续变量创建频率表可能会导致系统卡死，因为连续变量预期会取几乎无限多个值。因此，如果数据中的记录过多，在选择用于频率分布的变量时需要小心。\n\
  \n以下是 `SeriousDlqin2yrs` 和 `obs_type` 的频率表代码。在展示频率表之后，我们将解释如何利用它们为你服务。\n\n`Title\
  \ '2 年内严重违约的频率表';`\n`proc freq` `data= cust_cred_raw_v1;`\n`table SeriousDlqin2yrs;`\n\
  `run` `;`\n\n表 7-25 给出了此代码的输出结果。\n\n表 7-25。\n在 cust_cred_raw_v1 数据集上执行 proc freq\
  \ 的输出结果（表 SeriousDlqin2yrs）\n\n![A978-1-4842-0043-8_7_Figa_HTML.jpg](img/A978-1-4842-0043-8_7_Figa_HTML.jpg)\n\
  \n输出结果中缺失了 101,503 个值。缺失值的计数在 `PROC FREQ` 的输出中给出。数据团队之前已经提到，严重违约的数值对于测试群体是不可用的。如果在\
  \ `obs_type` 上运行 `proc frequency`，它应该会得到恰好 101,503 条测试记录。\n\n`title' obs_type 的频率表';`\n\
  `proc freq` `data= cust_cred_raw_v1;`\n`table obs_type;`\n`run` `;`\n\n表 7-26 列出了此代码的输出结果。\n\
  \n表 7-26。\n在 cust_cred_raw_v1 数据集上执行 proc freq 的输出结果（表 obs_type）\n\n| FREQ 过程 |\n\
