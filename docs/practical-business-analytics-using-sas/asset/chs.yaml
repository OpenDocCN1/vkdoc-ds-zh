  \ 如果 `Mydata` 库从库列表中消失或被删除，不必担心。您需要做的只是重新运行以下代码来重新创建库名称并为其分配目录路径。之后，您将再次在 `Mydata`\
  \ 库中看到 `Income` 数据集。您无需再次创建数据集。数据集 `Income` 已永久创建在给定的库文件夹路径中，文件扩展名为 `.sas7bdat`。\n\
  >\n> ```\n> libname mydata 'C:\\Users\\sales\\Desktop\\Data';\n> ```\n\n既然您已经学会了如何使用\
  \ SAS 库，那么接下来是时候学习 SAS 编码的基础知识了，这将使您能够处理数据并执行一些有意义的分析。下一节将向您介绍 SAS `PROC` 和 `DATA`\
  \ 步骤，它们是编写 SAS 代码最基本的构建块。\n\n## SAS 语句的两种主要类型\n\nSAS 语句主要有两种类型（参见表 3-5）。一种以 `DATA`\
  \ 开头，另一种以 `PROC` 开头。数据步骤主要用于变量创建、数据处理和其他与数据相关的操作。`PROC` 步骤用于（在 SAS 代码中）调用各种算法、特殊函数等。`PROC`\
  \ 是 procedure（过程）这个词的缩写，意思是 SAS 中预编写的代码。\n\n**表 3-5.** `DATA` 步骤和 `PROC` 步骤\n\n\
  | `DATA` 步骤 | `PROC` 步骤 |\n| --- | --- |\n| 以关键字 `DATA` 开头。用于数据处理。创建计算字段。主要用于报表。数据合并、连接、数据清洗操作。示例：从原始数据准备用于分析的数据需要大量数据操作。\
  \ | 以关键字 `PROC` 开头。用于分析和其他复杂操作。您可以通过获取 `PROC` 步骤的输出来创建数据集。示例：使用回归算法预测销售额需要 `PROC\
  \ REG`。 |\n\n## 将数据导入 SAS\n\n在开始处理数据之前，您需要将其以 SAS 数据集的形式导入到 SAS 库中。数据可以从多种来源导入 SAS，例如\
  \ CSV 文件、Excel 文件、TXT 文件、数据库文件等。以下各节将解释一些导入和创建数据的方法。\n\n### 使用 SAS 程序创建数据集\n\n如果您必须根据提供的某些数据创建一个小型数据集，可以通过编写一个简短的\
  \ SAS 程序来完成。\n\n这是一个创建数据集的示例程序：\n\n```\ndata mydata.income;\ninput income expense;\n\
  datalines;\n4500 2000\n5000 2300\n7890 2810\n8900 5400\n2300 2000\n;\nrun;\n```\n\
  \n表 3-6 解释了上述语法。\n\n**表 3-6.** 程序语法解释\n\n| SAS 语句 | 解释 |\n| --- | --- |\n| `data`\
  \ | 这是一个用于在 SAS 中创建新数据集的关键字。 |\n| `mydata.income;` | `Mydata` 是库名称，`income` 是新数据集的名称。\
  \ |\n| `input` | 这是一个用于声明数据中变量的关键字。 |\n| `income expense;` | 这是将在新数据集中创建的两个变量。 |\n\
  | `datalines;` | 这是一个用于向数据集中输入数据的关键字。 |\n| `4500 2000` `5000 2300` `7890 2810` `8900\
  \ 5400` `2300 2000` `;` | 这是实际数据。 |\n\n以下是执行此程序时的日志文件：\n\n```\nNOTE: The data set\
  \ MYDATA.INCOME has 5 observations and 2 variables.\nNOTE: DATA statement used (Total\
  \ process time):\nreal time           0.03 seconds\ncpu time            0.03 seconds\n\
  ```\n\n图 3-13 展示了 `Mydata` 库中的 `Income` 数据集。\n\n![A978-1-4842-0043-8_3_Fig13_HTML.jpg](img/A978-1-4842-0043-8_3_Fig13_HTML.jpg)\n\
  \n**图 3-13.** 创建 `Income` 数据集后 `Mydata` 库的内容\n\n通常，当您想快速创建一个小型数据集用于分析时，数据集创建步骤非常有用。如果您要创建非常大的数据集，那么手动输入值显然不是理想的选择。您需要使用\
  \ SAS 的导入功能将大型数据文件导入到 SAS 环境中。\n\n\n\n### 使用导入向导\n\n你可以通过编写 `SAS` 代码从外部文件导入数据，也可以使用导入向导。我们先来看看如何使用导入向导将外部平面文件导入\
  \ `SAS`。以下是导入数据的步骤：\n\n选择：文件 ➤ 导入数据（参见图 3-14）。\n\n![A978-1-4842-0043-8_3_Fig14_HTML.jpg](img/A978-1-4842-0043-8_3_Fig14_HTML.jpg)\n\
  \n图 3-14. 导入数据：选择 `Import Data` 选项\n\n选择文件类型。在此示例中，你将导入一个 CSV 文件；因此，你需要选择 CSV 格式（参见图\
  \ 3-15 和图 3-16）。\n\n![A978-1-4842-0043-8_3_Fig16_HTML.jpg](img/A978-1-4842-0043-8_3_Fig16_HTML.jpg)\n\
  \n图 3-16. 导入数据：最终选择界面\n\n![A978-1-4842-0043-8_3_Fig15_HTML.jpg](img/A978-1-4842-0043-8_3_Fig15_HTML.jpg)\n\
