  \ `y` 的变异。您可能想尝试使用多个自变量的回归线。当只有一个自变量时，回归称为简单回归；但如果有多个自变量，则称为多元线性回归，这是下一章的主题。\n\n\
  ## 本章小结\n\n在本章中，您学习了一些相对复杂的分析措施和技术。到目前为止，我们只使用了简单的描述性统计量，例如均值、方差等。您了解到变量之间的关联是通过相关性来量化的。您还了解到，利用相关变量预测目标变量是通过使用简单线性回归完成的。在“简单线性回归”这一节中，我们详细阐述了其概念部分。\n\
  \n现实场景并非如此简单。多个预测变量会影响一个目标变量，因此我们需要在此处使用多元线性回归。下一章将介绍多元线性回归。在接下来的章节中，您将看到其他一些非线性回归分析技术，例如逻辑回归。\n\
  \n"
- "# 10. 多元回归分析\n\n在第 9 章中，我们讨论了相关性，它用于量化一对变量之间的关系。我们还讨论了简单回归，它有助于在给定自变量的情况下预测因变量。在简单回归中，您使用单个自变量来预测因变量。这是一种简单化的方法，在实践中，某些因变量可能需要多个自变量才能进行准确预测。例如，仅通过观察出口额，您能预测一个国家的国内生产总值（GDP）吗？显然不能。预测\
  \ GDP 可能需要其他几个变量，例如人均收入、自然资源价值、国家债务等。同样，一个人的健康状况取决于许多变量，例如吸烟或饮酒习惯、饮食习惯、工作压力、每日锻炼、遗传、睡眠习惯等等。\n\
  \n在现实场景中，您不能指望单个变量能解释因变量的所有变异；在现实生活中，预测大多数因变量需要多个自变量。这就是多元线性回归分析发挥作用的地方。多元线性回归的另一个经典例子是银行进行的信用风险分析，我们一直在本书中讨论这一点。\n\
  \n## 多元线性回归\n\n如前所述，现实世界的问题是多元的；换句话说，现实生活中的大多数目标变量都依赖于多个自变量。员工的总薪酬可能取决于其教育背景、工作年限、工作类型和复杂性、公司政策等等。图\
  \ 10-1 还展示了一些其他示例。\n\n公司在预测其产品销售量时应考虑哪些因素？\n\n银行在预测其客户的贷款偿还能力时应考虑哪些因素？\n\n![A978-1-4842-0043-8_10_Fig1a_HTML.jpg](img/A978-1-4842-0043-8_10_Fig1a_HTML.jpg)![A978-1-4842-0043-8_10_Fig1b_HTML.jpg](img/A978-1-4842-0043-8_10_Fig1b_HTML.jpg)![A978-1-4842-0043-8_10_Fig1c_HTML.jpg](img/A978-1-4842-0043-8_10_Fig1c_HTML.jpg)\n\
  \n图 10-1. 现实生活中的多元线性回归示例\n\n大多数用于预测利润、投资回报等的经济模型都涉及多个变量。多元回归技术与简单回归模型并没有太大区别，只是涉及多个变量。基本假设、回归系数的解释和\
  \ R 方保持不变。\n\n\n\n### 多元回归线\n\n简单回归线方程为 `y = β0 + β1x`。多元回归线方程如下所示：`y = β0 + β1x1\
  \ + β2x2 + ... + βpxp`，其中\n\n* `β[1], β[2]…….. β[p]` 是 `x[1]`, `x[2]`, …….`x[p]`\
  \ 的系数。\n* `β[0]` 是截距。\n\n在多元回归中，你的目标是拟合一条连接所有自变量和因变量的回归线。以智能手机销售为例。假设你想使用手机评分、手机价格区间、市场推广等自变量来预测智能手机的销量。\n\
  \n在简单回归中，你尝试在 `y` 和 `x` 之间拟合一条回归线。由于过程中只涉及两个变量，回归线在二维图上就是一条简单的直线。而形如 `y = β0 + β1x1\
  \ + β2x2` 的回归方程所对应的直线将是三维的，如 10-2 所示。显然，这比简单线性回归中涉及的二维直线更难想象。\n\n![A978-1-4842-0043-8_10_Fig2_HTML.jpg](img/A978-1-4842-0043-8_10_Fig2_HTML.jpg)\n\
  \n**图 10-2.** 具有两个自变量的多元回归图\n\n在智能手机销售示例中，回归线将如下所示：`sales = β0 + β1 * ratings +\
  \ β2 * price + β3 * num_new_features + ...`。一旦有了 Beta 系数的值，你就可以创建回归线方程并用它来预测销量。寻找这些\
  \ Beta 系数是后续章节的主题。\n\n### 使用最小二乘法拟合多元回归线\n\n拟合多元回归线的过程与你在简单回归章节中学到的过程相同。唯一的区别在于自变量及其系数的数量。这里你有许多额外的自变量（`x[1]`,\
  \ `x[2]`, …….`x[p]`），并且你试图找到多个系数（`β[1], β[2]…….. β[p]`）。\n\n以下是你试图完成的任务：\n\n- 拟合一个最能代表数据的平面（多维线）\n\
  - 拟合一条穿过数据中大多数点的回归线\n- 以误差最小的多维线形式表示散点数据\n\n在方程 `y = β0 + β1x1 + β2x2 + ... + βpxp`\
  \ 中，找到 `β[1], β[2]…….. β[p]` 和截距 `β[0]` 的值。请参考图 10-3。\n\n![A978-1-4842-0043-8_10_Fig3_HTML.jpg](img/A978-1-4842-0043-8_10_Fig3_HTML.jpg)\n\
  \n**图 10-3.** 回归分析中的估计值与实际值\n\n图 10-3 展示了在三维空间中看到的估计回归线和实际值。误差就是两点之间的距离。回归平面上的估计点和实际点用圆圈表示。虚线表示误差。正如预期，你总是希望实际值与估计值之间的差异为零。\n\
  \n尝试最小化误差的平方，以找到 Beta 系数。需要最小化的函数是：`minimize Σ(y_i - (β0 + β1*x1_i + β2*x2_i + ...\
  \ + βp*xp_i))²`。\n\n现在，你可以使用优化技术来找到能够最小化上述函数的 `β[1], β[2]…….. β[p]` 和 `β[0]` 的值。此过程得出的线将是该数据的最佳回归线。这是因为它确保了在优化过程中，误差平方和保持尽可能小的值。\n\
  \n### SAS 中的多元线性回归\n\n在 SAS 中，你需要在 `model` 语句中指定数据集名称以及因变量和自变量的列表。SAS 会执行最小二乘优化，并输出\
  \ Beta 系数作为结果。\n\n### 示例：智能手机销量估算\n\n在之前简单回归章节中讨论的智能手机销售示例中，你使用 `Price`（价格）、`Ratings`（评分）、`Num_new_features`（新功能数量）、`Stock_market_ind`（股市指标）和\
  \ `Market_promo_budget`（市场推广预算）等自变量来估算销量。当逐个使用变量时，你无法得到一个好的模型。下表（表 10-1）是 R 方表，展示了各个变量及其解释的因变量变异。请参考上一章中关于手机销售的简单回归示例。\n\
  \n**表 10-1.** R 方表\n\n| 自变量 | R 方 | 已解释的变异 | 未解释的变异 |\n| --- | --- | --- | --- |\n\
  | Price | 0.0483 | 5% | 95% |\n| Ratings | 0.0906 | 9% | 91% |\n| Num_new_features\
  \ | 0.0208 | 2% | 98% |\n| Stock_market_ind | 0.0537 | 5% | 95% |\n| Market_promo_budget\
  \ | 0.1325 | 13% | 87% |\n\n现在，你为这个问题拟合一个多元回归线。以下是执行此操作的 SAS 代码：\n\n```\n/* 智能手机销售示例的多元回归线\
  \ */\nproc reg data= mobiles;\nmodel sales= Ratings Price Num_new_features Stock_market_ind\
  \ Market_promo_budget;\nrun;\n```\n\n以下是代码说明：\n\n- `PROC REG` 用于调用回归过程。\n- 数据集名称是\
  \ `mobiles`。\n- 你需要在 `model` 语句中指定因变量和自变量；`sales` 是因变量。\n\n表 10-2 展示了这段代码的 SAS 输出结果。\n\
  \n**表 10-2.** 在 Mobiles 数据集上执行 `PROC REG` 的输出\n\n| 读取的观测数 | 58 |\n| --- | --- |\n\
  | 使用的观测数 | 58 |\n\n| 方差分析 | | | | | |\n| --- | --- | --- | --- | --- | --- |\n|\
  \ 来源 | 自由度 | 平方和 | 均方 | F 值 | Pr > F |\n| 模型 | 5 | 7.408043E14 | 1.481609E14 | 55.16\
  \ | <.0001 |\n| 误差 | 52 | 1.396636E14 | 2.685839E12 | | |\n| 校正合计 | 57 | 8.80468E14\
  \ | | | |\n\n| 均方根误差 | 1638853 | R 方 | 0.8414 |\n| --- | --- | --- | --- |\n| 因变量均值\
  \ | 9394688 | 调整后 R 方 | 0.8261 |\n| 变异系数 | 17.44446 | | |\n\n| 参数估计 | | | | | |\n\
  | --- | --- | --- | --- | --- | --- |\n| 变量 | 自由度 | 参数估计值 | 标准误差 | t 值 | Pr > &#124;t&#124;\
  \ |\n| 截距 | 1 | 493778 | 1520007 | 0.32 | 0.7466 |\n| Ratings | 1 | 651375 | 90775\
  \ | 7.18 | <.0001 |\n| Price | 1 | -1833.67081 | 127.24677 | -14.41 | <.0001 |\n\
  | Num_new_features | 1 | 547167 | 85234 | 6.42 | <.0001 |\n| Stock_market_ind |\
  \ 1 | -105.38867 | 106.01603 | -0.99 | 0.3248 |\n| Market_promo_budget | 1 | 100.92891\
  \ | 8.38744 | 12.03 | <.0001 |\n\n输出包含了所有回归系数的估计值。所有自变量的系数都在最终的参数估计表中列出。截距为 493,778。评分的回归系数为\
  \ 651,375。价格的回归系数为 -1,833.67，新功能数量的回归系数为 547,167。\n\n最终的多元回归线方程如下：`sales = 493 778\
  \ + 651 375 * ratings - 1 833.67 * price + 547 167 * num_new_features - 105.39 *\
  \ stock_market_ind + 100.93 * market_promo_budget`。从上述系数及其符号，你可以推断出手机销量与客户评分、新增功能数量和市场推广力度成正比。你还可以观察到，销量与价格区间和股市指标成反比（回归方程中的负系数）。股市指数与销量的关系似乎有些违背直觉，但这正是历史上一直发生的情况。股市指数对智能手机销量有负面影响。如果股市上涨，智能手机销量会下降；反之，在熊市中则相反。\n\
  \n有了这个方程，如果你有样本的评分、价格区间、新功能数量、股市指标和产品的预估推广水平等数值，你就可以大致了解销量。但不幸的是，这还不是全部。还有一些问题需要回答。预测销量值的准确性如何？这条线是否很好地拟合了这些数据？你能用这条回归线进行预测吗？使用这条回归线，你能保证的误差或准确度是多少？所有变量解释了销量变异的多少？如何衡量拟合优度？这里也能使用\
  \ R 方吗？\n\n\n\n### 拟合优度\n\n这里的拟合优度，或称为验证指标，是 `R-squared`（R 方）。`R-square` 值就是所有变量共同解释的因变量方差。多元回归的方差分析（ANOVA）表给出了误差平方和的值。\n\
  \n为了方便你查阅，我们在表 10-3 中重现了手机销售示例的方差分析表。\n\n**表 10-3. 手机销售示例的方差分析表**\n\n| 方差分析 (ANOVA)\
  \ | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **变异来源** | **自由度**\
  \ | **平方和** | **均方** | **F 值** | **Pr > F** |\n| 模型 | 5 | 7.408043E14 | 1.481609E14\
  \ | 55.16 | \\<.0001 |\n| 误差 | 52 | 1.396636E14 | 2.685839E12 | | |\n| 校正总和 | 57\
  \ | 8.80468E14 | | | |\n\n| **根均方误差** | 1638853 | **R 方** | 0.8414 |\n| :--- | :---\
  \ | :--- | :--- |\n| **因变量均值** | 9394688 | **调整 R 方** | 0.8261 |\n| **变异系数** | 17.44446\
  \ | | |\n\n由于销售数字以百万计，方差（平方和）也是百万的倍数。由于所有数值都在同一量级上，解读 ANOVA 表就很容易。`Y` 的总方差（总平方和）约为\
  \ 8.8 个单位，而误差平方和为 1.4 个单位。剩下的部分就是模型平方和，为 7.4 个单位。`R-squared` 值为 84.14%。\n\n请参考第\
  \ 9 章关于简单回归的内容，以了解更多关于 `R-square` 和平方和的知识。\n\n这条回归线看起来是一个相当准确的模型。所有变量共同解释了 `y` 中近\
  \ 84%的变异（图 10-4），尽管单独来看，没有任何一个变量能解释 `y` 中超过 10%的变异。你可以放心地使用这个模型进行预测。\n\n![A978-1-4842-0043-8_10_Fig4_HTML.jpg](img/A978-1-4842-0043-8_10_Fig4_HTML.jpg)\n\
  \n**图 10-4. 手机示例中可解释与不可解释的变异**\n\n### 回归输出的三个主要衡量指标\n\n在 SAS 输出中，除了回归系数、ANOVA 表和\
  \ `R-square` 之外，还提到了一些其他指标。你可能不需要全部了解，但以下是必须知道的统计指标：\n\n-   F 检验、F 值、F 检验的 P 值\n\
  -   T 检验、T 值、T 检验的 P 值\n-   R 方和调整 R 方\n\n#### F 检验、F 值、F 检验的 P 值\n\n执行 F 检验是为了查看模型在当前背景下是否足够相关。这是检验模型整体拟合度的测试。该检验回答了以下问题：\n\
  \n-   模型到底有没有用？\n-   是否至少有一个变量能解释因变量 (`y`) 的某些变异？\n\n举例来说，考虑构建一个智能手机销售的分析模型。一些无关紧要的自变量，如城市中的公交车数量、平均披萨订购量、平均燃料消耗量，肯定无法帮助预测智能手机的销售额。如果你使用越来越多这样的变量，整个模型将变得毫无意义。显而易见的原因是，模型中的自变量无法解释因变量\
  \ `y` 的变异。F 检验就是用来确定这一点的。它判断模型中是否至少有一个变量对因变量有显著影响。\n\n在本章前面讨论多元回归线时，我们谈到了 beta 系数。F\
  \ 检验利用这些系数来检验模型的解释力或预测力。如果至少有一个 beta 系数不等于零，就可以推断模型中存在一个对因变量 `y` 的变异有显著影响的自变量。如果有多个\
  \ beta 值不为零，则表明存在多个可以解释 `y` 变异的自变量。\n\n- H[0]：`β1 = β2 = ... = βk = 0`，这等同于说所有 beta\
  \ 值都为零。\n    - 如果所有 beta 值都为零，意味着模型不显著，没有解释预测能力。\n- H[1]：`至少有一个 βj != 0`，这等同于说至少有一个\
  \ beta 值不为零。\n\n关于 H[0]和 H[1]的解释，请参考第 8 章的假设检验。\n\n如前所述，即使只有一个 beta 值为正，你也可以推断该模型具有一定的解释能力。\n\
  \n为了检验上述假设，你需要依赖 F 统计量，并计算 `F 值` 和相应的 `P 值`。根据 F 检验的 `P 值`，你接受或拒绝原假设。F 检验的 `P 值`\
  \ 将最终决定你是否应该采纳或拒绝该模型。`F 值` 是通过解释平方和与回归平方和计算得出的。有关 `P 值` 和 F 检验的更多信息，请参考第 8 章的假设检验。\n\
  \n如果 F 检验的 `P 值` 小于 5%，则拒绝原假设 H[0]。换句话说，你拒绝“该模型没有解释力”的假设，这意味着该模型可用于有用的预测。如果 F 检验的\
  \ `P 值` 大于 5%，那么你没有足够的证据拒绝 H[0]，这可能会迫使你接受原假设。简单来说，查看 F 检验的 `P 值`。如果它大于 5%，那么你的模型就有麻烦了；否则，无需担心。\n\
  \n##### 示例：用于整体模型检验的 F 检验\n\n在智能手机销售示例中，如果你想查看整体模型的拟合情况，就必须查看输出中 F 检验的 `P 值`。\n\n\
  以下代码保持不变：\n\n```sas\n/* 智能手机销售示例的多元回归线 */\nproc reg data= mobiles;\nmodel sales=\
  \ Ratings Price Num_new_features Stock_market_ind Market_promo_budget;\nrun;\n```\n\
  \n表 10-4 给出了这段代码的输出结果。在 ANOVA 表中，你可以看到 F 检验的 `F 值` 和 `P 值`。\n\n**表 10-4. 对 Mobiles\
  \ 数据集执行 PROC REG 的输出**\n\n| 读取的观测数 | 58 |\n| :--- | :--- |\n| 使用的观测数 | 58 |\n\n\
  | 方差分析 | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **变异来源** | **自由度**\
  \ | **平方和** | **均方** | **F 值** | **Pr > F** |\n| 模型 | 5 | 7.408043E14 | 1.481609E14\
  \ | 55.16 | \\<.0001 |\n| 误差 | 52 | 1.396636E14 | 2.685839E12 | | |\n| 校正总和 | 57\
  \ | 8.80468E14 | | | |\n\n| **根均方误差** | 1638853 | **R 方** | 0.8414 |\n| :--- | :---\
  \ | :--- | :--- |\n| **因变量均值** | 9394688 | **调整 R 方** | 0.8261 |\n| **变异系数** | 17.44446\
  \ | | |\n\n| 参数估计 | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **变量**\
  \ | **自由度** | **参数估计值** | **标准误差** | **t 值** | **Pr > \\|t\\|** |\n| 截距 | 1 | 493778\
  \ | 1520007 | 0.32 | 0.7466 |\n| 评分 | 1 | 651375 | 90775 | 7.18 | \\<.0001 |\n|\
  \ 价格 | 1 | -1833.67081 | 127.24677 | -14.41 | \\<.0001 |\n| 新功能数量 | 1 | 547167 |\
  \ 85234 | 6.42 | \\<.0001 |\n| 股票市场指数 | 1 | -105.38867 | 106.01603 | -0.99 | 0.3248\
  \ |\n| 市场推广预算 | 1 | 100.92891 | 8.38744 | 12.03 | \\<.0001 |\n\n从方差分析表中可以看出，`F 值`\
  \ 为 55.16，且 F 检验的 `P 值` 小于 0.0001，远低于 5%的临界值。因此，你可以拒绝原假设。现在可以放心地说，该模型对于任何进一步的分析都是有意义的。通常，当\
  \ `R-squared` 很高时，你会看到模型是显著的。在某些情况下，如果模型中有太多无用的或不显著的变量，`R-squared` 和 F 检验的表现会有所不同。请参考本章后面的“R\
  \ 方和调整 R 方（Adj R-sq）”部分。\n\n\n\n#### F 检验：补充示例\n\n我们来看一个简单回归示例，即价格与销售额的回归线。\n\n\
  ```\nproc reg data= mobiles;\nmodel sales=price;\nrun;\n```\n\n表 10-5 展示了上述代码的结果。\n\
  \n**表 10-5.** `PROC REG` 对 `Mobiles` 数据集的输出结果（`model sales=price`）\n\n| 读取的观测数 |\
  \ 58 |\n| --- | --- |\n| 使用的观测数 | 58 |\n\n| 方差分析 |\n| --- |\n| 来源 | 自由度 | 平方和 |\
  \ 均方 | F 值 | Pr > F |\n| 模型 | 1 | 4.255764E13 | 4.255764E13 | 2.84 | 0.0973 |\n\
  | 误差 | 56 | 8.379103E14 | 1.496268E13 | | |\n| 校正合计 | 57 | 8.80468E14 | | | |\n\n\
  | 均方根误差 | 3868163 | R 方 | 0.0483 |\n| 因变量均值 | 9394688 | 调整 R 方 | 0.0313 |\n| 变异系数\
  \ | 41.17394 | | |\n\n| 参数估计 |\n| --- |\n| 变量 | 自由度 | 参数估计 | 标准误差 | t 值 | Pr > &#124;t&#124;\
  \ |\n| 截距 | 1 | 10047931 | 638755 | 15.73 | <.0001 |\n| 价格 | 1 | -307.95807 | 182.60286\
  \ | -1.69 | 0.0973 |\n\n`F`值为 2.84，`F`检验的`P`值为 9.73%（0.0973）。由于`P`值大于 5%，你没有足够的证据拒绝`H[0]`，需要接受该模型不显著的结论。在这种情况下，进一步查看`R`方值（即模型解释了`y`中的多少变异）就没有意义了。\n\
  \n#### T 检验、T 值和 T 检验的 P 值\n\n回归中的`T`检验用于检验各个变量的影响。如前所述，`F`检验用于确定模型的整体显著性。例如，在一个包含十个自变量的回归模型中，并非所有变量都显著。即使移除一些不显著的自变量，也不会对模型的预测能力产生实质性影响。在移除影响较小的变量后，模型的解释力基本保持不变。用数学术语来说，不显著自变量的\
  \ beta 系数可以视为零。\n\n例如，以预测智能手机销量的模型为例。你是否需要保留所有自变量？它们都相关或显著吗？如果模型中包含了一个垃圾变量（例如电影票销量），情况会怎样？这个包含垃圾变量的模型可能会通过`F`检验，因为模型中至少有一个变量是显著的。请思考以下问题，这是每位分析师在构建回归模型时都会遇到的：\n\
  \n-   如何识别对模型结果（因变量）没有影响的变量？\n-   如何检验每个单独变量的影响？\n-   如何在模型中检验剔除或添加一个变量的效果？\n- \
  \  有没有办法筛选出所有不显著的变量，使模型中只保留显著变量？\n\n对回归系数进行的`T`检验将回答所有这些问题。\n\n回归系数`T`检验的原假设如下：\n\
  \n`H[0]`： ，这相当于说自变量（`x[i]`）的系数等于零。这也意味着变量`x[i]`对因变量`y`没有影响，你可以将其从模型中剔除。统计上的推论是，剔除`x[i]`不会影响`R`方值，并且`x[i]`每变化一个单位，`y`不会发生相应的变化。\n\
  \n`H[1]`： ，这意味着变量`x[i]`对因变量有显著影响，剔除`x[i]`会严重影响你的模型。从统计角度来看，剔除`x[i]`会导致`R`方值显著下降，并且`x[i]`每变化一个单位，`y`都会发生相应的变化。\n\
  \n为了检验上述假设，你需要计算`T`统计量，也称为`T`值。根据`T`值，你接受或拒绝原假设。换句话说，`T`值最终决定了你应在模型中保留还是剔除某个变量。`T`值是基于\
  \ beta 系数在均值为零的正态分布下计算得出的。与`F`检验类似，这里你也需要查看`T`统计量的`P`值来确定一个变量对模型的影响。\n\n如果`T`检验的`P`值小于\
  \ 5%，则拒绝原假设`H[0]`。换句话说，你拒绝了“该变量没有影响”的前提假设。这意味着该变量是有用的，它对因变量具有一定的解释力或最小影响。如果`T`检验的`P`值大于\
  \ 5%，则你没有充分的证据拒绝`H[0]`，这可能迫使你接受原假设（并最终将该变量从模型中移除）。简而言之，查看`T`检验的`P`值；如果大于 5%，那么你的变量就存在问题，可能需要剔除它。如果`P`值小于\
  \ 5%，则无需担心，可以在模型中保留该变量并继续进行分析。\n\n##### 示例：用 T 检验确定自变量的影响\n\n在智能手机销量示例中，如果你想确定每个自变量的影响，需要查看输出结果中`T`检验的`P`值。因为有五个自变量，你将得到五个`T`检验、五个`T`值和五个`P`值。在`参数估计`表中，还会有一个针对截距的`P`值，但这个值不太重要。\n\
  \n以下代码不会发生变化：\n\n```\n/* 智能手机销量示例的多元回归线 */\nproc reg data= mobiles;\nmodel sales=\
  \ Ratings Price Num_new_features Stock_market_ind Market_promo_budget;\nrun;\n```\n\
