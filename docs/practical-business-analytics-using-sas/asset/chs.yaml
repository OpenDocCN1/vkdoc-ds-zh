  \n**图 9-18.** 顾客数量为 4500 时的汉堡销量\n\n想象一条穿过核心数据的直线，并取 x 轴值为 4500 时对应的 y 轴值（图 9-19）。\n\
  \n![A978-1-4842-0043-8_9_Fig19_HTML.jpg](img/A978-1-4842-0043-8_9_Fig19_HTML.jpg)\n\
  \n**图 9-19.** 汉堡案例的直线拟合\n\n这里的技巧是拟合出最佳曲线，它能够最好地代表历史数据。这是为了将估计或预测误差降至最低所必需的。这条曲线（本例中是一条直线）可以延伸，以获得超出历史数据范围的估计值。回归分析也遵循这一步骤。\n\
  \n\n\n## 简单线性回归\n\n根据因变量 `y` 与自变量 `x` 之间的关系，你需要估算出最佳拟合。它可以是一条简单的直线，也可以是曲线，具体取决于哪种线最贴合数据。在上一节给出的汉堡示例中，简单的直线拟合就解决了问题，因为该直线似乎能以相当高的准确度来定义二者之间的关系。\n\
  \n这种在估算时仅使用一个自变量的线性回归，被称为简单线性回归。\n\n正如高中数学中通常定义的那样，直线方程为，其中 `m` 是斜率，`c` 是截距。回归分析中使用的符号略有不同，其中：\n\
  \n*   `β[1]` 是斜率。\n*   `β[0]` 是截距。\n*   `x` = 自变量（我们提供此值）\n*   `y` = 因变量（我们估算此值）\n\
  \n要将一条直线拟合到数据上，只需找到 `β[0]` 和 `β[1]` 的值即可。一旦有了这些值，就可以简单地根据给定的 `x` 值来估算 `y` 的值。例如，考虑以下回归线：当\
  \ `x` 为 10 时，`y` 的值是多少？很简单！这个方程被称为线性回归模型。对于汉堡示例，你也可以有一个类似的回归模型。\n\n### 使用最小二乘法拟合回归线\n\
  \n在回归分析中，你会尝试拟合一条最能代表数据的直线。为此，需要确定 `β[0]` 和 `β[1]` 的值，以使表示中的误差最小。截距 `β[0]` 和斜率 `β[1]`\
  \ 也被称为回归系数。\n\n以下是求回归系数的步骤：\n\n![A978-1-4842-0043-8_9_Fig20_HTML.jpg](img/A978-1-4842-0043-8_9_Fig20_HTML.jpg)\n\
  \n图 9-20\\. 实际值、预测值和误差\n\n你可以使用微积分来找到能使上述误差函数最小的斜率 `β[1]` 和截距 `β[0]` 的值。这种方法被称为最小二乘估计法，原因显而易见。无需担心，因为像\
  \ SAS 这样的软件通常会为你完成这一估算工作。想象一条穿过数据点的直线。由于它无法穿过所有点，你需要确保它几乎接近所有的点。在图 9-20 中，你可以看到实际值（用圆圈表示）和沿着直线的预测值。误差用虚线表示。最佳拟合线将是总体误差最小的那条线。一些误差为正，一些则为负，因此将误差平方后再求和以得出总误差可能是个好主意。最佳拟合线将具有最小的总值。你需要以最小化误差平方和的方式求出回归系数。\n\
  \n### Beta 系数：示例 1\n\n对于汉堡示例，自变量是访客人数，因变量是售出的汉堡数量。因此，为这些数据拟合一条直线只需要在以下直线中求出回归系数即可：\n\
  \n给定数据集，你需要运行最小二乘算法并获得回归系数值。SAS 内置了可运行该算法并给出结果的库。代码如下：\n\n```\n/*Fitting a regression\
  \ line*/\nproc reg data= burgers;\nmodel burgers=visitors;\nrun ;\n```\n\n以下是其含义：\n\
  \n*   `proc reg` 用于调用回归过程。\n*   数据集名称是 `burgers`。\n*   你需要在模型语句中提及因变量和自变量。例如，`model\
  \ y=x`。\n\n表 9-13 显示了此代码的输出。\n\n表 9-13\\. 对汉堡数据集执行 PROC REG 的输出\n\n| 读取的观测数 | 35\
