  \ |  |  | 99% |\n| 科学 |  |  |  |  |\n\n常识与能力倾向之间的相关系数为 96%；数学与科学之间的相关系数为 99%。这应该是当科学和常识变量存在时，数学和能力倾向变量变得不显著，而移除它们后却影响显著的原因。这种相互依赖的现象称为多重共线性。它不仅仅指两个变量之间的成对相关，更可能是一个自变量依赖于任意数量的其他自变量。这种多重共线性可能导致许多错误的推论和荒谬的结果。分析人员需要严肃对待多重共线性这一挑战。\n\
  \n### 多重共线性定义\n\n多重共线性是指自变量之间存在高度相互依赖关系的一种现象。当我们谈论多重共线性时，我们只针对自变量（`xi`）进行讨论。因变量\
  \ `y` 完全不在考虑范畴内。多重共线性不仅仅指一对变量与给定的自变量集合之间的关系。有时多个自变量组合起来可能与另一个自变量相关。因此，自变量集合中的任何显著关系或关联都被视为多重共线性（图\
  \ 10-8）。\n\n![A978-1-4842-0043-8_10_Fig8_HTML.jpg](img/A978-1-4842-0043-8_10_Fig8_HTML.jpg)\n\
  \n**图 10-8.** 多重共线性\n\n#### 为什么多重共线性是个问题？多重共线性的影响\n\n在前面讨论的 SAT 分数示例中，你已经看到了多重共线性可能导致的一些迹象。以下是多重共线性可能带来的一系列挑战：\n\
  \n-   我们来讨论一下 beta 系数的显著性。在一个像 `y = 3X1 + 6.5X2 - 0.3X3` 这样的模型中，每个系数代表什么？beta 系数就是在保持所有其他自变量不变的情况下，自变量每变化一个单位时因变量（`y`）的增量。在这个回归线中，`x1`\
  \ 的系数是 3；它表示在保持 `x2` 和 `x3` 不变的情况下，`x1` 每变化一个单位，`y` 增加 3 个单位。但如果存在多重共线性呢？如果 `x2`\
  \ 依赖于 `x1` 呢？在这种情况下，回归系数就失去了意义。在保持 `x2` 和 `x3` 不变的情况下，`x1` 每变化一个单位，`y` 增加 3。但如果\
  \ `x2` 依赖于 `x1`，那么保持 `x2` 和 `x3` 不变这个条件就无法成立。换句话说，`x2` 也会因为 `x1` 的变化而变化。这就是多重共线性的影响。\n\
  -   在存在多重共线性的情况下，回归模型得出的系数是不稳定的。有时系数，甚至它们的符号都可能具有误导性。在多重共线性情况下，回归系数会有很高的标准差，这意味着即使数据（观测值）发生微小变化，回归系数的变化也可能异常巨大。有时随着数据的微小变化，系数的符号可能会改变。换句话说，如果一个变量对一组数据显示出正向影响，那么随着数据的微小变化，它可能会显示出负向影响。\n\
  -   当存在多重共线性时，T 检验的结果是不可信的。你不能仅仅依据 T 检验的 P 值就决定某个自变量的影响力。\n\n让我们再次审视一下 SAT 考试的回归模型。\n\
  \n```\n/* 使用其余四个变量预测 SAT 分数：常识、能力倾向、数学和科学 */\nproc reg data=sat_score;\nmodel SAT=General_knowledge\
  \ Aptitude Mathematics Science;\nrun;\n```\n\n表 10-25 显示了这段代码的输出。\n\n**表 10-25.**\
