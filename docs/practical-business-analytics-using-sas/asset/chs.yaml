  \ 2`处截断。TS 5 是一个 2 阶 AR 过程。\n\n时间序列图 6 (图 12-21): `y[t] = 0.3y[t-1] + 0.33y[t-2]\
  \ + 0.26y[t-3] + ε[t]`\n\n![A978-1-4842-0043-8_12_Fig40_HTML.jpg](img/A978-1-4842-0043-8_12_Fig40_HTML.jpg)\n\
