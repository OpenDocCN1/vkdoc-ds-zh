  \ | 1208168642 | 100200 |\n\n### 使用 PROC SORT 去除重复项\n\n除了简单地对数据进行排序外，`proc sort`\
  \ 还可用于删除重复记录。在多种情况下，您可能需要删除重复项。想象一下一组员工的薪资记录。无论如何，您都不希望对任何单个员工多次发放薪资。使用 `proc sort`，您可以很好地删除重复记录。您在\
  \ `proc sort` 代码中使用 `nodup` 选项来删除重复记录。\n\n举例来说，您希望基于客户 ID 对某些数据进行排序，并在同一步骤中删除重复记录。下面的代码基于客户\
  \ ID 对整个数据进行排序，并在将输入数据存储到新数据集之前删除其中的重复项：\n\n```\nproc sort data=MYDATA.bill out=mydata.bill_wod\
  \ nodup;\nby cust_id   ;\nrun ;\n```\n\n以下是来自 SAS 的日志消息：\n\n```\nNOTE: There were\
  \ 31183 observations read from the data set MYDATA.BILL.\nNOTE: 19 duplicate observations\
  \ were deleted.\nNOTE: The data set MYDATA.BILL_WOD has 31164 observations and 6\
  \ variables.\nNOTE: PROCEDURE SORT used (Total process time):\nreal time       \
  \    0.06 seconds\ncpu time            0.05 seconds\n```\n\n日志消息明确指出有 19 个重复观测值，并且它们已被删除。\n\
  \n您可以看到上述代码删除了重复记录。当一个完整的观测值重复时，将使用 `nodup` 选项将其删除。如果您希望基于少数几个变量来删除记录呢？例如，假设您希望基于账单\
  \ ID 删除所有重复项。每个账单应该只有一个 ID，并且不应重复。在这种情况下，`nodup` 选项是不够的。您必须使用 `nodupkey`，以便根据键（即账单\
  \ ID）删除重复项。\n\n此代码基于账单 ID 删除重复项：\n\n```\nproc sort data=MYDATA.bill out=mydata.bill_cust_wod\
  \ nodupkey;\nby Bill_Id ;\nrun ;\n```\n\n以下是来自 SAS 的日志消息：\n\n```\nNOTE: There were\
  \ 31183 observations read from the data set MYDATA.BILL.\nNOTE: 93 observations\
  \ with duplicate key values were deleted.\nNOTE: The data set MYDATA.BILL_CUST_WOD\
  \ has 31090 observations and 6 variables.\nNOTE: PROCEDURE SORT used (Total process\
  \ time):\nreal time           0.03 seconds\ncpu time            0.04 seconds\n```\n\
  \n账单数据集中有 93 个条目具有重复的账单 ID。它们可能具有不同的账单金额。此外，它们也可能是不同的账户类型，但账单 ID 仍然相同。因此，它们将被删除。\n\
  \n\n\n#### 将重复项提取至新文件\n\n在上一节中，您已经了解了如何删除重复项。很多时候，您需要将这些重复条目放入另一个文件，并在后续分析中使用它们。`out`\
  \ 选项会生成输出文件，但不会包含重复项。您需要使用 `dupout` 选项来将重复项放入一个单独的文件。\n\n以下代码将重复条目发送至一个新文件。此代码使用了与上一节相同的示例。\n\
  \n```\nproc sort data=MYDATA.bill out=mydata.bill_wod nodup dupout=mydata.nodup_cust_id\
  \ ;\nby cust_id ;\nrun ;\nproc print data=mydata.nodup_cust_id;\nrun ;\n```\n\n\
