  \ 20%。因此，债务比率可取值在 0% 到 100% 之间。也可能略高于 100%。 | 百分比 |\n| `MonthlyIncome` | 月收入。 |\
  \ 实数 |\n| `NumberOfOpenCreditLinesAndLoans` | 未结清贷款（分期贷款，如汽车贷款或抵押贷款）和信用额度（如信用卡）的数量。\
