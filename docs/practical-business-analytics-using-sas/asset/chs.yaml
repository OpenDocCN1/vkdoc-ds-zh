  \ |\n| 误差 | 33 | 724321 | 21949 | | |\n| 校正合计 | 34 | 3028651 | | | |\n\n| 根均方误差\
  \ | 148.15238 | R 方 | 0.7608 |\n| 因变量均值 | 723.45714 | 调整 R 方 | 0.7536 |\n| 变异系数\
  \ | 20.47839 | | |\n\n**参数估计**\n| 变量 | 自由度 | 参数估计 | 标准误差 | t 值 | Pr > \\|t\\| |\n\
