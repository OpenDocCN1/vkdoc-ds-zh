  \ | 155.96875 | 调整 R 方 | 0.9909 |\n| 变异系数 | 1.98243 | | |\n\n| 参数估计 |\n| 变量 | 自由度\
  \ | 参数估计 | 标准误差 | t 值 | Pr > &#124;t&#124; |\n| 截距 | 1 | -2.28287 | 2.15568 | -1.06\
