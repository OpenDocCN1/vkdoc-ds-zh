  \ 自由度 | 参数估计 | 标准误差 | t 值 | Pr > &#124;t&#124; | 方差膨胀因子 |\n| 截距 | 1 | -804177 |\
  \ 778126 | -1.03 | 0.3061 | 0 |\n| 评分 | 1 | 648559 | 90721 | 7.15 | <.0001 | 1.25242\
