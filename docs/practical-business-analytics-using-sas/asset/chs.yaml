  \n\n\n## 汇总统计\n\n当数据集规模较大时，应选用汇总或聚合指标来描述数据。以下是可应用于数据集中每个变量的一些汇总指标：\n\n- 集中趋势：平均值是多少？\n\
  - 离散程度：特定变量的分布范围有多大？我们将在后续章节中详细讨论。\n- 其他汇总统计量，如相关系数：这将在后续章节中介绍。\n\n接下来，我们将分别介绍这些汇总统计量，并通过示例说明如何使用它们。\n\
  \n### 集中趋势\n\n回答以下问题将有助于你理解如何使用聚合指标或汇总统计量来描述数据集：\n\n- 去年的销售额是多少？\n- 从迪拜到英国的机票价格是多少？\n\
  - 你每天睡多少小时？\n- 到达办公室需要多长时间？\n\n这些问题的答案通常是平均值而非确切数字。例如，答案可能是：年均销售额为 500 万美元；平均需要\
  \ 30 分钟到达办公室，等等。这个平均值就是集中趋势的一种度量，它能反映包含多个数据点的变量的中间值。共有三种集中趋势度量。\n\n- 均值\n- 中位数\n\
  - 众数\n\n> **注意：** 所有集中趋势都是平均值。\n\n我们将分别讨论它们。\n\n#### 均值\n\n当变量为数值型时，均值就是简单的算术平均值。这是最常用的集中趋势度量。将数值的总和除以数值的个数，即可得到算术平均值。\n\
  \n例如，四个年龄分别为 24、24、27 和 25 岁的人的平均年龄是 25 岁。平均年龄是通过求和再除以个数得到的。\n\n`平均年龄 = (24 + 24\
  \ + 27 + 25) / (4) = 25`\n\n算术平均值是衡量集中趋势的一个良好指标，但它并非完美。如果数据中存在任何异常值，算术平均值可能无法指示变量的中间值。它会倾向于向异常值偏移。\n\
  \n##### 异常值效应\n\n异常值是指某个集合或列中与其他值完全不同的值。与变量列中的其他条目相比，它可能是一个异常高或异常低的值。\n\n例如，表 1\
  \ 显示了 14 名个人的月收入。\n\n**表 1.** 14 名个人的月收入\n\n| 编号 | 月收入 |\n| --- | --- |\n| 1 | 7,400\
  \ |\n| 2 | 9,800 |\n| 3 | 6,500 |\n| 4 | 9,100 |\n| 5 | 9,000 |\n| 6 | 718,900 |\n\
  | 7 | 9,400 |\n| 8 | 9,300 |\n| 9 | 7,800 |\n| 10 | 8,900 |\n| 11 | 8,600 |\n| 12\
  \ | 9,600 |\n| 13 | 10,000 |\n| 14 | 6,800 |\n\n在该数据集中，14 人中有 13 人的月收入小于或等于 10,000\
  \ 美元。然而，有一个人的收入是 718,900 美元。这不明究竟是录入错误还是特意包含的数据。这个数值与其他数值完全不同，且高得多。月收入数据中的这个特定值就是异常值。本章后续部分将讨论如何识别异常值。\n\
  \n计算上述样本的均值时，结果为 59,364 美元；而 14 人中有 13 人的收入低于 59,364 美元。只有一个人的工资高于算术平均值。集中趋势应位于数据的中点附近，因此可以确定平均值，但此例中的均值因异常值而发生了显著变化。异常值通常会将均值拉向它们，无论是高侧异常值（如本例所示）还是低侧异常值。例如，在低侧，如果表\
  \ 1 中的第 15 个条目为 1,000，那么平均值将降至 55,473 美元。图 1 显示了此示例的图表。\n\n![A978-1-4842-0043-8_6_Fig1_HTML.jpg](img/A978-1-4842-0043-8_6_Fig1_HTML.jpg)\n\
  \n**图 1.** 包含异常值的个人月收入及计算出的平均值\n\n在此，由于仅一个异常值，均值并未给出变量的真实集中趋势。当移除异常值后，会产生什么影响呢（图\
  \ 2）？\n\n![A978-1-4842-0043-8_6_Fig2_HTML.jpg](img/A978-1-4842-0043-8_6_Fig2_HTML.jpg)\n\
  \n**图 2.** 移除异常值后的月收入\n\n一旦移除异常值，新的均值，即 8,631 美元，就位于所有值的中间，代表了真正的集中趋势或平均值。这被称为截尾均值。要得到这个值，必须消除异常值，或用给定变量的第二高值替换后再进行计算。总的来说，随意改动原始数据可能并非一个明智之举。\n\
  \n现在可以得出结论，在存在异常值的情况下，均值不是一个良好的度量指标，可能需要一种不受异常值影响的不同的集中趋势度量。这种不同的集中趋势就是中位数，接下来讨论。\n\
  \n#### 中位数\n\n如前所述，异常值会影响均值，并将均值拉向它们。在这种情况下，均值无法实现其原始目的，即给出真实的集中趋势度量。而中位数正好是任何数据集的精确中点。中位数之上和之下的数据点数量是相同的。\n\
  \n为了计算中位数，需要将字段按升序或降序排列。如果数据中有`N`个观测值，当`N`为奇数时，中位数是第`((N + 1) / 2)`个观测值；当`N`为偶数时，中位数是第`N\
  \ / 2`个值与第`(N / 2 + 1)`个值的平均值。\n\n例如，一家蛋糕店每天营业 9 小时。每小时的销售额如表 2 所示。\n\n**表 2.**\
  \ 蛋糕店每小时销售额\n\n| 小时 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 |\n| --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- |\n| 销售额 | 100 美元 | 90 美元 | 250 美元 | 300 美元\
  \ | 120 美元 | 30 美元 | 700 美元 | 500 美元 | 100 美元 |\n\n要找到中位数，只需将销售额按升序排列，并注意第五个值。此例中中位数为\
  \ 120 美元（表 3）。它与排序顺序（升序或降序）无关。\n\n**表 3.** 蛋糕店示例的中位数（奇数个观测值）\n\n| 30 美元 | 90 美元\
  \ | 100 美元 | 100 美元 | 120 美元 | 250 美元 | 300 美元 | 500 美元 | 700 美元 |\n\n如果同一家店每天营业\
  \ 10 小时，并且某特定小时的最低销售额为 30 美元，那么中位数就是排序后第五和第六个记录的平均值。在此，它是 100 和 120 的平均值，即 110 美元（表\
  \ 4）。\n\n**表 4.** 蛋糕店示例的中位数（偶数个观测值）\n\n| 30 美元 | 90 美元 | 90 美元 | 100 美元 | 100 美元\
  \ | 120 美元 | 250 美元 | 300 美元 | 500 美元 | 700 美元 |\n\n\n\n###### 中位数不受离群值影响\n\n中位数不受异常值存在的影响。无论异常值大小如何，中位数都保持不变。以蛋糕店为例，假设第\
  \ 8 小时的销售额是 1,500 美元而非 500 美元（见表 6-7）。\n\n表 6-7. 含异常值的蛋糕店小时销售额\n\n| 小时 | 1 | 2 |\
  \ 3 | 4 | 5 | 6 | 7 | 8 | 9 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\
  \ --- | --- |\n| 销售额 | 100 美元 | 90 美元 | 250 美元 | 300 美元 | 120 美元 | 30 美元 | 700 美元\
  \ | 1500 美元 | 100 美元 |\n\n表 6-8 中的中位数依然相同。\n\n表 6-8. 含异常值的蛋糕店示例中位数\n\n| 30 美元 |\
  \ 90 美元 | 100 美元 | 100 美元 | 120 美元 | 250 美元 | 300 美元 | 700 美元 | 1500 美元 |\n\n中位数也不受低端异常值的影响。中位数的计算方式很简单：它选取的是记录的位置，而非实际考虑数值大小。无论数值大小如何，其位置从顶部或底部看都保持不变。\n\
  \n> **注意**  \n> 当均值接近中位数时，能否断言数据中不存在异常值？  \n> 可以。如果均值和中位数接近，可以得出结论：该变量中没有异常值。但如果中位数两侧存在相互平衡的异常值（同时有极端低值和极端高值），那么均值和中位数也可能接近。\n\
  \n#### 众数\n\n众数是在数据集中出现频率最高的数值。有时计算均值或中位数可能意义不大，尤其当某个特定值在变量中多次出现时。在这种情况下，重复出现的值很可能被引用为平均值。\n\
  \n例如，考虑一个公寓楼中的十户家庭。家庭成员数分别为 3、4、4、4、4、4、4、4、2 和 4。该公寓的平均家庭规模是多少？答案很可能是 4，因为大多数家庭由\
  \ 4 名成员组成，这就是本例中的众数。众数并不严格属于集中趋势，但它比均值（3.7）更有实际意义——家庭规模为 3.7 人是不现实的。在均值无意义的情况下，众数是一种良好的度量方式。例如城市的平均鞋码、平均贷款数、国家平均家庭规模等。正如你已经学到的，众数是给定数据集中某个变量的最频繁值。只需查看频率表，就能找到出现频率最高的众数值。\n\
  \n### 在 SAS 中计算集中趋势\n\n以下代码将帮助找到在线销售示例中的平均标价：\n\n```\nProc means data=online_sales;\n\
  var listPrice;\nrun;\n```\n\n该代码的输出结果见表 6-9。\n\n表 6-9. 对`online_sales`数据库（`listPrice`）执行`proc\
  \ means`的输出\n\n| 分析变量：listPrice |\n| --- |\n| N | 均值 | 标准差 | 最小值 | 最大值 |\n| 5129\
  \ | 11598.14 | 10583.31 | 849.0000000 | 139990.00 |\n\nSAS 默认给出均值，同时提供最小值、最大值等其他度量值的信息。以下代码仅打印均值：\n\
  \n```\nProc means data=online_sales mean;\nvar listPrice;\nrun;\n```\n\n该代码的输出结果见表\
  \ 6-10。\n\n表 6-10. `listPrice`的均值\n\n| 分析变量：listPrice |\n| --- |\n| 均值 |\n| 11598.14\
  \ |\n\n此代码计算各品牌的平均标价：\n\n```\nProc means data=online_sales mean;\nvar listPrice;\n\
  class brand;\nrun;\n```\n\n该代码的输出结果见表 6-11。\n\n表 6-11. 对`online_sales`执行`proc means`的输出（各品牌均值）\n\
  \n| 分析变量：listPrice |\n| --- |\n| 品牌 | N Obs | 均值 |\n| Acer | 1 | 8499.00 |\n| AirTyme\
  \ | 90 | 1549.00 |\n| Airtyme | 89 | 2551.10 |\n| Apple | 146 | 42854.80 |\n| Arise\
  \ | 161 | 1215.92 |\n| BlackBerr | 201 | 14374.20 |\n| Blackberr | 18 | 21221.78\
  \ |\n| Canon | 3 | 5964.67 |\n| Fujifilm | 11 | 6512.09 |\n| HTC | 469 | 16816.29\
  \ |\n| HTC | 38 | 11511.00 |\n| Huawei | 8 | 8780.25 |\n| IBall | 108 | 5491.60\
