  \n\n\n## 重要菜单选项和图标\n\n本节我们讨论一些重要的 SAS 菜单选项，例如创建、关闭和保存 SAS 程序文件，这些操作将在您日常使用 SAS 环境时经常用到。\n\
  \n要创建一个新的 SAS 程序文件，请选择：顶部菜单栏中的 **文件** ➤ **新建程序**，如图 2-17 所示。\n\n![A978-1-4842-0043-8_2_Fig17_HTML.jpg](img/A978-1-4842-0043-8_2_Fig17_HTML.jpg)\n\
  \n图 2-17. 创建新程序文件的菜单选项\n\n要打开一个已有的 SAS 程序文件，请选择：顶部菜单栏中的 **文件** ➤ **打开程序**，如图 2-18\
  \ 所示。\n\n![A978-1-4842-0043-8_2_Fig18_HTML.jpg](img/A978-1-4842-0043-8_2_Fig18_HTML.jpg)\n\
  \n图 2-18. 打开一个程序文件\n\n要保存一个 SAS 程序文件，请选择：顶部菜单栏中的 **文件** ➤ **保存** 或 **另存为**，如图 2-19\
  \ 所示。\n\n![A978-1-4842-0043-8_2_Fig19_HTML.jpg](img/A978-1-4842-0043-8_2_Fig19_HTML.jpg)\n\
  \n图 2-19. 保存一个程序文件\n\n### 视图选项\n\n有时您找不到所需的窗口，或者不小心关闭了某个窗口。您可以使用 **视图** 菜单选项将它们找回来。只需点击顶部菜单栏上的\
  \ **视图** 选项，然后打开所需的窗口，如图 2-20 所示。\n\n![A978-1-4842-0043-8_2_Fig20_HTML.jpg](img/A978-1-4842-0043-8_2_Fig20_HTML.jpg)\n\
  \n图 2-20. 视图选项\n\n### 运行菜单\n\n**运行** 菜单用于提交整个 SAS 程序或选定的部分程序，如图 2-21 所示。\n\n![A978-1-4842-0043-8_2_Fig21_HTML.jpg](img/A978-1-4842-0043-8_2_Fig21_HTML.jpg)\n\
  \n图 2-21. 提交一个 SAS 程序\n\n### 解决方案菜单\n\n**解决方案** 菜单使您可以访问各种定制的 SAS 解决方案，具体取决于您已安装的软件选项，如图\
  \ 2-22 所示。在本书中，您将只使用简单的 Base SAS 脚本；不会使用任何定制的解决方案。\n\n![A978-1-4842-0043-8_2_Fig22_HTML.jpg](img/A978-1-4842-0043-8_2_Fig22_HTML.jpg)\n\
  \n图 2-22. SAS 解决方案选项\n\n至此，您已经了解了一个简短的 SAS 打印程序以及在后续使用 SAS 进行分析时所有对您很重要的窗口。\n\n\
  ### 快捷图标\n\n图 2-23 显示了一些有用的快捷图标。\n\n![A978-1-4842-0043-8_2_Fig23_HTML.jpg](img/A978-1-4842-0043-8_2_Fig23_HTML.jpg)\n\
  \n图 2-23. 便捷的快捷图标\n\n以下是最有用的快捷方式：\n\n- **新建**：启动一个新程序\n- **打开**：打开一个已有的代码文件\n- **保存**：保存当前的代码文件\n\
  - **提交**：提交代码\n- **中断**：停止已提交的代码执行\n- **帮助**：提供关于 SAS 语法和选项的帮助\n\n## 编写和执行 SAS 程序\n\
  \n要开始编写 SAS 程序，请打开一个新的编辑器窗口。SAS 编程脚本本质上就是一系列语句。SAS 代码包含语句、表达式、函数和调用例程、选项以及格式。与其他编程语言相比，SAS\
  \ 代码易于编写。它是一种简化的编程语言，内嵌了称为 SAS 过程（预编写代码）的程序。这些过程已经在 SAS 中编写并测试完成。您只需在 SAS 脚本中的正确位置调用正确的过程。例如，如果您想求一个变量的平均值，则无需编写计算平均值的代码。只需调用\
  \ SAS 过程 `Proc Means`，它就会为您计算出平均值。SAS 程序中有一些规则和一些用户友好的特性，您应该了解。\n\n- SAS 语句以分号结束。\n\
  - SAS 语句可以在行的任何位置开始和结束。\n- 一条语句可以跨越多行。\n- 一行可以包含多条语句。\n- SAS 语句不区分大小写。\n- 空格或特殊字符分隔\
  \ SAS 语句中的“词”。\n- SAS 程序以 `run` 或 `quit` 结束，这提示 SAS 开始执行代码。\n\n以下是在 `sashelp` 库的\
  \ `prdsale` 数据集中查找 `actual`（实际销售额）变量平均值的代码：\n\n```\nproc means data =sashelp.prdsale;\n\
  var actual;\nrun ;\n```\n\n同样的代码也可以像下面这样书写（所有这些代码示例都能无错误地执行）：\n\n```\nproc means\
  \ data =sashelp.prdsale;\nvar actual;\nrun ;\n```\n\n```\nproc\nmeans data =sashelp.prdsale;\n\
  var actual;\nrun;\n```\n\n```\nproc means data =sashelp.prdsale;var actual; run\
  \ ;\n```\n\n```\nPROC MEANS Data =sashelp.prdsale;\nvar actual;\nRun ;\n```\n\n\
  在本书中，您将编写简单的 SAS 代码脚本来完成分析项目中的所有重要任务，例如导入数据、清洗数据、分析数据以及报告结果。\n\n### 代码中的注释\n\n即使您只做过一点编程，您也知道可以在代码中编写注释，用于文档说明，解释代码中涉及的逻辑或流程，或者只是为了以后提醒自己关于代码的某些内容。同样，在编写\
  \ SAS 脚本时，您也可以编写注释。与可能长达数页的传统 COBOL 或 Java 代码相比，大多数 SAS 脚本都比较短小。\n\n您可以使用两种注释风格。\n\
  \n- 一种以星号（`*`）开头，以分号（`;`）结尾。示例如下：\n\n```\n* This script does logistic regression\
  \ for the price table data;\n```\n\n- 另一种风格以斜杠星号（`/*`）开头，以星号斜杠（`*/`）结尾。示例如下：\n\n\
  ```\n/* This script does logistic regression for the price table data */\n```\n\n\
  以下是一些带有注释的示例代码。\n\n```\n*program to find the mean of actual sales;\nPROC MEANS Data\
  \ =sashelp.prdsale;\nvar actual;\nRun ;\n```\n\n上面的代码与下面的代码相同：\n\n```\n/*below program\
  \ illustrates how to write a SAS code that finds the average actual sales\nThe dataset\
  \ used here is prdsale, it is in sashelp library\nMEANS is the produce that finds\
  \ the averages\nVar statement is used to specify the variables*/\nPROC MEANS Data\
  \ =sashelp.prdsale;\nvar actual;\nRun ;\n```\n\n\n\n## 你的第一个 SAS 程序\n\n在编辑器窗口中输入以下代码。这段代码用于打印来自\
  \ `sashelp` 逻辑库的 `prdsale` 数据集。（第 3 章会讨论逻辑库。）可以将此代码中的 `sashelp.prdsale` 视为数据库中的一张表，其中\
  \ `sashelp` 是数据库，`prdsale` 是其中的一张表。\n\n```\nproc print data=sashelp.prdsale;\nrun;\n\
  ```\n\n末尾的 `run` 语句告诉 SAS 开始处理前面的语句。你可以使用提交图标，或者选择 **运行** ➤ **提交** 菜单选项。一个良好的习惯是先选中代码再执行。如果你直接提交，SAS\
  \ 系统会执行程序文件或编辑器窗口中的所有代码。执行此代码后，你将在输出文件和日志文件中看到一些信息。在本例中，日志文件显示没有错误，输出屏幕显示 `prdsale`\
  \ 表（数据集）中的数据值，如下表 2-1 所示。\n\n**表 2-1.** `prdsale` 表中的数据值\n\n| Obs | ACTUAL | PREDICT\
  \ | COUNTRY | REGION | DIVISION | PRODTYPE | PRODUCT | QUARTER | YEAR | MONTH |\n\
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | $925.00\
  \ | $850.00 | CANADA | EAST | EDUCATION | FURNITURE | SOFA | 1 | 1993 | Jan |\n\
  | 2 | $999.00 | $297.00 | CANADA | EAST | EDUCATION | FURNITURE | SOFA | 1 | 1993\
  \ | Feb |\n| 3 | $608.00 | $846.00 | CANADA | EAST | EDUCATION | FURNITURE | SOFA\
  \ | 1 | 1993 | Mar |\n| 4 | $642.00 | $533.00 | CANADA | EAST | EDUCATION | FURNITURE\
  \ | SOFA | 2 | 1993 | Apr |\n| 5 | $656.00 | $646.00 | CANADA | EAST | EDUCATION\
  \ | FURNITURE | SOFA | 2 | 1993 | May |\n| 6 | $948.00 | $486.00 | CANADA | EAST\
  \ | EDUCATION | FURNITURE | SOFA | 2 | 1993 | Jun |\n| 7 | $612.00 | $717.00 | CANADA\
  \ | EAST | EDUCATION | FURNITURE | SOFA | 3 | 1993 | Jul |\n| 8 | $114.00 | $564.00\
