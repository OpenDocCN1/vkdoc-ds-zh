  \ | Technology | 29.4 | 1414 | 1583.68 | 23.52 |\n\n\n\n### 保留与删除变量\n\n有时你可能不需要原始数据集中的所有变量。在少数情况下，你可能希望保留一些重要变量，并删除那些与分析无关的变量。例如，你可能只想从原始数据集的\
  \ 200 个变量列表中保留 10 个重要变量。这个“保留与删除”的 SAS 结构语法如下：\n\n**保留的语法**\n\n```\ndata new_data;\n\
  set old_data(Keep=Var1 Var2 Var3);\n<其他语句>\nrun;\n```\n\n**删除的语法**\n\n```\ndata\
  \ new_data;\nset old_data(Drop=Var5 Var6 Var7);\n<其他语句>\nrun;\n```\n\n在第一个示例中，你从市场数据中创建一个新数据集；只保留活动\
