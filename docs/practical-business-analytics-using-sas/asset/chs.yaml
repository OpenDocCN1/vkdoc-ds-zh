  ### 数据集的数据部分\n\n在 SAS 中处理数据集的数据部分，幸运的是相当简单。如前所述，SAS 数据集中的数据部分包含数据行（更恰当地说是观测值或记录）和数据行，以及列（称为变量）。您可以使用\
  \ SAS 的 `print` 过程 (`PROC PRINT`) 来查看数据集。以下是打印 `sashelp.air` 数据集前十个观测值的 SAS 代码：\n\
