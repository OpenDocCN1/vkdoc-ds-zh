  \ | Mobiles |\n\n表 6-1 中的数据仅属于客户下的少数手机订单。\n\n现在我们讨论 SAS 打印过程中的一些有用选项。以下是通用代码及其解释：\n\
  \n```\nproc print data=<<数据集>> label noobs heading=vertical;\nvar <<变量列表>>;\nby\
  \ var1; run ;\n```\n\n- `Label`：此选项将变量标签（而非变量名）打印为列标题。\n- `Noobs`：此选项从输出中移除 `OBS`\
  \ 列。\n- `Heading=vertical`：此选项垂直打印列标题。当名称较长但变量值较短时，此选项很有用。\n- `By`：`by` 语句按指定变量的值对输出进行分组。\n\
  \n我们来看一个示例。以下代码基于 `listPrice` 对数据进行排序：\n\n```\nProc sort data=online_sales ;\nby\
  \ listPrice  ;\nrun;\n```\n\n你可以使用 `descending` 选项从高价到低价排序。SAS 默认按升序排序。\n\n```\n\
