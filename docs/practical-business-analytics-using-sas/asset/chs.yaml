  \n\n\n### 连续变量\n\n以下是连续变量：\n\n- `Actual`（实际销售额）\n- `Predicted`（预测销售额）\n\n这两个变量是连续的，因为它们可以取任何实数值。例如，样本值可以是\
  \ 200 美元、201 美元或 201.5 美元。\n\n### 数值型离散变量\n\n以下是数值型离散变量：\n\n- `QUARTER`\n- `YEAR`\n\
  \n这些变量只能取一组值。`Quarter`可以取 1 或 2；不能等于 1.5。因此它是一个离散变量。`Year`也是一个离散变量。\n\n### 分类变量\n\
  \n以下是分类变量：\n\n- `COUNTRY`\n- `REGION`\n- `DIVISION`\n- `PRODTYPE`\n- `PRODUCT`\n\
  \n这些是非数值型变量。\n\n### 自变量与因变量\n\n哪些是自变量？哪些是因变量？`Actual`和`Predicted`销售额是结果或因变量。自变量构成列表的其余部分。这里的销售额取决于国家、地区、产品、月份、年份、季度等。这些都是自变量。\n\
  \n### 计算参数（总体平均实际销售额）\n\n```\nproc means data=sashelp.prdsale ;\nvar actual;\nrun\
  \ ;\n```\n\n`Means`是一个 SAS 过程名。在此示例中，我们指定变量名为`actual`。`PROC MEANS`过程将对该变量进行操作以计算平均值。\n\
  \n表 5-7 列出了此代码的输出。\n\n**表 5-7. `PROC MEANS`在`prdsale`上的结果**\n\n| 分析变量：ACTUAL 实际销售额\
  \ |\n| --- |\n| N | 均值 | 标准差 | 最小值 | 最大值 |\n| 1440 | 507.1784722 | 287.0313065 |\
  \ 3.0000000 | 1000.00 |\n\n总体平均销售额为 507.17。有关平均值的详细信息将在本章后面介绍。\n\n### 计算统计量（样本平均实际销售额）\n\
  \n```\nproc means data=prod_sample_30 ;\nvar actual;\nrun ;\n```\n\n此代码的输出列在表 5-8\
  \ 中。\n\n**表 5-8. 在`prod_sample_30`上的均值和标准差；变量 = actual**\n\n| MEANS 过程 |\n| ---\
  \ |\n| 分析变量：ACTUAL 实际销售额 |\n| N | 均值 | 标准差 | 最小值 | 最大值 |\n| 30 | 451.8000000 | 286.8939970\
  \ | 33.0000000 | 956.0000000 |\n\n样本平均销售额为 451.8。\n\n### 统计量与参数的接近程度如何？这是否是一个好的估计？\n\
  \n- 统计量与参数并不非常接近。样本平均销售额并不能真正代表总体平均销售额。\n- 参数与统计量之间几乎有 11%的差异。\n- 增加样本量可能有助于获得良好的估计。将样本量增加到\
  \ 100 可能是更好的选择。\n- 以下 SAS 代码从`prdsale`数据集中抽取大小为 100 的样本，然后计算均值。\n\n```\n/* Simple\
  \ Random Sample; Size is 100 */\nproc surveyselect data = sashelp.prdsale\nmethod\
  \ = SRS\nrep = 1\nsampsize = 100 seed = 12345 out = prod_sample_100;\nid _all_;\n\
  run ;\n\nproc means data=prod_sample_100 ;\nvar actual;\nrun ;\n```\n\n表 5-9 列出了用于计算变量`actual`均值和标准差的\
  \ SAS 代码的输出。\n\n**表 5-9. 在`prod_sample_100`上的均值和标准差；变量 = actual**\n\n| 分析变量：实际销售额\
  \ |\n| --- |\n| N | 均值 | 标准差 | 最小值 | 最大值 |\n| 100 | 527.7000000 | 297.0428837 |\
  \ 25.0000000 | 988.0000000 |\n\n平均销售额估计值（统计量）看起来更接近总体销售额。新差异小于 5%。\n\n## 统计分析方法\n\
  \n统计分析方法有三种：描述性统计、推断性统计和预测性统计。在描述性统计方法中，只是使用统计集中趋势和变异对数据进行简单汇总。在推断性统计中，从总体中抽取样本以对整个数据集或总体进行推断。预测性统计，如预期那样，可以使用线性回归和逻辑回归等方法预测因变量。这些术语中的一些目前可能看起来陌生，但它们将在接下来的章节中详细解释。\n\
  \n### 描述性统计\n\n描述性统计是呈现数据集总体概况的正确解决方案。这些方法表示汇总，提供了关于给定总体的合理画面。从数据分析中获得的业务洞察将以表格和图表的形式呈现。描述性统计的输出可能有助于得出有用的推断，但这种输出本身并不是推断。\n\
  \n这是一个销售示例。对一年的销售数据应用描述性统计，可能包括过去 12 个月的平均销售额、过去 12 个月的最高和最低销售额等。业务专家可以根据此分析推断其业务绩效。\n\
  \n以下是描述性统计的重要衡量指标或结果：\n\n- 集中趋势度量：均值、中位数、众数和中点值\n- 变异度量：极差、方差、标准差、z 分数\n\n下一章将更详细地研究这些术语。\n\
  \n### 推断性统计\n\n你现在知道，由于各种限制，每次分析整个总体并不总是容易的。因此，分析有代表性的样本并对整个总体进行推断是更好的选择。如果操作得当，这大多数时候是正确的决定。但由于只分析了部分数据，基于整个数据集进行推断时，样本量和误差等因素变得非常重要。\n\
  \n- 示例 1：一台装瓶机应在每个瓶子中灌装 300 毫升软饮料。每天的总量是几千瓶。你抽取了 400 个瓶子的代表性样本，发现样本均值为 300.5 毫升。这台机器运行正常吗？\n\
  - 示例 2：在 300 个笔记本购买者的样本中，有两人报告了屏幕问题。这是否值得关注？基于此，你能对至少大约 10,000 的总体屏幕质量得出结论吗？\n\n\
  ### 预测性统计\n\n预测性统计是基于历史事件预测未来结果的科学。预测建模或模型构建就像通过后视镜开车，期望前方的道路与已经走过的道路相同。预测性统计试图通过使用自变量或预测变量的组合来预测因变量或结果。需要将历史数据建立为`Y`（因变量）和`X_i`（自变量）之间的数学方程。\n\
  \n可以使用多种技术来构建预测模型。回归、逻辑回归和时间序列分析是很好的代表性示例。使用预测性统计的一个经典例子是银行构建信用风险模型，以决定是否向个人提供贷款。\n\
  \n## 使用统计分析解决问题\n\n本节讨论统计数据分析（也称为业务分析问题解决）的主要步骤。\n\n### 设定业务目标与规划\n\n任何数据分析问题都始于业务目标。我为什么要做这个分析？哪些在范围内，哪些不在？我是否有足够的专业知识来执行分析？有哪些挑战？我如何实施结果？是否所有相关数据都可用？如果可用，数据是否可靠？存在许多此类问题。\n\
  \n范围和分析设计或方法此过程的主要成果。\n\n\n\n### 数据准备  \n\n确定目标和范围后，可以收集分析所需的数据。这些数据在格式、质量或完整性上可能并非完美无缺，适合直接分析。数据集中难免存在一些缺失值、异常值及其他噪音因素。开展基础数据探索、验证其准确性与一致性、并识别所有问题，是构建模型的重要任务。所有问题都必须在进行分析前解决。主要步骤如下：\
  \  \n\n- 收集数据  \n- 探索数据  \n- 验证数据  \n- 清洗数据  \n\n### 描述性分析与可视化  \n\n在构建模型之前，理解数据并获取洞察是至关重要的任务。同样需要理解每个变量及其相互关系。主要步骤如下：\
  \  \n\n- 可视化数据并获得简单洞察  \n- 执行简单的描述性统计  \n- 对每个变量执行单变量分析  \n- 必要时创建衍生变量和指标  \n- 找出变量间的相关性\
  \  \n\n### 预测建模  \n\n此步骤涉及构建模型以实现预定目标。你需要确定最合适的分析技术，识别因变量，并删除任何冗余项。最后一步是构建最佳拟合模型。有时需要进行模型迭代。解释模型有助于识别影响最大的预测变量。以下几点总结了此步骤：\
  \  \n\n- 确定建模技术  \n- 构建预测模型  \n- 迭代模型并找到最佳拟合  \n- 解释模型  \n\n### 模型验证  \n\n在此步骤中需要回答以下问题：你刚刚构建的模型效果如何？它是否仅在使用来构建该模型的样本数据上表现良好？是否能获取一个相似但不同的样本来测试模型的准确性？模型在预测准确性方面的稳健性如何？请理解与此步骤相关的以下术语：\
  \  \n\n- **及时验证**：这涉及从相似时间段内抽取一个与开发样本（development sample）外观相同的样本。有时，及时样本（in-time\
  \ sample）占分析所考虑全部记录的 20%到 30%，其余部分用于模型构建。使用及时样本进行的验证称为及时验证。  \n- **非及时验证**：此方法从不同时间段抽取样本用于模型验证。有时，模型仅在开发样本和及时验证样本上表现完美。使用来自不同时间段的样本进行交叉验证，有助于检验模型的真实稳健性。\
  \  \n\n### 模型实施  \n\n当模型通过所有验证测试后，它便准备就绪。现在可以将其用于其为之构建的业务目标。该模型可以实施并集成到生产系统中，在实际业务环境中进行试运行。最后，需要将其文档化并移交给最终用户。\
  \  \n\n图 5-1 展示了模型构建中使用的所有步骤。本书将涉及其中大部分步骤。  \n\n![A978-1-4842-0043-8_5_Fig1_HTML.jpg](img/A978-1-4842-0043-8_5_Fig1_HTML.jpg)\
  \  \n\n**图 5-1.** 模型构建中使用的步骤  \n\n## 来自现实世界的示例：信用风险生命周期  \n\n考虑一个信用风险模型构建的示例。每家银行都希望分析向申请人提供贷款或批准信用卡的风险有多大。批准或拒绝通常基于一个预测模型，该模型可能包含从\
  \ 400 个自变量中筛选出的 15 到 20 个变量。以下是构建信用风险模型的基本步骤。  \n\n### 业务目标与规划  \n\n目标是预测每位潜在申请人的风险因素。确定投资组合规模、制定增长计划以及模拟竞争和商业环境可以是其他目标。此阶段也可以制定详细的项目管理计划。\
  \  \n\n### 数据准备  \n\n所需数据是从银行掌握的客户历史记录、内部应用程序、面向客户的零售应用程序或任何其他联合数据仓库中收集的。来自这些多个来源的数据可能具有异构的数据格式，因此数据清洗和转换是必不可少的。此阶段将执行异常值修正、缺失值处理以及其他数据清洗步骤。如果需要，还会创建虚拟变量或衍生变量。\
  \  \n\n### 描述性分析与可视化  \n\n确定表现窗口（performance window），该窗口指明应考虑多少历史数据用于分析。此类分析的常见表现窗口是\
  \ 12 个月。在此阶段，需要定义将在后续模型构建中使用的“好账户”和“坏账户”。分析师必须决定是否需要对总体人群进行细分。如果需要，还需要识别出细分变量。 \
  \ \n\n此步骤将识别对违约概率影响最大的最关键因素。例如，比较当前贷款数量与年龄，确定这两个因素中哪一个将是决定信用风险的最关键因素。  \n\n### 预测建模\
  \  \n\n预测建模步骤涉及构建一个逻辑回归模型，该模型将使用最终确定的因变量列表给出违约概率。构建此模型将在后续章节中详细讨论。通常，此阶段会构建三到四个不同的模型，并选择误差最小的最佳模型。\
  \  \n\n### 模型验证  \n\n模型在使用构建样本之外的数据上表现如何？卡方统计量、KS 统计量和等级排序等统计指标用于验证模型性能。KS 值表示模型区分好账户与坏账户的能力，而\
  \ PSI 值则让你了解当前总体（实际生产数据）与开发样本之间的相似程度。  \n\n- **KS 检验**：KS 代表 Kolmogorov-Smirnov（柯尔莫哥洛夫-斯米尔诺夫）。该检验用于确定模型是否能有效地区分好账户与坏账户。KS\
  \ 值越高，模型越好。  \n- **PSI**：PSI 代表群体稳定性指数。银行必须确保当前将要应用信用评分模型的群体与开发时的群体相同。如果群体发生剧烈变化，评分卡（模型）可能不再有效。\
  \  \n\n### 模型实施  \n\n最后一步是开始使用信用风险模型，该模型会将风险转化为分数。在此阶段，模型被移交给 IT 开发人员实施。每当提交新的信用卡申请时，配备此模型的系统将自动计算信用评分。银行前台工作人员将根据此信用评分批准或拒绝申请。\
  \  \n\n## 结论  \n\n本章定义了一些基本的统计术语，这些术语在所有后续章节中都很有用。它还介绍了解决商业分析问题所遵循的基本步骤，并通过一个真实的银行场景进行了说明。接下来的几章将讨论描述性统计，接着是数据准备和预测建模。**图\
  \ 5-1**中提到的所有步骤将连同其术语一起讨论，这些术语在此阶段可能看起来有些陌生。\n\n\n"
- "# 6. SAS 中的基本描述性统计与报告\n\n统计分析数据的第一步是定义业务目标，这决定了项目的需求。这一步需要进行一些初步规划。一旦以所需格式收集到数据，下一步就是探索数据。\n\
  \n在现阶段，原始数据集是唯一可用的资源。下一步是基本了解数据情况。如果数据集过大，可以仅打印前几条记录。随后，业务分析师必须将数据可视化，突出异常值，识别注意事项，在数据中发现有趣的模式，或构建能够帮助预测结果（该结果在现阶段仍未知）的预测模型。\n\
  \n本章将讨论基本描述性统计的步骤，这些步骤有助于数据探索和数据清洗操作（这是下一章的主题）。\n\n如前所述，基本描述性统计能提供手头数据集的整体概况。这幅“概况图”的要素将在本章后续部分讨论。高级统计建模技术（即对数据的推断和预测）相关主题则会在后续几章中介绍。\n\
  \n## 数据分析的初级形式\n\n为了对数据有一个直观感受，并不总是需要复杂的统计分析。有时，一些简单的技术，例如打印数据集的前几行或目视检查屏幕，就能达到目的。事实上，在对数据进行任何分析之前，我们强烈建议你先检查前几行，以便对数据有个初步印象。\n\
  \n### 直接打印数据\n\n简单地目视检查手头的数据就能获得大量信息，帮助你理解数据。如果数据集较小，可以直接打印；但如果数据集很大，建议只打印少数几行（例如\
  \ 1 到 100 行）。有时简单的排序会有所帮助。如果你有大量列或变量，则应只打印需要仔细检查的重要变量。\n\n前一章的前几页展示了一个大数据集的快照，其中显示了\
  \ 2009 年和 2010 年能用上电的人口比例统计数据。回想一下，我们讨论了该数据集上的一些简单观察结果，这些结果有助于你对整个数据集建立直观感受。\n\n\
  ### SAS 中的打印功能及各种选项\n\nSAS 为任何类型的数据集都提供了易于使用的打印选项。你可以打印所有变量，或选择打印几个重要的变量。我们将通过一个示例来讨论\
  \ SAS 的打印过程及其选项。\n\n以下代码输出来自一个在线商店在一个月内产生的某些数据的快照：\n\n```\nProc print data = online_sales\
  \ (obs= 20 );\nrun;\n```\n\n表 6-1 列出了此代码的输出，以下是对 `online_sales` 数据集中所包含变量的解释：\n\n\
