  \n图 9-21\\. 汉堡销售示例的回归线\n\n我们构建了一条回归线，并利用该模型给出了预测。但是，我们如何确保我们的回归模型是正确的且估计值是可信的呢？我们如何定义模型拟合优度？下一节将回答这个问题。\n\
  \n### 我的模型有多好？\n\n你刚刚为汉堡示例构建的回归线，在给定访客数的情况下，能给出相当不错的汉堡销量估计值。但它仍然可能受到质疑。也许有人会提出另一个模型，并声称他们的估计值更好。她可能会提出一条截距为\
  \ 23、斜率为 0.5 的新直线。在这种情况下，应该如何为当前模型辩护？换句话说，如何量化给定模型的准确度？如何计算估计中的误差？我们将通过一个示例来解释这一点。\n\
  \n表 9-14 显示了数据中的一些观测值。\n\n表 9-14\\. 实际访客数与售出汉堡数对比快照\n\n| 访客数 | 汉堡数 |\n| --- | ---\
  \ |\n| 3268 | 373 |\n| 2299 | 371 |\n| 2566 | 363 |\n| 1759 | 335 |\n| 3440 | 720\
  \ |\n\n表 9-14 中的汉堡数是基于历史数据的实际售出汉堡数。现在，你使用上一节构建的回归模型计算相同的值，并将这些值列在“汉堡数（预测）”列中。一个好的模型应该给出接近实际值的估计值（见表\
  \ 9-15）。\n\n表 9-15\\. 售出汉堡数的预测值与实际值\n\n| 访客数 | 汉堡数（实际值） | 汉堡数（预测值） |\n| --- | ---\
  \ | --- |\n| 3268 | 373 | 656 |\n| 2299 | 371 | 477 |\n| 2566 | 363 | 526 |\n| 1759\
  \ | 335 | 377 |\n| 3440 | 720 | 688 |\n\n在接下来的章节中，你将着手估算预测值与实际值之间的误差。\n\n\n\n####\
  \ 误差平方和 (SSE)\n\n一个完美的模型能确保估计值或预测值与实际值几乎一致。即便不完全相同，至少也应非常接近。因此，实际值（记为`y`）与预测值（记为`ŷ`）之间的差异在任何数据点上都应微不足道。由于这些误差在本质上可能为正或为负，你可以通过平方并求和来得到一个汇总值。对于一个模型来说，这个汇总值（换句话说，就是实际值与预测值之间偏差的平方和）应尽可能小，才能被归类为优秀模型。`y[i]`是`y`的实际值，而`y^[i]`是`y`的预测值或估计值。\n\
  \n如果你想比较两个基于同一数据集构建的模型，那么 SSE 较小的那个模型显然会被认为更好。\n\n没有专门的代码来生成 SSE 值；默认情况下，回归代码会在输出中显示\
  \ SSE。\n\n```\n/*拟合回归线*/\nproc reg data= burgers;\nmodel  burgers=visitors;\nrun;\n\
  ```\n\n在输出结果（如表 9-16 所示）中，你可以在分析方差表时读取误差平方和。\n\n**表 9-16.** 汉堡数据集上 `PROC REG` 的输出结果\n\
  \n| 读取的观测数 | 35 |\n| 使用的观测数 | 35 |\n\n**方差分析**\n\n| 来源 | 自由度 | 平方和 | 均方 | F 值 |\
  \ Pr > F |\n| --- | --- | --- | --- | --- | --- |\n| 模型 | 1 | 2304330 | 2304330\
  \ | 104.99 | <.0001 |\n| 误差 | 33 | 724321 | 21949 |  |  |\n| 校正合计 | 34 | 3028651\
  \ |  |  |  |\n\n| 均方根误差 | 148.15238 | R 平方 | 0.7608 |\n| 因变量均值 | 723.45714 | 调整\
  \ R 平方 | 0.7536 |\n| 变异系数 | 20.47839 |  |  |\n\n**参数估计**\n\n| 变量 | 自由度 | 参数估计值 |\
  \ 标准误差 | t 值 | Pr > &#124;t&#124; |\n| --- | --- | --- | --- | --- | --- |\n| 截距\
  \ | 1 | 50.85364 | 70.25853 | 0.72 | 0.4743 |\n| 访客数 | 1 | 0.18527 | 0.01808 | 10.25\
  \ | <.0001 |\n\n对于你构建的模型，误差平方和为 724,321。\n\n#### 总平方和\n\n仅凭误差平方和不足以判断模型的拟合优度。孤立地观察\
  \ SSE 存在一个小挑战。SSE 的局限性是什么？你知道它应该接近于零。但如果 SSE 大于零呢？多大才算太大？如果模型中因变量的值达到数千，SSE 甚至可能达到数万。如果因变量的值是小数值（小于\
  \ 1），那么 SSE 自然会较小。在这些条件下，如何基于 SSE 来解释模型的拟合度？你需要结合`y`的总变异来考虑 SSE，以确定确切的误差百分比。衡量`y`的方差或`y`的总平方和的方法如下：\n\
  \n其中`ȳ`是`y`的均值，`y`的方差（SST）无非就是`y`与其均值之差的平方。因此，`SSE / SST`是衡量模型精度的良好指标。我们可以称之为`y`中未解释方差的比例。那么，`y`中被解释的方差比例又是多少呢？这将在下一节中解释。\n\
  \n#### 回归平方和\n\n所以，我们试图用自变量来解释因变量（`y`）的总方差。由于我们无法拟合完美的模型，或者说数据没有完美的拟合，我们选择了一条带有一些误差的直线。因此，能最佳拟合给定信息的最佳模型会拥有很小的误差百分比。本节提供了另一种看待这个问题的方式。\n\
  \n`y`的总方差是误差平方和（即未解释的方差）与回归模型平方和（即成功解释的方差）之和。\n\n总平方和 = 误差平方和 + 回归平方和\n\n`SST =\
  \ SSE + SSR`\n\n总方差 = 未解释的方差 + 已解释的方差\n\nSST、SSE 和 SSR 如图 9-22 所示。\n\n因此，要获得更高的估计精度，你需要更小的误差，或者需要更大的回归平方和，或者你需要误差平方和接近于零，而回归平方和接近于总平方和。\n\
  \n所以，对于最佳模型而言，`SSE / SST`的值应接近于零，而`SSR / SST`的值应接近于 1。比率`SSR / SST`被称为决定系数或 R 平方，记为`R²`。\n\
  \n![A978-1-4842-0043-8_9_Fig22_HTML.jpg](img/A978-1-4842-0043-8_9_Fig22_HTML.jpg)\n\
  \n**图 9-22.** 表示 SSE、SST 和 SSR 的图\n\n#### 决定系数 R 平方\n\nR 平方是一种拟合优度或精度度量。R 平方越高，模型越好。因此，决定系数无非就是已解释变异与（因变量的）总变异之比。\n\
  \n##### R 平方的限制\n\n如果你不完全理解之前解释的误差方程，不必过于担心。所有这些计算都由软件完成。如果你理解了下面给出的 R 平方的意义，对于实际应用来说可能就足够了。\n\
  \n你可以从 R 平方的定义中看出，当模型完全不能解释因变量的任何变异时，R 平方的值最小可以为 0，而最大值可以如下：\n\nR 平方值为 0.8 表明，使用该模型，我们可以解释因变量（`y`）80%的方差。因此，一个模型要成为优秀模型，就需要尽可能多地解释`y`的方差。如果你在比较两个模型并想决定哪个是最好的模型，那么\
  \ R 平方值较高的那个是更好的模型。一般的行业规范是要求 R 平方至少达到 80%，但这可能因数据的可用性和模型的复杂度而异。较低的 R 平方值表明`y`中的部分（而非全部）变异得到了解释。如果\
  \ R 平方接近于 1，那么你可以看到`y`中的大部分变异都是由`x`解释的。接下来给出的三个图（图 9-23、9-24 和 9-25）展示了三种不同实际场景下的\
  \ R 平方值。\n\n![A978-1-4842-0043-8_9_Fig25_HTML.jpg](img/A978-1-4842-0043-8_9_Fig25_HTML.jpg)\n\
  \n**图 9-25.** 笔记本电脑销量对洗发水销量回归线的 R 平方\n\n![A978-1-4842-0043-8_9_Fig24_HTML.jpg](img/A978-1-4842-0043-8_9_Fig24_HTML.jpg)\n\
  \n**图 9-24.** 支出对收入回归线的 R 平方\n\n![A978-1-4842-0043-8_9_Fig23_HTML.jpg](img/A978-1-4842-0043-8_9_Fig23_HTML.jpg)\n\
  \n**图 9-23.** 成绩对学习时长回归模型的 R 平方\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将以下英文文本翻译成中文。\n\
