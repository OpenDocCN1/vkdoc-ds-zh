  \n预算与响应之间的相关性为 43.6%，表明关联性较弱。\n\n从之前进行的相关性分析可以得出结论：增加在线营销活动的预算可能是个好主意，因为它们能带来更多的响应。在线营销活动中，响应与广告支出之间存在很强的相关性。而在广告牌营销活动中，预算支出与响应之间呈现弱相关性，因此在此类活动中增加额外支出可能并不可取。\n\
  \n### 相关性的界限与关联强度\n\n`x`与`x`之间的相关性是多少？你可以使用之前讨论过的相关性公式来求解。\n\n因此，`x`与`x`之间的相关性，或者说相关性的最大值，是\
  \ 1。类似地，你可以证明`x`与`-x`（`x`的相反数）之间的相关性是-1。综上所述，相关性的极端值为-1 和+1。\n\n两个变量之间的完全正相关性将达到+1，而完全负相关性的相关系数值则为-1。\n\
  \n以下可作为经验法则：\n\n- 如果相关性为 0，则两个变量之间不存在线性关联。\n- 如果相关性在 0 到 0.25 之间，则存在可忽略的正关联。\n-\
  \ 如果相关性在 0.25 到 0.5 之间，则存在弱的正关联。\n- 如果相关性在 0.5 到 0.75 之间，则存在中等程度的正关联。\n- 如果相关性在\
  \ 0.75 到 1 之间，则存在强的正关联。\n\n图 9-3 展示了两个变量之间的散点图示例。\n\n![A978-1-4842-0043-8_9_Fig3a_HTML.jpg](img/A978-1-4842-0043-8_9_Fig3a_HTML.jpg)![A978-1-4842-0043-8_9_Fig3b_HTML.jpg](img/A978-1-4842-0043-8_9_Fig3b_HTML.jpg)![A978-1-4842-0043-8_9_Fig3c_HTML.jpg](img/A978-1-4842-0043-8_9_Fig3c_HTML.jpg)![A978-1-4842-0043-8_9_Fig3d_HTML.jpg](img/A978-1-4842-0043-8_9_Fig3d_HTML.jpg)![A978-1-4842-0043-8_9_Fig3e_HTML.jpg](img/A978-1-4842-0043-8_9_Fig3e_HTML.jpg)![A978-1-4842-0043-8_9_Fig3f_HTML.jpg](img/A978-1-4842-0043-8_9_Fig3f_HTML.jpg)\n\
  \n**图 9-3.** 不同相关系数值对应的散点图示例\n\n以下是针对负相关系数值的经验法则：\n\n- 如果相关性为 0，则两个变量之间不存在线性关联。\n\
  - 如果相关性在 0 到-0.25 之间，则存在不显著的负关联。\n- 如果相关性在-0.25 到-0.5 之间，则存在弱的负关联。\n- 如果相关性在-0.5\
