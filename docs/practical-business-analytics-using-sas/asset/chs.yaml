  \ | `x1=int(543.210);` |\n\n### 字符函数\n\n字符或字符串函数用于处理文本变量。以下各节将介绍一些常用的字符函数。\n\n\n\
  \n#### 子字符串\n\n`SUBSTR`函数用于提取字符串变量的一部分。当你只想使用变量的前四个或五个字符时，`SUBSTR`函数可以完成这项工作。\n\n\
  以下是`SUBSTR`函数的语法：\n\n`New variable= SUBSTR(variable, start character, number of\
  \ characters)`\n\n在下面的例子中，你只提取了市场活动名称（`market_asset`数据集中的`name`变量）的前十个字符，并将其存储在新变量`name_part1`中。之后，你提取了接下来的十个字符，并将其存储在变量`name_part2`中。\n\
  \n以下代码不言自明：\n\n```\ndata market_asset_v4;\nset market_asset;\nname_part1=substr(name,\
  \ 1, 10); /* Substring first 10 characters */\nname_part2=substr(name, 11, 10);\
  \ /* Substring characters from 11 to 20 */\nrun;\nproc print data=market_asset_v4(obs=10)\
  \ noobs;\nrun;\n```\n\n表 4-6 列出了新数据集的快照，其末尾新增了两列字符串列。\n\n**表 4-6.** 市场活动数据快照（末尾新增两列字符串列）\n\
