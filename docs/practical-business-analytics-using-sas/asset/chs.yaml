  \n\n\n### 第 2 步：使用数据快照进行数据探索与验证\n\n`PROC CONTENTS` 数据提供了观测值和变量的概览。下一步是检查每个变量中的值。如前所述，打印整个数据集并不实际；只需打印数据的一个快照。快照是数据的一小部分。它可以是随机的\
  \ 100 条观测值、前 30 条观测值或后 50 条观测值。快照的大小没有规定。基本上，它不过是带有限制条件的数据打印。\n\n**警告**  \n打印数据时要小心；切勿尝试打印大型数据集。计算机系统和软件可能会卡住，重启可能是使其恢复的唯一选择。\n\
