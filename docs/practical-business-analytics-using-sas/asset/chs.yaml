- "# 5. 统计分析简介\n\n本章及后续章节将深入探讨商业分析技术的细节。前一章已经确定，统计学构成了这门艺术的主要部分。本章将从统计学的基本定义开始。它还将介绍一些用于获取数据集的网站，你可以在示例中使用这些数据。到本章末尾，你将能够理解以下对进行商业分析至关重要的概念：\n\
  \n- 总体与样本的区别\n- 不同类型的抽样方法\n- 变量与参数的区别\n- 描述性统计、推断性统计和预测性统计之间的差异\n- 解决商业分析问题所涉及的步骤\n\
  - 一个完整的商业分析示例\n\n## 什么是统计学？\n\n统计学可以简单地定义为收集、整理、总结和分析信息的科学。统计学是我们日常生活的重要组成部分。例如，电视上经常播放的运动员职业生涯总结，就是对该运动员职业生涯数据的统计概括。我们遇到的这类信息中有很大一部分以数字为主。以下是一些例子：\n\
  \n- 人口普查统计数据（`www.census.gov/`）\n- 世界银行统计数据（`http://data.worldbank.org/`）\n- 板球比赛统计数据（`www.espncricinfo.com/ci/content/stats/index.html`）\n\
  - 股市统计数据（`http://finance.yahoo.com/`）\n\n表 5-1 显示了 2009 年和 2010 年全球人口中能够使用电力的百分比统计数据。这只是世界银行数据页面（`http://data.worldbank.org`）上完整表格的一个快照。\n\
  \n**表 5-1.** 能够使用电力的人口百分比统计数据\n\n| 国家名称 | 国家代码 | 2009 年百分比 | 2010 年百分比 |\n| ---\
  \ | --- | --- | --- |\n| 阿拉伯联合酋长国 | ARE | 100.0 | 100.0 |\n| 科威特 | KWT | 100.0 |\
  \ 100.0 |\n| 新加坡 | SGP | 100.0 | 100.0 |\n| 黎巴嫩 | LBN | 99.9 | 99.9 |\n| 利比亚 | LBY\
  \ | 99.8 | 99.8 |\n| 文莱达鲁萨兰国 | BRN | 99.7 | 99.7 |\n| 中国 | CHN | 99.4 | 99.7 |\n\
  | 以色列 | ISR | 99.7 | 99.7 |\n| 阿拉伯埃及共和国 | EGY | 99.6 | 99.6 |\n| 突尼斯 | TUN | 99.5\
  \ | 99.5 |\n| 委内瑞拉玻利瓦尔共和国 | VEN | 99.0 | 99.5 |\n| 巴林 | BHR | 99.4 | 99.4 |\n| 智利\
  \ | CHL | 98.5 | 99.4 |\n| 约旦 | JOR | 99.9 | 99.4 |\n| 毛里求斯 | MUS | 99.4 | 99.4\
  \ |\n| 马来西亚 | MYS | 99.4 | 99.4 |\n| 阿尔及利亚 | DZA | 99.3 | 99.3 |\n| 哥斯达黎加 | CRI\
  \ | 99.3 | 99.2 |\n| 沙特阿拉伯 | SAU | 99.0 | 99.0 |\n| 特立尼达和多巴哥 | TTO | 99.0 | 99.0\
  \ |\n\n仔细查看表 5-1 会发现，这只是原始数据，没有对其执行任何统计操作。但仍然可以从中得出关于所列国家电力供应情况的一些有用推论或见解。在这 20\
  \ 个国家中，2009 年列中的最小值是 98.5，这意味着至少有这个比例的人口能够使用电力。98.5% 或更高的接入率说明了所列国家的发展状况。到了 2010\
  \ 年，这一比例上升到了 99.3%，这无疑是生活水平提升的表现。对于像阿拉伯联合酋长国、科威特和新加坡这样的国家，这个比例是完美的 100%。\n\n即使是原始数据也能讲述一个故事。使用常见工具可能无法打开那些占用千兆字节和拍字节的原始数据。在某些情况下，数据集的大小可能大到任何系统都无法处理。在这种情况下，可以应用可视化和高级分析技术来获取有用的商业见解。我们可能无法用肉眼获得洞察。我们需要一些统计技术和工具来发现数据中隐藏的模式。\n\
  \n## 商业分析中的基本统计概念\n\n本节将讨论一些基本术语，如总体、样本、变量和参数，这些术语在你学习更多商业分析技术时会很有用。\n\n### 总体\n\
  \n总体是指可用于分析项目或数据分析的完整对象集或数据记录集。例如，在一个全国性的营销活动中，经过筛选的全国公民名单将构成该分析问题的总体。通常，由于数据规模庞大、时间有限、资金不足或可用计算机的处理能力有限，可能无法分析整个总体。这些原因可能迫使你只考虑总体的一个子集。在统计术语中，这个子集通常被称为样本。如果选择得当，使用样本进行分析可以与分析整个总体一样好。\n\
  \n为了更清晰，这里有两个详细的例子：\n\n-   示例 1：如果像沃尔玛这样的零售商决定分析其全球客户的购买模式，那么沃尔玛在全球的整个客户群就构成了总体。沃尔玛的商业分析团队可能会根据项目可用资源，决定对全体总体进行分析，或者仅对一个代表性样本进行分析。\n\
  -   示例 2：一家像沃达丰或 AT&T 这样规模的电信公司，拥有全国客户群，可能需要制定策略以减少客户转向竞争对手提供的看似更便宜的手机套餐。在这种情况下，沃达丰在全国范围内的所有移动网络用户将被视为总体。和以往一样，分析团队将决定使用整个总体还是仅使用一个代表性样本。如前所述，在大多数情况下，一个精心设计的样本就足以获得所需的商业见解。\n\
  \n### 样本\n\n样本可以正式定义为从总体中选择出来用于分析的一个子集。创建或收集这个子集的过程称为抽样。有时，可能需要手动从整个总体中收集一些记录。抽样技术有几种类型。以下是商业分析项目中最常用的几种。\n\
  \n#### 简单随机抽样\n\n简单随机抽样是最常用的抽样方法。从总体中随机选择一些记录（记为 n）称为简单随机抽样。有多种方法可以确定合适的样本量。有时，我们正在处理的业务问题会为我们提供样本量的思路。一旦根据其中一种方法确定了样本量（n），就会从总体中随机选择记录。SAS\
  \ 为此提供了便捷的函数。\n\n一个经典随机抽样的例子是，一个蒙着眼睛的人从装满苹果的篮子里拿起十个苹果。所有苹果被从篮子中选中的概率是相等的。\n\n\n\n\
  #### 分层抽样\n\n考虑一个示例总体，其中包含大小相同或不同的预先存在的分段。这些分段是指已被划分为不同数量子群的总体记录。在这种情况下，最佳做法是从每个分段中进行随机抽样；这样，样本才能真实代表该总体的性质。\
  \  \n每个分段的规模可以基于该分段在整个总体中所占的比例。这类分段通常被称为层。从每个层中进行简单随机抽样的过程称为分层抽样。可以手动创建分段，即使总体中没有明显的分段，也可以执行分层抽样。\
  \  \n例如，如果要从全国范围内为一项体育赛事随机挑选 1000 名候选人，那么按比例从每个州进行挑选可能是个好主意。\n\n#### 系统抽样\n\n系统抽样基于固定规则，例如从给定总体中每隔第五个或第七个观测值抽取一个样本。这与随机抽样不同，后者是随机抽取任意值。这种抽样方式通常用于连续进行的测试过程。每\
  \ 60 分钟记录一次室温，或每 10 分钟测量一次病人的血压，都是系统抽样的例子。  \n*   示例：考虑一台批量生产简单螺栓的机器，这些螺栓用于化工厂安装项目。可以收集机器生产的每第\
  \ 30 个螺栓作为样本。这看起来像是从整批产品中抽取的随机样本，但你实际上并没有等待整批产品形成；相反，你是在形成堆垛之前就收集了样本。\n\n### 变量\n\
  \n简单来说，统计数据集中的变量就是表中的一列或一个字段，它是一个可能在不同记录间改变值的特征。它可以是数值型的，可以对每条记录进行测量；也可以是非数值型的，例如城市、性别，或包含“是/否”条目的状态字段。其他例子包括年龄、月收入、日销售额和成本数据。以下是总体或样本可能包含的主要变量类型。\
  \  \n表 5-1 有四列：国家名称、国家代码、2009 年和 2010 年。这四列中的每一列都代表一个变量。因此，在这个数据集中，你总共有四个变量。变量“国家名称”从第\
  \ 1 行到第 3 行分别取值阿拉伯联合酋长国、科威特和新加坡。  \n这个数据集很小，因为它只有四个变量，但在诸如信用评分等银行应用中，可能会有数百个这样的变量，甚至高达\
  \ 500 个。使用此类数据集进行建模可能是一项具有挑战性的任务，有时甚至难以管理。因此，在运用适当的统计技术时，可能需要将变量数量限制在，比如说，50 个，这对于所考虑的分析最有意义。\n\
  \n#### 数值型变量\n\n数值型或定量变量是可测量、可比较且可排序的。身高、体重、开支和距离都是几个例子。数值型变量有两种类型。\n\n##### 连续型\n\
  \n连续型变量可以在两个界限之间取任意值。  \n例如，在大多数情况下，身高变量可以是 1 到 7 英尺之间的任何值。它可以取连续值，例如 5.1、5.12、5.6、5.6134\
  \ 和 6.5 英尺。\n\n##### 离散型\n\n这些数值型变量仅以阶梯方式取值。它们只能在给定界限内取整数值或某些预定义值。  \n例如，一个家庭的子女数只能是\
  \ 1、2、3、4 等。它绝不可能是 1.5 或 2.34。\n\n| 连续型变量就像模拟时钟的指针。它可以在两个给定时间点之间占据任何位置。 | 离散型变量就像数字时钟的显示。它只能显示某些预定义的数字。\
  \ |\n| --- | --- |\n| 在这个例子中，你可以让时钟停在 4:25:25.5。 | 在这里，你只能让钟停在 4:25:24 或 4:25:26。\
  \ |\n\n#### 类别型或非数值型变量\n\n非数值型、定性和类别型变量是指代表质量或特征字段的变量类型。  \n例子包括用 S、M、L、XL 和 XXL\
  \ 表示的衬衫尺码，或用近和远表示的距离。它也可以是布尔值，比如通过或未通过，或者是或否字段。\n\n### 预测建模语境中的变量类型\n\n任何数据科学家或分析专业人士的目标都是从给定的数据集中获取有用的商业洞察，这些数据可能本质上具有历史性。基于历史数据预测可预见的未来（或预测建模）是商业分析中许多数据建模练习的目的。诸如回归之类的预测建模技术有一个目标变量，它是整个数据建模练习的最终结果。换句话说，预测建模预测可以使用一些其他变量来预测目标变量，这些变量在建模时以历史数据的形式已知。这个目标变量被称为因变量；用于预测的其他变量被称为自变量。\
  \  \n因变量的例子包括：月销售额、欺诈概率、学生的最终成绩以及肥料对作物的影响。  \n以下是自变量和因变量的更多示例：预测支出时的客户收入（因变量）、预测成绩时的学习小时数（因变量）以及预测作物产量时的肥料浓度（因变量）。除了被标记为“因变量”之外的变量就是自变量。\n\
  \n### 参数\n\n参数是基于整个总体计算得出的一个度量值。任何提供总体信息的汇总度量值都被称为参数。可以这样记忆：简单来说就是“P 对应 P”，意思是参数（Parameter）对应的是总体（Population）。\
  \  \n例如，以整个加利福尼亚州的电费账单数据为例。无论以何种标准衡量，它都将十分庞大，因为它包含了该州所有家庭的姓名、地址、连接类型、月份、消耗单位数和账单金额等变量。现在，出于规划目的，即预测该州未来五年的电力需求，如果你针对全州所有家庭的某些变量（如消耗单位数和账单金额）计算平均值，那么这些平均值将被称为参数。因此，两个示例参数，即全州每个家庭的平均消耗单位数和平均账单金额，可能看起来分别是\
  \ 650 单位和 100 美元。这些参数是基于整个总体计算的，而总体有时可能非常庞大。所以，不难预测，这可能需要大量的计算工作。\n\n\n\n### 统计量\n\
  \n统计量是基于样本计算得出的度量值。根据这一定义，提供样本信息的汇总度量值被称为统计量。类似于“参数（Parameter）对应总体（Population）”，统计量（Statistic）对应样本（Sample），“S\
  \ 代表 S”。\n\n举个例子，考虑你在上一节中用来解释参数概念的同一数据集。对于参数而言，平均电力消耗和平均账单金额是基于加利福尼亚州整个总体计算的。如果无法对整个总体进行计算，你可能会选择抽取一个代表性样本，比如说，从全州随机抽取\
  \ 10,000 户家庭。在这 10,000 户家庭的样本中，你计算平均电力消耗和每户平均账单金额。样本数据上的这两个平均值将被称作统计量。如果样本选择得当，它们就能很好地代表整个总体。在商业分析中，很多情况下你更倾向于只使用样本，而不是处理涉及整个总体的庞大计算量。\n\
  \n### 示例练习\n\n考虑 `prdsale` 数据集。它位于 SAS 帮助库中。回答以下问题，以厘清本章目前已介绍的概念：\n\n- 打印 `Prdsale`\
  \ 数据的内容并写下你的观察。\n- 打印 `Prdsale` 数据的前 20 条观测并写下你的观察。\n- 总体的大小是多少？\n- 筛选数据并抽取一个样本（其中\
  \ `country=Canada`）。\n- 抽取一个大小为 30 的随机样本。\n- 识别连续变量、离散变量和分类变量。\n- 哪些是原因变量（自变量）？哪些是结果变量（因变量）？\n\
  - 计算一个参数（总体实际销售额的均值）。\n- 计算一个统计量（样本实际销售额的均值）。\n- 该统计量与参数有多接近？它是一个好的估计吗吗？\n\n现在是进行一些动手练习的时候了。在下一节中，你将逐一处理前述十个练习，并使用\
  \ SAS 帮助库中提供的一个样本数据集来求解。你需要打开 SAS 环境来执行给出的代码。希望你已具备一些 SAS 如何工作的基础知识。\n\n**打印 `prdsale`\
  \ 数据的内容并写下你的观察。**\n\n以下 SAS 代码打印 `prdsale` 数据集的元数据：\n\n```\nproc contents data=sashelp.prdsale\
  \ varnum;\nrun;\n```\n\n表 5-2 是 SAS 的输出结果。\n\n**表 5-2.**  \n`prdsale` 数据集的 `PROC\
