  \n### 相关性总结\n\n我们已经讨论了相关系数、其推导过程及其性质。你了解了关系类型，并量化了关联强度。你研究了相关性与因果关系之间的区别。你还学习了如何使用\
  \ SAS 创建相关性矩阵。你需要牢记，相关性仅是线性关系的度量。还有一些其他的关联度量，例如优势比、Kruskal Lambda、卡方等。它们旨在量化变量之间的某种特定类型的关联。在接下来的章节中，我们将进一步介绍变量间关系的量化方法。\n\
  \n## 线性回归\n\n回归是研究变量间关系最常用的分析技术之一。在此阶段，理解相关与回归之间的区别至关重要，尤其是当相关也用于研究两个变量之间的关系时。我们将通过一个智能手机销售示例来展示这种区别。\n\
  \n智能手机的销售取决于许多因素，例如成本、提供的功能、评论家和用户的评分等级。当前的股票市场指标也会影响销售，因为它们反映了经济的整体状况，并表明人们可支配的闲置资金量。如果股市表现良好，人们手中可能有闲置资金，这些资金可能会用于购买新智能手机。新手机型号的销售还取决于手机制造商投入的营销费用。\n\
