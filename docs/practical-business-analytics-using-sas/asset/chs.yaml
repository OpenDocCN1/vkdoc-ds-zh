  | 模型 | 4 | 7.381502E14 | 1.845375E14 | 68.72 | <.0001 |\n| 误差 | 53 | 1.423178E14\
  \ | 2.685241E12 |  |  |\n| 校正总计 | 57 | 8.80468E14 |  |  |  |\n\n| 根均方误差 | 1638671\
  \ | R 方 | 0.8384 |\n| 因变量均值 | 9394688 | 调整 R 方 | 0.8262 |\n| 变异系数 | 17.44252 | \
