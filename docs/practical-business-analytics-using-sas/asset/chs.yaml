  \n\n\n### 第 3 步：使用单变量分析进行数据探索和验证\n\n单变量分析几乎就像是一份关于某个变量的完整报告，从各个角度涵盖了细节。此处将使用单变量分析来探索和验证所有连续变量。该分析提供以下统计参数的结果：\n\
  \n-   `N`（非缺失观测值计数）\n-   `Nmiss`（缺失观测值计数）\n-   `最小值`、`最大值`、`中位数`、`均值`\n-   四分位数和百分位数（`P1`、`p5`、`p10`、`q1(p25)`、`q3(p75)`、`p90`、`p99`)\n\
  -   `Stdde`（标准差）\n-   `Var`（方差）\n-   `偏度`\n-   `峰度`\n\n`偏度`和`峰度`与变量分布有关。本分析中不会用到这两个度量。出于完整性考虑，这里对其进行简要说明。\n\
  \n`偏度`解释了大多数变量分布偏向哪一侧。负偏度意味着，当绘制变量的分布图时，左侧的尾巴更长。考虑一个变量，比如自然死亡人群的年龄；在大多数此类情况下，年龄会非常大。类似地，右偏分布可能在右侧有一条尾巴。一个人一生中的事故次数可能是右偏分布的一个例子。请参见图\
  \ 7-2 和图 7-3。\n\n![A978-1-4842-0043-8_7_Fig3_HTML.jpg](img/A978-1-4842-0043-8_7_Fig3_HTML.jpg)\n\
