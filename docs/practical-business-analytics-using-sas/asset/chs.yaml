  \ SQL 代码保持不变。此处不再重复。你可以参考任何标准的 SQL 教材或通过谷歌搜索。搜索类似“SAS 左连接”的关键词应该能帮你找到所需的答案。\n\n\
  ## 数据合并\n\n分析师可能需要处理多个数据集，并将它们连接或合并，以准备一个最终的数据集进行分析。想象一个市场活动数据的场景。有关潜在客户的信息存储在不同的表中。你可能希望合并这两个数据集，以准备一个用于分析的最终数据集。\n\
  \n让我们尝试通过示例来理解这些概念，这也是贯穿本书的常用方法。以下代码使用了两个学生数据集。每个数据集包含五名学生。第一个数据集中的学生参加了数学考试，第二个数据集中的学生参加了科学考试。前三名学生同时出现在两个数据集中。我们将使用这两个简单的数据集来理解不同类型的数据合并概念：\n\
  \n```\ndata students1;\ninput name $ maths;\ncards;\nAndy 78\nBill 90\nMark 80\n\
  Jeff 75\nJohn 60\n;\n\ndata students2;\ninput name $ science;\ncards;\nAndy 56\n\
  Bill 75\nMark 78\nFred 86\nAlex 77\n;\n```\n\n\n\n### 追加数据\n\n追加数据简单来说就是将第二个数据集附加在第一个数据集之后。这其实并不复杂。在生成的数据集中，第二个数据集的行会直接出现在第一个数据集的行之后。下面是用于追加数据集的代码。你只需要使用一个\
  \ `SET` 语句。\n\n```\nData Students_1_2;\nset students1 students2;\nrun;\n```\n\n\
  以下是执行这段代码时的日志文件：\n\n```\nNOTE: There were 5 observations read from the data set\
  \ WORK.STUDENTS1.\nNOTE: There were 5 observations read from the data set WORK.STUDENTS2.\n\
  NOTE: The data set WORK.STUDENTS_1_2 has 10 observations and 3 variables.\nNOTE:\
  \ DATA statement used (Total process time):\n     real time           0.03 seconds\n\
  \     cpu time            0.01 seconds\n```\n\n让我们看看生成的数据集快照（表 4-24）。\n\n```\nproc\
  \ print data=Students_1_2;\nrun;\n```\n\n**表 4-24.** 使用 `SET` 关键字生成的 `Students_1_2`\
  \ 数据集快照\n\n| 观测序号 | 姓名 | 数学 | 科学 |\n| --- | --- | --- | --- |\n| 1 | Andy | 78 |\
  \ . |\n| 2 | Bill | 90 | . |\n| 3 | Mark | 80 | . |\n| 4 | Jeff | 75 | . |\n| 5\
  \ | John | 60 | . |\n| 6 | Andy | . | 56 |\n| 7 | Bill | . | 75 |\n| 8 | Mark |\
  \ . | 78 |\n| 9 | Fred | . | 86 |\n| 10 | Alex | . | 77 |\n\n如果数据集中存在一些公共列，它们会在新数据集中（作为单个列）被填充；否则，这些列将留空。在此数据集中，`name`\
  \ 列被自动填充，但 `maths`（数学）和 `science`（科学）列在不相关的数据行中保持空白。\n\n表 4-24 显示 Andy、Bill 和 Mark\
  \ 各出现了两次。你可以看到 `SET` 语句只是简单地追加数据。你可能希望做更多操作。如果你希望在 Andy、Bill 和 Mark 的名字不重复的情况下，同时看到他们的科学和数学成绩，`SET`\
  \ 语句无法实现这一目标（表 4-25）。为此，你需要使用 `MERGE` 选项来代替 `SET`。\n\n**表 4-25.** 在 SAS 代码中使用 `SET`\
  \ 和 `MERGE` 选项的数据集对比\n\n| 观测序号 (SET 结果) | 姓名 | 数学 | 科学 | 观测序号 (MERGE 结果) | 姓名 |\
  \ 数学 | 科学 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | Andy | 78\
  \ | . | 1 | Andy | 78 | 56 |\n| 2 | Bill | 90 | . | 2 | Bill | 90 | 75 |\n| 3 |\
