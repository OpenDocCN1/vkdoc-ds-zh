  输出：\n\n![../images/462931_1_En_6_Chapter/462931_1_En_6_Figo_HTML.jpg](img/462931_1_En_6_Figo_HTML.jpg)\n\
  \n\n\n代码示例首先导入了 `sys`、`os`、`json`、`humanfriendly`、`time` 以及自定义类 `conn`。函数 `read_json`\
  \ 用于读取 JSON。函数 `create_db()` 用于创建 MongoDB 集合。主程序块首先读取三个数据集——`users.json`、`cmovies.json`\
  \ 和 `ratings.json`——并将它们保存到 MongoDB 集合中。由于 `ratings.json` 数据集包含超过一百万条记录，将其保存到数据库需要一些时间。\n\
  \n第 5 个代码示例介绍了聚合管道，这是一个基于数据处理管道概念构建的 MongoDB 数据聚合框架。文档进入一个多阶段管道，该管道将它们转换为聚合结果。除了按一个或多个特定字段对文档进行分组和排序以及聚合数组内容外，管道阶段还可以使用运算符来执行诸如计算平均值或连接字符串等任务。该管道使用原生\
  \ MongoDB 操作提供高效的数据聚合，是 MongoDB 中数据聚合的首选方法。\n\n```\nimport sys, os\nsys.path.append(os.getcwd()\
  \ + '/classes')\nimport conn\ndef match_item(k, v, d):\npipeline = [ {'$match' :\
  \ { k : v }} ]\nq = db.command('aggregate',d,pipeline=pipeline)\nreturn q\nif __name__\
  \ == \"__main__\":\nobj = conn.conn('test')\ndb = obj.getDB()\nmovie = 'Toy Story'\n\
