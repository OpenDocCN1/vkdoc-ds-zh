  \n**图 6-3** 方差解释图\n\n\n\n代码示例首先导入了 `matplotlib`、`pandas`、`numpy`、`json`、`random`\
  \ 和 `sklearn` 库。函数 `read_json()` 用于读取 JSON 文件。函数 `unique_features()` 从某个维度（特征）中提取出唯一的类别（分类）。在此例中，它从\
  \ `segm` 特征中提取出三个类别——家庭办公室、企业和消费者。由于数据集接近 10,000 条记录，我需要确认其中包含哪些类别。函数 `sire_features()`\
  \ 提取出一个仅包含感兴趣特征的新数据集。函数 `sire_numeric()` 将数字字符串转换为浮点数。函数 `sire_sample()` 返回一个经过类别筛选的、包含\
  \ `n` 条记录的随机样本。函数 `rnd_sample()` 创建一个随机样本。函数 `convert_float()` 将数字字符串数据转换为浮点数。\n\
  \n主程序块首先读取 `wrangled.json`，并创建一个仅包含感兴趣特征的数据集特征。代码接着创建一个仅包含数值型数据特征的数据集 numeric。数据集\
  \ numeric 用于生成 PCA。接下来，为每个类别创建三个大小为 100 的样本。这些样本用于创建平行坐标可视化（图 6-2）。PCA 的代码随后对数值型数据集进行标准化和转换。创建一个协方差矩阵，以便生成特征向量和特征值。我还包含了使用相关矩阵的\
  \ PCA，因为某些学科更倾向于使用它。最后，创建了主成分的可视化。\n\n平行坐标图显示 `prof`（利润）和 `sale`（销售额）是最重要的特征。PCA\
  \ 可视化（图 6-3）显示，第一主成分占 39.75%，第二主成分占 26.47%，第三主成分占 22.03%，第四主成分占 11.75%。在这种情况下，PCA\
  \ 分析并不是非常有用，因为所有四个主成分都是必需的，尤其是前三个。因此，我们不能在后续分析中舍弃任何一个维度。\n\n第二个代码示例使用鸢尾花数据集进行 PCA：\n\
  \n```\nimport matplotlib.pyplot as plt, pandas as pd, numpy as np\nfrom sklearn.preprocessing\
  \ import StandardScaler\nfrom pandas.plotting import parallel_coordinates\ndef conv_float(d):\n\
  return d.astype(float)\nif __name__ == \"__main__\":\ndf = pd.read_csv('data/iris.csv')\n\
  X = df.ix[:,0:4].values\ny = df.ix[:,4].values\nX_std = StandardScaler().fit_transform(X)\n\
  mean_vec = np.mean(X_std, axis=0)\ncov_mat = np.cov(X_std.T)\neig_vals, eig_vecs\
  \ = np.linalg.eig(cov_mat)\nprint ('Eigenvectors:\\n', eig_vecs)\nprint ('\\nEigenvalues:\\\
  n', eig_vals)\nplt.figure()\nparallel_coordinates(df, 'Name', color=\n['orange','lime','fuchsia'])\n\
  tot = sum(eig_vals)\nvar_exp = [(i / tot)*100 for i in sorted(eig_vals, reverse=True)]\n\
  cum_var_exp = np.cumsum(var_exp)\nfig, ax = plt.subplots()\nlabels = ['PC1', 'PC2',\
  \ 'PC3', 'PC4']\nwidth = 0.35\nindex = np.arange(len(var_exp))\nax.bar(index, var_exp,\n\
  color=['fuchsia', 'lime', 'thistle', 'thistle'])\nfor i, v in enumerate(var_exp):\n\
  v = round(v, 2)\nval = str(v) + '%'\nax.text(i, v+0.5, val, ha=\"center\", color=\"\
  b\",\nfontsize=9, fontweight=\"bold\")\nplt.xticks(index, labels)\nplt.title('Variance\
  \ Explained')\nplt.show()\n```\n\n输出：\n\n![../images/462931_1_En_6_Chapter/462931_1_En_6_Fig5_HTML.jpg](img/462931_1_En_6_Fig5_HTML.jpg)\n\
