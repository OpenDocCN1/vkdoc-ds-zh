  json_data = json.dumps(data)\nheader = '[\\n'\nender = ']'\nobj = open('data/credentials.json',\
  \ 'w')\nobj.write(header)\nobj.write(json_data + '\\n')\nobj.write(ender)\nobj.close()\n\
  ```\n\n我选择将凭证保存在 JSON 中，以将其隐藏起来。代码示例导入了 `json` 库。主程序块将凭证保存到 JSON 中。\n\n第 2 个代码示例使用\
  \ TwitterSearch API 流式传输 Twitter 数据。安装方法：`pip install TwitterSearchAPI`。\n\n```\n\
  from TwitterSearch import *\nimport json, sys\nclass twitSearch:\ndef __init__(self,\
