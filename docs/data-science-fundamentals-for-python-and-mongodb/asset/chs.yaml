  \n这个代码示例比上一个短得多，因为我们不需要进行数据整理、清洗（那么多）以及创建随机样本（用于平行坐标可视化）。代码首先导入了 `matplotlib`、`pandas`、`numpy`\
  \ 和 `sklearn` 库。函数 `conv_float()` 将数字字符串转换为浮点数。主程序块首先读取鸢尾花数据集。接着对数据进行标准化和转换，以进行\
  \ PCA。然后显示平行坐标和方差解释。\n\n平行坐标图显示 `PetalLength`（花瓣长度）和 `PetalWidth`（花瓣宽度）是最重要的特征（图\
  \ 6-4）。PCA 可视化（方差解释）显示，第一主成分占 72.77%，第二主成分占 23.03%，第三主成分占 3.68%，第四主成分占 0.52%（图 6-5）。在这种情况下，PCA\
  \ 分析非常有用，因为前两个主成分解释了超过 95% 的方差。因此，我们可以舍弃 PC3 和 PC4，不再考虑。\n\n为清晰起见，PCA 的第一步是探索特征向量和特征值。特征值最低的特征向量包含的数据分布信息最少，因此可以舍弃。在这个例子中，前两个特征值要高得多，尤其是\
  \ PC1。因此，舍弃 PC3 和 PC4 是合理的。第二步是测量解释方差，这可以通过特征值计算得出。解释方差告诉我们每个主成分可以解释多少信息（方差）。查看解释方差可以确认\
  \ PC3 和 PC4 并不重要。\n\n## 速度模拟\n\n在数据科学中，速度很重要，尤其是当数据集变得更大时。生成器有助于内存优化，因为生成器函数一次只返回一个项目（按需返回），而不是一次性返回所有项目。\n\
  \n该代码示例对比了列表和生成器之间的速度：\n\n```\nimport json, humanfriendly as hf\nfrom time import\
  \ clock\ndef read_json(f):\nwith open(f) as f:\nreturn json.load(f)\ndef mk_gen(k,\
  \ d):\nfor row in d:\ndic = {}\nfor key in k:\ndic[key] = float(row[key])\nyield\
  \ dic\ndef conv_float(keys, d):\nreturn [dict([k, float(v)] for k, v in row.items()\n\
  if k in keys) for row in d]\nif __name__ == \"__main__\":\nf = 'data/wrangled.json'\n\
  data = read_json(f)\nkeys = ['sale', 'quan', 'disc', 'prof']\nprint ('create, convert,\
  \ and display list:')\nstart = clock()\ndata = conv_float(keys, data)\nfor i, row\
  \ in enumerate(data):\nif i < 5:\nprint (row)\nend = clock()\nelapsed_ls = end -\
  \ start\nprint (hf.format_timespan(elapsed_ls, detailed=True))\nprint ('\\ncreate,\
  \ convert, and display generator:')\nstart = clock()\ngenerator = mk_gen(keys, data)\n\
  for i, row in enumerate(generator):\nif i < 5:\nprint (row)\nend = clock()\nelapsed_gen\
  \ = end - start\nprint (hf.format_timespan(elapsed_gen, detailed=True))\nspeed =\
  \ round(elapsed_ls / elapsed_gen, 2)\nprint ('\\ngenerator is', speed, 'times faster')\n\
  ```\n\n输出：\n\n![../images/462931_1_En_6_Chapter/462931_1_En_6_Fige_HTML.jpg](img/462931_1_En_6_Fige_HTML.jpg)\n\
  \n代码示例首先导入了 `json`、`humanfriendly` 和 `time` 库。你可能需要像我一样安装 `humanfriendly`：`pip install\
  \ humanfriendly`。函数 `read_json()` 读取 JSON。函数 `mk_gen()` 基于 `wrangled.json` 中的四个特征创建一个生成器，并将值转换为浮点数。函数\
  \ `conv_float()` 将列表中的字典值转换为浮点数。主程序块首先将 `wrangled.json` 读入一个列表。代码接着对根据键创建新列表并将值转换为浮点数的过程进行计时。接下来，创建一个模拟列表创建和转换过程的生成器。生成器的速度快了\
  \ 2.26 倍（在我的电脑上）。\n\n\n\n### 大数据\n\n大数据是 21 世纪的热门话题。那么，让我们来处理一个相对较大的数据集。GroupLens\
