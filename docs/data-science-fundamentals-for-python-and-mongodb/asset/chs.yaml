  \ 管道获取用户 3 评分为 5 的电影标题。管道是从 MongoDB 查询文档的高效方法，但需要练习才能熟悉其语法。\n\n## Twitter\n\nTwitter\
  \ 是一个极好的数据来源，因为你可以获取几乎任何主题的数据。要访问 Twitter 的数据，你需要连接到 Twitter Streaming API。连接需要来自\
