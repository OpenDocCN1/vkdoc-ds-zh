  \ 0。\n\n第二个示例寻找 sigmoid 函数的局部最大值：\n\n```python\nimport matplotlib.pyplot as plt,\
  \ numpy as np\ndef sigmoid(x):\nreturn 1 / (1 + np.exp(-x))\ndef df(x):\nreturn\
