  ## 网页抓取\n\n网页抓取是一种从网站提取信息的编程方法。它专注于将非结构化的 HTML 格式数据转换为结构化数据。由于 HTML 的非结构化特性，网页抓取在编程上要求很高。也就是说，HTML\
  \ 几乎没有结构规则，这意味着不同网站的 HTML 结构模式往往不同。因此，准备好为每次网页抓取任务编写自定义代码吧。\n\n代码示例从一个流行的技术书籍出版公司抓取书籍信息。第一步是定位网页。第二步是打开一个包含源代码的窗口。第三步是遍历源代码以识别要抓取的数据。第四步是进行抓取。\n\
  \n使用 Google Chrome，点击“更多工具”，然后点击“开发者工具”以打开源代码窗口。接下来，将鼠标光标悬停在源代码上，直到找到数据。向下移动源代码树以找到你想要抓取的标签。最后，抓取数据。\n\
  \n要安装 `BeautifulSoup`，请执行 `pip install BeautifulSoup`。\n\n```python\nfrom bs4 import\
  \ BeautifulSoup\nimport requests, json\ndef build_title(t):\nt = t.text\nt = t.split()\n\
  ls = []\nfor row in t:\nif row != '-':\nls.append(row)\nelif row == '-':\nbreak\n\
  return ' '.join(ls)\ndef release_date(r):\nr = r.text\nr = r.split()\nprefix = r[0]\
  \ + s + r[1]\nif len(r) == 5:\ndate = r[2] + s + r[3] + s + r[4]\nelse:\ndate =\
  \ r[2] + s + r[3]\nreturn prefix, date\ndef write_json(f, d):\nwith open(f, 'w')\
  \ as fout:\njson.dump(d, fout)\ndef read_json(f):\nwith open(f) as f:\nreturn json.load(f)\n\
  if __name__ == '__main__':\ns = ' '\ndic_ls = []\nbase_url = \"https://ssearch.oreilly.com/?q=data+science\"\
  \nsoup = BeautifulSoup(requests.get(base_url).text, 'lxml')\nbooks = soup.find_all('article')\n\
  for i, row in enumerate(books):\ndic = {}\ntag = row.name\ntag_val = row['class']\n\
  title = row.find('p', {'class' : 'title'})\ntitle = build_title(title)\nurl = row.find('a',\
  \ {'class' : 'learn-more'})\nlearn_more = url.get('href')\nauthor = row.find('p',\
  \ {'class' : 'note'}).text\nrelease = row.find('p', {'class' : 'note date2'})\n\
  prefix, date = release_date(release)\nif len(tag_val) == 2:\npublisher = row.find('p',\
  \ {'class' : 'note publisher'}).text\nitem = row.find('img', {'class' : 'book'})\n\
  cat = item.get('class')[0]\nelse:\npublisher, cat = None, None\ndesc = row.find('p',\
  \ {'class' : 'description'}).text.split()\ndesc = [row for i, row in enumerate(desc)\
  \ if i < 7]\ndesc = ' '.join(desc) + ' ...'\ndic['title'] = title\ndic['learn_more']\
  \ = learn_more\nif author[0:3] != 'Pub':\ndic['author'] = author\nif publisher is\
  \ not None:\ndic['publisher'] = publisher\ndic['category'] = cat\nelse:\ndic['event']\
  \ = desc\ndic['date'] = date\ndic_ls.append(dic)\nf = 'data/scraped.json'\nwrite_json(f,\
  \ dic_ls)\ndata = read_json(f)\nfor i, row in enumerate(data):\nif i < 6:\nprint\
  \ (row['title'])\nif 'author' in row.keys():\nprint (row['author'])\nif 'publisher'\
  \ in row.keys():\nprint (row['publisher'])\nif 'category' in row.keys():\nprint\
  \ ('Category:', row['category'])\nprint ('Release Date:', row['date'])\nif 'event'\
  \ in row.keys():\nprint ('Event:', row['event'])\nprint ('Publish Date:', row['date'])\n\
  print ('Learn more:', row['learn_more'])\nprint ()\n```\n\n输出：\n\n![../images/462931_1_En_6_Chapter/462931_1_En_6_Figs_HTML.jpg](img/462931_1_En_6_Figs_HTML.jpg)\n\
