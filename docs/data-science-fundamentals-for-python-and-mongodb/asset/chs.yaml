  \ (`sigma`) 和数据点数量 (`n`) 生成一个正态分布。函数 `nrml()` 将数据转换到 0 到 1 的范围内。主程序块首先创建正态分布，然后绘制原始分布和归一化后的分布（图\
  \ 5-11）。请注意，两个分布的形状完全相同，但第二个分布被归一化到了 0 到 1 之间。\n\n第三个代码示例将数据转换为均值为 0、方差为 1 的形式（标准正态分布）：\n\
  \n```\nimport numpy as np, csv\nimport matplotlib.pyplot as plt\ndef rnd_nrml(m,\
