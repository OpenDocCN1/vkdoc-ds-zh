  \n图 4-6\n\n`f(x)`、`f'(x)` 和局部最大值的子图\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figd_HTML.jpg](img/462931_1_En_4_Figd_HTML.jpg)\n\
  \n代码首先导入 `matplotlib` 和 `numpy`。接着定义了函数 `sigmoid(x)` 和 `df(x)`，它们分别用算法表示了 sigmoid\
  \ 函数及其导数。主程序块首先为 `f(x)` 和 `f'(x)` 创建数据。然后为 `f(x)`、`f'(x)` 和局部最大值（图 4-6）创建子图。从 `f(x)`\
  \ 的图中可以很容易看出局部最大值接近 1。接下来，代码运行梯度下降法来寻找局部最大值并绘制它。同样，梯度下降法的起始点 `cur_x` 是通过试错法找到的。如果你将\
  \ `cur_x` 起始点设得离局部最大值更远（你可以通过查看 `f(x)` 的子图来估计），迭代次数会增加，因为梯度下降法算法需要更长时间才能收敛到局部最大值。正如预期，局部最大值大约为\
  \ 1。\n\n\n\n### 控制步长的欧几里得距离最小化\n\n欧几里得距离是欧几里得空间中两点之间的普通直线距离。借助这种距离，欧几里得空间便成为一个度量空间。与之相关的范数是欧几里得范数（EN）。欧几里得范数为每个向量赋予其箭头长度，因此，欧几里得范数实际上就是向量的大小。定义了范数的向量空间称为赋范向量空间。\n\
  \n要在三维空间中寻找 `f(x)` 的局部最小值，第一步是找到所有三维向量的最小值。第二步是创建一个随机的三维向量 `[x, y, z]`。第三步是选取一个随机起点，然后沿着梯度\
  \ `f'(x)` 的反方向迈出微小步长，直到到达一个梯度非常小的点。每一步微小步长（从当前向量到下一个向量）都使用欧几里得距离度量来衡量。欧几里得距离度量是欧几里得空间中两点之间的距离。之所以需要这个度量，是因为我们需要知道每一步微小步长该如何移动。因此，欧几里得距离度量补充了梯度下降法，以在三维空间中寻找局部最小值。\n\
  \n以下代码示例展示了如何在三维空间中寻找 sigmoid 函数的局部最小值：\n\n```\nimport matplotlib.pyplot as plt\n\
  from mpl_toolkits.mplot3d import Axes3D\nimport random, numpy as np\nfrom scipy.spatial\
  \ import distance\ndef step(v, direction, step_size):\nreturn [v_i + step_size *\
  \ direction_i\nfor v_i, direction_i in zip(v, direction)]\ndef sigmoid_gradient(v):\n\
  return [v_i * (1-v_i) for v_i in v]\ndef mod_vector(v):\nfor i, v_i in enumerate(v):\n\
  if v_i == float(\"inf\") or v_i == float(\"-inf\"):\nv[i] = random.randint(-1, 1)\n\
  return v\nif __name__ == \"__main__\":\nv = [random.randint(-10, 10) for i in range(3)]\n\
  tolerance = 0.0000001\niterations = 1\nfig = plt.figure('Euclidean')\nax = fig.add_subplot(111,\
  \ projection=\"3d\")\nwhile True:\ngradient = sigmoid_gradient(v)\nnext_v = step(v,\
  \ gradient, -0.01)\nxs = gradient[0]\nys = gradient[1]\nzs = gradient[2]\nax.scatter(xs,\
  \ ys, zs, c=\"lime\", marker=\"o\")\nv = mod_vector(v)\nnext_v = mod_vector(next_v)\n\
  test_v = distance.euclidean(v, next_v)\nif test_v < tolerance:\nbreak\nv = next_v\n\
  iterations += 1\nprint ('minimum:', test_v, '\\niterations:', iterations)\nax.set_xlabel('X\
  \ axis')\nax.set_ylabel('Y axis')\nax.set_zlabel('Z axis')\nplt.tight_layout()\n\
  plt.show()\n```\n\n输出：\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig7_HTML.jpg](img/462931_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n局部最小值的三维渲染图\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fige_HTML.jpg](img/462931_1_En_4_Fige_HTML.jpg)\n\
  \n代码首先导入了 `matplotlib`、`mpl_toolkits`、`random`、`numpy` 和 `scipy` 库。函数 `step()` 根据梯度，按指定步长将向量沿某个方向移动。函数\
  \ `sigmoid_gradient()` 返回 `f'(sigmoid)` 在三维空间中的一个点。函数 `mod_vector()` 确保模拟过程中产生的错误向量能被妥善处理。主程序块首先创建一个随机生成的三维向量\
  \ `[x, y, z]` 作为模拟的起点，然后设定一个容差（精度）。容差越小，结果越精确。接着创建一个子图，用于显示局部最小值的三维渲染图（图 4-7）。梯度下降模拟会生成一组受\
  \ sigmoid 梯度影响的三维向量，直到梯度变得非常小。梯度的大小（模）通过欧几里得距离度量来计算。正如预期，局部最小值接近 0。\n\n## 使用蒙特卡洛模拟稳定欧几里得距离最小化\n\
  \n前一个示例中的欧几里得距离实验基于一个随机过程。具体来说，起始向量 `v` 是通过 `randomint()` 随机生成的。因此，每次运行梯度下降实验时，迭代次数都会产生不同的结果。从第\
  \ 2 章我们已经知道，蒙特卡洛模拟（MCS）能高效地对随机过程进行建模。然而，MCS 也能稳定随机实验。\n\n以下代码示例首先将梯度下降实验包装在一个循环中，该循环运行\
  \ `n` 次模拟。通过 `n` 次模拟，计算出平均迭代次数。然后将结果代码再包装在另一个循环中，该循环运行 `m` 次试验。通过 `m` 次试验，计算出每次平均迭代次数之间的平均差距。差距是通过从最大平均迭代次数中减去最小平均迭代次数得到的。差距越小，结果越稳定（精确）。要提高精度，可以增加模拟次数（`n`）。唯一的限制是计算能力。也就是说，运行\
  \ 1000 次模拟比运行 100 次需要更多的计算能力。稳定（精确）的结果允许与其他实验进行比较。\n\n```\nimport random, numpy\
  \ as np\nfrom scipy.spatial import distance\ndef step(v, direction, step_size):\n\
  return [v_i + step_size * direction_i\nfor v_i, direction_i in zip(v, direction)]\n\
  def sigmoid_gradient(v):\nreturn [v_i * (1-v_i) for v_i in v]\ndef mod_vector(v):\n\
  for i, v_i in enumerate(v):\nif v_i == float(\"inf\") or v_i == float(\"-inf\"):\n\
  v[i] = random.randint(-1, 1)\nreturn v\nif __name__ == \"__main__\":\ntrials= 10\n\
  sims = 10\navg_its = []\nfor _ in range(trials):\nits = []\nfor _ in range(sims):\n\
  v = [random.randint(-10, 10) for i in range(3)]\ntolerance = 0.0000001\niterations\
  \ = 0\nwhile True:\ngradient = sigmoid_gradient(v)\nnext_v = step(v, gradient, -0.01)\n\
  v = mod_vector(v)\nnext_v = mod_vector(next_v)\ntest_v = distance.euclidean(v, next_v)\n\
  if test_v < tolerance:\nbreak\nv = next_v\niterations += 1\nits.append(iterations)\n\
  a = round(np.mean(its))\navg_its.append(a)\ngap = np.max(avg_its) - np.min(avg_its)\n\
  print (trials, 'trials with', sims, 'simulations each:')\nprint ('gap', gap)\nprint\
  \ ('avg iterations', round(np.mean(avg_its)))\n```\n\n输出：\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figh_HTML.jpg](img/462931_1_En_4_Figh_HTML.jpg)\n\
  \n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figg_HTML.jpg](img/462931_1_En_4_Figg_HTML.jpg)\n\
  \n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figf_HTML.jpg](img/462931_1_En_4_Figf_HTML.jpg)\n\
  \n输出结果分别对应 10 次、100 次和 1000 次模拟。通过运行 10 次（试验）各包含 1000 次模拟，差距缩小到了 13。因此，我们有很高的置信度认为，最小化该函数所需的迭代次数接近\
  \ 1089。我们可以通过将代码再包装在一个循环中来进一步稳定结果，以减少差距和迭代次数的波动。然而，计算机处理时间会成为一个问题。对于这类实验，利用 MCS\
  \ 为云计算提供了强有力的理由。理解 MCS 的这种应用可能有些困难，但它是处理并解决数据科学问题的一个非常强大的工具。\n\n\n\n### 使用 NumPy\
  \ 方法加速欧几里得距离最小化\n\n由于 `numpy` 数组比 Python 列表更快，因此使用 `numpy` 方法计算欧几里得距离会更高效。以下代码示例使用\
  \ `np.linalg.norm()` 替代 `distance.euclidean()` 来计算 GD 实验中的欧几里得距离。\n\n```python\n\
  import matplotlib.pyplot as plt\nfrom mpl_toolkits.mplot3d import Axes3D\nimport\
  \ random, numpy as np\ndef step(v, direction, step_size):\nreturn [v_i + step_size\
  \ * direction_i\nfor v_i, direction_i in zip(v, direction)]\ndef sigmoid_gradient(v):\n\
  return [v_i * (1-v_i) for v_i in v]\ndef round_v(v):\nreturn np.round(v, decimals=3)\n\
  if __name__ == \"__main__\":\nv = [random.randint(-10, 10) for i in range(3)]\n\
  tolerance = 0.0000001\niterations = 1\nfig = plt.figure('norm')\nax = fig.add_subplot(111,\
  \ projection=\"3d\")\nwhile True:\ngradient = sigmoid_gradient(v)\nnext_v = step(v,\
  \ gradient, -0.01)\nround_gradient = round_v(gradient)\nxs = round_gradient[0]\n\
  ys = round_gradient[1]\nzs = round_gradient[2]\nax.scatter(xs, ys, zs, c=\"lime\"\
  , marker=\"o\")\nnorm_v = np.linalg.norm(v)\nnorm_next_v = np.linalg.norm(next_v)\n\
  test_v = norm_v - norm_next_v\nif test_v < tolerance:\nbreak\nv = next_v\niterations\
  \ += 1\nprint ('minimum:', test_v, '\\niterations:', iterations)\nax.set_xlabel('X\
  \ axis')\nax.set_ylabel('Y axis')\nax.set_zlabel('Z axis')\nplt.show()\n```\n\n\
  输出：\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig8_HTML.jpg](img/462931_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n局部最小值的 NumPy 3D 渲染\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figi_HTML.jpg](img/462931_1_En_4_Figi_HTML.jpg)\n\
  \n迭代次数大幅降低至 31 次（图 4-8）。然而，由于 GD 实验是随机的，我们可以使用 MCS 进行客观比较。\n\n使用相同的 MCS 方法，代码示例首先将\
  \ GD 实验包装在一个运行 `n` 次模拟的循环中。然后将生成的代码再包装在另一个运行 `m` 次试验的循环中。\n\n```python\nimport random,\
  \ numpy as np\ndef step(v, direction, step_size):\nreturn [v_i + step_size * direction_i\n\
  for v_i, direction_i in zip(v, direction)]\ndef sigmoid_gradient(v):\nreturn [v_i\
  \ * (1-v_i) for v_i in v]\ndef round_v(v):\nreturn np.round(v, decimals=3)\nif __name__\
  \ == \"__main__\":\ntrials= 10\nsims = 10\navg_its = []\nfor _ in range(trials):\n\
  its = []\nfor _ in range(sims):\nv = [random.randint(-10, 10) for i in range(3)]\n\
  tolerance = 0.0000001\niterations = 0\nwhile True:\ngradient = sigmoid_gradient(v)\n\
  next_v = step(v, gradient, -0.01)\nnorm_v = np.linalg.norm(v)\nnorm_next_v = np.linalg.norm(next_v)\n\
  test_v = norm_v - norm_next_v\nif test_v < tolerance:\nbreak\nv = next_v\niterations\
  \ += 1\nits.append(iterations)\na = round(np.mean(its))\navg_its.append(a)\ngap\
  \ = np.max(avg_its) - np.min(avg_its)\nprint (trials, 'trials with', sims, 'simulations\
  \ each:')\nprint ('gap', gap)\nprint ('avg iterations', round(np.mean(avg_its)))\n\
  ```\n\n输出：\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figl_HTML.jpg](img/462931_1_En_4_Figl_HTML.jpg)\n\
  \n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figk_HTML.jpg](img/462931_1_En_4_Figk_HTML.jpg)\n\
  \n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figj_HTML.jpg](img/462931_1_En_4_Figj_HTML.jpg)\n\
  \n使用 `numpy` 处理速度要快得多。平均迭代次数接近 193。因此，使用 `numpy` 替代方案计算欧几里得距离的速度提高了五倍以上！\n\n## 随机梯度下降的最小化与最大化\n\
  \n在本章中，到目前为止的优化实验都使用了批量梯度下降。批量梯度下降使用整个数据集计算梯度。随机梯度下降则使用单个样本计算梯度，因此计算速度要快得多。之所以称为随机梯度下降，是因为梯度是随机确定的。然而，与批量梯度下降不同，随机梯度下降是一种近似方法。如果需要精确梯度，随机梯度下降并非最优选择。随机梯度下降的另一个问题是，它可能会在最小值附近徘徊，而实际上无法收敛。因此，绘制模拟过程的进度图以观察情况非常重要。\n\
  \n现在让我们改变方向，优化另一个重要函数——残差平方和（RSS）。RSS 函数是一种统计技术，用于衡量回归函数与数据集之间剩余的误差（方差）量。回归分析是一种估计变量之间关系的算法。它广泛用于预测和预报。它也是数据科学应用中一种流行的建模和预测算法。\n\
  \n第一个代码示例生成一个样本，运行 GD 实验 `n` 次，并随机处理样本：\n\n```python\nimport matplotlib.pyplot as\
  \ plt\nimport random, numpy as np\ndef rnd():\nreturn [random.randint(-10,10) for\
  \ i in range(3)]\ndef random_vectors(n):\nls = []\nfor v in range(n):\nls.append(rnd())\n\
  return ls\ndef sos(v):\nreturn sum(v_i ** 2 for v_i in v)\ndef sos_gradient(v):\n\
  return [2 * v_i for v_i in v]\ndef in_random_order(data):\nindexes = [i for i, _\
  \ in enumerate(data)]\nrandom.shuffle(indexes)\nfor i in indexes:\nyield data[i]\n\
  if __name__ == \"__main__\":\nv, x, y = rnd(), random_vectors(3), random_vectors(3)\n\
  data = list(zip(x, y))\ntheta = v\nalpha, value = 0.01, 0\nmin_theta, min_value\
  \ = None, float(\"inf\")\niterations_with_no_improvement = 0\nn, x = 30, 1\nfor\
  \ i, _ in enumerate(range(n)):\ny = np.linalg.norm(theta)\nplt.scatter(x, y, c=\"\
  r\")\nx = x + 1\ns = []\nfor x_i, y_i in data:\ns.extend([sos(theta), sos(x_i),\
  \ sos(y_i)])\nvalue = sum(s)\nif value < min_value:\nmin_theta, min_value = theta,\
  \ value\niterations_with_no_improvement = 0\nalpha = 0.01\nelse:\niterations_with_no_improvement\
  \ += 1\nalpha *= 0.9\ng = []\nfor x_i, y_i in in_random_order(data):\ng.extend([sos_gradient(theta),\
  \ sos_gradient(x_i),\nsos_gradient(y_i)])\nfor v in g:\ntheta = np.around(np.subtract(theta,alpha*np.array(v)),3)\n\
  g = []\nprint ('minimum:', np.around(min_theta, 4),\n'with', i+1, 'iterations')\n\
  print ('iterations with no improvement:',\niterations_with_no_improvement)\nprint\
  \ ('magnitude of min vector:', np.linalg.norm(min_theta))\nplt.show()\n```\n\n输出：\n\
  \n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig9_HTML.jpg](img/462931_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\nRSS 最小化\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figm_HTML.jpg](img/462931_1_En_4_Figm_HTML.jpg)\n\
  \n代码首先导入 `matplotlib`、`random` 和 `numpy`。接着是函数 `rnd()`，它返回一个从 -10 到 10 的随机整数列表。函数\
  \ `random_vectors()` 生成一个包含 `n` 个数字的列表（随机样本）。函数 `sos()` 返回向量的 RSS。函数 `sos_gradient()`\
  \ 返回向量 RSS 的导数（梯度）。函数 `in_random_order()` 生成一个随机打乱索引的列表。该函数为 GD 算法增添了随机性。主程序块首先生成一个随机向量\
  \ `v` 作为模拟的起点。接着创建一个大小为 3 的 `x` 和 `y` 向量样本。然后，将该向量赋值给 `theta`，这是某个通用概率分布向量的常见名称。我们可以随意命名该向量，但一个常见的数据科学问题是找到\
  \ `theta` 的值。代码继续设置固定步长 `alpha`、最小 `theta` 值、最小结束值、无改进迭代次数、模拟次数 `n`，以及 x 坐标的绘图值（图\
  \ 4-9）。\n\n\n\n### 随机梯度下降与数据工作\n\n模拟开始时，将`theta`的幅度赋值给`y`。接着，绘制当前的`x`和`y`坐标。`x`坐标递增\
  \ 1，以绘制每个`y`坐标向最小值收敛的过程。下一段代码计算每个`theta`以及`x`和`y`样本的 RSS。该值用于判断模拟是否在局部最小值附近徘徊，而非收敛。代码的最后部分以随机（随机梯度）顺序遍历样本数据点，计算`theta`、`x`和`y`的梯度，将这三个值放入列表`g`中，并遍历该向量以找到下一个`theta`值。\n\
  \n哇！这并不简单，但这就是随机梯度下降（SGD）的工作原理。请注意，生成的最小值为 2.87，并非真实最小值 0。因此，随机梯度下降所需的迭代次数较少，但无法产生真实最小值。\n\
  \n可以通过调整寻找下一个`theta`的算法来优化之前的模拟。在前一个示例中，下一个`theta`是根据每个样本的当前`theta`、`x`值和`y`值计算的梯度来计算的。然而，实际的新`theta`是基于样本中的第三个数据点。因此，第二个示例通过取整个样本中的最小`theta`（而非第三个数据点）进行了优化：\n\
  \n```python\nimport matplotlib.pyplot as plt\nimport random, numpy as np\ndef rnd():\n\
  return [random.randint(-10,10) for i in range(3)]\ndef random_vectors(n):\nls =\
  \ []\nfor v in range(n):\nls.append([random.randint(-10,10) for i in range(3)])\n\
  return ls\ndef sos(v):\nreturn sum(v_i ** 2 for v_i in v)\ndef sos_gradient(v):\n\
  return [2 * v_i for v_i in v]\ndef in_random_order(data):\nindexes = [i for i, _\
  \ in enumerate(data)]\nrandom.shuffle(indexes)\nfor i in indexes:\nyield data[i]\n\
  if __name__ == \"__main__\":\nv, x, y = rnd(), random_vectors(3), random_vectors(3)\n\
  data = list(zip(x, y))\ntheta = v\nalpha, value = 0.01, 0\nmin_theta, min_value\
  \ = None, float(\"inf\")\niterations_with_no_improvement = 0\nn, x = 60, 1\nfor\
  \ i, _ in enumerate(range(n)):\ny = np.linalg.norm(theta)\nplt.scatter(x, y, c=\"\
  r\")\nx = x + 1\ns = []\nfor x_i, y_i in data:\ns.extend([sos(theta), sos(x_i),\
  \ sos(y_i)])\nvalue = sum(s)\nif value < min_value:\nmin_theta, min_value = theta,\
  \ value\niterations_with_no_improvement = 0\nalpha = 0.01\nelse:\niterations_with_no_improvement\
  \ += 1\nalpha *= 0.9\ng, t, m = [], [], []\nfor x_i, y_i in in_random_order(data):\n\
  g.extend([sos_gradient(theta), sos_gradient(x_i),\nsos_gradient(y_i)])\nm = np.around([np.linalg.norm(x)\
  \ for x in g], 2)\nfor v in g:\ntheta = np.around(np.subtract(theta,alpha*np.array(v)),3)\n\
  t.append(np.around(theta,2))\nmm = np.argmin(m)\ntheta = t[mm]\ng, m, t = [], [],\
  \ []\nprint ('minimum:', np.around(min_theta, 4),\n'with', i+1, 'iterations')\n\
  print ('iterations with no improvement:',\niterations_with_no_improvement)\nprint\
  \ ('magnitude of min vector:', np.linalg.norm(min_theta))\nplt.show()\n```\n\n输出：\n\
  \n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig10_HTML.jpg](img/462931_1_En_4_Fig10_HTML.jpg)\n\
  \n**图 4-10** 改进的 RSS 最小化\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fign_HTML.jpg](img/462931_1_En_4_Fign_HTML.jpg)\n\
  \n代码中唯一的区别在于底部计算最小`theta`的部分（图 4-10）。虽然进行了 60 次迭代，但最小值更接近 0，且更加稳定。也就是说，前一个示例在每次运行时偏差都更大。\n\
  \n第三个示例用于寻找最大值：\n\n```python\nimport matplotlib.pyplot as plt\nimport random, numpy\
  \ as np\ndef rnd():\nreturn [random.randint(-10,10) for i in range(3)]\ndef random_vectors(n):\n\
  ls = []\nfor v in range(n):\nls.append([random.randint(-10,10) for i in range(3)])\n\
  return ls\ndef sos_gradient(v):\nreturn [2 * v_i for v_i in v]\ndef negate(function):\n\
  def new_function(*args, **kwargs):\nreturn np.negative(function(*args, **kwargs))\n\
  return new_function\ndef in_random_order(data):\nindexes = [i for i, _ in enumerate(data)]\n\
  random.shuffle(indexes)\nfor i in indexes:\nyield data[i]\nif __name__ == \"__main__\"\
  :\nv, x, y = rnd(), random_vectors(3), random_vectors(3)\ndata = list(zip(x, y))\n\
  theta, alpha = v, 0.01\nneg_gradient = negate(sos_gradient)\nn, x = 100, 1\nfor\
  \ i, row in enumerate(range(n)):\ny = np.linalg.norm(theta)\nplt.scatter(x, y, c=\"\
  r\")\nx = x + 1\ng = []\nfor x_i, y_i in in_random_order(data):\ng.extend([neg_gradient(theta),\
  \ neg_gradient(x_i),\nneg_gradient(y_i)])\nfor v in g:\ntheta = np.around(np.subtract(theta,alpha*np.array(v)),3)\n\
  g = []\nprint ('maximum:', np.around(theta, 4),\n'with', i+1, 'iterations')\nprint\
  \ ('magnitude of max vector:', np.linalg.norm(theta))\nplt.show()\n```\n\n输出：\n\n\
  ![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig11_HTML.jpg](img/462931_1_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-11** RSS 最大化\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figo_HTML.jpg](img/462931_1_En_4_Figo_HTML.jpg)\n\
  \n与第一个示例相比，代码中唯一的区别是`negate()`函数，它通过取反梯度来寻找最大值。由于 RSS 的最大值是无穷大（我们可以通过图 4-11 的可视化看出），我们可以在\
  \ 100 次迭代后停止。尝试 1000 次迭代，看看会发生什么。\n\n"
- "# 5. 数据工作\n\n数据工作详细介绍了数据科学问题解决的最早过程。第一步是识别问题，这决定了后续所有需要完成的工作。第二步是收集数据。第三步是整理（清洗）数据，这一步至关重要。数据整理是将数据转换为对机器学习和其他数据科学问题有用的形式。当然，整理后的数据可能还需要进行清洗。第四步是数据可视化。可视化有助于你了解数据，并有望识别出模式。\n\
  \n## 一维数据示例\n\n以下代码示例生成了两种非常常见的数据分布——均匀分布和正态分布的可视化。均匀分布具有恒定的概率。也就是说，属于该分布的所有事件概率相等。正态分布关于中心对称，这意味着其\
  \ 50%的值小于均值，50%的值大于均值。其形状类似于钟形曲线。正态分布极其重要，因为它为许多自然发生的事件建模。\n\n```python\nimport\
  \ matplotlib.pyplot as plt\nimport numpy as np\nif __name__ == \"__main__\":\nplt.figure('Uniform\
  \ Distribution')\nuniform = np.random.uniform(-3, 3, 1000)\ncount, bins, ignored\
  \ = plt.hist(uniform, 20, facecolor=\"lime\")\nplt.xlabel('Interval: [-3, 3]')\n\
  plt.ylabel('Frequency')\nplt.title('Uniform Distribution')\nplt.axis([-3,3,0,100])\n\
  plt.grid(True)\nplt.figure('Normal Distribution')\nnormal = np.random.normal(0,\
  \ 1, 1000)\ncount, bins, ignored = plt.hist(normal, 20, facecolor=\"fuchsia\")\n\
  plt.xlabel('Interval: [-3, 3]')\nplt.ylabel('Frequency')\nplt.title('Normal Distribution')\n\
  plt.axis([-3,3,0,140])\nplt.grid(True)\nplt.show()\n```\n\n输出：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig2_HTML.jpg](img/462931_1_En_5_Fig2_HTML.jpg)\n\
  \n**图 5-2** 正态分布\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig1_HTML.jpg](img/462931_1_En_5_Fig1_HTML.jpg)\n\
  \n**图 5-1** 均匀分布\n\n代码示例首先导入`matplotlib`和`numpy`。主块首先创建一个图形和用于均匀分布的数据。接着，基于这些数据创建并绘制直方图。然后创建并绘制正态分布的图形。参见图\
  \ 5-1 和图 5-2。\n\n\n\n### 二维数据示例\n\n对二维数据进行建模能更真实地呈现自然发生的事件。以下代码示例比较了两个具有相同均值和标准差（`SD`）的正态分布随机生成数据集。`SD`衡量一组数据值的变异（离散）程度。尽管两个数据集均呈正态分布且具有相同的均值和`SD`，但它们的联合分布（相关性）却截然不同。相关性是指两个变量之间的相互依存关系。\n\
  \n```\nimport matplotlib.pyplot as plt\nimport matplotlib.gridspec as gridspec\n\
  import numpy as np, random\nfrom scipy.special import ndtri\ndef inverse_normal_cdf(r):\n\
  return ndtri(r)\ndef random_normal():\nreturn inverse_normal_cdf(random.random())\n\
  def scatter(loc):\nplt.scatter(xs, ys1, marker='.', color=\"black\", label=\"ys1\"\
  )\nplt.scatter(xs, ys2, marker='.', color=\"gray\",  label='ys2')\nplt.xlabel('xs')\n\
  plt.ylabel('ys')\nplt.legend(loc=loc)\nplt.tight_layout()\nif __name__ == \"__main__\"\
  :\nxs = [random_normal() for _ in range(1000)]\nys1 = [ x + random_normal() / 2\
  \ for x in xs]\nys2 = [-x + random_normal() / 2 for x in xs]\ngs = gridspec.GridSpec(2,\
  \ 2)\nfig = plt.figure()\nax1 = fig.add_subplot(gs[0,0])\nplt.title('ys1 data')\n\
  n, bins, ignored = plt.hist(ys1, 50, normed=1,\nfacecolor='chartreuse', alpha=0.75)\n\
  ax2 = fig.add_subplot(gs[0,1])\nplt.title('ys2 data')\nn, bins, ignored = plt.hist(ys2,\
  \ 50, normed=1,\nfacecolor='fuchsia', alpha=0.75)\nax3 = fig.add_subplot(gs[1,:])\n\
  plt.title('Correlation')\nscatter(6)\nprint (np.corrcoef(xs, ys1)[0, 1])\nprint\
  \ (np.corrcoef(xs, ys2)[0, 1])\nplt.show()\n```\n\n输出：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig3_HTML.jpg](img/462931_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n正态分布与相关性的子图\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Figa_HTML.jpg](img/462931_1_En_5_Figa_HTML.jpg)\n\
  \n代码示例首先导入了`matplotlib`、`numpy`、`random`和`scipy`库。方法`gridspec`用于指定放置子图的网格几何结构。方法`ndtri`返回标准正态累积分布函数（`CDF`）。`CDF`是指随机变量`X`取值小于或等于`x`的概率，其中`x`代表正态分布曲线下的面积。代码接着定义了三个函数。函数`inverse_normal_cdf()`基于一个随机变量返回`CDF`。函数`random_normal()`调用函数`inverse_normal_cdf()`，传入一个随机生成的值`X`，并返回`CDF`。函数`scatter()`用于创建散点图。主程序块首先创建随机生成的`x`和`y`值`xs`、`ys1`和`ys2`。然后创建一个`gridspec()`来容纳这些分布。接着分别为`xs`、`ys1`数据和`xs`、`ys2`数据创建直方图。随后，为两个分布创建相关性图。最后，生成两个分布的相关性系数。图\
  \ 5-3 展示了这些图形。\n\n该代码示例揭示了两个重要启示。第一，使用`ndtri()`创建一组随机生成的数字会生成一个正态分布的数据集。也就是说，函数`ndtri()`返回的是随机生成值的`CDF`。第二，两个正态分布的数据集即使看起来相似，也未必真正相似。在本例中，它们的相关性是相反的。因此，需要通过可视化和相关性分析来展示数据集之间的差异。\n\
  \n## 数据相关性与基础统计\n\n相关性是指两个或多个变量共同波动（变化）的程度。相关矩阵是一个展示变量集之间相关系数的表格。相关系数衡量两个或多个变量之间关联的强度。\n\
  \n以下代码示例创建了三个具有`x`和`y`坐标的数据集，计算相关性并绘制图形。第一个数据集代表正相关；第二个代表负相关；第三个代表弱相关。\n\n```\n\
  import random, numpy as np\nimport matplotlib.pyplot as plt\nimport matplotlib.gridspec\
  \ as gridspec\nif __name__ == \"__main__\":\nnp.random.seed(0)\nx = np.random.randint(0,\
  \ 50, 1000)\ny = x + np.random.normal(0, 10, 1000)\nprint ('高度正相关:\\n', np.corrcoef(x,\
  \ y))\ngs = gridspec.GridSpec(2, 2)\nfig = plt.figure()\nax1 = fig.add_subplot(gs[0,0])\n\
  plt.title('正相关')\nplt.scatter(x, y, color=\"springgreen\")\ny = 100 - x + np.random.normal(0,\
  \ 10, 1000)\nprint ('\\n 高度负相关:\\n', np.corrcoef(x, y))\nax2 = fig.add_subplot(gs[0,1])\n\
  plt.title('负相关')\nplt.scatter(x, y, color=\"crimson\")\ny = np.random.normal(0,\
  \ 10, 1000)\nprint ('\\n 无/弱相关:\\n', np.corrcoef(x, y))\nax3 = fig.add_subplot(gs[1,:])\n\
  plt.title('弱相关')\nplt.scatter(x, y, color=\"peachpuff\")\nplt.tight_layout()\nplt.show()\n\
  ```\n\n输出：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig4_HTML.jpg](img/462931_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n相关性子图\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Figb_HTML.jpg](img/462931_1_En_5_Figb_HTML.jpg)\n\
  \n代码示例首先导入了`random`、`numpy`和`matplotlib`库。主程序块首先生成具有正相关关系的`x`和`y`坐标，并显示相关矩阵。接着创建一个网格来容纳子图，即第一个子图网格，并绘制散点图。然后，生成具有负相关关系的`x`和`y`坐标，并显示相关矩阵。创建并绘制第二个子图网格。最后，生成具有弱相关关系的`x`和`y`坐标，并显示相关矩阵。创建并绘制第三个子图网格，并显示所有三个散点图。图\
  \ 5-4 展示了这些图形。\n\n\n\n### Pandas 相关性分析与热力图示例\n\n`Pandas` 是一个 Python 包，它提供快速、灵活且富有表现力的数据结构，使得在实际数据分析中处理几乎任何类型的数据都变得简单、直观且实用。`DataFrame`（`df`）是一种二维标签化数据结构，也是\
  \ `pandas` 中最常用的对象。\n\n第一个代码示例创建了一个相关性矩阵及其可视化图表：\n\n```python\nimport random, numpy\
  \ as np, pandas as pd\nimport matplotlib.pyplot as plt\nimport matplotlib.cm as\
  \ cm\nimport matplotlib.colors as colors\nif __name__ == \"__main__\":\nnp.random.seed(0)\n\
  df = pd.DataFrame({'a': np.random.randint(0, 50, 1000)})\ndf['b'] = df['a'] + np.random.normal(0,\
  \ 10, 1000)\ndf['c'] = 100 - df['a'] + np.random.normal(0, 5, 1000)\ndf['d'] = np.random.randint(0,\
  \ 50, 1000)\ncolormap = cm.viridis\ncolorlist = [colors.rgb2hex(colormap(i))\nfor\
  \ i in np.linspace(0, 1, len(df['a']))]\ndf['colors'] = colorlist\nprint (df.corr())\n\
  pd.plotting.scatter_matrix(df, c=df['colors'], diagonal=\"d\",\nfigsize=(10, 6))\n\
  plt.show()\n```\n\n输出结果：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig5_HTML.jpg](img/462931_1_En_5_Fig5_HTML.jpg)\n\
  \n**图 5-5** 相关性矩阵可视化\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Figc_HTML.jpg](img/462931_1_En_5_Figc_HTML.jpg)\n\
  \n该代码示例首先导入了 `random`、`numpy`、`pandas` 和 `matplotlib` 库。`main` 块首先创建了一个包含四列数据的 `df`，这些列由各种随机数填充。接着，它为各列之间的相关性创建了一个颜色映射，打印出相关性矩阵，并绘制了该颜色映射图（图\
  \ 5-5）。\n\n从相关性矩阵中，我们可以看到相关性最强的变量是 `a` 和 `b`（0.83）、`a` 和 `c`（–0.95）以及 `b` 和 `c`（–0.79）。从颜色映射图中，我们可以看到\
  \ `a` 和 `b` 呈正相关，`a` 和 `c` 呈负相关，`b` 和 `c` 也呈负相关。然而，实际的相关性数值从该可视化图中并不明显。\n\n热力图是一种数据的图形化表示方式，其中矩阵中的各个数值以颜色来表示。它是数据科学中一种流行的可视化技术。使用\
  \ `pandas`，热力图可以提供一种精细的相关性可视化，其中每个变量都由其自身的颜色表示。\n\n第二个代码示例使用热力图来可视化变量间的相关性。如果你的电脑上尚未安装\
  \ `seaborn` 库，则需要先进行安装（例如，`pip install seaborn`）。\n\n```python\nimport random, numpy\
  \ as np, pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\
  if __name__ == \"__main__\":\nnp.random.seed(0)\ndf = pd.DataFrame({'a': np.random.randint(0,\
  \ 50, 1000)})\ndf['b'] = df['a'] + np.random.normal(0, 10, 1000)\ndf['c'] = 100\
  \ - df['a'] + np.random.normal(0, 5, 1000)\ndf['d'] = np.random.randint(0, 50, 1000)\n\
  plt.figure()\nsns.heatmap(df.corr(), annot=True, cmap=\"OrRd\")\nplt.show()\n```\n\
  \n输出结果：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig6_HTML.jpg](img/462931_1_En_5_Fig6_HTML.jpg)\n\
  \n**图 5-6** 热力图\n\n该代码首先导入了 `random`、`numpy`、`pandas`、`matplotlib` 和 `seaborn` 库。`Seaborn`\
  \ 是一个基于 `matplotlib` 的 Python 可视化库。`main` 块首先生成了四列数据（变量），并绘制了一张热力图（图 5-6）。属性 `cmap`\
  \ 用于指定颜色映射。`matplotlib` 的颜色映射列表可以在以下网址找到：[`https://matplotlib.org/examples/color/colormaps_reference.html`](https://matplotlib.org/examples/color/colormaps_reference.html)。\n\
  \n## 多种可视化示例\n\n第一个代码示例介绍了安德鲁斯曲线，这是一种可视化高维数据结构的方法。本示例使用的数据是鸢尾花数据集，它是模式识别文献中最著名的数据集之一。鸢尾花数据集包含三种不同类型的鸢尾花（Setosa、Versicolour\
  \ 和 Virginica）的花瓣和花萼长度。\n\n安德鲁斯曲线允许将多变量数据绘制成大量曲线，这些曲线使用样本的属性（变量）作为系数。通过为每个类别使用不同的颜色绘制曲线，可以可视化数据聚类。属于同一类别的样本的曲线通常会靠得更近，并形成更大的结构。鸢尾花数据集的原始数据位于以下\
  \ URL：\n\n[`https://raw.githubusercontent.com/pandas-dev/pandas/master/pandas/tests/data/iris.csv`](https://raw.githubusercontent.com/pandas-dev/pandas/master/pandas/tests/data/iris.csv)\n\
  \n```python\nimport matplotlib.pyplot as plt\nimport pandas as pd\nfrom pandas.plotting\
  \ import andrews_curves\nif __name__ == \"__main__\":\ndata = pd.read_csv('data/iris.csv')\n\
  plt.figure()\nandrews_curves(data, 'Name',\ncolor=['b','mediumspringgreen','r'])\n\
  plt.show()\n```\n\n输出结果：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig7_HTML.jpg](img/462931_1_En_5_Fig7_HTML.jpg)\n\
  \n**图 5-7** 安德鲁斯曲线\n\n该代码示例首先导入了 `matplotlib` 和 `pandas`。`main` 块首先将鸢尾花数据集读入 pandas\
  \ 的 `df` 数据中。接着，为每个类别——Iris-setosa、Iris-versicolor 和 Iris-virginica——绘制了安德鲁斯曲线（图\
  \ 5-7）。从该可视化图中，很难看出哪些属性能够清晰地区分每个类别。\n\n第二个代码示例介绍了平行坐标：\n\n```python\nimport matplotlib.pyplot\
  \ as plt\nimport pandas as pd\nfrom pandas.plotting import parallel_coordinates\n\
  if __name__ == \"__main__\":\ndata = pd.read_csv('data/iris.csv')\nplt.figure()\n\
  parallel_coordinates(data, 'Name',\ncolor=['b','mediumspringgreen','r'])\nplt.show()\n\
  ```\n\n输出结果：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig8_HTML.jpg](img/462931_1_En_5_Fig8_HTML.jpg)\n\
  \n**图 5-8** 平行坐标\n\n平行坐标是另一种绘制多变量数据的技术。它允许可视化数据中的聚类，并直观地估计其他统计量。数据点表示为相连的线段。每条垂直线代表一个属性。一组相连的线段代表一个数据点。倾向于聚类的点会显得更靠近。\n\
  \n该代码示例首先导入了 `matplotlib` 和 `pandas`。`main` 块首先将鸢尾花数据集读入 pandas 的 `df` 数据中。接着，为每个类别绘制了平行坐标图（图\
  \ 5-8）。从该可视化图中，属性 `PetalLength` 和 `PetalWidth` 对于这三个物种（鸢尾花的类别）来说区分度最高。因此，`PetalLength`\
  \ 和 `PetalWidth` 是区分鸢尾花物种的最佳分类器。而安德鲁斯曲线则未能清晰地提供这一重要信息。\n\n这里有一个有用的 URL：\n\n[`http://wilkelab.org/classes/SDS348/2016_spring/worksheets/class9.html`](http://wilkelab.org/classes/SDS348/2016_spring/worksheets/class9.html)\n\
  \n第三个代码示例介绍了 RadViz：\n\n```python\nimport matplotlib.pyplot as plt\nimport pandas\
  \ as pd\nfrom pandas.plotting import radviz\nif __name__ == \"__main__\":\ndata\
  \ = pd.read_csv('data/iris.csv')\nplt.figure()\nradviz(data, 'Name',\ncolor=['b','mediumspringgreen','r'])\n\
  plt.show()\n```\n\n输出结果：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig9_HTML.jpg](img/462931_1_En_5_Fig9_HTML.jpg)\n\
  \n**图 5-9** RadVis\n\nRadVis 是另一种用于可视化多变量数据的技术。该代码示例首先导入了 `matplotlib` 和 `pandas`。`main`\
  \ 块首先将鸢尾花数据集读入 pandas 的 `df` 数据中。接着，为每个类别绘制了 RadVis 坐标图（图 5-9）。使用这种可视化方法，很难看出任何区别。因此，就识别变异的能力而言（对于本例），平行坐标技术似乎是这三种方法中最好的。\n\
