  \n\n\n### 矩阵数学\n\n矩阵是一个由数字组成的数组。可以对矩阵执行多种运算，例如加法、减法、取反、乘法和除法。矩阵的维度是指其行数和列数，按此顺序表示。也就是说，一个\
  \ 2 × 3 的矩阵有两行三列。通常，一个 m × n 的矩阵有 m 行和 n 列。元素是矩阵中的一个条目。具体来说，矩阵 `A` 中位于 `row[i]`\
  \ 和 `column[j]` 的元素表示为 `a[i,j]`。最后，矩阵中的向量通常被视为列向量。因此，一个 2 × 3 的矩阵有三个向量（列），每个向量包含两个元素。在执行矩阵乘法或在数据科学算法中使用矩阵时，这是一个需要理解的重要概念。\n\
  \n第一个代码示例创建了一个 numpy 矩阵，将其乘以一个标量，计算了按行和按列的均值，从 numpy 数组创建了一个 numpy 矩阵，并按行和元素显示它：\n\
  \n```python\nimport numpy as np\ndef mult_scalar(m, s):\n    matrix = np.empty(m.shape)\n\
  \    m_shape = m.shape\n    for i, v in enumerate(range(m_shape[0])):\n        result\
  \ = [x * s for x in m[v]]\n        x = np.array(result[0])\n        matrix[i] =\
  \ x\n    return matrix\ndef display(m):\n    s = np.shape(m)\n    cols = s[1]\n\
  \    for i, row in enumerate(m):\n        print ('row', str(i) + ':', row, 'elements:',\
  \ end=' ')\n        for col in range(cols):\n            print (row[col], end='\
  \ ')\n        print ()\nif __name__ == \"__main__\":\n    v1, v2, v3 = [1, 7, -4],\
  \ [2, -3, 10], [3, 5, 6]\n    A = np.matrix([v1, v2, v3])\n    print ('matrix A:\\\
  n', A)\n    scalar = 0.5\n    B = mult_scalar(A, scalar)\n    print ('\\nmatrix\
  \ B:\\n', B)\n    mu_col = np.mean(A, axis=0, dtype=np.float64)\n    print ('\\\
  nmean A (column-wise):\\n', mu_col)\n    mu_row = np.mean(A, axis=1, dtype=np.float64)\n\
  \    print ('\\nmean A (row-wise):\\n', mu_row)\n    print ('\\nmatrix C:')\n  \
  \  C = np.array([[2, 14, -8], [4, -6, 20], [6, 10, 12]])\n    print (C)\n    print\
  \ ('\\ndisplay each row and element:')\n    display(C)\n```\n\n输出：\n\n![../images/462931_1_En_3_Chapter/462931_1_En_3_Figb_HTML.jpg](img/462931_1_En_3_Figb_HTML.jpg)\n\
  \n代码首先导入 `numpy`。接着是两个函数——`mult_scalar()` 和 `display()`。函数 `mult_scalar()` 将矩阵乘以一个标量。函数\
  \ `display()` 按行和行中的每个元素显示矩阵。主程序块创建了三个向量，并将它们添加到 numpy 矩阵 `A` 中。通过将标量 `0.5` 乘以 `A`\
  \ 来创建 `B`。接下来，按列和按行计算 `A` 的均值。最后，从三个 numpy 数组创建 numpy 矩阵 `C`，并按行和元素显示。\n\n第二个代码示例创建了一个\
  \ numpy 矩阵 `A`，对其列和行求和，计算了两个向量的点积，并计算了两个矩阵的点积。点积将两个向量相乘，得到一个可用于计算向量长度和向量之间夹角的大小。具体来说，两个向量\
  \ `a` 和 `b` 的点积是 `a[x] × b[x] + a[y] × b[y]`。\n\n对于矩阵乘法，点积从两个矩阵 `A` 和 `B` 生成矩阵 `C`。然而，当两个向量都被视为列矩阵时，它们不能相乘。为了解决这个问题，将\
  \ `A` 中的第一个向量转置，将其变成一个 1 × n 的行矩阵，这样它就可以与 `B` 中的第一个向量相乘并求和。现在乘积是良定义的，因为一个 1 × n\
  \ 矩阵与一个 n × 1 矩阵的乘积是一个 1 × 1 矩阵（一个标量）。要得到点积，对 `A` 和 `B` 中剩余的向量重复此过程。Numpy 包含一个方便的函数，可以为你计算点积，这大大简化了矩阵乘法。\n\
  \n```python\nimport numpy as np\ndef sum_cols(matrix):\n    return np.sum(matrix,\
  \ axis=0)\ndef sum_rows(matrix):\n    return np.sum(matrix, axis=1)\ndef dot(v,\
  \ w):\n    return np.dot(v, w)\nif __name__ == \"__main__\":\n    v1, v2, v3 = [1,\
  \ 7, -4], [2, -3, 10], [3, 5, 6]\n    A = np.matrix([v1, v2, v3])\n    print ('matrix\
  \ A:\\n', A)\n    v_cols = sum_cols(A)\n    print ('\\nsum A by column:\\n', v_cols)\n\
  \    v_rows = sum_rows(A)\n    print ('\\nsum A by row:\\n', v_rows)\n    dot_product\
  \ = dot(v1, v2)\n    print ('\\nvector 1:', v1)\n    print ('vector 2:', v2)\n \
  \   print ('\\ndot product v1 and v2:')\n    print (dot_product)\n    v1, v2, v3\
  \ = [-2, 5, 4], [1, 2, 9], [10, -9, 3]\n    B = np.matrix([v1, v2, v3])\n    print\
  \ ('\\nmatrix B:\\n', B)\n    C = A.dot(B)\n    print ('\\nmatrix C (dot product\
  \ A and B):\\n', C)\n    print ('\\nC by row:')\n    for i, row in enumerate(C):\n\
  \        print ('row', str(i) + ': ', end='')\n        for v in np.nditer(row):\n\
  \            print (v, end=' ')\n        print()\n```\n\n输出：\n\n![../images/462931_1_En_3_Chapter/462931_1_En_3_Figc_HTML.jpg](img/462931_1_En_3_Figc_HTML.jpg)\n\
  \n代码首先导入 `numpy`。接着是三个函数——`sum_cols()`、`sum_rows()` 和 `dot()`。函数 `sum_cols()` 对每一列求和，并返回一个包含这些值的行。函数\
  \ `sum_rows()` 对每一行求和，并返回一个包含这些值的列。函数 `dot()` 计算点积。主程序块首先创建三个向量，然后用它们创建矩阵 `A`。对\
  \ `A` 的列和行进行求和。然后计算两个向量（`v1` 和 `v2`）的点积。接下来，创建三个新向量，然后用它们创建矩阵 `B`。通过计算 `A` 和 `B`\
  \ 的点积来创建矩阵 `C`。最后，显示 `C` 的每一行。\n\n第三个代码示例展示了一个实际场景。假设一家公司销售三种馅饼——牛肉馅饼、鸡肉馅饼和蔬菜馅饼。牛肉馅饼每个售价\
  \ 3 美元，鸡肉馅饼每个售价 4 美元，蔬菜馅饼每个售价 2 美元。馅饼成本的向量表示为 `[3, 4, 2]`。你还知道周一至周四每种馅饼的销量。牛肉销量周一为\
  \ 13，周二为 9，周三为 7，周四为 15。因此牛肉销量的向量为 `[13, 9, 7, 15]`。使用同样的逻辑，鸡肉销量的向量为 `[8, 7, 4,\
  \ 6]`，蔬菜销量的向量为 `[6, 4, 0, 3]`。目标是计算四天（周一至周四）的总销售额。\n\n```python\nimport numpy as\
  \ np\ndef dot(v, w):\n    return np.dot(v, w)\ndef display(m):\n    for i, row in\
  \ enumerate(m):\n        print ('total sales by day:\\n', end='')\n        for v\
  \ in np.nditer(row):\n            print (v, end=' ')\n        print()\nif __name__\
  \ == \"__main__\":\n    a = [3, 4, 2]\n    A = np.matrix([a])\n    print ('cost\
  \ matrix A:\\n', A)\n    v1, v2, v3 = [13, 9, 7, 15], [8, 7, 4, 6], [6, 4, 0, 3]\n\
  \    B = np.matrix([v1, v2, v3])\n    print ('\\ndaily sales by item matrix B:\\\
  n', B)\n    C = A.dot(B)\n    print ('\\ndot product matrix C:\\n', C, '\\n')\n\
  \    display(C)\n```\n\n输出：\n\n![../images/462931_1_En_3_Chapter/462931_1_En_3_Figd_HTML.jpg](img/462931_1_En_3_Figd_HTML.jpg)\n\
  \n代码首先导入 `numpy`。接着是函数 `dot()`，它计算点积，以及函数 `display()`，它逐行显示矩阵的元素。主程序块首先创建一个包含每种馅饼成本的向量。然后将其转换为矩阵\
  \ `A`。接下来，创建三个向量，分别代表周一至周五每种馅饼的销量。代码继续将这三个向量转换为矩阵 `B`。通过求 `A` 和 `B` 的点积来创建矩阵 `C`。这个场景演示了点积如何用于解决商业问题。\n\
  \n第四个代码示例计算单个向量以及两个向量之间的模（距离）和方向（角度）：\n\n\n\n```python\nimport math, numpy as np\n\
  def sqrt_sum_squares(ls):\nreturn math.sqrt(sum(map(lambda x:x*x,ls)))\ndef mag(v):\n\
  return np.linalg.norm(v)\ndef a_tang(v):\nreturn math.degrees(math.atan(v[1]/v[0]))\n\
  def dist(v, w):\nreturn math.sqrt(((w[0]-v[0])** 2) + ((w[1]-v[1])** 2))\ndef mags(v,\
  \ w):\nreturn np.linalg.norm(v - w)\ndef a_tangs(v, w):\nval = (w[1] - v[1]) / (w[0]\
  \ - v[0])\nreturn math.degrees(math.atan(val))\nif __name__ == \"__main__\":\nv\
  \ = np.array([3, 4])\nprint ('single vector', str(v) + ':')\nprint ('magnitude:',\
  \ sqrt_sum_squares(v))\nprint ('NumPY magnitude:', mag(v))\nprint ('direction:',\
  \ round(a_tang(v)), 'degrees\\n')\nv1, v2 = np.array([2, 3]), np.array([5, 8])\n\
  print ('two vectors', str(v1) + ' and ' + str(v2) + ':')\nprint ('magnitude', round(dist(v1,\
  \ v2),2))\nprint ('NumPY magnitude:', round(mags(v1, v2),2))\nprint ('direction:',\
  \ round(a_tangs(v1, v2)), 'degrees\\n')\nv1, v2 = np.array([0, 0]), np.array([3,\
  \ 4])\nprint ('use origin (0,0) as 1st vector:')\nprint ('\"two vectors', str(v1)\
  \ + ' and ' + str(v2) + '\"')\nprint ('magnitude:', round(mags(v1, v2),2))\nprint\
  \ ('direction:', round(a_tangs(v1, v2)), 'degrees')\n```\n\n输出：\n\n![../images/462931_1_En_3_Chapter/462931_1_En_3_Fige_HTML.jpg](img/462931_1_En_3_Fige_HTML.jpg)\n\
  \n代码首先导入`math`和`numpy`库。接着定义了六个函数。函数`sqrt_sum_squares()`从零开始计算单个向量的模。函数`mag()`功能相同，但使用了`numpy`。函数`a_tang()`计算向量的反正切，即向量从原点`(0,0)`出发的方向（角度）。函数`dist()`从零开始计算两个向量之间的模。函数`mags()`功能相同，但使用了`numpy`。函数`a_tangs()`计算两个向量的反正切。主程序块创建一个向量，计算其模和方向，并显示结果。接着，计算并显示两个向量的模和方向。最后，使用两个向量的公式计算单个向量的模和方向。这是通过将原点`(0,0)`作为第一个向量来实现的。因此，不需要为单个向量计算模和方向的函数，因为任何单个向量总是从原点`(0,0)`出发。所以，一个向量就是空间中的一个点，要么从原点`(0,0)`测量，要么通过模和方向相对于另一个向量来测量。\n\
  \n## 基本矩阵变换\n\n第一个代码示例介绍了单位矩阵，它是一个主对角线元素为 1、其余元素为 0 的方阵。矩阵`A`与其单位矩阵的乘积是`A`，这在数学上很重要，因为乘法的单位元性质指出，任何数乘以\
  \ 1 都等于其本身。\n\n```python\nimport numpy as np\ndef slice_row(M, i):\nreturn M[i,:]\n\
  def slice_col(M, j):\nreturn M[:, j]\ndef to_int(M):\nreturn M.astype(np.int64)\n\
  if __name__ == \"__main__\":\nA = [[1, 9, 3, 6, 7],\n[4, 8, 6, 2, 1],\n[9, 8, 7,\
  \ 1, 2],\n[1, 1, 9, 2, 4],\n[9, 1, 1, 3, 5]]\nA = np.matrix(A)\nprint ('A:\\n',\
  \ A)\nprint ('\\n1st row: ', slice_row(A, 0))\nprint ('\\n3rd column:\\n', slice_col(A,\
  \ 2))\nshapeA = np.shape(A)\nI = np.identity(np.shape(A)[0])\nI = to_int(I)\nprint\
  \ ('\\nI:\\n', I)\ndot_product = np.dot(A, I)\nprint ('\\nA * I = A:\\n', dot_product)\n\
  print ('\\nA\\':\\n', A.I)\nA_by_Ainv = np.round(np.dot(A, A.I), decimals=0, out=None)\n\
  A_by_Ainv = to_int(A_by_Ainv)\nprint ('\\nA * A\\':\\n', A_by_Ainv)\n```\n\n输出：\n\
