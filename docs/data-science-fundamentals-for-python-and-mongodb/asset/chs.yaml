  \ 和来自评分数据集的 `movie_id`。每个列向量被转换为一个集合以去除重复项。使用列向量而非完整记录是为了加快处理速度。接下来，返回一个新的列向量，其中仅包含已被评分的电影。代码继续获取\
  \ `movie_id` 为 1 的每部电影的评分、用户、年龄和性别的标题和列向量。显示该电影的平均评分及其标题和评分数量。代码的最后部分创建了一个生成器，其中包含一个字典元素列表。每个字典元素包含\
  \ `movie_id`、标题、平均评分、平均年龄、评分数量、男性评分者数量和女性评分者数量。接着，创建另一个生成器来生成该列表。创建生成器是瞬间完成的，但展开（解包）内容需要时间。请记住，第一个生成器运行数十亿次进程，第二个生成器运行第一个生成器。因此，将内容保存到\
