  \n### 梯度下降\n\n梯度下降（GD）是一种最小化（或最大化）函数的算法。应用时，从一组函数参数的初始值开始，迭代地向一组使函数最小化的参数值移动。迭代最小化是通过微积分实现的，即沿着函数梯度的负方向迈出步长。GD\
  \ 很重要，因为优化是机器学习的重要组成部分。此外，GD 易于实现、通用且高效（快速）。\n\n\n\n### 简单函数的最小化（与最大化）\n\n梯度下降法是一种一阶迭代优化算法，用于寻找函数\
  \ `f` 的最小值。一个函数可以表示为 `f` 或 `f(x)`。简单来说，梯度下降法通过最小化（或最大化）一个代价函数来找到最小误差。代价函数是你想要最小化的东西。\n\
  \n让我们从一个最小化的例子开始。为了找到 `f` 的局部最小值，需要沿着当前点 `f` 的负梯度方向，按比例迈出步长。梯度就是 `f` 的导数（变化率）。梯度下降法唯一的缺点是它找到的是局部最小值，而不是整个函数的最小值。\n\
  \n幂法则用于对形如 `f(x) = x^r` 的函数求导：\n\n![$$ \\frac{d}{dx}\\kern0.125em {\\mathrm{x}}^{\\\
  mathrm{n}}={\\mathrm{n}\\mathrm{x}}^{\\mathrm{n}-1} $$](img/462931_1_En_4_Chapter_TeX_Equa.png)\n\
  \n所以，`x^n` 的导数等于 `nx^(n−1)`。简单来说，导数就是指数乘以 `x`，且指数减 1。为了最小化 `f(x) = x⁴ – 3x³ + 2`，需要找到它的导数，即\
  \ `f'(x) = 4x³ – 9x²`。因此，第一步总是找到导数 `f'(x)`。第二步是绘制原始函数图像，以了解其形状。第三步是运行梯度下降法。第四步是绘制局部最小值。\n\
  \n第一个例子找到了 `f(x)` 的局部最小值，并在子图中显示了 `f(x)`、`f'(x)` 和最小值，如图 4-1 所示：\n\n```\nimport\
  \ matplotlib.pyplot as plt, numpy as np\ndef f(x):\nreturn x**4 - 3 * x**3 + 2\n\
  def df(x):\nreturn 4 * x**3 - 9 * x**2\nif __name__ == \"__main__\":\nx = np.arange(-5,\
  \ 5, 0.2)\ny, y_dx = f(x), df(x)\nf, axarr = plt.subplots(3, sharex=True)\naxarr[0].plot(x,\
  \ y, color=\"mediumspringgreen\")\naxarr[0].set_xlabel('x')\naxarr[0].set_ylabel('f(x)')\n\
  axarr[0].set_title('f(x)')\naxarr[1].plot(x, y_dx, color=\"coral\")\naxarr[1].set_xlabel('x')\n\
  axarr[1].set_ylabel('dy/dx(x)')\naxarr[1].set_title('derivative of f(x)')\naxarr[2].set_xlabel('x')\n\
  axarr[2].set_ylabel('GD')\naxarr[2].set_title('local minimum')\niterations, cur_x,\
  \ gamma, precision = 0, 6, 0.01, 0.00001\nprevious_step_size = cur_x\nwhile previous_step_size\
  \ > precision:\nprev_x = cur_x\ncur_x += -gamma * df(prev_x)\nprevious_step_size\
  \ = abs(cur_x - prev_x)\niterations += 1\naxarr[2].plot(prev_x, cur_x, \"o\")\n\
  f.subplots_adjust(hspace=0.3)\nf.tight_layout()\nplt.show()\nprint ('minimum:',\
  \ cur_x, '\\niterations:', iterations)\n```\n\n输出：\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figa_HTML.jpg](img/462931_1_En_4_Figa_HTML.jpg)\n\
  \n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig1_HTML.jpg](img/462931_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n`f(x)`、`f'(x)` 和局部最小值的子图可视化\n\n代码示例首先导入 `matplotlib` 和 `numpy`。接着定义了用于绘制原始函数的函数\
  \ `f(x)` 和用于绘制导数的函数 `df(x)`。主程序块首先为 `f(x)` 创建数值。接着创建一个子图。梯度下降法从初始化变量开始。变量 `cur_x`\
  \ 是模拟的起始点。变量 `gamma` 是步长。变量 `precision` 是容差。容差越小，精度越高，但需要更多的迭代次数（资源）。模拟持续进行，直到 `previous_step_size`\
  \ 大于 `precision`。每次迭代都将 `-gamma`（步长）乘以当前点的梯度（导数），以将其移向局部最小值。然后，变量 `previous_step_size`\
  \ 被赋值为 `cur_x` 和 `prev_x` 之间的差值。每个点都被绘制出来。求解 `x` 得到的 `f(x)` 最小值约为 2.25。我知道这个结果是正确的，因为我手动计算过。关于如何手动计算的精彩课程，请查看\
  \ [`http://www.dummies.com/education/math/calculus/how-to-find-local-extrema-with-the-first-derivative-test/`](http://www.dummies.com/education/math/calculus/how-to-find-local-extrema-with-the-first-derivative-test/)。\n\
  \n第二个例子找到了 `f(x) = x³ – 6x² + 9x + 15` 的局部最小值和最大值。首先找到 `f'(x)`，即 `3x² – 12x + 9`。接着，找到局部最小值、绘图、局部最大值、绘图。在这种情况下我没有使用子图，因为可视化效果不够丰富。也就是说，通过观察\
  \ `f(x)` 的图形更容易看出近似的局部最小值和最大值，也更容易理解梯度下降法是如何发挥其魔力的。\n\n```\nimport matplotlib.pyplot\
  \ as plt, numpy as np\ndef f(x):\nreturn x**3 - 6 * x**2 + 9 * x + 15\ndef df(x):\n\
  return 3 * x**2 - 12 * x + 9\nif __name__ == \"__main__\":\nx = np.arange(-0.5,\
  \ 5, 0.2)\ny = f(x)\nplt.figure('f(x)')\nplt.xlabel('x')\nplt.ylabel('f(x)')\nplt.title('f(x)')\n\
  plt.plot(x, y, color=\"blueviolet\")\nplt.figure('local minimum')\nplt.xlabel('x')\n\
  plt.ylabel('GD')\nplt.title('local minimum')\niterations, cur_x, gamma, precision\
  \ = 0, 6, 0.01, 0.00001\nprevious_step_size = cur_x\nwhile previous_step_size >\
  \ precision:\nprev_x = cur_x\ncur_x += -gamma * df(prev_x)\nprevious_step_size =\
  \ abs(cur_x - prev_x)\niterations += 1\nplt.plot(prev_x, cur_x, \"o\")\nlocal_min\
  \ = cur_x\nprint ('minimum:', local_min, 'iterations:', iterations)\nplt.figure('local\
  \ maximum')\nplt.xlabel('x')\nplt.ylabel('GD')\nplt.title('local maximum')\niterations,\
  \ cur_x, gamma, precision = 0, 0.5, 0.01, 0.00001\nprevious_step_size = cur_x\n\
  while previous_step_size > precision:\nprev_x = cur_x\ncur_x += -gamma * -df(prev_x)\n\
  previous_step_size = abs(cur_x - prev_x)\niterations += 1\nplt.plot(prev_x, cur_x,\
  \ \"o\")\nlocal_max = cur_x\nprint ('maximum:', local_max, 'iterations:', iterations)\n\
  plt.show()\n```\n\n输出：\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig4_HTML.jpg](img/462931_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\n函数 `f(x)` 的局部最大值\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig3_HTML.jpg](img/462931_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\n函数 `f(x)` 的局部最小值\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig2_HTML.jpg](img/462931_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n函数 `f(x)`\n\n![../images/462931_1_En_4_Chapter/462931_1_En_4_Figb_HTML.jpg](img/462931_1_En_4_Figb_HTML.jpg)\n\
  \n代码首先导入 `matplotlib` 和 `numpy` 库。接着定义了函数 `f(x)` 和 `df(x)`，它们分别用算法表示了原始函数及其导数。主程序块首先为\
  \ `f(x)` 创建数据并绘制其图形。接着找到局部最小值和最大值，并绘制它们。注意，用于局部最小值的 `cur_x`（起始点）是 6，而用于局部最大值的则是\
  \ 0.5。这就是数据科学与其说是科学，不如说是艺术的地方，因为这些点是我通过反复试验找到的。还要注意，用于局部最大值的梯度下降法是导数的相反数。同样，我知道结果是正确的，因为我手动计算了局部最小值和最大值。在这个例子中，我使用单独的图形而不是子图的主要原因是，为了说明绘制\
  \ `f(x)` 图形是多么重要。仅通过观察图形，你就能看出 `f(x)` 的 `x` 的局部最大值接近 1，而 `f(x)` 的 `x` 的局部最小值接近 3。此外，从这个图形中你可以看到，该函数有一个大于\
  \ 1 的全局最大值。图 4-2、4-3 和 4-4 提供了这些可视化结果。\n\n\n\n### Sigmoid 函数的最小化（与最大化）\n\nSigmoid\
  \ 函数是一种数学函数，其曲线呈 S 形或 sigmoid 曲线。它在数据科学中非常重要，原因如下。首先，它相对于网络参数易于求导，这对于训练神经网络至关重要。其次，许多常见概率分布的累积分布函数都是\
  \ sigmoid 形的。第三，许多自然过程（例如，复杂的学习曲线）随时间推移会遵循 sigmoid 曲线。因此，在没有特定数学模型可用时，通常会使用 sigmoid\
  \ 函数。\n\n第一个示例寻找 sigmoid 函数的局部最小值：\n\n```python\nimport matplotlib.pyplot as plt,\
  \ numpy as np\ndef sigmoid(x):\nreturn 1 / (1 + np.exp(-x))\ndef df(x):\nreturn\
  \ x * (1-x)\nif __name__ == \"__main__\":\nx = np.arange(-10., 10., 0.2)\ny, y_dx\
  \ = sigmoid(x), df(x)\nf, axarr = plt.subplots(3, sharex=True)\naxarr[0].plot(x,\
  \ y, color=\"lime\")\naxarr[0].set_xlabel('x')\naxarr[0].set_ylabel('f(x)')\naxarr[0].set_title('Sigmoid\
  \ Function')\naxarr[1].plot(x, y_dx, color=\"coral\")\naxarr[1].set_xlabel('x')\n\
  axarr[1].set_ylabel('dy/dx(x)')\naxarr[1].set_title('Derivative of f(x)')\naxarr[2].set_xlabel('x')\n\
  axarr[2].set_ylabel('GD')\naxarr[2].set_title('local minimum')\niterations, cur_x,\
  \ gamma, precision = 0, 0.01, 0.01, 0.00001\nprevious_step_size = cur_x\nwhile previous_step_size\
  \ > precision:\nprev_x = cur_x\ncur_x += -gamma * df(prev_x)\nprevious_step_size\
  \ = abs(cur_x - prev_x)\niterations += 1\nplt.plot(prev_x, cur_x, \"o\")\nf.subplots_adjust(hspace=0.3)\n\
  f.tight_layout()\nprint ('minimum:', cur_x, '\\niterations:', iterations)\nplt.show()\n\
