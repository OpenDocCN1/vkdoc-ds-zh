  \n代码示例首先导入了 `json`。函数 `dump_json()` 和 `read_json()` 分别用于保存和读取 JSON 数据。主程序块通过创建一个字典\
  \ `d`、为每只股票创建字典，并按天和属性向每只股票的字典添加数据，从而创建了一个立方体。代码继续将立方体保存到 JSON 文件 `cube.json` 中。最后，代码读取\
  \ `cube.json` 并显示立方体的一个切片。\n\n\n\n### 数据缩放与整理\n\n数据缩放是指改变数据的类型、离散程度和/或位置，以便比较原本无法比较的数据。数据缩放在数据科学中非常常见。第一种技术是**均值中心化**，它通过减去均值来转换数据。第二种技术是**归一化**，它将数据转换到\
  \ 0 到 1 的范围内。第三种技术是**标准化**，它将数据转换为均值为 0、方差为 1（标准差 = 1）的形式，通常称为标准正态分布。\n\n第一个代码示例生成一个正态分布并对其进行中心化：\n\
  \n```\nimport numpy as np\nimport matplotlib.pyplot as plt\ndef rnd_nrml(m, s, n):\n\
  return np.random.normal(m, s, n)\ndef ctr(d):\nreturn [x-np.mean(d) for x in d]\n\
  if __name__ == \"__main__\":\nmu, sigma, n, c1, c2, b = 10, 15, 100, 'pink',\\\n\
  'springgreen', True\ns = rnd_nrml(mu, sigma, n)\nplt.figure()\nax = plt.subplot(211)\n\
  ax.set_title('normal distribution')\ncount, bins, ignored = plt.hist(s, 30, color=c1,\
  \ normed=b)\nsc = ctr(s)\nax = plt.subplot(212)\nax.set_title('normal distribution\
  \ \"centered\"')\ncount, bins, ignored = plt.hist(sc, 30, color=c2, normed=b)\n\
  plt.tight_layout()\nplt.show()\n```\n\n输出：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig10_HTML.jpg](img/462931_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10\n\n数据中心化的子图\n\n代码示例首先导入 `numpy` 和 `matplotlib`。函数 `rnd_nrml()` 根据均值 (`mu`)、标准差\
  \ (`sigma`) 和数据点数量 (`n`) 生成一个正态分布。函数 `ctr()` 从每个数据点中减去均值。主程序块首先创建正态分布，然后绘制原始分布和中心化后的分布（图\
  \ 5-10）。请注意，两个分布的形状完全相同，但第二个分布的中心化均值为 0。\n\n第二个代码示例生成一个正态分布并对其进行归一化：\n\n```\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\ndef rnd_nrml(m, s, n):\nreturn np.random.normal(m,\
  \ s, n)\ndef nrml(d):\nreturn [(x-np.amin(d))/(np.amax(d)-np.amin(d)) for x in d]\n\
  if __name__ == \"__main__\":\nmu, sigma, n, c1, c2, b = 10, 15, 100, 'orchid',\\\
  \n'royalblue', True\ns = rnd_nrml(mu, sigma, n)\nplt.figure()\nax = plt.subplot(211)\n\
  ax.set_title('normal distribution')\ncount, bins, ignored = plt.hist(s, 30, color=c1,\
  \ normed=b)\nsn = nrml(s)\nax = plt.subplot(212)\nax.set_title('normal distribution\
  \ \"normalized\"')\ncount, bins, ignored = plt.hist(sn, 30, color=c2, normed=b)\n\
  plt.tight_layout()\nplt.show()\n```\n\n输出：\n\n![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig11_HTML.jpg](img/462931_1_En_5_Fig11_HTML.jpg)\n\
