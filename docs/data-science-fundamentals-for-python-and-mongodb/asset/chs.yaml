  \ JSON 文件 `audio.json` 中。最后，加载 `audio.json` 并显示几条记录，以确保一切正常。\n\n## 切片与切块\n\n切片与切块是将数据分解成更小的部分或视图，以便更好地理解数据，并以各种不同且有用的方式将其呈现为信息。在多维数组中，切片是对应于感兴趣维度的一个或多个成员的单个值的数据列。切片是在特定属性上进行过滤，而切块则类似于缩放功能，它选择所有维度的子集，但仅针对维度的特定值。\n\
