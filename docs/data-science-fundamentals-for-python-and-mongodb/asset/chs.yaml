- "# 6. 探索数据\n\n探索深入数据的领域。数据科学中的一个重要主题是降维。本章借用第 5 章中整理过的数据来演示其工作原理。另一个主题是速度模拟。处理大型数据集时，速度至关重要。大数据通过学术界和工业界广泛使用的一个流行数据集进行探索。最后，Twitter\
  \ 和网络爬虫是两个重要的数据探索来源。\n\n## 热力图\n\n热力图在第 5 章中介绍过，但当时没有为整理后的数据集创建热力图。因此，我们首先为 `wrangled.json`\
  \ 数据创建一个热力图可视化。\n\n```python\nimport json, pandas as pd\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\ndef read_json(f):\n    with open(f) as f:\n   \
  \     return json.load(f)\ndef verify_keys(d, **kwargs):\n    data = d[0].items()\n\
  \    k1 = set([tup[0] for tup in data])\n    s = kwargs.items()\n    k2 = set([tup[1]\
  \ for tup in s])\n    return list(k1.intersection(k2))\ndef build_ls(k, d):\n  \
  \  return [{k: row[k] for k in (keys)} for row in d]\ndef get_rows(d, n):\n    [print(row)\
  \ for i, row in enumerate(d) if i < n]\ndef conv_float(d):\n    return [dict([k,\
  \ float(v)] for k, v in row.items()) for row in d]\nif __name__ == \"__main__\"\
  :\n    f= 'data/wrangled.json'\n    data = read_json(f)\n    keys = verify_keys(data,\
  \ c1=\"sale\", c2=\"quan\", c3=\"disc\", c4=\"prof\")\n    heat = build_ls(keys,\
  \ data)\n    print ('\"heat\" 中的第一行：')\n    get_rows(heat, 1)\n    heat = conv_float(heat)\n\
  \    print ('\\n 转换为浮点数后的 \"heat\" 第一行：')\n    get_rows(heat, 1)\n    df = pd.DataFrame(heat)\n\
  \    plt.figure()\n    sns.heatmap(df.corr(), annot=True, cmap=\"OrRd\")\n    plt.show()\n\
  ```\n\n输出：\n\n![../images/462931_1_En_6_Chapter/462931_1_En_6_Fig1_HTML.jpg](img/462931_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n热力图\n\n![../images/462931_1_En_6_Chapter/462931_1_En_6_Figa_HTML.jpg](img/462931_1_En_6_Figa_HTML.jpg)\n\
  \n代码示例首先导入 `json`、`pandas`、`matplotlib` 和 `seaborn` 库。函数 `read_json()` 读取 JSON 文件。函数\
  \ `verify_keys()` 确保感兴趣的键存在于 JSON 文件中。这一点很重要，因为我们只能基于数值变量创建热力图，而 JSON 文件中唯一的候选变量是销售额、数量、折扣和利润。函数\
  \ `build_ls()` 基于数值变量构建一个字典元素列表。函数 `get_rows()` 从列表中返回 `n` 行。函数 `conv_float()` 将字典元素转换为浮点数。主程序块首先读取\
  \ JSON 文件 `wrangled.json`。接着，它仅获取数值变量的键。然后，它基于相应的键构建一个字典元素列表（`heat`）。代码显示 `heat`\
  \ 中的第一行以验证所有值是否为浮点数。由于它们不是，代码将它们转换为浮点数。然后，代码从 `heat` 创建一个 `df` 并绘制热力图（图 6-1）。\n\n\
  \n\n### 主成分分析\n\n主成分分析（PCA）用于寻找数据的主成分。主成分代表了数据中的潜在结构，因为它们揭示了数据方差最大（即数据最分散）的方向。PCA\
  \ 利用特征向量和特征值来揭示数据方差。特征向量代表一个方向，而特征值则是一个数值，表示数据在该特征向量方向上的方差。具有最高特征值的特征向量就是主成分。一个数据集可以分解为特征向量和特征值。数据集中特征向量（及特征值）的数量等于其维度数。由于`wrangled.json`数据集有四个维度（变量），因此它包含四个特征向量/特征值。\n\
  \n第一个代码示例对`wrangled.json`数据集执行了 PCA。然而，PCA 仅适用于数值型数据，因此数据集被精简为仅包含这些数值特征。\n\n```python\n\
  import matplotlib.pyplot as plt, pandas as pd\nimport numpy as np, json, random\
  \ as rnd\nfrom sklearn.preprocessing import StandardScaler\nfrom pandas.plotting\
  \ import parallel_coordinates\ndef read_json(f):\nwith open(f) as f:\nreturn json.load(f)\n\
  def unique_features(k, d):\nreturn list(set([dic[k] for dic in d]))\ndef sire_features(k,\
  \ d):\nreturn [{k: row[k] for k in (k)} for row in d]\ndef sire_numeric(k, d):\n\
  s = conv_float(sire_features(k, d))\nreturn s\ndef sire_sample(k, v, d, m):\nindices\
  \ = np.arange(0, len(d), 1)\ns = [d[i] for i in indices if d[i][k] == v]\nn = len(s)\n\
  num_keys = ['sale', 'quan', 'disc', 'prof']\nfor i, row in enumerate(s):\nfor k\
  \ in num_keys:\nrow[k] = float(row[k])\ns = rnd_sample(m, len(s), s)\nreturn (s,\
  \ n)\ndef rnd_sample(m, n, d):\nindices = sorted(rnd.sample(range(n), m))\nreturn\
  \ [d[i] for i in indices]\ndef conv_float(d):\nreturn [dict([k, float(v)] for k,\
  \ v in row.items()) for row in d]\nif __name__ == \"__main__\":\nf = 'data/wrangled.json'\n\
  data = read_json(f)\nsegm = unique_features('segm', data)\nprint ('classes in \"\
  segm\" feature:')\nprint (segm)\nkeys = ['sale', 'quan', 'disc', 'prof', 'segm']\n\
  features = sire_features(keys, data)\nnum_keys = ['sale', 'quan', 'disc', 'prof']\n\
  numeric_data = sire_numeric(num_keys, features)\nk, v = \"segm\", \"Home Office\"\
  \nm = 100\ns_home = sire_sample(k, v, features, m)\nv = \"Consumer\"\ns_cons = sire_sample(k,\
  \ v, features, m)\nv = \"Corporate\"\ns_corp = sire_sample(k, v, features, m)\n\
  print ('\\nHome Office slice:', s_home[1])\nprint('Consumer slice:', s_cons[1])\n\
  print ('Coporate slice:', s_corp[1])\nprint ('sample size:', m)\ndf_home = pd.DataFrame(s_home[0])\n\
  df_cons = pd.DataFrame(s_cons[0])\ndf_corp = pd.DataFrame(s_corp[0])\nframes = [df_home,\
  \ df_cons, df_corp]\nresult = pd.concat(frames)\nplt.figure()\nparallel_coordinates(result,\
  \ 'segm', color=\n['orange','lime','fuchsia'])\ndf = pd.DataFrame(numeric_data)\n\
  X = df.ix[:].values\nX_std = StandardScaler().fit_transform(X)\nmean_vec = np.mean(X_std,\
  \ axis=0)\ncov_mat = np.cov(X_std.T)\nprint ('\\ncovariance matrix:\\n', cov_mat)\n\
  eig_vals, eig_vecs = np.linalg.eig(cov_mat)\nprint ('\\nEigenvectors:\\n', eig_vecs)\n\
  print ('\\nEigenvalues:\\n', np.sort(eig_vals)[::-1])\ntot = sum(eig_vals)\nvar_exp\
  \ = [(i / tot)*100 for i in sorted(eig_vals, reverse=True)]\nprint ('\\nvariance\
  \ explained:\\n', var_exp)\ncorr_mat = np.corrcoef(X.T)\nprint ('\\ncorrelation\
  \ matrix:\\n', corr_mat)\neig_vals, eig_vecs = np.linalg.eig(corr_mat)\nprint ('\\\
  nEigenvectors:\\n', eig_vecs)\nprint ('\\nEigenvalues:\\n', np.sort(eig_vals)[::-1])\n\
  tot = sum(eig_vals)\nvar_exp = [(i / tot)*100 for i in sorted(eig_vals, reverse=True)]\n\
  print ('\\nvariance explained:\\n', var_exp)\ncum_var_exp = np.cumsum(var_exp)\n\
  fig, ax = plt.subplots()\nlabels = ['PC1', 'PC2', 'PC3', 'PC4']\nwidth = 0.35\n\
  index = np.arange(len(var_exp))\nax.bar(index, var_exp,\ncolor=['fuchsia', 'lime',\
  \ 'thistle', 'thistle'])\nfor i, v in enumerate(var_exp):\nv = round(v, 2)\nval\
  \ = str(v) + '%'\nax.text(i, v+0.5, val, ha=\"center\", color=\"b\",\nfontsize=9,\
  \ fontweight=\"bold\")\nplt.xticks(index, labels)\nplt.title('Variance Explained')\n\
