    # 简单函数的最小化（与最大化）


    梯度下降法是一种一阶迭代优化算法，用于寻找函数 `f` 的最小值。一个函数可以表示为 `f` 或 `f(x)`。简单来说，梯度下降法通过最小化（或最大化）一个代价函数来找到最小误差。代价函数是你想要最小化的东西。


    让我们从一个最小化的例子开始。为了找到 `f` 的局部最小值，需要沿着当前点 `f` 的负梯度方向，按比例迈出步长。梯度就是 `f` 的导数（变化率）。梯度下降法唯一的缺点是它找到的是局部最小值，而不是整个函数的最小值。


    幂法则用于对形如 `f(x) = x^r` 的函数求导：


    ![$$ \frac{d}{dx}\kern0.125em {\mathrm{x}}^{\mathrm{n}}={\mathrm{n}\mathrm{x}}^{\mathrm{n}-1}
    $$](img/462931_1_En_4_Chapter_TeX_Equa.png)


    所以，`x^n` 的导数等于 `nx^(n−1)`。简单来说，导数就是指数乘以 `x`，且指数减 1。为了最小化 `f(x) = x⁴ – 3x³ + 2`，需要找到它的导数，即
    `f''(x) = 4x³ – 9x²`。因此，第一步总是找到导数 `f''(x)`。第二步是绘制原始函数图像，以了解其形状。第三步是运行梯度下降法。第四步是绘制局部最小值。


    第一个例子找到了 `f(x)` 的局部最小值，并在子图中显示了 `f(x)`、`f''(x)` 和最小值，如图 4-1 所示：


    ```

    import matplotlib.pyplot as plt, numpy as np

    def f(x):

    return x**4 - 3 * x**3 + 2

    def df(x):

    return 4 * x**3 - 9 * x**2

    if __name__ == "__main__":

    x = np.arange(-5, 5, 0.2)

    y, y_dx = f(x), df(x)

    f, axarr = plt.subplots(3, sharex=True)

    axarr[0].plot(x, y, color="mediumspringgreen")

    axarr[0].set_xlabel(''x'')

    axarr[0].set_ylabel(''f(x)'')

    axarr[0].set_title(''f(x)'')

    axarr[1].plot(x, y_dx, color="coral")

    axarr[1].set_xlabel(''x'')

    axarr[1].set_ylabel(''dy/dx(x)'')

    axarr[1].set_title(''derivative of f(x)'')

    axarr[2].set_xlabel(''x'')

    axarr[2].set_ylabel(''GD'')

    axarr[2].set_title(''local minimum'')

    iterations, cur_x, gamma, precision = 0, 6, 0.01, 0.00001

    previous_step_size = cur_x

    while previous_step_size > precision:

    prev_x = cur_x

    cur_x += -gamma * df(prev_x)

    previous_step_size = abs(cur_x - prev_x)

    iterations += 1

    axarr[2].plot(prev_x, cur_x, "o")

    f.subplots_adjust(hspace=0.3)

    f.tight_layout()

    plt.show()

    print (''minimum:'', cur_x, ''\niterations:'', iterations)

    ```


    输出：


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Figa_HTML.jpg](img/462931_1_En_4_Figa_HTML.jpg)


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig1_HTML.jpg](img/462931_1_En_4_Fig1_HTML.jpg)


    图 4-1


    `f(x)`、`f''(x)` 和局部最小值的子图可视化


    代码示例首先导入 `matplotlib` 和 `numpy`。接着定义了用于绘制原始函数的函数 `f(x)` 和用于绘制导数的函数 `df(x)`。主程序块首先为
    `f(x)` 创建数值。接着创建一个子图。梯度下降法从初始化变量开始。变量 `cur_x` 是模拟的起始点。变量 `gamma` 是步长。变量 `precision`
    是容差。容差越小，精度越高，但需要更多的迭代次数（资源）。模拟持续进行，直到 `previous_step_size` 大于 `precision`。每次迭代都将
    `-gamma`（步长）乘以当前点的梯度（导数），以将其移向局部最小值。然后，变量 `previous_step_size` 被赋值为 `cur_x` 和
    `prev_x` 之间的差值。每个点都被绘制出来。求解 `x` 得到的 `f(x)` 最小值约为 2.25。我知道这个结果是正确的，因为我手动计算过。关于如何手动计算的精彩课程，请查看
    [`http://www.dummies.com/education/math/calculus/how-to-find-local-extrema-with-the-first-derivative-test/`](http://www.dummies.com/education/math/calculus/how-to-find-local-extrema-with-the-first-derivative-test/)。


    第二个例子找到了 `f(x) = x³ – 6x² + 9x + 15` 的局部最小值和最大值。首先找到 `f''(x)`，即 `3x² – 12x + 9`。接着，找到局部最小值、绘图、局部最大值、绘图。在这种情况下我没有使用子图，因为可视化效果不够丰富。也就是说，通过观察
    `f(x)` 的图形更容易看出近似的局部最小值和最大值，也更容易理解梯度下降法是如何发挥其魔力的。


    ```

    import matplotlib.pyplot as plt, numpy as np

    def f(x):

    return x**3 - 6 * x**2 + 9 * x + 15

    def df(x):

    return 3 * x**2 - 12 * x + 9

    if __name__ == "__main__":

    x = np.arange(-0.5, 5, 0.2)

    y = f(x)

    plt.figure(''f(x)'')

    plt.xlabel(''x'')

    plt.ylabel(''f(x)'')

    plt.title(''f(x)'')

    plt.plot(x, y, color="blueviolet")

    plt.figure(''local minimum'')

    plt.xlabel(''x'')

    plt.ylabel(''GD'')

    plt.title(''local minimum'')

    iterations, cur_x, gamma, precision = 0, 6, 0.01, 0.00001

    previous_step_size = cur_x

    while previous_step_size > precision:

    prev_x = cur_x

    cur_x += -gamma * df(prev_x)

    previous_step_size = abs(cur_x - prev_x)

    iterations += 1

    plt.plot(prev_x, cur_x, "o")

    local_min = cur_x

    print (''minimum:'', local_min, ''iterations:'', iterations)

    plt.figure(''local maximum'')

    plt.xlabel(''x'')

    plt.ylabel(''GD'')

    plt.title(''local maximum'')

    iterations, cur_x, gamma, precision = 0, 0.5, 0.01, 0.00001

    previous_step_size = cur_x

    while previous_step_size > precision:

    prev_x = cur_x

    cur_x += -gamma * -df(prev_x)

    previous_step_size = abs(cur_x - prev_x)

    iterations += 1

    plt.plot(prev_x, cur_x, "o")

    local_max = cur_x

    print (''maximum:'', local_max, ''iterations:'', iterations)

    plt.show()

    ```


