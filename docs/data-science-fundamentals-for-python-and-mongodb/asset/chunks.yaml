    # Pandas 相关性分析与热力图示例


    `Pandas` 是一个 Python 包，它提供快速、灵活且富有表现力的数据结构，使得在实际数据分析中处理几乎任何类型的数据都变得简单、直观且实用。`DataFrame`（`df`）是一种二维标签化数据结构，也是
    `pandas` 中最常用的对象。


    第一个代码示例创建了一个相关性矩阵及其可视化图表：


    ```python

    import random, numpy as np, pandas as pd

    import matplotlib.pyplot as plt

    import matplotlib.cm as cm

    import matplotlib.colors as colors

    if __name__ == "__main__":

    np.random.seed(0)

    df = pd.DataFrame({''a'': np.random.randint(0, 50, 1000)})

    df[''b''] = df[''a''] + np.random.normal(0, 10, 1000)

    df[''c''] = 100 - df[''a''] + np.random.normal(0, 5, 1000)

    df[''d''] = np.random.randint(0, 50, 1000)

    colormap = cm.viridis

    colorlist = [colors.rgb2hex(colormap(i))

    for i in np.linspace(0, 1, len(df[''a'']))]

    df[''colors''] = colorlist

    print (df.corr())

    pd.plotting.scatter_matrix(df, c=df[''colors''], diagonal="d",

    figsize=(10, 6))

    plt.show()

    ```


