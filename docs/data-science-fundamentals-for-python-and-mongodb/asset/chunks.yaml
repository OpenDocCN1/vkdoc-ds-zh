    此示例的代码与上一个相同，唯一的区别在于 MCS 的 `while` 循环（`while y <= z`）。在此循环中，利润的计算方式与之前相同，均使用函数
    `mcs()`，但每次模拟的结果都会被追加到列表 `avg_ls` 中。因此，`avg_ls` 包含了原始模拟结果的 1,000 次（`z = 1000`）模拟结果。精度提高了，但需要更多的计算机资源和运行时间。在原始
    MCS 上运行 1,000 次模拟需要一分多钟，这需要大量的处理时间！


    ## 使用概率密度函数和累积分布函数实现随机性


    在数据科学中，随机性伪装成现实（自然世界），因为未来无法预测。也就是说，随机化是数据科学家模拟现实的方式。更多的数据意味着更高的精度和预测能力（更逼真）。它在离散事件模拟和确定性问题求解中扮演着关键角色。随机化广泛应用于统计学、MCS、密码学、统计学、医学和科学等多个领域。


    连续随机变量的密度是其概率密度函数（PDF）。PDF 是指随机变量取值为 `x` 的概率，其中 `x` 是样本区间内的一个点。该概率由随机变量的 PDF 在样本范围（区间）上的积分确定。也就是说，概率由密度函数曲线下方、水平轴上方以及范围最小值与最大值之间的面积给出。积分（或求积）是一个数学对象，可以解释为正态分布曲线下的面积。累积分布函数（CDF）是指随机变量取值小于或等于
    `x` 的概率。也就是说，CDF 累积了所有小于或等于 `x` 的概率。百分点函数（PPF）是 CDF 的反函数。它通常被称为逆累积分布函数（ICDF）。ICDF
    在数据科学中非常有用，因为它代表了 PDF 曲线下某个面积所对应的实际值。关于密度函数的精彩解释，请参考 [`www.itl.nist.gov/div898/handbook/eda/section3/eda362.htm`](http://www.itl.nist.gov/div898/handbook/eda/section3/eda362.htm)。


    如前所述，概率由随机变量的 PDF 在样本区间上的积分确定。也就是说，积分用于确定某个随机变量落在特定范围（样本）内的概率。在微积分中，积分代表一类函数（原函数），其导数为被积函数。积分符号代表积分运算，而被积函数则是在定积分或不定积分中被积分的函数。微积分基本定理将定积分的计算与不定积分联系起来。我在此处包含这些信息，唯一目的是强调微积分对数据科学的重要性。微积分中另一个对数据科学很重要的概念——“梯度下降”，将在后面的第
    4 章中介绍。


    尽管理论解释非常宝贵，但它们可能不够直观。更好地理解这些概念的一个好方法是看一个例子。


    在代码示例中，为 PDF、CDF 和 ICDF（PPF）创建了二维图表。示例中还包含了颜色映射表的概念。颜色映射表是一个查找表，用于指定渲染调色板图像时要使用的颜色。调色板图像是一种通过将其像素映射到仅包含图像中实际存在的颜色的调色板来进行高效编码的图像。`matplotlib`
