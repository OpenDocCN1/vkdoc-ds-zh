    `random_vectors()` 生成一个包含 `n` 个数字的列表（随机样本）。函数 `sos()` 返回向量的 RSS。函数 `sos_gradient()`
    返回向量 RSS 的导数（梯度）。函数 `in_random_order()` 生成一个随机打乱索引的列表。该函数为 GD 算法增添了随机性。主程序块首先生成一个随机向量
    `v` 作为模拟的起点。接着创建一个大小为 3 的 `x` 和 `y` 向量样本。然后，将该向量赋值给 `theta`，这是某个通用概率分布向量的常见名称。我们可以随意命名该向量，但一个常见的数据科学问题是找到
    `theta` 的值。代码继续设置固定步长 `alpha`、最小 `theta` 值、最小结束值、无改进迭代次数、模拟次数 `n`，以及 x 坐标的绘图值（图
    4-9）。

    '
- fmt: '# 随机梯度下降与数据工作


    模拟开始时，将`theta`的幅度赋值给`y`。接着，绘制当前的`x`和`y`坐标。`x`坐标递增1，以绘制每个`y`坐标向最小值收敛的过程。下一段代码计算每个`theta`以及`x`和`y`样本的RSS。该值用于判断模拟是否在局部最小值附近徘徊，而非收敛。代码的最后部分以随机（随机梯度）顺序遍历样本数据点，计算`theta`、`x`和`y`的梯度，将这三个值放入列表`g`中，并遍历该向量以找到下一个`theta`值。


    哇！这并不简单，但这就是随机梯度下降（SGD）的工作原理。请注意，生成的最小值为2.87，并非真实最小值0。因此，随机梯度下降所需的迭代次数较少，但无法产生真实最小值。


    可以通过调整寻找下一个`theta`的算法来优化之前的模拟。在前一个示例中，下一个`theta`是根据每个样本的当前`theta`、`x`值和`y`值计算的梯度来计算的。然而，实际的新`theta`是基于样本中的第三个数据点。因此，第二个示例通过取整个样本中的最小`theta`（而非第三个数据点）进行了优化：


    ```python

    import matplotlib.pyplot as plt

    import random, numpy as np

    def rnd():

    return [random.randint(-10,10) for i in range(3)]

    def random_vectors(n):

    ls = []

    for v in range(n):

    ls.append([random.randint(-10,10) for i in range(3)])

    return ls

    def sos(v):

    return sum(v_i ** 2 for v_i in v)

    def sos_gradient(v):

    return [2 * v_i for v_i in v]

    def in_random_order(data):

    indexes = [i for i, _ in enumerate(data)]

    random.shuffle(indexes)

    for i in indexes:

    yield data[i]

    if __name__ == "__main__":

    v, x, y = rnd(), random_vectors(3), random_vectors(3)

    data = list(zip(x, y))

    theta = v

    alpha, value = 0.01, 0

    min_theta, min_value = None, float("inf")

    iterations_with_no_improvement = 0

    n, x = 60, 1

    for i, _ in enumerate(range(n)):

    y = np.linalg.norm(theta)

    plt.scatter(x, y, c="r")

    x = x + 1

    s = []

    for x_i, y_i in data:

    s.extend([sos(theta), sos(x_i), sos(y_i)])

    value = sum(s)

    if value < min_value:

    min_theta, min_value = theta, value

    iterations_with_no_improvement = 0

    alpha = 0.01

    else:

    iterations_with_no_improvement += 1

    alpha *= 0.9

    g, t, m = [], [], []

    for x_i, y_i in in_random_order(data):

    g.extend([sos_gradient(theta), sos_gradient(x_i),

    sos_gradient(y_i)])

    m = np.around([np.linalg.norm(x) for x in g], 2)

    for v in g:

    theta = np.around(np.subtract(theta,alpha*np.array(v)),3)

    t.append(np.around(theta,2))

    mm = np.argmin(m)

    theta = t[mm]

    g, m, t = [], [], []

    print (''minimum:'', np.around(min_theta, 4),

    ''with'', i+1, ''iterations'')

    print (''iterations with no improvement:'',

    iterations_with_no_improvement)

    print (''magnitude of min vector:'', np.linalg.norm(min_theta))

    plt.show()

    ```


