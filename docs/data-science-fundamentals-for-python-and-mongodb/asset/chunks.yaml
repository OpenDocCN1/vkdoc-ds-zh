    function (CDF). `CDF` is the probability that a random variable `X` takes on a
    value less than or equal to `x`, where `x` represents the area under a normal
    distribution. The code continues with three functions. Function `inverse_normal_cdf()`
    returns the `CDF` based on a random variable. Function `random_normal()` calls
    function `inverse_normal_cdf()` with a randomly generated value `X` and returns
    the `CDF`. Function `scatter()` creates a scatter plot. The main block begins
    by creating randomly generated `x` and `y` values `xs`, `ys1`, and `ys2`. A `gridspec()`
