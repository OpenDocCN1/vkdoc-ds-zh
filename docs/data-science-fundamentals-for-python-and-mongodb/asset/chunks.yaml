    ## Acknowledgments


    My entrée into data analysis started by exploring *Python for Data Analysis* by
    Wes McKinney, which I highly recommend to everyone. My entrée into data science
    started by exploring *Data Science from Scratch* by Joel Grus. Joel’s book may
    not be for the faint of heart, but it is definitely a challenge that I am glad
    that I accepted! Finally, I thank all of the contributors to *stackoverflow* ,
    whose programming solutions are indispensable.


    ### About the Author and About the Technical Reviewer


    ### About the Author


    ### About the Technical Reviewer


    # 1. Introduction


    Data science is an interdisciplinary field encompassing scientific methods, processes,
    and systems to extract knowledge or insights from data in various forms, either
    structured or unstructured. It draws principles from mathematics, statistics,
    information science, computer science, machine learning, visualization, data mining,
    and predictive analytics. However, it is fundamentally grounded in mathematics.


    This book explains and applies the fundamentals of data science crucial for technical
    professionals such as DBAs and developers who are making career moves toward practicing
    data science. It is an example-driven book providing complete Python coding examples
    to complement and clarify data science concepts, and enrich the learning experience.
    Coding examples include visualizations whenever appropriate. The book is a necessary
    precursor to applying and implementing machine learning algorithms, because it
    introduces the reader to foundational principles of the science of data.


    The book is self-contained. All the math, statistics, stochastic, and programming
    skills required to master the content are covered in the book. In-depth knowledge
    of object-oriented programming isn’t required, because working and complete examples
    are provided and explained. The examples are in-depth and complex when necessary
    to ensure the acquisition of appropriate data science acumen. The book helps you
    to build the foundational skills necessary to work with and understand complex
    data science algorithms.


    *Data Science Fundamentals by Example* is an excellent starting point for those
    interested in pursuing a career in data science. Like any science, the fundamentals
    of data science are prerequisite to competency. Without proficiency in mathematics,
    statistics, data manipulation, and coding, the path to success is “rocky” at best.
    The coding examples in this book are concise, accurate, and complete, and perfectly
    complement the data science concepts introduced.


    The book is organized into six chapters. Chapter [1](#462931_1_En_1_Chapter.xhtml)
    introduces the programming fundamentals with `Python` necessary to work with,
    transform, and process data for data science applications. Chapter [2](#462931_1_En_2_Chapter.xhtml)
    introduces Monte Carlo simulation for decision making, and data distributions
    for statistical processing. Chapter [3](#462931_1_En_3_Chapter.xhtml) introduces
    linear algebra applied with vectors and matrices. Chapter [4](#462931_1_En_4_Chapter.xhtml)
    introduces the gradient descent algorithm that minimizes (or maximizes) functions,
    which is very important because most data science problems are optimization problems.
    Chapter [5](#462931_1_En_5_Chapter.xhtml) focuses on munging, cleaning, and transforming
    data for solving data science problems. Chapter [6](#462931_1_En_6_Chapter.xhtml)
    focusing on exploring data by dimensionality reduction, web scraping, and working
    with large data sets efficiently.


    Python programming code for all coding examples and data files are available for
    viewing and download through Apress at [`www.apress.com/9781484235966`](http://www.apress.com/9781484235966)
    . Specific linking instructions are included on the copyright pages of the book.


    To install a Python module, `pip` is the preferred installer program. So, to install
    the `matplotlib` module from an Anaconda prompt: `pip install matplotlib`. Anaconda
    is a widely popular open source distribution of Python (and R) for large-scale
    data processing, predictive analytics, and scientific computing that simplifies
    package management and deployment. I have worked with other distributions with
    unsatisfactory results, so I highly recommend Anaconda.


    ## Python Fundamentals


    Python has several features that make it well suited for learning and doing data
    science. It’s free, relatively simple to code, easy to understand, and has many
    useful libraries to facilitate data science problem solving. It also allows quick
    prototyping of virtually any data science scenario and demonstration of data science
    concepts in a clear, easy to understand manner.


    The goal of this chapter is *not* to teach Python as a whole, but present, explain,
    and clarify fundamental features of the language (such as logic, data structures,
    and libraries) that help prototype, apply, and/or solve data science problems.


    Python fundamentals are covered with a wide spectrum of activities with associated
    coding examples as follows:


    1.  functions and strings

    2.  lists, tuples, and dictionaries

    3.  reading and writing data

    4.  list comprehension

    5.  generators

    6.  data randomization

    7.  MongoDB and JSON

    8.  visualization'
