    ## Web Scraping


    Web scraping is a programmatic approach for extracting information from websites.
    It focuses on transforming unstructured HTML formatted data into structured data.
    Web scraping is programmatically intensive because of the unstructured nature
    of HTML. That is, HTML has few if any structural rules, which means that HTML
    structural patterns tend to differ from one website to another. So, get ready
    to write custom code for each Web scraping adventure.


    The code example scrapes book information from a popular technical book publishing
    company. The 1st step is to locate the webpage. The 2nd step is to open a window
    with the source code. The 3rd step is to traverse the source code to identify
    the data to scrape. The 4th step is to scrape.


    With Google Chrome, click More tools and then Developer tools to open the source
    code window. Next, hover the mouse cursor over the source until you find the data.
    Move down the source code tree to find the tags you want to scrape. Finally, scrape
    the data.


