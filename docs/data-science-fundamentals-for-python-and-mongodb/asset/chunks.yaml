    # 二维数据示例


    对二维数据进行建模能更真实地呈现自然发生的事件。以下代码示例比较了两个具有相同均值和标准差（`SD`）的正态分布随机生成数据集。`SD`衡量一组数据值的变异（离散）程度。尽管两个数据集均呈正态分布且具有相同的均值和`SD`，但它们的联合分布（相关性）却截然不同。相关性是指两个变量之间的相互依存关系。


    ```

    import matplotlib.pyplot as plt

    import matplotlib.gridspec as gridspec

    import numpy as np, random

    from scipy.special import ndtri

    def inverse_normal_cdf(r):

    return ndtri(r)

    def random_normal():

    return inverse_normal_cdf(random.random())

    def scatter(loc):

    plt.scatter(xs, ys1, marker=''.'', color="black", label="ys1")

    plt.scatter(xs, ys2, marker=''.'', color="gray",  label=''ys2'')

    plt.xlabel(''xs'')

    plt.ylabel(''ys'')

    plt.legend(loc=loc)

    plt.tight_layout()

    if __name__ == "__main__":

    xs = [random_normal() for _ in range(1000)]

    ys1 = [ x + random_normal() / 2 for x in xs]

    ys2 = [-x + random_normal() / 2 for x in xs]

    gs = gridspec.GridSpec(2, 2)

    fig = plt.figure()

    ax1 = fig.add_subplot(gs[0,0])

    plt.title(''ys1 data'')

    n, bins, ignored = plt.hist(ys1, 50, normed=1,

    facecolor=''chartreuse'', alpha=0.75)

    ax2 = fig.add_subplot(gs[0,1])

    plt.title(''ys2 data'')

    n, bins, ignored = plt.hist(ys2, 50, normed=1,

    facecolor=''fuchsia'', alpha=0.75)

    ax3 = fig.add_subplot(gs[1,:])

    plt.title(''Correlation'')

    scatter(6)

    print (np.corrcoef(xs, ys1)[0, 1])

    print (np.corrcoef(xs, ys2)[0, 1])

    plt.show()

    ```


    输出：


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig3_HTML.jpg](img/462931_1_En_5_Fig3_HTML.jpg)


    图 5-3


    正态分布与相关性的子图


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Figa_HTML.jpg](img/462931_1_En_5_Figa_HTML.jpg)


    代码示例首先导入了`matplotlib`、`numpy`、`random`和`scipy`库。方法`gridspec`用于指定放置子图的网格几何结构。方法`ndtri`返回标准正态累积分布函数（`CDF`）。`CDF`是指随机变量`X`取值小于或等于`x`的概率，其中`x`代表正态分布曲线下的面积。代码接着定义了三个函数。函数`inverse_normal_cdf()`基于一个随机变量返回`CDF`。函数`random_normal()`调用函数`inverse_normal_cdf()`，传入一个随机生成的值`X`，并返回`CDF`。函数`scatter()`用于创建散点图。主程序块首先创建随机生成的`x`和`y`值`xs`、`ys1`和`ys2`。然后创建一个`gridspec()`来容纳这些分布。接着分别为`xs`、`ys1`数据和`xs`、`ys2`数据创建直方图。随后，为两个分布创建相关性图。最后，生成两个分布的相关性系数。图
    5-3 展示了这些图形。


    该代码示例揭示了两个重要启示。第一，使用`ndtri()`创建一组随机生成的数字会生成一个正态分布的数据集。也就是说，函数`ndtri()`返回的是随机生成值的`CDF`。第二，两个正态分布的数据集即使看起来相似，也未必真正相似。在本例中，它们的相关性是相反的。因此，需要通过可视化和相关性分析来展示数据集之间的差异。


    ## 数据相关性与基础统计


    相关性是指两个或多个变量共同波动（变化）的程度。相关矩阵是一个展示变量集之间相关系数的表格。相关系数衡量两个或多个变量之间关联的强度。


    以下代码示例创建了三个具有`x`和`y`坐标的数据集，计算相关性并绘制图形。第一个数据集代表正相关；第二个代表负相关；第三个代表弱相关。


    ```

    import random, numpy as np

    import matplotlib.pyplot as plt

    import matplotlib.gridspec as gridspec

    if __name__ == "__main__":

    np.random.seed(0)

    x = np.random.randint(0, 50, 1000)

    y = x + np.random.normal(0, 10, 1000)

    print (''高度正相关:\n'', np.corrcoef(x, y))

    gs = gridspec.GridSpec(2, 2)

    fig = plt.figure()

    ax1 = fig.add_subplot(gs[0,0])

    plt.title(''正相关'')

    plt.scatter(x, y, color="springgreen")

    y = 100 - x + np.random.normal(0, 10, 1000)

    print (''\n 高度负相关:\n'', np.corrcoef(x, y))

    ax2 = fig.add_subplot(gs[0,1])

    plt.title(''负相关'')

    plt.scatter(x, y, color="crimson")

    y = np.random.normal(0, 10, 1000)

    print (''\n 无/弱相关:\n'', np.corrcoef(x, y))

    ax3 = fig.add_subplot(gs[1,:])

    plt.title(''弱相关'')

    plt.scatter(x, y, color="peachpuff")

    plt.tight_layout()

    plt.show()

    ```


    输出：


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig4_HTML.jpg](img/462931_1_En_5_Fig4_HTML.jpg)


    图 5-4


    相关性子图


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Figb_HTML.jpg](img/462931_1_En_5_Figb_HTML.jpg)


    代码示例首先导入了`random`、`numpy`和`matplotlib`库。主程序块首先生成具有正相关关系的`x`和`y`坐标，并显示相关矩阵。接着创建一个网格来容纳子图，即第一个子图网格，并绘制散点图。然后，生成具有负相关关系的`x`和`y`坐标，并显示相关矩阵。创建并绘制第二个子图网格。最后，生成具有弱相关关系的`x`和`y`坐标，并显示相关矩阵。创建并绘制第三个子图网格，并显示所有三个散点图。图
    5-4 展示了这些图形。

