    Smoothing works (Figure [1-2](#462931_1_En_1_Chapter.xhtml#Fig2)) because a normal
    distribution consists of continuous random variables. A continuous random variable
    is a random variable with a set of infinite and uncountable values. So, more data
    creates more predictive realism. Since we cannot add infinite data, we work with
    as much data as we can. The tradeoff is more data increases computer processing
    resources and execution time. Data scientists must thereby weigh this tradeoff
    when conducting their tradecraft.


    # 2. Monte Carlo Simulation and Density Functions


    Monte Carlo simulation (MCS) applies repeated random sampling (randomness) to
    obtain numerical results for deterministic problem solving. It is widely used
    in optimization, numerical integration, and risk-based decision making. Probability
    and cumulative density functions are statistical measures that apply probability
    distributions for random variables, and can be used in conjunction with MCS to
    solve deterministic problem.


