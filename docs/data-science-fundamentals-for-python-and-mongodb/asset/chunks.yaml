    热力图是一种数据的图形化表示方式，其中矩阵中的各个数值以颜色来表示。它是数据科学中一种流行的可视化技术。使用 `pandas`，热力图可以提供一种精细的相关性可视化，其中每个变量都由其自身的颜色表示。


