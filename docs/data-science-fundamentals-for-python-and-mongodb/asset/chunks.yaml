    # 数据缩放与整理


    数据缩放是指改变数据的类型、离散程度和/或位置，以便比较原本无法比较的数据。数据缩放在数据科学中非常常见。第一种技术是**均值中心化**，它通过减去均值来转换数据。第二种技术是**归一化**，它将数据转换到
    0 到 1 的范围内。第三种技术是**标准化**，它将数据转换为均值为 0、方差为 1（标准差 = 1）的形式，通常称为标准正态分布。


    第一个代码示例生成一个正态分布并对其进行中心化：


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    def rnd_nrml(m, s, n):

    return np.random.normal(m, s, n)

    def ctr(d):

    return [x-np.mean(d) for x in d]

    if __name__ == "__main__":

    mu, sigma, n, c1, c2, b = 10, 15, 100, ''pink'',\

    ''springgreen'', True

    s = rnd_nrml(mu, sigma, n)

    plt.figure()

    ax = plt.subplot(211)

    ax.set_title(''normal distribution'')

    count, bins, ignored = plt.hist(s, 30, color=c1, normed=b)

    sc = ctr(s)

    ax = plt.subplot(212)

    ax.set_title(''normal distribution "centered"'')

    count, bins, ignored = plt.hist(sc, 30, color=c2, normed=b)

    plt.tight_layout()

    plt.show()

    ```


