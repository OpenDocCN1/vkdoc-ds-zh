    # Pandas 矩阵应用


    Pandas 库提供了高性能、易于使用的数据结构和分析工具。最常用的 Pandas 对象是 `DataFrame`（`df`）。`df` 是一个二维结构，具有可能不同类型的带标签轴（行和列）。数学运算会在行和列标签上对齐。`df`
    可以按列或按行来理解。要按列查看，请使用 `axis = 0` 或 `axis = ''index''`。要按行查看，请使用 `axis = 1` 或 `axis
    = ''columns''`。在处理行时，这可能会显得违反直觉，但 Pandas 就是这样实现此功能的。


    Pandas 的 `df` 比 NumPy 矩阵更容易使用，但效率也较低。也就是说，处理 Pandas 的 `df` 需要更多的资源。NumPy 库针对处理大量数据和数值计算进行了优化。


    第一个示例创建了一个列表的列表，将其放入 Pandas 的 `df` 中，并显示一些数据：


    ```

    import pandas as pd

    if __name__ == "__main__":

    data = [

    [41, 72, 180], [27, 66, 140],

    [18, 59, 101], [57, 72, 160],

    [21, 59, 112], [29, 77, 250],

    [55, 60, 120], [28, 72, 110],

    [19, 59, 99], [32, 68, 125],

    [31, 79, 322], [36, 69, 111]

    ]

    headers = [''age'', ''height'', ''weight'']

    df = pd.DataFrame(data, columns=headers)

    n = 3

    print (''First'', n, ''"df" rows:\n'', df.head(n))

    print (''\nFirst "df" row:'')

    print (df[0:1])

    print (''\nRows 2 through 4'')

    print (df[2:5])

    print (''\nFirst'', n, ''rows "age" column'')

    print (df[[''age'']].head(n))

    print (''\nLast'', n, ''rows "weight" and "age" columns'')

    print (df[[''weight'', ''age'']].tail(n))

    print (''\nRows 3 through 6 "weight" and "age" columns'')

    print (df.ix[3:6, [''weight'', ''age'']])

    ```


    输出：


    ![../images/462931_1_En_3_Chapter/462931_1_En_3_Figi_HTML.jpg](img/462931_1_En_3_Figi_HTML.jpg)


    代码首先导入 Pandas。主块首先创建一个列表的列表，并将其添加到 Pandas 的 `df` 中。像我们在这里做的那样，创建自己的列标题是一个好主意。方法
    `head()` 和 `tail()` 会自动显示前五条记录和最后五条记录，除非指定了数值。在本例中，我们显示前三条和最后三条记录。使用 `head()`
    和 `tail()` 非常有用，尤其是在处理大型 `df` 时。请注意，对 `df` 进行切片和切块是多么容易。同时，请注意显示你选择的列数据是多么容易。


