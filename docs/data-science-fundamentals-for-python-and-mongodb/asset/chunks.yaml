- fmt: '# Euclidean Distance Minimization Controlling for Step Size


    Euclidean distance is the ordinary straight-line distance between two points in
    Euclidean space. With this distance, Euclidean space becomes a metric space. The
    associated norm is the Euclidean norm (EN). The EN assigns each vector the length
    of its arrow. So, EN is really just the magnitude of a vector. A vector space
    on which a norm is defined is the normed vector space.


    To find the local minimum of `f(x)` in three-dimensional (3-D) space, the 1st
    step is to find the minimum for all 3-D vectors. The 2nd step is to create a random
    3-D vector `[x, y, z]`. The 3rd step is to pick a random starting point, and then
    take tiny steps in the opposite direction of the gradient `f''(x)` until a point
    is reached where the gradient is very small. Each tiny step (from the current
    vector to the next vector) is measured with the ED metric. The ED metric is the
    distance between two points in Euclidean space. The metric is required because
    we need to know how to move for each tiny step. So, the ED metric supplements
    GD to find the local minimum in 3-D space.


    The code example finds the local minimum of the sigmoid function in 3-D space:


    ```

    import matplotlib.pyplot as plt

    from mpl_toolkits.mplot3d import Axes3D

    import random, numpy as np

    from scipy.spatial import distance

    def step(v, direction, step_size):

    return [v_i + step_size * direction_i

    for v_i, direction_i in zip(v, direction)]

    def sigmoid_gradient(v):

    return [v_i * (1-v_i) for v_i in v]

    def mod_vector(v):

    for i, v_i in enumerate(v):

    if v_i == float("inf") or v_i == float("-inf"):

    v[i] = random.randint(-1, 1)

    return v

    if __name__ == "__main__":

    v = [random.randint(-10, 10) for i in range(3)]

    tolerance = 0.0000001

    iterations = 1

    fig = plt.figure(''Euclidean'')

    ax = fig.add_subplot(111, projection="3d")

    while True:

    gradient = sigmoid_gradient(v)

    next_v = step(v, gradient, -0.01)

    xs = gradient[0]

    ys = gradient[1]

    zs = gradient[2]

    ax.scatter(xs, ys, zs, c="lime", marker="o")

    v = mod_vector(v)

    next_v = mod_vector(next_v)

    test_v = distance.euclidean(v, next_v)

    if test_v < tolerance:

    break

    v = next_v

    iterations += 1

    print (''minimum:'', test_v, ''\niterations:'', iterations)

    ax.set_xlabel(''X axis'')

    ax.set_ylabel(''Y axis'')

    ax.set_zlabel(''Z axis'')

    plt.tight_layout()

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig7_HTML.jpg](Images/462931_1_En_4_Fig7_HTML.jpg)


    Figure 4-7


    3-D rendition of local minimum


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Fige_HTML.jpg](Images/462931_1_En_4_Fige_HTML.jpg)


    The code begins by importing `matplotlib`, `mpl_toolkits`, `random`, `numpy`,
    and `scipy` libraries. Function `step()` moves a vector in a direction (based
    on the gradient), by a step size. Function `sigmoid_gradient()` is the `f''(sigmoid)`
    returned as a point in 3-D space. Function `mod_vector()` ensures that an erroneous
    vector generated by the simulation is handled properly. The main block begins
    by creating a randomly generated 3-D vector `[x, y, z]` as a starting point for
    the simulation. It continues by creating a tolerance (precision). A smaller tolerance
    results in a more accurate result. A subplot is created to hold a 3-D rendering
    of the local minimum (Figure [4-7](#462931_1_En_4_Chapter.xhtml#Fig7)). The GD
    simulation creates a set of 3-D vectors influenced by the sigmoid gradient until
    the gradient is very small. The size (magnitude) of the gradient is calculated
    by the ED metric. The local minimum, as expected is close to 0.


    ## Stabilizing Euclidean Distance Minimization with Monte Carlo Simulation


    The Euclidean distance experiment in the previous example is anchored by a stochastic
    process. Namely, the starting vector `v` is stochastically generated by `randomint()`.
    As a result, each run of the GD experiment generates a different result for number
    of iterations. From Chapter [2](#462931_1_En_2_Chapter.xhtml), we already know
    that Monte Carlo simulation (MCS) efficiently models stochastic (random) processes.
    However, MCS can also stabilize stochastic experiments.


    The code example first wraps the GD experiment in a loop that runs `n` number
    of simulations. With `n` simulations, an average number of iterations is calculated.
    The resultant code is then wrapped in another loop that runs `m` trials. With
    `m` trials, an average gap between each average number of iterations, is calculated.
    Gap is calculated by subtracting the minimum from the maximum average iteration.
    The smaller the gap, the more stable (accurate) the result. To increase accuracy,
    increase simulations (`n`). The only limitation is computing power. That is, running
    1,000 simulations takes a lot more computing power than 100. Stable (accurate)
    results allow comparison to alternative experiments.


    ```

    import random, numpy as np

    from scipy.spatial import distance

    def step(v, direction, step_size):

    return [v_i + step_size * direction_i

    for v_i, direction_i in zip(v, direction)]

    def sigmoid_gradient(v):

    return [v_i * (1-v_i) for v_i in v]

    def mod_vector(v):

    for i, v_i in enumerate(v):

    if v_i == float("inf") or v_i == float("-inf"):

    v[i] = random.randint(-1, 1)

    return v

    if __name__ == "__main__":

    trials= 10

    sims = 10

    avg_its = []

    for _ in range(trials):

    its = []

    for _ in range(sims):

    v = [random.randint(-10, 10) for i in range(3)]

    tolerance = 0.0000001

    iterations = 0

    while True:

    gradient = sigmoid_gradient(v)

    next_v = step(v, gradient, -0.01)

    v = mod_vector(v)

    next_v = mod_vector(next_v)

    test_v = distance.euclidean(v, next_v)

    if test_v < tolerance:

    break

    v = next_v

    iterations += 1

    its.append(iterations)

    a = round(np.mean(its))

    avg_its.append(a)

    gap = np.max(avg_its) - np.min(avg_its)

    print (trials, ''trials with'', sims, ''simulations each:'')

    print (''gap'', gap)

    print (''avg iterations'', round(np.mean(avg_its)))

    ```


    Output:


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Figh_HTML.jpg](Images/462931_1_En_4_Figh_HTML.jpg)


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Figg_HTML.jpg](Images/462931_1_En_4_Figg_HTML.jpg)


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Figf_HTML.jpg](Images/462931_1_En_4_Figf_HTML.jpg)


    Output is for 10, 100, and 1,000 simulations. By running 1,000 simulations ten
    times (trials), the gap is down to 13. So, confidence is high that the number
    of iterations required to minimize the function is close to 1,089. We can further
    stabilize by wrapping the code in another loop to decrease variation in gap and
    number of iterations. However, computer processing time becomes an issue. Leveraging
    MCS for this type of experiment makes a strong case for cloud computing. It may
    be tough to get your head around this application of MCS, but it is a very powerful
    tool for working with and solving data science problems.'
