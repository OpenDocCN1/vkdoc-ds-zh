    \ 2-12 所示！\n\n# 3. 线性代数\n\n线性代数是数学的一个分支，涉及向量空间以及这些空间之间的线性映射。简单来说，它探索的是类似线性的关系。现代科学的几乎每个领域都使用线性代数来近似建模方程。特别是，数据科学在机器学习、数学建模和维度分布问题求解方面依赖于线性代数。\n\
    \n## 向量空间\n\n向量空间是向量的集合。向量是任何具有大小和方向的量，它决定了空间中一个点相对于另一个点的位置。大小是通过运动、长度和/或速度来衡量的物体的尺寸。向量可以相加和（通过标量）相乘，以形成新的向量。标量是任何具有大小（尺寸）的量。在实际应用中，向量是有限空间中的点。\n\
    \n向量的例子包括呼吸、行走和位移。呼吸需要膈肌施加一个具有大小和方向的力。行走需要朝某个方向移动。位移衡量一个物体在某个方向上移动了多远。\n"
- fmt: '# Vector Math


    In vector math, a vector is depicted as a directed line segment whose length is
    its magnitude vector with an arrow indicating direction from tail to head. Tail
    is where the line segment begins and head is where it ends (the arrow). Vectors
    are the same if they have the same magnitude and direction.


    To add two vectors `a` and `b`, start `b` where `a` finishes, and complete the
    triangle. Visually, start at some point of origin, draw `a` (Figure [3-1](#462931_1_En_3_Chapter.xhtml#Fig1)),
    start `b` (Figure [3-2](#462931_1_En_3_Chapter.xhtml#Fig2)) from head of `a`,
    and the result `c` (Figure [3-3](#462931_1_En_3_Chapter.xhtml#Fig3)) is a line
    from tail of `a` to head of `b`. The 1st example illustrates vector addition as
    well as a graphic depiction of the process:


    ```

    import matplotlib.pyplot as plt, numpy as np

    def vector_add(a, b):

    return np.add(a, b)

    def set_up():

    plt.figure()

    plt.xlim(-.05, add_vectors[0]+0.4)

    plt.ylim(-1.1, add_vectors[1]+0.4)

    if __name__ == "__main__":

    v1, v2 = np.array([3, -1]), np.array([2, 3])

    add_vectors = vector_add(v1, v2)

    set_up()

    ax = plt.axes()

    ax.arrow(0, 0, 3, -1, head_width=0.1, fc="b", ec="b")

    ax.text(1.5, -0.35, ''a'')

    ax.set_facecolor(''honeydew'')

    set_up()

    ax = plt.axes()

    ax.arrow(0, 0, 3, -1, head_width=0.1, fc="b", ec="b")

    ax.arrow(3, -1, 2, 3, head_width=0.1, fc="crimson", ec="crimson")

    ax.text(1.5, -0.35, ''a'')

    ax.text(4, -0.1, ''b'')

    ax.set_facecolor(''honeydew'')

    set_up()

    ax = plt.axes()

    ax.arrow(0, 0, 3, -1, head_width=0.1, fc="b", ec="b")

    ax.arrow(3, -1, 2, 3, head_width=0.1, fc="crimson", ec="crimson")

    ax.arrow(0, 0, 5, 2, head_width=0.1, fc="springgreen", ec="springgreen")

