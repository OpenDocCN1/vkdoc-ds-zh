    ## Visualization


    Visualization is the process of representing data graphically and leveraging these
    representations to gain insight into the data. Visualization is one of the most
    important skills in data science because it facilitates the way we process large
    amounts of complex data.


    The following code example creates and plots a normally distributed set of data.
    It then shifts data to the left (and plots) and shifts data to the right (and
    plots). A normal distribution is a probability distribution that is symmetrical
    about the mean, and is very important to data science because it is an excellent
    model of how events naturally occur in reality.


    ```

    import matplotlib.pyplot as plt

    from scipy.stats import norm

    import numpy as np

    if __name__ == ''__main__'':

    x = np.linspace(norm.ppf(0.01), norm.ppf(0.99), num=100)

    x_left = x - 1

    x_right = x + 1

    y = norm.pdf(x)

    plt.ylim(0.02, 0.41)

    plt.scatter(x, y, color="crimson")

    plt.fill_between(x, y, color="crimson")

    plt.scatter(x_left, y, color="chartreuse")

    plt.scatter(x_right, y, color="cyan")

    plt.show()

    ```


