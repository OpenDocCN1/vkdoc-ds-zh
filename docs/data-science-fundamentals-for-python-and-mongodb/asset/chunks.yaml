    Normally distributed data


    The code example (Figure [1-1](#462931_1_En_1_Chapter.xhtml#Fig1)) begins by importing
    `matplotlib`, `scipy`, and `numpy` libraries. The `matplotlib` library is a 2-D
    plotting module that produces publication quality figures in a variety of hardcopy
    formats and interactive environments across platforms. The `SciPy` library provides
    user-friendly and efficient numerical routings for numerical integration and optimization.
    The main block begins by creating a sequence of 100 numbers between 0.01 and 0.99.
    The reason is the normal distribution is based on probabilities, which must be
    between zero and one. The code continues by shifting the sequence one unit to
    the left and one to the right for later plotting. The `ylim()` method is used
    to pull the chart to the bottom (x-axis). A scatter plot is created for the original
    data, one unit to the left, and one to the right, with different colors for effect.


    On the 1st line of the main block in the `linespace()` function, increase the
    number of data points from `num = 100` to `num = 1000` and see what happens. The
    result is a smoothing of the normal distribution, because more data provides a
    more realistic picture of the natural world.


