    ## 数据随机化


    一个随机过程是从某个概率空间到状态空间的一系列随机变量（呼！）。简单来说，它是一个随时间变化的随机过程。数据随机化是以不可预测的方式从样本中选择值的过程，目的是模拟现实。模拟使得数据随机化可以在数据科学中得到应用。上一节演示了如何使用模拟来现实地比较可迭代对象（列表推导、生成器推导和生成器）。


    在Python中，使用伪随机数来模拟数据随机性（现实）。它们并非真正的随机数，因为第一代随机数没有前一个数。我们必须提供一个种子（或随机种子）来初始化一个伪随机数生成器。`random`库为各种数据分布实现了伪随机数生成器，而`random.seed()`用于生成初始的（第一代）种子数。


    以下代码示例读取一个CSV文件并将其转换为一个普通字典元素列表。代码接着创建一个随机数，用于从列表中检索一个随机元素。接下来，创建一个包含三个随机选择元素的生成器并显示它。代码继续显示从列表中随机打乱顺序的三个元素。下一段代码确定性地为随机数生成器设置种子，这意味着所有生成的随机数都将基于该种子而相同。因此，除非更改种子，否则显示的元素将始终相同。然后，代码使用系统时间来非确定性地生成随机数并显示这三个元素。接着，通过另一种方法生成非确定性随机数并显示这三个元素。最后一部分创建一个名字列表，以便可以使用随机选择和抽样方法来显示元素。


