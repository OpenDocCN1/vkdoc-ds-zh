- fmt: '# Pandas Matrix Applications


    The pandas library provides high-performance, easy-to-use data structure and analysis
    tools. The most commonly used pandas object is a `DataFrame` (`df`). A `df` is
    a 2-D structure with labeled axes (row and column) of potentially different types.
    Math operations align on both row and column labels. A `df` can be conceptualized
    by column or row. To view by column, use `axis = 0` or `axis = ''index''`. To
    view by row, use `axis = 1` or `axis = ''columns''`. This may seem counterintuitive
    when working with rows, but this is the way pandas implemented this feature.


    A pandas `df` is much easier to work with than a numpy matrix, but it is also
    less efficient. That is, it takes a lot more resources to process a pandas `df`.
    The numpy library is optimized for processing large amounts of data and numerical
    calculations.


    The 1st example creates a list of lists, places it into a pandas `df`, and displays
    some data:


    ```

    import pandas as pd

    if __name__ == "__main__":

    data = [

    [41, 72, 180], [27, 66, 140],

    [18, 59, 101], [57, 72, 160],

    [21, 59, 112], [29, 77, 250],

    [55, 60, 120], [28, 72, 110],

    [19, 59, 99], [32, 68, 125],

    [31, 79, 322], [36, 69, 111]

    ]

    headers = [''age'', ''height'', ''weight'']

    df = pd.DataFrame(data, columns=headers)

    n = 3

    print (''First'', n, ''"df" rows:\n'', df.head(n))

    print (''\nFirst "df" row:'')

    print (df[0:1])

    print (''\nRows 2 through 4'')

    print (df[2:5])

    print (''\nFirst'', n, ''rows "age" column'')

    print (df[[''age'']].head(n))

    print (''\nLast'', n, ''rows "weight" and "age" columns'')

    print (df[[''weight'', ''age'']].tail(n))

    print (''\nRows 3 through 6 "weight" and "age" columns'')

    print (df.ix[3:6, [''weight'', ''age'']])

    ```


    Output:


    ![../images/462931_1_En_3_Chapter/462931_1_En_3_Figi_HTML.jpg](Images/462931_1_En_3_Figi_HTML.jpg)


    The code begins by importing pandas. The main block begins by creating a list
    of lists and adding it to a pandas `df`. It is a good idea to create your own
    headers as we do here. Method `head()` and `tail()` automatically display the
    1st five records and last five records respectively unless a value is included.
    In this case, we display the 1st and last three records. Using `head()` and `tail()`
    are very useful, especially with a large `df`. Notice how easy it is to slice
    and dice the `df`. Also, notice how easy it is to display column data of your
    choice.


    The 2nd example creates a list of lists, places it into numpy matrix `A`, and
    puts `A` into a pandas `df`. This ability is very important because it shows how
    easy it is to create a `df` from a numpy matrix. So, you can be working with numpy
    matrices for precision and performance, and then convert to pandas for slicing,
    dicing, and other operations.


    ```

    import pandas as pd, numpy as np

    if __name__ == "__main__":

    data = [

    [41, 72, 180], [27, 66, 140],

    [18, 59, 101], [57, 72, 160],

    [21, 59, 112], [29, 77, 250],

    [55, 60, 120], [28, 72, 110],

    [19, 59, 99], [32, 68, 125],

    [31, 79, 322], [36, 69, 111]

    ]

    A = np.matrix(data)

    headers = [''age'', ''height'', ''weight'']

    df = pd.DataFrame(A, columns=headers)

    print (''Entire "df":'')

    print (df, ''\n'')

    print (''Sliced by "age" and "height":'')

    print (df[[''age'', ''height'']])

    ```


    Output:


    ![../images/462931_1_En_3_Chapter/462931_1_En_3_Figj_HTML.jpg](Images/462931_1_En_3_Figj_HTML.jpg)


    The code begins by importing pandas and numpy. The main block begins by creating
    a list of lists, converting it to numpy matrix `A`, and then adding `A` to a pandas
    `df`.


    The 3rd example creates a list of lists, places it into a list of dictionary elements,
    and puts it into a pandas `df`. This ability is also very important because dictionaries
    are very efficient data structures when working with data science applications.


    ```

    import pandas as pd

    if __name__ == "__main__":

    data = [

    [41, 72, 180], [27, 66, 140],

    [18, 59, 101], [57, 72, 160],

    [21, 59, 112], [29, 77, 250],

    [55, 60, 120], [28, 72, 110],

    [19, 59, 99], [32, 68, 125],

    [31, 79, 322], [36, 69, 111]

    ]

    d = {}

    dls = []

    key = [''age'', ''height'', ''weight'']

    for row in data:

    for i, num in enumerate(row):

    d[key[i]] = num

    dls.append(d)

    d = {}

    df = pd.DataFrame(dls)

    print (''dict elements from list:'')

    for row in dls:

    print (row)

    print (''\nheight from 1st dict element is:'', end='' '')

    print (dls[0][''height''])

    print (''\n"df" converted from dict list:\n'', df)

    print (''\nheight 1st df element:\n'', df[[''height'']].head(1))

    ```


    Output:


    ![../images/462931_1_En_3_Chapter/462931_1_En_3_Figk_HTML.jpg](Images/462931_1_En_3_Figk_HTML.jpg)


    The 4th code example creates two lists of lists — `data` and `scores`. The `data`
    list holds ages, heights, and weights for 12 athletes. The `scores` list holds
    three exam scores for 12 students. The `data` list is put directly into `df1`,
    and the `scores` list is put directly into `df2`. Averages are computed and displayed.


    ```

    import pandas as pd, numpy as np

    if __name__ == "__main__":

    data = [

    [41, 72, 180], [27, 66, 140],

    [18, 59, 101], [57, 72, 160],

    [21, 59, 112], [29, 77, 250],

    [55, 60, 120], [28, 72, 110],

    [19, 59, 99], [32, 68, 125],

    [31, 79, 322], [36, 69, 111]

    ]

    scores = [

    [99, 90, 88], [77, 66, 81], [78, 77, 83],

    [75, 72, 79], [88, 77, 93], [88, 77, 94],

    [100, 99, 93], [94, 74, 90], [98, 97, 99],

    [73, 68, 77], [55, 50, 68], [36, 77, 90]

    ]

    n = 3

    key1 = [''age'', ''height'', ''weight'']

    df1 = pd.DataFrame(data, columns=key1)

    print (''df1 slice:\n'', df1.head(n))

    avg_cols = df1.apply(np.mean, axis=0)

    print (''\naverage by columns:'')

    print (avg_cols)

    avg_wt = df1[[''weight'']].apply(np.mean, axis="index")

    print (''\naverage weight'')

    print (avg_wt)

    key2 = [''exam1'', ''exam2'', ''exam3'']

    df2 = pd.DataFrame(scores, columns=key2)

    print (''\ndf2 slice:\n'', df2.head(n))

    avg_scores = df2.apply(np.mean, axis=1)

    print (''\naverage scores for 1st'', n, ''students (rows):'')

    print (avg_scores.head(n))

    avg_slice = df2[[''exam1'',''exam3'']].apply(np.mean, axis="columns")

    print (''\naverage "exam1" & "exam3" 1st'', n, ''students (rows):'')

    print (avg_slice[0:n])

    ```


    Output:


    ![../images/462931_1_En_3_Chapter/462931_1_En_3_Figl_HTML.jpg](Images/462931_1_En_3_Figl_HTML.jpg)


    The code begins by importing pandas and numpy. The main block creates the `data`
    and `scores` lists and puts them in `df1` and `df2`, respectively. With `df1`
    (data), we average by column because our goal is to return the average age, height,
    and weight for all athletes. With `df2` (scores), we average by row because our
    goal is to return the average overall exam score for each student. We could average
    by column for `df2` if the goal is to calculate the average overall score for
    one of the exams. Try this if you wish.


    # Gradient Descent


    Gradient descent (GD) is an algorithm that minimizes (or maximizes) functions.
    To apply, start at an initial set of a function’s parameter values and iteratively
    move toward a set of parameter values that minimize the function. Iterative minimization
    is achieved using calculus by taking steps in the negative direction of the function’s
    gradient. GD is important because optimization is a big part of machine learning.
    Also, GD is easy to implement, generic, and efficient (fast).'
