    0。


    第二个示例寻找 sigmoid 函数的局部最大值：


    ```python

    import matplotlib.pyplot as plt, numpy as np

    def sigmoid(x):

    return 1 / (1 + np.exp(-x))

    def df(x):

    return x * (1-x)

    if __name__ == "__main__":

    x = np.arange(-10., 10., 0.2)

    y, y_dx = sigmoid(x), df(x)

    f, axarr = plt.subplots(3, sharex=True)

