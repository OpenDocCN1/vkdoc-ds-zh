    ## Randomness Using Probability and Cumulative Density Functions


    Randomness masquerades as reality (the natural world) in data science, since the
    future cannot be predicted. That is, randomization is the way data scientists
    simulate reality. More data means better accuracy and prediction (more realism).
    It plays a key role in discrete event simulation and deterministic problem solving.
    Randomization is used in many fields such as statistics, MCS, cryptography, statistics,
    medicine, and science.


    The density of a continuous random variable is its probability density function
    (PDF). PDF is the probability that a random variable has the value `x`, where
    `x` is a point within the interval of a sample. This probability is determined
    by the integral of the random variable’s PDF over the range (interval) of the
    sample. That is, the probability is given by the area under the density function,
    but above the horizontal axis and between the lowest and highest values of range.
    An integral (integration) is a mathematical object that can be interpreted as
    an area under a normal distribution curve. A cumulative distribution function
    (CDF) is the probability that a random variable has a value less than or equal
    to `x`. That is, CDF accumulates all of the probabilities less than or equal to
    `x`. The percent point function (PPF) is the inverse of the CDF. It is commonly
    referred to as the inverse cumulative distribution function (ICDF). ICDF is very
    useful in data science because it is the actual value associated with an area
    under the PDF. Please refer to [`www.itl.nist.gov/div898/handbook/eda/section3/eda362.htm`](http://www.itl.nist.gov/div898/handbook/eda/section3/eda362.htm)
    for an excellent explanation of density functions.


    As stated earlier, a probability is determined by the integral of the random variable’s
    PDF over the interval of a sample. That is, integrals are used to determine the
    probability of some random variable falling within a certain range (sample). In
    calculus, the integral represents a class of functions (the antiderivative) whose
    derivative is the integrand. The integral symbol represents integration, while
    an integrand is the function being integrated in either a definite or indefinite
    integral. The fundamental theorem of calculus relates the evaluation of definitive
    integrals to indefinite integrals. The only reason I include this information
    here is to emphasize the importance of calculus to data science. Another aspect
    of calculus important to data science, “gradient descent,” is presented later
    in Chapter [4](#462931_1_En_4_Chapter.xhtml).


    Although theoretical explanations are invaluable, they may not be intuitive. A
    great way to better understand these concepts is to look at an example.


    In the code example, 2-D charts are created for PDF, CDF, and ICDF (PPF). The
    idea of a colormap is included in the example. A colormap is a lookup table specifying
    the colors to be used in rendering palettized image. A palettized image is one
    that is efficiently encoded by mapping its pixels to a palette containing only
    those colors that are actually present in the image. The `matplotlib` library
    includes a myriad of colormaps. Please refer to [`https://matplotlib.org/examples/color/colormaps_reference.html`](https://matplotlib.org/examples/color/colormaps_reference.html)
    for available colormaps.'
