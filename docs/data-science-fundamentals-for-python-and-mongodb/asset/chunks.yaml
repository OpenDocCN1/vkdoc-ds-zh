    plt.ylabel(''Frequency'')

    plt.title(''Uniform Distribution'')

    plt.axis([-3,3,0,100])

    plt.grid(True)

    plt.figure(''Normal Distribution'')

    normal = np.random.normal(0, 1, 1000)

    count, bins, ignored = plt.hist(normal, 20, facecolor="fuchsia")

