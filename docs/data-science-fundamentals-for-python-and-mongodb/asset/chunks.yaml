    ## 多种可视化示例


    第一个代码示例介绍了安德鲁斯曲线，这是一种可视化高维数据结构的方法。本示例使用的数据是鸢尾花数据集，它是模式识别文献中最著名的数据集之一。鸢尾花数据集包含三种不同类型的鸢尾花（Setosa、Versicolour
    和 Virginica）的花瓣和花萼长度。


    安德鲁斯曲线允许将多变量数据绘制成大量曲线，这些曲线使用样本的属性（变量）作为系数。通过为每个类别使用不同的颜色绘制曲线，可以可视化数据聚类。属于同一类别的样本的曲线通常会靠得更近，并形成更大的结构。鸢尾花数据集的原始数据位于以下
    URL：


