    代码示例首先导入了 `BeautifulSoup`、`request` 和 `json` 库。函数 `build_title()` 将抓取到的标题数据构建成一个字符串。函数
    `release_date()` 将抓取到的日期数据构建成一个字符串。函数 `write_json()` 和 `read_json()` 分别用于写入和读取
    JSON。主程序块首先将 URL 页面转换为一个 `BeautifulSoup` 对象。代码继续将所有 `article` 标签放入变量 `books` 中。通过探索，我发现
    `article` 标签包含了我想抓取的信息。接下来，遍历每个 `article` 标签。如果每个 `article` 标签中的信息结构一致，抓取会容易得多。但由于并非如此，提取每条信息的逻辑就变得相当复杂。每条信息都被放入一个字典元素中，随后被追加到一个列表中。最后，该列表被保存为
    JSON。读取 JSON 并显示几条记录以验证一切正常。


