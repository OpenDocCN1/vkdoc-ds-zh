    # 5. 数据工作


    数据工作详细介绍了数据科学问题解决的最早过程。第一步是识别问题，这决定了后续所有需要完成的工作。第二步是收集数据。第三步是整理（清洗）数据，这一步至关重要。数据整理是将数据转换为对机器学习和其他数据科学问题有用的形式。当然，整理后的数据可能还需要进行清洗。第四步是数据可视化。可视化有助于你了解数据，并有望识别出模式。


