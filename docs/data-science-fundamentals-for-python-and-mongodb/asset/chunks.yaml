    The 1st example is hypothetical and simple, but useful in demonstrating data randomization.
    It begins with a fictitious stock priced at $20. It then projects price out 200
    days and plots.


    ```

    import matplotlib.pyplot as plt, numpy as np

    from scipy import stats

    def cum_price(p, d, m, s):

    data = []

    for d in range(d):

    prob = stats.norm.rvs(loc=m, scale=s)

    price = (p * prob)

    data.append(price)

    p = price

    return data

    if __name__ == "__main__":

    stk_price, days, mean, s = 20, 200, 1.001, 0.005

    data = cum_price(stk_price, days, mean, s)

    plt.plot(data, color="lime")

    plt.ylabel(''Price'')

    plt.xlabel(''days'')

    plt.title(''stock closing prices'')

    plt.show()

    ```


