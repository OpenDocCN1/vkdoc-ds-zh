- fmt: '# Functions and Strings


    Python functions are first-class functions, which means they can be used as parameters,
    a return value, assigned to variable, and stored in data structures. Simply, functions
    work like a typical variable. Functions can be either custom or built-in. Custom
    are created by the programmer, while built-in are part of the language. Strings
    are very popular types enclosed in either single or double quotes.


    The following code example defines custom functions and uses built-in ones:


    ```

    def num_to_str(n):

    return str(n)

    def str_to_int(s):

    return int(s)

    def str_to_float(f):

    return float(f)

    if __name__ == "__main__":

    # hash symbol allows single-line comments

    ''''''

    triple quotes allow multi-line comments

    ''''''

    float_num = 999.01

    int_num = 87

    float_str = ''23.09''

    int_str = ''19''

    string = ''how now brown cow''

    s_float = num_to_str(float_num)

    s_int = num_to_str(int_num)

    i_str = str_to_int(int_str)

    f_str = str_to_float(float_str)

    print (s_float, ''is'', type(s_float))

    print (s_int, ''is'', type(s_int))

    print (f_str, ''is'', type(f_str))

    print (i_str, ''is'', type(i_str))

    print (''\nstring'', ''"'' + string + ''" has'', len(string), ''characters'')

    str_ls = string.split()

    print (''split string:'', str_ls)

    print (''joined list:'', '' ''.join(str_ls))

    ```


    Output:


    ![../images/462931_1_En_1_Chapter/462931_1_En_1_Figa_HTML.jpg](Images/462931_1_En_1_Figa_HTML.jpg)


    A popular coding style is to present library importation and functions first,
    followed by the main block of code. The code example begins with three custom
    functions that convert numbers to strings, strings to numbers, and strings to
    float respectively. Each custom function returns a built-in function to let Python
    do the conversion. The main block begins with comments. Single-line comments are
    denoted with the `#` (hash) symbol. Multiline comments are denoted with three
    consecutive single quotes. The next five lines assign values to variables. The
    following four lines convert each variable type to another type. For instance,
    function `num_to_str()` converts variable `float_num` to string type. The next
    five lines print variables with their associated Python data type. Built-in function
    `type()` returns type of given object. The remaining four lines print and manipulate
    a string variable.


    # Lists, Tuples, and Dictionaries


    Lists are ordered collections with comma-separated values between square brackets.
    Indices start at 0 (zero). List items need not be of the same type and can be
    sliced, concatenated, and manipulated in many ways.


    The following code example creates a list, manipulates and slices it, creates
    a new list and adds elements to it from another list, and creates a matrix from
    two lists:


    ```

    import numpy as np

    if __name__ == "__main__":

    ls = [''orange'', ''banana'', 10, ''leaf'', 77.009, ''tree'', ''cat'']

    print (''list length:'', len(ls), ''items'')

    print (''cat count:'', ls.count(''cat''), '','', ''cat index:'', ls.index(''cat''))

    print (''\nmanipulate list:'')

    cat = ls.pop(6)

    print (''cat:'', cat, '', list:'', ls)

    ls.insert(0, ''cat'')

    ls.append(99)

    print (ls)

    ls[7] = ''11''

    print (ls)

    ls.pop(1)

    print (ls)

    ls.pop()

    print (ls)

    print (''\nslice list:'')

    print (''1st 3 elements:'', ls[:3])

    print (''last 3 elements:'', ls[3:])

    print (''start at 2nd to index 5:'', ls[1:5])

    print (''start 3 from end to end of list:'', ls[-3:])

    print (''start from 2nd to next to end of list:'', ls[1:-1])

    print (''\ncreate new list from another list:'')

    print (''list:'', ls)

    fruit = [''orange'']

    more_fruit = [''apple'', ''kiwi'', ''pear'']

    fruit.append(more_fruit)

    print (''appended:'', fruit)

    fruit.pop(1)

    fruit.extend(more_fruit)

    print (''extended:'', fruit)

    a, b = fruit[2], fruit[1]

    print (''slices:'', a, b)

    print (''\ncreate matrix from two lists:'')

    matrix = np.array([ls, fruit])

    print (matrix)

    print (''1st row:'', matrix[0])

