    dot product for you, which greatly simplifies matrix multiplication .


    ```

    import numpy as np

    def sum_cols(matrix):

    return np.sum(matrix, axis=0)

    def sum_rows(matrix):

    return np.sum(matrix, axis=1)

    def dot(v, w):

