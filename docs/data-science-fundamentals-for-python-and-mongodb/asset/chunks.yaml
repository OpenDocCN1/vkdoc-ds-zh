    The code example begins by importing `json` and `csv` libraries. Function `read_dat()`
    reads and cleans the data (replaces double colons with single colons as delimiters).
    Function `gen_dict()` converts an `OrderedDict` list to a regular dictionary list
    for easier processing. Function `dump_json()` is a custom function that I wrote
    to dump data to JSON. Function `read_json()` reads JSON. Function `display()`
    displays some data for verification. The main block begins by reading the three
    datasets and finding their sizes. It continues by rereading the datasets and dumping
    to JSON. The datasets need to be reread, because a generator can only be traversed
    once. Since the ratings dataset is over one million records, it takes a few seconds
    to process.


    The 2nd code example cleans the movie dataset, which requires extensive additional
    cleaning:


    ```python

