    print (''\nmatrix C (dot product A and B):\n'', C)

    print (''\nC by row:'')

    for i, row in enumerate(C):

    print (''row'', str(i) + '': '', end='''')

    for v in np.nditer(row):

    print (v, end='' '')

    print()

