    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Figg_HTML.jpg](img/462931_1_En_4_Figg_HTML.jpg)


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Figf_HTML.jpg](img/462931_1_En_4_Figf_HTML.jpg)


    输出结果分别对应 10 次、100 次和 1000 次模拟。通过运行 10 次（试验）各包含 1000 次模拟，差距缩小到了 13。因此，我们有很高的置信度认为，最小化该函数所需的迭代次数接近
    1089。我们可以通过将代码再包装在一个循环中来进一步稳定结果，以减少差距和迭代次数的波动。然而，计算机处理时间会成为一个问题。对于这类实验，利用 MCS
    为云计算提供了强有力的理由。理解 MCS 的这种应用可能有些困难，但它是处理并解决数据科学问题的一个非常强大的工具。

