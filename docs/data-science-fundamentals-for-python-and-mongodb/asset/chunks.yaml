- fmt: '# Pandas Correlation and Heat Map Examples


    `Pandas` is a Python package that provides fast, flexible, and expressive data
    structures to make working with virtually any type of data easy, intuitive, and
    practical in real-world data analysis. A `DataFrame` (`df`) is a 2-D labeled data
    structure and the most commonly used object in `pandas`.


    The 1st code example creates a correlation matrix with an associated visualization:


    ```python

    import random, numpy as np, pandas as pd

    import matplotlib.pyplot as plt

    import matplotlib.cm as cm

    import matplotlib.colors as colors

    if __name__ == "__main__":

    np.random.seed(0)

    df = pd.DataFrame({''a'': np.random.randint(0, 50, 1000)})

    df[''b''] = df[''a''] + np.random.normal(0, 10, 1000)

    df[''c''] = 100 - df[''a''] + np.random.normal(0, 5, 1000)

    df[''d''] = np.random.randint(0, 50, 1000)

    colormap = cm.viridis

    colorlist = [colors.rgb2hex(colormap(i))

    for i in np.linspace(0, 1, len(df[''a'']))]

    df[''colors''] = colorlist

    print (df.corr())

    pd.plotting.scatter_matrix(df, c=df[''colors''], diagonal="d",

    figsize=(10, 6))

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig5_HTML.jpg](Images/462931_1_En_5_Fig5_HTML.jpg)


    **Figure 5-5** Correlation matrix visualization


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Figc_HTML.jpg](Images/462931_1_En_5_Figc_HTML.jpg)


    The code example begins by importing `random`, `numpy`, `pandas`, and `matplotlib`
    libraries. The `main` block begins by creating a `df` with four columns populated
    by various random number possibilities. It continues by creating a color map of
    the correlations between each column, printing the correlation matrix, and plotting
    the color map (Figure [5-5](#462931_1_En_5_Chapter.xhtml#Fig5)).


    We can see from the correlation matrix that the most highly correlated variables
    are `a` and `b` (0.83), `a` and `c` (–0.95), and `b` and `c` (–0.79). From the
    color map, we can see that `a` and `b` are positively correlated, `a` and `c`
    are negatively correlated, and `b` and `c` are negatively correlated. However,
    the actual correlation values are not apparent from the visualization.


    A Heat map is a graphical representation of data where individual values in a
    matrix are represented as colors. It is a popular visualization technique in data
    science. With `pandas`, a Heat map provides a sophisticated visualization of correlations
    where each variable is represented by its own color.


    The 2nd code example uses a Heat map to visualize variable correlations. You need
    to install library `seaborn` if you don’t already have it installed on your computer
    (e.g., `pip install seaborn`).


    ```python

    import random, numpy as np, pandas as pd

    import matplotlib.pyplot as plt

    import seaborn as sns

    if __name__ == "__main__":

    np.random.seed(0)

    df = pd.DataFrame({''a'': np.random.randint(0, 50, 1000)})

    df[''b''] = df[''a''] + np.random.normal(0, 10, 1000)

    df[''c''] = 100 - df[''a''] + np.random.normal(0, 5, 1000)

    df[''d''] = np.random.randint(0, 50, 1000)

    plt.figure()

    sns.heatmap(df.corr(), annot=True, cmap="OrRd")

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig6_HTML.jpg](Images/462931_1_En_5_Fig6_HTML.jpg)


    **Figure 5-6** Heat map


    The code begins by importing `random`, `numpy`, `pandas`, `matplotlib`, and `seaborn`
    libraries. `Seaborn` is a Python visualization library based on `matplotlib`.
    The `main` block begins by generating four columns of data (variables), and plots
    a Heat map (Figure [5-6](#462931_1_En_5_Chapter.xhtml#Fig6)). Attribute `cmap`
    uses a colormap. A list of `matplotlib` colormaps can be found at: [`https://matplotlib.org/examples/color/colormaps_reference.html`](https://matplotlib.org/examples/color/colormaps_reference.html).


    ## Various Visualization Examples


    The 1st code example introduces the Andrews curve, which is a way to visualize
    structure in high-dimensional data. Data for this example is the Iris dataset,
    which is one of the best known in the pattern recognition literature. The Iris
    dataset consists of three different types of irises’ (Setosa, Versicolour, and
    Virginica) petal and sepal lengths.


    Andrews curves allow multivariate data plotting as a large number of curves that
    are created using the attributes (variable) of samples as coefficients. By coloring
    the curves differently for each class, it is possible to visualize data clustering.
    Curves belonging to samples of the same class will usually be closer together
    and form larger structures. Raw data for the iris dataset is located at the following
    URL:


    [`https://raw.githubusercontent.com/pandas-dev/pandas/master/pandas/tests/data/iris.csv`](https://raw.githubusercontent.com/pandas-dev/pandas/master/pandas/tests/data/iris.csv)


    ```python

    import matplotlib.pyplot as plt

    import pandas as pd

    from pandas.plotting import andrews_curves

    if __name__ == "__main__":

    data = pd.read_csv(''data/iris.csv'')

    plt.figure()

    andrews_curves(data, ''Name'',

    color=[''b'',''mediumspringgreen'',''r''])

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig7_HTML.jpg](Images/462931_1_En_5_Fig7_HTML.jpg)


    **Figure 5-7** Andrews curves


    The code example begins by importing `matplotlib` and `pandas`. The `main` block
    begins by reading the iris dataset into pandas `df` data. Next, Andrews curves
    are plotted for each class—Iris-setosa, Iris-versicolor, and Iris-virginica (Figure
    [5-7](#462931_1_En_5_Chapter.xhtml#Fig7)). From this visualization, it is difficult
    to see which attributes distinctly define each class.


    The 2nd code example introduces parallel coordinates:


    ```python

    import matplotlib.pyplot as plt

    import pandas as pd

    from pandas.plotting import parallel_coordinates

    if __name__ == "__main__":

    data = pd.read_csv(''data/iris.csv'')

    plt.figure()

    parallel_coordinates(data, ''Name'',

    color=[''b'',''mediumspringgreen'',''r''])

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig8_HTML.jpg](Images/462931_1_En_5_Fig8_HTML.jpg)


    **Figure 5-8** Parallel coordinates


    Parallel coordinates is another technique for plotting multivariate data. It allows
    visualization of clusters in data and estimation of other statistics visually.
    Points are represented as connected line segments. Each vertical line represents
    one attribute. One set of connected line segments represents one data point. Points
    that tend to cluster appear closer together.


    The code example begins by importing `matplotlib` and `pandas`. The `main` block
    begins by reading the iris dataset into pandas `df` data. Next, parallel coordinates
    are plotted for each class (Figure [5-8](#462931_1_En_5_Chapter.xhtml#Fig8)).
    From this visualization, attributes `PetalLength` and `PetalWidth` are most distinct
    for the three species (classes of Iris). So, `PetalLength` and `PetalWidth` are
    the best classifiers for species of Iris. Andrews curves just don’t clearly provide
    this important information.


    Here is a useful URL:


    [`http://wilkelab.org/classes/SDS348/2016_spring/worksheets/class9.html`](http://wilkelab.org/classes/SDS348/2016_spring/worksheets/class9.html)


    The 3rd code example introduces RadViz:


    ```python

    import matplotlib.pyplot as plt

    import pandas as pd

    from pandas.plotting import radviz

    if __name__ == "__main__":

    data = pd.read_csv(''data/iris.csv'')

    plt.figure()

    radviz(data, ''Name'',

    color=[''b'',''mediumspringgreen'',''r''])

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig9_HTML.jpg](Images/462931_1_En_5_Fig9_HTML.jpg)


    **Figure 5-9** RadVis


    RadVis is yet another technique for visualizing multivariate data. The code example
    begins by importing `matplotlib` and `pandas`. The `main` block begins by reading
    the iris dataset into pandas `df` data. Next, RadVis coordinates are plotted for
    each class (Figure [5-9](#462931_1_En_5_Chapter.xhtml#Fig9)). With this visualization,
    it is not easy to see any distinctions. So, the parallel coordinates technique
    appears to be the best of the three in terms of recognizing variation (for this
    example).'
