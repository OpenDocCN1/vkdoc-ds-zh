- fmt: 'The code example begins by importing `matplotlib`, `pandas`, `numpy`, `json`,
    `random`, and `sklearn` libraries. Function `read_json()` reads a JSON file. Function
    `unique_features()` distills unique categories (classes) from a dimension (feature).
    In this case, it distills three classes—Home Office, Corporate, and Consumer—from
    the `segm` feature. Since the dataset is close to 10,000 records, I wanted to
    be sure what classes are in it. Function `sire_features()` distills a new dataset
    with only features of interest. Function `sire_numeric()` converts numeric strings
    to float. Function `sire_sample()` returns a random sample of `n` records filtered
    for a class. Function `rnd_sample()` creates a random sample. Function `convert_float()`
    converts numeric string data to float.


    The main block begins by reading `wrangled.json` and creating dataset features
    with only features of interest. The code continues by creating dataset numeric
    that only includes features with numeric data. Dataset numeric is used to generate
    PCA. Next, three samples of size 100 are created; one for each class. The samples
    are used to create the parallel coordinates visualization (Figure [6-2](#462931_1_En_6_Chapter.xhtml#Fig2)).
    Code for PCA follows by standardizing and transforming the numeric dataset. A
    covariance matrix is created so that eigenvectors and eigenvalues can be generated.
    I include PCA using the correlation matrix because some disciplines prefer it.
    Finally, a visualization of the principal components is created.


    Parallel coordinates show that `prof` (profit) and `sale` (sales) are the most
    important features. The PCA visualization (Figure [6-3](#462931_1_En_6_Chapter.xhtml#Fig3))
    shows that the 1st principal component accounts for 39.75%, 2nd 26.47%, 3rd 22.03%,
    and 4th 11.75%. PCA analysis is not very useful in this case, since all four principal
    components are necessary, especially the 1st three. So, we cannot drop any of
    the dimensions from future analysis.


