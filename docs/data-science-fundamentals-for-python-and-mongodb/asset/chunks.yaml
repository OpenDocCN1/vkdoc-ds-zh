    # 排版后的内容


    代码首先导入 `matplotlib` 和 `numpy` 库，随后定义了四个函数。函数 `demand()` 首先生成一个均匀分布的随机概率，然后根据待解决问题所设定的四种离散概率结果之一进行返回。函数
    `production()` 基于我设计的算法返回利润值。请注意，任何基于利润的算法都可以替换，这充分体现了蒙特卡洛模拟（MCS）的惊人灵活性。函数 `mcs()`
    将模拟运行 10,000 次。增加运行次数可提高预测精度，但代价是需要更多的计算机处理资源和运行时间。函数 `max_bar()` 用于确定柱状图中的最高柱形，以便更清晰地展示。主程序块首先模拟每种离散概率结果下的利润，然后打印并可视化结果。MCS
    预测，生产 40,000 个单位的产品可获得最高利润，如图 2-6 所示。


    增加 MCS 模拟次数能够更准确地预测现实情况，因为其基于随机推理（数据随机化）。你也可以根据解决问题的需要，用此代码结构替换任何离散概率分布。如前所述，你可以使用任何算法与
    MCS 结合进行预测，这使其成为数据科学家手中极其灵活的工具。


