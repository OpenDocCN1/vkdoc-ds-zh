    print (''\nsum A by column:\n'', v_cols)

    v_rows = sum_rows(A)

    print (''\nsum A by row:\n'', v_rows)

    dot_product = dot(v1, v2)

    print (''\nvector 1:'', v1)

    print (''vector 2:'', v2)

    print (''\ndot product v1 and v2:'')

    print (dot_product)

    v1, v2, v3 = [-2, 5, 4], [1, 2, 9], [10, -9, 3]

    B = np.matrix([v1, v2, v3])

