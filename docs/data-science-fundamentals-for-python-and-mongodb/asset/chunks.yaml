    # 控制步长的欧几里得距离最小化


    欧几里得距离是欧几里得空间中两点之间的普通直线距离。借助这种距离，欧几里得空间便成为一个度量空间。与之相关的范数是欧几里得范数（EN）。欧几里得范数为每个向量赋予其箭头长度，因此，欧几里得范数实际上就是向量的大小。定义了范数的向量空间称为赋范向量空间。


    要在三维空间中寻找 `f(x)` 的局部最小值，第一步是找到所有三维向量的最小值。第二步是创建一个随机的三维向量 `[x, y, z]`。第三步是选取一个随机起点，然后沿着梯度
    `f''(x)` 的反方向迈出微小步长，直到到达一个梯度非常小的点。每一步微小步长（从当前向量到下一个向量）都使用欧几里得距离度量来衡量。欧几里得距离度量是欧几里得空间中两点之间的距离。之所以需要这个度量，是因为我们需要知道每一步微小步长该如何移动。因此，欧几里得距离度量补充了梯度下降法，以在三维空间中寻找局部最小值。


    以下代码示例展示了如何在三维空间中寻找 sigmoid 函数的局部最小值：


    ```

    import matplotlib.pyplot as plt

    from mpl_toolkits.mplot3d import Axes3D

    import random, numpy as np

    from scipy.spatial import distance

    def step(v, direction, step_size):

    return [v_i + step_size * direction_i

    for v_i, direction_i in zip(v, direction)]

    def sigmoid_gradient(v):

    return [v_i * (1-v_i) for v_i in v]

    def mod_vector(v):

    for i, v_i in enumerate(v):

    if v_i == float("inf") or v_i == float("-inf"):

    v[i] = random.randint(-1, 1)

    return v

    if __name__ == "__main__":

    v = [random.randint(-10, 10) for i in range(3)]

    tolerance = 0.0000001

    iterations = 1

    fig = plt.figure(''Euclidean'')

    ax = fig.add_subplot(111, projection="3d")

    while True:

    gradient = sigmoid_gradient(v)

    next_v = step(v, gradient, -0.01)

    xs = gradient[0]

    ys = gradient[1]

    zs = gradient[2]

    ax.scatter(xs, ys, zs, c="lime", marker="o")

    v = mod_vector(v)

    next_v = mod_vector(next_v)

    test_v = distance.euclidean(v, next_v)

    if test_v < tolerance:

    break

    v = next_v

    iterations += 1

    print (''minimum:'', test_v, ''\niterations:'', iterations)

    ax.set_xlabel(''X axis'')

    ax.set_ylabel(''Y axis'')

    ax.set_zlabel(''Z axis'')

    plt.tight_layout()

    plt.show()

    ```


    输出：


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig7_HTML.jpg](img/462931_1_En_4_Fig7_HTML.jpg)


    图 4-7


    局部最小值的三维渲染图


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Fige_HTML.jpg](img/462931_1_En_4_Fige_HTML.jpg)


    代码首先导入了 `matplotlib`、`mpl_toolkits`、`random`、`numpy` 和 `scipy` 库。函数 `step()` 根据梯度，按指定步长将向量沿某个方向移动。函数
    `sigmoid_gradient()` 返回 `f''(sigmoid)` 在三维空间中的一个点。函数 `mod_vector()` 确保模拟过程中产生的错误向量能被妥善处理。主程序块首先创建一个随机生成的三维向量
    `[x, y, z]` 作为模拟的起点，然后设定一个容差（精度）。容差越小，结果越精确。接着创建一个子图，用于显示局部最小值的三维渲染图（图 4-7）。梯度下降模拟会生成一组受
    sigmoid 梯度影响的三维向量，直到梯度变得非常小。梯度的大小（模）通过欧几里得距离度量来计算。正如预期，局部最小值接近 0。


    ## 使用蒙特卡洛模拟稳定欧几里得距离最小化


    前一个示例中的欧几里得距离实验基于一个随机过程。具体来说，起始向量 `v` 是通过 `randomint()` 随机生成的。因此，每次运行梯度下降实验时，迭代次数都会产生不同的结果。从第
    2 章我们已经知道，蒙特卡洛模拟（MCS）能高效地对随机过程进行建模。然而，MCS 也能稳定随机实验。


    以下代码示例首先将梯度下降实验包装在一个循环中，该循环运行 `n` 次模拟。通过 `n` 次模拟，计算出平均迭代次数。然后将结果代码再包装在另一个循环中，该循环运行
    `m` 次试验。通过 `m` 次试验，计算出每次平均迭代次数之间的平均差距。差距是通过从最大平均迭代次数中减去最小平均迭代次数得到的。差距越小，结果越稳定（精确）。要提高精度，可以增加模拟次数（`n`）。唯一的限制是计算能力。也就是说，运行
    1000 次模拟比运行 100 次需要更多的计算能力。稳定（精确）的结果允许与其他实验进行比较。


    ```

    import random, numpy as np

    from scipy.spatial import distance

    def step(v, direction, step_size):

    return [v_i + step_size * direction_i

    for v_i, direction_i in zip(v, direction)]

    def sigmoid_gradient(v):

    return [v_i * (1-v_i) for v_i in v]

    def mod_vector(v):

    for i, v_i in enumerate(v):

    if v_i == float("inf") or v_i == float("-inf"):

    v[i] = random.randint(-1, 1)

    return v

    if __name__ == "__main__":

    trials= 10

    sims = 10

    avg_its = []

    for _ in range(trials):

    its = []

    for _ in range(sims):

    v = [random.randint(-10, 10) for i in range(3)]

    tolerance = 0.0000001

    iterations = 0

    while True:

    gradient = sigmoid_gradient(v)

    next_v = step(v, gradient, -0.01)

    v = mod_vector(v)

    next_v = mod_vector(next_v)

    test_v = distance.euclidean(v, next_v)

    if test_v < tolerance:

    break

    v = next_v

    iterations += 1

    its.append(iterations)

    a = round(np.mean(its))

    avg_its.append(a)

    gap = np.max(avg_its) - np.min(avg_its)

    print (trials, ''trials with'', sims, ''simulations each:'')

    print (''gap'', gap)

    print (''avg iterations'', round(np.mean(avg_its)))

    ```


