    ## 产品需求模拟


    离散概率是指样本空间或总体中每个离散随机值发生的概率。随机变量根据机会取不同的值。离散随机变量只能取可数个值。相比之下，连续随机变量可以在一个区间（如正态分布）内取不可数个值。


    在代码示例中，对一种虚构产品的需求通过四个离散概率结果进行预测：随机变量为 10,000 单位的概率是 10%，为 20,000 单位的概率是 35%，为
    40,000 单位的概率是 30%，为 60,000 单位的概率是 25%。简单来说，10%的情况下需求是 10,000，35%的情况下需求是 20,000，30%的情况下需求是
    40,000，25%的情况下需求是 60,000。离散结果的总和必须为 100%。该代码在一个生产算法上运行 MCS，该算法确定每个离散结果的利润，并绘制结果。


    ```

    import matplotlib.pyplot as plt, numpy as np

    def demand():

    p = np.random.uniform(0,1)

    if p = 0.10 and p = 0.45 and p  0:

    disposal_cost = disposal * units_not_sold

    else:

    disposal_cost = 0

    profit = revenue - total_cost - disposal_cost

    return profit

    def mcs(x, n, units, price, unit_cost, disposal):

    profit = []

