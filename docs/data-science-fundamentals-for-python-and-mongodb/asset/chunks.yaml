    return [2 * v_i for v_i in v]

    def negate(function):

    def new_function(*args, **kwargs):

    return np.negative(function(*args, **kwargs))

    return new_function

    def in_random_order(data):

    indexes = [i for i, _ in enumerate(data)]

    random.shuffle(indexes)

    for i in indexes:

    yield data[i]

