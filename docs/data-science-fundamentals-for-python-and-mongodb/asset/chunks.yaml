- fmt: '# Data Scaling and Wrangling


    Data scaling is changing type, spread, and/or position to compare data that are
    otherwise incomparable. Data scaling is very common in data science. Mean centering
    is the 1st technique, which transforms data by subtracting out the mean. Normalization
    is the 2nd technique, which transforms data to fall within the range between 0
    and 1. Standardization is the 3rd technique, which transforms data to zero mean
    and unit variance (SD = 1), which is commonly referred to as standard normal.


    The 1st code example generates and centers a normal distribution:


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    def rnd_nrml(m, s, n):

    return np.random.normal(m, s, n)

    def ctr(d):

    return [x-np.mean(d) for x in d]

    if __name__ == "__main__":

    mu, sigma, n, c1, c2, b = 10, 15, 100, ''pink'',\

    ''springgreen'', True

    s = rnd_nrml(mu, sigma, n)

    plt.figure()

    ax = plt.subplot(211)

    ax.set_title(''normal distribution'')

    count, bins, ignored = plt.hist(s, 30, color=c1, normed=b)

    sc = ctr(s)

    ax = plt.subplot(212)

    ax.set_title(''normal distribution "centered"'')

    count, bins, ignored = plt.hist(sc, 30, color=c2, normed=b)

    plt.tight_layout()

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig10_HTML.jpg](Images/462931_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Subplot for centering data


    The code example begins by importing `numpy` and `matplotlib`. Function `rnd_nrml()`
    generates a normal distribution based on mean (`mu`), SD (`sigma`), and `n` number
    of data points. Function `ctr()` subtracts out the mean from every data point.
    The main block begins by creating the normal distribution. The code continues
    by plotting the original and centered distributions (Figure [5-10](#462931_1_En_5_Chapter.xhtml#Fig10)).
    Notice that the distributions are exactly the same, but the 2nd distribution is
    centered with mean of 0.


    The 2nd code example generates and normalizes a normal distribution:


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    def rnd_nrml(m, s, n):

    return np.random.normal(m, s, n)

    def nrml(d):

    return [(x-np.amin(d))/(np.amax(d)-np.amin(d)) for x in d]

    if __name__ == "__main__":

    mu, sigma, n, c1, c2, b = 10, 15, 100, ''orchid'',\

    ''royalblue'', True

    s = rnd_nrml(mu, sigma, n)

    plt.figure()

    ax = plt.subplot(211)

    ax.set_title(''normal distribution'')

    count, bins, ignored = plt.hist(s, 30, color=c1, normed=b)

    sn = nrml(s)

    ax = plt.subplot(212)

    ax.set_title(''normal distribution "normalized"'')

    count, bins, ignored = plt.hist(sn, 30, color=c2, normed=b)

    plt.tight_layout()

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_5_Chapter/462931_1_En_5_Fig11_HTML.jpg](Images/462931_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Subplot for normalizing data


    The code example begins by importing `numpy` and `matplotlib`. Function `rnd_nrml()`
    generates a normal distribution based on mean (`mu`), SD (`sigma`), and `n` number
