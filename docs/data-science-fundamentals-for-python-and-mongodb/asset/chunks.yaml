    ### 关于作者与关于技术审阅者


    ### 关于作者


    ### 关于技术审阅者


    # 1. 引言


    数据科学是一个跨学科领域，涵盖科学方法、流程和系统，旨在从各种形式（结构化或非结构化）的数据中提取知识或洞见。它借鉴了数学、统计学、信息科学、计算机科学、机器学习、可视化、数据挖掘和预测分析等学科的原理。然而，其根本基础在于数学。


    本书解释并应用了数据科学的基础知识，这对于数据库管理员和开发人员等正在向数据科学实践方向进行职业转型的技术专业人士至关重要。本书以示例驱动，提供完整的 Python
    编码示例，以补充和阐明数据科学概念，并丰富学习体验。编码示例在适当情况下包含可视化。本书是应用和实现机器学习算法的必要前导，因为它向读者介绍了数据科学的基础原理。


    本书内容自成体系。掌握本书内容所需的所有数学、统计学、随机过程和编程技能均在书中涵盖。无需深入了解面向对象编程，因为书中提供并解释了完整可用的示例。示例在必要时会深入且复杂，以确保获得适当的数据科学敏锐度。本书帮助您构建处理和理解复杂数据科学算法所需的基础技能。


    *《数据科学基础：示例驱动》* 是那些有志于从事数据科学职业的人的绝佳起点。与任何科学一样，数据科学的基础知识是胜任工作的前提。如果没有扎实的数学、统计学、数据处理和编码能力，成功之路充其量也只能是“崎岖不平”。本书中的编码示例简洁、准确且完整，完美地补充了所介绍的数据科学概念。


    本书共分为六章。第 1 章介绍了使用 `Python` 处理、转换和加工数据以用于数据科学应用所需的编程基础。第 2 章介绍了用于决策的蒙特卡洛模拟，以及用于统计处理的数据分布。第
    3 章介绍了应用于向量和矩阵的线性代数。第 4 章介绍了用于最小化（或最大化）函数的梯度下降算法，这非常重要，因为大多数数据科学问题都是优化问题。第 5 章侧重于为解决数据科学问题而进行的数据整理、清洗和转换。第
    6 章侧重于通过降维、网络爬取和高效处理大型数据集来探索数据。


    所有编码示例和数据文件的 Python 编程代码均可通过 Apress 在 [`www.apress.com/9781484235966`](http://www.apress.com/9781484235966)
    上查看和下载。具体的链接说明包含在本书的版权页中。


    要安装 Python 模块，`pip` 是首选的安装程序。因此，要从 Anaconda 提示符安装 `matplotlib` 模块：`pip install
    matplotlib`。Anaconda 是一个广泛流行的 Python（和 R）开源发行版，专为大规模数据处理、预测分析和科学计算而设计，可简化包管理和部署。我曾使用过其他发行版，但效果不尽如人意，因此我强烈推荐
    Anaconda。


    ## Python 基础


    Python 具有多项特性，使其非常适合学习和实践数据科学。它是免费的，编码相对简单，易于理解，并且拥有许多有用的库来促进数据科学问题的解决。它还允许快速原型化几乎任何数据科学场景，并以清晰、易于理解的方式演示数据科学概念。


    本章的目标*不是*全面教授 Python，而是介绍、解释和阐明该语言的基础特性（如逻辑、数据结构和库），这些特性有助于原型化、应用和/或解决数据科学问题。


    Python 基础知识通过一系列广泛的活动及相关编码示例来涵盖，具体如下：


    1.  函数与字符串

    2.  列表、元组与字典

    3.  数据读写

    4.  列表推导式

    5.  生成器

    6.  数据随机化

    7.  MongoDB 与 JSON

    8.  可视化

