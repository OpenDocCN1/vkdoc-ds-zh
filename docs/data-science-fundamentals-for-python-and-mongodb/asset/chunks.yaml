    shows plots.


    The code example spawns two important lessons. First, creating a set of randomly
    generated numbers with `ndtri()` creates a normally distributed dataset. That
    is, function `ndtri()` returns the `CDF` of a randomly generated value. Second,
    two normally distributed datasets are not necessarily similar even though they
    look alike. In this case, the correlations are opposite. So, visualization and
    correlations are required to demonstrate the difference between the datasets.


    ## Data Correlation and Basic Statistics


    Correlation is the extent that two or more variables fluctuate (move) together.
    A correlation matrix is a table showing correlation coefficients between sets
    of variables. Correlation coefficients measure strength of association between
    two or more variables.


    The code example creates three datasets with `x` and `y` coordinates, calculates
    correlations, and plots. The 1st dataset represents a positive correlation; the
    2nd, a negative correlation; and the 3rd, a weak correlation.


    ```

    import random, numpy as np

    import matplotlib.pyplot as plt

    import matplotlib.gridspec as gridspec

    if __name__ == "__main__":

    np.random.seed(0)

    x = np.random.randint(0, 50, 1000)

    y = x + np.random.normal(0, 10, 1000)

    print (''highly positive:\n'', np.corrcoef(x, y))

    gs = gridspec.GridSpec(2, 2)

    fig = plt.figure()

    ax1 = fig.add_subplot(gs[0,0])

    plt.title(''positive correlation'')

    plt.scatter(x, y, color="springgreen")

    y = 100 - x + np.random.normal(0, 10, 1000)

    print (''\nhighly negative:\n'', np.corrcoef(x, y))

    ax2 = fig.add_subplot(gs[0,1])

    plt.title(''negative correlation'')

    plt.scatter(x, y, color="crimson")

    y = np.random.normal(0, 10, 1000)

    print (''\nno/weak:\n'', np.corrcoef(x, y))

    ax3 = fig.add_subplot(gs[1,:])

    plt.title(''weak correlation'')

    plt.scatter(x, y, color="peachpuff")

    plt.tight_layout()

    plt.show()

    ```


