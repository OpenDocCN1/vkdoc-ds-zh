    0.5 by A. Next, means for A are calculated by column and row. Finally, numpy matrix
    C is created from three numpy arrays and displayed by row and element.


    The 2nd code example creates a numpy matrix A, sums its columns and rows, calculates
    the dot product of two vectors, and calculates the dot product of two matrices.
    Dot product multiplies two vectors to get magnitude that can be used to compute
    lengths of vectors and angles between vectors. Specifically, the dot product of
    two vectors a and b is a[x] × b[x] + a[y] × b[y].


    For matrix multiplication, dot product produces matrix C from two matrices A and
    B. However, two vectors cannot be multiplied when both are viewed as column matrices.
    To rectify this problem, transpose the 1st vector from A, turning it into a 1
    × n row matrix so it can be multiplied by the 1st vector from B and summed. The
    product is now well defined because the product of a 1 × n matrix with an n ×
    1 matrix is a 1 × 1 matrix (a scalar). To get the dot product, repeat this process
