    neg_gradient(y_i)])

    for v in g:

    theta = np.around(np.subtract(theta,alpha*np.array(v)),3)

    g = []

    print (''maximum:'', np.around(theta, 4),

    ''with'', i+1, ''iterations'')

    print (''magnitude of max vector:'', np.linalg.norm(theta))

