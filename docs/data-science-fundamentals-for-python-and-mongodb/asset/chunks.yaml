    ## Data Randomization


    A stochastic process is a family of random variables from some probability space
    into a state space (whew!). Simply, it is a random process through time. Data
    randomization is the process of selecting values from a sample in an unpredictable
    manner with the goal of simulating reality. Simulation allows application of data
    randomization in data science. The previous section demonstrated how simulation
    can be used to realistically compare iterables (list comprehension, generator
    comprehension, and generators).


    In Python , pseudorandom numbers are used to simulate data randomness (reality).
    They are not truly random because the 1st generation has no previous number. We
    have to provide a seed (or random seed) to initialize a pseudorandom number generator.
    The random library implements pseudorandom number generators for various data
    distributions, and random.seed() is used to generate the initial (1st generation)
    seed number.


    The following code example reads a CSV file and converts it to a list of regular
    dictionary elements. The code continues by creating a random number used to retrieve
    a random element from the list. Next, a generator of three randomly selected elements
    is created and displayed. The code continues by displaying three randomly shuffled
    elements from the list. The next section of code deterministically seeds the random
    number generator, which means that all generated random numbers will be the same
    based on the seed. So, the elements displayed will always be the same ones unless
