- fmt: '# Sigmoid Function Minimization (and Maximization)


    A sigmoid function is a mathematical function with an S-shaped or sigmoid curve.
    It is very important in data science for several reasons. First, it is easily
    differentiable with respect to network parameters, which are pivotal in training
    neural networks. Second, the cumulative distribution functions for many common
    probability distributions are sigmoidal. Third, many natural processes (e.g.,
    complex learning curves) follow a sigmoidal curve over time. So, a sigmoid function
    is often used if no specific mathematical model is available.


    The 1st example finds the local minimum of the sigmoid function:


    ```python

    import matplotlib.pyplot as plt, numpy as np

    def sigmoid(x):

    return 1 / (1 + np.exp(-x))

    def df(x):

    return x * (1-x)

    if __name__ == "__main__":

    x = np.arange(-10., 10., 0.2)

    y, y_dx = sigmoid(x), df(x)

    f, axarr = plt.subplots(3, sharex=True)

    axarr[0].plot(x, y, color="lime")

    axarr[0].set_xlabel(''x'')

    axarr[0].set_ylabel(''f(x)'')

    axarr[0].set_title(''Sigmoid Function'')

    axarr[1].plot(x, y_dx, color="coral")

    axarr[1].set_xlabel(''x'')

    axarr[1].set_ylabel(''dy/dx(x)'')

    axarr[1].set_title(''Derivative of f(x)'')

    axarr[2].set_xlabel(''x'')

    axarr[2].set_ylabel(''GD'')

    axarr[2].set_title(''local minimum'')

    iterations, cur_x, gamma, precision = 0, 0.01, 0.01, 0.00001

    previous_step_size = cur_x

    while previous_step_size > precision:

    prev_x = cur_x

    cur_x += -gamma * df(prev_x)

    previous_step_size = abs(cur_x - prev_x)

    iterations += 1

    plt.plot(prev_x, cur_x, "o")

    f.subplots_adjust(hspace=0.3)

    f.tight_layout()

    print (''minimum:'', cur_x, ''\niterations:'', iterations)

    plt.show()

    ```


    Output:


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Fig5_HTML.jpg](Images/462931_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Subplot of `f(x)`, `f''(x)`, and local minimum


    ![../images/462931_1_En_4_Chapter/462931_1_En_4_Figc_HTML.jpg](Images/462931_1_En_4_Figc_HTML.jpg)


    The code begins by importing `matplotlib` and `numpy`. It continues with functions
    `sigmoid(x)` and `df(x)`, which represent the sigmoid function and its derivative
    algorithmically. The main block begins by creating data for `f(x)` and `f''(x)`.
    It continues by creating subplots for `f(x)`, `f''(x)`, and the local minimum.
    In this case, using subplots was fine for visualization. It is easy to see from
    the `f(x)` and `f''(x)` plots (Figure [4-5](#462931_1_En_4_Chapter.xhtml#Fig5))
    that the local minimum is close to 0. Next, the code runs GD to find the local
    minimum and plots it. Again, the starting point for GD, `cur_x`, was found by
    trial and error. If you start `cur_x` further from the local minimum (you can
    estimate this by looking at the subplot of `f''(x)`), the number of iterations
    increases because it takes longer for the GD algorithm to converge on the local
    minimum. As expected, the local minimum is approximately 0.


    The 2nd example finds the local maximum of the sigmoid function:


    ```python

    import matplotlib.pyplot as plt, numpy as np

    def sigmoid(x):

    return 1 / (1 + np.exp(-x))

    def df(x):

    return x * (1-x)

    if __name__ == "__main__":

    x = np.arange(-10., 10., 0.2)

    y, y_dx = sigmoid(x), df(x)

    f, axarr = plt.subplots(3, sharex=True)

    axarr[0].plot(x, y, color="lime")

    axarr[0].set_xlabel(''x'')

    axarr[0].set_ylabel(''f(x)'')

    axarr[0].set_title(''Sigmoid Function'')

    axarr[1].plot(x, y_dx, color="coral")

    axarr[1].set_xlabel(''x'')

    axarr[1].set_ylabel(''dy/dx(x)'')

    axarr[1].set_title(''Derivative of f(x)'')

    axarr[2].set_xlabel(''x'')

    axarr[2].set_ylabel(''GD'')

    axarr[2].set_title(''local maximum'')

    iterations, cur_x, gamma, precision = 0, 0.01, 0.01, 0.00001

    previous_step_size = cur_x

    while previous_step_size > precision:

    prev_x = cur_x

    cur_x += -gamma * -df(prev_x)

    previous_step_size = abs(cur_x - prev_x)

    iterations += 1

    plt.plot(prev_x, cur_x, "o")

    f.subplots_adjust(hspace=0.3)

    f.tight_layout()

    print (''maximum:'', cur_x, ''\niterations:'', iterations)

    plt.show()

    ```


