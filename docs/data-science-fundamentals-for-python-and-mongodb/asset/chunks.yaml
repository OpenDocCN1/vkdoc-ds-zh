    ## Slicing and Dicing


    Slicing and dicing is breaking data into smaller parts or views to better understand
    and present it as information in a variety of different and useful ways. A slice
    in multidimensional arrays is a column of data corresponding to a single value
    for one or more members of the dimension of interest. While a slice filters on
    a particular attribute, a dice is like a zoom feature that selects a subset of
    all dimensions, but only for specific values of the dimension.


    The code example loads `audio.json` into a Pandas `df`, slices data by column
    and row, and displays:


    ```

    import pandas as pd

    if __name__ == "__main__":

    df = pd.read_json("data/audio.json")

    amps = df[df.desc == ''amplifier'']

    print (amps, ''\n'')

    price = df.query(''price >= 40000'')

    print (price, ''\n'')

    between = df.query(''4999 < price < 6000'')

    print (between, ''\n'')

    row = df.loc[[0, 10, 19]]

    print (row)

    ```


    Output:


