  \ `can_eat()`）的输入。另一方面，`date.original` 将精确填充用户所说的内容，即*明天*，这正是您在此用例中希望用于响应的内容。\n\n\
  请注意，当您浏览上一章和本章的示例时，您已经在对话历史中保存了大量上下文，以便以后可以访问它，无论是姓名、食物还是对话中的任何其他有趣信息。这正是实现上下文敏感对话的全部意义所在！从开发角度来看，这需要额外的工作，但它为对话带来的自然性使其物有所值。\n\
  \n#### 主动行为\n\n大多数 VUI 行为是**被动**的，是对请求的直接响应结果。**主动行为**包括在对话中主动提供或完成步骤，而不是等待用户提出要求。它包括使用计划事件进行时间敏感的提醒和操作，例如告诉用户该吃药了或该去赴约了——就像一个乐于助人的人类助手一样。这就是您的\
  \ VUI 如何显得智能，同时让对话对用户来说更轻松、更相关的方式：\n\n*   **VUI**    *您的信用卡余额 46.23 美元将在 5 天后到期。现在想支付吗？*\n\
  *   **用户**    *好的，请。*\n*   *~~~ ~~~*\n*   **VUI**    *外面的灯还亮着。要我关掉吗？*\n*   **用户**    *关掉它！*\n\
  \n主动行为基于计划事件、过去的用户行为、设置、提醒、预期的后续请求等。上下文可以是用户相关的（*是时候开始你的准备了！*）或用户无关的（*报税日还有两周*）。它可以基于静态信息，如用户设置和收藏夹（*Massive\
  \ Attack 乐队 11 月 5 日在 The Arena 的演唱会门票刚刚开售。要我找票吗？*），或与某个事件相关（*布伦特正在路上，所以我打开了烤箱。大约\
  \ 10 分钟后温度会升到 425 度*）。\n\n请确保任何主动行为对用户是有帮助且受欢迎的：\n\n*   考虑一天中的时间和其他活动。我们很多人都经历过设备在半夜说话或亮起，抱怨连接丢失或更新固件的情况。问问自己这条消息是否真的需要。\n\
  *   考虑个人通知的措辞。不要大声宣布*是时候做结肠镜检查了*，这可能会让用户难堪（是的，我们差点就这么做过一次），而是为移动应用使用文本框弹出窗口，或使用模糊的*您有一个任务提醒*类型的提示。处方续药和其他医疗服务\
  \ IVR 需要对药物细节和预约含糊其辞。\n*   提供关于主动行为的类型、时间和频率的设置，并在初始设置时非常清晰地说明。有些人希望听到这些语音通知；其他人则不希望。还要确保用户以后可以更改这些设置。\n\
  \n实施主动行为可以在用户无需自己采取任何步骤的情况下提供个性化服务。优秀的 IVR 长期以来一直利用主动行为，提醒来电者即将到来的截止日期，并根据上下文（通常是时间或日期）提供不同的选项或示例。即时信息是基于上下文的主动性。一个程序准备助手有许多主动行为，既有用户相关的，也有时间敏感的上下文。正如您所料，我们在\
  \ 22otters 构建的多模式程序准备助手结合了多种上下文来发送其主动通知，包括程序类型、程序日期、药物详细信息以及当前时间和日期等。图 14-4 说明了几个主动提醒的概念：饮食变更通知和开始准备的提醒。应用中的大多数屏幕都有画外音；语音和图形相互协调，以强化信息，同时通过提供交互替代方案（每种模式独立运作）覆盖更多用户和上下文。语音更适合某些通知，而不是其他通知——我们已经提到过大声宣布用户即将进行的程序可能会让用户难堪的风险，但在准备阶段，音频通知是有帮助的。\n\
  \n![../images/507213_1_En_14_Chapter/507213_1_En_14_Fig4_HTML.jpg](img/507213_1_En_14_Fig4_HTML.jpg)\n\
  \n图 14-4\n\n多模式系统中的主动提醒（22otters 程序准备助手）\n\n我们这里没有足够的篇幅来充分讨论这个主题，但我们鼓励您思考是否以及如何在您自己的\
  \ VUI 中融入主动行为。我们将在下一章中再次讨论它，因为它与个性化密切相关。\n\n\n\n##### 主动行为的代码\n\n既然你已经记录了时间，添加主动行为就很简单了！代码清单\
  \ 14-9 展示了 webhook^(⁹⁸) 中的一个新部分，其中包含一个虚拟函数（位于 `utils.py` 中），用于检查即将发生的事件，并将此类事件的通知添加到现有提示中（位于\
  \ `main.py` 中）。该检查在意图测试之后进行；它可以应用于任何意图。\n\n```\ndef upcoming_events(timestamp):\n\
  \"\"\"\npylint: disable=unused-argument\n返回即将发生事件的主动列表\n\"\"\"\nreturn []\ndef main():\n\
  # ...... 为聚焦代码而截断 ......\n# 添加一个可选的主动提示，作为即将发生事件的提醒。\nfor message in upcoming_events(df_request.current_time):\n\
  df_response.output_text = f\"{df_response.output_text} {message}\"\n代码清单 14-9\n\
  添加即将发生事件的主动通知\n```\n\n#### 主题、领域和世界知识\n\n上下文会影响人类的识别和解读，因此机器也需要如此。上下文决定了如何解读**同音异义词**，即发音相同但含义不同的词语，以避免出现以下真实的语音助手对话。因缺乏对话上下文而导致混淆的经典例子是古老的\
  \ Abbott 和 Costello 喜剧短剧《谁在一垒？》，剧中虚构棒球队的球员绰号有“谁”、“什么”和“我不知道”。你可以轻松在网上找到它的录音。看看“here”可能出什么问题：\n\
  \n- **用户** *香港现在几点？*\n- **VUI** *现在是早上 7 点。*\n- **用户** *那这里呢？*\n- **VUI** *“你听到我所听到的吗？”是一首歌……*\
  \ → ☹ 把“这里”听成了“听到”\n\n幸运的是，了解一些上下文通常会让对话更清晰，而不是更模糊。它还能帮助我们作为听者理解那些可能含糊不清的词语——这对\
  \ VUI 也同样适用。\n\n图 14-5 展示了基于领域的解读与识别/解读之间的交互。\n\n![../images/507213_1_En_14_Chapter/507213_1_En_14_Fig5_HTML.png](img/507213_1_En_14_Fig5_HTML.png)\n\
  \n图 14-5\n\n对话的上下文主题影响 ASR 和 NL 对语句的解读\n\n你的 VUI 需要为每个任务匹配用户的领域知识。即使你知道花生严格来说不是坚果而是豆类，但如果你要查询在售的坚果酱列表却没有得到任何花生酱信息，并且当你询问\
  \ VUI 时它告诉你花生酱不是用坚果做的，你也不会高兴。没人喜欢自作聪明的 VUI。\n\n如果你与一个和你对某个主题有相同深度知识的人交谈，你们的对话方式会与和一个对此一无所知的人交谈时不同。你也可以在\
  \ VUI 中利用这一点。多年来，我们看到过一些出色的语音解决方案，它们并不被认为是“自然的”，因为它们不像喝咖啡时的闲聊；相反，它们之所以成功，是因为融入了人们在特定情境下如何说话的知识，比如下注赛马、预约货运或买卖股票期权。专家与新手领域知识是你应该关注的一种上下文。\n\
  \n如果常用词因领域不同而有不同说法，请确保你的 VUI 既能理解，也能在提示中按预期说出这些词。想想看，如果数字 *1120* 指的是时间、金钱、街道地址或电视频道，你会如何说出它？图\
  \ 14-6 中不理想的情况是基于真实的 VUI 交互构建的。\n\n![../images/507213_1_En_14_Chapter/507213_1_En_14_Fig6_HTML.png](img/507213_1_En_14_Fig6_HTML.png)\n\
  \n图 14-6\n\n领域影响常用词的发音方式；提示必须反映预期，ASR 和 NL 必须正确解读\n\n来自语音前线\n\n一位语音助手用户说：“我问 [IVA\
  \ 名称] *天气怎么样？* 它告诉了我圣罗莎的天气。我从未在任何 [公司] 网站字段中输入过我的位置，所以它只是告诉了我 ISP 节点所在位置的当前温度。该应用通过其首页内置的天气\
  \ API 进行地理定位，告诉我实际位置的当前温度。为什么它不把这个信息推送给自己的设备呢？”\n\n#### 基于地理位置的行为\n\n天气、交通、电影时间、餐厅搜索结果——这些都依赖于用户的位置。如果你能利用位置信息让用户的生活更轻松，那就去做。但同时，不要总是假设他们想知道当前位置附近的信息。根据任务做出最可能的假设，同时允许用户指定其他位置，并想办法告诉用户如何更改位置或设置自己的默认位置。\n\
  \n再次思考人们是如何说话的。如果他们处于同一位置，那么在询问时间和天气时，默认假设就是“这里”。所以，如果你问家庭助手*天气怎么样？*或*现在几点？*，就不应期望明确的位置信息。如果一个位置名称与另一个位置有歧义，但距离用户足够近可视为本地，那么应优先选择本地位置。\n\
  \n地理位置还应用于正确发音地名：*Versailles* 在指法国宫殿（结尾类似 *sigh*）和匹兹堡附近的行政区（结尾类似 *sails*）时发音截然不同。澳大利亚的\
  \ *Brisbane*（结尾类似 *Ben*）与加利福尼亚的 *Brisbane*（结尾类似 *bane*）也是如此。这在技术上并不困难；只是另一个需要处理的细节。但这很重要。\n\
  \n由于与内容访问相关的商业和法律规则，地理位置也变得复杂。在欧洲，VUI 需要明确询问用户是否可以根据其位置来提供响应；而在美国，目前则不需要。如果有人请求的内容因商业原因在用户所在位置不可用，你需要优雅地处理这种情况。\n\
  \n来自语音前线\n\n安正在一个支持语音的扬声器上听音乐，并说*跳过*到下一首歌。音乐继续播放，而语音集成却试图启动“SkipIt TiVo”，这是一个与当前媒体流和设备都无关的应用程序，并且家里从未有人启动过它。\n\
  \n\n\n#### 邻近性与相关性\n\n**邻近性**适用于对话式交互设计的多个层面。它通常指物理上的接近程度：用户、`VUI`以及交互目标对象（如果有的话）之间的相对位置。当人们彼此靠近时，我们共享物理环境信息，比如知道灯是否亮着。我们期望智能自动化系统也能拥有这种共享环境信息——否则，它就算不上真正的智能。如果我在一个房间设定了闹钟，然后在另一个房间询问同一个助手还剩多少时间，我期望它能知道。\n\
  \n相关性与邻近性有关。相关的事物在重要性或意识层面是接近的，因此即使物理上不接近，也属于心理上的邻近。这包括所有权、账户、家庭、住户等。*我的健身歌单*与我的邻近性，是*鲍勃的健身歌单*或*一个健身歌单*所不具备的。如果我在办公室刚问过我的歌单，那么我的办公室音箱在时间和相关性上，就比其他所有音箱与我更邻近。\n\
  \n你如何追踪邻近性，会影响你如何解读潜在的模糊请求以及如何回应。回指（Anaphora）基于邻近性，因为它指的是对话中“附近”已经建立的内容。如果只有一台设备在播放内容，那么询问正在播放什么或要求调高音量的请求，就与那台设备最相关。\n\
  \n你需要决定何时进行假设，何时进行询问。这是一种平衡：只有从用户角度出发确实需要时才询问。用户创建的内容和个人设置应始终优先于默认设置；适用于当前设备或环境的解读，应优先于不适用的情况。在第\
  \ 16 章中，你将学习如何在响应后立即请求用户反馈，以判断`VUI`是否理解正确。\n\n**来自语音前线**\n\n安问道：*从旧金山飞到纽瓦克需要多长时间？*\
  \ 她的关联日历上恰好有一个相同行程的航班，导致语音助手过度解读了她的问题，将其理解为关于那个特定航班，而没有回答实际的问题：*您的日程上有一个航班。阿拉斯加航空\
  \ 266 号航班，从旧金山飞往纽瓦克，于 7 月 21 日上午 9:40 起飞。* 如果答案中同时包含，例如，*计划飞行时间为 6 小时 30 分钟*，那么这将是一个不错的回答。返程方向也有答案：*从纽瓦克到旧金山的直飞航班大约需要\
  \ 5 小时 55 分钟。* 但两个方向的飞行时间并不相同。而且一旦返程航班被添加到日历中，返程的飞行时间信息就不再可用了！\n\n#### 设备的数量与类型\n\
  \n理解人们期望设备如何交互。不同的设备应该“知道”彼此的存在吗？如果它们能够做到，那么答案很可能是“是的”。如果你家中有多个设备连接，它们如何交互？如果你在厨房设置了一个计时器，然后去另一个房间等待，你不仅希望在那个房间听到计时结束的通知，还希望能够询问还剩多少时间。\n\
  \n如果你的家中有两台设备，A 和 B，A 正在播放音乐而 B 没有播放任何内容，你是否需要明确指出要调低哪台设备的音量或进行消歧？很可能不需要。但如果两台设备同时播放不同的内容，那么就需要——除非一台设备有屏幕而另一台没有，并且你在一台设备上播放视频内容，然后要求*调高亮度*。\n\
  \n设备的输入模态是另一个环境因素。如果用户通过语音提出请求，他们很可能期望得到口头回应，而不是屏幕上的无声列表。但正如你所见，这并非总是如此。例如，像开灯或调高音量这样的设备控制，会通过其动作本身提供回应。类似地，如果输入是键入的文本或点击按钮，你的默认假设不应是以语音回应。然而，这并非绝对；任务和用户偏好具有优先权。\n\
  \n#### 时间与日期\n\n如果你的`VUI`执行任何与时间、日期相关的操作，请追踪当前时间、星期和日期。本章中你已经看到了这些环境因素的例子。这些环境因素应用广泛，可以单独使用，也可以与其他因素结合使用。你可能希望使用相对时间参考，如*今晚*或*4\
  \ 小时后*，进行主动对话，并根据一天中的时间、一周中的某天甚至月份给出不同的回应。如果你的`VUI`涉及任何人工交接，例如转接给护士或客服代表，请确保你的行为考虑了时区和营业时间。如果无人可用，就不要提供转接选项！\n\
  \n在过去的几章中，我们已经看到你如何越来越多地追踪时间，无论是当前时间还是最近意图的时间戳。借助你已经在 webhook 中构建的基础设施，添加时间敏感逻辑相对简单，就像你之前处理主动通知那样。\n\
  \n#### 用户话语的措辞\n\n在本书中，你将了解到提示措辞的细微差异如何对用户的反应和回应产生惊人的巨大影响。看看下面的示例对话；用户询问的是相同的信息，但措辞不同：\n\
  \n*   **用户**    *告诉我今天下雨的可能性有多大。*\n\n*   **VUI**    *今天你很可能会遇到一些降雨。*\n\n*   *~~~\
  \ ~~~*\n\n*   **用户**    *今天会下雨吗？*\n\n*   **VUI**    *是的，今天可能会下雨。*\n\n*   *~~~ ~~~*\n\
  \n*   **用户**    *今天这里预报的降雨概率是多少？*\n\n*   **VUI**    *目前，今天这里预计的降雨概率是 80%。*\n\n你的`VUI`能否用同一个回应来回答这三个问题？当然可以。试着用这个回应来读一下三个用户话语：*今天降雨概率很高。目前是\
  \ 80%。* 这样可行，对吧？但它丢失了一些对用户提问的呼应。特别是，它没有用*是的*来回答那个“是/否”问题。这在英语中可行，但在其他语言中可能不行，而且听起来会有点像是你忽略了用户所说的话。\n\
  \n#### 系统状态\n\n除了环境、意图和词槽之外，还有一个重要的环境维度与第 12 章和第 13 章相关联。这个缺失的维度是错误处理，包括重试次数、系统错误结果和识别置信度。我们称这些为状态。可以将环境视为基于用户特征的变量，而状态则是语音系统的特征。当然，你怎么称呼它们并不重要，但考虑它们却至关重要。对于每一种环境组合，你可能都有多种状态，每种状态都会导致不同的提示和后续步骤：高置信度、中等置信度、重试、哪些其他词槽已被填充，等等。你需要考虑的另一个系统状态是最终结果或任务完成情况，你将在下一章中了解这一点。\n\
  \n\n\n#### 在模块化与多轮对话中追踪上下文\n\n您已经注意到各种上下文如何相互影响，以及它们的组合数量增长得有多快。这正是需要对话管理以及超越简单示例对话的详细\
  \ VUI 设计规范的核心原因。当您拥有，比如说，十个意图、六个槽位和五个上下文时，您需要一种方法来传达您期望在每种情况下发生什么，并追踪每个响应是否恰当。而这甚至还算不上一个大型系统。\n\
  \n所有这些组合的结果是产生了许多用例，每个用例都需要根据识别到的内容及其分配的意图、结果的置信度、关于新信息与已知信息的假设、用户偏好和位置、先前的对话、请求的措辞方式等等，进行恰当的处理。\n\
  \n自然对话既不是所有入口和出口路径都预先定义好的独立模块，也不是一轮轮对话中完全自由、\"百无禁忌\"的大杂烩。当然，对话有其规则；但它们更像是可预测的建议，而非法律。对话是关联模块的链条，其中一些模块出现的可能性高于其他模块，并且可能突然切换到新的模块。\n\
  \n当您设计和构建一个更大的系统时，您需要一种方法来追踪用户在对话中可能采取的步骤，考虑到所有上下文和条件，以便您能正确解释逐步的请求并做出恰当的响应。正如您所见，回指和话语标记依赖于上下文的组合。如果您独自处理整个系统，要把它做对已经够难了。如果您与他人分工合作，挑战就更大了。您需要一个计划。答案在于结合您目前学到的几个概念：\n\
  \n-   追踪所有相关的上下文和可用条件：\n    -   意图标签，它基于到目前为止所说的所有内容（包括已确立的对话主题或领域）来编码当前话语的含义。\n\
  -   编码言语行为、置信度、重试次数等的标签。\n-   将上下文标签与措辞和行为模式关联起来，并对其进行调整以匹配意图。\n-   在移交到下一轮对话之前处理确认：\n\
  \    -   确认应尽可能具有针对性，但不应超出其上下文的针对性范围。\n-   参考高层流程和详细规范，并使用对话管理器策略来追踪整个对话过程是否从始至终都能正常工作：\n\
  \    -   由于对话建立在先前发生的事件之上，对话中的下一轮对话更有可能与上一轮相关，而非无关。利用这种可预测性：首先，尝试匹配最详细的上下文，并给出最精准的响应；如果上下文不匹配，则转向更宽泛、更通用的响应。\n\
  \n这种方法的美妙之处在于，它将 UX/UI 设计的最佳实践与可实现的东西结合了起来。其基本概念足够通用，您可以针对任何平台以及您选择处理的任何上下文复杂度级别进行修改，包括从少量且宽泛的上下文开始，并在后续阶段进行扩展。\n\
  \n您的详细规范——因此也包括您的实现和测试用例——需要涵盖所有组合。这意味着，对于每个意图，您需要为每个相关上下文（在我们的术前准备应用案例中，包括手术前的天数）下的每个履行结果（找到、未找到）指定所有条件（快乐路径、重试\
  \ 1-N 次）下的行为（提示、流程、多模态操作）。此外，您可能还需要为一个\"家庭\"中的不同用户提供不同的行为，以及多层行为。\n\n规模扩张可能会失控，但答案不是忽略它或减少更粗略的上下文，而是找到模块化和重用模式的方法。将意图名称与您确定的一组言语行为标签结合起来，这些标签要能覆盖您跨意图处理的变体。例如，您可以使用\
  \ `_cm` 表示\"接近匹配\"，`_vm` 表示\"模糊匹配\"，`_nm` 表示\"无匹配\"。请看下面这个简单的响应示例，您可以想象用于术前准备问题的场景。这里，标签\
  \ `faq.food-5_cm` 告诉我们，这是对手术前五天关于特定食物（*我今天能吃米饭吗？*）的问题的响应，该问题被识别为接近匹配；数据库查询确定该食物仍然可以食用：\n\
  \n-   `faq.food-5_cm` *是的，你今天仍然可以吃 $FOOD。*\n-   `faq.food-5_vm` *$FOOD 今天可以吃，如果……\
  \ <澄清>。*\n-   `faq.food-5_nm` *我不确定。它和什么其他食物类似？*\n-   *~~~  ~~~*\n-   `faq.drink-5_cm`\
  \ *是的，你今天仍然可以喝 $DRINK。*\n-   `faq.drink-5_vm` *$DRINK 今天可能可以喝。*\n-   `faq.drink-5_nm`\
  \ *我不确定。它和什么类似？*\n-   *~~~  ~~~*\n-   `faq.med-5_cm` *是的，你今天仍然可以服用 $MED。*\n-   `faq.med-5_vm`\
  \ *请问你的医生 $MED 今天是否可以服用。*\n-   `faq.med-5_nm` *我不确定。如果它有其他名称，请用那个名称问我。*\n\n这几个提示就能处理大量的请求。您可以通过使用\"\
  吃/喝/服用\"来合并 `_cm` 响应，但我们不会这样做：一些变化是好的，通过使用更具体的动词，您间接地教会用户也这样说，这反过来又允许您为食物/饮料/药物给出更有针对性的\
  \ `_nm` 响应，即使特定项目是无匹配——这是一个很好的回退策略。\n\n您对数据的直接控制越多，就越能解决解释和履行方面的问题。但保持数据最新是一项繁重的工作，甚至可能无法实现。如果您的\
  \ VUI 有一个依赖餐厅菜单的饮食日记，您就需要依赖外部数据。如果您的 VUI 播放音乐，您首先需要理解用户要求的艺术家和曲目名称——这已经很困难了！它涉及搜索包含外国名称甚至符号的音乐目录。一旦您认为找到了，您还需要知道用户有权访问哪些服务，以便在这些服务中进行搜索。那么，您如何知道是否找到了一个好的匹配，如果找不到又该如何回应呢？\n\
  \n随着内容提供商的分裂以及平台对其数据保护得越来越严密，它们之间合作的意愿也越来越低。最终用户成了受害者。而他们会责怪您和您的 VUI。您需要应对这些限制，以尽可能提供良好的体验。\n\
  \n\n\n##### 执行结果\n\n你的 VUI 需要根据执行结果做出适当响应。执行结果是指当请求预期会引发某个动作（如关灯或预约）或内容交付（如播放特定电影或歌曲）时的最终结果。你的语音识别和意图解析可能完美无缺，但如果缺少正确的数据来执行动作或回答问题，对话就失败了。识别错误、意图映射错误和执行错误之间存在重要区别。你的\
  \ VUI 响应应体现这些区别，以避免用户产生误解和厌烦。大多数用户并不关心他们为什么没有得到自认为请求的内容；他们只知道没得到。他们也不关心哪些环节是你无法控制的。他们正在与你的\
  \ VUI 对话，提出了完全合理的要求，却得到了意想不到的结果。\n\n如果你无法保证数据或内容的访问（因为这超出了你的控制范围），你需要在响应中体现这一点。关键在于追踪所有可用的上下文，包括执行确定性，并利用这些信息尽可能准确且信息丰富地做出响应。这样你就能避免图\
  \ 14-7 中的情况。以下是当前语音助手对 *播放 Massive Attack 的歌曲《Risingson》* 的实际响应，这是一个完全明确的请求，人类 DJ\
  \ 很容易通过找到该艺术家演唱的这首歌来处理。问题不仅在于执行结果不正确，还在于伴随的语音响应没有承认存在问题。\n\n![../images/507213_1_En_14_Chapter/507213_1_En_14_Fig7_HTML.png](img/507213_1_En_14_Fig7_HTML.png)\n\
  \n图 14-7\n\n次优的音乐请求执行结果，伴随的响应提示与结果不匹配。所有示例均来自近期的智能音箱。\n\n预期结果与实际结果之间的这种不匹配很重要，因为它会削弱用户对语音解决方案的信任，并降低他们未来使用语音的意愿。作为用户，如果我要求播放“那首歌”，就不要给我一个播放列表——除非你告诉我你没有那首歌。如果你开始播放整张专辑，而这首歌并非第一首，那会显得很奇怪。不要给我一个不同的曲目——除非你以某种方式表明你对你的响应不确定。不要给我其他艺术家的版本——除非你没有我要求的那一版。也永远不要漫无目的地罗列一些不相关的选项，或者表现得比你应有的更确定——直接说你做不到。使用简短的短语就能达到很好的效果，比如\
  \ *我找不到那个版本，但我找到了这个*…… 或者 *这或许能回答你的问题*……\n\n即使是最有经验的语音开发者也可能陷入思维定势，忘记 NL 解析和执行结果不是一回事。我们曾就规范中的示例短语是否因无法执行而“无效”发生过短暂分歧。幸运的是，在我们讨论了*请求*逻辑上有效的内容与*接收*到它之间的区别后，分歧很快就消除了。那次对话的内容与表\
  \ 14-2 中的内容类似。想象一个处理来自不同来源的音视频内容请求的 VUI。该表中的所有五个请求都是结构良好的英语请求，易于解析并赋予含义，但并非所有请求都能因不同原因而成功执行：\n\
  \n表 14-2\n\n不同媒体类型的内容请求及其对应的执行行为\n\n| 请求（媒体内容 VUI） | 解析 | 在范围内 | 可能执行 | 实际匹配执行 |\n\
  | --- | --- | --- | --- | --- |\n| ***1.***  *播放* Amazon Prime 上的《绿皮书》。 | 良好 | 是\
  \ | 是 | 成功 |\n| ***2.***  *播放* Netflix 上的《绿皮书》。 | 良好 | 是 | 是 | 失败 |\n| ***3.***\
  \  *播放* Massive Attack 的《Risingson》。 | 良好 | 是 | 是 | 成功 |\n| ***4.***  *播放* The Beatles\
  \ 的《Risingson》。 | 良好 | 是 | 否 | 失败 |\n| ***5.***  *播放* 我的语音留言。 | 良好 | 否 | 否* | 失败\
  \ |\n\n*   请求 5 不在该 VUI 的范围内，因为它不是媒体内容请求；因此，在不更改 VUI 的情况下，出于业务原因无法执行。\n\n*   请求\
  \ 1 和 2 都是潜在可行的：从电影内容源请求指定电影显然在该应用的范围内。但在撰写本文时，该电影不在 Netflix 上。因此，执行失败不是逻辑问题（电影存在），而是当前的可用性问题。将来，请求\
  \ 2 很可能会成功。\n\n*   请求 3 和 4 都是范围内的音乐请求。但请求 4 无法执行，因为 The Beatles 从未录制过这首歌。\n\n为什么这很重要？因为你需要根据不同的结果做出不同的响应，并反映导致这些结果的不同原因。表\
  \ 14-3 展示了响应如何反映结果。对于如何处理执行失败，你会有多种选择。如果可能，帮助用户得到他们想要的东西；请仔细查看请求 2 和 4 中“失败”的响应。\n\
  \n表 14-3\n\n响应反映了每个请求的媒体类型和执行结果\n\n| 请求 | 可能的响应 |\n| --- | --- |\n| ***1.***  *播放*\
  \ Amazon Prime 上的《绿皮书》。 | 《绿皮书》。正在投放到您的客厅电视。 |\n| ***2.***  *播放* Netflix 上的《绿皮书》。\
  \ | *a.* Netflix 上目前没有《绿皮书》。 |\n| *b.* Netflix 上没有《绿皮书》，但您可以在 Prime 上以 5.99 美元租借。想从\
  \ Prime 上播放吗？ |\n| ***3.***  *播放* Massive Attack 的《Risingson》。 | *这是 Massive Attack\
  \ 的《Risingson》。* |\n| ***4.***  *播放* The Beatles 的《Risingson》。 | *我找不到 The Beatles\
  \ 的《Risingson》，但这是 Massive Attack 的版本。* |\n| ***5.***  *播放* 我的语音留言。 | *我只能播放音乐和视频内容。*\
  \ |\n\n正是这种细节程度让用户觉得“智能”。这“只是”更多的工作，但值得。作为内容消费者，我们希望随时轻松访问任何歌曲或电影。技术已经存在，有时我们当然可以进入某个应用或上网，精确选择我们想要的内容。但内容在提供商之间变得越来越分散，他们限制我们在某些时间访问某些电影，或将流媒体限制在某些生态系统和设备上。如果是现场活动，我们还需要依赖准确的最新时间表。如果你的\
  \ VUI 无法完全控制执行的每一步，你最好有能力调整你的响应以匹配实际情况。\n\n成功提示 14.5 先了解情况，再做出响应\n\n当你无法控制内容执行或无法访问所有元数据时，了解你拥有什么至关重要。在\
  \ VUI 中，你能做的最糟糕的事情之一就是言行不一。如果你的 VUI 从外部来源返回内容或信息，请始终先确定执行结果，然后用反映该结果的提示进行响应。这可能需要额外的代码步骤并带来潜在延迟，但在你确定能否真正满足用户请求之前，切勿做出响应。只要用户感到被理解、觉得你尽力了，并且明白为什么无法得到他们想要的东西，他们就能接受不完美的执行结果。\n\
  \n\n\n### 接下来是什么？\n\n你可能会担心：如果每种上下文和路径条件的组合都需要定制后续行为，实现过程会不会失控？对于上下文相关的回复，正如我们目前讨论的其他主题一样，语音实现始终是一种平衡艺术。你可以加入非常精准的行为，从而产生听起来更智能的对话。代价是需要更多测试，尤其是意图边界情况的测试，以确保在所有上下文中回复都清晰合理。而采用更粗粒度的回复，则可以更快地成功投入生产。\n\
  \n我们推荐的方法是先从小处着手，在第一阶段使用较少的意图和更粗粒度的回复集。请记住，你需要处理语音中所有合理的请求——不能直接忽略那些你无法满足的请求。但你可以从一些通用回复开始，收集数据，观察用户如何表述请求以及他们试图做什么。然后，在下一阶段，拆分意图和回复，以便更直接地回应问题和请求。你仍然会使用第一阶段更宽泛的意图作为未覆盖请求的默认行为。话虽如此，我们也坚信，从现在起，能否良好地实现上下文将是区分成功语音系统的关键。以下是一个简单且富有洞察力的练习，任何人都可以尝试并从中获益良多：\n\
  \n1.  与你能够访问的几个语音用户界面进行对话。仔细聆听你得到的回复，尤其是当你的表述不在明显的“快乐路径”上时：\n    1.  将相同的请求表述为陈述句、一般疑问句和特殊疑问句。尝试部分指定和完全指定的请求，甚至超出范围的请求。\n\
  \    2.  以本章学到的任何方式改变你的上下文。\n2.  回复是否因上下文而异？如果是，回复是如何反映你的上下文的？它们是否精准？它们是没有做出假设，还是做出了错误的假设？回复中的哪些内容让你得出这个结论？\n\
  3.  你会做出哪些改变？编写反映你上下文的示例对话，使其听起来更智能。思考你需要跟踪和实现哪些内容才能让这些对话成为现实。\n\n### 总结\n\n-  \
  \ 上下文是多维度的，影响对话中的一切。你融入的上下文越多，你的语音用户界面对话就越智能、越有趣。\n-   通过采用一种能够编码并优先处理设计模式、上下文和条件的对话管理器策略，最大限度地减少糟糕的对话转换，并最大限度地提高模块化程度。\n\
  -   用户留存很大程度上取决于他们对语音用户界面的信任。在“有帮助且主动”与“烦人且侵扰”之间只有一线之隔。\n\n脚注 1 2 3 4\n\n"
- '# 15. 创建安全的个性化体验


  本章将基于你在第 14 章学到的关于上下文的知识，进一步探索如何创建用户信任的个性化语音界面。即使在撰写本章时，每周都有关于大公司数据泄露的报道，导致健康记录、财务信息和密码被曝光。在语音行业，有报道称工作人员会监听^(⁹⁹)你的私人对话，并且智能音箱应用容易受到网络钓鱼攻击，这些都加剧了人们对隐私侵犯的担忧。我们甚至不必提及任何国际政治或法律话题。


  新闻头条利用每个人的恐惧。毕竟，恐惧能带来销量！这些担忧本身并非基于谎言——家用语音助手**确实**会在不该触发时错误地启动麦克风，而且安全漏洞没有任何借口。改进语音用户界面的唯一方法是收集用户数据、分析数据并迭代以提升性能。目前缺失的是对哪些事情值得担忧以及如何妥善应对的理解。


  在本章中，你将多角度探讨这些主题：如何安全地处理用户数据，同时创建值得信赖的、满足每个用户个性化需求的语音解决方案。我们将讨论在默认设置与让用户自定义体验之间取得平衡，你将学习如何整合用户数据以创建量身定制的个性化体验，同时避免因“知道太多”而让用户感到不适。这引出了本章的第二个相关主题：系统人格。你的语音用户界面需要传达信任感，这通过它理解什么、如何以及何时回应，以及它对用户知道多少和不知道多少来体现。


  ### 知道谁在说话的重要性


  有时你的语音用户界面需要知道谁在跟它说话，有时则不需要。如果你作为用户，向语音用户界面提问：“明天法国巴黎的日落时间是几点？”，无论这个语音用户界面是在你家注册的，还是你在朋友家问的，你都会期望得到相同的答案。但如果你问：“我的支票账户余额是多少？”，你希望听到的是你自己的账户信息，而你的朋友肯定不希望让你听到他们的信息！如果同一家庭的两个用户都说“播放我的播放列表”，你的语音用户界面能否根据说话者来理解“我的”？


  在手术准备应用中，“我还能吃阿司匹林吗？”显然必须为正确的用户提供正确的答案，但“茶算清流质吗？”这个问题无论谁问，答案都是一样的。


  知道谁在说话有两个目的：个性化定向行为和授权安全数据访问。个性化，或称为定制化，不一定意味着每次对话开始时都要明确身份识别，但也可以这样做。它确实意味着要识别出你之前与这个人交谈过，并记得关于他们的一些信息。这可以通过用户说出他们是谁、通过使用被视为个人设备的设备，或者通过语音生物识别技术（基于某种语音模式确定用户身份）来实现。授权访问是处理涉及私密或安全数据（如医疗记录或金融交易）的任务所必需的。这同样可以涉及各种类型的生物识别技术，或者涉及信息令牌，如账号和密码。个性化和安全访问都能提升用户的信任和满意度，因此让我们详细探讨每一个方面。




  ### 个性化定向行为


  餐厅可能会提供儿童菜单、配菜选择或素食选项，因为他们知道并非所有人都有完全相同的需求。而这家餐厅经验丰富的服务员会根据不同客人的需求（无论是客人明确提出的还是服务员察觉到的）采取不同的互动方式：为家庭提供儿童菜单、向首次光顾的顾客解释菜品选择、或为常客主动端上"老样子"。最终结果和目标是一致的：准确愉快地接收客人的点餐，并送上他们要求的菜品。


  要让语音用户界面（VUI）的交互对每个用户在不同场景下都具有相关性，就不要强迫所有人经历相同的交互流程。不，即使这样能减少开发工作量也不行。相反，应该多花些精力来定制体验。基于用户行为和偏好数据，打造对更多人有用且易用的产品。当主动建议基于对用户行为和需求的分析时，人们会认为这些建议确实有用。建议必须相关、简洁且频率适中。请看以下体验反馈。


  **两位语音助手用户讨论设置闹钟**


  用户 1：*为什么我设闹钟时，[IVA]要主动提议给我播放助眠音乐？？她说了类似"听起来您要睡觉了，需要我为您播放一首助眠音乐吗？"之类的话。现在才晚上 9 点！我只是设个闹钟！而且那段提示音又长又烦人，逼着你听完。估计会放些肯尼·G
  之类的烂歌。那根本不会让我放松。哈哈。*


  用户 2：*她问我是否要为整周设置闹钟。为什么？今天是周三！而且我从来没跟她一起设过闹钟！凭什么假设我需要这个？！*


  对用户 1 来说，更好的解决方案是不假设她现在要睡觉（除非数据显示晚上 9 点是她通常的就寝时间）。对两位用户来说，一个非常简洁的"了解更多"提示会更合适。所以，要寻找主动服务的机会，但务必谨慎行事。做对了效果很好，但仅仅因为你添加了新功能，并不意味着用户想听你大谈特谈。


  ### 个性化与定制化概念


  现在来定义一些术语：


  * **主动 vs. 被动**：你在前几章已经了解了不少关于主动行为的内容。主动意味着基于某些信息或事件采取主动。被动则只是做出回应。主动是积极的，被动是消极的。


  * **个性化 vs. 定制化**：你会看到这两个术语几乎可以互换使用，但它们在"谁来决定对默认设置的特定更改"这一点上有着关键区别。个性化是产品所有者和实施者基于对用户数据的分析所做的；定制化是用户自己单独修改其体验的行为。定制化由用户通过个人设置和偏好来实现（当然，这些设置和偏好必须由实施者提供）。


  * **向上销售与交叉销售**：向上销售是指企业向用户提供升级账户或添加功能的提议。向上销售与基于用户数据分析的个性化主动行为不同，其重点主要在于为企业带来利益——至少用户是这样认为的。它通常涉及用户付费或注册某项服务。交叉销售则指相关或互补的产品，例如以特价提供额外的家庭助手设备。因此，以略高于中份披萨的价格提供大份披萨是向上销售；购买披萨时提供便宜的六罐装汽水是交叉销售。


  图 15-1 展示了不同方法如何相互作用的示例。前三个 VUI 结果是由过去用户行为、一天中的时间、用户偏好和业务决策的某种组合触发的。只有最后一个 VUI 结果是对用户语音请求的响应。


  ![../images/507213_1_En_15_Chapter/507213_1_En_15_Fig1_HTML.png](img/507213_1_En_15_Fig1_HTML.png)


  **图 15-1** 个性化、定制化和向上销售既可以主动也可以被动


  在图形用户界面（GUI）中，主动信息可能是一个用户可以轻松关闭的屏幕弹出框。但请记住，语音是转瞬即逝且狭窄的，需要用户集中注意力，并且不允许同时处理多任务。主动信息或即时提示很容易变得令人厌烦。如果用户曾有一次问过某个运动队的情况，不要假设他们从此以后就想收到该队比分的主动通知。相反，要长期跟踪用户行为，然后询问用户是否愿意添加该通知。同时，如果用户在类似场景下反复做同一件事，比如每个工作日上午开车去同一个地点，那就不要再每天问他们是否在开车去上班——尤其是当他们总是回答"是"的时候。除了令人厌烦和延长对话之外，在对话中不合时宜地提出无关问题或提供信息还会增加认知负荷——用户需要处理额外输入并做出回应。这反过来会增加出错、超时和遗漏相关信息的风险，从而影响整体成功率。


  有帮助和强人所难之间只有一线之隔。向上销售和交叉销售尤其棘手。作为企业，你想销售更多产品，这没问题。但如果用户因不堪其扰或感到厌烦而无法成功完成任务，你就无法卖出更多产品。如果确实要进行此类操作，请确保其相关且简短，并跟踪用户是否说了"不"，这样你就不会在短时间内再次提出同样的提议。


  **成功提示 15.1** 不要让人感到毛骨悚然




  在主动为用户提供帮助与让用户感觉被监视之间，需要把握微妙的平衡。人们对隐私和数据安全日益敏感。最好谨慎行事，不要因自身能力而忘乎所以。在真实用户测试中，不仅要测试功能，还要测试提供帮助的方式和时机。允许用户选择接受或拒绝此类行为。一个人的“主动”可能是另一个人的“烦人”。在第
  17 章中，你将看到示例，说明记录的用户话语如何精确揭示多少“帮助”才算过度。


  总有一天，你的商业决策会与你认为的最佳用户体验发生冲突。我们见过很多次这种情况。好消息是：实现商业目标**与**提供卓越用户体验是可能的。解决方案始终需要团队中每个人通力合作，通过提供最佳用户体验来最大化投资回报率。这包括理解用户和商业的目标，以及理解上下文和技术挑战，从而提供有助于每个人成功的定制化和主动行为。


  ### 成功提示 15.2 不要以为你比用户更懂


  永远不要忽视用户的明确请求。你不知道他们的理由。如果用户请求你能够提供的东西，就照做。如果你无法提供，请解释原因。如果你给他们替代方案，要让他们知道你明白这是替代方案，否则他们会觉得自己的诉求未被倾听或理解。一旦他们感到被忽视或欺骗，你就无法挽回他们的善意和信任。


  在第 7 章中，你了解到，对任务更熟悉的用户比新手更有可能填写多槽位请求的全部或大部分槽位。他们整体上也不太可能犹豫或使用填充短语，比如*嗯，我想*……只要用户对复杂主题足够熟悉，他们就能非常成功地与语音用户界面交流。例如，一个股票期权交易请求，如*ACME
  披萨，二零二零年十月十七日，六十二，看涨期权，两美元八十美分*，对我们大多数人来说听起来不太自然，但语音用户界面可以很好地处理。这并非你想象中那种特别对话式的表达，但它**确实**是一种使用语言的口头互动，这种语言对具有交易经验的用户来说很自然。迎合用户认为“自然”的方式是你成功的关键。股票交易语音用户界面必须处理这类一体化请求的语法，以及经验不足的用户可能说出的结构较松散的短语。你还需要与拥有适当级别官方股票交易认证的人员合作，就像构建健康类语音用户界面时需要与受过培训的医务人员合作一样。


  新手模式与专家模式是设计和实现中的一个重要概念。简单来说，新手用户需要更多解释性提示，可能每一步都附带示例。专家用户通常只需要语音用户界面在某个步骤期望什么的提醒。因此，新手与专家的区别通常在于详细与简洁，但也可能涉及回读速度。选择哪种交互模式可以由每个用户明确决定，但更常见的是自动分配。你可以通过存储的与身份验证令牌关联的信息来了解用户的专业水平，从而进行分配。你也可以根据交互频率或最近
  N 次交互中的错误次数来进行分配。


  拥有两个版本的提示为你和用户提供了极大的灵活性。你可以利用它们根据对用户的了解来个性化体验，也可以为用户提供定制化选项。你将在下一节关于实现的内容中学习具体方法。


  没有哪个产品能在没有选项和设置的情况下满足所有人的所有需求。我们坚信，为用户提供定制化选项能带来用户满意度。这一点对于语音和其他交互方式同样适用。请参考玛丽·米克尔
  2019 年互联网趋势报告中的这些引述：^(¹⁰⁰)


  > *在投资增长时，开发* *更好的用户体验* *能产生迄今为止最强大的病毒式传播效果和影响力。参与度推动从免费消费到付费订阅的转化。*

  >

  > ——巴里·麦卡锡，Spotify 首席财务官

  >

  > *最重要的事情是确保* *现有客户* *满意，而不是追逐新客户。*

  >

  > ——埃里克·袁，Zoom 创始人/首席执行官

  >

  > *去了解人们……我们销售的产品 100% 基于推荐。……造型师的成功在于* *倾听、共情并交付客户想要的* *，并且不带评判地做到这一点。*

  >

  > ——卡特里娜·莱克，Stitch Fix 创始人/首席执行官


  ### 成功提示 15.3 语音业务成功 = 给予用户他们想要的


  反对定制化的常见理由是：它会让用户感到困惑、没人使用、投入大收益小。一如既往，要深思熟虑，提供最重要的选择。确定最可能的默认设置，并允许用户根据自身需求，在与其最相关的场景中更改这些设置。




  #### 实现个性化体验


  假设已获得用户许可，思考一下，如果你能获取用户的当前位置、典型日程安排、过往行为及偏好，你的餐厅查找器能提供哪些功能？能做的可太多了！


  个性化可以基于几乎任何情境，并影响语音用户界面（VUI）对话的方方面面，包括内容、语言、音质、详细程度、提示措辞、提示回读速度等。餐厅查找器和手术准备助手都为主动式和响应式个性化与定制提供了大量机会。在交互式语音应答（IVR）系统中，可以为不同的来电群体分配不同的号码，提供量身定制的对话，旨在向这些来电者提供最常用的选项，并让他们快速完成操作。一个处方续方
  IVR 系统能够根据拨打的电话号码，为患者和药剂师分别提供个性化体验。这是通过`DNIS`（即被叫号码识别服务）实现的。最初的几轮对话，包括选项菜单和登录格式，都可以针对每个群体的需求进行定制，而许多子模块则是相同的。通过两个入口点，你可以在避免重复工作的同时实现个性化体验。


  同时——这一点很重要——要思考如何呈现主动建议，使其既实用又不具侵扰性。仅仅因为你了解用户的一些信息，并不意味着你必须提及它！请看图 15-2。语音机器人说的内容并非不实，但存在更安全的方式来分享相同的信息——当然，除非你刻意想塑造一个唠叨的
  VUI 角色。☺ 更安全的做法是，像乘客或普通朋友会知道的那样使用地理位置和其他个性化信息：*看起来你在奥克兰*……或*根据你的位置/饮食目标*……或*这是你今天的提醒事项：“妈妈的生日”*……


  ![../images/507213_1_En_15_Chapter/507213_1_En_15_Fig2_HTML.png](img/507213_1_En_15_Fig2_HTML.png)


  图 15-2


  主动和个性化行为不必明确提及个人信息


  手术准备 VUI 建立在为每位用户提供个性化体验的能力之上，因此仔细的实现和措辞选择变得更加重要。具体响应的内容和时机不应由用户修改，因为该 VUI 处理的是由医生控制的医疗程序。但你可以想象根据用户特定的食物喜好来制定个性化的饮食限制。


  来自语音前线


  在一款多模态移动健康应用中，当用户被一个欢快的声音提醒他们下一个非常私密的医疗程序任务时，他们感到惊恐。在私密场合这没问题，但在公共场合大声宣布即将进行的程序，大多数用户并不欣赏。


  #### 个性化体验的代码实现


  在第 14 章中，你添加了上下文相关的代码，用于检查用户是否在同一对话（即短时间内）两次询问同一个名字。如果是，你将其作为错误处理，应用程序会做出不同的响应。当你最初在第
  7 章的名称拨号器中实现消歧时，如果用户说*呼叫 Brent*，会出现消歧提示*哪个 Brent……？*现在，让我们继续使用名称拨号器，添加一个个性化的上下文相关体验。我们将指定一个“Brent”作为用户的“默认
  Brent”。设置默认值的目的在于允许用户只说出名字，而无需每次都进行消歧或说出姓氏。这个选择可以是你主动提供的（*我注意到你经常呼叫 Brent Jones。是否要将此联系人添加到收藏夹以便更快呼叫？*或类似表述），也可以是根据呼叫频率自动分配的。如果你在未与用户确认的情况下这样做，还需要添加逻辑，以便在用户开始对*正在呼叫
  Brent Jones*的提示说*取消*时重置该默认值——请注意，提示语仍然说出全名作为隐式确认。


  首先，你需要一种存储用户上下文信息的方法。清单 15-1 展示了这一点。为简单起见，你将使用前几章一直在用的意图上下文，并在此基础上继续构建用户上下文，将当前上下文传递到
