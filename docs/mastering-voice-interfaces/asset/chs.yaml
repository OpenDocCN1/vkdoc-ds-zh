  \n**图 17-2** 运维套件日志示例\n\n- 前往 Google Cloud 控制台（`console.cloud.google.com`）。确保你已选择用于\
  \ Dialogflow 工作和 webhook 的项目。\n- 在左上角的菜单中，选择 **运维** ➤ **日志记录** ➤ **旧版日志查看器**。你可能还看不到任何日志；将时间限制下拉菜单更改为\
  \ **无限制** 后，你应该会看到类似图 17-2 的内容。\n- 确认最左边的下拉菜单显示 **全局**，其右侧的菜单显示 **所有日志**。\n\n接下来，点击任意一行；它会展开以显示详细的日志信息。我们强烈建议你稍微浏览一下这些日志，看看仅一次与\
