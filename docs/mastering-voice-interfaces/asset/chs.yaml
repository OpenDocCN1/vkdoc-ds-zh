  \ - 1:  # A\n# 如果错误已经太多，尝试其他方法\ndf_response.output_text = '好的，让我们换一种方式试试。' # B\n\
  ```\n\n*代码清单 13-7：处理最大错误数*\n\n代码清单 13-7 包含了检查是否已达到最大错误数的逻辑，以及一个占位符，用于在达到最大错误数时执行你希望的自定义处理。我们在此不指定具体的处理方式，但根据上下文和策略，你可能会引导用户进入不同的对话路径，例如一个逐步引导的对话，或者提供其他详细的帮助。重要的是，这个新增的测试需要是代码块中第一个执行的测试。\n\
  \n### 转接\n\n将对话转接到另一种模态、另一个应用，甚至转接给真人，原因有很多。拥有人工后备支持并非交互式语音应答（IVR）系统的专利。任何设备上的任何语音系统都可以允许将对话转接给真人寻求帮助，无论是作为路由终点，还是在某些情况下作为辅助手段。以下是关于整合转接功能的一些指南：\n\
  \n-   包含能确保用户确实会被转接的提示措辞。如果等待时间较长，请告知他们需要等多久。\n-   如果你的语音用户界面（VUI）仅在一天中的某些时段提供人工后备支持，请不要在非服务时段提供转接选项，结果却告知用户无人可用。你需要为提供转接的提示准备不同的版本。如果你知道用户的大致地理位置，效果最佳；如果不知道，请确保在提示中包含时区信息。\n\
  -   在某些对话中，转接请求比其他对话更可能发生。它们在菜单和多步骤事务开始时最有可能发生——在简单的“是/否”问题或“A/B”二选一选项中则不太可能。成本更高的任务往往更容易出现更多转接请求。\n\
  -   当提示对用户来说不清晰时，转接请求更有可能发生，因此，如果可以的话，请检查每个提示的转接率。专家用户比新手用户更不可能请求转接，除非他们知道需要与真人交谈才能处理他们的任务。\n\
  -   转接给客服代表的请求通常会随时间推移而减少，并且会根据任务在特定时间出现峰值：例如在报税季之前、账单寄出之后，或在预定程序之前。\n-   如果用户与真人存在某种关系或期望这种关系（例如医务人员），请明确说明如何取得联系。多模态语音应用可以包含一个直接呼叫按钮。在家庭语音助手上，你可能能够或无法进行直接呼叫。如果不能，请提供一个电话号码或其他适用于该情况的联系方式。\n\
  \n在谈论转接时，一个显而易见的问题是，一些利益相关者认为省钱的最佳方式是让用户远离人工帮助。事实是，有些人喜欢自动化，而另一些人则更喜欢与真人交谈。有些人希望根据上下文和主题进行不同的交互。人们**确实**想要的是选择的能力。如果你发现自己正在为明确提供转接选项而争论，这里有一些信息可供使用：\n\
  \n-   在一个金融领域的 VUI 中，客服转接被预先说明为始终可用的选项。由于这个简单的退出途径，用户更愿意尝试一下，并且总体上在自动化系统中取得了相当高的成功率。在一个航空公司的\
  \ VUI 中也是如此。总体转接率并不比那些对用户隐藏转接选项的 VUI 更高；只有 5-6% 的用户选择立即转接，而不是尝试自动化。\n-   《哈佛商业评论》（HBR）在几项对照研究中证实了这种行为。他们的结果表明，仅仅拥有联系真人的选项就能让用户更满意，而且重要的是，拥有这个选项并不意味着人们会使用它。HBR\
  \ 总结道：“仅仅提供与真人交谈的途径，就足以恢复客户信心，提高对公司的信任，并加强长期关系”（[`https://hbr.org/2019/04/why-anxious-customers-prefer-human-customer-service`](https://hbr.org/2019/04/why-anxious-customers-prefer-human-customer-service)）。\n\
  \n#### 成功秘诀 13.3：永远不要隐藏你的真人客服\n\n如果你与拥有在线客服代表的公司合作或为其工作，请不要阻止你的最终用户与他们交谈。真的，请不要。人们有无数合理的理由想要与真人交谈。如果你试图将他们困在自动化系统中，只会惹恼他们。任何对话的自动化都应该是锦上添花，而不是取而代之。这也会破坏信任，以及格莱斯关于对话中真实性和提供必要信息的原则（第\
  \ 6 章）。\n\n\n\n### 选择恢复策略\n\n你使用特定策略的能力取决于你所使用的平台。你越是依赖内置模块，在提示措辞和重试方法上的选择就越少。同时，在追踪特定错误条件方面也会受到限制。你可能能够区分`no-speech`和`nomatch`，也可能无法区分，或者无法区分不同的后端错误。这会影响你向用户提供针对性信息以帮助他们理解问题所在的能力。\n\
  \n在单个 VUI 中，你会使用不同的策略，根据上下文、设备、模态、对话流程细节等为每种情况选择最佳方法。以下是一些指导原则：\n\n- 确保错误提示清晰且具有针对性；预判用户可能遇到的问题类型，并在上下文提示措辞中加以针对。\n\
  - 如果你的提示针对问题类型（识别、意图映射或执行），请确保根据情况给出适当的提示。\n- 如果你的提示措辞鼓励定向对话或替代输入模态，你仍然需要接受与初始提示相同的开放式输入。\n\
  - 如果你的初始问题是开放式的，请在重试提示中包含具体选项，例如作为示例、选项列表或更定向的对话降级。\n- 如果你能获取错误条件的详细信息，例如后端失败的原因，请将其用于上下文错误提示，而不是使用单一的通用错误提示。\n\
  - 如果可用，对于大型或易混淆的语法（第 12 章），请使用 N-best 列表和跳过列表，以避免对用户已表示不匹配的结果进行重试。\n- 当要求用户进行明确确认时，允许一步纠正（第\
  \ 13 章）；否则，当用户非常自然地说话时，错误计数可能会迅速增加。\n- 尽可能减少强制重试的次数：\n  - 如果继续对话不需要准确的回答，就不要一直追问。利用其他信息做出最佳猜测，或者直接停止。\n\
  \  - 如果需要准确的回答才能继续，最好改变方法而不是继续以相同方式重试，但不要移除任何处理选项。\n\n### 下一步\n\n当你深入定制化并与数据打交道时，你将在第\
  \ 15 章中了解更多关于如何处理执行失败的内容。最小化失败并最大化整体对话成功率的唯一方法是收集相关数据，并基于对技术和用户的理解来分析问题。第 16 章和第\
  \ 17 章将详细讨论这一点——其重要性足以用两章来阐述。\n\n通过偏离“快乐路径”来测试 VUI，可以让你注意到哪里出了问题以及结果听起来如何，从而教你更好的\
  \ VUI 设计和开发。对什么有效、什么无效保持好奇，并找出原因。注意当你自己被误解时会发生什么：你如何反应，你认为为什么会发生，以及你如何改变自己的行为以回到正轨？将其转化为可以做得更好的地方，并在他人身上测试你的假设。你正在成为一名全面的语音实践者！\n\
  \n可以想象，如果你想为不同的意图和上下文使用不同的错误处理方法，你的整体设计和实现可能会变得相当复杂。接下来在第 14 章中，你将看到不同的错误条件如何与各种上下文相结合。你将理解为什么需要精心设计和开发工作来跟踪和处理由此产生的许多组合。\n\
  \n### 总结\n\n- 尽管当今的识别性能非常出色，但仍然无法保证人们能被正确识别。这意味着你的设计和实现必须始终考虑到误识别和“无匹配”的情况，以便在发生错误时帮助用户回到正轨。优秀\
  \ VUI 与一般 VUI 的区别在于，有多少用户会进入错误路径，以及他们能多容易地回到正轨。\n- 永远不要责怪你的用户——他们很少是问题发生的原因。\n-\
  \ 并非每个人的思维方式都相同，也并非每个人的环境都相同。降级策略需要帮助用户跨越不同的心智模型和上下文来取得成功。\n- 知道何时停止尝试——如果对话的其余部分依赖于正确的结果，可以多尝试几次。\n\
  - 为任务、领域、用户和平台选择合适的恢复类型——你的恢复方法受限于你所使用平台提供的功能。\n\n脚注 1 2 3\n\n"
- "# 14. 利用上下文和数据创建更智能的对话\n\n上下文指的是影响对语句和对话进行准确解释的所有知识、感知、语言和环境。要理解上下文，请思考一个你向他人提出的简单请求——比如*打开楼上的窗户*、*调低音量*或*我们什么时候需要出发？*\
  \ 你在说这句话时做了哪些假设？你的措辞如何根据你与谁交谈、他们当前的位置以及你自己的位置、他们对你和话题的了解程度、附近还有谁、他们在做什么以及你周围正在发生什么而变化？根据你所做的假设，回答可能会有什么不同？\n\
  \n上下文的重要性足以单独用一章来讨论。我们将涵盖为短期和长期上下文进行设计、如何利用主动数据和领域知识来改善用户体验，以及如何处理动态数据。在大部分讨论中，当我们指代人类交流中基于情境和细节来解释含义的一般概念时，我们会使用“上下文”。当我们向你展示如何在\
  \ Dialogflow 中将上下文实现为字符串时，从上下文来看——会很清楚！——我们指的是平台特定的细节。\n\n\n\n### 为何没有上下文就无法对话\n\
  \n请看图 14-1。通过要求*调高游戏音量*，说话者假设了双方共享大量上下文。一位听者距离足够近，能看到和听到说话者所见所闻；另一位则在另一个房间。这里的所有回应，都是听者解读的结果，以及说话者对共享知识（什么运动、什么队伍、在哪里、调高多少）、信息准确性（何时播放、哪个频道）、听者距离（听者还在做什么、能否满足请求、甚至是否知道在对自己说话）、先前对话（请求是否已提出多次）、歧义、帮助意愿和能力等方面的假设。此外，还存在误认和误解。如果任何假设不正确，听者的回应就会体现出来，而说话者则会根据新的上下文做出回应。这对人来说轻而易举，但对语音系统而言绝非易事。\n\
  \n![../images/507213_1_En_14_Chapter/507213_1_En_14_Fig1_HTML.png](img/507213_1_En_14_Fig1_HTML.png)\n\
  \n图 14-1\n\n多种上下文属性和维度相互作用，导致说话者和听者做出各种假设\n\n上下文在 VUI 对话和人类对话中都至关重要。每一轮对话，都是基于了解（或不了解）用户的即时环境和位置、过往经历、喜好、时间与日期，以及世界上可能或不可能发生的事情，来创建和完善共享理解。人们通常不会用完全明确单一的语句进行交流——就像图\
  \ 14-1 中灰色气泡里显示的那种语句——也不会提出令人印象深刻的“一次性”完全明确的 VUI 请求：*找一部我今晚可以在线免费观看、由威尔·史密斯主演、且不超过\
  \ 5 年的电影*。你需要同时处理明确表述的请求以及模糊或不完整的请求；在某些上下文中，用户会非常精确地提出要求，比如下注或下达股票期权订单的高级用户。但大多数自然对话都是你来我往，每个人都在提问、解释、澄清、缩小范围、核实理解——更不用说还有犹豫、不完整的短语和话题跳跃。每一步都建立在前几轮对话的基础上，完善和改变整体上下文，直接影响下一个回应和对话轮次。如果你的\
  \ VUI 在麦克风停止收听后就“忘记”了请求的上下文，它就无法处理对话式交互。VUI 需要上下文感知能力才能做出合理的回应；人们期望能够基于前几轮对话中的信息来优化搜索，只在必要时被要求澄清，并且当相关上下文已经建立时不必浪费时间。\n\
  \n对话上下文是复杂的；它涵盖多个维度——基本上任何影响某人说什么、怎么说以及他们做出何种假设的因素都包含在内。有些上下文，比如一天中的时间，很容易量化并应用于对话。其他上下文，比如用户的心境，则不那么容易。请查看表\
  \ 14-1 中的上下文示例。\n\n表 14-1\n\n常见上下文类型示例\n\n| 上下文类型 | 示例 |\n| --- | --- |\n| *领域与主题*\
  \ | 医疗、餐饮、娱乐 |\n| *任务* | 信息查询、播放音乐、预约、打电话、订购、获取说明 |\n| *用户身份* | 已识别、未识别；已知用户数量；儿童/成人\
  \ |\n| *时间**时钟与日历**时区* | 绝对时间：凌晨 2 点、“1 月 4 日”、“2021 年”；每周日、工作日相对时间：*明天、在我预约之前、上次*。用户空闲时间、日历事件\
  \ |\n| *位置**环境* | 地理位置：布里斯班、伦敦、加拿大环境：室内、在家、在厨房、靠近 VUI |\n| *设备* | 单个设备、多个连接设备、有屏幕、可穿戴、固定式、物理专用或内置\
  \ |\n| *对话历史* | 代词指代（*他们*什么时候开门？）、第一个、返回、重复那个。识别置信度自用户上次说话以来的时间 |\n| *过往交互* | 过往预约历史\
  \ |\n| *个性化设置* | 语言、音量、用户专业水平、音乐偏好 |\n| *设备活动* | 设备空闲/关闭/播放其他音频；回应的紧迫性 |\n| *用户心境与活动*\
  \ | 分心、手忙、眼忙、驾驶、心烦、紧张 |\n| *安全与法规* | 法律、商业、有限数据访问 |\n\n这看起来像是一座难以逾越的大山。我们理解。请记住：我们指出了当今语音实现可以改进的许多领域，而上下文就是其中之一。这并不意味着你需要在产品发布前设计、实现并测试所有可能适用于你\
  \ VUI 的上下文。我们只是想让你意识到上下文的重要性，以及融入上下文能让你实现什么。你要做的是，找出对你的特定 VUI 任务和用户来说哪些上下文是重要的，然后从最重要的一两个开始。例如，对于手术准备助手来说，最重要的上下文是相对时间，这样用户就可以问*我今天*能吃\
  \ __ 吗？如果你的 VUI 允许用户在不同房间的扬声器上播放音乐，那么最相关的上下文就是扬声器上的当前活动（开/关/空闲/播放）和扬声器位置（*在厨房*播放\
  \ __ 或*在这里*播放 __）。\n\n#### 来自语音实战一线\n\n安在她厨房吧台下安装了声控灯。当她让家里的一个语音助手*打开吧台灯*时，VUI 的回应竟然是像狗一样叫！一阵恼火之后，她急切地录下了这次交互，作为事情不该如此运作的绝佳反面教材。这里的问题在于，在将话语与意图匹配时，撞上了语音相似性（*bark*\
  \ 与 *bar counter*），同时错误地优先处理了上下文（架构倾向于优先使用一个从未用过的、会汪汪叫的技能，而不是用户为其本地设备命名的名称）。\n\n\
  你的 VUI 的回应应该是所有已实现的相关上下文共同作用的结果——而且你通常需要综合评估它们！例如，如果你的 VUI 询问日历日期，用户的回应会因任务而异：人们通常像信用卡上写的那样说有效期（*1\
  \ 0 2 4* 或 *ten twenty-four*），但其他人会将其转换为*十月（二十）二十四*。但如果 VUI 收集工作经历，你可以预期开始或结束日期的回应会包含月份名称，而不是数字。\n\
  \n当存在多种可能的回应时，需要适当分层并优先考虑上下文，同时考虑相关性。在这个例子中，用户命名的设备“吧台灯”应该优先于会汪汪叫且用户从未使用过的东西。而且，不，限制用户给灯取什么名字从来都不是正确的解决方案，前提是这个名字是一个可发音的单词。\n\
  \n#### 成功提示 14.1 为每种上下文量身定制回应\n\n\n\n这是核心的 VUI 最佳实践。如果 VUI 能够很好地响应跨对话的不同语境，并理解用户话语中的语境假设，人们就会认为这些对话有趣、智能且成功。你的设计和实现应专注于融入这种变化。诚然，更量身定制的响应需要更多努力。但在产品首次发布前，你无需加入太多内容。即使只添加一个恰当的语境，也能让你的\
  \ VUI 显得更智能，用户会注意到这一点。从简单开始，然后迭代。\n\n这种复杂性体现在任何定义良好的详细 VUI 对话设计规范中。事实上，这也是我们处理过的许多规范采用表格或电子表格格式的核心原因。当涉及多个维度时，这是最高效且最易读的格式，并且它反映了复杂设计中的对话管理器方面。读完本章后，你就会明白原因。\n\
  \n图 14-2 让你大致了解语境可能变得多么复杂——以及为什么你只选择一两个来开始。这幅图来自一次非正式讨论，内容是关于影响用户与家中联网设备（灯、音箱、屏幕、恒温器、锁等）进行对话的语境。我们一直画到纸上没地方了才停下来！\n\
  \n![../images/507213_1_En_14_Chapter/507213_1_En_14_Fig2_HTML.png](img/507213_1_En_14_Fig2_HTML.png)\n\
  \n图 14-2\n\n说明影响用户与家中各种设备交互行为的语境复杂性示意图\n\n##### 动手实践：语境复杂性思维实验\n\n为了理解语境如何相互作用以提供良好的用户体验，任何从事语音技术的人都应该尝试这个练习：为家庭创建语音定时器。\n\
  \n假设你的家中有多个房间，每个房间都有多个属于同一生态系统且可能互联的 VUI 助手设备。你与他人同住，可能是室友，也可能是家人。你将如何设计一个定时器语音应用，以便为家中的所有成员提供最大的灵活性和便利性？思考用例、语境和影响。以下是一个起点：\n\
  \n**交互流程**：定时器的数量是否应该有限制？如果有，限制是多少？用户是否希望听到所有当前定时器的列表？如果是，你如何以简洁而有意义的方式呈现这个列表？何时以及如何需要消除歧义？何时以及如何提供重试和帮助？哪种类型的重试是合适的？用户如何知道时间已正确设置？用户如何更改、增加或取消定时器？在对话的不同部分，哪种类型的帮助是有用的？教程有用吗？或者示例呢？如果停电了，定时器应该如何处理？\n\
  \n**用户位置**：行为是否取决于用户设置定时器时所在的房间？如果用户在房间之间移动（假设每个房间都有 VUI 访问权限），比如在一个房间启动定时器，在另一个房间查询或结束它，应该发生什么？如果你离开家，用户能否——以及是否应该能够——通过移动设备或汽车与定时器交互？\n\
  \n**覆盖范围**：识别哪些话语？如何处理部分指定或误识别的请求？是什么使得某些请求没有歧义？\n\n**用户访问**：你是否知道或关心是谁设置的定时器？你的决定如何影响对话？任何人都可以取消他们未设置的定时器吗？用户是否期望安全访问和隐私保护？\n\
  \n**设备**：当前的设备活动是否影响你的设计？当多个语境冲突时，优先级层级是什么？在什么情况下该层级会发生变化？如果设备正在播放某些内容、回答用户问题，甚至正在响铃另一个定时器或闹钟，会发生什么？暂停、降低（“闪避”）内容音量、等待之前的操作完成，还是中断？\n\
  \n**集成**：是否因集成限制而需要更改任何设计决策？如果无人停止，最终警报会播放多久？定时器数量或时长有限制吗？是否允许用户为定时器命名？如果允许，这些名称有什么限制？为什么允许或不允许？对于这些名称，你会使用\
  \ TTS 还是录制用户的声音？如果多个定时器具有相同的名称或时长怎么办？定时器是否与其他设备的电源或设置相关联？如果是，这些设备如何相互通信？你能在不同位置的联网设备之间跟踪定时器吗？你需要跟踪哪些行为来实现该流程？\n\
  \n**时间因素**：一天中的时间或一周中的某天是否需要特殊处理？\n\n**用户个性化**：定时器完成后能否播放用户指定的曲调？\n\n**访问权限**：是否有任何法律或地理位置限制？生态系统限制？\n\
  \n你明白了吧。这些是你在构建任何 VUI 时都应该解决的问题。最重要的是，锻炼你的共情能力：真正思考不同的用例，理解不同的人有不同的需求。询问一些人他们想要什么。编写示例对话并创建流程图。如果你尝试构建其中的一部分，那很好，但即使你不构建，这也是一个有用的练习，它能让你真切地体会到事情会变得多么复杂。\n\
  \n来自语音前线\n\n安的家中有几盏灯是通过家庭虚拟助手控制的。她没有启用任何语音购物功能。除了设置定时器，开关灯是在厨房与助手对话时唯一做的事情。一天晚上，她做了一个典型的请求：`关掉橱柜下的灯`。想象一下，当她发现这个助手反而把一些丑陋的厨房橱柜门把手放入了她的购物车时，她有多惊讶。这个结果存在多个问题，也忽略了多个语境：首先，购物是一种金融交易；因此，它需要用户确认。在这里，由于该功能未被启用，它根本不应该发生。话语音频质量很差（安已经转身离开设备，正走向门口）。任何质量如此差的话语都应该被拒绝，或者匹配到之前被多次请求过的内容。它绝对不应该被解释为从未被请求过的东西，尤其是像购买从未浏览过的商品这样高风险的行为。\n\
  \n多个语境在从识别、理解到执行的每个层面都影响着对话。在探索如何利用语境来创建听起来更智能的对话之前，让我们先了解实现语境所需的基础组件：数据访问和持久性跟踪。\n\
  \n\n\n### 数据访问\n\n要利用上下文，你需要及时获取相关且准确的数据。你已经看到过一些示例，其中数据被用来为智能对话设置正确的上下文：获取营业时间和预订可用性、访问联系人列表以拨打电话、请求从特定音乐提供商播放某首歌曲、在音乐播放时调节音量、订购剩余续药、询问与手术时间相关的饮食限制、缩小餐厅搜索范围等等。\n\
  \n你需要具备从多个来源读取数据、捕获数据、追踪对话中收集信息所导致的变化，甚至对更持久的用户设置和账户进行更新的能力。你还需要决定何时停止追踪每条信息、将这些信息保留多久以供后续对话使用，以及当不同信息相互影响时该如何处理。\n\
  \nVUI（语音用户界面）对话受到来自两个来源的数据影响：用户（通过话语或回应）和 VUI（基于查询、置信度和可用性）。一旦用户数据被捕获并解释，你的集成系统会将其转化为可在一定时间内访问的信息，直到它对当前或未来的对话不再相关，此时你可以将其释放。不同信息在上下文持久性和相关性上有所区别：\n\
  \n*   **静态**：不变的信息。并非它永远不会改变，只是在对话过程中不会改变。例如当前分配的设备名称（`吧台灯`）或餐厅地址。\n*   **动态**：在对话过程中因收集到更多信息而被填充或改变的信息。例如餐厅预订的时间、账单支付的金额以及处方的剩余续药次数。\n\
  *   **相对**：相对于对话外部上下文（如当前时间和日期、设备状态、当前播放的歌曲，或用户状况与环境的变化）而改变的信息。例如，随着用户接近手术日期而改变的饮食建议。\n\
  *   **短暂**：在活跃对话中，从一个对话轮次“记住”到下一个轮次的信息。这可能是最棘手的方面，因为它与人们的思考和交谈方式有关。如果用户要求重复，用户上一个话语的意图以及他们得到的\
  \ VUI 回应是相关的，但仅持续几秒钟。对话中的重试次数、哪些槽位被填充以及填充的值、甚至填充的顺序，都会影响对话流程，但仅在达成对话目标前的短时间内有效。这些数据要么临时保存在你的\
  \ VUI 中，要么通过某些外部服务被更持久地拥有和更新。\n\n#### 外部账户与服务\n\n通用上下文（如一天中的时间）和对话上下文（如用户行为和识别结果）已经足够棘手，难以正确处理，但至少它们是本地的且可访问的。有时你需要设置依赖于从外部账户或服务（如娱乐内容提供商、药品名称数据库、营业时间和酒店房间可用性）访问数据的上下文。这完全是另一个层面的复杂问题——不仅因为技术问题，还因为业务规则和法律访问限制。\n\
  \n想象一下，你在飞机上要一杯`健怡百事可乐`，但航空公司与可口可乐有协议，所以你得到的是零度可乐。或者反过来——我们并非偏袒任何一方。如果你是无糖可乐的爱好者，你知道它们的味道不同。如果你喜欢其中一种而不喜欢另一种，你会不高兴。你希望提前知道这一点，以便调整预期或选择其他饮料。语音解决方案的履约也是如此。\n\
  \n假设你的 VUI 支持音乐搜索。用户请求`播放莱昂纳德·科恩的《哈利路亚》`。你可以用身边的任何智能音箱亲自试试。在识别出所说内容后，VUI 必须做出一些选择：\n\
  \n1.  我被要求播放的这东西是什么？\n    1.  是一首歌？一张专辑？还是一整部音乐剧？有确定的版本吗？科恩是表演者还是创作者，或者两者都是？\n2.\
  \  我从哪里获取它？\n    1.  用户关联了哪些音乐服务？也许它在本地服务器上可用？是否有默认来源——如果那里没有怎么办？\n3.  如果我找到多个匹配项，如何选择？\n\
  \    1.  我应该播放哪一个？质量最高的？最新的？录音室版还是现场版？翻唱版本可以吗？到底什么是“最接近的匹配”？播放歌曲更重要还是播放艺术家更重要？\n\
  \    2.  是否有业务规则来优先选择某个匹配项？基于地理位置的访问内容法规呢？用户从一个提供商那里能播放的歌曲数量有限制吗？\n4.  选好了！我准备播放了……但在哪里播放？\n\
  \    1.  有多少台设备？有默认设备吗？它开着吗？它现在正在播放其他内容吗？用户附近有什么设备？\n\n这些不仅仅是假设性的脑筋急转弯或只有一个正确答案的技术问题。事实上，在这些情况下，技术很少是限制因素。业务目标、数据所有权、平台交叉功能和法律法规都创造了你需要处理的上下文；它们可能会限制你完全按照用户期望的方式满足其请求的能力。这里上下文的意义在于，无需用户指定每一个细节，就能提供他们想要的东西。为了简单起见，为所有搜索条件设定默认值。将目录最大的音乐提供商设为默认音乐来源。将当前活动的音频播放器设为默认设备；如果所有设备都空闲，并且用户正在与之对话的设备可以播放音乐，那么就在那里播放。对于选择具体内容，也应用默认规则，这样用户就不必总是指定`播放`***艺术家***的***歌曲***。你的默认值还会解释请求中任何名称的媒体类型：优先选择歌曲而非专辑或播放列表。如果你有用户过去播放过的歌曲历史，则返回相同的版本。否则，播放被请求频率最高的版本。当你这样分解时，问题就变得相当可控，并为你提供了一套规则集，以后可以用更详细的默认值进行扩展：优先选择原唱而非翻唱版本，优先选择录音室版而非现场版，等等。你的默认值让用户无需长篇大论就能听到他们的音乐。请记住，这些只是默认值：如果用户指定了媒体类型（`专辑`、`现场版`）或来源（`我的本地服务器`）或目的地（`在我的办公室`），你将使用这些信息来执行搜索。以上是从系统视角看待的外部数据。\n\
  \n\n\n"
- "# 第 14 章 数据库与上下文\n\n在第 1 章中，你了解了语音系统的一般架构（图 14-3）。回想一下对话管理（`DM`）组件及其连接的三个数据源：包含用于回答查询的有用信息的应用程序数据库、跟踪`VUI`中发生情况的对话数据库，以及与个性化行为相关的用户数据库。这三个数据库都参与决定了你的`VUI`如何响应的上下文。\n\
  \n![../images/507213_1_En_14_Chapter/507213_1_En_14_Fig3_HTML.png](img/507213_1_En_14_Fig3_HTML.png)\n\
  \n**图 14-3** 通用语音优先系统\n\n与应用程序和用户数据库的交互可能是部署工作中最具挑战性的部分之一，因为你无法控制其细节。这是一个很大的话题，我们在这里没有足够的篇幅全面展开，但我们将就这三个方面讨论几个要点。\n\
  \n首先，是一些高层次的评论。当我们谈论“数据库”（图 14-3 及其他地方）时，我们不一定指的是开发者熟悉的正式数据库，如`MySQL`、`Elasticsearch`或云服务提供商的产品。它可能是一个“概念性”数据库，因为我们存储的是关于对话或用户的信息，而不一定是严格意义上的“数据库”。或者，你可能从一个为此目的专门开发的定制`API`（常见于应用程序数据库）获取信息。你将在当前和后续章节中看到不少这样的例子。关键是，我们在图\
  \ 14-3 中是在一般意义上使用“数据库”一词，正如你将在下面通过几个你已经如何存储对话信息的例子中看到的那样。\n\n首先，对话数据库通常是最容易管理的，因为你通常通过定义和构建`VUI`交互来对其拥有最大的控制权。在`Dialogflow`的上下文中，已经存在一些有限的“对话数据库”功能；例如，回想一下必需参数的概念，以及如果用户尚未指定它们，应用程序将如何询问它们。这是跨对话历史的“简易版对话数据库”的开端。一个更完整的对话数据库会存储用户的详细对话历史，例如在之前的对话中询问过哪些餐厅。这样，你不仅可以避免再次提出相同的建议，还可以改进未来的建议，并进行更智能的引用，比如“最后一个地方”。为此，你需要一个实际的数据库；这将超出`Dialogflow`简单的上下文传递能力。除了跨对话上下文，对话内上下文是你自己处理的事情；你很快就会看到更多这方面的例子。\n\
  \n其次，应用程序数据库包含回答查询所需的信息，例如营业时间、产品可用性、预订状态等。其中一些最大的挑战如下：\n\n-   你需要的信息可能已经存在于某个数据存储中，所以你会想“太好了，我少干活了！”。是的，但是有许多这样的数据库、系统和协议用于保存、访问、列出和删除这些信息；将你的`VUI`与这些源连接起来本身就是一个项目。除非数据已经面向语音应用，否则它不会涵盖你需要的发音和其他格式。\n\
  -   你需要的所有信息可能不在一个地方。例如，营业时间和预订信息在不同的地方。在某些项目中，组织中的某个人提供一个单一的应用程序编程接口（`API`）来访问任何所需信息，完成与这些不同数据源集成的繁重工作。但并非总是如此！\n\
  -   这些数据通常由构建语音系统的组织之外的另一个组织“持有”。你可能会像我们一样想“好吧，不都是同一家公司吗？”，结果却发现出现了组织政治问题。如果数据来自外部来源，情况就会更加复杂。\n\
  \n第三，对于用户数据库，你面临以下挑战：\n\n-   **账户访问：** 你如何识别和验证用户？对于 Google 应用或操作，或 Alexa 技能，你可以使用现有的\
  \ Google 或 Amazon 账户；否则，你可能需要一个全新的、独立的、你必须用这个数据存储来管理的基础设施。在许多方面，这既是一个`VUI`问题，也是一个存储问题。\n\
  -   **重大的隐私问题：** 用户对于被监控以及他们的个人信息存在于某个组织的系统中非常敏感——考虑到他们经常听到的数据泄露事件，这是理所当然的。\n- \
  \  **依赖于位置的法规：** 组织可能有特定的隐私政策，并且可能存在国际法规，例如欧洲的`GDPR`，这会影响你的`VUI`。\n-   **依赖于领域的法规：**\
  \ 在保持数据安全方面有重要的法规，违反规定会受到严厉处罚。在美国医疗保健领域，`HIPAA`法规限制了个人健康信息（`PHI`）的存储和访问方式。\n\n好消息是，随着你阅读本书的进展，你一直在为你的`VUI`逐步添加越来越多的上下文。以下是一些例子：\n\
  \n-   你一直在为意图添加多个响应。`Dialogflow`会随机选择一个，但不会选择上次被选中的那个。这是一种上下文形式：知道上一个响应是什么，并且不选择它。\n\
  -   在第 6 章中，你使用`Dialogflow`的必需参数功能实现了一个预约对话，该功能会自动询问缺失的信息。这是上下文：知道用户提供了哪些信息，以及还需要什么。\n\
  -   同样在第 6 章中，你实现了一个程序准备对话，引导用户完成一系列步骤来完成一项任务。这里的上下文是知道用户在对话流程中的位置，并给出相应的下一步响应。\n\
  -   第 7 章处理了不完整请求和消歧。在这里，上下文包括跟踪信息：需要什么、缺少什么以及已经指定了什么。\n-   第 9 章全部关于通用功能，正如我们提到的，这些功能本质上是依赖于上下文的；响应取决于最近的意图。你构建了这种跟踪，并添加了更多上下文来处理连续出现多个通用功能的情况。\n\
  -   在第 12 章中，你实现了一步纠正，允许说“不，是 1984 年”。那里的上下文是出生日期收集。\n-   在第 13 章中，你实现了升级提示和最大错误次数，这两者都需要了解用户经历了多少次错误的上下文知识。\n\
  \n所以，你看，即使没有正式存储在数据库中，你已经在使用相当多的上下文了。\n\n\n\n#### 持久化追踪\n\n来自语音前线\n\n最近在安家中发生的一次互动，展示了不正确的持久化处理：\n\
  \n**安** *我的通知是什么？*\n\n**IVA** *您有一条通知……* <配送信息>\n\n**安** *重复一遍。*\n\n**IVA** *您没有新通知。*\n\
  \n**安** *{不宜刊印的回应}*\n\n持久化是将对话轮次串联成连贯对话、而非孤立短语的关键。它是信息在对话内部及跨对话间的粘性。良好实现的持久化能支持更接近人类的混合主动式对话，让用户能在当前对话乃至后续对话中构建和完善请求。在人类认知中，短期记忆和工作记忆支撑着当前对话中与聆听、理解修正、问答环节相关的活跃临时语境。长期记忆则负责追踪和存储姓名、偏好或账号号码等信息——这些信息能被记住，无需明确提及即可带入对话。而短期记忆和工作记忆正是大多数语音用户界面复杂性的根源。\n\
  \n简单的聆听方式是让麦克风保持开启固定秒数。简单的对话内持久化方式是持续聆听并保留信息，直到所有必要槽位被填满，或用户停止回应、说出*谢谢*。此时，你更新后端数据并清除槽位值和意图，因为认为对话已结束。这是个起点，但对自然对话而言远远不够。\n\
  \n持久化之所以棘手，在于它并非等待固定秒数那么简单。它不仅关乎聆听时长，更关乎语境如何影响你记住什么、记多久。人类不会永远逐字记住每段对话；你的语音用户界面也不该如此。它也不应在停止聆听的瞬间遗忘一切。唉，这比那要更灵活一些。\n\
  \n更好的短期记忆和工作记忆处理方式是使用记忆衰减机制，同时结合用户最近的请求或回应细节、任何重试、语音用户界面的回应、执行结果、用户位置等信息——就像人类所做的那样。如果我在你给出信息后\
  \ 2 秒说*重复一遍*，我期望你再次告知相同信息。但若我 30 秒后回来说*重复一遍*，我预期你会回应*重复什么？*，因为对话已自然结束，你很可能已转而思考其他事情。如果我曾要求*播放莱昂纳德·科恩的《哈利路亚》*，歌曲结束后\
  \ 2 分钟我说*再放一遍那首歌*，我期望你能记住——前提是此期间没有其他类似对话或行为发生，且之后没有播放其他歌曲。任何中间事件都会改变语境。如果我当时在厨房，最初要求是在客厅播放，我可能预期仍在同一位置播放，除非我说*在厨房再放一遍那首歌*——因为作为懒惰的人类，我会期望信息持久化，只需指定变化的部分。持久化影响着解读的范围。\n\
  \n如你在图 14-2 中所见，语境包含时间、地点、通信类型与历史、在场或缺席人员等多个维度。更通用的语境（如当前地理位置和日期）持久性更长，不会随对话切换而改变——除非经过相当长的时间，或者我们都身处某个拥有即时传送虫洞的科幻故事中。更具体的语境（如请求中的槽位内容）变化更快，因此记忆衰减时间应更短。\n\
  \n#### 语境感知与语境依赖型对话\n\n你的语音用户界面对话只有在融入语境时才能大放异彩。这看似微妙——也确实如此——但对交织语境中的细微差别做出不同回应，能让你的语音用户界面更接近自然与智能。有了语境，语音用户界面的回应可以更精准、信息更丰富。让我们深入探讨一些利用语境能实现的酷炫功能、为何需要它们，以及它们如何影响对话流程。正确融入不同语境后，你可以构建如下对话：\n\
  \n* **用户** *能告诉我巨人队下一场比赛是什么时候吗？*\n* **VUI** *当然。旧金山巨人队明天晚上 7 点对阵道奇队。*\n* **用户**\
  \ *那场比赛在哪里？*\n* **VUI** *那场比赛将在道奇体育场举行。*\n* **用户** *巨人队这周有主场比赛吗？*\n* **VUI** *没有，他们的下一场主场比赛是\
  \ 9 月 9 日周一对阵红人队。*\n\n这段对话运用了多种语境：指代（*那*、*他们的*）、日期时间、领域知识以及地理位置（“巨人队”也是一支美式足球队，但目前正值棒球赛季，且我们两位作者都在旧金山）。让我们进一步了解如何利用语境。\n\
  \n在大多数对话中，人们不会随机跳跃话题，尤其是针对语音用户界面的对话。事实上，当对话尚未完成时，人们在下一轮对话中的回应方式在很大程度上是可预测的——如果对话似乎转向不同方向，通常是由于需要澄清或消除歧义。这一点很重要，因为自动语音识别和自然语言处理依赖于此，并在对话管理器中加以利用。利用可预测性，语音用户界面可以更倾向于选择更可能的语句解读。你在第\
  \ 10 章和第 11 章中学习了语境语法，在第 17 章中还将学到更多。\n\n\n\n##### 上下文感知对话的代码\n\n上下文感知的一个典型例子是：当用户连续两次提出相同请求时，系统给出不同的响应。这并非简单的随机化，而是有充分理由的：当语音用户界面（VUI）在极短的时间窗口内两次听到相同的请求时，这通常意味着它第一次没有正确理解用户。我们将再次使用\
  \ `dialer` 这个名称。^(⁹⁵) 你会注意到本节中的代码与第 12 章中的跳过列表实现非常相似。这是有意为之，以便让你更容易理解；只是这次的重点略有不同。隐式确认会告知用户其意图是否被正确理解。显然，你需要避免再次给出相同的错误答案，并且需要使用不同的话语标记来确认这一点：\n\
  \n*   **用户**    *呼叫 Brent Jones。*\n\n*   **VUI**    *正在呼叫 Brenda Jones。*\n\n*  \
  \ **用户**    *停止！呼叫 Brent Jones。*\n\n*   ~~~ *VUI-1:*  *再次给出相同的错误响应 ~~~*\n\n*   ~~~\
  \ **VUI**     *正在呼叫 Brenda Jones。☹*\n\n*   ~~~ *VUI-2:*  *进行解释，但不执行呼叫 ~~~*\n\n*\
  \   ~~~ **VUI**    *我找不到叫这个名字的人。* ![../images/507213_1_En_14_Chapter/507213_1_En_14_Figa_HTML.gif](img/507213_1_En_14_Figa_HTML.gif)\n\
  \n当你收到姓名拨号意图时，请检查在极短的时间窗口内（目前可尝试 30 秒；实际应用可能会使用更短的时间窗口）是否已经收到过包含相同姓名的相同意图。如果是，那么我们就播放一条不同的隐式确认提示。从编码角度来看，你需要进行三项更改：\n\
  \n1.  在意图上下文中保存名字和姓氏。\n\n2.  查找最近的姓名意图并存储该姓名。\n\n3.  利用最近的姓名来提供替代行为。\n\n让我们详细地逐步了解这些步骤：\n\
  \n**步骤 1：** 首先，在姓名拨号意图中，将名字和姓氏保存到你于第 13 章创建的意图上下文中（这将会再次派上用场！）。请记住，该意图上下文的名称中包含时间戳，因此你可以判断它是否是最近的。相关代码清单见清单\
  \ 14-1。\n\n在新的 `context.py` 中，为 `new_context()` 添加一个新的 `params` 参数，其默认值为 `None`（A）。如果新的\
  \ `params` 参数不为 `None`，则将参数添加到新的上下文中（B）。在 `webhook_response.py` 中，将意图上下文的参数初始化为一个空字典（C）。在\
  \ `main.py` 中，传入意图参数（D）。如果是姓名拨号意图，则设置名字（如果有）（E）和姓氏（如果有）（F）。我们在上下文中使用 `given_name2`\
  \ 和 `last_name2` 作为参数名的原因是，Dialogflow 会从上一次话语的槽位中填充 `given_name` 和 `last_name`——这样命名是为了确保不会产生混淆。\n\
  \n```\n# 在 new_context.py 中：\n# 添加一个参数 params；将 params 添加到上下文中\ndef new_context(name,\
  \ params=None):   #A\n# ...... 为聚焦清单而省略的代码 ......\n# 如果有 params，则添加它们\nif params\
  \ is not None:\nfor key in params:\ncontext['parameters'][key] = params[key]   #B\n\
  return context\n######\n# 在 webhook_response.py 中：初始化 params\nclass WebhookResponse():\n\
  # ...... 为聚焦清单而省略的代码 ......\ndef __init__(self):\n# 意图上下文中的参数\nself.intent_params\
  \ = {}   #C\n######\n# 在 main.py 中：将 params 添加到新的上下文\ndef main():\n# ...... 为聚焦清单而省略的代码\
  \ ......\noutput_intent_name = df_request.intent_display_name.lower().replace('\
  \ ','_')\ndf_response.output_contexts.append(\nnew_context(f\"intent_{output_intent_name}\"\
  ,\nparams=df_response.intent_params))  #D\n######\n# 在 ar_call_by_name.py 中：\n#\
  \ 根据输入参数设置意图参数\ndef ar_call_by_name(df_request, df_response):\n# ...... 为聚焦清单而省略的代码\
  \ ......\ngiven_name = df_request.parameters.get('given-name')\nlast_name = df_request.parameters.get('last-name')\n\
  # 在意图上下文中将名字和姓氏设置为参数\nif given_name and not given_name == '':\ndf_response.intent_params['given-name2']\
  \ = given_name  #E\nif last_name and not last_name == '':\ndf_response.intent_params['last-name2']\
  \ = last_name  #F\n清单 14-1\n向意图上下文添加参数\n```\n\n**步骤 2：** 在遍历请求的上下文时，找到一个最近的姓名拨号上下文，并检索其中的名字和姓氏。清单\
  \ 14-2 展示了如何搜索最近的姓名意图：在 `webhook_request.py` 中初始化变量。将重复窗口设置为 15 秒。这是你向后查找相同意图的时间范围（A）。设置最近一次姓名意图的时间（B）。设置最近一次意图中的名字和姓氏（C）。检查在重复窗口内是否存在\
  \ `arCallByName` 意图（D）。在 `set_most_recent_intent.py` 中，设置最近的姓氏（E）和最近的名字（F）。\n\n\
  ```\n# 重复窗口 repeatWindow = 30          # A\n# 最近的名字、姓氏以及最近一次 arCallByName 的时间\n\
  mostRecentNameTime = 0  # B\nrecentGivenName = None  # C\nrecentLastName = None\n\
  # 我们始终创建的意图上下文中的参数\nintentParams = {}\n# 获取当前时间\ncurrentTime = time.time()\n# 提供的参数，可能来自\n\
  # 用户的语音/文本，或来自上下文。\nparameters = []\n# 要触发的事件\neventToTrigger = None\n# 初始化输出上下文\n\
  outputContexts = []\nif 'queryResult' in requestJSON:\nqueryResult = requestJSON['queryResult']\n\
  queryText = queryResult.get('queryText') or ''\nparameters = queryResult.get('parameters')\
  \ or []\nif 'intent' in queryResult:\nintentDisplayName = queryResult['intent']['displayName']\n\
  fulfillmentText = queryResult.get('fulfillmentText') or ''\ninputContexts = queryResult.get('outputContexts')\
  \ or []\nfor dic in inputContexts:\nfullname = dic.get('name') or ''\nm = re.search('/([^/]*)$',\
  \ fullname)\nif m:\n# 检查这是否是最新的意图。\nm2 = re.search('^intent_\\\\d+_(.*)$', m.group(1))\n\
  if m2:\nif 'parameters' in dic:\ncontextTime = dic['parameters'].get('timestamp')\
  \ or 0\nif contextTime > mostRecentIntentTime:\nif not isSkippableUniversal(m2.group(1)):\n\
  mostRecentIntentName = m2.group(1)\nmostRecentIntentTime = contextTime\nif contextTime\
  \ > mostRecentNonFallbackIntentTime:\nif m2.group(1) != 'default_fallback_intent':\n\
  mostRecentNonFallbackIntentName = m2.group(1)\nmostRecentNonFallbackIntentTime =\
  \ contextTime\nif currentTime - contextTime  mostRecentNameTime:\nmostRecentNameTime\
  \ = contextTime\nrecentLastName = \\\ndic['parameters'].get('recent-last-name')\
  \ #E\nrecentGivenName = \\\ndic['parameters'].get('recent-given-name') # F\n清单 14-2\n\
  查找最近的姓名意图并存储该姓名\n```\n\n\n\n**步骤 3：** 如果当前意图是姓名拨号意图，并且我们有最近的名和姓且两者都匹配，则播放不同的提示。清单\
  \ 14-3（`ar_call_by_name.py`）展示了如何使用最近姓名来提供替代行为：检查是否有最近的名和姓，以及它们是否与当前姓名相同（A）。上下文相关的替代响应（B）。\n\
  \n```\ngivenName = parameters.get('given-name') or ''\nlastName = parameters.get('last-name')\
  \ or ''\nif givenName:\nintentParams['recent-given-name'] = givenName\nif lastName:\n\
  intentParams['recent-last-name'] = lastName\nif givenName and lastName:\n# 如果呼叫者同时指定了名和姓（“呼叫布伦特·琼斯”），\n\
  # 我们不需要消歧，直接执行即可。这是“按原计划执行”的情况，\n# 即 webhook 不修改 Dialogflow 原本要执行的操作。\nif givenName\
  \ == recentGivenName and lastName == recentLastName:  # A\noutputText = (\n'我无法识别这个姓名。'\n\
  '也许它不在您的联系人列表中？'  # B\n)\n```\n\n试试看！在 30 秒内连续说两次*呼叫布伦特·琼斯*，您将看到新的上下文相关响应。\n\n#####\
  \ 回指解析\n\n这是一个常见的回指示例：\n\n- *基思需要搭车去机场。你能开车送**他**吗？*\n- *当然。**他**需要什么时候到**那里**？*\n\
  \n像 *him* 和 *he* 这样的代词，以及 *there* 这样的副词，都是代词和回指词的例子，它们用于指代对话中已经提及的内容，在本例中是指一个人和一个地点。我们一直都在使用回指，因为它能让对话更简洁。如果不使用或不理解回指引用，我们的对话会变得更冗长，听起来像法律诉讼程序。没有回指，就无法实现自然的对话。\n\
  \n回指词必须与其所指对象在语法上保持一致。在英语中，这通常包括性别（男/女）、数（单数/复数）和格（主格/宾格）。在示例中，“基思”是一个人且为男性；因此使用了“he”和“him”。这里没有混淆的风险，因为只讨论了一个人。问题在于，有时很难确定回指词具体指代什么：\n\
  \n- *乔提出让鲍勃开这辆车。不幸的是，**他**找不到钥匙。*\n\n根据语法，无法确定是乔还是鲍勃找不到钥匙。当回指模糊时，人们会依赖语义和上下文来解析：包括对世界的认知、特定主题的知识，以及对话中先前和紧接着建立的信息。当我们理解错误时，会在听到更多澄清信息后在脑海中自行澄清或纠正，或者产生误解，导致对话混乱。回指解析非常具有挑战性，是自然语言处理中的一个重要课题，远远超出了本书的讨论范围。如果您的目标是实现自然对话，您的语音用户界面（VUI）需要既能理解回指引用，也能在提示中恰当地使用它。解析歧义是听众注意到冲突时的一大乐趣来源。一个经典的例子来自《钦定版圣经》：*他对儿子们说，给我备驴。他们就备好了驴*。\n\
  \n##### 多模态角落\n\n*把那个放在那里*是多模态回指的完美示例，其中语音和手势共同实现了简短、高效且精确的交互。它也是一个早期重要系统^(⁹⁶)的名称，该系统展示了多模态通信。\n\
  \n将初始语音搜索与点击或指向点击相结合，以在一小组结果中进行选择是很有用的：例如，通过语音搜索餐厅（*娜娜餐厅周五晚上六个人有什么可选的？*），然后查看可用的餐桌时间结果，思考选项，并通过点击选择一个。这基本上是两全其美，利用了每种模态的优势，加快了对话速度，并最小化了认知负荷。请注意，模态可以相互叠加或重叠，但回指意味着一定的上下文感知能力。如果您的\
  \ VUI 是多模态的，用户能否看着屏幕上的内容问：“这张图片是什么？”如果不能，那就没有恰当地利用上下文。\n\n由于回指解析非常困难，您的主要目标应该是尽量减少提示中的混淆，并确认任何需要在后续对话轮次中保持清晰的内容。当响应模糊时，不要仅仅依赖回指。比较以下两个响应：\n\
  \n- **用户** *香港现在几点？*\n- **VUI1** ***那里**是下午 4 点 02 分。*\n- **VUI2** ***香港**是下午 4\
  \ 点 02 分。*\n\n尽管人们在回应时可能会使用 *那里*，但 VUI 更明确地表达会更安全，以避免用户产生不确定性。为了简洁而删减几个词并不值得，不过如果您的\
  \ VUI 是多模态的，并且屏幕或其他操作提供了某种隐含的理解证据，那么这样做或许可以接受。\n\n注意回指不匹配的问题，即使用了不适合当前情境的回指词。回指不匹配正是为什么即使您认为像\
  \ *我不知道那个* 这样的通用错误响应也需要小心的原因。请看以下对话：\n\n- **用户** *上次瑞典女子冰壶队赢得奥运会时，队长是谁？*\n- **VUI**\
  \ *我不知道那个。* → ☺（问答）\n\n- **用户** *把音量调到最低。*\n- **VUI** *我不知道那个。* → ☹（动作请求）\n\n- **用户**\
  \ *呼叫妈妈。*\n- **VUI** *我不知道那个。* → ☹（动作请求）\n\n*我不知道那个* 是对问题的合理回应，但对动作请求来说则很糟糕，而 *我不知道怎么做那个*\
  \ 则要好得多。一个通用的 *我无法帮您处理这个* 可以适用于以上三个示例。通过将所有具有相同含义、功能和置信水平的响应分组，然后在该组内随机选择，可以避免这种常见的随机响应陷阱。这对于听起来智能来说是一个微妙但重要的点；您将在本章中了解更多相关内容。\n\
  \n**成功提示 14.3 小心使用那些指代**\n\n有时，多使用名字和名词比冒险以奇怪、模糊或错误的方式使用回指更安全。而且这还只是在英语中。如果您正在构建具有语法性别的语言的\
  \ VUI，您不能仅仅使用“它”和“那个”的对应词而不了解它所指代的具体词汇，因此您的设计会变得更加复杂。\n\n\n\n#### 后续对话与关联请求\n\n\
  正如你刚刚学到的，持久性与作用域密切相关：即某事物在对话中保持活跃和适用的时长。后续对话是回指的理想用例，因为回指将含义链接回之前的对话轮次。回指和后续请求通常生命周期较短；引用在某个其他项目或话题介入之前，或在该话题数秒未被讨论之前保持\"\
  活跃\"。但这个时间窗口并非恒定不变；它会随着从工作记忆中淡出而迅速衰减，除非通过对话中持续的引用得到强化。这一点在许多实现中都被忽视，却至关重要。\n\n采用固定的\
  \ N 秒延迟来关闭麦克风和清除活跃内容虽然易于实现，但实际上可能比完全没有麦克风关闭延迟更让用户困惑。用户不应需要查看指示灯来判断设备是否仍在监听，而一个在语义和结构上基于先前交互的后续问题，其超时时间可能比您希望麦克风保持开启的时间更长。在当前因\"\
  *他们一直在监听我们的对话*\"这种想法引发的担忧氛围下，保持麦克风开启意味着会有更多情况导致 VUI 响应并非针对其\"耳朵\"的内容，从而加剧信任问题，并影响语音技术的未来使用。\n\
  \n答案在于理解人们何时回应以及何时不回应。精确的措辞、与主题及前一个对话轮次的相关性、对话结构、话语的来源和方向，以及音量和韵律，都会影响人类听众对下一个听到话语的解读。一个配得上\"\
  智能\"之称的 VUI 应能正确选择何时以及如何回应。\n\n您需要避免在\"持久性追踪\"一节的 Voice Trenches 示例中看到的对*我的通知是什么？*的后续响应。您也不能硬编码一个通用的后续问题来对应特定响应：*那\
  \ CITY_NAME 呢？* 并非*CITY_NAME 的天气如何？*的同义词，除非它直接跟在关于其他地方天气的问题之后（这也是一个真实语音助手的例子）。\n\
  \n这正是追踪最近活动派上用场的地方。因为人们大多会跟进与先前对话有某种关联的对话，您可以限制或优先选择那些基于先前对话构建的解释，并使用话语标记和回指创建自然的对话流。通过追踪最近的请求和结果，您可以创建如下对话：\n\
  \n*   **用户** *把厨房的音量调大。*\n*   **VUI** <调高音量>\n*   **用户** *再大一点。*\n*   **VUI** <调高音量>\n\
  *   *~~~ ~~~ ~~~*\n*   **VUI** *车库的灯亮着。要关掉吗？*\n*   **用户** *好的。露台上的也关掉。*\n*   **VUI**\
  \ *好的。现在都关了。*\n\n**成功技巧 14.4 寻找后续线索**\n\n当后续请求包含回指、像*那……呢*或*……怎么样*之类的短语，或具有不同槽位值的相似意图时，应基于最近的请求和结果，优先选择逻辑上合理的后续解释。\n\
