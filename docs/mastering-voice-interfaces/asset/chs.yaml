  \n如果有人回答*不，是 8 号*或*不，是 1998 年*，会发生什么？这两种情况都是只修正日期或只修正年份的有效情况。但两者都是数字，那么如何知道要修正哪个呢？意图\
  \ `confirmDOBcorrect` 中的参数 `dayoryear` 可以配合 webhook 来区分。幸运的是，日期必须小于 32，而大多数 VUI\
  \ 中的年份会大于 1900（暂时忽略*“我听到的是 2019 年 3 月 5 日。对吗？”* *“不，18。”* 这种情况）。你需要稍微修改意图 `confirmDOBcorrect`，如图\
  \ 12-6 所示，并使用 webhook 代码来消除歧义。\n\n![../images/507213_1_En_12_Chapter/507213_1_En_12_Fig6_HTML.jpg](img/507213_1_En_12_Fig6_HTML.jpg)\n\
  \n图 12-6 处理 `dayoryear` 参数的 `confirmDOBcorrect` 意图新增部分\n\n##### 关于一步修正的说明\n\n你可以将此代码作为基础，并根据\
  \ VUI 的用例进行必要的修改。这里的所有示例都以*不*开头，但有些人只修正内容：*是 1985 年 6 月 12 日吗？是 7 月。* 对于人类听众来说，即使没有*不*，这也足够清晰。\n\
  \n在最后一个示例中，两个数字很容易区分，因为它们的范围不重叠。但情况并非总是如此：如果用户对日期和月份都使用数字，或者你询问的是药物剂量和数量之类的内容，该怎么办？请思考它们可能重叠的情况，以及你需要如何修改设计和代码。同时思考如何约束有效范围；任何此类信息对于实现最高准确度都至关重要。好消息是，人们在使用一步修正时通常能意识到哪些信息存在歧义，因此他们会提供足够的上下文。如果年份\
  \ *2009* 被误识别为 *2005*，大多数人会重复整个年份，而不仅仅是最后一位数字。\n\n#### 教程\n\n针对性的教程对于某些任务和用户群体可能很有用。教程的复杂程度可以有所不同。有时，只需录制一段简单的“用户”与\
  \ VUI 之间的示例交互，就足以说明如何完成某项操作。仅仅听到一段包含提示语和常见请求或响应的录制示例对话，就能提高用户的成功率和满意度。当对话涉及全新、复杂或存在任何风险的任务或设备时，交互式演示值得考虑。它让用户有机会在沙盒中“边做边学”，而无需承担任何风险。我们已实现过这两种类型，并看到了它们的好处。以下是一些需要牢记的简单准则：\n\
  \n- 保持简短。\n- 为用户部分使用明显不同的声音。例如，如果你的 VUI 声音低沉，那么教程中的用户声音应该更高一些。\n- 提供教程，但切勿强迫用户收听。并且不要在用户每次与\
  \ VUI 交互时都提供。当用户是新用户时，或者当你跟踪错误行为并注意到他们难以获得所需内容时，再提供教程。一句简单的*想听听我能做什么吗？*（或任何符合上下文的话）就很好，因为用户只需回答是或否。\n\
  - 请记住，每当你的功能或语法覆盖范围发生变化时，都要更新教程。与示例一样，教程必须反映 VUI 中实际有效的内容。\n\n##### 多模态角落\n\n如果你的\
  \ VUI 是多模态的，你希望利用屏幕来传达识别结果、提供消歧义等。当你拥有屏幕时，教程和实用提示尤其有用。如果某些操作涉及用户不熟悉的步骤，分步多模态教程是一种很好的方法（图\
  \ 12-7）。\n\n![../images/507213_1_En_12_Chapter/507213_1_En_12_Fig7_HTML.jpg](img/507213_1_En_12_Fig7_HTML.jpg)\n\
  \n图 12-7 多模态教程是一个很好的工具\n\n#### 拼写\n\n最难的识别任务往往是一些看似最基本的任务：单个数字和字母表中的字母。这应该不会让你感到惊讶：你曾与某人通电话，对方使用像\
  \ *A as in apple* 或 *alpha* 这样的语音字母表来拼写名字。空中交通管制员和飞行员会说 *niner* 而不是 *nine*，以降低与\
  \ *five* 混淆或误解的风险。美式英语字母表的 **e-set**（B C D E G P T V Z）中的许多字母，在只听声音而看不到说话者嘴唇的情况下，很难区分。F\
  \ 和 S 也存在问题。\n\n如果你正在为军事或航空用途创建语音解决方案，可以期望用户知道并使用官方语音字母表。但在你余下的职业生涯中，只设计军事 VUI 的可能性很小。那么你该怎么办？一个部分解决方案是找出人们最常用的单词，并将它们包含在你的语法中。另一个解决方案是利用任何可用的逻辑与可能的答案进行交叉引用，这是我们下一个主题。\n\
  \n\n\n#### 缩小识别空间\n\n提高准确率的一种方法是逐步缩小语音用户界面的搜索空间，从而降低识别任务的难度。这可以通过消歧、确认以及聚焦语法结构来实现。你已经知道，不应将用户限制在你强加的少数关键词上，而应允许自然变化——但有时用户会说类似*“Can\
  \ I have a glass of red wine with my wife after dinner?”*这样的话，这可能会让你的 VUI 陷入混乱，因为你原本只预期了*“Can\
  \ I have red wine?”*。\n\n大多数数据集都具有一定的结构或限制。例如，银行的账号可能是数字，长度为 8 到 14 位，且倒数第三位总是 1\
  \ 或 2。电话号码的长度取决于国家或区号。信用卡使用校验和数字。美国地址语法与邮政编码关联，这样并非所有街道名称都始终处于语法范围内，这大大有助于识别。可以对照检查一个庞大但稀疏的数据集。你应该整合任何可靠且能缩小识别空间的因素，以提高准确率。\n\
  \n现在回到如何处理拼写的问题。如果有人向航空公司应用拼写姓名以确认预订，那么该航班很可能有一份乘客名单可供核对。如果有人正在朗读一个字母数字组成的处方或确认号码，那么这个号码很可能可供核对，并且只有某些组合是有效的。如果你的\
  \ VUI 识别出`5 D 4 4 9`，但实际有效的只有`5 T 4 4 9`，那么很可能是`T`被误识别了。一种解决方案是尝试模糊匹配；VUI 将近似匹配作为单独结果捕获，并由用户验证：\n\
  \n- **VUI** *请拼写乘客的姓氏。*\n- **用户** *J O N E S. →* 识别为 `J O M E S`\n- **VUI** [未找到`Jomes`，但找到`Jones`]\n\
  - **VUI** *是 J O N（像 Nancy 中的 N）E S，对吗？*\n- **用户** *正确。*\n- *~~~ ~~~ ~~~*\n- **VUI**\
  \ *您的处方号码是多少？*\n- **用户** *5 T 4 4 9. →* 识别为 `5 D 4 4 9`\n- **VUI** [未找到`5 D 4 4\
  \ 9`，但找到`5 T 4 4 9`]\n- **VUI** *为确认，请再说一遍那个号码。*\n- **用户** *5 T 4 4 9. →* 识别为 `5\
  \ T 4 4 9`\n\n在低安全级别的情况下，你可以“自动纠正”或纠正并确认。其他时候，可以选择记录差异并再次询问。本章你将学到另一个有趣的解决方案。通过为特定上下文定制语法或理解能力，可以缩小识别空间。你在第\
  \ 7 章中看到了一个基于自定义电话列表并了解列表中姓名来进行消歧的示例。\n\n### 高级技巧\n\n与语音技术打交道就是拥抱不确定性。在 IVR 的对话式语音设计与开发领域，长期以来有一些技巧有助于掌控不确定性，但尚未在其他语音界面中普遍应用。由于这些技巧非常强大，我们希望你能了解它们：用于多层识别行为的置信度分数，以及用于选择正确识别结果的\
  \ N-best 列表和跳过列表。\n\n#### 多层行为与置信度分数\n\n我们大多数人对自己是否听清某事或表达得如何都有相当好的判断。可能存在背景噪音，或者说话者声音轻柔、含糊不清，或者话题不熟悉。我们根据自身的确定程度来做出假设和回应：要么继续推进，要么先验证是否理解，要么请求澄清甚至重来。\n\
  \n这就是在 VUI 设计中使用**分层识别置信度分数**背后的概念。通常定义两层或三层，根据 VUI 对用户话语被正确理解的置信度，给出不同的 VUI 响应。每个识别结果都有一个基于结果与假设匹配程度的关联分数。多层设计允许你验证识别分数较低的语句，以避免后续问题，同时能更快地推进对话，并在不必要时避免额外步骤——就像人类的行为一样。以下是一个典型的多层设计：\n\
  \n- **VUI** *您的处方号码是多少？*\n- **用户** *5 T 4 4 9.*\n- ~ ~ 高置信度分数 ~ ~\n    - **VUI**\
  \ *谢谢。您的泼尼松还有两次续药机会……*\n- ~ ~ 中等置信度分数 ~ ~\n    - **VUI** *确认一下，是 5 T 4 4 9，对吗？*\n\
  - ~ ~ 低置信度分数 ~ ~\n    - **VUI** *抱歉，请再说一遍那个号码。*\n\n在高置信度分数下，VUI 假定其识别结果是正确的，不会向用户确认——尽管包含隐式确认仍然很重要。在中等分数下，显式确认会在继续之前验证结果是否正确。低于某个分数时，直接再次询问，因为出错的可能性太高了。\n\
  \n你可以利用置信度来定制确认策略（第 8 章），这基于 VUI 理解用户的可能性以及对响应准确性的确定程度。如果置信度高，就减少确认，主要采用隐式确认，并使用像*“当然”*这样的词语。在中等置信度下，显式确认并用*“我认为您想要……”*这样的短语来缓和回应。而在低置信度下，则拒绝并重试。\n\
  \n**来自语音一线**\n\n我们都曾经历过家里的智能设备在我们没有对其说话时被触发，即使我们离它好几英尺远。你可能也有过类似经历。一段包含*“This is\
  \ not acceptable”*的对话不知何故导致设备询问*“Should I play Blake?”*。如果多层置信度被广泛采用并正确设置，这类误触发就会少得多。\n\
  \n\n\n##### 实现多层确认\n\n并非所有平台都向开发者提供置信度分数。在创建 VUI 时，设计师和开发者需要就可用性达成共识。这正是谷歌成为本书完美选择的原因：在撰写本书时，置信度分数可通过\
  \ Google Cloud Speech API 获取，但无法直接或一致地通过 Dialogflow 获取。这很好，因为它让我们能够应对这两种情况。\n\n\
  多层确认可以通过多种方式实现。当识别器提供置信度分数时，使用这些分数是最佳方法。一种在某些场景下有效的简单方法是字符串匹配：与多词短语中的已知项进行精确的逐词匹配，将产生“高置信度”，而非精确匹配则给出较低的置信度并触发不同的行为。这种方法最适用于较长的搜索短语，例如电影名称或餐食描述。\n\
  \n由于 Dialogflow 目前不提供置信度分数，你实施此类策略的能力会受到限制。如果将来它提供了——或者你正在使用提供该功能的平台——那么实现过程大致如下：\n\
  \n1.  创建一个用于收集数字的意图。将其命名为 `arCollectNumber`。\n2.  创建一个用于回读信息的意图。将其命名为 `arReadInformation`。确保此意图响应\
  \ `readinformation` 事件。\n3.  为中等置信度创建一个确认意图 `arConfirmNumber`。确保此意图响应 `confirminformation`\
  \ 事件。\n4.  将 `reject` 事件添加到现有的默认回退意图中。\n5.  在 webhook 中添加逻辑以处理意图 `arCollectNumber`：\n\
  \    1.  像本章前面收集出生日期时那样，将数字作为参数保存在输出上下文中。\n    2.  如果来自 webhook 请求的置信度高，则触发 `readinformation`\
  \ 事件。\n    3.  如果置信度为中等，则触发 `confirminformation` 事件。\n    4.  如果置信度低，则触发 `reject`\
  \ 事件。\n\n意图 `arReadInformation` 的 webhook 代码从上下文中获取数字，该数字是在响应 `arCollectNumber`\
  \ 时设置的。结果类似于清单 12-4。\n\n```\n{\n\"results\": [\n{\n\"alternatives\": [\n{\n\"transcript\"\
  : \"1 2 3 4 5 6 7 8 9 0\",\n\"confidence\": 0.88398576\n},\n{\n\"transcript\": \"\
  one two three four five six seven eight\nnine zero\",\n\"confidence\": 0.9059588\n\
  },\n{\n\"transcript\": \"one two three four five six seven eight\nnine 0\",\n\"\
  confidence\": 0.86726743\n},\n{\n\"transcript\": \"1 2 3 4 5 6 7 8 9 zero\",\n\"\
  confidence\": 0.87917966\n},\n{\n\"transcript\": \"1 2 3 4 5 6 7 8 9 0 0\",\n\"\
  confidence\": 0.8787717\n}\n]\n}\n]\n}\n清单 12-4\nGoogle Cloud Speech-to-Text API\
  \ 的输出\n```\n\n##### 关于基于置信度的多层设计说明\n\n各层级之间的界限并非一成不变。它取决于在继续之前确保正确的重要性，以及整体平台的分数。将置信度分数视为百分比，其中\
  \ 100%代表绝对确定。良好的通用起始点通常在 85%和 50-65%左右。通过反复试验，并在获得真实数据后进行调优，将帮助你确定这些界限。正确的层级能最大化高置信度桶中的正确接受（CA）结果，以及低置信度桶中的正确拒绝（CR）结果。那些本可能成为错误接受或错误拒绝（FA\
  \ 或 FR）的结果，正是你希望放入中等置信度桶中的，这样你的 VUI 就不会基于错误信息做出决策，同时也不会使对话变得不必要的冗长。\n\n你可能已经意识到，所有\
  \ VUI 交互实际上都使用了层级。只是默认情况下是两层：接受或拒绝。你不太可能在所有交互中都使用多层设计——想象一下确认“是/否”时的恐怖场景：*你说了“不”，对吧？*\
  \ 你也可以添加更多层级和其他基于置信度的行为，例如在置信度较低时“含糊其辞”地回应：\n\n*   **用户**    *我想找一家融合斯堪的纳维亚和日本风味的餐厅。*\n\
  \n*   ~ ~ ~ 高置信度分数 ~ ~ ~\n\n*   **VUI**    *好的。SamurHej 是您的理想之选……*\n\n*   ~ ~ ~\
  \ 中等置信度分数 ~ ~ ~\n\n*   **VUI**    *您可能会喜欢 SamurHej……* ← 通过引导短语暗示的含糊其辞\n\n关于 Actions\
  \ on Google 中的置信度分数，你有时会在 webhook 请求的 `queryResult` 部分中找到一个名为 `speechRecognitionConfidence`\
  \ 的字段。然而，当前的 Dialogflow 文档指出：“此字段不保证准确或已设置。特别是，此字段不会为 `StreamingDetectIntent` 设置，因为流式端点对\
  \ `StreamingRecognitionResult` 中的音频部分有单独的置信度估计。” 因此，你目前无法依赖在 Dialogflow 中访问置信度分数。如果你的实现需要一致地使用它们，则必须使用其他\
  \ STT 提供商，例如原始的 Google Cloud Speech-to-Text API。^(⁹¹) 此 API 提供置信度分数以及 N-best 列表，你将在接下来了解这些内容。\n\
  \n所有平台都有一些限制——你能实现什么取决于你的具体开发情况。企业级 IVR 平台通常允许访问置信度分数，但许多“即插即用”平台为了非专家的易用性而牺牲了这种级别的信息，这也没问题。根据你的目标和资源选择合适的设置，并确保所有相关人员了解这些限制，以确定正确的解决方案。\n\
  \n#### N-Best 和跳过列表\n\n回想一下识别的工作原理：识别器会形成并跟踪多个假设，直到语音结束，然后得分最高的假设进入下一步解释。这种安排产生了一个得分最高的单一假设；这是一个“*N-best*\
  \ = 1”的系统。如果你幸运的话，你使用的平台提供的不仅仅是最高分。你可以使用 N-best > 1（其中 N 可能是 5 或 10），结合其他查找来验证结果在上下文中是否有效，从而创建一些相当巧妙的对话。这就是我们在本章前面讨论识别空间以及如何在不询问用户的情况下移除无效选项时暗示的技术。对于一个包含字母数字的英国邮政编码系统，一位同事使用了\
  \ N-best=100！\n\nN-best 通常与对话中的跳过列表结合使用：如果 N(1) 假设因某种原因被拒绝，它就会被放入跳过列表。然后评估 N(2)\
  \ 假设，并对照现有的跳过列表进行检查，依此类推。这是处理具有挑战性的识别任务（例如长字母数字字符串）的常用技术。当相同的错误假设被多次返回时，它特别有用：\n\
  \n*   ~ ~ ~ 没有 N-best 和跳过列表 ~ ~ ~\n\n*   **VUI**    *您的处方号码是多少？*\n\n*   **用户** *5\
  \ T 4 4 9.*\n\n*   **VUI**    *是 5 T 4 4 1，对吗？* ← 识别错误\n\n*   **用户**    *不，是 5 T\
  \ 4 4 9.*\n\n*   **VUI**    *好的，5 T 4 4 1，对吗？* ← 再次识别错误\n\n*   **用户**    *不对！！*\n\
  \n相反，以下是 N-best 和跳过列表可以为你做的事情：\n\n*   ~ ~ ~ 使用 N-best 和跳过列表 ~ ~ ~\n\n*   **VUI**    *您的处方号码是多少？*\n\
  \n*   **用户**    *5 T 4 4 9.*\n\n*   **VUI**    *是 5 T 4 4 1，对吗？* ← 识别错误\n\n*   **用户**    *不，是\
  \ 5 T 4 4 9* ← “5T441” 被放入跳过列表。\n\n*   **VUI**    *好的，5 T 4 4 9，对吗？* ← 再次识别错误；检查跳过列表；转到\
  \ N=2。\n\n*   **用户**    *是的，正确。*\n\n\n\n##### 实现跳表\n\n与多层确认类似，Dialogflow（配合 Google\
  \ 上的操作）并不会提供 N 最佳列表。如果它提供了，你可以这样做：\n\n1.  创建一个意图 `arCollectNumber`。\n2.  在 `arCollectNumber`\
  \ 的 webhook 中，将识别到的数字保存到上下文参数中，就像你对出生日期所做的那样。\n3.  创建一个处理数字确认的意图 `arConfirmNumber`；同样，你可以像处理出生日期那样进行一步修正。\n\
  4.  如果用户进行了修正，则从列表中的第 #1 项开始向下遍历 N 最佳列表，直到找到第一个尚未尝试过的项。使用该项进行确认；如果用户拒绝它，则将此项目添加到跳表中，再次询问，并跳过跳表中的所有项目，直到确认成功或达到最大尝试次数。这样，你就不会用错误的答案确认超过一次。\n\
  \n同样，与确认一样，你是否能访问 N 最佳列表取决于你的语音平台。目前，你在 Google 上的操作中无法访问，但如果你使用独立的 Google Cloud\
  \ Speech-to-Text API（如清单 12-3 所示），则可以访问。在许多企业级 IVR 平台上，你也可以访问。\n\n##### 关于 N 最佳列表和跳表设计的说明\n\
  \nN 最佳列表显然是一种强大的方法，可以以多种方式使用。但要小心：思考一下跳转到另一个选项会给用户带来怎样的感受。当我们在第 13 章讨论错误处理时，你将了解一些需要避免的陷阱。确保适当地重置跳表：它们是临时的跟踪工具，应在对话结束时失效。\n\
  \n#### 概率\n\n另一种技术是根据预期的频率为单个单词和短语分配概率。概率会影响话语被正确识别和解释的几率。统计语言模型（SLM）凭借其统计特性会自动分配概率。但有些理由需要影响这个概率，而针对特定数据集进行训练并不总是答案。也许你知道某个特定短语存在季节性或者与事件相关的使用高峰，但你还没有训练数据。也许你使用正则表达式而不是统计模型，并且需要更重地权衡某些识别结果。也许你的通用实体被错误地识别为其他实体。所有这些都是合理的理由——并且即使事件罕见，也应基于真实的用户数据。因此，当你学习调优（第\
  \ 17 章）时，你将了解更多关于概率的知识。\n\n与置信度分数一样，不同平台提供的功能也不同。一些更明确的语法结构和企业级 IVR 平台允许这种功能，可以基于单个词槽或整个话语。目前，Google\
  \ Cloud Speech API 向开发者提供了一些概率，但在撰写本文时，Dialogflow 并未提供一种方法来权衡特定话语的可能性。从某种意义上说，它是自动包含的，基于训练短语引入的偏差，这些短语会比其他选项或变体更侧重某些选项或变体。\n\
  \n#### 超时与延迟\n\n如果你能够更改关闭麦克风和停止监听的超时设置，就可以避免这种情况：\n\n*   **语音用户界面**    *您的卡号是多少？*\n\
  *   **用户**    *4143 … 9743* … ← 用户读出卡上的数字，停顿时间过长。\n*   **语音用户界面**    *抱歉，卡号是 16\
  \ 位数字。*\n*   **用户**    *呃，我还没说完呢……*\n\n某些情况需要比其他情况更长的超时时间。即使你无法访问该参数，你也可以识别出只识别了一半的数字，并给出更好的响应或提供另一种输入方法。不要让用户觉得是他们自己的错。\n\
  \n当今许多语音平台不向开发者提供在此级别进行自定义的能力。默认设置是设置一个比实际需要更长的超时时间，以避免你在示例对话中看到的截断行为。一些企业级平台确实允许更改超时持续时间，因此未来可能会提供此功能。默认长超时的一个缺点是，当用户的回答非常简短（例如“是”或“否”）时，他们必须等待。\n\
  \n支持 VoiceXML（一种用于指定语音交互的跨平台 W3C 标准格式）的企业级 IVR 实际上有两种超时：`incompletetimeout` 用于跟踪到目前为止所说的内容在当前上下文中是否有意义；`completetimeout`\
  \ 在用户说了有意义的内容时启动。`Completetimeout` 总是更短，这样系统在用户说了对上下文来说是合理响应的内容后，就不会等待太长时间。有了这些不同的超时，你可以避免截断\
  \ 16 位信用卡号等情况；`incompletetimeout` 在话语早期生效，给用户时间完成，而较短的 `completetimeout` 在系统检测到\
  \ 16 位数字后应用。这样你就可以两全其美了！\n\n### 下一步\n\n我们希望本章能说明，如果你想实现超出基础功能的内容，为什么不能仅仅依赖工具，表明有些工具可能具备你所需的功能，而有些则没有，并且变化是常态。确保你选择的平台能够提供你的设计所期望的参数。\n\
  \n我们所有人自然都会想：“嘿，我会说这种语言，所以我是专家！”因为我们一直在使用语言，我们会自动“清理”我们所听到的内容。我们可以忽略口吃、沉默、发音错误、旁白、漏词和语法错误。我们甚至没有意识到自己为了维持对话进行了多少补偿。如果这让你感到惊讶，可以做这个实验：录一段自然的对话，然后仔细转录所说的每一个细节，包括沉默的时长、打断、不完整的词语等等。首先，你会注意到对话是多么断断续续。然后，你会开始好奇计算机究竟是如何理解我们所说的任何内容的！\n\
  \n关于会话和话语分析，有许多有趣的书籍。这里有两个入门推荐：N. J. Enfield 的《我们如何交谈：对话的内在运作》是一本非常易懂的核心主题快速入门读物——无需任何背景知识。Rebecca\
  \ Clift 的《会话分析》是剑桥大学语言学教科书，因此更侧重于学术，但对于任何对该主题感兴趣的人来说仍然非常易懂。\n\n\n\n### 摘要\n\n表 12-2\n\
  \n策略总结\n\n| 策略 | 关键实施要点 |\n| --- | --- |\n| 示例 | 在开放式提示中，给出两个示例以展示深度和广度。 |\n| 帮助\
  \ | 对通用命令进行上下文相关的响应。 |\n| 即时信息 | 在成功完成请求后，立即提供下次使用的简短提示和快捷方式。 |\n| 隐藏选项 | 对用户自然话语（如“我不知道”）提供信息性响应，这些选项未在提示中明确给出。\
  \ |\n| 以上都不是 | 在菜单中，当用户未选择任何提供的选项时，给出上下文相关的响应。 |\n| 识别并拒绝 | 当答案和任务尚未实现时，给出比“无匹配并拒绝”更具信息性的响应。\
  \ |\n| 一步修正 | 在明确确认中，识别用户的修正，无需经过“不”这一步。 |\n| 教程与演示 | 针对新手用户或复杂任务，提供预先录制的 VUI 示例对话和清晰发音的“用户”；可以是交互式的。\
  \ |\n| 拼写字母表 | 对于名称，允许用户使用军事拼写或常用词；用户无需在两者之间做出选择。 |\n| 缩小识别空间与跳过列表 | 数字：将识别出的字符串与校验和匹配；跳过直到找到匹配项。动态/上下文语法：在较小的集合（如行程、联系人列表）中寻找匹配项。询问两次“以验证...”；匹配两个识别结果。\
  \ |\n| 多层识别与置信度评分 | 仅确认低置信度的结果，以加快交互速度。 |\n| N-best 与跳过列表 | 将未确认的结果添加到列表中，避免要求用户两次确认同一个错误结果。\
  \ |\n| 概率 | 当一个不常见的词经常被误识别为更常见的词时，改进识别匹配。 |\n| 用户控制暂停 | 针对访问、订单或支付，允许用户有时间查找所需信息，而不会重置对话。\
  \ |\n| 超时时长 | 对于长数字串，允许在用户自然短暂停顿以分组数字时，有更长的静默时间。 |\n\n-   要成功进行语义解析，必须从正确的识别开始。\n\
  -   你无法控制用户对你的 VUI 说什么，但你可以引导他们，并通过在正确的时间提供正确的信息来帮助他们成功。与他们合作，而不是对抗——假设人们确实想与你的\
  \ VUI 交谈，并且会欣赏相关且不突兀的帮助。\n-   不同的平台提供不同的识别和语义解析信息。因此，你和你的整个团队了解在你的情况下设计和实现什么是可行的，这一点至关重要。\n\
  -   为了更接近人类能力的对话，请使用能够实现更精细响应的先进技术。例如多层置信度评分、N-best 列表和跳过列表。如果你无法获取这些所需的数据，你仍然可以使用更简单的技术创建更好的对话式交互，包括示例、上下文和用户指定的帮助、隐藏选项以及一步修正。表\
  \ 12-2 总结了我们涵盖的策略。\n\n脚注 1 2 3\n\n"
- "# 13. 选择策略以从沟通失误中恢复\n\n识别从来都不是完美的，即使使用当今令人惊叹的 ASR 技术也是如此。它的准确性也远未达到可以忽略因误识别或意图映射错误而偏离“快乐路径”的任何话语的程度。你已经了解了许多识别失败的原因：未覆盖用户所说的词汇或用户发音方式、干扰性的相似词汇、嘈杂的背景以及旁白，这些只是其中几个原因。或者突然有人更改了某个功能或添加了一个品牌产品名称，然后“砰”的一声！用户无法被识别，并感到沮丧。本章的全部内容就是通过为特定情境设计和实现最佳的恢复与退避方法，让对话重回正轨。\n\
  \n### 从什么中恢复？\n\n你竭尽全力，通过健壮的语法、良好的提示以及符合用户心智模型的设计来最大化识别性能。然而，事情还是偏离了轨道！为什么？你又是如何知道的？即使怀着最好的意图，沟通失败也总会发生。\n\
  \n当沟通失败时，你需要让对话重回正轨。这被称为错误处理或错误恢复。有些人不喜欢“错误”这个词，但它很常用——说起来容易，人们也知道你指的是什么。这并不意味着用户错了；而是意味着\
  \ VUI 需要解决某种情况。永远让 VUI 承担责任，而不是用户。指责，不好；信息，很好。即使某些错误在技术上是用户造成的——比如说了一个不完整的处方号，或者没有按照“应该”的方式发音——告诉用户他们做错了什么也毫无意义。此外，现在应该清楚的是，语音并非二元对立：你无法保证\
  \ VUI 没有过错。重点不在于指责任何人，而在于快速重新达成共同理解。\n\n例外才是常态——你的 VUI 成功的关键不仅在于快乐路径上的出色体验，更在于出现异常时会发生什么。优秀识别与糟糕识别的区别仅在于有多少人走上了错误路径；优秀设计与实现与糟糕设计与实现的区别则在于这些人能多快、多无痛地回到快乐路径上。\n\
  \n糟糕的性能会影响信任，进而影响未来的使用。一项关于用户对语音系统好恶的研究（第 1 章，图 1-1）完美地说明了这一点。对于“描述你理想语音助手的特质”和“你最不喜欢语音助手的哪些方面”这两个问题，排名前两位的回答是**获得正确结果**和**被理解**。“正确结果”的回答提到了正确的执行（正确的内容、信息或动作），以及在详细程度、相关性和确定性上与请求匹配的响应。“被理解”则包括识别所用的词汇、正确解析意图，以及尽可能少的重试需求。\n\
  \n来自语音前线\n\n一个金融语音应用以`您还需要另一个股票报价吗？`结束，用户回答`不`，结果却得到`“不”不是一个被识别的名称`。尝试说`退出`，结果却得到了埃克森美孚的报价。测试者不敢尝试说`再见`，生怕会“买”下什么东西！\n\
  \n\n\n#### 识别错误、意图映射错误或执行错误\n\n不同类型的错误之间存在明显且重要的区别：\n\n- 识别错误（未能听清正确的词语）\n- 意图映射错误（未能理解词语的含义）\n\
  - 执行错误（无法完成所请求的操作）\n\n识别失败可能是**无匹配**：用户所说的内容与语法覆盖范围中的任何内容都不匹配。如果是**无语音**，则意味着当 VUI\
  \ 期望听到语音时用户没有说话，或者 ASR 没有捕捉到任何听起来像语音的内容。如果输入可以是多模态输入——例如按键、打字或按键音（DTMF）——那么结果甚至可能是**无输入**。\n\
  \n你需要理解用户将请求映射到正确意图的心智模型，以便从一开始就最大限度地减少错误，并提供最有帮助的恢复策略。像 Alexa 和 Google 这样的家用助手传达了一种无处不在的感觉：家中不同设备中会传出相同名称的相同声音。但如果你在厨房设置了一个计时器，然后走到客厅，询问还剩多少时间，你会被告知没有设置计时器。这打破了大多数人的心智模型。如果你的\
  \ VUI 控制另一台设备的音量，用户的心智模型会在音量刻度（10 级还是 100 级？半级？从 0 还是 1 开始？）以及“调高一点”到底能增加多少音量方面存在差异。\n\
  \n你既要避免做出错误的执行，也要避免做出不恰当的回应，比如当用户要求听歌曲“Risingson”时，却回复“好的，这是‘House of the Rising\
  \ Sun’”。\n\n只需对措辞稍作改动，你就可以让用户了解 VUI 遇到困难的原因，这类似于你与人交谈时可能会做的事情。VUI 越清楚地说明为什么无法完成所请求的操作，它就显得越值得信赖、越智能，用户也越容易解决问题并再次尝试：\n\
  \n- **用户**    *播放我音乐库中的歌曲“Risingson”。*\n- ~ ~ ~ 识别失败 ~ ~ ~\n- **VUI**    *抱歉，我没听清。*\n\
  - **VUI**    *抱歉，您想听哪首歌？*\n- ~ ~ ~ 意图映射失败 ~ ~ ~\n- **VUI** *抱歉，我不知道那首歌。*\n- ~ ~\
  \ ~ 执行失败 ~ ~ ~\n- **VUI** *抱歉，我在您的音乐库中找不到“Risingson”。*\n- **VUI**    *抱歉，我无法在您的本地音乐库中搜索音乐。*\n\
  \n**成功技巧 13.1 覆盖 ≠ 处理 ≠ 执行**\n\n识别用户所说的内容与对其做出回应不是一回事。处理请求与执行请求不同。即使你无法执行请求，理解话语并以某种方式做出回应也比直接忽略（拒绝）要好，原因有几个。这是一个跟踪请求以便未来扩展的机会。即使你无法满足用户的需求，如果你能做出智能的回应，用户也会比被你忽略或无法理解时感到满意得多。这更智能，也更人性化。例如，如果用户说“给我的医生打电话”，你的回应选项包括：\n\
  \n- *我没听清。* → 意图未分配或未被识别\n- *我无法帮助拨打电话。* → 意图 + 确认\n- *我无法拨打电话，但号码是……* → 意图 + 处理\n\
  - `正在拨打安德森医生办公室的电话`…… → 意图 + 执行\n\n### 恢复策略\n\n你的指导原则是让 VUI 的恢复回应在上下文中尽可能清晰，以便重新提示尽可能成功。通过倾听人们在误解后如何试图让对话重回正轨，你可以学到很多关于恢复策略的知识。\n\
  \n**来自语音前线**\n\n我们观察了一位朋友试图从他的一台家用 VUI 助手中点播一首特定歌曲。在一次尝试导致播放了一个种子音乐电台而不是确切的歌曲后，他做了大多数聪明的\
  \ VUI 用户会做的事情：他重新措辞了他的请求。他假设自己说得不够具体，于是再次尝试，这次指定了每个槽位值的类型：*播放专辑《Mezzanine》中艺术家 Massive\
  \ Attack 的歌曲“Risingson”*。另一位语音设计师惊呼道：“他不应该那样说！”这让我们觉得很好笑。用户说的任何合理内容都必须由 VUI 来处理。用户指定的内容就是线索，表明什么对他们重要。不要忽略它。（他最终还是没有听到他的歌。）\n\
  \n\n\n#### 有意义的上下文提示\n\n> **戴夫** *请打开舱门*, 哈尔。……  \n> *你能听到我说话吗, 哈尔?*  \n> **哈尔**\
  \ *收到, 戴夫。我能听到。*  \n> **戴夫** *打开舱门, 哈尔。*  \n> **哈尔** *抱歉, 戴夫。恐怕我做不到。*  \n> **戴夫**\
  \ *出什么问题了?*  \n> **哈尔** *我想你和我一样清楚问题出在哪里。*  \n> ——《2001: 太空漫游》(1968); 斯坦利·库布里克,\
  \ 阿瑟·C·克拉克^(⁹²)\n\n《2001》中戴夫·鲍曼博士与 HAL 9000 计算机在发现号飞船上的著名对话，是 1968 年版的智能助手失控案例。良好的错误处理应当清晰简洁，在可能的情况下提供信息，并使用适合目标用户群体的措辞。不要指责他人：你的用户可能说错了什么，但那又怎样？你也可能识别或理解错误。你唯一的目标是回到正轨：快速让用户知道你无法回答问题或满足请求。HAL\
  \ 做到了这一点，但过于油滑且冗长。如果你确信自己的理解准确无误，可以接着简要说明无法回答的原因，并/或给用户提供相关建议。HAL 显然在这方面失败了。如果你不确定，就重新提示。并开始着手收集数据以进行调优（第\
  \ 17 章）。一个没有故障且乐于助人的 HAL 可能会这样回应：\n\n- **戴夫** *哈尔，请打开舱门。*\n- **哈尔** *抱歉。舱门离线了，但紧急气闸可用。*\n\
  \n根据上下文在语音用户界面中使用不同的恢复策略是个好主意。许多语音用户界面的默认恢复策略是：一个可选的错误提示前缀，后跟一条上下文相关的消息和重新提示。例如：*抱歉。您想什么时间来？*\
  \ 或 *我还是没听清。如果您需要时间找号码，请说“暂停”。*\n\n由于你的目标是清晰，重新提示通常比初始提示更详细。但并非必须如此：最简单的重新提示就是一个简短的前缀加上重复初始提示。有时这已经足够完美，尤其是在你预期问题不多的场景中。有时，你只需要一个音频提示音（第\
  \ 9 章）。\n\n在编写恢复提示时，遵循一些简单的指导原则可以避免一些不必要的问题。请记住，你是在为语音编写，所以要保持简洁！请看表 13-1。\n\n**表\
  \ 13-1** 语音恢复提示的措辞指导原则\n\n| | 避免 | 改用 |\n| --- | --- | --- |\n| **保持提示简洁** | *非常抱歉，我没听懂您说的话。*\
  \ | *抱歉。* |\n| **识别结果并非绝对确定** | *您说的号码……不正确。* | *我听到的号码……不匹配。* |\n| **请求语音输入** |\
  \ *提供……/输入……* | *请说……/请告诉我……* |\n| **无语音时触发麦克风** | *很抱歉。我不知道这个问题的答案。* | *(无)* |\n\
  | **回应语音输入** | *您说了……* | *我听到……* |\n| **在未追踪输入模态时回应输入** | *您说了……* | *那是……* |\n\n\
  永远不要责怪用户的一个重要原因是，你无法确定用户是否真的说错了什么，比如把六位数字说成了八位数字——识别器可能没有捕捉到缺失的数字。\n\n**成功秘诀 13.2\
  \ 不要过度道歉**\n\n如果你的错误提示以道歉前缀开头，不要过度使用。避免每次重新提示都以冗长的 *很抱歉，我没听懂* 或类似语句开头。这会浪费用户的时间，并显得生硬。但你确实需要向用户表明你知道自己在再次询问。简单的\
  \ *抱歉* 通常就足够了，甚至有时连这个都不需要。\n\n#### 递进式提示\n\n递进式提示是交互式语音应答系统中一种常见的错误恢复方法——这个概念同样适用于大多数场景和类型的语音用户界面。递进式提示背后的理念是，在简洁提示以加快对话速度与必要时提供更详细提示之间取得平衡。一种常见的方法是：一个简短的“重试-1”，然后升级为详细明确的“重试-2”：\n\
  \n- **语音用户界面** *您还有一次续药机会。需要我现在为您续药吗？*\n- **用户** *嗯……*\n- **语音用户界面** *需要我下单吗？*\n\
  - **用户** *等等。药什么时候能到？*\n- **语音用户界面** *我没听清。如果您想让我续订泼尼松，请说“是”。如果不想，请说“否”。*\n- *~\
  \ ~ ~*\n- **语音用户界面** *您可以添加、更新或删除一餐。您想做什么？*\n- **用户** *这是关于昨天的午餐。*\n- **语音用户界面**\
  \ *抱歉。请说“添加”、“更新”或“删除”。*\n- **用户** *你说的更新是什么意思？*\n- **语音用户界面** *要全新添加一餐，请说“添加”。要更改已添加餐食的内容，请说“更新”。如果您想重新开始或删除一餐，请说“删除”。*\n\
  \n任何一种重试类型前都可以加上一个可选的简短道歉，以匹配已知的重试原因，例如 *抱歉* 或 *我没听清*——但同样，要适可而止。\n\n注意到升级后的提示听起来更像是一种“生硬的”引导式对话？这是有意为之，以增加清晰度。这并不意味着你现在只接受提示中提到的选项——初始尝试和重试的覆盖范围应该相同。这意味着你足够了解用户的思维模型，能够很好地根据他们在失败时试图做的事情，判断出最可能的问题是什么。\n\
  \n**来自语音实战前线**\n\n对多个语音系统的错误提示进行数据分析表明，包含明确指示（如 *请说“是”或“否”*）实际上能显著降低超出覆盖范围率，有时甚至降低一半以上。清晰度始终应是你的目标，有时格外清晰是可以接受的。你只需要找到合适的平衡点：在容易混淆的地方需要额外的清晰度，比如在重试时，而不是在所有地方。否则会显得生硬并令人厌烦。\n\
  \n\n##### 升级提示的代码\n\n我们来看看如何实现升级提示。回想一下，当无法识别意图时，响应来自默认回退意图，该意图包含非常通用的回复，例如*我没听明白*。接下来，你将添加一个包含更具体信息以帮助用户的二级回退提示。此操作无需在\
  \ Dialogflow GUI 中进行；全部通过 webhook 完成：^(⁹³)\n\n1.  要实现升级提示，你需要为默认回退意图与当前和先前意图都相同的上下文创建一个自定义处理程序。你的处理程序还需要跟踪并检查对话中看到的最后一个非回退意图，因为这决定了升级提示的内容。幸运的是，你已经有一些现成的机制可以做到这一点，稍后你会看到。你需要对\
  \ webhook 进行两处修改：\n    1.  找到最后一个非回退意图。这将驱动升级提示的内容。\n    2.  实现一个处理程序，为上下文提供二级升级提示。\n\
