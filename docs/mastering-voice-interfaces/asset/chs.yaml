  | **是什么？** | 从亚马逊土耳其机器人（Amazon Mechanical Turk）、Figure Eight 及类似机构收集数据。每位参与者在某项任务或话题上提供反馈、回应或行为数据后，会获得少量报酬。更多关于调查的内容，请参阅第
  16 章和第 17 章。 |

  | **优点** | 成本低廉且快速。问题和任务可以精准定位到你感兴趣的特定主题。你可以指定参与者的数量和类型。能够从非常广泛的人群中获取大量有价值的信息。 |

