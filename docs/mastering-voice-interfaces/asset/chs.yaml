  \ 13-3）。\n\n```\ndef ar_enter_dob_escalating_nomatch(df_request,\ndf_response):\n\
  \"\"\"\n用于 arEnterDOB 的升级 nomatch 提示\n\"\"\"\ndf_response.output_text = ('抱歉，我仍然没有理解。'\n\
  '请以月、日、年的格式提供您的出生日期。'\n'例如，说：'\n'2001 年 3 月 3 日。')\n清单 13-3\n用于 arEnterDOB 的升级 nomatch\
  \ 提示处理程序。\n```\n\n测试一下：连续说*出生日期*，然后说两个无意义的短语。作为对第一个无意义短语的响应，你应该会听到一个标准的默认回退短语，例如*抱歉，我没听明白*。对第二个\
  \ nomatch 的响应应该是你刚刚添加的升级提示。\n\n#### 渐缩提示\n\n**渐缩**指的是在较长的提示中逐渐缩短措辞。这在提供选项列表时使用，尤其是在涉及其他模式（如点击或输入数字选项）时。同样，其目的是在清晰度和简洁性之间取得平衡。渐缩可用于初始提示或重试提示。\n\
  \n例如，*要续药，请按 1。查询订单状态，请按 2。更改地址，请按 3。添加受抚养人，请按 4。保单信息，请按 5*。随着模式的建立，每个选项的说明逐渐变短。渐缩在纯语音上下文中使用较少，因为它在简洁性方面节省甚微，同时可能增加混淆。\n\
  \n\n\n#### 快速重提示\n\n当你因为没听清或没理解说话者而说“你刚才说什么？”或“嗯？”时，这就是**快速重提示**。快速重提示背后的理念是，提示语非常简短自然，因此期望得到的是对请求或回复更自然、更清晰的重复。快速重提示存在潜在问题。用户很可能会再次重复同样的话，只是声音更大——这通常是人们在对话中的典型反应。这意味着，如果第一次的表述超出语境（OOC），那么第二次依然如此。如果用户实际上什么都没说，但语音用户界面（VUI）却触发了，这也会带来奇怪的体验。快速重提示无法明确说明是表述未被理解，还是声音不够大而未被听到（图\
  \ 13-1）。\n\n![../images/507213_1_En_13_Chapter/507213_1_En_13_Fig1_HTML.png](img/507213_1_En_13_Fig1_HTML.png)\n\
  \n图 13-1\n\n快速重提示通常会导致用户重复同样的表述，但声音更大\n\n有些快速重提示比其他更容易成功。如果你的实现能够区分“没听到”（无语音超时）和“没理解”（识别拒绝），那么你确实可以为不同情况设置不同的响应，从而实现出色的自然对话。避免使用独立的通用重提示，例如*请再说一遍？*或*抱歉？*或*你能重复一下吗？*。尤其不要使用最后一种——你肯定不希望有人重复超出语境的内容！通用提示可能易于快速实现，但使用上下文相关的重提示成功率更高：*那个处方号码是多少来着？*或*预约什么时间？*或*你想给谁打电话？*简洁固然好，但清晰是必须的。这向用户表明你们拥有共同的心理模型。\n\
  \n#### 降级策略\n\n如果你的 VUI 无法理解用户，尤其是在提出开放式问题时，请降级到更直接的对话。这没问题。更直接的对话本身并无不妥。它仍然自然且具有对话性；只是明确了期望的回应是什么。人们也会使用同样的策略，那么你的\
  \ VUI 为什么不能呢？当前目标是让对话重回正轨。重要的是，降级到直接提示并不意味着你剥夺了用户像之前你无法理解他们时那样自然说话的能力。你只是改变了提示方式以澄清问题；底层能力保持不变：\n\
  \n*   **用户**    *我早上服用泼尼松……不，晚上……一片。*\n\n*   **VUI**    *抱歉，你是在早上、白天还是晚上服用泼尼松？*\
  \  ← 直接提示\n\n*   **用户**    *是的，10 毫克，通常在睡前服用*  ← 多槽位\n\n*   ~ ~ ~ 使用与**直接**重提示绑定的**严格语法**\
  \ ~ ~ ~\n\n*   ~ ~ ~ **VUI1**    *抱歉，我没听清。请说早上、白天或晚上。*\n\n*   ~ ~ ~ 使用处理**多槽位**响应的**开放语法**\
  \ ~ ~ ~\n\n*   ~ ~ ~ **VUI2**    *我已将泼尼松，10 毫克，晚上，添加到您的药物列表中。*\n\n对于问答型 VUI，一个重要的降级策略是回应用户问题时，给出更宽泛、更不具体的答案。你在第\
  \ 11 章中见过这种情况：VUI 无法识别“我今天能吃粘高良姜饭吗？”中的菜肴，但知道“米饭”。因此，与其拒绝问题，不如回答*我没听说过这个，但大多数米饭类菜肴在您手术前都不能吃*，这提供了更好的体验。\n\
  \n还有许多其他降级方法：\n\n*   **不做任何操作**：关闭麦克风，停止监听，进入空闲状态。这在唤醒词被误触发时很常见。\n\n*   **忽略重提示中的“错误属性”**：表现得好像这不是一个错误，不明确指出。不道歉，也不明确要求重试。相反，用额外的细节作为示例或明确选项进行跟进。这种渐进式提示在用户不知道如何回应的自由形式开放性问题中特别有用：\n\
  \n**用户**    *我还能吃鸡肉吗？*\n\n**VUI**    *哪种鸡肉？*\n\n**用户**    *嗯，那种有两条腿的笨鸡？*\n\n**VUI**    *例如炸鸡、猎人炖鸡，甚至鸡肉三明治。描述一下你想问的那种鸡肉。*\n\
  \n*   **自动提供下一个 N-best 候选项**：如果用户否定了 N(1)，并且你将其放入跳过列表，难道不能直接询问 N(2) 是否正确吗？如果只有两个选项，这可以奏效。但如果可能性更多，请小心。对话可能会变得令人不安，听起来像是\
  \ VUI 在猜测。在下一个例子中，识别“一位”失败，导致 N-best 结果先是“9”，然后是“1”：\n\n**用户**    *一张桌子，一位。* ← 数字识别错误\n\
  \n**VUI**    *九位客人，对吗？* ← N(1) = “9”\n\n**用户**    *不对！* ← 将“9”放入跳过列表\n\n**VUI**    *抱歉，那是一位客人，对吗？*\
  \ ← N(2) = “1”\n\n**用户**    *是的（呼）。*\n    *   你可以对意图使用跳过列表，以避免再次给出相同答案。如果用户在第一次提问后立即用不同的措辞再次提出相同问题，很可能你第一次没有回答他们的问题。\n\
  \n*   **基于置信度分数的分层重试方法**：如果你能获取识别置信度分数，就可以通过针对不同置信度级别使用不同的错误处理方法，来创建复杂的对话。例如，在多步骤金融交互中，你可以在最终整体确认之前，仅确认置信度较低的结果。同时跟踪对话早期已确认的实体。然后，你可以结合分数和已知确认信息，将后续的错误处理集中在那些你不太确定的实体上。\n\
  \n在第 12 章中，你从概念上学习了如何使用置信度和/或 N-best 列表来创建智能对话以减少错误——Dialogflow 无法可靠地提供置信度分数或 N-best\
  \ 列表的访问权限，不过 Google Cloud Speech-to-Text API 可以。\n\n##### 多模态角落\n\n如果你的 VUI 是多模态的，**提供另一种模态**用于重试。这是交互式语音应答（IVR）中的常见方法，当语音失败时，鼓励使用按键输入。当有键盘时指出打字选项，有按钮时指出点击选项。不要移除语音选项；让用户决定哪种方式最适合他们的情况。你可以在所有重试中使用相同的方法，同时在所有初始提示中保持语音，或者如果用户遇到更广泛的困难，你可以提议完全切换到另一种模态。在药物名称对话中，除了*请说早上、白天或晚上*之外，你还可以在屏幕上显示三个按钮，分别标有“早上”、“白天”和“晚上”。同时提供两者可以强化任一模态中的选项；任何内容词都需要跨模态匹配。如果语音提示的完整文本出现在屏幕上，它需要逐字匹配——即使是非内容词的不匹配也会增加认知负荷。我们发现，当内容词单独出现在屏幕上，或者出现在高度修改的（与语音提示相比）短句中时，跨模态强化效果最强。\n\
  \n\n\n#### 何时停止尝试\n\n你控制重试次数以及重试用词或方法的能力取决于平台和设备。你需要根据具体情境和任务选择合适的重试次数。对于代价高昂的任务，例如健康或财务相关、隐私或安全相关，或者当对话的后续部分依赖于获取正确信息时，你的\
  \ VUI 应该更加努力地尝试。大多数家用语音助手要么不进行重试，要么在对话需要继续或完成某个请求而必须获取某些信息时，仅尝试一次。当需要用户回应才能继续时，许多\
  \ IVR 系统会尝试两次重试，总计最多三次（1 次初始询问 + 2 次重试）；之后，呼叫者会被转接至客服，或采取其他措施以推动任务完成。\n\n三次尝试已经很多了。IVR\
  \ 系统之所以倾向于“更加努力地尝试”，恰恰是因为对话通常是多轮次的，需要填充槽位以完成交易。在这种情况下进行一些重试是合适的，因为直接终止对话并忘记呼叫者所说的一切既粗鲁又令人恼火。另一方面，绝不要强迫呼叫者不断尝试。有时，企业会通过设置极高的重试次数，在将呼叫者转接给真人客服之前，试图将呼叫者留在\
  \ IVR 系统中。这除了惹恼呼叫者、给该企业乃至整个 IVR 行业带来负面口碑之外，毫无意义。\n\n###### 来自一线语音实践\n\nNuance 公司对不同领域众多语音\
  \ IVR 系统的错误处理成功率进行了一项比较研究，结果表明，对特定提示或对话状态进行一次重试是有益的，但第二次重试平均只能带来不到 5%的成功率提升。与此同时，面临第二次重试的用户中有一半失败了，要么是因为系统仍然无法理解他们，要么是因为他们干脆放弃了。其他地方的类似数据分析也得出了相同的结论。理解这个重要的权衡点至关重要：始终问自己，某个任务是否真的有必要多次询问用户，或者你是否可以通过做出“最佳猜测”假设，或使用本章中介绍的其他技术来推动对话向前发展。\n\
  \n### 最大错误次数\n\n一些 VUI 会为整个对话交互设置错误计数，这通常是对每个特定对话状态错误计数的补充。当最大错误范围是整个对话时，意味着即使某个用户（无论出于何种原因）在每个槽位或步骤上都需要多次尝试，交互仍然可以继续进行。\n\
  \n一旦达到最大错误次数，VUI 的行为就会改变，其假设是用户由于某种特定原因（例如背景噪音或口音较重）整体上遇到了困难。典型的行为变化包括：切换到更直接的对话、提供额外帮助或转接、或鼓励使用其他输入方式（如果可行的话），例如使用键盘输入数字。请注意，改变交互方式可能会让用户感到困惑和恼火。一些金融语音系统在达到最大错误次数后会自动从语音输入切换到按键音输入。这确实对部分用户有帮助，但绝非对所有人都好——有些\
  \ VUI 甚至会询问用户：“*我们似乎沟通不畅。如果您想切换到按键音模式，请按 1*……” 如果你切换了输入模式，请明确告知用户正在发生什么，并继续允许使用之前的方法。\n\
  \n请记住在对话结束后重置错误计数器。这里的“结束”指的是在短时间内成功到达对话的终点。\n\n#### 追踪最大错误次数的代码\n\n你可以通过 webhook\
  \ 来实现最大错误计数器。你需要做以下几件事：\n\n-   稍微修改用于追踪意图的输出上下文格式。目前，上下文的名称是 `intent_INTENT`，其中\
  \ `INTENT` 代表意图的名称。到目前为止这运行良好，但如果你有多个同名的意图会发生什么？它只会覆盖前一个。如果你想计数并追踪错误次数，这显然行不通。你需要向意图名称添加一个时间戳，以确保每个意图都有一个独立的上下文。\n\
  \n-   统计一个时间窗口内的错误次数。这里，我们将使用 30 秒，但这个时长可能并非适用于所有情况。当你拥有真实的用户数据来调整系统性能时（第 16 章和第\
  \ 17 章），你需要重新评估这个值。\n\n-   为达到时间窗口内允许的最大错误次数这一条件添加不同的行为。为了说明如何实现，我们使用 max = 3，但通常一个更小的数字更为合适。\n\
  \n清单 13-4 和 13-5 展示了在输出上下文中包含时间戳所需的更改。^(⁹⁴) 第一步是修改 `new_context` 函数（清单 13-4）。现在在函数开始时获取当前时间，因为稍后会用到它（A）。如果名称是针对意图上下文的，则添加时间戳的整数部分（秒）（B）。如果是意图上下文，则延长其生命周期以便追踪（C）。使用在函数开始时设置的当前时间（D）。\n\
  \n```\ndef new_context(name):\n\"\"\"\n返回一个具有给定名称的新输出上下文。\n\"\"\"\ntime_now = time.time()\
  \  # A\nlifespan_count = 5\n# 如果是意图上下文，则添加时间戳。\nif name.startswith('intent'):\n\
  name = re.sub('^intent_', 'intent_%s_' % int(time_now), name)  # B\nlifespan_count\
  \ = 50  # C\n# 完整的上下文名称很长；\"callbyname\" 只是最后一部分。\ncontext = {\n'name': (\"projects/${PROJECT_ID}/agent/sessions/\"\
  \nf\"${{SESSION_ID}}/contexts/{name}\"),\n'lifespanCount': lifespan_count,\n# 添加时间以查找最近的上下文\n\
