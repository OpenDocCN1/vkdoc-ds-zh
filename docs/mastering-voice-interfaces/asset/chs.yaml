  I had $FOOD1, $FOOD2, and DRINK>` | 所有必要信息被收集并添加到他们的食物日记中。 |


  接下来，是时候定义成功的任务完成了。思考你的语音应用需要哪些信息来满足每个意图。答案就是槽位。一个餐厅预订请求必须填充三个槽位：`TIME`、`DAY`和`GUESTS`的数量。在准备应用中，大多数意图只需要填充一个槽位，但食物日记可能需要填充多个槽位，每个食物和饮料项目各一个。对于联系护理团队成员，可能是一个槽位（要联系的人）或两个（人加上哪个电话，如果有多个）。表
  4-7 中的信息将作为你本章后面高级 VUI 对话流程的输入。


  利用这些信息以及你在发现过程中收集的其他信息，来草拟对话流程，以便在后续设计中扩展。图 4-2 展示了这个手术准备 VUI 的最高级别语音对话流程的样子。此时，每个意图只是一个没有细节的方框。你将在下一章开始扩展这些细节。


