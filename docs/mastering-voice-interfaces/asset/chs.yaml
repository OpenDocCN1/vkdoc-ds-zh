  \ 17-3）。 |\n\n#### 报告与使用调优结果\n\n一些平台提供内置报告功能；其他平台则没有。无论你的情况如何，请为你的基线设置报告，并在后续工作中使用相同的报告。你的报告应包括：一份突出关键性能发现的简要执行摘要；附带分析和改进建议的详细结果；以及与业务目标达成情况相关的任何数据，例如自动化和流失率。`Dialogflow`（在撰写本文时）提供了一些开箱即用的报告功能：\n\
  \n*   通过`历史记录`链接，你可以查看对话历史；在这些对话中，你可以看到哪些交互返回了意图，哪些没有（首次在第 7 章讨论）。\n*   通过`分析`链接，你可以：\n\
  \    *   查找意图的详细信息，包括该意图发起的会话数以及从该意图退出对话的次数。\n    *   查看会话流程，例如用户在触发各种意图后的下一步操作，包括退出对话。\n\
  \n这是了解应用程序运行状况的一个极好起点。你可能会发现的其他功能，尤其是在企业级报告和分析工具中，包括：\n\n*   关键指标随时间变化的细分，例如关键任务的完成情况，提供纵向应用性能的感知。\n\
  *   按用户类型筛选。VUI 通常对某些人群效果更好——你需要在专注于狭窄的核心人群和为所有人提供功能之间取得平衡。\n\n调优报告中包含的典型量化指标包括：识别准确率、任务完成率、意图或路由准确率，以及（如果适用）身份验证成功率。务必包含对所做改进的重点讨论，以及与之前任何调优轮次的量化比较。IVR\
  \ 调优报告通常还包括整体通话自动化率、通话时长和转接率。如果可用，还应包括新用户和现有用户留存率的数据。\n\n我们在本章中介绍了不同的调优类型；我们强烈建议你永远不要孤立地进行调优。所有你能测量和观察到的东西，都应在所有收集数据的背景下，并基于对设计和开发工作的理解，进行分析、优先级排序和处理。一个好的方法是标记性能日志中出现的任何问题区域，并在定性可用性测试和针对性话语分析中寻找相关数据，反之亦然。当定量日志分析显示问题有多普遍时，对话语和对话轮次行为的定性深入分析会提供关于问题性质的信息，帮助你应用正确的解决方案。邀请你的整个团队为测试和调优做出贡献——结果会影响每个人：\n\
  \n*   收集来自所有团队代表的关切、信念和期望。\n*   设定期望，并解释为什么以某种方式做事。\n*   在适当且可能的情况下，设置录音设施和实时观察。\n\
  *   建立一个工作流程。\n    *   安排数据收集、隐私措施和转录服务。\n    *   来自不同来源的数据需要为所有调优工作提供信息。\n*   确定分享发现的最佳方式：使其易于理解且信息丰富。\n\
  \n**成功秘诀 17.4 警惕披着定量外衣的定性分析**\n\n大多数小型研究，包括可用性测试研究，通常会提供一些定量结果。部分原因是，说明某事发生的频率是有意义的。部分原因是人们喜欢量化一切。这似乎在某种程度上使结果更真实、更确定。而且大多数人喜欢确定性。然而，要注意不要将十几个受试者的结果转化为用于支持或反对某事的百分比。在这种情况下，最好淡化数字。例如，“十二人中有五人评论了确认提示的长度”，随后附上相关的逐字评论。\n\
  \n### 如何最大化部署成功\n\n你现在知道，一旦部署完成，你的工作并未结束。我们假定你已经应用了所学的一切来实现卓越的设计，并且进行了彻底的测试。但总有改进的空间！第一步是为此做好计划。第二步是以适当的紧迫感和正确的解决方案来应对问题。让我们看看如何在这两方面取得成功。\n\
  \n\n\n#### 把握调优时机\n\n由于可能出错的地方很多，且问题会相互影响，因此需要进行多轮调优。任务越重要，调优轮次就应越频繁和/或越彻底。企业级语音系统通常从小规模开始，经过测试版和试点发布，用户群体不断扩大。\n\
  \n随后，应在早期部署阶段尽快进行一到两轮深度调优，之后进行“快照式”调优，并每季度或更长时间安排一次定期调优。这通常取决于整体参与度、任务的难度或新颖性，以及后续阶段是否增加新功能：\n\
  \n-   分阶段发布始终是个好主意。在每轮数据收集（包括试点、内测和公测）之后，至少进行最低限度的分析和调优。\n-   在系统首次对外部署时进行调优。这是调优最关键的时期。你拥有了真实用户数据，并且全世界的目光——以及耳朵！——都聚焦在你的\
  \ VUI 上。专注于快速更新，尤其是那些你部署前遗漏的、对用户满意度至关重要的内容。不要等待：如果识别调优比其他类型的调优更快——通常如此——那就先完成一轮识别调优并实施更改，而不是等待更全面的调优轮次。\n\
  -   在任何新事件（例如系统任何部分的功能变更或重新设计）发生后，衡量性能并规划可能的调优。有针对性的抽查式调优轮次效果很好，尤其是在你凭经验判断可能出问题的领域。\n\
  -   问题常常会在系统各部分之间渗透。不要将后续的调优轮次仅限于最近修改过的系统区域。也不要将调优局限于只关注你的成功标准——这些标准可能直接决定付款和未来合同，但其他发现可以告诉你如何在未来构建更成功的\
  \ VUI。\n-   在新增用户群体后，或在你已知的任何系统外部变更发生后进行调优。\n-   如果 A/B 测试可行，那么尽早为此奠定基础永远不嫌早。\n\
  -   商定定期的调优间隔。确保所有需要参与调优工作的人员都知道何时安排了调优。这可以包括收集和处理数据、为隐私清洗数据、获取转录文本、进行分析和调优工作，以及在将更改投入生产前进行重新测试所需的时间。\n\
  -   监控行为上的质变，包括直接向你投诉或在在线论坛和产品评论中间接投诉的增加。对你所报告的问题进行有依据的分析，要知道普通用户会告诉你他们遇到问题的体验，但可能无法正确归因。这些投诉仍然有效；不要忽视它们，也不要通过引导用户查看一些通用的\
  \ FAQ 来敷衍他们。\n-   创建自动化性能测试，以提供持续监控，并在任何性能指标发生突变时向你发出警报。重点关注高流量区域以及系统其他对话所依赖的部分，例如身份识别和认证。\n\
  -   你可能在家用语音助手上遇到过这种情况：突然之间，它们不那么理解你了。\n\n你之前多次成功说出的指令现在不奏效了。这实际上可能发生在核心识别器或语言模型更新之后。新版本已经根据新的语音数据进行了调优，这意味着它最终会对更广泛的用户群体效果更好，但最初对于早期用户群体来说，其表现也会有所不同。较小的用户群体现在为了整体利益而受到较少优待。希望随着时间的推移，每个人都能受益，情况通常也是如此。\n\
  \n#### 理解调优的复杂性以避免陷阱\n\n调优需要训练和经验，才能在最佳条件下做好。许多因素使得做好调优更加困难。以下是一些因素：\n\n-   有时，选定的成功指标无法访问或无法准确衡量，或者你无法更改需要改进性能的部分。\n\
  -   连接的外部系统发生了变化；直到你注意到性能变差，你才知道发生了变化。\n\n如果你依赖任何系统外部数据库，请设置自动化的无监督测试，以便在发生变化时向你发出警报。如果你在大型组织中的系统上工作，请从第一天起就设法保持联系。一些涉及最少\
  \ GUI 工作的更改可能会深刻影响 VUI 性能。例如，一个新的季节性产品名称需要被正确发音、识别和履行，并且不能轻易与其他产品名称或命令混淆。账单报表上的微小布局更改可能会影响分步说明的对话流程，或导致用户困惑，表现为无语音超时或`help`请求。\n\
  \n-   你进行更新的频率或速度受到限制。\n-   在某些企业产品环境中，即使是修改单个提示这样的简单更改也可能需要数周时间，因为它需要适应整体的测试阶段和计划更新。\n\
  -   发布后的使用率很低，因此数据缓慢地、逐渐地流入，而这恰恰是调优最紧迫的时候。\n-   无论如何，尽快收集数据并进行调优，但要注意不要过度拟合不具有代表性的数据。\n\
  -   你无法在将调优更改投入生产之前进行任何离线调优来测试它们。\n-   你无法访问系统中存在性能问题的部分或相关话语：\n    -   除非你自己完成大部分流程或拥有企业工具访问权限，否则你的数据访问将受到限制。如果你无法访问“原始”话语数据（包括实际的音频文件），你就不知道实际发生了什么。用户到底说了什么？措辞是否在你的语法覆盖范围内？他们咳嗽了还是以意想不到的方式发音了？是否有噪音或其他人同时说话？如果你无法从大量真实用户那里获取这些信息，你或许至少可以从一小群用户那里收集数据。是否有一群已注册成为早期测试者的人，你可以从他们那里收集数据？调查一下在你的特定环境中可能实现什么。\n\
  -   你被要求提供一份“用户可以说的一切”的列表：\n    -   这是产品负责人或需要撰写公关文案或使用说明的人提出的一个可以理解的请求，但这并非一个合理的请求。即使是最小的交互，其“覆盖范围”内的完整列表也会有数千甚至数百万条话语。此外，除非你处理的是基于规则的语法，否则你甚至无法提供这样的列表。而且，即使一个短语在语法范围内，也无法保证它每次被说出时都能按计划被识别和解释。相反，应提供该解释，以及一组原型话语和每个意图的预期结果。\n\
  \n\n\n##### 来自语音一线的经验\n\n有人对备受关注的异常情况（过度）反应：\n- 在我们参与过的不少项目中都发生过这种情况。某位高级副总裁抱怨自己没有被识别出来。还有一个案例中，一位客户利益相关者抱怨说，他母亲在美发店吹干头发时打电话给语音系统，系统却没有识别出她！你需要避免针对少数异常观测值进行调整。请记住，语音系统本质上是在寻找统计上的最佳匹配。即使可以调整以偏向某个人或特定环境，那也会以牺牲全体用户为代价。相反，要从第一天起就对所有人进行教育，不要过度承诺，并将这些轶事案例作为进一步研究的素材。如果这是一个可以解决且能带来整体益处的模式，那么就将其纳入。\n\
  \n分析和调优任务由一个独立于产品/项目设计和开发团队的专业团队处理：\n- 我们见过一些善意的、训练有素的分析师遗漏问题或提出次优解决方案，因为他们只是被临时请来一周，而不是一直作为团队的一部分。他们无法看到长期团队所熟悉的全局或细节。相比之下，我们最成功的调优项目都涉及设计和语音科学在整个过程中的协作，以及领域专家（SME）的参与。领域专家包括健康应用的医务人员和各个领域的资深呼叫中心座席。他们不仅了解技术术语和官方发音，更重要的是，他们知道“普通人”在发音或描述时会遇到哪些困难，因此能够捕捉到其他人可能会遗漏的指代。请务必用相关的调优发现来更新你的标注指南（第\
  \ 11 章）。\n\n用户语音数据安全：\n- 加密磁盘和安全服务器是基本要求。常见的做法还包括从常规日志中擦除某些信息，或者分离日志，使得在调优期间无法将识别信息与身份验证令牌关联起来。尽管最近有安全方面的担忧，但保护收集到的语音数据安全是可行的；这种做法已经持续了几十年。尽你的一份力——从这些数据中学到的东西完全值得你付出额外的努力，并且最终每个人都会受益。\n\
  \n我们两人共同参与过超过 100 个语音项目和产品，范围从非常简单到处理每天数万通电话的复杂大型系统，服务于非常大的客户。\n\n我们通常能够向客户解释，我们希望在全量投产之前，先进行一个或有时两个阶段的应用试点。有时我们会遇到阻力，但最终我们能够争取到分阶段上线。但也存在这样的情况，要么是因为客户的要求（“你们以前没做过吗？难道你们不知道确切会发生什么吗？”），要么是因为绝对不可动摇的时间限制，整个系统必须在第一天就从\
  \ 0%直接上线到 100%，并且数周内无法进行任何更新。如果你的目标是出色的用户体验、客户收益以及你自己的理智，我们不推荐这样做。总会有新情况出现；我们可以肯定地说，从未出现过评估后完全不需要任何应用更新的情况。在这种情况下，我们通常的做法是建立一个能够进行快速评估/更新的机制，这样即使我们已经是\
  \ 100%上线，也能快速完成变更，有时甚至在几天内。客户也必须为此做好准备。\n\n还有另一个教训：是的，我们以前做过，不，我们仍然无法确切知道会发生什么——即使有扎实的需求和具备过往语音项目经验的客户。每一次语音实现都是不同的——用户不同，期望也不同。这是一件值得牢记的好事。\n\
  \n### 下一步是什么？\n\n读完本章后，关于性能问题的成因以及如何修复它们，你比大多数构建 VUI 的人了解得要多得多。真的。即使你无法修复所有问题，这些知识也能帮助你找到变通方法，并在他人提出解决方案的讨论中做出贡献。\n\
  \n这是我们这本书的最后一章！我们塞进了大量信息——感谢你一直陪伴我们！下一步就是走出去，构建出色的 VUI，那些你自己都愿意与之交谈的 VUI。\n\n最后，我们将用一些来自语音行业资深人士、语音技术使用者或\
  \ VUI 开发支持人员的智慧箴言作为结尾。以下是他们对*“你能给那些希望成功构建语音交互的人什么建议？”*这个问题的几个回答：\n\n- “我听到了开发团队的担忧。用户体验团队怎么说？如果他们基于理由说‘这样做’，那么除非在技术层面我们无法在产品开发范围内实现，否则我们就会照做。”\n\
  - “语音已经成为当下最热门的东西。这意味着张三李四阿猫阿狗都冒出来提供他们的意见和服务。在相信任何人的话之前，先弄清楚他们自己具体做过哪些语音方面的工作。如果他们承诺能让你的一切都变得简单，那说明他们自己根本没做过。”\n\
  - “少承诺，多交付。最小可行产品（MVP）和 80/20 法则（帕累托原则）可能并不像你习惯的那样适用。你不能告诉人们不要提出那些基于你的 VUI 功能来说是合理的要求。限制上线范围的方法是设置一张大网，在源头捕获大多数请求。说‘抱歉，我暂时还无法帮你解决这个问题’；然后逐步完善细节。”\n\
  - “口语是特殊的；你不能把它当作任何其他数据集来对待。要在语音方面取得成功，你需要倾听、理解并沟通。”\n- “如果你期望别人使用语音，那它就不是你可以随便玩玩的东西。决定你是想（并且能够）成为语音领域的创新者还是追随者。成功完成所有自己的语音设计和开发是一项严肃的承诺——你需要把一切都做对。做一个追随者并无害处，特别是当你的专长在另一个领域，比如硬件或领域内容时。专注于你擅长的领域，并遵循专家的建议。”\n\
  - “如果我说的话系统听不懂，我就不会用它。我真希望能告诉所有语音开发者，在上线之前要测试、测试、再测试。”\n- “语音和自然语言理解太酷了。当它起作用时，就像魔法一样。当人们体验到这一点时，他们就会更想使用它，并用它来做更复杂的事情。让我们帮助他们实现这一点！☺\
  \ 我们都会从中受益。”\n\n### 总结\n\n- 语音整体成功的最佳途径是不要过度承诺。专注于调优，以构建性能出色的稳健系统；如果用户成功，他们就更愿意继续使用\
  \ VUI 并尝试新事物。\n- 定量和定性的调优与分析结果在协作进行时能提供最深刻的洞察。捕捉问题和改进想法。分析用户行为和用户评论。它们并不总是一致，但都能提供见解。\n\
  - 了解你能调优什么，不能调优什么。不同平台可用的功能不同，并且不断变化。\n- 建立你可以衡量的、并且对你语音系统所定义的成功有意义的指标基线。如果你有成功指标，请确保它们可以被衡量。\n\
  - 离线测试你的调优更改。\n- 如果不审视所有类别的指标并考虑对话的完整图景，通常很难找到确切原因并应用适当的解决方案。\n\n\n\n## 脚注\n\n##\
