  time_all\"] = context_time\n# 设置最后一个不可跳过的意图：无通用意图或回退意图\nif (context_time > df_request.most_recent_intent['time']\
  \ and\nnot is_skippable_universal(match2.group(1))):\ndf_request.most_recent_intent[\"\
  name\"] = match2.group(1)\ndf_request.most_recent_intent[\"time\"] = context_time\n\
  # 设置最后一个非回退意图，用于升级提示。\nif (context_time >\ndf_request.most_recent_intent['time_non_fallback']\
