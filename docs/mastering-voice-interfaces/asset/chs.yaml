  \ HTTP 500 错误（服务器不可用）。\n- **Dialogflow 响应：** 来自 Dialogflow 的最终响应，包括回传给用户的响应。\n\n\
  准备使用 Python 从运维套件中拉取日志。\n\n- 安装 `google-cloud-logging` Python SDK。具体安装方式取决于你使用的操作系统。^(¹¹⁶)\
  \ 在我们的 Python 示例中，我们将 `google-cloud-logging` 添加到了 `requirements.txt` 文件中。要更新，你需要重新运行\
  \ `pip install -r requirements.txt`。\n- 在你的 Google Cloud 项目中创建一个服务账号。不要忘记添加 **项目所有者**\
  \ 角色：\n  - 例如，你可以点击 Google Cloud 控制台左上角的菜单，然后选择 **IAM 与管理** ➤ **服务账号** ➤ **创建服务账号**。\n\
  \n\n\n*   创建一个 `.json` 密钥并将其存储在本地。此过程在同一 Google 网页上也有说明。\n*   设置服务账号 `.json` 密钥的路径，该网页上也有说明。在我们的案例中，我们运行了\
  \ `export GOOGLE_APPLICATION_CREDENTIALS=<上一步中的 json 密钥文件名>`。\n\n现在，您已准备好拉取大量日志。本章的\
  \ webhook 代码中包含一个 Python 脚本 `get_logs.py`。此脚本会逐步遍历存储在 Google Cloud 中的四种日志类型；当它发现调优所需的信息时，就会将其提取出来。在检测到新的交互（基于第一条日志的新的\
  \ Dialogflow 请求）后，它会将上一次交互的信息打印在一行上。在终端中，运行\n\n```\npython get_logs.py > logs.txt\n\
  ```\n\n下一步取决于您是否拥有电子表格软件（如 Microsoft Excel、OpenOffice 或 Mac 上的 Numbers）。这是可选的，但正如我们稍后将讨论的，我们发现使用某种具有强大筛选功能的电子表格软件可以使调优和标注变得容易得多。我们将使用\
  \ Excel 进行演示——不同电子表格软件的具体操作会有所不同，但您显然可以使用其他软件：\n\n![../images/507213_1_En_17_Chapter/507213_1_En_17_Fig3_HTML.png](img/507213_1_En_17_Fig3_HTML.png)\n\
  \n图 17-3\n\n包含 `log.txt` 中内容、可供调优的 Microsoft Excel 电子表格\n\n1.  在新的 Excel 工作簿中，点击工作簿顶部的“数据”菜单栏。\n\
  2.  您应该会看到一个名为“自文本/CSV”的选项。点击它。\n3.  选择上一节中 `log.txt` 文件的位置。\n4.  选择“分隔符”，并确保选择“制表符”作为分隔符。\n\
  5.  完成导入。电子表格应如图 17-3 所示。保存它！\n\n这个电子表格看起来很像您在第 16 章中看到的那个，它指出了调优所需的数据类型。我们仍然添加了这一列，以强调当数据可用时您会需要它——并且在某些平台中您会拥有它。\n\
  \n这引出了一个重要观点：整个这一节都假设您正在使用 Dialogflow 和 Google Cloud。当然，还有其他选择，包括使用独立的 STT API，例如\
  \ Google、Microsoft 或 IBM 的 API。在这些情况下，您需要自己处理日志记录。您可能仍然可以使用运维套件来记录事务，但您需要修改 `get_logs.py`\
  \ 脚本。\n\n您可能会好奇为什么 `log.txt` 使用制表符分隔字段，而不是像许多设计用于导入 Excel 等应用程序的文本文件那样使用逗号分隔。很简单，如果您的实际数据字段中出现了逗号，您就不能使用\
  \ `.csv` 格式；它会搞乱一切。参数和应用程序响应中都可能包含逗号，因此您需要使用制表符。\n\n#### 任务完成调优\n\n任务完成分析提供了补充识别性能的信息。有多少用户能够到达对话的成功终点，填写所有必要的槽位并获得适当的响应？您很清楚什么是成功终点：预订结束时的确认提示、请求后灯亮起、设置计时器后倒计时开始等等。任务完成分析从更高层次或更全面的角度审视\
  \ VUI 行为。可以将识别分析视为静态快照，而任务完成和对话调优则更像视频：识别调优侧重于提高特定语法中话语的性能，但掩盖了对话并非孤立无上下文的话语这一事实；任务和对话调优则将性能置于整个对话的上下文中，或者至少是前后步骤所发生事件的上下文中。这意味着跟踪每个用户的行为非常重要。\n\
  \n任务完成调优涉及识别多轮对话在用户未获得所需内容时结束的位置。这种情况是否发生在对话的特定部分？为什么有些用户在到达终点前就停止了？可能是识别问题或某些设计问题，但也可能是外部因素：也许充值格式变了，也许数据库访问中断了，等等。或者，您对成功的定义与用户不同。\n\
  \n来自语音前线\n\n在一个银行 VUI 中，大量用户没有完成他们发起的账单支付请求，这导致了一次大规模的调优工作，后来我们才意识到，用户选择该路径是为了查找账单到期日和金额——他们当时根本没有付款的意图，但在听到他们想要的信息后，仍然非常满意地结束了对话。\n\
  \n任务完成包括 fulfillment 准确性。仅根据是否达到您指定的“成功”状态或是否填满所有空槽位来判断任务完成是不够的。如果用户请求某位艺术家的歌曲，但听到的是不同的版本，对用户而言，这并非成功。如果他们想要晚上\
  \ 7 点的预订，但没有空位，他们也没有成功。即使您无法提供他们想要的东西，也需要分析这种情况发生的频率以及如何最好地回应。更改提示语可能就足够了；提供替代方案是另一种方法。Fulfillment\
  \ 调优可能很棘手，并且依赖于转录访问。\n\n任务完成也关乎用户如何最终取得成功。一个能让 95% 的用户在 15 秒内、或通过三步且无需重试就成功达成目标的\
  \ VUI，显然优于另一个具有相同 95% 成功率但需要 30 秒、或六步且多次重试的 VUI。改进通常是识别和对话改进的结合。在多槽位多轮对话中，可能存在用户遇到困难的特定步骤。您对问题的分析越准确，就越有可能做出改进。\n\
  \n\n\n##### 任务完成分析代码\n\n在第 16 章中，你了解到有两种方法可以进行任务完成分析：事后添加标签（这是我们推荐的方法），或者将其直接嵌入到应用程序中。让我们来看一段有助于添加任务标签的代码。以下是\
  \ `get_logs.py` 代码的一部分，展示了如何根据识别出的意图添加任务标签。这部分内容位于代码清单 17-1 中。找到 Dialogflow 履行日志条目\
  \ (A)。执行正则表达式搜索。这是一个多行条目，因此你需要使用 `re.M` 和 `re.S` 标志 (B)。从日志中设置请求的 JSON (C)。提取意图显示名称\
  \ (D)。流程准备开始 (E)。流程准备结束 (F)。打印 `log.txt` 行 (G)。\n\n```python\ndef main():\n# Dialogflow\
  \ fulfillment request (multi-line)   (A)\npattern = re.compile(\n'Dialogflow fulfillment\
  \ request : (.*)$', re.M | re.S)   # B\nmatch = pattern.match(entry.payload)\nif\
  \ match:\ndf_webhook_request = json.loads(match.group(1))   # C\n# Recognized intent\n\
  try:\nrecognized_intent = \\\ndf_webhook_request['queryResult']['intent']['displayName']\
  \  #D\n# Add any task tags here\nif recognized_intent == 'tcrProcedurePrep':   #\
  \ E\ntask = {}\ntask['name'] = 'ProcedurePrep'\ntask['tag'] = 'start'\ntask_tags.append(task)\n\
  if recognized_intent == 'tcrProcedurePrepNext2':   # F\ntask = {}\ntask['name']\
  \ = 'ProcedurePrep'\ntask['tag'] = 'end'\ntask_tags.append(task)\nexcept KeyError:\n\
  pass\n# Filled parameters\ntry:\nfilled_parameters = \\\njson.dumps(df_webhook_request['queryResult']['parameters'])\n\
  except KeyError:\npass\n# ...... Code cut for focus\nif havelog:\nprint((f\"{date_time}\\\
  t{session}\\t\\t{recognized_text}\\t\\t\"  # G\nf\"{recognized_intent}\\t{filled_parameters}\\\
  t\"\nf\"{application_response}\\t{json.dumps(task_tags)}\"))\n```\n\n代码清单 17-1 \
  \ \n向 `get_logs.py` 添加任务标签\n\n当你运行修改后的 `get_logs.py` 并将 `log.txt` 导入 Excel 时，你应该会看到类似图\
  \ 17-4 所示的内容（为更好地显示任务标签，部分列已被隐藏）。你可以看到如何统计任务开始和结束的次数；其比率即为任务完成百分比。\n\n![../images/507213_1_En_17_Chapter/507213_1_En_17_Fig4_HTML.jpg](img/507213_1_En_17_Fig4_HTML.jpg)\n\
  \n图 17-4  \n统计任务开始和结束的次数以计算任务完成百分比\n\n#### 对话调优\n\n对话调优是一个常用术语，指代更侧重于“动手”的分析工作，旨在改善整体对话。对话调优不易自动化；它常常能发现自动化定量日志中未显示的问题，或为已发现的问题明确正确的补救措施。这种分析特别关注在多轮对话中演变的问题。分析过程中的典型发现包括：导致用户困惑和超出语法（OOG）表述的提示措辞和传递问题。\n\
  \n顾名思义，补救措施侧重于分析和更改完整的对话流程及详细设计。对话调优通常会导致提示措辞的更改，以及提示的发音和传递方式的改变；对错误词语的强调很容易引起困惑，从而导致\
  \ OOG 表述。\n\n对话调优的其他主要对象包括：由过长、过短或出现在意外位置的停顿引起的时机问题，以及任何在多轮对话中展开并影响对话流程或用户心智模型的问题。\n\
  \n对话调优依赖于获取用户实际所说的内容（转录文本）以及他们说话的方式（音频文件）。你马上就能明白，为什么当能够获取真实用户的 IG 和 OOG 表述的转录文本和录音时，对话调优的效果最好。那么，如果你无法获取这些数据该怎么办？如果你只有自动化性能日志和一些任务完成日志，你仍然可以了解哪些地方不起作用以及可能的原因。重点寻找性能热点。你知道每个提示的措辞，也能听到它——既然知道存在问题，你能找出问题所在吗？你也可以查看一些文本解释日志——你能想到一些发音相似、可能像吸引子一样起作用的词语吗？如果某些错误提示频繁播放，你能弄清楚哪里出了问题吗？用户确认的次数是否超出预期？他们在身份验证时是否失败？你是否有来自调查研究或可用性测试的数据，指向某些潜在问题？\n\
  \n如果日志暗示系统某部分性能不佳，那么进行深入调查是下一步的正确选择。这可能是由高 OOG 率或高 FA/FR 率、关于困惑或性能不佳的具体投诉，以及高交易失败率所触发的。选择或捕获一小部分对话，通常不超过\
  \ 100 个。在进行任何进一步的收听或分析之前，清除对话中的所有个人身份信息（PII）。如果音频文件尚未包含提示音频，你可能需要通过拼接提示和响应来重建对话。从头到尾聆听完整的交互以了解上下文，并对其进行转录。在\
  \ IVR 领域，这被称为全通话分析。一些 IVR 平台允许你收听呼叫者在系统中的完整旅程，即使你无法录制用于离线分析。如果这些方法都不可行，则对可被录制的无经验用户进行受控的实验室研究。聆听并阅读转录文本。你能得出哪些概括性结论？是否有些用户未被识别而其他用户被识别？你会了解到是否需要更改或添加置信度阈值，某些对话路径中的提示是否合理，用户是否犹豫或要求重复，用户是否在某些情境下多次重试，他们是否听到了意料之外的信息，是否存在过多的确认，等等。此时，你需要应用你在本书第\
  \ 3 部分学到的关于语音设计和技术的所有知识：寻找机会提高一致性，通过缩短冗长的提示来降低认知负荷，删除不必要的重复，通过隐式回读增加安心感，通过示例或解释性细节提供清晰度，寻找令人困惑或缺失的选项，等等。\n\
  \n\n\n在实施设计更新之前，你可以通过众包调查（第 16 章）来测试新提示词的可记忆性或理解度。检查提示词的语调：错误的语调位置会混淆部分用户，必须修正。其他困惑迹象可以轻松在\
  \ OOG 日志中找到：犹豫、旁白、回溯、重复、模糊回应、明显的不耐烦等。OOG 数据是调优的黄金资源！表 17-4 展示了一些我们遇到的 OOG 数据示例以及每个示例所暗示的问题。\n\
  \n**表 17-4** OOG 话语日志中发现的问题示例\n\n| OOG 用户话语 | 可能说明的问题 |\n| --- | --- |\n| *那个号码我已经给过你了。*\
  \ | 首次尝试未被识别；用户可能在之前的对话轮次中已提供过该信息 -> 可增加多槽位处理。 |\n| *等等等等（嘲讽语气）……* | 提示词过于冗长 ->\
  \ 可进行精简。 |\n| *不！我不要那个。* | 多次识别错误或理解错误。 |\n| *稍等。它就在这附近……* | 用户未预料到会被要求提供所请求的信息，且手头没有该信息\
  \ -> 可增加暂停处理。 |\n| *呃，那是什么？* | 提示词中出现不熟悉的术语；用户不知道如何回应 -> 可修改提示词或补充信息。 |\n| *这些都不是。*\
  \ | 提示的选项未涵盖用户想要的，或措辞未暗示预期选项 -> 可增加“以上都不是”作为隐藏选项，并重新审视菜单选项。 |\n| *两个都要。* | 提示提供了两个非互斥的选项\
  \ -> 可增加相应处理。 |\n| *她为什么开始说话了？* | VUI 意外触发且用户注意到了。 |\n| *昨天查过了，数字不一样。* | VUI 意外触发但用户未注意到。\
  \ |\n\n对于表中的每条 OOG 话语，你首先要跨用户和跨对话轮次确定该问题的普遍程度。然后查看细节：问题的上下文是什么？提示词中的某些选项听起来是否过于相似，导致识别混淆？某些词语是否导致用户困惑？是否存在覆盖缺失？先寻找最容易的可行解决方案——有时这就是正确答案。\n\
  \n但用户到底说了什么？我们已经讨论过，使用 Dialogflow 时你无法访问音频，因此你不知道用户实际说了什么。幸运的是，Google STT 非常出色；如果用户说了类似*那个号码我已经给过你了*或*这些都不是*的话，这很可能会出现在日志的`RECOGNIZED\
  \ TEXT`列中，也可能作为`Default Fallback Intent`出现在`RECOGNIZED INTENT`列中。因此，虽然这并非全貌，但你可以利用提取的日志电子表格进行大量有用的对话调优。而且你已经学会了寻找问题间接迹象的方法。\n\
  \n#### 意图调优\n\n我们将意图调优单独列为一个调优重点。它涉及最大化映射到最佳匹配意图的用户请求数量。如果有多个可能的意图可以匹配，调优通常旨在选择最具体且仍适用于所有上下文的那个；更通用的意图需要额外的对话轮次、消歧或菜单。意图调优涉及准确性、覆盖范围、任务完成度和对话调优的混合改进。解析规则可以更改；最可能的结果是更新你的详细规范和提示词措辞。来自真实用户的真实数据对于有效的调优至关重要。核心的快乐路径话语很容易处理；除非你拆分或合并意图，否则可能不需要更改这些。相反，应关注意图之间“边界”上的话语，即那些模糊的话语。如果用户再次提出类似问题、取消或回溯，你基本可以确定意图匹配有误。注意避免引入歧义——如果难以区分意图，请在继续对话前添加分层确认以进行验证。寻找可以澄清意图映射的上下文。如果用户在纯音频设备上要求*播放第一部哈利·波特*，他们更可能指的是有声书而非电影，因此应添加上下文检查并将其映射为`PlayAudiobook`意图，而不是映射为`PlayFilm`意图然后返回设备无法处理视频内容的错误信息。\n\
  \n**成功提示 17.3** 调优不仅仅是发现和修复错误\n\n如果某些功能不起作用，你当然需要解决问题。但调优也在于发现并解决那些可以整体改善体验的问题。寻找方法帮助用户更快、更准确地获得他们想要的东西。\n\
  \n### 如何确定调优工作的优先级\n\n既然你的电子表格中已经有了大量数据，你将如何理解这些数据并逐步处理呢？\n\n一种选择是逐行浏览电子表格，填写需要填写的列，并记录任何需要修复的问题。如果数据超过\
  \ 100 行左右，我们不推荐这种策略。一旦你有几百或几千行数据——而你确实需要这么多数据——这种方法就不实用了。\n\n相反，你应该进行优先级排序、筛选和重新排序。点击工作簿顶部的`Data`菜单栏，然后点击`Filter`。每列的顶部会出现一个箭头；点击该箭头。你可以从值列表中选择；也可以输入值进行筛选；还可以筛选时间戳以仅获取某些日志。从最常见的错误和意图开始，从那些你知道会阻碍其他意图的意图入手；然后逐步向下处理列表。以下是一些具体策略：\n\
  \n-   筛选`RECOGNIZED INTENT`为`Default Fallback Intent`的数据。这些是被拒绝的短语，很可能属于 OOG。\n\
  -   筛选尚未结束。接着处理频繁出现的`RECOGNIZED TEXT`。如果你的应用程序有问题，很可能多个用户会遇到相同的问题。这时你可以找出问题所在，确定可能需要向意图中添加哪些短语等。\n\
  -   在标注 OOG/OOC 时，首先按最可能的`RECOGNIZED TEXT`进行筛选；这样，在输入第一条数据后，你就可以直接复制粘贴。\n\n对于任何规模适中的应用程序，你都无法修复所有问题。这完全没问题——这是意料之中的。从修复发生频率最高且对用户成本最高的问题开始。并且不要停止——持续分析和修复。当用户或客户告诉你*几天前我说了类似这样的话……然后得到了一个奇怪的回应。为什么？你能修复吗？*时，电子表格也能派上用场。\n\
  \n关于流程还有一点补充。当你提取数据时，我们让你立即将其导入 Excel。这是因为我们就是这么做的。当你将本章中的调优策略应用于你的数据时，你会很快注意到电子表格如何通过筛选功能为你节省时间。你能使用其他解决方案吗？当然可以，特别是如果你能使用一些专门的调优工具。但即使有这些工具，我们有时仍会使用\
  \ Excel 来完成部分工作。\n\n\n\n#### 将观测结果映射到正确的解决方案\n\n分析数据以理解每个问题的原因和严重程度已经足够困难；找出解决问题的最佳方法并实施更改也并非易事。每个问题通常都有几种可能的原因，甚至还有更多可能的解决方案。\n\
  \n##### 来自一线声音\n\n当心对定量结果的误解。一位同事收到了一份 A/B 测试数据，内容是关于用户在请求歌曲后收听时长的。在`VUI-A`中，用户不会被告知元数据（如歌曲标题）；在`VUI-B`中，用户则会被告知。定量数据显示，`VUI-A`中的收听时长显著更长；不熟悉用户行为的人将其解读为：不听到介绍性元数据使用户更满意。为了验证这一解读，这位同事进行了定性对话路径分析，查看了用户后续请求的意图以及系统响应。这些数据呈现了不同的图景：当用户对内容一无所知时，他们常常会询问自己正在听什么，这自然导致了更长的整体内容“参与”时间，尤其是当内容与用户预期不符时。更糟糕的是，一些后续问题未被理解，导致用户尝试重新措辞提问，从而使对话变得更长。基于对数据上下文的正确理解，正确的结论是`VUI-B`提供了更好的体验。介绍性元数据提供了隐式确认，使用户能迅速知道执行结果是否匹配其请求。教训是：要理解完整图景，并在任何分析中使用所有可用数据：\n\
  \n*   **用户** *播放“Let It Be”* → `VUI` 误识别为另一首歌：“Let It Be Love.”\n\n*   ~ ~ ~ 无元数据的响应\
  \ ~ ~ ~\n\n*   **`VUI-A`** *好的。* → 播放“Let It Be Love” → 需要收听以判断准确性\n\n*   ~ ~ ~\
  \ 带元数据的响应 ~ ~ ~\n\n*   **`VUI-B`** *好的。* *这是“Let It Be Love”。* → 播放“Let It Be Love”\
  \ → 无需收听\n\n要理解原因，你需要了解语音设计和实现的注意事项，以及你的`VUI`的具体细节，包括任何资源限制。好消息是，调优建立在你在本书中学到的所有知识之上。这并非高深莫测的学问，但确实需要一些思考和练习。\n\
  \n在本节中，你将有机会练习应用所学知识。表 17-5 和 17-6 列出了一些你在性能分析中可能遇到的简单示例和观测结果。表 17-5 中的观测结果包括来自语音系统单个部分或整个系统的快照性能数据；表\
  \ 17-6 中的数据则依赖于通过对话轮次跟踪单个用户，或考虑多个轮次。对于每个观测结果，我们列出了一些可能的原因和解决方案：问题很少只有一个原因。研究整个表格，或者遮住第二列和第三列，自行进行分析和解决方案。祝你好运！\n\
  \n##### 表 17-6\n\n基于多轮数据映射到可能原因和解决方案的调优\n\n| 观测结果（第二组） | 分析与可能的原因 | 可能的解决方案 |\n\
  | --- | --- | --- |\n| 用户连续发出多个请求，含义相同但措辞略有不同。 | 误识别或覆盖不足。`话语到意图`映射错误。 | 更新同义词覆盖范围。查看前后轮次的话语。更新/重新训练意图模型。\
  \ |\n| 用户连续发出多个请求，内容措辞相同：*告诉我关于支架的信息*。→ *没有关于“stints”的信息*。→ *我需要关于支架的信息*。→ *抱歉，没有关于“stint”的信息*。\
  \ | 误识别或覆盖不足。存在强吸引子。 | 检查并添加同义词覆盖范围。添加词典发音。更改参数设置。添加`N-best`列表和跳过列表。 |\n| 用户连续两次否认相同结果：*4\
  \ 1 5。* → *4 1 9，对吗？* → *不，4 1 5。* → *4 1 9，对吗？* | 误识别或覆盖不足。存在强吸引子。 | 添加`N-best`列表和跳过列表。更改参数设置。\
  \ |\n| 用户说了符合语法的话，但响应似乎回答了另一个问题：*调到频道 1 1 3*。→ *调到频道 1* *一个补货订单……取消*。→ *好的，正在订购补货*。\
  \ | 系统过早停止监听（用户犹豫）。`话语到意图`映射错误。 | 监听完整话语：用户是否被截断？为什么？增加`EOS`。更新/重新训练意图模型。 |\n| 高比例的请求后跟着一个特定的下一个请求：三分之二的关于剩余补货次数的查询后跟着一个补货请求。如果还有一次或多次补货，84%的下一个轮次是补货请求。\
  \ | 有机会让交互对用户来说更快、更简单。 | 重新设计：在请求 1 之后将请求 2 作为显式选项添加，或者直接进入请求 2 同时说明如何退出。 |\n| 高比例的*返回*请求。\
  \ | 提示中缺少选项。上一轮提示具有误导性或不清晰。话语映射到错误的意图。 | 查找提示中不清晰或缺失的选项；重新措辞。查看前后轮次的话语；更新/重新训练意图模型。\
  \ |\n| 高比例的`OOG`（超出领域）但相关的响应。 | 用户正在回应上一轮提示。措辞对用户没有意义。 | 查找提示中不清晰或缺失的选项；重新措辞。检查上一轮的话语。如果发现问题，更新上一轮的意图模型。\
  \ |\n| `OOG`评论性响应以及高比例的*是*确认后跟未完成任务：*你问巨人队的第一场主场比赛是什么时候？* → *是的！* → *我不知道那个。* →\
  \ *那你为什么问我？* | 不必要的确认。响应结构与请求不匹配。意图标签错误。 | 重新设计。应用设计原则。对类似请求进行额外测试。 |\n\n##### 表\
