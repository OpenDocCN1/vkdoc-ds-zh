- "# 将另外两种核心对话类型的示例对话结合起来，就得到了图 7-5。这些图表通过仅展示槽位填充进行了简化。在学习了消歧方法后，我们强烈建议你重新审视这些图表。将它们展开，以查看包含多个槽位和歧义的几个示例对话。对于语音团队中的不同角色来说，这是一个非常有用的工具，可以帮助他们专注于预期行为，而不会陷入细节中。\n\
