  \ 更改置信度阈值。添加 N-best 列表和跳过列表。寻找识别准确率和覆盖率的趋势。 |\n| 日志中无识别/文本结果的语句比例高（系统在听但未找到任何词语）。\
  \ | 无语音超时可能由多种原因引起，包括硬件和参数设置、因提示措辞令人困惑或选项缺失导致的用户犹豫、用户正在查找所需信息。用户说话声音轻、含糊不清或难以理解。\
