  \ PIN 码是什么？* –> *诺拉* | 有些人使用键盘对应关系将数字转换为单词（更容易记忆）。 | 扩展语法。在提示语中增加澄清说明。 |\n| 品牌名称误识别比例高：*宜家*\
  \ = [ay-KIY-ax] 或 [iy-KEH-ah] | 需要理解发音不寻常的名称，用户也需要知道如何发音。如果是外来词，需要处理原始版本和修改后的版本。\
  \ | 检查并添加词典发音，包括相近变体。双重检查 TTS 发音。 |\n| 是/否确认环节中，领域内超出语法（同义词）比例高：*是的，夫人。* *基本正确。*\
  \ *当然可以。* | 语法覆盖范围太窄。是/否语法远不止这两个词。回答通常根据句法语境和角色包含不同的填充词。 | 检查并添加同义词覆盖范围。添加一步纠错。扩展语法以配合提示措辞和角色。选择能反映上下文的“是/否”语法。\
