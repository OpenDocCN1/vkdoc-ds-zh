- "# 16. 测试与衡量语音系统性能\n\n您已经构建了语音系统，并应用了所学的一切。现在，您已准备好迎接全世界用户蜂拥而至使用您的实现。如何将其推向世界，同时避免以某种糟糕的方式崩溃？您能否知道人们是否成功与您的\
  \ VUI 交互，或者是否喜欢与它对话？如果您遵循了所有“规则”，为什么还需要担心这些？\n\n本章探讨如何测试语音系统，并从系统准确性和可用性两方面衡量其性能，以及如何识别有效的用户数据。您捕获的信息和指标将直接用于提升系统性能的能力（第\
  \ 17 章）。\n\n### 测试语音系统性能\n\n所有软件都需要测试；语音系统也不例外。事实上，语音系统通常需要更多的测试，因为输入变化多端。正因如此，您在语音系统以及跨语音开发平台进行测试的方式，可能与您测试非语音界面时的习惯有所不同。\n\
  \n\n\n#### 识别测试\n\n识别测试（Recognition Test，简称 Reco Test）是一种有限且受控的健全性检查，用于验证常见的预期用户语句是否被正确理解。进行识别测试时，你不需要高度代表性的用户，只需一小群与预期真实用户合理相似的人员即可。如果你的语音用户界面（VUI）面向普通大众，测试人员应涵盖性别、年龄差异以及部分方言。如果你的\
  \ VUI 针对特定用户群体，例如非常年轻的用户或处于嘈杂环境中的用户，请确保你的测试人员能反映这些特征。\n\n为什么这很重要？在第 2 章中，你了解到每个人的声音和声道都是不同的。所有识别器的性能也并非相同。识别测试并非同义词覆盖范围的测试，而是测试识别器在典型情况下是否按预期运行。因此，识别测试人员通常会按照\
  \ VUI 团队创建的脚本进行朗读。该脚本涵盖了一些具有代表性的高频对话和语句，这些内容可从示例对话中提取，并包含任何特殊指令，例如一串数字应作为单个数字还是自然数来朗读。\n\
  \n如果你能够访问底层的识别参数（例如在某些企业解决方案和交互式语音应答（IVR）系统中），那么识别测试应该是强制性的。但即使对于较小的家庭助手类 VUI，识别测试也能让你安心，确保用户在大多数常见情况下能够成功操作。\n\
  \n识别测试通常执行起来相当快速。提前准备好脚本并安排好测试人员，留出时间进行分析、结果报告和修改。确保所有必要的语音数据捕获机制事先已测试完毕。识别测试基本上是在任何大规模发布之前进行的最后一项测试。它不需要自动化，也不应该自动化。\n\
  \n识别测试是对识别引擎的测试吗？嗯，既是也不是。除非你在一个自行构建自动语音识别（ASR）引擎的组织中工作，否则你无法改变核心识别性能。所有识别器在核心层面的表现都不同。你所能做的，就是根据你的任务和资源需求，选择可用的最佳识别器。不过，你可以做的是，在你的数据上训练识别器，并查找语法覆盖范围的缺口。有时，你甚至可以修改影响识别的更深层参数设置。你将在第\
  \ 17 章中了解更多关于影响性能的能力。在部署前的识别测试中，你只需寻找那些不需要大量用户数据即可发现的主要问题。\n\n如果你的 VUI 是多语言的，或者使用的是你/你的团队不流利的语言，那么你需要母语为当前语言的人来进行测试。你不能仅仅基于机器翻译在文本转语音（TTS）中创建句子——你不仅需要真实的发音和语调，还需要了解特定国家、地区以及用户社会语言背景的真实用户。当然，这一点对于任何\
  \ VUI 设计也同样适用。\n\n#### 对话遍历：功能端到端测试\n\n对话遍历测试的目的是验证 VUI 的功能是否与设计规范中的内容相匹配。可以将其视为一种用户验收测试。与识别测试类似，遍历测试是在代码稳定后通过语音命令进行的，但它与识别测试在以下几个方面有所不同：\n\
  \n*   目标是测试设计规范中每个上下文和条件下的每条路径。\n*   测试人员需要是熟悉设计的人；如果系统很大，多个测试人员可以分工协作。\n\n测试所有上下文和条件意味着：每条路径和槽位组合、每次重试次数、每个身份验证用例（如果属于系统的一部分）、任何执行的成功与失败，等等。它还应涵盖在不同时间、不同星期几以及不同地理位置对任何数据访问或传输行为的测试。关键在于，在可能影响结果的每个上下文中，遵循每一条可能的路径。详细的设计规范在此处就派上了用场：所有用例都已列出，包括每个用例要朗读的示例语句。\n\
  \n**成功秘诀 16.1 获取真实的测试账户**\n\n如果你要测试一个运行在他人服务器上的生产系统，最好尽早开始安排测试账户。对于可能涉及其他部门的大型企业客户，这可能需要一些时间。在许多系统中，用户根据不同的上下文会有不同的体验。用户特定的上下文包括：新账户与现有账户、首次登录、账户类型（储蓄账户与抵押贷款账户）、账户内容（储蓄金额、股票交易数量、免费与付费）、以及角色（患者与药剂师）。其他上下文包括地理访问限制以及与系统对话的原因（不同的人可能根据其账户类型在系统中走不同的路径，并拥有不同的体验）。安排多个能够覆盖真实用户可能遇到情况的账户，并确保这些账户能反映真实账户的行为，包括任何延迟或数据库访问障碍。如果是健康或医疗系统，很可能需要在后端设置测试健康数据。\n\
  \n尽管遍历测试并非同义词覆盖范围的测试，但所有这些组合的复杂性会导致测试花费相当长的时间，即使对于每个用例仅使用单一原型语句的小型系统也是如此。如果全部“手动”完成，一个大型企业级\
  \ VUI 的遍历测试可能需要数周时间。幸运的是，有一些方法可以加快速度：\n\n*   在进行任何语音遍历测试之前，运行自动化或半自动化测试，以快速且有条理地识别处理过程中的潜在缺口，例如：\n\
  \    *   端到端测试，用于识别对话中缺失的路径或代码中缺失的槽位组合。VUI 设计人员可以审查和分析标记出的结果，并向开发人员提供关于哪些需要更新、哪些可以忽略的反馈。\n\
  *   使用每个示例语句的文本进行遍历测试，以验证在每种上下文和条件下，是否返回了正确的意图、槽位是否正确填充、以及是否播放了预期的提示语。这可以将识别因素排除在外，并快速标记出语句到意图映射中的错误。识别不正确的响应可以简单到自动比较\
  \ VUI 规范中的提示语措辞与系统生成的措辞。如果你要比较提示语措辞，请注意随机化和动态提示语。\n\n\n\n#### 语音对话系统测试\n\n使用 TTS\
  \ 或预录制的示例话语进行遍历测试，以验证意图、槽位和提示。预录制的测试话语允许在每次更新后快速且受控地重新测试。它们还通过让测试人员专注于监听对话中不易自动化的方面（例如响应的表达方式和强调）来加速手动测试。在使用\
  \ TTS 或预录制话语进行测试之前，请验证每个话语都能被正确识别。\n\n在某个阶段，您需要真实的人类测试人员进行对话遍历测试。您需要监听提示中可能导致混淆的错误强调、提示之间奇怪的交接、过长或过短的停顿、不同提示之间的音质或音量变化、被遗留的\
  \ TTS 测试提示等。\n\n**成功提示 16.2 谨慎选择您的测试人员**\n\n很多软件测试被外包给第三方 QA 公司。这对很多测试来说没问题，但对于语音系统可能会成为问题，如果测试人员的口音与用户不匹配，或者在不符合\
  \ VUI 预期的环境中进行测试。只要 QA 团队经过培训，包括知道在报告任何识别问题之前进行重新测试，这仍然可以正常工作。识别测试也可以是让利益相关者参与进来的好方法，让他们在受控的情况下尽早接触已实现的系统。\n\
  \n#### 唤醒词和语音检测测试\n\n如果您的 VUI 依赖于一个经过特殊训练的唤醒词（例如 `Alexa` 或 `Hey, Google`）或其他机制来触发主动语音识别，您需要验证它在预期的使用场景中能正常工作。如果您的语音系统支持“打断”（barge-in），也需要进行测试。回顾第\
  \ 6 章，打断是 IVR 中的一个关键特性，它允许用户通过直接说话来中断 VUI，而不是先说唤醒词或按按钮。这种类型的测试应该非常受控、彻底且有条理。很少有人自己完成这种级别的工作；更可能的是，您会依赖一个专门的公司或团队来开发和测试此功能。即使您自己不这样做，也要意识到这一点。测试不仅应涵盖在预期触发时识别的频率，还应涵盖被错误触发的频率。后者更难测试，但同样重要。\n\
  \n#### 其他类型的系统集成测试\n\n其他一些常见的测试类型对于语音系统的性能也很重要。我们在此简要讨论；当您学习调优（第 17 章）时，您将了解更多关于它们如何发挥作用的信息。在每种情况下，测试都需要从对话用户的角度涵盖不同的上下文：检查\
  \ VUI 是否以信息丰富且及时的方式响应，包括按设计使用措辞恰当的提示或替代路径。并且，需要明确的是，测试当然应该在您的开发过程中迭代进行——我们只是出于实际原因在本章中集中讨论它们：\n\
  \n*   **话语数据捕获**：话语、解释结果和标签需要在一天中的所有时间以及所有身份验证上下文中按预期记录。当然，您必须牢记我们在第 15 章中讨论的关于捕获和存储语音数据的隐私和安全问题。我们将在本章和下一章中回到这个重要话题。\n\
  \n*   **后端数据访问**：检查所有内部和外部数据库是否可访问。在测试期间移除这些数据库，以验证当它们不可用时是否返回了预期的适当错误响应。\n\n* \
  \  **延迟和响应时间测试**：最小化延迟并在延迟发生时对其进行处理对于 VUI 至关重要。用户会对意外的沉默感到困惑。测试响应时间的延迟，以确定延迟是来自\
  \ ASR 或 NL 处理、数据库查询还是其他地方。超出预期的延迟需要通过设计好的变通方法来解决。这可以通过延迟掩蔽非语言音频（第 9 章）或额外的提示（例如\
  \ `Let me look that up for you`）来实现。\n\n*   **负载、压力和浸泡测试**：检查系统在负载下的响应内容和及时性。包括适用的备份和恢复测试。\n\
  \n**成功提示 16.3 测试不可选**\n\n如果您被要求为某些语音工作提供分项报价，请确保以这样的方式撰写您的报价和《工作说明书》，使得适当的测试成为每个阶段或工作部分的一部分，并且不能被分离出来并可能被移除以使提案更便宜。我们特别看到过针对可用性测试的这种尝试。\n\
  \n### 测试可用性和任务完成度\n\n在对话遍历测试期间，通常会注意到一些可能对已部署的语音系统构成问题的事情，即使它符合设计。有时这是因为现在连接到 VUI\
  \ 的各种系统和数据库的行为与预期不完全一致。例如，可能存在比预期更多的延迟，导致提示中出现比预期更长的静默，或者某些媒体或信息内容与您预期的不同。再次强调，让设计师、开发人员和产品负责人参与进来，以确定这些发现的严重程度以及如何解决它们。\n\
  \n只要指标可供捕获，基本的系统性能就很容易测量和量化。但是，以准确且有意义的方式测量和量化用户成功要困难得多。可用性测试研究有点像一组有指导但无脚本的抽查式对话遍历和识别测试。这是一种没有明确“正确答案”的功能测试——即使您的\
  \ VUI 按照您的计划执行，它不仅在能力上必须是功能性的，而且对于目标用户也必须是功能性的。\n\n#### 语音可用性测试概念\n\n在第 5 章中，您学习了用户研究方法，包括如何在您设计或构建任何东西之前，甚至在拥有真实用户之前，找出人们希望从\
  \ VUI 中获得什么。现在是时候看看您可以从在部署前后与您的 VUI 交谈的代表性用户和真实用户那里收集哪些数据了。您感兴趣的不仅仅是任何数据，而是那些能告诉您您的语音系统是否成功地为用户提供了他们想要的东西的数据。在本章中，您将学习一些基本概念，以理解为什么定量和定性测试都是必要的，以及您可以从不同的测试方法中学到什么。您将了解哪些是可以可靠测量的。\n\
  \n在一个金融服务系统中，我们测试了两种不同的菜单结构；一种由一个较长的列表组成，另一种将列表分成两组。两者都允许打断。普遍的假设是，两个较短的列表会大获全胜，而年长的用户会被单个长列表压垮。结果发现有些人喜欢一种，有些人喜欢两种——这纯粹是个人偏好，并不简单地与用户年龄或技术熟练程度挂钩。事实上，最年长的参与者，早已过了退休年龄，很高兴不必听完几个层级，并愉快地用她的请求打断了系统。教训：要小心基于对某类用户群体的刻板印象做出假设。\n\
  \n\n\n##### 研究方法论：任务场景与问卷调查\n\n在部署后期和部署后阶段，有多种研究类型能提供宝贵的数据和见解。其中最常见且最有用的两种是涉及任务场景和问卷调查的研究。在任务场景测试中，主持人向参与者呈现若干场景，并观察参与者尝试完成每个任务时的交互过程。每项任务完成后，主持人会就体验提出后续问题。问卷调查通常包含一组采用李克特量表评分的陈述。李克特量表是一种五级或七级量表，旨在衡量人们对诸如*语音用户界面帮助我快速完成了任务*这类陈述的同意或不同意程度。量表以短语而非数值形式呈现，例如“非常同意”和“有些不同意”。问卷也可以包含排序选项来衡量偏好。绝对的李克特数值对于报告和演示来说是一个很好的总结，但在对典型的小规模（通常少于\
  \ 12 人）参与者群体进行测试时，注意不要过分强调数值。相反，应更多关注自由形式的回答或群体差异。\n\n任务场景性能测试侧重于系统可用性和任务完成成功率，同时也能揭示定性的用户满意度信息。问卷调查是定量的，主要关注用户满意度。你将在本章后面部分了解更多关于这两者的内容。任务场景研究包括“绿野仙踪”研究和功能系统研究；问卷调查也会被讨论。在测试可用性时，要分析结果，对设计和实现进行修改，并迭代定性研究，同时收集定量数据进行分析。\n\
  \n##### 研究环境：实验室内或远程\n\n你有一个选择：将参与者带到实验室，或者让他们留在“原生环境”中。将用户带入实验室环境的利弊并不仅仅与语音相关。你可以在网上找到许多比较实验室可用性测试与远程测试优势的研究。^(¹⁰⁶)\
  \ 如果是远程测试，主持人（即进行研究的人）可以前往参与者的地点，或者留在另一个地点——这里我们主要关注后一种远程形式。在 Nuance 公司，我们大部分的可用性测试都是远程进行的。这对于像基于电话的\
  \ IVR（交互式语音应答）这样的语音优先或纯语音 VUI（语音用户界面）非常有效；只需建立一个电话桥接并录制对话即可。\n\n熟悉设计和技术的远程主持人无需观察参与者，就能判断他们在\
  \ VUI 的哪些环节遇到了问题。这实际上是远程主持人的优势之一：参与者在描述他们的体验时往往会提供更多细节，因为他们觉得有必要准确解释发生了什么，因为主持人不在现场观察。有时他们甚至会更诚实！如果你正在测试多模态设备，你当然需要看到参与者的操作。在实验室中，你可以更轻松、更可靠地设置摄像头来捕捉用户的反应和交互。\n\
  \n我们发现，在这两种环境中，用户往往会在相同的核心识别和理解问题上卡壳；这类发现对于不同环境同样有效。但是，将用户带离其常规环境可能会移除导致对话流程和实现问题的上下文。如果用户需要查找某些信息或参考某些实物，你至少需要重新创建任务的这一部分。理想情况下，应在实验室和用户环境中各进行一些测试。表\
  \ 16-1 总结了我们刚才讨论的实验室内和远程语音可用性测试之间的差异。\n\n**表 16-1** 实验室内研究与远程研究的比较\n\n| | 实验室内 |\
  \ 远程 |\n| --- | --- | --- |\n| **环境** | 可控，但与参与者的自然环境有距离 | “原生”参与者环境，但交互受限 |\n|\
  \ **参与者基础** | 较难找到广泛群体 | 较易找到（无需差旅） |\n| **成本** | 可能更高（需补偿差旅费） | 可能更低 |\n| **研究所需时间**\
  \ | 更长（更多准备工作） | 更短 |\n| **参与者反馈** | 话少，批评少，更个人化 | 更具解释性，更诚实，更少个人化 |\n\nVUI 对话越个人化，参与者与\
  \ VUI 交谈时感到舒适和安全就越重要。当用例依赖于目标用户环境中的某些事物时，收集能反映该环境的数据就至关重要。当环境涉及隐私、可能令人尴尬，甚至存在法律问题时，这可能会很有挑战性。我们收集过车内驾驶时发短信、结肠镜检查准备、金融交易、医疗尿液样本采集等场景的用户语音数据，这些\
  \ VUI 对话比要求听首歌或设置定时器要个人化得多。想想看，为了仍然能收集到有效数据，我们在这些 VUI 的实验室内测试与远程测试之间必须做出哪些选择……以下是一些答案：\n\
  \n对于车内测试，大部分是在实验室中完成的（你在第 1 章中看到了实验室设置的图片）。我们也曾作为阿尔法测试者参与过更安全任务（如导航）的实车测试。这些测试可以在实际道路上安全进行，因为用户无需冒险将视线离开路面。摄像头和车内观察员会捕捉交互过程，包括回应、犹豫和时机。对于结肠镜检查准备，我们招募了已经做过或计划做这项检查的朋友和家人。我们通过访谈了解该过程中哪些环节比较困难，并进行了实验室研究，要求参与者回忆自己的准备过程以及他们希望了解什么，然后让他们从应用程序中获取这些信息。对于已安排检查的参与者，我们使用详细的应用程序内日志记录来捕获所有与语音相关的数据；我们在应用程序中将问卷调查作为最后一项待办任务，并随后进行了电话访谈。至于尿液样本采集，不，我们当然不能记录人们在医院卫生间里说了什么或做了什么。相反，我们研究了那些卫生间的详细照片，然后在本地模拟了类似的布局，以确定麦克风和扬声器的位置，以及这将如何影响体验。\n\
  \n##### 研究管理：有主持或无主持\n\n许多类型的研究既可以是有主持的，也可以是无主持的；要么由主持人实时管理研究，要么参与者自行安排时间回答问题并执行任务。结果通过行为跟踪或报告工具收集，甚至由参与者自行报告。在\
  \ Nuance 工作期间，大多数可用性研究都是有主持的，无论是远程（通过电话）还是在实验室。此后，我们更多地依赖无主持研究。\n\n有主持研究的一个好处是，主持人可以跟进以澄清观察到的行为或参与者的评论。我们不止一次看到参与者感到困惑，并在一个十点量表的“错误”一端给出评分；无主持研究无法纠正这一点。另一方面，无主持研究“自行运行”，因此可以快速且低成本地接触到大量参与者。如果时间和预算允许，两种方式都做。表\
  \ 16-2 总结了有主持研究与无主持研究的典型差异。\n\n**表 16-2** 有主持研究与无主持研究的比较\n\n| | 有主持 | 无主持 |\n| ---\
  \ | --- | --- |\n| **成本** | 较高 | 较低 |\n| **广泛的参与者基础** | 较难找到 | 较易找到 |\n| **研究所需时间**\
  \ | 较长 | 较短 |\n| **参与者跟进** | 即时 | 无 |\n\n\n\n##### 结果：定量还是定性\n\n在其出色的著作中，^(107)\
  \ Travis 和 Hodgson 解释了为何两种数据类型都不可或缺：“定量数据告诉我们人们在*做*什么。定性数据则告诉我们人们*为什么*这么做。”换言之，定量研究涉及计算：有多少用户说了`X`，或者成功完成任务的百分比是多少。定性研究则侧重于观察：为什么特定用户说了`X`而不是`Y`，或者不同的情境如何影响用户接下来会说什么。通常，调查是定量的，任务场景是定性的，但两种类型往往都包含一些对方的元素。关于这个话题，在本章稍后学习指标时会有更多讨论。\n\
  \n任何涉及查看用户行为日志的测试都应是定量的。根据日志的创建方式，它们也可以是定性的，正如你在调查讨论中会看到的那样。\n\n对于定量研究，任何结论和主张显然都需要具备统计显著性。当你设计定性研究时，会有人问你需要多少参与者。^(108)\
  \ 我们发现，任务场景研究通常只需要 10-12 名参与者；最大的问题通常在进行到一半人数时就能被发现。这很好，因为这意味着你可以在一天或两天内找到主要问题。你的精力通常更适合用于进行几轮迭代式的小型研究，以测试不同的设计版本。\n\
  \n**成功秘诀 16.4 切勿轻视定性研究**\n\n定量和定性研究都有效且重要——如果执行不当，两者都可能毫无意义。定量研究并不会仅仅因为其拥有更多人的结果就更加可信或重要。定性研究提供了对数字背后原因的洞察，因此，应投入与定量测试同等程度的精力进行定性测试。\n\
  \n`A/B` 测试是一种常见的用户体验测试方法，它为通常属于定性的任务提供定量数据。在 `A/B` 测试中，用户会被自动且随机地分配到某个体验的两个不同版本之一。对于语音系统，这通常意味着两种措辞不同的提示语、确认步骤的有无等等。进行测试是为了证明一个假设，例如“如果用户在初始请求后有明确的确认，那么更多用户能成功完成任务\
  \ A”。由于这些测试需要真实用户并且需要具备统计显著性，VUI `A/B` 测试的诀窍在于你需要能够访问生产系统。根据你的组织、领域和任务，获得进行 `A/B`\
  \ 研究的许可可能非常困难，或者它只是其他模态（如网站测试）测试的一部分。如果可能，请务必使用它！\n\n##### 绿野仙踪研究\n\n绿野仙踪（WOZ）测试可能是你从未听说过的最出色的\
  \ VUI 测试方法，因此我们专门用一整节来介绍它。这个名字来源于《绿野仙踪》故事中“帘幕后的男人”这一概念：看似是机器在运作，实际上是由一个模拟机器的人——即“巫师”——生成响应。^(109)\
  \ 我们在第 5 章中介绍了 WOZ，将其作为早期数据收集和用户测试技术之一，特别适用于产品设计和开发过程的早期阶段，即在拥有功能完善的 VUI 之前。我们在本章中更详细地介绍它，因为你现在已经具备了成功运行\
  \ WOZ 所需的语音设计知识。此外，你可以在产品开发的任何阶段进行 WOZ 来测试新功能，并且 WOZ 中使用的技术与功能系统测试中使用的技术相似。在 WOZ\
  \ 中，无论是在实验室还是远程进行，主持人都会要求参与者使用 VUI 执行一项任务；参与者与 VUI 交互，同时主持人进行观察并提出后续问题——就像任何其他可用性研究一样（图\
  \ 16-1）。不同之处在于，VUI 系统并非功能性的——而是由一个人（通常是设计师）监听参与者的指令，并反馈符合任务的语音响应，仿佛它是一个功能性的 VUI。主持人不会告诉参与者系统是“假的”，除非参与者主动询问，但这种情况很少发生。如果他们真的问了，不要撒谎！\n\
  \n![../images/507213_1_En_16_Chapter/507213_1_En_16_Fig1_HTML.png](img/507213_1_En_16_Fig1_HTML.png)\n\
  \n**图 16-1** 成功进行 WOZ 的关键是给参与者带来真实的体验\n\n“巫师”使用图形用户界面来生成对参与者口头请求的语音响应。该界面需要组织得当，以便“巫师”能快速找到正确的响应——如果响应错误或耗时过长，体验对参与者来说就会显得不真实，从而降低结果的价值。一些企业级语音开发平台，如\
  \ Nuance 等，提供了运行 WOZ 所需的工具，或者可以直接从详细的设计文档中自动生成测试环境。如果你无法使用这些工具，也不必担心。你可以使用易于获取的编辑工具手动创建自己的环境。每次\
  \ WOZ 通常只测试 VUI 设计的一小部分，因此手工制作“巫师”的界面是完全可行的。图 16-2 展示了在 Microsoft PowerPoint 中创建的两个\
  \ WOZ 的起始界面：一个餐厅预订系统和一个定时器设置应用。该流程为“巫师”提供了便捷的参考，以便快速找到适合当前语境的响应；餐厅屏幕中的黑色标签，如“预订”，指的是参与者的初始请求。在此语境下，VUI\
  \ 的响应和后续对话路径取决于参与者在第一次话语中提供了多少个槽位。“巫师”点击所选对话路径中的音频图标来播放预加载的提示语，并且在右角有一些“简易退出”提示语，当“巫师”需要额外时间选择响应，或者请求无法通过\
  \ GUI 设置中的内容处理时，可以播放这些提示语。为了真实感，音频应该看起来来自声称正在测试的设备——如果是 IVR，则通过电话；如果是测试家庭助手设备，则通过该设备，即使它只是通过一个隐藏的外部扬声器播放。\n\
  \n![../images/507213_1_En_16_Chapter/507213_1_En_16_Fig2_HTML.jpg](img/507213_1_En_16_Fig2_HTML.jpg)\n\
  \n**图 16-2** 使用 PowerPoint 创建的两个简单绿野仙踪测试的初始屏幕\n\n\n\n如果操作得当，由于参与者能体验到逼真的对话，WOZ 测试的结果会非常有效且富有洞察力。一次典型的\
  \ WOZ 测试包含四到六个与参与者相关的任务，主持人必须以清晰的方式呈现每个任务，但不能直接告诉参与者该说什么话。例如，在测试处方续药任务时，你希望参与者思考他们会如何完成这个任务，从而使用他们自己的语言。因此，作为主持人，你首先要设定场景，比如问：“你是否曾经让医生开过处方药，然后去药房取药？”接着，你进入任务描述。你可能会说：“假设今天早上你服用了处方药。你每天都在服用，刚刚发现瓶子里只剩几天的药量了。请在药用完之前，使用\
  \ VUI 获取更多药物。”你不应该直接给出指令“使用 VUI 续药”，因为你希望参与者自己想出表达方式——如果直接给出指令，他们很可能会机械地重复“续药”。如果你在实验室进行\
  \ WOZ 测试，你甚至可以用一个药瓶作为道具，让参与者在 VUI 询问时参考标签上的任何信息。\n\n可以想象，扮演“巫师”的角色既充满挑战又压力巨大。这个人需要非常熟悉设计和语音技术，才能提供逼真的体验。这意味着要快速判断某个话语是否会被真实的语音系统处理，如果会，如何处理，然后通过点击正确的响应来执行——输入文字让\
  \ TTS 输出会花费太长时间。这也意味着，如果用户响应缓慢或在说话中途犹豫，需要模拟超时行为。练习！再练习！主持人和“巫师”需要良好的工作关系——有时主持人需要为“巫师”的\
  \ GUI 未考虑到的意外用户请求进行补救。必要时，主持人常用的解释是，有时会出现小故障，测试系统比真实系统慢。这并非完全不真实！\n\n现在你可能在想：“既然可以使用带语音识别的功能系统，为什么还要费心用模拟系统呢？”问得好！你也会用功能系统进行相同类型的测试，但进行\
  \ WOZ 测试有几个原因：\n\n- 没有哪个语音系统拥有完美的性能，尤其是在调优之前。功能系统有时会不可预测地失败。WOZ 让你能在调优之前测试用户对你预期设计的反应。\n\
  - 你无法强制功能系统产生特定的响应行为——除非你有特殊的受限版本，但那工作量很大。如果你想测试用户对特定错误处理方式的反应，你需要一个单独的系统版本或进行其他代码修改。WOZ\
  \ 让你无需任何编码工作就能完全控制响应。\n- 你想在花费时间和金钱实现某个功能之前测试其设计，甚至在几种方案之间做出选择。WOZ 是在产品开发过程中的任何阶段，在对话上下文中快速测试这些功能的方法。\n\
  - 某些后端数据、系统错误条件或第 14 章中提到的任何上下文都不可用。WOZ 让你能够模拟整个对话体验，观察用户的反应。\n\n我们只是浅尝辄止地介绍了相关内容。你可以在网上和书籍中找到更多细节。以下是另外几点需要牢记的：\n\
  \n- 在测试开始时，请参与者同意录制他们的会话。\n- 在最后一个任务场景结束后，进行总体满意度调查。询问他们喜欢和不喜欢的地方。\n- WOZ 测试是定性的，因为它们通常只涉及一两天内、每次一小时的会话所能处理的参与者数量，大概十几个人。但你会收集到任务成功率和满意度评分等数值数据。你需要报告这些数字。这没问题，只要你记住并明确说明，由于参与者数量有限，这些数字在统计上并不显著。\n\
  - 在测试过程中，主持人说了算。欢迎观察者提出请求和意见，只要这些意见的考虑方式不影响整个会话，但主持人拥有最终决定权。请向所有人明确这一点。\n\n在计划和执行涉及参与者的可用性研究时，很容易忘记某个步骤或没有尽早开始。如果发生这种情况，可悲的结果是研究价值降低，甚至完全取消测试。项目进度表需要为多个任务留出时间，有些任务可以并行进行，大多数任务依赖于其他任务的完成。关键步骤（已大幅简化）如下：\n\
  \n1.  确定要测试哪些系统功能。由设计师主导，但你需要让业务负责人参与进来以获得支持和批准。\n2.  开始招募和安排参与者的流程。越早越好。别忘了在预算中计入招募费用和参与者酬劳。\n\
  3.  与第 2 步并行，根据设计的相关部分开始创建 WOZ。测试其端到端运行是否良好。让“巫师”利用可用的“参与者”（如同事）进行大量练习。\n4.  运行测试。\n\
  5.  分析结果。创建商定好的报告。分享结果。更新设计。\n\n\n\n##### 开发“绿野仙踪”测试工具\n\n要进行“绿野仙踪”（WOZ）测试，你需要一些软件让“巫师”完成其工作。从开发角度来看，主要关注点是构建对话功能，但并非使用系统的自动语音识别（ASR）和自然语言理解（NLU），而是由“巫师”充当系统并提供答案。从\
  \ Dialogflow 的角度来看，你可以设想这样一个系统包含几个组件：\n\n- **一个“巫师”图形界面，通常基于网页**：该用户界面为每个预期的 Dialogflow\
  \ 意图提供按钮或链接，并为出现计划外的请求时提供一个开放式选项。可以通过以下几种方式，根据你应用当前的 Dialogflow 意图自动生成该网页：\n   \
  \ - **将应用导出为 .zip 文件（如本书中的文件）并处理其内容——你在第** **3** **章中为你的 Dialogflow 应用做过类似操作**：该\
  \ .zip 文件包含 `agent.json` 和 `package.json`、实体目录（每个实体 `ENTITY` 对应一个 `ENTITY.json`\
  \ 和一个 `ENTITY_entries_LANG.json` 文件）以及意图目录（每个意图 `INTENT` 对应一个 `INTENT.json` 和一个\
  \ `INTENT_usersays_LANG.json` 文件）。这些文件可以配合（例如）一个 Python 脚本来创建“巫师”网页界面。我们在此不提供此类脚本的具体示例；具体实现很大程度上取决于如何向“巫师”提供\
  \ WOZ 界面。\n    - **通过使用各种 Dialogflow API**^(¹¹⁰) **来提取意图**：将“巫师”用户界面部署在 Google App\
  \ Engine 上是合理的，因为网络钩子（webhook）也部署在那里。\n\n- **一种拦截正常应用行为并使用“巫师”用户界面输入的方法**：一种策略是在网络钩子中为“WOZ\
  \ 模式”添加一些代码。在此模式下，网络钩子会等待来自“巫师”用户界面的响应，并使用该响应来回复 Dialogflow，而不是直接响应用户的话语。这可能会变得棘手：你需要小心，不要超过\
  \ Dialogflow 在未收到网络钩子响应时等待并转而使用非网络钩子答案的时间限制。\n\n**成功提示 16.5 边做边想？再想想**\n\n让参与者在执行任务时大声思考，是一种常见的可用性测试方法，用于深入了解人们的思维过程。显然，如果你在研究语音指令，这很难做到，尤其是在测试一个“始终监听”的系统时，比如电话交互式语音应答（IVR）系统。\n\
  \n“绿野仙踪”是语音用户界面（VUI）设计的主力工具。找到最适合你环境的设置方案，并学会如何使用它来收集有价值的数据。再次强调，需要练习：一次成功的 WOZ\
  \ 测试需要经验。\n\n##### 跟踪和衡量性能\n\n在尝试改进你的语音用户界面（VUI）之前，你需要了解它当前的性能表现。这些衡量指标需要准确、信息丰富、一致且能快速生成。跟踪、记录和衡量性能不仅仅是为了做出改变——即使你无法做出改变，你也想知道当用户与你的\
  \ VUI 交谈时发生了什么。如果你为他人构建了一个语音系统，他们可能已经将你的报酬与性能挂钩。你可以看到选择正确的事项进行跟踪和衡量是多么重要。\n\n不同语音平台提供的性能指标差异很大。只要不违反隐私或安全规定，能记录的就尽量记录。重要的是，不要将记录范围局限于被识别的内容。在某些方面，被误识别的内容以及用户提出但你尚未处理的内容中包含了更多信息。尽你所能去捕获这些信息。你还应该捕获用户说话和沉默的时间点、他们做出响应所需的时间（如果犹豫，这是认知负荷的迹象，你需要找出原因），或者他们是否插话回应。如果你定期采样，请捕获不同用户类型、一天中的不同时段、一周中的不同日期等的变化情况。在第\
  \ 17 章中，你将理解记录一切可能信息的重要性，以便你能准确定位如何改进系统性能。\n\n**成功提示 16.6 规划日志记录永远不嫌早**\n\n尽管我们在本书较晚的章节才讨论日志记录，但我们想强调，你应该在任何项目的最开始就实施日志记录和性能指标，而不是等到开发基本完成后再进行改造。利益相关者、设计师和开发人员都需要参与这些讨论，理想情况下甚至在签署任何客户参与合同之前就应该开始。记录的内容需要既能帮助用户，也能使任何承诺的目标得以实现。\n\
  \n要了解你的 VUI 当前及长期的表现，你首先需要一个基线来进行比较。性能指标分为三类：识别性能、事务完成度和用户满意度。还有第四类你需要关注的：业务指标。让我们来看看。\n\
  \n\n\n##### 识别性能指标\n\n语音系统的性能报告总是涉及识别性能指标，包括语法覆盖率、准确率，有时还有延迟。这些指标有助于理解不同类型对话中的 VUI\
  \ 错误，而意图和槽位的准确率则依赖于识别性能。你在第 12 章中已经了解过这些内容（为方便参考，在表 16-3 中重复列出）。性能指标应尽可能涵盖你框架中能够收集到的这些度量项。\n\
  \n**表 16-3** 识别性能覆盖范围与准确率概念\n\n| 如果话语是…… | 该话语…… |\n| --- | --- |\n| 语法内（`IG`） |\
  \ 被相关语法覆盖；与预期匹配。 |\n| 覆盖范围外/词汇表外（`OOC`/`OOV`）^(¹¹¹) | 任何未被对话此部分覆盖的话语。 |\n| 语法外（`OOG`）\
  \ | `OOC` 加上噪音、片段、口吃、咳嗽或旁白。 |\n| **如果结果是……** | **该话语……** |\n| 正确接受（`CA`） | 被当前语法覆盖，并成功按预期匹配。\
  \ |\n| 正确拒绝（`CR`） | 未被当前语法覆盖，因此按预期被拒绝。 |\n| 语法内误接受（`FA-in`） | 被当前语法覆盖，但被错误识别并匹配为其他`IG`内容。\
  \ |\n| 错误拒绝（`FR`） | 被当前语法覆盖，但未被识别或匹配到该语法。 |\n| 语法外误接受（`FA-out`） | 未被当前语法覆盖，但被识别并匹配为其他`IG`内容。\
  \ |\n\n还有一个你需要理解的重要概念：域内与域外。一个属于域内（`ID`）的短语，是指它本应属于某个语法，无论当前是否已被包含在内。该短语之所以“属于”，是因为在其所处的整体\
  \ VUI 主题和当前对话轮次的上下文中，它与该语法中的其他短语具有相同的含义。以下是一些示例，用以说明同一句话可能属于域内或域外：\n\n*   **VUI**\
  \ *你最喜欢的艺术家是谁？*（期望回答艺术家名字）\n*   **用户 1** *是的。* ← 域内（乐队名）\n*   **用户 2** *9 9 9。*\
  \ ← 域内（乐队名）\n*   *~~~ ~~~ ~~~*\n*   **VUI** *那个订单号是 995，对吗？*（期望回答是/否）\n*   **用户\
  \ 1** *是的。* ← 域内\n*   **用户 2** *9 9 9。* ← 域内（一步纠正）\n*   *~~~ ~~~ ~~~*\n*   **VUI**\
  \ *今晚的预订，对吗？*（期望回答是/否）\n*   **用户 1** *是的。* ← 域内\n*   **用户 2** *9 9 9。* ← 域外\n* \
  \  *~~~ ~~~ ~~~*\n*   **VUI** *你最喜欢的节日是什么？*（期望回答节日名称）\n*   **用户 1** *是的。* ← 域外\n\
  *   **用户 2** *9 9 9。* ← 域外\n\n你可以看出领域上下文有多么重要。这也是为什么直接使用“现成”语法会很困难的原因之一。它们是一个很好的起点，但往往不够用，而且肯定需要测试。虽然语法内和语法外是清晰且二元的——一个短语要么被包含要么不被包含——但判断一个短语是否属于域内则变得模糊，因为它涉及主观判断，尤其是在接近意图之间的边界时。并且，假设领域是英语，以避免任何潜在的反驳，即这可能是某个非常固执的德国人试图说“不”（*nein\
  \ nein nein*）。\n\n再看一下这四个示例对话。你会意识到另一个重要的事情：槽位级别的性能。你需要跟踪通用意图的识别性能，例如针对所有响应订单号确认的话语。为了理解哪些具体响应失败了，你还需要捕获并报告单个槽位和值的性能。例如，你希望看到订单号确认槽位中“是”、“否”以及一步纠正中各个数字的值。如果你有能力，请捕获这些信息。这种详细程度对于调整你的系统至关重要（第\
  \ 17 章）。\n\n一个基本问题是如何获取用于此类分析的数据。你已经看到 Dialogflow 有一些内置机制，可以逐步查看应用程序的历史记录并改进性能，包括：\n\
  \n*   **历史记录**链接，显示对话历史\n*   **训练**链接，标记问题并允许进行修正，例如添加训练短语\n\n两者都提供了良好的数据，多年来我们也见过各种基于\
  \ GUI 的工具执行类似操作。这里的主要问题是规模。这些工具适用于分析少量对话，但如果你有一个已部署的应用程序，并希望浏览数千个对话以找出需要添加哪些短语来覆盖，或者试图理解某个特定意图中的行为，这些工具就有限了。图\
  \ 16-3 展示了一个电子表格示例，其中包含能提供更好洞察的统计数据类型。在第 17 章中，你将学习如何查找和处理这类数据。对于一个真实的应用程序，你将拥有数千行这样的数据。\n\
  \n![../images/507213_1_En_16_Chapter/507213_1_En_16_Fig3_HTML.jpg](img/507213_1_En_16_Fig3_HTML.jpg)\n\
  \n**图 16-3** 识别/解释统计示例\n\n\n\n##### 任务完成度指标\n\n如果说识别指标提供了相对静态的性能画像，那么任务完成度指标则从不同于纯识别性能的视角审视整个对话。追踪用户在多轮对话中采取的路径是至关重要的信息。任何能表明用户是否成功、以及在何处或如何失败的信息也同样重要。\n\
  \n理想情况下，你希望捕获以下信息：语音音频、对所说内容的文本解释、意图和已填充的槽位、每个请求前后的情况、各步骤之间的时间间隔、任何重试操作、时间点、说话者身份（基于生物特征或认证状态）、任何关联设备的状态、VUI\
  \ 的响应方式以及最终的执行结果。在你的代码中包含标签，以便自动收集数据。请记住，这些日志需要匿名化处理，移除个人身份信息（PII），并进行安全存储和访问。\n\
  \n日志标签应捕获用户在对话中的进展。你需要对每个步骤发生的情况进行编码，以便捕获这些信息用于后续分析；将成功与失败的判定留给后续分析，并且随着未来系统变化，这种判定甚至可能改变。与识别性能指标类似，接下来我们将展示如何配置你的应用以在高层级收集数据。然后在第\
  \ 17 章中，你将了解更多细节。\n\n对于任务完成度，你需要标记两个事件：\n\n- 任务开始。\n- 任务完成。\n\n例如，用户通过说*引导我完成我的程序准备*来触发意图\
  \ `tcrProcedurePrep`，这标志着任务开始。如果 VUI 播放来自意图 `tcrProcedurePrepNext2` 的响应*太好了！你全部完成了！*，则标志着任务结束。\n\
  \n到目前为止，你在程序助手应用中还没有定义太多涉及复杂任务的场景；它们大多是“一次性”请求。但即使是那些有时看似简单的请求，比如*呼叫布伦特·琼斯*，在涉及消歧、确认、错误处理等情况时，也会变得复杂。\n\
  \n任务开始同时也是任务结束的百分比，就是你的任务完成率（TCR）。如果一个事务开始，然后在任务 1 完成之前另一个事务又开始了，或者日志在完成之前就结束了，那么你就假定该事务未完成，除非该任务内部包含另一个子任务。\n\
  \n在高层级上，有两种测量 TCR 数据的策略：\n\n- 在应用程序中放置标签，然后直接从日志中测量 TCR。^(¹¹²)\n- 不在应用程序中做任何操作，而是使用稍微复杂一点的分析脚本，从其他日志元素中推断任务的开始和结束。\n\
  \n在可能的情况下，我们通常倾向于第二种方法。原因之一是事物会发生变化。在实践中，我们经历过很多次这样的情况：我们花费大量时间（和金钱）在应用中定义任务，事后才意识到*糟糕！我们遗漏了一些东西！*\
  \ 此时你有两个选择：(1) 丢弃大量非常有用的数据，修复标签，然后重新开始数据收集；或者 (2) 对已收集的数据进行事后分析，根据你已有的日志数据定义新的任务开始和结束。嗯，这实际上和第二种方法是一样的，所以你不如一开始就采用它！另一个避免使用硬编码标签的原因与测试有关：在数据收集开始之前，所有内容都应经过仔细测试，但众所周知，要处理好所有情况（包括消歧、确认、无匹配和识别错误等）是非常困难的。这是倾向于对原始日志进行事后分析的另一个原因。在第\
  \ 17 章中，你将了解更多关于这两种方法的信息。\n\n**成功提示 16.7 保持脚本更新**\n\n如果你使用脚本进行自动化数据收集，请保持它们与任何语法更改、功能添加、意图的分拆或合并以及提示和流程的更新同步。\n\
  \n##### 音频与 TTS 测试\n\n所有音频提示音和提示语都需要测试。某些测试可以自动化，包括确保在应该播放时播放了内容，并且音量在预期范围内。然而，在某些时候，你需要亲自聆听。毕竟，你是在处理声音！\n\
  \n如果在开发过程中使用临时的 TTS 提示语，最好选择一个与最终语音听起来足够不同的声音，以帮助你发现任何被忽略的残留 TTS。如果提示语是由真人配音演员录制的，请确保不同录制会话之间的录音质量没有变化。检查是否有异常的咔嗒声或停顿。对于\
  \ TTS，要测试其可理解性。让一组有代表性的听众通过调查问卷来评估一组语句的可理解性。客观地测量 TTS 质量和可理解性是可能的。你甚至可以测量某种情感或紧迫感传达得如何，例如，通过让两组参与者分别聆听由\
  \ TTS 录制（第 1 组）和由富有表现力的自然语音录制（第 2 组）的相同系统响应。我们自己也成功使用过这种方法。图 16-4 展示了听众对两个措辞相同的\
  \ VUI 提示语的两个版本（高质量 TTS 和录制的人声）所传达情感的评估结果。TTS 版本和人声版本传达了非常相似的情感。^(¹¹³)\n\n![../images/507213_1_En_16_Chapter/507213_1_En_16_Fig4_HTML.png](img/507213_1_En_16_Fig4_HTML.png)\n\
  \n**图 16-4** 两个提示语，分别以 TTS 和人声呈现，对其传达的情感进行评估\n\n**成功提示 16.8 在上下文中聆听所有提示语，包括 TTS**\n\
  \n尽管如今的 TTS 令人惊叹，但它并非完美无缺。务必测试其可理解性，并在上下文中仔细聆听大量生成的语句。听起来自然吗？是否存在令人困惑的语调？有时答案很简单，只需更改标点符号：如果你不喜欢*我找不到那个，但我找到了这个*……\
  \ 听起来的效果，可以尝试将其稍作修改为*我找不到那个。但我找到了这个……*\n\n\n\n##### 用户满意度指标\n\n用户满意度是用户直接反馈与对重试及成功满足用户需求的可推断分析相结合的结果。用户满意度与事务完成成功率密切相关——这并不意外，因为未能成功获得所需内容的用户自然不如成功者满意。如果你能获取`OOG`数据，就能轻松看出用户话语中的挫败程度。如果你的`VUI`使用了任何自动化满意度指标（例如用户点赞/点踩反馈），请将其纳入自动化报告。用户满意度研究通常单独处理，因为它们并非源自自动追踪的系统指标。分析报告可能类似于图\
  \ 16-5 中的摘录。\n\n![../images/507213_1_En_16_Chapter/507213_1_En_16_Fig5_HTML.png](img/507213_1_En_16_Fig5_HTML.png)\n\
  \n**图 16-5** 从用户处获取即时反馈；确认反馈针对的是准确性而非内容\n\n只要数据有效，数据越多通常越好。但需提醒一句：正如不应过度解读单个数据点，也不要因为基于大数据集就认定分析结果正确。即使是数值指标，也需要结合对人类与计算机语音处理的理解进行分析。\n\
  \n常见的用户满意度指标包括：\n\n* 对话总时长\n* 错误（数量与类型）及重试次数\n* 整体任务完成情况与失败类型\n\n###### 来自一线语音实践\n\
  \n在某`IVR`系统中，测试了两种不同的欢迎提示语措辞。一种以系统角色名问候来电者，另一种则额外包含一句简短短语，明确表明语音为自动代理。当明确说明自动化时，转接人工代理的请求增加了（约\
  \ 5%），但完全自动化的通话也增加了。这意味着透明度和选择权带来了准确的预期和个性化的用户体验，从而提升了整体自助解决率、任务成功率和用户满意度。\n\n可想而知，准确衡量用户偏好和满意度非常困难，包括测试系统角色偏好。当然，你应始终尝试这样做，但务必谨慎得出有效结论。这是一个引人入胜的话题——在线搜索“有效实验设计”等关键词——深入了解它将使你受益匪浅，不仅限于评估自己或他人的`VUI`相关主张，也适用于一般性批判性思维。多年来，我们进行了多项研究，试图衡量用户对语音和措辞的偏好。以下是我们学到的一些经验：\n\
  \n* 最大的陷阱是将定性观察转化为定量测量和主张。报告数字没问题，但除非你确信在受控研究中具有显著性，否则应专注于捕捉定性观察。\n* 网上有许多关于用户对男声与女声`VUI`语音、或人类录音语音与`TTS`偏好的主张。尽管可以阅读这些内容，但需注意偏好取决于多种因素和参数。偏好通常基于其他因素或多种因素的组合，例如识别准确率或功能可用性。\n\
  * 当人们表示更喜欢`VUI`语音的某种性别时（参见第 15 章的角色讨论），可能仅仅意味着他们更喜欢那个特定的声音，或某个测试短语的朗读方式。\n* 当人们表示不喜欢`TTS`时，可能意味着他们不喜欢那个特定的`TTS`，或其在特定`VUI`中的使用方式。\n\
  * 无论是`TTS`还是人类语音，相同的措辞通常被认为传达了同等程度的关切或紧迫感。在孤立回应中，内容对解读的影响更大，但长期使用后可能存在偏好差异。\n* 在某些情境下，更机械的声音也可以接受，甚至更受欢迎。需警惕“恐怖谷效应”——即人们对某些具有强烈人类特征但又不完全像人的事物产生的不安反应。\n\
  * 要准确衡量用户对语音或角色的满意度，需要在实际使用中随时间推移对真实用户进行测量，而不仅仅是在研究中播放孤立的话语。你需要让测试者与多个仅在语音上有所不同的`VUI`版本进行交互。\n\
  * 最终，语音偏好非常个性化。最佳解决方案是在运行良好且实施最佳设计实践（如清晰简洁的提示措辞）的语音系统中，为用户提供几种选择。\n\n衡量语音系统用户满意度最常用且有效的方法涉及任务场景和调查问卷。让我们快速了解两者能带来哪些收获。\n\
  \n##### 功能性系统任务场景研究\n\n使用功能性`ASR`和`NL`的任务场景研究，其测试方法与`WOZ`研究基本相同，区别在于识别和意图映射是功能性的，而非由人工控制。因此，体验是真实的；这些研究本质上是评估性的，可用于收集用户成功率和满意度指标数据。你可以获得任务完成数据、对话路径以及任务完成后后续调查中的满意度数据。重要的是，你能够直接观察用户交互，而非依赖用户的自我报告。最后，你还可以加入关于品牌和偏好的更广泛问题，例如*它是否符合您对\
  \ X 公司的印象？*以及*您会做哪些改变？*\n\n\n\n###### 管理式调查与众包调查\n\n正如你刚才所见，某些调查元素通常是主持式任务场景研究的一部分。大型语音调查通常采用远程方式，且往往是非主持式的。调查涉及参与者的自我报告，这意味着你得到的是人们体验的过滤版本，包括他们对哪些有效、哪些无效的看法。\n\
  \n只要你能意识到这一点，这也没问题。调查不必具有显著的定量意义才有效用。它们也能提供有用的定性数据：通过 A/B 测试收集简单任务的绩效结果，或通过多选题或简答题收集关于偏好、使用情况和想法的信息。\n\
  \n你可以使用亚马逊土耳其机器人、谷歌调查、Figure Eight 等类似的人工参与平台来开展调查。这些方式可能既便宜又快捷。每位参与者只需支付相对较少的报酬，就能针对某项任务或主题提供反馈、回答或行为数据。问题和任务可以精准定位，直接针对你感兴趣的特定主题。你可以指定所需的参与者人数及其人口统计特征。你可以从非常广泛的人群中获得大量潜在有价值的信息。\n\
  \n当然也存在缺点。你无法跟进提出澄清性问题。你越是远离询问参与者的具体体验，他们回答不准确或不投入的风险就越高。问题必须仔细措辞才能产生有效的答案，而且很难找到非常特定的参与者群体，例如老年用户或患有特定健康问题的人。\n\
  \n如果你的 VUI 面向普通大众，并且你提出了正确的问题，那么众包调查可以成为绩效数据的绝佳来源——创建调查需要技巧和经验。多年来，我们使用它们取得了良好的效果。关键在于尽可能保持清晰和具体。你可以在大多数调查平台上播放音频，但在直接连接到功能设备或应用程序方面会受到限制。\n\
  \n有一些测试公司提供这些更深入的服务。还有其他公司进行大规模调查访谈。假设问题清晰且准确反映了语音模态，这可以成为用户指标的一个非常有用的来源。你或任何有语音系统工作经验的人都应该审查所有调查问题。\n\
  \n用户参与度和数据有效性是众包面临的最大问题之一。由于报酬微薄，参与者会仓促完成每项任务。你可以通过用几种方式询问同一个问题来验证回答，从而应对这一点。例如，先问一个开放式问题，之后再问一个排序题和/或一个多选题。此外，给你的参与者高于最低标准的报酬，并从足够多的参与者那里收集数据，这样你就可以剔除任何有问题的结果。在一次大型众包调查中，我们不得不删除了超过\
  \ 15%的回复。通过审查数据日志，我们确定其中一些是单个参与者的重复回复，而另一些则是无意义的回复。\n\n###### 应用内自动调查\n\n另一种收集用户指标的方法是应用内自动调查。在你已部署的\
  \ VUI 中，你可以在对话的关键节点包含一个简短的调查或反馈问题。在 IVR（交互式语音应答）系统中，它可以是在一个复杂任务结束时的一个简短满意度调查。在多模态移动应用中，你可以在信息回复后包含一个“点赞/点踩”的反馈问题。我们成功构建并使用了这两种方式来收集用户绩效数据。如果你能够整合应用内调查，一旦基础设施到位，它们既便宜又灵活，并且能让你直接获取用户满意度和成功数据。\n\
  \n应用内调查是获取相关且有效指标的绝佳来源，原因有几个。首先，反馈是在体验结束后立即请求的。人们会很快忘记音频细节。这是语音模态的本质——语音转瞬即逝。与事后进行的单独调查相比，这种反馈往往更准确、更详细、更相关。\n\
  \n应用内调查的另一个好处是它们是口头的。这能让参与者保持在同一种模态中，有助于他们思考口头对话对他们的效果如何。如果用户也用他们自己的话对开放式问题做出口头回答，那么还有一个额外的好处，即答案来自用户自己的语言。\n\
  \n参与者保证是真实用户，因为调查被放置在正在被询问的应用程序中。在众包调查中，通常无法保证参与者是所询问应用程序的实际用户，尽管他们可能具有代表性。\n\n\
  任何应用内调查问题都需要清晰准确，以便回答有效且有用。它们还需要简短，并且只能偶尔出现，以免惹恼用户。\n\n**成功秘诀 16.9 创建调查需要技巧；语音同样需要**\n\
  \n创建有效的调查和分析结果是重要的技能。以否定结果的方式提问太容易了。如何创建调查超出了本书的范围。理解语音数据是另一项关键技能——通过阅读本书，你已经比许多收集和分析数据的人知道得更多了。如果你依赖他人的数据，请验证他们是否扎实掌握了调查技巧和语音主题。\n\
  \n###### 业务指标\n\n如果你正在构建或改进产品，你需要清楚了解 VUI 的业务目标，并且你需要在你开始规划时（第 4 章）就知道这些目标，以确保你的设计不仅针对这些目标，而且你还能衡量它们。在某些情况下，目标是提高客户满意度，无论是相对于公司/产品过去的表现，还是相对于某个既定标准。这通常通过调查来衡量。常见的业务目标包括通过将更简单和非故障排除任务从人工代表转移到语音应用来节省成本和增加自动化。在公司拥有配备专业座席的大型呼叫中心的情况下，减少错误转接是关键。在其他情况下，目标是减少等待时间/服务时间，或增加注册量、成功登录次数，或成功到达特定功能的最终状态。还有呼叫放弃率、重试次数、使用频率、交互量，甚至程序准备的成功率提高。无论是什么，确保你能获取必要的衡量数据。你会发现业务指标也经常是组合使用的，而不仅仅依赖于单一指标。如你所见，你需要可靠地记录用户在每个对话步骤以及累积的行为。\n\
  \n### 接下来是什么？\n\n你学习了如何测试你的语音系统，使其尽可能健壮并准备好迎接黄金时段。你还学习了如何收集不同类型的系统性能和用户数据。^(¹¹⁴^)\
  \ 这些是你改进语音系统性能所需的数据。这意味着你已经准备好迎接我们最后一章引人入胜的主题：调优。\n\n\n\n### 总结\n\n- 更多数据总是更好，只要它是有效的。不要只依赖一个测试或一种类型的测试。相反，执行不同类型的测试，看看你的结果是否一致。它们可能各自发现不同的问题，也能从不同且富有洞察力的角度发现相同的问题。\n\
  - 用户体验设计师、用户界面设计师、开发者、分析师和产品负责人都会从理解定性和定量数据中受益。\n- 即使你无法对语音系统进行任何更改，也要衡量其性能；否则，你对其成功与否将一无所知。\n\
  - 你准确衡量和报告系统性能的能力，直接影响你优化系统的能力。\n\n脚注 1 2 3 4 5 6 7 8 9\n\n"
- "# 17. 优化与部署语音系统\n\n优化语音系统性能是一个迭代且持续的过程，涉及分析来自真实用户的数据，并根据你发现的任何问题改善他们的体验。这个过程始于你完成集成和功能测试后的一个或多个试点测试。在端到端测试和验收测试期间，有限的优化将是测试的一部分。只有在拥有来自经过全面测试和集成系统的真实用户数据后，全面的优化才具有实际意义。当你阅读本章时，你会理解其中的原因。本章涵盖了优化概念的定义，并提供了动手实践。你还将学习如何在数据访问受限时进行优化，以及如何在部署前后避免陷阱。\n\
  \n### 优化：它是什么以及为什么要做？\n\n优化指的是收集和分析来自实际最终用户使用的、已投入生产的实时语音系统的数据，提出解决方案并实施这些方案的过程。如果你喜欢解谜，你会爱上优化。让我们从一些定义以及为什么需要对每个语音系统进行一定程度优化的原因开始。\n\
  \n优化的核心原因是，用户的满意度和成功率与系统性能直接相关。由于人类语音在发音和用词上差异巨大，并且这种变异性只能在一定程度上被提前预测，因此一旦你获得了真实用户数据，并能够根据真实用户在真实世界环境中的情况调整覆盖范围和参数，性能总会得到提升。即使对一个由经验丰富的团队构建的语音系统进行了彻底的内部测试，也总会有一些话语是语法无法覆盖、无法理解或被误解的。即使你幸运地拥有一个相关的、带注释的训练集，它也无法覆盖所有的话语或上下文。每个系统都是不同的，每一组用户也是不同的；只有当你拥有真实用户数据——即实际最终用户为了自身需求在自己的环境中与已部署的语音用户界面（VUI）对话所产生的数据——你才能看到全貌。\n\
  \n这一切可能让人感到害怕：*你说它可能无法完美运行是什么意思？！* 我们理解——但请记住，它不必完美。这是意料之中的，而且没关系。真的。不存在一个能理解一切的完美语音系统，即使在优化之后也是如此。就像没有人能总是完美地听到和理解一样。这会让一些人感到紧张，尤其是那些来自图形界面背景的人，在图形界面中，点击或链接要么有效，要么无效。如果你是一位与对语音技术不熟悉的客户打交道的产品/项目经理，最好尽早解释这一点，并在优化开始前提醒他们。你所能做的就是遵循最佳实践和你所学到的一切，进行尽可能多的测试，并在发布前使交互和语法尽可能健壮。这就足够了。\n\
  \n优化通过扩展话语覆盖范围来改善对用户所说内容的处理，这可以通过在基于规则的语法中添加短语，或在统计模型中添加训练短语来实现。如果识别效果不如预期，优化可能涉及修改参数设置或使用更多数据进行训练。它可能涉及应用或调整你在第\
  \ 12 章中学到的一些技术，包括跳过列表、N-best 和置信度阈值。它可能涉及扩大识别范围，以包含某些单词的替代发音。你可能需要优化你的话语到含义的关联。这可能涉及修改短语到意图的映射，或者将一个意图拆分为几个更详细的意图，每个意图都需要新的提示、行为和语法。正如你将在本章中学到的，优化远不止调整语法。优化本身很少以代码为中心，但可以预期代码需要更改以支持必要的提示和流程更改。这就是为什么将优化纳入任何项目计划（包括测试和重新部署生产代码）如此重要的原因。\n\
  \n你会遇到用户困惑的迹象，以及你的用户并未如你所愿那样成功的证据。这间接表现为用户似乎连续两次提出相同的问题。如果你能访问录制的话语或超出语法范围的话语日志，你可能会发现你未曾预料到的请求和措辞。其中一些问题通过对话更改或提示的措辞或重音更改来解决；其他问题则是覆盖范围和意图映射的问题。\n\
  \n所有这些都归结为一件事：只有那些在系统上线后为了自身需求与你的 VUI 进行交互的真实用户，才能提供数据，向你展示你是否做出了正确的设计和开发选择。\n\n\
  \n\n#### 为什么识别准确率还不够\n\n高准确率的 ASR 是 VUI 成功的先决条件。它是你构建稳健意图和更智能对话的基础。但这还不够。原因如下：\n\
  \n-   正确识别用户的词语只是第一步。\n    -   正如你在第 16 章所学到的，如果你依赖平台对用户话语的自动文本解释，你只能看到平台“听到”的内容。转录文本仍然是黄金标准，是事实依据。转录由训练有素的专业人员完成，包含准确的细节，描述停顿发生的位置和时长、不寻常的发音、口吃、重新开始、沮丧的喊叫、背景噪音、旁白，甚至说话者清晰的情绪状态——所有影响识别结果的因素。没有它，你的解释将基于有限的数据，你可能会试图以次优的方式“修复”某些问题，甚至让问题变得更糟。你担心用户饮酒过多，因为你在饮食日记日志中看到了`liquor`。于是你到处添加警告提示……直到你发现有些人只是非常喜欢`licorice`（甘草糖），并且被误识别了。\n\
  \n-   正确理解用户的话语是第二步。\n    -   正确识别词语只是任务的一部分；接下来是提取正确的含义，而这更难。遗憾的是，对我们来说，人们通常不会用那些更容易理解的完整且语法正确的句子来说话。你如何理解只有几个词的不完整句子？如果你的购物\
  \ VUI 听到用户说`BY`，你该怎么办？它是指`bye`（再见）还是`buy`（购买）？如果你搞错了，用户会不高兴。\n\n-   发现并处理用户话语中的难点能带来更大的成功。\n\
  \    -   如第 16 章所述，如果你的平台只提供那些被解释为某种含义的话语的自动结果，你将无法了解此范围之外的话语的任何信息。你会很高兴地在饮食日记日志中看到，这个月吃了`broccoli`（西兰花）的用户数量翻了一番……直到你拿到转录文本，发现他们都吃了`broccoli\
  \ tempura`（天妇罗西兰花），而这个词被截断了，因为你没有包含对`tempura`（天妇罗）的处理。你早期的数据收集显示人们想了解保险范围，但现在却没人问了。如果没有覆盖范围外的数据，你就不会知道这是因为他们不说`insurance`（保险），而是说`Is\
  \ this covered?`（这个保吗？）\n\n-   最终，你需要知道真实用户是否成功。\n    -   任何做过用户体验工作和可用性测试的人都知道，无论为设计提供信息做了多少研究，都无法替代真实用户在真实世界情境和环境中与\
  \ UI 交互的数据。这对语音也同样适用。研究为假设提供信息，进而转化为设计。使用原型进行的受控实验让你离重要的数据更近一步；来自试点和完整产品发布的用户数据总能提供你未曾预料到的话语和行为。识别器或通用数据集中没有任何内置功能可以预测真实语音数据的所有变化。\n\
  \n#### 分析系统性能不佳的原因\n\n你已经设置了环境来跟踪和测量一整套指标，有了基线数据，现在你正在获取第一批交互日志以及来自用户研究和调查的数据。你如何知道这些指标真正意味着什么？如果某些结果不佳，你又该如何应对？你的语音系统性能受到许多因素的影响，这意味着你需要从多个角度来分析性能。换句话说，你需要应用几种调优方法：\n\
  \n-   **核心 ASR 引擎性能**：除非你从头开始创建 ASR 引擎，否则除了选择可用的最佳引擎外，你能做的很少。在某些开发环境中，你可能能够更改一些识别参数值。\n\
  \n-   **输入语音信号的质量**：这可能是由用户环境中的麦克风质量差、背景噪音或旁白引起的。你无法事后修复糟糕的信号，但有时可能存在间接的解决方案，例如在提示语中添加额外指令或采用多模态回退策略。\n\
  \n-   **用户的语音**：到现在为止，你应该已经明白 ASR 远非完美。如果你正在构建一个美式英语系统，你的情况会比大多数其他语言好。不是因为英语有什么魔力，而是因为这些语言模型是在海量数据上训练的。此外，有些人的语音似乎无缘无故地难以识别。间接解决方案可能再次成为你的最佳选择。其他选项包括扩展发音词典或训练说话人相关模型（如果你有能力的话）。\n\
  \n-   **语法覆盖范围**：如果人们使用了你没有考虑到但对该任务来说是合理的词语，现在就添加它们。如果语法中已有的词语被误解为其他词语，则可能需要进行更深入的修复。\n\
  \n-   **理解和意图映射**：如果人们询问了你未包含的内容，你会看到他们在问什么。你可以决定现在如何处理这些请求，以及何时扩展未来的功能。\n\n-  \
  \ **提示语的措辞和传达**：如果用户发现词语和问题令人困惑或出乎意料，他们的回答就会不那么明确。回答中的任何犹豫或不确定性都会导致更高的语法外率和误接受/误拒绝率，而冗长啰嗦的提示语可能会使用户错过关键信息。\n\
  \n-   **对话路径的灵活性和清晰度**：如果用户询问映射到通用功能（如帮助、重复、返回）的内容，或者你看到大量重试或对话未完成就结束的情况，那么设计中的某些内容很可能需要重新审视。你可能忽略了用户上下文或任务心智模型中的某些内容，这导致了混淆，现在需要额外的选项或对话路径。\n\
  \n在本章的其余部分，你将学习如何解释收集到的数据以发现并解决问题。由于平台对开发者开放和可用的内容存在限制，你并不总能以最理想的方式解决问题。好消息是，可用的内容在不断变化。主要的语音开发平台都雇佣了经验丰富的人员，他们理解限制第三方访问的原因和后果——数据安全和用户隐私是一个重要因素。他们正在努力寻找恰当的平衡点。因此，你在本章学到的内容将帮助你理解各种调优问题的根本原因，并向你展示如何利用你当前拥有的访问权限和能力来解决问题，而不是将讨论局限于当前任何单一平台上可用的内容。\n\
  \n\n\n### 调优类型与方法\n\n广义上讲，调优要么侧重于系统性能，要么侧重于用户成功与满意度。你对此应该不会感到惊讶——这两者其实是重叠的：用户不会对一个性能不佳的系统感到满意或取得成功——但这仍然是一个方便的划分方式。系统性能可以通过自动化或无监督流程、受控离线实验，以及更手动和有针对性的方法进行追踪、衡量和改进。\n\
  \n表 17-1 总结了你已经学过的概念——所有这些都与调优相关。通常，你希望最大化/增加某些指标（`+`），同时最小化/减少其他指标（`-`）。\n\n**表\
  \ 17-1** 调优概念及示例（假设为单数字语法）\n\n| **IG** | 语法内 | `+` | 被相关语法覆盖；匹配预期内容。 | `\"0\"–\"\
  9\"` → `[0]–[9]` |\n| **OOC** | 覆盖范围外 | `-` | 对话此部分未覆盖的任何话语。 | `\"twenty\"` |\n\
  | **OOG** | 语法外 | `-` | OOC 加上噪音、片段或旁白。 | `\"twen- twenty\"` |\n| **CA** | 正确接受\
  \ | `+` | 被当前语法覆盖并按预期匹配。 | `\"nine\"` → `[9]` |\n| **CR** | 正确拒绝 | `+` | 未被当前语法覆盖，因此按预期被拒绝。\
  \ | `\"fine\"` → `[no match]` |\n| **FA-in** | 语法内错误接受 | `-` | 被当前语法覆盖，但匹配了其他语法内内容。\
  \ | `\"five\"` → `[9]` |\n| **FR** | 错误拒绝 | `-` | 被当前语法覆盖，但未被识别或匹配。 | `\"five\"\
  ` → `[no match]` |\n| **FA-out** | 语法外错误接受 | `-` | 未被当前语法覆盖，但匹配了其他语法内内容。 | `\"fine\"\
  ` → `[9]` |\n\n你的关注点取决于你的 VUI 做什么。对于成本较低的任务，比如回答一般性问题或播放歌曲，你的目标是提高 CA，而对 FA-in 或\
  \ FA-out 的担忧较少。对于错误后果更严重的任务，比如支付金额或药物名称，你会重点最小化 FA。FA-in 或 OOG 的变化很容易量化。有多少用户到达对话中的某个点或提出特定请求的变化也是可以量化的，但如何提高他们对此的满意度往往不那么直接。\n\
  \n我们还可以区分不同类型的语法调优。你已经看到了几种指定语法的方法（“语法”是所有方法的便捷统称）：标准的 Dialogflow 方法，即添加训练短语并将 NLU\
  \ 视为黑盒；以及基于规则/正则表达式的 NLU，当你有大量专业术语时（例如在医疗应用中），这种方法非常有用。在调优此类专业应用时，了解规则在何处失效至关重要，这样你才知道如何修复它们。规则比大多数统计方法更具可追溯性和可解释性。\n\
  \n**成功提示 17.1** 性能不佳绝不是用户的错\n\n这也不是你的“错”，但你必须在这里扮演成年人的角色。无论你做什么，都不要因为用户未能成功而责怪他们。你的\
  \ VUI 需要采取高姿态。你怀着最好的意图创造了这个东西：你认为你的提示语很清晰，并且你试图告诉人们如何回应。如果用户未能成功，这些都不重要——这是你的作品，虽然它不是人类，但你需要教会它用人类语言的现有规则和用户群体的期望进行交流。\n\
  \n#### 基于日志的调优与基于转录的调优\n\n调优涉及分析收集到的对话数据、识别问题、提出解决方案、运行离线实验、对生产系统进行更改，最后重新测量和迭代。你的大部分调优工作可以并且将会是基于日志的调优。性能和事务日志可以非常快速地提供系统性能的合理准确图景。所有主要平台都有某种类型的日志记录功能，你也可以添加自己的日志记录——内置的日志记录通常非常通用，这是必然的。如果你可以访问系统架构中的特定数据库，你显然可以使用更多细节来进行更有意义的日志记录。自动生成的日志为你提供了第\
  \ 16 章中识别率、用户响应、确认和重试次数的近似值。通过事务日志记录，你还可以很好地了解用户的完整对话路径。有了这些信息，你可以找到问题区域，甚至对可能的问题进行一些分析。\n\
  \n每个进行调优的人都会做一些基于日志的调优。但为了最准确地进行所有调优活动并找到解决问题的最佳方案，你需要可靠的**话语转录**。请记住第 10 章的内容，转录是由经过训练的人员聆听记录的用户话语后打出的文本。从识别器获得的文本表示是对系统听到的最佳假设的解释；因此，它永远无法保证完全准确。如果你真的想知道用户说了什么，就不能依赖识别器的文本假设。转录需要详细、一致且准确，因为它们是你要分析和比较结果的“答案”。经过训练的转录员不仅会转录话语中的单词，还会注释单词片段和听到的噪音类型。这种详细程度为你提供了重要线索，让你了解出现问题时哪里出了错。因此，我们建议不要使用未经训练的众包助手进行转录。相反，应寻找提供专业转录服务的公司。对于较小的数据集和较简单的系统，你或团队中注重细节的人可以进行转录。\n\
  \n并非每个人都能进行基于转录的调优，原因很简单：平台不允许访问任何话语的音频录音。这包括大多数家庭助手实现。大多数基于转录的调优是针对大型企业系统进行的，这些系统非常注重保护录音安全。有些调优是在\
  \ VUI 作为专有硬件的一部分时进行的。你甚至可以找到一些方法来录制测试用户的话语以获取转录文本。通过搭建麦克风和录音设备获得的数据远胜于没有数据：即使通过如此简单的方式，你也能从收集到的词语、发音和犹豫中了解到很多信息。\n\
  \n无法访问真实用户的话语录音和转录会限制你深入解决某些问题的能力。但不要绝望：即使没有这些数据，也有简单的方法可以提高系统性能。一旦你了解了人们如何说话和理解语音（就像你现在这样），你就知道要寻找什么，并且可以进行一些快速的日志分析来识别潜在问题。按时间顺序组织你的结果，保留每个话语的时间戳。然后：\n\
  \n*   查找两个相邻的相同或相似请求的实例。除非它们是导航命令，例如 `next`，否则这表示有人因为第一次尝试失败而重试。\n*   查找对 `stop`、`cancel`\
  \ 和 `repeat` 的请求。然后调查这些请求之前发生了什么。\n*   查找时间间隔非常短的相邻请求，或者打断你的 VUI 提示语的请求。这可能意味着用户一意识到响应不是他们想要的就打断了。\n\
  \n\n\n"
- "# 排版后的文本\n\n*   查找任何无意义的语句，比如打字时可能出现的搞笑自动更正结果。大声读出结果，看看它听起来是否与符合语法的内容相似。例如，一个朋友的名字是`Nils`，但各种语音助手会把他的名字变成`Niks`。\n\
  *   寻找确认回复中高比例的`no`回复；大量的`I don’t know`、`go back`和`help`；以及在期望有语音输入的地方却没有输入。这些都是某些功能运行不佳的危险信号。\n\
  \n收集并分组所有相似的例子。你已经具备了识别许多常见问题并开始调优所需的条件。即使我们有额外的数据，我们仍然使用这些方法。你可能拥有的另一个调优数据来源是我们在第\
  \ 16 章提到的“赞/踩”用户反馈数据——调查任何用户给出“踩”的内容，以便你能确定其原因。\n\n#### 覆盖范围调优\n\n覆盖范围指的是一个短语是否在语法规则中。当覆盖范围良好时，大量预期的领域内语音输入都在语法规则内（IG）。这是性能最重要的方面之一：识别器可以非常擅长理解用户所说的话，但如果这些词语没有与正确的概念关联起来，用户将无法被理解。\n\
  \n覆盖范围调优（或语法调优）的目标是获得高 IG 率和低 OOG 率。你开始进行覆盖范围调优时，需要确定用户可能会说的核心词汇和短语、同义词以及载体短语（或填充短语，例如`I\
  \ like to…`或`Could you…`），以及他们说出这些内容时的含义。这通过分析语音输入日志并运用你对人们在特定语境下可能说什么的知识来完成。然后，你通过将缺失的短语添加到基于规则的语法或映射到适当意图的训练集中来改善覆盖范围。添加词汇和短语是最基本、最常见的调优类型——如果你只做一种调优，那就是这个。\n\
  \n在“是/否”语法中调优覆盖范围比在食物名称语法中更容易，因为语音输入更可预测且变化更少。然而，即使是“是/否”语法也需要调优。你已经了解了一步修正法：如果你在“是/否”确认中遇到高\
  \ OOG 率，请查找内容修正。确保你根据 VUI 提示的措辞拥有适当的载体短语。例如：\n\n*   **VUI**    *Do you know your\
  \ prescription number?*\n*   **User**    *Yes,* ***I do****.***\n*   ***~ ~ ~    ~\
  \ ~ ~***\n*   **VUI**    ***Did you get*** *a prescription number?*\n*   **User**    *Yes,*\
  \ ***I did****.***\n*   ***~ ~ ~    ~ ~ ~***\n*   **VUI**    ***Is that*** *the\
  \ right prescription number?*\n*   **User**    *Yes,* ***it is****.***\n\n如果你的语音平台允许你访问\
  \ OOG 语音输入日志或音频文件，那太好了。你可以学到比仅仅添加哪些词汇更多的东西，包括用于意图调优和对话调优的数据。只要用户从你的 Google Action“内部”（在首次调用之后）与它对话，你确实可以在\
  \ Dialogflow 中访问一些可用于调优的 OOG 语音输入文本结果。但是，由于 Actions on Google（以及类似的 Amazon Alexa）的整体架构，你无法洞察用户在你的\
  \ Action“外部”（当调用和请求是同一语音输入的一部分时）所说的任何 OOG 语音输入。这是这些助手平台与完全封闭的自定义系统或构建在某些企业级平台上的系统之间的一个重要区别。这种区别影响了你进行覆盖范围调优时可以依据的\
  \ OOG 数据。\n\n有些系统具有动态语法：根据上下文变化的语法，例如航班行程或电话联系人列表。要调优这些语法，你需要额外的日志记录级别，包括特定请求当前使用的语法，这可能与上一个或下一个请求使用的语法不同。对于某些类型的语法，覆盖范围过度生成也可能是一个需要在调优期间解决的问题。\n\
  \n##### 来自语音前线\n\n一位前同事最近告诉我们，他如何被指派更新一个用于识别各种应用中常见的政府字母数字序列的语法。他向我们报告说，这个语法在几个方面“严重不足”。它已经\
  \ 15 年没有更新，因此与新的序列格式以及在此期间所做的其他更改不一致。它还只允许在字符串的某些位置使用`A for alpha`，而在其他位置则不允许。像这样维护不善的语法会导致用户的负面体验，因为本应是有效的语音输入却被不合适的语法拒绝。这是一个重要的提醒：在发布后很长一段时间内，可能仍然需要维护和调优资源。\n\
  \n#### 歧义调优\n\n当你为语法增加覆盖范围时，你可能没有意识到你已经将同一个条目映射到了多个含义。你的语法越大，这种情况就越容易发生，比如所有处方药或金融股票的名称。如果测试没有发现这个问题，结果就是用户陷入死胡同，因为他们只能依靠音频而不是视觉文本：\n\
  \n*   **User**    *Call Ann Jones.*\n*   **~ ~ ~** VUI 找到两个拼写略有差异的条目 **~ ~ ~**\n\
  *   **VUI**    *Which one? Ann Jones or Anne Joanez?*\n*   **User**    *… Ann Jones!*\n\
  *   **VUI**    *Which one? Ann Jones or Anne Joanez?*\n*   **User**    **@#!!*\n\
  \n确保所有条目都有无歧义的短语，并且没有歧义的死胡同。对于处理大型共同基金语法的金融语音系统来说，这是一个必要且关键的步骤。当然，如果你能完全控制或访问数据（例如药品名称数据库），进行彻底的歧义调优会更直接。但即使你无法访问用户的联系人列表，你也可以为此进行调优。首先，你需要基于发音而非拼写来定义条目匹配规则。这就是我们在第\
  \ 10 章末尾提到的`Soundex`算法派上用场的地方。此外，添加一个跳过列表。这可以防止 VUI 一遍又一遍地询问同一个名字。对于发音相同的名字（如本例所示），你还需要使用任何其他可用且对用户有帮助的信息（例如`in\
  \ area code 650`或`in Menlo Park`）来添加一个消歧机制。\n\n\n\n#### 识别准确率调优\n\n识别准确率调优与覆盖范围调优密切相关。它指的是系统在正确识别符合语法的短语的同时，拒绝不符合语法的短语的能力。请记住，识别器会寻找最接近的最佳匹配。这个匹配是一个`吸引子`。如果没有足够接近的`吸引子`，就可能无法匹配。覆盖范围越大，意味着吸引子空间越拥挤。\n\
  \n准确率调优的目标是尽可能准确地识别出尽可能多的短语，并将它们正确归类为符合语法或不符合语法。换句话说，你希望获得高比率的正确接受符合语法话语和正确拒绝不符合语法话语，同时降低错误接受不符合语法话语和错误拒绝符合语法话语的比率。此外，你还希望降低将符合语法话语错误匹配到其他符合语法内容的情况——这通常是最难处理也最重要的问题。你可以在表\
  \ 17-2 中看到这些识别错误的一些示例，以及常见的解决方案。\n\n**表 17-2** 识别错误示例\n\n| 错误类型 | 用户所说 | 识别结果 |\n\
  | --- | --- | --- |\n| **FA-in** | *预订五位* | 识别为“预订**九**位” |\n| **FA-out** | *我给我女儿打了电话……*\
  \ | 识别为“给我**医生**打电话” |\n| **FR-in** | *续配泼尼松* | 被拒绝 |\n\n这些示例说明了为什么错误接受比错误拒绝更糟糕：让用户再试一次，总比错误地理解他们的请求要好。这些示例也说明了为什么你需要转录文本。只有当你拥有一个“正确答案”来比较识别结果时，才能进行错误计算，而详细的转录文本能指出问题所在，以便你进行解决。\n\
  \n你可能会看到一些报告，称人们的语音系统现在已改进到能处理 80% 的请求。这实际上很糟糕——想象一下，与一个每五个词就误解一个的人交谈。准确率必须尽可能高，因为归根结底，如果词语被误解，就不可能有成功的对话。\n\
  \n识别错误还会在多轮交互中累积，因为用户需要重试并走上意想不到的路径。大多数语音科学家会持续调优，直到符合语法正确接受率至少达到 90% 以上，且错误接受/错误拒绝率降至个位数。\n\
  \n**成功提示 17.2** 你不能用统计数据证明一切\n\n高符合语法率从来都不是全部。如果有人告诉你，他们的语音系统在 1000 条话语上达到了 98%\
  \ 的符合语法正确接受率，表现非常出色，你应该立即询问不符合语法率。如果一个语音用户界面只接受一小部分短语，那么在这些短语上的表现很可能会非常出色。但如果与此同时，有同样多的语句被拒绝，那么从用户的角度来看，整体表现很可能非常糟糕。\n\
  \n随着语法规则变得更大更复杂，错误风险也会增加，识别率自然会有所下降。如果你的语法规则只有两个词，那么你的所有错误率可能都非常低！在深入探讨准确率之前，让我们先看看四种你可能有权或无权访问的特定类型的准确率调优——如果你有权访问，它们将适用于表\
  \ 17-2 中的示例。\n\n##### 声学混淆度调优\n\n无法保证不符合语法的话语一定会被拒绝，或者符合语法的话语一定会被接受。语法覆盖范围应尽可能广泛，以帮助解决此问题，同时不给你带来麻烦。*你可能会问，更大的覆盖范围会带来什么麻烦呢？*\
  \ 一个潜在的问题是，当语法规则包含多个发音相似的单词或短语时。这可能导致冲突，其中一个词项充当其他相似单词的`吸引子`，从而导致错误的映射（无论是错误接受-符合语法还是错误接受-不符合语法）。`吸引子`通常是一个比其他词更常见的词。例如，在一个通用语音系统中，*umbrella*（雨伞）比\
  \ *Enbrel*（恩利，一种药物名）更常见；因此，说出药物名称的人可能会被错误地识别为在说雨具。要特别注意，提示语中使用的示例短语不应容易混淆。如果容易混淆，请更改其中一个或多个短语，以尽量减少虚假吸引子。\n\
  \n##### 词典调优\n\n在语音领域，词典定义了用户对语法或语音系统中每个单词的所有预期发音方式。大多数平台允许你为新的或现有的单词添加发音。如果你注意到某个特定单词的错误接受-符合语法率或错误拒绝-符合语法率很高，那么为该单词添加或修改发音可能是解决方案。有时，解决一个错误接受-符合语法问题甚至需要更改另一个单词的发音。词典调优与声学混淆度密切相关。当你的语音用户界面需要理解品牌或产品名称时，这两者通常都很重要。当语音用户界面的领域影响单词的发音方式时，它们也很重要，就像你刚刚看到的\
  \ *Enbrel*-*umbrella* 示例一样。\n\n##### 置信度阈值\n\n你在第 12 章和第 13 章中了解了多层识别。如果你的系统使用多层识别，并且你看到“是”或“否”的响应比例很高，这表明需要更改阈值。你的目标应该是将两者都降到最低：过多的“是”意味着不必要的确认；过多的“否”意味着返回了错误的结果，识别准确率需要进一步调查。\n\
  \n##### 超时和概率参数\n\n一些语音开发平台允许你访问较低级别的参数设置。你在第 12 章中了解到，在某些情况下，例如对于以四位一组方式读出的 16\
  \ 位信用卡号，较长的超时时间是合适的。如果你看到似乎因用户分心而导致的不完整截断短语，那么超时时间过短很可能是罪魁祸首。通过应用作为识别假设权重的概率，你可以影响`吸引子`的强度以及最终结果。当存在特定领域的混淆性，并且你希望不常见的词比常见词更频繁地被识别时，这非常有用。同样，这也适用于\
  \ *Enbrel*-*umbrella* 示例。它也非常适合削弱通用命令和隐藏命令，同时仍使其可用。\n\n在撰写本文时，Actions on Google\
  \ 和 Dialogflow 不允许你控制许多这些低级别参数，但随着越来越多的开发者构建更复杂的语音用户界面，这些功能可能很快就会推出，而且 Google Cloud\
  \ API 确实提供了一些。一些企业级和其他云自动语音识别平台允许为特定领域指定自定义短语或语言模型。这是改变概率的一种方式。例如，微软正在扩展其云自动语音识别引擎的功能，允许你使用\
  \ 10 小时的语音数据创建自定义声学模型，并使用包含 100 万个单词的文本创建自定义语言模型。^(¹¹⁵)\n\n\n\n##### 深入解析：从示例短语构建准确性\n\
  \n让我们通过一个简单的例子来实践。回想一下第 11 章中介绍的 `tcrMakeAppointment` 意图，它涵盖了表示*我想预约*的请求。表 17-3\
  \ 展示了该意图的一些短语如何根据语法覆盖范围和领域进行分类。正如你在前一章所学到的，语法内（IG）和语法外（OOG）是清晰的概念：一个短语要么包含在语法中，要么不包含。如果你处理的是基于规则的语法，那么语法内的内容很可能会被正确识别，但由于本章中你正在了解的其他各种因素，这并非总是如此。如果你的语法覆盖范围基于训练短语（就像\
  \ Dialogflow 的默认情况那样），那么哪些话语属于语法内就不那么明确了。任何作为训练短语包含的内容都极有可能被正确接受为语法内，但其他话语需要与你的训练短语有多相似才能被捕获呢？判断一个短语是否属于领域内（ID）——即对于任务来说合理但未被语法覆盖的话语——则更加模糊，因为这涉及主观判断，尤其是在处理相似意图之间的边界时。一个完美的识别/解释系统会对所有领域内短语给出\
  \ 100%的正确接受（CA），并对所有领域外（OOD）短语（即其含义与意图中其他短语有显著差异，且在 VUI 上下文中具有重要意义的话语）给出 100%的正确拒绝（CR）和\
  \ 0%的错误接受（FA）。让我们逐一分析表 17-3 中的六个示例。\n\n**表 17-3** 按语法覆盖范围和领域包含情况对示例短语进行分类\n\n| 短语\
  \ | 语法（内/外） | 领域（内/外） | 结果 |\n| --- | --- | --- | --- |\n| *Make an appointment.*\
  \ | IG | ID | CA |\n| *Make an appointment for three.* | IG | ID | CA |\n| *Make\
  \ an appointment for three PM.* | IG | ID | CA |\n| *Can I make an appointment?*\
  \ | OOG | ID | CA |\n| *I’d like to make an appointment.* | OOG | ID | CA |\n| *I\
  \ need to cancel my appointment.* | OOG | OOD | FA |\n\n前三个示例明显属于领域内（ID）。它们也属于语法内（IG）；你在第\
  \ 11 章中添加了它们。这就是人类专家创建的正则表达式规则型语法和定义的解析规则，与基于机器学习、从训练短语中算法生成的“模糊逻辑”语法之间的区别所在。前者易于测试以确定哪些在语法内、哪些不在。后者则依赖于他人基于你的示例训练短语构建的算法和模型。对于基于机器学习的模糊逻辑（如\
  \ Dialogflow 中的），你希望它能够**泛化**，即理解那些你没有作为训练短语输入，但与已输入且对意图有意义的短语相似的话语。\n\n现在来看接下来的两个短语：*Can\
  \ I make an appointment?* 和 *I’d like to make an appointment.*。在大多数上下文中，这些是应包含在同一意图中的合理同义短语，因此它们也属于领域内，但目前它们属于语法外，因为你尚未将它们添加为训练短语（或者如果你使用正则表达式语法，则未包含在其中）。如果该意图是“关于工具功能集的直接问题”，那么\
  \ *Can I make an appointment?* 将属于领域内，而此示例中的所有其他短语将属于领域外。正如你所见，需要根据 VUI 所覆盖的具体需求和情况来仔细指定意图。上下文始终很重要。\n\
  \n尽管 Dialogflow 尚未针对这些短语进行训练，但它返回了正确的意图：领域内，正确接受。太棒了！再次强调，泛化意味着你无需输入每一个可能的短语——Dialogflow\
  \ 会为你处理大部分工作。相比之下，基于规则的语法本身不会进行泛化。\n\n现在让我们看最后一个示例：*I need to cancel my appointment*。这个短语显然不是预约意图中可接受的同义短语。但\
  \ Dialogflow 返回了意图 `tcrMakeAppointment`，因此这是一个领域外、错误接受（FA）的情况。\n\n发生了什么？由于 Dialogflow\
  \ 的内部运作对你来说是一个黑盒，你无法完全确定，但可以猜测。在这种情况下，系统似乎强烈依赖于 *appointment* 这个词。如果你尝试其他包含 *appointment*\
  \ 的变体，例如 *change appointment*、*move my appointment* 等，它仍然会返回意图 `tcrMakeAppointment`。这些都是语法外且领域外的错误接受。在调优过程中，你需要查看所有语法外的话语，并决定如何处理它们。如果它们属于领域内，则将这些短语添加到你的训练集（或规则）中；如果它们属于领域外，则可以自我肯定一下，因为你处理得当。但你知道吗？在这种情况下，从用户的角度来看，它碰巧正确工作，多少有点运气成分——我们稍后将用更稳健的方法来修复它。\n\
  \n问题在于：正如你在本书中学到的，永远无法保证话语 X 会映射到期望的意图，即使该话语在基于规则的语法或训练集中明确写出。如果它不属于语法或训练集的一部分，则更无法保证。在这个例子中，一个错误接受（FA）按照你所期望的方式被泛化了。下一次，它可能会映射到另一个意图。你绝对不希望这种情况发生在与健康相关的\
  \ VUI 中。通过调优，你可以增加话语被正确处理的机会。泛化可能是一件好事，它能让非专业人士在构建对话式应用方面走得更远。但要注意其中的陷阱，并对用户实际所说的内容（例如取消或修改预约）进行广泛的测试。你不仅需要用领域内的示例进行测试，还需要用领域外的示例进行测试，以确保两者的行为都符合预期。\n\
  \n现在，让我们修复这个问题。如果某个意图吸引了很多领域外的话语，你需要创建另一个意图，并用这些话语对其进行训练。这是因为识别的工作原理：它基本上会尝试将听到的所有内容与某些东西进行匹配。因此，如果用户要求更改或取消预约，你需要有相应的意图来支持这些操作。这里要做的就是简单地添加一个新意图\
  \ `tcrCancelAppointment`，将所有 *cancel* 相关的话语（以及你认为用户会说的其他话语）映射到这个意图，然后重新训练。添加这个意图并不意味着你需要在\
  \ VUI 中实现取消功能。相反，这个意图可以简单地回复类似*如果您需要取消或更改预约，请致电您的医生办公室*的内容。这样，你很可能会为 `tcrCancelAppointment`\
  \ 获得一个领域内的正确接受，而不是为 `tcrMakeAppointment` 获得一个错误接受——这将带来更好的用户体验。\n\n这是一个非常有用的方法，应该广泛使用。它能让你的\
  \ VUI 更智能、更广泛，而几乎不需要额外的工作。即使用户要求你未支持的功能，你也可以为这些请求添加一个意图，并用相关短语进行训练。现在，你可以用一句有用的提示来回应，比如*我无法做到这一点，但您可以尝试以下操作*，而不是仅仅说*抱歉*，或者更糟的是，冒着给出错误答案的风险。永远不要依赖拒绝（领域外正确拒绝）来正确处理问题；要为任何相关的短语创建新的意图。如果可用，置信度阈值对此也很有用。\n\
  \n\n###### 显式知识方法如何处理“*我需要取消预约*”？\n\n这是你在第 11 章中遇到的斯坦福解析器。它正确地拒绝了这条语句。请记住，其中一条规则是依赖树的根节点必须是`make`或其同义词。在这个例子中，根节点会是`cancel`。与\
  \ Dialogflow 相比，显式解析器方法更关注句子的主要动词（`make` vs. `cancel`），而对宾语（`appointment`）的关注较少。实际上，我们的解析规则要求动词必须是`make`，并且存在直接宾语，具体来说是`appointment`，在这种情况下，规则会正确执行。\n\
  \n你会反复看到这种权衡：易用性和简洁性 vs. 努力、性能和系统透明度。只有你自己才能决定你希望处于权衡尺度的哪一端；你只需要做出明智的决定，并理解其中的利弊。我们鼓励你在\
  \ Dialogflow（或你使用的任何平台）中亲自尝试表 16-1 中的短语。尝试添加一些相似但映射到不同意图的短语。如果大量相似的短语映射到一种方式，而只有一个短语映射到另一种方式，会发生什么？在你的\
  \ VUI 上下文中，如果某个短语必须始终被正确识别，但该短语与其他具有不同含义的短语相似，那该怎么办？比较在变化载体短语与核心内容时的行为。真正了解在你的世界中影响准确性的因素——这是你语音系统成功的关键。\n\
  \n#### 查找和使用识别准确率数据\n\n在第 16 章中，你了解到当前 Dialogflow 内置工具在提供用于准确性调整所需数据方面有些局限。是时候向你展示如何绕过这一点并找到一些真实数据了。事实上，你确实有一些选择。\n\
  \nGoogle Cloud 有一个运维套件，以前称为 Stackdriver，你可以用它来获取大量应用程序数据。你在使用 Dialogflow 时一直在使用\
  \ Google Cloud，当你开始在第 7 章中使用 webhook 时，你更多地使用了 Google Cloud，特别是 App Engine。运维套件是众多\
  \ Google Cloud 组件中的另一个；它提供了一个统一的框架，用于将应用程序数据记录到集中位置，以便后续处理。其他云服务，如 AWS 和 Microsoft\
  \ Azure，也提供类似功能——如果你在其他平台上工作，了解这一点很有帮助——但由于本书主要围绕 Google 生态系统，我们将重点介绍运维套件。要使用它，请点击\
  \ Dialogflow 客户端设置，方法是点击左侧面板中客户端名称旁边的齿轮图标。你会看到选项`Log interactions to Google Cloud`。点击它以启用日志记录。图\
  \ 17-1 展示了这一点。\n\n![../images/507213_1_En_17_Chapter/507213_1_En_17_Fig1_HTML.jpg](img/507213_1_En_17_Fig1_HTML.jpg)\n\
