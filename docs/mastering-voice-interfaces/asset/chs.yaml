  \ --- | --- | --- |\n| 不完整回复比例高，且比预期短：*我的电话号码是 415*…（预期为十位数字）。 | 语音结束（EOS）超时时间过短。用户提供的信息通常按片段说出。\
  \ | 延长 EOS 超时时间。保持麦克风开启，直到检测到匹配字符串。允许通过按钮/屏幕输入并以#号结束。 |\n| 确认环节中*是*的回答比例高。 | 置信度阈值设置过高。不必要的步骤使对话变长，可能惹恼用户。\
