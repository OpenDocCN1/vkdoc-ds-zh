  **图 4-2** 示例手术准备语音应用的高级对话流程


  #### 步骤 3：识别潜在复杂性


  一旦你定义了想要包含的功能，就需要确定每个功能将面临哪些语音解决方案的挑战。你的结论将直接影响你如何构建对话流程，正如你在本书中所学到的。它还能识别出哪些功能最好留待以后处理。在这里，理解语音变得至关重要。


  本章的其余部分将精确地围绕这一重点进行详细发现，询问：“在现有资源、平台选择、时间线等条件下，语音的复杂性在哪里，哪些地方可能出错？”复杂性的两个核心方面是变化性和成本。


  从变化性开始，再看一下图 4-2。你可能马上就能看到一些潜在的挑战：你在第 2 章中学到，用户话语中不受约束的变化性对 VUI 来说是一个挑战。嗯，人们可以询问的食物种类非常多！而且有些食物是模糊的：如果用户询问米饭是否可以，VUI
  需要澄清或消除歧义，因为白米和糙米的纤维含量不同。所以`FoodSearch`会很棘手。而且由于变化性和复杂性会随着需要填充的槽位增多而增加，`FoodDiary`甚至更棘手：有人可能在一个单一话语中列出整餐的食物。`MedSearch`需要一些努力——你不仅需要理解成千上万种药物的名称，还需要数据访问权限来提供正确的响应。`Contact`意味着访问某个联系人列表，以及找到实际连接的方法。但名字列表是受限的，所以它应该比所有食物更容易处理。`Schedule`呢？假设信息已经输入，告诉某人他们的手术时间并不困难，但创建或更改预约则要复杂得多。


  成本呢？这里的成本不是指金钱，而是误解某事的后果。如果你的 VUI 误识别了一个食物的名称，如果问题是关于卡路里数量或寻找餐厅，其成本要低于涉及手术前一天可以吃什么的问题。潜在错误的成本越高，你就需要投入越多的精力来最小化其发生。对于这个应用，任何导致准备不充分的响应都会带来不良手术结果、重新安排、时间和金钱损失等后果。显然这不好。再次强调，`FoodSearch`和`MedSearch`是危险信号。对于`Contact`，风险在于联系错了人；对于`Schedule`，风险在于提供了错误的预约时间。


  你最终会得到类似表 4-8 的内容。每个人都需要这些信息。销售人员需要这种意识来提供准确的报价。包括设计师在内的技术团队，既用它来确定方法，也用于详细的开发和测试。产品和项目经理需要这种级别的信息和理解，来规划详细的时间线，并评估在
  MVP 和完整项目中应包含哪些功能。你也会参考这些信息来决定成功指标。


