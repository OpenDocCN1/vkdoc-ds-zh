- '# 排版后的文本


  我们将声音组合成单词、将单词组合成短语和句子以传达含义的方式，也存在无穷无尽的变化。其中许多变化是相关的，例如具有不同含义的单词；而另一些变化则与短语的核心含义无关，比如说
  `yes` 还是 `yeah`，或者是否存在不流畅现象——那些犹豫、重新开始以及发音中的小卡顿，比如 `um` 和 `er`，作为听者，我们通常非常擅长忽略这些。不流畅是口语区别于书面语的一个方面。


  面对所有这些无穷无尽的变化，人们又如何能理解任何事物的含义呢？你可能会想起学校的经历并指出，“Wanna get some food?” 甚至不是“规范的英语”。如果我们像写作那样说话，我们应该说“Do
  you want to…”或者至少是“Want to…”，但这听起来会异常正式。


  我们之所以能够进行交流，是因为我们运用了各种策略和“参与规则”。我们“知道”这些规则；我们很难解释清楚它们，但我们肯定知道它们何时被打破。我们也期望其他对话参与者遵守同样的规则。词语组合的预期含义以及可接受的互动方式，是我们特定文化和语言中学习并与他人共享的内容。


  轮流发言就是其中一条规则。双方参与者不能同时说话和倾听而不影响沟通效果，因此他们需要轮流发言，并感知何时该从说话切换到倾听，反之亦然。轮流发言的具体细节取决于对话的目标、参与者之间的关系以及他们共同的文化背景。


  另一条规则是保罗·格莱斯的合作原则：对话参与者通常会努力为达成共同目标做出贡献。^(²¹) 当我说 `Can you close the window?` 时，我期望你实际去关上窗户，而不是回答
  `Yes, I can` 然后什么都不做。从表面上看，这只是一个简单的是/否问题，因此要做出恰当回应，需要的不仅仅是词汇和语法知识。打破参与规则可能是一种刻意的幽默来源——至于另一位参与者是否觉得好笑，则是另一个问题，它本身也有一套参与规则。你将在后续章节中了解更多关于这条规则及相关规则的内容。


  另一个相关的沟通模型是弗里德曼·舒尔茨·冯·图恩的四侧模型。^(²²) 该模型强调，所有信息都有四个侧面：事实、自我表露、关系和诉求。说话者通过这四个侧面过滤每一条信息，但在不同时间侧重点不同。听者则通过相同的过滤器接收信息，但很可能每个侧面的接收程度也不同。


  人们通过学习和使用语言以及与其他说话者互动，或多或少地自动学会了这些“规则”。人们也期望他人具备相同的能力，以便能够讨论广泛的话题。这使得语音成为一个基于规则的、富有成效且惊人稳健的系统，它由（对我们而言）有限的单元组成，这些单元可以以无限的方式组合。其结果是一个极其强大的沟通系统——也是一个非常人性化的系统（图
  2-7）。


  ![../images/507213_1_En_2_Chapter/507213_1_En_2_Fig7_HTML.png](img/507213_1_En_2_Fig7_HTML.png)


  图 2-7


  语音遵循自然语言的“规则”，例如合作原则


  清晰对于被理解显然很重要，但清晰意味着精确。法律文件力求精确以避免歧义，因此篇幅很长。如果我们说话必须像法律文件那样不做出任何假设，对话将永无止境。问题在于，有时假设是错误的。两个人的概念永远不会完全相同，因为心智模型基于过往经验和认知偏差。他们会假设自己的心智模型有多少是与对话伙伴共享的。表述越模糊，听者就越需要要么假设，要么澄清。当你提议去吃午餐时，你的朋友正确地听到了你的话，但如果你对细节表述不清呢？如果你想吃拉面，而你的朋友想吃披萨呢？如果你的朋友理解了你对午餐的想法但不想吃拉面，这次对话还算成功吗？你如何知道哪些内容需要澄清以及需要澄清到何种详细程度？有些假设比其他假设更需要验证。诀窍在于知道哪些是哪些（图
  2-8）。


  ![../images/507213_1_En_2_Chapter/507213_1_En_2_Fig8_HTML.png](img/507213_1_En_2_Fig8_HTML.png)


  图 2-8


  语音是共享假设并了解对话伙伴的一些情况


  作为听者，我们常常会错过所说内容的一部分。如果对话主题很熟悉，你可能会漏掉一两个词，但仍然能把握整体大意，因此这个过程可以相当稳健。在其他时候，你可能会误解或听到一些模棱两可或含糊不清的内容。如果你的朋友用你完全听不懂的词语回应，对话就失败了：你要么需要再试一次，要么请求澄清，要么放弃。你会使用消歧、澄清、核实和确认等策略来修复错误，并达到一定程度的理解信心水平，这些策略你将从第
  7 章开始了解更多。如果你当时问你的朋友 `Wanna get some ramen?`，答案可能就不同了。也许你的朋友当时应该问 `Where’re we going?`
  或者 `Can we get pizza?`（图 2-9）。


  ![../images/507213_1_En_2_Chapter/507213_1_En_2_Fig9_HTML.png](img/507213_1_En_2_Fig9_HTML.png)


  图 2-9


  语音是澄清歧义以最大程度减少误解并传达共同理解


  进行对话意味着遵循这些潜意识的“规则”：你假设并期望任何说话的人或事物都会以可预测的方式回应和互动，并且他们也期望你如此。你甚至可以在对方毫无察觉的情况下影响他们说话的方式；如果你说话声音更大或更快，你的听者也会如此。试试看。人们在与技术对话时，会本能地应用相同的对话规则和社会期望——即使知道对话对象是机器。这意味着，当对话发生在人类和语音助手之间时，同样的策略也适用。这正是语音用户界面设计成为可能的原因。


  总结人类对话参与者的特征，人类语音沟通的优势在于它几乎是无限的，但又基于规则，并由少量既定单元构成。人类听者面临的挑战在于将信息保存在记忆中以进行解读并据此行动所带来的认知负荷。人们依赖各种策略来避免或修复误解；我们想当然地认为，他人能够理解我们那些模糊和含混的表达。考虑到所涉及的所有步骤，我们竟然能够相互沟通，这真是太神奇了！计算机是如何做到的呢？这听起来很棘手，但别担心！我们正是为此提供帮助的。理解人们如何说话和倾听，就成功了一半。在解释了对话中计算机端的基础知识之后，我们将在本书的剩余部分向你展示如何成功地将所有要素整合在一起。你会看到，利用当今已有的方法和工具，你就能实现巨大的语音应用改进——无需发明新东西。




  #### 计算机：语音识别与理解


  在第 1 章中，你已经了解了语音系统的组成部分。现在让我们深入探讨这些组件，以理解为什么某些方面比其他方面更具挑战性。计算机如何完成人类所做的事情？就像人类既能说话也能倾听一样，计算机也是如此。但计算机必须被“教会”人类所掌握的一切，包括如何处理模糊或歧义的表达。事实上，你的大部分工作将致力于减少和处理错误结果。与人类一样，计算机需要策略来最小化识别错误和理解错误；需要确认、纠正和验证；还需要解决歧义。它们不需要使用与人类相同的底层策略——也不会使用，因为它们的构建方式不同——但从人类的角度来看，最终结果必须相同，甚至更好。因此，计算机的技巧在于处理人类输入时发挥其优势。


  在最高层面上，计算机有两项任务：第一，捕获用户的语音并将其转化为文字和含义；第二，以有意义且恰当的方式回应用户，可以是口头回应、某种行动，或两者兼有。让我们重新审视第
  1 章中介绍的语音系统（图 2-10），并展开一些细节；重叠方框的原因很快就会明了。这两项核心任务可以进一步细分为以下五个步骤，在图中编号为 1-5：


  ![../images/507213_1_En_2_Chapter/507213_1_En_2_Fig10_HTML.png](img/507213_1_En_2_Fig10_HTML.png)


  图 2-10


  语音优先系统扩展后的详细说明


  1.  **识别**通过自动语音识别（ASR）捕获语音，并将波形信号频率转换为可用于将该信号映射为音素的格式。


  2.  **理解**使用模式匹配和规则方法，将识别出的音素映射为文本（单词和短语）。


  3.  **意图评估**使用规则匹配方法，将文本结果与其（希望是）预期的含义表示进行映射。


  4.  **意图解析与执行**尝试通过适当的行动或回应来满足已理解的请求。


  5.  **计算机语音回应**包含两个核心方面：内容（所选词汇、详细程度等）及其传递方式（录制语音与合成语音、情感语调、语音性别等）。


  当你的用户询问“*哪里有好吃的？*”时，识别的第一部分捕获模拟波形并将其转换为数字表示（图 2-11 中的 A）。这是通过以非常频繁的固定间隔测量或采样波形来完成的。识别器使用**声学模型**将数字表示映射到特定的音素（B）。最好的声学模型是使用各种算法和方法在大量语音数据上训练出来的。语言模型（LM）通过将音素字符串映射到最接近的单词和文本字符串来解释它（C）。相互竞争的映射会有一个相关的可能性或置信度分数，该分数取决于上下文和其他因素（D）。置信度分数可用于从众多映射中选出最可能的一个，解析也是如此。当你在手机上口述消息却得到错误的文本结果时，置信度的正确分配往往是失败的原因。置信度用于一些强大的技术，我们稍后会向你展示。获胜的假设会根据语法和/或统计模型进行评估，这些模型将文本映射到意图，即其含义的表示（E）。此时，通常认为的识别和意图映射已经完成，但用户尚未从中获得任何东西。最后一步是基于上下文生成适当的回应，并提供所请求的内容或信息（F）。


  ![../images/507213_1_En_2_Chapter/507213_1_En_2_Fig11_HTML.jpg](img/507213_1_En_2_Fig11_HTML.jpg)


  图 2-11


  计算机理解并回应短语的详细过程


  每一步都可能出现问题。如果计算机在过程早期就选错了假设，一个人类很容易忽略的小错误可能会像滚雪球一样扩大，以至于在过程结束时，结果变得毫无意义，这种情况在人类对话中永远不会发生。背景噪音和其他声音尤其成问题。如第
  1 章所述，近年来识别性能有了很大提升，但并非完美，你在手机上口述时很容易就能发现这一点。大声说出任何句子；你会意识到你并不是孤立地说出单词，而是作为一个连续的字符串，声音混合在一起，一个单词流入下一个单词，并影响其发音方式。如果你犹豫、重新开始或在某个单词上打嗝，生成的转录很可能不是你想要的。如果一个声音处于两个音素模式匹配的边缘，而意外的匹配获胜，就可能导致错误的单词边界，最终将“*engulfing
  them all*”理解为“*and golf in the mall*”。解析成单词很难；为这些单词赋予预期的含义可能更难。即使识别性能出色，如果文本到意图的映射不够稳健，意图解析步骤也会失败。


  你可能主要处理步骤 3 和 4（意图评估、解析与执行）。这些步骤是你为每个用户请求指定应发生什么的地方。在 Alexa 或 Google Assistant 等平台内工作与在原生解决方案中工作的主要区别在于，平台提供了一个黑盒子的便利，为你处理许多细节，特别是涉及从步骤
  2 到步骤 3 的过渡。为了这种便利，你放弃了在更早步骤中访问和影响结果的好处，稍后你会看到这一点。


  关于计算机如何处理语音，首先要理解的是，这一切都关乎模式匹配，并在每一步从众多可能的假设中选出最佳假设。识别器的目标是找到最佳答案，即与其所知内容的最佳匹配——可以将其想象为一组磁铁，试图抓住抛向它们的东西。识别器会创建许多假设，这些假设会随着每一段新声音的输入而更新。每个新的声音片段都提供了额外信息，影响所有活跃假设的概率（每块磁铁的强度）。在语音开始时，需要保持大量假设活跃，因为后续信息可能会将理解的尺度倾向另一个音素、另一个单词等。上下文有助于人类和计算机减少潜在的假设，并发生在语音的各个层面：对对话参与者的预期、对话主题及其相关术语的知识、语法结构、前面的单词和声音等。虽然上下文被对话双方使用，但认知负荷显然不是计算机关心的问题。它可以在捕获和分析额外语音输入的同时，并行保持许多假设。


  并行跟踪多个假设使得 ASR 成为可能。上下文和约束减少了可能的匹配数量，逐渐使一个假设浮出水面。当用户语音结束时，得分最高的语音假设获胜。通常，会有一个获胜者的得分明显高于其他假设。有时，这个最高得分并不高，或者只是略高于其他假设。这意味着计算机对最佳结果的准确性不太有信心。此时，计算机会根据设置和预定标准做出决定。




  - 如果置信度低于某个选定的阈值，则拒绝该模式。如果原本应该选择该假设，则属于错误拒绝；如果拒绝是正确的做法，则属于正确拒绝。

  - 如果置信度高于阈值，则接受该模式。如果它是“错误答案”，则属于错误接受；如果它与用户的预期话语匹配，则属于正确接受。


  显然，任何“错误”的结果都应避免，并在发生时进行处理。您将在第 10、12 和 13 章中了解更多关于如何处理这些情况的内容。


  **成功提示 2.2 设定合理的期望**


  设定合理的期望对于 VUI 的成功至关重要。这意味着要向用户阐明您的实现对于某个主题具备何种程度的知识。这并非易事。在 VUI 内部，您依赖于 VUI 所说内容的措辞。在
  IVR 中，VUI 通常以菜单或带有说明性示例的开放式问题开始。VUI 越通用，难度就越大，但可以在无法完成某些操作时的响应中传达大量信息。您将在第 12 和
  13 章中了解这一点。在 VUI 交互之外，这涉及营销、销售和资源材料。广泛的信息检索从一开始就是谷歌的核心；Alexa 最初的关注范围则更有针对性，例如播放音乐和天气等少数信息领域。用户不一定知道这一点。他们只知道一个助手能回答而另一个不能。您会看到博客文章和文章将不同的助手相互比较，比较哪个“更聪明”。请务必阅读这些以及您遇到的任何其他与语音相关的内容。从中学习，但明智的做法是对任何结论持保留态度。


  并非所有事情对可怜的计算机来说都很难。方言可能并不像您想象的那么具有挑战性。^(²³) 在内存中保存信息或生成一长串假设对计算机来说显然不是挑战。相反，挑战在于以一种人类易于理解的方式呈现这些信息。


  总结一下语音对话中计算机方面的情况，其优势在于大规模并行计算，有助于确定将声音映射到单词或短语的特定假设。但它有时仍会灾难性地失败。其弱点包括必须被教导在充满变化、模糊性的信号中理解“一切”的意图，以及需要某种程度的推理或推断的更广泛的世界知识。


  #### 人机语音对话


  那么，您现在已准备好开始创建两个具有截然不同优势和劣势的参与者之间的对话。为语音进行开发意味着平衡这些优势和劣势：如果您按照人类的期望和限制来构建，您的用户将会成功并留下来。要做到这一点，请记住，语音交互完全关乎声音，即使有辅助的视觉支持。表
  2-1 总结了我们刚刚讨论的人类和计算机的特征，比较了各自的优势和劣势。我们在本章前面的午餐示例中涵盖了所有这些特征，前五个是人类语言的特征，后两个是任何音频流的特征。


  **表 2-1** 人类与计算机对语音产生特征感知的比较


  | 语音产生特征 | 人类的感知挑战 | 计算机的感知实现挑战 |

  | --- | --- | --- |

  | 离散性 | 极小 | 巨大 |

  | 基于规则 | 极小 | 巨大 |

  | 生产性与无限性 | 极小 | 巨大 |

  | 置换性 | 极小 | 巨大 |

  | 习得性与社会性 | 一些 | 巨大 |

  | 线性与顺序性 | 巨大 | 极小 |

  | 短暂性 | 巨大 | 极小 |


  您之前了解到，人类与技术的所有互动本质上都是社交互动，语音更是如此。人们对任何支持语音的设备的期望直接影响他们如何与 VUI 设备对话。计算机响应的每个方面都会设定关于其能力的期望，并影响用户将如何与之交互。当您与技术对话时，您会应用相同的对话规则，即使您知道它不是一个人。这就是语音的魅力——也是诅咒：每个人“都知道如何进行对话”。如果您希望您的语音交互无处不在且表现良好，您就不需要向用户解释如何与您的语音助手对话。任何属于目标用户群体的人，都应该能够凭借其固有的知识成功使用，而无需特殊培训。


  这使得语音不同于其他技术和模式，并将责任放在您（作为开发者）身上，要求您充分了解人们如何进行对话，以帮助他们成功。很少有事情比系统无法兑现承诺更让语音技术用户感到沮丧。我们多年来在行业中的自身经验强调，与语音设备的头几次交互将决定用户愿意继续使用语音并信任它的程度。早期的成功至关重要。当然，随着时间的推移，一些用户会调整他们所说的话以便被理解，变得更“像计算机”——合作原则预测了这一点。但其他用户在此之前就会放弃尝试，因为他们无法得到他们要求的东西。如果用户需要改变才能成功，那么对话将仍然受限。只有当允许人们像人一样说话时，语音交互才能真正变得无处不在。当用户面对新的语音情境时，他们会依赖与人交谈时的期望，遵循人类对话的参与规则，正是因为语音如此“人性化”。他们会根据语音助手说了什么以及如何说的来做出假设并做出回应。作为听众，我们甚至会对说话者是谁产生相似的情感反应和判断。这似乎是无法避免的。


  **成功提示 2.3 让用户早期获得成功**


  成功的早期互动能提高用户满意度和持续使用的可能性。旨在通过包含一两个非常简单且稳健的交互，让用户的首次语音交互获得成功。


  好消息是，您越了解人们如何自然地说话和倾听，就越能通过为每种情境设计和实现正确的行为来避免灾难性的失败。




  当你为语音进行开发时，需要意识到，只要语音用户界面（VUI）在监听，人们随时可能说出任何内容。这是图形用户界面（GUI）与听觉型 VUI 之间最大的区别之一：即使你明确告诉用户*说“是”或“否”*，他们也可能出于合理原因说出其他内容，比如*“也许”*。或者他们会用你意想不到的词语回应，比如*“好嘞”*或*“当然啦”*。又或者他们在回应前会咳嗽或犹豫。如果这些声音被
  VUI 作为输入捕获，你必须要么做出回应，要么在确定是无意噪音时找到忽略它的方法。如果用户说的是合理的内容，你不能简单地要求他们换用其他词语。


  然而，这一点很重要：虽然从技术上讲你确实无法限制人们说什么，但根据**合作原则**，人们也的确希望沟通并成功完成任务。人们在**如何**表达、语音质量、发音以及用词上存在巨大差异——正如你在本章所学，变异是人类语言的一部分。但人们**说什么**通常比你想象中更具可预测性。绝大多数用户会停留在某个领域和任务的预期范围内——这也是语言的一部分。有些人会试图捉弄你的
  VUI，在订披萨的过程中突然说些题外话，比如*“谁赢了最近的 F1 比赛？”*。好吧。如果这不是你的核心用例，就不应成为你的关注点。不要试图处理每一种变异，尤其是在起步阶段。只需专注于根据任务或领域预测预期变异，最大化识别准确率，并正确解读领域内话语的含义。


  ### 成功技巧 2.4 措辞直接影响用户的回应方式


  在进行语音开发时，始终从自问“两个人在类似对话中如何交流”开始。预测回应、使用的词语、对话的下一步、可能产生困惑的地方等。以此为基础设计你的 VUI 对话。使其清晰易懂。你通过
  VUI 提示语的措辞和表达方式影响用户的回应。你的 VUI 对话越清晰，用户的回应就越可预测——每个人也就越成功。


  GUI 与 VUI 的差异总结在表 2-2 中。我们还将文本机器人纳入此比较。移动应用机器人兼具 GUI 和 VUI 的相似之处：由于是视觉化的，它们不像语音那样转瞬即逝；由于输入是书面语言，它们可以像语音一样使用不受约束的语言。


  #### 表 2-2

  **视觉界面与语音界面的差异**


  | GUI/视觉界面 | 机器人/视觉语言 | VUI/音频语言 |

  | --- | --- | --- |

  | 用户输入大多是**受约束的**（点击、轻触、输入）。 | 用户输入可以是受约束的（轻触）或不受约束的（打字）。 | 用户输入**无法被约束**（可以说任何内容）。
  |

  | 信息**持续存在**，直到用户离开（文本、图像）。 | 信息持续存在，直到用户离开（文本）。 | 信息**转瞬即逝**，用户无法控制信息流（音频）。 |

  | 信息**并行**呈现（整个屏幕或页面）。 | 信息线性呈现（一次一个字符）。 | 信息**线性**呈现（一次一个声音）。 |

  | 与人类沟通的等价性有限（基于与物理对象的相似性产生预期）。 | 与人类沟通有熟悉的等价性（基于与短信的相似性产生预期）。 | 与根深蒂固的**社会**行为高度相似（基于与人类语言的相似性产生预期）。
  |


  ##### 多模态角落


  人类处理视觉信息与音频/语音信息的基本差异提醒我们，即使处理的是词语，书面语言和口语也截然不同。这就是为什么用语音改造视觉界面效果不佳：它既没有利用人们自然说话的方式，也没有考虑用户聆听和处理信息的挑战——因此需要优先考虑语音设计。这也是为什么从语音列表中选择很棘手。轻触屏幕很容易，但想象一下图
  2-12 中的对话：可怜的用户将很难记住所有选项以便做出选择。在语音中呈现选项列表是可行的，但你需要知道如何呈现选项以及如何处理回应。在屏幕上从结果中选择显然认知负荷更低；这与用语音提出复杂请求（而非打字或导航）的较低认知负荷相得益彰。只需记住，对于大多数用例，你需要设计出既适用于用户能看到并触摸屏幕时，也适用于他们无法看到屏幕时的语音提示。如果用户输入是语音，通常可以假设音频输出是可接受的。


  ![../images/507213_1_En_2_Chapter/507213_1_En_2_Fig12_HTML.png](img/507213_1_En_2_Fig12_HTML.png)


  **图 2-12** 对于通过听觉而非视觉获取的列表，认知负荷很高


  ### 成功技巧 2.5 VUI 关乎声音，因此要用声音来评估


  通过文字看到信息与仅通过听觉接收相同信息是不同的。在规划任何语音交互时，务必通过向他人大声朗读来进行合理性检查，观察他们在哪里犹豫以及如何回应，尤其是当他们说出你意料之外的内容时。


  现在你理解了，当 VUI 设备需要准确处理单个用户话语时所涉及的复杂性。在典型的对话中，存在来回互动，每一轮都建立在前一轮所说和理解的内容之上（图 2-13）。这意味着需要追踪更多上下文，以避免每一步出现误解。成对的对话轮次有时被称为**相邻对**。它们很重要，因为它们限制了你在第二轮中需要处理的变异。你将在本书中看到更多关于话轮转换的内容。


  ![../images/507213_1_En_2_Chapter/507213_1_En_2_Fig13_HTML.png](img/507213_1_En_2_Fig13_HTML.png)


  **图 2-13** 对话包含多个轮次，每一轮都建立在前一轮的基础上


  很好！你的语音 UI 已将用户话语映射到某种含义。但工作尚未完成——直到你做出回应或满足用户请求。如果用户要求听某首歌的特定版本，但音乐服务提供商与该艺术家没有协议，你可能只能回应一句*“抱歉，我无法处理这个请求”*。还记得本章开头那个例子吗？当用户说“播放《Let
  It Be》”时，结果却听到了“Let It Be Love”？这是因为搜索使用了模糊匹配，并且偏向于包含后者而非前者的音乐库。这种方法本身没有错，但细节决定成败。你可能实现了完美的识别，并为用户话语赋予了正确的含义，但仍然因为无法执行命令而失败。用户只会注意到他们没有获得想要的东西；他们不知道哪里出了问题。这是当今语音助手最容易被忽视的方面之一，并且不容易妥善解决。这就是**语音的三条腿凳子**（图
  2-14）：用户只知道他们从凳子上摔了下来；他们不知道也不关心原因，或者哪条腿断了。


  ![../images/507213_1_En_2_Chapter/507213_1_En_2_Fig14_HTML.png](img/507213_1_En_2_Fig14_HTML.png)


  **图 2-14** 语音的三条腿凳子




  ### 成功技巧 2.6 不要承诺无法实现的语音用户界面


  如果用户得不到他们想要的东西，他们不会关心哪里出了问题。要在真实用户环境中，遵循实际的生产限制，将交互推进到“真正”的终点。与其增加运行不佳或未经测试的新功能，不如专注于把少数事情做好。尽可能提供解释；如果用户感到被理解，他们会更宽容你无法满足他们的要求，这一点与人类交往类似。


  对人类来说天生容易的事情对计算机来说却很困难，反之亦然。这就是你作为语音开发者面临的挑战：在平衡用户对人类语音对话的期望与技术限制的同时，还要平衡人类的认知局限与技术优势，如表
  2-3 所示。方便的是，第三列是对语音设计与实现核心原则的简明总结。


  **表 2-3** 语音的挑战与核心设计原则


  | 语音是…… | ……这对……构成挑战 | ……因此请运用核心 VUI 设计原则来…… |

  | --- | --- | --- |

  | 线性且转瞬即逝 | 用户，由于认知负荷 | 平衡清晰度与效率 |

  | 无限多样 | 识别与理解，由于变化性 | 通过覆盖范围最大化准确性与鲁棒性，以避免错误并支持优雅恢复 |

  | 具有社交性 | 生成与理解，由于缺乏对世界的认知模型 | 融入预期的对话策略、上下文以及用户与领域知识，以支持自然的对话式交互 |


  ### 下一步是什么？


  在继续之前，请再看一眼表 2-3。语音优先开发的每一个方面都源于这张表的内容。可以说，整本书都聚焦于此，无论是解决歧义的策略、处理回指、应对变化、理解措辞如何影响响应、选择何时以及如何确认，甚至知道何时停止尝试理解用户。


  当然，人类理解语音的能力也并非无限。你的牙医可能无法帮你调试代码，或弄清楚为什么你的烤箱打不开。他们不会提出正确的问题来分析问题，但你也不会期望他们这样做。思考一下如何为语音应用设定场景，让用户凭直觉知道他们能做什么、不能做什么。


  如果你是一名开发者，你不需要自己成为 VUI 设计师，但你需要理解语音的特性，以便专注于重要的事情。你已经走在正确的路上了！无论你的角色是什么，我们推荐阅读 Nass
  和 Brave 合著的 *Wired for Speech*——这本书信息丰富且非常有趣。^(²⁴) 如果你想深入探究语音和语言中声音的细节，可以寻找涵盖声学、发音或听觉语音学、感知与生成的书籍。若想了解语言处理背后的认知原理，请查阅
  Jeff Johnson 的 *Designing with the Mind in Mind*。^(²⁵) 如果你对人类言语中的意义层次感兴趣，可以寻找关于话语、言语行为、话轮转换和会话分析（包括相邻对）的书籍和文章。^(²⁶)


  在第 3 章中，你将开始深入实现，首先从搭建你的语音开发环境开始。魔鬼总在细节中，而在语音领域，你将花费大量精力处理这些细节。语音用户的要求很高——恰恰因为它是语音。好消息是，通过理解人们使用语音时哪些事情容易、哪些具有挑战性，你已经领先于那些仅仅因为工具易用就盲目构建的人。你将具备开发出用户能够成功交互的产品所需的条件。成功的用户就是快乐的用户。那么，让我们开始帮助用户走向成功吧！


  ### 总结


  *   语音具有与视觉和触觉模态截然不同的特性：它转瞬即逝、线性且无限多样。为语音进行设计与开发必须迎合这些特性。

  *   VUI 是两个具有不同优势与劣势的参与者之间的对话。成功的 VUI 通过应用核心 VUI 原则，建立在双方优势之上。

  *   用户无法被约束；他们能够也将会说出任何话。你的 VUI 需要以符合用户期望的方式进行引导、预测和响应。

  *   人类对话建立在话语中未明确表达的信息和假设之上。这些指代、世界知识、上下文以及对过去和未来交互的引用，也需要由计算机来处理。

  *   为了使对话成功，VUI 必须正确识别用户说出的词语，正确理解其含义，并要么给出用户期望的结果，要么提供无法做到的原因。


