  \ `$month` 被填充了，因为用户只说了这个。日期和年份来自上一个 `DOB` 意图，但它们现在不处于激活状态。我们该怎么办？\n\n你需要去处理 webhook，对于单步修正你还没有做这一步。你需要\
  \ webhook 来保存来自 `DOB` 收集的日期参数，并在用户只修正日期的某一部分时使用它们。实际上，你需要为两个不同的意图做一些事情；我们一个一个来处理。\n\
  \n首先，对于 `DOB` 意图，你需要将日期参数 `month`、`day` 和 `year` 保存到输出上下文 `confirmDOB` 中。请记住，你可以从\
