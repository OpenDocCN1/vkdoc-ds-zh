    Stacked bar plot of data


    ```

    > data;

    1 2 3 4 6 8

    3 3 4 3 5 0 0

    4 4 4 0 4 0 0

    5 0 2 0 1 1 1

    ```


    To plot a grouped bar chart, you can use `beside=TRUE`:


    ```

    > data(mtcars);

    > data  data;

    1 2 3 4 6 8

    3 3 4 3 5 0 0

    4 4 4 0 4 0 0

    5 0 2 0 1 1 1

    > png(file="D:/barchart.png");

