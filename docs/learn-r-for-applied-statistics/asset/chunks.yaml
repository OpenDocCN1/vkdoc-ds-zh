    after another, just like adding one layer after another layer.


    You can add in a scatter plot (Figure [5-20](#471585_1_En_5_Chapter.xhtml#Fig20))
    using the `geom_point()` function :


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig20_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig20_HTML.jpg)


