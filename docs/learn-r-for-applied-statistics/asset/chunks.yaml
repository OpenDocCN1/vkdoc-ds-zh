    # Introduction


    ## Who is this book for?


    This book is primarily targeted to programmers or learners who want to learn R
    programming for statistics. This book will cover using R programming for descriptive
    statistics, inferential statistics, regression analysis, and data visualizations.


    ## How is this book structured?


    The structure of the book is determined by following two requirements:


    | Topic | Chapters |

    | --- | --- |

    | Introduction to R and R programming fundamentals | 1 to 3 |

    | Descriptive statistics, data visualizations, inferential statistics, and regression
    analysis | 4 to 6 |


    * This book is useful for beginners to learn R programming for statistics.

    * This book is useful for experts who want to use this book as a reference.


    ## Contacting the Author


    More information about Eric Goh can be found at [`www.svbook.com`](http://www.svbook.com).
    He can be reached at `gohminghui88@svbook.com`.


    # Acknowledgments


    Let me begin by thanking Celestin Suresh John, the Acquisition Editor and Manager,
    for the LinkedIn message that triggered this project. Thanks to Amrita Stanley,
    project manager of this book, for her professionalism.


    It took a team to make this book, and it is my great pleasure to acknowledge the
    hard work and smart work of Apress team. The following are a few names to mention:
    Matthew Moodie, the Development Editor; Divya Modi, the Coordinating Editor; Mary
    Behr for copy editing; Kannan Chakravarthy for proofreading; Irfanullah for indexing;
    eStudioCalamar and Freepik for image editing; Krishnan Sathyamurthy for managing
    the production process; and Parameswari Sitrambalam for composing. I am also thankful
    to Preeti Pandhu, the technical reviewer, for thoroughly reviewing this book and
    offering valuable feedback.


    ### About the Author and About the Technical Reviewer


    ### About the Author


    ### About the Technical Reviewer


    # 1. Introduction


    In this book, you will use R for applied statistics, which can be used in the
    data understanding and modeling stages of the CRISP DM (data mining) model. Data
    mining is the process of mining the insights and knowledge from data. R programming
    was created for statistics and is used in academic and research fields. R programming
    has evolved over time and many packages have been created to do data mining, text
    mining, and data visualizations tasks. R is very mature in the statistics field,
    so it is ideal to use R for the data exploration, data understanding, or modeling
    stages of the CRISP DM model.


    ## What Is R?


    According to Wikipedia, R programming is for statistical computing and is supported
    by the R Foundation for Statistical Computing. The R programming language is used
    by academics and researchers for data analysis and statistical analysis, and R
    programming’s popularity has risen over time. As of June 2018, R is ranked 10th
    in the TIOBE index. The TIOBE Company created and maintains the TIOBE programming
    community index, which is the measure of the popularity of programming languages.
    TIOBE is the acronym for “The Importance of Being Earnest.”


    R is a GNU package and is available freely under the GNU General Public License.
    This means that R is available with source code, and you are free to use R, but
    you must adhere to the license. R is available in the command line, but there
    are many integrated development environments (IDEs) available for R. An IDE is
    software that has comprehensive facilities like a code editor, compiler, and debugger
    tools to help developers write R scripts. One famous IDE is RStudio, which assists
    developers in writing R scripts by providing all the required tools in one software
    package.


    R is an implementation of the S programming language, which was created by Ross
    Ihahka and Robert Gentlemen at the University of Auckland. R and its libraries
    are made up of statistical and graphical techniques, including descriptive statistics,
    inferential statistics, and regression analysis. Another strength of R is that
    it is able to produce publishable quality graphs and charts, and can use packages
    like `ggplot` for advanced graphs.


    According to the CRISP DM model, to do a data mining project, you must understand
    the business, and then understand and prepare the data. Then comes modeling and
    evaluation, and then deployment. R is strong in statistics and data visualization,
    so it is ideal to use R for data understanding and modeling.


    Along with Python, R is used widely in the field of data science, which consists
    of statistics, machine learning, and domain expertise or knowledge.


    ## High-Level and Low-Level Languages


    A high-level programming language (HLL) is designed to be used by a human and
    is closer to the human language. Its programming style is easier to comprehend
    and implement than a lower-level programming language (LLL). A high-level programming
    language needs to be converted to machine language before being executed, so a
    high-level programming language can be slower.


    A low-level programming language, on the other hand, is a lot closer to the machine
    and computer language. A low-level programming language can be executed directly
    on computer without the need to convert between languages before execution. Thus,
    a low-level programming language can be faster than a high-level programming language.
    Low-level programming languages like the assembly language are more inclined towards
    machine language that deals with bits 0 and 1.


    R is a HLL because it shares many similarities to human languages. For example,
    in R programming code:


    ```

    > var1 <- 1

    > var2 <- 2

    > result <- var1 + var2

    > print(result)

    [1] 3

    >

    ```


    The R programming code is more like human language. A low-level programming language
    like the assembly language is more towards the machine language, like `0011 0110`:


    ```

    0x52ac87:      movl7303445 (%ebx), %eax

    0x52ac78:      calll         0x6bfb03

    ```'
