  raw: '## Conclusion


    In this chapter, you looked into R programming. You now know that inferential
    statistics and descriptive statistics are the main branches of statistics. Descriptive
    statistics derives a summary from the data set and uses central tendency, dispersion,
    and skewness. Inferential statistics describes and makes inferences about the
    population and the sampled data. In inferential statistics, you use hypothesis
    testing and estimating of parameters.


    You learned that the `apply()` function can perform a loop to go through the data
    and apply a function. The function can be a `mean()` function from R or it can
    be a customized function.


    You also found out that sampling is the selection of a subset of a population.
    The population is the data from everyone. Sometimes a sample can be a subset from
    a full data set. The advantages of sampling are that the cost is lower and the
    data collection is more efficient than collecting the data from everyone in the
    population.


    You also learned that correlation is a statistical association to find how close
    two variables are and derive a linear relationship between them.


    You also learned that covariance is a measure of variability between two variables.
    The greater value of one variable and the greater of another variable means or
    will result in a covariance that is positive. The greater values of one variable
    to the lesser values of the other variable will result in a negative covariance.


    You also learned how p-values help you determine the significance of your statistical
    tests results. Your claim in the test is known as a null hypothesis and the alternate
    hypothesis means that you believe the null hypothesis is untrue.


    You also learned that a t-test is one of the more important tests in statistics.
    A t-test is used to determine whether the mean between two data points or samples
    are equal to each other. The null hypothesis means that the two means are equal,
    and the alternative means that the two means are different.


    You also learned that the chi-square test is used to compare the relationship
    between two categorical variables. The null hypothesis means that there is no
    relationship between the categorical variables.


    You also learned that ANOVA is the process of testing the means of two or more
    groups. ANOVA also checks the impact of factors by comparing the means of different
    samples. In a t-test, you test the means of two samples; in a chi-square test,
    you test categorical attributes or variables; and in ANOVA, you test more samples.


    You also learned that nonparametric tests are tests that do not require the variable
    and sample to be normally distributed. Most of the time you should use parametric
    tests like t-tests, chi-square tests, and ANOVA because they are more accurate.
    You use nonparametric tests when you do not have normally distributed data, and
    the sample data is big.


    You also learned that regression analysis is some form of a predictive modeling
    technique that identifies the relationships between dependent and independent
    variables(s). The technique is used to find causal effect relationships between
    variables.


