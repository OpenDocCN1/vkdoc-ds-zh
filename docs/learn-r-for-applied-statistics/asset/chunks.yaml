    在数据中，3 是灰色，4 是蓝色，5 是黄色。当 x 轴或 x 为 1 时，灰色为 3 步，蓝色为 4 步，黄色为 0 步。见图 5-5。


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig5_HTML.jpg](img/471585_1_En_5_Fig5_HTML.jpg)


