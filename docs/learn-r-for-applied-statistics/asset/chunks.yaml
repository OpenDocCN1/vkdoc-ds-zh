    ## Nonparametric Test


    The nonparametric test is a test that does not require the variable and sample
    to be normally distributed. Most of the time you should use parametric tests like
    the t-test, chi-square test, and ANOVA because they are more accurate. You use
    nonparametric tests when you do not have normally distributed data and the sample
    data is big.


    ### Wilcoxon Signed Rank Test


    The Wilcoxon signed rank test is used to replace the one-sample t-test.


    1.  For each *x*[*i*], for *i* = 1, 2, …., *n* the signed difference is *d*[*i*]=*x*[*i*]-
    *u*[0], where *u*[0] is the given median.


    2.  Ignore *d*[*i*]= 0 and rank the rest of |*d*[*i*]|, using *r*[*i*] as rank.
    When there are tied values, assign the average of the tied ranks. For example,
    |*d*[*i*]| ranked as 3, 4, 5 are ties, so the rank should be ![$$ \frac{\left(3+4+5\right)}{3}=4
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq10.png).


    3.  The number of non-zero *d*[*i*]*s* is found.


    4.  To each rank of *d*[*i*], let *s*[*i*] =  *sign* (*d*[*i*])*r*[*i*].


    5.  The sum of a positive signed rank is calculated using


    ![$$ W=\sum \limits_{s_i&gt;0}{s}_i $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equad.png)


    The test statistics calculated is *W* and the number *n*[1] of non-zero *d*[*i*]*s*
    is calculated.


    The null hypothesis is that the population median has the specified value of *μ*[0].


    *   Null hypothesis: *H*[0] : *μ* = *μ*[0]


    *   Alternate hypothesis: *H*[*a*] : *μ* ≠ *μ*[0]


    The normal test statistics formula is


    ![$$ z=\frac{\left(W-\frac{n_1\left({n}_1+1\right)}{4}\right)-\frac{1}{2}\cdot
    \mathit{\operatorname{sign}}\left(W-\frac{n_1\left({n}_1+1\right)}{4}\right)}{\sqrt{\frac{1}{4}\cdot
    {\sum}_{i=1}^n{S}_i^2}} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equae.png)


    You reject the null hypothesis when


    ![$$ \left|z\right|&gt;{Z}_{\propto /2}, where\kern0.33em Z\sim N\left(0,1\right)
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equaf.png)


    The common alpha, ∝, value is 0.05.


    To use the Wilcoxon signed rank test in R, you can first generate the data set
    using [`random.org`](http://random.org) packages, so that the variables are not
    normally distributed. To use [`random.org`](http://random.org) for random number
    generation, you must install the random packages:


    ```

    > install.packages("random");

