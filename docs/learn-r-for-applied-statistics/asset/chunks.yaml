- fmt: '# Using ggplot2


    `ggplot2` is a package created by Hadley Wickham that offers a powerful graphics
    language for creating advanced charts. `ggplot2` is very popular and famous in
    the R community, and it allows us to create charts that represent univariate,
    multivariate, and categorical data in a straightforward way. R’s built-in functionality
    offers the plotting of charts, but `ggplot` allows us to plot more advanced charts
    using the grammar of graphics.


    To use `ggplot2`, you must install the package:


    ```

    > install.packages("ggplot2");

