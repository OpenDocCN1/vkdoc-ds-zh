    ## Conclusion


    In this chapter, you looked into R programming. You now understand that descriptive
    statistics summarizes the data and usually focuses on the distribution, the central
    tendency, and the dispersion of the data. Data visualization, on the other hand,
    creates graphics from the data to help us understand the data.


    You learned how R programming allows you to plot line charts, bar charts, histograms,
    scatterplots, scatterplot matrices, pie charts, and box plots.


    You also learned about decision trees, which are machine learning algorithms that
    perform both classification and regression tasks. They can be a graph to represent
    choices and results using a tree.


    You also learned about social network analysis graphs, which can help us understand
    the relationships between individuals or nodes. Social network analysis is usually
    used on social network data like Facebook and Weibo. Each node is an individual,
    and the social network graphs show us how each individual connects to others.


    You also explored ggplot2, a package created by Hadley Wickham that offers a powerful
    graphics language for creating of advanced charts. ggplot2 is very popular and
    famous in the R community, and it allows us to create charts that represents univariate,
    multivariate, and categorical data in a straightforward way.


    You also learned the grammar of graphics. ggplot2 focuses on the grammar of graphics.
    The grammar of graphics is the building blocks of a chart.


    You also explored Plotly JS. Plotly JS allows us to create interactive, publication-quality
    charts. You created a Plotly chart using ggplot.


    # 6. Inferential Statistics and Regressions


    Inferential statistics and descriptive statistics are the main branches of statistics.
    Descriptive statistics derives a summary from the data set and makes use of central
    tendency, dispersion, and skewness. Inferential statistics describes and makes
    inferences about the population from the sampled data. In inferential statistics,
    you use hypothesis testing and estimating of parameters. Regression analysis is
    a set of statistical processes to estimate the relationships between all the variables.


    In this chapter, you will look into the `apply()`, `lapply()`, and `sapply()`
    functions and then you’ll sample data and perform correlations and covariances
    plus tests such as p-value, t-test, chi-square test, and ANOVA. You will then
    look into non-parametric tests, which include the Wilcoxon signed rank test, Wilcoxon-Mann-Whitney
    test, the Kruskal-Wallis test, and simple linear regression and multiple linear
    regression analysis.'
