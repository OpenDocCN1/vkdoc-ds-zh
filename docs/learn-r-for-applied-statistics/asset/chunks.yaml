    ## Scatterplot and Boxplot


    A scatterplot is a chart that represents data using points in the Cartesian plane.
    Each point is the value of two variables. A boxplot shows the statistics of the
    data.


    You can plot a scatterplot using the `plot()` function :


    ```

    > x  y  png(file="D:/scatter.png");

    > plot(x, y, xlab="x-axis", ylab="y-axis", main="scatterplot");

    > dev.off();

    RStudioGD


    ```


    `xlab` is the x-axis name, `ylab` is the y-axis name, and `main` is the main title.
    See Figure [5-12](#471585_1_En_5_Chapter.xhtml#Fig12).


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig12_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig12_HTML.jpg)


    Figure 5-12


    Scatterplot


    A boxplot represents how well the data in a data set is distributed, depicting
    the minimum, maximum, median, first quartile, and third quartile. Figure [5-13](#471585_1_En_5_Chapter.xhtml#Fig13)
    explains the boxplot.


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig13_HTML.png](images/471585_1_En_5_Chapter/471585_1_En_5_Fig13_HTML.png)


    Figure 5-13


    Boxplot and its explanation


    To create the boxplot in Figure [5-14](#471585_1_En_5_Chapter.xhtml#Fig14), you
    can use the `boxplot()` function :


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig14_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig14_HTML.jpg)


    Figure 5-14


    Boxplots


    ```

    > set.seed(12);

    > var1  var2  var3  data  png(file="D:/boxplot.png");

    > boxplot(data, main="boxplot", notch=FALSE, varwidth=TRUE, col=c("green", "purple",
    "blue"));

    > dev.off();

    RStudioGD


    ```


    `data` is the data, `main` is the main title, `notch` is a logical value to state
    how medians of different groups match with each other, `varwidth` is a logical
    value to state whether to draw the width of box proportionate to the sample size,
    and `col` is the color of the boxplot.


    You can draw a boxplot with a notch by setting `notch=TRUE` (see Figure [5-15](#471585_1_En_5_Chapter.xhtml#Fig15)):


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig15_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig15_HTML.jpg)


    Figure 5-15


    Boxplots with notch


    ```

    > set.seed(12);

    > var1  var2  var3  data  png(file="D:/boxplot.png");

    > boxplot(data, main="boxplot", notch=TRUE, varwidth=TRUE, col=c("green", "purple",
    "blue"));

    > dev.off();

    RStudioGD


    ```


    ## Scatterplot Matrix


    A scatterplot matrix is used to find the correlation between a variable and other
    variables, and you usually use it to select the important variables, which is
    also known as variable selection.


    To plot the scatterplot matrix in Figure [5-16](#471585_1_En_5_Chapter.xhtml#Fig16),
    you can use the `pairs()` function :


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig16_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig16_HTML.jpg)


    Figure 5-16


    Scatterplot Matrix


    ```

    > set.seed(12);

    > var1  var2  var3  var4  var5  data  png(file="D:/scatterplotMatrix.png");

    > pairs(~var1+var2+var3+var4+var5, data=data, main="scatterplot matrix");

    > dev.off();

    RStudioGD


    ```


    ## Social Network Analysis Graph Basics


    A social network analysis graph is an advanced data visualization; it is not related
    to statistics, but can be good for reference. The following is a fast introduction
    to social network analysis graphs. A social network analysis graph can help you
