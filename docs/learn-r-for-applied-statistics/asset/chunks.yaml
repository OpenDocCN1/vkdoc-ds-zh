    The above data is the result of the mean of every row. `data` is the data, `1`
    is the margin, and `mean` is the function. The margin means that the function
    will be applied to a column when it is 2 and a row when it is 1.


    You can get the mean of each column by using `margin=2`:


    ```

    > apply(data, 2, mean);

    var1     var2     var3

    2.090406 2.892453 3.240930

    ```


    `apply()` and `lapply()` are very similar, just that the output of `lapply()`
    is a list. You can use `lapply()` as follows:


    ```

    > lapply(data$var1, mean);

    [[1]]

    [1] 1.439524

