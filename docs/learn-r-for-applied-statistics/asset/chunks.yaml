  trans: '

    # 多元线性回归


    简单线性回归适用于单个响应变量 `y` 和单个自变量 `x`。简单线性回归的方程如下：


    ![$$ y={b}_0+{b}_1x $$](img/471585_1_En_6_Chapter_TeX_Equbh.png)


    多元线性回归建立在简单线性回归的基础上。当你有多个自变量时，使用多元线性回归。多元线性回归的方程如下：


    ![$$ y={b}_0+{b}_1{x}_1+{b}_2{x}_2+\dots +{b}_k{x}_k+\epsilon $$](img/471585_1_En_6_Chapter_TeX_Equbi.png)


    当数据集中有 `n` 个观测值或行时，模型如下：


    ![$$ {y}_1={b}_0+{b}_1{x}_{11}+{b}_2{x}_{12}+\dots +{b}_k{x}_{1k}+{\epsilon}_1
    $$](img/471585_1_En_6_Chapter_TeX_Equbj.png)


    ![$$ {y}_2={b}_0+{b}_1{x}_{21}+{b}_2{x}_{22}+\dots +{b}_k{x}_{2k}+{\epsilon}_2
    $$](img/471585_1_En_6_Chapter_TeX_Equbk.png)


    ![$$ {y}_3={b}_0+{b}_1{x}_{31}+{b}_2{x}_{32}+\dots +{b}_k{x}_{3k}+{\epsilon}_3
    $$](img/471585_1_En_6_Chapter_TeX_Equbl.png)


    ![$$ \dots $$](img/471585_1_En_6_Chapter_TeX_Equbm.png)


    ![$$ {y}_n={b}_0+{b}_1{x}_{n1}+{b}_2{x}_{n2}+\dots +{b}_k{x}_{nk}+{\epsilon}_n
    $$](img/471585_1_En_6_Chapter_TeX_Equbn.png)


    使用矩阵，可以将这些方程表示为


    ![$$ y= Xb+\epsilon $$](img/471585_1_En_6_Chapter_TeX_Equbo.png)


    其中


    ![$$ y=\left[\begin{array}{c}{y}_1\\ {}{y}_2\\ {}.\\ {}.\\ {}.\\ {}{y}_n\end{array}\right]\kern0.75em
    X=\left[\begin{array}{ccccccc}1&amp; {x}_{11}&amp; {x}_{12}&amp; .&amp; .&amp;
    .&amp; {x}_{1k}\\ {}1&amp; {x}_{21}&amp; {x}_{22}&amp; .&amp; .&amp; .&amp; {x}_{2k}\\
    {}.&amp; .&amp; .&amp; &amp; &amp; &amp; .\\ {}.&amp; .&amp; .&amp; &amp; &amp;
    &amp; .\\ {}.&amp; .&amp; .&amp; &amp; &amp; &amp; .\\ {}1&amp; {x}_{n1}&amp;
    {x}_{n2}&amp; .&amp; .&amp; .&amp; {x}_{nk}\end{array}\right] $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbp.png)


    ![$$ b=\left[\begin{array}{c}{b}_1\\ {}{b}_2\\ {}.\\ {}.\\ {}.\\ {}{b}_n\end{array}\right]\kern1.12em
    and\kern1.12em \epsilon =\left[\begin{array}{c}{\epsilon}_1\\ {}{\epsilon}_2\\
    {}.\\ {}.\\ {}.\\ {}{\epsilon}_n\end{array}\right] $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbq.png)


    要计算系数：


    ![$$ \widehat{b}={\left({X}^{\prime }X\right)}^{-1}{X}^{\prime }y $$](img/471585_1_En_6_Chapter_TeX_Equbr.png)


    你可以在 R 中使用多元线性回归：


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Figi_HTML.jpg](img/471585_1_En_6_Figi_HTML.jpg)


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Figj_HTML.jpg](img/471585_1_En_6_Figj_HTML.jpg)


    ```

    > set.seed(123);

    > x <- rnorm(100);

    > x2 <- rnorm(100);

    > y <- 2.5 + 0.5 * x + 0.3 * x2 + rnorm(100, 0, 0.5);

    > data <- data.frame(x, x2, y);

    > mod <- lm(data$y ~ data$x + data$x2, data = data);

    > mod;

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Coefficients:

    (Intercept)       data$x      data$x2

    2.517425    -0.266343     0.009525

    > summary(mod);

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Residuals:

    Min      1Q  Median      3Q     Max

    -3.7460 -1.3215 -0.2489  1.2427  4.1597

    Coefficients:

    Estimate Std. Error t value Pr(>|t|)

    (Intercept)  2.517425   0.305233   8.248 7.97e-13 ***

    data$x      -0.266343   0.209739  -1.270    0.207

    data$x2      0.009525   0.039598   0.241    0.810


    Signif. codes:  0 ''***'' 0.001 ''**'' 0.01 ''*'' 0.05 ''.'' 0.1 '' '' 1

    Residual standard error: 1.903 on 97 degrees of freedom

    Multiple R-squared:  0.01727,    Adjusted R-squared:  -0.00299

    F-statistic: 0.8524 on 2 and 97 DF,  p-value: 0.4295

    ```


    要在 R 中创建多元线性回归，首先必须创建数据：


    ```

    > set.seed(123);

    > x <- rnorm(100);

    > x2 <- rnorm(100);

    > y <- 2.5 + 0.5 * x + 0.3 * x2 + rnorm(100, 0, 0.5);

    > data <- data.frame(x, x2, y);

    ```


    使用 `lm()` 函数创建多元线性回归模型：


    ```

    > mod <- lm(data$y ~ data$x + data$x2, data = data);

    > mod;

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Coefficients:

    (Intercept)       data$x      data$x2

    2.517425    -0.266343     0.009525

    data$y ~ data$x + data$x2 is y = x + x2

    ```


    要获取模型的摘要，可以使用 `summary()` 函数：


    ```

    > summary(mod);

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Residuals:

    Min      1Q  Median      3Q     Max

    -3.7460 -1.3215 -0.2489  1.2427  4.1597

    Coefficients:

    Estimate Std. Error t value Pr(>|t|)

    (Intercept)  2.517425   0.305233   8.248 7.97e-13 ***

    data$x      -0.266343   0.209739  -1.270    0.207

    data$x2      0.009525   0.039598   0.241    0.810


    Signif. codes:  0 ''***'' 0.001 ''**'' 0.01 ''*'' 0.05 ''.'' 0.1 '' '' 1

    Residual standard error: 1.903 on 97 degrees of freedom

    Multiple R-squared:  0.01727,    Adjusted R-squared:  -0.00299

    F-statistic: 0.8524 on 2 and 97 DF,  p-value: 0.4295

    ```


    从输出中得到的线性模型是


    ```

    Y = -0.266343x + 0.009525x2 + 2.517425

    ```


    p 值分别为 `7.97e-13`、`0.207`、`0.810`、`0.4295`。截距项是显著的，因为其 p 值为 `7.97e-13`，小于 `0.05`。


    ![$$ {R}²=1-\frac{SSE}{SST}=1-\frac{\sum_i{\left({y}_i-{\widehat{y}}_i\right)}²}{\sum_i{\left({y}_i-{\widehat{y}}_i\right)}²}
    $$](img/471585_1_En_6_Chapter_TeX_Equbs.png)


    ![$$ \overline{\mathrm{y}}\kern0.33em \mathrm{i}\mathrm{s}\ \mathrm{the}\ \mathrm{mean}\
    \mathrm{of}\kern0.33em \mathrm{Y}\kern0.33em \mathrm{and}\kern0.33em \widehat{y}\kern0.5em
    \mathrm{i}\mathrm{s}\ \mathrm{the}\ \mathrm{fitted}\ \mathrm{value}\ \mathrm{for}\kern0.33em
    \mathrm{row}\kern0.33em \mathrm{i}. $$](img/471585_1_En_6_Chapter_TeX_IEq22.png)


    ![$$ \widehat{y} $$](img/471585_1_En_6_Chapter_TeX_IEq23.png) 是拟合值，这意味着在 `y =
    -0.266343x + 0.009525x2 + 2.517425` 中，代入 `x` 和 `x2` 得到 `y`。这个 `y` 就是 ![$$ \widehat{y}
    $$](img/471585_1_En_6_Chapter_TeX_IEq24.png)。![$$ \left(y-\widehat{y}\right) $$](img/471585_1_En_6_Chapter_TeX_IEq25.png)
    表示用原始的 `y` 值减去 ![$$ \widehat{y} $$](img/471585_1_En_6_Chapter_TeX_IEq26.png) 预测值，即误差。因此，![$$
    \sum \limits_i{\left({y}_i-{\widehat{y}}_i\right)}² $$](img/471585_1_En_6_Chapter_TeX_IEq27.png)
    就是 SSE。为了使 ![$$ \frac{SSE}{SST} $$](img/471585_1_En_6_Chapter_TeX_IEq28.png) 变小，SSE
    必须很小。尽管如此，当 ![$$ \frac{SSE}{SST} $$](img/471585_1_En_6_Chapter_TeX_IEq30.png)
    很小时，![$$ 1-\frac{SSE}{SST} $$](img/471585_1_En_6_Chapter_TeX_IEq29.png) 会很大。R
    方为 `0.01727`，调整后的 R 方为 `-0.00299`。R 方值越高越好，因为这意味着 SSE 更小。

    '
- fmt: '# Conclusion


    In this chapter, you looked into R programming. You now know that inferential
    statistics and descriptive statistics are the main branches of statistics. Descriptive
    statistics derives a summary from the data set and uses central tendency, dispersion,
    and skewness. Inferential statistics describes and makes inferences about the
    population and the sampled data. In inferential statistics, you use hypothesis
    testing and estimating of parameters.


    You learned that the `apply()` function can perform a loop to go through the data
    and apply a function. The function can be a `mean()` function from R or it can
    be a customized function.


    You also found out that sampling is the selection of a subset of a population.
    The population is the data from everyone. Sometimes a sample can be a subset from
    a full data set. The advantages of sampling are that the cost is lower and the
    data collection is more efficient than collecting the data from everyone in the
    population.


    You also learned that correlation is a statistical association to find how close
    two variables are and derive a linear relationship between them.


    You also learned that covariance is a measure of variability between two variables.
    The greater value of one variable and the greater of another variable means or
    will result in a covariance that is positive. The greater values of one variable
    to the lesser values of the other variable will result in a negative covariance.


    You also learned how p-values help you determine the significance of your statistical
    tests results. Your claim in the test is known as a null hypothesis and the alternate
    hypothesis means that you believe the null hypothesis is untrue.


    You also learned that a t-test is one of the more important tests in statistics.
    A t-test is used to determine whether the mean between two data points or samples
    are equal to each other. The null hypothesis means that the two means are equal,
    and the alternative means that the two means are different.


    You also learned that the chi-square test is used to compare the relationship
    between two categorical variables. The null hypothesis means that there is no
    relationship between the categorical variables.


    You also learned that ANOVA is the process of testing the means of two or more
    groups. ANOVA also checks the impact of factors by comparing the means of different
    samples. In a t-test, you test the means of two samples; in a chi-square test,
    you test categorical attributes or variables; and in ANOVA, you test more samples.


    You also learned that nonparametric tests are tests that do not require the variable
    and sample to be normally distributed. Most of the time you should use parametric
    tests like t-tests, chi-square tests, and ANOVA because they are more accurate.
    You use nonparametric tests when you do not have normally distributed data, and
    the sample data is big.


