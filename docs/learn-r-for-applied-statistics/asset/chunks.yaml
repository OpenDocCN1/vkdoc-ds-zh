- fmt: '# Covariance


    Covariance is a measure of variability between two variables. The greater the
    value of one variable and the greater of other variable means it will result in
    a covariance that is positive. The greater value of one variable to the lesser
    value of the other variable will result in a negative covariance. Covariance shows
    the linear relationship between both variables, but the covariance magnitude is
    difficult to interpret. Correlation is the normalized version of covariance so


    ![$$ \operatorname{cov}\left(X,Y\right)=\sum \limits_{i=1}^N\frac{\left({x}_i-\overline{x}\right)\left({y}_i-\overline{y}\right)}{N}
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equb.png)


    where ![$$ \left({x}_i-\overline{x}\right) $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq4.png)is
    the x value minus the mean and ![$$ \left({y}_i-\overline{y}\right) $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq5.png)is
    the y value minus the mean.


    To get a covariance, create sample data:


    ```

    > set.seed(123);

    > var1  var2  var3  data <- data.frame(var1, var2, var3);

    ```


    You can use the `cov()` function to get the covariance:


    ```

    > cov(data$var1, data$var2);

    [1] -0.04372107

    ```


    Correlation has a range of -1 to 1. Covariance does not have a range. Correlation
    is good for measuring how good the relationship between two variables is. When
    two variables have a positive covariance, when one variable increases, the other
    variable increases. When two variables have a negative covariance, when one variable
    increases, the other variable decreases. When two variables are independent of
    each other, the covariance is zero. -0.04372107 means the covariance is negative,
    and it is very close to zero, so the relationship between the two variables is
    not very good.


    Correlation and covariance are usually within descriptive statistics.


    # Hypothesis Testing and P-Value


    I mentioned hypothesis testing previously. In hypothesis testing, a research question
    is a hypothesis asked in question format. A research question can be, *Is there
    a significant difference between something?* A hypothesis can be, *There is a
    significant difference between something*. The research question begins with *Is
    there* and the hypothesis begins with *There is*. A hypothesis can also be a null
    hypothesis, *H*[0], and an alternate hypothesis, *H*[*a*]. You can write the null
    hypothesis and alternate hypothesis as follows:


    *H*[0]: *μ*[1] = *u*[2]


    *H*[*a*]: *μ*[1] ≠ *u*[2]


    where *μ*[1] is the mean of one data, and *μ*[2] is the mean of another data.


    You can use statistical tests to get your p-value. You use a t-test for continuous
    variables or data, and you use a chi-square test for categorical variables or
    data. For more complex testing, you use ANOVA. If data is not normally distributed,
    you use non-parametric tests. A P-value helps you determine the significance of
    your statistical test results. Your claim in the test is known as a null hypothesis
    and the alternate hypothesis means that you believe the null hypothesis is untrue.


    - A small p-value <= alpha, which is usually 0.05, indicates that the observed
    data is sufficiently inconsistent with the null hypothesis, so the null hypothesis
    may be rejected. The alternate hypothesis is true at the 95% confidence interval.

    - A larger p-value means that you failed to reject null hypothesis.


    # T-Test


    A t-test is one of the more important tests in statistics. A t-test is used to
    determine whether the mean between two data points or samples are equal to each
    other. The null hypothesis means that the two means are equal, and the alternative
    means that the two means are different.


    ## Types of T-Tests


    Figure [6-2](#471585_1_En_6_Chapter.xhtml#Fig2) shows the types of t-tests.


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Fig2_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Types of T-Tests


    ## Assumptions of T-Tests


    Here are the assumptions:


    - The samples are randomly sampled from their population.

    - The population is normally distributed.


    ## Type I and Type II Errors


    A type I error is a rejection of the null hypothesis when it is really true. A
    type II error is a failure to reject a null hypothesis that is false.


    ## One-Sample T-Test


    A one-sample t-test is used to test whether the mean of a population is equal
    to a specified mean.


    The formula of a one-sample t-test is


    ![$$ t=\frac{m-\mu }{\raisebox{1ex}{$s$}\!\left/ \!\raisebox{-1ex}{$\sqrt{n}$}\right.}
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equc.png)


    where `s` is the standard deviation of the sample, `n` is the size of the sample,
    `m` is the mean of the sample, and `u` is the specified mean.


    The degree of freedom formula is


    ![$$ df=n-1 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equd.png)


    You can use the t statistics and the degree of freedom to estimate the p-value
    using a t-table.


    To use a one-sample t-test in R, you can use the `t.test()` function:


    ```

    > set.seed(123);

    > var1  var2  var3  data  t.test(data$var1, mu=0.6);

    one sample t-test

    data:  data$var1

    t = 16.328, df = 99, p-value < 2.2e-16

    alternative hypothesis: true mean is not equal to 0.6

    95 percent confidence interval:

    1.909283 2.271528

    sample estimates:

    mean of x

    2.090406

    ```


    In a one-sample t-test,


    *H*[0]: *μ* = *m*


    *H*[*a*]: *μ* ≠ m


    `m` is 0.6 in the above R code. The p-value is 2.2e-16, so the p-value is less
    than 0.05, which is the alpha value. Therefore, the null hypothesis may be rejected.
    The alternate hypothesis, *μ* ≠ 0.6, is true at the 95% confidence interval.'
