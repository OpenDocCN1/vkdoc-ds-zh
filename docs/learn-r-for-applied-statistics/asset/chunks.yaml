    \ 3) {\nres <- product(firstNum, secondNum);\n} else if(opt == 4) {\nres <- division(firstNum,\
    \ secondNum);\n} else {\nprint(\"Error. \");\n}\nprint(res);\n```\n\nIn this code,\
    \ you create the `add()`, `subtract()`, `product()`, and `division()` functions\
    \ . You then print the messages “Select your option:” and etc. You assign the\
    \ `opt` variable with the user input. You get the user input using the `readline()`\
    \ function , and you use `as.integer()` to convert the user input to the integer\
    \ type. You use `if` statements to call the functions based on the user input.\
    \ You then print the results.\n\nTo run the code, go to Code ➤ Run Region ➤ Run\
    \ All, as shown in Figure [3-12](#471585_1_En_3_Chapter.xhtml#Fig12).\n\n![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig12_HTML.jpg](images/471585_1_En_3_Chapter/471585_1_En_3_Fig12_HTML.jpg)\n\
    \nFigure 3-12\n\nRunning the Calculator R script in the RStudio IDE\n\nThe output\
    \ is shown in Figure [3-13](#471585_1_En_3_Chapter.xhtml#Fig13).\n\n![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig13_HTML.jpg](images/471585_1_En_3_Chapter/471585_1_En_3_Fig13_HTML.jpg)\n\
    \nFigure 3-13\n\nRunning the results of the Calculator R script in the RStudio\
    \ IDE\n\n## Conclusion\n\nIn this chapter, you looked into R programming. You\
    \ explored the R console and the RStudio code editor. The R console is for shorter\
    \ code and the RStudio code editor is for longer R code or scripts.\n\nYou learned\
    \ about variables. A variable is a container to store some values. A variable\
    \ can have a name, which is called a variable name. Data types are the types or\
    \ kind of information or data a variable is holding.\n\nYou also looked into vectors.\
    \ A vector is a basic data structure or R object to store a set of values of the\
    \ same data type. The data types can be logical, integer, double, character, and\
    \ more. Vectors can be created using the `c()` function.\n\nYou also learned about\
    \ lists. Lists are like vectors: they are R objects that can store a set of values\
    \ or elements, but a list can store values of different data types.\n\nYou also\
    \ learned about matrices. A matrix is an R object or two-dimensional data structure\
    \ that is like vector, but has two dimensions.\n\nYou also learned about data\
    \ frames. A data frame is a special list or R object that is multidimensional\
    \ and is usually used to store data read from Excel or .csv files.\n\nYou also\
    \ learned about conditional statements. `if...else` statements are usually the\
    \ logical fragments of your code in R. They give your program some intelligence\
    \ and decision making ability by specifying the `if` rules.\n\nYou also learned\
    \ about loops. Loops are used to repeat certain fragments of code. For example,\
    \ if you want print the “This is R.” message 100 times, it will be very tiresome\
    \ to type `print(\"This is R.\");` 100 times. You can use loops to print the message\
    \ 100 times more easily. R has both while loops, for loops, and repeat loops.\n\
    \nYou also learned about functions. Functions help you organize your code and\
    \ allow you to reuse code fragments whenever you need.\n\nFinally, you created\
    \ your own calculator based on what you learned.\n\n# 4. Descriptive Statistics\n\
    \nDescriptive statistics is a set of math used to summarize data. Descriptive\
    \ statistics can be distribution, central tendency, and dispersion of data. The\
    \ distribution can be a normal distribution or binomial distribution. The central\
    \ tendency can be mean, median, and mode. The dispersion or spreadness can be\
    \ the range, interquartile range, variance, and standard deviation.\n\nIn this\
    \ chapter, you will import a CSV file, Excel file, and SPSS file, and you will\
    \ perform basic data processing. I will explain descriptive statistics, central\
    \ tendency measurements, dispersion measurements, and distributions. You will\
    \ look into how R programming can be used to calculate all these values, and how\
    \ to test and see whether data is normally distributed."
  trans: "\n# 函数\n\n函数有助于组织代码，并允许你在需要时重复使用代码片段。要创建函数，请使用以下语法：\n\n```\n函数名 <- function(参数\
    \ 1, 参数 2, ...) {\n# 代码片段\n函数名 = # 要返回的值\n}\n```\n\n示例：\n\n```\n> A \n> productVect\
    \ \n> print(productVect(A));\n[1] 120\n```\n\n在此示例中，你创建了 `productVect()` 函数。该函数与\
    \ R 编程中的 `prod()` 函数相同。\n\n`productVect()` 函数接受一个参数。对于参数（应为向量）中的每个元素，`res` 将等于\
    \ `res` 乘以该元素。循环完成后，`productVect()` 函数将返回 `res` 值。\n\n你可以使用 `productVect(A)` 调用该函数。在上述代码中，你使用以下方式调用函数：\n\
    \n```\nA <- c(1:5);\nprint(productVect(A));\n```\n\n`A` 是一个包含从 `1` 到 `5` 的值的向量。你通过\
    \ `productVect(A)` 调用函数。函数声明中的参数 `a` 是形式参数。在调用 `productVect()` 函数时传递给函数的参数 `A`\
    \ 称为实际参数。当你使用 `productVect(A)` 调用函数时，形式参数 `a` 被赋值为实际参数 `A`。\n\n你可以在代码中多次调用 `productVect()`\
    \ 函数：\n\n```\n>productVect\n> A  print(productVect(A));\n[1] 120\n>\n> B  print(productVect(B));\n\
    [1] 3628800\n```\n\n你也可以为函数中的参数创建默认值：\n\n```\nproductVect<- function(a=c(1:5))\
    \ {\nres <- 1;\nfor(e in a) {\nres <- res * e;\n}\nproductVect = res;\n}\nprint(productVect());\n\
    A <- c(1:5);\nprint(productVect(A));\nB <- c(1:10);\nprint(productVect(B));\n\
    ```\n\n当你调用不带参数的函数 `print(productVect())` 时，你仍然可以得到结果：\n\n```\n>productVect\n\
    > print(productVect());\n[1] 120\n>\n> A  print(productVect(A));\n[1] 120\n>\n\
    > B  print(productVect(B));\n[1] 3628800\n```\n\n除了使用 `productVect = res`，你还可以使用\
    \ `return()` 函数来返回结果：\n\n```\n>productVect\n> print(productVect());\n[1] 120\n\
    >\n> A  print(productVect(A));\n[1] 120\n>\n> B  print(productVect(B));\n[1] 3628800\n\
    ```\n\n## 创建你自己的计算器\n\n在本章中，你学习了许多 R 编程语法。你了解了变量、数据类型、矩阵、向量、列表、数据框、循环和函数。在本节中，你将把刚学到的许多内容整合到一个计算器脚本中：\n\
    \n```\nadd  \"));\nfirstNum<- as.integer(readline(prompt=\"输入第一个数字: \"));\nsecondNum<-\
    \ as.integer(readline(prompt=\"输入第二个数字: \"));\nres <- 0;\nif(opt == 1) {\nres\
    \ <- add(firstNum, secondNum);\n} else if(opt == 2) {\nres <- subtract(firstNum,\
    \ secondNum);\n} else if(opt == 3) {\nres <- product(firstNum, secondNum);\n}\
    \ else if(opt == 4) {\nres <- division(firstNum, secondNum);\n} else {\nprint(\"\
    错误。\");\n}\nprint(res);\n```\n\n在这段代码中，你创建了 `add()`、`subtract()`、`product()` 和\
    \ `division()` 函数。然后你打印了“选择你的选项：”等消息。你将 `opt` 变量赋值为用户输入。你使用 `readline()` 函数获取用户输入，并使用\
    \ `as.integer()` 将用户输入转换为整数类型。你使用 `if` 语句根据用户输入调用相应的函数。然后你打印结果。\n\n要运行代码，请转到“代码”\
    \ ➤ “运行区域” ➤ “全部运行”，如图 3-12 所示。\n\n![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig12_HTML.jpg](img/471585_1_En_3_Fig12_HTML.jpg)\n\
    \n图 3-12\n\n在 RStudio IDE 中运行计算器 R 脚本\n\n输出如图 3-13 所示。\n\n![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig13_HTML.jpg](img/471585_1_En_3_Fig13_HTML.jpg)\n\
    \n图 3-13\n\n在 RStudio IDE 中运行计算器 R 脚本的结果\n\n## 结论\n\n在本章中，你学习了 R 编程。你探索了 R 控制台和\
    \ RStudio 代码编辑器。R 控制台适用于较短的代码，而 RStudio 代码编辑器适用于较长的 R 代码或脚本。\n\n你了解了变量。变量是用于存储某些值的容器。变量可以有名称，称为变量名。数据类型是变量所持有的信息或数据的类型或种类。\n\
    \n你还学习了向量。向量是一种基本的数据结构或 R 对象，用于存储一组相同数据类型的值。数据类型可以是逻辑型、整型、双精度型、字符型等。可以使用 `c()`\
    \ 函数创建向量。\n\n你还学习了列表。列表类似于向量：它们都是可以存储一组值或元素的 R 对象，但列表可以存储不同数据类型的值。\n\n你还学习了矩阵。矩阵是一种\
    \ R 对象或二维数据结构，类似于向量，但具有两个维度。\n\n你还学习了数据框。数据框是一种特殊的列表或 R 对象，它是多维的，通常用于存储从 Excel\
    \ 或 `.csv` 文件中读取的数据。\n\n你还学习了条件语句。`if...else` 语句通常是 R 代码中的逻辑片段。它们通过指定 `if` 规则，为程序提供了一些智能和决策能力。\n\
    \n你还学习了循环。循环用于重复执行某些代码片段。例如，如果你想打印“这是 R。”消息 100 次，那么输入 `print(\"这是 R。\");` 100\
    \ 次会非常繁琐。你可以使用循环更轻松地打印该消息 100 次。R 有 while 循环、for 循环和 repeat 循环。\n\n你还学习了函数。函数有助于组织代码，并允许你在需要时重复使用代码片段。\n\
    \n最后，你根据所学内容创建了自己的计算器。\n\n# 4. 描述性统计\n\n描述性统计是一组用于总结数据的数学方法。描述性统计可以包括数据的分布、集中趋势和离散程度。分布可以是正态分布或二项分布。集中趋势可以是均值、中位数和众数。离散程度或分散程度可以是极差、四分位距、方差和标准差。\n\
    \n在本章中，你将导入一个 CSV 文件、Excel 文件和 SPSS 文件，并执行基本的数据处理。我将解释描述性统计、集中趋势度量、离散程度度量和分布。你将了解如何使用\
    \ R 编程计算所有这些值，以及如何检验并查看数据是否呈正态分布。\n"
- fmt: '# What Is Descriptive Statistics?


    Descriptive statistics summarizes the data and usually focuses on the distribution,
    the central tendency, and dispersion of the data. The distributions can be normal
    distribution, binomial distribution, and other distributions like Bernoulli distribution.
    Binomial distribution and normal distribution are the more popular and important
    distributions, especially normal distribution. When exploring data and many statistical
    tests, you will usually look for the normality of the data, which is how normal
    the data is or how likely it is that the data is normally distributed. The Central
    Limit Theorem states that the mean of a sample or subset of a distribution will
    be equal to the normal distribution mean when the sample size increases, regardless
    whether the sample is from a normal distribution. The central tendency, not the
    central limit theorem, is used to describe the data with respect to the center
    of the data. Central tendency can be the mean, median, and mode of the data. The
    dispersion describes the spread of the data, and dispersion can be the variance,
    standard deviation, and interquantile range.


    Descriptive statistics summarizes the data set, lets us have a feel and understanding
    of the data and variables, and allows us to decide or determine whether we should
    use inferential statistics to identify the relationship between data sets or use
    regression analysis to identify the relationships between variables.


    # Reading Data Files


    R programming allow you to import a data set, which can be comma-separated values
    (CSV) file, Excel file, tab-separated file, JSON file, or others. Reading data
    into the R console or R is important, since you must have some data before you
    can do statistical computing and understand the data.


    Before you look into importing data into the R console, you must determine your
    workplace or work directory first. You should always set the current workspace
    directory to tell R the location of your current project folder. This allows for
    easier references to data files and scripts.


    To print the current work directory, you use the `getwd()` function:


    ```

    # get the current workspace location

    print(getwd());

    > print(getwd());

    [1] "C:/Users/gohmi/Documents"

    ```


    You can set the work directory using the `setwd()` function:


    ```

    #set the current workspace location

    setwd("D:/R");   #input your own file directory, for here

    we use "D:/R"

    > setwd("D:/R");

    ```


    To get the new work directory location, you can use the `getwd()` function:


    ```

    #get the new workspace

    print(getwd());

    > print(getwd());

    [1] "D:/R"

    ```


    You can put the `data.csv` data set into `D:/R` folder.


    ## Reading a CSV File


    You can read the data CSV file into the R console using the `read.csv()` function:


    ```

    > data <- read.csv(file="data.csv", header=TRUE, sep=",");

    ```


    You can view the data by clicking the data in the Global Environment portion of
    the RStudio IDE. The data will be displayed in the table form. You can read the
    file using `data.csv` because you have set the work directory to `D:/R`, so `file="data.csv"`
    refers to `D:/R/data.csv`. See Figure [4-1](#471585_1_En_4_Chapter.xhtml#Fig1).


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig1_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    View data in table form in RStudio


    The data type of the data variable is data frame. You can determine whether the
    data type is data frame using the `class()` function:


    ```

    > class(data);

    [1] "data.frame"

    ```


    The function you use to read a .csv file is


    ```

    > data <- read.csv(file="data.csv", header=TRUE, sep=",");

    ```


    `file` is the name or the data file path that you are going to read. `header`
    is a logical value to determine whether the names of the variables are in the
    first line. `sep` is the separator character, and `quote` is the quoting characters
    with “\”“ for ” and “\’” for ’. You can add in the quote for double quotation
    as follows:


    ```

    > data  View(data);

    ```


    ## Writing a CSV File


    To write a CSV file, you can use the `write.csv()` function:


    ```

    > write.csv(data, file="data2.csv", quote=TRUE, na="na", row.names=FALSE);

    ```


    The exported file is shown in Figure [4-2](#471585_1_En_4_Chapter.xhtml#Fig2).


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig2_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Exported csv file opened in Microsoft Excel


    In the `write.csv()` function you used previously to export the CSV file,


    ```

    > write.csv(data, file="data2.csv", quote=TRUE, na="na", row.names=FALSE);

    ```


    `data` is the variable of the data frame type you would like to export, `file`
    is the file path or location to export, `quote` is a logical value to state whether
    to have quotations, `na` is the string value to use for missing values, and `row.names`
    is a logical value to indicate whether the row names should be written.


    ## Reading an Excel File


    The data set can also be in the Excel format or .xlsx format. To read an Excel
    file, you need to use the xlsx package. The xlsx package requires a Java runtime,
    so you must install it on your computer. To install the xlsx package, go to the
    R console and type the following, also shown in Figure [4-3](#471585_1_En_4_Chapter.xhtml#Fig3):


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig3_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    xlsx package installation in RStudio


    ```

    > install.packages("xlsx");

    ```


    To use the xlsx package, use the `require()` function:


    ```

    > require("xlsx");

    Loading required package: xlsx

    ```


    To read the Excel file, you can use the `read.xlsx()` function:


    ```

    > data <- read.xlsx(file="data.xlsx", 1);

    ```


    `file` is the location of the Excel file. `1` refers to sheet number 1.


    To view the `data` variable, you can use the `View()` function or click the `data`
    variable in the Environment portion of RStudio, as shown in Figure [4-4](#471585_1_En_4_Chapter.xhtml#Fig4).


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig4_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    View(data) in RStudio


    To look for the documentation of `read.xlsx()`, you can use the following code,
    as shown in Figure [4-5](#471585_1_En_4_Chapter.xhtml#Fig5):


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig5_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Documentation of read.xlsx()


    ```

    > help(read.xlsx);

    ```


    The data variable is of the data frame data type:


    ```

    > class(data);

    [1] "data.frame"

    ```


    ## Writing an Excel File


    To write a Excel file, you can use the `write.xlsx()` function:


    ```

    > write.xlsx(data, file="data2.xlsx", sheetName="sheet1", col.names=TRUE, row.names=FALSE);

    ```


    `data` is the variable of data frame type to export to Excel file, `file` is the
    file location or path, `sheetName` is the sheet name, and `col.names` and `row.names`
    are logical values to state whether to export with column names or row names.


    To view the documentation of the `write.xlsx()` function or any R function, you
    can use the `help()` function.


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig6_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Exported xlsx file'
