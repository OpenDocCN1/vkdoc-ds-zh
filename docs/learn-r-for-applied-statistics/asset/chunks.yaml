    ![$$ \widehat{y} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq23.png)is
    the fitted value, which means that in y = -0.266343x + 0.009525x2 + 2.517425,
    you fit in x and x2 to get y. The y is the ![$$ \widehat{y} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq24.png).
