    要使用 `foreign` 包，请使用 `require()` 函数：


    ```

    > require(foreign);

    Loading required package: foreign

    ```


    要将 SPSS 文件读取为数据框类型，请使用 `read.spss()` 函数：


    ```

    > data <- read.spss(file="data.spss", to.data.frame=TRUE);

    ```


    `file` 是要读取的 SPSS 文件的路径或位置。`to.data.frame` 是一个逻辑值，用于指定是否将 SPSS 文件读取为数据框类型。


    你可以使用 `help()` 函数获取 `read.spss()` 函数的文档，如图 4-7 所示。


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig7_HTML.jpg](img/471585_1_En_4_Fig7_HTML.jpg)


    图 4-7


    `read.spss()` 的文档


    ### 写入 SPSS 文件


    你可以使用 `write.foreign()` 函数写入 SPSS 文件：


    ```

    > write.foreign(data, "mydata.txt", "mydata.sps", package="SPSS");

    ```


    `data` 是要导出到 SPSS 数据文件的变量，`mydata.txt` 是逗号分隔格式的数据，`mydata.sps` 是将数据文件读入 SPSS 的基本语法文件，`package`
    决定输出或导出为 SPSS 格式。


