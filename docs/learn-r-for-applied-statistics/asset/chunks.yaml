    B^2;

    ```


    To run the R script, highlight the code in the code editor and click Run, as shown
    in Figure [3-6](#471585_1_En_3_Chapter.xhtml#Fig6).


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig6_HTML.jpg](images/471585_1_En_3_Chapter/471585_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Running the script


    To view the results of the R script, look in the R console of RStudio, as shown
    in Figure [3-7](#471585_1_En_3_Chapter.xhtml#Fig7).


