- fmt: '# What Are Data Visualizations?


    Descriptive statistics summarizes the data and usually focuses on the distribution,
    the central tendency, and the dispersion of the data. Data visualization, on the
    other hand, creates graphics from the data to help us understand it. The graphics
    or charts can also help us to communicate visually to our clients. A picture is
    worth a thousand words.


    Data visualization can involve the plotting of a bar, histogram, scatterplot,
    boxplot, line chart, time series, and scatterplot matrix chart to help us analyze
    and reason about the data and understand the causality and relationship between
    variables. Data visualization can also be viewed as descriptive statistics to
    some. Humans distinguish differences in line, shape, and color without much processing
    effort, and data visualization can take advantage of this to create charts and
    graphs to help users understand the data more easily.


    # Bar Chart and Histogram


    R programming allows us to plot bar charts and histograms. A bar chart represents
    data using bars, with y values being the value of the variable. R programming
    uses the `barplot()` function to create bar charts, and R can draw both horizontal
    and vertical bar charts. A histogram, on the other hand, represents the frequencies
    of the values within a variable and draws them into bars.


    To plot a bar chart in R, you can use the `barplot()` function:


    ```

    > data <- c(3, 4, 5, 6, 7, 8);

    > barplot(data, xlab="X-axis", ylab="Y-axis", main="Bar Chart 1", col="green");

    ```


    `data` is the data to plot, `xlab` is the x-axis name, `ylab` is the y-axis name,
    `main` is the main title, and `col` is the color of the chart. See Figure [5-1](#471585_1_En_5_Chapter.xhtml#Fig1).


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig1_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Bar Chart of data


    To export the bar chart into an image file (see Figure [5-2](#471585_1_En_5_Chapter.xhtml#Fig2)),
    you can add in


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig2_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Bar Chart PNG file Opened with Microsoft Photos


    ```

    > data <- c(3, 4, 5, 6, 7, 8);

    > png(file="D:/barchart.png");

    > barplot(data, xlab="x-axis", ylab="y-axis", main="bar chart 1", col="green");

    > dev.off();

    RStudioGD

    ```


    To plot a horizontal bar chart (see Figure [5-3](#471585_1_En_5_Chapter.xhtml#Fig3)),
    you can use `horiz=TRUE`:


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig3_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Horizontal Bar Chart of data variable


    ```

    > data <- c(3, 4, 5, 6, 7, 8);

    > png(file="D:/barchart.png");

    > barplot(data, xlab="x-axis", ylab="y-axis", main="bar chart 1", col="green",
    horiz=TRUE);

    > dev.off();

    RStudioGD

    ```


    To plot a stacked bar plot, you can create the following data set:


    ```

    > data(mtcars);

    > data <- table(mtcars$cyl, mtcars$gear);

    > data;

    1 2 3 4 6 8

    3 3 4 3 5 0 0

    4 4 4 0 4 0 0

    5 0 2 0 1 1 1

    ```


    To plot a stacked bar plot:


    ```

    > png(file="D:/barchart.png");

    > barplot(data3, xlab="x-axis", ylab="y-axis", main="bar chart 1", col=c("grey",
    "blue", "yellow"));

    > dev.off();

    RStudioGD

    ```


    In the data, 3 is the grey color, 4 is the blue color, and 5 is the yellow color.
    When the x-axis or x is 1, the grey color is 3 steps, the blue color is 4 steps,
    and the yellow color is 0 steps. See Figure [5-4](#471585_1_En_5_Chapter.xhtml#Fig4).


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig4_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Stacked bar plot of data


    ```

    > data;

    1 2 3 4 6 8

    3 3 4 3 5 0 0

    4 4 4 0 4 0 0

    5 0 2 0 1 1 1

    ```


    To plot a grouped bar chart, you can use `beside=TRUE`:


    ```

    > data(mtcars);

    > data <- table(mtcars$cyl, mtcars$gear);

    > data;

    1 2 3 4 6 8

    3 3 4 3 5 0 0

    4 4 4 0 4 0 0

    5 0 2 0 1 1 1

    > png(file="D:/barchart.png");

    > barplot(data3, xlab="x-axis", ylab="y-axis", main="bar chart 1", col=c("grey",
    "blue", "yellow"), beside=TRUE);

    > dev.off();

    RStudioGD

    ```


    In the data, 3 is the grey color, 4 is the blue color, and 5 is the yellow color.
    When the x-axis or x is 1, the grey color is 3 steps, the blue color is 4 steps,
    and the yellow color is 0 steps. See Figure [5-5](#471585_1_En_5_Chapter.xhtml#Fig5).


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig5_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Grouped bar chart of data


    ```

    > data;

    1 2 3 4 6 8

    3 3 4 3 5 0 0

    4 4 4 0 4 0 0

    5 0 2 0 1 1 1

    ```


    To plot a histogram, you can use the `hist()` function (see Figure [5-6](#471585_1_En_5_Chapter.xhtml#Fig6)):


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig6_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Histogram of data1


    ```

    > set.seed(123);

    > data1 <- rnorm(100);

    > png(file="D:/histogram.png");

    > hist(data1, main="histogram", xlab="x-axis", col="green", border="blue", breaks=10);

    > dev.off();

    RStudioGD

    ```


    `data1` is the data, `main` is the main title, `col` is the color, `border` is
    the color of the borders, `xlab` is the name of the x-axis, and `breaks` is the
    width of each bar.


    To plot a histogram with a density line, you can change `freq=FALSE` so that the
    histogram is plotted based on probability, and you can use the `lines()` function
    to add the density line (see Figure [5-7](#471585_1_En_5_Chapter.xhtml#Fig7)):


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig7_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Histogram with density line of data1


    ```

    > set.seed(123);

    > data1 <- rnorm(100);

    > hist(data1, main="histogram", xlab="x-axis", col="green", border="blue", breaks=10,
    freq=FALSE);

    > lines(density(data1), col="red");

    ```'
