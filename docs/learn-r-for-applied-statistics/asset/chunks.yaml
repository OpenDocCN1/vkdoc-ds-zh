    [71]  1.50896883 -0.30916888  3.00573852  1.29079924  1.31199138  3.02557137  1.71522699

    [78]  0.77928229  2.18130348  1.86110864  2.00576419  2.38528040  1.62933997  2.64437655

    [85]  1.77951344  2.33178196  3.09683901  2.43518149  1.67406841  3.14880762  2.99350386

    [92]  2.54839696  2.23873174  1.37209392  3.36065245  1.39974041  4.18733299  3.53261063

    [99]  1.76429964  0.97357910

    ```


    ## Sampling


    Sampling is the selection of a subset of a population. The population is the data
    from every member. Sometimes a sample can be a subset from a full data set. The
    advantages of sampling are that the cost is lower and data collection is more
    efficient than collecting the data from every member in the population.


    ### Simple Random Sampling


    Simple random sampling (SRS) selects elements from the full data set randomly.
    Each element has the same probability of being selected, and each subset has the
    same probability of being selected as other subsets.


    ### Stratified Sampling


    Stratified sampling is when you divide the population into groups based on a factor
    or characteristics or some factors. These groups are called strata, and an individual
    group is called a stratum. In stratified sampling, you do the following:


    1. Divide the population into groups.

    2. Use simple random sampling on each group.

    3. Collect data from each sampling unit.


    Stratified sampling works well when a heterogeneous population is split into homogeneous
    groups.'
