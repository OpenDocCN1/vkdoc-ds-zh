    ### Median


    The median is the middle or midpoint of the data and is also the 50 percentile
    of the data. The median is affected by the outliers and skewness of the data.
    The median can be a better measurement for centrality than the mean if the data
    is skewed. The mean is the average, which is liable to be influenced by outliers,
    so median is a better measure when the data is skewed.


    In R, to get the median, you use the `median()` function:


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > median(A);

    [1] 5

    ```


    To get the median for dataset:


    ```

    > median(data$x2);

    [1] 2.380852

    ```


    ### Mean


    The mean is the average of the data. It is the sum of all data divided by the
    number of data points. The mean works best if the data is distributed in a normal
    distribution or distributed evenly. The mean represents the expected value if
    the distribution is random.


    ![$$ \overline{x}=\frac{1}{N}\sum \limits_{i=1}^N\kern0.5em {x}_i=\frac{x_1+{x}_2+\dots
    +{x}_N}{N} $$](images/471585_1_En_4_Chapter/471585_1_En_4_Chapter_TeX_Equa.png)


    In R, to get the mean, you can use the `mean()` function:


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > mean(A);

    [1] 4.6

    ```


    To get the mean of a data set:


    ```

    > mean(data$x2);

    [1] 2.46451

    ```


    ### Interquartile Range, Variance, Standard Deviation


    Measures of variability are the measures of the spread of the data. Measures of
    variability can be range, interquartile range, variance, standard deviation, and
    more.


    #### Range


    The range is the difference between the largest and smallest points in the data.


    To find the range in R, you use the `range()` function:


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > range(A);

    [1] 1 8

    ```


    To get the difference between the max and the min, you can use:


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > res <- range(A)

    > diff(res);

    [1] 7

    ```


    You can use the `min()` and `max()` functions to find the range also:


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > min(A);

    [1] 1

    > max(A);

    [1] 8

    > max(A) - min(A);

    [1] 7

    ```


    To get the range for a data set:


    ```

    > res <- range(data$x2)

    > diff(res);

    [1] 10.65222

    > res <- range(data$x2, na.rm=TRUE)

    > diff(res);

    [1] 10.65222

    ```


    `na.rm` is a logical value to state whether to remove NA values.


    #### Interquartile Range


    The interquartile range is the measure of the difference between the 75 percentile
    or third quartile and the 25 percentile or first quartile.


    To get the interquartile range, you can use the `IQR()` function:


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > IQR(A);

    [1] 2.5

    ```


    You can get the quartiles by using the `quantile()` function:


    ```

    > quantile(A);

    0%  25%  50%  75% 100%

    1.00 3.25 5.00 5.75 8.00

    ```


    You can get the 25 and 75 percentiles:


    ```

    > quantile(A, 0.25);

    25%

    3.25

    > quantile(A, 0.75);

    75%

    5.75

    ```


    You can get the interquartile range and quartiles for data set using:


    ```

    > quantile(data$x2);

    0%       25%       50%       75%

    -2.298551  1.274672  2.380852  3.750422

    100%

    8.353669

    > IQR(data$x2);

    [1] 2.47575

    > IQR(data$x2, na.rm=TRUE);

    [1] 2.47575

    > help(IQR);

    ```


    The `IQR()` and `quantile()` functions can have NA values removed using `na.rm
    = TRUE`.


    Range measures the maximum and minimum data values, and the interquartile range
    measures where the majority value is.'
