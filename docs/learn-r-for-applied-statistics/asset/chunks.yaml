    > var2 <- rnorm(100, mean=8, sd=3);

    > var3 <- rnorm(100, mean=12, sd=4);

    > data <- data.frame(var1, var2, var3);

    > png(file="D:/boxplot.png");

    > boxplot(data, main="boxplot", notch=TRUE, varwidth=TRUE, col=c("green", "purple",
    "blue"));

    > dev.off();

    RStudioGD

    ```


