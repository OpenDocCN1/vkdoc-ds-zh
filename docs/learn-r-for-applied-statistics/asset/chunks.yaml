    Skewness is a measure of how symmetric a distribution is and how much the distribution
    is different from the normal distribution. Figure [4-14](#471585_1_En_4_Chapter.xhtml#Fig14)
    shows the types of skewness.


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig14_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig14_HTML.jpg)


    Figure 4-14


    Types of Skewness


    Negative skew is also known as left skewed, and positive skew is also known as
    right skewed. The histogram from the previous section has a negative skew.


    The Kurtosis measure is used to see whether a dataset is heavy tailed or light
    tailed. High kurtosis means heavy tailed, so there are more outliers in the data.
    See Figure [4-15](#471585_1_En_4_Chapter.xhtml#Fig15).


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig15_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig15_HTML.jpg)


