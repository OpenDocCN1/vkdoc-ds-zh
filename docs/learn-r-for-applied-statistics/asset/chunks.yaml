    ## Correlations


    Correlations are statistical associations to find how close two variables are
    and to derive the linear relationships between them. In predictive analytics,
    you can use correlation to find which variables are more related to the target
    variable and use this to reduce the number of variables. Correlation does not
    mean a causal relationship. Correlation finds how close two variables are, but
    does not tell you the how and why of the relationship. Causation tells you that
    one variable change will cause another variable to change.


    The formula for correlation is:


    ![$$ {r}_{xy}=\frac{\sum_{i=1}^n\left({x}_i-\overline{x}\right)\left({y}_i-\overline{y}\right)}{\sqrt{\sum_{i=1}^n{\left({x}_i-\overline{x}\right)}^2{\sum}_{i=1}^n{\left({y}_i-\overline{y}\right)}^2}}
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equa.png)


    where ![$$ {\left({x}_i-\overline{x}\right)}^2 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq1.png)
    is the x value minus the mean and then square it, and ![$$ \left({y}_i-\overline{y}\right)
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq2.png) ![$$ {\left({y}_i-\overline{y}\right)}^2
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq3.png) is the y
    value minus the mean and then square it.


    To get the correlation, you generate sample data first:


    ```

    > View(iris_sample);

    > set.seed(123);

    > var1  var2  var3  data <- data.frame(var1, var2, var3);

    ```


    You can use the `cor()` function to get the correlation:


    ```

    > cor(data$var1, data$var2);

    [1] -0.04953215

    ```


    The correlation has a range from -1.0 to 1.0. When the correlation is 0, there
    is no correlation or relationship. When the correlation is more than 0, it is
    a positive relationship. Positive correlation means that when one variable value
    increases, the other variable values also increase. When the correlation is less
    than 0, it is a negative relationship. Negative correlation means that when one
    variable increases, the other variables’ values decrease. 1 is the perfect positive
    correlation and -1 is the perfect negative correlation. Hence, the larger the
    value towards 1, or the smaller the values towards -1, the better the relationship.


    `-0.04953215` means that the correlation is a negative relationship between `var1`
    and `var2`. The correlation is close to zero, so the relationship is not good.'
