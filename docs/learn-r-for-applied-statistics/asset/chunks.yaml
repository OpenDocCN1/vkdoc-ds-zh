    要绘制带有密度线的直方图，可以将 `freq=FALSE` 设置为基于概率绘制直方图，并使用 `lines()` 函数添加密度线（见图 5-7）：


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig7_HTML.jpg](img/471585_1_En_5_Fig7_HTML.jpg)


