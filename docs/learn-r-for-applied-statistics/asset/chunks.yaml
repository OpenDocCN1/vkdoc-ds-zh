    Figure 3-8


    RStudio IDE Environment tab


    ## Adding Comments to the Code


    You can add comments to the code. Comments are text that will not be run by the
    R console. You can add in a comment by putting `#` in front of the text. The comment
    is for you to describe your code to let anyone read it more easily.


    ```

    #Create variable A with value 1

    A <- 1;

    #Create variable B with value 2

    B <- 2;

    #Calculate A divide B

    A/B;

    #Calculate A times B

    A * B;

    #Calculate A plus B

    A + B;

    #Calculate A subtract B

    A - B;

    #Calculate A to power of 2

    A^2;

    #Calculate B to power of 2

    B^2;

    ```


    You can rerun the code and you should get the result shown in Figure [3-9](#471585_1_En_3_Chapter.xhtml#Fig9).


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig9_HTML.jpg](images/471585_1_En_3_Chapter/471585_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    RStudio IDE reruns the code with comments


    ## Variables


    Let’s look into the code and scripts you used previously. You actually created
    two variables, `A` and `B`, and assigned some values to the two variables .


    ```

    A <- 1

    B <- 2

    ```


    In this code, `A` is a variable, and B is a variable also. `<-` means assign.
    `A <- 1` means variable `A` is assigned a value of `1`. `1` is a numeric type.
    `B <- 2` means variable `B` is assigned a value of `2`. `2` is a numeric type.


    If you want to assign text or character values, you add quotations, like


    ```

    A <- "Hello World"

    ```


    Variable `A` is assigned a text value of `"Hello World"`. Character and numeric
    are data types .


    ## Data Types


    Data types are the types or kind of information or data a variable is holding.
    A data type can be numeric and character.


    For example,


    ```

    A <- "abc"

    B <- 1.2

    ```


    In R, data types are automatically determined. Because of the quotations surrounding
    the values, variable A is of the character data type, while variable B is of the
    numeric data type.


    R is also capable of storing other data types, as shown in Table [3-1](#471585_1_En_3_Chapter.xhtml#Tab1).


    Table 3-1


    Data Types


    | Data Types | Values |

    | --- | --- |

    | Logical | TRUEFALSE |

    | Numeric | 12.32.551.0 |

    | Character | “a”“abc”“this is a bat” |


    For more information , please see [`www.tutorialspoint.com/r/r_data_types.htm`](http://www.tutorialspoint.com/r/r_data_types.htm)
    `.`


    You can also determine the data type of a variable by using the `class()` method.
    For example:


    ```

    A  A  print(class(A));

    [1] "character"

    A  A  print(class(A));

    [1] "numeric"

    A  A  print(class(A));

    [1] "logical"

    ```


    Why is the data type important? If you do a math calculation in R and one variable’s
    data type is numeric and one variable’s data type is non-numeric, you will get
    the following error:


    ```

    > A  B  A + B;

    Error in A + B : non-numeric argument to binary operator

    ```


    You can also use `is.datatype()` to determine whether a variable is of a certain
    data type:


    ```

    > A  print(is.numeric(A));

    [1] TRUE

    > print(is.character(A));

    [1] FALSE

    ```


    You can also use `as.datatype()` to convert between data types:


    ```

    > A  B  A + B;

    Error in A + B : non-numeric argument to binary operator

    > B  A + B;

    [1] 68

    ```


    `A <- 12` means that `A` is a numeric data type. `B <- "56"` means that `B` is
    a character data type. When `A` and `B` add together, you will get an error because
    you are adding a numeric data type to a character data type.


    If you try to convert `B` to the numeric data type using `B <- as.numeric(B)`,
    you can add `A` and `B` together because `A` is a numeric data type and `B` is
    a numeric data type also.


    ## Vectors


    A vector is a basic data structure or R object for storing a set of values of
    the same data type. A vector is the most basic and common data structure in R.
    A vector is used when you want to store and modify a set of values. The data types
    can be logical, integer, double, and character. The integer data type is used
    to store number values without a decimal, and the double data type is used to
    store number values with a decimal. Vectors can be created using the `c()` function
    as follows:


    ```

    variable = c(..., ..., ...)

    > A  print(A);

    [1] 1 2 3 4 5 6

    ```


    You can check the data type of the vector using `typeof()` and `class()`:


    ```

    >typeof(A);

    [1] "double"

    > class(A);

    [1] "numeric"

    ```


    You can check the number of elements or values in a vector using the `length()`
    function :


    ```

    > A  print(A);

    [1] 1 2 3 4 5 6

    > length(A);

    [1] 6

    ```


    You can also use the operator `:` to create a vector:


    ```

    > A  print(A);

    [1] 1 2 3 4 5 6 7 8

    ```


    To retrieve the second element or value of a vector, use the `[]` brackets and
    put in the element number to retrieve:


    ```

    > A  print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[2];

    [1] 2

    ```


    You can also retrieve the elements in the vector using another vector, for example,
    to retrieve the second and fifth element:


    ```

    > A  print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[c(2, 5)];

    [1] 2 5

    ```


    To retrieve all elements except the second element, do this:


    ```

    > A  print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[-2];

    [1] 1 3 4 5 6 7 8

    ```


    You can also retrieve elements of a vector using a logical vector:


    ```

    > A  print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[c(FALSE, TRUE, FALSE, TRUE, FALSE, TRUE, FALSE, TRUE)];

    [1] 2 4 6 8

    ```


    You can also use more than or less than signs to retrieve elements:


    ```

    > A  print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[A > 5];

    [1] 6 7 8

    ```


    You can modify a vector as follows using assign, `<-`:


    ```

    > A  print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[3]  print(A);

    [1] 1 2 9 4 5 6 7 8

    ```'
  trans: '

    # 使用代码编辑器


    RStudio IDE 提供了代码编辑器、调试器和编译器等功能，这些工具可与 R 命令行应用程序或 R 控制台进行通信。R 代码编辑器提供了智能代码补全和语法高亮等功能，分别如图
    3-2 和图 3-3 所示。


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig3_HTML.jpg](img/471585_1_En_3_Fig3_HTML.jpg)


    图 3-3


    语法高亮示例


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig2_HTML.jpg](img/471585_1_En_3_Fig2_HTML.jpg)


    图 3-2


    智能代码补全示例


    要在 RStudio 中创建新脚本，请单击“文件”➤“新建”➤“R 脚本”，如图 3-4 所示。


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig4_HTML.jpg](img/471585_1_En_3_Fig4_HTML.jpg)


    图 3-4


    创建新脚本


    然后，您就可以编写 R 脚本了。现在，请键入以下代码，如图 3-5 所示：


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig5_HTML.jpg](img/471585_1_En_3_Fig5_HTML.jpg)


    图 3-5


    脚本中的代码


    ```

    A <- 1;

    B <- 2;

    A/B;

    A * B;

    A + B;

    A – B;

    A²;

    B²;

    ```


    要运行 R 脚本，请在代码编辑器中高亮显示代码，然后单击“运行”，如图 3-6 所示。


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig6_HTML.jpg](img/471585_1_En_3_Fig6_HTML.jpg)


    图 3-6


    运行脚本


    要查看 R 脚本的结果，请查看 RStudio 的 R 控制台，如图 3-7 所示。


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig7_HTML.jpg](img/471585_1_En_3_Fig7_HTML.jpg)


    图 3-7


    RStudio IDE 控制台结果


    您还可以在“环境”选项卡中看到两个变量，如图 3-8 所示。


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig8_HTML.jpg](img/471585_1_En_3_Fig8_HTML.jpg)


    图 3-8


    RStudio IDE 环境选项卡


    # 为代码添加注释


    您可以为代码添加注释。注释是不会被 R 控制台执行的文本。您可以通过在文本前加上 `#` 来添加注释。注释用于描述您的代码，以便任何人更容易阅读。


    ```

    #创建变量 A，值为 1

    A <- 1;

    #创建变量 B，值为 2

    B <- 2;

    #计算 A 除以 B

    A/B;

    #计算 A 乘以 B

    A * B;

    #计算 A 加 B

    A + B;

    #计算 A 减 B

    A - B;

    #计算 A 的 2 次方

    A²;

    #计算 B 的 2 次方

    B²;

    ```


    您可以重新运行代码，应该会得到如图 3-9 所示的结果。


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig9_HTML.jpg](img/471585_1_En_3_Fig9_HTML.jpg)


    图 3-9


    RStudio IDE 重新运行带注释的代码


    # 变量


    让我们看看您之前使用的代码和脚本。您实际上创建了两个变量 `A` 和 `B`，并为这两个变量赋值。


    ```

    A <- 1

    B <- 2

    ```


    在这段代码中，`A` 是一个变量，`B` 也是一个变量。`<-` 表示赋值。`A <- 1` 表示变量 `A` 被赋值为 `1`。`1` 是数值类型。`B
    <- 2` 表示变量 `B` 被赋值为 `2`。`2` 是数值类型。


    如果您想赋值文本或字符值，需要添加引号，例如：


    ```

    A <- "Hello World"

    ```


    变量 `A` 被赋值为文本值 `"Hello World"`。字符和数值都是数据类型。


    # 数据类型


    数据类型是指变量所持有的信息或数据的类型或种类。数据类型可以是数值型和字符型。


    例如：


    ```

    A <- "abc"

    B <- 1.2

    ```


    在 R 中，数据类型是自动确定的。由于值被引号包围，变量 `A` 是字符数据类型，而变量 `B` 是数值数据类型。


    R 也能够存储其他数据类型，如表 3-1 所示。


    表 3-1


    数据类型


    | 数据类型 | 值 |

    | --- | --- |

    | 逻辑型 | TRUEFALSE |

    | 数值型 | 12.32.551.0 |

    | 字符型 | “a”“abc”“this is a bat” |


    更多信息，请参阅 [`www.tutorialspoint.com/r/r_data_types.htm`](http://www.tutorialspoint.com/r/r_data_types.htm)。


    您还可以使用 `class()` 方法来确定变量的数据类型。例如：


    ```

    > A <- "abc"

    > print(class(A));

    [1] "character"

    > A <- 12.3

    > print(class(A));

    [1] "numeric"

    > A <- TRUE

    > print(class(A));

    [1] "logical"

    ```


    为什么数据类型很重要？如果您在 R 中进行数学计算，而一个变量的数据类型是数值型，另一个变量的数据类型是非数值型，您将得到以下错误：


    ```

    > A <- 12

    > B <- "56"

    > A + B;

    Error in A + B : non-numeric argument to binary operator

    ```


    您也可以使用 `is.datatype()` 来判断一个变量是否属于某种数据类型：


    ```

    > A <- 12

    > print(is.numeric(A));

    [1] TRUE

    > print(is.character(A));

    [1] FALSE

    ```


    您还可以使用 `as.datatype()` 在数据类型之间进行转换：


    ```

    > A <- 12

    > B <- "56"

    > A + B;

    Error in A + B : non-numeric argument to binary operator

    > B <- as.numeric(B)

    > A + B;

    [1] 68

    ```


    `A <- 12` 表示 `A` 是数值数据类型。`B <- "56"` 表示 `B` 是字符数据类型。当 `A` 和 `B` 相加时，您会得到一个错误，因为您正在将一个数值数据类型与一个字符数据类型相加。


    如果您尝试使用 `B <- as.numeric(B)` 将 `B` 转换为数值数据类型，那么您就可以将 `A` 和 `B` 相加，因为 `A` 是数值数据类型，`B`
    也变成了数值数据类型。


    # 向量


    向量是一种基本的数据结构或 R 对象，用于存储一组相同数据类型的值。向量是 R 中最基本、最常见的数据结构。当您想要存储和修改一组值时，就会使用向量。数据类型可以是逻辑型、整型、双精度型和字符型。整型数据类型用于存储不带小数的数值，双精度型数据类型用于存储带小数的数值。可以使用
    `c()` 函数创建向量，如下所示：


    ```

    variable = c(..., ..., ...)

    > A <- c(1, 2, 3, 4, 5, 6)

    > print(A);

    [1] 1 2 3 4 5 6

    ```


    您可以使用 `typeof()` 和 `class()` 检查向量的数据类型：


    ```

    > typeof(A);

    [1] "double"

    > class(A);

    [1] "numeric"

    ```


    您可以使用 `length()` 函数检查向量中元素或值的数量：


    ```

    > A <- c(1, 2, 3, 4, 5, 6)

    > print(A);

    [1] 1 2 3 4 5 6

    > length(A);

    [1] 6

    ```


    您也可以使用运算符 `:` 来创建向量：


    ```

    > A <- 1:8

    > print(A);

    [1] 1 2 3 4 5 6 7 8

    ```


    要检索向量的第二个元素或值，请使用 `[]` 括号并输入要检索的元素编号：


    ```

    > A <- 1:8

    > print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[2];

    [1] 2

    ```


    您也可以使用另一个向量来检索向量中的元素，例如，检索第二个和第五个元素：


    ```

    > A <- 1:8

    > print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[c(2, 5)];

    [1] 2 5

    ```


    要检索除第二个元素之外的所有元素，请执行以下操作：


    ```

    > A <- 1:8

    > print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[-2];

    [1] 1 3 4 5 6 7 8

    ```


    您还可以使用逻辑向量来检索向量的元素：


    ```

    > A <- 1:8

    > print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[c(FALSE, TRUE, FALSE, TRUE, FALSE, TRUE, FALSE, TRUE)];

    [1] 2 4 6 8

    ```


    您也可以使用大于或小于符号来检索元素：


    ```

    > A <- 1:8

    > print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[A > 5];

    [1] 6 7 8

    ```


    您可以使用赋值符号 `<-` 来修改向量，如下所示：


    ```

    > A <- 1:8

    > print(A);

    [1] 1 2 3 4 5 6 7 8

    > A[3] <- 9

    > print(A);

    [1] 1 2 9 4 5 6 7 8

    ```

