    ### 中位数


    中位数是数据的中间值或中点，也是数据的第 50 百分位数。中位数受数据中的异常值和偏态影响。如果数据存在偏态，中位数比均值更能衡量数据的集中趋势。均值是平均值，容易受异常值影响，因此当数据存在偏态时，中位数是更好的衡量指标。


    在 R 中，要获取中位数，你可以使用 `median()` 函数：


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > median(A);

    [1] 5

    ```


    要获取数据集的中位数：


    ```

    > median(data$x2);

    [1] 2.380852

    ```


    ### 均值


    均值是数据的平均值。它是所有数据之和除以数据点的个数。当数据呈正态分布或均匀分布时，均值效果最佳。如果分布是随机的，均值代表期望值。


    ![$$ \overline{x}=\frac{1}{N}\sum \limits_{i=1}^N\kern0.5em {x}_i=\frac{x_1+{x}_2+\dots
    +{x}_N}{N} $$](img/471585_1_En_4_Chapter_TeX_Equa.png)


    在 R 中，要获取均值，你可以使用 `mean()` 函数：


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > mean(A);

    [1] 4.6

    ```


    要获取数据集的均值：


    ```

    > mean(data$x2);

    [1] 2.46451

    ```


    ### 四分位距、方差、标准差


    变异性度量是衡量数据分散程度的指标。变异性度量可以是极差、四分位距、方差、标准差等。


    #### 极差


    极差是数据中最大值与最小值之间的差值。


    要在 R 中查找极差，你可以使用 `range()` 函数：


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > range(A);

    [1] 1 8

    ```


    要获取最大值与最小值之间的差值，你可以使用：


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > res <- range(A)

    > diff(res);

    [1] 7

    ```


    你也可以使用 `min()` 和 `max()` 函数来查找极差：


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > min(A);

    [1] 1

    > max(A);

    [1] 8

    > max(A) - min(A);

    [1] 7

    ```


    要获取数据集的极差：


    ```

    > res <- range(data$x2)

    > diff(res);

    [1] 10.65222

    > res <- range(data$x2, na.rm=TRUE)

    > diff(res);

    [1] 10.65222

    ```


    `na.rm` 是一个逻辑值，用于指明是否移除 NA 值。


    #### 四分位距


    四分位距是衡量第 75 百分位数（即第三个四分位数）与第 25 百分位数（即第一个四分位数）之间差值的指标。


    要获取四分位距，你可以使用 `IQR()` 函数：


    ```

    > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8)

    > IQR(A);

    [1] 2.5

    ```


    你可以通过使用 `quantile()` 函数来获取四分位数：


    ```

    > quantile(A);

    0%  25%  50%  75% 100%

    1.00 3.25 5.00 5.75 8.00

    ```


    你可以获取第 25 和第 75 百分位数：


    ```

    > quantile(A, 0.25);

    25%

    3.25

    > quantile(A, 0.75);

    75%

    5.75

    ```


    你可以使用以下方法获取数据集的四分位距和四分位数：


    ```

    > quantile(data$x2);

    0%       25%       50%       75%

    -2.298551  1.274672  2.380852  3.750422

    100%

    8.353669

    > IQR(data$x2);

    [1] 2.47575

    > IQR(data$x2, na.rm=TRUE);

    [1] 2.47575

    > help(IQR);

    ```


    `IQR()` 和 `quantile()` 函数可以通过 `na.rm = TRUE` 移除 NA 值。


    极差衡量数据的最大值和最小值，而四分位距衡量大多数数值所在的范围。

