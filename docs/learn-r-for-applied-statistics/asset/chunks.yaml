    and it is best for developing data product or software. The SAS programming language
    is commercial and not free. R has become very popular, according to the TIOBE
    ranking, and many companies like Facebook and Google have data scientists who
    use R. R is also very popular with academic researchers. R scripts or code can
    be run on different operating systems long as the R interpreter is installed.'
  trans: '

    ### 多样性


    更多的数据源意味着更多不同格式和类型的数据，例如图像、视频、语音、文本数据和数值数据，既有非结构化的也有结构化的。各种数据格式需要不同的方法来从中提取数据。这意味着数据难以处理和分析，传统的计算方法无法处理此类数据。


    由于物联网设备（如移动设备、无线传感器网络和 RFID 读取器）的普及，数据增长非常迅速。根据 IDC 的报告，从 2013 年到 2020 年，全球数据将从
    4.4 泽字节增长到 44 泽字节。


    关系型数据库以及桌面统计和数据科学软件在处理和分析大数据方面面临挑战。因此，大数据需要像`Hadoop`和`Apache Spark`这样的并行和分布式系统来处理和分析数据。


    两种流行的大数据系统或框架是`Apache Spark`和`Hadoop`。`Hadoop`是一个分布式数据系统，用于跨不同集群和计算机存储大数据。一个集群可以包含多台计算机。`Hadoop`的存储系统被称为`Hadoop
    分布式系统（HDFS）`。`Hadoop`拥有许多生态系统，例如用于执行机器学习处理的`mahout`。`Hadoop`也有处理系统，例如`MapReduce`。


    `Apache Spark`是一个数据处理系统，用于处理分布式数据上的数据。`Apache Spark`没有文件存储系统，因此需要集成到像`Hadoop`这样的系统中。`Apache
    Spark`速度更快，并能完成完整的数据分析、数据处理和数据预测。


    `R`、`Python`和`Java`可以与这些`Hadoop`和`Apache Spark`系统进行交互。


    ## 为什么选择 R？


    在学习数据科学时，许多人在选择学习哪种编程语言和数据科学工具上感到纠结。有许多可用于数据科学的编程语言，例如`R`、`Python`、`SAS`、`Java`等。还有许多数据科学软件包需要学习，例如`SPSS
    Statistics`、`SPSS Modeler`、`SAS Enterprise Miner`、`Tableau`、`RapidMiner`、`Weka`、`GATE`等。


    我推荐学习用于统计的`R`，因为它最初就是为统计而开发的。`Python`是一种真正的编程语言，因此你可以通过`Python`编程开发真正的应用程序和软件。因此，如果你想开发数据产品或数据应用，`Python`可能是更好的选择。`R`编程在统计方面非常强大，因此非常适合使用描述性统计、推断性统计、回归分析和数据可视化进行数据探索或数据理解。`R`也非常适合建模，因为你可以使用像回归这样的统计学习来进行预测分析。`R`也有一些用于数据挖掘、文本挖掘和机器学习的包，例如`Rattle`、`CARET`和`TM`。`R`编程还可以通过`Sparklyr`与像`Apache
    Spark`这样的大数据系统进行交互。`SAS`编程是商业软件，而`Java`可以直接与`GATE`、`Stanford NLP`和`Weka`交互。`SPSS
    Statistics`、`SPSS Modeler`、`SAS Enterprise Miner`和`Tableau`是带有图形用户界面的商业数据科学软件包。`RapidMiner`、`Weka`和`GATE`是用于数据科学的开源软件包。


    `R`在众多招聘数据科学家的公司中也得到了广泛应用。谷歌和 Facebook 都有使用`R`的数据科学家。`R`也被用于美国银行、福特、优步、Trulia
    等公司。


    `R`在学术界也广泛使用，并且在学术研究人员中非常受欢迎，他们可以使用`R`的图形功能进行出版。


    用`R`编写的脚本可以在不同的操作系统上运行，包括 Linux、苹果和 Windows，只要安装了`R`解释器即可。这对于像`C#`这样的语言来说是不可能的。


    ## 结论


    在本章中，你了解了`R`编程。现在你知道`R`编程是一种用于统计计算的编程语言，并得到`R 统计计算基金会`的支持。`R`语言被研究人员用于统计分析，并且`R`的受欢迎程度逐年上升。


    我还讨论了高级编程语言和低级编程语言。高级语言是为人类使用而设计的，更接近人类语言。另一方面，低级语言更接近机器和计算机语言。低级语言可以直接在计算机上执行，无需在语言之间进行转换，因此它们可能更快。


    我还讨论了统计学。统计学是一套处理数据组织、分析和解释的数学方法。数据分析中使用的三种主要统计方法是：描述性统计、推断性统计和回归分析。


    我还讨论了数据科学。数据科学是一个多学科领域，包括统计学、计算机科学、机器学习和领域专业知识，旨在从数据中获取知识和见解。数据科学通常最终会开发出一个数据产品。数据产品是将公司的数据转化为产品以解决问题。


    数据挖掘与数据科学密切相关。数据挖掘是使用统计学、机器学习以及数据仓库或数据库从数据中识别模式的过程。数据挖掘包含许多模型；`CRISP-DM`是数据挖掘中最流行的模型。在`CRISP-DM`中，数据挖掘包括业务理解、数据理解、数据准备、建模、评估和部署。


    虽然数据挖掘通常用于从数值数据中挖掘模式，但文本挖掘用于从文本数据（如推特推文、博客文章和反馈）中挖掘模式。文本挖掘，也称为文本数据挖掘，是从文本数据中推导出高质量语义和知识的过程。文本挖掘包括文本分类、文本聚类和实体提取；文本分析可能包括情感分析、`TF-IDF`、词性标注、命名实体识别和文本链接分析。文本挖掘使用与数据挖掘`CRISP-DM`模型相同的过程，但略有不同。


    自然语言处理是机器学习和计算机科学的一个领域，用于帮助计算机处理和理解自然语言。`NLP`可以包括词性标注、句法分析、波特词干提取、命名实体识别、光学字符识别、情感分析、语音识别等。`NLP`与文本分析和文本挖掘紧密配合。


    选择分析类型可能很困难且具有挑战性。幸运的是，分析可以分为描述性分析、预测性分析和规范性分析。没有哪一种分析类型绝对优于其他类型，但它们可以相互结合。


    大数据是指那些非常大且复杂以至于计算机难以处理的数据集。大数据面临的挑战可能包括数据捕获、数据存储、数据分析和数据可视化。大数据有三个特性：容量、速度和多样性。两种流行的大数据系统或框架是`Hadoop`和`Apache
    Spark`。


    在学习数据科学时，有许多编程语言，如`R`、`Python`、`SAS`和`Java`。还有许多数据科学软件包，例如`SPSS Statistics`、`SPSS
    Modeler`、`SAS Enterprise Miner`、`RapidMiner`和`Weka`。`R`是专门为统计而开发的，因此它最适合数据挖掘中的统计部分，例如数据理解、使用统计学习算法进行建模以及数据可视化。`R`拥有用于机器学习、自然语言处理和文本挖掘的包，以及用于大数据的`Apache
    Spark`。`Python`是一种完整的编程语言，最适合开发数据产品或软件。`SAS`编程语言是商业软件，不是免费的。根据`TIOBE`排名，`R`已经变得非常流行，许多公司如
    Facebook 和谷歌都有使用`R`的数据科学家。`R`在学术研究人员中也非常受欢迎。只要安装了`R`解释器，`R`脚本或代码就可以在不同的操作系统上运行。

    '
- fmt: '# 2. Getting Started


    R programming is a programming language with object-oriented features ideal for
    statistical computing and data visualizations. R programming can do descriptive
    statistics, inferential statistics, and regression analysis. R programming is
    a GNU package and is a command line application. `RStudio` is an integrated development
    environment (IDE) for R programming. An IDE offers features to help you write
    code more easily and more productively by providing a code editor, compiler, and
    debugger. The code editor usually has syntax highlighting and intelligent code
    completion.


    In this chapter, you will explore the R programming command line application and
    the `RStudio` IDE, and you will install R and `RStudio` on your computer. You
    will look into what an IDE is and you will explore the `RStudio` interface. `RStudio`
    and R can read a `.csv` file easily, perform some descriptive statistics, and
    plot simple graphs.


    ## What Is R?


    R programming is for statistical computing and is supported by the R Foundation
    for Statistical Computing. R programming is used by many academics and researchers
    for data and statistical analysis, and the popularity of R has risen over time.


    R is a GNU package and is available under the GNU General Public License, which
    can be assumed to be free to a certain extent and is open source. R is available
    in a command line application, as shown in Figure [2-1](#471585_1_En_2_Chapter.xhtml#Fig1).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig1_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    The RGui interface


    R programming is an implementation of the S programming language, its libraries
    consist of statistical and data visualization techniques, and it can conduct descriptive
    statistics, inferential statistics, and regressions analysis. You will explore
    the differences between the R programming command line application and the `RStudio`
    IDE, as well as the basics of the descriptive statistics features and the data
    visualization features.


    ## The Integrated Development Environment


    An IDE is a software application that helps programmers develop software more
    easily and more productively. An IDE is made up of a code editor, compiler, and
    debugger tools. Code editors usually offer syntax highlighting and intelligent
    code completion.


    Some IDEs, like `NetBeans`, also have an interpreter and others, like `SharDevelop`,
    don’t. Some IDEs have a version control system and tools like a graphical user
    interface (GUI) builder, and many IDEs have class and object browsers.


    IDEs are developed to increase the productivity of the developer by combining
    features like a code editor, compiler, debugger, and interpreter. This is different
    from a programming code text editor like `VI` and `NotePad++`, which offer syntax
    highlighting but usually don’t communicate with the debugger and compiler.


    The beginning of IDEs can be traced back to when punched cards were submitted
    to the compiler in early systems. Dartmouth BASIC was the first programming language
    to be created with an IDE. Maestro I was later created by Softlab Munich and can
    be considered the first full IDE between 1970s and 1980s. Maestro I can be found
    in the Museum of Information Technology at Arlington, Virginia. The Softbench
    IDE was later created to have plugins. Today, Visual Studio, `NetBeans`, and Eclipse
    are the most famous IDEs. The R programming IDE is `RStudio`, and Figure [2-2](#471585_1_En_2_Chapter.xhtml#Fig2)
    shows its intelligent code completion.


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig2_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    RStudio IDE intelligent code completion


    ## RStudio: The IDE for R


    In R programming, `RStudio` is the most popular IDE. `RStudio` has a code editor
    that consists of syntax highlighting and intelligent code completion functions.
    `RStudio` also has a workspace showing all the variables and history. You may
    double-click the variables to view them using tables and other options.


    The R console is in `RStudio` so you can view the results of the R scripts after
    running the scripts; you can also type into the R console with R code to do some
    simple computing. The Plots and Others portion is available in `RStudio` to let
    you view the charts and graphs plotted from R scripts. The Plots and Others portion
    allows you to easily save the graphs and charts. Figure [2-3](#471585_1_En_2_Chapter.xhtml#Fig3)
    shows the `RStudio` IDE interface.


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig3_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    RStudio IDE interface'
