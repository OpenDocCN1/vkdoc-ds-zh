    ## 相关性


    相关性是一种统计关联，用于发现两个变量之间的接近程度，并推导它们之间的线性关系。在预测分析中，你可以使用相关性来找出哪些变量与目标变量更相关，并以此减少变量数量。相关性并不意味着因果关系。相关性可以发现两个变量之间的接近程度，但不能告诉你关系的“如何”和“为什么”。因果关系则告诉你一个变量的变化会导致另一个变量的变化。


    相关性的公式为：


    ![$$ {r}_{xy}=\frac{\sum_{i=1}^n\left({x}_i-\overline{x}\right)\left({y}_i-\overline{y}\right)}{\sqrt{\sum_{i=1}^n{\left({x}_i-\overline{x}\right)}²{\sum}_{i=1}^n{\left({y}_i-\overline{y}\right)}²}}
    $$](img/471585_1_En_6_Chapter_TeX_Equa.png)


    其中 ![$$ {\left({x}_i-\overline{x}\right)}² $$](img/471585_1_En_6_Chapter_TeX_IEq1.png)
    是 x 值减去均值后再平方，而 ![$$ \left({y}_i-\overline{y}\right) $$](img/471585_1_En_6_Chapter_TeX_IEq2.png)
    ![$$ {\left({y}_i-\overline{y}\right)}² $$](img/471585_1_En_6_Chapter_TeX_IEq3.png)
    是 y 值减去均值后再平方。


    要计算相关性，首先需要生成样本数据：


    ```

    > View(iris_sample);

    > set.seed(123);

    > var1  var2  var3  data <- data.frame(var1, var2, var3);

    ```


    你可以使用 `cor()` 函数来计算相关性：


    ```

    > cor(data$var1, data$var2);

    [1] -0.04953215

    ```


    相关性的取值范围是从 -1.0 到 1.0。当相关性为 0 时，表示没有相关关系。当相关性大于 0 时，表示正相关。正相关意味着当一个变量值增加时，另一个变量值也随之增加。当相关性小于
    0 时，表示负相关。负相关意味着当一个变量增加时，其他变量的值会减少。1 是完全正相关，-1 是完全负相关。因此，数值越接近 1，或越接近 -1，关系就越好。


    `-0.04953215` 表示 `var1` 和 `var2` 之间存在负相关关系。该相关性接近于零，因此关系并不理想。

