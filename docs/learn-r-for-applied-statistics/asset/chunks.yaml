    # 折线图与饼图


    折线图是一种通过线条连接所有数据点而形成的图形。折线图对于趋势分析和时间序列分析非常有用。而饼图则是将数据表示为带有不同颜色的圆形切片。


    你可以使用 `plot()` 函数绘制折线图（见图 5-8）：


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig8_HTML.jpg](img/471585_1_En_5_Fig8_HTML.jpg)


