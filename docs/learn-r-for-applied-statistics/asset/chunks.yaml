  trans: '

    # 什么是推断统计与回归分析？


    推断统计与描述统计是统计学的两大分支。描述统计通过均值、中位数等集中趋势，方差、标准差等离散程度，以及偏度和峰度来概括数据特征。


    推断统计则对总体和样本数据进行描述和推断。在推断统计中，你会用到假设检验和参数估计。通过参数估计，你试图回答总体参数的问题；通过假设检验，你试图回答一个研究问题。在假设检验中，研究问题是以疑问句形式提出的假设。例如，研究问题可以是：*一班和二班的工程数学考试成绩是否存在显著差异？*
    而假设可以是：*一班和二班的工程数学考试成绩存在显著差异。* 研究问题以"是否存在"开头，假设以"存在"开头。根据研究问题，假设可分为原假设 `H[0]`
    和备择假设 `H[a]`。原假设 `H[0]` 可以是 `μ[1] = u[2]`，备择假设 `H[a]` 可以是 `μ[1] ≠ u[2]`。其中 `μ[1]`
    是一班成绩的均值，`μ[2]` 是二班成绩的均值。随后你可以使用推断检验来获取 p 值。如果 p 值小于或等于显著性水平 alpha（通常为 0.05），则拒绝原假设，并认为在
    95% 置信区间下备择假设成立。如果 p 值大于 0.05，则无法拒绝原假设。


    对于参数估计，参数可以是均值、方差、标准差等。如果你想估计整个人群的身高均值（顺便提一句，测量所有人是不可能的），你可以采用抽样方法从人群中选取一部分人。接着计算样本的身高均值，然后推断总体身高的均值。之后你可以构建置信区间，即总体身高均值可能落入的范围。之所以构建一个范围，是因为样本无法精确推导出总体身高的均值。


    回归分析是一套用于估计变量之间关系的统计过程。更具体地说，回归分析用于理解自变量与因变量之间的关系，并探索这些关系的形式。


    ## `apply()`、`lapply()`、`sapply()`


    `apply()` 函数可以执行循环来遍历数据并应用一个函数。该函数可以是 R 语言中的 `mean()` 函数，也可以是自定义函数。使用 `apply()`
    函数是为了避免使用循环。`apply()` 函数可以处理列表、矩阵或数组。


    要使用 `apply()` 函数，先创建随机数据：


    ```

    > set.seed(123);

    > var1  var2  var3  data  data;

