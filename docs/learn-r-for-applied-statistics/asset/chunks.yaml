    You can read a comma-separated values (CSV) file using the `read.csv()` function
    in the R programming language, as seen in Figure [2-17](#471585_1_En_2_Chapter.xhtml#Fig17).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig17_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig17_HTML.jpg)


    Figure 2-17: RGui: Reading a CSV


    ```

    myData <- read.csv(file="D:/data.csv", header=TRUE, sep=",");

    myData;

    ```


    In the R programming language, you can use the `summary()` function to get the
    basic descriptive statistics for all the variables. I will discuss descriptive
    statistics, shown in Figure [2-18](#471585_1_En_2_Chapter.xhtml#Fig18), in a future
    chapter of this book.


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig18_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig18_HTML.jpg)


    Figure 2-18: RGui: The `summary()` function


    ```

    summary(myData);

    ```


    In the R programming language, you can plot a scatterplot using the `plot()` function,
    as seen in Figure [2-19](#471585_1_En_2_Chapter.xhtml#Fig19).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig19_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig19_HTML.jpg)


    Figure 2-19: RGui: Plotting a chart


    ```

    plot(myData$x, myData$x2);

    ```


    RStudio is an IDE that provides a GUI for the R programming command line application.
    RStudio provides word suggestions and syntax highlighting for the R programming
    language. The RStudio IDE for the R programming language is seen in Figure [2-20](#471585_1_En_2_Chapter.xhtml#Fig20).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig20_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig20_HTML.jpg)


    Figure 2-20: The RStudio IDE interface


    With RStudio, you can write all the code into the code editor and run the script,
    as seen in Figures [2-22](#471585_1_En_2_Chapter.xhtml#Fig22), [2-23](#471585_1_En_2_Chapter.xhtml#Fig23),
    and [2-24](#471585_1_En_2_Chapter.xhtml#Fig24).


    ```

    myData <- read.csv(file="D:/data.csv", header=TRUE, sep=",");

    myData;

    summary(myData);

    plot(myData$x, myData$x2);

    ```


    As you type the code, RStudio shows the intelligent code completion, as shown
    in Figure [2-21](#471585_1_En_2_Chapter.xhtml#Fig21).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig21_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig21_HTML.jpg)


    Figure 2-21: RStudio IDE intelligent code completion


    You must select all the R code in the code editor and click Run or press `Ctrl
    + Enter` to run the script (Figure [2-22](#471585_1_En_2_Chapter.xhtml#Fig22)).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig22_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig22_HTML.jpg)


    Figure 2-22: RStudio IDE: Running a script


    Or you can click Code ➤ Run Region ➤ Run All (Figure [2-23](#471585_1_En_2_Chapter.xhtml#Fig23)).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig23_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig23_HTML.jpg)


    Figure 2-23: RStudio IDE: Running a script


    The results are shown in Figure [2-24](#471585_1_En_2_Chapter.xhtml#Fig24).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig24_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig24_HTML.jpg)


    Figure 2-24: RStudio IDE: Results after running the R script


    The RStudio IDE offers syntax highlighting features in the code editor. When you
    run the R script, you can view the results in the Console tab and see the scatterplot
    in the Plots tab. By double-clicking `myData` in the Global Environment tab, you
    can view the data loaded from the `.csv` file, as shown in Figure [2-25](#471585_1_En_2_Chapter.xhtml#Fig25).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig25_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig25_HTML.jpg)


    Figure 2-25: RStudio IDE: Viewing the loaded data


    ## Conclusion


    In this chapter, you looked at R programming. You now understand what R programming
    is: it’s a programming language for statistical computing and is supported by
    the R Foundation for Statistical Computing. R programming is used by researchers
    for statistical analysis, and R popularity has increased every year.


    You also explored RStudio. RStudio is the IDE for the R programming language and
    it has syntax highlighting and intelligent code completion to assist you in writing
    R scripts more easily and more productively. You also looked at how R can read
    a `.csv` file and perform descriptive statistics and data visualizations, and
    you explored the differences between them.


    You also installed R and the RStudio IDE, and you saw how to allow RStudio IDE
    to integrate with the R programming command line application.


    You also learned that an IDE is software to help you write code more easily and
    more productively. IDEs usually offer syntax highlighting and intelligent code
    completion and have a code editor, a compiler, and a debugger.


    For R programming, RStudio is the most popular IDE. RStudio has a code editor
    that consists of syntax highlighting and intelligent code completion. RStudio
    also has a workspace showing all the variables and history. You may double-click
    the variables to view them using tables and more. The R console is in RStudio
    so you can view the results of R scripts. The Plots and Others portion is available
    in RStudio to let you view the charts and graphs plotted from the R code.


    # Basic Syntax


    You will use R for applied statistics, which can be used in the data understanding
    and modeling stages of the CRISP-DM data mining model. R programming is a programming
    language with object-oriented programming features. R programming was created
    for statistics and is used in the academic and research fields. However, before
    you go into statistics, you need to learn to program R scripts.


    In this chapter, you will explore the syntax of R programming. I will discuss
    the R console and code editor in RStudio, as well as R objects and the data structure
    of R programming, from variables and data types to lists, vectors, matrices, and
    data frames. I will also discuss conditional statements, loops, and functions.
    Then you will create a simple calculator after learning the basics.


    ## Writing in R Console


    As you saw in Chapter [2](#471585_1_En_2_Chapter.xhtml), the R console offers
    a fast and easy way to do statistical calculations and some data visualizations.
    The R console is also like a calculator, so you can always use the R console to
    calculate some math equations.


    To do math calculations, you can just type in some math equations like:


    ```

    1 + 1

    > 1 + 1

    [1] 2

    1 – 3

    > 1 - 3

    [1] -2

    1 * 5

    > 1 * 5

    [1] 5

    1 / 6

    > 1 / 6

    [1] 0.1666667

    tan(2)

    > tan(2)

    [1] -2.18504

    ```


    To do some simple statistical calculations, you can do the following:


    Standard deviation


    ```

    sd(c(1, 2, 3, 4, 5, 6))

    >sd(c(1, 2, 3, 4, 5, 6))

    [1] 1.870829

    ```


    Mean


    ```

    mean(c(1, 2, 3, 4, 5, 6))

    > mean(c(1, 2, 3, 4, 5, 6))

    [1] 3.5

    ```


    Min


    ```

    min(c(1, 2, 3, 4, 5,6 ))

    > min(c(1, 2, 3, 4, 5, 6))

    [1] 1

    ```


    To plot charts or graphs, type:


    ```

    plot(c(1, 2, 3, 4, 5, 6), c(2, 3, 4, 5, 6, 7))

    > plot(c(1, 2, 3, 4, 5, 6), c(2, 3, 4, 5, 6, 7))

    ```


    which is shown in Figure [3-1](#471585_1_En_3_Chapter.xhtml#Fig1).


    ![../images/471585_1_En_3_Chapter/471585_1_En_3_Fig1_HTML.jpg](images/471585_1_En_3_Chapter/471585_1_En_3_Fig1_HTML.jpg)


    Figure 3-1: Scatter plot


    To sum up, the R console, despite being basic, offers the following advantages:


    * High performance

    * Fast prototyping and testing of your ideas and logic before proceeding further,
    such as when developing Windows Form applications

    * Personally, I use the R console application to test algorithms and other code
    fragments when in the process of developing complex R scripts.'
