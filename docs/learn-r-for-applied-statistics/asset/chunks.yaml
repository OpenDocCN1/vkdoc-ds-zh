  trans: '

    # 2. 入门指南


    R 语言是一种具有面向对象特性的编程语言，非常适合统计计算和数据可视化。R 语言可以执行描述性统计、推断性统计以及回归分析。R 语言是一个 GNU 软件包，也是一款命令行应用程序。`RStudio`
    是 R 语言的集成开发环境（IDE）。IDE 通过提供代码编辑器、编译器和调试器等功能，帮助你更轻松、更高效地编写代码。代码编辑器通常具备语法高亮和智能代码补全功能。


    在本章中，你将探索 R 语言命令行应用程序和 `RStudio` IDE，并在你的计算机上安装 R 和 `RStudio`。你将了解什么是 IDE，并探索
    `RStudio` 的界面。`RStudio` 和 R 可以轻松读取 `.csv` 文件，执行一些描述性统计，并绘制简单的图表。


    ## 什么是 R？


    R 语言用于统计计算，并得到 R 统计计算基金会的支持。许多学者和研究人员使用 R 语言进行数据和统计分析，并且 R 语言的受欢迎程度随着时间的推移而不断上升。


    R 是一个 GNU 软件包，遵循 GNU 通用公共许可证发布，可以认为它在某种程度上是免费且开源的。R 以命令行应用程序的形式提供，如图 2-1 所示。


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig1_HTML.jpg](img/471585_1_En_2_Fig1_HTML.jpg)


    图 2-1


    RGui 界面


    R 语言是 S 编程语言的一种实现，其库包含统计和数据可视化技术，并且可以执行描述性统计、推断性统计和回归分析。你将探索 R 语言命令行应用程序与 `RStudio`
    IDE 之间的区别，以及描述性统计特性和数据可视化特性的基础知识。


    ## 集成开发环境


    IDE 是一种帮助程序员更轻松、更高效地开发软件的软件应用程序。IDE 由代码编辑器、编译器和调试器工具组成。代码编辑器通常提供语法高亮和智能代码补全功能。


    有些 IDE（如 `NetBeans`）还包含解释器，而其他 IDE（如 `SharDevelop`）则没有。有些 IDE 包含版本控制系统和图形用户界面（GUI）构建器等工具，许多
    IDE 还包含类和对象浏览器。


    IDE 的开发目的是通过整合代码编辑器、编译器、调试器和解释器等功能来提高开发者的生产力。这与 `VI` 和 `NotePad++` 等编程代码文本编辑器不同，后者虽然提供语法高亮，但通常不与调试器和编译器进行通信。


    IDE 的起源可以追溯到早期系统中将穿孔卡片提交给编译器的时代。Dartmouth BASIC 是第一个随 IDE 一起创建的编程语言。后来，慕尼黑的 Softlab
    公司创建了 Maestro I，它可以被认为是 20 世纪 70 年代到 80 年代之间第一个完整的 IDE。Maestro I 可以在弗吉尼亚州阿灵顿的信息技术博物馆中找到。后来创建的
    Softbench IDE 支持插件。如今，Visual Studio、`NetBeans` 和 Eclipse 是最著名的 IDE。R 语言的 IDE 是
    `RStudio`，图 2-2 展示了它的智能代码补全功能。


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig2_HTML.jpg](img/471585_1_En_2_Fig2_HTML.jpg)


    图 2-2


    RStudio IDE 的智能代码补全


    ## RStudio：R 语言的 IDE


    在 R 语言中，`RStudio` 是最流行的 IDE。`RStudio` 拥有一个包含语法高亮和智能代码补全功能的代码编辑器。`RStudio` 还有一个工作区，显示所有变量和历史记录。你可以双击变量，通过表格和其他选项来查看它们。


    R 控制台位于 `RStudio` 中，因此你可以在运行脚本后查看 R 脚本的结果；你也可以在 R 控制台中输入 R 代码来进行一些简单的计算。`RStudio`
    中提供了“绘图和其他”区域，让你可以查看由 R 脚本绘制的图表和图形。“绘图和其他”区域允许你轻松保存图形和图表。图 2-3 展示了 `RStudio` IDE
    的界面。


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig3_HTML.jpg](img/471585_1_En_2_Fig3_HTML.jpg)


    图 2-3


    RStudio IDE 界面

    '
- fmt: '# Installation of R and RStudio


    In order to code R scripts, you must install the R programming command line application.
    You can download the R programming command line application from [`www.r-project.org/`](http://www.r-project.org/),
    as seen in Figure [2-4](#471585_1_En_2_Chapter.xhtml#Fig4).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig4_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    The R project website


    In this book, you will download R for Windows. You can also download for Linux
    and Mac OS, as seen in Figure [2-5](#471585_1_En_2_Chapter.xhtml#Fig5).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig5_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    Downloading the R base for different OS options


    To install the software, double-click the download setup file and follow the instructions
    of the installer to install the R programming command line application, as seen
    in Figure [2-6](#471585_1_En_2_Chapter.xhtml#Fig6).


    ![../images/471585_1_En_2_Chapter/471585_1_En_2_Fig6_HTML.jpg](images/471585_1_En_2_Chapter/471585_1_En_2_Fig6_HTML.jpg)


    Figure 2-6


    Installation of R


    After the R programming command line application is installed, you can start it,
