- fmt: '# What Are Inferential Statistics and Regressions?


    Inferential statistics and descriptive statistics are the two main branches of
    statistics. Descriptive statistics derives a summary from the data by using central
    tendencies like mean and median, dispersions like variance and standard deviation,
    and skewness and kurtosis.


    Inferential statistics describes and makes inferences about the population and
    the sampled data. In inferential statistics, you use hypothesis testing and estimating
    of parameters. By estimating parameters, you try to answer the population parameters.
    In hypothesis testing, you try to answer a research question. In hypothesis testing,
    a research question is a hypothesis asked in question format. A research question
    can be, *Is there a significant difference between the grades of class 1 and class
    2 for their engineering math exams?* A hypothesis can be, *There is a significant
    difference between the grades of class 1 and class 2 for their engineering math
    exams.* The research question begins with *Is there* and the hypothesis begins
    with *There is*. Based on the research question, the hypothesis can be a null
    hypothesis, `H[0]`, and an alternate hypothesis, `H[a]`. A null hypothesis, `H[0]`,
    can be `μ[1] = u[2]` and an alternate hypothesis, `H[a]`, can be `μ[1] ≠ u[2]`.
    So `μ[1]` is the mean of the grades of class 1 and `μ[2]` is the mean of the grades
    of class 2. You can then use inference tests to get the p-value. If the p-value
    is less than or equal to alpha, which is usually 0.05, you reject the null hypothesis
    and say that the alternate hypothesis is true at the 95% confidence interval.
    If the p-value is more than 0.05, you fail to reject the null hypothesis.


    For estimating parameters, the parameters can be the mean, variance, standard
    deviation, and others. If you want to estimate the mean of heights of the whole
    population (and by the way, it is impossible to measure everyone in the population),
    you can use a sampling method to select some people from the population. Subsequently,
    you calculate the mean of the height of the samples and then make an inference
    on the mean of the height of the population. You can then construct the confidence
    intervals, which is the range in which the mean of the height of the population
    will fall. You construct a range because the sample cannot derive the exact mean
    of the height of the population.


    Regression analysis is a set of statistical processes to estimate the relationships
    between all the variables. To be more specific, regression analysis is used to
    understand the relationships among independent variables and dependent variables
    and to explore the forms of the relationships.


    ## `apply()`, `lapply()`, `sapply()`


    The `apply()` function can perform a loop to go through the data and apply a function.
    The function can be the `mean()` function from R or it can be a customized function.
    The use of the `apply()` function is to avoid the use of loops. The `apply()`
    function can take list, matrix, or array.


    To use the `apply()` function, you create random data:


    ```

    > set.seed(123);

    > var1  var2  var3  data  data;

    var1      var2        var3

    1    1.43952435 2.2895934  7.39762070

    2    1.76982251 3.2568837  5.62482595

    3    3.55870831 2.7533081  2.46970989

    4    2.07050839 2.6524574  4.08638812

    5    2.12928774 2.0483814  2.17132010

    6    3.71506499 2.9549723  2.04750621

    7    2.46091621 2.2150955  1.42279432

    8    0.73493877 1.3320581  1.81076547

    9    1.31314715 2.6197735  6.30181493

    10   1.55433803 3.9189966  2.89194375

    ```


    You can use the `apply()` function with a `mean()` function:


    ```

    > apply(data, 1, mean);

    [1] 3.708913 3.550511 2.927242 2.936451 2.116330 2.905848 2.032935 1.292587 3.411579
    2.788426

