    For more advanced duplicate removal for text data, you may use the Levenshtein
    similarity algorithm and others. It is beyond the scope of this book to cover
    the similarity duplicate removal. For each row of data, you can get the Levenshtein
    similarity between the current row and all other rows of the data and return the
    results with a similarity below a stated value. You can then check whether they
    are really similar and duplicated, and remove them as needed.


    ## Some Basic Statistics Terms


    The following are some of the most popular terms used in statistics.


    - **Population**: Population is the total set of observations. A population is
    the whole, and it comprises every member or observation.

    - **Sample**: A sample is a portion of a population. A sample can be extracted
    from the population using random sampling techniques and others.

    - **Observations**: An observation is something you measure or count during a
    study or experiment. An observation usually means the row in data.

    - **Variables**: A variable is a characteristic or quantity that can be counted
    and can be called a data item. Variables usually refer to the column.


    ### Types of Data


    Data can be numeric data or categorical data.


    - Numeric data can have discrete data or continuous data. Discrete variables usually
    take integer values. Discrete variables have steps. Continuous variables can be
    any real number values.

    - Categorical data are categories or non-numeric data. Categorical data can have
    nominal variables that have unordered categories. Ordinal variables can have ordered
    categories.


    ### Mode, Median, Mean


    Mean, median, and mode are the most common measures for central tendency. Central
    tendency is a measure that best summarizes the data and is a measure that is related
    to the center of the data set.'
