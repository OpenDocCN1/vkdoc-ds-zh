    ## 抽样


    抽样是从总体中选取一个子集的过程。总体包含所有成员的数据。有时样本可以是完整数据集的一个子集。抽样的优势在于成本更低，且数据收集效率高于收集总体中每个成员的数据。


    ### 简单随机抽样


    简单随机抽样（SRS）是从完整数据集中随机选取元素。每个元素被选中的概率相同，且每个子集被选中的概率也与其他子集相同。


    ### 分层抽样


    分层抽样是根据一个因素、特征或多个因素将总体划分为若干组。这些组称为层（strata），单个组称为一个层（stratum）。在分层抽样中，执行以下步骤：


    1. 将总体划分为若干组。

    2. 对每组使用简单随机抽样。

    3. 从每个抽样单元收集数据。


    当异质性总体被划分为同质性组别时，分层抽样效果良好。

    '
- fmt: '### Cluster Sampling


    Cluster sampling is different from stratified sampling. It should be done in the
    following way:


    1. Divide the population into clusters.

    2. Use random sampling on clusters from all possible clusters.

    3. Collect data from a sampling unit.


    Unlike stratified sampling, cluster sampling all members of the selected clusters
    forms a sample, while in stratified sampling, a sample is based on the random
    selection of members from all the strata. For example, say 13 colleges are the
    strata and clusters. In stratified sampling, 30 students from each college or
    strata are selected using random sampling. In cluster sampling, all students in
    5 out of 13 colleges are selected using random sampling.


    You can do random sampling using the `sample()` function:


    ```

    > set.seed(123);

    > var1  var2  var3  data  sample(data$var1, 5, replace=TRUE);

    [1] 1.27110877 2.92226747 0.97399555 1.70492852 0.03338284

    ```


    `data$var1` is the data, `5` is the number of items to select from, and `replace=TRUE`
    means that the chosen item can be repeated. If `replace=FALSE`, the chosen item
    cannot be repeated.


    You can do stratified sampling using the `dplyr` library. You must install the
    `dplyr` library before using it:


    ```

    > install.packages("dplyr");

    Installing package into ''C:/Users/gohmi/Documents/R/win-library/3.5''

    (as ''lib'' is unspecified)

