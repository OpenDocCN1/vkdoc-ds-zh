    inferential statistics can be used to test two data sets and samples, and regressions
    can be used to explore the relationships between multiple variables. Data visualizations
    use charts, graphs, and dashboards to understand the data. This phase allows you
    to understand the quality of data.'
  raw: '## What Is Statistics?


    Statistics is a collection of mathematics to deal with the organization, analysis,
    and interpretation of data. Three main statistical methods are used in the data
    analysis: descriptive statistics, inferential statistics, and regressions analysis.


    Descriptive statistics summarizes the data and usually focuses on the distribution,
    the central tendency, and the dispersion of data. The distribution can be normal
    distribution or binomial distribution, and the central tendency is to describe
    the data with respect to the central of the data. The central tendency can be
    the mean, median, and mode of the data. The dispersion describes the spread of
    the data, and dispersion can be the variance, standard deviation, and interquartile
    range.


    Inferential statistics tests the relationship between two data sets or two samples,
    and a hypothesis is usually set for the statistical relationships between them.
    The hypothesis can be a null hypothesis or alterative hypothesis, and rejecting
    the null hypothesis is done using tests like the T Test, Chi Square Test, and
    ANOVA. The Chi Square Test is more for categorical variables, and the T Test is
    more for continuous variables. The ANOVA test is for more complex applications.


    Regression analysis is used to identify the relationships between two variables.
    Regressions can be linear regressions or non-linear regressions. The regression
    can also be a simple linear regression or multiple linear regressions for identifying
    relationships for more variables.


    Data visualization is the technique used to communicate or present data using
    graphs, charts, and dashboards. Data visualizations can help us understand the
    data more easily.


    ## What Is Data Science?


    Data science is a multidisciplinary field that includes statistics, computer science,
    machine learning, and domain expertise to get knowledge and insights from data.
    Data science usually ends up developing a data product. A data product is the
    changing of the data of a company into a product to solve a problem.


    For example, a data product can be the product recommendation system used in Amazon
    and Lazada. These companies have a lot of data based on shoppers’ purchases. Using
    this data, Amazon and Lazada can identify the shopping patterns of shoppers and
    create a recommendation system or data product to recommend other products whenever
    a shopper buys a product.


    The term “data science” has become a buzzword and is now used to represent many
    areas like data analytics, data mining, text mining, data visualizations, prediction
    modeling, and so on.


    The history of data science started in November 1997, when C. F. Jeff Wu characterized
    statistical work as data collection, analysis, and decision making, and presented
    his lecture called “Statistics = Data Science?” In 2001, William S. Cleveland
    introduced data science as a field that comprised statistics and some computing
    in his article called “Data Science: An Action Plan for Expanding the Technical
    Area of the Field of Statistics.”


    DJ Patil, who claims to have coined the term “data science” with Jeff Hammerbacher
    and who wrote the “Data Scientist: The Sexiest Job of the 21st Century” article
    published in the *Harvard Business Review*, says that there is a data scientist
    shortage in many industries, and data science is important in many companies because
    data analysis can help companies make many decisions. Every company needs to make
    decisions in strategic directions.


    Statistics is important in data science because it can help analysts or data scientists
    analyze and understand data. Descriptive statistics assists in summarizing the
    data, inferential statistics tests the relationship between two data sets or samples,
    and regression analysis explores the relationships between multiple variables.
    Data visualizations can explore the data with charts, graphs, and dashboards.
    Regressions and machine learning algorithms can be used in predictive analytics
    to train a model and predict a variable.


    Linear regression has the formula y = mx + c. You use historical data to train
    the formula to get the m and c. Y is the output variable and x is the input variable.
    Machine learning algorithms and regression or statistical learning algorithms
    are used to predict a variable like this approach.


    Domain expertise is the knowledge of the data set. If the data set is business
    data, then the domain expertise should be business; if it is university data,
    education is the domain expertise; if the data set is healthcare data, healthcare
    is the domain knowledge. I believe that business is the most important knowledge
    because almost all companies use data analysis to make important strategic business
    decisions.


    Adding in product design and engineering knowledge takes us into the fields of
    Internet of Things (IoT) and smart cities because data science and predictive
    analytics can be used on sensor data. Because data science is a multidisciplinary
    field, if you can master statistics, machine e-learning, and business knowledge,
    it is extremely hard to be replaced. You can also work with statisticians, machine
    learning engineers, or business experts to complete a data science project.


