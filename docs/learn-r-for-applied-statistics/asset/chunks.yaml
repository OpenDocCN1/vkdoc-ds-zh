    ## 非参数检验


    非参数检验是一种不要求变量和样本服从正态分布的检验方法。大多数情况下，你应该使用参数检验，如 t 检验、卡方检验和方差分析，因为它们更准确。当你的数据不服从正态分布且样本量较大时，可以使用非参数检验。


    ### Wilcoxon 符号秩检验


    Wilcoxon 符号秩检验用于替代单样本 t 检验。


    1.  对于每个 `x[i]`，其中 `i = 1, 2, …., n`，符号差为 `d[i] = x[i] - u[0]`，这里 `u[0]` 是给定的中位数。

    2.  忽略 `d[i] = 0`，并对剩余的 `|d[i]|` 进行排序，使用 `r[i]` 作为秩。当存在相同值时，分配这些相同秩的平均值。例如，`|d[i]|`
    的秩为 3、4、5 且相同，则秩应为 `(3+4+5)/3 = 4`。

    3.  找出非零 `d[i]` 的个数。

    4.  对于 `d[i]` 的每个秩，令 `s[i] = sign(d[i]) * r[i]`。

    5.  正符号秩的和使用 `W = sum(s_i)` 计算，其中 `s_i > 0`。


    计算出的检验统计量为 `W`，并计算出非零 `d[i]` 的个数 `n[1]`。


    零假设是总体中位数具有指定的值 `μ[0]`。


    *   零假设：`H[0] : μ = μ[0]`

    *   备择假设：`H[a] : μ ≠ μ[0]`


    正态检验统计量公式为 `z = (W - n1(n1+1)/4 - 0.5 * sign(W - n1(n1+1)/4)) / sqrt(0.25 * sum(S_i²))`。


    当 `|z| > Z_{α/2}` 时，你拒绝零假设，其中 `Z ~ N(0,1)`。


    常见的 alpha 值 `α` 为 `0.05`。


    要在 R 中使用 Wilcoxon 符号秩检验，你可以首先使用 `random.org` 包生成数据集，这样变量就不服从正态分布。要使用 `random.org`
    生成随机数，你必须安装 `random` 包：


    ```

