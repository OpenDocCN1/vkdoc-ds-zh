    # 什么是描述性统计？


    描述性统计对数据进行汇总，通常关注数据的分布、集中趋势和离散程度。分布可以是正态分布、二项分布以及其他分布，如伯努利分布。二项分布和正态分布是更流行和重要的分布，尤其是正态分布。在探索数据和进行许多统计检验时，你通常会检查数据的正态性，即数据符合正态分布的程度或可能性。中心极限定理指出，无论样本是否来自正态分布，当样本量增加时，样本或子集的均值将等于正态分布的均值。用于描述数据中心特征的是集中趋势，而非中心极限定理。集中趋势可以是数据的均值、中位数和众数。离散程度描述了数据的分散情况，可以是方差、标准差和四分位距。


    描述性统计汇总了数据集，让我们对数据和变量有所感知和理解，并使我们能够决定或判断是应该使用推断统计来识别数据集之间的关系，还是使用回归分析来识别变量之间的关系。


    # 读取数据文件


    R 编程允许你导入数据集，数据集可以是逗号分隔值（CSV）文件、Excel 文件、制表符分隔文件、JSON 文件或其他格式。将数据读入 R 控制台或 R 环境非常重要，因为在进行统计计算和理解数据之前，你必须先拥有一些数据。


    在考虑将数据导入 R 控制台之前，你必须首先确定你的工作空间或工作目录。你应该始终设置当前工作空间目录，以告知 R 你当前项目文件夹的位置。这有助于更方便地引用数据文件和脚本。


    要打印当前工作目录，可以使用 `getwd()` 函数：


    ```

    # 获取当前工作空间位置

    print(getwd());

    > print(getwd());

    [1] "C:/Users/gohmi/Documents"

    ```


    你可以使用 `setwd()` 函数设置工作目录：


    ```

    # 设置当前工作空间位置

    setwd("D:/R");   # 输入你自己的文件目录，此处我们使用 "D:/R"

    > setwd("D:/R");

    ```


    要获取新的工作目录位置，可以使用 `getwd()` 函数：


    ```

    # 获取新的工作空间

    print(getwd());

    > print(getwd());

    [1] "D:/R"

    ```


    你可以将 `data.csv` 数据集放入 `D:/R` 文件夹中。


    ## 读取 CSV 文件


    你可以使用 `read.csv()` 函数将数据 CSV 文件读入 R 控制台：


    ```

    > data <- read.csv(file="data.csv", header=TRUE, sep=",");

    ```


    你可以通过点击 RStudio IDE 中全局环境部分的数据来查看数据。数据将以表格形式显示。你可以使用 `data.csv` 读取文件，因为你已将工作目录设置为
    `D:/R`，所以 `file="data.csv"` 指的是 `D:/R/data.csv`。见图 4-1。


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig1_HTML.jpg](img/471585_1_En_4_Fig1_HTML.jpg)


    图 4-1


    在 RStudio 中以表格形式查看数据


    数据变量的数据类型是数据框。你可以使用 `class()` 函数判断数据类型是否为数据框：


    ```

    > class(data);

    [1] "data.frame"

    ```


    用于读取 .csv 文件的函数是：


    ```

    > data <- read.csv(file="data.csv", header=TRUE, sep=",");

    ```


    `file` 是你要读取的文件名或数据文件路径。`header` 是一个逻辑值，用于确定变量名称是否在第一行。`sep` 是分隔符，`quote` 是引用字符，其中
    `"\"` 表示双引号，`\''` 表示单引号。你可以按如下方式添加双引号的引用：


    ```

    > data  View(data);

    ```


    ## 写入 CSV 文件


    要写入 CSV 文件，可以使用 `write.csv()` 函数：


    ```

    > write.csv(data, file="data2.csv", quote=TRUE, na="na", row.names=FALSE);

    ```


    导出的文件如图 4-2 所示。


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig2_HTML.jpg](img/471585_1_En_4_Fig2_HTML.jpg)


    图 4-2


    在 Microsoft Excel 中打开的导出 CSV 文件


    在你之前用于导出 CSV 文件的 `write.csv()` 函数中：


    ```

    > write.csv(data, file="data2.csv", quote=TRUE, na="na", row.names=FALSE);

    ```


    `data` 是你要导出的数据框类型变量，`file` 是导出的文件路径或位置，`quote` 是一个逻辑值，用于说明是否添加引号，`na` 是用于缺失值的字符串值，`row.names`
    是一个逻辑值，用于指示是否写入行名。


    ## 读取 Excel 文件


    数据集也可以是 Excel 格式或 .xlsx 格式。要读取 Excel 文件，你需要使用 xlsx 包。xlsx 包需要 Java 运行时环境，因此你必须在计算机上安装它。要安装
    xlsx 包，请转到 R 控制台并输入以下内容，如图 4-3 所示：


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig3_HTML.jpg](img/471585_1_En_4_Fig3_HTML.jpg)


    图 4-3


    在 RStudio 中安装 xlsx 包


    ```

    > install.packages("xlsx");

    ```


    要使用 xlsx 包，请使用 `require()` 函数：


    ```

    > require("xlsx");

    Loading required package: xlsx

    ```


    要读取 Excel 文件，可以使用 `read.xlsx()` 函数：


    ```

    > data <- read.xlsx(file="data.xlsx", 1);

    ```


    `file` 是 Excel 文件的位置。`1` 指的是工作表编号 1。


    要查看 `data` 变量，可以使用 `View()` 函数或点击 RStudio 环境部分中的 `data` 变量，如图 4-4 所示。


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig4_HTML.jpg](img/471585_1_En_4_Fig4_HTML.jpg)


    图 4-4


    在 RStudio 中查看数据


    要查找 `read.xlsx()` 的文档，可以使用以下代码，如图 4-5 所示：


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig5_HTML.jpg](img/471585_1_En_4_Fig5_HTML.jpg)


    图 4-5


    read.xlsx() 的文档


    ```

    > help(read.xlsx);

    ```


    数据变量的数据类型是数据框：


    ```

    > class(data);

    [1] "data.frame"

    ```


    ## 写入 Excel 文件


    要写入 Excel 文件，可以使用 `write.xlsx()` 函数：


    ```

    > write.xlsx(data, file="data2.xlsx", sheetName="sheet1", col.names=TRUE, row.names=FALSE);

    ```


    `data` 是要导出到 Excel 文件的数据框类型变量，`file` 是文件位置或路径，`sheetName` 是工作表名称，`col.names` 和
    `row.names` 是逻辑值，用于说明是否导出列名或行名。


    要查看 `write.xlsx()` 函数或任何 R 函数的文档，可以使用 `help()` 函数。


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig6_HTML.jpg](img/471585_1_En_4_Fig6_HTML.jpg)


    图 4-6


    导出的 xlsx 文件

