  trans: '

    # 什么是统计学？


    统计学是一门处理数据的组织、分析和解释的数学学科。数据分析中主要使用三种统计方法：描述性统计、推断性统计和回归分析。


    描述性统计对数据进行汇总，通常关注数据的分布、集中趋势和离散程度。分布可以是正态分布或二项分布，而集中趋势则是描述数据相对于数据中心的情况。集中趋势可以是数据的均值、中位数和众数。离散程度描述数据的分散情况，可以是方差、标准差和四分位距。


    推断性统计检验两个数据集或两个样本之间的关系，通常会对它们之间的统计关系提出假设。假设可以是零假设或备择假设，通过 T 检验、卡方检验和方差分析等检验方法来拒绝零假设。卡方检验更适用于分类变量，T
    检验更适用于连续变量，而方差分析则用于更复杂的应用场景。


    回归分析用于识别两个变量之间的关系。回归可以是线性回归或非线性回归。回归也可以是简单线性回归或多元线性回归，用于识别更多变量之间的关系。


    数据可视化是一种使用图形、图表和仪表盘来传达或展示数据的技术。数据可视化可以帮助我们更轻松地理解数据。


    # 什么是数据科学？


    数据科学是一个多学科领域，融合了统计学、计算机科学、机器学习和领域专业知识，旨在从数据中获取知识和洞察。数据科学通常最终会开发出一个数据产品。数据产品是将公司的数据转化为解决问题的产品。


    例如，数据产品可以是亚马逊和 Lazada 使用的产品推荐系统。这些公司拥有大量基于购物者购买行为的数据。利用这些数据，亚马逊和 Lazada 可以识别购物者的购物模式，并创建一个推荐系统或数据产品，以便在购物者购买产品时推荐其他产品。


    “数据科学”一词已成为一个流行语，现在被用来代表许多领域，如数据分析、数据挖掘、文本挖掘、数据可视化、预测建模等。


    数据科学的历史始于 1997 年 11 月，当时 C. F. Jeff Wu 将统计工作描述为数据收集、分析和决策，并发表了题为“统计学=数据科学？”的演讲。2001
    年，William S. Cleveland 在其文章“数据科学：扩展统计学技术领域的一项行动计划”中，将数据科学定义为一个包含统计学和某些计算领域的学科。


    DJ Patil 声称与 Jeff Hammerbacher 共同创造了“数据科学”一词，并在《哈佛商业评论》上发表了题为“数据科学家：21 世纪最性感的职业”的文章。他指出，许多行业都面临数据科学家短缺的问题，而数据科学在许多公司中至关重要，因为数据分析可以帮助公司做出众多决策。每家公司都需要在战略方向上做出决策。


    统计学在数据科学中非常重要，因为它可以帮助分析师或数据科学家分析和理解数据。描述性统计有助于汇总数据，推断性统计检验两个数据集或样本之间的关系，回归分析则探索多个变量之间的关系。数据可视化可以通过图表、图形和仪表盘来探索数据。回归和机器学习算法可用于预测分析，以训练模型并预测变量。


    线性回归的公式为`y = mx + c`。你使用历史数据来训练公式，以得到`m`和`c`。`Y`是输出变量，`x`是输入变量。机器学习算法和回归或统计学习算法都采用类似的方法来预测变量。


    领域专业知识是指对数据集的了解。如果数据集是商业数据，那么领域专业知识应该是商业；如果是大学数据，那么领域专业知识是教育；如果数据集是医疗数据，那么领域专业知识是医疗。我认为商业是最重要的知识，因为几乎所有公司都利用数据分析来做出重要的战略商业决策。


    加入产品设计和工程知识，我们就进入了物联网和智慧城市领域，因为数据科学和预测分析可以应用于传感器数据。由于数据科学是一个多学科领域，如果你能掌握统计学、机器学习和商业知识，就很难被替代。你也可以与统计学家、机器学习工程师或商业专家合作，共同完成数据科学项目。


    图 1-1 展示了一个数据科学示意图。


    ![../images/471585_1_En_1_Chapter/471585_1_En_1_Fig1_HTML.png](img/471585_1_En_1_Fig1_HTML.png)


    图 1-1


    数据科学是一个交叉领域


    # 什么是数据挖掘？


    数据挖掘与数据科学密切相关。数据挖掘是利用统计学、机器学习以及数据仓库或数据库从数据中识别模式的过程。


    从数据中提取模式并非全新概念，早期方法包括使用贝叶斯定理和回归。技术的发展提高了数据收集的能力。技术的发展也使得统计学习和机器学习算法（如神经网络、模糊逻辑、决策树、遗传算法和支持向量机）能够用于揭示数据中隐藏的模式。数据挖掘结合了统计学和机器学习，通常会产生基于历史数据进行预测的模型。


    跨行业数据挖掘标准流程，也称为`CRISP-DM`，是数据挖掘专家使用的一种流程，也是最流行的数据挖掘模型之一。见图 1-2。


    ![../images/471585_1_En_1_Chapter/471585_1_En_1_Fig2_HTML.png](img/471585_1_En_1_Fig2_HTML.png)


    图 1-2


    跨行业数据挖掘标准流程


    `CRISP-DM`模型创建于 1996 年，涉及 SPSS、Teradata、戴姆勒股份公司、NCR 公司和 OHRA。第一个版本于 1999 年在布鲁塞尔举行的第四届`CRISP-DM`
    SIG 研讨会上展示。许多从业者使用`CRISP-DM`模型，但 IBM 是专注于`CRISP-DM`模型并将其纳入 SPSS Modeler 的公司。


    然而，`CRISP-DM`模型实际上是应用中立的。以下部分将解释其组成部分。


    ## 业务理解


    业务理解是指你了解公司对项目的需求和期望。最好让关键人员参与讨论和文档编写，以制定项目计划。


    ## 数据理解


    数据理解涉及对数据的探索，包括使用统计学和数据可视化。描述性统计可用于汇总数据，推断性统计可用于检验两个数据集和样本，回归可用于探索多个变量之间的关系。数据可视化使用图表、图形和仪表盘来理解数据。这个阶段可以让你了解数据的质量。

    '
- fmt: '### Data Preparation


    Data preparation is one of the most important and time-consuming phases and can
    include selecting a sample subset or variables selection, imputing missing values,
    transforming attributes or variables including log transform and feature scaling
    transformation, and duplicates removal. Variables selection can be done with a
    correlation matrix in a data visualization.


    ### Modeling


    Modeling usually means the development of a prediction model to predict a variable
    in data. The prediction model can be developed using regression algorithms, statistical
    learning algorithms, and machine learning algorithms like neural networks, support
    vector machines, naïve Bayes, multiple linear regressions, decision trees, and
    more. You can also build prescriptive and descriptive models.


    ### Evaluation


    Evaluation is one of the phases where you may use ten-fold crossover validation
    techniques to evaluate the precision and recall of your model. You may improve
    your model accuracy by moving back to the previous phase to improve or prepare
    your data more. You may also select the most accurate model for your requirements.
    You may also evaluate the model using the business success criteria established
    in the beginning stage, which is the business understanding stage.


    ### Deployment


    Deployment is the process of using new insights and knowledge to improve your
    organization or make changes to improve your organization. You may use your prediction
    model to create a data product or to produce a final report based on your models.


    ## What Is Text Mining?


    While data mining is usually used to mine out patterns from numerical data, text
    mining is used to mine out patterns from textual data like Twitter tweets, blog
    postings, and feedback. Text mining, also known as text data mining, is the process
    of deriving high quality semantics and knowledge from textual data.


    Text mining tasks may consist of text classification, text clustering, and entity
    extraction; text analytics may include sentiments analysis, `TF-IDF`, part-of-speech
    tagging, name entity recognizing, and text link analysis.


    Text mining uses the same process as the data mining `CRISP-DM` model, with slight
    differences as shown in Figure [1-3](#471585_1_En_1_Chapter.xhtml#Fig3).


    ![../images/471585_1_En_1_Chapter/471585_1_En_1_Fig3_HTML.png](images/471585_1_En_1_Chapter/471585_1_En_1_Fig3_HTML.png)


    Figure 1-3


    Text mining


    ### Data Acquisition


    Data acquisition is the process of gathering the textual data, combining the textual
    data, and doing some text cleaning. The business understanding stage may also
    be included here.


    ### Text Preprocessing


    Text preprocessing includes the process of porter stemming; stopwords removal;
    conversion of uppercase, lowercase, and propercase; extraction of words or tokens
    based on name entity or regular expressions; and transforming of text to vector
    or numerical forms. Text preprocessing is like the data preparation phase in `CRISP-DM`.


    ### Modeling


    Text analytics or text discovery is the use of part-of-speech tagging or name
    entity recognition to understand each document. It implements sentiment analysis
    to understand the sentiments of the documents and text link analysis to summarize
    all documents in text links. Some books may call text analytics as text mining;
    I think text analytics is similar to data understanding.


    Modeling can also be the process of creating prediction models such as text classification.
    Some books may put the data mining process in this stage to create prediction
    models, descriptive models, and prescriptive models, after converting the text
    to vectors in the text preprocessing stage.


    ### Evaluation/Validation


    Evaluation or validation is the process of evaluating the accuracy of the model
    created. You can view this as the evaluation stage of the `CRISP-DM` model.


    ### Applications


    The applications stage is the deployment stage in the `CRISP-DM` model, where
    presentations or a full report are developed. You may also develop the model into
    a recommendation and classification system as a data product.


    ## Natural Language Processing


    Natural language processing (`NLP`) is an area of machine learning and computer
    science used to assist the computer in processing and understanding natural language.
    `NLP` can include part-of-speech tagging, parsing, porter stemming, name entity
    recognition, optical character recognition, sentiment analysis, speech recognition,
    and more. `NLP` works hand in hand with text analytics and text mining.


    The history of `NLP` started in the 1950s when Alan Turing published an article
    called “Computing Machinery and Intelligence.” Some notable natural language processing
    software was developed in the 1960s, such as `ELIZA`, which provided human-like
    interactions. In the 1970s, software was developed to write ontologies. In the
    1980s, developers introduced Markov models and initiated research on statistical
    models to do `POS` tagging. Recent research has concentrated on supervised and
    semi-supervised algorithms and deep learning algorithms.


    ## Three Types of Analytics


    Selecting the type of analytics can be difficult and challenging; luckily, analytics
    can be categorized into descriptive analytics, predictive analytics, and prescriptive
    analytics. No analytic type is better than the others, but they can be combined
    with each other.


    *   **Descriptive Analytics** : Uses data analytics to know what happened.


    *   **Predictive Analytics** : Uses statistical learning and machine learning
    to predict the future.


    *   **Prescriptive Analytics** : Uses simulation algorithms to know what should
    be done.


    ### Descriptive Analytics


    Descriptive analytics uses statistics to summarize the data using descriptive
    statistics, inferential statistics to test the two data sets and samples, and
    regression analysis to study the relationships between multiple variables.


    ### Predictive Analytics


    Predictive analytics predicts a variable by implementing machine learning and
    statistical learning algorithms. In statistics, regressions can be used to predict
    a variable. For example, `y = mx + c`. You can determine `m` and `c` by training
    a linear regression model using historical data. `Y` is the variable to predict,
    `x` is the input variable. If you put in `x` value, you can predict the `y`.


    ### Prescriptive Analytics


    This is a field that allows a user to find the number of inputs to get a certain
    outcome. In simple form, this kind of analytics is used to provide advice. For
    example, `y = mx + c`. You have the `m` and `c` values. You want a `y` outcome,
    so what value should you put into `x`? To get the `x` value, what kind of things
    does your company need to do or what kind of advice do you need to give to the
    company? If you have multiple linear regressions, there are many `x` variables,
    so you need some simulation or evolutionary search algorithm to get the `x` values.


    ## Big Data


    Big data is data sets that are very big and complex for a computer to process.
    Big data has challenges that may include capturing data, data storage, data analysis,
    and data visualizations. There are three properties or characteristics of big
    data.


    ### Volume


    People are now more connected, so there are many more data sources, and as a consequence,
    the amount of data increased exponentially. The increase of data requires more
    computing power to process and analyze it. Traditional computing power is not
    able to process and analyze this data.


    ### Velocity


    The speed of data is increasing and the speed of data coming in is so fast that
    it is very difficult to process and analyze the data. Tradition computing methods
    can’t process and analyze at the speed of data coming in.'
