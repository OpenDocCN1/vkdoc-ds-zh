  trans: '

    # 协方差


    协方差是衡量两个变量之间变异性的指标。当一个变量的值越大，另一个变量的值也越大时，协方差为正。当一个变量的值越大，另一个变量的值越小时，协方差为负。协方差显示两个变量之间的线性关系，但其大小难以解释。相关性是协方差的归一化版本，因此


    ![$$ \operatorname{cov}\left(X,Y\right)=\sum \limits_{i=1}^N\frac{\left({x}_i-\overline{x}\right)\left({y}_i-\overline{y}\right)}{N}
    $$](img/471585_1_En_6_Chapter_TeX_Equb.png)


    其中 ![$$ \left({x}_i-\overline{x}\right) $$](img/471585_1_En_6_Chapter_TeX_IEq4.png)
    是 x 值减去均值，![$$ \left({y}_i-\overline{y}\right) $$](img/471585_1_En_6_Chapter_TeX_IEq5.png)
    是 y 值减去均值。


    要计算协方差，请创建样本数据：


    ```

    > set.seed(123);

    > var1  var2  var3  data <- data.frame(var1, var2, var3);

    ```


    你可以使用 `cov()` 函数来计算协方差：


    ```

    > cov(data$var1, data$var2);

    [1] -0.04372107

    ```


    相关性的取值范围是 -1 到 1。协方差没有取值范围。相关性更适合衡量两个变量之间关系的强弱。当两个变量具有正协方差时，一个变量增加，另一个变量也随之增加。当两个变量具有负协方差时，一个变量增加，另一个变量则减少。当两个变量相互独立时，协方差为零。-0.04372107
    表示协方差为负，且非常接近零，因此这两个变量之间的关系并不强。


    相关性和协方差通常属于描述性统计的范畴。


    # 假设检验与 P 值


    我之前提到过假设检验。在假设检验中，研究问题是以问题形式提出的假设。研究问题可以是：*某事物之间是否存在显著差异？* 假设可以是：*某事物之间存在显著差异*。研究问题以“是否存在”开头，假设以“存在”开头。假设也可以是零假设
    *H*[0] 和备择假设 *H*[*a*]。你可以如下写出零假设和备择假设：


    *H*[0]: *μ*[1] = *u*[2]


    *H*[*a*]: *μ*[1] ≠ *u*[2]


    其中 *μ*[1] 是一组数据的均值，*μ*[2] 是另一组数据的均值。


    你可以使用统计检验来获取 p 值。对于连续变量或数据，使用 t 检验；对于分类变量或数据，使用卡方检验。对于更复杂的检验，使用方差分析。如果数据不服从正态分布，则使用非参数检验。P
    值帮助你确定统计检验结果的显著性。你在检验中的主张称为零假设，而备择假设意味着你认为零假设不成立。


    -   较小的 p 值（<= 通常为 0.05 的 alpha 值）表明观测数据与零假设不一致的程度足够大，因此可以拒绝零假设。在 95% 的置信区间下，备择假设成立。

    -   较大的 p 值意味着你未能拒绝零假设。


    # T 检验


    T 检验是统计学中较为重要的检验之一。T 检验用于确定两个数据点或样本之间的均值是否相等。零假设意味着两个均值相等，备择假设意味着两个均值不同。


    ## T 检验的类型


    图 6-2 展示了 T 检验的类型。


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Fig2_HTML.jpg](img/471585_1_En_6_Fig2_HTML.jpg)


    图 6-2


    T 检验的类型


    ## T 检验的假设


    以下是假设条件：


    -   样本是从其总体中随机抽取的。

    -   总体服从正态分布。


    ## 第一类错误与第二类错误


    第一类错误是在零假设实际为真时拒绝了它。第二类错误是未能拒绝一个实际上为假的零假设。


    ## 单样本 T 检验


    单样本 t 检验用于检验一个总体的均值是否等于指定的均值。


    单样本 t 检验的公式为


    ![$$ t=\frac{m-\mu }{\raisebox{1ex}{$s$}\!\left/ \!\raisebox{-1ex}{$\sqrt{n}$}\right.}
    $$](img/471585_1_En_6_Chapter_TeX_Equc.png)


    其中 `s` 是样本的标准差，`n` 是样本量，`m` 是样本均值，`u` 是指定的均值。


    自由度的公式为


    ![$$ df=n-1 $$](img/471585_1_En_6_Chapter_TeX_Equd.png)


    你可以使用 t 统计量和自由度，通过 t 分布表来估算 p 值。


    要在 R 中使用单样本 t 检验，可以使用 `t.test()` 函数：


    ```

    > set.seed(123);

    > var1  var2  var3  data  t.test(data$var1, mu=0.6);

    one sample t-test

    data:  data$var1

    t = 16.328, df = 99, p-value < 2.2e-16

    alternative hypothesis: true mean is not equal to 0.6

    95 percent confidence interval:

    1.909283 2.271528

    sample estimates:

    mean of x

    2.090406

    ```


    在单样本 t 检验中，


    *H*[0]: *μ* = *m*


    *H*[*a*]: *μ* ≠ m


    在上述 R 代码中，`m` 为 0.6。p 值为 2.2e-16，小于 alpha 值 0.05。因此，可以拒绝零假设。在 95% 的置信区间下，备择假设
    *μ* ≠ 0.6 成立。

    '
- fmt: "### Two-Sample Independent T-Test\n\nThe two-sample unpaired t-test is when\
    \ you compare two means of two independent samples. The formula of the two-sample\
    \ independent t-test is\n\n![$$ t=\\frac{\\mu_A-{\\mu}_B}{\\sqrt{\\frac{s^2}{n_A}+\\\
    frac{s^2}{n_B}}} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Eque.png)\n\
    \nwhere\n\n*μ*[*A*] is the mean of one sample,\n\n*μ*[*B*] is the mean of the\
    \ second sample,\n\n*n*[*A*] is the size of sample A, and\n\n*n*[*B*] is the size\
    \ of sample B.\n\n`s^2` is the estimator of the common variance of the two samples,\
    \ and the formula is\n\n![$$ {s}^2=\\frac{\\sum {\\left(x-{\\mu}_A\\right)}^2+\\\
    sum {\\left(x-{\\mu}_B\\right)}^2}{n_A-{n}_B-2} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equf.png)\n\
    \nThe degrees of freedom formula is\n\n![$$ df={n}_A-{n}_B-2 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equg.png)\n\
    \nTo use a two-sample unpaired t-test with a variance as equal in R:\n\n```\n\
    > set.seed(123);\n> var1 <- rnorm(100, mean=2, sd=1);\n> var2 <- rnorm(100, mean=3,\
    \ sd=1);\n> var3 <- rnorm(100, mean=4, sd=1);\n> data <- data.frame(var1, var2,\
    \ var3);\n> t.test(data$var1, data$var2, var.equal=TRUE, paired=FALSE);\n\n\t\
    Two Sample t-test\n\ndata:  data$var1 and data$var2\nt = -6.0315, df = 198, p-value\
    \ = 7.843e-09\nalternative hypothesis: true difference in means is not equal to\
    \ 0\n95 percent confidence interval:\n -1.0642808 -0.5398138\nsample estimates:\n\
    mean of x mean of y \n 2.090406  2.892453 \n```\n\nThe two-sample independent\
    \ t-test:\n\n*H*[0]: *μ*[*A*] − *μ*[*B*] = 0\n\n*H*[*a*]: *μ*[*A*] − *μ*[*B*]\
    \ ≠ 0\n\nThe p-value is 7.843e-09, so it is less than 0.05, which is the alpha\
    \ value. Therefore, the null hypothesis may be rejected. The alternate hypothesis,\
    \ *μ*[*A*] − *μ*[*B*] ≠ 0, is true at the 95% confidence interval.\n\nIn the two-sample\
    \ unpaired t-test, when the variance is unequal, you use the Welch t-test. You\
    \ can assume the two data variances are different, or you can calculate the variance\
    \ of each data. The Welch t-test formula is as follows:\n\n![$$ t=\\frac{\\mu_A-{\\\
    mu}_B}{\\sqrt{\\frac{s_A^2}{n_A}+\\frac{s_B^2}{n_B}}} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equh.png)\n\
    \nwhere\n\n*μ*[*A*] is the mean of sample A,\n\n*μ*[*B*] is the mean of sample\
    \ B,\n\n*n*[*A*] is the sample size of A,\n\n*n*[*B*] is the sample size of B,\n\
    \n*s*[*A*] is the standard deviation of A, and\n\n*s*[*B*] is the standard deviation\
    \ of B.\n\nUnlike the normal t-test formula, the Welch t-test formula involves\
    \ the variance of each sample.\n\nThe degrees of freedom formula of the Welch\
    \ t-test formula is as follows:\n\n![$$ df=\\raisebox{1ex}{$\\left(\\frac{s_A^2}{n_A}+\\\
    frac{s_B^2}{n_B^2}\\right)$}\\!\\left/ \\!\\raisebox{-1ex}{$\\left(\\frac{s_A^4}{n_A^2\\\
    left({n}_B-1\\right)}+\\frac{s_B^4}{n_B^2\\left({n}_B-1\\right)}\\right)$}\\right.\
    \ $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equi.png)\n\nTo use\
    \ the two-sample unpaired t-test with a variance as unequal in R:\n\n```\n> set.seed(123);\n\
    > var1 <- rnorm(100, mean=2, sd=1);\n> var2 <- rnorm(100, mean=3, sd=1.5);\n>\
    \ var3 <- rnorm(100, mean=4, sd=1);\n> data <- data.frame(var1, var2, var3);\n\
    > t.test(data$var1, data$var2, var.equal=FALSE, paired=FALSE);\n\n\tWelch Two\
    \ Sample t-test\n\ndata:  data$var1 and data$var2\nt = -6.0315, df = 197.35, p-value\
    \ = 7.88e-09\nalternative hypothesis: true difference in means is not equal to\
    \ 0\n95 percent confidence interval:\n -1.0642862 -0.5398084\nsample estimates:\n\
    mean of x mean of y \n 2.090406  2.892453 \n```\n\nThe two-sample unpaired t-test:\n\
    \n*H*[0]: *μ*[*A*] − *μ*[*B*] = 0\n\n*H*[*a*]: *μ*[*A*] − *μ*[*B*] ≠ 0\n\nThe\
    \ p-value is 7.88e-09, so it less than 0.05, which is the alpha value. Therefore,\
    \ the null hypothesis may be rejected. The alternate hypothesis, *μ*[*A*] − *μ*[*B*]\
    \ ≠ 0, is true at the 95% confidence interval.\n\n### Two-Sample Dependent T-Test\n\
    \nA two-sample paired t-test is used to test the mean of two samples that depend\
    \ on each other. The t-test formula is\n\n![$$ t=\\frac{\\overline{d}}{\\sqrt{s^2/n}}\
    \ $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equj.png)\n\nwhere\n\
    \n![$$ \\overline{d} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq6.png)\
    \ is the mean difference,\n\n`s^2` is the sample variance, and\n\n*n* is the sample\
    \ size.\n\nThe degree of freedom formula is\n\n![$$ df=n-1 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equk.png)\n\
    \nTo use the two-sample paired t-test in R:\n\n```\n> set.seed(123);\n> var1 <-\
    \ rnorm(100, mean=2, sd=1);\n> var2 <- var1 + rnorm(100, mean=1, sd=0.5);\n> var3\
    \ <- rnorm(100, mean=4, sd=1);\n> data <- data.frame(var1, var2, var3);\n> t.test(data$var1,\
    \ data$var2, paired=TRUE);\n\n\tPaired t-test\n\ndata:  data$var1 and data$var2\n\
    t = -5.8876, df = 99, p-value = 5.379e-08\nalternative hypothesis: true difference\
    \ in means is not equal to 0\n95 percent confidence interval:\n -1.0723482 -0.5317464\n\
    sample estimates:\nmean of the differences \n             -0.8020473 \n```\n\n\
    The two-sample paired t-test:\n\n*H*[0]: *μ*[*A*] − *μ*[*B*] = 0\n\n*H*[*a*]:\
    \ *μ*[*A*] − *μ*[*B*] ≠ 0\n\nThe p-value is 5.379e-08, so it is less than 0.05,\
    \ which is the alpha value. Therefore, the null hypothesis may be rejected. The\
    \ alternate hypothesis, *μ*[*A*] − *μ*[*B*] ≠ 0, is true at the 95% confidence\
    \ interval.\n\n## Chi-Square Test\n\nThe chi-square test is used to compare the\
    \ relationships between two categorical variables. The null hypothesis means that\
    \ there is no relationship between the categorical variables.\n\n### Goodness\
    \ of Fit Test\n\nWhen you have only one categorical variable from a population\
    \ and you want to compare whether the sample is consistent with a hypothesized\
    \ distribution, you can use the goodness of fit test.\n\nThe null hypothesis means\
    \ that the data followed a specified distribution, and the alternate hypothesis\
    \ means that data doesn’t follow the specified distribution.\n\nThe goodness of\
    \ fit formula is\n\n![$$ {X}^2=\\sum \\limits_{i=1}^n\\frac{{\\left({O}_i-{E}_i\\\
    right)}^2}{E_i} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equl.png)\n\
    \nwhere *O*[*i*] is the observed frequency of bin *i* and *E*[*i*] is the expected\
    \ frequency of bin *i*.\n\nTo calculated the expected frequency, the formula is\n\
    \n![$$ {E}_i=N\\cdot {p}_i $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equm.png)\n\
    \nwhere N is the total sample size and *p*[*i*] is the hypothesized proportion\
    \ of the observations of bin *i*.\n\nTo use the goodness of fit chi-square test\
    \ in R, you can use the `chisq.test()` function:\n\n```\n> data <- c(50, 30, 20);\n\
    > chisq.test(data);\n\n\tChi-squared test for given probabilities\n\ndata:  data\n\
    X-squared = 66.667, df = 2, p-value = 3.338e-15\n```\n\nThe goodness of fit chi-square\
    \ test:\n\n*   *H*[0]: No significant difference between the observed and expected\
    \ values.\n*   *H*[*a*]: There is a significant difference between the observed\
    \ and expected values.\n\nThe p-value is 3.338e-15, so it is less than 0.05, which\
    \ is the alpha value. Therefore, the null hypothesis may be rejected. The alternate\
    \ hypothesis of a significant difference between the observed and expected values\
    \ is true at the 95% confidence interval."
  raw: '### Two-Sample Independent T-Test


    The two-sample unpaired t-test is when you compare two means of two independent
    samples. The formula of the two-sample independent t-test is


    ![$$ t=\frac{\mu_A-{\mu}_B}{\sqrt{\frac{s^2}{n_A}+\frac{s^2}{n_B}}} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Eque.png)


    where


    *μ*[*A*] is the mean of one sample,


    *μ*[*B*] is the mean of the second sample,


    *n*[*A*] is the size of sample A, and


    *n*[*B*] is the size of sample B.


    tk is the estimator of the common variance of the two samples, and the formula
    is


    ![$$ {s}^2=\frac{\sum {\left(x-{\mu}_A\right)}^2+\sum {\left(x-{\mu}_B\right)}^2}{n_A-{n}_B-2}
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equf.png)


    The degrees of freedom formula is


    ![$$ df={n}_A-{n}_B-2 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equg.png)


    To use a two-sample unpaired t-test with a variance as equal in R:


    ```

    > set.seed(123);

    > var1  var2  var3  data  t.test(data$var1, data$var2, var.equal=TRUE, paired=FALSE);

    two-sample t-test

    data:  data$var1 and data$var2

    t = -6.0315, df = 198, p-value = 7.843e-09

    alternative hypothesis: true difference in means is not equal to 0

    95 percent confidence interval:

    -1.0642808 -0.5398138

    sample estimates:

    mean of x mean of y

    2.090406  2.892453

    ```


    The two-sample independent t-test:


    *H*[0]: *μ*[*A*] − *μ*[*B*] = 0


    *H*[*a*]: *μ*[*A*] − *μ*[*B*] ≠ 0


    The p-value is 7.843e-09, so it is less than 0.05, which is the alpha value .
    Therefore, the null hypothesis may be rejected. The alternate hypothesis, *μ*[*A*] − *μ*[*B*] ≠ 0,
    is true at the 95% confidence interval.


    In the two-sample unpaired t-test, when the variance is unequal, you use the Welch
    t-test. You can assume the two data variances are different, or you can calculate
    the variance of each data. The Welch t-test formula is as follows:


    ![$$ t=\frac{\mu_A-{\mu}_B}{\sqrt{\frac{s_A^2}{n_A}+\frac{s_B^2}{n_B}}} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equh.png)


    where


    *μ*[*A*] is the mean of sample A,


    *μ*[*B*] is the mean of sample B,


    *n*[*A*] is the sample size of A,


    *n*[*B*] is the sample size of B,


    *s*[*A*] is the standard deviation of A, and


    *s*[*B*] is the standard deviation of B.


    Unlike the normal t-test formula, the Welch t-test formula involves the variance
    of each sample.


    The degrees of freedom formula of the Welch t-test formula is as follows:


    ![$$ df=\raisebox{1ex}{$\left(\frac{s_A^2}{n_A}+\frac{s_B^2}{n_B^2}\right)$}\!\left/
    \!\raisebox{-1ex}{$\left(\frac{s_A^4}{n_A^2\left({n}_B-1\right)}+\frac{s_B^4}{n_B^2\left({n}_B-1\right)}\right)$}\right.
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equi.png)


    To use the two-sample unpaired t-test with a variance as unequal in R:


    ```

    > set.seed(123);

    > var1  var2  var3  data  t.test(data$var1, data$var2, var.equal=FALSE, paired=FALSE);

    Welch two-sample t-test

    data:  data$var1 and data$var2

    t = -6.0315, df = 197.35, p-value = 7.88e-09

    alternative hypothesis: true difference in means is not equal to 0

    95 percent confidence interval:

    -1.0642862 -0.5398084

    sample estimates:

    mean of x mean of y

    2.090406  2.892453

    ```


    The two-sample unpaired t-test:


    *H*[0]: *μ*[*A*] − *μ*[*B*] = 0


    *H*[*a*]: *μ*[*A*] − *μ*[*B*] ≠ 0


    The p-value is 7.88e-09, so it less than 0.05, which is the alpha value . Therefore,
    the null hypothesis may be rejected. The alternate hypothesis, *μ*[*A*] − *μ*[*B*] ≠ 0,
    is true at the 95% confidence interval.


    ### Two-Sample Dependent T-Test


    A two-sample paired t-test is used to test the mean of two samples that depend
    on each other. The t-test formula is


    ![$$ t=\frac{\overline{d}}{\sqrt{s^2/n}} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equj.png)


    where


    ![$$ \overline{d} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq6.png)
    is the mean difference,


    *s* is the sample variance, and


    *n* is the sample size.


    The degree of freedom formula is


    ![$$ df=n-1 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equk.png)


    To use the two-sample paired t-test in R:


    ```

    > set.seed(123);

    > var1  var2  var3  data  t.test(data$var1, data$var2, paired=TRUE);

    Paired t-test

    data:  data$var1 and data$var2

    t = -5.8876, df = 99, p-value = 5.379e-08

    alternative hypothesis: true difference in means is not equal to 0

    95 percent confidence interval:

    -1.0723482 -0.5317464

    sample estimates:

    mean of the differences

    -0.8020473

    ```


    The two-sample paired t-test:


    *H*[0]: *μ*[*A*] − *μ*[*B*] = 0


    *H*[*a*]: *μ*[*A*] − *μ*[*B*] ≠ 0


    The p-value is 5.379e-08, so it is less than 0.05, which is the alpha value .
    Therefore, the null hypothesis may be rejected. The alternate hypothesis, *μ*[*A*] − *μ*[*B*] ≠ 0,
    is true at the 95% confidence interval.


    ## Chi-Square Test


    The chi-square test is used to compare the relationships between two categorical
    variables. The null hypothesis means that there is no relationship between the
    categorical variables.


    ### Goodness of Fit Test


    When you have only one categorical variable from a population and you want to
    compare whether the sample is consistent with a hypothesized distribution, you
    can use the goodness of fit test.


    The null hypothesis means that the data followed a specified distribution, and
    the alternate hypothesis means that data doesn’t follow the specified distribution.


    The goodness of fit formula is


    ![$$ {X}^2=\sum \limits_{i=1}^n\frac{{\left({O}_i-{E}_i\right)}^2}{E_i} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equl.png)


    where *O*[*i*] is the observed frequency of bin *i* and *E*[*i*] is the expected
    frequency of bin *i*.


    To calculated the expected frequency, the formula is


    ![$$ {E}_i=N\cdot {p}_i $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equm.png)


    where N is the total sample size and *p*[*i*] is the hypothesized proportion of
    the observations of bin *i*.


    To use the goodness of fit chi-square test in R, you can use the `chisq.test()`
    function:


    ```

    > data  chisq.test(data);

    Chi-squared test for given probabilities

    data:  data

    X-squared = 66.667, df = 2, p-value = 3.338e-15

    ```


    The goodness of fit chi-square test:


    *   *H*[0]: No significant difference between the observed and expected values.


    *   *H*[*a*]: There is a significant difference between the observed and expected
    values.


    The p-value is 3.338e-15, so it is less than 0.05, which is the alpha value. Therefore,
    the null hypothesis may be rejected. The alternate hypothesis of a significant
    difference between the observed and expected values is true at the 95% confidence
    interval.'
  trans: "\n### 双样本独立 t 检验\n\n双样本非配对 t 检验用于比较两个独立样本的均值。双样本独立 t 检验的公式如下：\n\n![$$ t=\\\
    frac{\\mu_A-{\\mu}_B}{\\sqrt{\\frac{s²}{n_A}+\\frac{s²}{n_B}}} $$](img/471585_1_En_6_Chapter_TeX_Eque.png)\n\
    \n其中\n\n*μ*[*A*] 是一个样本的均值，\n\n*μ*[*B*] 是第二个样本的均值，\n\n*n*[*A*] 是样本 A 的大小，\n\n*n*[*B*]\
    \ 是样本 B 的大小。\n\n`s²` 是两个样本共同方差的估计量，其公式为：\n\n![$$ {s}²=\\frac{\\sum {\\left(x-{\\\
    mu}_A\\right)}²+\\sum {\\left(x-{\\mu}_B\\right)}²}{n_A-{n}_B-2} $$](img/471585_1_En_6_Chapter_TeX_Equf.png)\n\
    \n自由度公式为：\n\n![$$ df={n}_A-{n}_B-2 $$](img/471585_1_En_6_Chapter_TeX_Equg.png)\n\
    \n在 R 中对方差相等的两组样本使用双样本非配对 t 检验：\n\n```\n> set.seed(123);\n> var1 <- rnorm(100,\
    \ mean=2, sd=1);\n> var2 <- rnorm(100, mean=3, sd=1);\n> var3 <- rnorm(100, mean=4,\
    \ sd=1);\n> data <- data.frame(var1, var2, var3);\n> t.test(data$var1, data$var2,\
    \ var.equal=TRUE, paired=FALSE);\n\n\tTwo Sample t-test\n\ndata:  data$var1 and\
    \ data$var2\nt = -6.0315, df = 198, p-value = 7.843e-09\nalternative hypothesis:\
    \ true difference in means is not equal to 0\n95 percent confidence interval:\n\
    \ -1.0642808 -0.5398138\nsample estimates:\nmean of x mean of y \n 2.090406  2.892453\
    \ \n```\n\n双样本独立 t 检验：\n\n*H*[0]: *μ*[*A*] − *μ*[*B*] = 0\n\n*H*[*a*]: *μ*[*A*]\
    \ − *μ*[*B*] ≠ 0\n\np 值为 7.843e-09，小于 0.05（即 alpha 值）。因此，可以拒绝零假设。备择假设 *μ*[*A*]\
    \ − *μ*[*B*] ≠ 0 在 95%置信区间下成立。\n\n在双样本非配对 t 检验中，当方差不相等时，应使用韦尔奇 t 检验。你可以假设两组数据的方差不同，或者分别计算每组数据的方差。韦尔奇\
    \ t 检验的公式如下：\n\n![$$ t=\\frac{\\mu_A-{\\mu}_B}{\\sqrt{\\frac{s_A²}{n_A}+\\frac{s_B²}{n_B}}}\
    \ $$](img/471585_1_En_6_Chapter_TeX_Equh.png)\n\n其中\n\n*μ*[*A*] 是样本 A 的均值，\n\n\
    *μ*[*B*] 是样本 B 的均值，\n\n*n*[*A*] 是样本 A 的大小，\n\n*n*[*B*] 是样本 B 的大小，\n\n*s*[*A*]\
    \ 是样本 A 的标准差，\n\n*s*[*B*] 是样本 B 的标准差。\n\n与普通 t 检验公式不同，韦尔奇 t 检验公式涉及每个样本的方差。\n\n\
    韦尔奇 t 检验的自由度公式如下：\n\n![$$ df=\\raisebox{1ex}{$\\left(\\frac{s_A²}{n_A}+\\frac{s_B²}{n_B²}\\\
    right)$}\\!\\left/ \\!\\raisebox{-1ex}{$\\left(\\frac{s_A⁴}{n_A²\\left({n}_B-1\\\
    right)}+\\frac{s_B⁴}{n_B²\\left({n}_B-1\\right)}\\right)$}\\right. $$](img/471585_1_En_6_Chapter_TeX_Equi.png)\n\
    \n在 R 中对方差不等的两组样本使用双样本非配对 t 检验：\n\n```\n> set.seed(123);\n> var1 <- rnorm(100,\
    \ mean=2, sd=1);\n> var2 <- rnorm(100, mean=3, sd=1.5);\n> var3 <- rnorm(100,\
    \ mean=4, sd=1);\n> data <- data.frame(var1, var2, var3);\n> t.test(data$var1,\
    \ data$var2, var.equal=FALSE, paired=FALSE);\n\n\tWelch Two Sample t-test\n\n\
    data:  data$var1 and data$var2\nt = -6.0315, df = 197.35, p-value = 7.88e-09\n\
    alternative hypothesis: true difference in means is not equal to 0\n95 percent\
    \ confidence interval:\n -1.0642862 -0.5398084\nsample estimates:\nmean of x mean\
    \ of y \n 2.090406  2.892453 \n```\n\n双样本非配对 t 检验：\n\n*H*[0]: *μ*[*A*] − *μ*[*B*]\
    \ = 0\n\n*H*[*a*]: *μ*[*A*] − *μ*[*B*] ≠ 0\n\np 值为 7.88e-09，小于 0.05（即 alpha 值）。因此，可以拒绝零假设。备择假设\
    \ *μ*[*A*] − *μ*[*B*] ≠ 0 在 95%置信区间下成立。\n\n### 双样本配对 t 检验\n\n双样本配对 t 检验用于检验两个相互依赖样本的均值。t\
    \ 检验公式为：\n\n![$$ t=\\frac{\\overline{d}}{\\sqrt{s²/n}} $$](img/471585_1_En_6_Chapter_TeX_Equj.png)\n\
    \n其中\n\n![$$ \\overline{d} $$](img/471585_1_En_6_Chapter_TeX_IEq6.png) 是均值差，\n\
    \n`s²` 是样本方差，\n\n*n* 是样本大小。\n\n自由度公式为：\n\n![$$ df=n-1 $$](img/471585_1_En_6_Chapter_TeX_Equk.png)\n\
    \n在 R 中使用双样本配对 t 检验：\n\n```\n> set.seed(123);\n> var1 <- rnorm(100, mean=2, sd=1);\n\
    > var2 <- var1 + rnorm(100, mean=1, sd=0.5);\n> var3 <- rnorm(100, mean=4, sd=1);\n\
    > data <- data.frame(var1, var2, var3);\n> t.test(data$var1, data$var2, paired=TRUE);\n\
    \n\tPaired t-test\n\ndata:  data$var1 and data$var2\nt = -5.8876, df = 99, p-value\
    \ = 5.379e-08\nalternative hypothesis: true difference in means is not equal to\
    \ 0\n95 percent confidence interval:\n -1.0723482 -0.5317464\nsample estimates:\n\
    mean of the differences \n             -0.8020473 \n```\n\n双样本配对 t 检验：\n\n*H*[0]:\
    \ *μ*[*A*] − *μ*[*B*] = 0\n\n*H*[*a*]: *μ*[*A*] − *μ*[*B*] ≠ 0\n\np 值为 5.379e-08，小于\
    \ 0.05（即 alpha 值）。因此，可以拒绝零假设。备择假设 *μ*[*A*] − *μ*[*B*] ≠ 0 在 95%置信区间下成立。\n\n##\
    \ 卡方检验\n\n卡方检验用于比较两个分类变量之间的关系。零假设意味着分类变量之间没有关系。\n\n### 拟合优度检验\n\n当你从总体中仅有一个分类变量，并希望比较样本是否与假设分布一致时，可以使用拟合优度检验。\n\
    \n零假设意味着数据遵循指定的分布，备择假设意味着数据不遵循指定的分布。\n\n拟合优度公式为：\n\n![$$ {X}²=\\sum \\limits_{i=1}^n\\\
    frac{{\\left({O}_i-{E}_i\\right)}²}{E_i} $$](img/471585_1_En_6_Chapter_TeX_Equl.png)\n\
    \n其中 *O*[*i*] 是第 *i* 组的观测频数，*E*[*i*] 是第 *i* 组的期望频数。\n\n计算期望频数的公式为：\n\n![$$ {E}_i=N\\\
    cdot {p}_i $$](img/471585_1_En_6_Chapter_TeX_Equm.png)\n\n其中 N 是总样本量，*p*[*i*]\
    \ 是第 *i* 组观测值的假设比例。\n\n在 R 中使用拟合优度卡方检验，可以使用 `chisq.test()` 函数：\n\n```\n> data\
    \ <- c(50, 30, 20);\n> chisq.test(data);\n\n\tChi-squared test for given probabilities\n\
    \ndata:  data\nX-squared = 66.667, df = 2, p-value = 3.338e-15\n```\n\n拟合优度卡方检验：\n\
    \n*   *H*[0]: 观测值与期望值之间无显著差异。\n*   *H*[*a*]: 观测值与期望值之间存在显著差异。\n\np 值为 3.338e-15，小于\
    \ 0.05（即 alpha 值）。因此，可以拒绝零假设。观测值与期望值之间存在显著差异的备择假设在 95%置信区间下成立。\n"
- fmt: '### Contingency Test


    If you have two categorical variables and you want to compare whether there is
    a relationship between two variables, you can use the contingency test.


    The null hypothesis means that the two categorical variables have no relationship.
    The alternate hypothesis means that the two categorical variables have a relationship.


    To calculate the expected value, use


    ![$$ {E}_{ij}=\frac{R_i{C}_j}{N} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equn.png)


    where `R` is the row, `C` is the column, `N` is the total, `ith` is the row, and
    `jth` is the column.


    The formula for `X`² statistics is


    ![$$ {X}^2=\sum \limits_{i=1}^r\sum \limits_{j=1}^c\frac{{\left({O}_{ij}-{E}_{ij}\right)}^2}{E_{ij}}
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equo.png)


    To use a contingency test in R, create your data first:


    ```

    > var1  var2  data  data;

    var1       var2

    1    Male  chocolate

    2  Female strawberry

    3    Male strawberry

    4  Female strawberry

    5    Male  chocolate

    6  Female  chocolate

    7    Male  chocolate

    8  Female strawberry

    9    Male strawberry

    10 Female strawberry

    ```


    You can then create a table or frequency table for the variables to test:


    ```

    > data.table  data.table;

    chocolate strawberry

    Female         1          4

    Male           3          2

    ```


    You can then use the `chisq.test()` function for the contingency test:


    ```

    > chisq.test(data.table);

    Pearson''s chi-squared test with Yates'' continuity correction

    data:  data.table

    X-squared = 0.41667, df = 1, p-value = 0.5186

    Warning message:

    In chisq.test(data.table) : Chi-squared approximation may be incorrect

    ```


    The chi-square test:


    *   `H`[0]: The two variables are independent.

    *   `H`[`a`]: The two variables are not independent.


    The p-value is 0.5186, so it is more than 0.05, which is the alpha value. Therefore,
    the null hypothesis fails to be rejected. The two variables are independent is
    true at the 95% confidence interval.


    ## ANOVA


    ANOVA is the process of testing the means of two or more groups. ANOVA also checks
    the impact of factors by comparing the means of different samples. In a t-test,
    you test the means of two samples; in a chi-square test, you test categorical
    attributes or variables; in ANOVA, you test more samples.


    ### Grand Mean


    In ANOVA, you use two kinds of means, sample means and a grand mean. A grand mean
    is the mean of all of the samples’ means.


    ### Hypothesis


    In ANOVA, a null hypothesis means that the sample means are equal or do not have
    significant differences. The alternate hypothesis is when the sample means are
    not equal.


    ![$$ {H}_0:{\mu}_1={\mu}_2=\dots ={\mu}_L\kern4.5em Null\ hypothesis $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equp.png)


    ![$$ {H}_a:{\mu}_1\ne {\mu}_m\kern5.75em Alternate\ hypothesis $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equq.png)


    ### Assumptions


    You assume that the variables are sampled, independent, and selected or sampled
    from a population that is normally distributed with unknown but equal variances.


    ### Between Group Variability


    The distribution of two samples, when they overlap, their means are not significantly
    different. Hence, the difference between their individual mean and the grand mean
    is not significantly different. The group and level are different groups in the
    same independent variable. See Figure [6-3](#471585_1_En_6_Chapter.xhtml#Fig3).


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Fig3_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Means are not Significantly Different


    For the two samples shown in Figure [6-4](#471585_1_En_6_Chapter.xhtml#Fig4),
    their means are significantly different from each other. The difference between
    the individual means and the grand mean is significantly different.


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Fig4_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Means are Significantly Different


    This variability is called the between-group variability, which refers to the
    variations between the distributions of the groups or levels. Figure [6-5](#471585_1_En_6_Chapter.xhtml#Fig5)
    depicts the discrimination between the different groups.


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Fig5_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    Variations between the distributions of groups of levels


    To calculate the sum of the square of between the group variability, use


    ![$$ S{S}_{between}={n}_1{\left({\overline{x}}_1-{\overline{x}}_G\right)}^2+{n}_2{\left({\overline{x}}_2-{\overline{x}}_G\right)}^2+{n}_3{\left({\overline{x}}_3-{\overline{x}}_G\right)}^2+\dots
    +{n}_k{\left({\overline{x}}_k-{\overline{x}}_k\right)}^2 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equr.png)


    where


    ![$$ {\overline{x}}_G $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq7.png)
    is the grand mean,


    ![$$ {\overline{x}}_1 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq8.png)…![$$
    {\overline{x}}_k $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq9.png)
    is the mean of each sample, and


    `n`[1]…`n`[`k`]… are the sample sizes.


    To calculate the sum of each squared deviation, or mean square, use


    ![$$ M{S}_{between}=\frac{n_1{\left({\overline{x}}_1-{\overline{x}}_G\right)}^2+{n}_2{\left({\overline{x}}_2-{\overline{x}}_G\right)}^2+{n}_3{\left({\overline{x}}_3-{\overline{x}}_G\right)}^2+\dots
    +{n}_k{\left({\overline{x}}_k-{\overline{x}}_k\right)}^2}{k-1} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equs.png)


    You use the SS to divide by the degree of freedom, where the degree of freedom
    is the number of sample means (`k`) minus one.'
