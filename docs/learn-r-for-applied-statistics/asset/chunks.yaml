    To read an SPSS file, you need to use the `foreign` package. You can install the
    `foreign` package using the `install.packages()` function:


    ```

    > install.packages("foreign");

    Installing package into ''C:/Users/gohmi/Documents/R/win-library/3.5''

    (as ''lib'' is unspecified)

    trying URL ''https://cran.rstudio.com/bin/windows/contrib/3.5/foreign_0.8-71.zip''

    Content type ''application/zip'' length 324526 bytes (316 KB)

    downloaded 316 KB

    package ''foreign'' successfully unpacked and MD5 sums checked

    The downloaded binary packages are in

    C:\Users\gohmi\AppData\Local\Temp\RtmpET26Hv\downloaded_packages

    ```


    To use the `foreign` package, use the `require()` function:


    ```

    > require(foreign);

    Loading required package: foreign

    ```


    To read the SPSS file to a data frame type, you use the `read.spss()` function:


    ```

    > data <- read.spss(file="data.spss", to.data.frame=TRUE);

    ```


    `file` is the file path or location to read the SPSS file. `to.data.frame` is
    a logical value to state whether to read the SPSS file to a data frame type.


    You can use the `help()` function to get the documentation of the `read.spss()`
    function, as shown in Figure [4-7](#471585_1_En_4_Chapter.xhtml#Fig7).


    ![../images/471585_1_En_4_Chapter/471585_1_En_4_Fig7_HTML.jpg](images/471585_1_En_4_Chapter/471585_1_En_4_Fig7_HTML.jpg)


    Figure 4-7


    Documentation of `read.spss()`


    ### Writing an SPSS File


    You can write the SPSS file using the `write.foreign()` function:


    ```

    > write.foreign(data, "mydata.txt", "mydata.sps", package="SPSS");

    ```


    `data` is the variable to export to the SPSS data file, `mydata.txt` is the data
    in comma-delimited format, `mydata.sps` is the basic syntax file to read the data
    file into SPSS, and `package` determines the outputing or exporting to the SPSS
    format.


    ### Reading a JSON File


    JSON, or JavaScript Object Notation, is a very popular data interchange format
    that is easy for humans to write or read. A JSON file can be read by using the
    `rjson` package. To install the `rjson` package, you use the `install.packages()`
    function:


    ```

    > install.packages("rjson");

    Installing package into ''C:/Users/gohmi/Documents/R/win-library/3.5''

    (as ''lib'' is unspecified)

    trying URL ''https://cran.rstudio.com/bin/windows/contrib/3.5/rjson_0.2.20.zip''

    Content type ''application/zip'' length 577826 bytes (564 KB)

    downloaded 564 KB

    package ''rjson'' successfully unpacked and MD5 sums checked

    The downloaded binary packages are in

    C:\Users\gohmi\AppData\Local\Temp\RtmpET26Hv\downloaded_packages

    ```


    You can use the `require()` function to load the `rjson` package:


    ```

    > require(rjson);

    Loading required package: rjson

    ```


    You can read JSON file using the `fromJSON()` function:


    ```

    > data <- fromJSON(file="data.json");

    ```


    To convert the data to a data frame type, you can use this code:


    ```

    > data2 <- as.data.frame(data);

    ```


    ## Basic Data Processing


    After importing the data, you may need to do some simple data processing like
    selecting data, sorting data, filtering data, getting unique values, and removing
    missing values.


    ### Selecting Data


