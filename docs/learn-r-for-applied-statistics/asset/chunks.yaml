- fmt: '### Variety


    More sources means more data in different formats and types, such as images, videos,
    voice, speech, textual data, and numerical data, both unstructured and structured.
    Various data formats require different methods to extract the data from them.
    This means that the data is difficult to process and analyze, and traditional
    computing methods can’t process such data.


    Data grows very quickly, due to IoT devices like mobile devices, wireless sensor
    networks, and RFID readers. Based on an IDC report, global data will increase
    from 4.4 zettabytes to 44 zettabytes from 2013 to 2020.


    Relational databases and desktop statistics and data science software have challenges
    to process and analyze big data. Hence, big data requires parallel and distributed
    systems like `Hadoop` and `Apache Spark` to process and analyze the data.


    Two popular systems or frameworks for big data are `Apache Spark` and `Hadoop`.
    `Hadoop` is a distributed data systems to store big data across different cluster
    and computers. One cluster can have many computers. The `Hadoop` storage system
    is known as the `Hadoop Distributed System (HDFS)`. `Hadoop` has many ecosystems,
    such as `mahout` to do machine learning processing. `Hadoop` also has processing
    systems, such as `MapReduce`.


    `Apache Spark` is a data processing system to process data on distributed data.
    `Apache Spark` does not have a file storage system, so it needs to integrate into
    a system like `Hadoop`. `Apache Spark` is a lot faster and completes full data
    analytics, data processing, and data prediction.


    `R`, `Python`, and `Java` can interface with these `Hadoop` and `Apache Spark`
    systems.


    ## Why R?


    When learning data science, many people struggle with choosing which programming
    languages and data sciences to learn. There are many programming languages available
    for data science, like `R`, `Python`, `SAS`, `Java`, and more. There are many
    data science software packages to learn, such as `SPSS Statistics`, `SPSS Modeler`,
    `SAS Enterprise Miner`, `Tableau`, `RapidMiner`, `Weka`, `GATE`, and more.


    I recommend learning `R` for statistics because it was developed for statistics
    in the first place. `Python` is a real programming language, so you can develop
    real applications and software via `Python` programming. Hence, if you want to
    develop a data product or data application, `Python` can be a better choice. `R`
    programming is very strong in statistics, so it is ideal for data exploration
    or data understanding using descriptive statistics, inferential statistics, regression
    analysis, and data visualizations. `R` is also ideal for modeling because you
    can use statistical learning like regressions for predictive analytics. `R` also
    has some packages for data mining, text mining, and machine learning like `Rattle`,
    `CARET`, and `TM`. `R` programming can also interface with big data systems like
    `Apache Spark` using `Sparklyr`. `SAS` programming is commercial, and `Java` has
    direct interfaces with `GATE`, `Stanford NLP`, and `Weka`. `SPSS Statistics`,
    `SPSS Modeler`, `SAS Enterprise Miner`, and `Tableau` are data science software
    packages with GUIs and are commercial. `RapidMiner`, `Weka`, and `GATE` are open
    source software packages for data science.


    `R` is also heavily used in many of the companies that hire data scientists. Google
    and Facebook have data scientists who use `R`. `R` is also used in companies like
    Bank of America, Ford, Uber, Trulia, and more.


    `R` is also heavily used in academia, and `R` is very popular among academic researchers,
    who can use `R` graphics for publications.


    Scripts written in `R` can be used on different operating systems, including Linux,
    Apple, and Windows, as long as the `R` interpreter is installed. This is not possible
    with languages like `C#`.


    ## Conclusion


    In this chapter, you looked into `R` programming. You now know that `R` programming
    is a programming language for statistical computing and is supported by the `R
    Foundation for Statistical Computing`. The `R` language is used by researchers
    for statistical analysis, and `R` popularity has increased every year.


    I also discussed high-level programming languages and low-level programming languages.
    HLLs are designed to be used by humans and are closer to the human language. LLLs,
    on the other hand, are a lot closer to the machine and computer languages. LLLs
    can be executed directly on a computer without the need to convert between languages,
    so they can be faster.


    I also discussed statistics. Statistics is a collection of mathematics to deal
    with the organization, analysis, and interpretation of data. There are three main
    statistical methods used in data analysis: descriptive statistics, inferential
    statistics, and regressions analysis.


    I also discussed data science. Data science is a multidisciplinary field that
    includes statistics, computer science, machine learning, and domain expertise
    to get knowledge and insights from data. Data science usually ends up with the
    development of a data product. A data product is the changing of the data of a
    company into a product to solve a problem.


    Data mining is closely related to data science. Data mining is the process of
    identifying patterns from data using statistics, machine learning, and data warehouses
    or databases. Data mining consists of many models; `CRISP-DM` is the most popular
    model for data mining. In `CRISP-DM`, data mining comprises business understanding,
    data understanding, data preparation, modeling, evaluation, and deployment.


    While data mining is usually used to mine out patterns from numerical data, text
    mining is used to mine out patterns from textual data like Twitter tweets, blog
    postings, and feedback. Text mining, also known as text data mining, is the process
    of deriving high quality semantics and knowledge from textual data. Text mining
    consists of text classification, text clustering, and entity extraction; text
    analytics may include sentiments analysis, `TF-IDF`, part-of-speech tagging, name
    entity recognizing, and text link analysis. Text mining uses the same process
    as the data mining `CRISP-DM` model, with slight differences.


    Natural language processing is an area of machine learning and computer science
    used to assist the computer in processing and understanding natural language.
    `NLP` can include part-of-speech tagging, parsing, porter stemming, name entity
    recognition, optical character recognition, sentiment analysis, speech recognition,
    and more. `NLP` works hand in hand with text analytics and text mining.


    Selecting the types of analytics can be difficult and challenging. Luckily, analytics
    can be categorized into descriptive analytics, predictive analytics, and prescriptive
    analytics. No one type of analytics is better than the others, but they can be
    combined with each other.


    Big data is data sets that are very big and complex for a computer to process.
    Big data has challenges that may include capturing data, data storage, data analysis,
    and data visualizations. There are three properties of big data: volume, velocity,
    and variety. There are two popular systems or frameworks for big data: `Hadoop`
    and `Apache Spark`.


    When learning data science, there are many programming languages, like `R`, `Python`,
    `SAS`, and `Java`. There are many data science software packages, such as `SPSS
    Statistics`, `SPSS Modeler`, `SAS Enterprise Miner`, `RapidMiner`, and `Weka`.
    `R` was developed with statistics in mind, so it is best for the statistics portion
    of data mining, such as data understanding, modeling with statistical learning
    algorithms, and data visualizations. `R` has packages for machine learning, natural
    language processing, and text mining, and `Apache Spark` for big data. `Python`
    is a full programming language, and it is best for developing data product or
    software. The `SAS` programming language is commercial and not free. `R` has become
    very popular, according to the `TIOBE` ranking, and many companies like Facebook
    and Google have data scientists who use `R`. `R` is also very popular with academic
    researchers. `R` scripts or code can be run on different operating systems long
    as the `R` interpreter is installed.'
