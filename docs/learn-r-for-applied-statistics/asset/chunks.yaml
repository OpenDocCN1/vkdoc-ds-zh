    \mathrm{of}\kern0.33em \mathrm{Y}\kern0.33em \mathrm{and}\kern0.33em \widehat{y}\kern0.5em
    \mathrm{i}\mathrm{s}\ \mathrm{the}\ \mathrm{fitted}\ \mathrm{value}\ \mathrm{for}\kern0.33em
