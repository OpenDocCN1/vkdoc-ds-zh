    ## What Is the Grammar of Graphics?


    `ggplot2` focuses on the grammar of graphics, which is the building blocks of
    the chart, such as


    * Data

    * Aesthetic mapping

    * Geometric objects

    * Statistical transformation

    * Scales

    * Coordinate systems

    * Position adjustments

    * Faceting


    In this book, you are going to look into some of them. It is beyond this book
    to cover everything in `ggplot2`.


    ## The Setup for ggplot2


    To use `ggplot2`, you must call the library using the `library()` or `require()`
    functions. You also need to let `ggplot` know which data set to use, and you can
    use the `ggplot()` function:


    ```

    > library(ggplot2);

    > set.seed(12);

    > var1  var2  var3  data  ggplot(data);

    ```


    `ggplot()` can only take a data frame variable.


    ## Aesthetic Mapping in ggplot2


    In `ggplot2`, aesthetics are the things we can see, such as


    * Position

    * Color

    * Fill

    * Shape

    * Line type

    * Size


    You can use aesthetics in `ggplot2` via the `aes()` function:


    ```

    > ggplot(data, aes(x=var1, y=var2));

    ```


    ## Geometry in ggplot2


    Geometric objects are the plots or graphs you want to put in the chart. You can
    use `geom_point()` to create a scatterplot, `geom_line()` to create a line plot,
    and `geom_boxplot()` to create a boxplot in the chart.


    You can see the available geometric objects (also shown in Figure [5-19](#471585_1_En_5_Chapter.xhtml#Fig19))
    using


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig19_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig19_HTML.jpg)


    Figure 5-19


    Available Geometric Objects


    ```

    > help.search("geom_", package="ggplot2");

    ```


    In `ggplot2`, `geom` is also the layers of the chart. You can add in one `geom`
    object after another, just like adding one layer after another layer.


    You can add in a scatter plot (Figure [5-20](#471585_1_En_5_Chapter.xhtml#Fig20))
    using the `geom_point()` function:


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig20_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig20_HTML.jpg)


    Figure 5-20


    Scatterplot


    ```

    > ggplot(data, aes(x=var1, y=var2)) + geom_point(aes(color="red"));

    ```


    You can add in a smoother that includes a line and a ribbon to the scatter plot
    (Figure [5-21](#471585_1_En_5_Chapter.xhtml#Fig21)) using another layer:


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig21_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig21_HTML.jpg)


    Figure 5-21


    Scatterplot with Smoother


    ```

    > ggplot(data, aes(x=var1, y=var2)) + geom_point(aes(color="red")) + geom_smooth();

    `geom_smooth()` using method = ''loess'' and formula ''y ~ x''

    ```


    ## Labels in ggplot2


    You have plotted the graphs in the charts, so now let’s add in the main title
    and x- and y-axis titles. You can do this using the `labs()` layer to specify
    the labels.


    To add in the x-axis title, y-axis title, and the main title into Figure [5-22](#471585_1_En_5_Chapter.xhtml#Fig22),
    you can use the `labs()` function:


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig22_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig22_HTML.jpg)


    Figure 5-22


    Scatterplot with Smoother and labels


    ```

    > ggplot(data, aes(x=var1, y=var2)) + geom_point(aes(color="red")) + geom_smooth()
    + labs(title="Scatter", x = "Xaxis", y = "Y-axis", color="Color");

    `geom_smooth()` using method = ''loess'' and formula ''y ~ x''

    ```


    ## Themes in ggplot2


    If you want to change the size and style of the labels and legends, the `theme()`
    function can help. The `theme()` function in `ggplot` handles elements such as


    * Axis labels

    * Plot background

    * Facet background

    * Legend appearance


    There are some built-in themes such as `theme_light()` and `theme_bw()`.


    You can add the built-in themes shown in Figure [5-23](#471585_1_En_5_Chapter.xhtml#Fig23)
    by using `theme_light()`:


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig23_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig23_HTML.jpg)


    Figure 5-23


    Scatterplot with smoothers and labels and themes


    ```

    > ggplot(data, aes(x=var1, y=var2)) + geom_point(aes(color="red")) + geom_smooth()
    + labs(title="scatter", x="x-axis", y="y-axis") + theme_light();

    `geom_smooth()` using method = ''loess'' and formula ''y ~ x''

    ```


    You can add in your own theme, as shown in Figure [5-24](#471585_1_En_5_Chapter.xhtml#Fig24),
    using


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig24_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig24_HTML.jpg)


    Figure 5-24


    Scatterplot with Smoother and customized themes


    ```

    > ggplot(data , aes(x=var1, y=var2)) + geom_point(aes(color="red")) + geom_smooth()
    + labs(title="scatter", x="x-axis", y="y-axis") + theme(plot.title=element_text(size=30,
    face="bold"), axis.text.x=element_text(size=15, face="bold"), axis.text.y=element_text(size=15,
    face="bold"));

    `geom_smooth()` using method = ''loess'' and formula ''y ~ x''

    ```


    `plot.title` is the title of the chart, `axis.text.x` is the x-axis label, `axis.text.y`
    is the y-axis label, `axis.title.x` is the title of x-axis, and `axis.title.y`
    is the title of y-axis. To change the size of the text, use the `element_text()`
    function. To remove the label, you can use `element_blank()`.


    # ggplot2 Common Charts


    After learning the `ggplot` basics and the grammar of graphics, the following
    sections cover some common charts that can be plotted with `ggplot`. The code
    is available also.


    ## Bar Chart


    A bar chart (Figure [5-25](#471585_1_En_5_Chapter.xhtml#Fig25)) is used when you
    want to compare things between groups:


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig25_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig25_HTML.jpg)


    Figure 5-25


    Bar Chart


    ```

    > d  df  ggplot(df) + geom_bar(aes(color="grey", x=d)) + labs(title="bar chart")
    + theme_light();

    ```


    To plot a horizontal bar chart (Figure [5-26](#471585_1_En_5_Chapter.xhtml#Fig26)),
    you can use the `coord_flip()` function:


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig26_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig26_HTML.jpg)


    Figure 5-26


    Horizontal Bar Chart


    ```

    > ggplot(df) + geom_bar(aes(color="grey", x=d)) + coord_flip() + labs(title="bar
    chart") + theme_light();

    ```


    ## Histogram


    A histogram (Figure [5-27](#471585_1_En_5_Chapter.xhtml#Fig27)) allows you to
    see whether the data is normally distributed.


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig27_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig27_HTML.jpg)


    Figure 5-27


    Histogram


    ```

    > set.seed(12);

    > var1  var2  var3  data  ggplot(data, aes(x=var1)) + geom_histogram(bins=10,
    color="black", fill="grey") + labs(title="histogram") + theme_light();

    ```'
