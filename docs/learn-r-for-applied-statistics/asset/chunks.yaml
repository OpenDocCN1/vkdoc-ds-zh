    and reason about the data and understand the causality and relationship between
    variables. Data visualization can also be viewed as descriptive statistics to
    some. Humans distinguish differences in line, shape, and color without much processing
    effort, and data visualization can take advantage of this to create charts and
    graphs to help users understand the data more easily.


    ## Bar Chart and Histogram


    R programming allows us to plot bar charts and histograms. A bar chart represents
    data using bars, with y values being the value of the variable. R programming
    uses the `barplot()` function to create bar charts, and R can draw both horizontal
    and vertical bar charts. A histogram, on the other hand, represents the frequencies
    of the values within a variable and draws them into bars.


    To plot a bar chart in R, you can use the `barplot()` function:


    ```

    > data  barplot(data, xlab="X-axis", ylab="Y-axis", main="Bar Chart 1", col="green");

    ```


    `data` is the data to plot, `xlab` is the x-axis name, `ylab` is the y-axis name,
    `main` is the main title, and `col` is the color of the chart. See Figure [5-1](#471585_1_En_5_Chapter.xhtml#Fig1).


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig1_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Bar Chart of data


    To export the bar chart into an image file (see Figure [5-2](#471585_1_En_5_Chapter.xhtml#Fig2)),
    you can add in


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig2_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Bar Chart PNG file Opened with Microsoft Photos


    ```

    > data  png(file="D:/barchart.png");

    > barplot(data, xlab="x-axis", ylab="y-axis", main="bar chart 1", col="green");

    > dev.off();

    RStudioGD


    ```


    To plot a horizontal bar chart (see Figure [5-3](#471585_1_En_5_Chapter.xhtml#Fig3)),
    you can use `horiz=TRUE`:


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig3_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Horizontal Bar Chart of data variable


    ```

    > data  png(file="D:/barchart.png");

    > barplot(data, xlab="x-axis", ylab="y-axis", main="bar chart 1", col="green",
    horiz=TRUE);

    > dev.off();

    RStudioGD


    ```


    To plot a stacked bar plot, you can create the following data set:


    ```

    > data(mtcars);

    > data  data;

    1 2 3 4 6 8

    3 3 4 3 5 0 0

    4 4 4 0 4 0 0

    5 0 2 0 1 1 1

    ```


    To plot a stacked bar plot:


    ```

    > png(file="D:/barchart.png");

    > barplot(data3, xlab="x-axis", ylab="y-axis", main="bar chart 1", col=c("grey",
    "blue", "yellow"));

    > dev.off();

    RStudioGD


    ```


    In the data, 3 is the grey color, 4 is the blue color, and 5 is the yellow color.
    When the x-axis or x is 1, the grey color is 3 steps, the blue color is 4 steps,
    and the yellow color is 0 steps. See Figure [5-4](#471585_1_En_5_Chapter.xhtml#Fig4).


    ![../images/471585_1_En_5_Chapter/471585_1_En_5_Fig4_HTML.jpg](images/471585_1_En_5_Chapter/471585_1_En_5_Fig4_HTML.jpg)


