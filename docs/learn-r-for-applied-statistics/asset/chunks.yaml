    # 使用 ggplot2


    `ggplot2` 是由 Hadley Wickham 创建的一个包，它提供了一种强大的图形语言，用于创建高级图表。`ggplot2` 在 R 社区中非常流行且著名，它允许我们以直观的方式创建表示单变量、多变量和分类数据的图表。R
    的内置功能提供了图表绘制能力，但 `ggplot` 允许我们使用图形语法绘制更高级的图表。


    要使用 `ggplot2`，你必须安装该包：


    ```

    > install.packages("ggplot2");

    Installing package into ''C:/Users/gohmi/Documents/R/win-library/3.5''

    (as ''lib'' is unspecified)

    also installing the dependencies ''stringi'', ''colorspace'', ''stringr'', ''labeling'',
    ''munsell'', ''RColorBrewer'', ''digest'', ''gtable'', ''lazyeval'', ''plyr'',
    ''reshape2'', ''scales'', ''viridisLite'', ''withr''

    There is a binary version available but

    the source version is later:

    binary source needs_compilation

    stringi  1.1.7  1.2.4              TRUE

    Binaries will be installed

    trying URL ''https://cran.rstudio.com/bin/windows/contrib/3.5/stringi_1.1.7.zip''

    Content type ''application/zip'' length 14368013 bytes (13.7 MB)

    downloaded 13.7 MB

