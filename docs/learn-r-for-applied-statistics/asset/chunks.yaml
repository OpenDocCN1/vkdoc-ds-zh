    The higher the R-squared value, the better, as SSE is smaller.'
  raw: '## Multiple Linear Regressions


    A simple linear regression is for a single response variable, y, and a single
    independent variable, x. The equation for a simple linear regression is


    ![$$ y={b}_0+{b}_1x $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbh.png)


    Multiple linear regression is built from a simple linear regression. Multiple
    linear regression is used when you have more than one independent variable. The
    equation of a multiple linear regression is


    ![$$ y={b}_0+{b}_1{x}_1+{b}_2{x}_2+\dots +{b}_k{x}_k+\epsilon $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbi.png)


    When you have n observations or rows in the data set, you have the following model:


    ![$$ {y}_1={b}_0+{b}_1{x}_{11}+{b}_2{x}_{12}+\dots +{b}_k{x}_{1k}+{\epsilon}_1
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbj.png)


    ![$$ {y}_2={b}_0+{b}_1{x}_{21}+{b}_2{x}_{22}+\dots +{b}_k{x}_{2k}+{\epsilon}_2
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbk.png)


    ![$$ {y}_3={b}_0+{b}_1{x}_{31}+{b}_2{x}_{32}+\dots +{b}_k{x}_{3k}+{\epsilon}_3
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbl.png)


    ![$$ \dots $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbm.png)


    ![$$ {y}_n={b}_0+{b}_1{x}_{n1}+{b}_2{x}_{n2}+\dots +{b}_k{x}_{nk}+{\epsilon}_n
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbn.png)


    Using a matrix, you can represent the equations as


    ![$$ y= Xb+\epsilon $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbo.png)


    where


    ![$$ y=\left[\begin{array}{c}{y}_1\\ {}{y}_2\\ {}.\\ {}.\\ {}.\\ {}{y}_n\end{array}\right]\kern0.75em
    X=\left[\begin{array}{ccccccc}1&amp; {x}_{11}&amp; {x}_{12}&amp; .&amp; .&amp;
    .&amp; {x}_{1k}\\ {}1&amp; {x}_{21}&amp; {x}_{22}&amp; .&amp; .&amp; .&amp; {x}_{2k}\\
    {}.&amp; .&amp; .&amp; &amp; &amp; &amp; .\\ {}.&amp; .&amp; .&amp; &amp; &amp;
    &amp; .\\ {}.&amp; .&amp; .&amp; &amp; &amp; &amp; .\\ {}1&amp; {x}_{n1}&amp;
    {x}_{n2}&amp; .&amp; .&amp; .&amp; {x}_{nk}\end{array}\right] $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbp.png)


    ![$$ b=\left[\begin{array}{c}{b}_1\\ {}{b}_2\\ {}.\\ {}.\\ {}.\\ {}{b}_n\end{array}\right]\kern1.12em
    and\kern1.12em \epsilon =\left[\begin{array}{c}{\epsilon}_1\\ {}{\epsilon}_2\\
    {}.\\ {}.\\ {}.\\ {}{\epsilon}_n\end{array}\right] $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbq.png)


    To calculate the coefficients:


    ![$$ \widehat{b}={\left({X}^{\prime }X\right)}^{-1}{X}^{\prime }y $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbr.png)


    You can use the multiple linear regression in R:


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Figi_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Figi_HTML.jpg)


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Figj_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Figj_HTML.jpg)


    ```

    > set.seed(123);

    > x  x2  y  data  mod  mod;

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Coefficients:

    (Intercept)       data$x      data$x2

    2.517425    -0.266343     0.009525

    > summary(mod);

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Residuals:

    Min      1Q  Median      3Q     Max

    -3.7460 -1.3215 -0.2489  1.2427  4.1597

    Coefficients:

    Estimate Std. Error t value Pr(>|t|)

    (Intercept)  2.517425   0.305233   8.248 7.97e-13 ***

    data$x      -0.266343   0.209739  -1.270    0.207

    data$x2      0.009525   0.039598   0.241    0.810


    Signif. codes:  0 ''***'' 0.001 ''**'' 0.01 ''*'' 0.05 ''.'' 0.1 '' '' 1

    Residual standard error: 1.903 on 97 degrees of freedom

    Multiple R-squared:  0.01727,    Adjusted R-squared:  -0.00299

    F-statistic: 0.8524 on 2 and 97 DF,  p-value: 0.4295

    ```


    To create multiple linear regression in R, you must first create data:


    ```

    > set.seed(123);

    > x  x2  y  data <- data.frame(x, x2, y);

    ```


    You create a multiple linear regression model using the `lm()` function:


    ```

    > mod  mod;

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Coefficients:

    (Intercept)       data$x      data$x2

    2.517425    -0.266343     0.009525

    data$y ~ data$x + data$x2 is y = x + x2

    ```


    To get the summary of the model, you can use the `summary()` function :


    ```

    > summary(mod);

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Residuals:

    Min      1Q  Median      3Q     Max

    -3.7460 -1.3215 -0.2489  1.2427  4.1597

    Coefficients:

    Estimate Std. Error t value Pr(>|t|)

    (Intercept)  2.517425   0.305233   8.248 7.97e-13 ***

    data$x      -0.266343   0.209739  -1.270    0.207

    data$x2      0.009525   0.039598   0.241    0.810


    Signif. codes:  0 ''***'' 0.001 ''**'' 0.01 ''*'' 0.05 ''.'' 0.1 '' '' 1

    Residual standard error: 1.903 on 97 degrees of freedom

    Multiple R-squared:  0.01727,    Adjusted R-squared:  -0.00299

    F-statistic: 0.8524 on 2 and 97 DF,  p-value: 0.4295

    ```


    The linear model from the output is


    ```

    Y = -0.266343x + 0.009525x2 + 2.517425

    ```


    The p-values are 7.97e-13, 0.207, 0.810, 0.4295\. The intercept is significant
    because the p-value is 7.97e-13, which is smaller than 0.05.


    ![$$ {R}^2=1-\frac{SSE}{SST}=1-\frac{\sum_i{\left({y}_i-{\widehat{y}}_i\right)}^2}{\sum_i{\left({y}_i-{\widehat{y}}_i\right)}^2}
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbs.png)


    ![$$ \overline{\mathrm{y}}\kern0.33em \mathrm{i}\mathrm{s}\ \mathrm{the}\ \mathrm{mean}\
    \mathrm{of}\kern0.33em \mathrm{Y}\kern0.33em \mathrm{and}\kern0.33em \widehat{y}\kern0.5em
