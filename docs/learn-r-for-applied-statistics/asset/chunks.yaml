- fmt: "# Linear Regressions\n\nRegression analysis is a form of predictive modelling\
    \ techniques that identify the relationships between dependent and independent\
    \ variables(s). The technique is used to find causal effect relationships between\
    \ variables.\n\nThe benefit of using regression analysis is that it identifies\
    \ the significant relationships between dependent and independent variables and\
    \ the strength of the impact of multiple independent variables on independent\
    \ variables.\n\nLinear regression finds the relationship between one dependent\
    \ variable and one independent variable using a regression line.\n\nThe linear\
    \ regression equation is `y = b[0] + b[1] * x`\n\n`y` is the dependent variable,\
    \ `x` is the independent variable, `b[0]` is the intercept, and `b[1]` is the\
    \ slope. See Figure [6-8](#471585_1_En_6_Chapter.xhtml#Fig8).\n\n![../images/471585_1_En_6_Chapter/471585_1_En_6_Fig8_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Fig8_HTML.jpg)\n\
    \nFigure 6-8\n\nLinear Regressions\n\nTo calculate the slope, you can use\n\n\
    ![$$ {b}_1=\\frac{\\sum_{i=1}^n\\left({x}_i-\\overline{x}\\right)\\left({y}_i-\\\
    overline{y}\\right)}{\\sum_{i=1}^n{\\left({x}_i-\\overline{x}\\right)}^2} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbb.png)\n\
    \nTo calculate the intercept, you can use\n\n![$$ {b}_0=\\overline{y}-{b}_1\\\
    overline{x} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbc.png)\n\
    \nIf `b[1] > 0`, `x` and `y` have a positive relationship.\n\nIf `b[1] < 0`, `x`\
    \ and `y` have a negative relationship.\n\nTo use linear regression in R, you\
    \ use the `lm()` function:\n\n![../images/471585_1_En_6_Chapter/471585_1_En_6_Figh_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Figh_HTML.jpg)\n\
    \n```\n> set.seed(123);\n> x <- rnorm(100);\n> y <- rnorm(100);\n> data <- data.frame(x,\
    \ y);\n> mod <- lm(data$y ~ data$x, data = data);\n> mod;\n\nCall:\nlm(formula\
    \ = data$y ~ data$x, data = data)\n\nCoefficients:\n(Intercept)       data$x\n\
    \    1.8993      -0.1049\n\n> summary(mod);\n\nCall:\nlm(formula = data$y ~ data$x,\
    \ data = data)\n\nResiduals:\n    Min      1Q  Median      3Q     Max\n-3.815\
    \  -1.367  -0.175   1.161   6.581\n\nCoefficients:\n            Estimate Std.\
    \ Error t value Pr(>|t|)\n(Intercept)   1.8993     0.3033   6.261 1.01e-08 ***\n\
    data$x       -0.1049     0.2138  -0.491    0.625\n\nSignif. codes:  0 '***' 0.001\
    \ '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n\nResidual standard error: 1.941 on 98 degrees\
    \ of freedom\nMultiple R-squared:  0.002453,    Adjusted R-squared:  -0.007726\n\
    F-statistic: 0.241 on 1 and 98 DF,  p-value: 0.6246\n```\n\nThe output depicts\
    \ that the linear equation is\n\n![$$ y=-0.1049x+1.8993 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbd.png)\n\
    \nThe p-values of 1.01e-08, 0.625, and 0.6246 tell you the significance of the\
    \ linear model. When the p-value is less than 0.05, the model is significant.\n\
    \n- `H[0]`: Coefficient associated with the variable is equal to zero\n- `H[a]`:\
    \ Coefficient is not equal to zero (there is a relationship)\n\nThe intercept\
    \ has a p-value of 1.01e-08, which is smaller than 0.05, so there is a significance\
    \ with the `y` variable. The significance is indicated with the number of `*`.\
    \ The `x` has a p-value of 0.625, which is more than 0.05, so there is no significance\
    \ with the `y` variable. The null hypothesis is true at the 95% confidence interval.\n\
    \nR-square depicts the proportion of the variation in the dependent variable,\
    \ and the formula is\n\n![$$ {R}^2=1-\\frac{SSE}{SST} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Eqube.png)\n\
    \nwhere SSE is the sum of squared errors\n\n![$$ SSE=\\sum \\limits_i^n{\\left({y}_i-{\\\
    widehat{y}}_i\\right)}^2 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbf.png)\n\
    \nand SST is the sum of the squared total\n\n![$$ SST=\\sum \\limits_i^n{\\left({y}_i-{\\\
    overline{y}}_i\\right)}^2 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbg.png)\n\
    \n![$$ \\overline{\\mathrm{y}}\\kern0.33em \\mathrm{i}\\mathrm{s}\\ \\mathrm{the}\\\
    \ \\mathrm{mean}\\ \\mathrm{of}\\kern0.33em \\mathrm{Y}\\kern0.33em \\mathrm{and}\\\
    kern0.33em \\widehat{y}\\ \\mathrm{i}\\mathrm{s}\\ \\mathrm{the}\\ \\mathrm{fitted}\\\
    \ \\mathrm{value}\\ \\mathrm{for}\\kern0.33em \\mathrm{row}\\kern0.33em \\mathrm{i}.\
    \ $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq13.png)\n\n`ŷ`\
    \ is the fitted value, which means that in `y = -0.1049x + 1.8993`, you fit in\
    \ `x` to get `y`. The `y` is the `ŷ`. `(y - ŷ)` means that you use the original\
    \ `y` values minus the `ŷ` predicted values, which is the error. Hence, `Σ(y_i\
    \ - ŷ_i)²` is the sum of the square error (SSE). In order for `SSE / SST` to be\
    \ small, SSE must be small. Nevertheless, `1 - SSE / SST` is large when `SSE /\
    \ SST` is small.\n\nHence, the higher the R-squared and the adjusted R-squared,\
    \ the better the linear model. The lower the standard error, the better the model."
  raw: '## Linear Regressions


    Regression analysis is a form of predictive modelling techniques that identify
    the relationships between dependent and independent variables(s). The technique
    is used to find causal effect relationships between variables.


    The benefit of using regression analysis is that it identifies the significant
    relationships between dependent and independent variables and the strength of
    the impact of multiple independent variables on independent variables.


    Linear regression finds the relationship between one dependent variable and one
    independent variable using a regression line.


    The linear regression equation is *y* = *b*[0]+*b*[1]*x*


    *y* is the dependent variable, *x* is the independent variable, *b*[0] is the
    intercept, and *b*[1] is the slope. See Figure [6-8](#471585_1_En_6_Chapter.xhtml#Fig8).


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Fig8_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    LInear Regressions


    To calculate the slope, you can use


    ![$$ {b}_1=\frac{\sum_{i=1}^n\left({x}_i-\overline{x}\right)\left({y}_i-\overline{y}\right)}{\sum_{i=1}^n{\left({x}_i-\overline{x}\right)}^2}
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbb.png)


    To calculate the intercept, you can use


    ![$$ {b}_0=\overline{y}-{b}_1\overline{x} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbc.png)


    If *b*[1] > 0, *x* and *y* have a positive relationship.


    If *b*[1] < 0, *x* and *y* have a negative relationship.


    To use linear regression in R, you use the `lm()` function :


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Figh_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Figh_HTML.jpg)


    ```

    > set.seed(123);

    > x  y  data  mod  mod;

    Call:

    lm(formula = data$y ~ data$x, data = data)

    Coefficients:

    (Intercept)       data$x

    1.8993      -0.1049

    > summary(mod);

    Call:

    lm(formula = data$y ~ data$x, data = data)

    Residuals:

    Min     1Q Median     3Q    Max

    -3.815 -1.367 -0.175  1.161  6.581

    Coefficients:

    Estimate Std. Error t value Pr(>|t|)

    (Intercept)   1.8993     0.3033   6.261 1.01e-08 ***

    data$x       -0.1049     0.2138  -0.491    0.625


    Signif. codes:  0 ''***'' 0.001 ''**'' 0.01 ''*'' 0.05 ''.'' 0.1 '' '' 1

    Residual standard error: 1.941 on 98 degrees of freedom

    Multiple R-squared:  0.002453,    Adjusted R-squared:  -0.007726

    F-statistic: 0.241 on 1 and 98 DF,  p-value: 0.6246

    ```


    The output depicts that the linear equation is


    ![$$ y=-0.1049x+1.8993 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbd.png)


    The p-values of 1.01e-08, 0.625, and 0.6246 tell you the significance of the linear
    model. When the p-value is less than 0.05, the model is significant.


    *   H[0] :  : Coefficient associated with the variable is equal to zero


    *   H[a] :  : Coefficient is not equal to zero (there is a relationship)


    The intercept has a p-value of 1.01e-08, which is smaller than 0.05, so there
    is a significance with the y variable. The significance is indicated with the
    number of *. The x has a p-value of 0.625, which is more than 0.05, so there is
    no significance with the y variable. The null hypothesis is true at the 95% confidence
    interval.


    R-square depicts the proportion of the variation in the dependent variable, and
    the formula is


    ![$$ {R}^2=1-\frac{SSE}{SST} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Eqube.png)


    where SSE is the sum of squared errors


    ![$$ SSE=\sum \limits_i^n{\left({y}_i-{\widehat{y}}_i\right)}^2 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbf.png)


    and SST is the sum of the squared total


    ![$$ SST=\sum \limits_i^n{\left({y}_i-{\overline{y}}_i\right)}^2 $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbg.png)


    ![$$ \overline{\mathrm{y}}\kern0.33em \mathrm{i}\mathrm{s}\ \mathrm{the}\ \mathrm{mean}\
    \mathrm{of}\kern0.33em \mathrm{Y}\kern0.33em \mathrm{and}\kern0.33em \widehat{y}\
    \mathrm{i}\mathrm{s}\ \mathrm{the}\ \mathrm{fitted}\ \mathrm{value}\ \mathrm{for}\kern0.33em
    \mathrm{row}\kern0.33em \mathrm{i}. $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq13.png)


    ![$$ \widehat{y} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq14.png)is
    the fitted value, which mean that in y = -0.1049x + 1.8993, you fit in x to get
    y. The y is the ![$$ \widehat{y} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq15.png).
    ![$$ \left(y-\widehat{y}\right) $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq16.png)
    means that you use the original y values minus the ![$$ \widehat{y} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq17.png)
    predicted values, which is the error. Hence, ![$$ \sum \limits_i{\left({y}_i-{\widehat{y}}_i\right)}^2
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq18.png) is the sum
    of the square error (SSE). In order for ![$$ \frac{SSE}{SST} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq19.png)
    to be small, SSE must be small. Nevertheless, ![$$ 1-\frac{SSE}{SST} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq20.png)
    is large when ![$$ \frac{SSE}{SST} $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_IEq21.png)
    is small.


    Hence, the higher the R-squared and the adjusted R-squared, the better the linear
    model. The lower the standard error, the better the model.'
  trans: "\n# 线性回归\n\n回归分析是一种预测建模技术，用于识别因变量与自变量之间的关系。该技术旨在发现变量之间的因果效应关系。\n\n使用回归分析的好处在于，它能识别因变量与自变量之间的显著关系，以及多个自变量对因变量的影响强度。\n\
    \n线性回归通过一条回归线来寻找一个因变量与一个自变量之间的关系。\n\n线性回归方程为 `y = b[0] + b[1] * x`\n\n其中 `y` 是因变量，`x`\
    \ 是自变量，`b[0]` 是截距，`b[1]` 是斜率。参见图 6-8。\n\n![../images/471585_1_En_6_Chapter/471585_1_En_6_Fig8_HTML.jpg](img/471585_1_En_6_Fig8_HTML.jpg)\n\
    \n图 6-8\n\n线性回归\n\n要计算斜率，可以使用\n\n![$$ {b}_1=\\frac{\\sum_{i=1}^n\\left({x}_i-\\\
    overline{x}\\right)\\left({y}_i-\\overline{y}\\right)}{\\sum_{i=1}^n{\\left({x}_i-\\\
    overline{x}\\right)}²} $$](img/471585_1_En_6_Chapter_TeX_Equbb.png)\n\n要计算截距，可以使用\n\
    \n![$$ {b}_0=\\overline{y}-{b}_1\\overline{x} $$](img/471585_1_En_6_Chapter_TeX_Equbc.png)\n\
    \n如果 `b[1] > 0`，则 `x` 和 `y` 呈正相关关系。\n\n如果 `b[1] < 0`，则 `x` 和 `y` 呈负相关关系。\n\n要在\
    \ R 中使用线性回归，可以使用 `lm()` 函数：\n\n![../images/471585_1_En_6_Chapter/471585_1_En_6_Figh_HTML.jpg](img/471585_1_En_6_Figh_HTML.jpg)\n\
    \n```\n> set.seed(123);\n> x <- rnorm(100);\n> y <- rnorm(100);\n> data <- data.frame(x,\
    \ y);\n> mod <- lm(data$y ~ data$x, data = data);\n> mod;\n\nCall:\nlm(formula\
    \ = data$y ~ data$x, data = data)\n\nCoefficients:\n(Intercept)       data$x\n\
    \    1.8993      -0.1049\n\n> summary(mod);\n\nCall:\nlm(formula = data$y ~ data$x,\
    \ data = data)\n\nResiduals:\n    Min      1Q  Median      3Q     Max\n-3.815\
    \  -1.367  -0.175   1.161   6.581\n\nCoefficients:\n            Estimate Std.\
    \ Error t value Pr(>|t|)\n(Intercept)   1.8993     0.3033   6.261 1.01e-08 ***\n\
    data$x       -0.1049     0.2138  -0.491    0.625\n\nSignif. codes:  0 '***' 0.001\
    \ '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n\nResidual standard error: 1.941 on 98 degrees\
    \ of freedom\nMultiple R-squared:  0.002453,    Adjusted R-squared:  -0.007726\n\
    F-statistic: 0.241 on 1 and 98 DF,  p-value: 0.6246\n```\n\n输出结果显示线性方程为\n\n![$$\
    \ y=-0.1049x+1.8993 $$](img/471585_1_En_6_Chapter_TeX_Equbd.png)\n\np 值分别为 1.01e-08、0.625\
    \ 和 0.6246，这些值表明了线性模型的显著性。当 p 值小于 0.05 时，模型是显著的。\n\n- `H[0]`：与变量相关的系数等于零\n- `H[a]`：系数不等于零（存在关系）\n\
    \n截距的 p 值为 1.01e-08，小于 0.05，因此与 `y` 变量存在显著关系。显著性由 `*` 的数量表示。`x` 的 p 值为 0.625，大于\
    \ 0.05，因此与 `y` 变量不存在显著关系。在 95% 的置信区间内，原假设成立。\n\nR 方表示因变量变异中被解释的比例，其公式为\n\n![$$\
    \ {R}²=1-\\frac{SSE}{SST} $$](img/471585_1_En_6_Chapter_TeX_Eqube.png)\n\n其中 SSE\
    \ 是误差平方和\n\n![$$ SSE=\\sum \\limits_i^n{\\left({y}_i-{\\widehat{y}}_i\\right)}²\
    \ $$](img/471585_1_En_6_Chapter_TeX_Equbf.png)\n\n而 SST 是总平方和\n\n![$$ SST=\\sum\
    \ \\limits_i^n{\\left({y}_i-{\\overline{y}}_i\\right)}² $$](img/471585_1_En_6_Chapter_TeX_Equbg.png)\n\
    \n![$$ \\overline{\\mathrm{y}}\\kern0.33em \\mathrm{i}\\mathrm{s}\\ \\mathrm{the}\\\
    \ \\mathrm{mean}\\ \\mathrm{of}\\kern0.33em \\mathrm{Y}\\kern0.33em \\mathrm{and}\\\
    kern0.33em \\widehat{y}\\ \\mathrm{i}\\mathrm{s}\\ \\mathrm{the}\\ \\mathrm{fitted}\\\
    \ \\mathrm{value}\\ \\mathrm{for}\\kern0.33em \\mathrm{row}\\kern0.33em \\mathrm{i}.\
    \ $$](img/471585_1_En_6_Chapter_TeX_IEq13.png)\n\n`ŷ` 是拟合值，这意味着在 `y = -0.1049x\
    \ + 1.8993` 中，代入 `x` 即可得到 `y`。这个 `y` 就是 `ŷ`。`(y - ŷ)` 表示用原始的 `y` 值减去预测的 `ŷ` 值，这就是误差。因此，`Σ(y_i\
    \ - ŷ_i)²` 就是误差平方和 (SSE)。为了使 `SSE / SST` 较小，SSE 必须很小。然而，当 `SSE / SST` 很小时，`1 -\
    \ SSE / SST` 就会很大。\n\n因此，R 方和调整后的 R 方越高，线性模型越好。标准误差越低，模型越好。\n"
- fmt: '# Multiple Linear Regressions


    A simple linear regression is for a single response variable, `y`, and a single
    independent variable, `x`. The equation for a simple linear regression is


    ![$$ y={b}_0+{b}_1x $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbh.png)


    Multiple linear regression is built from a simple linear regression. Multiple
    linear regression is used when you have more than one independent variable. The
    equation of a multiple linear regression is


    ![$$ y={b}_0+{b}_1{x}_1+{b}_2{x}_2+\dots +{b}_k{x}_k+\epsilon $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbi.png)


    When you have `n` observations or rows in the data set, you have the following
    model:


    ![$$ {y}_1={b}_0+{b}_1{x}_{11}+{b}_2{x}_{12}+\dots +{b}_k{x}_{1k}+{\epsilon}_1
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbj.png)


    ![$$ {y}_2={b}_0+{b}_1{x}_{21}+{b}_2{x}_{22}+\dots +{b}_k{x}_{2k}+{\epsilon}_2
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbk.png)


    ![$$ {y}_3={b}_0+{b}_1{x}_{31}+{b}_2{x}_{32}+\dots +{b}_k{x}_{3k}+{\epsilon}_3
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbl.png)


    ![$$ \dots $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbm.png)


    ![$$ {y}_n={b}_0+{b}_1{x}_{n1}+{b}_2{x}_{n2}+\dots +{b}_k{x}_{nk}+{\epsilon}_n
    $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbn.png)


    Using a matrix, you can represent the equations as


    ![$$ y= Xb+\epsilon $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbo.png)


    where


    ![$$ y=\left[\begin{array}{c}{y}_1\\ {}{y}_2\\ {}.\\ {}.\\ {}.\\ {}{y}_n\end{array}\right]\kern0.75em
    X=\left[\begin{array}{ccccccc}1&amp; {x}_{11}&amp; {x}_{12}&amp; .&amp; .&amp;
    .&amp; {x}_{1k}\\ {}1&amp; {x}_{21}&amp; {x}_{22}&amp; .&amp; .&amp; .&amp; {x}_{2k}\\
    {}.&amp; .&amp; .&amp; &amp; &amp; &amp; .\\ {}.&amp; .&amp; .&amp; &amp; &amp;
    &amp; .\\ {}.&amp; .&amp; .&amp; &amp; &amp; &amp; .\\ {}1&amp; {x}_{n1}&amp;
    {x}_{n2}&amp; .&amp; .&amp; .&amp; {x}_{nk}\end{array}\right] $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbp.png)


    ![$$ b=\left[\begin{array}{c}{b}_1\\ {}{b}_2\\ {}.\\ {}.\\ {}.\\ {}{b}_n\end{array}\right]\kern1.12em
    and\kern1.12em \epsilon =\left[\begin{array}{c}{\epsilon}_1\\ {}{\epsilon}_2\\
    {}.\\ {}.\\ {}.\\ {}{\epsilon}_n\end{array}\right] $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbq.png)


    To calculate the coefficients:


    ![$$ \widehat{b}={\left({X}^{\prime }X\right)}^{-1}{X}^{\prime }y $$](images/471585_1_En_6_Chapter/471585_1_En_6_Chapter_TeX_Equbr.png)


    You can use the multiple linear regression in R:


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Figi_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Figi_HTML.jpg)


    ![../images/471585_1_En_6_Chapter/471585_1_En_6_Figj_HTML.jpg](images/471585_1_En_6_Chapter/471585_1_En_6_Figj_HTML.jpg)


    ```

    > set.seed(123);

    > x <- rnorm(100);

    > x2 <- rnorm(100);

    > y <- 2.5 + 0.5 * x + 0.3 * x2 + rnorm(100, 0, 0.5);

    > data <- data.frame(x, x2, y);

    > mod <- lm(data$y ~ data$x + data$x2, data = data);

    > mod;

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Coefficients:

    (Intercept)       data$x      data$x2

    2.517425    -0.266343     0.009525

    > summary(mod);

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Residuals:

    Min      1Q  Median      3Q     Max

    -3.7460 -1.3215 -0.2489  1.2427  4.1597

    Coefficients:

    Estimate Std. Error t value Pr(>|t|)

    (Intercept)  2.517425   0.305233   8.248 7.97e-13 ***

    data$x      -0.266343   0.209739  -1.270    0.207

    data$x2      0.009525   0.039598   0.241    0.810


    Signif. codes:  0 ''***'' 0.001 ''**'' 0.01 ''*'' 0.05 ''.'' 0.1 '' '' 1

    Residual standard error: 1.903 on 97 degrees of freedom

    Multiple R-squared:  0.01727,    Adjusted R-squared:  -0.00299

    F-statistic: 0.8524 on 2 and 97 DF,  p-value: 0.4295

    ```


    To create multiple linear regression in R, you must first create data:


    ```

    > set.seed(123);

    > x <- rnorm(100);

    > x2 <- rnorm(100);

    > y <- 2.5 + 0.5 * x + 0.3 * x2 + rnorm(100, 0, 0.5);

    > data <- data.frame(x, x2, y);

    ```


    You create a multiple linear regression model using the `lm()` function:


    ```

    > mod <- lm(data$y ~ data$x + data$x2, data = data);

    > mod;

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Coefficients:

    (Intercept)       data$x      data$x2

    2.517425    -0.266343     0.009525

    data$y ~ data$x + data$x2 is y = x + x2

    ```


    To get the summary of the model, you can use the `summary()` function:


    ```

    > summary(mod);

    Call:

    lm(formula = data$y ~ data$x + data$x2, data = data)

    Residuals:

    Min      1Q  Median      3Q     Max

    -3.7460 -1.3215 -0.2489  1.2427  4.1597

    Coefficients:

    Estimate Std. Error t value Pr(>|t|)

    (Intercept)  2.517425   0.305233   8.248 7.97e-13 ***

    data$x      -0.266343   0.209739  -1.270    0.207

    data$x2      0.009525   0.039598   0.241    0.810


    Signif. codes:  0 ''***'' 0.001 ''**'' 0.01 ''*'' 0.05 ''.'' 0.1 '' '' 1

    Residual standard error: 1.903 on 97 degrees of freedom

    Multiple R-squared:  0.01727,    Adjusted R-squared:  -0.00299

    F-statistic: 0.8524 on 2 and 97 DF,  p-value: 0.4295

    ```


    The linear model from the output is


    ```

    Y = -0.266343x + 0.009525x2 + 2.517425

    ```


    The p-values are `7.97e-13`, `0.207`, `0.810`, `0.4295`. The intercept is significant
    because the p-value is `7.97e-13`, which is smaller than `0.05`.


