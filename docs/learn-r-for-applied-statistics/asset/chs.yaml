  对于文本数据更高级的重复值移除，你可以使用莱文斯坦相似度算法等。本书不涉及相似度重复值移除的详细内容。对于每一行数据，你可以计算当前行与数据中所有其他行的莱文斯坦相似度，并返回相似度低于指定值的结果。然后你可以检查它们是否真的相似且重复，并根据需要将其移除。


  ## 一些基础统计术语


  以下是统计学中最常用的一些术语。


  - **总体**：总体是观测值的总集合。总体是一个整体，包含每一个成员或观测值。

  - **样本**：样本是总体的一部分。可以通过随机抽样技术等方法从总体中抽取样本。

  - **观测值**：观测值是在研究或实验中测量或计数得到的内容。观测值通常指数据中的行。

  - **变量**：变量是可以计数的特征或数量，也可称为数据项。变量通常指数据中的列。


  ### 数据类型


  数据可以是数值型数据或分类型数据。


  - 数值型数据可以是离散数据或连续数据。离散变量通常取整数值。离散变量有间隔。连续变量可以是任意实数值。

  - 分类型数据是类别或非数值型数据。分类型数据可以包含无序类别的名义变量。有序变量可以包含有序类别。


  ### 众数、中位数、平均数


  平均数、中位数和众数是衡量集中趋势最常用的指标。集中趋势是一种最能概括数据的度量，是与数据集中心相关的度量。




  #### 众数


  `众数`是数据中出现频率最高的值，当数据差异非数值化且很少出现时，它非常有用。


  要在 R 中获取众数，首先从数据开始：


  ```

  > A <- c(1, 2, 3, 4, 5, 5, 5, 6, 7, 8);

  ```


  要获取向量中的众数，你需要创建一个频率表：


  ```

  > y <- table(A)

  > y;

  A

  1 2 3 4 5 6 7 8

  1 1 1 1 3 1 1 1

  ```


  你想要获取最高频率，因此使用以下方法获取众数：


  ```

  > names(y)[which(y==max(y))];

  [1] "5"

  ```


