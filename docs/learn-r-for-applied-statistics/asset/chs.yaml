  > require(rjson);

  Loading required package: rjson

  ```


  你可以使用 `fromJSON()` 函数读取 JSON 文件：


  ```

  > data <- fromJSON(file="data.json");

  ```


  要将数据转换为数据框类型，可以使用以下代码：


  ```

  > data2 <- as.data.frame(data);

  ```


