  要使用 `foreign` 包，请使用 `require()` 函数：


  ```

  > require(foreign);

  Loading required package: foreign

  ```


  要将 SPSS 文件读取为数据框类型，请使用 `read.spss()` 函数：


  ```

  > data <- read.spss(file="data.spss", to.data.frame=TRUE);

  ```


  `file` 是要读取的 SPSS 文件的路径或位置。`to.data.frame` 是一个逻辑值，用于指定是否将 SPSS 文件读取为数据框类型。


  你可以使用 `help()` 函数获取 `read.spss()` 函数的文档，如图 4-7 所示。


