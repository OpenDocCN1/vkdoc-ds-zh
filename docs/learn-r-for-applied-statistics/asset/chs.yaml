  [64]  0.98142462  0.92820877  2.30352864  2.44820978  2.05300423  2.92226747  4.05008469\n\
  [71]  1.50896883 -0.30916888  3.00573852  1.29079924  1.31199138  3.02557137  1.71522699\n\
