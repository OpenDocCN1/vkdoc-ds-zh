  \    Mean :3.758     Mean   :1.199\n3rd Qu.:6.400   3rd Qu.:3.300   3rd Qu.:5.100\
  \   3rd Qu.:1.800\nMax. :7.900     Max. :4.400     Max. :6.900     Max. :2.500\n\
