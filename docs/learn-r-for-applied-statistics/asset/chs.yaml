  ## 结论


  在本章中，您学习了 R 编程。您现在了解到描述性统计对数据进行汇总，通常关注数据的分布、集中趋势和离散程度。另一方面，数据可视化则根据数据创建图形，帮助我们理解数据。


  您学习了如何使用 R 编程绘制折线图、条形图、直方图、散点图、散点图矩阵、饼图和箱线图。


  您还学习了决策树，这是一种机器学习算法，可以执行分类和回归任务。它们可以是一种用树形结构表示选择和结果的图形。


  您还学习了社交网络分析图，它可以帮助我们理解个体或节点之间的关系。社交网络分析通常用于 Facebook 和微博等社交网络数据。每个节点都是一个个体，社交网络图向我们展示了每个个体如何与其他个体连接。


  您还探索了 ggplot2，这是一个由 Hadley Wickham 创建的包，它提供了一种强大的图形语言，用于创建高级图表。ggplot2 在 R 社区中非常流行和著名，它允许我们以直接的方式创建表示单变量、多变量和分类数据的图表。


  您还学习了图形语法。ggplot2 专注于图形语法。图形语法是图表的构建块。


  您还探索了 Plotly JS。Plotly JS 允许我们创建交互式、出版级的图表。您使用 ggplot 创建了一个 Plotly 图表。


  '
- "# 6. 推断统计与回归\n\n推断统计和描述性统计是统计学的主要分支。描述性统计从数据集中得出摘要，并使用集中趋势、离散程度和偏度。推断统计则根据样本数据描述并对总体进行推断。在推断统计中，您会用到假设检验和参数估计。回归分析是一组用于估计所有变量之间关系的统计过程。\n\
  \n在本章中，您将了解 `apply()`、`lapply()` 和 `sapply()` 函数，然后对数据进行抽样，执行相关性和协方差分析，以及 p 值检验、t\
  \ 检验、卡方检验和方差分析等检验。接着，您将了解非参数检验，包括 Wilcoxon 符号秩检验、Wilcoxon-Mann-Whitney 检验、Kruskal-Wallis\
  \ 检验，以及简单线性回归和多元线性回归分析。\n\n\n\n## 什么是推断统计与回归分析？\n\n推断统计与描述统计是统计学的两大分支。描述统计通过均值、中位数等集中趋势，方差、标准差等离散程度，以及偏度和峰度来概括数据特征。\n\
  \n推断统计则对总体和样本数据进行描述和推断。在推断统计中，你会用到假设检验和参数估计。通过参数估计，你试图回答总体参数的问题；通过假设检验，你试图回答一个研究问题。在假设检验中，研究问题是以疑问句形式提出的假设。例如，研究问题可以是：*一班和二班的工程数学考试成绩是否存在显著差异？*\
  \ 而假设可以是：*一班和二班的工程数学考试成绩存在显著差异。* 研究问题以\"是否存在\"开头，假设以\"存在\"开头。根据研究问题，假设可分为原假设 `H[0]`\
  \ 和备择假设 `H[a]`。原假设 `H[0]` 可以是 `μ[1] = u[2]`，备择假设 `H[a]` 可以是 `μ[1] ≠ u[2]`。其中 `μ[1]`\
  \ 是一班成绩的均值，`μ[2]` 是二班成绩的均值。随后你可以使用推断检验来获取 p 值。如果 p 值小于或等于显著性水平 alpha（通常为 0.05），则拒绝原假设，并认为在\
  \ 95% 置信区间下备择假设成立。如果 p 值大于 0.05，则无法拒绝原假设。\n\n对于参数估计，参数可以是均值、方差、标准差等。如果你想估计整个人群的身高均值（顺便提一句，测量所有人是不可能的），你可以采用抽样方法从人群中选取一部分人。接着计算样本的身高均值，然后推断总体身高的均值。之后你可以构建置信区间，即总体身高均值可能落入的范围。之所以构建一个范围，是因为样本无法精确推导出总体身高的均值。\n\
  \n回归分析是一套用于估计变量之间关系的统计过程。更具体地说，回归分析用于理解自变量与因变量之间的关系，并探索这些关系的形式。\n\n### `apply()`、`lapply()`、`sapply()`\n\
  \n`apply()` 函数可以执行循环来遍历数据并应用一个函数。该函数可以是 R 语言中的 `mean()` 函数，也可以是自定义函数。使用 `apply()`\
  \ 函数是为了避免使用循环。`apply()` 函数可以处理列表、矩阵或数组。\n\n要使用 `apply()` 函数，先创建随机数据：\n\n```\n> set.seed(123);\n\
  > var1  var2  var3  data  data;\nvar1      var2        var3\n1    1.43952435 2.2895934\
  \  7.39762070\n2    1.76982251 3.2568837  5.62482595\n3    3.55870831 2.7533081\
  \  2.46970989\n4    2.07050839 2.6524574  4.08638812\n5    2.12928774 2.0483814\
  \  2.17132010\n6    3.71506499 2.9549723  2.04750621\n7    2.46091621 2.2150955\
  \  1.42279432\n8    0.73493877 1.3320581  1.81076547\n9    1.31314715 2.6197735\
  \  6.30181493\n10   1.55433803 3.9189966  2.89194375\n```\n\n你可以将 `apply()` 函数与\
