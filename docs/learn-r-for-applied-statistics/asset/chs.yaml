  \ masked from 'package:base':\nintersect, setdiff, setequal, union\n```\n\n你可以使用\
  \ `dplyr` 进行分层抽样：\n\n```\n> iris_sample %\n+ group_by(Species) %>%\n+ sample_n(13)\n\
  > iris_sample;\n# A tibble: 39 x 5\n# Groups:   Species [3]\nSepal.Length Sepal.Width\
  \ Petal.Length Petal.Width Species\n\n1          5           3.5          1.3  \
  \       0.3 setosa\n2          5           3.4          1.5         0.2 setosa\n\
