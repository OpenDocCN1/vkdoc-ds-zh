  `read.spss()` 的文档


  #### 写入 SPSS 文件


  你可以使用 `write.foreign()` 函数写入 SPSS 文件：


  ```

  > write.foreign(data, "mydata.txt", "mydata.sps", package="SPSS");

  ```


  `data` 是要导出到 SPSS 数据文件的变量，`mydata.txt` 是逗号分隔格式的数据，`mydata.sps` 是将数据文件读入 SPSS 的基本语法文件，`package`
  决定输出或导出为 SPSS 格式。


  #### 读取 JSON 文件


  JSON，即 JavaScript 对象表示法，是一种非常流行的数据交换格式，易于人类编写或阅读。可以使用 `rjson` 包读取 JSON 文件。要安装 `rjson`
  包，请使用 `install.packages()` 函数：


  ```

  > install.packages("rjson");

