  \n现在，让我们切入关键问题。给定可变的占据概率 `p` 以及格点（或键）之间的独立性，何时会有一个簇从网格顶部边缘渗流到底部边缘？\n\n### 逾渗与临界概率\n\
  \n实际上，数学家们更关心另一个问题：对于一个无限大的簇，何时才能确定地形成一个无限簇？从模拟的角度来看，我们无法模拟无限大的网格，但可以通过回答前面那个更简单的问题来逼近这个难题。如果一个簇以\
  \ 100% 的概率无法渗穿过网格，那么就不可能形成无限簇。\n\n我们将这样的阈值概率称为 `pc`，其中 `c` 代表临界（critical）。\n\n###\
  \ 一维情况的解析解\n\n虽然这本书是关于模拟的，但我还是想向你展示一维情况是如何解析求解的。\n\n对于一维情况下的格点逾渗或键逾渗，临界概率 `pc` 均为\
  \ 1。这很容易想象：在一维空间中，形成无限簇的路径有且仅有一条。因此，任何小于 1 的概率都会阻止无限簇的形成。\n\n假设一个大小为 `L` 的簇存在的概率记为\
  \ `P(p, L)`，那么临界概率必须满足以下方程：\n\n```\nlim_{L→∞} P(p, L) = { 0  p < pc, 1  p > pc }\n\
  ```\n\n幸运的是，`P(p, L)` 的精确表达式很容易推导：\n\n```\nlim_{L→∞} P(p, L) = lim_{L→∞} p^L = {\
  \ 0  p < 1, 1  p = 1 }\n```\n\n因此，我们的临界概率 `pc` 为 1。\n\n从一维到二维，解析推导的难度急剧增加。事实上，数学家们花费了大约\
  \ 20 年时间才获得并证明了二维方形网格键逾渗情况的临界概率的解析形式。哈里·凯斯滕证明，在二维方形网格中，键逾渗的临界概率恰好是 `1/2`。而格点逾渗的情况则众所周知难以推导。事实证明，我们只能通过运行模拟来估算它。这种方法你在[第\
  \ 1 章](https://doi.org/10.1007/978-1-4842-8185-7_1)中已经见过。\n\n### 二维情况的模拟\n\n我们将分两步进行模拟。第一部分，我们编写一个函数来检测是否存在一个可以渗穿过网格的簇，并将其标记为灰色。我们的目标只是找到一个，因此一旦找到一个，就停止探索其他可能的簇。\n\
  \n第二部分，我们将多次运行模拟，以逼近临界概率 `pc`。\n\n要发现渗流簇的存在，我们需要编写一个图遍历算法来遍历相邻的占据格点。有两种选择：一种是广度优先搜索，另一种是深度优先搜索。这里我实现了深度优先搜索算法。其思路是递归地访问邻居，直到访问完一条最长的可能路径，然后返回到上一轮递归中的另一条可能路径。\n\
  \n```python\ndef dfs(self, site, visited) -> None:\n    visited.add(site)  # (1)\n\
  \    (w, h) = site\n    neighbors = [site for site in [(w - 1, h), (w + 1, h), (w,\
  \ h - 1), (w, h + 1)] if self.filter_illegal_site(site)]\n    for neighbor in neighbors:\n\
  \        if neighbor not in visited and self.states[neighbor[0]][neighbor[1]] ==\
  \ State.Working:\n            self.dfs(neighbor, visited)\n```\n\n接下来，我们编写另一个函数来完成寻找簇的主要工作。我们从网格的最底行开始，每当遇到一个占据的格点，就开始搜索簇。如果在搜索过程中，发现一个格点位于网格的顶部边缘，我们的任务就完成了。如果我们在底边找不到任何能通向渗流簇的格点，搜索也会结束。\n\
  \n```python\ndef percolate_through(self):\n    clusters = []\n    success = False\n\
  \    for w in range(self.width):\n        if clusters:\n            all_visited\
  \ = reduce(lambda x, y: x.union(y), clusters)  # (1)\n        else:\n          \
  \  all_visited = set()\n        if self.states[w][0] == State.Working and (w, 0)\
  \ not in all_visited:\n            clusters.append(set())\n            self.dfs((w,\
  \ 0), clusters[-1])\n            latest_cluster = clusters[-1]\n            if max([site[1]\
  \ for site in latest_cluster]) == self.height - 1:\n                success = True\n\
  \                return clusters[-1], success\n    return None, success\n\ndef filter_illegal_site(self,\
  \ site):  # (2)\n    (w, h) = site\n    if w < 0 or w >= self.width:\n        return\
  \ False\n    if h < 0 or h >= self.height:\n        return False\n    return True\n\
  ```\n\n我们还可以更新程序的其他部分，以便高亮显示渗流簇。以下是关键代码行。你可以在本书的在线网站上找到完整代码。\n\n```python\nclass\
  \ State(Enum):\n    Working = 1\n    Broken = 0\n    Cluster = -1\n\nclass Grid:\n\
  \    state_to_color = {State.Broken: \"red\",\n                      State.Working:\
  \ \"blue\",\n                      State.Cluster: \"gray\"}\n```\n\n![](img/index-96_1.png)\n\
  \n```python\ndef render(self, return_array=False, block_size=1300, percolating=False):\n\
  \    if percolating:\n        cluster, success = self.percolate_through()\n    \
  \    if success:\n            for site in cluster:\n                w, h = site\n\
  \                self.states[w][h] = State.Cluster\n```\n\n请注意，该方法只应运行一次。深度优先搜索算法的正确性保证了如果存在渗流簇，就一定能发现一个。\n\
  \n好了，让我们运行一次模拟渲染，看看能否在不同的网格大小和占据概率下找到渗流簇。首先，尝试一个大小为 10×10、占据概率为 0.5 的网格：\n\n```python\n\
  Grid(width=10, height=10, random_init=True, prob=0.5).render(percolating=True)\n\
  ```\n\n我们很幸运！确实存在一个渗流簇！图 5-3 中的灰色格点显示了渗流簇。\n\n***图 5-3.** 包含渗流簇的网格*\n\n![](img/index-97_1.png)\n\
