  \n### 练习与扩展思路\n\n在本节中，我将提出五个可显著扩展股票交易所功能的思路。它们按难度排序。\n\n#### 多机器人\n\n在我们的模拟中，我们只使用了一个机器人，所以基本上是在与自己交易，这毫无意义。你可以扩展订单的数据模式，新增一个名为`bot_id`或`investor_id`的字段，以便只有不同的机器人才能相互交易。\n\
  \n请注意，机器人的 ID 需要是一个有限的集合。你可以模拟套利场景，即一个机器人可以同时提交买入订单和卖出订单，以从价格波动中获利。\n\n#### 知情机器人\n\
  \n聪明的投资者不会盲目交易。他们需要了解当前的*市场价格*才能做出明智的决策。撮合引擎可以将最新价格发送给一个外部的*监控器*，这样每个机器人都能查看它。\n\
  \n#### 订单簿可视化\n\n`print_orderbook`方法还不够好。让我们用一个新的`visualize_orderbook`方法来替代它。你能把它做成动画吗？\n\
  \n#### 支持取消订单\n\n让我们支持订单取消功能。如果一个机器人请求取消订单（也许是通过一个名为`/cancel`的不同的*资源路径*），撮合引擎应该能够快速定位该订单，并将其从该价格对应的队列中移除。你能想到一种高效实现此功能的方法吗？\n\
  \n#### 支持止损订单\n\n既然已经支持取消订单，为什么不更进一步，支持止损订单呢？如果机器人提交了一个止损订单，撮合引擎只有在价格触及止损线时才会执行该订单。请自行研究，并高效、公平地为所有市场参与者实现此功能。\n\
  \n### 总结\n\n在本章中，我们研究了一个排队系统。这样的模拟不仅涉及技术层面，也涉及社会层面。撮合引擎应当基于一套规则来运行，以强制执行公平性。\n\n\
  ---\n\n# 第 7 章：石头、剪刀、布：多智能体模拟\n\n到目前为止，我们已经接触了多种不同类型的模拟。还有另一种非常重要的类型，称为基于智能体的模拟（ABS）。有时，它也被称为基于智能体的建模（ABM）。基于智能体的模拟是一个总称，你可以将许多特定于情境或特定领域的模拟归类为基于智能体的模拟。\n\
  \n这些模拟的共同点是，它们都模拟了所谓的自主智能体与环境之间的行动，最重要的是它们之间的交互。智能体只是一个能够采取行动的最小单元。环境是外部因素的集合，包括其他智能体。例如，如果你实现了第一个扩展（添加不止一个机器人），那么我们在第\
  \ 6 章中的股票交易所模拟就可以被视为一个基于智能体的模拟。不同的机器人根据撮合引擎设定的规则相互交互。不过，我们重点关注的是规则的实现。\n\n基于智能体的模拟对于理解*涌现行为*尤为重要，这意味着非平凡的现象可以从支配智能体行为的平凡规则中涌现出来。例如，由氨基酸形成大蛋白质分子的过程仍然是一个谜，尽管单个氨基酸看起来相当简单。在金融市场中，不同的投资者以最大化自身利益为目标行事。意图看似简单直接，但集体行为可能导致意想不到的崩盘。\n\
  \n现在让我们深入探讨。\n\n© 李荣鹏、中野爱一郎 2022\nR. Li and A. Nakano, *Simulation with Python*,\
  \ https://doi.org/10.1007/978-1-4842-8185-7_7\n\n### 街道上的社群形成\n\n首先，让我们从头构建一个最简单的基于智能体的模拟：谢林隔离模型。这是经济学家托马斯·谢林提出的模型。其思路很简单：在没有外部因素的情况下，一个区域中的人会根据他们与邻居的相似度，决定是搬离还是留在原地。最终，不同的社群会自发形成。\n\
  \n你可能已经注意到，这个思路与我们之前讨论的森林火灾渗流模型有共同特征。没错。它们都基于一个*网格*，并以*智能体*或*节点*作为改变状态的元素。然而，与森林火灾模型不同的是，在森林火灾模型中，一个预定义的概率控制着节点的行为；而在谢林模型中，人们会根据环境的变化动态地决定是搬离还是留下。\n\
  \n为了简单起见，我们在一维的“街道”上研究谢林模型，而不是二维的“社区”。问题的通俗描述如下：假设有一条街道，上面有*N*处出租房；其中一些有人居住，一些可以随时入住。我们假设更换住处没有成本。有两种人，*A*型和*B*型。两种人都喜欢和自己同类的人住在一起。如果他们两边的邻居都是不同类别的，他们就会选择一个无人居住的房子搬过去，直到大多数人对他们的邻居感到满意为止。\n\
  \n我们用一个`list`数据结构来模拟这条街道，并用`0`来表示某个位置/出租房无人居住。我们将用`-1`和`1`来表示一个被*A*组或*B*组人群居住的房子。请注意，选择这种表示法是为了可视化方便，因为我们可以通过散点图轻松检查聚类的形成。\n\
  \n第一个版本看起来很简单：\n\n```\nN = 300\nOCCUPATE_RATE = 0.9 # 初始时 90% 被占用\nAB_RATIO = 1\
  \ # A 与 B 的比例\nROUNDS = 100\n\nstreet = np.array([0 for _ in range(N)])\n\nfor idx,\
  \ house in enumerate(street):\n    if np.random.rand() < OCCUPATE_RATE:\n      \
  \  street[idx] = -1 if np.random.rand() < AB_RATIO/(1+AB_RATIO) else 1\n```\n\n\n\
  \n# 运行模拟直至没有移动或超过最大轮数\n\n`stable = False`\n\n`iteration = 0`\n\n`while not stable\
  \ and iteration < ROUNDS:`  \n    `print(\"starting round {}\".format(iteration))`\
  \  \n    `moves = 0`\n\n    # 获取空置房产  \n    `empties = set(i for i, house in enumerate(street)\
  \ if house == 0)`  \n    `for idx, house in enumerate(street):`  \n        `if idx\
  \ > 0 and idx < len(street)-1:`  \n            `if street[idx-1]*street[idx] ==\
  \ -1 and street[idx+1]*street[idx] == -1:`  \n                # 移动至随机空位  \n    \
  \            `target = np.random.choice(tuple(empties))`  \n                `empties.remove(target)`\
  \  \n                `empties.add(idx)`  \n                `street[target] = street[idx]`\
  \  \n                `street[idx] = 0`  \n                `moves += 1`  \n    `if\
  \ moves == 0:`  \n        `break`  \n    `iteration += 1`\n\n请注意，有几个参数可以调整。我们的住户居住的街道相当密集，因为\
  \ 90%的房产都有人居住。让我们先看看模拟开始前街道的样子，如图 7-1 所示。\n\n**图 7-1.** 模拟前的随机居住模式\n\n强烈的锯齿状表明 A\
  \ 组和 B 组正处于交错居住的状态。\n\n运行迭代，经过四轮后，系统达到稳定状态，如图 7-2 所示。\n\n**图 7-2.** 四轮迭代后的稳定居住模式\n\
  \n如您所见，出现了仅包含 A 组和 B 组的*街道段落*。\n\n如果我们将密度进一步提高到 98%的居住率会怎样？随着街道变得更加拥挤，住户更容易感到不满，聚集现象也会更加显著。\n\
  \n以下是一个随机生成的拥有 98%居住率的街道，如图 7-3 所示。\n\n**图 7-3.** 拥有 98%居住率的随机居住模式\n\n猜猜怎么着？强制执行的\
  \ 100 次迭代并不足够。即使经过数十万次迭代，街道仍在持续变化。住户们彼此憎恶，但却无处可去。图 7-4 是大约 10 万次迭代后的结果。\n\n**图 7-4.**\
  \ 拥有 98%居住率的不稳定居住模式\n\n让我们尝试另一种情景。假设住户只要*有一个*邻居来自不同群体就会感到不满，而不是*两个*都是。模拟会发生什么变化？直观上，我们应该会看到一条隔离程度更高的街道。如果我们从一条居住率为\
  \ 90%的街道开始，稳定的结果如图 7-5 所示。\n\n**图 7-5.** 针对“一个邻居不满”情况的稳定居住模式\n\n肉眼可见，更大的同质化社区出现了。这种*涌现*现象在基于智能体的模拟中很典型。每个智能体都独立行动，遵循仅涉及*局部*环境的简单规则。然而，*全局*模式却依然会涌现。\n\
  \n### 练习\n\n**原始谢林模型**\n\n在本练习中，请将我们的一维街道扩展为二维社区。这样也更接近谢林最初的模型。现在每个房产有八个邻居，并且我们多了一个可选参数：触发搬迁的不同邻居数量。运行您的模拟，并在一个\
  \ 10x10 的方格网格（居住率为 80%）上找到能引发显著隔离的参数。\n\n**三个群体**\n\n在一维和二维两种情况下，引入第三个群体并再次运行模拟。您预期会发生什么？隔离会更加显著还是减轻？\n\
  \n**如何赢得全球石头剪刀布比赛**\n\n有许多成熟的库可用于基于智能体的模拟/建模。对于 Python 来说，最流行且维护最活跃的一个库叫做`Mesa`。\n\
  \n`Mesa` 提供了一套用于基于智能体模拟的核心组件和调度策略。这使得快速原型开发和迭代成为可能。例如，我们可以定义一个*智能体*类和一个*环境*类并从中继承。每个智能体还可以根据不同的策略被*激活*。例如，在我们的谢林模型中，我们逐个激活智能体，这被称为*顺序激活*。\n\
  \n\n\n\n是否可能让一条街道上的住户同时做出决定？答案是肯定的，但实现起来会更棘手。我们需要预先识别所有当前空置和即将空置的房产，并同时将搬迁的住户分配给他们。\n\
  \n在这个示例中，让我们使用`Mesa`来模拟一个竞赛。十六位剪刀-石头-布大师聚在一起相互竞争。他们被排列成一个 4 乘 4 的网格，在每一轮中，他们的选择将与直接相邻的邻居（不包括对角线方向）进行比较。如果他们处于获胜方，则该轮获得\
  \ 1 分；如果失败，则得-1 分；如果出现平局，则所有人都得 0 分。\n\n![图 7-6 插图](img/index-128_1.png)\n\n**第\
  \ 7 章 剪刀、石头、布：多智能体模拟**\n\n那么，对于边界或角落的选手来说，这公平吗？简单来看，并不公平，因为他们拥有更少的邻居。然而，我们可以引入周期性边界条件（PBC）来使其公平。图\
  \ 7-6 是分子动力学中周期性边界条件的一个示例，其中一个分子在虚拟的邻近盒子里拥有自身的镜像。\n\n***图 7-6.** 分子动力学中的周期性边界条件*\
  \  \n周期性边界条件在分子动力学模拟中非常普遍。图 7-6 中的图像取自中野教授的讲义幻灯片。其基本思想是通过平移系统来创建*副本*，从而使系统在虚拟上无限大。\n\
  \n在我们的竞赛网格案例中，如果索引从 0 开始，位于右上角的选手`(0, 3)`将有两个普通邻居`(0,2)`和`(1,3)`，但它也会有位于`(0,0)`和`(3,3)`的两个*镜像*邻居。这一概念在图\
  \ 7-7 的可视化中进行了说明。\n\n![图 7-7 插图](img/index-129_1.png)\n\n**第 7 章 剪刀、石头、布：多智能体模拟**\n\
  \n***图 7-7.** 黄色选手与虚拟对手（绿色和蓝色）对战*  \n黄色点表示位于网格角落的选手，其*虚拟*的蓝色上邻居实际上是右下角的选手，而其*虚拟*的绿色右邻居是左上角的选手。角落选手依然拥有四个邻居，其中两个是虚拟的。边界选手也将拥有四个邻居，其中一个为虚拟。竞赛的公平性得以恢复。\n\
  \n参赛者被分为两种策略家：一组是固执型选手，他们很有可能坚持一个选择，偶尔会以较低概率改变，然后以高概率坚持新的选择。例如，如果某人开始时出布，那么该选手在下一轮有\
  \ 80%的概率坚持出布，然后分别以 10%的概率偶尔改变为剪刀或石头。一旦改变，该选手将以高概率坚持新的选择。他们完全不关心当前轮次的结果。我们称这一组为*固执型*参赛者。\n\
  \n另一组则试图通过心理博弈变得聪明。他们总是选择能够击败上一轮获胜招式的招数。例如，如果上一轮石头获胜，则他们会在当前轮次选择布，因为布击败了石头。如果上一轮没有胜者，他们将随机选择一个。他们的想法是，上一轮的获胜者会试图用相同的招式再次获胜，他们可以利用这一点。我们称这一组为*狡猾型*参赛者。\n\
  \n**第 7 章 剪刀、石头、布：多智能体模拟**  \n如你所见，这两种策略都相当天真。现在的问题是，如果有 8 个固执型和 8 个狡猾型参赛者，在网格上以交错模式排列，并且他们进行\
  \ 100 轮比赛，哪一组的平均得分会更高？\n\n首先，让我们看看`Mesa`代码通常是如何组织的：\n\n```python\nfrom mesa import\
  \ Model, Agent\nfrom mesa.time import SimultaneousActivation\n\nclass NewAgent(Agent):\n\
  \    def __init__(self):\n        pass\n    def step(self):\n        pass\n\nclass\
  \ NewModel(Model):\n    def __init__(self):\n        self.schedule = SimultaneousActivation(self)\n\
  \        pass\n    def step(self):\n        pass\n```\n\n从`Mesa`库中，我们导入两个要继承的类：`Model`和`Agent`。一个智能体（`Agent`）有一个`step`方法，该方法定义了智能体在模拟的每一轮中的行为。一个模型类（`Model`）也有一个`step`方法，它定义了模型作为一个整体在每一步中如何演化。\n\
  \n一个模型还有一个调度（`schedule`）实例。在本例中，它被称为`SimultaneousActivation`。此外，还有随机激活、顺序激活等。`SimultaneousActivation`策略意味着所有智能体将同时行动，这对于我们的竞赛模拟保持*公平*是必要的。\n\
  \n**第 7 章 剪刀、石头、布：多智能体模拟**  \n以下是我们的实际代码。让我们先看一些辅助类：\n\n```python\nfrom enum import\
  \ Enum\n\nclass Type(Enum):\n    STUBBORN = 1\n    SNEAKY = 0\n\nclass Move(Enum):\n\
  \    Scissors = 0\n    Rock = 1\n    Paper = -1\n\n    def __lt__(self, other):\n\
  \        if self == Move.Scissors and other == Move.Rock:\n            return True\n\
  \        if self == Move.Rock and other == Move.Paper:\n            return True\n\
  \        if self == Move.Paper and other == Move.Scissors:\n            return True\n\
  \        return False\n```\n\n我们为智能体类型及其选择的招式定义了两个枚举。在`Move`类中，我们定义了一个特殊的`__lt__`方法，用于控制如何比较两个`Move`实例。`__lt__`代表“小于”。如果比较运算符左侧的实例小于右侧的实例，则该方法返回`True`。\n\
  \n```python\nMove.Scissors < Move.Rock == True\nMove.Rock == Move.Paper == False\n\
  ```\n\n现在，让我们看一下`Agent`的代码：\n\n```python\nfrom mesa import Model, Agent\nfrom mesa.time\
  \ import SimultaneousActivation\nfrom mesa.space import SingleGrid\nfrom mesa.datacollection\
  \ import DataCollector\nimport random\n\nclass GameAgent(Agent):\n```\n\n**第 7 章\
  \ 剪刀、石头、布：多智能体模拟**\n\n```python\n    def __init__(self, unique_id, pos, model, contestant_type):\n\
  \        super().__init__(pos, model)\n        self.unique_id = unique_id\n    \
  \    self.pos = pos\n        self.contestant_type = contestant_type\n        self.scores\
  \ = []\n        self.score = 0\n        self.move = random.choice(list(Move))\n\n\
  \    def step(self):\n        self.score = 0\n        # find all neighbors\n   \
  \     neighbors = [neighbor for neighbor in self.model.grid.neighbor_\niter(self.pos)]\n\
  \        neighbor_moves = [neighbor.move for neighbor in neighbors]\n        self.score,\
  \ winning_move = GameAgent.calculate_score(self.move, neighbor_moves)\n\n      \
  \  # determine next move based on current score\n        if self.contestant_type\
  \ == Type.STUBBORN:\n            r = random.random()\n            if r < 0.8:\n\
  \                self.next_move = self.move\n            else:\n               \
  \ moves = list(Move)\n                moves.remove(self.move)\n                self.next_move\
  \ = random.choice(moves)\n        else:\n            # sneaky strategy\n       \
  \     if winning_move:\n                for move in list(Move):\n              \
  \      if move > winning_move:\n                        self.next_move = move\n\
  \                        break\n            else:\n                self.next_move\
  \ = random.choice(list(Move))\n```\n\n**第 7 章 剪刀、石头、布：多智能体模拟**\n\n```python\n  \
  \  def advance(self):\n        self.scores.append(self.score)\n        self.move\
  \ = self.next_move\n\n    @staticmethod\n    def calculate_score(move, all_moves):\n\
  \        # also return winning move\n        if len(set(all_moves + [move])) ==\
  \ 3 or len(set(all_moves +\n[move])) == 1:\n```\n\n\n\n\n# 没有必胜之招，这是一场平局\n\n`return\
  \ 0, None`\n\n`win = all(move > other_move or move == other_move for other_move\
  \ in all_moves)`\n\n`lose = all(move < other_move or move == other_move for other_move\
  \ in all_moves)`\n\n```\nif win:\n    return 1, move\nelif lose:\n    return -1,\
  \ random.choice(all_moves)\nreturn 0, None\n```\n\n一个智能体通过四个参数进行初始化。其中`model`参数是包含该智能体的模型。这一点很重要，因为不仅模型需要访问智能体的数据，智能体也需要访问模型的数据。这让智能体能够观察其周围的环境。例如，智能体需要识别它的邻居。\n\
  \n智能体的行动是随机初始化的。然而，根据智能体的类型，在每个回合中，智能体将选择**固执策略**或**狡猾策略**。具体细节在`step`方法中实现。不过，`next_move`仅在`step`方法中计算，但并未赋值。赋值操作在`advance`方法中完成。如果模型的激活策略是`SimultaneousActivation`，则必须使用该方法，这一点我们很快会看到。所有智能体会同时更新其状态，这保证了公平性。\n\
  \n`calculate_score`方法是一个静态方法。它独立于智能体类发挥作用，但在逻辑上与之相关联，因此我们将该方法设为静态。它计算一个回合的得分以及该回合的获胜行动。如果出现平局，获胜行动则为`None`。\n\
  \n## 第七章 石头、剪刀、布：多智能体模拟\n\n现在，让我们看一下模型类：\n\n```\nclass Contest(Model):\n\n    def\
  \ __init__(self, height=4, width=4, total_rounds = 100):\n        self.height =\
  \ height\n        self.width = width\n        self.total_rounds = total_rounds\n\
  \        self.round = 0\n        self.schedule = SimultaneousActivation(self)\n\
  \        self.grid = SingleGrid(width, height, torus=True)\n        self.datacollector\
  \ = DataCollector(\n            model_reporters={\"stubborn_avg_score\": lambda\
  \ self: np.mean([np.\n            mean(agent.scores) for agent in self.schedule.agents\
  \ if agent.\n            contestant_type == Type.STUBBORN]), \"sneaky_avg_score\"\
  : lambda self: np.mean([np.mean(agent.scores) for agent in self.schedule.\n    \
  \        agents if agent.contestant_type == Type.SNEAKY])},)\n        for idx, cell\
  \ in enumerate(self.grid.coord_iter()):\n            x = cell[1]\n            y\
  \ = cell[2]\n            if (x+y)%2 == 0:\n                agent = GameAgent(idx,\
  \ (x,y), self, Type.STUBBORN)\n            else:\n                agent = GameAgent(idx,\
  \ (x, y), self, Type.SNEAKY)\n            self.grid.position_agent(agent, (x, y))\n\
  \            self.schedule.add(agent)\n        self.running = True\n\n    def step(self):\n\
  \        self.schedule.step()\n```\n\n\n\n# 收集数据\n\n`self.round += 1`\n\n`if self.round\
  \ == self.total_rounds:`\n\n`self.running = False`\n\n`self.datacollector.collect(self)`\n\
  \n## 第七章：石头、剪刀、布：多智能体模拟\n\n我们的模型实例将用一个网格进行初始化。该网格的参数 `torus` 设为 true，这意味着启用了周期性边界条件。模型类还拥有一个数据收集器属性，用于在模拟过程中收集模型数据。\n\
  \n在这里，我们每轮结束后收集两类智能体的平均得分。这两个数据收集器被称为 `model_reporters`，其名称分别为 `stubborn_avg_score`\
  \ 和 `sneaky_avg_score`。您也可以定义 `agent_reporters` 来收集智能体层面的数据。\n\n数据收集发生在模拟每一轮结束后的\
  \ `step` 方法中。\n\n模型的初始化过程还将智能体以交替的方式放置到网格单元格中。请注意，智能体并非直接添加到模型中，而是通过我们之前讨论过的 `schedule`\
  \ 属性：即同步激活策略。\n\n现在，我们可以运行模拟 100 轮：\n\n```\nmodel = Contest(4, 4, 100)\n\nwhile\
  \ model.running:\n\n    model.step()\n```\n\n模型的数据收集器会收集全局平均值。运行结束后，数据收集器可以将结果以\
  \ pandas 数据框的形式输出：\n\n```\nmodel.datacollector.get_model_vars_dataframe()\n```\n\
  \n您应该会看到类似以下内容：\n\n```\nstubborn_avg_score  sneaky_avg_score\n0          -0.125000\
  \          0.000000\n1          -0.062500          0.000000\n2          -0.083333\
  \          0.000000\n3          -0.062500          0.031250\n4          -0.050000\
  \          0.025000\n...              ...               ...\n95         -0.011719\
  \          0.013021\n96         -0.011598          0.011598\n97         -0.011480\
  \          0.010204\n98         -0.012626          0.011364\n99         -0.016250\
  \          0.013750\n\n100 rows × 2 columns\n```\n\n我们运行的时间越长，智能体的 `scores` 列表积累的数据就越多。看起来在这一轮中，*狡猾*策略略胜一筹。这能令人信服吗？\n\
  \n再运行一次，我得到了以下结果：\n\n```\nstubborn_avg_score  sneaky_avg_score\n0           0.000000\
  \          0.000000\n1           0.000000         -0.062500\n2          -0.041667\
  \          0.000000\n3          -0.031250          0.000000\n4          -0.025000\
  \          0.050000\n...              ...               ...\n95          0.011719\
  \         -0.011719\n96          0.011598         -0.011598\n97          0.011480\
  \         -0.011480\n98          0.012626         -0.011364\n99          0.012500\
  \         -0.011250\n\n100 rows × 2 columns\n```\n\n嗯，这一次，*固执*策略似乎占了上风。\n\n探寻事实真相的任务就交给各位读者了。\n\
  \n### 练习\n\n1.  **更优策略**\n\n使用 4×4 网格，增加迭代次数，找出哪种策略表现更优。请注意，您可能需要更改数据收集器收集数据的频率。建议使用直方图等分布可视化方法来比较结果。\n\
  \n2.  **更大的网格**\n\n尝试在更大的网格上进行模拟，并将结果与较小的网格进行比较。您能尝试 5×5 的网格吗？\n\n### 本章小结\n\n在本章中，我们讨论了一种新型模拟：基于智能体的模拟（建模）。基于智能体的模拟之所以引人入胜，是因为它能够从支配局部智能体行为的简单规则中生成复杂模式。它被广泛应用于计算社会科学。我们还利用\
  \ Mesa Python 库对多智能体竞争进行了建模。\n\n---\n\n## 第八章：疾病传播，模拟 COVID-19 疫情\n\n自 2019 年底开始，一种最初在中国武汉发现的区域性呼吸道疾病迅速传播到全世界。数千万人受到感染，数十万人死亡。该疾病后来被世界卫生组织命名为\
  \ COVID-19。从 2021 年初开始，疫苗开始投入使用，这显著降低了感染者的死亡率。\n\n截至 2022 年初，COVID-19 与人类之间的战斗仍在继续。在本章中，我们将尝试使用数学模型来建模和模拟疾病传播。我们将学习微分方程的基础知识，并运行一些\
  \ Python 代码来模拟疫情的蔓延。\n\n### 简化现实世界\n\n在现实世界中，疾病传播是一个非常复杂的问题。不同的疾病有不同的病原体：病毒、细菌或其他微生物。它们有不同入侵宿主的途径。例如，COVID-19\
  \ 病毒主要通过空气传播，当感染者咳嗽或说话，而易感人群吸入携带病毒的颗粒时。病毒也可以在物体表面存活相当长的时间：如果另一个人接触了该表面，然后触摸自己的鼻子或眼睛，病毒也可以入侵新的宿主。其他病原体可以通过水或食物传播，例如各种寄生虫。某些病毒也可以通过血液传播，例如引起艾滋病的\
  \ HIV。\n\n© Rongpeng Li 和 Aiichiro Nakano 2022\nR. Li 和 A. Nakano，《使用 Python 进行模拟》，[`doi.org/10.1007/978-1-4842-8185-7_8`](https://doi.org/10.1007/978-1-4842-8185-7_8#DOI)\n\
  \n受感染人群内部也存在巨大的多样性。以 COVID-19 为例，年轻且免疫系统强健的人通常无需治疗即可康复。然而，对于有基础疾病的老年人来说，症状可能是致命的。一些感染者更倾向于户外活动，因此他们可能成为病毒传播源，而另一些人则可能选择待在室内。\n\
  \n在本章中，我们将尝试通过关注人群的划分以及病原体与人群之间的简化交互来对疾病传播进行建模。\n\n关于病原体-宿主相互作用途径和生物学动态的具体细节将被省略。\n\
  \n以下是主要假设：\n\n1.  世界上的总人口被分为三组：用 `S` 表示的`易感人群`，用 `I` 表示的`感染人群`，以及用 `R` 表示的`康复人群`。\n\
  \    a. 易感人群代表当前未受感染的人群。\n    b. 感染人群代表当前已感染并具有传染性的人群。\n    c. 康复人群代表在某个时间点对该疾病具有免疫力的人群。请注意，某些版本的模型会使用\
  \ `移除` 代替 `康复`，以包含死亡人口。\n\n2.  群体人口不是静态的，而是动态变化的。例如，易感人群可能被感染并变为感染人群。根据疾病的性质，人们可能会或不会产生免疫力。例如，对于由寄生虫引起的疾病，如果宿主在康复后再次接触病原体，疾病可能会复发。\n\
  \n3.  该模型用于模拟疫情爆发，因此许多潜在的量是固定的。例如，总人口的年龄结构是固定的，总人口也保持不变。\n\n总之，模型最基本的框架如下所示。一个易感者被感染，然后（希望如此）该人康复。\n\
  \n图 8-1 阐释了这种关系。\n\n***图 8-1.** 易感人群、感染人群和康复人群之间的关系*\n\n除了这种简单的轨迹之外，可能还有其他轨迹，这增加了系统的复杂性。然而，在深入研究这些之前，让我们先从一个更简单的模型开始：SI\
  \ 模型，即`易感-感染`模型。\n\n### SI 模型\n\nSI 模型没有`康复`类别；人们要么是易感者，要么是感染者。易感者可能被感染，感染者可能会康复。这种疾病通常不致命，死亡率很低，但它就是不会消失。图\
  \ 8-2 显示了易感人群和感染人群之间的双向关系。\n\n***图 8-2.** 易感人群和感染人群的人口迁移*\n\n从一个类别到另一个类别的变化取决于属于每个群体的人之间的互动。让我们用\
  \ `S(t)` 和 `I(t)` 来表示时间戳 `t` 时这两个群体的人口数量。经过一个时间步长后，比如一小时或一天（取决于我们选择哪种时间单位来定义时间域上的模块化），它们将如何变化？我将使用“天”作为时间单位，因为按天（而非按小时）收集统计数据更符合现实意义。\n\
  \n想象一个小型社区。在最开始时，有 `S(0)` 名易感者和 `I(0)` 名已感染者。每个易感者都有`机会`与任何一个感染者互动。这是一个组合问题。如果有五个易感者和四个感染者，那么理论上他们有\
  \ 20 种互动方式。\n\n严格来说，并非每次互动都会导致易感者被感染，因此存在一个比率。我们用 `α` 来表示这个比率。新感染的人数将是 `αSI`。\n\n\
  另一方面，感染者也有机会摆脱感染并再次变为易感者。这种变化独立于易感者-感染者之间的互动。我们为该过程分配一个比率 `β`。\n\n总而言之，这就是两个类别的人口数量随时间演化的方式：\n\
  \n`S(t + 1) = S(t) − αS(t)I(t) + βI(t)`\n\n`I(t + 1) = I(t) − αS(t)I(t) + βI(t)`\n\
  \n这两个方程被称为差分方程，因为我们是对数量的差异进行建模。这些方程的连续版本被称为微分方程，定义如下：\n\n`dS/dt = −αS(t)I(t) + βI(t)`\n\
  \n`dI/dt = −αS(t)I(t) + βI(t)`\n\n微分方程可以解析求解，但我们将重点放在差分方程上。\n\n请记住，总人口是固定的，因此我们可以进一步将两个差分方程简化为一个。我们用\
  \ `N` 表示总人口。该约束表明，对于任何时间 `t`，我们有 `N = S(t) + I(t)`。\n\n因此，我们可以将 `S(t+1)` 的表达式重写为：\n\
  \n`S(t + 1) = S(t) − αS(t)(N − S(t)) + β(N − S(t))`\n\n然后\n\n`S(t + 1) = αS(t)²\
  \ + (1 − αN − β)S(t) + βN`\n\n看起来足够直接了。现在让我们编写一些代码：\n\n```\nN = 1000\nbeta = 0.01\n\
  alpha = 0.001\n\nSs = [500]\nIs = [500]\nSteps = 20\n\nfor _ in range(Steps):\n\
  \    s = Ss[-1]\n    s = alpha*s*s + (1-alpha*N-beta)*s + beta*N\n    Ss.append(s)\n\
  \    Is.append(N-s)\n```\n\n让我们绘制易感人群和感染人群的追踪图。请注意，我们可能会得到浮点数，这是不可避免的。\n\n```\n\
  with plt.xkcd():\n    plt.scatter([i for i in range(Steps+1)], Ss, label = 'susceptible')\n\
  \    plt.scatter([i for i in range(Steps+1)], Is, label = 'infected')\n    plt.title(\"\
  高传染性疾病的 SI 模型\")\n    plt.xlabel(\"天数\")\n    plt.ylabel(\"群体规模\")\n    plt.legend()\n\
  ```\n\n图 8-3 中的结果显示，我们最终得到了一个几乎完全被感染的社区。\n\n***图 8-3.** 20 天后易感群体和感染群体的人口演化*\n\n\
  有两种方法可以降低感染人群的数量。我们可以尝试两种方法。\n\n第一种方法是限制感染者与易感者之间的传播：减少 `α`；另一种方法是增加 `β` 来治愈感染人群。让我们看看它们如何影响人口演化曲线。\n\
  \n首先，让我们将 `α` 改为原来的十分之一：`alpha = 0.0001`。\n\n看起来我们成功地*延迟*了疾病的传播！请注意，我将时间范围延长到了 100\
  \ 天，以便在图 8-4 中看到全貌。\n\n***图 8-4.** 人口演化*\n\n嗯，这就是 *居家令* 或 *封锁* 政策背后的理念。如果人们限制面对面互动以降低传播率，病毒传播速度就会慢得多。\n\
  \n如果我们进一步降低 `α` 呢？将 `α` 设为 `0.00002` 怎么样？你会发现人口根本没有变化，如图 8-5 所示。\n\n***图 8-5.**\
  \ 临界参数达到平衡*\n\n简单计算表明，当 `α` 和 `β` 的值处于*临界*状态时，两个群体之间的转移将达到平衡状态：易感者转变为感染者的人数*恰好*等于感染者转变为易感者的人数。\n\
  \n### 练习\n\n1.  如果我们进一步限制人们的互动呢？你能验证疾病是否会真正消失吗？\n2.  操控 `β` 的值，并检查其对人口演化的影响。\n3.\
  \  改变两个群体的初始人口。如果开始时只有少数几个感染者，与感染者较多的情况相比，最终状态会改变吗？你能识别比率 `αS(0)/β` 的重要性吗？\n\n###\
  \ SIR 模型\n\n现在，让我们更进一步，加入`康复`群体。`康复`的定义稍后可以进一步扩展。但是，目前我们先假设让人们`康复`只有一种可能途径：被感染，然后康复并获得免疫力。\n\
  \n我们引入另一个变量 `R(t)` 来表示康复的总人数。\n\n它遵循以下差分方程。我们有一个用 `γ` 表示的`康复率`。康复的人将拥有*永久*免疫力。\n\
  \n`R(t + 1) = R(t) + γI(t)`\n\n因此，我们社区人口的约束变为：\n\n`N = S(t) + I(t) + R(t)`\n\n让我们从一个很小的\
  \ `γ` 开始，并且没有康复人口。你期望看到什么？\n\n代码与我们之前使用的非常相似，但这次我们将显式更新三个群体：\n\n```\nN = 1000\n\
  beta = 0.01\nalpha = 0.0001\ngamma = 0.0001\n\nSs = [500]\nIs = [500]\nRs = [0]\n\
  Steps = 50\n\nfor _ in range(Steps):\n    s, i, r = Ss[-1], Is[-1], Rs[-1]\n   \
  \ s_next = s - alpha*s*i + beta*i\n    i_next = i + alpha*s*i - beta*i - gamma*i\n\
  \    r_next = r + gamma*i\n    Ss.append(s_next)\n    Is.append(i_next)\n    Rs.append(r_next)\n\
  \nwith plt.xkcd():\n    plt.scatter([i for i in range(Steps+1)], Ss, label = 'susceptible')\n\
  \    plt.scatter([i for i in range(Steps+1)], Is, label = 'infected')\n    plt.scatter([i\
  \ for i in range(Steps+1)], Rs, label = 'recovered')\n    plt.title(r\"小$\\gamma$下的\
  \ SIR 模型\")\n    plt.xlabel(\"天数\")\n    plt.ylabel(\"群体规模\")\n    plt.legend()\n\
  ```\n\n如图 8-6 所示，在 50 步之后，康复群体并没有显著增加。\n\n***图 8-6.** 康复人口保持不变*\n\n为什么？因为我们依赖的是*自然免疫力*，它的特征就是\
  \ `γ` 值很小。\n\n然而，请注意，获得免疫的人将永远保持免疫状态；最终，社区中的每个人都会安全。这需要多长时间？我将这个问题留给你，但我的发现是，要使大约一半的人口（500\
  \ 人）获得免疫，需要超过 20 年。结果如图 8-7 所示。\n\n***图 8-7.** 实现自然群体免疫的漫长征程*\n\n现在，我们可以引入什么？答案是疫苗接种！如果我们能够将易感人群转化为`康复`状态，那么所谓的*群体免疫*状态就可以更快实现！请注意，这里的`康复`一词已不再按字面意思定义。\n\
  \n我们该怎么做呢？假设在任何时间点，大约有 2% 的易感人群愿意接种疫苗，那么我们就更有可能控制疾病的传播。我们将相关参数命名为 `μ`。\n\n`R(t +\
  \ 1) = R(t) + γI(t) + μS(t)`\n\n让我们看看这将如何影响我们的模拟，如图 8-8 所示。\n\n***图 8-8.** 疫苗接种增强免疫力*\n\
  \n不错，对吧？仅在 100 天内，我们就让大约四分之一的总人口获得了免疫。\n\n如果人群中有更高的疫苗接种意愿呢？假设 5% 的易感人群想要接种疫苗。结果非常有希望，如图\
  \ 8-9 所示。\n\n***图 8-9.** 更强的疫苗接种将加速群体免疫*\n\n结果更加令人印象深刻；我们在 100 天内让一半的人口获得了免疫。\n\n\
  ### 练习\n\n1.  存在一种可能性：已接种疫苗的人可能再次变得易感。你能模拟这种现象吗？这将如何影响群体免疫的进程？\n2.  死亡将如何影响我们的模型？进一步将`康复`群体划分为*真正*的康复群体和不幸的死亡群体，并解释模拟行为将如何变化。\n\
  \n### 本章小结\n\n在本章中，我们模拟了大流行爆发期间不同群体之间的互动。我们简化了病原体传播过程的假设，并介绍了易感-感染（SI）模型和易感-感染-康复（SIR）模型。通过模拟，我们可以清楚地看到不同因素如何影响病毒传播过程，以及疫苗接种如何帮助社区达到群体免疫。\n\
  \n---\n\n## 第九章：错误信息传播与图上的模拟\n\n在 COVID-19 时代，错误信息从未如此致命。在 Twitter 和 Facebook 等社交网络上，关于病毒起源、治疗方法和疫苗接种的阴谋论猖獗蔓延。它们常常在社区和圈子里传播，并与美国总统大选相关的其他阴谋论相互呼应。这种错误信息和阴谋论相互加强，形成了一个密不透风的*回音室*。\n\
  \n错误信息（Misinformation）和虚假信息（Disinformation）非常相似。区别在于，虚假信息是为了欺骗而故意传播的虚假信息。换句话说，虚假信息是*蓄意*的错误。错误信息是虚假信息的超集。\n\
  \n错误信息的传播者可能并未意识到错误信息的错误性或危害性。在本章中，我们将研究错误信息如何在网络/图设置下传播。\n\n### 建模社交网络\n\n我们之前已经研究过一些类似网络的系统，例如马尔可夫模型的状态转换和森林火灾蔓延模型。在诗歌生成的马尔可夫模型中，我们将每个单词视为一个节点，并且每个节点都有一定的概率后接另一个词，从而形成一个带有*有向*边的词语网络。\n\
  \n© Rongpeng Li 和 Aiichiro Nakano 2022\nR. Li 和 A. Nakano，《使用 Python 进行模拟》，[`doi.org/10.1007/978-1-4842-8185-7_9`](https://doi.org/10.1007/978-1-4842-8185-7_9#DOI)\n\
  \n在森林火灾蔓延模型中，每一棵树在方形网格上都有四个最近的相邻树。火可以以预定的概率从一棵树蔓延到另一棵树。这个网络在某种程度上是同质的，因为它们（除了边界上的树）都有四个邻居，并且没有任何一棵树在任何方面比其他树特殊。\n\
  \n在本章中，我们将研究*通用*网络，它可以表示任意社区的连接性。让我们先介绍一些术语。\n\n到目前为止，我在本章中一直在互换使用“网络”和“图”。它们的定义差异通常取决于背后的科学领域。例如，有时人们在网络中会使用*链接*（links）而不是*边*（edges），但它们本质上代表同一事物。为了与其他文献保持一致，我将在以下内容中使用“图”。\n\
  \n一个图由*节点*和*边*组成。例如，图 9-1 有五个节点和六条边。\n\n***图 9-1.** 一个包含五个节点和六条边的简单图*\n\n图 9-1 中的图也是一个*连通*图，因为你可以通过遍历边从任意一个节点到达任意另一个节点。情况并非总是如此。图\
  \ 9-2 中的图是一个不连通图。\n\n***图 9-2.** 一个不连通图的例子*\n\n这个图有五个不连通的*团簇*（也称为*社区*）。它们之间没有通过边连接。\n\
  \n一个常见的误解是*子图*的定义。从一个图中取出的任何节点和边的子集都会形成一个子图。这些节点和边在*视觉上*可能不形成一个*团簇*。例如，在前面那个有五个团簇的图中，节点\
  \ 1 形成了一个单节点子图，而节点 1、2、3 和 6 以及节点 2 和 6 之间的边也形成了一个四节点子图，尽管它在视觉上是三个互不连通的团簇，看起来很奇怪。\n\
  \n图的边也可以是有方向的，这使图成为*有向图*。例如，Twitter 的关注关系就是一种有向关系。你可能关注一位明星，但这位明星不太可能回关你。如果两个 Twitter\
  \ 账号互相关注，那么它们之间必须存在*两条*边来表示这种关系：一条从一个指向另一个，另一条反向。我们将这种允许节点之间存在多条边的图称为*多重图*。通常，多重图表示有向关系，但并非总是如此。\n\
  \n图 9-3 是一个有向多重图。边是有方向的，并且允许多条边存在。例如，节点 2 和 3 之间有两条边。另一个有趣的边是*自环*边，它指向节点自身，例如节点\
  \ 0、1 和 2。通过适当的建模，自环可以表示推文的自我转发或类似的行为。\n\n***图 9-3.** 一个带有自环的有向图*\n\n节点和边也可以有属性。例如，节点可以有权重，表示它们在图中的影响力大小，而边的权重可以表示两个节点之间联系的强弱。为了对社交网络进行建模，我们需要为图元素分配某些属性，这些属性可以是固有的，也可以是计算得来的。\n\
  \n让我们使用图来定义我们的社交网络，特别是 Twitter 生态系统。\n\n每个节点代表一个账户，每条边代表一个关注关系。因此，信息可以通过发布推文从被关注者流向关注者。\n\
  \n想想 Twitter 账户的属性。一个账户影响力的最重要指标是关注者数量；在我们的例子中，这正好是出边的数量。在图论中，它有一个名字：*出度*，即出边的数量。类似地，*入度*计数入边的数量。出度越大，社交网络上可能受到影响的账户就越多。\n\
  \n我们还希望借鉴前一章的一些概念。我们将节点分为三类，除了错误信息的来源之外，类似于*易感、感染和康复*模型。易感者是尚未接触过错误信息的账户；如果他们关注的人中是错误信息的来源或已感染者，他们就有被感染的概率。感染节点类似于疾病传播模拟中的感染患者，他们通过转发和分享错误信息来积极影响其关注者。*康复*节点是指那些要么天生抵制（`R`\
  \ 既可表示*抵制（resistance）*，也可表示*康复（recovered）*）错误信息，要么从错误信息污染中恢复过来的账户。\n\n总之，我们使用表 9-1\
  \ 中的属性来描述图上的一个节点。\n\n**表 9-1.** 社交网络中节点/账户的属性\n\n| 名称        | 描述              \
  \                             | 可能的值                     | 是否可变 |\n|-------------|-------------------------------------------------------|-------------------------------------|------------|\n\
  | 状态       | 节点的状态                                 | \"来源\"、\"易感\"、\"感染\"或\"康复\"\
  \ | 是        |\n| 影响力   | 节点的影响力大小，通过出度衡量 | 非负整数               | 否*        |\n|\
  \ 抵抗力  | 账户对错误信息的抵抗能力   | 介于 0 和 1 之间的值             | 是        |\n\n*影响力*是不可变的，因为我们的社交网络不是动态的。如果我们允许在模拟过程中关注者-被关注者关系发生变化（这更加现实），那么如果一个账户的关注者越来越少，其影响力就会改变。\n\
  \n现在，我们已经布置好了所有静态设置。下一步是定义控制模拟的机制。\n\n### 模拟错误信息传播\n\n模拟开始时，少数几个节点（很可能是恶意的）开始传播错误信息。它们的易感追随者将响应错误信息并做出反应。这些追随者可能变为感染者，也可能保持易感状态。如果一个追随者变为感染者，该追随者的追随者也将暴露在错误信息中，依此类推。\n\
  \n在任何时候，易感节点都有机会康复。\n\n模拟中的概率也是动态的。例如，如果一个节点暴露于多个错误信息来源，那么它们被感染的可能性就会变得非常高，而康复的可能性则会受到强烈抑制。\n\
  \n### 简单案例\n\n让我们从一个简单的案例开始，如图 9-4 所示，只有五个节点来测试我们代码的准确性。该图看起来像图 9-4。请注意，节点 `0` 和\
  \ `1` 互相关注。\n\n***图 9-4.** 一个包含五个节点的有向图*\n\n以下是生成该图的代码：\n\n```\n"
- "# 生成图的代码在此处\n```\n\n\n\n# `import networkx as nx`\n\n# `import matplotlib.pyplot\
  \ as plt`\n\n```\nfig, ax = plt.subplots()\nsg = nx.fast_gnp_random_graph(n=5, p=0.2,\
  \ seed=3, directed=True)\npos = nx.spring_layout(sg, seed=5)\nnx.draw_networkx_nodes(sg,\
  \ pos, ax=ax)\nnx.draw_networkx_labels(sg, pos, ax=ax, font_weight='bold')\nnx.draw_networkx_edges(sg,\
  \ pos, ax=ax, edgelist=sg.edges())\n```\n\n`Networkx` 是一个用于操作图的强大 Python 库。它的语法相当直观。上述代码中唯一不太直观的方法是\
  \ `fast_gnp_random_graph`。这是一个内置的图生成器，在本示例中，它生成 `5` 个节点，并以 `20%` 的概率任意连接每一对节点。你也可以选择生成有向图，并设置随机种子以确保结果可复现。我选择名称\
  \ `sg`，是因为它确实是一个*小*图。\n\n我们可以通过运行以下代码来检查图的节点和边：`sg.nodes`、`sg.edges`\n\n结果会返回两个有序的可迭代对象：\n\
  \n```\n(NodeView((0, 1, 2, 3, 4)),\n OutEdgeView([(0, 1), (1, 0), (1, 3), (2, 3),\
  \ (3, 4), (4, 0), (4, 1)]))\n```\n\n我们还可以检查特定节点的邻居：\n\n```\nlist(sg.neighbors(1))\n\
  ```\n\n对于节点 `1`，代码返回节点 `0` 和 `3`。节点 `4` 未被返回，因为 `neighbors` 方法仅返回*后继节点*。在社交网络的语境中，这意味着我们只查看节点\
  \ `1` 的关注者。\n\n为了查看包括被关注者在内的所有邻居，我们使用：\n\n```\nlist(nx.all_neighbors(sg, 1))\n```\n\
  \n这将返回 `[0, 4, 0, 3]`；之所以有重复项，是因为节点 `0` 和 `1` 之间的关系是*双向的*。我们可以轻松地使用集合操作来去重。\n\n\
  最后一个关于 networkx 的知识点是属性的使用。图中的每个节点和边都可以拥有属性。例如，以下代码将为节点 `1` 赋予一个属性名 `attr1_1` 并赋值。这对于更新社交网络账户的属性非常方便。\n\
  \n```\nsg.nodes[1][\"attr_1\"] = \"val_1\"\n```\n\n首先，让我们定义一些有用的数据结构：\n\n```\nclass\
  \ State(Enum):\n    SOURCE = 0\n    SUSCEPTIBLE = 1\n    INFECTED = 2\n    RECOVERED\
  \ = 3\n\nSTATE2COLOR = {\n    State.SOURCE: \"red\",\n    State.SUSCEPTIBLE: \"\
  grey\",\n    State.INFECTED: \"orange\",\n    State.RECOVERED: \"green\"\n}\n```\n\
  \n现在，我们可以如下初始化简单五节点图的属性：\n\n```\nimport numpy as np\nnp.random.seed(1)\n\nfor node\
  \ in sg.nodes:\n    sg.nodes[node][\"influence\"] = len(list(sg.neighbors(node)))\n\
  \    if node == 4:\n        sg.nodes[node][\"state\"] = State.SOURCE\n        sg.nodes[node][\"\
  resistance\"] = 0\n    else:\n        sg.nodes[node][\"state\"] = State.SUSCEPTIBLE\n\
  \        sg.nodes[node][\"resistance\"] = np.random.random()\n```\n\n现在，我们可以用颜色表示账户初始状态来绘制该图。如字典\
  \ `STATE2COLOR` 所示，红色代表错误信息的来源。\n\n图 9-5 显示了错误信息的来源。\n\n**图 9-5.** 错误信息来源以红色显示\n\
  \n为了模拟一步内同时更新状态，我们需要：\n\n1. 更新每个节点的状态，并将状态保存到图的副本中\n2. 将状态复制回原图\n3. 重复步骤 1 和步骤 2\n\
  \n以下是每次迭代的代码框架：\n\n```\nfor _ in range(5):\n    sg_copy = sg.copy()\n    for node\
  \ in sg.nodes:\n        update_state(sg, sg_copy, node)\n    # 复制状态\n    for node\
  \ in sg.nodes:\n        sg.nodes[node][\"state\"] = sg_copy.nodes[node][\"state\"\
  ]\n```\n\n所有属性更新的细节都在函数 `update_state` 中。相关逻辑可以进一步扩展，但这里是第一版：\n\n```\ndef update_state(sg,\
  \ sg_copy, node):\n    # 在 sg_copy 中更新状态以实现同步更新\n    successors = set(sg.neighbors(node))\n\
  \    predecessors = set(nx.all_neighbors(sg, node)) - successors\n    state = sg.nodes[node][\"\
  state\"]\n    if state == State.SOURCE:\n        return\n    elif state == State.RECOVERED:\n\
  \        if sg.nodes[node][\"resistance\"] > np.random.random():\n            sg.nodes[node][\"\
  resistance\"] = min(\n                sg.nodes[node][\"resistance\"] * 2,\n    \
  \            sg.nodes[node][\"resistance\"] + np.random.random(),\n            \
  \    1\n            )\n        else:\n            sg_copy.nodes[node][state] = State.SUSCEPTIBLE\n\
  \    elif state == State.SUSCEPTIBLE:\n        source_influenced = State.SOURCE\
  \ in [\n            sg_copy.nodes[pre][\"state\"] for pre in predecessors\n    \
  \    ]\n        infected_influenced = State.INFECTED in [\n            sg_copy.nodes[pre][\"\
  state\"] for pre in predecessors\n        ]\n        if source_influenced or infected_influenced:\n\
  \            if sg.nodes[node][\"resistance\"] < np.random.random():\n         \
  \       sg_copy.nodes[node][\"state\"] = State.INFECTED\n    elif state == State.INFECTED:\n\
  \        # (内容继续)\n```\n\n\n\n# 感染者有机会转为恢复者\n\n```\nif sg.nodes[node][\"resistance\"\
  ] > np.random.random(): sg_copy.nodes[node][\"state\"] = State.RECOVERED\nelse:\n\
  sg.nodes[node][\"resistance\"] = max(sg.nodes[node]\n[\"resistance\"]/2, sg.nodes[node][\"\
  resistance\"] - np.random.\nrandom())\nelse:\nprint(\"Unsupported state, exit.\"\
  )\n```\n\n我们的逻辑基于对社交媒体上账户行为的观察。信息来源总是试图影响其关注者。如果易感者的抵抗力小于某个随机数，他们就会被感染。\n\n对于感染者，通过比较随机数，有机会转为恢复者；但如果失败，其抵抗力将减半或减去一个随机数，取两者中的较大值。\n\
  \n对于恢复者，每轮若抵抗力大于随机数，则增强抵抗力，最高可达 100%免疫；否则，该人将回落至易感状态。\n\n我们已经看到了初始状态，但还需要留意抵抗力数值：\n\
  \n```\n{node: sg.nodes[node][\"resistance\"] for node in sg.nodes}\n```\n\n```\n\
  {0: 0.417022004702574,\n1: 0.7203244934421581,\n2: 0.00011437481734488664,\n3: 0.30233257263183977,\n\
  4: None}\n```\n\n接下来，我们逐步探索系统。根据随机数种子的不同，你的结果可能与我不同。经过四轮迭代后，我的网络如图 9-6 所示。抵抗力数值保持不变，但账户*0*相信了账户*4*推送的故事。图\
