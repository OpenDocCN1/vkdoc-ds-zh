- "# 十四行诗预处理\n\n```\nimport string\nimport nltk\nfrom nltk.stem.wordnet import WordNetLemmatizer\n\
  # nltk.download('wordnet')\nlemmatizer = WordNetLemmatizer()\n```\n\n## 第 2 章 马尔可夫链，窥探未来\n\
  \n```\nsonnet_path = \"../../code_examples/chap2/sonnet.txt\"\nwith open(sonnet_path,\
  \ \"r\") as fp:\n    sonnets = fp.readlines()\nsonnets = [sentence.strip().lower().replace(\"\
  's\", \"\") for sentence in sonnets if sentence != \"\\n\"]\nsonnets = [\"\".join([char\
  \ for char in sentence if char not in string.punctuation]) for sentence in sonnets]\n\
  ```\n\n请注意，你可能需要取消注释 `wordnet` 下载行来下载额外数据。`sonnets` 变量是一个句子列表。我们通过仅处理小写字母并忽略像 *beauty’s*\
  \ 这样的标点符号（它变为 *beauty*）来简化问题。\n\n现在，让我们构建一个 `defaultdict`，用于存储每个词到其后面出现在 `sonnets`\
  \ 中的词的出现次数。这种词对也被称为*二元组*。\n\n```\nfrom collections import defaultdict\ntransition_dict\
  \ = defaultdict(lambda: defaultdict(int))\nfor sentence in sonnets:\n    words =\
  \ list(filter(lambda x: len(x.strip()) > 0, sentence.split(\" \")))\n    words_pairs\
  \ = [(lemmatizer.lemmatize(words[i]), lemmatizer.lemmatize(words[i+1])) for i in\
  \ range(len(words)-1)]\n    for (word_from, word_to) in words_pairs:\n        transition_dict[word_from][word_to]\
  \ += 1\n```\n\n在使用 `transition_dict` 生成句子之前，我们先来看看这些二元组的路径。以下可视化通过边的宽度来表示二元组的频率。由于无法显示所有边，我们使用\
  \ `count_threshold` 变量来控制一个词可以有多少条转移边来连接到下一个词：\n\n```\n# sonnet\nfrom graphviz import\
  \ Digraph\ncount_threshold = 10\n# dot, fdp, neato, circo, twopi, and osage.\nG\
  \ = Digraph('G', format='png', engine='neato')\nfont_size = \"300\"\n```\n\n![](img/index-46_1.png)\n\
  \n## 第 2 章 马尔可夫链，窥探未来\n\n```\nG.attr('graph', pad='1', ranksep='1', nodesep='1')\n\
  G.attr('node', shape='circle', fixedsize='true')\nG.attr(overlap=\"false\")\nfor\
  \ word_from in transition_dict.keys():\n    for word_to in transition_dict[word_from].keys():\n\
  \        lw = transition_dict[word_from][word_to]\n        if lw > count_threshold:\n\
  \            G.edge(word_from, word_to, penwidth=str(lw*0.1), label=str(lw))\nG.view(\"\
  sonnet\")\n```\n\n结果看起来像一个巨大的蜘蛛网，如图 2-7 所示。\n\n***图 2-7.** 词与词之间的转移关系*\n\n你可以尝试调整边阈值的数值。你将能看到更多精细结构，但代价是更多的边重叠。\n\
  \n现在，我们可以使用 `transition_dict` 来生成一个句子。以下是一个示例：我从 `i` 开始，不断往句子中添加词，直到 `transition_dict`\
  \ 中没有匹配项为止：\n\n```\ndef sample_according_to_value(to_dict: dict):\n```\n\n\n\n"
- "# 返回与频次值对应的键\n\n```\nkeys, freqs = [],[]\nfor key,val in to_dict.items():\n   \
  \ keys.append(key)\n    freqs.append(val)\nfreqs = np.array(freqs)\nfreqs = freqs/sum(freqs)\n\
  return np.random.choice(keys,p=freqs)\n```\n\n```\ndef generate_sentence(start_word\
  \ = \"i\", transition_dict = transition_dict, hard_limit = 14):\n    word = start_word\n\
  \    sentence = []\n    while word in transition_dict and len(sentence) < hard_limit:\n\
  \        sentence.append(word)\n        word = sample_according_to_value(transition_dict[word])\n\
  \    sentence.append(word)\n    return \" \".join(sentence)\n```\n\n`generate_sentence()`\n\
