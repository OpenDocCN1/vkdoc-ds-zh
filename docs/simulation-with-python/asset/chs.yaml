  \n### 总结\n\n我们继续了利用随机性进行模拟的旅程。我们研究了马尔可夫链模型并学习了其背后的数学原理。我们将马尔可夫模型应用于天气预报、吸收态案例以及十四行诗写作。\n\
  \n## 第三章 多臂老虎机、概率模拟与贝叶斯统计\n\n鲍勃于黄昏走进一家赌场。他今晚想尽最大努力试试运气。他开始玩一种简单直接的老虎机游戏：三个相同符号出现，你便获胜。大厅里有三台不同的机器，鲍勃有\
  \ 100 美元可供挥霍。\n\n鲍勃知道这些机器的中奖概率不同，且每次拉杆将花费他 1 美元。现在的问题是，为鲍勃找到最佳的中奖策略。\n\n老虎机也被称为单臂匪徒。这个问题也被称为经典的*多臂老虎机*问题。\n\
  \n让我们先考虑极端情况。如果我们有很多钱，我们可以在每台机器上花大价钱，以获得对中奖概率的良好估计，对吗？没有投入，就没有收获。如果我们钱很少，我们无法在每台机器上投入大量资金，因此只能依靠运气死磕一台曾经赢过钱的机器，并希望它表现不至于太差。\n\
  \n职业赌徒筹码的深度是决定其策略的巨大因素。口袋深的赌徒可以通过下高风险赌注来压制对手。然而，口袋浅的赌徒承受不起这种风险，这导致他们采取防守型玩法，或者有时孤注一掷地全押。\n\
  \n© 李荣鹏 与 A. 中野 2022\nR. Li 与 A. Nakano，《使用 Python 进行模拟》，[`doi.org/10.1007/978-1-4842-8185-7_3`](https://doi.org/10.1007/978-1-4842-8185-7_3#DOI)\n\
  \n### 随机选择与朴素贪心方法\n\n现在，让我们考虑更一般的情况，并用数学方式阐述问题。\n\n假设我们有 *K* 台机器，并用 *i* 作为索引。每台机器的中奖概率记为\
  \ *pi*。为简单起见，可以假设 *pi* 值各不相同，因此不存在等效的机器。我们的目标是，在所有 *N* 次拉杆之后，获得最高的期望中奖次数。\n\n理想情况是什么？当然，如果我们知道哪台机器的中奖概率最高，我们希望只玩那台中奖概率最高的机器\
  \ *p*∗ = *max* (*pi*)。在理想情况下，我们可以定义一个所谓的遗憾函数：\n\n`*r* = *Np*∗ − Σ(*p*(*t*))` 对于\
  \ `*t* = 1` 到 `*N*`\n\n这里，`*p*(*t*)` 是鲍勃在时间步 *t* 所玩机器的中奖概率。\n\n如果我们能识别出最优机器并坚持玩它，我们将完全没有遗憾，即\
  \ `*r* = 0`。然而，如果我们一直玩最差的机器，遗憾函数的最大可能值将是 `*r* = *N*(*p*∗ − *min*(*pi*))`。在鲍勃的例子中，`*N*\
  \ = 100` 且 `*K* = 3`。\n\n让我们为遗憾函数建立一个基准线。假设鲍勃是个简单的人，因此他用两种简单策略之一来玩游戏：\n\n1.  鲍勃每次随机选择一台机器，无论其表现如何。\n\
  2.  鲍勃每台机器玩十次，并计算中奖概率。然后，他坚持使用中奖概率最高的机器，并根据游戏结果更新统计数据。换句话说，鲍勃是*贪婪的*。\n\n让我们用中奖概率\
  \ `p1 = 0.5`, `p2 = 0.3`, `p3 = 0.2` 来模拟这种大胆的策略：\n\n```\ndef cal_simple_random_regret(N\
  \ = 100, probs = [0.5, 0.3, 0.2]):\n    regret = max(probs)*N - sum(np.random.choice(probs)\
  \ for t in range(N))\n    return regret\n\ncal_simple_random_regret()\n```\n\n我首次尝试时，遗憾函数的值大约为\
  \ *14.6*。我们来看看 1000 次试验的结果分布：\n\n```\ntrials = 1000\nwith plt.xkcd():\n    fig,\
  \ ax = plt.subplots(figsize=(8,6))\n    plt.hist([cal_simple_random_regret() for\
  \ _ in range(trials)], label=\"遗憾值\", bins=20)\n    ax.set_title(\"随机选择老虎机时的遗憾函数分布\"\
  , fontsize=20)\n    plt.legend()\n    fig.savefig(\"random_slot_machine.jpg\")\n\
  ```\n\n该分布如下图所示，如图 3-1 所示。\n\n***图 3-1.** 随机选择的遗憾函数分布*\n\n遗憾值似乎在 *16.5* 左右。\n\n\
  现在，让我们检验第二种策略：鲍勃在初始的 30 次拉杆（用于估算中奖概率）之后，坚持使用中奖概率最高的机器。该策略专注于在初始的*探索*阶段之后，对已知的最佳选择进行*利用*。\n\
  \n首先，我将定义一个名为 `Record` 的*数据类*，用于存储每台机器的记录信息：\n\n```\nfrom dataclasses import dataclass\n\
  \n@dataclass\nclass Record:\n    total:int\n    win:int\n\n    def cal_ratio(self):\n\
  \        return self.win/self.total\n\n    def update(self, prob):\n        self.total\
  \ += 1\n        self.win += np.random.random() < prob\n```\n\n然后，我们使用贪心方法计算遗憾函数：\n\
  \n```\ndef cal_greedy_regret(N = 100, probs = [0.5, 0.3, 0.2], evaluation_step =\
  \ 10):\n    K = len(probs)\n    Records = [Record(0,0) for _ in range(K)]\n```\n\
  \n\n\n"
- "# 初始评估步骤\n\n```\nfor i in range(K):\n    Records[i].total = evaluation_step\n \
  \   Records[i].win = np.sum([np.random.random() < probs[i] for _ in range(10)])\n\
  ```\n\n"
- "# 获取当前表现最优的老虎机索引\n\n```\nslots_trajectory = []\nslot_index = np.argmax([record.cal_ratio()\
  \ for record in Records])\nslots_trajectory.append(slot_index)\n\nfor i in range(N\
  \ - evaluation_step * K):\n    # 进行剩余 80 轮游戏\n    Records[slot_index].update(probs[slot_index])\n\
  \    slot_index = np.argmax([record.cal_ratio() for record in Records])\n    slots_trajectory.append(slot_index)\n\
  ```\n\n```\n# print(Records)\nreturn max(probs)*N - sum([Records[i].total*probs[i]\
  \ for i in range(K)]), slots_trajectory\n```\n\n![](img/index-54_1.png)\n\n## 第\
  \ 3 章 多臂老虎机、概率模拟与贝叶斯统计\n\n此处，我同时返回了遗憾值和老虎机轨迹，即最后 70 次对老虎机的选择。\n\n如果你运行这段代码，你会看到一个典型的遗憾值\
  \ `5`。读者可以暂停阅读，思考其中原因。\n\n在探索阶段，第一台老虎机很有可能会给你比第二台和第三台更高的获胜概率，因此我们从第一台老虎机开始并一直使用它。这样，我们将在\
  \ 1 号老虎机上玩 `80` 次，在 2 号和 3 号老虎机上各玩 `10` 次。所以遗憾值为 `r = 0.5 * 100 - 0.5 * 80 - 0.3\
  \ * 10 - 0.2 * 10 = 5`。\n\n然而，有时遗憾值可能会很高，因为我们坚持使用的并非获胜概率最高的老虎机。你可以看到类似下面的 `slot_trajectory`。我在图\
  \ 3-2 中为你绘制了一个示例。\n\n***图 3-2.** 老虎机的选择*\n\n在这种情况下，2 号老虎机在探索阶段给鲍勃留下了良好印象，因此鲍勃坚持使用它。然而在利用阶段，真正的最佳老虎机\
  \ 1 号试图赢得鲍勃的青睐，但未能成功。于是鲍勃在剩余的大部分游戏中都使用 2 号老虎机。这样的轨迹给鲍勃带来了 `16.8` 的遗憾值，甚至比随机猜测还要稍差一些。\n\
  \n如果鲍勃不愿意花 30 美元进行探索/估算概率，情况可能会更糟。这样，他选择次优老虎机的概率会更大。\n\n现在的问题是要找到一种改进版的贪心方法，以避免此类问题。\n\
  \n### 贪心-ε：并非总是贪心\n\n让我们尝试引入一种新策略。假设鲍勃大致上根据`历史记录`坚持使用最佳老虎机。然而，每次鲍勃都有一个较小的概率，记为 `ε`，随机选择另一台老虎机来玩。这是`探索`和`利用`的混合：鲍勃放弃了一些`利用`的机会，转而进行`探索`，以寻求未来更大的收益。\n\
  \n实现起来很简单，作为练习留给读者。请将函数命名为 `cal_greedy_epsilon_regret`。关键代码是以下三行。 `ε` 的值由你决定，而在本演示中我将其设为\
  \ `0.02`。\n\n```\nif np.random.random() < epsilon:\n    slot_index = np.random.choice([i\
  \ for i in range(K) if i != slot_index])\n    slots_trajectory.append(slot_index)\n\
  ```\n\n让我们比较一下纯贪心方法与带有限初始探索步数的贪心-epsilon 方法的性能。我将每台机器的初始探索次数设为 `1`，`ε` 设为 `0.02`。以下代码将绘制两种方法的直方图：\n\
  \n```\nrounds = 1000\ngreedy_only = [cal_greedy_regret(evaluation_step=1)[0] for\
  \ _ in range(rounds)]\ngreedy_epsilon = [cal_greedy_epsilon_regret(epsilon=0.02)[0]\
  \ for _ in range(rounds)]\n\nwith plt.xkcd():\n    fig, ax = plt.subplots(figsize=(10,6))\n\
  \    plt.hist(greedy_only, label=\"纯贪心方法\", bins=np.linspace(0,25,30), alpha=0.5)\n\
  \    plt.hist(greedy_epsilon, label=\"贪心-epsilon 方法\", bins=np.linspace(0,25,30),\
  \ alpha=0.5)\n    plt.legend(loc='upper right')\n    fig.savefig(\"greedy_approach_epsilon_compare.jpg\"\
  )\n```\n\n结果如图 3-3 所示。\n\n![](img/index-56_1.png)\n\n***图 3-3.** 纯贪心方法与贪心-epsilon\
  \ 方法的遗憾值分布*\n\n请注意，纯贪心方法确实产生了更多低遗憾值，但其分布不如贪心-epsilon 方法集中。这意味着贪心方法的最差情况比贪心-epsilon\
  \ 方法的最差情况更差。\n\n\n\n"
- '# 改变胜率结果的影响


  如果改变胜率的真实值，结果可能会发生巨大变化。尝试修改它，看看这对两种策略的表现有何影响。如果老虎机数量增加到像`5`或`10`台会怎样？


  如果鲍勃采取激进策略，他会选择纯粹的贪婪方法。如果鲍勃更为谨慎，他可以尝试贪心-ε方法，以避免出现低概率但灾难性的遗憾值。


  ### 一种改进的贪心-ε算法


  朴素贪心方法的一个问题是，它在进行随机选择时没有考虑老虎机的表现。我们可以通过采用所谓的*softmax*策略来解决这个问题。其核心思路是引入一个参数，模仿物理学中温度的概念，称为`τ`。温度`τ`越高，选择越随机。当`τ
  ≈ 0`时，我们的策略应退化为朴素贪心方法。当`τ ≈ ∞`时，我们的策略应退化为随机选择策略。


  公式如下：


  `p(i,t) = e^(p(i,t)) / Σ e^(p(i,t))`


  其中，`p(i,t)`代表老虎机`i`在时间`t`时的观测胜率。


  例如，如果在第`100`步时，鲍勃已经玩了老虎机`1`共`11`次，并且赢了`4`次，那么`p(1,100) = 4/11`。


  *softmax*这个名称是什么意思？如果我们将表达式展开到三台老虎机的情况，并假设第一台老虎机到目前为止表现最佳，那么我们可以通过调整温度`τ`的值来观察其对下一轮选择的影响。


  例如，当`τ`趋近于无穷大时，我们得到：


  `p(1,t) / Σ p(i,t) = e^(p(1,t)) / (e^(p(1,t)) + e^(p(2,t)) + e^(p(3,t))) ≈ 1/3`


  这意味着在极高温度下，无论老虎机 1 的表现比其他老虎机好多少，算法都会退化为基准随机策略。


  让我们看看另一个极端情况，当温度`τ`设定接近`0`时：


  `p(1,t) / Σ p(i,t) = e^(p(1,t)/τ) / (e^(p(1,t)/τ) + e^(p(2,t)/τ) + e^(p(3,t)/τ))`


  由于`p(1,t)`是最大值，像`e^(p(2,t)/τ)`这样的表达式实质上变成了`e^(-∞)`，即零。这意味着我们的算法退化为朴素贪心方法。


  请随意调整`τ`的值，看看它如何影响策略的表现。


  该策略最大的改进在于，它会优先考虑表现最佳的选项，同时也为其他选项留出尝试的机会。


