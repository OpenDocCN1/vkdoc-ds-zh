  \n### 练习\n\n1. 实现用于团簇发现的广度优先搜索算法。\n2. 实现一个算法，计算网格中最大团簇的大小，并将其与占据概率的关系绘制成图。请注意，你可能需要运行多次以获得有意义的统计数据。\n\
  \n### 二维网格渗流中的另一项有趣统计\n\n如果我们回到最初的森林火灾问题，我们更关心的一个问题是火灾的严重程度，即渗流团簇的大小。\n\n然而，在模拟中，我们通过改变网格大小来模拟无限大的网格。由于最大团簇的大小依赖于网格尺寸，因此无法直接计算。我们可以计算另一个值——比例*f*，即渗流团簇中占据点位的比例。随着占据概率增大，该比例应趋近于\
  \ 1；但当占据概率从高于临界值的区间向临界概率趋近时，该比例应趋近于 0。\n\n想象一个无限大的网格，如果占据概率仅略大于临界概率，则存在一个渗流团簇。尽管概率论告诉我们，这样的团簇在无限大网格中必然存在，但即使占据概率略小于临界值，也绝不会形成渗流团簇！你能想象这个团簇的样子吗？是的，它极可能非常蜿蜒曲折，虽然无限大，但几乎将自身置于所有占据点位之外。听起来矛盾，但事实如此。\n\
  \n## 第 5 章 渗流、阈值与相变\n\n首先，我们实现一个计算该比例的新方法：\n\n```\ndef percolating_cluster_fraction(self):\n\
  \    assert(self.percolated)\n    total_occupied = sum([sum([h in (State.Cluster,\
  \ State.Working) for h in row]) for row in self.states])\n    cluster_size = sum([sum([h\
  \ == State.Cluster for h in row]) for row in self.states])\n    return cluster_size\
  \ / total_occupied\n```\n\n接下来，我们运行模拟以评估该比例与占据概率之间的关系。我们使用 100x100、200x200 和 300x300\
  \ 的网格进行模拟。从高于基准真值的位置开始，我们逐渐将占据概率降低至 0.59 左右，并对每个概率点运行 1000 次以获得平均值。\n\n```python\n\
  L = 100\nROUND = 1000\nTRUTH = 0.592746\n\nfractions = []\nprobs = []\nstart = 0.622746\n\
  steps = 110\nstep = (start - TRUTH) / (steps - 10)\n\nfor i in tqdm(range(steps)):\n\
  \    res = []\n    prob = start - i * step\n    probs.append(prob)\n    for _ in\
  \ range(ROUND):\n        while True:\n            grid = Grid(L, L, prob=prob, random_init=True)\n\
  \            grid.percolate_through()\n            if grid.percolated:\n       \
  \         frac = grid.percolating_cluster_fraction()\n                res.append(frac)\n\
  \                break\n    fractions.append(res)\n```\n\n![](img/index-103_1.png)\n\
  \n![](img/index-103_2.png)\n\n## 第 5 章 渗流、阈值与相变\n\n然后我们可以估算出达到临界占据概率时的比例值。绘图代码较为简单故省略。我们得到图\
  \ 5-10。\n\n***图 5-10.** 100x100 网格中渗流团簇比例与占据概率的关系*\n\n嗯，这看起来不太理想，因为理想情况下比例应为 0；但我们得到的值约为*0.57*。我们尝试更大的\
  \ 200x200 网格。得到图 5-11。\n\n***图 5-11.** 200x200 网格中渗流团簇比例与占据概率的关系*\n\n200x200 网格尺寸下，在临界占据概率时我们得到的比例约为*0.52*。\n\
  \n请注意，该项模拟在我的 2019 款 MacBook Pro（16GB 内存）上运行了数小时。如果你有可以全天开机的机器，可以像我一样尝试 300x300\
  \ 网格的模拟。我必须将`max recursion depth`设置为相当大的数值以避免递归错误。经过数小时的计算，我得到了图 5-12。\n\n![](img/index-104_1.png)\n\
  \n## 第 5 章 渗流、阈值与相变\n\n***图 5-12.** 300x300 网格中渗流团簇比例与占据概率的关系*\n\n我们成功在临界占据概率处使比例值达到了*0.5*，但距离理论值仍相去甚远。这个例子展示了模拟结果收敛有多难。在临界占据概率附近进行模拟的难度是众所周知的，因为我们正趋近于模拟中所说的*相变*。系统的属性在临界占据概率附近发生突变。我们使用的是较为朴素的方法进行模拟，且硬件性能也有限。这是预料之中的结果。不必感到沮丧。\n\
  \n### 练习\n\n1. 你能推导出一维情况下比例作为占据概率函数的解析方程吗？\n2. `percolate_through`方法在找到第一个潜在渗流团簇后会停止搜索。请评估两个不重叠的渗流团簇共存的概率有多大。\n\
  3. 对 100x100 网格进行键渗流模拟。同样绘制渗流团簇比例随占据概率变化的图。\n\n## 第 5 章 渗流、阈值与相变\n\n### 总结\n\n在本章中，我们研究了网格上的渗流模拟。这类模拟在数学和理论物理学中有着深厚根基。我们推导了一维情况下的解析解，并模拟了二维情况下越来越大的网格。我们还看到了一个令人*痛苦*的例子，说明有时模拟会变得极其困难。\n\
  \n## 第 6 章\n\n## 排队系统：股票交易如何达成\n\n\n\n"
- "# 股票交易所模拟系统\n\n股票交易所是一个迷人的系统，人们在其中交易股票并希望从交易中获利。在电子交易出现之前的旧时代，经纪人会聚在一起，通过互相喊叫来代表客户交易股票。如今，一切都变得电子化。散户投资者可以使用移动应用程序或网络应用程序进行交易。\n\
  \n在本章中，我们将构建一个系统来模拟股票交易所并可视化订单簿。此模拟的关键在于处理订单排队。例如，有些订单提交得早，而另一些则提交得晚但价格更低。在这种情况下，我们需要正确确定订单优先级。另一方面，我们还需要管理消息广播。在现实中，投资者可以看到由股票交易所广播的实时股票价格变化。\n\
  \n### 交易流程基础\n\n首先，让我们分解交易流程，以确定应模拟哪些实体和流程。\n\n一笔成功交易包含三个主要部分。首先，投资者向交易所发送订单。然后，`match\
  \ engine`（撮合引擎）接收订单并尝试找到订单的对手方。例如，如果新卖单进入，`match engine`将尝试在排队订单中找到一个现有买单来匹配该新卖单。在接下来的第三步中，有两种可能性。如果成功找到匹配，交易将完成，交易成功的消息将广播给原始投资者，同时由于交易可能导致最新价格变化，市场上所有投资者也将获得新的价格。如果没有成功找到匹配，新卖单也将排队，直到未来有交易进入。投资者还可以请求撤销他们已排队的订单。\n\
  \n© Rongpeng Li and Aiichiro Nakano 2022\n\nR. Li and A. Nakano, *Simulation with\
  \ Python*，[`doi.org/10.1007/978-1-4842-8185-7_6`](https://doi.org/10.1007/978-1-4842-8185-7_6#DOI)\n\
  \n第六章 排队系统：股票交易是如何进行的\n\n简而言之，我们需要模拟以下实体：\n1. 投资者\n2. `match engine`（撮合引擎）\n\n当然，进一步拆分`match\
  \ engine`也是有意义的，例如将一个部分专门负责匹配交易，另一个部分负责广播信息等。然而，为了简化，我们将把股票市场一侧的所有功能都打包到`match engine`实体中。\n\
  \n为了完全模拟交易过程，需要模拟以下四个过程：\n1. 投资者向`match engine`发送订单。\n2. `match engine`处理并尝试匹配交易。\n\
  3. 如果交易成功，`match engine`向原始订单提交者广播消息。\n4. `match engine`向市场上的*所有人*广播最新价格。\n\n由于篇幅限制，本章的重点是前两个部分。然而，你可以看出步骤\
  \ 3 和步骤 4 只是步骤 1 的反向操作。我将把这两个部分留作本书末尾的练习。你会看到本章中有许多简化和假设。我将把所有这些问题留作练习，供你实现一个完整功能的系统。\n\
  \n### 订单簿\n\n`match engine`跟踪订单的方式是维护一个*订单簿*。订单簿是一个动态的买单和卖单列表，由`match engine`不断更新。你可以将订单簿想象成两堆订单：所有买单在左边，所有卖单在右边。`match\
  \ engine`尝试从买方和卖方中找到可交易的配对。\n\n订单簿需要以所有市场参与者感到公平和平等的方式来维护。有一些原则需要被尊重。其中最重要的有两条。\n\
  \n![](img/index-108_1.png)\n\n第六章 排队系统：股票交易是如何进行的\n\n\n\n首先，**卖单**中价格较低的订单优先级高于价格较高的订单。\n\
  \n同理，**买单**中价格较高的订单优先级高于价格较低的订单。然而，这仅适用于所谓的`限价单`。`市价单`较为特殊，因为它可以接受任意价格。例如，一个市价买单会从最低价格开始依次匹配卖单，直到买单中要求的股票数量全部成交，这可能会显著推高`市场价`（即所有参与者看到的价格）。\n\
  \n另一方面，还有`止损单`和`止盈单`。这类订单会在价格达到特定水平时被触发。例如，止损单会在价格跌至某一水平时执行以控制损失。本章不会涉及此类订单，但鼓励读者将其作为我们模拟系统的扩展来实现。\n\
  \n其次，如果价格相同，则先提交的订单优先级更高。请注意，原则上不会有提交时间完全相同的两个订单，因此总会有明确的顺序依据。\n\n随着订单的不断涌入，订单簿会动态变化；某一价格水平上的订单数量被称为`深度`。深度越大，说明买卖该股票的意向越强烈。如前所述，价格越接近`市场价`的订单，其优先级高于远离市场价的订单。因此，订单簿始终呈现为深度快速变化的`山谷`形态。GIF\
  \ 6-1 清晰地展示了这一点。\n\n**GIF 6-1.** 订单簿深度动态变化\n\n第 6 章 队列系统：股票交易如何达成 请注意，在实际交易中，如果订单尚未被撮合引擎执行，投资者可以随时请求撤销订单。不过，本章也不会实现这一部分。你可以尝试自行实现，它并没有你想象的那么困难。\n\
  \n### 创建接口并确定数据模式\n\n好了！现在我们准备构建一个撮合引擎。首先，创建一个能够接收订单的`端点`。为此，我们将使用`flask`来构建一个简单的\
  \ API（应用程序编程接口）。API 向外部用户和其他程序公开特定功能。在本例中，我们的 API 只做一件事：接收传入的订单。\n\n如果你之前没用过`flask`，下面是一个入门示例。\n\
  \n首先安装我们要使用的两个库：\n\n```\npip3 install flask, requests\n```\n\n接着，用你喜欢的编辑器创建一个`engine.py`文件，复制并粘贴以下代码：\n\
  \n```\nfrom flask import Flask\n\napp = Flask(__name__)\n\n@app.route('/submit',\
  \ methods = ['GET'])\n\ndef process_order():\n\nreturn '<h1>order received</h1>'\n\
  \ndef main():\n\napp.run(host='localhost', port=8080, debug=True)\n\nif __name__\
  \ == '__main__':\n\nmain()\n```\n\n现在，在命令行中运行这个 flask `app`，输入：\n\n```\npython engine.py\n\
  ```\n\n![](img/index-110_1.png)\n\n第 6 章 队列系统：股票交易如何达成\n\n你应该会看到以下信息。请注意，你的具体`调试器\
  \ PIN 码`可能与我的不同。\n\n```\n* Serving Flask app 'app' (lazy loading)\n* Environment:\
  \ production\n\nWARNING: This is a development server. Do not use it in a production\
  \ deployment.\nUse a production WSGI server instead.\n\n* Debug mode: on\n* Running\
  \ on http://localhost:8080/ (Press CTRL+C to quit)\n* Restarting with stat\n* Debugger\
  \ is active!\n* Debugger PIN: 374-303-372\n```\n\n我们刚刚创建了最简单的网页应用！如果打开浏览器并导航到`http://localhost:8080/submit`，你会看到如图\
  \ 6-1 所示的消息。\n\n**图 6-1.** 网站返回的“订单已收到”消息\n\n非常酷！\n\n不到十行代码，我们就创建了一个端点，通过`process_order`函数，用户可以访问并与我们的应用交互。我们的应用只做一件事：返回一些`字节`，浏览器会将其解释为一级标题的字符串。\n\
  \n\n\n这就是为什么你会看到这么大的字体。\n\n请注意，`process_order` 函数有一个参数 `method`，所需的请求方法是 `GET`。这一设置规定了\
  \ `/submit` 端点所接受的请求方法。`GET` 方法只允许用户从该端点**获取**数据。如果用户尝试向该端点发送数据，请求将会失败，因为目前还不允许这样操作。\n\
  \n我们模拟的投资者（我通常称之为*机器人*）无法通过刷新浏览器来与我们的股票交易所进行交互。让我们看看能否用 Python 来实现这一点。现在，在另一个名为\
  \ `bot.py` 的文件中，复制并粘贴以下代码片段。在保持上一个终端中 `engine.py` 运行的同时，运行此代码。\n\n```\nimport requests\n\
  from time import sleep\n\nfor i in range(10):\n    res = requests.get('http://localhost:8080/submit')\n\
  \    print(res.content.decode('utf-8'))\n    sleep(1)\n```\n\n这里，我们使用 `requests`\
  \ 库，以每秒一次的间隔，连续十次从 `engine.py` 应用程序中获取信息。\n\n代码中的 URL 包含三部分。`http` 是协议名称，代表超文本传输协议。类似地，还有用于安全版本\
  \ http 和文件传输的 `https` 或 `ftp` 协议。`localhost` 是*主机名*（也称为*域名*），而 `8080` 是*端口号*。主机名和端口号共同定义了应用程序所在的*位置*。我们在启动\
  \ `engine.py` 文件时指定了主机名和端口号。路径 `/submit` 也是在 `process_order` 函数中指定的；它通常被称为*资源路径*。用户可以访问此路径来检索某些信息，这些信息被视作一种*资源*。\n\
  \n现在，让我们将这个基础示例改造成对撮合引擎模拟真正有用的代码。撮合引擎应该能够接收来自投资者（机器人）包含订单信息的*负载*。不过，我们首先需要弄清楚从投资者角度来看，负载中应包含哪些信息。\n\
  \n从投资者的角度来看，负载至少应包含订单类型（是市价单还是限价单）、订单规模（投资者计划买入/卖出的股票数量）以及订单方向（是买单还是卖单）。如果是限价单，则还需指定价格。\n\
  \n从股票交易所的角度来看，还需要时间戳和 ID。时间戳用于确定相同价格限价单的优先级。ID 用于标识订单，以便在订单被取消或执行时采取相应的操作。\n\n通常，任何实体都需要\
  \ ID。为简单起见，我们将允许投资者/机器人自行设置 ID 并将负载发送给撮合引擎。ID 将通过 `id()` 方法加上随机数生成，因此在我们的模拟中不太可能出现冲突。另请注意，有时一个订单可能会被部分成交。我们也将实现部分成交的功能。\n\
  \n综上所述，来自投资者的负载应如下所示：\n\n```\nfrom flask import Flask\nfrom flask import request,\
  \ jsonify\nimport json\nimport time\n\napp = Flask(__name__)\n\n@app.route('/submit',\
  \ methods = ['POST'])\ndef process_order():\n    order = request.get_json(force=True)\n\
  \    order[\"submit_timestamp\"] = time.time()\n    print(order) # 用于测试\n    return\
  \ jsonify({\"status\": \"received\"})\n\ndef main():\n    app.run(host='localhost',\
  \ port=8080, debug=True)\n\nif __name__ == '__main__':\n    main()\n```\n\n请注意，我们导入了\
  \ `request` 和 `jsonify` 模块，用于处理 POST 过来的数据并向机器人发回确认信息。\n\n为了适应这种变化，我们的 `bot.py`\
  \ 增加了一个生成模拟订单的函数。现在它看起来是这样的：\n\n```\nimport requests\nfrom time import sleep\nimport\
  \ random\nimport json\n\ndef generate_order():\n    return {\n        \"order_id\"\
  : id(random.random()),\n        \"order_type\":random.choice([\"market\", \"limit\"\
  ]),\n        \"order_size\": random.randint(1, 100),\n        \"order_price\": random.randint(1,\
  \ 100), # 如果订单类型是市价单，此字段将被忽略\n        \"order_direction\": random.choice([\"buy\"\
  , \"sell\"]),\n    }\n\nfor i in range(10):\n    order = generate_order()\n    res\
  \ = requests.post('http://localhost:8080/submit',\n                        data\
  \ = json.dumps(order))\n    print(res.json())\n    sleep(1)\n```\n\n### 实现订单簿逻辑\n\
  \n下一步是实现一个合适的数据结构来维护订单簿。我们将使用字典的列表形式来维护每一侧的订单。例如，在买单侧，我们将使用一个字典的列表来跟踪所有订单。\n\n字典的键是订单价格。股票价格并非无限精确，这意味着存在最小变动单位。例如，每股价格要么是\
  \ 1.5 美元，要么是 1.6 美元，而不会是 1.55 美元。这确保了字典中的键的数量总是可控的，因此对键进行排序就相当简单。\n\n字典中的每个值是一个提交订单的列表。该列表的行为类似于队列，不允许取消订单，这样一来，如果市场上有合适的对手盘，较早的订单就能优先被撮合。\n\
  \n让我们来看看 `OrderBook` 类的代码以及相应的订单接收代码：\n\n```\nfrom collections import defaultdict\n\
  import numpy\n\nclass OrderBook:\n    def __init__(self):\n        self.buy_orders\
  \ = defaultdict(list)\n        self.sell_orders = defaultdict(list)\n        self.latest_ordr\
  \ = None\n\n    def receive_orders(self, order):\n        if order[\"order_type\"\
  ] == \"market\":\n            order[\"order_price\"] = np.inf if order[\"order_direction\"\
  ] == \"buy\" else -np.inf\n        # 愿意以极高的价格买入\n        if order[\"order_direction\"\
  ] == \"buy\":\n            self.buy_orders[order[\"order_price\"]].append(order)\n\
  \        else:\n            self.sell_orders[order[\"order_price\"]].append(order)\n\
  \        self.latest_order = order\n        self.fulfill_orders()\n\n    def fulfill_orders(self):\n\
  \        raise NotImplementedError\n```\n\n你能看出我是如何实现市价单的吗？如果一个买单是市价单，我将可接受价格设为正无穷大。这意味着该买单可以接受任意高的价格。同样的道理也适用于市价卖单，卖单会接受任意低的价格来卖出。一旦价格确定，我们就简单地找到对应的字典值（即列表），并将新订单追加到其中。这就是\
  \ `defaultdict` 让代码更简洁的地方：如果列表尚不存在，`defaultdict` 会为我们创建一个空列表。\n\n请注意，我们有一个未实现的函数叫\
  \ `fulfill_orders`。它负责实际执行订单，也是这段代码的关键。让我们来看看：\n\n```\ndef fulfill_orders(self):\n\
  \n    \"\"\"\n\n\n\n# 当该方法运行时，只会出现以下三种情况中的一种。\n\n1.  有且仅有一笔市价单能与对手方挂单成交\n2.  没有市价单\n\
  \    - 2.1 没有匹配的对手方订单\n    - 2.2 最新的限价单可以通过逐一满足对手方订单来成交\n\n这三种情况互斥，因此我们将逐一处理。\n\n\
  ## 第 6 章 排队系统：股票交易是如何进行的\n\n```python\nlatest_order = self.latest_order.copy()\n\
  opposite_orderbook = self.buy_orders if latest_order[\"order_direction\"] == \"\
  sell\" else self.sell_orders\nif latest_order[\"order_direction\"] == \"buy\":\n\
  \    opposite_prices = sorted(opposite_orderbook.keys())\nelse:\n    opposite_prices\
  \ = sorted(opposite_orderbook.keys(), reverse=True)\n\nfor opposite_price in opposite_prices:\n\
  \    valid_buy = latest_order[\"order_direction\"] == \"buy\" and opposite_price\
  \ <= latest_order[\"order_price\"]\n    valid_sell = latest_order[\"order_direction\"\
  ] == \"sell\" and opposite_price >= latest_order[\"order_price\"]\n    valid = (valid_buy\
  \ or valid_sell) and latest_order[\"order_size\"] > 0\n    if not valid:\n     \
  \   break\n\n    for queued_order in opposite_orderbook[opposite_price]:\n     \
  \   if queued_order[\"order_size\"] <= latest_order[\"order_size\"]:\n         \
  \   latest_order[\"order_size\"] -= queued_order[\"order_size\"]\n            if\
  \ latest_order[\"order_direction\"] == \"buy\":\n                self.buy_orders[latest_order[\"\
  order_price\"]][-1][\"order_size\"] -= queued_order[\"order_size\"]\n          \
  \  else:\n                self.sell_orders[latest_order[\"order_price\"]][-1][\"\
  order_size\"] -= queued_order[\"order_size\"]\n            fill_size = queued_order[\"\
  order_size\"]\n            queued_order[\"order_size\"] = 0\n        elif latest_order[\"\
  order_size\"] > 0:\n            # print(\"最新订单不够大，无法完全吃掉当前排队订单\")\n            queued_order[\"\
  order_size\"] -= latest_order[\"order_size\"]\n            fill_size = latest_order[\"\
  order_size\"]\n            # 标记最新订单已完全成交。\n            latest_order[\"order_size\"\
  ] = 0\n            # 最新订单始终是最后一个。现在它已被耗尽，将其大小设为 0。\n            if latest_order[\"\
  order_direction\"] == \"buy\":\n                self.buy_orders[latest_order[\"\
  order_price\"]][-1][\"order_size\"] = 0\n            else:\n                self.sell_orders[latest_order[\"\
  order_price\"]][-1][\"order_size\"] = 0\n        else:\n            break\n\nself.clean_limit_orderbook()\n\
  ```\n\n请注意，代码中的某些行相当长，但内联注释应该足以让你理解。基本上，分为三个步骤：\n\n1.  首先，确定最新订单的方向，因为我们的订单簿只会且仅会被最新订单改变。\n\
  2.  方向确定后，检查是否存在可能的交易。如果最新订单是市价单，则无需检查对手方订单的价格；否则，我们需要确保存在价格重叠。例如，如果最新订单是买单，那么最低的卖单价格应不高于最新的买单价格。\n\
  3.  然后，我们按照提交时间顺序（从最早到最晚）遍历符合条件的对手方订单，以确保公平性，直到最新订单的成交量耗尽。另一种情况是，如果出现巨大的市价单，可能没有更多的对手方订单，但这种情况非常罕见。\n\
  \n## 第 6 章 排队系统：股票交易是如何进行的\n\n根据上述逻辑，代码应该相当易于阅读。\n\n为了清晰起见，我们还可以实现一个 `clean_limit_orderbook`\
  \ 函数，在订单成交后运行。这可能不是必需的，但对于像 `print_orderbook` 这样的实用辅助函数很有帮助，其定义如下：\n\n```python\n\
  def print_orderbook(self):\n    print(\"-------------------Orderbook-------------------\"\
  )\n    for price in sorted(self.sell_orders.keys(), reverse=True):\n        depth\
  \ = sum(map(lambda order: order[\"order_size\"], self.sell_orders[price]))\n   \
  \     print(\"sell side price: {}, depth: {}\".format(price, depth))\n    print(\"\
  -----------------------------------------------\")\n    for price in sorted(self.buy_orders.keys(),\
  \ reverse=True):\n        depth = sum(map(lambda order: order[\"order_size\"], self.buy_orders[price]))\n\
  \        print(\"buy side price: {}, depth: {}\".format(price, depth))\n    print(\"\
  \\n\")\n```\n\n最后，`clean_limit_orderbook` 函数的实现如下，相当直接：\n\n```python\ndef clean_limit_orderbook(self):\n\
  \    \"\"\"\n    移除限价订单簿中的无用键\n    \"\"\"\n    for orderbook in [self.buy_orders,\
  \ self.sell_orders]:\n        empty_prices = []\n        for price in orderbook.keys():\n\
  \            new_orders = list(filter(lambda order: order[\"order_size\"] > 0, orderbook[price]))\n\
  \            if len(new_orders) == 0:\n                empty_prices.append(price)\n\
  \            else:\n                orderbook[price] = new_orders\n        for price\
  \ in empty_prices:\n            del orderbook[price]\n```\n\n## 第 6 章 排队系统：股票交易是如何进行的\n\
  \n### 将机器人和引擎连接起来\n\n现在连接机器人和引擎非常简单。让我们修改 `engine.py` 文件来处理订单并构建订单簿：\n\n```python\n\
