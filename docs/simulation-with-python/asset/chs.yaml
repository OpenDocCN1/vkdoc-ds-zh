  \n有许多成熟的碰撞检测算法；我们将讨论并实现其中一个最直观的算法：**扫描与剪枝**算法。\n\n扫描与剪枝算法的思路非常直接。如果两个球碰撞，那么它们在 x\
  \ 轴或 y 轴上的投影也必然重叠！因此，我们可以利用球的投影来预测它们是否碰撞，因为这是一个必要但不充分的条件。\n\n扫描与剪枝算法的最大优点是，我们可以事先按球在某一轴上的投影进行排序。然后进行一次扫描就可以找到所有可能发生碰撞的球对。排序的时间复杂度为`O(n\
  \ log n)`，这已经比朴素方法有了显著改进。还可以进一步优化。\n\n现在，让我们实现该算法。我们只需要在`System`类中实现一个新方法，该方法仅负责返回可能碰撞的球对列表。\n\
  \n```\ndef sweep_prune(self) -> List[Tuple[int, int]]:\n    # 返回可能碰撞的球的索引列表\n  \
  \  self.balls.sort(key=lambda ball: ball.pos[0])  # <1>\n    active_balls = []\n\
  \    candidates = []\n    for idx, ball in enumerate(self.balls):\n        if not\
  \ active_balls:\n            active_balls.append(idx)\n        else:\n         \
  \   closest_ball = self.balls[active_balls[-1]]\n            if closest_ball.pos[0]\
  \ + closest_ball.radius >= ball.pos[0] - ball.radius:  # <2>\n                candidates.append((active_balls[-1],\
  \ idx))\n                active_balls.append(idx)\n            else:  # <3>\n  \
  \              active_balls = [idx]\n    return candidates\n```\n\n该算法执行以下三个步骤：\n\
  \n1. 球按照它们的 x 坐标原地排序。\n2. 如果两个球在 x 轴上足够接近，则它们成为碰撞候选。\n3. 否则，清空`active_balls`列表并将当前球添加到`active_balls`列表中，因为我们正远离之前的球投影簇。\n\
