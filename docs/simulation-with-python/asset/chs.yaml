  \n好了。本章到此结束。在进入下一章之前，这里有一些练习。\n\n### 练习\n\n1.  你能调整乌龟运动的转移概率矩阵使其更真实吗？例如，乌龟在接近果实时或许能闻到气味并向其移动。这个改变会如何影响结果？\n\
