    of the machine with the largest winning probability, which is the first one. The
    reason is that because it has a higher winning probability, Bob has a higher chance
    of picking it, which creates positive feedback. Also, as Bob plays more and more,
    we have higher confidence for all machines in general.


    Let’s try more rounds and try more machines. Let’s say Bob has 200 dollars, and
