    Chapter 7 roCk, SCiSSorS, and paper: Multi-agent SiMulation **Summary**


    In this chapter, we discussed a new kind of simulation: agent-based simulation
    (modeling). Agent-based simulation is fascinating because it is capable of generating
    complex patterns from simple rules that govern local agents’ behaviors. It is
    widely used in computational social science. We also utilized the Mesa Python
    library to model a multi-agent competition.


    **CHAPTER 8**


    **Disease Spreading,**


    **Simulating COVID-19**


    **Outbreak**


    Starting from the end of 2019, a regional respiratory disease first identified
    in Wuhan, China, quickly spread to the whole world. Tens of millions of people
    got infected and hundreds of thousands of people died. The disease was later named
    COVID-19 by the World Health Organization. Starting from early 2021, vaccines
    began to be available, which significantly reduced the death rate for infected
    people.


    As of early 2022, the battle between COVID-19 and humans is still ongoing. In
    this chapter, we will try to use mathematical models to model and simulate the
    disease spreading. We will study the very basics of differential equations and
    run some Python codes to simulate the growth of an epidemic.


    **Simplifying the Real World**


    In the real world, disease spreading is a very complex problem. Different diseases
    have different pathogens: virus, bacteria, or other microorganisms. They have
    different pathways to invade hosts. For example, the COVID-19 virus mainly spreads
    through air when infected people cough or speak and susceptible groups breathe
    in the particles that carry the virus. The virus can also last for quite a long
    time on surfaces: if another person touches the surface and then touches their
    nose or eyes, the virus can also invade the new host. Other pathogens can spread
    through water or food like various kinds of parasites. Certain viruses can also
    be transmitted through blood like HIV, the cause of AIDS.


    © Rongpeng Li and Aiichiro Nakano 2022


    R. Li and A. Nakano, *Simulation with Python*, [https://doi.org/10.1007/978-1-4842-8185-7_8](https://doi.org/10.1007/978-1-4842-8185-7_8#DOI)


    Chapter 8 Disease spreaDing, simulating COViD-19 Outbreak The infected population
    also has huge internal diversity. Take COVID-19, for example; people who are younger
    with strong immune systems can usually recover without treatment. However, for
    older people with preexisting conditions, the symptoms can be deadly. Some infected
    people are more active outdoors, so they can be a source of virus spreading, while
    other people may choose to stay indoors.


    In this chapter, we will try to model disease spreading by focusing on the partition
    of the population and the simplified interaction between pathogens and the population.


    The exact details of pathways and biological dynamics of pathogen-host interaction
    will be omitted.


    Here are the main assumptions:


    1\. The whole population in the world is categorized into three groups: the *susceptible*
    denoted by *S*, the *infected* denoted by *I*, and the *recovered* denoted by
    *R*.


    a. The susceptible represents the group who are not currently infected.


    b. The infected represents the group who are currently infected and contagious.


    c. The recovered represents the group who are immune to the disease at a certain
    point. Note that some versions of the models will use *Removed* instead of *Recovered*
    to include the deceased population.


    2\. Group populations are not static, but dynamically changing.


    For example, susceptible people can get infected and become


    infected. Depending on the nature of the disease, people may


    or may not develop immunity. For example, a parasite-caused


    disease can be recurring if hosts are exposed to the pathogens again after recovery.


    3\. The model is used to model outbreaks such that many underlined quantities
    are fixed. For example, the age structure of the whole population is fixed, and
    the total population remains unchanged as well.


    In summary, the most basic structure of the model looks like the following. A
    susceptible person got infected, then the person recovered, hopefully, from the
    disease.


