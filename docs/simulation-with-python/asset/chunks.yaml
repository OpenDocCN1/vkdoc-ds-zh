    \ way is to limit the transmission between the infected and the susceptible: reduce\
    \ `α`; another way is to cure the infected population by increasing `β`. Let's\
    \ see how they affect the population evolution curves.\n\nFirst, let's change\
    \ `α` to one-tenth of the original one: `alpha = 0.0001`.\n\nIt looks like we\
    \ successfully *delayed* the transmission of the disease! Note that I extended\
