    The Markov chain, specifically the discrete-time Markov chain, is named after
    Russian mathematician Andrey Andreyevich Markov. He is a pioneer in the study
    of stochastic processes and the first to introduce the concept of Markov chains.


    Let’s introduce the Markov chain with a simple example of weather forecasting.


    **Weather Forecasting**


    Suppose we have a weather forecasting system that predicts the weather in the
    next hour.


    The weather can only take three possibilities: sunny, cloudy, or rainy. Here,
    we call these possibilities the *states*. We won’t predict the weather continuously
    but rather forecast the weather in the next hour. This makes our system *discrete*.


    The continuous-time Markov chain is beyond the scope of this book. It requires
    more rigorous analysis. However, the fundamental ideas of the discrete-time Markov
    chain remain unchanged.


    Weather will change so there is a probability that a sunny day will turn into
    a cloudy day. Similarly, a cloudy day will turn into a rainy day, etc. We can
    define the transition probabilities in Ta[ble 2-1\. T](#index_split_000.html#p32)he
    columns represent the current weather states, and the rows represent the next
