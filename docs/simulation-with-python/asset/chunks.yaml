    **A Random Walk That Has an End**


    Suppose you have a fruit-loving tortoise that moves in a tube. The tube is 7 inches
    long.


    At the left end, there is a banana, and at the right end, there is an apple. Now,
    the tortoise starts at a position that is 3 inches away from the left end, which
    means it is closer to the banana than the apple by 1 inch. The tortoise can only
    move 1 inch per minute, and it moves randomly to the left or to the right with
    equal probability. The tortoise is so active that it *will* move every minute
    until it reaches one of the fruits. The setting can be visualized as in Figur[e
    2-4.](#index_split_000.html#p40)


    ***Figure 2-4.** A graph that represents the states the tortoise can be in* The
    question is, what are the probabilities that the tortoise *eventually* reaches
    the banana and apple?


    Spend some time to think about the question yourself. Here are some intuitions
    and observations:


    1\. Given enough time, intuitively the tortoise will reach one of the fruits.
    Our tube is just 7 inches long, and the tortoise just keeps moving.


    2\. The tortoise should have a higher, probably not much, probability of reaching
    the banana than the apple. The setting is not


    symmetric.


    Let’s perform a set of simulation runs to directly simulate such a system and
    evaluate such probabilities:


    def tortoise_run(state = 3, left_prob = 0.5):


    steps = 0


    while state % 7 != 0:


    if np.random.random() < left_prob:


    state -= 1


    else:


    state += 1


    steps += 1


    ![](index-41_1.png)


    ChapteR 2 MaRkov Chain, a peek into the FutuRe


    if state == 0:


    return steps, 0


    else:


    return steps, 7


    We can run the simulation for 10,000 times and count how many times the tortoise
    reaches the banana and apple. I can plot the result with the following code: simulations
    = [tortoise_run() for _ in range(10000)]


    bananas = np.array([x[1] == 0 for x in simulations]).cumsum()


    apples = np.array([x[1] == 7 for x in simulations]).cumsum()


    with plt.xkcd():


    fig, ax = plt.subplots(figsize=(8,6))


    plt.plot(bananas/(bananas+apples), lw=3,label="bananas") plt.plot(apples/(bananas+apples),
    lw=3,label="apples") plt.legend()


    plt.title("Probabilities of Reaching Bananas/Apples") plt.xlabel("# of runs")


    The result looks like Figur[e 2-5.](#index_split_000.html#p41)


    ***Figure 2-5.** Probabilities that the tortoise reaches bananas or apples for*
    *10,000 runs*


    ![](index-42_1.png)


    ![](index-42_2.png)


    ChapteR 2 MaRkov Chain, a peek into the FutuRe


    It does agree with our intuition that the tortoise is slightly more likely to
    reach the banana. If you check the end of the bananas/(bananas+apples) array,
    you will find that the probability of reaching the banana is about *0.575*.


    As an in-chapter exercise, you can plot a histogram to check the distribution
    of the number of steps before the tortoise stops moving. I am going to leave this
    as an exercise.


    Your result should look like the one in Figure [2-6](#index_split_000.html#p42).
    Note that the x axis is in log scale.


    ***Figure 2-6.** Number of steps before the tortoise stops moving* Now, let’s
    use our knowledge of the Markov chain to find the exact probabilities in the original
    question. If you think about it, the tortoise’s random walk can be treated as
    a Markov chain that has the following transition matrix. The dimension matches
    the number of possible states.


    ![](index-43_1.png)


    ChapteR 2 MaRkov Chain, a peek into the FutuRe


    This Markov chain is different from the weather one mainly because it has two
    so-called *absorbing states*. The absorbing states are the left and right ends
    of the tube. Once the tortoise reaches one of the ends, it stops moving. The first
    and the last element in the transition matrix diagonal are *1* which indicate
    the absorbing states.


    Now, let’s find out the *eigenstate* of the multiple-step transition matrix. The
    idea is that we treat multiple continuous transitions, say, 50 steps, as one transition
    and consider its transition matrix. You can find the transition matrix for *50*
    steps using the one-liner reduce(lambda x,y:x@y,[tortoise_tm for _ in range(50)]).
    If you change *50* to a larger number, the matrix remains largely the same up
    to a precision error.


    The symmetry is pretty clear. The closer the tortoise is to the left end, the
    more likely it will be to reach the banana. The highest probability is *0.86*.
    This agrees with our intuition as the tortoise does have a chance to reach for
    the apple although the banana is just 1 inch away. We multiply the transition
    matrix with the initial state numpy.


    array([0,0,0,1,0,0,0,0]) to get the probability of reaching the banana eventually.


    Note that it does agree with our simulation performed earlier.


    Alright. This is the end of our first section. You have seen how to use the Markov
    chain to predict the weather and simulate a hungry tortoise movement. Next, let’s
    try to use the Markov chain as a generative model to write some poems.


    **Sonnet Written by Drunk Shakespeare**


    A Markov chain can be used to model human language as a simplistic first approach.


    Human language has intrinsic patterns such that the probabilities that a certain
    word follows another word are very different. A Markov chain fits in this scenario
    perfectly.


    Let’s try to grab some sonnets from Shakespeare and turn his text into a Markov
    chain with corresponding probabilities.


