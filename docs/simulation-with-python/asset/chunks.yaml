    \ inside the circle. In order to get a so-called upper bound, your opponent must\
    \ use circumscribed polygons as well.\n\nOn the other hand, all you need to do\
    \ is to sit there and take your time to explain the beauty of your approach to\
    \ the king. What you did was indeed a *Monte Carlo simulation*.\n\nYou can just\
    \ wait for more and more data from your men until the end of the day.\n\nEnough\
    \ of role-playing for now, let’s find out why 1000 men sprinkling 1000 grains\
    \ repeatedly will give us a pretty good estimation of π.\n\nRemember that π not\
    \ only describes the relationship between the diameter and the perimeter but also\
