    \  \n\nIndex  \n\nviii\n\n![](index-9_1.png)  \n![](index-9_2.png)  \n\n## About\
    \ the Authors\n\n**Rongpeng Li** is the business intelligence team lead at Unit21.\
    \ He was a senior data scientist and data science instructor at Unit21. Rongpeng\
    \ Li graduated from USC with two masters, one in physics and another in electrical\
    \ engineering. He is a keen educator. He authored one statistics book derived\
    \ from his voluntary services in the data community.\n\n**Aiichiro Nakano** (advisory\
    \ author) is a professor of computer science and physics and astronomy with joint\
    \ appointments in quantitative and computational biology and collaboratory for\
    \ advanced computing and simulations at the University of Southern California.\
    \ He received a PhD in physics from the University of Tokyo, Japan. His research\
    \ areas are scalable scientific algorithms, high-end parallel supercomputing,\
    \ scientific visualization and informatics, and computational materials science.\
    \ He is a Fellow of the American Physical Society.  \n\nix\n\n![](index-10_1.png)\
    \  \n\n## About the Technical Reviewer\n\n**Kacie Webster** is currently a data\
    \ analyst in the telecommunications industry. After graduating from San Diego\
    \ State University with a degree in statistics and economics, she completed a\
    \ data science bootcamp where she gained the skills to become a data professional.\
    \ As Kacie continues her journey, she enjoys the constant growth and change that\
    \ comes with the data world.  \n\nxi\n\n## Acknowledgments"
