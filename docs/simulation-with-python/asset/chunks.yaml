    3. Standard deviation (STD), which is represented by the horizontal error bar,\
    \ indicates the average deviation of a result from the sample mean. The standard\
    \ deviation is about 0.052.\n\nThe formula of a sample’s standard deviation reads\
    \ as follows:\n\n```\nSTD = sqrt( (1/(N-1)) * sum_{i=1}^{N} (x_i - x̄)^2 )\n```\n\
    \nHere, `x̄` represents the mean of the sample, and `N` is the total number of\
    \ samples. The standard deviation quantifies how confident we are about our result.\
    \ In general, the smaller the standard deviation is, the more concentrated our\
    \ results are around the mean; therefore, we are more confident about our results.\n\
    \nYou may also notice the beautiful curve of the histogram. There is a reason\
    \ behind that. Here is a brief teaser. The distribution of simulated π values\
    \ follows a so-called normal distribution. It is a consequence of the famous *central\
    \ limit theorem* (CLT). The key idea is that under a bunch of quite loose conditions,\
    \ quantities we observe in nature tend to follow a bell-curve distribution. Such\
    \ quantities include our weights of a rather large population, length of tree\
    \ leaves in a forest, etc.\n\nThe code snippet that generates the preceding visualizations\
