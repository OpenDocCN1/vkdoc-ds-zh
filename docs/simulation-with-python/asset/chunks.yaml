    \ Multi-agent Simulation\n- Chapter 8: Disease Spreading, Simulating COVID-19\
    \ Outbreak\n- Chapter 9: Misinformation Spreading and Simulations on a Graph\n\
    \n**Hard:**\n\n- Chapter 5: Percolation, Threshold, and Phase Change\n- Chapter\
    \ 6: Queuing System: How Stock Trades Are Made\n\nI hope you enjoy this book as\
    \ much as I do.\n\nxv\n\n## Chapter 1  \n**Calculating Pi with Monte Carlo Simulation**\n\
    \n### Background\n\nWhen Stanislaw Ulam, a Polish-American mathematician and nuclear\
    \ physicist, invented and formulated the modern Monte Carlo method in the 1940s,\
    \ he and his colleagues named the method Monte Carlo because Ulam’s uncle often\
    \ borrowed his relatives’ money to gamble in Monaco’s Monte Carlo Casino. Stanislaw\
    \ Ulam and many other brilliant scientists were working on the secret nuclear\
    \ weapon program now known as the Manhattan Project. The Monte Carlo method was\
    \ programmed to simulate nuclear reactions. To some degree, the Monte Carlo method\
    \ helped shape the world we see today.\n\nBefore theorems or algorithms take their\
    \ formal names in academics, they often have been studied by curious pioneers\
    \ using fun, example-based approaches. Let’s start with a story.\n\n### The Wise\
    \ Persons’ Competition\n\nSuppose one day in the 1500s, somewhere in the Middle\
    \ East, a king gave 24 hours to the two wisest persons, including you, in his\
    \ kingdom to calculate the value of π in the most elegant way. The king generously\
    \ promised any reasonable resources you want.\n\nπ is the ratio of the perimeter\
    \ and the diameter of a circle. Oftentimes, we also call the perimeter of a circle\
    \ circumference denoted with the letter *C*. The quantities are illustrated in\
    \ Figure 1-1.\n\n© Rongpeng Li and Aiichiro Nakano 2022\n\nR. Li and A. Nakano,\
    \ *Simulation with Python*, [https://doi.org/10.1007/978-1-4842-8185-7_1](https://doi.org/10.1007/978-1-4842-8185-7_1#DOI)\n\
    \n![](index-14_1.png)\n\n***Figure 1-1.** Notations for a circle*\n\nYour opponent\
    \ asked for the finest papers, strings, and rulers in the kingdom. He started\
    \ partitioning the circle immediately after the king announced the contest. His\
    \ approach was the same as the method that a Chinese mathematician *Chongzhi Zu*\
    \ used about 1000 years ago.\n\nWell, as in the 16th century, calculus was not\
    \ invented. What were you going to do, wise person? You were not sitting there\
    \ and letting your opponent win! Instead, you asked the king for 1000 persons\
    \ to help you with the calculation. You also asked for enough fine sand grains,\
    \ regular papers of size 10 inch by 10 inch, rulers, and strings. The king generously\
    \ approved your request with curiosity.\n\n### Estimating Pi by Sprinkling Grains\n\
    \nNow, you have 1000 men standing in line at your command. This is what you are\
    \ going to do. You asked each of them to draw the biggest circle inside the square\
    \ paper. After that, they were required to *randomly* sprinkle *1000* sand grains\
    \ on the paper. Each person was required to count carefully and record the number\
    \ of grains inside the circle. Of course, the grains might accidently fall outside\
    \ of the paper. In that case, the person was required to resprinkle until all\
    \ 1000 grains were on the paper.\n\nThe king was puzzled. You looked confident\
    \ because you knew your king was not a super math person, just like most readers\
    \ of this book, and easily got bored with plain equations. Your opponent had a\
    \ lot of geometrical gibberish to explain to the king.\n\n![](index-15_1.png)\n\
    \nYour opponent was using polygons’ perimeters to approximate the circle. As you\
