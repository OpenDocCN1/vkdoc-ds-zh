    We will start by setting the top two influential accounts as the sources of misinformation.
    Note that we can also control the *p* parameter in the *fast_gnp_random_*


    *graph* function to control the edge density. It is a crucial parameter because
    if *p* is very large, then every node is essentially connected with any other
    node. The misinformation reaches everyone in step one. We will see how it affects
    the simulation in detail.


    First, let me bundle our earlier code into several functions:


    def initialize(g, top_k = 5):


    tops = sorted(( (n, d) for n, d in g.out_degree()), reverse=True, key = lambda
    pair: pair[1])[:top_k]


    for node in g.nodes:


    g.nodes[node]["influence"] = len(list(g.neighbors(node))) if node in [pair[0]
    for pair in tops]:


    g.nodes[node]["state"] = State.SOURCE


    g.nodes[node]["resistance"] = None


    else:


    g.nodes[node]["state"] = State.SUSCEPTIBLE


    g.nodes[node]["resistance"] = np.random.random()


    def simulate(g, steps = 100, top_k = 5):


    initialize(g, top_k)


    res = []


    for _ in range(steps):


    g_copy = g.copy()


    Chapter 9 MisinforMation spreading and siMulations on a graph for node in g.nodes:


    update_state(g, g_copy, node)


    # copy state


    for node in g.nodes:


    g.nodes[node]["state"] = g_copy.nodes[node]["state"]


    res.append(count_states(g))


    return res


    def visualize(res):


    steps = range(1, len(res) + 1)


    susceptible = [r.get(State.SUSCEPTIBLE,0) for r in res]


    recovered = [r.get(State.RECOVERED,0) for r in res]


    infected = [r.get(State.INFECTED,0) for r in res]


    fig, ax = plt.subplots()


    ax.plot(steps, susceptible, label="susceptible")


    ax.plot(steps, recovered, label="recovered")


    ax.plot(steps, infected, label="infected")


    plt.legend()


    The *initialize* method assigns the *SOURCE* state to the *top k* most influential
    accounts in the graph. Other codes are quite straightforward.


    Now, let’s run the simulation for 20 steps and collect the statistics.


    For a normal graph, we use the following code to simulate it.


    g_normal = nx.fast_gnp_random_graph(n=1000, p=0.002, directed = True) res = simulate(g_normal,
    steps = 20, top_k = 5)


    visualize(res)


