    \n**Chapter 2 Markov Chain, a Peek into the Future**\n\n***Table 2-1.** Weather\
    \ Transition Probabilities*\n\n| | **Sunny** | **Cloudy** | **Rainy** |\n|---|---|---|---|\n\
    | Sunny (next hour) | | | |\n| Cloudy (next hour) | | | |\n| Rainy (next hour)\
    \ | | | |\n\nThe way to interpret the table is to read it column-wise. For example,\
    \ if the current weather is sunny, then the probability of the next hour’s weather\
    \ being cloudy is `1/3`. This is indicated by the second row in the first column\
    \ (besides the row name column).\n\nWe can also denote this probability by the\
    \ *transition probability* notation. Let’s use `si` to denote the state of the\
    \ weather at hour `i`. Then the previous transition probability can be denoted\
    \ as follows:\n\n`P(s_cloudy | s_sunny)`\n\n`P(cloudy | sunny)`\n\nWe used the\
    \ notation of conditional probability in the expression `P(s1 = cloudy | s0 =\
