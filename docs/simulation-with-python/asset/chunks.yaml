    \ that the depths around the current market price are smaller. The visualizations\
    \ are left to you as an exercise. See the following section for details.\n\n##\
    \ Exercises and Extension Ideas\n\nIn this section, I will lay out five ideas\
    \ that can significantly extend the functionalities of our stock exchange. They\
    \ are ordered according to their levels of difficulty.\n\n### Multiple Bots\n\n\
    In our simulation, we only use one bot so basically we are trading with ourselves,\
    \ which makes no sense. You can extend the order’s data schema to allow a new\
    \ field called `bot_id` or `investor_id` such that only different bots can trade\
    \ with each other.\n\nNote that the bots’ IDs need to be a limited set. You can\
    \ simulate arbitrage cases, which means a bot can submit a buy order and a sell\
    \ order at the same time to profit from the price volatility.\n\n### An Informed\
    \ Bot\n\nAn intelligent investor will not trade blindly. They need to know what\
    \ the current *market price* is in order to make a wise decision. The match engine\
    \ can send the latest price to an external *monitor* so every bot can check it.\n\
    \n### Order Book Visualization\n\nThe `print_orderbook` method is not good enough.\
    \ Let’s replace it with a new `visualize_orderbook` method. Can you make an animation\
    \ out of it?\n\n### Order Cancellation Support\n\nLet’s support the order cancellation\
    \ functionality. If a bot requests to cancel an order, maybe through a different\
    \ *resource path* called `/cancel`, the match engine should be able to locate\
    \ the order quickly and kick it out of the queue for that price. Can you think\
    \ of a way to do this efficiently?\n\n### Stop Orders Support\n\nSince order cancellation\
    \ is supported, why not take one step further to support the stop orders? If a\
    \ bot submits a stop loss order, the match engine should only execute the order\
    \ when the price hits the stop loss line. Do your own research and implement this\
    \ feature efficiently and fairly to all market participants.\n\n## Summary\n\n\
    In this chapter, we studied a queue system. A simulation like this is not only\
    \ technical but also social. The match engine should operate based on a set of\
    \ rules to enforce fairness.\n\n---\n\n# Chapter 7: Rock, Scissors, and Paper:\
    \ Multi-agent Simulation\n\nWe have touched so many different kinds of simulations\
    \ so far. There is another very important type called agent-based simulation (ABS).\
    \ Sometimes, it is also referred to as agent-based modeling (ABM). Agent-based\
    \ simulation is an umbrella term that you can categorize a lot of context-specific\
    \ or domain-specific simulations as agent-based simulation.\n\nWhat these simulations\
    \ have in common is that they all simulate the actions and most importantly interactions\
    \ between so-called autonomous agents and the environment. An agent is just a\
    \ minimal unit that can take actions. An environment is the collection of external\
    \ factors, including other agents. For example, our simulation of the stock exchange\
    \ in Chapter 6 can be treated as an agent-based simulation if you implemented\
    \ the first extension: adding more than one bot. Different bots interact with\
    \ each other according to the rules set by the match engine. We focused on the\
    \ implementation of the rules though.\n\nAgent-based simulation is especially\
    \ important to understand *emerging behavior*, which means nontrivial phenomena\
    \ can emerge from trivial rules that govern the actions of agents. For example,\
    \ the formation of large protein molecules from amino acids is still a mystery\
    \ although the single amino acid seems pretty simple. In the financial market,\
    \ different investors behave to maximize their own interest. The intention seems\
    \ straightforward, but collectively the actions may lead to unexpected crashes.\n\
    \nNow let’s dive into it.\n\n© Rongpeng Li and Aiichiro Nakano 2022\nR. Li and\
    \ A. Nakano, *Simulation with Python*, https://doi.org/10.1007/978-1-4842-8185-7_7\n\
    \n## Community Formation on a Street\n\nFirst, let’s build a simplest agent-based\
    \ simulation from scratch: the Schelling model of segregation. This is a model\
    \ by economist Thomas Schelling. The idea is simple; without external factors,\
    \ people in a region will move or stay in their original spots according to their\
    \ similarities with their neighborhoods. Ultimately, different communities will\
    \ form spontaneously.\n\nYou may recognize that the idea has common characteristics\
    \ as the forest fire percolation model we discussed in an earlier chapter. That’s\
    \ right. They are both on a *grid* with *agents* or *nodes* as elements to change\
    \ state. However, different from the forest fire one in which a predefined probability\
    \ controls the behavior of a node, people make decisions to move or stay dynamically\
    \ as the environment changes in Schelling’s model.\n\nFor simplicity, we study\
    \ the Schelling model on a one-dimensional *street* rather than a two-dimensional\
    \ *community*. The plain English description of the question is the following:\
    \ suppose there is a street with *N* rental properties; some of them are occupied,\
    \ and some are open to move in. Let’s make an assumption that there is no cost\
    \ to change properties. There are two kinds of people, *A* and *B*. Both kinds\
    \ of people love to stay with their own kind. If both their neighbors are of different\
    \ kinds, they will pick an unoccupied property and move there until the majority\
    \ of people are happy with their neighbors.\n\nLet’s use a `list` data structure\
    \ to model the street and use `0` to indicate that a spot/rental property is not\
    \ occupied. We will use `-1` and `1` to indicate a property that is occupied by\
    \ group *A* or group *B* people. Note this choice is for visualization simplicity\
    \ as we can easily check the formation of clusters by a scatter plot.\n\nThe first\
    \ version looks straightforward:\n\n```\nN = 300\nOCCUPATE_RATE = 0.9 # 90% are\
    \ occupied originally\nAB_RATIO = 1 # RATIO of A to B\nROUNDS = 100\n\nstreet\
    \ = np.array([0 for _ in range(N)])\n\nfor idx, house in enumerate(street):\n\
    \    if np.random.rand() < OCCUPATE_RATE:\n        street[idx] = -1 if np.random.rand()\
    \ < AB_RATIO/(1+AB_RATIO) else 1\n```"
