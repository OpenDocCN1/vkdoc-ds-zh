    **Exercises and Extension Ideas**


    In this section, I will lay out five ideas that can significantly extend the functionalities
    of our stock exchange. They are ordered according to their levels of difficulty.


    **Multiple Bots**


    In our simulation, we only use one bot so basically we are trading with ourselves,
    which makes no sense. You can extend the order’s data schema to allow a new field
    called *bot_*


    *id* or *investor_id* such that only different bots can trade with each other.


    Note that the bots’ IDs need to be a limited set. You can simulate arbitrage cases,
    which means a bot can submit a buy order and a sell order at the same time to
    profit from the price volatility.


    Chapter 6 Queuing SyStem: how StoCk tradeS are made **An Informed Bot**


    An intelligent investor will not trade blindly. They need to know what the current
    *market* *price* is in order to make a wise decision. The match engine can send
    the latest price to an external *monitor* so every bot can check it.


    **Order Book Visualization**


    The *print_orderbook* method is not good enough. Let’s replace it with a new *visualize_*


    *orderbook* method. Can you make an animation out of it?


    **Order Cancellation Support**


    Let’s support the order cancellation functionality. If a bot requests to cancel
    an order, maybe through a different *resource path* called */cancel*, the match
    engine should be able to locate the order quickly and kick it out of the queue
    for that price. Can you think of a way to do this efficiently?


    **Stop Orders Support**


    Since order cancellation is supported, why not take one step further to support
    the stop orders? If a bot submits a stop loss order, the match engine should only
    execute the order when the price hits the stop loss line. Do your own research
    and implement this feature efficiently and fairly to all market participants.


    **Summary**


    In this chapter, we studied a queue system. A simulation like this is not only
    technical but also social. The match engine should operate based on a set of rules
    to enforce fairness.


    **CHAPTER 7**


    **Rock, Scissors, and**


    **Paper: Multi-agent**


    **Simulation**


    We have touched so many different kinds of simulations so far. There is another
    very important type called agent-based simulation (ABS). Sometimes, it is also
    referred to as agent-based modeling (ABM). Agent-based simulation is an umbrella
    term that you can categorize a lot of context-specific or domain-specific simulations
    as agent-based simulation.


    What these simulations have in common is that they all simulate the actions and
    most importantly interactions between so-called autonomous agents and the environment.
    An agent is just a minimal unit that can take actions. An environment is the collection
    of external factors, including other agents. For example, our simulation of the
    stock exchange in Chapt[er 6 c](https://doi.org/10.1007/978-1-4842-8185-7_6)an
    be treated as an agent-based simulation if you implemented the first extension:
    adding more than one bot. Different bots interact with each other according to
    the rules set by the match engine. We focused on the implementation of the rules
    though.


    Agent-based simulation is especially important to understand *emerging behavior*,
    which means nontrivial phenomena can emerge from trivial rules that govern the
    actions of agents. For example, the formation of large protein molecules from
    amino acids is still a mystery although the single amino acid seems pretty simple.
    In the financial market, different investors behave to maximize their own interest.
    The intention seems straightforward, but collectively the actions may lead to
    unexpected crashes.


    Now let’s dive into it.


