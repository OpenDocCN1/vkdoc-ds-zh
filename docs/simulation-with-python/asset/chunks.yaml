    \ the ball and the value of `delta`?\n2.  Can you increase the frame rate (fps)\
    \ of the animation? Does it look more realistic?\n\n## Multiple Balls in a 2-D\
    \ Box\n\nNow, let’s talk about the case of multiple balls. Besides the possibility\
    \ of wall-ball collision, we can also have collisions between balls. This introduces\
    \ two new problems:\n\n1.  How to detect the collision between balls?\n2.  How\
    \ do balls behave when they collide?\n\nIf you think about the first problem,\
    \ if there are 100 balls in a box, then theoretically the between-ball collision\
    \ is an *n*^2 operation like in the thousands, naively. This becomes unhandleable,\
    \ therefore unacceptable, quickly. You don’t want the magnitude of calculation\
    \ to grow quadratically. However, since the majority of balls won’t have a chance\
    \ to collide with each other, we may want to use a more efficient algorithm to\
    \ detect or predict the collision between balls.\n\nLet’s solve the second problem\
    \ first. It seems easier compared to the first one, isn’t it?\n\n### Update of\
    \ Positions and Velocity upon Collision\n\nThere are two physics laws that govern\
    \ the movement of purely elastic balls: the law of conservation of momentum and\
    \ the law of conservation of energy. In the simulation of wall-ball collision,\
    \ we assume the wall has infinite mass so the momentum of the ball is forcefully\
    \ reversed by the wall while preserving the energy of the ball. Since the ball’s\
    \ energy is the sum of kinetic energy and potential energy, if we introduce gravity,\
    \ the speed of the ball is unchanged.\n\nFor the ball-ball collision, things become\
    \ a little bit complicated. We are not going to deduce the formulas in detail,\
    \ but we can do some back-of-the-envelope analysis after checking the formulas.\n\
    \nChapter 4 Balls in a 2-D Box, a simple physics engine\n\nLet’s denote the center\
    \ of the two balls as *c*1 and *c*2, the radius of the two balls as *r*1 and *r*2,\
    \ and the velocity of the two balls as *υ*1 and *υ*2. We will use the prime notation\
    \ 1 and 2 to denote the velocities of the balls after the collision. Different\
    \ from the case of wall-ball collision, we also need to consider the masses of\
    \ the two balls. This agrees with our intuition because even a fast ping-pong\
    \ ball is not going to move a golf ball much.\n\nLet’s call them *m*1 and *m*2.\n\
    \nNow, the two physics laws that govern the motion are listed as follows: the\
    \ conservation of momentum and the conservation of energy.\n\n*m*1 *υ*1 + *m*2\
    \ *υ*2 = *m*1 *υ*1' + *m*2 *υ*2'\n\n*m*1 *υ*1^2 + *m*2 *υ*2^2 = *m*1 *υ*1'^2 +\
    \ *m*2 *υ*2'^2\n\nNote that all the velocities are vectors rather than scalars.\
