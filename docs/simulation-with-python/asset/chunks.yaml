    In addition to this simple trajectory, there may be other trajectories as well
    which increases the complexity of the system. However, before diving into those
    ones, let’s start with an even simpler model, the SI model: the *susceptible-infected
    model*.


    **The SI Model**


    The SI model doesn’t have a *recovered* category; people are either susceptible
    or infected. A susceptible person can get infected, and an infected person may
    recover from it. The disease is usually not deadly with a quite low death rate,
    but it is just not going anywhere. Figur[e 8-2 sho](#index_split_001.html#p140)ws
    the bidirectional relationship of the susceptible and infected populations.


    ***Figure 8-2.** The population migration of susceptible and infected populations*
    The changes from and to one category to another depend on the interaction between
    people belonging to each group. Let’s use *S(t)* and *I(t)* to denote the population
    of these two groups at timestamp *t*. How will they change after a timestep, say
    one hour or one day, whichever unit we prefer to define the modularity in the
    time domain? I will use day as our time unit as it makes more real-life sense
    to collect statistics daily rather than hourly.


    Imagine a small community; at the very beginning, there are *S(0)* people who
    are susceptible and *I(0)* people who are already infected. Each of the susceptible
    people has a *chance* to interact with any of the infected people. It is a combination
    question. If there are five susceptible persons and four infected, then theoretically
    there are 20 ways for them to interact.


    Chapter 8 Disease spreaDing, simulating COViD-19 Outbreak Technically, not every
    interaction leads to infecting susceptible persons, so there is a ratio. Let’s
    use *α* to denote such a ratio. The newly infected people will be *αSI*.


    On the other hand, the infected persons will also have a chance to get rid of
    the infection and become susceptible again. This change is independent of susceptible-infected
    interaction. Let’s assign a ratio *β* to this process.


    In summary, this is how the populations of the two categories evolve in time:
    *S* ( *t* + )


    1 = *S* ( *t*) −α *S* ( *t*) *I* ( *t*) + β *I* ( *t*) *I* ( *t* + )


    1 = *I* ( *t*) −α *S* ( *t*) *I* ( *t*) + β *I* ( *t*) These two equations are
    called difference equations as we are modeling the differences of quantities.
    A continuous version of the equations is called differential equations; they are
    defined as follows:


    *dS* = −α *S*( *t*) *I*( *t*)+ β *I*( *t*) *dt*


    *dI* = −α *S*( *t*) *I*( *t*)+ β *I*( *t*) *dt*


    The differential equations can be solved analytically, but let’s focus on the
    difference equations.


    Remember that the total population is fixed, so we can further simplify the two
    difference equations into one. We use *N* to denote the total population. The
    constraint states that for any time *t*, we have *N* = *S*( *t*) + *I*( *t*).


    Therefore, we can rewrite the expression of S(t+1) as


    *S* ( *t* + )


    1 = *S* ( *t*) −α *S* ( *t*)( *N* − *S* ( *t*)) + β ( *N* − *S* ( *t*)) then


    *S* ( *t* + )


    1 = α *S* ( *t* ) + (1− α *N* − β ) *S* ( *t* ) + β *N*


    It looks straightforward enough. Let’s write some code now:


    N = 1000


    beta = 0.01


    alpha = 0.001


