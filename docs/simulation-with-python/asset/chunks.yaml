- fmt: '# The Result of Changing Winning Probabilities


    The result can be drastically different if you change the ground truth of the
    winning probabilities. Change it and see how it influences the performance of
    these two strategies. How about more slot machines like `5` or `10`?


    If Bob is aggressive, he will go for a pure greedy approach. If Bob is more cautious,
    he can try the greedy-epsilon approach to avoid low-probability but catastrophic
    regret values.


    ## An Improved Greedy-Epsilon Algorithm


    One issue with the naive greedy approach is that it doesn’t take the slot machine’s
    performance into consideration when making a random choice. We can solve this
    problem by adopting the so-called *softmax* strategy. The idea is that we introduce
    a parameter, mimicking the quantity temperature in physics, called `τ`. The higher
    the temperature `τ` is, the more random the choice becomes. At `τ ≈ 0`, our strategy
    should reduce to the naive greedy approach. At `τ ≈ ∞`, our strategy should reduce
    to the random choice strategy.


    The formula reads as follows:


    `p(i,t) = e^(p(i,t)) / Σ e^(p(i,t))`


    Here, `p(i,t)` represents the observed winning probability of slot machine `i`
    at time `t`.


    For example, if at step `100`, Bob has played slot machine `1` for `11` times
    and he won `4` times, then `p(1,100) = 4/11`.


    What does the name *softmax* mean? If we expand the expression in the three slot
    machine cases and assume the first slot machine performs the best so far, we can
    then manipulate the value of the temperature `τ` to see its influence on our next
    round’s pick.


    For example, when `τ` approaches infinity, we have the following:


    `p(1,t) / Σ p(i,t) = e^(p(1,t)) / (e^(p(1,t)) + e^(p(2,t)) + e^(p(3,t))) ≈ 1/3`


    This means that at very high temperatures, the algorithm reduces to the baseline
    random strategy no matter how far slot machine 1 outperforms others.


    Let’s see another extreme case when the temperature `τ` is set close to `0`:


    `p(1,t) / Σ p(i,t) = e^(p(1,t)/τ) / (e^(p(1,t)/τ) + e^(p(2,t)/τ) + e^(p(3,t)/τ))`


    Because `p(1,t)` is the largest value, expression like `e^(p(2,t)/τ)` essentially
    becomes `e^(-∞)` which is zero. This means our algorithm reduces to the naive
    greedy approach.


    Feel free to tweak the value of `τ` and see how it affects the performance of
    the strategy.


    The biggest improvement of this strategy is that it will prioritize the best performers
    but make room for the catch-ups to give a try.


    ## Exercises


    1. Try the greedy approach with different numbers of evaluation steps. Try smaller
    ones like `5` and larger ones like `20`. You may need to run the simulation multiple
    times to get a statistically consistent result.


    2. Study how the true probabilities influence the performance of different strategies.
    We have been using `probs = [0.5, 0.3, 0.2]` all the time. How about other choices
    of probabilities?


    ## The Bayesian Way, a Primer on Bayesian Statistics


    Now, let’s go back to the ideal case that Bob has enough money to keep playing
    until dawn. How can Bob update his estimation of the winning probabilities of
    the multiple slot machines while playing? What are our best estimates of the winning
    probabilities of the multiple slot machines? Can Bob get a *distribution* of their
    winning probabilities rather than a single value? The answer is *yes*, and Bob
    needs Bayesian statistics to optimize our estimation.


    The core idea in the slot machine context is that Bob will initially hold a belief
    of the winning probabilities’ distributions. Let’s say one machine’s winning probability
    `p` has a distribution called `prior(p)`. Then, Bob will update his belief by
    observing the actual winning probabilities of the multiple slot machines to get
    an updated distribution called `posterior(p)`. `p` is the winning probability
    being modeled, while the number of winning or losing is the observation. For a
    given probability, the observation will follow a Binomial distribution. Recall
    that `Binomial(k | n, p) = (n choose k) * p^k * (1-p)^(n-k)` is the probability
    of observing `k` successes in an `n` rounds Binominal experiment with an underlined
    probability `p`.


    A prior distribution is nothing fancy but a *belief*. Let’s say you were born
    in the United States and believed the United States has the spiciest pepper in
    the world when you were young. Therefore, `P(U.S. has spiciest pepper) = 1` was
    your prior belief. Then you traveled around the world and found that Mexico has
    pretty spicy pepper. Then your *observation* updates your belief to `P(U.S. has
    spiciest pepper) = 0.5`. Then you tried some Indian pepper, and your belief changed
    to `P(U.S. has spiciest pepper) = 0.3`. You keep doing this, and your previous
    round’s belief gets updated as observations come in.


    In Bob’s case, the observations depend on the parameter `p` that we keep updating.


    The update rule is as follows:


    `posterior(p) ∝ likelihood(p|x) * prior(p)`


    Recall that the Bayesian theorem states that for arbitrary events, we have `P(A|B)
    = P(B|A) * P(A) / P(B)`


    Mapping this formula to Bob’s game, we can see `A` is essentially the underlying
    parameter `p` and `B` is the pulling result. Since the observations are *fact*
    that we see, `P(B)` is independent of our choice of `A`. Just think of it in Bob’s
    scenario. Bob doesn’t care about the winning probability’s distribution if he
    comes from the future and already knows his win or loss, right?


    Unfortunately, the Bayesian’s updating rule needs to be calculated precisely because
    we are interested in the exact distribution of `p`. The Bayesian updating rule
    is not a simple one, and its computation can be very expensive especially in the
    continuous case. What we want now is to find a nice-behaving distribution of `prior(p)`
    such that the updated is also nice-behaving so the update rule can be computed
    quickly and sequentially.


    Does such a nice prior distribution exist? Yes! It is called a *conjugate prior*
    of the likelihood distribution. Here, the likelihood function is the Binomial
    distribution, and its conjugate prior is called the *Beta* distribution parameterized
    by two parameters, `α` and `β`: `B(α, β)`.


    The Beta distribution is a generalization of the Binomial distribution. Let’s
    take a look at some examples in Figure 3-4.


    ![Figure 3-4](index-60_1.png)


    **Figure 3-4.** Beta distributions with different sets of parameters


    It is very similar to the Binomial distribution. If `α` and `β` are the same,
    the distribution is symmetric. If both parameters are larger, the distribution
    is more centric. If `α` is larger than `β`, the distribution is left skewed and
    vice versa.


    If we plug in the Beta distribution’s formula into the update rule, we get the
    following result:


    `posterior(p) ∝ likelihood(p|x) * prior(p)`


    `posterior(p) ∝ Binomial(k; n, p) * B(p; α, β)`


    Expand the expression for Binomial and Beta distributions:


    ```

    posterior(p) ∝ (n choose k) * p^k * (1-p)^(n-k) * (1/B(α,β)) * p^(α-1) * (1-p)^(β-1)

    posterior(p) ∝ p^(α+k-1) * (1-p)^(β+n-k-1)

    posterior(p) ∝ B(p; α+k, β+n-β)

    posterior(p) = B(p; α+k, β+n-k)

    ```


    Here, we have `B(α,β) = Γ(α) * Γ(β) / Γ(α+β)` where `Γ(x)` is the gamma function.
