    ```\n\n## Chapter 5: Percolation, Threshold, and Phase Change\n\nNow, let’s get\
    \ down to the key question. Given a varying occupation probability `p` and independence\
    \ between sites (or bonds), when will a cluster percolate through our grid from\
    \ the top edge to the bottom edge?\n\n### Percolation and the Critical Probability\n\
    \nWell, mathematicians are more interested in another question: When will an infinite\
    \ cluster form with certainty for an infinitely large cluster? From the perspective\
    \ of simulation, we can’t simulate an infinitely large grid, but we can approach\
    \ this problem by answering the easier question we asked earlier. If a cluster,\
    \ with probability of 100%, can’t percolate through the grid, then an infinite\
    \ cluster is not possible.\n\nLet’s call such a threshold probability `pc` where\
    \ `c` stands for critical.\n\n### An Analytical Solution for the 1-D Case\n\n\
    Although this book is about simulation, I want to show you how the 1-D case is\
    \ solved analytically.\n\nFor either site percolation or bond percolation in 1-D,\
    \ the critical probability `pc` is 1. It is easy to visualize; there is one and\
    \ only one way to form an infinite cluster in 1-D. Therefore, any probability\
    \ smaller than 1 will stop the formation of an infinite cluster.\n\nLet’s say\
    \ the probability that a cluster with size `L` exists is denoted by `P(p, L)`,\
    \ then the critical probability must satisfy the following equation:\n\n```\n\
    lim_{L→∞} P(p, L) = { 0  p < pc, 1  p > pc }\n```\n\nLuckily, the exact expression\
    \ of `P(p, L)` is easy to derive:\n\n```\nlim_{L→∞} P(p, L) = lim_{L→∞} p^L =\
    \ { 0  p < 1, 1  p = 1 }\n```\n\nTherefore, our critical probability `pc` is 1.\n\
    \nFrom 1-D to 2-D, the difficulty of analytical derivation increases dramatically.\
