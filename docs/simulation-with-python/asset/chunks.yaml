    **The SIR Model**


    Now, let’s take one step further to include the *recovered* group. The definition
    of *recovered* can be further extended later. However, for now, let’s first assume
    that there is only one possible way to get people *recovered*: to get infected,
    then recover with immunity.


    Chapter 8 Disease spreaDing, simulating COViD-19 Outbreak We introduce another
    variable *R*( *t*) to denote the total number of recovered people.


    It follows the following difference equation. We have a *recovery rate* denoted
    by *γ*. People who recover will have *permanent* immunity.


    *R*( *t* + )


    1 = *R*( *t*) + γ *I* ( *t*)


    The restriction of our community population therefore becomes


    *N* = *S* ( *t*) + *I* ( *t*) + *R*( *t*) Let’s start with a small *γ* without
    any recovered population. What do you expect?


    The code is very similar to the one we had earlier, but this time we will explicitly
    update the three groups:


    N = 1000


    beta = 0.01


    alpha = 0.0001


    gamma = 0.0001


    Ss = [500]


    Is = [500]


    Rs = [0]


    Steps = 50


    for _ in range(Steps):


    s, i, r = Ss[-1], Is[-1], Rs[-1]


    s_next = s - alpha*s*i + beta*i


    i_next = i + alpha*s*i - beta*i - gamma*i


    r_next = r + gamma*i


    Ss.append(s_next)


    Is.append(i_next)


    Rs.append(r_next)


    with plt.xkcd():


    plt.scatter([i for i in range(Steps+1)],Ss, label = ''susceptible'') plt.scatter([i
    for i in range(Steps+1)],Is, label = ''infected'') plt.scatter([i for i in range(Steps+1)],Rs,
    label = ''recovered'') plt.title(r"SIR model for small $\gamma$")


    plt.xlabel("Days")


    plt.ylabel("Sizes of Groups")


    plt.legend()


