- fmt: 'First, sell orders with a lower price have priority over sell orders with
    a higher price.


    By the same token, buy orders with a higher price have priority over buy orders
    with a lower price. However, this is only true for the so-called `limit order`.
    The `market order` is special because it will accept any prices. For example,
    a market buy order will match the sell orders from the lowest price to higher
    price until the requested amount of shares in the buy order has been all filled,
    which may significantly push the `market price`, the price every participant sees,
    higher.


    On the other hand, there are `stop loss` orders and `stop profit` orders. Such
    orders will be triggered when the price hits a certain level. For example, a stop
    loss order will be executed once the price drops to a certain level to control
    the loss. We won’t cover such types of orders in this chapter, but readers are
    encouraged to implement them as extensions of our simulation.


    Second, if the prices are the same, orders that were submitted earlier have higher
    priority. Note that in principle there won’t be two orders with the exact same
    submitting time so there will always be an order to rely on.


    As orders come in, the order book will dynamically change; the volume of orders
    at a certain price level is called the `depth`. The deeper the depth is, the more
    interest there is for buying or selling the stocks. As we discussed earlier, the
    orders with a price closer to the `market price` will have higher priority than
    the orders further away from it. Therefore, the order book will always look like
    a `valley` with fast changing depths. GIF [6-1](#index_split_001.html#p108) illustrates
    it clearly.


    **GIF 6-1.** Order book depth dynamics


    Chapter 6 Queuing SyStem: how StoCk tradeS are made Note that in real life, if
    an order hasn’t been executed by the match engine, the investors can always request
    to cancel the order. However, we won’t implement this part either in this chapter.
    You can give it a try; it is not as hard as you may think.


    ## Create the Interfaces and Determine the Data Schema


    Alright! We are ready to build a match engine now. First, let’s create an `endpoint`
    that can accept orders. To do that, we are going to use `flask` to build a simple
    API (application programming interface). An API exposes certain functionality
    to external users and other programs. In our case, our API does one thing: accept
    the incoming order.


    If you haven’t tried `flask` earlier, here is an example to get you started.


    Let’s install the two libraries we are going to use first:


    ```

    pip3 install flask, requests

    ```


    Next, create an `engine.py` file with your favorite editor; copy and paste the
    following code:


    ```

    from flask import Flask


    app = Flask(__name__)


    @app.route(''/submit'', methods = [''GET''])


    def process_order():


    return ''<h1>order received</h1>''


    def main():


    app.run(host=''localhost'', port=8080, debug=True)


    if __name__ == ''__main__'':


    main()

    ```


    Now, run this flask `app` in the command line by typing


    ```

    python engine.py

    ```


    ![](index-110_1.png)


    Chapter 6 Queuing SyStem: how StoCk tradeS are made


    You should see the following messages. Note that your exact `debugger PIN` may
    be different from mine.


    ```

    * Serving Flask app ''app'' (lazy loading)

    * Environment: production


    WARNING: This is a development server. Do not use it in a production deployment.

    Use a production WSGI server instead.


    * Debug mode: on

    * Running on http://localhost:8080/ (Press CTRL+C to quit)

    * Restarting with stat

    * Debugger is active!

    * Debugger PIN: 374-303-372

    ```


    We just created the simplest web app! If you open your browser and navigate to
    `http://localhost:8080/submit`, you will see a message as in Figure [6-1](#index_split_001.html#p110).


    **Figure 6-1.** Order received message from the website


    Very cool!


    With less than ten lines, we created an endpoint, with the `process_order` function,
    that users can visit and interact with our application. Our application does only
    one thing: it returns some `bytes` that a browser will interpret as a string with
    level 1 heading.'
