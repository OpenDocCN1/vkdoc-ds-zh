    **Summary**


    In this chapter, we modeled the interaction between different groups during a
    pandemic outbreak. We simplified the assumptions of the pathogen transmission
    process and introduced the susceptible-infected (SI) and susceptible-infected-recovered
    (SIR) models. From the simulation, we can clearly see how different factors influence
    the virus transmission process and how vaccination can help communities reach
    herd immunity.


    **CHAPTER 9**


    **Misinformation Spreading**


    **and Simulations**


    **on a Graph**


    Misinformation has never been so deadly in the age of COVID-19\. On social networks
    like Twitter and Facebook, conspiracy theories about the origin of the virus,
    the treatment of the virus, and vaccination are rampaging. They often spread in
    communities and circles and echo with other conspiracy theories about the US


    presidential elections. Such misinformation and conspiracy theories reinforce
    each other and form a waterproof *echo chamber*.


    Misinformation and disinformation are quite similar. The difference is that disinformation
    is false information that is spread deliberately to deceive. In other words, disinformation
    is wrong *on purpose*. Misinformation is a super set of disinformation.


    The spreader of misinformation may be unaware of the incorrectness or harmfulness
    of the wrong information. In this chapter, we will study how misinformation spreads
    with a network/graph setting.


    **Model the Social Network**


    We have studied some network-like systems earlier like the state transition of
    the Markov model and the forest fire spreading model. In the Markov model of poem
    generation, we treat each word as a node, and each node has a probability to be
    followed by another one, thus forming a network of words with *directional* edges.


    © Rongpeng Li and Aiichiro Nakano 2022


    R. Li and A. Nakano, *Simulation with Python*, [https://doi.org/10.1007/978-1-4842-8185-7_9](https://doi.org/10.1007/978-1-4842-8185-7_9#DOI)


    ![](index-150_1.png)


    Chapter 9 MisinforMation spreading and siMulations on a graph In the forest fire
    spreading model, each tree is neighbored by four nearest trees on a square grid.
    Fire can spread from one tree to another with a predefined probability. The network
    is somewhat homogeneous because they all have four neighbors, except the boundary
    ones, and no tree is special than another in any way.


    In this chapter, we will study *general* networks that can represent arbitrary
    connectivity of a community. Let’s first introduce some terminologies.


    So far, I have been using network and graph interchangeably in this chapter. Their
    definition differences are usually subject to the underlined scientific domains.
    For example, sometimes people use *links* instead of *edges* in networks, but
    they essentially represent the same thing. For consistency with other literature,
    I will use graphs for the following content.


    A graph is consistent with *nodes* and *edges*. For example, Figure [9-1](#index_split_001.html#p150)
    has five nodes and six edges.


    ***Figure 9-1.** A simple graph with five nodes and six edges* The graph in Figure
    [9-1](#index_split_001.html#p150) is also a *connected* graph because you can
    reach any node to any other by traversing the edges. This is not always true.
    The graph in Figure [9-2](#index_split_001.html#p151) is a disconnected graph.


    ![](index-151_1.png)


    Chapter 9 MisinforMation spreading and siMulations on a graph


    ***Figure 9-2.** A disconnected graph example*


    This graph has five disconnected *clusters* (also called *communities*). They
    are not connected through edges.


    A common misconception is the definition of *subgraph*. Any subset of nodes and
    edges from one graph will form a subgraph. Those nodes and edges may not be *visually*
    forming a *cluster*. For example, in the five-cluster graph earlier, node 1 forms
    a single-node subgraph, while nodes 1, 2, 3, and 6 together with the edge between
    2 and 6 also form a four-node subgraph, although a weird one in three visually
    disconnected clusters.


    A graph’s edge can also be directional, which makes a graph *directional*. For
    example, the Twitter following relationship is a directional relationship. You
    may follow a super star, but the super star is not likely to follow you back.
    If two Twitter accounts follow each other, then there must be *two* edges between
    them to represent such a relationship: one from one to the other and the other
    way around. We call such a graph which allows multiple edges between nodes a *multigraph*.
    Oftentimes, multigraphs represent directional relationships but not always.


    Figur[e 9-3 is a dir](#index_split_001.html#p152)ectional multigraph. The edges
    are directional, and multiple edges are allowed. For example, there are two edges
    between nodes 2 and 3\. Another interesting edge is the *loop* edge that points
    to the node itself for nodes 0, 1, and 2\. With proper modeling, a loop can represent
    a tweet’s self-retweet or similar actions. Figur[e 9-3](#index_split_001.html#p152)


    is a directed graph example.


    ![](index-152_1.png)


    Chapter 9 MisinforMation spreading and siMulations on a graph


    ***Figure 9-3.** A directed graph with self-loops*


    Nodes and edges can also have attributes. For example, nodes can have weights
    that indicate how influential they are in the graph, while edges’ weights can
    represent how strong the bondings are between two nodes. To model a social network,
    we need to assign certain attributes to graph elements, either intrinsic or calculated.


    Let’s define our social network, specifically the Twitter ecosystem, using a graph.


    Each node represents an account, and each edge represents a following relationship.


    Information can therefore flow from the followee to the follower through posting
    tweets.


    Think about the properties of a Twitter account. The most important indicator
    of an account’s influence is the number of followers; in our case, it is exactly
    the number of outgoing edges. In graph theory, it has a name: *out-degree*, the
    number of outgoing edges. Similarly, the *in-degree* counts the number of incoming
    edges. The larger the out-degree is, the more accounts on the social network can
    be potentially influenced.


    We want to also borrow some concepts from the previous chapter. We will partition
    the nodes into three categories, besides the sources of misinformation, like in
    the *susceptible, infected, and recovered* model. The susceptible are accounts
    who haven’t been exposed to misinformation; they have a probability to be infected
    if the people they follow are the sources of the misinformation or infected. The
    infected nodes are like the infected patients in the disease spreading simulation
    that they actively influence their followers by retweeting and sharing misinformation.
    The *recovered* nodes are accounts who either intrinsically resist, *R* for both
    *resistance* and *recovered*, misinformation or recover from misinformation pollution.


    In summary, we use the properties in Ta[ble 9-1 t](#index_split_001.html#p153)o
    characterize a node on the graph.


