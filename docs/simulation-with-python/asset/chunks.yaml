- fmt: '# 股票交易所模拟系统


    股票交易所是一个迷人的系统，人们在其中交易股票并希望从交易中获利。在电子交易出现之前的旧时代，经纪人会聚在一起，通过互相喊叫来代表客户交易股票。如今，一切都变得电子化。散户投资者可以使用移动应用程序或网络应用程序进行交易。


    在本章中，我们将构建一个系统来模拟股票交易所并可视化订单簿。此模拟的关键在于处理订单排队。例如，有些订单提交得早，而另一些则提交得晚但价格更低。在这种情况下，我们需要正确确定订单优先级。另一方面，我们还需要管理消息广播。在现实中，投资者可以看到由股票交易所广播的实时股票价格变化。


    ## 交易流程基础


    首先，让我们分解交易流程，以确定应模拟哪些实体和流程。


    一笔成功交易包含三个主要部分。首先，投资者向交易所发送订单。然后，`match engine`（撮合引擎）接收订单并尝试找到订单的对手方。例如，如果新卖单进入，`match
    engine`将尝试在排队订单中找到一个现有买单来匹配该新卖单。在接下来的第三步中，有两种可能性。如果成功找到匹配，交易将完成，交易成功的消息将广播给原始投资者，同时由于交易可能导致最新价格变化，市场上所有投资者也将获得新的价格。如果没有成功找到匹配，新卖单也将排队，直到未来有交易进入。投资者还可以请求撤销他们已排队的订单。


    © Rongpeng Li and Aiichiro Nakano 2022


    R. Li and A. Nakano, *Simulation with Python*，[https://doi.org/10.1007/978-1-4842-8185-7_6](https://doi.org/10.1007/978-1-4842-8185-7_6#DOI)


    第六章 排队系统：股票交易是如何进行的


    简而言之，我们需要模拟以下实体：

    1. 投资者

    2. `match engine`（撮合引擎）


    当然，进一步拆分`match engine`也是有意义的，例如将一个部分专门负责匹配交易，另一个部分负责广播信息等。然而，为了简化，我们将把股票市场一侧的所有功能都打包到`match
    engine`实体中。


    为了完全模拟交易过程，需要模拟以下四个过程：

    1. 投资者向`match engine`发送订单。

    2. `match engine`处理并尝试匹配交易。

    3. 如果交易成功，`match engine`向原始订单提交者广播消息。

    4. `match engine`向市场上的*所有人*广播最新价格。


    由于篇幅限制，本章的重点是前两个部分。然而，你可以看出步骤3和步骤4只是步骤1的反向操作。我将把这两个部分留作本书末尾的练习。你会看到本章中有许多简化和假设。我将把所有这些问题留作练习，供你实现一个完整功能的系统。


    ## 订单簿


    `match engine`跟踪订单的方式是维护一个*订单簿*。订单簿是一个动态的买单和卖单列表，由`match engine`不断更新。你可以将订单簿想象成两堆订单：所有买单在左边，所有卖单在右边。`match
    engine`尝试从买方和卖方中找到可交易的配对。


    订单簿需要以所有市场参与者感到公平和平等的方式来维护。有一些原则需要被尊重。其中最重要的有两条。


    ![](index-108_1.png)


    第六章 排队系统：股票交易是如何进行的'
  raw: 'A stock exchange is a fascinating system in which people trade stocks and
    wish to profit from the trading. In the old times before electronic trading, brokers
    would get together and trade stocks on behalf of their clients by yelling at each
    other. Nowadays, everything becomes electronic. The retailer investors can use
    mobile applications or web applications to make trades.


    In this chapter, we will build a system to simulate a stock exchange and visualize
    an order book. The key takeaway for this simulation is the handling of the queuing
    of orders. For example, some orders are submitted early, while others are submitted
    late with a lower price. We need to properly determine the order priority in such
    cases. On the other hand, we also need to manage the message broadcasting. In
    real life, investors can see the real-time stock price changes which are broadcasted
    by the stock exchange.


    **Trading Process Fundamentals**


    First, let’s decompose the trading process to identify what entities and processes
    should be simulated.


    There are three major parts in a successful trade. First, the investor sends an
    order to the exchange. Then, a *match engine* receives the order and tries to
    find the counterpart of the order. For example, if a new sell order comes in,
    the *match engine* will try to find an existing buy order in the queued orders
    to match the new sell order. In the following third step, there are two possibilities.
    If there is a successful find, the trade will be completed, and messages of successful
    trade will be broadcasted to the original investors, and a new price will also
    be available, as the latest price may change due to the trade, to all investors
    in the market. If there is no successful find, the new sell order will also be
    queued until future trades come in. Investors can also request removal of their
    queued orders.


    © Rongpeng Li and Aiichiro Nakano 2022


    R. Li and A. Nakano, *Simulation with Python*, [https://doi.org/10.1007/978-1-4842-8185-7_6](https://doi.org/10.1007/978-1-4842-8185-7_6#DOI)


    Chapter 6 Queuing SyStem: how StoCk tradeS are made In a short summary, we need
    to simulate the following entities: 1\. Investor


    2\. Match engine


    Well, it also makes sense to further split the match engine to more components
    like one part is solely responsible for match trades and another part is responsible
    for broadcasting information, etc. However, for simplicity, we will pack everything
    on the stock market side into the match engine entity.


    To fully simulate the trading process, the following four processes need to be
    simulated:


    1\. The investor sends an order to the match engine.


    2\. The match engine processes and tries to match the trade.


    3\. The match engine broadcasts messages to the original order submitters if there
    is a successful trade.


    4\. The match engine broadcasts the latest prices to *everyone* in the market.


    Due to the limitation of space, our focus for this chapter is on the first two
    parts.


    However, you can tell that steps 3 and 4 are just the opposites of step 1\. I
    will leave these two parts as exercises to you at the end of the book. You will
    see that there are many simplifications and assumptions in this chapter. I will
    leave all of them as exercises for you to implement a fully functional system.


    **The Order Book**


    The way the match engine keeps track of orders is to maintain an *order book*.
    An order book is a dynamic list of buy and sell orders that keeps getting updated
    by the match engine. You can visualize the order book as two piles of orders;
    all the buy orders are on the left, while the sell orders are on the right. The
    match engine tries to find tradable pairs from the buying side and the selling
    side.


    The order book needs to be maintained such that all participants in the market
    feel fair and equal. There are certain principles that need to be respected. There
    are two most important ones.


    ![](index-108_1.png)


    Chapter 6 Queuing SyStem: how StoCk tradeS are made'
