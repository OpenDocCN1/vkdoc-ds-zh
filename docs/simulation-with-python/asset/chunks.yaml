    detection.


    There are many well-established collision detection algorithms; we will discuss
    and implement one of the most intuitive algorithms: the *sweep and prune* algorithm.


    The idea of sweep and prune algorithm is quite straightforward. If two balls collide,
    then their projection in either the x axis or the y axis must collide as well!
    Therefore, we can use the projection of the balls to predict if they collide or
    not as it is a necessary, although not sufficient, condition.


    The best part of sweep and prune is that we can sort the balls by their projections
    in one axis beforehand. Then a single sweep can find all pairs that can potentially
    collide. Sorting is a process of time complexity *O*( *n* *log* ( *n*)), which
    is already a drastic improvement over the naive approach. An improvement can be
    made utilizing Now, let’s implement the algorithm. We only need to implement one
    new method in the *System* class, which is solely responsible for returning a
    list of pairs of balls that can potentially collide.


