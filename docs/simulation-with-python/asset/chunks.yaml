    \ 1-4.** 1000 sprinkled grains in a square\n\nThe code reads as follows:\n\n```python\n\
    random.seed(2021)\n\nedge = 10\n\nnum_grains = 1000\n\nwith plt.xkcd():\n\n  \
    \  fig, ax = plt.subplots(figsize=(6, 6))\n\n    # plt.axis(\"off\")\n\n    plt.axis(\"\
