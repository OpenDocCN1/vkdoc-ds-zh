    \    sonnets = fp.readlines()\nsonnets = [sentence.strip().lower().replace(\"\
    's\", \"\") for sentence in sonnets if sentence != \"\\n\"]\nsonnets = [\"\".join([char\
    \ for char in sentence if char not in string.punctuation]) for sentence in sonnets]\n\
    ```\n\nNote that you may need to uncomment the `wordnet` download line to download\
    \ additional data. The `sonnets` variable is a list of sentences. We are simplifying\
    \ the problem by only handling lowercases and ignoring the punctuation like *beauty’s*,\
