    res = simulate(g_scale_free, steps = 20, top_k = 5)


    visualize(res)


    ***Figure 9-19.** The evolution of populations in a 1000-node scale-free graph*
    Clearly, something is off. The system seems stuck in less than five steps. Why?
    Let’s take a look at the most influential account’s neighbors:


