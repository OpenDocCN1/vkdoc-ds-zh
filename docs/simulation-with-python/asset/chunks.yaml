    The *influence power* is not changeable because our social network is not dynamic.


    If we allow the follower-followee relationship to change during the simulation,
    which is much more realistic, then the influence power of a node will change if
    fewer and fewer accounts follow it.


    Now, we have all the static settings laid out. The next step is to define the
    mechanism that governs the simulation.


    **Simulate Misinformation Spreading**


    A simulation starts with a few nodes, likely malicious, beginning spreading misinformation.
    Their susceptible followers will respond to the misinformation and react. The
    followers may become infected or stay susceptible. If a follower becomes susceptible,
    the follower’s followers will also be exposed to misinformation and so on and
    so forth.


    At any time, a susceptible node has a chance to recover.


    The probabilities in the simulation are also dynamic. For example, if a node is
    exposed to multiple sources of misinformation, then the chance that they become
    infected can become very high, while the chance of recovering can be strongly
    suppressed.


