    His approach was the same as the method that a Chinese mathematician *Chongzhi
    Zu* used about 1000 years ago.


    Well, as in the 16th century, calculus was not invented. What were you going to
    do, wise person? You were not sitting there and letting your opponent win! Instead,
    you asked the king for 1000 persons to help you with the calculation. You also
    asked for enough fine sand grains, regular papers of size 10 inch by 10 inch,
    rulers, and strings. The king generously approved your request with curiosity.


    **Estimating Pi by Sprinkling Grains**


    Now, you have 1000 men standing in line at your command. This is what you are
    going to do. You asked each of them to draw the biggest circle inside the square
    paper. After that, they were required to *randomly* sprinkle *1000* sand grains
    on the paper. Each person was required to count carefully and record the number
    of grains inside the circle. Of course, the grains might accidently fall outside
    of the paper. In that case, the person was required to resprinkle until all 1000
    grains were on the paper.


    The king was puzzled. You looked confident because you knew your king was not
    a super math person, just like most readers of this book, and easily got bored
