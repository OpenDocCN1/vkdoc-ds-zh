    **Background**


    When Stanislaw Ulam, a Polish-American mathematician and nuclear physicist, invented
    and formulated the modern Monte Carlo method in the 1940s, he and his colleagues
    named the method Monte Carlo because Ulam’s uncle often borrowed his relatives’
    money to gamble in Monaco’s Monte Carlo Casino. Stanislaw Ulam and many other
    brilliant scientists were working on the secret nuclear weapon program now known
    as the Manhattan Project. The Monte Carlo method was programmed to simulate nuclear
    reactions. To some degree, the Monte Carlo method helped shape the world we see
    today.


    Before theorems or algorithms take their formal names in academics, they often
    have been studied by curious pioneers using fun, example-based approaches. Let’s
    start with a story.


    **The Wise Persons’ Competition**


    Suppose one day in the 1500s, somewhere in the Middle East, a king gave 24 hours
    to the two wisest persons, including you, in his kingdom to calculate the value
    of π in the most elegant way. The king generously promised any reasonable resources
    you want.


    π is the ratio of the perimeter and the diameter of a circle. Oftentimes, we also
    call the perimeter of a circle circumference denoted with the letter *C*. The
    quantities are illustrated in Figur[e 1-1.](#index_split_000.html#p14)


