    \ 1/3  1/3  1/6 | @ | 0.2972973  | = | 0.2972973  |\n| 1/6  1/3  1/6 |   | 0.21621622\
    \ |   | 0.21621622 |\n```\n\n请注意，计算忽略了一些由精度引起、可忽略的数值误差。\n\n**第 2 章 马尔可夫链，一窥未来**\n\
    \n这个方程告诉我们，一旦我们的系统达到本征态，它将在后续的转移中保持不变。这意味着几个小时后，无论当前天气如何，晴天的概率将约为 50%。矩阵符号也启示我们，系统的演化也可以写成一系列矩阵的乘积。为简单起见，我复用了符号\
    \ `sn`。你已经见过 `si` 了，对吧？它们基本上是同一个东西。\n\n```\nsn = T @ s(n-1)\n   = T² @ s(n-2)\n\
    \   = T^n @ s0\n```\n\n```\n        | 0.49  0.49 0.49 |\nT^inf = | 0.30  0.30\
    \ 0.30 |\n        | 0.22  0.22 0.22 |\n```\n\n正如你所见，无论我们的初始状态 `s0` 是什么，只要其元素之和为\
    \ 1，输出 `sn` 就是本征态。这是一个值得注意的事实。\n\n你可能会问，是否所有的转移矩阵都具有这样良好的性质。答案是否定的。这里有一个例子：\n\n\
