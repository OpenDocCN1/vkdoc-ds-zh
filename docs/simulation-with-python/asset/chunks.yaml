    ## 关于作者\n\n**李荣鹏**是 Unit21 的商业智能团队负责人。他曾在 Unit21 担任高级数据科学家和数据科学讲师。李荣鹏毕业于南加州大学，获得物理学和电子工程两个硕士学位。他是一位热忱的教育工作者，并根据自己在数据社区提供的志愿服务编写了一本统计学书籍。\n\
    \n**中野爱一郎**（顾问作者）是南加州大学计算机科学、物理与天文学教授，并在定量与计算生物学以及高级计算与模拟合作实验室担任联合职务。他于日本东京大学获得物理学博士学位。其研究领域包括可扩展的科学算法、高端并行超级计算、科学可视化和信息学，以及计算材料科学。他是美国物理学会会士。\
    \  \n\nix\n\n![](img/index-10_1.png)  \n\n## 关于技术审校\n\n**凯西·韦伯斯特**目前是电信行业的一名数据分析师。她从圣地亚哥州立大学获得统计学与经济学学位后，参加了一个数据科学训练营，并掌握了成为数据专业人士所需的技能。在职业发展过程中，凯西享受着数据世界带来的持续成长与变化。\
