    \ plt.scatter([i for i in range(Steps+1)], Is, label = 'infected')\n    plt.title(\"\
    SI model for high contagious disease\")\n    plt.xlabel(\"Days\")\n    plt.ylabel(\"\
    Sizes of Groups\")\n    plt.legend()\n```\n\nThe result in Figure 8-3 shows that\
    \ we end up with an overwhelmingly infected community.\n\n***Figure 8-3.** Population\
