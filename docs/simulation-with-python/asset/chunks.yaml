    \n一个模型还有一个调度（`schedule`）实例。在本例中，它被称为`SimultaneousActivation`。此外，还有随机激活、顺序激活等。`SimultaneousActivation`策略意味着所有智能体将同时行动，这对于我们的竞赛模拟保持*公平*是必要的。\n\
