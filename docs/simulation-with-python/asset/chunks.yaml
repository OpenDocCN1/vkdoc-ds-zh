    Try the simulation on a larger grid and compare the result with the smaller one.\
    \ Can you try 5 by 5?\n\n### Summary\n\nIn this chapter, we discussed a new kind\
    \ of simulation: agent-based simulation (modeling). Agent-based simulation is\
    \ fascinating because it is capable of generating complex patterns from simple\
    \ rules that govern local agents' behaviors. It is widely used in computational\
    \ social science. We also utilized the Mesa Python library to model a multi-agent\
    \ competition.\n\n---\n\n## Chapter 8: Disease Spreading, Simulating COVID-19\
    \ Outbreak\n\nStarting from the end of 2019, a regional respiratory disease first\
    \ identified in Wuhan, China, quickly spread to the whole world. Tens of millions\
    \ of people got infected and hundreds of thousands of people died. The disease\
    \ was later named COVID-19 by the World Health Organization. Starting from early\
    \ 2021, vaccines began to be available, which significantly reduced the death\
    \ rate for infected people.\n\nAs of early 2022, the battle between COVID-19 and\
    \ humans is still ongoing. In this chapter, we will try to use mathematical models\
    \ to model and simulate the disease spreading. We will study the very basics of\
    \ differential equations and run some Python codes to simulate the growth of an\
    \ epidemic.\n\n### Simplifying the Real World\n\nIn the real world, disease spreading\
    \ is a very complex problem. Different diseases have different pathogens: virus,\
    \ bacteria, or other microorganisms. They have different pathways to invade hosts.\
    \ For example, the COVID-19 virus mainly spreads through air when infected people\
    \ cough or speak and susceptible groups breathe in the particles that carry the\
    \ virus. The virus can also last for quite a long time on surfaces: if another\
    \ person touches the surface and then touches their nose or eyes, the virus can\
    \ also invade the new host. Other pathogens can spread through water or food like\
    \ various kinds of parasites. Certain viruses can also be transmitted through\
    \ blood like HIV, the cause of AIDS.\n\n© Rongpeng Li and Aiichiro Nakano 2022\n\
    R. Li and A. Nakano, *Simulation with Python*, [https://doi.org/10.1007/978-1-4842-8185-7_8](https://doi.org/10.1007/978-1-4842-8185-7_8#DOI)\n\
    \nThe infected population also has huge internal diversity. Take COVID-19, for\
    \ example; people who are younger with strong immune systems can usually recover\
    \ without treatment. However, for older people with preexisting conditions, the\
    \ symptoms can be deadly. Some infected people are more active outdoors, so they\
    \ can be a source of virus spreading, while other people may choose to stay indoors.\n\
    \nIn this chapter, we will try to model disease spreading by focusing on the partition\
    \ of the population and the simplified interaction between pathogens and the population.\n\
    \nThe exact details of pathways and biological dynamics of pathogen-host interaction\
    \ will be omitted.\n\nHere are the main assumptions:\n\n1. The whole population\
    \ in the world is categorized into three groups: the `susceptible` denoted by\
    \ `S`, the `infected` denoted by `I`, and the `recovered` denoted by `R`.\n  \
    \ a. The susceptible represents the group who are not currently infected.\n  \
    \ b. The infected represents the group who are currently infected and contagious.\n\
    \   c. The recovered represents the group who are immune to the disease at a certain\
    \ point. Note that some versions of the models will use `Removed` instead of `Recovered`\
    \ to include the deceased population.\n\n2. Group populations are not static,\
    \ but dynamically changing. For example, susceptible people can get infected and\
    \ become infected. Depending on the nature of the disease, people may or may not\
    \ develop immunity. For example, a parasite-caused disease can be recurring if\
    \ hosts are exposed to the pathogens again after recovery.\n\n3. The model is\
    \ used to model outbreaks such that many underlined quantities are fixed. For\
    \ example, the age structure of the whole population is fixed, and the total population\
    \ remains unchanged as well.\n\nIn summary, the most basic structure of the model\
    \ looks like the following. A susceptible person got infected, then the person\
    \ recovered, hopefully, from the disease.\n\nFigure 8-1 illustrates the relationship.\n\
    \n***Figure 8-1.** Relationship between susceptible, infected, and recovered populations*\n\
    \nIn addition to this simple trajectory, there may be other trajectories as well\
    \ which increases the complexity of the system. However, before diving into those\
    \ ones, let's start with an even simpler model, the SI model: the `susceptible-infected`\
    \ model.\n\n### The SI Model\n\nThe SI model doesn't have a `recovered` category;\
    \ people are either susceptible or infected. A susceptible person can get infected,\
    \ and an infected person may recover from it. The disease is usually not deadly\
    \ with a quite low death rate, but it is just not going anywhere. Figure 8-2 shows\
    \ the bidirectional relationship of the susceptible and infected populations.\n\
    \n***Figure 8-2.** The population migration of susceptible and infected populations*\n\
    \nThe changes from and to one category to another depend on the interaction between\
    \ people belonging to each group. Let's use `S(t)` and `I(t)` to denote the population\
    \ of these two groups at timestamp `t`. How will they change after a timestep,\
    \ say one hour or one day, whichever unit we prefer to define the modularity in\
    \ the time domain? I will use day as our time unit as it makes more real-life\
    \ sense to collect statistics daily rather than hourly.\n\nImagine a small community;\
    \ at the very beginning, there are `S(0)` people who are susceptible and `I(0)`\
    \ people who are already infected. Each of the susceptible people has a `chance`\
    \ to interact with any of the infected people. It is a combination question. If\
    \ there are five susceptible persons and four infected, then theoretically there\
    \ are 20 ways for them to interact.\n\nTechnically, not every interaction leads\
    \ to infecting susceptible persons, so there is a ratio. Let's use `α` to denote\
    \ such a ratio. The newly infected people will be `αSI`.\n\nOn the other hand,\
    \ the infected persons will also have a chance to get rid of the infection and\
    \ become susceptible again. This change is independent of susceptible-infected\
    \ interaction. Let's assign a ratio `β` to this process.\n\nIn summary, this is\
    \ how the populations of the two categories evolve in time:\n\n`S(t + 1) = S(t)\
    \ − αS(t)I(t) + βI(t)`\n\n`I(t + 1) = I(t) − αS(t)I(t) + βI(t)`\n\nThese two equations\
    \ are called difference equations as we are modeling the differences of quantities.\
    \ A continuous version of the equations is called differential equations; they\
    \ are defined as follows:\n\n`dS/dt = −αS(t)I(t) + βI(t)`\n\n`dI/dt = −αS(t)I(t)\
    \ + βI(t)`\n\nThe differential equations can be solved analytically, but let's\
    \ focus on the difference equations.\n\nRemember that the total population is\
    \ fixed, so we can further simplify the two difference equations into one. We\
    \ use `N` to denote the total population. The constraint states that for any time\
    \ `t`, we have `N = S(t) + I(t)`.\n\nTherefore, we can rewrite the expression\
    \ of `S(t+1)` as:\n\n`S(t + 1) = S(t) − αS(t)(N − S(t)) + β(N − S(t))`\n\nthen\n\
    \n`S(t + 1) = αS(t)² + (1 − αN − β)S(t) + βN`\n\nIt looks straightforward enough.\
    \ Let's write some code now:\n\n```\nN = 1000\nbeta = 0.01\nalpha = 0.001\n\n\
    Ss = [500]\nIs = [500]\nSteps = 20\n\nfor _ in range(Steps):\n    s = Ss[-1]\n\
    \    s = alpha*s*s + (1-alpha*N-beta)*s + beta*N\n    Ss.append(s)\n    Is.append(N-s)\n\
    ```\n\nLet's plot the tracking of the susceptible and the infected populations.\
    \ Note that we may have float numbers which is inevitable.\n\n```\nwith plt.xkcd():\n\
