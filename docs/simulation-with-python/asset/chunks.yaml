    time? The answer is yes, but the implementation will be trickier. We need to pre-identify
    all current empty properties and going-to-be empty properties and assign the moving
    tenants to them simultaneously.


    In this example, let’s use Mesa to model a contest. Sixteen rock-paper-scissors
    masters get together and compete with each other. They are arranged into a 4 by
    4 grid, and in each round, their choices will be compared with their immediate
    neighbors (not including diagonal ones). If they are on the winner’s side, then
    they get 1 point for that round; if they lose, –1; if there is a deadlock, then
    everybody gets a 0.


    ![](index-128_1.png)


    Chapter 7 roCk, SCiSSorS, and paper: Multi-agent SiMulation


    Well, is it fair for those at the boundary or corner? Naively, it isn’t because
    they have fewer neighbors. However, we can introduce the periodic boundary condition
    (PBC) to make it fair. Figure [7-6](#index_split_001.html#p128) is an example
    of the periodic boundary condition in molecular dynamics, in which a molecular
    has mirrors of itself in fictitious neighboring boxes.


    ***Figure 7-6.** Periodic boundary condition in molecular dynamics* The periodic
    boundary condition is ubiquitous in molecular dynamics simulation.


    The image in Figure [7-6](#index_split_001.html#p128) is taken from Prof. Nakano’s
    lecture slide. The basic idea is to create *replicas* by shifting the system to
    make the system virtually infinite.


    In our contest grid case, if indexed from 0, a contestant at the top-right corner
    with position (0, 3) will have two normal neighbors at (0,2) and (1,3). But it
    will also have two *image* neighbors with position (0,0) and (3,3). The idea is
    illustrated in the visualization in Figure [7-7](#index_split_001.html#p129).


    ![](index-129_1.png)


    Chapter 7 roCk, SCiSSorS, and paper: Multi-agent SiMulation


    ***Figure 7-7.** The yellow contestant plays with virtual opponents green and
    blue* The yellow dot indicates a contestant at the corner of the grid, while its
    *imaginary* blue up neighbor is actually the one at the bottom right and its *imaginary*
    green right neighbor is the one at the top left. The corner contestant still has
    four neighbors, with two being imaginary. The boundary ones will also have four
    neighbors, with one being imaginary. The contest’s fairness is restored.


    The contestants are separated into two kinds of strategists: one group is stubborn
    who will likely stick to a choice with a high probability and occasionally change
    with lower probability, then stick to the new one with high probability. For example,
    if one starts with paper, then the contestant sticks to paper with a probability
    of 80% for the following round, then occasionally changes to scissors or rock
    with a probability of 10%, respectively. Once changed, the contestant sticks to
    the new one with high probability.


    They don’t care about the result of the current round at all. We call this group
    *the* *stubborn* contestants.


    Another group is trying to be smart by playing a psychology game. They always
    pick the move that counters the last round’s winning move. For example, if in
    the last round, rock wins, then they will pick paper for the current round because
    paper defeats rock. If there is no winner in the last round, then they will randomly
    pick one. Their idea is that the winner of the round will try to win again with
    the same move; they can make use of it.


    We call this group *the sneaky* contestants.


    Chapter 7 roCk, SCiSSorS, and paper: Multi-agent SiMulation As you can see, both
    strategies are quite naive. The question now is that if there are eight stubborn
    contestants and eight sneaky ones arranged in an interleaving pattern on the grid,
    which group will have a higher average score if they play the game for 100 rounds?


