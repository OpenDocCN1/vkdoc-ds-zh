    \ / total_occupied\n```\n\n接下来，我们运行模拟以评估该比例与占据概率之间的关系。我们使用 100x100、200x200 和 300x300\
    \ 的网格进行模拟。从高于基准真值的位置开始，我们逐渐将占据概率降低至 0.59 左右，并对每个概率点运行 1000 次以获得平均值。\n\n```python\n\
    L = 100\nROUND = 1000\nTRUTH = 0.592746\n\nfractions = []\nprobs = []\nstart =\
    \ 0.622746\nsteps = 110\nstep = (start - TRUTH) / (steps - 10)\n\nfor i in tqdm(range(steps)):\n\
    \    res = []\n    prob = start - i * step\n    probs.append(prob)\n    for _\
    \ in range(ROUND):\n        while True:\n            grid = Grid(L, L, prob=prob,\
