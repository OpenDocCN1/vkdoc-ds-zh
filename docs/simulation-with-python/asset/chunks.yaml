    \nA scientist is investigating the spreading of wildfire in a forest. She is looking\
    \ for a simple model that can predict how large a wildfire will be given limited\
    \ knowledge about the forests, the weather, the climate, etc. For example, if\
    \ some irresponsible tourist dropped a cigarette somewhere in the forest, what\
