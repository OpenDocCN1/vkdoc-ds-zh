    \ \\) to represent the chance that the grain will fall inside the circle. We have\
    \ the following expressions:\n\n\\[\nP(\\text{grain in circle}) = \\frac{\\text{circle's\
    \ area}}{\\text{square's area}} = \\frac{A}{S} = \\frac{\\pi D^2 / 4}{D^2} = \\\
    frac{\\pi}{4}\n\\]\n\nSurprise! The chance does *not* depend on the size of the\
    \ square. The only issue is that such a beautiful claim is only theoretically\
    \ true; we have to sample it to estimate such a probability. This is why you,\
    \ the role-playing wise person, asked for tons of grains and 1000 careful men\
    \ with sharp eyes to repeat these experiments. Each experiment will give you a\
    \ value of π, and by the end of the day, we can take the average of all the experiment\
    \ results."
