    \n    xs_in, ys_in = list(), list()\n\n    xs_out, ys_out = list(), list()\n\n\
    \    for g in range(num_grains):\n\n        x, y = (random.random() - 0.5)*edge,\
    \ (random.random() - 0.5)*edge\n\n        if x**2 + y**2 <= (edge/2)**2:\n\n \
    \           xs_in.append(x)\n\n            ys_in.append(y)\n\n        else:\n\n\
    \            xs_out.append(x)\n\n            ys_out.append(y)\n\n    ax.scatter(xs_in,\
    \ ys_in, color=\"r\")\n\n    ax.scatter(xs_out, ys_out, color=\"b\")\n\n    circle\
    \ = plt.Circle((0, 0), edge/2, fill=False, color=\"g\", lw=3)\n\n    ax.add_patch(circle)\n\
