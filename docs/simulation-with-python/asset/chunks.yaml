    \            G.edge(word_from, word_to, penwidth=str(lw*0.1), label=str(lw))\n\
    G.view(\"sonnet\")\n```\n\nThe result looks like a big spider web as in Figure\
    \ 2-7.\n\n***Figure 2-7.** The transitional relationship between words*\n\nYou\
