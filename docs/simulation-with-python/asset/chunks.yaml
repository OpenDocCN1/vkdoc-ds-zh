    4.  系统中没有重力。小球不会因重力而下落。不过，我们很快就会移除这个限制。\n\n基于这些简化，我们可以根据牛顿运动定律写出系统的以下更新规则：\n\n\
    `x(t+1) = x(t) + v(t) * Δt`\n\n`a(t) = 0`\n\n由于我们假设没有外力，加速度 `a(t)` 初始为 0。现在，让我们以\
