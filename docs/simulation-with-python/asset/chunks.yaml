    ***Figure 9-13.** Another stable state with a different random number seed*


    Alrighty, let’s move on to much bigger graphs.


    ## Misinformation Spreading on Different Networks


    The preceding graphs don’t actually capture the essence of online social networks.
    First, they are too small. Second, they don’t exhibit the most significant properties
    of social media networks: only a small portion of accounts have the majority of
    the followers.


    To understand it, let’s plot the distribution of the numbers of followers in the
    network. We need to create a bigger graph using the `fast_gnp_random_graph()`
    function:


    152


    ![](index-163_1.png)


    **Chapter 9 Misinformation spreading and simulations on a graph**


    ```

    fig, ax = plt.subplots()

    bg = nx.fast_gnp_random_graph(n=1000, p=0.15, seed = 1, directed = True)

    degree_sequence = sorted((d for n, d in bg.out_degree()), reverse=True)

    ax.bar(*np.unique(degree_sequence, return_counts=True))

    ax.set_title("Degree histogram")

    ax.set_xlabel("Degree")

    ax.set_ylabel("# of Nodes");

    ```


    The result is presented in Figure 9-14.


    ***Figure 9-14.** The distribution of the out-degrees of a random graph*


    As you can see, the network doesn’t have a single, or a handful of, strong influencers.
    The average number of followers is about 150, and the distribution is almost symmetric.
    This is not true in real social networks. People don’t follow each other randomly
    with a probability of 15%.


    We need to use another random graph generator, the `scale_free_graph()` method.
    It has many parameters, but we will take the default arguments for simplicity.


    Let’s take a quick comparison of the ten-node graphs generated by `fast_gnp_random_graph()`
    and `scale_free_graph()`:


    ```

    fig, axes = plt.subplots(1,2, figsize=(15,6))

    G = nx.fast_gnp_random_graph(n=10, p =0.2, seed = 1)

    pos=nx.circular_layout(G)

    nx.draw(G, with_labels=True, font_weight=''bold'', pos = pos, ax = axes[0])

    ```


    153


    ![](index-164_1.png)

    ![](index-164_2.png)


    **Chapter 9 Misinformation spreading and simulations on a graph**


    ```

    G = nx.scale_free_graph(10)

    pos=nx.circular_layout(G)

    nx.draw(G, with_labels=True, font_weight=''bold'', pos = pos, ax = axes[1])

    ```


    The result looks like the one in Figure 9-15. The one on the left is much more
    centric visually. Well, account 0 *follows* many other accounts, not the other
    way around though.


    The result is presented in Figure 9-15.


    ***Figure 9-15.** A visual comparison of a random graph and a scale-free graph*


    Let’s create the same out-degree distribution visualization for a 1000-node scale-free
    graph. The result is presented in Figure 9-16.


    ***Figure 9-16.** Out-degree distribution for a scale-free graph*


    154


    ![](index-165_1.png)


    **Chapter 9 Misinformation spreading and simulations on a graph**


    As you can see, there are accounts with more than 80 followers, but the majority
    of the accounts have only 1 or 2 followers. By controlling the parameters of the
    `scale_free_graph` function, you can control the mechanism of the graph generation.
    The algorithm for generating a scale-free graph is to continuously add new nodes
    to an existing graph according to a set of preferences. I changed the default
    parameters to alter the out-degree distribution. For example:


    ```

    fig, ax = plt.subplots()

    g = nx.scale_free_graph(1000, alpha = 0.6, beta = 0.39, gamma = 0.01, seed = 0)

    degree_sequence = sorted((d for n, d in g.out_degree()), reverse=True)

    ax.bar(*np.unique(degree_sequence, return_counts=True))

    ax.set_title("Out-degree histogram")

    ax.set_xlabel("Out-degree")

    ax.set_ylabel("# of Nodes");

    ```'
