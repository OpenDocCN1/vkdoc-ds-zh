    \ I set the *random seed* to be 2021\\. Almost all randomness we see in computer\
    \ science is called pseudorandomness. They are not completely random, just as\
    \ the wise person’s 1000 men would not truly uniformly sprinkle grains on the\
    \ paper. However, for Python programming, in almost all cases, you can trust the\
