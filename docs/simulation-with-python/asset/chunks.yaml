    \ in range(len(words)-1)]\n    for (word_from, word_to) in words_pairs:\n    \
    \    transition_dict[word_from][word_to] += 1\n```\n\nBefore using the `transition_dict`\
    \ to generate sentences, let’s take a look at the paths for the bigrams. The following\
    \ visualization simply uses the width of edges to represent the frequency of the\
