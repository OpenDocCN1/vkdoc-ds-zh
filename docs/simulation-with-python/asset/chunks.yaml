    \ `移除` 代替 `康复`，以包含死亡人口。\n\n2.  群体人口不是静态的，而是动态变化的。例如，易感人群可能被感染并变为感染人群。根据疾病的性质，人们可能会或不会产生免疫力。例如，对于由寄生虫引起的疾病，如果宿主在康复后再次接触病原体，疾病可能会复发。\n\
    \n3.  该模型用于模拟疫情爆发，因此许多潜在的量是固定的。例如，总人口的年龄结构是固定的，总人口也保持不变。\n\n总之，模型最基本的框架如下所示。一个易感者被感染，然后（希望如此）该人康复。\n\
    \n图 8-1 阐释了这种关系。\n\n***图 8-1.** 易感人群、感染人群和康复人群之间的关系*\n\n除了这种简单的轨迹之外，可能还有其他轨迹，这增加了系统的复杂性。然而，在深入研究这些之前，让我们先从一个更简单的模型开始：SI\
    \ 模型，即`易感-感染`模型。\n\n### SI 模型\n\nSI 模型没有`康复`类别；人们要么是易感者，要么是感染者。易感者可能被感染，感染者可能会康复。这种疾病通常不致命，死亡率很低，但它就是不会消失。图\
    \ 8-2 显示了易感人群和感染人群之间的双向关系。\n\n***图 8-2.** 易感人群和感染人群的人口迁移*\n\n从一个类别到另一个类别的变化取决于属于每个群体的人之间的互动。让我们用\
    \ `S(t)` 和 `I(t)` 来表示时间戳 `t` 时这两个群体的人口数量。经过一个时间步长后，比如一小时或一天（取决于我们选择哪种时间单位来定义时间域上的模块化），它们将如何变化？我将使用“天”作为时间单位，因为按天（而非按小时）收集统计数据更符合现实意义。\n\
    \n想象一个小型社区。在最开始时，有 `S(0)` 名易感者和 `I(0)` 名已感染者。每个易感者都有`机会`与任何一个感染者互动。这是一个组合问题。如果有五个易感者和四个感染者，那么理论上他们有\
    \ 20 种互动方式。\n\n严格来说，并非每次互动都会导致易感者被感染，因此存在一个比率。我们用 `α` 来表示这个比率。新感染的人数将是 `αSI`。\n\
    \n另一方面，感染者也有机会摆脱感染并再次变为易感者。这种变化独立于易感者-感染者之间的互动。我们为该过程分配一个比率 `β`。\n\n总而言之，这就是两个类别的人口数量随时间演化的方式：\n\
    \n`S(t + 1) = S(t) − αS(t)I(t) + βI(t)`\n\n`I(t + 1) = I(t) − αS(t)I(t) + βI(t)`\n\
    \n这两个方程被称为差分方程，因为我们是对数量的差异进行建模。这些方程的连续版本被称为微分方程，定义如下：\n\n`dS/dt = −αS(t)I(t) +\
    \ βI(t)`\n\n`dI/dt = −αS(t)I(t) + βI(t)`\n\n微分方程可以解析求解，但我们将重点放在差分方程上。\n\n请记住，总人口是固定的，因此我们可以进一步将两个差分方程简化为一个。我们用\
    \ `N` 表示总人口。该约束表明，对于任何时间 `t`，我们有 `N = S(t) + I(t)`。\n\n因此，我们可以将 `S(t+1)` 的表达式重写为：\n\
    \n`S(t + 1) = S(t) − αS(t)(N − S(t)) + β(N − S(t))`\n\n然后\n\n`S(t + 1) = αS(t)²\
    \ + (1 − αN − β)S(t) + βN`\n\n看起来足够直接了。现在让我们编写一些代码：\n\n```\nN = 1000\nbeta = 0.01\n\
    alpha = 0.001\n\nSs = [500]\nIs = [500]\nSteps = 20\n\nfor _ in range(Steps):\n\
    \    s = Ss[-1]\n    s = alpha*s*s + (1-alpha*N-beta)*s + beta*N\n    Ss.append(s)\n\
    \    Is.append(N-s)\n```\n\n让我们绘制易感人群和感染人群的追踪图。请注意，我们可能会得到浮点数，这是不可避免的。\n\n```\n\
    with plt.xkcd():\n    plt.scatter([i for i in range(Steps+1)], Ss, label = 'susceptible')\n\
    \    plt.scatter([i for i in range(Steps+1)], Is, label = 'infected')\n    plt.title(\"\
    高传染性疾病的 SI 模型\")\n    plt.xlabel(\"天数\")\n    plt.ylabel(\"群体规模\")\n    plt.legend()\n\
    ```\n\n图 8-3 中的结果显示，我们最终得到了一个几乎完全被感染的社区。\n\n***图 8-3.** 20 天后易感群体和感染群体的人口演化*\n\
    \n有两种方法可以降低感染人群的数量。我们可以尝试两种方法。\n\n第一种方法是限制感染者与易感者之间的传播：减少 `α`；另一种方法是增加 `β` 来治愈感染人群。让我们看看它们如何影响人口演化曲线。\n\
    \n首先，让我们将 `α` 改为原来的十分之一：`alpha = 0.0001`。\n\n看起来我们成功地*延迟*了疾病的传播！请注意，我将时间范围延长到了\
    \ 100 天，以便在图 8-4 中看到全貌。\n\n***图 8-4.** 人口演化*\n\n嗯，这就是 *居家令* 或 *封锁* 政策背后的理念。如果人们限制面对面互动以降低传播率，病毒传播速度就会慢得多。\n\
    \n如果我们进一步降低 `α` 呢？将 `α` 设为 `0.00002` 怎么样？你会发现人口根本没有变化，如图 8-5 所示。\n\n***图 8-5.**\
    \ 临界参数达到平衡*\n\n简单计算表明，当 `α` 和 `β` 的值处于*临界*状态时，两个群体之间的转移将达到平衡状态：易感者转变为感染者的人数*恰好*等于感染者转变为易感者的人数。\n\
    \n### 练习\n\n1.  如果我们进一步限制人们的互动呢？你能验证疾病是否会真正消失吗？\n2.  操控 `β` 的值，并检查其对人口演化的影响。\n\
    3.  改变两个群体的初始人口。如果开始时只有少数几个感染者，与感染者较多的情况相比，最终状态会改变吗？你能识别比率 `αS(0)/β` 的重要性吗？\n\n\
    ### SIR 模型\n\n现在，让我们更进一步，加入`康复`群体。`康复`的定义稍后可以进一步扩展。但是，目前我们先假设让人们`康复`只有一种可能途径：被感染，然后康复并获得免疫力。\n\
    \n我们引入另一个变量 `R(t)` 来表示康复的总人数。\n\n它遵循以下差分方程。我们有一个用 `γ` 表示的`康复率`。康复的人将拥有*永久*免疫力。\n\
    \n`R(t + 1) = R(t) + γI(t)`\n\n因此，我们社区人口的约束变为：\n\n`N = S(t) + I(t) + R(t)`\n\n\
    让我们从一个很小的 `γ` 开始，并且没有康复人口。你期望看到什么？\n\n代码与我们之前使用的非常相似，但这次我们将显式更新三个群体：\n\n```\n\
    N = 1000\nbeta = 0.01\nalpha = 0.0001\ngamma = 0.0001\n\nSs = [500]\nIs = [500]\n\
    Rs = [0]\nSteps = 50\n\nfor _ in range(Steps):\n    s, i, r = Ss[-1], Is[-1],\
    \ Rs[-1]\n    s_next = s - alpha*s*i + beta*i\n    i_next = i + alpha*s*i - beta*i\
    \ - gamma*i\n    r_next = r + gamma*i\n    Ss.append(s_next)\n    Is.append(i_next)\n\
    \    Rs.append(r_next)\n\nwith plt.xkcd():\n    plt.scatter([i for i in range(Steps+1)],\
    \ Ss, label = 'susceptible')\n    plt.scatter([i for i in range(Steps+1)], Is,\
    \ label = 'infected')\n    plt.scatter([i for i in range(Steps+1)], Rs, label\
    \ = 'recovered')\n    plt.title(r\"小$\\gamma$下的 SIR 模型\")\n    plt.xlabel(\"天数\"\
    )\n    plt.ylabel(\"群体规模\")\n    plt.legend()\n```\n\n如图 8-6 所示，在 50 步之后，康复群体并没有显著增加。\n\
    \n***图 8-6.** 康复人口保持不变*\n\n为什么？因为我们依赖的是*自然免疫力*，它的特征就是 `γ` 值很小。\n\n然而，请注意，获得免疫的人将永远保持免疫状态；最终，社区中的每个人都会安全。这需要多长时间？我将这个问题留给你，但我的发现是，要使大约一半的人口（500\
    \ 人）获得免疫，需要超过 20 年。结果如图 8-7 所示。\n\n***图 8-7.** 实现自然群体免疫的漫长征程*\n\n现在，我们可以引入什么？答案是疫苗接种！如果我们能够将易感人群转化为`康复`状态，那么所谓的*群体免疫*状态就可以更快实现！请注意，这里的`康复`一词已不再按字面意思定义。\n\
    \n我们该怎么做呢？假设在任何时间点，大约有 2% 的易感人群愿意接种疫苗，那么我们就更有可能控制疾病的传播。我们将相关参数命名为 `μ`。\n\n`R(t\
    \ + 1) = R(t) + γI(t) + μS(t)`\n\n让我们看看这将如何影响我们的模拟，如图 8-8 所示。\n\n***图 8-8.** 疫苗接种增强免疫力*\n\
    \n不错，对吧？仅在 100 天内，我们就让大约四分之一的总人口获得了免疫。\n\n如果人群中有更高的疫苗接种意愿呢？假设 5% 的易感人群想要接种疫苗。结果非常有希望，如图\
    \ 8-9 所示。\n\n***图 8-9.** 更强的疫苗接种将加速群体免疫*\n\n结果更加令人印象深刻；我们在 100 天内让一半的人口获得了免疫。\n\
    \n### 练习\n\n1.  存在一种可能性：已接种疫苗的人可能再次变得易感。你能模拟这种现象吗？这将如何影响群体免疫的进程？\n2.  死亡将如何影响我们的模型？进一步将`康复`群体划分为*真正*的康复群体和不幸的死亡群体，并解释模拟行为将如何变化。\n\
    \n### 本章小结\n\n在本章中，我们模拟了大流行爆发期间不同群体之间的互动。我们简化了病原体传播过程的假设，并介绍了易感-感染（SI）模型和易感-感染-康复（SIR）模型。通过模拟，我们可以清楚地看到不同因素如何影响病毒传播过程，以及疫苗接种如何帮助社区达到群体免疫。\n\
    \n---\n\n## 第九章：错误信息传播与图上的模拟\n\n在 COVID-19 时代，错误信息从未如此致命。在 Twitter 和 Facebook\
    \ 等社交网络上，关于病毒起源、治疗方法和疫苗接种的阴谋论猖獗蔓延。它们常常在社区和圈子里传播，并与美国总统大选相关的其他阴谋论相互呼应。这种错误信息和阴谋论相互加强，形成了一个密不透风的*回音室*。\n\
    \n错误信息（Misinformation）和虚假信息（Disinformation）非常相似。区别在于，虚假信息是为了欺骗而故意传播的虚假信息。换句话说，虚假信息是*蓄意*的错误。错误信息是虚假信息的超集。\n\
    \n错误信息的传播者可能并未意识到错误信息的错误性或危害性。在本章中，我们将研究错误信息如何在网络/图设置下传播。\n\n### 建模社交网络\n\n我们之前已经研究过一些类似网络的系统，例如马尔可夫模型的状态转换和森林火灾蔓延模型。在诗歌生成的马尔可夫模型中，我们将每个单词视为一个节点，并且每个节点都有一定的概率后接另一个词，从而形成一个带有*有向*边的词语网络。\n\
    \n© Rongpeng Li 和 Aiichiro Nakano 2022\nR. Li 和 A. Nakano，《使用 Python 进行模拟》，[`doi.org/10.1007/978-1-4842-8185-7_9`](https://doi.org/10.1007/978-1-4842-8185-7_9#DOI)\n\
    \n在森林火灾蔓延模型中，每一棵树在方形网格上都有四个最近的相邻树。火可以以预定的概率从一棵树蔓延到另一棵树。这个网络在某种程度上是同质的，因为它们（除了边界上的树）都有四个邻居，并且没有任何一棵树在任何方面比其他树特殊。\n\
    \n在本章中，我们将研究*通用*网络，它可以表示任意社区的连接性。让我们先介绍一些术语。\n\n到目前为止，我在本章中一直在互换使用“网络”和“图”。它们的定义差异通常取决于背后的科学领域。例如，有时人们在网络中会使用*链接*（links）而不是*边*（edges），但它们本质上代表同一事物。为了与其他文献保持一致，我将在以下内容中使用“图”。\n\
    \n一个图由*节点*和*边*组成。例如，图 9-1 有五个节点和六条边。\n\n***图 9-1.** 一个包含五个节点和六条边的简单图*\n\n图 9-1\
    \ 中的图也是一个*连通*图，因为你可以通过遍历边从任意一个节点到达任意另一个节点。情况并非总是如此。图 9-2 中的图是一个不连通图。\n\n***图 9-2.**\
    \ 一个不连通图的例子*\n\n这个图有五个不连通的*团簇*（也称为*社区*）。它们之间没有通过边连接。\n\n一个常见的误解是*子图*的定义。从一个图中取出的任何节点和边的子集都会形成一个子图。这些节点和边在*视觉上*可能不形成一个*团簇*。例如，在前面那个有五个团簇的图中，节点\
    \ 1 形成了一个单节点子图，而节点 1、2、3 和 6 以及节点 2 和 6 之间的边也形成了一个四节点子图，尽管它在视觉上是三个互不连通的团簇，看起来很奇怪。\n\
    \n图的边也可以是有方向的，这使图成为*有向图*。例如，Twitter 的关注关系就是一种有向关系。你可能关注一位明星，但这位明星不太可能回关你。如果两个\
    \ Twitter 账号互相关注，那么它们之间必须存在*两条*边来表示这种关系：一条从一个指向另一个，另一条反向。我们将这种允许节点之间存在多条边的图称为*多重图*。通常，多重图表示有向关系，但并非总是如此。\n\
    \n图 9-3 是一个有向多重图。边是有方向的，并且允许多条边存在。例如，节点 2 和 3 之间有两条边。另一个有趣的边是*自环*边，它指向节点自身，例如节点\
    \ 0、1 和 2。通过适当的建模，自环可以表示推文的自我转发或类似的行为。\n\n***图 9-3.** 一个带有自环的有向图*\n\n节点和边也可以有属性。例如，节点可以有权重，表示它们在图中的影响力大小，而边的权重可以表示两个节点之间联系的强弱。为了对社交网络进行建模，我们需要为图元素分配某些属性，这些属性可以是固有的，也可以是计算得来的。\n\
    \n让我们使用图来定义我们的社交网络，特别是 Twitter 生态系统。\n\n每个节点代表一个账户，每条边代表一个关注关系。因此，信息可以通过发布推文从被关注者流向关注者。\n\
    \n想想 Twitter 账户的属性。一个账户影响力的最重要指标是关注者数量；在我们的例子中，这正好是出边的数量。在图论中，它有一个名字：*出度*，即出边的数量。类似地，*入度*计数入边的数量。出度越大，社交网络上可能受到影响的账户就越多。\n\
    \n我们还希望借鉴前一章的一些概念。我们将节点分为三类，除了错误信息的来源之外，类似于*易感、感染和康复*模型。易感者是尚未接触过错误信息的账户；如果他们关注的人中是错误信息的来源或已感染者，他们就有被感染的概率。感染节点类似于疾病传播模拟中的感染患者，他们通过转发和分享错误信息来积极影响其关注者。*康复*节点是指那些要么天生抵制（`R`\
    \ 既可表示*抵制（resistance）*，也可表示*康复（recovered）*）错误信息，要么从错误信息污染中恢复过来的账户。\n\n总之，我们使用表\
    \ 9-1 中的属性来描述图上的一个节点。\n\n**表 9-1.** 社交网络中节点/账户的属性\n\n| 名称        | 描述        \
    \                                   | 可能的值                     | 是否可变 |\n|-------------|-------------------------------------------------------|-------------------------------------|------------|\n\
    | 状态       | 节点的状态                                 | \"来源\"、\"易感\"、\"感染\"或\"康复\"\
    \ | 是        |\n| 影响力   | 节点的影响力大小，通过出度衡量 | 非负整数               | 否*        |\n\
    | 抵抗力  | 账户对错误信息的抵抗能力   | 介于 0 和 1 之间的值             | 是        |\n\n*影响力*是不可变的，因为我们的社交网络不是动态的。如果我们允许在模拟过程中关注者-被关注者关系发生变化（这更加现实），那么如果一个账户的关注者越来越少，其影响力就会改变。\n\
    \n现在，我们已经布置好了所有静态设置。下一步是定义控制模拟的机制。\n\n### 模拟错误信息传播\n\n模拟开始时，少数几个节点（很可能是恶意的）开始传播错误信息。它们的易感追随者将响应错误信息并做出反应。这些追随者可能变为感染者，也可能保持易感状态。如果一个追随者变为感染者，该追随者的追随者也将暴露在错误信息中，依此类推。\n\
    \n在任何时候，易感节点都有机会康复。\n\n模拟中的概率也是动态的。例如，如果一个节点暴露于多个错误信息来源，那么它们被感染的可能性就会变得非常高，而康复的可能性则会受到强烈抑制。\n\
    \n### 简单案例\n\n让我们从一个简单的案例开始，如图 9-4 所示，只有五个节点来测试我们代码的准确性。该图看起来像图 9-4。请注意，节点 `0`\
    \ 和 `1` 互相关注。\n\n***图 9-4.** 一个包含五个节点的有向图*\n\n以下是生成该图的代码：\n\n```\n# 生成图的代码在此处\n\
    ```\n"
