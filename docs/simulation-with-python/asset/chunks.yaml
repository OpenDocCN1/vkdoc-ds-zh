    \ in the previous simulation. We use `x'` and `x` to denote the new (next hour)\
    \ and old (current hour) states, respectively. The transition matrix is denoted\
    \ by `T`:\n\n`x' = T @ x`\n\n```\n| 1/2  1/3  2/3 |   | 0.48648649 |   | 0.48648649\
    \ |\n| 1/3  1/3  1/6 | @ | 0.2972973  | = | 0.2972973  |\n| 1/6  1/3  1/6 |  \
    \ | 0.21621622 |   | 0.21621622 |\n```\n\nNote that the calculation ignores some\
    \ negligible precision-caused numerical errors.\n\n**Chapter 2 Markov Chain, a\
    \ Peek into the Future**\n\nThis equation tells us once our system reaches the\
    \ eigenstate, it will remain there for the rest of the transition. This means\
    \ that after several hours, the probability of being sunny will be about 50% regardless\
