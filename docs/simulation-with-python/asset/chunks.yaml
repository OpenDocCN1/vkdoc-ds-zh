    \ in this book have a random seed though.\n\nThe `random.random()` function will\
    \ return a random variable between 0 and 1. See the visualization in Figure [1-3](#index_split_000.html#p17)\
    \ to get a sense of how 1000 results of `random.random()` are distributed. It\
