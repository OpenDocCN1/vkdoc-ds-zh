    pair[1])[:5]


    In my case, account *2* has the most followers:


    [(2, 15), (18, 14), (6, 12), (11, 12), (32, 10)]


    Let’s examine the neighbors of account *2*. We are mostly interested in the number
    of their followers:


    [g_scale_free.out_degree()[k] for k in list(nx.neighbors(g_scale_free,2))]


    It looks like the majority of them don’t have any followers!


    [2, 0, 0, 0, 1, 3, 1, 0, 9, 0, 0, 0, 0, 0, 0]


    This is why with a naively created directed scale-free graph, the misinformation
    spreading is kind of limited to a small *neighborhood* of the sources.


    An easy way to fix it is to use an undirected graph. Or significantly increase
    the top players’ influential power in a much larger graph. Unfortunately, the
    second option crashes my laptop. Please try the first approach on your own.


