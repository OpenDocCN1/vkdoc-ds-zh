    R. Li and A. Nakano, *Simulation with Python*, [https://doi.org/10.1007/978-1-4842-8185-7_7](https://doi.org/10.1007/978-1-4842-8185-7_7#DOI)


    Chapter 7 roCk, SCiSSorS, and paper: Multi-agent SiMulation **Community Formation
    on a Street**


    First, let’s build a simplest agent-based simulation from scratch: the Schelling
    model of segregation. This is a model by economist Thomas Schelling. The idea
    is simple; without external factors, people in a region will move or stay in their
    original spots according to their similarities with their neighborhoods. Ultimately,
    different communities will form spontaneously.


    You may recognize that the idea has common characteristics as the forest fire
    percolation model we discussed in an earlier chapter. That’s right. They are both
    on a *grid* with *agents* or *nodes* as elements to change state. However, different
    from the forest fire one in which a predefined probability controls the behavior
    of a node, people make decisions to move or stay dynamically as the environment
    changes in Schelling’s model.


    For simplicity, we study the Schelling model on a one-dimensional *street* rather
    than a two-dimensional *community*. The plain English description of the question
    is the following: suppose there is a street with *N* rental properties; some of
    them are occupied, and some are open to move in. Let’s make an assumption that
    there is no cost to change properties. There are two kinds of people, *A* and
    *B*. Both kinds of people love to stay with their own kind. If both their neighbors
    are of different kinds, they will pick an unoccupied property and move there until
    the majority of people are happy with their neighbors.


    Let’s use a *list* data structure to model the street and use *0* to indicate
    that a spot/


    rental property is not occupied. We will use *-1* and *1* to indicate a property
    that is occupied by group *A* or group *B* people. Note this choice is for visualization
    simplicity as we can easily check the formation of clusters by a scatter plot.


    The first version looks straightforward:


    N = 300


    OCCUPATE_RATE = 0.9 # 90% are occupied originally


    AB_RATIO = 1 # RATIO of A to B


    ROUNDS = 100


    street = np.array([0 for _ in range(N)])


    for idx, house in enumerate(street):


    if np.random.rand() < OCCUPATE_RATE:


    street[idx] = -1 if np.random.rand() < AB_RATIO/(1+AB_RATIO) else 1'
