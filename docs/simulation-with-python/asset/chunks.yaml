    \ = $45^\\circ$\")\n    ax_polar.text(np.pi/12, 0.45, r\"$r = 0.75$\")\n    ax_polar.set_title(\"\
    Representing a Point in Polar Coordinate System\", fontsize=20)\n```\n\n现在，你会选择哪个选项？它们听起来都挺合理的，不是吗？让数据说话吧。以下代码片段使用两种方法在圆内生成\
    \ `10,000` 个随机点。让我们通过可视化生成的点的分布来找出答案。\n\n![](index-26_1.png)\n\n## 第1章 使用蒙特卡罗模拟计算圆周率\
    \ π\n\n将绳子长度设为 `1.25`，选项 1 给出了图 1-8。\n\n**图 1-8.** 使用笛卡尔坐标采样的结果\n\n表 1-1 中的统计数据告诉我们，有多少点会因为落在圆外而不会被使用，以及有多少点能被山羊到达等。\n\
    \n**表 1-1.** 笛卡尔坐标系采样中每个区域的点的数量\n\n| **圆外点** | **不可达点** | **可达点** |\n| :--- |\
    \ :--- | :--- |\n\n如果选项 1 是正确的，这实际上意味着 `1.25` 可能太长了。并且大约 `20%` 的 CPU 时间被浪费了。\n\
    \n让我们看一下选项 2 产生的结果，如图 1-9 所示。\n\n![](index-27_1.png)\n\n## 第1章 使用蒙特卡罗模拟计算圆周率 π\n\
    \n**图 1-9.** 使用极坐标采样的结果\n\n如果选项 2 是正确的，我们没有浪费 CPU 时间，但统计数据看起来令人担忧。\n\n我统计了表 1-2\
    \ 中的数字。\n\n**表 1-2.** 极坐标系采样中每个区域的点的数量\n\n| **圆外点** | **不可达点** | **可达点** |\n|\
    \ :--- | :--- | :--- |\n\n用于绘图的源代码太长，因此省略。然而，它们应该很容易复现。\n\n好吧，看看这些点的散点图；哪一个看起来更随机？很明显，选项\
    \ 1 展示了比选项 2 更高水平的随机性。如果我们放大选项 2 的结果，这一点就更加明显了，如图 1-10 所示。\n\n![](index-28_1.png)\n\
    \n## 第1章 使用蒙特卡罗模拟计算圆周率 π\n\n**图 1-10.** 放大极坐标系的结果后，密度不均变得清晰\n\n两个方形区域显然包含不同数量的点。更靠近原点的那个包含更多的点，而离原点更远的那个包含更少的点。\n\
    \n原因是，如果你对坐标系进行变换，均匀分布将会失真。尽管这些点在极坐标方面是均匀分布的，但使用三角公式进行的变换扭曲了它们，使得它们在笛卡尔坐标中不再是均匀分布的。这无疑敲响了警钟。\n\
    \n以下代码片段将使用二分法估算绳子的长度。当然，你可以改变绳子另一端的位置，但我们还是坚持使用地块左下角的简单位置。注意，我们将使用选项 1 的结果，因为它是正确的模拟。\n\
    \n二分法是一种求根方法。在这里，我们只是借用这个思想。\n\n因为随着绳子长度的增加，可达点的数量单调增长。假设我们从范围 `[0, 2]` 开始寻找长度，并从中间点\
    \ `1` 开始；如果超过一半的点是可达的，我们开始在 `[0, 1]` 中搜索，并从新的中间点 `0.5` 开始。同理，如果少于一半的点是可达的，我们选择\
    \ `1.5` 作为新的中间点，并在范围 `[1, 2]` 中搜索。迭代继续，直到满足停止条件。\n\n```python\n## 第1章 使用蒙特卡罗模拟计算圆周率\
    \ π\n\nrandom.seed(2021)\n\nnum_points = 10000\nnum_valid_points = 0\nxs, ys =\
    \ list(), list()\n\nfor g in range(num_points):\n    x, y = (random.random() -\
    \ 0.5)*2, (random.random() - 0.5)*2\n    if x**2 + y**2 <= 1:\n        xs.append(x)\n\
    \        ys.append(y)\n        num_valid_points += 1\n```"
  raw: 'You may notice that the preceding method is not computationally optimal. A
    better way is to generate enough points first, then determine the length of the
    leash later. We will approach the computation in this improved way later.


    **What Randomness?**


    Wait a minute, we have an ambiguity here. It is easy to imagine a uniformly distributed
    random point inside a *square*: you just make it uniform on one side and uniform
    on another side as well. However, what does it mean to have a uniformly distributed
    random point inside a *circle*? How would you generate tens of thousands of such
    points?


    ![](index-24_1.png)


    Chapter 1 CalCulating pi with Monte Carlo SiMulation


    You have two options:


    1\. You only care about a circle, but you use a square that exactly circumscribes
    the circle to do the work. You still generate


    uniformly distributed points in the square but discard those


    that fall outside of the circle. You use these that fall inside the circle to
    do the calculation. This does guarantee the same kind of uniformity, but the roaring
    CPU will probably not be happy


    because only about *78.5%* of its work is honored.


    2\. Another option is to use the polar coordinate as shown in


    Figur[e 1-7\. F](#index_split_000.html#p24)irst, you generate a uniformly distributed
    radius between *0* and the radius of your land, say, *R*, then you generate a
    uniformly distributed radian value between *0* degree and *360*


    degrees. The location of the point is also uniquely determined.


    ***Figure 1-7.** A polar coordinate system can also uniquely define a point on
    a* *2-D plane*


    In the example illustrated earlier, a point in 2-D space is uniquely determined
    by a pair ( *θ*, *γ*) where *θ* is the angle that the point rotates counter-clockwise
    against the *θ =* 0 line, which is represented by the dotted line. γ is the distance
