    Our logic is based on the observation of accounts’ behaviors on social media.
    The source of the information is always trying to influence the followers. A susceptible
    person will be infected if their resistance is smaller than a random number.


    For an infected person, there is a chance to become recovered by comparing against
    a random number, but if it fails, the resistance will be halved or reduced by
    a random number, whichever is larger.


    For a recovered person, the resistance will be increased, up to 100% immune, if
    the resistance is greater than a random number in each round; otherwise, the person
    will fall back to the susceptible domain.


    We already see the initial state, but let’s also take note of the resistance numbers:


    ```

    {node: sg.nodes[node]["resistance"] for node in sg.nodes}

    ```


    ```

    {0: 0.417022004702574,

    1: 0.7203244934421581,

    2: 0.00011437481734488664,

    3: 0.30233257263183977,

    4: None}

    ```


    Next, let’s explore the system step by step. Depending on the random number seeds,
    your results may look different from mine. After four iterations, my network looks
    like the one in Figure 9-6. The resistance values remain unchanged, but account
    *0* bought the story pushed by account *4*. Figure 9-6 shows the updates of states.


    ![](index-159_1.png)

    ![](index-159_2.png)


    **Chapter 9 Misinformation spreading and simulations on a graph**


    ***Figure 9-6.** Account 0 is contaminated with misinformation*


    Just after another iteration, my graph changes to the following. Account 1, with
    a relatively high resistance, bought the story, as shown in Figure 9-7.


    ***Figure 9-7.** Account 0 recovered, while account 1 bought the story*


    After two more iterations, things change again. Figure 9-8 shows that none of
    account 4’s followers believe in it.


    ![](index-160_1.png)

    ![](index-160_2.png)


    **Chapter 9 Misinformation spreading and simulations on a graph**


    ***Figure 9-8.** Both accounts 0 and 1 are immune to account 4’s misinformation*


    The resistance data shows that account *1* is not only recovered but also highly
    unlikely to buy the misinformation spreader’s story anymore.


    ```

    {0: 0.417022004702574,

    1: 0.9184259825270369,

    2: 0.00011437481734488664,

    3: 0.30233257263183977,

    4: None}

    ```


    Such states are likely going to last forever as account *4* has no approach to
    reach account *3*, unless ads are available. We say that our system is stable.


    Let’s try a bigger system with ten accounts and a different topology. In this
    topology, there are much more bidirectional connections which can represent a
    small community, like a family group or a local community. This topology is represented
    in Figure 9-9.


