    \ perimeter and *D* is the diameter:\n\n*C* = π *D*\n\n*A* = π *R*² = π *D*² /\
    \ 4\n\nNow, suppose one sand grain falls randomly on the square, what is the chance\
    \ that this grain will be inside the circle? Well, it is kind of obvious: it is\
    \ the ratio of the circle’s area and the square’s area \\( S \\). It must also\
    \ be the chance we are looking for as long as a good level of *randomness* is\
    \ present.\n\nWait, we also have the expressions of *A* in terms of π, right?\
