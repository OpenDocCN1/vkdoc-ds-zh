    \n***图 4-1.** 一个向右运动的小球*\n\n我们所说的速度为 `(0.2, 0.2)` 到底是什么意思？让我们为模拟定义一些具体的单位。假设长度以米为单位，时间以秒为单位。因此，小球的速度单位是米/秒。我们的小球从位置\
