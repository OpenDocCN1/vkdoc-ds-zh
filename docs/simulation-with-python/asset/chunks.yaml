    \n---\n\n## 第四章 二维盒子中的球：一个简单的物理引擎\n\n如果你是游戏迷或动漫迷，你可能听说过“物理引擎”这个词。当你在《战神》中操控奎托斯时，他的斧头与敌人和环境相互作用。你会觉得这种互动是真实的，并且他的斧头确实很沉重，像金属一样。你实际控制的只是一个\
