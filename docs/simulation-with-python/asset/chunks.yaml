    **Summary**


    In this chapter, we studied an interesting gambling scenario. We demonstrated
    that different gambling strategies are based on different levels of preference
    over exploration or exploitation. We also ran the simulation based on the Bayesian
    approach.


    **CHAPTER 4**


    **Balls in a 2-D Box,**


    **a Simple Physics Engine**


    If you are a gaming fan or an anime fan, you probably heard about the term physics
    engine. When you play Kratos in the *God of War*, his axes interact with the enemies
    and the environment. You feel that such interaction is real, and his axes are
    indeed heavy and metal-like. What you are actually controlling is just a playstation
    controller, but the impression is on another level. Here, physics engines are
    responsible for creating such feelings of being in a physical world.


    A physics engine is a computer software that simulates certain physics systems
    such as rigid-body interaction, fluid dynamics, lighting systems, etc. In video
    games, physics engines are responsible for simulating the interaction of players
    with the environment.


    If players destroy a building, the collapsing of the building has to be like in
    real life: bricks are heavy, and wooden structures are light. In animation like
    *Moana*, the water effect is created by physics engines that are dedicated to
    simulate water movement.


    There are physics engines designed for snowflakes, hairs, and other systems as
    well.


    In this chapter, we are going to build our own simplistic physics engine to simulate
    a very limited system: balls in a 2-D box.


    **One Ball in a 2-D Box**


    Let’s start with the simplest example. The scenario is very much like pooling
    or snooker, but we will start with only one ball. The following code snippet draws
    a ball in the middle of a rectangular box:


