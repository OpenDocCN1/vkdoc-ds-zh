    \ | s_sunny)`\n\n`P(cloudy | sunny)`\n\n在表达式 `P(s1 = cloudy | s0 = sunny)` 中，我们使用了条件概率的符号。它简单意味着，在前一小时天气为晴天（这是一个*条件*）的情况下，下一小时天气为多云的概率是\
