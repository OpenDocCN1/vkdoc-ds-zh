    \n***图 2-1.** 基于转移概率的天气预报示意图*\n\n那么，这究竟意味着什么呢？我们如何使用表格或图形来预测天气？想法很简单；我们从一个当前天气（即一个状态）开始，然后根据转移概率转移到其他可能的状态。例如，如果当前状态是晴天，那么下一小时，我们有\
    \ `1/2` 的概率保持晴天，有 `1/3` 的概率变为多云，等等。到目前为止看起来很简单。那再下一小时的天气呢？我们必须结合所有可能的*轨迹*来进行预测。例如，晴天状态可以通过三种不同的轨迹达到：从晴天开始，从多云开始，以及从雨天开始。这给了我们如下的组合概率：`P(s_sunny)\
