    \ the `transition_dict` to generate a sentence. Here is an example that I start\
    \ with `i` and keep adding words to the sentence until there is no matching in\
    \ the `transition_dict`:\n\n```\ndef sample_according_to_value(to_dict: dict):\n\
    ```"
