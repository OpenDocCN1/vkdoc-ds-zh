    \n现在，你手下有 1000 人听候你的命令。你将这样做：你让每个人在方形纸上画一个最大的内接圆。之后，让他们将*1000*颗沙粒*随机地*撒在纸上。每个人都需要仔细计数并记录落在圆内的沙粒数量。当然，沙粒可能意外落到纸张外面。如果是这样，这个人需要重新撒，直到全部\
    \ 1000 颗沙粒都落在纸上为止。\n\n国王感到困惑。而你显得胸有成竹，因为你知道你的国王并不精通数学——就像本书的大部分读者一样——并且很容易对枯燥的方程式感到厌烦。而你的对手有一堆几何学上的胡言乱语要向国王解释。\n\
    \n![](img/index-15_1.png)\n\n你的对手正在用多边形的周长来逼近圆。正如你从图 1-2 中所见，随着边数的增加，对周长进行分割变得明显繁琐起来。\n\
    \n***图 1-2.** 用多边形逼近圆*\n\n你注意到，你的对手总是会得到一个低于真实周长的值，因为这些多边形是内接的，意味着它们始终位于圆内。为了得到一个所谓的上界，你的对手还必须使用外切多边形。\n\
    \n另一方面，你所要做的就是坐在那里，从容地向国王解释你的方法之美。你所做的其实正是一场*蒙特卡洛模拟*。\n\n你只需等待手下送来越来越多的数据，直到一天结束。\n\
    \n角色扮演先到此为止，让我们来探究一下，为什么让 1000 个人反复撒下 1000 颗沙粒，就能得到一个相当不错的π估计值。\n\n记住，π不仅描述了直径与周长之间的关系，也描述了半径**R**与圆的面积**A**之间的关系。这里，**C**是周长，**D**是直径：\n\
    \n**C** = π **D**\n\n**A** = π **R**² = π **D**² / 4\n\n现在，假设一颗沙粒随机落在正方形上，这颗沙粒落在圆内的概率是多少？嗯，这很明显：它是圆的面积与正方形的面积**S**之比。只要存在良好的*随机性*，这个比值必然也是我们正在寻找的概率。\n\
    \n等等，我们还有用π表示的面积**A**的表达式，对吧？如果我们代入会怎样？让我用\\( P(\\text{沙粒在圆内}) \\)来表示沙粒落在圆内的概率。我们有以下表达式：\n\
    \n\\[\nP(\\text{沙粒在圆内}) = \\frac{\\text{圆的面积}}{\\text{正方形的面积}} = \\frac{A}{S}\
    \ = \\frac{\\pi D² / 4}{D²} = \\frac{\\pi}{4}\n\\]\n\n惊喜！这个概率并*不*依赖于正方形的大小。唯一的问题是，这个美妙的结论仅在理论上是正确的；我们必须通过采样来估计这个概率。这就是为什么扮演智者的你，索要了大量沙粒和\
    \ 1000 名眼尖心细的人来重复这些实验。每个实验都会给出一个π值，到了这一天结束时，我们可以取所有实验结果的平均值。\n"
