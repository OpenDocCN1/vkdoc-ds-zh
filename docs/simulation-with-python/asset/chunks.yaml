    \ size?\n\nAnother scientist is studying the robustness of a computer network.\
    \ He is looking for solutions for disaster recovery under extreme cases. Suppose\
    \ the network goes down and the administrator only has limited resources to start\
    \ certain key nodes. How much can the network be restored? Which nodes should\
    \ be started first given limited resources?\n\nThese two questions seem unrelated,\
    \ but they are actually strongly similar under the name of *percolation*. Percolation\
    \ or percolation theory is the study of clustering behaviors of random networks.\
    \ The theory originated naturally from many physical, chemical, and biological\
    \ systems. For example, in the case of the movement of water in porous material,\
    \ whether the water can percolate through the porous material depends on the porosity\
    \ of the material. For medical delivery in muscle tissues, the movement of medical\
    \ products can also be modeled as a percolation process.\n\nBack to the forest\
    \ fire questions, if we assume that the forest is a network of trees that between-tree\
    \ fire spreading is determined by a probability, then the question of forest fire\
    \ prevention becomes the determination of a critical probability of fire spreading\
