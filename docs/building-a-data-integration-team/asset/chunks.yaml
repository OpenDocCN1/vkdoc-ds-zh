    choose to store the information, make sure you direct the right question to the
    right team members and, more importantly, get the answers you need.


    ##### Source-to-Target Mapping


    If there’s one thing you take away from this book, it’s the importance of properly
    maintaining a Source-to-Target mapping (STTM) spreadsheet . This document is the
    end all, be all of integration and, consequently, a mandatory part of the process.
    No excuses for skipping this part, so read and reread this section until it becomes
    rote.


    Because the STTM is such a critical component, I will go into more detail on its
    purpose, design, and usage than in other sections. Hopefully, by the end of the
    reading, you’ll have a clear understanding of why this deliverable matters so
    much.


    ###### Purpose


    The Source-to-Target mapping is “a set of data transformation structures that
    determine how to covert the structure and content of data in the source system
    to the structure and content needed in the target.”^([^(80)](#fn80)) In short,
    it is your playlist of requirements for extracting, transforming, and then reloading
    your data. Think of it as a roadmap of expected inputs and outputs, with the step-by-step
    transformation in the middle.'
  trans: '

    ### 数据概况分析


    我们有权访问源系统，并获得了供我们审查的完整数据集。但我们所使用的数据有多干净、有效和可靠？为了回答这个问题，我们首先必须进行`数据概况分析`，即审查源数据、理解其结构、内容和相互关系，然后识别它们对数据项目的潜力的过程。^(⁷⁸)


    我们在这里关注的是，我们正在分析的源数据能否干净地迁移到目标系统中。例如，假设你要迁移 20,000 条联系人记录。其中只有 25%（即 5,000 条）包含街道地址。然而，新系统*要求*插入时必须包含此街道地址。换句话说，如果不做任何处理，你将会有
    15,000 条记录被新系统遗漏。你该怎么办？


    你大概可以想出几种解决方案：


    1.  在源系统中，将空白街道地址设置为默认值“N/A”。

    2.  允许目标系统临时接受`NULL`值，并在初始迁移完成后重新启用约束。

    3.  告知业务方，必须有人在源系统中填充这些记录。


    上述每个选项都需要付出特定程度的努力，你必须在执行任何迁移之前与团队协作做出决定。暴露这些问题及其解决方法是`数据概况分析`的主要目的。


    我见过许多有才华的分析师在交付这件工作时功亏一篑。哪些数据基本要素重要，哪些应该省略？一个建议是包含以下主题：


    -   收集描述性统计信息，如`最小值`、`最大值`、`计数`和`总和`

    -   收集数据类型、长度和重复模式

    -   使用关键词、描述或类别标记数据

    -   执行数据质量评估，评估对数据执行连接操作的风险

    -   发现元数据并评估其准确性

    -   识别分布、候选键、外键候选项、函数依赖和嵌入式值依赖，并执行表间分析


    对于新手来说，这看起来很复杂，事实也确实如此。幸运的是，我们无需从头开始，因为有多种开源和第三方工具可供使用。^(⁷⁹) 我多年来推荐的工具之一是 Don
    McMunn 的免费数据概况分析工具包，网址为 [*http://www.ipcdesigns.com/data_profiling/*](http://www.ipcdesigns.com/data_profiling/)。它为
    SQL Server 和 Oracle 提供了一系列查询，用于创建数据概况分析表，你可以将其整合到你的数据集中。至少，它为你可能希望在分析中包含的标准数据概况分析字段提供了指南。


    请记住，即便是分析一小部分数据集，也远比完全不审查要好。


    ### 问题日志


    在你的数据设计过程中，不可避免地会遇到需求收集阶段从未讨论过的情况。这可能是一个孤立的字段，或是一张适合新目标但尚未被识别出来的数据表。你会产生疑问，需要进一步澄清。为了追踪这些情况，我们建议你将评论存储在一个`问题日志`中，这是一个用于记录和跟踪与数据质量及数据迁移过程相关的问题或疑问的文档。将这份文件保存在实体笔记本、U
    盘文件中，或者更好的是保存在团队可以在线查看并提供即时反馈的共享文件夹中。无论你选择哪种方式存储信息，都要确保将正确的问题交给正确的团队成员，并且更重要的是，获得你需要的答案。


    ### 源到目标映射


    如果本书有一样东西你能够铭记于心，那便是正确维护一份`源到目标映射`（`STTM`）电子表格的重要性。这份文档是集成的终极要义，因此也是过程中必不可少的一部分。没有任何借口可以跳过这一部分，请反复阅读本节，直至烂熟于心。


    由于`STTM`是一个如此关键的组成部分，我将在其目的、设计和用法上比其他部分阐述得更详细。希望阅读完本章后，你能清楚地理解为什么这项交付成果如此重要。


    #### 目的


    `源到目标映射`是“一组数据转换结构，用于确定如何将源系统中的数据结构与内容转换为目标系统所需的结构与内容”。^(⁸⁰) 简而言之，它就是你提取、转换并重新加载数据的需求清单。将其视为一张预期输入和输出的路线图，而中间是逐步进行的转换过程。

    '
- fmt: '###### Design


    Shown in the following is the *minimal* amount of information you will need for
    your STTM spreadsheet:


    - `Source Datasystem`: The generic or formal name of the system that serves as
    the source, for example, `Oracle` or, if by official organization title, `Legacy
    Contact Management System`

    - `Source Table`: The physical name of the source table, for example, `CONTACT`

    - `Source Field`: The physical name of the source field/column, for example, `"Name"`,
    `"Email"`, or `"Street Address"`

    - `Target Datasystem`: The generic or formal name of the system that serves as
    the target, for example, `Salesforce` or, if by official organization title, `Payroll
    Management System`

    - `Target Table`: The physical name of the target table, for example, `EMPLOYEE__C`

    - `Target Field`: The physical name of the target field/column, for example, `"Name__c"`,
    `"Email__c"`, or `"street_address_1__c"`

    - `Transformation Rule`: The business rules required for transforming the data
    from the source field to the target field, for example, `"Join contact_id on payroll__c
    and add rowid where address.primary_address = TRUE and address.valid=TRUE"`


    A template illustrating this pattern is in the Appendix.


    If this design sounds relatively simple, think again. I’ve met many database experts
    who, thinking they had mapped their sources and targets with single-phrase transformation
    sentences, regret their decisions months later when they needed to reference this
    information. The important thing to keep in mind is specificity and keeping information
    current. If you need to have lengthy details, then feel free to do so in a separate
    document, perhaps with a hyperlink in the `Transformation Rules` with something
    to the effect of “See document XXX for more details.” Make sure, above all else,
    that the document makes sense to the readers. Don’t get too technical or wordy
    as this document most likely will be your legacy after you close up shop and leave
    or, more optimistically, delegate to others after you win the lottery and spend
    the remainder of your working years sipping Mai Tais on the beach.


    Even with the provided information, however, you may still not have enough. Of
    course, you’re going to modify your business requirements at some point, and new
    tables and fields may need to be added as you continue analyzing and finding more
    data points. Note that we’re not talking about *versioning*, which is overwriting
    the STTM in place and replacing it with the latest version. We’re talking about
    *tracking*, which is making changes and then justifying why you made those changes.
    Consider these optional fields that could be included alongside the basic STTM:


    - `Design Notes`: Additional notes not necessarily part of the transformation
    rules but still crucial for history, for example, “changed this field from `fullname`
    to `lastname` due to client request.”

    - `Date Created`: The datetime the record was initially added to the model (e.g.,
    `9/14/2019`). Once inserted, this value does not change.

    - `Date Updated`: The datetime any part of the record was modified. This value,
    when associated with `Design Notes`, will help you maintain the historical tracking.


    Now we’re getting somewhere. By adding these three descriptors, we can document
    any changes made to the STTM along with the date of origin and update. The key
    here, of course, is having robust design notes which, depending on the reasons
    for the change, may get quite bulky in length—new notes can always be appended
    on top, separating from the old notes with a semicolon (`;`). Better yet, you
    can always add a “See document xxx” reference. Modifying the `Date Updated` field
    may seem like a minor inconvenience, but it is something that, once you get used
    to, is relatively easy to follow up. Tip: If using Microsoft Excel or Access,
    select a cell and hold down the control key (`CTRL`) plus semicolon (`;`) to get
    the current date. Similarly, hold down the control key (`CTRL`) plus colon (`:`)
    to get the current time.


    There are other columns you may want to include on the STTM, and I have included
    them as part of the template located in the Appendix. One in particular that I’ve
    seen is `DataType` for both the source and target, for example, `VARCHAR(80)`,
    `DATETIME`, `NUMBER`, or any other plethora of data. I often do not include these
    values as this is more of a fixed schema design; you can look on any Entity Relationship
    Diagram to see them, so I don’t quite get the purpose. Still, you may want to
    include them for either the source or target if you frequently need to use your
    STTM spreadsheet to lookup values of a particular type such as primary keys denoted
    with, say, an `ID` on `NUMBER`.


    ###### Usage


    As we have seen, the STTM spreadsheet serves the role of not just a design tool,
    but also a reference for later review and, perhaps most importantly, a reminder
    on the decisions made. While in the throes of testing a project, stakeholders
    dealing with multiple issues may forget why they asked for a specific field or
    why they changed from Table X to Table Y three months prior. The STTM fields `Design
    Notes` and `Date Updated` will quickly settle the matter. I cannot tell you how
    often we turn back to the STTM, days, months, or even years after a project ends.
    That is why it is essential to keep the deliverable close, keeping it updated
    with the current model and making it accessible to all through either a shared
    drive or even an online database repository that allows for fast, convenient lookup
    when the system starts to crash and all eyes turn to the integration team for
    answers.


    #### Data Migration Process Flow Design


    This document, part of the design process, summarizes the detailed design for
    migration processes, including the order of operations that are to take place
    on the one-time migration and daily updates. It is a repository for the other
    deliverables that are part of the overall strategy and allows teams to communicate
    the proposed approach for project success. As with the other deliverables we have
    discussed, it too is a *living* document, always changing and available for updates.


    ##### Order of Operations


    The `Order of Operations` discusses the high-level step-by-step operations for
    object migration in general. This section breaks down into more detail for the
    `Deployment Steps` described later. I like to include illustrations whenever possible
    as they are more descriptive and comprehensive than just words alone.


    ##### Mapping Logic


    The `Mapping Logic` defines the high-level rules behind the Source-to-Target Mapping
    spreadsheet, mostly for business teams to confirm that the rules are accurate.
    Note that this is not a rehashing of the entire STTM (see section “Source-to-Target
    Mapping”) but, at most, just a few of the more essential fields that get the fundamental
    points of the integration across to stakeholders and executives. At a minimum,
    include a link to your STTM spreadsheet or repository with instructions on how
    to use it (browsers required, tools needed, and so on) and under what circumstances.'
