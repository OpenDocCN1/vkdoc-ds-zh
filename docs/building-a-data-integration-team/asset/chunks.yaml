  trans: '

    #### 演示


    `chapter7` 文件夹包含你数据系统的最新版本，该版本已复制到设计为开发、预发和生产环境的对应文件夹中。在克隆 GitHub 目录并根据第 6 章所述安装
    Pentaho 之后，请执行以下操作：


    *   根据你的操作系统，打开 `spoon.bat` 文件（Windows）、`spoon.sh` 文件（Linux）或 Data Integration
    应用快捷方式（macOS）。


    *   点击 `File/Open` 菜单（Windows 上使用 `CTRL+O`），然后导航到你从 GitHub 下载的 `chapter7\development\scripts`
    目录。双击 `job_infomotors2.kjb` 文件。该脚本将打开（见图 7-9）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig9_HTML.jpg](img/486629_1_En_7_Fig9_HTML.jpg)


    图 7-9


    `job_infomotors2.kjb` 脚本


    用 Pentaho 的行话来说，你看到的是一个“作业”。它就像一个编排引擎，负责协调 ETL 任务和活动的执行及依赖关系。^(¹¹²)


    这个作业就是我们一直在讨论的自动化脚本，它包含对我们之前数据迁移流程中确定的其它 ETL 函数的调用。该窗口按顺序显示这些任务：


    *   create target table buyer


    *   ETL source csv


    *   ETL source tsv


    *   ETL source xls


    *   select target table buyer


    你会注意到，页面底部还有一个通过 ETL 任务连接的任务。这是一个失败“跳转”，它将在任何 ETL 流程失败时触发，执行回滚操作并报告错误的类型和性质。


    *   如果你右键点击这些步骤中的任意一个，并选择“Open Referenced Object ➤ Transformation”，你将打开与该步骤关联的嵌入式脚本。就像我们在第
    6 章中所做的那样，让我们对“create target table buyer”步骤执行此操作（见图 7-10）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig10_HTML.jpg](img/486629_1_En_7_Fig10_HTML.jpg)


    图 7-10


    右键点击 create target table buyer


    **注意**：正如我们在之前的演示中所讨论的，你也可以通过点击 `File/Open` 并从 `chapter6/scripts` 目录中选择相应的名称来打开脚本。我指定的通过右键点击的方式步骤更少，但你可以根据自己的偏好选择。


    你将看到，这个步骤与我们之前使用的迭代版本编写方式相似，只是我们修改了 SQL，这样如果表不存在，就会实例化该表。换句话说，当你首次运行此应用程序时，开发数据库模式（`infomotors_dev.db`）会与
    `BUYER` 表一同创建（见图 7-11）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig11_HTML.jpg](img/486629_1_En_7_Fig11_HTML.jpg)


    图 7-11


    `CREATE TABLE BUYER` 的更新版本


    *   因为该脚本将在我们执行作业时运行，所以你无需执行任何操作。在此窗口中点击“Cancel”，然后点击窗口左上角的 `job_infomotors` 标签页。


    *   现在，右键点击“ETL source csv”步骤，并选择“Open Referenced Object” ➤ ”Transformation”。你看到的是提取（多个）CSV
    文件、转换数据并加载到 `BUYER` 表中的模型。


    你会注意到，此文件与“原型”脚本不同，我们将制表符分隔步骤以及新的 Excel 步骤分离出来，放到了各自独立的流程中。我们本可以将它们合并到一个文件中，但从架构角度来看，通过保持功能的模块化并使其专注于单一职责来分离它们是有意义的。


    *   连接器中还有其它一些模式需要我们审阅。


    *   首先，双击“Extract Multiple CSVs”将其打开（见图 7-12）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig12_HTML.jpg](img/486629_1_En_7_Fig12_HTML.jpg)


    图 7-12


    Extract Multiple CSVs


    你会注意到，在“Selected Files”处，我们有一个如下所示的目录路径：


    ```

    ${Internal.Entry.Current.Directory}/../input

    ```


    `${…}` 之间的值是一个 PDI 内部变量。它告诉我们，正在检查的变量是我们保存脚本的位置。在我的机器上，我将作业保存到了目录 `C:\Users\<<在此处输入你的用户名>>\Documents\BAIT\chapter7\development\scripts`。你的路径应该类似。变量后的
    `/../` 表示上一级目录，而 file input 是最后一个目录值。因此，我正在对路径 `C:\Users\Jarrett\Documents\BAIT\chapter7\development\input`
    执行查找，该目录包含 InfoMotors 的示例记录。


    下一列是通配符 (RegEx)，它指示要查找的文件的筛选条件，对于此任务，是 `.*.csv`。也就是说，任何以后缀 `.csv` 标识并存储在 `development\input`
    目录中的文件都会被读入系统。


    这种结构特别有用的地方在于，我们存储在 `\input` 目录中的任何带有 `.csv` 前缀的文件都会被读取并自动追加。当然，格式需要与我们预期使用的输入（`id`、`first_name`、`last_name`
    等）相匹配，一些快速的数据分析可以帮助我们确定是否确实如此。


    因为我们使用变量作为输入路径，而不是硬编码，所以我们不再需要知道脚本存储的*位置*。我们只需确保有一个上一级目录（`/../`）和一个额外的输入路径即可。正是这种语法，使得我们可以快速地将同一个脚本放入一个完全不同的环境中，它也能照常工作，而无需感知其目录结构是不同的。例如，如果你在我们的预发目录中打开同一个“ETL
    source csv”文件，你会看到我们使用了同一个文件，只是这一次，我们的预发脚本是从*预发*文件夹中读取，而不是从*开发*文件夹中读取。在我看来，这种通用代码是部署的秘诀。无论我们将此脚本存储在何处，我们只需确保目录的后半部分遵循某种模式，就可以顺利运行。


    **注意**：出于演示目的，SQLite 数据源的名称已被调整为映射到 `infomotors_dev.db`、`infomotors_staging.db`
    和 `infomotors_prod.db`。这样做是因为我们在同一台机器上运行 ETL 脚本，并且不希望覆盖本应隔离的数据。在典型的基础设施中，你很可能使用相同的数据库模式、表和字段，而这个连接器可以保持硬编码，或者，如果你愿意，也可以作为一个变量。


    我将把 `job_infomotors` 作业中的 ETL source `.tsv` 和 ETL source `.xls` 脚本留给你去审阅。你会看到它们遵循相同的格式，只是通配符值被调整为匹配它们的筛选条件
    `.*.tsv` 和 `.*.xls`。与 CSV 文件一样，我们可以将任意数量的带后缀文件添加到该环境的 `/input` 文件夹中，每个文件都将包含在我们的作业运行中。

    '
- fmt: '# The Output Step


    We have two more steps to examine before we test the complete automation.


    - In the `job_infomotors` page, right-click the “select target table buyer” step
    and select “Open Referenced Object ➤ Transformation.” The process will open.


    The purpose of this step is to meet the requirements specified in our Data Migration
    Process Flow which will serve as a sanity check when we test our job execution.
    Two activities are accomplished (see Figure [7-13](#486629_1_En_7_Chapter.xhtml#Fig13)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig13_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig13_HTML.jpg)


    Figure 7-13 – The “select target table buyer” Process


    The first activity executes a `SELECT COUNT` on the `InfoMotors BUYERS` table.
    The `PDI` log displays this count for your review. The second `SELECT` retrieves
    all the fields of the `BUYER` dataset and delivers the results to a CSV file called
    `BUYER.csv`. Similar to the inputs in our extraction steps, the output is pointing
    to your relative environment’s `/output` directory (see Figure [7-14](#486629_1_En_7_Chapter.xhtml#Fig14)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig14_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig14_HTML.jpg)


    Figure 7-14 – The `BUYER.csv` Output Directory


    ## Rollback


    Our final step is the error step. ETL tools allow you to control how you want
    your exception logic to work. In the ETL world, two overall categories of errors
    can occur. The first is a Technical Error, and you will see this due to an issue
    on the network, infrastructure, or security side of the house. For example, a
    Technical Error is caught when you try to retrieve information from a database
    that is offline or when attempting to log into a system using an old password.
    In these situations, your ETL would be programmed to alert the network, infrastructure,
    or database administrators on the error cause, time, date, and any other information
    that would be helpful.


    The second category is called a Business Error. This error happens if a workflow
    rule or requirement that was expected to occur does not. For example, if a field
    contains letters when it should provide only digits, a Business Error will be
    triggered. The IBM naming standard and workaround we discussed earlier in this
    book is another example of a Business Error, albeit one that would not set off
    alarms. Given the subjective extent to which data can be “wrong,” Business Errors
    are often harder to resolve than technical glitches, and your team will spend
    a considerable amount of time trying to find new ways to eliminate data issues.
    Fortunately, your strategy of continuously improving your ETL logic, improving
    your deployments, and monitoring changes (see Chapter [8](#486629_1_En_8_Chapter.xhtml))
    will fall into place, and your team eventually will become crack sharpshooters
    in the area of data remediation.


    For now, we’ll keep the rollback strategy simple. Any error, be it Technical or
    Business, will cause our script to fire. Open the “error rollback and alert” step
    in the usual way, and you’ll see that there are only two tasks: deleting all records
    from the `BUYER` table and sending a log alert to `PDI` with the message: `"An
    error occurred with the integration. Rolling back"` (see Figure [7-15](#486629_1_En_7_Chapter.xhtml#Fig15)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig15_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig15_HTML.jpg)


    Figure 7-15 – The error rollback and alert Step


    ## Testing the Automation


    With an understanding of the steps, it’s now time to run our job from start to
    finish. Remember when I promised you the one-button click?


    - On the `job_infomotors` main page, click the Run button. A “Run Options” page
    will open.


    - Click Run on the “Run Options” page.


    (Okay, you’re probably saying that this was TWO button clicks. We’re not quite
    finished in this chapter, so be patient.)


    If all works as expected, your job flow should run through the entire process,
    start to finish. That is, we met the requirements stated in our Data Migration
    Process Flow and Source-to-Target Mapping and aligned with the purpose and future
    state of our Data Migration Plan. That is a lot to accomplish in just TWO button
    pushes.


    If you review the Execution Results Logging pane, you’ll see the different workstreams
    that fired along with the read and write counts, alerts, and duration. This log
    pane is a feature you’ll use in `PDI` often, but any ETL system worth its cost
    will offer similar reporting standards (see Figure [7-16](#486629_1_En_7_Chapter.xhtml#Fig16)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig16_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig16_HTML.jpg)


    Figure 7-16 – Execution Results Logging Panel


    According to my log, we loaded 687 records just shy of 2 seconds. Not bad timing,
    despite that we are still one click too many.


    If you want to view the records that we loaded and subsequently pulled from our
    database table, navigate over to `chapter[7](#486629_1_En_7_Chapter.xhtml)/development/output`
    and open the `BUYER.csv` file.'
