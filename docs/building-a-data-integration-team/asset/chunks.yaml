    for architecting/developing a design.


    *   Operating System: Some hiring managers focus more on the software and language
    than the operating system, but this skill is an excellent predictor of how fast
    new team members will be able to hit the ground running. If your shop leans toward
    a Windows environment, then state that. If Mac dependent, then go that way. What
    matters is that you interview people who already have training in the particular
    platform you use. I’ve encountered many people with fantastic integration skills
    who did not understand simple Unix shell commands. The curve can be steep when
    simultaneously learning new software on unfamiliar operating systems, so keep
    this in mind when writing your job description.


    *   Language: By this, I mean native and secondary language fluency. As mentioned
    earlier, communication among the team is critical, even with your more technical
    back-end roles, which may have a last-minute update during deployment. If you
    need fluent speakers and writers in a particular language, then call that out.


    An excellent place to start thinking about your description is [`https://work.chron.com/job-description-etl-developer-26435.html`](https://work.chron.com/job-description-etl-developer-26435.html).^([^(59)](#fn59))
    Various sites across the Web will have other alternatives as well.


    ## Finding Candidates


    Once you have a clear understanding of what you need, where do you go to find
    the best pool of candidates? There are two main avenues to explore:


    *   Internal to your organization


    *   External to your organization


    ### Internal Candidates


    If you work for an organization where roles are loosely defined, the integration
    project itself is a short-term supplemental, or if you are just beginning to build
    your integration practice, you may be able to find some interested candidates
    within your current software development or IT team. The main advantage of going
    this route is that you can establish a pipeline early on as those qualified individuals
    who want to take on additional responsibilities and who will let you know this
    path as soon as you announce the project. The second advantage of internal hiring
    is that you can assess your candidates based on their peers’ recommendations—you
    will be able to evaluate those who fit the role better than an unknown source.
    Of course, if you require a different degree of skills than what is available
    within the organization, you will have to reach out externally.


    ### External Candidates


    #### Referrals


    One of the best ways to find qualified external candidates is the same as the
    route of evaluating internal candidates: referrals. In this case, getting leads
    from your top hires is by asking about their favorite past coworkers. This method
    probably works more than any other, so much so that one study found that 46% of
    hires at top-performing companies came from internal referral sources.^([^(60)](#fn60))
    The reason referrals are great at finding candidates may not be monetarily related
    (it is questionable whether employee referral bonuses work,^([^(61)](#fn61)) but
    rather more a function of people knowing their associates’ personalities, likes,
    and dislikes).


    Although a referral program may land you some good leads, it is not the only method.
    The following are a few others you might want to consider.


    #### Outsourcing


    Earlier, we talked about hiring independent contractors for placing on short-term
    projects. If you need extra horsepower, want specialized skills, or want a different
    perspective on your internal culture, bringing in a consulting team with specializations
    in data warehousing, data integration, or anything with the words “data” and “migration”
    in it might be the way to go.^([^(62)](#fn62)) Again, this might only be a quick
    fix for a much lengthier initiative that needs full-time commitment, but—if you
    are willing to outsource your team to a third party and don’t mind footing the
    bill—it does substitute for direct employee support.


    #### Posting to Job Boards


    Posting to a job board is probably the number one method for companies with do-it-yourself
    recruiting, and it does have its strengths. But there is also a bit of effort
    from your end to ensure the various applicants truly fit the role and haven’t
    exaggerated on their resume. We advise that you post your jobs to multiple locations
    and to the ones that have good reputations for vetting their candidates. There
    are a lot of free posting sites with which you can start. Try [`www.betterteam.com/job-posting-sites`](http://www.betterteam.com/job-posting-sites)^([^(63)](#fn63))
    for a list of popular ones and see where your first posts will lead.


    #### Hiring a Recruiter


    Finding candidates can be a lengthy, time-consuming process. Rather than you doing
    the work, hiring a recruiter who will do it for you may be a better use of your
    time. They will post job descriptions to online boards, go through social media
    outlets, and arrange the next steps in the interview process.^([^(64)](#fn64))
    If you do decide to go this route, make sure you precisely cover the job descriptions
    and the required skills with the recruiter. Too often, I have heard of recruiters
    who perform mass mailings for job descriptions on LinkedIn, returning with a list
    of semiqualified candidates and then following up with them with only a partial
    explanation of what the organization meant. Four out of five times, this occurs
    because the organization did not know either. Simply stated, when working with
    a recruiter, be clear and precise on the type of integration skills and qualifications
    you need and check in often for status updates and clarifications.


    ### Networking


    Attending career fairs and showing up at recruiting events are other ways to find
    qualified job leads. This practice is solid advice to follow even when the position
    is not available yet but could be in the future. The person you meet today could
    be a top hire in the future, and keeping in touch with them can lead to many potential
    opportunities for them as well as your organization.'
  trans: '

    ### 职位描述


    明确你想要的是短期还是长期雇佣，是撰写优秀职位描述的关键。你需要提供足够的信息，让候选人能够评估自身资质，同时又要设法保持描述的简洁性。根据经验，Indeed.com
    建议将职位描述的长度控制在 700 到 2000 个字符之间。


    就为你的人员配置整合项目而言，你需要为工作职责包含一些样板文本。我建议也加入以下主题：


    -   **工作经验**：整合需求越复杂，你期望候选人具备的、以年计的、特定于整合领域的经验就应该越多。

    -   **教育背景**：许多整合岗位要求有计算机科学或数学背景，但这并非绝对必要。我见过很多优秀的商科专业毕业生成为了出色的整合项目负责人，因为与利益相关者沟通的能力是该职位的关键要素。如果项目侧重于分析，那么至少应要求具备一些数据科学方面的培训经历。

    -   **编程语言**：如果招聘的是技术岗位，你会希望你的团队至少熟练掌握一到两门编程语言。由于对数据库的依赖，`SQL` 编程是必备技能。你的 ETL
    工具可能还有其他编程要求，例如 `Java` 或 `JavaScript`，但这完全取决于所选用的软件。

    -   **软件**：你的项目由一个内部 ETL 工具驱动，该工具可能是现有的，也可能是尚待确定的。务必确保你雇用的人拥有特定应用程序或类似工具的经验。这不必是完全精确的
    ——对应，因为一个软件产品的功能可能与另一个产品相通。最重要的是候选人熟悉相关术语，并能够讨论构建/设计方案的方法。

    -   **操作系统**：一些招聘经理更关注软件和语言，而非操作系统，但这个技能是预测新团队成员能多快上手并高效工作的绝佳指标。如果你的公司倾向于 Windows
    环境，就明确说明。如果依赖 Mac，就按此操作。关键是你面试的人应该已经对你使用的特定平台有过培训。我遇到过许多拥有出色整合技能却不理解简单 Unix shell
    命令的人。在陌生的操作系统上同时学习新软件可能会面临陡峭的学习曲线，所以在撰写职位描述时请牢记这一点。

    -   **语言**：这里指的是母语和第二语言的流利程度。如前所述，团队内部的沟通至关重要，即使是更偏向技术后台的岗位，也可能在部署前有最后一刻的更新。如果你需要特定语言的流利听说读写能力，请明确指出。


    构思你的职位描述，[`work.chron.com/job-description-etl-developer-26435.html`](https://work.chron.com/job-description-etl-developer-26435.html)
    是一个很好的起点。网络上还有各种其他网站也提供选择。


    ## 寻找候选人


    一旦你清楚了自己需要什么样的人，去哪里寻找最优秀的候选人才库呢？主要有两个途径可供探索：


    -   组织内部

    -   组织外部


    ### 内部候选人


    如果你所在的组织角色定义比较模糊、整合项目本身是短期的补充项目，或者你刚开始建立整合实践部门，你可能能够在现有的软件开发或 IT 团队中找到一些感兴趣的候选人。走这条路线的主要优点是，你能尽早建立起一条人才输送管道，因为那些有能力的、希望承担更多责任的人，会在你宣布项目后立即让你知道他们的意愿。内部招聘的第二个优点是，你可以根据同事的推荐来评估候选人——相比来源不明的候选人，你能更好地判断谁更适合这个角色。当然，如果你需要的技能水平在组织内部无法获得，你就必须向外寻找。


    ### 外部候选人


    #### 内部推荐


    寻找合格外部候选人的最佳方法之一，与评估内部候选人的方法相同：内部推荐。在这种情况下，从你最优秀的员工那里获取线索的方式是询问他们以前最喜欢的同事。这种方法可能比任何其他方法都更有效，以至于一项研究发现，在表现最佳的公司中，46%
    的招聘来自内部推荐渠道。内部推荐之所以在寻找候选人方面表现出色，可能并非出于金钱原因（员工推荐奖金是否有效尚存疑问），而更多是出于人们了解自己同事的性格、喜好和厌恶这一事实。


    虽然内部推荐项目可能为你带来一些不错的线索，但这并非唯一方法。以下是另外几个你可能需要考虑的方法。


    #### 外包


    之前，我们讨论过为短期项目雇用独立承包商。如果你需要额外的人力、想要专业技能，或者希望为你的内部文化引入不同的视角，那么引入一个专门从事数据仓库、数据集成或任何包含“数据”和“迁移”字眼的咨询团队，可能就是可行之道。同样，这可能只是一项规模更宏大、需要全职投入的长期计划的一个权宜之计，但——如果你愿意将团队工作外包给第三方，并且不介意支付相关费用——它确实可以替代直接雇佣员工的支持。


    #### 在招聘网站发布信息


    在招聘网站发布信息，对于自行招聘的公司来说可能是最重要的方法，并且它确实有其优势。但这也需要你付出一些努力，以确保不同的申请者真正适合这个职位，并且没有在简历中夸大其词。我们建议你将职位发布到多个平台，并且选择那些在筛选候选人方面声誉良好的网站。你可以从许多免费的招聘网站开始。试试
    [www.betterteam.com/job-posting-sites](http://www.betterteam.com/job-posting-sites)
    获取热门网站列表，看看你最初的发布能带来什么结果。


    #### 聘用招聘人员


    寻找候选人可能是一个冗长、耗时的过程。与其自己亲力亲为，不如聘请一位招聘人员为你代劳，这可能是更有效利用时间的方式。他们会将职位描述发布到在线平台，浏览社交媒体渠道，并安排面试流程的后续步骤。如果你决定走这条路，请确保与招聘人员精确地沟通职位描述和所需技能。我经常听说，招聘人员在
    LinkedIn 上大规模发送职位描述，然后带回一份半合格的候选人名单，接着跟进时，只对组织意图做了部分解释。这种情况十有八九是因为组织本身也不清楚自己想要什么。简单地说，在与招聘人员合作时，要对所需的整合技能和资质要求清晰明确，并经常查看进展更新和进行澄清。


    ### 建立人脉网络


    参加招聘会和出席招募活动是寻找合格职位线索的其他方式。即使职位目前空缺，但未来可能会有，遵循这一做法也是明智之举。你今天遇到的人可能会成为未来的顶尖员工，与他们保持联系可以为你的组织带来许多潜在的机会。'
- fmt: "# Conducting Interviews\n\nOne of the last significant steps in hiring for\
    \ your team is the interview process. Due to the many books available on this\
    \ theme, I will not cover the basics in any detail. I will add, however, that\
    \ finding the perfect integration expert—that is, the correct balance of extroversion\
    \ and introversion, back-end coder and front-end conversationalist, documenter,\
    \ leader, and overall innovator—may be tough to ascertain in a 45-minute interview.\
    \ Rather than going through the standard rote material (I am partial to “Where\
    \ do you see yourself five years from now?”), you use your time to clarify the\
    \ `ETL` technologies with which the applicant has worked, the integration-specific\
    \ problems they have resolved, and any unique talents or traits which may be useful\
    \ for the team and organization in general.\n\nIf you are on the fence with a\
    \ particular candidate—that is, you like them but are unsure that they possess\
    \ the right skills—then I have two rules of thumb:\n\n- Go with your gut.\n- Look\
    \ for passion. You can learn any technique with the right medium, but only passion\
    \ will keep you in the game. That is especially true for integration projects\
    \ where a single misstep can lead to hours of thankless correction. If you see\
    \ that spark of excitement in your candidate, then run with it.\n\n## Summary\n\
    \nAnd there you have it. We’ve covered a lot about building the integration team\
    \ within this chapter, and there’s probably more we can go over, but we will have\
    \ to save that for a later date. Let’s consider what we’ve learned:\n\n- **Team\
    \ Personality**: Each member of the integration team should be willing to communicate\
    \ and to code on an equal basis.\n- **Types of Teams**: There are four types of\
    \ teams we discussed—functional, cross-functional, virtual, and self-directed.\
    \ Although each one has a place in data integration, the most common type will\
    \ be cross-functional.\n- **Team Sizes**: Waterfall team sizes will be large,\
    \ agile team sizes will be small. Depending on the integration project, we will\
    \ have to measure based on our needs, although two to five will suffice in the\
    \ beginning.\n- **Agile and Waterfall Team Expectations**: Agile skill expectations\
    \ are wide, waterfall skill expectations are deep. Ideally, you will want T-shaped\
    \ people.\n- **Integration Team Roles**: An integration team is like a software\
    \ development team with three fundamental differences in terms of a lead (data\
    \ integration architect), developers (`ETL`), and business analyst (integration\
    \ focused). As a reminder, the project manager still owns the plan, and the product\
    \ owner still owns the application. The technical team owns the integration *process*.\n\
    - **Recruiting Your Team**: We discussed the job description, how to find qualified\
    \ candidates both within and outside the organization, and tips for interviewing.\n\
    \nNow that we have an integration team, a project plan, and customers ready for\
    \ us to get started, it’s time for us to get our hands dirty. In the next chapter,\
    \ we talk about documentation and its importance in the realm of integration.\n\
