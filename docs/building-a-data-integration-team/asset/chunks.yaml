- fmt: '### Workshops


    A workshop is similar to a seminar in that it has an information component to
    it, but it is more experiential in that workshops involve participants in the
    learning process by utilizing small and large group discussions, activities and
    exercises, and ways to practice applying the presented concepts (see Figure [9-2](#486629_1_En_9_Chapter.xhtml#Fig2)).^([^(138)](#fn138))
    The workshop leaders (known as facilitators) keep everyone on track and expect
    all attendees to contribute.


    Because migrations and integrations strongly depend on design models and transformation
    comparisons, a workshop is a great way to learn the basics. By having students
    walk through the step-by-step process involved with software development, similar
    to the path we’ve taken in this book, you can build enthusiasm for the work that
    exists as well as gain new customers for your cause. But workshops are not for
    everyone. Some people may feel obliged to attend because their managers recommended
    it. Others may be less technically savvy than their counterparts or, unbelievable
    as it may sound, might not have any interest in the fields of integration. Those
    people would be better off avoiding the workshop as it would only cause more confusion
    or be detrimental in building group unity. I am confident that no one wants that.


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig2_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    Workshops^([^(139)](#fn139))


    ### Online Training


    Online training is a teaching program available in the form of software that teaches
    learners through informal questionnaires; fill-in-the-blank, multiple-choice,
    and true/false tests; and demonstrations. Online training moves from the physical
    classroom to the virtual one and can be live, as with a webinar, or recorded for
    on-demand viewing (see Figure [9-3](#486629_1_En_9_Chapter.xhtml#Fig3)). The variety
    of online delivery can vary, usually structured as video, audio, animation, or
    a combination of methods.^([^(140)](#fn140))


    Online training has several advantages over formal seminars: such classes can
    be run anytime and anywhere computers or mobile devices are found, are usually
    cheaper, require less of an overall time investment, and have demonstrated higher
    long-term student retention.^([^(141)](#fn141)) From the standpoint of the instructor—the
    role your team will play—the learning material you create can be more thorough
    in an online training course, allowing hours of instruction that cover many technical
    details or, if just an overview is needed, creating a standard slide presentation
    on the basic outline of your projects.


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig3_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig3_HTML.jpg)


    Figure 9-3


    Online Training^([^(142)](#fn142))


    ### Lunch and Learns


    One of the better ways to get your point across but in a more informal manner
    is through a lunch and learn, typically a session where a team shares their skills
    and expertise with others (see Figure [9-4](#486629_1_En_9_Chapter.xhtml#Fig4)).
    So named because it often takes place at lunch, the sessions last between 30 and
    45 minutes and could be a one-off meeting or delivered as a series of courses.^([^(143)](#fn143))


    A lunch and learn has several advantages over the previous methods described.
    Because it takes place in a social atmosphere, these group meetings encourage
    teamwork and cooperation, breaking down silos among teams that generally might
    be guarded during more formal presentations. I remember one particular session
    where a manager, notoriously famous for refusing to commit resources outside of
    his group, was so intrigued by the migration team’s “Where Are We Now” lunch and
    learn that he scheduled a more formal follow-up meeting with his lead developers
    the following week. A great partnership developed from that first session, and
    future lunch and learns among his peers became a routine practice.


    Lunch and learns do have their negatives as well, especially if your team members
    are remote and cannot be physically in the room. With the use of conferencing
    tools such as Webex ([*https://www.webex.com/*](http://www.webex.com/)), Join.me
    ([*https://www.join.me/*](http://www.join.me/)), or Google Hangouts ([*https://hangouts.google.com/*](https://hangouts.google.com/)),
    you can minimize some of these drawbacks, but I always experience the feeling
    that I might miss something as opposed to the face-to-face experience and focus.
    Be mindful of others when inviting your audience: lunch and learns should be voluntary
    and relaxed, a knowledge sharing session among interested parties rather than
    a mandatory meeting. Finally, make sure that the food options are well known,
    not just the dietary restrictions of your participants, which is essential, but
    also the cost of the lunch if not on the company’s budget. Don’t forget to include
    that tidbit in your calendar invite: I’ve been to sessions where the leaders expected
    us to bring individual meals but forgot to tell the participants. There are few
    things more disappointing than being hungry and realizing you are now in a 45-minute
    meeting with no food options. In these scenarios, the proverb “no such thing as
    a free lunch” becomes remarkably accurate.^([^(144)](#fn144))


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig4_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Lunch and Learn^([^(145)](#fn145))


    Whatever internal training method you choose, you’ll want your audience to have
    specific takeaways and ideas for the next steps. At a broad level, you should
    provide an understanding of the work that the integration team has accomplished,
    the benefits this work has produced over time, and the impact that future work
    will have for the enterprise and specific departments. Most importantly, you’ll
    want to stress what you need to achieve the next steps. These steps can be through
    monetary support such as funding an effort, physical participation with resources
    or systems, or even just helping teams connect the dots to see the bigger picture
    and know where your team fits in the larger schema.


    ## External Education


    At the same time that you are promoting your team, products, and processes in-house,
    you’ll want to reach outside your organization as well. One of the best reasons
    for doing that is promotion: your team is doing some great work, and letting others
    in the industry know this is the best case for wanting to purchase or partner
    with your organization. It also improves team morale—when workers see how their
    work makes a difference to others both in and out of their respective workgroups,
    both job satisfaction and productivity significantly improve.^([^(146)](#fn146))
    Thus, attending activities off the job such as meetups, networking events, and
    conferences can have a long-term influence on increasing the growth of your team.


    External education is not for everyone, however. There are times when this type
    of promotion should be minimized or even avoided. For example, you may not have
    enough internal buy-in to ensure outside success. Or you may mistrust that your
    competitors will copy the proprietary ideas you present.^([^(147)](#fn147)) For
    any of these situations, reach out to your legal department and policymakers before
    committing your teammates to speak on any topics.


    For now, we’ll go with the understanding that your team has performed some significant
    accomplishments, is getting the name across the enterprise, and has now decided
    to share with the industry at large. How should you start?'
