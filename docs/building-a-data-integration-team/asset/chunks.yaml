  trans: '

    # Microsoft SQL Server Integration Services (SSIS)


    **网站：** [`https://docs.microsoft.com/en-us/sql/integration-services/sql-server-integration-services?redirectedfrom=MSDN&view=sql-server-ver15`](https://docs.microsoft.com/en-us/sql/integration-services/sql-server-integration-services%253Fredirectedfrom%253DMSDN%2526view%253Dsql-server-ver15)


    **评价：** 早在恐龙时代（2003 年），我就第一次接触到了 `SSIS` 的第一个迭代版本，当时它叫`数据转换服务`（`DTS`），用于将 Oracle
    数据库复制到 Microsoft SQL Server 报表仓库。自那时起，`SSIS` 已经取得了长足的发展，并已嵌入到 Microsoft 产品中，既可通过
    SQL Server DBMS 许可证在本地使用，也可通过 `Azure Data Factory` 云数据集成服务在云端使用。换句话说，当你以 Microsoft
    为基础时，`SSIS` 几乎就是标准。从各方面来看，`SSIS` 实施快速、易于使用，并能与其它 Microsoft SQL/Azure 产品完全集成（见图
    5-9）。主要问题出现在当你并非 Microsoft 技术栈环境，并且没有计划购买或使用其主要产品线时。在这种情况下，你最好选择另一个 ETL 工具。


    **优点：** 较低的总拥有成本，可让你与其它 Microsoft 产品完全集成，且已包含在 DBMS/Azure 许可证中。


    **缺点：** 对于非 Microsoft 技术栈环境，支持 `SSIS` 可能是一项挑战。我建议，如果你还在犹豫，可以下载 SQL Server 的评估版本^(⁹⁷)，并试用一下
    `SSIS`。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig9_HTML.jpg](img/486629_1_En_5_Fig9_HTML.jpg)


    图 5-9


    SSIS 控制流


    # MuleSoft


    **网站：** [`www.mulesoft.com/`](http://www.mulesoft.com/)


    **评价：** `MuleSoft` 成立于 2006 年，并于 2018 年 5 月通过收购成为 Salesforce 旗下公司。最初，`MuleSoft`
    提供企业服务总线（ESB）开源软件，并在 2013 年发布其 API 管理工具 `Anypoint Platform` 后，成为首批云原生集成供应商之一（见图
    5-10）。我与 `MuleSoft` 的直接接触有限，但我通过多种渠道听说，它是一款出色的 ETL 工具，并可插入到大多数环境中。根据 Gartner 报告，`MuleSoft`
    在过去几年中客户数量翻了一番，并提供了强大的 API 管理、安全支持、多云部署以及开放核心的 ESB。与其它具备这些高级功能的工具一样，你的开发人员需要比使用其它产品具备更多的技术知识。幸运的是，`MuleSoft`
    提供了一些优秀的在线和课堂培训。


    **优点：** 目前，`MuleSoft` 似乎在市场上占据着显著领先地位，这可能与其与 Salesforce 的关联有关，也可能是因为其现有产品线吸引了那些需要全生命周期
    API 管理、混合集成以及易于上手的客户。


    **缺点：** `MuleSoft` 仍保留其作为企业服务总线的根基，采用完整集成工具功能的速度非常缓慢。该产品可能并非万能解决方案，但仍值得为你的实施进行评估。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig10_HTML.jpg](img/486629_1_En_5_Fig10_HTML.jpg)


    图 5-10


    MuleSoft Anypoint Platform


    # Informatica


    **网站：** [`www.informatica.com`](http://www.informatica.com)


    **评价：** 任何关于 ETL 的讨论都不可能忽略 `Informatica`，它是数据管理领域的首要代表。该公司自 1993 年成立以来，经历了多次迭代，从本地部署到
    2007 年率先进入云端。我于 2016 年获得了 `Informatica Cloud Specialist` 认证，自那以后，该公司已演进为下一代产品，即
    `Informatica Intelligent Cloud Services`（`IICS`；见图 5-11）。


    我对这款产品爱恨交加。它能完成集成团队所期望的工作，并且做得*非常出色*，出色到它应该出现在每个人的工具候选名单上。但另一方面，它由一家根植于数据管理领域的机构运营，我发现其现有技术有时会落后于其它供应商，不过随着最新的云端实现，这种情况可能正在改变。对我来说，最大的挑战是学习使用该工具。它功能如此丰富，以至于新用户要完全掌握它，需要培训、长期战略规划和全身心的投入。


    **优点：** 市场份额大。被普遍认为是 ETL 领域的巨头，支持数据迁移/集成的各个方面，例如广泛的连接器、安全性、元数据管理、灾难恢复、可管理性、标准合规性以及在线技术支持。


    **缺点：** 与许多高级工具一样，`Informatica` 功能过多，而我们的时间又太少。如前所述，该产品对某些组织来说可能过于复杂。我曾与一些开发人员交流过，他们承认在较小数据集上使用
    `Informatica` 就像“用锤子打蝴蝶”。如果你的组织对数据集成方法非常认真，那么我会建议你让团队全力以赴并做好研究。否则，可以考虑我之前提到的那些不那么重量级的工具。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig11_HTML.jpg](img/486629_1_En_5_Fig11_HTML.jpg)


    图 5-11


    Informatica 映射（图片取自 [`www.edureka.co/blog/informatica-etl/`](http://www.edureka.co/blog/informatica-etl/)）

    '
- fmt: "### Scripting Languages\n\n**Web site:** Various\n\n**Review:** The last ETL\
    \ tool on our list is not a third-party vendor product and further illustrates\
    \ the point that ETL can come in all shapes and sizes. I've worked in startups\
    \ and software firms who are technical enough that they do not need the typical\
    \ drag-and-drop functionality offered by an `SSIS` or `Informatica`-like application,\
    \ instead choosing to \"roll their own\" ETL through a programming language or\
    \ pre-built libraries stored in `Python` and `Perl` (see Figure [5-12](#486629_1_En_5_Chapter.xhtml#Fig12)).^([^(98)](#fn98))\
    \ I think this is a legitimate approach: it removes the dependency on applications\
    \ that can often bog down a project with the learning curve and financial costs.\
    \ On the other hand, this type of implementation does require your teams to possess\
    \ the breadth and knowledge to oversee maintenance and be able to swoop in quickly\
    \ should any errors arise.\n\nSeveral debates are available as to whether scripts\
    \ are superior to vendor products (compare [*https://tombreur.wordpress.com/2017/02/19/etl-is-dying/*](https://tombreur.wordpress.com/2017/02/19/etl-is-dying/)^([^(99)](#fn99))\
    \ with [*https://www.linkedin.com/pulse/etl-its-dead-yet-jarrett-goldfedder*](http://www.linkedin.com/pulse/etl-its-dead-yet-jarrett-goldfedder)^([^(100)](#fn100))).\
    \ Stick with whatever makes you feel comfortable.\n\n**Pros:** For those with\
    \ the bandwidth, scripting is a fair way to start the migration/integration of\
    \ your records. Just be sure to document often and provide useful code comments\
    \ for those who will maintain the system in the future.\n\n**Cons:** Not a good\
    \ strategy for the nontechnical teams that may need to manage and modify these\
    \ integrations. If you do decide to go this route by outsourcing the work or building\
    \ on your own, then make the front-end interface as user-friendly as possible.\
    \ By doing this, you'll go a long way toward reducing the hand-holding that invariably\
    \ will result from time to time.\n\n![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig12_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig12_HTML.jpg)\n\
    \n**Figure 5-12** Bonobo Sample ([`www.bonobo-project.org/`](http://www.bonobo-project.org/))\n\
    \n## Summary\n\nIn this chapter, we've covered the primary phases of the ETL process\
    \ that will help you evaluate the right tool and then reviewed several of the\
    \ applications to get you started. As I've noted, this is not a complete list,\
    \ nor does it approach selection from a non-biased point of view. Yes, I have\
    \ my preferences, and I'm willing to share them with whoever will listen. After\
    \ devoting enough time and effort to the build process, I have learned what I\
    \ need to complete a migration assignment as well as the red flags that warn me\
    \ to stay away. The problem that results from this thinking, however, is that\
    \ too much reliance on one product can close you from considering other tools\
    \ that might provide substantial value. Due to some preconceived notions, we take\
    \ the \"safe\" route—choosing the tool that may not be optimal, but that has always\
    \ worked in the past—and risk losing out over the long run.\n\nTo avoid paralysis-by-analysis\
    \ pitfalls in choosing your ETL tool, keep in mind that there are a lot of quality\
    \ tools out there just as there are some not-so-good ones. I recommend you strongly\
    \ consider your project requirements, think about the \"perfect\" tool you would\
    \ need to get the job done, and then research the products that match as closely\
    \ as possible to that level of perfection. Most likely, you won't find your Holy\
    \ Grail. But, as the Grail Knight from the *Indiana Jones* movie cautioned, you\
    \ will at least be in a better position to \"choose wisely.\"\n\nFootnotes [1](#486629_1_En_5_Chapter.xhtml#Fn1_source)\
    \ [2](#486629_1_En_5_Chapter.xhtml#Fn2_source) [3](#486629_1_En_5_Chapter.xhtml#Fn3_source)\
    \ [4](#486629_1_En_5_Chapter.xhtml#Fn4_source) [5](#486629_1_En_5_Chapter.xhtml#Fn5_source)\
    \ [6](#486629_1_En_5_Chapter.xhtml#Fn6_source) [7](#486629_1_En_5_Chapter.xhtml#Fn7_source)\
    \ [8](#486629_1_En_5_Chapter.xhtml#Fn8_source) [9](#486629_1_En_5_Chapter.xhtml#Fn9_source)\
    \ [10](#486629_1_En_5_Chapter.xhtml#Fn10_source) [11](#486629_1_En_5_Chapter.xhtml#Fn11_source)\
    \ [12](#486629_1_En_5_Chapter.xhtml#Fn12_source) [13](#486629_1_En_5_Chapter.xhtml#Fn13_source)\
    \ [14](#486629_1_En_5_Chapter.xhtml#Fn14_source) [15](#486629_1_En_5_Chapter.xhtml#Fn15_source)\
    \ [16](#486629_1_En_5_Chapter.xhtml#Fn16_source) [17](#486629_1_En_5_Chapter.xhtml#Fn17_source)\
    \ [18](#486629_1_En_5_Chapter.xhtml#Fn18_source)\n\n# 6. A Sample ETL Project\n\
    \n> *There is no better insurance than the knowledge of how to do something the\
    \ right way. There is no greater peace of mind than knowing you did it the right\
    \ way.*\n> \n> —Jerry G. West^([^(101)](#fn101))\n\n## Introduction\n\nAt this\
    \ point, your team is in place, you have your documentation ready for writing,\
    \ and you've picked out an ETL tool. We still have a few nitty-gritty details\
    \ to hammer out, but before we dive deeper, I'd like to take this chapter to build\
    \ a prototype. Because this is not a book on building a team and not a specific\
    \ ETL solution, we'll walk through the steps one at a time, focusing more on the\
    \ process rather than the technology.\n\nFor this design, we'll introduce you\
    \ to the overall process using the community edition of Pentaho Data Integration\
    \ (PDI), an on-premise application that you can download for free from Hitachi\
    \ Vantara's web site. Of course, you can use whatever tool you would like, but\
    \ keeping things comprehensive yet straightforward is the goal.\n\n## Project\
    \ Management Phases Revisited\n\nTo start, let's review the project management\
    \ phases that we covered in Chapter [4](#486629_1_En_4_Chapter.xhtml):\n\n* Initiation\n\
    * Definition\n* Design\n* Development and implementation\n* Maintenance\n\n###\
    \ Initiation\n\nThe initiation phase is the birth of the idea—a project we want\
    \ where we first vet our problem statement and consider its feasibility. It's\
    \ where we build the proposal for a solution, choose our budget, and establish\
    \ our teams.\n\nImagine that we work for the IT department of InfoMotors, a car\
    \ dealership that tracks customer purchases in a text editor. These files are\
    \ stored customer data (name, email), the car they bought (make, model, color,\
    \ year), the price they paid, and the date purchased. Because InfoMotors is a\
    \ new dealer, they do all their bookkeeping and reporting in `Excel`.\n\nBut things\
    \ are changing, and in order to improve their efficiency and minimize data issues,\
    \ management would like to migrate their text files into a new on-premise database.\
    \ They are evaluating different teams that can handle the work and would want\
    \ to determine a pricing structure and timeline. You are, of course, included\
    \ in this discussion to ensure the assumptions are accurate and the plan is realistic.\n\
    \nDoes this sound like something we can do? If so, then let's get started."
