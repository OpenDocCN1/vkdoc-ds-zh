    \ [7-8](#486629_1_En_7_Chapter.xhtml#Fig8)).\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig8_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig8_HTML.jpg)\n\
    \nFigure 7-8\n\nData Migration Process Flow Diagram (Updated)\n\n1.  Create/Truncate\
    \ BUYER Table: Using the ETL tool, create the BUYER table if it does not already\
    \ exist. If it does exist, then truncate all data to provide the next load.\n\n\
    2.  Extract CSV: Using the ETL tool CSV connector, retrieve all comma-delimited\
    \ data.\n\n3.  Extract TSV: Using the ETL tool text connector, retrieve all tab-delimited\
    \ data.\n\n4.  Extract Excel: Using the ETL tool text connector, retrieve all\
    \ Excel spreadsheet data.\n\n5.  Transform Values: Using the STTM as a reference,\
    \ change the transformation values identified.\n\n6.  Insert Data into BUYER Table:\
    \ Using the ETL tool SQLite connector, insert all records into the BUYER table.\n\
    \n7.  Decision: Were there any errors during load?\n    1.  If yes, then roll\
    \ back the data and send a report.\n\n    2.  If no, then end the event.\n\nYou\
    \ hand these modified documents to your development team and ask them to build\
    \ you the latest and greatest version of the ETL. Just for kicks, and to keep\
    \ with the theme of this chapter, you’ll want them to automate the process so\
    \ the data can extraction, transformation, and loading with a single mouse click."
  trans: "\n# 准备自动化\n\n在第 6 章中，我们克隆了一个 Git 文件夹，以便运行一个示例集成。如果尚未完成，请参考该章节并重复安装步骤。\n\n\
    初始场景如下：\n\n- 我们供职于 InfoMotors 的 IT 部门，这是一家汽车经销商，他们使用文本编辑器跟踪客户购买记录。这些文件存储了客户数据（`name`、email）、客户购买的汽车（`make`、`model`、`color`、`year`）、客户支付的价格以及购车日期。由于\
    \ InfoMotors 是一家新经销商，他们所有的记账和报告工作都在 Excel 中完成。\n\n- 但情况正在发生变化。为了提高效率并最大限度地减少数据问题，管理层希望将他们的文本文件迁移到新的本地数据库中。\n\
    \n在评估需求并构建出源到目标映射之后，我们设计了数据迁移流程流程图并撰写了摘要（见图 7-6）：\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig6_HTML.jpg](img/486629_1_En_7_Fig6_HTML.jpg)\n\
    \n**图 7-6** — 数据迁移流程流程图\n\n1. **创建/截断 BUYER 表**：使用 ETL 工具，如果 `BUYER` 表不存在则创建它。如果存在，则截断所有数据以备下次加载。\n\
    \n2. **提取 CSV**：使用 ETL 工具的 CSV 连接器，检索所有逗号分隔的数据。\n\n3. **提取 TSV**：使用 ETL 工具的文本连接器，检索所有制表符分隔的数据。\n\
    \n4. **转换值**：以 `STTM` 为参考，更改已标识的转换值。\n\n5. **合并文件**：将新的（转换后的）暂存文件合并为一个为目标格式准备好的文件。\n\
    \n6. **将数据插入 BUYER 表**：使用 ETL 工具的 SQLite 连接器，将所有值插入 `BUYER` 表。\n\n7. **决策**：加载过程中是否有任何错误？\n\
    \    1. 如果有，则回滚数据并发送一份报告。\n    2. 如果没有，则将 `BUYER` 表的输出写入一个 `.csv` 文件。\n\n我们将这些需求交给了开发人员，他们返回了完成的原型文件。\n\
    \n就在交付日期临近的一个晚上，我们接到了项目经理的电话，他告诉我们管理层最近又发现了四个源文件。其中，2014 年和 2015 年的文件是 Excel 格式，其余的文件使用\
    \ CSV 分隔符。他们想知道我们是否也能将这些数据纳入新数据库。我们现在的工作是回过头来将这些文件加到原型中，进行测试，然后确保 QA 团队对我们的结果感到满意。\n\
    \n好消息是，管理层已同意取消每两周迁移一次数据的要求。就目前而言，我们可以回到最初的结论：这次迁移将是一次性的。\n\n他们还问，我们是否可以不合并数据，而是直接将数据原样加载到新数据库中。他们会根据需要执行去重和清理工作。\n\
    \n根据这些新信息，我们重新审视流程并重启启动阶段。你逐个部分地与你的集成团队沟通新需求。“能做到吗？”你问道。“需要多长时间？”\n\n主开发人员说：“这会是项艰巨的工作。但我们会尽最大努力在下一个冲刺结束前完成。”\n\
    \n> **注意**  \n> 我猜想所需时间可能会少于两个冲刺，但你的主开发人员不会这么告诉你，因为他想通过压低承诺、超额交付来展现团队的高超能力。集成团队最棒了。\n\
    \n你已经准备好了后续步骤。你重新打开之前已获批的文档，并标记出新的需求。例如，你将数据迁移计划中的早期方案修改如下。\n\n## 拟定的迁移与集成方案\n\
    \n我们将使用 ETL 工具从六个文件（三个逗号分隔文件、一个制表符分隔文件和两个 Excel 文件）中提取数据，对内部数据执行转换以匹配目标结构，并将数据提取到目标数据库。今后所有的数据录入都将在目标系统上完成。\n\
    \n你还可以修改未来状态图，以表示多个 CSV 和 XLS 文件，而不仅仅是首次迭代中的 CSV 和 TSV（见图 7-7）：\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig7_HTML.jpg](img/486629_1_En_7_Fig7_HTML.jpg)\n\
    \n**图 7-7** — 修改后的未来状态\n\n所有这些设计都是为了向更广泛的受众传达策略，并向任何审阅文档的人确认假设是正确的。\n\n你将基本以相同的方式重新进入发现、设计和构建阶段。你将重新对新的数据集进行分析，使用更新的源到目标字段和转换规则来修改你的\
    \ `STTM`，并将最新步骤纳入你的数据迁移计划。这些操作就像在你的流程图中添加和删除相应的方框，然后调整你的摘要以匹配它一样简单（见图 7-8）：\n\n\
    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig8_HTML.jpg](img/486629_1_En_7_Fig8_HTML.jpg)\n\
    \n**图 7-8** — 数据迁移流程流程图（已更新）\n\n1. **创建/截断 BUYER 表**：使用 ETL 工具，如果 `BUYER` 表不存在则创建它。如果存在，则截断所有数据以备下次加载。\n\
    \n2. **提取 CSV**：使用 ETL 工具的 CSV 连接器，检索所有逗号分隔的数据。\n\n3. **提取 TSV**：使用 ETL 工具的文本连接器，检索所有制表符分隔的数据。\n\
    \n4. **提取 Excel**：使用 ETL 工具的文本连接器，检索所有 Excel 电子表格数据。\n\n5. **转换值**：以 `STTM` 为参考，更改已标识的转换值。\n\
    \n6. **将数据插入 BUYER 表**：使用 ETL 工具的 SQLite 连接器，将所有记录插入 `BUYER` 表。\n\n7. **决策**：加载过程中是否有任何错误？\n\
    \    1. 如果有，则回滚数据并发送一份报告。\n    2. 如果没有，则结束此事件。\n\n你将这些修改后的文档交给你的开发团队，要求他们为你构建最新、最强大的\
    \ ETL 版本。纯粹为了好玩，并保持本章的主题，你希望他们能将这个过程自动化，以便只需单击一下鼠标就可以完成数据的提取、转换和加载。\n"
- fmt: '#### Demonstration


    The `chapter7` folder contains the latest version of your data system, replicated
    in folders designed to be the development, staging, and production environments.
    After cloning the GitHub directory and installing Pentaho as written in Chapter
    [6](#486629_1_En_6_Chapter.xhtml), do the following:


    *   Depending on your OS, open the `spoon.bat` file (Windows), `spoon.sh` file
    (Linux), or Data Integration app shortcut (macOS).


    *   Click the `File/Open` menu (`CTRL+O` on Windows) and navigate to the `chapter7\development\scripts`
    directory that you downloaded from GitHub. Double-click the file `job_infomotors2.kjb`.
    The script will open (see Figure [7-9](#486629_1_En_7_Chapter.xhtml#Fig9)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig9_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig9_HTML.jpg)


    Figure 7-9


    The `job_infomotors2.kjb` Script


    What you are seeing is, in Pentaho parlance, known as a “job.” It is like an orchestration
    engine in that it coordinates the execution and dependencies of your ETL tasks
    and activities.^([^(112)](#fn112))


    This job is the automation script we’ve been talking about and contains calls
    to the other ETL functions we identified in our Data Migration Process Flow. The
    window shows these tasks lined up by sequence:


    *   create target table buyer


    *   ETL source csv


    *   ETL source tsv


    *   ETL source xls


    *   select target table buyer


    You’ll notice there’s also a task at the bottom of the page connected via the
    ETL tasks. This step is the failure “hop” that will trigger if any of the ETL
    processes fail, performing a rollback and alert on the type and nature of the
    error.


    *   If you right-click any of these steps and click “Open Referenced Object ➤
    Transformation,” you’ll open the embedded script associated with that step. As
    we did in Chapter [6](#486629_1_En_6_Chapter.xhtml), let’s do that with “create
    target table buyer” (see Figure [7-10](#486629_1_En_7_Chapter.xhtml#Fig10)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig10_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig10_HTML.jpg)


    Figure 7-10


    Right-Click create target table buyer


    **Note**: As we discussed during our earlier demonstration, you can also open
    the scripts by clicking `File/Open` and selecting the appropriate name from the
    `chapter6/scripts` directory. The way I have designated by right-clicking takes
    fewer steps, but you can choose your specific preference.


    You will see that this step is written similarly to the earlier iteration we worked
    with, except we’ve modified the SQL so that the table instantiates if it does
    not already exist. In other words, the first time you run this application, the
    development database schema (`infomotors_dev.db`) is created along with the `BUYER`
    table (see Figure [7-11](#486629_1_En_7_Chapter.xhtml#Fig11)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig11_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig11_HTML.jpg)


    Figure 7-11


    Updated Version of `CREATE TABLE BUYER`


    *   Because this script will run when we execute the job, you don’t need to do
    anything. Click Cancel in this window and the `job_infomotors` tab at the top
    left of the window.


    *   Now, right-click the “ETL source csv” step, and select “Open Referenced Object”
    ➤ ”Transformation.” What you see is the model that extracts the (multiple) CSV
    files, transforms the data, and then loads into the `BUYER` table.


    You will note that this file is different from the “prototype” script in that
    we’ve separated the tab-delimited step along with the new Excel step and put them
    into their separate processes. We could have incorporated them into one file,
    but it made sense from an architecting standpoint to separate them by keeping
    the functions modular and devoted to one specific duty.


    *   There are a few other patterns in the connector that we should review.


    *   To start, double-click the “Extract Multiple CSVs” to open it (see Figure
    [7-12](#486629_1_En_7_Chapter.xhtml#Fig12)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig12_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig12_HTML.jpg)


    Figure 7-12


    Extract Multiple CSVs


    You will notice that where it says Selected Files, we have a directory path marked
    like this:


    ```

    ${Internal.Entry.Current.Directory}/../input

    ```


    The value in between the `${…}` is a PDI internal variable. It tells us that the
    variable under scrutiny is the one where we have saved the script. On my machine,
    we have saved our job to directory `C:\Users\<<insert your username here>>\Documents\BAIT\chapter7\development\scripts`.
    Yours should be similar. The `/../` after the variable represents one level up,
    and the file input is the last directory value. Thus, I am performing a lookup
    against path `C:\Users\Jarrett\Documents\BAIT\chapter7\development\input`, which
    contains InfoMotors’ sample records.


    The next column is the Wildcard (RegEx), which indicates the filter of files to
    lookup, which, for this task, is `.*.csv`. That is, any file marked with suffix
    `.csv` and stored in the `development\input` directory will be read into the system.


    What makes this structure particularly useful is that ANY file with a `.csv` prefix
    that we store in the `\input` directory will be read and automatically appended.
    Of course, the formats will need to match the input we’re expecting to use (`id`,
    `first_name`, `last_name`, and so on), and some quick data profiling will help
    us determine if this is indeed the case.


    Because we’re using a variable for our input path rather than hardcoding it, we
    no longer have to know *where* we’re storing our script. We just have to ensure
    that we have a one level up (`/../`) and an additional input path. This syntax
    is why we can quickly put this same script in a completely separate environment,
    and it will work as is, blind to the fact that its directory structure is different.
    For example, if you open the same “ETL source csv” file in our staging directory,
    you’ll see we have the same file in use, except this time, our staging script
    is reading from the *staging* folder rather than from the *development* folder.
    This generic code is, to me, the secret sauce of deployment. No matter where we
    store this script, all we have to do is ensure the latter half of the directory
    follows a pattern, and we are good to go.


    **Note**: The names of the SQLite data sources were adjusted for demonstration
    purposes to map to `infomotors_dev.db`, `infomotors_staging.db`, and `infomotors_prod.db`.
    This adjustment is because we are running the ETL scripts on the same machine
    and do not want to overwrite data that should be segregated. In a typical infrastructure,
    you would most likely be using the same database schema, tables, and fields, and
    this connector could remain hardcoded or, if you prefer, also as a variable.


    I’ll leave it to you to review the ETL source `.tsv` and the ETL source `.xls`
    scripts located on the `job_infomotors` job. You’ll see they follow the same format,
    but with the Wildcard values adjusted to match their filters of `.*.tsv` and `.*.xls`.
    As with the CSV files, we can add any number of suffixed files to the `/input`
    folder of that environment, and each one will be included in our job run.'
