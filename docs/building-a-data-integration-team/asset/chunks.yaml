  trans: "\n### 部署步骤\n\n深入探讨操作顺序，部署步骤部分定义了迁移或集成的每项任务，通常附带与 ETL 流程相关的图表。该模式应易于遵循，并实质上成为部署周期的检查清单：\n\
    \n1. 从表 XXX 中选择数据：\n\n   ```\n   根据定义的业务需求转换数据\n   测试样本\n   将数据插入到表 YYY 中\n  \
    \ ```\n\n   然后，这些任务中的每一个都会被进一步分解为单句摘要步骤。\n\n2. 从表 XXX 中选择数据：\n   1. 使用 Pentaho\
    \ 数据集成（PDI）应用程序，通过位于此处的 SQL Server 连接对表 XXX 运行 SQL 语句。\n\n3. 根据定义的业务需求转换数据：\n\
    \   1. 使用 Python 脚本，将 Salesforce 联系人数据转换为提供的业务规则。\n\n4. 测试样本：\n   1. 将十个样本联系记录插入预生产环境，确保成功接收五到十个样本记录。\n\
    \   2. 对数据执行 QA 评估。如果记录失败或不符合业务需求，则进行迭代并重新加载。\n   3. 将数据插入到表 YYY 中。\n   4. 测试记录通过后，从利益相关者处获得“通过/不通过”许可。\n\
    \n5. 使用 Talend ETL 应用程序执行整个数据集的加载：\n   1. 加载完成后，通过执行后续分析确认联系人记录的加载是否成功。\n   2.\
    \ 如果加载失败，回滚事务并向利益相关者报告错误。\n\n6. 重新迭代并从步骤 1 开始。\n\n数据迁移流程文档这一部分的妙处在于，你正在为大多数可能发生的情况提前做准备。当然，你可能会遗漏一两件事，但知道这是一份可以随时修改和追加的可调整文档，会让你的生活轻松很多。如果在开发或沙盒环境中进行几次预演迁移，你就能捕捉到实际部署过程中会发生的大部分情况。这样，你就能有书面上的信心，确保自己早已清楚地知道想要做什么、如何去做，以及基于成功或失败将会出现的状况。没有人能够回头对你说他们感到意外。所以这可能需要一些前置工作，但我认为这种程度的准备和沟通是非常值得的。\n\
    \n### 日志文件交付\n\n本节描述成功日志和错误日志的存储位置。此存储位置可以在线存储，也可以作为共享文件通过电子邮件发送，但应可供有需要并有兴趣查看结果的人员使用。\n\
    \n### 迁移结果\n\n迁移结果部分描述了迁移结果报告（我们稍后将讨论）所接收的输出。实际上，在项目结束前，我通常会将该部分留空，将其用作证明数据已按预期交付的“礼品包装”。这也向团队发出信号：随着所有记录成功交付，最终签字即将到来。\n\
    \n### 最终签字\n\n并非强制要求，但我喜欢在数据迁移流程文档中包含此部分，因为它为迁移画上了句号。顾名思义，签字可以是项目发起人签署的电子邮件或附件，证明迁移已完成并满足要求。你读到最后一句话时可能会难以置信地摇头，但我向你保证，有了我们准备好的流程文档，你最终将能满足项目要求。并且在执行过程中保持条理清晰、准备充分。\n\
    \n## ETL 脚本\n\nETL 脚本是开发阶段的一部分，由于它们技术性很强，可能不是整体交付的关键部分。尽管如此，保留一份代码副本总是好的，以防备份崩溃或你的本地平台遭遇其他不幸。\n\
    \n你必须考虑多种可能性，来决定如何记录和交付你的功能。开发团队应频繁进行同行评审，在这些评审会议中，手头有一些棘手的脚本逻辑有助于让每个人都达成共识。此外，与更初级的\
    \ ETL 开发人员分享你的方法也会很有益，因为他们会将你的思路与自己的项目进行对照。\n\n捕获这些信息可能只是对数据进行的简单复制粘贴，但大多数流行的\
    \ ETL 工具既使用图形界面也使用文本。在这种情况下，截图工具可能就能解决问题（我最喜欢的包括微软的截图工具、[TechSmith 的 Snagit](https://www.techsmith.com/screen-capture.html)\
    \ 或 NGWIN 的 PicPick [PicPick](https://picpick.app/en/)）。在某些情况下，你可能能够通过配置文件提取 GUI\
    \ 代码片段，但如何做最有效，我留给读者自行决定。需要牢记的最重要的一点是，代码就像任何其他可迭代的软件产品一样，永远在变化，你所记录的任何内容最终都需要更新。\n\
    \n## 迁移结果报告\n\n这份可交付物在集成期间填充，突出显示了每个对象的集成成功和错误计数。你需要跟踪你的加载统计信息，无论是通过手写笔记、自动发送的电子邮件，还是其他类型的交付方式，跟踪每个已部署记录的\
    \ `SELECTS`、`INSERTS`、`UPDATES`、WSDL 响应等数量。详细程度取决于你——简单的计数与详细的描述性信息——但保持跟踪至关重要，主要是为了你和你的利益相关者的“理智”，因为总有人会在某个时刻无法找到在源端到目标端传输过程中丢失的记录。如果所述的记录属于错误日志的一部分，你还应包括记录计数和原因。\n\
    \n尽可能地在单个作业运行中包含作业的开始日期和时间以及结束日期和时间。通过这种方式，你将能够跟踪未来更新的“增量”，这不仅有助于分配你后续迁移测试所需的时间，还能让你知道何时出现了异常：一个通常需要\
    \ 5 分钟执行的作业，如果某个周期花费了超过 30 分钟，则说明其在运行过程中遇到了问题。诸如 `Wireshark` 之类的网络分析工具或 `Charles`\
    \ 之类的流量监控器将是开始分析的最佳选择。\n"
- fmt: "#### Go-Live / Deployment Plan\n\nThe `Go-Live / Deployment Plan` occurs as\
    \ the last step of the integration phase in which the integration team, now ready\
    \ to proceed with an organized deployment, submits the step-by-step, start-to-finish\
    \ plan to perform the migration, *including dependencies.* Creating this document\
    \ should be relatively simple if you have followed the previous steps in this\
    \ chapter—the `Data Migration Process Flow Design` document already contains sections\
    \ marked “Order of Operations” and “Deployment” that serve this purpose. Of course,\
    \ in that document, only the integration itself is described. In the `Go-Live\
    \ / Deployment Plan`, the entire process from start to finish should be documented\
    \ and not just those related to the migration portion (hence the emphasis above\
    \ of “including dependencies”).\n\nThe `Go-Live / Deployment Plan` is more of\
    \ a communication tool than may be apparent at the outset. For the internal team,\
    \ this deliverable requires an agreed-upon strategy of deployment order among\
    \ each team member and, if properly aligned, will result in a smooth delivery\
    \ process in which team members confidently will communicate each step to the\
    \ others and subsequently provide signoff once complete or, if any unexpected\
    \ issues occur, will enable them to revise or roll back.\n\nFor external teams,\
    \ the `Go-Live / Deployment Plan` serves as a checklist of steps that the deployment\
    \ team must take before they can call it a day. This activity allows stakeholders\
    \ and business owners to know precisely what needs to take place, how long (on\
    \ an estimated timeframe) Production will be shut down, and which team is responsible\
    \ for the activity at hand. This resulting awareness has a much more calming effect\
    \ than less organized deployments where the integration feature is assumed to\
    \ be the “simple activity of button-pushing.”\n\n## Post-deployment: Maintenance\
    \ and Updates\n\nOnce the migration project is deployed to a Production environment,\
    \ the obvious next step is to store the complete set of deliverables in an easy-to-find\
    \ location, such as a shared corporate drive or content management system. While\
    \ you may think that these documents can be filed away never to see the light\
    \ of day, think again. Unless this is a one-time migration, your process will\
    \ continue to grow and adapt along with the business needs, and you’ll need to\
    \ reference them, sometimes without warning. Three potential scenarios that come\
    \ to mind are the following:\n\n1.  Data exceptions are the norm, and, at some\
    \ point, the system will report an error, and someone at the target side is going\
    \ to be highly agitated, highly confused, or both. You’ll need first to figure\
    \ out which field is failing and the details behind that transformation. The `Source-to-Target\
    \ mapping` is the best starting point to begin your analysis, followed by the\
    \ `Migration Process Flow Design` and `ETL` scripts.\n\n2.  Stakeholders may want\
    \ to upgrade the existing integration process to include more fields or streamline\
    \ the current code. Having these documents at hand will be a necessity when recalibrating\
    \ your requirements.\n\n3.  You will want to audit any changes to systems that\
    \ may seem unrelated to your process, but have an upstream impact, such as changed\
    \ data in the source platform. Any time you hear of system enhancements that tangentially\
    \ touch your inbound records, you’ll want to go back to your documents and verify\
    \ the impact. It’s much easier to sound the alarm before the daily integration\
    \ happens than to arrive on a Monday morning and find that your source table now\
    \ holds string values instead of numbers and, consequently, your target table\
    \ does too.\n\nWith this understanding, teams should recognize that these documents\
    \ represent a snapshot of our integration process’ current state and any changes\
    \ performed on the source, `ETL`, or target platform due to bug fixes, patches,\
    \ upgrades, or other modifications should be added to the appropriate documents.\
    \ It’s essential to maintain this upkeep—out-of-date information is sometimes\
    \ worse than no information at all. And yet, like many of the other guidelines\
    \ associated with project management, post-deployment teams ignore this critical\
    \ step. Why? It’s not always clear, but I can surmise two reasons:\n\n1.  **Lack\
    \ of Ownership:** The staff who perform the O&M duties of a system post-deployment\
    \ are often different than those who developed the product. Being in an O&M mode\
    \ usually requires quick turnaround and resolution compared to a product team\
    \ that assumes documentation as part of their responsibility. In other words,\
    \ for the O&M team, rewriting these documents is just not a priority.\n\n2.  **Lack\
    \ of Understanding:** The people who modify these deliverables may not understand\
    \ the new requirements, may not know how to write them verbally, or—most likely—may\
    \ have forgotten to update them at the appropriate time.\n\nThe integration team\
    \ must address these risks at the outset, clearly acknowledging that documents\
    \ must be updated consistently throughout the project lifetime and that it is\
    \ the direct responsibility of the owners of the process (e.g., O&M) to store\
    \ the latest versions the moment these changes deploy.\n\n## Summary\n\nWe’ve\
    \ covered most of the integration phases in this chapter, starting from the project\
    \ initiation and extending to go-live and beyond. At this point, you should recognize\
    \ that documentation is not a “should” but a “must.” It may seem counterintuitive,\
    \ but the more effort to solidify the base requirements and mappings during the\
    \ initial stages, the more flexibility the team has in shifting last-minute requests\
    \ later down the line. This flexibility occurs because each document is closely\
    \ related to the one preceding it. Modifying a set of requirements creates a ripple\
    \ that starts at the initiation phase and flows through the definition, design,\
    \ development, and implementation. Because of these dependencies, we have the\
    \ remarkable ability to trace each line of our transformation code back to our\
    \ business requirements. If these requirements should fall out of alignment at\
    \ the eleventh hour, then modifying the `ETL` code to sync back up with them is\
    \ a relatively straightforward fix from the root document.\n\nIn the next chapter,\
    \ we’ll examine the fundamentals of that `ETL` code, describe the steps needed\
    \ to build a simple service, and discuss the pros and cons of several popular\
    \ `ETL` software applications.\n\nFootnotes [1](#486629_1_En_4_Chapter.xhtml#Fn1_source)\
    \  [2](#486629_1_En_4_Chapter.xhtml#Fn2_source)  [3](#486629_1_En_4_Chapter.xhtml#Fn3_source)\
    \  [4](#486629_1_En_4_Chapter.xhtml#Fn4_source)  [5](#486629_1_En_4_Chapter.xhtml#Fn5_source)\
