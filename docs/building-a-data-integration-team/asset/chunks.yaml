    \ the structure, content, and interrelationships. During your profiling phase,\
    \ pay special attention to specific patterns that account for most of the standard\
    \ data integrity issues:\n    *   Different spellings of names/nicknames identified\
    \ alongside email (Beth versus Elizabeth versus Liz, all with the same email address)\n\
    \n*   Different organization spellings (IBM, I.B.M., IBM Corp.)\n\n*   NULL values\
    \ in the source that require population in the target\n\n*   Alphanumeric characters\
    \ mixed with data that should be numbers only\n\n*   Misspellings or inconsistencies\
    \ to manually entered values such as addresses or products\n\n2.  Analyze and\
    \ update post-transformation.\n\nIf, for whatever reason, you cannot correct (or\
    \ identify) the data at the source, investigate and provide exception logic to\
    \ your transformed data. This approach will require you to store the processed\
    \ data in yet another temporary storage platform, but it will allow you to perform\
    \ a makeshift profiling analysis that will show many more data integrity errors\
    \ than could be found simply by eyeballing your load extract.\n\nAlthough you\
    \ can do it, be wary when attempting to modify badly aligned data outside of the\
    \ source system. While it may seem more straightforward to modify that over which\
    \ you have control, the most significant deficiency with updating in your ETL\
    \ or staging platform is that you are creating narrow rules that must be maintained.\
    \ That is, an update to one system necessitates an update to another, creating\
    \ a dependency you may not want.\n\nFor example, imagine that you hardcode transformation\
    \ logic that converts all variations of “IBM,” “I.B.M.,” “International Business\
    \ Machines,” and so on into a single value: “IBM Corporation.” This is relatively\
    \ easy to do under your team’s control and it saves time upfront as you do not\
    \ have to change data in the source system. Five months later, the team from the\
    \ source system makes the seemingly innocuous decision to update the target value\
    \ of “IBM Corporation” into “IBM Corp.” If (and this is a big “if”) they decide\
    \ to tell your team, are you ready to scour your ETL code and find where you placed\
    \ that hardcoded logic? Are you then prepared to test and maintain every production\
    \ change that requires similar exception logic changes? Forever and ever? Although\
    \ it sounds like an exaggeration, you can see how taking data integrity ownership\
    \ outside of the source system can lead to some significant roadmap upheavals.\
    \ I would recommend avoiding as many of these update scenarios as possible, unless\
    \ it really is more advantageous in the here and now, such as with the one-off\
    \ migration.\n\nThis brings us to the third option, which is more of a default.\n\
    \n3.  Do nothing.\n\nIf requesting a source update does not work, and you think\
    \ building exception logic is a bad idea, then let the data make its way into\
    \ the target as is. Yes, it will lack data integrity, but it will be *there*.\
    \ As long as you can trace it to the root cause (i.e., a particular source field),\
    \ remediation can shift to the target system cleanup crew. What’s most important\
    \ is that you avoid any unnecessary surprises. Warn teams ahead of time what you\
    \ face and give them the pros and cons of all options involved, even the default\
    \ of doing nothing. Identify the decision in the Notes column of the STTM spreadsheet\
    \ and provide a status report that can go up the chain in case last-minute decisions\
    \ are made."
  trans: "\n### 验证入站数据\n\n在整个提取过程中，你需要确保拉取了正确的字段，并确认源数据与存储数据之间完全匹配。这种验证在 ETL 全流程中都可以且应该进行，但在第一阶段尤为关键，因为此阶段的数据丢失将无法在后续环节追踪。你可能需要考虑的验证技术包括：确保字符串和数字等数据类型的一致性，删除重复或碎片化数据，并包含每个对象的主键。请记住，最终的数据输出质量完全取决于初始数据输入的质量。如果在提取过程中移动了无效数据，那么后续步骤中的补救将是一项巨大的挑战。\n\
    \n## 转换\n\n除非你的数据源与目标系统存在直接的 1:1 映射关系，否则你必须对暂存数据进行处理，使其匹配目标系统预期的格式。这一步骤正是你所选 ETL\
    \ 工具实际效能的体现。在制定转换策略时，需要考虑以下几个因素，例如数据修改和结果验证。\n\n### 修改数据\n\n转换越复杂，ETL 工具所需的内置功能就越多。无需处理的数据被称为*直接移动*或*直通*数据^(⁹¹)，我们通常会在源到目标映射的\"\
    转换规则\"部分（参见第 4 章）中如此标注。\n\n最基本的转换涉及对提取的数据应用一系列函数。这些函数如何编码和触发，可能是决定团队选择最佳工具的关键步骤。有些\
    \ ETL 产品使用`Java`进行转换（如`Talend`），另一些则可能继承自微软脚本（`SSIS`）、`JavaScript`（如`Pentaho`），或者支持多种编程语言（如`Dell\
    \ Boomi`）。当开发和支持人员需要从头学习一门全新的语言时，这很少能帮助团队快速上手。将正确的转换语法与团队的技能组合相匹配，将对初期生产力产生巨大影响。\n\
    \n### 分析数据完整性\n\n我之前提到过，源系统提供的数据将存储在临时区域中。在转换阶段，会应用程序化规则，从而产生修改后的值。为了判断转换的完整性，我们需要提出三个问题：\n\
    \n1.  我的数据准确吗？例如，转换后的值能否追溯到源数据？\n2.  我的数据完整吗？例如，目标系统中标记为`NOT NULL`的字段是否填充了有效值？\n\
    3.  我的数据一致吗？例如，我们对类似的值是否应用了相同的规则？^(⁹²)\n\n这三个问题都很重要，任何一个未满足都会在项目推进的某个环节造成障碍。我们可能会在部署时发现它，收到一条令人头痛的`\"\
    Cannot insert NULL into NOT NULL value\"`^(⁹³)错误信息；或者在更晚的时候，当我们的报表系统巧妙地识别出四个独立的账户，分别标注为“International\
    \ Business Machines”、“IBM”、“IBM Corp.”和“I.B.M.”时才发现问题。\n\n当然，我们希望避免并修补在转换过程中发现的任何数据集成错误。考虑到项目可能涉及数百万个数据点，这说起来容易做起来难。我甚至可以说，缺乏数据完整性很可能是初次数据迁移后出现错误的最大原因。我们该如何解决这些潜在错误呢？以下是我尝试过的两点建议：\n\
    \n1.  **在源系统更新。**\n\n    我们在前一章讨论过分析的概念——即审查源数据以理解其结构、内容和相互关系的流程。在分析阶段，要特别关注那些导致大多数标准数据完整性问题的特定模式：\n\
    \    *   与电子邮件关联的姓名/昵称拼写不同（例如，Beth、Elizabeth 和 Liz 使用同一个电子邮件地址）\n    *   机构名称拼写不同（IBM、I.B.M.、IBM\
    \ Corp.）\n    *   源系统中的`NULL`值需要在目标系统中填充\n    *   字母数字字符与应为纯数字的数据混合\n    *   手动输入的值（如地址或产品）存在拼写错误或不一致\n\
    \n2.  **分析并在转换后更新。**\n\n    如果出于某种原因，你无法在源系统更正（或识别）数据，那么就对你的转换后数据进行调查并提供异常处理逻辑。这种方法要求你将处理过的数据存储在另一个临时存储平台中，但它能让你进行一种临时的分析，从而发现更多仅通过粗略查看加载提取数据无法发现的数据完整性错误。\n\
    \n虽然你可以这样做，但要警惕在源系统之外修改不规范的数据。尽管修改你能控制的数据看起来更直接，但在 ETL 或临时平台中进行更新的最大缺陷是，你正在创建需要维护的窄规则。也就是说，对一个系统的更新必然会导致对另一个系统的更新，从而产生你可能不想要的依赖关系。\n\
    \n例如，假设你硬编码了转换逻辑，将所有“IBM”、“I.B.M.”、“International Business Machines”等变体都转换为单个值：“IBM\
    \ Corporation”。在团队控制下，这相对容易实现，并且由于无需更改源系统数据，可以节省前期时间。五个月后，源系统团队做出一个看似无害的决定，将目标值“IBM\
    \ Corporation”更新为“IBM Corp.”。如果他们决定（这是个很大的\"如果\"）通知你的团队，你准备好仔细检查你的 ETL 代码，找到你放置硬编码逻辑的位置了吗？然后，你是否准备好测试并维护每个需要类似异常逻辑变更的生产环境变更？并且要永远持续下去？虽然听起来有些夸张，但你可以看到，将数据完整性的所有权移到源系统之外，可能会导致一些重大的路线图变动。我建议尽可能避免此类更新场景，除非在当前确实更有利，比如一次性迁移。\n\
    \n这就引出了第三个选项，它更像是一种默认选项。\n\n3.  **不做任何操作。**\n\n    如果请求源系统更新行不通，并且你认为构建异常逻辑是个坏主意，那就让数据保持原样进入目标系统。没错，这样会缺乏数据完整性，但它会在*那里*。只要你能追溯到根因（即特定的源字段），补救工作就可以转移给目标系统的清理团队。最重要的是，要避免任何不必要的意外。提前告知团队你所面临的情况，并向他们说明所有选项的利弊，包括默认的不做任何操作。在`STTM`电子表格的\"\
    备注\"列中记录该决策，并提供一份状态报告，以便在最后关头需要做出决策时，该报告能够逐级上报。\n"
- fmt: '### Validating Result Data


    The key to any data transformation is ensuring that the physical change to the
    data will correctly load into the target. The aspect of validating result data
    runs the gamut of all the transformations we have to complete, including filtering
    columns, merging lookup values, converting measurements like time and dates to
    a standard format, and mapping inconsistencies to single units (`"1"` for Male,
    `"2"` for Female, `"3"` for Binary, and so on). The data validation step is more
    about confirming the manipulation of the data, rather than whether it matches
    the source through data integrity. Of course, both data validation and data integrity
    go hand in hand, and it can be tough to reconcile the two concepts. This example
    may help:


    My team was involved with migrating an international email correspondence database.
    Some of the correspondence was written entirely in Greek characters, some in Russian,
    some in German, and some in English. The migration was a relatively simple one
    in which we would take the specific character set and move from the source system
    (a Postgres server) through an ETL platform (Pentaho) into the target (Salesforce).
    One of the first things we discovered was that try as we might, we could only
    get the Russian Cyrillic characters to show up as gibberish. Same for the Greek
    characters. But German and English seemed to work just fine. I should mention
    that we didn’t receive any error messages during the load. In other words, everything
    processed, only not with the distinct international character sets of Greek and
    Russian.


    We discovered during testing that the cause was through the character set we had
    chosen in our target; we were using an ASCII Latin character set when we should
    have chosen a character set that included international symbols such as `UTF-8`
    (a great explanation on the use of `ASCII` versus other encoding sets is available
    at [*https://stackoverflow.com/questions/2241348/what-is-unicode-utf-8-utf-16*](https://stackoverflow.com/questions/2241348/what-is-unicode-utf-8-utf-16)).^([^(94)](#fn94))


    I give this example to illustrate how the data integrity worked as designed—our
    accuracy, completion, and consistency of our transformed data matched in terms
    of content (at least, as far as our literary assessment of Russian and Greek could
    be). What was off was our data validation due to transformation: we processed
    the wrong encoding feature, a function of the ETL tool itself. The resolution
    required us to both look at the data integrity (the data) and the data validation
    result (the transformation itself), make the correct assessment, and move forward
    by adjusting our default character set.


    When you choose your ETL tool, you’ll want to make sure you get a balance on both
    the data integrity and data validation steps. The most critical features you’ll
    test will be the ability to quickly convert your staging data through functions
    via a familiar programming language, to automate searching the errors intrinsic
    in the transformed data, and then to remediate these errors in the smallest number
    of clickable or programmatic steps.


    ## Loading


    Loading is the last phase of the ETL process and generally the one most people
    relate to when we discuss the “push-button” approach to data migration. That is,
    push a button, and data moves from the source to the target with extracts full
    and transformations complete. We know that’s not the default position we should
    take, but we still hold the acknowledgment that someday, at some point, our data
    will be close to that final point where we need to migrate our data, set up our
    nightly feeds, and get signoff. We’re not too far off from this (and we’ll discuss
    more about this button-pushing in Chapter [7](#486629_1_En_7_Chapter.xhtml)),
    and I always promise my team that once we get over this hump, drinks are on me.


    In actuality, the load process will always require a bit of final tweaking and
    planning before we are ready to call it a day. In this section, we’ll discuss
    several of the features of the load that we should be aware of when choosing the
    right ETL tool, such as establishing connectors, determining load types, and rolling
    back errors.


    ### Establishing Connectors


    We’re returning to the topic of connectors one more time. We initially discussed
    building our extraction phase with our inbound connector, our proprietary data
    translator, firmly in mind. Now, we’re going the opposite way so that instead
    of pulling data from the source (or opening a listener for a web service), we’re
    inserting or updating data into the target. A big difference between the extraction
    and load connectors, however, is *time*. We may have multiple inbound transaction
    sources, but (in most cases) only a single outbound target and the data accumulates
    in our pipeline, making outbound loads much longer than retrieval.


    As an example, let’s say we have five source systems, each with 1 million records.
    Each one can be extracted, transformed, and profiled into our middleware server
    over five weeks. At the end of the five weeks, we’re ready to conduct the one-night
    load of 5 million records into our target system. Thus, we had five weeks to move
    5 million records but spent most of that time evaluating, rather than performing,
    the actual load. If our connector does not support bulk parallel loading (think
    Oracle SQL\*Loader or SQL Server BCP), we’re going to be running into trouble
    during our load phase as we are out of *time* (see Figure [5-4](#486629_1_En_5_Chapter.xhtml#Fig4)).


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig4_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Bulk Load into Target


    The key here is to know how much we need to load and what our ETL solution will
    support out of the box. If we don’t have the time as part of the hourglass of
    Figure [5-4](#486629_1_En_5_Chapter.xhtml#Fig4), we’ll need to space out our loads
    to perhaps start at an earlier point in time than what we initially thought. There’s
    nothing wrong with that approach, as long as the rest of the teams agrees with
    the impact that time plays in your load cycle. It’s always better to start the
    phase early than run out of time due to false assumptions.


    ### Determining Load Types


    We talked about load types in a previous chapter, and we won’t dwell much on them
    here. A load type refers to whether we are loading an entire dataset at once (an
    initial load or one-time migration) or performing iterative upserts against an
    already existing database (an incremental load). The ETL tool you choose should
    have features that help establish the load type you have in mind. For example,
    one tool we used on a project was quite adept at creating new one-time migrations,
    extracting, transforming, and loading the data in a relatively short order. The
    scheduling features of the ETL tool were lacking, however, and we had a difficult
    time picking out the deltas (updates) from the source system from one day to the
    next. We had to drop this tool after failing to make it fit against the right
    schedule and then had to find a new one that was more capable of performing nightly
    incremental loads. The stakeholders reluctantly agreed with our decision, but
    we were fortunate in that they had several ETL products in use, and we merely
    had to request a new license. Your organization may take a different stance when
    you tout the benefits of one product and then need to switch over to a new one
    if it’s lacking features that, in hindsight, may have been obvious. Yes, that
    change of heart can and does happen from time to time, but it’s embarrassing when
    it does.'
