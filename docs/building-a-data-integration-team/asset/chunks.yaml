  trans: '

    # 数据管理成熟度（DMM）模型


    `DMM`模型是一个面向组织数据资产及相关活动管理的流程改进与能力成熟度框架。^(¹²⁶) 它涵盖了五个功能能力与成熟度级别的最佳实践：数据管理战略、数据质量、数据运营、平台与架构，以及数据治理（`DG`）。测量与分析、风险管理和配置管理等支持流程也是该框架的一部分，共同构成一个完整的战略体系（见图
    8-8）。


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig8_HTML.jpg](img/486629_1_En_8_Fig8_HTML.jpg)


    图 8-8：数据成熟度模型类别——摘自《数据管理成熟度（DMM）模型一览》^(¹²⁷)


    通过实施这些实践，团队可以对其能力进行基准评估，识别数据优势与技术差距，并利用其数据资产来提升整体业务绩效。^(¹²⁸) 更重要的是，`DMM`模型的设计方式使其不仅可用于评估当前的管理能力，还可为未来的企业数据增强构建定制化的路线图。


    尽管遵循`DMM`模型有多种路径可供选择，但问题在于我们如何利用它来帮助维持并扩展我们的集成团队。`DMM`（可从[*https://cmminstitute.com/dmm*](https://cmminstitute.com/dmm)付费获取）在每个类别下都包含一套完整的流程；而每个流程又可进一步分解为不同的成熟度级别。也就是说，级别越高，组织在其数据实践方面的“能力”就越强。


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig9_HTML.png](img/486629_1_En_8_Fig9_HTML.png)


    图 8-9：成熟度级别


    在图 8-9 中，我展示了从最不熟练到最熟练的成熟度级别。其理念是让你审视自己的每一项实践，看看自己处于这个量表中的哪个位置。以下是各级别及其对应定义的简要列表：


    - **第 1 级：已执行级** – 在此级别，正规流程极少，修复优先于预防。如果你曾参与过技术“救火”团队，那就是这个状态。解决方案是临时拼凑而非标准化的，问题解决方面缺乏一致的最佳实践。

    - **第 2 级：已管理级** – 流程已建立并按照策略进行规划，组织认同将数据管理视为关键的基础设施资产。系统受到监控以确保团队遵守流程，但并非全球标准化。此成熟度级别主要适用于单个或多个部门，但不涵盖整个企业。

    - **第 3 级：已定义级** – 在已定义级别，组织已采纳一套标准流程及配套指南，所有团队必须一致遵循。数据在组织层面被视为绩效成功的关键。

    - **第 4 级：已量化管理级** – 在此级别，流程度量指标得到凸显，数据通过使用预测、预报和分析等统计技术，被视为竞争优势的来源。

    - **第 5 级：优化级** – 在此级别，利用第 4 级的流程度量指标来识别新的改进机会。数据团队被视为其数据领域的领导者，并通过会议、聚会和类似活动（参见第
    9 章）在整个行业分享最佳实践。数据不仅被视为绩效成功的关键，更被视为在竞争激烈的市场中生存的绝对必需品。


    有了`DMM`类别的基础知识，以及评估团队和企业能力成熟度级别的主观能力，当你初步尝试了第一次集成后，就可以开始思考你想要前进的方向。利用本章描述的监控指标，你已经在向第
    4 级努力（前提是你使用了诸如日志报告之类的指标），但通常还有更多“孤岛”可以审视。你是否有一些属于第 1 级的集成领域，需要定义更多的数据流程？这些最佳实践能否扩展到整个组织？你能将许多流程自动化到数据分析可以帮助指导下一步的程度吗？组织的各数据层如同一块拼布，每一层都能激发下一步的思考。这就是你部署后第一个月内进行监控的主要目的——确定你当前的数据成熟度级别，决定你想要达到的级别，并利用你手头已有的分析数据——还有什么需要改进？然后思考你将如何实现它。


    **注意：** 尽管大多数组织领导者对其成熟度模型持现实态度，但时不时地，你也会遇到一个怀有宏大而艰巨的目标（`BHAG`）的人。你可能会听到诸如“我们希望迁移数据、制定政策和流程、运用统计学，并尽快成为市场领导者。你什么时候能完成？”这样的要求。虽然雄心勃勃有其好处，^(¹²⁹)
    但我建议从一开始就设定恰当的期望；仅仅一个集成项目就可能需要时间、精力和足够多的专业资源。在组织其他部门尚未准备好的情况下将这一模型扩展到企业范围，将会导致失望、财务挫折和一系列其他困扰。我们将在下一章更多讨论如何让高层管理支持你的团队。


    ## 第一年：部署后


    一年之后，你已经选择全力投入数据集成系统，并成功完成了几个较重大的项目，制定了文档化的最佳实践和策略，建立了按需监控系统，并有了一个接近（或达到）`DMM`第
    4 级和第 5 级的总体路线图。


    随着你的项目扩展到其他部门，你会注意到它们提供的源数据集之间存在共性。例如，这些部门的员工各自收集了不同版本的账户、客户、产品和供应商信息。他们不知道的是，其他团队也存储着类似的信息，可能只是格式或拼写不同。你经常会发现三个部门各有三张表，每张表都包含同一个客户的变体。一张表包含姓氏、名字、中间名、电子邮件和传真；第二张包含全名、地址和电子邮件；第三张包含全名、电话号码、电子邮件和年龄（见图
    8-10）。


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig10_HTML.jpg](img/486629_1_En_8_Fig10_HTML.jpg)


    图 8-10：三个独立数据库中共有的`CUSTOMER`信息


    只有通过探索、剖析和分析，这些共性才会变得清晰。而一旦明确，你可能就会思考如何将这些各自独立但内容相等的记录整合到一个单一的参考点。这将引领我们进入集成之旅的下一步：将关键数据链接到一个被称为主数据管理（`MDM`）的系统中。

    '
- fmt: "# MDM\n\nAs its end goal, an MDM system should be able to consolidate data\
    \ from multiple system sources into a single view that can then be further retrieved\
    \ and refined by data teams. For example, if we chose to integrate our distinct\
    \ customer databases from Figure [8-10](#486629_1_En_8_Chapter.xhtml#Fig10) into\
    \ a single MDM repository table, we could track the complete set of fields (`First\
    \ Name`, `Last Name`, `Middle Name`, `Nicknames`, `Address`, `Email`, `Phone Number`,\
    \ `Fax`, and `Age`) (see Figure [8-11](#486629_1_En_8_Chapter.xhtml#Fig11)).\n\
    \n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig11_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig11_HTML.jpg)\n\
    \nFigure 8-11 Common CUSTOMER MDM View\n\n> **Note:** Architects sometimes state\
    \ an MDM system when they really mean a data warehouse. It’s easy to get confused,\
    \ but there are slight discrepancies between the two, which I will not go into\
    \ here. Data warehousing tends to be standalone, while MDM is an extension of\
    \ the integration lifecycle. Read the article from Jim Harris found at [*https://blogs.sas.com/content/datamanagement/2017/04/27/mdm-different-data-warehousing/*](https://blogs.sas.com/content/datamanagement/2017/04/27/mdm-different-data-warehousing/)^([^(130)](#fn130))\
    \ for further clarification.\n\nBuilding an MDM can be challenging and spark contention\
    \ among teams,^([^(131)](#fn131)) but the benefits of reuse and standardization\
    \ can significantly increase response speeds, provide more flexible reporting,\
    \ and improve data quality. Customizable MDM tools from vendors such as IBM^([^(132)](#fn132))\
    \ and Dell Boomi^([^(133)](#fn133)) offer a single view of the data across the\
    \ enterprise and may be worth looking into if you want to stand up a solution\
    \ in a relatively short amount of time and with minimum coding effort.\n\n## Summary\n\
    \nIn this chapter, we have discussed the post-deployment operation of monitoring\
    \ and leveraging your log results to ensure a smooth transition into your next\
    \ activities. Whether you are fixing the existing issues in the short-term days\
    \ and weeks ahead or continuously improving your process across months and years,\
    \ your team will always be seeking out ways to minimize data errors, reduce downtime,\
    \ and further the understanding of where the team should be going next.\n\nIn\
    \ the next chapter, we’ll discuss how to spread the word and get the rest of the\
    \ enterprise involved in your efforts.\n\nFootnotes [1](#486629_1_En_8_Chapter.xhtml#Fn1_source)\
    \   [2](#486629_1_En_8_Chapter.xhtml#Fn2_source)   [3](#486629_1_En_8_Chapter.xhtml#Fn3_source)\
    \   [4](#486629_1_En_8_Chapter.xhtml#Fn4_source)   [5](#486629_1_En_8_Chapter.xhtml#Fn5_source)\
