  trans: '

    在设计解决方案时，你需要心中有一个精确的度量标准。例如，如果我们试图限制返回的记录数，就不能设置得过高，以免导致系统运行停滞；但也不能过于保守，让 15 次独立的执行各自只携带
    5000 条记录。可以这样想：就像金发姑娘那样，不过这里不是粥，而是数据；不是熊，而是你的 ETL 代码。选定一个目标值，然后坚持下去。


    我们经过讨论，希望每次执行大约耗时 30 秒。当然，我们每天会多次启动任务，但我们要的是可预测性，而非可变性；这正是我们持续改进的方向。


    - **检查**：完成代码更新后，你可以在**预发布环境**中进行测试。创建与你通常可能接收的数据相匹配的数据，然后执行并重新绘制图表。


    我们有一个不错的数据生成器，可以创建与第一周接收到的数量相匹配的模拟数据。如果你没有好的数据生成器，可以看看两个在线工具：Mockaroo (<https://www.mockaroo.com/>)
    和 Generate Data (<http://www.generatedata.com/>)。这些工具允许你以多种格式保存数据，如果你有技术能力，甚至可以自动化脚本。


    回顾一下我们的策略：我们不再每天只运行一次任务，而是每天运行多次，每次处理 25000 条记录。表 8-3 展示了并行执行的测试记录数量的明细。


    **表 8-3** 并行执行的测试记录数量


    | 任务名称 | 测试日 1 | 测试日 2 | 测试日 3 | 测试日 4 | 测试日 5 | 测试日 6 | 测试日 7 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 任务 4 #1 | 25,000 | 25,000 | 25,000 | 25,000 | 25,000 | 23,370 | 23,370 |

    | 任务 4 #2 | 25,000 | 15,508 | 25,000 | 25,000 | 11,613 | | |

    | 任务 4 #3 | 2,175 | | 11,541 | 17,773 | | | |

    | **总计** | **52,175** | **40,508** | **61,541** | **67,773** | **36,613** | **23,370**
    | **23,370** |


    在这个模拟数据集中，你会注意到三个改动。首先，我们追踪的不是天数，而是测试执行次数。这种方法加快了我们交付的进度。其次，每个“天”运行任务的累计总数等于我们原来的记录数量。这种技术提供了同类对比。第三，如果在达到
    25000 条记录限制之前就用完了测试记录，则无需继续执行。例如，测试日 2 只有 40508 条记录。第一次执行包含 25000 条，第二次执行等于剩余的`40508
    – 25000 = 15508`条。不需要第三次执行。


    我们选择 25000 条是因为这看起来是一个不错的起点——既不太多也不太少。此外，在我们原始执行中（图 8-5），周六和周日的任务大约耗时 30 秒，这符合我们的目标。


    将这个数据集以堆叠柱状图的形式显示，会呈现出与之前图表相同的形状（见图 8-7）。


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig7_HTML.jpg](img/486629_1_En_8_Fig7_HTML.jpg)


    **图 8-7** 按测试日统计的累计记录数量


    为了确认处理速度，我们从日志文件中收集每次执行的时间（见表 8-4）。


    **表 8-4** 并行执行的测试记录时间（秒）


    | 任务名称 | 测试日 1 | 测试日 2 | 测试日 3 | 测试日 4 | 测试日 5 | 测试日 6 | 测试日 7 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 任务 4 #1 | 30 | 29 | 28 | 30 | 33 | 28 | 28 |

    | 任务 4 #2 | 31 | 20 | 29 | 28 | 18 | | |

    | 任务 4 #3 | 7 | | 18 | 24 | | | |


    现在，我们每次执行 25000 条记录的数据集看起来稳定得多。如果总结第一次任务运行，平均值为 29.43 条记录，标准差（变异性）为 1.81。也就是说，在这些测试日中，95%的情况下执行时间预计在
    25.80 到 33.05 之间。这个度量值比原始数据集更受约束，使得我们对未来的性能有相当程度的可预测性。


    - **行动**：请记住，这只是一次分析，尚未实施任何生产环境的变更。但你拥有大量数据和度量，可以与源端和目标端的团队成员分享，并为下一次流程升级提供指导。让他们了解实施这项改进所需的努力，就你所选择的方向是否正确达成共识（30
    秒对于这个任务来说是否太短？还是太长？），一旦获批，就开始根据新的变更和部署计划修改你的文档。


    ## 第一个月：部署后


    一周的时间可能不足以追踪你的改进计划。一个月后，系统运行顺畅，你通过 PDCA 循环识别出了一些可能简化流程的工作，并基于反馈和个人观察持续维护一个更新积压列表。利益相关者已经开始谈论“下一件大事”，管理层要求你组建团队讨论未来的迁移和集成工作。此时，你可能会问自己：“这是要去往何方？下一步是什么？”答案并不明确：“很多方向。”你已经到了这样一个节点：要么维持现状，通过提供运维支持并偶尔进行升级；要么是时候向前推进，扩展组织在数据与治理方面的水平。为此，我们需要讨论数据管理成熟度（DMM）模型。

    '
- fmt: '# The Data Management Maturity (DMM) Model


    The `DMM` model is a process improvement and capability maturity framework for
    an organization’s management of data assets and related activities.^([^(126)](#fn126))
    It covers the best practices across five levels of functional capability and maturity:
    Data Management Strategy, Data Quality, Data Operations, Platform and Architecture,
    and Data Governance (`DG`). Supporting processes such as Measurement and Analysis,
    Risk Management, and Configuration Management are also part of the framework,
    forming a complete strategy (see Figure [8-8](#486629_1_En_8_Chapter.xhtml#Fig8)).


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig8_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig8_HTML.jpg)


    Figure 8-8: Data Maturity Model Categories—From Data Management Maturity (DMM)
    Model At-A-Glance^([^(127)](#fn127))


    By enabling these practices, teams can benchmark their capabilities, identify
    the data strengths and technological gaps, and leverage their data assets to improve
    their overall business performance.^([^(128)](#fn128)) More importantly, the `DMM`
    model is designed in such a way that it can be used to not only assess the current
    management capabilities but also to build a customized roadmap for future enterprise
    data enhancements.


    Although there are many paths we can take in following the `DMM` model, the question
    is how we can leverage it to help us maintain and expand on our integration team.
    The `DMM` (which is available for a cost from [*https://cmminstitute.com/dmm*](https://cmminstitute.com/dmm))
    contains a complete set of processes under each of the categories; and each of
    these processes can, in turn, break down into maturity levels. That is, the higher
    the level, the more “capable” the organization is concerning their data practice.


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig9_HTML.png](images/486629_1_En_8_Chapter/486629_1_En_8_Fig9_HTML.png)


    Figure 8-9: Maturity Levels


    In Figure [8-9](#486629_1_En_8_Chapter.xhtml#Fig9), I’ve illustrated the maturity
    levels going from least adept to most. The idea is for you to examine each of
    your practices and to see where you fit in this scale. A brief list of each level
    with the corresponding definition follows:


    - **Level 1: Performed** – At this level, formal processes are minimal, and repair
    takes precedence over prevention. If you’ve ever been on a team engaged in technical
    firefighting, this is it. Solutions are improvised at the moment rather than standardized,
    and there is no consistency in best practice for issue resolution.

    - **Level 2: Managed** – Processes are in place and planned against the policy,
    with the organization agreeing that managing data is a critical infrastructure
    asset. Systems are monitored to ensure that teams adhere to the process, but it
    is not globally standard. This maturity level applies primarily to the single
    or multiple departments but does not encompass the enterprise.

    - **Level 3: Defined** – At the Defined level, a set of standard processes and
    accompanying guidelines have been adopted by the organization and must be consistently
    followed by all teams. Data is treated at the organizational level as critical
    for performance success.

    - **Level 4: Measured** – Process metrics are highlighted at this level, and data
    is treated as a source of competitive advantage through the use of statistical
    techniques like forecasting, prediction, and analysis.

    - **Level 5: Optimized** – At this level, the process metrics taken from Level
    4 are used to identify new improvement opportunities. The data teams are regarded
    as a leader in their data space, and best practices are shared across the industry
    through conferences, meetups, and similar events (refer to Chapter [9](#486629_1_En_9_Chapter.xhtml)).
    Data is not just viewed as critical for performance success but is seen as an
    absolute necessity for surviving in a competitive market.


    With the foundations of the `DMM` categories and subjective ability to assess
    the capability maturity level of your team and enterprise, you can start thinking
    about the direction you want to go after dipping your toe in the waters of your
    first integrations. With the monitoring metrics described in this chapter, you
    will already be striving for Level 4 (provided you use metrics like log reports),
    but there is generally much more of your silos that you can examine. Do you have
    Level 1 integration areas that need more data processes defined? Can these best
    practices be extended across the organization? Can you automate many of these
    processes to the point where data analytics can help guide you in your next steps?
    Organizations have a patchwork of data layers, and each one of them can stimulate
    ideas for the next step. That is your primary purpose of monitoring following
    the first month post-deployment—determine your current level of data maturity,
    decide where you want that level to be, and use the existing analytic data at
    your disposal—what else requires improvement? Then think about how you will get
    it done.


    **Caution:** Although most organization leaders have a realistic approach to their
    maturity model, now and then, you’ll run into one with a big, hairy audacious
    goal (`BHAG`). You may hear something like “We want to migrate the data, build
    policy and procedures, use statistics, and become the market leader as quickly
    as we can. When can you have this done?” While being ambitious has its perks,^([^(129)](#fn129))
    I would recommend setting the appropriate expectations right from the outset;
    just one integration project can take time, effort, and more than enough skilled
    resources. Expanding this model enterprise-wide before the other parts of the
    organization are ready will lead to disappointment, financial setbacks, and a
    slew of other frustrations. We’ll talk more about getting upper management on
    board with your team in the next chapter.


    ## Year One: Post-deployment


    After a year, you have chosen to fully invest in your data integration system
    with a few more significant projects under your belt, have documented best practices
    and policies, have established an on-demand monitoring system, and have a general
    roadmap for getting close to (or at) `DMM` Levels 4 and 5.


    As your projects expand to other departments, you will notice commonalities among
    the sourced datasets they provide. For example, the staff in these departments
    collect their separate versions of accounts, customers, products, and suppliers.
    Unbeknownst to them, other teams store similar information, perhaps with only
    a different format or spelling. It is quite common to find that you have three
    tables among three departments, each containing a variation of the same customer.
    One table contains last name, first name, middle name, email, and fax; the second
    contains full name, address, and email; the third contains full name, phone number,
    email, and age (see Figure [8-10](#486629_1_En_8_Chapter.xhtml#Fig10)).


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig10_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig10_HTML.jpg)


    Figure 8-10: Common `CUSTOMER` Among Three Separate Databases


    Only through exploration, profiling, and analysis will these commonalities become
    clear. And when this clarification arrives, you may want to about ways to integrate
    these separate-but-equal records into a single point of reference. That leads
    us to the next step in our integration journey, linking critical data into a system
    known as Master Data Management (`MDM`).'
