- fmt: "### Validating Inbound Data\n\nThroughout the extraction process, you’ll want\
    \ to make sure that you are pulling the right fields, making sure that you have\
    \ an exact match between your source and stored data. This validation can and\
    \ should happen throughout the ETL process, but it is essential for this first\
    \ phase since data loss at this step will not be traced throughout the later stages.\
    \ Some of the validation techniques you may want to test are ensuring that data\
    \ types like strings and numbers are consistent, duplicated or fragmented data\
    \ is removed, and primary keys for each of your objects are included. Remember,\
    \ the final data output is only as good as the initial data input. If you are\
    \ moving invalid data during your extraction, then remediation during subsequent\
    \ steps is nothing short of a huge challenge.\n\n## Transformation\n\nUnless you\
    \ are dealing with a direct 1:1 map of your data where your source matches your\
    \ target, you must manipulate your staged data to match the expected format of\
    \ your target system. This activity is where the actual effectiveness of your\
    \ chosen ETL tool comes into play. There are several factors to consider when\
    \ making your transformation decisions, such as modifying data and validating\
    \ the results.\n\n### Modifying Data\n\nThe more complicated the transformation,\
    \ the more internal functionality your ETL tool will need to have. Data that does\
    \ not require manipulation is called *direct move* or *pass-through* data,^([^(91)](#fn91))\
    \ and we usually identify it as such on the Transformation Rules section of the\
    \ Source-to-Target Mapping (see Chapter [4](#486629_1_En_4_Chapter.xhtml)).\n\n\
    Transformation, at its most basic level, involves applying a set of functions\
    \ on the extracted data. How these functions are coded and triggered is perhaps\
    \ the most critical step in determining the best tool for your team. Some ETL\
    \ products use `Java` for transformations (`Talend`), while others may inherit\
    \ their codebase from Microsoft scripting (`SSIS`), `JavaScript` (`Pentaho`),\
    \ or a choice of programming languages (`Dell Boomi`). It seldom helps teams hit\
    \ the ground running when developers and support staff need to learn an entirely\
    \ new language from scratch. Pairing the right transformation syntax with the\
    \ skillset of your team will make a massive difference in your beginning productivity.\n\
    \n### Analyzing Data Integrity\n\nI mentioned earlier that the data provided by\
    \ the source would be stored in a staging area. During the transformation phase,\
    \ programmatic rules are applied, which results in a modified value. To determine\
    \ the integrity of our transformation, we need to pose three questions:\n\n1.\
    \  Is my data accurate? For example, can the transformed value be traced back\
    \ to the source?\n2.  Is my data complete? For example, are fields denoted as\
    \ `NOT NULL` in the target system populated with a valid value?\n3.  Is my data\
    \ consistent? For example, have we applied the same rules across the board for\
    \ similar values?^([^(92)](#fn92))\n\nAll three questions matter, and failure\
    \ to meet any of them will trip up the project somewhere along the way. We’ll\
    \ find it either during deployment when we get a dreaded `\"Cannot insert NULL\
    \ into NOT NULL value\"`^([^(93)](#fn93)) or later down the line when our reporting\
    \ system coyly identifies four separate accounts labeled “International Business\
    \ Machines,” “IBM,” “IBM Corp.,” and “I.B.M.”\n\nOf course, we want to avoid and\
    \ patch any data integration errors that we find during our transformation process.\
    \ Given that our projects literally might have millions of data points to cover,\
    \ this is easier said than done. I would go so far as to say that lack of data\
    \ integrity is probably the most significant cause of bugs following an initial\
    \ data migration. What can we do to resolve the potential for these types of errors?\
    \ Here are two suggestions I’ve tried:\n\n1.  **Update at the source.**\n\n  \
    \  We discussed in a previous chapter the concept of profiling—the process of\
    \ reviewing source data to understand the structure, content, and interrelationships.\
    \ During your profiling phase, pay special attention to specific patterns that\
    \ account for most of the standard data integrity issues:\n    *   Different spellings\
    \ of names/nicknames identified alongside email (Beth versus Elizabeth versus\
    \ Liz, all with the same email address)\n    *   Different organization spellings\
    \ (IBM, I.B.M., IBM Corp.)\n    *   `NULL` values in the source that require population\
    \ in the target\n    *   Alphanumeric characters mixed with data that should be\
    \ numbers only\n    *   Misspellings or inconsistencies to manually entered values\
    \ such as addresses or products\n\n2.  **Analyze and update post-transformation.**\n\
    \n    If, for whatever reason, you cannot correct (or identify) the data at the\
    \ source, investigate and provide exception logic to your transformed data. This\
    \ approach will require you to store the processed data in yet another temporary\
    \ storage platform, but it will allow you to perform a makeshift profiling analysis\
    \ that will show many more data integrity errors than could be found simply by\
    \ eyeballing your load extract.\n\nAlthough you can do it, be wary when attempting\
    \ to modify badly aligned data outside of the source system. While it may seem\
    \ more straightforward to modify that over which you have control, the most significant\
    \ deficiency with updating in your ETL or staging platform is that you are creating\
    \ narrow rules that must be maintained. That is, an update to one system necessitates\
    \ an update to another, creating a dependency you may not want.\n\nFor example,\
    \ imagine that you hardcode transformation logic that converts all variations\
    \ of “IBM,” “I.B.M.,” “International Business Machines,” and so on into a single\
    \ value: “IBM Corporation.” This is relatively easy to do under your team’s control\
    \ and it saves time upfront as you do not have to change data in the source system.\
    \ Five months later, the team from the source system makes the seemingly innocuous\
    \ decision to update the target value of “IBM Corporation” into “IBM Corp.” If\
    \ (and this is a big “if”) they decide to tell your team, are you ready to scour\
    \ your ETL code and find where you placed that hardcoded logic? Are you then prepared\
    \ to test and maintain every production change that requires similar exception\
    \ logic changes? Forever and ever? Although it sounds like an exaggeration, you\
    \ can see how taking data integrity ownership outside of the source system can\
    \ lead to some significant roadmap upheavals. I would recommend avoiding as many\
    \ of these update scenarios as possible, unless it really is more advantageous\
    \ in the here and now, such as with the one-off migration.\n\nThis brings us to\
    \ the third option, which is more of a default.\n\n3.  **Do nothing.**\n\n   \
    \ If requesting a source update does not work, and you think building exception\
    \ logic is a bad idea, then let the data make its way into the target as is. Yes,\
    \ it will lack data integrity, but it will be *there*. As long as you can trace\
    \ it to the root cause (i.e., a particular source field), remediation can shift\
    \ to the target system cleanup crew. What’s most important is that you avoid any\
    \ unnecessary surprises. Warn teams ahead of time what you face and give them\
    \ the pros and cons of all options involved, even the default of doing nothing.\
    \ Identify the decision in the Notes column of the `STTM` spreadsheet and provide\
    \ a status report that can go up the chain in case last-minute decisions are made."
