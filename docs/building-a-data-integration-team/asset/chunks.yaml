    offer similar reporting standards (see Figure [7-16](#486629_1_En_7_Chapter.xhtml#Fig16)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig16_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig16_HTML.jpg)


    Figure 7-16


    Execution Results Logging Panel


    According to my log, we loaded 687 records just shy of 2 seconds. Not bad timing,
