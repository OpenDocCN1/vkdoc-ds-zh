    \n# 3. Team Qualifications\n\n> *But what I do have are a very particular set\
    \ of skills, skills I have acquired over a very long career.*\n> \n> —Liam Neeson,\
    \ Taken (2008)^([^(35)](#fn35))\n\nIn the previous chapters, we’ve discussed the\
    \ basics of integration, approaches, and some of the key terms. With this understanding,\
    \ we can now start talking about the roles and responsibilities required to make\
    \ an integration project successful.\n\nMany project leaders believe that one\
    \ person can be responsible for an entire integration effort, including requirements,\
    \ design, and the inevitable deployment. In some situations, this is true. But\
    \ in many others, additional support is needed. Unfortunately, as with all projects\
    \ that have multiple layers of complexity, the types of skills and the number\
    \ of resources required to support are unknown long after kickoff begins.\n\n\
    Throughout this chapter, we will talk about the subtle and not-so-subtle best\
    \ practices that make up the integration team:\n\n* Team personality\n* Types\
    \ of teams\n* Team sizes\n* Waterfall versus Agile team expectations\n* Integration\
    \ team roles\n* Recruiting your team\n\nAfter reading this chapter, you will have\
    \ a clearer picture of how to build the integration team, when to shift the “single\
    \ person does it all” mind-set, and, perhaps most importantly, how you can best\
    \ enhance the staff and skills that will make your projects successful."
  raw: "### Scheduling\n\nIf the ETL process is repeatable, that is, running at a\
    \ particular time of day on a specified interval, then the process can be set\
    \ to auto-execute. The way to set this execution is through a scheduled service\
    \ which might be built-in to the ETL tool or configured through a server scheduling\
    \ application. For more details on job scheduling as part of a nightly integration\
    \ approach, refer to Chapter [1](#486629_1_En_1_Chapter.xhtml), Scheduled Services.\n\
    \n### Logging\n\nIntegration jobs can run in parallel and execute at any time\
    \ of the day. With so much traffic passing through the ETL tool, creating a moment-by-moment\
    \ status report for each record success or failure might be overkill. We want\
    \ to avoid loading our server with too much information. At the same time, however,\
    \ we still might want to store this information *just in case,* especially if\
    \ we work with data that might have legal or financial ramifications to the organization.\
    \ As a simple example, imagine we have designed and deployed an ETL process for\
    \ a magazine publication. This process performs a nightly integration against\
    \ customer subscriptions by copying records from a source accounting system to\
    \ a target mailing list. Everything that we’ve built up to now appears to be running\
    \ smoothly.\n\nBut wait, not so fast. Two weeks after deployment, our customer\
    \ service department receives a complaint from an irate customer who claims that\
    \ she has been receiving a magazine to which she never subscribed. “Impossible,”\
    \ we say, knowing that our ETL system has worked fine up to now. But a query into\
    \ our subscription database reveals that this customer truly was assigned the\
    \ wrong magazine. How could that have happened? And when?\n\nThe most efficient\
    \ way to investigate would be by going through log files to trace the moment when\
    \ the record and mismatched subscription entered the ETL system. Most ETL tools\
    \ can provide this logging functionality, the individual inbound and outbound\
    \ recordsets, and the time, date, and name of the job process that executed. Due\
    \ to their large file size over time, the system should be configured to keep log\
    \ files just long enough to investigate any issues that may arise—perhaps three\
    \ weeks to a month. Keeping them longer may cause your system to falter as processing\
    \ space decreases. Without these logs on hand, however, it could take days or\
    \ even weeks to uncover the root cause, all the while having to deal with customers\
    \ and business owners who become increasingly annoyed with what they can only\
    \ surmise is *your* faulty integration logic, as opposed to a completely unrelated\
    \ event.\n\n## Target\n\nThe target system receives the integration data and often\
    \ represents the key deliverable of an integration project. Most of the business\
    \ rules that require adjusting or tweaking are for the benefit of the target system,\
    \ and these particular stakeholders are the ones that need to be comfortable with\
    \ the integration team’s solutions. The connection type and metadata model components\
    \ in the target are the same as discussed earlier with the source, with the same\
    \ approximate fundamentals. The target endpoints and data matching concepts do\
    \ differ, however, and we’ll cover them here.\n\n### Target Endpoint\n\nThe target\
    \ endpoint is the receiving channel of the data stream that originated in the\
    \ source, extracted to the ETL, and then is loaded to fit existing business rules.\
    \ The main difference between the target and source endpoint is from the perspective\
    \ of the ETL connector. The connector retrieves from the source using a GET method\
    \ and pushes it to the target using a POST method.^([^(31)](#fn31)) That is about\
    \ as much as I can say on web services without diving deeper into the topic, so\
    \ for now, just be aware of the difference between GET and POST. If you want to\
    \ know more, I recommend reading Sanjay Patni’s book, *Pro RESTful APIs* (Apress,\
    \ 2017).^([^(32)](#fn32))\n\n### Data Matching\n\nThe target system contains records\
    \ from multiple datasets. If you think about it, having a common identifier for\
    \ all these systems would be rare. Even a common table such as CONTACT might use\
    \ a national identity value such as Social Security Number as the unique identifier\
    \ from one source and then shift to a passport number as the unique identifier\
    \ from a second source. The role of data matching is to find records that refer\
    \ to the same entity, often by analyzing across fields that provide partial identification,\
    \ such as a full name or date of birth.^([^(33)](#fn33)) Finding these common\
    \ identifiers can be challenging when importing across multiple source systems.\
    \ As an aid, software companies have created specialized scripts, algorithms,\
    \ and software to merge and minimize duplicate records. From this point onward,\
    \ the data matching crosses into a technical arena known as Master Data Management\
    \ (MDM) , so named because a single record (the “master”) can theoretically trace\
    \ back to the source system identifiers, centralizing enterprise databases into\
    \ a single hub.^([^(34)](#fn34)) Designing an MDM requires a different set of\
    \ skills from integration and won’t be covered in our topics. Do keep in mind,\
    \ however, that a data matching approach in the target system is a step closer\
    \ to achieving MDM, the ultimate goal in reconciling data across an enterprise.\n\
    \nWe’ve covered many of the key terms and concepts in this chapter, starting with\
    \ the simple diagram of an integration architecture. Underneath the surface of\
    \ the proverbial data iceberg, there’s more to take in. Now that we understand\
    \ the mechanics of the source, ETL, and the target systems, we can now begin to\
    \ highlight the required skills. Specifically, what roles and responsibilities\
    \ do we need in our integration team? The next chapter will dive into detail.\n\
    \nFootnotes [1](#486629_1_En_2_Chapter.xhtml#Fn1_source)   [2](#486629_1_En_2_Chapter.xhtml#Fn2_source)\
    \   [3](#486629_1_En_2_Chapter.xhtml#Fn3_source)   [4](#486629_1_En_2_Chapter.xhtml#Fn4_source)\
