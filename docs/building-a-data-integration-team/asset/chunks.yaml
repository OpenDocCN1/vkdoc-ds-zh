  trans: '

    # 项目经理（PM）


    如果瀑布式项目是一支管弦乐队，那么项目经理就是其指挥。此人了解软件项目的方方面面，管理预算和进度，监督软件测试，交付所有文档，并获取客户的正式验收。


    在集成项目中，项目经理继续担任这个角色，在需要时大量依赖技术主管，但继续充当开发团队和客户之间的接口。


    # 技术主管


    在软件开发项目中，此角色将业务需求转化为技术解决方案，并将任务分配给软件开发人员。在项目的集成部分，数据集成架构师可能会取代技术主管的角色。


    # 数据集成架构师


    数据集成架构师属于 IT 团队，顾名思义，负责数据集成解决方案。数据集成架构师专精于其领域，管理数据架构中涉及数据从一个点移动到另一个点的所有方面。这些职位角色也往往需要面向客户，并以与技术主管相同的能力与
    ETL 开发团队密切合作。主要区别当然集中在集成方面，这需要与软件开发不同的功能和技术技能。


    # 软件开发人员


    软件开发人员负责使用技术主管的技术要求，来制定成本和进度估算、构建可交付成果，并向技术主管和项目经理传达项目状态。在集成项目中，ETL 开发人员取代了软件开发人员的角色，尽管职责相对相同。


    # 软件测试人员


    软件测试人员确保软件解决方案满足业务需求，并且没有错误、故障和缺陷。与软件开发人员一样，我们可以将这个角色重命名为`ETL tester`，但这有点别扭。我们通常坚持使用听起来更通用的头衔`tester`来代表两者。


    # 用户验收测试人员


    这些人是公司的代表，执行最终检查，以确保软件在多个真实场景中都能为业务正常运作。在集成团队中，用户验收测试人员应该由处理日常数据活动的人员担任，因此他们对于集成是否按预期执行有最准确的理解。


    # 业务分析师


    业务分析师负责弥合 IT 与业务之间的差距。他们通过数据分析、需求收集、流程评估，以及向高级管理人员和利益相关者提供数据驱动的建议和报告来实现这一点。业务分析师制定能够改善导入并优化成本的举措和策略，其客户通常是财务团队和
    IT 部门。业务分析师还专注于数据驱动的任务，例如预算和预测、规划和监控、定价、报告以及定义业务需求。


    对于集成项目，业务分析师作为功能和业务方之间的联络人，确保业务需求准确无误，并被 ETL 开发人员正确解读。这个角色需要持续不断的反复沟通，因为业务分析师必须确认开发人员所理解的内容正是利益相关者所期望的。


    # 发布经理


    发布经理是一个相对较新的角色，已在开发运维（DevOps）领域获得广泛认可，值得从集成的角度进行探讨。^(⁵⁶) 此人负责发布管理生命周期，包括对多个应用程序的发布进行调度、协调和管理。这些发布可能包括应用程序更新、操作系统补丁、安全改进、硬件升级、项目、项目群等等。


    发布经理在 ETL 应用程序中测试和部署集成方面起着至关重要的作用，并且必须与所有参与者（包括 ETL 开发人员和测试人员）协作，共同建立他们的构建、测试和生产环境。


    与讨论的其他职位相比，该职位更需要 T 型技能组合。随着各行业的自动化水平不断提高，集成发布经理的角色可能会转变为通用测试员；但就目前而言，此人充当不同环境之间的看门人，并全力确保系统持续处理数据。


    # 招聘你的团队


    既然我们已经讨论了团队中的各种角色，现在是时候识别并招募那些将与您共事的人员了。当然，您的第一步是确定您需要什么类型的角色，然后创建职位描述。


    ## 确定角色


    评估集成项目背景的方法有两种：


    -   作为补充附加项，其中集成是一个更大项目的次要部分


    -   作为一个主要项目，通常是大规模的企业级部署


    您参与的许多初始项目都属于第一种类型，但如果组织正在转向存储库或数据仓库项目，则第二种类型会出现。无论如何，当您决定需要招聘的职位时，必须考虑全局。自然地，如果是运行补充性集成，您需要从标准的软件开发团队开始，并至少增加集成架构师、ETL
    开发人员和业务分析师的职位。由于这类项目通常是短期的，您还需要考虑是聘请独立承包商，还是雇佣一个在项目结束或暂停后可以身兼多职的长期全职员工。


    独立承包商也可以参与较长期的、大规模的项目，但您需要的技能和要求更符合我们之前讨论的 T 型资格，这需要聘请更有经验的专业人员，或许还需要随着实践的开展而增加培训。


    有关合同工与全职员工的利弊的更多信息，请参阅 [*https://blog.toggl.com/contract-vs-full-time/*](https://blog.toggl.com/contract-vs-full-time/)。^(⁵⁷)

    '
- fmt: '### The Job Description


    Knowing whether you want short- or long-term employment is the key to writing
    a good job description. You want to provide enough details for candidates to evaluate
    their qualifications while managing to keep the summary concise. As a rule of
    thumb, Indeed.com recommends keeping the description between 700 and 2,000 characters
    long.


    In terms of staffing your integration project, you will want to include sampler
    boilerplate text for the job duties. I recommend also adding the following topics:


    *   **Job Experience**: The more complicated the integration requirements, the
    more years of integration-specific experience that you will want your candidate
    to have.

    *   **Education**: Many integration roles want Computer Science or Mathematics
    as a background, but this does not necessarily need to be the case. I’ve seen
    many good Business majors make excellent integration leads as the ability to communicate
    with stakeholders is an essential part of the job. If the project has a steep
    focus on analytics, then at least some Data Science training should be required.

    *   **Programming Language**: If hiring for a technical role, you will want your
    team to have at least one to two programming languages under the belt. Because
    of the dependency on databases, `SQL` programming is a must. Your ETL tool may
    have additional programming requirements such as `Java` or `JavaScript`, but that
    rests clearly with the chosen software.

    *   **Software**: Your project is driven by an in-house ETL tool, either existing
    or up for grabs. Make sure the person you hire has experience with a specific
    application or some semblance of one. It does not have to be a precise 1:1 match
    as one software product may have transferable functionality to another. What matters
    most is that the candidate knows the terminology and can talk about the approach
    for architecting/developing a design.

    *   **Operating System**: Some hiring managers focus more on the software and
    language than the operating system, but this skill is an excellent predictor of
    how fast new team members will be able to hit the ground running. If your shop
    leans toward a Windows environment, then state that. If Mac dependent, then go
    that way. What matters is that you interview people who already have training
    in the particular platform you use. I’ve encountered many people with fantastic
    integration skills who did not understand simple Unix shell commands. The curve
    can be steep when simultaneously learning new software on unfamiliar operating
    systems, so keep this in mind when writing your job description.

    *   **Language**: By this, I mean native and secondary language fluency. As mentioned
    earlier, communication among the team is critical, even with your more technical
    back-end roles, which may have a last-minute update during deployment. If you
    need fluent speakers and writers in a particular language, then call that out.


    An excellent place to start thinking about your description is [https://work.chron.com/job-description-etl-developer-26435.html](https://work.chron.com/job-description-etl-developer-26435.html).
    Various sites across the Web will have other alternatives as well.


    ## Finding Candidates


    Once you have a clear understanding of what you need, where do you go to find
    the best pool of candidates? There are two main avenues to explore:


    *   Internal to your organization

    *   External to your organization


    ### Internal Candidates


    If you work for an organization where roles are loosely defined, the integration
    project itself is a short-term supplemental, or if you are just beginning to build
    your integration practice, you may be able to find some interested candidates
    within your current software development or IT team. The main advantage of going
    this route is that you can establish a pipeline early on as those qualified individuals
    who want to take on additional responsibilities and who will let you know this
    path as soon as you announce the project. The second advantage of internal hiring
    is that you can assess your candidates based on their peers’ recommendations—you
    will be able to evaluate those who fit the role better than an unknown source.
    Of course, if you require a different degree of skills than what is available
    within the organization, you will have to reach out externally.


    ### External Candidates


    #### Referrals


    One of the best ways to find qualified external candidates is the same as the
    route of evaluating internal candidates: referrals. In this case, getting leads
    from your top hires is by asking about their favorite past coworkers. This method
    probably works more than any other, so much so that one study found that 46% of
    hires at top-performing companies came from internal referral sources. The reason
    referrals are great at finding candidates may not be monetarily related (it is
    questionable whether employee referral bonuses work), but rather more a function
    of people knowing their associates’ personalities, likes, and dislikes.


    Although a referral program may land you some good leads, it is not the only method.
    The following are a few others you might want to consider.


    #### Outsourcing


    Earlier, we talked about hiring independent contractors for placing on short-term
    projects. If you need extra horsepower, want specialized skills, or want a different
    perspective on your internal culture, bringing in a consulting team with specializations
    in data warehousing, data integration, or anything with the words “data” and “migration”
    in it might be the way to go. Again, this might only be a quick fix for a much
    lengthier initiative that needs full-time commitment, but—if you are willing to
    outsource your team to a third party and don’t mind footing the bill—it does substitute
    for direct employee support.


    #### Posting to Job Boards


    Posting to a job board is probably the number one method for companies with do-it-yourself
    recruiting, and it does have its strengths. But there is also a bit of effort
    from your end to ensure the various applicants truly fit the role and haven’t
    exaggerated on their resume. We advise that you post your jobs to multiple locations
    and to the ones that have good reputations for vetting their candidates. There
    are a lot of free posting sites with which you can start. Try [www.betterteam.com/job-posting-sites](http://www.betterteam.com/job-posting-sites)
    for a list of popular ones and see where your first posts will lead.


    #### Hiring a Recruiter


    Finding candidates can be a lengthy, time-consuming process. Rather than you doing
    the work, hiring a recruiter who will do it for you may be a better use of your
    time. They will post job descriptions to online boards, go through social media
    outlets, and arrange the next steps in the interview process. If you do decide
    to go this route, make sure you precisely cover the job descriptions and the required
    skills with the recruiter. Too often, I have heard of recruiters who perform mass
    mailings for job descriptions on LinkedIn, returning with a list of semiqualified
    candidates and then following up with them with only a partial explanation of
    what the organization meant. Four out of five times, this occurs because the organization
    did not know either. Simply stated, when working with a recruiter, be clear and
    precise on the type of integration skills and qualifications you need and check
    in often for status updates and clarifications.


    ### Networking


    Attending career fairs and showing up at recruiting events are other ways to find
    qualified job leads. This practice is solid advice to follow even when the position
    is not available yet but could be in the future. The person you meet today could
    be a top hire in the future, and keeping in touch with them can lead to many potential
    opportunities for them as well as your organization.'
