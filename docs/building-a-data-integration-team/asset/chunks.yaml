  trans: "\n### 聚会\n\n或许最好的起步方式是找到与你有共同兴趣的人。韦氏词典将“meetup”定义为“非正式的会面或聚会”。^(¹⁴⁸) 在 21\
    \ 世纪初，这个词成为了免费社交网络网站 `Meetup.com` 的代名词，该网站使用户能够在本地组织聚会。^(¹⁴⁹) `Meetup.com` 是结识新朋友、练习语言、授课或推广品牌的绝佳资源。你所选择的群组几乎涵盖所有话题。不过，如果你找不到心仪的话题，只需点击几下即可创建新群组。\n\
    \n### 加入 `Meetup.com`\n\n-   就我们当前的讨论而言，你需要使用数据相关的搜索词，例如“迁移”、“集成”、“分析”或“报告”。如果搜索结果中没有出现这些词，那么你可以考虑点击“Start\
    \ a new group”链接，并按照后续步骤来组织活动。\n-   访问“Meetup.com”，点击“Log in”链接（见图 9-5）。有通过 `Facebook`、`Google`\
    \ 或电子邮件注册的多种方式。验证通过后，你就可以开始探索你所在地区的群组和活动了。\n\n![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig5_HTML.jpg](img/486629_1_En_9_Fig5_HTML.jpg)\n\
    \n*图 9-5*  \n*`Meetup.com` 首页*\n\n> **注意**  \n> 聚会非常有趣，是结识志同道合者的好方法。但请务必小心。最初，我申请了十几个关于数据集成、数据仓库和报告的专题，期望能够参与所有的社交活动。结果证明，涉猎过广与选择不足一样糟糕。我建议你确定好优先事项以及聚会方式的目标，然后全力以赴去实现它。\n\
    \n### 社交活动\n\n尽管聚会既有趣又有教育意义，但它们往往比专业社交活动更偏重社交性。专业社交活动的目标更侧重于建立商业关系和信任，而不一定是为了提升你的社会地位、交换名片或寻找镇上下一场大型活动。^(¹⁵⁰)\
    \ 在这种情况下，专业社交可能涉及终生的关系。根据作者 Anders Ostlund 的一篇文章，^(¹⁵¹) 社交有许多好处：\n\n-   获取关于你通常可能无法接触到的产品或服务的知识和信息\n\
    -   被视为某个商业领域的主题专家\n-   建立新的专业关系并加强现有关系\n-   增加商业伙伴间的信任\n-   确保人们知道你是谁、你做什么、你怎么做以及你希望达成什么目标\n\
    -   将你和你的团队树立为权威\n\n专业社交是自我强化的。你可能向你的社交团体做了一次精彩的演示，而其中一位成员可能会反过来邀请你就该主题向另一个团体发言。这种多米诺骨牌效应可以带来更多关注者、更多活动的参与机会，并可能将你的团队提升为构建和维护迁移任务时的“首选”团队。从这项活动中培养出的众多技能——掌握闲聊技巧、分享内容、建立关系——将伴随你的整个职业生涯，并有助于提升你团队在市场中的品牌形象。\n\
    \n活动形式多样、规模各异，从贸易展销会到下班后的欢乐时光，再到会议（我们接下来将讨论）。开始的最佳方式是使用你喜欢的搜索引擎，输入“我所在地区的专业社交活动”这样的短语。你很可能会得到足够多的结果，让你忙上一阵子。\n\
    \n虽然专业社交可能更有利于性格外向的人，但如果你性格害羞或与陌生人见面感到不适，也请尽量出席。在某个时刻，谈话很可能会转向你擅长的领域，在那里你将有机会大放异彩，或者至少能分享一些关于你团队及其工作的知识。\n\
    \n### 会议\n\n会议可能是某个行业中最重要的社交活动，它具备专业社交的大部分好处。然而，这类聚会通常比本地活动规模更大、更复杂，举办频率较低，并且涉及演讲者、赞助商和其他代表，他们销售产品、提供教育和技术洞察。会议可能持续几天甚至一周。与所有优秀的社交活动一样，其目的是创造热情和灵感，让与会者在会议结束时感到受益匪浅。\n\
    \n尽管会议充满魅力、美食与格调，但人们参会的主要原因与其他社交活动相同，只是覆盖面更广。^(¹⁵²) 北美最重要的活动之一是 Salesforce 的年度\
    \ Dreamforce 会议，参与者超过 17 万人。^(¹⁵³) 面对如此庞大的数字，你有可能结识来自世界各地、各行各业的专业人士。会议激动人心，是让你融入行业的好方法。如果规划得当，参会收获将对指导你的集成团队、为下一步行动积蓄动力产生奇效。\n\
    \n当然，许多人参加会议时并没有明确的策略或意图。没错，可以社交，也可以借此从工作中抽身休息一下。如果那是你的目标，那也没问题。但为了真正的成长，你应该做的是推广你的团队、你的公司以及你提供的服务。带着这个职业目标去参会，收集大量名片，并为所代表的人与事感到自豪。\n"
- fmt: '# The Data Integration Roadmap


    If you’ve reached this point, then congratulations, you’re well on your way to
    having a flourishing integration team. The training classes and online videos
    are coming fast and furious, you have eager stakeholders with projects in mind,
    and the `ETL` jobs have never run so well nor been so optimized. So what’s next?


    In the previous chapter, we discussed the concept of continuous improvement and
    being able to improve our existing systems through the `Plan-Do-Check-Act` (`PDCA`)
    model. With the support and encouragement of our colleagues, we should be able
    to see what and where our integration systems are lacking and merge that with
    the top priorities the organization has in mind for future development. To take
    a simple example, imagine we have a request to upgrade delivery into the accounts
    receivable database, add fields to the contacts target system, and capture additional
    logging from two new data sources. I highlight these tasks in Figure 9-6.


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig6_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig6_HTML.jpg)


    **Figure 9-6** List of Tasks


    Right off the bat, we may be inclined to take the easiest one of these tasks and
    work on this first. But which one is it? Of course, we’d have to have a business
    analyst deep dive, talk with resources, and communicate the level of effort with
    developers. Even then, our calculations could be off a bit, and we would start
    working on one task, only to have a significant issue crop up with one of the
    other tasks, forcing us to drop our current task mid-development and then jump
    onto the next fire. Working on that one would do us no good in the long run as
    the first issue might be begging for our attention, and again, we’d have to shift
    effort, all the while ignoring the third task with project leads increasingly
    growing frustrated at our lack of concern.


    You can see the problem here. It’s not that we don’t have the work—we have lots
    of it—but that we don’t have the prioritization of the work. We took a subjective
    measure of what was the most comfortable to perform first and worked on it until
    a showstopping interruption occurred. Then we dropped what we were doing and set
    our priorities on that new issue until other stakeholders chimed in and we refocused
    back to the original problem. Of course, stakeholders should be able to allocate
    our priorities, but we can’t be all things to all people if our attention and
    (limited) resources are always in high demand.


    To bring normalcy to the chaos, we must strategize and determine what is our highest
    priority from an organizational standpoint. That is, regardless of the level of
    effort, what matters most to the accounts receivable team, or whether a system
    error brings down the contacts database, we must follow an integration roadmap,
    a strategic plan that communicates the short- and long-term integration system
    initiatives.


    Once we know what matters to the organization, knowing what to prioritize in terms
    of our next steps becomes more natural. Taking the earlier example, let’s say
    that the CEO announces at the company all-hands that the most crucial goal for
    the upcoming fiscal year is to ensure that service representatives improve their
    relationships with customers. Also important, but to a somewhat lesser degree,
    is for the Finance team to collect payments on time.


    If we return to our tasks from Figure 9-6, you can see how we can prioritize this.
    Ask yourself, based on your new organizational input, what we should be focusing
    on first, second, third, fourth, and so on. For example, we can take the top corporate
    priority “Improve relationships with customers” and decide that the most closely
    related integration task is “Add fields to the contacts target system.” The second
    priority, “Financial teams collect payments on time,” aligns very well with “Upgrade
    delivery into accounts receivable database.” That leaves our final task, “Capture
    additional logging from data sources,” as the lowest-level task on our list. Figure
    9-7 shows our reprioritized task list.


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig7_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig7_HTML.jpg)


    **Figure 9-7** List of Tasks, Reprioritized


    We’re not done yet. We now know the order of the activities on which we should
    be working, and we will do that. But we still need to reach out to teams and ask
    the question: How long? How long will the first task take? How long will the second?
    The third? And so on.


    It’s important to stress that we’re looking for an overall estimate, not the deep-dive
    understanding we previously attempted. Although we would like to be as accurate
    as possible, things inevitably happen, and the time will slip. Plus, there actually
    could be one or two critical fires that demand our attention, diverting us from
    the tasks for a brief time, but not enough to throw us off balance. What’s essential
    in our first pass of the roadmap is not the timing of *when*, but the order of
    *what*.


    Let’s say we estimate that the time to complete the contacts target system is
    two months, the upgrade to accounts receivable is one month, and the capture additional
    logging task is 15 days. Assuming we start on October 1 (the beginning of the
    fiscal year), we can add a timeline to our model, and our integration roadmap
    now looks like Figure 9-8.


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig8_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig8_HTML.jpg)


    **Figure 9-8** Prioritized Tasks and Time (Our Integration Roadmap)


    > **Note:** In many roadmaps with an agile model, we measure the timeline in terms
    of sprints. From our simple example, we can easily communicate the direction our
    team is going and the plan we have in mind. The best part is that we can justify
    our decisions based on the enterprise list of priorities and collaborate with
    our colleagues who own the source and target systems to let them know where in
    the queue we will address their tasks. Although we will not set these delivery
    dates in stone, they will make our shortlist, and as we’ve mentioned earlier,
    making the plan is half the battle.


    You may realize now why we saved discussing the roadmap for the end of our chapter
    on marketing. You must have your integration team and the processes in place,
    you must have the list of prioritized steps that your stakeholders can provide,
    and you must have C-level management recognize why your approach matters to the
    company as a whole. Otherwise, a sustainable roadmap will never come to fruition,
    and the team remains relegated to maintenance, patches, and the occasional upgrade.
    Only by reaching outward and getting the full support of the enterprise does actual
    expansion occur.'
