    \n# 9. Marketing Your Team\n\n> *Coming together is a beginning, staying together\
    \ is progress, and working together is success.*\n> \n> —Henry Ford^([^(134)](#fn134))\n\
    \n## Introduction\n\nAt this point in our journey, the integration team has set\
    \ up best practices and guidelines, deployed several projects, and established\
    \ monitoring and analytics systems and has some direction for creating and improving\
    \ future integration projects. We’ve hit a crossroads where we need to expand\
    \ our practice, and there’s one final thing you’ll need to consider: enterprise\
    \ participation.\n\nI mentioned much earlier in this book that you can have the\
    \ best bells and whistles on a software application, but if the data within that\
    \ application is incorrect, then none of those features matter. Bad input will\
    \ equal bad output. To continue that thought, you can have the best integration\
    \ system in the world, but if no one uses it, then it serves no purpose. Data\
    \ does not exist for data’s sake. It is used to answer analytic questions, make\
    \ better predictions, and discover previously unforeseen patterns. If the audience\
    \ posing these statements is absent, then you have no inertia to move forward,\
    \ no matter how optimal the process or the data may be.\n\nLack of user support\
    \ may not entirely rest on you. The process itself may have been designed with\
    \ the best intentions in mind, but your advertisement strategy hasn’t worked,\
    \ or it may not have the needed reputation, or users might misunderstand its purpose.\
    \ On the other hand, the process actually may be broken, in which case I encourage\
    \ you to go back to the previous chapters and reread steps for iterating on your\
    \ existing design and bringing it back into alignment with the enterprise vision.\
    \ In any case, don’t sell yourself short. Having the ability to grow the integration\
    \ platform is critical to reaching the next level of development.\n\nIn this chapter,\
    \ I’ll cover some of the essential aspects of marketing the work you’ve done and\
    \ positioning your team for successful growth. We’ll discuss how to address leadership,\
    \ educating your users, promoting through external events, building a roadmap\
    \ for the future, and defining your rules with a Data Governance Office. By the\
    \ end of this chapter, you should be in an excellent position to start reaching\
    \ out to end users and, at the very least, to have fresh ideas for inspiring a\
    \ team who is hungry for growth."
  raw: "## MDM\n\nAs its end goal, an MDM system should be able to consolidate data\
    \ from multiple system sources into a single view that can then be further retrieved\
    \ and refined by data teams. For example, if we chose to integrate our distinct\
    \ customer databases from Figure [8-10](#486629_1_En_8_Chapter.xhtml#Fig10) into\
    \ a single MDM repository table, we could track the complete set of fields (First\
    \ Name, Last Name, Middle Name, Nicknames, Address, Email, Phone Number, Fax,\
    \ and Age) (see Figure [8-11](#486629_1_En_8_Chapter.xhtml#Fig11)).\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig11_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig11_HTML.jpg)\n\
    \nFigure 8-11\n\nCommon CUSTOMER MDM View\n\nNote\n\nArchitects sometimes state\
    \ an MDM system when they really mean a data warehouse. It’s easy to get confused,\
    \ but there are slight discrepancies between the two, which I will not go into\
    \ here. Data warehousing tends to be standalone, while MDM is an extension of\
    \ the integration lifecycle. Read the article from Jim Harris found at [*https://blogs.sas.com/content/datamanagement/2017/04/27/mdm-different-data-warehousing/*](https://blogs.sas.com/content/datamanagement/2017/04/27/mdm-different-data-warehousing/)^([^(130)](#fn130))\
    \ for further clarification.\n\nBuilding an MDM can be challenging and spark contention\
    \ among teams,^([^(131)](#fn131)) but the benefits of reuse and standardization\
    \ can significantly increase response speeds, provide more flexible reporting,\
    \ and improve data quality. Customizable MDM tools from vendors such as IBM^([^(132)](#fn132))\
    \ and Dell Boomi^([^(133)](#fn133)) offer a single view of the data across the\
    \ enterprise and may be worth looking into if you want to stand up a solution\
    \ in a relatively short amount of time and with minimum coding effort.\n\n## Summary\n\
    \nIn this chapter, we have discussed the post-deployment operation of monitoring\
    \ and leveraging your log results to ensure a smooth transition into your next\
    \ activities. Whether you are fixing the existing issues in the short-term days\
    \ and weeks ahead or continuously improving your process across months and years,\
    \ your team will always be seeking out ways to minimize data errors, reduce downtime,\
    \ and further the understanding of where the team should be going next.\n\nIn\
    \ the next chapter, we’ll discuss how to spread the word and get the rest of the\
    \ enterprise involved in your efforts.\n\nFootnotes [1](#486629_1_En_8_Chapter.xhtml#Fn1_source)\
    \   [2](#486629_1_En_8_Chapter.xhtml#Fn2_source)   [3](#486629_1_En_8_Chapter.xhtml#Fn3_source)\
