    follow the same environmental structure as other software, that is, replicated
    each time for the Development, Staging, and Production platforms. However, one-time
    migration environments—applications and scripts that will only run once, migrating
    source data to target data for initialization—may only need to be created for
    a short time if teams allow it.


    The typical ETL architecture contains a source, an ETL middleware, and a target.
    This architecture is illustrated in Figure [7-2](#486629_1_En_7_Chapter.xhtml#Fig2).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig2_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    A Typical ETL Architecture


    In the one-time migration architecture, rather than replicating the ETL tool across
    all platforms, we create only one instance, called the ETL Staging. The only requirement
    for operating this instance is that we update the connection endpoints to each
    of the individual environments during our deployments. By using this technique,
    the ETL Staging serves as a loosely coupled system with all the benefits you would
    expect from that design, such as improved testability, less maintenance of code,
    and increased scalability (see Figure [7-3](#486629_1_En_7_Chapter.xhtml#Fig3)).^([^(108)](#fn108))


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig3_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    One-Time Migration Model


    Again, this use of the one-time model rests upon the decisions of the organization
    and security teams. Often, the platform housing the ETL tool might be an internal
    Virtual Machine (VM). If you have not cleared those VMs to touch production data,
    then you would indeed have to replicate your application and corresponding scripts
    into a more secure environment, like that shown for repeatable integrations (see
    Figure [7-4](#486629_1_En_7_Chapter.xhtml#Fig4)).


    ### Environments for Repeatable Integrations


    The repeatable integration is a special kind of beast in that it both (a) points
    to a specific source and target endpoint and (b) is itself a script that requires
    different versions. If you recall, a repeatable integration is one that continuously
    updates data based on a web service trigger or scheduled time, such as once per
    evening, once per week, or once per month. These are less load intensive than
    one-time migration feeds and usually less complex in structure. Yet they also
    occur more frequently in organizations and require monitoring and operational
    support should any issues be detected.


    Depending on their structure, the ETL tools associated with repeatable integrations
    will need to be installed on specialized VMs and released into their corresponding
    environments (Development, Staging, and Production) alongside any other software
    builds ready for deployment (see Figure [7-4](#486629_1_En_7_Chapter.xhtml#Fig4)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig4_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Repeatable Integration Architecture


    ### DevOps Practices: A Sample Deployment


    So far, we’ve focused on environments, architecture, and deployment. What, you
    may ask, does any of this have to do with platform automation (the title of this
    chapter)? Well, to start discussing automation, we’re going to briefly touch upon
    DevOps, which has automation as one of its core goals.


    According to Ernest Mueller, blogger for *The Agile Admin*, DevOps is defined
    as “the practice of operations and development engineers participating together
    in the entire service lifecycle, from design through the development process to
    production support.”^([^(109)](#fn109)) He admits this is a rather broad definition
    and clarifies the following three practices that we usually discuss in the context
    of DevOps:


    *   Infrastructure Automation: Creating your systems, configurations, and application
    deployments through automation code


    *   Continuous Delivery: Building, testing, and deploying your apps in a fast
    and automated manner


    *   Site Reliability Engineering: Operating your systems, monitoring and orchestrating,
    and designing for operability


    We’re going to focus on the first of those practices, Infrastructure Automation,
    to test how we can pull data through sequentially running workstreams so that
    we can deliver a complete source-to-target deployment in a matter of minutes.
    It’s not going to be complicated, and it will demonstrate just how effective an
    automated integration can be.


    #### Our Architecture


    The following diagram shows the sample architecture we have in mind, installed
    across three separate environments (see Figure [7-5](#486629_1_En_7_Chapter.xhtml#Fig5)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig5_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    ETL Design for Platform Automation


    What you see in Figure [7-5](#486629_1_En_7_Chapter.xhtml#Fig5) is a sample design
    of how our ETL tool would operate across each of the different environments we’ve
    discussed. New to this diagram is the label for *Orchestration Engine/Scheduling
    Tool*, a software application that coordinates the sequencing of steps and activities
    according to a defined business process model.^([^(110)](#fn110)) An orchestration
    engine can be part of a software package or installed externally, as with Jenkins,
    an open source automation tool that continuously builds and tests software projects.^([^(111)](#fn111))
    If a tool like Jenkins is not available, then we could substitute by using scheduling
    tools like Microsoft Task Scheduler, crontab for Mac, or cron for Linux.


    Consider this architecture a logical representation, however. To simplify things,
    we’re only going to install one instance of the ETL tool (the PDI from the previous
    chapter) on the local computer. Also, the three environments are different path
    names and not separate VMs. Regardless, this type of structure should be enough
    to simulate the kind of partitioning we’re trying to achieve.


    In our demonstration, I’m using Windows and will forgo installing Jenkins instead
    of utilizing the built-in Task Scheduler. macOS and Linux users can follow along
    at their own pace or, if you’re familiar with Jenkins, you can set up an experimental
    testbed.'
  trans: '

    #### 生产环境


    生产环境是每个创意项目的心血所在，从每一次代码更新到测试结果都汇聚于此。分布式构建在此运行，因此，只有在向用户发布新版本时才应触及它。否则，客户会发现因软件设计粗糙而产生的任何问题，而如果问题足够严重，企业将既损失金钱，也损害声誉。


    由于生产环境对公众开放，对有缺陷软件的部署应严格控制，发布权限仅限少数人。任何计划中的部署都应提前（至少两周）向相关方公布，包括时间、日期以及对同时运行进程的影响。发布经理还应在部署当天发送邮件，告知部署开始时间，并在部署完成后通知部署已结束。


    ### 一次性迁移的环境


    我们的 ETL 应用程序及相应脚本可视为一种构建工具，应遵循与其他软件相同的环境结构，即为开发、预发布和生产平台分别进行复制。然而，一次性迁移环境——即那些只运行一次、将源数据迁移至目标数据以完成初始化的应用程序和脚本——如果团队允许，可能只需创建较短时间即可。


    典型的 ETL 架构包含一个源端、一个 ETL 中间件和一个目标端。该架构如图 7-2 所示。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig2_HTML.jpg](img/486629_1_En_7_Fig2_HTML.jpg)


    图 7-2

    典型的 ETL 架构


    在一次性迁移架构中，我们并非在所有平台上复制 ETL 工具，而是仅创建一个实例，称为 ETL 预发布环境。运行此实例的唯一要求是，在部署过程中更新指向各个独立环境的连接端点。通过使用此技术，ETL
    预发布环境成为一个松散耦合的系统，具备该设计所带来的所有优势，例如可测试性提升、代码维护减少以及可扩展性增强（见图 7-3）。^((108))


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig3_HTML.jpg](img/486629_1_En_7_Fig3_HTML.jpg)


    图 7-3

    一次性迁移模型


    再次强调，一次性模型的这种使用方式取决于组织和安全团队的决定。通常，承载 ETL 工具的平台可能是内部虚拟机（VM）。如果这些虚拟机未经授权接触生产数据，那么您确实需要将应用程序及相应脚本复制到更安全的环境中，如可重复集成的环境所示（见图
    7-4）。


    ### 可重复集成的环境


    可重复集成是一种特殊的存在，因为它既（a）指向特定的源端和目标端点，又（b）本身是需要不同版本的脚本。回忆一下，可重复集成是指那种基于 Web 服务触发器或预定时间（如每晚一次、每周一次或每月一次）持续更新数据的集成。它们的负载强度低于一次性迁移数据馈送，结构通常也较简单。然而，它们在组织中出现得更为频繁，一旦检测到任何问题，就需要监控和运维支持。


    根据其结构，与可重复集成相关的 ETL 工具需要安装在专门的虚拟机（VM）上，并与其他准备部署的软件构建一同发布到相应的环境（开发、预发布和生产）中（见图
    7-4）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig4_HTML.jpg](img/486629_1_En_7_Fig4_HTML.jpg)


    图 7-4

    可重复集成架构


    ### DevOps 实践：一个部署示例


    到目前为止，我们重点讨论了环境、架构和部署。您可能会问，这些与平台自动化（本章标题）有什么关系？好吧，为了开始讨论自动化，我们将简要提及 DevOps，而自动化正是其核心目标之一。


    根据 《敏捷管理员》博客作者欧内斯特·米勒的定义，DevOps 是“运营工程师和开发工程师共同参与整个服务生命周期，从设计到开发过程再到生产支持”的实践。^((109))
    他承认这是一个相当宽泛的定义，并澄清了我们在 DevOps 上下文中通常讨论的以下三个实践：


    *   **基础设施自动化**：通过自动化代码创建系统、配置和应用程序部署

    *   **持续交付**：以快速、自动化的方式构建、测试和部署您的应用程序

    *   **站点可靠性工程**：运维系统、监控和编排，并为可操作性进行设计


    我们将重点讨论第一个实践——基础设施自动化，以测试如何通过顺序运行的工作流拉取数据，从而在几分钟内完成从源到目标的完整部署。这并不复杂，并且将展示自动化集成是多么高效。


    #### 我们的架构


    下图展示我们设想的示例架构，该架构安装在三个独立的环境中（见图 7-5）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig5_HTML.jpg](img/486629_1_En_7_Fig5_HTML.jpg)


    图 7-5

    用于平台自动化的 ETL 设计


    图 7-5 展示了一个示例设计，说明我们的 ETL 工具将如何在之前讨论过的每个不同环境中运行。此图新增了一个标签：**编排引擎/调度工具**，这是一个根据定义好的业务流程模型协调步骤和活动顺序的软件应用程序。^((110))
    编排引擎可以是软件包的一部分，也可以像 Jenkins 那样作为外部安装的开源自动化工具，持续构建和测试软件项目。^((111)) 如果没有 Jenkins
    这类工具，我们可以使用调度工具替代，例如 `Microsoft Task Scheduler`、用于 Mac 的 `crontab` 或用于 Linux 的
    `cron`。


    然而，请将此架构视为一种逻辑表示。为了简化，我们只会在本地计算机上安装一个 ETL 工具实例（上一章中的 PDI）。此外，这三个环境是不同的路径名，而非独立的虚拟机。尽管如此，这种结构类型应该足以模拟我们试图实现的那种分区。


    在我们的演示中，我将使用 Windows 系统，并放弃安装 Jenkins，转而使用内置的 `Task Scheduler`。macOS 和 Linux 用户可以按自己节奏跟进，或者，如果您熟悉
    Jenkins，可以搭建一个实验性测试平台。

