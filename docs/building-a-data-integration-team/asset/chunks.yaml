    \nFigure 7-25\n\nDouble-Click Active Tasks\n\nYou can confirm the job has executed\
    \ successfully by examining the upper pane of the Task Scheduler, searching for\
    \ your activity, and scrolling to the Last Run Result.\n\nThis final confirmation\
    \ may not be enough for you, and you may be wondering what else there is. There’s\
    \ a lot you can do, most of it based on the customer requests for success and\
    \ error handling. For example, with many of the integrations we deliver, we configure\
    \ emails to be distributed on both successful completion and failure. Furthermore,\
    \ instead of entering the ETL command-line interface (CLI) tool in the New Action\
    \ window as we did in our example, our teams often prefer to call a wrapper script\
    \ that triggers the ETL CLI activity, thereby keeping the code easier to modify\
    \ should we change tools or processes. These are just a few of the things you\
    \ can do with your scheduled jobs, and your ETL tools should have the ability\
    \ to support much more.\n\n## Summary\n\nThis chapter has introduced you into\
    \ the world of deployment, automation, and scheduling. After learning some of\
    \ the distinctions among Development, Staging, and Test platforms, we demonstrated\
    \ how we could configure our prototype to be flexible to work in any environment,\
    \ adaptable to include as many file types as needed, and repeatable to be set\
    \ to trigger every 5 minutes. Most of the ETL products on the market today, as\
    \ well as those built from scripts, should be able to handle these types of contingencies,\
