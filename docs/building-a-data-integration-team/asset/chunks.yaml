  trans: '

    # 数据集成路线图


    如果你已经读到这里，那么恭喜你，你的集成团队正在蓬勃发展。培训课程和在线视频接踵而至，利益相关者满怀期待地带着项目计划，而`ETL`作业的运行从未如此顺畅且优化。那么，下一步是什么？


    在上一章中，我们讨论了持续改进的概念，以及通过`计划-执行-检查-处理`（`PDCA`）模型来改进现有系统的方法。在同事的支持和鼓励下，我们应该能够看到集成系统在哪些方面存在不足，并将这些不足与组织对未来发展的最高优先级结合起来。举个简单的例子，假设我们收到一个请求：升级应收账款数据库的交付功能、为联系人目标系统添加字段，并从两个新的数据源中捕获额外的日志。我在图
    9-6 中重点列出了这些任务。


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig6_HTML.jpg](img/486629_1_En_9_Fig6_HTML.jpg)


    **图 9-6** 任务清单


    一开始，我们可能会倾向于选择这些任务中最简单的一个，并优先处理它。但哪个才是最简单的呢？当然，我们需要业务分析师深入调研，与相关人员沟通，并与开发者商定工作量。即便如此，我们的估算也可能出现偏差，于是我们开始处理一个任务，结果另一个任务却突然出现重大问题，迫使我们中途放弃当前任务，转而扑向新的“火情”。从长远来看，这样处理问题毫无益处，因为第一个问题可能仍在等待我们解决，于是我们不得不再次转移精力，而第三个任务则一直被忽略，项目负责人也因我们的缺乏关注而越来越沮丧。


    你可以看到问题所在。并不是我们缺乏工作——我们有很多工作——而是我们缺乏工作的优先级排序。我们主观地选择了一个最容易先完成的任务，然后一直处理它，直到出现一个阻碍性的中断事件。接着我们放下手头的工作，将优先级转向这个新问题，直到其他利益相关者介入，我们又重新聚焦回最初的问题。当然，利益相关者应该能够分配我们的优先级，但如果我们的注意力和（有限的）资源总是供不应求，我们就无法满足所有人的需求。


    为了从混乱中恢复秩序，我们必须制定策略，并从组织的角度确定最高优先级。也就是说，无论工作量大小，无论应收账款团队最关心什么，或者系统故障是否会导致联系人数据库崩溃，我们都必须遵循一个集成路线图，这是一份传达集成系统短期和长期举措的战略计划。


    一旦我们了解了组织最关心什么，确定下一步工作的优先级就会变得更加自然。沿用前面的例子，假设 CEO 在公司全体会议上宣布，下一财年最重要的目标是确保服务代表改善与客户的关系。另一个同样重要、但程度稍低的目标是让财务团队按时收款。


    如果我们回到图 9-6 中的任务，你可以看出如何对它们进行优先级排序。问问自己，根据新的组织输入，我们应该优先关注什么，其次是第二、第三、第四等等。例如，我们可以将公司最高优先级“改善与客户的关系”作为依据，并确定与之最相关的集成任务是“为联系人目标系统添加字段”。第二优先级“财务团队按时收款”则与“升级应收账款数据库的交付功能”非常吻合。剩下的最后一个任务“从数据源捕获额外的日志”就成了清单中优先级最低的任务。图
    9-7 展示了重新排序后的任务清单。


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig7_HTML.jpg](img/486629_1_En_9_Fig7_HTML.jpg)


    **图 9-7** 重新排序后的任务清单


    我们还没有完成。现在我们知道应该按什么顺序处理工作，并会照此执行。但我们仍然需要联系各团队并询问一个关键问题：需要多长时间？第一个任务需要多久？第二个呢？第三个呢？以此类推。


    需要强调的是，我们寻求的是整体估算，而不是之前尝试的深入理解。虽然我们希望尽可能准确，但事情总会发生，时间会因此延后。此外，确实可能有一两个关键性“火情”需要我们关注，从而暂时将我们从任务中转移，但不足以使我们完全偏离轨道。在路线图的初步规划中，重要的不是*何时*完成，而是*做什么*的顺序。


    假设我们估算完成联系人目标系统需要两个月，升级应收账款数据库需要一个月，而捕获额外日志的任务需要 15 天。假设我们从 10 月 1 日（财年开始）开始，那么我们可以为模型添加一个时间线，我们的集成路线图现在如图
    9-8 所示。


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig8_HTML.jpg](img/486629_1_En_9_Fig8_HTML.jpg)


    **图 9-8** 优先级任务与时间线（我们的集成路线图）


    > **注意：** 在许多采用敏捷模型的路线图中，我们以冲刺（sprint）来衡量时间线。通过这个简单的例子，我们可以轻松地传达团队的前进方向以及我们制定的计划。最棒的是，我们可以根据企业的优先级列表来证明我们的决策是合理的，并与拥有源系统和目标系统的同事协作，让他们知道我们将在队列的哪个位置处理他们的任务。虽然我们不会将这些交付日期视为一成不变，但它们将进入我们的候选清单，正如我们之前提到的，制定计划本身就是成功的一半。


    你现在可能明白了为什么我们要把路线图放在本章关于市场推广的末尾来讨论。你必须先建立好集成团队和流程，你必须拥有利益相关者提供的优先级步骤清单，并且你必须获得
    C 级管理层对你方法对整个公司重要性的认可。否则，一个可持续的路线图将永远无法实现，而团队也只能局限于维护、修补和偶尔的升级工作。只有向外拓展并争取企业的全力支持，才能真正实现扩展。

    '
- fmt: '# Data Governance and the Data Governance Office


    As our last topic, let’s discuss data governance (DG) and the Data Governance
    Office (DGO). I won’t go into too much detail as both these subjects would fill
    an entire book, but I do think it’s worth mentioning since organizations so closely
    intertwine data integration and teamwork with them.^([^(155)](#fn155))


    Data Governance has multiple meanings, but the one I like is “a set of principles
    and practices that ensure high quality through the complete lifecycle of your
    data.”^([^(156)](#fn156)) In short, an organization’s data governance framework
    lays out the rules (laws) for how employees should manage data within that organization.
    For example, there may be a specific time that service accounts can go and manipulate
    data in Production. Anything outside that time is forbidden. Or viewing Personally
    Identifiable Information (PII) such as credit card numbers is off-limits. Of course,
    any violation of these rules is subject to punitive action, including suspension
    and termination.


    The benefits of proper data governance are many, but in the world of integration,
    it means cleaner data, better analytics, better reports, and better decisions.
    Not having data governance in an organization is like not having a sheriff in
    an Old West town: you can do it if everyone behaves. Once the gunfighters show
    up, all bets are off.^([^(157)](#fn157))


    Although creating a data governance framework may be easy to understand, putting
    it into practice is much more difficult. For one, many companies do not have the
    technology in place or lack the data “maturity” to reach a state where the data
    can be appropriately governed (see the DMM from Chapter [8](#486629_1_En_8_Chapter.xhtml)).
    Second, data governance may sound like an IT initiative since, after all, IT teams
    are usually the ones who manipulate the data, but it requires many departments
    to agree to its principles. Management, finance, sales, procurement, and legal
    are just some of the groups that need to safeguard the in-house data and, therefore,
    must have a say in processes associated with ownership, accessibility, security,
    quality, and knowledge (see Figure [9-9](#486629_1_En_9_Chapter.xhtml#Fig9)).
    Achieving their routine consensus and then ensuring teams remain compliant are
    just two of the many issues that challenge proper data governance.


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig9_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig9_HTML.jpg)


    **Figure 9-9** Data Governance Global View^([^(158)](#fn158))


    Rather than let the data rules run wild, organizations have established a Data
    Governance Office (DGO), an internal group that defines how to effectively use
    data resources. The DGO members interpret the use of the governance framework
    and data management, the actions to take against individuals who violate them,
    and the peers in their departments to consult when questions or concerns about
    this data arise.


    The DGO is one of the more cutting-edge departments in an organization, but also
    critical for helping the integration team collaborate and define their role with
    others. Many potential violations on source system usage or transformation business
    rules that would usually take weeks to resolve are settled quickly by action from
    the DGO. For that reason, they make the ultimate contribution in promoting good
    integration data governance and should be one of the first groups consulted when
    deciding your roadmap priorities and determining how best to handle the data.


    ## Summary


    We’ve reached the end of this chapter and—surprise, surprise—the end of this book.
    And where are you now? You have your alliances and supporters within and outside
    the organization, a roadmap for the future, and a coordinated data governance
    policy with DGO representation. Getting there was tough, but the hardest parts
    should now be behind you. There’s probably a laundry list of next steps you’ll
    want to take to expand even further, but the tools you need to make this happen
    are already within your grasp. You have a team, a process, a plan, and, perhaps
    most importantly, enough time in your day to establish realistic timelines with
    few surprises and even fewer disappointments.


    All that you encounter next will be a significant change from where you first
    started. You have most, if not all, of the recipes and steps you need to be successful
    with your integration projects, and where you decide to go next is up to you.
    The next time a project manager approaches you, claiming that all your team needs
    to do for migration is “push a few buttons” over a weekend, you’ll know how to
    formulate the plan that will make order out of the swirl that is data integration.
    Now it’s time to get out there and to build that team. I wish you all the best.'
