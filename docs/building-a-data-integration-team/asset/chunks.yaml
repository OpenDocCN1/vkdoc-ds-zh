    \ Only in the new light of day and application is it noticeable.\n\nHere are some\
    \ of the common complaints you’ll receive and how to solve them. This list is\
    \ not complete but should cover most of the items that will come your way:\n\n\
    *   Complaint: “The field is missing.”\n    *   What to Do: Start with looking\
    \ at the ETL code and confirm that, yes, the field is missing. Open the latest\
    \ version of the Source-to-Target Mapping and see if the value was on the list\
    \ for migration/integration.\n\nNote\n\nInvariably, you’ll encounter data stewards\
    \ who will want to know why a particular field was not transformed the way it\
    \ should be or why it was omitted when it should have been included. If done right,\
    \ your STTM will contain notes on why fields were adjusted from their original\
    \ designation, the data owner who made that request, and who approved it. In all\
    \ honesty, there is nothing as satisfying as that moment when you recount to the\
    \ data stewards that *they* were the ones who requested to modify the field in\
    \ the first place, followed by the reasons why and the exact date.\n\nAnd, yes,\
    \ there is always the possibility that the integration team missed a field. In\
    \ those cases, you’ll want to prepare for an emergency update to take place as\
    \ soon as you get signoff from management (see “Updating Production” later in\
    \ this chapter).\n\n*   Complaint: “The data is transformed incorrectly.”\n  \
    \  *   What to Do: Again, this is one for review and research. The STTM should\
    \ have all the details you need in the Transformation Rules field. If you find\
    \ that, indeed, the actual data does not match with the blueprint, then work with\
    \ your ETL developers to figure out why and what happened. It could be incorrect\
    \ code, missed exception logic, or something entirely unexpected that interrupted\
    \ sequencing during migration. Once you’ve found the root cause, make the fix\
    \ on your ETL code and go through the documentation-fix cycle along with testing.\
    \ Once it’s working, redeploy your ETL code and work with teams to update the\
    \ incorrectly transformed Production data.\n\n*   Complaint: “The ETL is broken/didn’t\
    \ run.”\n    *   What to Do: The ETL not running correctly is one we hear a lot\
    \ from the target data owners who, inundated with tickets, are trying to make\
    \ sense of why the data from the previous night’s run hasn’t shown up where they\
    \ expect it to be. Fortunately, you’ll have previous execution logs at your disposal\
    \ and can either confirm or deny the possibility. If the ETL job failed to execute\
    \ on schedule, figure out the cause. If it was a minor glitch or due to temporary\
    \ failure, submit a response ticket to rerun the job on demand or, if preferred,\
    \ on schedule. If the cause was something more serious, like the ETL triggered\
    \ an error and ended the job abruptly, then proceed back to the code and, using\
    \ execution logs and a testing environment, reproduce the issue. Once found, continue\
    \ in the usual way with updating the documentation and performing the patch in\
    \ Production."
  trans: "\n### 支持级别\n\n除非你供职于一家资源匮乏的小公司，否则集成团队通常不会处于服务台支持的前端。对于中大型组织来说，处理错误和类似投诉的角色通常会进行分层，而集成团队将免受其中大部分问题的干扰（见图\
    \ 8-1）。博主乔·赫特维克曾撰文介绍不同支持级别的入门知识：^(¹¹⁶)\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig1_HTML.jpg](img/486629_1_En_8_Fig1_HTML.jpg)\n\
    \n**图 8-1** 服务台支持级别\n\n*   **0 级支持**：用户无需额外帮助即可自行访问的在线、电话或类似的自助解决方案。对于你的集成项目，在此级别预期会遇到的电话类型包括需要重置密码的用户，或希望访问知识库以了解新版本如何影响其旧数据的用户。\n\
    \n*   **1 级支持**：此级别负责筛选入站的服务台电话，并提供基础支持与故障排除。1 级技术人员将收集并分析用户问题，确定后续步骤，例如判断这是否是与先前修复重复的问题、工单路由，以及升级至\
    \ 2 级或 3 级支持。1 级支持通常是处理有关集成产品和流程的任何投诉的第一线，并且应获得一份针对常见问题（这些常见问题有即时回复）的指令清单，例如解释一项取代了“按\
    \ ID 搜索”功能的新“按姓名搜索”功能。1 级支持还应了解你的生产环境停机时间（见“生产环境问题”），并在呼叫者遇到网络相关问题时手头掌握详细信息。\n\
    \n*   **2 级支持**：在某些组织中，2 级支持负责用户设备支持，如笔记本电脑、台式机和平板电脑，但也可能与 3 级支持分担工作。2 级支持处理任何与设备相关的投诉，例如配置问题、故障排除、软件安装和硬件维修。他们接收来自\
    \ 1 级支持的一线请求，并根据服务台自身技能或能力的运作方式，可能需要进一步升级到 3 级支持。集成项目如何影响 2 级支持的一些例子包括：用户需要安装特定产品以访问报表仓库，或者希望请求额外的驱动器空间以增加导出的数据量。\n\
    \n*   **3 级支持**：3 级是负责配置和修复服务器、网络、文件共享及基础设施问题的支持团队。3 级工单很可能是你的团队会面对的，因为任何集成和数据移动问题都属于基础设施范畴。当这些电话进来（通常通过\
    \ 1 级或 2 级升级），你将需要掌握重要的故障排除信息，例如涉及的记录、用户出错时登录的是哪个系统或项目、收到的错误信息（如果有），以及预期的结果是什么。由于团队希望优先处理影响最大的问题，评估严重程度（低、中、高、严重故障）也会很有用。请记住，用户的紧迫感意味着你遇到的许多问题将被标记为“严重故障”，即使实际情况并非如此。\n\
    \n*   **4 级支持**：虽然不常用作内部服务台层级，但 4 级在数据集成领域有其用武之地。4 级指的是与你的团队直接合作或签订了特定服务合同的硬件和软件供应商。如果\
    \ 3 级团队收到的服务工单是由于 ETL 软件或其他你无法控制的组件出现内部错误，你可能需要联系你的供应商（4 级），并通过其服务台处理该问题。问题解决时间应在合同的**服务级别协议（SLA）**中设定，并且保留你的客户代表的联系方式至关重要，以防你未能获得及时的响应。尽管问题可能正在由其他人调查，但最终责任归属集成团队。请不要忽视它。\n\
    \n### 常见的集成投诉与解决方案\n\n在第一天，你会遇到一些投诉，其中一些你可以解决，另一些则超出你的控制范围。请阅读所有收到的请求，并指派合适的人进行相应的调查。你的职责范围专门针对中间件\
    \ ETL 工具，因此，如果问题纯粹出在数据上——源系统中看似正确的字段实际上充满了拼写错误，你则需要将工单升级回源/目标系统。只有在新的应用环境和光照下，这些问题才变得明显。\n\
    \n以下是你将收到的一些常见投诉及其解决方法。此列表并不完整，但应涵盖你将遇到的大部分项目：\n\n*   **投诉**：“字段缺失。”\n    *  \
    \ **做法**：首先查看 ETL 代码，确认该字段确实缺失。打开最新版本的源到目标映射文档，查看该值是否在迁移/集成的列表中。\n\n    > **注意**\n\
    \    > 你总会遇到数据管理员，他们想知道为什么某个字段没有按预期方式进行转换，或者为什么本应包含的字段却被遗漏了。如果操作得当，你的源到目标映射文档（STTM）将包含关于字段为何偏离原始指定、提出该请求的数据所有者以及谁批准了该请求的注释。说实话，没有什么比当你向数据管理员复述，*他们*\
    \ 才是最初要求修改该字段的人，并说明原因和确切日期时更令人满足的了。\n    >\n    > 并且，是的，集成团队遗漏字段的可能性始终存在。在这种情况下，你需要准备好在获得管理层批准后尽快进行紧急更新（参见本章后面的“更新生产环境”）。\n\
    \n*   **投诉**：“数据转换错误。”\n    *   **做法**：同样，这需要审查和研究。源到目标映射文档（STTM）应在“转换规则”字段中包含你需要的所有细节。如果你发现实际数据确实与蓝图不匹配，那么请与你的\
    \ ETL 开发人员合作，找出原因并查明发生了什么。可能是错误的代码、遗漏的异常逻辑，或者是某些完全出乎意料的情况中断了迁移过程中的顺序。一旦找到根本原因，在你的\
    \ ETL 代码中进行修复，并经历文档-修复循环以及测试。一旦运行正常，重新部署你的 ETL 代码，并与团队合作更新转换错误的生产数据。\n\n*   **投诉**：“ETL\
    \ 损坏/未运行。”\n    *   **做法**：ETL 未能正确运行是我们从目标数据所有者那里经常听到的问题，他们被工单淹没，试图弄清楚为什么前一晚运行的数据没有出现在他们期望的位置。幸运的是，你可以使用之前的执行日志来确认或否认这种可能性。如果\
    \ ETL 作业未能按计划执行，请查明原因。如果是一个小故障或由于临时失败所致，则提交一个响应工单，要求按需重新运行作业，或者如果愿意，可按计划运行。如果原因更严重，例如\
    \ ETL 触发错误并突然终止了作业，那么请返回代码，使用执行日志和测试环境重现该问题。一旦找到问题，按常规方式更新文档并在生产环境中执行补丁。\n"
- fmt: "*   Complaint: \"I don’t have information on what happened, but I know something\
    \ isn’t right with the data.\"\n    *   What to Do: \"Something not right with\
    \ the data\" is a common complaint as, for most people outside the immediate team,\
    \ the `ETL` process is mostly transparent. They don’t know about the source, the\
    \ target, the `ETL`, or any of the other architectural detail, but only that the\
    \ records they see don’t meet their expectations or memory. Consequently, without\
    \ conclusive evidence, this is a tough one to debug. Try to get as much information\
    \ as you can, look into all the possibilities (check the previous `ETL` execution\
    \ logs, investigate any additional duplicate errors that may have been reported,\
    \ ask the source and target data owners if any potential impacts might have caused\
    \ data issues). You initially may come up empty on a cause, but if it’s a legitimate\
    \ issue, it will crop up again. Hopefully, this time around, you’ll have more\
    \ information with which to work.\n\n### The Daily Data Log\n\nOne of the best\
    \ mitigators to identifying data issues ahead of your customers is to create a\
    \ Daily Data Log, a once-a-day document that takes the lines of logged data from\
    \ your `ETL` executions and consolidates it into a simple report that provides\
    \ summary statistics on the entire repeatable integration. The Daily Data Log\
    \ includes the process name, the time the first job ran, the time the job ended,\
    \ the total count of records passed, the total number of errors (if any), and\
    \ the category of these errors (Business versus Technical and then some; see Chapter\
    \ [7](#486629_1_En_7_Chapter.xhtml) for definitions). Sharing this document with\
    \ your data owners through a wiki, daily email, or reporting application will\
    \ quickly identify focal points and issues both your team and they might have\
    \ otherwise missed as well as provide a starting point for continuous improvement\
    \ within your organization. We’ll talk more about continuous improvement in the\
    \ next section.\n\n**Note**\n\nAlthough I recommend building a Daily Data Log\
    \ via scripts you have at your disposal, there are more professional solutions\
    \ on the market today. You can review application monitoring systems from various\
    \ vendors such as `Datadog`, `SmartBear`, `New Relic`, and `Atlassian`, to name\
    \ a few. These are worth looking into and provide excellent features that can\
    \ significantly boost your ability to find and fix problems.\n\n### Updating Production\n\
    \nYou should do your best to avoid changing your `ETL` code directly in Production.\
    \ During our discussion of technical debt (Chapter [7](#486629_1_En_7_Chapter.xhtml)),\
    \ I recommended that you build a strategy that allows you to provide parameters\
    \ for changing values rather than hardcoding. But sometimes it’s impossible to\
    \ avoid touching Production—there might be an emergency fix, some crippling piece\
    \ of code that brings down the database,^([^(117)](#fn117)) or some critical requirement\
    \ that was deemed inconsequential through the chain by everyone except the `CEO`\
    \ who now has gotten hold of Production. In that case, you’ll have to jump right\
    \ in. Do it methodically and consistently. I define a strategy I usually employ\
    \ in Figure [8-2](#486629_1_En_8_Chapter.xhtml#Fig2).\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig2_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig2_HTML.jpg)\n\
    \n**Figure 8-2** Production Update Flowchart\n\nSummary of steps:\n\n1.  Reach\
    \ out to your project manager or business stakeholder for approval; open a change\
    \ management ticket if necessary.\n2.  Update your project documentation—realign\
    \ the Source-to-Target mapping, make changes to the Data Migration Process Flow\
    \ Diagram and details, and communicate with your development team on required\
    \ changes, making sure you get a realistic `LOE`.\n3.  Iterate through your changes,\
    \ starting with the development environment, testing, deploying to staging, retesting,\
    \ and finally sharing any prototypes of fixes with those concerned.\n4.  Following\
    \ your company’s policies, send a notification to the affected teams on the cause,\
    \ workaround, expected impacts, and downtime of the Production server. Let them\
    \ know whom to contact in case they encounter issues with the new upgrade.\n5.\
    \  Perform the updates. When completed, send another notification to the affected\
    \ teams with the latest status as well as whom to contact in case of continued\
    \ issues. Most importantly, thank them for their patience and support in handling\
    \ the downtime.\n6.  If, for whatever reason, you cannot fix the issue, and it\
    \ is indeed a showstopper for the product, then you may have to roll back Production\
    \ to the copy immediately before the breakage. Yes, this is the worst-case scenario,\
    \ and no one wants this option, but it’s better than the nightmare scenario where\
    \ you accidentally wipe out data and cause incalculable harm to your systems.^([^(118)](#fn118))\n\
    \n## Week One: Post-deployment\n\nDuring that first week, you’ve probably made\
    \ a few tweaks to your `ETL` script and maybe a few emergency deployments (let’s\
    \ not hope too many). At this point, the users increasingly are becoming engaged\
    \ with the new system, and you hear both the pros and cons of the work your team\
    \ has done. Pay attention to this gossip and take notes. Sure, the system works,\
    \ but it can always be improved. That’s a goal about which we will need to start\
    \ thinking.\n\n### Planning Your Next Steps\n\nIf you’re keeping track of your\
    \ start and end times for each job, you’re going to start seeing some common patterns.\
    \ Perhaps there’s a job that runs too slowly at 2:00 a.m. or one that times out\
    \ under defined thresholds. Your users may not consider these major issues or,\
    \ at the most, will tolerate them with some grumbling. Although you may be inclined\
    \ to ignore the problem—if it ain’t broke to them, why fix it?—I recommend that\
    \ you persist in finding a solution. First, just because no one sees it as an\
    \ issue now doesn’t mean it won’t be in the future, especially if your source\
    \ and target systems are going to take on additional loads. Second, the more optimization\
    \ you can achieve in each load, the better you’ll be able to measure your integration\
    \ consistently without interruption. This optimization is critical in identifying\
    \ additional opportunities through a productivity concept known as continuous\
    \ improvement."
