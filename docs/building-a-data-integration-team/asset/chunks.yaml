- fmt: "| Source System | Source Object | Source Field | Target System | Target Object\
    \ | Target Field | Transformation Rule |\n| --- | --- | --- | --- | --- | ---\
    \ | --- |\n| `File` | `Contacts_year1.csv` | `id` | `SQLITE` | `BUYER` | `EXTERNALID`\
    \ | `'Contacts_year1' + Id` |\n| `File` | `Contacts_year1.csv` | `first_name`\
    \ | `SQLITE` | `BUYER` | `FIRST_NAME` | Direct Transformation |\n| `File` | `Contacts_year1.csv`\
    \ | `last_name` | `SQLITE` | `BUYER` | `LAST_NAME` | Direct Transformation |\n\
    | `File` | `Contacts_year1.csv` | `email` | `SQLITE` | `BUYER` | `EMAIL` | Direct\
    \ Transformation |\n| `File` | `Contacts_year1.csv` | `car_make` | `SQLITE` |\
    \ `BUYER` | `CAR_MAKE` | Direct Transformation |\n| `File` | `Contacts_year1.csv`\
    \ | `car_model` | `SQLITE` | `BUYER` | `CAR_MODEL` | Direct Transformation |\n\
    | `File` | `Contacts_year1.csv` | `car_color` | `SQLITE` | `BUYER` | `CAR_COLOR`\
    \ | Direct Transformation |\n| `File` | `Contacts_year1.csv` | `car_year` | `SQLITE`\
