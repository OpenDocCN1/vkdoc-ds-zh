    \   [9](#486629_1_En_2_Chapter.xhtml#Fn9_source)   [10](#486629_1_En_2_Chapter.xhtml#Fn10_source)\
    \   [11](#486629_1_En_2_Chapter.xhtml#Fn11_source)   [12](#486629_1_En_2_Chapter.xhtml#Fn12_source)\
