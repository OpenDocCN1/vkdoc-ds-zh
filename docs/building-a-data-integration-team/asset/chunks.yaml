  trans: '

    # 输出步骤


    在测试完整自动化之前，我们还有两个步骤需要检查。


    -   在 `job_infomotors` 页面，右键点击“选择目标表 buyer”步骤，然后选择“打开引用对象 ➤ 转换”。该流程将会打开。


    此步骤的目的是满足我们的数据迁移流程中指定的要求，这将在我们测试作业执行时作为一种完整性检查。此步骤完成了两项活动（参见图 7-13）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig13_HTML.jpg](img/486629_1_En_7_Fig13_HTML.jpg)


    图 7-13 – “选择目标表 buyer”流程


    第一个活动对 `InfoMotors BUYERS` 表执行了一个 `SELECT COUNT` 操作。`PDI` 日志会显示这个计数以供您查看。第二个 `SELECT`
    检索了 `BUYER` 数据集的所有字段，并将结果输出到一个名为 `BUYER.csv` 的 CSV 文件。与我们抽取步骤中的输入类似，此输出指向您相对环境中的
    `/output` 目录（参见图 7-14）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig14_HTML.jpg](img/486629_1_En_7_Fig14_HTML.jpg)


    图 7-14 – `BUYER.csv` 输出目录


    ## 回滚


    我们的最后一步是错误步骤。ETL 工具允许您控制异常逻辑的工作方式。在 ETL 领域，可能会发生两大类错误。第一类是技术错误，您会因其出现网络、基础设施或安全方面的问题而看到此错误。例如，当您尝试从一个离线的数据库检索信息，或者尝试使用旧密码登录系统时，就会捕获到技术错误。在这些情况下，您的
    ETL 将被编程为向网络、基础设施或数据库管理员报告错误原因、时间、日期以及任何其他可能有帮助的信息。


    第二类称为业务错误。如果预期应发生的工作流规则或需求没有发生，则会发生此错误。例如，如果一个字段本应只提供数字，但却包含了字母，就会触发业务错误。IBM 的命名标准以及我们在本书前面讨论过的变通方法是另一个业务错误的例子，尽管这种错误不会触发警报。鉴于数据可能“出错”的主观程度，业务错误通常比技术故障更难解决，您的团队将花费大量时间寻找消除数据问题的新方法。幸运的是，您持续改进
    ETL 逻辑、改进部署以及监控变更的策略（参见第 8 章）将会步入正轨，您的团队最终将在数据修复领域成为神枪手。


    目前，我们将保持回滚策略的简单性。任何错误，无论是技术错误还是业务错误，都会触发我们的脚本运行。像往常一样打开“错误回滚和警报”步骤，您会看到只有两个任务：从
    `BUYER` 表中删除所有记录，并向 `PDI` 发送一条包含以下消息的日志警报：`"An error occurred with the integration.
    Rolling back"`（参见图 7-15）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig15_HTML.jpg](img/486629_1_En_7_Fig15_HTML.jpg)


    图 7-15 – 错误回滚和警报步骤


    ## 测试自动化


    了解了这些步骤之后，现在是时候从头到尾运行我们的作业了。还记得我承诺过的一键点击吗？


    -   在 `job_infomotors` 主页面，点击运行按钮。将会打开一个“运行选项”页面。


    -   在“运行选项”页面上点击运行。


    （好吧，您可能会说这实际上是按了两次按钮。我们本章还没完全结束，所以请耐心等待。）


    如果一切按预期运行，您的作业流应该会从头到尾贯穿整个流程。也就是说，我们满足了数据迁移流程和源到目标映射中所述的要求，并与我们数据迁移计划的目的和未来状态保持一致。只需按两次按钮就能完成这么多工作。


    如果您查看执行结果日志窗格，您会看到触发的不同工作流，以及读写计数、警报和持续时间。这个日志窗格是您经常在 `PDI` 中使用的功能，但任何物有所值的 ETL
    系统都会提供类似的报告标准（参见图 7-16）。


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig16_HTML.jpg](img/486629_1_En_7_Fig16_HTML.jpg)


    图 7-16 – 执行结果日志面板


    根据我的日志，我们在不到 2 秒的时间内加载了 687 条记录。即使我们仍然多按了一次按钮，这个时间也不错。


    如果您想查看我们加载并随后从数据库表中提取的记录，请导航到 `chapter7/development/output` 目录并打开 `BUYER.csv`
    文件。

    '
- fmt: "### Testing\n\nBefore setting up our scheduled ETL, we have one last topic\
    \ to discuss: testing. In the DevOps world, we should automate testing, and, to\
    \ be truthful, it can involve some heavy-duty operations. Development and test\
    \ automation engineers need to work together to develop test scripts, maximize\
    \ test coverage of the coded scripts, and, by using a variety of CI/CD tools,\
    \ generate test scripts, deploy them, and run them in a continuous cycle.^([^(113)](#fn113))\n\
    \nGoing headlong into automated testing is outside the scope of this book. Suffice\
    \ to say, what we want to do is find a way to run our tests quickly and to ensure\
    \ that we recover from them gracefully. To do that, we would want to extract data\
    \ that causes Technical and Business Errors, and we could then observe how our\
    \ system reacts to the issue. Ideally, this would all be done behind the scenes,\
    \ using a Test environment, scripts, and data built for this purpose.\n\nInstead\
    \ of going through those motions, we’re going to do our testing old school style\
    \ by opening a CSV file in our input directory, changing one value in our data\
    \ script to make it invalid, and rerunning our job. That’s it. So if you’re ready,\
    \ do the following steps:\n\n1. In your `chapter[7](#486629_1_En_7_Chapter.xhtml)\\\
    development\\input` directory, open the file `Contacts_2016.csv` using Notepad\
    \ or through a favorite word processor such as Sublime, Notepad++, Vim, or TextPad.\
    \ I would avoid using Word, WordPad, or Excel since the change we want to make\
    \ is minor, and these applications can add characters and strip off values when\
    \ saving CSV files.\n\n2. Change the last value on the second row to `ABCDE` (see\
    \ Figure [7-17](#486629_1_En_7_Chapter.xhtml#Fig17))\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig17_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig17_HTML.jpg)\n\
    \n   Figure 7-17\n\n   Changing the CSV\n\n3. In PDI, rerun the `job_infomotors`\
    \ by clicking the Run button.\n\nIf all works as expected, the process flow will\
    \ start, but you will trigger an error on the `ETL source csv` step. The path\
    \ shown on the screen will be directed toward the `error rollback and alert` step\
    \ (see Figure [7-18](#486629_1_En_7_Chapter.xhtml#Fig18)).\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig18_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig18_HTML.jpg)\n\
    \nFigure 7-18\n\nETL source csv Error\n\nThe Execution Results Logging pane will\
    \ show the output from your job. You should see the alert message we programmed\
    \ (`An error occurred with the integration. Rolling back`) as well as the steps\
    \ that delete from the `BUYER` table.\n\nIf, at this point, you were to open the\
    \ `select target table buyer` step and run this process manually, you would see\
    \ from the log that the count of the table was zero, thereby confirming that the\
    \ table is empty (see Figure [7-19](#486629_1_En_7_Chapter.xhtml#Fig19)).\n\n\
    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig19_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig19_HTML.jpg)\n\
    \nFigure 7-19\n\nResults from the Select Buyer Table Post-error. Notice the Count\
    \ Equals 0\n\n## Job Scheduling\n\nAs a final step, we’re going to set this job\
    \ to run on demand and on schedule. Earlier, I wrote about using orchestration\
    \ engines like Jenkins or scheduling tools like Microsoft Task Scheduler for automating\
    \ our scripts. In this step, we’ll configure Task Scheduler to get our PDI job\
    \ to execute every 5 minutes. As mentioned, feel free to explore testing the job\
    \ executions using your preferred orchestration engine or scheduling tool.\n\n\
    1. Click the Windows Start icon and type the words `task scheduler`. Press Enter.\n\
    \n   Task Scheduler will start (see Figure [7-20](#486629_1_En_7_Chapter.xhtml#Fig20)).\n\
    \n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig20_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig20_HTML.jpg)\n\
    \n   Figure 7-20\n\n   Windows Task Scheduler\n\n2. Select the action labeled\
    \ `Create Task`.\n\n3. The Create Task window will open (see Figure [7-21](#486629_1_En_7_Chapter.xhtml#Fig21)).\
    \ On the General tab, enter the information in the fields provided:\n\n   * Name:\
    \ `Run Infomotors_ETL`\n   * Description: Whatever you prefer, but for knowledge\
    \ transfer purposes, I will usually be clear and not leave this field empty.\n\
    \   * Check `Run with highest privileges`\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig21_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig21_HTML.jpg)\n\
    \n   Figure 7-21\n\n   The General Tab\n\n4. Under Triggers, click the New button.\
    \ The New Trigger window will open (see Figure [7-22](#486629_1_En_7_Chapter.xhtml#Fig22)).\
    \ Enter your details here. For example, I chose to repeat my task every 5 minutes,\
    \ starting at midnight. You can choose whatever you like, of course, but preferably\
    \ something that won’t be more than an hour from the time you begin.\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig22_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig22_HTML.jpg)\n\
    \n   Figure 7-22\n\n   New Trigger\n\n5. Under Actions, click the New button.\
    \ The New Action window will open (see Figure [7-23](#486629_1_En_7_Chapter.xhtml#Fig23)).\
    \ Enter your details exactly as you see here:\n\n   * Action: `Start a program`\n\
    \   * Program/script: `<Path where you extracted Pentaho>\\data integration\\\
    kitchen.bat`\n   * Add arguments: `/file:<Path where your script file is installed>\\\
    job_infomotors.kjb`\n\n   Most ETL tools include a command-line executable that\
    \ will allow you to run your process through a single command. `Kitchen` is the\
    \ PDI command-line tool for executing jobs. In the Add arguments field, you are\
    \ selecting your job for execution (see Figure [7-23](#486629_1_En_7_Chapter.xhtml#Fig23)).\
    \ Use whichever environment you want. For more details on other parameters and\
    \ command-line tools you can use with PDI, please reference [https://help.pentaho.com/Documentation/7.0/0L0/0Y0/070](https://help.pentaho.com/Documentation/7.0/0L0/0Y0/070).^([^(114)](#fn114))\n\
    \n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig23_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig23_HTML.jpg)\n\
    \n   Figure 7-23\n\n   New Action\n\n6. Click OK and OK again.\n\n7. You may receive\
    \ a request to authenticate your username and password credentials. Please do\
    \ so at this time.\n\n8. You will return to the Task Scheduler window (see Figure\
    \ [7-24](#486629_1_En_7_Chapter.xhtml#Fig24)).\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig24_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig24_HTML.jpg)\n\
    \n   Figure 7-24\n\n   The Task Scheduler Window\n\nAt this point, you can either\
    \ choose to wait for your job to execute (every 5 minutes in my case) or run the\
    \ job on demand by double-clicking the `run Infomotors_ETL job` located in the\
    \ Active Jobs pane (see Figure [7-25](#486629_1_En_7_Chapter.xhtml#Fig25)) and\
    \ clicking once the Run button (see Figure [7-26](#486629_1_En_7_Chapter.xhtml#Fig26)).\
    \ This, by the way, is the single click I promised at the beginning of this chapter.\n\
    \n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig26_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig26_HTML.jpg)\n\
    \nFigure 7-26\n\nSelect the Run Button"
  raw: "### Testing\n\nBefore setting up our scheduled ETL, we have one last topic\
    \ to discuss: testing. In the DevOps world, we should automate testing, and, to\
    \ be truthful, it can involve some heavy-duty operations. Development and test\
    \ automation engineers need to work together to develop test scripts, maximize\
    \ test coverage of the coded scripts, and, by using a variety of CI/CD tools,\
    \ generate test scripts, deploy them, and run them in a continuous cycle.^([^(113)](#fn113))\n\
    \nGoing headlong into automated testing is outside the scope of this book. Suffice\
    \ to say, what we want to do is find a way to run our tests quickly and to ensure\
    \ that we recover from them gracefully. To do that, we would want to extract data\
    \ that causes Technical and Business Errors, and we could then observe how our\
    \ system reacts to the issue. Ideally, this would all be done behind the scenes,\
    \ using a Test environment, scripts, and data built for this purpose.\n\nInstead\
    \ of going through those motions, we’re going to do our testing old school style\
    \ by opening a CSV file in our input directory, changing one value in our data\
    \ script to make it invalid, and rerunning our job. That’s it. So if you’re ready,\
    \ do the following steps:\n\n1.  In your chapter[7](#486629_1_En_7_Chapter.xhtml)\\\
    development\\input directory, open the file “Contacts_2016.csv” using Notepad\
    \ or through a favorite word processor such as Sublime, Notepad++, Vim, or TextPad.\
    \ I would avoid using Word, WordPad, or Excel since the change we want to make\
    \ is minor, and these applications can add characters and strip off values when\
    \ saving CSV files.\n\n2.  Change the last value on the second row to “ABCDE”\
    \ (see Figure [7-17](#486629_1_En_7_Chapter.xhtml#Fig17))\n\n    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig17_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig17_HTML.jpg)\n\
    \n    Figure 7-17\n\n    Changing the CSV\n\n3.  In PDI, rerun the job_infomotors\
    \ by clicking the Run button.\n\nIf all works as expected, the process flow will\
    \ start, but you will trigger an error on the “ETL source csv” step. The path\
    \ shown on the screen will be directed toward the “error rollback and alert” step\
    \ (see Figure [7-18](#486629_1_En_7_Chapter.xhtml#Fig18)).\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig18_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig18_HTML.jpg)\n\
    \nFigure 7-18\n\nETL source csv Error\n\nThe Execution Results Logging pane will\
    \ show the output from your job. You should see the alert message we programmed\
    \ (“An error occurred with the integration. Rolling back”) as well as the steps\
    \ that delete from the BUYER table.\n\nIf, at this point, you were to open the\
    \ “select target table buyer” step and run this process manually, you would see\
    \ from the log that the count of the table was zero, thereby confirming that the\
    \ table is empty (see Figure [7-19](#486629_1_En_7_Chapter.xhtml#Fig19)).\n\n\
    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig19_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig19_HTML.jpg)\n\
    \nFigure 7-19\n\nResults from the Select Buyer Table Post-error. Notice the Count\
    \ Equals 0\n\n## Job Scheduling\n\nAs a final step, we’re going to set this job\
    \ to run on demand and on schedule. Earlier, I wrote about using orchestration\
    \ engines like Jenkins or scheduling tools like Microsoft Task Scheduler for automating\
    \ our scripts. In this step, we’ll configure Task Scheduler to get our PDI job\
    \ to execute every 5 minutes. As mentioned, feel free to explore testing the job\
    \ executions using your preferred orchestration engine or scheduling tool.\n\n\
    1.  Click the Windows Start icon and type the words ”task scheduler.” Press Enter.\n\
    \nTask Scheduler will start (see Figure [7-20](#486629_1_En_7_Chapter.xhtml#Fig20)).\n\
    \n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig20_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig20_HTML.jpg)\n\
    \nFigure 7-20\n\nWindows Task Scheduler\n\n2.  Select the action labeled “Create\
    \ Task.”\n\n3.  The Create Task window will open (see Figure [7-21](#486629_1_En_7_Chapter.xhtml#Fig21)).\
    \ On the General tab, enter the information in the fields provided:\n    *   Name:\
    \ Run Infomotors_ETL.\n\n*   Description : Whatever you prefer, but for knowledge\
    \ transfer purposes, I will usually be clear and not leave this field empty.\n\
    \n*   Check “Run with highest privileges.”\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig21_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig21_HTML.jpg)\n\
    \nFigure 7-21\n\nThe General Tab\n\n4.  Under Triggers, click the New button.\
    \ The New Trigger window will open (see Figure [7-22](#486629_1_En_7_Chapter.xhtml#Fig22)).\
    \ Enter your details here. For example, I chose to repeat my task every 5 minutes,\
    \ starting at midnight. You can choose whatever you like, of course, but preferably\
    \ something that won’t be more than an hour from the time you begin.\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig22_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig22_HTML.jpg)\n\
    \nFigure 7-22\n\nNew Trigger\n\n5.  Under Actions, click the New button. The New\
    \ Action window will open (see Figure [7-23](#486629_1_En_7_Chapter.xhtml#Fig23)).\
    \ Enter your details exactly as you see here:\n    *   Action: Start a program\n\
    \n*   Program/script: <Path where you extracted Pentaho>\\data integration\\kitchen.bat\n\
    \n*   Add arguments: /file:<Path where your script file is installed>\\job_infomotors.kjb\n\
    \nMost ETL tools include a command-line executable that will allow you to run\
    \ your process through a single command. *Kitchen* is the PDI command-line tool\
    \ for executing jobs. In the Add arguments field, you are selecting your job for\
    \ execution (see Figure [7-23](#486629_1_En_7_Chapter.xhtml#Fig23)). Use whichever\
    \ environment you want. For more details on other parameters and command-line\
    \ tools you can use with PDI, please reference [*https://help.pentaho.com/Documentation/7.0/0L0/0Y0/070*](https://help.pentaho.com/Documentation/7.0/0L0/0Y0/070).^([^(114)](#fn114))\n\
    \n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig23_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig23_HTML.jpg)\n\
    \nFigure 7-23\n\nNew Action\n\n6.  Click OK and OK again.\n\n7.  You may receive\
    \ a request to authenticate your username and password credentials. Please do\
    \ so at this time.\n\n8.  You will return to the Task Scheduler window (see Figure\
    \ [7-24](#486629_1_En_7_Chapter.xhtml#Fig24)).\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig24_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig24_HTML.jpg)\n\
    \nFigure 7-24\n\nThe Task Scheduler Window\n\nAt this point, you can either choose\
    \ to wait for your job to execute (every 5 minutes in my case) or run the job\
    \ on demand by double-clicking the “run Infomotors_ETL job” located in the Active\
    \ Jobs pane (see Figure [7-25](#486629_1_En_7_Chapter.xhtml#Fig25)) and clicking\
    \ once the Run button (see Figure [7-26](#486629_1_En_7_Chapter.xhtml#Fig26)). This, by\
    \ the way, is the single click I promised at the beginning of this chapter.\n\n\
    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig26_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig26_HTML.jpg)\n\
    \nFigure 7-26\n\nSelect the Run Button"
  trans: "\n### 测试\n\n在设置定期 ETL 之前，我们还有一个主题需要讨论：测试。在 DevOps 的世界里，我们应该实现测试自动化，而且说实话，这可能会涉及一些繁重的操作。开发人员和测试自动化工程师需要协同工作，共同开发测试脚本，最大化编码脚本的测试覆盖率，并通过使用各种\
    \ CI/CD 工具，在持续循环中生成、部署和运行测试脚本。^(¹¹³)\n\n全面开展自动化测试超出了本书的讨论范围。只需说明，我们想要做的是找到一种快速运行测试的方法，并确保能从测试中优雅地恢复。为此，我们希望提取那些会导致技术错误和业务错误的数据，然后观察系统对问题的反应。理想情况下，所有这些都应在后台完成，使用为此目的构建的测试环境、脚本和数据。\n\
    \n我们不会执行这些复杂的操作，而是采用老派的测试方式：在输入目录中打开一个 CSV 文件，将数据脚本中的一个值改为无效值，然后重新运行我们的任务。就这么简单。如果你准备好了，请执行以下步骤：\n\
    \n1.  在你的 `chapter7\\development\\input` 目录中，使用记事本或你喜欢的文字处理器（如 Sublime、Notepad++、Vim\
    \ 或 TextPad）打开 `Contacts_2016.csv` 文件。建议避免使用 Word、WordPad 或 Excel，因为我们要做的改动很小，而这些应用程序在保存\
    \ CSV 文件时可能会添加字符或删减数值。\n\n2.  将第二行的最后一个值改为 `ABCDE`（见图 7-17)\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig17_HTML.jpg](img/486629_1_En_7_Fig17_HTML.jpg)\n\
    \n   图 7-17\n\n   修改 CSV\n\n3.  在 PDI 中，点击“运行”按钮重新运行 `job_infomotors`。\n\n如果一切按预期进行，流程将启动，但你会触发\
    \ `ETL source csv` 步骤上的错误。屏幕上显示的路径将指向 `error rollback and alert` 步骤（见图 7-18）。\n\
    \n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig18_HTML.jpg](img/486629_1_En_7_Fig18_HTML.jpg)\n\
    \n图 7-18\n\nETL 源 CSV 错误\n\n“执行结果日志”窗格将显示任务的输出。你应该能看到我们编程设置的警报消息（`集成过程中发生错误。正在回滚`），以及从\
    \ `BUYER` 表中执行删除操作的步骤。\n\n如果在此时，你打开 `select target table buyer` 步骤并手动运行此过程，你会从日志中看到该表的计数为零，从而确认该表是空的（见图\
    \ 7-19）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig19_HTML.jpg](img/486629_1_En_7_Fig19_HTML.jpg)\n\
    \n图 7-19\n\n错误后选择买家表的结果。注意计数等于 0\n\n## 任务调度\n\n作为最后一步，我们将设置此任务按需运行和按计划运行。之前，我提到过使用像\
    \ Jenkins 这样的编排引擎或像 Microsoft 任务计划程序这样的调度工具来自动化我们的脚本。在这一步中，我们将配置任务计划程序，让我们的 PDI\
    \ 任务每 5 分钟执行一次。如前所述，欢迎使用你偏好的编排引擎或调度工具来测试任务执行。\n\n1.  点击 Windows“开始”图标，输入 `task\
    \ scheduler` 并按回车键。\n\n   任务计划程序将启动（见图 7-20）。\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig20_HTML.jpg](img/486629_1_En_7_Fig20_HTML.jpg)\n\
    \n   图 7-20\n\n   Windows 任务计划程序\n\n2.  选择名为 `创建任务` 的操作。\n\n3.  “创建任务”窗口将打开（见图\
    \ 7-21）。在“常规”选项卡上，在提供的字段中输入信息：\n\n   * 名称：`Run Infomotors_ETL`\n   * 描述：填写你喜欢的任何内容，但为了便于知识传递，我通常会明确填写，不会让此字段留空。\n\
    \   * 勾选 `使用最高权限运行`\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig21_HTML.jpg](img/486629_1_En_7_Fig21_HTML.jpg)\n\
    \n   图 7-21\n\n   “常规”选项卡\n\n4.  在“触发器”下，点击“新建”按钮。“新建触发器”窗口将打开（见图 7-22）。在此输入你的详细信息。例如，我选择从午夜开始，每\
    \ 5 分钟重复执行一次任务。你当然可以选择任何你喜欢的方式，但最好是距离你开始时间不超过一小时。\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig22_HTML.jpg](img/486629_1_En_7_Fig22_HTML.jpg)\n\
    \n   图 7-22\n\n   新建触发器\n\n5.  在“操作”下，点击“新建”按钮。“新建操作”窗口将打开（见图 7-23）。请严格按此处的样式输入你的详细信息：\n\
    \n   * 操作：`启动程序`\n   * 程序/脚本：`<你解压 Pentaho 的路径>\\data integration\\kitchen.bat`\n\
    \   * 添加参数：`/file:<你的脚本文件安装路径>\\job_infomotors.kjb`\n\n   大多数 ETL 工具都包含一个命令行可执行文件，允许你通过单个命令运行流程。`Kitchen`\
    \ 是 PDI 用于执行任务的命令行工具。在“添加参数”字段中，你正在选择要执行的任务（见图 7-23）。使用你想要的任何环境。有关你可以与 PDI 一起使用的其他参数和命令行工具的更多详细信息，请参考\
    \ [`help.pentaho.com/Documentation/7.0/0L0/0Y0/070`](https://help.pentaho.com/Documentation/7.0/0L0/0Y0/070)。^(¹¹⁴)\n\
    \n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig23_HTML.jpg](img/486629_1_En_7_Fig23_HTML.jpg)\n\
    \n   图 7-23\n\n   新建操作\n\n6.  点击“确定”，然后再次点击“确定”。\n\n7.  系统可能会请求验证你的用户名和密码凭据。请在此处完成验证。\n\
    \n8.  你将返回到“任务计划程序”窗口（见图 7-24）。\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig24_HTML.jpg](img/486629_1_En_7_Fig24_HTML.jpg)\n\
    \n   图 7-24\n\n   任务计划程序窗口\n\n此时，你可以选择等待任务执行（就我而言是每 5 分钟执行一次），或者通过双击“活动任务”窗格中的\
    \ `run Infomotors_ETL job`（见图 7-25），然后点击一次“运行”按钮（见图 7-26），按需运行任务。顺便提一下，这就是我在本章开头承诺的“一键操作”。\n\
    \n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig26_HTML.jpg](img/486629_1_En_7_Fig26_HTML.jpg)\n\
    \n图 7-26\n\n选择“运行”按钮\n"
- fmt: "![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig25_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig25_HTML.jpg)\n\
    \n**Figure 7-25** Double-Click Active Tasks\n\nYou can confirm the job has executed\
    \ successfully by examining the upper pane of the Task Scheduler, searching for\
    \ your activity, and scrolling to the `Last Run Result`.\n\nThis final confirmation\
    \ may not be enough for you, and you may be wondering what else there is. There’s\
    \ a lot you can do, most of it based on the customer requests for success and\
    \ error handling. For example, with many of the integrations we deliver, we configure\
    \ emails to be distributed on both successful completion and failure. Furthermore,\
    \ instead of entering the ETL command-line interface (CLI) tool in the `New Action`\
    \ window as we did in our example, our teams often prefer to call a wrapper script\
    \ that triggers the ETL CLI activity, thereby keeping the code easier to modify\
    \ should we change tools or processes. These are just a few of the things you\
    \ can do with your scheduled jobs, and your ETL tools should have the ability\
    \ to support much more.\n\n## Summary\n\nThis chapter has introduced you into\
    \ the world of deployment, automation, and scheduling. After learning some of\
    \ the distinctions among Development, Staging, and Test platforms, we demonstrated\
    \ how we could configure our prototype to be flexible to work in any environment,\
    \ adaptable to include as many file types as needed, and repeatable to be set\
    \ to trigger every 5 minutes. Most of the ETL products on the market today, as\
    \ well as those built from scripts, should be able to handle these types of contingencies,\
    \ so I encourage your team to go out and continue the research of what works best.\
    \ The gold is not in the tool itself but in the ability of the chosen application\
    \ to handle whatever data is thrown at you and to resolve those issues with increased\
    \ acceleration. I hope that you now feel confident enough that, when requirements\
    \ change in the eleventh hour, you’ll know how to adjust rapidly and, more importantly,\
    \ look forward to the speed and accuracy of these modifications.\n\nIn the next\
    \ chapter, we’ll talk about what happens after you’ve deployed to your Production\
    \ environment and are now ready to monitor your results.\n\n## Footnotes\n\n[1](#486629_1_En_7_Chapter.xhtml#Fn1_source)\
    \ [2](#486629_1_En_7_Chapter.xhtml#Fn2_source) [3](#486629_1_En_7_Chapter.xhtml#Fn3_source)\
