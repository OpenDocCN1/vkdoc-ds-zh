    provide will be kept in-house through formal seminars, workshops, online training,
    or lunch and learns.


    #### Formal Seminars


    When we discuss “teaching,” this is probably the first method of communication
    that comes to mind. A seminar is “a commercial program where attendees are given
    information or training about a specific topic.”^([^(137)](#fn137)) Generally,
    we think of a teacher-student setup in which one person speaks to a group of people
    in a classroom or conference room for a set duration (see Figure [9-1](#486629_1_En_9_Chapter.xhtml#Fig1)).


    Traditionally, seminars are the best medium for providing information, but communication
    is one way from the presenter; responses from the participants are low except
    during the occasional Q&A. When it comes to training others on integration, a
    seminar can be helpful if you merely want to present information about the work
    you’ve done, the direction you’re heading, and the impact that the projects have
    made. Because integrations get technical very quickly, especially when presenting
    technical details, the lack of active participation can take its toll on your
    audience, so be aware of the energy level. We probably all have attended discussions
    that were scheduled on a Friday afternoon or right before a major holiday. Although
    the topic may have interested us initially, the seminar itself may not have had
    any value, and we probably could have gotten the same information through some
    other method.


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig1_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    Formal Seminar'
  trans: '

    # 面向领导层


    你可能会好奇，为什么在经历了打造团队和产品的每一步之后，却失去了最初推动你前进的支持。毕竟，有一个问题亟待解决，你建立了一个记录完善、获得了利益相关者支持的系统，并且声势浩大地推出了产品。那么，为什么在部署后的阶段，所有这些善意都消失殆尽了呢？他们难道看不到集成工作所创造的价值吗？继续开发这些流程将为整个组织带来好处，这不是明摆着的吗？


    嗯，不，并非如此。项目无法获得更多支持的原因有很多。我们要讨论的最重要的原因之一是缺乏高管的认可——即那些推动愿景向前发展并掌握预算大权的人。根据我的个人经验，我观察到，如果
    C 级管理层（`CIO`、`CEO`、`CFO`）不相信你的集成和自动化方法能为公司创造价值，那么要从向他们汇报的人员那里获得支持将会非常困难，甚至不可能。这根本不在他们的关注范围内。


    那么，让你的团队成长的第一要诀，就是让领导层支持你的工作，不仅仅是为了某个偶发的“做这个不错”项目，而是达到“我们必须这样做，否则后果严重”的承诺规模。因此，现在不是强调你过去为某个部门带来的速度和准确性，而是要阐明整个企业所能获得的益处。集成如何影响最终盈亏？你的领导者关心什么？根据博主迈克·赖亚的说法，推销工作流程自动化可能涉及以下主题：^(¹³⁵)


    *   **提供更多数据分析，减少无价值工作**：领导层将不再需要费力寻找电子邮件和表单，而是可以专注于数据分析，从而减少行政工作。记录只需点击一下数据即可获取，部门内部沟通也将更加一致和有效。

    *   **从应用构建转向价值创造**：各部门将无需花费时间构建和支持孤立的应用程序，而是拥有一个可以随后与客户共享的通用平台。因此，如果以此方式设计，中国客户看到的数据将与德国、美国、法国等地的数据相同。一个产品名称的更改可以近乎实时地级联到不同的企业系统，使组织能够以统一的结构传递信息。

    *   **补救安全威胁**：由于集成系统在一个统一的管理下进行监控，你的流程可以对已识别的安全威胁采取一致的响应和可预测的防御。你将拥有集成备份、日志报告和审计功能，以进一步保护关键数据。

    *   **改进数据合规性**：政策和程序是你数据转换中内置业务规则的一部分。集成系统可以作为合规工作流模型的一部分，在出现违反内部或外部法规的异常情况时发出警报。如果操作得当，数据合规性将变得标准化、可执行且可审计，保护公司免受重大法律问题的影响。

    *   **标准化收入**：集成系统的主要目标之一是处理与客户收入和留存相关的各种支付系统。通过正确的架构，盈利能力数据可以导出到集中采集区域。因此，与其花费时间和资源跨越各种平台，确定公司的最终盈亏可能只需汇总来自少数几个目标位置的数字即可。

    *   **提高员工满意度，提升公司文化**：如果上述好处得以实现，那么每个人的生活都将变得更美好：员工可以专注于日常活动，而不是操作的细枝末节；组织在合规性和错误方面变得更加透明；对数据的改进分析将激发公司成功所需的创造力。简而言之，拥有一流的集成流程可能意味着巨大的增长，进而带来改善的最终盈亏、卓越的声誉和灵活的特质，所有这些都是客户在当今竞争激烈的商业文化中高度赞赏的。


    当然，获得管理层的支持只是一个团队成功而另一个团队可能中途夭折的众多因素之一。^(¹³⁶) 尽管如此，如果你做对了所有事情，却发现自己总是无法通过更多项目获得更广泛的受众，那么可能是时候专注于与管理层接触了。冒这个险，你将收获一切。


    # 教育他人


    要获得与首席执行官、首席信息官或首席财务官沟通的机会可能并不容易。没关系：假以时日，他们会回心转意，到时候，你手上要有准备好的营销要点清单。然而，执行 B
    计划，并向整个组织宣传你和你的团队所提供的服务和益处，也至关重要。这一策略要求你以专业的方式接触任何感兴趣的人，而无需诉诸“走廊伏击”或销售说辞。你需要建立的方法就是培训其他人，让他们了解团队做什么、怎么做以及为什么这么做。虽然这类讨论通常可以在正式的课堂上进行，但也有其他有效的方式可以传达要点，而无需面对面的正式场合。我们来讨论其中的一些技巧。


    ## 内部教育


    大多数时候，你可能只想在组织内部向其他人传播信息。在这种情况下，你的受众将是你的同事。除非你进行的知识分享会影响整个行业，否则你提供的细节将通过正式的研讨会、工作坊、在线培训或午餐学习会等方式在内部保留。


    ### 正式研讨会


    当我们讨论“教学”时，这可能是首先想到的沟通方式。研讨会是“一种商业项目，参加者可以就某个特定主题获得信息或培训。”^(¹³⁷) 通常，我们想到的是一种师生配置，一个人在一定时间内向教室或会议室里的一群人讲话（见图
    9-1）。


    传统上，研讨会是提供信息的最佳媒介，但沟通是从演示者到听众的单向传递；除了偶尔的问答环节，参与者的反馈很少。在培训他人集成知识时，如果你只是希望介绍已完成的工作、未来的方向以及项目产生的影响，那么研讨会很有帮助。因为集成知识会很快变得技术性很强，尤其是在介绍技术细节时，缺乏积极参与可能会让受众感到厌烦，所以要注意现场的精力水平。我们可能都参加过安排在周五下午或重大节假日前夕的讨论会。尽管最初我们可能对主题感兴趣，但研讨会本身可能毫无价值，我们或许本可以通过其他方式获得同样的信息。


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig1_HTML.jpg](img/486629_1_En_9_Fig1_HTML.jpg)


    图 9-1 正式研讨会

