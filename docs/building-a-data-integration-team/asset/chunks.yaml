  trans: '

    # 关系发现


    随着系统复杂度的增加，系统中不同组件之间的互联性也随之增强。关系发现是一个评估一个字段如何与另一个字段连接的过程，它允许在不同对象之间进行查找。关系在许多数据库中都至关重要，以至于我们通常将数据库称为关系型数据库管理系统（`RDBMS`）。


    举个简单的例子，假设我们有一个包含全美邮政编码的查找表。再假设我们有一个`CUSTOMER`表，包含名字、姓氏、产品以及该用户的地址。与其为每个用户重复输入城市、州和邮政编码，不如提供一个键，该键可以对邮政编码查找表执行查找（见图
    2-3）。


    ![../images/486629_1_En_2_Chapter/486629_1_En_2_Fig3_HTML.jpg](img/486629_1_En_2_Fig3_HTML.jpg)


    **图 2-3** – `CUSTOMER` 与 `PostalCode` 之间的关系


    如果我们审视图 2-3，关系发现就变得有意义了。`CUSTOMER.Id #1`（John Smith）包含 `CUSTOMER.PostalId #75`。此值直接引用了
    `POSTALCODE` 表中对应“加利福尼亚州洛杉矶市 90001”的记录。这样看来，我们就能理解为什么有必要识别 `CUSTOMER` 和 `POSTALCODE`
    之间的关系，而不能简单地假设我们只需要一张表。


    如果不理解这种关系，你很可能会在细节中迷失方向，尤其是当目标系统中的对照表与源系统差异很大时。为了说明这一点，让我们进一步扩展我们的例子。出于各种设计原因，目标`CUSTOMER`表现在包含了完整的城市、州和邮政编码字段（即，不再引用
    `PostalId`）。如果你只是获取源数据并直接映射到目标，你将得到不完整且无法访问的数据（见图 2-4）。


    ![../images/486629_1_En_2_Chapter/486629_1_En_2_Fig4_HTML.jpg](img/486629_1_En_2_Fig4_HTML.jpg)


    **图 2-4** – 未进行 `PostalCode` 关系发现的客户映射


    图 2-4 说明，当等式中缺少 `POSTALCODE` 表时，目标中的 City、State 和 `PostalCode` 字段的值将无法填充。这个例子的寓意在于，确保你能够识别并记录构成完整数据视图的**所有**表，而不仅仅是采用想当然的一对一匹配方法。


    ## ETL 工具


    我们模型中的提取、转换和加载（`ETL`）部分由中间件平台（即本地或基于云的服务器）和软件组成，这些软件编译用于将数据从源系统集成到目标系统的代码。任何能够从源系统拉取或接收（提取）数据，通过一系列处理步骤（转换）进行修改，然后将这些数据推送（加载）到目标指定位置的系统，都可以被视为一个`ETL`工具。架构的这一部分将发生集成团队的大部分提升和硬连接工作，因此选择合适的`ETL`平台和软件至关重要。


    我们将在后续章节中详细介绍`ETL`软件和设计。现在，我们先介绍构成`ETL`模型的标准技术组件。


    ### 源到目标映射


    对于数据集成团队来说，源到目标映射（`STTM`）是一组指令，用于确定如何将源系统中的数据转换为目标系统所需的正确结构和内容。在最基本的形式中，`STTM`仅包含相关的源元数据、转换规则和目标元数据。你可以提供更多详细信息，而更复杂的解决方案可能也需要这些信息。我们将在第
    4 章中详细讨论这些可选字段。


    ### 设计代码


    这里没有什么令人困惑的。设计代码仅仅是用于从源系统提取、转换和加载数据到目标系统的代码。但作为整个集成过程的“大脑”，设计代码的配置完全取决于所选的`ETL`软件。有些用户界面是图形化的拖拽式界面，而另一些则需要针对仅适用于
    `Java`、`JavaScript`、`.NET` 或当前可用的其他众多编程语言的专有库进行编程。正如我们讨论过的其他所有内容一样，深思熟虑对于找到适合特定工作的正确代码至关重要，然后还要确保团队成员拥有适当的编码技能。


    ### 业务规则


    这些是提供将数据从源系统转换到目标系统的标准和条件的语句列表。业务规则与业务需求不同，因为*业务需求*是你为了启用规则而需要遵守的事项。尽管业务规则应该是固定且一致的，但很多时候，它们可能会在业务所有者之间引发一些激烈的争论，因为他们可能对哪些规则应应用于哪些数据存在分歧。幸运的是，这些讨论大多围绕目标系统展开，因为按定义，已填充的源系统已经包含了具有原始业务规则的数据。尽管如此，不要被误导，认为源系统中提供的业务规则会原封不动地直接转移到目标系统。在许多情况下，更新的业务决策将推动新的业务规则，而这反过来又可能要求将输出数据转换为与其输入格式截然不同的内容。


    ### 异常处理


    数据迁移和集成过程可能因两个主要原因而失败——要么是由于网络或数据库连接问题导致的技术故障，要么是由于数据未能满足预期的业务规则而导致的业务相关问题。在这种情况下，需要让数据团队和业务所有者知晓故障。但这应该如何发生呢？是通过在线日志通知？通过电子邮件？还是通过第三方应用程序？对警报和类似错误的规范被称为异常处理，应基于内置的软件配置、设计代码或两者结合来设计。


    ### 版本控制


    数据加载可能涉及大量反复试验，设计代码也会频繁更改。最初可能只是从源系统中检索几个字段，但很快可能级联到多个表，每个表都依赖于前一个表。每次你修改一个文件函数时，都无意中冒着破坏代码其他部分的风险。随着时间的推移，跟踪所有更改会变得很困难。正确的做法是偶尔暂停一下，备份现有的代码库，但这样做可能会用你永远不需要打开的增量更改文件来使你的计算机变得臃肿。保持文件安全且可恢复的一种解决方案是通过版本控制，这是一种随时间记录文件或文件集更改的系统，以便你以后可以调用特定版本。


    版本控制系统（`VCSs`）已经使用了数十年，主要用于具有定期小版本发布和错误修复的软件应用程序。但现在，它的使用在需要编写脚本的任何组件（包括 `ETL`
    软件）中已变得更加普遍。我个人可以证明这是值得的。有一次，我不小心输错了一个 `Unix` 命令，以为要删除一个无关紧要的文件，结果却删除了包含 25 个极其重要文件的整个目录。幸运的是，我能够通过神奇的
    `VCS` 回滚功能撤销删除。我给你的建议是，对你的代码设计备份采用同样的策略。

    '
- fmt: "### Scheduling\n\nIf the ETL process is repeatable, that is, running at a\
    \ particular time of day on a specified interval, then the process can be set\
    \ to auto-execute. The way to set this execution is through a scheduled service\
    \ which might be built-in to the ETL tool or configured through a server scheduling\
    \ application. For more details on job scheduling as part of a nightly integration\
    \ approach, refer to Chapter [1](#486629_1_En_1_Chapter.xhtml), Scheduled Services.\n\
    \n### Logging\n\nIntegration jobs can run in parallel and execute at any time\
    \ of the day. With so much traffic passing through the ETL tool, creating a moment-by-moment\
    \ status report for each record success or failure might be overkill. We want\
    \ to avoid loading our server with too much information. At the same time, however,\
    \ we still might want to store this information *just in case,* especially if\
    \ we work with data that might have legal or financial ramifications to the organization.\
    \ As a simple example, imagine we have designed and deployed an ETL process for\
    \ a magazine publication. This process performs a nightly integration against\
    \ customer subscriptions by copying records from a source accounting system to\
    \ a target mailing list. Everything that we’ve built up to now appears to be running\
    \ smoothly.\n\nBut wait, not so fast. Two weeks after deployment, our customer\
    \ service department receives a complaint from an irate customer who claims that\
    \ she has been receiving a magazine to which she never subscribed. “Impossible,”\
    \ we say, knowing that our ETL system has worked fine up to now. But a query into\
    \ our subscription database reveals that this customer truly was assigned the\
    \ wrong magazine. How could that have happened? And when?\n\nThe most efficient\
    \ way to investigate would be by going through log files to trace the moment when\
    \ the record and mismatched subscription entered the ETL system. Most ETL tools\
    \ can provide this logging functionality, the individual inbound and outbound\
    \ recordsets, and the time, date, and name of the job process that executed. Due\
    \ to their large file size over time, the system should be configured to keep\
    \ log files just long enough to investigate any issues that may arise—perhaps\
    \ three weeks to a month. Keeping them longer may cause your system to falter\
    \ as processing space decreases. Without these logs on hand, however, it could\
    \ take days or even weeks to uncover the root cause, all the while having to deal\
    \ with customers and business owners who become increasingly annoyed with what\
    \ they can only surmise is *your* faulty integration logic, as opposed to a completely\
    \ unrelated event.\n\n## Target\n\nThe target system receives the integration\
    \ data and often represents the key deliverable of an integration project. Most\
    \ of the business rules that require adjusting or tweaking are for the benefit\
    \ of the target system, and these particular stakeholders are the ones that need\
    \ to be comfortable with the integration team’s solutions. The connection type\
    \ and metadata model components in the target are the same as discussed earlier\
    \ with the source, with the same approximate fundamentals. The target endpoints\
    \ and data matching concepts do differ, however, and we’ll cover them here.\n\n\
    ### Target Endpoint\n\nThe target endpoint is the receiving channel of the data\
    \ stream that originated in the source, extracted to the ETL, and then is loaded\
    \ to fit existing business rules. The main difference between the target and source\
    \ endpoint is from the perspective of the ETL connector. The connector retrieves\
    \ from the source using a `GET` method and pushes it to the target using a `POST`\
    \ method.^([^(31)](#fn31)) That is about as much as I can say on web services\
    \ without diving deeper into the topic, so for now, just be aware of the difference\
    \ between `GET` and `POST`. If you want to know more, I recommend reading Sanjay\
    \ Patni’s book, *Pro RESTful APIs* (Apress, 2017).^([^(32)](#fn32))\n\n### Data\
    \ Matching\n\nThe target system contains records from multiple datasets. If you\
    \ think about it, having a common identifier for all these systems would be rare.\
    \ Even a common table such as `CONTACT` might use a national identity value such\
    \ as Social Security Number as the unique identifier from one source and then\
    \ shift to a passport number as the unique identifier from a second source. The\
    \ role of data matching is to find records that refer to the same entity, often\
    \ by analyzing across fields that provide partial identification, such as a full\
    \ name or date of birth.^([^(33)](#fn33)) Finding these common identifiers can\
    \ be challenging when importing across multiple source systems. As an aid, software\
    \ companies have created specialized scripts, algorithms, and software to merge\
    \ and minimize duplicate records. From this point onward, the data matching crosses\
    \ into a technical arena known as Master Data Management (MDM), so named because\
    \ a single record (the “master”) can theoretically trace back to the source system\
    \ identifiers, centralizing enterprise databases into a single hub.^([^(34)](#fn34))\
    \ Designing an MDM requires a different set of skills from integration and won’t\
    \ be covered in our topics. Do keep in mind, however, that a data matching approach\
    \ in the target system is a step closer to achieving MDM, the ultimate goal in\
    \ reconciling data across an enterprise.\n\nWe’ve covered many of the key terms\
    \ and concepts in this chapter, starting with the simple diagram of an integration\
    \ architecture. Underneath the surface of the proverbial data iceberg, there’s\
    \ more to take in. Now that we understand the mechanics of the source, ETL, and\
    \ the target systems, we can now begin to highlight the required skills. Specifically,\
    \ what roles and responsibilities do we need in our integration team? The next\
    \ chapter will dive into detail.\n\nFootnotes [1](#486629_1_En_2_Chapter.xhtml#Fn1_source)\
    \ [2](#486629_1_En_2_Chapter.xhtml#Fn2_source) [3](#486629_1_En_2_Chapter.xhtml#Fn3_source)\
    \ [4](#486629_1_En_2_Chapter.xhtml#Fn4_source) [5](#486629_1_En_2_Chapter.xhtml#Fn5_source)\
    \ [6](#486629_1_En_2_Chapter.xhtml#Fn6_source) [7](#486629_1_En_2_Chapter.xhtml#Fn7_source)\
    \ [8](#486629_1_En_2_Chapter.xhtml#Fn8_source) [9](#486629_1_En_2_Chapter.xhtml#Fn9_source)\
    \ [10](#486629_1_En_2_Chapter.xhtml#Fn10_source) [11](#486629_1_En_2_Chapter.xhtml#Fn11_source)\
