- fmt: "# Reader Requirements\n\nNow that we know the difference between data migrations\
    \ and integrations and why considering them matters even for the simplest of projects,\
    \ it is time for us to talk about what you, the reader, must bring to the table.\
    \ You’re reading this book for a reason—perhaps to learn more about how to build\
    \ data integration teams, to learn about configuring the right processes, or maybe\
    \ to acquire a bit more knowledge to share with your existing team. All of these\
    \ are valid, but they do require you to understand a few things related to the\
    \ technology we will be discussing.\n\nFirst, this is not a how-to book on programming,\
    \ database development, or service-oriented architecture. Although we discuss\
    \ connecting to remote systems, transforming data, and software that can support\
    \ migration and integration, I avoid software tutorials, choosing instead to focus\
    \ on the process. Therefore, being familiar with the underlying technologies will\
    \ help you follow throughout each chapter.\n\nSecond, one of the central tenets\
    \ for building a successful integration team is strong communication and collaboration—both\
    \ within and outside the organization. Working with others through discussion,\
    \ negotiation, and compromise, possessing a basic understanding of workflows (i.e.,\
    \ the lifecycle of a piece of work), and understanding how to hand off work related\
    \ to your project will help you much more effectively achieve your goal of establishing\
    \ a highly functioning integration team and framework.\n\nFinally, the number\
    \ of deliverables for designing and deploying a data migration and integration\
    \ project can be extensive. For example, not only do you have the business requirements\
    \ of the entire project to contend with but you also need to tend to your internal\
    \ designs—system, coding, database, and so on—and that could take hours or even\
    \ days to prepare and configure. Thus, writing and maintaining documentation is\
    \ key, and especially knowing the proper usage of requirements documents, sequence\
    \ diagrams, and flowcharts will aid in getting your message across to everyone\
    \ who needs to know how your project has progressed and where it is going next.\n\
    \n# Chapter Summary\n\nWith those requirements in place, we’re finally ready to\
    \ start our journey. Although I recommend reading from cover to cover in order,\
    \ you can also skip around to find a topic of interest. It’s up to you how you\
    \ want to handle it. For your convenience, I have organized the chapters as follows:\n\
    \n- **Chapter 1: Integration Background**\n\n  We start with a brief history of\
    \ data migration, from its earliest days to the modern times of on-premise and\
    \ ground-to-cloud approaches. We then discuss how migration is more of a process\
    \ rather than a product and how “owning a process” requires a different perspective\
    \ than the more familiar “owning a product” that software development entails.\
    \ We end the chapter with a discussion of integration approaches ranging from\
    \ the one-time migration to nightly integration, listener services, and hybrid\
    \ approach.\n\n- **Chapter 2: Key Terms**\n\n  Integration developed from a combination\
    \ of both technical and business mind-sets consequently has several terms that\
    \ require some understanding. This chapter clarifies what these terms mean and\
    \ why they matter in the integration process.\n\n- **Chapter 3: Team Qualifications**\n\
    \n  The integration team consists of individuals who are technical engineers,\
    \ business-focused analysts, great communicators, and experienced coders. While\
    \ some integration teams are quite small, others can be much larger. This chapter\
    \ discusses the roles and responsibilities required to create an optimal group.\n\
    \n- **Chapter 4: Finding Your Purpose: Project Deliverables**\n\n  With a team\
    \ structure firmly in mind, the next step is to determine what type of functional,\
    \ business, and technical requirements should be captured and documented. Data\
    \ integrations tend to be very fluid, and often, mappings can change multiple\
    \ times before the stakeholders provide final signoff. If large datasets reveal\
    \ inexplicable errors, developers must quickly research, code, and communicate\
    \ workarounds to stakeholders. The best way to do this is through a combination\
    \ of reasonable business requirements, an understanding of who can support change\
    \ requests, and the right documents to communicate the integration approach.\n\
    \n- **Chapter 5: Choosing an ETL Tool**\n\n  Depending on the type of integration\
    \ required, developers and architects need to have experience with database services,\
    \ cloud platforms, `XML`, and underlying communication protocols like `REST` and\
    \ `SOAP`. Tying these technologies together requires the right extraction, transformation,\
    \ and loading (`ETL`) tool. This chapter discusses how `ETL` typically operates\
    \ and includes a sample script to demonstrate the steps to build a simple service.\
    \ We then go through the current `ETL` software leaders in the marketplace ranging\
    \ from the least amount of experience (but with little flexibility) to the more\
    \ advanced (but with plenty of features). Our goal is to establish the right tool\
    \ for the right job without having to learn a series of new technologies overnight.\n\
    \n- **Chapter 6: A Sample ETL Project**\n\n  We’re now ready to take a break and\
    \ to start practicing what we’ve learned. In this chapter, we’ll play the role\
    \ of an integration team and move contact and product data from a source to a\
    \ target system. We’ll review the steps from our previous chapters, design the\
    \ documents we need, and write code.\n\n- **Chapter 7: Platform Automation**\n\
    \n  One of the hallmarks of a good integration design is that it should be repeatable.\
    \ The initial load scripts should be tested rigorously on Development and Test\
    \ environments, and daily processes should run continuously on Production environments,\
    \ changing where needed to fit the growing needs of the business. Much of this\
    \ approach relates directly to a development operations (`DevOps`) model and bears\
    \ discussing it as it relates to data integration."
  raw: '## Reader Requirements


    Now that we know the difference between data migrations and integrations and why
    considering them matters even for the simplest of projects, it is time for us
    to talk about what you, the reader, must bring to the table. You’re reading this
    book for a reason—perhaps to learn more about how to build data integration teams,
    to learn about configuring the right processes, or maybe to acquire a bit more
    knowledge to share with your existing team. All of these are valid, but they do
    require you to understand a few things related to the technology we will be discussing.


    First, this is not a how-to book on programming, database development, or service-oriented
    architecture. Although we discuss connecting to remote systems, transforming data,
    and software that can support migration and integration, I avoid software tutorials,
    choosing instead to focus on the process. Therefore, being familiar with the underlying
    technologies will help you follow throughout each chapter.


    Second, one of the central tenets for building a successful integration team is
    strong communication and collaboration—both within and outside the organization.
    Working with others through discussion, negotiation, and compromise, possessing
    a basic understanding of workflows (i.e., the lifecycle of a piece of work), and
    understanding how to hand off work related to your project will help you much
    more effectively achieve your goal of establishing a highly functioning integration
    team and framework.


    Finally, the number of deliverables for designing and deploying a data migration
    and integration project can be extensive. For example, not only do you have the
    business requirements of the entire project to contend with but you also need
    to tend to your internal designs—system, coding, database, and so on—and that
    could take hours or even days to prepare and configure. Thus, writing and maintaining
    documentation is key, and especially knowing the proper usage of requirements
    documents, sequence diagrams, and flowcharts will aid in getting your message
    across to everyone who needs to know how your project has progressed and where
    it is going next.


    ## Chapter Summary


    With those requirements in place, we’re finally ready to start our journey. Although
    I recommend reading from cover to cover in order, you can also skip around to
    find a topic of interest. It’s up to you how you want to handle it. For your convenience,
    I have organized the chapters as follows:


    *   Chapter [1](#486629_1_En_1_Chapter.xhtml) : Integration Background


    We start with a brief history of data migration, from its earliest days to the
    modern times of on-premise and ground-to-cloud approaches. We then discuss how
    migration is more of a process rather than a product and how “owning a process”
    requires a different perspective than the more familiar “owning a product” that
    software development entails. We end the chapter with a discussion of integration
    approaches ranging from the one-time migration to nightly integration, listener
    services, and hybrid approach.


    *   Chapter [2](#486629_1_En_2_Chapter.xhtml) : Key Terms


    Integration developed from a combination of both technical and business mind-sets
    consequently has several terms that require some understanding. This chapter clarifies
    what these terms mean and why they matter in the integration process.


    *   Chapter [3](#486629_1_En_3_Chapter.xhtml) : Team Qualifications


    The integration team consists of individuals who are technical engineers, business-focused
    analysts, great communicators, and experienced coders. While some integration
    teams are quite small, others can be much larger. This chapter discusses the roles
    and responsibilities required to create an optimal group.


    *   Chapter [4](#486629_1_En_4_Chapter.xhtml) : Finding Your Purpose: Project
    Deliverables


    With a team structure firmly in mind, the next step is to determine what type
    of functional, business, and technical requirements should be captured and documented.
    Data integrations tend to be very fluid, and often, mappings can change multiple
    times before the stakeholders provide final signoff. If large datasets reveal
    inexplicable errors, developers must quickly research, code, and communicate workarounds
    to stakeholders. The best way to do this is through a combination of reasonable
    business requirements, an understanding of who can support change requests, and
    the right documents to communicate the integration approach.


    *   Chapter [5](#486629_1_En_5_Chapter.xhtml) : Choosing an ETL Tool


    Depending on the type of integration required, developers and architects need
    to have experience with database services, cloud platforms, XML, and underlying
    communication protocols like REST and SOAP. Tying these technologies together
    requires the right extraction, transformation, and loading (ETL) tool. This chapter
    discusses how ETL typically operates and includes a sample script to demonstrate
    the steps to build a simple service. We then go through the current ETL software
    leaders in the marketplace ranging from the least amount of experience (but with
    little flexibility) to the more advanced (but with plenty of features). Our goal
    is to establish the right tool for the right job without having to learn a series
    of new technologies overnight.


    *   Chapter [6](#486629_1_En_6_Chapter.xhtml) : A Sample ETL Project


    We’re now ready to take a break and to start practicing what we’ve learned. In
    this chapter, we’ll play the role of an integration team and move contact and
    product data from a source to a target system. We’ll review the steps from our
    previous chapters, design the documents we need, and write code.


    *   Chapter [7](#486629_1_En_7_Chapter.xhtml) : Platform Automation


    One of the hallmarks of a good integration design is that it should be repeatable.
    The initial load scripts should be tested rigorously on Development and Test environments,
    and daily processes should run continuously on Production environments, changing
    where needed to fit the growing needs of the business. Much of this approach relates
    directly to a development operations (DevOps) model and bears discussing it as
    it relates to data integration.'
  trans: "\n# 读者要求\n\n既然我们已经了解了数据迁移与集成之间的区别，以及为什么即便是最简单的项目也需考虑它们，那么是时候谈谈作为读者的你需要具备哪些条件了。你阅读本书自有原因——也许是想了解更多关于如何组建数据集成团队的知识，学习如何配置正确的流程，或者只是想获取更多能与现有团队分享的知识。所有这些目的都合情合理，但它们确实要求你对我们将要讨论的技术相关的若干问题有所了解。\n\
    \n首先，这不是一本关于编程、数据库开发或面向服务架构的实操指南。虽然我们会讨论连接远程系统、转换数据以及支持迁移和集成的软件，但我有意避开了软件教程，转而专注于流程本身。因此，熟悉底层技术将有助于你理解各章节内容。\n\
    \n其次，建立成功集成团队的核心原则之一，是组织内外的强力沟通与协作。通过讨论、协商和妥协与他人共事，具备对工作流程（即一项工作的生命周期）的基本理解，并掌握如何交接与你项目相关的工作——这些能力将帮助你更有效地实现目标，即建立一个高效运作的集成团队和框架。\n\
    \n最后，设计和部署数据迁移与集成项目的可交付成果数量可能非常庞大。例如，你不仅要应对整个项目的业务需求，还需处理内部设计——系统、编码、数据库等——而准备和配置这些内容可能耗时数小时甚至数天。因此，编写和维护文档至关重要，尤其要了解需求文档、时序图和流程图的正确用法，这将有助于向所有需要了解项目进展及未来方向的相关人员传达你的信息。\n\
    \n# 章节总结\n\n在明确了这些要求之后，我们终于可以启程了。虽然我建议按顺序从头到尾阅读，但你也可以跳转到感兴趣的章节。如何处理完全取决于你。为方便起见，我将章节安排如下：\n\
    \n- **第 1 章：集成背景**\n\n  我们从数据迁移的简史开始，从其早期阶段讲到现代本地部署及地面到云端的方法。接着讨论迁移为何更多是一个流程而非产品，以及\"\
    拥有流程\"为何需要与软件开发中更熟悉的\"拥有产品\"不同的视角。本章最后讨论集成方法，范围从一次性迁移到夜间集成、监听服务及混合方法。\n\n- **第\
    \ 2 章：关键术语**\n\n  集成由技术和业务两种思维模式结合发展而来，因此产生了若干需要理解的术语。本章阐明这些术语的含义及其在集成过程中的重要性。\n\
    \n- **第 3 章：团队资质**\n\n  集成团队由既是技术工程师、业务分析师，又是优秀沟通者和经验丰富的编码人员组成。有些集成团队规模很小，而另一些则可能大得多。本章讨论构建最优团队所需的角色与职责。\n\
    \n- **第 4 章：明确目标：项目可交付成果**\n\n  在牢记团队结构之后，下一步是确定应捕获并记录哪些功能、业务和技术需求。数据集成往往非常动态，在利益相关者最终批准之前，映射关系可能多次更改。如果大型数据集暴露出难以解释的错误，开发人员必须迅速研究、编码并向利益相关者沟通变通方案。最佳做法是通过合理的业务需求、了解谁可以支持变更请求，以及合适的文档来传达集成方法。\n\
    \n- **第 5 章：选择 ETL 工具**\n\n  根据所需集成类型，开发人员和架构师需要具备数据库服务、云平台、`XML` 以及底层通信协议（如 `REST`\
    \ 和 `SOAP`）的经验。将这些技术结合起来需要选择合适的提取、转换、加载（`ETL`）工具。本章讨论 `ETL` 的典型运作方式，并包含一个示例脚本来演示构建简单服务的步骤。接着我们回顾当前市场上的主流\
    \ `ETL` 软件，从经验要求最低（但灵活性小）到更高级（但功能丰富）的工具。我们的目标是针对不同任务选择恰当的工具，而无需一夜之间掌握一系列新技术。\n\
    \n- **第 6 章：一个示例 ETL 项目**\n\n  现在我们可以稍作休息，开始实践所学内容。在本章中，我们将扮演一个集成团队，将联系人和产品数据从源系统移动到目标系统。我们将回顾前面章节的步骤，设计所需文档，并编写代码。\n\
    \n- **第 7 章：平台自动化**\n\n  优秀集成设计的标志之一是应具有可重复性。初始加载脚本应在开发和测试环境中进行严格测试，日常流程应在生产环境中持续运行，并根据需要调整以适应业务不断增长的需求。这种方法在很大程度上直接关联到开发运维（`DevOps`）模型，并且有必要讨论其与数据集成的关系。\n"
- fmt: "# Integration Background\n\n> *If you can’t describe what you are doing as\
    \ a process, you don’t know what you’re doing.*\n> \n> —W. Edwards Deming^([⁵](#fn5))\n\
    \nTechnology has progressed so quickly in the past few decades that we often forget\
    \ that what today seems so simple was once quite complex. Data integration first\
    \ appeared in the 1970s when company personnel recognized that they could use\
    \ mainframe databases to store different types of business information. Companies\
    \ and their developers produced early versions of what would become extraction,\
    \ transformation, and loading (`ETL`) tools to copy data from one or more sources\
    \ into destination systems. This housing of these multiple data repositories was\
    \ the forerunner of today’s data warehouses.\n\nDuring the late 1980s and early\
    \ 1990s, as the concept of the data warehouse became entwined in mainstream technology,\
    \ integration between mainframes, minicomputers, personal computers, and spreadsheets\
    \ became more and more necessary.^([⁶](#fn6)) Proponents of utilizing data integration\
    \ flourished. Bill Inmon, designated the father of data warehousing, referred\
    \ to this outgrowth as “the corporate wisdom” that needed to be a standard part\
    \ of the corporate infrastructure.^([⁷](#fn7))\n\nData warehousing was a popular\
    \ technological breakthrough, and software companies, as they are apt to do in\
    \ profitable ventures, entered the market with their proprietary solutions. Each\
    \ market claimed to be better than its competitors, with the result that one department\
    \ of an organization, perhaps focusing on its own need, would adopt a completely\
    \ different `ETL` tool than another department. Thus, contrary to the promises\
    \ of integration, the promulgation of tools led to an *increase* in data silos,\
    \ rather than a decrease.\n\nOn top of that, the mergers and acquisitions of the\
    \ dot.com boom forced enterprises to adopt multiple `ETL` solutions. Each of these\
    \ had its particular framework, and the entire warehouse solution would need to\
    \ be either merged into one single system or left as is, thereby relegating the\
    \ entire architecture into one big mess.\n\n# Chapter [8](#486629_1_En_8_Chapter.xhtml):\
    \ Monitoring Results\n\nThe design is complete, the business is satisfied with\
    \ the requirements, and the project has gone live. The only thing left to do is\
    \ to start monitoring the results of the integration. In this chapter, we implement\
    \ a PDCA (Plan-Do-Check-Act) cycle to improve the integration output, providing\
    \ daily success and error counts to users through emails and other notification\
    \ channels. We discuss ways to identify errors, making sure the owners of the\
    \ data systems know how to resolve their issues once discovered. We end with a\
    \ brief discussion on using the integration as a feeder into business intelligence,\
    \ potentially using analytics to find gaps in the data that can lead to additional\
    \ integration projects.\n\n# Chapter [9](#486629_1_En_9_Chapter.xhtml): Marketing\
    \ Your Team\n\nBy this point, the integration team should have deployed at least\
    \ a few projects and have earned accolades for their successful accomplishments.\
    \ This celebration is no time to rest on their laurels, however. Before the excitement\
    \ dies down, teams should reach out to departments across the enterprise, identifying\
    \ future projects that make the best candidates for data integration. Part of\
    \ this approach will involve advertising to make external teams aware of the work\
    \ the integration team has done, performing educational activities such as lunch\
    \ and learns, and becoming involved with building an integration center of excellence.\
    \ Understanding the goals of the enterprise for the upcoming fiscal year would\
    \ also have value; with some research and creativity, the team can construct an\
    \ integration data roadmap. This visual summary, equivalent to a product roadmap,\
    \ maps out the vision and direction of integration offerings, which departments\
    \ they serve, and the estimated time it would take to complete.\n\n# Acknowledgments\n\
    \nI wrote this book for many reasons, but primarily so that data teams could have\
    \ a handy reference and guide when their integration projects inevitably slip\
    \ off the rails. As I will mention over and over, it is no fun to find ourselves\
    \ with too little time and too many deliverables, rushing headlong into panic\
    \ mode while the hours ebb deep into the night. Trial and error no doubt plays\
    \ a huge role in figuring out how to get out of the mess we’ve either created\
    \ or inherited, and I assure you, I’ve been there. With that in mind, several\
    \ people have been instrumental in supporting me as well as finding the right\
    \ solutions and principles summarized in this book.\n\n**To my parents, Arthur\
    \ and Lila Goldfedder:** Ever since I was a child, I said I wanted to be a writer.\
    \ Finally, we have something to put on that empty bookshelf. Thank you for all\
    \ you’ve done to motivate me and give me a sense of joy and pride. I hope this\
    \ book does the same for you.\n\n**To my brother, Brandon Goldfedder:** Without\
    \ a doubt, everything I know about computers is because of you. I am proud to\
    \ have you as a brother and an even better friend that carefully listened as I\
    \ complained about writing for 3 hours with only two pages to show for it. Yes,\
    \ you’re right: pictures help.\n\n**To the team at Acumen Solutions:** A big shout-out\
    \ to Cristina Miller, Adam Horvath, Saurabh Verma, and Chuck Boyd who coached\
    \ me while I worked at Acumen. You allowed me the space to discuss, test, experiment,\
    \ lament, and brainstorm many ideas, some good and some not as good. It was through\
    \ your open-mindedness, patience, and commitment that I acquired the experience\
    \ to write this book. I am very grateful.\n\n**To the team at Apress, Jessica\
    \ Vakili, Susan McDermott, and Laura Berendson:** A thousand thank-yous for believing\
    \ in me when I made the pitch for this book and for checking in to make sure it\
    \ all went like clockwork. You are my go-tos for the next time around.\n\n**To\
    \ my technical reviewer, Wendy Zhou:** You became the first deep-dive reviewer\
    \ of this book. Your comments and feedback significantly boosted my confidence\
    \ when I stumbled over the question just about every technical writer faces: “What\
    \ if no one understands this?” You assured me they would, and while I can’t guarantee\
    \ initial reactions, at least I know that I’m not alone with the problem that\
    \ we are trying to solve, and you made it all worth it.\n\n**To my wife and daughter,\
    \ Heather and Melinda, to whom this book is dedicated:** Thank you for giving\
    \ me the time and space I needed, even when it meant weekends in seclusion, and\
    \ exciting you both by talking about the latest trends in data integration after\
    \ your long days of work and school. You two are the best. Me more.\n\n# About\
    \ the Author\n\n# About the Technical Reviewer\n\n# Footnotes\n\n[1](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fn1_source)\
    \  \n[2](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fn2_source)  \n[3](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fn3_source)\
    \  \n[4](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fn4_source)"
