  trans: '

    ### 启动阶段


    启动阶段是项目的开端，在此阶段，团队规划者首先会对构想进行初步审核，并评估项目的可行性。他们会就由谁执行项目、涉及哪些团队以及该项目对整个组织的重要性做出决策。


    正是在这个阶段，需要撰写提案以获得高管层的资金支持。这也是风险最高的阶段，因为开发者认为他们正在交付的是一个原型，而利益相关者期望的却是一个可运行的模型，误解可能由此产生。明确沟通是关键。


    ### 定义阶段


    定义阶段有时也被称为发现阶段，在此阶段，与项目成果相关的需求会被尽可能明确地指定出来（即“被发现”）。该阶段通过建立功能性与非功能性衡量标准，重新确认所有团队成员对最终产品的期望。^(⁶⁸)
    针对这一阶段可以列出一长串问题，而在这诸多问题中，迁移/集成的需求也将被最终敲定。根据技术复杂程度的不同，收集这些特定需求的责任应由业务分析师或专注于理解业务需求的集成负责人来承担。


    ### 设计阶段


    设计阶段是下一步骤，在此阶段，开发团队利用定义阶段的需求来做出设计决策，推动项目走向成功。为此，团队会检查并考量各种模型，包括立体模型、草图、流程图、站点结构图、HTML
    屏幕设计、原型、图片效果图以及 UML 架构图。^(⁶⁹) 一旦最终设计被选定，就可以开始实施工作了。


    ### 开发阶段


    开发阶段是这样一个阶段，它是否正式化取决于项目的规模——换言之，较小的项目会将“开发”与实施阶段合并，统称为“执行”。尽管如此，由于它偶尔对实施项目具有重要性，仍然值得一谈。


    从项目管理的角度来看，开发阶段负责筹备项目实施所需的一切。规划者会引入供应商和承包商，制定时间表，订购软件和设备，并向人员提供额外的指导。在某个时间点，团队将准备就绪开始实施，并结束开发阶段。


    ### 实施阶段


    实施阶段是实际项目构建发生的阶段。开发者编写代码，团队召开状态会议，实际的构建工作正在进行。外部人员会意识到变化正在发生，甚至可能参与演示和概念验证原型。正是在这里，工作得以开展，团队忙于协作、测试，并最终部署他们的产品。


    评估实施阶段成功与否的最重要衡量标准，是确定产品在多大程度上满足了定义阶段的需求期望，以及业务所面临的问题是否得到了解决。设计也扮演着重要角色；如果代码由于系统复杂性而只是偶尔能正常工作，那么模型可能存在缺陷，或许需要一些重新设计。关键在于，“成功”是一个高度主观的视角，只有回答了“我们现在是否比以前更好？”这个问题，才能做出自信的宣告。


    这种看法并不能否定这样一个事实：即使我们尽了最大努力，最终产品也可能无法满足项目需求。失败可能由多种原因造成：需求从定义阶段到实施阶段发生了变化；因期望过高而产生了沟通误解；或者团队错误地假设他们能在特定时间内完成工作，从而低估了所需的工作量。更有可能的是，存在多个罪魁祸首，并且它们会被经理、开发者和利益相关者急切地进一步详细剖析，通常是在喝酒时私下讨论。我认为著名的“秋千图”，如图
    4-1 所示，最能体现这些期望。


    ![../images/486629_1_En_4_Chapter/486629_1_En_4_Fig1_HTML.jpg](img/486629_1_En_4_Fig1_HTML.jpg)


    图 4-1

    IT 项目的真实运作方式^(⁷⁰)


    我们可以通过多种方式将这种失败的可能性降到最低。例如，敏捷宣言就包含了旨在实现这一目标的 12 条原则。^(⁷¹) 但将这些理论付诸实践并不总是那么容易，有时事后总结似乎是最好的老师，尽管可能是个严师。


    在本章稍后的部分，我们将讨论如何利用适当的文档来最小化集成计划中的错误。


    ### 维护阶段


    一旦团队部署了产品，维护阶段就开始了。在此阶段，需要安排好结束项目并保持系统运行所需的一切事务。^(⁷²) 该阶段的活动示例包括编写手册和用户指南、举办培训班、建立帮助台支持、监控结果，以及将产品正式交付给最终所有者。


    尽管这些活动听起来很简单，但很难知道项目何时真正结束，因为总会有更多需要修复和重新考虑的问题。就集成项目而言，正如我们将要看到的，随着团队和用户发现新的异常逻辑，生产环境的变更可能而且经常超出维护的范围。出于这个原因，我喜欢将这个阶段称为运维阶段，与常规软件开发相比，它的范围更广，边界也更不清晰。


    该模型的主要意图是让其成员能够规划、行动，然后评估。无论是通过瀑布式方法论（规划、行动、一次性评估）还是通过敏捷方法论（规划、行动、评估，再规划、行动、评估，根据需要重复），每个阶段的产出应该是相同的：从头到尾产生关键的里程碑事件。^(⁷³)

    '
- fmt: '# Integration Milestones


    When it comes to the integration part of the project, what matters most is the
    communication among the architects, designers, and stakeholders. A missed requirement
    or inaccurate transformation will not only delay system completion but—should
    the transfer of data fail—could cause a great deal of damage, not just locally
    but on a global level. One famous incident is the Black Monday Stock Market Crash
    of 1987, in which the massive exchange of data allegedly caused a cascading effect,
    forcing all bids simultaneously to vanish around the stock market. According to
    some experts, the computer systems had not been tested on how to handle market
    orders during a crash.^([^(74)](#fn74)) Just based on this one event, understanding
    the integration process and its potential pitfalls should be paramount for all
    concerned.


    But, as we have discussed, that is not always the case. During the project management
    phases, planners often treat the integration tasks as just another part of software
    development. A functional requirement such as “the system should move contact
    first name, last name, postal code, and phone number from database `X` into database
    `Y`” is all well and good from the 30,000-foot view, but it doesn’t necessarily
    cover the unacceptable scenario of what happens when the phone number or zip code
    values use different formats (see Chapter [5](#486629_1_En_5_Chapter.xhtml)).
    If not encountered and dealt with early in the project phases, the integration—hence
    the system itself—will fail.


    This now brings us to the integration milestones. These milestones occur side
    by side with the software delivery phases but require distinct outputs. Table
    [4-1](#486629_1_En_4_Chapter.xhtml#Tab1) provides a summary of the distinct project
    phases, the phase gate deliverables, and a brief description.


    **Table 4-1** Project Phase and Migration Documents


    | Project Phase | Phase Gate Deliverable | Description |

    | --- | --- | --- |

    | Initiation | Team Representation | Inclusion of one or more integration team
    representatives to confirm or negate any assumptions associated with delivering
    project proposals. |

    | Definition | Data Migration Plan | Documents project background and purpose,
    migration and integration approach, assumptions, constraints, risks, as well as
    current and future state architecture. |

    | Design | Data Profile Analysis | Review of source data, structure, content,
    and relationships for content and quality. |

    | Design | Issues Log | Records and tracks any issues or questions related to
    data quality and data migration. |

    | Design | Source-to-Target Mapping | Documents mapping from source to target,
    including data types and transformation rules. |

    | Design | Data Migration Process Flow Design | Documents detailed design for
    migration processes, including the order of operations. |

    | Development | ETL Scripts | Documents the front- and back-end code related to
    the extraction, transformation, and loading; should be followed up with peer review
    session. |

    | Implementation | Migration Results Report | Documents migration results by object,
    breakdown, and impact of errors, action items, and risks. The report is created
    after each migration, including mock/test migrations. |

    | Implementation | Go-Live/Deployment Plan | Documents detailed, step-by-step,
    start-to-finish plan to perform the migration, including dependencies. |


    We will discuss each one of these deliverables in depth. For now, I want to stress
    that this pattern of delivery is not mandatory. It is merely one way to achieve
    the goal inherent in any collaborative endeavor; that is, it weakens (and even
    avoids) the impact when stakeholders realize that the meal they will get is different
    from what they thought they ordered. It also makes the life of the development
    team easier as most questions are covered from the get-go rather than at the last
    minute when the amount of work suddenly reveals itself to be larger than “just
    a weekend of button-pushing.”


    ## Initiation


    The secret to getting behind the complexity of integration is involvement from
    the very beginning, and this means representation at the earliest phase of project
    initiation. For traditional managers, it may seem strange to have straight technical
    representation included in a business proposal, but false assumptions and misunderstandings
    happen all the time, skewing the understanding of scope and effort. For one thing,
    organizations tend to reuse proposal boilerplate that has worked for them in the
    past. That makes sense from a repeatability standpoint—a process of delivery would
    be the same for similar products. But if we keep in mind that integrations are
    meant to be unique, then we realize how important it is to make sure we cover
    all bases concerning this process. That is, just because a particular source-to-target
    architecture worked in the past does not mean it translates equally well to a
    similar type of project. The data stored in Database `A` for a client does not
    equal the same data stored in Database `B` for another client. Customizations,
    triggers, values, and everything else that needs migration require a full profile
    analysis, and this must be taken into account when thinking about our product.


    An integration team representative should be asked their well-grounded opinion
    on the viability, expected time, and effort with a particular migration piece.
    And although we should not be discussing technical solutions at this point, at
    the very least, the questions “How complicated will this be?” and “How much staff
    will you need?” should be part of the proposal’s arsenal of discussion. If the
    answers to technical questions are still mostly unknown, then that should be stated.
    The point is that the proposal should reflect the unknowns rather than make an
    outright risky (or inaccurate!) assumption based on past projects.


    In short, including an integration representative in the proposal creates an accurate
    plan and ensures that a timeboxed solution is viable. It also builds confidence
    that the project is achievable without too many fires breaking out due to unannounced
    expectations.


    ## Definition


    Integration requirements tend to be either highly specific (i.e., “we only want
    these three fields brought in unless the user is from the account department,
    in which case we only should be using these other three fields”) or not specific
    enough (i.e., “we want everything”). For this reason, and to avoid the overwhelming
    flood of requests that can happen on a first iteration, it is essential to build
    a checklist of functional and nonfunctional requirements that should be a part
    of a document called the `Data Migration Plan`. This document provides in some
    detail the project background and purpose, the migration and integration approach,
    assumptions, constraints, risks, as well as current and future state architecture.'
