  trans: '

    ### 回滚错误


    我知道你肯定会争辩说，有了大量的文档、性能分析、验证和测试，你的数据加载过程会顺利进行，不会出现任何错误。我也知道，你明白我写这句话时带着讽刺意味。


    错误总是会发生，虽然比你希望的多，但比你以为的要少。而且，由于你在文档、性能分析、验证和测试方面所做的出色工作，你很可能准确知道它发生的时间和原因。十有八九，这是由于你无法控制的因素造成的，比如测试环境之外的一条异常记录，或者更隐蔽的问题，比如网络超时错误——老实说，你对此完全无能为力。当然，你偶尔也会遇到一些随机问题（“哎呀，我的异常逻辑漏掉了那个”），这时，只能将其归结为一个简单的失误，回滚加载，安装修复程序，然后重新部署。


    你选择的 ETL 工具应具备一些与回滚相关的特性，或者至少能帮助你追踪数据错误，例如成功和失败的运行计数、记录时间和超时的日志文件，以及哪些记录失败及其原因的某种指示——大多数数据库插入错误都包含数据和问题原因。虽然
    ETL 工具不一定需要具备清理目标并重置以便重新部署的功能，但考虑让团队能够及时地从错误中优雅地追踪和恢复，应该是一个重要的考量点。


    ## 市场上的工具


    我们已经讨论了构建 ETL 流程和选择合适工具的准则。在本章的剩余部分，让我们来谈谈当今市场上几种 ETL 工具及其功能、优缺点。然而，在开始之前，我需要先说明几点注意事项，以免我写出一些会让别人感到不快、招致愤怒邮件，更重要的是，导致这本书收到差评以及对我的人身攻击（这或许是一回事）的观点：


    1. 我选择列出的工具是基于我自己的经验，不代表我与任何相关供应商有关联。我曾将它们用于专业开发，并认为自己有能力对其进行评估。市场上的 ETL 工具多不胜数（Gartner
    Research 对云端和本地部署的工具都有详细总结，如果你在寻找一些纯粹的研究指南，可以搜索“Gartner 数据集成工具魔力象限”来查看最新信息）。要识别并复述
    Gartner 已经整理好的内容，都需要花费比我所希望传达的更多的时间、篇幅和专业知识。


    2. 本节的目的在于为你提供一个开始探索 ETL 工具的起点。在可能的情况下，我提供了这些公司网站的链接，以便你可以接手并自行继续评估。换句话说，在实践中学习，如果你发现了什么独特的东西，请告诉我，我会将你的发现与我的相结合。


    3. 这份清单是不断变化的，我们今天所知道的，五年后无疑会有所不同。对我来说（希望对我的编辑们也是如此），这代表着一个承诺，那就是我会尽快撰写本书的下一个版本，而不是永远不写。


    那么，如果我们准备好了，就开始讨论我们的第一个工具吧。


    ### Jitterbit


    **网站：** [`www.jitterbit.com/`](http://www.jitterbit.com/)


    **评价：** Jitterbit 是我最早使用的基于云的 ETL 工具之一，体验很不错：使用其免费增值的 Salesforce 数据加载器，我能够在云端构建一些出色的、计划性的集成。通过一个复杂的图形用户界面（见图
    5-5），对象（Salesforce 中相当于数据库表的概念）可以在数小时内（而非数天）完成移动。我们很清楚想把这个工具用作我们的数据库备份系统，它也确实很好地满足了这一需求。当集成变得复杂时，我们遇到了一些困难，但随着时间的推移和技术的进步，Jitterbit
    在 API 自动创建和 API 管理方面提供了更多功能，对于其服务的中小型企业基础来说，前景看起来不错。如果你刚开始接触 ETL，并且设计不太复杂，绝对可以试用一下这个工具，因为该公司同时提供本地部署和云端解决方案。


    **优点：** 配置和部署简单，停机时间相对较少。可以处理多种数据连接器，包括 SAS、Salesforce、数据库和 Web 服务。技术支持非常有用，愿意回答大部分问题。


    **缺点：** 随着集成变得越来越复杂，其设置也随之变得复杂。当时的文档资料比较匮乏，而且我们对云端产品的安全性有很多疑问。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig5_HTML.jpg](img/486629_1_En_5_Fig5_HTML.jpg)


    图 5-5

    Jitterbit API 转换


    ### Talend


    **网站：** [`www.talend.com`](http://www.talend.com)


    **评价：** Talend 生态系统包含一整套工具，包括 Talend Open Studio、Talend 数据管理平台、Talend 数据服务平台和
    Talend 集成云。其完整的数据管理和集成产品组合是 Talend Data Fabric 的一部分，包括数据集成、数据准备、数据目录、数据管理和 API
    管理功能。凭借所有这些功能，Talend 可以应对最复杂的 ETL 场景。最棒的是，Talend 维护着一个开源社区，因此其 Open Studio 订阅中的许多工具都是免费使用的（见图
    5-6）。^(⁹⁵) 我个人很喜欢这种免费使用复杂产品的理念。然而，Talend 支持一个 `Java Code Generator`，它利用开源的 Java
    库。如果你不是一名 Java 开发人员，学习曲线可能会非常陡峭。


    **优点：** 由开源社区维护的一套出色的工具集。支持你所需的大部分（即便不是全部）高级 ETL 解决方案。如果你的开发团队拥有 Java 技能，这将是一个很好的解决方案。


    **缺点：** 如果你还不是 Java 爱好者，学习 Talend 可能会是一场艰苦的战斗。如果你所在组织的方向是极致的软件开发，那么这个工具可能适合你。否则，当你需要修补操作时，可能很难找到团队成员来支持你的集成工作。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig6_HTML.jpg](img/486629_1_En_5_Fig6_HTML.jpg)


    图 5-6

    Talend Open Studio 免费产品

    '
- fmt: '### Dell Boomi


    **Web site:** [`https://boomi.com/`](https://boomi.com/)


    **Review:** Dell Boomi is one of those tools that I’ve used time and time again,
    and always seem to migrate toward (pun intended). If I need a high-end ETL processing
    solution with scheduling capabilities, I will mention Boomi to my clients, noting
    its ease of use for drag-and-drop GUI functionality (see Figure [5-7](#486629_1_En_5_Chapter.xhtml#Fig7)),
    no-nonsense approach to documentation, community contributions, and ability to
    run its agent, known as an `Atom`, truly remote, either behind a firewall for
    adding security or in the cloud. Boomi design does take a bit of getting used
    to, especially when it comes to persisting properties throughout an integration,
    but once you have this understanding in place, it’s relatively easy to test, deploy,
    and maintain version control. The biggest negative for me is the pricing model,
    which seems to charge one license for each connector you own for each URL. That
    is, if you want to connect to one database with a specific endpoint, then you
    pay the retail rate for one connector. If you then want to connect to the same
    database, but then across a different endpoint, you pay for a separate license.
    There are workarounds for this, but it seems like an initial high up-front cost.
    If your ETL design doesn’t require the high intensity that Boomi provides, this
    tool may not be right for your organization.


    **Pros:** Easy to set up, deploy, and commit versioning control once you take
    the appropriate (online!) courses. Everything is spelled out for you with the
    use of tutorials, telephone support, and community forums. Because it is cloud
    based, there is little maintenance of the application, and built-in API calls
    allow you to perform some genuinely automated DevOps transactions (we’ll discuss
    DevOps in Chapter [7](#486629_1_En_7_Chapter.xhtml)).


    **Cons:** A hefty price tag if you are trying to get advanced features like single
    sign-on, multiple connectors to same-source products, and unlimited customer service.
    Also, some aspects of Boomi that might be considered easier in other tools, like
    modifying data, may not be built-in and require the creation of customized scripts
    in either Groovy or JavaScript. Make sure you have developers with the right skillsets
    and a bit of patience, and you can make it work for you.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig7_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Dell Boomi Process Window


    ### Pentaho Data Integration (PDI)


    **Web site:** [`https://community.hitachivantara.com/s/article/data-integration-kettle`](https://community.hitachivantara.com/s/article/data-integration-kettle)
    (Community)


    [`www.hitachivantara.com/en-us/products/data-management-analytics/pentaho-platform/pentaho-data-integration.html`](http://www.hitachivantara.com/en-us/products/data-management-analytics/pentaho-platform/pentaho-data-integration.html)
    (Enterprise)


    **Review:** Pentaho Data Integration was founded in the early 2000s with the design
    purely open source. This openness meant that the system would have free, readable
    metadata (XML) standards and open API standards, be easy to set up (2 minutes,
    give or take), support all kinds of databases, and allow data conversion to/from
    any format.^([^(96)](#fn96)) The result was a free product that consumes virtually
    any data format, transforms it using either out-of-the-box or JavaScript filters,
    and loads into any data source ranging from text files to Big Data systems. I
    was initially skeptical when a coworker of mine back in 2012 started lauding Pentaho’s
    benefits—a free tool that can do all that? What’s the catch?


    I’ve yet to figure that last part out. I will say that Pentaho has been a lifesaver
    for much of the work I’ve done, primarily because it’s relatively easy to install
    and its drop-and-drag GUI capabilities are, in my opinion, second to none (see
    Figure [5-8](#486629_1_En_5_Chapter.xhtml#Fig8)). Plus, because its back-end metadata
    is written in text XML, the architecture is easily storable in any format and
    able to be tightly integrated with version control.


    Since my first experience with Pentaho, the company has merged with giant Hitachi
    Vantara, but the community edition is still freely available. From my understanding,
    there is also a cloud-based version in development to adapt alongside the on-premise
    application. The paid version does offer some additional benefits such as faster
    support and other functionality, but if you’re looking for something to jump you
    into the shallow end of ETL (with no price point!), then Pentaho is well worth
    the effort.


    The biggest negative of the tool is, from my experience, lack of knowledge both
    among developers and within the marketplace. Oh, you know Pentaho? Great. You
    want to create multiple deployments that can encompass an entire data system and
    have it ready to run in a few weeks? No problem. Do you want to find other people
    who can help support the tool after you leave? That’s going to be an issue. But
    if you’re willing to change your shop to make Pentaho the de facto tool, I think
    you could probably get a lot of mileage out of it.


    **Pros:** Because it was my first significant encounter with an easy-to-use ETL
    tool, I speak rather highly of it. As I always tell people, “PDI lets me do somersaults
    with my data.” You may not feel the same, however, and I cannot necessarily speak
    as to how the tool has fared under the recent Hitachi Vantara acquisition. Still,
    if you feel adventurous and want to give it a try, I would recommend it. The community
    edition is free, so you literally have nothing to lose.


    **Cons:** PDI tends to be a tool overshadowed in the marketplace by some of the
    more prominent names, and therefore finding staff who understand the design and
    are willing to support this tool can be a problem. For one-off migrations, PDI
    works very well. For incremental loads (i.e., nightly integrations), PDI has some
    features that are lacking, such as graceful error handling.


    We’ll return to more Pentaho in the next chapter when we build our sample ETL
    process.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig8_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    Pentaho Data Integration Main Window'
