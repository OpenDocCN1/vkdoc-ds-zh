- fmt: "# The Agile Model\n\nA methodology that has become very popular in software\
    \ engineering is Agile, which can be traced back to W. Edwards Deming and the\
    \ application of lean manufacturing principles used by Japanese manufacturing\
    \ companies to recover from the economic impacts of World War 2.^([^(10)](#fn10))\n\
    \nAgile is more a philosophy than a framework, encouraging a greater level of\
    \ flexibility, communication, and empowerment over the waterfall model that has\
    \ rigid start and end dates for each phase. As a differentiator, Agile takes an\
    \ iterative, collaborative stance with the ability to change course to meet stakeholders’\
    \ ever-changing needs. It accomplishes this through time-constrained cycles of\
    \ work known as the *sprint* in which a continuous set of requirements are prioritized\
    \ and worked until the beginning of the next cycle/sprint (see Figure [1-2](#486629_1_En_1_Chapter.xhtml#Fig2)).\n\
    \n![../images/486629_1_En_1_Chapter/486629_1_En_1_Fig2_HTML.jpg](images/486629_1_En_1_Chapter/486629_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2\n\nThe Sprint Model^([^(11)](#fn11))\n\nAs illustrated, sprints start\
    \ with prioritizing a set of product deliverables based on requirements (known\
    \ as “user stories”) and have built-in activities for designing, building, testing,\
    \ reviewing, and, ultimately, product launching. The goal here is not to create\
    \ a final software product as per the waterfall approach, but rather, to iteratively\
    \ deliver a series of functions that ultimately contribute to the final product.\
    \ Although this final product could take weeks or even years to produce, the agile\
    \ methodology ensures that there is constant forward momentum and (at least in\
    \ theory) a new update presentable to team members by the end of the sprint.\n\
    \nThe Agile model also differs from the waterfall model in that it allows team\
    \ roles to be flexible and dynamic, requiring the same set of skills to overlap\
    \ when the group may be “swarming” on the same story at once.^([^(12)](#fn12))\n\
    \nDepending on the individual, teams consisting of specialized integration developers\
    \ may not be able to join the swarm (and the reverse may be true as the coding\
    \ team may not possess the prerequisite integration background). While this may\
    \ appear to go against the grain in terms of the agile philosophy, it is more\
    \ helpful than you might expect. For one thing, the integration team’s tasks are\
    \ considered a subset of the entire project team, complete with a series of user\
    \ stories on which they immediately can begin backlog work, collaboration, and\
    \ sharing. The key here, as with the waterfall model, is to allow the integration\
    \ members to be a part of the model from the outset, allowing them airtime to\
    \ voice their concerns, follow up with blockers, and provide management with task\
    \ updates that may take longer than initially anticipated.\n\n## Integration Process\
    \ Vs. Integration Product Ownership\n\nThe chosen framework, whether Agile, Waterfall,\
    \ or a mix in-between, defines the team composition. Equally important are how\
    \ the team accomplishes their tasks and which individuals should take responsibility\
    \ for completing them. One of the core concepts for the Agile framework, and to\
    \ some extent the Waterfall lifecycle model, is product ownership.^([^(13)](#fn13))\
    \ A *product owner* is a role responsible for managing the product backlog, that\
    \ is, the items that form the requirements and the shared understanding of the\
    \ product’s problem and solution. The product owner’s main responsibility is guiding\
    \ the development team’s direction when multiple competing requirements exist.\
    \ In the Waterfall model, the equivalent could be the project manager, albeit\
    \ there are slight differences in the complete set of duties that overlap with\
    \ a business analyst’s role.^([^(14)](#fn14))\n\nFrom this standpoint, it seems\
    \ clear that the head of the integration team (the lead integrator that we will\
    \ discuss in Chapter [3](#486629_1_En_3_Chapter.xhtml)) should own both the product\
    \ (e.g., the ETL application) and the requirements behind the integration.\n\n\
    But there is another tier of ownership that often remains obscured until the design\
    \ work: that of *process* ownership, the approach needed to fulfill the mission,\
    \ vision, tactics, goals, objectives, and measures that will make the integration\
    \ portion of the project a success (see, for example, [*https://www.brcommunity.com/articles.php?id=b668*](https://www.brcommunity.com/articles.php%253Fid%253Db668)).\n\
    \nConfusion often arises around this concept because new teams assume that the\
    \ lead integrator role will own the project backlog items, own the process design,\
    \ and also support the product ETL software. Consequently, these teams expect\
    \ that the lead integrator will straddle the line between product owner and developer,\
    \ two very distinct roles in the Agile model. Care must be taken not to make the\
    \ role more encompassing than it needs to be. This “double-duty” assignment of\
    \ product owner/developer tends to fall apart in practice as lead integrators\
    \ take on the tasks of running the sprint, the project, the solution and managing\
    \ all development efforts in between. It is often too much for a single person\
    \ to manage. Thus, I believe it is better to divvy up the non-process-related\
    \ portions of Agile such as standups and backlog grooming to other team leaders\
    \ while the lead integrator manages all duties related to running the integration\
    \ process such as architecture, design, and development.\n\nFor a full description\
    \ of the other roles that comprise the integration team, refer to Chapter [3](#486629_1_En_3_Chapter.xhtml).\n\
    \n## Integration Approaches\n\nThree factors determine the skills and responsibilities\
    \ required for your team. The first is the data model (“at rest” versus “Data\
    \ Lake”), the second is the lifecycle framework (Agile versus Waterfall), and\
    \ the third is the overall *technical complexity* of the integration. We’ve already\
    \ discussed the first two factors. The last factor, technical complexity, is another\
    \ way of saying that the more complex the activities behind the integration, the\
    \ more skills our team members will need. But what type of skills? And how do\
    \ we define a complex activity? This distinction is where things get tricky, but\
    \ a good start is unravelling what I mean by “complex activity.”\n\nThe two most\
    \ important traits of integration complexity are *frequency* and *schedule*. In\
    \ this section, we will discuss the following types of integration approaches\
    \ along with their unique characteristics:\n\n*   One-time migration\n*   Nightly\
    \ integration\n    *   Scheduled service\n    *   Web service\n    *   Hybrid\
    \ approach\n\n### One-Time Migration\n\nThe one-time migration is perhaps the\
    \ most common and, generally, the first one that comes to my mind when I define\
    \ “migration.” It is the process of taking an existing data source and populating\
    \ it into a target destination. The source-to-target system traceability is key\
    \ here. Although the data can sometimes be a one-to-one direct transformation\
    \ (i.e., the table names, fields, field types, and data are exact copies of one\
    \ another), more often than not, the process flow requires several transformations\
    \ performed through programming code or scripting. These transformations can be\
    \ complex, and business logic can shift from one day to the next, invariably creating\
    \ some late nights to meet deployment deadlines. But if prepared correctly with\
    \ the right resources, diagrams, and documentation, a one-time migration can be\
    \ relatively smooth.\n\nAs its name implies, a one-time migration happens *once*,\
    \ although delta changes—additional loads that occur if the existing system needs\
    \ to run in parallel with the new system—can also be part of this categorization.\
    \ If an existing target system requires the deletion of existing data and then\
    \ to replace it with new data, we often refer to it as “kill and fill.”^([^(15)](#fn15))"
