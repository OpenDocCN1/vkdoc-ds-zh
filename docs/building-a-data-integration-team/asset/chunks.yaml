  trans: "\n# 打开“原型”脚本\n\n创建好`BUYER`表后，我们现在可以检查负责大部分工作的 ETL 脚本了。为了回顾一下思路，以下是我们在数据迁移流程中采取的方法：\n\
    \n1.  创建/清空`BUYER`表：使用 ETL 工具，如果`BUYER`表不存在则创建它。如果已存在，则清空所有数据，为下一次加载做准备。\n2. \
    \ 提取 CSV：使用 ETL 工具 CSV 连接器，检索所有逗号分隔的数据。\n3.  提取 TSV：使用 ETL 工具文本连接器，检索所有制表符分隔的数据。\n\
    4.  转换值：以`STTM`为参考，更改识别出的转换值。\n5.  合并文件：将新的（转换后的）临时文件合并成一个为目标格式准备好的文件。\n6.  向`BUYER`表插入数据：使用\
    \ ETL 工具 SQLite 连接器，将所有值插入到`BUYER`表中。\n7.  决策：加载过程中是否有任何错误？\n    -   如果是，则回滚数据并发送报告。\n\
    \    -   如果否，则结束事件。\n\n我们在前面的部分只介绍了第 1 步的一部分。让我们打开脚本`prototype.ktr`来分析另一个步骤。\n\
    \n-   就像之前对`create_target_table_buyer`步骤所做的那样，点击“文件/打开”菜单（Windows 上为 CTRL+O），然后导航到你从\
    \ GitHub 克隆的`chapter6\\scripts`目录。双击文件`prototype.ktr`。脚本将会打开（见图 6-10）。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig10_HTML.jpg](img/486629_1_En_6_Fig10_HTML.jpg)\n\
    \n**图 6-10** 原型脚本\n\n这个转换要处理的内容比前一个场景多得多，我们不会试图详细解释（如果你确实有兴趣，有几本关于 Pentaho 开发的推荐书籍，Hitachi\
    \ Vantara 也有一些很棒的在线帮助文档）。如果你按照标签来看，流程应该看起来是对的：我们从提取 CSV 和 TSV 文件开始（数据迁移流程中的第 2\
    \ 步和第 3 步），转换我们的 TSV 日期字段（第 4 步），添加一个将用作`EXTERNALID`的拼接字段（也是第 4 步），将最终的流追加在一起（第\
    \ 5 步），然后将数据加载到`BUYER`表中（第 6 步）。如果你想在自己的 Pentaho 脚本中探索每个函数的功能，可以随意测试。只需确保在你打开的每个对话框上点击**取消**，以避免修改任何脚本组件。\n\
    \n我们快完成了，所以接下来需要做的就是测试我们的脚本。但我们该如何测试呢？之前，我们点击了左上角的图标（运行），让我们尝试通过点击同一个图标再次执行。\n\
    \n如果你查看**日志**窗口（见图 6-11），可以看到我们确实用 200 条已写入的记录填充了`BUYER`表（`W=200`意味着“写入”）。\n\n\
    ![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig11_HTML.jpg](img/486629_1_En_6_Fig11_HTML.jpg)\n\
    \n**图 6-11** 运行原型脚本的结果\n\n看起来，是的，我们的记录数是对的，但是它们准确吗？我们是否修改了日期并执行了合并，以使我们的格式保持一致？\n\
    \n有几种方法可以检查这一点。我们可以使用另一个脚本从`BUYER`表中进行查询（我们在下一章会这样做），或者我们可以右键点击原型脚本上的任意步骤，然后选择**预览**，查看数据在该特定点的情况。另一种方法是选择**预览数据**选项卡，它在**日志**选项右侧几个选项卡的位置。我们现在点击这个选项卡（见图\
    \ 6-12）。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig12_HTML.jpg](img/486629_1_En_6_Fig12_HTML.jpg)\n\
    \n**图 6-12** 预览数据选项卡\n\n在这个窗口中，您可以在一个类似电子表格的视图中看到所有记录。我们看到的正是加载到`BUYER`表中的数据。如果你滚动浏览整个记录集，你会注意到我们的`EXTERNALID`字段遵循了我们在`STTM`中指定的语法，`DATE_PURCHASED`格式也是如此。看起来原型是成功的。开始向那些为满足这些需求而努力工作的开发人员发放星巴克礼品卡吧。\n\
    \n至此，我们已经经历了一个半实现的流程。如果这是一个实际的交付物而不仅仅是原型，我们会向迁移结果报告中填入对象名称（`BUYER`）、运行测试的日期、执行的记录总数、遇到的任何错误以及其他适合迭代清理的项目。然后就是部署到下一个环境的时候了。当然，我们不要太心急。\n\
    \n## 总结\n\n如果你一路跟随下来，你会看到我们的项目通过了所有测试。看起来我们已经准备好进行上线确认了。考虑到我们迁移的范围相当小，这并不令人惊讶。然而，对于更大的项目，监控\
    \ ETL 生命周期的所有方面可能更具挑战性，尤其是在涉及测试和部署时。例如，在最后一刻，数据库开发人员可能会做出一个更改，影响了集成团队的硬编码脚本；或者更糟的是，在测试数据上运行良好的代码在插入生产环境时现在出现奇怪的错误。虽然我们可能无法预测这些问题，但我们确实有能力尽可能多地控制它们，这既通过我们通过文档进行的沟通，也通过我们在发现新问题时发送警报来自动化脚本的能力。\n\
    \n在下一章中，我们将讨论如何更好地利用我们的 ETL 流程来帮助实现这种自动化，确保那些过去毫无预警地出现的问题现在都安全可控。\n\n脚注  \n1 \
    \ \n2  \n3\n\n# 7. 平台自动化\n\n> *软件测试人员总是上天堂；因为他们已经在人间受够了地狱般的折磨。*\n> \n> ——匿名¹⁰⁴\n\
    \n## 引言\n\n我在本书中多次重复提到，我们常常把数据迁移看作是一个一键操作——只需选择你的源字段，按下一个按钮，然后出发，数据就迁移完成了。到了这里，我希望你认识到事实远非如此。数据迁移需要仔细的计划、数天甚至数周的研究，以及通过文档、妥协和会议进行的大量协作，所有这些都与按下一个按钮相反。\n\
    \n澄清这一点之后，我现在想教你如何设计你的集成系统，以便你可以只需按下一个按钮，就能从头到尾运行完整的集成。\n\n是的，你没听错——只需一次鼠标点击就能测试你的作业、检索结果，并将你的系统部署到不同的环境。\n\
    \n不要误会我的意思。我在本书中描述的所有步骤仍然有效。你仍然需要费力地处理需求、构建你的迁移计划和`STTM`，并努力让你的迭代式 ETL 代码工作起来。但在最后，当你最终有了一个可行的模型时，你可以组合你的脚本并建立一个系统，这个系统可以按需运行，也可以在你选择的计划时间运行。在本章中，我们将讨论你将使用的不同类型的环境、为自动化准备脚本、修改你的文档、展示成功与错误，以及设置计划任务的步骤。虽然我们讨论的内容并非全部都是一键式方法，但我们肯定会足够接近，以消除伴随人工交付而来的那些单调、耗时且有风险的活动。\n\
    \n如果我们准备好了，让我们从讨论平台环境开始。\n\n## 关于环境的一切\n"
- fmt: '### Why It Matters


    When we have a deadline to meet and our project sponsor is asking us when we’re
    going to have the iteration deployed, the last thing we’re thinking about is something
    that’s going to take more time. We want to get our code pushed into the Production
    server and move on to the next activity. We’ve tested as much as we can, reviewing
    the row counts and making sure the data looks fine, so let’s move on. We reason
    it like this: If we find errors, it won’t be the end of the world, and we can
    always patch post-deployment. Like the famous footwear commercial says, “Just
    do it.”^([^(105)](#fn105))


    That sounds fine in principle and is usually the default tactic many professionals
    prefer when under the gun (“If I only had more time, I would do this the right
    way, but I don’t, so I won’t”). And this may even work. But with a process that
    depends on data accuracy, like integration, pushing bad code to production won’t
    work for very long. This obstruction is due to a phenomenon called technical debt
    that I’ll define as “the effort required to refactor/fix your code over time due
    to prioritizing speedy delivery over quality.”^([^(106)](#fn106)) For example,
    you may have added hardcoded logic in a system because it passed your internal
    tests (let’s use a pattern like “If the value equals `''IBM''`, `''I.B.M''`, or
    `''International Business Machines''`, then convert to `''IBM Corp''`”). Very
    pleased with yourself, you push your code from your local environment into Production
    and move on to the next task.


    Several weeks later, you get an email from your target data owner that there’s
    a new acronym, `"I.B.M. Corporation"`, and it’s creating confusion among the reporting
    systems. Okay, so you reopen your development code, make the hardcoded change,
    and push right back into Production. Took maybe 5 minutes, right?


    Oh, but wait, it’s really `"IBM Corporation"` with no periods between the I, B,
    and M. Dang, we should have caught that. Back to the Development system, adding
    this exception as well. Another 5 minutes, but not a big deal.


    Until it is. Several weeks later, as all the additional exceptions start to roll
    in, the data owners admit that they are frustrated. You think and consider that
    maybe what you can build is a function that would pass parameters directly into
    a lookup table that would then provide the values for you with immediate results.
    Thus, instead of having to resubmit your entire codebase into Production every
    time your users report an error, they could simply add a physical exception record
    into a table (see Figure [7-1](#486629_1_En_7_Chapter.xhtml#Fig1)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig1_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig1_HTML.jpg)


    **Figure 7-1** Code Refactored to Lookup Table


    That’s a good idea, right? Unfortunately, you’ve been using your laptop to develop
    some other functionality, and you’re not sure if you still have the original code.
    If you’re using `Git` or another version control system, you’ll probably have
    to stash your existing code, roll back to your Production-deployed version, and
    then start refactoring each of your objects. It’s progress, but do you honestly
    have time for that? Isn’t there a better way to handle this?


    You see where I’m going with this. What started as a quick workaround ended up
    costing you more time and effort (technical debt) in the long run. And despite
    your attempts to do the contrary, you now have a buggy piece of software you’ll
    have to babysit alongside frustrated data owners.


    Logically, we know that perfection is an illusion, and to be honest, you can never
    truly reduce technical debt (at least not permanently). But there are ways to
    manage it.^([^(107)](#fn107)) Our concern with technical debt is more for the
    repeatable process associated with nightly integrations rather than the one-time
    migration. One way to mitigate the pain associated with technical debt is by deploying
    your build strategically across the different environments using version control
    systems.


    A few steps are involved in accelerating your nightly integration turnarounds.
    If you follow the techniques that I recommend throughout this chapter, the benefits
    you’ll gain in productivity strongly outweigh the time it takes to do the environment
    planning and setup.


    ### Types of Environments


    We’ll continue discussing the three types of environments that are recognized
    by most DevOps teams. In actuality, you can have as many as you want, 5, 10, or
    even 100, and you can call them whatever you want. It may seem like overkill,
    but the purpose is the same: to ensure that you can meet the project requirements
    in an isolated system, where, if things go wrong, no long-term damage can occur.


    #### Development


    Development (or "Dev") is the environment that’s on your computer and where you
    initially update your code. It’s where you download your prototype scripts and
    perform commits and may or may not exist on a remote server where your coworkers
    can produce separate versions of the data. This environment rapidly changes and,
    recalling children playing in a sandbox at recess, is sometimes referred to as
    a "sandbox."


    The Development environment will allow the team to perform various experiments
    and should have connectivity with mock code or testing databases with non-production
    data. Any significant disruptions to the data that occur from testing are minimized,
    affecting only the users who are performing the intended operations.


    #### Staging


    The Staging environment is where most of our team reviews and Quality Assurance
    (QA) testing will happen, and we, therefore, want the staging environment to be
    as closely replicated to Production as possible, including the data housed in
    the source and target systems. For security or other technical reasons, you may
    not be allowed to store that type of snapshot information, but the closer you
    can get to a Production image, the more prepared you’ll be for the actual Go-Live.


    Configuring the Staging platform may seem like an arduous task, especially if
    there are a lot of hoops to jump through to request the various services you’ll
    need as part of Production replication. But having this environment in a ready
    state means that you can test a faux system in isolation, knowing that any data
    issues you run into can be resolved through iteration and careful review rather
    than rapid-fire updates as might occur in Production.


    You can build and test automation scripts here as well. This environment will
    allow you to work through multiple versions of your code, refining the loads to
    synchronize with the diagram you created for your Data Migration Process Flow.
    Most ETL tools support calling one task after another, and you can eventually
    align your workstream to run continuously in one step rather than manually executing
    one by one. While achieving this degree of automation is satisfying, I will admit
    that you can only get these results if the test data you are working within Staging
    is nearly the same as that in Production.


    To replicate environments, some organizations I have worked with will take the
    existing Production environment and, following a deployment, will overwrite the
    Staging environment so that the latest and greatest version is available for use.
    By leveraging this, the Staging environment also becomes the platform by which
    you can accelerate your payback of technical debt; if we want to rewrite our code
    to reference a table instead of a script, we can work directly in the Staging
    platform to make a change. If using a version control system (`VCS`) such as `Git`,
    we can clone the master branch to be a new release. Either way, we will have the
    ability to pivot when we encounter bugs, deploy and test within a Production-like
    environment, and not miss a beat when we get that inevitable alert that something
    has failed.'
  raw: '### Why It Matters


    When we have a deadline to meet and our project sponsor is asking us when we’re
    going to have the iteration deployed, the last thing we’re thinking about is something
    that’s going to take *more time*. We want to get our code pushed into the Production
    server and move on to the next activity. We’ve tested as much as we can, reviewing
    the row counts and making sure the data looks fine, so let’s move on. We reason
    it like this: If we find errors, it won’t be the end of the world, and we can
    always patch post-deployment. Like the famous footwear commercial says, “Just
    do it.”^([^(105)](#fn105))


    That sounds fine in principle and is usually the default tactic many professionals
    prefer when under the gun (“If I only had more time, I would do this the right
    way, but I don’t, so I won’t”). And this may even work. But with a process that
    depends on data accuracy, like integration, pushing bad code to production won’t
    work for very long. This obstruction is due to a phenomenon called technical debt
    that I’ll define as “the effort required to refactor/fix your code over time due
    to prioritizing speedy delivery over quality.”^([^(106)](#fn106)) For example,
    you may have added hardcoded logic in a system because it passed your internal
    tests (let’s use a pattern like “If the value equals ‘IBM,’ ‘I.B.M,’ or ‘International
    Business Machines,’ then convert to ‘IBM Corp’”). Very pleased with yourself,
    you push your code from your local environment into Production and move on to
    the next task.


    Several weeks later, you get an email from your target data owner that there’s
    a new acronym, “I.B.M. Corporation,” and it’s creating confusion among the reporting
    systems. Okay, so you reopen your development code, make the hardcoded change,
    and push right back into Production. Took maybe 5 minutes, right?


    Oh, but wait, it’s really “IBM Corporation” with no periods between the I, B,
    and M. Dang, we should have caught that. Back to the Development system, adding
    this exception as well. Another 5 minutes, but not a big deal.


    Until it is. Several weeks later, as all the additional exceptions start to roll
    in, the data owners admit that they are frustrated. You think and consider that
    maybe what you can build is a function that would pass parameters directly into
    a lookup table that would then provide the values for you with immediate results.
    Thus, instead of having to resubmit your entire codebase into Production every
    time your users report an error, they could simply add a physical exception record
    into a table (see Figure [7-1](#486629_1_En_7_Chapter.xhtml#Fig1)).


    ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig1_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Code Refactored to Lookup Table


    That’s a good idea, right? Unfortunately, you’ve been using your laptop to develop
    some other functionality, and you’re not sure if you still have the original code.
    If you’re using Git or another version control system, you’ll probably have to
    stash your existing code, roll back to your Production-deployed version, and then
    start refactoring each of your objects. It’s progress, but do you honestly have
    time for that? Isn’t there a better way to handle this?


    You see where I’m going with this. What started as a quick workaround ended up
    costing you more time and effort (technical debt) in the long run. And despite
    your attempts to do the contrary, you now have a buggy piece of software you’ll
    have to babysit alongside frustrated data owners.


    Logically, we know that perfection is an illusion, and to be honest, you can never
    truly reduce technical debt (at least not permanently). But there are ways to
    manage it.^([^(107)](#fn107)) Our concern with technical debt is more for the
    repeatable process associated with nightly integrations rather than the one-time
    migration. One way to mitigate the pain associated with technical debt is by deploying
    your build strategically across the different environments using version control
    systems.


    A few steps are involved in accelerating your nightly integration turnarounds.
    If you follow the techniques that I recommend throughout this chapter, the benefits
    you’ll gain in productivity strongly outweigh the time it takes to do the environment
    planning and setup.


