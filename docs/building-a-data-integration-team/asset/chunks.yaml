- fmt: '# Team Sizes


    What is the right size for an integration team? There are no hard and fast rules,
    although software development literature identifies significant correlations between
    team size and productivity.^([^(49)](#fn49)) As a rule of thumb, software development
    productivity is higher for smaller teams from three to five staff, with similar
    values up to seven. After around nine or more people, effort and cost exponentially
    are shown to rise. The `scrum` framework agrees with this assessment, stating
    that between three and nine people are the optimum size and team size should not
    go beyond that.^([^(50)](#fn50)) By comparison, the waterfall model disagrees,
    and team sizes can be quite large, often more than 15 people.^([^(51)](#fn51))


    Integration differs from software development in that the work tends to be more
    consistent and repeatable (at least in terms of ETL design principles; see Chapter
    [4](#486629_1_En_4_Chapter.xhtml)). We’ve talked about the single-person approach
    to following the integration process flow of discovery through monitoring, and
    while such work is technically possible for the short term, it can be overwhelming
    once the testing issues and bug fixes start to land in the queue. I’ve been on
    integration teams with as little as two people (a project manager and an integration
    architect), and I find that this works relatively well for small projects that
    require fast turnaround. If the timeline can extend, a three-person team will
    introduce a business analyst to the mix (i.e., a project manager, an integration
    architect, and a business analyst), while a four-person team is optimal for training
    junior ETL developers against simple, one-stop designs (i.e., a project manager,
    an integration architect, a business analyst, and an ETL developer). An integration
    team assigned more than four people means that the organization is taking the
    data efforts seriously. In this case, recruiting and training technically minded
    individuals with front-facing skills becomes a priority.


    ## Waterfall Vs. Agile Team Expectations


    We’ve discussed team sizes and how they fit with the Waterfall versus Agile methodology.
    But before we can go further and discuss the roles themselves, we must also mention
    the level of participation expected from team members. As with team size, we cannot
    assume that responsibilities will be the same. Waterfall and agile are comparatively
    different, and this difference will influence your hiring and training approaches.^([^(52)](#fn52))
    Let’s dive a bit deeper.


    ### Waterfall


    As we discussed in an earlier chapter, Waterfall is one of the first modern lifecycle
    models with a strict structure from beginning to end. This same fixation on structure
    applies to team members, all of whom are responsible for completing (or “owning”)
    a specific stage of work. For example, business analysts own and hand off just
    the business requirements, software developers own and hand off the code and other
    pertinent deliverables, and the integration participants own and handle anything
    related to that aspect. As projects grow, so do the levels of responsibility.
    This task ownership is partly the reason why team sizes for Waterfall-based projects
    can rise well into the double digits.


    ### Agile


    In contrast to Waterfall projects, agile teams are usually small with interchangeable
    team members. Think of the team more as a swarm in which a problem arises and
    each member can then step in to resolve. Thus, rather than focusing on owning
    a specific stage of work, the team is self-managing and will solve project issues
    through communication and agreement rather than role specification.


    ### Best Approaches


    Figure [3-3](#486629_1_En_3_Chapter.xhtml#Fig3) represents the team composition
    for the cross-functional (Agile) versus specialized (Waterfall) roles. Each letter
    of the illustration represents a different team member, and each color represents
    a different skill.


    ![../images/486629_1_En_3_Chapter/486629_1_En_3_Fig3_HTML.jpg](images/486629_1_En_3_Chapter/486629_1_En_3_Fig3_HTML.jpg)


    Figure 3-3 – Cross-Functional Teams Vs. Specialist Teams^([^(53)](#fn53))


    Both teams have five team members, but the Agile one on the left requires the
    members to possess a variety of skills. If sponsoring a waterfall project as shown
    on the right, you will want your integration team members to be focused on one
    specialization at any given time, what is called a *defined role*. Hiring and
    training for the Agile integration team should, therefore, focus on knowledge
    breadth, while a defined role for the Waterfall integration team should focus
    on knowledge depth.


    ### The T-Shaped Person


    Ideally, the type of employee you would want over the long term would be one known
    as a “T-shaped” person with the base knowledge and skills needed for cross-functional
    work and in-depth knowledge in one or two additional specialties. Finding people
    with these characteristics may appear complicated at the outset, but there are
    some tips and tricks that can improve the T-shaped set of knowledge and skills.
    An excellent article to start with is at [*https://collegeinfogeek.com/become-t-shaped-person/*](https://collegeinfogeek.com/become-t-shaped-person/).^([^(54)](#fn54))


    ## Integration Team Roles


    Integration team roles are not much different from familiar software development
    teams. The most significant difference is the focus on data, its movement from
    a source, its transformation through middleware, and its loading into a target
    structure. As we discussed in the previous chapter, these steps required in-between
    involve a lot of technical know-how and documentation. How can we best define
    these?


    To make sure we capture all bases, we’ll cover each of the roles on the team ([`www.atlascode.com/blog/software-development-project-roles-and-responsibilities/`](http://www.atlascode.com/blog/software-development-project-roles-and-responsibilities/)),
    with more coverage on those that are unfamiliar. We’ll start at the top with the
    project sponsor.


    ### Project Sponsor


    The project sponsor is the person (or group) who provides direction, the resource,
    and—to put it bluntly—the funding for the project. Ultimately, the project sponsor
    has the most financial investment to ensure the project’s success.


    ### Stakeholders


    The stakeholders represent the person or groups who have interest or concern in
    the project from the organization’s perspective. This role is greatly affected
    by the organization’s actions, objectives, and policies and has a vested interest
    in the success or failure of the project at hand. Stakeholders are not just employees,
    but can also consist of creditors, directors, owners, suppliers, and unions.^([^(55)](#fn55))


    ### Subject Matter Expert (SME)


    These are the people who know the fundamental details of a business, technical,
    or organizational perspective. During a data integration project, the subject
    matter experts will be able to provide the requirements and also talk about the
    day-to-day operations of their respective departments.


    I should mention that due to their responsibilities in keeping departments running
    smoothly, SMEs spend a lot of time going from one meeting to another, or putting
    out a symbolic fire. Receiving a 1:1 audience with a subject matter expert is
    not a trivial matter, and the earlier in the process you can meet, the better.
    Have good questions because often, the SME is the only one who can answer them
    accurately.


    ### Product Owner


    The product owner role is highlighted more in an Agile project than Waterfall,
    although modern software ownership blurs the line, and I have seen this role described
    in both. This person determines what features will be in the product release for
    a specific application, documents user stories, and is the main point of contact
    for all decisions related to the project.'
