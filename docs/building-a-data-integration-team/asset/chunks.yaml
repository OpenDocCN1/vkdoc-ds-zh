  trans: "\n# 敏捷模型\n\n一种在软件工程中变得非常流行的方法论是敏捷，它可以追溯到 W. 爱德华兹·戴明以及日本制造企业为从二战经济影响中复苏而应用的精益制造原则。^(¹⁰)\n\
    \n敏捷与其说是一种框架，不如说是一种哲学，相较于每个阶段都有固定起止日期的瀑布模型，它鼓励更高程度的灵活性、沟通和赋权。作为区别，敏捷采取迭代、协作的姿态，具备改变方向以满足利益相关者不断变化需求的能力。它通过被称为\
    \ *冲刺* 的限时工作周期来实现这一点，在此期间，一系列持续的需求被排定优先级并得到处理，直到下一个周期/冲刺开始（见图 1-2）。\n\n![../images/486629_1_En_1_Chapter/486629_1_En_1_Fig2_HTML.jpg](img/486629_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2\n\n冲刺模型^(¹¹)\n\n如图所示，冲刺始于基于需求（称为“用户故事”）对一组产品可交付成果进行优先级排序，并包含设计、构建、测试、评审以及最终产品发布等内置活动。这里的目标并非像瀑布方法那样创建最终的软件产品，而是迭代地交付一系列最终构成最终产品的功能。尽管最终产品可能需要数周甚至数年才能完成，但敏捷方法论确保了持续的前进动力，并且（至少在理论上）在冲刺结束时能向团队成员展示新的更新。\n\
    \n敏捷模型与瀑布模型的不同之处还在于，它允许团队角色灵活且动态变化，要求相同的技能集在团队可能同时“蜂拥”处理同一个故事时能够重叠。^(¹²)\n\n取决于具体情况，由专业集成开发人员组成的团队可能无法加入这种“蜂拥”（反之亦然，因为编码团队可能不具备必要的集成背景）。虽然这似乎与敏捷理念相悖，但它比你可能预期的更有帮助。一方面，集成团队的任务被视为整个项目团队的一个子集，附带一系列用户故事，他们可以立即基于这些故事开始积压工作、协作和分享。这里的要点与瀑布模型一样，是让集成成员从一开始就成为模型的一部分，给予他们表达担忧、跟进阻碍因素以及向管理层提供可能比最初预期耗时更长的任务更新的发言机会。\n\
    \n## 集成流程 vs. 集成产品所有权\n\n所选框架，无论是敏捷、瀑布还是两者的混合，都决定了团队构成。同样重要的是团队如何完成任务，以及哪些个人应负责完成这些任务。敏捷框架（在某种程度上也包括瀑布生命周期模型）的核心概念之一是产品所有权。^(¹³)\
    \ *产品负责人* 是负责管理产品待办列表的角色，该列表包含了构成需求的条目以及对产品问题和解决方案的共同理解。产品负责人的主要职责是在存在多个相互竞争的需求时引导开发团队的方向。在瀑布模型中，类似角色可能是项目经理，尽管在职责上与业务分析师的角色有一定重叠。^(¹⁴)\n\
    \n从这个角度来看，很明显集成团队的负责人（我们将在第 3 章讨论的首席集成人员）应该同时拥有产品（例如，ETL 应用程序）和集成背后的需求。\n\n但还有另一层所有权常常在开始设计工作之前仍不明朗：那就是\
    \ *流程* 所有权，即实现使命、愿景、策略、目标、目的和措施所需的方法，这些将确保项目中的集成部分取得成功（参见，例如 [*https://www.brcommunity.com/articles.php?id=b668*](https://www.brcommunity.com/articles.php%253Fid%253Db668)）。\n\
    \n围绕这个概念经常会产生混淆，因为新团队假定首席集成人员的角色将拥有项目待办列表项、拥有流程设计，并支持产品 ETL 软件。因此，这些团队期望首席集成人员能兼顾产品负责人和开发人员这两个在敏捷模型中截然不同的角色。必须注意不要使这个角色变得比实际需要更宽泛。这种产品负责人/开发人员的“双重职责”分配在实践中往往会失败，因为首席集成人员承担了运行冲刺、项目、解决方案以及管理其间所有开发工作的任务。这通常超出一个人能管理的范围。因此，我认为最好将敏捷中非流程相关的部分（如站会和待办列表梳理）分派给其他团队负责人，而让首席集成人员管理所有与运行集成流程相关的职责，如架构、设计和开发。\n\
    \n关于组成集成团队的其他角色的完整描述，请参考第 3 章。\n\n## 集成方法\n\n三个因素决定了你的团队所需的技能和职责。第一个是数据模型（“静态数据”与“数据湖”），第二个是生命周期框架（敏捷与瀑布），第三个是集成的整体\
    \ *技术复杂性*。我们已经讨论了前两个因素。最后一个因素，技术复杂性，换句话是说，集成背后的活动越复杂，我们的团队成员需要的技能就越多。但是是哪种类型的技能？我们又如何定义复杂的活动？这种区分让事情变得棘手，但一个好的起点是阐明我所说的“复杂活动”的含义。\n\
    \n集成复杂性的两个最重要的特征是 *频率* 和 *时间安排*。在本节中，我们将讨论以下类型的集成方法及其独特特征：\n\n*   一次性迁移\n*   夜间集成\n\
    \    *   定时服务\n    *   网络服务\n    *   混合方法\n\n### 一次性迁移\n\n一次性迁移可能是最常见的，通常也是我定义“迁移”时首先想到的。它是将现有数据源摄取并填充到目标位置的过程。源系统到目标系统的可追溯性在此是关键。尽管数据有时可以是直接的一对一转换（即，表名、字段、字段类型和数据彼此完全复制），但通常情况下，流程需要通过编程代码或脚本执行多次转换。这些转换可能很复杂，业务逻辑也可能天天变化，不可避免地会为了满足部署截止日期而熬夜加班。但如果使用正确的资源、图表和文档进行充分准备，一次性迁移可以相对顺利。\n\
    \n顾名思义，一次性迁移只发生 *一次*，尽管增量更改（即，当现有系统需要与新系统并行运行时发生的额外加载）也可以归入此类别。如果现有目标系统需要删除现有数据，然后替换为新数据，我们通常称之为“清除并填充”。^(¹⁵)\n"
- fmt: "### Nightly Integration\n\nThe nightly integration is a supplement to the\
    \ one-time migration. After the initial data has loaded, separate data feeds must\
    \ continue to load external system data into the target system. This follow-up\
    \ is usually the approach for data warehouses, reporting systems, data marts,\
    \ or any other type of system that stores data used for analysis and decision-making.\n\
    \nProject leads that already have adopted an integration solution but want additional\
    \ feeds included may request that the team build a new nightly integration feed\
    \ to tie into the old one. These projects tend to be less complex than one-time\
    \ migrations in that the target system is already established, loaded with data,\
    \ and may have previously set standards for modification and code. I advise caution\
    \ nonetheless, especially if the data from the new source is untested or does\
    \ not match the existing schema. There is nothing as disheartening as running\
    \ an initial data load test only to discover that the records are completely different\
    \ than what the stakeholders expected, requiring more than an overhaul in modifying\
    \ the existing target system’s design. Therefore, as with a one-time migration,\
    \ research your inbound data, write good documentation, and plan accordingly.\n\
    \nThe nightly integrations will usually occur in the early hours of the morning\
    \ when the business impact is least susceptible but can, of course, occur during\
    \ the day (in this situation, purists may change the name to be “daily integration”).\
    \ The execution frequency is generally once per day, but depending on timeliness\
    \ required for reporting, it can trigger the moment data is input into the source\
    \ system. These types of systems are called “real time” or, to be technically\
    \ accurate, “near-real time” since there is a slight lag in delivery from the\
    \ source to the target.^([^(16)](#fn16))\n\nTiming is a critical feature with\
    \ data loads, and not having the up-to-date information available when you need\
    \ it is just as important as where it is sourcing. We can separate integration\
    \ services into three main categories:\n\n* Scheduled service\n* Web service\n\
    * Hybrid approach\n\n#### Scheduled Service\n\n`Scheduled service` is one in which\
    \ an ETL tool or similar application retrieves the data in the source system,\
    \ transforms it, and loads it into a target system at a specific time of day.\
    \ As defined earlier, this trigger can be set at any time of day, for as many\
    \ iterations as required. The timer itself is usually a component of the querying\
    \ tool, although administrators can configure external services such as `Task\
    \ Scheduler` (Windows), `Launchd` (Mac), or `cron` (Unix) to fire custom code\
    \ designed to perform the same function.\n\nIn most systems, scheduled services\
    \ are relatively easy to configure, and there are numerous online tutorials available\
    \ to make the most of their flexibility (an excellent example is at [*https://automatetheboringstuff.com/schedulers.html*](https://automatetheboringstuff.com/schedulers.html)).\
    \ In just a few minutes, you can set a nightly integration to fire each weeknight\
    \ at 2:00 a.m. or pull reporting data only on the last day of the month (February\
    \ leap years included!). As long as the data is ready for retrieval at a prespecified\
    \ time, the scheduled service should meet most of your execution needs.\n\n####\
    \ Web Service\n\nA web service enables communication among various applications\
    \ by using open standards such as `HTML`, `XML`, `REST`, and `SOAP`.^([^(17)](#fn17))\
    \ For this approach, a preformatted source message is sent “on demand” to a service\
    \ provider, which could be a front-end ETL tool or web service broker connected\
    \ to the target (see Figure [1-3](#486629_1_En_1_Chapter.xhtml#Fig3)).\n\n![../images/486629_1_En_1_Chapter/486629_1_En_1_Fig3_HTML.jpg](images/486629_1_En_1_Chapter/486629_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nWeb Service Architecture^([^(18)](#fn18))\n\nResponses to the\
    \ source would include acknowledgment through code along with any errors. This\
    \ type of custom coding can include many automated notifications sent to various\
    \ groups along the chain, boosting teams using development operations (`DevOps`)\
    \ by alerting the technical staff to issues before your users notice. For example,\
    \ if the system provides a duplicated record on a unique field and the integration\
    \ subsequently throws an error, an email notification from the web service can\
    \ go directly to the business team to make immediate fixes.\n\nCreating this architecture\
    \ requires more technical skill and testing than standard execution calls. The\
    \ integration team should have developers who are technically savvy with the implementation\
    \ of service-oriented architecture^([^(19)](#fn19)) as well as business analysts\
    \ who can deep-dive into the types of errors and alerts that the business users\
    \ want to receive.\n\n### Hybrid Approach\n\nA hybrid approach takes the best\
    \ of both worlds of scheduled service and web service. Not only can teams execute\
    \ a job at a prescheduled time but the process can be initiated on demand by pushing\
    \ a button at the source. This approach is the most complex, requiring a combination\
    \ of implementation skills, but also offers the highest user satisfaction when\
    \ it comes to data delivery and quality.\n\nThere are tradeoffs with each of these\
    \ nightly integration subcategories, and the technical complexity chosen across\
    \ individual datasets can be a mix of approaches. For example, one nightly process\
    \ could implement a scheduled service, while a second, more necessary for near–real-time\
    \ reporting, could provide a web service listener. There is nothing wrong with\
    \ mixing and matching, as long as the systems in place are consistent and well\
    \ documented. Keep in mind that having too many systems executed constantly or\
    \ at seemingly random times is just as bad as having none at all. Save yourself\
    \ the trouble early on and be clear on which one of your implementations can fit\
    \ under one umbrella.\n\nDesigning the project and integration approach is just\
    \ the first step in putting together a successful integration team. In the next\
    \ chapter, we elaborate on some of the key terms that will help communicate with\
    \ the business and technical teams the purpose and need of an integration process.\n\
    \nFootnotes [1](#486629_1_En_1_Chapter.xhtml#Fn1_source) [2](#486629_1_En_1_Chapter.xhtml#Fn2_source)\
    \ [3](#486629_1_En_1_Chapter.xhtml#Fn3_source) [4](#486629_1_En_1_Chapter.xhtml#Fn4_source)\
    \ [5](#486629_1_En_1_Chapter.xhtml#Fn5_source) [6](#486629_1_En_1_Chapter.xhtml#Fn6_source)\
    \ [7](#486629_1_En_1_Chapter.xhtml#Fn7_source) [8](#486629_1_En_1_Chapter.xhtml#Fn8_source)\
    \ [9](#486629_1_En_1_Chapter.xhtml#Fn9_source) [10](#486629_1_En_1_Chapter.xhtml#Fn10_source)\
    \ [11](#486629_1_En_1_Chapter.xhtml#Fn11_source) [12](#486629_1_En_1_Chapter.xhtml#Fn12_source)\
    \ [13](#486629_1_En_1_Chapter.xhtml#Fn13_source) [14](#486629_1_En_1_Chapter.xhtml#Fn14_source)\
    \ [15](#486629_1_En_1_Chapter.xhtml#Fn15_source)\n\n# 2. Key Terms\n\n> *Technical\
    \ understanding should be a core competency of any company.*\n> \n> —Edwin Catmull^([^(20)](#fn20))\n\
    \nAt this point, we no doubt recognize that starting migration and integration\
    \ activities are more than just pushing a button and watching data flow from a\
    \ source to a destination. The process is a reflection of the organization, requiring\
    \ collaboration across departments, with each representative bringing to the table\
    \ a unique impression, concern, and perhaps more than one outspoken opinion. Some\
    \ of these representatives may know very little about what they need in terms\
    \ of data, while others may profess to know more than they do. Invariably, everyone\
    \ will need to be on the same page when it comes to building a system integration.\
    \ The purpose of this chapter is to expose several of the key terms native to\
    \ the process. By having this common definition from the outset, teams will have\
    \ productive conversations regarding the integration process components while\
    \ avoiding much of the confusion that typically accompanies technical solutions."
