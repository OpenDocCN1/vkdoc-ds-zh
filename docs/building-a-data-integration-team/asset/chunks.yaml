  trans: '

    # 团队规模


    集成团队的合理规模是多少？虽然没有硬性规定，但软件开发文献指出了团队规模与生产力之间的显著相关性。^(⁴⁹) 经验法则表明，三到五人的小型团队软件开发生产力更高，七人以下也类似。一旦达到九人或更多，工作量和成本呈指数级增长。`Scrum`
    框架认同这一评估，认为三到九人是最佳规模，团队规模不应超出此范围。^(⁵⁰) 相比之下，瀑布模型则持不同意见，其团队规模可能相当大，通常超过 15 人。^(⁵¹)


    集成与软件开发的不同之处在于，其工作往往更一致且可重复（至少在 ETL 设计原则方面如此；参见第 4 章）。我们曾讨论过从发现到监控的集成流程中采用单人方法的情况，虽然短期内这种工作在技术上是可行的，但一旦测试问题和错误修复开始涌入队列，就会变得难以招架。我曾参与过仅有两人（一名项目经理和一名集成架构师）的集成团队，我发现这对于需要快速交付的小型项目来说效果相对不错。如果项目时间线可以延长，三人团队则会引入一名业务分析师（即项目经理、集成架构师和业务分析师），而四人团队对于针对简单的一站式设计培训初级
    ETL 开发人员（即项目经理、集成架构师、业务分析师和 ETL 开发人员）来说是最优的。分配的集成团队超过四人意味着组织对数据工作十分重视。在这种情况下，招募和培训具备前向技能且具有技术头脑的人员便成为优先事项。


    ## 瀑布模型与敏捷团队的预期


    我们已经讨论了团队规模及其如何适应瀑布模型与敏捷方法。但在进一步讨论角色本身之前，我们还必须提及对团队成员参与程度的期望。与团队规模一样，我们不能假设职责相同。瀑布模型和敏捷方法相对不同，这种差异将影响你的招聘和培训方法。^(⁵²)
    让我们更深入地探讨一下。


    ### 瀑布模型


    正如我们在前文所述，瀑布模型是最早的现代生命周期模型之一，从头到尾都具有严格的结构。这种对结构的执着同样适用于团队成员，每个人都负责完成（或“拥有”）某个特定的工作阶段。例如，业务分析师拥有并移交仅包含业务需求的部分，软件开发人员拥有并移交代码及其他相关交付物，而集成参与者则负责处理与该方面相关的所有事宜。随着项目规模扩大，责任层级也随之增加。这种任务归属制是瀑布模型项目团队规模可能突破两位数的主要原因之一。


    ### 敏捷


    与瀑布模型项目相反，敏捷团队通常规模较小，且成员具有可互换性。可以将团队视为一个蜂群，当问题出现时，任何成员都可以介入解决。因此，团队更侧重于自我管理，通过沟通和共识而非角色定义来解决项目问题，而不是专注于拥有某个特定工作阶段。


    ### 最佳实践


    图 3-3 展示了跨职能（敏捷）角色与专业化（瀑布）角色的团队构成。图中的每个字母代表不同的团队成员，每种颜色代表不同的技能。


    ![../images/486629_1_En_3_Chapter/486629_1_En_3_Fig3_HTML.jpg](img/486629_1_En_3_Fig3_HTML.jpg)


    图 3-3 – 跨职能团队与专家团队对比^(⁵³)


    两个团队都有五名成员，但左侧的敏捷团队要求成员掌握多种技能。如果赞助的是右侧所示的瀑布模型项目，你会希望集成团队成员在任意时刻专注于单一专长，即所谓的*明确定义的角色*。因此，敏捷集成团队的招聘和培训应侧重于知识广度，而瀑布模型集成团队的明确定义角色应侧重于知识深度。


    ### T 型人才


    从长远来看，理想员工类型是所谓的“T 型”人才——既具备跨职能工作所需的基础知识和技能，又在一到两个额外专业领域拥有深入知识。一开始找到具备这些特质的人可能看起来比较复杂，但有一些技巧和窍门可以提升
    T 型知识和技能。一篇不错的入门文章是 [*https://collegeinfogeek.com/become-t-shaped-person/*](https://collegeinfogeek.com/become-t-shaped-person/)。^(⁵⁴)


    ## 集成团队角色


    集成团队角色与常见的软件开发团队角色并无太大区别。最大的不同在于对数据的关注：数据从源系统的移动、通过中间件的转换，以及最终加载到目标结构。正如我们在上一章所讨论的，这些中间步骤涉及大量的技术知识和文档编制。我们该如何最好地定义这些角色？


    为确保覆盖所有基础，我们将介绍团队中的每个角色（[`www.atlascode.com/blog/software-development-project-roles-and-responsibilities/`](http://www.atlascode.com/blog/software-development-project-roles-and-responsibilities/)），并对那些不太熟悉的角色进行更详细的说明。我们将从最顶层的项目发起人开始。


    ### 项目发起人


    项目发起人是为项目提供方向、资源，以及——坦率地说——资金的个人（或团体）。最终，项目发起人是为项目成功投入最多财务资源的人。


    ### 利益相关者


    利益相关者是指从组织角度对项目有兴趣或关切的个人或团体。该角色深受组织行动、目标和政策的影响，并且与当前项目的成功或失败有直接利益关系。利益相关者不仅限于员工，还可能包括债权人、董事、所有者、供应商和工会。^(⁵⁵)


    ### 主题专家 (SME)


    主题专家是了解业务、技术或组织层面基本细节的人员。在数据集成项目中，主题专家能够提供需求，并讨论其各自部门的日常运作。


    需要指出的是，由于他们肩负着确保部门平稳运行的责任，SME 往往穿梭于各种会议之间，或忙于处理紧急事务。能够与主题专家进行一对一的交流并非易事，因此越早安排会面越好。务必准备好高质量的问题，因为通常只有
    SME 才能给出准确的答案。


    ### 产品负责人


    产品负责人的角色在敏捷项目中比在瀑布模型中更为突出，尽管现代软件所有权模糊了这一界线，我曾在两种方法中都看到过对这个角色的描述。此人负责确定特定应用程序的产品发布版本中将包含哪些功能，编写用户故事，并且是与项目相关的所有决策的主要联系人。

    '
- fmt: '# Project Manager (PM)


    If a Waterfall project were an orchestra, the project manager would be its conductor.
    This person knows the ins and outs of the software project, manages the budget
    and the schedule, oversees the software testing, delivers all documentation, and
    gets formal acceptance by the customer.


    In an integration project, the project manager continues to maintain that role,
    leaning heavily on the technical lead as needed, but continuing to serve as the
    interface between the development team and customer.


    # Technical Lead


    In a software development project, this person translates the business requirements
    into a technical solution and assigns activities to the software developers. In
    the integration portion of a project, the data integration architect may replace
    the role of the technical lead.


    # Data Integration Architect


    The data integration architect is part of the IT team and, as the title suggests,
    works on data integration solutions. Data integration architects specialize in
    their field, managing all aspects of a data architecture that involve the movement
    of data from one point to another. These job roles also tend to be customer-facing
    and include working closely with teams of ETL developers in the same capacity
    as the technical lead. The main difference, of course, focuses on the integration
    side of the house, which requires different functional and technical skills than
    software development.


    # Software Developers


    The software developers are responsible for using the technical requirements from
    the technical lead to create cost and timeline estimates, build deliverables,
    and communicate the status of the project to the technical lead and project manager.
    In an integration project, ETL developers replace the role of software developers,
    although the duties are relatively the same.


    # Software Testers


    Software testers ensure that the software solution meets the business requirements
    and is free of bugs, errors, and defects. As with software developers, we could
    rename this role to `ETL tester`, but that is a bit more awkward. We often stick
    with the more generic-sounding title of `tester` to represent both.


    # User Acceptance Testers


    These people are the representatives from the company who perform the final checks
    to ensure that the software works for the business across several real-world scenarios.
    In the integration team, the user acceptance testers should be those who handle
    the day-to-day data activities and would thus have the most precise conception
    on whether the integration performs as expected.


    # Business Analyst


    The business analyst is responsible for bridging the gap between IT and the business.
    They do this through data analytics, requirements gathering, process assessment,
    and delivering data-driven recommendations and reports to senior executives and
    stakeholders. Business analysts create initiatives and strategies that will improve
    importing and optimize costs and often have finance teams and IT as their customers.
    Business analysts also focus on data-driven tasks such as budgeting and forecasting,
    planning and monitoring, pricing, reporting, and defining business requirements.


    For an integration project, the business analyst works as the liaison between
    the functional and technical sides, ensuring that business requirements are accurate
    and interpreted correctly by the ETL developers. There is a continuous back-and-forth
    aspect to this role as the business analyst must confirm that what the developer
    heard is what the stakeholders meant.


    # Release Manager


    The release manager is a relatively new role, which has achieved wide recognition
    in the world of development operations (DevOps) and is worth discussing from an
    integration standpoint.^([^(56)](#fn56)) This person owns the release management
    lifecycle, consisting of the scheduling, coordinating, and management of releases
    for multiple applications. The releases can be inclusive of application updates,
    operating system patches, security improvements, hardware upgrades, projects,
    programs, and so on.


    The release manager plays a vital role in testing and deploying integrations within
    the ETL application and must work collaboratively with all participants, including
    the ETL developers and testers, as they set up their build, test, and production
    environments.


    The position requires more of a T-shaped skillset than other ones discussed. As
    automation across industries continues to advance, the role of the integration
    release manager may shift to a universal tester; but, for the time being, this
    person serves as the gatekeeper between the different environments and has their
    hands full with ensuring systems continually process the data.


    # Recruiting Your Team


    Now that we’ve talked about the various roles within the teams, it’s time to identify
    and recruit those individuals who will be working with you. Your first step, of
    course, is to determine what type of role you need and then to create the job
    description.


    ## Determining the Roles


    There are two ways to evaluate the context of your integration project:


    - A supplemental add-on in which the integration is the secondary part of a much
    larger project


    - A primary project which is a large-scale, perhaps enterprise-style deployment


    Many of the initial projects you work on will be of the first type, but if the
    organization is moving toward repository or data warehouse initiatives, the second
    type will crop up. In any case, when you decide the roles you need to hire, you
    must consider the big picture. Naturally, if running the supplemental integration,
    you will want to start with the standard software development team and add at
    a minimum the roles for integration architect, ETL developer, and business analyst.
    Because these types of projects tend to be short term, you will also need to consider
    if you would want to hire an independent contractor or stick with a permanent
    full-time employee who could perform double-duty work once the project had ended
    or lapses.


    Independent contractors can also be a part of the longer, large-scale projects,
    but the skills and requirements you need fit more into the T-shaped qualifications
    we discussed earlier, which would necessitate hiring more seasoned professionals,
    perhaps adding training as the practice builds out.


    For more on the pros and cons of contract versus full-time staffing, refer to
    [*https://blog.toggl.com/contract-vs-full-time/*](https://blog.toggl.com/contract-vs-full-time/).^([^(57)](#fn57))'
