  trans: '

    ### 工作坊


    工作坊与研讨会类似，同样包含信息传授环节，但更注重体验式学习，它通过利用大小组讨论、活动和练习，以及实践应用所讲概念的方式，让参与者融入学习过程（见图 9-2）。^(¹³⁸)
    工作坊的领导者（称为引导员）会确保活动按计划进行，并期望所有参与者都能做出贡献。


    由于迁移和集成工作高度依赖设计模型和转换对比，工作坊是学习基础知识的绝佳方式。通过引导学生逐步经历软件开发的流程（类似于我们在本书中所经历的过程），你可以激发他们对现有工作的热情，并为你的事业赢得新客户。但工作坊并非适合所有人。有些人可能因为经理的推荐而觉得必须参加。另一些人可能不如同行精通技术，或者难以置信的是，他们可能对集成领域毫无兴趣。这些人最好避免参加工作坊，因为这只会造成更多困惑，或不利于建立团队凝聚力。我相信没人希望看到这种情况。


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig2_HTML.jpg](img/486629_1_En_9_Fig2_HTML.jpg)


    图 9-2


    工作坊^(¹³⁹)


    ### 在线培训


    在线培训是一种以软件形式提供的教学项目，它通过非正式的问卷测试、填空题、选择题、是非题以及演示来教导学员。在线培训将线下实体课堂转移到了虚拟空间，可以是实时进行的（如网络研讨会），也可以是录制好供按需观看的（见图
    9-3）。在线授课的形式多种多样，通常结构化为视频、音频、动画或这些方法的组合。^(¹⁴⁰)


    与正式的研讨会相比，在线培训有几个优势：这类课程可以在任何有电脑或移动设备的时间和地点进行，通常成本更低，所需总时间投入更少，并且已显示出更高的长期学员保留率。^(¹⁴¹)
    从讲师——即你的团队将扮演的角色——的角度来看，你创建的学习材料在在线培训课程中可以更加详尽，提供涵盖许多技术细节的数小时指导；或者，如果只需要一个概述，可以针对项目的基本轮廓制作一份标准的幻灯片演示文稿。


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig3_HTML.jpg](img/486629_1_En_9_Fig3_HTML.jpg)


    图 9-3


    在线培训^(¹⁴²)


    ### 午餐学习会


    以一种更非正式的方式传达你观点的一个较好方法是通过午餐学习会，这通常是一个团队向其他人分享其技能和专长的会议（见图 9-4）。因其通常在午餐时间举行而得名，这类会议时长在
    30 到 45 分钟之间，可以是单次会议，也可以作为一系列课程的一部分。^(¹⁴³)


    与前面描述的方法相比，午餐学习会有几个优势。由于它在社交氛围中进行，这些小组会议鼓励团队合作与协作，打破了团队间的壁垒——而这些团队在更正式的演示中可能通常会有所防备。我记得有一次，一位以拒绝在本团队之外投入资源而闻名的经理，被迁移团队的“我们身在何处”午餐学习会深深吸引，以至于他在接下来的一周就与他的首席开发人员安排了一次更正式的后续会议。从第一次会议开始就建立起一个极好的伙伴关系，此后，在他的同事中定期举办午餐学习会便成了惯例。


    午餐学习会也有其缺点，尤其是当你的团队成员身处异地，无法亲临现场时。通过使用诸如 Webex ([*https://www.webex.com/*](http://www.webex.com/))、Join.me
    ([*https://www.join.me/*](http://www.join.me/)) 或 Google Hangouts ([*https://hangouts.google.com/*](https://hangouts.google.com/))
    等会议工具，你可以尽量减少这些弊端，但我总觉得与面对面交流的体验和专注度相比，可能会错过一些东西。邀请听众时，请顾及他人感受：午餐学习会应当是自愿且轻松的，是感兴趣方之间的知识分享，而非强制性会议。最后，确保食物选择是众所周知的——这不仅包括参与者的饮食限制（这点至关重要），还包括午餐的费用（如果不由公司预算承担）。别忘了在日历邀请中提及这一要点：我曾参加过一些会议，领导者期望我们自带餐食，却忘记告知参与者。没有什么比饿着肚子却发现自己要参加一个
    45 分钟且没有食物的会议更令人沮丧的了。在这种情况下，“天下没有免费的午餐”这句谚语就变得异常准确。^(¹⁴⁴)


    ![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig4_HTML.jpg](img/486629_1_En_9_Fig4_HTML.jpg)


    图 9-4


    午餐学习会^(¹⁴⁵)


    无论你选择哪种内部培训方法，你都希望你的听众能获得具体的收获和对下一步行动的想法。在宏观层面上，你应该让他们理解集成团队已完成的工作、这些工作随时间推移所带来的好处，以及未来工作将对企业和特定部门产生的影响。最重要的是，你需要强调为了推进下一步工作你需要什么。这些支持可以是资金支持（例如资助某项工作）、资源或系统方面的实际参与，甚至仅仅是帮助团队串联起各个环节，看清全局，并了解你的团队在更大的架构中处于什么位置。


    ## 外部教育


    在你于内部推广你的团队、产品和流程的同时，你也需要将触角伸向组织外部。这样做的一个最佳理由是推广：你的团队正在做很棒的工作，让行业内的其他人知道这一点，是促使他人购买你组织的产品或与之合作的最佳理由。这也能提升团队士气——当员工看到他们的工作如何对各自工作组内部和外部的其他人产生影响时，工作满意度和生产力都会显著提高。^(¹⁴⁶)
    因此，参加像线下聚会、社交活动和会议这样的非工作活动，对于促进团队成长具有长期影响。


    然而，外部教育并非适合所有人。有时，这类推广活动应尽量减少甚至避免。例如，你可能没有足够的内部支持来确保外部的成功。或者，你担心竞争对手会模仿你所提出的专有想法。^(¹⁴⁷)
    对于任何这些情况，在让你的团队成员承诺就任何话题发表演讲之前，请先咨询你的法律部门和政策制定者。


    现在，我们假设你的团队已经取得了显著成就，在企业内部声名鹊起，并已决定与整个行业分享。那么，你应该如何开始呢？

