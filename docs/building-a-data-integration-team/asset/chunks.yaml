    \ [31](#486629_1_En_3_Chapter.xhtml#Fn31_source)\n\n# 4. Finding Your Purpose:\
    \ Project Deliverables\n\n> *Things of quality have no fear of time.*\n> \n> —Author\
    \ Unknown\n\n## Introduction\n\nNow that your integration team is in place, the\
    \ actual project can begin. The goal here, of course, is to complete a set of\
    \ tasks to ensure that the data moves successfully from one point to another,\
    \ be it one time, daily, or multiple times throughout the day. You can measure\
    \ your success in this effort in a variety of different ways: Did you meet the\
    \ client’s business needs? Does the data flow in a “reasonable” amount of time\
    \ (where you know the value of “reasonable”)? Does the integration run as expected,\
    \ or are there exceptions that must be abided? If so, who is responsible for resolving?\
    \ Is the documentation of the process and code clear and complete? With all these\
    \ success factors, you will no doubt forget some critical detail, and someone,\
    \ somewhere, is going to be upset. And that brings us to the topic of this chapter:\
    \ ensuring your success through project deliverables.\n\nHaving well-defined deliverables\
    \ is just a shortcut to maintain your sanity. Overkill is easy with integration\
    \ primarily because with all the data available now, and in the future, stakeholders\
    \ are never sure where to draw the line; there is always something more to move,\
    \ always some obscure anomaly in a legacy database that people want to embed in\
    \ the new system. For that reason, no one ever really wants to sign off and say\
    \ enough is enough. I’ve been on many projects where the answer to “what data\
    \ should we move” is the very nonspecific “everything.” Not coincidentally, these\
    \ requirements tend to be the same projects where the project sponsors expect\
    \ the integration to take one long weekend.\n\nWith that in mind, documenting\
    \ and sharing plans with others and letting them know what features to expect\
    \ from start to finish is the best approach. Otherwise, stakeholders may push\
    \ back and claim that they absolutely must have more than can be possibly delivered\
    \ in the time allotted. With the right documentation, you create a robust framework\
    \ which keeps everyone confident and on the same page. More importantly, it helps\
    \ you get to bed at a reasonable time.\n\n## Project Management Phases\n\nDocuments\
    \ are produced and delivered throughout the project lifecycle, whether working\
    \ in a waterfall or an agile model. The types of materials are relatively the\
    \ same, just occurring in a more clipped, more accelerated pace with the agile\
    \ framework. Before we discuss the specifics of each deliverable, however, let’s\
    \ begin our conversation with the phases of project management and how they map\
    \ directly to your integration process.\n\nSome articles have highlighted six\
    \ phases of project management processes, some have described four, while the\
    \ definitive guide, the `PMBOK`, asserts there are five. From my experience, teams\
    \ usually stick with whatever the organization itself traditionally follows. In\
    \ any case, we’ll go with the idea that more is better than less, and discuss\
    \ the six phases. You can omit whatever you think is necessary for your project\
    \ based on its perceived simplicity or complexity and determine how to compose\
    \ the framework of your integration team.\n\nThe phases of project management\
    \ are as follows:\n\n- Initiation\n- Definition\n- Design\n- Development\n- Implementation\n\
    - Maintenance"
