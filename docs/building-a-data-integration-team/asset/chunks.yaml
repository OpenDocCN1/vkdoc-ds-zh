    \n本书中可能出现的商标名称、标识和图像。对于每个出现的商标名称、标识或图像，我们并非每次都使用商标符号，而是仅以编辑方式使用这些名称、标识和图像，并出于维护商标所有者利益的目的，无意侵犯商标权。本出版物中使用的商品名称、商标、服务标志及类似术语，即使未被明确标识，也不应被视为对其是否受专有权利保护的立场表达。\n\
    \n尽管本书中的建议和信息在出版时被认为是真实准确的，但作者、编辑和出版商均不对可能出现的任何错误或遗漏承担法律责任。出版商对本书所含材料不作任何明示或暗示的担保。\n\
    \n本书通过 Springer Science+Business Media New York 向全球图书贸易分销，地址：233 Spring Street,\
    \ 6th Floor, New York, NY 10013。电话：1-800-SPRINGER，传真：(201) 348-4505，电子邮件：orders-ny@springer-sbm.com，或访问\
    \ www.springeronline.com。Apress Media, LLC 是一家加利福尼亚有限责任公司，其唯一成员（所有者）是 Springer\
    \ Science + Business Media Finance Inc（SSBM Finance Inc）。SSBM Finance Inc 是一家特拉华州公司。\n\
    \n*献给希瑟和梅琳达*\n\n*在这段旅程中，我无法奢求更好的人相伴。*\n\n引言\n\n> *如果没有系统性的方法来开始并保持数据清洁，糟糕的数据就会发生。*\n\
    > \n> ——Donato Diorio，RingLead 首席执行官 ^(¹)\n\n# 我的故事\n\n我刚走出校门，对数据集成世界还相对陌生，就经历了项目管理的第一堂硬课：“没有什么事会像工作说明书（`SOW`）声称的那么容易。”当时，我是一个五人咨询团队的成员，负责构建一个网页应用程序。我们的角色明确：一名项目经理（`PM`）、一名业务分析师（`BA`）、两名网页开发人员，以及一名数据集成专家。我就是那个数据集成专家，并且对这个头衔感到自豪，尽管我对自己将要做什么并不太了解。我也不知道，作为新人，我是可以被牺牲的。这个项目将是一次火炼般的经历，因为数据集成是该公司提供的一项相对较新的服务，他们意识到把我直接扔进火里也没什么损失。\n\
    \n根据这本厚重精装工作说明书中仅有的两页内容，我的主要目标是将大约 15,000 个地址从 Excel 电子表格导入到 SQL Server 7.0 数据库中。换句话说，我们的客户会提供我们所需的所有字段。我有三项基本任务（参见图\
    \ 1）：\n\n![][我的第一次集成图]\n\n**图 1** 我的第一次集成（表面视图）\n\n1.  在 SQL Server 数据库中创建相关的表和字段。\n\
    2.  从电子表格中导入地址。\n3.  确保 Excel 电子表格和数据库中的 15,000 条记录匹配。\n\n是的，在纸面上看起来非常简单，即使对我来说也是如此——迄今为止我做的最复杂的集成不过是将本科《心理学\
    \ 101》的成绩从记事本复制粘贴到 Lotus 数据库中。尽管如此简单，当我们的开发人员意识到网页应用在投入生产前还需要稍作调整时，我并没有担心。是的，这是一个阻碍，但我们仍有充足的时间。见鬼，如果情况真的变得最糟糕，我总可以做出难以想象的事：周五晚上加班（记住，我对咨询这行还是个新手）。只要我们能在截止日期前加载好示例数据，一切就会顺利解决。这不过是复制粘贴，可能只是多按几个按钮而已。\n\
    \n在 SQL Server 中创建表和字段很容易。但获取导入文件却没有那么容易。文件终于在周四早上通过一个 USB 驱动器送到了。加载它时，我逐渐意识到出了问题。字段本身看起来，嗯，不太寻常。经过某种奇怪的逗号分隔转换后，本应是“州”的字段跑到了“国家”字段里。我们遇到了空白的电话号码，有些只是“0”（我们是在呼叫接线员吗？），甚至还有像“N/A”这样人类能接受的值，而这些值在读取到数字开放表字段时会导致崩溃。犹豫片刻后，我终于不得不承认，我无法处理这些数据。\n\
    \n在花费了周四和周五的大部分时间与我们的客户一起手动清理这 15,000 条记录之后，第二步开始了。现在是时候从电子表格中导入地址了，这原本应该只是 Windows\
    \ 应用程序之间的复制粘贴。实际上，它涉及的内容要多得多（参见图 2）。首先，Excel 的专有驱动程序没有正确安装到数据库中，我立即收到了“文件未找到”的错误。好吧，这有点沟通失误，但只要我将\
    \ Excel 文件导出为一个新的逗号分隔文件，就能很快解决。\n"
- fmt: 'Well, not really. The import worked fine unless the contact just happened
    to have a postal code in any town from New Jersey, Massachusetts, or any other
    state where the US Postal Zip Code starts with a zero (“0”). Excel has an interesting
    feature where, if not correctly defined as a format, fields beginning with “0s”
    are removed on export automatically (we refer to this as a “leading zero,” and
    you can read more about a workaround here— [*https://support.office.com/en-us/article/format-numbers-to-keep-leading-zeros-in-excel-online-633401e5-f2ad-4ac7-afef-05ed58b1c9a1*](https://support.office.com/en-us/article/format-numbers-to-keep-leading-zeros-in-excel-online-633401e5-f2ad-4ac7-afef-05ed58b1c9a1)
    ). ^([²](#fn2)) Thus, during our import of 15,000 records, we hit an `INVALID
    LENGTH` error on `ZIPCODE` almost immediately. We were expecting at least five
    characters, and in this case, we received four. So I would troubleshoot the error,
    fix it, and start over from scratch until the next field error. And the next,
    and the next, and so on.


    ![../images/486629_1_En_BookFrontmatter_Fig2_HTML.jpg](images/486629_1_En_BookFrontmatter_Fig2_HTML.jpg)


    **Figure 2** My First Integration (Actual View)


    It didn’t stop there. The path of transforming the data during that long weekend
    was endless. I learned more than enough hard lessons about migrations (enough
    to fill a book, cough cough). There were so many aspects to consider, so many
    things taken for granted that I could have done differently had I only known better.
    But as the old expression goes: ”Turn your wounds into wisdom.” I’ll keep it at
    that for now.


    I left that experience feeling stunned and exhausted. I dreaded the conversation
    with the team that followed. I began with “We couldn’t deploy because I wasn’t
    ready with the data…”


    I will take the position that although my data load was less than stellar, there
    was some progress made. That’s bound to happen with two hours of sleep a night
    for three nights. But if I take everything into account, the project itself was
    not a huge success, and only a portion of that was related to the data problems.
    To my surprise, no one tossed around blame or ever stated the obvious: I was way,
    way, way over my head as a data integrator.


    On the contrary, my manager praised my performance due to my persistence. It could
    have been that, or, more likely, because I lived to fight another day. In any
    case, staffing put me on another data migration project. This time, I swore I
    would learn from my mistakes. Things went a bit smoother that time around. Not
    perfect, but smoother.


    Soon, I became the go-to person for data integration. The role has stuck with
    me. But it wasn’t simple to get there. Not only do you have to struggle to make
    the data conform to standards, but you also have to communicate with both technical
    and nontechnical team members, making sure they understand the nuts and bolts
    around a task that, at least on an architecture diagram, looks as easy as just
    pushing a few buttons for a copy/paste. You have to adjust to the way the integration
    part of the project will ebb and flow by setting up a structure and pattern that
    starts long before the development work begins, probably even before teams lay
    out the user requirements. In short, you need to build there from the beginning,
    and you need to have a team ready and willing to support.


    That brings me to the reasons why I wrote this book. There are two of them. First,
    as I hope I’ve illustrated, data migration looks very simple, given that you only
    need to move data from point A to point B, but it can turn quite messy very fast
    and without warning. The typical results of bad planning are missed deadlines,
    unrecognized overhead, and, more often than not, desperate acts of last-minute
    heroism that take on a weirdly optimistic tone (“I did it and with only three
    hours of sleep in the last two days!”). Of course, I think we would all prefer
    to do without these results, and I hope this book will help you to plan and coordinate
    the integration team effort from the outset.


    The second reason for writing this book is to emphasize to all parties involved
    in a project, from the project manager to the developers to the stakeholders,
    that data migration is one of the most, if not *the* most, critical parts of the
    project plan. Too often have I seen a migration plan relegated to the back end
    of the development phase, almost serving as an afterthought to the working piece
    of software that takes center stage. I argue that this is a mistake because no
    matter how shiny a software product is, no matter how many features and specifications
    you add, if the data is not correct—for example, if your bottom-line receipts
    are missing or your customer data is corrupt—then the software is broken. Period.


    Do the migration early and do it right, however, and you’ll find there’s no greater
    satisfaction than having clients tell you how much easier their lives have become
    due to data issues no longer existing. Yes, it can be hard work and long hours
    in the beginning, but truly worthwhile in the end.


    Before we get started on the major topics, let’s clear up one misconception right
    off the bat since I use the terms interchangeably throughout this book. Let’s
    discuss the difference between data migration and data integration.'
