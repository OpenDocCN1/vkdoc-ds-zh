  trans: "\n*   投诉：“我没有关于发生什么事的信息，但我知道数据有问题。”\n    *   应对措施：“数据有问题”是一种常见的投诉，因为对于直属团队以外的大多数人来说，`ETL`\
    \ 过程几乎是不透明的。他们不了解数据源、目标、`ETL` 或任何其他架构细节，只知道他们看到的记录不符合预期或记忆。因此，在没有确凿证据的情况下，这是一个难以调试的问题。尝试获取尽可能多的信息，调查所有可能性（检查之前的\
    \ `ETL` 执行日志，调查可能报告的任何其他重复错误，询问源和目标数据所有者是否有任何潜在影响可能导致数据问题）。你最初可能找不到原因，但如果这是一个真实存在的问题，它会再次出现。希望到那时，你会有更多信息可供处理。\n\
    \n### 每日数据日志\n\n在客户之前识别数据问题的最佳缓解措施之一是创建每日数据日志，这是一份每日生成的文档，将从 `ETL` 执行中记录的日志行整合成一份简单的报告，提供关于整个可重复集成的汇总统计数据。每日数据日志包括流程名称、第一个作业运行的时间、作业结束的时间、传递的记录总数、错误总数（如果有），以及这些错误的类别（业务错误与技术错误等；定义见第\
    \ 7 章）。通过 Wiki、每日电子邮件或报告应用程序与你的数据所有者共享此文档，将快速定位你团队和他们可能错过的焦点和问题，并为组织内的持续改进提供起点。我们将在下一节中进一步讨论持续改进。\n\
    \n**注意**\n\n虽然我建议通过你手头的脚本构建每日数据日志，但如今市场上有更专业的解决方案。你可以查看来自不同供应商的应用监控系统，例如 `Datadog`、`SmartBear`、`New\
    \ Relic` 和 `Atlassian` 等。这些工具值得研究，它们提供了出色的功能，可以显著提升你发现和修复问题的能力。\n\n### 更新生产环境\n\
    \n你应该尽量避免直接在生产环境中更改 `ETL` 代码。在我们讨论技术债务（第 7 章）时，我建议你构建一种策略，允许你提供参数来更改值，而不是硬编码。但有时无法避免触及生产环境——可能需要进行紧急修复，某些导致数据库崩溃的关键代码段，^(¹¹⁷)\
    \ 或者某个被链路上除 `CEO`（他现在已经掌握了生产环境）以外的所有人认为无关紧要的关键需求。在这种情况下，你将不得不直接介入。要有条不紊且始终如一地执行操作。我在图\
    \ 8-2 中定义了我通常采用的策略。\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig2_HTML.jpg](img/486629_1_En_8_Fig2_HTML.jpg)\n\
    \n**图 8-2** 生产更新流程图\n\n步骤摘要：\n\n1.  联系你的项目经理或业务相关方以获得批准；如有必要，开立变更管理工单。\n2.  更新项目文档——重新调整源到目标的映射，对数据迁移流程图和细节进行更改，并与你的开发团队沟通所需的更改，确保获得一个切实可行的\
    \ `LOE`。\n3.  迭代你的更改，从开发环境开始，进行测试，部署到预发布环境，重新测试，最后与相关人员共享任何修复的原型。\n4.  根据公司政策，向受影响的团队发送通知，说明原因、解决方法、预期影响以及生产服务器的停机时间。让他们知道如果遇到新升级的问题，应该联系谁。\n\
    5.  执行更新。完成后，向受影响的团队发送另一份通知，提供最新状态以及如果问题持续存在应联系谁。最重要的是，感谢他们在处理停机期间的耐心和支持。\n6.\
    \  如果由于某种原因你无法修复问题，并且这确实是产品的阻塞问题，那么你可能必须将生产环境回滚到中断前的副本。是的，这是最坏的情况，没人想要这个选项，但这比意外擦除数据并对系统造成无法估量的损害的噩梦场景要好。^(¹¹⁸)\n\
    \n## 第一周：部署后\n\n在第一周内，你可能已经对 `ETL` 脚本做了一些调整，可能还有几次紧急部署（希望不要太多）。此时，用户越来越频繁地使用新系统，你会听到关于你团队工作的正面和负面评价。留意这些反馈并做好笔记。诚然，系统能工作，但总有改进空间。这是一个我们需要开始思考的目标。\n\
    \n### 规划下一步\n\n如果你一直在记录每个作业的开始和结束时间，你将会开始看到一些常见的模式。也许有一个作业在凌晨 2:00 运行得太慢，或者有一个作业在定义的阈值内超时。你的用户可能不认为这些是主要问题，或者最多会略带抱怨地容忍它们。虽然你可能倾向于忽略这个问题——如果对他们来说没坏，为什么要修？——但我建议你坚持寻找解决方案。首先，仅仅因为现在没人认为这是个问题，并不意味着将来不会，尤其是当你的源和目标系统将要承受额外负载时。其次，你在每次加载中能实现的优化越多，你就越能持续且无间断地衡量你的集成效果。这种优化对于通过一个称为持续改进的生产力概念来识别更多机会至关重要。\n"
- fmt: "### Continuous Improvement\n\nContinuous improvement goes by many names: “rapid\
    \ improvement,” Kaizen, and incrementalism,^([^(119)](#fn119)) and is a subset\
    \ of the general process of improvement posited by W. Edwards Deming in the 1950s.^([^(120)](#fn120))\
    \ In the realm of data integration, we can boil down our definition as “focusing\
    \ on linear improvement, streamlining work, and reducing irrelevancy through automated,\
    \ scalable solutions.”^([^(121)](#fn121)) What this means is that by observing\
    \ and continuously iterating our ETL streams to accelerate delivery, we will eventually\
    \ reach a level of maximum productivity. Although achieving total automation would\
    \ be optimal—the fastest speed with no user intervention whatsoever—we acknowledge\
    \ that there will always be space for further improvement.\n\nReaching the next\
    \ level of productivity is a significant driver for our team and one that should\
    \ be at the heart of our integration roadmaps (more on that in Chapter [9](#486629_1_En_9_Chapter.xhtml)).\
    \ For the time being, the easiest way for us to determine what requires improvement\
    \ is through the Plan-Do-Check-Act (PDCA) model proposed by Deming and refined\
    \ by others (see Figure [8-3](#486629_1_En_8_Chapter.xhtml#Fig3)).^([^(122)](#fn122))\
    \ We can break down the acronym as follows:\n\n- **Plan:** Define the problem\
    \ to be addressed, collect the data, and determine the root cause.\n- **Do:**\
    \ Develop a solution, and decide on a measurement to ascertain the effectiveness.\n\
    - **Check:** Confirm the results through before-and-after data comparisons.\n\
    - **Act:** Document the results, let others know about process changes, and recommend\
    \ for them to address the problems.\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig3_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig3_HTML.jpg)\n\
    \n**Figure 8-3** PDCA Model\n\nKeep in mind that our focus for this continuous\
    \ improvement stays primarily within our domain, namely, the ETL process. It is\
    \ tempting for us to suggest that we innovate the source and target side of the\
    \ house, especially if we find improvements needed in that area. Although feedback\
    \ to these teams is encouraged, trying to include these systems as part of your\
    \ team’s ETL project can be viewed as meddling. It is better to get the source\
    \ and target teams to agree with your assessment rather than usurping systems\
    \ that are others’ responsibility.\n\nWith this introduction, we can look at a\
    \ simple PDCA example. Let’s say that after the first week of execution, you analyze\
    \ your log files for the five jobs you run each evening. Using your reporting\
    \ tool, you graph your execution times in seconds (see Table [8-1](#486629_1_En_8_Chapter.xhtml#Tab1)\
    \ and the corresponding line graph in Figure [8-4](#486629_1_En_8_Chapter.xhtml#Fig4)).\n\
    \n**Table 8-1** Execution Times (sec.) of Jobs per Day\n\n| JobName | Monday |\
    \ Tuesday | Wednesday | Thursday | Friday | Saturday | Sunday |\n| --- | --- |\
    \ --- | --- | --- | --- | --- | --- |\n| Job 1 | 30 | 29 | 28 | 30 | 33 | 28 |\
    \ 28 |\n| Job 2 | 22 | 24 | 24 | 21 | 21 | 22 | 24 |\n| Job 3 | 18 | 18 | 18 |\
    \ 18 | 17 | 19 | 18 |\n| Job 4 | 67 | 52 | 79 | 87 | 47 | 30 | 30 |\n| Job 5 |\
    \ 32 | 35 | 35 | 35 | 33 | 27 | 35 |\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig4_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig4_HTML.jpg)\n\
    \n**Figure 8-4** Job Execution Day by Time (s)\n\nBy looking at the day-over-day\
    \ variability, we can see there’s something unusual with Job 4. It seems like\
    \ its timing from start to finish is much higher than the other jobs on our list.\
    \ Of course, timing is only one factor to consider, and there may be other issues\
    \ to explore. But as a first pass, a suitable candidate for improvement is with\
    \ Job 4 and its above-average timing.\n\nWith this observation in place, you’re\
    \ now ready to start your PDCA analysis:\n\n- **Plan:** Figure out what is causing\
    \ Job 4 to have this variability. To do this, set up additional timers in your\
    \ code and track across the next several days. Is this issue consistent or just\
    \ a bump in the road due to some unrelated issue like a network delay? Are there\
    \ any particular data points that may be tying up the system or any part of the\
    \ code that seems to take longer than others?\n\nTo show our Plan step in action,\
    \ let’s look at Job 4 execution times over a week. We’ll use a bar chart to see\
    \ our pattern (see Figure [8-5](#486629_1_En_8_Chapter.xhtml#Fig5)).\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig5_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig5_HTML.jpg)\n\
    \n**Figure 8-5** Job 4 Execution Day by Time (s)\n\nWe can interpret from the\
    \ chart that Monday, Wednesday, and Thursday took a longer time to execute and\
    \ that the scores seem to have a high amount of variability day over day. For\
    \ those of you into statistics, our average over the week is 56 seconds, with\
    \ a standard deviation of 22.58. In other words, we could expect during that initial\
    \ week to have an execution ranging from 10.8 seconds up to 101.1 seconds about\
    \ 95% of the time. This range is hugely unpredictable and makes it difficult for\
    \ us to estimate our execution time. It could be a big problem as well if our\
    \ data connection forces a timeout due to inactivity.\n\nDuring your analysis\
    \ of the log files, you look at as many metrics as you can. For example, you can\
    \ plot the number of records that were retrieved. Lo and behold, you find that\
    \ these record counts were much higher on Monday, Wednesday, and Thursday than\
    \ the other four days (see Table [8-2](#486629_1_En_8_Chapter.xhtml#Tab2) and\
    \ the corresponding graph of Figure [8-6](#486629_1_En_8_Chapter.xhtml#Fig6)).\n\
    \n**Table 8-2** Job 4 Record Counts by Day\n\n| JobName | Monday | Tuesday | Wednesday\
    \ | Thursday | Friday | Saturday | Sunday |\n| --- | --- | --- | --- | --- | ---\
    \ | --- | --- |\n| Job 4 | 52,175 | 40,508 | 61,541 | 67,773 | 36,613 | 23,370\
    \ | 23,370 |\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig6_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig6_HTML.jpg)\n\
    \n**Figure 8-6** Job 4 Record Counts by Day\n\nIsn’t that interesting? The count\
    \ of records per day seems to correlate almost with the throughput in seconds\
    \ per day. That is, the higher the record count, the longer the job takes to execute.\
    \ Perhaps that’s the issue?\n\n- **Do:** For the Do phase, you’ll think about\
    \ your problem statement and the options for solving it. We’ll start with the\
    \ theory that higher record counts are leading to greater throughput (makes sense,\
    \ right?). What value are we going to use to measure this? Would we want to test\
    \ performance over time, a lower record count, or something else? Really, it’s\
    \ up to you, as this is only testing your hypothesis. If you don’t get the results\
    \ you want, you can always try the different approaches you have in mind.\n\n\
    You want to come up with a shortlist of solutions, and you should pick your best\
    \ option as the one that (a) seems the most likely and (b) is the easiest to implement.\
    \ For example, you could increase the speed of throughput in several ways, like\
    \ activating parallel processing (i.e., pulling back more records from the database).\
    \ Or you could limit the count of records retrieved with some SQL language and\
    \ then execute the job multiple times instead of just once (for example, `SELECT\
    \ LIMIT` keyword and `OFFSET` if you’re using certain types of databases).^([^(123)](#fn123))\n\
    \nAfter weighing the pros and cons and talking with your developers on the likelihood\
    \ and ease of implementation, the team decides that the second option with `LIMIT`/`OFFSET`\
    \ is the best design because it would take longer to enable the parallel processing\
    \ feature and there’s less risk to the overall job—you don’t want to fix one issue\
    \ only to create another. Keep in mind once again that if it doesn’t work, you\
    \ can always choose your plan B, C, or D (whatever letter suits you).\n\n> **Note**\n\
    > \n> (The note section appears to be incomplete in the original text; the above\
    \ content is rendered as provided.)"
  raw: '### Continuous Improvement


    Continuous improvement goes by many names: “rapid improvement,” Kaizen, and incrementalism,^([^(119)](#fn119))
    and is a subset of the general process of improvement posited by W. Edwards Deming
    in the 1950s.^([^(120)](#fn120)) In the realm of data integration, we can boil
    down our definition as “focusing on linear improvement, streamlining work, and
    reducing irrelevancy through automated, scalable solutions.”^([^(121)](#fn121))
    What this means is that by observing and continuously iterating our ETL streams
    to accelerate delivery, we will eventually reach a level of maximum productivity.
    Although achieving total automation would be optimal—the fastest speed with no
    user intervention whatsoever—we acknowledge that there will always be space for
    further improvement.


    Reaching the next level of productivity is a significant driver for our team and
    one that should be at the heart of our integration roadmaps (more on that in Chapter
    [9](#486629_1_En_9_Chapter.xhtml)). For the time being, the easiest way for us
    to determine what requires improvement is through the Plan-Do-Check-Act (PDCA)
    model proposed by Deming and refined by others (see Figure [8-3](#486629_1_En_8_Chapter.xhtml#Fig3)).^([^(122)](#fn122))
    We can break down the acronym as follows:


    *   Plan: Define the problem to be addressed, collect the data, and determine
    the root cause.


    *   Do: Develop a solution, and decide on a measurement to ascertain the effectiveness.


    *   Check: Confirm the results through before-and-after data comparisons.


    *   Act: Document the results, let others know about process changes, and recommend
    for them to address the problems.


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig3_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    PDCA Model


    Keep in mind that our focus for this continuous improvement stays primarily within
    our domain, namely, the ETL process. It is tempting for us to suggest that we
    innovate the source and target side of the house, especially if we find improvements
    needed in that area. Although feedback to these teams is encouraged, trying to
    include these systems as part of your team’s ETL project can be viewed as meddling.
    It is better to get the source and target teams to agree with your assessment
    rather than usurping systems that are others’ responsibility.


    With this introduction, we can look at a simple PDCA example. Let’s say that after
    the first week of execution, you analyze your log files for the five jobs you
    run each evening. Using your reporting tool, you graph your execution times in
    seconds (see Table [8-1](#486629_1_En_8_Chapter.xhtml#Tab1) and the corresponding
    line graph in Figure [8-4](#486629_1_En_8_Chapter.xhtml#Fig4)).


    Table 8-1


    Execution Times (sec.) of Jobs per Day


    | JobName | Monday | Tuesday | Wednesday | Thursday | Friday | Saturday | Sunday
    |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Job 1 | 30 | 29 | 28 | 30 | 33 | 28 | 28 |

    | Job 2 | 22 | 24 | 24 | 21 | 21 | 22 | 24 |

    | Job 3 | 18 | 18 | 18 | 18 | 17 | 19 | 18 |

    | Job 4 | 67 | 52 | 79 | 87 | 47 | 30 | 30 |

    | Job 5 | 32 | 35 | 35 | 35 | 33 | 27 | 35 |


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig4_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Job Execution Day by Time (s)


    By looking at the day-over-day variability, we can see there’s something unusual
    with Job 4\. It seems like its timing from start to finish is much higher than
    the other jobs on our list. Of course, timing is only one factor to consider,
    and there may be other issues to explore. But as a first pass, a suitable candidate
    for improvement is with Job 4 and its above-average timing.


    With this observation in place, you’re now ready to start your PDCA analysis:


    *   Plan: Figure out what is causing Job 4 to have this variability. To do this,
    set up additional timers in your code and track across the next several days.
    Is this issue consistent or just a bump in the road due to some unrelated issue
    like a network delay? Are there any particular data points that may be tying up
    the system or any part of the code that seems to take longer than others?


    To show our Plan step in action, let’s look at Job 4 execution times over a week.
    We’ll use a bar chart to see our pattern (see Figure [8-5](#486629_1_En_8_Chapter.xhtml#Fig5)).


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig5_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Job 4 Execution Day by Time (s)


    We can interpret from the chart that Monday, Wednesday, and Thursday took a longer
    time to execute and that the scores seem to have a high amount of variability
    day over day. For those of you into statistics, our average over the week is 56
    seconds, with a standard deviation of 22.58\. In other words, we could expect during
    that initial week to have an execution ranging from 10.8 seconds up to 101.1 seconds
    about 95% of the time. This range is hugely unpredictable and makes it difficult
    for us to estimate our execution time. It could be a big problem as well if our
    data connection forces a timeout due to inactivity.


    During your analysis of the log files, you look at as many metrics as you can.
    For example, you can plot the number of records that were retrieved. Lo and behold,
    you find that these record counts were much higher on Monday, Wednesday, and Thursday
    than the other four days (see Table [8-2](#486629_1_En_8_Chapter.xhtml#Tab2) and
    the corresponding graph of Figure [8-6](#486629_1_En_8_Chapter.xhtml#Fig6)).


    Table 8-2


    Job 4 Record Counts by Day


    | JobName | Monday | Tuesday | Wednesday | Thursday | Friday | Saturday | Sunday
    |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Job 4 | 52,175 | 40,508 | 61,541 | 67,773 | 36,613 | 23,370 | 23,370 |


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig6_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    Job 4 Record Counts by Day


    Isn’t that interesting? The count of records per day seems to correlate almost
    with the throughput in seconds per day. That is, the higher the record count,
    the longer the job takes to execute. Perhaps that’s the issue?


    *   Do: For the Do phase, you’ll think about your problem statement and the options
    for solving it. We’ll start with the theory that higher record counts are leading
    to greater throughput (makes sense, right?). What value are we going to use to
    measure this? Would we want to test performance over time, a lower record count,
    or something else? Really, it’s up to you, as this is only testing your hypothesis.
    If you don’t get the results you want, you can always try the different approaches
    you have in mind.


    You want to come up with a shortlist of solutions, and you should pick your best
    option as the one that (a) seems the most likely and (b) is the easiest to implement.
    For example, you could increase the speed of throughput in several ways, like
    activating parallel processing (i.e., pulling back more records from the database).
    Or you could limit the count of records retrieved with some SQL language and then
    execute the job multiple times instead of just once (for example, SELECT LIMIT
    keyword and OFFSET if you’re using certain types of databases).^([^(123)](#fn123))


    After weighing the pros and cons and talking with your developers on the likelihood
    and ease of implementation, the team decides that the second option with LIMIT/OFFSET
    is the best design because it would take longer to enable the parallel processing
    feature and there’s less risk to the overall job—you don’t want to fix one issue
    only to create another. Keep in mind once again that if it doesn’t work, you can
    always choose your plan B, C, or D (whatever letter suits you).


    Note'
  trans: "\n### 持续改进\n\n持续改进有多种名称：“快速改进”、Kaizen（改善）和渐进主义，^(¹¹⁹) 它是 W. 爱德华兹·戴明在 20\
    \ 世纪 50 年代提出的总体改进过程的一个子集。^(¹²⁰) 在数据集成领域，我们可以将定义简化为“专注于线性改进、简化工作流，并通过自动化、可扩展的解决方案减少无关内容”。^(¹²¹)\
    \ 这意味着，通过观察并持续迭代我们的 ETL 流以加速交付，我们将最终达到最大生产力水平。尽管实现完全自动化（即在没有任何用户干预的情况下达到最快速度）是最理想的，但我们承认，总会有进一步改进的空间。\n\
    \n达到下一级生产力是我们团队的重要驱动力，也应当是我们集成路线图的核心（更多内容见第 9 章）。目前，我们判断哪些方面需要改进的最简单方法，是通过戴明提出并由他人完善的“计划-执行-检查-处理”（PDCA）模型（见图\
    \ 8-3）。^(¹²²) 我们可以将这一缩写分解如下：\n\n- **计划：** 定义要解决的问题，收集数据，并确定根本原因。\n- **执行：** 制定解决方案，并决定用于衡量有效性的指标。\n\
    - **检查：** 通过数据的前后对比来确认结果。\n- **处理：** 记录结果，告知他人流程变更，并建议他们解决问题。\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig3_HTML.jpg](img/486629_1_En_8_Fig3_HTML.jpg)\n\
    \n**图 8-3** PDCA 模型\n\n请记住，我们对持续改进的关注主要集中在我们自己的领域内，即 ETL 过程。我们很容易想要改善源端和目标端，尤其是在发现这些领域需要改进的时候。尽管我们鼓励向这些团队提供反馈，但试图将这些系统纳入你团队的\
    \ ETL 项目可能会被视为多管闲事。更好的做法是让源端和目标端团队同意你的评估，而不是越权处理他人负责的系统。\n\n有了这个介绍，我们可以看一个简单的\
    \ PDCA 示例。假设在运行第一周后，你分析了每晚运行的五项作业的日志文件。使用报告工具，你可以绘制出以秒为单位的执行时间图（见表 8-1 及图 8-4\
    \ 中的对应折线图）。\n\n**表 8-1** 每日作业执行时间（秒）\n\n| 作业名称 | 星期一 | 星期二 | 星期三 | 星期四 | 星期五 |\
    \ 星期六 | 星期日 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 作业 1 | 30\
    \ | 29 | 28 | 30 | 33 | 28 | 28 |\n| 作业 2 | 22 | 24 | 24 | 21 | 21 | 22 | 24 |\n\
    | 作业 3 | 18 | 18 | 18 | 18 | 17 | 19 | 18 |\n| 作业 4 | 67 | 52 | 79 | 87 | 47 |\
    \ 30 | 30 |\n| 作业 5 | 32 | 35 | 35 | 35 | 33 | 27 | 35 |\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig4_HTML.jpg](img/486629_1_En_8_Fig4_HTML.jpg)\n\
    \n**图 8-4** 按日统计的作业执行时间（秒）\n\n通过查看逐日变化，我们可以发现作业 4 有些不寻常。它从开始到结束的时间似乎比列表中的其他作业要长得多。当然，时间只是需要考虑的一个因素，可能还有其他需要探索的问题。但作为初步筛选，作业\
    \ 4 及其高于平均的时间是一个合适的改进候选对象。\n\n有了这个观察结果，你现在就可以开始你的 PDCA 分析了：\n\n- **计划：** 找出导致作业\
    \ 4 出现这种变化的原因。为此，在你的代码中设置额外的计时器，并在接下来的几天里进行追踪。这个问题是持续存在的，还是仅仅因为某些不相关的问题（如网络延迟）而出现的暂时波动？是否有特定的数据点导致系统卡顿，或者代码的某一部分看起来比其他部分耗时更长？\n\
    \n为了展示我们“计划”步骤的实际操作，让我们看看作业 4 在一周内的执行时间。我们将使用柱状图来观察模式（见图 8-5）。\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig5_HTML.jpg](img/486629_1_En_8_Fig5_HTML.jpg)\n\
    \n**图 8-5** 作业 4 按日统计的执行时间（秒）\n\n我们可以从图表中解读出，星期一、星期三和星期四的执行时间更长，而且这些数值似乎每天都有很大的变化。对于喜欢统计分析的人来说，我们这一周的平均时间是\
    \ 56 秒，标准差为 22.58。换句话说，在最初那一周，我们有 95%的把握预期执行时间会在 10.8 秒到 101.1 秒之间。这个范围非常不可预测，使得我们很难预估执行时间。如果我们的数据连接因不活动而超时，这也可能是一个大问题。\n\
    \n在分析日志文件的过程中，你要尽可能多地查看指标。例如，你可以绘制检索到的记录数。果然，你发现星期一、星期三和星期四的记录数远高于其他四天（见表 8-2\
    \ 及图 8-6 中的对应图表）。\n\n**表 8-2** 作业 4 每日记录数\n\n| 作业名称 | 星期一 | 星期二 | 星期三 | 星期四 |\
    \ 星期五 | 星期六 | 星期日 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 作业 4\
    \ | 52,175 | 40,508 | 61,541 | 67,773 | 36,613 | 23,370 | 23,370 |\n\n![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig6_HTML.jpg](img/486629_1_En_8_Fig6_HTML.jpg)\n\
    \n**图 8-6** 作业 4 每日记录数\n\n这很有趣，不是吗？每日记录数似乎与每日的吞吐量（以秒计）几乎呈正相关。也就是说，记录数越高，作业执行时间就越长。也许这就是问题所在？\n\
    \n- **执行：** 在“执行”阶段，你需要思考你的问题陈述以及解决问题的方案。我们将从“较高的记录数导致较高的吞吐量”这一假设开始（这说得通，对吧？）。我们将使用什么值来衡量这一点？是想测试随时间变化的性能、较低的记录数，还是其他指标？实际上，这完全取决于你，因为这只是在测试你的假设。如果你没有得到想要的结果，你总可以尝试你想到的其他不同方法。\n\
    \n你需要列出一个候选解决方案的短名单，并选择你认为最佳的方案，它应满足（a）看起来最有可能和（b）最容易实现这两个条件。例如，你可以通过多种方式提高吞吐速度，例如启用并行处理（即从数据库中拉回更多记录）。或者，你可以使用一些\
    \ SQL 语句限制检索的记录数，然后多次执行该作业而不是仅执行一次（例如，如果你使用某些类型的数据库，可以使用 `SELECT LIMIT` 关键字和 `OFFSET`）。^(¹²³)\n\
    \n在权衡利弊并与你的开发人员讨论其可能性及实施难易程度后，团队决定第二个使用 `LIMIT`/`OFFSET` 的方案是最佳设计，因为启用并行处理功能需要更长时间，并且对整个作业的风险也更低——你不想为了修复一个问题而制造另一个问题。再次提醒，如果它不起作用，你总是可以选择你的\
    \ B、C 或 D 方案（随便哪个字母都行）。\n\n> **注意**\n> \n> （原始文本中的注释部分似乎不完整；以上内容按原文提供。）\n"
- fmt: 'When designing your solutions, you''re going to want to have a precise measurement
    in mind. For instance, if we''re trying to limit the records returned, you don''t
    want to make it too high as it could grind your system to a halt, but you also
    don''t want to be too conservative that you have 15 separate executions carrying
    only 5000 records. Think of it like being Goldilocks, but with data instead of
    porridge and your ETL code instead of bears. Pick a target value and stick with
    it.


    We''ve talked it over and would like each execution to take about 30 seconds.
    Sure, we''ll launch the job multiple times a day, but we''ll have predictability
    instead of variability; that''s where we want our continuous improvement to take
    us.


    - **Check**: Once you''ve made the updates to your code, you''re ready to test
    in your Staging environment. Create data that matches what you might typically
    receive and then execute and replot.


    We''ve got a good data generator and can create fake data that matches the counts
    we received that first week. If you don''t have a good data generator, check out
    two online apps Mockaroo (<https://www.mockaroo.com/>) and Generate Data (<http://www.generatedata.com/>).
    These tools allow you to save data in several formats and even automate scripts
    if you have the technical know-how.


    To review our strategy: Rather than running our job just once a day, we now will
    run multiple times a day with 25,000 records each. Table [8-3](#486629_1_En_8_Chapter.xhtml#Tab3)
    shows the breakdown of test record counts executed in parallel.


    **Table 8-3** Test Record Counts Executed in Parallel


    | JobName | Test Day 1 | Test Day 2 | Test Day 3 | Test Day 4 | Test Day 5 | Test
    Day 6 | Test Day 7 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Job 4 #1 | 25,000 | 25,000 | 25,000 | 25,000 | 25,000 | 23,370 | 23,370 |

    | Job 4 #2 | 25,000 | 15,508 | 25,000 | 25,000 | 11,613 | | |

    | Job 4 #3 | 2,175 | | 11,541 | 17,773 | | | |

    | **TOTAL** | **52,175** | **40,508** | **61,541** | **67,773** | **36,613** |
    **23,370** | **23,370** |


    In this simulated dataset, you''ll notice three modifications. First, we''re not
    tracking days, but rather test executions. This approach accelerates our time
    to deliver. Second, the cumulative total of jobs we run per "day" is equal to
    our original record count. This technique provides like-for-like comparisons.
    Third, the execution will not need to run if we use up our test records before
    reaching the 25,000 record limit. For example, Test Day 2 only had 40,508 records.
    The first execution consists of 25,000, and the second is equal to the remaining
    `40,508 – 25,000 = 15,508`. There''s no need for a third execution.


    We''ve picked 25,000 because that seems like a good starting point—not too much
    and also not too little. Plus, it looks like our Saturday and Sunday jobs in our
    original execution (Figure [8-5](#486629_1_En_8_Chapter.xhtml#Fig5)) took about
    30 seconds to run, and that meets our target goal.


    Displaying this dataset as a stacked bar chart reveals the same shape as previously
    graphed (see Figure [8-7](#486629_1_En_8_Chapter.xhtml#Fig7)).


    ![../images/486629_1_En_8_Chapter/486629_1_En_8_Fig7_HTML.jpg](images/486629_1_En_8_Chapter/486629_1_En_8_Fig7_HTML.jpg)


    **Figure 8-7** Cumulative Record Count by Test Day


    To confirm the processing speed, we gather each execution time from our log files
    (see Table [8-4](#486629_1_En_8_Chapter.xhtml#Tab4)).


    **Table 8-4** Test Record Times (sec.) Executed in Parallel


    | JobName | Test Day 1 | Test Day 2 | Test Day 3 | Test Day 4 | Test Day 5 | Test
    Day 6 | Test Day 7 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Job 4 #1 | 30 | 29 | 28 | 30 | 33 | 28 | 28 |

    | Job 4 #2 | 31 | 20 | 29 | 28 | 18 | | |

    | Job 4 #3 | 7 | | 18 | 24 | | | |


    Now, our sets of 25,000 records per execution appear to be much more stable. If
    we were to summarize that first job run, we would average 29.43 records with a
    standard deviation (variability) of 1.81. That is, 95% of the time during these
    test days, we will expect to have execution times between 25.80 and 33.05. That
    measurement is more constrained than our original set and allows us to have a
    fair amount of predictability on our performance going forward.


    - **Act**: Remember, this is only one analysis, and no production changes have
    been implemented. But you have a lot of numbers and measurements to share with
    the source and target team members and guidance for the next process upgrade.
    Let them know the effort it will take to perform this improvement, get a consensus
    that the direction you chose is the correct one (is 30 seconds for this job too
    short? Is it too much?), and—once approved—start revising your documentation with
    the new changes and deployment schedule.


    ## Month One: Post-deployment


    One week may not be enough time to trace your improvement plans, and after the
    first month, the system is humming along, you''ve identified some work through
    PDCA that might streamline your processes, and you continue a backlog of updates
    based on feedback and personal observations. Stakeholders are already talking
    about the "next big thing," and management has asked you to position your team
    to discuss the future migrations and integrations. At this point, you may be asking
    yourself, "Where is this going? What''s my next step?" The answer is a nondefinitive
    "many places." You''ve reached the point where you have to decide on whether you
    keep the status quo by maintaining help desk support and supporting the occasional
    upgrade or if it''s time to push forward and expand your organization''s level
    of data and governance. For that, we''ll need to discuss the Data Management Maturity
    (DMM) model.'
