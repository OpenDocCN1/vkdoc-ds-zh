    that will best fit your integration needs.


    ## ETL Vs. ELT


    Let me start by suggesting that you interpret the acronym ETL as literal. That
    is, you are performing straight **e**xtraction, **t**ransformation, and **l**oading
    operations. In Figure [5-1](#486629_1_En_5_Chapter.xhtml#Fig1), you can see the
    “not-so-simple” diagram for the ETL and the corresponding components we discussed
    in Chapter [2](#486629_1_En_2_Chapter.xhtml).


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig1_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    The Not-So-Simple ETL Diagram Revisited


    ETL, in its pure form, indicates that we are pulling data from the source (extracting),
    performing some operation on the data to either change or manipulate its flow
    (transformation), and then pushing the latest version of this data into the target
    (loading).


    It is also possible to reverse the transformation-load sequence so that you have
    a designation called extraction, loading, and transformation (ELT) . In the ELT
    approach, after the data is extracted, the data source values are moved into a
    single, centralized data repository, which can be computed on the fly into analytic
    reporting systems (see Figure [5-2](#486629_1_En_5_Chapter.xhtml#Fig2)). In the
    old days (i.e., a decade ago), this would have been challenging due to processing
    and scalability issues, but with today’s cloud-based infrastructure mixed with
    Big Data tools such as Hadoop, systems can support ample storage and scalable
    compute.^([^(84)](#fn84))


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig2_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    The ELT Process (Proposed)


    The ELT process is still evolving but is referenced frequently enough in recent
    documents that it’s worth mentioning. We won’t be delving into this design for
    the remainder of this book, but I recommend that teams keep one eye open for technologies
    and skillsets that could incorporate this model. The promise of unlimited, on-demand
    access to entire datasets is tantalizing and one which many executives and BI
    personnel will want to explore further.


    ## ETL As Middleware


    It’s important to note that while an ETL tool often exists separately from the
    source and target systems, it is not always the case. It is quite possible to
    have an ETL process that lives within the source system, such as a web service
    that propels data directly to an external endpoint, or within the target system,
    such as a shared process that pulls data from the source. Simple solutions are
    essential for these types of projects. Keep in mind, however, that although your
    system may have embedded hooks from the source to the target without the need
    for middleware, it is the *concept* of ETL with which we are concerned. Your solution
    will need to be something that can handle the ease of movement alongside the ease
    of transformation; and, in whatever way you want to design it, the ETL sequence
    will remain consistent.


    ## The Components of ETL: Choosing the Right Tool


    At this point, we’ve talked about ETL processing at a high level. But how do these
    three components work individually and then tie together to form a complete process
    flow? Breaking down these components into their workstreams will enable us to
    consider the right type of product for the correct kind of project. In other words,
    what are the main benefits to look for when designing your solution? Figure [5-3](#486629_1_En_5_Chapter.xhtml#Fig3)
    shows a breakdown of the sample ETL flow.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig3_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Breakdown of the ETL Process: Choosing the Right Tool


    ### Extraction


    Our process starts when we first retrieve the data from our source system. Like
    all things integration related, there are a few concepts to consider when choosing
    the right ETL tool, including establishing connectors, storing temporary data,
    and validating inbound data.


    ### Establishing Connectors


    In the first stage, extraction, data is retrieved from the source systems—cloud,
    document, database—via a connector. A connector is a way to connect with the many
    disparate sources that exist in modern organizations.^([^(85)](#fn85)) Generally,
    a connector is a specialized translator that allows one system to read data housed
    in a proprietary system that usually is incompatible. As part of the translation,
    the connector must provide information specific to that proprietary system such
    as a JDBC/ODBC connection string, an endpoint, a port number, a database name,
    a username, a password, and so on; searching against online product documentation
    usually provides the requirements for writing a clean connection string. Vendors
    typically bundle proprietary connectors along with the commercial software, and
    many off-the-shelf ETL tools offer them as part of the complete package. Naturally,
    the more complex and disparate your data sources are, the more connectors you
    will want available.


    ### Storing Temporary Data


    Once the connection is established, the requested data is retrieved and is stored
    in what we call the temporary staging area.^([^(86)](#fn86)) On do-it-yourself
    types of migrations, this staging area could be any number of temporary processing
    repositories like database tables, CSV files, or spreadsheet files. In the case
    of most third-party ETL tools, it’s a temporary buffer selected and maintained
    by the ETL tool itself.


    Some concerns may arise during this step of the process as temporary data, often
    referred to as “data in transit”,^([^(87)](#fn87)) may contain Personally Identifiable
    Information (PII) related to customers, accounts, or other secured information.^([^(88)](#fn88))
    Of course, security is a concern across your enterprise, but this level of exposure
    is particularly susceptible during the extraction-storage process. To keep your
    data from prying eyes, make sure that the solution either (a) restricts the amount
    of sensitive data you are storing, (b) secures the data in motion using proper
    encryption techniques, or (c) houses the temporary data behind a firewall on a
    secure system accessible by only your most trusted personnel. Be careful not to
    be too extreme, however, as locking down too much of your data can be just as
    troublesome as leaving it completely open. The chosen ETL solution should be able
    to help you find the right balance between too much and too little, so keep this
    in mind when researching the alternatives.


    For some additional thoughts on this topic, refer to [*https://www.helpnetsecurity.com/2016/10/25/securing-data-in-motion/*](http://www.helpnetsecurity.com/2016/10/25/securing-data-in-motion/)^([^(89)](#fn89))
    and [*https://pulse.microsoft.com/en-ie/technology-lifestyle-en-ie/na/fa3-data-in-motion-how-to-protect-it-5-key-considerations/*](https://pulse.microsoft.com/en-ie/technology-lifestyle-en-ie/na/fa3-data-in-motion-how-to-protect-it-5-key-considerations/).^([^(90)](#fn90))'
