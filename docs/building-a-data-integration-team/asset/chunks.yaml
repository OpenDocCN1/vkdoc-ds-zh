- fmt: "### Meetups\n\nProbably the best way to begin is by finding people who are\
    \ interested in the same topics as you. Merriam-Webster defines a \"meetup\" as\
    \ \"an informal meeting or gathering.\"^([^(148)](#fn148)) In the early 2000s,\
    \ the word became synonymous with a free social network web site, `Meetup.com`,\
    \ that enables users to organize meetings in a local area.^([^(149)](#fn149))\
    \ `Meetup.com` is an excellent resource for meeting new people, practicing a language,\
    \ teaching a class, or marketing a brand. The groups you choose to follow will\
    \ cover just about any topic out there. Still, if you can’t find what you want,\
    \ you can always start a new group with only a few clicks.\n\n### Joining `Meetup.com`\n\
    \n- For our current discussion, you’ll want to use data-savvy search words like\
    \ \"migration,\" \"integration,\" \"analytics,\" or \"reporting.\" If none of\
    \ these appear as a result, then you may want to consider organizing the event\
    \ by clicking the \"Start a new group\" link and answering the steps that follow.\n\
    - Go to \"Meetup.com\" and click the \"Log in\" link (see Figure 9-5). There are\
    \ multiple ways to sign up through `Facebook`, `Google`, or email. Once verified,\
    \ you can begin exploring your way through the groups and events that are available\
    \ in your area.\n\n![../images/486629_1_En_9_Chapter/486629_1_En_9_Fig5_HTML.jpg](images/486629_1_En_9_Chapter/486629_1_En_9_Fig5_HTML.jpg)\n\
    \n*Figure 9-5*  \n*`Meetup.com` Home Page*\n\n> **Caution**  \n> Meetups are a\
    \ lot of fun and a great way to meet people with similar interests. Be careful,\
    \ though. Initially, I applied to more than a dozen topics surrounding data integration,\
    \ warehousing, and reporting, expecting that I would be able to socialize in all\
    \ of them. As it turned out, being spread too thin was just as bad as not having\
    \ enough choices. I would recommend you decide your priorities and the goal of\
    \ your meetup approach and then go all out to make it happen.\n\n### Networking\
    \ Event\n\nWhile meetups can be fun and informative, they are also apt to be slightly\
    \ more social than professional networking events in which the goals are more\
    \ about building business relationships and trust and not necessarily boosting\
    \ your social status, swapping business cards, or finding the next big event in\
    \ town.^([^(150)](#fn150)) Professional networking, in this case, is something\
    \ that can involve lifelong relationships. According to a post by author Anders\
    \ Ostlund,^([^(151)](#fn151)) networking has many benefits:\n\n- To gain knowledge\
    \ and information on a product or service to which you might usually not have\
    \ access\n- To be perceived as the subject matter expert in a field of business\n\
    - To create new professional relationships and strengthen existing ones\n- To\
    \ increase trust among business peers\n- To make sure that people know who you\
    \ are, what you do, how you do it, and what you want to achieve by doing it\n\
    - To establish you and your teams as an authority\n\nProfessional networking feeds\
    \ upon itself. You may make an effective presentation to your networking group,\
    \ and one of those members may, in turn, ask you to speak to another group about\
    \ that topic. This domino effect can lead to more followers and access to more\
    \ events and may elevate your team as the \"go-to\" group when it comes to building\
    \ and maintaining migrations. The many skills you develop from this activity—mastering\
    \ small talk, sharing content, creating relationships—can last with you across\
    \ your career and help enhance your teams’ brand in the marketplace.\n\nEvents\
    \ come in all shapes and sizes, ranging from trade fairs to after-work happy hours\
    \ to conferences (which we’ll discuss next). The best way to get started is to\
    \ use your favorite search engine and type the phrase \"professional networking\
    \ events in my area.\" You’ll most likely get enough results to keep you busy\
    \ for a while.\n\nAlthough professional networking can favor the extroverts, if\
    \ you are shy or uncomfortable about meeting new people, show up anyway. At some\
    \ point, the conversation is likely to drift into your territory, and it is there\
    \ that you’ll be able to shine or, at the very least, impart some knowledge about\
    \ your team and what they do.\n\n### Conferences\n\nConferences are perhaps the\
    \ most significant networking events in an industry with most of the benefits\
    \ that professional networking entails. However, these types of gatherings often\
    \ are much larger and complex than local events, occur less frequently, and involve\
    \ speakers, sponsors, and other representatives who sell products, educate, and\
    \ provide technological insight. The conferences may last a few days or up to\
    \ a week. Like all good networking events, its purpose is to create enthusiasm\
    \ and inspiration and enable the attendee to feel much wiser at the end of the\
    \ sessions.\n\nFor all its glitz, glamour, and good food, the main reason people\
    \ attend conferences is the same as other networking events except that the outreach\
    \ is much more extensive.^([^(152)](#fn152)) One of the most significant events\
    \ in North America is Salesforce’s annual Dreamforce conference, with more than\
    \ 170,000 participants.^([^(153)](#fn153)) Against those types of numbers, you\
    \ potentially would be associating with people from all over the world and in\
    \ all professions. Conferences are exciting and a great way to engage yourself\
    \ in the industry. If planned right, the takeaways will work wonders for guiding\
    \ your integration team and gaining momentum for the next steps.\n\nOf course,\
    \ many people go to conferences with no clear strategy or intention. Yes, there\
    \ can be socializing, and there can be taking a break from work. If those are\
    \ your goals, then that’s fine. But for actual growth, what you want to do is\
    \ promote your team, your company, and the services you offer. Go with that professional\
    \ goal in mind, get lots of business cards, and show pride in who and what you\
    \ represent."
