    \ `date_purchased` | `SQLITE` | `BUYER` | `DATE_PURCHASED` | 直接转换，格式为 `YYYY-MM-DD`,\
    \ 转换格式为 `YYYY-MM-DD` |\n\n这个列表的结果是相同的，你可以将它们交给开发者，让他们构建到 ETL 流程的第一个迭代中。\n\n###\
    \ 数据迁移流程设计\n\n与设计相关的所有内容都汇聚在一起了。有了 STTM，你现在可以编写大部分 ETL 脚本，但你也需要合理安排开发顺序。例如，如果没有表格来接收数据，你就无法开始将数据加载到数据库中；这部分必须先完成。记录你将执行的操作顺序被称为“数据迁移流程设计”，它作为一个很好的检查清单，确保在需要时启动正确的部分。\n\
    \n对于我们的原型，数据迁移流程可以简单地进行图形化和描述（见图 6-5）。对于高级迁移，确实需要更多的思考，但原理是相同的。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig5_HTML.jpg](img/486629_1_En_6_Fig5_HTML.jpg)\n\
    \n**图 6-5  \n数据迁移流程图**\n\n在这个步骤列表中，你会看到我们已经考虑了如何在源和目标之间处理我们的数据；知道先添加什么；知道提取、转换和加载什么；以及随后如何处理任何异常。与我们所有其他文档一样，任何最后一刻的添加或修改都可以追加到模型中，指导我们的开发人员在其相关代码中进行更新。\n\
    \n### 开发与实施\n\n我们现在清楚地了解了流程将如何运作，而且到目前为止，我们还没有编写一行代码。最后，我们来到了开发人员将接手我们迄今为止所有文档的技术内容，并开始编写\
    \ ETL 脚本的阶段。当然，工作也可以在 STTM 完成后立即开始，任何耗时的转换都可以在更早的阶段进行研究。\n\n**注意**\n\n如果你好奇，构建这个特定\
    \ ETL 脚本从开始到结束究竟需要多长时间，这取决于几个因素：转换的复杂性、对 ETL 工具和默认脚本语言的熟悉程度、数据可访问性，以及我们在第 5 章中讨论的任何其他变化因素。\n\
    \n假设开发团队每日进行站会和代码同行评审，那么假设一个冲刺周期后（两周），他们就可以准备向你进行演示，该演示将：\n\n1.  将两个文件提取到 PDI\
    \ 中：逗号分隔文件和制表符分隔文件。\n2.  根据 STTM 转换需要操作的字段。\n3.  合并生成的数据集。\n4.  将最终输出插入 SQLite\
    \ 解决方案。\n"
- fmt: '# Getting Ready


    The script itself has already been written, so all you will need to do is test
    it. Even with that boost, you’ll still have to perform some steps to get your
    system ready for testing:


    - Clone the GitHub directory to your local computer.

    - Download and install Pentaho Data Integration (PDI) Community Edition.


    ## Clone the GitHub Directory


    You’ll need to have GitHub installed on your machine. See [`https://gist.github.com/derhuerst/1b15ff4652a867391f03`](https://gist.github.com/derhuerst/1b15ff4652a867391f03)
    for instructions.


    - The location you’ll want to clone is at [*https://github.com/Apress/building-a-data-integration-team.git*](https://github.com/Apress/building-a-data-integration-team.git).

    - The files you’ll be using will be stored in the `chapter6` folder. Ensure that
    when you extract, you have three folders created: `input`, `output`, and `scripts`.


    ## Download and Install PDI (Community Edition)


    To accomplish this step, perform the following:


    1. Go to the web site at [*https://community.hitachivantara.com/s/article/data-integration-kettle*](https://community.hitachivantara.com/s/article/data-integration-kettle).

    2. Read the section “How to get PDI up and running” based on your particular operating
    system (Linux, Windows, macOS).

    3. Under Downloads, select the latest stable version.

    4. Wait for the download to start.

    5. Save the `.zip` file to a directory that you will remember. NOTE: The Pentaho
    download will leave a large footprint of 1 GB. Make sure your computer can support
    this file.

    6. Once finished, unzip the package.

    7. In the new directory, under `data-integration`, double-click the file `spoon.sh`
    (Linux), `spoon.bat` (Windows), or the “Data Integration” application icon (macOS).
    You should see the splash window open. Wait for the application to load.


    > **Note:** If the file does not run on Windows, ensure that you have Java JDK
    installed and added to your `JAVA_HOME` system variable. Go to [`https://www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)
    to download the latest version and confirm the `JAVA_HOME` environment variable
    is correctly set by clicking the Windows Start icon and searching for “Edit System
    Environment Variables.”


    8. Since this is your first time using the application, you will be presented
    with the Welcome window. Click `File/New` or (`CTRL+N`) to open a new transformation
    window (see Figure 6-6).


    ![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig6_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig6_HTML.jpg)


    *Figure 6-6: A New PDI Transformation*


    > **Note:** We’ve chosen to use SQLite as our target database because it is a
    small, self-contained SQL Server engine that is open source and already operational
    with the PDI platform. It is different from most SQL databases in that SQLite
    does not have a separate server process and writes directly to ordinary disk files
    ([*https://www.sqlite.org/about.html*](http://www.sqlite.org/about.html)). You
    won’t have a client application to read the `infomotors.db` data, but you will
    have Pentaho scripts that will allow you to read the file, thereby serving the
    same purpose.


    ## Opening the `create_target_table_buyer` Script


    Although we won’t be discussing how the downloaded scripts were developed, we
    can continue our walkthrough as if we were going to peer-review the code our developers
    created. For starters, while in PDI, click the `File/Open` menu (`CTRL+O` on Windows)
    and navigate to the `chapter6\scripts` directory that you cloned from GitHub.
    Double-click the file `create_target_table_buyer.ktr`.


    - The `create_target_table_buyer` script will open. On the page is a single object—Create
    Table BUYER—which executes the SQL to create our BUYER table. Double-click the
    object to open the “Execute SQL Script” dialog (see Figure 6-7).


    ![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig7_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig7_HTML.jpg)


    *Figure 6-7: The Execute SQL Script*


    - In the “SQL script to execute” window (center of the screen), you’ll see the
    `CREATE TABLE STATEMENT` that our developers added. Above that is a text box labeled
    “Connection.” The value `infomotors.db` represents the connection to our SQLite
    target that we’ve built for our prototype. Click `Edit` if you want to see the
    details of the connection as well as the other out-of-the-box connectors that
    PDI provides. When you finish your review, click `Cancel` twice to return to the
    “Create target BUYER table” home page.


    - At the top of the screen is a play button (see Figure 6-8). Click it to open
    the Run Options dialog box. Then click the `Run` button in that window to create
    the BUYER table (you can see the output results as shown in Figure 6-9).


    ![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig9_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig9_HTML.jpg)


    *Figure 6-9: Confirm That the Step Ran Successfully*


    ![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig8_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig8_HTML.jpg)


    *Figure 6-8: The Run Button*


    - Once completed, select `File/Close` from the menu (`CTRL+W` on Windows) to be
    returned to the main window.'
