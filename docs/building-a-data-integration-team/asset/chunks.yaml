  trans: '

    ### 验证结果数据


    任何数据转换的关键在于确保对数据所做的物理更改能够正确加载到目标系统中。验证结果数据这一环节涵盖了我们必须完成的所有转换工作，包括过滤列、合并查找值、将时间和日期等度量值转换为标准格式，以及将不一致的数据映射为单一单位（例如，用`"1"`代表男性，`"2"`代表女性，`"3"`代表双性人等）。数据验证步骤更侧重于确认数据的处理操作，而非通过数据完整性来检验其是否与源数据匹配。当然，数据验证与数据完整性是相辅相成的，有时很难将这两个概念完全区分开来。下面这个例子或许能帮助你理解：


    我的团队曾参与迁移一个国际电子邮件通信数据库。其中一些通信完全由希腊字符写成，一些由俄语字符，一些由德语字符，还有一些由英语字符。这次迁移相对简单：我们只需获取特定字符集，然后将其从源系统（一个
    Postgres 服务器）通过 ETL 平台（Pentaho）迁移到目标系统（Salesforce）。我们首先发现的一个问题是，无论我们怎么尝试，俄语西里尔字符显示出来都只是乱码，希腊字符也一样。但德语和英语似乎没问题。需要指出的是，在加载过程中我们没有收到任何错误信息。换句话说，一切处理流程都正常执行，只是无法正确显示希腊语和俄语特有的国际字符集。


    我们在测试中发现，原因在于我们在目标系统中选择的字符集；我们使用了 ASCII 拉丁字符集，而本应选择像`UTF-8`这样包含国际符号的字符集（关于`ASCII`与其他编码集使用的精彩解释，请参考[*https://stackoverflow.com/questions/2241348/what-is-unicode-utf-8-utf-16*](https://stackoverflow.com/questions/2241348/what-is-unicode-utf-8-utf-16)）。^(⁹⁴)


    我举这个例子是为了说明数据完整性是如何按设计运作的——我们转换后数据的准确性、完整性和一致性在内容上是匹配的（至少就我们对俄语和希腊语的文字评估而言）。问题出在我们因转换操作而导致的数据验证失误上：我们处理了错误的编码特性，这是
    ETL 工具本身的一个功能。解决方案要求我们同时审视数据完整性（数据本身）和数据验证结果（转换过程本身），做出正确判断，然后通过调整我们的默认字符集来推进工作。


    当你选择 ETL 工具时，要确保它能兼顾数据完整性和数据验证这两个步骤。你需要测试的最关键特性包括：能够通过熟悉的编程语言利用函数快速转换临时数据、能够自动搜索转换后数据中固有的错误、以及能够通过最少的点击或编程步骤来修正这些错误。


    ## 加载


    加载是 ETL 流程的最后阶段，通常也是我们在讨论数据迁移的“一键式”方法时大多数人会联想到的阶段。也就是说，按下一个按钮，数据就会完成全量抽取和转换，从源端移动到目标端。我们知道这不应该成为我们默认的立场，但我们仍然承认，总有一天，在某个时刻，我们的数据会接近那个最终点，届时我们需要迁移数据、设置夜间数据馈送并完成验收。我们离这个目标并不遥远（我们将在第
    7 章中进一步讨论这种“一键式”操作），我总是向我的团队承诺，一旦我们攻克这个难关，我请客喝酒。


    实际上，在加载过程准备收工之前，总是需要一些最终的调整和规划。在本节中，我们将讨论在选择合适的 ETL 工具时需要注意的加载过程的几个特性，例如建立连接器、确定加载类型以及回滚错误。


    ### 建立连接器


    我们将再次讨论连接器这个话题。我们最初在讨论构建抽取阶段时，就牢牢地记住了入站连接器这一专有数据转换器。现在，我们要反向操作：不再是拉取源数据（或为 Web
    服务打开监听器），而是向目标系统插入或更新数据。然而，抽取连接器和加载连接器之间的一个巨大区别是*时间*。我们可能有多个入站事务源，但（在大多数情况下）只有一个出站目标，数据在我们的管道中不断累积，这使得出站加载的时间远比数据检索要长得多。


    举个例子，假设我们有五个源系统，每个系统有 100 万条记录。每个系统的数据都可以在五周内抽取、转换并简档到我们的中间件服务器中。五周结束时，我们准备在一个晚上将
    500 万条记录一次性加载到目标系统中。因此，我们花了五周时间移动 500 万条记录，但花费的时间主要用于评估，而非实际执行加载。如果我们的连接器不支持批量并行加载（比如
    Oracle SQL\*Loader 或 SQL Server BCP），那么我们在加载阶段就会因为*时间*不够而遇到麻烦（见图 5-4）。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig4_HTML.jpg](img/486629_1_En_5_Fig4_HTML.jpg)


    图 5-4


    批量加载到目标系统


    关键在于，要清楚我们需要加载多少数据，以及我们的 ETL 解决方案开箱即用能支持什么。如果我们在图 5-4 的沙漏中已经没有时间余地，我们就需要错开加载时间，或许比最初设想的更早开始加载。只要团队其他成员都同意时间因素对加载周期的影响，这种方法就无可厚非。与其因为错误的假设而导致时间不够，不如尽早开始这个阶段。


    ### 确定加载类型


    我们在前一章已经讨论过加载类型，这里就不再赘述。加载类型指的是我们是立即加载整个数据集（初始加载或一次性迁移），还是针对已有数据库执行迭代式的更新插入操作（增量加载）。你选择的
    ETL 工具应具备有助于确定所需加载类型的功能。例如，我们曾在一个项目中使用过一个工具，它非常擅长快速创建新的一次性迁移，并在相对较短的时间内完成数据的抽取、转换和加载。然而，该
    ETL 工具的调度功能存在欠缺，导致我们难以每天从源系统中准确提取出增量数据（更新）。在未能使其适应正确的调度要求后，我们不得不放弃这个工具，并寻找另一个更擅长执行夜间增量加载的新工具。利益相关方勉强同意了我们的决定，但幸运的是，他们手上已经有几个
    ETL 产品在使用中，我们只需申请一个新许可证即可。而当你所在的组织，在你鼓吹某个产品的优点后，又因为发现它缺少那些事后看来可能很明显的关键特性而需要切换到另一个新产品时，他们可能会采取不同的态度。是的，这种想法上的转变确实会时不时地发生，但发生时总归是令人尴尬的。

    '
- fmt: '### Rolling Back Errors


    I know you’re going to argue that with the amount of documentation, profiling,
    validation, and testing, your loads are going to proceed just fine with no errors.
    I also know you know I write that with sarcasm.


    Errors will happen, more than you’d like, but less than you’d think. And, because
    of the terrific work you’ve done with all that documentation, profiling, validation,
    and testing, you’ll most likely know precisely when and why it happened. Nine
    times out of ten, it will be due to something mostly out of your control, like
    an errant record excluded from your testing environment or something more insidious
    like a network timeout error over which you quite honestly have no control. Of
    course, you will have the occasional random issues (“whoops, missed that in my
    exception logic”) and, at that point, chalk it up to a simple mistake, roll back
    the load, install a fix, and redeploy.


    The ETL tool you choose should possess some of the features related to rollback
    or at least those that will help you track your data errors such as a running
    count of successes and failures, log files representing times and timeouts, and
    some semblance of what records failed and why—most database insert errors consist
    of the data and cause of the issue. Although the ETL tool does not necessarily
    need to have features that clean the target and reset for a new deployment, providing
    the ability for teams to track and recover gracefully from errors in a timely
    fashion should be a consideration.


    ## Tools on the Market


    We’ve discussed the tenants for architecting our ETL process and making the right
    choice in tools. For the rest of the chapter, let’s talk about several of the
    ETL tools on the market today and their capabilities, pros, and cons. Before we
    begin, however, let me go over a few caveats, lest I write an opinion that will
    leave others with hurt feelings, angry emails, and, most importantly, negative
    reviews of this book and attacks on my character (which, arguably, might be the
    same thing):


    1. The tools I’ve chosen to list are based on my own experience and do not represent
    any affiliation with any of the respective vendors. I’ve used them for professional
    development and believe I am in a position to evaluate them. There are many, many
    ETL tools on the market (Gartner Research has a detailed summary of those both
    in the cloud and on premise, so if you’re looking for some pure research guidelines,
    check out the latest by searching the term “Gartner magic quadrant for data integration
    tools”). To identify and repeat what Gartner has already put together, all would
    require more time, pages, and expertise than I could ever hope to communicate.


    2. The purpose of this section is to empower you with a starting point on ETL
    tool discovery. Where possible, I have provided links to these companies’ web
    sites so you can take the reins and continue the evaluations on your own. In other
    words, learn by doing, and if you find something unique, let me know, and I will
    incorporate your findings with my own.


    3. This list is ever-changing, and what we know today will undoubtedly be different
    in five years. For me (and hopefully my editors), this represents a promise to
    write the next edition of this book sooner rather than never.


    If we’re ready then, let’s start by discussing the first of our tools.


    ### Jitterbit


    **Web site:** [`www.jitterbit.com/`](http://www.jitterbit.com/)


    **Review:** Jitterbit was one of the first cloud-based ETL tools I used, and the
    experience was a positive one: using its freemium Salesforce Data Loader, I was
    able to build some excellent, scheduled integrations that took place in the cloud.
    Objects (the Salesforce equivalent of database tables) could be moved in hours,
    not days, using a sophisticated GUI (see Figure [5-5](#486629_1_En_5_Chapter.xhtml#Fig5)).
    We were clear we wanted to use this tool as our database backup system, and it
    served the need well. We were a bit stymied when the integrations became more
    complicated, but as time and technology have advanced, Jitterbit is offering more
    capabilities for API auto-creation and API management, and its future looks promising
    for its base of small and midsize companies. If you’re just starting with ETL
    and the design is not too complicated, definitely explore the trial for this,
    as the company offers both on-premise and cloud-based solutions.


    **Pros:** Simple to configure and deploy with relatively little downtime. Can
    handle a multitude of data connectors, including SAS, Salesforce, database, and
    web services. Technical support is very helpful and willing to answer most questions.


    **Cons:** As integrations become more complex, so does the setup. Documentation
    at the time was sparse, and we did have multiple questions about security for
    cloud-based offerings.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig5_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Jitterbit API Transformation


    ### Talend


    **Web site:** [`www.talend.com`](http://www.talend.com)


    **Review:** The Talend ecosystem represents a suite of tools, including Talend
    Open Studio, Talend Data Management Platform, Talend Data Services Platform, and
    Talend Integration Cloud. Its complete data management and integration portfolio
    is part of Talend Data Fabric, which includes data integration, data preparation,
    data catalog, data stewardship, and API management capabilities. With all these
    capabilities, Talend can perform against the most complex of ETL scenarios. Best
    of all, Talend maintains an open source community, so many of its tools in its
    Open Studio subscription are free to use (see Figure [5-6](#486629_1_En_5_Chapter.xhtml#Fig6)).^([^(95)](#fn95))
    Personally, I love the idea of a complex product at no cost. However, Talend supports
    a `Java Code Generator`, which makes use of open source Java libraries. If you’re
    not a Java developer, the learning curve might be extreme.


    **Pros:** Great set of tools maintained by an open source community. Supports
    most, if not all, of the advanced ETL solutions you’ll need. A great solution
    is you have a development team with Java skills.


    **Cons:** If you’re not already a Java aficionado, learning Talend can be an uphill
    battle. If the direction of your organization is one for extreme software development,
    this may be the tool for you. Otherwise, you may have difficulty finding team
    members to support your integration if and when you need to patch operations.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig6_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Talend Open Studio Free Products'
