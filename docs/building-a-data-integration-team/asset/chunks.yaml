- fmt: "# Preparing for Automation\n\nIn Chapter [6](#486629_1_En_6_Chapter.xhtml),\
    \ we cloned a Git folder that would allow us to run through a sample integration.\
    \ If you haven’t done so, please refer to that chapter and repeat the installation\
    \ steps.\n\nThe initial scenario was the following:\n\n- We work for the IT department\
    \ of InfoMotors, a car dealership that tracks customer purchases in a text editor.\
    \ These files store customer data (`name`, email), the car the customers bought\
    \ (`make`, `model`, `color`, `year`), the price the customers paid, and the date\
    \ the vehicle was purchased. Because InfoMotors is a new dealer, they do all their\
    \ bookkeeping and reporting in Excel.\n\n- But things are changing, and in order\
    \ to improve their efficiency and minimize data issues, management would like\
    \ to migrate their text files into a new on-premise database.\n\nAfter sizing\
    \ up the requirements and building out our Source-to-Target Mapping, we architected\
    \ our Data Migration Process Flow Diagram and wrote our summary (see Figure [7-6](#486629_1_En_7_Chapter.xhtml#Fig6)):\n\
    \n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig6_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig6_HTML.jpg)\n\
    \n**Figure 7-6** — Data Migration Process Flow Diagram\n\n1. **Create/Truncate\
    \ BUYER Table**: Using the ETL tool, create the `BUYER` table if it does not already\
    \ exist. If it does exist, then truncate all data to provide the next load.\n\n\
    2. **Extract CSV**: Using the ETL tool CSV connector, retrieve all comma-delimited\
    \ data.\n\n3. **Extract TSV**: Using the ETL tool text connector, retrieve all\
    \ tab-delimited data.\n\n4. **Transform Values**: Using the `STTM` as a reference,\
    \ change the transformation values identified.\n\n5. **Merge Files**: Combine\
    \ the new (transformed) staging files into one file prepped for the target format.\n\
    \n6. **Insert Data into BUYER Table**: Using the ETL tool SQLite connector, insert\
    \ all values into the `BUYER` table.\n\n7. **Decision**: Were there any errors\
    \ during load?\n    1. If yes, then roll back the data and send a report.\n  \
    \  2. If no, then write the output of the `BUYER` table to a `.csv` file.\n\n\
    We handed these requirements to our developers, and they returned the completed\
    \ prototype files.\n\nOne night close to our delivery date, we receive a phone\
    \ call from the project manager who tells us that management recently discovered\
    \ four more source files. The ones from 2014 and 2015 are in Excel format, and\
    \ the remaining have the CSV delimiter. They want to know if we also can include\
    \ this data in the new database. Our job is now to go back and add these files\
    \ to our prototype, test, and then ensure that a QA team is satisfied with our\
    \ results.\n\nOn the plus side, management has agreed to remove the requirement\
    \ to migrate the data every two weeks. For now, we can return to our original\
    \ conclusion that the migration will be one-time.\n\nThey also asked if, instead\
    \ of merging the data, we could simply load as is into the new database. They\
    \ will perform deduplication and cleanup as necessary.\n\nGiven this new information,\
    \ we reiterate our process and reconvene the initiation phase. Taking each part\
    \ at a time, you approach your integration team with the new requirements. “Can\
    \ this be done?” you ask. “And how long will it take?”\n\nThe lead developer says,\
    \ “It’ll be hard work. But we’ll do our best to have it done by the end of next\
    \ sprint.”\n\n> **Note**  \n> I would suspect it’s probably going to take less\
    \ time than two sprints, but your lead developer won’t tell you that as he wants\
    \ to demonstrate the team’s heroics by underpromising and overdelivering. Integration\
    \ teams rock.\n\nYou have prepared your next steps. You go back and reopen the\
    \ documents that had previously received approval, marking down the new requirements.\
    \ For example, you change your earlier approach in the Data Migration Plan to\
    \ resemble the following.\n\n## Proposed Migration and Integration Approach\n\n\
    Using an ETL tool, we will be extracting data from six files (three comma-delimited,\
    \ one tab-delimited, and two Excel), performing transformations on the internal\
    \ data to fit the target structure, and extracting to the target database. All\
    \ data entry going forward will be delivered on the target system.\n\nYou can\
    \ modify the future state diagram as well to represent the multiple CSV and XLS\
    \ files rather than just the CSV and TSV from our first iteration (see Figure\
    \ [7-7](#486629_1_En_7_Chapter.xhtml#Fig7)):\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig7_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig7_HTML.jpg)\n\
    \n**Figure 7-7** — Modified Future State\n\nAll this is designed to communicate\
    \ the strategy to the broader audience as well as confirm with anyone reviewing\
    \ the documents that the assumptions are correct.\n\nYou’ll reenter your discovery,\
    \ design, and build phases in much the same manner. You’ll redo profiling on the\
    \ new datasets, you’ll modify your `STTM` with the updated source-to-target fields\
    \ and transformation rules, and you’ll plug the latest steps into your Data Migration\
    \ Plan. These activities are as simple as adding and removing the appropriate\
    \ boxes to your flowchart and then adjusting your summary to match it (see Figure\
    \ [7-8](#486629_1_En_7_Chapter.xhtml#Fig8)):\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig8_HTML.jpg](images/486629_1_En_7_Chapter/486629_1_En_7_Fig8_HTML.jpg)\n\
    \n**Figure 7-8** — Data Migration Process Flow Diagram (Updated)\n\n1. **Create/Truncate\
    \ BUYER Table**: Using the ETL tool, create the `BUYER` table if it does not already\
    \ exist. If it does exist, then truncate all data to provide the next load.\n\n\
    2. **Extract CSV**: Using the ETL tool CSV connector, retrieve all comma-delimited\
    \ data.\n\n3. **Extract TSV**: Using the ETL tool text connector, retrieve all\
    \ tab-delimited data.\n\n4. **Extract Excel**: Using the ETL tool text connector,\
    \ retrieve all Excel spreadsheet data.\n\n5. **Transform Values**: Using the `STTM`\
    \ as a reference, change the transformation values identified.\n\n6. **Insert\
    \ Data into BUYER Table**: Using the ETL tool SQLite connector, insert all records\
    \ into the `BUYER` table.\n\n7. **Decision**: Were there any errors during load?\n\
    \    1. If yes, then roll back the data and send a report.\n    2. If no, then\
    \ end the event.\n\nYou hand these modified documents to your development team\
    \ and ask them to build you the latest and greatest version of the ETL. Just for\
    \ kicks, and to keep with the theme of this chapter, you’ll want them to automate\
    \ the process so the data can extraction, transformation, and loading with a single\
    \ mouse click."
