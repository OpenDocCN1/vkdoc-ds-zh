  trans: '

    ###### 设计


    以下是你为 STTM 电子表格所需准备的*最少*信息量：


    -   `Source Datasystem`：作为数据源的系统的通用或正式名称，例如 `Oracle`，或者按官方组织名称填写，如 `Legacy Contact
    Management System`

    -   `Source Table`：源表的物理名称，例如 `CONTACT`

    -   `Source Field`：源字段/列的物理名称，例如 `"Name"`、`"Email"` 或 `"Street Address"`

    -   `Target Datasystem`：作为数据目标的系统的通用或正式名称，例如 `Salesforce`，或者按官方组织名称填写，如 `Payroll
    Management System`

    -   `Target Table`：目标表的物理名称，例如 `EMPLOYEE__C`

    -   `Target Field`：目标字段/列的物理名称，例如 `"Name__c"`、`"Email__c"` 或 `"street_address_1__c"`

    -   `Transformation Rule`：将数据从源字段转换到目标字段所需的业务规则，例如 `"Join contact_id on payroll__c
    and add rowid where address.primary_address = TRUE and address.valid=TRUE"`


    附录中提供了一个说明此模式的模板。


    如果觉得这种设计相对简单，请三思。我遇到过许多数据库专家，他们原以为已用简单的单句转换规则映射了源和目标，但几个月后当需要参考这些信息时，却为自己的决定后悔不已。需要牢记的关键点是具体性和保持信息的时效性。如果你需要详细的说明，可以将其放在单独的文档中，或许在
    `Transformation Rules` 中提供一个超链接，大意是“有关更多详细信息，请参阅文档 XXX”。最重要的是，确保文档对读者有实际意义。不要过于技术化或冗长，因为这份文档很可能在你结束项目或离开后，或者更乐观地说，在你中了彩票、在海滩上啜饮迈泰酒度过余生并将工作交付给他人后，成为你的遗产。


    然而，即使提供了上述信息，你可能仍然觉得不够。当然，你迟早会修改业务需求，并且在持续分析和发现更多数据点时，可能需要添加新的表和字段。请注意，我们讨论的不是*版本控制*（即就地覆盖
    STTM 并用最新版本替换），而是*追踪*（即进行更改，并说明为何进行这些更改）。考虑以下这些可以与基础 STTM 一同包含的可选字段：


    -   `Design Notes`：不一定属于转换规则但对历史记录至关重要的附加说明，例如“根据客户要求，将此字段从 `fullname` 更改为 `lastname`”。

    -   `Date Created`：将记录首次添加到模型中的日期时间（例如 `9/14/2019`）。一旦插入，该值不会更改。

    -   `Date Updated`：记录的任意部分被修改的日期时间。该值与 `Design Notes` 关联时，将有助于你维护历史追踪。


    现在有些进展了。通过添加这三个描述符，我们可以记录对 STTM 所做的任何更改，以及创建和更新的日期。当然，这里的关键是拥有详实的设计注释，根据更改原因，这些注释可能会变得相当冗长——新的注释始终可以追加在旧注释之上，并用分号（`;`）隔开。更好的做法是，添加一个“参见文档
    xxx”的引用。修改 `Date Updated` 字段看似有点麻烦，但一旦习惯，操作起来相对容易。提示：如果使用 Microsoft Excel 或 Access，选中一个单元格，按住控制键（`CTRL`）再按分号（`;`）即可插入当前日期。同样，按住控制键（`CTRL`）再按冒号（`:`）即可插入当前时间。


    你可能还想在 STTM 中包含其他列，我已将它们作为模板的一部分放在附录中。其中一个我见过的列是源和目标的 `DataType`，例如 `VARCHAR(80)`、`DATETIME`、`NUMBER`
    或任何其他数据类型。我通常不包含这些值，因为这更像是固定模式设计；你可以在任何实体关系图中查看它们，所以我不太明白包含它们的目的是什么。不过，如果你经常需要使用
    STTM 电子表格来查找特定类型的值，例如用 `ID` 表示 `NUMBER` 类型的主键，那么你可能还是希望为源或目标包含它们。


    ###### 使用


    如我们所见，STTM 电子表格不仅充当设计工具，还作为后期审查的参考，或许最重要的是，作为所做决策的提醒。在项目测试的紧张阶段，处理多个问题的利益相关者可能会忘记他们为什么要求某个特定字段，或者为什么三个月前从表
    X 改成了表 Y。STTM 中的 `Design Notes` 和 `Date Updated` 字段能快速解决这个问题。我无法告诉你，在项目结束后的数天、数月甚至数年里，我们查阅
    STTM 的频率有多高。这就是为什么保持这份交付物的可用性至关重要：使其与当前模型保持同步更新，并通过共享驱动器甚至在线数据库存储库使其对所有相关人员可访问，以便当系统开始崩溃、所有人的目光都转向集成团队寻找答案时，能够快速、便捷地查找。


    #### 数据迁移流程设计


    作为设计过程的一部分，本文档总结了迁移流程的详细设计，包括一次性迁移和日常更新的操作顺序。它是整体策略中其他交付物的存储库，并允许团队就实现项目成功的拟议方法进行沟通。与我们讨论过的其他交付物一样，它也是一份*活*文档，不断变化并可随时更新。


    ##### 操作顺序


    `Order of Operations` 从高层次讨论了通用对象迁移的逐步操作。此部分将拆解为稍后描述的 `Deployment Steps` 中的更多细节。只要有可能，我喜欢包含插图，因为它们比单纯的文字更具描述性和全面性。


    ##### 映射逻辑


    `Mapping Logic` 定义了源到目标映射电子表格背后的高层规则，主要供业务团队确认规则的准确性。请注意，这并不是对整个 STTM（参见“源到目标映射”章节）的重复，最多只是列出几个更重要的字段，以便向利益相关者和高管传达集成的要点。至少，应包含指向你的
    STTM 电子表格或存储库的链接，并附上使用说明（所需的浏览器、工具等）以及在何种情况下使用。

    '
- fmt: "### Deployment Steps\n\nA deeper dive into the Order of Operations, the Deployment\
    \ Steps section defines each task of the migration or integration, usually with\
    \ a diagram associated with the ETL process. The pattern should be easy to follow\
    \ and essentially becomes the checklist of the deployment cycle:\n\n1. Select\
    \ data from table XXX:\n\n   ```\n   Transform data with defined business requirements\n\
    \   Test sample\n   Insert data into table YYY\n   ```\n\n   And then, each of\
    \ these tasks is further broken down into a single-sentence summary of steps.\n\
    \n2. Select data from table XXX:\n   1. Using the Pentaho Data Integration (PDI)\
    \ application, run SQL statements against table XXX via a SQL Server connection\
    \ located here.\n\n3. Transform data with defined business requirements:\n   1.\
    \ Using Python script, transform Salesforce contact data into provided business\
    \ rules.\n\n4. Test sample:\n   1. Insert ten sample contact records into Preproduction\
    \ environment ensuring that five to ten sample records are successfully received.\n\
    \   2. Perform QA assessment of data. If records fail or do not meet business\
    \ requirements, then iterate and reload.\n   3. Insert data into table YYY.\n\
    \   4. Once test records pass, receive Go/No Go permission from stakeholders.\n\
    \n5. Perform a load of the entire dataset using Talend ETL application:\n   1.\
    \ Once the load is complete, confirm the load is successful against contact record\
    \ by performing follow-up analysis.\n   2. If the load fails, roll back transaction\
    \ and report error to stakeholders.\n\n6. Reiterate and restart from Step 1.\n\
    \nThe beautiful thing about this part of the Data Migration Flow document is that\
    \ you are preparing for most of the eventualities before they can even happen.\
    \ Sure, you may miss one or two things, but knowing that this is an adjustable\
    \ document that you can always modify and append makes your life much easier.\
    \ If you stage a few dress rehearsal migrations in a development or sandbox environment,\
    \ you’ll be able to catch most everything that will occur during the actual deployments.\
    \ That, and you’ll have the written confidence that you knew well in advance what\
    \ you wanted to do, how you would do it, and the conditions that will occur based\
    \ on success or failure. No one will ever be able to come back to you and claim\
    \ they were surprised. So it may require a bit of up-front work, but I think that\
    \ this level of preparation and communication is well worth the effort.\n\n###\
    \ Log File Delivery\n\nThis section describes where the success and error logs\
    \ will be stored. This storage location can be online or emailed as a shared file,\
    \ but it should be available to those who have need and interest in seeing results.\n\
    \n### Migration Results\n\nThe Migration Results section describes the output\
    \ received by the Migration Results Report, which we discuss later. In truth,\
    \ I usually leave this section empty until the end of the project, using it as\
    \ gift wrapping to prove that data was delivered as expected. It is also a signal\
    \ to the team that with all records successfully delivered, final signoff is imminent.\n\
    \n### Final Signoff\n\nNot mandatory, but I like to include this part of the Data\
    \ Migration Process Flow as it gives closure to your migration. As the name implies,\
    \ signoff is either an email or attachment, signed by the project sponsor, that\
    \ the migration was completed and satisfied the requirements. You may be shaking\
    \ your head in disbelief as you read that last sentence, but I promise you, with\
    \ the process documentation we have in place, you will end up meeting the project\
    \ requirements. And be organized and prepared while doing it.\n\n## ETL Scripts\n\
    \nThe ETL scripts are part of the development phase and, because they are highly\
    \ technical, may not be a critical part of the overall delivery. Still, it is\
    \ always nice to have a copy of your code stored just in case the backups should\
    \ crash or some other tragedy befalls your local platform.\n\nYou must consider\
    \ a variety of possibilities for how you want to document and deliver your functionality.\
    \ The development team should hold peer reviews frequently, and having some troublesome\
    \ script logic in hand during these sessions can be helpful to get everyone on\
    \ board. Plus, sharing your approach with more junior ETL developers will be beneficial\
    \ as they align your ideas against their projects.\n\nCapturing this information\
    \ may be a simple cut-and-paste against data, but most of the more popular ETL\
    \ tools use both graphical interfaces and text. In this case, a screenshot tool\
    \ may do the trick (my favorites include Microsoft’s Snipping Tool [TechSmith’s\
    \ Snagit](https://www.techsmith.com/screen-capture.html), or NGWIN’s PicPick [PicPick](https://picpick.app/en/)).\
    \ In some cases, you may be able to pull out snippets of GUI code through configuration\
    \ files, but I leave it to readers to decide what will work best. The most important\
    \ thing to keep in mind is that code, like any other iterable software product,\
    \ forever changes and that whatever you document will ultimately need to be updated.\n\
    \n## Migration Results Report\n\nThis deliverable, populated during integration,\
    \ highlights the success and error counts of the integration for each object.\
    \ You’ll have to keep track of your load statistics, be it through manually written\
    \ notes, an automated email, or another type of delivery that tracks the number\
    \ of `SELECTS`, `INSERTS`, `UPDATES`, WSDL responses, and so on for each deployed\
    \ record. The level of detail is up to you—simple counts versus detailed descriptives—but\
    \ it’s essential to keep track, mostly for the sanity of you and your stakeholders\
    \ who at some point will not be able to find a record that went AWOL during the\
    \ source-to-target transmission. If said records are part of the error log, you\
    \ should also include the record count and cause.\n\nAs much as possible, individual\
    \ job runs should include the start date and time of the job as well as the finish\
    \ date and time. In this manner, you will be able to track the “deltas” for future\
    \ updates which not only help allocate the time you will need for later migration\
    \ tests but also let you know when something is out of whack: a job that usually\
    \ takes 5 minutes to execute but, for one cycle takes more than 30 minutes, is\
    \ experiencing some problem along the route. Network analysis tools such as `Wireshark`\
    \ or traffic monitors such as `Charles` will be an excellent place to begin your\
    \ analysis."
