    are found. This business knowledge can accelerate the process during the discovery
    phases of the project and allows the team to provide excellent feedback during
    the testing phases, especially as these data landmines systematically are defused.^([^(40)](#fn40))


    The biggest negative of the Functional team is the same as the benefit in that
    too many cooks can spoil the soup. The more experts on a project, the more perspectives
    you invite with the unfortunate result of frequent debate, group polarization,^([^(41)](#fn41))
    and hard-to-avoid “paralysis by analysis.”^([^(42)](#fn42)) One of the better
    methods for diluting this effect is to keep the number of experts in the room
    during the integration phases to a minimum, that is, generally no more than two.
    There will be some initial questions or unknowns, and these can be shared with
    the broader team once the standard, less debatable issues are confirmed. Of course,
    you should document and share all meeting notes to avoid surprises with the familiar
    complaint, “Why wasn’t I included in this decision?”^([^(43)](#fn43))


    Because of their technical nature, integrations will, at some point, require a
    development team to step in. Functional teams may or may not have knowledgeable
    staff who can conduct these phases. For that reason, I would recommend that the
    functional team handling all aspects of the discovery and testing phases should
    begin handing off work to the developers with close supervision. This level of
    review should ensure that the developers interpret the requirements with clear
    understanding.'
  trans: '

    # 团队性格


    性格至关重要。对于你的团队而言，总有更倾向于与他人协作的人，也有更愿意独自完成任务的人，至少在大多数日常工作中是这样。我们通常将这类性格定义为外向性与内向性，^(³⁶)
    但由于集成本身的协作特性，整合活动要求团队成员在这两方面都具备优势。你的集成架构师和`ETL`开发者必须与跨团队的利益相关者紧密合作，以收集需求，并按要求（有时是在最后一刻！）澄清这些需求。然而，这些同一个人也必须具备内向的偏好，以应对马拉松式的研究与设计，常常需要深入钻研那些要求关注细节的技术代码。


    基于这种理解，拥有单一能力的人——即能独自完成整个集成过程的个体——是可能的，但至少可以说是令人生畏的。而且，为了理智起见，如果存在这样的人，分配给他们工作量最好仅限于短期任务；一个长期的固定角色不仅会打击士气，还可能导致职业倦怠。


    我并非暗示那些自我识别为更外向的人会比内向者在特定集成角色中表现更好或更差。但为了团队的和谐，那些既能专注于技术层面又能适当外向的人，能带来更多的协作与沟通，这是此类项目所必需的。无论如何，人们往往会在某个领域（或另一个领域）表现更强，^(³⁷)
    关键是要注意人们是更愿意在团队中工作、独自工作，还是两者皆可，然后分配给他们最适合其角色的集成活动。^(³⁸)


    ## 团队类型


    说实在的，一个集成项目可以采用“一刀切”的方法：召集一组拥有共同目标或兴趣的技术与职能团队成员，给予他们空间来解决集成需求，针对这些需求构建代码，然后执行测试职责。迭代、部署与监控。图
    3-1 展示了高层次上的流程。


    ![../images/486629_1_En_3_Chapter/486629_1_En_3_Fig1_HTML.jpg](img/486629_1_En_3_Fig1_HTML.jpg)


    **图 3-1** 集成流程图


    ### 基本团队流程


    我们将在第 4 章更详细地讨论集成流程的各个要素，但眼下要理解的是，我们所建立的团队类型至关重要，因为它决定了这些活动之间流转的速度和效率。例如，如果集成涉及将数据从传统的财务应用程序迁移到基于云的新应用，那么如果团队仅由财务部门组成，某些活动的流转速度会比纯由`IT`部门组成的团队更快。或者，选出的代表可能是部门职能的组合，例如`HR`、`会计`、`客户关系管理`等。


    你所选择的团队方法类型将取决于哪种方式最能满足预期的交付成果，并且在项目过程中可能需要进行调整，直到团队觉得达到了合适的节奏为止。我们将考虑四种团队类型^(³⁹)：


    *   职能型

    *   跨职能型

    *   虚拟型

    *   自我导向型


    ### 职能型


    `职能型`团队与一个通用职能部门相关，例如财务团队将数据从旧的传统系统迁移到新系统。这类团队的优势在于，需求会非常详细且理论上基于现实：专家们了解日常流程以及“数据地雷”所在之处。这种业务知识可以在项目发现阶段加速进程，并允许团队在测试阶段提供出色的反馈，尤其是在这些数据地雷被系统性地排除时。^(⁴⁰)


    职能团队最大的缺点与优点相同，即“厨师太多会坏汤”。项目中的专家越多，你引入的观点就越多，不幸的是，这会导致频繁的争论、群体极化^(⁴¹) 以及难以避免的“分析瘫痪”。^(⁴²)
    缓解这种影响的一个较好方法是，在集成阶段将房间内的专家数量保持在最低限度，通常不超过两人。会有一些初始问题或未知项，一旦标准且争议较少的问题得到确认，这些内容可以与更广泛的团队分享。当然，你应该记录并分享所有会议记录，以避免出现“为什么我没被纳入这个决策？”这样熟悉的抱怨所带来的意外。^(⁴³)


    由于其技术性质，集成在某个阶段需要开发团队的介入。`职能型`团队可能会也可能不会有具备执行这些阶段知识背景的员工。因此，我建议负责发现和测试阶段所有事务的职能团队，应在严密监督下开始将工作交接给开发者。这种级别的审查应确保开发者能够清晰理解需求并正确解读。'
- fmt: '### Cross-Functional


    Integration projects that span across systems with multiple purposes will want
    to utilize the Cross-Functional team. As an example, imagine that instead of integrating
    a legacy finance app in a new system, we are now moving an entire accounting system
    from ground to cloud. This new application would feature paycheck information,
    employee data, and purchase orders. In other words, this scope crosses multiple
    functionalities.


    As with a single Functional team, the Cross-Functional team will need to bring
    in the experts from the specific departments. Unlike the Functional team, however,
    the Cross-Functional team members must *work with each other* since the new system
    overlaps. Human Resources and Employee Relations might both require data stored
    within the same table, and these departments will need to agree on the format
    of this data. As a simple example, if `State` is a shared field in an `ADDRESS`
    table and Human Resources uses an abbreviation (`AK`, `AL`, `AZ`), while Employee
    Relations uses the full spelling (`Alaska`, `Alabama`, `Arizona`), then the result,
    known colloquially as the “Golden Record” or “Single Point of Truth” (`SPOT`),^([^(44)](#fn44))
    must be honored (see Figure [3-2](#486629_1_En_3_Chapter.xhtml#Fig2)).


    ![../images/486629_1_En_3_Chapter/486629_1_En_3_Fig2_HTML.jpg](images/486629_1_En_3_Chapter/486629_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Cross-Functional Agreement


    Cross-Functional teams have a similar advantage to the Functional team in that
    the business members know their subject matter and can be very helpful in defining
    requirements and performing tests. But, as noted earlier, data formats open to
    disagreement and overlap may require mediation. At this point, teams should demonstrate
    excellent communication, tradeoffs, and compromises. I have personally seen meetings
    go off the tracks due to unanticipated displays of passion from a disagreeable
    team member.


    Once the cross-functional team has worked together for a while, an interesting
    phenomenon occurs. Known as the performing stage of team formation,^([^(45)](#fn45))
    team members establish a level of mutual respect and trust, and members begin
    to work closely with one another. This stage is where the real advantage of a
    cross-functional team comes into play. Similar to living in a different culture,
    teams from separate departments begin to understand and accept the work and processes
    performed by their coworkers. That makes sense since, after all, they have been
    eating, breathing, and reading these viewpoints from the beginning of the project.
    This acceptance, in turn, leads to an improved understanding of different facets
    of the organization. For me, this type of knowledge and approval can only happen
    when teams from different units must work together toward a common goal. Although
    it occurs only once in a while, the bonding within the cross-functional integration
    team can be the most satisfying in terms of leaving one’s comfort zone to learn
    something new as well as establish long-term friendships with people whose interests
    and skills might be vastly different than your own.


    ### Virtual Team


    If working in a cross-functional team is like blending different cultures, the
    virtual integration team might be the real deal. Although not always, this type
    of team consists of people from different cultures and different languages, working
    together to achieve the same goal. As virtual teams have become more common in
    the last decade, the team might also be people who, for one reason or another,
    work remotely from a home office, coffee shop, or other network-accessible location.
    The point is that the teams are not physically in the same space and must use
    technology for communication.


    The advantage of the virtual team comes in threes: productivity, teamwork, and
    presence.^([^(46)](#fn46)) In the tech world, the 9–5 existence has become obsolete,^([^(47)](#fn47))
    and lack of a commute means less time traveling and more time online. As the demand
    for offshore engineers develops and network technology improves, the virtual team
    is slowly becoming the framework of the future.


    I love the rainy-day Google Hangouts as much as the next person, but I am sad
    to say that the advantages of virtual communication do not seem to work in the
    early phases of integration. Let me stress that I base this finding on my personal
    experience (so no angry letters, virtual or otherwise, please). As we’ve discussed,
    gathering requirements involves direct collaboration and communication, which
    means face-to-face conversations, body language readings, voiced guidance, and
    in-person clarifications. I have found that what usually would take 5 minutes
    to cover in a face-to-face meeting could take hours to explain through a series
    of emails or video conversations. This delay in having questions answered often
    leads to a growing backlog and forced priorities as one misunderstood table dependency
    can cascade into gaps in requirements.


    Enough about the bad news. The good news is that, from a development standpoint,
    integration projects and virtual teams work very well with one another. With cloud-based
    security and network connectivity through remote logins and VPNs, the benefits
    of virtual work are readily transparent. As an example, during a six-hour flight
    to the West Coast, I completed five fixes and held two conference calls (sorry,
    passengers in Row 23, I’ll be quieter next time). Of course, when you hit a speed
    bump in terms of a requirements question, your productivity can screech to a halt.


    So how do you deal with the constant speedup and then drag to productivity? The
    answer is to allow your team to have both virtual and onsite days (if you can,
    that is). Pick one or two days of the week where very little happens in the way
    of requirements sessions and make that your team’s “virtual work” day. The other
    days of the week will be onsite and will allow you to focus exclusively on those
    priorities that will impact your productivity. Of course, depending on the amount
    of backlog and complexity of work, you may have to be onsite for some weeks during
    kickoff and discovery or virtual for other weeks during development. The choice
    is up to you and your organization’s policy. Just remember some things are better
    in person and might be worth the extra effort if your team finds itself falling
    deeper into backlog despair.


    ### Self-Directed Team


    Self-directed teams consist of people who see a problem and then come together
    on their own to resolve that problem. With these types of teams, there’s no clear
    hierarchy in the beginning, but roles and responsibilities are slowly divvied
    up based on the work individuals want to complete. As an example, individuals
    in our Finance team have migrated their cloud-based system. Now they want to receive
    reports from a reporting database that does not yet exist. Although not a mandate
    from management, the team decides to build the database and code on the side.


    The impacts for the self-directed team to NOT complete the project are often low
    since the success and failure of the workstream have no direct effect on the organization.
    It is just a “nice-to-have” that allows the same advantages as the other three
    types of teams while leading to some inventions that have considerable upside.
    Art Fry invented the Post-it through self-directed experimentation, and it changed
    the path of 3M forever.^([^(48)](#fn48)) A self-directed integration team could
    theoretically turn an idea into a killer app if the timing and skills fall into
    alignment.'
