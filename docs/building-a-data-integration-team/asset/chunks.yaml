    \   [8](#486629_1_En_8_Chapter.xhtml#Fn8_source)   [9](#486629_1_En_8_Chapter.xhtml#Fn9_source)\
    \   [10](#486629_1_En_8_Chapter.xhtml#Fn10_source)   [11](#486629_1_En_8_Chapter.xhtml#Fn11_source)\
    \   [12](#486629_1_En_8_Chapter.xhtml#Fn12_source)   [13](#486629_1_En_8_Chapter.xhtml#Fn13_source)\
    \   [14](#486629_1_En_8_Chapter.xhtml#Fn14_source)   [15](#486629_1_En_8_Chapter.xhtml#Fn15_source)\
    \   [16](#486629_1_En_8_Chapter.xhtml#Fn16_source)   [17](#486629_1_En_8_Chapter.xhtml#Fn17_source)\
