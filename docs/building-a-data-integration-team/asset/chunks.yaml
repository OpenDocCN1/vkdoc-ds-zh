    \n# 8. Monitoring Results\n\n> *We’re rapidly entering a world where everything\
    \ can be monitored and measured. But the big problem is going to be the ability\
    \ of humans to use, analyze, and make sense of the data.*\n> \n> —Erik Brynjolfsson^([^(115)](#fn115))\n\
    \n## Introduction\n\nAt last, we’ve gotten through the ordeal of discovery, designing,\
    \ testing, and deployment. We know our data inside and out, we’ve alerted teams\
    \ to discrepancies, and we’ve managed to automate (as much as we can) the one-time\
    \ migration and repeatable integrations. We’ve even set up an alerting system\
    \ when we run into Business Rules and Technical Errors. What’s left?\n\nFortunately\
    \ (or unfortunately, depending on your perspective), the work of an integration\
    \ team is never done. Post-deployment, we now enter the crucial phase of monitoring\
    \ in which we work with the target data team to resolve their data issues, ensure\
    \ that we’ve refactored unique errors still encountered by the ETL process, and\
    \ review the daily and weekly logs for statistics that will allow the enterprise\
    \ to improve their data goals. These activities are an incremental process, and\
    \ the clock starts to tick the day after deployment. Let’s begin from that first\
    \ day, noting the milestones and issues that are liable to crop up.\n\n## Day\
    \ One: Post-deployment\n\nThat first day after the migration is liable to be a\
    \ busy one. On the one hand, you eagerly want to share in the celebrations, but\
    \ on the other hand, there’s a new application chock full of data, and users are\
    \ ready to access. If you’re on the front lines of help desk support, you’ll be\
    \ getting one call after another from users wondering if this record was sent\
    \ or that value was brought over because it no longer exists or it exists but\
    \ in a different format or it never existed and now it has miraculously appeared.\
    \ With all the potential for a disruptive day, how will your team handle this\
    \ surge?\n\nWell, the good news is they may not have to. At least, not initially.\
    \ The integration team is on the hook for handling data issues related to the\
    \ migration process, but there are a few checkpoints that these requests will\
    \ have to get through first. You’ll need to establish your level of support within\
    \ your organization, the topic we’ll cover next."
