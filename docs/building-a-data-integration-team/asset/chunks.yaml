  trans: '

    ### Dell Boomi


    **网站:** [`https://boomi.com/`](https://boomi.com/)


    **评价:** Dell Boomi 是我反复使用并似乎总会迁移（双关语）到的工具之一。如果我需要一个具备调度功能的高端 ETL 处理解决方案，我会向客户推荐
    Boomi，并强调其拖放式 GUI 功能的易用性（参见图 5-7）、文档的务实风格、社区贡献，以及其代理（称为 `Atom`）能够真正远程运行的能力——无论是在防火墙后以增强安全性，还是在云端。Boomi
    的设计确实需要一点时间来适应，尤其是在整个集成过程中持久化属性方面。但一旦你掌握了这一点，测试、部署和维护版本控制就相对容易了。对我来说，最大的缺点是定价模式：它似乎为你拥有的每个连接器、针对每个
    URL 都收取一份许可证费用。也就是说，如果你想通过一个特定端点连接到一个数据库，你需要为一个连接器支付零售价。如果你随后想连接到同一个数据库，但通过不同的端点，你就要为另一个单独的许可证付费。虽然有变通方法，但这看起来像是一笔高昂的前期成本。如果你的
    ETL 设计不需要 Boomi 所提供的这种高强度功能，那么这个工具可能不适合你的组织。


    **优点:** 一旦你参加了适当的（在线！）课程，设置、部署和提交版本控制都非常容易。通过教程、电话支持和社区论坛，一切都为你详细说明。由于它是基于云的，应用程序的维护工作量很小，内置的
    API 调用允许你执行一些真正的自动化 DevOps 事务（我们将在第 7 章讨论 DevOps）。


    **缺点:** 如果你想获得高级功能，如单点登录、到同源产品的多个连接器以及无限客服支持，那么价格会非常高昂。此外，在其他工具中可能被认为更简单的某些 Boomi
    功能，比如修改数据，可能并非内置，而需要用 Groovy 或 JavaScript 创建自定义脚本。确保你的开发人员具备合适的技能和一点耐心，你就能让它为你所用。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig7_HTML.jpg](img/486629_1_En_5_Fig7_HTML.jpg)


    图 5-7

    Dell Boomi 流程窗口


    ### Pentaho 数据集成（PDI）


    **网站:** [`https://community.hitachivantara.com/s/article/data-integration-kettle`](https://community.hitachivantara.com/s/article/data-integration-kettle)（社区版）

    [`www.hitachivantara.com/en-us/products/data-management-analytics/pentaho-platform/pentaho-data-integration.html`](http://www.hitachivantara.com/en-us/products/data-management-analytics/pentaho-platform/pentaho-data-integration.html)（企业版）


    **评价:** Pentaho 数据集成创立于 21 世纪初，其设计纯粹是开源的。这种开放性意味着该系统将拥有免费、可读的元数据（XML）标准和开放的 API
    标准，易于设置（大约 2 分钟），支持所有类型的数据库，并允许数据与任何格式之间进行转换^(⁹⁶)。最终诞生了一款免费产品，它几乎可以消费任何数据格式，使用开箱即用的过滤器或
    JavaScript 过滤器进行转换，并加载到从文本文件到大数据系统的任何数据源中。2012 年，当我的同事开始称赞 Pentaho 的优势时，我最初是持怀疑态度的——一个能搞定所有这些事的免费工具？有什么蹊跷？


    我至今还没弄明白最后这一点。我可以说，Pentaho 在我做过的大部分工作中都堪称救星，主要是因为它安装相对简单，而且在我看来，它的拖放式 GUI 功能是首屈一指的（参见图
    5-8）。另外，由于其后端元数据是用文本 XML 编写的，其架构可以轻松地以任何格式存储，并能与版本控制紧密集成。


    自从我第一次接触 Pentaho 以来，该公司已与巨头日立 Vantara 合并，但社区版仍然免费提供。据我所知，还有一个基于云的版本正在开发中，以配合本地部署的应用程序。付费版本确实提供了一些额外的好处，例如更快的支持和其他功能。但如果你正在寻找一个能让你轻松入门
    ETL（而且免费！）的工具，那么 Pentaho 绝对值得一试。


    根据我的经验，该工具最大的缺点是开发人员和市场都缺乏对其的了解。哦，你知道 Pentaho？太好了。你想创建多个可以涵盖整个数据系统的部署，并在几周内准备好运行？没问题。你想在你离开后找到其他能够支持这个工具的人？那就有问题了。但如果你愿意改变你的工作环境，让
    Pentaho 成为事实上的工具，我认为你可能会从中获得很多好处。


    **优点:** 因为它是我第一次真正接触到的易用的 ETL 工具，所以我对其评价颇高。正如我常说的，“PDI 让我的数据能够翻筋斗。”不过，你可能不这么认为，而且我也无法确切说明该工具在近期被日立
    Vantara 收购后的表现如何。尽管如此，如果你喜欢冒险并想尝试一下，我会推荐它。社区版是免费的，所以你基本上没有任何损失。


    **缺点:** PDI 在市场上往往被一些更知名的工具所掩盖，因此，找到理解其设计并愿意支持该工具的员工可能会是个问题。对于一次性的迁移项目，PDI 表现得非常好。但对于增量加载（例如，夜间集成），PDI
    在某些功能上有所欠缺，比如优雅的错误处理。


    我们将在下一章构建示例 ETL 流程时再次讨论 Pentaho。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig8_HTML.jpg](img/486629_1_En_5_Fig8_HTML.jpg)


    图 5-8

    Pentaho 数据集成主窗口

    '
- fmt: '# Microsoft SQL Server Integration Services (SSIS)


    **Web site:** [`https://docs.microsoft.com/en-us/sql/integration-services/sql-server-integration-services?redirectedfrom=MSDN&view=sql-server-ver15`](https://docs.microsoft.com/en-us/sql/integration-services/sql-server-integration-services%253Fredirectedfrom%253DMSDN%2526view%253Dsql-server-ver15)


    **Review:** It was in the age of dinosaurs (2003) when I was first introduced
    to the first iteration of `SSIS`, known as `Data Transformation Services` (`DTS`),
    to replicate an Oracle database into a Microsoft SQL Server reporting warehouse.
    Since that time, `SSIS` has come a long way and is embedded in Microsoft products
    both on premise via the SQL Server DBMS license and in the cloud via the `Azure
    Data Factory` cloud data integration service. In other words, when you use Microsoft
    as your base, `SSIS` is pretty much the standard. From all accounts, `SSIS` is
    quick to implement, is easy to use, and integrates fully with other Microsoft
    SQL/Azure products (see Figure [5-9](#486629_1_En_5_Chapter.xhtml#Fig9)). The
    main issue arises when you are not a Microsoft shop and have no plans to purchase
    or use the main product lines. Under those circumstances, you might be better
    off selecting another ETL tool.


    **Pros:** A low Total Cost of Ownership (TCO) that allows you to fully integrate
    with other Microsoft products, included as part of the DBMS/Azure license.


    **Cons:** As a non-Microsoft shop, `SSIS` can be a challenge to support. I recommend
    that if you’re on the fence, download an Evaluation version of SQL Server^([^(97)](#fn97))
    and give `SSIS` a test run.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig9_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    SSIS Control Flow


    # MuleSoft


    **Web site:** [`www.mulesoft.com/`](http://www.mulesoft.com/)


    **Review:** `MuleSoft` was founded in 2006 and became a Salesforce company through
    acquisition in May 2018. Initially, `MuleSoft` provided enterprise service bus
    (ESB) open source software and, in 2013, became one of the first pure integration
    vendors in the cloud after releasing its API management tool, `Anypoint Platform`
    (see Figure [5-10](#486629_1_En_5_Chapter.xhtml#Fig10)). My relationship with
    `MuleSoft` is limited, but I’ve heard through various channels that it is an excellent
    ETL tool with plugs-in to most environments. According to Gartner reports, `MuleSoft`
    has doubled its client base in the last several years and provides strong API
    management, security support, multi-cloud deployment, and an open-core ESB. As
    with other tools that feature these advanced capabilities, your developers will
    need to have a more significant deal of technical know-how than with other products.
    Fortunately, `MuleSoft` has some excellent training, both online and in the classroom.


    **Pros:** Currently, `MuleSoft` appears to be taking a healthy lead in the marketplace,
    perhaps because of its association with Salesforce or because of its existing
    product line, which appeals to customers working with full lifecycle API management,
    hybrid integration, and ease of onboarding.


    **Cons:** `MuleSoft` still maintains its roots as an enterprise service bus, very
    slowly adopting the functionality of a full-fledged integration tool. This product
    may not be the end-all, be-all solution, but is a product worth investigating
    for your implementations.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig10_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    MuleSoft Anypoint Platform


    # Informatica


    **Web site:** [`www.informatica.com`](http://www.informatica.com)


    **Review:** No discussion of ETL would be complete without discussing `Informatica`,
    the first name associated with data management. The company has been around since
    1993 and has gone through multiple iterations both on premise and then into the
    cloud, which it pioneered in 2007. I was certified as an `Informatica Cloud Specialist`
    in 2016, and since then, the company has evolved into the next generation known
    as `Informatica Intelligent Cloud Services` (`IICS`; see Figure [5-11](#486629_1_En_5_Chapter.xhtml#Fig11)).


    I have a love-hate relationship with this product. It does the job expected by
    an integration team, and it does it *very well*, so well that it probably should
    be on everyone’s shortlist of tools. But it is also run by an institution that
    has its roots in data management, and I found that the existing technology sometimes
    lags compared to other vendors, although this may be changing with the latest
    cloud implementation. For me, the biggest challenge has been learning the tool.
    It is so feature-rich that for new users to embrace it fully requires training,
    long-term strategic planning, and full commitment.


    **Pros:** Large market share. Generally considered the powerhouse player in the
    ETL space, which supports all aspects of migrations/integrations such as a broad
    set of connectors, security, metadata management, disaster recovery, manageability,
    standards compliance, and online technical support.


    **Cons:** As with many advanced tools, `Informatica` has so many features, yet
    we have so little time to learn them all. As stated, the product is perhaps too
    much for some organizations. I have talked with developers who admit that using
    `Informatica` on smaller datasets is like "hitting a butterfly with a hammer."
    If your organization is serious about their data integration approach, then I
    would say to throw your team all in and do the research. Otherwise, consider the
    less robust tools I have mentioned.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig11_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Informatica Mapping (Taken from [`www.edureka.co/blog/informatica-etl/`](http://www.edureka.co/blog/informatica-etl/))'
  raw: '### Microsoft SQL Server Integration Services (SSIS)


    **Web site:** [`https://docs.microsoft.com/en-us/sql/integration-services/sql-server-integration-services?redirectedfrom=MSDN&view=sql-server-ver15`](https://docs.microsoft.com/en-us/sql/integration-services/sql-server-integration-services%253Fredirectedfrom%253DMSDN%2526view%253Dsql-server-ver15)


    **Review:** It was in the age of dinosaurs (2003) when I was first introduced
    to the first iteration of SSIS, known as Data Transformation Services (DTS) ,
    to replicate an Oracle database into a Microsoft SQL Server reporting warehouse.
    Since that time, SSIS has come a long way and is embedded in Microsoft products
    both on premise via the SQL Server DBMS license and in the cloud via the Azure
    Data Factory cloud data integration service. In other words, when you use Microsoft
    as your base, SSIS is pretty much the standard. From all accounts, SSIS is quick
    to implement, is easy to use, and integrates fully with other Microsoft SQL/Azure
    products (see Figure [5-9](#486629_1_En_5_Chapter.xhtml#Fig9)). The main issue
    arises when you are not a Microsoft shop and have no plans to purchase or use
    the main product lines. Under those circumstances, you might be better off selecting
    another ETL tool.


    **Pros:** A low Total Cost of Ownership (TCO) that allows you to fully integrate
    with other Microsoft products, included as part of the DBMS/Azure license.


    **Cons:** As a non-Microsoft shop, SSIS can be a challenge to support. I recommend
    that if you’re on the fence, download an Evaluation version of SQL Server^([^(97)](#fn97))
    and give SSIS a test run.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig9_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    SSIS Control Flow


    ### MuleSoft


    **Web site:** [`www.mulesoft.com/`](http://www.mulesoft.com/)


    **Review:** MuleSoft was founded in 2006 and became a Salesforce company through
    acquisition in May 2018. Initially, MuleSoft provided enterprise service bus (ESB)
    open source software and, in 2013, became one of the first pure integration vendors
    in the cloud after releasing its API management tool, Anypoint Platform (see Figure
    [5-10](#486629_1_En_5_Chapter.xhtml#Fig10)). My relationship with MuleSoft is
    limited, but I’ve heard through various channels that it is an excellent ETL tool
    with plugs-in to most environments. According to Gartner reports, MuleSoft has
    doubled its client base in the last several years and provides strong API management,
    security support, multi-cloud deployment, and an open-core ESB. As with other
    tools that feature these advanced capabilities, your developers will need to have
    a more significant deal of technical know-how than with other products. Fortunately,
    MuleSoft has some excellent training, both online and in the classroom.


    **Pros:** Currently, MuleSoft appears to be taking a healthy lead in the marketplace,
    perhaps because of its association with Salesforce or because of its existing
    product line, which appeals to customers working with full lifecycle API management,
    hybrid integration, and ease of onboarding.


    **Cons:** MuleSoft still maintains its roots as an enterprise service bus, very
    slowly adopting the functionality of a full-fledged integration tool. This product
    may not be the end-all, be-all solution, but is a product worth investigating
    for your implementations.


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig10_HTML.jpg](images/486629_1_En_5_Chapter/486629_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    MuleSoft Anypoint Platform


    ### Informatica


    **Web site:** [`www.informatica.com`](http://www.informatica.com)


