  raw: '#### Data Migration Plan


    The Appendix contains a Data Migration Plan template along with definitions of
    sample sections to include. As with all templates, you can structure the model
    to whatever fits your own organization’s needs, keeping in mind that its purpose
    is consistent. You are communicating a solution, gaining consensus that your assumptions
    are correct, and setting expectations of what the team will deliver as a final
    product.


    The topics in the Data Migration Plan include the following:


    *   Overview: The background of the project, usually copied from the proposal
    or other project management plans. This section also should contain at least one
    or two paragraphs on the goals of the current migration/integration tasks and
    how it meets the overall business objectives.


    *   Assumptions, Constraints, Risks, and Gaps: This section sets the expectations
    for the limits of the current project, preventing the “I want everything” syndrome
    we identified in a previous chapter. In it, we define some of what our team can
    and cannot do versus what other teams must do (assumptions), limitations due to
    technology or time (constraints), potential issues that might occur (risks), and
    areas of the implementation that remain an open source of debate (gaps). These
    details are highly relevant throughout the project, especially when producing
    results that are either in or out of our area of influence.


    *   Architecture: This section contains two broad constructs—the current state
    and the future state. The current state represents the “as-is” system, that is,
    where the data currently rests, the data systems involved, the counts of records
    stored, and other details that would help teammates familiarize themselves with
    the existing data model. The future state is the “to-be” system—the final snapshot
    where the data will exist after the project is complete. Its subcategories would
    include parallel topics to the current state, but with more of an assumptive flavor
    (where the data will rest, the data systems that will be involved, expected counts,
    and so on). Since much of the future state will be unknown at the outset, it is
    more of an ideal world with gaps that you will answer in as you continue to gather
    requirements.


    Note


    Special attention should be paid to the development tools as well. These will
    be the technologies we are building with (e.g., Python, Java, .NET) as well as
    specialized software related to the build, DevOps, and ETL.


    *   Data Migration Approach: This section covers the overall approach to the integration,
    such as scope, roles, and responsibilities of team members; what should take place
    pre-, during, and post-migration; and contingency plans should the whole system
    fall apart. These requirements should be regarded as brushstrokes of possibilities
    within a larger painting. The real details will be highlighted later in the design
    phase when reality hits home. For now, you should focus on what you can accomplish
    that will best meet the user’s expectations. If you find blockers along the way,
    then you can always backtrack or figure out alternative routes to achieve the
    same purpose.


    *   Testing/Validation: Testing and Validation is one of the more important topics
    in migration, but also the one that receives the least amount of attention. One
    reason may be that the developers who write their code may not be very good at
    testing it.^([^(75)](#fn75)) Nevertheless, it is important that we have a solid
    framework in mind on how to test our integrations and that we document it in the
    Data Migration Plan. We should include the type of tests we plan to conduct (unit
    testing, joint integration, verification testing, and so on). We should also describe
    the kinds of environments we will use for testing and which teams will be conducting
    the tests. As with the Data Migration Approach, we will not have all the answers,
    but we can fill in as many blanks as possible to get a fair estimate.


    ##### The Discovery Process: Tips and Tricks


    As far as the actual discovery process, there is much more to describe than we
    can cover here. If you want a good book on agile requirements gathering, check
    out Jeff Patton’s book *User Story Mapping* (2014).^([^(76)](#fn76)) In terms
    of integration mapping, the following are a few tips that will make your sessions
    more effective.


    ###### Learn the Architecture


    Because you may be working across multiple systems and silos, understanding the
    current architecture as quickly as possible is mandatory. To do this, you must
    reach out to the people who best understand the back-end data. Find and review
    any Entity Relationship Diagrams (ERDs) you come across. Learn about the nature
    of the business and how the future model should look. Ask good questions (to get
    you started, [*http://www.etlsolutions.com/data-migration-planning-checklist/*](http://www.etlsolutions.com/data-migration-planning-checklist/)
    covers a process-driven and tactical checklist of points).


    ###### Keep Your Session Small


    Contrary to the opinions of program directors I have worked with, I often find
    that the smaller the group, the better the collaboration. I would say that, on
    average, a one-on-one requirements gathering session lasting two hours tends to
    cover more ground than an entire team sitting for a half-day session, and much
    of this has to do with *focus*. It is very easy during these sessions to go off
    the rails—one person says a requirement, another person disagrees, a third person
    corrects the first two, and so on. By the time the session is over, there are
    a dozen open topics with almost no accompanying resolution.


    The same outcome rarely happens when conducting a single-person interview. The
    primary advice on going this route, to paraphrase former US President Ronald Reagan,
    is to “trust but verify.”^([^(77)](#fn77)) Take the requirements as stated, write
    them down, add them to your Data Migration Plan, and then share them with the
    rest of the stakeholders during a phase review. If it is an obvious error, someone
    with a strong opinion will correct it. If not, there is always the chance that
    someone will identify it as such in future phases. The point here is that it is
    much easier to correct the stated flow of words than the unstated flow of thoughts.


    ###### Get System Access Early


    You’re going to need access to systems, potentially lots of them like servers,
    databases, files, hidden directories, and the like. Get permission to use these
    systems as soon as you can. Having them available during your discovery session
    will help illustrate the point that your discussion counterpart is trying to make.
    It also helps end the debate much faster when you prove that the file that is
    supposed to be a qualified list of customers is actually a list of championship
    apple pie recipes (I’m not kidding, this really did happen on one of my assignments).


    #### Design


    With the first iteration of requirements complete, it’s now time to start the
    design phase. This phase represents the moment when the technical team pulls away
    from the business side of the house and begins to code the solution, identifying
    issues through data analysis, peer review, and program debugging. Consequently,
    it is also the phase where the most amount of documentation, hence written communication,
    is produced. As with the Data Migration Plan from the previous phase, design templates
    are available in the Appendix.


    We’ll now discuss each document to elaborate on the basic framework.'
  trans: "\n### 数据迁移计划\n\n附录包含一份数据迁移计划模板，以及应包含的示例章节定义。与所有模板一样，您可以根据自身组织的需求调整模型结构，但需牢记其目的应保持一致。您正在传达一个解决方案，就您的假设正确性达成共识，并设定团队最终交付成果的预期。\n\
    \n数据迁移计划涵盖以下主题：\n\n- **概述**：项目背景，通常从提案或其他项目管理计划中复制。本节还应至少包含一两段内容，说明当前迁移/集成任务的目标，以及这些任务如何满足整体业务目标。\n\
    \n- **假设、约束、风险与缺口**：本节设定当前项目范围的预期，以防止出现我们在前一章中提到的“想要一切”综合症。在此，我们定义了团队能做什么和不能做什么（假设）、技术或时间限制（约束）、可能出现的潜在问题（风险），以及实施过程中仍存在争议的领域（缺口）。这些细节在整个项目中高度相关，尤其是在产出属于或不属于我们影响范围的结果时。\n\
    \n- **架构**：本节包含两大结构——当前状态与未来状态。当前状态代表“现有”系统，即数据当前所在位置、所涉及的数据系统、存储的记录数量，以及其他有助于团队成员熟悉现有数据模型的细节。未来状态则是“目标”系统——项目完成后数据将存在的最终快照。其子类别将包括与当前状态平行的主题，但更多带有假设性色彩（数据将存放位置、将涉及的数据系统、预期数量等）。由于未来状态在项目启动时大多未知，它更像是一个理想世界，存在一些缺口，您将在持续收集需求的过程中逐步填补。\n\
    \n> **注意**  \n> 开发工具也应给予特别关注。这些将是我们用于构建的技术（例如 Python、Java、.NET），以及与构建、DevOps 和\
    \ ETL 相关的专用软件。\n\n- **数据迁移方法**：本节涵盖集成的总体方法，例如范围、团队成员的角色和职责；迁移前、迁移中和迁移后应执行的操作；以及当整个系统崩溃时的应急计划。这些要求应被视为更大蓝图中的可能性笔触。真正的细节将在设计阶段后期，当现实情况显现时得到强调。目前，您应专注于能够实现且最能满足用户期望的工作。如果在此过程中遇到阻碍，您始终可以回溯或寻找替代路径来实现相同目标。\n\
    \n- **测试与验证**：测试与验证是迁移中最重要的主题之一，但也是关注度最低的。原因之一可能是编写代码的开发者并不擅长测试。^(⁷⁵) 尽管如此，我们仍需建立一个可靠的框架来测试集成，并将其记录在数据迁移计划中。我们应包括计划进行的测试类型（单元测试、联合集成测试、验证测试等）。同时，还应描述用于测试的环境类型，以及哪些团队将执行测试。与数据迁移方法一样，我们不会有全部答案，但可以尽可能多地填补空白，以获得合理的估算。\n\
    \n### 发现过程：技巧与窍门\n\n就实际的发现过程而言，可描述的内容远多于本文所能涵盖。如果您想要一本关于敏捷需求收集的好书，请参考 Jeff Patton\
    \ 所著的 *用户故事地图* （2014 年）^(⁷⁶)。在集成映射方面，以下是一些能让您的讨论会更高效的技巧。\n\n#### 了解架构\n\n由于您可能需要在多个系统和孤岛之间工作，尽快了解当前架构是必要的。为此，您必须联系最了解后端数据的人员。查找并审阅您遇到的任何实体关系图（ERD）。了解业务的性质以及未来模型应是什么样子。提出好的问题（可以访问\
    \ [*http://www.etlsolutions.com/data-migration-planning-checklist/*](http://www.etlsolutions.com/data-migration-planning-checklist/)\
    \ 作为起点，该网站提供了一个流程驱动且具有战术性的检查清单）。\n\n#### 保持小组规模小\n\n与我合作过的项目主管的观点相反，我常常发现小组规模越小，协作效果越好。我认为，平均而言，一次持续两小时的一对一需求收集会议所覆盖的范围，往往超过整个团队半天的讨论会。这在很大程度上与*专注*有关。在这些会议中，很容易偏离主题——一个人提出一个需求，另一个人不同意，第三个人纠正前两个人，如此循环。到会议结束时，会出现十几个未解决的问题，几乎没有相应的解决方案。\n\
    \n进行单人访谈时，很少出现同样的结果。用已故美国总统罗纳德·里根的话来说，采用这种方法的主要建议是“信任但核实”。^(⁷⁷) 将所陈述的需求记录下来，添加到您的数据迁移计划中，然后在阶段评审期间与其他利益相关者分享。如果是明显的错误，有强烈意见的人会纠正它。如果不是，总有可能会有人在后续阶段指出这一点。关键在于，纠正已陈述的文字流远比较容易的。\n\
    \n#### 尽早获取系统访问权限\n\n您将需要访问各种系统，可能包括服务器、数据库、文件、隐藏目录等。请尽快获得使用这些系统的权限。在发现讨论期间能够访问这些系统，有助于说明讨论对象试图表达的观点。当您证明本应是合格客户名单的文件实际上是一份获奖苹果派食谱清单时，这也有助于更快地结束争论（我没开玩笑，这确实发生在我的一次任务中）。\n\
    \n### 设计\n\n完成第一轮需求收集后，现在该进入设计阶段了。这个阶段代表技术团队从业务层面抽身，开始编写解决方案代码，通过数据分析、同行评审和程序调试来识别问题。因此，这也是产出最多文档（即书面沟通）的阶段。与前一阶段的数据迁移计划一样，附录中也提供了设计模板。\n\
    \n接下来，我们将逐一讨论每份文档，以阐述基本框架。\n"
- fmt: '### Data Profile Analysis


    We have access to the source systems and a full dataset supplied for our review.
    But how clean, valid, and reliable is the data with which we are working? To answer,
    we must first conduct a `Data Profile Analysis`, the process of reviewing source
    data; understanding the structure, content, and interrelationships; and then identifying
    their potential for data projects.^([^(78)](#fn78))


    What we’re interested in here is whether the source data we are analyzing is going
    to move cleanly into our target system. For instance, let’s say you have 20,000
    contact records to move. Only 25% of them, or 5,000, contain a street address.
    The new system, however, will *require* this street address to be included upon
    insertion. In other words, without doing anything, you’re going to have 15,000
    records omitted from the new system. What should you do?


    You can probably come up with several solutions:


    1. Put a default value of “N/A” on the source system’s street addresses that are
    blank.

    2. Allow the target system to temporarily accept `NULL` values and then turn back
    on the constraint after your initial migration is complete.

    3. Inform the business that someone must populate these records in the source.


    Each one of these options requires a specific level of effort, and you must work
    with teams to decide before performing any migrations. Exposing these issues and
    their workarounds is the primary purpose of the `Data Profile Analysis`.


    I’ve seen many talented analysts fall apart on this deliverable. What data fundamentals
    matter, and what should be omitted? One suggestion is to include these topics:


    - Collecting descriptive statistics like `min`, `max`, `count`, and `sum`

    - Collecting data types, length, and recurring patterns

    - Tagging data with keywords, descriptions, or categories

    - Performing data quality assessment, risk of performing joins on the data

    - Discovering metadata and assessing its accuracy

    - Identifying distributions, key candidates, foreign-key candidates, functional
    dependencies, and embedded value dependencies and performing inter-table analysis


    It seems complicated for the novice, and it may be. Fortunately, we don’t need
    to reinvent the wheel as there are a number of both open source and third-party
    tools available for use.^([^(79)](#fn79)) One of the ones I have recommended for
    many years is Don McMunn’s Freeware Data Profiling Tool Kit at [*http://www.ipcdesigns.com/data_profiling/*](http://www.ipcdesigns.com/data_profiling/).
    It provides a series of queries for SQL Server and Oracle that create data profiling
    tables that you can then incorporate with your datasets. At the very least, it
    offers a guide for standard data profiling fields you may want to include in your
    analysis.


    Remember, having even a small subset of profiled data is better than reviewing
    nothing at all.


    ### Issues Log


    Inevitably, you will see something along your data design journey that was never
    discussed during requirements gathering. It may be an isolated field or a table
    of data that is ripe for the new target but remains unidentified. You will have
    questions and require further clarification. To keep track of this, we recommend
    storing your comments in an `Issues Log`, a document that records and tracks issues
    or questions related to the data quality and data migration process. Keep this
    file in a physical notebook, a thumb drive file, or, better yet, a group folder
    online where teams can review and provide immediate feedback. Whatever way you
    choose to store the information, make sure you direct the right question to the
    right team members and, more importantly, get the answers you need.


    ### Source-to-Target Mapping


    If there’s one thing you take away from this book, it’s the importance of properly
    maintaining a `Source-to-Target mapping` (`STTM`) spreadsheet. This document is
    the end all, be all of integration and, consequently, a mandatory part of the
    process. No excuses for skipping this part, so read and reread this section until
    it becomes rote.


    Because the `STTM` is such a critical component, I will go into more detail on
    its purpose, design, and usage than in other sections. Hopefully, by the end of
    the reading, you’ll have a clear understanding of why this deliverable matters
    so much.


    #### Purpose


    The `Source-to-Target mapping` is “a set of data transformation structures that
    determine how to covert the structure and content of data in the source system
    to the structure and content needed in the target.”^([^(80)](#fn80)) In short,
    it is your playlist of requirements for extracting, transforming, and then reloading
    your data. Think of it as a roadmap of expected inputs and outputs, with the step-by-step
    transformation in the middle.'
