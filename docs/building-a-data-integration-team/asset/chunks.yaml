    \ this book for many reasons, but primarily so that data teams could have a handy\
    \ reference and guide when their integration projects inevitably slip off the\
    \ rails. As I will mention over and over, it is no fun to find ourselves with\
    \ too little time and too many deliverables, rushing headlong into panic mode\
    \ while the hours ebb deep into the night. Trial and error no doubt plays a huge\
    \ role in figuring out how to get out of the mess we’ve either created or inherited,\
    \ and I assure you, I’ve been there. With that in mind, several people have been\
    \ instrumental in supporting me as well as finding the right solutions and principles\
    \ summarized in this book.\n\n**To my parents, Arthur and Lila Goldfedder:** Ever\
    \ since I was a child, I said I wanted to be a writer. Finally, we have something\
    \ to put on that empty bookshelf. Thank you for all you’ve done to motivate me\
    \ and give me a sense of joy and pride. I hope this book does the same for you.\n\
    \n**To my brother, Brandon Goldfedder:** Without a doubt, everything I know about\
    \ computers is because of you. I am proud to have you as a brother and an even\
    \ better friend that carefully listened as I complained about writing for 3 hours\
    \ with only two pages to show for it. Yes, you’re right: pictures help.\n\n**To\
    \ the team at Acumen Solutions:** A big shout-out to Cristina Miller, Adam Horvath,\
    \ Saurabh Verma, and Chuck Boyd who coached me while I worked at Acumen. You allowed\
    \ me the space to discuss, test, experiment, lament, and brainstorm many ideas,\
    \ some good and some not as good. It was through your open-mindedness, patience,\
    \ and commitment that I acquired the experience to write this book. I am very\
    \ grateful.\n\n**To the team at Apress, Jessica Vakili, Susan McDermott, and Laura\
    \ Berendson:** A thousand thank-yous for believing in me when I made the pitch\
    \ for this book and for checking in to make sure it all went like clockwork. You\
    \ are my go-tos for the next time around.\n\n**To my technical reviewer, Wendy\
    \ Zhou:** You became the first deep-dive reviewer of this book. Your comments\
    \ and feedback significantly boosted my confidence when I stumbled over the question\
    \ just about every technical writer faces: “What if no one understands this?”\
    \ You assured me they would, and while I can’t guarantee initial reactions, at\
    \ least I know that I’m not alone with the problem that we are trying to solve,\
    \ and you made it all worth it.\n\n**To my wife and daughter, Heather and Melinda,\
    \ to whom this book is dedicated:** Thank you for giving me the time and space\
    \ I needed, even when it meant weekends in seclusion, and exciting you both by\
    \ talking about the latest trends in data integration after your long days of\
    \ work and school. You two are the best. Me more.\n\nAbout the Author About the\
    \ Technical Reviewer Footnotes [1](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fn1_source)\
    \   [2](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fn2_source)   [3](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fn3_source)\
    \   [4](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fn4_source)\n\n# 1. Integration\
    \ Background\n\n> *If you can’t describe what you are doing as a process, you\
    \ don’t know what you’re doing.*\n> \n> —W. Edwards Deming^([⁵](#fn5))\n\nTechnology\
    \ has progressed so quickly in the past few decades that we often forget that\
    \ what today seems so simple was once quite complex. Data integration first appeared\
    \ in the 1970s when company personnel recognized that they could use mainframe\
    \ databases to store different types of business information. Companies and their\
    \ developers produced early versions of what would become extraction, transformation,\
    \ and loading (ETL) tools to copy data from one or more sources into destination\
    \ systems. This housing of these multiple data repositories was the forerunner\
    \ of today’s data warehouses.\n\nDuring the late 1980s and early 1990s, as the\
    \ concept of the data warehouse became entwined in mainstream technology, integration\
    \ between mainframes, minicomputers, personal computers, and spreadsheets became\
    \ more and more necessary.^([⁶](#fn6)) Proponents of utilizing data integration\
    \ flourished. Bill Inmon, designated the father of data warehousing, referred\
    \ to this outgrowth as “the corporate wisdom” that needed to be a standard part\
    \ of the corporate infrastructure.^([⁷](#fn7))\n\nData warehousing was a popular\
    \ technological breakthrough, and software companies, as they are apt to do in\
    \ profitable ventures, entered the market with their proprietary solutions. Each\
    \ market claimed to be better than its competitors, with the result that one department\
    \ of an organization, perhaps focusing on its own need, would adopt a completely\
    \ different ETL tool than another department. Thus, contrary to the promises of\
    \ integration, the promulgation of tools led to an *increase* in data silos, rather\
    \ than a decrease.\n\nOn top of that, the mergers and acquisitions of the dot.com\
    \ boom forced enterprises to adopt multiple ETL solutions. Each of these had its\
    \ particular framework, and the entire warehouse solution would need to be either\
    \ merged into one single system or left as is, thereby relegating the entire architecture\
    \ into one big mess."
  trans: "\n# 集成背景\n\n> *如果你不能将自己所做的事情描述为一个流程，那么你就不知道自己正在做什么。*\n> \n> —W. 爱德华兹·戴明^(⁵)\n\
    \n过去几十年间，技术发展如此迅速，以至于我们常常忘记，如今看似简单的事物，曾经是多么复杂。数据集成最早出现在 20 世纪 70 年代，当时公司员工认识到可以利用大型机数据库来存储不同类型的业务信息。公司及其开发者们制作了早期版本的提取、转换和加载（`ETL`）工具，用于将数据从一个或多个源复制到目标系统。这些多个数据存储库的集合，便是当今数据仓库的前身。\n\
    \n在 20 世纪 80 年代末至 90 年代初，随着数据仓库的概念融入主流技术，大型机、小型机、个人计算机和电子表格之间的集成变得越来越必要。^(⁶) 倡导利用数据集成的支持者随之涌现。被誉为数据仓库之父的比尔·恩门将这一产物称为“企业智慧”，认为它应成为企业基础设施的标准组成部分。^(⁷)\n\
    \n数据仓库是一项广受欢迎的技术突破，软件公司（正如它们在有盈利前景的事业中惯于做的那样）带着各自专有的解决方案进入市场。每个公司都声称自己比竞争对手更胜一筹，结果导致组织内的一个部门（或许只关注自身需求）会采用与另一个部门完全不同的`ETL`工具。因此，与集成所承诺的愿景背道而驰，工具的泛滥反而导致了数据孤岛的*增加*，而非减少。\n\
    \n除此之外，互联网繁荣时期的并购浪潮迫使企业采用多种`ETL`解决方案。每种方案都有其特定的框架，整个仓库解决方案要么需要合并成一个单一系统，要么维持原样，从而将整个架构搞得一团糟。\n\
    \n# 第八章：监控结果\n\n设计已经完成，业务方对需求感到满意，项目也已上线。剩下的唯一一件事就是开始监控集成的结果。在本章中，我们实施一个 PDCA（计划-执行-检查-处理）循环来改进集成输出，通过电子邮件和其他通知渠道向用户提供每日成功和错误计数。我们讨论识别错误的方法，确保数据系统的拥有者知道一旦发现问题该如何解决。最后，我们简要讨论了如何将集成用作商业智能的输入，可能利用分析来发现数据中的空白，从而催生更多的集成项目。\n\
    \n# 第九章：推广你的团队\n\n此时，集成团队应该已经部署了至少几个项目，并因其成功的成就而赢得了赞誉。然而，现在可不是躺在功劳簿上休息的时候。在兴奋劲消退之前，团队应该主动联系整个企业内的各个部门，识别出最适合进行数据集成的未来项目。这种方法的一部分将涉及进行宣传，让外部团队了解集成团队所做的工作；开展教育活动，例如午餐学习会；并参与构建集成卓越中心。了解企业即将到来的财年目标也很有价值；通过一些调研和创造力，团队可以构建一个集成数据路线图。这份可视化的总结，等同于产品路线图，描绘了集成产品的愿景和方向、它们所服务的部门以及预计完成时间。\n\
    \n# 致谢\n\n我写这本书有很多原因，但最主要的是为了让数据团队在集成项目不可避免地偏离轨道时，能够拥有一本方便参考的指南。正如我将反复提到的，当我们发现自己时间紧迫、交付物过多，在夜深人静时分一头扎进恐慌模式时，这绝非乐事。反复试错无疑在弄清楚如何摆脱我们自己造成或继承的混乱局面中扮演着重要角色，而且我向你保证，我也有过这样的经历。考虑到这一点，有几个人在我寻找正确的解决方案并总结本书所述的原则时，给予了我极大的支持。\n\
    \n**致我的父母，亚瑟和莉拉·戈德费德：** 从我小时候起，我就说我想成为一名作家。终于，我们有了可以放在那个空书架上的东西了。感谢你们所做的一切，激励我，并给予我快乐和自豪感。我希望这本书也能带给你们同样的感受。\n\
    \n**致我的兄弟，布兰登·戈德费德：** 毫无疑问，我所了解的有关计算机的一切都归功于你。我很自豪能拥有你这样的兄弟，更是一位更好的朋友，你耐心地听我抱怨写了三个小时却只憋出两页纸。是的，你说得对：图片很有帮助。\n\
    \n**致 Acumen Solutions 的团队：** 特别感谢克里斯蒂娜·米勒、亚当·霍瓦特、索拉布·维尔马和查克·博伊德，他们在我于 Acumen\
    \ 工作期间指导了我。你们给了我讨论、测试、实验、反思和集思广益的空间，构思了许多想法，有些好，有些则不那么好。正是通过你们的开放心态、耐心和承诺，我获得了撰写本书的经验。我非常感激。\n\
    \n**致 Apress 的团队，杰西卡·瓦基利、苏珊·麦克德莫特和劳拉·贝伦德森：** 千言万语地感谢你们在我提出本书的构想时就信任我，并一直跟进确保一切顺利进行。你们是我下次出书的首选联系人。\n\
    \n**致我的技术审校，温迪·周：** 你成为了本书的第一位深度审校。当我纠结于几乎所有技术作者都会面临的疑问——“如果有人看不懂怎么办？”时，你的评论和反馈极大地增强了我的信心。你向我保证他们会懂的，虽然我无法保证读者的初步反应，但至少我知道在解决我们试图解决的问题上，我并不孤单，而你让这一切都变得值得。\n\
    \n**致我的妻子和女儿，希瑟与梅琳达，这本书献给你们：** 感谢你们给予我所需的时间和空间，即使这意味着周末要与世隔绝，并在你们漫长的工作日和学习日之后，还要听我谈论数据集成的最新趋势来让你们兴奋。你们俩是最棒的——当然我更棒。\n\
    \n# 关于作者\n\n# 关于技术审校\n\n# 脚注\n\n1  \n2  \n3  \n4\n"
- fmt: '## The Current Landscape: Two Distinct Models


    As business models have changed to fit the times, so has the ability of organizations
    to integrate their data, and the approach has taken on a new fashion. Thanks to
    research and consultancy firms such as Gartner, Inc., popular ETL software have
    taken on steam; we’ll discuss some of my favorite products in Chapter 4. Enterprise
    systems are slowly switching their focus from on-premise data repositories to
    cloud-based ones such as `AWS Redshift` and `Microsoft Azure`, and developers’
    abilities to design more modular solutions have eased. From this technological
    shift, two data integration models have become prevalent:


    1. The “data at rest” model whereby the ETL system gathers information across
    the enterprise and combines records into a consolidated view

    2. The “Data Lake” model in which terabytes of data (“Big Data”) are combined
    from multiple different data sources, both structured and unstructured, and analyzed
    through extremely fast processing engines


    These models and the skills required by teams to build them are quite different.
    For example, the “data at rest” model represents the modern-day corporate data
    warehouse, usually requiring team members to possess a fair amount of knowledge
    in database design, architecture design, and ETL development. These systems tend
    to stay around for the long term, eventually encapsulating a centralized position
    in the enterprise.


    On the other end of the spectrum, the Data Lake models, due to their high volume
    of streaming data, tend to be more ephemeral, housing data for the short term
    and generating output on an as-needed basis. For this model, the required skills
    focus more on Big Data technologies, NoSQL architectures, and data streaming analytics.


    These systems can overlap in that some “data at rest” models may contain unstructured
    data and some “Data Lakes” will have persistent storage. I provide them as examples
    to denote that we do not create all data repositories the same: different configurations
    will require vastly different technical skills.


    ## Waterfall Vs. Agile Models


    The timeline required to bring the selected data model to fruition also differs.
    By its very nature, a “data at rest” integration model may require years to perfect
    versus a Data Lake model based on a stream of Facebook data. For this reason,
    project teams need to be aware of the potential design issues when scheduling
    their target delivery dates. This knowledge means that we should avoid a one-size-fits-all
    strategy. Rather, it is the core team and stakeholders that should define when
    and how integration requirements and the resulting product should be delivered.
    In practice, there are two directions we can take:


    1. Do the stakeholders expect the analysts to outline the requirements at the
    beginning of the project with a deliverable prepared at the end?

    2. Is the project more of a “define as you go” approach with deliverables established
    across a series of iterations?


    While there can be varying shades of gray between these two spectrums, planning
    can take the form of either the Waterfall or Agile methodology. Understanding
    how these two methodologies fit into an integration model is important as they
    help establish the team-building framework that we discuss throughout this book.


    ### The Waterfall Model


    The Waterfall Model, also known as the linear-sequential lifecycle model, was
    one of the first process models to be introduced into modern organizations. In
    the waterfall model, a set of phases must be completed before signoff occurs,
    and the next phase begins. There is no overlap between phases, with the flow generally
    a forward-moving, linear process, similar to a moving body of water. As Figure
    1-1 illustrates, the Waterfall Model looks exactly like its namesake.


    ![../images/486629_1_En_1_Chapter/486629_1_En_1_Fig1_HTML.jpg](images/486629_1_En_1_Chapter/486629_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    The Waterfall Model


    We see the multiple phases of a waterfall-implemented project, which could be
    software engineering, construction, or even planning a party—starting with the
    gathering of requirements, the system design, the implementation, the testing,
    the deployment, and finally the maintenance. This type of model works well for
    teams who have a known representation of the tasks ahead and, therefore, can allocate
    resources based on the task and time required. For example, business analysts
    can be sourced for a two-week requirement analysis phase, followed by system architects
    who are brought in for a week to build the design, followed by programmers who
    code during a four-week implementation phase, and so on.


    The waterfall model has both its pros and cons. But as one of the first successful
    project management methodologies, it is still highly regarded in today’s business
    world.


    Integration teams brought in to support a waterfall-based project generally join
    with the rest of the development team—that is, during the implementation phase.
    This strategy is not always the optimal one, however. Because integration closely
    aligns with business rules and varying degrees of complexity in terms of source-to-target
    mappings (`STTMs`) (which we discuss in the next chapters), a more secure approach
    is to have some representation of the integration team from the very first meeting,
    that is, allowing the integration team to provide input and knowledge sharing
    during the requirement analysis and system design. This representation can consist
    of face-to-face interaction with a business-facing developer or via proxy from
    a business analyst with a technical understanding of integration. In any case,
    I recommend having an integration team member available to discuss technical details
    from the outset as this involvement will reduce scope creep and architecture modeling
    issues once project design begins.'
