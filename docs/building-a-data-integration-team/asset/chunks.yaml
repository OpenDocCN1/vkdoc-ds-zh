    # 集成里程碑


    在项目的集成部分，最关键的是架构师、设计师和利益相关者之间的沟通。一个被遗漏的需求或不准确的转换不仅会延迟系统完成，而且——如果数据传输失败——可能会造成巨大损害，不仅限于局部，甚至可能达到全局层面。一个著名的事件是
    1987 年的“黑色星期一”股市崩盘，据称那次大规模的数据交换导致了级联效应，迫使股市中的所有竞标同时消失。据一些专家称，计算机系统当时并未经过测试，以处理崩盘期间的市价订单。^(⁷⁴)
    仅基于这一事件，理解集成过程及其潜在陷阱对所有人来说都应是重中之重。


    但是，正如我们讨论过的，情况并非总是如此。在项目管理阶段，规划者常常将集成任务视为软件开发的另一部分。一个功能需求，例如“系统应将联系人的名字、姓氏、邮政编码和电话号码从数据库
    `X` 移动到数据库 `Y`”，从三万英尺的高空俯瞰固然不错，但它不一定能涵盖当电话号码或邮政编码值使用不同格式时发生的不可接受的情况（参见第 5 章）。如果在项目阶段早期没有遇到并处理这些问题，集成——进而整个系统本身——将会失败。


    这便将我们带到了集成里程碑。这些里程碑与软件交付阶段并行发生，但需要不同的产出。表 4-1 总结了不同的项目阶段、阶段关口可交付成果以及简要说明。


    **表 4-1** 项目阶段与迁移文档


    | 项目阶段 | 阶段关口可交付成果 | 描述 |

    | --- | --- | --- |

    | 启动 | 团队代表 | 包含一名或多名集成团队代表，以确认或否定与交付项目提案相关的任何假设。 |

    | 定义 | 数据迁移计划 | 记录项目背景和目的、迁移与集成方法、假设、约束、风险，以及当前和目标状态架构。 |

    | 设计 | 数据概况分析 | 审查源数据、结构、内容和关系，以评估其内容与质量。 |

    | 设计 | 问题日志 | 记录并跟踪与数据质量和数据迁移相关的任何问题或疑问。 |

    | 设计 | 源到目标映射 | 记录从源到目标的映射，包括数据类型和转换规则。 |

    | 设计 | 数据迁移流程设计 | 记录迁移流程的详细设计，包括操作顺序。 |

    | 开发 | ETL 脚本 | 记录与抽取、转换和加载相关的前端和后端代码；应随后进行同行评审会议。 |

    | 实施 | 迁移结果报告 | 按对象记录迁移结果、明细、错误影响、行动项和风险。该报告在每次迁移（包括模拟/测试迁移）后创建。 |

    | 实施 | 上线/部署计划 | 记录执行迁移的详细的、分步骤的、从头到尾的计划，包括各种依赖关系。 |


    我们将深入讨论这些可交付成果中的每一项。现在，我想强调，这种交付模式并非强制性的。它只是实现任何协作努力中固有目标的一种方式；也就是说，它能够削弱（甚至避免）当利益相关者意识到他们得到的餐点与他们认为他们点的餐点不同时所带来的影响。它还能让开发团队的工作更轻松，因为大多数问题从一开始就得到了处理，而不是在最后一刻，当工作量突然变得比“仅仅周末按按按钮”大得多时才发现。


    ## 启动


    了解集成复杂性的秘诀在于从一开始就参与其中，这意味着在项目启动的最早阶段就应有代表参与。对于传统管理者来说，在商业提案中包含纯粹的技术代表可能看起来很奇怪，但错误的假设和误解时有发生，从而扭曲了对范围和工作量的理解。一方面，组织倾向于重复使用过去对他们有效的提案模板。从可重复性的角度来看，这是有道理的——类似产品的交付过程应该是相同的。但如果我们记住集成应该是独特的，那么我们就意识到确保我们在此流程中涵盖所有基础是多么重要。也就是说，仅仅因为某个特定的源到目标架构过去有效，并不意味着它能同样适用于类似类型的项目。为某个客户存储在数据库
    `A` 中的数据，不等同于为另一个客户存储在数据库 `B` 中的相同数据。定制化、触发器、值以及所有其他需要迁移的内容都需要进行全面的概况分析，并且在考虑我们的产品时必须将此纳入考量。


    应征求集成团队代表对特定迁移工作的可行性、预期时间和工作量的可靠意见。虽然此时我们不应该讨论技术解决方案，但至少，“这会有多复杂？”和“你需要多少人手？”这类问题应该成为提案讨论的一部分。如果技术问题的答案仍然大多未知，那么就应如实说明。关键在于，提案应该反映这些未知因素，而不是基于过去的项目做出完全冒险（或不准确！）的假设。


    简而言之，在提案中纳入集成代表可以制定准确的计划，并确保有时间限制的解决方案是可行的。它还能建立信心，使项目无需因未公开的期望而引发过多突发问题即可实现。


    ## 定义


    集成需求往往是高度具体的（例如，“我们只希望导入这三个字段，除非用户来自财务部门，在这种情况下，我们只应使用另外这三个字段”）或者不够具体（例如，“我们想要一切”）。因此，为了避免在第一次迭代中可能出现的铺天盖地的请求洪流，建立一份功能性和非功能性需求的检查清单至关重要，这些需求应作为名为
    `数据迁移计划` 的文档的一部分。该文档在一定程度上详细说明了项目背景和目的、迁移与集成方法、假设、约束、风险，以及当前和目标状态架构。

    '
- fmt: "### Data Migration Plan\n\nThe Appendix contains a Data Migration Plan template\
    \ along with definitions of sample sections to include. As with all templates,\
    \ you can structure the model to whatever fits your own organization’s needs,\
    \ keeping in mind that its purpose is consistent. You are communicating a solution,\
    \ gaining consensus that your assumptions are correct, and setting expectations\
    \ of what the team will deliver as a final product.\n\nThe topics in the Data\
    \ Migration Plan include the following:\n\n- **Overview**: The background of the\
    \ project, usually copied from the proposal or other project management plans.\
    \ This section also should contain at least one or two paragraphs on the goals\
    \ of the current migration/integration tasks and how it meets the overall business\
    \ objectives.\n\n- **Assumptions, Constraints, Risks, and Gaps**: This section\
    \ sets the expectations for the limits of the current project, preventing the\
    \ “I want everything” syndrome we identified in a previous chapter. In it, we\
    \ define some of what our team can and cannot do versus what other teams must\
    \ do (assumptions), limitations due to technology or time (constraints), potential\
    \ issues that might occur (risks), and areas of the implementation that remain\
    \ an open source of debate (gaps). These details are highly relevant throughout\
    \ the project, especially when producing results that are either in or out of\
    \ our area of influence.\n\n- **Architecture**: This section contains two broad\
    \ constructs—the current state and the future state. The current state represents\
    \ the “as-is” system, that is, where the data currently rests, the data systems\
    \ involved, the counts of records stored, and other details that would help teammates\
    \ familiarize themselves with the existing data model. The future state is the\
    \ “to-be” system—the final snapshot where the data will exist after the project\
    \ is complete. Its subcategories would include parallel topics to the current\
    \ state, but with more of an assumptive flavor (where the data will rest, the\
    \ data systems that will be involved, expected counts, and so on). Since much\
    \ of the future state will be unknown at the outset, it is more of an ideal world\
    \ with gaps that you will answer in as you continue to gather requirements.\n\n\
    > **Note**  \n> Special attention should be paid to the development tools as well.\
