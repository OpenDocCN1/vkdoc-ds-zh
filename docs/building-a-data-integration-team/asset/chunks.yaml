  trans: '

    # 迁移的简洁性


    我们从一个基础示意图开始。数据集成组件看起来相当简单。


    ![../images/486629_1_En_2_Chapter/486629_1_En_2_Fig1_HTML.jpg](img/486629_1_En_2_Fig1_HTML.jpg)


    图 2-1


    一个简单的 ETL 示意图


    图 2-1 展示了一个典型的迁移/集成架构。我们有一个或多个源系统，它们将文档传递给中间件组件（ETL 工具），然后该工具再将数据推送至一个或多个目标系统。从高层次来看，这似乎相当容易实现。由于只涉及三个组件，不难理解为何“一键式”概念会流行起来。


    但深入探究该模型，梳理出每个组件的常见组成部分，我们会发现这个设计要复杂得多（见图 2-2）。


    ![../images/486629_1_En_2_Chapter/486629_1_En_2_Fig2_HTML.jpg](img/486629_1_En_2_Fig2_HTML.jpg)


    图 2-2


    一个不那么简单的 ETL 示意图


    如果没有过往经验，我们面临的挑战在于理解这些组件各自将如何影响我们的整体解决方案。在规划集成框架时，每个组件都需要我们加以考虑并进行一定程度的讨论。


    在本章的剩余部分，我们将讨论这些组件的定义和优先级、它们如何融入我们的设计，以及根据手头任务如何最佳地实现它们的一些示例。


    ## 源系统


    源系统代表存放我们入站数据的位置。它涵盖了从逗号分隔值（CSV）文件、Excel 电子表格到复杂数据库和大型主机等各类存储库。简而言之，任何包含需迁移至他处的数据的系统都被视为源系统。


    自然地，在最初的审查阶段，讨论源系统时会涌现出大量问题。它们位于何处？我们如何访问它们？哪些是关键数据，又存储在何处？至关重要的是，在最初的几次发现会议中（关于事件顺序的讨论见第
    4 章），必须邀请熟悉这些系统并了解其设计、用途和特有流程的相关人员参加。这些人员应具备适当水平的技术知识或文档，以便能够提供我们在此讨论的信息。


    ### 连接类型


    连接类型代表了数据所在的存储位置。它可以是任何提供数据的载体，例如 Excel 电子表格、数据库、文本文件等。与此相关的还有若干子类别，可能提供必要的详细信息。例如，如果数据以文本文件形式提供，它是逗号分隔、制表符分隔还是其他分隔方式？如果连接类型是数据库，有哪些插件支持它？了解这些细节尤为重要，特别是当这需要钻研晦涩的
    SQL 代码或寻找支持小众数据库的兼容 ETL 连接器时。


    ### 源端点


    端点简单地说是通信信道的一端。^(²¹) 它可以是一个容易理解的 URL，例如 “`https://example.com/this-is-an-endpoint/`”，或者更复杂的
    WSDL 或 REST 调用，如 “`http://www.myserver.com/mycustomSite/_vti_bin/excelservice.asmx?WSDL`”，如果是从事各种在线云或本地数据库系统中检索，它可以是
    JDBC 或 ODBC 连接字符串，例如 “`https://www.infocaptor.com/dashboard/jdbc-odbc-drivers-connections-and-strings-url`”。


    没有正确的端点，访问数据就会变得困难。如果利益相关者或业务用户不直接知道端点，所提供的 API 用户手册中可能包含答案。此外，在大多数情况下，您需要一个用户名和密码，以便能够以适当的访问级别登录。有了这些信息，您就能够检索（`GET`
    方法）或输入（`POST` 方法）数据。我们将在本章后面讨论这如何适用于目标端点。


    ### 元数据模型


    元数据模型是描述其他数据的数据。它汇总了关于数据的基本信息，这可以使查找和处理其他数据变得更加容易。例如，在处理照片图像时，了解文件大小或拍摄照片的相机类型背后的详细信息会很有帮助。^(²²)
    在集成数据时，至少有六个对象元数据字段非常有用：^(²³)


    *   记录创建日期：告诉你一行数据的“年龄”

    *   记录创建者：告诉你创建该记录的人（或服务账户！）

    *   记录更新日期：告诉你该行数据的新鲜程度

    *   记录更新者：告诉你该与谁联系以获取关于更新记录的更多状态信息

    *   记录来源：告诉你最初是哪个系统提供了这条记录

    *   行版本号：告诉你用户更新一行数据的次数


    在数据领域，元数据模型也常被用来泛指数据模式。就我们的目的而言，这正是关键所在，尤其是在构建源字段与目标字段之间的映射时。如果您想巩固您的集成需求，那么为您的源系统和目标系统推导出元数据模型是强制性的。由于其重要性，我们将在本书中持续引用元数据映射过程（称为源到目标映射）。


    ### 数据剖析


    您数据库的有效性完全取决于所提供的信息质量，而数据剖析正是审查源数据内容和质量的一种实践。其主要目标是帮助我们发现源数据的结构、内容以及它们之间的关系。^(²⁴)
    让我们仔细看看这些发现概念。


    #### 结构发现


    我们期望数据格式一致。例如，美国电话号码应有十位数字，美国邮政编码通常为五位。但有时结构可能不一致。我们数据集中的美国电话号码可能包含办公分机号，美国邮政编码也可能包含四位扩展码。在映射到我们类似的目标系统时，识别结构异常非常重要。例如，如果源系统中的
    `POSTALCODE` 字段允许 “19122-2553” 格式，而我们假设目标系统中应为 “19122”，那么迁移后的数据将会丢失那些能加快邮件投递速度的结构信息。


    #### 内容发现


    这种类型的剖析涉及检查单个数据记录以及现系统错误。例如，我们之前例子中的邮政编码可能因输入错误而缺少数字（例如，四位字符而非五位），或者值可能是存储在源系统中的国际值（例如，代表伦敦市的
    “SW1A 1AA”）。内容发现将帮助我们确定需要校正哪些具体的行和字段，使我们能够标记出在集成前可能需要在源系统中进行修正的记录。

    '
- fmt: '# Relationship Discovery


    As systems increase in complexity, so does the interconnectivity among the different
    components of those systems. Relationship discovery is the process of evaluating
    how one field connects to another, allowing lookups among different objects. Relationships
    are critical in many databases, so much so that we commonly refer to databases
    as relational database management systems (`RDBMS`).


    As a simple example, imagine we have a lookup table containing the whole of US
    postal codes. Now imagine we have a `CUSTOMER` table with first name, last name,
    a product, and the address of that user. Rather than repeatedly entering the city,
    state, and zip code for each user, we could instead supply a key that performs
    a lookup against the postal code lookup table (see Figure 2-3).


    ![../images/486629_1_En_2_Chapter/486629_1_En_2_Fig3_HTML.jpg](images/486629_1_En_2_Chapter/486629_1_En_2_Fig3_HTML.jpg)


    **Figure 2-3** – Relationship Between `CUSTOMER` and `PostalCode`


    If we examine Figure 2-3, relationship discovery begins to make sense. `CUSTOMER.Id
    #1` (John Smith) contains `CUSTOMER.PostalId #75`. This value is a direct reference
    to the `POSTALCODE` table record for “Los Angeles, California, 90001.” Viewed
    this way, we can see why it is necessary to recognize the relationship between
    `CUSTOMER` and `POSTALCODE` and not just make assumptions that one table is all
    we need.


    Without having this understanding of the relationship, you can get very lost in
    the details, especially if the comparative table in the target system differs
    widely from the source. To illustrate, let’s take our example a step further.
    For various design reasons, the target `CUSTOMER` table now contains the complete
    city, state, and postal code fields (i.e., there is no reference to a `PostalId`).
    If you just took the source data and mapped directly to the target, you would
    have both incomplete as well as inaccessible data (see Figure 2-4).


    ![../images/486629_1_En_2_Chapter/486629_1_En_2_Fig4_HTML.jpg](images/486629_1_En_2_Chapter/486629_1_En_2_Fig4_HTML.jpg)


    **Figure 2-4** – Customer Mapping Without `PostalCode` Relationship Discovery


    Figure 2-4 illustrates that the target City, State, and `PostalCode` values are
    impossible to populate when the `POSTALCODE` table is missing from the equation.
    The moral of this illustration is to ensure that you identify and document *all*
    tables that make up the entire data view and not just go with the assumed one-to-one
    match approach.


    ## ETL Tool


    The extraction, transformation, and loading (`ETL`) portion of our model is made
    up of both the middleware platform (i.e., an on-premise or cloud-based server)
    and the software that compiles code designed for integrating the data from the
    source to the target. Any system that can pull or receive (extract) data from
    the source system, perform modifications through a sequence of processing steps
    (transformation), and then push (load) this data into a target designation qualifies
    as an `ETL` tool. This part of the architecture is where most of the lift and
    hardwiring for the integration team will occur, so picking the right `ETL` platform
    and software is crucial.


    We cover `ETL` software and design in later chapters. For now, we’ll introduce
    the standard technical components that comprise the `ETL` model.


    ### Source-to-Target Mapping


    For the data integration team, the source-to-target mapping (`STTM`) is a set
    of instructions that determine how to convert the data from the source system
    into the proper structure and content required by the target system. At its most
    basic, the `STTM` includes only the relevant source metadata, transformation rules,
    and target metadata. There are many more details that you can provide, and the
    more complex solutions will probably require them. We’ll discuss more about these
    optional fields in Chapter 4.


    ### Design Code


    Nothing confusing here. The design code is merely the code that extracts, transforms,
    and loads the data from the source to the target. But as the brains behind the
    whole integration process, the design code configuration rests entirely on the
    chosen `ETL` software. Some user interfaces are graphic drop-and-drag, while others
    require programming against proprietary libraries that work only with `Java`,
    `JavaScript`, `.NET`, or any of the other myriad programming languages currently
    available. As with everything else we have discussed, careful consideration is
    essential in finding the right code for the right job and then ensuring that team
    members have the appropriate coding skills.


    ### Business Rules


    These are the lists of statements that supply criteria and conditions for transforming
    your data from the source to the target. Business Rules differ from business requirements
    in that *business requirements* are the things with which you need to comply to
    enable rules. Although Business Rules should be fixed and consistent, more often
    than not, they can lead to some heated exchanges among business owners who may
    disagree on what rule should be applied to which data. Fortunately, these discussions
    are organized mostly around the target system since the populated source system,
    by definition, already contains data that has an originating business rule. Still,
    don’t be misled by thinking that the business rules in the provided source system
    will transfer directly to the target system as is. In many cases, updated business
    decisions will drive new business rules, which, in turn, could require transforming
    the outbound data into something quite different from its inbound format.


    ### Exception Handling


    Data migration and integration processes can fail for two main reasons—either
    technical due to a network or database connectivity issue or business related
    due to data failing an expected business rule. Under these circumstances, the
    data team and business owners need to be made aware of the failure. But how should
    this happen? Through online log notifications? Through email? Through a third-party
    application? The specification of alerts and similar errors is known as exception
    handling and should be designed based on the built-in software configurations,
    the design code, or both.


    ### Version Control


    Data loading can involve much trial-and-error testing with design code changes
    happening frequently. What was once a retrieval of a few fields from the source
    can quickly cascade into multiple tables, with each one bearing a dependency on
    the one before it. Every time you modify a file function, you unintentionally
    risk breaking a different part of your code. Over time, it becomes difficult to
    track all your changes. The right thing to do would be to take an occasional pause
    and back up the existing code base, but doing so can bloat your computer with
    incremental change files that you may never need to open. One solution to keeping
    your file safe and recoverable is through version control, a system that records
    changes to a file or set of files over time so that you can recall specific versions
    later.


    Version control systems (`VCSs`) have been in use for decades, mostly for software
    applications that have periodic minor releases and bug fixes. But the use has
    become more common with any component that requires scripting, `ETL` software
    included. I can personally attest that it’s worth the effort. On one occasion,
    I accidentally mistyped a `Unix` command to remove what I thought was an insignificant
    file and then ended up removing the entire directory consisting of 25 extremely
    important files. Fortunately, I was able to roll back my deletion through the
    magic of `VCS` reversion. My recommendation for you is to adopt the same strategy
    for your code design backups.'
  raw: '#### Relationship Discovery


    As systems increase in complexity, so does the interconnectivity among the different
    components of those systems. Relationship discovery is the process of evaluating
    how one field connects to another, allowing lookups among different objects. Relationships
    are critical in many databases, so much so that we commonly refer to databases
    as relational database management systems (RDBMS).


    As a simple example, imagine we have a lookup table containing the whole of US
    postal codes.^([^(25)](#fn25)) Now imagine we have a CUSTOMER table with first
    name, last name, a product, and the address of that user. Rather than repeatedly
    entering the city, state, and zip code for each user, we could instead supply
    a key that performs a lookup against the postal code lookup table (see Figure
    [2-3](#486629_1_En_2_Chapter.xhtml#Fig3)).


    ![../images/486629_1_En_2_Chapter/486629_1_En_2_Fig3_HTML.jpg](images/486629_1_En_2_Chapter/486629_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Relationship Between Customer and PostalCode


    If we examine Figure [2-3](#486629_1_En_2_Chapter.xhtml#Fig3), relationship discovery
    begins to make sense. CUSTOMER.Id #1 (John Smith) contains CUSTOMER.PostalId #75\.
    This value is a direct reference to the POSTALCODE table record for “Los Angeles,
    California, 90001.” Viewed this way, we can see why it is necessary to recognize
    the relationship between CUSTOMER and POSTALCODE and not just make assumptions
    that one table is all we need. Without having this understanding of the relationship,
    you can get very lost in the details, especially if the comparative table in the
    target system differs widely from the source. To illustrate, let’s take our example
    a step further. For various design reasons, the target CUSTOMER table now contains
    the complete city, state, and postal code fields (i.e., there is no reference
    to a PostalId). If you just took the source data and mapped directly to the target,
    you would have both incomplete as well as inaccessible data. (see Figure [2-4](#486629_1_En_2_Chapter.xhtml#Fig4))


    ![../images/486629_1_En_2_Chapter/486629_1_En_2_Fig4_HTML.jpg](images/486629_1_En_2_Chapter/486629_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Customer Mapping Without PostalCode Relationship Discovery


    Figure [2-4](#486629_1_En_2_Chapter.xhtml#Fig4) illustrates that the target City,
    State, and PostalCode values are impossible to populate when the POSTALCODE table
    is missing from the equation. The moral of this illustration is to ensure that
    you identify and document *all* tables that make up the entire data view and not
    just go with the assumed one-to-one match approach.


