    out the user requirements. In short, you need to build there from the beginning,
    and you need to have a team ready and willing to support.


    That brings me to the reasons why I wrote this book. There are two of them. First,
    as I hope I’ve illustrated, data migration looks very simple, given that you only
    need to move data from point A to point B, but it can turn quite messy very fast
    and without warning. The typical results of bad planning are missed deadlines,
    unrecognized overhead, and, more often than not, desperate acts of last-minute
    heroism that take on a weirdly optimistic tone (“I did it and with only three
    hours of sleep in the last two days!”). Of course, I think we would all prefer
    to do without these results, and I hope this book will help you to plan and coordinate
    the integration team effort from the outset.


    The second reason for writing this book is to emphasize to all parties involved
    in a project, from the project manager to the developers to the stakeholders,
    that data migration is one of the most, if not*the* most, critical parts of the
    project plan. Too often have I seen a migration plan relegated to the back end
    of the development phase, almost serving as an afterthought to the working piece
    of software that takes center stage. I argue that this is a mistake because no
    matter how shiny a software product is, no matter how many features and specifications
    you add, if the data is not correct—for example, if your bottom-line receipts
    are missing or your customer data is corrupt—then the software is broken. Period.


    Do the migration early and do it right, however, and you’ll find there’s no greater
    satisfaction than having clients tell you how much easier their lives have become
    due to data issues no longer existing. Yes, it can be hard work and long hours
    in the beginning, but truly worthwhile in the end.


    Before we get started on the major topics, let’s clear up one misconception right
    off the bat since I use the terms interchangeably throughout this book. Let’s
    discuss the difference between data migration and data integration.'
  trans: '

    嗯，其实并非如此。只有当联系人恰好来自新泽西州、马萨诸塞州或任何其他美国邮政编码以“0”开头的城镇时，导入才会出现问题。Excel 有一个有趣的功能：如果某个字段未正确定义为特定格式，以“0”开头的字段在导出时会自动被移除（我们称之为“**前导零**”，你可以在此处了解更多解决方法——[*https://support.office.com/en-us/article/format-numbers-to-keep-leading-zeros-in-excel-online-633401e5-f2ad-4ac7-afef-05ed58b1c9a1*](https://support.office.com/en-us/article/format-numbers-to-keep-leading-zeros-in-excel-online-633401e5-f2ad-4ac7-afef-05ed58b1c9a1)）。^(²)
    因此，在我们导入 15,000 条记录时，几乎立刻就在 `ZIPCODE` 字段上遇到了 `INVALID LENGTH` 错误。我们期望该字段至少包含五个字符，但在这种情况下，只收到了四个字符。于是，我排查错误、修复问题，然后从头开始重新导入，直到遇到下一个字段错误。接着是下一个，再下一个，如此循环往复。


    ![../images/486629_1_En_BookFrontmatter_Fig2_HTML.jpg](img/486629_1_En_BookFrontmatter_Fig2_HTML.jpg)


    **图 2** 我的第一次集成（实际视图）


    麻烦远不止于此。那个漫长周末的数据转换过程仿佛没有尽头。关于数据迁移，我积累了足够多惨痛的教训（多到足以写一本书，咳咳）。有太多方面需要考虑，有太多事情我本以为理所当然，若能早点知道，本可以做得更好。但正如那句老话所说：“将伤痛化为智慧。”
    我就先说到这里吧。


    那次经历让我感到震惊和疲惫。我害怕随后与团队的那场对话。我以“我们无法部署，因为我还没准备好数据……”开始了谈话。


    我认为，虽然我的数据加载工作不算出色，但也取得了一些进展。连续三个晚上每晚只睡两个小时，难免会这样。但综合考虑，这个项目本身称不上成功，而其中只有一部分问题与数据相关。令我惊讶的是，并没有人互相指责，也没有人说出显而易见的事实：作为一名数据集成人员，我完全力不从心。


    恰恰相反，我的经理因我的坚持不懈而表扬了我的表现。也许是因为这个，但更有可能是因为我幸存了下来，得以再战。无论如何，人事安排又让我参与了另一个数据迁移项目。这一次，我发誓要从错误中吸取教训。那次事情进展得顺利了一些。不算完美，但更顺畅了。


    很快，我成了数据集成方面的核心人物。这个角色一直伴随着我。但达到这个位置并不容易。你不仅要努力让数据符合标准，还要与技术和非技术团队成员沟通，确保他们理解一项任务的细节和关键——这项任务至少在架构图上看起来很简单，就像按几个按钮进行复制/粘贴一样简单。你必须适应项目中集成部分此消彼长的节奏，通过建立一种在开发工作开始前很久就已存在的结构和模式来应对，甚至可能早在团队提出用户需求之前。简而言之，你需要从一开始就打好基础，并且需要有一个准备好并愿意提供支持的团队。


    这就引出了我写这本书的原因。主要有两点。第一，正如我希望已经阐明的那样，数据迁移看起来非常简单，因为你只需将数据从 A 点移动到 B 点，但它很可能在没有预警的情况下迅速变得非常混乱。糟糕规划的典型后果就是错过截止日期、产生未预见的开销，而且常常伴随着最后时刻孤注一掷的英勇行为，并带有一种奇怪的乐观口吻（“我做到了，而且过去两天只睡了三个小时！”）。当然，我想我们都更希望避免这些后果，我希望这本书能帮助你从一开始就规划和协调集成团队的工作。


    写这本书的第二个原因，是为了向项目中所有相关方——从项目经理到开发人员，再到利益相关者——强调，数据迁移是项目计划中最关键的部分之一，甚至 *就是* 最关键的部分。我见过太多次迁移计划被搁置到开发阶段的末尾，几乎成了对占据中心舞台的软件工作版本的“事后想法”。我认为这是个错误，因为无论一个软件产品看起来多么光鲜，无论你增加了多少功能和规范，如果数据不正确——例如，如果你最重要的收据丢失或客户数据损坏——那么这个软件就是有缺陷的。仅此而已。


    然而，如果尽早并正确地完成迁移，你会发现，没有什么比听到客户告诉你，他们的生活因数据问题不复存在而变得轻松多了更令人有成就感。是的，一开始可能需要付出艰苦的努力和漫长的时间，但最终一切都是值得的。


    在我们开始讨论主要话题之前，让我们先澄清一个误解——因为我在本书中会交替使用这两个术语。我们来讨论一下数据迁移和数据集成之间的区别。

    '
- fmt: '## The Difference Between Data Migration and Data Integration


    We define migration as “the movement from one place to another.” ^([³](#fn3))
    What immediately may come to mind are antelopes and giraffes traversing from one
    region of the Serengeti to the next or monarch butterflies drifting south while
    salmon swim upstream, back to their birthplaces. In the context of data, it is
    somewhat similar. We are talking about information moving from one server (the
    origin, or *source*) to another (the destination, or *target*). Migration typically
    happens once or twice in the lifetime of a particular database product, such as
    when moving from a legacy database to a more modern practical application.


    ![../images/486629_1_En_BookFrontmatter_Fig3_HTML.jpg](images/486629_1_En_BookFrontmatter_Fig3_HTML.jpg)


    Figure 3


    The Integration Model


    As shown in Figure [3](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fig3), the
    migration is not limited just to databases. Excel spreadsheets, for example, can
    serve as the source or target systems, and at some point, maybe after a few months
    of manually inputting Human Resources (HR) questionnaire survey results, we would
    want to move the data to a more efficient storage mechanism. This move could happen
    at one time over a weekend (called a “big bang” in some organizations) or across
    multiple weekends, weeks, or months (called a delta migration). The point is that
    the data does not exist in the target, a migration happens, and then the data
    is available for consumption.


    Integration, on the other hand, is defined as “the act of combining into an integral
    whole.” ^([⁴](#fn4)) Technically, it means adding or updating new data against
    *already* existing data. In other words, data integration is bringing in new or
    updated data only after an initial load is complete and systems are operational.
    The term applies mostly to the data loads that arrive at odd hours in the early
    morning, throughout the day, or even moment by moment (this is sometimes called
    “real time” or, as purists would prefer, “near-real time” since there’s a slight
    processing lag between source input and target output).


    It’s essential in a project plan to differentiate between data migration and data
    integration because the former generally takes much more time to plan and produce
    than the latter. Data migration requires a complete analysis of the system architecture,
    data stores, and business requirements, while data integration is usually against
    an existing system where the explicit instructions and documents already are provided
    (at least, in theory). Thus, the time to discover and develop a data load is generally
    quicker in an integration project, although it still has its unique characteristics.
    Project teams often blur the lines of the two categories together, with the assumption
    that a more complex data migration approach is just as simple as a plug-and-play
    data integration would be. As I mentioned earlier, it is a big surprise when the
    reality sets in, particularly in those cases where migration and integration components
    haphazardly are consolidated into a single operation within the `SOW`.


    With that difference in mind, this book’s title starts with *Building a Data Integration
    Team*. I could just as quickly have named it *Building a Data Migration Team*
    or, more accurately, *Building a Data Migration and Data Integration Team*. In
    the world of migrations, “integration” is often the de facto term used to describe
    both operations. Most job requisitions seek an “integration engineer” to fill
    a role and not a “migration engineer.” I guess the first phrase is shorter and
    rolls off the tongue a bit better. Most people—even those who recognize the difference
    between the two activities—assume that this role will require the ability to migrate
    as well as build integration processes.


    I cover both migration and integration as they require different methodologies,
    but I will use the term “data integration” to mean both migrations and integrations.
    By the end of this book, my goal is for you to have knowledge of both topics and
    be well aware of the nuances between them.


    ## Technical Details: Why Bother?


    At this point, you may be wondering why I am bothering you with all the technical
    details. After all, most realistic projects constrain the number of records required
    to migrate. Very few of them have millions, and some have even less than the 15,000
    that I had to face early in my career. If your project has only a few hundred
    or so and you’re just starting with a brand-new application, wouldn’t it be simpler
    just to insert the data and move ahead?


    My response to that is a strong *yes*. In this case, the easiest solution is probably
    the best. If you can avoid having to implement a detailed data migration project,
    you probably should. I have defended this position many times in the past by explaining
    that manually entering data across the scope of a week is probably better than
    trying to code a complete source-to-target solution that involves methodologies
    and rules and all the other artifacts that come with project delivery. This clarification
    often delights the customer looking for a quick turnaround, frustrates the account
    executive team who sets the fees, and confuses project managers who suddenly must
    shift their focus away from the integration details and back to software development.


    The problem with migrations, as I discussed earlier, is not the easy solution,
    but the one that only appears to be easy; these situations have much more going
    on under the surface. Sure, it may be “only” a few hundred records, but how many
    columns? 5? 10? 100? The more data, the more complexity will be involved. And
    what about the data structure? Do these columns store easily represented fields
    like salutation, first name, and last name, or are they large strings like project
    codes, lengthy IDs, or binary attachments like PDFs that are next to impossible
    to enter by hand? Even with the best design strategies, there may be one or two
    “gotchas” that come up to the surface only after teams review the source. For
    this reason, it is crucial that no matter how simple a migration project may seem,
    be sure to analyze it as your initial impressions may not be correct. Do this
    as soon as you can because the moment the project begins, expectations are already
    set.'
