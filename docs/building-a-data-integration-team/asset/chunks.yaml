    # 引言


    在前面的章节中，我们不仅讨论了迁移/集成的基础知识，还探讨了制定沟通流程和战略计划所需的各种文档。贯穿这一切的核心主题是：*细节决定成败*。而保持这种细致程度，在您的设计核心——即提取、转换和加载（ETL）中间件中，显得尤为关键。我们在第
    2 章中某种程度上介绍了该组件的特性，并在第 4 章中通过配套的源到目标映射电子表格进行了说明。由于它对项目的成败有重大影响，本章将重点介绍为您提供的用于选择合适工具的各种选项，并讨论当前市场上几种最能满足您集成需求的
    ETL 工具。


    ## ETL 与 ELT


    首先，我建议您将缩写 ETL 按字面意思理解。也就是说，您正在进行直接的**提**取（**e**xtraction）、**转**换（**t**ransformation）和**加**载（**l**oading）操作。在图
    5-1 中，您可以看到我们之前在第 2 章中讨论过的 ETL 及其对应组件的“并非如此简单”的示意图。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig1_HTML.jpg](img/486629_1_En_5_Fig1_HTML.jpg)


    图 5-1


    再看“并非如此简单”的 ETL 示意图


    纯粹意义上的 ETL 意味着我们从源系统拉取数据（提取），对数据执行某些操作以改变或操纵其流向（转换），然后将数据的最新版本推送到目标系统（加载）。


    也可以颠倒转换和加载的顺序，从而形成一种称为提取、加载和转换（ELT）的命名方式。在 ELT 方法中，数据被提取后，源数据值被移入一个单一的、集中式的数据仓库，该仓库可以即时计算到分析报告系统中（见图
    5-2）。在过去（即十年前），由于处理能力和可扩展性问题，这颇具挑战性；但借助当今基于云的基础设施以及 Hadoop 等大数据工具，系统可以支持充足的存储和可扩展的计算能力。^(⁸⁴)


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig2_HTML.jpg](img/486629_1_En_5_Fig2_HTML.jpg)


    图 5-2


    ELT 流程（拟议）


    ELT 流程仍在不断发展中，但在近期的文档中频繁被提及，因此值得在此一提。本书剩余部分将不会深入探讨这种设计，但我建议团队时刻关注那些可能融合该模型的技术和技能组合。对完整数据集进行无限、按需访问的承诺颇具吸引力，许多高管和商业智能人员都渴望进一步探索。


    ## ETL 作为中间件


    需要注意的是，虽然 ETL 工具通常独立于源系统和目标系统而存在，但情况并非总是如此。完全有可能存在驻留在源系统内的 ETL 流程（例如，直接将数据推送至外部端点的
    Web 服务），或者驻留在目标系统内的 ETL 流程（例如，从源系统拉取数据的共享进程）。对于这类项目，简单的解决方案至关重要。但请记住，尽管您的系统可能拥有从源到目标的嵌入式钩子而无需中间件，但我们关注的是
    ETL 的*概念*。您的解决方案需要能够兼顾移动的便捷性和转换的便捷性；无论您想如何设计它，ETL 的顺序将保持一致。


    ## ETL 的组成部分：选择合适的工具


    至此，我们已经从高层次讨论了 ETL 处理。但这三个组件如何各自工作，然后又如何结合在一起形成一个完整的流程呢？将这些组件分解到各自的工作流中，将使我们能够为正确的项目类型考虑合适的产品。换句话说，在设计解决方案时，主要应寻找哪些益处？图
    5-3 展示了一个示例 ETL 流程的分解。


    ![../images/486629_1_En_5_Chapter/486629_1_En_5_Fig3_HTML.jpg](img/486629_1_En_5_Fig3_HTML.jpg)


    图 5-3


    ETL 流程分解：选择合适的工具


    ### 提取


    我们的流程从首次从源系统检索数据开始。与所有集成相关的事项一样，在选择合适的 ETL 工具时，需要考虑几个概念，包括建立连接器、存储临时数据和验证入站数据。


    ### 建立连接器


    在第一阶段，即提取阶段，数据通过连接器从源系统（云、文档、数据库）中检索出来。连接器是一种用于连接现代组织中存在的众多异构源的方式。^(⁸⁵) 通常，连接器是一种专门的转换器，允许一个系统读取通常不兼容的专有系统中存储的数据。作为转换的一部分，连接器必须提供特定于该专有系统的信息，例如
    `JDBC`/`ODBC` 连接字符串、端点、端口号、数据库名称、用户名、密码等；查阅在线产品文档通常能提供编写干净连接字符串的要求。供应商通常将专有连接器与商业软件捆绑在一起，许多现成的
    ETL 工具也将其作为完整软件包的一部分提供。自然，您的数据源越复杂、越异构，您希望可用的连接器就越多。


    ### 存储临时数据


    一旦建立连接，请求的数据就会被检索出来，并存储在我们所谓的临时暂存区中。^(⁸⁶) 在自行实施的迁移类型中，这个暂存区可以是任意数量的临时处理存储库，例如数据库表、`CSV`
    文件或电子表格文件。而对于大多数第三方 ETL 工具而言，它是由 ETL 工具本身选择和维护的临时缓冲区。


    在此步骤中，可能会产生一些担忧，因为临时数据（通常称为“传输中的数据”）^(⁸⁷) 可能包含与客户、账户或其他安全信息相关的个人身份信息（PII）。^(⁸⁸)
    当然，安全性是整个企业都关心的问题，但在提取-存储过程中，这种级别的暴露尤其容易受到攻击。为了防止数据被窥探，请确保解决方案能够做到以下几点之一：（a）限制您存储的敏感数据量，（b）使用适当的加密技术保护传输中的数据，或（c）将临时数据存放在防火墙后的安全系统上，仅供最受信任的人员访问。然而，也要注意不要走极端，因为过度锁定数据与完全开放数据一样麻烦。所选的
    ETL 解决方案应该能够帮助您找到过多与过少之间的适当平衡，因此在研究备选方案时请牢记这一点。


    有关此主题的更多想法，请参考 [*https://www.helpnetsecurity.com/2016/10/25/securing-data-in-motion/*](http://www.helpnetsecurity.com/2016/10/25/securing-data-in-motion/)^(⁸⁹)
    和 [*https://pulse.microsoft.com/en-ie/technology-lifestyle-en-ie/na/fa3-data-in-motion-how-to-protect-it-5-key-considerations/*](https://pulse.microsoft.com/en-ie/technology-lifestyle-en-ie/na/fa3-data-in-motion-how-to-protect-it-5-key-considerations/)。^(⁹⁰)

