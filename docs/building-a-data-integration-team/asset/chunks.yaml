    \n*To Heather and Melinda*\n\n*I could not have wished for better people on this\
    \ journey.*\n\nIntroduction\n\n> *Without a systematic way to start and keep data\
    \ clean, bad data will happen.*\n> \n> —Donato Diorio, CEO of RingLead ^([¹](#fn1))\n\
    \n# My Story\n\nI was just out of school and relatively new to the world of data\
    \ integration when I received my first hard lesson about project management: “Nothing\
    \ is ever as easy as the Statement of Work (`SOW`) claims it will be.” In this\
    \ case, I was part of a five-person consulting team building a web application.\
    \ Our roles were clearly defined: one project manager (`PM`), one business analyst\
    \ (`BA`), two web developers, and one data integration specialist. I was the data\
    \ integration specialist, and I was proud of that title, albeit I didn’t know\
    \ much about what I would be doing. Nor did I know that as the new guy, I was\
    \ expendable. This project would be a trial by fire experience since data integration\
    \ was a relatively new service offered by the company, and they realized they\
    \ had nothing to lose by throwing me straight into the fire.\n\nMy main goals,\
    \ according to the two pages provided in the otherwise bulky, hardbound Statement\
    \ of Work, would be to import around 15,000 addresses from an Excel spreadsheet\
    \ into a SQL Server 7.0 database. In other words, our customers would be providing\
    \ us all the fields we needed. I had three basic tasks (see Figure [1](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fig1)\
    \ ):\n\n![][my-first-integration-figure]\n\n**Figure 1** My First Integration\
    \ (Surface View)\n\n1.  Create the associated tables and fields in the SQL Server\
    \ database.\n2.  Import the addresses from the spreadsheet.\n3.  Ensure that the\
    \ 15,000 records match between the Excel spreadsheet and the database.\n\nYes,\
    \ it looked pretty simple on paper, even for someone like me, whose most complicated\
    \ integration to date was copying and pasting undergrad Psych 101 grades from\
    \ Notepad into a Lotus database. Still, it was so simple that when our developers\
    \ realized that our web application required a bit more tweaking before going\
    \ into Production, I did not worry. Yes, it was a blocker, but we still had plenty\
    \ of time. Heck, if worse came to worse, I could always perform the unimaginable\
    \ and work late on a Friday night (remember, I was brand new at this consulting\
    \ thing). As long as we had the sample data loaded by our due date, it would all\
    \ work out. It was a copy/paste, but with maybe a few more buttons to push.\n\n\
    Creating the table and fields in SQL Server was easy. Getting the import file\
    \ was not. It finally arrived on a USB drive by Thursday morning. Loading it,\
    \ I gradually realized there was a problem. The fields themselves looked, well,\
    \ unusual. Through some strange comma-delimited gymnastics, what should have been\
    \ State was hanging out in the Country field. We had empty phone numbers, some\
    \ that were just “0” (were we calling the operator?), and even human-accepted\
    \ values like “N/A” which would have choked when being read into a numeric open\
    \ table field. After some hesitation, I finally had to admit that I could not\
    \ work with this data.\n\nStep 2 started after spending most of Thursday and Friday\
    \ working with our client to manually clean up the 15,000 records. It was now\
    \ time to import the addresses from the spreadsheet, which should have been just\
    \ a copy/paste between Window applications. In reality, it involved much, much\
    \ more (see Figure [2](#486629_1_En_BookFrontmatter_OnlinePDF.xhtml#Fig2) ). First,\
    \ the proprietary driver of Excel had not been installed correctly in the database,\
    \ and I immediately received a “File not found” error. Okay, a slight miscommunication\
    \ there, but quickly resolved if I just exported the Excel file into a new comma-delimited\
    \ file."
