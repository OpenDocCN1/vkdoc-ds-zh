- fmt: "# Opening the “Prototype” Script\n\nWith the `BUYER` table created, we can\
    \ now review the ETL script that does the bulk of our work. To refresh our memories,\
    \ here is the approach we took in our Data Migration Process Flow:\n\n1. Create/Truncate\
    \ `BUYER` Table: Using the ETL tool, create the `BUYER` table if it does not already\
    \ exist. If it does exist, then truncate all data to provide the next load.\n\
    2. Extract CSV: Using the ETL tool CSV connector, retrieve all comma-delimited\
    \ data.\n3. Extract TSV: Using the ETL tool text connector, retrieve all tab-delimited\
    \ data.\n4. Transform Values: Using the `STTM` as a reference, change the transformation\
    \ values identified.\n5. Merge Files: Combine the new (transformed) staging files\
    \ into one file prepped for the target format.\n6. Insert Data into `BUYER` Table:\
    \ Using the ETL tool SQLite connector, insert all values into the `BUYER` table.\n\
    7. Decision: Were there any errors during load?\n   - If yes, then roll back the\
    \ data and send a report.\n   - If no, then end the event.\n\nWe just covered\
    \ part of Step 1 in the preceding text. Let’s analyze another by opening the script\
    \ `prototype.ktr`.\n\n- As you did earlier with the `create_target_table_buyer`\
    \ step, click the File/Open menu (CTRL+O on Windows) and navigate to the `chapter6\\\
    scripts` directory that you cloned from GitHub. Double-click the file `prototype.ktr`.\
    \ The script will open (see Figure 6-10).\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig10_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig10_HTML.jpg)\n\
    \n**Figure 6-10** The Prototype Script\n\nThere’s a lot more to deal with on this\
    \ transformation than in the previous scenario, and we won’t try to explain it\
    \ in detail (if you do have the interest, there are several recommended books\
    \ on Pentaho development, and Hitachi Vantara likewise has some excellent online\
    \ help documents). If you follow the labels, it should look correct: we start\
    \ by extracting our CSV and TSV files (Steps 2 and 3 from our Data Migration Process\
    \ Flow), transform our TSV date field (Step 4), add a concatenated field that\
    \ will serve as the `EXTERNALID` (also Step 4), append the finalized streams together\
    \ (Step 5), and then load the data into the `BUYER` table (Step 6). If you want\
    \ to explore what each of these functions does in your own Pentaho script, feel\
    \ free to test it. Just make sure to click **Cancel** on each dialog box you open\
    \ to avoid modifying any script components.\n\nWe’re just about done, so all we\
    \ need to do is test our script. But how can we do that? Earlier, we pressed the\
    \ icon in the top-left corner (Run), so let’s try executing again by clicking\
    \ that same icon.\n\nIf you look at your **Logging** window (see Figure 6-11),\
    \ you can see that we did indeed populate the `BUYER` table with 200 written records\
    \ (`W=200` means “write”).\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig11_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig11_HTML.jpg)\n\
    \n**Figure 6-11** Results from Running the Prototype Script\n\nIt seems that,\
    \ yes, we do have the right count of records, but were they accurate? Did we modify\
    \ the date and perform the merge so that our formats were consistent?\n\nThere\
    \ are several ways to check this. We could select from the `BUYER` table using\
    \ another script (we do this in the next chapter), or we could right-click any\
    \ of the steps on the prototype script and select **Preview** to see how the data\
    \ reads at that particular point. Another way is by choosing the **Preview Data**\
    \ tab, which is a few tabs to the right of the **Logging** option. Let’s click\
    \ that tab now (see Figure 6-12).\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig12_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig12_HTML.jpg)\n\
    \n**Figure 6-12** The Preview Data Tab\n\nIn this window, you can see all your\
    \ records in one spreadsheet-like view. What we are seeing is the data just as\
    \ it loaded into the `BUYER` table. If you scroll through the entire recordset,\
    \ you’ll notice that our `EXTERNALID` field follows the syntax we specified in\
    \ our `STTM`, as does the `DATE_PURCHASED` format. It looks like the prototype\
    \ was a success. Start handing out those Starbucks gift cards to your developers\
    \ who worked hard to meet these requirements.\n\nAt this point, we’ve gone through\
    \ a semi-implementation procedure. If this were an actual deliverable and not\
    \ just a prototype, we would populate our Migration Results Report with the name\
    \ of the object (`BUYER`), the date we ran our test, the total number of records\
    \ executed, any errors we encountered, and other items suitable for iterative\
    \ cleanup. Then it would be time for deployment to the next environment. Of course,\
    \ let’s not get ahead of ourselves.\n\n## Summary\n\nIf you’ve followed along,\
    \ you’ll see that our project passed all the tests. It seems like we are ready\
    \ for Go-Live signoff. That’s not surprising given that the scope of our migration\
    \ was rather small. For much larger projects, however, monitoring all aspects\
    \ of the ETL lifecycle can be more challenging, especially where testing and deployment\
    \ are concerned. For example, at the last minute, database developers may make\
    \ a change that impacts the integration teams’ hardcoded scripts; or, even worse,\
    \ code that worked fine with a testbed of data now throws strange errors when\
    \ inserting into Production. Although we may not be able to predict these issues,\
    \ we do have the ability to control as much of it as we can, both through our\
    \ communication through documents and our ability to automate our scripts by sending\
    \ an alert the moment we see a new issue.\n\nIn the next chapter, we’ll discuss\
    \ how we can better utilize our ETL processes to help with this type of automation,\
    \ ensuring that the fires that used to arrive with no warning are now safely under\
    \ control.\n\nFootnotes  \n[1](#486629_1_En_6_Chapter.xhtml#Fn1_source)  \n[2](#486629_1_En_6_Chapter.xhtml#Fn2_source)\
    \  \n[3](#486629_1_En_6_Chapter.xhtml#Fn3_source)\n\n# 7. Platform Automation\n\
    \n> *Software testers always go to heaven; they’ve already had their fair share\
    \ of hell.*\n> \n> —Anonymous^(104)\n\n## Introduction\n\nI’ve repeated many times\
    \ throughout this book how we often view data migration as a one-button operation—just\
    \ select your source fields, push a button, and off you go, data migrated. By\
    \ this point, I hope you realize that nothing is further from the truth. Data\
    \ migration takes careful planning, days and perhaps weeks of research, and a\
    \ wealth of collaboration via documentation, compromises, and meetings, all of\
    \ which is the opposite of pushing a button.\n\nAfter clarifying that, I’d now\
    \ like to teach you how to design your integration systems so you can just push\
    \ a button to run your complete integration from start to finish.\n\nYes, you\
    \ read me right—one mouse click to test your jobs, retrieve your results, and\
    \ deploy your system into different environments.\n\nDon’t get me wrong. All the\
    \ steps I have described throughout this book are still valid. You will have to\
    \ slog through the requirements, build your migration plans and `STTM`, and struggle\
    \ to make your iterative ETL code work. But toward the end, when you finally have\
    \ a working model, you can combine your scripts and establish a system that will\
    \ run on demand or at a schedule you choose. In this chapter, we’ll talk about\
    \ the different types of environments in which you’ll be working, preparing your\
    \ scripts for automation, modifying your documents, demonstrating successes and\
    \ errors, and the steps for setting up a scheduled task. While not everything\
    \ we discuss will be a one-click approach, we’ll certainly get close enough to\
    \ remove the mundane, time-consuming, and risky activities that accompany manual\
    \ delivery.\n\nIf we’re ready to go, let’s start with a discussion on platform\
    \ environments.\n\n## All About Environments"
  raw: "#### Opening the “Prototype” Script\n\nWith the BUYER table created, we can\
    \ now review the ETL script that does the bulk of our work. To refresh our memories,\
    \ here is the approach we took in our Data Migration Process Flow:\n\n1.  Create/Truncate\
    \ BUYER Table: Using the ETL tool, create the BUYER table if it does not already\
    \ exist. If it does exist, then truncate all data to provide the next load.\n\n\
    2.  Extract CSV: Using the ETL tool CSV connector, retrieve all comma-delimited\
    \ data.\n\n3.  Extract TSV: Using the ETL tool text connector, retrieve all tab-delimited\
    \ data.\n\n4.  Transform Values: Using the STTM as a reference, change the transformation\
    \ values identified.\n\n5.  Merge Files: Combine the new (transformed) staging\
    \ files into one file prepped for the target format.\n\n6.  Insert Data into BUYER\
    \ Table: Using the ETL tool SQLite connector, insert all values into the BUYER\
    \ table.\n\n7.  Decision: Were there any errors during load?\n    1.  If yes,\
    \ then roll back the data and send a report.\n\n2.  If no, then end the event.\n\
    \nWe just covered part of Step 1 in the preceding text. Let’s analyze another\
    \ by opening the script *prototype.ktr*.\n\n*   As you did earlier with the *create_target_table_buyer*\
    \ step, click the File/Open menu (CTRL+O on Windows) and navigate to the chapter6\\\
    scripts directory that you cloned from GitHub. Double-click the file “prototype.ktr.”\
    \ The script will open (see Figure [6-10](#486629_1_En_6_Chapter.xhtml#Fig10)).\n\
    \n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig10_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig10_HTML.jpg)\n\
    \nFigure 6-10\n\nThe Prototype Script\n\nThere’s a lot more to deal with on this\
    \ transformation than in the previous scenario, and we won’t try to explain it\
    \ in detail (if you do have the interest, there are several recommended books\
    \ on Pentaho development, and Hitachi Vantara likewise has some excellent online\
    \ help documents). If you follow the labels, it should look correct: we start\
    \ by extracting our CSV and TSV files (Steps 2 and 3 from our Data Migration Process\
    \ Flow), transform our TSV date field (Step 4), add a concatenated field that\
    \ will serve as the EXTERNALID (also Step 4), append the finalized streams together\
    \ (Step 5), and then load the data into the BUYER table (Step 6). If you want\
    \ to explore what each of these functions does in your own Pentaho script, feel\
    \ free to test it. Just make sure to click Cancel on each dialog box you open\
    \ to avoid modifying any script components.\n\nWe’re just about done, so all we\
    \ need to do is test our script. But how can we do that? Earlier, we pressed the\
    \ icon in the top-left corner (Run), so let’s try executing again by clicking\
    \ that same icon.\n\nIf you look at your Logging window (see Figure [6-11](#486629_1_En_6_Chapter.xhtml#Fig11)),\
    \ you can see that we did indeed populate the BUYER table with 200 written records\
    \ (W=200 means “write”).\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig11_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig11_HTML.jpg)\n\
    \nFigure 6-11\n\nResults from Running the Prototype Script\n\nIt seems that, yes,\
    \ we do have the right count of records, but were they accurate? Did we modify\
    \ the date and perform the merge so that our formats were consistent?\n\nThere\
    \ are several ways to check this. We could select from the BUYER table using another\
    \ script (we do this in the next chapter), or we could right-click any of the\
    \ steps on the prototype script and select “Preview” to see how the data reads\
    \ at that particular point. Another way is by choosing the Preview Data tab, which\
    \ is a few tabs to the right of the “Logging” option. Let’s click that tab now (see\
    \ Figure [6-12](#486629_1_En_6_Chapter.xhtml#Fig12)).\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig12_HTML.jpg](images/486629_1_En_6_Chapter/486629_1_En_6_Fig12_HTML.jpg)\n\
    \nFigure 6-12\n\nThe Preview Data Tab\n\nIn this window, you can see all your\
    \ records in one spreadsheet-like view. What we are seeing is the data just as\
    \ it loaded into the BUYER table. If you scroll through the entire recordset,\
    \ you’ll notice that our EXTERNALID field follows the syntax we specified in our\
    \ STTM, as does the DATE_PURCHASED format. It looks like the prototype was a success.\
    \ Start handing out those Starbucks gift cards to your developers who worked hard\
    \ to meet these requirements.\n\nAt this point, we’ve gone through a semi-implementation\
    \ procedure. If this were an actual deliverable and not just a prototype, we would\
    \ populate our Migration Results Report with the name of the object (BUYER), the\
    \ date we ran our test, the total number of records executed, any errors we encountered,\
    \ and other items suitable for iterative cleanup. Then it would be time for deployment\
    \ to the next environment. Of course, let’s not get ahead of ourselves.\n\n##\
    \ Summary\n\nIf you’ve followed along, you’ll see that our project passed all\
    \ the tests. It seems like we are ready for Go-Live signoff. That’s not surprising\
    \ given that the scope of our migration was rather small. For much larger projects,\
    \ however, monitoring all aspects of the ETL lifecycle can be more challenging,\
    \ especially where testing and deployment are concerned. For example, at the last\
    \ minute, database developers may make a change that impacts the integration teams’\
    \ hardcoded scripts; or, even worse, code that worked fine with a testbed of data\
    \ now throws strange errors when inserting into Production. Although we may not\
    \ be able to predict these issues, we do have the ability to control as much of\
    \ it as we can, both through our communication through documents and our ability\
    \ to automate our scripts by sending an alert the moment we see a new issue.\n\
    \nIn the next chapter, we’ll discuss how we can better utilize our ETL processes\
    \ to help with this type of automation, ensuring that the fires that used to arrive\
    \ with no warning are now safely under control.\n\nFootnotes [1](#486629_1_En_6_Chapter.xhtml#Fn1_source)\
    \   [2](#486629_1_En_6_Chapter.xhtml#Fn2_source)   [3](#486629_1_En_6_Chapter.xhtml#Fn3_source)\n\
