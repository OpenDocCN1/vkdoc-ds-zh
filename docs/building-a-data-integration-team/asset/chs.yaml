- '# 读者要求


  既然我们已经了解了数据迁移与集成之间的区别，以及为什么即便是最简单的项目也需考虑它们，那么是时候谈谈作为读者的你需要具备哪些条件了。你阅读本书自有原因——也许是想了解更多关于如何组建数据集成团队的知识，学习如何配置正确的流程，或者只是想获取更多能与现有团队分享的知识。所有这些目的都合情合理，但它们确实要求你对我们将要讨论的技术相关的若干问题有所了解。


  首先，这不是一本关于编程、数据库开发或面向服务架构的实操指南。虽然我们会讨论连接远程系统、转换数据以及支持迁移和集成的软件，但我有意避开了软件教程，转而专注于流程本身。因此，熟悉底层技术将有助于你理解各章节内容。


  其次，建立成功集成团队的核心原则之一，是组织内外的强力沟通与协作。通过讨论、协商和妥协与他人共事，具备对工作流程（即一项工作的生命周期）的基本理解，并掌握如何交接与你项目相关的工作——这些能力将帮助你更有效地实现目标，即建立一个高效运作的集成团队和框架。


  最后，设计和部署数据迁移与集成项目的可交付成果数量可能非常庞大。例如，你不仅要应对整个项目的业务需求，还需处理内部设计——系统、编码、数据库等——而准备和配置这些内容可能耗时数小时甚至数天。因此，编写和维护文档至关重要，尤其要了解需求文档、时序图和流程图的正确用法，这将有助于向所有需要了解项目进展及未来方向的相关人员传达你的信息。


  '
- "# 章节总结\n\n在明确了这些要求之后，我们终于可以启程了。虽然我建议按顺序从头到尾阅读，但你也可以跳转到感兴趣的章节。如何处理完全取决于你。为方便起见，我将章节安排如下：\n\
  \n- **第 1 章：集成背景**\n\n  我们从数据迁移的简史开始，从其早期阶段讲到现代本地部署及地面到云端的方法。接着讨论迁移为何更多是一个流程而非产品，以及\"\
  拥有流程\"为何需要与软件开发中更熟悉的\"拥有产品\"不同的视角。本章最后讨论集成方法，范围从一次性迁移到夜间集成、监听服务及混合方法。\n\n- **第 2\
  \ 章：关键术语**\n\n  集成由技术和业务两种思维模式结合发展而来，因此产生了若干需要理解的术语。本章阐明这些术语的含义及其在集成过程中的重要性。\n\n\
  - **第 3 章：团队资质**\n\n  集成团队由既是技术工程师、业务分析师，又是优秀沟通者和经验丰富的编码人员组成。有些集成团队规模很小，而另一些则可能大得多。本章讨论构建最优团队所需的角色与职责。\n\
  \n- **第 4 章：明确目标：项目可交付成果**\n\n  在牢记团队结构之后，下一步是确定应捕获并记录哪些功能、业务和技术需求。数据集成往往非常动态，在利益相关者最终批准之前，映射关系可能多次更改。如果大型数据集暴露出难以解释的错误，开发人员必须迅速研究、编码并向利益相关者沟通变通方案。最佳做法是通过合理的业务需求、了解谁可以支持变更请求，以及合适的文档来传达集成方法。\n\
  \n- **第 5 章：选择 ETL 工具**\n\n  根据所需集成类型，开发人员和架构师需要具备数据库服务、云平台、`XML` 以及底层通信协议（如 `REST`\
  \ 和 `SOAP`）的经验。将这些技术结合起来需要选择合适的提取、转换、加载（`ETL`）工具。本章讨论 `ETL` 的典型运作方式，并包含一个示例脚本来演示构建简单服务的步骤。接着我们回顾当前市场上的主流\
  \ `ETL` 软件，从经验要求最低（但灵活性小）到更高级（但功能丰富）的工具。我们的目标是针对不同任务选择恰当的工具，而无需一夜之间掌握一系列新技术。\n\n\
  - **第 6 章：一个示例 ETL 项目**\n\n  现在我们可以稍作休息，开始实践所学内容。在本章中，我们将扮演一个集成团队，将联系人和产品数据从源系统移动到目标系统。我们将回顾前面章节的步骤，设计所需文档，并编写代码。\n\
  \n- **第 7 章：平台自动化**\n\n  优秀集成设计的标志之一是应具有可重复性。初始加载脚本应在开发和测试环境中进行严格测试，日常流程应在生产环境中持续运行，并根据需要调整以适应业务不断增长的需求。这种方法在很大程度上直接关联到开发运维（`DevOps`）模型，并且有必要讨论其与数据集成的关系。\n\
  \n\n\n"
- "# 集成背景\n\n> *如果你不能将自己所做的事情描述为一个流程，那么你就不知道自己正在做什么。*\n> \n> —W. 爱德华兹·戴明^(⁵)\n\n过去几十年间，技术发展如此迅速，以至于我们常常忘记，如今看似简单的事物，曾经是多么复杂。数据集成最早出现在\
  \ 20 世纪 70 年代，当时公司员工认识到可以利用大型机数据库来存储不同类型的业务信息。公司及其开发者们制作了早期版本的提取、转换和加载（`ETL`）工具，用于将数据从一个或多个源复制到目标系统。这些多个数据存储库的集合，便是当今数据仓库的前身。\n\
  \n在 20 世纪 80 年代末至 90 年代初，随着数据仓库的概念融入主流技术，大型机、小型机、个人计算机和电子表格之间的集成变得越来越必要。^(⁶) 倡导利用数据集成的支持者随之涌现。被誉为数据仓库之父的比尔·恩门将这一产物称为“企业智慧”，认为它应成为企业基础设施的标准组成部分。^(⁷)\n\
  \n数据仓库是一项广受欢迎的技术突破，软件公司（正如它们在有盈利前景的事业中惯于做的那样）带着各自专有的解决方案进入市场。每个公司都声称自己比竞争对手更胜一筹，结果导致组织内的一个部门（或许只关注自身需求）会采用与另一个部门完全不同的`ETL`工具。因此，与集成所承诺的愿景背道而驰，工具的泛滥反而导致了数据孤岛的*增加*，而非减少。\n\
  \n除此之外，互联网繁荣时期的并购浪潮迫使企业采用多种`ETL`解决方案。每种方案都有其特定的框架，整个仓库解决方案要么需要合并成一个单一系统，要么维持原样，从而将整个架构搞得一团糟。\n\
  \n"
- '# 第八章：监控结果


  设计已经完成，业务方对需求感到满意，项目也已上线。剩下的唯一一件事就是开始监控集成的结果。在本章中，我们实施一个 PDCA（计划-执行-检查-处理）循环来改进集成输出，通过电子邮件和其他通知渠道向用户提供每日成功和错误计数。我们讨论识别错误的方法，确保数据系统的拥有者知道一旦发现问题该如何解决。最后，我们简要讨论了如何将集成用作商业智能的输入，可能利用分析来发现数据中的空白，从而催生更多的集成项目。


  '
- '# 第九章：推广你的团队


  此时，集成团队应该已经部署了至少几个项目，并因其成功的成就而赢得了赞誉。然而，现在可不是躺在功劳簿上休息的时候。在兴奋劲消退之前，团队应该主动联系整个企业内的各个部门，识别出最适合进行数据集成的未来项目。这种方法的一部分将涉及进行宣传，让外部团队了解集成团队所做的工作；开展教育活动，例如午餐学习会；并参与构建集成卓越中心。了解企业即将到来的财年目标也很有价值；通过一些调研和创造力，团队可以构建一个集成数据路线图。这份可视化的总结，等同于产品路线图，描绘了集成产品的愿景和方向、它们所服务的部门以及预计完成时间。


  '
