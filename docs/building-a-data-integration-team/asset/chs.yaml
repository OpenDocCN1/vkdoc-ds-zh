  \ `Contacts_year2.tsv` | `car_model`, `car_model` | `SQLITE` | `BUYER` | `CAR_MODEL`\
  \ | 直接转换, 直接转换 |\n| `File`, `File` | `Contacts_year1.csv`, `Contacts_year2.tsv`\
  \ | `car_color`, `car_color` | `SQLITE` | `BUYER` | `CAR_COLOR` | 直接转换, 直接转换 |\n\
  | `File`, `File` | `Contacts_year1.csv`, `Contacts_year2.tsv` | `car_year`, `car_year`\
  \ | `SQLITE` | `BUYER` | `CAR_YEAR` | 直接转换, 直接转换 |\n| `File`, `File` | `Contacts_year1.csv`,\
  \ `Contacts_year2.tsv` | `price`, `price` | `SQLITE` | `BUYER` | `PRICE` | 直接转换,\
  \ 直接转换 |\n| `File`, `File` | `Contacts_year1.csv`, `Contacts_year2.tsv` | `date_purchased`,\
  \ `date_purchased` | `SQLITE` | `BUYER` | `DATE_PURCHASED` | 直接转换，格式为 `YYYY-MM-DD`,\
  \ 转换格式为 `YYYY-MM-DD` |\n\n这个列表的结果是相同的，你可以将它们交给开发者，让他们构建到 ETL 流程的第一个迭代中。\n\n####\
  \ 数据迁移流程设计\n\n与设计相关的所有内容都汇聚在一起了。有了 STTM，你现在可以编写大部分 ETL 脚本，但你也需要合理安排开发顺序。例如，如果没有表格来接收数据，你就无法开始将数据加载到数据库中；这部分必须先完成。记录你将执行的操作顺序被称为“数据迁移流程设计”，它作为一个很好的检查清单，确保在需要时启动正确的部分。\n\
  \n对于我们的原型，数据迁移流程可以简单地进行图形化和描述（见图 6-5）。对于高级迁移，确实需要更多的思考，但原理是相同的。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig5_HTML.jpg](img/486629_1_En_6_Fig5_HTML.jpg)\n\
  \n**图 6-5  \n数据迁移流程图**\n\n在这个步骤列表中，你会看到我们已经考虑了如何在源和目标之间处理我们的数据；知道先添加什么；知道提取、转换和加载什么；以及随后如何处理任何异常。与我们所有其他文档一样，任何最后一刻的添加或修改都可以追加到模型中，指导我们的开发人员在其相关代码中进行更新。\n\
  \n### 开发与实施\n\n我们现在清楚地了解了流程将如何运作，而且到目前为止，我们还没有编写一行代码。最后，我们来到了开发人员将接手我们迄今为止所有文档的技术内容，并开始编写\
  \ ETL 脚本的阶段。当然，工作也可以在 STTM 完成后立即开始，任何耗时的转换都可以在更早的阶段进行研究。\n\n**注意**\n\n如果你好奇，构建这个特定\
  \ ETL 脚本从开始到结束究竟需要多长时间，这取决于几个因素：转换的复杂性、对 ETL 工具和默认脚本语言的熟悉程度、数据可访问性，以及我们在第 5 章中讨论的任何其他变化因素。\n\
  \n假设开发团队每日进行站会和代码同行评审，那么假设一个冲刺周期后（两周），他们就可以准备向你进行演示，该演示将：\n\n1.  将两个文件提取到 PDI 中：逗号分隔文件和制表符分隔文件。\n\
  2.  根据 STTM 转换需要操作的字段。\n3.  合并生成的数据集。\n4.  将最终输出插入 SQLite 解决方案。\n\n\n\n## 准备工作\n\
  \n脚本本身已经编写完成，你只需对其进行测试即可。虽有此便利，你仍需完成一些步骤来让系统做好测试准备：\n\n-   将 GitHub 目录克隆到本地计算机。\n\
  -   下载并安装 Pentaho Data Integration (PDI) 社区版。\n\n### 克隆 GitHub 目录\n\n你需要在计算机上安装\
  \ GitHub。相关说明请参阅 [`https://gist.github.com/derhuerst/1b15ff4652a867391f03`](https://gist.github.com/derhuerst/1b15ff4652a867391f03)。\n\
  \n-   你需要克隆的仓库位于 [*https://github.com/Apress/building-a-data-integration-team.git*](https://github.com/Apress/building-a-data-integration-team.git)。\n\
  -   你将使用的文件存储在 `chapter6` 文件夹中。解压后，请确保创建了三个文件夹：`input`、`output` 和 `scripts`。\n\n\
  ### 下载并安装 PDI（社区版）\n\n要完成此步骤，请执行以下操作：\n\n1.  访问网站 [*https://community.hitachivantara.com/s/article/data-integration-kettle*](https://community.hitachivantara.com/s/article/data-integration-kettle)。\n\
  2.  根据你的特定操作系统（Linux、Windows、macOS），阅读“如何让 PDI 启动并运行”部分。\n3.  在“下载”部分下，选择最新的稳定版本。\n\
  4.  等待下载开始。\n5.  将 `.zip` 文件保存到一个你记得的目录中。**注意：** Pentaho 下载文件体积高达 1 GB。请确保你的计算机可以容纳此文件。\n\
  6.  完成后，解压该压缩包。\n7.  在新目录中的 `data-integration` 文件夹下，双击 `spoon.sh`（Linux）、`spoon.bat`（Windows）或“Data\
  \ Integration”应用程序图标（macOS）。你应该会看到启动画面窗口打开。等待应用程序加载完成。\n\n> **注意：** 如果文件在 Windows\
  \ 上无法运行，请确保已安装 Java JDK 并将其添加到 `JAVA_HOME` 系统变量中。访问 [`https://www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\
  \ 下载最新版本，并通过单击 Windows“开始”图标并搜索“编辑系统环境变量”来确认 `JAVA_HOME` 环境变量已正确设置。\n\n8.  由于你是首次使用该应用程序，会弹出“欢迎”窗口。点击\
  \ `File/New`（或 `CTRL+N`）打开一个新的转换窗口（见图 6-6）。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig6_HTML.jpg](img/486629_1_En_6_Fig6_HTML.jpg)\n\
  \n*图 6-6：新的 PDI 转换窗口*\n\n> **注意：** 我们选择 SQLite 作为目标数据库，因为它是一个小型、自包含的 SQL Server\
  \ 引擎，开源且已可在 PDI 平台上运行。它不同于大多数 SQL 数据库，因为 SQLite 没有单独的服务器进程，而是直接写入普通磁盘文件（[`www.sqlite.org/about.html`](http://www.sqlite.org/about.html)）。你不会有客户端应用程序来读取\
  \ `infomotors.db` 数据，但可以通过 Pentaho 脚本读取该文件，从而实现相同的目地。\n\n### 打开 `create_target_table_buyer`\
  \ 脚本\n\n虽然我们不会讨论下载的脚本是如何开发的，但我们可以继续演练，就好像我们要对我们开发人员创建的代码进行同行评审一样。首先，在 PDI 中，点击 `File/Open`\
  \ 菜单（Windows 上为 `CTRL+O`），然后导航到你从 GitHub 克隆的 `chapter6\\scripts` 目录。双击 `create_target_table_buyer.ktr`\
  \ 文件。\n\n-   此时 `create_target_table_buyer` 脚本会打开。页面上有一个单一对象——Create Table BUYER——它执行\
  \ SQL 来创建我们的 BUYER 表。双击该对象以打开 “Execute SQL Script”对话框（见图 6-7）。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig7_HTML.jpg](img/486629_1_En_6_Fig7_HTML.jpg)\n\
  \n*图 6-7：执行 SQL 脚本*\n\n-   在 “SQL script to execute” 窗口（屏幕中央）中，你将看到我们开发人员添加的 `CREATE\
  \ TABLE STATEMENT`。上方是一个标有“Connection”的文本框。值 `infomotors.db` 代表了我们为原型构建的 SQLite\
  \ 目标连接。如果你希望查看连接的详细信息以及 PDI 提供的其他内置连接器，请点击 `Edit`。查看完毕后，点击 `Cancel` 两次返回到“Create\
  \ target BUYER table”主页。\n\n-   屏幕顶部有一个播放按钮（见图 6-8）。点击它以打开“运行选项”对话框。然后点击该窗口中的 `Run`\
  \ 按钮来创建 BUYER 表（你可以看到如图 6-9 所示的输出结果）。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig9_HTML.jpg](img/486629_1_En_6_Fig9_HTML.jpg)\n\
  \n*图 6-9：确认步骤成功运行*\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig8_HTML.jpg](img/486629_1_En_6_Fig8_HTML.jpg)\n\
  \n*图 6-8：运行按钮*\n\n-   完成后，从菜单中选择 `File/Close`（Windows 上为 `CTRL+W`）以返回主窗口。\n\n\n\n\
  ### 打开“原型”脚本\n\n创建好`BUYER`表后，我们现在可以检查负责大部分工作的 ETL 脚本了。为了回顾一下思路，以下是我们在数据迁移流程中采取的方法：\n\
  \n1.  创建/清空`BUYER`表：使用 ETL 工具，如果`BUYER`表不存在则创建它。如果已存在，则清空所有数据，为下一次加载做准备。\n2.  提取\
  \ CSV：使用 ETL 工具 CSV 连接器，检索所有逗号分隔的数据。\n3.  提取 TSV：使用 ETL 工具文本连接器，检索所有制表符分隔的数据。\n\
  4.  转换值：以`STTM`为参考，更改识别出的转换值。\n5.  合并文件：将新的（转换后的）临时文件合并成一个为目标格式准备好的文件。\n6.  向`BUYER`表插入数据：使用\
  \ ETL 工具 SQLite 连接器，将所有值插入到`BUYER`表中。\n7.  决策：加载过程中是否有任何错误？\n    -   如果是，则回滚数据并发送报告。\n\
  \    -   如果否，则结束事件。\n\n我们在前面的部分只介绍了第 1 步的一部分。让我们打开脚本`prototype.ktr`来分析另一个步骤。\n\n\
  -   就像之前对`create_target_table_buyer`步骤所做的那样，点击“文件/打开”菜单（Windows 上为 CTRL+O），然后导航到你从\
  \ GitHub 克隆的`chapter6\\scripts`目录。双击文件`prototype.ktr`。脚本将会打开（见图 6-10）。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig10_HTML.jpg](img/486629_1_En_6_Fig10_HTML.jpg)\n\
  \n**图 6-10** 原型脚本\n\n这个转换要处理的内容比前一个场景多得多，我们不会试图详细解释（如果你确实有兴趣，有几本关于 Pentaho 开发的推荐书籍，Hitachi\
  \ Vantara 也有一些很棒的在线帮助文档）。如果你按照标签来看，流程应该看起来是对的：我们从提取 CSV 和 TSV 文件开始（数据迁移流程中的第 2 步和第\
  \ 3 步），转换我们的 TSV 日期字段（第 4 步），添加一个将用作`EXTERNALID`的拼接字段（也是第 4 步），将最终的流追加在一起（第 5 步），然后将数据加载到`BUYER`表中（第\
  \ 6 步）。如果你想在自己的 Pentaho 脚本中探索每个函数的功能，可以随意测试。只需确保在你打开的每个对话框上点击**取消**，以避免修改任何脚本组件。\n\
  \n我们快完成了，所以接下来需要做的就是测试我们的脚本。但我们该如何测试呢？之前，我们点击了左上角的图标（运行），让我们尝试通过点击同一个图标再次执行。\n\n\
  如果你查看**日志**窗口（见图 6-11），可以看到我们确实用 200 条已写入的记录填充了`BUYER`表（`W=200`意味着“写入”）。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig11_HTML.jpg](img/486629_1_En_6_Fig11_HTML.jpg)\n\
  \n**图 6-11** 运行原型脚本的结果\n\n看起来，是的，我们的记录数是对的，但是它们准确吗？我们是否修改了日期并执行了合并，以使我们的格式保持一致？\n\
  \n有几种方法可以检查这一点。我们可以使用另一个脚本从`BUYER`表中进行查询（我们在下一章会这样做），或者我们可以右键点击原型脚本上的任意步骤，然后选择**预览**，查看数据在该特定点的情况。另一种方法是选择**预览数据**选项卡，它在**日志**选项右侧几个选项卡的位置。我们现在点击这个选项卡（见图\
  \ 6-12）。\n\n![../images/486629_1_En_6_Chapter/486629_1_En_6_Fig12_HTML.jpg](img/486629_1_En_6_Fig12_HTML.jpg)\n\
  \n**图 6-12** 预览数据选项卡\n\n在这个窗口中，您可以在一个类似电子表格的视图中看到所有记录。我们看到的正是加载到`BUYER`表中的数据。如果你滚动浏览整个记录集，你会注意到我们的`EXTERNALID`字段遵循了我们在`STTM`中指定的语法，`DATE_PURCHASED`格式也是如此。看起来原型是成功的。开始向那些为满足这些需求而努力工作的开发人员发放星巴克礼品卡吧。\n\
  \n至此，我们已经经历了一个半实现的流程。如果这是一个实际的交付物而不仅仅是原型，我们会向迁移结果报告中填入对象名称（`BUYER`）、运行测试的日期、执行的记录总数、遇到的任何错误以及其他适合迭代清理的项目。然后就是部署到下一个环境的时候了。当然，我们不要太心急。\n\
  \n## 总结\n\n如果你一路跟随下来，你会看到我们的项目通过了所有测试。看起来我们已经准备好进行上线确认了。考虑到我们迁移的范围相当小，这并不令人惊讶。然而，对于更大的项目，监控\
  \ ETL 生命周期的所有方面可能更具挑战性，尤其是在涉及测试和部署时。例如，在最后一刻，数据库开发人员可能会做出一个更改，影响了集成团队的硬编码脚本；或者更糟的是，在测试数据上运行良好的代码在插入生产环境时现在出现奇怪的错误。虽然我们可能无法预测这些问题，但我们确实有能力尽可能多地控制它们，这既通过我们通过文档进行的沟通，也通过我们在发现新问题时发送警报来自动化脚本的能力。\n\
  \n在下一章中，我们将讨论如何更好地利用我们的 ETL 流程来帮助实现这种自动化，确保那些过去毫无预警地出现的问题现在都安全可控。\n\n脚注  \n1  \n\
  2  \n3\n\n"
- "# 7. 平台自动化\n\n> *软件测试人员总是上天堂；因为他们已经在人间受够了地狱般的折磨。*\n> \n> ——匿名¹⁰⁴\n\n## 引言\n\n我在本书中多次重复提到，我们常常把数据迁移看作是一个一键操作——只需选择你的源字段，按下一个按钮，然后出发，数据就迁移完成了。到了这里，我希望你认识到事实远非如此。数据迁移需要仔细的计划、数天甚至数周的研究，以及通过文档、妥协和会议进行的大量协作，所有这些都与按下一个按钮相反。\n\
  \n澄清这一点之后，我现在想教你如何设计你的集成系统，以便你可以只需按下一个按钮，就能从头到尾运行完整的集成。\n\n是的，你没听错——只需一次鼠标点击就能测试你的作业、检索结果，并将你的系统部署到不同的环境。\n\
  \n不要误会我的意思。我在本书中描述的所有步骤仍然有效。你仍然需要费力地处理需求、构建你的迁移计划和`STTM`，并努力让你的迭代式 ETL 代码工作起来。但在最后，当你最终有了一个可行的模型时，你可以组合你的脚本并建立一个系统，这个系统可以按需运行，也可以在你选择的计划时间运行。在本章中，我们将讨论你将使用的不同类型的环境、为自动化准备脚本、修改你的文档、展示成功与错误，以及设置计划任务的步骤。虽然我们讨论的内容并非全部都是一键式方法，但我们肯定会足够接近，以消除伴随人工交付而来的那些单调、耗时且有风险的活动。\n\
  \n如果我们准备好了，让我们从讨论平台环境开始。\n\n## 关于环境的一切\n\n\n\n### 为何重要\n\n当我们面临截止日期，项目赞助方又在追问迭代部署何时完成时，我们最不愿考虑的就是那些会耗费更多时间的事情。我们只想把代码推送到生产服务器，然后继续下一项工作。我们已经尽己所能进行了测试，检查了行数，确保数据看起来没问题，那就继续推进吧。我们这样推理：就算发现错误，也不会是世界末日，我们总可以在部署后打补丁。就像那句著名的运动鞋广告所说：“尽管去做。”^(¹⁰⁵)\n\
  \n这在原则上听起来不错，而且通常是许多专业人士在压力下偏爱的默认策略（“要是我有更多时间，我会用正确的方式来做，但我没有，所以就这样吧”）。这种策略甚至可能奏效。但对于像集成这样依赖数据准确性的流程来说，将糟糕的代码推送到生产环境是撑不了多久的。这种阻碍源于一种名为**技术债务**的现象，我将其定义为“因优先追求快速交付而牺牲质量，导致后期重构/修复代码所需付出的努力”。^(¹⁰⁶)\
  \ 例如，你可能会在系统中添加硬编码的逻辑，因为它通过了你的内部测试（比如使用这样的模式：“如果值等于`'IBM'`、`'I.B.M'`或`'International\
  \ Business Machines'`，则转换为`'IBM Corp'`”）。你对此非常满意，便将代码从本地环境推送到生产环境，然后继续处理下一个任务。\n\
  \n几周后，你收到了目标数据所有者的邮件，说出现了一个新的缩写词`\"I.B.M. Corporation\"`，这让报表系统产生了混乱。好吧，你重新打开开发代码，修改硬编码部分，然后直接推送回生产环境。只花了大概\
  \ 5 分钟，对吧？\n\n哦，等等，实际上应该是`\"IBM Corporation\"`，I、B、M 之间没有句点。该死，我们本该注意到的。回到开发系统，再把这条例外加上去。又是\
  \ 5 分钟，但不是什么大问题。\n\n直到问题变得严重。几周后，随着所有额外的例外情况开始涌现，数据所有者坦言他们感到沮丧。你思考了一下，也许可以构建一个函数，将参数直接传入查找表，然后表就能立即为你返回所需的值。这样一来，每当用户报告错误时，你无需重新提交整个代码库到生产环境，他们只需要在表中添加一条物理的例外记录即可（见图\
  \ 7-1）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig1_HTML.jpg](img/486629_1_En_7_Fig1_HTML.jpg)\n\
  \n**图 7-1** 重构为查找表的代码\n\n这是个好主意，对吧？不幸的是，你一直在用笔记本电脑开发其他功能，不确定是否还保留着原始代码。如果你使用的是`Git`或其他版本控制系统，你可能需要暂存现有代码，回滚到已部署到生产环境的版本，然后开始重构每个对象。这确实是一种进展，但你真有时间这么做吗？难道没有更好的处理方式吗？\n\
  \n你明白我的意思了。最初看似快速的变通方案，最终却让你在长远上付出了更多时间和精力（即技术债务）。尽管你想避免这种情况，但现在你不得不维护一个有缺陷的软件，还要安抚沮丧的数据所有者。\n\
  \n从逻辑上讲，我们知道完美是一种幻觉，说实话，你永远无法真正消除技术债务（至少不能永久消除）。但总有一些方法可以管理它。^(¹⁰⁷) 我们对技术债务的关注，更多是针对与夜间集成相伴的可重复流程，而非一次性迁移。缓解技术债务带来痛苦的一种方法，是利用版本控制系统在各环境中策略性地部署你的构建版本。\n\
  \n加速夜间集成周转涉及几个步骤。如果你遵循我在本章中推荐的技术，你在生产力上获得的益处将远超环境规划和设置所需的时间。\n\n### 环境类型\n\n我们将继续讨论大多数\
  \ DevOps 团队公认的三种环境。实际上，你可以拥有任意数量的环境，5 个、10 个甚至 100 个，并且可以随意命名。这看似有些过度，但目的是一样的：确保你能在隔离的系统中满足项目需求，这样即使出现问题，也不会造成长期损害。\n\
  \n#### 开发环境\n\n开发环境（或“Dev”）是你电脑上的环境，也是你最初更新代码的地方。你在这里下载原型脚本、执行提交操作，它可能存在于远程服务器上，也可能不存在，你的同事可以在远程服务器上生成独立的数据版本。这个环境变化迅速，让人联想到孩子们课间在沙坑里玩耍的场景，因此有时也被称为“沙盒”。\n\
  \n开发环境允许团队进行各种实验，并且应该能够连接包含非生产数据的模拟代码或测试数据库。测试过程中对数据造成的任何重大干扰都会被最小化，只影响到执行预定操作的用户。\n\
  \n#### 预发布环境\n\n预发布环境是我们团队进行代码审查和质量保证（QA）测试的主要场所。因此，我们希望预发布环境尽可能与生产环境保持一致，包括源系统和目标系统中的数据。出于安全或其他技术原因，你可能无法存储那种快照信息，但你越接近生产环境的镜像，对实际“上线”就会准备得越充分。\n\
  \n配置预发布平台可能看起来是一项艰巨的任务，尤其是当为了请求生产环境复制所需的各种服务而需要经历重重关卡时。但让这个环境保持就绪状态意味着，你可以隔离测试一个模拟系统，知道遇到的任何数据问题都能通过反复迭代和仔细审查来解决，而不是像在生产环境中那样进行快速更新。\n\
  \n你也可以在这里构建和测试自动化脚本。该环境允许你处理多个版本的代码，优化加载过程，使其与你为数据迁移流程所创建的图表同步。大多数 ETL 工具支持依次调用任务，最终你可以将工作流调整为连续运行一步完成，而不是手动逐个执行。虽然实现这种程度的自动化令人满意，但我必须承认，只有你在预发布环境中处理的测试数据与生产环境中的数据几乎一致时，才能获得这样的效果。\n\
  \n为了复制环境，我曾合作过的一些组织会先获取现有的生产环境，在部署后覆盖预发布环境，以便使用最新最好的版本。通过利用这一点，预发布环境也成为你加速偿还技术债务的平台；如果我们想重写代码以引用表而不是脚本，可以直接在预发布平台进行修改。如果使用像`Git`这样的版本控制系统（`VCS`），我们可以克隆主分支来创建一个新版本。无论采用哪种方式，当遇到错误时，我们都能灵活调整，在类似生产的环境中进行部署和测试，并且在收到不可避免的失败警报时，能够从容应对。\n\
  \n\n\n#### 生产环境\n\n生产环境是每个创意项目的心血所在，从每一次代码更新到测试结果都汇聚于此。分布式构建在此运行，因此，只有在向用户发布新版本时才应触及它。否则，客户会发现因软件设计粗糙而产生的任何问题，而如果问题足够严重，企业将既损失金钱，也损害声誉。\n\
  \n由于生产环境对公众开放，对有缺陷软件的部署应严格控制，发布权限仅限少数人。任何计划中的部署都应提前（至少两周）向相关方公布，包括时间、日期以及对同时运行进程的影响。发布经理还应在部署当天发送邮件，告知部署开始时间，并在部署完成后通知部署已结束。\n\
  \n### 一次性迁移的环境\n\n我们的 ETL 应用程序及相应脚本可视为一种构建工具，应遵循与其他软件相同的环境结构，即为开发、预发布和生产平台分别进行复制。然而，一次性迁移环境——即那些只运行一次、将源数据迁移至目标数据以完成初始化的应用程序和脚本——如果团队允许，可能只需创建较短时间即可。\n\
  \n典型的 ETL 架构包含一个源端、一个 ETL 中间件和一个目标端。该架构如图 7-2 所示。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig2_HTML.jpg](img/486629_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n典型的 ETL 架构\n\n在一次性迁移架构中，我们并非在所有平台上复制 ETL 工具，而是仅创建一个实例，称为 ETL 预发布环境。运行此实例的唯一要求是，在部署过程中更新指向各个独立环境的连接端点。通过使用此技术，ETL\
  \ 预发布环境成为一个松散耦合的系统，具备该设计所带来的所有优势，例如可测试性提升、代码维护减少以及可扩展性增强（见图 7-3）。^((108))\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig3_HTML.jpg](img/486629_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3\n一次性迁移模型\n\n再次强调，一次性模型的这种使用方式取决于组织和安全团队的决定。通常，承载 ETL 工具的平台可能是内部虚拟机（VM）。如果这些虚拟机未经授权接触生产数据，那么您确实需要将应用程序及相应脚本复制到更安全的环境中，如可重复集成的环境所示（见图\
  \ 7-4）。\n\n### 可重复集成的环境\n\n可重复集成是一种特殊的存在，因为它既（a）指向特定的源端和目标端点，又（b）本身是需要不同版本的脚本。回忆一下，可重复集成是指那种基于\
  \ Web 服务触发器或预定时间（如每晚一次、每周一次或每月一次）持续更新数据的集成。它们的负载强度低于一次性迁移数据馈送，结构通常也较简单。然而，它们在组织中出现得更为频繁，一旦检测到任何问题，就需要监控和运维支持。\n\
  \n根据其结构，与可重复集成相关的 ETL 工具需要安装在专门的虚拟机（VM）上，并与其他准备部署的软件构建一同发布到相应的环境（开发、预发布和生产）中（见图\
  \ 7-4）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig4_HTML.jpg](img/486629_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4\n可重复集成架构\n\n### DevOps 实践：一个部署示例\n\n到目前为止，我们重点讨论了环境、架构和部署。您可能会问，这些与平台自动化（本章标题）有什么关系？好吧，为了开始讨论自动化，我们将简要提及\
  \ DevOps，而自动化正是其核心目标之一。\n\n根据 《敏捷管理员》博客作者欧内斯特·米勒的定义，DevOps 是“运营工程师和开发工程师共同参与整个服务生命周期，从设计到开发过程再到生产支持”的实践。^((109))\
  \ 他承认这是一个相当宽泛的定义，并澄清了我们在 DevOps 上下文中通常讨论的以下三个实践：\n\n*   **基础设施自动化**：通过自动化代码创建系统、配置和应用程序部署\n\
  *   **持续交付**：以快速、自动化的方式构建、测试和部署您的应用程序\n*   **站点可靠性工程**：运维系统、监控和编排，并为可操作性进行设计\n\n\
  我们将重点讨论第一个实践——基础设施自动化，以测试如何通过顺序运行的工作流拉取数据，从而在几分钟内完成从源到目标的完整部署。这并不复杂，并且将展示自动化集成是多么高效。\n\
  \n#### 我们的架构\n\n下图展示我们设想的示例架构，该架构安装在三个独立的环境中（见图 7-5）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig5_HTML.jpg](img/486629_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5\n用于平台自动化的 ETL 设计\n\n图 7-5 展示了一个示例设计，说明我们的 ETL 工具将如何在之前讨论过的每个不同环境中运行。此图新增了一个标签：**编排引擎/调度工具**，这是一个根据定义好的业务流程模型协调步骤和活动顺序的软件应用程序。^((110))\
  \ 编排引擎可以是软件包的一部分，也可以像 Jenkins 那样作为外部安装的开源自动化工具，持续构建和测试软件项目。^((111)) 如果没有 Jenkins\
  \ 这类工具，我们可以使用调度工具替代，例如 `Microsoft Task Scheduler`、用于 Mac 的 `crontab` 或用于 Linux 的\
  \ `cron`。\n\n然而，请将此架构视为一种逻辑表示。为了简化，我们只会在本地计算机上安装一个 ETL 工具实例（上一章中的 PDI）。此外，这三个环境是不同的路径名，而非独立的虚拟机。尽管如此，这种结构类型应该足以模拟我们试图实现的那种分区。\n\
  \n在我们的演示中，我将使用 Windows 系统，并放弃安装 Jenkins，转而使用内置的 `Task Scheduler`。macOS 和 Linux 用户可以按自己节奏跟进，或者，如果您熟悉\
  \ Jenkins，可以搭建一个实验性测试平台。\n\n\n\n#### 准备自动化\n\n在第 6 章中，我们克隆了一个 Git 文件夹，以便运行一个示例集成。如果尚未完成，请参考该章节并重复安装步骤。\n\
  \n初始场景如下：\n\n- 我们供职于 InfoMotors 的 IT 部门，这是一家汽车经销商，他们使用文本编辑器跟踪客户购买记录。这些文件存储了客户数据（`name`、email）、客户购买的汽车（`make`、`model`、`color`、`year`）、客户支付的价格以及购车日期。由于\
  \ InfoMotors 是一家新经销商，他们所有的记账和报告工作都在 Excel 中完成。\n\n- 但情况正在发生变化。为了提高效率并最大限度地减少数据问题，管理层希望将他们的文本文件迁移到新的本地数据库中。\n\
  \n在评估需求并构建出源到目标映射之后，我们设计了数据迁移流程流程图并撰写了摘要（见图 7-6）：\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig6_HTML.jpg](img/486629_1_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** — 数据迁移流程流程图\n\n1. **创建/截断 BUYER 表**：使用 ETL 工具，如果 `BUYER` 表不存在则创建它。如果存在，则截断所有数据以备下次加载。\n\
  \n2. **提取 CSV**：使用 ETL 工具的 CSV 连接器，检索所有逗号分隔的数据。\n\n3. **提取 TSV**：使用 ETL 工具的文本连接器，检索所有制表符分隔的数据。\n\
  \n4. **转换值**：以 `STTM` 为参考，更改已标识的转换值。\n\n5. **合并文件**：将新的（转换后的）暂存文件合并为一个为目标格式准备好的文件。\n\
  \n6. **将数据插入 BUYER 表**：使用 ETL 工具的 SQLite 连接器，将所有值插入 `BUYER` 表。\n\n7. **决策**：加载过程中是否有任何错误？\n\
  \    1. 如果有，则回滚数据并发送一份报告。\n    2. 如果没有，则将 `BUYER` 表的输出写入一个 `.csv` 文件。\n\n我们将这些需求交给了开发人员，他们返回了完成的原型文件。\n\
  \n就在交付日期临近的一个晚上，我们接到了项目经理的电话，他告诉我们管理层最近又发现了四个源文件。其中，2014 年和 2015 年的文件是 Excel 格式，其余的文件使用\
  \ CSV 分隔符。他们想知道我们是否也能将这些数据纳入新数据库。我们现在的工作是回过头来将这些文件加到原型中，进行测试，然后确保 QA 团队对我们的结果感到满意。\n\
  \n好消息是，管理层已同意取消每两周迁移一次数据的要求。就目前而言，我们可以回到最初的结论：这次迁移将是一次性的。\n\n他们还问，我们是否可以不合并数据，而是直接将数据原样加载到新数据库中。他们会根据需要执行去重和清理工作。\n\
  \n根据这些新信息，我们重新审视流程并重启启动阶段。你逐个部分地与你的集成团队沟通新需求。“能做到吗？”你问道。“需要多长时间？”\n\n主开发人员说：“这会是项艰巨的工作。但我们会尽最大努力在下一个冲刺结束前完成。”\n\
  \n> **注意**  \n> 我猜想所需时间可能会少于两个冲刺，但你的主开发人员不会这么告诉你，因为他想通过压低承诺、超额交付来展现团队的高超能力。集成团队最棒了。\n\
  \n你已经准备好了后续步骤。你重新打开之前已获批的文档，并标记出新的需求。例如，你将数据迁移计划中的早期方案修改如下。\n\n#### 拟定的迁移与集成方案\n\
  \n我们将使用 ETL 工具从六个文件（三个逗号分隔文件、一个制表符分隔文件和两个 Excel 文件）中提取数据，对内部数据执行转换以匹配目标结构，并将数据提取到目标数据库。今后所有的数据录入都将在目标系统上完成。\n\
  \n你还可以修改未来状态图，以表示多个 CSV 和 XLS 文件，而不仅仅是首次迭代中的 CSV 和 TSV（见图 7-7）：\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig7_HTML.jpg](img/486629_1_En_7_Fig7_HTML.jpg)\n\
