  \ 文件（Linux）或 Data Integration 应用快捷方式（macOS）。\n\n*   点击 `File/Open` 菜单（Windows 上使用\
  \ `CTRL+O`），然后导航到你从 GitHub 下载的 `chapter7\\development\\scripts` 目录。双击 `job_infomotors2.kjb`\
  \ 文件。该脚本将打开（见图 7-9）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig9_HTML.jpg](img/486629_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9\n\n`job_infomotors2.kjb` 脚本\n\n用 Pentaho 的行话来说，你看到的是一个“作业”。它就像一个编排引擎，负责协调\
  \ ETL 任务和活动的执行及依赖关系。^(¹¹²)\n\n这个作业就是我们一直在讨论的自动化脚本，它包含对我们之前数据迁移流程中确定的其它 ETL 函数的调用。该窗口按顺序显示这些任务：\n\
  \n*   create target table buyer\n\n*   ETL source csv\n\n*   ETL source tsv\n\n\
  *   ETL source xls\n\n*   select target table buyer\n\n你会注意到，页面底部还有一个通过 ETL 任务连接的任务。这是一个失败“跳转”，它将在任何\
  \ ETL 流程失败时触发，执行回滚操作并报告错误的类型和性质。\n\n*   如果你右键点击这些步骤中的任意一个，并选择“Open Referenced Object\
  \ ➤ Transformation”，你将打开与该步骤关联的嵌入式脚本。就像我们在第 6 章中所做的那样，让我们对“create target table buyer”步骤执行此操作（见图\
  \ 7-10）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig10_HTML.jpg](img/486629_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10\n\n右键点击 create target table buyer\n\n**注意**：正如我们在之前的演示中所讨论的，你也可以通过点击 `File/Open`\
  \ 并从 `chapter6/scripts` 目录中选择相应的名称来打开脚本。我指定的通过右键点击的方式步骤更少，但你可以根据自己的偏好选择。\n\n你将看到，这个步骤与我们之前使用的迭代版本编写方式相似，只是我们修改了\
  \ SQL，这样如果表不存在，就会实例化该表。换句话说，当你首次运行此应用程序时，开发数据库模式（`infomotors_dev.db`）会与 `BUYER`\
  \ 表一同创建（见图 7-11）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig11_HTML.jpg](img/486629_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11\n\n`CREATE TABLE BUYER` 的更新版本\n\n*   因为该脚本将在我们执行作业时运行，所以你无需执行任何操作。在此窗口中点击“Cancel”，然后点击窗口左上角的\
  \ `job_infomotors` 标签页。\n\n*   现在，右键点击“ETL source csv”步骤，并选择“Open Referenced Object”\
  \ ➤ ”Transformation”。你看到的是提取（多个）CSV 文件、转换数据并加载到 `BUYER` 表中的模型。\n\n你会注意到，此文件与“原型”脚本不同，我们将制表符分隔步骤以及新的\
  \ Excel 步骤分离出来，放到了各自独立的流程中。我们本可以将它们合并到一个文件中，但从架构角度来看，通过保持功能的模块化并使其专注于单一职责来分离它们是有意义的。\n\
  \n*   连接器中还有其它一些模式需要我们审阅。\n\n*   首先，双击“Extract Multiple CSVs”将其打开（见图 7-12）。\n\n\
  ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig12_HTML.jpg](img/486629_1_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12\n\nExtract Multiple CSVs\n\n你会注意到，在“Selected Files”处，我们有一个如下所示的目录路径：\n\n\
  ```\n${Internal.Entry.Current.Directory}/../input\n```\n\n`${…}` 之间的值是一个 PDI 内部变量。它告诉我们，正在检查的变量是我们保存脚本的位置。在我的机器上，我将作业保存到了目录\
  \ `C:\\Users\\<<在此处输入你的用户名>>\\Documents\\BAIT\\chapter7\\development\\scripts`。你的路径应该类似。变量后的\
  \ `/../` 表示上一级目录，而 file input 是最后一个目录值。因此，我正在对路径 `C:\\Users\\Jarrett\\Documents\\\
  BAIT\\chapter7\\development\\input` 执行查找，该目录包含 InfoMotors 的示例记录。\n\n下一列是通配符 (RegEx)，它指示要查找的文件的筛选条件，对于此任务，是\
  \ `.*.csv`。也就是说，任何以后缀 `.csv` 标识并存储在 `development\\input` 目录中的文件都会被读入系统。\n\n这种结构特别有用的地方在于，我们存储在\
  \ `\\input` 目录中的任何带有 `.csv` 前缀的文件都会被读取并自动追加。当然，格式需要与我们预期使用的输入（`id`、`first_name`、`last_name`\
  \ 等）相匹配，一些快速的数据分析可以帮助我们确定是否确实如此。\n\n因为我们使用变量作为输入路径，而不是硬编码，所以我们不再需要知道脚本存储的*位置*。我们只需确保有一个上一级目录（`/../`）和一个额外的输入路径即可。正是这种语法，使得我们可以快速地将同一个脚本放入一个完全不同的环境中，它也能照常工作，而无需感知其目录结构是不同的。例如，如果你在我们的预发目录中打开同一个“ETL\
  \ source csv”文件，你会看到我们使用了同一个文件，只是这一次，我们的预发脚本是从*预发*文件夹中读取，而不是从*开发*文件夹中读取。在我看来，这种通用代码是部署的秘诀。无论我们将此脚本存储在何处，我们只需确保目录的后半部分遵循某种模式，就可以顺利运行。\n\
  \n**注意**：出于演示目的，SQLite 数据源的名称已被调整为映射到 `infomotors_dev.db`、`infomotors_staging.db`\
  \ 和 `infomotors_prod.db`。这样做是因为我们在同一台机器上运行 ETL 脚本，并且不希望覆盖本应隔离的数据。在典型的基础设施中，你很可能使用相同的数据库模式、表和字段，而这个连接器可以保持硬编码，或者，如果你愿意，也可以作为一个变量。\n\
  \n我将把 `job_infomotors` 作业中的 ETL source `.tsv` 和 ETL source `.xls` 脚本留给你去审阅。你会看到它们遵循相同的格式，只是通配符值被调整为匹配它们的筛选条件\
  \ `.*.tsv` 和 `.*.xls`。与 CSV 文件一样，我们可以将任意数量的带后缀文件添加到该环境的 `/input` 文件夹中，每个文件都将包含在我们的作业运行中。\n\
  \n\n\n#### 输出步骤\n\n在测试完整自动化之前，我们还有两个步骤需要检查。\n\n-   在 `job_infomotors` 页面，右键点击“选择目标表\
  \ buyer”步骤，然后选择“打开引用对象 ➤ 转换”。该流程将会打开。\n\n此步骤的目的是满足我们的数据迁移流程中指定的要求，这将在我们测试作业执行时作为一种完整性检查。此步骤完成了两项活动（参见图\
  \ 7-13）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig13_HTML.jpg](img/486629_1_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13 – “选择目标表 buyer”流程\n\n第一个活动对 `InfoMotors BUYERS` 表执行了一个 `SELECT COUNT` 操作。`PDI`\
  \ 日志会显示这个计数以供您查看。第二个 `SELECT` 检索了 `BUYER` 数据集的所有字段，并将结果输出到一个名为 `BUYER.csv` 的 CSV\
  \ 文件。与我们抽取步骤中的输入类似，此输出指向您相对环境中的 `/output` 目录（参见图 7-14）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig14_HTML.jpg](img/486629_1_En_7_Fig14_HTML.jpg)\n\
  \n图 7-14 – `BUYER.csv` 输出目录\n\n#### 回滚\n\n我们的最后一步是错误步骤。ETL 工具允许您控制异常逻辑的工作方式。在 ETL\
  \ 领域，可能会发生两大类错误。第一类是技术错误，您会因其出现网络、基础设施或安全方面的问题而看到此错误。例如，当您尝试从一个离线的数据库检索信息，或者尝试使用旧密码登录系统时，就会捕获到技术错误。在这些情况下，您的\
  \ ETL 将被编程为向网络、基础设施或数据库管理员报告错误原因、时间、日期以及任何其他可能有帮助的信息。\n\n第二类称为业务错误。如果预期应发生的工作流规则或需求没有发生，则会发生此错误。例如，如果一个字段本应只提供数字，但却包含了字母，就会触发业务错误。IBM\
  \ 的命名标准以及我们在本书前面讨论过的变通方法是另一个业务错误的例子，尽管这种错误不会触发警报。鉴于数据可能“出错”的主观程度，业务错误通常比技术故障更难解决，您的团队将花费大量时间寻找消除数据问题的新方法。幸运的是，您持续改进\
  \ ETL 逻辑、改进部署以及监控变更的策略（参见第 8 章）将会步入正轨，您的团队最终将在数据修复领域成为神枪手。\n\n目前，我们将保持回滚策略的简单性。任何错误，无论是技术错误还是业务错误，都会触发我们的脚本运行。像往常一样打开“错误回滚和警报”步骤，您会看到只有两个任务：从\
  \ `BUYER` 表中删除所有记录，并向 `PDI` 发送一条包含以下消息的日志警报：`\"An error occurred with the integration.\
  \ Rolling back\"`（参见图 7-15）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig15_HTML.jpg](img/486629_1_En_7_Fig15_HTML.jpg)\n\
  \n图 7-15 – 错误回滚和警报步骤\n\n#### 测试自动化\n\n了解了这些步骤之后，现在是时候从头到尾运行我们的作业了。还记得我承诺过的一键点击吗？\n\
  \n-   在 `job_infomotors` 主页面，点击运行按钮。将会打开一个“运行选项”页面。\n\n-   在“运行选项”页面上点击运行。\n\n（好吧，您可能会说这实际上是按了两次按钮。我们本章还没完全结束，所以请耐心等待。）\n\
  \n如果一切按预期运行，您的作业流应该会从头到尾贯穿整个流程。也就是说，我们满足了数据迁移流程和源到目标映射中所述的要求，并与我们数据迁移计划的目的和未来状态保持一致。只需按两次按钮就能完成这么多工作。\n\
  \n如果您查看执行结果日志窗格，您会看到触发的不同工作流，以及读写计数、警报和持续时间。这个日志窗格是您经常在 `PDI` 中使用的功能，但任何物有所值的 ETL\
  \ 系统都会提供类似的报告标准（参见图 7-16）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig16_HTML.jpg](img/486629_1_En_7_Fig16_HTML.jpg)\n\
  \n图 7-16 – 执行结果日志面板\n\n根据我的日志，我们在不到 2 秒的时间内加载了 687 条记录。即使我们仍然多按了一次按钮，这个时间也不错。\n\n\
  如果您想查看我们加载并随后从数据库表中提取的记录，请导航到 `chapter7/development/output` 目录并打开 `BUYER.csv` 文件。\n\
  \n\n\n##### 测试\n\n在设置定期 ETL 之前，我们还有一个主题需要讨论：测试。在 DevOps 的世界里，我们应该实现测试自动化，而且说实话，这可能会涉及一些繁重的操作。开发人员和测试自动化工程师需要协同工作，共同开发测试脚本，最大化编码脚本的测试覆盖率，并通过使用各种\
  \ CI/CD 工具，在持续循环中生成、部署和运行测试脚本。^(¹¹³)\n\n全面开展自动化测试超出了本书的讨论范围。只需说明，我们想要做的是找到一种快速运行测试的方法，并确保能从测试中优雅地恢复。为此，我们希望提取那些会导致技术错误和业务错误的数据，然后观察系统对问题的反应。理想情况下，所有这些都应在后台完成，使用为此目的构建的测试环境、脚本和数据。\n\
  \n我们不会执行这些复杂的操作，而是采用老派的测试方式：在输入目录中打开一个 CSV 文件，将数据脚本中的一个值改为无效值，然后重新运行我们的任务。就这么简单。如果你准备好了，请执行以下步骤：\n\
  \n1.  在你的 `chapter7\\development\\input` 目录中，使用记事本或你喜欢的文字处理器（如 Sublime、Notepad++、Vim\
  \ 或 TextPad）打开 `Contacts_2016.csv` 文件。建议避免使用 Word、WordPad 或 Excel，因为我们要做的改动很小，而这些应用程序在保存\
  \ CSV 文件时可能会添加字符或删减数值。\n\n2.  将第二行的最后一个值改为 `ABCDE`（见图 7-17)\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig17_HTML.jpg](img/486629_1_En_7_Fig17_HTML.jpg)\n\
  \n   图 7-17\n\n   修改 CSV\n\n3.  在 PDI 中，点击“运行”按钮重新运行 `job_infomotors`。\n\n如果一切按预期进行，流程将启动，但你会触发\
  \ `ETL source csv` 步骤上的错误。屏幕上显示的路径将指向 `error rollback and alert` 步骤（见图 7-18）。\n\n\
  ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig18_HTML.jpg](img/486629_1_En_7_Fig18_HTML.jpg)\n\
  \n图 7-18\n\nETL 源 CSV 错误\n\n“执行结果日志”窗格将显示任务的输出。你应该能看到我们编程设置的警报消息（`集成过程中发生错误。正在回滚`），以及从\
  \ `BUYER` 表中执行删除操作的步骤。\n\n如果在此时，你打开 `select target table buyer` 步骤并手动运行此过程，你会从日志中看到该表的计数为零，从而确认该表是空的（见图\
  \ 7-19）。\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig19_HTML.jpg](img/486629_1_En_7_Fig19_HTML.jpg)\n\
  \n图 7-19\n\n错误后选择买家表的结果。注意计数等于 0\n\n#### 任务调度\n\n作为最后一步，我们将设置此任务按需运行和按计划运行。之前，我提到过使用像\
  \ Jenkins 这样的编排引擎或像 Microsoft 任务计划程序这样的调度工具来自动化我们的脚本。在这一步中，我们将配置任务计划程序，让我们的 PDI\
  \ 任务每 5 分钟执行一次。如前所述，欢迎使用你偏好的编排引擎或调度工具来测试任务执行。\n\n1.  点击 Windows“开始”图标，输入 `task scheduler`\
  \ 并按回车键。\n\n   任务计划程序将启动（见图 7-20）。\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig20_HTML.jpg](img/486629_1_En_7_Fig20_HTML.jpg)\n\
  \n   图 7-20\n\n   Windows 任务计划程序\n\n2.  选择名为 `创建任务` 的操作。\n\n3.  “创建任务”窗口将打开（见图 7-21）。在“常规”选项卡上，在提供的字段中输入信息：\n\
  \n   * 名称：`Run Infomotors_ETL`\n   * 描述：填写你喜欢的任何内容，但为了便于知识传递，我通常会明确填写，不会让此字段留空。\n\
  \   * 勾选 `使用最高权限运行`\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig21_HTML.jpg](img/486629_1_En_7_Fig21_HTML.jpg)\n\
  \n   图 7-21\n\n   “常规”选项卡\n\n4.  在“触发器”下，点击“新建”按钮。“新建触发器”窗口将打开（见图 7-22）。在此输入你的详细信息。例如，我选择从午夜开始，每\
  \ 5 分钟重复执行一次任务。你当然可以选择任何你喜欢的方式，但最好是距离你开始时间不超过一小时。\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig22_HTML.jpg](img/486629_1_En_7_Fig22_HTML.jpg)\n\
  \n   图 7-22\n\n   新建触发器\n\n5.  在“操作”下，点击“新建”按钮。“新建操作”窗口将打开（见图 7-23）。请严格按此处的样式输入你的详细信息：\n\
  \n   * 操作：`启动程序`\n   * 程序/脚本：`<你解压 Pentaho 的路径>\\data integration\\kitchen.bat`\n\
  \   * 添加参数：`/file:<你的脚本文件安装路径>\\job_infomotors.kjb`\n\n   大多数 ETL 工具都包含一个命令行可执行文件，允许你通过单个命令运行流程。`Kitchen`\
  \ 是 PDI 用于执行任务的命令行工具。在“添加参数”字段中，你正在选择要执行的任务（见图 7-23）。使用你想要的任何环境。有关你可以与 PDI 一起使用的其他参数和命令行工具的更多详细信息，请参考\
  \ [`help.pentaho.com/Documentation/7.0/0L0/0Y0/070`](https://help.pentaho.com/Documentation/7.0/0L0/0Y0/070)。^(¹¹⁴)\n\
  \n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig23_HTML.jpg](img/486629_1_En_7_Fig23_HTML.jpg)\n\
  \n   图 7-23\n\n   新建操作\n\n6.  点击“确定”，然后再次点击“确定”。\n\n7.  系统可能会请求验证你的用户名和密码凭据。请在此处完成验证。\n\
  \n8.  你将返回到“任务计划程序”窗口（见图 7-24）。\n\n   ![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig24_HTML.jpg](img/486629_1_En_7_Fig24_HTML.jpg)\n\
  \n   图 7-24\n\n   任务计划程序窗口\n\n此时，你可以选择等待任务执行（就我而言是每 5 分钟执行一次），或者通过双击“活动任务”窗格中的 `run\
  \ Infomotors_ETL job`（见图 7-25），然后点击一次“运行”按钮（见图 7-26），按需运行任务。顺便提一下，这就是我在本章开头承诺的“一键操作”。\n\
  \n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig26_HTML.jpg](img/486629_1_En_7_Fig26_HTML.jpg)\n\
  \n图 7-26\n\n选择“运行”按钮\n\n\n\n![../images/486629_1_En_7_Chapter/486629_1_En_7_Fig25_HTML.jpg](img/486629_1_En_7_Fig25_HTML.jpg)\n\
  \n**图 7-25** 双击活动任务\n\n您可以通过查看任务计划程序的上方窗格，搜索您的活动，并滚动到`上次运行结果`，来确认任务是否已成功执行。\n\n\
  这最终的确认可能还不够，您可能还想知道还有什么其他功能。其实可以做的事情很多，大多数都建立在客户对成功和错误处理的需求之上。例如，在我们交付的许多集成项目中，我们会配置在任务成功完成或失败时发送电子邮件。此外，我们的团队通常更倾向于调用一个能触发\
  \ ETL 命令行界面活动的包装脚本，而不是像示例中那样在`新建操作`窗口中直接输入 ETL CLI 工具，这样在我们更换工具或流程时，代码更容易修改。这些只是您可以通过计划任务实现的一部分功能，您的\
  \ ETL 工具应该能够支持更多。\n\n## 总结\n\n本章带您进入了部署、自动化和调度的世界。在了解了开发环境、预发布环境和测试环境之间的一些区别后，我们演示了如何将原型配置为可在任何环境中灵活工作、可根据需要适配尽可能多的文件类型，并可设置为每\
  \ 5 分钟触发一次重复执行。当今市面上大多数 ETL 产品以及基于脚本构建的 ETL 工具，都应该能够处理这类偶发情况，因此我鼓励您的团队继续探索，找到最适合的方案。真正的价值不在于工具本身，而在于所选应用程序处理各种数据、并以更快的速度解决那些问题的能力。我希望您现在有足够的信心：当需求在最后一刻发生变化时，您将知道如何快速调整，更重要的是，能够期待这些修改的速度和准确性。\n\
  \n在下一章中，我们将讨论在将应用程序部署到生产环境后，如何开始监控结果。\n\n"
