  ## 梯度提升


  梯度提升方法继承输入特征的值，然后执行无数个树模型以最小化损失函数（例如，线性建模的平均绝对误差）。它通过吸收弱模型来实现这一点，然后逐步迭代地对数据进行加权建模，并勤勉地伴随选择性能最佳的弱模型。




