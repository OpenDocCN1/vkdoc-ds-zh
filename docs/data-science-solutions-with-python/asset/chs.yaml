  ## 探索加速失效时间方法


  加速失效时间方法使用对数线性函数对删失数据进行建模，以描述生存时间的对数。同样，它也假设每个实例是独立的。


  ### PySpark 实战


  本节将使用 PySpark 框架执行加速失效时间方法。


  代码清单 4-8 使用 `findspark` 框架运行 PySpark 框架。


  ```

