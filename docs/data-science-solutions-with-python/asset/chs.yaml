  本章使用一系列全面的 Python 框架（即 Scikit-Learn、XGBoost、PySpark 和 H2O）执行并评估一种基于树的方法（决策树方法）和一种集成方法（梯度提升树方法）。首先，本章阐明了决策树如何计算类别的概率。


  ## 决策树


  *决策树*是一种基础的非参数方法，适用于线性和非线性建模。它执行决策规则，并发展出一种树状结构，以最小的深度将值划分为不同的组（见图 6-1）。


