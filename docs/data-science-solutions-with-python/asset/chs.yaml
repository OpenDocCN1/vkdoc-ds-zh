- '# 5. 使用 Scikit-Learn、PySpark 和 H2O 进行非线性建模


  本章将使用一系列全面的 Python 框架（即 Scikit-Learn、Spark MLlib 和 H2O）来执行并评估一种用于二分类的非线性方法（称为*逻辑回归*）。首先，它阐明了
  sigmoid 函数背后的基本概念。




  ## 探索逻辑回归方法


  逻辑回归方法统一接收数值，然后通过执行一个函数（`sigmoid`）来对它们进行建模，以预测分类输出特征的值。方程 5-1 定义了 sigmoid 函数，该函数适用于逻辑回归（另请参见图
  5-1）。


  ![$$ S(x)=\frac{L}{1-{e}^{-x}}=\frac{e^x}{e^x+1} $$](img/517508_1_En_5_Chapter_TeX_Equ1.png)


  （方程 5-1）


