  清单 7-9 构建了一个多层感知器神经网络，该网络包含两个隐藏层，每层有 17 个神经元。输入层包含一个速率为 0.001 的 `"l1"` 正则化器、`relu`
  激活函数，以及 `binary_crossentropy loss` 和 `accuracy` 指标。


  ```

  def keras_multilayer_perceptron_net(optimizer="adam"):

  keras_multilayer_perceptron_net_model = Sequential()

  keras_multilayer_perceptron_net_model.add(Dense(17, input_dim=17, activation="sigmoid",kernel_regularizer=regularizers.l1(0.001),
  bias_regularizer=regularizers.l1(0.01)))

  keras_multilayer_perceptron_net_model.add(Dense(17, activation="relu"))

  keras_multilayer_perceptron_net_model.add(Dense(17, activation="relu"))

  keras_multilayer_perceptron_net_model.add(Dense(1, activation="relu"))

  keras_multilayer_perceptron_net_model.compile(loss="binary_crossentropy", optimizer=optimizer,
  metrics=["accuracy"])

  return keras_multilayer_perceptron_net_model

