  pyspark_configuration = SparkConf().setAppName("pyspark_aft_method").setMaster("local")

  代码清单 4-9

  指定 PySpark 应用

  ```


  代码清单 4-10 使用 `SparkSession()` 方法准备 PySpark 会话。


