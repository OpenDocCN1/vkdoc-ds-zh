  本章介绍普通最小二乘法，并使用主要的 Python 框架（即 `Scikit-Learn`、`Spark MLlib` 和 `H2O`）执行该方法。首先解释该方法背后的基本概念。


  ## 探索普通最小二乘法


  普通最小二乘法用于具有不受限制（连续）输出特征的数据。此方法要求正态性和线性，并且误差项（也称为*残差*）中不能存在自相关，也不能存在多重共线性。它也非常容易受到数据异常的影响，因此如果此方法效果不佳，你可能希望使用替代方法，例如
  `Ridge`、`Lasso` 和 `Elastic Net`。


