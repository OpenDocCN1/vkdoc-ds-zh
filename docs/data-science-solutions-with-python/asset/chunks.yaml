    Listing [7-8](#517508_1_En_7_Chapter.xhtml#PC8) employs the `tensorflow` framework
    as a backend and installs the Keras framework.


    ```

    import tensorflow as tf

    from  tensorflow.keras import Sequential, regularizers

    from  tensorflow.keras.layers import Dense

    from  tensorflow.keras.wrappers.scikit_learn import KerasClassifier

    Listing 7-8

    Employ the Tensorflow Framework as Backend and Install the Keras Framework

    ```


    Listing [7-9](#517508_1_En_7_Chapter.xhtml#PC9) structures a multilayer perceptron
    neural network with two hidden layers that have 17 neurons. The input layer contains
    a `"l1"` regularizer with a 0.001 rate, the `relu` activation function, and `binary_crossentropy
    loss` and `accuracy` metrics.


    ```

    def keras_multilayer_perceptron_net(optimizer="adam"):

    keras_multilayer_perceptron_net_model = Sequential()

    keras_multilayer_perceptron_net_model.add(Dense(17, input_dim=17, activation="sigmoid",kernel_regularizer=regularizers.l1(0.001),
    bias_regularizer=regularizers.l1(0.01)))

    keras_multilayer_perceptron_net_model.add(Dense(17, activation="relu"))

    keras_multilayer_perceptron_net_model.add(Dense(17, activation="relu"))

    keras_multilayer_perceptron_net_model.add(Dense(1, activation="relu"))

    keras_multilayer_perceptron_net_model.compile(loss="binary_crossentropy", optimizer=optimizer,
    metrics=["accuracy"])

    return keras_multilayer_perceptron_net_model

