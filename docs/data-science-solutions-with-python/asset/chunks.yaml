    # 4. Survival Analysis with PySpark and Lifelines


    This chapter describes and executes several survival analysis methods using the
    main Python frameworks (i.e., Lifelines and PySpark). It begins by explaining
    the underlying concept behind the Cox Proportional Hazards model. It then introduces
    the accelerated failure time method.


    ## Exploring Survival Analysis


    Survival methods are common in the manufacturing, insurance, and medical science
    fields. They are convenient for properly assessing risk when an independent investigation
    is carried out over long periods and subjects enter and leave at given times.


    These methods are employed in this chapter to determine the probabilities of a
    machine failing and patients surviving an illness, among other applications. They
    are equally suitable for missing values (censored data).


    ## Exploring Cox Proportional Hazards Method


    The Cox Proportional Hazards method is the best survival method for handling censored
    data with subjects that have related changes. It is similar to the Mantel-Haenszel
    method and expects the hazard rate to be a function of time. It states that the
    rate is a function of covariates. Equation [4-1](#517508_1_En_4_Chapter.xhtml#Equ1)
    defines the Cox Proportional Hazards method.


    ![$$ \left(t,{x}_1,{x}_2,\dots, {x}_p\right)=(t)\ \mathit{\exp}\left({b}_1{X}_1+{b}_2{X}_2+\dots
    {b}_p{X}_p\right) $$](images/517508_1_En_4_Chapter/517508_1_En_4_Chapter_TeX_Equ1.png)


