- fmt: '### Better Customer Relationships


    Insights from big data help manage customer relationships. Organizations with
    big data about their customers can study customers’ behavioral patterns and use
    descriptive analytics to drive customer-management strategies.


    ### Refined Product Development


    Data-driven organizations use big data analytics and predictive analytics to drive
    product development and management strategies. This approach is useful for incremental
    and iterative delivery of applications.


    ### Improved Decision-Making


    When a business has big data, it can use it to uncover complex patterns of a phenomenon
    to influence strategy. This approach helps management make well-informed decisions
    based on evidence, rather than on subjective reasoning. Data-driven organizations
    foster a culture of evidence-based management.


    We also use big data in fields like life sciences, physics, economics, and medicine.
    There are many ways in which big data affects the world. This chapter does not
    consider all factors. The next sections explain big data warehousing and ETL activities.


    ## Big Data Warehousing


    Over the past few decades, organizations have invested in on-premise databases,
    including Microsoft Access, Microsoft SQL Server, SAP Hana, Oracle Database, and
    many more. There has recently been widespread adoption of cloud databases like
    Microsoft Azure SQL and Oracle XE. There are also standard big data (distributed)
    databases like Cassandra and HBase, among others. Businesses are shifting toward
    scalable cloud-based databases to harness benefits associated with increasing
    computational power, fault-tolerant technologies, and scalable solutions.


    ### Big Data ETL


    Although there have been significant advances in database management, the way
    that people manipulate data from databases remains the same. Extracting, transforming,
    and loading (ETL) still play an integral part in analysis and reporting. Table
    [2-2](#517508_1_En_2_Chapter.xhtml#Tab2) discusses ETL activities.


    Table 2-2


    ETL Activities


    | Activity | Description |

    | --- | --- |

    | Extract | Involves getting data from some database. |

    | Transforming | Involves converting data from a database into a suitable format
    for analysis and reporting |

    | Loading | Involves warehousing data in a database management system. |


    To perform ETL activities, you must use a query language. The most popular query
    language is SQL (Standard Query Language). There are other query languages that
    emerged with the open source movement, such as HiveQL and BigQuery. The Python
    programming language supports SQL. Python frameworks can connect to databases
    by implementing libraries, such as `SQLAlchemy`, `pyodbc`, `SQLite`, `SparkSQL`,
    and `pandas`, among others.


    ## Big Data Frameworks


    Big data frameworks enable developers to collect, manage, and manipulate distributed
    data. Most open source big data frameworks use in-memory cluster computing. The
    most popular frameworks include Hadoop, Spark, Flink, Storm, and Samza. This book
    uses PySpark to perform ETL activities, explore data, and build machine learning
    pipelines.


    ### Apache Spark


    Apache Spark executes in-memory cluster computing. It enables developers to build
    scalable applications using Java, Scala, Python, R, and SQL. It includes cluster
    components like the driver, cluster manager, and executor. You can use it as a
    standalone cluster manager or on top of Mesos, Hadoop, YARN, or Baronets. You
    can use it to access data in the Hadoop File System (HDFS), Cassandra, HBase,
    and Hive, among other data sources. The Spark data structure is considered a resilient
    distributed data set. This book introduces a framework that integrates both Python
    and Apache Spark (PySpark). The book uses it to operate Spark MLlib. To understand
    this framework, you first need to grasp the idea behind resilient distributed
    data sets.


    #### Resilient Distributed Data Sets


    Resilient Distributed Data Sets (RDDs) are immutable elements for parallelizing
    data or for transforming existing data. Chief RDD operations include transformation
    and actions. We store them in any storage supported by Hadoop. For instance, in
    a Hadoop Distributed File System (HDF), Cassandra, HBase, Amazon S3, etc.


    #### Spark Configuration


    Areas of Spark configuration include Spark properties, environment variables,
    and logging. The default configuration directory is `SPARK_HOME/conf`.


    You can install the `findspark` library in your environment using `pip install
    findspark` and install the `pyspark` library using `pip install pyspark`.


    Listing [2-1](#517508_1_En_2_Chapter.xhtml#PC1) prepares the PySpark framework
    using the `findspark` framework.


    ```

    import findspark as initiate_pyspark

    initiate_pyspark.init("filepath\spark-3.0.0-bin-hadoop2.7")

    Listing 2-1

    Prepare the PySpark Framework

    ```


    Listing [2-2](#517508_1_En_2_Chapter.xhtml#PC2) stipulates the PySpark app using
    the `SparkConf()` method.


    ```

    from pyspark import SparkConf

    pyspark_configuration = SparkConf().setAppName("pyspark_linear_method").setMaster("local")

    Listing 2-2

    Stipulate the PySpark App

    ```


    Listing [2-3](#517508_1_En_2_Chapter.xhtml#PC3) prepares the PySpark session with
    the `SparkSession()` method.


    ```

    from pyspark.sql import SparkSession

    pyspark_session = SparkSession(pyspark_context)

    Listing 2-3

    Prepare the Spark Session

    ```


    #### Spark Frameworks


    Spark frameworks extend the core of the Spark API. There are four main Spark frameworks—SparkSQL,
    Spark Streaming, Spark MLlib, and GraphX.


    ##### SparkSQL


    SparkSQL enables you to use relational query languages like SQL, HiveQL, and Scala.
    It includes a `schemaRDD` that has row objects and schema. You create it using
    an existing RDD, parquet file, or JSON data set. You execute the Spark Context
    to create a SQL context.


    ##### Spark Streaming


    Spark streaming is a scalable streaming framework that supports Apache Kafka,
    Apache Flume, HDFS, and Apache Kensis, etc. It processes input data using DStream
    in small batches you push using HDFS, databases, and dashboards. Recent versions
    of Python do not support Spark Streaming. Consequently, we do not cover the framework
    in this book. You can use a Spark Streaming application to read input from any
    data source and store a copy of the data in HDFS. This allows you to build and
    launch a Spark Streaming application that processes incoming data and runs an
    algorithm on it.


    ##### Spark MLlib


    MLlib is an ML framework that allows you to develop and test ML and DL models.
    In Python, the frameworks work hand-in-hand with the NumPy framework. Spark MLlib
    can be used with several Hadoop data sources and incorporated alongside Hadoop
    workflows. Common algorithms include regression, classification, clustering, collaborative
    filtering, and dimension reduction. Key workflow utilities include feature transformation,
    standardization and normalization, pipeline development, model evaluation, and
    hyperparameter optimization.


    ##### GraphX


    GraphX is a scalable and fault-tolerant framework for iterative and fast graph
    parallel computing, social networks, and language modeling. It includes graph
    algorithms such as PageRank for estimating the importance of each vertex in a
    graph, Connected Components for labeling connected components of the graph with
    the ID of its lowest-numbered vertex, and Triangle Counting for finding the number
    of triangles that pass through each vertex.


    ## ML Frameworks


    To solve ML problems, you need to have a framework that supports building and
    scaling ML models. There is no shortage of ML models – there are innumerable frameworks
    for ML. There are several ML frameworks that you can use. Subsequent chapters
    cover frameworks like Scikit-Learn, Spark MLlib, H2O, and XGBoost.'
