- fmt: '# Exploring the Principal Component Method


    The principal component method is a simple dimension reducer. It carries out linear
    transformations on the entire data set to attain vectors (identified as *eigenvalues*),
    then identifies incremental changes in the data. It enables you to detect changes
    in features in the data. This method helps determine the ratio of each feature
    so you can decide which features to preserve for modeling. It is suitable when
    your data contains countless features, because it helps you identify features
    that are imperative to the model. It is important to note that, although I call
    it a "method" in this chapter, that is not strictly the case. Compared to other
    methods, it does not consider any plausible hypotheses; rather, you execute it
    prior to executing linear, nonlinear, and cluster methods, among others.


    This chapter uses the data from the previous chapter, which covered the k-means
    method.


    Listing [9-1](#517508_1_En_9_Chapter.xhtml#PC1) attains the necessary data from
    a Microsoft CSV file.


    ```

    import pandas as pd

    initial_data = df.drop(drop_column_names, axis="columns")

    Listing 9-1

    Attain the Data

    ```


    Listing [9-2](#517508_1_En_9_Chapter.xhtml#PC2) drops any unnecessary features
    in the data.


    ```

    drop_column_names = df.columns[[0, 1]]

    initial_data = df.drop(drop_column_names, axis="columns")

    Listing 9-2

    Drop Unnecessary Features

    ```


    ## Scikit-Learn in Action


    Listing [9-3](#517508_1_En_9_Chapter.xhtml#PC3) scales the whole data set with
    a standard scaler.


    ```

    from sklearn.preprocessing import StandardScaler

    sk_standard_scaler = StandardScaler()

    sk_standard_scaled_data = sk_standard_scaler.fit_transform(initial_data))

    Listing 9-3

    Scale the Whole Data Set

    ```


    Listing [9-4](#517508_1_En_9_Chapter.xhtml#PC4) executes the principal component
    method with the Scikit-Learn framework. It then discloses the variance that each
    component clarifies (see Figure [9-1](#517508_1_En_9_Chapter.xhtml#Fig1)).


    ![../images/517508_1_En_9_Chapter/517508_1_En_9_Fig1_HTML.jpg](images/517508_1_En_9_Chapter/517508_1_En_9_Fig1_HTML.jpg)


    **Figure 9-1** Variance of the Scikit-Learn principal components method


    ```

    import matplotlib.pyplot as plt

    %matplotlib inline

    from sklearn.decomposition import PCA

    sk_principal_component_method = PCA(n_components=3)

    sk_principal_component_method.fit_transform(sk_standard_scaled_data)

    sk_principal_component_method_variance = sk_principal_component_method.explained_variance_

    plt.bar(range(3), sk_principal_component_method_variance, label="Variance")

    plt.legend()

    plt.ylabel("Variance ratio")

    plt.xlabel("Components")

    plt.show()

    Listing 9-4

    Arrange the Explained Variance from the Scikit-Learn Principal Components Method

    ```


    Figure [9-1](#517508_1_En_9_Chapter.xhtml#Fig1) shows all that components disclose
    over 0.5 of variance. Therefore, all the principal component methods will have
    three components.


    Listing [9-5](#517508_1_En_9_Chapter.xhtml#PC5) displays the variance from the
    Scikit-Learn principal component method.


