    ### 探索非线性模型


    非线性（分类）方法用于区分不同类别（也称为分类或标签）——见表 1-2。当因变量特征中存在两个类别时，你将实施二分类方法。当存在两个以上类别时，你将实施多分类方法。分类函数数不胜数，包括
    `sigmoid`、`双曲正切` 和 `核函数` 等。其应用取决于具体情境。后续章节将介绍其中部分函数。


    表 1-2


    不同的非线性模型


    | 模型 | 描述 |

    | --- | --- |

    | 二分类方法 | 适用于分类特征仅有两个可能结果的情况。常用的二分类器是逻辑回归模型。 |

    | 多分类方法 | 适用于分类特征有两个以上可能结果的情况。主要的多分类器是线性判别分析模型（也可用于降维）。 |

    | 生存分类 | 适用于使用分类特征计算事件发生概率的情况。 |


    ### 探索集成方法


    集成方法使你能够揭示线性和非线性关系。主要的集成方法是随机森林树，它通常计算量很大。此外，其性能取决于多种因素，如树的深度、迭代次数、数据划分和提升方法。


    ## 探索无监督方法


    与监督式机器学习相反，无监督学习不包含真实标签。你将模型暴露于所有样本数据，让其自行猜测数据的模式。最常见的无监督方法是与聚类相关的方法。


    ### 探索聚类方法


    聚类方法便于将数据中的公共值聚合在一起；它们使你能够发现结构化和非结构化数据中的模式。表 1-3 重点介绍了几种可用于猜测数据模式的聚类方法。


    表 1-3


    不同的聚类模型


    | 技术 | 描述 |

    | --- | --- |

    | 质心聚类 | 用于确定数据的中心，并将数据点向中心拉拢。主要的质心聚类方法是 `k-means` 方法。 |

    | 密度聚类 | 用于确定数据集中分布的区域。主要的密度聚类模型是 `DBSCAN` 方法。 |

    | 分布聚类 | 基于某种分布识别数据点属于某个聚类的概率。主要的分布聚类方法是 `高斯混合` 方法。 |


    ### 探索降维


    降维方法有助于确定因子或成分在多大程度上解释了数据中的相关变化。表 1-4 概述了主要的降维方法。


    表 1-4


    主要降维方法


    | 技术 | 描述 |

    | --- | --- |

    | 因子分析 | 用于确定因子在多大程度上解释了数据中特征的相关变化。 |

    | 主成分分析 | 用于确定因子在多大程度上解释了数据中特征的相关变化。 |


    ## 探索深度学习


    深度学习是机器学习的延伸，它利用人工神经网络来解决复杂问题。你可以使用深度学习来发现大数据中的模式。深度学习使用人工神经网络来发现复杂数据中的模式。这些网络采用类似于动物的方法，即从环境接收输入数据的神经元（节点）扫描输入，并将其传递给后续层中的神经元，最终得出某种输出（即理解数据中的复杂性）。根据具体情境，有几种人工神经网络可用于确定某种现象的行为模式。表
    1-5 重点介绍了主要的神经网络。


    表 1-5


    不同的神经网络


    | 网络 | 描述 |

    | --- | --- |

    | 受限玻尔兹曼机 (RBM) | 最常见的神经网络，仅包含隐藏层和可见层。 |

    | 多层感知器 (MLP) | 一种神经网络，通过增加输入层、隐藏层和输出层来扩展受限玻尔兹曼机。 |

    | 循环神经网络 (RNN) | 用作序列建模器。 |

    | 卷积神经网络 (CNN) | 用作降维器和分类器。 |


    ## 本章小结


    本章介绍了机器学习的两种方式——监督式学习和无监督学习。首先解释了监督式机器学习，并讨论了三种监督式学习方法及其应用。然后介绍了无监督学习技术、降维和聚类分析。


    # 2. 大数据、机器学习与深度学习框架


    本章将详细介绍用于并行数据处理的大数据框架——`Apache Spark`。同时，还将介绍几个有助于构建可扩展应用的机器学习（ML）和深度学习（DL）框架。阅读本章后，你将了解如何使用具有弹性和容错性的技术来收集、操作和检查大数据。本章讨论了
    `Scikit-Learn`、`Spark MLlib` 和 `XGBoost` 框架，还介绍了一个名为 `Keras` 的深度学习框架。最后，讨论了有效设置和管理这些框架的方法。


    大数据框架支持并行数据处理。它们使你能够将大数据分布在多个集群中。最流行的大数据框架是 `Apache Spark`，它构建在 `Hadoop` 框架之上。


    ## 大数据


    大数据对不同的人有不同的含义。在本书中，我们将大数据定义为使用经典方法无法充分处理和操作的大量数据。我们必须使用可扩展的框架和现代技术来处理这些数据并从中获取洞察。当数据无法容纳在当前的内存存储空间中时，我们通常认为数据是“大”的。例如，如果你有一台个人电脑，而手头的数据量超过了电脑的存储容量，这就是大数据。这同样适用于拥有大型存储集群的大型企业。当我们使用
    `Hadoop/Spark` 技术栈时，我们经常会谈论大数据。


    ### 大数据的特征


    大数据的特征被描述为四个 V——速度（Velocity）、体量（Volume）、多样性（Variety）和真实性（Veracity）。表 2-1 重点介绍了大数据的这些特征。


    表 2-1


    大数据特征


    | 要素 | 描述 |

    | --- | --- |

    | 速度 | 现代技术和改进的连接性使你能够以前所未有的速度生成数据。速度的特征包括批量数据、近实时或实时数据以及数据流。 |

    | 体量 | 数据增长的规模。数据源和基础设施的性质会影响数据的体量。体量的特征包括艾字节、泽字节等。 |

    | 多样性 | 数据可能来自独特的来源。现代技术设备到处留下数字足迹，这增加了企业和个人获取数据的来源数量。多样性的特征包括数据的结构和复杂性。 |

    | 真实性 | 数据必须来自可靠的来源。同时，数据必须高质量、一致且完整。 |


    ## 大数据对商业和人们的影响


    毫无疑问，大数据影响着我们的思维方式和商业运作方式。数据驱动的组织通常为基于证据的管理奠定基础。大数据涉及使用定量方法衡量业务的关键方面。它有助于支持决策。接下来的部分将讨论大数据影响企业和人们的方式。

