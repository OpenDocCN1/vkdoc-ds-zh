  raw: '## Exploring the K-Means Method


    The k-means method is the most common distance-computing method. It is part of
    the unsupervised machine learning family. It employs the Euclidean distance objective
    function to efficiently compute the distance between values, then determines the
    centers and draws values adjacent to the centers to establish clusters.


    Compared to other cluster methods (i.e., spatial cluster methods, birch, and agglomerative),
    this method requires you to stipulate the number of k before training. This chapter
    uses the *elbow curve* *,* which discloses fluctuations in the linear altered
    vectors to determine the number of *k*. This chapter executes the method to group
    customers in clusters based on specific characteristics (i.e., age, remuneration,
    and spending habits).


    Listing [8-1](#517508_1_En_8_Chapter.xhtml#PC1) attains the necessary data from
    a Microsoft CSV file.


