    # 6. Tree Modeling and Gradient Boosting with Scikit-Learn, XGBoost, PySpark,
    and H2O


    This chapter executes and appraises a tree-based method (the decision tree method)
    and an ensemble method (the gradient boosting trees method) using a diverse set
    of comprehensive Python frameworks (i.e., Scikit-Learn, XGBoost, PySpark, and
    H2O). To begin, the chapter clarifies how decision trees compute the probabilities
    of classes.


    ## Decision Trees


    The *decision tree* is an elementary, non-parametric method suitable for linear
    and nonlinear modeling. It executes decision rules and develops a tree-like structure
    that divides values into varying groups with the least depth (see a Figure [6-1](#517508_1_En_6_Chapter.xhtml#Fig1)).


    ![../images/517508_1_En_6_Chapter/517508_1_En_6_Fig1_HTML.jpg](images/517508_1_En_6_Chapter/517508_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Decision tree


    ## Preprocessing Features


    This chapter manipulates the data from Chapter [5](#517508_1_En_5_Chapter.xhtml),
    so it does not sequentially cover the preprocessing tasks. Listing [6-1](#517508_1_En_6_Chapter.xhtml#PC1)
    executes all the preprocessing tasks.


    ```

    from sklearn.tree import DecisionTreeClassifier

    import numpy as np

    import pandas as pd

    from sklearn.preprocessing import StandardScaler

    from sklearn.model_selection import train_test_split

    df = pd.read_csv(r"filepath\banking.csv")

    drop_column_names = df.columns[[8, 9, 10]]

    initial_data = df.drop(drop_column_names, axis="columns")

    initial_data.iloc[::, 1] = pd.get_dummies(initial_data.iloc[::, 1])

    initial_data.iloc[::, 2] = pd.get_dummies(initial_data.iloc[::, 2])

    initial_data.iloc[::, 3] = pd.get_dummies(initial_data.iloc[::, 3])

    initial_data.iloc[::, 4] = pd.get_dummies(initial_data.iloc[::, 4])

    initial_data.iloc[::, 5] = pd.get_dummies(initial_data.iloc[::, 5])

    initial_data.iloc[::, 6] = pd.get_dummies(initial_data.iloc[::, 6])

    initial_data.iloc[::, 7] = pd.get_dummies(initial_data.iloc[::, 7])

    initial_data.iloc[::, 11] = pd.get_dummies(initial_data.iloc[::, 11])

    initial_data = initial_data.dropna()

    x = np.array(initial_data.iloc[::, 0:17])

    y = np.array(initial_data.iloc[::, -1])

    x_train, x_test, y_train, y_test = train_test_split(x, y, test_size=0.2, random_state=0)

    sk_standard_scaler = StandardScaler()

    sk_standard_scaled_x_train = sk_standard_scaler.fit_transform(x_train)

    sk_standard_scaled_x_test = sk_standard_scaler.transform(x_test)

    Listing 6-1

    Preprocess Features

    ```'
