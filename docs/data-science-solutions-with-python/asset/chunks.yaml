    This section executes the principal component method using the PySpark framework.


    Listing [9-7](#517508_1_En_9_Chapter.xhtml#PC7) prepares the PySpark framework
    using the `findspark` framework.


    ```

    import findspark as initiate_pyspark

    initiate_pyspark.init("filepath\spark-3.0.0-bin-hadoop2.7")

    Listing 9-7

    Prepare the PySpark Framework

    ```


    Listing [9-8](#517508_1_En_9_Chapter.xhtml#PC8) stipulates the PySpark app using
    the `SparkConf()` method.


    ```

    from pyspark import SparkConf

    pyspark_configuration = SparkConf().setAppName("pyspark_principal_components_analysis").setMaster("local")

    Listing 9-8

    Stipulate the PySpark App

    ```


    Listing [9-9](#517508_1_En_9_Chapter.xhtml#PC9) prepares the PySpark session using
    the `SparkSession()` method.


    ```

    from pyspark.sql import SparkSession

    pyspark_session = SparkSession(pyspark_context)

    from pyspark.sql import SparkSession

    Listing 9-9

    Prepare the Spark Session

    ```


    Listing [9-10](#517508_1_En_9_Chapter.xhtml#PC10) changes the `pandas` dataframe
    created earlier in this chapter to a `PySpark` dataframe using the `createDataFrame()`
    method.


    ```

    pyspark_initial_data = pyspark_session.createDataFrame(initial_data)

    Listing 9-10

    Change the Pandas Dataframe to a PySpark Dataframe

    ```


    Listing [9-11](#517508_1_En_9_Chapter.xhtml#PC11) creates a list for the independent
    features and a string for the dependent feature. It then converts the data using
    the `VectorAssembler()` method for modeling with the PySpark framework.


    ```

    x_list = list(initial_data.iloc[::, 0:3].columns)

    from pyspark.ml.feature import VectorAssembler

    pyspark_data_columns = x_list

    pyspark_vector_assembler = VectorAssembler(inputCols=pyspark_data_columns, outputCol="variables")

    pyspark_data = pyspark_vector_assembler.transform(pyspark_initial_data)

    Listing 9-11

    Transform the Data

    ```


    Listing [9-12](#517508_1_En_9_Chapter.xhtml#PC12) scales the whole data set with
    the Lifeline PySpark framework.


    ```

    from pyspark.ml.feature import StandardScaler

    pyspark_standard_scaler = StandardScaler(inputCol = pyspark_data.columns[-1],
    outputCol = "pyspark_scaled_features", withMean = True, withStd = True).fit(pyspark_data)

    pyspark_data_scaled_data = pyspark_standard_scaler.transform(pyspark_data)

    Listing 9-12

    Scale the Whole Data Set with the Lifeline PySpark Framework

    ```


    Listing [9-13](#517508_1_En_9_Chapter.xhtml#PC13) executes the PySpark principal
    component method.


    ```

    from pyspark.ml.feature import PCA

    number_of_k = 3

    pyspark_principal_components_method = PCA(k = number_of_k, inputCol = pyspark_data_scaled_data.columns[-1],
    outputCol = "pca_reduced_features").fit(pyspark_data_scaled_data)

    pyspark_principal_components_method_data = pyspark_principal_components_method.transform(pyspark_data_scaled_data)

    Listing 9-13

    Execute the PySpark Principal Component Method

    ```


    Listing [9-14](#517508_1_En_9_Chapter.xhtml#PC14) discloses the variance that
    each component clarifies (see Figure [9-3](#517508_1_En_9_Chapter.xhtml#Fig3)).


    ![../images/517508_1_En_9_Chapter/517508_1_En_9_Fig3_HTML.jpg](images/517508_1_En_9_Chapter/517508_1_En_9_Fig3_HTML.jpg)


    Figure 9-3


    Explained variance from the PySpark principal components method


    ```

    pyspark_principal_component_method_variance = pyspark_principal_components_method.explainedVariance.toArray()

    plt.bar(range(3), pyspark_principal_component_method_variance, label="Variance")

    plt.legend()

    plt.ylabel("Variance ratio")

    plt.xlabel("Components")

    plt.show()

    Listing 9-14

    Arrange the PySpark Principal Components Method’s Explained Variance

    ```


    Listing [9-15](#517508_1_En_9_Chapter.xhtml#PC15) prints the variance that the
    PySpark principal component method reveals.


    ```

    print(''Explained variance ratio'', pyspark_principal_components_method.explainedVariance.toArray())

    PySpark PCA variance ratio [0.44266167 0.33308378 0.22425454]

    Listing 9-15

    Print the Variance that the PySpark Principal Component Method Reveals

    ```


    The results show that the first component discloses 0.44 of the related changes
    in features in the data, the second component discloses 0.33, and the third component
    discloses 0.22.


    Listing [9-16](#517508_1_En_9_Chapter.xhtml#PC16) reduces the data using the PySpark
    principal component method.


    ```

    pyspark_principal_components_method_reduced_data = pyspark_principal_components_method_data.rdd.map(lambda
    row: row.pyspark_scaled_features).collect()

    pyspark_principal_components_method_reduced_data = np.array(pyspark_principal_components_method_reduced_data)

    Listing 9-16

    Reduce the Data with the PySpark Principal Component Method

    ```


    Listing [9-17](#517508_1_En_9_Chapter.xhtml#PC17) discloses the data that the
    PySpark principal component method reduced (see Figure [9-4](#517508_1_En_9_Chapter.xhtml#Fig4)).


    ![../images/517508_1_En_9_Chapter/517508_1_En_9_Fig4_HTML.jpg](images/517508_1_En_9_Chapter/517508_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Dimensions from the PySpark principal component method


    ```

    plt.scatter(pyspark_principal_components_method_reduced_data[:,0], pyspark_principal_components_method_reduced_data[:,1],
    c=initial_data.iloc[::, -1], cmap = "coolwarm")

    plt.xlabel("y")

    plt.show()

    Listing 9-17

    Disclose the Data that the PySpark Principal Component Method Reduced

    ```


    Figure [9-4](#517508_1_En_9_Chapter.xhtml#Fig4) shows the dimensions found by
    the PySpark principal component method.


    ## H2O in Action


    This section executes and assesses the principal component method using the H2O
    framework.


    Listing [9-18](#517508_1_En_9_Chapter.xhtml#PC18) prepares the H2O framework.


    ```

    import h2o as initialize_h2o

    initialize_h2o.init()

    Listing 9-18

    Prepare the H2O Framework

    ```


    Listing [9-19](#517508_1_En_9_Chapter.xhtml#PC19) changes the `pandas` dataframe
    to an H2O dataframe.


    ```

    h2o_data = initialize_h2o.H2OFrame(initial_data)

    Listing 9-19

    Change the Pandas Dataframe to an H2O Dataframe

    ```


    Listing [9-20](#517508_1_En_9_Chapter.xhtml#PC20) randomly divides the dataframe.


    ```

    h2o_training_data, h2o_validation_data = h2o_data.split_frame(ratios=[.8])

    Listing 9-20

    Randomly Divide the Dataframe

    ```


    Listing [9-21](#517508_1_En_9_Chapter.xhtml#PC21) executes the H2O principal component
    method.


    ```

    from h2o.estimators import H2OPrincipalComponentAnalysisEstimator

    h2o_principal_components_method = H2OPrincipalComponentAnalysisEstimator(k = 3,
    transform = "standardize")

    h2o_principal_components_method.train(training_frame = h2o_training_data)

    Listing 9-21

    Execute the H2O Principal Component Method

    ```


    Listing [9-22](#517508_1_En_9_Chapter.xhtml#PC22) reduces the data with the H2O
    principal component method.


    ```

    h2o_yhat = h2o_principal_components_method.predict(h2o_validation_data)

    Listing 9-22

    Reduce the Data with the H2O Principal Component Method

    ```


    ## Conclusion


    This chapter executed three key machine learning frameworks (Scikit-Learn, PySpark,
    and H2O) in order to condense data into a few dimensions by employing the principal
    component method. As mentioned at the beginning of this chapter, the chapter did
    not execute the method to test plausible hypotheses, thus there are no key metrics
    for objectively assessing the method.


    # Automating the Machine Learning Process with H2O


    This is a short yet insightful chapter that concludes the book by explaining a
    straightforward approach to automating machine learning processes with the help
    of a widespread machine learning framework, known as H2O.'
