    # Scikit-Learn


    `Scikit-Learn` 框架包含回归、分类和聚类等机器学习算法。你可以将其与 `NumPy` 和 `SciPy` 等其他框架一起使用。它可以执行机器学习项目所需的大部分任务，例如数据处理、转换、数据拆分、归一化、超参数优化、模型开发和评估。`Scikit-Learn`
    随大多数支持 Python 的发行包一起提供。在你的 Python 环境中使用 `pip install sklearn` 进行安装。


    # H2O


    `H2O` 是一个使用无人驾驶技术的机器学习框架。它使你能够加速 AI 解决方案的采用。它非常易于使用，并且不需要任何技术专业知识。不仅如此，它还支持数值和分类数据，包括文本。在训练机器学习模型之前，你必须先将数据加载到
    `H2O` 集群中。它支持 CSV、Excel 和 Parquet 文件。默认数据源包括本地文件系统、远程文件、Amazon S3、HDFS 等。它拥有回归、分类、聚类分析和降维等机器学习算法。它还可以执行机器学习项目所需的大部分任务，例如数据处理、转换、数据拆分、归一化、超参数优化、模型开发、检查点、评估和生产化。在你的环境中使用
    `pip install h2o` 安装该包。


    清单 2-4 准备了 `H2O` 框架。


    ```

    import h2o

    h2o.init()

    清单 2-4

    初始化 H2O 框架

    ```


    # XGBoost


    `XGBoost` 是一个支持包括 Python 在内的编程语言的机器学习框架。它执行可扩展的梯度提升模型，并快速学习并行和分布式计算，而不会牺牲内存效率。不仅如此，它还是一个集成学习器。如第
    a 章所述，集成学习器可以解决回归和分类问题。`XGBoost` 使用提升方法从前序树的错误中学习。当基于树的模型过拟合时，它非常有用。在你的 Python
    环境中使用 `pip install xgboost` 安装该模型。


    # 深度学习框架


    深度学习框架提供了支持扩展人工神经网络的结构。你可以单独使用它，也可以与其他模型一起使用。它通常包含程序和代码框架。主要的深度学习框架包括 `TensorFlow`、`PyTorch`、`Deeplearning4j`、`Microsoft
    Cognitive Toolkit` (`CNTK`) 和 `Keras`。


    ## Keras


    `Keras` 是一个使用 Python 编写的高级深度学习框架；它运行在名为 `TensorFlow` 的机器学习平台之上。它对于深度学习模型的快速原型设计非常有效。你可以在张量处理单元或大规模图形处理单元上运行
    `Keras`。主要的 `Keras` API 包括模型、层和回调。第 7 章将介绍此框架。执行 `pip install Keras` 和 `pip install
    tensorflow` 来使用 `Keras` 框架。


    # 3. 使用 Scikit-Learn、PySpark 和 H2O 进行线性建模


    本章介绍普通最小二乘法，并使用主要的 Python 框架（即 `Scikit-Learn`、`Spark MLlib` 和 `H2O`）执行该方法。首先解释该方法背后的基本概念。


    ## 探索普通最小二乘法


    普通最小二乘法用于具有不受限制（连续）输出特征的数据。此方法要求正态性和线性，并且误差项（也称为*残差*）中不能存在自相关，也不能存在多重共线性。它也非常容易受到数据异常的影响，因此如果此方法效果不佳，你可能希望使用替代方法，例如
    `Ridge`、`Lasso` 和 `Elastic Net`。


