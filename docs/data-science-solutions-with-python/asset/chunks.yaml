    ### Deep Belief Networks


    Deep belief networks transcend the multilayer perceptron neural network by including
    hidden layers. The network must model the data repetitively before generating
    an output value.


    ### H2O in Action


    This section executes a deep belief neural network using the H2O framework.


    Listing [7-15](#517508_1_En_7_Chapter.xhtml#PC15) prepares the H2O framework.


