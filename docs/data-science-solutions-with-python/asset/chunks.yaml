    Gradient boosting methods inherit values of input features and then execute countless
    tree models to halt the loss function (i.e., the mean absolute error for linear
    modeling). It does this by assimilating weak models, then incrementally and iteratively
    models weighing data, diligently accompanied by an election of a weak model with
    the best performance.'
