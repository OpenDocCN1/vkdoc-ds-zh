    # 8. 使用 Scikit-Learn、PySpark 和 H2O 进行聚类分析


    本章通过实现一组多样化的 Python 框架（即 Scikit-Learn、PySpark 和 H2O）来解释 *k-means* 聚类方法。首先，它阐明了该方法如何将值分配到聚类中。

    '
- fmt: '# Exploring the K-Means Method


    The `k-means` method is the most common distance-computing method. It is part
    of the unsupervised machine learning family. It employs the Euclidean distance
    objective function to efficiently compute the distance between values, then determines
    the centers and draws values adjacent to the centers to establish clusters.


    Compared to other cluster methods (i.e., spatial cluster methods, `birch`, and
    `agglomerative`), this method requires you to stipulate the number of `k` before
    training. This chapter uses the *elbow curve*, which discloses fluctuations in
    the linear altered vectors to determine the number of `k`. This chapter executes
    the method to group customers in clusters based on specific characteristics (i.e.,
    age, remuneration, and spending habits).


    Listing [8-1](#517508_1_En_8_Chapter.xhtml#PC1) attains the necessary data from
    a Microsoft CSV file.


    ```

    import pandas as pd

    df = pd.read_csv(r"filepath\Mall_Customers.csv")

    Listing 8-1

    Attain the Data

    ```


    Listing [8-2](#517508_1_En_8_Chapter.xhtml#PC2) drops the unnecessary features
    in the data.


    ```

    drop_column_names = df.columns[[0, 1]]

    initial_data = df.drop(drop_column_names, axis="columns")

    Listing 8-2

    Drop Unnecessary Features

    ```


    Listing [8-3](#517508_1_En_8_Chapter.xhtml#PC3) scales the data with a standard
    scaler.


    ```

    from sklearn.preprocessing import StandardScaler

    sk_standard_scaler = StandardScaler()

    sk_standard_scaled_data = sk_standard_scaler.fit_transform(initial_data)

    Listing 8-3

    Scale the Data

    ```


    Listing [8-4](#517508_1_En_8_Chapter.xhtml#PC4) executes the principal component
    method using the Scikit-Learn framework.


    ```

    from sklearn.decomposition import PCA

    sk_principal_component_method = PCA(n_components=3)

    sk_principal_component_method.fit(sk_standard_scaled_data)

    sk_principal_component_method_transformed_data = sk_principal_component_method.transform(sk_standard_scaled_data)

    Listing 8-4

    Execute the Principal Component Method with the Scikit-Learn Framework

    ```


    Listing [8-5](#517508_1_En_8_Chapter.xhtml#PC5) discloses the number of `k` using
    an elbow curve (see Figure [8-1](#517508_1_En_8_Chapter.xhtml#Fig1)).


    ![../images/517508_1_En_8_Chapter/517508_1_En_8_Fig1_HTML.jpg](images/517508_1_En_8_Chapter/517508_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Disclose the number of k using an elbow curve


    ```

    from sklearn.cluster import KMeans

    import matplotlib.pyplot as plt

    %matplotlib inline

    elbow_range = range(1, 15)

    sk_kmeans_method = [KMeans(n_clusters=x) for x in elbow_range]

    sk_kmeans_method_score = [sk_kmeans_method[x].fit(sk_principal_component_method_transformed_data).score(sk_principal_component_method_transformed_data)
    for x in range(len(sk_kmeans_method))]

    plt.plot(elbow_range, sk_kmeans_method_score)

    plt.xlabel("Number of k")

    plt.ylabel("Eigenvalues")

    plt.show()

    Listing 8-5

    Disclose the Number of K Using an Elbow Curve

    ```


    Figure [8-1](#517508_1_En_8_Chapter.xhtml#Fig1) shows that the curve abruptly
    twists, which indicates that the `k-means` method must contain three components.


    ## Scikit-Learn in Action


    This section executes the `k-means` method using the Scikit-Learn framework; see
    Listing [8-6](#517508_1_En_8_Chapter.xhtml#PC6).


    ```

    sk_kmeans_method = KMeans(n_clusters=3)

    sk_kmeans_method_fitted = sk_kmeans_method.fit(sk_standard_scaled_data)

    Listing 8-6

