- fmt: '# Scikit-Learn


    The `Scikit-Learn` framework includes ML algorithms like regression, classification,
    and clustering, among others. You can use it with other frameworks such as `NumPy`
    and `SciPy`. It can perform most of the tasks required for ML projects like data
    processing, transformation, data splitting, normalization, hyperparameter optimization,
    model development, and evaluation. `Scikit-Learn` comes with most distribution
    packages that support Python. Use `pip install sklearn` to install it in your
    Python environment.


    # H2O


    `H2O` is an ML framework that uses a driverless technology. It enables you to
    accelerate the adoption of AI solutions. It is very easy to use, and it does not
    require any technical expertise. Not only that, but it supports numerical and
    categorical data, including text. Before you train the ML model, you must first
    load the data into the `H2O` cluster. It supports CSV, Excel, and Parquet files.
    Default data sources include local file systems, remote files, Amazon S3, HDFS,
    etc. It has ML algorithms like regression, classification, cluster analysis, and
    dimension reduction. It can also perform most tasks required for ML projects like
    data processing, transformation, data splitting, normalization, hyperparameter
    optimization, model development, checking pointing, evaluation, and productionizing.
    Use `pip install h2o` to install the package in your environment.


    Listing [2-4](#517508_1_En_2_Chapter.xhtml#PC4) prepares the `H2O` framework.


    ```

    import h2o

    h2o.init()

    Listing 2-4

    Initializing the H2O Framework

    ```


    # XGBoost


    `XGBoost` is an ML framework that supports programming languages, including Python.
    It executes gradient-boosted models that are scalable, and learns fast parallel
    and distributed computing without sacrificing memory efficiency. Not only that,
    but it is an ensemble learner. As mentioned in Chapter a, ensemble learners can
    solve both regression and classification problems. `XGBoost` uses boosting to
    learn from the errors committed in the preceding trees. It is useful when tree-based
    models are overfitted. Use `pip install xgboost` to install the model in your
    Python environment.


    # DL Frameworks


    DL frameworks provide a structure that supports scaling artificial neural networks.
    You can use it stand-alone or with other models. It typically includes programs
    and code frameworks. Primary DL frameworks include `TensorFlow`, `PyTorch`, `Deeplearning4j`,
    `Microsoft Cognitive Toolkit` (`CNTK`), and `Keras`.


    ## Keras


    `Keras` is a high-level DL framework written using Python; it runs on top of an
    ML platform known as `TensorFlow`. It is effective for rapid prototyping of DL
    models. You can run `Keras` on Tensor Processing Units or on massive Graphic Processing
    Units. The main `Keras` APIs include models, layers, and callbacks. Chapter [7](#517508_1_En_7_Chapter.xhtml)
    covers this framework. Execute `pip install Keras` and `pip install tensorflow`
    to use the `Keras` framework.


    # 3. Linear Modeling with Scikit-Learn, PySpark, and H2O


    This introductory chapter explains the ordinary least-squares method and executes
    it with the main Python frameworks (i.e., `Scikit-Learn`, `Spark MLlib`, and `H2O`).
    It begins by explaining the underlying concept behind the method.


    ## Exploring the Ordinary Least-Squares Method


    The ordinary least-squares method is used with data that has an output feature
    that is not confined (it’s continuous). This method expects normality and linearity,
    and there must be an absence of autocorrelation in the error of terms (also called
    *residuals*) and multicollinearity. It is also highly prone to abnormalities in
    the data, so you might want to use alternative methods like `Ridge`, `Lasso`,
    and `Elastic Net` if this method does not serve you well.


    Listing [3-1](#517508_1_En_3_Chapter.xhtml#PC1) attains the necessary data from
    a Microsoft CSV file.


    ```

    import pandas as pd

    df = pd.read_csv(r"filepath\WA_Fn-UseC_-Marketing_Customer_Value_Analysis.csv")

    Listing 3-1

    Attain the Data

    ```


    Listing [3-2](#517508_1_En_3_Chapter.xhtml#PC2) stipulates the names of columns
    to drop and then executes the `drop()` method. It then stipulates axes as `columns`
    in order to drop the unnecessary columns in the data.


    ```

    drop_column_names = df.columns[[0, 6]]

    initial_data = df.drop(drop_column_names, axis="columns")

    Listing 3-2

    Drop Unnecessary Features in the Data

    ```


    Listing [3-3](#517508_1_En_3_Chapter.xhtml#PC3) attains the dummy values for the
    categorical features in this data.


    ```

    initial_data.iloc[::, 0] = pd.get_dummies(initial_data.iloc[::, 0])

    initial_data.iloc[::, 2] = pd.get_dummies(initial_data.iloc[::, 2])

    initial_data.iloc[::, 3] = pd.get_dummies(initial_data.iloc[::, 3])

    initial_data.iloc[::, 4] = pd.get_dummies(initial_data.iloc[::, 4])

    initial_data.iloc[::, 5] = pd.get_dummies(initial_data.iloc[::, 5])

    initial_data.iloc[::, 6] = pd.get_dummies(initial_data.iloc[::, 6])

    initial_data.iloc[::, 7] = pd.get_dummies(initial_data.iloc[::, 7])

    initial_data.iloc[::, 8] = pd.get_dummies(initial_data.iloc[::, 8])

    initial_data.iloc[::, 9] = pd.get_dummies(initial_data.iloc[::, 9])

    initial_data.iloc[::, 15] = pd.get_dummies(initial_data.iloc[::, 15])

    initial_data.iloc[::, 16] = pd.get_dummies(initial_data.iloc[::, 16])

    initial_data.iloc[::, 17] = pd.get_dummies(initial_data.iloc[::, 17])

    initial_data.iloc[::, 18] = pd.get_dummies(initial_data.iloc[::, 18])

    initial_data.iloc[::, 20] = pd.get_dummies(initial_data.iloc[::, 20])

    initial_data.iloc[::, 21] = pd.get_dummies(initial_data.iloc[::, 21])

    Listing 3-3

    Attain Dummy Features

    ```


    Listing [3-4](#517508_1_En_3_Chapter.xhtml#PC4) outlines the independent and dependent
    features.


    ```

    import numpy as np

    int_x = initial_data.iloc[::,0:19]

    fin_x = initial_data.iloc[::,19:21]

    x_combined = pd.concat([int_x, fin_x], axis=1)

    x = np.array(x_combined)

    y = np.array(initial_data.iloc[::,19])

    Listing 3-4

    Outline the Features

    ```'
