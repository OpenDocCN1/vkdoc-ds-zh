    ## 结论


    本章通过执行三个关键的机器学习框架（Scikit-Learn、PySpark 和 H2O），运用主成分方法将数据压缩到少数几个维度。正如本章开头所述，本章并未执行该方法来检验可能的假设，因此没有用于客观评估该方法的关键指标。


