    # 探索 K-Means 方法


    `k-means` 方法是最常见的距离计算方法，属于无监督机器学习家族。它采用欧几里得距离目标函数来高效计算数值间的距离，然后确定中心点，并将中心点附近的数值归集起来，从而建立聚类。


    与其他聚类方法（例如空间聚类方法、`birch` 和 `agglomerative`）相比，该方法要求你在训练前指定 `k` 的数值。本章使用*肘部曲线*，该曲线揭示了线性变化向量的波动情况，用以确定
