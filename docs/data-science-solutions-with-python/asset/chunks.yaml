    cv=3, n_jobs=-5, train_sizes=np.linspace(0.1,1.0,50))

    trainscoresk_decision_tree_method_mean = np.mean(trainscore_sk_decision_tree_method,
    axis=1)

    testscoresk_decision_tree_method_mean = np.mean(testscore_sk_decision_tree_method,
    axis=1)

    plt.plot(train_port_sk_decision_tree_method, trainscoresk_decision_tree_method_mean,
    label="加权训练准确率")

    plt.plot(train_port_sk_decision_tree_method, testscoresk_decision_tree_method_mean,
    label="加权交叉验证准确率得分")

    plt.xlabel("训练值")

    plt.ylabel("加权准确率得分")

    plt.legend(loc="best")

