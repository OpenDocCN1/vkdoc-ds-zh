    # 7. Neural Networks with Scikit-Learn, Keras, and H2O


    This chapter executes and assesses nonlinear neural networks to address binary
    classification using a diverse set of comprehensive Python frameworks (i.e., Scikit-Learn,
    Keras, and H2O).


    ## Exploring Deep Learning


    Deep learning methods transcend machine learning methods. They handle considerable
    complexity in models and methods by including extensive hidden layers. Machine
    learning methods typically resemble an input-output system, where an objective
    function accepts input values and transforms them with an objective function to
    produce values. Deep learning broadens the processing activities by including
    many layers that include nodes that repetitively and iteratively process data.
    The widespread recognition of deep learning relates to its customizability; it
    enable developers to customize methods based on preferences.


    ## Multilayer Perceptron Neural Network


    As the name suggests, a multilayer perceptron neural network contains multiple
    layers. Moreover, the fundamental structure remains the same; there has to be
    one layer for receiving input values and one layer for generating output values.
    Layers that model the data to distribute differing weights and biases are treated
    as hidden layers.


