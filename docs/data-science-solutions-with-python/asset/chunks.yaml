- fmt: '### Exploring Nonlinear Models


    Nonlinear (classification) methods differentiate classes (also called categories
    or labels)—see Table [1-2](#517508_1_En_1_Chapter.xhtml#Tab2). When there are
    two classes in the dependent feature, you’ll implement binary classification methods.
    When there are more than two classes, you’ll implement multiclass classification
    methods. There are innumerable functions for classification, including `sigmoid`,
    `tangent hyperbolic`, and `kernel`, among others. Their application depends on
    the context. Subsequent chapters will cover some of these functions.


    Table 1-2


    Varying Nonlinear Models


    | Model | Description |

    | --- | --- |

    | Binary classification method | Applied when the categorical feature has only
    two possible outcomes. The popular binary classifier is the logistic regression
    model. |

    | Multiclass classification method | Applied when the categorical feature has
    more than two possible outcomes. The main multi-class classifier is the Linear
    Discriminant Analysis model (which can also be used for dimension reduction).
    |

    | Survival classification | Applied when you’re computing the probabilities of
    an event occurring using a categorical feature. |


    ### Exploring Ensemble Methods


    Ensemble methods enable you to uncover linearity and nonlinearity. The main ensembler
    is the random forest trees, which is often computationally demanding. In addition,
    its performance depends on a variety of factors like the depth, iterations, data
    splitting, and boosting.


    ## Exploring Unsupervised Methods


    In contrast to supervised machine learning, unsupervised learning contains no
    ground truth. You expose the model to all the sample data, allowing it to guess
    about the pattern of the data. The most common unsupervised methods are cluster-related
    methods.


    ### Exploring Cluster Methods


    Cluster methods are convenient for assembling common values in the data; they
    enable you to uncover patterns in both structured and unstructured data. Table
    [1-3](#517508_1_En_1_Chapter.xhtml#Tab3) highlights a few cluster methods that
    you can use to guess the pattern of the data.


    Table 1-3


    Varying Cluster Models


    | Techniques | Description |

    | --- | --- |

    | Centroid clustering | Applied to determine the center of the data and draw data
    points toward the center. The main centroid clustering method is the `k-means`
    method. |

    | Density clustering | Applied to determine where the data is concentrated. The
    main density clustering model is the `DBSCAN` method. |

    | Distribution clustering | Identifies the probability of data points belonging
    to a cluster based on some distribution. The main distribution clustering method
    is the `Gaussian Mixture` method. |


    ### Exploring Dimension Reduction


    Dimension reducers help determine the extent to which factors or components elucidate
    related changes in data. Table [1-4](#517508_1_En_1_Chapter.xhtml#Tab4) provides
    an overview of the chief dimension reducers.


    Table 1-4


    Main Dimension Reducers


    | Technique | Description |

    | --- | --- |

    | Factor analysis | Applied to determine the extent to which factors elucidate
    related changes of features in the data. |

    | Principal component analysis | Applied to determine the extent to which factors
    elucidate related changes of features in the data. |


    ## Exploring Deep Learning


    Deep learning extends machine learning in that it uses artificial neural networks
    to solve complex problems. You can use deep learning to discover patterns in big
    data. Deep learning uses artificial neural networks to discover patterns in complex
    data. The networks use an approach similar to that of animals, whereby neurons
    (nodes) that receive input data from the environment scan the input and pass it
    to neurons in successive layers to arrive at some output (which is understanding
    the complexity in the data). There are several artificial neural networks that
    you can use to determine patterns of behavior of a phenomenon, depending on the
    context. Table [1-5](#517508_1_En_1_Chapter.xhtml#Tab5) highlights the chief neural
    networks.


    Table 1-5


    Varying Neural Networks


    | Network | Description |

    | --- | --- |

    | Restricted Boltzmann Machine (RBM) | The most common neural network that contains
    only the hidden and visible layers. |

    | Multilayer Perceptron (MLP) | A neural network that prolongs a restricted Boltzmann
    machine with input, hidden and output layers. |

    | Recurrent Neural Network (RNN) | Serves as a sequential modeler. |

    | Convolutional Neural Network (CNN) | Serves as a dimension reducer and classifier.
    |


    ## Conclusion


    This chapter covered two ways in which machines learn—via supervised and unsupervised
    learning. It began by explaining supervised machine learning and discussing the
    three types of supervised learning methods and their applications. It then covered
    unsupervised learning techniques, dimension reduction, and cluster analysis.


    # 2. Big Data, Machine Learning, and Deep Learning Frameworks


    This chapter carefully presents the big data framework used for parallel data
    processing called `Apache Spark`. It also covers several machine learning (ML)
    and deep learning (DL) frameworks useful for building scalable applications. After
    reading this chapter, you will understand how big data is collected, manipulated,
    and examined using resilient and fault-tolerant technologies. It discusses the
    `Scikit-Learn`, `Spark MLlib`, and `XGBoost` frameworks. It also covers a deep
    learning framework called `Keras`. It concludes by discussing effective ways of
    setting up and managing these frameworks.


    Big data frameworks support parallel data processing. They enable you to contain
    big data across many clusters. The most popular big data framework is `Apache
    Spark`, which is built on the `Hadoop` framework.


    ## Big Data


    Big data means different things to different people. In this book, we define big
    data as large amounts of data that we cannot adequately handle and manipulate
    using classic methods. We must undoubtedly use scalable frameworks and modern
    technologies to process and draw insight from this data. We typically consider
    data “big” when it cannot fit within the current in-memory storage space. For
    instance, if you have a personal computer and the data at your disposal exceeds
    your computer’s storage capacity, it’s big data. This equally applies to large
    corporations with large clusters of storage space. We often speak about big data
    when we use a stack with `Hadoop/Spark`.


    ### Big Data Features


    The features of big data are described as the four Vs—velocity, volume, variety,
    and veracity. Table [2-1](#517508_1_En_2_Chapter.xhtml#Tab1) highlights these
    features of big data.


    Table 2-1


    Big Data Features


    | Element | Description |

    | --- | --- |

    | Velocity | Modern technologies and improved connectivity enable you to generate
    data at an unprecedented speed. Characteristics of velocity include batch data,
    near or real-time data, and streams. |

    | Volume | The scale at which data increases. The nature of data sources and infrastructure
    influence the volume of data. Characteristics of the volume include exabyte, zettabyte,
    etc. |

    | Variety | Data can come from unique sources. Modern technological devices leave
    digital footprints here and there, which increase the number of sources from which
    businesses and people can get data. Characteristics of variety include the structure
    and complexity of the data. |

    | Veracity | Data must come from reliable sources. Also, it must be of high quality,
    consistent, and complete. |


    ## Impact of Big Data on Business and People


    Without a doubt, big data affects the way we think and do business. Data-driven
    organizations typically establish the basis for evidence-based management. Big
    data involves measuring the key aspects of the business using quantitative methods.
    It helps support decision-making. The next sections discuss ways in which big
    data affects businesses and people.'
  raw: '### Exploring Nonlinear Models


    Nonlinear (classification) methods differentiate classes (also called categories
    or labels)—see Table [1-2](#517508_1_En_1_Chapter.xhtml#Tab2). When there are
    two classes in the dependent feature, you’ll implement binary classification methods.
    When there are more than two classes, you’ll implement multiclass classification
    methods. There are innumerable functions for classification, including sigmoid,
    tangent hyperbolic, and kernel, among others. Their application depends on the
    context. Subsequent chapters will cover some of these functions.


    Table 1-2


    Varying Nonlinear Models


    | Model | Description |

    | --- | --- |

    | Binary classification method | Applied when the categorical feature has only
    two possible outcomes. The popular binary classifier is the logistic regression
    model. |

    | Multiclass classification method | Applied when the categorical feature has
    more than two possible outcomes. The main multi-class classifier is the Linear
    Discriminant Analysis model (which can also be used for dimension reduction).
    |

    | Survival classification | Applied when you’re computing the probabilities of
    an event occurring using a categorical feature. |


    ### Exploring Ensemble Methods


    Ensemble methods enable you to uncover linearity and nonlinearity. The main ensembler
    is the random forest trees, which is often computationally demanding. In addition,
    its performance depends on a variety of factors like the depth, iterations, data
    splitting, and boosting.


    ## Exploring Unsupervised Methods


    In contrast to supervised machine learning, unsupervised learning contains no
    ground truth. You expose the model to all the sample data, allowing it to guess
    about the pattern of the data. The most common unsupervised methods are cluster-related
    methods.


    ### Exploring Cluster Methods


    Cluster methods are convenient for assembling common values in the data; they
    enable you to uncover patterns in both structured and unstructured data. Table
    [1-3](#517508_1_En_1_Chapter.xhtml#Tab3) highlights a few cluster methods that
    you can use to guess the pattern of the data.


    Table 1-3


    Varying Cluster Models


    | Techniques | Description |

    | --- | --- |

    | Centroid clustering | Applied to determine the center of the data and draw data
    points toward the center. The main centroid clustering method is the k-means method.
    |

    | Density clustering | Applied to determine where the data is concentrated. The
    main density clustering model is the DBSCAN method. |

    | Distribution clustering | Identifies the probability of data points belonging
    to a cluster based on some distribution. The main distribution clustering method
    is the Gaussian Mixture method. |


    ### Exploring Dimension Reduction


    Dimension reducers help determine the extent to which factors or components elucidate
    related changes in data. Table [1-4](#517508_1_En_1_Chapter.xhtml#Tab4) provides
    an overview of the chief dimension reducers.


    Table 1-4


    Main Dimension Reducers


    | Technique | Description |

    | --- | --- |

    | Factor analysis | Applied to determine the extent to which factors elucidate
    related changes of features in the data. |

    | Principal component analysis | Applied to determine the extent to which factors
    elucidate related changes of features in the data. |


    ## Exploring Deep Learning


    Deep learning extends machine learning in that it uses artificial neural networks
    to solve complex problems. You can use deep learning to discover patterns in big
    data. Deep learning uses artificial neural networks to discover patterns in complex
    data. The networks use an approach similar to that of animals, whereby neurons
    (nodes) that receive input data from the environment scan the input and pass it
    to neurons in successive layers to arrive at some output (which is understanding
    the complexity in the data). There are several artificial neural networks that
    you can use to determine patterns of behavior of a phenomenon, depending on the
    context. Table [1-5](#517508_1_En_1_Chapter.xhtml#Tab5) highlights the chief neural
    networks.


    Table 1-5


    Varying Neural Networks


    | Network | Description |

    | --- | --- |

    | Restricted Boltzmann Machine (RBM) | The most common neural network that contains
    only the hidden and visible layers. |

    | Multilayer Perceptron (MLP) | A neural network that prolongs a restricted Boltzmann
    machine with input, hidden and output layers. |

    | Recurrent Neural Network (RNN) | Serves as a sequential modeler. |

    | Convolutional Neural Network (CNN) | Serves as a dimension reducer and classifier.
    |


    ## Conclusion


    This chapter covered two ways in which machines learn—via supervised and unsupervised
    learning. It began by explaining supervised machine learning and discussing the
    three types of supervised learning methods and their applications. It then covered
    unsupervised learning techniques, dimension reduction, and cluster analysis.


    # 2. Big Data, Machine Learning, and Deep Learning Frameworks


    This chapter carefully presents the big data framework used for parallel data
    processing called Apache Spark. It also covers several machine learning (ML) and
    deep learning (DL) frameworks useful for building scalable applications. After
    reading this chapter, you will understand how big data is collected, manipulated,
    and examined using resilient and fault-tolerant technologies. It discusses the
    Scikit-Learn, Spark MLlib, and XGBoost frameworks. It also covers a deep learning
    framework called Keras. It concludes by discussing effective ways of setting up
    and managing these frameworks.


    Big data frameworks support parallel data processing. They enable you to contain
    big data across many clusters. The most popular big data framework is Apache Spark,
    which is built on the Hadoop framework.


    ## Big Data


    Big data means different things to different people. In this book, we define big
    data as large amounts of data that we cannot adequately handle and manipulate
    using classic methods. We must undoubtedly use scalable frameworks and modern
    technologies to process and draw insight from this data. We typically consider
    data “big” when it cannot fit within the current in-memory storage space. For
    instance, if you have a personal computer and the data at your disposal exceeds
    your computer’s storage capacity, it’s big data. This equally applies to large
    corporations with large clusters of storage space. We often speak about big data
    when we use a stack with Hadoop/Spark.


    ### Big Data Features


    The features of big data are described as the four Vs—velocity, volume, variety,
    and veracity. Table [2-1](#517508_1_En_2_Chapter.xhtml#Tab1) highlights these
    features of big data.


    Table 2-1


    Big Data Features


    | Element | Description |

    | --- | --- |

    | Velocity | Modern technologies and improved connectivity enable you to generate
    data at an unprecedented speed. Characteristics of velocity include batch data,
    near or real-time data, and streams. |

    | Volume | The scale at which data increases. The nature of data sources and infrastructure
    influence the volume of data. Characteristics of the volume include exabyte, zettabyte,
    etc. |

    | Variety | Data can come from unique sources. Modern technological devices leave
    digital footprints here and there, which increase the number of sources from which
    businesses and people can get data. Characteristics of variety include the structure
    and complexity of the data. |

    | Veracity | Data must come from reliable sources. Also, it must be of high quality,
    consistent, and complete. |


    ## Impact of Big Data on Business and People


    Without a doubt, big data affects the way we think and do business. Data-driven
    organizations typically establish the basis for evidence-based management. Big
    data involves measuring the key aspects of the business using quantitative methods.
    It helps support decision-making. The next sections discuss ways in which big
    data affects businesses and people.'
