    Listing [2-2](#517508_1_En_2_Chapter.xhtml#PC2) stipulates the PySpark app using
    the `SparkConf()` method.


    ```

    from pyspark import SparkConf

    pyspark_configuration = SparkConf().setAppName("pyspark_linear_method").setMaster("local")

    Listing 2-2

    Stipulate the PySpark App

    ```


    Listing [2-3](#517508_1_En_2_Chapter.xhtml#PC3) prepares the PySpark session with
    the `SparkSession()` method.


    ```

    from pyspark.sql import SparkSession

    pyspark_session = SparkSession(pyspark_context)

    Listing 2-3

    Prepare the Spark Session

    ```


    #### Spark Frameworks


    Spark frameworks extend the core of the Spark API. There are four main Spark frameworks—SparkSQL,
    Spark Streaming, Spark MLlib, and GraphX.


    ##### SparkSQL


    SparkSQL enables you to use relational query languages like SQL, HiveQL, and Scala.
    It includes a `schemaRDD` that has row objects and schema. You create it using
    an existing RDD, parquet file, or JSON data set. You execute the Spark Context
    to create a SQL context.


    ##### Spark Streaming


    Spark streaming is a scalable streaming framework that supports Apache Kafka,
    Apache Flume, HDFS, and Apache Kensis, etc. It processes input data using DStream
    in small batches you push using HDFS, databases, and dashboards. Recent versions
    of Python do not support Spark Streaming. Consequently, we do not cover the framework
    in this book. You can use a Spark Streaming application to read input from any
    data source and store a copy of the data in HDFS. This allows you to build and
    launch a Spark Streaming application that processes incoming data and runs an
    algorithm on it.


    ##### Spark MLlib


    MLlib is an ML framework that allows you to develop and test ML and DL models.
    In Python, the frameworks work hand-in-hand with the NumPy framework. Spark MLlib
    can be used with several Hadoop data sources and incorporated alongside Hadoop
    workflows. Common algorithms include regression, classification, clustering, collaborative
    filtering, and dimension reduction. Key workflow utilities include feature transformation,
    standardization and normalization, pipeline development, model evaluation, and
    hyperparameter optimization.


    ##### GraphX


    GraphX is a scalable and fault-tolerant framework for iterative and fast graph
    parallel computing, social networks, and language modeling. It includes graph
    algorithms such as PageRank for estimating the importance of each vertex in a
    graph, Connected Components for labeling connected components of the graph with
    the ID of its lowest-numbered vertex, and Triangle Counting for finding the number
    of triangles that pass through each vertex.


    ## ML Frameworks


    To solve ML problems, you need to have a framework that supports building and
    scaling ML models. There is no shortage of ML models – there are innumerable frameworks
    for ML. There are several ML frameworks that you can use. Subsequent chapters
    cover frameworks like Scikit-Learn, Spark MLlib, H2O, and XGBoost.'
  trans: '

    ### 优化客户关系


    来自大数据的洞察有助于管理客户关系。掌握客户大数据的企业可以研究客户的行为模式，并运用描述性分析来驱动客户管理策略。


    ### 精细化产品开发


    数据驱动型企业利用大数据分析和预测性分析来推动产品开发与管理策略。这种方法对于应用的增量迭代交付非常有用。


    ### 提升决策质量


    当企业拥有大数据时，可以利用它来揭示现象的复杂模式，从而影响战略制定。这种方法有助于管理层基于证据而非主观推理做出明智决策。数据驱动型企业会培养一种基于证据管理的文化。


    我们还在生命科学、物理学、经济学和医学等领域运用大数据。大数据影响世界的方式多种多样。本章并未考虑所有因素。接下来的章节将解释大数据仓库和 ETL 活动。


    ## 大数据仓库


    过去几十年里，企业在本地数据库中投入了大量资源，包括 Microsoft Access、Microsoft SQL Server、SAP Hana、Oracle
    Database 等。近年来，像 Microsoft Azure SQL 和 Oracle XE 这样的云数据库得到了广泛采用。此外，还有像 Cassandra
    和 HBase 等标准的大数据（分布式）数据库。企业正转向可扩展的基于云的数据库，以利用不断增强的计算能力、容错技术和可扩展解决方案带来的优势。


    ### 大数据 ETL


    尽管数据库管理取得了显著进步，但人们操作数据库数据的方式基本保持不变。提取、转换和加载（ETL）在分析和报告中仍然扮演着不可或缺的角色。表 2-2 讨论了
    ETL 活动。


    表 2-2


    ETL 活动


    | 活动 | 描述 |

    | --- | --- |

    | 提取 | 涉及从某个数据库中获取数据。 |

    | 转换 | 涉及将数据库中的数据转换为适合分析和报告的格式。 |

    | 加载 | 涉及将数据存储在数据库管理系统中。 |


    要执行 ETL 活动，必须使用查询语言。最流行的查询语言是 SQL（结构化查询语言）。随着开源运动的发展，还出现了其他查询语言，例如 HiveQL 和 BigQuery。Python
    编程语言支持 SQL。Python 框架可以通过实现诸如 `SQLAlchemy`、`pyodbc`、`SQLite`、`SparkSQL` 和 `pandas`
    等库来连接数据库。


    ## 大数据框架


    大数据框架使开发人员能够收集、管理和操作分布式数据。大多数开源大数据框架都使用内存集群计算。最流行的框架包括 Hadoop、Spark、Flink、Storm
    和 Samza。本书使用 PySpark 来执行 ETL 活动、探索数据以及构建机器学习流水线。


    ### Apache Spark


    Apache Spark 执行内存集群计算。它使开发人员能够使用 Java、Scala、Python、R 和 SQL 构建可扩展的应用程序。它包含诸如驱动程序、集群管理器和执行器之类的集群组件。你可以将其用作独立的集群管理器，或者部署在
    Mesos、Hadoop、YARN 或 Baronets 之上。你可以使用它来访问 Hadoop 文件系统（HDFS）、Cassandra、HBase 和
    Hive 等数据源中的数据。Spark 数据结构被认为是一种弹性分布式数据集。本书介绍了一个集成了 Python 和 Apache Spark（PySpark）的框架。本书使用它来操作
    Spark MLlib。要理解这个框架，你首先需要掌握弹性分布式数据集背后的概念。


    #### 弹性分布式数据集


    弹性分布式数据集（RDD）是用于并行化数据或转换现有数据的不可变元素。主要的 RDD 操作包括转换和动作。我们将它们存储在 Hadoop 支持的任何存储中。例如，在
    Hadoop 分布式文件系统（HDFS）、Cassandra、HBase、Amazon S3 等中。


    #### Spark 配置


    Spark 配置的领域包括 Spark 属性、环境变量和日志记录。默认配置目录是 `SPARK_HOME/conf`。


    你可以在环境中使用 `pip install findspark` 安装 `findspark` 库，并使用 `pip install pyspark` 安装
    `pyspark` 库。


    清单 2-1 使用 `findspark` 框架准备 PySpark 框架。


    ```

    import findspark as initiate_pyspark

    initiate_pyspark.init("filepath\spark-3.0.0-bin-hadoop2.7")

    清单 2-1

    准备 PySpark 框架

    ```


    清单 2-2 使用 `SparkConf()` 方法规定 PySpark 应用程序。


    ```

    from pyspark import SparkConf

    pyspark_configuration = SparkConf().setAppName("pyspark_linear_method").setMaster("local")

    清单 2-2

    规定 PySpark 应用程序

    ```


    清单 2-3 使用 `SparkSession()` 方法准备 PySpark 会话。


    ```

    from pyspark.sql import SparkSession

    pyspark_session = SparkSession(pyspark_context)

    清单 2-3

    准备 Spark 会话

    ```


    #### Spark 框架


    Spark 框架扩展了 Spark API 的核心。有四个主要的 Spark 框架——SparkSQL、Spark Streaming、Spark MLlib
    和 GraphX。


    ##### SparkSQL


    SparkSQL 使您能够使用关系查询语言，如 SQL、HiveQL 和 Scala。它包含一个包含行对象和模式的 `schemaRDD`。您可以使用现有的
    RDD、parquet 文件或 JSON 数据集来创建它。执行 Spark Context 以创建 SQL 上下文。


    ##### Spark Streaming


    Spark Streaming 是一个可扩展的流处理框架，支持 Apache Kafka、Apache Flume、HDFS 和 Apache Kensis
    等。它使用 DStream 以小批量方式处理输入数据，您可以通过 HDFS、数据库和仪表板推送这些数据。较新版本的 Python 不支持 Spark Streaming。因此，本书不涉及该框架。您可以使用
    Spark Streaming 应用程序从任何数据源读取输入，并将数据副本存储在 HDFS 中。这使您能够构建和启动一个 Spark Streaming 应用程序，该应用程序处理传入数据并对其运行算法。


    ##### Spark MLlib


    MLlib 是一个机器学习框架，允许您开发和测试机器学习和深度学习模型。在 Python 中，这些框架与 NumPy 框架协同工作。Spark MLlib
    可以与多个 Hadoop 数据源一起使用，并集成到 Hadoop 工作流中。常见算法包括回归、分类、聚类、协同过滤和降维。关键的工作流工具包括特征转换、标准化和归一化、流水线开发、模型评估和超参数优化。


    ##### GraphX


    GraphX 是一个可扩展且容错的框架，用于迭代和快速的图并行计算、社交网络和语言建模。它包括图算法，例如用于估计图中每个顶点重要性的 PageRank、用于使用图中编号最小的顶点
    ID 标记图连通分量的 Connected Components，以及用于查找通过每个顶点的三角形数量的 Triangle Counting。


    ## 机器学习框架


    要解决机器学习问题，您需要一个支持构建和扩展机器学习模型的框架。机器学习模型并不缺乏——有数不清的机器学习框架。有多个机器学习框架可供您使用。后续章节将介绍
    Scikit-Learn、Spark MLlib、H2O 和 XGBoost 等框架。

