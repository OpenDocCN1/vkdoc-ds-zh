    ## Introduction


    This book covers the in-memory, distributed cluster computing framework called
    `PySpark`, the machine learning framework platforms called `Scikit-Learn`, `PySpark
    MLlib`, `H2O`, and `XGBoost`, and the deep learning framework known as `Keras`.
    After reading this book, you will be able to apply supervised and unsupervised
    learning to solve practical and real-world data problems. In this book, you will
    learn how to engineer features, optimize hyperparameters, train and test models,
    develop pipelines, and automate the machine learning process.


    To begin, the book carefully presents supervised and unsupervised ML and DL models
    and examines big data frameworks and machine learning and deep learning frameworks.
    It also discusses the parametric model called Generalized Linear Model and a survival
    regression model known as the Cox Proportional Hazards model and Accelerated Failure
    Time (AFT). It presents a binary classification model called Logistic Regression
    and an ensemble model called Gradient Boost Trees. It also introduces DL and an
    artificial neural network, the Multilayer Perceptron (MLP) classifier. It describes
    a way of performing cluster analysis using the k-means model. It explores dimension
    reduction techniques like Principal Components Analysis and Linear Discriminant
    Analysis and concludes by unpacking automated machine learning.


    The book targets intermediate data scientists and machine learning engineers who
    want to learn how to apply key big data frameworks, as well as ML and DL frameworks.
    Before exploring the contents of this book, be sure that you understand basic
    statistics, Python programming, probability theories, and predictive analytics.


    The books uses `Anaconda` (an open source distribution of Python programming)
    for the examples. The following list highlights some of the Python libraries that
    this book covers.


    *   `Pandas` for data structures and tools.

    *   `PySpark` for in-memory, cluster computing.

    *   `XGBoost` for gradient boosting and survival regression analysis.

    *   `Auto-Sklearn`, `Tree-based Pipeline Optimization Tool (TPOT)`, `Hyperopt-Sklearn`,
    and `H2O` for AutoML.

    *   `Scikit-Learn` for building and validating key machine learning algorithms.

    *   `Keras` for high-level frameworks for deep learning.

    *   `H2O` for driverless machine learning.

    *   `Lifelines` for survival analysis.

    *   `NumPy` for arrays and matrices.

    *   `SciPy` for integrals, solving differential equations, and optimization.

    *   `Matplotlib` and `Seaborn` for recognized plots and graphs.


    ## Acknowledgments


    Writing a single-authored book is demanding, but I received firm support and active
    encouragement from my family and dear friends. Many heartfelt thanks to the Apress
    Publishing team for all their support throughout the writing and editing processes.
    Lastly, my humble thanks to all of you for reading this; I earnestly hope you
    find it helpful.


    ## About the Author About the Technical Reviewer


    # 1. Exploring Machine Learning


    This chapter introduces the best machine learning methods and specifies the main
    differences between supervised and unsupervised machine learning. It also discusses
    various applications of both.


    Machine learning has been around for a long time; however, it has recently gained
    widespread recognition. This is because of the increased computational power of
    modern computer systems and the ease of access to open source platforms and frameworks.
    Machine learning involves inducing computer systems with intelligence by implementing
    various programming and statistical techniques. It draws from fields such as statistics,
    computational linguistics, and neuroscience, among others. It also applies modern
    statistics and basic programming. It enables developers to develop and deploy
    intelligent computer systems and create practical and reliable applications.


    ## Exploring Supervised Methods


    Supervised learning involves feeding a machine learning algorithm with a large
    data set, through which it learns the desired output. The main machine learning
    methods are linear, nonlinear, and ensemble. The following section familiarizes
    you with the parametric method, also known as the *linear regression method*.
    See Table [1-1](#517508_1_En_1_Chapter.xhtml#Tab1).


    Linear regression methods expect data to follow a Gaussian distribution. The ordinary
    least-squares method is the standard linear method; it minimizes the error in
    terms and determines the slope and intercept to fit the data to a straight line
    (where the dependent feature is continuous).


    Furthermore, the ordinary least-squares method determines the extent of the association
    between the features. It also assumes linearity, no autocorrelation in residuals,
    and no multicollinearity. In the real world, data hardly ever comes from a normal
    distribution; the method struggles to explain the variability, resulting in an
    under-fitted or over-fitted model. To address this problem, we introduce a penalty
    term to the equation to alter the model’s performance.


    **Table 1-1** Types of Parametric Methods


    | Model | Description |

    | --- | --- |

    | Linear regression method | Applied when there is one dependent feature (continuous
    feature) and an independent feature (continuous feature of categorical). The main
    linear regression methods are `GLM`, `Ridge`, `Lasso`, `Elastic Net`, etc. |

    | Survival regression method | Applied to time-event-related censored data, where
    the dependent feature is categorical and the independent feature is continuous.
    |

    | Time series analysis method | Applied to uncovering patterns in sequential data
    and forecasting future instances. Principal time series models include the `ARIMA`
    model, `SARIMA`, `Additive` model, etc. |'
