    # 9. 使用 Scikit-Learn、PySpark 和 H2O 进行主成分分析


    本章通过实现多种 Python 框架（Scikit-Learn、PySpark 和 H2O）来执行一个简单的降维方法（主成分方法）。首先，它阐明了该方法如何计算主成分。

