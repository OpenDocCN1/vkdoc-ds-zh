  \   1.4         0.2  setosa\n5         2.3          1.3         0.3  setosa\n\n\
  # ... 还有 145 行\n```\n\n现在我们已经多次使用这个 `select` 便捷函数，我们简要地看看另外四个这样的函数。这四个函数的目标是帮助我们选择变量，而无需键入完整的列名。按照不特定的顺序，`starts_with()`、`ends_with()`、`contains()`\
  \ 和 `matches()` 都使用正则表达式，默认在当前变量列表中查找，并且默认忽略大小写，不过这个特性可以关闭。与其全部演示一遍，不如用下面的代码展示两个使用\
  \ `starts_with()` 的例子。`dplyr` 方法的一个优点是创建命名简洁、专注于单一任务的函数（通常以动词命名），这使得从函数名称就能很容易地知道它的功能。其余辅助函数的操作方式与\
  \ `starts_with()` 类似，并且其功能完全如其名称所示：\n\n```\nselect(diris, starts_with(\"s\"))\n\n\
  # A tibble: 150 x 3\nSepal.Length Sepal.Width Species\n\n1          4.3        \
  \ 3.0  setosa\n2          4.4         3.2  setosa\n3          4.4         3.0  setosa\n\
  4          4.4         2.9  setosa\n5          4.5         2.3  setosa\n\n# ...\
  \ 还有 145 行\nselect(diris, starts_with(\"s\", ignore.case = FALSE))\n\n# A tibble:\
  \ 150 x 0\n```\n\n通过这最后一段代码，我们对 `dplyr` 子集操作的探索就结束了。接下来，我们将注意力转向变量重命名和排序。\n\n##\
  \ 变量重命名与排序\n\n列名需要重命名或重新排序是数据清理中常见且令人遗憾的一部分。在一个数据库中合理（或“合法”）的列名，在另一个数据库中可能行不通。许多专有数据管理系统都拥有固定但笨重的名称。\n\
  \n查看与 `dplyr` 对象关联的名称，需要使用常用的 `names()` 或 `colnames()` 函数，并将我们的数据集 `diris` 作为参数传入。无论使用哪种方式，都能在当前列顺序下得到相同的结果：\n\
  \n```\nnames(diris)\n[1] \"Sepal.Length\" \"Sepal.Width\"  \"Petal.Length\" \"Petal.Width\"\
  \  \"Species\"\ncolnames(diris)\n[1] \"Sepal.Length\" \"Sepal.Width\"  \"Petal.Length\"\
  \ \"Petal.Width\"  \"Species\"\n```\n\n要更改名称，请在数据对象上调用 `rename()` 函数，并使用以下格式设置第二个形参的新名称：`新名称\
  \ = 旧名称`。可以通过将更多列作为额外的参数（例如，在第三、第四个形参中）传递给函数，来同时重命名多个列。通过比较 `names()` 的结果与之前的旧结果，可以确认更改是否生效。在下面的代码中，我们删除了数据中\
  \ `Sepal` 和 `Length` 之间的句点：\n\n```\ndiris <- rename(diris, SepalLength = Sepal.Length)\n\
  names(diris)\n[1] \"SepalLength\"  \"Sepal.Width\"  \"Petal.Length\" \"Petal.Width\"\
  \  \"Species\"\n```\n\n为了重新排序列，将长度和宽度配对在一起，只需使用 `select()` 函数并为你的数据对象重新赋值即可。请务必记住，我们已经将\
  \ `SepalLength` 重命名，中间不再有句点！\n\n```\ndiris                          \n1        \
  \ 4.3          1.1         3.0         0.1  setosa\n2         4.4          1.3 \
  \        3.2         0.2  setosa\n3         4.4          1.3         3.0       \
  \  0.2  setosa\n4         4.4          1.4         2.9         0.2  setosa\n5  \
  \       4.5          1.3         2.3         0.3  setosa\n\n# ... 还有 145 行\n```\n\
  \n之前，你已经看到数字形式的 `select` 调用可以重新排序列，所以我们将用一个最后的重新排序示例来结束本节。在这里，我们使用一个变量来保存数字位置，尽管我们也可以使用字符名称来代替数字。然后，我们使用\
  \ `select_()` 函数将我们的列重新组织回它们原始的顺序。\n\n```\nv                          \n1      \
  \   4.3         3.0          1.1         0.1  setosa\n2         4.4         3.2\
  \          1.3         0.2  setosa\n3         4.4         3.0          1.3     \
  \    0.2  setosa\n4         4.4         2.9          1.4         0.2  setosa\n5\
  \         4.5         2.3          1.3         0.3  setosa\n```\n\n\n\n``` \n# ...\
  \ 还有 145 行\n```\n\n## 数据计算与创建变量\n\n既然你已经对如何在 `dplyr` 中管理原始数据有了很好的了解，我们将开始关注如何从旧数据中创建新数据。为简化起见，我们从原始\
  \ `iris` 数据集重新创建 `diris` 数据集。然后，我们将准备好使用新函数 `mutate()` 来创建或替换列。该函数接受通常的第一个参数，后续参数则表达了创建新列所需的操作。无论是一个还是多个列，只需创建表达式，让\
  \ `dplyr` 知道要向 `tibble` 添加什么内容：\n\n```\ndiris                             \n1  \
  \        5.1         3.5          1.4         0.2  setosa     0     1     2\n2 \
  \         4.9         3.0          1.4         0.2  setosa     0     1     2\n3\
  \          4.7         3.2          1.3         0.2  setosa     0     1     2\n\
  4          4.6         3.1          1.5         0.2  setosa     0     1     2\n\
  5          5.0         3.6          1.4         0.2  setosa     0     1     2\n\n\
  # ... 还有 145 行\n```\n\n当然，新数据并不一定是创建全新的列。相反，我们可能会基于现有信息创建新的计算列。也许我们想要一个名为 `V` 的新列，它是\
  \ `Petal.Length` 和 `Petal.Width` 的乘积。为清晰起见，我们首先移除刚刚添加的三个列：\n\n```\ndiris       \
  \                    \n1          5.1         3.5          1.4         0.2  setosa\
  \  0.28\n2          4.9         3.0          1.4         0.2  setosa  0.28\n3  \
  \        4.7         3.2          1.3         0.2  setosa  0.26\n4          4.6\
  \         3.1          1.5         0.2  setosa  0.30\n5          5.0         3.6\
  \          1.4         0.2  setosa  0.28\n\n# ... 还有 145 行\n```\n\n更复杂的计算是在特定条件下才执行。在这种情况下，`if_else()`\
  \ 接受三个参数。第一个是用于测试 if/else 语句的逻辑条件。第二个和第三个参数指示在 `if` 或 `else` 情况下该如何处理。此外，`mutate()`\
  \ 不仅允许我们创建包含数据的列，还可以更改现有列的数据。因此，如果我们在第一次尝试中创建的列 `V2` 不足以体现 `setosa` 物种花瓣宽度与长度的乘积关系，我们可以将其扩展为对\
  \ `virginica` 物种进行平方根运算。为了确保我们看到每个物种的样本，我们使用 `slice()` 函数仅查看三个特定行：\n\n```\ndiris\
  \                               \n1          5.1         3.5          1.4      \
  \   0.2     setosa  0.28  0.28\n2          7.0         3.2          4.7        \
  \ 1.4 versicolor  6.58    NA\n3          6.3         3.3          6.0         2.5\
  \  virginica 15.00  3.87\n```\n\n不一定要创建新列；也可以使用 `summarise()` 函数直接在表格上计算信息。与往常一样，第一个参数告诉函数要使用哪些数据，其余参数则用于容纳各个计算。请注意，可以编写一个或多个计算。这里，我们演示了两种计算：算术平均值和标准差：\n\
  \n```\nsummarise(diris, M = mean(Sepal.Width), SD = sd(Sepal.Width))\n\n# A tibble:\
  \ 1 x 2\nM    SD\n\n1   3.1  0.44\n```\n\n与 `data.table` 不同，`dplyr` 通过函数工作。此外，虽然你的数学教授可能花了一些时间讲解函数组合（并且将函数嵌套在彼此内部的技术有其用武之地），但在\
  \ `dplyr` 中有更清晰的写法。使用 `%>%` 操作符时，将多个函数链接在一起，我们便能得到期望的结果。假设我们想提取数据，仅使用 `virginica`\
  \ 物种，并计算萼片宽度的平均值。结果应该是一个只包含一个变量（即我们寻找的平均值）的 `tibble`。请注意，当使用 `%>%` 操作符时，数据集会被传递给第一个参数。因此，即使在下面的代码中，我们看起来指定了\
  \ `filter()` 的第一个形式参数，但由于使用了 `%>%` 操作符，函数被修改了：数据集作为第一个参数传递，而我们写的 `Species == \"\
  virginica\"` 则作为第二个参数传递：\n\n```\ndiris  %>%  filter(Species == \"virginica\") %>%\
  \  summarise(M = mean(Sepal.Width))\n\n# A tibble: 1 x 1\nM\n\n1     3\n```\n\n\
  这种一步接一步的思路可以进行调整以应对各种数据处理操作。回想一下我们对 `data.table` 的研究，其结构的第三个形式参数 `by =` 允许我们按列的元素进行分组。对于\
  \ `dplyr`，我们使用 `group_by()` 并指定列名来完成相同的任务。将我们的平均值示例扩展到所有三个物种，现在我们得到一个两列的 `tibble`，每个物种对应一行。我们还可以计算原始列中多个列的平均值。请注意，无论我们如何计算，`virginica`\
  \ 的萼片宽度平均值都是 `3`。\n\n```\ndiris %>%  group_by(Species) %>%  summarise(M1 = mean(Sepal.Width),\
  \ M2 = mean(Petal.Width))\n\n# A tibble: 3 x 3\nSpecies    M1    M2\n\n1     setosa\
  \   3.4  0.25\n2 versicolor   2.8  1.33\n3  virginica   3.0  2.03\n```\n\n这种链式结构，就像数据表的链式结构一样，可以无限进行下去（或接近无限）。要找出上述数据中的相关性，只需在链的末尾再添加一步：\n\
  \n```\ndiris %>%\ngroup_by(Species) %>%\nsummarise( M1 = mean(Sepal.Width),  M2\
  \ = mean(Petal.Width)) %>%\nsummarise(r = cor(M1, M2))\n\n# A tibble: 1 x 1\nr\n\
  \n1 -0.76\n```\n\n变量也可以创建其它变量。我们根据花瓣宽度是否大于该物种花瓣宽度的中位数来创建一个新变量。这可能稍微改变了它的外观，但它仍然是一个\
  \ `tibble`：\n\n```\ndiris %\ngroup_by(Species) %>%\nmutate(MedPW = Petal.Width >\
  \ median(Petal.Width))\ndiris\nSource: local data frame [150 x 8]\nGroups: Species\
  \ [3]\nSepal.Length Sepal.Width Petal.Length Petal.Width Species     V    V2 MedPW\n\
  \n1          5.1         3.5          1.4         0.2  setosa  0.28  0.28 FALSE\n\
  2          4.9         3.0          1.4         0.2  setosa  0.28  0.28 FALSE\n\
  3          4.7         3.2          1.3         0.2  setosa  0.26  0.26 FALSE\n\
  4          4.6         3.1          1.5         0.2  setosa  0.30  0.30 FALSE\n\
  5          5.0         3.6          1.4         0.2  setosa  0.28  0.28 FALSE\n\n\
  # ... 还有 145 行\n```\n\n按多个变量分组也很容易。按物种和中位花瓣宽度布尔值分组，我们重新计算萼片宽度和花瓣宽度的平均值：\n\n```\n\
  diris  %>%\ngroup_by(Species, MedPW) %>%\nsummarise( M1 = mean(Sepal.Width),  M2\
  \ = mean(Petal.Width))\nSource: local data frame [6 x 4]\nGroups: Species [?]\n\
  Species MedPW    M1    M2\n\n1     setosa FALSE   3.4  0.19\n2     setosa  TRUE\
  \   3.5  0.38\n3 versicolor FALSE   2.6  1.19\n4 versicolor  TRUE   3.0  1.50\n\
  5  virginica FALSE   2.8  1.81\n6  virginica  TRUE   3.1  2.27\n```\n\n同样，始终可以在链上继续添加更多操作：\n\
  \n```\ndiris %>%\ngroup_by(Species, MedPW) %>%\nsummarise(\nM1 = mean(Sepal.Width),\n\
  M2 = mean(Petal.Width)) %>%\ngroup_by(MedPW) %>%\nsummarise(r = cor(M1, M2))\n```\n\
  \n\n\n"
- "# 一个 tibble：2 行 x 2 列\n\n| `MedPW` | `r`    |\n|---------|--------|\n| FALSE  \
  \ | -0.78  |\n| TRUE    | -0.76  |\n\n## 数据合并与重塑\n\n我们不会重复在 `data.table` 章节中关于合并与重塑数据的内容，只提一点：`merge()`\
  \ 函数调用在某种程度上仍然有效。这个函数与 `data.table` 中的函数是同一个，因为我们使用 `dplyr` 对构建在数据框基础上的 `tibble`\
  \ 进行操作，所以它能工作。然而，一旦这样做了，它们就会失去 `tibble` 的身份。因此，我们还引入了 `*join()` 函数，这些函数更接近于一些传统的数据库语言。\n\
  \n同样，我们先运行一段代码来创建四个独立的数据对象。请再次注意，在实际生活中这通常是不需要的，因为我们的数据通常来自不同的数据库：\n\n```\ndiris\
  \ %>%  group_by(Species) %>%  select(Species, Sepal.Width) %>%  slice(1:3)\ndiris\n\
  Source: local data frame [9 x 2]\nGroups: Species [3]\nSpecies Sepal.Width\n\n1\
  \     setosa         3.5\n2     setosa         3.0\n3     setosa         3.2\n4\
  \ versicolor         3.2\n5 versicolor         3.2\n6 versicolor         3.1\n7\
  \  virginica         3.3\n8  virginica         2.7\n9  virginica         3.0\ndiris2\
  \        \n1     setosa         3.5\n2 versicolor         3.2\n3  virginica    \
  \     3.3\ndalt1      \n1     setosa     wide  TRUE\n2     setosa     wide FALSE\n\
  3 versicolor     wide  TRUE\n4 versicolor     wide FALSE\n5  virginica   narrow\
  \  TRUE\n6  virginica   narrow FALSE\n7      other moderate  TRUE\n8      other\
  \ moderate FALSE\ndalt2   \n1     setosa  wide  TRUE\n2 versicolor  wide  TRUE\n\
  ```\n\n`merge()` 函数操作两个数据集。对于像 `diris2` 和 `dalt2` 这样的一对一数据，合并本身只保留两个数据集中都匹配的行。我们可以看到，对于这两个对象，`diris2`\
  \ 中的 `virginica` 行被丢弃了：\n\n```\nmerge(diris2, dalt2)\nSpecies Sepal.Width Type MedPW\n\
  1     setosa         3.5 wide  TRUE\n2 versicolor         3.2 wide  TRUE\n```\n\n\
  如果我们想保留 `diris2` 的全部三行，那么合并后会有一些缺失数据。在这种情况下，因为我们任意选择 `diris2` 作为我们的第一个形式，`all.x\
  \ = TRUE` 会保留 `diris2` 的所有行：\n\n```\nmerge(diris2, dalt2, all.x = TRUE)\nSpecies\
  \ Sepal.Width Type MedPW\n1     setosa         3.5 wide  TRUE\n2 versicolor    \
  \     3.2 wide  TRUE\n3  virginica         3.3     NA\n```\n\n也可以设置第二个值，即 `all.y\
  \ = TRUE`，尽管在这种情况下没有明显区别。根据两个特定表格匹配程度的不同，缺失变量的模式可能不同。类似地，也可以指定我们希望从所有表中获取所有行。这可能会产生最多的缺失数据位置；在我们的例子中，这样的合并将与前面示例中显示的三行完全相同。\n\
  \n如前所述，这些不是 `tibble`。如果我们希望合并后再强制转换回 `tibble`，可以用 `as_tibble()` 包装它们。然而，正如你将在我们的数据库章节中看到的，`dplyr`\
  \ 也操作数据库风格的对象。特别是，可以通过 `dplyr` 访问结构化查询语言 (SQL)。SQL 有连接操作，我们现在来看四种类型的连接。笼统地说，`merge()`\
  \ 侧重于某种方式的匹配。连接则侧重于对象 1 和对象 2 的行与列之间的关系。\n\n`left_join()` 会返回第一个对象的所有行，以及第一个和第二个对象的全部列。因为这是一个\
  \ `dplyr` 函数调用，我们得到的是一个 `tibble` 作为输出。如你所见，这与 `all.x=TRUE` 类似（尽管并非在所有情况下都完全匹配）：\n\
  \n```\nleft_join(diris2,dalt2)\nJoining, by = \"Species\"\nSource: local data frame\
  \ [3 x 4]\nGroups: Species [?]\nSpecies Sepal.Width  Type MedPW\n\n1     setosa\
  \         3.5  wide  TRUE\n2 versicolor         3.2  wide  TRUE\n3  virginica  \
  \       3.3      NA\n```\n\n`right_join()` 与左连接非常相似，区别在于它返回第二个对象的所有行。同样，两个对象的所有列都会被返回。在这种情况下，这种连接与\
  \ `merge()` 函数没有太大区别。然而，这种情况并不代表所有情况。网上很多图表声称揭示了连接的工作原理。根据我们的经验，这些解释的准确性可能参差不齐。我们的建议是找几个小的数据表，或者像我们这样自己创建一些。然后开始尝试连接。在反复实践之后，你会逐渐掌握哪种技术最接近你想要的最终数据。\n\
  \n```\nright_join(diris2,dalt2)\nJoining, by = \"Species\"\nSource: local data frame\
  \ [2 x 4]\nGroups: Species [?]\nSpecies Sepal.Width  Type MedPW\n\n1     setosa\
  \         3.5  wide  TRUE\n2 versicolor         3.2  wide  TRUE\n```\n\n与基本 `merge()`\
  \ 函数最匹配的是 `inner_join()` 函数，在本例中，它会生成与之前的右连接相同的结果。相比之下，从合并的角度来看，最奇特的是 `anti_join()`。`anti_join()`\
  \ 返回第一个数据库中在第二个数据对象中没有匹配值的所有行。至于列，它只返回第一个对象的列。\n\n```\nanti_join(diris2,dalt2)\n\
  Joining, by = \"Species\"\nSource: local data frame [1 x 2]\nGroups: Species [3]\n\
  Species Sepal.Width\n\n1 virginica         3.3\n```\n\n在连接和合并之间，有很多选项可以将数据组合成一个对象。记住，你的最终目标是获取分析所需的数据。有时，先将一个或多个数据集合合并成一个表格，然后使用本章前面介绍的技术将其缩减为你想要的数据集，是合理的做法。当然，如果你更熟悉合并，它们通常也能很好地工作。如果你确实需要使用\
  \ `dplyr`，`as_tibble()` 总是可以作为包装函数，将你的对象强制转换回应有的格式。毕竟，`data.table` 和 `dplyr` 的 `tibble`\
  \ 都是数据框的扩展。\n\n我们的最后一个目标是重塑数据，如果每行都有一个唯一的 ID，效果会更好。我们先再次刷新一下数据集。然后引入 `n()`，这是一种引用行数的特殊方式，就像数据表中的\
  \ `.N` 一样：\n\n```\ndiris                           \n1          5.1         3.5\
  \          1.4         0.2  setosa     1\n2          4.9         3.0          1.4\
  \         0.2  setosa     2\n3          4.7         3.2          1.3         0.2\
  \  setosa     3\n4          4.6         3.1          1.5         0.2  setosa   \
  \  4\n5          5.0         3.6          1.4         0.2  setosa     5\n\n# ...\
  \ 还有 145 行\n```\n\n要使用 `reshape()` 变长，我们使用基础 R 函数。然后，我们用 `varying` 标签来标明重复测量的变量或我们希望在长数据集中堆叠的变量。`timevar`\
  \ 标签接收指示一行属于哪个堆栈的变量名。之所以这样命名，是因为这些变量通常按时间排序。用 `v.names` 指定新堆叠变量的名称，并用 `idvar` 指定\
  \ ID 变量。任何未在 `varying` 中列出的变量将被视为不变变量，并会简单重复。\n\n```\ndiris.long     \n1  setosa\
  \     1     1   5.1   1.4\n2  setosa     2     1   4.9   1.4\n3  setosa     3  \
  \   1   4.7   1.3\n4  setosa     4     1   4.6   1.5\n5  setosa     5     1   5.0\
  \   1.4\n\n# ... 还有 295 行\n```\n\n此时，`Type` 的含义可能还不清楚。`Type` 告诉我们当前涉及的是花萼还是花瓣的长度还是宽度。当我们的数据从宽变长时，其长度翻倍。现在，`Sepal`\
  \ 和 `Petal` 列必须承担双重任务，而 `Type` 就是用来区分它们的。来看看我们数据的一个 `slice()`：\n\n```\nslice(diris.long,\
  \ c(1, 151))\n```\n\n\n\n"
- "# 一个 2 x 5 的 tibble 数据框\n\n| Species | ID | Type | Sepal | Petal |\n|---------|----|------|-------|-------|\n\
  | setosa  | 1  | 1    | 5.1   | 1.4   |\n| setosa  | 1  | 2    | 3.5   | 0.2   |\n\
  \n`Type` 的取值从 `1` 到 `2`，取决于它是长度还是宽度。然而，该信息并未编码到我们的数据中，因此我们使用 `mutate()` 函数对 `tibble`\
  \ 进行转换，以确保它能理解 `Type` 是一个包含两个水平的因子，这两个水平分别是 `Length` 和 `Width`。请注意，经过此番清理之后，我们的数据切片现在更有意义了。\n\
  \n```\ndiris.long     \n1  setosa     1 Length   5.1   1.4\n2  setosa     2 Length\
  \   4.9   1.4\n3  setosa     3 Length   4.7   1.3\n4  setosa     4 Length   4.6\
  \   1.5\n5  setosa     5 Length   5.0   1.4\n\n# ... 还有 295 行数据\nslice(diris.long,\
  \ c(1, 151))\n\n# 一个 2 x 5 的 tibble 数据框\nSpecies    ID   Type Sepal Petal\n\n1 \
  \ setosa     1 Length   5.1   1.4\n2  setosa     1  Width   3.5   0.2\n```\n\n我们之前将宽数据变为了长数据。现在，我们再次使用\
  \ `reshape()` 函数来逆转这个过程，这次将 `direction` 形式参数设置为 `wide`。由于我们要变为宽格式，因此不需要 `varying`\
  \ 参数，因为我们将通过这个转换过程得到这些变量。我们需要指定 `ids = diris.long$ID`，以便将第 `1` 行和第 `151` 行合并到同一个宽行中。\n\
  \n```\ndiris.wide2                                \n1  setosa     1          5.1\
  \          1.4         3.5         0.2\n2  setosa     2          4.9          1.4\
  \         3.0         0.2\n3  setosa     3          4.7          1.3         3.2\
  \         0.2\n4  setosa     4          4.6          1.5         3.1         0.2\n\
  5  setosa     5          5.0          1.4         3.6         0.2\n\n# ... 还有 145\
  \ 行数据\n```\n\n至此，你可以看到 `reshape()` 是基础 R 的一部分，并不是一种非常符合 `dplyr` 风格的方式。然而，它可能更加强大且用途广泛。因此，我们决定展示如何使用它，而不是使用更多\
  \ `dplyr` 风格的方法，例如 `tidyr`。事实上，`tidyr` 大约有两年历史了，它很可能会成为管理此类数据转换的新方式。考虑到技术发展的速度，当您，我们亲爱的读者，拿到这本书时，我们所有人都可能需要对本章内容进行更新了。\n\
  \n## 总结\n\n`dplyr` 和 `tibble` 包使得数据处理更加容易。通过将对数据的操作与数据本身分离，我们可以学习相对有限的操作，并将其应用于任何数据。在底层，`dplyr`\
  \ 会翻译这些函数调用来修改数据。在下一章中，你将看到这如何让我们快速访问大数据。表 9-1 描述了本章中使用的关键函数。\n\n**表 9-1.** 本章描述的关键函数\n\
  \n| 函数 | 功能 |\n| --- | --- |\n| `as_tibble()` | 将数据对象（例如，数据框）转换为 `tibble`。 |\n|\
  \ `arrange()` | 将指定列按升序排列，如果在列名上使用 `desc()` 则按降序排列。 |\n| `distinct()` | 这是 `dplyr`\
  \ 版本的 `unique()`。它只返回那些不重复的行。 |\n| `slice()` | 从一个 tibble 中切出所需行。 |\n| `filter()`\
  \ | 根据匹配的特征筛选出行。 |\n| `select()` | 根据名称选择特定列。其功能可通过辅助函数进行扩展：`one_of()`、`starts_with()`、`ends_with()`、`contains()`、`matches()`、`num_range()`\
  \ 和 `everything()`。 |\n| `select_()` | 一个更易于编程的 `select()` 版本，它接受字符串或包含字符串的 R 对象。\
  \ |\n| `rename()` | 重命名列。 |\n| `mutate()` | 允许对现有的 tibble 进行更改或变异。添加/删除/修改列数据是常见用途。\
  \ |\n| `summarise()` | 基于原始 tibble 的计算结果创建一个新的 tibble。 |\n| `%>%` | 管道操作符，避免了函数组合，并允许更清晰的代码来串联多个函数。\
  \ |\n| `group_by()` | 允许按列分组。对应于 `data.table` 的第三个形式参数（`by = `）。 |\n| `left_join()`\
  \ | 连接是 SQL 处理数据的方式。左连接保留第一个对象的所有行。 |\n| `right_join()` | 保留第二个对象的所有行。 |\n| `inner_join()`\
  \ | 返回两个变量中的所有列，以及第一个对象中与第二个数据对象匹配的所有行。 |\n| `anti_join()` | 仅返回第一个数据对象中无法关联的唯一部分。如果第二个对象意在扩展第一个对象的信息，这将非常有用，因为它提供了一种快速查看剩余部分的方法。\
  \ |\n| `reshape()` | 根据选择 `direction = \"wide\"` 或 `direction = \"long\"`，将数据重构为宽格式或长格式。这是一个基础\
  \ R 函数，要保持 tibble 格式需要 `as_tibble()`。 |\n\n"
- "# 10. 读取大数据（数据库）\n\n既然你了解了如何在 R 内部管理数据，现在让我们考虑数据来自何处。虽然较小的数据可以在逗号分隔值（CSV）文件或易于转换为\
  \ CSV 的文件中找到，但较大的数据通常存在于其他地方。本章将讨论大数据，或者至少是可能很大的数据。大数据的挑战是什么？R 在内存（随机存取内存）中工作，而不是在硬盘上。快速检查你的系统设置应该能显示你拥有的内存量。我们，作者们，在实际系统中使用\
  \ 4 到 32 GB 的内存，其中较大的内存是一种相当昂贵的习惯。R 无法分析超过可用 RAM 大小的数据。\n\n\n\n这就引出了两种可能性。虽然我们可以保存\
  \ R 数据对象并逐个加载，但 R 并非为全职数据库而设计。此外，大型数据通常由分析人员以外的其他团队管理。大数据是现实存在的，其中大部分数据都存储在某种数据库中。虽然大多数数据库都具备将文件导出为\
  \ CSV 的功能，但这并不总是很方便。我们的目标是提供足够的信息，让你能够访问一些常用且流行的数据库。如果你是一个数据使用者，学完本章后，你将能够从几种常见的数据库中访问数据。如果你是一个大数据管理者，你将获得将新收集的数据写入数据库的能力。在此过程中，我们将演示如何将数据子集加载到\
  \ R 中的命令。我们还会讨论读取与写入权限。最后（实际上，首先是），我们将与你一起安装这些数据库，以便你准备好练习使用大数据。事先提醒：我们的目标并非提供数据库管理方面的专业知识。不过，我们会在本章中推荐一些书籍供你深入了解。\n\
  \n本章分为三个主要部分，每部分遵循相同的模式：安装数据库软件，然后通过 R 与该数据库交互。前两个数据库系统是 SQLite 和 PostgreSQL，它们都是关系型数据库。因此，它们与之前讨论数据的章节非常契合，因为到目前为止我们一直使用表格数据。表格数据具有固定的列和可变的行。新数据被整齐地插入新行，因此大多数数据具有严格的格式。此外，虽然可能存在多个表，但通常会有共同的键值，允许我们将表之间（以及这些表中的行之间）进行匹配。我们演示的最后一个数据库是\
  \ MongoDB，它是一个文档存储的例子。在文档存储中，每块（或称 blob）数据可能是独一无二的。没有理由认为存在任何键值或关系；当然，也没有理由认为它们之间没有任何相似之处。\n\
  \n本章我们使用以下包：`devEMF` (Johnson, 2015), `DBI` (R-SIG-DB, Wickham, and Kirill, 2016),\
  \ `RSQLite` (Wickham, James, and Falcon 2014), `jsonlite` (Ooms, 2014), `tm` (Feinerer\
  \ and Hornik, 2015), `wordcloud` (Fellows, 2014), `RMongo` (Cheng, 2013), `RPostgreSQL`\
  \ (Conway, Eddelbuettel, Nishiyama, Prayaga, and Tiffin, 2016), and `data.table`\
  \ (Dowle, Srinivasan, Short, and Lianoglou, 2015)。以下代码加载 `checkpoint` (Microsoft\
  \ Corporation, 2016) 包以控制所使用的 R 包的精确版本，然后加载这些包：\n\n```\n\n\n```markdown\n## 加载检查点及所需包\n\
  \n```r\nlibrary(checkpoint)\ncheckpoint(\"2016-09-04\", R.version = \"3.3.1\")\n\
  library(devEMF)\nlibrary(RPostgreSQL)\nlibrary(DBI)\nlibrary(RSQLite)\nlibrary(jsonlite)\n\
  library(tm)\nlibrary(wordcloud)\nlibrary(RMongo)\nlibrary(data.table)\noptions(width\
  \ = 70) # 每行仅 70 个字符\n```\n\n本章不讨论大数据整理，更不是关于在 R 中整理大数据。相反，本章旨在让你学习如何使用 R 与一些流行的开源数据库进行交互。在深入了解具体数据库之前，有一句忠告：如果你想学习所有这三种数据库，请前往每个章节查看安装说明。按照说明操作，完成后，为保险起见，请重启电脑。\n\
  \n## SQLite\n\nSQLite 不仅体积极小，而且效率极高。它也是免费提供的（截至本文撰写时及过去 16 年）。虽然我们推荐阅读 Grant Allen\
  \ 和 Mike Owens 所著的 *《SQLite 权威指南》*（Apress，2010 年出版），但 SQLite 主要识别五种数据类型（与 R 相比）：空值、整数、实数、文本和二进制数据。\n\
  \n每个 SQLite 数据库仅以一个文件的形式存在，因此非常便携。这些数据库没有用户，不需要密码，并且连接结构简单。其缺点也正是这些优点所带来的一些后果。由于没有用户权限，读取信息和修改数据之间没有区别。\n\
  \n这种缺乏用户权限的情况值得提出一个重要警告。本章中我们用模拟数据构建了所使用的数据库。在实际工作中，数据库可不是用来练习的。首次直接连接到生产数据库时，会感到相当程度的恐惧，尤其是当你一个错误的\
  \ `drop` 调用就可能删除团队或客户的数据时。因为 SQLite 只是一个文件，如果可能的话，明智的做法是先在实际数据的副本上进行尝试。或者，像我们一样，先在一个完全安全的环境中进行练习。\n\
  \n### 在 Windows 上安装 SQLite\n\nSQLite 不需要“安装”过程，而是直接下载文件。访问 SQLite 官网 [`www.sqlite.org/download.html`](https://www.sqlite.org/download.html)\
  \ 即可；我们下载了 `sqlite-tools-win32-VERSION.zip` 文件，其中 `VERSION` 对应当前产品和版本。接着，将 `sqliteV.exe`（`V`\
  \ 为版本号）解压到你希望存放数据的磁盘文件夹中。我们将其解压到了 `C:/sqlite` 文件夹。请确保磁盘上有足够的空间；这个数据库最终会占用一些空间。\n\
  \n这样，你就可以在系统上运行 SQLite 了。在实际工作中，也许其他人创建了 SQLite 数据库，而你拥有数据库副本或通过网络共享驱动器访问。我们的目标是使用数据库中的数据，并通过\
  \ R 将数据存储到数据库中。这与使用“正确”技术管理 SQLite 数据库不同，效率也不如前者。尽管如此，这能让我们快速上手使用数据库！\n\n### SQLite\
  \ 与 R\n\n我们的首要任务是连接到数据库。连接使用 `DBI` 包库并建立到我们数据库的链接。对于 SQLite，无需用户名或密码。但我们确实需要告诉链接我们的数据库位置以及数据库类型。回想一下，我们之前对\
  \ SQLite 的存放位置做出了一些选择，并且该位置必须与我们的当前位置相匹配。我们将这个第一次连接命名为 `con1`，然后使用 `RSQLite` 库中的\
  \ `dbIsValid()` 函数来测试它是否正确启动。返回结果有效，因此我们可以开始操作：\n\n```r\ncon1 = dbConnect(SQLite(),\
  \ dbname = \"C:/sqlite/LiteDB.db\")\ndbIsValid(con1)\n[1] TRUE\n```\n\n我们的目标是让你快速连接到这个数据库。我们将熟悉的\
  \ `iris` 数据推送到 SQLite，这可以让我们看到系统是否正常工作。SQLite 中的数据存储在表中，表内包含字段。这对应于 R 中的数据表，数据表有名称和列。我们假设你已经非常熟悉\
  \ `iris` 数据，并展示将 `iris` 数据表版本写入 SQLite 的结果。`dbWriteTable()` 函数需要三个必需参数：连接、新表的名称以及要写入该表的\
  \ R 对象的名称。R 对象应为数据框。还可以传递其他参数，包括确定（如果数据库中已存在同名表）是覆盖还是追加的设置。第一次尝试时，我们将这两个参数都设置为默认值\
  \ `FALSE`：\n\n```r\ndbWriteTable(con1, name = \"Iris\", diris, overwrite = FALSE,\
  \ append = FALSE)\n[1] TRUE\ndbListTables(con1)\n[1] \"Iris\"\ndbListFields(con1,\
  \ \"Iris\")\n[1] \"Sepal.Length\" \"Sepal.Width\"  \"Petal.Length\" \"Petal.Width\"\
  \ \"Species\"\n```\n\n现在这些数据已存入我们的 SQLite `Iris` 表中；我们可以将其读回 R。我们的目标是让你学会如何将整个表读入\
  \ R，并确认我们的存储是无损或准确的。对 `con1` 连接以及 SQLite 中的 `Iris` 表使用 `dbReadTable()` 函数，我们就能访问数据。此函数返回一个数据框：\n\
  \n```r\ndiris_lite1 <- dbReadTable(con1, \"Iris\")\ndiris_lite1 <- as.data.table(diris_lite1)\n\
  all.equal(diris, diris_lite1)\n[1] TRUE\n```\n\n`all.equal()` 函数确认数据没有丢失。这为存储大数据提供了一种简便方法。R\
  \ 中的数据表可以轻松存储，并且通过正确使用 `overwrite`、`append` 或 `name` 参数，我们可以在对 SQLite 了解甚少的情况下，足够好地管理这些数据。假如你手头有大型表格数据，这无疑是一种简单的跟踪方式。本书的一位作者拥有一系列表格数据，这些数据偶尔会随时间变化，但高度相似。添加一列当前日期，就可以将大块数据轻易写入\
  \ SQLite，形成一种永久存档。现在，这样做的主要用途可能不是将整个表读入 R，而只是读取其中一部分。\n\n读取部分表是我们的目标，但这并不像我们之前做的那么容易。根据你对结构化查询语言的熟悉程度，这一步可能会相对容易或困难。如果你对\
  \ SQL 不太熟悉，这完全没问题。在这种情况下，我们的建议是，首先对 SQLite 表进行广撒网式的查询，然后使用 R 移除你不需要或不想要的更多行或列。另一方面，如果你对\
  \ SQL 更熟悉，完全可以只精确选择你需要的部分。这里，我们给出几个例子，对于初级 SQL 水平应该足够了。再次强调，我们推荐其他书籍来深入学习 SQL。\n\
  \n一个基本的 SQL 查询 `SELECT` 某些特定列，`FROM` 一个特定表，`WHERE` 特定列的特定行具有某个特征。我们使用 `dbSendQuery()`\
  \ 将查询发送到 SQLite 并执行。然后，使用 `dbFetch()` 将结果获取到 R 中。最后，我们使用 `dbClearResult()` 清除 SQLite\
  \ 中的缓冲区，为后续查询做准备。\n\n```r\nquery <- dbSendQuery(con1, \"SELECT [Sepal.Length] FROM\
  \ Iris WHERE Species = 'setosa'\")\ndiris_lite2 <- dbFetch(query, n=-1)\nhead(diris_lite2)\n\
  Sepal.Length\n1          5.1\n2          4.9\n3          4.7\n4          4.6\n5\
  \          5.0\n6          5.4\ndbClearResult(query)\n[1] TRUE\n```\n\n上述代码返回了 `setosa`\
  \ 品种的 50 个花萼长度观测值。在 `dbFetch()` 中，我们引用了已执行的查询，`n` 参数告诉我们要选择的行数。在此例中，我们请求所有行。相比之下，我们也可以请求所有非\
  \ `setosa` 的 100 行。命令类似，如下所示：\n\n```r\nquery <- dbSendQuery(con1, \"SELECT [Sepal.Length],\
  \ Species FROM Iris WHERE Species <> 'setosa'\")\ndiris_lite3 <- dbFetch(query,\
  \ n=-1)\nhead(diris_lite3)\nSepal.Length    Species\n1          7.0 versicolor\n\
  2          6.4 versicolor\n3          6.9 versicolor\n4          5.5 versicolor\n\
  5          6.5 versicolor\n6          5.7 versicolor\ndbClearResult(query)\n[1]\
  \ TRUE\n```\n\n注意，由于 `Sepal` 和 `Length` 之间存在句点，我们必须将该变量用方括号括起来，而 `Species` 则不需要。值得一提的是，SQL\
  \ 有一些语言特性和保留字符（在某种程度上，R 也是如此）。事实上，对于 SQL 经验不足的人来说，这可能是最大的风险。请记住，一旦你使用了 `dbSendQuery`，SQLite\
  \ 就会愉快地接收并执行该查询。由于 SQLite 没有用户认证，因此无法使用最少的只读权限。最好的情况是，错误的命令根本不会产生任何效果。最坏的情况下，你可能会删除、覆盖或以其他方式损坏数据。我们宝贵的建议是，始终在数据的本地副本上工作，特别是当你阅读本文是为了启动大数据项目时。否则，如果你是\
  \ SQL 新手，请与数据库所有者或管理员沟通。\n\n我们最后一个 `iris` 示例使用 `*` 通配符返回所有列，而不是列出所有列。同样，我们请求所有非\
  \ `setosa` 的行：\n\n```r\nquery <- dbSendQuery(con1, \"SELECT * FROM Iris WHERE Species\
  \ <> 'setosa'\")\ndiris_lite4 <- dbFetch(query, n=-1)\ndiris_lite4 <- as.data.table(diris_lite4)\n\
  diris_lite4\nSepal.Length Sepal.Width Petal.Length Petal.Width    Species\n1:  \
  \        7.0         3.2          4.7         1.4 versicolor\n2:          6.4  \
  \       3.2          4.5         1.5 versicolor\n3:          6.9         3.1   \
  \       4.9         1.5 versicolor\n...\n98:          6.5         3.0          5.2\
  \         2.0  virginica\n99:          6.2         3.4          5.4         2.3\
  \  virginica\n100:          5.9         3.0          5.1         1.8  virginica\n\
  dbClearResult(query)\n```\n\nSQLite 的用途或许在于允许处理比物理内存所能容纳的更大的数据。可以像我们演示的那样分块读取，也可以将大量数据从\
  \ R 中推送出去以释放内存。下一个例子需要你做一个选择。如果你的系统 RAM 有足够的可用空间，请继续执行 2 亿行的示例。否则，请将 `rnorm()` 中的变量数量改为较小的值，或者使用我们在线提供的代码来运行\
  \ 7000 万行的较小示例。\n\n此代码创建 2 亿个完全虚构的数据观测值，均值为 1，默认标准差为 1。如你所见，其大小约为 1.6 GB。当然，数据可以也可能会更大，但这作为测试用例来观察对你系统的影响已经足够了。在你的系统上运行大约需要\
  \ 5 分钟，所以请做好等待的准备。\n\n```r\nBiggerData <- rnorm(200000000, 1)\nBiggerData <-as.data.table(BiggerData)\n\
  object.size(BiggerData)\n1600001088 bytes\ndbWriteTable(con1, \"BiggerData\", BiggerData)\n\
  [1] TRUE\ndbListTables(con1)\n[1] \"BiggerData\" \"Iris\"\n```\n\n从 SQLite 中删除表在\
  \ R 中是可行的。注意，我们的数据库中有两个表。`BiggerData` 是一个大表，所以删除操作不是瞬间完成的。尽管如此，操作还是相当快的。SQLite 不会因为此操作而减少硬盘上数据库文件的大小。不过，它确实会在内部释放该空间，因此它不需要再增长。但是，在\
  \ SQLite 之外，这部分空间是无法使用的。用 SQL 术语来说，需要对数据库执行 `VACUUM` 操作。此过程可能需要文件大小的两倍，并且再次强调，该空间已释放用于新用途——只是在数据库内部。无论如何，在我们看来，这最好在\
  \ R 外部完成。\n\n```r\ndbRemoveTable(con1, \"BiggerData\")\n[1] TRUE\ndbListTables(con1)\n\
  [1] \"Iris\"\n```\n\n最后一段代码关闭了与数据库的连接。函数调用是 `dbDisconnect()`，我们在连接 `con1` 上调用它。成功调用返回\
  \ `TRUE`，我们通过 `dbIsValid()` 也看到它确实已关闭。在继续下一个数据库之前，我们还会删除一些不需要的数据。\n\n```r\ndbDisconnect(con1)\n\
  [1] TRUE\ndbIsValid(con1)\n[1] FALSE\nrm(diris_lite1, diris_lite2, diris_lite3,\
  \ diris_lite4)\n```\n\n我们之前说过空间没有被释放。由于这些是虚构的数据，要释放系统空间，只需在完成后使用 Windows 资源管理器删除\
  \ `C:/sqlite` 文件夹中的 `LiteDB.db` 文件即可。值得重申的是，数据库管理不应通过 R 进行。相反，R 可以在必要时原生存储一些数据，或者访问数据子集进行分析。\n\
  \n## PostgreSQL\n\nPostgreSQL 既开源又流行（根据某些来源，在所有数据库中排名第五）。这是一个非常先进的数据库，内部理解超过 30\
  \ 种数据类型。我们推荐 Neil Matthew 和 Richard Stones 所著的 *《Beginning Databases with PostgreSQL》*（Apress，2005\
  \ 年出版）。与 SQLite 类似，我们将引导你在本地机器上安装一个用于练习的版本。我们的目标是让你尽快学会使用 R 处理此数据库中的数据。更高级的数据库操作很可能不应在\
  \ R 中进行。\n\n当数据完整性、可靠性以及需要不同级别的用户访问权限时，推荐使用这种格式。另一方面，如果你只需要对静态但庞大的数据进行快速读取速度，这可能不是最佳选择。当然，我们承认，数据库的选择往往与我们想要什么关系不大，而更多地取决于数据存储在哪里。关于\
  \ PostgreSQL 的一个警告是，它确实有用户，并且这些用户拥有特定的权限。在我们的示例中，我们有一个超级用户。从安全角度来看，这是不明智的；从实际角度来看，数据库所有者不太可能授予分析师此类权限。如果你打算在这个环境中进行大量工作并希望获得更多练习，一个简单的方法是创建比我们简短的安装过程中所做的更多级别的用户。然后，在\
  \ R 中使用这些用户名和密码练习访问你的数据库。\n\n### 在 Windows 上安装 PostgreSQL\n\n访问 PostgreSQL 网站（[`www.postgresql.org/download/windows/`](https://www.postgresql.org/download/windows/)）并选择其中一个安装程序选项。我们选择了适用于\
  \ 64 位架构的最新稳定版本（非测试版）。下载后，你应该会得到一个名为类似 `postgresql-9.5.4-windows-x64.exe` 的文件，这就是你的安装程序。当然，你的版本号可能高于\
  \ 9.5.4，因为这是我们在撰写本章时的版本。\n\n继续安装程序，根据需要点击“下一步”按钮，并接受安装目录的默认设置。安装程序会要求为名为 `postgres`\
  \ 的数据库超级用户输入密码，我们将其设置为 `advancedr`。如果你选择不同的密码，请务必安全地记录下来。顺便提一下，这也会创建一个与超级用户同名的数据库。PostgreSQL\
  \ 默认端口为 5432，如果该端口未显示为默认选项，则你的计算机上可能已存在另一个版本的 PostgreSQL。虽然我们在 R 中配置端口，但我们强烈建议在初次练习时尽可能多地使用默认设置。再点击几次“下一步”接受默认设置，即可进入安装环节。在最后一步，你可能被询问关于\
  \ Stack Builder 的问题；它不是必需的，你可以在点击“完成”前取消选中该选项。\n\n至此，PostgreSQL 安装完毕，并且正在你的计算机上运行。如果你熟悉这个数据库，你可以直接向其中添加数据（并且可能不需要这本入门书）。我们通过\
  \ R 添加数据，并快速开始访问这些数据的子集。\n\n### PostgreSQL 与 R\n\n我们的首要任务是连接到数据库。这需要使用 `DBI` 包库并建立到我们数据库的链接。对于\
  \ PostgreSQL，我们需要用户名和密码。我们还需要告诉链接数据库的位置以及数据库类型。这个数据库是一个服务器，我们不需要告诉它文件路径，而是需要告诉它主机位置和端口。我们将这个第二次连接命名为\
  \ `con2`，然后使用 `RPostgreSQL` 库中的 `dbGetInfo()` 函数来测试它是否正确启动。返回了大量信息，因此我们可以开始操作：\n\
  \n```r\ndrv <- dbDriver(\"PostgreSQL\")\ncon2 <- dbConnect(drv, dbname = \"postgres\"\
  , host = \"localhost\",\n+                  port = 5432, user = \"postgres\", password\
  \ = \"advancedr\")\ndbGetInfo(con2)\n$host\n[1] \"localhost\"\n$port\n[1] \"5432\"\
  \n$user\n[1] \"postgres\"\n$dbname\n[1] \"postgres\"\n$serverVersion\n[1] \"9.5.4\"\
  \n$protocolVersion\n[1] 3\n$backendPId\n[1] 14220\n$rsId\nlist()\n```\n\n值得提及的是，这次我们在代码中直接以明文形式包含了\
  \ `dbConnect()` 的密码。这可能不是最安全的方法，应格外小心（尤其在这种情况下，因为这是我们的超级用户）。尽管如此，我们的连接是有效的，它已正确连接到端口\
  \ `5432`（虽然这是此数据库的默认端口，但并非总是如此），并且我们的主机是 `localhost`。如果你要连接到在线数据库，则需要将地址更改为该数据库的地址。现在连接已生效，我们查看数据库中有哪些表，并添加熟悉的\
  \ `iris` 数据集：\n\n```r\ndbListTables(con2)\ncharacter(0)\ndiris <- as.data.table(iris)\n\
  dbWriteTable(con2, \"iris\", diris, overwrite = TRUE)\n[1] TRUE\ndbListTables(con2)\n\
  [1] \"iris\"\ndbListFields(con2, \"iris\")\n[1] \"row.names\"    \"Sepal.Length\"\
  \ \"Sepal.Width\"  \"Petal.Length\"  \"Petal.Width\"  \"Species\"\n```\n\n这些函数的一个优点是它们名副其实。尽管如此，我们还是将你的注意力引向\
  \ `dbWriteTable()` 函数。虽然写入不是我们的主要关注点，但这个函数有 `overwrite` 和 `append` 选项，可以设置为 `FALSE`\
  \ 或 `TRUE`。两者在适当的情况下都很方便。我们将注意力转向从该数据库读取数据，并通过目视检查数据来确认我们成功地将 PostgreSQL 数据拉入了 R：\n\
  \n```r\ndiris_gre1 <- dbReadTable(con2, \"iris\")\ndiris_gre1 <- as.data.table(diris_gre1)\n\
  diris_gre1\nSepal.Length Sepal.Width Petal.Length Petal.Width   Species\n1:    \
  \      5.1         3.5          1.4         0.2    setosa\n2:          4.9     \
  \    3.0          1.4         0.2    setosa\n3:          4.7         3.2       \
  \   1.3         0.2    setosa\n...\n148:          6.5         3.0          5.2 \
  \        2.0 virginica\n149:          6.2         3.4          5.4         2.3 virginica\n\
  150:          5.9         3.0          5.1         1.8 virginica\n```\n\n一个基本的 SQL\
  \ 查询 `SELECT` 某些特定列，`FROM` 一个特定表，`WHERE` 特定列的特定行具有某个特征。我们使用 `dbSendQuery()` 将查询发送到\
  \ PostgreSQL 并执行。然后，使用 `dbFetch()` 将结果获取到 R 中。请注意，当我们获取数据时，我们只选择了具有此特征的前三行。最后，我们使用\
  \ `dbClearResult()` 清除 PostgreSQL 中的缓冲区，为后续查询做准备。\n\n```r\nquery <- dbSendQuery(con2,\
  \ 'SELECT * FROM iris WHERE \"Petal.Length\" > 2')\ndiris_gre2 <- dbFetch(query,\
  \ n=3)\nhead(diris_gre2)\nrow.names Sepal.Length Sepal.Width Petal.Length Petal.Width\
  \    Species\n1        51          7.0         3.2          4.7         1.4 versicolor\n\
  2        52          6.4         3.2          4.5         1.5 versicolor\n3    \
  \    53          6.9         3.1          4.9         1.5 versicolor\ndbClearResult(query)\n\
  [1] TRUE\n```\n\n这与我们之前对 SQLite 所做的非常相似，因为这两种数据库都是存储表格数据的 SQL 数据库。或者，如果我们只需要一列数据，我们会\
  \ `SELECT` 该特定列，而不是使用通配符值：\n\n```r\nquery <- dbSendQuery(con2, 'SELECT \"Petal.Length\"\
  \ FROM iris')\ndiris_gre3 <- dbFetch(query, n=6)\nhead(diris_gre3)\nPetal.Length\n\
  1          1.4\n2          1.4\n3          1.3\n4          1.5\n5          1.4\n\
  6          1.7\ndbClearResult(query)\n[1] TRUE\n```\n\n下一个查询从我们的 `iris` 数据集中返回 `Sepal.Length`\
  \ 和 `Species` 列，条件是花萼宽度不等于 `2.2`（一个任意数值）。值得注意的是，这只返回了 147 行，而不是全部的 150 行，当然也只返回了两列而非五列。将这个思路放大，你可以看到大数据如何被分解成相关的块用于分析。我们将\
  \ `query` 改为 `qu` 只是为了减少几个字符，以提高查询文本行的可读性。\n\n```r\nqu <- dbSendQuery(con2, 'SELECT\
  \ \"Sepal.Length\", \"Species\" FROM iris WHERE \"Sepal.Width\" <> 2.2')\ndiris_gre5\
  \ <- dbFetch(qu, n=-1)\nhead(diris_gre5)\nSepal.Length Species\n1          5.1 \
  \ setosa\n2          4.9  setosa\n3          4.7  setosa\n4          4.6  setosa\n\
  5          5.0  setosa\n6          5.4  setosa\ndbClearResult(qu)\n[1] TRUE\n```\n\
  \nPostgreSQL 的用途或许在于允许处理比物理内存所能容纳的更大的数据。可以像我们演示的那样分块读取，也可以将大量数据从 R 中推送出去以释放内存。下一个例子需要你做一个选择。如果你的系统\
  \ RAM 有足够的可用空间，请继续执行编写好的 2 亿行示例。否则，请将 `rnorm()` 中的变量数量改为较小的值，或者使用我们在线提供的代码来运行 7000\
  \ 万行的较小示例。\n\n此代码创建 2 亿个完全虚构的数据观测值，均值为 1，默认标准差为 1。如你所见，其大小约为 1.6 GB。当然，数据可以更大，但这作为测试用例来观察其如何在你的系统上工作可能已经足够了。运行大约需要\
  \ 5 分钟，所以请做好等待的准备。如果你已经在之前的步骤中运行过此代码，则无需重复。\n\n```r\nBiggerData <- rnorm(200000000,\
  \ 1)\nBiggerData <-as.data.table(BiggerData)\ndbWriteTable(con2, \"BiggerData\"\
  , BiggerData)\n[1] TRUE\ndbListTables(con2)\n[1] \"iris\"       \"BiggerData\"\n\
  ```\n\n再次强调，虽然我们能够（至少拥有超级用户权限）`DROP` 表，但它不会在 PostgreSQL 中（进而在我们的硬盘上）释放空间。同样，我们建议将\
  \ `VACUUM` 命令留给实际的数据库管理（因此建议直接对数据库使用 SQL，而不是在 R 中）。\n\n```r\ndbListTables(con2)\n\
  [1] \"iris\"       \"BiggerData\"\ndbRemoveTable(con2, \"BiggerData\")\n[1] TRUE\n\
  dbListTables(con2)\n[1] \"iris\"\n```\n\n要关闭此连接，需要两步而不是一步，因为我们必须断开与 PostgreSQL 的连接并卸载允许\
  \ `DBI` 建立该连接的驱动程序。如果成功，两者都将返回 `TRUE`。\n\n```r\ndbDisconnect(con2)\n[1] TRUE\ndbUnloadDriver(drv)\n\
  [1] TRUE\n```\n\n我们对 PostgreSQL 和关系型数据库的演示到此结束。让你现在掌握的知识更强大的真正方法是深入研究 SQL 语法，在更复杂的查询中使用\
  \ `dbSendQuery()`。不过目前，足够小量的数据应该能被读入 R，以便可以进行分析。我们将注意力转向一种不同类型的数据库。\n\n## MongoDB\n\
  \n如前所述，MongoDB 是不同的。这是一个文档存储数据库，是一种非关系型数据库。它避免了使用表，而是使用称为对象的文档。这些文档是 JavaScript\
  \ 对象表示法的二进制版本；由于它们是二进制的，MongoDB 将它们称为 BSON 对象。这种数据库用于可能是半结构化或非结构化的数据。这往往更接近于数据湖的概念（数据科学中日益流行的流行语），即可能需要存储和访问不同类型的数据。\n\
  \nJSON 和半结构化数据的一个强大功能是能够为一个特定实例将所有信息收集到一个地方。例如，假设我们将所有患者记录放在一个地方。不需要数十个表，其中每个患者占据一行，而每个表都类似于地址或诊断，我们将一个患者的全部记录存储在一个数据块中。当然，大多数患者都有地址，但也许并非所有患者的诊断部分都需要三种类型的血检面板。这就是半结构化数据。另一方面，如果你只是从网络上收集关于一家心仪公司的数据——包括新闻文章、社交媒体帖子或点赞，以及股市表现数据——那么这些数据的元素之间可能几乎没有相似性。尽管如此，MongoDB\
  \ 可以存储它，并且我们可以访问它。\n\n### 在 Windows 上安装 MongoDB\n\n访问 MongoDB 网站（[`www.mongodb.com/download-center`](http://www.mongodb.com/download-center)）会看到一个选项，可以下载支持\
  \ SSL 的 64 位版本的 MongoDB（截至本文撰写时为版本 3.2.8）。参见图 10-1。下载后，继续启动安装过程。选择“下一步”，阅读并同意许可文档，然后继续。我们使用了完整安装，然后点击了“安装”按钮。稍后，请点击“完成”。\n\
  \n**图 10-1.** 下载 MongoDB\n\n我们还需要下载 MongoDB 的示例数据库。我们将使用 MongoDB 的“导入示例数据集”页面 `https://docs.mongodb.com/getting-started/shell/import-data/`\
  \ 步骤 1 中提供的 `restaurants` 数据集（`primer-dataset.json`）。我们还将使用 `Ch10_MOCK_DATA.json`\
  \ 作为另一个数据集。这两个文件也可以作为本章代码包的一部分从本书网站获得。继续下载这两个文件，并将它们存储在 `C:\\Program Files\\MongoDB\\\
  Server\\3.2\\bin` 中。请记住，你使用的可能是版本 3.3 或更高版本，因此请务必根据需要更改此文件路径中的版本号。这样，MongoDB 就安装好了，我们也有了数据集。图\
  \ 10-2 显示了该文件夹。\n\n**图 10-2.** `MongoDB\\Server\\3.2\\bin` 文件夹\n\n现在按下 Windows 键，并保持按下状态，然后按\
  \ R 键。这将打开“运行”对话框。输入 `cmd` 并按回车。数据库需要一个数据目录。默认情况下，这位于主文件路径下（例如，Windows 下通常是 C 盘）。在命令提示符中，输入\
  \ `md \\data\\db` 来创建默认目录。注意 `md` 和 `\\data\\db` 之间的空格。接下来，仍在命令提示符中，输入 `cd C:\\\
