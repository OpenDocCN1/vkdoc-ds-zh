  \ `cmd` 已经填写好，直接按回车即可打开第二个命令提示符。在此命令提示符中，再次输入 `cd C:\\Program Files\\MongoDB\\Server\\\
  3.2\\bin` 并按回车。现在我们使用 MongoDB 本身来导入这两个数据集。运行如下代码，以下输出显示了结果：\n\n```\nmongoimport\
