- "# 对象的类型\n\n首先，我们需要构建语言的基础元素，在 R 语言中，这些元素被称为**对象**。我们从五种非常常见的对象类型开始介绍。\n\n`Logical`（逻辑型）对象只有两个值：`TRUE`（真）或\
  \ `FALSE`（假）。计算机是二进制机器，数据也常常在全有或全无的世界中进行记录和建模。这些逻辑值会很有用，其中 `TRUE` 的值为 `1`，`FALSE`\
  \ 的值为 `0`：\n\n```\nTRUE\n[1] TRUE\nFALSE\n[1] FALSE\n```\n\n或许你还记得代数教授快速念叨的评论，数字有许多类型或“风格”。整数包括零以及负数值。用集合符号表示，即\
  \ {…, -2, -1, 0, 1, 2, …}，这些数字对于人数统计或其他索引非常有用（当然，也适用于其他情况）。在 R 语言中，整数带有大写字母 `L`\
  \ 后缀。如果需要小数，则应使用双精度数值型对象。这些数字适用于等比率数据类型。复数也具有有用的属性，你可以完全按照预期理解它们，只需在虚数部分加上 `i` 后缀即可。R\
  \ 语言非常友好地支持所有这些数字，你只需输入所需的数字（记得根据需要添加 `L` 或 `i` 后缀）：\n\n```\n42L\n[1] 42\n1.5\n\
  [1] 1.5\n2+3i\n[1] 2+3i\n```\n\n名义级别的数据可以通过 `character`（字符型）类来存储，并用引号指定：\n\n```\n\
  \"a\" ## 字符型\n[1] \"a\"\n```\n\n当然，数值数据可能存在缺失值。这些缺失值的类型与该数据集中其余数据的类型一致（我们稍后会讨论数据存储）。不过，了解如何手动编写逻辑型、整型、双精度型、复数型或字符型的缺失值可能会有所帮助：\n\
  \n```\nNA\n[1] NA\nNA_integer_\n[1] NA\nNA_real_\n[1] NA\nNA_character_\n[1] NA\n\
  NA_complex_\n[1] NA\n```\n\n`Factor`（因子）是一种特殊的对象，对通用编程不太有用，但在统计学中使用相当频繁。一个因子变量表示该变量应被当作离散值处理。因子以整数形式存储，并带有标签来指示原始值：\n\
  \n```\nfactor(1:3)\n[1] 1 2 3\nLevels: 1 2 3\nfactor(c(\"a\", \"b\", \"c\"))\n[1]\
  \ a b c\nLevels: a b c\nfactor(letters[1:3])\n[1] a b c\nLevels: a b c\n```\n\n\
  现在我们转向数据结构，它可以存储我们刚才讨论过的对象类型（当然也包括更多类型）。向量是一种相对简单的数据存储对象。创建向量的一种简单方法是使用连接函数 `c()`：\n\
  \n```\nc(1, 2, 3)\n[1] 1 2 3\n```\n\n正如数学中那样，标量是长度仅为 1 的向量。在这个连续体的另一端，矩阵是一个同时具有行和列两个维度的向量。请注意矩阵填充数字\
  \ 1 到 6 的方式，即按列逐个计数：\n\n```\nc(1)\n[1] 1\nmatrix(c(1:6), nrow = 3, ncol = 2)\n[,1]\
  \ [,2]\n[1,]    1    4\n[2,]    2    5\n[3,]    3    6\n```\n\n所有向量，无论是标量、向量还是矩阵，都只能有一种数据类型（例如，整型、逻辑型或复数型）。如果需要多种类型的数据，那么将数据存储在列表中可能更有意义。`list`（列表）是一个对象向量，其中列表的每个元素可以是不同的类型。在下面的示例中，我们构建了一个包含字符型、向量和矩阵元素的列表：\n\
  \n```\nlist(\n+   c(\"a\"),\n+   c(1, 2, 3),\n+   matrix(c(1:6), nrow = 3, ncol\
  \ = 2)\n+   )\n[[1]]\n[1] \"a\"\n[[2]]\n[1] 1 2 3\n[[3]]\n[,1] [,2]\n[1,]    1 \
  \   4\n[2,]    2    5\n[3,]    3    6\n```\n\n列表的一种特殊类型是数据框，其中列表的每个元素长度相同（尽管对象类型不一定相同）。请看以下带有输出的说明性示例：\n\
  \n```\ndata.frame(1:3, 4:6)\nX1.3 X4.6\n1    1    4\n2    2    5\n3    3    6\n\
  ## 使用不等长对象会导致问题\ndata.frame( 1:3, 4:5)\nError in data.frame(1:3, 4:5) :\narguments\
  \ imply differing number of rows: 3, 2\ndata.frame( 1:3, letters[1:3])\nX1.3 letters.1.3.\n\
  1    1            a\n2    2            b\n3    3            c\n```\n\n由于速度快，我们在\
  \ R 语言中使用来自 `data.table` 包的数据表对象。数据表类似于数据框，但设计上更节省内存且速度更快。尽管我们推荐使用数据表，但我们也会展示一些使用数据框的示例，因为当你使用\
  \ R 语言时，许多其他人的代码包含数据框，并且实际上数据表继承了许多来自数据框的方法。\n\n```\nlibrary(data.table)\ndata.table(\
  \ 1:3, 4:6)\nV1 V2\n1:  1  4\n2:  2  5\n3:  3  6\n```\n\n在探索了多种对象类型之后，我们将注意力转向使用运算符和函数来操作这些对象的方法。\n\
  \n\n\n## 基本运算符与函数\n\n仅有对象对一门语言而言是不够的；有些事情需要动作来完成。运算符和函数就是编程世界中的动词。我们先从赋值开始，赋值有两种方式。与书面语言类似，更优雅的措辞往往比简单的平铺直叙更有帮助。因此，尽管\
  \ `=` 和 `<-` 都是赋值运算符，功能相同，但由于 `=` 在函数内部用于设置参数，为了清晰起见，我们建议在一般赋值时使用 `<-`。不过，我们还是会演示两种赋值技巧。赋值操作可以让对象拥有合理的名称；这能显著提升代码的可读性（对您未来的自己以及其他用户都是如此）。\n\
  \n除了为变量赋值，您还可以通过使用函数来检查具体信息。R 中的函数通常遵循这样的格式：函数名，后跟括号，括号内放入输入值，然后 R 给出输出。示例如下：\n\n\
  ```\nx <- 5\ny = 3\nx\n[1] 5\ny\n[1] 3\nis.integer(x)\n[1] FALSE\nis.double(y)\n\
  [1] TRUE\nis.vector(x)\n[1] TRUE\n```\n\n一旦对象被赋值，您就可以使用方括号来访问特定的对象元素。大多数计算机语言的索引从\
  \ `0` 或 `1` 开始。R 的索引从 `1` 开始。同时，请注意，您可以轻松地更改先前的赋值，几乎不会遇到麻烦，也不会收到警告；因此，谨慎地观察变量名称并认真地为代码添加注释是明智之举。\n\
  \n```\nx <- c(\"a\", \"b\", \"c\")\nx[1]\n[1] \"a\"\nis.vector(x)\n[1] TRUE\nis.vector(x[1])\n\
  [1] TRUE\nis.character(x[1])\n[1] TRUE\n```\n\n向量可能只需要一个索引，而更复杂的结构则需要更多的索引。对于您之前遇到的矩阵，第一个索引是行，第二个索引是列的位置。请注意，在构建并赋值一个矩阵之后，有多种方法可以访问元素的各种组合。这种仅访问部分元素的过程有时被称为子集化：\n\
  \n```\nx2 <- matrix(c(1:6), nrow = 3, ncol = 2)\nx2\n[,1] [,2]\n[1,]    1    4\n\
  [2,]    2    5\n[3,]    3    6\nx2[1, 2] ## 第 1 行，第 2 列\n[1] 4\nx2[1, ] ## 第 1 行所有列\n\
  [1] 1 4\nx2[, 1] ## 第 1 列所有行\n[1] 1 2 3\nx2[c(1, 2), ] ## 第 1 行和第 2 行\n[,1] [,2]\n\
  [1,]    1    4\n[2,]    2    5\nx2[c(1, 3), ] ## 第 1 行和第 3 行\n[,1] [,2]\n[1,]  \
  \  1    4\n[2,]    3    6\nx[-2] ## 删除第二个元素\n[1] \"a\" \"c\"\nx2[, -2] ## 删除第二列\n\
  [1] 1 2 3\nx2[-1, ] ## 删除第一行\n[,1] [,2]\n[1,]    2    5\n[2,]    3    6\nis.vector(x2)\n\
  [1] FALSE\nis.matrix(x2)\n[1] TRUE\n```\n\n访问和子集化列表可能稍显复杂，但对于后续技术的学习和掌握却至关重要。在单层方括号中使用单个索引会返回该位置上的整个元素（回想一下，对于列表，每个元素可能是一个向量或只是一个单独的对象）。使用双层方括号则返回该列表元素内部的对象——仅此而已。\n\
  \n因此，以下代码实际上是一个包含元素 `\"a\"` 的向量。同样，使用数据类型检查函数有助于学习如何解释各种代码片段。\n\n```\ny <- list(\
  \ c(\"a\"), c(1:3))\ny[1]\n[[1]]\n[1] \"a\"\nis.vector(y[1])\n[1] TRUE\nis.list(y[1])\n\
  [1] TRUE\nis.character(y[1])\n[1] FALSE\n```\n\n将此与下面的代码进行对比，下面的代码仅仅是元素 `\"a\"`\
  \ 本身：\n\n```\ny[[1]]\n[1] \"a\"\nis.vector(y[[1]])\n[1] TRUE\nis.list(y[[1]])\n\
  [1] FALSE\nis.character(y[[1]])\n[1] TRUE\n```\n\n实际上，您可以链式使用方括号，因此，可以访问列表的第二个元素（一个包含数字\
  \ 1 到 3 的向量），然后在该向量内访问第三个元素：\n\n```\ny[[2]][3]\n[1] 3\n```\n\n根据对象的类型，方括号几乎总是有效的，但可能还有其他访问组件的方法。对于有名称的数据框和列表，可以使用\
  \ `$` 运算符。请注意以下代码中方括号和美元符号是如何实现相同功能的：\n\n```\nx3 <- data.frame( A = 1:3, B = 4:6)\n\
  y2 <- list( C = c(\"a\"), D = c(1, 2, 3))\nx3$A\n[1] 1 2 3\ny2$C\n[1] \"a\"\nx3[[\"\
  A\"]]\n[1] 1 2 3\ny2[[\"C\"]]\n[1] \"a\"\n```\n\n请注意，尽管数据框和列表都是列表，但它们都不是矩阵：\n\n\
  ```\nis.list(x3)\n[1] TRUE\nis.list(y2)\n[1] TRUE\nis.matrix(x3)\n[1] FALSE\nis.matrix(y2)\n\
  [1] FALSE\n```\n\n此外，尽管不是矩阵，但由于其特殊性（即所有元素长度相等），数据框和数据表可以像矩阵一样进行索引：\n\n```\nx3[1,\
  \ 1]\n[1] 1\nx3[1, ]\nA B\n1 1 4\nx3[, 1]\n[1] 1 2 3\n```\n\n任何有名称的对象都可以通过使用名称而非位置编号来进行索引，前提是这些名称已经被设置：\n\
  \n```\nx3[1, \"A\"]\n[1] 1\nx3[, \"A\"]\n[1] 1 2 3\n```\n\n这同样适用于列名和行名，并且这些名称可以在构建矩阵之后建立：\n\
  \n```\nrownames(x3) <- c(\"first\", \"second\", \"third\")\nx3[\"second\", \"B\"\
  ]\n[1] 5\n```\n\n数据表使用略微不同的方法。选择行的方式几乎完全相同，但选择列则不需要引号。此外，您可以通过使用 `.()` 运算符，不带引号地按名称选择多个列。如果需要使用引号，可以通过设置\
  \ `with = FALSE` 选项来访问数据表，如下所示：\n\n```\nx4 <- data.table( A = 1:3, B = 4:6)\nx4[1,\
  \ ]\nA B\n1: 1 4\nx4[, A]\n[1] 1 2 3\nx4[1, A]\n[1] 1\nx4[1:2, .(A, B)]\nA B\n1:\
  \ 1 4\n2: 2 5\nx4[1, \"A\", with = FALSE]\nA\n1: 1\n```\n\n从技术上讲，方括号运算符也是函数。虽然通常不作为函数使用，但它们确实可以。大多数函数是有名称的，但方括号是一个特例，在常规函数格式中需要使用单引号，如以下示例所示：\n\
  \n```\n`[`(x, 1)\n[1] \"a\"\n`[`(x3, \"second\", \"A\")\n[1] 2\n```\n\n尽管我们一直在使用\
  \ `is.datatype()` 函数来更好地说明对象的类型，但实际上我们能做的更多。具体来说，您可以使用 `is.na()` 函数来检查某个值是否缺失：\n\
  \n```\nis.na(NA) ## 可以工作\n[1] TRUE\n```\n\n当然，上面的代码片段通常接受一个向量或矩阵元素作为参数，以判断其是否被填充。我们目前要介绍的最后（就目前而言）一个探索性函数是\
  \ `inherits()` 函数。当没有现成的 `is.class()` 函数可用时（这可能发生在开发了除您目前所见的核心类之外的其他特定类时），这个函数会很有帮助：\n\
  \n```\ninherits(x3, \"data.frame\")\n[1] TRUE\ninherits(x2, \"matrix\")\n[1] TRUE\n\
  ```\n\n您还可以将较低类型强制转换为较高类型。这种强制转换可能很有用，但也可能带来意想不到的后果。如果您将一个更高级的数据对象强制转换为较低级的类型，风险尤其大（请特别注意将整数强制转换的行为）。\n\
  \n```\nas.integer(3.8)\n[1] 3\nas.character(3)\n[1] \"3\"\nas.numeric(3)\n[1] 3\n\
  as.complex(3)\n[1] 3+0i\nas.factor(3)\n[1] 3\nLevels: 3\nas.matrix(3)\n[,1]\n[1,]\
  \    3\nas.data.frame(3)\n\n1 3\nas.list(3)\n[[1]]\n[1] 3\nas.logical(\"a\")\n[1]\
  \ NA\nas.logical(3)\n[1] TRUE\nas.numeric(\"a\")\n[1] NA\nWarning message:\nNAs\
  \ introduced by coercion\n```\n\n强制转换可能很有用。尽管如此，必须谨慎使用。在您结束本部分的学习之前，如果这些内容有任何新东西，请务必尝试我们之前示例中使用的不同输入进行实验！实验永远没有坏处，并且可以是学习的有力途径。\n\
  \n现在，让我们把注意力转向数学和逻辑运算符与函数。\n\n\n\n## 数学运算符与函数\n\n多个运算符可用于比较。这些将在后续学习循环和构建自定义函数时派上用场。同样实用的还有符号逻辑形式。我们先从一些基本比较开始，并承认我们对数字\
  \ 4 有一种奇怪的偏爱：\n\n```\n4 > 4\n[1] FALSE\n4 >= 4\n[1] TRUE\n4 < 4\n[1] FALSE\n4 <=\
  \ 4\n[1] TRUE\n4 == 4\n[1] TRUE\n4 != 4\n[1] FALSE\n```\n\n现在有必要指出，尽管上述代码可能有用，但数值之间往往只存在微小差异——尤其是在依赖计算机浮点（无理数）表示的编程环境中。因此，我们经常检查数值是否在容差范围内接近：\n\
  \n```\nall.equal(1, 1.00000002, tolerance = .00001)\n[1] TRUE\n```\n\n在符号逻辑中，`AND`\
  \ 和 `OR` 是对两个对象进行的有用比较。在 R 语言中，我们使用 `&` 表示 `AND`，使用 `|` 表示 `OR`。复杂的逻辑测试可以由这些简单结构构建：\n\
  \n```\nTRUE | FALSE\n[1] TRUE\nFALSE | TRUE\n[1] TRUE\nTRUE & TRUE\n[1] TRUE\nTRUE\
  \ & FALSE\n[1] FALSE\n```\n\n到目前为止提到的所有逻辑测试同样适用于向量和单个对象：\n\n```\n1:3 >= 3:1\n[1]\
  \ FALSE  TRUE  TRUE\nc(TRUE, TRUE) | c(TRUE, FALSE)\n[1] TRUE TRUE\nc(TRUE, TRUE)\
  \ & c(TRUE, FALSE)\n[1]  TRUE FALSE\n```\n\n如果你只想要单个结果（例如用于 `if`-`else` 流程控制），可以使用\
  \ `&&` 或 `||`，它们一旦确定最终结果就会停止评估。请仔细研读以下代码和输出：\n\n```\nW\nError: object 'W' not found\n\
  TRUE | W\nError: object 'W' not found\nTRUE || W\n[1] TRUE\nW || TRUE\nError: object\
  \ 'W' not found\nFALSE & W\nError: object 'W' not found\nFALSE && W\n[1] FALSE\n\
  ```\n\n请注意，双运算符实际上并非向量化操作。它们仅使用任何向量的第一个元素：\n\n```\nc(TRUE, TRUE) || c(TRUE, FALSE)\n\
  [1] TRUE\nc(TRUE, TRUE) && c(TRUE, FALSE)\n[1] TRUE\n```\n\n`any()` 和 `all()` 函数在这些上下文中也同样有用：\n\
  \n```\nany(c(TRUE, FALSE, FALSE))\n[1] TRUE\nall(c(TRUE, FALSE, TRUE))\n[1] FALSE\n\
  all(c(TRUE, TRUE, TRUE))\n[1] TRUE\n```\n\n现在我们将注意力转向数学运算符而非逻辑运算符。R 在数学方面功能强大，可以执行大多数数学计算。因此，虽然我们介绍了一些函数，但仍有许多未涉及。更多详情可参考\
  \ `?Arithmetic`。（一如既往地）了解计算机执行数学计算的方式非常重要。能够直接编写定制解决方案固然强大，但自由的定制也伴随着相应的责任。请仔细查看以下数学运算（由于实现方式的选择，它们的行为可能与预期不同）：\n\
  \n```\n3 + 3\n[1] 6\n3 - 3\n[1] 0\n3 * 3\n[1] 9\n3 / 3\n[1] 1\n(-27) ^ (1/3)\n[1]\
  \ NaN\n4 %/% .7\n[1] 5\n4 %% .3\n[1] 0.1\n```\n\nR 还有一些名称直观的常用函数：\n\n```\nsqrt(3)\n\
  [1] 1.732051\nabs(-3)\n[1] 3\nexp(1)\n[1] 2.718282\nlog(2.71)\n[1] 0.9969486\n```\n\
  \n三角函数也有其用武之地，`?Trig` 可以调出相关函数的完整列表。为简洁起见，我们展示了余弦函数的调用 `cos()`。请注意余弦函数输出中再次出现的微小误差：\n\
  \n```\ncos(3.1415)\n[1] -1\n```\n\n我们以矩阵运算的简短示例来结束本节及本章。标量运算使用基本算术运算符。要执行矩阵乘法，我们使用\
  \ `%*%`：\n\n```\nx2\n[,1] [,2]\n[1,]    1    4\n[2,]    2    5\n[3,]    3    6\n\
  x2 * 3\n[,1] [,2]\n[1,]    3   12\n[2,]    6   15\n[3,]    9   18\nx2 + 3\n[,1]\
  \ [,2]\n[1,]    4    7\n[2,]    5    8\n[3,]    6    9\nx2 %*% matrix(c(1, 1), 2)\n\
  [,1]\n[1,]    5\n[2,]    7\n[3,]    9\n```\n\n矩阵还有一些在线性代数中相当常用的操作。我们假设你对建模中某些应用背后的数学有一定的了解，并将在后续章节中根据需要讨论相应数量的数学内容。尽管如此，这里似乎是展示如何编写转置、叉积和转置叉积代码的好时机。我们既展示了实现叉积和转置叉积的原始代码，也展示了可能用到的更简易的函数调用。顺便提一下，这种情况在\
  \ R 中相当常见。通过各类扩展包，许多技术都以相当清晰的函数调用形式实现。以下是示例：\n\n```\nt(x2)\n[,1] [,2] [,3]\n[1,]\
  \    1    2    3\n[2,]    4    5    6\nt(x2) %*% x2\n[,1] [,2]\n[1,]   14   32\n\
  [2,]   32   77\ncrossprod(x2)\n[,1] [,2]\n[1,]   14   32\n[2,]   32   77\nx2 %*%\
  \ t(x2)\n[,1] [,2] [,3]\n[1,]   17   22   27\n[2,]   22   29   36\n[3,]   27   36\
  \   45\ntcrossprod(x2)\n[,1] [,2] [,3]\n[1,]   17   22   27\n[2,]   22   29   36\n\
  [3,]   27   36   45\n```\n\n我们以一些总结性思考结束本章。首先，正如你刚刚所见，在 R 中，常常已经有其他人完成了繁重的工作，通过编写一个能直接生成所需结果的函数来实现。当然，这些友好程序员的工作成果仅受\
  \ R 自身底层约束及其获取免费 GitHub 账户能力的限制。因此，至少理解一些使 R 得以运行的基础命令和运算符会很有帮助。其次，R 运行在计算机上，对于那些尚未接触过计算机逻辑的人而言，由于硬件结构（以及随之而来的软件实现选择）的不同，会存在差异。\n\
  \n接下来，让我们专注于理解实现细节，以及如何快速将数据读入和导出 R 环境。\n\n## 编程实用工具\n\n使用 R 执行更高级的操作需要创建可能从未存在过的新事物。要创造新事物，需要对预构建函数的具体工作方式有细致入微的理解。本章将讨论如何以及从哪里为现有功能寻找帮助和文档，R\
  \ 如何与你的计算机系统和文件交互，以及数据输入输出的方方面面。和之前一样，请根据需求自由选择阅读本章的哪些部分。我们从帮助文件和文档开始。\n\n> **注意：**\
  \ 本书中，粗体代码表示需要运行的代码。非粗体代码代表命令行输出结果，或仅为提供信息而不必实际运行的代码。\n\n\n\n## 帮助与文档\n\nR 语言社区拥有众多资源来帮助用户。从预构建的函数到软件包中按主题分类的整套函数，支持方式多种多样。`?`\
  \ 和 `help` 都是访问对象或函数信息的有效途径。对于常见对象，R 不仅提供了关于输入（函数）等具体内容的详尽文档，还详细说明了这些输入预期接收的内容。此外，通常还会有详细的示例来展示具体用法。图\
  \ 2-1 展示了使用这两个函数并配合加法运算符时输出的结果：\n\n![A393929_1_En_2_Fig1_HTML.jpg](img/A393929_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1.\n\n算术运算符的帮助文档\n\n```\n?'+'\nhelp(\"+\")\n```\n\n请注意图 2-1 底部内容，算术运算符的文档甚至贴心地提供了具体信息，指出输出结果可能因平台而异。值得注意的是，并非所有函数都拥有如此完整的现成文档，但对于大多数常见函数和软件包而言，均可获取到极为丰富的信息。编写能够复现预期结果且不依赖平台和环境的代码并非总是可行。稍后讨论调试时，这种对各函数的高级了解将会很有帮助。\n\
  \n当然，当你已经知道要使用的对象或函数，只需要更多细节时，这种帮助更为有用。当需要实现全新的功能时，参考手册会有所帮助。其中一个站点是由 R 核心开发团队维护的\
  \ [`https://cran.r-project.org/manuals.html`](https://cran.r-project.org/manuals.html)。\n\
  \n现在，我们将注意力转向 R 访问系统文件的方式。\n\n## 系统与文件\n\n在 Windows 环境中，R 可能是实现文件操作自动化的非常有效的方式。大多数\
  \ IT 部门都愿意安装 R，并且 R 拥有与你相同的文件权限。从创建文件、移动文件到检查日期，R 提供了多种便捷函数，用于从系统获取信息并实现文件管理自动化。我们的观察是，基于\
  \ Unix 的系统可能拥有更优雅的方式来通过命令行处理此类场景。\n\nR 访问系统的一个有用特性是，它可以发现运行 R 的系统的当前日期、时间和时区。这有助于检测新文件，或用于给文件添加时间戳（后续会详述）。需要注意的是，这些信息当然依赖于系统环境的准确性，因此在用于高风险项目时应谨慎。\n\
  \n```\nSys.Date()\n[1] \"2016-02-13\"\nSys.time()\n[1] \"2016-02-13 16:58:36 CST\"\
  \nSys.timezone()\n[1] \"America/Chicago\"\n```\n\n这些命令的帮助文档提出了有用的建议来提高输出精度，甚至可能达到毫秒或微秒级别。\n\
  \n现在让我们把注意力转向各种文件管理函数。它们都采用 `file.*` 格式，并将一个字符向量作为其第一个参数，该字符向量应该是当前工作目录下的文件名或是一个路径加文件名。我们从工作目录中的一个文本文件\
  \ `ch02_text.txt` 开始。\n\n函数 `file.exists()` 只接受一个字符串输入，即文件名或路径加文件名。如果只是文件名，它只检查工作目录。该工作目录可通过\
  \ `getwd()` 函数验证。如果想要检查其他目录中的文件，可以通过在字符串中提供完整文件路径来实现。该函数返回一个逻辑值，即 `TRUE` 或 `FALSE`。根据用户对特定文件的权限，你可能无法获得该文件的预期结果。\n\
  \n```\ngetwd()\n[1] \"C:/Books/Apress_AdvancedR/RFiles\"\nfile.exists(\"ch02_text.txt\"\
  )\n[1] TRUE\nfile.exists(\"NOSUCHFILE.FAKE\")\n[1] FALSE\nfile.exists(\"C:/Books/Apress_AdvancedR/Apress_AdvancedR_Proposal.docx\"\
  )\n[1] TRUE\n```\n\n前面的函数检查的是文件是否存在，而另一个函数则测试我们是否有权访问一个文件。函数 `file.access` 接受类似的输入，但它还接受第二个参数。要测试是否存在，第二个参数为\
  \ `0`。要测试可执行权限，使用 `1`；要测试写入权限，使用 `2`。如果你想测试读取文件的能力，使用 `4`。该函数返回一个整数向量，`0` 表示具有相应权限，`-1`\
  \ 表示不具有相应权限。注意，该函数的默认设置是测试文件是否存在。以下是 `file.access` 的示例：\n\n```\nfile.access(\"ch02_text.txt\"\
  )\nch02_text.txt\n\nfile.access(\"ch02_text.txt\", mode = 0)\nch02_text.txt\n\n\
  file.access(\"ch02_text.txt\", mode = 1)\nch02_text.txt\n\nfile.access(\"ch02_text.txt\"\
  , mode = 2)\nch02_text.txt\n\nfile.access(\"ch02_text.txt\", mode = 4)\nch02_text.txt\n\
  \n```\n\n接下来，我们将注意力转向使用 `file.info` 函数获取关于文件修改、变更或访问时间的更详细信息。该函数也接受字符串作为输入。其输出提供有关文件大小的信息；是否为目录；按读取、写入和执行顺序排列的文件权限整数；最后修改时间；最后变更时间；最后访问时间；最后，文件是否可执行：\n\
  \n```\nfile.info(\"ch02_text.txt\", \"chapter01.R\")\nsize isdir mode          \
  \     mtime               ctime               atime exe\nch02_text.txt   31 FALSE\
  \  666 2016-02-13 17:00:16 2016-02-13 16:59:57 2016-02-13 16:59:57  no\nchapter01.R\
  \   7983 FALSE  666 2016-01-01 02:53:17 2016-01-05 12:26:39 2016-01-01 02:53:17\
  \  no\n```\n\n\n\n请注意，你可以通过 `sys.setFileTime` 函数修改修改时间。这在某些时候会很有用，尽管其精确度和准确度取决于环境。以下是一个示例：\n\
  \n```\nnewTime<-Sys.time()-20\nnewTime\n[1] \"2016-02-13 20:25:53 CST\"\nfile.info(\"\
  ch02_text.txt\")\nsize isdir mode               mtime               ctime      \
  \         atime exe\nch02_text.txt   31 FALSE  666 2016-02-13 17:00:16 2016-02-13\
  \ 16:59:57 2016-02-13 16:59:57  no\nSys.setFileTime(\"ch02_text.txt\", newTime)\n\
  file.info(\"ch02_text.txt\")\nsize isdir mode               mtime              \
  \ ctime               atime exe\nch02_text.txt   31 FALSE  666 2016-02-13 20:25:53\
  \ 2016-02-13 16:59:57 2016-02-13 16:59:57  no\n```\n\n接下来，我们把注意力转向文件的创建和删除。`file.create`\
  \ 和 `file.remove` 函数的功能正如你所期待的那样。它们会返回逻辑值 `TRUE` 或 `FALSE`，甚至可以提供更多细节：\n\n```\n\
  file.create(\"ch02_created.docx\", showWarnings = TRUE)\n[1] TRUE\nfile.remove(\"\
  ch02_created.docx\")\n[1] TRUE\nfile.remove(\"NOSUCHFILE.FAKE\")\n[1] FALSE\nWarning\
  \ message:\nIn file.remove(\"NOSUCHFILE.FAKE\") :\ncannot remove file 'NOSUCHFILE.FAKE',\
  \ reason 'No such file or directory'\n```\n\n文件还可以被复制和重命名。`file.copy` 函数可以被授予覆盖权限，甚至可以通过\
  \ `recursive=TRUE` 选项来复制整个文件夹及其子文件夹。此外，它还可以选择复制文件的模式（或权限），以及复制文件的日期数据（当然，也可以让副本拥有新的修改日期）。以下代码示例展示了这一切是如何工作的：\n\
  \n```\nSys.time()\n[1] \"2016-02-13 21:05:29 CST\"\nfile.copy(\"ch02_text.txt\"\
  , \"ch02_copy.txt\", overwrite = TRUE, recursive = FALSE, copy.mode = TRUE, copy.date\
  \ = TRUE)\n[1] TRUE\nfile.info(\"ch02_copy.txt\")\nsize isdir mode             \
  \  mtime               ctime               atime exe\nch02_copy.txt   31 FALSE \
  \ 666 2016-02-13 20:25:53 2016-02-13 21:05:30 2016-02-13 21:05:30  no\nfile.rename(\"\
  ch02_copy.txt\", \"ch02.txt\")\n[1] TRUE\n```\n\n`file.append` 函数用于将两个文件拼接在一起。这对于某些文件类型来说效果不错。但如果简单使用，可能会产生不幸的后果。虽然下面的代码展示了如何执行此操作，但请特别注意图\
  \ 2-2 和图 2-3。对于文本文件来说，这个过程运行得很好。但对于 Microsoft PowerPoint 文件，情况就没那么理想了。请记住，这里关注 PowerPoint\
  \ 文件本身的意义不大（两位作者都不认为有人会真的用 R 来处理这类文件），更多的是想强调，文件操作中的细微差别通常需要谨慎对待。请注意，R 认为这两个操作都成功了：\n\
