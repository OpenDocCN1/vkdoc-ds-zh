  ch02_text.txt   31 FALSE  666 2016-02-13 17:00:16 2016-02-13 16:59:57 2016-02-13
  16:59:57  no

  chapter01.R   7983 FALSE  666 2016-01-01 02:53:17 2016-01-05 12:26:39 2016-01-01
  02:53:17  no

  ```




  请注意，您可以通过`sys.setFileTime`函数修改文件的修改时间。这在某些情况下会很有帮助，尽管其精确度和准确性取决于环境。以下是一个示例：


