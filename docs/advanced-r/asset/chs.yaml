- '# 引言


  在数据科学日益普及的时代，R 语言已成为最流行的编程语言之一。随着 R 语言和数据科学逐渐成为主流，越来越多没有经过统计计算或数据科学专门训练的 R 语言用户涌现，因此对能够弥合仅具备统计学或编程入门背景的应用型用户与高级数据分析之间差距的书籍和资源的需求日益增长。本书重点介绍如何使用
  R 语言的高级编程来加速数据分析和数据科学中的日常任务。本书的独特之处还在于涵盖了如何在云端配置 R 语言，并为定期重复的分析（例如公司月度销售分析、学校学生成绩、入学率、辍学人数以及未来入学率的预测等）生成动态报告。


  第 1 章至第 6 章重点介绍比 Apress 出版的《Beginning R》更高级的编程技术。


  第 7 章至第 10 章则开发强大的数据管理方法，包括令人兴奋且（相对）新颖的`data.table`。


  在此基础上，我们深入探讨使用 R 语言进行云计算的现代（且稍显前沿）世界。在第 11 章至第 14 章中，我们将从头开始引导您在亚马逊云上启动 R 语言。


  最后，第 15 章为您提供了有关动态文档和报告的扎实技术。


  '
