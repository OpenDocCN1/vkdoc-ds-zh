  \    0.2985507          0.22010870\n5            0.24846045   0.3012790    0.3270962\
  \          0.12316438\n6            0.09044028   0.3910391    0.3542198        \
  \  0.16430076\n```\n\n我们将使用最后一个包 `xlsx`，通过 Excel 再做一个最终示例。这个包依赖于 `rJava`（Urbanek,\
  \ 2016），而这一点与您使用的 R 版本有关。我们这些大多无所畏惧的作者尽可能坚持使用 64 位版本，这需要安装 64 位版本的 Java。如果未安装，R\
  \ 会毫不客气地频繁报错。请注意，工作表名称可以具体指定，这使得 `read.xlsx` 函数非常适合提取特定数据片段。\n\n```\ncountiesILExcel\
  \ <- read.xlsx(\"Ch02/Counties_in_Illinois.xlsx\", sheetName = \"Counties_in_Illinois\"\
