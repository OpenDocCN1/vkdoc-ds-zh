  \ `dplyr` 的整个使用过程中都能顺利转换。最好还是用 `dplyr` 的“母语”来使用它。不过，为了完整性，下面给出两个函数调用示例：\n\n```\n\
  diris[, v]\n\n# A tibble: 150 x 1\nSepal.Length\n\n1          4.3\n2          4.4\n\
  3          4.4\n4          4.4\n5          4.5\n\n# ... 还有 145 行\ndiris[, 1]\n\n\
