  \ \\pi$ 是实现它的方式。\n### 我喜欢删除线；我不太确定三级标题的用法。\n在撰写报告时，我经常发现我想说某事是~~绝对愚蠢的~~与关键利益相关者明显相关的。\n\
  ###### 如果你曾经写过需要六级标题的内容\n那么我相信，正如这个无序列表所暗示的：\n* 你需要从现在开始拥抱更少的秩序\n- 你是否考虑过其他职业？\n\
  ```{r echo=FALSE}\nsummary(diris)\n```\n然而，请注意，可以同时包含代码和控制台输出：\n```{r}\nhist(diris$Sepal.Length)\n\
  ```\n```\n\n编织上述代码的结果如图 15-1 所示。\n\n![A393929_1_En_15_Fig1_HTML.jpg](img/A393929_1_En_15_Fig1_HTML.jpg)\n\
  \n**图 15-1.** 一个简单动态文档的 HTML 输出\n\n正如你所想象的，正是摘要数据或图形可以根据任何输入轻松地重新生成。事实上，其中一位作者使用动态文档为入门统计学课程的学生创建了案例研究（以及案例研究答案）。使用不同的种子生成伪随机数据非常容易，这允许每个学生拥有独特的数据集（以及几个主题）。它还允许为快速评分提供解答密钥。\n\
  \n现在你已经对 `Rmarkdown` 有了一个概览，让我们以合理的代码块来探索之前的代码。第一个代码块是 YAML，它代表 Yet Another Markup\
  \ Language 或者可能是递归定义的 `YAML Ain’t Markup Language` (YAML, 2016) 头部。在最简单的情况下，它可能只包含关于标题、作者、日期和输出类型的信息。在这里，对于本文档，我们选择了\
