  \ `cache = TRUE` 而不是默认的 `FALSE`。这会存储结果。我们经常使用 `echo=FALSE`，它可以防止显示代码本身，但不会阻止代码结果的显示。请注意，在接下来的第一个代码块中，我们的最终文档里没有任何代码运行过的迹象。然而，第二个代码块仍然显示了\
