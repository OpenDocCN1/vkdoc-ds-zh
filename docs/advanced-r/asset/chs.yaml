  \ `COMMAND` 和 `NETWORK` 反馈）。关闭第二个窗口后，我们将注意力转向 R。\n\n### MongoDB 与 R\n\nMongoDB 确实有设置用户名、密码和多个数据库的选项。由于我们没有设置这些，我们只需在第三个连接\
  \ `con3` 上连接到我们的本地服务器。与我们前两个连接不同，这使用来自 `RMongo` 包的新命令 `mongoDbConnect()`。此外，请注意它要求主机为\
  \ localhost，并指定了端口。如果你要通过网络连接到 MongoDB 实例，请确保识别 IP 地址及其端口。当然，还要向管理员询问你要访问的数据库名称。最后，查清你仅有读取权限还是更多权限。在别人的数据库上进行实验是不合适的！\n\
  \n```r\ncon3<-mongoDbConnect(\"test\", host = \"127.0.0.1\", port=27017)\n```\n\n\
  如果需要身份验证，你需要运行第二个命令。在你的 R 会话中输入并运行 `dbAuthenticate(con3, username, password)`。这里需要提醒一句：根据所访问\
  \ MongoDB 的版本、本地机器上安装的 Java 版本以及数据库管理员设置的身份验证协议，此功能可能有效也可能无效。我们知道这是一个模糊的表述。截至本书撰写时，身份验证似乎可行，但似乎有迹象表明并非对所有用户都总是如此。\n\
  \n更糟糕的是，目前，函数调用 `dbShowCollections()` 在最新版本的 MongoDB 上不起作用。如果你正在连接一个成熟的数据库，它可能正在使用较旧版本，你可能能够看到集合。`RMongo`\
  \ 包大约有三年的历史了，我们希望它能得到更新。现在，我们只能提供一个冷酷的事实：连接到数据库和数据整理通常很少是容易的。幸运的是，我们知道我们的集合存储在 `restaurants`\
  \ 和 `mock` 中。\n\n因此，我们可以继续从我们的集合中访问一些数据，以确认我们确实能够将数据从 MongoDB 读取到 R 中。请注意，函数调用 `dbGetQuery()`\
  \ 至少需要三个参数。首先，它需要连接；其次，它需要一个包含集合信息的文本字符串。第三个参数是用于访问我们数据的搜索项。在第一个案例中，我们没有定义任何搜索项，因此只使用\
  \ `{}` 作为该形式参数的占位符。最后两个参数是可选的。`0` 告诉我们从列表的开头开始，`8` 表示我们只想要接下来的八个条目。换句话说，我们没有跳过任何条目，并将返回的条目限制为八个。我们编辑了最终输出以提高可读性，并在图\
  \ 10-3 中显示了 `View()` 的部分结果。\n\n**图 10-3.** `View(output1)` 命令的部分结果\n\n```r\noutput1\
  \ <- dbGetQuery(con3, 'restaurants' , \"{}\", 0,8 )\nis.data.frame(output1)\n[1]\
  \ TRUE\nnames(output1)\n[1] \"address\"  \"restaurant_id\"  \"name\"  \"cuisine\"\
  \      \"X_id\"  \"borough\"      \"grades\"\noutput1[1,]\naddress\n{ \"building\"\
  \ : \"2206\" , \"coord\" : [ -74.1377286 , 40.6119572] , \"street\" : \"Victory\
