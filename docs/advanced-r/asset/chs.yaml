  你不仅可以用 R 操作文件，还可以创建目录（即文件夹）。相应的函数是 `dir.create`，它的行为正如你所期望的那样。这里我们展示了一个函数示例，其创建的目录如图\
  \ 2-4 所示：\n\n![A393929_1_En_2_Fig4_HTML.jpg](img/A393929_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4.\n\n创建的 folder1 目录\n\n```\ndir.create(\"folder1\")\n```\n\n这些命令适用于用户有权访问和操作的任何文件。其中一位作者就用这些命令将数据从不同部门拥有的多个共享驱动器中移动出来，最终将结果文件发布到一个网站上。一旦你理解了后续章节中的循环和函数，你将能够自动化大部分文件管理工作。\n\
  \n## 输入\n\n将新数据导入 R 是接下来的挑战。数据集通常很大，尽管一些高效的技术也适用于较小的数据集。以制表符或逗号分隔的文本文件是导入 R 的最直接方式。接下来，常见的数据文件类型包括\
  \ Microsoft Excel、SPSS、SAS 和 Stata。更一般地说，可以相当肯定地认为，可能存在一个 R 包可以处理你想要的任何文件类型的导入。如有需要，甚至可以输入\
  \ PDF 和 Microsoft Word 文件（从词云到更具预测性的应用的文本分析自然会想到这一点）。对于大多数这类记录，输入过程都是相似的，因此也许没有必要面面俱到，更重要的是建立扎实的原则。请务必访问本书的\
  \ Apress 网站下载本书的代码包。在接下来的示例中，我们使用了第 [02](http://dx.doi.org/10.1007/978-1-4842-2077-1_02)\
  \ 章文件夹中的文件；其中使用了 `Counties in Illinois` 文件（伊利诺伊州所有县，2016 年）和 `rscfp2013` 文件（DADS，2016\
  \ 年）。\n\n我们从 R 中的一个函数 `read.table()` 开始，它可以读取几种更基本的文件类型，并将其作为数据框读入。与大多数输入函数一样，它有几个选项，但并非所有选项在任何特定情况下都是必需的。根据读入\
  \ R 的数据类型，可能需要多次尝试才能以方便使用和操作的方式成功读取数据。在这种情况下，`View` 函数会很有帮助，其输出如图 2-5 所示。\n\n![A393929_1_En_2_Fig5_HTML.jpg](img/A393929_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5.\n\n`View()` 函数的输出\n\n```\ncountiesILCSV<-read.table(\"Ch02/Counties_in_Illinois.csv\"\
  , header = TRUE, sep = \",\")\nView(countiesILCSV)\n```\n\n我们使用三个包——`Hmisc`（Harrell，2016\
  \ 年）、`xlsx`（Dragulescu，2014 年）和 `foreign`（R 核心团队，2015 年）——来演示从各种文件类型的输入。一个观察结果是，文件类型实际上可能非常大。如图\
  \ 2-6 所示，`read.dta` 能够快速、便捷地导入包含超过 30,000 条记录的 Stata 文件。\n\n![A393929_1_En_2_Fig6_HTML.jpg](img/A393929_1_En_2_Fig6_HTML.jpg)\n\
