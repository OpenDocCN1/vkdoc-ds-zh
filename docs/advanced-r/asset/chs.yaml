  \n# ... 还有 145 行\n```\n\n同样，当需要进行变量排除时，我们设置一个变量来保存向量，并使用 `paste0()` 将否定符号粘贴到该变量的前面，然后使用\
  \ `select_()` 调用来处理字符串。或者，我们可以在常用的 `select()` 函数中使用 `select` 辅助函数 `one_of()` 进行否定操作。无论哪种方式，我们都能得到相同的结果：\n\
  \n```\nex                   \n1         3.0          1.1         0.1  setosa\n2\
