- '# 1. 编程基础


  电子补充材料：本章的在线版本（doi：[10.1007/978-1-4842-2077-1_1](http://dx.doi.org/10.1007/978-1-4842-2077-1_1)）包含补充材料，仅供授权用户使用。


  与大多数语言一样，更高级的用法需要深入理解其底层结构。本章涵盖这些编程基础，本书第一部分（至第 6 章）将讲解一些高级编程技术。我们从 R 语言的基本构建块开始，这些构建块将奠定我们编程、数据管理和云分析的基础。


  在深入探讨 R 语言之前，有必要遵循一些通用原则。首先，乐于尝试是好的。动手实践学习比单纯阅读要有效得多。请下载本书附带的源文件，并尝试新事物！


  其次，熟悉 `?` 函数会很有帮助。只需在 R 控制台中输入 `?` 后紧跟文本，即可调出某种形式的帮助文档。我们稍后会详细介绍函数，但这个功能太有用了，不能等到那时才用。


  最后，在进入你购买本书的真正原因之前，有一点提醒：这是一本应用型书籍。可能会跳过或忽略 R 语言的某些主题和领域。虽然作为作者，我们倾向于认为这是因为经过精心筛选，但也可能是由于我们认知有限。可能存在完成这些任务的其他方法，或者还有其他值得学习的好主题。我们的目标是让你尽快掌握一些实用技能。祝你好运！


  ## 高级 R 软件选择


  本书是为 R 语言高级用户编写的。需要指出的是，在大部分示例中，我们继续像《R 语言入门：统计编程导论》（Apress, 2015）那样使用 RStudio（[www.rstudio.com/products/rstudio/download/](http://www.rstudio.com/products/rstudio/download/)）。我们也假设你在使用微软
  Windows（[www.microsoft.com](http://www.microsoft.com)）操作系统，但后续章节中，我们通过 Ubuntu（[www.ubuntu.com](http://www.ubuntu.com)）来深入探讨在云中使用
  R。不同之处在于底层的 R 发行版。


  我们将使用 Microsoft R Open（MRO），它与当前版本的 R 完全兼容。这带来了后台运行的性能增强。我们还使用 Intel 数学核心函数库（Intel
  MKL），该库可在与 MRO 相同的网站（[`mran.microsoft.com/download/`](https://mran.microsoft.com/download/)）下载。事实上，在本书付印之际，这两个软件已在最新版本中整合。希望这一趋势能延续下去。这些下载过程非常简单，我们预计熟悉
  R 和 RStudio 的读者能够轻松完成安装。在 Windows（以及基于 Linux 的操作系统）上，MKL 会用优化后的系统替代默认的线性代数系统，并允许对线性代数操作（如许多统计算法中使用的矩阵乘法和分解）进行隐式并行处理。


  如果尚未安装，你需要安装 Java。本书使用的是 64 位 Java 8 Update 91。Java 可在[www.oracle.com/technetwork/java/javase/](http://www.oracle.com/technetwork/java/javase/)下载；具体来说，请获取
  Java 开发工具包（JDK）。


  虽然这些选择可能产生一些微小影响，但我们的目标是提供通用的指导，使其在不同环境中仍然足够准确。尽管如此，某些包和预构建函数偶尔也会出现一些奇怪的问题。我们将致力于确保你能轻松重现我们的结果。


  ## 重现结果


  R 语言的一个有用特性是其拥有大量由全球专家编写的包。这同时也是 R 语言的潜在弱点：从 R 语言本身的版本到特定包的版本，很多代码细节都在不断变化。你的代码可能今天能用明天就失效，更不用说本书出版前数月我们编写的代码了。为了解决这个问题，我们使用了
  Revolution Analytics 的`checkpoint`包（Microsoft Corporation, 2016），该包使用存储在服务器上的 CRAN
  快照将我们的代码“锁定”到特定版本和日期。要了解其技术细节，请访问本章末尾“参考文献”部分中的链接。我们将从基础开始教你如何使用。


  本书中，我们使用了 R 语言版本 3.3.1（"Bug in Your Hair"），以及 Windows 10 Professional x64 操作系统。随着这个版本从当前版本变为历史版本，CRAN
  会维护一个过去版本的存档。因此，`checkpoint`包可以随时访问 R 的早期版本以及所有包。你需要做的是，在项目目录中的第 1 章 R 文件顶部添加以下代码：


  ```

  ## 取消注释以安装 checkpoint 包

  ## install.packages("checkpoint")

  library(checkpoint)

  checkpoint("2016-09-04", R.version = "3.3.1")

  library(data.table)

  ```


  我们在每章项目文件的开头，调用 `checkpoint` 库之后，放置所有的库调用。通过包含 2016 年 9 月 4 日这个日期，我们确保在该截止日期之前的所有包的最新版本被安装并由
  `checkpoint` 运行。首次运行时，在请求许可后，`checkpoint` 会创建一个文件夹来存放所用包的所需版本。因此，只要你以正确的库调用开始每章的代码文件，你就使用了与我们所用版本相同的包。




