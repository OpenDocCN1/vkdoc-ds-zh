  ## 选择与子集


  在 `dplyr` 中选取存储数据的一部分与 `data.table` 的方法不同。请记住，`dplyr` 通过函数调用来工作。这些函数被设计为独立于底层数据结构。尽管如此，我们仍希望获得相同的结果。按位置选择行是通过
  `slice()` 完成的，它接受两个形式参数。第一个是数据对象，在我们例子中是 `diris`，第二个允许我们选择特定行。我们首先只选择前五行：


  ```

  slice(diris, 1:5)


  '
- '# A tibble: 5 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width Species


