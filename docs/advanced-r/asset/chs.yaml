  rscfpData <- read.dta(\"Ch02/rscfp2013.dta\")\nView(rscfpData)\n```\n\n我们还可以通过 `spss.get`\
  \ 函数导入 SPSS 文件。即使出现警告，数据也常常能够成功导入。如果数据导入不成功，请搜索警告消息以获取具体信息。在这种情况下，从我们的表头视图来看，一切正常。为简洁起见，我们截断了部分表头输出。\n\
  \n\n\n`countiesILSPSS <- spss.get(\"Ch02/Counties_in_Illinois.sav\")`\n\n```\n警告信息：\n\
