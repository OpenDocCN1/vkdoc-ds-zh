  \ 40.6119572] , \"street\" : \"Victory Boulevard\" , \"zipcode\" : \"10314\"}\n\
  restaurant_id   name           cuisine        X_id                            borough\n\
  40356442        Kosher Island  Jewish/Kosher  57e7f9a275bec64c417b9ab2        Staten\
  \ Island\ngrades\n[ { \"date\" : { \"$date\" : \"2014-10-06T00:00:00.000Z\"} , \"\
  grade\" : \"A\" , \"score\" : 9} ,\n{ \"date\" : { \"$date\" : \"2014-05-20T00:00:00.000Z\"\
  } , \"grade\" : \"A\" , \"score\" : 12} ,\n{ \"date\" : { \"$date\" : \"2013-04-04T00:00:00.000Z\"\
  } , \"grade\" : \"A\" , \"score\" : 12} ,\n{ \"date\" : { \"$date\" : \"2012-01-24T00:00:00.000Z\"\
  } , \"grade\" : \"A\" , \"score\" : 9}]\nView(output1)\n```\n\n这些数据似乎包含关于位置、食物类型和餐馆名称的信息。利用这些知识，我们优化搜索标准，查找`American`菜肴类型。这很有趣，因为我们移除了起始位置和限制参数，并调整了查询条件。数据卫生在此变得至关重要。天真地，我们尝试了`dbGetQuery(con3,\
  \ 'restaurants' , '{\"cuisine\":\n```\n\n\n# `用户界面绘制饼图的主面板`\n\n```r\nui <- shinyUI(fluidPage(\n\
  \  # 页面标题\n  titlePanel(\"用户控制图表\"),\n\n  # 侧边栏，包含由用户控制的数字、文本和复选框输入\n  sidebarLayout(\n\
  \    sidebarPanel(\n      numericInput(\"pie\",\n        \"饼图百分比\",\n        min\
  \ = 0,\n        max = 100,\n        value = 50),\n      textInput(\"pietext\", \"\
  文本输入\", value = \"默认标题\",\n        placeholder = \"在此处输入您的标题\"),\n      checkboxInput(\"\
  pieChoice\",\n        \"  我想要饼图而不是条形图。\", value = FALSE)\n    ),\n\n    # 显示绘图\n\
  \    mainPanel(\n      plotOutput(\"piePlot\")\n    )\n  )\n))\n```\n\n# `服务器端创建饼图或条形图的\
  \ R 代码，对用户隐藏`\n\n```r\nserver <- shinyServer(function(input, output) {\n  output$piePlot\
  \ <- renderPlot({\n    # 根据用户的 input$pie 生成饼图比例\n    y <- c(input$pie, 100-input$pie)\n\
  \n    # 使用指定的比例和标签绘制饼图或条形图\n    if(input$pieChoice == FALSE){\n      barplot(y,\
  \ ylim = c(0,100),\n        names.arg = c(input$pietext, paste0(input$pietext, \"\
  的补集\")))\n    }else{\n      pie(y, labels = c(input$pietext, paste0(input$pietext,\
  \ \"的补集\")))}\n  })\n})\n```\n\n# `运行应用程序`\n\n```r\nshinyApp(ui = ui, server = server)\n\
  ```\n\n在深入研究那部分代码之前，让我们先看看它的实际运行效果。在 RStudio 控制台中输入并运行以下代码，在您的本地 Windows 机器上安装 Shiny：\n\
  \n```\ninstall.packages(\"shiny\")\n```\n\n现在，进入您仔细输入的`app.R`文件，并一次性运行那段代码。代码区域右上角附近甚至应该有一个“运行应用”的播放按钮。无论如何，应该会出现类似图\
  \ 13-1 的内容。\n\n![A393929_1_En_13_Fig1_HTML.jpg](img/A393929_1_En_13_Fig1_HTML.jpg)\n\
  \n图 13-1. 本地托管的 Shiny 应用，用于查看我们具体获得了什么功能\n\n继续输入各种数字和文本值。尝试使用 Shiny，看看它能做什么。在此过程中，请认识到\
  \ Shiny 所做的是在您和 R 之间提供了一个接口。目前，这个特定的运行实例是由 RStudio 在您的本地机器上托管的。请注意，控制台中显示正在监听，您可能需要选择一个停止按钮才能输入任何新代码。\n\
  \n那么发生了什么？假设您将饼图百分比数字更改为 75。这个`numericInput()`是一个**响应式**值。当您更改它时，后台会发送一个信号，通知服务器`input$pie`已经改变。然后服务器会通知任何使用`input$pie`的响应式函数，告知它们某些内容已更改。在我们的例子中，`renderPlot()`是一个响应式函数。它现在知道`input$pie`不同了，因此它查询该值，获取新值，并再次运行其所有代码。由于那是一个输出值，这个循环会反过来通过`output$piePlot`重复，结果是用户端的`plotOutput()`会刷新。\n\
  \n关于这一切，有一些重要的事情需要注意。我们刚刚描述的过程会再次运行`renderPlot()`内部的所有代码——全部代码。在其他条件不变的情况下，没有必要再查找`input$pietext`和`input$pieChoice`。我们的响应式函数知道这些值，因为它们是最新的，虽然它们会被再次使用，但它们不会被再次调用。然而，如果我们在`renderPlot()`内部有比一个减法运算和一些绘图更密集的操作，我们可能会发现进行任何更改的性能成本相对较高。虽然这段代码相当紧凑，但您仍然可以看到三个可以放置\
  \ R 代码的地方。一个是放置`library(shiny)`的地方。这位于我们的`shinyServer()`之外。放在这里的代码，比如我们的库调用，每个会话会运行一次。单个会话可以有多个用户与其交互（尽管这在目前有些深奥）。尽管如此，每个新用户至少会执行`shinyServer()`内部的所有代码一次。最后，正如我们刚刚看到的，在`renderPlot()`这样的响应式函数内部的代码，会在任何连接的响应式输入值每次更新时运行一次。这意味着，为了效率，请考虑将尽可能多的代码放在响应式函数之外。此外，如果您预计会有大量用户流量，也请尽可能将代码放在服务器函数之外。\n\
  \n现在，让我们介绍一些新函数。请记住，有用户输入端、服务器端和整个 Shiny 应用。在本质上，Shiny 就由这三部分组成。实际上，这里有一个相当基础的 Shiny\
  \ 应用程序：\n\n```r\nlibrary(shiny)\n\n"
- '# 定义用户界面

  ui <- shinyUI(fluidPage())


  '
- '# 定义服务器

  server <- shinyServer(function(input, output) {})


  '
- '# 运行应用程序

  shinyApp(ui = ui, server = server)

  ```


  您可以运行此代码，得到一个漂亮的空白页面。虽然这可能没有之前的代码那么令人兴奋，但这有助于您快速开始编写此接口的代码。在用户界面部分，我们看到的是`fluidPage()`函数调用，其内部放置我们所有面向用户的文本。这部分代码是
  Shiny 中最不熟悉的部分，因为这是创建用户看到的 HTML 的代码。在参考部分，我们放置了所有 Shiny UI 函数的链接。然而，在本章中，我们坚持在一个相当自适应或**流体**的页面内使用相同的基本布局，这取决于浏览器的查看区域。请注意，这是一个
  R 函数，而 R 中的函数接受由逗号分隔的参数。我们不断增长的应用程序的每个方面都包含在这个包装函数内，它负责所有到网页就绪标记的转换。对于图 13-1 中的第一个应用程序，我们使用了侧边栏布局。这个函数反过来需要两个参数：控制应用程序的侧边栏面板，然后是绘制图表的主面板。编辑我们的用户界面，我们得到以下代码：


  ```r

  '
- "# 定义用户界面\nui <- shinyUI(fluidPage(\n  sidebarLayout(\n    sidebarPanel(),\n   \
  \ mainPanel()\n  )\n))\n```\n\n这段代码很好地展示了函数组合这个数学概念的强大功能。我们的目标最终是让用户能够向我们的 R 代码输入一些东西，比如图\
  \ 13-1 示例中的文本或复选框。用户将这些值输入到尚未命名的函数中，这些函数提供可视化输出，这些输出又被输入到`sidebarPanel()`函数中，该函数提供网页输出，再被输入到`fluidPage()`中，最终输出给用户的网页界面。我们可以在图\
  \ 13-2 中看到结果，尽管它们是空白的。\n\n![A393929_1_En_13_Fig2_HTML.jpg](img/A393929_1_En_13_Fig2_HTML.jpg)\n\
  \n图 13-2. 一个大部分空白的 Shiny 应用，带有 sidebarPanel()\n\n从这一点出发，我们可以使用三个输入函数快速构建用户的输入。这些输入函数中的每一个都遵循特定的格式，即`blargInput(输入标识,\
  \ 供用户阅读的文本标签, 与 blarg 所代表的特定类型输入相关的设置)`。正式来说，我们的三个输入函数布局如下，请注意它们的相似之处！\n\n```r\n\
  numericInput(inputId, label, value, min = NA, max = NA, step = NA,  width = NULL)\n\
  textInput(inputId, label, value = \"\", width = NULL, placeholder = NULL)\ncheckboxInput(inputId,\
  \ label, value = FALSE, width = NULL)\n```\n\n继续为我们的代码填充一些具体细节，我们可以为每个输入设置一个对我们后续服务器代码有用的变量标识。因为我们确实计划构建一个饼图（并且，亲爱的读者们，请不要因为我们选择饼图而讨厌我们），所以将数字输入限制在`0`到`100`之间是合理的。因为我们的服务器代码在启动时运行一次，所以为数字输入以及文本输入提供默认值也是有意义的。在我们不断发展的用户界面代码基础上进一步构建，现在我们有了：\n\
  \n```r\n"
- "# 用户界面绘制饼图\nui <- shinyUI(fluidPage(\n```\n\n\n\n# 由用户控制的包含数值、文本和复选框输入的侧边栏\n\n\
  ```R\nsidebarLayout(\n  sidebarPanel(\n    numericInput(\"pie\", \"百分比饼图\",\n  \
  \               min = 0, max = 100, value = 50),\n    textInput(\"pietext\", \"\
  文本输入\", value = \"默认标题\",\n              placeholder = \"在此输入您的标题\"),\n    checkboxInput(\"\
  pieChoice\",  \"  我想要一个饼图。\", value = FALSE)\n  ),\n  mainPanel()\n)\n)\n```\n\n\
  同样，完成这些修改后，再次运行整个应用程序是有意义的，我们将看到图 13-3 中的新结果。请注意，在我们的代码中，`mainPanel()`目前是空的，事实上，在图\
  \ 13-3 中，右侧我们什么也看不到。\n\n![A393929_1_En_13_Fig3_HTML.jpg](img/A393929_1_En_13_Fig3_HTML.jpg)\n\
  \n图 13-3.\n\n用户界面即将完成，侧边栏的输入部分确实已完成\n\n既然我们已经捕获了用户输入，我们就可以在服务器端使用它了。请记住，Shiny 是一个\
  \ R 包装器，它接收输入，当输入发生变化时，会通知服务器端的某个反应式函数发生了变化。在幕后，Shiny 负责知道输入何时变化，并通知服务器上正确的反应式函数；我们无需担心这些事情。我们的服务器定义了一个新的函数，该函数将输入和输出作为形式参数，并在函数体中使用它们。如果需要，可以快速回顾一下第\
  \ 4 章，以刷新关于函数是什么的记忆。由于我们想要做的就是绘制条形图或饼图，我们的大部分代码正是使用非常常见的 R 代码来实现这一点。事实上，唯一不那么常规的\
  \ R 代码部分是我们的反应式函数 `renderPlot()`。由于我们希望输出图形，所以我们使用该函数。\n\n反应式函数总是在等待 Shiny 通知它们来自用户界面端的输入的任何变化。当输入发生变化时，如果其函数体中至少包含一个发生改变的值，反应式函数就会收到通知。如果确实如此，那么反应式函数将再次运行其代码，这次使用新的值。我们在下面的代码中可以看到这一点。唯一另外的部分是，`renderPlot()`\
  \ 的输出存储在一个输出变量中，我们选择将其命名为 `piePlot`（尽管根据复选框的选择，它可能不会输出饼图——这完全是我们选择了一个糟糕的名称的错）。\n\
  \n```R\n"
- "# 创建饼图或条形图的服务器端 R 代码\nserver <- shinyServer(function(input, output) {\n  output$piePlot\
  \ <- renderPlot({\n\n    # 根据用户的 input$pie 生成饼图比例\n    y <- c(input$pie, 100-input$pie)\n\
  \n    # 用指定的比例和标签绘制饼图或条形图\n    if(input$pieChoice == FALSE){\n      barplot(y, ylim\
  \ = c(0,100),\n              names.arg = c(input$pietext, paste0(\"Complement of\
  \ \", input$pietext)))\n    }else{\n      pie(y, labels = c(input$pietext, paste0(\"\
  Complement of \", input$pietext)))}\n  })\n})\n```\n\n本质上就是这样。当我们的服务器运行时，它会通知用户界面函数\
  \ `plotOutput(\"piePlot\")` 更新图像。该函数位于 `mainPanel()` 区域。在 Shiny 的这种简单模型下，侧边栏是接收用户输入的地方，服务器端是\
  \ R 在幕后处理输入的地方，而主面板是用户查看处理结果的地方。仅此一次，我们在图 13-1 中展示 Shiny 为我们创建并提供服务的完整 HTML 代码：\n\
  \n```html\n    json2[2014.02.04];jquery[1.11.3];shiny[0.13.1];bootstrap[3.3.5]\n\
  \n  用户控制的图表\n\n用户控制的图表 ShinyHTML 代码，创建\n\n饼图百分比\n\n文本输入\n\n  我想要一个饼图。\n```\n\n现在，请回过头仔细查看本节开头展示的第一个代码块，那是整个\
  \ Shiny 应用程序，并意识到正是那段代码创建了前面所有的 HTML 和 JavaScript。这就是 Shiny 的全部内容。在本例中，我们的 R 代码并不特别令人印象深刻。尽管如此，原则才是最重要的。用户现在可以与数据交互，并且不难想象更富趣味的应用程序。\n\
  \n在接下来的几节中，我们将介绍一些其他有趣且有用的 Shiny 输入函数以及一些基本的反应式函数。最后，我们将它们全部上传到云端，以便您可以在网络上实时查看。\n\
  \n## 动态的 Shiny\n\n既然我们对 Shiny 的功能有了更好的理解，那么理解网页相对于打印报告所具有的动态潜力就很重要。其中一位作者是数学教授，数学教学面临的挑战之一是，一旦数据超出三维，学生就很难对信息进行概念化。自然地，作为人，学生并不独特于他们的高维视觉障碍。时间可以提供第四维度，而\
  \ Shiny 可以为我们提供这种时间感。\n\n我们之前提到的 Shiny 的另一个特性是，将 R 代码放在三个不同的位置是合理的。第一个位置是所有代码的开头，在编写用户界面或服务器端代码之前。放在此区域的代码每个实例运行一次。虽然在本地机器上其价值可能不那么明显，但当您的代码托管在云端时，特定的\
  \ R 会话可能同时有多个用户与之交互。这就是我们在前一章安装的 Shiny 服务器的工作方式。这是读入任何静态数据或执行任何一次性计算的绝佳位置。这是计算效率最高的位置。虽然我们在本例中没有这样做，但代码也可以放在服务器代码内部，但在任何反应式函数之外，这部分代码会在用户连接到会话时每个用户运行一次。最后，位于服务器函数内部、反应式函数内部的代码，会在其引用的任何输入数据每次发生变化时执行。\n\
  \n让我们看看如何随时间变化数据。从用户界面端，有一个作为数字线滑动条的输入函数。与所有输入函数一样，我们需要给它一个名称，以便我们的反应式函数知道去哪里寻找输入更新。与上一节的\
  \ `numericInput()` 类似，我们为此函数提供以年为单位的最大值和最小值。最后，我们将为我们的 `sliderInput()` 函数添加动画效果。看看我们在用户界面中使用的代码。我们的代码使用了包含\
  \ `interval`（以毫秒为单位）的动画选项，并使动画保持循环播放。\n\n```R\nsliderInput(\"ayear\", \"学年：\",\n\
  \            min = 2014, max = 2017,\n            value = 2014, step = 1,\n    \
  \        animate = animationOptions(interval=600, loop=T) )\n```\n\n虽然此应用程序也展示了如何对静态数据和用户输入执行\
  \ R 计算，但从 R 代码的角度来看，这确实又相当简单。事实上，除了 `titlePanel()` 命令以及我们的滑块代码外，这非常像我们的第一个 Shiny\
  \ 应用程序。我们在图 13-4 中同时展示了代码和最终结果。\n\n![A393929_1_En_13_Fig4_HTML.jpg](img/A393929_1_En_13_Fig4_HTML.jpg)\n\
  \n图 13-4.\n\n一个带有播放按钮功能的滑块输入，展示动态数据\n\n```R\nlibrary(shiny)\nslider_data<-read.csv(\"\
  slider_data.csv\", header = TRUE, sep = \",\")\nPhase1    <- slider_data[,2]\nPhase2\
  \    <- slider_data[,3]\nPhase3    <- slider_data[,4]\nPhase4    <- slider_data[,5]\n\
  \n"
- "# 定义用于绘制条形图的应用程序的 UI\nui <- shinyUI(fluidPage(\n\n  # 应用程序标题\n  titlePanel(\"培训计划结果\"\
  ),\n```\n\n\n\n# 侧边栏带滑块输入用于设置分组数量\n\n```R\nsidebarLayout(\n  sidebarPanel(\n   \
  \ sliderInput(\"ayear\", \"Academic Year:\",\n                min = 2014, max =\
  \ 2017,\n                value = 2014, step = 1,\n                animate = animationOptions(interval=600,\
  \ loop=T) )  ),\n  mainPanel(plotOutput(\"barPlot\") )\n)\n```\n\n## 定义绘制柱状图所需的服务器逻辑\n\
  \n```R\nserver <- shinyServer(function(input, output) {\n  output$barPlot <- renderPlot({\n\
  \    cap<-input$ayear*100\n    x <- c(sum(Phase1<cap), sum(Phase2<cap), sum(Phase3<cap),\
  \ sum(Phase4<cap))\n    barplot(x, names.arg = c(\"Phase I\", \"Phase II\", \"Phase\
  \ III\", \"Fellows\"),\n            col = c(\"deeppink1\",\"deeppink2\",\"deeppink3\"\
  ,\"deeppink4\"), ylim=c(0,50))\n  })\n})\n```\n\n## 运行应用程序\n\n```R\nshinyApp(ui\
  \ = ui, server = server)\n```\n\n## 将用户文件上传到 Shiny\n\n本章最后一个示例表明，用户可以通过 Shiny 上传文件，然后通过\
  \ R 进行处理。当然，与之前两个示例不同，这稍微有点风险，因为上传的文件不受我们控制。数据可能是任何文件，不一定适用于我们的结果。可以在代码中构建各种错误检查功能；实际上，我们在讨论函数时曾部分提到这些技术。但是，为了让代码专注于严格的新特性，我们暂时假设生活在一个完美的世界里。我们在这本书的\
  \ Apress 网站上提供了一个示例文件，它只是一个包含数字 1 到 10 的逗号分隔值文件。\n\n或许并不意外，为了接收文件输入，Shiny 中的命令是`fileInput()`。除了`inputId`，也许最有趣的功能是它甚至可以接受`multiple`上传，尽管在我们的示例中我们将其保留为默认值`FALSE`。并非所有浏览器都支持上传多个文件。同样在用户界面区域，我们使用了一个新的输出函数`tableOutput()`，它与`plotOutput()`一起，允许我们为用户提供图表和图形输出。在讨论允许我们与用户文件交互的服务器端代码之前，我们先看看上传的\
  \ CSV 文件给我们带来了什么。图 13-5 是我们上传 CSV 文件后的视图，下面仅展示用户界面的代码：\n\n![A393929_1_En_13_Fig5_HTML.jpg](img/A393929_1_En_13_Fig5_HTML.jpg)\n\
  图 13-5. 文件上传结果\n\n```R\nui <- shinyUI(fluidPage(\n  fileInput(\"file\", label =\
  \ h3(\"Histogram Data File input\")),\n  tableOutput(\"tabledf\"),\n  tableOutput(\"\
  tabledf2\"),\n  plotOutput(\"histPlot1\")\n))\n```\n\n首先，请注意第一个表格。它包含四个变量，这些变量是直接访问`input$file`变量的结果。这可能会与我们之前的示例相悖，在其他示例中，用户输入可以直接从`input$inputId`访问。然而，这确实表明我们的用户输入实际上是一个数据框，并且可以像访问任何文件位置一样访问临时数据路径。注意：如果用户上传另一个文件，由于我们在临时目录中，旧文件很可能会被覆盖。接下来，请注意我们文件的真实数据在第二个表格中，并且如直方图所示，该信息可用于我们可能选择编码的任何\
  \ R 计算。\n\n接下来让我们重点看服务器端，因为这不像之前的示例那么简单。有时，您处理的输入比单个数字或文本值需要更多管理。因为该数据是输入数据，如果它发生变化，需要一个响应式函数来通知。但是，您可能更倾向于使用相当简洁的代码。幸运的是，Shiny\
  \ 提供了一个基本的响应式函数，名为`reactive()`。在下面的代码中，我们创建自己的响应式函数来处理一个新场景，即我们想要的场景。当文件上传时，Shiny\
  \ 会通知我们的响应式函数`reactive()`：`input$file`已经改变。该函数自然会查询输入以查看现在是什么，并将该数据框存储到变量`file1`中。我们希望访问\
  \ CSV 文件内部的数据，因此需要对该文件调用`read.csv()`，这自然需要知道文件的位置。该位置存储在名为`datapath`的最后一列中。我们得到的是一个在后续代码中可以像数据框一样处理的对象。\n\
  \n```R\nhistData<-reactive({\n  file1<-input$file\n  read.csv(file1$datapath,header=TRUE\
  \ ,sep = \",\")\n})\n```\n\n除此之外，我们现在可以在其他响应式函数中使用我们的数据，即使是熟悉的函数。我们再展示一个新的响应式函数`renderTable()`，以及一个熟悉的`renderPlot()`。您还应该注意`histData()$X1`。请注意，它有函数括号，但元素仍然通过熟悉的`$`访问。这是用响应式函数构建的，因此，我们必须承认它既是一个接收用户输入的函数，也是一个可访问数据的存储对象。\n\
  \n```R\noutput$tabledf2<-renderTable({\n  histData()\n})\noutput$histPlot1<-renderPlot({\n\
  \  hist(as.numeric(histData()$X1))\n})\n```\n\n以上就是对代码的分析。为了完整性，我们以完整的代码结束本节，但现在您已经掌握了在\
  \ Shiny 中启动和运行的技术。在本节结束之前，我们指出，参考文献部分的第一条链接是大多数或许多 Shiny 函数的参考网站。如果您想做某事，请先查看那里。它非常直观。同样值得注意的是，本章下一节展示了如何将应用程序文件上传到云端并使其实时运行。最后，请注意用户界面中`fileInput()`函数内部的`h3()`函数。Shiny\
  \ 有一整套函数，可以复制各种常见的 HTML 特性，如标题。对于本章，我们将这些视为次要事项。在第 14 章中，我们将更多地关注使我们的用户界面（为了找一个更好的词）更加美观。\n\
  \n```R\nlibrary(shiny)\nui <- shinyUI(fluidPage(\n  fileInput(\"file\", label =\
  \ h3(\"Histogram Data File input\"), multiple = FALSE),\n  tableOutput(\"tabledf\"\
  ),\n  tableOutput(\"tabledf2\"),\n  plotOutput(\"histPlot1\")\n))\nserver <- shinyServer(function(input,\
  \ output) {\n  output$tabledf<-renderTable({\n    input$file\n  })\n  histData<-reactive({\n\
  \    file1<-input$file\n    read.csv(file1$datapath, header=TRUE ,sep = \",\")\n\
  \  })\n  output$tabledf2<-renderTable({\n    histData()\n  })\n  output$histPlot1<-renderPlot({\n\
  \    hist(as.numeric(histData()$X1))\n  })\n})\n```\n\n\n\n# 运行应用程序\n\n```\nshinyApp(ui\
  \ = ui, server = server)\n```\n\n请注意，在这段代码中，我们并没有关注侧边栏或主面板之类的区分；相反，我们将用户界面端（既包括请求的输入也包括生成的输出）全部混杂在一起。值得注意的是，如果你有一个侧边栏，就需要一个主面板来容纳侧边栏不承载的任何输出内容。\n\
  \n## 在云端托管 Shiny 应用\n\n我们最后一项任务是将文件从本地机器传输到云端实例。请记住，在前面的章节中，我们不仅使用 `PuTTY` (Tatham,\
  \ 2016) 在云端服务器上安装了 Shiny Server，还使用 `WinSCP` (Prikryl, 2007) 将文件上传到云端。我们启动 `WinSCP`，重新连接，并确保左侧（本地端）位于\
  \ Shiny 应用程序文件夹中，而右侧（云端服务器端）位于 `/home/ubuntu` 目录下。我们在图 13-6 中展示了这一过程的结果。\n\n![A393929_1_En_13_Fig6_HTML.jpg](img/A393929_1_En_13_Fig6_HTML.jpg)\n\
  \n图 13-6. 已将 PieChart_Time、slider_time 和 Upload_hist 等 Shiny 应用程序全部上传的 WinSCP 界面\n\
  \n在此之后，我们通过 `PuTTY` 访问云端服务器，并在命令行中逐一运行以下代码：\n\n```\nsudo cp -R ∼/PieChart_Time /srv/shiny-server/\n\
  sudo cp -R ∼/slider_time /srv/shiny-server/\nsudo cp -R ∼/Upload_hist /srv/shiny-server/\n\
  ```\n\n这就只剩最后一步了。回想一下，当我们最初设置云端实例时，我们只谨慎地开放了少数几个端口，并仅允许少数几个 IP 地址访问。你需要重新登录 AWS，再次进入\
  \ EC2 控制面板。从那里，在左侧导航菜单中，回到“安全组”并选择你的 `AdvancedR` 组。选中该组后，点击“入站”选项卡，然后点击“编辑”→“添加规则”。你需要使用“自定义\
  \ TCP 规则”，添加端口 `3838`，最后将其锁定到你的 IP 地址。然后点击“保存”。结果如图 13-7 所示。\n\n![A393929_1_En_13_Fig7_HTML.jpg](img/A393929_1_En_13_Fig7_HTML.jpg)\n\
  \n图 13-7. AWS 入站规则表，其中 Shiny Server 端口 3838 仅对一个本地 IP 地址开放\n\n你现在可以通过在任何浏览器中输入以下\
  \ URL 来验证你的应用程序是否正常工作：\n\n`http://你的.实例.IP.地址:3838/PieChart_Time/`\n\n`http://你的.实例.IP.地址:3838/slider_time/`\n\
  \n`http://你的.实例.IP.地址:3838/Upload_hist/`\n\n如果你希望允许其他人或全世界访问你的应用程序，请仅为端口 `3838`\
  \ 将入站规则中的源 IP 地址更改为 `0.0.0.0/0`。不允许外部世界访问你的 SSH 端口是一项安全措施。当然，如果你现在开放了端口 `3838` 供全世界访问，你的服务器就是可见且已知的。为不同的独立活动使用不同的云端实例可能是有益的。我们建议不要在可公开访问的服务器上存放机密数据。再次强调，云端安全超出了本书的范围。\n\
  \n## 最终思考\n\n我们似乎花了些时间讨论云端安全。这背后有两个原因。第一，纯粹是我们天生偏执的习性。然而，相当一部分数据可能包含机密信息。合乎道德地使用数据，包括采取合理的防护措施，是很重要的。最近几个月，AWS\
  \ 在 EC2 上创建更安全的环境方面取得了长足进步。一如既往，安全是一个合理性的问题。你的数据越重要，就越有必要采取更好的措施来保护这些信息。\n\n抛开这些担忧不谈，这确实是一项前所未有的能力，允许用户以如此开放的方式与数据分析进行交互。是的，根据我们的经验，这可能会导致一些数据消费者做出缺乏依据的决策。尽管如此，通过\
  \ Shiny 这类技术实现透明度所带来的好处，远远超过了其缺点。这是一个令人兴奋的世界，我们渴望探索。\n\n# 14. Shiny 仪表板示例集\n\n本章内容并非理解本书其他章节所必需的。虽然我们会介绍一些新技术，但你主要会发现的是一个完整的仪表板示例，可以直接修改以满足你的需求。\n\
  \n这个示例集具体做什么？它将我们在前一章中使用的应用程序以一种引人入胜、交互式的格式呈现出来。重要的是要记住，虽然我们通常以图形化输出来展示这些应用程序，但可以对这些数据执行任何\
  \ R 处理过程。目标是让信息消费者（无论是研究评审员、上级主管还是董事会成员）能够自然地与实时数据交互。\n\n与上一章类似，我们在 Windows 系统中的\
  \ `RStudio` (RStudio Team, 2015) 内介绍这个示例。我们既提供了一个理解这个仪表板的框架，也提供了一些专业技巧。重要的是，要将这个示例集视为某种创造力的孵化器。我们希望你能从中看到你喜欢的东西，并且更重要的是，意识到如何最好地展示你的数据。\n\
  \n我们将从仪表板的基本结构开始。\n\n## 仪表板的骨架\n\n回想一下我们在前一章中创建的最简单的 `shiny` (Chang, Cheng, Allaire,\
  \ Xie, and McPherson, 2016) 应用程序：\n\n```\nlibrary(shiny)\n\n"
- '# 定义用户界面

  ui <- shinyUI(fluidPage())


  '
- '# 定义服务器

  server <- shinyServer(function(input, output) {})


  '
- '# 运行应用程序

  shinyApp(ui = ui, server = server)

  ```


  这段代码从一开始就值得一看，因为它突显了所有 Shiny 应用程序都由用户界面和承载 R 代码逻辑的服务器端组成——这两者本身都是作为一个 R 进程运行的（可能在云服务器上）。我们打算在这个结构中添加的，只是用户界面端的一些代码。这应该很容易理解，因为仪表板更多关乎用户界面，而非任何新的代码逻辑。其目标是让分析和统计推断对用户来说易于获取。为此需要安装一个新的库，但只有一个，那就是
  `shinydashboard` (Chang, 2015)。在 RStudio 的命令行中，继续运行以下代码：


  ```

  install.packages("shinydashboard")

  ```


  安装好这个新包后，我们现在可以看看最简单的 Shiny 仪表板应用程序了。仪表板包含一个标题栏、一个带有各种菜单项的侧边栏，以及容纳应用程序不同对象的主体部分。请对比这个仪表板代码布局与单个应用程序的代码。两个版本几乎相同。在代码之后，请查看图
  14-1 中它们生成的效果。


  ![A393929_1_En_14_Fig1_HTML.jpg](img/A393929_1_En_14_Fig1_HTML.jpg)


  图 14-1. 最简单的 Shiny 仪表板相当空旷


  ```

  library(shiny)

  library(shinydashboard)


  '
- "# 定义用户界面\nui <- dashboardPage(\n    dashboardHeader(),\n    dashboardSidebar(),\n\
  \    dashboardBody()\n)\n\n"
- '# 定义服务器

  server <- shinyServer(function(input, output) {})

  ```




  # 运行应用程序


  ```R

  shinyApp(ui = ui, server = server)

  ```


  如前面代码所示，我们有三个函数：`dashboardHeader()`、`dashboardSidebar()` 和 `dashboardBody()`。它们为我们的仪表板提供了良好的结构。它们都位于
  `dashboardPage()` 内部，作为页面函数的五个形式参数中的前三个。最后两个参数包括 `title`（默认为`NULL`）和 `skin`（取值为
  `blue`、`black`、`purple`、`green`、`red` 或 `yellow` 颜色之一）。正如您可以通过 `formals(dashboardPage)`
  命令自己看到的那样，该页面函数确实足够简单。`title` 参数控制浏览器本身（或在大多数流行浏览器中打开的多个标签页上的浏览器标签页）中的标题。`skin`
  颜色选项控制仪表板的整体调色板。前三个形式参数本身也是函数，并且变得相当复杂。尽管如此，我们将依次讨论所有这三个。


  ## 仪表板标题


  `dashboardHeader()` 函数也接受一个 `title` 形式参数，用于将用户定义的文本添加到标题区域，以及一个 `titleWidth` 参数来控制该文本的宽度。标题还接受其他几个
  Shiny 用户界面风格的函数来控制页面导航，以及一些更专门的函数，允许更交互式的导航。在本章以及本书中，我们基本上忽略这些函数，以将 `shiny` 和 `shinydashboard`
  作为向数据消费者提供已经熟悉的 R 代码的方式，而不是一次学习太多新功能。事实上，我们为这个函数提到的最后一个参数是 `disable`，它默认为 `FALSE`，当设置为
  `TRUE` 时会完全隐藏标题。在我们的示例中，我们将以几乎空白的状态保留标题。


  ## 仪表板侧边栏


  接下来是 `dashboardSidebar()` 函数，唯一明确列出的形式参数同样是 `disable` 选项和一个 `width` 参数。然而，这里除了列出的函数外，还有更多可能的函数。首先要知道的是，来自
  `shiny` 的任何用户界面函数都可以在侧边栏中使用。因此，如果在菜单中放置滑块或下拉输入函数有意义，那是可能的。不过，也有一些仪表板库独有的函数适合放置在侧边栏区域。


  第一个是 `sidebarMenu()` 函数。与 `dashboardSidebar()` 本身类似，该函数主要接受其他输入，并以高效的方式处理它们的组织。特别值得注意的是
  `menuItem()` 函数，它在 `sidebarMenu()` 内部被调用。在这个示例中，我们将前一章创建的每个应用程序都放在它们自己的 `menuItem()`
  调用中。如以下代码所示，此函数有几个形式参数：


  ```R

  formals(menuItem)

  $text

  $...

  $icon

  NULL

  $badgeLabel

  NULL

  $badgeColor

  [1] "green"

  $tabName

  NULL

  $href

  NULL

  $newtab

  [1] TRUE

  $selected

  NULL

  ```


  在上述函数和形式参数中，`text` 接受带引号的文本字符串，为该菜单上的特定项目提供文本信息或链接名称。`icon` 参数被赋予一个 `Font-Awesome`
  图标的名称。我们在本章的参考部分提供了一个在线库的链接，展示了所有可能的图标选择。我们也可以切换到不同的图标库；我们将此类探索留给你们。`badgelabel`
  调用在侧边栏的最右侧放置一个内联徽章，用于容纳一小段文本。徽章在将查看者的注意力吸引到特定菜单项目并因此吸引到底层应用程序方面做得很好。这些形式参数中有许多是可选的；但是，必须有一个与仪表板主体中的相关
  `tabItem()` 链接的 `tabName`，或者必须为 `href` 命令提供一个 `URL`。如果提供的是 `URL` 而不是 `tabName`，那么如果您希望查看者在访问该页面时离开您的站点，可以将
  `newtab` 从默认值 `TRUE` 更改为 `FALSE`。最后，通过将 `selected` 设置为 `TRUE`，可以将默认选项卡从第一个 `menuItem()`
  强制更改为特定选项卡。


  当我们把注意力转向仪表板的主体时，提醒您侧边栏也可以接受任何 Shiny 函数，例如 `img()` 函数，它指向一个必须包含在仪表板应用程序文件夹内名为 `www`
  的文件夹中的图像。我们展示了我们示例菜单的一个代码片段（尚未运行）以及图 14-2 中的结果。前三个菜单项的名称应该从前一章中熟悉。


  ![A393929_1_En_14_Fig2_HTML.jpg](img/A393929_1_En_14_Fig2_HTML.jpg)

  图 14-2. 一些 `sidebarMenu()` 和 `menuItem()` 函数的结果


  ```R

  sidebarMenu(

  menuItem("Pie Charts!", tabName = "PieChart_Time", icon = icon("pie-chart")),

  menuItem("Use a Slider", tabName = "slider_time", icon = icon("sliders"), badgeLabel
  = "New"),

  menuItem("Upload a Histogram File", tabName = "Upload_hist", icon = icon("bar-chart")),

  menuItem("Labour Data Dates", tabName = "labour", icon = icon("cloud-download"),
  badgeLabel = "Live")

  )

  ```


  ## 仪表板主体


  如前面的代码所示，每个菜单项都有一个 `tabName`。我们现在将讨论 `dashboardBody()` 函数内部的代码，该代码将捕获那个 `tabName`。请查看以下代码和图
  14-3 中的小（虽然不是最小的）Shiny 仪表板，然后我们将逐步介绍新行。


  ![A393929_1_En_14_Fig3_HTML.jpg](img/A393929_1_En_14_Fig3_HTML.jpg)

  图 14-3. 一个侧边栏中有 `menuItem()`、主体中有 `tabItem()` 的仪表板。注意匹配的 First。


  ```R

  library(shiny)

  library(shinydashboard)


  '
- '# 定义用户界面

  ui <- dashboardPage(

  dashboardHeader(),

  dashboardSidebar(sidebarMenu(menuItem("Demo", tabName = "First"))),

  dashboardBody(tabItems(tabItem(tabName = "First", "test"))),

  skin = "yellow")


  '
- '# 定义服务器

  server <- shinyServer(function(input, output) {})

  ```




  # 运行应用


  ```shinyApp(ui = ui, server = server)```


  仪表盘主体中可以放置许多项目。但是，如果我们想使用在侧边栏部分编写的标签页，就需要调用`tabItems()`。这个函数除了单个的`tabItem()`函数调用外不接受任何参数；每个`tabItem()`调用都需要有一个唯一的`tabName`，与`sidebarMenu()`中的唯一`tabName`相匹配。


  每个`tabItem()`里面放什么呢？就像在 Shiny 中一样，使布局足够灵活，以便仪表盘能够适应不同大小的浏览器窗口是有好处的。因此，常用的`fluidRow()`函数会再次出现。回想一下，`fluidRow()`设置的最大行宽为
  12。记住这一点，请密切注意我们将要讨论的用于填充这些行的三个框对象的默认宽度。当然，不止这三个对象；我们的目标是让您快速达到能够通过云端向用户或利益相关者提供数据服务的水平。


  ### 框对象


  行中最基本的输入元素是`box()`。在这个函数内部，我们可以放置前一章中使用的任何应用代码，无论是用于获取用户输入还是输出响应式内容。不过，`box()`也接受九个特定参数。自然地，每个`box()`可以接受一个`title`值，这是一个用户定义的文本字符串，应简洁地描述框的内容或所需的操作。框的底部还有一个`footer`，也可以接受一个文本字符串。框还有一个`status`，可以设置为`primary`、`success`、`info`、`warning`或`danger`。每个状态值都有一个关联的颜色，这些颜色是默认层叠样式表结构的一部分，使得`shinydashboard`看起来相当美观。颜色相当一致，尽管根据您为整个仪表盘选择的颜色可能会有一些差异。


  `solidHeader`的默认值是`FALSE`，当然，这可以改为`TRUE`。选择`TRUE`只会将状态的颜色增强为`title`文本的狭窄横幅背景。如果您希望框的主体区域具有特定颜色，可以将`background`设置为大约
  15 种有效颜色选择之一。顾名思义，任何输入代码和输出代码都位于该`background`之上。


  框的默认`width`是`6`，所以除非采取措施缩小它们，否则两个框会填满一行。如果不注意保持`fluidRow()`总宽度为`12`，可能会导致一些奇怪的布局。框的`height`也可以设置为固定高度。如果您需要非常整齐的行，这会很有帮助。最后，框是`collapsible`的，并且可能已经`collapsed`，尽管这两个选项的默认值都是`FALSE`。


  ![A393929_1_En_14_Fig4_HTML.jpg](img/A393929_1_En_14_Fig4_HTML.jpg)

  *图 14-4. 一个包含两个框和多个选项的熟悉应用——详见完整采样器代码*


  #### `valueBox()`


  另一种类型的框是`valueBox()`，它接受六个正式参数。第一个是`value`，通常是一个短文本字符串或数值。`valueBox()`还接受一个`subtitle`参数，同样是一个文本字符串。您可以选择一个`icon`，尽管默认值是`NULL`。这些框的默认`color`是`aqua`，并且相当短，默认`width`仅为`4`。最后，`valueBox()`也接受一个`href`值，默认为`NULL`。我们在此展示采样器中数值框使用的代码：


  ![A393929_1_En_14_Fig5_HTML.jpg](img/A393929_1_En_14_Fig5_HTML.jpg)

  *图 14-5. 示例`valueBox()`，显示从网站实时获取的数据天数*


  ```

  valueBox(endYear-startYear, "Days of Data", icon = icon("calendar"))

  ```


  #### `infoBox()`


  我们以`infoBox()`结束对`dashboardBody()`框的讨论，这是一个与`valueBox()`类似的框。这个框有一个接受文本字符串的`title`，一个在框中突出显示的`value`，可选的`subtitle`文本，以及默认的条形图`icon`。它的`color`默认也是`aqua`，`width`默认为`4`，`href`默认为`NULL`。不同之处在于`icon`更小，并且有一个`fill`选项（通常为`FALSE`），可以改变背景颜色的显示方式。我们不展示这个框，但它看起来与图
  14-5 中的小框非常相似。根据我们的经验，这些框除了外观之外没有显著差异。


  '
- '# 云端仪表盘


  我们确实希望将这个仪表盘部署到云实例中，这涉及一组稍复杂的代码。我们再次使用 RStudio 在标准的 Shiny 文件夹中创建了它，因此它有自己的文件结构。在
  Windows 上的文件结构如图 14-6 所示。我们的`shinydashboard_cloud`文件夹中有三个文件。注意`www`文件夹，它存放我们采样器的图像，然后是`app.R`文件，它包含我们整个
  Shiny 应用以及 CSV 文件。


  ![A393929_1_En_14_Fig6_HTML.jpg](img/A393929_1_En_14_Fig6_HTML.jpg)

  *图 14-6. `shinydashboard_cloud`的文件结构*


  我们使用`WinSCP`将文件和文件夹上传到我们的 Ubuntu 云实例，如图 14-7 所示。


  ![A393929_1_En_14_Fig7_HTML.jpg](img/A393929_1_En_14_Fig7_HTML.jpg)

  *图 14-7. `WinSCP`上传文件夹视图*


  登录`PuTTY`后，我们确实有一些工作要做。我们的采样器使用了一些新的库，并且，当然，文件需要从用户文件夹移动到 Shiny 服务器期望它存放的位置。为简洁起见，我们只安装尚未在云实例上安装的包。


  新包中的第一个是`XML`，这个包提供了从 Web 实时读取 HTML 表格的能力。各种政府和非营利机构将数据存储在此类表格中，以便公众轻松访问。我们还安装了`zoo`包，它为时间序列提供了方便的函数。已经熟悉的包是`ggplot2`和`data.table`，它们处理图形绘制并提供更高级的数据框结构。


  以下命令在我们的实例上为所有用户逐一安装五个新库，然后复制文件以便可以通过浏览器访问。我们还安装了一些 Ubuntu 上必需的软件以允许`XML`包运行。为便于阅读，我们将其中一些命令分组。它们应在`PuTTY`中逐行运行，每个命令执行后屏幕上会打印一些文本。


  ```

  sudo su - -c "R -e \"install.packages(''shinydashboard'', repos=''https://cran.rstudio.com/'')\""

  sudo apt-get install libcurl4-openssl-dev libxml2-dev

  sudo su - -c "R -e \"install.packages(''XML'', repos=''https://cran.rstudio.com/'')\""

  sudo su - -c "R -e \"install.packages(''zoo'', repos=''https://cran.rstudio.com/'')\""

  sudo su - -c "R -e \"install.packages(''data.table'', repos=''https://cran.rstudio.com/'')\""

  sudo su - -c "R -e \"install.packages(''ggplot2'', repos=''https://cran.rstudio.com/'')\""

  sudo cp -R ∼/shinydashboard_cloud /srv/shiny-server/

  ```


  至此，我们关于 Shiny 和 Shiny 仪表盘的工作就完成了。您的仪表盘应该可以在`http://您的实例 IP 地址:3838/shinydashboard_cloud/`地址访问，并通过您的网络浏览器查看。在结束本章之前，我们还有几点说明。




  首先，我们强烈建议您访问 Apress 网站上这本教科书的页面，并下载本章的代码包。它包含了完整、可用的文件和文件夹，如图 14-6 和图 14-7 所示。您无需手动键入所有这些代码来了解仪表板是否是您想要的功能。


  其次，本章节中我们并未提供完整的示例代码。我们将这部分内容留到了最后，以确保所有内容在一个统一、连贯的整体中，并将您的注意力集中在示例代码中需要寻找的特定结构上。


  第三，我们提醒您，如果您遵循了我们关于 AWS 服务器入站策略设置的安全建议，您可能需要更改这些设置，以允许除您自己之外的更多人查看您的最终仪表板项目。请记住，您需要在入站设置中更改的是允许从`0.0.0.0/0`（整个互联网）访问端口`3838`。请注意，整个互联网都将能够访问您的仪表板。如果您有敏感数据，甚至是不需要公开的信息，请考虑与
  IT 专业人员或至少是 IT 高级用户合作。


  最后，我们希望您和我们一样喜欢本章内容及成果。请务必探索“参考文献”部分的链接。您会找到有价值的信息，包括附加函数、完整的图标列表、第二个图标库，以及`shiny`和`shinydashboard`包的最新信息。这些包的更新相当频繁，新功能通常能带来出色的效果。


  ## 完整示例代码


  ```

  library(shiny)

  library(shinydashboard)

  library(XML)

  library(zoo)

  library(data.table)

  library(ggplot2)

  #this code will run just once each time a session is instantiated - there may be
  multiple viewers in the same session.

  slider_data=xlow]

  yValue =4){  blsSub[,(yValue):=rollmean(get(yValue), k=3, na.pad = TRUE)] }

  ggplot(data = blsSub, mapping = aes_string("Date", yValue)) +

  geom_line()+

  xlab("Years & Months")+

  ylab("People")+

  xlim(xlow, xhigh)+

  ggtitle(yValue)+

  scale_x_date(date_labels = "%b %y")

  }) })


  # Run the application

  shinyApp(ui = ui, server = server)

  ```


