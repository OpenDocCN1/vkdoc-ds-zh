  \n## 动态文档与 Shiny\n\n我们现在将注意力转向提供不仅仅是动态文档，而且是一个他人可以通过动态输入进行控制的文档。我们构建了一个简单的 Shiny\
  \ 环境，允许用户上传一个包含学生测验成绩数据的 CSV 文件。数据编码如下：列代表测验中的具体问题；行代表每个学生；测验为多项选择题，正确回答编码为 `1`，错误回答编码为\
  \ `0`。\n\n与前一节一样，我们将查看实现该功能所需的三个文件的所有代码。然后，我们逐行分解这些代码。对于已经熟悉 Shiny 的读者，请随意跳到最后一部分。我们将此代码构建在一个名为\
  \ `Chapter15` 的文件夹中。稍后，当我们上传到 Ubuntu 服务器时，我们会上传整个文件夹。\n\n### server.R\n\n在 Shiny\
  \ 服务器端，我们调用各种库，然后构建所需的系统来上传我们的 CSV 文件，向用户确认其文件已上传，将该文件读入 R，将所需信息传递到我们的标记文档中，然后允许用户将该文档下载为\
  \ PDF。只需要以下 55 行代码：\n\n```\n##Dynamic Reports and the Cloud\nlibrary(shiny)\nlibrary(ltm)\n\
  library(data.table)\nlibrary(rmarkdown)\nlibrary(tufte)\nlibrary(formatR)\nlibrary(knitr)\n\
  library(evaluate)\nfunction(input, output) {\noutput$contents <- renderTable({\n\
  inFile <- input$file1\nif (is.null(inFile))\nreturn(NULL)\nread.csv(inFile$datapath,\
  \ header = input$header,\nsep = input$sep, quote = input$quote)\n})\nscores <- reactive({\n\
  inFile <- input$file1\nif (is.null(inFile))\nreturn(NULL)\nread.csv(inFile$datapath,\
  \ header = input$header,\nsep = input$sep, quote = input$quote)\n})\noutput$downloadReport\
  \ <- downloadHandler(\nfilename = function() {\npaste('quiz-report', sep = '.',\
  \ 'pdf')\n},\ncontent = function(file) {\nsrc <- normalizePath('report.Rmd')\nowd\
  \ <- setwd(tempdir())\non.exit(setwd(owd))\nfile.copy(src, 'report.Rmd', overwrite\
  \ = TRUE)\nknitr::opts_chunk$set(tidy = FALSE, cache.extra = packageVersion('tufte'))\n\
  options(htmltools.dir.version = FALSE)\nout <- render('report.Rmd')\nfile.rename(out,\
  \ file)\n}    )  }\n```\n\n上述代码以调用所有库开始，然后迅速进入 Shiny 的 `function(input, output)\
  \ {}` 服务器端包装器。之后，主要有三个代码块。我们依次查看每一个，从 `renderTable({})` 调用开始。这会在用户界面端生成输出。具体来说，它创建了一个表格。这是一个交互式函数，当用户在用户端上传文件时，Shiny\
  \ 会提醒该函数其某个输入已发生变化。这会触发代码的运行。从入口端来看，`input$datapath` 是服务器上 Shiny 存储上传文件的位置。假设确实存在一个文件，`read.csv`\
  \ 可以访问该文件的数据路径，并获取有关数据是否有标题、使用了何种分隔符以及用户设置的其他一些信息。实际上，可以向用户提出更多要求，以实现更定制化的分析。在此，我们保持示例简单而有效。这次读取的结果创建了一个表格，并将该表格存储在名为\
  \ `contents` 的输出变量中。这会产生一个净效果，即 Shiny 现在会提醒用户界面端有可用的输出。我们将在本章后面看到该输出去了哪里。\n\n```\n\
  output$contents <- renderTable({\ninFile <- input$file1\nif (is.null(inFile))\n\
  return(NULL)\nread.csv(inFile$datapath, header = input$header,\nsep = input$sep,\
  \ quote = input$quote)\n})\n```\n\n除了创建一个表格以便用户能立即看到其文件上传是否成功（并且我们设想在真实场景中，或许可以在用户界面上添加评论，让用户发现上传失败），我们还必须以允许我们的\
  \ Markdown 文件使用这些数据的格式来读取数据。我们将数据读入一个名为 `scores` 的变量。这是一个响应式函数，始终警惕相关输入变量的变化（在此例中，即文件的上传）。\n\
  \n```\nscores <- reactive({\ninFile <- input$file1\nif (is.null(inFile))\nreturn(NULL)\n\
  read.csv(inFile$datapath, header = input$header,\nsep = input$sep, quote = input$quote)\n\
  })\n```\n\n\n\n服务器端的最后一部分最为复杂，它控制着用户可访问的下载文件。本区块的第一部分控制用户下载的报告名称。我们将其命名为`quiz-report.pdf`，这看似复杂，但该代码为我们提供了未来调整报告类型或性质的灵活性，便于更改文件类型或名称。注意，如果使用\
  \ RStudio 的内部浏览器，报告下载时会使用不同的名称。接下来，我们对 Markdown 文件调用`normalizePath()`，该函数返回当前工作目录的路径，并在参数后附加文件名。具体而言，它会根据代码所在的操作系统环境返回路径。这很重要，原因有二：首先，它使得代码可在\
  \ Windows 和 Ubuntu（或任何操作系统）之间移植；其次，我们即将更改工作目录，因此直接调用`report.Rmd`将不再有效。\n\n更改工作目录是必要的，因为我们即将创建一个新的\
  \ PDF 文件。在拥有管理权限的本地机器上，创建新文件毫无问题。然而，我们的目标是上传到云端，而并非所有服务器都能确保拥有此类权限。因此，我们将工作目录更改为服务器的临时目录。在\
  \ R 中，`setwd(tempdir())`执行两项操作：它同时复制并返回当前工作目录，然后更改目录为参数指定的目录。因此，`owd`代表旧工作目录。我们设置`on.exit()`参数，以确保`downloadHandler`完成后，工作目录恢复到原来状态，从而避免\
  \ Shiny 网站崩溃。\n\n现在，我们将 Markdown 文件从旧工作目录的原始位置复制到临时区域，使其能在该临时目录中运行并生成 PDF。我们还为`knitr`（负责生成\
  \ Markdown PDF）设置了一些环境选项，以支持`tufte`格式（以 Edward Tufte 命名，参见[`rmarkdown.rstudio.com/tufte_handout_format.html`](http://rmarkdown.rstudio.com/tufte_handout_format.html)）。剩下的工作就是`render()`我们的\
  \ Markdown 文档，然后将文件重命名为所需名称。\n\n```\noutput$downloadReport <- downloadHandler(\n\
  \  filename = function() {\n    paste('quiz-report', sep = '.', 'pdf')\n  },\n \
  \ content = function(file) {\n    src <- normalizePath('report.Rmd')\n    owd <-\
  \ setwd(tempdir())\n    on.exit(setwd(owd))\n    file.copy(src, 'report.Rmd', overwrite\
  \ = TRUE)\n    knitr::opts_chunk$set(tidy = FALSE, cache.extra = packageVersion('tufte'))\n\
  \    options(htmltools.dir.version = FALSE)\n    out <- render('report.Rmd')\n \
  \   file.rename(out, file)\n  }\n)\n```\n\n我们已看到，Shiny 服务器端需要能够根据相应的输入信息（例如是否存在表头）读取用户上传的文件，并负责启动`Rmarkdown`进程。诚然，要让该进程在任何计算机上工作，需要更改工作目录以及对布局和格式选项进行一些调整。我们在此部分结束时指出，简单的\
  \ PDF 设置起来会更简单（尽管我们承认更喜欢更简洁的`tufte`布局）。现在，我们将注意力转向用户界面。\n\n### ui.R\n\n对于这个非常简单的\
  \ Shiny 应用程序，用户界面相当简洁。仅用 40 行代码（实际上我们本可以移除一些选项），用户就可以上传 CSV 文件，查看该文件渲染的表格，并下载文件的分析结果。像之前一样，我们先给出完整代码，然后逐一说明每个区块：\n\
  \n```\n"
- "# Dynamic Reports and the Cloud User Interface\nshinyUI(\n  fluidPage(\n    title\
  \ = 'Score Control Panel',\n    sidebarLayout(\n      sidebarPanel(\n        helpText(\"\
  Upload a wide CSV file where\n          each column is 0 or 1 based on whether the\
  \ student\n          got that question incorrect or correct.\"),\n        fileInput('file1',\
  \ 'Choose file to upload',\n          accept = c(\n            'text/csv',\n   \
  \         'text/comma-separated-values',\n            'text/tab-separated-values',\n\
  \            'text/plain',\n            '.csv',\n            '.tsv'\n          )\n\
  \        ),\n        tags$hr(),\n        checkboxInput('header', 'Header', TRUE),\n\
  \        radioButtons('sep', 'Separator',\n          c(Comma=',',\n            Semicolon=';',\n\
  \            Tab='\\t'),\n          ','),\n        radioButtons('quote', 'Quote',\n\
  \          c(None='',\n            'Double Quote'='\"',\n            'Single Quote'=\"\
  '\"),\n          '\"'),\n        tags$hr(),\n        helpText(\"This is where helpertext\
  \ goes\"),\n        downloadButton('downloadReport')\n      ),\n      mainPanel(\n\
  \        tableOutput('contents')\n      )\n    )\n  )\n)\n```\n\n与往常一样，用户界面包含`fluidPage()`以及`sidebarPanel()`和`mainPanel()`。主要事件发生在侧边栏内，因此我们首先查看那里。`fileInput()`函数用于获取输入文件。我们可以控制接受的文件类型，并将范围限制为逗号分隔值或制表符分隔值。我们将上传控件命名为`file1`，回顾一下，在服务器端我们使用`input$file1`来读取文件。\n\
  \n```\nfileInput('file1', 'Choose file to upload',\n  accept = c(\n    'text/csv',\n\
  \    'text/comma-separated-values',\n    'text/tab-separated-values',\n    'text/plain',\n\
  \    '.csv',\n    '.tsv'\n  )\n),\n```\n\n另一个主要的关注点是下载区域。其理解起来并不复杂：\n\n```\ndownloadButton('downloadReport')\n\
  ```\n\n虽然有辅助文本框向用户进行说明，并且我们确实建议实际中设置示例布局，以便用户理解可接受的输入，但我们选择将此用户界面尽可能保持精简。在转向实际的报告文件之前，我们在图\
  \ 15-2 中展示了上传`scores.csv`文件（该文件可在 Apress 网站上获取）后 Shiny 应用程序的界面。\n\n![A393929_1_En_15_Fig2_HTML.jpg](img/A393929_1_En_15_Fig2_HTML.jpg)\n\
  \n图 15-2. 本地托管网站上的 Shiny 用户界面\n\n### report.Rmd\n\n本报告涉及测验或其他考试中每个问题的学生得分。我们的目标是将图\
  \ 15-2 中所示的输入转换为关于问题和测试有效性的可操作摘要信息。在阅读首次展示的全部代码之前，请花一点时间将此代码与独立的 Markdown 文件进行比较。两者没有重大区别。实际上，判断此文件是否由\
  \ Shiny 应用程序渲染的唯一方法是查看读取`scores <- scores()` 的这一行代码。\n\n```\n---\ntitle: \"Example\
  \ Scoring Report\"\nsubtitle: \"Item-Level Analysis\"\ndate: \"`r Sys.Date()`\"\n\
  output:\n  tufte::tufte_handout: default\n---\n\n"
- "# Raw Data\nHere is a sample of the data uploaded including the first few and last\n\
  rows, and first few and last columns:\n```{r echo=FALSE, include = FALSE}\nscores\
  \ <- scores()\n```\n\n```{r echo=FALSE, include = TRUE}\nif (ncol(scores) > 6) {\n\
  \  row.index <- c(1:3, (nrow(scores)-2):nrow(scores))\n  col.index <- c(1:3, (ncol(scores)-2):ncol(scores))\n\
  \  scores[row.index, col.index]\n} else scores[1:min(nrow(scores), 6), ]\n```\n\n"
- "# Item Analysis Item difficulty ranges from 0.0 to 1.0 and indicates\nthe proportion\
  \ of people who correctly answered the question. A\ndifficulty of 1.0 means everyone\
  \ answered correctly, indicating the\nitem is too easy. A difficulty of 0.0 means\
  \ everyone answered\nincorrectly, indicating the item is too hard. Item discrimination\n\
  indicates the correlation of the item to the overall test score.\nIdeally, items\
  \ should be positively correlated with the overall test\nscore. If not, there is\
  \ evidence the item is not functioning\nproperly.\n\n```{r, echo = FALSE}\nlibrary(psychometric)\n\
  scores <- na.omit(scores)\nitem.difficulty <- apply(scores, 2, function(x) sum(x)/length(x))\n\
  item.discrimination <- apply(scores, 2, function(x) {\n  x <- na.omit(x)\n  discrim(x,\
  \ scores$total.score)\n})\nitem.stats <- data.frame(item.difficulty, item.discrimination)\n\
  colnames(item.stats) <- c(\"Difficulty\", \"Discrimination\")\nitem.stats\n```\n\
  \n"
- "# Reliability for Classical Test Theory Cronbach's alpha of\n`r round(alpha.results$alpha,\
  \ 2)`, indicates `r\nifelse(alpha.results$alpha > .6, \"acceptable reliability\"\
  , \"low reliability\")` of\nalpha = `r format(alpha.results$alpha, FALSE, 2, 2)`.^[Alpha\
  \ ranges from 0 to 1, with one indicating a perfectly reliable test.]\nThe graph\
  \ shows the measurement error by level of\nability.^[Higher values indicate more\
  \ measurement error, indicating the test is less reliable at very low and very high\
  \ ability levels (scores).]\n```{r, echo = FALSE, fig.width = 5, fig.height = 4}\n\
  ## The Standard Error of Measurement can be plotted by\nvals <- plot(rasch.results,\
  \ type = \"IIC\", items = 0, plot = FALSE)\nplot(vals[, \"z\"], 1 / sqrt(vals[,\
  \ \"info\"]),\n  type = \"l\", lwd = 2, xlab = \"Ability\", ylab = \"Standard Error\"\
  ,\n  main = \"Standard Error of Measurement\")\n```\n\n\n\n"
- "# 项目分析\n\n各项目的分析结果如下表所示。^* *r* 表示项目与总分的点二列相关系数。*正确率* 表示特定项目的正确回答百分比。项目按相关系数从高到低排序。]\n\
  \n```{r, echo = FALSE, results = 'asis'}\nkable(biserial.results)\n```\n\n现在，我们来逐一分解并解释这个\
  \ Markdown 文件的每个部分。这个标题比第一个稍高级一些。请注意，我们使用了内联 R 代码来将日期设置为当前日期。此外，我们的输出不再仅仅是 `pdf_document`，而是使用了默认的\
  \ `tufte_handout` 样式（这是一个包含样式信息的 PDF）。我们直接从其包中调用该样式（回想一下，`library(tufte)` 是在服务器端调用的）。\n\
  \n```\n---\ntitle: \"示例评分报告\"\nsubtitle: \"项目层面分析\"\ndate: \"`r Sys.Date()`\"\n\
  output:\n  tufte::tufte_handout: default\n---\n```\n\n接下来是将我们的分数数据读入 Markdown 文件。我们已经熟悉\
  \ `echo=FALSE`，它用于阻止代码显示。然而，我们还设置了 `include=FALSE`，这会阻止代码的任何输出显示。如前所述，我们使用 Shiny\
  \ 服务器端的 `scores()` 变量，也就是我们使用 `read.csv()` 读取分数的地方。回想一下，在 Shiny 服务器上，我们将该变量简单地称为\
  \ `scores`。但在 `rmarkdown` 文件中，我们是将其作为函数调用的（毕竟它会动态更新）。为了避免继续将变量作为函数调用，我们在此使用同名的局部环境变量\
  \ `scores` 对其进行重命名：\n\n```{r echo=FALSE, include = FALSE}\nscores <- scores()\n\
  scores <- as.data.table(scores)\nsetnames(scores, 1, \"Student\")\n```\n\n我们的下一个代码块设置了\
  \ `results='asis'`，以防止对我们的 `knitr` 表格（称为 `kable`）进行进一步处理。此外，这段代码会将前五行和后两行与列输出到一个小的示例\
  \ `kable` 中。只有当行数或列数超过六时，它才会这样做。\n\n```{r, echo = FALSE, results = 'asis'}\nif (nrow(scores)\
  \ > 6) {\n  row.index <- c(1:3, (nrow(scores)-2):nrow(scores))\n} else {\n  row.index\
  \ <- 1:nrow(scores)\n}\nif (ncol(scores) > 6) {\n  col.index <- c(1:3, (ncol(scores)-2):ncol(scores))\n\
  }\nkable(scores[row.index, col.index, with = FALSE])\n```\n\n从这里开始，我们可以使用 `ltm`\
  \ 包计算测验或题目信度的若干指标。点二列相关系数是至关重要的；它使用更熟悉的皮尔逊相关系数，并针对测验题目是二分数据这一事实进行了调整。它允许比较学生在某个特定题目上的表现与他们在整个测验中的表现（因此我们将其与\
  \ `rowSums` 进行比较）。通过将这些数据从高到低排序，我们可以找出得分最低的测验题目。那些可能没有测量到我们测验主题的题目（诚然，这是极大的简化——心理测量学是一门远远超出本文范围的科学）。此外，我们还计算了克隆巴赫\
  \ α 系数和拉希模型，稍后会用到这些。再次强调，我们不打算直接将这些结果包含在我们的动态文档中；但我们可以在以后使用它们。\n\n```{r, include\
  \ = FALSE}\nitems <- names(scores)[-1]\nscores[, SUM := rowSums(scores[, items,\
  \ with = FALSE])]\n## 现在计算点二列相关系数\n## 首先将数据转换为长格式\nscores.long <- melt(scores, id.vars\
  \ = c(\"Student\", \"SUM\"))\n## 按项目计算点二列相关系数\n## 从高到低排序\nbiserial.results <- scores.long[,\
  \ .(\n  r = round(biserial.cor(SUM, value, level = 2), 3),\n  Correct = round(mean(value)\
  \ * 100, 1)\n), by = variable][order(r, decreasing = TRUE)]\nalpha.results <- cronbach.alpha(scores[,\
  \ !c(\"Student\", \"SUM\"), with=FALSE])\nrasch.results <- rasch(scores[,!c(\"Student\"\
  , \"SUM\"), with=FALSE])\n```\n\n并非所有代码都必须放在正式的代码块中；代码也可以与文档正文内联。这很有用，因为我们可以设置临界分数（在本例中，半随意地设置为\
  \ `0.6`），并根据这些分数在最终报告中生成不同的文本。`tufte` 包允许使用 `^[]` 进行侧边栏注释。\n\n```\n整个测验具有 `r ifelse(alpha.results$alpha\
  \ > .6, \"可接受的信度\", \"信度较低\")`，α = `r format(alpha.results$alpha, FALSE, 2, 2)`。^[Alpha\
  \ 取值范围从 0 到 1，1 表示测验完全可靠。] 该图显示了按能力水平划分的测量误差。^[值越高表示测量误差越大，表明测验在非常低和非常高的能力水平（分数）下信度较低。]\n\
  ```\n\n回想一下我们之前的讨论，图形大小可以在代码块中进行控制。在这里，我们绘制了拉希模型图，并看到高水平和低水平学生的测量精确度较低：\n\n```{r,\
  \ echo = FALSE, fig.width = 5, fig.height = 4}\n## 可以绘制测量标准误\nvals <- plot(rasch.results,\
  \ type = \"IIC\", items = 0, plot = FALSE)\nplot(vals[, \"z\"], 1 / sqrt(vals[,\
  \ \"info\"]),\n     type = \"l\", lwd = 2, xlab = \"能力\", ylab = \"标准误\",\n    \
  \ main = \"测量标准误\")\n```\n\n代码最后以最后一个 `kable` 结尾，但我们之前已经看到过，不必赘述。现在我们在图 15-3 中展示的是下载的最终结果。请注意，所有被隐藏的代码都没有显示出来。同时，注意数据的样本，因为从图\
  \ 15-2 中我们知道数据有多于六行或六列。最后，请注意自动编号的侧边注释，它们提供了更多细节。这些注释是使用文档文本区域中的 `^[]` 代码构建的。这使得提供详细但非关键性的洞察变得非常容易。\n\
  \n![A393929_1_En_15_Fig3_HTML.jpg](img/A393929_1_En_15_Fig3_HTML.jpg)\n\n图 15-3.\
  \ 下载的 PDF\n\n## 上传至云端\n\n我们的最后一项任务是将文件从本地机器上传到云实例。请记住，在前面的章节中，我们不仅使用 `PuTTY` 在云上安装了\
  \ Shiny Server，还使用 `WinSCP` 将文件上传到云。我们启动 `WinSCP`，重新连接，并确保左侧的本地端位于我们的 Shiny 应用程序文件夹中，而右侧的云服务器端位于\
  \ `/home/ubuntu`。我们回忆一下该过程的结果，如图 15-4 所示。\n\n![A393929_1_En_15_Fig4_HTML.jpg](img/A393929_1_En_15_Fig4_HTML.jpg)\n\
  \n图 15-4. 已上传 PieChart_Time、slider_time 和 Upload_hist Shiny 应用程序的 WinSCP\n\n从这里开始，我们访问\
  \ `PuTTY` 并从命令行运行以下代码：\n\n```\nsudo cp -R ∼/Chapter15 /srv/shiny-server/\n```\n\n\
  请记住，在较早的章节中，我们调整了实例以允许从特定地址访问特定端口。您现在可以通过在任意浏览器中输入以下 URL 来验证您的应用程序是否正常工作：\n\n```\n\
  http://Your.Instance.IP.Address:3838/Chapter15/\n```\n\n## 总结\n\n在最后一章中，我们构建了一个可以基于新数据快速更新的动态文档。这种更新甚至可以扩展到图形和内联\
  \ `ifelse` 语句，允许叙述本身根据新数据发生变化。此外，我们构建了一个 Shiny 应用程序，允许有互联网连接的用户上传文件，为该报告提供新数据。此类报告可以以多种格式下载，尽管我们选择了\
  \ PDF。\n\n\n\n在本文中，我们提供了高级数据管理技术，包括连接各种数据库。这些技术与动态文档能很好地融合，并具备将数据仓库中的信息轻松转化为可执行情报的能力。我们的最终结论是：随着数据变得越来越庞大，成功筛选并呈现有用数据的能力，在任何领域中都成为更加重要的技能。祝编码愉快！\n\
