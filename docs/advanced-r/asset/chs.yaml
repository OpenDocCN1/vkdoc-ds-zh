  \        X_id                            borough\n40356442        Kosher Island\
  \  Jewish/Kosher  57e7f9a275bec64c417b9ab2        Staten Island\ngrades\n[ { \"\
  date\" : { \"$date\" : \"2014-10-06T00:00:00.000Z\"} , \"grade\" : \"A\" , \"score\"\
  \ : 9} ,\n{ \"date\" : { \"$date\" : \"2014-05-20T00:00:00.000Z\"} , \"grade\" :\
  \ \"A\" , \"score\" : 12} ,\n{ \"date\" : { \"$date\" : \"2013-04-04T00:00:00.000Z\"\
  } , \"grade\" : \"A\" , \"score\" : 12} ,\n{ \"date\" : { \"$date\" : \"2012-01-24T00:00:00.000Z\"\
  } , \"grade\" : \"A\" , \"score\" : 9}]\nView(output1)\n```\n\n这些数据似乎包含位置、食物类型和餐厅名称等信息。利用这些知识，我们细化搜索条件，查找美式菜系。这很有意思，因为我们移除了起始和限制参数，并调整了查询条件。这就是数据卫生变得至关重要的地方。天真地，我们首先尝试了\
  \ `dbGetQuery(con3, 'restaurants' , '{\"cuisine\": \"American\"}')`。这没有成功。因为我们不得不重写这一部分（之前我们最喜欢的用于此数据库的包已从\
  \ CRAN 移除），\n```\n\n\n## 用户界面绘制饼图 ShinymainPanel()\n\n`ui <- shinyUI(fluidPage(`\n\
  \n`# 页面标题`\n`titlePanel(\"用户控制的图表\"),`\n\n`# 侧边栏包含用户控制的数字、文本和复选框输入`\n`sidebarLayout(`\n\
  `sidebarPanel(`\n`numericInput(\"pie\",`\n`\"饼图百分比\",`\n`min = 0,`\n`max = 100,`\n\
  `value = 50),`\n`textInput(\"pietext\", \"文本输入\", value = \"默认标题\",`\n`placeholder\
  \ = \"在此输入您的标题\"),`\n`checkboxInput(\"pieChoice\",`\n`\"  改用饼图\", value = FALSE)`\n\
  `),`\n\n`# 显示图表`\n`mainPanel(`\n`plotOutput(\"piePlot\")`\n`)`\n`)`\n`))`\n\n`#\
  \ 服务器端 R 代码（隐藏于用户）创建饼图或条形图`\n`server <- shinyServer(function(input, output) {`\n\
  `output$piePlot <- renderPlot({`\n\n`# 根据用户输入的 input$pie 生成饼图比率`\n`y <- c(input$pie,\
  \ 100-input$pie)`\n\n`# 使用指定比率和标签绘制饼图或条形图`\n`if(input$pieChoice == FALSE){`\n`barplot(y,\
  \ ylim = c(0,100),`\n`names.arg = c(input$pietext, paste0(\"补集 \", input$pietext)))`\n\
  `}else{`\n`pie(y, labels = c(input$pietext, paste0(\"补集 \", input$pietext)))}`\n\
  `})`\n`})`\n\n`# 运行应用程序`\n`shinyApp(ui = ui, server = server)`\n```\n\n在深入探讨这段代码之前，我们先看看它的实际效果。在\
  \ RStudio 控制台中输入并运行以下代码，在本地 Windows 机器上安装 Shiny：\n\n```\ninstall.packages(\"shiny\"\
  )\n```\n\n现在，打开你精心输入的`app.R`文件，一次性运行所有代码。代码区域右上角附近应该会有一个\"Run App\"播放按钮。无论如何，屏幕上都会出现类似图\
  \ 13-1 的内容。\n\n![A393929_1_En_13_Fig1_HTML.jpg](img/A393929_1_En_13_Fig1_HTML.jpg)\n\
  \n图 13-1. 本地托管的 Shiny 应用，展示我们正在获得的成果\n\n请随意输入各种数字和文本值。尝试使用 Shiny，看看它能做什么。在此过程中，你会意识到\
  \ Shiny 所做的是为你和 R 之间提供接口。现在，这个特定运行实例是由你本地机器上的 RStudio 托管的。注意控制台中显示\"listening（监听）\"\
  ，你可能需要点击\"Stop（停止）\"按钮才能输入新代码。\n\n那么发生了什么？假设你将\"饼图百分比\"数字改为 75。这个`numericInput()`是一个响应式值。当你修改它时，后台会发送一个信号，通知服务器`input$pie`已更改。服务器随后通知所有使用`input$pie`的响应式函数，告知它们有内容变了。在我们的例子中，`renderPlot()`是一个响应式函数。它现在知道`input$pie`不同了，于是查询该值，获取新值，并重新运行其所有代码。由于这是一个输出值，整个循环会通过`output$piePlot`反向重复，最终用户端的`plotOutput()`刷新显示。\n\
  \n关于这一切，有几个重要事项需要注意。我们刚才描述的过程会重新运行`renderPlot()`内的所有代码——全部代码。此时，在其他条件不变的情况下，无需重新查找`input$pietext`和`input$pieChoice`。我们的响应式函数知道它们的值，因为这些值是最新的；虽然这些值被再次使用，但不会被再次调用。然而，如果我们在`renderPlot()`内部进行的操作比减法和绘图更复杂，那么做出任何更改都会带来相对较高的性能成本。虽然这段代码相当简洁，但你仍然可以看到三个放置\
  \ R 代码的位置。第一个是`library(shiny)`所在的位置。这位于我们的`shinyServer()`外部。位于此处的代码（如我们的库调用）在每次会话中只运行一次。单个会话可以有多个用户同时交互（尽管目前这有点深奥）。不过，每个新用户至少会执行一次`shinyServer()`内的所有代码。最后，正如我们刚刚看到的，响应式函数（如`renderPlot()`）内的代码会在任何关联的响应式输入值更新时运行一次。这意味着，为了提高效率，应尽可能将代码放在响应式函数之外。此外，如果你预见到会有大量用户访问，也应尽可能将代码放在服务器之外。\n\
  \n现在，让我们介绍一些新函数。记住，有用户输入侧、服务器侧和整个 Shiny 应用。深入探究，Shiny 实际上就是这三个部分。事实上，下面是一个非常精简的\
  \ Shiny 应用：\n\n```\nlibrary(shiny)\n\n### 定义用户界面\nui <- shinyUI(fluidPage())\n\n\
  ### 定义服务器\nserver <- shinyServer(function(input, output) {})\n\n### 运行应用程序\nshinyApp(ui\
  \ = ui, server = server)\n```\n\n你可以运行这段代码，得到一个漂亮的空白页面。虽然这可能没有之前的代码那么令人振奋，但这有助于你快速开始在这种界面中编写代码。在用户界面部分，我们看到的是`fluidPage()`函数调用，我们在其中放置所有面向用户的文本。这部分代码是\
  \ Shiny 中最不熟悉的，因为这是创建用户可见 HTML 的代码。在参考章节中，我们提供了所有 Shiny UI 函数的链接。不过，在本章中，我们坚持使用同一基本布局，这种布局在页面内具有相当好的自适应能力，或者说流式布局，具体取决于浏览器的显示区域。请注意，这是一个\
  \ R 函数，而 R 函数接受用逗号分隔的参数。我们不断扩展的应用的各个方面都包含在这个包装函数中，它负责将所有内容转换为网页就绪的标记语言。对于我们图 13-1\
  \ 中的第一个应用，我们使用了侧边栏布局。这个函数需要两个参数：我们控制应用的侧边栏面板和绘制图表的主面板。编辑用户界面后，我们得到以下代码：\n\n```\n\
  \n### 定义用户界面\nui <- shinyUI(fluidPage(\nsidebarLayout(\nsidebarPanel(),\nmainPanel()\n\
  )\n))\n```\n\n这段代码完美诠释了数学中函数组合概念的力量。我们的目标是最终让用户通过某些尚未命名的函数向我们的 R 代码输入内容（如图 13-1\
  \ 示例中的文本或复选框），这些函数生成可视化输出，然后输入到`sidebarPanel()`函数，该函数产生网页输出，再输入到`fluidPage()`，最终输出完整的\
  \ Web 用户界面。我们可以看到结果，虽然仍是空白，如图 13-2 所示。\n\n![A393929_1_En_13_Fig2_HTML.jpg](img/A393929_1_En_13_Fig2_HTML.jpg)\n\
  \n图 13-2. 一个近乎空白的 Shiny 应用，带有 sidebarPanel()\n\n从这一点出发，我们可以使用三个输入函数快速构建用户的输入。每个输入函数都遵循特定格式，即`blargInput(输入标识,\
  \ 用户可读的文本标签, 与 blarg 所代表的特定输入类型相关的设置)`。正式地说，我们的三个输入函数具有以下布局，请注意它们的相似之处！\n\n```\n\
  numericInput(inputId, label, value, min = NA, max = NA, step = NA,  width = NULL)\n\
  textInput(inputId, label, value = \"\", width = NULL, placeholder = NULL)\ncheckboxInput(inputId,\
  \ label, value = FALSE, width = NULL)\n```\n\n继续为我们的代码填写一些具体内容，我们可以为每个输入设置有用的标识变量，以便稍后在服务器代码中使用。既然我们打算构建一个饼图（亲爱的读者，请不要因为我们选择这个而讨厌我们），将数字输入限制在`0`到`100`之间是合理的。由于服务器代码在启动时运行一次，为数字输入提供默认值，以及文本输入提供默认值，也是有意义的。进一步构建我们迅速发展的用户界面代码，我们现在得到以下内容：\n\
  \n```\n\n## 用户界面绘制饼图\nui <- shinyUI(fluidPage(\n\n\n\n## 由用户控制的数值、文本和复选框输入侧边栏\n\n\
  ```\nsidebarLayout(\nsidebarPanel(\nnumericInput(\"pie\", \"饼图百分比\",\nmin = 0, max\
  \ = 100, value = 50),\ntextInput(\"pietext\", \"文本输入\", value = \"默认标题\",\nplaceholder\
  \ = \"在此输入您的标题\"),\ncheckboxInput(\"pieChoice\",  \"  我想要饼图。\", value = FALSE)\n\
  ),\nmainPanel()\n)\n))\n```\n\n再次强调，进行这些修改后，重新运行整个应用是合理的，我们将看到图 13-3 中的新结果。请注意，我们代码中的\
  \ `mainPanel()` 当前是空的，确实，在图 13-3 中，我们看不到右侧有任何内容。\n\n![A393929_1_En_13_Fig3_HTML.jpg](img/A393929_1_En_13_Fig3_HTML.jpg)\n\
  \n图 13-3.\n\n用户界面已基本完成，侧边栏中的输入部分也确实完成了\n\n现在我们已经捕获了用户输入，可以准备在服务器端使用它了。请记住，Shiny\
  \ 是一个 R 语言封装器，它接收输入，并在输入发生变化时，提醒服务器端的响应函数有内容发生了改变。在后台，Shiny 会自动处理何时检测输入变化，并通知服务器上正确的响应函数；我们无需担心这些。我们的服务器定义了一个新函数，该函数将\
  \ `input` 和 `output` 作为形式参数，并在函数体中使用它们。如果需要，可以快速回顾一下第 4 章，以复习函数的定义。由于我们只想绘制条形图或饼图，因此大部分代码都是用非常常见的\
  \ R 代码精确完成这项任务的。实际上，唯一不太寻常的 R 代码部分是我们的响应函数 `renderPlot()`。因为我们希望生成图形输出，所以使用了该函数。\n\
  \n响应函数始终在等待 Shiny 通知它们用户界面侧的输入有任何变化。当某个输入发生变化时，如果响应函数的函数体中至少包含一个已更改的值，它们便会收到通知。如果是这样，那么这些响应函数就会使用新的值再次运行其代码。我们在以下代码中看到了这一点。唯一另一部分是，`renderPlot()`\
  \ 的输出会存储在一个输出变量中，我们将其命名为 `piePlot`（尽管它可能不会输出饼图，具体取决于复选框的选择——这完全是我们选名不当的错）。\n\n```\n\
  ## 服务器端 R 代码，创建饼图或条形图\nserver <- shinyServer(function(input, output) {\noutput$piePlot\
  \ <- renderPlot({\n\n## 根据用户输入的 input$pie 生成饼图比例\ny <- c(input$pie, 100-input$pie)\n\
  \n## 使用指定的比例和标签绘制饼图或条形图\nif(input$pieChoice == FALSE){\nbarplot(y, ylim = c(0,100),\n\
  names.arg = c(input$pietext, paste0(\"互补项：\", input$pietext)))\n}else{\npie(y, labels\
  \ = c(input$pietext, paste0(\"互补项：\", input$pietext)))}\n})\n})\n```\n\n基本上就是这样。当我们的服务器运行时，它会通知用户界面函数\
  \ `plotOutput(\"piePlot\")` 生成新的图像。这个函数位于 `mainPanel()` 区域。在这个简单的 Shiny 模型下，侧边栏接收用户输入，服务器端在后台由\
  \ R 进行处理，而主面板则是用户查看处理后的输出结果的地方。仅此一次，我们展示一下 Shiny 为我们生成的、用于在图 13-1 中展示的完整 HTML 代码：\n\
  \n```\n    json2[2014.02.04];jquery[1.11.3];shiny[0.13.1];bootstrap[3.3.5]\n\n \
  \ 用户控制图表\n\n用户控制图表 ShinyHTML 代码，创建\n\n饼图百分比\n\n文本输入\n\n  我想要饼图。\n\n```\n\n所以，现在请回头仔细查看我们在本节中展示的第一个代码块，也就是完整的\
  \ Shiny 应用，并意识到那段代码生成了上述所有 HTML 和 JavaScript。这就是 Shiny 的全部内容。在这个例子中，我们的 R 代码并不特别出彩。尽管如此，重要的还是原理。用户现在可以与数据交互，并且不难想象出更有趣的应用。\n\
  \n在接下来的几节中，我们将介绍一些其他有趣且实用的 Shiny 输入函数，以及一些必要的响应函数。最后，我们将把所有内容上传到云端，这样你就可以在网络上实时看到它们。\n\
  \n## 动态 Shiny\n\n既然我们对 Shiny 的功能有了更好的理解，那么认识到网页相对于打印报告的动态潜力就很重要了。其中一位作者是数学教授，数学教学中的一个挑战是，一旦数据超过三维，学生就难以将这些信息概念化。自然，学生们并非唯一受困于高维盲点的人。时间可以提供第四维，而\
  \ Shiny 可以为我们提供这个时间维度。\n\n我们之前提到的 Shiny 的另一个特点是，R 代码适合放置在三个不同的位置。第一个位置是在所有代码的开头，在编写用户界面或服务器端代码之前。放置在此处的代码每个实例运行一次。虽然在本地机器上这可能不那么明显，但当你的代码托管在云端时，一个特定的\
  \ R 会话可能有多个用户与之交互。这就是我们在上一章安装的 Shiny 服务器的工作方式。这是读取任何静态数据或执行任何一次性计算的理想位置，其计算效率最高。虽然在此例中我们没有这样做，但代码也可以放在服务器代码内部，但在任何响应函数之外，这样的代码会在每个用户连接到会话时运行一次。最后，服务器函数内部的响应函数内的代码，每次该函数引用的任何输入数据发生变化时都会执行一次。\n\
  \n让我们看看如何随时间改变数据。从用户界面侧来看，有一个输入函数是数字线滑块条。与所有输入函数一样，我们需要为它命名，以便我们的响应函数知道去哪里查找输入更新。与上一节中的\
  \ `numericInput()` 类似，我们为这个函数提供一些以年份为单位的最小值和最大值。最后，我们将为 `sliderInput()` 函数添加动画效果。看看我们在用户界面中使用的代码。我们的代码使用了一个动画选项，其中包括以毫秒为单位的\
  \ `interval`，并且动画设置为循环播放。\n\n```\nsliderInput(\"ayear\", \"学年：\",\nmin = 2014, max\
  \ = 2017,\nvalue = 2014, step = 1,\nanimate = animationOptions(interval=600, loop=T)\
  \ )\n```\n\n虽然这个应用也展示了如何对静态数据和用户输入执行 R 计算，但从 R 代码的角度来看，它实际上又相当简单。事实上，除了 `titlePanel()`\
  \ 命令和当然还有我们的滑块代码之外，这与我们的第一个 Shiny 应用非常相似。我们在图 13-4 中展示了代码和最终结果。\n\n![A393929_1_En_13_Fig4_HTML.jpg](img/A393929_1_En_13_Fig4_HTML.jpg)\n\
  \n图 13-4.\n\n一个带有“播放”按钮功能的滑块条输入，显示随时间变化的数据\n\n```\nlibrary(shiny)\nslider_data<-read.csv(\"\
  slider_data.csv\", header = TRUE, sep = \",\")\nPhase1    <- slider_data[,2]\nPhase2\
  \    <- slider_data[,3]\nPhase3    <- slider_data[,4]\nPhase4    <- slider_data[,5]\n\
  \n### 定义用于绘制条形图的应用的用户界面\nui <- shinyUI(fluidPage(\n\n### 应用标题\ntitlePanel(\"培训计划结果\"\
  ),\n```\n\n\n\n### 带有分箱数量滑块输入的侧边栏\n`sidebarLayout(\nsidebarPanel(\nsliderInput(\"\
  ayear\", \"学年:\",\nmin = 2014, max = 2017,\nvalue = 2014, step = 1,\nanimate = animationOptions(interval=600,\
  \ loop=T) )  ),\n\n### 显示条形图\nmainPanel(plotOutput(\"barPlot\") )              \
  \ )               ))`\n\n### 定义绘制条形图所需的服务器逻辑\n`server <- shinyServer(function(input,\
  \ output) {\noutput$barPlot <- renderPlot({\n\n### 统计各个阶段中匹配正确日期的值数量。\ncap<-input$ayear*100\n\
  x <- c(sum(Phase1<cap), sum(Phase2<cap), sum(Phase3<cap), sum(Phase4<cap))\n\n###\
  \ 绘制对应年份的条形图。\nbarplot(x, names.arg = c(\"第一阶段\", \"第二阶段\", \"第三阶段\", \"研究员\"),\n\
  col = c(\"deeppink1\",\"deeppink2\",\"deeppink3\",\"deeppink4\"),  ylim=c(0,50))\n\
  })           })`\n\n### 运行应用\n`shinyApp(ui = ui, server = server)`\n\n## 将用户文件上传到\
  \ Shiny\n\n本章的最后一个示例表明，用户可以通过 Shiny 上传文件，然后由 R 进行处理。当然，与前两个示例不同，这样做有一定风险，因为这些上传的文件不受我们控制。数据可能是任何文件，不一定会与我们的结果真正匹配。可以在代码中构建各种错误检查功能；事实上，我们在讨论函数时已经部分提到了这些技术。然而，为了将我们的代码严格聚焦于新功能，我们暂时假设自己生活在一个完美的世界中。我们在\
  \ Apress 网站上有一个本书的示例文件，它只是一个逗号分隔的值文件，包含数字 1 到 10。\n\n也许不足为奇的是，要在 Shiny 中接收文件输入，命令是\
  \ `fileInput()`。除了 `inputId` 之外，最有趣的功能可能是它甚至可以接受 `multiple`（多个）文件上传，尽管在我们的示例中，我们将其保留为默认值\
  \ `FALSE`。并非所有浏览器都支持上传多个文件。同样在用户界面区域，我们使用了一个新的输出函数 `tableOutput()`，它与 `plotOutput()`\
  \ 一起，使我们能够为用户提供图表和图形两种输出。在讨论使我们能够与用户文件交互的服务器端代码之前，我们先看看 CSV 文件上传给我们带来了什么。图 13-5\
  \ 是我们上传 CSV 文件后的视图，下面我们仅展示用户界面的代码：\n\n![A393929_1_En_13_Fig5_HTML.jpg](img/A393929_1_En_13_Fig5_HTML.jpg)\n\
  \n图 13-5. 文件上传结果\n\n```\nui <- shinyUI(fluidPage(\nfileInput(\"file\", label = h3(\"\
  直方图数据文件输入\")),\ntableOutput(\"tabledf\"),\ntableOutput(\"tabledf2\"),\nplotOutput(\"\
  histPlot1\")  ))\n```\n\n首先，请注意第一个表格。它包含四个变量，这些变量是直接访问 `input$file` 变量的结果。基于我们之前的其他示例（其中用户输入可以直接从\
  \ `input$inputId` 访问），这可能会有点反直觉。然而，它确实表明，我们的用户输入实际上是一个数据框，并且临时数据路径可以像访问任何文件位置一样被访问。郑重提醒：如果用户上传另一个文件，由于我们是在临时目录中，旧文件很可能会被覆盖。接下来，请注意我们文件的实际数据位于第二个表格中，如直方图所示，这些信息可用于我们选择编写的任何\
  \ R 计算。\n\n接下来让我们重点看看服务器端，因为这并不像我们之前的示例那么简单。有时，你遇到的输入比单个数值或文本值需要更多的管理。由于该数据是输入数据，因此需要一个响应式函数来感知其是否发生变化。然而，你可能更倾向于使用相当简洁的代码。幸运的是，Shiny\
  \ 提供了一个基本的响应式函数，它就叫 `reactive()`。在下面的代码中，我们创建了自己的响应式函数来处理新场景，即我们想要的场景。当文件上传时，Shiny\
  \ 会提醒我们的响应式函数 `reactive()`，`input$file` 已发生变化。该函数自然会查询输入以了解当前内容，并将该数据框存储到变量 `file1`\
  \ 中。我们需要访问 CSV 文件中的数据，因此需要对该文件调用 `read.csv()`，这自然需要知道文件的位置。该位置存储在名为 `datapath` 的最后一列中。我们得到的是一个可以在后续代码中像数据框一样处理的对象。\n\
  \n```\nhistData<-reactive({\nfile1<-input$file\nread.csv(file1$datapath,header=TRUE\
  \ ,sep = \",\")      })\n```\n\n除此之外，我们现在可以在其他响应式函数（甚至是熟悉的函数）中使用我们的数据。我们展示一个新的响应式函数\
  \ `renderTable()`，以及一个熟悉的函数 `renderPlot()`。你还应该注意 `histData()$X1`。请注意，它带有函数括号，但元素仍然通过熟悉的\
  \ `$` 访问。这是用响应式函数构建的，因此必须认识到，它既是一个从用户获取输入的函数，也是一个包含可访问数据的数据存储对象。\n\n```\noutput$tabledf2<-renderTable({\n\
  histData()            })\noutput$histPlot1<-renderPlot({\nhist(as.numeric(histData()$X1))\
  \              })\n```\n\n至此，我们对代码的分析就结束了。为完整起见，我们在此节末尾给出整个代码，但现在你已经掌握了在 Shiny 中启动和运行的技术。在本节结束之前，我们指出，参考资料部分的第一链接是一个参考网站，涵盖了大部分甚至所有的\
  \ Shiny 函数。如果你有任何想做的事情，请先查阅那里。它是相当直观的。另外值得注意的是，本章的下一节将展示如何将应用文件上传到云端并使其在线运行。最后，请注意用户界面中\
  \ `fileInput()` 函数内部的 `h3()` 函数。Shiny 拥有一整套函数，可以复制各种常见的 HTML 功能，例如标题。在本章中，我们认为这些是无关紧要的。在第\
  \ 14 章中，我们将更多地关注如何让用户界面变得“漂亮”（暂且这么说）。\n\n```\nlibrary(shiny)\nui <- shinyUI(fluidPage(\n\
  \n### 复制下面这行以创建一个文件上传管理器\nfileInput(\"file\", label = h3(\"直方图数据文件输入\"), multiple\
  \ = FALSE),\ntableOutput(\"tabledf\"),\ntableOutput(\"tabledf2\"),\nplotOutput(\"\
  histPlot1\")\n))\n\n### 定义绘制图形所需的服务器逻辑\nserver <- shinyServer(function(input, output)\
  \ {\noutput$tabledf<-renderTable({\ninput$file\n})\nhistData<-reactive({\nfile1<-input$file\n\
  read.csv(file1$datapath, header=TRUE ,sep = \",\")     })\noutput$tabledf2<-renderTable({\n\
  histData()           })\noutput$histPlot1<-renderPlot({\nhist(as.numeric(histData()$X1))\
  \               })\n})\n```\n\n\n\n### 运行应用程序\n`shinyApp(ui = ui, server = server)`\n\
  \n请注意，在这段代码中，我们并未专注于侧边面板或主面板等区别；而是将用户界面端（包括请求的输入和生成的输出）全部混杂在一起。值得留意的是，如果你有一个侧边面板，则需要一个主面板来放置侧边面板未承载的所有输出。\n\
  \n## 在云端托管 Shiny\n\n我们的最后一项任务是将文件从本地机器传输到云端实例。请记住，在前面的章节中，我们不仅使用了 `PuTTY`（Tatham,\
  \ 2016）在云端安装 Shiny Server，还使用了 `WinSCP`（Prikryl, 2007）将文件上传到云端。我们启动 `WinSCP`，重新连接，并确保左侧本地目录位于\
  \ Shiny 应用程序文件夹中，而右侧云端服务器目录位于 `/home/ubuntu` 下。此过程的结果如图 13-6 所示。\n\n![A393929_1_En_13_Fig6_HTML.jpg](img/A393929_1_En_13_Fig6_HTML.jpg)\n\
  \n**图 13-6.** WinSCP 界面，显示已上传的 PieChart_Time、slider_time 和 Upload_hist 三个 Shiny\
  \ 应用程序\n\n接下来，我们访问 `PuTTY`，并在命令行中依次运行以下代码：\n\n```\nsudo cp -R ∼/PieChart_Time /srv/shiny-server/\n\
  sudo cp -R ∼/slider_time /srv/shiny-server/\nsudo cp -R ∼/Upload_hist /srv/shiny-server/\n\
  ```\n\n至此，只剩下最后一步。回想一下，当初我们首次设置云端实例时，曾谨慎地只允许少数几个 IP 地址访问少数几个端口。你需要重新登录 AWS 并再次进入\
  \ EC2 控制面板。在左侧导航菜单中，回到安全组并选择你的 AdvancedR 组。选中该组后，点击“入站”选项卡，然后点击“编辑”->“添加规则”。你需要使用自定义\
  \ TCP 规则，添加端口 3838，最后将其锁定到你的 IP 地址。然后点击“保存”。结果如图 13-7 所示。\n\n![A393929_1_En_13_Fig7_HTML.jpg](img/A393929_1_En_13_Fig7_HTML.jpg)\n\
  \n**图 13-7.** AWS 入站规则表，Shiny Server 端口 3838 仅对单个本地 IP 地址开放\n\n现在，你可以通过在任意浏览器中输入以下\
  \ URL 来验证你的应用程序是否正常运行：\n\n`http://Your.Instance.IP.Address:3838/PieChart_Time/`\n\
  \n`http://Your.Instance.IP.Address:3838/slider_time/`\n\n`http://Your.Instance.IP.Address:3838/Upload_hist/`\n\
  \n如果你希望允许其他人或互联网上的所有人访问你的应用程序，请将入站规则的源 IP 地址更改为 `0.0.0.0/0`（仅针对端口 `3838`）。作为一种安全措施，不允许外部世界访问你的\
  \ SSH 端口。当然，如果你现在托管了一个对全世界开放的 3838 端口，你的服务器将是可见和已知的。为不同活动使用不同的云端实例可能是有益的。我们建议不要在可公开访问的服务器上存放机密数据。再次强调，云安全超出了本书的讨论范围。\n\
  \n## 最终思考\n\n我们似乎花了不少时间讨论云安全问题。这背后有两个原因。首先，这纯粹是我们多疑的天性使然。然而，相当一部分数据可能包含机密信息。合乎道德地使用数据，包括采取合理的安全措施，非常重要。最近几个月，AWS\
  \ 在为 EC2 创建更安全的环境方面取得了长足进步。一如既往，安全是一个合理性的问题。你的数据越重要，就越需要采取更好的措施来保护这些信息。\n\n抛开这些顾虑不谈，让用户以如此开放的方式与数据分析进行交互，这确实是一项前所未有的能力。是的，根据我们的经验，这可能会导致一些数据消费者做出不明智的决策。尽管如此，通过像\
  \ Shiny 这样的技术所能实现的透明度带来的好处，远远超过其缺点。这是一个令人兴奋的世界，我们渴望去探索。\n\n# Shiny 仪表板示例\n\n本章并非理解本书其他章节所必需的内容。虽然我们介绍了一些新技术，但本章的主要内容是一个完整的仪表板示例，你可以根据需要进行修改。\n\
  \n这个示例具体是做什么的？它将我们在前一章中使用的应用程序，以一种引人入胜的交互式格式呈现出来。重要的是要记住，虽然我们通常以图形输出的方式展示这些应用程序，但实际上可以对数据执行任何\
  \ R 语言的处理过程。其目标是让信息消费者能够自然地与实时数据进行交互，无论这些消费者是研究评审员、上级主管还是董事会成员。\n\n与上一章类似，我们在 Windows\
  \ 系统的 `RStudio`（RStudio Team, 2015）中介绍此内容。我们既提供了理解此仪表板的框架，也提供了一些专业提示。务必将此示例视为一种创意孵化器。我们希望你能看到自己喜欢的内容，更重要的是，意识到如何最好地展示你的数据。\n\
  \n我们将从仪表板的基本结构开始讲起。\n\n## 仪表板的骨架\n\n回顾一下前一章中最基础的 `shiny`（Chang, Cheng, Allaire,\
  \ Xie, and McPherson, 2016）应用程序：\n\n```\nlibrary(shiny)\n\n### 定义用户界面\nui <- shinyUI(fluidPage())\n\
  \n### 定义服务器\nserver <- shinyServer(function(input, output) {})\n\n### 运行应用程序\nshinyApp(ui\
  \ = ui, server = server)\n```\n\n这段代码从一开始就很值得审视，因为它突出了所有 Shiny 应用程序都包含一个用户界面和一个服务器端（R\
  \ 代码逻辑所在之处）——而这两者本身都作为 R 进程运行（可能运行在云服务器上）。我们打算向该结构添加的，只是用户界面端的一些代码。这应该合情合理，因为仪表板更像是关于用户界面，而非任何新的代码逻辑。其目标是让用户可以轻松获取分析结果和统计推断。为此，我们需要安装一个新的库，但也仅仅是一个库：`shinydashboard`（Chang,\
  \ 2015）。在 RStudio 的命令行中，运行以下代码：\n\n```\ninstall.packages(\"shinydashboard\")\n```\n\
  \n安装好这个新包后，我们现在可以来看看最基础的 Shiny 仪表板应用程序。仪表板包括一个标题栏、一个带有各种菜单项的侧边栏，以及一个主体区域，应用程序的不同对象都位于主体中。将此仪表板代码布局与单一的应用程序代码进行比较和对比。这两个版本几乎相同。代码之后，请参见图\
  \ 14-1 中它们生成的界面。\n\n![A393929_1_En_14_Fig1_HTML.jpg](img/A393929_1_En_14_Fig1_HTML.jpg)\n\
  \n**图 14-1.** 最基础的 Shiny 仪表板，内容近乎空白\n\n```\nlibrary(shiny)\nlibrary(shinydashboard)\n\
  \n### 定义用户界面\nui <- dashboardPage(\ndashboardHeader(),\ndashboardSidebar(),\ndashboardBody()\n\
  )\n\n### 定义服务器\nserver <- shinyServer(function(input, output) {})\n```\n\n\n\n###\
  \ 运行应用程序\n`shinyApp(ui = ui, server = server)`\n\n如上述代码所示，我们使用了三个函数：`dashboardHeader()`、`dashboardSidebar()`\
  \ 和 `dashboardBody()`。它们为我们的仪表盘提供了良好的结构。这三个函数都作为 `dashboardPage()` 的前三个正式参数（共五个）位于该页面函数内部。最后两个形式参数包括\
  \ `title`（默认为 `NULL`）以及 `skin`（可取值为 `blue`、`black`、`purple`、`green`、`red` 或 `yellow`\
  \ 颜色）。正如你可以通过 `formals(dashboardPage)` 命令自行查看的那样，这个页面函数确实足够简单。`title` 参数控制浏览器本身的标题（或者在大多数流行浏览器中打开多个标签页时，控制浏览器标签页上的标题）。`skin`\
  \ 颜色选项控制仪表盘的整体配色方案。现在，前三个形式参数本身就是函数，并且可能变得相当复杂。尽管如此，我们将依次介绍这三个函数。\n\n## 仪表盘标题栏\n\
  \n`dashboardHeader()` 函数也接受一个 `title` 形式参数，用于将用户定义的文本添加到标题栏区域，以及一个控制该文本宽度的 `titleWidth`\
  \ 参数。标题栏还接受其他几个 Shiny 用户界面样式的函数，用于控制页面导航，以及一些更专业的函数，用于实现更具交互性的导航。在本章乃至本书中，我们基本上会忽略这些函数，以推广使用\
  \ `shiny` 和 `shinydashboard` 作为向数据消费者提供已熟悉的 R 代码的方式，而不是一次性学习太多新特性。事实上，我们为这个函数提到的最后一个形式参数是\
  \ `disable`，它默认为 `FALSE`，当设为 `TRUE` 时则完全隐藏标题栏。在我们的示例应用中，我们将保持标题栏基本处于初始状态。\n\n##\
  \ 仪表盘侧边栏\n\n接下来看 `dashboardSidebar()` 函数，显式列出的形式参数再次包含一个 `disable` 选项和一个 `width`\
  \ 参数。然而，除了这些显式列出的参数外，还可以使用更多函数。首先需要知道的是，来自 `shiny` 的任何用户界面函数都可以在侧边栏中使用。因此，如果在你的菜单中放置一个滑块条或下拉输入函数是合理的，那也是可行的。不过，有一些仪表盘库特有的函数适合放置在侧边栏区域内。\n\
  \n其中第一个是 `sidebarMenu()` 函数。与 `dashboardSidebar()` 本身非常相似，这个函数主要接收其他输入，并以高效的方式处理它们的组织。特别需要注意的是\
  \ `menuItem()` 函数，它是在 `sidebarMenu()` 内部调用的。在此示例应用中，我们将前一章创建的每个应用程序都放在各自的 `menuItem()`\
  \ 调用中。如下面的代码所示，这个函数有几个形式参数：\n\n```\nformals(menuItem)\n$text\n$...\n$icon\nNULL\n\
  $badgeLabel\nNULL\n$badgeColor\n[1] \"green\"\n$tabName\nNULL\n$href\nNULL\n$newtab\n\
  [1] TRUE\n$selected\nNULL\n```\n\n在上述函数和形式参数中，`text` 接受一个带引号的文本字符串，用于提供该菜单项的文本信息或链接名称。`icon`\
  \ 形式参数需要提供一个 `Font-Awesome` 图标的名称。我们在本章的参考资料部分提供了一个在线库的链接，该链接展示了所有可选的图标。我们也可以切换到其他图标库；我们把这个探索留给你自己。`badgelabel`\
  \ 调用会在侧边栏的最右侧放置一个内联徽章，用于容纳一小段文本。徽章能很好地吸引观众对特定菜单项及其底层应用的注意。这些形式参数中的许多都是可选的；然而，必须有一个与仪表盘主体中的\
  \ `tabItem()` 相关联的 `tabName`，或者必须向 `href` 命令提供一个 `URL`。如果提供的是 `URL` 而不是 `tabName`，那么当你希望查看者访问该页面时离开你的站点时，可以将\
  \ `newtab` 从默认的 `TRUE` 更改为 `FALSE`。最后，可以通过将 `selected` 设置为 `TRUE`，将默认选中项强制指定为某个特定的标签页，而不是第一个\
  \ `menuItem()`。\n\n在我们把注意力转向仪表盘主体时，我们提醒您，侧边栏也可以接收任何 Shiny 函数——例如 `img()` 函数，它指向一个必须存放在仪表盘应用文件夹内名为\
  \ `www` 的文件夹中的图像。我们在图 [14-2] 中展示了我们示例应用的菜单代码片段（尚未运行）以及结果。前三个菜单项的名称应该在前一章中见过。\n\n\
  ![A393929_1_En_14_Fig2_HTML.jpg](img/A393929_1_En_14_Fig2_HTML.jpg)\n\n图 14-2。一些\
  \ `sidebarMenu()` 和 `menuItem()` 函数的结果\n\n```\nsidebarMenu(\nmenuItem(\"饼图！\", tabName\
  \ = \"PieChart_Time\", icon = icon(\"pie-chart\")),\nmenuItem(\"使用滑块\", tabName\
  \ = \"slider_time\", icon = icon(\"sliders\"), badgeLabel = \"New\"),\nmenuItem(\"\
  上传直方图文件\", tabName = \"Upload_hist\", icon = icon(\"bar-chart\")),\nmenuItem(\"\
  劳动数据日期\", tabName = \"labour\", icon = icon(\"cloud-download\"), badgeLabel = \"\
  Live\")\n)\n```\n\n## 仪表盘主体\n\n如上述代码所示，每个菜单项都有一个 `tabName`。我们现在将讨论 `dashboardBody()`\
  \ 函数内部用于捕获该 `tabName` 的代码。请先看一下下面代码和图 [14-3] 中的这个小型（但不是最小）的 Shiny 仪表盘，然后我们将逐步讲解新增的代码行。\n\
  \n![A393929_1_En_14_Fig3_HTML.jpg](img/A393929_1_En_14_Fig3_HTML.jpg)\n\n图 14-3。一个侧边栏包含\
  \ `menuItem()`，主体部分包含 `tabItem()` 的仪表盘。注意匹配的 `First`。\n\n```\nlibrary(shiny)\nlibrary(shinydashboard)\n\
  \n### 定义用户界面\nui <- dashboardPage(\ndashboardHeader(),\ndashboardSidebar(sidebarMenu(menuItem(\"\
  演示\", tabName = \"First\"))),\ndashboardBody(tabItems(tabItem(tabName = \"First\"\
  , \"test\"))),\nskin = \"yellow\")\n\n### 定义服务器\nserver <- shinyServer(function(input,\
  \ output) {})\n```\n\n\n\n### 运行应用程序\n`shinyApp(ui = ui, server = server)`\n\n在仪表盘的主体部分，我们可以放置许多内容。然而，如果我们想使用之前在侧边栏部分编写好的选项卡，我们需要调用\
  \ `tabItems()` 函数。该函数不接受除单个 `tabItem()` 函数调用之外的任何参数；每个 `tabItem()` 都需要有一个唯一的 `tabName`，且该名称必须与\
  \ `sidebarMenu()` 中的某个唯一 `tabName` 相匹配。\n\n每个 `tabItem()` 内部应该放些什么呢？与 Shiny 类似，将布局设置得足够灵活，以便仪表盘能够适应不同尺寸的浏览器窗口是很有好处的。因此，常用的\
  \ `fluidRow()` 函数再次出现。回想一下，`fluidRow()` 设置的行宽最多为 12。记住这一点，请密切关注我们将要讨论的三种盒对象（用于填充这些行）的默认宽度。当然，可用的对象不止这三种；同样，我们的目标是让你能够快速上手，以便通过云端将数据提供给用户或利益相关者。\n\
  \n行中最基本的输入元素是 `box()`。在这个函数内部，我们可以放置前一章中使用过的任何应用程序代码，无论是用于向用户请求输入，还是用于输出响应式内容。不过，`box()`\
  \ 还接受九个特定的参数。自然，每个 `box()` 都可以设置一个 `title` 值，这是一个用户定义的文本字符串，应简洁地描述盒子的内容或所需操作。盒子底部有一个\
  \ `footer`，也可以接受一个文本字符串。盒子还可以设置一个 `status`，其值可以是 `primary`、`success`、`info`、`warning`\
  \ 或 `danger`。每个状态值都有对应的颜色，这些颜色是默认层叠样式表结构的一部分，使得 `shinydashboard` 看起来相当美观。颜色相当一致，不过根据您为整个仪表盘选择的颜色，可能会有一些差异。`solidHeader`\
  \ 的默认值是 `FALSE`，当然，也可以改为 `TRUE`。选择 `TRUE` 只会将状态的颜色增强为 `title` 文本的一个窄横幅背景。如果你希望盒子的主要区域具有特定的颜色，可以从大约\
  \ 15 种有效的颜色中选择来设置 `background`。顾名思义，所有输入代码和输出代码都位于该 `background` 之上。盒子的默认 `width`\
  \ 是 `6`，因此，除非你特意缩小宽度，否则两个盒子将占满一行。如果未能记住 `fluidRow()` 的总宽度为 `12`，则可能导致布局混乱。盒子的 `height`\
  \ 也可以设置为固定高度。如果你需要行与行之间非常整齐，这会很有帮助。最后，盒子是 `collapsible`（可折叠）的，并且可以默认是 `collapsed`（已折叠）的，尽管这两个选项的默认值都是\
  \ `FALSE`。图 14-4 展示了这些不同设置的一些结果。\n\n![A393929_1_En_14_Fig4_HTML.jpg](img/A393929_1_En_14_Fig4_HTML.jpg)\n\
  \n**图 14-4.** 一个熟悉的应用程序，显示在两个具有各种选项的盒子中——详情请参阅完整示例代码\n\n另一种类型的盒子是 `valueBox()`，它接受六个形式参数。第一个是\
  \ `value`，通常是一个较短的文本字符串或数值，如图 14-5 所示。`valueBox()` 还接受一个 `subtitle` 参数，同样是一个文本字符串。你可以选择一个\
  \ `icon`，尽管默认值是 `NULL`。这些盒子默认 `color` 为 `aqua`，并且相当短，默认 `width` 仅为 `4`。最后，`valueBox()`\
  \ 还接受一个 `href` 值，默认值为 `NULL`。我们在示例代码的 value box 中使用的代码展示如下：\n\n![A393929_1_En_14_Fig5_HTML.jpg](img/A393929_1_En_14_Fig5_HTML.jpg)\n\
  \n**图 14-5.** 示例 `valueBox()` 显示从网站实时获取的数据的天数\n\n```\nvalueBox(endYear-startYear,\
  \ \"Days of Data\", icon = icon(\"calendar\"))\n```\n\n我们用一个与 `valueBox()` 相似的盒子——`infoBox()`——来结束对\
  \ `dashboardBody()` 中盒子的讨论。这个盒子有一个接受文本字符串的 `title`，一个用于突出显示并展示在盒子中的 `value`，可选的`subtitle`\
  \ 文本，以及一个默认的条形图 `icon`。它还默认 `color` 为 `aqua`、`width` 为 `4`、`href` 为 `NULL`。不同之处在于，`icon`\
  \ 更小，并且有一个通常为 `FALSE` 的 `fill` 选项，可以改变背景颜色的显示方式。我们没有展示这个盒子，但它看起来与图 14-5 中的小盒子非常相似。根据我们的经验，这些盒子除了外观之外，并没有显著的区别。\n\
  \n## 云端仪表盘\n\n我们确实希望将这个仪表盘部署到我们的云实例上，这是一套稍微复杂一些的代码。同样，我们使用 RStudio 在标准 Shiny 文件夹中创建了它，因此它位于自己的文件中。在\
  \ Windows 上，文件结构如图 14-6 所示。我们的 `shinydashboard_cloud` 文件夹中有三个文件。请注意，`www` 文件夹存放了我们的示例图片，接着是\
  \ `app.R` 文件，其中包含了我们整个 Shiny 应用程序以及我们的 CSV 文件。\n\n![A393929_1_En_14_Fig6_HTML.jpg](img/A393929_1_En_14_Fig6_HTML.jpg)\n\
  \n**图 14-6.** `shinydashboard_cloud` 的文件结构\n\n我们使用 `WinSCP` 将文件和文件夹上传到我们的 Ubuntu\
  \ 云实例，如图 14-7 所示。\n\n![A393929_1_En_14_Fig7_HTML.jpg](img/A393929_1_En_14_Fig7_HTML.jpg)\n\
  \n**图 14-7.** `WinSCP` 上传文件夹视图\n\n登录到 `PuTTY` 后，我们还有一些工作要做。我们的示例使用了一些新库，当然，文件需要从我们的用户文件夹移动到\
  \ Shiny 服务器期望的位置。为简洁起见，我们只安装云实例上尚未安装的包。\n\n第一个新包是 `XML`（Lang, D. 等人, 2016），该包提供了从\
  \ Web 实时读取 HTML 表格的能力。各种政府和非营利机构将数据存储在这种表格中，以便公众轻松访问。我们还安装了 `zoo` 包（Zeileis 和 Grothendieck,\
  \ 2005），该包为时间序列提供了便利的函数。已经熟悉的包是 `ggplot2`（Wickham, 2009）和 `data.table`（Dowle, Srinivasan,\
  \ Short 和 Lianoglou, 2015），它们分别用于图形绘制和提供更高级的数据框结构。\n\n以下命令在我们的实例上一次运行一个，为所有用户安装五个新库，然后复制文件，以便可以通过浏览器访问。我们还在\
  \ Ubuntu 上安装了一些软件，这些软件是运行 `XML` 包所必需的。为了清晰易读，我们将以下一些命令组合在一起。它们应该在 `PuTTY` 中逐行运行，每个命令运行后屏幕上都会打印一些文本。\n\
  \n```\nsudo su - -c \"R -e \\\"install.packages('shinydashboard', repos='https://cran.rstudio.com/')\\\
  \"\"\nsudo apt-get install libcurl4-openssl-dev libxml2-dev\nsudo su - -c \"R -e\
  \ \\\"install.packages('XML', repos='https://cran.rstudio.com/')\\\"\"\nsudo su\
  \ - -c \"R -e \\\"install.packages('zoo', repos='https://cran.rstudio.com/')\\\"\
  \"\nsudo su - -c \"R -e \\\"install.packages('data.table', repos='https://cran.rstudio.com/')\\\
  \"\"\nsudo su - -c \"R -e \\\"install.packages('ggplot2', repos='https://cran.rstudio.com/')\\\
  \"\"\nsudo cp -R ~/shinydashboard_cloud /srv/shiny-server/\n```\n\n至此，我们完成了 Shiny\
  \ 和 Shiny 仪表盘的工作。您的仪表盘应该已在 `http://Your.Instance.IP.Address:3838/shinydashboard_cloud/`\
  \ 上线，并可通过您的浏览器查看。在结束本章之前，我们还有一些补充说明。\n\n\n\n首先，我们强烈建议您访问 Apress 网站中本教材对应的页面，并下载本章的代码包。其中包含图\
  \ 14-6 所示且已上传至图 14-7 的完整且可用的工作文件和文件夹。无需手动输入所有这些代码，即可判断数据看板是否符合您的需求。\n\n其次，本章中我们并未完全给出示例代码。我们将完整代码保留至末尾，以便将其整合为一个连贯的整体，并让您专注于该示例代码中需要关注的具体结构。\n\
  \n第三，我们提醒您，如果您已遵循我们关于 AWS 服务器入站策略设置的安全建议，则可能需要更改这些设置，以允许除您之外的更多人查看最终的数据看板项目。请记住，您需要在入站侧更改的设置是允许从\
  \ `0.0.0.0/0`（即整个互联网）访问端口 `3838`。请注意，这意味着整个互联网都能访问您的数据看板。如果您有敏感数据，或甚至只是无需公开的信息，请考虑与\
  \ IT 专业人员或至少是 IT 高级用户合作。\n\n最后，我们希望您和我们一样享受本章内容及其成果。请务必查看“参考文献”部分中的链接。您将找到有价值的信息，包括其他函数、一整套图标列表、另一个完整的图标库，以及最新的\
  \ `shiny` 和 `shinydashboard` 包信息。这些包更新相当频繁，新功能通常能带来令人惊叹的效果。\n\n## 完整示例代码\n\n```\n\
  library(shiny)\nlibrary(shinydashboard)\nlibrary(XML)\nlibrary(zoo)\nlibrary(data.table)\n\
  library(ggplot2)\n#此代码将在每次会话实例化时运行一次——同一会话中可能有多个查看者。\nslider_data=xlow]\nyValue\
  \ =4){  blsSub[,(yValue):=rollmean(get(yValue), k=3, na.pad = TRUE)] }\nggplot(data\
  \ = blsSub, mapping = aes_string(\"Date\", yValue)) +\ngeom_line()+\nxlab(\"Years\
  \ & Months\")+\nylab(\"People\")+\nxlim(xlow, xhigh)+\nggtitle(yValue)+\nscale_x_date(date_labels\
  \ = \"%b %y\")\n}) })\n\n### Run the application\nshinyApp(ui = ui, server = server)\n\
  ```\n\n## 参考文献\n\n*   [`https://rstudio.github.io/shinydashboard/`](https://rstudio.github.io/shinydashboard/)\n\
