- "# 15. 动态报告与云端\n\n在前面的章节中，您了解了`Shiny`如何基于动态数据提供交互式环境。动态报告和实时仪表板有许多相似之处。另一方面，由于报告最终会生成为\
  \ PDF，本章的交互性较低。报告是许多领域的常态，相关方通常需要的是时间点的快照，而非完全交互式的环境。通过`knitr`和`rmarkdown`包，我们可以基于数据输入创建文档（例如\
  \ PDF、HTML 或 Microsoft Word）。对于基于持续变化的数据但整体结构相同的定期报告来说，这是一个巨大的时间节省工具。\n\n`rmarkdown`包（Xie,\
  \ 2015）增加了将 R 流程嵌入此类文档的功能，允许一键分析，并使用多种样式进行精美的格式化。LaTeX 接口几乎可以实现任何所需的格式，尽管除了 PDF\
  \ 还有其他选项。从基于从学生信息系统数据库实时拉取数据的招生董事会报告，到基于关键绩效指标绘制的战略计划行动表，当变量输入需要形成标准化输出时，动态报告效果最好。`knitr`和`formatR`包（Xie,\
  \ 2015）也促进了这一点。\n\n此外，在本章中，我们使用了`evaluate`包（Wickham, 2016）和`tufte`包（Xie, 2016）。这些包使我们能够更优雅地组织数据的布局和格式。我们还使用`ltm`包（Rizopoulos,\
  \ 2006）进行心理测量测试。\n\n本章的目标是增强我们本地和云端机器的软件环境，以便编译动态文档，探索独立`rmarkdown`的结构，开发一个允许用户上传数据然后下载\
  \ PDF 报告的 Shiny 页面，最后将所有内容推送到我们的云端实例。我们从所需软件开始。\n\n## 所需软件\n\n我们已经拥有了所需的大部分软件，即\
  \ R、Shiny 包（Chang, Cheng, Allaire, Xie, and McPherson, 2016）、PuTTY 以及我们在 Ubuntu\
  \ 上的云实例。我们需要安装一些新的包——无论是在本地机器还是云端服务器上。\n\n## 本地机器\n\n首先，在您的 R 控制台中，重要的是运行以下代码，不依赖任何\
  \ R 文件：\n\n```\ninstall.packages(\"rmarkdown\")\ninstall.packages(\"tufte\")\ninstall.packages(\"\
  knitr\")\ninstall.packages(\"evaluate\")\ninstall.packages(\"ltm\")\ninstall.packages(\"\
  formatR\")\n```\n\n\n\n安装完这些包之后，我们将注意力转向安装 `MiKTeX` (Schenk, 2009)，它能够创建 PDF 文件。只需快速访问\
  \ `MiKTeX` 网站 (`http://miktex.org/download`)，你就可以获取推荐的 basic 安装程序（32 位）或其他 basic\
  \ 安装程序（64 位）。我们在系统上使用 64 位版本，尽管在本章中，不同版本之间可能不会有太大差异。下载完成后，在安装过程中接受所有默认设置。安装完成后，`MiKTeX`\
  \ 包可能会有更新。要执行这些更新，请前往你的开始文件。在名为 `MiKTeX` 的文件夹中，你会在末尾附近找到 `Update` 选项。按照默认选项操作，然后选择所有包以更新到最新版本。虽然不是必须的，但我们建议在此次安装后重启计算机。\n\
  \n### 云实例\n\n使用 `PuTTY` 访问你的云实例控制台。我们需要在控制台逐行运行以下代码。回想一下前面的章节，这些代码是为该服务器的所有用户（而不仅仅是你的用户）安装这些包。这是允许\
