  *   [`http://docs.rstudio.com/shiny-server/`](http://docs.rstudio.com/shiny-server/)\n\
  *   [`http://shiny.rstudio.com/gallery/`](http://shiny.rstudio.com/gallery/)\n*\
  \   [`https://cran.r-project.org/web/packages/shiny/shiny.pdf`](https://cran.r-project.org/web/packages/shiny/shiny.pdf)\n\
  \n# 15. 动态报告与云端\n\n在前面的章节中，您已经看到 Shiny 如何基于动态数据提供交互式环境。动态报告与实时数据看板有许多相似之处。另一方面，本章由于报告最终生成的是\
  \ PDF 文件，因此交互性较弱。报告在许多领域都是客观存在的事实，利益相关者往往需要时间节点快照，而非完全交互式的环境。通过 `knitr` 和 `rmarkdown`\
  \ 包，我们能够基于数据输入创建文档（例如 PDF、HTML 或 Microsoft Word）。对于基于持续变化的数据构建、但整体结构相同的常规报告而言，这能极大地节省时间。\n\
  \n`rmarkdown` 包（Xie, 2015）增加了将 R 处理过程嵌入此类文档的功能，从而支持一键式分析，并使用多种样式进行精美排版。LaTeX 界面几乎可以实现任何所需的格式化，不过除了\
  \ PDF 之外还有其他选择。从基于学生信息系统数据库实时拉取数据的招生管理董事会报告，到根据关键绩效指标绘制的战略计划行动表，当可变输入需要塑造成标准化输出时，动态报告能发挥最佳效果。这一过程也通过\
  \ `knitr` 和 `formatR` 包（Xie, 2015）得到了简化。\n\n此外，在本章中，我们还将使用 `evaluate` 包（Wickham,\
  \ 2016）和 `tufte` 包（Xie, 2016）。这些包使我们能够更优雅地组织数据的布局和格式。我们还会使用 `ltm` 包（Rizopoulos,\
  \ 2006）进行心理测量测试。\n\n本章的目标是：增强本地和云端机器上的软件环境，以便动态文档能够成功编译；探索独立 `rmarkdown` 的结构；开发一个允许用户上传数据并随后下载\
  \ PDF 报告的 Shiny 页面；最后将所有内容推送至我们的云端实例。我们从所需软件开始。\n\n## 所需软件\n\n我们已经拥有了大部分所需软件，即 R、Shiny\
  \ 包（Chang, Cheng, Allaire, Xie, and McPherson, 2016）、PuTTY 以及运行 Ubuntu 的云端实例。我们还需要安装一些新包——既要在本地机器上安装，也要在云服务器上安装。\n\
  \n### 本地机器\n\n首先，在 R 控制台中，务必独立于任何 R 文件运行以下代码：\n\n```\ninstall.packages(\"rmarkdown\"\
  )\ninstall.packages(\"tufte\")\ninstall.packages(\"knitr\")\ninstall.packages(\"\
  evaluate\")\ninstall.packages(\"ltm\")\ninstall.packages(\"formatR\")\n```\n\n\n\
  \n安装好这些包之后，我们将注意力转向安装 `MiKTeX`（Schenk, 2009），它用于创建 PDF 文件。简单访问 `MiKTeX` 网站（[`http://miktex.org/download`](http://miktex.org/download)）即可获取推荐的基础安装程序（32\
  \ 位）或其他基础安装程序（64 位）。我们为系统使用 64 位版本，尽管在本章中，各版本之间可能没有太大差异。下载后，在安装过程中接受所有默认设置。安装后，`MiKTeX`\
  \ 包可能有更新。要执行这些更新，请进入开始菜单。在名为 `MiKTeX` 的文件夹中，你会找到靠近末尾的 `更新` 选项。按照默认选项操作，然后选择所有包更新到最新版本。虽然这不是必须的，但我们建议在安装后重启一次。\n\
  \n### 云实例\n\n使用 `PuTTY` 访问你的云实例控制台。我们需要在控制台上逐行运行以下代码。回想一下前面的章节，这些代码是为该服务器的所有用户安装包的，而不仅仅是针对你的用户。这对于让\
  \ Shiny 服务器能够访问正确的包至关重要。\n\n```\nsudo su - -c \"R -e \\\"install.packages('rmarkdown',\
  \ repos = 'http://cran.rstudio.com/')\\\"\"\nsudo su - -c \"R -e \\\"install.packages('tufte',\
  \ repos = 'http://cran.rstudio.com/')\\\"\"\nsudo su - -c \"R -e \\\"install.packages('knitr',\
  \ repos = 'http://cran.rstudio.com/')\\\"\"\nsudo su - -c \"R -e \\\"install.packages('ltm',\
  \ repos = 'http://cran.rstudio.com/')\\\"\"\nsudo su - -c \"R -e \\\"install.packages('formatR',\
  \ repos = 'http://cran.rstudio.com/')\\\"\"\nsudo su - -c \"R -e \\\"install.packages('data.table',\
  \ repos = 'http://cran.rstudio.com/')\\\"\"\n```\n\n上述代码不需要很长时间。但是，安装 `texlive`（Ubuntu\
  \ 上用于替代 `MiKTeX` 的 LaTeX 解决方案）可能需要一些时间。它还需要相当大的磁盘空间，所以请确保你有足够的空间。在我们的试验中，需要完整版本。\n\
  \n```\nsudo apt-get install texlive-full\n```\n\n在此之后，我们建议执行 `sudo reboot` 来重启云实例。这是一个执行重启的好时机，然后关闭\
  \ `PuTTY` 一会儿。在你的服务器重启期间，你可以使用本地机器来探索动态文档。\n\n## 动态文档\n\n动态文档并不需要以任何方式链接到互联网。事实上，大多数报告可能是内部使用的。在\
  \ RStudio 内部，选择 文件 ➤ 新建文件 ➤ R Markdown 会打开一个向导。请注意，这里有文档（例如 HTML、PDF 或 Word）以及演示文稿（例如\
  \ HTML 或 PDF）的选项。通常需要提供一个标题，以及列出作者。当然，并非必须使用 RStudio；在 R 中创建一个带有 `.Rmd` 后缀的新文件即可。\n\
  \n我们打算采用一种混合方式来介绍动态文档。也就是说，我们首先给出一个直观且信息丰富的示例，展示此类代码的样子，然后对代码的每一部分进行更深入的分析。我们从一个名为\
  \ `ch15_html.Rmd` 的新文件开始，并用以下代码填充它：\n\n```\n---\ntitle: \"ch15_html\"\nauthor: \"\
  Matt & Joshua Wiley\"\ndate: \"18 September 2016\"\noutput: html_document\n---\n\
  ```{r echo=FALSE}\n##注意 'echo=FALSE'\n##这意味着以下代码永远不会出现在我们编织后的 html 文件中\nlibrary(data.table)\n\
  diris <- as.data.table(iris)\n##但它仍然会运行，所以我们可以访问这些数据。\n```\n#这是一级标题；它不是注释。\n这是纯文本，不是代码。\n\
  如果我们想要*斜体*或**粗体**，我们可以轻松地在这些文档中添加。当然，我们可能需要提到 `rmarkdown` 是所使用的包，内联代码很适合做这件事。\n\
  如果需要数学公式，也许 x~1~²^ + x~2~²^ = 1 是想要的。\n##用二级标题调用数学公式\n另一方面，我们可能需要显式地调用数学公式，在这种情况下，$x^{2}\
  \ + y^{2}= \\pi$ 是实现这一目的的方法。\n###我喜欢删除线；我对三级标题不太确定。\n在撰写报告时，我经常想说某件事是 ~~绝对愚蠢的~~\
  \ 对关键利益相关者明显相关的。\n######如果你曾经写过需要六级标题的内容\n那么我相信，正如这个无序列表所建议的：\n* 你需要从现在开始拥抱更少的秩序\n\
  - 你有没有考虑过其他职业？\n```{r echo=FALSE}\nsummary(diris)\n```\n然而，请注意，你可以同时包含代码和控制台输出：\n\
  ```{r}\nhist(diris$Sepal.Length)\n```\n```\n\n编织上述代码的结果如图 15-1 所示。\n\n![A393929_1_En_15_Fig1_HTML.jpg](img/A393929_1_En_15_Fig1_HTML.jpg)\n\
  \n图 15-1.\n\n一个简单动态文档的 HTML 输出\n\n正如你所想象的，正是摘要数据或图形可以根据任何输入轻松地重新生成。事实上，其中一位作者使用动态文档为入门统计学课程的学生创建案例研究（以及案例研究答案）。使用不同的种子生成伪随机数据非常容易，这样每个学生都可以拥有独特的数据集（以及多个主题）。这也便于快速生成供批改的解答。\n\
  \n现在你已经对 `Rmarkdown` 有了一个概览，让我们按照合理的模块来探索前面的代码。第一个模块是 YAML，它代表 Yet Another Markup\
  \ Language 或者可能是递归定义的 `YAML Ain’t Markup Language`（YAML, 2016）头部。在最简单的情况下，它可能只包含标题、作者、日期和输出类型的信息。这里，对于本文档，我们选择了\
  \ `html_document`。然而，如前所述，还有更多选项，例如 `pdf_document`、`word_document`、`odt_document`、`rtf_document`\
  \ 和 `beamer_presentation`（仅举几例——实际上还有更多）。这些类型分别创建 HTML 页面、PDF、Microsoft Word 文件、OpenDocument\
  \ 或富文本文档，以及 Beamer PDF 幻灯片。Beamer 和 PDF 都需要我们之前安装的 `MiKTeX`。要更改编译的文档类型，只需更改输出！值得注意的是，第一次使用\
  \ `MiKTeX` 时，编译可能需要更长时间，因为可能需要在后台安装一个或两个包。这不需要任何用户干预，只是需要时间。同样值得注意的是，如果你使用 `beamer_presentation`，则需要考虑一张幻灯片上能容纳什么内容，不能容纳什么内容。在这种情况下，回车后紧跟\
  \ `----`，然后再跟一个回车，表示幻灯片组中的新幻灯片。\n\n```\n---\ntitle: \"ch15_html\"\nauthor: \"Matt\
  \ & Joshua Wiley\"\ndate: \"18 September 2016\"\noutput: html_document\n---\n```\n\
  \n头部可以比这更复杂。R 代码可以使用 `` `r 代码` `` 格式内联注入。因此，我们可以通过在我们的代码中将 `date: \"18 September\
  \ 2016\"` 替换为 `date: \"`r Sys.Date()`\"` 来使日期更具动态性。有数十种渲染选项可以与 YAML 头部配合使用，而且比我们更聪明的人已经创建了使用这些头部变体以及设置几个不错选项的模板。如同在\
  \ Shiny 中一样，几乎有无限的能力来精确自定义文档的呈现和显示方式。\n\n\n\n我们 markdown 代码的下一个区域是一个代码块。代码块以 ` ```{r\
  \ }``` 开始，以 ` `````` 结束。这两者之间是你的代码。现在，在 `{r }` 内部，有几个有用的选项。如果你的部分代码计算量很大且基本是静态的，你可能希望设置\
  \ `cache = TRUE` 而不是默认的 `FALSE`。这会存储结果。我们经常使用 `echo=FALSE`，它会阻止代码本身显示，但不会阻止代码的结果显示。请注意，在接下来的第一个代码块中，我们的最终文档中没有代码运行的迹象。然而，第二个代码块仍然显示了\
  \ `summary(diris)` 的结果。\n\n```\n```{r echo=FALSE}\nlibrary(data.table)\ndiris <-\
  \ as.data.table(iris)\n```\n```{r echo=FALSE}\nsummary(diris)\n```\n```\n\n对于涉及绘图或图形的代码块，也有很多选项。`fig.align`\
  \ 选项可以设置为 `right`、`centre` 或 `left`。对于绘图，可以使用 `fig.height` 或 `fig.width` 设置高度和宽度，其默认单位是英寸。\n\
  \n```\n```{r fig.align=\"right\"}\nhist(diris$Sepal.Length)\n```\n```\n\n最后，是文本本身，我们在此不再重复，因为它的趣味性较低。我们注意到，代码既可以写在行内，也可以像在标题中一样书写。稍后，当我们希望根据计算结果提供不同的叙述性文本时，您会发现这个选项非常有用。\n\
  \n## 动态文档与 Shiny\n\n现在，我们将注意力转向不仅提供一个动态文档，而且提供一个让他人可以通过动态输入进行控制的文档。我们构建的是一个简单的 Shiny\
  \ 环境，允许用户上传一个包含学生测验成绩数据的 CSV 文件。数据的编码方式如下：列代表测验中的特定问题；行代表单个学生；测验是多项选择题，正确回答编码为 1，错误回答编码为\
  \ 0。\n\n与前一节一样，我们查看实现此功能所需的三个文件中每个文件的所有代码。然后，我们逐行分解这些代码。对于已经熟悉 Shiny 的读者，请随意跳到最后一部分。我们将此代码构建在一个名为\
  \ `Chapter15` 的文件夹中。稍后，当上传到我们的 Ubuntu 服务器时，我们会上传整个文件夹。\n\n### server.R\n\n在 Shiny\
  \ 服务器端，我们调用库，然后构建上传 CSV 文件所需的系统，为用户提供文件已上传的确认，将该文件读入 R，将所需的信息传递给我们的标记文档，最后允许用户将该文档下载为\
  \ PDF。只需以下 55 行代码：\n\n```\n##Dynamic Reports and the Cloud\nlibrary(shiny)\nlibrary(ltm)\n\
  library(data.table)\nlibrary(rmarkdown)\nlibrary(tufte)\nlibrary(formatR)\nlibrary(knitr)\n\
  library(evaluate)\nfunction(input, output) {\noutput$contents <- renderTable({\n\
  inFile <- input$file1\nif (is.null(inFile))\nreturn(NULL)\nread.csv(inFile$datapath,\
  \ header = input$header,\nsep = input$sep, quote = input$quote)\n})\nscores <- reactive({\n\
  inFile <- input$file1\nif (is.null(inFile))\nreturn(NULL)\nread.csv(inFile$datapath,\
  \ header = input$header,\nsep = input$sep, quote = input$quote)\n})\noutput$downloadReport\
  \ <- downloadHandler(\nfilename = function() {\npaste('quiz-report', sep = '.',\
  \ 'pdf')\n},\ncontent = function(file) {\nsrc <- normalizePath('report.Rmd')\nowd\
  \ <- setwd(tempdir())\non.exit(setwd(owd))\nfile.copy(src, 'report.Rmd', overwrite\
  \ = TRUE)\nknitr::opts_chunk$set(tidy = FALSE, cache.extra = packageVersion('tufte'))\n\
  options(htmltools.dir.version = FALSE)\nout <- render('report.Rmd')\nfile.rename(out,\
  \ file)\n}    )  }\n```\n\n前面的代码从调用所有库开始，然后迅速进入 Shiny 的 `function(input, output)\
  \ {}` 服务器端包装器。之后，只有三个主要的代码块。接下来，我们逐一查看这些代码块，从 `renderTable({})` 调用开始。这会生成用于用户界面的输出。具体来说，它创建了一个表格。它是一个交互式函数，当用户在用户端上传文件时，Shiny\
  \ 会通知此函数其某个输入已更改。这会触发代码的运行。从输入方面来看，`input$datapath` 是服务器上 Shiny 存储上传文件的位置。假设确实存在一个文件，`read.csv`\
  \ 可以访问该文件的数据路径，并获取关于数据是否有标题、使用了哪种分隔符以及用户设置的其他信息。实际上，可以向用户询问更多信息，以便进行更定制化的分析。在这里，我们保持示例简单而有效。此读取的结果创建了一个表格，并将该表格存储在名为\
  \ `contents` 的输出变量中。这带来的净效果是 Shiny 现在通知用户界面端可能有输出。我们将在本章后面看到该输出的去向。\n\n```\noutput$contents\
  \ <- renderTable({\ninFile <- input$file1\nif (is.null(inFile))\nreturn(NULL)\n\
  read.csv(inFile$datapath, header = input$header,\nsep = input$sep, quote = input$quote)\n\
  })\n```\n\n除了创建一个表格以便用户能立即看到文件上传是否成功（并且我们设想在实际场景中，可能还会向用户界面添加注释，以允许用户发现上传失败的情况）之外，我们还必须以一种允许我们的\
  \ markdown 文件使用这些数据的格式来读取数据。我们将数据读入一个名为 `scores` 的变量中。这是一个响应式函数，它始终警惕相关输入变量的变化（在本例中，是文件的上传）。\n\
  \n```\nscores <- reactive({\ninFile <- input$file1\nif (is.null(inFile))\nreturn(NULL)\n\
  read.csv(inFile$datapath, header = input$header,\nsep = input$sep, quote = input$quote)\n\
  })\n```\n\n\n\n### 服务器端实现\n\n服务器端最后一部分的实现最为高级，它负责控制用户可下载的文件。该代码块的第一部分控制用户下载的报告名称。我们将报告命名为\
  \ `quiz-report.pdf`，虽然看起来复杂，但这为我们未来更改报告类型或性质提供了灵活性——无论是修改文件类型还是名称都轻而易举。请注意，如果你使用\
  \ RStudio 的内部浏览器，下载的报告会使用不同名称。接下来，我们在 markdown 文件上调用 `normalizePath()` 函数，该函数返回当前工作目录的文件路径，并附加参数中的文件名。具体来说，它会根据代码所在的操作系统环境返回相应路径。这一点非常重要，原因有二：首先，它确保了代码在\
  \ Windows 到 Ubuntu（或任何操作系统）之间的可移植性；其次，我们即将更改工作目录，因此直接调用 `report.Rmd` 将不再有效。\n\n\
  更改工作目录至关重要，因为我们即将创建新的 PDF 文件。在拥有管理权限的本地机器上创建新文件毫无问题。然而，我们的目标是部署到云端，但无法确保所有服务器都授予我们此类权限。因此，我们将工作目录更改为服务器的临时目录。在\
  \ R 中，`setwd(tempdir())` 完成两项操作：它首先复制并返回当前工作目录，然后将目录更改为参数指定的目录。因此，`owd` 保存的是旧的工作目录。我们设置\
  \ `on.exit()` 参数，确保 `downloadHandler` 完成后工作目录恢复原状，从而避免 Shiny 网站崩溃。\n\n现在，我们将 markdown\
  \ 文件从旧工作目录的原始位置复制到临时区域，使其能够在临时目录中运行并生成 PDF。我们同时设置了 `knitr`（用于生成 markdown PDF）的环境选项，以便能够使用\
  \ `tufte` 格式（以爱德华·塔夫特命名，详见 [`rmarkdown.rstudio.com/tufte_handout_format.html`](http://rmarkdown.rstudio.com/tufte_handout_format.html)）。剩下的工作就是使用\
  \ `render()` 渲染 markdown 文档，并将文件重命名为我们想要的名称。\n\n```\noutput$downloadReport <- downloadHandler(\n\
  filename = function() {\npaste('quiz-report', sep = '.', 'pdf')\n},\ncontent = function(file)\
  \ {\nsrc <- normalizePath('report.Rmd')\nowd <- setwd(tempdir())\non.exit(setwd(owd))\n\
  file.copy(src, 'report.Rmd', overwrite = TRUE)\nknitr::opts_chunk$set(tidy = FALSE,\
  \ cache.extra = packageVersion('tufte'))\noptions(htmltools.dir.version = FALSE)\n\
  out <- render('report.Rmd')\nfile.rename(out, file)\n}    )\n```\n\n我们了解到，Shiny\
  \ 服务器端需要能够使用适当的输入信息（例如是否存在标题行）读取用户上传的文件，然后负责启动 `Rmarkdown` 流程。诚然，要让这个过程在任何计算机上正常工作，需要更改工作目录，并对布局和格式选项进行一些调整。本节结束时需要指出的是，虽然设置简单的\
  \ PDF 更容易（尽管我们承认更偏爱简洁的 `tufte` 布局），但我们将把注意力转向用户界面。\n\n### `ui.R`\n\n对于这个非常简单的 Shiny\
  \ 应用程序，用户界面相当简洁。仅用 40 行代码（实际上我们本可以删除几个选项），用户就能上传 CSV 文件、查看渲染后的数据表并下载文件分析结果。与之前一样，我们首先给出完整代码，然后逐一说明每个代码块：\n\
  \n```\n#动态报告与云用户界面\nshinyUI(\nfluidPage(\ntitle = '成绩控制面板',\nsidebarLayout(\nsidebarPanel(\n\
  helpText(\"上传一个宽格式的 CSV 文件，其中每个列包含 0 或 1，分别代表学生该题答错或答对。\"),\nfileInput('file1',\
  \ '选择要上传的文件',\naccept = c(\n'text/csv',\n'text/comma-separated-values',\n'text/tab-separated-values',\n\
  'text/plain',\n'.csv',\n'.tsv'\n)\n),\ntags$hr(),\ncheckboxInput('header', '标题行',\
  \ TRUE),\nradioButtons('sep', '分隔符',\nc(逗号=',',\n分号=';',\n制表符='\\t'),\n','),\nradioButtons('quote',\
  \ '引号',\nc(无='',\n'双引号'='\"',\n'单引号'=\"'\"),\n'\"'),\ntags$hr(),\nhelpText(\"此处显示帮助文本\"\
  ),\ndownloadButton('downloadReport')\n),\nmainPanel(\ntableOutput('contents')\n\
  ))))\n```\n\n与用户界面的惯例相同，我们使用了 `fluidPage()` 以及 `sidebarPanel()` 和 `mainPanel()`。主要交互发生在侧边栏内，因此我们首先关注这部分。`fileInput()`\
  \ 函数负责接收输入文件。我们可以控制接受的文件类型，这里限定为逗号分隔或制表符分隔的值。我们将上传控件命名为 `file1`，回想一下服务器端使用 `input$file1`\
  \ 来读取文件。\n\n```\nfileInput('file1', '选择要上传的文件',\naccept = c(\n'text/csv',\n'text/comma-separated-values',\n\
  'text/tab-separated-values',\n'text/plain',\n'.csv',\n'.tsv'\n)\n),\n```\n\n另一个我们主要关注的区域是下载部分，其理解起来并不复杂：\n\
  \n```\ndownloadButton('downloadReport')\n```\n\n尽管有辅助文本框向用户进行解释，并且我们确实建议在实际应用中设置示例布局，以便用户理解可接受的输入格式，但我们仍选择将用户界面尽可能地精简。在将注意力转向实际报告文件之前，我们在图\
  \ 15-2 中展示了上传 `scores.csv` 文件（该文件可在本书的 Apress 网站获取）后的 Shiny 应用程序。\n\n![A393929_1_En_15_Fig2_HTML.jpg](img/A393929_1_En_15_Fig2_HTML.jpg)\n\
  \n图 15-2. Shiny 用户界面，在本地托管网站上的实时显示\n\n### `report.Rmd`\n\n这份报告是关于学生在测验或其他测试中每道题的得分情况。我们的目标是将图\
  \ 15-2 所示的输入转换为可操作、总结性的信息，用于评估试题和测试的有效性。在阅读接下来的完整代码之前，请花点时间将这段代码与独立的 markdown 文件进行比较。两者没有重大差异。实际上，唯一能表明该文件是从\
  \ Shiny 应用程序渲染而来的，是 `scores <- scores()` 这一行代码。\n\n```\n---\ntitle: \"示例评分报告\"\n\
  subtitle: \"试题级分析\"\ndate: \"`r Sys.Date()`\"\noutput:\ntufte::tufte_handout: default\n\
  ---\n\n## 原始数据\n\n以下是上传数据的样本，包含前几行和后几行，以及前几列和后几列：\n\n```{r echo=FALSE, include =\
  \ FALSE}\nscores <- scores()\n```\n\n```{r, echo = FALSE}\nif (nrow(scores) > 6)\
  \ {\nrow.index <- c(1:3, (nrow(scores) - 2):nrow(scores))\n} else {\nrow.index <-\
  \ 1:nrow(scores)\n}\nif (ncol(scores) > 6) {\ncol.index <- c(1:3, (ncol(scores)\
  \ - 2):ncol(scores))\n} else {\ncol.index <- 1:ncol(scores)\n}\ncbind(scores[row.index,\
  \ col.index[1]], round(scores[row.index, col.index[2:length(col.index)]], 2))\n\
  ```\n\n## 试题分析\n\n以下是试题级统计量，取值范围为 0 到 1：`format(describe(scores), digits = 2)`。容易的试题均值较高（平均得分，因为试题按\
  \ 0/1 计分），而困难的试题均值较低（例如低于 0.7）。优质的试题具有较高的试题-总分相关（试题与总分之间的相关系数，`rit`）。最后，删除某道试题后的信度（`alpha.drop`）提供了从测试中移除该试题后测试的信度估计值。\n\
  \n```{r, echo = FALSE}\nitem.analysis <- function(x) {\ntotal <- rowSums(x)\nc(n\
  \ = nrow(x),\nmean = mean(x, na.rm = TRUE),\nsd = sd(x, na.rm = TRUE),\nrit = cor(x,\
  \ total, use = \"complete.obs\"),\nalpha.drop = alpha(x[, !names(x) %in% names(x)])$total$raw_alpha)\n\
  }\nround(t(sapply(scores, item.analysis)), 3)\n```\n\n## 测试分析\n\n### 信度与标准测量误差\n\
  \n整体信度为 `r ifelse(alpha.results$total$raw_alpha > 0.6, \"可接受的信度\", \"较低的信度\")`，alpha\
  \ 系数 = `r format(alpha.results$alpha, FALSE, 2, 2)`。^[Alpha 系数取值范围为 0 到 1，值为 1 表示测试完全可靠。]\n\
  \n下图展示了不同能力水平的测量误差。^[数值越高表示测量误差越大，表明测试在极低和极高能力水平（分数）下信度较低。]\n\n```{r, echo = FALSE,\
  \ fig.width = 5, fig.height = 4}\n### 标准测量误差可通过以下方式绘制\nvals <- plot(rasch.results,\
  \ type = \"IIC\", items = 0, plot = FALSE)\nplot(vals[, \"z\"], 1 / sqrt(vals[,\
  \ \"info\"]),\ntype = \"l\", lwd = 2, xlab = \"能力\", ylab = \"标准误差\",\nmain = \"\
  标准测量误差\")\n```\n\n\n\n## 项目分析\n\n各项目的分析结果如下表所示。^*`r`* 表示项目与总分的点二列相关系数。*Correct*\
  \ 表示某项目的正确回答百分比。项目按相关系数从高到低排序。*\n\n```{r, echo = FALSE, results = 'asis'}\nkable(biserial.results)\n\
  ```\n\n现在我们逐段剖析并解释此 Markdown 文件的每个代码块。这个标题比第一个稍微高级一些。注意，我们使用内联 R 代码将日期设置为当前日期。此外，我们的输出不再只是\
  \ `pdf_document`。相反，我们采用了默认的 `tufte_handout` 样式（这是一种包含样式信息的 PDF）。我们正式从其包中调用该样式（回想一下，`library(tufte)`\
  \ 已在服务器端被调用）。\n\n```\n---\ntitle: \"示例评分报告\"\nsubtitle: \"项目层面分析\"\ndate: \"`r Sys.Date()`\"\
  \noutput:\n  tufte::tufte_handout: default\n---\n```\n\n接下来是将我们的评分数据读入 Markdown\
  \ 文件。我们已经熟悉 `echo=FALSE`，它可以防止代码显示。然而，我们还设置了 `include=FALSE`，这可以防止任何代码输出显示。如前所述，我们使用了来自\
  \ Shiny 服务器端的变量 `scores()`，这是我们通过 `read.csv()` 读取评分数据的地方。回想一下，在 Shiny 服务器上，我们只是将该变量称为\
  \ `scores`。但是，在 `rmarkdown` 文件中，我们将其作为函数调用（毕竟它会动态更新）。与其继续将变量作为函数调用，我们在这里使用一个同名的本地环境变量\
  \ `scores` 对其进行重命名：\n\n```{r echo=FALSE, include = FALSE}\nscores <- scores()\n\
  scores <- as.data.table(scores)\nsetnames(scores, 1, \"Student\")\n```\n\n我们的下一个代码块设置了\
  \ `results='asis'`，以防止对我们的 `knitr` 表格（称为 `kable`）进行进一步处理。此外，这段代码会将前三行和最后两行及列输出到一个小的样例\
  \ `kable` 中。只有当行或列数超过六行或六列时，才会执行此操作。\n\n```{r, echo = FALSE, results = 'asis'}\n\
  if (nrow(scores) > 6) {\n  row.index <- c(1:3, (nrow(scores)-2):nrow(scores))\n\
  }\nif (ncol(scores) > 6) {\n  col.index <- c(1:3, (ncol(scores)-2):ncol(scores))\n\
  }\nkable(scores[row.index, col.index, with = FALSE])\n```\n\n从这里开始，我们可以使用 `ltm`\
  \ 包来计算测验或试题信度的若干指标。点二列相关系数至关重要；它使用了更为熟悉的皮尔逊相关系数，并针对测验题目存在二分数据这一情况进行了调整。它能够比较学生在某个特定题目上的表现与其在整个测验中的表现（因此我们将其与\
  \ `rowSums` 进行比较）。通过将这些数据从高到低排序，我们可以找出得分最低的测验题目。这些题目可能并未测量我们测验的主要主题（诚然，这是一个极大的简化——心理测量学是一门远超本文范畴的科学）。此外，我们还计算了克隆巴赫α系数和拉希模型，以供后续使用。再次说明，我们并不打算将这些结果直接包含在我们的动态文档中；但我们可以访问它们，以备后用。\n\
  \n```{r, include = FALSE}\nitems <- names(scores)[-1]\nscores[, SUM := rowSums(scores[,\
  \ items, with = FALSE])]\n### 现在计算点二列相关系数\n### 首先将数据融为长格式\nscores.long <- melt(scores,\
  \ id.vars = c(\"Student\", \"SUM\"))\n### 按项目计算点二列相关系数\n### 从高到低排序\nbiserial.results\
  \ <- scores.long[, .(\n  r = round(biserial.cor(SUM, value, level = 2), 3),\n  Correct\
  \ = round(mean(value) * 100, 1)\n), by = variable][order(r, decreasing = TRUE)]\n\
  alpha.results <- cronbach.alpha(scores[, !c(\"Student\", \"SUM\"), with=FALSE])\n\
  rasch.results <- rasch(scores[,!c(\"Student\", \"SUM\"), with=FALSE])\n```\n\n并非所有代码都必须放在正式的代码块内；代码也可以与文档正文内联。这样做很有帮助，因为我们可以设定临界分数（本例中为半随意设定的\
  \ `0.6`），并根据这些分数在最终报告中生成不同的文本。`tufte` 包允许使用 `^[]` 指定侧边栏注释。\n\n整个测验的α系数 = `r format(alpha.results$alpha,\
  \ FALSE, 2, 2)`，总体而言具有`r ifelse(alpha.results$alpha > .6, \"可接受的信度\", \"低信度\")`。^[α系数取值范围为\
  \ 0 到 1，1 表示测验具有完美的信度。] 该图显示了不同能力水平下的测量误差。^[值越大表示测量误差越大，表明测验在极低和极高能力水平（分数）下的信度较低。]\n\
  \n回想我们之前的讨论，图形大小可以在代码块中控制。在这里，我们绘制了拉希模型，可以看到高表现和低表现学生的测量精度较低：\n\n```{r, echo = FALSE,\
  \ fig.width = 5, fig.height = 4}\n### 可以按如下方式绘制测量标准误\nvals <- plot(rasch.results,\
  \ type = \"IIC\", items = 0, plot = FALSE)\nplot(vals[, \"z\"], 1 / sqrt(vals[,\
  \ \"info\"]),\n     type = \"l\", lwd = 2, xlab = \"能力\", ylab = \"标准误\",\n    \
  \ main = \"测量标准误\")\n```\n\n代码最后以另一个 `kable` 结尾，但我们已经见过它，无需赘述。我们在图 15-3 中展示的是下载的最终结果。请注意，所有被隐藏的代码都没有显示出来。同时，注意数据样例，因为我们从图\
  \ 15-2 中得知有超过六行或六列。最后，注意自动编号的侧边注释，它们提供了更多细节。这些是通过在文档文本区域中使用 `^[]` 代码构建的。这使得提供详细但不重要的见解变得非常容易。\n\
  \n![A393929_1_En_15_Fig3_HTML.jpg](img/A393929_1_En_15_Fig3_HTML.jpg)\n\n**图 15-3.**\
  \ 下载的 PDF 文件\n\n## 上传到云端\n\n我们的最后一个任务是将文件从本地机器上传到云端实例。请记住，在之前的章节中，我们不仅使用了 `PuTTY`\
  \ 在云服务器上安装 Shiny Server，还使用了 `WinSCP` 将文件上传到云服务器。我们启动 `WinSCP`，重新连接，并确保左侧本地方位于我们的\
  \ Shiny 应用文件夹，而右侧云服务器方位于 `/home/ubuntu` 目录。我们在图 15-4 中回顾了这一过程的结果。\n\n![A393929_1_En_15_Fig4_HTML.jpg](img/A393929_1_En_15_Fig4_HTML.jpg)\n\
  \n**图 15-4.**  WinSCP 已上传了 PieChart_Time、slider_time 和 Upload_hist 这三个 Shiny 应用\n\
  \n从这里开始，我们访问 `PuTTY` 并在命令行中运行以下代码：\n\n```\nsudo cp -R ~/Chapter15 /srv/shiny-server/\n\
  ```\n\n请记住，在之前的章节中，我们调整了实例以允许从特定地址访问特定端口。现在，您可以通过在任意浏览器中输入以下 URL 来验证您的应用是否正常工作：\n\
  \n```\nhttp://Your.Instance.IP.Address:3838/Chapter15/\n```\n\n## 总结\n\n在最后一章中，我们构建了一个可以根据新数据快速更新的动态文档。这种更新甚至可以扩展到图形和内联的\
  \ `ifelse` 语句，使得叙事结构本身也能根据新数据而改变。此外，我们还构建了一个 Shiny 应用，允许有互联网连接的用户上传文件，为这种报告提供新数据。此类报告可以下载为多种格式，不过我们选择了\
  \ PDF 格式。\n\n\n\n贯穿本文，我们提供了高级数据管理技术，包括连接各种数据库。这些技术与动态文档融合得很好，并能轻松将数据仓库中的信息转化为可操作的洞察。我们最后的观察是，随着数据变得越来越庞大，在任何领域中，成功筛选和呈现有用数据的能力正变得愈发关键。祝编程愉快！\n\
