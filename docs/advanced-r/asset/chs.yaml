- "# 编程基础\n\n与大多数语言一样，要掌握更高级的用法，需要深入研究其底层结构。本章将介绍这类编程基础，本书的第一部分（直到第 6 章）将讲解一些高级编程技术。我们从\
  \ R 的基本构建块开始，这将为我们进行编程、数据管理和云分析奠定基础。\n\n在深入研究 R 之前，最好先遵循一些通用原则。首先，动手实践是好的。通过实践学习比单纯阅读更有效。请下载本书附带的源文件，并尝试新事物！\n\
  \n其次，熟悉`?`函数会非常有帮助。只需在 R 控制台中键入`?`后紧跟文本，即可调出相应的帮助文档。我们稍后会详细介绍函数，但这一点太有用了，不能等到那时再讲。\n\
  \n最后，在深入探讨您购买本书的真正目的之前，有一个注意事项：这是一本应用型书籍。我们可能会跳过或忽略 R 的某些主题和领域。虽然我们作者希望这是因为经过了想法的仔细筛选，但也可能是因为我们的知识局限。很可能存在其他方法来执行这些任务，或者其他值得学习的好主题。我们的目标是让您尽快上手并掌握一些有用的技能。祝您好运！\n\
  \n## 高级 R 软件选择\n\n本书是为 R 语言的高级用户编写的。需要注意的是，在大多数示例中，我们像在《Beginning R: An Introduction\
  \ to Statistical Programming》(Apress, 2015)中一样，继续使用 RStudio (`www.rstudio.com/products/rstudio/download/`)。我们还假设您使用的是\
  \ Microsoft Windows (`www.microsoft.com`)操作系统，但在后面的章节中，我们将通过 Ubuntu (`www.ubuntu.com`)深入探讨在云端使用\
  \ R。不同的是底层的 R 发行版。\n\n我们将使用 Microsoft R Open (MRO)，它与当前版本的 R 完全兼容。这提供了幕后的性能增强。我们还使用\
  \ Intel Math Kernel Library (Intel MKL)，它可以从 MRO 的同一站点下载 (`https://mran.microsoft.com/download/`)。事实上，在本书付印时，这两个软件在最新版本中已合二为一。如果这种趋势持续下去，那就太好了。这些下载非常简单直接，我们预计已熟悉使用\
  \ R 和 RStudio 的读者会发现安装过程是无缝的。在 Windows（和基于 Linux 的操作系统）上，MKL 用优化的系统取代了默认的线性代数系统，并允许对线性代数操作（如许多统计算法中使用的矩阵乘法和分解）进行隐式并行处理。\n\
  \n如果尚未安装，您还需要安装 Java。本书使用了 64 位的 Java Version 8 Update 91。Java 可以在`www.oracle.com/technetwork/java/javase/`下载；具体来说，请获取\
  \ Java Development Kit (JDK)。\n\n虽然这些选择可能会带来一些细微的影响，但我们的目标是提供通用指导，使其无论环境细节如何都足够准确。尽管如此，一些包和预构建函数偶尔会有特别之处。我们将注意力转向确保您可以轻松复现我们的结果。\n\
  \n## 复现结果\n\nR 的一个有用特性是其丰富的包生态系统，这些包由全球专家编写。这也可能成为使用 R 的一个潜在弱点：从 R 本身的版本到特定包的版本，许多代码细节都处于不断变化之中。您的代码可能每天都会出现问题，更不用说我们在这本书出版前几个月编写的代码了。为了解决这个问题，我们使用\
  \ Revolution Analytics 的`checkpoint`包（Microsoft Corporation, 2016），它利用综合 R 存档网络(CRAN)中存储的服务器快照，将我们的代码“锁定”到特定的版本和日期。要了解其技术细节，请参阅本章末尾“参考文献”部分的链接。我们将从基础开始。\n\
  \n对于本书，我们使用了 R 版本 3.3.1 (Bug in Your Hair)以及 Windows 10 Professional x64。随着此版本从当前版本变为历史版本，CRAN\
  \ 会维护过去版本的存档。因此，`checkpoint`包可以轻松访问以前的 R 版本以及所有包。您需要在项目目录中第 1 章 R 文件的顶部添加以下代码：\n\
  \n```\n## uncomment to install the checkpoint package\n## install.packages(\"checkpoint\"\
  )\nlibrary(checkpoint)\ncheckpoint(\"2016-09-04\", R.version = \"3.3.1\")\nlibrary(data.table)\n\
  ```\n\n我们将所有`library`调用放在每章项目文件的开头，在调用`checkpoint`库之后。通过包含 2016 年 9 月 4 日这个日期，我们确保`checkpoint`安装并运行截至该截止日期所有包的最新版本。第一次运行时，在获得许可后，`checkpoint`会创建一个文件夹来存放所需包的版本。因此，只要您以正确的`library`调用开始每一章的代码文件，您使用的就是我们使用的相同版本的包。\n\
  \n\n\n## 对象类型\n\n首先，我们需要一些东西来构建我们的语言，在 R 语言中，这些东西被称为对象。我们从五种非常常见的对象类型开始。\n\n逻辑型对象只取两个值：`TRUE`\
  \ 或 `FALSE`。计算机是二进制机器，数据通常可以在一个“全有或全无”的世界中被记录和建模。这些逻辑值非常有用，其中 `TRUE` 的值为 `1`，`FALSE`\
  \ 的值为 `0`：\n\n```\nTRUE\n[1] TRUE\nFALSE\n[1] FALSE\n```\n\n你可能还记得代数教授快速念叨过的评论，数字有多种类型或“风味”。整数，包括零和负值，在集合记法中为\
  \ {…,-2, -1, 0, 1, 2, …}，这些数字对于计数或其他索引（当然还有其他用途）很有帮助。在 R 中，整数带有大写 `L` 后缀。如果需要小数，那么双精度数值型对象就派上用场了。这些数字适用于等距比例数据类型。复数也拥有有用的性质，其表示方式正如你所料，虚部带有\
  \ `i` 后缀。R 在使用所有这些数字时非常友好，你只需键入所需的数字即可（记住根据需要添加 `L` 或 `i` 后缀）：\n\n```\n42L\n[1]\
  \ 42\n1.5\n[1] 1.5\n2+3i\n[1] 2+3i\n```\n\n名义级数据可以通过 `character`（字符）类来存储，并用引号标示：\n\
  \n```\n\"a\" ## 字符\n[1] \"a\"\n```\n\n当然，数值型数据可能存在缺失值。这些缺失值的类型与数据集中其余数据的类型相同（我们稍后会讨论数据存储）。不过，了解如何手动编码逻辑型、整型、双精度型、复数型或字符型的缺失值会很有帮助：\n\
  \n```\nNA\n[1] NA\nNA_integer_\n[1] NA\nNA_real_\n[1] NA\nNA_character_\n[1] NA\n\
  NA_complex_\n[1] NA\n```\n\n### 因子\n\n因子是一种特殊的对象，对于通用编程不那么有用，但在统计学中经常使用。因子变量表示该变量应被视作离散变量处理。因子以整数形式存储，并用标签来指示原始值：\n\
  \n```\nfactor(1:3)\n[1] 1 2 3\nLevels: 1 2 3\nfactor(c(\"a\", \"b\", \"c\"))\n[1]\
  \ a b c\nLevels: a b c\nfactor(letters[1:3])\n[1] a b c\nLevels: a b c\n```\n\n\
  ### 数据结构\n\n现在我们转向数据结构，它们可以存储我们讨论过的那些类型的对象（当然还有更多）。\n\n#### 向量\n\n向量是一种相对简单的数据存储对象。创建向量的一个简单方法是使用连接函数\
  \ `c()`：\n\n```\nc(1, 2, 3)\n[1] 1 2 3\n```\n\n就像在数学中一样，标量是长度为 1 的向量。在连续谱的另一端，矩阵是一个具有行和列维度的向量。注意矩阵是如何用数字\
  \ 1 到 6 填充的，按每列向下计数：\n\n```\nc(1)\n[1] 1\nmatrix(c(1:6), nrow = 3, ncol = 2)\n \
  \    [,1] [,2]\n[1,]    1    4\n[2,]    2    5\n[3,]    3    6\n```\n\n#### 列表\n\
  \n所有向量，无论是标量、向量还是矩阵，都只能有一种数据类型（例如，整型、逻辑型或复数型）。如果需要多种类型的数据，将数据存储在列表中可能更合适。`list`（列表）是一个对象的向量，其中列表的每个元素可以是不同的类型。在下面的例子中，我们构建了一个包含字符、向量和矩阵元素的列表：\n\
  \n```\nlist(\n+   c(\"a\"),\n+   c(1, 2, 3),\n+   matrix(c(1:6), nrow = 3, ncol\
  \ = 2)\n+   )\n[[1]]\n[1] \"a\"\n[[2]]\n[1] 1 2 3\n[[3]]\n     [,1] [,2]\n[1,] \
  \   1    4\n[2,]    2    5\n[3,]    3    6\n```\n\n#### 数据框\n\n列表的一种特殊类型是数据框，其中列表的每个元素长度相同（尽管对象类型不一定相同）。请看以下带有输出的指导性示例：\n\
  \n```\ndata.frame(1:3, 4:6)\n  X1.3 X4.6\n1    1    4\n2    2    5\n3    3    6\n\
  ### 使用长度不等的对象会导致问题\ndata.frame( 1:3, 4:5)\nError in data.frame(1:3, 4:5) :\narguments\
  \ imply differing number of rows: 3, 2\ndata.frame( 1:3, letters[1:3])\n  X1.3 letters.1.3.\n\
  1    1            a\n2    2            b\n3    3            c\n```\n\n#### 数据表\n\
  \n由于其卓越的速度，我们在 R 中使用 `data.table` 包中的数据表对象。数据表与数据框类似，但设计得更节省内存且速度更快。尽管我们推荐使用数据表，我们也会展示一些数据框的示例，因为当你使用\
  \ R 时，许多其他人的代码中包含数据框，并且数据表确实从数据框继承了许多方法。\n\n```\nlibrary(data.table)\ndata.table(\
  \ 1:3, 4:6)\n   V1 V2\n1:  1  4\n2:  2  5\n3:  3  6\n```\n\n探索了几种对象类型后，我们将注意力转向使用运算符和函数来操作这些对象的方法。\n\
  \n\n\n"
- '# 基础运算符与函数


  对象对于一门语言来说还不够；某些事物需要操作。运算符和函数是编程世界中的动词。我们从赋值开始，赋值可以通过两种方式进行。就像书面语言一样，更优雅的表达方式往往比简单的叙述更有帮助。因此，尽管
  `=` 和 `<-` 都是赋值运算符，并且功能相同，但由于 `=` 在函数内部用于设置参数，为了清晰起见，我们建议在一般情况下使用 `<-` 进行赋值。尽管如此，我们还是会演示两种赋值技术。赋值允许给对象赋予合理的名称；这可以显著提高代码的可读性（既为了未来的自己，也为了其他用户）。


  除了给变量命名外，你还可以使用函数来检查具体细节。R 中的函数通常采用函数名后跟括号的格式，括号内是输入内容，然后 R 会提供输出。以下是一些示例：


  ```

  x <- 5

  y = 3

  x

  [1] 5

  y

  [1] 3

  is.integer(x)

  [1] FALSE

  is.double(y)

  [1] TRUE

  is.vector(x)

  [1] TRUE

  ```


  一旦对象被赋值，你可以使用方括号访问特定的对象元素。大多数计算机语言的索引从 `0` 或 `1` 开始。R 的索引从 `1` 开始。另外，请注意，你可以轻松地更改旧的赋值，几乎没有麻烦，也不会收到警告；明智的做法是谨慎地注意名称并仔细注释代码。


  ```

  x <- c("a", "b", "c")

  x[1]

  [1] "a"

  is.vector(x)

  [1] TRUE

  is.vector(x[1])

  [1] TRUE

  is.character(x[1])

  [1] TRUE

  ```


  ### 访问和子集化数据结构


  虽然向量可能只需要单个索引，但更复杂的结构需要更多索引。对于你之前遇到的矩阵，第一个索引是行，第二个是列位置。注意，在构建矩阵并赋值之后，有多种方法可以访问元素的各种组合。这种仅访问部分元素的过程有时称为**子集化**：


  ```

  x2 <- matrix(c(1:6), nrow = 3, ncol = 2)

  x2

  [,1] [,2]

  [1,]    1    4

  [2,]    2    5

  [3,]    3    6

  x2[1, 2] ## 第 1 行，第 2 列

  [1] 4

  x2[1, ] ## 所有第 1 行

  [1] 1 4

  x2[, 1] ## 所有第 1 列

  [1] 1 2 3

  x2[c(1, 2), ] ## 第 1 行和第 2 行

  [,1] [,2]

  [1,]    1    4

  [2,]    2    5

  x2[c(1, 3), ] ## 第 1 行和第 3 行

  [,1] [,2]

  [1,]    1    4

  [2,]    3    6

  x[-2] ## 丢弃第二个元素

  [1] "a" "c"

  x2[, -2] ## 丢弃第二列

  [1] 1 2 3

  x2[-1, ] ## 丢弃第 1 行

  [,1] [,2]

  [1,]    2    5

  [2,]    3 6

  is.vector(x2)

  [1] FALSE

  is.matrix(x2)

  [1] TRUE

  ```


  #### 列表的子集化


  访问和子集化列表可能稍微复杂一点，但对于后续技术的学习和掌握却至关重要。在单括号中使用单个索引会返回该位置处的整个元素（请记住，对于列表，每个元素可能是一个向量或只是一个单独的对象）。使用双括号则返回该列表元素内的对象——仅此而已。


  因此，以下代码实际上是一个包含元素 `"a"` 的向量。同样，使用数据类型检查函数有助于学习如何解读代码的各个部分。


  ```

  y <- list(c("a"), c(1:3))

  y[1]

  [[1]]

  [1] "a"

  is.vector(y[1])

  [1] TRUE

  is.list(y[1])

  [1] TRUE

  is.character(y[1])

  [1] FALSE

  ```


  与以下代码形成对比，它只是元素 `"a"`：


  ```

  y[[1]]

  [1] "a"

  is.vector(y[[1]])

  [1] TRUE

  is.list(y[[1]])

  [1] FALSE

  is.character(y[[1]])

  [1] TRUE

  ```


  事实上，你可以将方括号链接在一起，因此可以访问列表的第二个元素（包含数字 1 到 3 的向量），然后在该向量内访问第三个元素：


  ```

  y[[2]][3]

  [1] 3

  ```


  #### 使用 `$` 运算符


  方括号几乎总是有效的，取决于对象的类型，但也可能有其他访问组件的方式。命名的数据框和列表可以使用 `$` 运算符。请注意在以下代码中，方括号或美元符号最终是等价的：


  ```

  x3 <- data.frame(A = 1:3, B = 4:6)

  y2 <- list(C = c("a"), D = c(1, 2, 3))

  x3$A

  [1] 1 2 3

  y2$C

  [1] "a"

  x3[["A"]]

  [1] 1 2 3

  y2[["C"]]

  [1] "a"

  ```


  请注意，虽然数据框和列表都是列表，但它们都不是矩阵：


  ```

  is.list(x3)

  [1] TRUE

  is.list(y2)

  [1] TRUE

  is.matrix(x3)

  [1] FALSE

  is.matrix(y2)

  [1] FALSE

  ```


  此外，尽管不是矩阵，但由于其特殊性质（即所有元素长度相等），数据框和数据表可以像矩阵一样进行索引：


  ```

  x3[1, 1]

  [1] 1

  x3[1, ]

  A B

  1 1 4

  x3[, 1]

  [1] 1 2 3

  ```


  #### 按名称索引


  任何命名的对象都可以通过使用名称而不是位置数字来索引，前提是这些名称已设置：


  ```

  x3[1, "A"]

  [1] 1

  x3[, "A"]

  [1] 1 2 3

  ```


  这适用于列名和行名，并且这些名称可以在构建矩阵后建立：


  ```

  rownames(x3) <- c("first", "second", "third")

  x3["second", "B"]

  [1] 5

  ```


  #### 处理数据表


  数据表使用略有不同的方法。选择行的操作几乎相同，但选择列时不需要引号。此外，你可以使用 `.()` 运算符按名称选择多个（不带引号）。如果需要使用引号，可以通过选项
  `with = FALSE` 来访问数据表，如下所示：


  ```

  x4 <- data.table(A = 1:3, B = 4:6)

  x4[1, ]

  A B

  1: 1 4

  x4[, A]

  [1] 1 2 3

  x4[1, A]

  [1] 1

  x4[1:2, .(A, B)]

  A B

  1: 1 4

  2: 2 5

  x4[1, "A", with = FALSE]

  A

  1: 1

  ```


  ### 方括号作为函数


  从技术上讲，方括号运算符是函数。尽管它们不常用作函数，但可以这样使用。大多数函数都有名称，但方括号是一个特例，需要在常规函数格式中使用单引号，如以下示例所示：


  ```

  `[`(x, 1)

  [1] "a"

  `[`(x3, "second", "A")

  [1] 2

  ```


  ### 类型检查和强制转换


  虽然我们一直在使用 `is.datatype()` 函数来更好地说明对象的类型，但你还可以做更多。具体来说，你可以使用 `is.na()` 函数检查某个值是否缺少元素：


  ```

  is.na(NA) ## 有效

  [1] TRUE

  ```


  当然，前面的代码片段通常有一个向量或矩阵元素参数，其填充状态有待讨论。我们最后一个（目前）探索性函数是 `inherits()` 函数。当不存在 `is.class()`
  函数时（这可能在开发了你目前所见的核心类之外的特定类时发生），它很有帮助：


  ```

  inherits(x3, "data.frame")

  [1] TRUE

  inherits(x2, "matrix")

  [1] TRUE

  ```


  #### 数据类型强制转换


  你也可以将较低类型强制转换为较高类型。这种强制转换可能会有帮助，但也可能产生意想不到的后果。如果你有一个更高级的数据对象被强制转换为较低类型，这尤其有风险（特别注意尝试将整数强制转换的情况）。


  ```

  as.integer(3.8)

  [1] 3

  as.character(3)

  [1] "3"

  as.numeric(3)

  [1] 3

  as.complex(3)

  [1] 3+0i

  as.factor(3)

  [1] 3

  Levels: 3

  as.matrix(3)

  [,1]

  [1,]    3

  as.data.frame(3)

  1 3

  as.list(3)

  [[1]]

  [1] 3

  > as.logical("a")

  [1] NA

  as.logical(3)

  [1] TRUE

  as.numeric("a")

  [1] NA

  Warning message:

  NAs introduced by coercion

  ```


  强制转换可能很有用。尽管如此，使用时必须谨慎。在离开本节之前，如果这些内容有任何新意，请务必使用不同于前述示例中的输入进行实验！实验永远不会有坏处，它是学习的有效方法。


  现在，让我们把注意力转向数学和逻辑运算符及函数。




  ## 数学运算符与函数


  多种运算符可用于比较操作。这些在我们后续学习循环和构建自定义函数时会很有帮助。同样实用的还有符号逻辑形式。我们先从一些基本比较开始，并承认对数字 **4** 有一种奇特的偏好：


  ```

  4 > 4

  [1] FALSE

  4 >= 4

  [1] TRUE

  4 < 4

  [1] FALSE

  4 <= 4

  [1] TRUE

  4 == 4

  [1] TRUE

  4 != 4

  [1] FALSE

  ```


  现在有必要提一下，虽然前面的代码可能有用，但数字之间通常只有微小的差异——尤其是在编程环境中，这依赖于计算机对浮点数（无理数）的表示。因此，我们经常检查数值是否在一个容差范围内接近：


  ```

  all.equal(1, 1.00000002, tolerance = .00001)

  [1] TRUE

  ```


  在符号逻辑中，**AND** 和 **OR** 是两个对象间有用的比较。在 R 中，我们用 `&` 表示 AND，用 `|` 表示 OR。可以从这些简单的结构构建复杂的逻辑测试：


  ```

  TRUE | FALSE

  [1] TRUE

  FALSE | TRUE

  [1] TRUE

  TRUE & TRUE

  [1] TRUE

  TRUE & FALSE

  [1] FALSE

  ```


  到目前为止提到的所有逻辑测试，应用于向量和应用于单个对象一样有效：


  ```

  1:3 >= 3:1

  [1] FALSE  TRUE  TRUE

  c(TRUE, TRUE) | c(TRUE, FALSE)

  [1] TRUE TRUE

  c(TRUE, TRUE) & c(TRUE, FALSE)

  [1]  TRUE FALSE

  ```


  如果你只想要单一的结果，例如用于 `if-else` 流程控制，你可以使用 `&&` 或 `||`，它们一旦确定了最终结果就会停止求值。请仔细理解以下代码和输出：


  ```

  W

  Error: object ''W'' not found

  TRUE | W

  Error: object ''W'' not found

  TRUE || W

  [1] TRUE

  W || TRUE

  Error: object ''W'' not found

  FALSE & W

  Error: object ''W'' not found

  FALSE && W

  [1] FALSE

  ```


  需要注意的是，双运算符实际上*并非*向量化的。它们只使用任何向量的第一个元素：


  ```

  c(TRUE, TRUE) || c(TRUE, FALSE)

  [1] TRUE

  c(TRUE, TRUE) && c(TRUE, FALSE)

  [1] TRUE

  ```


  `any()` 和 `all()` 函数在这些场景下也很有用，原因类似：


  ```

  any(c(TRUE, FALSE, FALSE))

  [1] TRUE

  all(c(TRUE, FALSE, TRUE))

  [1] FALSE

  all(c(TRUE, TRUE, TRUE))

  [1] TRUE

  ```


  现在我们将注意力转向数学运算符，而非逻辑运算符。R 在数学上很强大，可以执行大多数数学计算。因此，虽然我们介绍一些函数，但会省略很多。更多细节请参考 `?Arithmetic`，它会是个好帮手。了解计算机执行数学计算的方式（一如既往地）很重要。能够直接编写定制解决方案是强大的，但伴随着定制自由而来的是相应的责任。请仔细看以下数学运算（由于实现选择，它们的行为可能与预期不同）：


  ```

  3 + 3

  [1] 6

  3 - 3

  [1] 0

  3 * 3

  [1] 9

  3 / 3

  [1] 1

  (-27) ^ (1/3)

  [1] NaN

  4 %/% .7

  [1] 5

  4 %% .3

  [1] 0.1

  ```


  R 还有一些名称直白的常用函数：


  ```

  sqrt(3)

  [1] 1.732051

  abs(-3)

  [1] 3

  exp(1)

  [1] 2.718282

  log(2.71)

  [1] 0.9969486

  ```


  三角函数也占有一席之地，`?Trig` 可以调出一个很好的列表。为简洁起见，我们展示余弦函数调用 `cos()`。再次注意余弦函数输出的细微误差：


  ```

  cos(3.1415)

  [1] -1

  ```


  我们用一组简短的矩阵运算来结束本节和本章。标量运算使用基本算术运算符。要执行矩阵乘法，我们使用 `%*%`：


  ```

  x2

  [,1] [,2]

  [1,]    1    4

  [2,]    2    5

  [3,]    3    6

  x2 * 3

  [,1] [,2]

  [1,]    3   12

  [2,]    6   15

  [3,]    9   18

  x2 + 3

  [,1] [,2]

  [1,]    4    7

  [2,]    5    8

  [3,]    6    9

  x2 %*% matrix(c(1, 1), 2)

  [,1]

  [1,]    5

  [2,]    7

  [3,]    9

  ```


  矩阵在线性代数中还有一些其他相当常见的操作很有用。我们假设你对我们在建模中涉及的一些应用背后的数学有所了解，我们将在后续章节根据需要讨论适量的数学内容。不过，这里似乎是展示如何编码转置、叉积和转置叉积的好地方。我们展示了实现叉积和转置叉积的原始代码，以及可能使用的更简单的函数调用。顺便提一句，这在
  R 中是相对常见的。通过程序包，许多技术都以相当清晰的函数调用实现。以下是示例：


  ```

  t(x2)

  [,1] [,2] [,3]

  [1,]    1    2    3

  [2,]    4    5    6

  t(x2) %*% x2

  [,1] [,2]

  [1,]   14   32

  [2,]   32   77

  crossprod(x2)

  [,1] [,2]

  [1,]   14   32

  [2,]   32   77

  x2 %*% t(x2)

  [,1] [,2] [,3]

  [1,]   17   22   27

  [2,]   22   29   36

  [3,]   27   36   45

  tcrossprod(x2)

  [,1] [,2] [,3]

  [1,]   17   22   27

  [2,]   22   29   36

  [3,]   27   36   45

  ```


  我们用一些最后的思考来结束本章。首先，正如你刚才看到的，在 R 中，通常有人已经完成了繁重的工作，通过编写一个函数来直接产生期望的结果。当然，这些友好程序员的工作只受限于
  R 本身的基础约束以及获取免费 GitHub 账户的能力。因此，了解至少一些使 R 工作的基本命令和运算符是有帮助的。其次，R 运行在计算机上，对于那些尚未接触过计算机逻辑的人来说，由于硬件结构（以及随之而来的软件实现选择），存在一些差异。


  接下来，让我们专注于理解实现的细微差别，以及快速地将数据输入和输出 R。


  '
- '# 编程实用工具


  使用 R 执行更高级的操作需要创建可能从未存在过的东西。要创造新事物，就需要细致地理解预构建函数的精确工作方式。本章讨论如何以及在哪里查找现有功能的帮助和文档，R
  如何与你的计算机系统和文件交互，以及数据输入输出的细节。和之前一样，请根据你的需要自由选择本章的内容。我们从帮助文件和文档开始。


  注意

  本书中，**粗体** 代码意味着需要运行。非粗体代码表示命令行输出的结果，或者旨在提供信息但不一定需要运行的代码。




  ## 帮助与文档


  R 语言社区提供了丰富的资源来帮助用户。从预置的函数到包中按主题收集的完整函数集，支持形式多种多样。`?` 和 `help` 都是获取对象或函数信息的有效方式。对于更常见的对象，R
  不仅提供了详尽的文档说明具体细节（例如函数的输入），还对预期接受的输入内容进行了详细注释。此外，文档中通常还会展示详细的示例，以说明可以实现的功能。图 2-1
  展示了使用这两个函数查询加法运算符时的输出：


  ![A393929_1_En_2_Fig1_HTML.jpg](img/A393929_1_En_2_Fig1_HTML.jpg)


  **图 2-1. 算术运算符的帮助文档**


  ```

  ?''+''

  help("+")

  ```


  请注意图 2-1 底部，关于算术运算符的文档甚至贴心地提供了特定信息，指出输出结果可能因平台而异。值得注意的是，并非所有函数都有如此完整、随时可查的文档，但对于许多最常用的函数和包，可以获得极其详细的信息。编写能够独立于平台和环境、重现预期结果的代码，并非总是可行。稍后讨论调试时，这类对各种函数的高级认知会很有帮助。


  当然，当你已经知道要使用的对象或函数，只是需要更多细节时，这类帮助更有用。若想实现全新的功能，查阅手册会有所帮助。[`https://cran.r-project.org/manuals.html`](https://cran.r-project.org/manuals.html)
  就是这样一个由 R 核心开发团队维护的网站。


  现在我们将注意力转向 R 访问系统文件的方式。


  ## 系统与文件


  在 Windows 环境中，R 可能是实现文件操作自动化的非常有效的方式。大多数 IT 部门都愿意安装 R，并且它具有与您相同的文件权限。从创建文件到移动文件、检查日期，R
  提供了多种函数，便于从系统获取信息和实现文件管理自动化。根据我们的观察，基于 Unix 的系统可能通过命令行有更优雅的方式来处理此类场景。


  R 访问系统的一个有用特性是，它可以发现运行 R 的系统的当前日期、时间和时区。这有助于检测新文件，或用于在文件中添加时间戳（稍后详述）。需要注意的是，这些信息当然依赖于系统环境的准确性，因此在用于高风险项目之前，可能需要谨慎行事。


  ```

  Sys.Date()

  [1] "2016-02-13"

  Sys.time()

  [1] "2016-02-13 16:58:36 CST"

  Sys.timezone()

  [1] "America/Chicago"

  ```


  这些命令的帮助文档提供了有用的建议，以提高输出的准确性，甚至可能达到毫秒或微秒的精度。


  现在让我们关注各种文件管理函数。它们都遵循 `file.*` 的格式，并且第一个参数是一个字符向量，应该是当前工作目录下的文件名，或者是路径加文件名。我们从工作目录中的一个文本文件
  `ch02_text.txt` 开始。


  函数 `file.exists()` 只接受一个字符串输入，即文件名或路径加文件名。如果仅仅是文件名，它只检查工作目录。这个工作目录由 `getwd()` 函数确认。如果想检查另一个目录中的文件，可以通过在字符串中提供完整的文件路径来实现。此函数返回一个逻辑值
  `TRUE` 或 `FALSE`。根据用户对特定文件的权限，您可能无法获得预期的结果。


  ```

  getwd()

  [1] "C:/Books/Apress_AdvancedR/RFiles"

  file.exists("ch02_text.txt")

  [1] TRUE

  file.exists("NOSUCHFILE.FAKE")

  [1] FALSE

  file.exists("C:/Books/Apress_AdvancedR/Apress_AdvancedR_Proposal.docx")

  [1] TRUE

  ```


  前面的函数检查是否存在，而另一个函数则测试我们是否有权访问文件。函数 `file.access` 接受类似的输入，但它还需要第二个参数。要测试存在性，第二个参数是
  `0`。要测试可执行权限，使用 `1`；要测试写入权限，使用 `2`。如果要测试读取文件的能力，使用 `4`。此函数返回一个整数向量，`0` 表示授予权限，`-1`
  表示未授予权限。请注意，该函数的默认设置是测试简单的存在性。`file.access` 的示例如下：


  ```

  file.access("ch02_text.txt")

  ch02_text.txt


  file.access("ch02_text.txt", mode = 0)

  ch02_text.txt


  file.access("ch02_text.txt", mode = 1)

  ch02_text.txt


  file.access("ch02_text.txt", mode = 2)

  ch02_text.txt


  file.access("ch02_text.txt", mode = 4)

  ch02_text.txt

  ```


  接下来，我们将注意力转向 `file.info` 函数，它可以获取关于文件何时被修改、更改或访问的更详细信息。该函数同样接受字符串作为输入。输出提供以下信息：文件大小；是否为目录；以读、写、执行顺序表示的文件权限整数；最后修改时间；最后更改时间；最后访问时间；最后，文件是否可执行：


  ```

  file.info("ch02_text.txt", "chapter01.R")

