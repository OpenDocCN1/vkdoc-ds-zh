  \ 或富文本，以及 Beamer PDF 幻灯片。`Beamer` 和 PDF 都需要我们之前完成的 `MiKTeX` 安装。要更改编译的文档类型，只需更改输出！值得注意的是，第一次使用\
  \ `MiKTeX` 时，编译可能需要更长时间，因为可能需要在后台安装一两个包。这无需任何用户干预；只是需要时间。同样值得注意的是，如果你使用 `beamer_presentation`，则需要考虑一张幻灯片上能放什么和不能放什么。在这种情况下，一个回车符后跟\
  \ `----`，再跟另一个回车符，表示演示文稿中的新幻灯片。\n\n```\n---\ntitle: \"ch15_html\"\nauthor: \"Matt\
