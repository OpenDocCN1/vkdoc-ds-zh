  下一章将提供快速重复类似操作以及根据环境进行过程修正的工具。这些技术与本章的方法相结合，能够相当方便地在相对较大的规模上实现文件管理的自动化。


  '
- '# 3. 编程自动化


  有人说，重复同样的行动却期待不同的结果，这是疯狂的定义。虽然在牛津词典的简短搜索中并未找到此定义，但我们持有一个相似的前提：为防止疯狂，让计算机来反复执行同样的操作吧，并期待相同的结果！


  本章的目标是让你开始在代码中构建自动化。代码的部分力量在于它乐于按需反复执行相同操作，不会出错也不会疲倦。代码的另一个有用特性是能够在程序流程中嵌入逻辑。我们人类在最佳状态下自然会使用这种逻辑。例如，如果父亲的钥匙挂在挂钩上，他一定在家。否则，父亲一定还在外活动。另一个例子：如果
  `p` 小于 `alpha`，则拒绝零假设；否则，不拒绝零假设。


  因为这种自动化允许进行大量重复，所以必须注意效率。代码运行需要多长时间？代码能否以不同的方式编写以使操作执行得更快？在编程中，或许也像在生活中一样，我们通常没有完美的答案，而是在选择和结果之间有更多的权衡。我们生活在一个勇敢新世界，在这个世界里，新的、更强大的硬件常常比为了挤出多一点效率所需的人力成本更便宜。另一方面，我们的这个勇敢新世界也拥有数十亿条目的数据集；从每次计算中节省一毫秒，就能节省数百小时的计算时间。我们尽力采取平衡的方法，先演示一些更容易理解的构造，然后再展示更快的方法。


  当我们开始介绍这些自动化方法中的第一种时，我们要提醒你，编码既是一门科学，也是一门艺术。更清晰、更易读的代码可能不是最快的。唯一本质的“快”的定义是“足够快”。如果某种代码对你来说更有意义，从而让你更可能记住并使用它，那可能就足够好了。当然，如果不够快，就需要做一些研究来找到更快的替代方案。




  ## 循环


  循环会重复执行其内部的代码。需要注意避免陷入无限循环——即永不停止的循环。大多数循环都内置了尝试停止的机制（尽管这些机制并不总是按计划生效）。在下一节中，我们将讨论手动退出循环的方法。循环的另一个需要注意的方面与它们是函数这一事实有关。虽然我们之前已经使用了“函数”这个词，但我们推迟到下一章再深入讨论函数。现在只需记住，在函数内部创建的任何内容，在该函数结束时都可能消失。对于循环来说，当它们停止重复时就会发生这种情况。因此，如果你想保留结果，就需要在循环外部构建容纳这些结果的容器。同样，我们将在下一章深入探讨具体细节。


  ### `for` 循环


  `for` 循环是我们要讨论的第一个（或许在 R 语言中也是最具争议的）自动化工具。在许多计算机语言中，`for()` 被认为速度相当快，但在 R 中则不然。尽管如此，这个函数易于理解和使用。易读的代码不应被不必要的回避。然而，通常有多种方法可以实现目标，忽视它们是不明智的。我们在代码中使用
  `proc.time()` 函数来测量不同的时间；我们将通过计算停止时间与开始时间的差来得到运行时间。请看以下代码和输出：


  ```

  x <- seq(1,100000,1)

  head(x)

  [1] 1 2 3 4 5 6

  forTime<- proc.time()

  xCube <- NULL

  for (i in 1:length(x) ) {

  +   xCube[i] = x[i]³

  + }

  forTime <- proc.time()-forTime

  head(xCube)

  [1]   1   8  27  64 125 216

  forTime

  user  system elapsed

  11.04    0.17   11.25

  ```


  你可以看到变量 `x` 中包含数字 `1` 到 `100,000`（通过调用 `head()` 函数显示前六个数字）。接下来，我们创建一个变量来存放所有这些数字的立方。我们还将当前时间存储在一个变量中，以便对该操作计时。现在来看
  `for()` 函数的奇妙之处！这个函数接受一个索引（通常称为 `i`）和一个索引操作的范围。我们从 `i` 等于 `1` 开始，循环运行。在循环结束时，`i`
  会自动加 `1`，然后重复循环。循环会一直重复，直到达到范围的最后部分。注意我们没有选择一个固定的上限；相反，我们根据 `x` 的长度来调整循环。你可以看到，循环确实将
  `x` 的每一项进行了立方运算。在我们的系统中，这花费了 `11.25` 秒。


  #### 优化 `for` 循环


  不过，这个时间是可以优化的。注意虽然我们创建了变量 `xCube`，但它是一个空变量。我们的 `for` 循环的每次迭代不仅需要对 `x` 进行立方运算，还必须将
  `xCube` 变量的大小增加 `1`。这被证明并非一项简单的任务。如果我们能够提前将 `xCube` 创建为我们所需的大小，性能将显著提高。我们首先删除 `xCube`，以避免被任何先前的数据误导：


  ```

  rm(xCube)

  forTime2<- proc.time()

  xCube <- vector(mode = "numeric", length = length(x))

  for (i in 1:length(x) ) {

  +   xCube[i] = x[i]³

  + }

  forTime2 <- proc.time()-forTime2

  head(xCube)

  [1]   1   8  27  64 125 216

  forTime2

  user  system elapsed

  0.15    0.00    0.15

  ```


  注意，现在我们的时间只有 `0.15` 秒——大大提高了！值得注意的是，即使我们创建了一个长度不够的虚拟 `xCube`，或者创建了一个太长、需要在末尾删除一些空条目，这仍然会更快。因此，即使在运行循环之前可能无法或不便知道所需变量的大小，创建一个可能足够大的容器来首先存储数据可能也是有益的。


  ### R 中的向量化操作


  对于这个特定的例子，使用 `for` 循环是错误的做法。R 为其一些最简单的函数提供了强大且快速的底层代码。注意，这里几乎没有花费任何时间（当然，有一些，但根据操作系统，某些差异不明显）。此外，注意
  `head()` 函数可以接受负数，用于从末尾向前计数，显示如下内容：


  ```

  xCube <- NULL

  vTime <- proc.time()

  xCube <- x³

  vTime <- proc.time()-vTime

  head(xCube, -99994)

  [1]   1   8  27  64 125 216

  vTime

  user  system elapsed

  0       0       0

  ```


  ### `while` 循环


  还有其他类型的循环。`for` 循环最适合运行一个过程特定的次数，并在结束时停止。另一方面，`while` 循环最适合运行一个不确定次数，直到某个停止条件发生的过程。通常，使用不同类型的循环（或者正如你刚刚看到的，根本不用循环）可以获得相同的结果。尽管如此，每种类型的循环在特定条件下往往都有更自然的用途。作为一个独立练习，在学习我们给出的
  `while` 循环示例后，看看你是否能复制之前的立方运算结果。


  #### 使用 `while` 循环进行模拟


  也许一个贴近各地研究人员内心的例子是模拟。毕竟，如果我们能够模拟数据，这可能是理解现实世界结果可能怎样的第一步。统计学已融入 R 语言，函数 `rnorm()`
  最多接受三个输入。第一个控制我们希望为样本返回的元素数量。第二个和第三个控制从中随机抽取样本的总体水平的均值和标准差。让我们看看 `rnorm` 给我们什么：


  ```

  for (i in 1:5 ) {

  +   x <- rnorm(5,4,2)

  +   print(x)

  +   print(paste0("Xbar: ",mean(x)))

  +   print(paste0("StdDev: ",sd(x)))

  + }

  [1] 2.0287126 4.5664489 0.1310789 3.6347667 4.2465319

  [1] "Xbar: 2.92150781627209"

