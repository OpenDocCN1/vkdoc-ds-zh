  \ 做同样的事情，但 tibble 会自动提供关于每列数据类型或类以及总列数和行数的信息（例如 `<dbl>` 表示双精度或数值，`<chr>` 表示字符类数据）。我们将注意力转向处理数据的常见目标：排序、子集选择、排列、计算和重塑。理解\
  \ `dplyr` 的一个有用方法是，它使用动词来描述对数据的操作。\n\n## 排序\n\n我们在 `dplyr` 中通过 `arrange()` 函数进行排序，该函数的第一个参数是一个数据集。第一个参数之后的其他参数用于按其他列进行排序。默认顺序是升序，可通过第二个函数调用\
