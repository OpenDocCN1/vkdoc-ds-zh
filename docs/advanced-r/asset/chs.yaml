  \ 5 6 7 8\nY: 6 8 7 10\nLabels: e f g h\n```\n\n## 总结\n\n本章介绍了用于开发新类和方法 的 R 语言中的\
  \ S3 和 S4 系统。特别是 S4 系统可能比较复杂，涉及多重父类继承以及针对多个参数类进行特化的方法。即使你使用并在 R 中进行开发，你可能也很少开发新类，因为大多数数据类型都已经有现成的类。然而，开发或扩展现有方法通常很有帮助，至少理解类和方法的运作方式可以让你更容易地使用现有功能。\n\
  \n希望本章足以让你开始使用这些系统并了解其能力。表 5-1 描述了本章涵盖的关键函数。在第 6 章中，我们将函数、类和方法捆绑在一起，制作我们自己的 R 包。重点在于制作一个\
  \ R 包，因此你无需对类和方法的掌握过于熟练。如果你的工作能受益于 S4 系统的使用，你可以从 John Chambers 的“How S4 Methods\
