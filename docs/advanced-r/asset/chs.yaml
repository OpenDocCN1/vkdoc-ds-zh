- "# 函数特定功能：控制流程与错误处理\n\n`on.exit()` 函数可确保在函数退出或完成时执行一组特定命令。即使函数出错或未按预期正常完成，`on.exit()`\
  \ 中的表达式也会执行。以下代码第二个用例的小函数示例说明了这一点。一个错误导致函数终止，一旦发生这种情况，就会执行`on.exit()`中的表达式。当函数修改其外部的任何值时，使用`on.exit()`尤其有价值。例如，绘图函数有时会修改默认的绘图参数，并在完成后将其恢复原状。使用`on.exit()`可以确保，即使出现问题导致函数失败或出错，用户仍然拥有所有原始设置：\n\
  \n```\nf <- function(x) {\non.exit(print(\"Game over\"))\nx + 5\n}\nf(3)\n[1] \"\
  Game over\"\n[1] 8\nf(\"a\")\nError in x + 5 (from #3) : non-numeric argument to\
  \ binary operator\n[1] \"Game over\"\n```\n\n我们将要介绍的最后一套函数特定功能与向软件或用户发送信号有关。按严重程度排序，它们依次是\
  \ `stop()`、`warning()` 和 `message()`。下一个例子更贴近实际一些，它计算一个变量的平均值，可选择原始尺度或转换后的尺度，然后对平均值进行反向转换。对数尺度对异常值相对更具抵抗力。如果使用对数变换，示例代码会通过\
  \ `stop()` 函数检查变量是否包含负值（负值在对数变换中未定义，会导致完全错误）。传递给 `stop()` 的参数是要显示的错误消息。对于 `warning()`\
  \ 也遵循类似过程，同样传递要在警告中显示的消息。警告与错误不同。`stop()` 产生的错误会使函数停止评估并终止。警告会在最后发出，但允许函数继续执行。最后，`message()`\
  \ 可用于向用户发送消息或信号，但并不像警告那样指示真实或可能的问题。虽然没有演示，但还有一个相关的便利函数 `stopifnot()`，它允许传递一个逻辑表达式，并在该表达式不为真时发出错误。尽管此选项有节省代码的好处，但缺点是无法编写自定义错误消息来准确指出问题所在。\n\
  \n使用警告或消息而非仅调用 `print()` 或 `cat()` 让函数打印信息的一个原因是，警告和消息可以通过同名函数 `suppressWarnings()`\
  \ 和 `suppressMessages()`（可选择性地）进行抑制。所有这些功能都在下面的代码中得到了演示：\n\n```\nf <- function(x,\
  \ trans = c(\"identity\", \"log\")) {\ntrans <- match.arg(trans)\nif (trans == \"\
  log\") {\nif (any(x < 0)) stop(\"Log is not defined for negative values\")\nif (any(x\
  \ < 1e-16)) warning(\"Some x values close or equal to zero, results may be unstable\"\
  )\nx <- log(x)\nmessage(\"x successfully log transformed\")\nexp(mean(x))\n} else\
  \ {\nmean(x)\n}\n}\nf(c(1, 2, 100))\n[1] 34.33333\nf(c(1, 2, 100), trans = \"log\"\
  )\nx successfully log transformed\n[1] 5.848035\nsuppressMessages(f(c(1, 2, 100),\
  \ trans = \"log\"))\n[1] 5.848035\nf(c(0, 1, 2, 100), trans = \"log\")\nx successfully\
  \ log transformed\n[1] 0\nWarning message:\nIn f(c(0, 1, 2, 100), trans = \"log\"\
  ) :\nSome x values close or equal to zero, results may be unstable\nsuppressWarnings(f(c(0,\
  \ 1, 2, 100), trans = \"log\"))\nx successfully log transformed\n[1] 0\nf(c(-1,\
  \ 1, 2, 100), trans = \"log\")\nError in f(c(-1, 1, 2, 100), trans = \"log\") (from\
  \ chapter04.R!79246pw#5) :\nLog is not defined for negative valuesFunctionssuppressWarnings()FunctionssuppressMessages()\n\
  ```\n\n## 调试\n\n到目前为止演示的函数要么都能工作，要么是设置了显而易见的故意错误。有时，寻找错误或调试已编写代码和函数的过程需要更长时间。幸运的是，有一些工具可以帮助这一过程，也有一些实践可以缩小问题的范围。\n\
  \n尽管调试可以应用于任何代码，而不仅仅是函数，但如果没有额外工具，函数尤其难以调试，因为通常它们的所有代码都会无中断地执行，没有机会观察沿途发生了什么。在本节中，我们将编写一个函数，该函数使用公式计算一个变量按另一个变量的水平分组后的均值，利用你在第\
  \ 3 章中已了解的 `tapply()`；然后该函数绘制原始数据，并用点表示均值，使用以下代码，结果如图 4-1 所示：\n\n![A393929_1_En_4_Fig1_HTML.jpg](img/A393929_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1.\n散点图，未填充点表示数据，蓝色大点表示均值，显示错误的结果\n\n```\nmeanPlot <- function(formula, d)\
  \ {\nv <- all.vars(formula)\nm <- tapply(d[, v[1]], d[, v[2]],\nFUN = mean, na.rm\
  \ = TRUE)\nplot(formula, data = d, type = \"p\")\npoints(x = unique(d[, v[2]]),\
  \ y = m,\ncol = \"blue\", pch = 16, cex = 2)\n}\nmeanPlot(mpg ∼ cyl, d = mtcars)\n\
  ```\n\n关于均值，有些地方看起来不太对。当 `cyl = 8` 时，点的均值看起来还好，但另外两个似乎处于极端。`debug()` 函数允许我们调试一个函数，并在其执行时逐行逐步执行。要使用它，我们首先需要在要调试的函数上调用\
  \ `debug()`：\n\n```\ndebug(meanPlot)\n```\n\n然后当我们调用原始函数时，它会触发 R 进入调试模式。在第一步，R 会告诉我们正在调试的函数调用以及位置：\n\
  \n```\nmeanPlot(mpg ∼ cyl, d = mtcars)\ndebugging in: meanPlot(mpg ∼ cyl, d = mtcars)\n\
  debug at c:/Temp/chapter04.R!79246wk#1: {\nv\ndebug at #2: v\ndebug at #3: m\ndebug\
  \ at #5: plot(formula, data = d, type = \"p\")\nBrowse[2]> m\n4        6       \
  \ 8\n26.66364 19.74286 15.10000\nBrowse[2]> unique(d[, v[2]])\n[1] 6 4 8\nBrowse[2]>\
  \ Q\n```\n\n既然我们知道了问题发生的位置，我们就可以通过首先对数据进行排序来修复函数，使 `tapply()` 和 `unique()` 给出的结果顺序一致。代码如下所示，结果在图\
  \ 4-2 中：\n\n![A393929_1_En_4_Fig2_HTML.jpg](img/A393929_1_En_4_Fig2_HTML.jpg)\n\n\
  图 4-2.\n散点图，未填充点表示数据，蓝色大点表示均值，显示修正后的结果\n\n```\nmeanPlot <- function(formula, d)\
  \ {\nv <- all.vars(formula)\nd <- d[order(d[, v[2]]), ] ## 先排序\nm <- tapply(d[,\
  \ v[1]], d[, v[2]],\nFUN = mean, na.rm = TRUE)\nplot(formula, data = d, type = \"\
  p\")\npoints(x = unique(d[, v[2]]), y = m,\ncol = \"blue\", pch = 16, cex = 2)\n\
  }\nmeanPlot(mpg ∼ cyl, d = mtcars)\n```\n\n如果你正在调试你的函数，并且不想逐步执行每一行代码，可以将 `browser()`\
  \ 函数插入到函数代码中。然后，当函数执行到该点时，会启动一个浏览器，你可以检查函数局部环境中变量的当前状态。在以下示例代码中，我们在函数中添加了一个对 `browser()`\
  \ 的调用，使用 `ls()` 检查当前可用的对象，检查对象 `v` 的内容，并再次输入大写字母 `Q` 退出调试：\n\n```\nmeanPlot\ndebug\
  \ at #9: plot(formula, data = d, type = \"p\")\nBrowse[2]> ls()\n[1] \"d\"     \
  \  \"formula\" \"m\"       \"v\"\nBrowse[2]> v\n[1] \"mpg\" \"cyl\"\nBrowse[2]>\
  \ Q\n```\n\n\n\n### 调试实用函数 `traceback()`\n\n在交互式工作时，一个有用的调试函数是 `traceback()`。例如，如果你调用一个像\
  \ `lm()` 这样的函数然后得到一个错误信息，有时可能很难确切知道错误发生在哪里或为什么会发生。错误通常并不直接来自你调用的函数，因为你经常使用的函数内部可能会依次调用许多其他函数。下面的例子展示了如何在产生错误的代码之后立即使用\
  \ `traceback()` 来做到这一点。输出显示了从初始调用到最终生成错误的代码的调用堆栈跟踪。如果你需要查看代码来确定错误原因，这可能是有用的信息：\n\
  \n```\nlm(mpg ∼ jack, data = mtcars)\nError in eval(expr, envir, enclos) : object\
  \ 'jack' not found\ntraceback()\n7: eval(expr, envir, enclos)\n6: eval(predvars,\
  \ data, env)\n5: model.frame.default(formula = mpg ∼ jack, data = mtcars, drop.unused.levels\
  \ = TRUE)\n4: stats::model.frame(formula = mpg ∼ jack, data = mtcars, drop.unused.levels\
  \ = TRUE)\n3: eval(expr, envir, enclos)\n2: eval(mf, parent.frame())\n1: lm(mpg\
  \ ∼ jack, data = mtcars)\n```\n\n### 调试外部包中的代码\n\n有时，代码错误并不在你的代码中，而是在你正在使用的其他代码中，例如来自另一个\
  \ R 包。虽然建议的 R 包中很少发现错误，但在成千上万的其他 R 包中更为常见。此外，有时问题本身并不是错误，而是你希望如何使用函数与原始作者设想其使用方式之间的差异。尽管\
  \ CRAN 上所有 R 包的源代码都可以公开下载和编辑，但仅仅为了看看在一个函数中做点略微不同的改动是否能解决问题，就去下载整个包的源代码、编辑和重新安装，可能会很麻烦。\n\
  \n考虑以下挑战。假设你使用的数据由于某种原因有时包含无穷大值，但你只想包含有限的情况。以下代码展示了使用 `Hmisc` 包中的 `wtd.quantile()`\
  \ 函数的一个例子：\n\n```\nwtd.quantile(c(1, 2, 3, Inf, NA),\nweights = c(.6, .9, .4, .2,\
  \ .6))\n0%  25%  50%  75% 100%\nNaN  Inf  Inf  Inf  Inf\n```\n\n如果我们查看 `wtd.quantile()`\
  \ 的代码，通过在 R 控制台中输入不带括号的函数名，我们可以看到是另一个函数 `wtd.table()` 进行了主要计算，如下所示：\n\n```\nwtd.quantile\n\
  function (x, weights = NULL, probs = c(0, 0.25, 0.5, 0.75, 1),\ntype = c(\"quantile\"\
  , \"(i-1)/(n-1)\", \"i/(n+1)\", \"i/n\"), normwt = FALSE,\nna.rm = TRUE)\n{\nif\
  \ (!length(weights))\nreturn(quantile(x, probs = probs, na.rm = na.rm))\ntype  1))\n\
  stop(\"Probabilities must be between 0 and 1 inclusive\")\nnams \n1) 2 - log10(diff(range(probs)))\
  \ else 2)), \"%\", sep = \"\")\nif (type == \"quantile\") {\nw \n```\n\n#### 检查和修改\
  \ `wtd.table()` 函数\n\n使用相同的方法，我们可以检查 `wtd.table()` 函数。这样做时，我们会发现虽然它可以自动删除缺失值，但它没有检查或删除非有限值的方法。仅仅更改你的数据可能看起来更容易，但有时数据是自动生成并传递的，因此更改函数比修改数据更简单。我们可以轻松地将\
  \ `wtd.table()` 的代码复制并粘贴到我们的 R 编辑器中并进行修改，如下所示：\n\n```\nrevised.wtd.table  length(levused))\
  \ && any(is.na(weights)))\nweights <- weights[!is.na(weights)]\nif (length(weights)\
  \ != length(levused))\nstop(\"program logic error\")\nnames(weights) <- levused\n\
  }\nif (!length(names(weights)))\nstop(\"program logic error\")\nif (type == \"table\"\
  )\nreturn(weights)\nx <- all.is.numeric(names(weights), \"vector\")\nif (isdate)\n\
  attributes(x) <- c(attributes(x), ax)\nnames(weights) <- NULL\nreturn(list(x = x,\
  \ sum.of.weights = weights))\n}\nxx <- x\nif (isdate)\nattributes(xx) <- c(attributes(xx),\
  \ ax)\nif (type == \"list\")\nlist(x = if (length(lev)) lev[x] else xx, sum.of.weights\
  \ = weights)\nelse {\nnames(weights) <- if (length(lev))\nlev[x]\nelse xx\nweights\n\
  }\n}\n```\n\n与原始的 `wtd.table()` 函数不同，修改后的函数完全按照我们的意愿工作：\n\n```\nwtd.table(c(1, 2,\
  \ 3, Inf, NA),\nweights = c(.6, .9, .4, .2, .6))\n$x\n[1]   1   2   3 Inf\n$sum.of.weights\n\
  [1] 0.6 0.9 0.4 0.2\nrevised.wtd.table(c(1, 2, 3, Inf, NA),\nweights = c(.6, .9,\
  \ .4, .2, .6))\n$x\n[1] 1 2 3\n$sum.of.weights\n[1] 0.6 0.9 0.4\n```\n\n### 使用 `assignInNamespace()`\
  \ 在命名空间中覆盖函数\n\n然而，挑战在于 `wtd.quantile()` 函数以及其他使用 `wtd.table()` 的 `Hmisc` 函数仍然无法按我们希望的方式工作，因为它们没有使用我们修改后的函数。将我们的函数分配给全局环境中的名称\
  \ `wtd.table()` 是不够的，因为作用域规则意味着 `Hmisc` 函数会首先从 `Hmisc` 环境中访问 `wtd.table()` 函数，而不是从我们的全局环境中。这就像在你的计算机上有两个不同文件夹中的同名文件。为了让所有使用\
  \ `wtd.table()` 的 `Hmisc` 函数都使用我们修改后的函数，我们不仅需要正确命名它，还需要将其放在正确的位置。我们可以使用 `assignInNamespace()`\
  \ 函数将一个对象分配给特定的命名空间：\n\n```\nassignInNamespace(x = \"wtd.table\",\nvalue = revised.wtd.table,\n\
  ns = \"Hmisc\")\nwtd.quantile(c(1, 2, 3, Inf, NA),\nweights = c(.6, .9, .4, .2,\
  \ .6))\n0%   25%   50%   75%  100%\n2.000 2.225 2.450 2.675 2.900\nwtd.Ecdf(c(1,\
  \ 2, 3, Inf, NA),\nweights = c(.6, .9, .4, .2, .6))\n$x\n[1] 1 1 2 3\n$ecdf\n[1]\
  \ 0.0000000 0.3157895 0.7894737 1.0000000\n```\n\n### 注意事项\n\n虽然 `assignInNamespace()`\
  \ 函数没有输出，但我们可以看到，之后 `wtd.quantile()` 函数和其他依赖 `wtd.table()` 的函数，如 `wtd.Ecdf()`，现在都按我们希望的那样工作了。关于\
  \ `assignInNamespace()` 的一个警告是，你不能将任何对象分配给在命名空间中尚不存在的对象（也就是说，你只能覆盖现有对象）。你也不允许在你可能想提交到\
  \ CRAN 的任何包中使用 `assignInNamespace()`。即使这有时是一种便捷的方法，但如果人们将其作为一般规则来做，那会变得混乱。如果发生这种情况，包\
  \ A 中的函数定义将取决于你是否加载了包 B，因为包 B 可以覆盖（而不仅仅是屏蔽）包 A 中的函数定义。请注意，你以这种方式所做的任何更改都是临时的，并且在你重启\
  \ R 后会消失。然而，这对于调试现有包来说是一个有用的技巧，因为它是一种相对简单的方法来确保在使用 `wtd.quantile()` 时遇到的问题确实通过对\
  \ `wtd.table()` 的更改而“修复”了。此时，如果这确实是一个错误，或者即使只是一个理想的功能，你可以给包的维护者发电子邮件建议更改，确信所建议的代码有效。要查看当前的维护者，你可以直接输入\
  \ `maintainer(\"Hmisc\")`，或者任何你感兴趣的包的名称。\n\n\n\n## 总结\n\n本章我们讨论了许多函数以及关于函数的诸多内容！如果你需要回忆任何特定函数的细节，表\
  \ 4-1 列出了本章介绍的关键函数，并对每个函数提供了简要描述。当然，你可以在官方帮助文件中查看更多信息。\n\n表 4-1. 本章描述的关键函数\n\n|\
  \ 函数 | 功能描述 |\n| --- | --- |\n| `formals()` | 允许查看你构建的函数的形参。 |\n| `args()` | 显示已创建函数的参数名称及其默认值。\
  \ |\n| `body()` | 显示函数的主体（`{` 和 `}` 之间的代码）。 |\n| `environment()` | 显示函数所在的环境（到目前为止通常是全局环境）。\
  \ |\n| `search()` | 显示函数的搜索顺序。记住，别人可能已经使用了你的函数名！ |\n| `parent.env()` | 接受一个环境，并向上追溯一层。\
  \ |\n| `match.arg()` | 允许对函数参数进行模糊匹配。 |\n| `missing()` | 测试是否向函数传递了某个值。注意，在 `match.arg()`\
  \ 之后，此函数会返回 `FALSE`。 |\n| `match.call()` | 捕获整个函数调用；常用于回归分析中。 |\n| `return()` |\
  \ 不是必需的，可能有争议，并且如果使用，请确保它是新函数的最后一部分。 |\n| `invisible()` | 抑制输出。 |\n| `on.exit()`\
  \ | 无论函数执行成功还是失败，都会执行其参数。 |\n| `stop()`, `stopifnot()`, `warning()`, `message()`\
  \ | 这些是不同严重级别的错误信息，从完全停止并报错，到温和的警告，再到通常较为礼貌的消息。 |\n| `suppressWarnings()`, `suppressMessages()`\
  \ | 这两者功能正如其名。一旦你对一个函数熟悉了，其警告或信息可能会显得冗长或可以安全忽略。 |\n| `debug()` | 使用此函数来开始调试一个运行不正常的函数。\
  \ |\n| `browser()` | 此函数进入函数体内，恰好停在你想调试的部分之前。 |\n| `traceback()` | 提供导致错误的表达式列表。\
  \ |\n| `assignInNamespace()` | 允许用本地编写的函数临时替换某个函数。 |\n| `maintainer()` | 在包上调用此函数，会显示用于故障排除的联系人姓名和电子邮件。\
  \ |\n\n虽然函数各个部分的正式名称不一定至关重要，但学习如何高效地使用和编写函数可能是你学习 R 语言最好的投资之一。编写函数提供了一种避免编写重复代码的方法。虽然没有严格的规则，但如果你发现自己经常执行相同的任务，那么很可能值得为此编写一个函数。这个任务可能涉及多个部分，也可能很小。例如，在心理学中，通常需要报告连续变量在\"\
  高\"和\"低\"水平上的值，这些水平通常定义为均值 +/- 1 个标准差。在 R 中，使用 `mean()` 和 `sd()` 函数可以轻松完成。如果你经常这样做，可能值得编写一个简短的单行函数，这样你就不用输入\
  \ `mean(x) + sd(x)`，而只需输入 `msd(x)`，或者你给函数起的任何名字。如果你对使用和编写函数感到不熟悉，在进入第 5 章和第 6 章之前进行更多练习将是个好主意，因为这两章假设你已经熟悉函数。\n\
  \n"
- "# 编写类与方法\n\n让函数根据传入对象的类型表现出不同的行为通常是很有帮助的。例如，在汇总变量时，为数值型或字符串型数据创建不同的汇总是有意义的。可以为每种对象类型使用不同的函数，但这样用户就需要记住很多函数名，并且为了保持唯一性，函数名可能会更长。面向对象编程（OOP）基于对象，在\
  \ R（与大多数编程语言一样）中通过两个概念实现：类和方法。类定义了一个模板或蓝图，描述对象的变量和特征，并确定哪些方法适用于它。例如，房子可以被定义为有地板、四面墙、一个屋顶和一扇门。具体的数据表示这些属性，例如每面墙的尺寸和颜色。方法是可以在特定对象类型上执行的行为或动作。例如，房子可以被粉刷（改变其颜色），但房子不能被吃掉。R\
  \ 有三种面向对象系统：S3、S4 和 R5。本章涵盖了最常用的 S3 和 S4 系统。\n\n在本章中，我们使用 `ggplot2` R 包（Wickham,\
  \ 2009）。以下代码加载 `checkpoint`（Microsoft Corporation, 2016）包以控制所用 R 包的确切版本，然后加载 `ggplot2`\
  \ 包：\n\n```\nlibrary(checkpoint)\ncheckpoint(\"2016-09-04\", R.version = \"3.3.1\"\
  )\nlibrary(ggplot2)\noptions(width = 70)\n```\n\n## S3 系统\n\nS3 系统是最常见的面向对象系统。它也是最容易上手且最简单的系统。S3\
  \ 系统易于使用，部分原因在于它相当非正式，且主要关注函数或方法。这些优点也是其局限性，因为 S3 系统没有提供正式的框架来确保对象满足类的要求。关于使用 S3\
  \ 系统进行 R 编程的更深入指南，请参阅 W.N. Venables 和 B.D. Ripley 的 *S Programming*（Springer, 2004）。\n\
  \n\n\n### S3 类\n\n在 R 语言中，默认提供某些类型的对象或类，几乎所有对象都可以看作是向量或泛型向量。例如，矩阵和数组本质上是带有维度属性的向量。列表是泛型向量，其中向量的每个元素都可以包含另一个向量。数据框是列表，其中每个项目都是一个向量，但所有向量的长度都相同，因此具有表格格式。向量可以保存特定类型的数据，例如逻辑值、整数、数值（实数）或字符串。这些基本对象和类由基础包提供。S3\
  \ 类是在基础包提供的对象和类之上构建创建的。\n\n> 注意\n>\n> S3 类是通过使用常规的 R 对象（例如向量或列表）和类（例如逻辑类或数值类）创建的。通过\
  \ `class(object) <- \"class name\"` 设置类名来定义 S3 类。S3 对象的元素通常通过使用 `` `$` ``、`` `[`\
  \ `` 或 `` `[[` `` 来访问。\n\nS3 类的实际创建很简单。首先，创建一个满足该类要求或特性的 R 对象，然后通过用类名标记该对象来定义 S3\
  \ 类。由于 S3 类与其他 R 对象的唯一区别在于具有特殊的名称或属性，因此它们使用与其他基本 R 对象相同的方式来访问和操作，即使用 `` `$` ``、``\
  \ `[` `` 和 `` `[[` ``。要检查对象的类，我们可以使用 `class()` 函数。在以下示例中，查询 `mtcars` 对象以确定它具有数据框类：\n\
  \n```\nclass(mtcars)\n[1] \"data.frame\"\n```\n\n要查看如何设置对象的类，我们可以查看基础 R 中的许多函数，例如\
  \ `table()`。在这里，我们打印 `table()` 函数的源代码，为了节省空间省略了中间部分：\n\n```\ntable\nfunction (...,\
  \ exclude = if (useNA == \"no\") c(NA, NaN), useNA = c(\"no\",\n\"ifany\", \"always\"\
  ), dnn = list.names(...), deparse.level = 1)\n{\n[为节省空间省略]\ny\n```\n\n最后返回的对象 `y`\
  \ 是一个数组，但具有 `table` 类。对象类的设置使用了惯用法 `class(object) <- \"class name\"`。也可以为一个对象分配多个类。这几乎与分配单个类的方式相同，并且按优先级顺序进行。以下示例将调用\
  \ `table()` 的结果存储在对象 `x` 中，然后设置两个类，首先是 `newclass`，然后是原始的 `table` 类：\n\n```\nx <-\
  \ table(mtcars$cyl)\nclass(x) <- c(\"newclass\", \"table\")\nclass(x)\n[1] \"newclass\"\
  \ \"table\"\n```\n\n分配多个类的价值在于作为一种备份，主要用于方法。例如，如果你创建了一个作为表格或数据框变体的新类，你可能会为打印编写专用方法，但对于其他函数（例如绘图或摘要），则依赖于原始类的方法。\n\
  \n你可以编写的类类型几乎是无限的。一个简单的入门方法是创建现有类的特殊或增强情况。在以下示例中，我们创建了一个数据框的特殊情况，具有 x 和 y 坐标以及文本标签，称为\
  \ `textplot`。“创建”该类的最简单方法是创建一个数据框，然后更改其类。如果我们只使用新的类标签，调用 `print()` 函数将使用默认方法，但如果我们先用新的\
  \ `textplot` 标签标记它，其次再标记为数据框，那么调用 `print()` 则会回退到数据框的方法：\n\n```\nd <- data.frame(\n\
  \  x = c(1, 3, 5),\n  y = c(1, 2, 4),\n  labels = c(\"First\", \"Second\", \"Third\"\
  )\n)\nclass(d) <- \"textplot\"\nprint(d)\n$x\n[1] 1 3 5\n$y\n[1] 1 2 4\n$labels\n\
  [1] First  Second Third\n  Levels: First Second Third\n  attr(,\"row.names\")\n\
  [1] 1 2 3\n  attr(,\"class\")\n[1] \"textplot\"\nclass(d) <- c(\"textplot\", \"\
  data.frame\")\nprint(d)\n  x y labels\n1 1 1  First\n2 3 2 Second\n3 5 4  Third\n\
  ```\n\n在 S3 系统中，没有正式的方法来从特定类创建对象。然而，创建特定类对象的最常见方式是作为函数的输出。可以编写专用函数来创建特定类的对象，或者编写执行操作并以特定类对象输出结果的函数。后一种方法在使用\
  \ S3 系统时在 R 中更为典型。\n\n当你创建一个新类时，一些期望的特性或元素可能已经存在于现有类中。如果是这种情况，基于现有类进行构建或扩展可能是有意义的。例如，数据框基于列表构建，要求列表的每个元素都是长度相等的向量。同样，我们之前创建的\
  \ `textplot` 类基于数据框构建，要求具有名为 `x`、`y` 和 `labels` 的三个元素。在这种情况下，我们会说 `textplot` 继承自\
  \ `data.frame`。也就是说，`textplot` 是父类 `data.frame` 的子类（注意，父类也称为超类或基类）。如果一个类只继承自另一个类，则称为单继承（即，它只有一个父类）。如果一个类继承自多个类，则称为多继承（即，它有多个父类）。如果一个类继承自另一个类，它可能会继承存储数据的特性，也可能继承方法——即对特定类对象进行操作的函数。继承方法对于避免重复造轮子尤其有用。\n\
  \n> 注意\n>\n> 继承是指通过基于现有类的特性和方法创建新类。新类被称为子类，而新类派生自的类被称为父类或超类。子类既可以继承父类的特性，也可以使用父类的方法。\n\
  \n在下一个例子中，我们编写一个小函数，使用公式接口从数据框构建 `textplot` 对象。该函数有两个参数：称为 `f` 的公式和称为 `d` 的数据。代码的第一部分使用第\
  \ 4 章介绍的 `stopifnot()` 函数来检查传递给函数的对象的类是否符合预期。为了测试类，我们使用 `inherits()` 函数，该函数评估特定对象是否是指定类的实例或是否继承自指定类。例如，我们的\
  \ `textplot` 类是其次是一个数据框，因此使用 `inherits(object, \"data.frame\")` 进行测试将评估为 `TRUE`。当我们构建\
  \ S4 类时，我们将看到更正式的类继承定义和系统。函数的下一部分按顺序从指定的数据框获取公式中的所有变量，重命名列，应用我们的 `textplot` 类，并返回对象：\n\
  \n```\ntextplot_data <- function(f, d) {\n  stopifnot(inherits(d, \"data.frame\"\
  ))\n  stopifnot(inherits(f, \"formula\"))\n  newdata <- get_all_vars(formula = f,\
  \ data = d)\n  colnames(newdata) <- c(\"y\", \"x\", \"labels\")\n  class(newdata)\
  \ <- c(\"textplot\", \"data.frame\")\n  return(newdata)\n}\n## 使用示例\ntextplot_data(f\
  \ = mpg ~ hp | cyl, d = mtcars[1:10, ])\n                    y   x labels\nMazda\
  \ RX4         21.0 110      6\nMazda RX4 Wag     21.0 110      6\nDatsun 710   \
  \     22.8  93      4\nHornet 4 Drive    21.4 110      6\nHornet Sportabout 18.7\
  \ 175      8\nValiant           18.1 105      6\nDuster 360        14.3 245    \
  \  8\nMerc 240D         24.4  62      4\nMerc 230          22.8  95      4\nMerc\
  \ 280          19.2 123      6\n```\n\n这些示例展示了使用 S3 系统创建类是多么容易。接下来，我们将探讨如何为现有或新类编写方法。\n\
  \n\n\n### S3 方法\n\n方法是可在特定类别的对象上执行的函数或操作。即使你不编写自己的类，也可以编写自己的方法。编写 S3 方法与我们在第 4 章中编写函数的方式相似。唯一的区别在于\
  \ S3 方法遵循特殊的命名约定，并且需要一个面向用户的泛型函数，该函数负责将调用分派到适当的方法。\n\n注意\nS3 方法是遵循特定命名约定的常规 R 函数：`foo.classname()`。用户调用泛型函数`foo()`，该函数根据传入参数对象的类别分派到相应的方法。如果泛型函数不存在，则需要编写一个包含对`UseMethod()`调用的泛型函数，后者负责实际的方法分派。\n\
  \n首先，让我们为我们创建的`textplot`对象类编写一个简单的绘图方法。要创建 S3 绘图方法，我们使用函数名（这里是`plot`）后跟类名，即遵循`function.classname()`模式，在本例中就是`plot.textplot()`。只要函数以此方式命名，并且存在一个泛型函数`plot()`（我们稍后讨论），它就能作为\
  \ S3 方法工作。\n\n我们的绘图函数如下方代码所示。对`par()`函数的调用调整了图形的默认边距，以减少图形顶部和右侧的留白。结果存储在对象`op`中，因为它保存了原始的图形参数。然后，在函数退出时，通过调用`par(op)`来恢复用户原始的图形参数状态，这是你在第\
  \ 4 章中学到的模式。接着，我们通过调用`plot.new()`创建一个新的绘图区域，并通过调用`plot.window()`根据数据的范围设置新绘图的 x\
  \ 轴和 y 轴限制来确定其尺寸。随后，我们使用接受坐标和标签的`text()`函数来绘制标签。最后，我们在底部（`side = 1`）和左侧（`side =\
  \ 2`）添加坐标轴。原始的`textplot`数据对象在结尾被隐式地返回。\n\n```r\nplot.textplot <- function(d) {\n\
  op <- par(mar = c(4, 4, 1, 1))\non.exit(par(op))\nplot.new()\nplot.window(xlim =\
  \ range(d$x, na.rm = TRUE),\nylim = range(d$y, na.rm = TRUE))\ntext(d$x, d$y, labels\
  \ = d$labels)\naxis(side = 1, range(d$x, na.rm = TRUE))\naxis(side = 2, range(d$y,\
  \ na.rm = TRUE))\ninvisible(d)\n}\n```\n\n接下来，我们需要创建一些数据然后`plot()`它。请注意，因为它是一个方法，我们不需要通过全名`plot.textplot()`来调用我们的函数。我们可以直接调用`plot()`，R\
  \ 会根据对象的类别`textplot`自动将数据对象分派给正确的方法。结果如图 5-1 所示，代码如下：\n\n![A393929_1_En_5_Fig1_HTML.jpg](img/A393929_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1.\n在指定坐标处绘制文本标签的图，展示了为自定义类使用自定义方法\n\n```r\ndat <- textplot_data(f = mpg ∼\
  \ hp | cyl, d = mtcars[1:10, ])\nplot(dat)\n```\n\n这个例子展示了使用 S3 系统是多么简单。几乎不需要特殊的函数或额外的努力。只需按你希望的方式创建一个常规的\
  \ R 对象，添加一个自定义的类标签，编写一个函数，并赋予它一个特殊的名称——基本上这就是所需的全部。然而，S3 方法有一些特殊的函数和工具。首先，让我们看看查看`plot()`源代码时会发生什么。这个泛型函数只包含三个参数。函数体仅包含一个对`UseMethod()`的调用，这正是告诉\
  \ R 检查参数类别并分派到适当方法的部分。如果你正在编写方法但相应的泛型函数不存在，你还需要编写这个泛型函数。在 S3 系统中编写泛型函数是一个直接的任务，主要考虑的是默认应包含哪些参数：\n\
  \n```r\nplot\nfunction (x, y, ...)\nUseMethod(\"plot\")\n```\n\n要查看可用的方法，我们使用`methods()`函数。结果显示`plot()`有许多特定的方法可用，包括我们新编写的`plot.textplot`：\n\
  \n```r\nmethods(plot)\n[1] plot,ANY-method               plot,color-method\n[为节省空间省略]\n\
  [71] plot.table*                   plot.textplot\n[为节省空间省略]\n[81] plot.varclus \
  \                 plot.xyVector*\nsee '?methods' for accessing help and source code\n\
  ```\n\n有些函数后面跟着星号，表示这些方法不是公开的或者无法直接访问，例如`plot.table()`。例如，如果我们输入它的名字，会得到一个错误，提示找不到它：\n\
  \n```r\nplot.table\nError: object 'plot.table' not found\n```\n\n注意\n`::`运算符用于引用特定包中公开导出的函数，主要用于当多个包导出同名函数时：`package::foo()`。`:::`运算符用于访问包命名空间中未导出的函数。使用非公共函数时要小心，因为它们可能在没有通知的情况下发生变化。\n\
  \n非公开或未从包命名空间导出的函数仍可以作为方法访问。这些函数也可以通过指定它们来自哪个包并使用`:::`运算符直接访问，从而查看函数源代码：\n\n```r\n\
  graphics:::plot.table\nfunction (x, type = \"h\", ylim = c(0, max(x)), lwd = 2,\
  \ xlab = NULL,\nylab = NULL, frame.plot = is.num, ...)\n{\nxnam\n```\n\n除了为新类编写方法外，有时为现有类编写方法也很有帮助。例如，流行的`ggplot2`包没有为处理线性模型或回归对象提供默认的方法。首先，我们使用内置的`mtcars`数据建立一个简单的回归模型。然后，我们通过`hp`、`vs`、它们的交互作用（通过`hp\
  \ * vs`创建，这扩展为两个主效应及其交互项或乘积项）以及通过`factor()`调用进行虚拟编码的`cyl`来预测`mpg`。结果如下，通过调用`summary()`方法显示：\n\
  \n```r\nm |t|)\n(Intercept)  26.92908    2.71758   9.909 2.56e-10 ***\nhp      \
  \     -0.01519    0.01554  -0.978  0.33718\nvs            8.53352    4.95297   1.723\
  \  0.09678 .\nfactor(cyl)6 -4.21121    1.93887  -2.172  0.03916 *\nfactor(cyl)8\
  \ -8.65096    2.69738  -3.207  0.00354 **\nhp:vs        -0.09101    0.04363  -2.086\
  \  0.04692 *\n\nSignif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n\
  Residual standard error: 3.007 on 26 degrees of freedom\nMultiple R-squared:  0.7913,\
  \  Adjusted R-squared:  0.7511\nF-statistic: 19.71 on 5 and 26 DF,  p-value: 4.181e-08\n\
  ```\n\n我们可以检查对象的类别，并使用以下代码查看当前是否存在`ggplot()`方法：\n\n```r\nclass(m)\n[1] \"lm\"\n\
  methods(ggplot)\n[1] ggplot.data.frame* ggplot.default*    ggplot.summaryP\n[4]\
  \ ggplot.transcan\nsee '?methods' for accessing help and source code\n```\n\n虽然`fortify()`函数有一个针对线性模型的方法，可以创建一个适合与`ggplot()`一起使用的数据框，但它只提取原始数据、拟合值和残差。为了展示模型的效果，绘制一个变量在其他变量保持在特定值时的预测值函数图会很有帮助。下面的方法实现了一个系统来做到这一点。\n\
  \n\n\n"
- '# ggplot.lm 方法


  该方法采用与 `ggplot()` 相同的基本参数，但增加了 `vars` 参数。模型中使用的每个变量都通过一组特定的值来传递以进行预测。通过使用 `do.call()`
  函数将这些列表作为参数传递给 `expand.grid()` 函数，创建所有这些可能组合。然后从模型公式中提取因变量 `yvar` 并转换为字符。生成新的预测值及其标准误。基于拟合值（或预测值）和正态分位数乘以拟合标准误，计算
  95% 置信区间的下限 `LL` 和上限 `UL`。最后，将列名从 `fit` 更改为因变量的实际名称，然后将用于预测的数据和预测值合并到一个新的数据框中。此数据框被传递给
  `ggplot()`，它会分派到数据框的 `ggplot()` 方法。


  ```

  ggplot.lm <- function(data, mapping, vars, ...) {

  newdat <- do.call(expand.grid, vars)

  yvar <- as.character(formula(data)[[2]])

  d <- as.data.frame(predict(data, newdata = newdat, se.fit = TRUE))

  d <- within(d, {

  LL <- fit + qnorm(.025) * se.fit

  UL <- fit + qnorm(.975) * se.fit

  })

  colnames(d)[1] <- yvar

  data <- cbind(newdat, d[, c(yvar, "LL", "UL")])

  ggplot(data = data, mapping = mapping, ...)

  }

  ```


  有了这个方法后，我们可以轻松地从线性回归模型生成图形。以下代码使用我们的新方法，指定预测变量的具体值，通过 `geom_line()` 添加线条，并使用 `theme_bw()`
  黑白主题。结果如图 5-2 所示；代码如下：


  ![A393929_1_En_5_Fig2_HTML.jpg](img/A393929_1_En_5_Fig2_HTML.jpg)


  图 5-2.

  使用 `ggplot.lm()` 方法得到的模型预测回归线


  ```

  ggplot(m, aes(hp, mpg), vars = list(

  hp = min(mtcars$hp):max(mtcars$hp),

  vs = mean(mtcars$vs),

  cyl = 8)) +

  geom_line(size=2) +

  theme_bw()

  ```


  由于我们的方法中通过 `expand.grid()` 创建了预测器值的所有可能组合，我们可以生成多条预测线，例如将 `vs` 分别保持在 `0` 和 `1`，如下例代码和图
  5-3 所示：


  ![A393929_1_En_5_Fig3_HTML.jpg](img/A393929_1_En_5_Fig3_HTML.jpg)


  图 5-3.

  使用 `ggplot.lm()` 方法得到的模型预测回归线及置信区间


  ```

  ggplot(m, aes(hp, mpg, linetype = factor(vs), group = factor(vs)), vars = list(

  hp = min(mtcars$hp):max(mtcars$hp),

  vs = c(0, 1),

  cyl = 8)) +

  geom_ribbon(aes(ymin = LL, ymax = UL), alpha = .25) +

  geom_line(size=2) +

  theme_bw()

  ```


  这些示例简要介绍了在编写新的类和方法或扩展现有类和方法时可以完成的工作。由于 S3 系统是 R 中最常用的系统，它可能是最重要的系统；它可以广泛应用并且可以扩展许多类别的对象。


  ## S4 系统


  与 S3 系统相比，S4 系统是一个**正式**的系统。这种形式化的好处是能够更大程度地确保特定类的对象完全符合预期。形式化的缺点则是复杂性更高：需要更多的函数来设置类和方法，并且在编程中要求更严格。S3
  系统允许编写快速且非正式的代码，而 S4 系统则需要更仔细的规划并带来更高的开销。


  对象有三个组成部分：类、槽和方法。对象的名称和结构——它包含什么——就是类。存储在对象中的变量或其他对象是槽。最后，可以对该对象进行操作的函数就是它的方法。在本节中，我们将逐一介绍这些组成部分。关于
  S4 系统的进一步阅读，一个极好的指南是 John Chambers 所著的《*Software for Data Analysis: Programming
  with R*》（Springer，2010）。


  ### S4 类


  由于 S4 类更加正式，在编写新类之前需要进行规划。与 S3 类不同，在 S4 中必须指定要包含的每个变量的名称和类型。之前我们使用 S3 系统定义了一个类 `textplot`。我们可以使用
  S4 系统定义相同的类。`x` 和 `y` 参数都应为数值类型，`labels` 参数应为字符串。我们还知道所有参数的长度应该相同。最后，我们可能希望断言虽然可以存在缺失的标签，但不允许出现空标签。所有这些都需要提前考虑和指定——因为虽然在
  S3 系统中无法控制这些，但在 S4 系统中我们可以在创建类时定义所有内容。要创建第一个 S4 类，我们使用 `setClass()` 函数，如下例所示。并非每个参数都是必需的，但在定义新类时，尽可能明确被认为是良好的实践。


  #### 注意


  S4 类通过调用 `setClass()` 创建。`Class` 和 `slots` 参数是必需的。类名指定为字符串，槽（存放变量）定义为命名的字符向量；名称对应槽名，值对应每个槽的类。可以通过
  `prototype` 参数指定一个"空"对象，并通过向 `validity` 参数传递一个函数来设置有效性检查。


  第一个参数 `Class` 提供类的名称。接下来，使用一个命名向量定义 `slots`，其中名称表示槽名，值表示每个槽的类型。`prototype` 参数不是必需的，但定义它很有帮助，因为它决定了如何创建"空"对象，或者在未指定具体数据时如何创建该类的对象。`validity`
  参数也不是必需的，但允许运行显式检查以确保对象符合预期。R 默认确保传递给槽的对象具有适当的类型，但可以添加许多其他测试和有效性检查，以减少创建不符合预期工作对象的机会。以下是
  `setClass()` 示例：


  ```

  setClass(

  Class = "textplot",

  slots = c(

  x = "numeric",

  y = "numeric",

  labels = "character"),

  prototype = list(

  x = numeric(0),

  y = numeric(0),

  labels = character(0)),

  validity = function(object) {

  stopifnot(

  length(object@x) == length(object@y),

  length(object@x) == length(object@labels))

  if (!all(nchar(object@labels) > 0, na.rm = TRUE)) {

  stop("All labels must be missing or non zero length characters")

  }

  return(TRUE)

  }

  )

  ```


  要在 S4 系统中创建特定类的新对象，我们使用 `new()` 函数。在下面的代码中，我们检查了三次创建新对象的尝试。首先，我们创建了一个正确且有效的对象。然后，我们看看如果尝试使用错误类型的参数会发生什么。最后，我们看一个测试我们创建的有效性函数的例子。


  ```

  new("textplot",

  x = c(1, 3, 5),

  y = c(1, 2, 4),

  labels = c("First", "Second", "Third"))

  An object of class "textplot"

  Slot "x":

  [1] 1 3 5

  Slot "y":

  [1] 1 2 4

  Slot "labels":

  [1] "First"  "Second" "Third"

  new("textplot",

  x = c(1, 3, 5),

  y = c(1, 2, 4),

  labels = 1:3)

  Error in validObject(.Object) :

  invalid class "textplot" object: invalid object for slot "labels" in class "textplot":
  got class "integer", should be or extend class "character"

  new("textplot",

  x = c(1, 3, 5),

  y = c(1, 2, 4),

  labels = c("First", "Second", ""))

  Error in validityMethod(object) (from #16) :

  All labels must be missing or non zero length characters

  ```




  #### 定义类时的有效性检查与错误信息优化


  如果使用 S3 系统定义类，这些错误就不会发生，因为 S3 既不进行类型检查，也不进行有效性检查。前面的例子中，每次尝试创建新对象最多只有一个错误。下面的例子则包含两个错误：传递给`y`槽位的向量长度与其他两个不匹配，并且存在一个零长度的字符标签。然而，按照目前的写法，只有第一个错误会被捕获，因为一旦发现问题，有效性函数就会停止：


  ```

  new("textplot",

  x = c(1, 3, 5),

  y = c(1, 2),

  labels = c("First", "Second", ""))

  Error: length(object@x) == length(object@y) is not TRUE

  ```


  另一种编写有效性函数的方法是，不针对每个问题抛出错误，而是收集它们并在最后一次性返回所有错误。在修订有效性函数时，我们还可以考虑如何使错误信息更具参考价值。目前的错误信息虽然能让人看出问题所在，但可能不够精确。例如，很明显长度不相等，但到底是`x`太长还是`y`太短？修订后的类定义代码实现了这一点。


  然而，在深入改进有效性函数之前，我们需要简要了解如何在 R 中创建和格式化字符串。


  首先，在编写文本时，可以通过包含特殊字符`\n`来插入换行符。为了查看示例，我们使用`cat()`函数（`cat`代表“连接并打印”），它将文本输出到 R 控制台（如果指定了文件，则输出到其他位置）。以下两个例子完全相同，除了第二个例子中`a`和`b`之间有换行符：


  ```

  cat("ab", fill = TRUE)

  ab

  cat("a\nb", fill = TRUE)

  a

  b

  ```


  一个常用的函数是`paste()`，它可以组合或折叠向量。下面的第一个例子展示了组合功能。通过使用`sep`参数定义的连接符（在我们的例子中是空字符串）将两个向量组合起来。在第二个例子中，包含多个元素的单个向量被折叠成一个单独的字符串。向量元素如何合并为一个字符串由`collapse`参数决定——在我们的例子中，就是换行符。


  ```

  paste(c("a", "b"), c(1, 2), sep = "")

  [1] "a1" "b2"

  paste(c("a", "b"), collapse = "\n")

  [1] "a\nb"

  ```


  在编写有效性检查函数时，这些函数非常有用，因为它们允许我们将多个错误合并成一个字符串，并在需要时使用换行符分隔。


  我们使用的另一个关键函数是`sprintf()`。它的第一个参数是一个用户定义的字符串，其中包含应以百分比符号（`%`）开头的特殊符号，用于指示值应替换的位置。随后的参数是要替换的值。举例可能是展示其用法最清晰的方式。这里，`%d`用于指示要替换一个整数，然后
  R 会依次替换 98、80 和 75。替换的顺序就是出现的顺序。


  ```

  sprintf("First (%d), Second (%d), Third (%d)", 98, 80, 75)

  [1] "First (98), Second (80), Third (75)"

  ```


  常用的格式选项有：`%d`表示整数，`%f`表示定点小数，`%s`表示字符串，`%%`表示字面量百分号。下一个示例演示了每种用法，更多文档可参阅帮助页面`?sprintf`。对于数值，我们使用`0.2`来指定数字应四舍五入到两位小数。


  ```

  sprintf("Integer %d, Numeric %0.2f, String %s, They won by 58%%", 5, 3.141593, "some
  text")

  [1] "Integer 5, Numeric 3.14, String some text, They won by 58%"

  ```


  掌握了`paste()`和`sprintf()`，我们就可以修改`textplot`类的有效性函数，以提供更具参考价值的错误信息，并且运行所有检查，沿途收集错误，最后一次性返回所有错误。


  最后一个注意事项：之前，我们使用惯用语`new("classname", arguments)`来创建特定类的新对象。虽然这完全可以接受，但有一个快捷方式。`setClass()`函数的主要作用是定义一个新类（副作用），但它也会隐式地返回一个构造函数。如果我们保存调用`setClass()`的结果——按照惯例，保存在一个与类同名的对象中——我们就可以使用得到的对象来创建该类的新实例：


  ```

  textplot <- setClass(...)

  ```


  ##### 修订后的类定义


  以下是修订后的`textplot`类定义，包含一个改进的有效性函数：


  ```

  setClass("textplot",

  slots = list(

  x = "numeric",

  y = "numeric",

  labels = "character"

  ),

  validity = function(object) {

  errors <- character()

  if (length(object@x) != length(object@y)) {

  errors <- c(errors, sprintf(

  "x (length %d) and y (length %d) are not equal",

  length(object@x), length(object@y)))

  }

  if (!all(nchar(object@labels) > 0, na.rm = TRUE)) {

  errors <- c(errors, sprintf(

  "%d label(s) are zero length. All labels must be missing or non zero length",

  sum(nchar(object@labels) == 0, na.rm = TRUE)))

  }

  if (length(errors)) {

  stop(paste(c("\n", errors), collapse = "\n"))

  } else {

  return(TRUE)

  }

  }

  )

  ```


  现在，当我们创建具有多个问题的相同对象时，我们获得了更多信息，并且节省了一些输入。我们可以看到`x`和`y`的长度，并且了解到标签也有问题：


  ```

  textplot(

  x = c(1, 3, 5),

  y = c(1, 2),

  labels = c("First", "Second", ""))

  Error in validityMethod(object) (from #30) :

  x (length 3) and y (length 2) are not equal

  1 label(s) are zero length. All labels must be missing or non zero length

  ```




  ### S4 类继承


  到目前为止，你已经了解了如何定义新的 S4 类。可能仍然感觉使用 S4 系统比 S3 系统需要更多的工作，但除了更正式的有效性验证和错误检查之外，似乎好处不多。S4
  系统的一个强大特性就是**继承**。


  S4 类可以通过调用 `setClass()` 并添加参数 `contains = "要继承的 S4 类"` 来继承现有的 S4 类。现有的槽（slot）、原型（prototype）和有效性检查都会被继承。在新的
  `setClass()` 调用中，只需要指定新的槽以及相应的原型/有效性检查。


  我们之前创建了一个简单的 `textplot` 类。现在假设，尽管有时我们简单的类就足够了，但有时我们可能需要更多功能。例如，有时我们可能希望深入数据，根据某个分组变量为数据的不同子集创建一个多面板图形。为此，我们需要一个
  `groupedtextplot` 类。然而，我们唯一需要额外存储的数据就是一个额外的槽。一种选择是复制并粘贴旧代码，然后按需修改。在本节中，我们将探讨如何使用继承来重用和扩展现有类。当一个类继承另一个类时，前一个类的所有槽以及有效性检查都会被继承。接下来，我们创建我们的
  `groupedtextplot` 类。这与创建一个新类类似，但我们只定义新的槽，然后通过使用参数 `contains` 来指定继承关系。由于有效性检查也被继承，我们只需要为新槽指定有效性检查。


  ```

  groupedtextplot <- setClass(

  Class = "groupedtextplot",

  slots = c(

  group = "factor"),

  prototype = list(

  group = factor()),

  contains = "textplot",

  validity = function(object) {

  if (length(object@x) != length(object@group)) {

  stop(sprintf("x (length %d) and group (length %d) are not equal",

  length(object@x), length(object@group)))

  }

  return(TRUE)

  }

  )

  ```


  通过这么少的代码，我们就可以使用新类了。以下两个例子中，第一个展示了正确创建的新对象，后者展示了当我们尝试创建一个无效对象时熟悉的错误信息：


  ```

  gdat <- groupedtextplot(

  group = factor(c(1, 1, 1, 1, 2, 2, 2, 2)),

  x = 1:8,

  y = c(1, 3, 4, 2, 6, 8, 7, 10),

  labels = letters[1:8])

  gdat

  An object of class "groupedtextplot"

  Slot "group":

  [1] 1 1 1 1 2 2 2 2

  Levels: 1 2

  Slot "x":

  [1] 1 2 3 4 5 6 7 8

  Slot "y":

  [1]  1  3  4  2  6  8  7 10

  Slot "labels":

  [1] "a" "b" "c" "d" "e" "f" "g" "h"

  groupedtextplot(

  group = factor(c(1, 1, 1, 1, 2, 2, 2, 2)),

  x = 1:8,

  y = c(1, 3, 4, 2, 6, 8, 7),

  labels = c(letters[1:7], ""))

  Error in validityMethod(as(object, superClass)) (from #30) :

  x (length 8) and y (length 7) are not equal

  1 label(s) are zero length. All labels must be missing or non zero length

  ```


  在这种情况下，`textplot` 被称为**父类**，而 `groupedtextplot` 被称为**子类**。这种关系可以用图表表示（对于复杂的继承关系，图表有时很有帮助）。按照惯例，关系以箭头从子类指向父类的方式图形化表示，例如
  `textplot <- groupedtextplot`。同样按照惯例，父类通常在左侧，或者如果从上到下绘图，则在顶部。尽管本书只涉及从单个父类继承，但类可以从多个父类继承，而这些父类又可以继承自它们的父类，依此类推。在这些情况下，视觉图表特别有用。使用继承而不是编写一个全新的类的另一个好处是，方法也会被继承。这意味着我们可以重用父类的槽以及为父类编写的方法，这是我们将在下一节讨论的主题。


  ### S4 方法


  除了你之前看到的 `methods()` 函数可以显示给定函数可用的方法之外，在 S4 系统中，我们还可以使用 `showMethods()` 来查找方法。由于更正式的类系统，`showMethods()`
  可用于显示特定函数的所有方法，或者通过使用参数 `classes = "类名"` 来显示特定类的所有方法（针对任何函数）。如果你正在处理一个新类，并想知道已经编写了哪些方法且可用，这会很有帮助。


  可用的 S4 方法可以通过 `showMethods("泛型函数")` 来检查。新的 S4 方法通过调用 `setMethod()` 来定义。主要的三个参数是
  `f`、`signature` 和 `definition`，分别包含泛型函数的名称（字符串）、将分派到此方法的 S4 类名（字符串）以及作为实际方法的函数。


  要在 S3 系统中编写新方法，我们只需按照特殊的命名约定编写函数。要定义 S4 方法，我们使用函数 `setMethod()`。当然，可以为现有类编写新方法，也可以为新类编写方法。对于新类，需要为
  `show()` 编写一个方法。当在控制台简单地键入一个对象时，R 会通过调用 `show()` 来显示它。如果没有为新类定义 `show()` 方法，默认打印会很难看，就像你在我们之前的例子中看到的那样。


  在下面的代码中，我们为 `textplot` 类定义了一个新方法。第一个参数是我们为其创建方法的函数名。下一个参数，签名（signature），是类名。在这种情况下，因为
  `show()` 只接受一个参数，所以只需要指定一个类名。对于具有多个参数的函数，签名可能变得更加复杂，根据多个参数的类不同，会有不同的方法。最后，我们编写我们的函数，即方法的定义。代码相对简单，使用
  `cat()` 函数来显示值。参数 `fill = TRUE` 的效果是添加换行符，使每一行都以 `X:` 或变量标签开始，然后是值。`head()` 函数用于获取最多前五个值，如果值较少则获取更少。


  ```

  setMethod(

  f = "show",

  signature = "textplot",

  definition = function(object) {

  cat("     X: ")

  cat(head(object@x, 5), fill = TRUE)

  cat("     Y: ")

  cat(head(object@y, 5), fill = TRUE)

  cat("Labels: ")

  cat(head(object@labels, 5), fill = TRUE)

  })

  [1] "show"

  ```


  R 回显了我们刚刚为其创建了方法的泛型函数 `show()` 的名称。现在，当我们创建一个 `textplot` 类对象时，会得到一些更美观的输出：


  ```

  dat <- textplot(

  x = 1:4,

  y = c(1, 3, 5, 2),

  labels = letters[1:4])

  dat

  X: 1 2 3 4

  Y: 1 3 5 2

  Labels: a b c d

  ```


  一旦我们开始定义方法，类继承的好处就变得更大了。因为 `groupedtextplot` 继承自 `textplot`，如果没有为 `groupedtextplot`
  定义方法，并且 `textplot` 有可用的方法，那么它会回退到 `textplot` 的方法。虽然不完美（因为未显示分组信息），但这仍然比默认输出要好：


  ```

  gdat

  X: 1 2 3 4 5

  Y: 1 3 4 2 6

  Labels: a b c d e

  ```


  接下来，我们为 `[` 函数定义一个方法，该函数用于数据子集化。这个函数更复杂，因为我们必须构建一个逻辑树，允许多种可能的参数组合。函数的第一个参数 `x` 是要进行子集化的对象。按照惯例，`i`
  指行或观测，`j` 指列或变量。如果只有 `i` 没有缺失（即指定了行或观测），通常包含所有变量。如果只指定了 `j`（变量），通常包含所有观测。如果两者都指定了，则只包含选定的变量和观测。这是通过使用一系列
  `if` 和 `else if` 语句来完成的。这里涉及三个新函数：




  #### `validObject()`、`slotNames()` 和 `slot()`


  *   `validObject()` 是一个泛型函数，用于对特定对象类执行有效性检查（如果存在的话）。

  *   `slotNames()` 返回一个字符向量，给出每个槽的名称。

  *   `slot()` 的功能类似于 `@` 操作符，但可以使用字符串按名称提取槽。


  方法设置完成后，展示了几个使用示例：


  ```

  setMethod(

  f = "[",

  signature = "textplot",

  definition = function(x, i, j, drop) {

  if (missing(i) & missing(j)) {

  out <- x

  validObject(out)

  } else if (!missing(i) & missing(j)) {

  out <- textplot(

  x = x@x[i],

  y = x@y[i],

  labels = x@labels[i])

  validObject(out)

  } else if (!missing(j)) {

  if (missing(i)) {

  i <- seq_along(x@x)

  }

  if (is.character(j)) {

  out <- lapply(j, function(n) {

  slot(x, n)[i]

  })

  names(out) <- j

  } else if (is.numeric(j)) {

  n <- slotNames(x)

  out <- lapply(j, function(k) {

  slot(x, n[j])[i]

  })

  names(out) <- n[j]

  } else {

  stop("j is not a valid type")

  }

  }

  return(out)

  })

  dat[]

  X: 1 2 3 4

  Y: 1 3 5 2

  Labels: a b c d

  dat[i = 1:2]

  X: 1 2

  Y: 1 3

  Labels: a b

  dat[j = 1]

  $x

  [1] 1 2 3 4

  dat[j = "y"]

  $y

  [1] 1 3 5 2

  dat[i = 1:2, j = c("x", "y")]

  $x

  [1] 1 2

  $y

  [1] 1 3

  ```


  为我们的 `textplot` 类定义了 `show` 和 `subsetting` 方法后，我们可以轻松地利用这些方法，通过按组循环遍历对象、子集化和显示每个子集，来为
  `groupedtextplot` 类创建一个 `show` 方法：


  ```

  setMethod(

  f = "show",

  signature = "groupedtextplot",

  definition = function(object) {

  n <- unique(object@group)

  i <- lapply(n, function(index) {

  cat("Group: ", index, fill = TRUE)

  show(object[which(object@group == index)])

  })

  })

  gdat

  Group:  1

  X: 1 2 3 4

  Y: 1 3 4 2

  Labels: a b c d

  Group:  2

  X: 5 6 7 8

  Y: 6 8 7 10

  Labels: e f g h

  ```


  ## 总结


  本章介绍了 R 中用于开发新类和新方法的 S3 和 S4 系统。特别是 S4 系统，可能非常复杂，涉及从多个父类继承以及针对多个参数类特化的方法。即使你在 R
  中使用和开发，也可能很少开发新的类，因为大多数数据类型已经有现成的类。然而，开发或扩展现有方法通常很有帮助，至少，理解类和方法的工作原理可以让你更容易地使用现有的类和函数。


  希望本章足以让你开始使用这些系统并了解它们的能力。表 5-1 描述了本章涉及的关键函数。在第 6 章中，我们将函数、类和方法捆绑在一起，制作我们自己的 R 包。重点是制作
  R 包，所以你不需要对类和方法非常熟悉。如果你的工作能从使用 S4 系统中受益，你可以从 John Chambers 的《How S4 Methods Work》（可在
  [`http://developer.r-project.org/howMethodsWork.pdf`](http://developer.r-project.org/howMethodsWork.pdf)
  在线获取）中获得更深入的介绍。如果你打算使用 S4 系统并需要进行深入研究，我们推荐《*Software for Data Analysis: Programming
  with R*》。另一本更侧重于通用 R 编程和较旧的 S3 系统的优秀书籍是《*S Programming*》。


  表 5-1. 本章描述的关键函数


  | 函数 | 功能描述 |

  | --- | --- |

  | `class()` | 返回对象的类（S3/S4）。 |

  | `inherits()` | 检查对象是否属于某个特定类或继承自该类。 |

  | `methods()` | 返回给定函数可用的方法列表。 |

  | `showMethods()` | 返回给定函数可用的方法列表；或者，如果使用 `classes` 参数，则返回给定类中任何函数可用的方法列表。 |

  | `:::` | 操作符，允许访问包中未导出（非公开）的函数。 |

  | `function.class()` | 命名 S3 方法的通用方案：使用函数名，后跟一个句点，再后跟应用该方法的对象类。 |

  | `setClass()` | 定义一个新的 S4 类。 |

  | `setMethod()` | 为特定 S4 类的特定函数定义一个方法。 |

  | `@` | 在 S4 系统中按名称访问对象中槽的低级方式，类似于其他 R 对象或 S3 类对象的 `$`。 |

  | `new()` | 创建一个指定类的新 S4 对象。 |

  | `paste()` | 将字符串粘贴在一起。可以操作多个向量，也可以将单个向量的所有元素合并在一起。 |

  | `sprintf()` | 格式化字符串，并允许将数字和其他字符串替换到定义的模板中。对于制作信息丰富的错误消息或其他给用户的消息很有用。 |

  | `show()` | 显示 R 对象的泛型函数。也是你在 R 控制台键入对象名称时默认调用的函数。 |

  | `` `[`() `` | 用于子集化数据或访问特定变量或行的操作符/泛型函数。在 S4 系统的新类中，必须定义方法，否则该函数不可用。 |

  | `head()` | 列出对象的前几个元素或行。 |

  | `validObject()` | 一个泛型函数，通过使用创建类时指定的有效性检查（如果有的话）来检查具有 S4 类的对象何时有效。创建对象时默认调用，但也可以在修改对象后显式调用，以检查其是否仍然有效。
  |

  | `slotNames()` | 返回 S4 类对象的所有槽名，类似于其他 R 对象或 S3 类对象的 `names()`。 |

  | `slot()` | 可用于访问 S4 对象的特定槽。 |


