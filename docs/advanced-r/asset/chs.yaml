  4         2.9          1.4         0.2  setosa\n5         2.3          1.3     \
  \    0.3  setosa\n\n# ... 还有 145 行\nselect(diris, -Sepal.Length, -Petal.Width)\n\
  \n# A tibble: 150 x 3\nSepal.Width Petal.Length Species\n\n1         3.0       \
  \   1.1  setosa\n2         3.2          1.3  setosa\n3         3.0          1.3\
