  \ j = c(\"x\", \"y\")]\n$x\n[1] 1 2\n$y\n[1] 1 3\n```\n\n在为我们定义的`textplot`类定义了`show`和`subsetting`方法后，我们可以通过按组循环对象、子集化并显示每个子集，轻松利用这些方法来为我们的`groupedtextplot`类编写一个`show`方法：\n\
  \n```\nsetMethod(\nf = \"show\",\nsignature = \"groupedtextplot\",\ndefinition =\
