  '
- "# 7. 使用 data.table 进行数据管理入门\n\n我们已经简要介绍过`data.table`包。这个包是本章的核心，涵盖了在广义的数据管理范畴下访问、编辑和处理数据的基础知识。虽然数据管理并不光鲜亮丽，但它是数据可视化或分析至关重要的第一步。此外，特定分析项目的大部分时间可能都花在数据管理上。例如，一旦数据清洗完毕并符合\
  \ R 中`lm()`函数所期望的格式，运行线性模型可能只需要一行代码。数据管理可能具有挑战性，因为原始数据有各种类型、形状和格式；数据缺失很常见；并且您可能还需要合并或融合不同的数据源。在本章中，我们将介绍处理数据管理的机械技巧和哲学思维。本章使用的所有包都已包含在我们的`checkpoint.R`文件中。因此，您只需执行该文件即可开始。\n\
  \n在本章中，我们使用`data.table` R 包（Dowle, Srinivasan, Short, and Lianoglou, 2015）。以下代码加载`checkpoint`包（Microsoft\
  \ Corporation, 2016）以控制所用 R 包的确切版本，然后加载`data.table`包：\n\n```\nlibrary(checkpoint)\n\
  checkpoint(\"2016-05-10\")\nlibrary(data.table)\n```\n\n\n\n```markdown\n# 加载检查点及所需包\n\
  \nlibrary(checkpoint)\ncheckpoint(\"2016-09-04\", R.version = \"3.3.1\")\nlibrary(data.table)\n\
  options(width = 70) # 每行仅显示 70 个字符\n\n# data.table 简介\n\n使用数据表（data table）而非内置的数据框（data\
  \ frame）类对象的好处之一是，数据表内存效率更高，操作和修改速度更快。`data.table` 包在很大程度上是通过在内存中就地修改数据表来实现这一点的，而对于数据框，R\
  \ 通常会对数据进行复制、修改然后存储。无论数据的所有列是否被更改，例如 100 列中的 1 列，都会发生完整的复制。因此，与数据表上的类似操作相比，对数据框的操作往往耗时更长，占用内存更多。为了展示数据管理的概念，我们使用小型数据，因此内存和处理器时间不是问题。然而，我们强调使用数据表而非数据框，是因为数据表能优雅地扩展到比数据框大得多的数据量。数据表还有其他优点，包括无需引用所有变量名，我们将在本章中展示这些优点。相比之下，数据框的主要优势在于它们属于\
  \ R 的基础部分，并且更多的人熟悉如何使用它们（例如，在分享代码时，这很有帮助）。\n\n数据表可以非常大。查看数据的 `head()` 和 `tail()`\
  \ 通常比查看全部数据更有帮助。在 R 中通过键入其名称显示数据表时，默认会返回前五行和最后五行。R 还默认打印七位有效数字，这可能会使我们的数值条目显得混乱。为了清晰起见，我们使用\
  \ `options()` 函数来控制一些全局选项，以便只打印前三行和后三行（如果数据表总行数超过 20 行——否则，显示所有行）；此外，我们的数值条目仅显示两位有效数字。在设置这些选项的同时，我们引入埃德加·安德森的鸢尾花数据集。该数据涉及三种鸢尾花物种的萼片和花瓣的长度和宽度（单位：厘米）。\n\
  \n在将鸢尾花数据转换为数据表之前，我们将把物种名称转换为字符类型而非因子类型。在以下代码中，我们设置选项，强制物种名称转换为字符类型，并创建我们的数据表 `diris`：\n\
  \n```\noptions(stringsAsFactors = FALSE,\ndatatable.print.nrows = 20, ## 若行数超过 20\n\
  datatable.print.topn = 3, ## 打印前 3 行和后 3 行\ndigits = 2) ## 减少 R 打印的位数\niris$Species\
  \ <- as.character(iris$Species)\ndiris <- as.data.table(iris)\ndiris\n```\n\n我们的数据共有\
  \ `150` 行，包含三个物种：`setosa`、`versicolor` 和 `virginica`。每个物种有 `50` 组测量数据。R 在内存中运行，对于巨大的数据表，这可能会引起问题。`tables()`\
  \ 命令显示内存中的所有数据表及其大小。实际上，`tables()` 本身就是一个数据表。注意该函数提供了关于数据表名称、行数、列数、以 `MB` 为单位的大小以及是否有键的信息。我们将在后面几段讨论带键的数据表。目前，注意到\
  \ `1MB` 不太可能给我们带来内存问题：\n\n```\ntables()\n```\n\n如果我们想了解每列数据类型的更多信息，可以在感兴趣的数据表上调用\
  \ `sapply()` 命令和 `class()` 函数。回想一下，`*apply` 类函数将第二个形参指定的函数应用到第一个形参的元素上，并返回结果。在我们的例子中，对\
  \ `diris` 调用 `class()`，我们看到 `diris` 各列中存储了哪些类型的值：\n\n```\nsapply(diris, class)\n\
  ```\n\n数据表相对于其他数据格式有一个强大的概念优势。即，数据表可以被设置键。有了键，就可以使用二分查找。对于不熟悉二分查找的人来说，想象一下需要在电话簿中查找一个名字。阅读每个名字会花费相当长的时间。然而，因为我们知道电话簿是按字母顺序排列的，我们可以立即找到一个位于字母表中部的名字，判断我们搜索的名字属于该名字之前还是之后，并在这个过程中排除掉一半的电话簿。我们可以对剩余的一半重复这个算法，在仅仅两次查找后就只留下原始数据的四分之一需要搜索！更数学化地说，虽然搜索数据框的所有条目会基于行数\
  \ `n` 呈线性复杂度，但在数据表中，最坏情况下的复杂度为 `log n`。在作者们使用的几个新表中，数据量翻倍仅使代码运行时间增加几分钟，而不是使运行时间翻倍。这是一个巨大的优势。\n\
  \n在 `data.table` 中，键是一个索引，它可能唯一也可能不唯一，由一个或多个数据列创建。数据按键排序，允许使用键进行非常快速的操作。示例操作包括子集化或筛选、为每个唯一的键值执行计算（例如，变量的平均值）以及合并两个或多个数据集。\n\
  \n当然，为数据表设置键确实需要时间，因此这取决于你在做这种选择之前访问数据的频率。另一个考虑因素是使用什么作为键。一个表只有一个键，尽管该键可以由多个列组成。函数\
  \ `setkey()` 以一个数据表作为第一个形参，然后接收不定数量的列名来设置一个键。要查看数据表是否有键，...\n\n\n\n### 处理需要忽略的内容，例如删除空格、句点、连字符\n\
  \n`rawpool <- pool`\n```r\nfor (v in ignore) {\n  index <- gsub(v, \"\", index)\n\
  \  pool <- gsub(v, \"\", pool)\n}\n```\n\n### 如果忽略大小写，则转换为小写\n\n```r\nif (ignore.case)\
  \ {\n  index <- tolower(index)\n  pool <- tolower(pool)\n}\n```\n\n```r\nif (!identical(split,\
  \ FALSE)) {\n  index2 <- strsplit(index, split = split)[[1]]\n  index2 <- index2[nzchar(index2)]\n\
  \  pool2 <- strsplit(pool, split = split)\n  pool2 <- lapply(pool2, function(x)\
  \ x[nzchar(x)])\n\n  ## 计算距离，默认为 Damerau-Levenshtein 距离\n  distances <- sapply(pool2,\
  \ function(x) {\n    sum(apply(stringdistmatrix(index2, x, method = method),\n \
  \             1, min, na.rm = TRUE))\n  })\n} else {\n  ## 计算距离，默认为 Damerau-Levenshtein\
  \ 距离\n  distances <- stringdist(index, pool, method = method)\n}\n```\n\n### 某些方法会导致无穷大的结果，将这些设为缺失值\n\
  \n`distances[!is.finite(distances)] <- NA`\n\n### 获取最佳和最差距离\n\n`best <- min(distances,\
  \ na.rm = TRUE)`\n`worst <- max(distances, na.rm = TRUE)`\n\n### 如果使用模糊匹配，则获取在最佳与最差距离差值`fuzz`百分比范围内的所有距离\n\
  \n```r\nif (fuzz) {\n  usedex <- which(distances <= (best + ((worst - best) * fuzz)))\n\
  } else {\n  usedex <- which(distances == best)\n}\n```\n\n### 定义一个距离阈值，低于此阈值被视为完全匹配或精确匹配\n\
  \n`perfect <- distances[usedex] < .01`\n`out <- rawpool[usedex]`\n\n### 计算完全匹配的数量\n\
  \n`count <- sum(perfect)`\n## 函数继续到下一页\n\n```r\nif (any(perfect)) {\n  ## 如果存在完全匹配，则只使用一个\n\
  \  match <- out[perfect][1]\n\n  ## 返回一个包含完全匹配和完全匹配数量的数据表（可能为 1）\n  data.table(\n\
  \    Match = match,\n    N = count,\n    Written = NA_character_)\n} else {\n  ##\
  \ 如果没有完全匹配，则返回近似匹配的列表，用逗号分隔并保持原始书写\n  data.table(\n    Match = paste(out, collapse\
  \ = \", \"),\n    N = count,\n    Written = index)\n}\n}\n```\n\n现在我们遍历每个观察到的名称，并尝试将其与参考名称中最佳匹配的\
  \ 5%（`.05`）范围内的名称进行匹配。由于输出总是相同的，我们可以按行组合它们。\n\n```r\noutput <- lapply(observed.Names,\
  \ function(n) {\n  matchIt(index = n, pool = reference.Names, ignore = c(\"\\\\\
  .\", \"-\"), split = \"\\\\s\", fuzz = .05)\n})\noutput <- do.call(rbind, output)\n\
  output\n```\n```\nMatch                  N   Written\n1:               This Test\
  \ 1        NA\n2:               This Test 1        NA\n3:               Test Thas\
  \ 0 test that\n4:               Jane Mary 1        NA\n5:               Jane Mary\
  \ 0  mary sou\n6:            Jack Dun-Dee 0  jack dee\n7: Jane Mary, Jack Dun-Dee\
  \ 0 jane jack\n```\n\n我们可以看到`This Test`出现在两行中，因此我们进行聚合并打印最终输出。`This Test`有两个完全匹配。`Test\
  \ Thas`没有完全匹配，但在`Uncertain`列下列出了一个近似匹配。最后，`jack dee`是`Jack Dun-Dee`的一个近似但不确定的匹配，`jane\
  \ jack`是`Jane Mary`或`Jack Dun-Dee`的一个不确定匹配。\n\n```r\nfinaloutput <- output[, .(\n\
  \  N = sum(N),\n  Uncertain = paste(na.omit(Written), collapse = \", \")),\n  by\
  \ = Match]\nfinaloutput\n```\n```\nMatch                  N Uncertain\n1:      \
  \         This Test 2\n2:               Test Thas 0 test that\n3:              \
  \ Jane Mary 1  mary sou\n4:            Jack Dun-Dee 0  jack dee\n5: Jane Mary, Jack\
  \ Dun-Dee 0 jane jack\n```\n\n虽然很难涵盖所有示例和用例，但结合使用这些基本工具应该足以应对许多类型的数据管理任务。\n\n##\
  \ 总结\n\n在本章中，您学习了如何基于精确的正则表达式或模糊匹配来定位文本。此外，您还学习了如何用新的字符串片段替换旧的字符串片段。最后，我们讨论了在`data.table`中创建新变量的方法。表\
  \ 8-1 总结了本章介绍的关键函数。\n\n**表 8-1.**\n**本章描述的关键函数**\n\n| 函数 | 功能描述 |\n| --- | --- |\n\
  | `read.dta()` | 读取 Stata 文件 |\n| `str()` | 显示 R 对象的结构 |\n| `grep()` | 模式匹配，返回显示哪些元素匹配的向量\
  \ |\n| `grepl()` | 模式匹配，返回显示`x`中所有值布尔值的向量 |\n| `gsub()` | 匹配模式并进行替换，返回更改后的原始向量 |\n\
  | `rowMeans()`, `rowSums()` | 计算数据表或矩阵中每行的平均值或总和 |\n| `Reduce()` | 接受一个二元函数作为第一个参数，并将其应用于其余参数\
  \ |\n| `.SD` | `data.table`中的保留名称，可用于指代数据表中的所有变量作为一个列表 |\n| `.SDcols` | `data.table`的参数，允许指定要包含在`.SD`中的变量\
  \ |\n| `strsplit()` | 根据特定的分隔字符拆分字符串 |\n| `stringdistmatrix()` | 创建一个包含观测值与期望值之间距离的矩阵\
  \ |\n| `amatch()` | 提供一个向量，显示期望值中哪个索引最接近观测值 |\n| `tolower()` | 将给定字符串中的所有字符强制转换为小写\
  \ |\n\n# 9. 其他数据管理工具\n\n\n\n比较数据框和数据表会引出一个有趣的问题。如果存在更多类型的数据呢？尤其是，如果有不同方式存储的数据，而这些方式本质上都是某种表格，会怎么样？除了数据框或表之外，还有许多存储数据的方法，其中很多只是表格。`dplyr`（Wickham\
  \ 和 Francois，2015）背后的理念是，无论数据后端可能是什么，我们的体验都应该是一样的。为了实现这一点，`dplyr` 为常见的数据管理任务实现了泛型函数。对于每个泛型函数，都会编写特定的方法，将通用操作转换为特定后端所需的任何代码或语言。使用抽象层可以确保用户获得一致的体验，无论使用的具体数据格式或后端是什么。这也使得\
  \ `dplyr` 具有可扩展性，因为可以通过简单地编写额外的函数或方法来添加对新格式的支持。用户体验无需改变。对于本章，我们的 `checkpoint` 头文件需要安装并添加\
  \ `tibble` 和 `dplyr` 包：\n\n```\nlibrary(checkpoint)\ncheckpoint(\"2016-09-04\",\
  \ R.version = \"3.3.1\")\nlibrary(dplyr)\nlibrary(tibble)\n```\n\n`dplyr` 包中的函数命名基于完成特定动作的动词。也就是说，`dplyr`\
  \ 不是有几个能完成许多任务的函数，而是有许多通常只完成特定任务的函数。与 `data.table`（Dowle、Srinivasan、Short 和 Lianoglou，2015）不同，`dplyr`\
  \ 是函数式的，因为它总是接收输入并返回输出，在这里输出是数据。它不像 `data.table` 那样直接在内存中修改数据。然而，它仍然相当快，因为许多函数都经过了优化，用\
  \ C++ 编写，并且 `dplyr` 尽量避免不必要的拷贝。\n\n和之前一样，我们设置一些选项来减少打印的行数。`dplyr` 的默认数据格式是 `tibble`（Wickham、Francois\
  \ 和 Müller，2016）。Tibble 在 `tibble` 包中实现。从本质上讲，tibbles 是数据框的扩展，它们有一些额外的限制（例如默认为字符串而不是将字符串强制转换为因子），以及更友好的打印或屏幕显示方法。数据操作由\
  \ `dplyr` 处理，而 `tibble` 处理数据的实际存储。从技术上讲，`tibble` 包实现了 R 对象的 `class` 以及 tibbles 的一些基本方法。\n\
  \n```\noptions(stringsAsFactors = FALSE,\ntibble.print_max = 20, ## if over 20 rows\n\
  tibble.print_min = 5, ## print first 5\ndigits = 2) ## reduce digits printed by\
  \ R\niris$Species\n1          5.1         3.5          1.4         0.2  setosa\n\
  2          4.9         3.0          1.4         0.2  setosa\n3          4.7    \
  \     3.2          1.3         0.2  setosa\n4          4.6         3.1         \
  \ 1.5         0.2  setosa\n5          5.0         3.6          1.4         0.2 \
  \ setosa\n\n"
- '# ... with 145 more rows

  ```


  对于 `data.table`，我们使用 `sapply()` 来获取每列或每个变量的类向量。虽然我们可以对 tibbles 做同样的事情，但 tibbles
  会自动提供每列数据类型或类的信息以及总列数和行数（例如，`<dbl>` 表示双精度或数值，`<chr>` 表示字符类数据）。我们将注意力转向处理数据的常见目标：排序、子集筛选、排序、计算和重塑。考虑
  `dplyr` 的一个有用方式是它使用动词来描述对数据的操作。


  ## 排序


  我们在 `dplyr` 中通过 `arrange()` 函数进行排序，该函数将数据集作为其第一个参数。第一个参数之后的附加参数提供了按那些其他列排序的功能。默认是递增顺序，这可以通过第二个函数调用
  `desc()` 来修改以提供递减顺序。


  ```

  diris

  1          4.3         3.0          1.1         0.1  setosa

  2          4.4         2.9          1.4         0.2  setosa

  3          4.4         3.0          1.3         0.2  setosa

  4          4.4         3.2          1.3         0.2  setosa

  5          4.5         2.3          1.3         0.3  setosa


  '
- '# ... with 145 more rows

  diris

  1          4.3         3.0          1.1         0.1  setosa

  2          4.4         3.2          1.3         0.2  setosa

  3          4.4         3.0          1.3         0.2  setosa

  4          4.4         2.9          1.4         0.2  setosa

  5          4.5         2.3          1.3         0.3  setosa


  '
- '# ... with 145 more rows

  ```


  可以通过 `anyDuplicated()` 查看出现重复时的第一行索引，无论是针对整个数据集还是仅针对特定列。在整个数据集上调用此函数时，它会查找所有列之间的匹配，这在此数据集中的第
  `78` 行和第 `79` 行发生。在以下代码中显示，萼片长度中的重复变量出现在第三行：


  ```

  anyDuplicated(diris)

  [1] 79

  anyDuplicated(diris$Sepal.Length)

  [1] 3

  ```


  而 `anyDuplicated()` 返回第一个重复项的行索引，`duplicated` 只是告诉我们在我们的表中有多少次这样的重复发生。查看我们的代码，我们看到对于所有列的完全匹配，第
  `79` 行是唯一一次出现这种情况。另一方面，萼片长度的重复可能第一次出现在第 `3` 行，但还有很多其他的重复。


  ```

  table(duplicated(diris))

  FALSE  TRUE

  149     1

  table(duplicated(diris$Sepal.Length))

  FALSE  TRUE

  35   115

  ```


  如果我们想查看仅包含不同值的表结果，`distinct()` 的工作方式很像 `arrange()`。第一个形式参数是针对数据的，其余的参数指定列名变量。如果没有指定列名，`distinct()`
  对所有列进行操作。从 `duplicated()` 调用中回忆，有 `149` 个唯一的行。


  ```

  distinct(diris)


  '
- '# A tibble: 149 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width Species


  1          4.3         3.0          1.1         0.1  setosa

  2          4.4         3.2          1.3         0.2  setosa

  3          4.4         3.0          1.3         0.2  setosa

  4          4.4         2.9          1.4         0.2  setosa

  5          4.5         2.3          1.3         0.3  setosa


  '
- '# ... with 144 more rows

  ```


  类似地，回想一下，如果我们只考虑萼片长度，只有 `35` 个唯一的行。因此，使用 `distinct()` 的第二个形式参数来保存 `Sepal.Length`
  列，我们的 `tibble` 中只有 `35` 行。我们在这里展示这些行的前五行：


  ```

  distinct(diris, Sepal.Length)


  '
- '# A tibble: 35 x 1

  Sepal.Length


  1          4.3

  2          4.4

  3          4.5

  4          4.6

  5          4.7


  '
- '# ... with 30 more rows

  ```


  本节最后再调用一次 `distinct()`，展示在第二个和第三个形式参数中调用多个列。在这里，当 `Sepal.Length` 和 `Sepal.Width`
  都不重复时，一行才是唯一的。特别注意第 `2` 到第 `4` 行，它们有相同的 `Sepal.Length`，但这些行并没有重复，因为它们的 `Sepal.Widths`
  是不同的：


  ```

  distinct(diris, Sepal.Length, Sepal.Width)


  '
- '# A tibble: 117 x 2

  Sepal.Length Sepal.Width


  1          4.3         3.0

  2          4.4         3.2

  3          4.4         3.0

  4          4.4         2.9

  5          4.5         2.3

  ```




  # 选择与子集选取


  在 `dplyr` 中选取存储数据的部分，与 `data.table` 的方法论有所不同。请记住，`dplyr` 通过函数调用工作。这些函数被设计为独立于底层数据结构。尽管如此，我们仍希望得到相同的最终结果。按位置选择行是通过
  `slice()` 函数完成的，它接受两个形式参数。第一个是数据对象，在我们的例子中是 `diris`，第二个参数允许我们选择特定的行。我们首先只选择前五行：


  ```

  slice(diris, 1:5)


  '
- '# A tibble: 5 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width Species


  1          4.3         3.0          1.1         0.1  setosa

  2          4.4         3.2          1.3         0.2  setosa

  3          4.4         3.0          1.3         0.2  setosa

  4          4.4         2.9          1.4         0.2  setosa

  5          4.5         2.3          1.3         0.3  setosa

  ```


  如前所见，`-` 可用于取反。因此，我们也可以通过删除第 `1` 到 `145` 行来只保留最后五行：


  ```

  slice(diris, -(1:145))


  '
- '# A tibble: 5 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width   Species


  1          7.7         3.8          6.7         2.2 virginica

  2          7.7         3.0          6.1         2.3 virginica

  3          7.7         2.8          6.7         2.0 virginica

  4          7.7         2.6          6.9         2.3 virginica

  5          7.9         3.8          6.4         2.0 virginica

  ```


  我们也可以不直接选择行，而是对它们设置逻辑条件。同样，这类参数属于函数调用的第二个形式参数。但是，在这种情况下，我们使用 `filter()` 而不是 `slice()`。`filter()`
  函数使用逻辑索引。通过编写逻辑测试，很容易选择 `Species` 等于（或不等）`setosa` 的所有行：


  ```

  filter(diris, Species == "setosa")


  '
- '# A tibble: 50 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width Species


  1          4.3         3.0          1.1         0.1  setosa

  2          4.4         3.2          1.3         0.2  setosa

  3          4.4         3.0          1.3         0.2  setosa

  4          4.4         2.9          1.4         0.2  setosa

  5          4.5         2.3          1.3         0.3  setosa


  '
- '# ... with 45 more rows


  filter(diris, Species != "setosa")


  '
- '# A tibble: 100 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width    Species


  1          4.9         2.5          4.5         1.7  virginica

  2          4.9         2.4          3.3         1.0 versicolor

  3          5.0         2.3          3.3         1.0 versicolor

  4          5.0         2.0          3.5         1.0 versicolor

  5          5.1         2.5          3.0         1.1 versicolor


  '
- '# ... with 95 more rows

  ```


  除了逻辑索引外，也可以基于数值使用不等式、等式或非等式来选择行。数值和字符测试可以混合和匹配，以精确提取所需的行：


  ```

  filter(iris, Sepal.Length  .2)

  Sepal.Length Sepal.Width Petal.Length Petal.Width    Species

  1          4.6         3.4          1.4         0.3     setosa

  2          4.5         2.3          1.3         0.3     setosa

  3          4.8         3.0          1.4         0.3     setosa

  4          4.9         2.4          3.3         1.0 versicolor

  5          4.9         2.5          4.5         1.7  virginica


  filter(diris, Sepal.Length == 4.3 | Sepal.Width != 4.4)


  '
- '# A tibble: 149 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width Species


  1          4.3         3.0          1.1         0.1  setosa

  2          4.4         3.2          1.3         0.2  setosa

  3          4.4         3.0          1.3         0.2  setosa

  4          4.4         2.9          1.4         0.2  setosa

  5          4.5         2.3          1.3         0.3  setosa


  '
- '# ... with 144 more rows

  ```


  如果我们寻求多个匹配项，可以使用 `%in%` 运算符以及我们感兴趣的列表。这允许我们将指示我们选择兴趣的编码分离出来，然后基于该兴趣进行筛选：


  ```

  interest <- c(4.3, 4.4, 4.5)

  filter(diris, Sepal.Length %in% interest)


  '
- '# A tibble: 4 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width Species


  1          4.3         3.0          1.1         0.1  setosa

  2          4.4         3.2          1.3         0.2  setosa

  3          4.4         3.0          1.3         0.2  setosa

  4          4.4         2.9          1.4         0.2  setosa

  ```


  或者，如果我们希望排除具有特定特征的行，可以通过取反来实现。这对于移除异常值或错误数据点很有用：


  ```

  filter(diris, !Sepal.Length %in% interest)


  '
- '# A tibble: 146 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width Species


  1          4.5         2.3          1.3         0.3  setosa

  2          4.6         3.6          1.0         0.2  setosa

  3          4.6         3.4          1.4         0.3  setosa

  4          4.6         3.2          1.4         0.2  setosa

  5          4.6         3.1          1.5         0.2  setosa


  '
- "# ... with 141 more rows\n```\n\n我们展示的最后一个过滤器示例使用了几个参数。使用多个参数不是必需的，但可以是一种将代码分解成人类可读块的有用方式。多个参数在逻辑上等同于\
  \ `&`。\n\n```\nfilter(diris,\n       Sepal.Length == 4.3 | Sepal.Length == 4.4,\n\
  \       Petal.Width == 0.2)\n\n"
- '# A tibble: 1 x 5

  Sepal.Length Sepal.Width Petal.Length Petal.Width Species


  1          4.4           3          1.4         0.2  setosa

  ```


  到目前为止，我们是从所有列中选择行。如果我们只希望选择特定的列，`select()` 函数将数据框作为其第一个形式参数，列信息放在其余的形式参数中。对于表格数据结构中已命名的列，选择一列或多列就像列出列名一样简单。也可以按位置选择。对比这些命名与位置列参数，并认识到两者都可以按所需顺序进行列选择：


  ```

  select(diris, Sepal.Length, Sepal.Width)


  '
- '# A tibble: 150 x 2

  Sepal.Length Sepal.Width


  1          4.3         3.0

  2          4.4         3.2

  3          4.4         3.0

  4          4.4         2.9

  5          4.5         2.3


  '
- '# ... with 145 more rows


  select(diris, 1, 5, 2)


  '
- '# A tibble: 150 x 3

  Sepal.Length Species Sepal.Width


  1          4.3  setosa         3.0

  2          4.4  setosa         3.2

  3          4.4  setosa         3.0

  4          4.4  setosa         2.9

  5          4.5  setosa         2.3


  '
- '# ... with 145 more rows

  ```


  到目前为止，特定的列是直接命名的。如果列需要根据程序或用户需求而变化怎么办？在这种情况下，字符串引用是可取的，因为字符串很容易转换为变量。我们展示了直接调用 `select_()`
  和使用变量 `v` 来达到相同结果的两种方法。请务必注意函数名中添加了下划线！使用 `select_()` 时，多个变量名字符串可以作为单独的参数传递。


  ```

  select_(diris, "Sepal.Length", "Sepal.Width")


  '
- '# A tibble: 150 × 2

  Sepal.Length Sepal.Width


  1          5.1         3.5

  2          4.9         3.0

  3          4.7         3.2

  4          4.6         3.1

  5          5.0         3.6


  '
- '# ... with 145 more rows

  ```


  我们的变量 `v` 可以包含多个列名。但是，如果以默认方式使用，将只返回列表中的第一个变量。要返回所有变量，当传递一个包含变量名向量的对象时，应将其传递给 `.dots`
  形式参数，如下面的第二个例子所示：


  ```

  v <- c("Sepal.Length", "Sepal.Width")

  select_(diris, v[1])


  '
- '# A tibble: 150 x 1

  Sepal.Length


  1          4.3

  2          4.4

  3          4.4

  4          4.4

  5          4.5


  '
- '# ... with 145 more rows


  select_(diris, .dots = v)


  '
- '# A tibble: 150 × 2

  Sepal.Length Sepal.Width


  1          5.1         3.5

  2          4.9         3.0

  3          4.7         3.2

  4          4.6         3.1

  5          5.0         3.6


  '
- '# ... with 145 more rows

  ```




  # ... 还有 145 行


  使用我们原始的 `select()` 函数达到相同结果的另一种方法是使用选择辅助函数之一。共有七个这样的辅助函数，我们目前需要的是 `one_of()`，它用于处理字符向量：


  ```

  select(diris, one_of(v))


  '
- '# A tibble: 150 x 1

  Sepal.Length


  1          4.3

  2          4.4

  3          4.4

  4          4.4

  5          4.5


  '
- '# ... with 145 more rows

  ```


  当使用 `dplyr` 的数据结构 `tibble` 时，类似数据表中使用的方法有效。但这并不能保证在整个 `dplyr` 使用过程中都能如此顺利地转换。似乎最好以
  `dplyr` 的原生方式进行操作。然而，为了完整性，下面给出了接下来的两个函数调用：


  ```

  diris[, v]


  '
- '# A tibble: 150 x 1

  Sepal.Length


  1          4.3

  2          4.4

  3          4.4

  4          4.4

  5          4.5


  '
- '# ... with 145 more rows

  diris[, 1]


  '
- '# A tibble: 150 x 1

  Sepal.Length


  1          4.3

  2          4.4

  3          4.4

  4          4.4

  5          4.5


  '
- '# ... with 145 more rows

  ```


  到目前为止，我们所有的操作都返回另一个 `tibble` 作为输出。将原始数据提取为向量使用了多种技术。如果我们知道包含所需数据的列名，直接输入名称很容易。如果我们的列可能是可变的，我们为第三种方法重用变量
  `v`。无论使用哪种方法，控制台打印的数据都是相同的。请注意，这些数据是向量，而不是数据表结构。


  ```

  head(diris[["Sepal.Length"]])

  [1] 4.3 4.4 4.4 4.4 4.5 4.6

  head(diris$Sepal.Length)

  [1] 4.3 4.4 4.4 4.4 4.5 4.6

  head(diris[[v]])

  [1] 4.3 4.4 4.4 4.4 4.5 4.6

  ```


  排除一列或多列可能比选择某些列更令人感兴趣。排除操作使用几种形式的取反。具体来说，要排除的列可以通过名称或位置来指定：


  ```

  select(diris, -1)


  '
- '# A tibble: 150 x 4

  Sepal.Width Petal.Length Petal.Width Species


  1         3.0          1.1         0.1  setosa

  2         3.2          1.3         0.2  setosa

  3         3.0          1.3         0.2  setosa

  4         2.9          1.4         0.2  setosa

  5         2.3          1.3         0.3  setosa


  '
- '# ... with 145 more rows

  select(diris, -Sepal.Length, -Petal.Width)


  '
- '# A tibble: 150 x 3

  Sepal.Width Petal.Length Species


  1         3.0          1.1  setosa

  2         3.2          1.3  setosa

  3         3.0          1.3  setosa

  4         2.9          1.4  setosa

  5         2.3          1.3  setosa


  '
- '# ... with 145 more rows

  ```


  同样，当需要可变排除时，我们设置一个变量来保存向量，并可以使用 `paste0()` 在其前面加上取反符号，然后使用 `select_()` 调用来处理字符串。或者，我们可以在常用的
  `select()` 函数中结合选择辅助函数 `one_of()` 使用取反。无论哪种方式，我们都能得到相同的结果：


  ```

  ex

  1         3.0          1.1         0.1  setosa

  2         3.2          1.3         0.2  setosa

  3         3.0          1.3         0.2  setosa

  4         2.9          1.4         0.2  setosa

  5         2.3          1.3         0.3  setosa


  '
- '# ... with 145 more rows

  select(diris, -one_of(v))


  '
- '# A tibble: 150 x 4

  Sepal.Width Petal.Length Petal.Width Species


  1         3.0          1.1         0.1  setosa

  2         3.2          1.3         0.2  setosa

  3         3.0          1.3         0.2  setosa

  4         2.9          1.4         0.2  setosa

  5         2.3          1.3         0.3  setosa


  '
- '# ... with 145 more rows

  ```


  既然我们已经多次使用了这个选择便利函数，我们简要地再看其中四个。这四个函数的目标是帮助我们无需完整键入列名即可选择变量。无论顺序如何，`starts_with()`、`ends_with()`、`contains()`
  和 `matches()` 都使用正则表达式，默认在当前变量列表中查找，并且默认忽略字母大小写，尽管这是一个可以关闭的功能。我们不演示所有这些，以下代码展示了两个使用
  `starts_with()` 的例子。`dplyr` 方法的一个好处是，它创建了以动词命名的聚焦函数，每个函数完成一项特定任务，这使得从其名称就能轻松判断函数的功能。其余的辅助函数操作方式与
  `starts_with()` 类似，并完全如其名称所示：


  ```

  select(diris, starts_with("s"))


  '
- '# A tibble: 150 x 3

  Sepal.Length Sepal.Width Species


  1          4.3         3.0  setosa

  2          4.4         3.2  setosa

  3          4.4         3.0  setosa

  4          4.4         2.9  setosa

  5          4.5         2.3  setosa


  '
- '# ... with 145 more rows

  select(diris, starts_with("s", ignore.case = FALSE))


  '
- '# A tibble: 150 x 0

  ```


  通过最后这段代码，我们在 `dplyr` 中进行数据子集选取的旅程就结束了。现在我们将注意力转向变量重命名和排序。


  ## 变量重命名与排序


  列名需要重命名或重新排序，这在数据维护中是一个令人遗憾但又常规的操作。在一个数据库中有意义（或“合法”）的名称，在另一个数据库中可能行不通。许多专有数据管理系统有固定的名称，这些名称很繁琐。


  查看与 `dplyr` 对象关联的名称需要使用通常在数据集 `diris` 上调用的 `names()` 或 `colnames()` 函数。无论使用哪种方法，对于当前的列顺序，我们都会得到相同的结果：


  ```

  names(diris)

  [1] "Sepal.Length" "Sepal.Width"  "Petal.Length" "Petal.Width"  "Species"

  colnames(diris)

  [1] "Sepal.Length" "Sepal.Width"  "Petal.Length" "Petal.Width"  "Species"

  ```


  要更改名称，在数据对象上调用 `rename()` 函数，并按以下格式在第二个形参中设置新名称：`新名称 = 旧名称`。可以通过传递额外的参数（例如，在第三个、第四个形参中）一次性重命名多个列。通过比较
  `names()` 的新结果与旧结果来确认更改是否生效。在以下代码中，我们移除了数据中 `Sepal` 和 `Length` 之间的句点：


  ```

  diris <- rename(diris, SepalLength = Sepal.Length)

  names(diris)

  [1] "SepalLength"  "Sepal.Width"  "Petal.Length" "Petal.Width"  "Species"

  ```


  要将列重新排序，使长度和宽度成对排列，只需使用 `select()` 函数并为你的数据对象重新赋值。请务必记住我们已经将 `SepalLength` 重命名，中间不再有句点！


  ```

  diris

  1         4.3          1.1         3.0         0.1  setosa

  2         4.4          1.3         3.2         0.2  setosa

  3         4.4          1.3         3.0         0.2  setosa

  4         4.4          1.4         2.9         0.2  setosa

  5         4.5          1.3         2.3         0.3  setosa


  '
- '# ... with 145 more rows

  ```


  前面提到，数字选择的调用可以重新排序列，因此我们用最后一个重新排序的例子来结束本节。在这里，我们使用一个变量来保存数字位置，尽管我们同样可以用字符名称代替数字。然后我们使用
  `select_()` 函数将我们的列重新组织回原始顺序。


  ```

  v

  1         4.3         3.0          1.1         0.1  setosa

  2         4.4         3.2          1.3         0.2  setosa

  3         4.4         3.0          1.3         0.2  setosa

