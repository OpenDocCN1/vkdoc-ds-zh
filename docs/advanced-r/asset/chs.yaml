  \ `one_of()`，它用于管理字符向量：\n\n```\nselect(diris, one_of(v))\n\n# A tibble: 150 x 1\n\
  Sepal.Length\n\n1          4.3\n2          4.4\n3          4.4\n4          4.4\n\
