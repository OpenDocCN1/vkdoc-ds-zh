  ### 输入


  接下来要面对的挑战是如何将新数据导入 R。数据集往往很大，但有效的技术也可以用于较小的数据集。以制表符或逗号分隔的文本文件是最容易导入 R 的。接下来，常见的数据文件类型包括
  Microsoft Excel、SPSS、SAS 和 Stata。更普遍地说，可以相当肯定地说，很可能存在一个 R 包可以处理您想要导入的文件类型。即使需要，也可以输入
  PDF 和 Microsoft Word 文件（文本分析，从词云到更具预测性的应用，可以想到这些情况）。对于这些记录中的大部分，输入过程是相似的，因此或许不需要详尽介绍，而更需要建立正确的原则。请务必访问本书的
  Apress 网站下载本书的代码包。我们在接下来的示例中使用第[02](http://dx.doi.org/10.1007/978-1-4842-2077-1_02)章文件夹中的文件；使用了`Counties
  in Illinois`文件（All Counties in Illinois， 2016）和`rscfp2013`文件（DADS， 2016）。


  我们从 R 中的一个函数`read.table()`开始，它可以接收几种更基本的文件类型，并将它们作为数据框读入。与大多数输入函数一样，它有几个选项，并非所有选项在任何特定情况下都是必需的。根据读入
  R 的数据类型，可能需要多次尝试才能以便于使用和操作的方式成功读入数据。在这种情况下，`View`函数可能会有所帮助，其输出如图 2-5 所示。


