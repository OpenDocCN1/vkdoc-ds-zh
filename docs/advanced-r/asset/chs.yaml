  \   35083         45692\n   less.than.high.school high.school some.college bachelors.or.higher\n\
  1            0.06938496   0.3663752    0.3155484          0.24869141\n2        \
  \    0.17821309   0.3999044    0.3251314          0.09675108\n3            0.08590590\
