  \ 6-4）。\n\n![A393929_1_En_6_Fig4_HTML.jpg](img/A393929_1_En_6_Fig4_HTML.jpg)\n\n\
  **图 6-4.** GitHub 桌面客户端显示 `AdvancedRPkg` 仓库的设置，包括被 Git 仓库忽略的各种文件扩展名\n\nWindows 经常在目录中创建临时（有时是隐藏的）文件\
  \ `desktop.ini`。为了避免包含这些文件，我们可以编辑仓库设置，在末尾添加新的一行并输入 `desktop.ini`。这样这些文件就会被忽略。被忽略的文件是那些\
  \ Git 仓库不跟踪且不存储其随时间变化内容的文件。它们仍然存在于目录中；Git 只是不监控和版本管理它们。\n\n除了设置一个新的 Git 仓库，你可能经常使用\
  \ Git 执行的任务是提交对仓库的更改，以及将仓库的本地副本与在线（GitHub）版本同步。提交可以被认为是拍摄提交时文件状态的快照。为了避免冗余，提交只会对自上次提交以来发生更改的文件进行快照。尽管即使是略微修改过的二进制文件也可能难以比较，但像\
  \ R 代码这样的纯文本文件则易于比较。Git 在随时间跟踪文本文件的更改方面效率极高，并允许你查看所做的更改或回退到过去的特定时间点。访问项目（仓库）的变更历史在代码中引入错误或\
  \ bug 时尤其有用，这样可以精确定位 bug 是什么时候引入的（例如，有多少基于该代码的结果可能受到影响？），并查看之前的代码工作版本。\n\n在稍微复杂一些的用例中，Git\
  \ 可以有效地用于管理代码的不同版本。例如，常见的情况是拥有一个项目，并定期发布稳定版或生产就绪版的代码，同时继续进行开发。在 Git 中，这是通过使用同一仓库的不同分支，并定期将一个分支（例如，开发分支）的部分更改合并到稳定分支来实现的。\n\
  \n在本章中，我们还会展示一些相关的 Git 命令。关于使用 Git 的更多背景知识，一个极好的免费资源是 Scott Chacon 和 Ben Straub\
  \ 合著的 *Pro Git*（Apress, 2014），可从 <https://progit.org/> 获取。要查找问题和答案，Stack Overflow（<http://stackoverflow.com>）是一个不错的资源。很可能已经有人问过与您类似的问题，如果没有，您可以提问并获得答案。另请注意，如果您使用\
  \ RStudio 来编写 R 代码，它内置了一些与 Git 的集成功能。更多信息，请参阅 RStudio 支持页面：<https://support.rstudio.com/hc/en-us/articles/200532077-Version-Control-with-Git-and-SVN>。最后，请注意，您可以在\
  \ <https://github.com/ElkhartGroup/AdvancedRPkg> 公开访问在线仓库。\n\n\n\n## R 包基础\n\n一个\
  \ R 包本质上就是一个包含特定文件的目录。尽管 R 包的核心无疑是 R 代码，但其中许多文件并非严格意义上的 R 代码。表 6-1 列出了可能出现在 R 包目录根目录下的主要文件。根据包的其他特性，并非所有这些文件都是必需的。本章稍后我们将借助`devtools`包来帮助创建其中的一些文件。\n\
  \n表 6-1. 可能用于 R 包根目录的文件\n\n| 文件 | 描述 |\n| --- | --- |\n| `DESCRIPTION`* | 提供关于包的通用信息。必填字段包括：Package（包名）、Version（版本）、License（许可证）、Title（包描述）、Author（作者）和\
  \ Maintainer（维护者，可与作者相同或不同）。除非包是独立的，否则通常还包括依赖关系信息。 |\n| `NAMESPACE`* | 控制包的命名空间，包括导出哪些对象以及从其他包导入哪些对象。虽然是必需文件，但我们将通过`roxygen2`包自动生成。\
  \ |\n| `README`/`README.md` | 非必需，R 会忽略此文件，但对读者和用户有帮助。提供关于包的通用信息（如获取帮助的途径、简要概述、安装指南，或任何其他在简短文档中有用的内容）。\
  \ |\n| `NEWS` | 提供关于包变更或新闻的信息。通常包括新功能、错误修复，以及与先前版本相比的其他重大变化。 |\n| `LICENSE` | 如果未使用常见许可证或需要额外信息，则提供许可证文件。\
  \ |\n| `INDEX` | 可选，由文档文件自动生成。但如果指定，则会在每一行以名称和描述的形式列出所有有趣/有用的对象。 |\n| `configure`、`cleanup`\
  \ | 可选的 Bourne Shell 脚本，分别在 Unix 系统（例如 Linux、Unix）安装前后运行。 |\n\n* 表示必需文件\n\n除了根级别的文件外，R\
  \ 包中还可以包含多个子目录。这些子目录列于表 6-2 中，并附有简要说明。对于我们相对简单的包，我们只用到其中少数几个，包括`R`、`man`和`tests`。\n\
  \n表 6-2. R 包子目录\n\n| 子目录 | 描述 |\n| --- | --- |\n| `R`* | 包含所有函数、类、方法等 R 源代码的目录。\
  \ |\n| `man`* | 包含 R 文档文件的目录。我们通过`roxygen2`包自动生成这些文件。 |\n| `tests` | 可选目录，包含用于测试包是否按预期工作的\
  \ R 代码。 |\n| `data` | 可选目录，包含随包一起分发的数据。通常包含的数据集较小，用于演示包的特性，而非作为共享数据的主要方式。 |\n| `demo`\
  \ | 可选目录，包含 R 包的演示内容，以 R 源代码文件形式存在。 |\n| `exec` | 可包含其他必需的可执行脚本。仅包含文件，不包含子目录。 |\n\
  | `inst` | 可包含在安装包时复制到安装目录的其他文件。例如，可用于与用户共享`NEWS`文件，或包含图片及其他非标准文档。 |\n| `po` | 用于添加\
  \ C 和 R 错误消息的翻译以及其他本地化相关任务。 |\n| `src` | 通常包含其他语言（如 C、C++或 Fortran）的源代码。这些代码通常需要编译；如果你使用它，通常需要指定一个\
  \ Makefile。 |\n| `tools` | 不常用，但可用于提供配置所需的其他文件。 |\n| `vignettes` | 用于提供一个或多个软件包使用手册或指南。与通常仅针对特定函数的函数文档相比，软件包使用手册通常包含更多入门背景和关于如何使用整个包的完整示例。虽然不是必需，但对用户非常有帮助。\
  \ |\n\n* 表示必需子目录\n\n### 使用 DevTools 启动一个包\n\n在包的根目录下，你至少需要`DESCRIPTION`和`NAMESPACE`文件。你还需要一个名为`R`的子目录，顾名思义，这是放置\
  \ R 代码的地方。这不足以将包提交到 CRAN，但足以启动一个供私人使用的功能性包。然而，即使仅供私人使用，适当的文档也极有帮助。包的目录和文件结构相当复杂，尤其是用文字描述时。因此，作为参考，以下是我们包在学完本章后应具备的最终目录结构，该结构位于`AdvancedRPkg`目录内：\n\
  \n```\n.\n├── data\n│   └── sampleData.rda\n├── DESCRIPTION\n├── man\n│   ├── ggplot.lm.Rd\n\
  │   ├── meanPlot.Rd\n│   ├── sampleData.Rd\n│   └── textplot-class.Rd\n├── NAMESPACE\n\
  ├── R\n│   ├── plot_functions.R\n│   ├── sampledata.R\n│   └── textplot.R\n├── README.md\n\
  └── tests\n├── testthat\n│   └── test_textplot.R\n└── testthat.R\n5 directories,\
  \ 13 files\n```\n\n对于初始设置，我们使用`setup()`函数。我们可以指定更多信息，但最小要求是路径。我们还设置了`rstudio = FALSE`，以便代码能适用于任何编辑器，而不仅仅是\
  \ RStudio。要查看已创建的内容，我们可以使用`list.files()`函数，该函数会显示已创建了`DESCRIPTION`和`NAMESPACE`文件以及一个`R`目录。对于以下代码，请在\
  \ R 命令行中运行，或创建一个新的 R 文件（我们将其命名为`chapter` [`06`](http://dx.doi.org/10.1007/978-1-4842-2077-1_06)\
  \ `.R`）。请注意，调整`path`参数以指向包含 Git 仓库的目录非常重要，即你在本地机器上克隆该仓库的位置。在我们的例子中，R 的工作目录（你可以通过调用`getwd()`函数来检查）位于`AdvancedRPkg`目录的上一级目录。如果你的\
  \ R 会话不在该目录，请调整`path`参数，或使用`setwd()`函数将 R 的工作目录更改为`AdvancedRPkg`的父目录：\n\n```\nsetup(\n\
  path = \"AdvancedRPkg/\",\nrstudio = FALSE)\nCreating package 'AdvancedRPkg' in\
  \ '∼/Apress_AdvancedR/RFiles'\nNo DESCRIPTION found. Creating with values:\nPackage:\
  \ AdvancedRPkg\nTitle: What the Package Does (one line, title case)\nVersion: 0.0.0.9000\n\
  Authors@R: person(\"First\", \"Last\", email = \"first.last@example.com\", role\
  \ = c(\"aut\", \"cre\"))\nDescription: What the package does (one paragraph).\n\
  Depends: R (>= 3.3.1)\nLicense: What license is it under?\nEncoding: UTF-8\nLazyData:\
  \ true\nlist.files(\"AdvancedRPkg\")\n[1] \"DESCRIPTION\" \"NAMESPACE\"   \"R\"\
  \           \"README.md\"\n```\n\n输出还显示了一些字段以及用于填充这些字段的信息。由于这些大多是占位符，我们需要使用文本编辑器（任何编辑器均可，包括\
  \ RStudio）打开文件并进行修改。根据目录，`setup()`函数推测了包名，但其余内容需要填写。我们使用编辑器将这些字段修改为如下内容：\n\n```\n\
  Package: AdvancedRPkg\nTitle: An Example R Package for the Book Advanced R\nVersion:\
  \ 0.0.0.9000\nAuthors@R: c(\nperson(\"Matt\", \"Wiley\", email = \"matt@elkhartgroup.com\"\
  , role = c(\"aut\")),\nperson(\"Joshua F.\", \"Wiley\", email = \"josh@elkhartgroup.com\"\
  , role = c(\"aut\", \"cre\")),\nperson(\"Elkhart Group Ltd.\", role = \"cph\")\n\
  )\nDescription: This package will demonstrate the basics of an R\npackage including\
  \ documentation and tests.\nDepends: R (>= 3.3.1)\nLicense: GPL (>= 3)\nEncoding:\
  \ UTF-8\nLazyData: true\n```\n\n\n\n注意版本号，其格式为`Major.Minor.Patch.DevelopmentVersion`。关于确定软件版本因素的精彩概述，请参见语义化版本规范（[`http://semver.org/`](http://semver.org/)）。该规范在建议方面相当有指导性，但拥有一套固定的规则来确定软件的主版本号或次版本号通常很有帮助。最后一部分`DevelopmentVersion`仅存在于开发版本中，并在发布时被移除。尽管有这些规则和指南，但许多\
  \ R 包的实际版本情况却更加多样和不一致（并非每个人都同意这些规则，即使同意的人也并非总是严格遵守）。\n\n接下来是作者信息，使用`person()`函数描述。除了每个人的姓名和电子邮件外，还使用三个字母的缩写来描述角色和关系。所有可能性都在\
  \ MARC 关系者代码列表中列出（[`www.loc.gov/marc/relators/relaterm.html`](http://www.loc.gov/marc/relators/relaterm.html)）。然而，最常用的缩写包括：`aut`代表作者，`cre`代表创建者（即项目负责人，或者用\
  \ R 术语来说，是遇到问题时要投诉的人——维护者），以及`cph`代表版权持有者。然后，我们用几句话描述包，指定包所依赖的 R 版本、许可证，以及数据可以按需加载（以节省启动时间）。\n\
  \n#### 添加 R 代码\n\n有了包的基本结构后，是时候开始添加一些 R 代码了，这正是包的核心所在！由于本章的重点是打包代码，我们将复用前面章节中的一些函数和类。第一步，我们在`AdvancedRPkg/R/`目录下创建两个文件：`plot_functions.R`和`textplot.R`。\n\
  \n接下来，我们从第 4 章复制最终的`meanPlot()`函数，用于绘制带有均值的图表。我们将此函数的代码以及在第 5 章编写的 S3 方法`ggplot.lm()`一起添加到`plot_functions.R`中。然后，我们将第\
  \ 5 章中`textplot`类的类和方法（`show`和`subset`，即括号运算符`[`）复制到`textplot.R`中。由于容易复制错误的代码，我们建议从我们的\
  \ GitHub 仓库（[`https://github.com/ElkhartGroup/AdvancedRPkg`](https://github.com/ElkhartGroup/AdvancedRPkg)）复制和粘贴代码。如果一切正常，它应该看起来像这样：\n\
  \n```\nlist.files(\"AdvancedRPkg/R\")\n[1] \"plot_functions.R\" \"textplot.R\"\n\
  ```\n\n顺便提一下，决定分成多少个单独的文件可能比较困难。这对 R 本身没有影响，但对开发过程有影响。将所有代码放在一个文件中不好，将每个函数、类和方法都拆分成单独的文件也不好。如果结果文件不太长，我们尝试将相关的函数（如绘图函数）归为一组，并将相关的类和方法归为一组。根据常识，即使可以，也不要给文件起仅通过大小写区分的相同名称；在文件名中使用特殊字符或符号通常也是个坏主意。\n\
  \n现在我们已经有了一个基本的包模板，可以使用`devtools`包中的`load_all()`函数来加载这些函数。我们只需要指定包的路径即可。然后，我们可以看到一些函数在包的命名空间中可用，这通过使用`ls()`函数并指定要列出可用对象的位置来实现：\n\
  \n```\nload_all(\"AdvancedRPkg\")\nLoading AdvancedRPkg\nls(name = \"package:AdvancedRPkg\"\
  )\n[1] \"ggplot.lm\" \"meanPlot\"  \"textplot\"\n```\n\n在第 4 章中，我们简要讨论了作用域问题。编写包时，理解作用域变得更加重要。包的作者可以编写与其他包中函数同名的函数。虽然这些函数不会互相覆盖，但明确你想要调用哪个函数可能会让人困惑。这时包命名空间就很有帮助了。命名空间控制从其他包导入哪些函数（因此被该包内的代码使用），以及从该包导出哪些函数，使其对包的公开可用。你可以使用`import`功能从其他包中导入特定函数。如果你需要另一个包中的许多函数，你可以决定让你的包依赖于那个包，在这种情况下，该包的所有公共函数对你的包都是可用的。导入和依赖另一个包之间的另一个区别在于包加载时发生的情况。如果包\
  \ B 依赖于包 A，当用户调用`library(B)`时，包 B 和包 A 都会被加载并附加。如果包 B 从包 A 导入函数，当用户调用`library(B)`时，包\
  \ B 会被加载并附加，而包 A 会被加载但不会附加。因为包 A 被加载了，它的函数对于包 B 内部的代码是可用的，但由于包 A 未被附加，这些函数不会直接暴露给用户。即使包\
  \ A（或包 B）被加载并附加，也只有导出的函数对用户公开可用。这很有好处，因为它允许包开发者编写和记录仅供内部使用的函数。如果你不需要导出一个函数，那么最好不要导出它。如果两个\
  \ R 包导出了同名的函数，并且用户加载并附加了两个包，那么后加载的包中的函数会屏蔽先加载的包中的函数。对于用户来说，唯一的选择就是不加载并附加其中一个包，或者使用双冒号运算符`PkgA::foo()`、`PkgB::foo()`显式进行函数调用。面对成千上万的\
  \ R 包和更多的函数，只导出必要的函数有助于避免此类名称冲突和屏蔽问题。\n\n所有这些都通过包的`NAMESPACE`文件进行控制。虽然我们没有查看，但我们的包确实有一个`NAMESPACE`文件，它是在我们运行`setup()`时创建的。然而，`load_all()`函数的独特之处在于，默认情况下，当它加载一个包时，它会导出所有对象。这是因为在开发过程中，能够调用所有函数（无论是否导出）通常很方便。\n\
  \n\n\n#### 测试\n\n随着我们为新包添加函数和方法，并能在 R 中运行，我们可以开始考虑质量控制问题。编写能运行的代码固然很棒，但代码能否实现预期功能同样至关重要。然而，“预期”和“期望”并不总是一回事（这就是文档发挥关键作用的地方，我们下一节会谈到）。即便如此，即使对于开发者来说，测试也能确保编写的代码能完成其应有的功能。\n\
  \n测试可以在包开发的任何阶段进行。如果函数、名称和特性正在发生根本性变化，那么此时开始编写大量测试可能为时过早。不过，即使一个包尚未完成，如果某些函数相对稳定，尽早编写测试也会很有帮助。尽早而非推迟编写测试之所以有益，是因为在编写函数之后立即编写测试通常更容易，此时该函数的目的和工作方式在你脑海中还记忆犹新。（如果你不知道或忘记了函数的工作方式，就很难对其进行充分的测试！）。这也有助于确保，如果后面的函数建立在前面的函数之上，那么沿途进行测试可以确保问题出在新编写的函数上，而不是之前的某个构建模块。\n\
  \n抛开好处不谈，编写测试的实际操作因 `testthat` 包而变得更加容易。首先，我们需要在包中创建一个名为 `tests` 的新子目录，位于 `AdvancedRPkg/tests/`。接下来，在第一个子目录内创建第二个名为\
  \ `testthat` 的子目录（即 `AdvancedRPkg/tests/testthat/`），我们将在其中创建运行各种测试的 R 源文件。注意，还有其他测试包的方法。这里我们主要关注使用\
  \ `testthat` 包范式进行测试。\n\n正确测试绘图函数相当困难，因此对于我们的测试，我们检查 `textplot` 的子集方法是否能按预期工作。我们可以创建一个名为\
  \ `test_textplot.R` 的文件，位于 `AdvancedRPkg/tests/testthat/` 下。我们首先调用 `context()`，这表示接下来的测试测试的是相关功能，然后我们为测试套件提供一个总名称\
  \ `textplot`。接下来，我们设置一个简单的 `textplot` 类对象，然后运行一系列测试。这些测试包含两个部分。首先，是对 `test_that()`\
  \ 的外部调用。第一个参数是对测试的描述，第二个参数是执行测试的代码。代码可以包含任何内容，但通常包括对某个 `expect_*()` 函数的调用，此类函数有很多。在做选择之前，我们使用\
  \ `apropos()` 函数调用来显示所有 `expect_*()` 选项：\n\n```\napropos(\"expect_\")\n[1] \"expect_cpp_tests_pass\"\
  \     \"expect_equal\"\n[3] \"expect_equal_to_reference\" \"expect_equivalent\"\n\
  [5] \"expect_error\"              \"expect_failure\"\n[7] \"expect_false\"     \
  \         \"expect_gt\"\n[9] \"expect_gte\"                \"expect_identical\"\n\
  [11] \"expect_is\"                 \"expect_length\"\n[13] \"expect_less_than\"\
  \          \"expect_lt\"\n[15] \"expect_lte\"                \"expect_match\"\n\
  [17] \"expect_message\"            \"expect_more_than\"\n[19] \"expect_named\" \
  \             \"expect_null\"\n[21] \"expect_output\"             \"expect_output_file\"\
  \n[23] \"expect_s3_class\"           \"expect_s4_class\"\n[25] \"expect_silent\"\
  \             \"expect_success\"\n[27] \"expect_that\"               \"expect_true\"\
  \n[29] \"expect_type\"               \"expect_warning\"\n```\n\n我们选择 `expect_is()`\
  \ 来检查对象的类，选择 `expect_equal()` 来检查其他特性。还可以使用 `expect_error()` 或 `expect_warning()`\
  \ 来检查错误检查是否有效，如果代码产生了错误，这两个函数就会“通过”。我们将以下代码放入 `test_textplot.R` 文件中：\n\n```\ncontext(\"\
  textplot\")\ndat <- textplot(\nx = 1:4,\ny = c(1, 3, 5, 2),\nlabels = letters[1:4])\n\
  test_that(\"textplot subset method works with rows only\", {\ntmp <- dat[i = 1:2,\
  \ ]\nexpect_is(tmp, \"textplot\")\nexpect_equal(length(tmp@x), 2)\n})\ntest_that(\"\
  textplot subset method works with variables only\", {\ntmp <- dat[, j = c(\"x\"\
  , \"y\")]\nexpect_is(tmp, \"list\")\nexpect_equal(length(tmp), 2)\nexpect_equal(length(tmp$x),\
  \ 4)\n})\ntest_that(\"textplot subset method works with rows and variables\", {\n\
  tmp <- dat[1:2, j = c(\"x\", \"y\")]\nexpect_is(tmp, \"list\")\nexpect_equal(length(tmp),\
  \ 2)\nexpect_equal(length(tmp$x), 2)\n})\n```\n\n我们可以直接运行这些代码测试。如果一切正常，则没有输出。只有在某些检查未通过时才会产生输出。不过，通常这些代码不会直接运行，而是批量运行。我们通过使用\
  \ `devtools` 包的 `test()` 函数以及我们的包名/路径来运行所有测试。`devtools` 包了解 `testthat` 包的目录结构，因此它们能很好地协同工作。为了运行测试，`test()`\
  \ 首先使用 `load_all()` 加载包，然后执行测试。回到包目录上一级的文件夹，从我们章节级别的 R 文件 `chapter06.R` 中，我们通过执行以下代码来运行所有测试：\n\
  \n```\ntest(\"AdvancedRPkg\")\nLoading AdvancedRPkg\nTesting AdvancedRPkg\ntextplot:\
  \ ........\nDONE =================================================================\n\
  ```\n\n如果存在错误，将会被注明。虽然我们可以直接使用 `devtools` 包来运行测试，但为了让 R 能运行它们，我们需要在 `tests` 目录（即\
  \ `AdvancedRPkg/tests/`）中添加一个名为 `testthat.R` 的简短文件。在这个文件中，我们只需要添加几行代码，如下所示。我们不运行这段代码；这是由\
  \ R 运行的：\n\n```\nlibrary(testthat)\nlibrary(AdvancedRPkg)\ntest_check(\"AdvancedRPkg\"\
  )\n```\n\n现在，我们可以使用 `covr` 包来检查代码覆盖率。`covr` 包（[`github.com/jimhester/covr`](https://github.com/jimhester/covr)）会检查执行测试时代码的不同部分是否被运行。例如，一个包含\
  \ if/else 语句的函数，其部分代码可能只被一个测试执行，除非派生出额外的测试来检查其他条件。同样，尽管开发包并非必需，但它是一个有用的工具，可以了解当前测试对包功能的覆盖程度。高覆盖率（目标是\
  \ 100%）是捕获错误、确保新代码开发不会破坏旧特性和功能的好方法；所有这些也有助于向用户保证你的包是一个好的选择。\n\n虽然我们使用了 `checkpoint`\
  \ 库来实现代码的可重复性，但测试的性质使得这种库的使用难以奏效。因此，需要同时安装 `covr` 和 `testthat`。回到我们顶层的 `chapter06.R`\
  \ 文件中，我们运行 `package_coverage()` 函数来测试我们的测试对我们小包的代码覆盖情况如何。唯一需要的参数是包所在的目录。在我们的例子中，R\
  \ 的工作目录是父目录 `AdvancedRPkg/`。如果你的 R 实例的工作目录不同，你需要指定适当的路径来访问你机器上的 `AdvancedRPkg/`\
  \ 目录：\n\n```\ninstall.packages(c(\"covr\", \"testthat\"))\ncov <- package_coverage(\"\
  AdvancedRPkg\")\n```\n\n输出（如下所示）表明，当前的测试覆盖率约为 36%，这主要来自对 `textplot.R` 中代码的覆盖。还可以使用\
  \ `as.data.frame(cov)` 获得更详细的分析。输出内容很多，因此我们只展示几行几列，但如果你认为自己测试覆盖了所有内容，需要找出代码的哪些方面尚未被测试时，这是一个非常宝贵的资源。\n\
  \n\n```cov\nAdvancedRPkg 覆盖率：35.85%\nR/plot_functions.R：0.00%\nR/textplot.R：52.78%\n\
  as.data.frame(cov)[1:3, c(1, 2, 3, 11)]\nfilename functions first_line value\n1\
  \ R/plot_functions.R  meanPlot          2     0\n2 R/plot_functions.R  meanPlot\
  \          3     0\n3 R/plot_functions.R  meanPlot          4     0\n```\n\n要运行测试，我们需要指出我们的包依赖于\
  \ `testthat` 包。该包的核心功能并不依赖 `testthat`，因此我们将它添加到 `DESCRIPTION` 文件的一个新部分 `Suggests`\
  \ 下。再次使用任意文本编辑器，将 `DESCRIPTION` 修改为以下内容：\n\n```\nPackage: AdvancedRPkgPackagetests\n\
  Title: An Example R Package for the Book Advanced R\nVersion: 0.0.0.9000\nAuthors@R:\
  \ c(\nperson(\"Matt\", \"Wiley\", email = \"matt@elkhartgroup.com\", role = c(\"\
  aut\")),\nperson(\"Joshua F.\", \"Wiley\", email = \"josh@elkhartgroup.com\", role\
  \ = c(\"aut\", \"cre\")),\nperson(\"Elkhart Group Ltd.\", role = \"cph\")\n)\nDescription:\
  \ This package will demonstrate the basics of an R\npackage including documentation\
  \ and tests.\nDepends: R (>= 3.3.1)\nSuggests:\ntestthat\nLicense: GPL (>= 3)\n\
  Encoding: UTF-8\nLazyData: true\n```\n\n最后，完成对包的所有更改后，我们需要通过版本控制进行核查。这可以通过命令行完成，但我们使用的是\
  \ GitHub 桌面客户端。默认情况下，所有更改的文件都会被选中，但我们不会一次性提交所有更改，而是按照相关文件批次进行提交，并附上有意义的说明信息。提交信息会随每次提交一同记录，用于提醒你自己或告知他人所做更改的高层摘要或原因。没有必要详细记录每一处更改，因为\
  \ Git 会精确追踪哪些文件发生了更改以及内容如何变化。\n\n首先，我们选择 `DESCRIPTION`、`NAMESPACE` 和 `.gitignore`\
  \ 文件，并添加说明信息：使用 DESCRIPTION 和 NAMESPACE 初始化 R 包。该过程如图 6-5 所示。\n\n![A393929_1_En_6_Fig5_HTML.jpg](img/A393929_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5.  \nGitHub 桌面客户端选择更改的文件，添加提交信息，并提交到主分支。\n\n接下来，我们添加 `plot_functions.R` 和\
  \ `textplot.R`，并添加提交信息：R 函数的初始提交。最后，我们添加 `testthat.R` 和 `test_textplot.R`，并添加提交信息：添加质量控制的测试。当然，你也可以在文件创建过程中随时提交它们。如果切换到\
  \ GitHub 桌面客户端的“历史记录”标签页，我们可以查看所做的更改。如果我们希望将这些更改公开，则点击“同步”按钮，该操作会从 GitHub 仓库拉取更改到本地仓库，并将所有已提交的更改从本地仓库推送到\
  \ GitHub 仓库。请注意，在同步之前，所有更改都应已提交，因为同步的内容并非目录中的实际文件，而是 Git 仓库。只有当更改被提交时，它们才会被添加到本地\
  \ Git 仓库；因此，如果不提交，更新就不会被添加到本地仓库，也就不会被推送到远程（GitHub）仓库。图 6-6 展示了这种情况。\n\n![A393929_1_En_6_Fig6_HTML.jpg](img/A393929_1_En_6_Fig6_HTML.jpg)\n\
  \n图 6-6.  \nGitHub 桌面客户端显示提交历史记录以及右上角的同步按钮。\n\n我们只是浅尝了测试的皮毛，显然我们的包距离全面测试还有很长的路要走。不过，这些工具应该能让你在测试和质量控制方面走上正轨（并且领先于\
  \ CRAN 上的大多数 R 包）。下一个关键部分是文档，这是我们接下来要讨论的主题。\n\n### 使用 roxygen2 编写文档\n\nR 中函数、数据、类及方法的文档位于包的\
  \ `man` 子目录中，通过使用扩展名为 `.Rd` 的特殊 R 文档文件完成。然而，对于程序员来说，这可能会更困难，因为文档与实际 R 代码是分离的。此外，还必须编写大量标记内容，而这些只是标准模板的一部分。`roxygen2`\
  \ 包完全自动化了这一过程，包括子目录的创建，并通过在 R 代码旁使用特殊格式的注释，提供了一种更简单的文档编写方式。运行 `roxygen2` 包后，这些特定注释会被转换为\
  \ `man` 目录中格式正确的 `.Rd` 文件，从而 R 包拥有了创建包函数帮助文件所需的一切。在本节中，我们将了解如何为多种类型的对象编写文档，包括函数、数据、类和方法。\n\
  \n\n#### 函数\n\n使用 `roxygen2` 记录对象时，文档需添加在特殊注释引导符 `##'` 或 `#'` 之后。由于 `#` 是 R 的注释符，R\
  \ 会忽略它，但特殊的单引号会指示 `roxygen2` 将这些信息处理为文档。请注意，这种语法禁止了对该代码进行注释。所有这些代码都添加在 `meanPlot()`\
  \ 函数代码上方的 `plot_functions.R` 文件中。\n\n如前所述，由于语法原因，注释被禁止执行；因此，顺序变得至关重要。要了解哪部分对应哪个格式项，只需记住有三个部分仅通过换行符分隔：`title`（标题）、`description`（描述）和\
  \ `details`（详细信息）。`details` 部分是可选的。为了读者清晰起见，我们在换行符之间添加了空格。函数参数通过使用 `@param argument_name\
  \ 参数的简要描述` 来指示。此处列出的参数名称必须与函数中的命名参数完全匹配。`@return` 部分用于指明函数返回何种类型的对象。在本例中，调用该函数是为了产生绘图这一副作用，其返回值并不重要。`@author`\
  \ 之后可以添加任意文本，以指示函数的编写者。通常，如果作者与整体包的作者相同，则不需要 `@author` 部分。为了使函数公开可用，必须将其导出。这通过使用指令\
  \ `@export` 来实现。`roxygen2` 包会将其转换为 `NAMESPACE` 文件中的额外代码行，指示应导出该函数。`@keywords` 部分是可选的。最后，对读者最有用的部分之一是\
  \ `@examples` 部分，它为读者提供了可执行的示例，是演示如何使用函数的最简单方法之一。\n\n```\n##' 绘制数据及均值汇总的函数\n##'\n\
  ##' 这是一个简单的函数，旨在方便绘制原始数据\n##' 以及在每个 x 轴数值处显示均值的点。\n##'\n##' 尽管此函数可用于任何适用于 \\code{plot}\
  \ 的数据类型，\n##' 但当 x 轴数值为离散值时效果最佳，\n##' 这样在同一个 x 轴数值处有多个 y 值，\n##' 从而可以计算多个值的均值。\n\
  ##'\n##' @param formula 一个公式，指定用于 y 轴的变量\n##'   和用于 x 轴的变量。\n##' @param d 一个数据框类对象，包含\
  \ \\code{formula} 中指定的变量。\n##' @return 调用该函数是为了产生创建绘图这一副作用。\n##' @author Wiley\n\
  ##' @export\n##' @keywords plot\n##' @examples\n##' # meanPlot 的使用示例\n##' meanPlot(mpg\
  \ ∼ factor(cyl), d = mtcars)\n```\n\n现在要生成文档，我们可以运行 `roxygen2` 包。这可以直接通过使用 `roxygenize()`\
  \ 函数并为其提供包目录的路径来完成，也可以通过使用 `devtools` 包中的 `document()` 函数来完成。我们指定包目录，其余过程自动进行。输出显示已写入文档文件（`meanPlot.Rd`）并已写入\
  \ `NAMESPACE` 文件：\n\n```\ndocument(\"AdvancedRPkg\")\nUpdating AdvancedRPkg documentation\n\
  Loading AdvancedRPkg\nUpdating roxygen version in  ∼\\RFiles\\AdvancedRPkg/DESCRIPTION\n\
  Writing NAMESPACE\nWriting meanPlot.Rd\n```\n\n在构建或安装时，R 文档文件会被转换为 HTML 和 PDF 格式。不过，您已经可以预览文档的开发版本。在\
  \ R 控制台中，常规的获取函数帮助的方式现在应该可以工作了：\n\n```\n?meanPlot\n```\n\n如果您使用 RStudio，您也可以打开该文件并进行预览。生成的\
  \ HTML 文件（在构建包之后）如图 6-7 所示。由于此函数的简单性，同时也为了节省篇幅，我们编写了相当简洁的文档。通常，为用户和未来参考提供更详尽的文档，并仔细解释每个参数可以接受和不能接受的内容是很有帮助的。如果函数实现了新的过程或统计方法，通常也会通过使用\
  \ `@references` 部分包含一些参考文献。\n\n![A393929_1_En_6_Fig7_HTML.jpg](img/A393929_1_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7. `meanPlot()` 函数的 R 文档文件的 HTML 输出\n\n#### 数据\n\n在记录数据之前，我们需要向包中添加一些数据。首先，在我们的包文件夹中创建一个\
  \ `data` 子目录，路径为 `AdvancedRPkg/data/`。然后，我们使用接下来的代码在我们的 `chapter06.R` 文件中创建一个小样本数据框，并将其保存为\
  \ `.rda` 文件。再次注意，该文件需要根据 R 的当前工作目录给出指向 `AdvancedRPkg/data/` 的正确路径：\n\n```\nsampleData\
  \ <- data.frame(\nNum = 1:10,\nLetter = LETTERS[1:10])\nsave(sampleData, file =\
  \ \"AdvancedRPkg/data/sampleData.rda\")\n```\n\n我们添加以下代码，在一个名为 `sampledata.R` 的新文件中记录数据，该文件位于\
  \ `R` 子目录（即 `AdvancedRPkg/R/sampledata.R`）中。这提供了数据的标题和详细信息，以及特殊参数 `@format` 以指示数据的格式或类型，以及\
  \ `@source` 以指示数据来源。在末尾的引号中，给出了对象的名称。\n\n```\n##' 数字与字母。\n##'\n##' 一个包含 10 个数字和字母的样本数据集，包含两个变量：\n\
  ##'\n##' \\itemize{\n##'   \\item Num. 一个数字。\n##'   \\item Letter. 一个大写字母（A 至 J）\n\
  ##' }\n##'\n##' @format 一个包含 10 行和 2 个变量的数据框\n##' @source 创建为样本数据\n\"sampleData\"\
  \n```\n\n使用 `document()` 函数对包重新进行 roxygenize 后，生成的 HTML 如图 6-8 所示，同样是通过使用完全构建的包中的帮助工具或通过\
  \ RStudio 的预览功能获得。\n\n![A393929_1_En_6_Fig8_HTML.jpg](img/A393929_1_En_6_Fig8_HTML.jpg)\n\
  \n图 6-8. `sampleData` 数据集的 R 文档文件的 HTML 输出\n\n#### 类\n\nS3 类是非正式的，通常不记录文档。S4 类则很容易记录文档。它们的文档直接放置在\
  \ `textplot.R` 文件（`AdvancedRPkg/R/textplot.R`）中 `setClass()` 调用的上方，包含一个标题、一个详细信息部分，然后是一些参数——每个槽位名称对应一个\
  \ `@slot`，详细说明该槽位的名称和功能。要在包中使用 S4 系统，我们还需要添加 `methods` 包，通过添加 `@import methods`\
  \ 并将其添加到 `DESCRIPTION` 文件的 `Imports` 字段中来实现。带有新 `Imports` 字段的更新后的 `DESCRIPTION`\
  \ 文件如下所示；通常，`Imports` 部分紧跟 `Depends` 部分之后：\n\n```\nImports:\nmethods\n```\n\n该类完整的文档如下代码所示：\n\
  \n```\n##' 用于保存文本及笛卡尔坐标以进行绘图的 S4 类\n##'\n##' 一个旨在保存创建文本图所需数据的类，\n##' 在该文本图中，基于 x\
  \ 和 y 坐标绘制字符串。\n##'\n##' @slot x 一个数值，包含 x 轴坐标。\n##' @slot y 一个数值，包含 y 轴坐标。\n##'\
  \ @slot labels 一个字符串，包含要绘制的文本\n##' @import methods\n```\n\n使用 `document()` 函数对包重新进行\
  \ roxygenize 后，生成的 HTML 如图 6-9 所示。\n\n![A393929_1_En_6_Fig9_HTML.jpg](img/A393929_1_En_6_Fig9_HTML.jpg)\n\
  \n图 6-9. S4 类 `textplot` 的 R 文档文件的 HTML 输出\n\n\n\n#### 方法\n\n为方法编写文档与为常规函数编写文档类似。S3\
  \ 方法可以没有文档，也可以作为函数进行文档化。以下是为 `ggplot.lm` 方法添加的 `roxygen2` 样式文档。该代码紧跟在 `AdvancedRPkg/R/plot_functions.R`\
  \ 文件中的函数定义之上。请注意，我们在此处导入了 `ggplot2` 包，以便可以使用它。我们还将 `ggplot2` 包添加到 `DESCRIPTION`\
  \ 文件的 `Imports` 部分下，并用逗号与包所依赖的 R 版本分隔开。新的 `DESCRIPTION` 文件的 `Depends` 部分如下所示：\n\n\
  ```\nImports:\nmethods,\nggplot2\n```\n\n通过导入它，`roxygen2` 将自动将适当的导入代码添加到 `NAMESPACE`\
  \ 文件中：\n\n```\n##' 绘制线性模型的方法\n##'\n##' 使用 ggplot 绘制线性模型并附带 95% 置信区间的简单方法。\n##'\n\
  ##' @param data 来自 \\code{lm} 的线性模型对象\n##' @param mapping 常规映射，详情请参阅 \\code{ggplot}\
  \ 和 \\code{aes}。\n##' @param vars 用于预测的变量值列表。\n##' @param \\ldots 传递给 \\code{ggplot}\
  \ 的附加参数。\n##' @return 一个 ggplot 类对象。\n##' @export\n##' @import ggplot2\n##' @examples\n\
  ##' ggplot(\n##'   lm(mpg ∼ hp * qsec, data = mtcars),\n##'   aes(hp, mpg, linetype\
  \ = factor(qsec)),\n##'   vars = list(\n##'     hp = min(mtcars$hp):max(mtcars$hp),\n\
  ##'     qsec = round(mean(mtcars$qsec) + c(-1, 1) * sd(mtcars$qsec)), 1)) +\n##'\
  \   geom_ribbon(aes(ymin = LL, ymax = UL), alpha = .2) +\n##'   geom_line() +\n\
  ##'   theme_bw()\n```\n\nS4 方法可以单独编写文档，也可以与泛型函数一起编写文档，或者与类一起编写文档。这可以通过使用 `@describeIn`\
  \ 参数来实现，该参数用于替代标题。对于我们的 S4 方法，我们将它们与类一起编写文档。`roxygen2` 代码相对简洁。我们可以添加详细信息，但并非必需。`roxygen2`\
  \ 包会负责注册这些方法，因此我们真正需要做的只是添加任何特殊注释并记录参数的使用。`show()` 方法的文档如下所示：\n\n```\n##' @describeIn\
  \ textplot show 方法\n##'\n##' @param object 要显示的对象\n```\n\n接下来是 `` 运算符方法的文档。请注意，我们还导出了\
  \ `[` 方法并添加了一个别名，这是用户查找该方法的另一种方式：\n\n```\n##' @describeIn textplot 提取方法\n##'\n##'\
  \ @param x 要子集化的对象\n##' @param i 要子集化的行（可选）\n##' @param j 要子集化的列（可选）\n##' @param\
  \ drop 应缺失\n##' @export\n##' @aliases [,textplot-method\n```\n\n通过使用 `document()`\
  \ 重新运行 `roxygen2` 后，更新后的 HTML 帮助文件如图 [6-10 所示，其中包含了该类以及附加方法的文档。\n\n![A393929_1_En_6_Fig10_HTML.jpg](img/A393929_1_En_6_Fig10_HTML.jpg)\n\
  \n图 6-10.\n\nS4 类 `textplot` 的 R 文档文件的 HTML 输出（附带了方法文档）\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n## 构建、安装和分发 R 包\n\n与 Git 类似，在构建 R 包时，忽略目录中的某些文件会很有帮助。我们在主目录 `AdvancedRPkg/`\
  \ 中创建一个名为 `.Rbuildignore` 的文件，其中包含以下代码。该文件应与 `DESCRIPTION` 文件处于同一层级：\n\n```\ndesktop.ini\n\
  .Rhistory\n.RData\n```\n\n在通过再次运行 `document(\"AdvancedRPkg\")` 确保文档是最新的之后，我们就基本准备好了。此时，我们做了一些更改，因此将更改添加并提交到\
  \ Git 仓库（如果您一开始选择了这样做）是一个好主意。虽然您可以通过运行 `git add` 一次性添加所有文件，但根据相似主题将更改分块提交，信息更丰富，并且以后（如果需要）也更容易回退。例如，我们为以下每一项使用了单独的提交，这些提交在后面的代码中分块展示：\n\
  \n-   更新的代码文件（`AdvancedRPkg/R/` 目录中的每个文件）、`DESCRIPTION` 和 `NAMESPACE`，提交信息为“added\
  \ roxygen style documentation”\n-   示例数据，提交信息为“added sample data”\n-   更新的文档文件（`AdvancedRPkg/man/`\
  \ 目录中的每个文件），提交信息为“re-roxygenized package”\n-   `.Rbuildignore` 文件，提交信息为“adding file\
  \ to ignore files during package build”\n\n现在，我们可以使用 `chapter06.R` 文件中来自 `devtools`\
  \ 包的 `build()` 函数，将该包构建成一个压缩的源代码 tar 包。输出显示了构建过程，并在最后生成一个 `.tar.gz` 文件：\n\n```\n\
  build(\"AdvancedRPkg\")\n\"c:/usr/MRO/MRO-3.3.1/bin/x64/R\" --no-site-file --no-environ\
  \  \\\n--no-save --no-restore --quiet CMD build \"∼\\Apress_AdvancedR\\RFiles\\\
  AdvancedRPkg\"  \\\n--no-resave-data --no-manual\n* checking for file '∼\\Apress_AdvancedR\\\
  RFiles\\AdvancedRPkg/DESCRIPTION' ... OK\n* preparing 'AdvancedRPkg':\n* checking\
  \ DESCRIPTION meta-information ... OK\n* checking for LF line-endings in source\
  \ and make files\n* checking for empty or unneeded directories\n* looking to see\
  \ if a 'data/datalist' file should be added\n* building 'AdvancedRPkg_0.0.0.9000.tar.gz'\n\
  [1] \"∼/Apress_AdvancedR/RFiles/AdvancedRPkg_0.0.0.9000.tar.gz\"\n```\n\n我们可以安装并使用它。然而，再运行一轮检查会很有帮助。`devtools`\
  \ 包中的 `check()` 函数会对该包运行 `Rcmd check`。参数 `cran = TRUE` 使用针对 CRAN 的测试。以下代码应从我们的 `chapter06.R`\
  \ 文件中运行。输出内容很多，因此我们省略了许多正常工作的部分，并重点突出一些可能表明存在需要解决的问题的检查。省略的输出用 `[. . .]` 表示。\n\n\
  ```\ncheck(\"AdvancedRPkg\", cran = TRUE)\nUpdating AdvancedRPkg documentation\n\
  Loading AdvancedRPkg\n[. . .]\n* using R version 3.3.1 (2016-06-21)\n[. . .]\n*\
