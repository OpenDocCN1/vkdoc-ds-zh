- "# 6. 编写一个包\n\n包是记录、共享和分发 R 代码和数据的基本方式。我们的目标是编写自己的包，需要提醒的是，由于 R 包开发过程中会用到许多软件工具，本章会特别复杂。\n\
  \n在本章中，我们使用了四个包。`devtools`包（Wickham and Chang, 2016）提供了一系列函数来帮助搭建、文档化和管理 R 包的开发。`roxygen2`包（Wickham,\
  \ Danenberg, and Eugster, 2015）通过允许使用注释在函数旁边内联编写函数文档，极大地简化了 R 包文档的编写。我们还使用了另外两个不那么关键的包。`testthat`包（Wickham,\
  \ 2011）不是必需的，但它提供的函数通过测试函数是否返回预期值来促进质量控制。同样，`covr`包（Hester, 2016）通过测试被测试执行的包代码的百分比（覆盖率）来促进质量控制。理想情况下，100%的代码都应被测试覆盖，尽管实际上许多\
  \ R 包没有测试，因此任何覆盖率都优于平均水平。在包中，我们使用了第[5 章中用于`ggplot2`的方法之一，因此我们还包含了大家熟悉的`ggplot2`（Wickham,\
  \ 2009）包。\n\n编写包可能是一个复杂的过程。熟悉最终产品可能会有所帮助，该产品可在[`https://github.com/ElkhartGroup/AdvancedRPkg`](https://github.com/ElkhartGroup/AdvancedRPkg)\
  \ 在线获取。在阅读本章时，如果你不确定某个文件位置是否正确或设置是否正确，我们也建议参考我们官方 GitHub 上的包记录。以下代码加载了`checkpoint`（Microsoft\
  \ Corporation, 2016）包以控制所用 R 包的精确版本，然后加载所需的包：\n\n```\n## load checkpoint and required\
  \ packages\nlibrary(checkpoint)\ncheckpoint(\"2016-09-04\", R.version = \"3.3.1\"\
  )\nlibrary(testthat)\nlibrary(devtools)\nlibrary(roxygen2)\nlibrary(covr)\nlibrary(ggplot2)\n\
  options(width = 70) # only 70 characters per line\n```\n\n\n\n## 开始之前\n\n本章涵盖编写\
  \ R 包的一些基础知识，并介绍一些工具来简化官方手册《编写 R 扩展》（在线地址：[`https://cran.r-project.org/doc/manuals/R-exts.html`](https://cran.r-project.org/doc/manuals/R-exts.html)）中未包含的流程。该手册技术性可能较强，但它是一份权威指南。如果你计划向\
  \ `CRAN` 提交 R 包，这是必读材料；即使你只打算为自己或更有限的用户群体（如你的公司或实验室小组）开发包，也建议阅读。\n\n许多 R 包包含来自其他编程语言的代码，例如\
  \ `C`、`C++`、`Fortran` 或 `Java`。这通常是因为像 `C` 这样的语言可以被编译和优化，运行速度远快于 `R`，因此包开发者可能会选择将计算密集型的代码部分用编译型且高效的语言编写。然而，本章我们只讨论如何编写包含纯\
  \ `R` 代码或数据的 R 包，因为其流程几乎相同，大多数差异仅在于所包含语言的特殊性（例如 `makefiles`）。\n\n在开发 R 包之前，需要一些工具。实际上，对于那些不习惯软件开发的人来说，编写\
  \ R 包可能需要一套相当令人生畏的工具链。如果你使用的是 Linux 系统，很可能已经安装了其中许多工具，或者可以轻松安装它们。在 Windows 和 Mac\
  \ OS 上，可能需要更多设置。无论哪种系统，这些工具都必须可访问，这意味着要将它们添加到系统路径中，以便在命令行调用时能够找到。\n\n如果使用 Windows，所需的主要工具（一些命令行工具以及编译器）可从二进制安装程序获得，地址为\
  \ [`https://cran.r-project.org/bin/windows/Rtools/`](https://cran.r-project.org/bin/windows/Rtools/)。在安装的最后一步之前，有两个复选框，其中一个可能未被选中，它负责将这些工具添加到系统路径。请将两个复选框都选中。另外，你还需要\
  \ `LaTeX`，一个排版系统。`MiKTeX` 是一个流行的选择（[`www.miktex.org/`](http://www.miktex.org/)）；如果你的系统是\
  \ 64 位，请务必选择 64 位选项。虽然在大多数情况下，这两个软件的默认选项已经足够，但我们建议 `MiKTeX` 用户将“即时安装默认包”的选项改为“是”。关于所需工具链的更多详细信息，请参见\
  \ R 手册：[`https://cran.r-project.org/doc/manuals/R-admin.html#The-Windows-toolset`](https://cran.r-project.org/doc/manuals/R-admin.html#The-Windows-toolset)。\n\
  \n如果使用 Mac OS，请从 App Store 获取 `Xcode`（开发者工具）。你可能还需要获取 `XQuartz`（[`https://xquartz.macosforge.org/`](https://xquartz.macosforge.org/)）。与\
  \ Windows 一样，你需要 `LaTeX`。`MacTeX` 是一个选择（[`www.tug.org/mactex/`](http://www.tug.org/mactex/)）。其他详细信息请参见\
  \ R 手册（[`https://cran.r-project.org/doc/manuals/R-admin.html#OS-X`](https://cran.r-project.org/doc/manuals/R-admin.html#OS-X)）。\n\
  \n在着手编写第一个 R 包之前，还需要做两个决定。首先，给 R 包起什么名字？这项看似简单的任务变得复杂，因为目前 `CRAN` 上有超过 8000 个 R\
  \ 包，而且数量正在快速增长（[`https://cloud.r-project.org/web/packages/available_packages_by_name.html`](https://cloud.r-project.org/web/packages/available_packages_by_name.html)）。虽然你可以给一个不打算上传到\
  \ `CRAN` 的包起一个与 `CRAN` 上已存在的包相同的名字，但如果你将来使用该 `CRAN` 包或任何依赖它的其他包，这样做就会产生问题。即使你的包不提交到\
  \ `CRAN`，将来也可能有其他人编写一个同名包并提交到 `CRAN`。出于这些原因，选择包名需要深思熟虑。在本章中，所有示例都将构建一个名为 `AdvancedRPkg`\
  \ 的 R 包。第二个决定是给包使用什么许可证。如果你计划提交到 `CRAN`，许可证必须与 `CRAN` 兼容。即使包永远不会提交到 `CRAN`，许可证可能仍然相关。在本章中，我们使用\
  \ `GPLv3` 许可证。\n\n\n\n### 版本控制\n\n到目前为止，我们讨论的都是相对随意的代码开发、一些基础编程、函数和类。开发新的 R 包则更为复杂，需要管理更多的文件。面对这种更高的复杂性，拥有一个高效的系统来备份文件并回溯到早期版本会很有帮助。版本控制系统提供了一种绝佳的方式，既能备份代码，又能将更改回滚到之前的版本（例如，当实现新功能的修改破坏了旧功能或引入了\
  \ bug 时）。目前存在多种版本控制系统，但当下最流行的或许是开源软件 `Git`，它最初是为 Linux 内核提供版本控制而开发的。`Git` 可以直接通过命令行使用，也可以通过多种图形界面使用。许多人使用\
  \ `GitHub`（<https://github.com/>），这是一项基于 `Git` 的服务，它在线托管仓库，且对公共项目免费。`GitHub` 也为\
  \ Windows 和 Mac OS 提供了图形界面（<https://desktop.github.com/>）。然而，如果你不想学习或使用 `Git` 或其他版本控制系统，可以放心地忽略本节以及本章中所有仅与版本控制相关的命令。\n\
  \n我们在本章中使用 `Git`（和 `GitHub`）为 Windows 环境下的示例 R 包提供版本控制。具体来说，本书使用的是 Windows 版 GitHub\
  \ 桌面客户端 v3.3.0。`Git` 仓库可以只在本机使用，但配合 `GitHub` 使用可以方便地协作开发包，并轻松地与其他人共享早期包代码。\n\n可以通过命令行设置\
  \ `Git` 仓库，但对于新用户来说，最直观的方式或许是在线直接通过 `GitHub` 创建一个新的 `Git` 仓库。我们为本章开发的 R 包创建了一个新仓库，并将其命名为\
  \ `AdvancedRPkg`。该仓库初始化时包含一个 `README` 文件，稍后我们将对其进行编辑。我们可以通过将某些文件或具有特定扩展名的文件添加到一个名为\
  \ `.gitignore` 的文件中，来告诉 `Git` 忽略它们。每个文件或扩展名单独占一行。我们可以稍后编辑它，但现在，我们只需让 `GitHub` 创建一个。图\
  \ 6-1 展示了进行此操作的步骤。\n\n![A393929_1_En_6_Fig1_HTML.jpg](img/A393929_1_En_6_Fig1_HTML.jpg)\n\
  \n**图 6-1.** 用于创建 `AdvancedRPkg` 仓库的 GitHub 页面\n\n如果一切按计划进行，结果应该类似于图 6-2。该仓库除了 `README`\
