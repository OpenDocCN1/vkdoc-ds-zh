  \n**图 6-2.** 显示已创建的 `AdvancedRPkg` 仓库的 GitHub 页面\n\n接下来，我们可以将这个仓库克隆到本地计算机上。这实质上创建了一个本地副本，我们将在其中进行包的编写。为此，请打开\
  \ GitHub 桌面客户端，点击 + 号，选择“克隆”（Clone），然后选择该仓库，如图 6-3 所示。\n\n![A393929_1_En_6_Fig3_HTML.jpg](img/A393929_1_En_6_Fig3_HTML.jpg)\n\
