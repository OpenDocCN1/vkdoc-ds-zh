  \n我们从 `lapply` 开始，它接收一个列表输入，并将给定的函数应用于列表中的每个元素。正如其前缀所示，该函数返回一个列表，其中包含应用输入函数后的结果：\n\
  \n```\nxL <- 1:5\nxL\n[1] 1 2 3 4 5\n### 返回一个列表\nlapply(xL, is.integer)\n[[1]]\n\
  [1] TRUE\n[[2]]\n[1] TRUE\n[[3]]\n[1] TRUE\n[[4]]\n[1] TRUE\n[[5]]\n[1] TRUE\n```\n\
  \n如你所见，这相当混乱。为了简化，我们使用几乎相同的函数调用，但加上 `s` 前缀（代表 simple，简化版），如下所示：\n\n```\nsapply(xL,\
  \ is.integer)\n[1] TRUE TRUE TRUE TRUE TRUE\n```\n\n尽管这两个函数本身都很有用，但它们依赖于正确的输入。当然，我们的代码也依赖于这种正确输入（所谓“垃圾进，垃圾出”）。不过，我们可以通过\
  \ `vapply` 函数向 R 表明我们期望的结果类型。它接收第三个输入，用于设定我们期望的输出类型。当函数没有返回正确的值类型时会发生什么呢？这里我们运行两行代码，告诉函数我们期望\
