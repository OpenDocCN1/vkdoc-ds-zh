  `check()` 函数包含几个步骤。它首先确保文档是最新的，然后构建一个源代码包的 tar 包，接着对其运行 `Rcmd check`。在这里我们可以看到，检查捕获了不少问题。所有问题基本上都可以归结为没有明确告诉
  R 需要导入或依赖哪些函数或包。大多数问题源于包和交互式 R 工作方式的差异。在交互式会话中，默认会加载 `base`、`methods`、`graphics`、`utils`
  和 `stats` 等包，即使没有显式调用 `library(stats)`。这意味着在交互式会话中，许多函数默认就在搜索路径上。在包中，R 在最近的版本中变得更加严格，要求
  `base` 包之外的所需函数必须被显式导入。检查甚至建议我们可以在命名空间中添加什么。我们使用的是 `roxygen2` 包，所以与其将这些添加到命名空间，不如将它们添加到
  R 代码文件中。具体来说，在 `AdvancedRPkg/R/plot_functions.R` 中，紧接在 `@export roxygen2` 语句之后，我们为
  `meanPlot()` 添加如下内容：


  ```

  ##'' @importFrom graphics plot points

  ##'' @importFrom stats formula

  ```


  在同一文件中，为 `ggplot.lm()` 方法添加：


  ```

  ##'' @importFrom stats predict qnorm

  ```


  在 `AdvancedRPkg/R/textplot.R` 中，紧接在 `@param object roxygen2` 语句之后，为 `show()` 方法添加：


  ```

  ##'' @importFrom utils head

  ```


  此外，对于某些全局变量，也出现了类似的“未找到可见绑定”问题。这来自 `ggplot.lm()` 方法；因为它使用了 `within()`，所以 R 无法判断这些变量已被定义，即使它们是在包含它们的数据框环境中查找的。虽然这是一个有点虚假的提示，但清除所有提示是很好的做法。一种解决方案是在我们的
  R 文件中的某个地方添加一个 `globalVariables()` 调用。在 `AdvancedRPkg/R/plot_functions.R` 的顶部，我们添加以下内容：


  ```

  globalVariables(c("fit", "se.fit"))

  ```


  最后指出的问题是，在一个示例中找不到 `ggplot()` 函数。因为我们的包导入了 `ggplot2` 包，所以 `ggplot()` 函数对我们包内部的代码是可用的。然而，如果用户只加载我们的包，`ggplot2`
  函数并不会加载到用户的搜索路径上。函数的示例是作为用户运行的，因此该函数不可用，R 会抛出错误。这里的最佳前进路径比较复杂。我们可以省略这个示例，但那样文档就缺少了帮助性。我们可以将
  `ggplot2` 从 `DESCRIPTION` 文件的 `Imports` 字段移到 `Depends` 字段。依赖的包会在加载一个包之前被加载。这种方法的缺点是强制用户在使用我们的包时必须加载
  `ggplot2`。这增加了用户遇到函数屏蔽的机会，因为它强制加载了许多包。我们也可以确保代码不被运行。最后，我们可以通过添加 `ggplot2::function()`
  来显式指向 `ggplot2` 包。这很繁琐，因为我们在那个示例中使用了多个 `ggplot2` 函数，并且需要在整个示例中添加。但是，这确保了示例能够工作，并且避免了将
  `ggplot2` 加载到用户的搜索路径上。当然，用户如果愿意，也可以通过自己显式调用 `library(ggplot2)` 来自由加载 `ggplot2`。在
  `AdvancedRPkg/R/plot_functions.R` 文件中，我们编辑 `ggplot.lm()` 示例的 `roxygen2` 代码，如下所示：


  ```

  ##'' @examples

  ##'' ggplot2::ggplot(

  ##''   lm(mpg ∼ hp * qsec, data = mtcars),

  ##''   ggplot2::aes(hp, mpg, linetype = factor(qsec)),

  ##''   vars = list(

  ##''     hp = min(mtcars$hp):max(mtcars$hp),

  ##''     qsec = round(mean(mtcars$qsec) + c(-1, 1) * sd(mtcars$qsec)), 1)) +

  ##''   ggplot2::geom_ribbon(ggplot2::aes(ymin = LL, ymax = UL), alpha = .2) +

  ##''   ggplot2::geom_line() +

  ##''   ggplot2::theme_bw()

  ```


  接下来我们重新运行 `check()` 函数。如果一切顺利，我们应该得到一个 OK 的状态，如下所示：


  ```

  check("AdvancedRPkg", cran = TRUE)

  Updating AdvancedRPkg documentation

  [. . .]

  * DONE

  Status: OK

  R CMD check results

  0 errors | 0 warnings | 0 notes

  ```


  此时，我们可以将所有更改提交到 Git 仓库，并与 GitHub 同步。我们也可以安装这个包。首先，打开一个终端，导航到包含我们包的文件夹（不是包目录本身，而是包含包目录的目录）。在支持
  R 的终端（例如 Windows 命令提示符，如果你确保安装 R 时已将其添加到系统路径，则可以是任何终端）中，我们可以运行 `R CMD INSTALL`：


