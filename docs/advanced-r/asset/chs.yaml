  \ 3-4 中展示以下代码的绘图结果。正如你可能从《R 入门》中学到的，`par()`函数提供了一种将多个图形嵌入到单个图像中的方法：\n\n![A393929_1_En_3_Fig4_HTML.jpg](img/A393929_1_En_3_Fig4_HTML.jpg)\n\
  \n**图 3-4.** 应用于`mtcars`两个子集的`plot`函数\n\n```r\npar(mfrow = c(2, 1))\nmapply(plot,\
  \ mtcars[, c(\"mpg\", \"hp\")], mtcars[, c(\"disp\", \"qsec\")])\n$mpg\nNULL\n$hp\n\
  NULL\n```\n\n递归是一种强大的编程思想，我们将在后续章节中进一步探讨。现在，先考虑这个例子：假设有一排人沿着建筑物的拐角排成一列，你不确定队伍有多长。你可以离开自己的位置，慢慢走到队伍前面，数一数人数。这是常规的迭代——就像循环一样，`apply`函数大多在为我们做这件事。另一方面，你可以保持自己的位置，问前面的人：“你前面有多少人？”如果那个人重复你的问题，最终会传到队伍最前面，那个人可能会转过身说：“零！”然后沿着队伍传回你这里，你就能得到答案。\n\
  \n让我们看看列表`zL`。如果我们对其使用`lapply()`会怎样？这并不好，因为`lapply()`会将每个元素传递给`mean()`，而`mean()`无法处理列表！我们在以下代码中展示了这一点，其中包括我们的列表以及首次尝试计算算术平均值：\n\
  \n```r\nzL <- list( a = list(1, 2, 3:5), b = list(8:12))\nzL\n$a\n$a[[1]]\n[1] 1\n\
  $a[[2]]\n[1] 2\n$a[[3]]\n[1] 3 4 5\n$b\n$b[[1]]\n[1]  8  9 10 11 12\nlapply(zL,\
  \ FUN = mean)\n$a\n[1] NA\n$b\n[1] NA\nWarning messages:\n1: In mean.default(X[[i]],\
  \ ...) :\nargument is not numeric or logical: returning NA\n2: In mean.default(X[[i]],\
  \ ...) :\nargument is not numeric or logical: returning NA\n```\n\n递归应用函数`rapply()`是解决方案。根据所需的具体结果，该函数有一些有趣的选项。强烈建议查阅帮助文件，不过我们在此不再深入探讨该函数。\n\
  \n```r\nrapply(zL, f = mean)\na1 a2 a3  b\n1  2  4 10\n```\n\n可以使用比`mean()`或`sd()`更“高级”的函数。在下一章中，我们将深入探讨这些函数可能的形式及其功能。现在，让我们花点时间讨论环境。\n\
  \n环境是函数和变量所处的“世界”。我们主要处于全局环境中。实际上，我们的循环以某种方式创建了微型环境。这就是为什么如果我们希望在循环结束后保留某些信息，需要创建那些空的占位符变量。通过使用`environment()`和`ls()`函数，我们可以查看环境并列出当前使用的变量。注意，我们处于全局环境中，使用的大多数变量都存在：\n\
  \n```r\nenvironment()\n\nls()\n[1] \"forTime\"  \"forTime2\" \"i\"        \"vTime\"\
  \    \"x\"        \"xCube\"    \"xL\"       \"y\"        \"yL\"       \"z\"    \
  \    \"zL\"\n```\n\n当然，这仅仅是另一个列表。有时，对此进行操控和使用也很方便。因此，我们的最后一个函数是`eapply()`。这里我们查看环境中所有对象的类；这些类型应该在前面的章节中已经熟悉：\n\
  \n```r\neapply(env = environment(), FUN = class)\n$xCube\n[1] \"numeric\"\n$x\n\
  [1] \"numeric\"\n$forTime2\n[1] \"proc_time\"\n$y\n[1] \"numeric\"\n$z\n[1] \"numeric\"\
  \n$forTime\n[1] \"proc_time\"\n$yL\n[1] \"list\"\n$vTime\n[1] \"proc_time\"\n$i\n\
  [1] \"numeric\"\n$xL\n[1] \"integer\"\n$zL\n[1] \"list\"\n```\n\n## 最终思考\n\n你已经看到了几种强大的自动化工具——从控制重复执行（以及执行频率）的各种循环，到专门处理数据集中常见元素的专业化工具。这些技术非常有用且经常使用。然而，这还不够。如果开发出新技术怎么办？`mean()`是如何工作的？如果我们需要创建自己的函数呢？在下一章中，我们将从理论框架和实际应用两个角度探讨函数。自定义函数与循环的结合，是让计算机替我们完成繁琐工作的核心方法。\n\
  \n"
- "# 4. 编写函数\n\n在 R 中编写自己的函数，使你能够将一组 R 命令组合成一个易于调用且可泛化的函数。函数是 R 的基础。要成为更高级的 R 用户或开发者，深入理解函数是什么以及如何编写至关重要。广义上讲，函数接收一个或多个输入，对其进行处理，并生成和返回输出。\n\
  \n并非每个编程任务都应转为函数。然而，当你发现自己第三次复制粘贴某行代码时，很可能应该编写一个函数。另一个“毫无疑问”需要编写函数的时机是当代码超过 100\
  \ 行左右时。长段代码可能变得几乎无法阅读和理解。相反，我们编写具有良好描述性名称的函数，使代码更易读。然后，在单独的传递中，我们使用这些函数来编写代码。这种系统的美妙之处在于，更容易在每个函数内编写专注的代码，解决挑战中的特定部分。这种方法的另一个好处是，如果需要更高的效率，可以确定哪些函数消耗最多的处理能力或花费最长时间，然后针对该部分研究如何提高效率。\n\
  \n在本章中，我们使用`Hmisc`R 包（Harrell Jr, 2016）。以下代码加载`checkpoint`（Microsoft Corporation,\
  \ 2016）包以控制所用 R 包的精确版本，然后加载`Hmisc`包：\n\n```r\n## load checkpoint and required packages\n\
  library(checkpoint)\ncheckpoint(\"2016-09-04\", R.version = \"3.3.1\")\nlibrary(Hmisc)\n\
  options(width = 70) # only 70 characters per line\n```\n\n\n\n## 函数的组成部分\n\n除少数例外情况外，R\
  \ 语言中的大多数函数都由三个部分组成：\n\n- `Formals`（形式参数）：函数的参数或输入\n- `Body`（函数体）：处理输入的命令\n- `Environment`（环境）：函数的位置或上下文，决定了它查找变量的位置\n\
  \n每个部分都可以使用专门的函数进行检查。首先，我们编写一个示例函数：\n\n```\n### 创建新函数 f()\nf <- function(x, y =\
  \ 5) {\nx + y\n}\n```\n\n该函数接受两个参数：`x` 和 `y`。第一个参数 `x` 没有默认值，但第二个参数 `y` 的默认值为 `5`。虽然我们可以轻松看到这些（部分原因是我们编写了这个函数），但也可以使用\
  \ `formals()` 和 `args()` 函数来检查函数的**形式参数**（即参数）：\n\n```\nformals(f)\n$x\n$y\n[1]\
  \ 5\nargs(f)\nfunction (x, y = 5)\nNULL\n```\n\n要查看用于处理形式参数的实际 R 代码或命令，我们使用 `body()`\
  \ 函数：\n\n```\nbody(f)\n{\nx + y\n}\n```\n\n这些命令始终包含在开闭花括号 `{ }` 中。在这个例子中，R 代码仅仅是\
  \ `x + y`，但有些函数可能有数百行代码。函数的最后一个关键部分是它的环境。函数的环境决定了它在哪里查找变量或对象，这可以包括数据和函数。要查看函数的环境，我们使用\
  \ `environment()` 函数：\n\n```\nenvironment(f)\n```\n\n在这种情况下，该函数位于全局环境中，也就是我们创建函数的地方。对于其他函数，情况会有所不同。例如，如果我们查看\
  \ `install.packages()` 函数的环境，它是 `utils` 包的命名空间：\n\n```\nenvironment(install.packages)\n\
  ```\n\n这为讨论 R 函数提供了一种通用语言。在本章的剩余部分，我们将更深入地探讨编写函数的方法，以及可用于函数的特殊代码和工具。\n\n### 作用域\n\
  \n在 R 中，作用域决定了在哪里查找特定的变量。例如，当我们输入 `plot` 时，R 如何解析这段代码？R 在哪里查找它？作用域是 R 对语言中“上下文”这一概念的回答。如果我说“我买了一个新的**球棒**”，你可能会认为我指的是板球球棒，而不是会飞的哺乳动物。对\
  \ R 而言，上下文来源于作用域和环境。因此，不同的环境可能导致不同的结果。\n\n编写 R 函数的大多数方面与交互式使用 R 并无不同。但有一个区别是函数拥有自己的环境。此外，函数通常位于不同的环境中。例如，在交互式使用\
  \ R 时，几乎所有命令都在全局环境中执行。相比之下，许多函数是作为 R 包的一部分编写的，在这种情况下，函数的环境由该 R 包定义。因此，在开始编写函数之前，理解作用域会很有帮助。考虑以下两个例子：\n\
  \n```\nplot\nfunction (x, y, ...)\nUseMethod(\"plot\")\n\nplot <- 5\nplot\n[1] 5\n\
  ```\n\n在第一个例子中，R 在 `graphics` 包中找到了 `plot`。在第二个例子中，R 在全局环境中找到了 `plot`。请注意，将 `5`\
  \ 赋值给变量 `plot` 并不会覆盖 `plot()` 函数。相反，它会创建另一个与函数同名的 R 对象。创建这个新变量后，当我们在控制台输入 `plot`\
  \ 时，R 返回的是数值而不是函数，因为赋值操作 `plot <- 5` 发生在全局环境中，而 R 在检查不同包的环境之前会先搜索全局环境。`search()`\
  \ 函数按 R 搜索的顺序返回环境。你的环境可能有所不同，但可能会存在一些相似之处：\n\n```\nsearch()\n[1] \".GlobalEnv\"\
  \            \"package:Hmisc\"\n[3] \"package:ggplot2\"       \"package:Formula\"\
  \n[5] \"package:survival\"      \"package:lattice\"\n[7] \"package:devEMF\"    \
  \    \"package:checkpoint\"\n[9] \"ESSR\"                  \"package:stats\"\n[11]\
  \ \"package:graphics\"      \"package:grDevices\"\n[13] \"package:utils\"      \
  \   \"package:datasets\"\n[15] \"package:RevoUtilsMath\" \"package:methods\"\n[17]\
  \ \"Autoloads\"             \"package:base\"\n```\n\n从输出中，我们可以看到 R 首先在全局环境（`.GlobalEnv`）中查找，然后在\
  \ `Hmisc` 包中查找，依此类推，直到到达 `base` 包。我们可以再次使用 `environment()` 函数来查看当前环境。R 总是从当前或局部环境开始查找。然后，它会逐步向上查找父环境。我们可以通过\
  \ `parent.env()` 函数找到给定环境的父环境：\n\n```\nenvironment()\n\nparent.env(.GlobalEnv)\n\
  \nattr(,\"name\")\n[1] \"package:Hmisc\"\nattr(,\"path\")\n[1] \"C:/Users/Authors/.checkpoint/2016-09-04/lib/x86_64-w64-mingw32/3.3.1/Hmisc\"\
  \n```\n\n回到函数上来，每个函数除了本身位于某个环境中之外，还有自己的局部环境。以下代码展示了函数的局部环境及其父环境。我们可以粗略地将函数中的变量分为三种类型：\n\
  \n- 形式变量\n- 在函数内部定义的局部变量\n- 既非形式变量也非局部变量的自由变量或其他变量\n\n以下代码依次演示了每种类型：\n\n```\na\n\
  \n[1] \"free variable\"\n[1] \"formal variable\"\n[1] \"local variable\"\n```\n\n\
  变量 `x` 是一个形式变量，其默认值为 `y`，`y` 是在函数体中定义的局部变量，而 `a` 是在函数父环境中定义的变量。尽管函数可以依赖搜索路径中的对象，而不是在形式参数或局部变量中指定的对象，但这并非明智之举。编写依赖于函数父环境或搜索路径的代码可能会导致特别棘手的错误和意外行为。这会给用户或以后的你带来混乱，因为当环境中看似与函数无关的某个内容发生变化时，即使函数的代码和输入看起来没有改变，输出结果也可能会突然不同。\n\
  \n尽管到目前为止的例子都相对简单，但在使用嵌套函数调用时，作用域会变得更加棘手。在以下代码中，可能很难预测每段评估代码的结果。接下来的例子设置两个函数，然后使用全局环境中的三个不同变量来调用这些函数：\n\
  \n```\nf1 <- function(y = \"f1 var\") {\nx <- y\na1 <- f2(x)\nrm(x)\na2 <- f2(x)\n\
  }\nf2 <- function(x) {\nif (nchar(x) < 10) {\nx <- \"f2 local var\"\n}\nprint(x)\n\
  return(x)\n}\nx <- \"global var\"\nf1()\n[1] \"f2 local var\"\n[1] \"global var\"\
  \nx <- \"g var\"\nf1()\n[1] \"f2 local var\"\n[1] \"f2 local var\"\nrm(x)\nf1()\n\
  [1] \"f2 local var\"\nError in nchar(x) (from #2) : object 'x' not found\n```\n\n\
  值得反复试验作用域，直到理解其原理，因为它对于确保找到正确的对象至关重要。在编写和开发包，或者使用出现在多个包中的函数时，这可能是一个特别的挑战。\n\n\n\n\
  ## 函数的函数\n\n在你编写的函数中，除了常规的 R 代码和函数外，还存在一些特殊的函数。这些函数仅用于或主要用于其他函数内部。即使你是一位经验丰富的 R\
  \ 用户，如果你以前没有编写过函数，这些函数也可能让你感到陌生。\n\n`match.arg()` 函数用于对参数进行模糊匹配。它的另一个好处是，如果参数与任何有效选项都不匹配（即无效），则会抛出一个错误。以下代码展示了两个相似的函数，其中一个使用了\
  \ `match.arg()` 函数。示例演示了模糊匹配以及使用无效参数时会发生什么：\n\n```\nf1 <- function(type = c(\"first\"\
  , \"second\")) {\ntype\n}\nf2 <- function(type = c(\"first\", \"second\")) {\ntype\
  \ <- match.arg(type)\ntype\n}\nf1(\"fi\")\n[1] \"fi\"\nf2(\"fi\")\n[1] \"first\"\
  \nf1(\"test\")\n[1] \"test\"\nf2(\"test\")\nError in match.arg(type) : 'arg' should\
  \ be one of \"first\", \"second\"\n```\n\n参数匹配对于确保传入文本字符串时只使用有效选项也非常有用，并且如果传入无效选项，会抛出信息丰富的错误信息。以下代码对我们之前构建的未使用\
  \ `match.arg()` 的函数进行了扩展：当 `type = \"first\"` 时计算均值，当 `type = \"second\"` 时计算标准差。然而，当向\
  \ `type` 参数传递一个无效选项时，我们得到的是相对隐晦的错误信息“找不到对象 `x`”：\n\n```\nf1b <- function(type =\
  \ c(\"first\", \"second\")) {\nif (type == \"first\") {\nx <- mean(1:5)\n} else\
  \ if (type == \"second\") {\nx <- sd(1:5)\n}\nreturn(x)\n}\nf1b(\"test\")\nError\
  \ in f1b(\"test\"): object 'x' not found\n```\n\n另一个专用于函数参数的函数是 `missing()`。它返回一个逻辑值，指示函数调用中是否缺少某个特定参数。这在编写可能以不同方式使用的函数时很有帮助。以下是一个计算\
  \ Cohen's d 效应量的函数示例，对于单组数据，它定义为变量均值除以标准差。Cohen's d 也可以用于重复测量数据，例如干预前后测量的同一组数据。这通过计算两个变量的差值来完成，然后按照之前的方法继续处理。我们使用\
  \ `missing()` 函数来判断用户是传入单个变量 `x`，还是两个变量 `x` 和 `y`，这样我们的函数就能优雅地处理单样本和重复测量数据的 Cohen's\
  \ d 计算：\n\n```\ncohend <- function(x, y) {\nif (!missing(y)) {\nx <- y - x\n}\n\
  mean(x) / sd(x)\n}\ncohend(x = c(0.61, 0.99, 1.47, 1.52, 0.45,\n3.34, 1.05, -1.47,\
  \ 1.3, 0.33),\ny = c(-0.69, 1.6, 0.44, 1, 0.88,\n1.17, 2.4, 1.21, 0.87, 2.15))\n\
  [1] 0.09522249\ncohend(x = c(0.61, 0.99, 1.47, 1.52, 0.45,\n3.34, 1.05, -1.47, 1.3,\
  \ 0.33))\n[1] 0.796495\n```\n\n与确定函数调用特征相关的另一个函数是 `match.call()`。`missing()` 判断的是特定参数是否缺失，`match.arg()`\
  \ 判断的是参数是否与有效选项之一匹配，而 `match.call()` 捕获的是整个函数调用。这可能演示比解释更容易理解。以下小函数计算变异系数，即样本标准差除以样本均值。它还通过\
  \ `match.call()` 捕获并返回了函数调用：\n\n```\ncv <- function(x, na.rm = FALSE) {\nfcall <-\
  \ match.call()\nest <- sd(x, na.rm = na.rm) / mean(x, na.rm = na.rm)\nreturn(list(CV\
  \ = est, Call = fcall))\n}\ncv(1:5)\n$CV\n[1] 0.5270463\n$Call\ncv(x = 1:5)\ncv(1:8,\
  \ na.rm = TRUE)\n$CV\n[1] 0.5443311\n$Call\ncv(x = 1:8, na.rm = TRUE)\n```\n\n从这两个示例的输出中可以看到，`match.call()`\
  \ 精确地捕获了对函数的调用，但它添加了显式的参数名称。这对于记录生成特定输出时的确切调用有时非常有用。在 R 中，此功能最常见的应用场景可能是回归模型的输出。例如，以下代码展示了一个线性模型，其输出中回显了函数调用，这是通过\
  \ `match.call()` 实现的：\n\n```\nlm(mpg ∼ hp, data = mtcars)\nCall:\nlm(formula = mpg\
  \ ∼ hp, data = mtcars)\nCoefficients:\n(Intercept)           hp\n30.09886     -0.06823\n\
  ```\n\n`return()` 函数通常用于函数末尾以返回特定对象，正如你在之前的一些示例中已经看到的那样，尽管我们没有明确讨论它。然而，`return()`\
  \ 也可以用于从函数内的任意点返回值，从而终止函数的执行。以下函数有一个 `if` 语句，如果条件为真，则会导致函数提前终止。注意，如果条件不成立，最终结果甚至没有用\
  \ `return()` 包裹。R 默认返回函数中的最后一个对象，因此，严格来说，并非必须显式调用 `return()`：\n\n```\nf <- function(x)\
  \ {\nif (x < 4) return(\"I'm done!\")\npaste(x, \"- Fin!\")\n}\nf(10)\n[1] \"10\
  \ - Fin!\"\nf(3)\n[1] \"I'm done!\"\n```\n\n尽管你可以在函数中提前使用 `return()`，但不鼓励这样做，因为这对于用户以及其他阅读或调试代码的人来说可能会感到意外。前面代码中的相同效果可以通过使用流程控制来实现：\n\
  \n```\nf <- function(x) {\nif (x < 4) {\n\"I'm done!\"\n} else {\npaste(x, \"- Fin!\"\
  )\n}\n}\nf(10)\n[1] \"10 - Fin!\"\nf(3)\n[1] \"I'm done!\"\n```\n\n除了不要在函数中途使用 `return()`\
  \ 之外，有些人也认为不应当在函数末尾显式调用 `return()`，因为它是不必要的。这仍然是一个个人偏好问题，因为它有助于引起对函数末尾确切返回内容的关注。\n\
  \n虽然并非专用于函数，但 `invisible()` 函数经常与函数返回的对象一起使用。之前我们创建了一个计算变异系数并返回函数调用的函数。我们可以修改该函数，使其打印变异系数并不可见地返回其余部分，如下代码所示。使用\
  \ `invisible()` 意味着，即使函数返回了与之前相同的对象，该对象也不会显示出来。`invisible()` 函数可能最常用于设计用于创建有吸引力输出的函数，例如对\
  \ `summary()` 或绘图函数的调用。这些函数的主要目的是显示摘要或图形，但以防有人想要或需要编辑该对象，实际对象会被不可见地返回，从而可以被捕获并保存以供后续使用：\n\
  \n```\ncv <- function(x, na.rm = FALSE) {\nfcall <- match.call()\nest <- sd(x, na.rm\
  \ = na.rm) / mean(x, na.rm = na.rm)\nprint(est)\nreturn(invisible(list(CV = est,\
  \ Call = fcall)))\n}\ncv(1:8, na.rm = TRUE)\n[1] 0.5443311\nres <- cv(1:8, na.rm\
  \ = TRUE)\n[1] 0.5443311\nres$Call\ncv(x = 1:8, na.rm = TRUE)\n```\n\n\n\n`on.exit()`函数可用于确保函数退出或完成时执行一组特定命令。即使函数发生错误或未正常完成，`on.exit()`中的表达式也会执行。以下代码中第二个小函数的用例展示了这一点：错误导致函数终止，随即`on.exit()`中的表达式被执行。当函数修改了自身以外的任何值时，使用`on.exit()`尤其有价值。例如，有时绘图函数会修改默认绘图参数，并在完成后将它们恢复为原始状态。使用`on.exit()`可以确保，即使出现问题或函数失败，用户仍保有所有原始设置：\n\
  \n```\nf <- function(x) {\non.exit(print(\"Game over\"))\nx + 5\n}\nf(3)\n[1] \"\
  Game over\"\n[1] 8\nf(\"a\")\nError in x + 5 (from #3) : non-numeric argument to\
  \ binary operator\n[1] \"Game over\"\n```\n\n我们要讲解的最后一组特定于函数的功能，与向软件或用户发送信号相关。按严重程度排序，它们是`stop()`、`warning()`和`message()`。接下来的示例稍显实际，它计算变量的均值，可以是原始尺度，也可以是变换后的尺度，然后再反向变换回均值。对数尺度对异常值的抵抗力相对较强。如果使用对数变换，示例代码通过`stop()`函数检查变量是否有负值（负值未定义且会引发完整错误）。传递给`stop()`的参数是要显示的错误消息。`warning()`也遵循类似的流程，传递要在警告中显示的消息。警告与错误不同。通过`stop()`引发的错误会导致函数停止评估并终止。警告在最后发出，但允许函数继续评估。最后，`message()`可用于向用户发送消息或信号，但不会像警告那样指示真实或可能存在的问题。虽然未展示，但一个相关的便捷函数是`stopifnot()`，它允许传入一个逻辑表达式，如果表达式评估结果不为真，则会发出错误。尽管此选项有助于节省代码，但缺点是你无法编写自定义错误消息来准确指出问题所在。\n\
  \n使用警告或消息（而非仅调用`print()`或`cat()`让函数打印消息）的一个原因是，可以通过函数`suppressWarnings()`和`suppressMessages()`（可选）抑制警告和消息。以下代码演示了所有这些函数：\n\
  \n```\nf <- function(x, trans = c(\"identity\", \"log\")) {\ntrans <- match.arg(trans)\n\
  if (trans == \"log\") {\nif (any(x < 0)) stop(\"Log is not defined for negative\
  \ values\")\nif (any(x < 1e-16)) warning(\"Some x values close or equal to zero,\
  \ results may be unstable\")\nx <- log(x)\nmessage(\"x successfully log transformed\"\
  )\nexp(mean(x))\n} else {\nmean(x)\n}\n}\nf(c(1, 2, 100))\n[1] 34.33333\nf(c(1,\
  \ 2, 100), trans = \"log\")\nx successfully log transformed\n[1] 5.848035\nsuppressMessages(f(c(1,\
  \ 2, 100), trans = \"log\"))\n[1] 5.848035\nf(c(0, 1, 2, 100), trans = \"log\")\n\
  x successfully log transformed\n[1] 0\nWarning message:\nIn f(c(0, 1, 2, 100), trans\
  \ = \"log\") :\nSome x values close or equal to zero, results may be unstable\n\
  suppressWarnings(f(c(0, 1, 2, 100), trans = \"log\"))\nx successfully log transformed\n\
  [1] 0\nf(c(-1, 1, 2, 100), trans = \"log\")\nError in f(c(-1, 1, 2, 100), trans\
  \ = \"log\") (from chapter04.R!79246pw#5) :\nLog is not defined for negative values\n\
  ```\n\n### 调试\n\n到目前为止，演示的函数都能正常工作，或者存在意图明显、易于发现的错误。有时，查找错误或调试代码和编写的函数需要更长时间。幸运的是，有一些工具可以帮助这一过程，并且有一些实践方法可以缩小问题范围。\n\
  \n虽然调试适用于任何代码（而不仅仅是函数），但函数在没有额外工具的情况下尤其难以调试，因为通常它的所有代码都会不间断地执行，没有机会查看中间过程。在本节中，我们编写一个函数，该函数使用公式按另一个变量的水平计算变量的均值，使用之前在第\
  \ 3 章中介绍过的`tapply()`，然后绘制原始数据并用点表示均值，代码如下，结果如图 4-1 所示：\n\n![A393929_1_En_4_Fig1_HTML.jpg](img/A393929_1_En_4_Fig1_HTML.jpg)\n\
  \n**图 4-1.** 带有原始数据（空心点）和均值（大蓝点）的散点图，显示错误结果\n\n```\nmeanPlot <- function(formula,\
  \ d) {\nv <- all.vars(formula)\nm <- tapply(d[, v[1]], d[, v[2]],\nFUN = mean, na.rm\
  \ = TRUE)\nplot(formula, data = d, type = \"p\")\npoints(x = unique(d[, v[2]]),\
  \ y = m,\ncol = \"blue\", pch = 16, cex = 2)\n}\nmeanPlot(mpg ~ cyl, d = mtcars)\n\
  ```\n\n均值看起来有些不对劲。`cyl = 8` 时的均值看起来没问题，但另外两个似乎落在了极端值上。`debug()`函数允许我们调试函数，并逐行执行代码。要使用它，我们首先在要调试的函数上调用`debug()`：\n\
  \n```\ndebug(meanPlot)\n```\n\n然后，当我们使用原始函数时，会触发 R 进入调试模式。第一步，R 告诉我们正在调试的函数调用及其位置：\n\
  \n```\nmeanPlot(mpg ~ cyl, d = mtcars)\ndebugging in: meanPlot(mpg ~ cyl, d = mtcars)\n\
  debug at c:/Temp/chapter04.R!79246wk#1: {\nv <- all.vars(formula)\nm <- tapply(d[,\
  \ v[1]], d[, v[2]], FUN = mean, na.rm = TRUE)\nplot(formula, data = d, type = \"\
  p\")\npoints(x = unique(d[, v[2]]), y = m, col = \"blue\", pch = 16, cex = 2)\n\
  }\ndebug at #2: v <- all.vars(formula)\ndebug at #3: m <- tapply(d[, v[1]], d[,\
  \ v[2]], FUN = mean, na.rm = TRUE)\ndebug at #5: plot(formula, data = d, type =\
  \ \"p\")\nBrowse[2]> m\n       4        6        8\n26.66364 19.74286 15.10000\n\
  Browse[2]> unique(d[, v[2]])\n[1] 6 4 8\nBrowse[2]> Q\n```\n\n现在我们知道了问题所在，可以通过首先对数据进行排序来修复函数，使`tapply()`和`unique()`以相同顺序给出结果。代码如下所示，结果如图\
  \ 4-2 所示：\n\n![A393929_1_En_4_Fig2_HTML.jpg](img/A393929_1_En_4_Fig2_HTML.jpg)\n\
  \n**图 4-2.** 带有原始数据（空心点）和均值（大蓝点）的散点图，显示修正后的结果\n\n```\nmeanPlot <- function(formula,\
  \ d) {\nv <- all.vars(formula)\nd <- d[order(d[, v[2]]), ] ## sorting first\nm <-\
  \ tapply(d[, v[1]], d[, v[2]],\nFUN = mean, na.rm = TRUE)\nplot(formula, data =\
  \ d, type = \"p\")\npoints(x = unique(d[, v[2]]), y = m,\ncol = \"blue\", pch =\
  \ 16, cex = 2)\n}\nmeanPlot(mpg ~ cyl, d = mtcars)\n```\n\n如果你正在调试函数，并且不想逐行执行代码，可以将`browser()`函数插入到函数代码中。然后，当函数执行到该点时，会调用一个浏览器，你可以检查函数局部环境中变量的当前状态。在以下示例代码中，我们在函数中添加了对`browser()`的调用，使用`ls()`检查当前可用的对象，检查对象`v`的内容，并再次输入大写`Q`退出调试：\n\
  \n```\nmeanPlot <- function(formula, d) {\nv <- all.vars(formula)\nd <- d[order(d[,\
  \ v[2]]), ]\nm <- tapply(d[, v[1]], d[, v[2]], FUN = mean, na.rm = TRUE)\nplot(formula,\
  \ data = d, type = \"p\")\nbrowser()\npoints(x = unique(d[, v[2]]), y = m, col =\
  \ \"blue\", pch = 16, cex = 2)\n}\ndebug at #9: plot(formula, data = d, type = \"\
  p\")\nBrowse[2]> ls()\n[1] \"d\"       \"formula\" \"m\"       \"v\"\nBrowse[2]>\
  \ v\n[1] \"mpg\" \"cyl\"\nBrowse[2]> Q\n```\n\n\n\n`traceback()`是一个在交互式调试时非常有用的函数。例如，当你调用`lm()`等函数后遇到错误信息，有时很难确切知道错误发生的位置或原因。错误通常甚至不直接来自你调用的函数，因为你经常使用的函数可能会在内部调用许多其他函数。下面的示例展示了如何在导致错误的代码之后立即使用`traceback()`。输出显示了调用栈，追踪了从初始调用到最终生成错误的代码的路径。如果需要查看代码以确定错误原因，这些信息会很有用：\n\
  \n```\n> lm(mpg ∼ jack, data = mtcars)\nError in eval(expr, envir, enclos) : object\
  \ 'jack' not found\n> traceback()\n7: eval(expr, envir, enclos)\n6: eval(predvars,\
  \ data, env)\n5: model.frame.default(formula = mpg ∼ jack, data = mtcars, drop.unused.levels\
  \ = TRUE)\n4: stats::model.frame(formula = mpg ∼ jack, data = mtcars, drop.unused.levels\
  \ = TRUE)\n3: eval(expr, envir, enclos)\n2: eval(mf, parent.frame())\n1: lm(mpg\
  \ ∼ jack, data = mtcars)\n```\n\n最后，有时代码错误并不在你的代码中，而是在你使用的其他代码中，例如来自另一个 R 包。虽然在推荐的\
  \ R 包中发现错误的情况很少见，但在成千上万个其他 R 包中错误更为常见。此外，有时问题本身并非错误，而是你使用函数的方式与原始作者设想的使用方式存在差异。尽管\
  \ CRAN 上所有 R 包的源代码都可以公开下载和编辑，但仅仅为了看看在一个函数中稍作改动是否能解决问题，就去下载整个包的源代码、编辑并重新安装，可能会非常麻烦。\n\
  \n考虑以下挑战。假设你使用的数据有时会由于某种原因包含无穷大（`Inf`），但你只想包含有限的情况。以下代码展示了使用`Hmisc`包中`wtd.quantile()`函数的一个例子：\n\
  \n```\n> wtd.quantile(c(1, 2, 3, Inf, NA),\n+ weights = c(.6, .9, .4, .2, .6))\n\
  0%  25%  50%  75% 100%\nNaN  Inf  Inf  Inf  Inf\n```\n\n如果我们查看`wtd.quantile()`的代码（通过在\
  \ R 控制台中不带括号地输入它），我们可以看到另一个函数`wtd.table()`负责主要的计算，如下所示：\n\n```\n> wtd.quantile\n\
  function (x, weights = NULL, probs = c(0, 0.25, 0.5, 0.75, 1),\ntype = c(\"quantile\"\
  , \"(i-1)/(n-1)\", \"i/(n+1)\", \"i/n\"), normwt = FALSE,\nna.rm = TRUE)\n{\nif\
  \ (!length(weights))\nreturn(quantile(x, probs = probs, na.rm = na.rm))\ntype  1))\n\
  stop(\"Probabilities must be between 0 and 1 inclusive\")\nnams \n1) 2 - log10(diff(range(probs)))\
  \ else 2)), \"%\", sep = \"\")\nif (type == \"quantile\") {\nw \n```\n\n使用同样的方法，我们可以检查`wtd.table()`函数。检查时我们发现，尽管它可以自动移除缺失值，但它没有检查或移除非有限值（`Inf`）的方法。直接更改数据似乎更容易，但有时数据是自动生成并传递的，因此修改函数比修改数据更简单。我们可以将`wtd.table()`的代码复制粘贴到\
  \ R 编辑器中并进行修改，如下所示：\n\n```\n> revised.wtd.table  length(levused)) && any(is.na(weights)))\n\
  weights <- weights[!is.na(weights)]\nif (length(weights) != length(levused))\nstop(\"\
  program logic error\")\nnames(weights) <- levused\n}\nif (!length(names(weights)))\n\
  stop(\"program logic error\")\nif (type == \"table\")\nreturn(weights)\nx <- all.is.numeric(names(weights),\
  \ \"vector\")\nif (isdate)\nattributes(x) <- c(attributes(x), ax)\nnames(weights)\
  \ <- NULL\nreturn(list(x = x, sum.of.weights = weights))\n}\nxx <- x\nif (isdate)\n\
  attributes(xx) <- c(attributes(xx), ax)\nif (type == \"list\")\nlist(x = if (length(lev))\
  \ lev[x] else xx, sum.of.weights = weights)\nelse {\nnames(weights) <- if (length(lev))\n\
  lev[x]\nelse xx\nweights\n}\n}\n```\n\n与原始的`wtd.table()`函数不同，修改后的函数完全按照我们的期望工作：\n\
  \n```\n> wtd.table(c(1, 2, 3, Inf, NA),\n+ weights = c(.6, .9, .4, .2, .6))\n$x\n\
  [1]   1   2   3 Inf\n$sum.of.weights\n[1] 0.6 0.9 0.4 0.2\n> revised.wtd.table(c(1,\
  \ 2, 3, Inf, NA),\n+ weights = c(.6, .9, .4, .2, .6))\n$x\n[1] 1 2 3\n$sum.of.weights\n\
  [1] 0.6 0.9 0.4\n```\n\n然而，挑战在于`wtd.quantile()`函数和`Hmisc`包中其他使用`wtd.table()`的函数仍然无法按我们希望的方式工作，因为它们并未使用我们修改后的函数。将我们的函数赋值给全局环境中的名称`wtd.table()`是不够的，因为作用域规则意味着`Hmisc`函数会优先从`Hmisc`包的环境中访问`wtd.table()`函数，而不是从全局环境。这就像你的电脑上有同名但位于两个不同文件夹的文件一样。为了让所有使用`wtd.table()`的`Hmisc`函数都能用上我们修改后的函数，我们不仅要正确命名它，还要把它放在正确的位置。我们可以通过`assignInNamespace()`函数将对象赋值到特定的命名空间：\n\
  \n```\n> assignInNamespace(x = \"wtd.table\",\n+ value = revised.wtd.table,\n+ ns\
  \ = \"Hmisc\")\n> wtd.quantile(c(1, 2, 3, Inf, NA),\n+ weights = c(.6, .9, .4, .2,\
  \ .6))\n0%   25%   50%   75%  100%\n2.000 2.225 2.450 2.675 2.900\n> wtd.Ecdf(c(1,\
  \ 2, 3, Inf, NA),\n+ weights = c(.6, .9, .4, .2, .6))\n$x\n[1] 1 1 2 3\n$ecdf\n\
  [1] 0.0000000 0.3157895 0.7894737 1.0000000\n```\n\n尽管`assignInNamespace()`函数没有输出，但我们可以看到，在此之后，`wtd.quantile()`函数和依赖于`wtd.table()`的其他函数（如`wtd.Ecdf()`）就能按我们期望的方式工作了。关于`assignInNamespace()`的一个注意事项是：你无法将任何对象赋值给该命名空间中不存在的对象（即只能覆盖已存在的对象）。此外，对于任何你打算提交到\
  \ CRAN 的包，不允许使用`assignInNamespace()`。尽管这有时是一个便捷的方法，但如果人们将其作为一般规则，那么情况会变得混乱。如果发生这种情况，包\
  \ A 中函数的定义将取决于你是否加载了包 B，因为包 B 可以覆盖（不仅仅是遮蔽）包 A 中的函数定义。请注意，你通过这种方式做出的任何更改都是临时的，在重启\
  \ R 后会消失。然而，这可以是一种调试现有包的有用技术，因为它是一种相对简单的方法，可以确保使用`wtd.quantile()`时遇到的问题确实通过对`wtd.table()`的建议修改而被“修复”。此时，如果这确实是一个错误，或者即使只是一个理想的功能，你可以给包维护者发送电子邮件建议修改，并且确信建议的代码是有效的。要查看当前的维护者，你可以直接输入`maintainer(\"\
  Hmisc\")`，或者任何你感兴趣的包的名字。\n\n\n\n## 总结\n\n本章我们介绍了大量函数及其相关知识！如果你需要回顾某个具体函数，表 4-1 列出了本章介绍的关键函数及其简要说明。当然，你也可以查阅官方帮助文件获取更多信息。\n\
  \n**表 4-1.** 本章描述的关键函数\n\n| 函数 | 作用 |\n| --- | --- |\n| `formals()` | 允许查看你所构建函数的形式参数。\
  \ |\n| `args()` | 显示所创建函数参数的默认值和名称。 |\n| `body()` | 显示函数体（即`{`和`}`之间的代码）。 |\n| `environment()`\
  \ | 显示函数所在的环境（目前通常为全局环境）。 |\n| `search()` | 显示函数的搜索顺序。请记住，其他人可能已经使用了你的函数名！ |\n|\
  \ `parent.env()` | 接收一个环境，并追踪其上一级环境。 |\n| `match.arg()` | 允许对函数参数进行模糊匹配。 |\n| `missing()`\
  \ | 测试是否有值传递给函数。注意，在`match.arg()`之后，此值将为`FALSE`。 |\n| `match.call()` | 捕获整个函数调用；常用于回归分析。\
  \ |\n| `return()` | 非必需，可能存在争议，但若使用，务必作为新函数的最后一部分。 |\n| `invisible()` | 抑制输出。 |\n\
  | `on.exit()` | 无论函数执行成功与否，都执行其参数。 |\n| `stop()`、`stopifnot()`、`warning()`、`message()`\
  \ | 这些是不同严重级别的错误，从完全停止并报错，到较温和的警告，再到基本礼貌的消息。 |\n| `suppressWarnings()`、`suppressMessages()`\
  \ | 这两个函数的作用如其名。一旦你熟悉了某个函数，警告或消息可能会显得烦人或可以安全忽略。 |\n| `debug()` | 用于开始调试无法正常工作的函数。\
  \ |\n| `browser()` | 进入函数体，位于待调试部分之前。 |\n| `traceback()` | 提供导致错误根源的表达式列表。 |\n|\
  \ `assignInNamespace()` | 允许用本地编写的函数临时替换某个函数。 |\n| `maintainer()` | 针对包调用，显示用于故障排除的联系人姓名和电子邮箱。\
  \ |\n\n虽然函数各部分的正式名称并非绝对关键，但学会高效使用和编写函数可能是你学习 R 语言的最佳投资之一。编写函数提供了一种摆脱编写重复代码的方法。虽然没有严格规则，但如果你发现自己经常执行相同的任务，那么很可能值得为此编写一个函数。它可能是一项涉及多个部分的大任务，也可能是一个小任务。例如，在心理学中，通常需要报告连续变量的“高”值和“低”值，这些值通常定义为均值\
  \ +/– 1 个标准差。在 R 中，使用`mean()`和`sd()`函数可以轻松实现。如果你经常这样做，那么编写一个简短的单行函数，使你不用输入`mean(x)\
  \ + sd(x)`，而只需输入`msd(x)`或你命名的其他函数名，可能会很值得。如果你对操作函数和编写自己的函数感到不自在，那么在进入第 5 章和第 6 章之前，最好多进行一些练习，因为我们假设你已熟练掌握函数。\n\
  \n"
- "# 5. 编写类和方法\n\n让函数根据传入对象的类型表现出不同行为通常很有帮助。例如，在汇总变量时，为数值数据或字符串数据创建不同的汇总方式是有意义的。可以为每种对象类型使用不同的函数，但这样用户必须记住许多函数名，而且为了保持名称唯一，函数名可能会更长。面向对象编程（OOP）基于对象，并在\
  \ R 中（与大多数编程语言一样）通过使用两个概念来实现：类和方法。类定义了一个模板或蓝图，描述对象的变量和特征，并确定哪些方法适用于它。例如，房子可以定义为有地板、四面墙、屋顶和一扇门。具体数据代表这些属性，例如每面墙的尺寸和颜色。方法是可以在特定对象类型上执行的行为或操作。例如，房子可以粉刷，从而改变其颜色，但房子不能吃。R\
  \ 有三种面向对象系统：S3、S4 和 R5。本章将介绍最常见的 S3 和 S4 系统。\n\n在本章中，我们将使用`ggplot2` R 包（Wickham,\
  \ 2009）。以下代码加载了`checkpoint`（Microsoft Corporation, 2016）包以控制所用 R 包的具体版本，然后加载了`ggplot2`包：\n\
  \n```\n## 加载 checkpoint 及所需包\nlibrary(checkpoint)\ncheckpoint(\"2016-09-04\", R.version\
  \ = \"3.3.1\")\nlibrary(ggplot2)\noptions(width = 70) # 每行仅 70 个字符\n```\n\n## S3\
  \ 系统\n\nS3 系统是最常见的面向对象系统。它也是最容易上手、最简单的系统。S3 系统易于使用，部分原因在于它相当非正式，并且主要关注函数或方法。这些优势同时也是局限，因为\
  \ S3 系统没有提供正式的框架来确保对象满足类的要求。有关使用 S3 系统进行 R 编程的更深入指南，请参阅 W.N. Venables 和 B.D. Ripley\
  \ 所著的《S Programming》（Springer, 2004）。\n\n\n\n### S3 类\n\n在 R 中，默认情况下可以使用某些类型或类别的对象，并且几乎所有对象都可以被视为向量或泛型向量。例如，矩阵和数组本质上是带有表示维度属性的向量。列表是泛型向量，其中向量的每个元素可能包含另一个向量。数据框是列表，其中每个元素都是一个向量，但所有向量长度相等，因此具有表格格式。向量可以保存特定类型的数据，例如逻辑型、整型、数值型（实数）或字符型。这些基础对象和类由基础包提供。S3\
  \ 类是通过在基础包提供的对象和类基础上构建而创建的。\n\n**注意**\n\nS3 类是使用常规的 R 对象（例如，向量或列表）和类（例如，逻辑型或数值型）创建的。S3\
  \ 类通过使用 `class(object) <- \"class name\"` 设置类名来定义。S3 对象的元素通常通过使用 `` `$` ``, `` `[`\
  \ `` 或 `` `[[` `` 来访问。\n\n实际创建 S3 类很简单。首先，创建一个满足该类要求或特性的 R 对象，然后通过使用类名标记该对象来定义 S3\
  \ 类。由于 S3 类与其他 R 对象的区别仅在于具有特殊的名称或属性，因此它们可以通过使用 `` `$` ``, `` `[` `` 和 `` `[[` ``\
  \ 以与其他基础 R 对象相同的方式进行访问和操作。要检查对象的类，我们可以使用 `class()` 函数。在以下示例中，查询了 `mtcars` 对象以确定其具有数据框类：\n\
  \n```\nclass(mtcars)\n[1] \"data.frame\"\n```\n\n要查看对象的类是如何设置的，我们可以查看基础 R 中的许多函数，例如\
  \ `table()`。在这里，我们打印 `table()` 函数的源代码，为了节省空间省略了中间部分：\n\n```\ntable\nfunction (...,\
  \ exclude = if (useNA == \"no\") c(NA, NaN), useNA = c(\"no\",\n\"ifany\", \"always\"\
  ), dnn = list.names(...), deparse.level = 1)\n{\n[为了节省篇幅而省略]\ny\n```\n\n最后返回的对象\
  \ `y` 是一个数组，但具有 `table` 类。对象类是使用惯用语 `class(object) <- \"class name\"` 设置的。也可以为一个对象分配多个类。这与分配单个类的方式大致相同，并按优先顺序进行。以下示例将调用\
  \ `table()` 的结果存储在对象 `x` 中，然后设置两个类，首先是 `newclass`，然后是原始 `table` 类：\n\n```\nx <-\
  \ table(mtcars$cyl)\nclass(x) <- c(\"newclass\", \"table\")\nclass(x)\n[1] \"newclass\"\
  \ \"table\"\n```\n\n分配多个类的价值在于提供了一种备份，主要用于方法。例如，如果您创建一个新类，它是表或数据框的变体，您可以为打印编写专用方法，但依赖原始类的方法来处理其他功能，例如绘图或汇总。\n\
  \n您可以编写的类类型几乎是无穷无尽的。一个简单的入门方法是创建现有类的特殊或增强案例。在以下示例中，我们创建了一个特殊的数据框案例，其中包含 x 和 y 坐标以及文本标签，称为\
  \ `textplot`。“创建”该类的最简单方法是创建一个数据框，然后更改其类。如果我们只使用新的类标签，调用 `print()` 函数将导致使用默认方法，但如果我们同时使用新的\
  \ `textplot` 标签和其次的数据框标签进行标记，那么调用 `print()` 将回退到数据框的方法：\n\n```\nd <- data.frame(\n\
  x = c(1, 3, 5),\ny = c(1, 2, 4),\nlabels = c(\"First\", \"Second\", \"Third\")\n\
  )\nclass(d) <- \"textplot\"\nprint(d)\n$x\n[1] 1 3 5\n$y\n[1] 1 2 4\n$labels\n[1]\
  \ First  Second Third\nLevels: First Second Third\nattr(,\"row.names\")\n[1] 1 2\
  \ 3\nattr(,\"class\")\n[1] \"textplot\"\nclass(d) <- c(\"textplot\", \"data.frame\"\
  )\nprint(d)\nx y labels\n1 1 1  First\n2 3 2 Second\n3 5 4  Third\n```\n\n在 S3 系统中，没有正式的方法从特定类创建对象。然而，创建特定类对象的最常见方式是作为函数的输出。可以编写专用函数来创建特定类的对象，或者编写执行操作并将结果输出为特定类对象的函数。在\
  \ R 中使用 S3 系统时，后一种方法更为典型。\n\n当您创建一个新类时，某些所需的特性或元素可能存在于现有类中。如果是这种情况，那么在现有类的基础上进行构建或扩展可能是有意义的。例如，数据框建立在列表的基础上，要求列表的每个元素都是长度相同的向量。同样，我们之前创建的\
  \ `textplot` 类建立在数据框的基础上，要求三个元素分别命名为 `x`、`y` 和 `labels`。在这种情况下，我们说 `textplot` 继承自\
  \ `data.frame`。也就是说，`textplot` 是父类 `data.frame` 的子类（注意，父类也称为超类或基类）。如果一个类只继承自另一个类，则称为单继承（即只有一个父类）。如果一个类继承自多个类，则称为多继承（即具有多个父类）。如果一个类继承自另一个类，它可能继承数据的存储特性，也可能继承方法，即用于操作特定类对象的函数。继承方法对于避免重复造轮子尤其有用。\n\
  \n**注意**\n\n继承是指通过在现有类的特性和方法基础上进行构建来创建一个新类。新类称为子类，而新类派生自的类称为父类或超类。子类既可以继承父类的特性，也可以使用父类的方法。\n\
  \n在下一个示例中，我们编写一个小函数，使用公式接口从数据框构建一个 `textplot` 对象。该函数有两个参数：公式，称为 `f`；以及数据，称为 `d`。代码的第一部分使用第\
  \ 4 章介绍的 `stopifnot()` 函数来检查传递给函数的对象类是否符合预期。为了测试类，我们使用 `inherits()` 函数，该函数评估特定对象是否属于指定的类或从其继承。例如，我们的\
  \ `textplot` 类别是数据框，因此使用 `inherits(object, \"data.frame\")` 进行测试的结果将为 `TRUE`。当我们构建\
  \ S4 类时，我们会看到更正式的定义和类继承系统。函数的下一部分从指定的数据框中按顺序获取公式中的所有变量，重命名列，应用我们的 `textplot` 类，并返回对象：\n\
  \n```\ntextplot_data <- functions(f, d) {\nstopifnot(inherits(d, \"data.frame\"\
  ))\nstopifnot(inherits(f, \"formula\"))\nnewdata <- get_all_vars(formula = f, data\
  \ = d)\ncolnames(newdata) <- c(\"y\", \"x\", \"labels\")\nclass(newdata) <- c(\"\
  textplot\", \"data.frame\")\nreturn(newdata)\n}\n### 使用示例\ntextplot_data(f = mpg\
  \ ∼ hp | cyl, d = mtcars[1:10, ])\ny   x labels\nMazda RX4         21.0 110    \
  \  6\nMazda RX4 Wag     21.0 110      6\nDatsun 710        22.8  93      4\nHornet\
  \ 4 Drive    21.4 110      6\nHornet Sportabout 18.7 175      8\nValiant       \
  \    18.1 105      6\nDuster 360        14.3 245      8\nMerc 240D         24.4\
  \  62      4\nMerc 230          22.8  95      4\nMerc 280          19.2 123    \
  \  6\n```\n\n这些示例展示了使用 S3 系统创建类是如此的容易。接下来，我们将探讨如何为现有类或新类编写方法。\n\n\n\n### S3 方法\n\
  \n方法是可对特定类别的对象执行的函数或操作。即使你不编写自定义类，也可能需要编写自己的方法。编写 S3 方法就像编写我们在第 4 章中介绍的函数一样。唯一的区别在于，S3\
  \ 方法具有特殊的命名约定，并且需要为用户提供一个通用函数（generic function），该函数负责将调用分派到相应的方法。\n\n**注意**\n\n\
  S3 方法是遵循特定命名约定的常规 R 函数：`foo.classname()`。用户调用通用函数 `foo()`，该函数会根据作为参数传入的对象的类别，将其分派到相应的方法。如果尚不存在通用函数，则必须编写一个包含\
  \ `UseMethods()` 调用的通用函数，由它来处理实际的方法分派。\n\n首先，让我们为我们开发的 `textplot` 对象类别编写一个简单的绘图方法。要创建一个\
  \ S3 绘图方法，我们使用函数名（此处为 `plot`），后跟类别名——`function.classname()`，或者在此例中为 `plot.textplot()`。只要我们的函数以这种方式命名，并且存在一个通用的\
  \ `plot()` 函数（我们稍后将讨论此主题），它就可以作为 S3 方法工作。\n\n我们的绘图函数如下所示。调用 `par()` 函数可以调整图形的默认边距，以减少图形顶部和右侧的过多空白空间。结果存储在对象\
  \ `op` 中，因为它存储了原始的图形参数。然后，当函数退出时，可以在退出时调用 `par(op)` 来恢复用户的原始图形参数状态，这是你在第 4 章中学习过的一个函数。接下来，我们通过调用\
  \ `plot.new()` 创建一个新的绘图区域，并通过调用 `plot.window()` 设置新绘图的尺寸，其 x 和 y 轴范围由数据的范围决定。接着，我们使用\
  \ `text()` 函数绘制标签，该函数接收坐标和标签。最后，我们在底部（`side = 1`）和左侧（`side = 2`）添加坐标轴。原始的 `textplot`\
  \ 数据对象将在函数末尾以不可见的方式返回。\n\n```\nplot.textplot <- function(d) {\nop <- par(mar = c(4,\
  \ 4, 1, 1))\non.exit(par(op))\nplot.new()\nplot.window(xlim = range(d$x, na.rm =\
  \ TRUE),\nylim = range(d$y, na.rm = TRUE))\ntext(d$x, d$y, labels = d$labels)\n\
  axis(side = 1, range(d$x, na.rm = TRUE))\naxis(side = 2, range(d$y, na.rm = TRUE))\n\
  invisible(d)\n}\n```\n\n接下来，我们需要创建一些数据，然后对它们调用 `plot()`。请注意，因为它是一个方法，我们无需使用其全名 `plot.textplot()`\
  \ 来调用该函数。我们只需调用 `plot()`，R 就会根据对象类别 `textplot` 将数据对象分派到正确的方法。结果如图 5-1 所示，代码如下：\n\
  \n![A393929_1_En_5_Fig1_HTML.jpg](img/A393929_1_En_5_Fig1_HTML.jpg)\n\n**图 5-1.**\
  \ 在特定坐标处绘制文本标签的图形，演示了为自定义类使用自定义方法\n\n```\ndat <- textplot_data(f = mpg ∼ hp | cyl,\
  \ d = mtcars[1:10, ])\nplot(dat)\n```\n\n这个例子展示了使用 S3 系统是多么容易。几乎不需要特殊的函数或付出额外的努力。只需以你喜欢的任何方式创建一个常规的\
  \ R 对象，添加一个自定义的类别标签，编写一个函数，并给它取一个特殊的名字——基本上这就是全部所需。不过，S3 方法也有一些特殊的函数和工具。首先，让我们看看查看\
  \ `plot()` 的源代码时会发现什么。这个通用函数只包含三个参数。函数体仅包含对 `UseMethod()` 的调用，它的作用是告诉 R 检查参数类别并分派到适当的方法。如果你正在编写方法，并且尚不存在通用函数，那么你还需要编写这个通用函数。在\
  \ S3 系统中编写通用函数是一项直截了当的任务，只需要考虑包含的默认参数：\n\n```\nplot\nfunction (x, y, ...)\nUseMethod(\"\
  plot\")\n```\n\n要查看可用的方法，我们使用 `methods()` 函数。结果显示 `plot()` 有许多具体的方法，包括我们刚刚编写的 `plot.textplot`：\n\
  \n```\nmethods(plot)\n[1] plot,ANY-method               plot,color-method\n[为节省空间省略]\n\
  [71] plot.table*                   plot.textplot\n[为节省空间省略]\n[81] plot.varclus \
  \                 plot.xyVector*\nsee '?methods' for accessing help and source code\n\
  ```\n\n某些函数后面带有星号，表示这些方法不是公开的或无法直接访问，例如 `plot.table()`。例如，如果我们键入其名称，会得到一个找不到该函数的错误：\n\
  \n```\nplot.table\nError: object 'plot.table' not found\n```\n\n**注意**\n\n`::` 运算符用于引用特定包中公开导出的函数，主要用于多个包导出同名函数的情况：`package::foo()`。`:::`\
  \ 运算符用于访问包命名空间中未导出的函数。应谨慎使用非公开函数，因为它们可能会在没有通知的情况下更改。\n\n不公开或未从包命名空间导出的函数仍然可以作为方法访问。这些函数也可以通过指定其来源包并使用\
  \ `:::` 运算符来直接访问，从而显示函数源代码：\n\n```\ngraphics:::plot.table\nfunction (x, type = \"\
  h\", ylim = c(0, max(x)), lwd = 2, xlab = NULL,\nylab = NULL, frame.plot = is.num,\
  \ ...)\n{\nxnam\n```\n\n除了为新类编写方法外，有时为现有类编写方法也很有帮助。例如，流行的 `ggplot2` 包没有用于处理线性模型或回归对象的默认方法。首先，我们使用内置的\
  \ `mtcars` 数据建立一个简单的回归模型。然后，我们通过调用 `factor()`，根据 `hp`、`vs`、它们的交互项（由 `hp * vs` 创建，展开为主效应项及其交互项或乘积项）以及虚拟编码的\
  \ `cyl` 来预测 `mpg`。通过对对象调用 `summary()` 来显示结果：\n\n```\nm |t|)\n(Intercept)  26.92908\
  \    2.71758   9.909 2.56e-10 ***\nhp           -0.01519    0.01554  -0.978  0.33718\n\
  vs            8.53352    4.95297   1.723  0.09678 .\nfactor(cyl)6 -4.21121    1.93887\
  \  -2.172  0.03916 *\nfactor(cyl)8 -8.65096    2.69738  -3.207  0.00354 **\nhp:vs\
  \        -0.09101    0.04363  -2.086  0.04692 *\n\nSignif. codes:  0 '***' 0.001\
  \ '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\nResidual standard error: 3.007 on 26 degrees\
  \ of freedom\nMultiple R-squared:  0.7913,  Adjusted R-squared:  0.7511\nF-statistic:\
  \ 19.71 on 5 and 26 DF,  p-value: 4.181e-08\n```\n\n我们可以使用以下代码检查对象的类别，并确认当前没有 `ggplot()`\
  \ 方法：\n\n```\nclass(m)\n[1] \"lm\"\nmethods(ggplot)\n[1] ggplot.data.frame* ggplot.default*\
  \    ggplot.summaryP\n[4] ggplot.transcan\nsee '?methods' for accessing help and\
  \ source code\n```\n\n尽管 `fortify()` 函数有一个用于线性模型的方法，该方法能创建一个适用于 `ggplot()` 的数据框，但它只提取原始数据、拟合值和残差。为了展示模型的效果，将预测值绘制为其中一个变量在其他变量取特定值时的函数可能会很有帮助。下面的方法实现了一个实现此功能的系统。\n\
  \n\n\n它采用与`ggplot()`相同的基本参数，但增加了`vars`参数，并且模型中使用的每个变量都通过一组特定值传递，以便在预测时保持这些值。通过使用`do.call()`函数将列表作为参数传递给`expand.grid()`，可以创建所有可能的变量值组合。然后，从模型公式中提取因变量（即`yvar`）并将其转换为字符。随后生成新的预测值及其标准误。基于拟合值或预测值以及正态分位数乘以拟合标准误，生成包含下限`LL`和上限`UL`的\
  \ 95%置信区间。最后，将列名从`fit`更改为因变量的实际名称，然后将用于预测的数据与预测值合并成一个新的数据框。最终传递给`ggplot()`，该函数会调度到数据框的`ggplot()`方法。\n\
  \n```\nggplot.lm <- function(data, mapping, vars, ...) {\nnewdat <- do.call(expand.grid,\
  \ vars)\nyvar <- as.character(formula(data)[[2]])\nd <- as.data.frame(predict(data,\
  \ newdata = newdat, se.fit = TRUE))\nd <- within(d, {\nLL <- fit + qnorm(.025) *\
  \ se.fit\nUL <- fit + qnorm(.975) * se.fit\n})\ncolnames(d)[1] <- yvar\ndata <-\
  \ cbind(newdat, d[, c(yvar, \"LL\", \"UL\")])\nggplot(data = data, mapping = mapping,\
  \ ...)\n}\n```\n\n有了这个方法，我们可以轻松地从线性回归模型生成一些图形。以下代码使用了我们的新方法，指定了预测变量的确切值，通过`geom_line()`添加线条，并使用`theme_bw()`应用黑白主题。结果如图\
  \ 5-2 所示；代码如下：\n\n![A393929_1_En_5_Fig2_HTML.jpg](img/A393929_1_En_5_Fig2_HTML.jpg)\n\
  \n**图 5-2.**  \n使用`ggplot.lm()`方法从模型预测的回归线。\n\n```\nggplot(m, aes(hp, mpg), vars\
  \ = list(\nhp = min(mtcars$hp):max(mtcars$hp),\nvs = mean(mtcars$vs),\ncyl = 8))\
  \ +\ngeom_line(size=2) +\ntheme_bw()\n```\n\n因为在我们的方法中使用`expand.grid()`创建了所有可能的预测变量组合，所以我们可以生成多条预测线，例如将`vs`保持在`0`和`1`，如下例代码和图\
  \ 5-3 所示：\n\n![A393929_1_En_5_Fig3_HTML.jpg](img/A393929_1_En_5_Fig3_HTML.jpg)\n\
  \n**图 5-3.**  \n使用`ggplot.lm()`方法从模型预测的回归线（含置信区间）。\n\n```\nggplot(m, aes(hp, mpg,\
  \ linetype = factor(vs), group = factor(vs)), vars = list(\nhp = min(mtcars$hp):max(mtcars$hp),\n\
  vs = c(0, 1),\ncyl = 8)) +\ngeom_ribbon(aes(ymin = LL, ymax = UL), alpha = .25)\
  \ +\ngeom_line(size=2) +\ntheme_bw()\n```\n\n这些示例简要介绍了编写新类和方法或扩展现有类和方法时可以完成的工作。由于\
  \ S3 系统是 R 中最常用的系统，它可能是最重要的要学习的系统；它应用广泛，并且可以扩展许多对象类。\n\n## S4 系统\n\n与 S3 系统相比，S4\
  \ 系统是一个正式的系统。这种形式化的好处是，能够更大程度地确保特定类的对象包含完全符合预期的内容。形式化的缺点是更高的复杂性：需要更多函数来设置类和方法，并且编程要求更加严格。S3\
  \ 系统允许编写快速且粗略的代码，而 S4 系统则需要更周密的计划，并且开销更高。\n\n对象包含三个组成部分：类（class）、槽（slot）和方法（method）。对象的名称和结构——即它所包含的内容——称为类。对象中存储的变量或其他对象称为槽。最后，可以对对象进行操作的函数称为其方法。在本节中，我们将逐一介绍这些组件。关于\
  \ S4 系统的进一步阅读，推荐 John Chambers 所著的《用于数据分析的软件：使用 R 进行编程》（Springer，2010 年）。\n\n###\
  \ S4 类\n\n因为 S4 类更加形式化，在编写新类之前需要预先规划。与 S3 类不同，在 S4 中必须指定要包含的每个变量的名称和类型。之前我们使用 S3\
  \ 系统定义了一个名为`textplot`的类。我们可以使用 S4 系统定义相同的类。`x`和`y`参数应为数值类型，`labels`参数应为字符型。我们还知道所有参数的长度应相同。最后，我们可能需要断言，虽然允许缺少标签，但不允许出现空白标签。所有这些都需要提前考虑和指定——因为在\
  \ S3 系统中，这些都无法控制，而在 S4 系统中，我们可以在创建类时定义所有内容。为了创建我们的第一个 S4 类，我们使用`setClass()`函数，如下例所示。并非每个参数都是必需的，但在定义新类时尽可能明确被认为是一种良好实践。\n\
  \n注意\n\n通过调用`setClass()`创建 S4 类。`Class`和`slots`参数是必需的。类名指定为字符向量，槽（保存变量）定义为一个命名字符向量；名称对应槽名，值对应每个槽的类。可以使用`prototype`参数指定一个“空”对象，并且可以通过向`validity`参数传递一个函数来设置有效性检查。\n\
  \n第一个参数`Class`提供类的名称。接下来，使用一个命名向量定义`slots`，其中名称指示槽名，值指示每个槽的类型。`prototype`参数不是必需的，但定义它有助于确定如何创建一个“空”对象，或者在没有指定具体数据时如何创建该类的一个对象。`validity`参数也不是必需的，但允许进行明确的检查，以确保对象符合预期。R\
  \ 默认确保将适当类型的对象传递给槽，但可以添加许多其他测试和有效性检查，以减少创建无法按预期工作的对象的机会。以下是`setClass()`示例：\n\n```\n\
  setClass(\nClass = \"textplot\",\nslots = c(\nx = \"numeric\",\ny = \"numeric\"\
  ,\nlabels = \"character\"),\nprototype = list(\nx = numeric(0),\ny = numeric(0),\n\
  labels = character(0)),\nvalidity = function(object) {\nstopifnot(\nlength(object@x)\
  \ == length(object@y),\nlength(object@x) == length(object@labels))\nif (!all(nchar(object@labels)\
  \ > 0, na.rm = TRUE)) {\nstop(\"All labels must be missing or non zero length characters\"\
  )\n}\nreturn(TRUE)\n}\n)\n```\n\n要在 S4 系统中创建特定类的新对象，我们使用`new()`函数。在接下来的代码中，我们检查创建新对象的三种尝试。首先，我们创建一个正确且有效的对象。然后，我们查看如果尝试使用错误类型的参数会发生什么。最后，我们查看一个测试我们所创建有效性函数的示例。\n\
  \n```\nnew(\"textplot\",\nx = c(1, 3, 5),\ny = c(1, 2, 4),\nlabels = c(\"First\"\
  , \"Second\", \"Third\"))\nAn object of class \"textplot\"\nSlot \"x\":\n[1] 1 3\
  \ 5\nSlot \"y\":\n[1] 1 2 4\nSlot \"labels\":\n[1] \"First\"  \"Second\" \"Third\"\
  \nnew(\"textplot\",\nx = c(1, 3, 5),\ny = c(1, 2, 4),\nlabels = 1:3)\nError in validObject(.Object)\
  \ :\ninvalid class \"textplot\" object: invalid object for slot \"labels\" in class\
  \ \"textplot\": got class \"integer\", should be or extend class \"character\"\n\
  new(\"textplot\",\nx = c(1, 3, 5),\ny = c(1, 2, 4),\nlabels = c(\"First\", \"Second\"\
  , \"\"))\nError in validityMethod(object) (from #16) :\nAll labels must be missing\
  \ or non zero length characters\n```\n\n\n\n如果我们使用`S3`系统定义类，则不会发生这些错误，因为不会进行类型检查或有效性检查。在前面的示例中，每次尝试创建新对象时最多出现一个错误。下一个示例有两个错误：传递给`y`槽位的向量与其他两个向量的长度不同，并且存在一个零长度的字符标签。然而，按照当前的写法，只有第一个错误被捕获，因为有效性函数在出现任何问题时就会停止：\n\
  \n```\nnew(\"textplot\",\nx = c(1, 3, 5),\ny = c(1, 2),\nlabels = c(\"First\", \"\
  Second\", \"\"))\nError: length(object@x) == length(object@y) is not TRUE\n```\n\
  \n编写有效性函数的另一种方法是，该函数不针对任何问题立即抛出错误，而是收集所有问题并在最后统一返回。在修改有效性函数时，我们还可以思考如何让错误信息更具信息性。目前，问题本身相当直观，但或许并非一目了然地看到具体问题是什么。例如，很明显长度不相等，但到底是`x`太长还是`y`太短？这在修订后的类定义代码中得到了实现。\n\
  \n然而，在深入改进有效性函数之前，我们需要简要了解如何在`R`中创建和格式化字符串。首先，在编写文本时，可以通过包含特殊字符`\\n`来插入换行符。为了查看示例，我们使用`cat()`函数，该函数代表连接并打印，将文本输出到`R`控制台（如果指定了文件，则输出到其他位置）。以下两个示例除了第二个示例中`a`和`b`之间的换行符外完全相同：\n\
  \n```\ncat(\"ab\", fill = TRUE)\nab\ncat(\"a\\nb\", fill = TRUE)\na\nb\n```\n\n\
  一个常用的函数是`paste()`，它可以合并向量或将它们折叠起来。以下第一个示例展示了合并操作。两个向量通过`sep`参数定义的分隔符（本例中为空字符串）进行合并。在第二个示例中，一个包含多个元素的向量被折叠成一个单一的字符串。向量元素如何合并成一个字符串由`collapse`参数决定——在我们的示例中，该参数是换行符。\n\
  \n```\npaste(c(\"a\", \"b\"), c(1, 2), sep = \"\")\n[1] \"a1\" \"b2\"\npaste(c(\"\
  a\", \"b\"), collapse = \"\\n\")\n[1] \"a\\nb\"\n```\n\n这些函数在我们编写有效性检查函数时非常有用，因为它们允许我们根据需要将多个错误合并成一个带换行符的字符串。\n\
  \n我们使用的另一个关键函数是`sprintf()`。它的第一个参数是用户定义的字符串，其中包含总是以百分号（`%`）开头的特殊符号，表示需要在此处替换值。后续参数是要替换的值。用一个例子可以最清晰地展示其用法。这里，`%d`用于表示替换一个整数，然后`R`会依次替换为`98`、`80`和`75`。替换的顺序就是出现的顺序。\n\
  \n```\nsprintf(\"First (%d), Second (%d), Third (%d)\", 98, 80, 75)\n[1] \"First\
  \ (98), Second (80), Third (75)\"\n```\n\n常用的替换格式选项包括：`%d`用于整数，`%f`用于定点小数，`%s`用于字符串，`%%`用于字面上的百分号。每个选项都在下一个示例中得到了展示，更多文档可在帮助页面`?sprintf`中找到。对于数值，我们使用`0.2`来指定数字应四舍五入到两位小数。\n\
  \n```\nsprintf(\"Integer %d, Numeric %0.2f, String %s, They won by 58%%\",\n5, 3.141593,\
  \ \"some text\")\n[1] \"Integer 5, Numeric 3.14, String some text, They won by 58%\"\
  \n```\n\n掌握了`paste()`和`sprintf()`之后，我们可以着手修改`textplot`类的有效性函数，以提供更具信息性的错误信息，并运行所有检查，在过程中收集错误，最后一次性返回所有错误。最后一点说明：之前，我们使用`new(\"\
  classname\", arguments)`这个习语来创建特定类的新对象。虽然这完全可行，但存在一种快捷方式。函数`setClass()`的主要作用是通过副作用来定义一个新类，但它也会不可见地返回一个构造函数。如果我们保存对`setClass()`的调用结果（按照惯例，使用与类同名的对象），就可以使用结果对象来创建该类的新对象：\n\
  \n```\ntextplot <- setClass(\"textplot\", \n    representation(x = \"numeric\",\
  \ y = \"numeric\", labels = \"character\"),\n    validity = function(object) {\n\
  \        errors <- character()\n        if (length(object@x) != length(object@y))\
  \ {\n            errors <- c(errors, sprintf(\n                \"x (length %d) and\
  \ y (length %d) are not equal\",\n                length(object@x), length(object@y)))\n\
  \        }\n        if (any(nchar(object@labels) == 0, na.rm = TRUE)) {\n      \
  \      errors <- c(errors, sprintf(\n                \"%d label(s) are zero length.\
  \ All labels must be missing or non zero length\",\n                sum(nchar(object@labels)\
  \ == 0, na.rm = TRUE)))\n        }\n        if (length(errors)) {\n            stop(paste(c(\"\
  \\n\", errors), collapse = \"\\n\"))\n        } else {\n            return(TRUE)\n\
  \        }\n    }\n)\n```\n\n现在，当我们创建同一个包含多个问题的对象时，我们将获得更多信息并节省一些按键操作。我们可以看到`x`和`y`的长度，同时也了解到标签存在问题：\n\
  \n```\ntextplot(\n    x = c(1, 3, 5),\n    y = c(1, 2),\n    labels = c(\"First\"\
  , \"Second\", \"\"))\nError in validityMethod(object) (from #30) :\nx (length 3)\
  \ and y (length 2) are not equal\n1 label(s) are zero length. All labels must be\
  \ missing or non zero length\n```\n\n\n  \n### S4 类继承\n\n到目前为止，你已经了解了如何定义新的 S4 类。S4\
  \ 系统可能看起来比 S3 系统需要更多的工作，并且除了更正式的数据验证和错误检查之外，几乎没有其他好处。S4 系统的强大特性之一便是继承。\n\n**注意**\n\
  \nS4 类可以通过调用 `setClass()` 并增加参数 `contains = \"要继承的 S4 类\"` 来继承现有的 S4 类。现有的槽、原型和有效性检查都会被继承。在新的\
  \ `setClass()` 调用中，只需指定新的槽以及对应的原型/有效性检查。\n\n我们之前创建了一个简单的 `textplot` 类。现在假设尽管我们的简单类有时已经足够，但在其他时候我们可能需要更多功能。例如，有时我们可能希望深入挖掘数据，并根据某个分组变量为数据的不同子集创建一个面板图。为此，我们需要一个\
  \ `groupedtextplot` 类。然而，我们唯一需要额外增加的数据就是一个槽。一种选择是复制并粘贴我们旧的代码，然后根据需要进行修改。在本节中，我们将探讨如何利用继承来重用和扩展现有类。当一个类继承自另一个类时，前一个类中的所有槽以及有效性检查都会被继承。接下来，我们创建\
  \ `groupedtextplot` 类。这与创建一个新类类似，但我们只定义新的槽，然后通过使用 `contains` 参数来指定继承关系。由于有效性检查也会被继承，我们只需要为新的槽指定有效性检查。\n\
  \n```\ngroupedtextplot <- setClass(\nClass = \"groupedtextplot\",\nslots = c(\n\
  group = \"factor\"),\nprototype = list(\ngroup = factor()),\ncontains = \"textplot\"\
  ,\nvalidity = function(object) {\nif (length(object@x) != length(object@group))\
  \ {\nstop(sprintf(\"x (长度 %d) 与 group (长度 %d) 不相等\",\nlength(object@x), length(object@group)))\n\
  }\nreturn(TRUE)\n}\n)\n```\n\n只需这些少量的代码，我们就可以使用我们的新类了。在下面两个例子中，第一个例子展示了正确创建的新对象，第二个例子则展示了当我们试图创建一个无效对象时常见的错误信息：\n\
  \n```\ngdat <- groupedtextplot(\ngroup = factor(c(1, 1, 1, 1, 2, 2, 2, 2)),\nx =\
  \ 1:8,\ny = c(1, 3, 4, 2, 6, 8, 7, 10),\nlabels = letters[1:8])\ngdat\nAn object\
  \ of class \"groupedtextplot\"\nSlot \"group\":\n[1] 1 1 1 1 2 2 2 2\nLevels: 1\
  \ 2\nSlot \"x\":\n[1] 1 2 3 4 5 6 7 8\nSlot \"y\":\n[1]  1  3  4  2  6  8  7 10\n\
  Slot \"labels\":\n[1] \"a\" \"b\" \"c\" \"d\" \"e\" \"f\" \"g\" \"h\"\ngroupedtextplot(\n\
  group = factor(c(1, 1, 1, 1, 2, 2, 2, 2)),\nx = 1:8,\ny = c(1, 3, 4, 2, 6, 8, 7),\n\
  labels = c(letters[1:7], \"\"))\nError in validityMethod(as(object, superClass))\
  \ (from #30) :\nx (长度 8) 与 y (长度 7) 不相等\n1 个标签长度为零。所有标签必须缺失或长度非零\n```\n\n在这种情况下，`textplot`\
  \ 被称为父类，而 `groupedtextplot` 被称为子类。这种关系可以用图表示（有时对于复杂的继承关系，画图会很有帮助）。按照惯例，这种关系在图形上用箭头表示，箭头从子类指向父类，例如\
  \ `textplot <- groupedtextplot`。同样按照惯例，父类通常放在左边，或者如果从上到下绘图则放在上方。尽管本书只涉及单亲继承，但类可以从多个父类继承，而这些父类也可以从其他父类继承，以此类推。正是在这些情况下，可视化图表会特别有用。使用继承而非编写一个全新的类的另一个好处是，方法也会被继承。这意味着我们可以重用父类的槽以及为父类编写的方法，这是下一节将讨论的主题。\n\
  \n### S4 方法\n\n除了之前看到的用于显示给定函数可用方法的 `methods()` 函数之外，在 S4 系统中，我们可以使用 `showMethods()`\
  \ 来查找方法。由于有了更正式的类系统，`showMethods()` 可以用来显示特定函数的所有方法，或者通过使用 `classes = \"class name\"\
  ` 参数来显示特定类（针对任何函数）的所有方法。如果你正在使用一个新类，并且想知道已经有哪些方法被编写并可用，这将非常有帮助。\n\n**注意**\n\n可以通过使用\
  \ `showMethods(\"泛型函数\")` 来检查可用的 S4 方法。新的 S4 方法通过调用 `setMethod()` 来定义。主要的三个参数是 `f`、`signature`\
  \ 和 `definition`，分别包含泛型函数的名称（字符串）、将分派到此方法的 S4 类名称（字符串）以及作为实际方法的函数。\n\n要在 S3 系统中编写新方法，我们只需编写具有特殊命名约定的函数。要定义\
  \ S4 方法，我们使用 `setMethod()` 函数。我们可以为现有类编写新方法，当然也可以为新类编写方法。对于一个新类，需要为 `show()` 提供一个方法。当在控制台中简单地输入一个对象时，R\
  \ 通过调用 `show()` 来显示它。如果没有为新类提供 `show()` 方法，默认的打印输出会相当难看，正如你到目前为止在我们的示例中看到的那样。\n\n\
  在下面的代码中，我们为 `textplot` 类定义了一个新方法。第一个参数是我们为其创建方法的函数名称。下一个参数是签名，即类的名称。在这种情况下，因为 `show()`\
  \ 只接受一个参数，所以只需要指定一个类名。对于具有多个参数的函数，签名可能会变得更加复杂，根据多个参数的类有不同的方法。最后，我们编写函数，即方法的定义。代码相对简单，使用\
  \ `cat()` 函数来显示值。参数 `fill = TRUE` 的作用是添加换行符，以便每行以 `X:` 或变量标签开头，然后是值。使用 `head()`\
  \ 函数来获取最多前五个值，如果值更少则获取全部。\n\n```\nsetMethod(\nf = \"show\",\nsignature = \"textplot\"\
  ,\ndefinition = function(object) {\ncat(\"     X: \")\ncat(head(object@x, 5), fill\
  \ = TRUE)\ncat(\"     Y: \")\ncat(head(object@y, 5), fill = TRUE)\ncat(\"Labels:\
  \ \")\ncat(head(object@labels, 5), fill = TRUE)\n})\n[1] \"show\"\n```\n\nR 回显了我们刚刚为其创建方法的泛型函数\
  \ `show()` 的名称。现在，当我们创建一个 `textplot` 类对象时，会得到更漂亮的输出：\n\n```\ndat <- textplot(\n\
  x = 1:4,\ny = c(1, 3, 5, 2),\nlabels = letters[1:4])\ndat\nX: 1 2 3 4\nY: 1 3 5\
  \ 2\nLabels: a b c d\n```\n\n一旦我们开始定义方法，类继承的好处就变得更加明显。因为 `groupedtextplot` 继承自 `textplot`，如果没有为\
  \ `groupedtextplot` 定义方法，它会回退到 `textplot` 的方法（如果可用的话）。尽管并不完美（因为没有显示分组信息），但这仍然比默认输出要好：\n\
  \n```\ngdat\nX: 1 2 3 4 5\nY: 1 3 4 2 6\nLabels: a b c d e\n```\n\n接下来，我们为 `[` 函数定义一个方法，该函数用于子集化数据。这个函数更复杂，因为我们必须构建一个逻辑树来处理几种可能的参数组合。函数的第一个参数\
  \ `x` 是要被创建子集的对象。按照惯例，`i` 指行或观测值，`j` 指列或变量。如果只有 `i` 不缺失（即指定了行或观测值），通常包含所有变量。如果只指定了\
  \ `j`（变量），通常包含所有观测值。如果两者都指定了，则只包含选定的变量和观测值。这是通过使用一系列 `if` 和 `else if` 语句来实现的。这里涉及到三个新函数：\n\
  \n\n好的，作为高级文档工程师和翻译员，我将遵照您的指示，完成以下翻译任务。\n\n\n*   `validObject()`是一个通用函数，用于对特定对象类执行有效性检查（如果存在）。\n\
  *   `slotNames()`返回一个字符向量，给出每个槽位的名称。\n*   `slot()`的工作方式与`@`运算符类似，但可以使用字符串按名称提取槽位。\n\
