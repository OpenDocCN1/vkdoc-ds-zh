  ## 数据计算与变量创建


  既然你已经对如何在 `dplyr` 中管理原始数据有了较好的理解，我们现在开始聚焦于如何从旧数据创建新数据。为简单起见，我们从原始的 `iris` 数据集重新创建了我们的
  `diris` 数据集。然后，我们将准备使用新函数 `mutate()` 来创建或替换列。该函数以通常的第一个参数，后面的形参则表达创建新列需要执行的操作。无论是一个还是多个操作，只需创建表达式让
  `dplyr` 知道要向 `tibble` 中追加什么：


  ```

  diris

  1          5.1         3.5          1.4         0.2  setosa     0     1     2

  2          4.9         3.0          1.4         0.2  setosa     0     1     2

  3          4.7         3.2          1.3         0.2  setosa     0     1     2

  4          4.6         3.1          1.5         0.2  setosa     0     1     2

  5          5.0         3.6          1.4         0.2  setosa     0     1     2


  '
- '# ... 还有 145 行数据

  ```


  当然，新数据不一定意味着创建全新的列。相反，我们可能基于现有信息创建新的计算列。也许我们想要一个名为 `V` 的新列，它是 `Petal.Length` 和 `Petal.Width`
  的乘积。为清晰起见，我们首先移除之前刚刚添加的三个列：


  ```

  diris

  1          5.1         3.5          1.4         0.2  setosa  0.28

  2          4.9         3.0          1.4         0.2  setosa  0.28

  3          4.7         3.2          1.3         0.2  setosa  0.26

  4          4.6         3.1          1.5         0.2  setosa  0.30

  5          5.0         3.6          1.4         0.2  setosa  0.28


  '
- '# ... 还有 145 行数据

  ```


  更复杂的计算可以通过仅在特定条件发生时执行来实现。在这种情况下，`if_else()` 接受三个参数。第一个是用于测试 if/else 语句的逻辑条件。第二个和第三个形参分别指示在
  `if` 或 `else` 时要做什么。此外，`mutate()` 不仅允许我们创建包含数据的列，还可以更改现有列的数据。因此，如果我们第一次创建的 `V2`
  列（它对 `setosa` 品种采用了花瓣宽度和长度的乘积关系）还不够，我们可以将其扩展为对 `virginica` 品种进行平方根运算。为了确保我们看到每个品种的样本，我们使用
  `slice()` 函数来查看三个特定的行：


  ```

  diris

  1          5.1         3.5          1.4         0.2     setosa  0.28  0.28

  2          7.0         3.2          4.7         1.4 versicolor  6.58    NA

  3          6.3         3.3          6.0         2.5  virginica 15.00  3.87

  ```


  创建新列并非必要；可以简单地使用 `summarise()` 函数在表格上计算信息。和往常一样，第一个形参告诉函数使用哪个数据，而其余形参则用于保存各个计算。请注意，可以编码一个或多个计算。在这里，我们演示两个这样的计算：算术平均值和标准差：


  ```

  summarise(diris, M = mean(Sepal.Width), SD = sd(Sepal.Width))


  '
- '# A tibble: 1 x 2

  M    SD


  1   3.1  0.44

  ```


  与 `data.table` 不同，`dplyr` 通过函数工作。此外，尽管你的数学教授可能花了些时间讲解函数组合（以及那种将一个函数嵌套在另一个函数内的技术有其用武之地），但
  `dplyr` 中有一种更清晰的外观。使用 `%>%` 操作符将多个函数链接在一起可以让我们在操作结束时得到想要的结果。假设我们想获取我们的数据，只使用 `virginica`
  品种，并计算萼片宽度的平均值。结果应该是一个只包含一个变量的 `tibble`，即我们寻求的平均值。请注意，当使用 `%>%` 操作符时，数据集会作为第一个参数传递。因此，尽管在下面的代码中我们看起来指定了
  `filter()` 的第一个形参，但因为我们使用了 `%>%` 操作符，该函数被修改了，数据集作为第一个参数传递，而我们写的 `Species == "virginica"`
  则作为第二个参数传递：


  ```

  diris  %>%  filter(Species == "virginica") %>%  summarise(M = mean(Sepal.Width))


  '
- '# A tibble: 1 x 1

  M


  1     3

  ```


  这种一步一步进行的思路可以修改以处理各种数据操作。回顾我们对 `data.table` 的研究，该结构的第三个形参 `by =` 允许我们按列的元素进行组织。对于
  `dplyr`，我们在列名上使用 `group_by()` 来完成相同的任务。将我们的均值示例扩展到所有三个品种，我们现在有一个两列的 `tibble`，每个品种一行。我们还可以获取多个原始列的均值。注意
  `virginica` 的萼片宽度均值是 `3`，无论我们如何计算。


  ```

  diris %>%  group_by(Species) %>%  summarise(M1 = mean(Sepal.Width), M2 = mean(Petal.Width))


  '
- '# A tibble: 3 x 3

  Species    M1    M2


  1     setosa   3.4  0.25

  2 versicolor   2.8  1.33

  3  virginica   3.0  2.03

  ```


  这种链式结构，就像数据表的链式结构一样，可以无限（或接近无限）地进行下去。要在上述数据中找到一个相关性，我们只需在链的末尾再添加一个步骤：


  ```

  diris %>%

  group_by(Species) %>%

  summarise( M1 = mean(Sepal.Width),  M2 = mean(Petal.Width)) %>%

  summarise(r = cor(M1, M2))


  '
- '# A tibble: 1 x 1

  r


  1 -0.76

  ```


  变量也可以创建其他变量。我们根据花瓣宽度是否大于该品种花瓣宽度的中位数来创建一个新变量。这可能让它的外观有些变化，但这仍然是一个 `tibble`：


  ```

  diris %>%

  group_by(Species) %>%

  mutate(MedPW = Petal.Width > median(Petal.Width))

  diris

