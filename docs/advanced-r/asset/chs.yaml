  | `methods()` | 返回给定函数的可用方法列表。 |\n| `showMethods()` | 返回给定函数的可用方法列表，或者如果使用了`classes`参数，则返回给定类的任何函数的可用方法列表。\
  \ |\n| `:::` | 允许访问包中未导出（非公共）函数的运算符。 |\n| `function.class()` | 命名 S3 方法的通用方案，使用函数名，后跟一个点，再跟应用该方法的对象类名。\
