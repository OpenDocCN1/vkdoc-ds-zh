  \ 4.4\n4          4.4\n5          4.5\n\n# ... 还有 145 行\n```\n\n到目前为止，我们所有的操作都会返回另一个\
  \ `tibble` 作为输出。要将原始数据提取为向量，需要使用几种不同的技术。如果我们知道包含所需数据的列名，直接键入名称很容易。如果我们的列名可能是可变的，则可以通过第三种方法重用我们的变量\
  \ `v`。无论使用哪种方法，控制台都会打印相同的数据。请注意，这些数据是向量，而不是数据表结构。我们用粗体标记了将列数据作为向量访问的代码，只是为了强调。\n\
  \n```\nhead(diris[[\"Sepal.Length\"]])\n[1] 4.3 4.4 4.4 4.4 4.5 4.6\nhead(diris$Sepal.Length)\
  \       # easy to type\n[1] 4.3 4.4 4.4 4.4 4.5 4.6\nhead(diris[[v]])          \
  \     # easy if you have a R variable\n[1] 4.3 4.4 4.4 4.4 4.5 4.6\n```\n\n排除某列或多列可能比选择特定列更有意义。排除操作使用多种格式的否定。特别是，要排除的列可以通过名称或位置来指定：\n\
  \n```\nselect(diris, -1)\n\n# A tibble: 150 x 4\nSepal.Width Petal.Length Petal.Width\
  \ Species\n\n1         3.0          1.1         0.1  setosa\n2         3.2     \
