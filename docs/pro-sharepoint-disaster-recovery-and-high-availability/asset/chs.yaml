  ## 最终结论


  > *我的基本原则是，你做出决定不是因为它们容易；不是因为它们便宜；也不是因为它们受欢迎；你做出决定是因为它们是正确的。*

  > *——西奥多·赫斯伯格（美国神职人员，大学校长）*


  本章的目的是从前面各章中提炼出关键的指导原则。本书无意规定一条通往高可用性和灾难恢复理想状态的唯一路径。世界上有太多不同的环境、人员和组织，这使得每一次实施都独一无二，尽管相似。就像定制西装一样，你可以制作一个适合所有人的尺码，但很可能穿在任何人身上都不太好看。


  我在此的目标是基于我来之不易的经验提供见解和原则。我学到了一些经验教训，并将其应用于我着手每个新的 `SharePoint` 项目，这些是我创建个人 `SharePoint`
  架构所拥有的最有用、最有价值的工具。


  `SharePoint` 的核心原则是：


  *   你必须理解 `SharePoint` 才能管理它；过于简单的比喻是一个陷阱。

  *   拥抱 `SharePoint` 中的变革并妥善管理。

  *   让你的平台尽可能以用户为中心。

  *   业务部门和 `IT` 部门必须沟通和协作。

  *   保持流程和程序的最新状态。

  *   在恢复中，人员和文档比工具更重要。

  *   进行监控以在问题发生前进行预判。


  ## 各章关键点


  ### 第 1 章：避开灾难


  本章介绍了泰坦尼克号灾难的比喻，这是贯穿全书的一条主线。提及这艘船的原因，部分在于它是一个警示故事：自满可能导致灾难，无论你拥有多少保护措施，灾难仍会发生。但我还想强调它，因为它可能是历史上被研究得最多的人为灾难，因此，我们可以从中汲取大量教训，并将其应用于任何高可用性和灾难恢复规划中。


  这场灾难与现代 IT 灾难有许多共同点：


  *   多重诱因

  *   过度依赖弹性和冗余

  *   利润和低成本优先于安全

  *   监控不力

  *   灾难发生时出现混乱

  *   缺乏恢复手段


  最终，沉船事件对这艘船的所属公司——白星航运公司的命运产生了巨大的连锁反应。他们专注于建造廉价轮船并快速抵达纽约，而将安全置于次要地位，最终导致其垮台：他们最终被冠达航运公司收购，现已不复存在。你的组织可能也是如此：其现在对
  `SharePoint` 的依赖程度可能比最初想象的要高。本章的第一条原则是，不要忽视你的组织在物质层面和品牌认知层面对技术的依赖程度。




