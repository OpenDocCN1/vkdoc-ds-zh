  \ Automation Services | 在 Web 浏览器中查看和刷新已发布的 Word 文档。 | 缓存 |\n| Microsoft SharePoint\
  \ Foundation 订阅设置服务 | 为服务应用程序提供多租户功能。 | `DB` |\n\n了解您的服务应用程序是理解如何部署 SharePoint 以实现良好`QoS`和用户体验的关键部分。最简单的并不总是最好的。目标是更好的沟通和更高的生产力，这有时意味着需要不止一个中心。\n\
  \n## 单一中心\n\n单一中心是指 SharePoint 服务器场和所有服务应用程序都从一个位置运行（图 5-14）。这种方法的优点是复杂性较低，这意味着成本较低。缺点是对远离中心（如悉尼）的用户而言`QoS`非常差。这也意味着所有元数据和搜索内容都被整合。然而，总体而言，虽然`IT`部门在管理方面和财务部门在成本方面能获得好处，但这些好处被平台为业务带来的潜在投资回报损失所抵消，因为远离中心的用户将缺乏分享和协作的动力。\n\
  \n![9781430263289_Fig05-14.jpg](img/9781430263289_Fig05-14.jpg)\n\n图 5-14。对管理员来说简单，对远程用户来说缓慢\n\
  \n## 中心带分支\n\n\n\n"
- '# 中心辐射式架构通过在一个区域（本场景中为悉尼）部署服务器场，为区域用户提供良好的协作服务质量（参见图 5-15）。他们利用此架构进行本地协作。由于大部分社交网络活动也是本地化的，因此他们的“我的网站”也托管在此处。虽然可以在不同服务器场之间共享用户配置文件，但目前不支持通过广域网链路使用`User
  Profile service application`。这是因为该服务需要直接访问数据库。因此，对于本场景中的广域网环境，推荐改用`User Profile
  Replication Engine`（`UPRE`）。`UPRE`是`SharePoint Administration Toolkit`（`http://technet.microsoft.com/en-us/library/cc508851.aspx`）的一部分。它可以在用户配置文件服务应用程序之间复制用户配置文件和社交数据（如社交标签、备注和评分）。此复制可以是单向或双向的。Fancy
  Flowers 公司决定采用此方法，因为他们发现伦敦和悉尼之间的时差阻碍了知识共享和分支间的良好沟通。他们开发了“我的网站”功能，显示所有员工的动态，以便员工更好地相互了解并进行更有效的沟通。


  ![9781430263289_Fig05-15.jpg](img/9781430263289_Fig05-15.jpg)


  图 5-15. 更复杂但投资回报率更高


  搜索服务也集中在伦敦。这通过联合悉尼索引中的内容来实现，而不是直接爬网内容。联合类似于同时运行多次搜索并将结果显示在同一页面上，但位于不同的 Web 部件中。这使用户更容易识别内容所在的位置。您可以从中央服务器场直接通过广域网链路爬网内容。SharePoint
  中的搜索架构针对通过广域网连接进行爬网进行了优化。您甚至可以将爬网组件放在单独的爬网服务器上。这些服务器将专门用于爬网远程内容，从而减少对整体性能的影响。由于常规
  Intranet 页面更新频率较低、编辑者较少、阅读者较多，因此可以托管在远离用户的位置，但可以使用缓存来加快访问速度，因为页面大多处于“热”状态而非“冷”状态。


  仅仅因为您可以跨广域网链路部署服务，并不意味着您就应该这样做。不建议跨广域网部署 Web 分析服务，可能是因为它占用大量带宽，会通过消耗所有带宽对其他应用程序产生不利影响。对于业务数据连接服务，当服务器场靠近数据源时，服务质量最佳。安全存储服务也是如此：确保服务靠近其要进行身份验证的应用程序。此选项比中心辐射式架构更复杂且更昂贵，但您的组织可能会因此从
  SharePoint 中获得更多价值。


  ## 中心辐射式与迷你中心辐射式


  第三种选项是前两种方案之间经济实惠的折衷方案，即仅在地区办事处部署 SharePoint Foundation，如图图 5-16 所示。这为本地用户提供了快速协作的好处，而无需承担
  SharePoint Standard 或 Enterprise 许可证的成本。地区办事处越多，越需要考虑此方案。这些本地办事处中的内容仍可由中心服务器场爬网，但用户需要到中心服务器场进行搜索。本质上，这与仅采用中心辐射式架构相同，但增加了独立的低成本本地协作站点。


