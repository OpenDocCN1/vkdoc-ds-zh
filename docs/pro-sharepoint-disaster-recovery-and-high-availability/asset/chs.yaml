  制定计划至关重要，但具体规划如何将计划付诸实施，将决定其是否有效。未经演练的船员救不了任何人，包括他们自己。


  ### 第 3 章：激活你的计划


  灾难本质上具有不可预测性，本章的关键原则是，你必须知道何时以及如何激活你的灾难恢复计划。以泰坦尼克号为例，许多乘客以为沉没只是一次演习。船沉得很慢，人们花时间才理解实际发生的情况。灾难发生后，媒体也难以弄清状况（图
  12-3）。关于实际发生了什么，以及是否确实有人员伤亡，存在大量混乱信息。


  ![9781430263289_Fig12-03.jpg](img/9781430263289_Fig12-03.jpg)


  图 12-3. 早期错误头条报道称：“全员获救”


  在 SharePoint 中，灾难恢复计划本身总是受到关注，但员工和用户如何知道启用它的时机已到？由谁来做这个决定？如果那个人不在怎么办？灾难时期可能充满混乱；正常流程不再适用（例如在沉船上准备菜单，图
  12-4），相关人员可能无法到位。你的 SharePoint 灾难很可能是更大规模的 IT 或网络灾难，甚至是组织整体灾难（例如洪水）的一部分。必须有明确定义的流程和程序。然而，本章的主要原则是，让合适的人在合适的时间出现在合适的地点，是确保你的计划得到正确执行的首要方法。这里的警告是，资源需要集中于应对突发情况的变化，而不是那些不再优先的任务。


  ![9781430263289_Fig12-04.jpg](img/9781430263289_Fig12-04.jpg)


  图 12-4. 当船开始沉没时，准备菜单不再是首要任务


  ### 第 4 章：高可用性


  帮助你实现高可用性是本书的主要目标之一。第 4 章的关键原则是，不受管理的变更是对系统可用性的主要风险。虽然必须强调构建技术上的高可用平台，但技术故障并非导致故障的主要原因。SharePoint
  出问题是因为人们未能考虑到他们所做变更的潜在风险。这有时是由于组织高层人员将某个需求列为紧急事项，然后坚持要求在不考虑后果的情况下进行变更。换句话说，他们“以权压人”。这就是为什么必须建立变更管理流程。


  基于每年简单运行时间百分比的可用性目标，确实提供了一个经验性的年度目标，但它们很少包含计划内维护，也无法衡量不可用性的影响。


  弹性和冗余是必要的，它们依赖于高质量的硬件和对系统的持续监控，以确保其正常运行。将旧服务器回收到生产场中绝非明智之举。以泰坦尼克号为例，其救生艇上的船名被移除，并被重新用于白星航运公司的其他船只（图
  12-5）。


