  ## 是时候恢复 SharePoint 了！


  此时，灾难恢复团队已使 SharePoint 所需的多个依赖系统恢复正常运行。现在，重点可以转移到第一层 SharePoint 系统。如何具体恢复 SharePoint
  系统的细节将取决于您制定的计划，本书稍后将对此进行更详细的探讨。


  ## 总结


  您清楚地看到，在实施 SharePoint 灾难恢复计划之前，必须准备就绪许多流程和程序。这些并非纸面上抽象的事物，而是由特定角色履行的实际任务。它们包括：


  -   在正确的地点会合，并使用预定义的方法进行沟通。

  -   了解必须遵循的预定义优先级。

  -   知道计划的存放位置并能够获取它。

  -   提前确保计划包含应有的内容。

  -   在正确的时间付诸实施。

  -   了解相互依赖关系。

  -   知道谁负责什么。


  现在，您的 SharePoint 团队不会再像泰坦尼克号的厨房员工一样了！


