  ## 使用 SQL Server 进行备份


  将 SQL Server 作为唯一备份方法的主要限制是，您无法使用 SQL Server 工具（或 Data Protection Manager）来备份服务应用程序。可以使用
  SQL Server 备份内容数据库，但请注意，您必须手动重建场的其余部分，如果用户正在等待，这并非良策。如果您正在运行 SQL Server Enterprise，Microsoft
  强烈建议您使用备份压缩。有关备份压缩的更多信息，请访问 `http://go.microsoft.com/fwlink/?LinkID=129381`。


  将 SharePoint 备份策略的重点放在 SQL Server 上的风险在于：如果您对 SQL Server 的了解胜过对 SharePoint 的了解，您会倾向于认为
  SQL Server 备份就是还原场所需的全部内容。我不建议这样做，但 SharePoint 确实依赖于 SQL Server 的以下组件，在规划整体 SharePoint
  备份策略时应将其考虑在内。捕获事务日志将捕获 SQL 数据库中所做的更改，而 BLOB 是 SharePoint 在 SQL Server 之外的存储，因此我在此处对两者都进行了引用。


  ### 事务日志


  在 SQL Server 中，每个数据库至少有一个数据文件和一个事务日志文件。SQL Server 将数据物理存储在数据文件中。事务日志文件存储对 SQL Server
  数据库执行的所有修改的详细信息，以及执行每次修改的事务的详细信息。由于事务完整性被视为 SQL Server 的基本和固有特性，因此在 SQL Server 中无法关闭事务日志记录。当您使用
  SharePoint 管理中心或 Windows PowerShell 备份场、Web 应用程序或数据库时，事务日志会自动备份。


  事务日志文件在逻辑上被划分为较小的段，称为虚拟日志文件。在 SQL Server 中，您可以将事务日志文件配置为根据需要扩展。事务日志的扩展可以由用户控制，也可以配置为使用所有可用的磁盘空间。您应避免这种情况，因为它会威胁到场的高可用性。


  要使事务日志保持可管理，请遵循以下准则：


  - 将事务日志文件的大小设置为较大的值，以防止它们自动扩展。

  - 在全面评估最佳内存大小后，使用内存单元而不是百分比来配置事务日志文件的自动扩展。


  ### BLOB


  `BLOBs`（二进制大型对象）用于远程 BLOB 存储 (`RBS`)。`RBS` 是一种在 SharePoint 内容数据库之外存储文件的方法。这样做有多种原因。


  - *节省成本：* SQL Server 存储比使用 SAN、NAS 甚至云层更昂贵。

  - *提高性能：* 对于较大的文件，上传或下载到 SQL Server 可能会很慢。

  - *更轻松地管理数据：* 现在您的存储集中了。

  - *满足合规性要求：* 例如，SEC 17a-4 要求组织将某些账户持有人文档存储在特定类型的合规存储层上。


  SharePoint Server 备份会备份远程 BLOB 存储，但前提是您使用 `FILESTREAM` 远程 BLOB 存储提供程序将数据放入远程 BLOB
  存储中。如果您使用其他提供程序，则必须手动备份远程 BLOB 存储。


  ### 文件系统的备份


  正如 Microsoft 在 TechNet 中指出的那样，场的以下组件不会被备份，因为它们存储在网络服务器上。文件级备份将捕获它们。


  - 应用程序池帐户密码

  - HTTP 压缩设置

  - 超时设置

  - 自定义 Internet 服务器应用程序编程接口 (ISAPI) 筛选器

  - 计算机域成员身份

  - Internet 协议安全 (IPsec) 设置

  - 网络负载平衡设置

  - 安全套接字层 (SSL) 证书

  - 专用 IP 地址设置


  这些详细信息最好记录在文档中。如下所示的自定义项也必须作为文件捕获并记录。请注意，使用解决方案和功能来打包这些内容将使它们的重新部署更加高效：


  - 母版页、页面布局和级联样式表。这些对象存储在 Web 应用程序的内容数据库中。

  - Web 部件、网站或列表定义、自定义列、新内容类型、自定义字段、自定义操作、编码工作流、工作流活动或条件。

  - 第三方解决方案及其关联的二进制文件和注册表项，例如 `IFilters`。

  - 对标准 XML 文件的更改。

  - 自定义网站定义 (`Webtemp.xml`)。

  - 对 `Web.config` 文件的更改。


  ## 工作流


  工作流是一种特殊类型的自定义项，您可以对其进行备份和恢复。好消息是，定义数据和工作流历史记录会保留在 SharePoint 备份中。甚至在处理中的工作流状态也会被保留。





  '
- '# 备份期间处于等待状态的任何 SharePoint Designer 工作流步骤都将在备份完成后恢复并完成。


  正如微软所建议的，请确保您的备份和恢复计划能应对适用于您环境的任何声明性或自定义声明性工作流场景。声明性工作流（例如您在 Microsoft SharePoint
  Designer 中创建的工作流）存储在它们所部署到的网站集的内容数据库中。备份内容数据库可以保护这些工作流。声明性仅意味着工作流的某些部分是预编写的，在此情况下由
  SharePoint Designer 编写，这样就不必从头开始编写所有代码。


  自定义声明性工作流操作在以下三个位置包含组件：


  - 活动的 Visual Studio 程序集存储在全局程序集缓存 (GAC) 中。

  - XML 定义文件（`.ACTIONS` 文件）存储在 14（或更高版本）的 `\TEMPLATE\{LCID}\Workflow` 目录中。

  - 一个用于将该活动标记为授权类型的 XML 条目存储在它被使用的 Web 应用程序的 `Web.config` 文件中。


  如果您的场工作流使用了自定义操作，您应该使用文件备份系统来保护这些文件和 XML 条目。与 Web 部件和事件接收器之类的 SharePoint Server
  功能类似，这些文件应在恢复后根据需要重新应用于场。


  依赖自定义代码的工作流（例如使用 Visual Studio 创建的工作流）存储在两个位置。工作流的 Visual Studio 程序集存储在全局程序集目录 (GAC)
  中，而 XML 定义文件存储在功能目录中。这与 Web 部件和事件接收器等其他类型的 SharePoint Server 功能相同。如果工作流是作为解决方案包的一部分安装的，那么备份内容数据库可以保护这些工作流。


  如果您创建的自定义工作流与工作流部署所在的网站集之外的网站集交互，则必须备份这两个网站集以保护该工作流。这包括写入另一个网站集中的历史列表或其他自定义列表的工作流。执行场备份足以备份场中的所有网站集以及与之关联的所有工作流。


  尚未部署的工作流必须像任何其他数据文件一样单独备份和恢复。当您正在开发新的工作流但尚未将其部署到 SharePoint Server 场时，请确保使用 Windows
  备份或其他文件系统备份应用程序来备份存储工作流项目文件的文件夹。


  ## 总结


  您的场是一个独特且不断变化的复杂系统。在专注于如何成功备份和恢复它时，您需要清晰记录并经过测试的步骤。您不能完全依赖自动化工具，部分原因是它们无法捕获所有内容，另一部分原因是它们只能捕获您指示它们捕获的内容和时间。请记住，您的
  SharePoint 场将具有外部依赖项，这些依赖项必须在场恢复之前进行备份和恢复。此外，SharePoint 不仅仅是 SharePoint 应用程序及其设置；它还建立在
  Windows 服务器、网络和 SQL Server 之上。没有这些部分，它就无法为用户运行。


  您的 SharePoint 场中最重要和最有价值的部分是花费最多时间和精力创建的部分：开发人员编写的代码和用户创建的内容。有些代码和内容比其他代码和内容更重要，我已经讨论过如何对内容进行优先级排序以实现组织的恢复点和恢复时间目标。使用
  SharePoint 备份所有内容并创建良好的文档，您将为自己提供成功备份的最佳机会。


  归根结底，准备工作和您的知识比您选择的工具更重要。


