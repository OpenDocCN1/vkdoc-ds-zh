  \n### 第 6 章：退一步思考\n\n本章强调，维护有效的备份主要并非取决于你使用的工具，而是依赖于文档化并经测试的流程与规程。必须持续审查备份和恢复流程，以确保其相关性和可靠性。备份时，不仅要优先考虑对组织最有价值的内容，还应优先考虑手工恢复耗时最长的内容。这包括开发者编写的解决方案以及未在其他地方复制的数据。\n\
  \n恢复测试应定期进行，即便不是每天一次。原本，“泰坦尼克号”计划于 1912 年 4 月 14 日（即撞上冰山当天）进行救生艇演习。然而，由于不明原因，史密斯船长取消了演习。许多人认为，如果演习得以进行，本可挽救更多生命。\n\
  \n### 第 7 章：监控\n\n前一章强调不应过度依赖工具，而本章指出监控工具未得到充分利用，且不应如此。监控在两个层面进行：Windows 和 SharePoint。两者对于健康的环境都至关重要。定期更新\
  \ SharePoint 系统及其依赖环境的健康关键指标必不可少。灾难发生前，总是有迹可循，只要有人主动观察就能发现。\n\n虽然“泰坦尼克号”沉没的消息在船上传播缓慢，但它实际上有自己的船上报纸。《大西洋每日公报》每日在“泰坦尼克号”上印刷。该报内容包括新闻、广告、股票价格、赛马结果、社会八卦以及当日菜单。\n\
  \n### 第 8 章：DIY 灾难恢复\n\n本章表明，SharePoint 备份和灾难恢复的责任正从 IT 基础设施所有者转移到用户自身手中。SharePoint\
  \ 确实提供了许多工具，使用户在灾难发生时能够自行恢复。这样做的主要好处是用户最了解自己的内容，能更快地响应备份需求，知道何时需要保护哪些内容。反之亦然：不需要多次备份的内容就不会被冗余备份。\n\
  \n### 第 9 章：变更管理与灾难恢复\n\n本章的主要原则是，变更是保持 SharePoint 对组织价值的必要条件，但一旦系统投入生产，必须妥善管理变更，以避免系统受损的风险。变更应尽可能采用开箱即用方式，因为这样对整体系统的风险更低，且无需缓慢的变更管理流程即可完成。业务和\
  \ IT 部门必须制定策略，将自定义代码和变更控制在最低限度。\n\n### 第 10 章：灾难恢复与云\n\n云在许多方面改变了 SharePoint 的架构和管理方式，因为硬件和软件更多地由第三方控制。将\
  \ SharePoint 平台迁移到云端，并不意味着不再需要理解和维护 SharePoint 的灾难恢复计划。为了与现有的 Windows 用户账户集成，你仍需规划并部署额外的服务器和软件。这些将成为你本地灾难恢复规划的重点。\n\
  \n### 第 11 章：最佳实践与最差实践\n\n此处的主要原则是，你必须关注决策的长期结果，而不仅仅是短期利益。你必须避免陷入薄弱假设、应对式变更态度以及不负责任的治理方式等泥潭。\n\
