  \ SharePoint 也会显得缓慢。如果网络慢到影响用户体验的程度，那么 SharePoint 的感知可用性就会受到影响。通过理解并改进 SharePoint\
  \ 所处的环境，您可以提高 SharePoint 的高可用性。本章将探讨一些可用于改善您为用户提供的服务质量的方法。其中一些方法包括：\n\n*   广域网优化\n\
  *   集中式与区域式 SharePoint 部署\n*   缓存\n\n## 为何服务质量至关重要\n\nQoS 由多种机制组成，这些机制使网络管理员能够控制网络上的带宽、延迟、延迟变化（抖动）和丢包率的组合，以便：\n\
  \n*   提供诸如 IP 语音（VoIP）之类的网络服务。\n*   为不同部门、应用程序或组织定义不同的服务水平协议（SLA）。\n*   对跨广域网的流量进行优先级排序。\n\
  \nQoS 使网络管理员能够对流量进行优先级排序并在整个网络中分配资源，以确保关键任务应用程序的交付，尤其是在负载繁重的环境中。流量通常根据协议进行优先级排序。那么，对流量进行优先级排序有什么好处呢？\n\
