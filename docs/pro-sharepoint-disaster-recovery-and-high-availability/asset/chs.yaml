  '
- "# 灾难恢复与云\n\n云计算终于足够成熟，是时候正确理解它能为 SharePoint 所有者带来何种益处了。尽管基础设施由外部第三方拥有，但贵组织中的 SharePoint\
  \ 所有者最终仍需为用户内容负责。同时，还需要负责凭据联合和单点登录。云端 SharePoint 可在专用硬件以及多租户环境中使用。无论哪种情况，管理员都必须调整或替换现有的\
  \ `HA` 和 `DR` 计划与流程。现在必须用不同的方式来思考这些概念，因为 `HA` 和 `DR` 的某些方面掌握在第三方手中，并且，如果您需要单点登录，还必须管理一大批新的服务器。\n\
  \n与 SharePoint 相关的云主要指的是作为微软 Office 365 一部分的 SharePoint Online，但它也可以指其他云托管公司（如 Rackspace\
  \ 或 Amazon）提供的服务，他们将为您提供外部物理或虚拟托管服务。这里将重点介绍 SharePoint Online，因为它将是最常见的选择。还有一种选择是混合解决方案，即部分内容在云端，部分在本地。这是目前最常见的情况，因为组织正在逐步向基于云的服务过渡。但在此情况下，这是由于分阶段迁移的结果，而不是为了将宝贵的、关键任务的或敏感的内容更安全地保留在本地，同时将价值较低、非关键任务或不太敏感的信息更廉价地托管在外部。\n\
  \n在本章中，我将探讨：\n\n*   SharePoint 如何逐渐演变为更“适配云”的应用程序，\n*   云选项（私有云、公有云和混合云架构），以及\n\
  *   在云场景下增加弹性和冗余的步骤。\n\n到本章结束时，您将看到单点登录和活动目录同步仍然意味着您需要在您的域中规划、安装和配置新服务器。您也仍然需要在用户的客户端机器上规划、安装和配置软件。您*还*需要为这些组件打补丁和更新。您不能简单地相信营销承诺。我将首先展示\
  \ SharePoint 多年来如何逐步“升入云端”，以及它现在如何几乎已准备就绪。\n\n## SharePoint 时间机器\n\n让我们回顾一下 SharePoint\
  \ 的过去，看看它是如何演变到如今这个状态的。SharePoint 始于 2001 年，当时商业界终于开始注意到互联网可以增强其组织内部的沟通和共享，类似于世界各地的学术机构多年来使用它的方式。起初，大家一窝蜂地构建的网站只不过是为委托它们的组织制作的精美名片。真正的\
  \ Web 应用程序少之又少。当时没有“基础设施即服务”或“软件即服务”的概念。\n\n后来，像亚马逊这样的公司开始通过互联网真正赚钱。亚马逊也是最早看到云托管潜力的公司之一，并因此成为当今该领域的主要参与者。\n\
  \n\n\n## 亚马逊的演进与云服务\n\n亚马逊通过运用其在在线零售领域构建大型基础设施的知识，打造了一个云平台，从而投资于超越零售商身份的转型。微软也意识到了互联网的重要性，以及它将像个人电脑取代大型机一样，取代个人电脑成为应用程序的所在地。微软一直致力于寻找通过互联网创建分布式应用程序的方法。`Windows\
  \ Azure` 平台是这项工作的成果，但我认为微软甚至没有意识到像 `SharePoint` 这样基于浏览器的应用程序能取得如此巨大的成功。在微软被认为在在线世界日益失去影响力的时代，`SharePoint`\
  \ 是唯一一个收入达到 10 亿美元的速度最快的微软产品。\n\n像谷歌和 Facebook 这样的公司现在面临着寻找像亚马逊那样实现多元化的挑战。否则，它们最终将被更年轻、更精简的竞争对手超越。这两家公司目前仍只有有限的收入来源，并且尚未成功实现多元化。在商业领域，超越自身起源进行适应和变革的能力至关重要。相比之下，与微软同时起步的苹果将在云领域扮演更重要的角色，而亚马逊也将因其适应新机遇的能力而在这个领域变得更加重要。谷歌和\
  \ Facebook 仍然仅靠广告盈利。如果人们不再使用它们，它们将迅速消亡。\n\n当我在 2001 年选择专攻`SharePoint`时，是因为我认为这是将我的互联网技能成功变现的最佳途径。我已在互联网领域工作了四年，但我意识到创建网站已不再是一个可行的业务方向。有太多小型竞争对手免费做网站，或者有大型公司拥有更多的资源。我希望作为一名独立顾问，拥有宝贵的技能，并且我看到`SharePoint`有潜力让我以此谋生。`SharePoint`花了\
  \ 10 年时间才达到可以被称为真正互联网应用的程度。然而，它仍然需要弥合一些差距才能充分发挥其潜力，我将在本章稍后部分更多讨论其发展方向。\n\n## SharePoint\
  \ 的过去\n\n当`SharePoint`出现时，与像`Lotus Notes`这样更成熟的协作产品相比，它落后于时代。`Lotus Notes`很好地结合了工作区和电子邮件。`Lotus\
  \ Notes`过去是，现在仍然是一个更集中的系统，这就是我认为它被`SharePoint`超越的原因。`SharePoint`还具有与 Windows 和 Office\
  \ 更好集成的优势。它承诺成为一个完整的网络应用程序，但仍带有编译应用程序的痕迹。你仍然通过光盘购买它，然后由具有服务器管理员权限的人将其安装在服务器上。你自己也为该服务器打补丁。用户确实通过网络浏览器访问该应用程序（图\
  \ 10-1），因此从这个意义上说，它是一个网络应用程序。但其实现方式的局限性很快就显现出来。用户只有拥有 Windows 帐户才能进行身份验证和访问。他们还需要登录到网络中的计算机上。他们被绑定在那个\
  \ Windows 帐户上。他们只能通过使用 VPN 等加密技术安全地扩展网络才能从办公室外访问`SharePoint`。否则，可以给`SharePoint`服务器分配一个外部\
  \ IP 地址、一个完全限定域名（`FQDN`），并通过匿名或基本身份验证使其可用，但这非常不安全，任何企业都不愿意这样做。\n\n![9781430263289_Fig10-01.jpg](img/9781430263289_Fig10-01.jpg)\n\
  \n图 10-1。`SharePoint` 2001 用户界面\n\n### 共享内容\n\n`SharePoint`中的数据无法轻易在办公室外共享，办公室外的数据也无法轻易共享到`SharePoint`中。\n\
  \n它看起来像是一个网络应用程序，但行为却像一个典型的 Windows 应用程序：一旦你将内容放入其中，就无法从其他应用程序访问它，也无法轻易地从其他位置引入内容。像真正简单的聚合（`RSS`）这样的选项是其他公司分享其内容的一种方式，但你必须自己编写\
  \ Web 部件和 XSL 来读取`RSS`提要（一个 XML 文件）。尽管`RSS`自 90 年代中期就已经可用，但`SharePoint`直到 2007 年才支持`RSS`（图\
  \ 10-2）。现在你可以在其他应用程序中查看`SharePoint`列表数据，反之亦然，但这仍然非常基础和薄弱，并且因缺乏简单安全的身份验证机制而受到阻碍。\n\
  \n![9781430263289_Fig10-02.jpg](img/9781430263289_Fig10-02.jpg)\n\n图 10-2。`SharePoint`\
  \ 2007 中的 `RSS`\n\n情况逐渐发生了变化，但我仍然认为还有很长的路要走。在应用程序之间（例如 SAP 和`SharePoint`之间）共享数据意味着需要构建更多的基础设施并学习诸如`SPNego`、`BSPs`和`WebDynPro`这样的深奥知识。Web\
  \ 服务和业务连接服务（`BCS`）有助于数据共享，但这仍然是一个非常技术性的领域。\n\n### 设计与开发\n\n`SharePoint`显然曾经只是另一个恰好使用网页的\
  \ Windows 应用程序，当你尝试用新功能扩展它时，新的代码必须手动直接安装到服务器上。安装、卸载、主动升级或撤销都非常困难。为`SharePoint` 2001\
  \ 进行开发意味着编写`WebDAV`以及一些 XML/XSL、HTML 和 JavaScript。ASP 页面存在，但只能在`SharePoint` 2001\
  \ 的 iFrame 中显示。渐渐地，.NET Framework 和`SharePoint`开发平台变得越来越像一个平台。在 2007 年，ASP.NET Web\
  \ 部件与`SharePoint` Web 部件并不相同。在 2005 年使用 Visual Studio 进行开发需要添加第三方插件来自动化打包和部署代码到你的`SharePoint`场。最后，由于如今的解决方案和功能更加成熟，你可以更容易地将代码部署到`SharePoint`、撤销和更新它。\n\
  \n前端过去看起来更像一个网站，所以似乎如果你了解 HTML 或 JavaScript 这样的互联网脚本语言，你就可以轻松地自定义它。现实情况是，像导航控件这样的重要部分要么是锁定的黑盒，要么是以不兼容、混乱的方式实现的。渐渐地，通过主题以及对\
  \ CSS、AJAX 和 REST 等跨平台网页设计技术的更多支持，`SharePoint`现在为设计师提供了更多对界面外观的自由掌控。\n\n### 身份验证\n\
  \n验证用户身份（身份验证）以及他们被允许做什么（授权）一直是互联网用户需要的东西，并且随着商业世界变得越来越小、联系越来越紧密，它也变得日益复杂。即使在一个单一的、大型的全球性组织内部，在\
  \ Windows 内的多个域中为一名员工维护一个唯一标识符也是一项挑战。当你想要与像 SAP 这样的其他系统共享这些凭据时，复杂性会呈指数级增长。将用户迁移到云端，通过创建一个新的访问管理平台来抽象化这种复杂性，但仍然存在将这些凭据与\
  \ Windows 中的现有凭据同步的问题。当你的网络与云端保持连接时，这可能会导致更大的复杂性和不安全性。我将在后面进一步讨论这一点。\n\n## SharePoint\
  \ 的现状\n\n随着 2003 年和 2007 年后续版本的发布，`SharePoint`逐渐演变和改善。当前版本的`SharePoint`（2013）变得更加像一个真正的互联网应用程序。它可以用于托管具有匿名页面的网站，支持多种身份验证方法（如基于表单的身份验证），并且可以通过\
  \ Web 服务和`BCS`更轻松地共享和访问信息。\n\n\n\n### 多租户与云中的 SharePoint\n\n更多外部公司提供多租户功能，以便它们能够在同一台场外服务器上以低成本向多个客户提供\
  \ SharePoint，且只需最少的设置规划。利用 BCS 和 SharePoint Designer，可以更轻松地从其他系统引入数据（参见图 10-3）。\
  \  \n![9781430263289_Fig10-03.jpg](img/9781430263289_Fig10-03.jpg)  \n图 10-3 为 SharePoint\
  \ 创建 BCS 连接\n\n最终，Business Productivity Online Services（BPOS）以及现在的 Office 365（包括\
  \ SharePoint Online）面世了。SharePoint 实际上已经摆脱了其网络应用程序祖先的束缚，实现了成为真正 Web 应用程序的承诺。SharePoint\
  \ Online 意味着您的 SharePoint 内容托管在您不拥有、也无责任进行修补、备份或日常管理的基础设施上。您可以立即为任何人（甚至包括网络之外的人员）预配新用户帐户，然后只需按月支付帐户许可证费用。SharePoint\
  \ 从 2001 年在少数几台服务器上简单实现 Exchange 和 IIS，发展为一个庞大而复杂的集合体，包含许多运行众多服务应用程序的服务器。SharePoint\
  \ Online 的及时出现，是因为企业级 SharePoint 已经变得非常复杂，能够将管理负担转移到场外，对许多组织来说将是一个极佳的选择。SharePoint\
  \ 终于登上了云端。\n\n对于我们许多 SharePoint 场的所有者来说，习惯 SharePoint Online 需要一些调整。如果我们想了解系统何时会进行更新，必须等待\
  \ Microsoft 发布信息，最可能的发布位置是`http://community.office365.com/en-us/b/office_365_technical_blog/default.aspx`。这些更新的频率不可预测，但很可能是每六到九个月一次。\n\
  \n当您使用 Microsoft 在异地托管自己的基础设施时，您将拥有更多控制权。例如，您可以托管与最新版本不同的 SharePoint 版本。您组织内部用于部署到\
  \ SharePoint 的变更管理流程总体上将保持不变，但您很可能会为您的功能和解决方案维护一个在线测试环境（而非本地环境），以使测试环境尽可能接近生产环境。由于\
  \ SharePoint Online 仍然相对较新，在编写高级设计文档时，迁移到 SharePoint Online 的主要指导来源仍然是 Microsoft。话虽如此，现在有越来越多优秀的咨询公司在这方面提供技能和经验。\n\
  \n## SharePoint 的未来\n\n在 SharePoint 与云的关系方面，仍有改进空间。主要领域在于与其他系统互操作以共享数据，以及使凭据共享更加无缝。随着更多组织迁移到云，它们将处于共享平台上，这将逐步促进这一进程。因此最终有可能实现，例如，创建两个不同组织都可以使用自己的凭据访问的\
  \ SharePoint 站点。最终，借助像 SharePoint 这样的技术，实现诸如拥有一份可以立即与世界上任何医生共享的虚拟医疗记录这样的梦想将变得更加可能。浏览器本身是\
  \ SharePoint 向智能手机和平板电脑等不同平台传播的障碍。依赖 WIMP（Windows、图标、菜单、定点设备）界面与 SharePoint 交互，意味着需要大量定制才能使\
  \ SharePoint 与触摸屏配合使用。Microsoft 正在响应这一需求；在 Windows 8 中，这种情况已有所改善。\n\n数据中心围墙将取代服务器塔成为集成的障碍，但最终这些围墙也会消失。\n\
  \n与此同时，构建包含云元素的最可用、最具灾难恢复能力的 SharePoint 架构仍然需要仔细规划，但与 10 年前 SharePoint 起步时相比，可能性已经多得多。\n\
  \n## 云的优势\n\n首先，让我们看看将 SharePoint 部署到云中而非本地的理由。在本节中，我将讨论云的容量和敏捷性相关优势。当然，云托管有许多与高可用性不直接相关的好处，我在此不会全部讨论。但请记住，存在一些间接的高可用性优势。例如，低拥有成本意味着\
  \ SharePoint 不太可能成为预算削减的牺牲品，从而使低成本成为一种弹性优势。\n\n### 负载变化\n\n> 英雄所见略同，但愚者鲜有雷同。  \n\
  > — 英国谚语\n\n每一个面向公众甚至仅面向内部员工的企业，都必须有一套流程来处理负载变化的问题。您的 SharePoint 服务器必须在无人使用它们时，或者在数百或数千人突然决定同时使用系统执行相同操作时保持可用。本节展示了云如何使解决这种变化性问题变得更加可行。\n\
  \n### 云爆发\n\n负载变化也称为爆发。以火车站的一家咖啡店为例。收银台的员工在火车进站前闲坐无事，然后 300 人排队 10 分钟购买早晨的咖啡因补给。然后那些人离开，员工再次空闲，直到下一班火车进站。服务器也会发生同样的情况：清晨和午饭后负载可能非常高，而一天中的其余时间则很平静。我最近看到的另一个例子是，一家公司让员工可以通过\
  \ SharePoint 内联网上的 InfoPath 表单申请一部新智能手机。一旦指向该表单的电子邮件发出，服务器上的负载就会增加 500%，性能下降，员工感到沮丧。\n\
  \n从 SharePoint 的角度来看，这种负载峰值的问题与火车站咖啡店相同。采购和保留服务器（无论是咖啡服务器还是 SharePoint 页面服务器）需要时间和金钱。如果它们\
  \ 90% 的时间处于空闲状态，那就是浪费资源。对于咖啡店老板来说，理想的情况是能够在早高峰雇佣 20 名服务员，支付他们 2 小时的工资，然后在上午 9:30\
  \ 让其中 19 人回家。但人们不愿意这样工作，除非他们得到一整天的报酬，而没有任何雇主愿意这样做。\n\n然而，云可以支持启动一组新服务器，然后在不再需要它们时将其关闭。此外，大多数提供商只按服务器运行的时间收费。他们不会对采购流程或存储未使用的服务器收费，因为这些服务器无一例外都是虚拟的，资源可以相对立即地重新分配给另一个客户。\n\
  \n### 管理不可预测性\n\n我给出的关于公司为员工提供智能手机的例子是可预测的爆发，就像知道每个工作日的 8:50 火车会满员一样。在智能手机优惠案例中，云的一个好处是，您可以在第一周启动新的基础设施来支持涌入的负载。大多数云提供商还简化了实时监控，因此随着需求下降，您可以卸载额外的资源，从而只需按需付费。这里的高可用性优势显而易见，不容低估。\n\
  \n然而，爆发往往是不可预测的。正是在不可预测的爆发中，云计算才真正彰显了其可用性、可靠性和弹性。所有云提供商都允许您指定事件，当事件发生时，系统会自动扩展以处理需求。\n\
  \n\n\n例如，你可以指定这样的事件：如果前端 Web 服务器的 CPU 负载平均值都超过 50%，云提供商将自动向服务器集群中添加一台新的前端服务器，以帮助应对不断增长的负载。该功能每周七天、每天二十四小时全天候运行，无论身处世界何处。许多企业在本国标准工作时间之外没有足够的覆盖能力，但互联网是全球性的，全年无休，不分国家或宗教假日。无论负载峰值何时出现，集群都会自动扩展以处理新的意外负载，并在负载水平下降后自动收缩。\n\
  \n## 动态资源分配\n\n`SharePoint` 可能因其自身成功而受害。企业中通常存在对协作解决方案（如 `SharePoint`）的积压需求，一旦 IT\
  \ 能够满足业务需求并匹配其要求，它就会快速增长。这种增长让一些组织感到意外；他们推出一个试点环境，却看到团队争相使用，并要求访问权限。存储空间迅速被填满，因为未考虑实际生产用量，因此没有进行容量规划。用户在没有任何指导的情况下获得站点；有些人将其视为不断缩小的网络容量的替代品，从而将内容倾倒到这一新的存储空间中。\n\
  \n云中的 `SharePoint` 相对于行动缓慢的内部采购部门具有显著优势。尽管这并不能替代良好的治理和规划，但云提供商可以分配更多虚拟资源并启动新的虚拟服务器来应对负载，因为它们的容量通常远大于任何单一企业所能产生的负载。这并不是说\
  \ `Microsoft`、`Amazon` 或 `Rackspace` 不会超额订阅其容量；它们不可避免地会这样做，但它们也不会浪费资金。超额订阅不同于容量过剩。公平地说，你采购足够硬件以应对需求的问题并没有消失；你只是将其转移给了你的云提供商。没有所谓的无限容量，但云提供商可以动态重新分配资源，从而提供比实际拥有更多的资源。\n\
  \n## 满足需求\n\n让我们以火车站咖啡店老板为例。想象一下，他还拥有车站内的修鞋和干洗服务。咖啡高峰期一过，他就可以将员工重新分配到其他两家业务中，处理堆积的鞋子和衣物。咖啡顾客不需要知道，每天微笑着为他们服务的员工正在为别人清洗西装。云提供商可以向用户承诺资源以满足任何需求，只要不是所有人同时提出资源需求。\n\
  \n## 敏捷性\n\n你可以让用户使用 `SharePoint Online`，所需时间只是规划、申购、安装和配置本地网络 `SharePoint` 服务器场时间的一小部分。当然，如果你想添加品牌定制并与你的\
  \ `Active Directory` 账户同步，这会增加时间，但基本思路是，你可以在注册并创建账户所需的时间内，让组织中的所有人都使用上 `SharePoint\
  \ Online`。这对任何组织都极具吸引力。用户通常是在需要时才提出需求，而不是提前数周或数月。这仅仅是因为他们不知道自己何时会需要什么；他们总是对市场变化（如客户需求）做出反应。反应最快的组织，尤其是在竞争对手之前响应客户需求的组织，将最终胜出。\n\
  \n对于小型企业来说，`SharePoint Online` 的入门成本也合理得多。构建冗余服务器以及开发、预生产和生产服务器场对大多数组织来说成本过高。\n\n\
  我在前几章中描述了所有要求。使用云意味着这些责任主要转移给你的云提供商。回顾一下，仅为了实现大多数 `RTO` 和 `RPO`，你需要以下内容：\n\n-  \
  \ 文档完善的灾难规划及相应的激活流程。\n-   多个负载均衡且冗余的前端 Web 服务器。\n-   运行服务应用程序实例的服务器的冗余。\n-   网络组件的冗余：交换机、`NIC`、反向代理和负载均衡器等。\n\
  -   使用群集、镜像和/或日志传送实现的数据库服务器级冗余。\n-   存储冗余，例如 `SAN` 复制和带 `RAID` 的磁盘条带化。\n-   数据中心冗余，意味着在第二个故障切换数据中心中具备上述所有内容。\n\
  -   经过充分测试和文档记录的备份流程。\n\n即使你仅为一个月的一个用户创建了一个 `SharePoint` 站点，大多数云提供商也会包含所有这些内容。这使得人们很容易不想去考虑本书让你考虑的所有信息。\n\
  \n如果你的组织确实购买了所有这些硬件并付出了所有这些努力，却仍然无法满足用户的需求，或者当服务器准备好时用户的需求已经发生了变化，那该怎么办？如果服务器场搭建和部署不正确，从而浪费了资金呢？使用像\
  \ `SharePoint Online` 这样的云提供商可以降低试用 `SharePoint` 的成本，从而大大减少潜在损失。一般来说，使用云提供商，你只需按月为使用的资源付费；如果你决定停止使用该服务，你只需支付到当天（或最坏情况到当月）为止的使用费用。\n\
  \n## 云架构\n\n你不能仅根据你提供的服务是托管在本地还是异地来简单分类你的云架构，因为可能是本地或异地云，或两者的组合。在考虑哪种方案更好时，区别在于成本和控制。这对于云中的\
  \ `SharePoint` 以及所有现成（`OOB`）解决方案与完全定制解决方案都是如此：成本越高，控制力越强，但完成所需的工作和时间也越多。想想图 10-4\
  \ 中的例子：如果你让裁缝为你定制一套西装，它完全符合你的要求，但需要投入更多的时间和金钱。风险在于，西装可能在你拿到手时就已过时，或者你在此期间长胖了。如果你买一套现成的西装，它便宜、快捷，且能满足你的基本需求。如果你不喜欢，可以扔掉再买一套，损失不大。你的可用资源和需求之间总有完美的平衡。你的需求越独特，成本就越高。这对\
  \ `SharePoint` 和西装都一样适用。如果你目前仅依赖本地部署并想改变，那么你需要考虑组织所需的成本和控制水平。\n\n![9781430263289_Fig10-04.jpg](img/9781430263289_Fig10-04.jpg)\n\
  \n图 10-4. 定制意味着成本\n\n## 公有云\n\n使用公有云时，你的整个 `SharePoint` 部署都托管在组织外部。这种模式具有前面描述的所有优势。从硬件和软件的角度来看，缺点在于缺乏对基础设施的直接控制，这限制了你在发生故障时的掌控力，以及你定制应用程序的程度。`SharePoint\
  \ Online` 标准版和专享版（又称企业版）是公有云中 `SharePoint` 的最佳示例。`SharePoint Online` 标准版意味着你的站点与其他客户共享相同的硬件；这也被称为多租户。使用专享版，你拥有自己的硬件，这从安全或合规性的角度来看可能是必要的。\n\
  \n\n\n"
- '# SharePoint Online 专用计划：RTO 与 RPO


  这还让企业和管理员对服务器场拥有更强的控制感。根据微软的服务级别协议（SLA），专用计划还具备更优的 RTO 和 RPO：`http://technet.microsoft.com/en-us/library/sharepoint-online-service-description.aspx`


  - “SharePoint Online 专用服务描述单页”见于 `http://technet.microsoft.com/en-us/library/dn275923.aspx`。

  - “Microsoft SharePoint Online 标准服务描述”见于 `http://technet.microsoft.com/en-us/library/sharepoint-online-service-description.aspx`。


  总之，SharePoint Online 专用版的 RPO 为 45 分钟或更短，RTO 为 2 小时或更短（这 2 小时不包括计划停机时间）。对于标准版，RPO
  为 12 小时，RTO 为 24 小时。这差距相当大。


  ## 私有云


  私有云是指大型公司的 IT 团队像公有云提供商一样运作，向组织内的部门、处室和团队销售服务。这样做可以更轻松地跟踪 IT 部门的成本和收益。IT 部门通过降低成本并最大化盈利能力，更像一个独立业务来运作。从某种意义上说，它们与外部公有云竞争，因为业务部门可以选择不从内部购买，而是转向外部。即使它们不能这么做，也可以比较价格。云计算具有规模经济效应：只有非常大型的企业才能负担得起搭建和维护私有云的前期成本，但这可以打造一个更精简、更高效的
  IT 部门，并让业务部门意识到提供 IT 服务所涉及的成本。这意味着减少浪费，最终为公司节省更多资金。私有云还可以制定不同的策略和规则，以反映特定需求。这就像定制西装：它比现成的成衣更适合你，但从时间和精力投入来看，制作和维护的成本却很高。


  仅仅因为你的所有 SharePoint 服务器都虚拟化了，并不意味着你就拥有了私有云。虚拟基础设施需要的管理与物理基础设施一样多。云则更加自动化。正是这种自动化使云具备可用性、可扩展性甚至自我管理能力。除了基础设施自动化之外，云的设计初衷是托管多个租户，这些租户即便在物理上不隔离，也在逻辑上相互分离。SharePoint
  内置了帮助维护成百上千个此类租户的功能。建立在独立租户基础上对于云的概念至关重要。这意味着 SharePoint 可以支持沙盒化的用户组，使得一个组无法看到另一组的数据；这些组可以是业务单元、部门、办公室、团队、处室等。这也意味着如果一个组引发了性能问题，它不会对潜在的其他数千个组的性能或可用性产生负面影响。这种隔离和自动化的能力使
  SharePoint 具备云能力，这与之前的版本不同。


  ## 混合云：始祖鸟


  微软使用术语 *混合云* 来描述公有云和私有云的混合体。我认为混合模型与其说是两种模型的混合，不如说是一种真正的过渡模型，就像**始祖鸟**，它是恐龙向鸟类过渡的中间形态。混合模型适用于希望逐步向云过渡，同时慢慢缩减本地部署架构的组织。


  技术已经变得更小、更便宜、更便携，也变得更加虚拟化。本地服务器场就像恐龙一样：它们需要过多的资源才能生存。更小、适应性更强的生物才能存活下来。始祖鸟离开了地面，飞向了云端。它及其类似的生物进化成了今天存在的大约一万种鸟类。这也是
  SharePoint 目前正在经历的转型。我的观点是，混合环境存在局限性，使其不如完全迁移至云端那样有吸引力。


  简单地使用云进行简单、非任务关键且非机密的共享与协作更有意义。将更敏感、更有价值的材料保留在本地。最终，混合云兼具了其前身（公有云和私有云）的优势，但它同时也保留了两者的弱点。


  ## 迁移


  将内容从一个位置迁移到另一个位置是企业的常见需求。在我看来，将流程迁移到公有云的实用功能比迁移数据更重要。关注过去生成的内容通常是一种反射性的防御机制，一种普遍的对变革的潜意识恐惧。通常没有必要将
  95% 的旧内容迁移到新平台。这并不意味着应该删除它们。可以将本地架构慢慢标记为只读状态，这样它就不会继续增长。部分内容可以归档，最终大部分可以删除。关于迁移最佳实践的更多信息，请参见第
  11 章。


  在为组织提供咨询时，我经常遇到一个现实情况：用户通常不愿意接受他们生成的大部分内容仅在初始协作阶段有用。其中很多内容都是更大范围工作的副产品，例如记录决策或流程。这些记录可以迁移到云端，但这最好由业务部门自己完成，而不是由
  IT 部门或通过第三方工具来完成。无论哪种方式，迁移此类内容都比其带来的好处更慢、更昂贵。


  用户必须拥有对自己内容的掌控权。如果他们真的必须保留某些东西，可以通过逐步手动操作或借助工具轻松地将其从一个环境迁移到另一个环境。迁移的真正工作在于：


  -   规划与协调迁移

  -   识别谁拥有什么内容

  -   选择要保留哪些内容

  -   定义要应用哪些元数据

  -   决定将其放入何种结构中：网站、列表和库

  -   决定对内容应用何种安全设置


  工具只能应用用户已选择的内容。大多数内容不再有所有者、缺少元数据且是非结构化的，因此不可能知道它们对业务的未来价值。


  进化，就像使用 SharePoint 进行协作一样，是一个过程，而用户流程可以快速迁移到新平台。SharePoint 的优势之一在于能够快速创建新的协作空间、工作流、表单和网站。这正是迁移到云端的潜在益处所在。迁移大量不够新的数据在资源方面代价高昂：包括硬件、软件以及
  IT 人员和业务人员的时间和精力。这是一个鲜为人知的事实，但真正的机遇在于迁移业务流程。旧信息仍然有价值，但可以归档，或保留在较旧的只读平台上以供参考。


  ## 云中的灾难恢复架构设计


  在本节中，我将展示如何实现云中的 SharePoint。关键点在于来自不同租户的内容、用户和代码可以相互隔离。选择专用硬件的租户比与其他租户共享空间的租户获得更优待遇：SharePoint
  Online 标准版仅支持 30 天的回收站和 14 天的灾难恢复磁带备份。完整备份每 12 小时执行一次，并保留 14 天。SharePoint Online
  专用版则为您提供 30 天的磁带备份。这是一个巨大的差异。无论哪种情况，一旦这 14 天或 30 天过去，就无法找回丢失的数据。如果这还不够，那么 SharePoint
  Online 云就不适合您。不过，总还有像 Amazon 或 Rackspace 这样的第三方托管服务商，只要您支付容量费用，就可以按任何想要的计划安排备份。让我们更详细地看看
  SharePoint Online 是如何实现多租户的。




  ### 多租户架构


  要理解如何在公有云或私有云场景中规划灾难恢复，首先必须了解 SharePoint 如何在物理和逻辑层面划分多租户内容。使用"租户"这一比喻，是因为该系统在逻辑上类似于公寓楼的组织方式。某个租户只能访问整体建筑中属于自己的空间，但他们同处一栋楼，共享走廊、楼梯和电梯等公共基础设施。SharePoint
  的多租户能力遵循类似的逻辑。租户内容的逻辑容器是网站集，可以将其视为房间。租户可以在整栋建筑中拥有多个房间。


  在 SharePoint 2007 中，租户只能通过 Web 应用程序进行逻辑隔离，而 SharePoint 场中可创建的 Web 应用程序数量有限（仅数百个）。这好比公寓楼的最大楼层数——不同租户不能位于同一楼层。然而，SharePoint
  2013 及更高版本允许在同一个 Web 应用程序（即同一楼层）中容纳多个租户。以下是实现这一功能的原因。


  ### 订阅


  网站订阅听起来像是与警报相关的功能，但它实际上是一种以唯一 GUID 形式存在的网站元数据，用于将网站与特定租户关联。可以将其理解为识别建筑中每个房间使用者的方式。网站订阅通过`PowerShell`创建。云服务提供商为新租户创建新租约后，即可将网站集与该
  GUID 关联。


  ### 管理网站


  此订阅`GUID`意味着租户可以通过名为"管理中心"的自管理网站来管理其网站集。租户管理网站（图 10-5）用于执行全局配置或结构更改，例如创建更多网站集、管理用户配置文件、术语库及其他服务应用程序。


  ![9781430263289_Fig10-05.jpg](img/9781430263289_Fig10-05.jpg)


  图 10-5. SharePoint Online 管理中心


  ### 功能包


  功能包是与某一租户关联的功能组。其实现方式与网站订阅相同：将 GUID 与功能关联以连接至特定租户。这使得云管理员或租户能够仅针对自己的网站集激活或停用功能。同时，这也催生了类似应用商店的市场模式——云服务商可向租户销售或租借功能。租户也能在自己的空间内创建功能商店。功能可通过
  Web 界面（图 10-6）进行激活或停用。


  ![9781430263289_Fig10-06.jpg](img/9781430263289_Fig10-06.jpg)


  图 10-6. 管理功能


  ### 主机标头网站集


  主机标头网站集在 SharePoint 2007 中就已存在，但仍是隔离租户网站的重要方法。主机标头网站集使云管理员能够为给定 Web 应用程序分配多个自定义域名（图
  10-7）。这样，Web 应用程序中的每个租户都可拥有自己的根级域名。例如，若 Web 应用程序的 URL 为`http://intranet.spsfaq.com`，则位于`http://intranet.spsfaq.com/sites/hr`的网站集可通过`http://hr.share1point.com`访问。


  ![9781430263289_Fig10-07.jpg](img/9781430263289_Fig10-07.jpg)


  图 10-7. 添加域名


  ### 服务隔离


  如租户管理网站部分所述，服务应用程序可以部署在所谓的"分区模式"下。这意味着服务应用程序与包含租户的特定 Web 应用程序相关联，每个租户都将看到各自的管理界面来配置该服务应用程序。这对于用户配置文件和术语库等服务应用程序尤为强大。由于
  SharePoint 2007 中共享服务提供商的划分范围有限，这是无法实现的。


  ### 沙盒解决方案与 SharePoint 应用


  沙盒解决方案对于在租户共享资源的環境中促进自定义开发至关重要。过去，租户的"公寓"看似隔离，但若某个租户的浴缸溢水，水会流入楼下多个公寓并造成破坏。现在，SharePoint
  在其独立的内存空间中运行自定义代码，因此即使代码消耗过多资源或崩溃，也只会影响该租户。SharePoint 2010/13 还允许租户将分配的资源中不同部分分配给不同解决方案。


  在 SharePoint 2013 和 SharePoint Online 中，沙盒解决方案正逐渐被弃用，转而采用"应用"。这些应用比沙盒解决方案具有更高隔离性，因此对基于租户平台的稳定性更安全。如同苹果的应用商店，它们在不损害平台完整性的前提下，扩展了
  SharePoint 平台能为企业提供的功能。


  如您所见，多租户架构将大部分可用性和资源管理的责任交给了云服务商，但某些部分现在可由租户自行管理，这适用于公有云或私有云。更大的复杂性在于规划云环境与 Windows
  网络之间的单点登录。


  ### 规划联合身份验证


  即使您在云中为用户创建了账户，这些账户也不会自动映射到员工用于登录 Windows 的用户账户。因此，用户访问云资源时需要输入云凭据。解决方案是通过 Active
  Directory 联合身份验证服务将您的 Windows Active Directory 连接到云环境。但从灾难规划角度看，这本身也带来风险，因此我将在下文详述。


  尽管您的云服务可能高悬于网络之上，但用户的 Active Directory 仍与本地环境紧密相连。这意味着若要确保用户的网络账户与云账户同步，您仍需在网络中添加基础设施。否则，用户每次访问云网站时都需重新登录，而无法通过
  Windows 自动获取凭据直接访问。若您确实要设置此类身份联合，必须考虑高可用性问题。虽然详细规划与部署身份联合的全部步骤超出了本书范围，但我将充分说明如何确保架构具备故障恢复能力。


  Active Directory 联合身份验证服务 2.0（`ADFS`）是一种 Windows 服务（而非 SharePoint 服务），用于将 Windows
  用户的凭据联合到您的云环境。`ADFS 2.0`是微软身份管理策略的核心组件，提供双向网关以发送和接收基于声明的请求，并使用包含用户信息及访问需求的 SAML
  令牌。安全断言标记语言（`SAML`）是一种基于 XML 的开放标准，用于在安全域之间交换身份验证和授权数据。关键点在于，它并非微软专属技术。其作用是在身份提供者（断言的生产者）和服务提供者（断言的消费者）之间以结构化方式传递身份数据。另一个重要注意事项是：这必须是一个单林环境。


  林拓扑结构分为两种：单林和多林。




  ### 林


  林代表了目录服务的最外层边界。林中的所有资源无论位于林中的哪个位置都会隐式相互信任。在每个林中，都有一个通用的目录架构和目录服务配置。一个林可以由一个或多个域组成。借助
  SharePoint Online（作为 Office 365 的一部分）实现单一登录时，不支持多个林。在凭据和先决条件方面，在将本角色添加到域之前，请确保已安装`.NET
  3.5 SP1`，并且已作为域管理员登录。


  ### 联合服务器场


  你将在域中的多台服务器上安装此服务器角色以提供冗余。这些服务器统称为你的联合场。你将把所有联合服务器放置在防火墙后的内部域中，并使用 NLB 主机创建一个具有专用集群
  DNS 名称和集群 IP 地址的集群。在创建联合服务时，你应使用与 NLB 集群 DNS 名称相同的 FQDN。这将提供服务器级别的冗余。此外，从弹性的角度来看，集群
  DNS 名称和联合服务名称必须相同，例如 `fs.share1point.com`。该 FQDN 还必须通过你首选的第三方域名注册商实现互联网路由。


  ### 联合代理服务器


  联合代理服务器将来自云中 SharePoint Online 的客户端身份验证请求重定向到你组织的内部域。这些服务器通常放置在与你内部网络隔离的 DMZ 中。除了内部网络中联合服务器场内的冗余
  ADFS 服务器外，你还需要至少两台额外的 ADFS 服务器（代理）用于硬件和 DNS 冗余，以及另一个专用的 NLB 集群。拥有另一个 AD 域是可选的，但通常将代理加入外部域而非内部域。


  DMZ 中的第二个 NLB 必须配置一个外部 IP 地址，该地址是域注册使用的。例如，你应向注册商注册一个类似于 `fs.spsfaq.com` 的域名，然后将其指向
  DMZ 中的 NLB 集群。NLB 集群 FQDN 还必须使用与内部 NLB 集群域名相同的集群域名。例如，两个集群以及联合服务都将使用相同的 FQDN (`fs.spsfaq.com`)。此外，联合代理服务器本身必须配置为可访问互联网的
  IP 地址。你还需要在安装过程中在数据库级别设置冗余，我将在接下来讨论这一点。


  ### 证书


  通过防火墙通信的所有 ADFS 流量默认使用端口 443 上的 HTTPS，因此你需要购买证书来加密流量，从而保证安全。否则，有人可能会拦截数据包并读取你的用户凭据。大多数组织使用与内部网络相同的证书。


  ### WID 与 SQL


  在规划阶段，你需要了解在安装过程中应选择哪种数据库模式。ADFS 是与 Active Directory 分开设置的；它只能与其通信。安装 ADFS 时，它会创建一个配置数据库；这可以是
  Windows 内部数据库 (WID) 或 SQL 服务器数据库。从冗余的角度来看，SQL 是更好的选择。这是因为对于 WID，只有一台服务器上有主副本，你可以在其中写入更改。其他服务器只是接收更改的传播副本。你只能写入主服务器；其他服务器是只读的。因此，如果你对配置进行更改，该更改必须传播到辅助服务器。


  使用 SQL Server，你可以拥有更多控制权，并且只有一个中央数据库。这意味着你可以使用任何服务器进行配置更改，并且没有传播延迟。


  由于你的数据位于 SQL Server 中，你现在可以享受到应用于其他 SharePoint 数据库的所有可伸缩性和高可用性优势。你可以使用 SQL Server
  的集群和镜像功能来实现高可用性，并且可以向集群中添加更多 SQL Server 以提高吞吐量。


  WID 还有一个可能影响也可能不影响你的规模限制：联合场中最多只能有五台服务器。五台服务器最多可支持 60,000 名用户。如果你的组织拥有超过 60,000
  名用户，你将需要使用 SQL Server，以便在联合场中添加超过五台服务器。尽管 SQL 具有许多 WID 不具备的优势，但大多数 ADFS 安装仍使用 WID，因为它非常易于配置。无论你的组织有多少用户，我建议你至少拥有两台联合服务器以实现冗余。另外，如果这些服务器是虚拟的，请确保它们分布在两台物理服务器上，以防止主服务器成为单点故障。


  ### 更多注意事项


  你可能曾认为设置云版本的 SharePoint 意味着不再需要规划或实施这种技术复杂的基础设施。在不使用身份联合的情况下，也可以在云中使用 SharePoint。这仅意味着用户需要偶尔显式登录。SharePoint
  Online 确实会进行有限量的 cookie 缓存，以便在浏览器会话之间保留用户身份，因此这并不像听起来那么不方便。除了设置此联合场之外，你还可以使用 `用于
  Windows PowerShell 的 Microsoft Online Services 模块` 来与 Office 365 建立信任关系。`用于 Windows
  PowerShell 的 Microsoft Online Services 模块` 是随 Office 365 一起提供的下载包。该模块会将一组 cmdlet
  安装到 Windows PowerShell 中；你运行这些 cmdlet 来为 Office 365 设置单一登录。Microsoft 建议在设置 Active
  Directory 同步之前设置单一登录。


  Microsoft 还指出，激活目录同步是一条单行道。你当前无法停用目录同步。一旦激活了目录同步，你只能使用本地应用程序编辑已同步的对象。


  此外，还有确保用户客户端机器为 Office 365 做好准备的任务。这意味着需要从 Office 365 下载页面安装 Office 365 所需的更新，以确保你的用户正在运行最新的
  Windows 更新。


  在 Office 365 社区中，Microsoft 还建议所有客户端机器安装 `Microsoft Online Services 登录助手` (MOS SIA)。“这为最终用户提供了登录
  Microsoft Online Services（如 Microsoft Office 365）的能力。MOS SIA 会安装客户端组件，这些组件允许 Microsoft
  Outlook 和 Microsoft Lync 等桌面应用程序向 Microsoft Online Services 进行身份验证。MOS SIA 还提供了改进的登录体验，使用户无需重新输入其用户名或密码即可访问
  Microsoft Online Services。” 除了我在此详述的高可用性考虑因素之外，还有很多需要考虑的事项。


  ## 总结


  那么这怎么算是云计算呢？听起来你和以前一样依赖于服务器和客户端机器的安装。重要的是不要相信营销炒作。迁移到云仍然涉及大量的规划工作。Microsoft 可以为你提供咨询以帮助完成此过渡，而且越来越多的第三方也可以提供帮助。但应该清楚的是，虽然云计算有许多好处，但它也仍然有相应的责任。


  本章讨论了以下内容：


  * SharePoint 发展成当前形式的过程。

  * 云架构选项如何归结为成本和控制。

  * 多租户和规划联合：云中 SharePoint 的关键方面。




  ## SharePoint 高级实践指南


  SharePoint 已经走过了漫长的道路，但目前它感觉像是一个过渡物种，介于恐龙和鸟类之间。它已经展翅高飞，翱翔于云端，但依然被其历史拖向地面。或许再经历一两个版本，它就能完全完成这一转变。


  ## 第 11 章

  


  ## 最佳实践与最差实践


  *原则是完美的表达，而像我们这样不完美的存在无法实践完美，因此我们每时每刻都在实践中设计对完美的妥协边界。*

  —莫罕达斯·甘地


  SharePoint 尚未完全发挥其潜力。部分原因在于完善和优化一个应用程序需要时间，但也归因于其所依赖的技术为其设置的限制和边界。SharePoint 受限于
  `.NET`、`Windows`、`Active Directory`、网络、延迟、带宽、`SQL Server` 和互联网。但实现 SharePoint 潜力的主要驱动力，是那些负责其规划、部署和维护的决策者。关于某事物为何如此，你可以有多种视角。总有许多相互关联的原因。虽然我们无法控制
  SharePoint 平台的硬件、软件、网络和开发限制，但运营者的行为对其成功或失败影响最大。


  本章旨在提炼我在多年端到端实施 SharePoint 解决方案过程中所见到的最佳和最差实践。我们都有做得好的方面和做得不够好的方面，并且都可以不断进步。SharePoint
  的成功大多归结于相关的人员以及他们所做的决策。我将这些内容归纳为以下四个主要标题：


  - **JFD**：利益相关者追求快速、廉价、短期结果，不惜牺牲质量

  - **泥潭**：迁移、元数据、自定义、工作流等

  - **变更管理**：并非在服务器场部署后才附加的内容

  - **治理**：让合适的人在合适的岗位上，掌握正确的知识


  有许多应遵循的小型最佳实践和应避免的不良实践。在本章的过程中，我将解释那些在维护 SharePoint 服务器场时造成最大困难的做法。


  ![9781430263289_Fig11-01.jpg](img/9781430263289_Fig11-01.jpg)


  **图 11-1.** 急于求成永远不会成功


  ### JFD


  `JFD` 是我在许多组织中遇到的一种非正式管理风格的缩写。这三个字母代表“Just F***ing Do It”（只管去做）。这是一种基于以下假设的理念：任何以有条理的方式行事的尝试都只是在浪费时间，而最佳方式永远是最快的捷径。直觉飞跃有其可取之处，并且可能非常成功，因为它们避免了群体思维，后者会稀释清晰的好想法并将其降级为妥协的大杂烩。最佳方法可能是
  `JFD` 与仔细考虑该方法长期影响的某种结合，以确保它不会导致现在可以规避的问题。


  例如，你可以使用网络上可用的第一批硬件来设置 SharePoint 并让人们访问，然后你可以雇佣一些开发人员或第三方外部公司来建立一个样板服务器场、备份计划、治理计划和品牌设计。这可以快速完成，尽管成本不菲。这种方法的问题在于，没有进行详细的规划来确定
  SharePoint 是否以及确实需要用于什么，因为这才是塑造实际解决方案的关键。如果跳过了这一步，结果将是 SharePoint 平台注定失败。组织发现自己陷入这种境地的原因并不全是
  `JFD` 方法造成的，还与 SharePoint 的营销方式有关，即让 SharePoint 看起来简单易用。它确实简单易用，但不能只是安装后就不管了。


  在许多情况下，SharePoint 是在没有任何规划或正式的**征求建议书**（`RFP`）的情况下被选择和安装的。即使发出了 `RFP`，它也是基于同样肤浅的需求，而这些需求不足以执行一个正确的
  SharePoint 实施。


  #### 一个典型的 SharePoint RFP


  SharePoint 通常是在进行了一些基本的在线研究后被选中的。然后，组织中的某个人被要求创建一份 `RFP`。`RFP` 本身并非坏事：它们是采购流程的早期阶段。第一步是向供应商发出邀请，通常通过招标过程，针对特定商品或服务（此处为
  SharePoint）提交提案。`RFP` 流程为采购决策带来了结构性，并旨在提前清晰地识别风险和收益。然而，这里最大的风险被忽略了：SharePoint 是否是正确选择？组织是否已经为过渡到它所需要付出的工作量做好了准备？这种风险可以通过组织首先发布`RFI`（信息征求书）来缓解。这向供应商提出了一些技术问题；如果他们提供了良好的解决方案，则被允许提交
  `RFP`。


  在我们的场景中，第三方公司被邀请提交关于他们如何满足组织需求的提案。这些需求在 `RFP` 中通常只是被泛泛描述，因为在大多数情况下，没有深入了解 SharePoint
  经验的内部人员不会进行详细的业务分析。以下是一个示例：


  > X 公司在许多不同系统中拥有大量数据，并且人员遍布各地。我们也有很多不同的应用程序，这些应用程序的维护成本很高。我们想要 SharePoint，以便我们能够拥有一个可以执行所有操作并存储所有内容的应用程序。在你对这一
  `RFP`（两周内提交）的回复中，请告诉我们你将如何使用 SharePoint 来实现以下目标：

  > - 一个供人们存放所有内容的地方

  > - 集中式搜索，使人们有一种统一的查找方式

  > - Web 内容管理，但不要替换我们的内联网，即使它已经过时且更新缓慢

  > - 记录管理，但我们不知道有哪些记录

  > - 文档管理，但我们没有任何策略

  > - 企业版 Facebook，尽管我们不知道这意味着什么

  > - 迁移我们所有的内容，且必须在不中断用户使用的情况下完成

  > - 我们也希望将业务流程迁移到工作流中

  > - 另外，请向我们发送 SharePoint 服务器场架构的详细设计以及你们将如何进行备份


  在某些情况下，结果会是第三方公司给出一个千篇一律的回复，因为他们除了列出他们为哪些其他公司设置了 SharePoint 并针对这些标准给出泛泛的响应外，别无他法，并附上“需要进一步分析”的附带条件。虽然情况并非总是如此，但当这项工作做得好的时候，回复中会包含为解决这些模糊之处和进一步完善工作说明书（`SOW`）而必须执行的细节。


  现实情况是，分析是过程中最重要的部分，而客户很少准备好或被告知，要构建专业的 SharePoint 实施，需要客户和第三方咨询公司投入多少前期的时间和人力。第三方咨询公司很少拥有擅长定义分类法和信息架构的优秀人才。他们通常有很多开发人员，这些开发人员被用来为客户创建自定义代码，这带来了将客户锁定在一个难以迁移到下一个
  SharePoint 版本的解决方案中的风险。这不是理想的情况。尽管也有例外，但在选择咨询公司时，寻找那些拥有强大业务分析技能的公司。


  ## 良好实践


  *一盎司的实践胜过数吨的说教。*



