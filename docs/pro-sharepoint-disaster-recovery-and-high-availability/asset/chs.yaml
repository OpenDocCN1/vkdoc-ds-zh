  ## 关于作者


  **斯蒂芬·康明斯**（Stephen Cummins）自 2001 年 SharePoint 发布以来，便吸收了他所能学到的一切。此后，他与三大洲的 50 多个客户合作，在此过程中深入了解了许多企业和人员。他还学到了许多关于如何使
  SharePoint 平台更受青睐、更有价值、更具弹性的经验。他共获得过九次 SharePoint“最有价值专家”奖项、三项 MCTS 认证、两项 MCP 认证、一项
  MCITP 认证，并立志成为 MCM。他与妻子、女儿、两只狗、数量过多的尤克里里琴以及数量不断变化的金鱼一起生活在爱尔兰。此外，他也非常喜欢用第三人称来谈论自己。


  ## 关于技术审校者


  **布兰登·阿特金森**（Brandon Atkinson）是弗吉尼亚州里士满 CapTech Consulting 的架构师和开发人员。他专注于 Microsoft
  技术，包括 SharePoint 和.NET。布兰登在 SharePoint 的各个领域都有涉猎，包括架构、开发、安装、配置和管理。他是 TechNet 上 SharePoint
  论坛的常客，同时也会向 TechNet Gallery 和 CodePlex 提供代码示例。他还曾荣获 Microsoft SharePoint Server
  的 MVP 奖项。布兰登撰写了多本书籍，并维护着一个博客 `http://brandonatkinson.blogspot.com`，定期发布关于 SharePoint
  开发和配置的文章。


  ### 引言


  我撰写本书是为了分享在当前这个时间点上，我所学到的关于 SharePoint 高可用性和灾难恢复的知识。这无疑是一个有趣的时期。在过去的 10 年里，SharePoint
  从一个表面上看起来像 Web 应用程序的编译型应用程序，发展成为一个功能更全面的云平台。然而，这个过程远未结束，10 年后的 SharePoint 可能会与现在大相径庭。但我毫不怀疑它仍将以某种形式被使用。回头再看这本书，看看哪些内容相同、哪些不同，对我来说将是一件很有趣的事。在本书中，我力求聚焦于通用原则，这样即使技术发生变化，这些原则依然适用。


  任何信息记录系统的主要风险在于，一旦你使用了它，你就会对它产生依赖。如果这些信息因任何原因而变得不可用，就会对你的组织产生不利影响。我们依然像过去一样受到自然母亲（客观环境/不可控因素）的摆布，而如今技术已变得足够复杂，以至于除了最专业的人员外，其他人很难充分了解它，从而知道如何使其具有弹性、冗余性和可恢复性。针对
  SharePoint，本书将为你提供知识和指导，以减轻这种风险。


