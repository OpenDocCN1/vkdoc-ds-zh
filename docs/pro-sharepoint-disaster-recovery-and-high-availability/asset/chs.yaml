- '# 第一章


  


  ## 远离灾难


  早在 2001 年我的第一个 SharePoint 工作中，我就花了数小时从内部域备份、复制并恢复 SharePoint 安装到用户可通过互联网访问的域中。这并非备份策略，而是一种将内容发布到互联网同时保证内网安全的粗糙方法。但它使系统非常容易发生故障。每次内容更新后，我都必须在非工作时间手动用更新后的暂存
  SPS 2001 覆盖生产环境的 SPS 2001，这样用户第二天才能看到更改。这很快变成了每晚都要进行的工作。我至今仍然记得每次运行命令覆盖生产场并使其更新时那种恐惧的感觉。我会盯着那个光标，等待它做出决定（我当时觉得它太漫不经心了）来让一切保持一致。当它成功运行，我能看到更改时，我会如释重负地松一口气。当它失败、我需要排查问题时，我仍然能感受到那种轻微的恐慌。问题通常很容易修复——通常是我漏掉了某个步骤——但有时是网络或存储数据的
  Exchange 服务器发生了更改，或者是 Windows 安全方面的问题。




  ## 灾难从未远离，只在一键之遥


  灾难从未远离，只在一键之遥。即使在当时，我也知道这种做法并非完成工作的最佳方式。这毫无意义，但我还是每天都这么做。整个流程已经获得管理层的批准，他们认为这在纸面上看起来既安全又审慎，但实际上效率低下，简直是随时可能爆发的灾难。最终，我离开去寻找更好的工作。或许他们至今仍在沿用那种内容部署方式。


  也许你目前也处于类似境地：你知道所在组织用来保护自身的流程和规程并不现实，也无法持续。事实上，它们可能正在引发它们本应防范的问题。又或者灾难已经发生，你正在分析如何改进。无论如何，这本书旨在引导你思考需要采取哪些措施，以使你的
  `SharePoint` 场尽可能抵抗故障，并帮助你规划在发生故障时该怎么做，以最大限度降低损失，甚至因出色的恢复能力而赢得赞誉。最理想的情况是，灾难成为成功的契机，而非一连串失败的连锁反应。你能驾驭巨龙，而非被其摧毁吗？


  本章将讨论以下主题：


  - IT 灾难的隐性成本。

  - 灾难发生的原因。

  - 关键灾难恢复概念：恢复时间目标和恢复点目标。

  - 关键平台概念：网络、云、`IaaS` 和 `SaaS`。

  - 角色与职责。

  - 成功的衡量标准。

  - 一些应用场景、选项和潜在解决方案。


  ## 失败的真实代价


  本书聚焦于两个不同但相关的概念：高可用性（`HA`）和灾难恢复（`DR`）。它们有时被统称为服务连续性管理（`SCM`）。虽然 `SCM` 侧重于灾难发生后以
  IT 服务为主的恢复，但随着 IT 系统对整个业务运营日益关键，许多企业也开始评估系统故障对组织本身的影响。


  无论你的核心业务是什么，它都以某种形式依赖于技术。可能是机械设备，也可能是 IT 系统。IT 系统已成为许多类型企业的核心，但业务管理者和所有者并未跟上变化的步伐。以下是一个关于核心技术如何对多种公司变得重要的例子。


  2008 年，星巴克关闭了其全美所有门店三小时，以重新培训咖啡师制作浓缩咖啡。此举导致其损失了 6500 万美元的收入。这疯狂吗？他们是有意为之；他们意识到公司正在以门店数量为代价牺牲质量。他们扩张得太快，以至于正在失去星巴克品牌闻名遐迩的核心：在舒适的咖啡馆里提供优质的咖啡。他们预见到短期的表面成功最终会在长期内毁掉他们。门店更多了，但进店的人却更少了。停工三小时的短期成本远低于若不改进核心流程所将承受的损失。制作浓缩咖啡看似小事，但它是最众多的员工频繁执行的任务。如果这些员工不能每次都做出高品质的浓缩咖啡，公司长期而言注定失败。先聚焦这一流程，是改善整体业务实践的一步。这表明星巴克明白，为了生存，他们需要改进，不仅仅是扩张。


  在这个例子中，技能标准下降被视为停产的原因。这是有计划的，但它突显了当企业无法交付其产品时所需的代价。你的 `SharePoint` 场产生生产力。它通过使共享信息的用户活动更高效来实现这一点。如果其中的信息丢失或共享过程中断，`SharePoint`
  就毫无价值。更糟糕的是，它可能严重损害你企业的运作能力。


  人们常说，认知即现实。即使只丢失了少量数据或少量生产时间，组织的一些信誉也可能随之丧失。声誉需要多年建立，但可能在数天内毁于一旦。如果你或你客户日益宝贵的信息从你的
  `SharePoint` 基础设施中丢失或被窃，代价可能确实非常高昂。你的声誉可能永远无法恢复。


  不良认知会导致品牌侵蚀。IT 系统现在已是许多企业品牌的重要组成部分，而不仅仅隐藏在某处的后台房间。对许多公司而言，该品牌依赖于消费者对其技术的信心。品牌侵蚀可能意味着收入损失，甚至法律风险。2011
  年针对索尼 PlayStation 网络的攻击导致 1 亿个账户被黑（史上第四大），将让索尼付出巨额真金白银的代价。加拿大代表 100 万用户提起的一项集体诉讼索赔金额高达
  10 亿美元。如果苹果公司没有迅速反应（在最初否认之后）来补偿客户，那么 `iOS4` 被感知到的天线问题可能会让苹果付出多大代价？


  像星巴克、索尼和苹果这样的大公司知道，技术不仅仅是它们销售产品的一部分，更是它们身份的核心。如果你忽视了业务的核心，它就会失败。全面失败的代价远高于理解和投资于员工每天依赖的技术所需的代价。`SharePoint`
  已不仅仅是一个为了与其他用户共享而有序放置文档的有用场所。它现在已是许多用户日常任务的数据存储库。它已成为许多企业的核心技术平台，并且应当被如此对待。


  ## 灾难发生的原因及如何预防


  在 IT 领域，有一种观念认为，更多的文档、流程和规程意味着更好的文档、流程和规程——就像认为更多星巴克门店意味着星巴克经营得更好一样。事实上，恰恰相反。围绕
  `HA` 和 `DR`（实际上所有治理）的流程应遵循这样的原则：完美不是无可增添，而是无可删减时才达到的。良好的实践需要不断的修订和调整。最后，做实际工作的人应该拥有这些流程并维护它们。在太多企业中，制定政策和规程的人远离实际工作，因此相关文档不切实际，容易被忽视或导致失败。


  ## 成功/失败


  `SharePoint` 场就像任何复杂系统一样：我们不能指望凭借随意的行动就能侥幸获得一个稳定、安全的协作平台。但现实是，我们的大多数流程和规程都是被动应对、临时凑合的解决方案，最终因为没时间或没资源想出更好的办法而长期延续下去。事实上，在这种情况下，我们采用“智能设计”会比“演化”更有利，因为我们能够解读小事件，从而比大自然更早地预见未来。同时，“侥幸过关”危险地教给我们一些相似但相反的东西：如果你不断成功，这最终会导致你失败。那么谁是对的，我们又如何将其应用于
  `SharePoint` 架构的治理呢？


  Gartner 几年前的一项研究表明，我们过于强调仅通过硬件和软件来实现平台的高可用性，而 `80%` 的系统故障是由人为错误或缺乏适当的变更管理流程造成的。那么，是什么样的思维过程导致我们忽视“侥幸过关”，并认为成功越多，失败的可能性就越小呢？


  如果我们不小心，成功可能导致失败。我们认为，因为之前侥幸没有失败，我们就总会走运。我们的警惕性降低，忽视了那些最终会在足够长的时间后引发大问题的警示信号。




  研究显示，每发生 30 次未遂事件，就会发生一次轻微事故；而每 30 次轻微事故中，就有一件会演变为严重事故。`SharePoint`场拥有捕获日志的监控软件，但这些软件只能捕获我们指示其捕获的内容；我们需要自行阅读和解析这些日志。问题在于，没有分配足够的时间来查找系统中的微小裂缝，或调查未遂事件的根本原因。


  但一个更具危害性的失败原因是，当流程薄弱时，监控系统的人员会不断地为这些糟糕的流程进行补救。那些对流程负责的人并未持续审查流程以使其保持最新。那些不拥有流程的人则没有将问题上报；相反，他们提出快速修复方案，以维持短期运转。他们迟早会感到疲惫、沮丧或厌倦，或者在事情真正出问题之前就离职了。到那时再想阻止真正的重大灾难（`FUBAR`）就为时已晚了。


  因此，管理层绝不能忽视这样一个事实：基层员工正在满负荷工作以维持系统运转，但这并非长久之计。同样，基层员工也必须挺身而出，报告那些会导致系统故障和数据丢失的情况。


  失败是成功所必需的吗？我认为，每个流程都必须在其能力范围内做到最好，同时要认识到它需要被持续测试和改进。这就是治理的精髓：人们主动承担变革的责任，并以建设性的方式应对它。政策的不断演进是必需的。


  你的`SharePoint`项目：会沉没还是浮起？


  让我们用一个比喻——这也是我将在本书中反复提及的。你的`SharePoint`项目就像一艘邮轮的航行。它会是一艘安全的现代船舶，还是命运多舛的`泰坦尼克号`？你的邮轮公司投入巨资建造了一个能够横跨大西洋的巨大金属块。你的`SharePoint`农场就像那艘船。这个农场可以部署在本地、云端，或两者的混合体。你有一个目标，并对它所能取得的成就抱有远大抱负。你知道，要使其成功，你需要一队能干的船员来管理它，以及众多快乐的付费乘客。


  这个比喻假设了一件不可避免的事情：船会沉没。说你的`SharePoint`实施必然会失败，这公平吗？当然不，但你仍应现实地规划它失败的可能性。无法设想失败，必然会让你比那些预判了所有可能出错之处及应对措施的人更加脆弱。这就是为什么船上要有救生艇演习——因为它们有助于预防灾难。承认灾难确实会发生，并不是在招引灾难。事实上，恰恰相反；它降低了灾难发生的可能性，因为它有助于揭示基础设施中的弱点，并促成制定灾难发生时可更快恢复的现实计划。


  图 1-1 展示了一个典型的`SharePoint`农场。请注意，超过一半的服务器是冗余的。只要一台`Web`前端、一台应用服务器和一台`SQL`服务器保持运行，这个农场就仍能工作。让我们回到`泰坦尼克号`的隐喻上来。它的船体被设计成具有多个隔舱；建造者称，即使多个隔舱被撞破，船仍能漂浮。事实上，由于设计上的这种远见，曾有船只在正面撞击冰山后幸存下来。


  ![9781430263289_Fig01-01.jpg](img/9781430263289_Fig01-01.jpg)


  图 1-1. 典型的高可用性本地部署`SharePoint`农场


  因此，技术让专家们相信，非常大的船舶可以超越物理定律。不知何故，它被广泛认为不仅是海上最大、最豪华的邮轮，而且几乎是永不沉没的。而我们都知道了结局。这个故事在当时是极轰动的新闻，现在依然如此。如今的媒体与
  100 年前的媒体并无不同；他们喜欢大故事。`泰坦尼克号`之所以如此引人入胜，是因为它是世界上最大的客轮，首航即载满了富人与穷人——它是现代性与社会的一个隐喻。


  也许你的`SharePoint`部署也会受到媒体关注，出于同样的原因，你会希望它进展顺利。也许它只受到内部观众的关注，但它的成败仍然非常显眼，因为它涉及你组织中的各类用户。这无疑是进行试点和原型验证的绝佳理由，但真正的完整系统终有一天需要上线和启航。


  高可用性：水密隔舱


  高可用性是一个`IT`术语，指为确保你的`SharePoint`农场无论发生什么都不会“沉没”所做的努力——它的弹性和质量足以应对损伤并保持运行。当事情出错时自动启动的系统被称为*故障转移系统*。在我这个比喻中，它们就像那些关闭以使得隔舱水密的水密门（参见图
  1-2）。这些门可以手动触发，但如果隔舱内的水位上升到一定水平，它们也会自动启动。在`SharePoint`中，集群、负载均衡和镜像提供了这种故障转移和弹性。但它们也可能被压垮。


  ![9781430263289_Fig01-02.jpg](img/9781430263289_Fig01-02.jpg)


  图 1-2. `R.M.S.泰坦尼克号`上的高可用性


  在大多数`IT`系统中，人们很容易不经过多主动思考就提供最低限度甚至推荐水平的弹性。在`泰坦尼克号`上，16 个隔舱超出了贸易委员会的要求；问题在于，一艘船上的
  16 个水密立方体对船员（管理员）和乘客（业务用户）来说很不方便。隔舱之间有许多门，方便人们在这些屏障之间自由移动。结果，安全性被便利性所取代。这也是`SharePoint`中高可用系统失败的常见原因。失败通常发生在匆忙应用更新和系统例行改进时。高可用系统越复杂，就有越多可能出错的运动部件。


  在`SharePoint`农场中，你可以通过多种选项来实现高可用性。通常采用以下几种方式的组合。每种方式将在本书后面章节详细说明：




  SQL 镜像：同步维护数据库副本。*同步* 意味着数据始终同时保持一致。

  SQL 集群：将 SQL 实例分布到多台机器上。*实例* 是一组服务器，表现为单一 SQL 服务器。

  SQL 日志传送：将数据备份到文件，并异步还原到另一个 SQL 实例。*异步* 意味着数据在不同时间点并不完全一致，日志从一个实例移动到另一个实例会有数小时的延迟。

  多数据中心（DC）：将服务器群组部署在不同地理位置、独立场所中。例如，Office 365 在欧洲、中东和非洲（EMEA）区域的数据中心位于都柏林，但阿姆斯特丹也有另一个数据中心。

  负载平衡：通过软件或硬件，使多台服务器使用虚拟 IP 地址，从而看似拥有相同的 IP 地址。

  扩展场：将场中的部分服务器托管在不同的数据中心。

  SAN 复制：同步维护数据副本。

  冗余灾难恢复场：在另一地点准备第二个场，随时准备替换生产场。本章稍后将对此进行更详细的说明。

  可用区与区域：在 Amazon Web Services 中使用，它们类似于服务器和数据中心。


  ## 灾难恢复


  灾难恢复是指当问题已经发生时应该采取的措施。对于 SharePoint 场来说，当用户开始失去访问权限、性能或数据时，就是灾难发生点。这也可能发生在安全受到威胁时。本质上，这是指系统完整性被破坏。你已经撞上了冰山。对于泰坦尼克号来说，灾难恢复过程就是救生艇演习和救生艇本身。对于
  SharePoint 场来说，它涉及为准备和经历灾难恢复而制定的流程、策略和程序。因此，这是从检测到问题那一刻起，对后续行动进行的规划。请注意，这可能不是问题开始发生的精确时间，而仅仅是它被检测到的时间。错误检测和报告将在第
  7 章中进一步详细讨论。


  在泰坦尼克号上，救生艇数量不足，是因为人们相信由于其水密隔舱，这艘船永不沉没。同时，人们认为在船只沉没时，船员需要很长时间才能装载所有救生艇（泰坦尼克号可容纳超过
  3500 人，尽管沉没时船上只有约 2500 人）。最后，当时的法规已经过时；该船在法律上是合规的，但实际上即使救生艇全部满员，其容量也不到所需的一半。过度依赖文档和推荐方法并不总是足够的。


  ## 恢复时间目标与恢复点目标


  用于评估灾难恢复解决方案的两个常用指标是：恢复时间目标（RTO），衡量系统灾难发生到系统再次正常运行之间的时间；以及恢复点目标（RPO），衡量最新备份到系统灾难之间的时间，代表系统可以恢复到的最接近的历史时间点。这些指标将在服务水平协议（SLA）中设定，该协议是提供商必须遵守的法律文件。例如，作为
  Office 365 一部分的 SharePoint Online，在发生灾难时设定的 RPO 和 RTO 如下：


  “12 小时 RPO：微软保护组织的 SharePoint Online 数据，并保存一份时间点等于或早于 12 小时的数据副本。


  24 小时 RTO：如果灾难使主数据中心瘫痪，组织将能够在服务中断后的 24 小时内恢复服务。”


  然而，这只是标准级别，企业级的要求更高：


  “1 小时 RPO：微软保护您的 SharePoint Online 数据，并保存一份时间点等于或早于 1 小时的数据副本。


  6 小时 RTO：如果灾难使托管数据中心瘫痪，组织将能够在服务中断后的 6 小时内恢复服务。”


  ## 网络与云


  将您的网络或云想象成海洋。它广阔、不可预测，且充满了危险的事物，其中大部分是管理员无法控制的。存在拒绝服务攻击、人为错误、硬件故障、自然灾害以及各种可能危害您系统的事件。在第
  4 章中，我将描述可能损害系统完整性的事件类型，以及如何缓解这些事件。


  ## IaaS 与 SaaS


  基础设施即服务（IaaS）和软件即服务（SaaS）更强调高可用性而非灾难恢复。自然，保持系统持续运行比从故障中恢复更有意义。对于 IaaS，高可用性更多掌握在租户手中。而对于
  SaaS，例如 Office 365 中的 SharePoint Online，您更依赖提供商来维持系统运行。我的比喻是：IaaS 像是船员，您负有培训和保障乘客安全的职责。而
  SaaS 更像乘客，依赖提供商来保障您的安全。


  例如，对于像 Amazon Web Services（AWS）这样的 IaaS 提供商，租户能够将实例部署在多个位置。这些位置由区域和可用区组成。可用区是独立的位置，设计上与其他可用区的故障隔离，并提供同一区域内与其他可用区之间低成本、低延迟的网络连接。可以将它们想象成您的水密隔舱。


  通过在单独的可用区中启动实例（在您的场景中，即您的 SharePoint 服务器），您可以保护应用程序免受单个位置故障的影响。还有区域。区域由一个或多个可用区组成，在地理上分布，位于不同的地理区域或国家。通过将实例分布在这些区域中，您将获得更强的弹性。


  对于像 Office 365 这样的 SaaS 示例，如果平台出现问题，您对应对问题的控制权较小。可以想象成乘客自带救生衣。我将在第 10 章中更详细地介绍如何获得更多控制权。


  ## 云端 SharePoint


  IT 世界正在发生变化，计算、网络和存储资源正从本地网络迁移到互联网上。SharePoint 已经是基于 Web 的，因此是云计算的良好候选者。从设置和管理角度来看，它拥有一个日益增长且复杂的服务体系结构。此外，许多公司很乐意省去内部技能管理的成本，更不用说将
  Exchange 迁移到云端的机会了。这不会一蹴而就，但确实意味着在本地托管 SharePoint 场不再是唯一的选择。出于这个原因，我将为那些不熟悉它们的人概述新的云选项。




  从前，网络图中用一朵云的图片来表示互联网（见图 1-3）。这就是我们现在使用 *云* 这个术语的原因。它有种“此处有龙”的感觉。（在欧洲人发现世界大片区域之前，地图上的大面积空白会被标注为“此处有龙”，如图
  1-4 所示。这是一种填充无法理解之空白区域的方式。这种知识的缺乏带来了恐惧，因此出现了龙的图案。）在这个比喻中，龙代表着自满——一种源于恐惧的虚张声势。云对商业有着诸多益处。它不久将被视为有待发现和探索的新世界，而非未知的危险。


