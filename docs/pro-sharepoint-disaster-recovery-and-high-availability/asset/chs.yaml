- '# 使用 SP1 还原网站


  ## 通过 PowerShell 进行恢复


  要使网站集能够通过 PowerShell 还原，你必须在服务器场中至少安装带有 Service Pack 1 的 SharePoint 2010，才能添加此功能。相比之前的情况，这是一个显著的改进，因为现在网站集管理员可以恢复网站，而不仅仅是服务器场管理员。已删除的网站集存储在`SPDeletedSite`对象中。`Get-SPDeletedSite`
  cmdlet 会列出所有已删除的网站集。当`SPDeletedSite`大于一个时，`Get-SPDeletedSite`返回一个数组。使用以下命令获取计数：


  ```powershell

  (Get-SPDeletedSite).Count

  ```


  现在你只需将其与`Restore-SPDeletedSite` cmdlet 绑定即可。


  ```powershell

  Get-SPDeletedSite | where{$_.SiteId -eq "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"}
  | Restore-SPDeletedSite

  ```


  ## 将 Office 用作 DIY 灾难恢复工具


  值得一提的是，虽然这不严格属于 SharePoint 范畴，但 Word 通过自动保存和使用所谓的 Backstage 视图，也有助于保护用户的内容。这是你在
  Office 中单击“文件”选项卡时的默认视图。向用户记录、培训和展示这些信息，是这些信息被他们了解的最可能的途径。我在此将其作为恢复丢失内容的另一种方法来介绍，以确保完整性。从某种意义上说，它属于组织灾难恢复流程的一部分，因为它是一种恢复数据的方法。在旧版
  Office 中，Word 会在你编辑文档时定期在后台保存。这个文件会被保留，以便用户在应用程序崩溃时用它来恢复工作。对于 Word、Excel 和 PowerPoint，Office
  2010（以及 Office 365）改进了这一想法。在 Backstage 视图中，Microsoft 会显示你当前编辑会话中周期性的自动保存文件，并允许你比较或将其恢复为最新文档（参见图
  8-12）。即使你没有保存文件，这些文件也会保留五天。


  ![9781430263289_Fig08-12.jpg](img/9781430263289_Fig08-12.jpg)


  图 8-12. Office 内部的版本控制：本章的 Backstage 视图


  当你保存并关闭编辑会话时，这些未保存的版本会被清除。文档保存方式的设置可以在 文件 ![image](img/arrow.jpg) Word 选项 ![image](img/arrow.jpg)
  保存 中找到（图 8-13）。


  ![9781430263289_Fig08-13.jpg](img/9781430263289_Fig08-13.jpg)


  图 8-13. Word 中的保存选项


  即使你在未保存文件的情况下关闭编辑会话，Office 现在也会保留最后自动保存的版本。当你再次打开文档时，未保存的版本将出现在 Backstage 视图“信息”窗口的“版本”部分（参见图
  8-14）。Office 还允许你直接从 Backstage 视图访问它：在“信息”窗口中单击“管理版本”，然后选择“恢复未保存的文档”（参见图 8-15）。在
  Backstage 视图的“最近”窗口底部也有“恢复未保存的文档”链接。


  ![9781430263289_Fig08-14.jpg](img/9781430263289_Fig08-14.jpg)


  图 8-14. 重新打开一个在 Word 自动保存后未被保存的文件后的“版本”部分


  ![9781430263289_Fig08-15.jpg](img/9781430263289_Fig08-15.jpg)


  图 8-15. 在 Backstage 视图中，选择“信息”，然后选择“管理版本”，以查看恢复未保存文档的链接


  ![image](img/sq.jpg) **注意** 当你单击“恢复未保存的文档”链接时，Office 会带你进入默认的 UnSavedFiles 文件夹。但是，你的自动恢复文件位置可能不同。如果你没有看到自动保存的文件，请检查你的保存选项（图
  8-13），然后导航到相应位置。


  ## 使用模板进行内容备份


  SharePoint 让用户能够掌握内容保留的另一种方式（尽管是间接的好处）是使用 SharePoint 模板流程。SharePoint Server 中的模板旨在允许你通过复制列表或网站（如果需要，可包含其内容）来重用内容，并允许你在新位置使用相同的内容创建新的列表或网站。此功能也可由任何仅拥有网站所有者权限的用户随时用于对列表或网站进行快速备份，即使这并非其既定用途。因此，如果网站所有者希望获得额外的安全级别，无需服务器场级管理员的干预即可实现。这在需要即时快照时会很有用。


  需要注意的是，此方法不会保留“创建者”和“创建时间”，也不会保留网站或列表的访问权限。但它会保留内容和视图，重新创建这些内容通常需要更多时间。另一个警告：Microsoft
  已将列表和网站模板的最大大小限制为 10MB（10,485,760 字节）。如果你尝试保存大小超过 10MB 的网站/列表模板，你将收到“列表太大，无法保存为模板。模板的大小不能超过
  10485760 字节。”的错误。为了解决这个问题，我看到有人建议在命令提示符下运行此命令：


  ```cmd

  stsadm -o setproperty -propertyname max-template-document-size -propertyvalue 524288000

  ```


  但是，我不建议你这样做。它可能会导致网站恢复过程中出错；有时命令会成功完成，但限制仍然存在。考虑到这些警告，模板仍然是快速备份内容的有用方法，因此我将向你展示如何操作。如果你的网站太大而无法通过此方式保留，那么使用管理中心是你唯一的选择——而且普通用户无法使用此选项。


