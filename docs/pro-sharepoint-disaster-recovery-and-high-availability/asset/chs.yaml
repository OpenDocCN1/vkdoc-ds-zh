  在内容消费者与生产者比例高且内容更新不频繁的情况下，缓存的影响最大。SharePoint 通常并非如此，它力求让所有用户成为贡献者，并实现快速频繁的更新。但管理员可以根据用户配置文件设置不同的缓存反应。如果用户是匿名用户，可以假设内容对他们来说更新频率较低，因此内容保持“热”状态。对于经过身份验证的用户，假设内容更新更频繁（“冷”状态），因此缓存频率较低。SharePoint
  提供了多种选项，可通过 Web UI 管理页面输出的缓存，而无需修改后端配置文件（参见图 5-17）。


