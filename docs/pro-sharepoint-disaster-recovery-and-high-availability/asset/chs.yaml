  下一个要点关乎责任。甚至在你的船沉没之前（图 12-1），问题就会被提出。沉没事件自然引发了寻找责任归属的排查，而有些人在这场灾难中显得英勇无畏、舍己为人。一个例子是阿瑟·韦斯特，他离开救生艇去为女儿们取一壶热牛奶，然后在救生艇被放下时顺着绳索爬下去，把暖壶递给她们，随后又爬回船上。他的遗体从未被找到。另一些人则显得自私怯懦，比如
  J.布鲁斯·伊斯梅，他催促船长尽可能全速航行，自己却是少数几个坐上救生艇的男人之一。这里的原则是，在管理 SharePoint 时，必须尽早承担责任。你不能只在事情进展顺利时揽功，因为当灾难发生时，将会面临审查，责任也会被分配。


  ![9781430263289_Fig12-01.jpg](img/9781430263289_Fig12-01.jpg)


  图 12-1. 灾难过后，有人被描绘成英雄，有人则被描绘成恶棍


  本章传达的最后一个原则是，仅凭尚未发生灾难来衡量成功是远远不够的。观察员报告“侥幸脱险”事件是许多行业和组织中一种成熟的错误减少技术，也应应用于 SharePoint
  系统的管理。总会有线索表明某些事情可能出错。警觉、记录并应对这些“侥幸脱险”事件，是拥有 SharePoint 平台的关键组成部分。


  ### 第 2 章：规划你的计划


  本章的重点是准备的重要性。在制定灾难恢复计划之前，你需要了解你要保护的对象，以便据此设计计划。你必须获得管理层的支持，而要获得支持，有时需要打破对技术的过度简单化理解。你必须进行业务影响评估。这意味着召集业务中的关键利益相关者，详细量化
  SharePoint 服务中断在一年中不同时期对各个团队和部门的影响。


  获得管理层的批准并对业务需求有更深入的了解后，你就可以为系统的不同部分定义恢复点目标和恢复时间目标。本章的一个关键点是：并非所有内容都需要同样高水平的可用性，组织中应建立多个层级，以便优先恢复最重要的内容，而不是最不重要的内容。泰坦尼克号沉没后，有人指责其按舱位等级优先救援乘客。可悲的是，数据证实了这一点（表
  12-1）。


