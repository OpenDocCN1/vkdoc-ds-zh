  \ 计算机与网络向基于互联网应用的演进\n\n计算机与网络向基于互联网应用的演进，无疑凸显了它们在追求更面向服务架构（SOA）的组织中所扮演的重要角色。这些新服务的质量将是其广泛部署的关键，而服务质量则由贵组织用户的意见决定。最佳的服务质量（QoS）并非最高级别，而是最契合不同用户需求的级别。为了提供适宜水平的\
  \ QoS，SharePoint 管理员需要了解哪些相关的网络参数会影响用户所感知到的质量。\n\nSharePoint 场并非孤立存在；它主要依赖于其所依托的网络。虽然\
