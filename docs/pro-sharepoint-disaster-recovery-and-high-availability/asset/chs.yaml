  ## 总结


  提高服务质量的主要方法包括：广域网优化、将服务器场设计为内容靠近需要查看的人员，以及缓存不常更新的页面。广域网加速在延迟限制方面的作用是有限的。但 SharePoint
  提供了一些选项，可以用户满意度和不过于复杂的架构之间取得经济高效的折衷方案。


  应该明确的是，“管道”是一个过于简单的比喻，加粗管道并不一定是改善服务质量的最佳方法。然而，我确实认为，由于竞争原因，企业宽带的速度落后于家庭市场，这种情况将会改变。例如，我每月仅需支付很少的费用就能使用
