  这里得到的教训不应是某些人比其他人更值得拯救，而在 SharePoint 的情况下恰恰相反：某些流程和内容对组织更有价值，应优先恢复它们。


  本章还强调了灾难中协调的重要性原则：4Ci。这意味着必须有指挥、控制、通信、计算机和情报。如果没有事先规划这些资源的可用性，任何计划都无法付诸实施。员工接受适当的培训在任何灾难中都至关重要，包括泰坦尼克号（图
  12-2）。


