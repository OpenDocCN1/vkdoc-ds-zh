  ## 解决方案


  这是一个典型场景，原因在于涉及多方人员以及多种技术选项。此处的失败是因为涉及人员过多，且没有一个人具备足够的知识或权威来做出决策。共有四方参与者，各自动机不同，且彼此之间缺乏合作。将灾难归咎于河流很容易，但实际上，糟糕的项目管理才是灾难的真正根源。


  组织因缺乏做出技术决策的专业知识而将工作分包给其他公司的情况并不少见。以下是四个参与方的详细信息：


  - **Fancy Flowers**：他们想要最安全的解决方案，但同时要求最便宜的价格。他们不接受灾难恢复成本高昂的现实，也不明白在不了解技术的情况下自行设计解决方案是灾难的根源。作为客户，他们对所有决策拥有否决权；此外，他们在解决方案架构达成一致后又推翻决定，导致了混乱。

  - **Super Structure**：他们具备基础设施方面的专业知识，但 SharePoint 需要专家级知识，而这正是他们所欠缺的。当他们需要向 Fancy
  Flowers 交付 SLA 时，他们退回到了自己熟悉的领域：将 SQL Server 日志传送作为解决方案。

  - **Clever Consultants**：他们处于两难境地。他们对解决方案架构负有责任，但却缺乏推动其方案通过的权威。最终，他们妥协了自己最初推荐的灾难恢复服务器场方案，以使解决方案获得批准。

  - **Dashing Development**：他们在整个过程中保持中立，并成功避免了任何指责。他们的目标是维持与 Fancy Flowers 的良好关系，因此决定既不帮忙也不添乱。


  需要有一个人对整个流程拥有权威，以做出最终决策。这个人应该是 Super Structure 中更高级别的管理者。他们本应确切决定 SLA 中所需的内容，并清晰地列出可供
  Fancy Flowers 选择的方案，包括各自的成本及优缺点。他们本可以从 Clever Consultants 那里收集这些信息。可选方案如下：


  - 日志传送/镜像

  - 扩展服务器场

  - 灾难恢复服务器场


  有了清晰的选择和各自的成本，Fancy Flowers 本可以做出决策，灾难也就可以避免了。


  ## 总结


  要保护您的内容，您必须了解自己的技术并认识到其对组织的重要性。必须分配角色并承担责任。此外，应该有一种方法来记录未遂事件，以便能够捕捉并处理它们。SharePoint
  不仅仅是一个技术平台，它在某种程度上也为用户所拥有。用户和管理层必须在其治理中发挥作用。


