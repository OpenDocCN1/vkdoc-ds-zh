  将你的 SharePoint 基础设施或软件迁移到云端时，存在一种风险：过度信任平台提供商会自动处理所有高可用性和灾难恢复选项。在大多数情况下，他们确实提供了优秀的工具来管理你的基础设施，但你必须仍然知道如何使用它们。事实是，最终责任仍然在于数据所有者，他们需要理解各种选项，并根据自身需求和预算选择最佳方案。


  取代适当、健康的恐惧的是危险的自满，这种自满源于不愿掌控基础设施。想当然地认为别人会处理一切，这样更容易。我亲爱的读者，我认为你购买这本书，是因为你不想被这股巨大的自满所吞噬。


  ## 为什么基础设施要迁移到云端？


  我们生活在一个联系更紧密的世界。Wi-Fi、智能手机、平板电脑、笔记本和笔记本电脑让员工更具移动性，连接选择也更加丰富。人们通过互联网能够访问如此多的信息，沟通如此便捷，以至于他们现在期望能够随时随地、使用任何设备、同样轻松地访问自己的工作数据。


  云技术进入商业领域的另一个主要因素，是虚拟化和低成本硬件等技术，它们使得资源商品化到了如同电力、水或燃气等其他公用事业的程度。SharePoint 需要大量的硬件和容量。标准构建包括三个场：开发、测试和生产。如果你想要，例如每个场中有三个
  Web 前端服务器、两个应用服务器和一个 SQL 集群，SharePoint 还需要大量的软件和许可证。


  SharePoint Online (SPO) 使得为访问付费变得更加简单。不需要在硬件、软件和许可证上进行大量前期投资。组织只需注册，然后按每用户每月付费即可。他们甚至可以邀请网络外部的用户；这只需要一个如
  Hotmail 的 LiveID 账户或现有的 Office 365 账户。这使得与网络外部的合作伙伴或客户的协作变得如此简单。这也使得从小规模起步并逐步增加用户变得容易得多——并且前期用户许可的成本也低得多。移除用户许可证也更容易，因为每个用户每
  30 天需要重新验证一次；因此，一旦 30 天的许可证过期，如果你不想付费，就无需再支付。无需购买和配置大量服务器，并计算出你需要哪些服务器和软件许可证。这从来都是一门极其复杂和神秘的技艺，任何简化都非常受欢迎。诚然，仍有一系列用户许可证可供选择，但选项更加清晰，更容易确定你想要什么。


  许可证的定价方式也不同。对于 SharePoint Online，现在是按用户付费，而非按设备付费。SharePoint 2013 的客户端访问许可证 (CAL)
  是按设备计算的，所以如果你从家庭、办公室和移动设备访问，理论上你需要三个许可证，而大多数组织并不会为此做规划。使用 SPO，一个用户可以连接最多五台设备，但只算作一台设备——在这个互联时代，这是一种更现实的方法，也是微软通过将
  Lync、SharePoint 和 Exchange 集成到其 Windows Mobile 平台所依赖的策略。


  理论上，管理员将不再需要安装补丁。当然，微软仍会为平台打补丁，但这不再是对客户端测试和更新本地服务器的管理负担。单点登录确实需要在本地部署 ADFS 和目录同步，以及
  Office Professional Plus 和 Office 365 桌面版，这些可能仍然需要打补丁。但这仍然比维护一整套 SharePoint 和 SQL
  服务器要少。


  另一个重要的变化是版本的概念变得不那么重要了。在线应用程序在逐步改进。例如，人们不会运行不同版本的 Gmail。因此，不再需要每隔两三年就升级到最新版本的 SharePoint
  来获取最新功能、保持与其他软件的兼容性以及维持产品的支持。


  SPO 的缺点都源于它是一个与其他租户共享的环境，并且你因此对基础设施的直接访问权限较少。这意味着不允许使用强大的脚本工具 PowerShell（用于自动化管理任务和更改场设置）。就像租住一栋房子里的公寓一样，你改变可能影响所有租户的事情的能力有限，因此无法访问管理中心站点，也不允许使用场级解决方案。


  ## SharePoint 管理员会消失吗？


  不会，但他们必须进化。SharePoint 曾经更像制造业，关乎制造和管理真实的事物：服务器和软件。现在它更像一个服务行业，重点在于交付用户满意度。满足业务需求一直是技术的目的，但现在重点是通过倾听用户需求并帮助他们使用
  SharePoint 来满足这些需求，从而更快速、更直接地实现这一目标。SharePoint 更像 Word 而非 Exchange。其价值来自于用户和管理员知道如何使用它。此外，仍然有资源管理、用户管理和配额管理，以及通过
  SharePoint Designer 满足品牌要求和声明式工作流的需求。最后，通过沙盒解决方案（尽管已弃用），仍然可以通过 Visual Studio 开发编译代码解决方案。此外，还有
  SharePoint 应用商店，可以购买和安装增强功能。这些都需要管理员来管理。


  ## SharePoint 是一个复杂的巨兽


  迁移到云端使得搭建 SharePoint 的技术方面变得简单许多。SharePoint 2013 比 SharePoint 2010 或 Microsoft Office
  SharePoint Server (MOSS) 2007 更复杂——而 2007 又比 SPS 2003 和 SPS 2001 复杂。这主要是因为现在的服务本身作为应用程序运行。因此，搭建一个
  SharePoint 场可能意味着要规划超过 15 个数据库，并学习如何配置至少同样多的服务。SharePoint Online 消除了部分复杂性，因为你只能访问有限数量的服务。这是因为
  SharePoint Online 基础设施对所有租户都是标准化的；见图 1-5。这就像是亨利·福特采用的“任何顾客都可以将汽车漆成他喜欢的任何颜色，只要是黑色的就行”的方法。


