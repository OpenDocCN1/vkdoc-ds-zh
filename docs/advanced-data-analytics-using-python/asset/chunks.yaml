    ### Network Architecture and Regularization Techniques


    Before moving on to the next section, note that as you raise the number of hidden
    layers in your network, the accuracy improves, but the application consumes more
    memory. Typically, people employ two to three hidden layers.


    The `Adam` optimizer is commonly chosen because it combines gradient descent and
    stochastic gradient descent. People may add the coefficient of the resulting equation
    in the loss function because a big coefficient indicates overfitting. Another
    option is to use a dropout layer, which ignores a certain percentage of neurons
    chosen at random during time learning. For the classification problem, an entropy
    function, which is a measurement of the chaos of the system, should be used in
    the loss function. For binary and multiclass classification, there are multiple
    versions.


    Note that the PCA presented in Chapter [3](#458833_2_En_3_Chapter.xhtml) is used
    here with a 95 percent variance. That is the standard.


