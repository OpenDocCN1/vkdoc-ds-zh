- fmt: '# Classification and Regression


    Classification and regression may be applied on the same problem. For example,
    when a bank approves a credit card or loan, it calculates a credit score of a
    candidate based on multiple parameters using regression and then sets up a threshold.
    Candidates having a credit score greater than the threshold are classified as
    potential nonfraud, and the remaining are considered as potential fraud. Likewise,
    any binary classification problem can be solved using regression by applying a
    threshold on the regression result. In Chapter [4](#458833_2_En_4_Chapter.xhtml),
    I discussed in detail how to choose a threshold value from the distribution of
    any parameter. Similarly, some binary classifications can be used in place of
    logistic regression. For instance, say an e-commerce site wants to predict the
    chances of a purchase order being converted into a successful invoice. The site
    can easily do so using logistic regression. The naïve Bayes classifier can be
    directly applied on the problem because it calculates probability when it classifies
    the purchase order to be in the successful or unsuccessful class. The random forest
    algorithm can be used in the problem as well. In that case, among the *N* decision
    tree, if the *M* decision tree says the purchase order will be successful, then
    *M*/*N* will be the probability of the purchase order being successful.


    ## Intentionally Bias the Model to Over-Fit or Under-Fit


    Sometimes you need to over- or under-predict intentionally. In an auction, when
    you are predicting from the buy side, it will always be good if your bid is a
    little lower than the original. Similarly, on the sell side, it is desired that
    you set the price a little higher than the original. You can do this in two ways.
    In regression, when you are selecting the features using correlation, over-predicting
    intentionally drops some variable with negative correlation. Similarly, under-predicting
    drops some variable with positive correlation. There is another way of dealing
    with this. When you are predicting the value, you can predict the error in the
    prediction. To over-predict, when you see that the predicted error is positive,
    reduce the prediction value by the error amount. Similarly, to over-predict, increase
    the prediction value by the error amount when the error is positive.


    Another problem in classification is biased training data. Suppose you have two
    target classes, A and B. The majority (say 90 percent) of training data is class
    A. So, when you train your model with this data, all your predictions will become
    class A. One solution is a biased sampling of training data. Intentionally remove
    the class A example from training. Another approach can be used for binary classification.
    As class B is a minority in the prediction probability of a sample, in class B
    it will always be less than 0.5. Then calculate the average probability of all
    points coming into class B. For any point, if the class B probability is greater
    than the average probability, then mark it as class B and otherwise class A.


    ## Dealing with Categorical Data


    For algorithm-like support, vector or regression input data must be numeric. So,
    if you are dealing with categorical data, you need to convert to numeric data.
    One strategy for conversion is to use an ordinal number as the numerical score.
    Other popular technique is using *one-hot encoder*. In the first method, we assign
    numbers for each of the category. If there are five categories in a column, there
    will be five numbers, e.g., 0 to 4, for these categories, whereas in one-hot encoding,
    a new binary column is created for each category and marked as true or false based
    on the category. Please run the following code to get a better understanding of
    this:


    Please find the CSV file at the following link:


    [`https://github.com/Apress/advanced-data-analytics-python-2e`](https://github.com/Apress/advanced-data-analytics-python-2e)


    ```

    import pandas as pd

    from sklearn.preprocessing import OneHotEncoder

    from sklearn.preprocessing import OrdinalEncoder

    df = pd.read_csv(''book\\ch3\\fetaure_engineering_data.csv'')

    oe = OrdinalEncoder()

    df["Functional_code"] = oe.fit_transform(df[["Functional"]])

    print(df[["Functional", "Functional_code"]]. head(20))

    ohe = OneHotEncoder()

    ohe_results = ohe.fit_transform(df[["Functional"]])

    print(pd.DataFrame(ohe_results.toarray(), columns=ohe.categories).head(20))

    ```


    ## Summary


    This chapter discusses feature engineering, which is essential to get good accuracy
    for the model. Then we describe supervised learning techniques like classification
    and regression in detail.


    # Unsupervised Learning: Clustering


    In Chapter [3](#458833_2_En_3_Chapter.xhtml) we discussed how training data can
    be used to categorize customer comments according to sentiment (positive, negative,
    neutral), as well as according to context. For example, in the airline industry,
    that context might be punctuality, food, comfort, entertainment, and so on. Using
    this analysis, a business owner can determine the areas that his business needs
    to concentrate on. For instance, if he observes that the highest percentage of
    negative comments has been about food, then his priority will be the quality of
    food being served to customers. However, there are scenarios where business owners
    are not sure about the context. There are also cases where training data is not
    available. Moreover, the frame of reference can change with time. Classification
    algorithms cannot be applied where target classes are unknown. A clustering algorithm
    is used in these kinds of situations. A conventional application of clustering
    is found in the wine-making industry where each cluster represents a brand of
    wine, and wines are clustered according to their component ratio in wine. In Chapter
    [3](#458833_2_En_3_Chapter.xhtml), you learned that classification can be used
    to recognize a type of image, but there are scenarios where one image has multiple
    shapes and an algorithm is needed to separate the figures. Clustering algorithms
    are used in this kind of use case.


    Clustering classifies objects into groups based on similarity or distance measure.
    This is an example of unsupervised learning. The main difference between clustering
    and classification is that the latter has well-defined target classes. The characteristics
    of target classes are defined by the training data and the models learned from
    it. That is why classification is supervised in nature. In contrast, clustering
    tries to define meaningful classes based on data and its similarity or distance.
    Figure [4-1](#458833_2_En_4_Chapter.xhtml#Fig1) illustrates a document clustering
    process.


    ![](images/458833_2_En_4_Chapter/458833_2_En_4_Fig1_HTML.jpg)


    A scatter graph illustrates how three different clusters of a scattered document
    are grouped into three circles by clustering.


    **Figure 4-1** Document clustering'
