- fmt: "# Mixed ARMA Models\n\nMixed ARMA models are a combination of MA and AR processes.\
    \ A mixed autoregressive/moving average process containing `p` AR terms and `q`\
    \ MA terms is said to be an ARMA process of order `(p,q)`. It is given by the\
    \ following:\n\n![$$ {X}_t={\\alpha}_1{X}_{t-1}+\\dots +{\\alpha}_p{X}_{t-p}+{Z}_t+{\\\
    beta}_1{Z}_{t-1}+\\dots {\\beta}_q{Z}_{t-q} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equad.png)\n\
    \nThe following example code was taken from the stat model site to realize time-series\
    \ data as an ARMA model.\n\nPlease install `matplotlib`, `statsmodels`, and `numpy`\
    \ using the `pip` command before running the code.\n\n```\nimport matplotlib.pyplot\
    \ as plt\nimport numpy as np\nfrom statsmodels.tsa.arima_process import ArmaProcess\n\
    import statsmodels.api as sm\nnp.random.seed(1234)\ndata = np.array([1, .85, -.43,\
    \ -.63, .8])\nparameter = np.array([1, .41])\nmodel = ArmaProcess(data, parameter)\n\
    fig = plt.figure(figsize=(12, 8))\nax = fig.add_subplot(111)\nax.plot(model.generate_sample(nsample=50))\n\
    plt.show()\n```\n\nHere is how to estimate parameters of an ARMA model:\n\n1.\
    \ After specifying the order of a stationary ARMA process, you need to estimate\
    \ the parameters.\n2. Assume the following:\n   - The model order (`p` and `q`)\
    \ is known.\n   - The data has zero mean.\n3. If step 2 is not a reasonable assumption,\
    \ you can subtract the sample mean `Y` and fit a 0 mean ARMA model, as in `Ø(B)X[t]\
    \ = θ(B)a[t]` where `X[t] = Y[t] – Y`. Then use `X[t] + Y` as the model for `Y[t]`.\n\
    \n# Integrated ARMA Models\n\nTo fit a stationary model such as the one discussed\
    \ earlier, it is imperative to remove nonstationary sources of variation. Differencing\
    \ is widely used for econometric data. If `X[t]` is replaced by `∇^dX[t]`, then\
    \ you have a model capable of describing certain types of nonstationary series.\n\
    \n![$$ {Y}_t={\\left(1-L\\right)}^d{X}_t $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equae.png)\n\
    \nThese are the estimating parameters of an ARIMA model:\n\n- ARIMA models are\
    \ designated by the level of autoregression, integration, and moving averages.\n\
    - This does not assume any pattern uses an iterative approach of identifying a\
    \ model.\n- The model \"fits\" if residuals are generally small, randomly distributed,\
    \ and, in general, contain no useful information.\n\nHere is the example code\
    \ for an ARIMA model.\n\nPlease download the required CSV file from `https://github.com/pratips/book-Advanced-Data-Analytics-Using-Python`\
    \ and install the Python libraries using the `pip` command.\n\n```\n# importing\
    \ libraries\nfrom pandas import read_csv\nfrom matplotlib import pyplot\nfrom\
    \ statsmodels.tsa.arima.model import ARIMA\nfrom sklearn.metrics import mean_squared_error\n\
    # readfing csv\nseries = read_csv('temperatures.csv', header=0, index_col=0, parse_dates=True,\
    \ squeeze=True)\nP = series.values\nsize = int(len(P) * 0.9)\n#splitting into\
    \ train test set\ntrain, test = P[0:size], P[size:len(P)]\nhistory = [p for p\
    \ in train]\npredictions = list()\nfor t in range(len(test)):\n# fitting model\n\
    model = ARIMA(history, order=(5,1,0))\nmodel_fit = model.fit()\noutput = model_fit.forecast()\n\
    yhat = output[0]\npredictions.append(yhat)\nobs = test[t]\nhistory.append(obs)\n\
    print('predicted=%f, expected=%f' % (yhat, obs))\nerror = mean_squared_error(test,\
    \ predictions)\nprint('Test MSE: %.3f' % error)\n# plotting results\npyplot.plot(test)\n\
    pyplot.plot(predictions, color='red')\npyplot.show()\n```\n\n# The Fourier Transform\n\
    \nThe representation of nonperiodic signals by everlasting exponential signals\
    \ can be accomplished by a simple limiting process, and I will illustrate that\
    \ nonperiodic signals can be expressed as a continuous sum (integral) of everlasting\
    \ exponential signals. Say you want to represent the nonperiodic signal `g(t)`.\
    \ Realizing any nonperiodic signal as a periodic signal with an infinite time\
    \ period, you get the following:\n\n![$$ g(t)=\\frac{1}{2\\pi}\\int_{-\\infty}^{\\\
    infty }G\\left(\\omega \\right){e}^{j\\omega t} d\\omega $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equaf.png)\n\
    \n![$$ G\\left(n\\Delta \\omega \\right)=\\underset{T\\to \\infty }{\\lim}\\int_{-{T}_0/2}^{T_0/2}{g}_p(t){e}^{-\
    \ jn\\Delta \\omega t} dt $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equag.png)\n\
    \nHence:\n\n![$$ G\\left(\\omega \\right)=\\int_{-\\infty}^{\\infty }g(t){e}^{-\
    \ j\\omega t} dt $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equah.png)\n\
    \n`G(w)` is known as a Fourier transform of `g(t)`.\n\nHere is the relation between\
    \ autocovariance and the Fourier transform:\n\n![$$ \\gamma (0)={\\sigma}_X^2=\\\
    int_0^{\\pi } dF\\left(\\omega \\right)=F\\left(\\pi \\right) $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equai.png)\n\
    \n# An Exceptional Scenario\n\nIn the airline or hotel domain, the passenger load\
    \ of month `t` is less correlated with data of `t-1` or `t-2` month, but it is\
    \ more correlated for `t-12` month. For example, the passenger load in the month\
    \ of Diwali (October) is more correlated with last year's Diwali data than with\
    \ the same year's August and September data. Historically, the pick-up model is\
    \ used to predict this kind of data. The pick-up model has two variations.\n\n\
    In the additive pick-up model,\n\n![$$ \\textrm{X}\\left(\\textrm{t}\\right)=\\\
    textrm{X}\\left(\\textrm{t}\\hbox{-} 1\\right)+\\left[\\textrm{X}\\left(\\textrm{t}\\\
    hbox{-} 12\\right)\\hbox{-} \\textrm{X}\\left(\\textrm{t}\\hbox{-} 13\\right)\\\
    right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equaj.png)\n\
    \nIn the multiplicative pick-up model,\n\n![$$ \\textrm{X}\\left(\\textrm{t}\\\
    right)=\\textrm{X}{\\left(\\textrm{t}\\hbox{-} 1\\right)}^{\\ast }\\ \\left[\\\
    textrm{X}\\left(\\textrm{t}\\hbox{-} 12\\right)/\\textrm{X}\\left(\\textrm{t}\\\
    hbox{-} 13\\right)\\right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equak.png)\n\
    \nStudies have shown that for this kind of data the neural network–based predictor\
    \ gives more accuracy than the time-series model.\n\nIn high-frequency trading\
    \ in investment banking, time-series models are too time-consuming to capture\
    \ the latest pattern of the instrument. So, they on the fly calculate `dX/dt`\
    \ and `d2X/dt2`, where `X` is the price of the instruments. If both are positive,\
    \ they blindly send an order to buy the instrument. If both are negative, they\
    \ blindly sell the instrument if they have it in their portfolio. But if they\
    \ have an opposite sign, then they do a more detailed analysis using the time-series\
    \ data.\n\nAs I stated earlier, there are many scenarios in time-series analysis\
    \ where R is a better choice than Python. So, here is an example of time-series\
    \ forecasting using R. The beauty of the `auto.arima` model is that it automatically\
    \ finds the order, trends, and seasonality of the data and fits the model. In\
    \ the forecast, we are printing only the mean value, but the model provides the\
    \ upper limit and the lower limit of the prediction in forecasting.\n\nPlease\
    \ install the `pmdarima` library by using the following command:\n\n```\npip install\
    \ pmdarima\n```\n\nOnce you install, you can try running the following code based\
    \ on `pmdarima`'s manual. It loads a data set available in the package and then\
    \ tries to fit auto arima and predicts as well.\n\n```\nimport numpy as np\nimport\
    \ pmdarima as pm\nfrom pmdarima.datasets import load_wineind\n# loading dataset\n\
    wineind = load_wineind().astype(np.float64)\n# fitting a stepwise model:\nstepwise_fit\
    \ = pm.auto_arima(wineind, start_p=1, start_q=1, max_p=3, max_q=3, m=12, start_P=0,\
    \ seasonal=True, d=1, D=1, trace=True, error_action='ignore', suppress_warnings=True,\
    \ stepwise=True)\nstepwise_fit.summary()\npredicted_15 = stepwise_fit.predict(n_periods=15)\n\
    print(predicted_15)\n```\n\n# Missing Data\n\nOne important aspect of time series\
    \ and many other data analysis work is figuring out how to deal with missing data.\
    \ In the previous code, you fill in the missing record with the average value.\
    \ This is fine when the number of missing data instances is not very high. But\
    \ if it is high, then the average of the highest and lowest values is a better\
    \ alternative."
  raw: "## Mixed ARMA Models\n\nMixed ARMA models are a combination of MA and AR processes.\
    \ A mixed autoregressive/moving average process containing p AR terms and q MA\
    \ terms is said to be an ARMA process of order (p,q). It is given by the following:\n\
    \n![$$ {X}_t={\\alpha}_1{X}_{t-1}+\\dots +{\\alpha}_p{X}_{t-p}+{Z}_t+{\\beta}_1{Z}_{t-1}+\\\
    dots {\\beta}_q{Z}_{t-q} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equad.png)\n\
    \nThe following example code was taken from the stat model site to realize time-series\
    \ data as an ARMA model.\n\nPlease install matplotlib, statsmodels, and numpy\
    \ using the pip command before running the code.\n\n```\nimport matplotlib.pyplot\
    \ as plt\nimport numpy as np\nfrom statsmodels.tsa.arima_process import ArmaProcess\n\
    import statsmodels.api as sm\nnp.random.seed(1234)\ndata = np.array([1, .85, -.43,\
    \ -.63, .8])\nparameter = np.array([1, .41])\nmodel = ArmaProcess(data, parameter)\n\
    fig = plt.figure(figsize=(12, 8))\nax = fig.add_subplot(111)\nax.plot(model.generate_sample(nsample=50))\n\
    plt.show()\n```\n\nHere is how to estimate parameters of an ARMA model:\n\n1.\
    \  After specifying the order of a stationary ARMA process, you need to estimate\
    \ the parameters.\n\n2.  Assume the following:\n    *   The model order (p and\
    \ q) is known.\n\n    *   The data has zero mean.\n\n3.  If step 2 is not a reasonable\
    \ assumption, you can subtract the sample mean Y and fit a 0 mean ARMA model,\
    \ as in Ø(B)X[t] = *θ*(B)a[t] where X[t] = Y[t] – Y. Then use X[t] + Y as the\
    \ model for Y[t].\n\n## Integrated ARMA Models\n\nTo fit a stationary model such\
    \ as the one discussed earlier, it is imperative to remove nonstationary sources\
    \ of variation. Differencing is widely used for econometric data. If X[t] is replaced\
    \ by ∇^dX[t], then you have a model capable of describing certain types of nonstationary\
    \ series.\n\n![$$ {Y}_t={\\left(1-L\\right)}^d{X}_t $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equae.png)\n\
    \nThese are the estimating parameters of an ARIMA model:\n\n*   ARIMA models are\
    \ designated by the level of autoregression, integration, and moving averages.\n\
    \n*   This does not assume any pattern uses an iterative approach of identifying\
    \ a model.\n\n*   The model “fits” if residuals are generally small, randomly\
    \ distributed, and, in general, contain no useful information.\n\nHere is the\
    \ example code for an ARIMA model.\n\nPlease download the required CSV file from\
    \ [`https://github.com/pratips/book-Advanced-Data-Analytics-Using-Python`](https://github.com/pratips/book-Advanced-Data-Analytics-Using-Python)\
    \ and install the Python libraries using the pip command.\n\n```\n# importing\
    \ libraries\nfrom pandas import read_csv\nfrom matplotlib import pyplot\nfrom\
    \ statsmodels.tsa.arima.model import ARIMA\nfrom sklearn.metrics import mean_squared_error\n\
    # readfing csv\nseries = read_csv('temperatures.csv', header=0, index_col=0, parse_dates=True,\
    \ squeeze=True)\nP = series.values\nsize = int(len(P) * 0.9)\n#splitting into\
    \ train test set\ntrain, test = P[0:size], P[size:len(P)]\nhistory = [p for p\
    \ in train]\npredictions = list()\nfor t in range(len(test)):\n# fitting model\n\
    model = ARIMA(history, order=(5,1,0))\nmodel_fit = model.fit()\noutput = model_fit.forecast()\n\
    yhat = output[0]\npredictions.append(yhat)\nobs = test[t]\nhistory.append(obs)\n\
    print('predicted=%f, expected=%f' % (yhat, obs))\nerror = mean_squared_error(test,\
    \ predictions)\nprint('Test MSE: %.3f' % error)\n# plotting results\npyplot.plot(test)\n\
    pyplot.plot(predictions, color='red')\npyplot.show()\n```\n\n## The Fourier Transform\n\
    \nThe representation of nonperiodic signals by everlasting exponential signals\
    \ can be accomplished by a simple limiting process, and I will illustrate that\
    \ nonperiodic signals can be expressed as a continuous sum (integral) of everlasting\
    \ exponential signals. Say you want to represent the nonperiodic signal g(t).\
    \ Realizing any nonperiodic signal as a periodic signal with an infinite time\
    \ period, you get the following:\n\n![$$ g(t)=\\frac{1}{2\\pi}\\int_{-\\infty}^{\\\
    infty }G\\left(\\omega \\right){e}^{j\\omega t} d\\omega $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equaf.png)\n\
    \n![$$ G\\left(n\\Delta \\omega \\right)=\\underset{T\\to \\infty }{\\lim}\\int_{-{T}_0/2}^{T_0/2}{g}_p(t){e}^{-\
    \ jn\\Delta \\omega t} dt $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equag.png)\n\
    \nHence:\n\n![$$ G\\left(\\omega \\right)=\\int_{-\\infty}^{\\infty }g(t){e}^{-\
    \ j\\omega t} dt $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equah.png)\n\
    \nG(w) is known as a Fourier transform of g(t).\n\nHere is the relation between\
    \ autocovariance and the Fourier transform:\n\n![$$ \\gamma (0)={\\sigma}_X^2=\\\
    int_0^{\\pi } dF\\left(\\omega \\right)=F\\left(\\pi \\right) $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equai.png)\n\
    \n## An Exceptional Scenario\n\nIn the airline or hotel domain, the passenger\
    \ load of month t is less correlated with data of t-1 or t-2 month, but it is\
    \ more correlated for t-12 month. For example, the passenger load in the month\
    \ of Diwali (October) is more correlated with last year’s Diwali data than with\
    \ the same year’s August and September data. Historically, the pick-up model is\
    \ used to predict this kind of data. The pick-up model has two variations.\n\n\
    In the additive pick-up model,\n\n![$$ \\textrm{X}\\left(\\textrm{t}\\right)=\\\
    textrm{X}\\left(\\textrm{t}\\hbox{-} 1\\right)+\\left[\\textrm{X}\\left(\\textrm{t}\\\
    hbox{-} 12\\right)\\hbox{-} \\textrm{X}\\left(\\textrm{t}\\hbox{-} 13\\right)\\\
    right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equaj.png)\n\
    \nIn the multiplicative pick-up model,\n\n![$$ \\textrm{X}\\left(\\textrm{t}\\\
    right)=\\textrm{X}{\\left(\\textrm{t}\\hbox{-} 1\\right)}^{\\ast }\\ \\left[\\\
    textrm{X}\\left(\\textrm{t}\\hbox{-} 12\\right)/\\textrm{X}\\left(\\textrm{t}\\\
    hbox{-} 13\\right)\\right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equak.png)\n\
    \nStudies have shown that for this kind of data the neural network–based predictor\
    \ gives more accuracy than the time-series model.\n\nIn high-frequency trading\
    \ in investment banking, time-series models are too time-consuming to capture\
    \ the latest pattern of the instrument. So, they on the fly calculate dX/dt and\
    \ d2X/dt2, where X is the price of the instruments. If both are positive, they\
    \ blindly send an order to buy the instrument. If both are negative, they blindly\
    \ sell the instrument if they have it in their portfolio. But if they have an\
    \ opposite sign, then they do a more detailed analysis using the time-series data.\n\
    \nAs I stated earlier, there are many scenarios in time-series analysis where\
    \ R is a better choice than Python. So, here is an example of time-series forecasting\
    \ using R. The beauty of the auto.arima model is that it automatically finds the\
    \ order, trends, and seasonality of the data and fits the model. In the forecast,\
    \ we are printing only the mean value, but the model provides the upper limit\
    \ and the lower limit of the prediction in forecasting.\n\nPlease install the\
    \ pmdarima library by using the following command:\n\n```\npip install pmdarima\n\
    ```\n\nOnce you install, you can try running the following code based on pmdarima’s\
    \ manual. It loads a data set available in the package and then tries to fit auto\
    \ arima and predicts as well.\n\n```\nimport numpy as np\nimport pmdarima as pm\n\
    from pmdarima.datasets import load_wineind\n# loading dataset\nwineind = load_wineind().astype(np.float64)\n\
    # fitting a stepwise model:\nstepwise_fit = pm.auto_arima(wineind, start_p=1,\
    \ start_q=1, max_p=3, max_q=3, m=12, start_P=0, seasonal=True, d=1, D=1, trace=True,\
    \ error_action=’ignore’, suppress_warnings=True, stepwise=True)\nstepwise_fit.summary()\n\
    predicted_15 = stepwise_fit.predict(n_periods=15)\nprint(predicted_15)\n```\n\n\
    ## Missing Data\n\nOne important aspect of time series and many other data analysis\
    \ work is figuring out how to deal with missing data. In the previous code, you\
    \ fill in the missing record with the average value. This is fine when the number\
    \ of missing data instances is not very high. But if it is high, then the average\
    \ of the highest and lowest values is a better alternative."
  trans: "\n# 混合 ARMA 模型\n\n混合 ARMA 模型是 MA 和 AR 过程的组合。一个包含`p`个 AR 项和`q`个 MA 项的混合自回归/移动平均过程，被称为阶数为`(p,q)`的\
    \ ARMA 过程。其定义如下：\n\n![$$ {X}_t={\\alpha}_1{X}_{t-1}+\\dots +{\\alpha}_p{X}_{t-p}+{Z}_t+{\\\
