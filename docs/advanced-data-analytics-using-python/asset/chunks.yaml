    p if you have this:


    ![$$ {\displaystyle \begin{array}{l}{x}_t={\alpha}_1{x}_{t-1}+\dots {\alpha}_p{x}_{t-p}+{z}_t,
    or\\ {}{x}_t=\sum \limits_{i=1}^p{\alpha}_i{x}_{i-1}+{z}_t\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equu.png)


    The autocovariance function is given by the following:


    ![$$ \gamma (k)=\frac{\alpha^k{\sigma}_z^2}{\left(1-{\alpha}^2\right)},k=0,1,2\dots,
    \textrm{hence} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equv.png)


    ![$$ {\rho}_k=\frac{\gamma (k)}{\gamma (0)}={\alpha}^k $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equw.png)


    Figure [6-4](#458833_2_En_6_Chapter.xhtml#Fig4) shows a time series and its autocorrelation
    plot of the AR model.


    ![](images/458833_2_En_6_Chapter/458833_2_En_6_Fig4_HTML.jpg)


    A simulated graph of time series and A R model. It plots a fluctuating trend with
    multiple crests and troughs.


