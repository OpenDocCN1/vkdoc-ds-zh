    以下代码使用 Python 创建了一个层次聚类。输入数据文件可以从 [`https://canvas.uw.edu/courses/1546077/files/92110986`](https://canvas.uw.edu/courses/1546077/files/92110986)
    下载。


    ```

    import numpy as np

    import pandas as pd

    from sklearn.preprocessing import StandardScaler, normalize

    from sklearn.decomposition import PCA

    import scipy.cluster.hierarchy as hc

    import matplotlib.pyplot as plt

    from sklearn.cluster import AgglomerativeClustering

    # Load the CSV file

    df = pd.read_csv("book\\ch4\\CC_GENERAL.csv")

    # preprocessing

    df = df.drop(''CUST_ID'', axis = 1)

    df.fillna(method =''ffill'', inplace = True)

    # Scale and normalize

    ss = StandardScaler()

    scaled_df = ss.fit_transform(df)

    normalized_df= normalize(scaled_df)

    # Reduce the dimensionality to 3

    pca = PCA(n_components=3)

    df_pca = pca.fit_transform(normalized_df)

    df_pca = pd.DataFrame(df_pca)

    df_pca.columns = [''P1'', ''P2'', ''P3'']

    # Dendogram plot

    plt.figure(figsize =(10, 10))

    plt.title(''Visualising the data'')

    dendrogram = hc.dendrogram((hc.linkage(df_pca, method =''ward'')))

    # create 3 clusters using Agglomerative hierarchical clustering

    hrc= AgglomerativeClustering(n_clusters = 3)

    plt.figure(figsize =(10, 10))

    plt.scatter(df_pca[''P1''], df_pca[''P2''], df_pca[''P3''], c = hrc.fit_predict(df_pca),
    cmap =''rainbow'')

    plt.title("Agglomerative Hierarchical Clusters - Scatter Plot", fontsize=18)

    plt.show()

    ```


    ### 图论方法


    聚类问题可以映射到一个图，其中图中的每个节点都是一个输入数据点。如果两个图之间的距离小于阈值，则相应的节点被连接起来。现在，使用图划分算法，你可以对图进行聚类。聚类在投资银行中的一个行业示例是，聚类工具取决于其价格时间序列的相关性以及每个聚类一起进行的表现交易。这在算法交易中被称为*篮子交易*。因此，通过使用相似性度量，你可以构建一个图，其中节点是工具，节点之间的边表示这些工具是相关的。要创建篮子，你需要一组彼此都相关的工具。在图中，这是一个节点集或子图，其中子图中的所有节点都相互连接。这种子图被称为*团*。寻找最大规模的团是一个
    NP 完全问题。人们使用启发式解决方案来解决这个聚类问题。


    ### 如何判断聚类结果是否良好？


    应用聚类算法后，验证结果的好坏是聚类分析中的关键步骤。有三个参数用于衡量聚类的质量，即质心、半径和直径。


    ![$$ \textrm{Centroid}={\textrm{C}}_{\textrm{m}}=\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\textrm{t}}_{mi}}{\textrm{N}}
    $$](img/458833_2_En_4_Chapter_TeX_Equt.png)


    ![$$ \textrm{Radius}={\textrm{R}}_{\textrm{m}}=\sqrt{\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\left({\textrm{t}}_{mi}-{\textrm{C}}_{\textrm{m}}\right)}²}{\textrm{N}}}
    $$](img/458833_2_En_4_Chapter_TeX_Equu.png)


    ![$$ \textrm{Diameter}={\textrm{D}}_{\textrm{m}}=\sqrt{\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\sum_{\textrm{j}=1}}^{\textrm{N}}{\left({\textrm{t}}_{mi}-{\textrm{C}}_{\textrm{m}}\right)}²}{\left(\textrm{N}\right)\left(\textrm{N}-1\right)}}
    $$](img/458833_2_En_4_Chapter_TeX_Equv.png)


    如果你将簇视为一个包围该簇中所有成员点的空间中的圆，那么你可以将质心视为圆心。类似地，簇的半径和直径就是该圆的半径和直径。任何簇都可以用这三个参数来表示。良好聚类的一个衡量标准是，中心之间的距离应大于半径之和。


    以下来自先前脚本的代码片段可用于可视化输出，其中来自同一簇的数据点应被视为聚集在一起。


    ```

    # create 3 clusters using Agglomerative hierarchical clustering

    hrc= AgglomerativeClustering(n_clusters = 3)

    plt.figure(figsize =(10, 10))

    plt.scatter(df_pca[''P1''], df_pca[''P2''], df_pca[''P3''], c = hrc.fit_predict(df_pca),
    cmap =''rainbow'')

    plt.title("Agglomerative Hierarchical Clusters - Scatter Plot", fontsize=18)

    plt.show()

    ```


    ## 总结


    除了这些章节外，其他每一章都将包含我们将用于标记模型训练的数据。然后会有一组没有标签的新数据。模型会对这些数据进行标记。这被称为*监督学习*。


    然而，本章中没有数据标签。算法根据它们的相似性对它们进行分组或标记。在一个非英语国家，孩子们在学校里在老师的监督下学习英语。然而，在观看 YouTube 视频两三年后，孩子们开始在没有指导的情况下说一些简单的英语。这被称为无监督学习。

