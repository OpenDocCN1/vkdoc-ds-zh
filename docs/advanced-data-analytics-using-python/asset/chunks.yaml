  trans: "\n# Spark\n\n继 Hadoop 之后，Spark 是大数据技术的下一次革命性演进。Spark 的主要优势在于它为整个大数据技术栈提供了统一接口。过去，如果你需要类似\
    \ SQL 的大数据接口，你会使用 Hive；如果需要实时数据处理，你会使用 Storm；如果想构建机器学习模型，你会使用 Mahout。而 Spark 将所有功能整合到一个框架之下。此外，它支持大数据的内存计算，这使得处理速度非常快。图\
    \ 7-5 描述了 Spark 的所有组件。\n\n![](img/458833_2_En_7_Fig5_HTML.jpg)\n\n一个框图列出了 Spark\
    \ Core 的组件，包括：Spark SQL 结构化数据、Spark Streaming 实时处理、MLib 机器学习、GraphX、调度器、YARN 和\
    \ Mesos。\n\n**图 7-5** Spark 的组件\n\n`Spark Core` 是 Spark 的基础组件。它可以运行在 Hadoop 之上，也可以独立运行。它将数据集抽象为弹性分布式数据集（RDD）。RDD\
    \ 是一个只读对象的集合。由于它是只读的，因此在与多个并行操作共享时不会出现任何同步问题。对 RDD 的操作是惰性的。RDD 上的操作分为两种类型：转换（transformation）和动作（action）。在转换中，数据集上不会执行任何操作。Spark\
    \ 仅将操作序列存储为一个称为*血统（lineage）*的有向无环图。当调用动作时，才会执行实际计算。首次执行后，结果会缓存在内存中。因此，当调用新的执行时，Spark\
    \ 会遍历血统图，最大限度地重用之前的计算结果，从而使新操作的计算量降至最低。这使得数据处理速度非常快，并且也使数据具有容错性。如果任何节点发生故障，Spark\
    \ 会查看该节点数据的血统图，并轻松地重新生成它。\n\nHadoop 框架的一个局限性是它在并行计算中没有消息传递接口。但有许多用例需要并行作业之间相互通信。Spark\
    \ 通过使用两种共享变量来实现这一点：广播变量（broadcast variable）和累加器（accumulator）。当一个作业需要向所有其他作业发送消息时，该作业使用广播变量；而当多个作业想要将结果聚合到一个地方时，它们使用累加器。RDD\
    \ 将其数据集分割成称为*分区（partition）*的单元。Spark 提供了一个接口来指定数据的分区，这对于未来的操作（如 `join` 或 `find`）非常有效。用户可以在\
    \ Spark 中指定分区的存储类型。Spark 提供了 Python、Java 和 Scala 的编程接口。以下是在 Spark 中实现单词计数程序的示例代码：\n\
    \n```\nval conf = new SparkConf().setAppName(\"wiki_test\") // 创建一个 Spark 配置对象\n\
    val sc = new SparkContext(conf) // 创建一个 Spark 上下文\nval data = sc.textFile(\"/path/to/somedir\"\
    ) // 从 \"somedir\" 读取文件到 RDD 中，RDD 包含 (文件名, 内容) 对。\nval tokens = data.flatMap(_.split(\"\
    \ \")) // 将每个文件拆分为一个 token（单词）列表。\nval wordFreq = tokens.map((_, 1)).reduceByKey(_\
    \ + _) // 为每个 token 添加计数 1，然后按单词类型求和。\nwordFreq.sortBy(s => -s._2).map(x => (x._2,\
    \ x._1)).top(10) // 获取前 10 个单词。交换单词和计数以便按计数排序。\n```\n\n在 `Spark Core` 之上，Spark\
    \ 提供了以下功能：\n\n*   Spark SQL，通过命令行或数据库连接器接口提供 SQL 接口。它还为 Spark 数据帧对象提供了 SQL 接口。\n\
    *   Spark Streaming，使您能够实时处理流式数据。\n*   MLib，一个机器学习库，用于在 Spark 数据上构建分析模型。\n*  \
    \ GraphX，一个分布式图处理框架。\n\n# PySpark\n\nPySpark 是 Apache Spark 的 Python 接口。使用简单的\
    \ Python API，我们可以编写 Spark 应用程序。Spark 的所有主要特性，即 Spark SQL、MLib 和数据帧，都受 PySpark\
    \ 支持。以下是安装步骤：\n\n1.  首先，我们需要 Java 运行时环境（JRE）来运行 Spark。建议从以下链接安装 JRE：[`https://adoptium.net/temurin/releases/?version=8`](https://adoptium.net/temurin/releases/%253Fversion%253D8)。此外，您也可以从其他发行版安装\
    \ JRE。\n\n    安装过程会自动创建 `JAVA_HOME`。如果没有，我们需要将 `JAVA_HOME` 设置为系统变量；其值应为 Java 安装文件夹的位置，例如\
    \ `JAVA_HOME=C:\\Program Files\\Eclipse Adoptium\\jdk-8.0.345.1-hotspot\\`。\n\n\
    2.  然后，我们需要使用命令 `pip install pyspark` 安装 PySpark。\n\n    为此，我们需要安装 Python 3.7\
    \ 或更高版本。之后，我们需要将 `env PYSPARK_PYTHON` 设置为 Python 的位置。示例如下：`C:\\Users\\...\\Programs\\\
    Python\\Python39\\python.exe`。\n\n3.  此外，通过使用 `pip install pyarrow` 安装 PyArrow，以便在\
    \ PySpark 中使用 Pandas API。\n\n现在，我们可以开始用 PySpark 编写代码了。CSV 文件与我们之前使用的相同。\n\n```\n\
    from pyspark.sql import SparkSession\nfrom datetime import datetime, date\nimport\
    \ pandas as pd\nfrom pyspark.sql import Row\nimport pyspark.pandas as ps\nimport\
    \ numpy as np\n# 创建 Spark 会话\nspark = SparkSession.builder.getOrCreate()\nprint(spark)\n\
    # 创建序列\ns = ps.Series([11, np.nan, 51, 16, 82])\nprint(s)\n# 创建数据帧\npandas_df\
    \ = pd.DataFrame({\n'C1': [11, 22, 31],\n'C2': [12., 13., 14.],\n'C3': ['text1',\
    \ 'text2', 'text3'],\n'C4': [date(2010, 1, 1), date(2011, 2, 1), date (2012, 3,\
    \ 1)]\n})\ndf = spark.createDataFrame(pandas_df)\ndf.show()\ndf.printSchema()\n\
    # 使用 Spark 读取 CSV 文件\ndf = spark.read.csv ('book\\\\ch4\\\\CC_GENERAL.csv', header=True)\n\
    df.show()\npsdf = df.pandas_api()\nprint(psdf.describe())\n```\n"
- fmt: '## Updatable Machine Learning and Spark Memory Model


    In this section, we discuss a new machine learning topic: how to develop an updatable
    machine learning model, which is a basic requirement for a model to become scalable.


    When we train a model in machine learning, we data train the model from scratch,
    which implies that all the information from prior training iterations is swapped
    out. For example, if we train a model with data from the first week of the month,
    it will predict based on the first week’s data, and if we train the same model
    object with data from the second week, it will predict based on the second week’s
    data. It begins to forecast based only on data from the second week of the month.
    In the model, there is no trace of first-week data. However, in the real world,
    there are many scenarios when we require the model to forecast based on first-
    and second-week data after training, which implies that each training iteration
    will update the model rather than erase prior training information.


    This type of model is possible when the model is a function of `X` and for any
    two data sets `N1` and `N2`.


    `X(N1) + X(N2) = X(N1+N2)`


    Examples of this type of function are `count`, `max`, `min`, and `sum`. Any probability-based
    model may be divided into `sum` and `count` and therefore converted into an updatable
    model. The Bayesian classifier was used as a model in our application, and the
    Spark code in the next is our own implementation of the classifier.


    The algorithm’s goal is to determine the conditional probability that a `Node(video
    or content)` will be observed for a specific feature value.


    Assume we’re calculating the score for node `10033207` with the feature identifier
    (device ID) and the feature value `49` (choose any device ID according to your
    choice).


    - Feature count = Number of records where that device ID (`49`) is present

    - Conditional count = Number of records with `is_completed` equal to `1`, `identifier`
    equal to `49`, and `node` equal to `10033207`


    The ratio of the conditional count and feature count will represent the actual
    probability, but we are not dividing this stage because the model will not be
    updatable.


    In each execution of the following code, the following happens:


    1. Create a user-defined function to convert the IP address to geographic locations.

    2. Read the name of the target channel from the config file.

    3. In a data frame, load the lines from the application server log except for
    the line that contains the `newlog`.

