- fmt: '### Which Attribute Comes First?


    One important aspect of the decision tree is to decide the order of features.
    The entropy-based information gain measure decides it.


    `Entropy` is a measure of randomness of a system.


    ![$$ Entropy(S)\equiv \sum \limits_{i=1}^c-{p}_i{\log}_2{p}_i $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equo.png)


    For example, for any obvious event like the sun rises in the east, entropy is
    zero, `P`=1, and `log(p)`=0. More entropy means more uncertainty or randomness
    in the system.


    `Information gain`, which is the expected reduction in entropy caused by partitioning
    the examples according to this attribute, is the measure used in this case.


    Specifically, the information gain, `Gain(S,A)`, of an attribute `A` relative
    to a collection of examples `S` is defined as follows:


    ![$$ Gain\left(S,A\right)\equiv Entropy(S)-\sum \limits_{\upsilon \in Values(A)}\frac{\left|{S}_{\upsilon}\right|}{\left|S\right|}
    Entropy\left({S}_{\upsilon}\right) $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equp.png)


    So, an attribute with a higher information gain will come first in the decision
    tree.


    ```

    from sklearn.datasets import load_iris

    from sklearn.tree import DecisionTreeClassifier

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = DecisionTreeClassifier()

    model = model.fit(data, labels)

    print(model.predict(data[[10]]))

    ```


    ### Random Forest Classifier


    A `random forest classifier` is an extension of a decision tree in which the algorithm
    creates `N` number of decision trees where each tree has `M` number of features
    selected randomly. Now a test data will be classified by all decision trees and
    be categorized in a target class that is the output of the majority of the decision
    trees.


    ```

    from sklearn.datasets import load_iris

    from sklearn.ensemble import RandomForestClassifier

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = RandomForestClassifier()

    model = model.fit(data, labels)

    print(model.predict(data[[10]]))

    ```


    ## Naïve Bayes Classifier


    `X = (x1, x2, x3, ..., xn)` is a vector of `n` dimension. The Bayesian classifier
    assigns each `X` to one of the target classes of set `{C1, C2, …, Cm}`. This assignment
    is done on the basis of probability that `X` belongs to target class `Ci`. That
    is to say, `X` is assigned to class `Ci` if and only if `P(Ci |X) > P(Cj |X)`
    for all `j` such that `1 ≤ j ≤ m`.


    ![$$ P\left({C}_i\left|X\right.\right)=\frac{P\left(X\left|{C}_i\right.\right)P\left({C}_i\right)}{P(X)}
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equq.png)


    In general, it can be costly computationally to compute `P(X|Ci)`. If each component
    `x[k]` of `X` can have one of `r` values, there are `r^n` combinations to consider
    for each of the `m` classes. To simplify the calculation, the assumption of conditional
    class independence is made, which means that for each class, the attributes are
    assumed to be independent. The classifier developing from this assumption is known
    as the naïve Bayes classifier. The assumption allows you to write the following:


    ![$$ P\left(X\left|{C}_i\right.\right)=\vdash \prod \limits_{k=1}^nP\left({x}_k\left|{C}_i\right.\right)
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equr.png)


    The following code is an example of the naïve Bayes classification of numerical
    data:


    ```

    from sklearn.naïve_bayes import GaussianNB

    from sklearn.datasets import load_iris

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = GaussianNB()

    model = model.fit(data, labels)

    print(model.predict(data[[50]]))

    ```


    Note


    You’ll see another example of the naïve Bayes classifier in the “Sentiment Analysis”
    section.


    ## Support Vector Machine


    If you look at Figure [3-3](#458833_2_En_3_Chapter.xhtml#Fig3), you can easily
    understand that the circle and square points are linearly separable in two dimensions
    (`x1`, `x2`). But they are not linearly separable in either dimension `x1` or
    `x2`. The support vector machine algorithm works on this theory. It increases
    the dimension of the data until points are linearly separable. Once that is done,
    you have to find two parallel hyperplanes that separate the data. This planes
    are known as the `margin`. The algorithm chose the margins in such a way that
    the distance between them is the maximum. That’s why it is the maximum margin.
    The plane, which is at the middle of these two margins or at equal distance between
    them, is known as an `optimal hyperplane` that is used to classify the test data
    (see Figure [3-2](#458833_2_En_3_Chapter.xhtml#Fig2)). The separator can be nonlinear
    also.


    ![](images/458833_2_En_3_Chapter/458833_2_En_3_Fig3_HTML.png)


    A graph of X subscript 2 versus X subscript 1. It has a negative slope of optimal
    hyperplane at the maximum margin and has clusters above and below it.


    Figure 3-3


    Support vector machine


    The following code is an example of doing support vector machine classification
    using Python:


    ```

    from sklearn.svm import SVC

    from sklearn.datasets import load_iris

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = SVC()

    model = model.fit(data, labels)

    print(model.predict(data[[50]]))

    ```


    ## Nearest Neighbor Classifier


    The nearest neighbor classifier is a simple distance-based classifier. It calculates
    the distance of test data from the training data and groups the distances according
    to the target class. The target class, which has a minimum average distance from
    the test instance, is selected as the class of the test data. A Python example
    is shown here:


    ```

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.datasets import load_iris

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = KNeighborsClassifier()

    model = model.fit(data, labels)

    print(model.predict(data[[50]]))

    ```'
  raw: '### Which Attribute Comes First?


    One important aspect of the decision tree is to decide the order of features.
    The entropy-based information gain measure decides it.


    *Entropy* is a measure of randomness of a system.


    ![$$ Entropy(S)\equiv \sum \limits_{i=1}^c-{p}_i{\log}_2{p}_i $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equo.png)


    For example, for any obvious event like the sun rises in the east, entropy is
    zero, *P*=1, and log(*p*)=0\. More entropy means more uncertainty or randomness
    in the system.


    *Information gain*, which is the expected reduction in entropy caused by partitioning
    the examples according to this attribute, is the measure used in this case.


    Specifically, the information gain, *Gain*(*S*,*A*), of an attribute *A* relative
    to a collection of examples *S* is defined as follows:


    ![$$ Gain\left(S,A\right)\equiv Entropy(S)-\sum \limits_{\upsilon \in Values(A)}\frac{\left|{S}_{\upsilon}\right|}{\left|S\right|}
    Entropy\left({S}_{\upsilon}\right) $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equp.png)


    So, an attribute with a higher information gain will come first in the decision
    tree.


    ```

    from sklearn.datasets import load_iris

    from sklearn.tree import DecisionTreeClassifier

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = DecisionTreeClassifier()

    model = model.fit(data, labels)

    print(model.predict(data[[10]]))

    ```


    ### Random Forest Classifier


    A *random forest classifier* is an extension of a decision tree in which the algorithm
    creates *N* number of decision trees where each tree has *M* number of features
    selected randomly. Now a test data will be classified by all decision trees and
    be categorized in a target class that is the output of the majority of the decision
    trees.


    ```

    from sklearn.datasets import load_iris

    from sklearn.ensemble import RandomForestClassifier

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = RandomForestClassifier()

    model = model.fit(data, labels)

    print(model.predict(data[[10]]))

    ```


