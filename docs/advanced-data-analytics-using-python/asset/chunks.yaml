    ## MongoDB（Python 版）


    MongoDB 是一个开源的*文档数据库*，专为卓越性能、易于可用性和自动扩展而设计。MongoDB 确保不需要对象关系映射（ORM）来促进开发。包含由字段和值对组成的数据结构的文档在
    MongoDB 中被称为*记录*。这些记录类似于 JSON 对象。字段的值可以包含其他文档、数组和文档数组。


    ```

    {

    "_id":ObjectId("01"),

    "address": {

    "street":"Siraj Mondal Lane",

    "pincode":"743145",

    "building":"129",

    "coord": [ -24.97, 48.68 ]

    },

    "borough":"Manhattan",

    ```


    ### 将数据导入集合


    可以在系统 shell 或命令提示符中使用 `mongoimport` 将文档放入数据库的集合中。如果该集合已存在于数据库中，该操作将首先丢弃原始集合。


    ```

    mongoimport --DB test --collection restaurants --drop --file ~/downloads/primer-dataset.json

    ```


    `mongoimport` 命令连接到在 localhost 的 27017 端口上运行的 MongoDB 实例。`--file` 选项提供了一种导入数据的方式；这里它是
    `~/downloads/primer-dataset.json`。


    要将数据导入到在不同主机或端口上运行的 MongoDB 实例，需要在 `mongoimport` 命令中通过包含 `--host` 或 `--port` 选项来明确指定主机名或端口。


    MySQL 中有一个类似的 `load` 命令。


    ### 使用 pymongo 创建连接


    要创建连接，请执行以下操作：


    ```

    import MongoClient from pymongo.

    Client11 = MongoClient()

    ```


    如果没有向 `MongoClient` 传递任何参数，则它将默认连接到在 localhost 接口的 27017 端口上运行的 MongoDB 实例。


    可以指定一个完整的 MongoDB URL 来定义连接，其中包括主机和端口号。让我们看一个例子。


    首先，使用此命令安装 Mongo：`yum/apt install mongo`。


    然后，使用此命令启动 MongoDB：`service mongo start`。


    以下代码创建了一个到运行在 `mongodb0.example.net` 和端口 27017 上的 MongoDB 实例的连接：


    ```

    Client11 = MongoClient("mongodb://myhostname:27017")

    ```


    ### 访问数据库对象


    要将名为 `primer` 的数据库赋值给局部变量 `DB`，可以使用以下任意一行代码：


    ```

    Db11 = client11.primer

    db11 = client11[''primer'']

    ```


    集合对象可以通过使用字典风格或从数据库对象进行属性访问来直接访问，如下面两个示例所示：


    ```

    Coll11 = db11.dataset

    coll = db11[''dataset'']

    ```


    ### 插入数据


    你可以将一个文档放入一个不存在的集合中，以下操作将创建该集合：


    ```

    result=db.addrss.insert_one({>)

    ```


    ### 更新数据


    以下是更新数据的方法：


    ```

    result=db.address.update_one(

    {"building": "129",

    {"$set": {"address.street": "MG Road"}}

    )

    ```


    ### 删除数据


    要从集合中删除所有文档，请使用以下命令：


    ```

    result=db.restaurants.delete_many({})

    ```


    ## 云数据库


    尽管云有自己专门的章节，但我们想为你提供云数据库的概述，特别是用于大数据的数据库。当人们希望系统自动扩展时，他们更倾向于使用云数据库。Google Big
    Query 是搜索数据的最佳工具。Azure Synapsys 具有类似的功能；然而，它要昂贵得多。你可以将数据存储在 S3 上，但如果你想运行查询，则需要
    Athena，这很昂贵。因此，在现代实践中，数据作为 blob 存储在 S3 中，所有操作都在 Python 应用程序中完成。如果在数据查找中出现错误，这种方法会花费很长时间。Amazon
    Redish 也可以处理相当数量的大数据，并附带一个内置的 BI 工具。

