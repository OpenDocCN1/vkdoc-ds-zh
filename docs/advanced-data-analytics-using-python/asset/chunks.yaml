    ## 层次聚类


    层次聚类是一种对数据对象进行迭代聚类的方法。它有两种类型。


    *   凝聚层次算法，即自底向上方法

    *   分裂层次算法，即自顶向下方法


    ### 自底向上方法


    自底向上的聚类方法称为*凝聚层次聚类*。在这种方法中，每个输入对象被视为一个单独的聚类。在每次迭代中，算法将两个最相似的聚类合并为一个聚类。该过程持续进行，直到所有聚类合并成一个单一的聚类。该算法的复杂度为
    `O(n³)`。


    在该算法中，给定一组输入对象 `I = {I[1], I[2], …, I[n]}`。一组有序三元组为 `<D, K, S>`，其中 `D` 是阈值距离，`K`
    是聚类数量，`S` 是聚类集合。


    该算法的一些变体可能允许在一次迭代中合并多个具有相同距离的聚类。算法如下：


    **输入：** `I = {I[1], I[2], …, I[n]}`


    **输出：** `O`


    ```pseudocode

    for i = 1 to n do

    Ci ← {Ii};

    end for

    D ← 0;

    K ← n;

    S ← {C1, ....., Cn};

    O ← ;

    repeat

    Dist ← CalcultedMinimumDistance(S);

    D ← ∞;

    For i = 1 to K–1 do

    For j = i+1 to K do

    if Dist(i, j) < D then

    D ← Dist(i, j);

    end if

    end for

    end for

    Until K = 1;

    ```


    本章稍后会给出一个层次聚类的 Python 示例。


    ### 聚类间的距离


    在层次聚类中，计算两个聚类之间的距离是一个关键步骤。有三种计算方法。


    *   单链接法

    *   全链接法

    *   平均链接法


    #### 单链接法


    在单链接法中，两个聚类之间的距离是两个聚类中所有对象对之间距离的最小值。由于距离是最小值，因此会存在一对对象，其距离小于或等于两个聚类之间的距离。因此，单链接法可以表示如下：


    ![$$ {\displaystyle \begin{array}{c}\textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\min
    \textrm{dist}\left(\textrm{X},\textrm{Y}\right)\\ {}\textrm{X}\text{\EUR} {\textrm{C}}_{\textrm{i}},\textrm{Y}\text{\EUR}
    {\textrm{C}}_{\textrm{j}}\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equp.png)


    #### 全链接法


    在全链接法中，两个聚类之间的距离是两个聚类中所有对象对之间距离的最大值。由于距离是最大值，因此所有对象对的距离都小于或等于两个聚类之间的距离。因此，全链接法可以表示如下：


    ![$$ {\displaystyle \begin{array}{c}\textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\max
    \textrm{dist}\left(\textrm{X},\textrm{Y}\right)\\ {}\textrm{X}\text{\EUR} {\textrm{C}}_{\textrm{i}},\textrm{Y}\text{\EUR}
    {\textrm{C}}_{\textrm{j}}\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equq.png)


    #### 平均链接法


    平均链接法是前两种链接法之间的折衷方案。它避免了形成过大或过紧密聚类的极端情况。聚类 `C[i]` 和 `C[j]` 之间的距离定义如下：


    ![$$ \textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\frac{\sum_{\textrm{X}\text{\EUR}
    \textrm{Ci}}{\sum}_{\textrm{Y}\text{\EUR} {\textrm{C}}_{\textrm{j}}\vdash}\textrm{dist}\left(\textrm{X},\textrm{Y}\right)}{\left|{\textrm{C}}_{\textrm{i}}\right|\times
    \left|{\textrm{C}}_{\textrm{j}}\right|} $$](img/458833_2_En_4_Chapter_TeX_Equr.png)


    `|C[k]|` 是聚类 `C[k]` 中的数据对象数量。


    质心链接法与平均链接法类似，但这里的两个聚类之间的距离实际上是质心之间的距离。聚类 `C[i]` 的质心定义如下：


    ![$$ {\displaystyle \begin{array}{c}{\textrm{X}}_{\textrm{c}}=\vdash \left({\textrm{c}}_1,\dots
    .,{\textrm{c}}_{\textrm{m}}\right),\textrm{with}\\ {}{\textrm{c}}_{\textrm{j}}=1/\textrm{m}\sum
    {\textrm{X}}_{kj},\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equs.png)


    `X[kj]` 是聚类 `C[i]` 中第 k 个数据对象的第 j 维。

