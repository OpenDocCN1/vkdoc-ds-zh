    *x*[*k*] of *X* can have one of *r* values, there are *r*^(*n*) combinations to
    consider for each of the *m* classes. To simplify the calculation, the assumption
    of conditional class independence is made, which means that for each class, the
    attributes are assumed to be independent. The classifier developing from this
    assumption is known as the naïve Bayes classifier. The assumption allows you to
    write the following:


    ![$$ P\left(X\left|{C}_i\right.\right)=\vdash \prod \limits_{k=1}^nP\left({x}_k\left|{C}_i\right.\right)
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equr.png)


    The following code is an example of the naïve Bayes classification of numerical
    data:


    ```

    from sklearn.naïve_bayes import GaussianNB

    from sklearn.datasets import load_iris

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = GaussianNB()

    model = model.fit(data, labels)

    print(model.predict(data[[50]]))

