  trans: '

    ### 哪个属性优先？


    决策树的一个重要方面是决定特征的顺序。基于熵的信息增益度量决定了这一顺序。


    `熵`是衡量系统随机性的指标。


    ![$$ Entropy(S)\equiv \sum \limits_{i=1}^c-{p}_i{\log}_2{p}_i $$](img/458833_2_En_3_Chapter_TeX_Equo.png)


    例如，对于任何确定的事件，如太阳从东方升起，熵为零，`P`=1，且`log(p)`=0。熵越大，意味着系统中的不确定性或随机性越大。


    `信息增益`，即根据该属性划分示例所导致的熵的预期减少量，是这种情况下使用的度量标准。


    具体来说，属性`A`相对于示例集合`S`的信息增益`Gain(S,A)`定义如下：


    ![$$ Gain\left(S,A\right)\equiv Entropy(S)-\sum \limits_{\upsilon \in Values(A)}\frac{\left|{S}_{\upsilon}\right|}{\left|S\right|}
    Entropy\left({S}_{\upsilon}\right) $$](img/458833_2_En_3_Chapter_TeX_Equp.png)


    因此，信息增益更高的属性将在决策树中优先出现。


    ```

    from sklearn.datasets import load_iris

    from sklearn.tree import DecisionTreeClassifier

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = DecisionTreeClassifier()

    model = model.fit(data, labels)

    print(model.predict(data[[10]]))

    ```


    ### 随机森林分类器


    `随机森林分类器`是决策树的一种扩展，该算法创建`N`棵决策树，每棵树随机选择`M`个特征。现在，测试数据将由所有决策树进行分类，并归类到多数决策树输出的目标类别中。


    ```

    from sklearn.datasets import load_iris

    from sklearn.ensemble import RandomForestClassifier

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = RandomForestClassifier()

    model = model.fit(data, labels)

    print(model.predict(data[[10]]))

    ```


    ## 朴素贝叶斯分类器


    `X = (x1, x2, x3, ..., xn)` 是一个`n`维向量。贝叶斯分类器将每个`X`分配到集合`{C1, C2, …, Cm}`中的一个目标类别。这种分配基于`X`属于目标类别`Ci`的概率。也就是说，当且仅当对于所有满足`1
    ≤ j ≤ m`的`j`，有`P(Ci |X) > P(Cj |X)`时，`X`被分配到类别`Ci`。


    ![$$ P\left({C}_i\left|X\right.\right)=\frac{P\left(X\left|{C}_i\right.\right)P\left({C}_i\right)}{P(X)}
    $$](img/458833_2_En_3_Chapter_TeX_Equq.png)


    通常，计算`P(X|Ci)`的计算成本可能很高。如果`X`的每个分量`x[k]`可以取`r`个值之一，那么对于`m`个类别中的每一个，需要考虑`r^n`种组合。为了简化计算，做出了条件类别独立性的假设，这意味着对于每个类别，假设属性是独立的。基于此假设发展而来的分类器被称为朴素贝叶斯分类器。该假设允许你写出以下公式：


    ![$$ P\left(X\left|{C}_i\right.\right)=\vdash \prod \limits_{k=1}^nP\left({x}_k\left|{C}_i\right.\right)
    $$](img/458833_2_En_3_Chapter_TeX_Equr.png)


    以下代码是数值数据朴素贝叶斯分类的一个示例：


    ```

    from sklearn.naïve_bayes import GaussianNB

    from sklearn.datasets import load_iris

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = GaussianNB()

    model = model.fit(data, labels)

    print(model.predict(data[[50]]))

    ```


    注意


    你将在“情感分析”部分看到朴素贝叶斯分类器的另一个示例。


    ## 支持向量机


    如果你查看图 3-3，可以很容易地理解，圆形和方形点在二维空间（`x1`, `x2`）中是线性可分的。但它们在`x1`或`x2`任一维度上都不是线性可分的。支持向量机算法正是基于这一理论。它增加数据的维度，直到点变得线性可分。一旦完成，你需要找到两个平行的超平面来分隔数据。这些平面被称为`间隔`。算法选择间隔的方式是使它们之间的距离最大。这就是为什么它被称为最大间隔。位于这两个间隔中间或与它们等距的平面被称为`最优超平面`，用于对测试数据进行分类（见图
    3-2）。分隔面也可以是非线性的。


    ![](img/458833_2_En_3_Fig3_HTML.png)


    一个 X 下标 2 与 X 下标 1 的关系图。它在最大间隔处有一个负斜率的最优超平面，并且在其上下方有簇。


    图 3-3


    支持向量机


    以下代码是使用 Python 进行支持向量机分类的示例：


    ```

    from sklearn.svm import SVC

    from sklearn.datasets import load_iris

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = SVC()

    model = model.fit(data, labels)

    print(model.predict(data[[50]]))

    ```


    ## 最近邻分类器


    最近邻分类器是一种简单的基于距离的分类器。它计算测试数据与训练数据的距离，并根据目标类别对距离进行分组。与测试实例平均距离最小的目标类别被选为测试数据的类别。这里展示了一个
    Python 示例：


    ```

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.datasets import load_iris

    iris_data = load_iris()

    data, labels = iris_data.data, iris_data.target

    model = KNeighborsClassifier()

    model = model.fit(data, labels)

    print(model.predict(data[[50]]))

    ```

