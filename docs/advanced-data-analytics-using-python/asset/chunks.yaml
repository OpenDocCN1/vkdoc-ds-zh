    The following code creates a hierarchical cluster using Python. The input data
    file can be downloaded from [`https://canvas.uw.edu/courses/1546077/files/92110986`](https://canvas.uw.edu/courses/1546077/files/92110986).


    ```

    import numpy as np

    import pandas as pd

    from sklearn.preprocessing import StandardScaler, normalize

    from sklearn.decomposition import PCA

    import scipy.cluster.hierarchy as hc

    import matplotlib.pyplot as plt

    from sklearn.cluster import AgglomerativeClustering

    # Load the CSV file

    df = pd.read_csv("book\\ch4\\CC_GENERAL.csv")

    # preprocessing

    df = df.drop(''CUST_ID'', axis = 1)

    df.fillna(method =''ffill'', inplace = True)

    # Scale and normalize

    ss = StandardScaler()

    scaled_df = ss.fit_transform(df)

    normalized_df= normalize(scaled_df)

    # Reduce the dimensionality to 3

    pca = PCA(n_components=3)

    df_pca = pca.fit_transform(normalized_df)

    df_pca = pd.DataFrame(df_pca)

    df_pca.columns = [''P1'', ''P2'', ''P3'']

    # Dendogram plot

    plt.figure(figsize =(10, 10))

    plt.title(''Visualising the data'')

    dendrogram = hc.dendrogram((hc.linkage(df_pca, method =''ward'')))

    # create 3 clusters using Agglomerative hierarchical clustering

    hrc= AgglomerativeClustering(n_clusters = 3)

    plt.figure(figsize =(10, 10))

    plt.scatter(df_pca[''P1''], df_pca[''P2''], df_pca[''P3''], c = hrc.fit_predict(df_pca),
    cmap =''rainbow'')

    plt.title("Agglomerative Hierarchical Clusters - Scatter Plot", fontsize=18)

    plt.show()

    ```


    ### Graph Theoretical Approach


    The clustering problem can be mapped to a graph, where every node in the graph
    is an input data point. If the distance between two graphs is less than the threshold,
    then the corresponding nodes are connected. Now using the graph partition algorithm,
    you can cluster the graph. One industry example of clustering is in investment
    banking, where the cluster instruments depend on the correlation of their time
    series of price and performance trading of each cluster taken together. This is
    known as *basket trading* in algorithmic trading. So, by using the similarity
    measure, you can construct the graph where the nodes are instruments and the edges
    between the nodes indicate that the instruments are correlated. To create the
    basket, you need a set of instruments where all are correlated to each other.
    In a graph, this is a set of nodes or subgraphs where all the nodes in the subgraph
    are connected to each other. This kind of subgraph is known as a *clique*. Finding
    the clique of maximum size is an NPcomplete problem. People use heuristic solutions
    to solve this problem of clustering.


    ### How Do You Know If the Clustering Result Is Good?


    After applying the clustering algorithm, verifying the result as good or bad is
    a crucial step in cluster analysis. Three parameters are used to measure the quality
    of cluster, namely, the centroid, radius, and diameter.


    ![$$ \textrm{Centroid}={\textrm{C}}_{\textrm{m}}=\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\textrm{t}}_{mi}}{\textrm{N}}
    $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equt.png)


    ![$$ \textrm{Radius}={\textrm{R}}_{\textrm{m}}=\sqrt{\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\left({\textrm{t}}_{mi}-{\textrm{C}}_{\textrm{m}}\right)}^2}{\textrm{N}}}
    $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equu.png)


    ![$$ \textrm{Diameter}={\textrm{D}}_{\textrm{m}}=\sqrt{\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\sum_{\textrm{j}=1}}^{\textrm{N}}{\left({\textrm{t}}_{mi}-{\textrm{C}}_{\textrm{m}}\right)}^2}{\left(\textrm{N}\right)\left(\textrm{N}-1\right)}}
    $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equv.png)


    If you consider the cluster as a circle in a space surrounding all member points
    in that cluster, then you can take the centroid as the center of the circle. Similarly,
    the radius and diameter of the cluster are the radius and diameter of the circle.
    Any cluster can be represented by using these three parameters. One measure of
    good clustering is that the distance between centers should be greater than the
    sum of radius.


    The following code snippet from the previous script can be used to visualize the
    output where data points from the same cluster should be seen together.


    ```

    # create 3 clusters using Agglomerative hierarchical clustering

    hrc= AgglomerativeClustering(n_clusters = 3)

    plt.figure(figsize =(10, 10))

    plt.scatter(df_pca[''P1''], df_pca[''P2''], df_pca[''P3''], c = hrc.fit_predict(df_pca),
    cmap =''rainbow'')

    plt.title("Agglomerative Hierarchical Clusters - Scatter Plot", fontsize=18)

    plt.show()

    ```


    ## Summary


    Except for these chapters, every other chapter will contain data that we will
    use to label our model train. Then there’s a fresh set of data that doesn’t have
    a label. The model labels the data. This is called *supervised learning*.


    However, there is no data label in this chapter. An algorithm groups or labels
    them based on their similarity. In a non-English-speaking country, children study
    English in school under the supervision of a teacher. However, after watching
    YouTube videos for two to three years, children begin to speak a modest amount
    of English without any instruction. This is called unsupervised learning.'
