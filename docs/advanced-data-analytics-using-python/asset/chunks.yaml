- fmt: "# Analytics in the Cloud\n\nLike many other fields, analytics is being impacted\
    \ by the cloud. It is affected in two ways. Big cloud providers are continuously\
    \ releasing machine learning APIs. So, a developer can easily write a machine\
    \ learning application without worrying about the underlining algorithm. For example,\
    \ Google provides APIs for computer vision, natural language, speech processing,\
    \ and many more. A user can easily write code that can give the sentiment of an\
    \ image of a face or voice in two or three lines of code.\n\nThe second aspect\
    \ of the cloud is in the data engineering part. In Chapter [1](#458833_2_En_1_Chapter.xhtml)\
    \ we gave an example of how to expose a model as a high-performance REST API using\
    \ `Falcon`. Now if a million users are going to use it and if the load varies\
    \ by much, then auto-scale is a required feature of this application. If you deploy\
    \ the application in the Google App Engine or AWS Lambda, you can achieve the\
    \ auto-scale feature in 15 minutes. Once the application is auto-scaled, you need\
    \ to think about the database. `DynamoDB` from Amazon and `Cloud Datastore` by\
    \ Google are auto-scaled databases in the cloud. If you use one of them, your\
    \ application is now high performance and auto-scaled, but people around globe\
    \ will access it, so the geographical distance will create extra latency or a\
    \ negative impact on performance. You also have to make sure that your application\
    \ is always available. Further, you need to deploy your application in three regions:\
    \ Europe, Asia, and the United States (you can choose more regions if your budget\
    \ permits). If you use an elastic load balancer with a geobalancing routing rule,\
    \ which routes the traffic from a region to the app engine of that region, then\
    \ it will be available across the globe. In geobalancing, you can mention a secondary\
    \ app engine for each rule, which makes your application highly available. If\
    \ a primary app engine is down, the secondary app engine will take care of things.\n\
    \nFigure [7-6](#458833_2_En_7_Chapter.xhtml#Fig6) describes this system.\n\n![](images/458833_2_En_7_Chapter/458833_2_En_7_Fig6_HTML.png)\n\
    \nA flowchart lists the elastic load balancer. It has system instances 1, 2, and\
    \ 3 with primary as Asia, U S, and Europe and secondary as U S, Europe, and Asia.\n\
    \nFigure 7-6\n\nThe system\n\nIn Chapter [1](#458833_2_En_1_Chapter.xhtml), I\
    \ showed some example code of publishing a deep learning model as a REST API.\
    \ The following code is the implementation of the same logic in a cloud environment\
    \ where the other storage is replaced by a Google data store:\n\n```\n# Importing\
    \ libraries\nimport falcon\nfrom falcon_cors import CORS\nimport json\nimport\
    \ pygeoip\nimport json\nimport datetime as dt\nimport ipaddress\nimport math\n\
    from concurrent.futures import *\nimport numpy as np\nfrom google.cloud import\
    \ datastore\n# logistic function\ndef logit(x):\nreturn (np.exp(x) / (1 + np.exp(x)))\n\
    def is_visible(client_size, ad_position):\ny=height=0\ntry:\nheight  = int(client_size.split(',')[1])\n\
    y = int(ad_position.split(',')[1])\nexcept:\npass\nif y  .65:\npred, prob = pred_big,\
    \ prob_big\nresp.status = falcon.HTTP_200\nres = math.exp(pred)-1\nif res  0.9:\n\
    prob = 0.9\nif self.big:\nhigh, low, high_big, low_big = thread.result()\nif howbig\
    \ > 0.6:\nhigh = high_big\nlow = low_big\nelse:\nhigh, low = thread.result()\n\
    multiplier = low + (high -low)*prob\nres = multiplier*res\nresp.body = str(res)\n\
    #except Exception,e:\n#     print(str(e))\n#     resp.status = falcon.HTTP_200\n\
    #     resp.body = str(\"0.1\")\ncors = CORS(allow_all_origins=True,allow_all_methods=True,allow_all_headers=True)\n\
    wsgi_app = api = falcon.API(middleware=[cors.middleware])\nf = open('publishers2.list_test')\n\
    for line in f:\nif \"#\" not in line:\nfields = line.strip().split('\\t')\ndomain\
    \ = fields[0].strip()\nbig = (fields[1].strip() == '1')\np = Predictor(domain,\
    \ big)\nurl = '/predict/' + domain\napi.add_route(url, p)\nf.close()\n```\n\n\
    You can deploy this application in the Google App Engine with the following:\n\
    \n```\ngcloud app deploy --prject   --version \n```\n\nThe function’s flow is\
    \ as follows:\n\n1. The ad server requests an impression prediction.\n2. When\
    \ the main thread receives the request predictor, it creates a new thread for\
    \ each feature.\n3. By sending a concurrent request to the data store, each thread\
    \ calculates `is big`, `floor`, `floor big`, `probability`, and `probability big`\
    \ for each feature. It returns 0 if the feature or value is not found in the data\
    \ store.\n4. If `is big` indicates a high-value impression, large scores are used;\
    \ otherwise, general scores are used.\n5. It predicts score = ∑ score for each\
    \ feature.\n6. It calculates the final predicted floor using the multiplier range\
    \ obtained from the data store.\n7. The predicted floor value is returned to the\
    \ ad server in the response.\n\n## Internet of Things\n\nThe IoT is simply the\
    \ network of interconnected devices embedded with sensors, software, network connectivity,\
    \ and necessary electronics that enable them to collect and exchange data, making\
    \ them responsive. The field is emerging with the rise of technology just like\
    \ big data, realtime analytics frameworks, mobile communication, and intelligent\
    \ programmable devices. In the IoT, you can analyze data on the server side using\
    \ the techniques shown throughout the book; you can also put logic on the device\
    \ side using the Raspberry Pi, which is an embedded system version of Python.\n\
    \n### Essential Architectural Patterns for Data Scientists\n\nData is not an isolated\
    \ entity. It must gather data from some application or system, then store it accurately\
    \ in certain storage, and then construct a model on top of that model, which must\
    \ then be provided as an API to connect with other systems. This API must occasionally\
    \ be present throughout the world with a certain latency. So, much engineering\
    \ goes into creating a successful intelligent system, and in today’s startup environment,\
    \ which is a multibillion-dollar industry, an organization cannot afford to hire\
    \ a large number of specialists to create a unique feature in their product. In\
    \ the startup world, the data scientist must be a full-stack analytic expert.\
    \ So, in the following sections, we’ll provide different scenarios with Tom, a\
    \ fictitious character, to illustrate several key architectural patterns that\
    \ any data scientist should be aware of."
