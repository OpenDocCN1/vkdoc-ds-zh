    known as the *forget gate* as its output selects the amount of information of
    the previous cell to be included. The output is a number in [0,1], which is multiplied
    (pointwise) with the previous cell state *c*[{*t* − 1}].


    The network packet is a sequence, so the RNN can readily be applied to an anomaly
    detection system. One difference is that we store data in a cloud database and
    sort it by IP address and ports. This sorting is crucial since without a suitable
    sequence, you will not get a good result. The autocorrelation function, which
    is discussed in Chapter [3](#458833_2_En_3_Chapter.xhtml), can be used to determine
    whether the sequence is correct.


