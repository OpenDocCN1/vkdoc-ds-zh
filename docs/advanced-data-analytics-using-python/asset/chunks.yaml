    在简要介绍了 Python 中的设计模式之后，现在让我们来看看一些对数据科学家至关重要的架构模式。


    ## 选择合适的数据库


    在结束之前，我们将为管理者留下一份关于哪种数据库最适合哪种情况的说明。


    - 当数据结构化程度高且实体间存在清晰严格的关系时，关系型数据库（MySQL、Oracle、SQL Server）是首选。另一方面，当数据非结构化且无组织时，Mongo
    是更好的选择。

    - 当数据包含较长的文本字段，并且您需要在该文本字段的子字符串中执行大量搜索时，Elastic Search 或 Solr 是更好的选择。使用 Elastic
    Search，您可以免费获得名为 Kibana 的数据可视化工具以及名为 Logstash 的 ETL 工具，全栈数据分析解决方案非常流行。

    - 数据有时必须以图形形式表示。在这种情况下，需要使用图数据库。Neo4j 是一种流行的图数据库，它以较低的价格提供了许多实用工具。

    - 我们偶尔需要一个快速的应用程序。在这种情况下，可以使用像 SQLite 这样的内存数据库。但是，SQLite 不支持从远程主机更新数据库。


    您将在第 2 章中了解更多关于数据库的知识。


    ## 总结


    在本章中，我们讨论了数据科学家的基本工程原则，这些原则将在后续各章中分别介绍。问答示例可以帮助您理解如何组织代码。基本规则是不要将所有内容都放入一个类中。将代码划分为多个类别，并在存在父子关系的地方使用它们。然后，您学习了如何使用
    Python 调用其他语言的代码。我们提供了两个调用 R 和 Java 代码的实例。接着，我们展示了如何将模型作为 REST API 暴露，并通过使用并发编程使其性能良好。之后，我们介绍了数据科学家的重要架构模式。


    # 2. 使用 Python 进行 ETL


    每位数据科学专业人士都必须从不同的数据源提取、转换和加载（ETL）数据。在本章中，我们将讨论如何使用 Python 对一系列流行的数据库执行 ETL。对于关系型数据库，我们将介绍
    MySQL。作为文档数据库的示例，我们将介绍 Elasticsearch。对于图数据库，我们将介绍 Neo4j，对于 NoSQL，我们将介绍 MongoDB。我们还将讨论受
    R 语言数据框概念启发的 Pandas 框架。


    ETL 基于一个过程，其中数据从多个来源提取，转换为涉及清洗和丰富化的特定格式，最后加载到目标位置。以下是每个过程的详细信息：


    1. *提取*：在数据提取过程中，从各种来源拉取源数据并将其移动到临时区域，使数据可用于 ETL 过程的后续阶段。之后，数据进入清洗和丰富化阶段，也称为数据清洗。

    2. *转换*：在此阶段，源数据与目标系统的格式进行匹配。这包括更改数据类型、合并字段、拆分字段等步骤。

    3. *加载*：此阶段是 ETL 的最后阶段。在这里，数据以自动化方式加载到数据仓库中，并且可以定期更新。完成后，数据即可用于数据分析。


    上述过程在任何数据分析工作中都至关重要。一旦数据经过 ETL 过程，就可以分析数据、发现见解等。


    我们将在本章中讨论各种类型的 ETL。我们在第 1 章中讨论过，数据不是孤立的事物。我们需要从某个地方加载数据，这个地方就是数据库。我们需要从某个应用程序获取数据，这就是提取。在本章和下一章中，我们将讨论将数据从一种形式转换为另一种形式的各种特征工程。


