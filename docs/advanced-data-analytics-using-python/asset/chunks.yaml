    \ are separated using thresholding to binarize our image\n\nOn line 39, we capture\
    \ the contours of the circles, create our data matrix (which will hold the features\
    \ derived from each of the blobs), and begin looping through each of the individual\
    \ contours on line 46, all from the aforementioned code. We create a mask for\
    \ each contour and extract the average RGB values; we’ll use these three averages\
    \ to describe the circle’s color."
  trans: "\n### 相似度类型\n\n为了衡量相似度，文档被表示为去除停用词后的词项向量。假设 `A` 和 `B` 是代表两个文档的向量。在这种情况下，不同的相似度度量如下所示：\n\
    \n*   **Dice（戴斯系数）**\n\n    Dice 系数由下式表示：\n\n    ![$$ sim\\left(\\textrm{q},{\\\
    textrm{d}}_{\\textrm{j}}\\right)=\\textrm{D}\\left(\\textrm{A},\\textrm{B}\\right)=\\\
    frac{\\left|A\\cap B\\right|}{\\alpha \\left|A\\right|+\\left(1-\\alpha \\right)\\\
    left|B\\right|} $$](img/458833_2_En_4_Chapter_TeX_Equl.png)\n\n    同时，`α` ∈ [0,\
    \ 1]，并令 ![$$ \\alpha =\\frac{1}{2} $$](img/458833_2_En_4_Chapter_TeX_IEq2.png)\n\
    \n*   **Overlap（重叠系数）**\n\n    重叠系数的计算方式如下：\n\n    ![$$ Sim\\left(\\textrm{q},{\\\
    textrm{d}}_{\\textrm{j}}\\right)=\\textrm{O}\\left(\\textrm{A},\\textrm{B}\\right)=\\\
    frac{\\left|A\\cap B\\right|}{\\min \\left(\\left|A\\right|,\\left|B\\right|\\\
    right)} $$](img/458833_2_En_4_Chapter_TeX_Equm.png)\n\n    重叠系数使用 max 运算符而非 min\
    \ 进行计算。\n\n*   **Jaccard（杰卡德系数）**\n\n    杰卡德系数由下式给出：\n\n    ![$$ Sim\\left(\\\
    textrm{q},{\\textrm{d}}_{\\textrm{j}}\\right)=\\textrm{J}\\left(\\textrm{A},\\\
    textrm{B}\\right)=\\frac{\\left|A\\cap B\\right|}{\\left|A\\cup B\\right|\\vdash\
    \ } $$](img/458833_2_En_4_Chapter_TeX_Equn.png)\n\n    杰卡德度量表示相关程度。\n\n*   **Cosine（余弦相似度）**\n\
    \n    两个向量之间夹角的余弦值由下式给出：\n\n    ![$$ Sim\\left(\\textrm{q},{\\textrm{d}}_{\\textrm{j}}\\\
    right)=\\textrm{C}\\left(\\textrm{A},\\textrm{B}\\right)=\\frac{\\left|A\\cap\
    \ B\\right|}{\\sqrt{\\left|A\\right|\\left|B\\right|}} $$](img/458833_2_En_4_Chapter_TeX_Equo.png)\n\
    \n距离和相似度是两个相反的度量。例如，数值数据相关性是一种相似度度量，而欧几里得距离是一种距离度量。通常，相似度度量的值限制在 0 到 1 之间，但距离没有这样的上限。相似度可以为负，但根据定义，距离不能为负。聚类算法几乎与该领域诞生之初时相同，但研究人员正在不断为各种应用寻找新的距离度量。\n\
    \n在下一节中，既然我们已经了解了该技术的基础知识，我们将使用 K-means 算法对图像中的颜色阴影进行聚类。\n\n## 图像中的 K-Means 示例\n\
    \n首先，我们会得到一个包含色块的画布，每个色块是红色、绿色或蓝色的不同色调（图 4-3）。\n\n![](img/458833_2_En_4_Fig3_HTML.png)\n\
    \n一个画布窗口的截图。它绘制了几个不同颜色和大小的点。\n\n图 4-3\n\n一个包含红色、绿色和蓝色色块的画布\n\n目标是根据色块的色调将其分为三类。然后我们将使用\
    \ K-means 将红色、绿色和蓝色的色块分别分组，同时将它们彼此分离。图 4-4 显示了一个示例输出图像，其中红色色块已与所有其他色块分离。\n\n![](img/458833_2_En_4_Fig4_HTML.png)\n\
    \n一个包含多个不同大小彩色点的画布窗口，展示了红色点是如何被分离出来的，并叠加在一个深色窗口上。\n\n图 4-4\n\n将红色色块与绿色和蓝色色块分离\n\
    \n### 准备聚类\n\n第一步是创建一个看起来类似于图 4-2 的图片，以便我们可以按如下方式进行聚类：\n\n```\n# 导入必要的包\nfrom\
    \ sklearn.cluster import KMeans\nimport numpy as np\nimport random\nimport cv2\n\
    import imutils\n# 初始化色调选择列表\nhues = [\n# 红色、绿色和蓝色的色调\n(138, 8, 8), (180, 4, 4),\
    \ (223, 1, 1), (255, 0, 0), (250, 88, 88),\n(8, 138, 8), (4, 180, 4), (1, 223,\
    \ 1), (0, 255, 0), (46, 254, 46),\n(11, 11, 97), (8, 8, 138), (4, 4, 180), (0,\
    \ 0, 255), (46, 46, 254)]\n# 初始化画布\ncanvas = np.ones((400, 600, 3), datatype=\"\
    uint8\") * 255\n# 遍历画布\nfor y in range(0, 400, 20):\nfor x in range(0, 600, 20):\n\
    # 为圆形生成随机的 (x, y) 坐标、半径和色调\n(dx, dy) = np.random.randint(5, 10, size=(2,))\nr\
    \ = np.random.randint(5, 8)\nhue = random.choice(hues)[::-1]\n# 在画布上绘制圆形\ncv2.circle(canvas,\
    \ (x + dx, y + dy), r, hue, -1)\n# 为图像添加边框\ncanvas = cv2.copyMakeBorder(canvas,\
    \ 5, 5, 5, 5, cv2.BORDER_CONSTANT,\nvalue=(255, 255, 255))\n```\n\n前面代码的第 9-13\
    \ 行设置了红色、绿色和蓝色的五种不同颜色。当我们在第 16 行的画布上绘制颜色时，我们将从此列表中随机抽取样本。第 19-28 行处理绘制随机色块的实际过程。我们首先以\
    \ 20 像素的步长遍历整个图像。然后，在第 23 和 24 行，我们为色块中心生成一个随机的 `(x, y)` 坐标（第 23 行），为色块选择一个随机半径（第\
    \ 24 行），并在第 25 行从我们的颜色列表中采样。色调列表是 RGB 顺序；我们将其反转成 BGR 顺序，以便 OpenCV 能够正确绘制。最后，我们使用随机生成的值在画布上绘制一个圆形。图\
    \ 4-2 显示了此代码的输出。\n\n## 阈值处理\n\n现在我们已经有了人工生成的色块图像，我们需要识别每个色块并提取颜色特征来描述它们。以下是一个使用阈值处理的示例：\n\
    \n```\n# 将画布转换为灰度图，进行阈值处理，并检测图像中的轮廓\ngray = cv2.cvtHue(canvas, cv2.HUE_BGR2GRAY)\n\
    gray = cv2.bitwise_not(gray)\nthresh = cv2.threshold(gray, 10, 255, cv2.THRESH_BINARY)[1]\n\
    cnts = cv2.findContours(gray.copy(), cv2.RETR_LIST, cv2.CHAIN_APPROX_SIMPLE)\n\
    cnts = imutils.grab_contours(cnts)\n# 初始化数据矩阵\ndata = []\n# 遍历轮廓\nfor c in cnts:\n\
    # 从轮廓构建掩膜\nmask = np.zeros(canvas.shape[:2], datatype=\"uint8\")\ncv2.drawContours(mask,\
    \ [c], -1, 255, -1)\nfeatures = cv2.mean(canvas, mask=mask)[:3]\ndata.append(features)\n\
    ```\n\n第 36-38 行仅对我们的图像进行阈值处理，得到色块的二值表示，如图 4-5 所示。\n\n![](img/458833_2_En_4_Fig5_HTML.jpg)\n\
    \n一个标记为“thresh”的窗口截图。它有一个深色屏幕，上面重叠着几个不同大小的浅色点。\n\n图 4-5\n\n使用阈值处理将背景和前景分离，以对图像进行二值化\n\
    \n在第 39 行，我们捕获圆形的轮廓，创建我们的数据矩阵（该矩阵将保存从每个色块提取的特征），并从上述代码的第 46 行开始遍历每个单独的轮廓。我们为每个轮廓创建一个掩膜，并提取平均\
    \ RGB 值；我们将使用这三个平均值来描述圆形的颜色。\n"
- fmt: '### Time to Cluster


    Using the scikit-learn implementation of K-means, we can now do the actual clustering.


    ```python

    # cluster the hue features

    clt = KMeans(n_clusters=3)

    clt.fit(data)

    cv2.imshow("Canvas", canvas)

    # loop over the unique cluster identifiers

    for i in np.unique(clt.labels_):

    # construct a mask for the current cluster

    mask = np.zeros(canvas.shape[:2], datatype="uint8")

    # loop over the indexes of the current cluster and sketch them

    for j in np.where(clt.labels_ == i)[0]:

    cv2.sketchContours(mask, [cnts[j]], -1, 255, -1)

    # show the output image for the cluster

    cv2.imshow("Cluster", cv2.bitwise_and(canvas, canvas, mask=mask))

    cv2.waitKey(0)

    ```


    On line 54, we declare our K-means class and set the *n* clusters parameter to
    3 to signify that we want three different clusters—one each for red, green, and
    blue. The `fit` technique is then used to cluster our data matrix.


    We need a mechanism to retrieve the blobs that belong to each cluster now that
    we have our three clusters. As we already have the `cnts` variable holding the
    contours of our blobs, this method is a lot easier than it appears. To complete
    this example, all we need is a smart use of NumPy functions.


    On line 59, we begin by looping through each of the unique cluster labels. Then,
    for each of the clusters, we use the `np.where` function to create a mask and
    collect the indices of all labels that correspond to the current cluster (line
    64). We can utilize the indices to draw just the outlines that correspond to the
    current cluster now that we have them (line 65).


    ### Revealing the Current Cluster


    Finally, we’ll use a bitwise operation to show just blobs that belong to the current
    cluster while concealing all others.


    Simply use the following command to run our script:


    ```bash

    $ python cluster_hues.py

    ```


    Using the K-means method, we can observe that our blobs have been automatically
    sorted into the colors of red, green, and blue. We can see that just the shades
    of red have been segregated in Figure [4-6](#458833_2_En_4_Chapter.xhtml#Fig6).


    ![](images/458833_2_En_4_Chapter/458833_2_En_4_Fig6_HTML.png)


    A canvas window with several colored dots of different sizes illustrates how the
    red colored dots are separated, which overlaps a dark window.


    Figure 4-6


    The red blobs are being separated from the blues and greens


    Only hues of green are depicted in Figure [4-7](#458833_2_En_4_Chapter.xhtml#Fig6).


    ![](images/458833_2_En_4_Chapter/458833_2_En_4_Fig7_HTML.png)


    A canvas window with several colored dots of different sizes illustrates how the
    green colored dots are separated, which overlaps a dark window.


    Figure 4-7


    Only the green circles are being extracted


    Lastly, we obtain just blue hues, as shown in Figure [4-8](#458833_2_En_4_Chapter.xhtml#Fig7).


    ![](images/458833_2_En_4_Chapter/458833_2_En_4_Fig8_HTML.png)


    A canvas window with several colored dots of different sizes illustrates how the
    blue colored dots are separated, which overlaps a dark window.


    Figure 4-8


    Only looking at the “blue blob” cluster


    Now we will discuss another type of clustering algorithm.


    ## Hierarchical Clustering


    Hierarchical clustering is an iterative method of clustering data objects. There
    are two types.


    * Agglomerative hierarchical algorithms, or a bottom-up approach

    * Divisive hierarchical algorithms, or a top-down approach


    ### Bottom-Up Approach


    The bottom-up clustering method is called *agglomerative hierarchical clustering*.
    In this approach, each input object is considered as a separate cluster. In each
    iteration, an algorithm merges the two most similar clusters into only a single
    cluster. The operation is continued until all the clusters merge into a single
    cluster. The complexity of the algorithm is `O(n^3)`.


    In the algorithm, a set of input objects, `I = {I[1], I[2], …, I[n]}`, is given.
    A set of ordered triples is `<D, K, S>`, where `D` is the threshold distance,
    `K` is the number of clusters, and `S` is the set of clusters.


    Some variations of the algorithm might allow multiple clusters with identical
    distances to be merged into a single iteration. The following is the algorithm:


    **Input:** `I = {I[1], I[2], …, I[n]}`


    **Output:** `O`


    ```pseudocode

    for i = 1 to n do

    Ci ← {Ii};

    end for

    D ← 0;

    K ← n;

    S ← {C1, ....., Cn};

    O ← ;

    repeat

    Dist ← CalcultedMinimumDistance(S);

    D ← ∞;

    For i = 1 to K–1 do

    For j = i+1 to K do

    if Dist(i, j) < D then

    D ← Dist(i, j);

    end if

    end for

    end for

    Until K = 1;

    ```


    A Python example of hierarchical clustering is given later in the chapter.


    ### Distance Between Clusters


    In hierarchical clustering, calculating the distance between two clusters is a
    critical step. There are three methods to calculate this.


    * Single linkage method

    * Complete linkage method

    * Average linkage method


    #### Single Linkage Method


    In the single linkage method, the distance between two clusters is the minimum
    distance of all distances between pairs of objects in two clusters. As the distance
    is the minimum, there will be a single pair of objects that has a less than equal
    distance between two clusters. So, the single linkage method may be given as follows:


    ![$$ {\displaystyle \begin{array}{c}\textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\min
    \textrm{dist}\left(\textrm{X},\textrm{Y}\right)\\ {}\textrm{X}\text{\EUR} {\textrm{C}}_{\textrm{i}},\textrm{Y}\text{\EUR}
    {\textrm{C}}_{\textrm{j}}\end{array}} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equp.png)


    #### Complete Linkage Method


    In the complete linkage method, the distance between two clusters is the maximum
    distance of all distances between pairs of objects in two clusters. The distance
    is the maximum, so all pairs of distances are less than or equal to the distance
    between two clusters. So, the complete linkage method can be given by the following:


    ![$$ {\displaystyle \begin{array}{c}\textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\max
    \textrm{dist}\left(\textrm{X},\textrm{Y}\right)\\ {}\textrm{X}\text{\EUR} {\textrm{C}}_{\textrm{i}},\textrm{Y}\text{\EUR}
    {\textrm{C}}_{\textrm{j}}\end{array}} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equq.png)


    #### Average Linkage Method


    The average linkage method is a compromise between the previous two linkage methods.
    It avoids the extremes of large or compact clusters. The distance between clusters
    `C[i]` and `C[j]` is defined by the following:


    ![$$ \textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\frac{\sum_{\textrm{X}\text{\EUR}
    \textrm{Ci}}{\sum}_{\textrm{Y}\text{\EUR} {\textrm{C}}_{\textrm{j}}\vdash}\textrm{dist}\left(\textrm{X},\textrm{Y}\right)}{\left|{\textrm{C}}_{\textrm{i}}\right|\times
    \left|{\textrm{C}}_{\textrm{j}}\right|} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equr.png)


    `|C[k]|` is the number of data objects in cluster `C[k]`.


    The centroid linkage method is similar to the average linkage method, but here
    the distance between the two clusters is actually the distance between the centroids.
    The centroid of cluster `C[i]` is defined as follows:


    ![$$ {\displaystyle \begin{array}{c}{\textrm{X}}_{\textrm{c}}=\vdash \left({\textrm{c}}_1,\dots
    .,{\textrm{c}}_{\textrm{m}}\right),\textrm{with}\\ {}{\textrm{c}}_{\textrm{j}}=1/\textrm{m}\sum
    {\textrm{X}}_{kj},\end{array}} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equs.png)


    `X[kj]` is the j-th dimension of the k-th data object in cluster `C[i]`.'
