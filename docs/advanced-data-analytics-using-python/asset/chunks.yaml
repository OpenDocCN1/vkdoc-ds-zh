    Mutual information (MI) of two random variables is a measure of the mutual dependence
    between the two variables. It is also used as a similarity measure of the distribution
    of two variables. A higher value of mutual information indicates the distribution
    of two variables is similar.


    ![$$ I\left(X;Y\right)=\sum \limits_{x,y}p\left(x,y\right)\log \frac{p\left(x,y\right)}{p(x)p(y)}
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equn.png)


    Suppose a retailer wants to investigate whether a particular city is a deciding
    factor for its sales volume. Then the retailer can see the distribution of sales
    volume across the different cities. If the distribution is the same for all cities,
    then a particular city is not an important factor as far as sales volume is concerned.
    To calculate the difference between the two probability distributions, mutual
    information is applied here.


