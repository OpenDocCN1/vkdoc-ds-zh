    现在，让我们探讨其他重要的架构模式：代理模式和分层模式。


    ### 场景二：代理与分层模式


    汤姆开始在一家新公司工作。由于公司规模很大，没有失业风险。在这种情况下，他不再冒险去收集数据。数据存储在一个 MySQL 服务器上。汤姆之前对数据库一无所知。他热衷于学习
    MySQL。在他的代码中，他编写了大量的查询语句。数据库由另一个团队拥有，他们的经理喜欢研发。所以每周一，汤姆都会接到电话，通知他数据库从 MySQL 换成了
    Mongo，随后又从 Mongo 换成了 SQL Server，这要求他修改整个代码。汤姆不再失业，但他每天午夜才能下班回家。


    似乎所有人都同意解决方案是合理地组织代码。然而，理解代理模式和分层模式会很有帮助。在代理模式中，不要在代码中使用原始的 MySQL 或 Mongo 连接，而是使用一个包装类作为代理。使用分层技术，将代码分成多个层，每一层只使用其下一层的方法。在这种情况下，数据库配置应该在最低层，即核心层完成。其上是数据库工具层，包含数据库查询语句。再往上是业务实体层，它使用数据库查询。下面的
    Python 代码将帮助你更清晰地理解这一点。汤姆现在知道，如果数据库层面有任何变化，他需要检查核心层；如果查询有任何变化，他需要检查数据库工具层；如果业务参与者有任何变化，他需要检查实体层。因此，他的生活现在变得简单了。

