- fmt: '#### Fitting Moving Average Process


    The moving-average (MA) model is a well-known approach for realizing a single-variable
    weekly stationary time series (see Figure [6-3](#458833_2_En_6_Chapter.xhtml#Fig3)).
    The moving-average model specifies that the output variable is linearly dependent
    on its own previous error terms as well as on a stochastic term. The AR model
    is called the *moving-average model*, which is a special case and a key component
    of the ARMA and ARIMA models of time series.


    ![$$ {X}_t={\varepsilon}_t+\sum \limits_{i=1}^p{\varphi}_i{X}_{t-i}+\sum \limits_{i=1}^q{\theta}_i{\varepsilon}_{t-i}+\sum
    \limits_{i=1}^b{\eta}_i{d}_{t-i} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equt.png)


    ![](images/458833_2_En_6_Chapter/458833_2_En_6_Fig3_HTML.jpg)


    A graph of price versus period. It plots 2 increasing trends for the moving average
    of actual and interval at 6. The actual has the highest peak at 9.


    Figure 6-3


    Example of moving average


    Here’s the example code for a moving-average model:


    ```

    Please install numpy by following command:

    pip install numpy

    import numpy as np

    def moving_average(x, w):

    return np.convolve(x, np.ones(w), ''valid'') / w

    data = np.array([10,5,8,9,15,22,26,11,15,16,18,7])

    print(moving_average(data,4))

    ```


    ### Autoregressive Processes


    Suppose `{Z[t]}` is a purely random process with mean 0 and variance `σ[z]²`.
    After that, a process `{X[t]}` is said to be of autoregressive process of order
    `p` if you have this:


    ![$$ {\displaystyle \begin{array}{l}{x}_t={\alpha}_1{x}_{t-1}+\dots {\alpha}_p{x}_{t-p}+{z}_t,
    or\\ {}{x}_t=\sum \limits_{i=1}^p{\alpha}_i{x}_{i-1}+{z}_t\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equu.png)


    The autocovariance function is given by the following:


    ![$$ \gamma (k)=\frac{\alpha^k{\sigma}_z^2}{\left(1-{\alpha}^2\right)},k=0,1,2\dots,
    \textrm{hence} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equv.png)


    ![$$ {\rho}_k=\frac{\gamma (k)}{\gamma (0)}={\alpha}^k $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equw.png)


    Figure [6-4](#458833_2_En_6_Chapter.xhtml#Fig4) shows a time series and its autocorrelation
    plot of the AR model.


    ![](images/458833_2_En_6_Chapter/458833_2_En_6_Fig4_HTML.jpg)


    A simulated graph of time series and AR model. It plots a fluctuating trend with
    multiple crests and troughs.


    Figure 6-4


    A time series and AR model


    ### Estimating Parameters of an AR Process


    A process is called *weakly stationary* if its mean is constant and the autocovariance
    function depends only on time lag. There is no weakly stationary process, but
    it is imposed on time-series data to do some stochastic analysis. Suppose `Z(t)`
    is a weak stationary process with mean 0 and constant variance. Then `X(t)` is
    an autoregressive process of order `p` if you have the following:


    ![$$ {\displaystyle \begin{array}{l}\textrm{X}\left(\textrm{t}\right)=\textrm{a}1\
    \textrm{x}\ \textrm{X}\left(\textrm{t}\hbox{-} 1\right)+\textrm{a}2\ \textrm{x}\
    \textrm{X}\left(\textrm{t}\hbox{-} 2\right)+\dots + ap\ \textrm{x}\ \textrm{X}\left(\textrm{t}\hbox{-}
    \textrm{p}\right)+\textrm{Z}\left(\textrm{t}\right),\textrm{where}\ \textrm{a}\in
    \textrm{R}\ \textrm{a}\textrm{nd}\ \textrm{p}\in \textrm{I}\\ {}\ \textrm{I}\end{array}}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equx.png)


    Now, `E[X(t)]` is the expected value of `X(t)`.


    ![$$ {\displaystyle \begin{array}{c}\textrm{Covariance}\left(\textrm{X}\left(\textrm{t}\right),\textrm{X}\left(\textrm{t}+\textrm{h}\right)\right)=\textrm{E}\left[{\left(\textrm{X}\left(\textrm{t}\right)\hbox{-}
    \textrm{E}\left[\textrm{X}\left(\textrm{t}\right)\right]\right)}^{\ast }\ \left(\textrm{X}\left(\textrm{t}+\textrm{h}\right)\hbox{-}
    \textrm{E}\left[\textrm{X}\left(\textrm{t}+\textrm{h}\right)\right]\right)\right]\\
    {}=\textrm{E}\left[{\left(\textrm{X}\left(\textrm{t}\right)\hbox{-} \textrm{m}\right)}^{\ast
    }\ \left(\textrm{X}\left(\textrm{t}+\textrm{h}\right)\hbox{-} \textrm{m}\right)\right]\end{array}}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equy.png)


    If `X(t)` is a weak stationary process, then:


    ![$$ {\displaystyle \begin{array}{c}\textrm{E}\left[\textrm{X}\left(\textrm{t}\right)\right]=\textrm{E}\left[\textrm{X}\left(\textrm{t}+\textrm{h}\right)\right]=\textrm{m}\
    \left(\textrm{constant}\right)\\ {}=\textrm{E}\left[\textrm{X}{\left(\textrm{t}\right)}^{\ast
    }\ \textrm{X}\left(\textrm{t}+\textrm{h}\right)\right]-{\textrm{m}}^2=\textrm{c}\left(\textrm{h}\right)\end{array}}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equz.png)


    Here, `m` is constant, and `cov[X(t),X(t+h)]` is the function of only `h(c(h))`
    for the weakly stationary process. `c(h)` is known as autocovariance.


    Similarly, the correlation `(X(t),X(t+h) = ρ(h) = r(h) = c(h) = c(0)` is known
    as *autocorrelation*.


    If `X(t)` is a stationary process that is realized as an autoregressive model,
    then:


    ![$$ \textrm{X}\left(\textrm{t}\right)=\textrm{a}{1}^{\ast }\ \textrm{X}\left(\textrm{t}\hbox{-}
    1\right)+\textrm{a}{2}^{\ast }\ \textrm{X}\left(\textrm{t}\hbox{-} 2\right)+\dots
    +{ap}^{\ast }\ \textrm{X}\left(\textrm{t}\hbox{-} \textrm{p}\right)+\textrm{Z}\left(\textrm{t}\right)
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equaa.png)


    `Correlation(X(t),X(t)) = a1 * correlation (X(t),X(t-1)) + …. + ap * correlation
    (X(t),X(t-p))+0`


    As covariance, `(X(t),X(t+h))` is dependent only on `h`, so:


    ![$$ \textrm{r}0=\textrm{a}{1}^{\ast }\ \textrm{r}1+\textrm{a}{2}^{\ast }\ \textrm{r}2+\dots
    +{ap}^{\ast }\ rp $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equab.png)


    ![$$ \textrm{r}1=\textrm{a}{1}^{\ast }\ \textrm{r}0+\textrm{a}{2}^{\ast }\ \textrm{r}1+\dots
    .+{ap}^{\ast }\ \textrm{r}\left(\textrm{p}\hbox{-} 1\right) $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equac.png)


    So, for an `n`-order model, you can easily generate the `n` equation and from
    there find the `n` coefficient by solving the `n` equation system.


    In this case, realize the data sets only in the first-order and second-order autoregressive
    model and choose the model whose mean of residual is less. For that, the reduced
    formulae are as follows:


    *   *First order*: `a1 = r1`

    *   *Second order*: `a1 = r1(1 - r2) / (1 - r1²)`, `a2 = (r2 - r1²) / (1 - r1²)`


    Here is some example code for an autoregressive model:


    ```

    Please download the required CSC file from https://github.com/pratips/book-Advanced-Data-Analytics-Using-Python
    and install the Python libraries using the pip command.

    from pandas import read_csv

    from matplotlib import pyplot

    from statsmodels.tsa.ar_model import AutoReg

    from sklearn.metrics import mean_squared_error

    from math import sqrt

    # load dataset

    series = read_csv(''temperatures.csv'', header=0, index_col=0, parse_dates=True,
    squeeze=True)

    # split dataset

    X = series.values

    train, test = X[1:len(X)-7], X[len(X)-7:]

    # train autoregression

    model = AutoReg(train, lags=29)

    model_fit = model.fit()

    print(''Coefficients: %s'' % model_fit.params)

    # make predictions

    predictions = model_fit.predict(start=len(train), end=len(train)+len(test)-1,
    dynamic=False)

    for i in range(len(predictions)):

    print(''predicted=%f, expected=%f'' % (predictions[i], test[i]))

    rmse = sqrt(mean_squared_error(test, predictions))

    print(''Test RMSE: %.3f'' % rmse)

    # plot results

    pyplot.plot(test)

    pyplot.plot(predictions, color=''red'')

    pyplot.show()

    ```'
