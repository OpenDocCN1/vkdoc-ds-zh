  trans: '

    ### 场景一：烫手山芋反模式


    汤姆受聘为一家在线公司的数据科学家，负责开发实时分析产品。因此，第一步是从其组织的应用程序中收集数据。他们使用云来自动扩展存储，并将数据直接从应用程序推送到数据库。在测试环境中，一切似乎都井然有序。为了确保没有数据丢失，他们使用了
    TCP 连接。然而，当系统上线时，他们没有对主应用程序做任何更改，但它却崩溃了。公司在半小时内遭受了巨大损失，而汤姆也为他实时分析系统的第一步收到了实时反馈：他被解雇了。


    现在的问题是，为什么在没有任何改变的情况下，主应用程序会崩溃。从经典计算机科学的角度来看，这被称为*忙碌消费者问题*。这里，主应用程序是数据的发送方，而数据库是消费者。当消费者忙碌时（这在任何运行大量查询的数据库中都很常见），它很难处理传入的数据。此外，由于
    TCP 连接保证了数据的送达，发送方会重新发送数据，这导致发送方再次负载，而发送方正是主应用程序。这种情况类似于将烫手山芋从一个人传给另一个人，而接收者反复将烫手山芋送回给发送者。这就是为什么它被称为烫手山芋反模式。图
    7-7 直观地解释了这一序列。


    ![](img/458833_2_En_7_Fig7_HTML.png)


    一张图表说明了发送方如何将数据发送给接收方，而接收方又循环地将无法处理的确认信息返回给发送方。


    **图 7-7** 描述烫手山芋反模式的序列图


    这种情况包含两个要素。如果发送方和接收方之间传递的数据不是必需的，我们可以使用 UDP 协议，它会丢弃无法送达的数据。这也是为什么 UDP 被用于所有网络监控协议（如
    SNMP 和 NetFlow）的原因之一。它不需要设备为了监控而负载。然而，如果数据是关键的，例如在金融行业，我们必须在发送方和接收方之间创建一个消息队列。当接收方无法处理数据时，它充当一个缓冲区。如果队列内存已满，数据会丢失，或者负载会转移到发送方。`ZMQ`
    代表“零消息队列”，它本质上不过是一个 UDP 套接字。


    在云平台中，有许多现成的解决方案；我们在第 2 章中深入探讨了它们。以下 Node.js 代码展示了一个收集器的示例，该收集器使用 Rabit-MQ 并将其作为
    REST API 暴露给发送方，并使用 Google Big Query 作为接收方。


    #### 代码：数据收集模块


    ```javascript

    var https = require("https");

    var express = require(''express'');

    var router = express.Router();

    var _ = require(''underscore'');

    var moment = require(''moment-timezone'');

    var RedisSMQ = require(''rsmq'');

    var RSMQWorker = require(''rsmq-worker'');

    var rsmq_h = new RedisSMQ({host: ''127.0.0.1'', port: 6379, ns: ''rsmq''});

    rsmq_h.createQueue({qname: ''hadoopqueue''}, function (err, resp) {

    if (err) {

    console.log(err.message);

    }

    if (resp === 1) {

    console.log(''✔ Message Queue created'');

    }

    });

    var worker_h = new RSMQWorker(''hadoopqueue'');

    worker_h.on(''message'', function(data, next, id) {

    const BigQuery = require(''@google-cloud/bigquery'');

    const bigquery = BigQuery({

    projectId: ''sayantest1979''

    });

    const dataset = bigquery.dataset(''adlog'');

    const table = dataset.table(''day1'');

    rows = JSON.parse(data);

    table.insert(rows)

