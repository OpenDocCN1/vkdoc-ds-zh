- fmt: '### Connection Layer API


    Many classes are responsible for dealing with the Elasticsearch cluster. Here,
    the default subclasses being utilized can be disregarded by handing over parameters
    to the `Elasticsearch` class. Every argument belonging to the client will be added
    onto `Transport`, `ConnectionPool`, and `Connection`.


    As an example, if you want to use your own personal utilization of the `ConnectionSelector`
    class, you just need to pass in the `selector_class` parameter.


    The entire API wraps the raw REST API with a high level of accuracy, which includes
    the differentiation between the required and optional arguments to the calls.
    This implies that the code makes a differentiation between positional and keyword
    arguments; I advise you to use keyword arguments for all calls to be consistent
    and safe. An API call becomes successful (and will return a response) if Elasticsearch
    returns a 2XX response. Otherwise, an instance of `TransportError` (or a more
    specific subclass) will be raised. You can see other exceptions and error states
    in exceptions. If you do not want an exception to be raised, you can always pass
    in an `ignore` parameter with either a single status code that should be ignored
    or a list of them.


    ```

    from elasticsearch import Elasticsearch

    es=Elasticsearch()

    # ignore 400 cause by IndexAlreadyExistsException when creating an index

    es.indices.create(index=''test-index'',ignore=400)

    # ignore 404 and 400

    es.indices.delete(index=''test-index'',ignore=[400,404])

    ```


    ## Neo4j Python Driver


    There are a variety of systems, such as network topology and social networks.
    However, when difficulties are shown as a graph, they are quickly resolved. Neo4j
    is a database that stores data in the form of a graph and executes queries through
    a graphical interface. The Neo4j Python driver is supported by Neo4j and connects
    with the database through the binary protocol. It tries to remain minimalistic
    but at the same time be idiomatic to Python.


    ```

    pip install neo4j-driver

    from neo4j.v1 import GraphDatabase, basic_auth

    driver11 = GraphDatabase.driver("bolt://localhost", auth=basic_auth("neo4j", "neo4j"))

    session11 = driver11.session()

    session11.run("CREATE (a:Person {name:''Sayan'', title:''Mukhopadhyay''})")

    result 11= session11.run("MATCH (a:Person) WHERE a.name = ''Sayan'' RETURN a.name
    AS name, a.title AS title")

    for recordi n resul11t:

    print("%s %s"% (record["title"], record["name"]))

    session.close()

    ```


    ## neo4j-rest-client


    The main objective of `neo4j-rest-client` is to make sure that the Python programmers
    already using Neo4j locally through `python-embedded` are also able to access
    the Neo4j REST server. So, the structure of the `neo4j-rest-client` API is completely
    in sync with `python-embedded`. But, a new structure is brought in so as to arrive
    at a more Pythonic style and to augment the API with the new features being introduced
    by the Neo4j team.


    ## In-Memory Database


    Another important class of databases is an in-memory database. This type stores
    and processes the data in RAM. So, operations on the database are fast, and the
    data is volatile. SQLite is a popular example of an in-memory database. In Python
    you need to use the `sqlalchemy` library to operate on SQLite. In Chapter [1](#458833_2_En_1_Chapter.xhtml)’s
    Flask and Falcon example, I showed you how to select data from SQLite. Here I
    will show how to store a Pandas data frame in SQLite:


    ```

    from sqlalchemy import create_engine

    import sqlite3

    conn = sqlite3.connect(''multiplier.db'')

    conn.execute(''''''CREATE TABLE if not exists multiplier

    (domain        CHAR(50),

    low        REAL,

    high        REAL);'''''')

    conn.close()

    db_name = "your db name ""

    disk_engine = create_engine(db_name)

    df.to_sql(''scores'', disk_engine, if_exists=''replace'')

    ```


    ## MongoDB (Python Edition)


    MongoDB is an open-source *document database* designed for superior performance,
    easy availability, and automatic scaling. MongoDB makes sure that object-relational
    mapping (ORM) is not required to facilitate development. A document that contains
    a data structure made up of field and value pairs is referred to as a *record*
    in MongoDB. These records are akin to JSON objects. The values of fields may be
    comprised of other documents, arrays, and arrays of documents.


    ```

    {

    "_id":ObjectId("01"),

    "address": {

    "street":"Siraj Mondal Lane",

    "pincode":"743145",

    "building":"129",

    "coord": [ -24.97, 48.68 ]

    },

    "borough":"Manhattan",

    ```


    ### Import Data into the Collection


    `mongoimport` can be used to place the documents into a collection in a database,
    within the system shell or a command prompt. If the collection already exists
    in the database, the operation will discard the original collection first.


    ```

    mongoimport --DB test --collection restaurants --drop --file ~/downloads/primer-dataset.json

    ```


    The `mongoimport` command is joined to a MongoDB instance running on localhost
    on port 27017. The `--file` option provides a way to import the data; here it’s
    `~/downloads/primer-dataset.json`.


    To import data into a MongoDB instance running on a different host or port, the
    hostname or port needs to be mentioned specifically in the `mongoimport` command
    by including the `--host` or `--port` option.


    There is a similar `load` command in MySQL.


    ### Create a Connection Using pymongo


    To create a connection, do the following:


    ```

    import MongoClient from pymongo.

    Client11 = MongoClient()

    ```


    If no argument is mentioned to `MongoClient`, then it will default to the MongoDB
    instance running on the localhost interface on port 27017.


    A complete MongoDB URL may be designated to define the connection, which includes
    the host and port number. Let’s take a look at an example.


    First, install Mongo using this command: `yum/apt install mongo`.


    Then, launch MongoDB using this command: `service mongo start`.


    The following code makes a connection to a MongoDB instance that runs on `mongodb0.example.net`
    and port 27017:


    ```

    Client11 = MongoClient("mongodb://myhostname:27017")

    ```


    ### Access Database Objects


    To assign the database named `primer` to the local variable `DB`, you can use
    either of the following lines:


    ```

    Db11 = client11.primer

    db11 = client11[''primer'']

    ```


    Collection objects can be accessed directly by using the dictionary style or the
    attribute access from a database object, as shown in the following two examples:


    ```

    Coll11 = db11.dataset

    coll = db11[''dataset'']

    ```


    ### Insert Data


    You can place a document into a collection that doesn’t exist, and the following
    operation will create the collection:


    ```

    result=db.addrss.insert_one({>)

    ```


    ### Update Data


    Here is how to update data:


    ```

    result=db.address.update_one(

    {"building": "129",

    {"$set": {"address.street": "MG Road"}}

    )

    ```


    ### Remove Data


    To expunge all documents from a collection, use this:


    ```

    result=db.restaurants.delete_many({})

    ```


    ## Cloud Databases


    Even though the cloud has its own chapter, we’d like to provide you with an overview
    of cloud databases, particularly databases for large data. People prefer cloud
    databases when they want their systems to scale automatically. Google Big Query
    is the greatest tool for searching your data. Azure Synapsys has a similar feature;
    however, it is significantly more expensive. You can store data on S3, but if
    you want to run a query, you’ll need Athena, which is expensive. So, in modern
    practice, data is stored as a blob in S3, and everything is done in a Python application.
    If there is an error in data finding, this method takes a long time. Amazon Redish
    can also handle a considerable quantity of large data and comes with a built-in
    BI tool.'
