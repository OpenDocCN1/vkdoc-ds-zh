    data.append(features)\n```\n\nLines 36–38 only threshold our image, resulting\
    \ in a binary representation of the blobs, as shown in Figure [4-5](#458833_2_En_4_Chapter.xhtml#Fig5).\n\
    \n![](images/458833_2_En_4_Chapter/458833_2_En_4_Fig5_HTML.jpg)\n\nA screenshot\
