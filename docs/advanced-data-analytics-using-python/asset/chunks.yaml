    ## ETL with Python (Unstructured Data)


    Dealing with unstructured data is an important task in modern data analysis. In
    this section, I will cover how to parse emails, and I’ll introduce an advanced
    research topic called *topical crawling*.


    ### Email Parsing


    See Chapter [1](#458833_2_En_1_Chapter.xhtml) for a complete example of web crawling
    using Python.


    Like Beautiful Soup, Python has a library for email parsing. The following is
    the example code to parse email data stored on a mail server. The inputs in the
    configuration are the username and number of mails to parse for the user.


    In this code, you have to mention the email user, email folder, and index of the
    mail-in config; code will write from the address to handle the subject and the
    date of the email in the CSV file.


    ```python

    from email.parser import Parser

    import os

    import sys

    conf = open(sys.argv[1])

    config={}

    users={}

    # parsing the config file

    for line in conf:

    if ("," in line):

    fields = line.split(",")

    key = fields[0].strip().split("=")[1].strip()

    val = fields[1].strip().split("=")[1].strip()

    users[key] = val

    else:

    if ("=" in line):

    words = line.strip().split(''='')

    config[words[0].strip()] = words[1].strip()

    conf.close()

    # extracting information from user email

    for usr in users.keys():

    path = config["path"]+"/"+usr+"/"+config["folder"]

    files = os.listdir(path)

    for f in sorted(files):

    if(int(f) > int(users[usr])):

    users[usr] = f

    path1 = path + "/" + f

    data = ""

    with open (path1) as myfile:

    data=myfile.read()

    if data != "" :

    parser = Parser()

    email = parser.parsestr(data)

    out = ""

    out = out + str(email.get(''From'')) + "," + str(email.get(''To'')) + "," + str(email.get(''Subject''))
    + "," + str(email.get(''Date'')).replace(","," ")

    if email.is_multipart():

    for part in email.get_payload():

    out = out + "," + str(part.get_payload()).replace("\n"," ").replace(","," ")

    else:

    out = out + "," + str(email.get_payload()).replace("\n"," ").replace(","," ")

    print out,"\n"

    #updating the output file

    conf = open(sys.argv[1],''w'')

    conf.write("path=" + config["path"] + "\n")

    conf.write("folder=" + config["folder"] + "\n")

    for usr in users.keys():

    conf.write("name="+ usr +",value=" + users[usr] + "\n")

    conf.close()

    ```


    Sample config file for above code.


    ```

    path=/cygdrive/c/share/enron_mail_20110402/enron_mail_20110402/maildir

    folder=Inbox

    name=storey-g,value=142

    name=ybarbo-p,value=775

    name=tycholiz-b,value=602

    ```


    ### Topical Crawling


    Topical crawlers are intelligent crawlers that retrieve information from anywhere
    on the Web. They start with a URL and then find links present in the pages under
    it; then they look at new URLs, bypassing the scalability limitations of universal
    search engines. This is done by distributing the crawling process across users,
    queries, and even client computers. Crawlers can use the context available to
    infinitely loop through the links with a goal of systematically locating a highly
    relevant, focused page.


    Web searching is a complicated task. A large chunk of machine learning work is
    being applied to find the similarity between pages, such as the maximum number
    of URLs fetched or visited.


    #### Crawling Algorithms


    Figure [2-2](#458833_2_En_2_Chapter.xhtml#Fig2) describes how the topical crawling
    algorithm works with its major components.


    ![](images/458833_2_En_2_Chapter/458833_2_En_2_Fig2_HTML.jpg)


    Two diagrams depict how the web page is linked to the F I F O and priority queues
    by the links and link estimator. It lists their respective program.


    Figure 2-2


    Topical crawling described


    The starting URL of a topical crawler is known as the *seed URL*. There is another
    set of URLs known as the *target URLs*, which are examples of desired output.


    Another intriguing application of crawling is for a startup that wants to uncover
    crucial keywords for every IP address. In the HTTP packet header, they acquire
    the user’s browsing history from the Internet service provider. After crawling
    the URL visited by that IP, they classify the words in the text using name-entity
    recognition (Stanford NLP), which is easily implementable by the RNN explained
    in Chapter [5](#458833_2_En_5_Chapter.xhtml). All name entities and their types,
    such as names of people, locations, and organizations, are recommended for the
    user.


    ```python

    import requests

    from bs4 import BeautifulSoup

    import nltk

    from nltk.tokenize import word_tokenize

    from nltk.corpus import stopwords

    from nltk.tag import StanfordNERTagger

    import re

    import json

    import os

    import socket

    import struct

    def ip2int(addr):

    return struct.unpack("!I", socket.inet_aton(addr))[0]

    def int2ip(addr):

    return socket.inet_ntoa(struct.pack("!I", addr))

    java_path = ''/usr/bin/java''

    os.environ[''JAVAHOME''] = java_path

    os.environ[''STANFORD_MODELS''] = ''/home/ec2-user/stanford-ner.jar''

    nltk.internals.config_java(java_path)

    f = open("/home/ec2-user/data.csv")

    res = []

    stop_words = set(stopwords.words(''english''))

    for line in f:

    fields = line.strip().split(",")

    url = fields[1]

    ip = fields[-1]

    print(ip)

    print(url)

    tags_del = None

    if True:

    try:

    ip = ip2int(ip)

    except:

    continue

    print(ip)

    tagged = None

    try:

    code = requests.get(url)

    plain = code.text

    s = BeautifulSoup(plain)

    tags_del = s.get_text()

    if tags_del is None:

    continue

    no_html = re.sub('']*>'', '''', tags_del)

    st = StanfordNERTagger(''/home/ec2-user/english.all.3class.distsim.crf.ser.gz'',

    ''/home/ec2-user/stanford-ner.jar'')

    tokenized = word_tokenize(no_html)

    tagged = st.tag(tokenized)

    except:

    pass

    if tagged is None:

    continue

    for t in tagged:

    t = list(t)

    t[0] = t[0].replace('' '', '''')

    t[-1] = t[-1].replace('' '', '''')

    print(t)

    if t[0] in stop_words:

    continue

    unit = {}

    unit["ip"] = ip

    unit["word"] = t[0]

    unit["name_entity"] = t[-1]

    res.append(unit)

    res_final = {}

    res_final["result"] = res

    #except:

    #   pass

    #except:

    #   pass

    with open(''result.json'', ''w'') as fp:

    json.dump(res, fp)

    ```


    ## Summary


    In this chapter, we discussed different kind of databases and their use cases,
    and we discussed collecting text data from the Web and extracting information
    from different types of unstructured data like email and web pages.'
