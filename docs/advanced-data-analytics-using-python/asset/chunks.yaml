  trans: "\n# 云端分析\n\n与其他许多领域一样，分析领域也正受到云计算的冲击。这种影响体现在两个方面。大型云服务商持续推出机器学习 API，因此开发者无需关注底层算法，就能轻松编写机器学习应用。例如，谷歌提供了计算机视觉、自然语言处理、语音处理等众多\
    \ API。用户只需编写两三行代码，就能分析人脸图像或语音的情感倾向。\n\n云计算的第二个方面体现在数据工程领域。在第 1 章中，我们举例说明了如何使用`Falcon`将模型封装为高性能\
    \ REST API。现在，如果有一百万用户要使用该 API，且负载波动较大，那么自动扩缩容就成为该应用的必备功能。若将应用部署在 Google App Engine\
    \ 或 AWS Lambda 上，只需 15 分钟即可实现自动扩缩容。应用实现自动扩缩容后，就需要考虑数据库问题。亚马逊的`DynamoDB`和谷歌的`Cloud\
    \ Datastore`都是云端自动扩缩容的数据库。使用其中任何一种，你的应用都将具备高性能和自动扩缩容能力。但由于全球用户都会访问，地理距离会造成额外延迟，对性能产生负面影响。你还必须确保应用始终可用。此外，你需要将应用部署在三个区域：欧洲、亚洲和美国（如果预算允许，可以选择更多区域）。如果使用带有地理负载均衡路由规则的弹性负载均衡器，将各区域的流量路由到该区域的\
    \ App Engine，那么应用就能在全球范围内可用。在地理负载均衡中，你可以为每条规则指定一个辅助 App Engine，这能实现应用的高可用性。当主\
    \ App Engine 宕机时，辅助 App Engine 会接管服务。\n\n图 7-6 描述了该系统。\n\n![](img/458833_2_En_7_Fig6_HTML.png)\n\
    \n流程图列出了弹性负载均衡器。它包含系统实例 1、2 和 3，主区域分别为亚洲、美国和欧洲，辅助区域分别为美国、欧洲和亚洲。\n\n图 7-6\n\n系统架构\n\
    \n在第 1 章中，我展示了一些将深度学习模型发布为 REST API 的示例代码。以下代码是在云环境中实现相同逻辑的代码，其中其他存储被替换为谷歌数据存储：\n\
    \n```\n# 导入库\nimport falcon\nfrom falcon_cors import CORS\nimport json\nimport\
    \ pygeoip\nimport json\nimport datetime as dt\nimport ipaddress\nimport math\n\
    from concurrent.futures import *\nimport numpy as np\nfrom google.cloud import\
    \ datastore\n# logistic 函数\ndef logit(x):\nreturn (np.exp(x) / (1 + np.exp(x)))\n\
    def is_visible(client_size, ad_position):\ny=height=0\ntry:\nheight  = int(client_size.split(',')[1])\n\
    y = int(ad_position.split(',')[1])\nexcept:\npass\nif y  .65:\npred, prob = pred_big,\
    \ prob_big\nresp.status = falcon.HTTP_200\nres = math.exp(pred)-1\nif res  0.9:\n\
    prob = 0.9\nif self.big:\nhigh, low, high_big, low_big = thread.result()\nif howbig\
    \ > 0.6:\nhigh = high_big\nlow = low_big\nelse:\nhigh, low = thread.result()\n\
    multiplier = low + (high -low)*prob\nres = multiplier*res\nresp.body = str(res)\n\
    #except Exception,e:\n#     print(str(e))\n#     resp.status = falcon.HTTP_200\n\
    #     resp.body = str(\"0.1\")\ncors = CORS(allow_all_origins=True,allow_all_methods=True,allow_all_headers=True)\n\
    wsgi_app = api = falcon.API(middleware=[cors.middleware])\nf = open('publishers2.list_test')\n\
    for line in f:\nif \"#\" not in line:\nfields = line.strip().split('\\t')\ndomain\
    \ = fields[0].strip()\nbig = (fields[1].strip() == '1')\np = Predictor(domain,\
    \ big)\nurl = '/predict/' + domain\napi.add_route(url, p)\nf.close()\n```\n\n\
    你可以使用以下命令将此应用部署到 Google App Engine：\n\n```\ngcloud app deploy --prject   --version\
    \ \n```\n\n函数的流程如下：\n\n1. 广告服务器请求进行曝光预测。\n2. 当主线程接收到请求预测器时，它会为每个特征创建一个新线程。\n3.\
    \ 每个线程通过向数据存储发送并发请求，计算每个特征的`is big`、`floor`、`floor big`、`probability`和`probability\
    \ big`。如果在数据存储中未找到该特征或值，则返回 0。\n4. 如果`is big`指示为高价值曝光，则使用高分值；否则，使用一般分值。\n5. 预测得分\
    \ = 每个特征的得分之和。\n6. 使用从数据存储获取的乘数范围计算最终的预测底价。\n7. 在响应中将预测的底价值返回给广告服务器。\n\n## 物联网\n\
    \n物联网简单来说就是由嵌入传感器、软件、网络连接和必要电子元件的互联设备组成的网络，这些设备能够收集和交换数据，使其具备响应能力。随着大数据、实时分析框架、移动通信和智能可编程设备等技术的兴起，这一领域正在蓬勃发展。在物联网中，你可以使用本书中介绍的技术在服务器端分析数据；你也可以使用树莓派（一种基于\
    \ Python 的嵌入式系统）在设备端部署逻辑。\n\n### 数据科学家必备的架构模式\n\n数据并非孤立实体。它必须从某个应用或系统收集数据，然后准确地存储在特定的存储中，再在该模型之上构建模型，最后必须将该模型作为\
    \ API 提供，以便与其他系统连接。这个 API 有时需要以一定的延迟在全球范围内提供服务。因此，创建一个成功的智能系统需要大量的工程投入。在当今的初创企业环境中，这是一个价值数十亿美元的行业，一个组织无法负担雇佣大量专家来为其产品创造独特功能。在初创企业世界中，数据科学家必须是全栈分析专家。因此，在接下来的章节中，我们将通过虚构人物汤姆的不同场景，来说明任何数据科学家都应了解的几种关键架构模式。\n"
- fmt: '### Scenario 1: Hot Potato Anti-Pattern


    Tom is employed as a data scientist to work on a real-time analytics product for
    an online company. So, the initial step is to gather data from his organization’s
    application. They use the cloud to auto-scale their storage, and they push data
    straight to the database from the application. In the test environment, everything
    appears to be in order. To ensure that there is no data loss, they use a TCP connection.
    When they go live, though, they do not make any changes to the main application,
    and it crashes. The company faces a massive loss within a half-hour, and Tom gets
    real-time feedback for his first step of the real-time analytic system: he is
    fired.


    The concern now is why the main application crashes when nothing has changed.
    From a classic computer science perspective, this is called a *busy consumer problem*.
    Here the main application is the sender of data, and the database is the consumer.
    When the consumer is busy, which is a common occurrence in any database with a
    large number of queries running in it, it is difficult to handle the incoming
    data. Furthermore, because the TCP connection ensures the delivery data, the sender
    delivers the data again, which causes the sender to be loaded again, and this
    is the main application. The circumstance is analogous to passing a hot potato
    from one person to another, with the recipient returning the hot potato to the
    sender repeatedly. That’s why it is called the Hot Potato anti-pattern. Figure
    [7-7](#458833_2_En_7_Chapter.xhtml#Fig7) explains the sequence visually.


    ![](images/458833_2_En_7_Chapter/458833_2_En_7_Fig7_HTML.png)


    A diagram illustrates how the sender sends the data to the receiver, which in
    turn, gives the unable process acknowledgment to the sender in a loop.


    **Figure 7-7** Sequence diagram describing Hot Potato anti-pattern


    There are two elements to the situation. If the data that passes between the sender
    and the recipient is not required, we can use the UDP protocol, which drops the
    data that is unable to deliver. It’s one of the factors why UDP is used in all
    network monitoring protocols, such as SNMP and NetFlow. It does not require the
    device to be loaded to monitor. However, if the data is essential, such as in
    the financial industry, we must create a messaging queue between the sender and
    the recipient. When the receiver is unable to process data, it functions as a
    buffer. If the queue memory is full, the data is lost, or the load is transferred
    to the sender. `ZMQ` stands for “zero message queues,” and it’s nothing more than
    a UDP socket.


    In cloud platforms, there are numerous readymade solutions; we go through them
    in depth in Chapter [2](#458833_2_En_2_Chapter.xhtml). The following Node.js code
    shows an example of a collector that uses Rabit-MQ and exposes it as a REST API
    to the sender, using Google Big Query as the receiver.


    #### Code: Data Collector Module


    ```javascript

    var https = require("https");

    var express = require(''express'');

    var router = express.Router();

    var _ = require(''underscore'');

    var moment = require(''moment-timezone'');

    var RedisSMQ = require(''rsmq'');

    var RSMQWorker = require(''rsmq-worker'');

    var rsmq_h = new RedisSMQ({host: ''127.0.0.1'', port: 6379, ns: ''rsmq''});

    rsmq_h.createQueue({qname: ''hadoopqueue''}, function (err, resp) {

    if (err) {

    console.log(err.message);

    }

    if (resp === 1) {

    console.log(''✔ Message Queue created'');

    }

    });

    var worker_h = new RSMQWorker(''hadoopqueue'');

    worker_h.on(''message'', function(data, next, id) {

    const BigQuery = require(''@google-cloud/bigquery'');

    const bigquery = BigQuery({

    projectId: ''sayantest1979''

    });

    const dataset = bigquery.dataset(''adlog'');

    const table = dataset.table(''day1'');

    rows = JSON.parse(data);

    table.insert(rows)

    .then((insertErrors) => {

    console.log(''Inserted:'');

    rows.forEach((row) => console.log(row));

    });

    next();

    });

    worker_h.on(''error'', function(err, msg) {

    console.log(''ERROR'', err, msg.id);

    });

    worker_h.start();

    router.post(''/collect'', function(req, res, next) {

    res.setHeader(''Access-Control-Allow-Origin'', ''*'');

    var data = req.body,

    dataArray = [],

    for (k in data) {

    var kv = data[k].split(''|'');

    var dataObj = {};

    for (i=0; i < kv.length; i++) {

    var d = kv[i].split('':'');

    dataObj[d[0]] = decodeURIComponent(d[1]);

    }

    dataObj[''server_time''] = moment().toDate().valueOf();

    dataObj[''ip''] = require(''ipware'')().get_ip(req).clientIp;

    var str = JSON.stringify(dataObj, require(''json-decycle'').decycle());

    dataArray.push(str);

    }

    var dataString = dataArray.join('',\n'');

    dataString = "[ " + dataString + " ]";

    rsmq_h.sendMessage({qname: ''hadoopqueue'', message: dataString + ''\n''}, function
    (err, resp) {

    resp && console.log(''Message sent. ID:'', resp);

    });

    res.end(''OK'');

    });

    module.exports = router;

    ```


    Now, let’s explore other important architectural patterns, proxy and layering.


    ### Scenario 2: Proxy and Layering Patterns


    Tom starts working at a new company. There is no job uncertainty because the company
    is large. He does not take the risk of gathering the data in this case. The data
    is stored on a MySQL server. Tom had no prior knowledge of the database. He was
    passionate about learning MySQL. In his code, he writes lots of queries. The database
    is owned by another team, and their manager likes R&D. So every Monday, Tom receives
    a call informing him that the database has changed from MySQL to Mongo and subsequently
    from Mongo to SQL Server, requiring him to make modifications across the code.
    Tom is no longer unemployed, but he returns home from work every day at midnight.


    Everyone seems to agree that the solution is to properly arrange the code. However,
    understanding the proxy and layering patterns is beneficial. Instead of utilizing
    a raw MySQL or Mongo connection in your code, employ a wrapper class as a proxy
    in the proxy pattern. Using the layering technique, divide your code into many
    layers, each of which uses a method exclusively from the layer below it. Database
    configuration should be done at the lowest levels, or core layer, in this instance.
    Above that is the database utility layer, which includes the database queries.
    Above that, there is a business entity layer that makes use of database queries.
    The following Python code will help you see things more clearly. Tom now knows
    that if there are any changes at the database level, he must investigate the core
    layer; if there are any changes in queries, he must investigate the database utility
    layer; and if there are any changes in business actors, he must investigate the
    entity layer. As a result, his life is now simple.'
