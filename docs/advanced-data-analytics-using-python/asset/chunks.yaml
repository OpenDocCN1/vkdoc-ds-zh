    \ color='red')\npyplot.show()\n```\n\n# 傅里叶变换\n\n非周期信号可以通过一个简单的极限过程用永续指数信号来表示，我将说明非周期信号可以表示为永续指数信号的连续和（积分）。假设你想表示非周期信号`g(t)`。将任何非周期信号视为具有无限时间周期的周期信号，你会得到以下结果：\n\
    \n![$$ g(t)=\\frac{1}{2\\pi}\\int_{-\\infty}^{\\infty }G\\left(\\omega \\right){e}^{j\\\
    omega t} d\\omega $$](img/458833_2_En_6_Chapter_TeX_Equaf.png)\n\n![$$ G\\left(n\\\
    Delta \\omega \\right)=\\underset{T\\to \\infty }{\\lim}\\int_{-{T}_0/2}^{T_0/2}{g}_p(t){e}^{-\
    \ jn\\Delta \\omega t} dt $$](img/458833_2_En_6_Chapter_TeX_Equag.png)\n\n因此：\n\
    \n![$$ G\\left(\\omega \\right)=\\int_{-\\infty}^{\\infty }g(t){e}^{- j\\omega\
    \ t} dt $$](img/458833_2_En_6_Chapter_TeX_Equah.png)\n\n`G(w)`被称为`g(t)`的傅里叶变换。\n\
    \n以下是自协方差与傅里叶变换之间的关系：\n\n![$$ \\gamma (0)={\\sigma}_X²=\\int_0^{\\pi } dF\\left(\\\
