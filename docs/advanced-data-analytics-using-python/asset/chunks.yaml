- fmt: '### Mutual Information


    Mutual information (`MI`) of two random variables is a measure of the mutual dependence
    between the two variables. It is also used as a similarity measure of the distribution
    of two variables. A higher value of mutual information indicates the distribution
    of two variables is similar.


    ![$$ I\left(X;Y\right)=\sum \limits_{x,y}p\left(x,y\right)\log \frac{p\left(x,y\right)}{p(x)p(y)}
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equn.png)


    Suppose a retailer wants to investigate whether a particular city is a deciding
    factor for its sales volume. Then the retailer can see the distribution of sales
    volume across the different cities. If the distribution is the same for all cities,
    then a particular city is not an important factor as far as sales volume is concerned.
    To calculate the difference between the two probability distributions, mutual
    information is applied here.


    Here is the sample Python code to calculate mutual information:


    ```

    from sklearn import metrics

    y_true = [0, 1, 0, 1, 2, 1]

    y_pred = [0, 0, 1, 1, 1, 2]

    print(metrics.mutual_info_score(y_true, y_pred))

    ```


    Let the reader have a complete code with feature engineering. It employs a deep
    learning model. This section covers all aspects of feature engineering.


    Please find the CSV at the following link:


    [`https://github.com/Apress/advanced-data-analytics-python-2e`](https://github.com/Apress/advanced-data-analytics-python-2e)


    ```

    import pandas as pd

    import numpy as np

    from scipy.stats.stats import pearsonr

    from keras.models import Sequential

    from keras.layers import Dense

    #Reading input data

    df = pd.read_csv(''book\\ch3\\fetaure_engineering_data.csv'')

    df_back = pd.read_csv(''book\\ch3\\fetaure_engineering_data.csv'')

    print(df.shape)

    ```


    The following code snippet normalizes the numerical columns:


    ```

    #normalize numeric columns

    mean_map = {}

    std_map = {}

    for col in df.columns:

    if np.issubdtype(df[col].dtype, np.number):

    avg = df[col].mean()

    st_d = df[col].std()

    df[col] = (df[col] - avg)/st_d

    mean_map[str(col)] = avg

    std_map[str(col)] = st_d

    ```


    This part is used to transform the categorical values into numerical values:


    ```

    #convert the categorical columns to numeric and store it

    df_score = pd.DataFrame()

