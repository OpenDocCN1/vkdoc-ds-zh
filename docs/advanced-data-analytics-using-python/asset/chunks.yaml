- fmt: "# Spark\n\nAfter Hadoop, Spark is the next and latest revolution in big data\
    \ technology. The major advantage of Spark is that it gives a unified interface\
    \ to the entire big data stack. Previously, if you needed a SQL–like interface\
    \ for big data, you would use Hive. If you needed real-time data processing, you\
    \ would use Storm. If you wanted to build a machine learning model, you would\
    \ use Mahout. Spark brings all these facilities under one umbrella. In addition,\
    \ it enables in-memory computation of big data, which makes the processing very\
    \ fast. Figure [7-5](#458833_2_En_7_Chapter.xhtml#Fig5) describes all the components\
    \ of Spark.\n\n![](images/458833_2_En_7_Chapter/458833_2_En_7_Fig5_HTML.jpg)\n\
    \nA block diagram lists the components of the spark core as spark SQL structured\
    \ data, spark streaming real-time, MLib machine learning, GraphX, scheduler, YARN,\
    \ and Mesos.\n\n**Figure 7-5** The components of Spark\n\n`Spark Core` is the\
    \ fundamental component of Spark. It can run on top of Hadoop or stand-alone.\
    \ It abstracts the data set as a resilient distributed data set (RDD). RDD is\
    \ a collection of read-only objects. Because it is read-only, there will not be\
    \ any synchronization problems when it is shared with multiple parallel operations.\
    \ Operations on RDD are lazy. There are two types of operations happening on RDD:\
    \ transformation and action. In transformation, there is no execution happening\
    \ on a data set. Spark only stores the sequence of operations as a directed acyclic\
    \ graph called a *lineage*. When an action is called, then the actual execution\
    \ takes place. After the first execution, the result is cached in memory. So,\
    \ when a new execution is called, Spark makes a traversal of the lineage graph\
    \ and makes maximum reuse of the previous computation, and the computation for\
    \ the new operation becomes the minimum. This makes data processing very fast\
    \ and also makes the data fault tolerant. If any node fails, Spark looks at the\
    \ lineage graph for the data in that node and easily reproduces it.\n\nOne limitation\
    \ of the Hadoop framework is that it does not have any message-passing interface\
    \ in parallel computation. But there are several use cases where parallel jobs\
    \ need to talk with each other. Spark achieves this using two kinds of shared\
    \ variable. They are the broadcast variable and the accumulator. When one job\
    \ needs to send a message to all other jobs, the job uses the broadcast variable,\
    \ and when multiple jobs want to aggregate their results to one place, they use\
    \ an accumulator. RDD splits its data set into a unit called a *partition*. Spark\
    \ provides an interface to specify the partition of the data, which is very effective\
    \ for future operations like `join` or `find`. The user can specify the storage\
    \ type of partition in Spark. Spark has a programming interface in Python, Java,\
    \ and Scala. The following code is an example of a word count program in Spark:\n\
    \n```\nval conf = new SparkConf().setAppName(\"wiki_test\") // create a spark\
    \ config object\nval sc = new SparkContext(conf) // Create a spark context\nval\
    \ data = sc.textFile(\"/path/to/somedir\") // Read files from \"somedir\" into\
    \ an RDD of (filename, content) pairs.\nval tokens = data.flatMap(_.split(\" \"\
    )) // Split each file into a list of tokens (words).\nval wordFreq = tokens.map((_,\
    \ 1)).reduceByKey(_ + _) // Add a count of one to each token, then sum the counts\
    \ per word type.\nwordFreq.sortBy(s => -s._2).map(x => (x._2, x._1)).top(10) //\
    \ Get the top 10 words. Swap word and count to sort by count.\n```\n\nOn top of\
    \ `Spark Core`, Spark provides the following:\n\n*   Spark SQL, which is a SQL\
    \ interface through the command line or a database connector interface. It also\
    \ provides a SQL interface for the Spark data frame object.\n*   Spark Streaming,\
    \ which enables you to process streaming data in real time.\n*   MLib, a machine\
    \ learning library to build analytical models on Spark data.\n*   GraphX, a distributed\
    \ graph processing framework.\n\n# PySpark\n\nPySpark is a Python interface for\
    \ Apache Spark. Using simple Python APIs, we can write a Spark application. All\
    \ the major features of Spark, namely, Spark SQL, MLib, and the data frame, are\
    \ supported by PySpark. The following are the installation steps:\n\n1.  First,\
    \ we need Java Runtime Environment (JRE) in order to run Spark. It is recommended\
    \ to install JRE from following link: [`https://adoptium.net/temurin/releases/?version=8`](https://adoptium.net/temurin/releases/%253Fversion%253D8).\
    \ Also, you can install JRE from other distribution.\n\n    The installation will\
    \ automatically create `JAVA_HOME`. If it does not, we need to set `JAVA_HOME`\
    \ as the system variable; the value should be the location of the Java installation\
    \ folder such as `JAVA_HOME=C:\\Program Files\\Eclipse Adoptium\\jdk-8.0.345.1-hotspot\\\
    `.\n\n2.  Then we need to install PySpark using the command `pip install pyspark`.\n\
    \n    For this we need to have Python 3.7 and above installed. After that, we\
    \ need to set `env PYSPARK_PYTHON` as the location of Python. Here’s an example:\
    \ `C:\\Users\\...\\Programs\\Python\\Python39\\python.exe`.\n\n3.  Also, install\
    \ PyArrow by using `pip install pyarrow` to use the Pandas API in PySpark.\n\n\
    Now, we are set to write the code in PySpark. The CSV file is the same as the\
    \ one we used earlier.\n\n```\nfrom pyspark.sql import SparkSession\nfrom datetime\
    \ import datetime, date\nimport pandas as pd\nfrom pyspark.sql import Row\nimport\
    \ pyspark.pandas as ps\nimport numpy as np\n# this is create Spark session\nspark\
    \ = SparkSession.builder.getOrCreate()\nprint(spark)\n# Create series\ns = ps.Series([11,\
    \ np.nan, 51, 16, 82])\nprint(s)\n# Create data frame\npandas_df = pd.DataFrame({\n\
    'C1': [11, 22, 31],\n'C2': [12., 13., 14.],\n'C3': ['text1', 'text2', 'text3'],\n\
    'C4': [date(2010, 1, 1), date(2011, 2, 1), date (2012, 3, 1)]\n})\ndf = spark.createDataFrame(pandas_df)\n\
    df.show()\ndf.printSchema()\n#Read csv in using Spark\ndf = spark.read.csv ('book\\\
    \\ch4\\\\CC_GENERAL.csv', header=True)\ndf.show()\npsdf = df.pandas_api()\nprint(psdf.describe())\n\
    ```"
