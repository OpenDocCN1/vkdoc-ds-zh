    ### 主成分分析


    从理论上讲，相关性对于具有高斯分布（即独立变量）的变量效果良好。对于其他情况，则必须使用主成分分析。假设你想降低 *N* 个变量：`X1`、`X2`、...
    `Xn` 的维度。让我们构建一个 *N*×*N* 维的矩阵，其中第 i 列代表观测值 `Xi`，并假设所有变量都有 *N* 个观测值。现在，如果 *k* 个变量是冗余的，为简单起见，假设这
    *k* 列相同或互为线性组合。那么该矩阵的秩将为 *N*-*k*。因此，该矩阵的秩是衡量独立变量数量的指标，而特征值则表示该变量的强度。这一概念被用于主成分分析和因子分析。为了使矩阵成为方阵，我们选择协方差矩阵。奇异值分解用于求解特征值。


    设 *Y* 为大小为 *p*×*q* 的输入矩阵，其中 *p* 是数据行数，*q* 是参数数量。


    那么 *q*×*q* 的协方差矩阵 `Co` 由下式给出：


    ![$$ \textbf{Co}=\textbf{YTY}/\left(\textbf{q}-\textbf{1}\right) $$](img/458833_2_En_3_Chapter_TeX_Equd.png)


    这是一个对称矩阵，因此可以按如下方式对角化：


    ![$$ \textbf{Co}={\textbf{UDU}}^{\textbf{T}} $$](img/458833_2_En_3_Chapter_TeX_Eque.png)


    `U` 的每一列都是一个特征向量，`D` 是一个对角矩阵，其对角线上的特征值 λi 按降序排列。这些特征向量被称为数据的*主轴*或*主方向*。数据在主轴上的投影称为主成分，也被称为
    *PC 得分*；这些可以被视为新的、变换后的变量。第 j 个主成分由 `YU` 的第 j 列给出。新 PC 空间中第 i 个数据点的坐标由 `YU` 的第
    i 行给出。


    以下代码是使用 Python 进行 PCA 的示例。输入数据文件可从以下链接下载：


    [`https://canvas.uw.edu/courses/1546077/files/92110986`](https://canvas.uw.edu/courses/1546077/files/92110986)


    ```

    import pandas as pd

    from sklearn.preprocessing import StandardScaler, normalize

    from sklearn.decomposition import PCA

    # 加载 CSV 文件

    df = pd.read_csv("book\\ch4\\CC_GENERAL.csv")

    # 预处理

    df = df.drop(''CUST_ID'', axis = 1)

    df.fillna(method =''ffill'', inplace = True)

    # 缩放和归一化

    ss = StandardScaler()

    scaled_df = ss.fit_transform(df)

    normalized_df= normalize(scaled_df)

    # 将维度降至 3

    pca = PCA(n_components=3)

    df_pca = pca.fit_transform(normalized_df)

    df_pca = pd.DataFrame(df_pca)

    df_pca.columns = [''P1'', ''P2'', ''P3'']

    ```


    如果向 `PCA` 构造函数提供一个整数，则会检查主成分的数量；如果传递一个小数，则会考虑在成分内保留的变异比例。更多信息请参见第 5 章。主成分或特征向量的物理意义在以下示例中进行了说明。


    **示例：** 弹性膜的拉伸


    在边界圆为 ![$$ {x}_1²+{x}_2²=1 $$](img/458833_2_En_3_Chapter_TeX_IEq1.png) 的 *x*[1]*x*[2]
    平面中，一张弹性膜被拉伸，使得点 *P*(*x*[1], *x*[2]) 移动到点 *Q*(*y*[1], *y*[2])，如下所示：


    ![$$ \left[y\right]=\left[\begin{array}{c}{y}_1\\ {}{y}_2\end{array}\right]=\left[\begin{array}{cc}5&amp;
    3\\ {}3&amp; 5\end{array}\right]\left[\begin{array}{c}{x}_1\\ {}{x}_2\end{array}\right]=\left[A\right]\left[x\right]
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equf.png)


    需要找到主方向，即点 P 仅径向延伸至点 Q 的方向。这意味着需要一些特定的向量 `[x]` 和 `[y]`，使得：


    ![$$ \left[y\right]=\left[A\right]\left[x\right]=\lambda \left[x\right] $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equg.png)


    以下是给出特征值的特征方程：


    ![$$ \left|\left[A\right]-\lambda \left[I\right]\right|=0 $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equh.png)


    ![$$ \left|\begin{array}{cc}5-\lambda &amp; 3\\ {}3&amp; 5-\lambda \end{array}\right|=0
    $$](img/458833_2_En_3_Chapter_TeX_Equi.png)


    ![$$ {\left(5-\lambda \right)}²-9=0 $$](img/458833_2_En_3_Chapter_TeX_Equj.png)


    ![$$ \left(\lambda -8\right)\left(\lambda -2\right)=0 $$](img/458833_2_En_3_Chapter_TeX_Equk.png)


    因此，λ = 8 或 2。当 *λ*[1] = 8 时，`[[A] − 8[I]][x][1] = 0`。


    第一个特征向量为：


    ![$$ {\left[x\right]}_1={\left[\begin{array}{c}{x}_1\\ {}{x}_2\end{array}\right]}_1=\left[\begin{array}{c}1\\
    {}1\end{array}\right] $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equl.png)


    这意味着 *x*[1] = *x*[2]。当 *λ*[2] = 2 时，`[[A] − 2[I]][x][2] = 0`。


    第二个特征向量为：


    ![$$ {\left[x\right]}_2={\left[\begin{array}{c}{x}_1\\ {}{x}_2\end{array}\right]}_2=\left[\begin{array}{c}1\\
    {}-1\end{array}\right] $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equm.png)


    这意味着 *x*[1] = −*x*[2]。根据特征值，该膜在主方向上分别被拉伸了 8 倍和 2 倍。拉伸后，圆形膜的边界变为椭圆形，其长轴和短轴位于特征向量方向上，如图
    3-1 所示。


    ![](img/458833_2_En_3_Fig1_HTML.png)


    一个以 x 下标 2 和 x 下标 1 为坐标轴的笛卡尔平面中有一个灰度椭圆体。其中心有一个深色正方形，并带有拉伸和未拉伸的边界。


    图 3-1


    拉伸膜的主成分

