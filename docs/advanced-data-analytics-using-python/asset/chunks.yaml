    # 3. 特征工程与监督学习


    监督学习，也称为监督式机器学习，是机器学习和人工智能的一个子类别，它将帮助我们利用模型解决各种现实世界的问题。在本章中，我们将介绍监督式机器学习的以下三个基本组成部分（聚类将在后续关于无监督学习的章节中介绍），以及对于为模型获取准确信息至关重要的特征工程：


    -   *降维* 讲述如何从一组特征中选择最重要的特征。

    -   *分类* 讲述如何借助给定的训练/示例数据集将数据归类到一组目标类别中。

    -   *回归* 讲述如何将一个变量表示为一组自变量的线性或非线性多项式。


    这些内容是构建任何预测模型的基础模块。


    ## 使用 Python 进行降维


    降维是数据分析的一个重要方面。数值数据和分类数据都需要它。调查或因子分析是降维最流行的应用之一。例如，假设一个组织想要找出哪些因素对影响或改变其运营最为重要。它收集组织内不同员工的意见，并基于这些调查数据进行因子分析，最终得出一组较少的因素。


    在投资银行业务中，不同的指数是作为工具的加权平均值来计算的。因此，当指数上涨时，可以预期指数中权重为正的工具也会上涨，而权重为负的工具则会下跌。交易员据此进行交易。通常，指数由大量工具（超过十个）组成。在高频算法交易中，要在几分之一秒内发送如此多的订单是很困难的。通过使用主成分分析，交易员可以将指数实现为一组较少的工具来开始交易。奇异值分解是一种流行的算法，既用于主成分分析，也用于因子分析。在本章中，我将详细讨论它。分类数据也需要降维。假设一个零售商想知道某个城市是否是销售额的重要贡献者；这可以通过使用互信息来衡量，本章也将涵盖这一点。在此之前，我将介绍皮尔逊相关性，它使用简单。这就是为什么它是一种流行的特征工程方法，更准确地说，是特征选择方法。


    ### 相关性分析


    相关性有不同的度量方法。我将只讨论皮尔逊相关性。对于两个变量 `x` 和 `y`，皮尔逊相关性如下所示：


    ![$$ r=\frac{\sum \limits_i\left({x}_i-\overline{x}\right)\left({y}_i-\overline{y}\right)}{\sqrt{\sum
    \limits_i{\left({x}_i-\overline{x}\right)}²}\sqrt{\sum \limits_i{\left({y}_i-\overline{y}\right)}²}}
    $$](img/458833_2_En_3_Chapter_TeX_Equa.png)


    `r` 的值将在 -1 到 +1 之间变化。该公式清楚地表明，当 `x` 大于其平均值时，`y` 也更大，因此 `r` 值更大。换句话说，如果 `x` 增加，那么
    `y` 也增加，那么 `r` 就更大。所以，如果 `r` 接近 1，意味着 `x` 和 `y` 正相关。类似地，如果 `r` 接近 -1，意味着 `x` 和
    `y` 负相关。同样，如果 `r` 接近 0，意味着 `x` 和 `y` 不相关。这里展示了一个计算 `r` 的简化公式：


    ![$$ \textrm{r}=\frac{\textrm{n}\left(\sum xy\right)-\left(\sum \textrm{x}\right)\left(\sum
    \textrm{y}\right)}{\sqrt{\left[\textrm{n}\sum {\textrm{x}}²-{\left(\sum \textrm{x}\right)}²\right]}\left[\textrm{n}\sum
    {\textrm{y}}²-{\left(\sum \textrm{y}\right)}²\right]} $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equb.png)


    你可以轻松地使用相关性进行特征选择或剔除相似特征。假设 `Y` 是一个变量，它是 `n` 个变量 `X1, X2, ... Xn` 的加权和。你想将这组 `X`
    缩减为一组更少的变量。为此，你需要计算每个 `X` 对之间的相关系数。现在，如果 `Xi` 和 `Xj` 高度相关，那么你将研究 `Y` 与 `Xi` 和
    `Xj` 的相关性。如果 `Xi` 的相关性大于 `Xj`，那么你就从集合中移除 `Xj`，反之亦然。以下是查找两个变量之间相关性的代码：


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    x = np.array([-4, -1, 0, 1, 3])

    y = np.array([4, 1, -2, 1, 2])

    corrcoef = np.corrcoef(x, y)

    print(corrcoef)

    ```


    在输出中，对角线上的 1 表示与自身的相关性，例如，`x` 与 `x`，`y` 与 `y`。


    现在的问题是，之前所说的 `X` 和 `Y` 相关的阈值应该是多少？常见的做法是假设如果 `r` > 0.5，则表示变量相关；如果 `r` < 0.5，则表示不相关。这种方法的一个很大局限性是它没有考虑数据的长度。例如，一组
    20 个数据点中的 0.5 相关性，不应与一组 10,000 个数据点中的 0.5 相关性具有相同的权重。为了克服这个问题，引入了概差概念，如下所示：


    ![$$ \textrm{PEr}=.674\times \frac{1-{r}²}{\sqrt{n}} $$](img/458833_2_En_3_Chapter_TeX_Equc.png)


    `r` 是相关系数，`n` 是样本量。


    这里，`r` > 6PEr 意味着 `X` 和 `Y` 高度相关；如果 `r` < PEr，则意味着 `X` 和 `Y` 相互独立。使用这种方法，你可以看到，当数据量巨大时，即使
    `r` = 0.1 也意味着高度相关。


    相关性在电子商务网站的产品推荐中有一个有趣的应用。如果你计算用户对相同产品的共同评分之间的相关性，推荐系统可以识别出相似的用户。类似地，你也可以通过计算同一用户对产品的共同评分之间的相关性来找到相似的产品。这种方法被称为*协同过滤*。

    '
- fmt: '### Principal Component Analysis


    Theoretically correlation works well for variables with Gaussian distribution,
    in other words, independent variables. For other scenarios, you have to use principal
    component analysis. Suppose you want to reduce the dimension of *N* variables:
    `X1`, `X2`, ... `Xn`. Let’s form a matrix of *N*×*N* dimension where the i-th
    column represents the observation `Xi`, assuming all variables have *N* number
    of observations. Now if *k* variables are redundant, for simplicity you assume
    *k* columns are the same or linear combination of each other. Then the rank of
    the matrix will be *N*-*k*. So, the rank of this matrix is a measure of the number
    of independent variables, and the eigenvalue indicates the strength of that variable.
    This concept is used in principal component analysis and factor analysis. To make
    the matrix square, a covariance matrix is chosen. Singular value decomposition
    is used to find the eigenvalue.


    Let *Y* be the input matrix of size *p*×*q*, where *p* is the number of data rows
    and *q* is the number of parameters.


    Then the *q*×*q* covariance matrix `Co` is given by the following:


    ![$$ \textbf{Co}=\textbf{YTY}/\left(\textbf{q}-\textbf{1}\right) $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equd.png)


    It is a symmetric matrix, so it can be diagonalized as follows:


    ![$$ \textbf{Co}={\textbf{UDU}}^{\textbf{T}} $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Eque.png)


    Each column of `U` is an eigenvector, and `D` is a diagonal matrix with eigenvalues
    λi in decreasing order on the diagonal. The eigenvectors are referred to as *principal
    axes* or *principal directions* of the data. Projections of the data on the principal
    axes called principal components are also known as *PC scores*; these can be seen
    as new, transformed variables. The j-th principal component is given by the j-th
    column of `YU`. The coordinates of the i-th data point in the new PC space are
    given by the i-th row of `YU`.


    The following code is an example of PCA using Python. The input data file can
    be downloaded from the following link:


    [`https://canvas.uw.edu/courses/1546077/files/92110986`](https://canvas.uw.edu/courses/1546077/files/92110986)


    ```

    import pandas as pd

    from sklearn.preprocessing import StandardScaler, normalize

    from sklearn.decomposition import PCA

    # Load the CSV file

    df = pd.read_csv("book\\ch4\\CC_GENERAL.csv")

    # preprocessing

    df = df.drop(''CUST_ID'', axis = 1)

    df.fillna(method =''ffill'', inplace = True)

    # Scale and normalize

    ss = StandardScaler()

    scaled_df = ss.fit_transform(df)

    normalized_df= normalize(scaled_df)

    # Reduce the dimensionality to 3

    pca = PCA(n_components=3)

    df_pca = pca.fit_transform(normalized_df)

    df_pca = pd.DataFrame(df_pca)

    df_pca.columns = [''P1'', ''P2'', ''P3'']

    ```


    If an integer is supplied to the `PCA` constructor, the number of principle components
    is examined, and if a decimal is passed, the proportion of variation to keep within
    components is considered. More on this can be found in Chapter [5](#458833_2_En_5_Chapter.xhtml).
    The physical significance of the principal component or eigenvector is demonstrated
    in the following example.


    **Example:** Stretching of an elastic membrane


    In the *x*[1]*x*[2] plane with boundary circle ![$$ {x}_1^2+{x}_2^2=1 $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_IEq1.png)
    an elastic membrane is stretched such that the point *P*(*x*[1], *x*[2]) passes
    to the point *Q*(*y*[1], *y*[2]) shown by


    ![$$ \left[y\right]=\left[\begin{array}{c}{y}_1\\ {}{y}_2\end{array}\right]=\left[\begin{array}{cc}5&amp;
    3\\ {}3&amp; 5\end{array}\right]\left[\begin{array}{c}{x}_1\\ {}{x}_2\end{array}\right]=\left[A\right]\left[x\right]
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equf.png)


    The principal directions, which is the direction in which points P are extended
    radially only to points Q, are to be found. This means that some specific vectors
    `[x]` and `[y]` are needed so that


    ![$$ \left[y\right]=\left[A\right]\left[x\right]=\lambda \left[x\right] $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equg.png)


    The following is a characteristic equation that gives the eigenvalues:


    ![$$ \left|\left[A\right]-\lambda \left[I\right]\right|=0 $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equh.png)


    ![$$ \left|\begin{array}{cc}5-\lambda &amp; 3\\ {}3&amp; 5-\lambda \end{array}\right|=0
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equi.png)


    ![$$ {\left(5-\lambda \right)}^2-9=0 $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equj.png)


    ![$$ \left(\lambda -8\right)\left(\lambda -2\right)=0 $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equk.png)


    Therefore, λ = 8 or 2. When *λ*[1] = 8, `[[A] − 8[I]][x][1] = 0`.


    The first eigenvector is


    ![$$ {\left[x\right]}_1={\left[\begin{array}{c}{x}_1\\ {}{x}_2\end{array}\right]}_1=\left[\begin{array}{c}1\\
    {}1\end{array}\right] $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equl.png)


    which means that *x*[1] = *x*[2]. When *λ*[2] = 2, `[[A] − 2[I]][x][2] = 0`.


    The second eigenvector is


    ![$$ {\left[x\right]}_2={\left[\begin{array}{c}{x}_1\\ {}{x}_2\end{array}\right]}_2=\left[\begin{array}{c}1\\
    {}-1\end{array}\right] $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equm.png)


    This means that *x*[1] = −*x*[2]. The membrane is stretched by a factor of 8 and
    2 in the principal directions, according to the eigenvalues. The boundary of the
    circular membrane becomes elliptical after stretching, with major and minor axes
    in eigenvector directions, as shown in Figure [3-1](#458833_2_En_3_Chapter.xhtml#Fig1).


    ![](images/458833_2_En_3_Chapter/458833_2_En_3_Fig1_HTML.png)


    A cartesian plain of x subscript 2 and x subscript 1 has a greyscale ellipsoid.
    A dark square is at its center with stretched and unstretched boundaries.


    Figure 3-1


    Principle components of the stretched membrane'
