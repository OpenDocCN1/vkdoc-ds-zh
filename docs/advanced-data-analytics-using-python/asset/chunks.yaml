- fmt: '# 3. Feature Engineering and Supervised Learning


    Supervised learning, also known as supervised machine learning, is a subcategory
    of machine learning and artificial intelligence that will help us solve a variety
    of real-world problems with our model. In this chapter, we will introduce the
    following three essential components of supervised machine learning (clustering
    is covered in the following chapter on unsupervised learning), along with feature
    engineering, which is essential to get accurate information for the model:


    - *Dimensionality reduction* tells how to choose the most important features from
    a set of features.

    - *Classification* tells how to categorize data to a set of target categories
    with the help of a given training/example data set.

    - *Regression* tells how to realize a variable as a linear or nonlinear polynomial
    of a set of independent variables.


    These contents are building blocks to build any predictive model.


    ## Dimensionality Reduction with Python


    Dimensionality reduction is an important aspect of data analysis. It is required
    for both numerical and categorical data. Survey or factor analysis is one of the
    most popular applications of dimensionality reduction. As an example, suppose
    that an organization wants to find out which factors are most important in influencing
    or bringing about changes in its operations. It takes opinions from different
    employees in the organization and, based on this survey data, does a factor analysis
    to derive a smaller set of factors in conclusion.


    In investment banking, different indices are calculated as a weighted average
    of instruments. Thus, when an index goes high, it is expected that instruments
    in the index with a positive weight will also go high and those with a negative
    weight will go low. The trader trades accordingly. Generally, indices consist
    of a large number of instruments (more than ten). In high-frequency algorithmic
    trading, it is tough to send so many orders in a fraction of a second. Using principal
    component analysis, traders realize the index as a smaller set of instruments
    to commence with the trading. Singular value decomposition is a popular algorithm
    that is used both in principal component analysis and in factor analysis. In this
    chapter, I will discuss it in detail. Dimensionality reduction is also required
    for categorical data. Suppose a retailer wants to know whether a city is an important
    contributor to sales volume; this can be measured by using mutual information,
    which will also be covered in this chapter. Before that, I will cover the Pearson
    correlation, which is simple to use. That’s why it is a popular method of feature
    engineering, more precisely, as feature selection.


    ### Correlation Analysis


    There are different measures of correlation. I will limit this discussion to the
    Pearson correlation only. For two variables, `x` and `y`, the Pearson correlation
    is as follows:


    ![$$ r=\frac{\sum \limits_i\left({x}_i-\overline{x}\right)\left({y}_i-\overline{y}\right)}{\sqrt{\sum
    \limits_i{\left({x}_i-\overline{x}\right)}^2}\sqrt{\sum \limits_i{\left({y}_i-\overline{y}\right)}^2}}
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equa.png)


    The value of `r` will vary from -1 to +1. The formula clearly shows that when
    `x` is greater than its average, then `y` is also greater, and therefore the `r`
    value is bigger. In other words, if `x` increases, then `y` increases, and then
    `r` is greater. So, if `r` is nearer to 1, it means that `x` and `y` are positively
    correlated. Similarly, if `r` is nearer to -1, it means that `x` and `y` are negatively
    correlated. Likewise, if `r` is nearer to 0, it means that `x` and `y` are not
    correlated. A simplified formula to calculate `r` is shown here:


    ![$$ \textrm{r}=\frac{\textrm{n}\left(\sum xy\right)-\left(\sum \textrm{x}\right)\left(\sum
    \textrm{y}\right)}{\sqrt{\left[\textrm{n}\sum {\textrm{x}}^2-{\left(\sum \textrm{x}\right)}^2\right]}\left[\textrm{n}\sum
    {\textrm{y}}^2-{\left(\sum \textrm{y}\right)}^2\right]} $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equb.png)


    You can easily use correlation for feature selection or discard similar features.
    Let’s say `Y` is a variable that is a weighted sum of `n` variables: `X1, X2,
    ... Xn`. You want to reduce this set of `X` to a smaller set. To do so, you need
    to calculate the correlation coefficient for each `X` pair. Now, if `Xi` and `Xj`
    are highly correlated, then you will investigate the correlation of `Y` with `Xi`
    and `Xj`. If the correlation of `Xi` is greater than `Xj`, then you remove `Xj`
    from the set, and vice versa. The following is the code for finding the correlation
    between two variables:


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    x = np.array([-4, -1, 0, 1, 3])

    y = np.array([4, 1, -2, 1, 2])

    corrcoef = np.corrcoef(x, y)

    print(corrcoef)

    ```


    In the output, the 1s in diagonal are representing the correlation with itself,
    e.g., `x` with `x` and `y` with `y`.


    Now, the question is, what should be the threshold value of the previous correlation
    that, say, `X` and `Y` are correlated? A common practice is to assume that if
    `r` > 0.5, it means the variables are correlated, and if `r` < 0.5, then it means
    no correlation. One big limitation of this approach is that it does not consider
    the length of the data. For example, a 0.5 correlation in a set of 20 data points
    should not have the same weight as a 0.5 correlation in a set of 10,000 data points.
    To overcome this problem, a probable error concept has been introduced, as shown
    here:


    ![$$ \textrm{PEr}=.674\times \frac{1-{r}^2}{\sqrt{n}} $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equc.png)


    `r` is the correlation coefficient, and `n` is the sample size.


    Here, `r` > 6PEr means that `X` and `Y` are highly correlated, and if `r` < PEr,
    this means that `X` and `Y` are independent. Using this approach, you can see
    that even `r` = 0.1 means a high correlation when the data size is huge.


    One interesting application of correlation is in product recommendations on an
    e-commerce site. Recommendations can identify similar users if you calculate the
    correlation of their common ratings for the same products. Similarly, you can
    find similar products by calculating the correlation of their common ratings from
    the same user. This approach is known as *collaborative filtering*.'
