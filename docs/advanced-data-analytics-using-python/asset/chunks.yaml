- fmt: '# K-Means Clustering


    Let’s suppose that a retail distributer has an online system where local agents
    enter trading information manually. One of the fields they have to fill in is
    City. But because this data entry process is manual, people normally tend to make
    lots of spelling errors. For example, instead of Delhi, people enter `Dehi`, `Dehli`,
    `Delly`, and so on. You can try to solve this problem using clustering because
    the number of clusters is already known; in other words, the retailer is aware
    of how many cities the agents operate in. This is an example of *K-means clustering*.


    The K-means algorithm has two inputs. The first one is the data `X`, which is
    a set of `N` number of vectors, and the second one is `K`, which represents the
    number of clusters that need to be created. The output is a set of `K` centroids
    in each cluster as well as a label to each vector in `X` that indicates the points
    assigned to the respective cluster. All points within a cluster are nearer in
    distance to their centroid than any other centroid. The condition for the `K`
    clusters `C[k]` and the `K` centroids `μ[k]` can be expressed as follows:


    ![$$ \operatorname{minimize}\sum \limits_{k=1}^K\sum \limits_{{\textrm{x}}_n\in
    {C}_k}{\left\Vert {\textrm{X}}_n-{\mu}_k\right\Vert}^2\textrm{with}\ \textrm{respect}\
    \textrm{to}\ {C}_k,{\mu}_k. $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equa.png)


    However, this optimization problem cannot be solved in polynomial time. But Lloyd
    has proposed an iterative method as a solution. It consists of two steps that
    iterate until the program converges to the solution.


    1. It has a set of `K` centroids, and each point is assigned to a unique cluster
    or centroid, where the distance of the concerned centroid from that particular
    point is the minimum.


    2. It recalculates the centroid of each cluster by using the following formula:


    ![$$ {C}_k=\left\{ Xn:\left\Vert Xn-\mu k\right\Vert \le \textrm{all}\left\Vert
    Xn-\mu l\right\Vert \right\} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equ1.png)


    (1)


    ![$$ {\upmu}_{\textrm{k}}=\frac{1}{Ck}{\sum}_{Xn\in Ck} Xn $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equ2.png)


    (2)


    The two-step procedure continues until there is no further re-arrangement of cluster
    points. The convergence of the algorithm is guaranteed, but it may converge to
    a local minima.


    The following is a simple implementation of Lloyd’s algorithm for performing K-means
    clustering in Python:


    ```python

    import random

    def ED(source, target):

    if source == "":

    return len(target)

    if target == "":

    return len(source)

    if source[-1] == target[-1]:

    cost = 0

    else:

    cost = 1

    res = min([ED(source[:-1], target)+1,ED(source, target[:-1])+1,ED(source[:-1],
    target[:-1]) + cost])

    Return(res)

    def find_centre(x, X, mu):

    min = 100

    cent = 0

    for c in mu:

    dist = ED(x, X[c])

    if dist< min:

    min = dist

    cent = c

    return(cent)

    def cluster_arrange(X, cent):

    clusters  = {}

    for x in X:

    bestcent = find_centre(x, X, cent)

    try:

    clusters[bestcent].append(x)

    exceptKeyError:

    clusters[bestcent] = [x]

    return( clusters)

    def rearrange_centers(cent, clusters):

    newcent = []

    keys = sorted(clusters.keys())

    for k in keys:

    newcent.append(k)

    return(newcent)

    def has_converged(cent, oldcent):

    return (sorted(cent) == sorted(oldcent))

    def locate_centers(X, K):

    oldcent = random.sample(range(0,5), K)

    cent = random.sample(range(0,5), K)

    while not has_converged(cent, oldcent):

    oldcent = cent

    # Assign all points in X to clusters

    clusters = cluster_arrange(X, cent)

    # Reevaluate centers

    cent = rearrange_centers(oldcent, clusters)

    return(cent, clusters)

    X = [''Delhi'',''Dehli'', ''Delli'',''Kolkata'',''Kalkata'',''Kalkota'']

    print(locate_centers(X,2))

    ```


    However, K-means clustering has a limitation. For example, suppose all of your
    data points are located in eastern India. For `K=4` clustering, the initial step
    is that you randomly choose a center in Delhi, Mumbai, Chennai, and Kolkata. All
    of your points lie in eastern India, so all the points are nearest to Kolkata
    and are always assigned to Kolkata. Therefore, the program will converge in one
    step. To avoid this problem, the algorithm is run multiple times and averaged.
    Programmers can use various tricks to initialize the centroids in the first step.


    ## Choosing K: The Elbow Method


    There are certain cases where you have to determine the `K` in K-means clustering.
    For this purpose, you have to use the elbow method, which uses a percentage of
    variance as a variable dependent on the number of clusters. Initially, several
    clusters are chosen. Then another cluster is added, which doesn’t make the modeling
    of data much better. The number of clusters is chosen at this point, which is
    the *elbow criterion*. This “elbow” cannot always be unambiguously identified.
    The percentage of variance is realized as the ratio of the between-group variance
    of individual clusters to the total variance. Assume that in the previous example,
    the retailer has four cities: Delhi, Kolkata, Mumbai, and Chennai. The programmer
    does not know that so does clustering with `K=2` to `K=9` and plots the percentage
    of variance. The programmer will get an elbow curve that clearly indicates `K=4`
    is the right number for `K`.


    ## Silhouette Analysis


    The silhouette analysis is another method of choosing the `K` value. It measures
    how similar an object is to its own cluster (cohesion) compared to other clusters
    (separation). The range of silhouette value is −1 to +1; the higher the value,
    the more the object is matched to its own cluster. It is desirable to have a high
    value for most data points. If many points have a low or negative value, then
    the clustering configuration is not right.


    The silhouette can be calculated with any distance metric, such as the Euclidean
    distance, which is discussed later.


    The Silhouette score `s(i)` for each data point `i` is defined as follows:


    ![$$ {\displaystyle \begin{array}{l}s(i)=\frac{b(i)-a(i)}{\max \left\{a(i),b(i)\right\}},\textrm{if}\;\left|{C}_i\right|&gt;1\\
    {}\textrm{and}\\ {}s(i)=0,\textrm{if}\;\left|{C}_i\right|=1\end{array}} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equb.png)


    Source: Wikipedia


    Here, `a(i)` is the measure of similarity of the point `i` to its own cluster,
    `b(i)` is the measure of dissimilarity of `i` from points in other clusters, and
    `s(i)` is defined to be equal to zero if `i` is the only point in the cluster.


    Please refer to the following code for an example of silhouette scoring:


    ```python

    from sklearn.datasets import make_blobs

    from sklearn.cluster import KMeans

    import matplotlib.pyplot as fig

    from sklearn.metrics import silhouette_score

    # Create dataset with 4 random cluster centers and 1000 datapoints

    x, y = make_blobs(n_samples = 1000, centers = 4, n_features=2, shuffle=True, random_state=31)

    sil_score = []

    kmax = 10

    # number of clusters should be greater or equal to 2

    for k in range(2, kmax+1):

    kmeans = KMeans(n_clusters = k).fit(x)

    labels = kmeans.labels_

    sil_score.append(silhouette_score(x, labels, metric = ''euclidean''))

    fig.plot([i for i in range(2,11)], sil_score)

    fig.xlabel("K value")

    fig.ylabel("silhouette_score")

    fig.show()

    ```


    Figure [4-2](#458833_2_En_4_Chapter.xhtml#Fig2) is generated by the code. This
    clearly depicts that the silhouette score is maximum for the `k` value 4. So,
    we need to choose four clusters.


    ![](images/458833_2_En_4_Chapter/458833_2_En_4_Fig2_HTML.png)


    A line graph of silhouette score versus K value. The line has a fluctuating trend
    with a rise and fall at 4 and 8 K value respectively.


    Figure 4-2


    Silhouette score versus k value


    ## Distance or Similarity Measure


    The measure of distance or similarity is one of the key factors of clustering.
    In this section, we will describe the different kinds of distance and similarity
    measures. Before that, we’ll explain what *distance* actually means here.'
