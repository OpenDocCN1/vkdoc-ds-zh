    `X = (x1, x2, x3, ..., xn)` is a vector of `n` dimension. The Bayesian classifier
    assigns each `X` to one of the target classes of set {C1, C2, …, Cm,}. This assignment
    is done on the basis of probability that `X` belongs to target class Ci. That
    is to say, `X` is assigned to class Ci if and only if P(Ci |X) > P(Cj |X) for
    all j such that 1 ≤ j ≤ m.


    ![$$ P\left({C}_i\left|X\right.\right)=\frac{P\left(X\left|{C}_i\right.\right)P\left({C}_i\right)}{P(X)}
    $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equq.png)


