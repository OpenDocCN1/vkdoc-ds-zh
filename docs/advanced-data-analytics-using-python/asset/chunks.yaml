    要从树状图中创建一个簇，你需要一个距离或相似度的阈值。一个简单的方法是绘制距离或相似度的分布图，并找到曲线的拐点。对于高斯分布数据，拐点位于 `x = mean
    + n*std` 和 `x = mean – n*std` 处，如图 4-10 所示。


