    ### Database Connection


    Before connecting to a MySQL database, make sure you do the following:


    1.  You need to access a database called `TEST` with the `sql "use test"` command.

    2.  In `TEST` you need a table named `STUDENT`; use the command `sql "create table
    student(name varchar(20), sur_name varchar(20),roll_no int");`.

    3.  `STUDENT` needs three fields: `NAME`, `SUR_NAME`, and `ROLL_NO`.

    4.  There needs to be a user in `TEST` that has complete access to the database.


    If you do not do these steps properly, you will get an exception in the next Python
    code.


    ### INSERT Operation


    The following code carries out the SQL `INSERT` statement for the purpose of creating
    a record in the `STUDENT` table:


    ```

    #!/usr/bin/python

    import MySQLdb

    # Open database connection

    db = MySQLdb.connect("localhost","user","passwd","TEST" )

    # prepare a cursor object using cursor() method

    cursor = db.cursor()

    # Prepare SQL query to INSERT a record into the database.

    sql = """INSERT INTO STUDENT(NAME,

    SUR_NAME, ROLL_NO)

    VALUES (''Sayan'', ''Mukhopadhyay'', 1)"""

    try:

    # Execute the SQL command

    cursor.execute(sql)

    # Commit your changes in the database

    db.commit()

    except:

    # Rollback in case there is any error

    db.rollback()

    # disconnect from server

    db.close()

    ```


    ### READ Operation


    The following code fetches data from the `STUDENT` table and prints it:


    ```

    #!/usr/bin/python

    import MySQLdb

    # Prepare SQL query to INSERT a record into the database.

    sql = "SELECT * FROM STUDENT "

    try:

    # Execute the SQL command

    cursor.execute(sql)

    # Fetch all the rows in a list of lists.

    results = cursor.fetchall()

    for row in results:

    fname = row[0]

    lname = row[1]

    id = row[2]

    # Now print fetched result

    Print( "name=%s,surname=%s,id=%d" % \

    (fname, lname, id ))

    except:

    print "Error: unable to fecth data"

    ```


    ### DELETE Operation


    The following code deletes a row from `TEST` with `id=1`:


    ```

    #!/usr/bin/python

    import MySQLdb

    # Prepare SQL query to DELETE required records

    sql = "DELETE FROM STUDENT WHERE ROLL_NO =1"

    try:

    # Execute the SQL command

    cursor.execute(sql)

    # Commit your changes in the database

    db.commit()

    except:

    # Rollback in case there is any error

    db.rollback()

    ```


    ### UPDATE Operation


    The following code changes the `lastname` variable to Mukherjee, from Mukhopadhyay:


    ```

    #!/usr/bin/python

    import MySQLdb

    # Prepare SQL query to UPDATE required records

    sql = "UPDATE STUDENT SET SUR_NAME="Mukherjee"

    WHERE SUR_NAME="Mukhopadhyay"

    try:

    # Execute the SQL command

    cursor.execute(sql)

    # Commit your changes in the database

    db.commit()

    except:

    # Rollback in case there is any error

    db.rollback()

    ```


    ### COMMIT Operation


    The commit operation provides its assent to the database to finalize the modifications,
    and after this operation, there is no way that this can be reverted.


    ### ROLL-BACK Operation


    If you are not completely convinced about any of the modifications and you want
    to reverse them, then you can apply the `roll-back()` method.


