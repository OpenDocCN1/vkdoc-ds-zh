    ax.plot(model.generate_sample(nsample=50))\nplt.show()\n```\n\n以下是估计 ARMA 模型参数的方法：\n\
    \n1. 在指定平稳 ARMA 过程的阶数后，你需要估计参数。\n2. 假设如下：\n   - 模型阶数（`p`和`q`）已知。\n   - 数据具有零均值。\n\
    3. 如果步骤 2 的假设不合理，你可以减去样本均值`Y`，并拟合一个零均值的 ARMA 模型，如`Ø(B)X[t] = θ(B)a[t]`所示，其中`X[t]\
    \ = Y[t] – Y`。然后使用`X[t] + Y`作为`Y[t]`的模型。\n\n# 集成 ARMA 模型\n\n为了拟合像前面讨论的平稳模型，必须消除非平稳的变异来源。差分法广泛应用于计量经济学数据。如果将`X[t]`替换为`∇^dX[t]`，那么你就拥有了一个能够描述某些类型非平稳序列的模型。\n\
    \n![$$ {Y}_t={\\left(1-L\\right)}^d{X}_t $$](img/458833_2_En_6_Chapter_TeX_Equae.png)\n\
    \n以下是 ARIMA 模型的估计参数：\n\n- ARIMA 模型通过自回归、差分和移动平均的阶数来指定。\n- 该方法不假设任何模式，而是采用迭代方法来识别模型。\n\
    - 如果残差通常较小、随机分布，并且总体上不包含有用信息，则模型“拟合良好”。\n\n以下是 ARIMA 模型的示例代码。\n\n请从`https://github.com/pratips/book-Advanced-Data-Analytics-Using-Python`下载所需的\
    \ CSV 文件，并使用`pip`命令安装 Python 库。\n\n```\n# 导入库\nfrom pandas import read_csv\nfrom\
    \ matplotlib import pyplot\nfrom statsmodels.tsa.arima.model import ARIMA\nfrom\
    \ sklearn.metrics import mean_squared_error\n# 读取 CSV 文件\nseries = read_csv('temperatures.csv',\
    \ header=0, index_col=0, parse_dates=True, squeeze=True)\nP = series.values\n\
    size = int(len(P) * 0.9)\n# 分割为训练集和测试集\ntrain, test = P[0:size], P[size:len(P)]\n\
