    # initialize the data matrix\ndata = []\n# loop over the contours\nfor c in cnts:\n\
    # construct a mask from the contour\nmask = np.zeros(canvas.shape[:2], datatype=\"\
    uint8\")\ncv2.drawContours(mask, [c], -1, 255, -1)\nfeatures = cv2.mean(canvas,\
    \ mask=mask)[:3]\ndata.append(features)\n```\n\nLines 36–38 only threshold our\
    \ image, resulting in a binary representation of the blobs, as shown in Figure\
    \ [4-5](#458833_2_En_4_Chapter.xhtml#Fig5).\n\n![](images/458833_2_En_4_Chapter/458833_2_En_4_Fig5_HTML.jpg)\n\
