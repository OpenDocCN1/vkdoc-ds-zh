    # K-Means 聚类


    假设一家零售分销商有一个在线系统，本地代理在其中手动输入交易信息。他们必须填写的字段之一是城市。但由于此数据输入过程是手动的，人们通常容易犯很多拼写错误。例如，人们可能会输入
    `Dehi`、`Dehli`、`Delly` 等，而不是 Delhi。你可以尝试使用聚类来解决这个问题，因为聚类的数量是已知的；换句话说，零售商知道代理在多少个城市运营。这是
    *K-means 聚类*的一个例子。


    K-means 算法有两个输入。第一个是数据 `X`，它是一组 `N` 个向量；第二个是 `K`，它表示需要创建的聚类数量。输出是每个聚类中的一组 `K`
    个质心，以及 `X` 中每个向量的一个标签，该标签指示分配给相应聚类的点。一个聚类内的所有点与其质心的距离都比与其他任何质心的距离更近。`K` 个聚类 `C[k]`
    和 `K` 个质心 `μ[k]` 的条件可以表示如下：


    ![$$ \operatorname{minimize}\sum \limits_{k=1}^K\sum \limits_{{\textrm{x}}_n\in
    {C}_k}{\left\Vert {\textrm{X}}_n-{\mu}_k\right\Vert}²\textrm{with}\ \textrm{respect}\
    \textrm{to}\ {C}_k,{\mu}_k. $$](img/458833_2_En_4_Chapter_TeX_Equa.png)


    然而，这个优化问题无法在多项式时间内解决。但 Lloyd 提出了一种迭代方法作为解决方案。它包含两个步骤，迭代进行直到程序收敛到解。


    1.  它有一组 `K` 个质心，每个点被分配到一个唯一的聚类或质心，其中相关质心到该特定点的距离是最小的。


    2.  它使用以下公式重新计算每个聚类的质心：


    ![$$ {C}_k=\left\{ Xn:\left\Vert Xn-\mu k\right\Vert \le \textrm{all}\left\Vert
    Xn-\mu l\right\Vert \right\} $$](img/458833_2_En_4_Chapter_TeX_Equ1.png)


    (1)


    ![$$ {\upmu}_{\textrm{k}}=\frac{1}{Ck}{\sum}_{Xn\in Ck} Xn $$](img/458833_2_En_4_Chapter_TeX_Equ2.png)


    (2)


    这个两步过程会持续进行，直到聚类点不再重新排列。该算法的收敛性是有保证的，但它可能会收敛到局部最小值。


    以下是在 Python 中执行 K-means 聚类的 Lloyd 算法的简单实现：


    ```python

    import random

    def ED(source, target):

    if source == "":

    return len(target)

    if target == "":

    return len(source)

    if source[-1] == target[-1]:

    cost = 0

    else:

    cost = 1

    res = min([ED(source[:-1], target)+1,ED(source, target[:-1])+1,ED(source[:-1],
    target[:-1]) + cost])

    Return(res)

    def find_centre(x, X, mu):

    min = 100

    cent = 0

    for c in mu:

    dist = ED(x, X[c])

    if dist< min:

    min = dist

    cent = c

    return(cent)

    def cluster_arrange(X, cent):

    clusters  = {}

    for x in X:

    bestcent = find_centre(x, X, cent)

    try:

    clusters[bestcent].append(x)

    exceptKeyError:

    clusters[bestcent] = [x]

    return( clusters)

    def rearrange_centers(cent, clusters):

    newcent = []

    keys = sorted(clusters.keys())

    for k in keys:

    newcent.append(k)

    return(newcent)

    def has_converged(cent, oldcent):

    return (sorted(cent) == sorted(oldcent))

    def locate_centers(X, K):

    oldcent = random.sample(range(0,5), K)

    cent = random.sample(range(0,5), K)

    while not has_converged(cent, oldcent):

    oldcent = cent

    # Assign all points in X to clusters

    clusters = cluster_arrange(X, cent)

    # Reevaluate centers

    cent = rearrange_centers(oldcent, clusters)

    return(cent, clusters)

    X = [''Delhi'',''Dehli'', ''Delli'',''Kolkata'',''Kalkata'',''Kalkota'']

    print(locate_centers(X,2))

    ```


    然而，K-means 聚类有一个局限性。例如，假设你所有的数据点都位于印度东部。对于 `K=4` 聚类，初始步骤是你随机选择德里、孟买、金奈和加尔各答中的一个中心。你所有的点都在印度东部，因此所有点都离加尔各答最近，并且总是被分配给加尔各答。因此，程序将一步收敛。为了避免这个问题，该算法会运行多次并取平均值。程序员可以使用各种技巧来初始化第一步中的质心。


    ## 选择 K：肘部法则


    在某些情况下，你必须确定 K-means 聚类中的 `K`。为此，你必须使用肘部法则，该法则使用方差百分比作为依赖于聚类数量的变量。最初，选择几个聚类。然后添加另一个聚类，但这并不会使数据建模变得更好。此时选择聚类数量，这就是*肘部准则*。这个“肘部”并不总是能被明确识别。方差百分比被实现为各个聚类的组间方差与总方差的比率。假设在前面的例子中，零售商有四个城市：德里、加尔各答、孟买和金奈。程序员不知道这一点，因此使用
    `K=2` 到 `K=9` 进行聚类，并绘制方差百分比。程序员将得到一条肘形曲线，该曲线清楚地表明 `K=4` 是 `K` 的正确数量。


    ## 轮廓分析


    轮廓分析是选择 `K` 值的另一种方法。它衡量一个对象与其自身聚类（内聚性）相比与其他聚类（分离度）的相似程度。轮廓值的范围是 −1 到 +1；值越高，对象与其自身聚类的匹配度越高。对于大多数数据点来说，拥有高值是理想的。如果许多点的值较低或为负，则聚类配置不正确。


    轮廓可以使用任何距离度量来计算，例如欧几里得距离，这将在后面讨论。


    每个数据点 `i` 的轮廓分数 `s(i)` 定义如下：


    ![$$ {\displaystyle \begin{array}{l}s(i)=\frac{b(i)-a(i)}{\max \left\{a(i),b(i)\right\}},\textrm{if}\;\left|{C}_i\right|&gt;1\\
    {}\textrm{and}\\ {}s(i)=0,\textrm{if}\;\left|{C}_i\right|=1\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equb.png)


    来源：维基百科


    这里，`a(i)` 是点 `i` 与其自身聚类的相似性度量，`b(i)` 是点 `i` 与其他聚类中点的相异性度量，如果 `i` 是聚类中唯一的点，则 `s(i)`
    定义为等于零。


    请参考以下代码了解轮廓评分的示例：


    ```python

    from sklearn.datasets import make_blobs

    from sklearn.cluster import KMeans

    import matplotlib.pyplot as fig

    from sklearn.metrics import silhouette_score

    # Create dataset with 4 random cluster centers and 1000 datapoints

    x, y = make_blobs(n_samples = 1000, centers = 4, n_features=2, shuffle=True, random_state=31)

    sil_score = []

    kmax = 10

    # number of clusters should be greater or equal to 2

    for k in range(2, kmax+1):

    kmeans = KMeans(n_clusters = k).fit(x)

    labels = kmeans.labels_

    sil_score.append(silhouette_score(x, labels, metric = ''euclidean''))

    fig.plot([i for i in range(2,11)], sil_score)

    fig.xlabel("K value")

    fig.ylabel("silhouette_score")

    fig.show()

    ```


    图 4-2 由代码生成。这清楚地表明，对于 `k` 值 4，轮廓分数最大。因此，我们需要选择四个聚类。


