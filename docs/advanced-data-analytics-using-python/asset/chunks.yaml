    ![$$ \textrm{Centroid}={\textrm{C}}_{\textrm{m}}=\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\textrm{t}}_{mi}}{\textrm{N}}
    $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equt.png)


    ![$$ \textrm{Radius}={\textrm{R}}_{\textrm{m}}=\sqrt{\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\left({\textrm{t}}_{mi}-{\textrm{C}}_{\textrm{m}}\right)}^2}{\textrm{N}}}
    $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equu.png)


    ![$$ \textrm{Diameter}={\textrm{D}}_{\textrm{m}}=\sqrt{\frac{{\sum_{\textrm{i}=1}}^{\textrm{N}}{\sum_{\textrm{j}=1}}^{\textrm{N}}{\left({\textrm{t}}_{mi}-{\textrm{C}}_{\textrm{m}}\right)}^2}{\left(\textrm{N}\right)\left(\textrm{N}-1\right)}}
    $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equv.png)


    If you consider the cluster as a circle in a space surrounding all member points
    in that cluster, then you can take the centroid as the center of the circle. Similarly,
    the radius and diameter of the cluster are the radius and diameter of the circle.
    Any cluster can be represented by using these three parameters. One measure of
    good clustering is that the distance between centers should be greater than the
    sum of radius.


    The following code snippet from the previous script can be used to visualize the
    output where data points from the same cluster should be seen together.


    ```

    # create 3 clusters using Agglomerative hierarchical clustering

    hrc= AgglomerativeClustering(n_clusters = 3)

    plt.figure(figsize =(10, 10))

    plt.scatter(df_pca[''P1''], df_pca[''P2''], df_pca[''P3''], c = hrc.fit_predict(df_pca),
    cmap =''rainbow'')

    plt.title("Agglomerative Hierarchical Clusters - Scatter Plot", fontsize=18)

    plt.show()

    ```


    ## Summary


    Except for these chapters, every other chapter will contain data that we will
    use to label our model train. Then there’s a fresh set of data that doesn’t have
    a label. The model labels the data. This is called *supervised learning*.


    However, there is no data label in this chapter. An algorithm groups or labels
    them based on their similarity. In a non-English-speaking country, children study
    English in school under the supervision of a teacher. However, after watching
    YouTube videos for two to three years, children begin to speak a modest amount
    of English without any instruction. This is called unsupervised learning.'
