    树状图 `O` 是任何层次聚类的输出。图 4-9 展示了一个树状图。


    ![](img/458833_2_En_4_Fig9_HTML.jpg)


    一个簇树状图描绘了多个美国州的高度，例如罗德岛州、爱达荷州、南卡罗来纳州、阿肯色州、密苏里州、康涅狄格州等。


