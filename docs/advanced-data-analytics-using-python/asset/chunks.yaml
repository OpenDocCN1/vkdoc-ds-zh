- fmt: '# Sentiment Analysis


    Sentiment analysis is an interesting application of text classification. For example,
    say one airline client wants to analyze its customer feedback. It classifies the
    feedback according to sentiment (positive/negative) and also by aspect (food/staff/punctuality).
    After that, it can easily understand its strengths in business (the aspect that
    has the maximum positive feedback) and its weaknesses (the aspect that has the
    maximum negative feedback). The airline can also compare this result with its
    competitor. One interesting advantage of doing a comparison with the competitor
    is that it nullifies the impact of the accuracy of the model because the same
    accuracy is applied to all competitors. This is simple to implement in Python
    using the `textblob` library, as shown here:


    ```

    from textblob.classifiers import NaïveBayesClassifier

    train = [(''I love this sandwich.'', ''pos''),  (''this is an amazing place!'',
    ''pos''),(''I feel very good about these beers.'', ''pos''),(''this is my best
    work.'', ''pos''),("what an awesome view", ''pos''),(''I do not like this restaurant'',
    ''neg''),(''I am tired of this stuff.'', ''neg''),("I can''t deal with this",
    ''neg''),(''he is my sworn enemy!'', ''neg''),(''my boss is horrible.'', ''neg'')]

    cl = NaïveBayesClassifier(train)

    print (cl.classify("This is an amazing library!"))

    ```


    *output : pos*


    ```

    from textblob.classifiers import NaïveBayesClassifier

    train = [(''Air India did a poor job of queue management both times.'', ''staff
    service''),  ("The ''cleaning'' by flight attendants involved regularly spraying
    air freshener in the lavatories.", ''staff''),(''The food tasted decent.'', ''food''),(''Flew
    Air India direct from New York to Delhi round trip.'', ''route''),(''Colombo to
    Moscow via Delhi.'', ''route''),(''Flew Birmingham to Delhi with Air India.'',
    ''route''),(''Without toilet, food or anything!'', ''food''),(''Cabin crew announcements
    included a sincere apology for the delay.'', ''cabin flown'')]

    cl = NaïveBayesClassifier(train)

    tests = [''Food is good.'']

    for c in tests:

    print(cl.classify(c))

    ```


    The `textblob` library also supports a random forest classifier, which works best
    on text written in proper English such as a formal letter might be written. For
    text that is not usually written with proper grammar, such as customer feedback,
    naïve Bayes works better. Naïve Bayes has another advantage in real-time analytics.
    You can update the model without losing the previous training.


    # Image Recognition


    Image recognition is a common example of image classification. It is easy to use
    in Python by applying the `opencv` library.


    Please download the model file (`haarcascade_frontalface_default.xml`) from OpenCV
    GitHub ([`https://github.com/opencv/opencv/tree/master/data/haarcascades`](https://github.com/opencv/opencv/tree/master/data/haarcascades))
    as well as the sample Lenna image from [`https://en.wikipedia.org/wiki/File:Lenna_(test_image).png`](https://en.wikipedia.org/wiki/File:Lenna_%2528test_image%2529.png).


    Here is the sample code:


    ```

    import cv2

    # Load the cascade

    face_model = cv2.CascadeClassifier(''haarcascade_frontalface_default.xml'')

    # Reading the image

    img = cv2.imread(''lena.jpg'')

    # Convert into grayscale

    gray_img = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)

    # Detect faces

    faces_detected = face_model.detectMultiScale(gray_img, 1.1, 4)

    # Drawing rectangle around the faces

    for (x, y, w, h) in faces_detected:

    cv2.rectangle(img, (x, y), (x+w, y+h), (255, 0, 0), 2)

    # Show the output

    cv2.imshow(''img'', img)

    cv2.waitKey()

    Install opencv with command:

    sudo pip3 install opencv-contrib-python

    Now we will discuss another type of supervised learning regression problem.

    ```


    ## Regression with Python


    Regression realizes a variable as a linear or nonlinear polynomial of a set of
    independent variables.


    Here is an interesting use case: what is the sales price of a product that maximizes
    its profit? This is a million-dollar question for any merchant. The question is
    not straightforward. Maximizing the sales price may not result in maximizing the
    profit because increasing the sales price sometimes decreases the sales volume,
    which decreases the total profit. So, there will be an optimized value of sales
    price for which the profit will be at the maximum.


    There are *N* records of the transaction with *M* number of features called F1,
    F2, ... Fm (sales price, buy price, cash back, SKU, order date, and so on). You
    have to find a subset of K(K<M) features that have an impact on the profit of
    the merchant and suggest an optimal value of V1, V2, ... Vk for these K features
    that maximize the revenue.


    You can calculate the profit of merchant using the following formula:


    ![$$ \textrm{Profit}={\left( SP\hbox{-} TCB\hbox{-} BP\right)}^{\ast }\ SV $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equ1.png)


    (1)


    For this formula, here are the variables:


    *   SP = Sales price

    *   TCB = Total cash back

    *   BP = Buy price

    *   SV = Sales volume


    Now using regression, you can realize SV as follows:


    ![$$ SV=\textrm{a}+{\textrm{b}}^{\ast } SP+{\textrm{c}}^{\ast } TCB+{\textrm{d}}^{\ast
    } BP $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equs.png)


    Now you can express profit as a function of SP, TCB, and BP and use mathematical
    optimization. With constraining in all parameter values, you can get optimal values
    of the parameters that maximize the profit.


    This is an interesting use case of regression. There are many scenarios where
    one variable has to be realized as the linear or polynomial function of other
    variables.


    ### Least Square Estimation


    Least square estimation is the simplest and oldest method for doing regression.
    It is also known as the *curve fitting method*. Ordinary least squares (OLS) regression
    is the most common technique and was invented in the 18th century by Carl Friedrich
    Gauss and Adrien-Marie Legendre. The following is a derivation of coefficient
    calculation in ordinary least square estimation:


    ![$$ {\displaystyle \begin{array}{c}Y= X\beta +\in \\ {}{X}^{\prime }Y={X}^{\prime
    } X\beta +{X}^{\prime}\in \\ {}{X}^{\prime }Y={X}^{\prime } X\beta +0\\ {}{\left({X}^{\prime
    }X\right)}^{-1}{X}^{\prime }Y=\beta +0\\ {}\beta ={\left({X}^{\prime }X\right)}^{-1}{X}^{\prime
    }Y\end{array}} $$](images/458833_2_En_3_Chapter/458833_2_En_3_Chapter_TeX_Equt.png)


    The following code is a simple example of OLS regression:


    Please find the CSV file at the following link:


    [`https://github.com/Apress/advanced-data-analytics-python-2e`](https://github.com/Apress/advanced-data-analytics-python-2e)


    ```

    import pandas as pd

    import statsmodels.api as sm

    df = pd.read_csv(''book\\ch3\\fetaure_engineering_data.csv'')

    # df = pandas.read_csv("restaurants.csv")

    X = df[''LotArea'']

    Y = df[''SalePrice'']

    X = sm.add_constant(X)

    model = sm.OLS(Y, X).fit()

    summary = model.summary()

    print(summary)

    ```


    ### Logistic Regression


    Logistic regression is an interesting application of regression that calculates
    the probability of an event. It introduces an intermediate variable that is a
    linear regression of linear variable. Then it passes the intermediate variable
    through the logistic function, which maps the intermediate variable from zero
    to one. The variable is treated as a probability of the event.


    The following code is an example of doing logistic regression on numerical data:


    ```

    from sklearn.preprocessing import StandardScaler

    from sklearn.linear_model import LogisticRegression

    from sklearn.datasets import load_iris

    data, labels = load_iris(return_X_y=True)

    scaler = StandardScaler()

    data = scaler.fit_transform(data)

    model = LogisticRegression(random_state=0)

    model = model.fit(data, labels)

    print(model.predict(data[[50]]))

    ```'
