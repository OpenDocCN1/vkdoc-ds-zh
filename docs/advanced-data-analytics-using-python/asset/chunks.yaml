    # 总结


    在特征工程之后，我们将介绍一些基础统计学知识，特别是时间序列模型。需要记住的一点是，如果你将特征向量（`1xn`）转换为矩阵（`kxn`），其中每行的每个`k`元素是第一列最新的`k`个观测值，那么你就可以在时间序列数据上应用任何监督式机器学习模型。


    # 7. 大规模分析


    近几十年来，由于大数据的发展，分析技术领域发生了革命性的变化。数据正从各种来源被收集，因此，即使在分布式环境中，甚至实时地分析这些数据的技术也得到了发展。


    ## Hadoop


    这场革命始于 Hadoop 框架的开发，该框架有两个主要组件，即 MapReduce 编程和 HDFS 文件系统。


    ### MapReduce 编程


    MapReduce 是一种受函数式编程启发的编程风格，用于处理大量数据。程序员可以使用 MapReduce 代码处理大数据，而无需了解分布式环境的内部细节。在
    MapReduce 之前，像 Condor 这样的框架在分布式数据上进行并行计算。但 MapReduce 的主要优势在于它基于 RPC（远程过程调用）。数据不会移动；相反，代码会跳转到不同的机器上来处理数据。在处理大数据时，这极大地节省了网络带宽和计算时间。


    一个 MapReduce 程序有两个主要组件：映射器（mapper）和归约器（reducer）。在映射器中，输入被分割成小单元。通常，输入文件的每一行都成为每个映射任务的输入。映射器处理输入并向归约器发出一个键值对。归约器接收特定键的所有值作为输入，并处理数据以生成最终输出。


    以下伪代码是统计文档中单词频率的一个示例：


    ```

    map(String key, String value):

    // key: 文档名称

    // value: 文档内容

    for each word w in value:

    EmitIntermediate(w, "1");

    reduce(String key, Iterator values):

    // key: 一个单词

    // values: 计数列表

    int result = 0;

    for each v in values:

    result += ParseInt(v);

    Emit(AsString(result));

    ```


    ### 分区函数


    有时需要将特定的数据集发送到特定的归约任务。分区函数就是为了解决这个目的。例如，在前面的 MapReduce 示例中，假设用户希望输出按排序顺序存储。那么他指定归约任务的数量为
    32（对应 32 个字母），并在分区函数中，对于以`a`开头的键返回 1，以`b`开头的键返回 2，依此类推。那么所有以相同字母开头的单词都会进入同一个归约任务。输出将存储在同一个输出文件中，并且由于
    MapReduce 保证中间键值对会按键的递增顺序处理，因此在给定的分区内，输出将按排序顺序存储。


    ### 组合器函数


    组合器是 MapReduce 中的一个功能，在映射阶段进行部分聚合。它不仅提高了性能，而且当数据集非常大以至于归约器抛出堆栈溢出异常时，有时必须使用它。通常，归约器和组合器的逻辑是相同的，但这可能取决于
    MapReduce 如何处理输出。


    为了实现这个单词计数示例，我们将遵循一个特定的设计模式。将有一个根类`RootBDAS`（BDAS 代表大数据分析系统），它有两个抽象方法：一个映射器任务和一个归约器任务。所有子类都实现这些映射器和归约器任务。主类将使用反射创建子类的实例，并在
    MapReduce 的 map 函数中调用该实例的映射器任务，在 reduce 函数中调用归约器任务。这种模式的主要优点是你可以对 MapReduce 功能进行单元测试，并且它具有适应性。添加任何新的子类都不需要对主类或单元测试进行任何更改。你只需要更改配置。某些代码可能需要实现组合器或分区器逻辑。它们必须继承`ICombiner`或`IPartitioner`接口。


    图 7-1 展示了该系统的类图。


    ![](img/458833_2_En_7_Fig1_HTML.jpg)


    一个流程图说明了主类、单元测试器以及子类 1 和 2 如何与抽象类和接口的类相连接。


