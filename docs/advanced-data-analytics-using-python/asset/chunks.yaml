- fmt: '### Properties


    The distances are measures that satisfy the following properties:


    - `dist(x, y) = 0` if and only if `x = y`.

    - `dist(x, y) > 0` when `x ≠ y`.

    - `dist(x, y) = dist(y, x)`.

    - `dist(x, y) + dist(y, z) >= dist(z, x)` for all `x`, `y`, and `z`.


    ### General and Euclidean Distance


    The distance between the points `p` and `q` is the length of the geometrical line
    between them: (![$$ \overline{pq} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_IEq1.png)).
    This is called *Euclidean distance*.


    According to Cartesian coordinates, if `p = (p[1], p[2], …, p[n])` and `q = (q[1],
    q[2], …, q[n])` are the two points in Euclidean `n`-space, then the distance (`d`)
    from `q` to `p` or from `p` to `q` is derived from the Pythagorean theorem, as
    shown here:


    ![$$ {\displaystyle \begin{array}{c}d\left(p,q\right)=d\left(q,p\right)=\sqrt{{\left({q}_1-{p}_1\right)}^2+{\left({q}_2-{p}_2\right)}^2+\dots
    +{\left({q}_n-{p}_n\right)}^2}\\ {}=\sqrt{\sum \limits_{i=1}^n{\left({q}_i-{p}_i\right)}^2}.\end{array}}
    $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equc.png)


    The Euclidean vector is the position of a point in a Euclidean `n`-space. The
    magnitude of a vector is a measure. Its length is calculated by the following
    formula:


    ![$$ \left\Vert p\right\Vert =\sqrt{p_1^2+{p}_2^2+\cdots +{p}_n^2}=\sqrt{p\cdot
    p}, $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equd.png)


    A vector has direction along with a distance. The distance between two points,
    `p` and `q`, may have a direction, and therefore, it may be represented by another
    vector, as shown here:


    ![$$ q-p=\left({q}_1-{p}_1,{q}_2-{p}_2,\dots, {q}_n-{p}_n\right) $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Eque.png)


    The Euclidean distance between `p` and `q` is simply the Euclidean length of this
    distance (or displacement) vector.


    ![$$ {\displaystyle \begin{array}{c}\left\Vert q-p\right\Vert =\sqrt{\left(q-p\right)\cdot
    \left(q-p\right)}\\ {}\left\Vert q-p\right\Vert =\sqrt{{\left\Vert p\right\Vert}^2+{\left\Vert
    q\right\Vert}^2-2p\cdot q}\end{array}} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equf.png)


    **In one dimension:**


    ![$$ \sqrt{{\left(x-y\right)}^2}=\left|x-y\right|. $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equg.png)


    **In two dimensions:**


    In the Euclidean plane, if `p = (p[1], p[2])` and `q = (q[1], q[2])`, then the
    distance is given by the following:


    ![$$ d\left(p,q\right)=\surd \left({q}_1-{p}_1\right)\hat{\mkern6mu} 2+\left({q}_2-{p}_2\right)\hat{\mkern6mu}
    2 $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equh.png)


    Alternatively, it follows from the equation that if the polar coordinates of the
    point `p` are (`r[1]`, `θ[1]`) and those of `q` are (`r[2]`, `θ[2]`), then the
    distance between the points is as follows:


    ![$$ \surd {r}_1\hat{\mkern6mu} 2+{r}_2\hat{\mkern6mu} 2-2{r}_1{r}_2\cos \left({{}^{\uptheta}}_1{-^{\uptheta}}_2\right)
    $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equi.png)


    **In `n` dimensions:**


    In the general case, the distance is as follows:


    ![$$ {D}^2\left(p,q\right)=\vdash {\left({p}_1-{q}_1\right)}^2+{\left({p}_2-{q}_2\right)}^2+\dots
    +{\left({p}_i-{q}_i\right)}^2+\dots +{\left({p}_n-{q}_n\right)}^2\. $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equj.png)


    In Chapter [3](#458833_2_En_3_Chapter.xhtml), you will find an example of Euclidian
    distance in the nearest neighbor classifier example.


    ### Squared Euclidean Distance


    The standard Euclidean distance can be squared to place progressively greater
    weight on objects that are farther apart. In this case, the equation becomes the
    following:


    ![$$ {d}^2\left(p,q\right)=\vdash {\left({p}_1-{q}_1\right)}^2+{\left({p}_2-{q}_2\right)}^2+\dots
    +{\left({p}_i-{q}_i\right)}^2+\dots +{\left({p}_n-{q}_n\right)}^2\. $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equk.png)


    Squared Euclidean distance is not a metric because it does not satisfy the triangle
    inequality. However, it is frequently used in optimization problems in which distances
    are to be compared only.


    ### Distance Between String-Edit Distance


    *Edit distance* is a measure of dissimilarity between two strings. It counts the
    minimum number of operations required to make two strings identical. Edit distance
    finds applications in natural language processing, where automatic spelling corrections
    can indicate candidate corrections for a misspelled word. Edit distance is of
    two types.


    - Levenshtein edit distance

    - Needleman edit distance


    #### Levenshtein Distance


    The Levenshtein distance between two words is the least number of insertions,
    deletions, or replacements that need to be made to change one word into another.
    In 1965, it was Vladimir Levenshtein who considered this distance.


    Levenshtein distance is also known as *edit distance*, although that might denote
    a larger family of distance metrics as well. It is affiliated with pair-wise string
    alignments.


    For example, the Levenshtein distance between `Calcutta` and `Kolkata` is 5, since
    the following five edits change one into another:


    - `Calcutta` → `Kalcutta` (substitution of `C` for `K`)

    - `Kalcutta` → `Kolcutta` (substitution of `a` for `o`)

    - `Kolcutta` → `Kolkutta` (substitution of `c` for `k`)

    - `Kolkutta` → `Kolkatta` (substitution of `u` for `a`)

    - `Kolkatta` → `Kolkata` (deletion of `t`)


    When the strings are identical, the Levenshtein distance has several simple upper
    bounds that are the lengths of the larger strings, and the lower bounds are zero.
    The code example of the Levinstein distance is given in the K-mean clustering
    code.


    #### Needleman–Wunsch Algorithm


    The Needleman–Wunsch algorithm is used in bioinformatics to align protein or nucleotide
    sequences. It was one of the first applications of dynamic programming for comparing
    biological sequences. It works using dynamic programming. First it creates a matrix
    where the rows and columns are letters. Each cell of the matrix is a similarity
    score of the corresponding letter in that row and column. Scores are one of three
    types: matched, not matched, or matched with insert or deletion. Once the matrix
    is filled, the algorithm does a backtracing operation from the bottom-right cell
    to the top-left cell and finds the path where the neighbor score distance is the
    minimum. The sum of the score of the backtracing path is the Needleman–Wunsch
    distance for two strings.


    `Pyopa` is a Python module that provides a ready-made Needleman–Wunsch distance
    between two strings.


    ```

    import pyopa

    data = {''gap_open'': -20.56,

    ''gap_ext'': -3.37,

    ''pam_distance'': 150.87,

    ''scores'': [[10.0]],

    ''column_order'': ''A'',

    ''threshold'': 50.0}

    env = pyopa.create_environment(**data)

    s1 = pyopa.Sequence(''AAA'')

    s2 = pyopa.Sequence(''TTT'')

    print(pyopa.align_double(s1, s1, env))

    print(env.estimate_pam(aligned_strings[0], aligned_strings[1]))

    ```


    Although Levenshtein is simple in implementation and computationally less expensive,
    if you want to introduce a gap in string matching (for example, `New Delhi` and
    `NewDelhi`), then the Needleman–Wunsch algorithm is the better choice.


    ## Similarity in the Context of a Document


    A similarity measure between documents indicates how identical two documents are.
    Generally, similarity measures are bounded in the range `[-1,1]` or `[0,1]` where
    a similarity score of 1 indicates maximum similarity.'
