    #### 拟合移动平均过程


    移动平均（MA）模型是实现单变量周平稳时间序列的著名方法（见图 6-3）。移动平均模型规定，输出变量线性依赖于其自身过去的误差项以及一个随机项。AR 模型被称为*移动平均模型*，它是时间序列
    ARMA 和 ARIMA 模型的一个特例和关键组成部分。


    ![$$ {X}_t={\varepsilon}_t+\sum \limits_{i=1}^p{\varphi}_i{X}_{t-i}+\sum \limits_{i=1}^q{\theta}_i{\varepsilon}_{t-i}+\sum
    \limits_{i=1}^b{\eta}_i{d}_{t-i} $$](img/458833_2_En_6_Chapter_TeX_Equt.png)


    ![](img/458833_2_En_6_Fig3_HTML.jpg)


    价格与周期的关系图。它绘制了实际值和区间值在 6 处的移动平均线的两条上升趋势。实际值的峰值最高，达到 9。


