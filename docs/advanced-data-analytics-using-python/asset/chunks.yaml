    \n# 一个特殊场景\n\n在航空或酒店领域，第`t`个月的乘客量与`t-1`或`t-2`个月的数据相关性较低，但与`t-12`个月的数据相关性更高。例如，排灯节（十月）的乘客量与去年排灯节的数据相关性高于同年八月和九月的数据。历史上，拾取模型用于预测这类数据。拾取模型有两种变体。\n\
    \n在加法拾取模型中，\n\n![$$ \\textrm{X}\\left(\\textrm{t}\\right)=\\textrm{X}\\left(\\\
    textrm{t}\\hbox{-} 1\\right)+\\left[\\textrm{X}\\left(\\textrm{t}\\hbox{-} 12\\\
    right)\\hbox{-} \\textrm{X}\\left(\\textrm{t}\\hbox{-} 13\\right)\\right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equaj.png)\n\
    \n在乘法拾取模型中，\n\n![$$ \\textrm{X}\\left(\\textrm{t}\\right)=\\textrm{X}{\\left(\\\
    textrm{t}\\hbox{-} 1\\right)}^{\\ast }\\ \\left[\\textrm{X}\\left(\\textrm{t}\\\
    hbox{-} 12\\right)/\\textrm{X}\\left(\\textrm{t}\\hbox{-} 13\\right)\\right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equak.png)\n\
    \n研究表明，对于这类数据，基于神经网络的预测器比时间序列模型具有更高的准确性。\n\n在投资银行的高频交易中，时间序列模型过于耗时，无法捕捉工具的最新模式。因此，他们实时计算`dX/dt`和`d2X/dt2`，其中`X`是工具的价格。如果两者均为正，他们盲目地发出买入该工具的订单。如果两者均为负，并且投资组合中持有该工具，他们则盲目卖出。但如果符号相反，他们会利用时间序列数据进行更详细的分析。\n\
    \n正如我之前所说，在时间序列分析中有许多场景下，R 比 Python 是更好的选择。因此，这里有一个使用 R 进行时间序列预测的示例。`auto.arima`模型的优点在于它能自动找到数据的阶数、趋势和季节性，并拟合模型。在预测中，我们只打印均值，但该模型在预测时提供了预测的上限和下限。\n\
    \n请使用以下命令安装`pmdarima`库：\n\n```\npip install pmdarima\n```\n\n安装完成后，你可以尝试运行基于`pmdarima`手册的以下代码。它会加载包中可用的数据集，然后尝试拟合自动\
    \ ARIMA 并进行预测。\n\n```\nimport numpy as np\nimport pmdarima as pm\nfrom pmdarima.datasets\
    \ import load_wineind\n# 加载数据集\nwineind = load_wineind().astype(np.float64)\n\
    # 拟合逐步模型：\nstepwise_fit = pm.auto_arima(wineind, start_p=1, start_q=1, max_p=3,\
    \ max_q=3, m=12, start_P=0, seasonal=True, d=1, D=1, trace=True, error_action='ignore',\
    \ suppress_warnings=True, stepwise=True)\nstepwise_fit.summary()\npredicted_15\
    \ = stepwise_fit.predict(n_periods=15)\nprint(predicted_15)\n```\n\n# 缺失数据\n\n\
    时间序列和许多其他数据分析工作中的一个重要方面是弄清楚如何处理缺失数据。在前面的代码中，你用平均值填充了缺失的记录。当缺失数据实例的数量不是很高时，这没问题。但如果数量很高，那么最高值和最低值的平均值是一个更好的替代方案。\n"
- fmt: '# Summary


    Following feature engineering, we’ll go over some basic statistics, particularly
    time-series models. One thing to keep in mind is that you may apply any supervised
    machine learning model on time-series data if you transform feature vectors (`1xn`)
    to the matrix (`kxn`), where each `k` element of each row is the latest `k` observation
    of the first column.


    # 7. Analytics at Scale


    In recent decades, a revolutionary change has taken place in the field of analytics
    technology because of big data. Data is being collected from a variety of sources,
    so technology has been developed to analyze this data in a distributed environment,
    even in real time.


    ## Hadoop


    The revolution started with the development of the Hadoop framework, which has
    two major components, namely, MapReduce programming and the HDFS file system.


    ### MapReduce Programming


    MapReduce is a programming style inspired by functional programming to deal with
    large amounts of data. The programmer can process big data using MapReduce code
    without knowing the internals of the distributed environment. Before MapReduce,
    frameworks like Condor did parallel computing on distributed data. But the main
    advantage of MapReduce is that it is RPC based. The data does not move; on the
    contrary, the code jumps to different machines to process the data. In the case
    of big data, it is a huge savings of network bandwidth as well as computational
    time.


    A MapReduce program has two major components: the mapper and the reducer. In the
    mapper, the input is split into small units. Generally, each line of input file
    becomes an input for each map job. The mapper processes the input and emits a
    key-value pair to the reducer. The reducer receives all the values for a particular
    key as input and processes the data for final output.


    The following pseudocode is an example of counting the frequency of words in a
    document:


    ```

    map(String key, String value):

    // key: document name

    // value: document contents

    for each word w in value:

    EmitIntermediate(w, "1");

    reduce(String key, Iterator values):

    // key: a word

    // values: a list of counts

    int result = 0;

    for each v in values:

    result += ParseInt(v);

    Emit(AsString(result));

    ```


    ### Partitioning Function


    Sometimes it is required to send a particular data set to a particular reduce
    job. The partitioning function solves this purpose. For example, in the previous
    MapReduce example, say the user wants the output to be stored in sorted order.
    Then he mentions the number of the reduce job 32 for 32 letters, and in the practitioner
    he returns 1 for the key starting with `a`, 2 for `b`, and so on. Then all the
    words that start with the same letters go to the same reduce job. The output will
    be stored in the same output file, and because MapReduce assures that the intermediate
    key-value pairs are processed in increasing key order, within a given partition,
    the output will be stored in sorted order.


    ### Combiner Function


    The combiner is a facility in MapReduce where partial aggregation is done in the
    map phase. Not only does it increase the performance, but sometimes it is essential
    to use if the data set so huge that the reducer is throwing a stack overflow exception.
    Usually the reducer and combiner logic are the same, but this might be necessary
    depending on how MapReduce deals with the output.


    To implement this word count example, we will follow a particular design pattern.
    There will be a root `RootBDAS` (BDAS stands for Big Data Analytic System) class
    that has two abstract methods: a mapper task and a reducer task. All child classes
    implement these mapper and reducer tasks. The main class will create an instance
    of the child class using reflection, and in MapReduce map functions call the mapper
    task of the instance and the reducer function of the reducer task. The major advantages
    of this pattern are that you can do unit testing of the MapReduce functionality
    and that it is adaptive. Any new child class addition does not require any changes
    in the main class or unit testing. You just have to change the configuration.
    Some code may need to implement combiner or partitioner logics. They have to inherit
    the `ICombiner` or `IPartitioner` interface.


    Figure [7-1](#458833_2_En_7_Chapter.xhtml#Fig1) shows a class diagram of the system.


    ![](images/458833_2_En_7_Chapter/458833_2_En_7_Fig1_HTML.jpg)


    A flow diagram illustrates how the main class, unit tester, and child 1 and 2
    are linked to classes of abstract and interfaces.


    **Figure 7-1** The class diagram


    Here is the `RootBDAS` class:


    ```

    import java.util.ArrayList;

    import java.util.HashMap;

    /**

    *

    */

    /**

    * @author SayanM

