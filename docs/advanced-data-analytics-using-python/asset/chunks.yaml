    We will discuss something crucial about the Spark memory model now. The operation
    is performed in memory by Spark. Using a command-line parameter, we can change
    the default size of execution memory. Spark can handle files that are greater
    than its RAM, but it must use disc memory to do it. For example, the input log
    file was greater than the Spark memory size, but the program successfully filters
    important lines from there. However, there is one exception. If you do decide
    to join, Spark requires the memory of both data frames. We use a join here to
    make our code as memory-optimized as possible by manually calling the Spark garbage
    collector via the `unpersist` function. However, it slows down the code. If you
    eliminate that code, the program will run faster but use more memory.'
