  raw: '## Updatable Machine Learning and Spark Memory Model


    In this section, we discuss a new machine learning topic: how to develop an updatable
    machine learning model, which is a basic requirement for a model to become scalable.


    When we train a model in machine learning, we data train the model from scratch,
    which implies that all the information from prior training iterations is swapped
    out. For example, if we train a model with data from the first week of the month,
    it will predict based on the first week’s data, and if we train the same model
    object with data from the second week, it will predict based on the second week’s
    data. It begins to forecast based only on data from the second week of the month.
    In the model, there is no trace of first-week data. However, in the real world,
    there are many scenarios when we require the model to forecast based on first-
    and second-week data after training, which implies that each training iteration
    will update the model rather than erase prior training information.


    This type of model is possible when the model is a function of X and for any two
    data sets N1 and N2.


    X(N1) + X(N2) = X(N1+N2)


    Examples of this type of function are `count`, `max`, `min`, and `sum`. Any probability-based
    model may be divided into `sum` and `count` and therefore converted into an updatable
    model. The Bayesian classifier was used as a model in our application, and the
    Spark code in the next is our own implementation of the classifier.


    The algorithm’s goal is to determine the conditional probability that a `Node(video
    or content)` will be observed for a specific feature value.


    Assume we’re calculating the score for node 10033207 with the feature identifier
    (device ID) and the feature value 49 (choose any device ID according to your choice).


    *   Feature count = Number of records where that device ID (49) is present


    *   Conditional count = Number of records with `is_completed` equal to 1, `identifier`
    equal to 49, and `node` equal to 10033207


    The ratio of the conditional count and feature count will represent the actual
    probability, but we are not dividing this stage because the model will not be
    updatable.


    In each execution of the following code, the following happens:


    1.  Create a user-defined function to convert the IP address to geographic locations.


    2.  Read the name of the target channel from the config file.


    3.  In a data frame, load the lines from the application server log except for
    the line that contains the newlog.


    4.  Filter the logline that includes the channel name.


    5.  Read important column names from the config and selecting them from the data
    frame.


    6.  Connect to MySQL and reading the threshold timestamp from the `threshold`
    table.


    7.  In MySQL, filter the data frame column with a timestamp more than the threshold,
    get the max timestamp from the selected logline, and set that as the new threshold
    for the next iteration.


    8.  The content or node IDs that are clicked are then saved in the database.


    9.  Store the popular contents or node in the database.


    10.  Each line contains the user’s next watch node, which is obtained by self-joining
    the user’s previous watch node.


    11.  Then calculate the ratio of watch time and duration of video as a score.


    12.  If the score is greater than the channel’s threshold defined in config, mark
    it 1; otherwise, mark it 0.


    13.  Then, as stated in Chapter [3](#458833_2_En_3_Chapter.xhtml), calculate the
    conditional probability of a user watching a video that is longer than the threshold
    in the form of a count.'
  trans: '

    ## 可更新机器学习与 Spark 内存模型


    在本节中，我们将探讨一个新的机器学习主题：如何开发一个可更新的机器学习模型，这是模型实现可扩展性的基本要求。


    在机器学习中训练模型时，我们是从零开始用数据训练模型，这意味着之前训练迭代中的所有信息都会被替换掉。例如，如果我们用某月第一周的数据训练模型，它将基于第一周的数据进行预测；如果用第二周的数据训练同一个模型对象，它将基于第二周的数据进行预测。模型开始仅根据该月第二周的数据进行预测，其中没有留下第一周数据的痕迹。然而，在现实世界中，有许多场景要求模型在训练后能基于第一周和第二周的数据进行预测，这意味着每次训练迭代都应更新模型，而不是抹去之前的训练信息。


    当模型是 `X` 的函数，且对于任意两个数据集 `N1` 和 `N2` 满足以下条件时，这种模型是可行的：


    `X(N1) + X(N2) = X(N1+N2)`


    这类函数的例子包括 `count`、`max`、`min` 和 `sum`。任何基于概率的模型都可以分解为 `sum` 和 `count`，从而转化为可更新模型。在我们的应用中，贝叶斯分类器被用作模型，接下来的
    Spark 代码是我们对该分类器的自主实现。


    该算法的目标是确定在特定特征值下观察到某个 `节点（视频或内容）` 的条件概率。


    假设我们正在计算节点 `10033207` 的得分，其特征标识符（设备 ID）为 `49`（你可以根据实际情况选择任意设备 ID）。


    - 特征计数 = 该设备 ID（`49`）出现的记录数

    - 条件计数 = `is_completed` 等于 `1`、`identifier` 等于 `49` 且 `node` 等于 `10033207` 的记录数


    条件计数与特征计数的比值将代表实际概率，但我们在此阶段不进行除法运算，因为这样模型将无法更新。


    在以下代码的每次执行中，会发生以下步骤：


    1. 创建一个用户自定义函数，将 IP 地址转换为地理位置。

    2. 从配置文件中读取目标频道的名称。

    3. 在数据框中加载应用服务器日志中的行，但排除包含 `newlog` 的行。

    4. 筛选出包含频道名称的日志行。

    5. 从配置文件中读取重要的列名，并从数据框中选择这些列。

    6. 连接到 MySQL，并从 `threshold` 表中读取阈值时间戳。

    7. 在 MySQL 中，筛选数据框中时间戳大于阈值的列，从选中的日志行中获取最大时间戳，并将其设置为下一次迭代的新阈值。

    8. 被点击的内容或节点 ID 随后被保存到数据库中。

    9. 将热门内容或节点存储到数据库中。

    10. 每一行包含用户的下一个观看节点，这是通过自连接用户的上一个观看节点获得的。

    11. 然后计算观看时间与视频时长的比值作为得分。

    12. 如果得分大于配置中定义的频道阈值，则标记为 `1`；否则标记为 `0`。

    13. 然后，如第 3 章所述，以计数的形式计算用户观看时长超过阈值的视频的条件概率。

