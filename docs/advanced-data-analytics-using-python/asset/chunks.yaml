- fmt: '# Calling Other Languages in Python


    Now we will describe how to use other languages in Python. There are two examples
    here. The first is calling R code from Python. R code is required for some use
    cases. For example, if you want a ready-made function for the Holt-Winters method
    in a time series, it is difficult to perform in Python, but it is available in
    R. So, you can call R code from Python using the `rpy2` module, as shown here:


    ```

    import rpy2.robjects as ro

    ro.r(''data(input)'')

    ro.r(''x <-HoltWinters(input data frame)'')

    ```


    (You can use example data given in time series chapter.)


    Sometimes you need to call Java code from Python. For example, say you are working
    on a name-entity recognition problem in the field of natural language processing
    (NLP); some text is given as input, and you have to recognize the names in the
    text. Python’s `NLTK` package does have a name-entity recognition function, but
    its accuracy is not good. Stanford NLP is a better choice here, but it is written
    in Java. You can solve this problem in two ways.


    - You can call Java at the command line using Python code. You need to install
    Java with the `yum/at-get install java` command before calling it.

    - For Windows, it is recommended that you install the JRE from [`https://adoptium.net/temurin/releases/?version=8`](https://adoptium.net/temurin/releases/%253Fversion%253D8).
    You can also install the JRE from another distribution. The installation will
    automatically create `JAVA_HOME`. If it does not, you need to set `JAVA_HOME`
    as the system variable, and the value should be the location of Java installation
    folder, for example, `JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-8.0.345.1-hotspot\`.

    - You can expose Stanford NLP as a web service and call it as a service. (Before
    running this code, you’ll need to download the Stanford `nlp` JAR file available
    with the book’s source code.)


    ```

    import subprocess

    subprocess.call([''java'',''-cp'',''*'',''edu.stanford.nlp.sentiment.SentimentPipeline'',''-file'',''foo.txt''])

    Please place foo.txt in the same folder where you run the Python code.

    ```


    ```

    nlp = StanfordCoreNLP(''http://127.0.0.1:9000'')

    output = nlp.annotate(sentence, properties={

    "annotators": "tokenize,ssplit,parse,sentiment",

    "outputFormat": "json",

    # Only split the sentence at End Of Line. We assume that this method only takes
    in one single sentence.

    "ssplit.eolonly": "true",

    # Setting enforceRequirements to skip some annotators and make the process faster

    "enforceRequirements": "false"

    })

    ```


    You will see a more detailed example of Stanford NLP in Chapter [2](#458833_2_En_2_Chapter.xhtml).


    # Exposing the Python Model as a Microservice


    You can expose the Python model as a microservice in the same way that your Python
    model can be used by others to write their own code. The best way to do this is
    to expose your model as a web service. As an example, the following code exposes
    a deep learning model using Flask:


    ```

    from flask import Flask, request, g

    from flask_cors import CORS

    import tensorflow as tf

    from sqlalchemy import *

    from sqlalchemy.orm import sessionmaker

    import pygeoip

    from pymongo import MongoClient

    import json

    import datetime as dt

    import ipaddress

    import math

    app = Flask(__name__)

    CORS(app)

    @app.before_request

    def before():

    db = create_engine(''sqlite:///score.db'')

    metadata = MetaData(db)

    g.scores = Table(''scores'', metadata, autoload=True)

    Session = sessionmaker(bind=db)

    g.session = Session()

    client = MongoClient()

    g.db = client.frequency

    g.gi = pygeoip.GeoIP(''GeoIP.dat'')

    sess = tf.Session()

    new_saver = tf.train.import_meta_graph(''model.obj.meta'')

    new_saver.restore(sess, tf.train.latest_checkpoint(''./''))

    all_vars = tf.get_collection(''vars'')

    g.dropped_features = str(sess.run(all_vars[0]))

    g.b = sess.run(all_vars[1])[0]

    return

    def get_hour(timestamp):

    return dt.datetime.utcfromtimestamp(timestamp / 1e3).hour

    def get_value(session, scores, feature_name, feature_value):

    s = scores.select((scores.c.feature_name == feature_name) & (scores.c.feature_value
    == feature_value))

    rs = s.execute()

    row = rs.fetchone()

    if row is not None:

    return float(row[''score''])

    else:

    return 0.0

    @app.route(''/predict'', methods=[''POST''])

    def predict():

    input_json = request.get_json(force=True)

    features = [''size'',''domain'',''client_time'',''device'',''ad_position'',''client_size'',
    ''ip'',''root'']

    predicted = 0

    feature_value = ''''

    for f in features:

    if f not in g.dropped_features:

    if f == ''ip'':

    feature_value = str(ipaddress.IPv4Address(ipaddress.ip_address(unicode(request.remote_addr))))

    else:

    feature_value = input_json.get(f)

    if f == ''ip'':

    if ''geo'' not in g.dropped_features:

    geo = g.gi.country_name_by_addr(feature_value)

    predicted = predicted + get_value(g.session, g.scores, ''geo'', geo)

    return str(math.exp(predicted + g.b)-1)

    app.run(debug = True, host =''0.0.0.0'')

    ```


    This code exposes a deep learning model as a Flask web service. A JavaScript client
    will send the request with web user parameters such as the IP address, ad size,
    ad position, and so on, and it will return the price of the ad as a response.
    The features are categorical. You will learn how to convert them into numerical
    scores in Chapter [3](#458833_2_En_3_Chapter.xhtml). These scores are stored in
    an in-memory database. The service fetches the score from the database, sums the
    result, and replies to the client. This score will be updated real time in each
    iteration of training of a deep learning model. It is using MongoDB to store the
    frequency of that IP address in that site. It is an important parameter because
    a user coming to a site for the first time is really searching for something,
    which is not true for a user where the frequency is greater than 5. The number
    of IP addresses is huge, so they are stored in a distributed MongoDB database.'
