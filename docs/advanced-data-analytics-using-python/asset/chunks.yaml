- fmt: '# Convolution Neural Networks


    Now we will discuss another kind of neural network: convolution neural networks.


    Each neuron in the input layer is linked to each output neuron in the following
    layer, forming a fully connected (FC) layer in classic feedforward neural networks
    (like the ones we studied previously in this book). In CNNs, however, FC layers
    are not used until the very final layer (or final few layers of a network).


    ![](images/458833_2_En_5_Chapter/458833_2_En_5_Fig2_HTML.png)


    A diagram defines how an input frame is convoluted, and features extracted, pooled,
    and classified through the fully connected layers to predict the output.


    **Figure 5-2** CNN architecture


    Instead, we compute the output using convolutional filters applied to the input
    layer. When you use these convolutions, you get local connections, which means
    that every part of the input is linked to a portion of the output (we’ll explain
    this later in the chapter). In a CNN, each layer applies a separate set of filters,
    usually hundreds or thousands, and then merges the results.


    During training, a CNN learns the values for these filters automatically. When
    it comes to picture categorization, our CNN could learn to do the following:


    - In the first layer, detect edges using raw pixel data.

    - In the second layer, use these edges to recognize shapes (i.e., blobs).

    - In the top layers of the network, use these shapes to detect higher-level characteristics
    like face structures.

    - The last layer is a classifier, which makes predictions about the contents of
    the picture based on these higher-level characteristics.


    An RNN of a CNN is a suitable choice if you have a sequence of images, such as
    a video. We classify a sequence of images in the following code:


    ```python

    import numpy as np

    from keras.models import Sequential

    from keras.layers import Conv2D, MaxPooling2D, Dense, Flatten

    from keras.utils import to_categorical

    import tensorflow as tf

    mnist = tf.keras.datasets.mnist

    # loads data and splits into train and test set

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    x_train, x_test = x_train / 255.0, x_test / 255.0

    # # Reshape the images.

    train_images = np.expand_dims(x_train, axis=3)

    test_images = np.expand_dims(x_test, axis=3)

    num_filters = 4

    filter_size = 2

    pool_size = 2

    # Build the model.

    model = Sequential([

    Conv2D(num_filters, filter_size, input_shape=(28, 28, 1)),

    MaxPooling2D(pool_size=pool_size),

    Flatten(),

    Dense(10, activation=''softmax''),

    ])

    # Compile the model.

    model.compile(

    ''adam'',

    loss=''categorical_crossentropy'',

    metrics=[''accuracy''],

    )

    # Train the model.

    model.fit(

    train_images,

    to_categorical(y_train),

    epochs=3,

    validation_data=(test_images, to_categorical(y_test)),

    )

    # Predict on the first 10 test images.

    predictions = model.predict(test_images[:10])

    print(np.argmax(predictions, axis=1))

    # Check our predictions against the ground truths.

    print(x_test[:10])

    ```


    ## Summary


    This chapter is the heart of this book. We discussed neural networks such as RNN
    and CNN with reinforcement learning using real examples. In the next chapter,
    we will discuss some classical statistical methods to analyze time-series data,
    and the last chapter is all about how to scale your analytic application.


    # 6. Time Series


    A *time series* is a series of data points arranged chronologically. Most commonly,
    the time points are equally spaced. A few examples are the passenger loads of
    an airline recorded each month for the past two years or the price of an instrument
    in the share market recorded each day for the last year. The primary aim of time-series
    analysis is to predict the future value of a parameter based on its past data.


    ## Classification of Variation


    Traditionally, time-series analysis divides the variation into three major components,
    namely, trends, seasonal variations, and other cyclic changes. The variation that
    remains is attributed to “irregular” fluctuations or error term. This approach
    is particularly valuable when the variation is mostly comprised of trends and
    seasonality.


    ## Analyzing a Series Containing a Trend


    A *trend* is a change in the mean level that is long-term in nature. For example,
    if you have a series like 2, 4, 6, 8 and someone asks you for the next value,
    the obvious answer is 10. You can justify your answer by fitting a line to the
    data using the simple least square estimation or any other regression method.
    A trend can also be nonlinear. Figure 6-1 shows an example of a time series with
    trends.


    ![](images/458833_2_En_6_Chapter/458833_2_En_6_Fig1_HTML.jpg)


    A graph plots the international airline passenger data in thousands. It plots
    an increasing trend from around 100 in Jan 49 to 600 in Jan 60.


    **Figure 6-1** A time series with trends


    The simplest type of time series is the familiar “linear trend plus noise” for
    which the observation at time *t* is a random variable `X[t]`, as follows:


    ![$$ {\textrm{X}}_{\textrm{t}}=\alpha +\beta t+{\varepsilon}_t $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equa.png)


    Here, `α`, `β` are constants, and `ε[t]` denotes a random error term with a mean
    of 0. The average level at time *t* is given by `m[t] = (α + βt)`. This is sometimes
    called the *trend term*.


    ### Curve Fitting


    *Fitting* a simple function of time such as a polynomial curve (linear, quadratic,
    etc.), a Gompertz curve, or a logistic curve is a well-known method of dealing
    with nonseasonal data that contains a trend, particularly yearly data. The global
    linear trend is the simplest type of polynomial curve. The Gompertz curve can
    be written in the following format, where `α`, `β`, and `γ` are parameters with
    `0 < r < 1`:


    ![$$ {\textrm{X}}_{\textrm{t}}=\alpha \exp \left[\beta \exp \left(-\gamma \textrm{t}\right)\right]
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equb.png)


    This looks quite different but is actually equivalent, provided `t > 0`. The logistic
    curve is as follows:


    ![$$ {\textrm{X}}_{\textrm{t}}=\textrm{a}/\left(1+{\textrm{be}}^{\hbox{-} ct}\right)
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equc.png)


    Both these curves are S-shaped and approach an asymptotic value as `t → ∞`, with
    the Gompertz curve generally converging slower than the logistic one. Fitting
    the curves to data may lead to nonlinear simultaneous equations.


    For all curves of this nature, the fitted function provides a measure of the trend,
    and the residuals provide an estimate of local fluctuations where the residuals
    are the differences between the observations and the corresponding values of the
    fitted curve.'
  raw: '## Convolution Neural Networks


    Now we will discuss another kind of neural network: convolution neural networks.


    Each neuron in the input layer is linked to each output neuron in the following
    layer, forming a fully connected (FC) layer in classic feedforward neural networks
    (like the ones we studied previously in this book). In CNNs, however, FC layers
    are not used until the very final layer (or final few layers of a network).


    ![](images/458833_2_En_5_Chapter/458833_2_En_5_Fig2_HTML.png)


    A diagram defines how an input frame is convoluted, and features extracted. pooled,
    and classified through the fully connected layers to predict the output.


    Figure 5-2


    CNN architecture


    Instead, we compute the output using convolutional filters applied to the input
    layer. When you use these convolutions, you get local connections, which means
    that every part of the input is linked to a portion of the output (we’ll explain
    this later in the chapter). In a CNN, each layer applies a separate set of filters,
    usually hundreds or thousands, and then merges the results.


    During training, a CNN learns the values for these filters automatically. When
    it comes to picture categorization, our CNN could learn to do the following:


    *   In the first layer, detect edges using raw pixel data.


    *   In the second layer, use these edges to recognize shapes (i.e., blobs).


    *   In the top layers of the network, use these shapes to detect higher-level
    characteristics like face structures.


    *   The last layer is a classifier, which makes predictions about the contents
    of the picture based on these higher-level characteristics.


    An RNN of a CNN is a suitable choice if you have a sequence of images, such as
    a video. We classify a sequence of images in the following code:


    ```

    import numpy as np

    from keras.models import Sequential

    from keras.layers import Conv2D, MaxPooling2D, Dense, Flatten

    from keras.utils import to_categorical

    import tensorflow as tf

    mnist = tf.keras.datasets.mnist

    # loads data and splits into train and test set

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    x_train, x_test = x_train / 255.0, x_test / 255.0

    # # Reshape the images.

    train_images = np.expand_dims(x_train, axis=3)

    test_images = np.expand_dims(x_test, axis=3)

    num_filters = 4

    filter_size = 2

    pool_size = 2

    # Build the model.

    model = Sequential([

    Conv2D(num_filters, filter_size, input_shape=(28, 28, 1)),

    MaxPooling2D(pool_size=pool_size),

    Flatten(),

    Dense(10, activation=''softmax''),

    ])

    # Compile the model.

    model.compile(

    ''adam'',

    loss=''categorical_crossentropy'',

    metrics=[''accuracy''],

    )

    # Train the model.

    model.fit(

    train_images,

    to_categorical(y_train),

    epochs=3,

    validation_data=(test_images, to_categorical(y_test)),

    )

    # Predict on the first 10 test images.

    predictions = model.predict(test_images[:10])

    print(np.argmax(predictions, axis=1))

    # Check our predictions against the ground truths.

    print(x_test[:10])

    ```


