    In most probability models, it is assumed that distribution of data is Gaussian
    or normal. For example, there can be evidence of skewness in a trend that causes
    “spikes” in the time plot that are all in the same direction.


    To transform the data in a normal distribution, the most common transform is to
    subtract the mean and then divide by the standard deviation. I gave an example
    of this transformation in the RNN example in Chapter [5](#458833_2_En_5_Chapter.xhtml);
    I’ll give another in the final example of the current chapter. The logic behind
    this transformation is it makes the mean 0 and the standard deviation 1, which
    is a characteristic of a normal distribution. Another popular transformation is
    to use the logarithm. The major advantage of a logarithm is it reduces the variation
    and logarithm of Gaussian distribution data that is also Gaussian. Transformation
    may be problem-specific or domain-specific. For instance, in a time series of
    an airline’s passenger load data, the series can be normalized by dividing by
    the number of days in the month or by the number of holidays in a month.


    #### Cyclic Variation


    In some time series, seasonality is not a constant but a stochastic variable.
    That is known as *cyclic variation*. In this case, the periodicity first has to
    be predicted and then has to be removed in the same way as done for seasonal variation.


    #### Irregular Fluctuations


    A time series without trends and cyclic variations can be realized as a weekly
    stationary time series. In the next section, you will examine various probabilistic
    models to realize weekly time series.


    ## Stationary Time Series


    Normally, a time series is said to be stationary if there is no systematic change
    in mean and variance and if strictly periodic variations have been done away with.
    In real life, there are no stationary time series. Whatever data you receive by
    using transformations, you may try to make it somehow nearer to a stationary series.


    ### Stationary Process


    A time series is strictly stationary if the joint distribution of X(t[1]),...,X(t[k])
    is the same as the joint distribution of X(t[1] + τ),...,X(t[k] + τ) for all t[1],…,t[k],τ.
    If k=1, strict stationary implies that the distribution of X(t) is the same for
    all t, so provided the first two moments are finite, you have the following:


    ![$$ \mu \left(\textrm{t}\right)=\mu $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equk.png)


    ![$$ {\sigma}^2\left(\textrm{t}\right)={\sigma}^2 $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equl.png)


    They are both constants, which do not depend on the value of t.


    A weekly stationary time series is a stochastic process where the mean is constant
    and autocovariance is a function of time lag.


    ### Autocorrelation and the Correlogram


    Quantities called *sample autocorrelation coefficients* act as an important guide
    to the properties of a time series. They evaluate the correlation, if any, between
    observations at different distances apart and provide valuable descriptive information.
    You will see that they are also an important tool in model building and often
    provide valuable clues for a suitable probability model for a given set of data.
    The quantity lies in the range [-1,1] and measures the forcefulness of the linear
    association between the two variables. It can be easily shown that the value does
    not depend on the units in which the two variables are measured; if the variables
    are independent, then the ideal correlation is zero.


    A helpful supplement in interpreting a set of autocorrelation coefficients is
    a graph called a *correlogram*. The correlogram may be alternatively called the
    *sample autocorrelation function*.


    Suppose a stationary stochastic process X(t) has a mean *μ*, variance σ², auto
    covariance function (acv.f.) *γ*(*t*), and auto correlation function (ac.f.) *ρ*(τ).


    ![$$ \rho \left(\tau \right)=\frac{\gamma \left(\tau \right)}{\gamma (0)}=\gamma
    \left(\tau \right)/{\sigma}^2 $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equm.png)


    ### Estimating Autocovariance and Autocorrelation Functions


    In the stochastic process, the autocovariance is the covariance of the process
    with itself at pairs of time points. Autocovariance is calculated as follows:


    ![$$ \gamma (h)=\frac{1}{n}\sum \limits_{t=1}^{n-\left|h\right|}\left({x}_{t+\left|h\right|}-\overline{x}\right)\left({x}_t-\overline{x}\right),-n&lt;h&lt;n
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equn.png)


    Figure [6-2](#458833_2_En_6_Chapter.xhtml#Fig2) shows a sample autocorrelation
    distribution.


    ![](images/458833_2_En_6_Chapter/458833_2_En_6_Fig2_HTML.jpg)


    A pair of simulated discrete-time sequences for autocorrelation and partial autocorrelations.
    Both plots have the highest peak of 0 at 1 point 0.


    Figure 6-2


    Sample autocorrelations


    ## Time-Series Analysis with Python


    A complement to SciPy for statistical computations including descriptive statistics
    and estimation of statistical models is provided by Statsmodels, which is a Python
    package. Besides the early models, linear regression, robust linear models, generalized
    linear models, and models for discrete data, the latest release of scikits.statsmodels
    includes some basic tools and models for time-series analysis, such as descriptive
    statistics, statistical tests, and several linear model classes. The linear model
    classes include autoregressive (AR), autoregressive moving-average (ARMA), and
    vector autoregressive models (VAR).


    ### Useful Methods


    Let’s start with a moving average.


    #### Moving Average Process


    Suppose that {Z[t]} is a purely random process with mean 0 and variance *σ*[*z*]².
    Then a process {X[t]} is said to be a moving average process of order q.


    ![$$ {X}_t={\beta}_0{Z}_t+{\beta}_1{Z}_{t-1}+\dots +{\beta}_{\textrm{q}}{Z}_{t-q}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equo.png)


    Here, {*β*[*i*]} are constants. The Zs are usually scaled so that *β*[0] = 1.


    ![$$ {\displaystyle \begin{array}{l}E\left({X}_t\right)=0\\ {} Var\left({X}_t\right)={\sigma}_Z^2\sum
    \limits_{i=0}^q{\beta}_i^2\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equp.png)


    The Zs are independent.


    ![$$ {\displaystyle \begin{array}{c}\gamma (k)= Cov\ \left({X}_t,{X}_{t+k}\right)\\
    {}= Cov\left({\beta}_0{Z}_t+\dots +{\beta}_q{Z}_{t-q},{\beta}_0{Z}_{t+k}+\dots
    +{\beta}_q{Z}_{t+k-q}\right)\\ {}=\left\{\vdash \begin{array}{cc}0&amp; k&gt;q\\
    {}{\sigma}_Z^2\sum \limits_{i=0}^{q-k}{\beta}_i{\beta}_{i+k}&amp; k=0,1,\dots,
    q\\ {}\gamma \left(-k\right)&amp; k&lt;0\end{array}\right.\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equq.png)


    ![$$ Cov\ \left({\textrm{Z}}_s,{Z}_t\right)=\left\{\begin{array}{cc}{\sigma}_Z^2&amp;
    s=t\\ {}0&amp; s\ne t\end{array}\right. $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equr.png)


    As *γ*(*k*) is not dependent on t and the mean is constant, the process is second-order
    stationary for all values of {*β*[*i*]}.


    ![$$ \rho (k)=\left\{\begin{array}{cc}1&amp; k=0\\ {}\sum \limits_{i=0}^{q-k}{\beta}_i{\beta}_{i+k}/\sum
    \limits_{i=0}^q{\beta}_i^2&amp; k=1,\dots, q\\ {}0&amp; k&gt;q\\ {}\rho \left(-k\right)&amp;
    k&lt;0\end{array}\right. $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equs.png)'
  trans: '

    ### 使数据分布正态化


    在大多数概率模型中，都假设数据分布是高斯分布或正态分布。例如，趋势中可能存在偏态证据，导致时间图中出现方向一致的“尖峰”。


    要将数据转换为正态分布，最常见的变换是减去均值，然后除以标准差。我在第 5 章的 RNN 示例中给出了这种变换的例子；在本章的最后一个示例中，我将再给出一个。这种变换背后的逻辑是，它使均值为
    0，标准差为 1，这是正态分布的一个特征。另一种流行的变换是使用对数。对数的主要优点是它能减少变异，并且高斯分布数据的对数仍然是高斯分布。变换可能是特定于问题或特定于领域的。例如，在航空公司的乘客载客量时间序列中，可以通过除以该月的天数或该月的假期数来对序列进行归一化。


    #### 循环变动


    在某些时间序列中，季节性并非恒定，而是一个随机变量。这被称为*循环变动*。在这种情况下，首先需要预测周期性，然后以与处理季节性变动相同的方式将其移除。


    #### 不规则波动


    没有趋势和循环变动的时间序列可以被视为弱平稳时间序列。在下一节中，你将研究各种概率模型来实现弱平稳时间序列。


    ## 平稳时间序列


    通常，如果时间序列的均值和方差没有系统性变化，并且严格的周期性变化已被消除，则称该时间序列是平稳的。在现实生活中，不存在平稳的时间序列。无论你通过变换获得什么数据，你都可以尝试使其在某种程度上更接近平稳序列。


    ### 平稳过程


    如果对于所有 `t[1],…,t[k],τ`，`X(t[1]),...,X(t[k])` 的联合分布与 `X(t[1] + τ),...,X(t[k] +
    τ)` 的联合分布相同，则该时间序列是严格平稳的。如果 `k=1`，严格平稳意味着 `X(t)` 的分布对于所有 `t` 都是相同的，因此，假设前两阶矩是有限的，则有：


    ![$$ \mu \left(\textrm{t}\right)=\mu $$](img/458833_2_En_6_Chapter_TeX_Equk.png)


    ![$$ {\sigma}²\left(\textrm{t}\right)={\sigma}² $$](img/458833_2_En_6_Chapter_TeX_Equl.png)


    两者都是常数，不依赖于 `t` 的值。


    弱平稳时间序列是一个随机过程，其均值是常数，自协方差是时间滞后的函数。


    ### 自相关与相关图


    称为*样本自相关系数*的量是了解时间序列性质的重要指南。它们评估不同距离的观测值之间是否存在相关性，并提供有价值的描述性信息。你将看到，它们也是模型构建中的重要工具，并且通常为给定数据集选择合适的概率模型提供有价值的线索。该系数的取值范围为
    `[-1,1]`，衡量两个变量之间线性关联的强度。可以很容易地证明，该值不依赖于两个变量的测量单位；如果变量是独立的，那么理想的相关性为零。


    在解释一组自相关系数时，一个有用的辅助工具是称为*相关图*的图形。相关图也可以称为*样本自相关函数*。


    假设一个平稳随机过程 `X(t)` 具有均值 `μ`、方差 `σ²`、自协方差函数 (acv.f.) `γ(t)` 和自相关函数 (ac.f.) `ρ(τ)`。


    ![$$ \rho \left(\tau \right)=\frac{\gamma \left(\tau \right)}{\gamma (0)}=\gamma
    \left(\tau \right)/{\sigma}² $$](img/458833_2_En_6_Chapter_TeX_Equm.png)


    ### 估计自协方差和自相关函数


    在随机过程中，自协方差是过程自身在成对时间点上的协方差。自协方差的计算如下：


    ![$$ \gamma (h)=\frac{1}{n}\sum \limits_{t=1}^{n-\left|h\right|}\left({x}_{t+\left|h\right|}-\overline{x}\right)\left({x}_t-\overline{x}\right),-n&lt;h&lt;n
    $$](img/458833_2_En_6_Chapter_TeX_Equn.png)


    图 6-2 显示了一个样本自相关分布。


    ![](img/458833_2_En_6_Fig2_HTML.jpg)


    一对用于自相关和偏自相关的模拟离散时间序列。两个图在点 0 处都有最高峰值为 0。


    图 6-2


    样本自相关


    ## 使用 Python 进行时间序列分析


    `Statsmodels` 是一个 Python 包，它为包括描述性统计和统计模型估计在内的统计计算提供了对 `SciPy` 的补充。除了早期的模型、线性回归、稳健线性模型、广义线性模型和离散数据模型之外，`scikits.statsmodels`
    的最新版本还包含了一些用于时间序列分析的基本工具和模型，例如描述性统计、统计检验以及几个线性模型类。这些线性模型类包括自回归 (AR)、自回归移动平均 (ARMA)
    和向量自回归模型 (VAR)。


    ### 有用的方法


    让我们从移动平均开始。


    #### 移动平均过程


    假设 `{Z[t]}` 是一个均值为 0、方差为 `σ[z]²` 的纯随机过程。那么，过程 `{X[t]}` 被称为 `q` 阶移动平均过程。


    ![$$ {X}_t={\beta}_0{Z}_t+{\beta}_1{Z}_{t-1}+\dots +{\beta}_{\textrm{q}}{Z}_{t-q}
    $$](img/458833_2_En_6_Chapter_TeX_Equo.png)


    这里，`{β[i]}` 是常数。`Zs` 通常被缩放，使得 `β[0] = 1`。


    ![$$ {\displaystyle \begin{array}{l}E\left({X}_t\right)=0\\ {} Var\left({X}_t\right)={\sigma}_Z²\sum
    \limits_{i=0}^q{\beta}_i²\end{array}} $$](img/458833_2_En_6_Chapter_TeX_Equp.png)


    `Zs` 是独立的。


    ![$$ {\displaystyle \begin{array}{c}\gamma (k)= Cov\ \left({X}_t,{X}_{t+k}\right)\\
    {}= Cov\left({\beta}_0{Z}_t+\dots +{\beta}_q{Z}_{t-q},{\beta}_0{Z}_{t+k}+\dots
    +{\beta}_q{Z}_{t+k-q}\right)\\ {}=\left\{\vdash \begin{array}{cc}0&amp; k&gt;q\\
    {}{\sigma}_Z²\sum \limits_{i=0}^{q-k}{\beta}_i{\beta}_{i+k}&amp; k=0,1,\dots,
    q\\ {}\gamma \left(-k\right)&amp; k&lt;0\end{array}\right.\end{array}} $$](img/458833_2_En_6_Chapter_TeX_Equq.png)


    ![$$ Cov\ \left({\textrm{Z}}_s,{Z}_t\right)=\left\{\begin{array}{cc}{\sigma}_Z²&amp;
    s=t\\ {}0&amp; s\ne t\end{array}\right. $$](img/458833_2_En_6_Chapter_TeX_Equr.png)


    由于 `γ(k)` 不依赖于 `t` 且均值是常数，因此对于所有 `{β[i]}` 的值，该过程都是二阶平稳的。


    ![$$ \rho (k)=\left\{\begin{array}{cc}1&amp; k=0\\ {}\sum \limits_{i=0}^{q-k}{\beta}_i{\beta}_{i+k}/\sum
    \limits_{i=0}^q{\beta}_i²&amp; k=1,\dots, q\\ {}0&amp; k&gt;q\\ {}\rho \left(-k\right)&amp;
    k&lt;0\end{array}\right. $$](img/458833_2_En_6_Chapter_TeX_Equs.png)

