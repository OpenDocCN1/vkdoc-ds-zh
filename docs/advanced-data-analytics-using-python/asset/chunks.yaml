    Introduction


    We are living in the data science/artificial intelligence era. To thrive in this
    environment, where data drives decision-making in everything from business to
    government to sports and entertainment, you need the skills to manage and analyze
    huge amounts of data. Together we can use this data to make the world better for
    everyone. In fact, humans have yet to find everything we can do using this data.
    So, let us explore!


    Our objective for this book is to empower you to become a leader in this data-transformed
    era. With this book you will learn the skills to develop AI applications and make
    a difference in the world.


    This book is intended for advanced user, because we have incorporated some advanced
    analytics topics. Important machine learning models and deep learning models are
    explained with coding exercises and real-world examples.


    All the source code used in this book is available for download at [`https://github.com/apress/advanced-data-analytics-python-2e`](https://github.com/apress/advanced-data-analytics-python-2e).


    Happy reading!


    Acknowledgments


    Thanks to Labonic Chakraborty (Ripa) and Soumili Chakraborty.


    About the Authors About the Technical Reviewer


    # 1. A Birds Eye View to AI System


    In this book, we assume that you are familiar with Python programming. In this
    introductory chapter, we explain why a data scientist should choose Python as
    a programming language. Then we highlight some situations where Python may not
    be the ideal choice. Finally, we describe some best practices for application
    development and give some coding examples that a data scientist may need in their
    day-to-day job.


    ## OOP in Python


    In this section, we explain some features of object-oriented programming (OOP)
    in a Python context.


    The most basic element of any modern application is an *object*. To a programmer
    or architect, the world is a collection of objects. Objects consist of two types
    of members: *attributes* and *methods*. Members can be private, public, or protected.
    *Classes* are data types of objects. Every object is an instance of a class. A
    class can be inherited in child classes. Two classes can be associated using *composition*.


    Python has no keywords for public, private, or protected, so *encapsulation* (hiding
    a member from the outside world) is not implicit in Python. Like C++, it supports
    multilevel and multiple inheritance. Like Java, it has an `abstract` keyword.
    Classes and methods both can be abstract.


    In the following code, we are describing an object-oriented question-answering
    system without any machine learning. The program’s input is a set of dialogs in
    `input.txt`, as shown here:


    ```

    glob is I

    prok is V

    pish is X

    tegj is L

    glob glob Silver is 34 Credits

    glob prok Gold is 57800 Credits

    pish pish Iron is 3910 Credits

    how much is pish tegj glob glob ?

    how many Credits is glob prok Silver ?

    how many Credits is glob prok Gold ?

    how many Credits is glob prok Iron ?

    how much wood could a woodchuck chuck if a woodchuck could chuck wood?

    Program has a knowledge base in config.txt.

    I,1,roman

    V,5,roman

    X,10,roman

    L,50,roman

    C,100,roman

    D,500,roman

    M,1000,roman

    ```


    Based on this input and the configuration program, the answer to the question
    is given in `input.txt` in standard output, as shown here:


    ```

    pish tegj glob glob is 42

    glob prok Silver is 68 Credits

    glob prok Gold is 57800 Credits

    glob prok Iron is 782 Credits

    I have no idea what you are talking about

    ```


    The parsing logic is in the `Observer` class.


    ```

    import operator

    #this class verify the validity of input

    class Observer(object):

    #store frequecy of symbols

    length = {}

    #most frequent symbol

    symbol = ''''

    #count of most frequent symbol

    count = 0

    #calling class

    compiler = None

    def __init__(self,cmpiler):

    self.compiler = cmpiler

    def initialize(self, arr):

    for i in range(len(arr)):

    self.length[arr[i]] = 0

    #increase count for each occurence of symbol

    def increment(self,symbol):

    self.length[symbol] = self.length[symbol] + 1

    #claculate most frequent symbol and it''s count

    def calculate(self):

    self.symbol,self.count = max(self.length.items(), key=operator.itemgetter(1))

    #verify if wrong symbol is subtracted ie ( V, ..

    def verifySubstract(self, current):

    while current % 10 != 0:

    current = current / 10

    if current == 5:

    raise Exception("Wrong Substraction")

    def evaluate(self):

    #check mximum repeatation is crossing the limit

    if self.count > 3:

    raise Exception("Repeat more than 3")

    #symbol is proper or not

    if self.symbol not in self.compiler.symbol_map:

    raise Exception("Wrong Symbol")

    #check if wrong symbol is repeated ie (V, ..

    self.symbol,unit = self.compiler.evaluateSymbol(self.symbol)

    while self.symbol % 10 != 0:

    self.symbol = self.symbol / 10

    if self.count > 1 and  self.symbol == 5:

    raise Exception("Wrong Symbol repeated")

    #checking if input sentence is proper or not

    def evaluateSentence(self, line):

    if "is" not in line:

    return "I have no idea what you are talking about"

    ```


