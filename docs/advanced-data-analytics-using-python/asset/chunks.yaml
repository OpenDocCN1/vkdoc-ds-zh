- fmt: '# High-Performance API and Concurrent Programming


    Flask is a good choice when you are building a general solution that is also a
    graphical user interface (GUI). But if high performance is the most critical requirement
    of your application, then Falcon is the best choice. The following code is an
    example of the same model shown previously exposed by the Falcon framework. Another
    improvement we made in this code is that we implemented multithreading, so the
    code will be executed in parallel. In addition to the Falcon-specific changes,
    you should note the major changes in parallelizing the calling `get_score` function
    using a thread pool class.


    ```python

    import falcon

    from falcon_cors import CORS

    import json

    from sqlalchemy import *

    from sqlalchemy.orm import sessionmaker

    import pygeoip

    from pymongo import MongoClient

    import json

    import datetime as dt

    import ipaddress

    import math

    from concurrent.futures import *

    from sqlalchemy.engine import Engine

    from sqlalchemy import event

    import sqlite3

    @event.listens_for(Engine, "connect")

    def set_sqlite_pragma(dbapi_connection, connection_record):

    cursor = dbapi_connection.cursor()

    cursor.execute("PRAGMA cache_size=100000")

    cursor.close()

    class Predictor(object):

    def __init__(self,domain):

    db1 = create_engine(''sqlite:///score_'' + domain + ''0test.db'')

    metadata1 = MetaData(db1)

    self.scores = Table(''scores'', metadata1, autoload=True)

    client = MongoClient(connect=False,maxPoolSize=1)

    self.db = client.frequency

    self.gi = pygeoip.GeoIP(''GeoIP.dat'')

    self.high = 1.2

    self.low = .8

    def get_hour(self,timestamp):

    return dt.datetime.utcfromtimestamp(timestamp / 1e3).hour

    def get_score(self, featurename, featurevalue):

    pred = 0

    s = self.scores.select((self.scores.c.feature_name == featurename) & (self.scores.c.feature_value
    == featurevalue))

    rs = s.execute()

    row = rs.fetchone()

    if row is not None:

    pred = pred + float(row[''score''])

    res = self.db.frequency.find_one({"ip" : ip})

    freq = 1

    if res is not None:

    freq = res[''frequency'']

    pred2, prob2 = self.get_score(''frequency'', str(freq))

    return (pred1 + pred2), (prob1 + prob2)

    conn = sqlite3.connect(''multiplier.db'')

    cursor = conn.execute("SELECT high,low from multiplier where domain=''" + value
    + "''")

    row = cursor.fetchone()

    if row is not None:

    self.high = row[0]

    self.low = row[1]

    return self.get_score(f, value)

    def on_post(self, req, resp):

    input_json = json.loads(req.stream.read(),encoding=''utf-8'')

    input_json[''ip''] = unicode(req.remote_addr)

    pred = 1

    prob = 1

    with ThreadPoolExecutor(max_workers=8) as pool:

    future_array = { pool.submit(self.get_value,f,input_json[f]) : f for f in input_json}

    for future in as_completed(future_array):

    pred1, prob1 = future.result()

    pred = pred + pred1

    prob = prob - prob1

    resp.status = falcon.HTTP_200

    res = math.exp(pred)-1

    if res = .9):

    prob = .9

    multiplier = self.low + (self.high -self.low)*prob

    pred = multiplier*pred

    resp.body = str(pred)

    cors = CORS(allow_all_origins=True,allow_all_methods=True,allow_all_headers=True)

    wsgi_app = api = falcon.API(middleware=[cors.middleware])

    f = open(''publishers1.list'')

    for domain in f:

    domain = domain.strip()

    p = Predictor(domain)

    url = ''/predict/'' + domain

    api.add_route(url, p)

