- fmt: '# Recurrent Neural Network


    A *recurrent neural network* is an extremely popular kind of network where the
    output of the previous step goes to the feedback or is input to the hidden layer.
    It is an extremely useful solution for a problem like a sequence leveling algorithm
    or time-series prediction. One of the more popular applications of the sequence
    leveling algorithm is in an autocomplete feature of a search engine.


    ## LSTM


    In an RNN, the network takes feedback from past. `X[(t)] = K × X[(t − 1)] = K²
    × X[(t − 2)] = K^(N) × X[(t − N)]`. Now, if `K > 1`, then `K^(N)` is very large;
    otherwise, if `K < 1`, then `K^(N)` is very small. To avoid this problem, network
    programmatically forgets some of its past state. LSTM does this.


    This way, it can remember values over arbitrary intervals. LSTM works very well
    to classify, process, and predict time series given time lags of unknown duration.
    Relative insensitivity to gap length gives an advantage to LSTM over alternative
    RNNs, hidden Markov models, and other sequence learning methods.


    RNN and HMM rely on the hidden state before emission/sequence. If we want to predict
    the sequence after 500 intervals instead of 5, LSTM can remember the states and
    predict properly.


    To simplify this, suppose a person forgets old memories and remembers only recent
    things. But they need those memories from the past to perform some tasks in the
    future. This is the problem with traditional RNNs. Also, there is another person
    who remembers the important memories from the past along with the recent ones
    and deletes the useless memories from the past. This way, they can use that information
    to carry out the task more efficiently. This is the case with LSTM.


    Each LSTM cell has three inputs, `h[{t − 1}]`, `c[{t − 1}]`, and `x[t]`, and two
    outputs, `h[t]` and `c[t]`. For a given time `t`, `h[t]` is the hidden state,
    `c[t]` is the cell state or memory, and `x[t]` is the current data point or input.
    The first sigmoid layer has two inputs, `h[{t − 1}]` and `x[t]`, where `h[{t −
    1}]` is the hidden state of the previous cell. It is known as the *forget gate*
    as its output selects the amount of information of the previous cell to be included.
    The output is a number in `[0,1]`, which is multiplied (pointwise) with the previous
    cell state `c[{t − 1}]`.


    The network packet is a sequence, so the RNN can readily be applied to an anomaly
    detection system. One difference is that we store data in a cloud database and
    sort it by IP address and ports. This sorting is crucial since without a suitable
    sequence, you will not get a good result. The autocorrelation function, which
    is discussed in Chapter [3](#458833_2_En_3_Chapter.xhtml), can be used to determine
    whether the sequence is correct.


