    Neo4j REST 服务器。因此，`neo4j-rest-client` API 的结构与 `python-embedded` 完全同步。但是，为了达到更
    Pythonic 的风格，并利用 Neo4j 团队引入的新特性来增强 API，引入了一种新的结构。


    ## 内存数据库


    另一类重要的数据库是内存数据库。这种类型在 RAM 中存储和处理数据。因此，对数据库的操作很快，但数据是易失的。SQLite 是一个流行的内存数据库示例。在
    Python 中，你需要使用 `sqlalchemy` 库来操作 SQLite。在第 1 章的 Flask 和 Falcon 示例中，我向你展示了如何从 SQLite
    中选择数据。这里我将展示如何将 Pandas 数据帧存储到 SQLite 中：


    ```

    from sqlalchemy import create_engine

