    \ radius, and hue for\n# the circle\n(dx, dy) = np.random.randint(5, 10, size=(2,))\n\
    r = np.random.randint(5, 8)\nhue = random.choice(hues)[::-1]\n# draw the circle\
    \ on the canvas\ncv2.circle(canvas, (x + dx, y + dy), r, hue, -1)\n# pad the border\
    \ of the image\ncanvas = cv2.copyMakeBorder(canvas, 5, 5, 5, 5, cv2.BORDER_CONSTANT,\n\
    value=(255, 255, 255))\n```\n\nLines 9–13 of the previous code set up five different\
    \ colors of red, green, and blue. When we draw our colors on our canvas on line\
    \ 16, we’ll take a random sample from this list. Lines 19–28 deal with the actual\
    \ procedure of drawing the random blobs. We begin by looping through the entire\
    \ image in increments of 20 pixels. Then, in lines 23 and 24, we produce a random\
    \ (x, y)-coordinate for the blob’s center (line 23), select a random radius for\
    \ the blob (line 24), and sample from our colors list on line 25\\. The hue list\
    \ is in RGB order; we’ll invert it to BGR order so that OpenCV can draw it appropriately.\
    \ Lastly, we use the randomly generated values to draw a circle on our canvas.\
    \ Figure [4-2](#458833_2_En_4_Chapter.xhtml#Fig2) shows the output of this code.\n\
    \n## Thresholding\n\nWe need to identify each blob and extract color characteristics\
    \ to describe them now that we have our artificial image of blobs. Here’s an example\
    \ using thresholding, for example:\n\n```\n# convert the canvas to grayscale,\
    \ threshold it, and detect\n# contours in the image\ngray = cv2.cvtHue(canvas,\
    \ cv2.HUE_BGR2GRAY)\ngray = cv2.bitwise_not(gray)\nthresh = cv2.threshold(gray,\
    \ 10, 255, cv2.THRESH_BINARY)[1]\ncnts = cv2.findContours(gray.copy(), cv2.RETR_LIST,\
