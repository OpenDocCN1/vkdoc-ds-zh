    Now we’ll discuss the classification problems of supervised learning.


    ## Classifications with Python


    Classification is a well-accepted example of machine learning. It has a set of
    a target classes and training data. Each training data is labeled by a particular
    target class. The classification model is trained by training data and predicts
    the target class of test data. One common application of classification is in
    fraud identification in the credit card or loan approval process. It classifies
    the applicant as fraud or nonfraud based on data. Many uneducated shopkeepers
    classify their goods without doing any calculations. They did not buy a product
    that did not sell well the last week. It is a Bayesian classifier of some sort.
    The advertising industry blocks impressions with the previous week’s average price
    below a certain threshold. Classification is also widely used in image recognition.
    From a set of images, if you recognize the image of a computer, it is classifying
    the image of a computer and not of a computer class.


    Sentiment analysis is a popular application of text classification. Suppose an
    airline company wants to analyze its customer textual feedback. Then each feedback
    is classified according to sentiment (positive/negative/neutral) and also according
    to context (about staff/timing/food/price). Once this is done, the airline can
    easily find out what the strength of that airline’s staff is or its level of punctuality
    or cost effectiveness or even its weakness. Broadly, there are three approaches
    in classification.


    *   *Rule-based approach*: I will discuss the decision tree and random forest
    algorithm.

    *   *Probabilistic approach*: I will discuss the naïve Bayes algorithm.

    *   *Distance-based approach*: I will discuss the support vector machine.


    ## Semi-Supervised Learning


    Classification and regression are types of supervised learning. In this type of
    learning, you have a set of training data where you train your model. Then the
    model is used to predict test data. For example, suppose you want to classify
    text according to sentiment. There are three target classes: positive, negative,
    and neutral. To train your model, you have to choose some sample text and label
    it as positive, negative, and neutral. You use this training data to train the
    model. Once your model is trained, you can apply your model to test data. For
    example, you may use the naïve Bayes classifier for text classification and try
    to predict the sentiment of the sentence “Food is good.” In the training phase,
    the program will calculate the probability of a sentence being positive or negative
    or neutral when the words *Food*, *is*, and *good* are presented separately and
    stored in the model, and in the test phase it will calculate the joint probability
    when *Food*, *is*, and *good* all come together.


    Conversely, clustering is an example of unsupervised learning where there is no
    training data or target class available. The program learns from data in one shot.
    There is an instance of semi-supervised learning also. Suppose you are classifying
    the text as positive and negative sentiments but your training data has only positives.
    The training data that is not positive is unlabeled. In this case, as the first
    step, you train the model assuming all unlabeled data is negative and apply the
    trained model on the training data. In the output, the data coming in as negative
    should be labeled as negative. Finally, train your model with the newly labeled
    data. The nearest neighbor classifier is also considered as semi-supervised learning.
    It has training data, but it does not have the training phase of the model.


    ## Decision Tree


    A *decision tree* is a tree of rules. Each level of the tree represents a parameter,
    each node of the level validates a constraint for that level parameter, and each
    branch indicates a possible value of a parent node parameter. Figure [3-2](#458833_2_En_3_Chapter.xhtml#Fig2)
    shows an example of a decision tree.


    ![](images/458833_2_En_3_Chapter/458833_2_En_3_Fig2_HTML.png)


    A tree diagram with a parent node outlook lists the humidity and wind based on
    sunny, overcast, and rainy climatic conditions.


    Figure 3-2


    Example of decision tree for good weather'
