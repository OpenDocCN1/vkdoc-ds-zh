    Having covered design patterns in Python a bit, let’s now take a look at some
    essential architecture patterns for data scientists.


    ## Choosing the Right Database


    Before we go, we’ll leave a note for manager on which database is best for which
    case.


    - A relational database (MySQL, Oracle, SQL Server) is the preferable choice when
    data is highly structured and entities have a clear and strict connection. Mongo,
    on the other hand, is a better choice when data is unstructured and unorganized.

    - Elastic Search or Solr is a better choice when data contains a lengthy textual
    field and you’re executing lots of searches in a substring of the text field.
    With Elastic Search, you get a free data visualization tool called Kibana as well
    as an ETL tool called Logstash, and full-stack data analytics solutions are fashionable.

    - Data must sometimes be represented as a graph. In that situation, a graph database
    is required. Neo4j is a popular graph database that comes with many utility tools
    at a low price.

    - We occasionally require a quick application. In that situation, an in-memory
    database like SQLite can be used. However, SQLite does not support updating your
    database from a remote host.


    You’ll learn more about databases in Chapter [2](#458833_2_En_2_Chapter.xhtml).


    ## Summary


    In this chapter, we discussed fundamental engineering principles for data scientists,
    which are covered in separate chapters. The question-answering example can help
    you understand how to organize your code. The basic rule is to not put everything
    into one class. Divide your code into many categories and use parent-child relationships
    where they exist. Then you learned how to use Python to call other languages’
    code. We provided two instances of R and Java code calls. Then we showed you how
    to expose your model as a REST API and make it perform well by using concurrent
    programming. Following that, we covered significant architectural patterns from
    data scientists.


    # 2. ETL with Python


    Every data science professional has to extract, transform, and load (ETL) data
    from different data sources. In this chapter, we will discuss how to perform ETL
    with Python for a selection of popular databases. For a relational database, we’ll
    cover MySQL. As an example of a document database, we will cover Elasticsearch.
    For a graph database, we’ll cover Neo4j, and for NoSQL, we’ll cover MongoDB. We
    will also discuss the Pandas framework, which was inspired by R’s data frame concept.


    ETL is based on a process in which data is extracted from multiple sources, transformed
    into specific formats that involve cleaning enrichment, and finally loaded into
    its target destination. The following are the details of each process:


    1. *Extract*: During data extraction, source data is pulled from a variety of
    sources and moved to a staging area, making the data available to subsequent stages
    in the ETL process. After that, the data undergoes the cleaning and enrichment
    stage, also known as data cleansing.

    2. *Transform*: In this stage, the source data is matched to the format of the
    target system. This includes steps such as changing data types, combining fields,
    splitting fields, etc.

    3. *Load*: This stage is the final ETL stage. Here, data is loaded into the data
    warehouse in an automated manner and can be periodically updated. Once completed,
    the data is ready for data analysis.


    The previous processes are important in any data analytics work. Once the data
    goes through the ETL processes, then it becomes possible to analysis the data,
    find insights, and so on.


    We will discuss various types of ETL throughout this chapter. We discussed in
    Chapter [1](#458833_2_En_1_Chapter.xhtml) that data is not an isolated thing.
    We need to load data from somewhere, which is a database. We need to fetch the
    data from some application, which is extraction. In this chapter and the next,
    we will discuss various feature engineering that transforms the data from one
    form to another.


    ## MySQL


    `MySQLdb` is an API in Python developed to work on top of the MySQL C interface.'
