- fmt: '### First Normal Form


    There are no repeating groups in the *first normal form* since only single values
    are allowed at the intersection of each row and column.


    To get to first normal form, remove the repetitive groups, and establish two new
    relations to normalize a connection with a repeating group.


    For unique identification, the new connection''s `PK` is a combination of the
    old relation''s `PK` and a feature from the newly formed relation.


    To demonstrate the procedure for `1NF`, we''ll use the `Student_Grade_Report`
    table, which comes from a `School` database.


    1. The recurring group in the `Student_Grade_Report` table contains the course
    information. A student can enroll in a variety of courses.

    2. Get rid of the group that keeps repeating itself. That''s each student''s course
    information in this situation.

    3. Determine your new table''s `PK`.

    4. The attribute value must be identified uniquely by the `PK` (`StudentNo` and
    `CourseNo`).


    ```

    Student_Grade_Report (StudentNo, StudentName, Major, CourseNo, CourseName, InstructorNo,
    InstructorName, InstructorLocation, Grade)

    ```


    ```

    Student (StudentNo, StudentName, Major)

    StudentCourse (StudentNo, CourseNo, CourseName, InstructorNo, InstructorName,
    InstructorLocation, Grade)

    ```


    ### Second Normal Form


    The relation must first be in `1NF` for the *second normal form*. If and only
    if the `PK` contains a single feature, the relationship is automatically in `2NF`.


    If the connection contains a composite `PK`, then each nonkey property must be
    completely reliant on the entire `PK`, not just a portion of it (i.e., there can''t
    be any partial augmentation or dependency).


    A table must first be in `1NF` before moving to `2NF`.


    1. As it has a single-column `PK`, the `Student` table is already in `2NF`.

    2. When looking at the `StudentCourse` table, you can observe that not all of
    the characteristics, especially the course details, are completely dependent on
    the `PK`. The grade is the sole attribute that is entirely reliant on `xxx`.

    3. Locate the new table containing the course details.

    4. Determine the new table''s `PK`.


    The three new tables are as follows:


    **Student** `(StudentNo, StudentName, Major)`


    **CourseGrade** `(StudentNo, CourseNo, Grade)`


    **CourseInstructor** `(CourseNo, CourseName, InstructorNo, InstructorName, InstructorLocation)`


    ### Third Normal Form


    The connection must be in second normal form to be in *third normal form*. All
    transitive dependencies must be eliminated as well; a nonkey attribute cannot
    be functionally reliant on another nonkey attribute.


    This is the process for achieving `3NF`:


    1. From each table with a transitive relationship, remove all dependent characteristics
    in a transitive relationship.

    2. Make a new table with the dependence eliminated.

    3. Inspect new and updated tables to ensure that each table has a determinant
    and that no tables have improper dependencies.


    Take a look at the four new tables:


    ```

    Student (StudentNo, StudentName, Major)

    CourseGrade (StudentNo, CourseNo, Grade)

    Course (CourseNo, CourseName, InstructorNo)

    Instructor (InstructorNo, InstructorName, InstructorLocation)

    ```


    There should be no abnormalities in the third normal form at this point. For this
    example, consider the dependency diagram in Figure [2-1](#458833_2_En_2_Chapter.xhtml#Fig1).
    As previously said, the first step is to eliminate repeated groupings.


    ![](images/458833_2_En_2_Chapter/458833_2_En_2_Fig1_HTML.jpg)


    A stack depicts how the frames stud number, course number, course name, inst number,
    inst name, inst location, and grade are related by `PD`, `TD`, and `FD`.


    **Figure 2-1** Dependency diagram


    ```

    Student (StudentNo, StudentName, Major)

    StudentCourse (StudentNo, CourseNo, CourseName, InstructorNo, InstructorName,
    InstructorLocation, Grade)

    ```


    Review the dependencies in Figure [2-1](#458833_2_En_2_Chapter.xhtml#Fig1), which
    summarizes the normalization procedure for the `School` database.


    The following are the abbreviations used in Figure [2-1](#458833_2_En_2_Chapter.xhtml#Fig1):


    - `PD` stands for partially dependent.

    - `TD` stands for transitive dependence.

    - `FD` stands for full dependency. (`FD` stands for functional dependence in most
    cases. Figure [2-1](#458833_2_En_2_Chapter.xhtml#Fig1) is the only place where
    `FD` is used as an abbreviated form for full dependence.)


    A relational database is valuable when structured data and a strict relationship
    between the fields are maintained. But what if you do not have structured data
    in which a strict relationship between fields has been maintained? That''s where
    Elasticsearch comes in.


    ## Elasticsearch


    You''ll find that data is often unstructured. Meaning, you may end up with a mix
    of image data, sensor data, and other forms of data. To analyze this data, we
    first need to store it. MySQL or SQL-based databases are not good at storing unstructured
    data. So here we introduce a different kind of storage, which is mainly used to
    handle unstructured textual data.


    Elasticsearch is a Lucene-based database, which makes it is easy to store and
    search text data. Its query interface is a REST API endpoint. The Elasticsearch
    (`ES`) low-level client gives a direct mapping from Python to `ES` REST endpoints.
    One of the big advantages of Elasticsearch is that it provides a full-stack solution
    for data analysis in one place. Elasticsearch is the database. It has a configurable
    front end called Kibana, a data collection tool called Logstash, and an enterprise
    security feature called Shield.


    This example has features called `cat`, `cluster`, `indices`, `ingest`, `nodes`,
    `snapshot`, and `tasks` that translate to instances of `CatClient`, `ClusterClient`,
    `IndicesClient`, `CatClient`, `ClusterClient`, `IndicesClient`, `IngestClient`,
    `NodesClient`, `SnapshotClient`, `NodesClient`, `SnapshotClient`, and `TasksClient`,
    respectively. These instances are the only supported way to get access to these
    classes and their methods.


    You can specify your own connection class, which can be used by providing the
    `connection_class` parameter.


    ```

    # create connection to local host using the ThriftConnection

    Es1=Elasticsearch(connection_class=ThriftConnection)

    ```


    Installation commands for Elastic Search are given here:


    ```

    curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | sudo apt-key add
    -

    echo "deb https://artifacts.elastic.co/packages/7.x/apt stable main" | sudo tee
    -a /etc/apt/sources.list.d/elastic-7.x.list

    sudo apt update

    sudo apt install elasticsearch

    ```


    You can start Elasticsearch in Ubuntu with these commands:


    ```

    service elasticsearch start

    service elasticsearch stop

    ```


    You can check the status with these commands:


    ```

    service elasticsearch status

    ```


    ```

    # create connection that will automatically inspect the cluster to get

    # the list of active nodes. Start with nodes running on ''esnode1'' and

    # ''esnode2''

    Es1=Elasticsearch(

    [''esnode1'', ''esnode2''],

    # sniff before doing anything

    sniff_on_start=True,

    # refresh nodes after a node fails to respond

    sniff_on_connection_fail=True,

    # and also every 30 seconds

    sniffer_timeout=30

    )

    ```


    Different hosts can have different parameters (hostname, port number, SSL option);
    you can use one dictionary per node to specify them.


    ```

    # connect to localhost directly and

    another node using SSL on port 443

    # and an url_prefix. Note that ``port`` needs to be an int.

    Es1=Elasticsearch([

    {''host'':''localhost''},

    {''host'':''othernode'',''port'':443,''url_prefix'':''es'',''use_ssl'':True},

    ])

    ```


    SSL client authentication is also supported (see `Urllib3HttpConnection` for a
    detailed description of the options); an example is given here:


    ```

    Es1=Elasticsearch(

    [''localhost:443'',''other_host:443''],

    # turn on SSL

    use_ssl=True,

    # make sure we verify SSL certificates (off by default)

    verify_certs=True,

    # provide a path to CA certs on disk

    ca_certs=''path to CA_certs'',

    # PEM formatted SSL client certificate

    client_cert=''path to clientcert.pem'',

    # PEM formatted SSL client key

    client_key=''path to clientkey.pem''

    )

    ```'
