    is the minimum, there will be a single pair of objects that has a less than equal
    distance between two clusters. So, the single linkage method may be given as follows:


    ![$$ {\displaystyle \begin{array}{c}\textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\min
    \textrm{dist}\left(\textrm{X},\textrm{Y}\right)\\ {}\textrm{X}\text{\EUR} {\textrm{C}}_{\textrm{i}},\textrm{Y}\text{\EUR}
    {\textrm{C}}_{\textrm{j}}\end{array}} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equp.png)


    #### Complete Linkage Method


    In the complete linkage method, the distance between two clusters is the maximum
    distance of all distances between pairs of objects in two clusters. The distance
    is the maximum, so all pairs of distances are less than or equal to the distance
    between two clusters. So, the complete linkage method can be given by the following:


    ![$$ {\displaystyle \begin{array}{c}\textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\max
    \textrm{dist}\left(\textrm{X},\textrm{Y}\right)\\ {}\textrm{X}\text{\EUR} {\textrm{C}}_{\textrm{i}},\textrm{Y}\text{\EUR}
    {\textrm{C}}_{\textrm{j}}\end{array}} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equq.png)


    #### Average Linkage Method


    The average linkage method is a compromise between the previous two linkage methods.
    It avoids the extremes of large or compact clusters. The distance between clusters
    C[i] and C[j] is defined by the following:


    ![$$ \textrm{Dist}\left({\textrm{C}}_{\textrm{i}},{\textrm{C}}_{\textrm{j}}\right)=\frac{\sum_{\textrm{X}\text{\EUR}
    \textrm{Ci}}{\sum}_{\textrm{Y}\text{\EUR} {\textrm{C}}_{\textrm{j}}\vdash}\textrm{dist}\left(\textrm{X},\textrm{Y}\right)}{\left|{\textrm{C}}_{\textrm{i}}\right|\times
    \left|{\textrm{C}}_{\textrm{j}}\right|} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equr.png)


    | C[k] | is the number of data objects in cluster C[k].


    The centroid linkage method is similar to the average linkage method, but here
    the distance between the two clusters is actually the distance between the centroids.
    The centroid of cluster C[i] is defined as follows:


    ![$$ {\displaystyle \begin{array}{c}{\textrm{X}}_{\textrm{c}}=\vdash \left({\textrm{c}}_1,\dots
    .,{\textrm{c}}_{\textrm{m}}\right),\textrm{with}\\ {}{\textrm{c}}_{\textrm{j}}=1/\textrm{m}\sum
    {\textrm{X}}_{kj},\end{array}} $$](images/458833_2_En_4_Chapter/458833_2_En_4_Chapter_TeX_Equs.png)


    X[kj] is the j-th dimension of the k-th data object in cluster C[i].'
