    ## Reinforcement Learning


    We’ll talk about reinforcement learning in this section. Learning from feedback
    is referred to as *reinforcement learning*. Reinforcement learning is one of three
    main types of machine learning approach alongside supervised and unsupervised
    machine learning. It’s used to learn models by performing specific tasks in a
    given environment. The program interacts with its surroundings and performs actions
    to move between different states. Actions are then either positively or negatively
    considered through reward or penalty. Successful actions are reinforced, and unsuccessful
    actions are penalized. A model will go through many different iterations to find
    the best possible sequence of actions to achieve a given goal. The following is
    the algorithm behind it.


    ### TD0


    **Algorithm** The TD(0) tabular algorithm is implemented by this function. After
    each transition, this function must be called.


    **function** TD0(*X,R,Y,V* ):


    *   *X =* Last state


    *   *Y =* Next State


    *   *R =* Instant reward connected with this transition


    *   *V =* Array of estimated value


    ![$$ \delta =R+\gamma \left[V(Y)-V(X)\right] $$](images/458833_2_En_5_Chapter/458833_2_En_5_Chapter_TeX_Equj.png)


    ![$$ V\left[Y\right]=V\left[X\right]+\alpha \bullet \delta $$](images/458833_2_En_5_Chapter/458833_2_En_5_Chapter_TeX_Equk.png)


    where α is step size.


    **return** *V*


    Please pass the following file in a command prompt while running this function:


    [`https://github.com/Apress/advanced-data-analytics-python-2e/blob/main/reinforcement_learning_td0_reduce_dat.csv`](https://github.com/Apress/advanced-data-analytics-python-2e/blob/main/reinforcement_learning_td0_reduce_dat.csv)


    Here is an example of four-step TD0 with alpha and gamma 1:'
