    ## HDFS 文件系统


    除了 MapReduce，HDFS 是 Hadoop 框架中的第二个组件。它旨在分布式环境中，使用通用的低成本硬件来处理大数据。HDFS 建立在 Unix
    POSIX 文件系统之上，并做了一些修改，其目标是处理流式数据。


    Hadoop 集群由两种类型的主机组成：名称节点和数据节点。名称节点存储元数据，控制执行，并充当集群的主节点。数据节点执行实际工作；它充当从节点，执行名称节点发送的指令。


    ## MapReduce 设计模式


    MapReduce 是一种用于处理分布在数百台计算机上的数据的原型。在 MapReduce 编程中有一些常见的设计模式。


    ### 汇总模式


    简而言之，reducer 为每个键创建汇总（见图 7-2）。如果你想对数据进行排序或用于其他目的，可以使用该实践。单词计数是汇总器模式的一个例子。此模式可用于查找数据的最小值、最大值和计数，或查找平均值、中位数和标准差。


    ![](img/458833_2_En_7_Fig2_HTML.png)


    一个流程图说明了 mapper、partitioner 和 reducer 如何通过键、汇总字段、分组和汇总连接起来。


    图 7-2


    汇总模式的详细信息


    ### 过滤模式


    在 MapReduce 中，过滤是以分而治之的方式完成的（图 7-3）。每个 mapper 任务过滤一个数据子集，reducer 聚合过滤后的子集并生成最终输出。生成前
    N 条记录、搜索数据和采样数据是过滤模式的常见用例。


    ![](img/458833_2_En_7_Fig3_HTML.png)


    一个流程图说明了四个输入分片如何通过过滤 mapper 连接到它们各自的输出分片。


    图 7-3


    过滤模式的详细信息


    ### 连接模式


    在 MapReduce 中，连接（图 7-4）可以在 map 端或 reduce 端完成。对于 map 端，要连接的数据集应存在于同一个集群中；否则，需要使用
    reduce 端连接。连接可以是外连接、内连接或反连接。


    ![](img/458833_2_En_7_Fig4_HTML.jpg)


    一个流程图说明了 mapper 1 和 mapper 2 如何连接到一个共同的 reducer，以预测键以及值 1 和值 2 的输出。


    图 7-4


    连接模式的详细信息


