    ### HDFS File System


    Other than MapReduce, HDFS is the second component in the Hadoop framework. It
    is designed to deal with big data in a distributed environment for general-purpose
    low-cost hardware. HDFS is built on top of the Unix POSSIX file system with some
    modifications, with the goal of dealing with streaming data.


    The Hadoop cluster consists of two types of host: the name node and the data node.
    The name node stores the metadata, controls execution, and acts like the master
    of the cluster. The data node does the actual execution; it acts like a slave
    and performs instructions sent by the name node.


    ### MapReduce Design Pattern


    MapReduce is an archetype for processing the data that resides in hundreds of
    computers. There are some design patterns that are common in MapReduce programming.


    #### Summarization Pattern


    In summary, the reducer creates the summary for each key (see Figure [7-2](#458833_2_En_7_Chapter.xhtml#Fig2)).
    The practitioner can be used if you want to sort the data or for any other purpose.
    The word count is an example of the summarizer pattern. This pattern can be used
    to find the minimum, maximum, and count of data or to find the average, median,
    and standard deviation.


    ![](images/458833_2_En_7_Chapter/458833_2_En_7_Fig2_HTML.png)


    A flow diagram illustrates how the mapper, partitioner, and reducer are linked
    through key, summary field, groups, and summary.


    Figure 7-2


    Details of the summarization pattern


    #### Filtering Pattern


    In MapReduce, filtering is done in a divide-and-conquer way (Figure [7-3](#458833_2_En_7_Chapter.xhtml#Fig3)).
    Each mapper job filters a subset of data, and the reducer aggregates the filtered
    subset and produces the final output. Generating the top N records, searching
    data, and sampling data are the common use cases of the filtering pattern.


    ![](images/458833_2_En_7_Chapter/458833_2_En_7_Fig3_HTML.png)


    A flow diagram illustrates how the four frames of input splits are connected to
    their respective output splits through filter mappers.


    Figure 7-3


    Details of the filtering pattern


    #### Join Patterns


    In MapReduce, joining (Figure [7-4](#458833_2_En_7_Chapter.xhtml#Fig4)) can be
    done on the map side or the reduce side. For the map side, the join data sets
    that will be joined should exist in the same cluster; otherwise, the reduce-side
    join is required. The join can be an outer join, inner join, or anti-join.


    ![](images/458833_2_En_7_Chapter/458833_2_En_7_Fig4_HTML.jpg)


    A flow diagram illustrates how mappers 1 and 2 are connected to a common reducer
    to predict the output of key, and values 1 and 2.


    Figure 7-4


    Details of the join pattern


