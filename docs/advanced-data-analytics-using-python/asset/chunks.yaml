    # 卷积神经网络


    现在我们将讨论另一种神经网络：卷积神经网络。


    在经典的前馈神经网络（如本书前面研究过的那些）中，输入层的每个神经元都与下一层的每个输出神经元相连，形成全连接层。然而，在卷积神经网络中，全连接层仅在网络的最后一层（或最后几层）才被使用。


    ![](img/458833_2_En_5_Fig2_HTML.png)


    该图展示了输入帧如何被卷积，以及特征如何被提取、池化，并通过全连接层进行分类，最终预测输出。


    **图 5-2** 卷积神经网络架构


    相反，我们使用应用于输入层的卷积滤波器来计算输出。当你使用这些卷积时，你会得到局部连接，这意味着输入的每个部分都与输出的一个部分相连（我们将在本章后面解释这一点）。在卷积神经网络中，每一层都应用一组独立的滤波器，通常有数百或数千个，然后将结果合并。


    在训练过程中，卷积神经网络会自动学习这些滤波器的值。在图像分类任务中，我们的卷积神经网络可以学习执行以下操作：


    -   在第一层，使用原始像素数据检测边缘。

    -   在第二层，利用这些边缘来识别形状（例如，斑点）。

    -   在网络的高层，利用这些形状来检测更高级别的特征，比如面部结构。

    -   最后一层是分类器，它根据这些高级别特征对图像内容进行预测。


    如果你有一系列图像，例如视频，那么循环神经网络或卷积神经网络都是合适的选择。在以下代码中，我们对一系列图像进行分类：


    ```python

    import numpy as np

    from keras.models import Sequential

    from keras.layers import Conv2D, MaxPooling2D, Dense, Flatten

    from keras.utils import to_categorical

    import tensorflow as tf

    mnist = tf.keras.datasets.mnist

    # loads data and splits into train and test set

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    x_train, x_test = x_train / 255.0, x_test / 255.0

    # # Reshape the images.

    train_images = np.expand_dims(x_train, axis=3)

    test_images = np.expand_dims(x_test, axis=3)

    num_filters = 4

    filter_size = 2

    pool_size = 2

    # Build the model.

    model = Sequential([

    Conv2D(num_filters, filter_size, input_shape=(28, 28, 1)),

    MaxPooling2D(pool_size=pool_size),

    Flatten(),

    Dense(10, activation=''softmax''),

    ])

    # Compile the model.

    model.compile(

    ''adam'',

    loss=''categorical_crossentropy'',

    metrics=[''accuracy''],

    )

    # Train the model.

    model.fit(

    train_images,

    to_categorical(y_train),

    epochs=3,

    validation_data=(test_images, to_categorical(y_test)),

    )

    # Predict on the first 10 test images.

    predictions = model.predict(test_images[:10])

    print(np.argmax(predictions, axis=1))

    # Check our predictions against the ground truths.

    print(x_test[:10])

    ```


    ## 本章小结


    本章是本书的核心。我们讨论了诸如循环神经网络和卷积神经网络等神经网络，并结合强化学习使用了真实示例。在下一章中，我们将讨论一些用于分析时间序列数据的经典统计方法，而最后一章则全部关于如何扩展你的分析应用。


    # 6. 时间序列


    *时间序列*是按时间顺序排列的一系列数据点。最常见的情况是，这些时间点是等间隔的。例如，过去两年中每月记录的航空公司乘客量，或过去一年中每天记录的股票市场工具价格。时间序列分析的主要目的是根据参数的过去数据来预测其未来值。


    ## 变异的分类


    传统上，时间序列分析将变异分为三个主要组成部分，即趋势、季节性变化和其他周期性变化。剩余的变异则归因于“不规则”波动或误差项。当变异主要由趋势和季节性构成时，这种方法尤其有价值。


    ## 分析包含趋势的序列


    *趋势*是均值水平的长期性变化。例如，如果你有一个像 2, 4, 6, 8 这样的序列，有人问你下一个值是什么，显而易见的答案是 10。你可以通过使用简单最小二乘估计或任何其他回归方法对数据拟合一条直线来证明你的答案。趋势也可以是非线性的。图
    6-1 展示了一个带有趋势的时间序列示例。


    ![](img/458833_2_En_6_Fig1_HTML.jpg)


    该图绘制了以千为单位的国际航空公司乘客数据。它显示了一个从 1949 年 1 月的大约 100 增长到 1960 年 1 月的大约 600 的上升趋势。


    **图 6-1** 带有趋势的时间序列


    最简单的时间序列类型是常见的“线性趋势加噪声”，其中在时间 *t* 的观测值是一个随机变量 `X[t]`，如下所示：


    ![$$ {\textrm{X}}_{\textrm{t}}=\alpha +\beta t+{\varepsilon}_t $$](img/458833_2_En_6_Chapter_TeX_Equa.png)


    这里，`α`、`β` 是常数，`ε[t]` 表示均值为 0 的随机误差项。在时间 *t* 的平均水平由 `m[t] = (α + βt)` 给出。这有时被称为*趋势项*。


    ### 曲线拟合


    *拟合*一个简单的时间函数，例如多项式曲线（线性、二次等）、冈珀茨曲线或逻辑曲线，是处理包含趋势的非季节性数据（特别是年度数据）的一种众所周知的方法。全局线性趋势是最简单的多项式曲线类型。冈珀茨曲线可以写成以下格式，其中
    `α`、`β` 和 `γ` 是参数，且 `0 < r < 1`：


    ![$$ {\textrm{X}}_{\textrm{t}}=\alpha \exp \left[\beta \exp \left(-\gamma \textrm{t}\right)\right]
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equb.png)


    这看起来相当不同，但只要 `t > 0`，实际上是等价的。逻辑曲线如下所示：


    ![$$ {\textrm{X}}_{\textrm{t}}=\textrm{a}/\left(1+{\textrm{be}}^{\hbox{-} ct}\right)
    $$](img/458833_2_En_6_Chapter_TeX_Equc.png)


    这两条曲线都是 S 形的，并且当 `t → ∞` 时趋近于一个渐近值，其中冈珀茨曲线通常比逻辑曲线收敛得慢。将曲线拟合到数据可能会导致非线性联立方程。


    对于所有此类性质的曲线，拟合函数提供了趋势的度量，而残差则提供了局部波动的估计，其中残差是观测值与拟合曲线对应值之间的差值。

    '
- fmt: '### Removing Trends from a Time Series


    Differentiating a given time series until it becomes stationary is a special type
    of filtering that is particularly useful for removing a trend. You will see that
    this is an integral part of the Box-Jenkins procedure. For data with a linear
    trend, a first-order differencing is usually enough to remove the trend.


    Mathematically, it looks like this:


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\textrm{t}+\textrm{c}\\
    {}\textrm{y}\left(\textrm{t}+1\right)={\textrm{a}}^{\ast}\left(\textrm{t}+1\right)+\textrm{c}\\
    {}\textrm{z}\left(\textrm{t}\right)=\textrm{y}\left(\textrm{t}+1\right)-\textrm{y}\left(\textrm{t}\right)=\textrm{a}+\textrm{c};\textrm{no}\
    \textrm{t}\textrm{rend}\ \textrm{present}\ \textrm{in}\ \textrm{z}\left(\textrm{t}\right)\end{array}}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equd.png)


    A trend can be exponential as well. In this case, you will have to do a logarithmic
    transformation to convert the trend from exponential to linear.


    Mathematically, it looks like this:


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\exp
    \left(\textrm{t}\right)\\ {}z\left(\textrm{t}\right)=\log \left(\textrm{y}\left(\textrm{t}\right)\right)={\textrm{t}}^{\ast}\log
    \left(\textrm{a}\right);\textrm{z}\left(\textrm{t}\right)\textrm{is}\ \textrm{a}\
    \textrm{linear}\ \textrm{function}\ \textrm{of}\ \textrm{t}\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Eque.png)


    ## Analyzing a Series Containing Seasonality


    Many time series, such as airline passenger loads or weather readings, display
    variations that repeat after a specific time period. For instance, in India, there
    will always be an increase in airline passenger loads during the holiday of Diwali.
    This yearly variation is easy to understand and can be estimated if seasonality
    is of direct interest. Similarly, like trends, if you have a series such as 1,
    2, 1, 2, 1, 2, your obvious choices for the next values of the series will be
    1 and 2.


    The Holt-Winters model is a popular model to realize time series with seasonality
    and is also known as *exponential smoothing*. The Holt-Winters model has two variations:
    additive and multiplicative. In the additive model with a single exponential smoothing
    time series, seasonality is realized as follows:


    ![$$ \textrm{X}\left(\textrm{t}+1\right)={\upalpha}^{\ast } Xt+\left(1-\upalpha
    \right)\ast \textrm{St}-1 $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equf.png)


    In this model, every point is realized as a weighted average of the previous point
    and seasonality. So, `X(t+1)` will be calculated as a function `X(t-1)` and `S(t-2)`
    and square of `α`. In this way, the more you go on, the `α` value increases exponentially.
    This is why it is known as exponential smoothing. The starting value of `St` is
    crucial in this method. Commonly, this value starts with a 1 or with an average
    of the first four observations.


    The multiplicative seasonal model time series is as follows:


    ![$$ \textrm{X}\left(\textrm{t}+1\right)=\left(\textrm{b}1+\textrm{b}{2}^{\ast}\textrm{t}\right)\textrm{St}+\textrm{noise},
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equg.png)


    Here, `b1`, often referred to as the *permanent component*, is the initial weight
    of the seasonality; `b2` represents the trend, which is linear in this case.


    However, there is no standard implementation of the Holt-Winters model in Python.
    It is available in R (see Chapter [1](#458833_2_En_1_Chapter.xhtml) for how R''s
    Holt-Winters model can be called from Python code).


    ## Removing Seasonality from a Time Series


    There are two ways of removing seasonality from a time series.


    *   By filtering

    *   By differencing


    ### By Filtering


    The series `{x[t]}` is converted into another called `{y[t]}` with the linear
    operation shown here, where `{a[r]}` is a set of weights:


    ![$$ {\textrm{Y}}_{\textrm{t}}={\sum^{+\textrm{s}}}_{\textrm{r}=\hbox{-} \textrm{q}}{\textrm{a}}_{\textrm{r}}{\textrm{X}}_{\textrm{t}+\textrm{r}}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equh.png)


    To smooth out local fluctuations and estimate the local mean, you should clearly
    choose the weights so that `∑a[r] = 1`; then the operation is often referred to
    as a *moving average*. They are often symmetric with `s = q` and `a[j] = a[-j]`.
    The simplest example of a symmetric smoothing filter is the simple moving average,
    for which `a[r] = 1 / (2q+1)` for `r = -q, …, + q`.


    The smoothed value of `x[t]` is given by the following:


    ![$$ Sm\left({\textrm{x}}_{\textrm{t}}\right)=\frac{1}{2q+1}{\sum^{+\textrm{q}}}_{\textrm{r}=\hbox{-}
    \textrm{q}}{\textrm{X}}_{\textrm{t}+\textrm{r}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equi.png)


    The simple moving average is useful for removing seasonal variations, but it is
    unable to deal well with trends.


    ### By Differencing


    Differencing is widely used and often works well. Seasonal differencing removes
    seasonal variation.


    Mathematically, if time series `y(t)` contains additive seasonality `S(t)` with
    time period `T`, then:


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\textrm{S}\left(\textrm{t}\right)={\textrm{b}}^{\ast}\textrm{t}+\textrm{c}\\
    {}\textrm{y}\left(\textrm{t}+\textrm{T}\right)= aS\left(\textrm{t}+\textrm{T}\right)+{\textrm{b}}^{\ast}\left(\textrm{t}+\textrm{T}\right)+\textrm{c}\\
    {}\textrm{z}\left(\textrm{t}\right)=\textrm{y}\left(\textrm{t}+\textrm{T}\right)-\textrm{y}\left(\textrm{t}\right)={\textrm{b}}^{\ast}\textrm{T}+\textrm{noise}\
    \textrm{term}\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equj.png)


    Similar to trends, you can convert the multiplicative seasonality to additive
    by log transformation.


    Now, finding time period `T` in a time series is the critical part. It can be
    done in two ways, either by using an autocorrelation function in the time domain
    or by using the Fourier transform in the frequency domain. In both cases, you
    will see a spike in the plot. For autocorrelation, the plot spike will be at lag
    `T`, whereas for FT distribution, the spike will be at frequency `1/T`.


    ## Transformation


    Up to now I have discussed the various kinds of transformation in a time series.
    The three main reasons for making a transformation are covered in the next sections.


    ### To Stabilize the Variance


    The standard way to do this is to take a logarithmic transformation of the series;
    it brings closer the points in space that are widely scattered.


    ### To Make the Seasonal Effect Additive


    If the series has a trend and the volume of the seasonal effect appears to be
    on the rise with the mean, then it may be advisable to modify the data so as to
    make the seasonal effect constant from year to year. This seasonal effect is said
    to be additive. However, if the volume of the seasonal effect is directly proportional
    to the mean, then the seasonal effect is said to be multiplicative, and a logarithmic
    transformation is needed to make it additive again.'
  raw: '### Removing Trends from a Time Series


    Differentiating a given time series until it becomes stationary is a special type
    of filtering that is particularly useful for removing a trend. You will see that
    this is an integral part of the Box-Jenkins procedure. For data with a linear
    trend, a first-order differencing is usually enough to remove the trend.


    Mathematically, it looks like this:


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\textrm{t}+\textrm{c}\\
    {}\textrm{y}\left(\textrm{t}+1\right)={\textrm{a}}^{\ast}\left(\textrm{t}+1\right)+\textrm{c}\\
    {}\textrm{z}\left(\textrm{t}\right)=\textrm{y}\left(\textrm{t}+1\right)-\textrm{y}\left(\textrm{t}\right)=\textrm{a}+\textrm{c};\textrm{no}\
    \textrm{t}\textrm{rend}\ \textrm{present}\ \textrm{in}\ \textrm{z}\left(\textrm{t}\right)\end{array}}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equd.png)


    A trend can be exponential as well. In this case, you will have to do a logarithmic
    transformation to convert the trend from exponential to linear.


    Mathematically, it looks like this:


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\exp
    \left(\textrm{t}\right)\\ {}z\left(\textrm{t}\right)=\log \left(\textrm{y}\left(\textrm{t}\right)\right)={\textrm{t}}^{\ast}\log
    \left(\textrm{a}\right);\textrm{z}\left(\textrm{t}\right)\textrm{is}\ \textrm{a}\
    \textrm{linear}\ \textrm{function}\ \textrm{of}\ \textrm{t}\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Eque.png)


    ## Analyzing a Series Containing Seasonality


    Many time series, such as airline passenger loads or weather readings, display
    variations that repeat after a specific time period. For instance, in India, there
    will always be an increase in airline passenger loads during the holiday of Diwali.
    This yearly variation is easy to understand and can be estimated if seasonality
    is of direct interest. Similarly, like trends, if you have a series such as 1,
    2, 1, 2, 1, 2, your obvious choices for the next values of the series will be
    1 and 2.


    The Holt-Winters model is a popular model to realize time series with seasonality
    and is also known as *exponential smoothing*. The Holt-Winters model has two variations:
    additive and multiplicative. In the additive model with a single exponential smoothing
    time series, seasonality is realized as follows:


    ![$$ \textrm{X}\left(\textrm{t}+1\right)={\upalpha}^{\ast } Xt+\left(1-\upalpha
    \right)\ast \textrm{St}-1 $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equf.png)


    In this model, every point is realized as a weighted average of the previous point
    and seasonality. So, X(t+1) will be calculated as a function X(t-1) and S(t-2)
    and square of α. In this way, the more you go on, the α value increases exponentially.
    This is why it is known as exponential smoothing. The starting value of St is
    crucial in this method. Commonly, this value starts with a 1 or with an average
    of the first four observations.


    The multiplicative seasonal model time series is as follows:


    ![$$ \textrm{X}\left(\textrm{t}+1\right)=\left(\textrm{b}1+\textrm{b}{2}^{\ast}\textrm{t}\right)\textrm{St}+\textrm{noise},
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equg.png)


    Here, b1, often referred to as the *permanent component*, is the initial weight
    of the seasonality; b2 represents the trend, which is linear in this case.


    However, there is no standard implementation of the Holt-Winters model in Python.
    It is available in R (see Chapter [1](#458833_2_En_1_Chapter.xhtml) for how R’s
    Holt-Winters model can be called from Python code).


    ## Removing Seasonality from a Time Series


    There are two ways of removing seasonality from a time series.


    *   By filtering


    *   By differencing


    ### By Filtering


    The series {x[t]} is converted into another called {y[t]} with the linear operation
    shown here, where {a[r]} is a set of weights:


    ![$$ {\textrm{Y}}_{\textrm{t}}={\sum^{+\textrm{s}}}_{\textrm{r}=\hbox{-} \textrm{q}}{\textrm{a}}_{\textrm{r}}{\textrm{X}}_{\textrm{t}+\textrm{r}}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equh.png)


    To smooth out local fluctuations and estimate the local mean, you should clearly
    choose the weights so that ∑a[r] = 1; then the operation is often referred to
    as a *moving average*. They are often symmetric with s = q and a[j] = a[-j]. The
    simplest example of a symmetric smoothing filter is the simple moving average,
    for which a[r] = 1 / (2q+1) for r = -q, …, + q.


    The smoothed value of x[t] is given by the following:


    ![$$ Sm\left({\textrm{x}}_{\textrm{t}}\right)=\frac{1}{2q+1}{\sum^{+\textrm{q}}}_{\textrm{r}=\hbox{-}
    \textrm{q}}{\textrm{X}}_{\textrm{t}+\textrm{r}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equi.png)


    The simple moving average is useful for removing seasonal variations, but it is
    unable to deal well with trends.


    ### By Differencing


    Differencing is widely used and often works well. Seasonal differencing removes
    seasonal variation.


    Mathematically, if time series y(t) contains additive seasonality S(t) with time
    period T, then:


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\textrm{S}\left(\textrm{t}\right)={\textrm{b}}^{\ast}\textrm{t}+\textrm{c}\\
    {}\textrm{y}\left(\textrm{t}+\textrm{T}\right)= aS\left(\textrm{t}+\textrm{T}\right)+{\textrm{b}}^{\ast}\left(\textrm{t}+\textrm{T}\right)+\textrm{c}\\
    {}\textrm{z}\left(\textrm{t}\right)=\textrm{y}\left(\textrm{t}+\textrm{T}\right)-\textrm{y}\left(\textrm{t}\right)={\textrm{b}}^{\ast}\textrm{T}+\textrm{noise}\
    \textrm{term}\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equj.png)


    Similar to trends, you can convert the multiplicative seasonality to additive
    by log transformation.


    Now, finding time period T in a time series is the critical part. It can be done
    in two ways, either by using an autocorrelation function in the time domain or
    by using the Fourier transform in the frequency domain. In both cases, you will
    see a spike in the plot. For autocorrelation, the plot spike will be at lag T,
    whereas for FT distribution, the spike will be at frequency 1/T.


    ## Transformation


    Up to now I have discussed the various kinds of transformation in a time series.
    The three main reasons for making a transformation are covered in the next sections.


    ### To Stabilize the Variance


    The standard way to do this is to take a logarithmic transformation of the series;
    it brings closer the points in space that are widely scattered.


    ### To Make the Seasonal Effect Additive


    If the series has a trend and the volume of the seasonal effect appears to be
    on the rise with the mean, then it may be advisable to modify the data so as to
    make the seasonal effect constant from year to year. This seasonal effect is said
    to be additive. However, if the volume of the seasonal effect is directly proportional
    to the mean, then the seasonal effect is said to be multiplicative, and a logarithmic
    transformation is needed to make it additive again.'
  trans: '

    ### 从时间序列中移除趋势


    对给定的时间序列进行差分，直至其变得平稳，是一种特殊的滤波方法，对于移除趋势特别有用。你会看到，这是 Box-Jenkins 方法中不可或缺的一部分。对于具有线性趋势的数据，一阶差分通常足以移除趋势。


    数学上，其形式如下：


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\textrm{t}+\textrm{c}\\
    {}\textrm{y}\left(\textrm{t}+1\right)={\textrm{a}}^{\ast}\left(\textrm{t}+1\right)+\textrm{c}\\
    {}\textrm{z}\left(\textrm{t}\right)=\textrm{y}\left(\textrm{t}+1\right)-\textrm{y}\left(\textrm{t}\right)=\textrm{a}+\textrm{c};\textrm{no}\
    \textrm{t}\textrm{rend}\ \textrm{present}\ \textrm{in}\ \textrm{z}\left(\textrm{t}\right)\end{array}}
    $$](img/458833_2_En_6_Chapter_TeX_Equd.png)


    趋势也可能是指数型的。在这种情况下，你需要进行对数变换，将指数趋势转换为线性趋势。


    数学上，其形式如下：


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\exp
    \left(\textrm{t}\right)\\ {}z\left(\textrm{t}\right)=\log \left(\textrm{y}\left(\textrm{t}\right)\right)={\textrm{t}}^{\ast}\log
    \left(\textrm{a}\right);\textrm{z}\left(\textrm{t}\right)\textrm{is}\ \textrm{a}\
    \textrm{linear}\ \textrm{function}\ \textrm{of}\ \textrm{t}\end{array}} $$](img/458833_2_En_6_Chapter_TeX_Eque.png)


    ## 分析包含季节性的序列


    许多时间序列，例如航空公司的乘客负载量或天气读数，会显示出在特定时间段后重复的变动。例如，在印度，排灯节假期期间航空公司的乘客负载量总是会增加。这种年度变化很容易理解，如果对季节性有直接兴趣，也可以进行估计。同样，类似于趋势，如果你有一个像
    1, 2, 1, 2, 1, 2 这样的序列，那么你对序列下一个值的明显选择将是 1 和 2。


    Holt-Winters 模型是实现具有季节性的时间序列的流行模型，也被称为*指数平滑法*。Holt-Winters 模型有两种变体：加法模型和乘法模型。在具有单一指数平滑时间序列的加法模型中，季节性的实现方式如下：


    ![$$ \textrm{X}\left(\textrm{t}+1\right)={\upalpha}^{\ast } Xt+\left(1-\upalpha
    \right)\ast \textrm{St}-1 $$](img/458833_2_En_6_Chapter_TeX_Equf.png)


    在这个模型中，每个点都被实现为前一个点和季节性的加权平均值。因此，`X(t+1)` 将作为 `X(t-1)` 和 `S(t-2)` 以及 `α` 的平方的函数来计算。这样，随着过程的进行，`α`
    的值会呈指数增长。这就是它被称为指数平滑法的原因。`St` 的起始值在此方法中至关重要。通常，这个值从 1 开始，或者取前四个观测值的平均值。


    乘法季节性模型的时间序列如下：


    ![$$ \textrm{X}\left(\textrm{t}+1\right)=\left(\textrm{b}1+\textrm{b}{2}^{\ast}\textrm{t}\right)\textrm{St}+\textrm{noise},
    $$](img/458833_2_En_6_Chapter_TeX_Equg.png)


    这里，`b1`（通常被称为*永久成分*）是季节性的初始权重；`b2` 代表趋势，在此情况下是线性的。


    然而，Python 中没有 Holt-Winters 模型的标准实现。它在 R 中可用（关于如何从 Python 代码中调用 R 的 Holt-Winters
    模型，请参见第 1 章）。


    ## 从时间序列中移除季节性


    从时间序列中移除季节性有两种方法。


    *   通过滤波

    *   通过差分


    ### 通过滤波


    序列 `{x[t]}` 通过如下所示的线性运算转换为另一个称为 `{y[t]}` 的序列，其中 `{a[r]}` 是一组权重：


    ![$$ {\textrm{Y}}_{\textrm{t}}={\sum^{+\textrm{s}}}_{\textrm{r}=\hbox{-} \textrm{q}}{\textrm{a}}_{\textrm{r}}{\textrm{X}}_{\textrm{t}+\textrm{r}}
    $$](img/458833_2_En_6_Chapter_TeX_Equh.png)


    为了平滑局部波动并估计局部均值，你应明确选择权重，使得 `∑a[r] = 1`；那么该运算通常被称为*移动平均*。它们通常是对称的，即 `s = q` 且
    `a[j] = a[-j]`。对称平滑滤波器最简单的例子是简单移动平均，其中对于 `r = -q, …, + q`，有 `a[r] = 1 / (2q+1)`。


    `x[t]` 的平滑值由下式给出：


    ![$$ Sm\left({\textrm{x}}_{\textrm{t}}\right)=\frac{1}{2q+1}{\sum^{+\textrm{q}}}_{\textrm{r}=\hbox{-}
    \textrm{q}}{\textrm{X}}_{\textrm{t}+\textrm{r}} $$](img/458833_2_En_6_Chapter_TeX_Equi.png)


    简单移动平均对于移除季节性变化很有用，但无法很好地处理趋势。


    ### 通过差分


    差分被广泛使用，并且通常效果良好。季节性差分可以移除季节性变化。


    数学上，如果时间序列 `y(t)` 包含周期为 `T` 的加法季节性 `S(t)`，那么：


    ![$$ {\displaystyle \begin{array}{c}\textrm{y}\left(\textrm{t}\right)={\textrm{a}}^{\ast}\textrm{S}\left(\textrm{t}\right)={\textrm{b}}^{\ast}\textrm{t}+\textrm{c}\\
    {}\textrm{y}\left(\textrm{t}+\textrm{T}\right)= aS\left(\textrm{t}+\textrm{T}\right)+{\textrm{b}}^{\ast}\left(\textrm{t}+\textrm{T}\right)+\textrm{c}\\
    {}\textrm{z}\left(\textrm{t}\right)=\textrm{y}\left(\textrm{t}+\textrm{T}\right)-\textrm{y}\left(\textrm{t}\right)={\textrm{b}}^{\ast}\textrm{T}+\textrm{noise}\
    \textrm{term}\end{array}} $$](img/458833_2_En_6_Chapter_TeX_Equj.png)


    与趋势类似，你可以通过对数变换将乘法季节性转换为加法季节性。


    现在，在时间序列中找到周期 `T` 是关键部分。可以通过两种方式实现：在时域中使用自相关函数，或者在频域中使用傅里叶变换。在这两种情况下，你都会在图中看到一个尖峰。对于自相关，图上的尖峰将出现在滞后
    `T` 处，而对于傅里叶变换分布，尖峰将出现在频率 `1/T` 处。


    ## 变换


    到目前为止，我已经讨论了时间序列中各种类型的变换。进行变换的三个主要原因将在接下来的章节中介绍。


    ### 稳定方差


    标准的做法是对序列进行对数变换；它可以使空间中分散较远的点彼此靠近。


    ### 使季节性效应变为加法


    如果序列存在趋势，并且季节性效应的幅度似乎随均值上升，那么修改数据以使季节性效应逐年保持恒定可能是可取的。这种季节性效应被称为加法效应。然而，如果季节性效应的幅度与均值成正比，那么该季节性效应被称为乘法效应，并且需要进行对数变换才能使其再次变为加法效应。

    '
- fmt: '### To Make the Data Distribution Normal


    In most probability models, it is assumed that distribution of data is Gaussian
    or normal. For example, there can be evidence of skewness in a trend that causes
    “spikes” in the time plot that are all in the same direction.


    To transform the data in a normal distribution, the most common transform is to
    subtract the mean and then divide by the standard deviation. I gave an example
    of this transformation in the RNN example in Chapter [5](#458833_2_En_5_Chapter.xhtml);
    I’ll give another in the final example of the current chapter. The logic behind
    this transformation is it makes the mean 0 and the standard deviation 1, which
    is a characteristic of a normal distribution. Another popular transformation is
    to use the logarithm. The major advantage of a logarithm is it reduces the variation
    and logarithm of Gaussian distribution data that is also Gaussian. Transformation
    may be problem-specific or domain-specific. For instance, in a time series of
    an airline’s passenger load data, the series can be normalized by dividing by
    the number of days in the month or by the number of holidays in a month.


    #### Cyclic Variation


    In some time series, seasonality is not a constant but a stochastic variable.
    That is known as *cyclic variation*. In this case, the periodicity first has to
    be predicted and then has to be removed in the same way as done for seasonal variation.


    #### Irregular Fluctuations


    A time series without trends and cyclic variations can be realized as a weekly
    stationary time series. In the next section, you will examine various probabilistic
    models to realize weekly time series.


    ## Stationary Time Series


    Normally, a time series is said to be stationary if there is no systematic change
    in mean and variance and if strictly periodic variations have been done away with.
    In real life, there are no stationary time series. Whatever data you receive by
    using transformations, you may try to make it somehow nearer to a stationary series.


    ### Stationary Process


    A time series is strictly stationary if the joint distribution of `X(t[1]),...,X(t[k])`
    is the same as the joint distribution of `X(t[1] + τ),...,X(t[k] + τ)` for all
    `t[1],…,t[k],τ`. If `k=1`, strict stationary implies that the distribution of
    `X(t)` is the same for all `t`, so provided the first two moments are finite,
    you have the following:


    ![$$ \mu \left(\textrm{t}\right)=\mu $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equk.png)


    ![$$ {\sigma}^2\left(\textrm{t}\right)={\sigma}^2 $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equl.png)


    They are both constants, which do not depend on the value of `t`.


    A weekly stationary time series is a stochastic process where the mean is constant
    and autocovariance is a function of time lag.


    ### Autocorrelation and the Correlogram


    Quantities called *sample autocorrelation coefficients* act as an important guide
    to the properties of a time series. They evaluate the correlation, if any, between
    observations at different distances apart and provide valuable descriptive information.
    You will see that they are also an important tool in model building and often
    provide valuable clues for a suitable probability model for a given set of data.
    The quantity lies in the range `[-1,1]` and measures the forcefulness of the linear
    association between the two variables. It can be easily shown that the value does
    not depend on the units in which the two variables are measured; if the variables
    are independent, then the ideal correlation is zero.


    A helpful supplement in interpreting a set of autocorrelation coefficients is
    a graph called a *correlogram*. The correlogram may be alternatively called the
    *sample autocorrelation function*.


    Suppose a stationary stochastic process `X(t)` has a mean `μ`, variance `σ²`,
    auto covariance function (acv.f.) `γ(t)`, and auto correlation function (ac.f.)
    `ρ(τ)`.


    ![$$ \rho \left(\tau \right)=\frac{\gamma \left(\tau \right)}{\gamma (0)}=\gamma
    \left(\tau \right)/{\sigma}^2 $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equm.png)


    ### Estimating Autocovariance and Autocorrelation Functions


    In the stochastic process, the autocovariance is the covariance of the process
    with itself at pairs of time points. Autocovariance is calculated as follows:


    ![$$ \gamma (h)=\frac{1}{n}\sum \limits_{t=1}^{n-\left|h\right|}\left({x}_{t+\left|h\right|}-\overline{x}\right)\left({x}_t-\overline{x}\right),-n&lt;h&lt;n
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equn.png)


    Figure [6-2](#458833_2_En_6_Chapter.xhtml#Fig2) shows a sample autocorrelation
    distribution.


    ![](images/458833_2_En_6_Chapter/458833_2_En_6_Fig2_HTML.jpg)


    A pair of simulated discrete-time sequences for autocorrelation and partial autocorrelations.
    Both plots have the highest peak of 0 at 1 point 0.


    Figure 6-2


    Sample autocorrelations


    ## Time-Series Analysis with Python


    A complement to `SciPy` for statistical computations including descriptive statistics
    and estimation of statistical models is provided by `Statsmodels`, which is a
    Python package. Besides the early models, linear regression, robust linear models,
    generalized linear models, and models for discrete data, the latest release of
    `scikits.statsmodels` includes some basic tools and models for time-series analysis,
    such as descriptive statistics, statistical tests, and several linear model classes.
    The linear model classes include autoregressive (AR), autoregressive moving-average
    (ARMA), and vector autoregressive models (VAR).


    ### Useful Methods


    Let’s start with a moving average.


    #### Moving Average Process


    Suppose that `{Z[t]}` is a purely random process with mean 0 and variance `σ[z]²`.
    Then a process `{X[t]}` is said to be a moving average process of order `q`.


    ![$$ {X}_t={\beta}_0{Z}_t+{\beta}_1{Z}_{t-1}+\dots +{\beta}_{\textrm{q}}{Z}_{t-q}
    $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equo.png)


    Here, `{β[i]}` are constants. The `Zs` are usually scaled so that `β[0] = 1`.


    ![$$ {\displaystyle \begin{array}{l}E\left({X}_t\right)=0\\ {} Var\left({X}_t\right)={\sigma}_Z^2\sum
    \limits_{i=0}^q{\beta}_i^2\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equp.png)


    The `Zs` are independent.


    ![$$ {\displaystyle \begin{array}{c}\gamma (k)= Cov\ \left({X}_t,{X}_{t+k}\right)\\
    {}= Cov\left({\beta}_0{Z}_t+\dots +{\beta}_q{Z}_{t-q},{\beta}_0{Z}_{t+k}+\dots
    +{\beta}_q{Z}_{t+k-q}\right)\\ {}=\left\{\vdash \begin{array}{cc}0&amp; k&gt;q\\
    {}{\sigma}_Z^2\sum \limits_{i=0}^{q-k}{\beta}_i{\beta}_{i+k}&amp; k=0,1,\dots,
    q\\ {}\gamma \left(-k\right)&amp; k&lt;0\end{array}\right.\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equq.png)


    ![$$ Cov\ \left({\textrm{Z}}_s,{Z}_t\right)=\left\{\begin{array}{cc}{\sigma}_Z^2&amp;
    s=t\\ {}0&amp; s\ne t\end{array}\right. $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equr.png)


    As `γ(k)` is not dependent on `t` and the mean is constant, the process is second-order
    stationary for all values of `{β[i]}`.


    ![$$ \rho (k)=\left\{\begin{array}{cc}1&amp; k=0\\ {}\sum \limits_{i=0}^{q-k}{\beta}_i{\beta}_{i+k}/\sum
    \limits_{i=0}^q{\beta}_i^2&amp; k=1,\dots, q\\ {}0&amp; k&gt;q\\ {}\rho \left(-k\right)&amp;
    k&lt;0\end{array}\right. $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equs.png)'
