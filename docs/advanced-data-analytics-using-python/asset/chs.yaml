  \ cluster centers and 1000 datapoints\nx, y = make_blobs(n_samples = 1000, centers\
  \ = 4, n_features=2, shuffle=True, random_state=31)\nsil_score = []\nkmax = 10\n\
  #### number of clusters should be greater or equal to 2\nfor k in range(2, kmax+1):\n\
  kmeans = KMeans(n_clusters = k).fit(x)\nlabels = kmeans.labels_\nsil_score.append(silhouette_score(x,\
  \ labels, metric = 'euclidean'))\nfig.plot([i for i in range(2,11)], sil_score)\n\
  fig.xlabel(\"K value\")\nfig.ylabel(\"silhouette_score\")\nfig.show()\n```\n\n图\
  \ 4-2 由代码生成。这清楚地表明，对于 `k` 值 4，轮廓分数最大。因此，我们需要选择四个聚类。\n\n![](img/458833_2_En_4_Fig2_HTML.png)\n\
  \n轮廓分数与 K 值的折线图。该线呈波动趋势，分别在 K 值为 4 和 8 处出现上升和下降。\n\n图 4-2\n\n轮廓分数与 k 值\n\n## 距离或相似性度量\n\
  \n距离或相似性的度量是聚类的关键因素之一。在本节中，我们将描述不同类型的距离和相似性度量。在此之前，我们将解释这里的*距离*实际含义。\n\n\n\n###\
  \ 性质\n\n距离是满足以下性质的度量：\n\n- 当且仅当 `x = y` 时，`dist(x, y) = 0`。\n- 当 `x ≠ y` 时，`dist(x,\
  \ y) > 0`。\n- `dist(x, y) = dist(y, x)`。\n- 对于所有 `x`、`y` 和 `z`，`dist(x, y) + dist(y,\
  \ z) >= dist(z, x)`。\n\n### 一般距离与欧几里得距离\n\n点 `p` 和 `q` 之间的距离是它们之间几何线段的长度：(![$$ \\\
  overline{pq} $$](img/458833_2_En_4_Chapter_TeX_IEq1.png))。这被称为*欧几里得距离*。\n\n根据笛卡尔坐标，如果\
  \ `p = (p[1], p[2], …, p[n])` 和 `q = (q[1], q[2], …, q[n])` 是欧几里得 `n` 维空间中的两个点，那么从\
  \ `q` 到 `p` 或从 `p` 到 `q` 的距离 (`d`) 可由勾股定理推导得出，如下所示：\n\n![$$ {\\displaystyle \\begin{array}{c}d\\\
  left(p,q\\right)=d\\left(q,p\\right)=\\sqrt{{\\left({q}_1-{p}_1\\right)}²+{\\left({q}_2-{p}_2\\\
  right)}²+\\dots +{\\left({q}_n-{p}_n\\right)}²}\\\\ {}=\\sqrt{\\sum \\limits_{i=1}^n{\\\
  left({q}_i-{p}_i\\right)}²}.\\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equc.png)\n\
  \n欧几里得向量是欧几里得 `n` 维空间中一个点的位置。向量的大小是一种度量。其长度由以下公式计算：\n\n![$$ \\left\\Vert p\\right\\\
  Vert =\\sqrt{p_1²+{p}_2²+\\cdots +{p}_n²}=\\sqrt{p\\cdot p}, $$](img/458833_2_En_4_Chapter_TeX_Equd.png)\n\
  \n向量具有方向以及距离。两点 `p` 和 `q` 之间的距离可能具有方向，因此，它可以用另一个向量表示，如下所示：\n\n![$$ q-p=\\left({q}_1-{p}_1,{q}_2-{p}_2,\\\
  dots, {q}_n-{p}_n\\right) $$](img/458833_2_En_4_Chapter_TeX_Eque.png)\n\n`p` 和 `q`\
  \ 之间的欧几里得距离就是该距离（或位移）向量的欧几里得长度。\n\n![$$ {\\displaystyle \\begin{array}{c}\\left\\\
  Vert q-p\\right\\Vert =\\sqrt{\\left(q-p\\right)\\cdot \\left(q-p\\right)}\\\\ {}\\\
  left\\Vert q-p\\right\\Vert =\\sqrt{{\\left\\Vert p\\right\\Vert}²+{\\left\\Vert\
  \ q\\right\\Vert}²-2p\\cdot q}\\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equf.png)\n\
  \n**在一维空间中：**\n\n![$$ \\sqrt{{\\left(x-y\\right)}²}=\\left|x-y\\right|. $$](img/458833_2_En_4_Chapter_TeX_Equg.png)\n\
  \n**在二维空间中：**\n\n在欧几里得平面中，如果 `p = (p[1], p[2])` 且 `q = (q[1], q[2])`，则距离由下式给出：\n\
  \n![$$ d\\left(p,q\\right)=\\surd \\left({q}_1-{p}_1\\right)\\hat{\\mkern6mu} 2+\\\
  left({q}_2-{p}_2\\right)\\hat{\\mkern6mu} 2 $$](img/458833_2_En_4_Chapter_TeX_Equh.png)\n\
  \n或者，根据该等式，如果点 `p` 的极坐标为 (`r[1]`, `θ[1]`)，点 `q` 的极坐标为 (`r[2]`, `θ[2]`)，则两点之间的距离如下：\n\
  \n![$$ \\surd {r}_1\\hat{\\mkern6mu} 2+{r}_2\\hat{\\mkern6mu} 2-2{r}_1{r}_2\\cos\
  \ \\left({{}^{\\uptheta}}_1{-^{\\uptheta}}_2\\right) $$](img/458833_2_En_4_Chapter_TeX_Equi.png)\n\
  \n**在 `n` 维空间中：**\n\n在一般情况下，距离如下：\n\n![$$ {D}²\\left(p,q\\right)=\\vdash {\\left({p}_1-{q}_1\\\
  right)}²+{\\left({p}_2-{q}_2\\right)}²+\\dots +{\\left({p}_i-{q}_i\\right)}²+\\\
  dots +{\\left({p}_n-{q}_n\\right)}²\\. $$](img/458833_2_En_4_Chapter_TeX_Equj.png)\n\
  \n在第 3 章中，你将在最近邻分类器示例中找到一个欧几里得距离的示例。\n\n### 平方欧几里得距离\n\n标准欧几里得距离可以平方，以便对相距更远的对象赋予逐渐增大的权重。在这种情况下，等式变为：\n\
  \n![$$ {d}²\\left(p,q\\right)=\\vdash {\\left({p}_1-{q}_1\\right)}²+{\\left({p}_2-{q}_2\\\
  right)}²+\\dots +{\\left({p}_i-{q}_i\\right)}²+\\dots +{\\left({p}_n-{q}_n\\right)}²\\\
  . $$](img/458833_2_En_4_Chapter_TeX_Equk.png)\n\n平方欧几里得距离不是度量，因为它不满足三角不等式。然而，它经常用于仅需比较距离的优化问题中。\n\
  \n### 字符串编辑距离\n\n*编辑距离*是衡量两个字符串之间差异程度的一种度量。它计算使两个字符串相同所需的最少操作次数。编辑距离在自然语言处理中有应用，其中自动拼写纠正可以为拼写错误的单词指出候选纠正项。编辑距离有两种类型。\n\
  \n- 莱文斯坦编辑距离\n- 尼德曼编辑距离\n\n#### 莱文斯坦距离\n\n两个单词之间的莱文斯坦距离是将一个单词更改为另一个单词所需的最少插入、删除或替换次数。1965\
  \ 年，弗拉基米尔·莱文斯坦提出了这种距离。\n\n莱文斯坦距离也称为*编辑距离*，尽管该术语也可能指代更大一类距离度量。它与成对字符串对齐有关。\n\n例如，`Calcutta`\
  \ 和 `Kolkata` 之间的莱文斯坦距离是 5，因为以下五次编辑将一个单词更改为另一个：\n\n- `Calcutta` → `Kalcutta`（将 `C`\
  \ 替换为 `K`）\n- `Kalcutta` → `Kolcutta`（将 `a` 替换为 `o`）\n- `Kolcutta` → `Kolkutta`（将\
  \ `c` 替换为 `k`）\n- `Kolkutta` → `Kolkatta`（将 `u` 替换为 `a`）\n- `Kolkatta` → `Kolkata`（删除\
  \ `t`）\n\n当字符串相同时，莱文斯坦距离有几个简单的上界（即较长字符串的长度）和下界（零）。莱文斯坦距离的代码示例在 K 均值聚类代码中给出。\n\n\
  #### 尼德曼-翁施算法\n\n尼德曼-翁施算法用于生物信息学中，以比对蛋白质或核苷酸序列。它是最早将动态规划应用于比较生物序列的算法之一。它使用动态规划工作。首先，它创建一个矩阵，其中行和列是字母。矩阵的每个单元格是该行和列中对应字母的相似性得分。得分有三种类型：匹配、不匹配，或带插入或删除的匹配。矩阵填充完毕后，算法从右下角单元格到左上角单元格执行回溯操作，并找到邻居得分距离最小的路径。回溯路径的得分总和就是两个字符串的尼德曼-翁施距离。\n\
  \n`Pyopa` 是一个 Python 模块，它提供了两个字符串之间现成的尼德曼-翁施距离。\n\n```\nimport pyopa\ndata = {'gap_open':\
  \ -20.56,\n'gap_ext': -3.37,\n'pam_distance': 150.87,\n'scores': [[10.0]],\n'column_order':\
  \ 'A',\n'threshold': 50.0}\nenv = pyopa.create_environment(**data)\ns1 = pyopa.Sequence('AAA')\n\
  s2 = pyopa.Sequence('TTT')\nprint(pyopa.align_double(s1, s1, env))\nprint(env.estimate_pam(aligned_strings[0],\
  \ aligned_strings[1]))\n```\n\n尽管莱文斯坦距离实现简单且计算成本较低，但如果你想在字符串匹配中引入间隙（例如，`New Delhi`\
  \ 和 `NewDelhi`），那么尼德曼-翁施算法是更好的选择。\n\n## 文档上下文中的相似性\n\n文档之间的相似性度量表示两个文档的相同程度。通常，相似性度量的范围限定在\
  \ `[-1,1]` 或 `[0,1]` 内，其中相似性得分为 1 表示最大相似性。\n\n\n\n### 相似度类型\n\n为了衡量相似度，文档被表示为去除停用词后的词项向量。假设\
  \ `A` 和 `B` 是代表两个文档的向量。在这种情况下，不同的相似度度量如下所示：\n\n*   **Dice（戴斯系数）**\n\n    Dice 系数由下式表示：\n\
  \n    ![$$ sim\\left(\\textrm{q},{\\textrm{d}}_{\\textrm{j}}\\right)=\\textrm{D}\\\
  left(\\textrm{A},\\textrm{B}\\right)=\\frac{\\left|A\\cap B\\right|}{\\alpha \\\
  left|A\\right|+\\left(1-\\alpha \\right)\\left|B\\right|} $$](img/458833_2_En_4_Chapter_TeX_Equl.png)\n\
  \n    同时，`α` ∈ [0, 1]，并令 ![$$ \\alpha =\\frac{1}{2} $$](img/458833_2_En_4_Chapter_TeX_IEq2.png)\n\
  \n*   **Overlap（重叠系数）**\n\n    重叠系数的计算方式如下：\n\n    ![$$ Sim\\left(\\textrm{q},{\\\
  textrm{d}}_{\\textrm{j}}\\right)=\\textrm{O}\\left(\\textrm{A},\\textrm{B}\\right)=\\\
  frac{\\left|A\\cap B\\right|}{\\min \\left(\\left|A\\right|,\\left|B\\right|\\right)}\
  \ $$](img/458833_2_En_4_Chapter_TeX_Equm.png)\n\n    重叠系数使用 max 运算符而非 min 进行计算。\n\
  \n*   **Jaccard（杰卡德系数）**\n\n    杰卡德系数由下式给出：\n\n    ![$$ Sim\\left(\\textrm{q},{\\\
  textrm{d}}_{\\textrm{j}}\\right)=\\textrm{J}\\left(\\textrm{A},\\textrm{B}\\right)=\\\
  frac{\\left|A\\cap B\\right|}{\\left|A\\cup B\\right|\\vdash } $$](img/458833_2_En_4_Chapter_TeX_Equn.png)\n\
  \n    杰卡德度量表示相关程度。\n\n*   **Cosine（余弦相似度）**\n\n    两个向量之间夹角的余弦值由下式给出：\n\n    ![$$\
  \ Sim\\left(\\textrm{q},{\\textrm{d}}_{\\textrm{j}}\\right)=\\textrm{C}\\left(\\\
  textrm{A},\\textrm{B}\\right)=\\frac{\\left|A\\cap B\\right|}{\\sqrt{\\left|A\\\
  right|\\left|B\\right|}} $$](img/458833_2_En_4_Chapter_TeX_Equo.png)\n\n距离和相似度是两个相反的度量。例如，数值数据相关性是一种相似度度量，而欧几里得距离是一种距离度量。通常，相似度度量的值限制在\
  \ 0 到 1 之间，但距离没有这样的上限。相似度可以为负，但根据定义，距离不能为负。聚类算法几乎与该领域诞生之初时相同，但研究人员正在不断为各种应用寻找新的距离度量。\n\
  \n在下一节中，既然我们已经了解了该技术的基础知识，我们将使用 K-means 算法对图像中的颜色阴影进行聚类。\n\n## 图像中的 K-Means 示例\n\
  \n首先，我们会得到一个包含色块的画布，每个色块是红色、绿色或蓝色的不同色调（图 4-3）。\n\n![](img/458833_2_En_4_Fig3_HTML.png)\n\
  \n一个画布窗口的截图。它绘制了几个不同颜色和大小的点。\n\n图 4-3\n\n一个包含红色、绿色和蓝色色块的画布\n\n目标是根据色块的色调将其分为三类。然后我们将使用\
  \ K-means 将红色、绿色和蓝色的色块分别分组，同时将它们彼此分离。图 4-4 显示了一个示例输出图像，其中红色色块已与所有其他色块分离。\n\n![](img/458833_2_En_4_Fig4_HTML.png)\n\
  \n一个包含多个不同大小彩色点的画布窗口，展示了红色点是如何被分离出来的，并叠加在一个深色窗口上。\n\n图 4-4\n\n将红色色块与绿色和蓝色色块分离\n\n\
  ### 准备聚类\n\n第一步是创建一个看起来类似于图 4-2 的图片，以便我们可以按如下方式进行聚类：\n\n```\n#### 导入必要的包\nfrom sklearn.cluster\
  \ import KMeans\nimport numpy as np\nimport random\nimport cv2\nimport imutils\n\
  #### 初始化色调选择列表\nhues = [\n#### 红色、绿色和蓝色的色调\n(138, 8, 8), (180, 4, 4), (223, 1, 1),\
  \ (255, 0, 0), (250, 88, 88),\n(8, 138, 8), (4, 180, 4), (1, 223, 1), (0, 255, 0),\
  \ (46, 254, 46),\n(11, 11, 97), (8, 8, 138), (4, 4, 180), (0, 0, 255), (46, 46,\
  \ 254)]\n#### 初始化画布\ncanvas = np.ones((400, 600, 3), datatype=\"uint8\") * 255\n\
  #### 遍历画布\nfor y in range(0, 400, 20):\nfor x in range(0, 600, 20):\n#### 为圆形生成随机的\
  \ (x, y) 坐标、半径和色调\n(dx, dy) = np.random.randint(5, 10, size=(2,))\nr = np.random.randint(5,\
  \ 8)\nhue = random.choice(hues)[::-1]\n#### 在画布上绘制圆形\ncv2.circle(canvas, (x + dx,\
  \ y + dy), r, hue, -1)\n#### 为图像添加边框\ncanvas = cv2.copyMakeBorder(canvas, 5, 5,\
  \ 5, 5, cv2.BORDER_CONSTANT,\nvalue=(255, 255, 255))\n```\n\n前面代码的第 9-13 行设置了红色、绿色和蓝色的五种不同颜色。当我们在第\
  \ 16 行的画布上绘制颜色时，我们将从此列表中随机抽取样本。第 19-28 行处理绘制随机色块的实际过程。我们首先以 20 像素的步长遍历整个图像。然后，在第\
  \ 23 和 24 行，我们为色块中心生成一个随机的 `(x, y)` 坐标（第 23 行），为色块选择一个随机半径（第 24 行），并在第 25 行从我们的颜色列表中采样。色调列表是\
  \ RGB 顺序；我们将其反转成 BGR 顺序，以便 OpenCV 能够正确绘制。最后，我们使用随机生成的值在画布上绘制一个圆形。图 4-2 显示了此代码的输出。\n\
  \n## 阈值处理\n\n现在我们已经有了人工生成的色块图像，我们需要识别每个色块并提取颜色特征来描述它们。以下是一个使用阈值处理的示例：\n\n```\n####\
  \ 将画布转换为灰度图，进行阈值处理，并检测图像中的轮廓\ngray = cv2.cvtHue(canvas, cv2.HUE_BGR2GRAY)\ngray\
  \ = cv2.bitwise_not(gray)\nthresh = cv2.threshold(gray, 10, 255, cv2.THRESH_BINARY)[1]\n\
  cnts = cv2.findContours(gray.copy(), cv2.RETR_LIST, cv2.CHAIN_APPROX_SIMPLE)\ncnts\
  \ = imutils.grab_contours(cnts)\n#### 初始化数据矩阵\ndata = []\n#### 遍历轮廓\nfor c in cnts:\n\
  #### 从轮廓构建掩膜\nmask = np.zeros(canvas.shape[:2], datatype=\"uint8\")\ncv2.drawContours(mask,\
  \ [c], -1, 255, -1)\nfeatures = cv2.mean(canvas, mask=mask)[:3]\ndata.append(features)\n\
  ```\n\n第 36-38 行仅对我们的图像进行阈值处理，得到色块的二值表示，如图 4-5 所示。\n\n![](img/458833_2_En_4_Fig5_HTML.jpg)\n\
  \n一个标记为“thresh”的窗口截图。它有一个深色屏幕，上面重叠着几个不同大小的浅色点。\n\n图 4-5\n\n使用阈值处理将背景和前景分离，以对图像进行二值化\n\
  \n在第 39 行，我们捕获圆形的轮廓，创建我们的数据矩阵（该矩阵将保存从每个色块提取的特征），并从上述代码的第 46 行开始遍历每个单独的轮廓。我们为每个轮廓创建一个掩膜，并提取平均\
  \ RGB 值；我们将使用这三个平均值来描述圆形的颜色。\n\n\n\n### 聚类时刻\n\n现在，我们可以使用 scikit-learn 实现的 K-means\
  \ 算法进行实际的聚类操作。\n\n```python\n#### 对色调特征进行聚类\nclt = KMeans(n_clusters=3)\nclt.fit(data)\n\
  cv2.imshow(\"Canvas\", canvas)\n#### 遍历唯一的聚类标识符\nfor i in np.unique(clt.labels_):\n\
  #### 为当前聚类构建掩码\nmask = np.zeros(canvas.shape[:2], datatype=\"uint8\")\n#### 遍历当前聚类的索引并绘制轮廓\n\
  for j in np.where(clt.labels_ == i)[0]:\ncv2.sketchContours(mask, [cnts[j]], -1,\
  \ 255, -1)\n#### 显示该聚类的输出图像\ncv2.imshow(\"Cluster\", cv2.bitwise_and(canvas, canvas,\
  \ mask=mask))\ncv2.waitKey(0)\n```\n\n在第 54 行，我们声明了 K-means 类，并将 *n* 个聚类参数设置为 3，表示我们需要三个不同的聚类——分别对应红色、绿色和蓝色。然后使用\
  \ `fit` 方法对我们的数据矩阵进行聚类。\n\n现在我们已经得到了三个聚类，需要一种机制来检索属于每个聚类的斑点。由于我们已经有了存储斑点轮廓的 `cnts`\
  \ 变量，这个方法比看起来要简单得多。要完成这个示例，我们只需要巧妙地运用 NumPy 函数即可。\n\n从第 59 行开始，我们遍历每个唯一的聚类标签。然后，对于每个聚类，我们使用\
  \ `np.where` 函数创建一个掩码，并收集所有与当前聚类对应的标签索引（第 64 行）。有了这些索引，我们就可以利用它们来绘制仅属于当前聚类的轮廓（第\
  \ 65 行）。\n\n### 揭示当前聚类\n\n最后，我们将使用按位运算来仅显示属于当前聚类的斑点，同时隐藏所有其他斑点。\n\n只需使用以下命令运行我们的脚本：\n\
  \n```bash\n$ python cluster_hues.py\n```\n\n通过 K-means 方法，我们可以观察到我们的斑点已自动按红、绿、蓝三种颜色分类。在图\
  \ 4-6 中，我们可以看到只有红色调被分离出来。\n\n![](img/458833_2_En_4_Fig6_HTML.png)\n\n一个包含多个不同大小彩色圆点的画布窗口展示了红色圆点是如何被分离出来的，该窗口叠加在一个深色窗口之上。\n\
  \n图 4-6\n\n红色斑点正从蓝色和绿色斑点中分离出来\n\n图 4-7 仅描绘了绿色调。\n\n![](img/458833_2_En_4_Fig7_HTML.png)\n\
  \n一个包含多个不同大小彩色圆点的画布窗口展示了绿色圆点是如何被分离出来的，该窗口叠加在一个深色窗口之上。\n\n图 4-7\n\n仅提取出绿色圆形\n\n最后，我们仅得到蓝色调，如图\
  \ 4-8 所示。\n\n![](img/458833_2_En_4_Fig8_HTML.png)\n\n一个包含多个不同大小彩色圆点的画布窗口展示了蓝色圆点是如何被分离出来的，该窗口叠加在一个深色窗口之上。\n\
  \n图 4-8\n\n仅查看“蓝色斑点”聚类\n\n现在我们将讨论另一种类型的聚类算法。\n\n## 层次聚类\n\n层次聚类是一种对数据对象进行迭代聚类的方法。它有两种类型。\n\
  \n*   凝聚层次算法，即自底向上方法\n*   分裂层次算法，即自顶向下方法\n\n### 自底向上方法\n\n自底向上的聚类方法称为*凝聚层次聚类*。在这种方法中，每个输入对象被视为一个单独的聚类。在每次迭代中，算法将两个最相似的聚类合并为一个聚类。该过程持续进行，直到所有聚类合并成一个单一的聚类。该算法的复杂度为\
  \ `O(n³)`。\n\n在该算法中，给定一组输入对象 `I = {I[1], I[2], …, I[n]}`。一组有序三元组为 `<D, K, S>`，其中\
  \ `D` 是阈值距离，`K` 是聚类数量，`S` 是聚类集合。\n\n该算法的一些变体可能允许在一次迭代中合并多个具有相同距离的聚类。算法如下：\n\n**输入：**\
  \ `I = {I[1], I[2], …, I[n]}`\n\n**输出：** `O`\n\n```pseudocode\nfor i = 1 to n do\n\
  Ci ← {Ii};\nend for\nD ← 0;\nK ← n;\nS ← {C1, ....., Cn};\nO ← ;\nrepeat\nDist ←\
  \ CalcultedMinimumDistance(S);\nD ← ∞;\nFor i = 1 to K–1 do\nFor j = i+1 to K do\n\
  if Dist(i, j) < D then\nD ← Dist(i, j);\nend if\nend for\nend for\nUntil K = 1;\n\
  ```\n\n本章稍后会给出一个层次聚类的 Python 示例。\n\n### 聚类间的距离\n\n在层次聚类中，计算两个聚类之间的距离是一个关键步骤。有三种计算方法。\n\
  \n*   单链接法\n*   全链接法\n*   平均链接法\n\n#### 单链接法\n\n在单链接法中，两个聚类之间的距离是两个聚类中所有对象对之间距离的最小值。由于距离是最小值，因此会存在一对对象，其距离小于或等于两个聚类之间的距离。因此，单链接法可以表示如下：\n\
  \n![$$ {\\displaystyle \\begin{array}{c}\\textrm{Dist}\\left({\\textrm{C}}_{\\textrm{i}},{\\\
  textrm{C}}_{\\textrm{j}}\\right)=\\min \\textrm{dist}\\left(\\textrm{X},\\textrm{Y}\\\
  right)\\\\ {}\\textrm{X}\\text{\\EUR} {\\textrm{C}}_{\\textrm{i}},\\textrm{Y}\\\
  text{\\EUR} {\\textrm{C}}_{\\textrm{j}}\\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equp.png)\n\
  \n#### 全链接法\n\n在全链接法中，两个聚类之间的距离是两个聚类中所有对象对之间距离的最大值。由于距离是最大值，因此所有对象对的距离都小于或等于两个聚类之间的距离。因此，全链接法可以表示如下：\n\
  \n![$$ {\\displaystyle \\begin{array}{c}\\textrm{Dist}\\left({\\textrm{C}}_{\\textrm{i}},{\\\
  textrm{C}}_{\\textrm{j}}\\right)=\\max \\textrm{dist}\\left(\\textrm{X},\\textrm{Y}\\\
  right)\\\\ {}\\textrm{X}\\text{\\EUR} {\\textrm{C}}_{\\textrm{i}},\\textrm{Y}\\\
  text{\\EUR} {\\textrm{C}}_{\\textrm{j}}\\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equq.png)\n\
  \n#### 平均链接法\n\n平均链接法是前两种链接法之间的折衷方案。它避免了形成过大或过紧密聚类的极端情况。聚类 `C[i]` 和 `C[j]` 之间的距离定义如下：\n\
  \n![$$ \\textrm{Dist}\\left({\\textrm{C}}_{\\textrm{i}},{\\textrm{C}}_{\\textrm{j}}\\\
  right)=\\frac{\\sum_{\\textrm{X}\\text{\\EUR} \\textrm{Ci}}{\\sum}_{\\textrm{Y}\\\
  text{\\EUR} {\\textrm{C}}_{\\textrm{j}}\\vdash}\\textrm{dist}\\left(\\textrm{X},\\\
  textrm{Y}\\right)}{\\left|{\\textrm{C}}_{\\textrm{i}}\\right|\\times \\left|{\\\
  textrm{C}}_{\\textrm{j}}\\right|} $$](img/458833_2_En_4_Chapter_TeX_Equr.png)\n\n\
  `|C[k]|` 是聚类 `C[k]` 中的数据对象数量。\n\n质心链接法与平均链接法类似，但这里的两个聚类之间的距离实际上是质心之间的距离。聚类 `C[i]`\
  \ 的质心定义如下：\n\n![$$ {\\displaystyle \\begin{array}{c}{\\textrm{X}}_{\\textrm{c}}=\\\
  vdash \\left({\\textrm{c}}_1,\\dots .,{\\textrm{c}}_{\\textrm{m}}\\right),\\textrm{with}\\\
  \\ {}{\\textrm{c}}_{\\textrm{j}}=1/\\textrm{m}\\sum {\\textrm{X}}_{kj},\\end{array}}\
  \ $$](img/458833_2_En_4_Chapter_TeX_Equs.png)\n\n`X[kj]` 是聚类 `C[i]` 中第 k 个数据对象的第\
  \ j 维。\n\n\n\n### 自顶向下方法\n\n自顶向下聚类方法也称为*分裂层次聚类*。它是自底向上聚类的逆过程。该方法从一个包含所有输入对象的单一簇开始。每次迭代后，它会将簇分裂为距离最大的两个部分。算法如下：\n\
  \n**输入：** `I = {I1, I2, … , In}`\n\n**输出：** `O`\n\n```\nD ← ∞;\nK ← 1;\nS ← {I1,I2\
  \ , ... , In};\nO ← ;\nrepeat\nX ← 包含距离最远的两个数据对象 dist;\nY ← ∅;\nS ← S – X;\nXi ←\
  \ 在 A 中与 X 距离最大的数据对象 D (Xi, X);\nX ← X − {Xi};\nY ← Y ∪ {Xi};\nrepeat\nfor all data\
  \ object Xj in X do\n```\n\n`e(j) ←←` ![$$ \\overline{D} $$](img/458833_2_En_4_Chapter_TeX_IEq3.png)\
  \ `(X[j], X)` ![$$ \\overline{D} $$](img/458833_2_En_4_Chapter_TeX_IEq4.png) `(X[j],\
  \ Y);`\n\n```\nend for\nif∃e(j) > 0 then\nXk ←← 在 X 中 e(j) 最大的数据对象;\nX ← X  {Xk};\n\
  Y ←← Y ∪∪ {Xk};\nsplit ←← TRUTH;\nelse\nsplit← FALSE;\nend if\nuntil split == FALSE;\n\
  D ← dist;\nK ← K+1;\nS ← S∪∪ X ∪ Y\nO ← 0 ∪ ;\nUntil  K = n;\n```\n\n树状图 `O` 是任何层次聚类的输出。图\
  \ 4-9 展示了一个树状图。\n\n![](img/458833_2_En_4_Fig9_HTML.jpg)\n\n一个簇树状图描绘了多个美国州的高度，例如罗德岛州、爱达荷州、南卡罗来纳州、阿肯色州、密苏里州、康涅狄格州等。\n\
  \n**图 4-9** 树状图\n\n要从树状图中创建一个簇，你需要一个距离或相似度的阈值。一个简单的方法是绘制距离或相似度的分布图，并找到曲线的拐点。对于高斯分布数据，拐点位于\
  \ `x = mean + n*std` 和 `x = mean – n*std` 处，如图 4-10 所示。\n\n![](img/458833_2_En_4_Fig10_HTML.jpg)\n\
  \n直方图绘制出一个钟形结构。它在两个正焦弦上各有一个拐点。可以观察到投影。\n\n**图 4-10** 拐点\n\n以下代码使用 Python 创建了一个层次聚类。输入数据文件可以从\
  \ [`https://canvas.uw.edu/courses/1546077/files/92110986`](https://canvas.uw.edu/courses/1546077/files/92110986)\
  \ 下载。\n\n```\nimport numpy as np\nimport pandas as pd\nfrom sklearn.preprocessing\
  \ import StandardScaler, normalize\nfrom sklearn.decomposition import PCA\nimport\
  \ scipy.cluster.hierarchy as hc\nimport matplotlib.pyplot as plt\nfrom sklearn.cluster\
  \ import AgglomerativeClustering\n#### Load the CSV file\ndf = pd.read_csv(\"book\\\
  \\ch4\\\\CC_GENERAL.csv\")\n#### preprocessing\ndf = df.drop('CUST_ID', axis = 1)\n\
  df.fillna(method ='ffill', inplace = True)\n#### Scale and normalize\nss = StandardScaler()\n\
  scaled_df = ss.fit_transform(df)\nnormalized_df= normalize(scaled_df)\n#### Reduce\
  \ the dimensionality to 3\npca = PCA(n_components=3)\ndf_pca = pca.fit_transform(normalized_df)\n\
  df_pca = pd.DataFrame(df_pca)\ndf_pca.columns = ['P1', 'P2', 'P3']\n#### Dendogram\
  \ plot\nplt.figure(figsize =(10, 10))\nplt.title('Visualising the data')\ndendrogram\
  \ = hc.dendrogram((hc.linkage(df_pca, method ='ward')))\n#### create 3 clusters\
  \ using Agglomerative hierarchical clustering\nhrc= AgglomerativeClustering(n_clusters\
  \ = 3)\nplt.figure(figsize =(10, 10))\nplt.scatter(df_pca['P1'], df_pca['P2'], df_pca['P3'],\
  \ c = hrc.fit_predict(df_pca), cmap ='rainbow')\nplt.title(\"Agglomerative Hierarchical\
  \ Clusters - Scatter Plot\", fontsize=18)\nplt.show()\n```\n\n### 图论方法\n\n聚类问题可以映射到一个图，其中图中的每个节点都是一个输入数据点。如果两个图之间的距离小于阈值，则相应的节点被连接起来。现在，使用图划分算法，你可以对图进行聚类。聚类在投资银行中的一个行业示例是，聚类工具取决于其价格时间序列的相关性以及每个聚类一起进行的表现交易。这在算法交易中被称为*篮子交易*。因此，通过使用相似性度量，你可以构建一个图，其中节点是工具，节点之间的边表示这些工具是相关的。要创建篮子，你需要一组彼此都相关的工具。在图中，这是一个节点集或子图，其中子图中的所有节点都相互连接。这种子图被称为*团*。寻找最大规模的团是一个\
  \ NP 完全问题。人们使用启发式解决方案来解决这个聚类问题。\n\n### 如何判断聚类结果是否良好？\n\n应用聚类算法后，验证结果的好坏是聚类分析中的关键步骤。有三个参数用于衡量聚类的质量，即质心、半径和直径。\n\
  \n![$$ \\textrm{Centroid}={\\textrm{C}}_{\\textrm{m}}=\\frac{{\\sum_{\\textrm{i}=1}}^{\\\
  textrm{N}}{\\textrm{t}}_{mi}}{\\textrm{N}} $$](img/458833_2_En_4_Chapter_TeX_Equt.png)\n\
  \n![$$ \\textrm{Radius}={\\textrm{R}}_{\\textrm{m}}=\\sqrt{\\frac{{\\sum_{\\textrm{i}=1}}^{\\\
  textrm{N}}{\\left({\\textrm{t}}_{mi}-{\\textrm{C}}_{\\textrm{m}}\\right)}²}{\\textrm{N}}}\
  \ $$](img/458833_2_En_4_Chapter_TeX_Equu.png)\n\n![$$ \\textrm{Diameter}={\\textrm{D}}_{\\\
  textrm{m}}=\\sqrt{\\frac{{\\sum_{\\textrm{i}=1}}^{\\textrm{N}}{\\sum_{\\textrm{j}=1}}^{\\\
  textrm{N}}{\\left({\\textrm{t}}_{mi}-{\\textrm{C}}_{\\textrm{m}}\\right)}²}{\\left(\\\
  textrm{N}\\right)\\left(\\textrm{N}-1\\right)}} $$](img/458833_2_En_4_Chapter_TeX_Equv.png)\n\
  \n如果你将簇视为一个包围该簇中所有成员点的空间中的圆，那么你可以将质心视为圆心。类似地，簇的半径和直径就是该圆的半径和直径。任何簇都可以用这三个参数来表示。良好聚类的一个衡量标准是，中心之间的距离应大于半径之和。\n\
  \n以下来自先前脚本的代码片段可用于可视化输出，其中来自同一簇的数据点应被视为聚集在一起。\n\n```\n#### create 3 clusters using\
  \ Agglomerative hierarchical clustering\nhrc= AgglomerativeClustering(n_clusters\
  \ = 3)\nplt.figure(figsize =(10, 10))\nplt.scatter(df_pca['P1'], df_pca['P2'], df_pca['P3'],\
  \ c = hrc.fit_predict(df_pca), cmap ='rainbow')\nplt.title(\"Agglomerative Hierarchical\
  \ Clusters - Scatter Plot\", fontsize=18)\nplt.show()\n```\n\n## 总结\n\n除了这些章节外，其他每一章都将包含我们将用于标记模型训练的数据。然后会有一组没有标签的新数据。模型会对这些数据进行标记。这被称为*监督学习*。\n\
  \n然而，本章中没有数据标签。算法根据它们的相似性对它们进行分组或标记。在一个非英语国家，孩子们在学校里在老师的监督下学习英语。然而，在观看 YouTube 视频两三年后，孩子们开始在没有指导的情况下说一些简单的英语。这被称为无监督学习。\n\
