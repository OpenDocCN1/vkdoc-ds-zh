  ## 使用 Python 进行回归


  回归将一个变量实现为一组自变量的线性或非线性多项式。


  这里有一个有趣的用例：使产品利润最大化的销售价格是多少？对于任何商家来说，这都是一个价值百万美元的问题。这个问题并不简单。最大化销售价格可能不会导致利润最大化，因为提高销售价格有时会降低销售量，从而降低总利润。因此，会存在一个最优的销售价格值，使得利润达到最大。


  有 *N* 条交易记录，包含 *M* 个特征，称为 F1、F2、... Fm（销售价格、购买价格、返现、SKU、订单日期等）。你需要找到一个由 K (K<M)
  个特征组成的子集，这些特征对商家的利润有影响，并为这 K 个特征建议一个最优值 V1、V2、... Vk，以最大化收入。


  你可以使用以下公式计算商家的利润：


  ![$$ \textrm{Profit}={\left( SP\hbox{-} TCB\hbox{-} BP\right)}^{\ast }\ SV $$](img/458833_2_En_3_Chapter_TeX_Equ1.png)


  (1)


  对于此公式，变量如下：


  *   SP = 销售价格

  *   TCB = 总返现金额

  *   BP = 购买价格

  *   SV = 销售量


  现在，使用回归，你可以将 SV 表示如下：


  ![$$ SV=\textrm{a}+{\textrm{b}}^{\ast } SP+{\textrm{c}}^{\ast } TCB+{\textrm{d}}^{\ast
  } BP $$](img/458833_2_En_3_Chapter_TeX_Equs.png)


  现在，你可以将利润表示为 SP、TCB 和 BP 的函数，并使用数学优化方法。通过约束所有参数值，你可以获得使利润最大化的参数最优值。


  这是回归的一个有趣用例。在许多场景中，一个变量必须实现为其他变量的线性或多项式函数。


  ### 最小二乘估计


  最小二乘估计是进行回归的最简单、最古老的方法。它也被称为*曲线拟合方法*。普通最小二乘（OLS）回归是最常用的技术，由卡尔·弗里德里希·高斯和阿德里安-马里·勒让德在
  18 世纪发明。以下是普通最小二乘估计中系数计算的推导过程：


  ![$$ {\displaystyle \begin{array}{c}Y= X\beta +\in \\ {}{X}^{\prime }Y={X}^{\prime
  } X\beta +{X}^{\prime}\in \\ {}{X}^{\prime }Y={X}^{\prime } X\beta +0\\ {}{\left({X}^{\prime
  }X\right)}^{-1}{X}^{\prime }Y=\beta +0\\ {}\beta ={\left({X}^{\prime }X\right)}^{-1}{X}^{\prime
  }Y\end{array}} $$](img/458833_2_En_3_Chapter_TeX_Equt.png)


  以下代码是 OLS 回归的一个简单示例：


  请在以下链接找到 CSV 文件：


  [`https://github.com/Apress/advanced-data-analytics-python-2e`](https://github.com/Apress/advanced-data-analytics-python-2e)


  ```

  import pandas as pd

  import statsmodels.api as sm

  df = pd.read_csv(''book\\ch3\\fetaure_engineering_data.csv'')

  #### df = pandas.read_csv("restaurants.csv")

  X = df[''LotArea'']

  Y = df[''SalePrice'']

  X = sm.add_constant(X)

  model = sm.OLS(Y, X).fit()

  summary = model.summary()

  print(summary)

  ```


  ### 逻辑回归


  逻辑回归是回归的一个有趣应用，它计算事件发生的概率。它引入了一个中间变量，该变量是线性变量的线性回归。然后，它通过逻辑函数传递该中间变量，将中间变量映射到 0
  到 1 之间。该变量被视为事件发生的概率。


  以下代码是对数值数据进行逻辑回归的示例：


  ```

  from sklearn.preprocessing import StandardScaler

  from sklearn.linear_model import LogisticRegression

  from sklearn.datasets import load_iris

  data, labels = load_iris(return_X_y=True)

  scaler = StandardScaler()

  data = scaler.fit_transform(data)

  model = LogisticRegression(random_state=0)

  model = model.fit(data, labels)

  print(model.predict(data[[50]]))

  ```




  #### 分类与回归


  分类与回归可应用于同一问题。例如，银行在审批信用卡或贷款时，会通过回归方法基于多个参数计算申请人的信用评分，并设定一个阈值。信用评分高于阈值的申请人被归类为潜在非欺诈用户，其余则被视为潜在欺诈用户。同样，任何二分类问题都可以通过对回归结果应用阈值来解决。在第
  4 章中，我详细讨论了如何从任意参数的分布中选择阈值。类似地，某些二分类方法也可替代逻辑回归使用。例如，假设某电商网站希望预测订单转化为成功发票的概率，该网站可以轻松通过逻辑回归实现。朴素贝叶斯分类器可直接应用于该问题，因为它在将订单分类为成功或失败类别时会计算概率。随机森林算法同样适用于此问题。在这种情况下，在*N*棵决策树中，如果有*M*棵决策树判定订单将成功，则*M*/*N*即为订单成功的概率。


  ## 有意使模型过拟合或欠拟合


  有时你需要有意进行过高或过低的预测。在拍卖中，当你从买方角度预测时，出价略低于原价总是有利的。同样，从卖方角度，你希望将价格设定得略高于原价。有两种方法可以实现这一点。在回归中，当你使用相关性选择特征时，有意过高预测会剔除某些负相关变量；类似地，过低预测则会剔除某些正相关变量。另一种处理方式是：在预测数值时，同时预测误差值。若要过高预测，当发现预测误差为正时，将预测值减去误差量；若要过低预测，当误差为正时，将预测值加上误差量。


  分类中的另一个问题是训练数据偏差。假设你有两个目标类别 A 和 B，大部分（例如 90%）训练数据属于 A 类。因此，当你用这些数据训练模型时，所有预测结果都会偏向
  A 类。一种解决方案是对训练数据进行有偏采样，即有意移除训练数据中的 A 类样本。另一种方法可用于二分类：由于 B 类在样本预测概率中属于少数，其概率始终低于
  0.5。接着计算所有归入 B 类的点的平均概率。对于任意点，如果其 B 类概率大于平均概率，则标记为 B 类，否则标记为 A 类。


  ## 处理分类数据


  对于支持向量机或回归等算法，输入数据必须是数值型。因此，处理分类数据时需要将其转换为数值型数据。一种转换策略是使用序数作为数值评分。另一种流行技术是使用*独热编码*。在第一种方法中，我们为每个类别分配数字。如果某列有五个类别，则对应五个数字（例如
  0 到 4）。而在独热编码中，会为每个类别创建一个新的二进制列，并根据类别标记为真或假。请运行以下代码以更好地理解：


  请通过以下链接查找 CSV 文件：


  [`https://github.com/Apress/advanced-data-analytics-python-2e`](https://github.com/Apress/advanced-data-analytics-python-2e)


  ```

  import pandas as pd

  from sklearn.preprocessing import OneHotEncoder

  from sklearn.preprocessing import OrdinalEncoder

  df = pd.read_csv(''book\\ch3\\fetaure_engineering_data.csv'')

  oe = OrdinalEncoder()

  df["Functional_code"] = oe.fit_transform(df[["Functional"]])

  print(df[["Functional", "Functional_code"]]. head(20))

  ohe = OneHotEncoder()

  ohe_results = ohe.fit_transform(df[["Functional"]])

  print(pd.DataFrame(ohe_results.toarray(), columns=ohe.categories).head(20))

  ```


