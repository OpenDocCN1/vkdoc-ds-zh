  ## 在 Python 中调用其他语言


  现在我们将介绍如何在 Python 中使用其他语言。这里有两个示例。第一个是从 Python 调用 R 代码。某些用例需要用到 R 代码。例如，如果你需要一个现成的函数来实现时间序列中的
  Holt-Winters 方法，这在 Python 中很难实现，但在 R 中却可以。因此，你可以使用 `rpy2` 模块从 Python 调用 R 代码，如下所示：


  ```

  import rpy2.robjects as ro

  ro.r(''data(input)'')

  ro.r(''x <-HoltWinters(input data frame)'')

  ```


  （你可以使用时间序列章节中给出的示例数据。）


  有时你需要从 Python 调用 Java 代码。例如，假设你正在处理自然语言处理（NLP）领域的命名实体识别问题；给定一些文本作为输入，你需要识别文本中的名称。Python
  的 `NLTK` 包确实有命名实体识别功能，但其准确性不高。此时，Stanford NLP 是更好的选择，但它是用 Java 编写的。你可以通过两种方式解决这个问题。


  - 你可以使用 Python 代码在命令行调用 Java。在调用之前，你需要使用 `yum/at-get install java` 命令安装 Java。

  - 对于 Windows，建议你从 [`https://adoptium.net/temurin/releases/?version=8`](https://adoptium.net/temurin/releases/%253Fversion%253D8)
  安装 JRE。你也可以从其他发行版安装 JRE。安装过程会自动创建 `JAVA_HOME`。如果没有，你需要将 `JAVA_HOME` 设置为系统变量，其值应为
  Java 安装文件夹的位置，例如 `JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-8.0.345.1-hotspot\`。

  - 你可以将 Stanford NLP 暴露为 Web 服务，并将其作为服务调用。（在运行此代码之前，你需要下载本书源代码中提供的 Stanford `nlp`
  JAR 文件。）


  ```

  import subprocess

  subprocess.call([''java'',''-cp'',''*'',''edu.stanford.nlp.sentiment.SentimentPipeline'',''-file'',''foo.txt''])

  请将 foo.txt 放在运行 Python 代码的同一文件夹中。

  ```


  ```

  nlp = StanfordCoreNLP(''http://127.0.0.1:9000'')

  output = nlp.annotate(sentence, properties={

  "annotators": "tokenize,ssplit,parse,sentiment",

  "outputFormat": "json",

  ## 仅在行末拆分句子。我们假设此方法只接收单个句子。

  "ssplit.eolonly": "true",

  ## 设置 enforceRequirements 以跳过某些注释器，加快处理速度

  "enforceRequirements": "false"

  })

  ```


  你将在第 2 章中看到更详细的 Stanford NLP 示例。


  ## 将 Python 模型暴露为微服务


  你可以将 Python 模型暴露为微服务，就像你的 Python 模型可以被其他人用来编写自己的代码一样。最好的方法是把你的模型暴露为一个 Web 服务。例如，以下代码使用
  Flask 暴露了一个深度学习模型：


  ```

  from flask import Flask, request, g

  from flask_cors import CORS

  import tensorflow as tf

  from sqlalchemy import *

  from sqlalchemy.orm import sessionmaker

  import pygeoip

  from pymongo import MongoClient

  import json

  import datetime as dt

  import ipaddress

  import math

  app = Flask(__name__)

  CORS(app)

  @app.before_request

  def before():

  db = create_engine(''sqlite:///score.db'')

  metadata = MetaData(db)

  g.scores = Table(''scores'', metadata, autoload=True)

  Session = sessionmaker(bind=db)

  g.session = Session()

  client = MongoClient()

  g.db = client.frequency

  g.gi = pygeoip.GeoIP(''GeoIP.dat'')

  sess = tf.Session()

  new_saver = tf.train.import_meta_graph(''model.obj.meta'')

  new_saver.restore(sess, tf.train.latest_checkpoint(''./''))

  all_vars = tf.get_collection(''vars'')

  g.dropped_features = str(sess.run(all_vars[0]))

  g.b = sess.run(all_vars[1])[0]

  return

  def get_hour(timestamp):

  return dt.datetime.utcfromtimestamp(timestamp / 1e3).hour

  def get_value(session, scores, feature_name, feature_value):

  s = scores.select((scores.c.feature_name == feature_name) & (scores.c.feature_value
  == feature_value))

  rs = s.execute()

  row = rs.fetchone()

  if row is not None:

  return float(row[''score''])

  else:

  return 0.0

  @app.route(''/predict'', methods=[''POST''])

  def predict():

  input_json = request.get_json(force=True)

  features = [''size'',''domain'',''client_time'',''device'',''ad_position'',''client_size'',
  ''ip'',''root'']

  predicted = 0

  feature_value = ''''

  for f in features:

  if f not in g.dropped_features:

  if f == ''ip'':

  feature_value = str(ipaddress.IPv4Address(ipaddress.ip_address(unicode(request.remote_addr))))

  else:

  feature_value = input_json.get(f)

  if f == ''ip'':

  if ''geo'' not in g.dropped_features:

  geo = g.gi.country_name_by_addr(feature_value)

  predicted = predicted + get_value(g.session, g.scores, ''geo'', geo)

  return str(math.exp(predicted + g.b)-1)

  app.run(debug = True, host =''0.0.0.0'')

  ```


  这段代码将一个深度学习模型暴露为 Flask Web 服务。JavaScript 客户端将发送包含 Web 用户参数（如 IP 地址、广告尺寸、广告位置等）的请求，并返回广告价格作为响应。这些特征是分类变量。你将在第
  3 章中学习如何将它们转换为数值分数。这些分数存储在内存数据库中。服务从数据库中获取分数，求和结果，然后回复给客户端。该分数将在深度学习模型的每次训练迭代中实时更新。它使用
  MongoDB 来存储该 IP 地址在该网站上的访问频率。这是一个重要的参数，因为第一次访问网站的用户通常是在真正搜索某些内容，而对于访问频率大于 5 的用户则并非如此。IP
  地址数量巨大，因此它们存储在分布式 MongoDB 数据库中。




  ## 高性能 API 与并发编程


