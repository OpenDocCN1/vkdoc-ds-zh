  import keras\nimport keras\nfrom sklearn.decomposition import PCA\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom plot_keras_history import plot_history\nimport matplotlib.pyplot\
  \ as plt\nsys.path.append('../resource')\nfrom MSSqlDb import MSSqlDbWrapper\nmssql_instance\
  \ = MSSqlDbWrapper(\"../config/config1.txt\")\ncon = mssql_instance.get_connect()\n\
  df = pd.read_sql(\"SELECT * from packet_table order by IP, PORT;\",con)\n#全局变量/参数\n\
  LSTM_UNITS1 = 150\nLSTM_UNITS2 = 100\nLSTM_UNITS3 = 50\nEPOCHS = 3\nDROPOUT_RATE\
  \ = 0.2\nTIMESERIESLEN = 50\n#读取训练 CSV\ndf = pd.get_dummies(df, columns = ['src_port',\
  \ 'dst_port', 'source', 'destination', 'protocol'])\ndf['time'] = pd.to_datetime(df['time'])\n\
  df = df.sort_values(by=\"time\")\ndf.set_index('time', inplace=True)\nprint(df.head())\n\
  df['alert_type'] = df['alert_type'].astype('category')\n#将分类列转换为编码\ndf['alert_type']\
