  \ *K-means 聚类*的一个例子。\n\nK-means 算法有两个输入。第一个是数据 `X`，它是一组 `N` 个向量；第二个是 `K`，它表示需要创建的聚类数量。输出是每个聚类中的一组\
  \ `K` 个质心，以及 `X` 中每个向量的一个标签，该标签指示分配给相应聚类的点。一个聚类内的所有点与其质心的距离都比与其他任何质心的距离更近。`K` 个聚类\
  \ `C[k]` 和 `K` 个质心 `μ[k]` 的条件可以表示如下：\n\n![$$ \\operatorname{minimize}\\sum \\limits_{k=1}^K\\\
  sum \\limits_{{\\textrm{x}}_n\\in {C}_k}{\\left\\Vert {\\textrm{X}}_n-{\\mu}_k\\\
