  plot_history(history.history, path=\"standard.png\")\nplt.show()\nscores = model.evaluate(test_generator)\n\
  print(\"Final Score\")\nprint(scores)\n```\n\n## 强化学习\n\n本节我们将讨论强化学习。从反馈中学习被称为*强化学习*。强化学习是机器学习三大主要方法之一，另外两种是监督学习和无监督学习。它通过在给定环境中执行特定任务来学习模型。程序与环境交互，执行动作以在不同状态之间移动。随后，动作会通过奖励或惩罚被赋予正面或负面评价。成功的动作得到强化，不成功的动作则受到惩罚。模型会经历多次迭代，以找到实现给定目标的最佳动作序列。以下是其背后的算法。\n\
  \n### TD0\n\n**算法** 此函数实现了 TD(0)表格算法。每次状态转换后都必须调用此函数。\n\n**函数** `TD0(X,R,Y,V)`:\n\
  \n*   `X =` 上一个状态\n*   `Y =` 下一个状态\n*   `R =` 与此转换相关的即时奖励\n*   `V =` 估计值数组\n\n`δ\
  \ = R + γ [V(Y) - V(X)]`\n\n`V[Y] = V[X] + α ∙ δ`\n\n其中 `α` 是步长。\n\n**返回** `V`\n\
  \n运行此函数时，请在命令提示符中传入以下文件：\n\n[`https://github.com/Apress/advanced-data-analytics-python-2e/blob/main/reinforcement_learning_td0_reduce_dat.csv`](https://github.com/Apress/advanced-data-analytics-python-2e/blob/main/reinforcement_learning_td0_reduce_dat.csv)\n\
  \n以下是一个 alpha 和 gamma 均为 1 的四步 TD0 示例：\n\n\n\n```python\nimport pandas as pd\nimport\
  \ numpy as np\nimport sys\nfrom sklearn.model_selection import train_test_split\n\
  import tensorflow as tf\nfrom keras.models import Sequential\nfrom keras.layers.core\
  \ import Dense\nfrom scipy.stats.stats import pearsonr\nfrom math import sqrt\n\
  if len(sys.argv)         \")\nexit(0)\n#读取输入数据\ndf = pd.read_csv(sys.argv[1])\n\
  split = int(sys.argv[3])\nout = open(sys.argv[2],'w')\nfinal_error = []\nsize =\
  \ int(df.shape[0]/split)\nmatched = 0\nrelaxed_matched = 0\ncount = 0\nsquare_sum\
  \ = 0\nsum = 0\n#对每个数据分片运行代码\nfor i in range(split):\nX = df.loc[i*size: (i+1)*size]\n\
  X = X.astype(float)\n#用列平均值填充缺失值\nX.fillna(X.mean(), inplace=True)\ny = X['y']\n\
  X.drop('y', inplace=True, axis=1)\nX_back = X\nX = X.as_matrix()\ny = y.as_matrix()\n\
  #将数据拆分为测试集和训练集\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=\
  \ 0.4, random_state=42)\n#数据标准化\nwhile(1):\nflag = True\nfor i in range(X_train.shape[1]):\n\
  if X_train[:,i].std() != 0:\nX_train[:,i] = (X_train[:,i]- X_train[:,i].mean())/X_train[:,i].std()\n\
  X_test[:,i] = (X_test[:,i]- X_test[:,i].mean())/X_test[:,i].std()\nelse:\nX_train\
  \ = np.delete(X_train,i,1)\nX_test = np.delete(X_test,i,1)\nflag = False\nbreak\n\
  if flag:\nbreak\nav = y_train.mean()\nst = y_train.std()\ny_train = (y_train- y_train.mean())/y_train.std()\n\
  index = []\ni1 = 0\nprocessed = 0\n#选择与 y 相关的列\nwhile(1):\nflag = True\nfor i in\
  \ range(X_train.shape[1]):\nif i > processed :\ni1 = i1 + 1\ncorr = pearsonr(X_train[:,i],\
  \ y_train)\nPEr= .674 * (1- corr[0]*corr[0])/ (len(X_train[:,i])**(1/2.0))\nif abs(corr[0])\
  \  6*PEr:\nX_train = np.delete(X_train,j,1)\nX_test = np.delete(X_test,j,1)\nflag\
  \ = False\nbreak\nbreak\nif flag:\nbreak\n#构建模型预测 y\nlearning_rate = 0.0001\nmodel\
  \ = Sequential([\nDense(64, activation=tf.nn.relu, input_shape=[X_train.shape[1]]),\n\
  Dense(64, activation=tf.nn.relu),\nDense(1)\n])\noptimizer = tf.train.RMSPropOptimizer(learning_rate)\n\
  model.compile(loss='mse',\noptimizer=optimizer,\nmetrics=['mae', 'mse'])\nmodel.fit(\n\
  X_train, y_train,\nepochs=int(X_train.shape[1]/2), validation_split = 0.2, verbose=0)\n\
  predict = model.predict(X_train)\n#构建模型预测预测误差\nerror = []\nfor i in range(len(predict)):\n\
  error.append(y_train[i] - predict[i][0])\nerror = np.array(error)\nmodel_e = Sequential([\n\
  Dense(64, activation=tf.nn.relu, input_shape=[X_train.shape[1]]),\nDense(64, activation=tf.nn.relu),\n\
  Dense(1)\n])\nmodel_e.compile(loss='mse',\noptimizer=optimizer,\nmetrics=['mae',\
  \ 'mse'])\nmodel_e.fit(\nX_train, error,\nepochs=int(X_train.shape[1]/2), validation_split\
  \ = 0.2, verbose=0)\n#使用训练好的模型预测测试数据\npredict = model.predict(X_test)\nerr_p = model_e.predict(X_test)\n\
  predict = predict + err_p\npredict = predict*st + av\nfor i in range(len(predict)):\n\
  error = y_test[i] - predict[i][0]\nif abs(error) <= 3:\nmatched = matched + 1\n\
  if abs(error/y_test[i]) <= 0.1:\nrelaxed_matched = relaxed_matched + 1\nsquare_sum\
  \ = square_sum + error*error\nsum = sum + error\ncount = count + 1\nout.write(\"\
  RMSE=\"+str(sqrt(square_sum/count))+'\\n')\nout.write(\"matched count=\"+ str(matched)\
  \ +'\\t Total count=' + str(count) +'\\n')\nout.write(\"ME=\"+str(sqrt(abs(sum)/count))+'\\\
  n')\nout.write(\"relaxed matched count=\"+ str(relaxed_matched) +'\\t Total count='\
  \ + str(count) +'\\n')\nout.close()\nprint(\"RMSE=\",str(sqrt(square_sum/count)),'\\\
  n')\nprint(\"matched count=\", str(matched),'\\t', \"Total count=\", str(count),'\\\
  n')\nprint(\"ME=\",str(sqrt(abs(sum)/count)),'\\n')\nprint(\"relaxed matched count=\"\
  , str(relaxed_matched),'\\t', \"Total count=\", str(count),'\\n')\n```\n\n你可以通过预测误差来提升任何回归问题的准确率，但对于分类问题来说，这种方法会稍微复杂一些。\n\
  \n#### TDλ\n\n**算法** 该函数使用替换迹（replacing traces）来执行表格形式的 `TD(λ)` 算法。每次状态转换后，都必须调用此函数。\n\
  \n**函数** `TDLambda` (*X*, *R*, *Y*, *V*, *z*)\n\n*   *X* = 上一个状态\n*   *Y* = 下一个状态\n\
  *   *R* = 与该转换相关的即时奖励\n*   *V* = 估计值的数组\n*   *z* = 资格迹的数组\n\n    `δ = R + γ · V[Y]\
  \ - V[X]`\n\n对于所有 `x ∈ X` 执行：\n\n`z[x] = γ · λ · z[x]`\n\n```\nif X = x then\nz[x]\
  \ = 1\nend if\nV[X] = V[x] + α · δ · z[x]\nend for\nreturn (V, z)\n```\n\n#### 辩证学习的示例\n\
  \n一位算法交易员现在希望将股票价格分为三个目标类别：`same`（持平）、`up`（上涨）和 `down`（下跌）。类别 `same` 表示股票价格保持不变。类别\
  \ `up` 表示股票价格正在上涨。类别 `down` 表示股票价格正在下跌。\n\n百分之九十七的数据被归类为 `same` 类别。时间序列大约有 20,000\
  \ 个数据点。对于这类问题，大多数人会使用有偏采样。而我们则采用了不同的方法。我们将数据分成每批 1,000 个点，每次迭代使用 1,000 个数据点训练模型，以预测接下来的\
  \ 100 个点。在 Keras 中，我们使用带有序列长度为 100 的 RNN 的 SoftMax 回归。现在，我们计算每次迭代中属于 `up`、`down`\
  \ 或 `same` 的概率。我们还计算了概率分布的均值和标准差。现在我们使用以下公式来确定每个类别的得分：\n\n`inc = (prob_increasing[j]\
  \ - increasing_mean + k_inc*increasing_std)`\n\n`dec = (prob_decreasing[j] - decreasing_mean\
  \ + k_dec*decreasing_std)`\n\n`same = (prob_same[j] - same_mean + k_same*same_std)`\n\
  \n其中 `k_inc`、`k_dec` 和 `k_same` 是初始化为 1 的常数。\n\n然后我们使用以下逻辑对数据进行分类：\n\n```\nif same\
  \ > 0:\npr_status = 0\nelse:\nif inc > dec:\npr_status = 100\nelse:\npr_status =\
  \ -100\n```\n\n因此，大部分数据被分类为 `same`，其余数据则归入其他类别。\n\n然后我们在每次迭代中计算以下参数：\n\n```\nif\
  \ acc_status == 0:\nif pr_status == 0:\nwrong_count_pos_same = wrong_count_pos_same\
  \ + 1\ntotal_count_acc_same = total_count_acc_same + 1\nelse:\nif pr_status != 0:\n\
  wrong_count_neg_same = wrong_count_neg_same + 1\ntotal_count_acc_not_same = total_count_acc_not_same\
  \ + 1\n```\n\n其中\n\n*   `wrong_count_pos_same` = 被错误分类为 `same` 类别的点数\n*   `total_count_acc_same`\
  \ = 实际属于 `same` 类别的点数\n*   `wrong_count_neg_same` = 未被正确分类为 `same` 类别的点数\n*   `total_count_acc_not_same`\
  \ = 实际不属于 `same` 类别的点数\n\n对于 `up` 和 `down` 类别，也计算相同的参数，考虑那些不属于 `same` 类别的点，然后在每次迭代后，使用以下逻辑调整常数：\n\
  \n```\nif total_count_acc_same != 0:\nif wrong_count_neg_same/total_count_acc_same\
  \ > .5:\nk_same = 1.2 * k_same\nif total_count_acc_not_same !=0:\nif wrong_count_pos_same/total_count_acc_not_same\
  \ > .5:\nk_same = 0.9 * k_same\n```\n\n因此，在所有候选类别之间建立了一种辩证关系，并且根据基于前 1,000 个点预测的局部\
  \ 100 个点趋势来调整这些点。这种模式可以提高任何模型在股票点预测中的分类准确率。原始代码如下所示。\n\n请从 `https://github.com/Apress/advanced-data-analytics-python-2e`\
  \ 复制 CSV 文件。\n\n\n\n```python\nimport matplotlib.pyplot as plt\nimport numpy as\
  \ np\nimport csv\nfrom keras.layers.core import Dense, Activation, Dropout\nfrom\
