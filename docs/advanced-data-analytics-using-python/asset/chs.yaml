  , optimizer=\"adam\")\n    return model\n\ndef run_network(data=None, target=None):\n\
  \    epochs = 2\n    ratio = 0.5\n    sequence_length = 50\n    X_train, y_train,\
  \ X_test, y_test = process_data(data, target, sequence_length)\n    model = build_model()\n\
  \    try:\n        model.fit(X_train, y_train, batch_size=512, nb_epoch=epochs,\
  \ validation_split=0.05, verbose=0)\n        predicted = model.predict(X_test)\n\
  \    except KeyboardInterrupt:\n        exit(0)\n    return y_test, predicted\n\n\
  def convert(x):\n    if x[0] == 1:\n        return -100\n    if x[1] == 1:\n   \
