  `textblob` 库还支持随机森林分类器，该分类器在处理以规范英语（例如正式信函）撰写的文本时效果最佳。对于通常语法不规范的文本（例如客户反馈），朴素贝叶斯效果更好。朴素贝叶斯在实时分析中还有另一个优势：你可以在不丢失先前训练结果的情况下更新模型。


  ## 图像识别


  图像识别是图像分类的一个常见示例。通过应用 `opencv` 库，在 Python 中很容易实现。


  请从 OpenCV GitHub ([`https://github.com/opencv/opencv/tree/master/data/haarcascades`](https://github.com/opencv/opencv/tree/master/data/haarcascades))
  下载模型文件 (`haarcascade_frontalface_default.xml`)，并从 [`https://en.wikipedia.org/wiki/File:Lenna_(test_image).png`](https://en.wikipedia.org/wiki/File:Lenna_%2528test_image%2529.png)
  下载示例 Lenna 图像。


