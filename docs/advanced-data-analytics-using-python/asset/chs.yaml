  \ 15 作为参数数量，因为网络数据包总共有 22 个输入参数。`PCA` 不是一个可更新的模型。开发可更新的特征选择模型仍是一个研究领域。\n\n这类系统对于想要预测用户是否会流失的电视频道非常有用。由于用户对频道没有成瘾性，*流失*被定义为在计划到期后\
  \ 24 小时内未续订的用户。然而，由于黑客不断尝试新方法，网络入侵检测模型总是会出现新型警报。因此，系统应首先对数据进行聚类，每个组代表一种不同类型的警报。对于每个类别，我们都有一个分类器模型，用于判断警报是否属于该类型。\n\
  \n\n\n## 循环神经网络\n\n*循环神经网络*是一种极为流行的网络类型，其前一步的输出会反馈至隐藏层或作为其输入。对于序列化算法或时间序列预测这类问题，它是一种非常有效的解决方案。序列化算法的一个常见应用是搜索引擎的自动补全功能。\n\
  \n### LSTM\n\n在 RNN 中，网络会接收来自过去的反馈。`X[(t)] = K × X[(t − 1)] = K² × X[(t − 2)] =\
  \ K^(N) × X[(t − N)]`。此时，如果 `K > 1`，则 `K^(N)` 会非常大；反之，如果 `K < 1`，则 `K^(N)` 会非常小。为避免此问题，网络会通过编程方式遗忘部分过去的状态。LSTM\
  \ 正是为此而生。\n\n这样一来，它就能在任意时间间隔内记住数值。LSTM 在处理具有未知时长时滞的时间序列分类、处理和预测任务时表现优异。对间隔长度相对不敏感的特性，使得\
  \ LSTM 相比其他 RNN、隐马尔可夫模型及其他序列学习方法更具优势。\n\nRNN 和 HMM 依赖于发射/序列之前的隐藏状态。如果我们想预测 500 个间隔后的序列（而非\
  \ 5 个），LSTM 能够记住这些状态并进行准确预测。\n\n简单来说，假设一个人会遗忘旧记忆，只记得近期的事情。但未来执行某些任务时，他们又需要这些过去的记忆。这就是传统\
  \ RNN 面临的问题。而另一个人则能同时记住过去的重要记忆和近期记忆，并删除无用的旧记忆。这样，他们就能更高效地利用这些信息来完成任务。这正是 LSTM 的工作方式。\n\
  \n每个 LSTM 单元有三个输入：`h[{t − 1}]`、`c[{t − 1}]` 和 `x[t]`，以及两个输出：`h[t]` 和 `c[t]`。对于给定时间\
  \ `t`，`h[t]` 是隐藏状态，`c[t]` 是单元状态或记忆，`x[t]` 是当前数据点或输入。第一个 Sigmoid 层有两个输入：`h[{t − 1}]`\
  \ 和 `x[t]`，其中 `h[{t − 1}]` 是前一个单元的隐藏状态。该层被称为*遗忘门*，其输出用于选择前一个单元信息被保留的比例。输出是 `[0,1]`\
  \ 范围内的一个数值，该数值与前一个单元状态 `c[{t − 1}]` 进行逐元素相乘。\n\n网络数据包是一个序列，因此 RNN 可以方便地应用于异常检测系统。一个区别在于，我们将数据存储在云数据库中，并按\
  \ IP 地址和端口进行排序。这种排序至关重要，因为如果没有合适的序列，就无法获得良好的结果。第 3 章讨论的自相关函数可用于判断序列是否正确。\n\n```\n\
