  \ 聚类有一个局限性。例如，假设你所有的数据点都位于印度东部。对于 `K=4` 聚类，初始步骤是你随机选择德里、孟买、金奈和加尔各答中的一个中心。你所有的点都在印度东部，因此所有点都离加尔各答最近，并且总是被分配给加尔各答。因此，程序将一步收敛。为了避免这个问题，该算法会运行多次并取平均值。程序员可以使用各种技巧来初始化第一步中的质心。\n\
  \n## 选择 K：肘部法则\n\n在某些情况下，你必须确定 K-means 聚类中的 `K`。为此，你必须使用肘部法则，该法则使用方差百分比作为依赖于聚类数量的变量。最初，选择几个聚类。然后添加另一个聚类，但这并不会使数据建模变得更好。此时选择聚类数量，这就是*肘部准则*。这个“肘部”并不总是能被明确识别。方差百分比被实现为各个聚类的组间方差与总方差的比率。假设在前面的例子中，零售商有四个城市：德里、加尔各答、孟买和金奈。程序员不知道这一点，因此使用\
  \ `K=2` 到 `K=9` 进行聚类，并绘制方差百分比。程序员将得到一条肘形曲线，该曲线清楚地表明 `K=4` 是 `K` 的正确数量。\n\n## 轮廓分析\n\
  \n轮廓分析是选择 `K` 值的另一种方法。它衡量一个对象与其自身聚类（内聚性）相比与其他聚类（分离度）的相似程度。轮廓值的范围是 −1 到 +1；值越高，对象与其自身聚类的匹配度越高。对于大多数数据点来说，拥有高值是理想的。如果许多点的值较低或为负，则聚类配置不正确。\n\
  \n轮廓可以使用任何距离度量来计算，例如欧几里得距离，这将在后面讨论。\n\n每个数据点 `i` 的轮廓分数 `s(i)` 定义如下：\n\n![$$ {\\\
  displaystyle \\begin{array}{l}s(i)=\\frac{b(i)-a(i)}{\\max \\left\\{a(i),b(i)\\\
  right\\}},\\textrm{if}\\;\\left|{C}_i\\right|&gt;1\\\\ {}\\textrm{and}\\\\ {}s(i)=0,\\\
  textrm{if}\\;\\left|{C}_i\\right|=1\\end{array}} $$](img/458833_2_En_4_Chapter_TeX_Equb.png)\n\
