  在我们进入关系数据库的主题之前，先来谈谈数据库规范化。


  ## 范式


  数据库范式是以最佳方式组织数据的原则。


  数据库中的每个表都可以处于我们接下来要介绍的某种范式中。对于主键（PK）和外键（FK），我们希望尽可能减少重复。其余信息应从其他表中获取。


  *   第一范式（1NF）

  *   第二范式（2NF）

  *   第三范式（3NF）




  ### 第一范式


  *第一范式*要求每个行列交叉点只允许存放单个值，因此不存在重复组。


  要达到第一范式，需要移除重复组，并建立两个新关系来规范化包含重复组的连接。


  为了实现唯一标识，新连接的`PK`由旧关系的`PK`和新形成关系的某个特征组合而成。


  为了演示`1NF`的规范化过程，我们将使用来自`School`数据库的`Student_Grade_Report`表。


  1. `Student_Grade_Report`表中的重复组包含课程信息。一个学生可以选修多门课程。

  2. 移除重复出现的组。在此例中，即每个学生的课程信息。

  3. 确定新表的`PK`。

  4. 属性值必须能被`PK`（`StudentNo`和`CourseNo`）唯一标识。


  ```

  Student_Grade_Report (StudentNo, StudentName, Major, CourseNo, CourseName, InstructorNo,
  InstructorName, InstructorLocation, Grade)

  ```


  ```

  Student (StudentNo, StudentName, Major)

  StudentCourse (StudentNo, CourseNo, CourseName, InstructorNo, InstructorName, InstructorLocation,
  Grade)

  ```


  ### 第二范式


  *第二范式*要求关系必须首先满足`1NF`。当且仅当`PK`包含单个特征时，该关系自动满足`2NF`。


  如果连接包含复合`PK`，那么每个非键属性必须完全依赖于整个`PK`，而不是仅依赖于其中一部分（即，不能存在任何部分依赖或部分增强）。


  一个表在进入`2NF`之前必须首先满足`1NF`。


  1. `Student`表因其`PK`为单列，所以已经满足`2NF`。

  2. 观察`StudentCourse`表，你会发现并非所有属性（尤其是课程详细信息）都完全依赖于`PK`。成绩是唯一完全依赖于`xxx`的属性。

  3. 找到包含课程详细信息的新表。

  4. 确定新表的`PK`。


  三个新表如下：


  **Student** `(StudentNo, StudentName, Major)`


  **CourseGrade** `(StudentNo, CourseNo, Grade)`


  **CourseInstructor** `(CourseNo, CourseName, InstructorNo, InstructorName, InstructorLocation)`


  ### 第三范式


  要满足*第三范式*，关系必须处于第二范式。同时，必须消除所有传递依赖；一个非键属性不能函数依赖于另一个非键属性。


  以下是实现`3NF`的步骤：


  1. 从每个存在传递关系的表中，移除所有处于传递依赖关系中的属性。

  2. 创建一个包含被移除依赖项的新表。

  3. 检查新表和更新后的表，确保每个表都有一个决定因素，并且没有表存在不恰当的依赖关系。


  查看这四个新表：


  ```

  Student (StudentNo, StudentName, Major)

  CourseGrade (StudentNo, CourseNo, Grade)

  Course (CourseNo, CourseName, InstructorNo)

  Instructor (InstructorNo, InstructorName, InstructorLocation)

  ```


  此时，第三范式应不存在异常。对于此示例，请参考图 2-1 中的依赖关系图。如前所述，第一步是消除重复分组。


  ![](img/458833_2_En_2_Fig1_HTML.jpg)


  堆栈图展示了学号、课程号、课程名、教师编号、教师姓名、教师位置和成绩这些字段如何通过`PD`、`TD`和`FD`相关联。


  **图 2-1** 依赖关系图


  ```

  Student (StudentNo, StudentName, Major)

  StudentCourse (StudentNo, CourseNo, CourseName, InstructorNo, InstructorName, InstructorLocation,
  Grade)

  ```


  回顾图 2-1 中的依赖关系，该图总结了`School`数据库的规范化过程。


  图 2-1 中使用的缩写如下：


  - `PD` 代表部分依赖（partially dependent）。

  - `TD` 代表传递依赖（transitive dependence）。

  - `FD` 代表完全依赖（full dependency）。（在大多数情况下，`FD`代表函数依赖。仅在图 2-1 中，`FD`用作完全依赖的缩写形式。）


  当数据是结构化的并且字段之间保持严格关系时，关系型数据库非常有价值。但是，如果你没有结构化的数据，且字段之间没有保持严格关系，该怎么办？这时就需要用到 Elasticsearch。


  ## Elasticsearch


  你会发现数据通常是非结构化的。这意味着你最终可能会得到图像数据、传感器数据和其他形式数据的混合体。要分析这些数据，我们首先需要存储它。基于 MySQL 或 SQL
  的数据库不擅长存储非结构化数据。因此，这里我们介绍一种不同类型的存储，主要用于处理非结构化的文本数据。


  Elasticsearch 是一个基于 Lucene 的数据库，这使得存储和搜索文本数据变得容易。它的查询接口是一个 REST API 端点。Elasticsearch（`ES`）低级客户端提供了从
  Python 到 `ES` REST 端点的直接映射。Elasticsearch 的一大优势是它在一个地方为数据分析提供了全栈解决方案。Elasticsearch
  是数据库。它有一个可配置的前端叫 Kibana，一个数据收集工具叫 Logstash，以及一个企业级安全功能叫 Shield。


  此示例包含名为 `cat`、`cluster`、`indices`、`ingest`、`nodes`、`snapshot` 和 `tasks` 的特性，它们分别对应
  `CatClient`、`ClusterClient`、`IndicesClient`、`CatClient`、`ClusterClient`、`IndicesClient`、`IngestClient`、`NodesClient`、`SnapshotClient`、`NodesClient`、`SnapshotClient`
  和 `TasksClient` 的实例。这些实例是访问这些类及其方法的唯一受支持方式。


  你可以指定自己的连接类，通过提供 `connection_class` 参数来使用它。


  ```

  #### 使用 ThriftConnection 创建到本地主机的连接

  Es1=Elasticsearch(connection_class=ThriftConnection)

  ```


  Elastic Search 的安装命令如下：


  ```

  curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | sudo apt-key add
  -

  echo "deb https://artifacts.elastic.co/packages/7.x/apt stable main" | sudo tee
  -a /etc/apt/sources.list.d/elastic-7.x.list

  sudo apt update

  sudo apt install elasticsearch

  ```


  你可以在 Ubuntu 中使用以下命令启动 Elasticsearch：


  ```

  service elasticsearch start

  service elasticsearch stop

  ```


  你可以使用以下命令检查状态：


  ```

  service elasticsearch status

  ```


  ```

  # 创建连接，该连接将自动检查集群以获取

  # 活动节点列表。从运行在 ''esnode1'' 和

  # ''esnode2'' 上的节点开始

  Es1=Elasticsearch(

  [''esnode1'', ''esnode2''],

  #### 在开始任何操作前嗅探

  sniff_on_start=True,

  # 在节点无响应后刷新节点列表

  sniff_on_connection_fail=True,

  # 并且每 30 秒刷新一次

  sniffer_timeout=30

  )

  ```


  不同的主机可以有不同的参数（主机名、端口号、SSL 选项）；你可以为每个节点使用一个字典来指定它们。


  ```

  # 直接连接到本地主机，并使用 SSL 连接到

  # 另一个节点（端口 443）

  # 以及一个 url_prefix。注意 ``port`` 需要是整数。

  Es1=Elasticsearch([

  {''host'':''localhost''},

  {''host'':''othernode'',''port'':443,''url_prefix'':''es'',''use_ssl'':True},

  ])

  ```


  也支持 SSL 客户端认证（有关选项的详细说明，请参见 `Urllib3HttpConnection`）；示例如下：


  ```

  Es1=Elasticsearch(

  [''localhost:443'',''other_host:443''],

  #### 开启 SSL

  use_ssl=True,

  #### 确保验证 SSL 证书（默认关闭）

  verify_certs=True,

  #### 提供磁盘上 CA 证书的路径

  ca_certs=''path to CA_certs'',

  #### PEM 格式的 SSL 客户端证书

  client_cert=''path to clientcert.pem'',

  #### PEM 格式的 SSL 客户端密钥

  client_key=''path to clientkey.pem''

  )

  ```




  ### 连接层 API


  许多类负责与 Elasticsearch 集群交互。这里，通过将参数传递给 `Elasticsearch` 类，可以忽略正在使用的默认子类。所有属于客户端的参数都会被添加到
  `Transport`、`ConnectionPool` 和 `Connection` 上。


  例如，如果你想使用自己定制的 `ConnectionSelector` 类，只需传入 `selector_class` 参数即可。


  整个 API 以高精度封装了原始 REST API，包括对调用中必需参数和可选参数的区分。这意味着代码区分了位置参数和关键字参数；我建议你在所有调用中使用关键字参数，以保持一致性和安全性。如果
  Elasticsearch 返回 2XX 响应，则 API 调用成功（并将返回一个响应）。否则，将引发 `TransportError`（或其更具体的子类）实例。你可以在
  exceptions 中查看其他异常和错误状态。如果你不希望引发异常，可以始终传入一个 `ignore` 参数，该参数可以是一个应被忽略的单个状态码，也可以是一个状态码列表。


  ```

  from elasticsearch import Elasticsearch

  es=Elasticsearch()

  #### 忽略创建索引时由 IndexAlreadyExistsException 引起的 400 错误

  es.indices.create(index=''test-index'',ignore=400)

  #### 忽略 404 和 400 错误

  es.indices.delete(index=''test-index'',ignore=[400,404])

  ```


