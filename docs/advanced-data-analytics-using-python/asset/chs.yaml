  \ 在内存中执行操作。通过命令行参数，我们可以更改执行内存的默认大小。Spark 可以处理大于其 RAM 的文件，但必须使用磁盘内存来完成。例如，输入的日志文件大于\
  \ Spark 内存大小，但程序成功地从其中过滤出了重要行。然而，有一个例外。如果你决定执行 join 操作，Spark 需要两个数据帧的内存。我们在这里使用\
  \ join，并通过 `unpersist` 函数手动调用 Spark 垃圾回收器，以使代码尽可能内存优化。但这会降低代码速度。如果去掉这段代码，程序运行会更快，但会消耗更多内存。\n\
  \n\n\n## 云端分析\n\n与其他许多领域一样，分析领域也正受到云计算的冲击。这种影响体现在两个方面。大型云服务商持续推出机器学习 API，因此开发者无需关注底层算法，就能轻松编写机器学习应用。例如，谷歌提供了计算机视觉、自然语言处理、语音处理等众多\
  \ API。用户只需编写两三行代码，就能分析人脸图像或语音的情感倾向。\n\n云计算的第二个方面体现在数据工程领域。在第 1 章中，我们举例说明了如何使用`Falcon`将模型封装为高性能\
  \ REST API。现在，如果有一百万用户要使用该 API，且负载波动较大，那么自动扩缩容就成为该应用的必备功能。若将应用部署在 Google App Engine\
  \ 或 AWS Lambda 上，只需 15 分钟即可实现自动扩缩容。应用实现自动扩缩容后，就需要考虑数据库问题。亚马逊的`DynamoDB`和谷歌的`Cloud\
  \ Datastore`都是云端自动扩缩容的数据库。使用其中任何一种，你的应用都将具备高性能和自动扩缩容能力。但由于全球用户都会访问，地理距离会造成额外延迟，对性能产生负面影响。你还必须确保应用始终可用。此外，你需要将应用部署在三个区域：欧洲、亚洲和美国（如果预算允许，可以选择更多区域）。如果使用带有地理负载均衡路由规则的弹性负载均衡器，将各区域的流量路由到该区域的\
  \ App Engine，那么应用就能在全球范围内可用。在地理负载均衡中，你可以为每条规则指定一个辅助 App Engine，这能实现应用的高可用性。当主 App\
  \ Engine 宕机时，辅助 App Engine 会接管服务。\n\n图 7-6 描述了该系统。\n\n![](img/458833_2_En_7_Fig6_HTML.png)\n\
  \n流程图列出了弹性负载均衡器。它包含系统实例 1、2 和 3，主区域分别为亚洲、美国和欧洲，辅助区域分别为美国、欧洲和亚洲。\n\n图 7-6\n\n系统架构\n\
