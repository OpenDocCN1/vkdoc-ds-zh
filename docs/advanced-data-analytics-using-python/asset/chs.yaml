  \ Google App Engine：\n\n```\ngcloud app deploy --prject   --version \n```\n\n函数的流程如下：\n\
  \n1. 广告服务器请求进行曝光预测。\n2. 当主线程接收到请求预测器时，它会为每个特征创建一个新线程。\n3. 每个线程通过向数据存储发送并发请求，计算每个特征的`is\
  \ big`、`floor`、`floor big`、`probability`和`probability big`。如果在数据存储中未找到该特征或值，则返回\
  \ 0。\n4. 如果`is big`指示为高价值曝光，则使用高分值；否则，使用一般分值。\n5. 预测得分 = 每个特征的得分之和。\n6. 使用从数据存储获取的乘数范围计算最终的预测底价。\n\
  7. 在响应中将预测的底价值返回给广告服务器。\n\n## 物联网\n\n物联网简单来说就是由嵌入传感器、软件、网络连接和必要电子元件的互联设备组成的网络，这些设备能够收集和交换数据，使其具备响应能力。随着大数据、实时分析框架、移动通信和智能可编程设备等技术的兴起，这一领域正在蓬勃发展。在物联网中，你可以使用本书中介绍的技术在服务器端分析数据；你也可以使用树莓派（一种基于\
  \ Python 的嵌入式系统）在设备端部署逻辑。\n\n### 数据科学家必备的架构模式\n\n数据并非孤立实体。它必须从某个应用或系统收集数据，然后准确地存储在特定的存储中，再在该模型之上构建模型，最后必须将该模型作为\
  \ API 提供，以便与其他系统连接。这个 API 有时需要以一定的延迟在全球范围内提供服务。因此，创建一个成功的智能系统需要大量的工程投入。在当今的初创企业环境中，这是一个价值数十亿美元的行业，一个组织无法负担雇佣大量专家来为其产品创造独特功能。在初创企业世界中，数据科学家必须是全栈分析专家。因此，在接下来的章节中，我们将通过虚构人物汤姆的不同场景，来说明任何数据科学家都应了解的几种关键架构模式。\n\
  \n\n\n### 场景一：烫手山芋反模式\n\n汤姆受聘为一家在线公司的数据科学家，负责开发实时分析产品。因此，第一步是从其组织的应用程序中收集数据。他们使用云来自动扩展存储，并将数据直接从应用程序推送到数据库。在测试环境中，一切似乎都井然有序。为了确保没有数据丢失，他们使用了\
  \ TCP 连接。然而，当系统上线时，他们没有对主应用程序做任何更改，但它却崩溃了。公司在半小时内遭受了巨大损失，而汤姆也为他实时分析系统的第一步收到了实时反馈：他被解雇了。\n\
  \n现在的问题是，为什么在没有任何改变的情况下，主应用程序会崩溃。从经典计算机科学的角度来看，这被称为*忙碌消费者问题*。这里，主应用程序是数据的发送方，而数据库是消费者。当消费者忙碌时（这在任何运行大量查询的数据库中都很常见），它很难处理传入的数据。此外，由于\
  \ TCP 连接保证了数据的送达，发送方会重新发送数据，这导致发送方再次负载，而发送方正是主应用程序。这种情况类似于将烫手山芋从一个人传给另一个人，而接收者反复将烫手山芋送回给发送者。这就是为什么它被称为烫手山芋反模式。图\
  \ 7-7 直观地解释了这一序列。\n\n![](img/458833_2_En_7_Fig7_HTML.png)\n\n一张图表说明了发送方如何将数据发送给接收方，而接收方又循环地将无法处理的确认信息返回给发送方。\n\
  \n**图 7-7** 描述烫手山芋反模式的序列图\n\n这种情况包含两个要素。如果发送方和接收方之间传递的数据不是必需的，我们可以使用 UDP 协议，它会丢弃无法送达的数据。这也是为什么\
  \ UDP 被用于所有网络监控协议（如 SNMP 和 NetFlow）的原因之一。它不需要设备为了监控而负载。然而，如果数据是关键的，例如在金融行业，我们必须在发送方和接收方之间创建一个消息队列。当接收方无法处理数据时，它充当一个缓冲区。如果队列内存已满，数据会丢失，或者负载会转移到发送方。`ZMQ`\
  \ 代表“零消息队列”，它本质上不过是一个 UDP 套接字。\n\n在云平台中，有许多现成的解决方案；我们在第 2 章中深入探讨了它们。以下 Node.js 代码展示了一个收集器的示例，该收集器使用\
  \ Rabit-MQ 并将其作为 REST API 暴露给发送方，并使用 Google Big Query 作为接收方。\n\n#### 代码：数据收集模块\n\
  \n```javascript\nvar https = require(\"https\");\nvar express = require('express');\n\
  var router = express.Router();\nvar _ = require('underscore');\nvar moment = require('moment-timezone');\n\
  var RedisSMQ = require('rsmq');\nvar RSMQWorker = require('rsmq-worker');\nvar rsmq_h\
  \ = new RedisSMQ({host: '127.0.0.1', port: 6379, ns: 'rsmq'});\nrsmq_h.createQueue({qname:\
  \ 'hadoopqueue'}, function (err, resp) {\nif (err) {\nconsole.log(err.message);\n\
  }\nif (resp === 1) {\nconsole.log('✔ Message Queue created');\n}\n});\nvar worker_h\
  \ = new RSMQWorker('hadoopqueue');\nworker_h.on('message', function(data, next,\
  \ id) {\nconst BigQuery = require('@google-cloud/bigquery');\nconst bigquery = BigQuery({\n\
  projectId: 'sayantest1979'\n});\nconst dataset = bigquery.dataset('adlog');\nconst\
  \ table = dataset.table('day1');\nrows = JSON.parse(data);\ntable.insert(rows)\n\
  .then((insertErrors) => {\nconsole.log('Inserted:');\nrows.forEach((row) => console.log(row));\n\
  });\nnext();\n});\nworker_h.on('error', function(err, msg) {\nconsole.log('ERROR',\
  \ err, msg.id);\n});\nworker_h.start();\nrouter.post('/collect', function(req, res,\
  \ next) {\nres.setHeader('Access-Control-Allow-Origin', '*');\nvar data = req.body,\n\
  dataArray = [],\nfor (k in data) {\nvar kv = data[k].split('|');\nvar dataObj =\
  \ {};\nfor (i=0; i < kv.length; i++) {\nvar d = kv[i].split(':');\ndataObj[d[0]]\
  \ = decodeURIComponent(d[1]);\n}\ndataObj['server_time'] = moment().toDate().valueOf();\n\
  dataObj['ip'] = require('ipware')().get_ip(req).clientIp;\nvar str = JSON.stringify(dataObj,\
  \ require('json-decycle').decycle());\ndataArray.push(str);\n}\nvar dataString =\
  \ dataArray.join(',\\n');\ndataString = \"[ \" + dataString + \" ]\";\nrsmq_h.sendMessage({qname:\
  \ 'hadoopqueue', message: dataString + '\\n'}, function (err, resp) {\nresp && console.log('Message\
  \ sent. ID:', resp);\n});\nres.end('OK');\n});\nmodule.exports = router;\n```\n\n\
  现在，让我们探讨其他重要的架构模式：代理模式和分层模式。\n\n### 场景二：代理与分层模式\n\n汤姆开始在一家新公司工作。由于公司规模很大，没有失业风险。在这种情况下，他不再冒险去收集数据。数据存储在一个\
  \ MySQL 服务器上。汤姆之前对数据库一无所知。他热衷于学习 MySQL。在他的代码中，他编写了大量的查询语句。数据库由另一个团队拥有，他们的经理喜欢研发。所以每周一，汤姆都会接到电话，通知他数据库从\
  \ MySQL 换成了 Mongo，随后又从 Mongo 换成了 SQL Server，这要求他修改整个代码。汤姆不再失业，但他每天午夜才能下班回家。\n\n\
  似乎所有人都同意解决方案是合理地组织代码。然而，理解代理模式和分层模式会很有帮助。在代理模式中，不要在代码中使用原始的 MySQL 或 Mongo 连接，而是使用一个包装类作为代理。使用分层技术，将代码分成多个层，每一层只使用其下一层的方法。在这种情况下，数据库配置应该在最低层，即核心层完成。其上是数据库工具层，包含数据库查询语句。再往上是业务实体层，它使用数据库查询。下面的\
  \ Python 代码将帮助你更清晰地理解这一点。汤姆现在知道，如果数据库层面有任何变化，他需要检查核心层；如果查询有任何变化，他需要检查数据库工具层；如果业务参与者有任何变化，他需要检查实体层。因此，他的生活现在变得简单了。\n\
  \n\n\n#### 数据库核心层\n\n```\nimport MySQLdb\n\nclass MysqlDbWrapper(object):\n    connection\
  \ = None\n    cursor = None\n\n    def __init__(self, configpath):\n        f =\
  \ open(configpath)\n        config = {}\n        for line in f:\n            fields\
  \ = line.strip().split(' ')\n            config[fields[0]] = fields[1].strip()\n\
  \        f.close()\n        self.connection = MySQLdb.connect(host=config['hostname'],\
  \ user=config['username'], passwd=config['passwd'], db=config['dbname'])\n     \
  \   self.cursor = self.connection.cursor()\n\n    def close_mysql(self):\n     \
  \   self.cursor.close()\n        self.connection.close()\n\n    def get_data(self,\
  \ query):\n        self.cursor.execute(query)\n        return self.cursor.fetchall()\n\
  \nfrom pymongo import MongoClient\n\nclass MongoDbWrapper(object):\n    collection\
  \ = None\n    client = None\n    db = None\n\n    def __init__(self, configpath):\n\
  \        f = open(configpath)\n        mongoconfig = {}\n        for line in f:\n\
  \            fields = line.strip().split('=')\n            mongoconfig[fields[0]]\
  \ = fields[1].strip()\n        f.close()\n        self.client = MongoClient('mongodb://'\
  \ + mongoconfig['usr'] + ':' + mongoconfig['pswd'] + '@' + mongoconfig['host'] +\
  \ '/' + mongoconfig['db'])\n        self.db = self.client[mongoconfig['db']]\n \
  \       self.collection = self.db[mongoconfig['collection']]\n\n    def close_mongo(self):\n\
  \        self.client.close()\n\n    def get_data(self):\n        return self.collection.find({\"\
  _type\": \"node\", \"status\": 1})\n```\n\n#### 数据库工具层\n\n```\nfrom mongo import\
  \ MongoDbWrapper\nimport collections\nimport time\n\nclass MongoUtility(object):\n\
  \    mongo_instance = None\n    res = None\n\n    def __init__(self, configpath):\n\
  \        self.mongo_instance = MongoDbWrapper(configpath)\n\n    def load_data(self):\n\
  \        self.res = self.mongo_instance.get_data()\n        # print self.res\n\n\
  \    def shutdown(self):\n        self.mongo_instance.close_mongo()\n\nfrom mysql\
  \ import MysqlDbWrapper\n\nclass MysqlUtility(object):\n    mysql_instance = None\n\
  \n    def __init__(self, configpath):\n        self.mysql_instance = MysqlDbWrapper(configpath)\n\
  \n    def load_score(self):\n        scores = {}\n        data = self.mysql_instance.get_data(\"\
  select * from category_score\")\n        for row in data:\n            feature_name\
  \ = row[1].strip()\n            provider = row[0].strip()\n            feature_value\
  \ = row[2].strip()\n            score = row[4] / row[3]\n            # print feature_name,\
  \ feature_value, provider, score\n        return scores\n\n    def shutdown(self):\n\
  \        self.mysql_instance.close_mysql()\n```\n\n最后一层将是一个推荐系统的抽象，以 JSON 代码形式呈现，如下所示：\n\
  \n```\n{\n    \"all\": {\n        \"block_categories\": [916105, 1011724, 1011726,\
  \ 1011727],\n        \"no_of_category\": 8,\n        \"no_of_node\": 40,\n     \
  \   \"no_of_match\": 2,\n        \"favourite_weight\": 0.5,\n        \"default_category\"\
  : [10037913, 10037914, 10053952],\n        \"conditional_block_categories\": {\n\
  \            \"rule\": [\n                {\n                    \"if\": {\n   \
  \                     \"categories\": [10244361],\n                        \"relation\"\
  : \"or\"\n                    },\n                    \"then\": {\n            \
  \            \"categories\": [10244361, 10057506],\n                        \"relation\"\
  : \"or\",\n                        \"blockOrallow\": false\n                   \
  \ }\n                }\n            ]\n        },\n        \"category_weightedge\"\
  : {\n            \"rule\": [\n                {\n                    \"origin\"\
  : \"Identifier\",\n                    \"weight\": 0.5\n                },\n   \
  \             {\n                    \"origin\": \"previousnode\",\n           \
  \         \"weight\": 0.5\n                }\n            ]\n        }\n    },\n\
  \    \"250\": {}\n}\n```\n\n## 致谢\n\n感谢您阅读本书。我们希望您和我们撰写本书时一样享受阅读的乐趣。我们希望本书能帮助您在机器学习领域留下足迹。我们鼓励您持续在不同的数据集上实践，并为开源社区做出贡献。您随时可以通过出版社与我们联系。再次感谢您，并致以最美好的祝愿！\n\
