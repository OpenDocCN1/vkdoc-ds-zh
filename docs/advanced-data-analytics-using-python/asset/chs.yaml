  ## 最近邻分类器


  最近邻分类器是一种简单的基于距离的分类器。它计算测试数据与训练数据的距离，并根据目标类别对距离进行分组。与测试实例平均距离最小的目标类别被选为测试数据的类别。这里展示了一个
  Python 示例：


  ```

  from sklearn.neighbors import KNeighborsClassifier

  from sklearn.datasets import load_iris

  iris_data = load_iris()

  data, labels = iris_data.data, iris_data.target

  model = KNeighborsClassifier()

  model = model.fit(data, labels)

  print(model.predict(data[[50]]))

  ```




  ## 情感分析


  情感分析是文本分类的一个有趣应用。例如，假设一家航空公司想要分析其客户反馈。它根据情感（正面/负面）以及方面（食物/员工/准点率）对反馈进行分类。之后，它可以轻松了解其业务优势（获得最多正面反馈的方面）和劣势（获得最多负面反馈的方面）。该航空公司还可以将此结果与竞争对手进行比较。与竞争对手进行比较的一个有趣优势是，它消除了模型准确性的影响，因为相同的准确性适用于所有竞争对手。使用
  `textblob` 库在 Python 中实现这一点很简单，如下所示：


  ```

  from textblob.classifiers import NaïveBayesClassifier

  train = [(''I love this sandwich.'', ''pos''),  (''this is an amazing place!'',
  ''pos''),(''I feel very good about these beers.'', ''pos''),(''this is my best work.'',
  ''pos''),("what an awesome view", ''pos''),(''I do not like this restaurant'', ''neg''),(''I
  am tired of this stuff.'', ''neg''),("I can''t deal with this", ''neg''),(''he is
  my sworn enemy!'', ''neg''),(''my boss is horrible.'', ''neg'')]

  cl = NaïveBayesClassifier(train)

  print (cl.classify("This is an amazing library!"))

  ```


  *输出 : pos*


  ```

  from textblob.classifiers import NaïveBayesClassifier

  train = [(''Air India did a poor job of queue management both times.'', ''staff
  service''),  ("The ''cleaning'' by flight attendants involved regularly spraying
  air freshener in the lavatories.", ''staff''),(''The food tasted decent.'', ''food''),(''Flew
  Air India direct from New York to Delhi round trip.'', ''route''),(''Colombo to
  Moscow via Delhi.'', ''route''),(''Flew Birmingham to Delhi with Air India.'', ''route''),(''Without
  toilet, food or anything!'', ''food''),(''Cabin crew announcements included a sincere
  apology for the delay.'', ''cabin flown'')]

  cl = NaïveBayesClassifier(train)

  tests = [''Food is good.'']

  for c in tests:

  print(cl.classify(c))

