  \ 和 `dialectic_learning_label.csv` 文件中找到这些数据。\n\n\n\n## 卷积神经网络\n\n现在我们将讨论另一种神经网络：卷积神经网络。\n\
  \n在经典的前馈神经网络（如本书前面研究过的那些）中，输入层的每个神经元都与下一层的每个输出神经元相连，形成全连接层。然而，在卷积神经网络中，全连接层仅在网络的最后一层（或最后几层）才被使用。\n\
  \n![](img/458833_2_En_5_Fig2_HTML.png)\n\n该图展示了输入帧如何被卷积，以及特征如何被提取、池化，并通过全连接层进行分类，最终预测输出。\n\
  \n**图 5-2** 卷积神经网络架构\n\n相反，我们使用应用于输入层的卷积滤波器来计算输出。当你使用这些卷积时，你会得到局部连接，这意味着输入的每个部分都与输出的一个部分相连（我们将在本章后面解释这一点）。在卷积神经网络中，每一层都应用一组独立的滤波器，通常有数百或数千个，然后将结果合并。\n\
  \n在训练过程中，卷积神经网络会自动学习这些滤波器的值。在图像分类任务中，我们的卷积神经网络可以学习执行以下操作：\n\n-   在第一层，使用原始像素数据检测边缘。\n\
  -   在第二层，利用这些边缘来识别形状（例如，斑点）。\n-   在网络的高层，利用这些形状来检测更高级别的特征，比如面部结构。\n-   最后一层是分类器，它根据这些高级别特征对图像内容进行预测。\n\
  \n如果你有一系列图像，例如视频，那么循环神经网络或卷积神经网络都是合适的选择。在以下代码中，我们对一系列图像进行分类：\n\n```python\nimport\
  \ numpy as np\nfrom keras.models import Sequential\nfrom keras.layers import Conv2D,\
  \ MaxPooling2D, Dense, Flatten\nfrom keras.utils import to_categorical\nimport tensorflow\
  \ as tf\nmnist = tf.keras.datasets.mnist\n#### loads data and splits into train\
  \ and test set\n(x_train, y_train), (x_test, y_test) = mnist.load_data()\nx_train,\
  \ x_test = x_train / 255.0, x_test / 255.0\n#### # Reshape the images.\ntrain_images\
  \ = np.expand_dims(x_train, axis=3)\ntest_images = np.expand_dims(x_test, axis=3)\n\
  num_filters = 4\nfilter_size = 2\npool_size = 2\n#### Build the model.\nmodel =\
  \ Sequential([\nConv2D(num_filters, filter_size, input_shape=(28, 28, 1)),\nMaxPooling2D(pool_size=pool_size),\n\
  Flatten(),\nDense(10, activation='softmax'),\n])\n#### Compile the model.\nmodel.compile(\n\
  'adam',\nloss='categorical_crossentropy',\nmetrics=['accuracy'],\n)\n#### Train\
  \ the model.\nmodel.fit(\ntrain_images,\nto_categorical(y_train),\nepochs=3,\nvalidation_data=(test_images,\
  \ to_categorical(y_test)),\n)\n#### Predict on the first 10 test images.\npredictions\
  \ = model.predict(test_images[:10])\nprint(np.argmax(predictions, axis=1))\n####\
  \ Check our predictions against the ground truths.\nprint(x_test[:10])\n```\n\n\
  ## 本章小结\n\n本章是本书的核心。我们讨论了诸如循环神经网络和卷积神经网络等神经网络，并结合强化学习使用了真实示例。在下一章中，我们将讨论一些用于分析时间序列数据的经典统计方法，而最后一章则全部关于如何扩展你的分析应用。\n\
  \n"
- "# 6. 时间序列\n\n*时间序列*是按时间顺序排列的一系列数据点。最常见的情况是，这些时间点是等间隔的。例如，过去两年中每月记录的航空公司乘客量，或过去一年中每天记录的股票市场工具价格。时间序列分析的主要目的是根据参数的过去数据来预测其未来值。\n\
  \n## 变异的分类\n\n传统上，时间序列分析将变异分为三个主要组成部分，即趋势、季节性变化和其他周期性变化。剩余的变异则归因于“不规则”波动或误差项。当变异主要由趋势和季节性构成时，这种方法尤其有价值。\n\
  \n## 分析包含趋势的序列\n\n*趋势*是均值水平的长期性变化。例如，如果你有一个像 2, 4, 6, 8 这样的序列，有人问你下一个值是什么，显而易见的答案是\
  \ 10。你可以通过使用简单最小二乘估计或任何其他回归方法对数据拟合一条直线来证明你的答案。趋势也可以是非线性的。图 6-1 展示了一个带有趋势的时间序列示例。\n\
  \n![](img/458833_2_En_6_Fig1_HTML.jpg)\n\n该图绘制了以千为单位的国际航空公司乘客数据。它显示了一个从 1949 年 1\
  \ 月的大约 100 增长到 1960 年 1 月的大约 600 的上升趋势。\n\n**图 6-1** 带有趋势的时间序列\n\n最简单的时间序列类型是常见的“线性趋势加噪声”，其中在时间\
  \ *t* 的观测值是一个随机变量 `X[t]`，如下所示：\n\n![$$ {\\textrm{X}}_{\\textrm{t}}=\\alpha +\\beta\
  \ t+{\\varepsilon}_t $$](img/458833_2_En_6_Chapter_TeX_Equa.png)\n\n这里，`α`、`β` 是常数，`ε[t]`\
  \ 表示均值为 0 的随机误差项。在时间 *t* 的平均水平由 `m[t] = (α + βt)` 给出。这有时被称为*趋势项*。\n\n### 曲线拟合\n\n\
  *拟合*一个简单的时间函数，例如多项式曲线（线性、二次等）、冈珀茨曲线或逻辑曲线，是处理包含趋势的非季节性数据（特别是年度数据）的一种众所周知的方法。全局线性趋势是最简单的多项式曲线类型。冈珀茨曲线可以写成以下格式，其中\
  \ `α`、`β` 和 `γ` 是参数，且 `0 < r < 1`：\n\n![$$ {\\textrm{X}}_{\\textrm{t}}=\\alpha \\\
  exp \\left[\\beta \\exp \\left(-\\gamma \\textrm{t}\\right)\\right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equb.png)\n\
  \n这看起来相当不同，但只要 `t > 0`，实际上是等价的。逻辑曲线如下所示：\n\n![$$ {\\textrm{X}}_{\\textrm{t}}=\\\
  textrm{a}/\\left(1+{\\textrm{be}}^{\\hbox{-} ct}\\right) $$](img/458833_2_En_6_Chapter_TeX_Equc.png)\n\
  \n这两条曲线都是 S 形的，并且当 `t → ∞` 时趋近于一个渐近值，其中冈珀茨曲线通常比逻辑曲线收敛得慢。将曲线拟合到数据可能会导致非线性联立方程。\n\n\
  对于所有此类性质的曲线，拟合函数提供了趋势的度量，而残差则提供了局部波动的估计，其中残差是观测值与拟合曲线对应值之间的差值。\n\n\n\n### 从时间序列中移除趋势\n\
  \n对给定的时间序列进行差分，直至其变得平稳，是一种特殊的滤波方法，对于移除趋势特别有用。你会看到，这是 Box-Jenkins 方法中不可或缺的一部分。对于具有线性趋势的数据，一阶差分通常足以移除趋势。\n\
  \n数学上，其形式如下：\n\n![$$ {\\displaystyle \\begin{array}{c}\\textrm{y}\\left(\\textrm{t}\\\
  right)={\\textrm{a}}^{\\ast}\\textrm{t}+\\textrm{c}\\\\ {}\\textrm{y}\\left(\\textrm{t}+1\\\
  right)={\\textrm{a}}^{\\ast}\\left(\\textrm{t}+1\\right)+\\textrm{c}\\\\ {}\\textrm{z}\\\
  left(\\textrm{t}\\right)=\\textrm{y}\\left(\\textrm{t}+1\\right)-\\textrm{y}\\left(\\\
  textrm{t}\\right)=\\textrm{a}+\\textrm{c};\\textrm{no}\\ \\textrm{t}\\textrm{rend}\\\
  \ \\textrm{present}\\ \\textrm{in}\\ \\textrm{z}\\left(\\textrm{t}\\right)\\end{array}}\
  \ $$](img/458833_2_En_6_Chapter_TeX_Equd.png)\n\n趋势也可能是指数型的。在这种情况下，你需要进行对数变换，将指数趋势转换为线性趋势。\n\
  \n数学上，其形式如下：\n\n![$$ {\\displaystyle \\begin{array}{c}\\textrm{y}\\left(\\textrm{t}\\\
  right)={\\textrm{a}}^{\\ast}\\exp \\left(\\textrm{t}\\right)\\\\ {}z\\left(\\textrm{t}\\\
  right)=\\log \\left(\\textrm{y}\\left(\\textrm{t}\\right)\\right)={\\textrm{t}}^{\\\
  ast}\\log \\left(\\textrm{a}\\right);\\textrm{z}\\left(\\textrm{t}\\right)\\textrm{is}\\\
  \ \\textrm{a}\\ \\textrm{linear}\\ \\textrm{function}\\ \\textrm{of}\\ \\textrm{t}\\\
  end{array}} $$](img/458833_2_En_6_Chapter_TeX_Eque.png)\n\n## 分析包含季节性的序列\n\n许多时间序列，例如航空公司的乘客负载量或天气读数，会显示出在特定时间段后重复的变动。例如，在印度，排灯节假期期间航空公司的乘客负载量总是会增加。这种年度变化很容易理解，如果对季节性有直接兴趣，也可以进行估计。同样，类似于趋势，如果你有一个像\
  \ 1, 2, 1, 2, 1, 2 这样的序列，那么你对序列下一个值的明显选择将是 1 和 2。\n\nHolt-Winters 模型是实现具有季节性的时间序列的流行模型，也被称为*指数平滑法*。Holt-Winters\
  \ 模型有两种变体：加法模型和乘法模型。在具有单一指数平滑时间序列的加法模型中，季节性的实现方式如下：\n\n![$$ \\textrm{X}\\left(\\\
  textrm{t}+1\\right)={\\upalpha}^{\\ast } Xt+\\left(1-\\upalpha \\right)\\ast \\\
  textrm{St}-1 $$](img/458833_2_En_6_Chapter_TeX_Equf.png)\n\n在这个模型中，每个点都被实现为前一个点和季节性的加权平均值。因此，`X(t+1)`\
  \ 将作为 `X(t-1)` 和 `S(t-2)` 以及 `α` 的平方的函数来计算。这样，随着过程的进行，`α` 的值会呈指数增长。这就是它被称为指数平滑法的原因。`St`\
  \ 的起始值在此方法中至关重要。通常，这个值从 1 开始，或者取前四个观测值的平均值。\n\n乘法季节性模型的时间序列如下：\n\n![$$ \\textrm{X}\\\
  left(\\textrm{t}+1\\right)=\\left(\\textrm{b}1+\\textrm{b}{2}^{\\ast}\\textrm{t}\\\
  right)\\textrm{St}+\\textrm{noise}, $$](img/458833_2_En_6_Chapter_TeX_Equg.png)\n\
  \n这里，`b1`（通常被称为*永久成分*）是季节性的初始权重；`b2` 代表趋势，在此情况下是线性的。\n\n然而，Python 中没有 Holt-Winters\
  \ 模型的标准实现。它在 R 中可用（关于如何从 Python 代码中调用 R 的 Holt-Winters 模型，请参见第 1 章）。\n\n## 从时间序列中移除季节性\n\
  \n从时间序列中移除季节性有两种方法。\n\n*   通过滤波\n*   通过差分\n\n### 通过滤波\n\n序列 `{x[t]}` 通过如下所示的线性运算转换为另一个称为\
  \ `{y[t]}` 的序列，其中 `{a[r]}` 是一组权重：\n\n![$$ {\\textrm{Y}}_{\\textrm{t}}={\\sum^{+\\\
  textrm{s}}}_{\\textrm{r}=\\hbox{-} \\textrm{q}}{\\textrm{a}}_{\\textrm{r}}{\\textrm{X}}_{\\\
  textrm{t}+\\textrm{r}} $$](img/458833_2_En_6_Chapter_TeX_Equh.png)\n\n为了平滑局部波动并估计局部均值，你应明确选择权重，使得\
  \ `∑a[r] = 1`；那么该运算通常被称为*移动平均*。它们通常是对称的，即 `s = q` 且 `a[j] = a[-j]`。对称平滑滤波器最简单的例子是简单移动平均，其中对于\
  \ `r = -q, …, + q`，有 `a[r] = 1 / (2q+1)`。\n\n`x[t]` 的平滑值由下式给出：\n\n![$$ Sm\\left({\\\
  textrm{x}}_{\\textrm{t}}\\right)=\\frac{1}{2q+1}{\\sum^{+\\textrm{q}}}_{\\textrm{r}=\\\
  hbox{-} \\textrm{q}}{\\textrm{X}}_{\\textrm{t}+\\textrm{r}} $$](img/458833_2_En_6_Chapter_TeX_Equi.png)\n\
  \n简单移动平均对于移除季节性变化很有用，但无法很好地处理趋势。\n\n### 通过差分\n\n差分被广泛使用，并且通常效果良好。季节性差分可以移除季节性变化。\n\
  \n数学上，如果时间序列 `y(t)` 包含周期为 `T` 的加法季节性 `S(t)`，那么：\n\n![$$ {\\displaystyle \\begin{array}{c}\\\
  textrm{y}\\left(\\textrm{t}\\right)={\\textrm{a}}^{\\ast}\\textrm{S}\\left(\\textrm{t}\\\
  right)={\\textrm{b}}^{\\ast}\\textrm{t}+\\textrm{c}\\\\ {}\\textrm{y}\\left(\\textrm{t}+\\\
  textrm{T}\\right)= aS\\left(\\textrm{t}+\\textrm{T}\\right)+{\\textrm{b}}^{\\ast}\\\
  left(\\textrm{t}+\\textrm{T}\\right)+\\textrm{c}\\\\ {}\\textrm{z}\\left(\\textrm{t}\\\
  right)=\\textrm{y}\\left(\\textrm{t}+\\textrm{T}\\right)-\\textrm{y}\\left(\\textrm{t}\\\
  right)={\\textrm{b}}^{\\ast}\\textrm{T}+\\textrm{noise}\\ \\textrm{term}\\end{array}}\
  \ $$](img/458833_2_En_6_Chapter_TeX_Equj.png)\n\n与趋势类似，你可以通过对数变换将乘法季节性转换为加法季节性。\n\
  \n现在，在时间序列中找到周期 `T` 是关键部分。可以通过两种方式实现：在时域中使用自相关函数，或者在频域中使用傅里叶变换。在这两种情况下，你都会在图中看到一个尖峰。对于自相关，图上的尖峰将出现在滞后\
  \ `T` 处，而对于傅里叶变换分布，尖峰将出现在频率 `1/T` 处。\n\n## 变换\n\n到目前为止，我已经讨论了时间序列中各种类型的变换。进行变换的三个主要原因将在接下来的章节中介绍。\n\
  \n### 稳定方差\n\n标准的做法是对序列进行对数变换；它可以使空间中分散较远的点彼此靠近。\n\n### 使季节性效应变为加法\n\n如果序列存在趋势，并且季节性效应的幅度似乎随均值上升，那么修改数据以使季节性效应逐年保持恒定可能是可取的。这种季节性效应被称为加法效应。然而，如果季节性效应的幅度与均值成正比，那么该季节性效应被称为乘法效应，并且需要进行对数变换才能使其再次变为加法效应。\n\
  \n\n\n### 使数据分布正态化\n\n在大多数概率模型中，都假设数据分布是高斯分布或正态分布。例如，趋势中可能存在偏态证据，导致时间图中出现方向一致的“尖峰”。\n\
  \n要将数据转换为正态分布，最常见的变换是减去均值，然后除以标准差。我在第 5 章的 RNN 示例中给出了这种变换的例子；在本章的最后一个示例中，我将再给出一个。这种变换背后的逻辑是，它使均值为\
  \ 0，标准差为 1，这是正态分布的一个特征。另一种流行的变换是使用对数。对数的主要优点是它能减少变异，并且高斯分布数据的对数仍然是高斯分布。变换可能是特定于问题或特定于领域的。例如，在航空公司的乘客载客量时间序列中，可以通过除以该月的天数或该月的假期数来对序列进行归一化。\n\
  \n#### 循环变动\n\n在某些时间序列中，季节性并非恒定，而是一个随机变量。这被称为*循环变动*。在这种情况下，首先需要预测周期性，然后以与处理季节性变动相同的方式将其移除。\n\
  \n#### 不规则波动\n\n没有趋势和循环变动的时间序列可以被视为弱平稳时间序列。在下一节中，你将研究各种概率模型来实现弱平稳时间序列。\n\n## 平稳时间序列\n\
  \n通常，如果时间序列的均值和方差没有系统性变化，并且严格的周期性变化已被消除，则称该时间序列是平稳的。在现实生活中，不存在平稳的时间序列。无论你通过变换获得什么数据，你都可以尝试使其在某种程度上更接近平稳序列。\n\
  \n### 平稳过程\n\n如果对于所有 `t[1],…,t[k],τ`，`X(t[1]),...,X(t[k])` 的联合分布与 `X(t[1] + τ),...,X(t[k]\
  \ + τ)` 的联合分布相同，则该时间序列是严格平稳的。如果 `k=1`，严格平稳意味着 `X(t)` 的分布对于所有 `t` 都是相同的，因此，假设前两阶矩是有限的，则有：\n\
  \n![$$ \\mu \\left(\\textrm{t}\\right)=\\mu $$](img/458833_2_En_6_Chapter_TeX_Equk.png)\n\
  \n![$$ {\\sigma}²\\left(\\textrm{t}\\right)={\\sigma}² $$](img/458833_2_En_6_Chapter_TeX_Equl.png)\n\
  \n两者都是常数，不依赖于 `t` 的值。\n\n弱平稳时间序列是一个随机过程，其均值是常数，自协方差是时间滞后的函数。\n\n### 自相关与相关图\n\n\
  称为*样本自相关系数*的量是了解时间序列性质的重要指南。它们评估不同距离的观测值之间是否存在相关性，并提供有价值的描述性信息。你将看到，它们也是模型构建中的重要工具，并且通常为给定数据集选择合适的概率模型提供有价值的线索。该系数的取值范围为\
  \ `[-1,1]`，衡量两个变量之间线性关联的强度。可以很容易地证明，该值不依赖于两个变量的测量单位；如果变量是独立的，那么理想的相关性为零。\n\n在解释一组自相关系数时，一个有用的辅助工具是称为*相关图*的图形。相关图也可以称为*样本自相关函数*。\n\
  \n假设一个平稳随机过程 `X(t)` 具有均值 `μ`、方差 `σ²`、自协方差函数 (acv.f.) `γ(t)` 和自相关函数 (ac.f.) `ρ(τ)`。\n\
  \n![$$ \\rho \\left(\\tau \\right)=\\frac{\\gamma \\left(\\tau \\right)}{\\gamma\
  \ (0)}=\\gamma \\left(\\tau \\right)/{\\sigma}² $$](img/458833_2_En_6_Chapter_TeX_Equm.png)\n\
  \n### 估计自协方差和自相关函数\n\n在随机过程中，自协方差是过程自身在成对时间点上的协方差。自协方差的计算如下：\n\n![$$ \\gamma (h)=\\\
  frac{1}{n}\\sum \\limits_{t=1}^{n-\\left|h\\right|}\\left({x}_{t+\\left|h\\right|}-\\\
  overline{x}\\right)\\left({x}_t-\\overline{x}\\right),-n&lt;h&lt;n $$](img/458833_2_En_6_Chapter_TeX_Equn.png)\n\
  \n图 6-2 显示了一个样本自相关分布。\n\n![](img/458833_2_En_6_Fig2_HTML.jpg)\n\n一对用于自相关和偏自相关的模拟离散时间序列。两个图在点\
  \ 0 处都有最高峰值为 0。\n\n图 6-2\n\n样本自相关\n\n## 使用 Python 进行时间序列分析\n\n`Statsmodels` 是一个\
  \ Python 包，它为包括描述性统计和统计模型估计在内的统计计算提供了对 `SciPy` 的补充。除了早期的模型、线性回归、稳健线性模型、广义线性模型和离散数据模型之外，`scikits.statsmodels`\
  \ 的最新版本还包含了一些用于时间序列分析的基本工具和模型，例如描述性统计、统计检验以及几个线性模型类。这些线性模型类包括自回归 (AR)、自回归移动平均 (ARMA)\
  \ 和向量自回归模型 (VAR)。\n\n### 有用的方法\n\n让我们从移动平均开始。\n\n#### 移动平均过程\n\n假设 `{Z[t]}` 是一个均值为\
  \ 0、方差为 `σ[z]²` 的纯随机过程。那么，过程 `{X[t]}` 被称为 `q` 阶移动平均过程。\n\n![$$ {X}_t={\\beta}_0{Z}_t+{\\\
  beta}_1{Z}_{t-1}+\\dots +{\\beta}_{\\textrm{q}}{Z}_{t-q} $$](img/458833_2_En_6_Chapter_TeX_Equo.png)\n\
  \n这里，`{β[i]}` 是常数。`Zs` 通常被缩放，使得 `β[0] = 1`。\n\n![$$ {\\displaystyle \\begin{array}{l}E\\\
  left({X}_t\\right)=0\\\\ {} Var\\left({X}_t\\right)={\\sigma}_Z²\\sum \\limits_{i=0}^q{\\\
  beta}_i²\\end{array}} $$](img/458833_2_En_6_Chapter_TeX_Equp.png)\n\n`Zs` 是独立的。\n\
  \n![$$ {\\displaystyle \\begin{array}{c}\\gamma (k)= Cov\\ \\left({X}_t,{X}_{t+k}\\\
  right)\\\\ {}= Cov\\left({\\beta}_0{Z}_t+\\dots +{\\beta}_q{Z}_{t-q},{\\beta}_0{Z}_{t+k}+\\\
  dots +{\\beta}_q{Z}_{t+k-q}\\right)\\\\ {}=\\left\\{\\vdash \\begin{array}{cc}0&amp;\
  \ k&gt;q\\\\ {}{\\sigma}_Z²\\sum \\limits_{i=0}^{q-k}{\\beta}_i{\\beta}_{i+k}&amp;\
  \ k=0,1,\\dots, q\\\\ {}\\gamma \\left(-k\\right)&amp; k&lt;0\\end{array}\\right.\\\
  end{array}} $$](img/458833_2_En_6_Chapter_TeX_Equq.png)\n\n![$$ Cov\\ \\left({\\\
  textrm{Z}}_s,{Z}_t\\right)=\\left\\{\\begin{array}{cc}{\\sigma}_Z²&amp; s=t\\\\\
  \ {}0&amp; s\\ne t\\end{array}\\right. $$](img/458833_2_En_6_Chapter_TeX_Equr.png)\n\
  \n由于 `γ(k)` 不依赖于 `t` 且均值是常数，因此对于所有 `{β[i]}` 的值，该过程都是二阶平稳的。\n\n![$$ \\rho (k)=\\\
  left\\{\\begin{array}{cc}1&amp; k=0\\\\ {}\\sum \\limits_{i=0}^{q-k}{\\beta}_i{\\\
  beta}_{i+k}/\\sum \\limits_{i=0}^q{\\beta}_i²&amp; k=1,\\dots, q\\\\ {}0&amp; k&gt;q\\\
  \\ {}\\rho \\left(-k\\right)&amp; k&lt;0\\end{array}\\right. $$](img/458833_2_En_6_Chapter_TeX_Equs.png)\n\
  \n\n\n#### 拟合移动平均过程\n\n移动平均（MA）模型是实现单变量周平稳时间序列的著名方法（见图 6-3）。移动平均模型规定，输出变量线性依赖于其自身过去的误差项以及一个随机项。AR\
  \ 模型被称为*移动平均模型*，它是时间序列 ARMA 和 ARIMA 模型的一个特例和关键组成部分。\n\n![$$ {X}_t={\\varepsilon}_t+\\\
  sum \\limits_{i=1}^p{\\varphi}_i{X}_{t-i}+\\sum \\limits_{i=1}^q{\\theta}_i{\\varepsilon}_{t-i}+\\\
  sum \\limits_{i=1}^b{\\eta}_i{d}_{t-i} $$](img/458833_2_En_6_Chapter_TeX_Equt.png)\n\
  \n![](img/458833_2_En_6_Fig3_HTML.jpg)\n\n价格与周期的关系图。它绘制了实际值和区间值在 6 处的移动平均线的两条上升趋势。实际值的峰值最高，达到\
  \ 9。\n\n图 6-3\n\n移动平均示例\n\n以下是移动平均模型的示例代码：\n\n```\n请通过以下命令安装 numpy：\npip install\
  \ numpy\nimport numpy as np\ndef moving_average(x, w):\nreturn np.convolve(x, np.ones(w),\
  \ 'valid') / w\ndata = np.array([10,5,8,9,15,22,26,11,15,16,18,7])\nprint(moving_average(data,4))\n\
  ```\n\n### 自回归过程\n\n假设 `{Z[t]}` 是一个均值为 0、方差为 `σ[z]²` 的纯随机过程。那么，如果满足以下条件，则称过程 `{X[t]}`\
  \ 为 `p` 阶自回归过程：\n\n![$$ {\\displaystyle \\begin{array}{l}{x}_t={\\alpha}_1{x}_{t-1}+\\\
  dots {\\alpha}_p{x}_{t-p}+{z}_t, or\\\\ {}{x}_t=\\sum \\limits_{i=1}^p{\\alpha}_i{x}_{i-1}+{z}_t\\\
  end{array}} $$](img/458833_2_En_6_Chapter_TeX_Equu.png)\n\n自协方差函数由下式给出：\n\n![$$\
  \ \\gamma (k)=\\frac{\\alpha^k{\\sigma}_z²}{\\left(1-{\\alpha}²\\right)},k=0,1,2\\\
  dots, \\textrm{hence} $$](img/458833_2_En_6_Chapter_TeX_Equv.png)\n\n![$$ {\\rho}_k=\\\
  frac{\\gamma (k)}{\\gamma (0)}={\\alpha}^k $$](img/458833_2_En_6_Chapter_TeX_Equw.png)\n\
  \n图 6-4 显示了一个时间序列及其 AR 模型的自相关图。\n\n![](img/458833_2_En_6_Fig4_HTML.jpg)\n\n时间序列和\
  \ AR 模型的模拟图。它绘制了具有多个波峰和波谷的波动趋势。\n\n图 6-4\n\n时间序列与 AR 模型\n\n### 估计 AR 过程的参数\n\n如果一个过程的均值恒定，且自协方差函数仅依赖于时间滞后，则该过程称为*弱平稳*。虽然不存在绝对的弱平稳过程，但为了进行随机分析，通常会对时间序列数据施加此假设。假设\
  \ `Z(t)` 是一个均值为 0、方差恒定的弱平稳过程。那么，如果满足以下条件，则 `X(t)` 是一个 `p` 阶自回归过程：\n\n![$$ {\\displaystyle\
  \ \\begin{array}{l}\\textrm{X}\\left(\\textrm{t}\\right)=\\textrm{a}1\\ \\textrm{x}\\\
  \ \\textrm{X}\\left(\\textrm{t}\\hbox{-} 1\\right)+\\textrm{a}2\\ \\textrm{x}\\\
  \ \\textrm{X}\\left(\\textrm{t}\\hbox{-} 2\\right)+\\dots + ap\\ \\textrm{x}\\ \\\
  textrm{X}\\left(\\textrm{t}\\hbox{-} \\textrm{p}\\right)+\\textrm{Z}\\left(\\textrm{t}\\\
  right),\\textrm{where}\\ \\textrm{a}\\in \\textrm{R}\\ \\textrm{a}\\textrm{nd}\\\
  \ \\textrm{p}\\in \\textrm{I}\\\\ {}\\ \\textrm{I}\\end{array}} $$](img/458833_2_En_6_Chapter_TeX_Equx.png)\n\
  \n现在，`E[X(t)]` 是 `X(t)` 的期望值。\n\n![$$ {\\displaystyle \\begin{array}{c}\\textrm{Covariance}\\\
  left(\\textrm{X}\\left(\\textrm{t}\\right),\\textrm{X}\\left(\\textrm{t}+\\textrm{h}\\\
  right)\\right)=\\textrm{E}\\left[{\\left(\\textrm{X}\\left(\\textrm{t}\\right)\\\
  hbox{-} \\textrm{E}\\left[\\textrm{X}\\left(\\textrm{t}\\right)\\right]\\right)}^{\\\
  ast }\\ \\left(\\textrm{X}\\left(\\textrm{t}+\\textrm{h}\\right)\\hbox{-} \\textrm{E}\\\
  left[\\textrm{X}\\left(\\textrm{t}+\\textrm{h}\\right)\\right]\\right)\\right]\\\
  \\ {}=\\textrm{E}\\left[{\\left(\\textrm{X}\\left(\\textrm{t}\\right)\\hbox{-} \\\
  textrm{m}\\right)}^{\\ast }\\ \\left(\\textrm{X}\\left(\\textrm{t}+\\textrm{h}\\\
  right)\\hbox{-} \\textrm{m}\\right)\\right]\\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equy.png)\n\
  \n如果 `X(t)` 是一个弱平稳过程，那么：\n\n![$$ {\\displaystyle \\begin{array}{c}\\textrm{E}\\\
  left[\\textrm{X}\\left(\\textrm{t}\\right)\\right]=\\textrm{E}\\left[\\textrm{X}\\\
  left(\\textrm{t}+\\textrm{h}\\right)\\right]=\\textrm{m}\\ \\left(\\textrm{constant}\\\
  right)\\\\ {}=\\textrm{E}\\left[\\textrm{X}{\\left(\\textrm{t}\\right)}^{\\ast }\\\
  \ \\textrm{X}\\left(\\textrm{t}+\\textrm{h}\\right)\\right]-{\\textrm{m}}²=\\textrm{c}\\\
  left(\\textrm{h}\\right)\\end{array}} $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equz.png)\n\
  \n这里，`m` 是常数，对于弱平稳过程，`cov[X(t),X(t+h)]` 仅是 `h(c(h))` 的函数。`c(h)` 被称为自协方差。\n\n类似地，相关性\
  \ `(X(t),X(t+h) = ρ(h) = r(h) = c(h) = c(0)` 被称为*自相关*。\n\n如果 `X(t)` 是一个实现为自回归模型的平稳过程，那么：\n\
  \n![$$ \\textrm{X}\\left(\\textrm{t}\\right)=\\textrm{a}{1}^{\\ast }\\ \\textrm{X}\\\
  left(\\textrm{t}\\hbox{-} 1\\right)+\\textrm{a}{2}^{\\ast }\\ \\textrm{X}\\left(\\\
  textrm{t}\\hbox{-} 2\\right)+\\dots +{ap}^{\\ast }\\ \\textrm{X}\\left(\\textrm{t}\\\
  hbox{-} \\textrm{p}\\right)+\\textrm{Z}\\left(\\textrm{t}\\right) $$](img/458833_2_En_6_Chapter_TeX_Equaa.png)\n\
  \n`相关性(X(t),X(t)) = a1 * 相关性 (X(t),X(t-1)) + …. + ap * 相关性 (X(t),X(t-p))+0`\n\n\
  由于协方差 `(X(t),X(t+h))` 仅依赖于 `h`，因此：\n\n![$$ \\textrm{r}0=\\textrm{a}{1}^{\\ast }\\\
  \ \\textrm{r}1+\\textrm{a}{2}^{\\ast }\\ \\textrm{r}2+\\dots +{ap}^{\\ast }\\ rp\
  \ $$](img/458833_2_En_6_Chapter_TeX_Equab.png)\n\n![$$ \\textrm{r}1=\\textrm{a}{1}^{\\\
  ast }\\ \\textrm{r}0+\\textrm{a}{2}^{\\ast }\\ \\textrm{r}1+\\dots .+{ap}^{\\ast\
  \ }\\ \\textrm{r}\\left(\\textrm{p}\\hbox{-} 1\\right) $$](img/458833_2_En_6_Chapter_TeX_Equac.png)\n\
  \n因此，对于一个 `n` 阶模型，你可以轻松生成 `n` 个方程，并通过求解这 `n` 个方程组来找到 `n` 个系数。\n\n在这种情况下，仅在一阶和二阶自回归模型中实现数据集，并选择残差均值较小的模型。为此，简化公式如下：\n\
  \n*   *一阶*：`a1 = r1`\n*   *二阶*：`a1 = r1(1 - r2) / (1 - r1²)`, `a2 = (r2 - r1²) /\
  \ (1 - r1²)`\n\n以下是自回归模型的一些示例代码：\n\n```\n请从 https://github.com/pratips/book-Advanced-Data-Analytics-Using-Python\
  \ 下载所需的 CSC 文件，并使用 pip 命令安装 Python 库。\nfrom pandas import read_csv\nfrom matplotlib\
  \ import pyplot\nfrom statsmodels.tsa.ar_model import AutoReg\nfrom sklearn.metrics\
  \ import mean_squared_error\nfrom math import sqrt\n#### 加载数据集\nseries = read_csv('temperatures.csv',\
  \ header=0, index_col=0, parse_dates=True, squeeze=True)\n#### 拆分数据集\nX = series.values\n\
  train, test = X[1:len(X)-7], X[len(X)-7:]\n#### 训练自回归模型\nmodel = AutoReg(train,\
  \ lags=29)\nmodel_fit = model.fit()\nprint('系数: %s' % model_fit.params)\n#### 进行预测\n\
  predictions = model_fit.predict(start=len(train), end=len(train)+len(test)-1, dynamic=False)\n\
  for i in range(len(predictions)):\nprint('预测值=%f, 期望值=%f' % (predictions[i], test[i]))\n\
  rmse = sqrt(mean_squared_error(test, predictions))\nprint('测试 RMSE: %.3f' % rmse)\n\
  #### 绘制结果\npyplot.plot(test)\npyplot.plot(predictions, color='red')\npyplot.show()\n\
  ```\n\n\n\n## 混合 ARMA 模型\n\n混合 ARMA 模型是 MA 和 AR 过程的组合。一个包含`p`个 AR 项和`q`个 MA 项的混合自回归/移动平均过程，被称为阶数为`(p,q)`的\
  \ ARMA 过程。其定义如下：\n\n![$$ {X}_t={\\alpha}_1{X}_{t-1}+\\dots +{\\alpha}_p{X}_{t-p}+{Z}_t+{\\\
  beta}_1{Z}_{t-1}+\\dots {\\beta}_q{Z}_{t-q} $$](img/458833_2_En_6_Chapter_TeX_Equad.png)\n\
  \n以下示例代码取自 stat model 网站，用于将时间序列数据实现为 ARMA 模型。\n\n请在运行代码前，使用`pip`命令安装`matplotlib`、`statsmodels`和`numpy`。\n\
  \n```\nimport matplotlib.pyplot as plt\nimport numpy as np\nfrom statsmodels.tsa.arima_process\
  \ import ArmaProcess\nimport statsmodels.api as sm\nnp.random.seed(1234)\ndata =\
  \ np.array([1, .85, -.43, -.63, .8])\nparameter = np.array([1, .41])\nmodel = ArmaProcess(data,\
  \ parameter)\nfig = plt.figure(figsize=(12, 8))\nax = fig.add_subplot(111)\nax.plot(model.generate_sample(nsample=50))\n\
  plt.show()\n```\n\n以下是估计 ARMA 模型参数的方法：\n\n1. 在指定平稳 ARMA 过程的阶数后，你需要估计参数。\n2. 假设如下：\n\
  \   - 模型阶数（`p`和`q`）已知。\n   - 数据具有零均值。\n3. 如果步骤 2 的假设不合理，你可以减去样本均值`Y`，并拟合一个零均值的 ARMA\
  \ 模型，如`Ø(B)X[t] = θ(B)a[t]`所示，其中`X[t] = Y[t] – Y`。然后使用`X[t] + Y`作为`Y[t]`的模型。\n\n\
  ## 集成 ARMA 模型\n\n为了拟合像前面讨论的平稳模型，必须消除非平稳的变异来源。差分法广泛应用于计量经济学数据。如果将`X[t]`替换为`∇^dX[t]`，那么你就拥有了一个能够描述某些类型非平稳序列的模型。\n\
  \n![$$ {Y}_t={\\left(1-L\\right)}^d{X}_t $$](img/458833_2_En_6_Chapter_TeX_Equae.png)\n\
  \n以下是 ARIMA 模型的估计参数：\n\n- ARIMA 模型通过自回归、差分和移动平均的阶数来指定。\n- 该方法不假设任何模式，而是采用迭代方法来识别模型。\n\
  - 如果残差通常较小、随机分布，并且总体上不包含有用信息，则模型“拟合良好”。\n\n以下是 ARIMA 模型的示例代码。\n\n请从`https://github.com/pratips/book-Advanced-Data-Analytics-Using-Python`下载所需的\
  \ CSV 文件，并使用`pip`命令安装 Python 库。\n\n```\n#### 导入库\nfrom pandas import read_csv\n\
  from matplotlib import pyplot\nfrom statsmodels.tsa.arima.model import ARIMA\nfrom\
  \ sklearn.metrics import mean_squared_error\n#### 读取 CSV 文件\nseries = read_csv('temperatures.csv',\
  \ header=0, index_col=0, parse_dates=True, squeeze=True)\nP = series.values\nsize\
  \ = int(len(P) * 0.9)\n#### 分割为训练集和测试集\ntrain, test = P[0:size], P[size:len(P)]\n\
  history = [p for p in train]\npredictions = list()\nfor t in range(len(test)):\n\
  #### 拟合模型\nmodel = ARIMA(history, order=(5,1,0))\nmodel_fit = model.fit()\noutput\
  \ = model_fit.forecast()\nyhat = output[0]\npredictions.append(yhat)\nobs = test[t]\n\
  history.append(obs)\nprint('预测值=%f, 期望值=%f' % (yhat, obs))\nerror = mean_squared_error(test,\
  \ predictions)\nprint('测试集 MSE: %.3f' % error)\n#### 绘制结果\npyplot.plot(test)\npyplot.plot(predictions,\
  \ color='red')\npyplot.show()\n```\n\n## 傅里叶变换\n\n非周期信号可以通过一个简单的极限过程用永续指数信号来表示，我将说明非周期信号可以表示为永续指数信号的连续和（积分）。假设你想表示非周期信号`g(t)`。将任何非周期信号视为具有无限时间周期的周期信号，你会得到以下结果：\n\
  \n![$$ g(t)=\\frac{1}{2\\pi}\\int_{-\\infty}^{\\infty }G\\left(\\omega \\right){e}^{j\\\
  omega t} d\\omega $$](img/458833_2_En_6_Chapter_TeX_Equaf.png)\n\n![$$ G\\left(n\\\
  Delta \\omega \\right)=\\underset{T\\to \\infty }{\\lim}\\int_{-{T}_0/2}^{T_0/2}{g}_p(t){e}^{-\
  \ jn\\Delta \\omega t} dt $$](img/458833_2_En_6_Chapter_TeX_Equag.png)\n\n因此：\n\n\
  ![$$ G\\left(\\omega \\right)=\\int_{-\\infty}^{\\infty }g(t){e}^{- j\\omega t}\
  \ dt $$](img/458833_2_En_6_Chapter_TeX_Equah.png)\n\n`G(w)`被称为`g(t)`的傅里叶变换。\n\n\
  以下是自协方差与傅里叶变换之间的关系：\n\n![$$ \\gamma (0)={\\sigma}_X²=\\int_0^{\\pi } dF\\left(\\\
  omega \\right)=F\\left(\\pi \\right) $$](img/458833_2_En_6_Chapter_TeX_Equai.png)\n\
  \n## 一个特殊场景\n\n在航空或酒店领域，第`t`个月的乘客量与`t-1`或`t-2`个月的数据相关性较低，但与`t-12`个月的数据相关性更高。例如，排灯节（十月）的乘客量与去年排灯节的数据相关性高于同年八月和九月的数据。历史上，拾取模型用于预测这类数据。拾取模型有两种变体。\n\
  \n在加法拾取模型中，\n\n![$$ \\textrm{X}\\left(\\textrm{t}\\right)=\\textrm{X}\\left(\\textrm{t}\\\
  hbox{-} 1\\right)+\\left[\\textrm{X}\\left(\\textrm{t}\\hbox{-} 12\\right)\\hbox{-}\
  \ \\textrm{X}\\left(\\textrm{t}\\hbox{-} 13\\right)\\right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equaj.png)\n\
  \n在乘法拾取模型中，\n\n![$$ \\textrm{X}\\left(\\textrm{t}\\right)=\\textrm{X}{\\left(\\\
  textrm{t}\\hbox{-} 1\\right)}^{\\ast }\\ \\left[\\textrm{X}\\left(\\textrm{t}\\\
  hbox{-} 12\\right)/\\textrm{X}\\left(\\textrm{t}\\hbox{-} 13\\right)\\right] $$](images/458833_2_En_6_Chapter/458833_2_En_6_Chapter_TeX_Equak.png)\n\
  \n研究表明，对于这类数据，基于神经网络的预测器比时间序列模型具有更高的准确性。\n\n在投资银行的高频交易中，时间序列模型过于耗时，无法捕捉工具的最新模式。因此，他们实时计算`dX/dt`和`d2X/dt2`，其中`X`是工具的价格。如果两者均为正，他们盲目地发出买入该工具的订单。如果两者均为负，并且投资组合中持有该工具，他们则盲目卖出。但如果符号相反，他们会利用时间序列数据进行更详细的分析。\n\
  \n正如我之前所说，在时间序列分析中有许多场景下，R 比 Python 是更好的选择。因此，这里有一个使用 R 进行时间序列预测的示例。`auto.arima`模型的优点在于它能自动找到数据的阶数、趋势和季节性，并拟合模型。在预测中，我们只打印均值，但该模型在预测时提供了预测的上限和下限。\n\
  \n请使用以下命令安装`pmdarima`库：\n\n```\npip install pmdarima\n```\n\n安装完成后，你可以尝试运行基于`pmdarima`手册的以下代码。它会加载包中可用的数据集，然后尝试拟合自动\
  \ ARIMA 并进行预测。\n\n```\nimport numpy as np\nimport pmdarima as pm\nfrom pmdarima.datasets\
  \ import load_wineind\n#### 加载数据集\nwineind = load_wineind().astype(np.float64)\n\
  #### 拟合逐步模型：\nstepwise_fit = pm.auto_arima(wineind, start_p=1, start_q=1, max_p=3,\
  \ max_q=3, m=12, start_P=0, seasonal=True, d=1, D=1, trace=True, error_action='ignore',\
  \ suppress_warnings=True, stepwise=True)\nstepwise_fit.summary()\npredicted_15 =\
  \ stepwise_fit.predict(n_periods=15)\nprint(predicted_15)\n```\n\n## 缺失数据\n\n时间序列和许多其他数据分析工作中的一个重要方面是弄清楚如何处理缺失数据。在前面的代码中，你用平均值填充了缺失的记录。当缺失数据实例的数量不是很高时，这没问题。但如果数量很高，那么最高值和最低值的平均值是一个更好的替代方案。\n\
  \n\n\n## 总结\n\n在特征工程之后，我们将介绍一些基础统计学知识，特别是时间序列模型。需要记住的一点是，如果你将特征向量（`1xn`）转换为矩阵（`kxn`），其中每行的每个`k`元素是第一列最新的`k`个观测值，那么你就可以在时间序列数据上应用任何监督式机器学习模型。\n\
  \n"
- "# 7. 大规模分析\n\n近几十年来，由于大数据的发展，分析技术领域发生了革命性的变化。数据正从各种来源被收集，因此，即使在分布式环境中，甚至实时地分析这些数据的技术也得到了发展。\n\
  \n## Hadoop\n\n这场革命始于 Hadoop 框架的开发，该框架有两个主要组件，即 MapReduce 编程和 HDFS 文件系统。\n\n###\
  \ MapReduce 编程\n\nMapReduce 是一种受函数式编程启发的编程风格，用于处理大量数据。程序员可以使用 MapReduce 代码处理大数据，而无需了解分布式环境的内部细节。在\
  \ MapReduce 之前，像 Condor 这样的框架在分布式数据上进行并行计算。但 MapReduce 的主要优势在于它基于 RPC（远程过程调用）。数据不会移动；相反，代码会跳转到不同的机器上来处理数据。在处理大数据时，这极大地节省了网络带宽和计算时间。\n\
  \n一个 MapReduce 程序有两个主要组件：映射器（mapper）和归约器（reducer）。在映射器中，输入被分割成小单元。通常，输入文件的每一行都成为每个映射任务的输入。映射器处理输入并向归约器发出一个键值对。归约器接收特定键的所有值作为输入，并处理数据以生成最终输出。\n\
  \n以下伪代码是统计文档中单词频率的一个示例：\n\n```\nmap(String key, String value):\n// key: 文档名称\n//\
  \ value: 文档内容\nfor each word w in value:\nEmitIntermediate(w, \"1\");\nreduce(String\
  \ key, Iterator values):\n// key: 一个单词\n// values: 计数列表\nint result = 0;\nfor each\
  \ v in values:\nresult += ParseInt(v);\nEmit(AsString(result));\n```\n\n### 分区函数\n\
  \n有时需要将特定的数据集发送到特定的归约任务。分区函数就是为了解决这个目的。例如，在前面的 MapReduce 示例中，假设用户希望输出按排序顺序存储。那么他指定归约任务的数量为\
  \ 32（对应 32 个字母），并在分区函数中，对于以`a`开头的键返回 1，以`b`开头的键返回 2，依此类推。那么所有以相同字母开头的单词都会进入同一个归约任务。输出将存储在同一个输出文件中，并且由于\
  \ MapReduce 保证中间键值对会按键的递增顺序处理，因此在给定的分区内，输出将按排序顺序存储。\n\n### 组合器函数\n\n组合器是 MapReduce\
  \ 中的一个功能，在映射阶段进行部分聚合。它不仅提高了性能，而且当数据集非常大以至于归约器抛出堆栈溢出异常时，有时必须使用它。通常，归约器和组合器的逻辑是相同的，但这可能取决于\
  \ MapReduce 如何处理输出。\n\n为了实现这个单词计数示例，我们将遵循一个特定的设计模式。将有一个根类`RootBDAS`（BDAS 代表大数据分析系统），它有两个抽象方法：一个映射器任务和一个归约器任务。所有子类都实现这些映射器和归约器任务。主类将使用反射创建子类的实例，并在\
  \ MapReduce 的 map 函数中调用该实例的映射器任务，在 reduce 函数中调用归约器任务。这种模式的主要优点是你可以对 MapReduce 功能进行单元测试，并且它具有适应性。添加任何新的子类都不需要对主类或单元测试进行任何更改。你只需要更改配置。某些代码可能需要实现组合器或分区器逻辑。它们必须继承`ICombiner`或`IPartitioner`接口。\n\
  \n图 7-1 展示了该系统的类图。\n\n![](img/458833_2_En_7_Fig1_HTML.jpg)\n\n一个流程图说明了主类、单元测试器以及子类\
  \ 1 和 2 如何与抽象类和接口的类相连接。\n\n**图 7-1** 类图\n\n以下是`RootBDAS`类：\n\n```\nimport java.util.ArrayList;\n\
  import java.util.HashMap;\n/**\n*\n*/\n/**\n* @author SayanM\n*\n*/\npublic abstract\
  \ class RootBDAS {\nabstract  HashMap>  mapper_task(String line);\nabstract  HashMap>\
  \  reducer_task(String key, ArrayList values);\n}\n```\n\n以下是子类：\n\n```\nimport\
  \ java.util.ArrayList;\nimport java.util.HashMap;\n/**\n*\n*/\n/**\n* @author SayanM\n\
  *\n*/\npublic final class WordCounterBDAS extends RootBDAS{\n@Override\nHashMap>\
  \ mapper_task(String line) {\n// TODO Auto-generated method stub\nString[] words\
  \ = line.split(\" \");\nHashMap> result = new HashMap>();\nfor(String w : words)\n\
  {\nif(result.containsKey(w))\n{\nArrayList vals = result.get(w);\nvals.add(\"1\"\
  );\nresult.put(w, vals);\n}\nelse\n{\nArrayList vals = new ArrayList();\nvals.add(\"\
  1\");\nresult.put(w, vals);\n}\n}\nreturn result;\n}\n@Override\nHashMap> reducer_task(String\
  \ key, ArrayList values) {\n// TODO Auto-generated method stub\nHashMap> result\
  \ = new HashMap>();\nArrayList tempres = new ArrayList();\ntempres.add(values.size()+\
  \ \"\");\nresult.put(key, tempres);\nreturn result;\n}\n}\n```\n\n以下是`WordCounterBDAS`工具类：\n\
  \n```\nimport java.util.ArrayList;\nimport java.util.HashMap;\n/**\n*\n*/\n/**\n\
  * @author SayanM\n*\n*/\npublic final class WordCounterBDAS extends RootBDAS{\n\
  @Override\nHashMap> mapper_task(String line) {\n// TODO Auto-generated method stub\n\
  String[] words = line.split(\" \");\nHashMap> result = new HashMap>();\nfor(String\
  \ w : words)\n{\nif(result.containsKey(w))\n{\nArrayList vals = result.get(w);\n\
  vals.add(\"1\");\nresult.put(w, vals);\n}\nelse\n{\nArrayList vals = new ArrayList();\n\
  vals.add(\"1\");\nresult.put(w, vals);\n}\n}\nreturn result;\n}\n@Override\nHashMap>\
  \ reducer_task(String key, ArrayList values) {\n// TODO Auto-generated method stub\n\
  HashMap> result = new HashMap>();\nArrayList tempres = new ArrayList();\ntempres.add(values.size()+\
  \ \"\");\nresult.put(key, tempres);\nreturn result;\n}\n}\n```\n\n以下是`MainBDAS`类：\n\
  \n\n\n```java\nimport java.io.IOException;\nimport java.util.ArrayList;\nimport\
  \ java.util.HashMap;\nimport org.apache.hadoop.conf.Configuration;\nimport org.apache.hadoop.fs.Path;\n\
  import org.apache.hadoop.io.LongWritable;\nimport org.apache.hadoop.io.Text;\nimport\
  \ org.apache.hadoop.mapreduce.Job;\nimport org.apache.hadoop.mapreduce.Mapper;\n\
  import org.apache.hadoop.mapreduce.Reducer;\nimport org.apache.hadoop.mapreduce.lib.input.FileInputFormat;\n\
  import org.apache.hadoop.mapreduce.lib.input.TextInputFormat;\nimport org.apache.hadoop.mapreduce.lib.output.FileOutputFormat;\n\
  import org.apache.hadoop.mapreduce.lib.output.TextOutputFormat;\n/**\n*\n*/\n/**\n\
  * @author SayanM\n*\n*/\npublic class MainBDAS {\npublic static class MapperBDAS\
  \ extends Mapper {\nprotected void map(LongWritable key, Text value, Context context)\n\
  throws IOException, InterruptedException {\nString classname = context.getConfiguration().get(\"\
  classname\");\ntry {\nRootBDAS instance = (RootBDAS) Class.forName(classname).getConstructor().newInstance();\n\
  String line = value.toString();\nHashMap> result = instance.mapper_task(line);\n\
  for(String k : result.keySet())\n{\nfor(String v : result.get(k))\n{\ncontext.write(new\
  \ Text(k), new Text(v));\n}\n}\n} catch (Exception e) {\n// TODO Auto-generated\
  \ catch block\ne.printStackTrace();\n}\n}\n}\npublic static class ReducerBDAS extendsReducer\
  \ {\nprotected void reduce(Text key, Iterable values,\nContext context) throws IOException,\
  \ InterruptedException {\nString classname = context.getConfiguration().get(\"classname\"\
  );\ntry {\nRootBDAS instance = (RootBDAS) Class.forName(classname).getConstructor().newInstance();\n\
  ArrayList vals = new ArrayList();\nfor(Text v : values)\n{\nvals.add(v.toString());\n\
  }\nHashMap> result = instance.reducer_task(key.toString(), vals);\nfor(String k\
  \ : result.keySet())\n{\nfor(String v : result.get(k))\n{\ncontext.write(new Text(k),\
  \ new Text(v));\n}\n}\n} catch (Exception e) {\n// TODO Auto-generated catch block\n\
  e.printStackTrace();\n}\n}\n}\npublic static void main(String[] args) throws Exception\
  \ {\n// TODO Auto-generated method stub\nString classname = Utility.getClassName(Utility.configpath);\n\
  Configuration con = new Configuration();\ncon.set(\"classname\", classname);\nJob\
  \ job = new Job(con);\njob.setJarByClass(MainBDAS.class);\njob.setJobName(\"MapReduceBDAS\"\
  );\njob.setOutputKeyClass(Text.class);\njob.setOutputValueClass(Text.class);\njob.setInputFormatClass(TextInputFormat.class);\n\
  job.setOutputFormatClass(TextOutputFormat.class);\nFileInputFormat.setInputPaths(job,\
  \ new Path(args[0]));\nFileOutputFormat.setOutputPath(job, new Path(args[1]));\n\
  job.setMapperClass(MapperBDAS.class);\njob.setReducerClass(ReducerBDAS.class);\n\
  System.out.println(job.waitForCompletion(true));\n}\n}\n```\n\n要测试该示例，你可以使用这个单元测试类：\n\
  \n```java\nimport static org.junit.Assert.*;\nimport java.util.ArrayList;\nimport\
  \ java.util.HashMap;\nimport org.junit.Test;\npublic class testBDAS {\n@Test\npublic\
  \ void testMapper() throws Exception{\nString classname = Utility.getClassName(Utility.testconfigpath);\n\
  RootBDAS instance = (RootBDAS) Class.forName(classname).getConstructor().newInstance();\n\
  String line = Utility.getMapperInput(Utility.testconfigpath);\nHashMap> actualresult\
  \ = instance.mapper_task(line);\nHashMap> expectedresult = Utility.getMapOutput(Utility.testconfigpath);\n\
  for(String key : actualresult.keySet())\n{\nboolean haskey = expectedresult.containsKey(key);\n\
  assertEquals(true, haskey);\nArrayList actvals = actualresult.get(key);\nfor(String\
  \ v : actvals)\n{\nboolean hasval = expectedresult.get(key).contains(v);\nassertEquals(true,\
  \ hasval);\n}\n}\n}\n@Test\npublic void testReducer(){\nfail();\n}\n}\n```\n\n最后，这里是接口：\n\
  \n```java\nimport java.util.ArrayList;\nimport java.util.HashMap;\npublic interface\
  \ ICombiner {\nHashMap>  combiner_task(String key, ArrayList values);\n}\npublic\
  \ interface IPartitioner {\npublic int  partitioner_task(String line);\n}\n```\n\
  \n## HDFS 文件系统\n\n除了 MapReduce，HDFS 是 Hadoop 框架中的第二个组件。它旨在分布式环境中，使用通用的低成本硬件来处理大数据。HDFS\
  \ 建立在 Unix POSIX 文件系统之上，并做了一些修改，其目标是处理流式数据。\n\nHadoop 集群由两种类型的主机组成：名称节点和数据节点。名称节点存储元数据，控制执行，并充当集群的主节点。数据节点执行实际工作；它充当从节点，执行名称节点发送的指令。\n\
  \n## MapReduce 设计模式\n\nMapReduce 是一种用于处理分布在数百台计算机上的数据的原型。在 MapReduce 编程中有一些常见的设计模式。\n\
  \n### 汇总模式\n\n简而言之，reducer 为每个键创建汇总（见图 7-2）。如果你想对数据进行排序或用于其他目的，可以使用该实践。单词计数是汇总器模式的一个例子。此模式可用于查找数据的最小值、最大值和计数，或查找平均值、中位数和标准差。\n\
  \n![](img/458833_2_En_7_Fig2_HTML.png)\n\n一个流程图说明了 mapper、partitioner 和 reducer\
  \ 如何通过键、汇总字段、分组和汇总连接起来。\n\n图 7-2\n\n汇总模式的详细信息\n\n### 过滤模式\n\n在 MapReduce 中，过滤是以分而治之的方式完成的（图\
  \ 7-3）。每个 mapper 任务过滤一个数据子集，reducer 聚合过滤后的子集并生成最终输出。生成前 N 条记录、搜索数据和采样数据是过滤模式的常见用例。\n\
  \n![](img/458833_2_En_7_Fig3_HTML.png)\n\n一个流程图说明了四个输入分片如何通过过滤 mapper 连接到它们各自的输出分片。\n\
  \n图 7-3\n\n过滤模式的详细信息\n\n### 连接模式\n\n在 MapReduce 中，连接（图 7-4）可以在 map 端或 reduce 端完成。对于\
  \ map 端，要连接的数据集应存在于同一个集群中；否则，需要使用 reduce 端连接。连接可以是外连接、内连接或反连接。\n\n![](img/458833_2_En_7_Fig4_HTML.jpg)\n\
  \n一个流程图说明了 mapper 1 和 mapper 2 如何连接到一个共同的 reducer，以预测键以及值 1 和值 2 的输出。\n\n图 7-4\n\
  \n连接模式的详细信息\n\n以下代码是 reducer 端连接的示例：\n\n\n\n```java\npackage MapreduceJoin;\nimport\
  \ java.io.IOException;\nimport java.util.ArrayList;\nimport java.util.Iterator;\n\
  import org.apache.hadoop.fs.Path;\nimport org.apache.hadoop.io.LongWritable;\nimport\
  \ org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapred.JobConf;\nimport org.apache.hadoop.mapred.MapReduceBase;\n\
  import org.apache.hadoop.mapred.OutputCollector;\nimport org.apache.hadoop.mapred.Reporter;\n\
  import org.apache.hadoop.mapred.lib.MultipleInputs;\nimport org.apache.hadoop.mapreduce.Job;\n\
  import org.apache.hadoop.mapred.Mapper;\nimport org.apache.hadoop.mapred.Reducer;\n\
  import org.apache.hadoop.mapreduce.lib.output.FileOutputFormat;\nimport org.apache.hadoop.mapred.TextInputFormat;\n\
  @SuppressWarnings(\"deprecation\")\npublic class MapreduceJoin {\n////////////////////////////////////////////////////////\n\
  @SuppressWarnings(\"deprecation\")\npublic static class JoinReducer extends MapReduceBase\
  \ implements Reducer\n{\npublic void reduce(Text key, Iterator values, OutputCollector\
  \ output, Reporter reporter) throws IOException\n{\nArrayList translist = new ArrayList();\n\
  String secondvalue = \"\";\nwhile (values.hasNext())\n{\nString currValue = values.next().toString().trim();\n\
  if(currValue.contains(\"trans:\")){\nString[] temp = currValue.split(\"trans:\"\
  );\nif(temp.length > 1)\ntranslist.add(temp[1]);\n}\nif(currValue.contains(\"sec:\"\
  ))\n{\nString[] temp = currValue.split(\"sec:\");\nif(temp.length > 1)\nsecondvalue\
  \ = temp[1];\n}\n}\nfor(String trans : translist)\n{\noutput.collect(key, new Text(trans\
  \ +'\\t' + secondvalue));\n}\n}\n}\n////////////////////////////////////////////////////////\n\
  @SuppressWarnings(\"deprecation\")\npublic static class TransactionMapper extends\
  \ MapReduceBase implements Mapper\n{\nint index1 = 0;\npublic void configure(JobConf\
  \ job) {\nindex1 = Integer.parseInt(job.get(\"index1\"));\n}\npublic void map(LongWritable\
  \ key, Text value, OutputCollector output, Reporter reporter) throws IOException\n\
  {\nString line = value.toString().trim();\nif(line==\"\") return;\nString splitarray[]\
  \ = line.split(\"\\t\");\nString id = splitarray[index1].trim();\nString ids = \"\
  trans:\" + line;\noutput.collect(new Text(id), new Text(ids));\n}\n}\n////////////////////////////////////////////////////////\n\
  @SuppressWarnings(\"deprecation\")\npublic static class SecondaryMapper extends\
  \ MapReduceBase implements Mapper\n{\nint index2 = 0;\npublic void configure(JobConf\
  \ job) {\nindex2 = Integer.parseInt(job.get(\"index2\"));\n}\npublic void map(LongWritable\
  \ key, Text value, OutputCollector output, Reporter reporter) throws IOException\n\
  {\nString line = value.toString().trim();\nif(line==\"\") return;\nString splitarray[]\
  \ = line.split(\"\\t\");\nString id = splitarray[index2].trim();\nString ids = \"\
  sec:\" + line;\noutput.collect(new Text(id), new Text(ids));\n}\n}\n////////////////////////////////////////////////////////////\n\
  @SuppressWarnings({ \"deprecation\", \"rawtypes\", \"unchecked\" })\npublic static\
  \ void main(String[] args) throws IOException, ClassNotFoundException, InterruptedException\
  \ {\n// TODO Auto-generated method stub\nJobConf conf = new JobConf();\nconf.set(\"\
  index1\", args[3]);\nconf.set(\"index2\", args[4]);\nconf.setReducerClass(JoinReducer.class);\n\
  MultipleInputs.addInputPath(conf, new Path(args[0]), TextInputFormat.class, (Class)\
  \ TransactionMapper.class);\nMultipleInputs.addInputPath(conf, new Path(args[1]),\
  \ TextInputFormat.class, (Class) SecondaryMapper.class);\nJob job = new Job(conf);\n\
  job.setJarByClass(MapreduceJoin.class);\njob.setJobName(\"MapReduceJoin\");\njob.setOutputKeyClass(Text.class);\n\
  job.setOutputValueClass(Text.class);\nFileOutputFormat.setOutputPath(job, new Path(args[2]));\n\
  System.out.println(job.waitForCompletion(true));\n}\n}\n```\n\n## 关于函数式编程的说明\n\n\
  `MapReduce` 是函数式编程。函数式编程是一种所有变量都不可变的编程方式，这使得并行化变得容易，并避免了竞态条件。普通的 Python 也支持函数式编程。\n\
  \n以下是一个示例：\n\n```python\nemployees = [{\n'name': 'Jane',\n'salary': 90000,\n'job_title':\
  \ 'developer'\n}, {\n'name': 'Bill',\n'salary': 50000,\n'job_title': 'writer'\n\
  }, {\n'name': 'Kathy',\n'salary': 120000,\n'job_title': 'executive'\n}, {\n'name':\
  \ 'Anna',\n'salary': 100000,\n'job_title': 'developer'\n}, {\n'name': 'Dennis',\n\
  'salary': 95000,\n'job_title': 'developer'\n}, {\n'name': 'Albert',\n'salary': 70000,\n\
  'job_title': 'marketing specialist'\n}]\n#计算开发人员的平均薪资\ndevelopers = mean(map( lambda\
  \ e: e.salary if e.job_title =='developer'))\n```\n\n\n\n## Spark\n\n继 Hadoop 之后，Spark\
  \ 是大数据技术的下一次革命性演进。Spark 的主要优势在于它为整个大数据技术栈提供了统一接口。过去，如果你需要类似 SQL 的大数据接口，你会使用 Hive；如果需要实时数据处理，你会使用\
  \ Storm；如果想构建机器学习模型，你会使用 Mahout。而 Spark 将所有功能整合到一个框架之下。此外，它支持大数据的内存计算，这使得处理速度非常快。图\
  \ 7-5 描述了 Spark 的所有组件。\n\n![](img/458833_2_En_7_Fig5_HTML.jpg)\n\n一个框图列出了 Spark\
  \ Core 的组件，包括：Spark SQL 结构化数据、Spark Streaming 实时处理、MLib 机器学习、GraphX、调度器、YARN 和 Mesos。\n\
  \n**图 7-5** Spark 的组件\n\n`Spark Core` 是 Spark 的基础组件。它可以运行在 Hadoop 之上，也可以独立运行。它将数据集抽象为弹性分布式数据集（RDD）。RDD\
  \ 是一个只读对象的集合。由于它是只读的，因此在与多个并行操作共享时不会出现任何同步问题。对 RDD 的操作是惰性的。RDD 上的操作分为两种类型：转换（transformation）和动作（action）。在转换中，数据集上不会执行任何操作。Spark\
  \ 仅将操作序列存储为一个称为*血统（lineage）*的有向无环图。当调用动作时，才会执行实际计算。首次执行后，结果会缓存在内存中。因此，当调用新的执行时，Spark\
  \ 会遍历血统图，最大限度地重用之前的计算结果，从而使新操作的计算量降至最低。这使得数据处理速度非常快，并且也使数据具有容错性。如果任何节点发生故障，Spark\
  \ 会查看该节点数据的血统图，并轻松地重新生成它。\n\nHadoop 框架的一个局限性是它在并行计算中没有消息传递接口。但有许多用例需要并行作业之间相互通信。Spark\
  \ 通过使用两种共享变量来实现这一点：广播变量（broadcast variable）和累加器（accumulator）。当一个作业需要向所有其他作业发送消息时，该作业使用广播变量；而当多个作业想要将结果聚合到一个地方时，它们使用累加器。RDD\
  \ 将其数据集分割成称为*分区（partition）*的单元。Spark 提供了一个接口来指定数据的分区，这对于未来的操作（如 `join` 或 `find`）非常有效。用户可以在\
  \ Spark 中指定分区的存储类型。Spark 提供了 Python、Java 和 Scala 的编程接口。以下是在 Spark 中实现单词计数程序的示例代码：\n\
  \n```\nval conf = new SparkConf().setAppName(\"wiki_test\") // 创建一个 Spark 配置对象\n\
  val sc = new SparkContext(conf) // 创建一个 Spark 上下文\nval data = sc.textFile(\"/path/to/somedir\"\
  ) // 从 \"somedir\" 读取文件到 RDD 中，RDD 包含 (文件名, 内容) 对。\nval tokens = data.flatMap(_.split(\"\
  \ \")) // 将每个文件拆分为一个 token（单词）列表。\nval wordFreq = tokens.map((_, 1)).reduceByKey(_\
  \ + _) // 为每个 token 添加计数 1，然后按单词类型求和。\nwordFreq.sortBy(s => -s._2).map(x => (x._2,\
  \ x._1)).top(10) // 获取前 10 个单词。交换单词和计数以便按计数排序。\n```\n\n在 `Spark Core` 之上，Spark 提供了以下功能：\n\
  \n*   Spark SQL，通过命令行或数据库连接器接口提供 SQL 接口。它还为 Spark 数据帧对象提供了 SQL 接口。\n*   Spark Streaming，使您能够实时处理流式数据。\n\
  *   MLib，一个机器学习库，用于在 Spark 数据上构建分析模型。\n*   GraphX，一个分布式图处理框架。\n\n## PySpark\n\n\
  PySpark 是 Apache Spark 的 Python 接口。使用简单的 Python API，我们可以编写 Spark 应用程序。Spark 的所有主要特性，即\
  \ Spark SQL、MLib 和数据帧，都受 PySpark 支持。以下是安装步骤：\n\n1.  首先，我们需要 Java 运行时环境（JRE）来运行 Spark。建议从以下链接安装\
  \ JRE：[`https://adoptium.net/temurin/releases/?version=8`](https://adoptium.net/temurin/releases/%253Fversion%253D8)。此外，您也可以从其他发行版安装\
  \ JRE。\n\n    安装过程会自动创建 `JAVA_HOME`。如果没有，我们需要将 `JAVA_HOME` 设置为系统变量；其值应为 Java 安装文件夹的位置，例如\
  \ `JAVA_HOME=C:\\Program Files\\Eclipse Adoptium\\jdk-8.0.345.1-hotspot\\`。\n\n\
  2.  然后，我们需要使用命令 `pip install pyspark` 安装 PySpark。\n\n    为此，我们需要安装 Python 3.7 或更高版本。之后，我们需要将\
  \ `env PYSPARK_PYTHON` 设置为 Python 的位置。示例如下：`C:\\Users\\...\\Programs\\Python\\Python39\\\
  python.exe`。\n\n3.  此外，通过使用 `pip install pyarrow` 安装 PyArrow，以便在 PySpark 中使用 Pandas\
  \ API。\n\n现在，我们可以开始用 PySpark 编写代码了。CSV 文件与我们之前使用的相同。\n\n```\nfrom pyspark.sql import\
