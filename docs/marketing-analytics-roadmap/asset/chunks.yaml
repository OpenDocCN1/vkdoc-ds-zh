  raw: '## Why You Need a Dashboard


    > The greatest value of a picture is when it forces us to notice what we never
    expected to see. —John Wilder Tukey, Exploratory Data Analysis


    A dashboard, or more probably a series of dashboards, are critical enablers of
    the marketing analytics process. In the same way an elevator pitch summarizes
    the key value proposition of a company or product to prospective customers, a
    dashboard distills the most important results of the marketing analytics process
    into an easily digested visual summary. If the output of the marketing analytics
    process tells a War and Peace–length story, a dashboard provides the Cliff’s Notes
    version. The marketing analytics dashboard is the executive summary of marketing’s
    performance report. It is the one thing you can count on that people will view.


    Those who are implementing a marketing analytics process for the first time will
    discover just how much data the process is capable of producing. Those who are
    managing a mature marketing analytics process are already swimming, perhaps drowning,
    in an ocean of marketing metrics data. The only way to consistently make sense
    of it all is through an effective visual summary of that data, otherwise known
    as a dashboard. Not pairing a marketing analytics process with one or more dashboards
    is to rob the process of a powerful communications tool.


    Note


    The failure to use one or more dashboards as part of the marketing analytics process
    robs it of a powerful communications tool.


    In the beginning, when the scope of the marketing analytics process is small,
    it is possible to use raw data to manage key marketing processes and, to a lesser
    extent, to inform. But dealing with raw data is tedious, and if the marketing
    analytics process expands to ultimately encompass all aspects of marketing (as
    it should), dealing with raw data isn’t a scalable process. It doesn’t take a
    lot of data for the management of it to become cumbersome and unwieldy without
    some tools. The use of one or more dashboards is a necessity to help organize
    and package this data so it can fulfill its intended purpose: create awareness
    about performance and enable decisions that improve marketing’s effectiveness.


    The data from the marketing analytics process mushrooms. It doesn’t take long
    for a large collection of data to accumulate for just a single metric. As new
    metrics are added to the marketing analytics portfolio, each with its own data
    set, the total volume of data can easily grow exponentially. This is a normal
    occurrence as the analytics process evolves: it doesn’t take long for the volume
    of data that requires analysis, review, and attention to soar. To meet expectations,
    the analytics process needs data analysis and reporting tools, and the dashboard
    is the pinnacle of that reporting.


    The process of data analysis, by its very nature, encourages the analyst to delve
    more deeply into the data. The onion metaphor applies here, with multiple data
    layers into which the analyst can go deeper and deeper searching for greater meaning.
    This “zooming in” approach to analyzing marketing analytics data is important
    and necessary, yielding many insights for those with the discipline to do it.
    Despite the necessity of taking such a close-up view of the data, the downside
    is a loss of the big picture. The marketing analytics process must use a microscope
    to look at the data very closely, but also a telescope to view the data from a
    distance and see it in its entirety. A dashboard is one of the best ways to provide
    this latter “big-picture” view. If the analysis of marketing metrics provides
    a close-up view of the trees, then the dashboard presents a view of the forest.


    One reason seeing the big picture is so important is to spot trends that only
    reveal themselves when analytics data is viewed in aggregate, over time. When
    a marketer, while analyzing the data, makes a discovery of something that might
    require action, a good question to ask about the discovery is this: is it an incident
    or a trend? It’s important to distinguish between incidents and trends in data,
    as the former may require no action at all, whereas the latter might require significant
    process changes. The big picture view that a dashboard provides can help the marketing
    team quickly distinguish between incidents and trends.


    Another reason the dashboard is so important is that it presents all the key metrics
    side by side for easy comparison. Viewing the results of just a single metric
    could lead to erroneous conclusions. If those results are very favorable or very
    troubling, attempting to interpret those results outside of the context of other,
    related metrics can lead to flawed interpretations and bad decisions. The dashboard
    essentially represents marketing’s vital signs, and a significant part of the
    value of it is the ability to obtain a complete view of all those vital signs.
    A particular metric that seems troubling when viewed in isolation is perhaps less
    alarming when viewed alongside related metrics. Conversely, a metric that seems
    fine in isolation may create necessary alarm when seen as part of the big picture.
    This holistic view of marketing analytics data is another reason the marketing
    analytics process needs one or more dashboards.


    The view the rest of the organization often has of sales and marketing is ­summarized
    by this question: “what have you done for us lately?” This question represents
    a level of skepticism about performance and contribution that is frequently directed
    marketing’s way. Marketing’s use of dashboards helps keep this question from being
    merely rhetorical, and instead provides an accountability interface that clears
    away the fog around how marketing is helping the organization succeed. This benefit
    is perhaps the most important reason for marketing to adopt the use of dashboards
    with its analytics process, even if they are not needed for any other reason.


    There are plenty of reasons to use a dashboard as part of the marketing ­analytics
    process—to see the big picture, spot trends, compare metrics side by side, and
    show accountability. Any one of these reasons is more than ­sufficient to justify
    developing dashboards to support the marketing analytics process. Together, these
    reasons compel the use of marketing dashboards.'
  trans: "\n# 为什么你需要数据仪表盘\n\n> 图片的最大价值在于它能迫使我们注意到那些从未预料到会看到的东西。——约翰·图基，《探索性数据分析》\n\
    \n仪表盘，或者更可能是一系列仪表盘，是营销分析流程中至关重要的推动工具。就像电梯演讲向潜在客户概括公司或产品的核心价值主张一样，仪表盘将营销分析过程中最重要的结果提炼成易于理解的视觉摘要。如果营销分析流程的输出讲述的是一个《战争与和平》长度的故事，那么仪表盘就提供了《克利夫笔记》的浓缩版本。营销分析仪表盘就是营销业绩报告的“高管摘要”，它是唯一可以确保人们会关注的东西。\n\
    \n那些首次实施营销分析流程的人会发现，该流程能够产生海量数据。而那些管理成熟营销分析流程的人，则已经淹没在（甚至可能溺毙于）营销指标数据的汪洋大海中。要持续理解所有这些数据的唯一方法，就是通过有效的视觉摘要（即仪表盘）来呈现。如果不将营销分析流程与一个或多个仪表盘搭配使用，就等于剥夺了该流程一个强大的沟通工具。\n\
    \n> **注意**  \n> 在营销分析流程中未能使用一个或多个仪表盘，会使其失去一个强大的沟通工具。\n\n最初，当营销分析流程的范围很小时，或许可以利用原始数据来管理关键营销流程，并在较小程度上提供信息。但处理原始数据既繁琐又枯燥；如果营销分析流程扩展到最终覆盖营销的各个方面（理应如此），那么处理原始数据将不再是一个可扩展的流程。无需太多数据，一旦缺乏相应工具，数据管理就会变得笨重且难以驾驭。使用一个或多个仪表盘是必要的，它有助于组织和打包这些数据，使其能够实现预定目标：建立对业绩的认知，并促成提升营销效能的决策。\n\
    \n来自营销分析流程的数据会迅速膨胀。仅针对单一指标，大量数据的积累也用不了多久。随着新的指标被添加到营销分析组合中，每个指标都带有自己的数据集，数据总量很容易呈指数级增长。这是分析流程演进过程中的正常现象：需要分析、审查和关注的数据量很快就会暴增。为了满足预期，分析流程需要数据分析与报告工具，而仪表盘正是这类报告工具的顶峰。\n\
    \n数据分析过程，就其本质而言，鼓励分析人员深入探究数据。这里可以用“洋葱”来比喻，数据存在多层结构，分析人员可以一层层深入，探寻更深层的含义。这种“放大”审视营销分析数据的方法重要且必要，能为那些严谨执行的人带来诸多洞见。尽管近距离审视数据是必要的，但其缺点是会丧失全局观。营销分析流程既需要用显微镜近距离查看数据，也需要用望远镜远距离纵览全局。仪表盘正是提供这种“全局观”的最佳方式之一。如果对营销指标的分析是近观树木，那么仪表盘呈现的就是森林的全貌。\n\
    \n看清全局之所以如此重要，一个原因是为了发现那些只有在聚合数据随时间的推移中才能显露的趋势。当营销人员分析数据并发现了可能需要采取行动的事项时，一个好问题是：这是偶发事件还是趋势？区分数据中的偶发事件和趋势至关重要，因为前者可能无需任何行动，而后者则可能需要重大的流程变革。仪表盘提供的全局视图可以帮助营销团队快速区分偶发事件和趋势。\n\
    \n仪表盘如此重要的另一个原因是，它能将所有关键指标并列呈现，便于比较。仅仅查看单一指标的结果可能导致错误结论。如果这些结果非常有利或非常令人担忧，试图脱离其他相关指标的背景来解释这些结果，就可能导致解读错误和决策失误。仪表盘本质上代表营销的“生命体征”，其价值的一个重要部分就在于能够获得所有这些生命体征的完整视图。某个单独看来令人担忧的指标，当与相关指标并列呈现时，或许就没那么令人紧张了。反之，一个单独看来尚可的指标，当作为全局的一部分来看时，可能会发出必要的警报。这种对营销分析数据的整体视角，是营销分析流程需要一个或多个仪表盘的另一个原因。\n\
    \n组织内其他部门对销售和营销的看法，通常可以总结为这样一个问题：“你们最近为我们做了什么？”这个问题体现了一种对营销部门业绩和贡献常常抱有的怀疑态度。营销部门使用仪表盘有助于防止这个问题沦为单纯的修辞性发问，而是提供了一个问责界面，澄清了营销助力组织成功方面的迷雾。这个好处或许是营销部门在其分析流程中采用仪表盘的最重要原因，即使没有任何其他理由也足以推动其采用。\n\
    \n在营销分析流程中采用仪表盘的理由有很多：看清全局、发现趋势、对比不同指标以及展示问责制。这些理由中的任何一个，都足以证明开发仪表盘来支持营销分析流程的合理性。这些理由加在一起，更有力地推动了营销仪表盘的应用。\n"
- fmt: '# Keys to Success with Dashboards


    > If you just focus on the smallest details, you never get the big picture right.
    —Leroy Hood[⁴](#A978-1-4842-0259-3_7_Chapter.html#Fn4)


    The marketing dashboard is a simple concept to grasp, and the term itself is very
    descriptive, leading most people to a solid understanding of what a marketing
    dashboard is. The challenges with marketing dashboards lie elsewhere, particularly
    in their implementation, use, and acceptance. Since dashboards effectively serve
    as the organization’s interface to marketing’s performance, it’s important to
    implement them properly. The stakes are high: if the dashboard(s) that marketing
    publishes become the primary influencer of the opinion of marketing, the marketing
    team cannot afford to get this wrong. A cavalier approach to the marketing dashboard
    may cost the marketing team in the areas of reputation, confidence, and political
    capital—even if they are executing the marketing analytics process well. This
    section describes the key considerations for implementing marketing dashboards
    well.


    There are many aspects of marketing dashboards the marketer must consider, all
    of them important, but one of the most important considerations is alignment.
    As [Chapter 5](../Text/A978-1-4842-0259-3_5_Chapter.html) discusses, the marketing
    analytics process and the metrics that support it are a reflection of higher level
    business goals. In fact, the goals for and metrics of the marketing analytics
    process are derived from business goals and objectives. A thread of continuity
    should run from the highest level of business goals to the most detailed marketing
    metric. In other words, complete alignment should exist, and that alignment must
    extend to the dashboards that marketing publishes.


    This notion of aligning the dashboard to the objectives and the metrics associated
    with them seems intuitive. In actual practice, however, the metrics can easily
    be untethered from the objectives, and so can the dashboard. When this happens,
    it usually isn’t caused by a deliberate intent to deceive. Rather, it’s a reflection
    of inexperience or expediency. In the same way that [Chapter 5](../Text/A978-1-4842-0259-3_5_Chapter.html)
    recommends making sure the analytics process and its underlying metrics align
    to the business strategy and goals, marketing must ensure that the dashboards
    report data that is also aligned with something that matters, and not just data
    that looks good on the dashboard.


    What goes a long way toward ensuring that marketing’s dashboards are well aligned
    is the ideal selection of metrics. [Chapter 5](../Text/A978-1-4842-0259-3_5_Chapter.html)
    discusses the need to select metrics for the marketing analytics process that
    are based on business objectives. If the recommendations from [Chapter 5](../Text/A978-1-4842-0259-3_5_Chapter.html)
    are followed, then the input data for marketing’s dashboards should already align.
    Assuming compliance with those recommendations, the challenge becomes one of determining
    which metrics to include on the dashboard. What is the right level of detail?


    The marketing dashboard isn’t meant to serve as a comprehensive catalog of every
    metric tracked by the analytics process. Instead, it summarizes key results for
    various audiences who have different informational requirements. In the early
    going of the marketing analytics process, the compendium of metrics is usually
    small, and it is therefore possible to summarize each one on a single dashboard.
    However, as [Chapter 6](../Text/A978-1-4842-0259-3_6_Chapter.html) shares, the
    marketing analytics process expands in scope as it matures, including more metrics
    and collecting more data. It doesn’t take long for the list of things that a dashboard
    could report to exceed the things it should report.


    > **Note**: Marketing dashboards aren’t intended to track every metric in the
    marketing analytics catalog. Instead, they should summarize key results to meet
    the informational needs of the audience for the dashboard(s).


    The best way forward when it comes to the ideal selection of metrics for the marketing
    dashboard is to understand the audience for the dashboard. What do they need to
    know? Which metrics are critical to enable the audience to have an accurate understanding
    at the right level of marketing’s performance? When this approach is taken, it
    often leads to creating different versions of a marketing dashboard for specific
    audiences. For example, the “Executive Marketing Dashboard” is in regular use
    by many organizations, and it provides information and detail at a level desired
    by members of the C-suite. Marketing should not just publish dashboards but attempt
    to understand the audiences for its dashboards and provide them with the information
    that is most helpful to them.


    When marketing creates, publishes, and curates dashboards as part of the analytics
    process, it often has to deal with the issue of accurate data. The success of
    the entire analytics process hinges on the availability of accurate data. What
    many marketers learn is that accurate data isn’t always easy to obtain, particularly
    in the early stages of the process. The collection of marketing analytics data
    often requires tuning, tweaking, and testing methods across several measurement
    cycles to get it right and gain confidence in the data.


    Marketing dashboards are visual presentations of this data: consider them the
    “eye candy” of the marketing analytics process. As such, they are often impressive
    and dazzling in appearance, and it’s easy to create a stunning display of data
    on a dashboard that impresses but is also entirely inaccurate. However, the very
    fact that data is presented in a dashboard seems to give that data authority and
    credibility, even when it doesn’t deserve it.


    Marketing needs to guard against letting inaccurate data creep into one of its
    dashboards. Until an analytics data source is accurate and reliable, it should
    never appear on a dashboard, because its very presence there implies accuracy
    and trustworthiness. This is a reputational and integrity issue for marketing,
    and it must always err on the side of presenting no data before its time, despite
    how good that data may look as a component of a dashboard.


    As marketers sort through the metrics and select data for the dashboards they
    create, it is ideal to provide a real-time view of that data. It’s easy to think
    of dashboards as summaries of historical data and trends. It is useful to view
    a year’s worth of data for a key metric at a glance. However, having a real-time
    view of what is happening right now in the moment is also vital. The automotive
    dashboard, the metaphor for the marketing dashboard, does just that: provides
    real-time data for speed, fuel level, and other performance metrics. Marketing
    dashboards provide a lot of value when they are able to provide this up-to-the
    second information for certain metrics.


    The reality is that marketing dashboards need to supply both historical and real-time
    information, because dealing in one of these types of information is of limited
    value. Ultimately, if they don’t provide a broad enough view of information, their
    perception as an information source suffers, dragging the perception of marketing
    down as well. However, there are challenges to displaying real-time data in a
    dashboard, and these challenges range from the availability of the information
    to capturing that data in a dashboard. The need or desire to provide real-time
    data in a dashboard is often foiled by these technical challenges surrounding
    the data.'
