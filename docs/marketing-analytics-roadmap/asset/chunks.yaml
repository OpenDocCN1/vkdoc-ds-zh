    # 本书目的与读者


    本书源于我过去在营销绩效管理及其评估方式上的挫折与经验。我专为那些尚未开启数据分析之旅，但深知其必要性并正在摸索起点的营销组织而撰写。我希望这本书能激励营销人员与营销组织行动起来，并为他们指明前进方向。正如书名所示，书中的建议提供了一张路线图，并针对旅途中应考虑的方法、指标和工具给出了推荐。本书不会提供从营销分析之旅开始到结束的详细、逐步骤的指引。原因很简单：每个组织的旅程都必然不同。决定这段旅程的速度、载体甚至绕行路线的因素，每家公司都各不相同。


    本书不适合那些已经实现营销分析流程成熟的组织，除非他们希望来一次怀旧之旅，回顾自己走过的路。即便如此，本书所指引的方向依然拥有广泛的读者群体。就在本书即将出版之际，我与
    VisionEdge Marketing 合作完成的一项研究显示，仅有五分之一的营销组织建立了有效的分析流程。对于其余 80%的读者来说，本书将为启动并完成营销分析之旅提供一些鼓励和建议。正如老子所言：“千里之行，始于足下。”我希望这本书能帮助众多营销人员迈出那第一步。


    杰里·拉克利

    2015 年 5 月


    ## 致谢


    我感激我的 Demand Metric 同事们，特别是约翰·福利特和杰西·霍普斯，感谢他们在本书写作过程中给予的鼓励和支持。同样感谢俄克拉荷马州立大学斯皮尔斯商学院营销系的约书亚·维纳博士和汤姆·布朗博士，他们一直鼓励、支持并指导着我。


    还有一大批营销专业人士倡导营销分析事业及其背后的技术：仅举几例，如斯科特·布林克、劳拉·帕特森、克莱尔·普莱斯和斯蒂芬·索格。他们的热情与激情激励我将自己的想法和理念付诸书籍。


    我感谢那些让我成为他们营销人员的客户和雇主。在与他们并肩作战的营销一线工作中获得的经验，为本书提供了素材。


    最后，感谢杰夫·奥尔森，他找到了我，联系了我，并说服我开启了这次写书之旅。感谢阿普雷斯的丽塔、苏珊、劳拉以及优秀的团队，在整个过程中给予了我亲切而耐心的支持。


    ## 阿普雷斯商业：商业信息的公正来源


    阿普雷斯的商业书籍提供必要的信息和实用的建议，每本书都由公认的专家为从业者撰写。商业世界各个领域的忙碌管理者与专业人士——无论其技术素养高低——都信赖我们的书籍，从中获取可行的想法和工具，以解决问题、更新和提升专业技能、减轻工作负担并抓住机遇。


    无论商业领域的主题是什么——创业、金融、销售、营销、管理、法规、信息技术等——阿普雷斯都因提供您在日常工作中脱颖而出所需的客观信息和中立建议而备受赞誉。我们的作者没有偏见；他们明白自己只有一个使命——简洁、精准且富有深刻洞察地提供最新、准确的信息，满足读者的真实需求。


    如今，要在新闻媒体、互联网乃至书籍中（这种情况如今屡见不鲜）找到不偏不倚、真正为您利益着想的资讯越来越难。因此，我们希望您能喜欢这本精心打造、符合我们高质量与公正报道标准的书籍。


    我们始终期待您对新书目的反馈或想法。或许您甚至想自己写一本书。无论何种情况，请通过`editorial@apress.com`联系我们，编辑会迅速回复。顺便提一下，在本书末尾，您会找到一个有用的相关书目列表。请访问[`www.apress.com`](http://www.apress.com/)注册以获取新闻通讯和未来购买的折扣。


    阿普雷斯商业团队


