- fmt: "# The Use of Analytics in Marketing Culture\n\nThe use of analytics is part\
    \ of the marketing culture that everyone embraces. Culture is a function of leadership,\
    \ so the `CMO` sets the expectations and models the use of analytics as part of\
    \ the marketing culture. The `CMO` is the analytics process owner, and ideally\
    \ a thoughtful person who understands not to use analytics as a whip to punish\
    \ poor results. When analytics are used punitively, they’re immediately rejected,\
    \ or manipulated to only generate favorable data, eroding the value of the process.\
    \ To keep the process working like it should, these `CMOs` eliminate the fear\
    \ of negative consequences from using analytics to expose the poor performance\
    \ of a marketing initiative. Instead, the `CMO` creates a culture around analytics\
    \ that rewards identifying problems and underperformance so resolutions can occur.\n\
    \n## Budgeting and Funding\n\nThe budgeting process is rarely just a formality\
    \ for any type of marketing organization. However, those with analytics at the\
    \ core of their culture have a much easier time getting funding. One reason is\
    \ because the value of marketing is known: the analytics its uses allow it to\
    \ clearly show the entire organization how it helps create revenue. Because it\
    \ is able to tie revenue directly to its activities, marketing’s `ROI` is known.\
    \ Although it may take some effort to analyze and present the data, because these\
    \ marketing organizations have a real analytics process, justifying spending is\
    \ never speculation. It’s much easier to do because the necessary data is available.\n\
    \nThe analytics discipline of these marketing organizations are also helpful when\
    \ it comes to justifying ambitious, out-of-budget projects. Sometimes, the organization\
    \ will sense an opportunity that requires funding not in the budget, as well as\
    \ the agility to exploit it quickly. The `C-suite` is far more likely to make\
    \ these investments when marketing has the ability to measure the results. This\
    \ ability is no guarantee that the endeavor will succeed, but at least the organization\
    \ will know the outcome with certainty. There’s no fuzzy speculation about what\
    \ kind of returns are coming from these investments.\n\n## Operations and Decision\
    \ Making\n\nThese organizations tend to operate with greater authority and conviction\
    \ than those that are flying blind or using pseudo-analytics. For any significant\
    \ marketing activity or campaign, a prerequisite is identifying metrics to determine\
    \ its success. This operational approach builds in a healthy level of skepticism\
    \ about success: the marketing team doesn’t usually celebrate success—or condemn\
    \ something as a failure—unless the metrics provide the proof.\n\nUsing the analytic\
    \ process as a guide, the marketing team maintains a steady focus on producing\
    \ results, continuously refining what it does to constantly improve, generate\
    \ more revenue, or increase the margins. This orientation feels very different\
    \ from the first two types of organizations where activity is celebrated. When\
    \ analytics are at the heart of the marketing team’s culture, activities are meaningless\
    \ unless they produce a result the business cares about. One effect this attitude\
    \ generates is an intolerance for empty activities or busy work that produces\
    \ no value.\n\nIt’s easy to get a mental picture of these marketing organizations\
    \ as dispassionate number crunchers that do whatever the numbers dictate. That\
    \ picture is an inaccurate portrayal of how they make decisions. Of course the\
    \ numbers matter, but an organization that just followed the numbers wouldn’t\
    \ provide the leadership or creativity that an organization needs from its marketing\
    \ function. What happens instead is that the `CMO` drives the development of strategy,\
    \ usually in close collaboration with the marketing team and key organizational\
    \ stakeholders.\n\nPart of this decision making is always ample consideration\
    \ given to determining the right metrics for evaluating how the strategies and\
    \ tactics are working. Marketing analytics don’t remove all the risk from what\
    \ marketing does, but they enable marketing to more quickly and accurately determine\
    \ if results are within acceptable risk parameters. For this reason, these kinds\
    \ of marketing organizations are usually more comfortable taking risks than the\
    \ other two types.\n\n> **Tip**\n> \n> A good analytics program will enable you\
    \ to take more risks—comfortably—in bets that pay off.\n\nThere’s no mistaking\
    \ on which side of the fence these marketing organizations are: firmly on the\
    \ analytics side. This doesn’t mean that intuition plays no role in how these\
    \ organizations operate, but it does mean that intuition is always paired with\
    \ a set of metrics. Intuition has value and remains a key part of how these marketing\
    \ organizations develop strategy. Intuition may lead, but verification metrics\
    \ always follow. For this reason, these organization know better than the other\
    \ two the degree to which they can trust their intuition.\n\n## Summary: Three\
    \ Types of Marketing Organizations\n\nTable [1-1](#A978-1-4842-0259-3_1_Chapter.html#Tab1)\
    \ provides a summary of each type of marketing organization this chapter examines.\n\
    \n**Table 1-1.** Three Marketing Analytics Scenarios: No Analytics, Pseudo-Analytics,\
    \ and Real Analytics\n\n| Type | Leadership | Operation | Funding | Decisions\
    \ |\n| --- | --- | --- | --- | --- |\n| None | Intuitive | Busy-ness | Negotiated\
    \ political process | Educated guesses |\n| Pseudo | Intuitive; analytics smokescreen\
    \ | Busy-ness | Negotiated political process | Educated guesses |\n| Real | Intuitive;\
    \ analytics proof | Results | Based on business case | Informed by analytics |\n\
    \n### Not Three of a Kind\n\nThe three kinds of marketing organizations put under\
    \ the microscope in this chapter have one thing in common: they all fall within\
    \ the “marketing” box on the organizational chart. While those that are flying\
    \ blind and those that use pseudo-analytics share several characteristics, there\
    \ are few similarities between them and the one that uses real analytics.\n\n\
    Marketing professionals that have had experience working in all three kinds of\
    \ organizations almost always find the last kind the best place to work. The reason\
    \ is because in the first two kinds, marketing is viewed as an expense, a necessary\
    \ one perhaps, but still an expense. Should economic pressures affect companies\
    \ that view marketing this way, the marketing functions is one of the first place\
    \ the company makes cuts.\n\nBy contrast, in marketing organizations that use\
    \ a real analytics process, the value of marketing is known and understood by\
    \ the entire company. Here, marketing is a revenue center, and its performance\
    \ makes it an invaluable contributor to the company’s success. Marketing organizations\
    \ that do not learn how to transform themselves from cost centers to revenue centers\
    \ are transient. Their future is never certain; their existence is often in jeopardy.\
    \ The reason marketing organizations should adopt a real analytics process is\
    \ so they can make the transformation from a cost to a revenue center, and provide\
    \ ongoing proof of that transformation. The remainder of this book discusses how\
    \ to create such a marketing organization.\n\n## Footnotes\n\n1. “Sales & Marketing\
    \ Analytics: Gauging and Optimizing Performance,” p. 7, Demand Metric benchmark\
    \ report, December 2013.\n2. Earnings before interest, taxes, depreciation, and\
    \ amortization.\n3. See [http://www.demandmetric.com/content/eworkshop-learning-love-analytics](http://www.demandmetric.com/content/eworkshop-learning-love-analytics)."
