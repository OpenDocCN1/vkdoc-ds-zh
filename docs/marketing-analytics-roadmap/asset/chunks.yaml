- fmt: '# Advanced, Data-Driven Attribution


    Advanced, data-driven attribution (sometimes referred to as cross-channel attribution)
    is a method that precisely allocates fractional credit to elements of the full
    stream of content or media to which a customer is exposed on their buying journey.
    Chapter [10](../Text/A978-1-4842-0259-3_10_Chapter.html) provides greater detail
    on advanced attribution, but it merits a mention here since it falls within the
    realm of strategic marketing analytics.


    Marketers that use advanced attribution can know precisely which offers, elements,
    and media stream components really produced a conversion. This level of insight
    into which components of marketing’s multichannel campaigns really deserve credit
    has long been considered impossible or unknowable, but with advanced attribution,
    it is a reality.


    Advanced attribution is important, because it provides marketers with the data
    to make intelligent decisions about their media mix. Marketers once relied on
    intuition and guesswork to determine the right blend of email, online display
    advertising, social media advertising, paid search, and direct mail. Now through
    advanced attribution, accurate data is available about each of the channels in
    use and how they perform together. The advanced attribution solution space experienced
    significant consolidation in 2014.[⁹](#A978-1-4842-0259-3_8_Chapter.html#Fn9)
    Forrester Research has published an evaluation of cross-channel attribution solutions
    that covers the following vendors: `Abakus`, `AOL/Convertro`, `eBay Enterprise`,
    `Google`, `Marketing Evolution`, `MarketShare`, `Rakuten DC Storm`, and `Visual
    IQ`.[^(10)](#A978-1-4842-0259-3_8_Chapter.html#Fn10)


    # Cohort Analysis


    Cohort analysis is the study over time of the behavior of a group of customers
    that share a common characteristic. These behaviors are any that are of interest
    to the marketer, and studying them enables the identification of relationships
    between a population’s (cohort’s) characteristics and its behavior. Cohort analysis
    provides that often elusive “apples-to-apples” comparison between groups of customers.
    The literature on cohort analysis frequently uses university graduation year as
    an example of a cohort. Each graduating class is a cohort, and characteristics
    are tracked and compared between cohorts to determine, for example, if there is
    a relationship between a cohort’s graduation year and its average income.


    Cohort analysis is important because for key business or marketing metrics, a
    cohort analysis reveals how those metrics change over the life of a customer relationship.
    These revelations lead to better customer retention and more precise estimates
    of customer lifetime value (`CLV`). Knowing `CLV` with precision is important,
    because it guides decisions about how much a firm should invest to acquire new
    customers. This approach has been embraced by app and game developers, online,
    e-commerce, and software as a service businesses, where its use is particularly
    relevant. Besides `CLV` analysis, some common cohort analyses include daily/weekly/monthly
    sales, new versus repeat sales, average order value, and time between purchases.


    The tools for building cohort analyses include many previously referenced `BI`
    and `CI` solutions, as well as `CoolaData`, `Flurry`, `Google Analytics`, `KISSmetrics`,
    `Kontagent`, `Mixpanel`, `RJMetrics`, and others. `Cohort.ly` and `USERcycle`
    both offer a level of free cohort analysis services. When selecting a tool, make
    sure it provides an Application Program Interface (`API`) to or otherwise integrates
    with the environments you want to include in your analysis, and that it is easy
    to include historical data that is important to your analysis.


    ## Operations and Logistics Marketing Analytics


    Analytics tools and solutions that fall within the operations and logistics realm
    have much to do with an organization’s digital presence. Where once this digital
    presence was simply the company website, now it encompasses every digital touchpoint:
    the website, micro-sites, all company-curated social media, search engine optimization
    (`SEO`), search engine marketing (`SEM`), and mobile. Marketers need tools that
    allow them to understand not just the individual performance of each of these
    separate digital channels but to have a holistic view of their performance.


    The place to begin this discussion is with the website and the analytics tools
    that help manage and optimize it. What is true with increasing frequency is that
    buyers investigate potential vendors online, going deep into the purchase consideration
    process before vendors are even aware of potential buyer interest. For this reason,
    the website is still ground zero for digital marketing efforts for most organizations.
    A company whose website does not easily and quickly provide the content potential
    buyers need will suffer because of it. Tools are needed that give companies real-time
    insight into how visitors are interacting with their websites, so that companies
    can quickly pivot to address website and content deficiencies.


    The tool that dominates the marketing analytics landscape is `Google Analytics`.
    Many marketers got their first exposure to analytics through the use of this tool.
    Stating that `Google Analytics` dominates the landscape is not mere hyperbole:
    it is used by half of all the websites, and as a web analytics tool, it enjoys
    a market share of 82 percent.[^(11)](#A978-1-4842-0259-3_8_Chapter.html#Fn11)
    If a marketing organization had to limit itself to the use of just a single analytics
    tool, `Google Analytics` would be that tool. If having a website that performs
    well is critical to an organization’s success, using `Google Analytics` to manage
    that website makes tremendous sense for one reason alone: about two-thirds of
    all US search traffic goes through `Google`.[^(12)](#A978-1-4842-0259-3_8_Chapter.html#Fn12)
    If the goal is for visitors to easily find your website through a `Google` search,
    why not use the analytics tool the search giant provides?


    There are many things about `Google Analytics` that make its use so compelling.
    It’s free for anyone who wishes to use it, it’s easy to implement and use, it
    has great reporting features, and `Google` is constantly adding features that
    make it more valuable and extend its capabilities. It’s a must-have tool for any
    organization that considers its web presence important, because it reveals information
    about visitors, traffic, and content to which an organization would otherwise
    be blind. Here are some of the things a user of `Google Analytics` can learn:'
