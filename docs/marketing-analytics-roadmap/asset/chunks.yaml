- fmt: '回到办公室后，你召集团队讨论这个挑战。通常情况下，你的潜在客户培育工作包括通过电子邮件链接到登录页面，提供某种高级内容，例如白皮书或案例研究。你的团队因制作既引人入胜又具有视觉吸引力的内容而享有盛誉。然而，弱点一直在于让潜在客户访问登录页面以获取这些内容，这些内容被“封锁”在需要访问者提供联系信息的表单后面。


    你与团队一起回顾了几次以往电子邮件营销活动的结果。每次活动，你都有包含打开率、跳出率、点击率甚至哪些收件人打开了邮件的分析数据。在审查这些数据时，你确认了之前的想法是正确的：你的打开率一直很高。这得益于你为确保CRM和营销自动化系统中数据质量所做的努力。然而，这些分析还显示，点击率低于行业平均水平，并且正在下降。换句话说，你的促销邮件反馈很强，但点击邮件中链接到你创建的登录页面的收件人不够多。这令人担忧，但至少分析数据告诉了你问题所在。


    接下来，你与团队审查的是登录页面的网络分析数据。在这里，你发现了另一个问题。只有极少数花时间点击进入登录页面的邮件收件人会选择行动号召按钮，通常像“下载案例研究”或“立即注册”以及类似的行动号召。这些数据证实了你几个月来的直觉：你正在经历那些曾经行之有效的、经过验证的培育方法的性能下降。在此之前，你从未因预计收入缺口而产生更密切监控这些分析数据的紧迫感。


    当你和团队思考这些分析数据所揭示的问题时，大家讨论了如何以不同方式培育这285个潜在客户，希望能产生超过30%的转化率。如果你们能策划出一个达到35%转化率的活动，就将获得所需的100笔销售，从而产生50万美元的收入。这个算术很简单。关键问题是，采用什么方法才能实现这一目标？


    你团队中的一名成员最近一直在试验互动视频，对各种登录页面的配置进行A/B测试。互动视频是一种营销视频内容，其特色是内置于视频本身的行动号召链接。这些视频时长通常不超过两分钟，当视频结束时，会向观看者展示一个或多个行动号召按钮。与你通常使用登录页面的方式不同，团队测试了未被“封锁”的互动视频——换句话说，访问者不必先输入他们的联系信息。取而代之的是，在视频的结尾，其中一项行动号召允许观看者请求更多信息并与销售代表联系。


    提供未封锁的内容与你团队过去使用的方法有所不同。网络表单一直是你们活动登录页面的一部分，因为它们允许你为销售团队捕获潜在客户。然而，这种情况有所不同。你并非试图捕获新潜在客户，而是为已经拥有的潜在客户加速购买周期。来自互动视频测试的分析数据看起来非常有希望：访问者显然更喜欢视频，并且他们选择点击视频末尾的“联系我”按钮的比率是你以前对其他形式内容经验数据的两倍。你决定使用互动视频来构建一个营销活动。


    下一个重大的活动决策是确定视频将展示什么内容。视频营销的最佳实践表明，90秒或更短的视频最为成功。你再次与团队一起审查分析数据，以确定哪种类型的营销信息可能对处于购买阶段后期的合格潜在客户最有效。分析过去的营销活动，你发现那些以案例研究——一个关于客户实施你的解决方案并描述所获收益的真实故事——为特色的内容具有最强的转化率。基于现有数据，你安排团队着手制作一个90秒的互动案例研究视频。


    团队工作迅速，视频很快准备好投放。使用你的营销自动化系统，你准备了活动登录页面以及将发送给确定的那285个潜在客户的邮件。利用营销自动化系统中的分析数据，你确定了发送邮件的理想星期几和时间。


    由于你在营销团队中建立了数据驱动的文化，他们总是思考如何衡量所做的每一件事。这个活动视频在制作时就具备了追踪观看时长和分享次数的能力。此外，你的营销自动化系统与CRM系统完全集成，因此当合格潜在客户观看视频时，该活动会在两个系统中被记录。另外，当潜在客户看完整个视频时，一封电子邮件提醒会被发送给销售团队的某位成员。你的活动将实时跟踪并报告这些指标，使销售团队能够在潜在客户的行为表明其兴趣时迅速做出响应。


    你启动了营销活动。初始邮件发送后的头几天将告诉你策略是否有效，或者你是否需要制定一个B计划。邮件的打开率跟踪数据显示其处于正常范围，正如你所预期。然而，最令人鼓舞的是，指向活动登录页面的点击率略高于平均水平。更棒的是，登录页面上观看案例研究视频的行动号召表现远优于之前邀请访问者消费封锁内容的登录页面。到目前为止，策略运作得非常出色，但最终的活动指标——收入——仍然未知。


    是时候去查看销售副总裁那边的情况了。你顺道过去做个快速更新，发现销售部门一片沸腾！副总裁没什么时间聊天，但这是出于最好的原因。互动视频通过视频末尾嵌入的行动号召选项，引发了向销售团队咨询的热潮。案例研究视频显然引起了共鸣。副总裁分享说，许多潜在客户已经重新开始了销售对话，大意是“我们和视频中的客户有同样的问题——帮我们解决它”。销售团队正在预订演示，并与活动中定位的许多潜在客户进行高质量的互动。


    几周之内，季度收入预测被上调。销售副总裁报告说，预计到本季度末将额外完成105笔交易，抹平了预测的收入缺口。你与营销团队复盘了这次活动，回顾所有指标以确定下次如何改进策略。大家一致认为：当你向首席财务官申请更多资金以更大力投资视频营销时，鉴于这次活动的结果，获得批准不会有任何困难。


    正如上述场景所示，分析以多种方式影响着现代营销组织内部的决策，无论大小。这个场景只是展示了分析如何帮助驱动自信决策的一种方式，而这些决策的结果可以直接与收入挂钩。


