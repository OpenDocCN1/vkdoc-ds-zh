    # 4. The Marketing Analytics Process


    Lather, Rinse, Repeat


    > If you can’t describe what you are doing as a process, you don’t know what you’re
    doing. —W. Edwards Deming


    Businesses are very process driven. There are processes for sales, support, accounting,
    manufacturing, hiring, training, and virtually everything a business does. Even
    in our personal lives, we use processes constantly. Although we don’t give much
    thought to it, most of us probably shower the same way: lathering, rinsing and
    toweling off using the same sequence day after day. From the smallest tasks to
    the largest projects, processes are the way we get things done.


    Processes help us work efficiently and effectively. When we realize that a certain
    task or activity has an element of repetition to it, and when we’re trying to
    achieve consistent outcomes, we develop a process for it. Once a process that
    works is identified, we stick with it, making improvements as we use it. In some
    companies, these processes are quite formalized and intentionally managed to optimize
    performance. There may be designated process owners who constantly evaluate the
    performance of their processes, looking for ways to rid them of inefficiencies
    and help them perform better. In other cases, the processes are informal and no
    one pays much attention to them as long as they work. Either way, processes are
    how things get done inside organizations.


    Marketing is a macro process or system, consisting of many subprocesses. This
    view might seem to make marketing sound too machine-like, leaving creativity out
    of the picture. That’s not the intent of putting marketing in the context of process:
    the creative process is vital to marketing’s success, and it is capable of measurement,
    management, and improvement.


    So why all this talk about processes? Processes require management to perform
    at peak effectiveness. You can’t manage a process that you can’t measure, so measurements—analytics—are
    essentially to managing marketing and all the processes of which it consists.
    Marketing analytics itself is a core or foundational process within marketing.
    Let’s revisit the definition of marketing analytics first shared in [Chapter 1](../Text/A978-1-4842-0259-3_1_Chapter.html):


    > Marketing analytics is the process of identifying metrics that are valid indicators
    of marketing’s performance in pursuit of its objectives, tracking those metrics
    over time, and using the results to improve how marketing does it work.


    The marketing analytics process should serve as the performance interface to all
    other marketing processes. For everything that marketing does—email marketing,
    content marketing, lead generation, events marketing, pay-per-click advertising—there
    are ideally analytics associated with the processes. The marketing analytics process
    calls for identifying meaningful performance metrics for all marketing processes,
    tracking those metrics, analyzing them, and taking improvement actions based on
    the analysis.


    Note


    The marketing analytics process calls for identifying meaningful performance metrics
    for all marketing processes, tracking those metrics, analyzing them, and taking
    improvement actions based on the analysis.


    The analytics process sounds simple enough, but it is often grand in scope considering
    all the things that marketing does. Consider just some of the metrics associated
    with the email marketing process: open rate, bounce rate, click-through rate,
    unsubscribe rate, and conversion. These metrics are multiplied by the number of
    email messages sent by a marketing organization, and it’s easy to see how quickly
    the marketing team is swimming in data. For this reason, the marketing analytics
    process is not incidental to the work of marketing, but integral to it. The dashboard
    metaphor for analytics is accurate: analytics provide the performance information
    for marketing leaders to drive the marketing machine at peak efficiency, producing
    the best possible results.


    There’s an old joke about the instructions on a bottle of shampoo: lather, rinse,
    and repeat. If you follow those instructions literally, you would find yourself
    in an infinite process loop, until you ran out of shampoo. When it comes to marketing
    analytics, however, we want to interpret those instructions literally, making
    a continuous cycle of measure, analyze, and improve. There’s limited value in
    going through the process cycle only one time. Marketing analytics is most effective
    when there is the discipline to repeat the cycle continuously. The balance of
    this chapter will review the analytics process in greater detail.


    Note


    The marketing analytics process is a continuous cycle of measure, analyze and
    improve.'
