- fmt: "# Marketing Analytics\n\nWhat They Are and Why You Need Them\n\nImagine that\
    \ you’re driving your car down the highway. You know where you’re going, and you\
    \ have a general idea of which route to take, but you have no dashboard. You’re\
    \ completely ignorant of how fast you’re going, how much fuel is in the tank,\
    \ or even if the engine is overheating. If your “check engine” light is on to\
    \ indicate some sort of problem, you don’t know about it. If luck is on your side,\
    \ you can drive your car under these conditions to the end of your journey. But\
    \ continuing to operate your vehicle over time without the information the dashboard\
    \ provides is tempting fate. Eventually, a problem will occur that you can’t detect.\
    \ Without the dashboard, you’re blind to the performance of the vehicle. Ultimately,\
    \ driving this way will lead to consequences, some of them quite severe. You could\
    \ easily end up in the ditch on the side of the road.\n\nThis vehicle metaphor\
    \ applies to organizations and the analytics—their dashboards—that help them keep\
    \ their marketing engines running effectively. A properly implemented analytics\
    \ process helps a marketing organization avoid negative consequences. But analytics\
    \ aren’t just about keeping marketing out of the ditch; analytics help optimize\
    \ marketing’s performance. An analytics process, therefore, isn’t just about keeping\
    \ the marketing organization out of trouble but helping it perform at its highest\
    \ level.\n\n> **Note**  \n> The marketing analytics process isn’t just about keeping\
    \ the marketing organization out of trouble but helping it perform at its highest\
    \ level.\n\nFor most companies, analytics are at the heart of how the business\
    \ is managed. The finance department is perhaps most often associated with measurements\
    \ and analytics with which the entire organization is familiar: revenue, profit,\
    \ return on investment (ROI), return on equity (ROE), and many others. Manufacturing\
    \ tracks metrics like output and defects. Human resources will measure employee\
    \ retention and performance. Every department or division in a company uses analytics\
    \ to make sure there is alignment with and progress toward goals. The outlier\
    \ has often been marketing. Even today, 14 percent of marketing organizations\
    \ don’t have an analytics process,[¹](#A978-1-4842-0259-3_1_Chapter.html#Fn1)\
    \ a reflection of marketing’s historical reluctance toward analytics.\n\nThis\
    \ book explores marketing’s attitude toward analytics, the challenges of implementing\
    \ an analytics process, insights for embracing analytics in a meaningful way,\
    \ and tools for getting the answers you need on the performance of your marketing\
    \ program.\n\n## Marketing Analytics Defined\n\nThe generic understanding of analytics\
    \ is that they are measurements or numbers that indicate how a process is performing.\
    \ This definition certainly holds true for marketing analytics, yet a deeper understanding\
    \ of analytics helps marketing organizations take full advantage of what the process\
    \ can do to drive better performance. To that end, here is my definition:\n\n\
    Marketing analytics is the process of identifying metrics that are valid indicators\
    \ of marketing’s performance in pursuit of its objectives, tracking those metrics\
    \ over time, and using the results to improve how marketing does it work.\n\n\
    The core components of this definition are worth examining more closely:\n\n-\
    \ **Valid indicators**: There are many things about marketing’s work and results\
    \ that are measurable. Not all of them, however, are true indicators of performance.\
    \ The analytics process must determine which metrics have meaning and best represent\
    \ the value that marketing creates for the organization.\n- **Pursuit of objectives**:\
    \ The analytics process is ideally built to measure progress toward a set of objectives,\
    \ a notion more fully explored in [Chapter 5](../Text/A978-1-4842-0259-3_5_Chapter.html).\
    \ The objectives come first, followed by an identification of the relevant performance\
    \ metrics.\n- **Tracking metrics over time**: The analytics process isn’t about\
    \ taking a random, one-time snapshot of a performance measurement, but tracking\
    \ measurements over time to monitor trends and direction of performance.\n- **Improve\
    \ how marketing works**: There are several reasons a marketing organization might\
    \ implement an analytics process, such as accountability or justification of resources,\
    \ but the noblest and ultimately most valuable reason is to improve its performance.\n\
    \nThis book refers to analytics and metrics, often interchangeably. These terms\
    \ have similar meanings. Analytics are both the process and the collective output\
    \ of that process—performance information with the ideal use as a management tool.\
    \ Metrics are the “atomic unit” of analytics. The marketing analytics process\
    \ consists of creating a series of metrics or measurements in specific areas.\n\
    \nAs the definition for marketing analytics implies, it isn’t just a set of numbers.\
    \ Instead, it is a process that has these primary components:\n\n- **People**:\
    \ The marketing analytics process is created, executed, and managed by people\
    \ who own it. In most marketing organizations, the process owner is the chief\
    \ marketing officer (CMO) or the marketing director.\n- **Steps**: The marketing\
    \ analytics process consists of a sequence of steps. The steps that make up the\
    \ marketing analytics process are described in [Chapter 4](../Text/A978-1-4842-0259-3_4_Chapter.html).\n\
    - **Tools and technology**: While the marketing analytics process isn’t necessarily\
    \ complex, tools and technology help marketing organizations deliver greater value\
    \ faster than they ordinarily might. [Chapter 8](../Text/A978-1-4842-0259-3_8_Chapter.html)\
    \ discusses the tools and technology in greater detail.\n- **Input and output**:\
    \ Data feeds the process, with insights and decisions as the output of the process.\n\
    \nLike many processes, marketing analytics should have a definite beginning but\
    \ no ending—it is a process that, once initiated, should continue indefinitely.\n\
    \nThis discussion of marketing analytics has so far been conceptual. To provide\
    \ greater clarity into how a marketing analytics process affects an organization,\
    \ we will consider three scenarios of marketing organizations: one without an\
    \ analytics process, one with a “pseudo” analytics process, and one with a real\
    \ analytics process that is effective. As we examine these three organizations,\
    \ we’ll look at the differences in how each is led, gets funding, operates, and\
    \ makes decisions."
  raw: '# 1. Marketing Analytics


    What They Are and Why You Need Them


    Imagine that you’re driving your car down the highway. You know where you’re going,
    and you have a general idea of which route to take, but you have no dashboard.
    You’re completely ignorant of how fast you’re going, how much fuel is in the tank,
    or even if the engine is overheating. If your “check engine” light is on to indicate
    some sort of problem, you don’t know about it. If luck is on your side, you can
    drive your car under these conditions to the end of your journey. But continuing
    to operate your vehicle over time without the information the dashboard provides
    is tempting fate. Eventually, a problem will occur that you can’t detect. Without
    the dashboard, you’re blind to the performance of the vehicle. Ultimately, driving
    this way will lead to consequences, some of them quite severe. You could easily
    end up in the ditch on the side of the road.


    This vehicle metaphor applies to organizations and the analytics—their dashboards—that
    help them keep their marketing engines running effectively. A properly implemented
    analytics process helps a marketing organization avoid negative consequences.
    But analytics aren’t just about keeping marketing out of the ditch; analytics
    help optimize marketing’s performance. An analytics process, therefore, isn’t
    just about keeping the marketing organization out of trouble but helping it perform
    at its highest level.


    Note


    The marketing analytics process isn’t just about keeping the marketing organization
    out of trouble but helping it perform at its highest level.


    For most companies, analytics are at the heart of how the business is managed.
    The finance department is perhaps most often associated with measurements and
    analytics with which the entire organization is familiar: revenue, profit, return
    on investment (ROI), return on equity (ROE), and many others. Manufacturing tracks
    metrics like output and defects. Human resources will measure employee retention
    and performance. Every department or division in a company uses analytics to make
    sure there is alignment with and progress toward goals. The outlier has often
    been marketing. Even today, 14 percent of marketing organizations don’t have an
    analytics process,[¹](#A978-1-4842-0259-3_1_Chapter.html#Fn1) a reflection of
    marketing’s historical reluctance toward analytics.


    This book explores marketing’s attitude toward analytics, the challenges of implementing
    an analytics process, insights for embracing analytics in a meaningful way, and
    tools for getting the answers you need on the performance of your marketing program.


    ## Marketing Analytics Defined


    The generic understanding of analytics is that they are measurements or numbers
    that indicate how a process is performing. This definition certainly holds true
    for marketing analytics, yet a deeper understanding of analytics helps marketing
    organizations take full advantage of what the process can do to drive better performance.
    To that end, here is my definition:


    Marketing analytics is the process of identifying metrics that are valid indicators
    of marketing’s performance in pursuit of its objectives, tracking those metrics
    over time, and using the results to improve how marketing does it work.


    The core components of this definition are worth examining more closely:


    *   Valid indicators: There are many things about marketing’s work and results
    that are measurable. Not all of them, however, are true indicators of performance.
    The analytics process must determine which metrics have meaning and best represent
    the value that marketing creates for the organization.

    *   Pursuit of objectives: The analytics process is ideally built to measure progress
    toward a set of objectives, a notion more fully explored in [Chapter 5](../Text/A978-1-4842-0259-3_5_Chapter.html).
    The objectives come first, followed by an identification of the relevant performance
    metrics.

    *   Tracking metrics over time: The analytics process isn’t about taking a random,
    one-time snapshot of a performance measurement, but tracking measurements over
    time to monitor trends and direction of performance.

    *   Improve how marketing works: There are several reasons a marketing organization
    might implement an analytics process, such as accountability or justification
    of resources, but the noblest and ultimately most valuable reason is to improve
    its performance.


    This book refers to analytics and metrics, often interchangeably. These terms
    have similar meanings. Analytics are both the process and the collective output
    of that process—performance information with the ideal use as a management tool.
    Metrics are the “atomic unit” of analytics. The marketing analytics process consists
    of creating a series of metrics or measurements in specific areas.


    As the definition for marketing analytics implies, it isn’t just a set of numbers.
    Instead, it is a process that has these primary components:


    People: The marketing analytics process is created, executed, and managed by people
    who own it. In most marketing organizations, the process owner is the chief marketing
    officer (CMO) or the marketing director. Steps: The marketing analytics process
    consists of a sequence of steps. The steps that make up the marketing analytics
    process are described in [Chapter 4](../Text/A978-1-4842-0259-3_4_Chapter.html).
    Tools and technology: While the marketing analytics process isn’t necessarily
    complex, tools and technology help marketing organizations deliver greater value
    faster than they ordinarily might. [Chapter 8](../Text/A978-1-4842-0259-3_8_Chapter.html)
    discusses the tools and technology in greater detail. Input and output: Data feeds
    the process, with insights and decisions as the output of the process.


    Like many processes, marketing analytics should have a definite beginning but
    no ending—it is a process that, once initiated, should continue indefinitely.


    This discussion of marketing analytics has so far been conceptual. To provider
    greater clarity into how a marketing analytics process affects an organization,
    we will consider three scenarios of marketing organizations: one without an analytics
    process, one with a “pseudo” analytics process, and one with a real analytics
    process that is effective. As we examine these three organizations, we’ll look
    at the differences in how each is led, gets funding, operates, and makes decisions.'
  trans: "\n# 营销分析学\n\n它是什么，以及你为何需要它\n\n想象一下，你正驾车行驶在高速公路上。你知道自己的目的地，也大致清楚该走哪条路线，但你的车上没有仪表盘。你完全不知道自己开得多快、油箱里还有多少油，甚至不知道引擎是否过热。如果“检查引擎”灯亮起，提示某些问题，你对此也毫不知情。如果运气站在你这边，你或许能在这种情况下把车开到旅程终点。但长期在没有仪表盘提供信息的情况下继续驾驶，无异于在挑战命运。最终，一个你无法察觉的问题总会发生。没有仪表盘，你对车辆的性能表现一无所知。最终，这样开车会导致后果，有些甚至相当严重。你很可能轻易就冲到路边的沟里。\n\
    \n这个关于车辆的比喻同样适用于各类组织及其分析系统——也就是它们的仪表盘——这些系统能帮助组织维持营销引擎的高效运转。一个恰当实施的分析流程能帮助营销组织避免负面后果。但分析的目的不仅仅是让营销活动不“掉进沟里”；分析还能优化营销表现。因此，一个分析流程不仅是为了让营销组织“不惹麻烦”，更是为了帮助其以最高水平运转。\n\
    \n> **注**  \n> 营销分析流程不仅是为了让营销组织不惹麻烦，更是为了帮助其以最高水平运转。\n\n对大多数公司而言，分析是业务管理的核心。财务部门或许最常与整个组织都熟悉的衡量指标和分析方法相关联：收入、利润、投资回报率（ROI）、净资产收益率（ROE）等等。制造部门会追踪产量和缺陷率等指标。人力资源部门会衡量员工留存率和绩效。公司里的每个部门或分部都会运用分析来确保工作与目标一致并朝着目标推进。而营销部门常常是个例外。即使在今天，仍有\
    \ 14%的营销组织没有建立分析流程，¹这反映了营销部门历史上对分析的抵触态度。\n\n本书将探讨营销部门对分析的态度、实施分析流程面临的挑战、以有意义的方式拥抱分析的见解，以及获取所需信息以了解营销方案表现的工具。\n\
    \n## 营销分析学定义\n\n对分析的一般理解是，它们是表明某个流程表现如何的衡量指标或数字。这个定义当然也适用于营销分析，然而，对分析更深入的理解能帮助营销组织充分利用分析流程所能带来的好处，以驱动更好的表现。为此，我给出以下定义：\n\
    \n营销分析是一个过程，包括识别能够有效反映营销在追求目标过程中表现如何的指标，长期追踪这些指标，并利用结果来改进营销工作的方式。\n\n这个定义的核心组成部分值得更仔细地审视：\n\
    \n- **有效指标**：营销的工作和结果中有许多方面是可衡量的。然而，并非所有可衡量方面都是表现的真实指标。分析流程必须确定哪些指标具有意义，并能最好地代表营销为组织创造的价值。\n\
    - **追求目标**：理想情况下，分析流程是为了衡量朝着系列目标的进展情况而建立的，这一概念将在第 5 章中更全面地探讨。目标先行，然后才是确定相关的绩效指标。\n\
    - **长期追踪指标**：分析流程并非对绩效指标进行一次随机的、一次性的快照式测量，而是长期追踪测量结果，以监控绩效的趋势和方向。\n- **改进营销工作方式**：营销组织实施分析流程可能出于多种原因，例如为了问责或证明资源使用的合理性，但最高尚且最终最有价值的原因是为了改进其绩效。\n\
    \n本书中会交替使用“分析”和“指标”这两个词。这些术语含义相近。分析既指代流程本身，也指代该流程的集体产出——即以作为管理工具为理想用途的绩效信息。指标是分析的“原子单位”。营销分析流程包含在特定领域创建一系列指标或衡量标准。\n\
    \n正如营销分析学的定义所示，它不仅仅是一组数字。相反，它是一个包含以下主要组成部分的流程：\n\n- **人员**：营销分析流程由拥有它的相关人员创建、执行和管理。在大多数营销组织中，流程负责人是首席营销官（CMO）或营销总监。\n\
    - **步骤**：营销分析流程包含一系列步骤。构成营销分析流程的步骤将在第 4 章中描述。\n- **工具与技术**：虽然营销分析流程未必复杂，但工具和技术能帮助营销组织比通常更快地交付更大的价值。第\
    \ 8 章将更详细地讨论工具和技术。\n- **输入与输出**：数据是流程的输入，而洞察和决策则是流程的输出。\n\n像许多流程一样，营销分析应该有明确的起点，但没有终点——它是一个一旦启动就应无限期持续下去的流程。\n\
    \n到目前为止，对营销分析的讨论都是概念性的。为了更清晰地说明营销分析流程如何影响一个组织，我们将考虑三种营销组织的情景：一种是没有分析流程的，一种是有“伪”分析流程的，还有一种是有真正有效的分析流程的。在考察这三个组织时，我们将关注它们在领导方式、获取资金的方式、运营方式以及决策方式上的差异。\n"
- fmt: "## No Analytics Process: Flying Blind\n\nThe first type of marketing organization\
    \ we examine is the one that has no analytics process. In their metaphorical marketing\
    \ vehicle, they have no dashboard at all. The CMO plots the organization’s course\
    \ and pilots its way by instinct. Determining the success of marketing is completely\
    \ subjective, and often quite political. For this reason, CMOs who choose to fly\
    \ blind with respect to analytics are often adept at playing organizational politics.\
    \ Survival depends on their ability to stay in the good graces of the CEO.\n\n\
    It’s easy to assume that such an organization would have no marketing success,\
    \ but that isn’t the case. Despite the lack of an analytics process, these marketing\
    \ organizations can have some impressive (albeit intermittent) successes. The\
    \ problem is one of consistency. When these organizations succeed, it’s difficult\
    \ for them to understand why, because marketing is essentially an experiment with\
    \ no control variables. “We were lucky” is often the marketing department’s internal\
    \ response to success. Conversely, when marketing fails to produce results, it’s\
    \ equally difficult to explain the failure.\n\nA common leadership scenario for\
    \ these marketing organizations is for a new CMO to succeed one who was fired\
    \ for failing to produce results. A problem, of course, is that since no analytics\
    \ are in place, conclusions about results—or the lack thereof—is completely subjective.\
    \ The CEO can simply conclude that the CMO is not performing. This seems terribly\
    \ unfair to such CMOs, but if they have not implemented a set of marketing performance\
    \ metrics, they have by default placed themselves on this slippery subjective\
    \ slope.\n\nThe new, replacement CMO in these organizations typically has a tenure\
    \ of about 18 months. The first six months are the honeymoon period, a time for\
    \ the CMO to assess what’s been done and determine what needs to happen. The new\
    \ CMO understands that business as usual will not create success, so it’s a time\
    \ of change. During this period, the CMO will have the greatest creative latitude,\
    \ because there’s a general understanding throughout the organization that the\
    \ old methods no longer work. The leadership style of the CMO in this situation\
    \ is typically an amalgam of intuition, creativity, and past experience.\n\nThe\
    \ second six months in the new CMO’s tenure are spent implementing the new marketing\
    \ agenda. The marketing team goes into execution mode with great expectations\
    \ of success. This marketing organization does not use metrics or analytics to\
    \ guide decision making or measure success, so how can it know if it achieves\
    \ its goals? That determination remains subjective, but everyone in the organization\
    \ will develop some intuitive feeling or use their own subjective measures to\
    \ determine if marketing is succeeding.\n\nThe third six-month period in the tenure\
    \ of a new CMO is the results phase. It’s the start of the second year of service,\
    \ and by this time, the honeymoon is generally over. The general consensus is\
    \ that results are due. Quite often there are favorable business results, but\
    \ are they attributable to the work of marketing? This is a rhetorical question,\
    \ because measurements don’t exist to support any credit marketing might take\
    \ in producing favorable outcomes. When business is good, marketing usually gets\
    \ a free pass on having to prove its contribution. The CMO can reasonably expect\
    \ to remain employed for another 6–12 months.\n\nWhen business is bad, however,\
    \ the lack of evidence for marketing’s results is usually career-ending for the\
    \ CMO. It’s entirely possible that the CMO’s marketing agenda was highly effective\
    \ and prevented the company from even worse performance. But there is no solid\
    \ ground on which marketing can stand to make that argument, and marketing has\
    \ historically been a convenient scapegoat. Whether marketing is truly to blame\
    \ is a moot point. The fate of the CMO and the future of the marketing team comes\
    \ down to the subjectivity of the CEO, how persuasive the CMO is, and how many\
    \ political allies he or she has. If the ax falls, a new CMO will come in and\
    \ the cycle begins again.\n\nMarketing organizations that operate in an analytics\
    \ vacuum usually ride a funding rollercoaster. A new CMO gets the benefit of the\
    \ doubt and finds a greater willingness to make a larger investment in marketing.\
    \ But for most of these marketing organizations, the funding process is a grind.\
    \ The annual budget battle for marketing funding is psychological warfare, since\
    \ performance data doesn’t exist to create a business case for what marketing\
    \ wants to do. Success securing the funding depends on the charisma, persuasiveness,\
    \ and political alliances of the CMO. Usually, marketing has to settle for incremental\
    \ increases in funding and resources, and then only in good years. If marketing\
    \ wants to do something ambitious outside the status quo, the funding approval\
    \ process can be a political gauntlet.\n\nFrom an operational perspective, marketing\
    \ organizations that eschew analytics tend to function without the benefit of\
    \ a strategic plan. It’s not that they are directionless, but formal marketing\
    \ planning yields plans that have measurements attached to their objectives. In\
    \ this scenario, there’s a plan, but it is based on intuition and is very fluid.\
    \ It also exists primarily in the head of the CMO, which means the rest of the\
    \ company doesn’t have great insights into what marketing is up to.\n\nThis lack\
    \ of clarity about the marketing plan has a long-term damaging effect on the marketing\
    \ team. The absence of a codified marketing plan that is understood throughout\
    \ the company makes it difficult for the marketing team to say “no” to the many\
    \ internal, ad hoc requests that all marketing organizations get. Saying “no”\
    \ to a marketing request—even one that the marketing team knows is silly—costs\
    \ political capital. When no analytics process exists to prove its value, marketing\
    \ needs all the friends it can get in the organization. This creates a reluctance\
    \ for marketing to say “no” even when the team knows it should. When the rest\
    \ of the organization becomes conditioned to getting what it wants from marketing,\
    \ the team gets very busy—too busy, in fact. It is perceived as the part of the\
    \ company with “its hair on fire.”\n\n> **Note**  \n> A marketing organization\
    \ that relies on political capital to execute its program rather than analytics\
    \ ends up saying “yes” to requests that have dubious merit. Then, when such efforts\
    \ fail, marketing gets the blame, hastening the day that marketing executives\
    \ are shown the door.\n\nThis operational pattern demonstrates the value of having\
    \ an analytics-based marketing plan. When such a plan is in place, it’s easy to\
    \ refer to it as the reason for denying resources to these ad hoc requests that\
    \ come from all corners of the company. Marketing can comfortably say “no,” because\
    \ there’s a bigger, more important commitment: the marketing plan, which represents\
    \ a success blueprint. Any requests that are inconsistent with the plan represent\
    \ harmful distractions, to which the CMO and marketing team can say “no” with\
    \ authority. But when no plan exists, as is often the case for these kinds of\
    \ organizations, saying “no” comes across as arbitrary to those who request the\
    \ team’s services and resources.\n\nThese marketing organizations are firmly on\
    \ the intuition side of the decision-making fence. This means that virtually every\
    \ decision has a significant degree of uncertainty associated with it. In fairness,\
    \ even organizations that have an effective analytics process can’t remove all\
    \ uncertainty from their decisions. Even though having no analytics process means\
    \ that decisions are essentially educated guesses, these organizations have a\
    \ lot of conviction about the guesses they make."
  raw: '## No Analytics Process: Flying Blind


    The first type of marketing organization we examine is the one that has no analytics
    process. In their metaphorical marketing vehicle, they have no dashboard at all.
    The CMO plots the organization’s course and pilots its way by instinct. Determining
    the success of marketing is completely subjective, and often quite political.
    For this reason, CMOs who choose to fly blind with respect to analytics are often
    adept at playing organizational politics. Survival depends on their ability to
    stay in the good graces of the CEO.


    It’s easy to assume that such an organization would have no marketing success,
    but that isn’t the case. Despite the lack of an analytics process, these marketing
    organizations can have some impressive (albeit intermittent) successes. The problem
    is one of consistency. When these organizations succeed, it’s difficult for them
    to understand why, because marketing is essentially an experiment with no control
    variables. “We were lucky” is often the marketing department’s internal response
    to success. Conversely, when marketing fails to produce results, it’s equally
    difficult to explain the failure.


    A common leadership scenario for these marketing organizations is for a new CMO
    to succeed one who was fired for failing to produce results. A problem, of course,
    is that since no analytics are in place, conclusions about results—or the lack
    thereof—is completely subjective. The CEO can simply conclude that the CMO is
    not performing. This seems terribly unfair to such CMOs, but if they have not
    implemented a set of marketing performance metrics, they have by default placed
    themselves on this slippery subjective slope.


    The new, replacement CMO in these organizations typically has a tenure of about
    18 months. The first six months are the honeymoon period, a time for the CMO to
    assess what’s been done and determine what needs to happen. The new CMO understands
    that business as usual will not create success, so it’s a time of change. During
    this period, the CMO will have the greatest creative latitude, because there’s
    a general understanding throughout the organization that the old methods no longer
    work. The leadership style of the CMO in this situation is typically an amalgam
    of intuition, creativity, and past experience.


    The second six months in the new CMO’s tenure are spent implementing the new marketing
    agenda. The marketing team goes into execution mode with great expectations of
    success. This marketing organization does not use metrics or analytics to guide
    decision making or measure success, so how can it know if it achieves its goals?
    That determination remains subjective, but everyone in the organization will develop
    some intuitive feeling or use their own subjective measures to determine if marketing
    is succeeding.


    The third six-month period in the tenure of a new CMO is the results phase. It’s
    the start of the second year of service, and by this time, the honeymoon is generally
    over. The general consensus is that results are due. Quite often there are favorable
    business results, but are they attributable to the work of marketing? This is
    a rhetorical question, because measurements don’t exist to support any credit
    marketing might take in producing favorable outcomes. When business is good, marketing
    usually gets a free pass on having to prove its contribution. The CMO can reasonably
    expect to remain employed for another 6–12 months.


    When business is bad, however, the lack of evidence for marketing’s results is
    usually career-ending for the CMO. It’s entirely possible that the CMO’s marketing
    agenda was highly effective and prevented the company from even worse performance.
    But there is no solid ground on which marketing can stand to make that argument,
    and marketing has historically been a convenient scapegoat. Whether marketing
    is truly to blame is a moot point. The fate of the CMO and the future of the marketing
    team comes down to the subjectivity of the CEO, how persuasive the CMO is, and
    how many political allies he or she has. If the ax falls, a new CMO will come
    in and the cycle begins again.


    Marketing organizations that operate in an analytics vacuum usually ride a funding
    rollercoaster. A new CMO gets the benefit of the doubt and finds a greater willingness
    to make a larger investment in marketing. But for most of these marketing organizations,
    the funding process is a grind. The annual budget battle for marketing funding
    is psychological warfare, since performance data doesn’t exist to create a business
    case for what marketing wants to do. Success securing the funding depends on the
    charisma, persuasiveness, and political alliances of the CMO. Usually, marketing
    has to settle for incremental increases in funding and resources, and then only
    in good years. If marketing wants to do something ambitious outside the status
    quo, the funding approval process can be a political gauntlet.


    From an operational perspective, marketing organizations that eschew analytics
    tend to function without the benefit of a strategic plan. It’s not that they are
    directionless, but formal marketing planning yields plans that have measurements
    attached to their objectives. In this scenario, there’s a plan, but it is based
    on intuition and is very fluid. It also exists primarily in the head of the CMO,
    which means the rest of the company doesn’t have great insights into what marketing
    is up to.


    This lack of clarity about the marketing plan has a long-term damaging effect
    on the marketing team. The absence of a codified marketing plan that is understood
    throughout the company makes it difficult for the marketing team to say “no” to
    the many internal, ad hoc requests that all marketing organizations get. Saying
    “no” to a marketing request—even one that the marketing team knows is silly—costs
    political capital. When no analytics process exists to prove its value, marketing
    needs all the friends it can get in the organization. This creates a reluctance
    for marketing to say “no” even when the team knows it should. When the rest of
    the organization becomes conditioned to getting what it wants from marketing,
    the team gets very busy—too busy, in fact. It is perceived as the part of the
    company with “its hair on fire.”


    Note


    A marketing organization that relies on political capital to execute its program
    rather than analytics ends up saying “yes” to requests that have dubious merit.
    Then, when such efforts fail, marketing gets the blame, hastening the day that
    marketing executives are shown the door.


    This operational pattern demonstrates the value of having an analytics-based marketing
    plan. When such a plan is in place, it’s easy to refer to it as the reason for
    denying resources to these ad hoc requests that come from all corners of the company.
    Marketing can comfortably say “no,” because there’s a bigger, more important commitment:
    the marketing plan, which represents a success blueprint. Any requests that are
    inconsistent with the plan represent harmful distractions, to which the CMO and
    marketing team can say “no” with authority. But when no plan exists, as is often
    the case for these kinds of organizations, saying “no” comes across as arbitrary
    to those who request the team’s services and resources.


    These marketing organizations are firmly on the intuition side of the decision-making
    fence. This means that virtually every decision has a significant degree of uncertainty
    associated with it. In fairness, even organizations that have an effective analytics
    process can’t remove all uncertainty from their decisions. Even though having
    no analytics process means that decisions are essentially educated guesses, these
    organizations have a lot of conviction about the guesses they make.'
  trans: "\n## 缺乏分析流程：盲目飞行\n\n我们首先要考察的第一类营销组织，是那些没有分析流程的。打个比方，如果营销组织是辆车，那么它们连仪表盘都没有。首席营销官（CMO）凭直觉规划组织的路线并掌舵。衡量营销成功与否完全是主观的，而且常常充满政治色彩。因此，选择在分析方面“盲目飞行”的\
    \ CMO，往往精于组织内部的政治博弈。他们的生存依赖于与 CEO 保持良好关系的能力。\n\n人们很容易认为，这样的组织不可能取得营销成功，但事实并非如此。尽管缺乏分析流程，这些营销组织仍能取得一些令人印象深刻（尽管是间歇性的）的成功。问题在于持续性。当这些组织成功时，他们很难理解成功的原因，因为营销本质上是一场没有控制变量的实验。“我们运气好”通常是营销部门对成功的内部回应。反之，当营销未能产生成果时，同样难以解释失败的原因。\n\
    \n这类营销组织常见的一个领导层更替场景是：新任 CMO 接替因未能产生成果而被解雇的前任。当然，问题在于，既然没有分析流程，那么对成果——或者说成果的缺失——得出的结论就完全是主观的。CEO\
    \ 可以简单地断定这位 CMO 表现不佳。这对那些 CMO 来说似乎极不公平，但如果他们没有实施一套营销绩效衡量标准，那就等于默认将自己置于这个主观的滑坡之上。\n\
    \n在这类组织中，接替上任的新任 CMO 任期通常约为 18 个月。最初六个月是蜜月期，CMO 可以评估已完成的工作，并确定需要做什么。新任 CMO 明白，按部就班无法创造成功，因此这是一个变革的时期。在此期间，CMO\
    \ 将拥有最大的创意自由度，因为整个组织普遍认为旧的方法已经行不通了。在这种情况下，CMO 的领导风格通常是直觉、创造力和过往经验的结合体。\n\n新任 CMO\
    \ 任期的第二个六个月用于实施新的营销议程。营销团队怀着对成功的极大期望进入执行模式。这个营销组织不使用指标或分析来指导决策或衡量成功，那么它如何知道自己是否实现了目标呢？这种判断仍然是主观的，但组织中的每个人都会形成一些直觉感受，或使用自己的主观标准来判断营销是否成功。\n\
    \n新任 CMO 任期的第三个六个月是成果阶段。这是任职第二年的开始，此时蜜月期通常已经结束。普遍的共识是，该出成果了。很多时候，业务成果是喜人的，但这些成果能归功于营销工作吗？这是一个毋需回答的问题，因为没有任何衡量标准来支持营销部门可能为取得良好成果所做的贡献。当业务表现良好时，营销部门通常可以免于证明其贡献。CMO\
    \ 有理由相信自己还能再保住 6-12 个月的饭碗。\n\n然而，当业务表现不佳时，缺乏证据证明营销成果通常意味着 CMO 职业生涯的终结。完全有可能的是，这位\
    \ CMO 的营销议程非常有效，阻止了公司业绩进一步恶化。但营销部门没有坚实的依据来提出这一论点，而且营销历来是一个方便的替罪羊。营销是否真的该受责备已无关紧要。CMO\
    \ 的命运和营销团队的未来，最终取决于 CEO 的主观判断、CMO 的说服力，以及他/她拥有多少政治盟友。如果铡刀落下，新任 CMO 就会上任，然后循环再次开始。\n\
    \n在没有分析流程环境下运作的营销组织，其资金投入通常如同坐过山车。新任 CMO 会得到信任，并发现公司更愿意对营销进行更大规模的投资。但对于大多数此类营销组织而言，资金审批过程是一场磨人的战斗。每年为营销资金进行的预算争夺战是心理战，因为没有绩效数据来为营销部门的计划建立商业案例。能否成功获得资金，取决于\
    \ CMO 的魅力、说服力以及政治联盟。通常，营销部门只能争取到资金和资源的渐进式增长，而且只有在好年景才能如此。如果营销部门想在现状之外做一些雄心勃勃的事情，资金审批过程可能会是一场政治考验。\n\
    \n从运营的角度看，摒弃分析的营销组织往往在没有战略规划的情况下运作。这并不是说它们没有方向，而是正规的营销规划会制定出带有目标衡量标准的计划。在这种情况下，是有计划的，但它是基于直觉的，而且非常灵活。这个计划主要存在于\
    \ CMO 的头脑中，这意味着公司其他部门对营销部门的动向了解甚少。\n\n这种营销计划缺乏透明度的情况，会对营销团队造成长期的破坏性影响。缺少一个在公司内部被广泛理解的、成文的营销计划，使得营销团队很难对所有营销组织都会收到的、来自公司内部的无数临时请求说“不”。对营销请求说“不”——哪怕这个请求营销团队知道很荒谬——也会消耗政治资本。当没有分析流程来证明其价值时，营销部门需要在组织内部广结善缘。这导致营销部门即使知道应该拒绝时也不愿意说“不”。当公司其他部门习惯于有求必应时，营销团队就会变得非常忙碌——事实上是过于忙碌。它会被视为公司里“焦头烂额”的部门。\n\
    \n> **注意**  \n> 一个依赖政治资本而非分析来执行其计划的营销组织，最终会对那些价值可疑的请求说“是”。然后，当这些努力失败时，营销部门就会受到指责，从而加速营销高管被扫地出门之日的到来。\n\
    \n这种运作模式证明了基于分析的营销计划的价值。当这样的计划到位时，很容易将其作为拒绝公司各部门提出的那些临时资源请求的理由。营销部门可以放心地说“不”，因为还有更重要、更具优先级的承诺：营销计划，它代表着一份成功蓝图。任何与计划不符的请求都是有害的干扰，CMO\
    \ 和营销团队可以权威地对其说“不”。但是，当没有计划时（这在这些类型的组织中很常见），对那些提出服务或资源请求的人来说，说“不”就显得很武断。\n\n这些营销组织坚定地站在决策围墙的直觉这一边。这意味着几乎每一个决策都伴随着很大程度的不确定性。公平地说，即使是拥有高效分析流程的组织，也无法消除其决策中的所有不确定性。尽管没有分析流程意味着决策基本上都是基于经验的有根据的猜测，但这些组织对自己所做的猜测却充满信心。\n"
- fmt: '## A Pseudo-Analytical Marketing Program: Half the Gauges Are Dark


    The next type of marketing organization we examine is one that has a pseudo-analytics
    process in place. In the metaphorical vehicle that is conveying this marketing
    team, there is a dashboard, but some of the gauges aren’t working or are simply
    ignored. The other possibility is that the marketing team doesn’t know how to
    read the gauges and understand what they mean. In many ways, this marketing team
    resembles the story of the Emperor’s New Clothes. Because they have some numbers
    related to marketing, they feel clothed, but many in the company recognize their
    nakedness.


    As with the marketing organizations that are flying blind, these pseudo-analytical
    organizations can produce success. The difference is that these organizations
    attempt to use metrics as part of its marketing process. Some numbers related
    to what marketing is doing are leveraged, often with a high degree of devotion.
    The flaw in their approach, however, is that the numbers aren’t true indicators
    to marketing’s performance. There is no clear connection between the metrics,
    which reflect some marketing activity, and business results. The simple fact is
    that some metrics are in use that can actually create a false sense of accomplishment.
    The marketing team understands that it should have some metrics that define its
    performance. So it feels good about having some, but the pseudo-analytics process
    it uses doesn’t produce metrics that have real meaning or offer strategic insights
    to the team.


    There are two common leadership scenarios in marketing organizations using pseudo-analytics.
    A leader who knows analytics are important but just doesn’t understand how to
    define meaningful performance metrics represents the first scenario. A lack of
    experience, skills, time, or mentoring prevents this CMO from understanding how
    to use analytics as a performance gauge and gain insights for improving marketing’s
    effectiveness. What tends to happen is that this leader latches onto whatever
    analytics are easily available. A range of interesting analytics are often forged
    into some kind of dashboard, often including things like:


    - Productivity measures: projects completed, ads designed, meetings held, and
    so on.

    - Marketing measures: web analytics (e.g., page views, unique visits), social
    media follows, direct mailers sent, and so on.

    - Internal client satisfaction: some measure of how well the marketing team is
    serving the organization, often a measure of responsiveness.


    These metrics are very activities-centric, but they don’t provide much insight
    into how marketing is actually contributing to achieving the organization’s revenue
    goals. The executives who are recipients of this organization’s analytics dashboard
    may nod and smile while reviewing them, but they have unexpressed frustration
    about what the metrics truly mean. In the boardroom where conversations are about
    revenue, earnings, ROI, EBITDA, and other key financial metrics, no one, yet alone
    this marketing leader, knows how to connect the marketing team’s activities to
    business results.


    The other leadership scenario seems more nefarious, involving a marketing leader
    who uses analytics as a smokescreen. This CMO understands that the organization
    expects marketing to use analytics, so he or she does, throwing up a smokescreen
    of metrics that obscure what marketing is really doing. As with the first leadership
    scenario, the analytics process in use by this CMO also employs metrics that don’t
    really connect marketing activities to business results. If there is a difference
    in this leadership scenario and the first one, its that sometimes analytics are
    reverse-engineered to help justify the CMO’s predetermined course of action. They
    simply provide cover for the CMO.


    This second leadership scenario does seem like the product of a scheming CMO,
    but it’s rarely the result of some evil plot. Instead, it’s a product of fear—a
    fear of having analytics that reveal marketing’s failure to perform. This fear
    is fueled by an insecurity—that he or she can’t risk having metrics show that
    marketing doesn’t work or doesn’t know what it’s doing. This fear is legitimate,
    and anyone who has been part of the marketing community long enough can probably
    recount a story or two about how analytics were used punitively against the marketing
    organization. In these situations, analytics aren’t the problem; the culture is
    to blame.


    With either leadership scenario, the pseudo-analytics process creates opaqueness,
    and the CMO is content with that outcome. Since no one outside of marketing can
    really understand what the analytics coming out of marketing mean, they have to
    go to the CMO for interpretation. The explanation these inquiries produce sound
    something like, “It’s hard for someone without a marketing background to understand
    them, but trust us: these are good numbers.” As long as business results are reasonably
    good, most people in the organization accept this explanation, even while scratching
    their heads. The truth, however, is that marketing organizations that use pseudo-analytics
    are on the same, slippery, subjective slope as those who use no analytics. When
    financial pressures cause executives to inspect with a critical eye what’s really
    happening, marketing can’t answer the difficult questions about its contribution.


    **Note**


    Marketers using pseudo-analytics are on a slippery, downward slope along with
    those using no analytics. When numbers-oriented executives cast a critical eye
    on marketing efforts, marketing managers are hard-pressed to come up with answers
    that explain their value or show how they contribute to financial results.


    The funding situation with pseudo-analytics doesn’t differ much than that for
    organizations with no analytics process. It’s still an annual battle for incremental
    budget increases. One difference is that marketing can cite improvements in the
    metrics as justification for funding requests. Never mind that the analytics put
    forth by marketing may not really indicate how marketing is performing; the fact
    that there are numbers at all lends a veneer of credibility that marketing wouldn’t
    otherwise have. Even though the executives who approve the budget don’t understand
    the work of marketing well, they will often accept their budget rationale on faith.


    For big funding requests, these marketing organizations fare better than those
    using no analytics. Because ambitious projects require some sort of business case,
    justification is based on a set of metrics that tangentially support what marketing
    wants to do. Numbers, even the wrong ones, are persuasive when no one understands
    how to challenge them. Any discussion of ROI, however, is just speculation, because
    there are no metrics—or a culture of using them—that allows for the calculation
    or even estimation of ROI.


    Operationally, these marketing organizations are busy. Busy-ness is the common
    denominator of any marketing organization, but these organizations aren’t necessarily
    busy doing the right things. Without the guardrails of a good analytics process,
    the organization is never sure of whether it is on the right path or how effective
    it really is. The pseudo-analytics it uses are oriented more toward tracking activity
    instead of results. Units of marketing tasks performed, such as mailers sent,
    web pages updated, brochures printed, or ads placed indicate how busy marketing
    has been, but not what it produces in the way of results.'
