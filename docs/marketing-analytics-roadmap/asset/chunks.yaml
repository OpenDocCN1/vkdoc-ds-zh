    \ both traditional and digital, to create awareness. There are so many combinations\
    \ of messages, creativity, and channels that there is no hope of making intelligent\
    \ decisions about optimizing the media mix without analytics. They are indispensable\
    \ to the modern marketer.\n\nThe modern marketer’s awareness efforts take the\
    \ form of campaigns whose desired output is leads: individuals or businesses that\
    \ have identified themselves as having some level of need or interest in a solution,\
    \ and who have also surrendered contact information. For most companies, leads\
    \ are the fuel for the sales engine. It’s marketing’s job to ensure that a steady\
    \ flow of leads is coming in that are nurtured, qualified, and then passed along\
    \ to the sales team. Most of the time, the lead generation process is ground zero\
    \ for marketing analytics.\n\nThe right combination of testing and analytics can\
    \ make the difference between a lead generation campaign that is a flop and one\
    \ that is stellar. Because marketers don’t have unlimited budgets for lead generation,\
    \ analytics are an important tool for helping them understand which campaigns\
    \ to expand, which ones to revise, and which ones to abandon. The analytics provide\
    \ the information marketers need to optimize campaigns, which in turn generates\
    \ more leads, which the sales team turns into more revenue."
