- fmt: '# Conclusion


    This chapter has revealed the tip of the iceberg when it comes to marketing analytics
    tools. There are many from which to choose, and it’s not uncommon to see firms
    with a mature marketing analytics process use five or more of them simultaneously.
    When this is the case, it becomes even more important to have a dashboard (as
    discussed in Chapter [7](../Text/A978-1-4842-0259-3_7_Chapter.html)) presenting
    a comprehensive view that makes it easy to access and understand all the important
    information the marketing analytics process is producing. If BI tools are in use,
    they will enable the development and publication of a dashboard. There are also
    vendor solutions specific to this purpose of creating an analytics dashboard,
    such as `Birst`, `Cyfe`, `Domo`, `iDashboards`, and `QlikView`. Free solutions
    also exist. For the many reasons described in Chapter [7](../Text/A978-1-4842-0259-3_7_Chapter.html),
    a dashboard is an important communication and process management tool for the
    marketing analytics process.


    This discussion of tools and solutions that support strategic, operational, and
    logistical marketing analytics just begins to touch on all the technology available
    to modern marketers. When it comes to selecting tools, the set of choices is bewildering.
    How can marketers make the right choice? As this book has consistently advised,
    start with the objectives. Knowing the objectives narrows your search for tools
    and technology. Next, go online and research candidate providers, placing emphasis
    on those that have already created the type of success you want to replicate.
    As you consider the options, prioritize ease of use. Finally, evaluate the solutions
    on your short list to make a selection. Most vendors provide free trials so you
    can see how an analytics tools works in your environment, with your data.


