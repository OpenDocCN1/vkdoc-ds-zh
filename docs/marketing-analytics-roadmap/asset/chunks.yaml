  trans: '

    # 高级、数据驱动归因


    高级数据驱动归因（有时也称为跨渠道归因）是一种精确地将部分功劳分配给客户在购买旅程中所接触到的完整内容或媒体流中各个元素的方法。第 10 章将详细介绍高级归因，但此处值得提及，因为它属于战略营销分析的范畴。


    使用高级归因的营销人员可以精确地知道哪些优惠、元素和媒体流组件真正促成了转化。这种能够洞察营销多渠道活动中的哪些组件真正应得功劳的深度，长期以来被认为是不可实现或不可知的，但通过高级归因，这已成为现实。


    高级归因之所以重要，是因为它为营销人员提供了数据，以便对其媒体组合做出明智的决策。营销人员曾经依靠直觉和猜测来确定电子邮件、在线展示广告、社交媒体广告、付费搜索和直邮的正确组合。现在，通过高级归因，可以获取有关每个使用中的渠道及其协同表现方式的准确数据。高级归因解决方案领域在
    2014 年经历了显著的整合。⁹ Forrester Research 发布了一份跨渠道归因解决方案的评估报告，涵盖了以下供应商：`Abakus`、`AOL/Convertro`、`eBay
    Enterprise`、`Google`、`Marketing Evolution`、`MarketShare`、`Rakuten DC Storm` 和
    `Visual IQ`。¹⁰


    # 同期群分析


    同期群分析是对具有共同特征的一组客户在时间推移中的行为所进行的研究。这些行为是营销人员感兴趣的任何行为，研究这些行为能够识别出群体（同期群）特征与其行为之间的关系。同期群分析提供了客户群体之间那种通常难以实现的“苹果对苹果”比较。关于同期群分析的文献经常以大学毕业年份作为同期群的例子。每个毕业班都是一个同期群，通过追踪和比较不同同期群的特征，可以确定例如该同期群的毕业年份与其平均收入之间是否存在关系。


    同期群分析之所以重要，是因为针对关键业务或营销指标，同期群分析揭示了这些指标在客户关系生命周期内如何变化。这些发现有助于提高客户留存率，并更精确地估算客户生命周期价值（`CLV`）。精确了解
    `CLV` 非常重要，因为它指导着公司应投入多少资金来获取新客户的决策。这种方法已被应用和游戏开发商、在线企业、电子商务以及软件即服务企业所采纳，并且在这些领域中尤其适用。除了
    `CLV` 分析之外，一些常见的同期群分析还包括日/周/月销售额、新销售与重复销售对比、平均订单价值以及购买间隔时间。


    用于构建同期群分析的工具包括许多之前提及的 `BI` 和 `CI` 解决方案，以及 `CoolaData`、`Flurry`、`Google Analytics`、`KISSmetrics`、`Kontagent`、`Mixpanel`、`RJMetrics`
    等。`Cohort.ly` 和 `USERcycle` 都提供一定程度的免费同期群分析服务。在选择工具时，请确保它提供应用程序接口（`API`）或以其他方式与你希望纳入分析的环境集成，并且能够轻松纳入对你的分析至关重要的历史数据。


    ## 运营与物流营销分析


    属于运营和物流领域的分析工具和解决方案与组织的数字存在密切相关。过去，这种数字存在仅仅是公司网站，而现在它涵盖了每一个数字触点：网站、微型网站、所有公司策划的社交媒体、搜索引擎优化（`SEO`）、搜索引擎营销（`SEM`）以及移动端。营销人员需要的工具不仅能够让他们了解每个独立数字渠道的个体表现，还能让他们对其整体表现有一个全面的视图。


    讨论的起点是网站以及帮助管理和优化网站的 analytics 工具。一个日益频繁的现象是，购买者会在线上调查潜在供应商，甚至在供应商意识到潜在买家兴趣之前就深入到了购买考虑流程中。因此，对于大多数组织来说，网站仍然是数字营销工作的基石。如果一个公司的网站不能轻松快速地提供潜在买家所需的内容，它将会因此受损。需要有这样的工具，能让公司实时了解访问者如何与其网站互动，以便公司能够迅速调整，解决网站和内容方面的不足。


    在营销分析领域占据主导地位的工具是 `Google Analytics`。许多营销人员首次接触分析就是通过使用这个工具。声称 `Google Analytics`
    主导了该领域并非夸大其词：它被一半的网站所使用，作为网络分析工具，其市场份额高达 82%。¹¹ 如果一个营销组织不得不将自己限制于仅使用一个分析工具，那么
    `Google Analytics` 就是那个工具。如果拥有一个表现良好的网站对组织的成功至关重要，那么使用 `Google Analytics` 来管理该网站是极具意义的，仅凭一个原因：美国大约三分之二的搜索流量都通过
    `Google`。¹² 如果目标是让访问者通过 `Google` 搜索轻松找到你的网站，为什么不用这家搜索巨头提供的分析工具呢？


    `Google Analytics` 有许多吸引人的特点。对于任何想使用它的人来说都是免费的，易于实施和使用，拥有出色的报告功能，并且 `Google` 不断添加新功能使其更有价值并扩展其能力。对于任何认为其网络存在很重要的组织来说，这是一个必备工具，因为它能揭示关于访问者、流量和内容的信息，否则组织对这些信息将一无所知。以下是
    `Google Analytics` 用户可以了解到的一些内容：

    '
- fmt: '*   `Visitors`: 网站访问者数量、独立访客数、访问时长、首次访问与回访用户数等。此外还可获取访客的人口统计数据，例如其地理位置（国家与城市），以及访问网站时使用的浏览器和设备。

    *   `Traffic`：谷歌分析会告知网站获得的流量，但更重要的是，它能揭示访问者是如何抵达网站的。随着网站访问路径日益多样化，营销人员了解其网络流量的来源至关重要，特别是其中有多少来自搜索引擎及其他引荐来源。在搜索引擎流量方面，谷歌分析还能告知为网站带来流量的关键字，这些信息对执行搜索引擎优化（SEO）至关重要。

    *   `Content`：通过谷歌分析，营销人员可以了解访问者如何使用其网络内容。系统会记录网页的进入和退出点，以及访问者查看某个页面的次数和停留时长。这些信息有助于营销人员优化并改善其内容的SEO特性。谷歌分析甚至能提供页面加载时长统计，帮助识别并修正加载缓慢的页面。


    关于网站访问者、流量和内容的数据只是谷歌分析强大功能的冰山一角。这是一个强大的工具，并且随着每次后续发布而变得更强。2013年，谷歌推出了通用分析（Universal
    Analytics），增加了跨设备追踪用户的功能。借助谷歌通用分析，可以从任何能够发送HTTP数据请求的联网设备收集指标数据。这种互联性的意义在于，诸如游戏主机、各类应用，甚至联网的蓝光播放器等多种设备，都能与谷歌分析共享使用数据。


    谷歌分析是数字分析领域的巨头，但也存在其他厂商，它们的解决方案同样值得考虑。TrustRadius已针对数字分析软件发布了以TrustMap形式呈现的分析报告[^(13)](#A978-1-4842-0259-3_8_Chapter.html#Fn13)，其中分析解决方案根据用户评价以及在小企业、中型企业和企业级市场中的采用率进行排名。正在考虑实施分析技术的营销人员在试图了解市场上的各种产品时，会发现这类分析极具价值。


    在当今的现代营销时代，公司的数字存在已不再局限于其网站，还包括社交媒体和移动端。任何分析方法都需要覆盖整个数字领域，包括社交和移动渠道。对于某些组织而言，社交媒体的重要性已超越网站。谷歌分析确实提供了一些社交报告功能，同时还有一系列更为专业的解决方案，可洞察社交领域中的品牌对话。


    社交媒体工具对于识别和参与社交领域中发生的关于品牌或公司的对话至关重要。这些解决方案有助于监控这些对话，从看似无穷无尽的社交媒体帖子中筛选出需要了解的内容，因为它们与品牌相关。仅仅知道这些对话的存在，就能参与其中。例如，某个抱怨品牌糟糕服务体验的用户，现在可能会看到该品牌作为服务补救努力的一部分而做出回应。


    除了提供处理社交媒体投诉的机会外，这些工具还允许品牌衡量关于品牌、其产品或所代表理念的情感倾向。它们不仅能让用户简单统计点赞、关注或分享的数量，还能衡量品牌与其关注者的真实互动水平。许多工具都属于社交媒体监控（也称为社交媒体倾听）和分析类别，包括HootSuite、Netbase、Radian6（来自Salesforce）、SproutSocial、Sysomos等。有些解决方案是免费的，因此预算不应成为营销人员管理和衡量其社交媒体存在的理由。


    关于社交媒体的讨论同样适用于移动渠道。如果移动渠道是组织媒体组合的一部分，那么该组织需要确保其被纳入营销分析体系。移动是最快速增长的营销渠道之一，它能利用支持GPS的移动设备收集客户的地理和行为数据。这些数据可以使企业检测到客户的接近程度，并向其推送优惠券、促销提醒或其他优惠信息。'
  raw: '*   Visitors: the number of visitors to the website, how many were unique,
    how much time they spent on the site, how many were first-time and returning visitors,
    and more. Demographic data about visitors is also available, such as their geographic
    location (country and city), and which browser and device they were using when
    they visited your site.

    *   Traffic: Google Analytics will tell you how much traffic your website is getting,
    but more important, it can reveal how those who visit your website got there.
    As the paths to a website get more diverse, it is important for marketers to understand
    the source of their web traffic, specifically how much came from search engines
    and other referral sources. Regarding search engine traffic, Google Analytics
    can also tell you the keywords that are responsible for generating traffic to
    a website, information that is critical to performing SEO.

    *   Content: through Google Analytics, marketers can learn how visitors are consuming
    their web content. The web pages that are entry and exits points are recorded,
    as well as how many times a visitor viewed a page and how long they stayed there.
    This information helps marketers optimize and improve the SEO characteristics
    of their ­content. Google Analytics can even provide statistics about how long
    it takes pages to load, helping identify and correct slow-loading pages.


    The data on website visitors, traffic and content just scratch the surface of
    Google Analytics’ capabilities. It is a powerful tool that grows stronger with
    each subsequent release. In 2013, Google offered Universal Analytics, adding features
    that enable tracking users across multiple devices. With Google Universal Analytics,
    the ability exists to collect metrics from any Internet-connected device that
    can send an HTTP data request. The implication of this connectivity is that a
    very diverse set of devices, such as game consoles, various apps, and even Internet-connected
    Blu-ray players can share usage data with Google Analytics.


    Google Analytics is the gorilla in the digital analytics space, but other vendors
    exist as well, and their solutions merit consideration. TrustRadius has published
    analysis in the form of TrustMaps for Digital Analytics software,[^(13)](#A978-1-4842-0259-3_8_Chapter.html#Fn13)
    in which analytics solutions are ranked on the basis of user ratings and adoption
    within small, mid-size, and enterprise market segments. Marketers that are considering
    implementing analytics technology will find this type of analysis very helpful
    as they attempt to understand the array of offerings in the market.


    A company’s digital presence in this modern marketing era is no longer limited
    to just its website but includes its social media and mobile presence as well.
    Any approach to analytics needs to span the entire digital waterfront, including
    social and mobile. For some organizations, social media has eclipsed the website
    in importance. Google Analytics certainly provides some social reporting capabilities,
    and a cadre of more specialized solutions also provide insight into brand conversations
    that occur in the social realm.


    Social media tools are necessary for identifying and participating in the conversations
    about a brand or company that take place in the social realm. These solutions
    help monitor those conversations, sifting through the seemingly infinite number
    of social media posts and detecting those you need to know about because they
    relate to your brand. Simply knowing about these conversations enables participation
    in them. For example, an individual who rants about a poor service experience
    with a brand may now see that brand respond as part of an effort to recover from
    a service failure.


    Beyond just providing opportunities to address social media complaints, these
    tools allow brands to measure sentiment about the brand, its products, or what
    it represents. They provide users with the ability to do more than simply count
    likes, follows, or shares and instead measure the true level of engagement a brand
    has with its followers. Many tools fall into this social media monitoring (also
    known as social media listening) and analytics category, including HootSuite,
    Netbase, Radian6 (by Salesforce), SproutSocial, Sysomos, and numerous others.
    Some solutions are free, so budget should not be a reason that marketers aren’t
    managing and measuring their social media presence.


    The same discussion about social media applies to the mobile channel. If mobile
    is part of an organization’s media mix, then that organization needs to ensure
    it is included in the marketing analytics portfolio. Mobile is one of the fastest
    growing marketing channels, providing the ability to exploit GPS-enabled mobile
    devices to gather geographic and behavioral data about customers. This data can
    enable a business to detect the proximity of a customer and push coupons, sales
    alerts, or other offers to that customer.'
