    It’s true that analytics can help marketing improve its performance. With the\
    \ proper selection of metrics, the collection of data, the diligent analysis and\
    \ reporting of it, and the resulting decisions, analytics are a potent performance\
    \ enhancer. But what kind of performance, and how do the improvements come about?\
    \ If analytics are a means to an end, and that end is better revenue performance,\
    \ how do analytics get us from here to there?\n\nThe end game for marketing analytics\
    \ is revenue, and with revenue impact and expenses known, it is possible to derive\
    \ ROI for marketing, a topic of further discussion in [Chapter 6](../Text/A978-1-4842-0259-3_6_Chapter.html).\
    \ How, then, does the analytics process help create revenue? Understanding how\
    \ marketing analytics affect revenue is the fundamental starting point for many\
    \ analytics initiatives.\n\nTo understand this, consider the journey that most\
    \ prospects take toward becoming customers. There is an initial recognition of\
    \ need, followed by a process of discovering potential solutions, consideration\
    \ of those solutions, and ultimately a decision. Marketing 101 teaches us that\
    \ prospects must be aware of solutions so they can consider them and ultimately\
    \ make a purchase. Much of marketing’s work, therefore, is about creating awareness\
    \ as early as possible in this buying cycle.\n\nGenerating this awareness happens\
    \ a number of ways. In the earliest days of marketing, there were fewer tools\
    \ and channels for generating awareness. Marketing and advertising were synonymous,\
    \ and print was the primary channel. Even then, however, there was a need for\
    \ analytics data.\n\nJohn Wanamaker, quoted above, understood the limits that\
    \ a lack of analytics data about advertising efforts imposed. The only thing he\
    \ had to help him optimize his advertising was his intuition.\n\nFast forward\
