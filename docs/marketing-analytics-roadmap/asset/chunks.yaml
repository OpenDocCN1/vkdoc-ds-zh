  raw: '## Establishing Metrics


    > Measuring busy-ness is far easier than measuring business. —Seth Godin


    All the planning for marketing analytics eventually comes down to selecting appropriate
    metrics, putting a process in place to measure and track them, and then doing
    something with the data.


    When you’re just getting started with analytics, it’s not wise to put every conceivable
    marketing metric in place. Instead, start with a few of the most relevant metrics
    and build the portfolio up over time as you gain proficiency with the analytics
    process. In fact, what is likely to happen is that the initial set of metrics
    you select will lead you to other metrics you’ll want to track as well.


    What is the right set of metrics for a marketing analytics process? The answer
    depends entirely on an organization’s marketing strategy. As discussed in the
    previous section, the best or right set of metrics are derived from the marketing
    strategy. There are some categories of metrics that are commonly used in the marketing
    analytics process. These include metrics for the marketing process, customers,
    lead generation, and social/digital marketing.


    Note


    Common categories of marketing metrics include measures of the marketing process,
    customers, lead generation, and digital marketing.


    Your portfolio of metrics should include some that indicate how productive the
    marketing team is. As previously cautioned, these can easily become “vanity” metrics,
    but when they’re used properly, they help the team understand how efficiently
    it is working. Example metrics in this category include assets created, impressions
    generated, year-to-date budget status or ROI, a subject covered in detail in [Chapter
    6](../Text/A978-1-4842-0259-3_6_Chapter.html). The right metrics in this category
    are those that help the CMO and the marketing team know how well it is getting
    its work done.


    The metrics portfolio should also include some customer metrics. These metrics
    serve as the vital signs for customers and are one of the most important marketing
    metrics categories. A number of important metrics fall into this category, including
    customer lifetime value (CLV), customer satisfaction, customer retention rates,
    Net Promoter Score (NPS), cost of new customer acquisition, and customer churn
    rates. Almost all of these metrics are tremendously valuable when it comes to
    understanding the economics of marketing’s work and its impact on revenue.


    Any business needs a steady stream of new prospects or leads to generate sales
    and grow. The metrics associated with lead generation activities are a very important
    part of many marketing analytics efforts. In fact, lead generation is the primary
    activity for many marketing teams, and because much of the work of lead generation
    is digital, there’s a rich set of data available for collection and analysis.
    Performance of lead generation processes is tracked a number of ways, including
    new leads by channel (e.g., email marketing, social media marketing, mobile marketing),
    new leads by campaign, lead flow or volume, new opportunities created, qualified
    leads created, conversion rates, cost per lead/qualified lead, and of course revenue
    generated.


    The final category of metrics is broad and expansive: digital marketing. Within
    this category, there are sets of metrics for measuring the growing list of digital
    marketing channels. Some of these digital marketing metrics are:


    *   Website: traffic sources, most visited pages, search ranking, visits or unique
    visits, time of site or page, bounce rate, and exit pages are all potentially
    important for measuring website performance.

    *   Social media: social network reach (followers, fans, subscribers, or contacts),
    shares/retweets, engagement, posts, and referral traffic. Your social media metrics
    should include your blog.

    *   Email marketing: database or list size, number of sends, open rate, click-through
    rate, and bounces are all standard metrics for email marketing.

    *   Digital advertising: this includes pay-per-click and other forms of paid,
    digital media. Key metrics could include impressions, click-throughs, inquiries,
    landing page views, conversion rate, opportunities identified, revenue generated,
    and program ROI.


    What is presented here is just a sampling of the metrics available to support
    a marketing analytics program. Each organization will have a slightly different
    portfolio to support its process. The right ones measure marketing’s success in
    the execution of its strategy and show real results. Organizations that are getting
    started with marketing analytics should select just a few to launch their process;
    as they mature, they will want to have metrics for each of the categories described
    here.


    Footnotes [1](#A978-1-4842-0259-3_5_Chapter.html#Fn1_source)


    David Raab, “Winning the Marketing Measurement Marathon,” September 2010, [http://​www.​marketo.​com/​_​assets/​uploads/​Winning-the-Measurement-Marathon-final.​pdf](http://www.marketo.com/_assets/uploads/Winning-the-Measurement-Marathon-final.pdf).


    [2](#A978-1-4842-0259-3_5_Chapter.html#Fn2_source)


    Scott Brinker, “Rise of the Marketing Technologist,” Chiefmartec.com blog, April
    18, 2010, [`http://chiefmartec.com/2010/04/rise-of-the-marketing-technologist/`](http://chiefmartec.com/2010/04/rise-of-the-marketing-technologist/)
    .


    [3](#A978-1-4842-0259-3_5_Chapter.html#Fn3_source)


    See [`http://www.netpromoter.com/why-net-promoter/know/`](http://www.netpromoter.com/why-net-promoter/know/)
    .'
  trans: "\n# 确立度量指标\n\n> 衡量忙碌程度远比衡量业务成效要容易得多。 ——赛斯·高汀\n\n营销分析的所有规划最终都会归结为：选择恰当的度量指标，建立测量和追踪这些指标的流程，然后利用数据采取行动。\n\
    \n当你刚开始接触分析时，将每一个可能用到的营销指标都纳入考量并非明智之举。相反，应从少数最相关的指标入手，随着你对分析流程的日益熟练，再逐步扩充指标组合。事实上，很可能发生的情况是，你最初选定的那套指标会引导你发现其他同样需要追踪的指标。\n\
    \n对于营销分析流程而言，什么才是合适的指标组合？答案完全取决于组织的营销策略。正如前一节所讨论的，最佳或最合适的指标组合源自营销策略本身。营销分析流程中常用到一些指标类别，包括营销流程指标、客户指标、潜在客户生成指标以及社交/数字营销指标。\n\
    \n> **注意**  \n> 常见的营销指标类别包括：营销流程、客户、潜在客户生成以及数字营销这几个方面的衡量指标。\n\n你的指标组合应包含一些能反映营销团队生产力的指标。正如之前所提醒的，这些指标很容易变成“虚荣”指标，但如果使用得当，它们能帮助团队了解自身工作效率。这类指标的示例包括：已创建的资产数量、产生的曝光量、年初至今的预算状况或投资回报率（ROI）——这一主题在第\
    \ 6 章中有详细阐述。此类别中的恰当指标，应能帮助首席营销官及营销团队了解其工作完成情况。\n\n指标组合还应包含一些客户指标。这些指标是客户的“生命体征”，也是最重要的营销指标类别之一。许多重要指标都属于这一类，包括客户生命周期价值（CLV）、客户满意度、客户留存率、净推荐值（NPS）、新客户获取成本以及客户流失率。在理解营销工作的经济效益及其对收入的影响时，几乎所有这些指标都具有巨大的价值。\n\
    \n任何企业都需要源源不断的新潜在客户或线索，以推动销售和增长。与潜在客户生成活动相关的指标，是许多营销分析工作中至关重要的一部分。事实上，潜在客户生成是许多营销团队的主要活动，并且由于这项工作大部分是数字化的，因此有丰富的数据可供收集和分析。潜在客户生成流程的表现可通过多种方式进行追踪，包括：按渠道（如电子邮件营销、社交媒体营销、移动营销）统计的新线索数、按活动统计的新线索数、线索流量或数量、新增商机数、合格的线索数、转化率、每条线索/每条合格线索的成本，当然还有产生的收入。\n\
    \n最后一类指标广泛而庞大：数字营销。在此类别中，包含用于衡量日益增多的数字营销渠道的一系列指标。其中一些数字营销指标包括：\n\n- **网站**：流量来源、最常访问的页面、搜索排名、访问量或独立访客数、网站或页面停留时间、跳出率以及退出页面，这些对于衡量网站表现都至关重要。\n\
    - **社交媒体**：社交网络覆盖范围（粉丝、关注者、订阅者或联系人）、分享/转推数、互动量、帖子数以及引荐流量。你的社交媒体指标应包括博客相关数据。\n\
    - **电子邮件营销**：数据库或列表规模、发送数量、打开率、点击率以及退信率，这些都是电子邮件营销的标准指标。\n- **数字广告**：包括按点击付费及其他形式的付费数字媒体。关键指标可能包括：曝光量、点击量、咨询量、落地页浏览量、转化率、识别出的商机数、产生的收入以及项目投资回报率。\n\
    \n这里所呈现的仅仅是支持营销分析项目可用的指标中的一小部分。每个组织都会有一套略有不同的指标组合来支撑其流程。正确的指标应能衡量营销策略执行的成功与否，并展示真实成果。刚起步进行营销分析的组织应只选择少数几个指标来启动流程；随着成熟度的提升，他们应逐步为这里描述的每个类别都建立相应的指标。\n\
    \n**脚注**\n\n1. 大卫·拉布，《赢得营销测量马拉松》，2010 年 9 月，[`www.marketo.com/_assets/uploads/Winning-the-Measurement-Marathon-final.pdf`](http://www.marketo.com/_assets/uploads/Winning-the-Measurement-Marathon-final.pdf)。\n\
    2. 斯科特·布林克，《营销技术专家的崛起》，Chiefmartec.com 博客，2010 年 4 月 18 日，[`http://chiefmartec.com/2010/04/rise-of-the-marketing-technologist/`](http://chiefmartec.com/2010/04/rise-of-the-marketing-technologist/)。\n\
    3. 参见[`http://www.netpromoter.com/why-net-promoter/know/`](http://www.netpromoter.com/why-net-promoter/know/)。\n"
- fmt: '# 6. Return on Investment


    ## The Ultimate Metric?


    For many marketers, proving the return on investment (`ROI`) for marketing has
    long been a thorn in their flesh. Those outside of the marketing department are
    uniformly in favor of having marketing report its `ROI`. They want the same level
    of `ROI` accountability for marketing as for every other department. Those within
    the department tend to have mixed opinions. Some marketers embrace `ROI` calculation
    and reporting as the best means of validating marketing’s work. They recognize
    that having the ability to accurately report on marketing’s `ROI` creates acceptance,
    and if the return meets or exceeds expectations, it makes justifying budget and
    resources much simpler. `ROI` has the potential to depoliticize marketing funding
    and operations.


    Others within the marketing team fear the expectation to measure their `ROI` because
    it could reveal low performance and expose them to repercussions. Others simply
    think that focusing on `ROI` compromises marketing’s true mission. Whatever the
    stance, marketing has been slow to embrace `ROI` as a metric, and as cartoonist
    Brady Bonus illustrates in Figure 6-1, it’s still the exception for `ROI` to be
    part of the marketing conversation.


    ![A978-1-4842-0259-3_6_Fig1_HTML.jpg](Images/A978-1-4842-0259-3_6_Fig1_HTML.jpg)


    Figure 6-1. For most marketing organizations, understanding its `ROI` remains
    elusive


    Of the challenges marketers face, proving `ROI` is the top challenge, ranked well
    ahead of securing budget.¹ Regardless of whether marketers love or hate being
    subjected to `ROI` scrutiny, many members of the C-suite expect to see these numbers,
    so marketing should understand what it is and how to report it.


    One problem with marketing `ROI` is that many marketers simply don’t understand
    what it is, as this Quora post² illustrates:


    *   Question: “What is considered a good `ROI` for a digital marketing campaign
    for a consultancy company?”

    *   Answer: “If you can generate sales leads for under $50 you''re probably going
    pretty well. Especially since your contracts are probably in the thousands. A
    response rate of 20 percent for ‘soft conversions’ like ebook downloads would
    be considered good as well.”


    The response to this post, though helpful, never gets around to stating anything
    about `ROI`, although it provides some data that might help in its determination.


    `ROI` is a profitability ratio that measures the profit returned from each investment,
    with its results expressed as a percentage. Businesses use `ROI` as a success
    measure for various investments and projects. It is used to evaluate past successes
    as well as forecast future ones. The formula for calculating `ROI` is fairly simple:


    ![$$ \mathrm{Return}\kern0.5em \mathrm{on}\kern0.5em \mathrm{Investment}\kern0.5em
    =\kern0.5em \frac{\mathrm{Gain}\kern0.5em \mathrm{on}\kern0.5em \mathrm{investment}\kern0.5em
    \hbox{--} \kern0.5em \mathrm{Cost}\kern0.5em \mathrm{of}\kern0.5em \mathrm{investment}}{\mathrm{Cost}\kern0.5em
    \mathrm{of}\kern0.5em \mathrm{investment}} $$](Images/A978-1-4842-0259-3_6_Chapter_TeX2GIF_Equa.gif)


    In the calculation, the cost component is not hard to come by. The “gain” element
    of this equation is difficult to measure with a degree of precision that creates
    confidence in the result.


    To illustrate, consider the example of attending a trade show, a marketing activity
    that often requires justification and reporting of subsequent `ROI`. The assumption
    in this example is that revenue from sales will ultimately result that is attributable
    to participation in the show. The `ROI` calculation seems quite simple, accounting
    for the hard costs and revenue, as Table 6-1 delineates.


    Table 6-1. Example of Determining Trade Show `ROI`


    | Description | Cost | Gain |

    | --- | --- | --- |

    | Exhibit/sponsorship fees | $15,000 | — |

    | Transportation fees | $1,500 | — |

    | Travel expenses | $2,500 | — |

    | Promotional item expense | $1,000 | — |

    | Literature & misc. expense | $1,000 | — |

    | Total costs | $21,000 | — |

    | Sales from show leads | — | $45,000 |

    | Total return |   | $24,000 |

    | `ROI` |   | 114% |


    The example in Table 6-1 makes determining `ROI` for participation in a trade
    show seem simple, and in fact, with the 114 percent `ROI` shown here, the return
    on this investment is fantastic. What this scenario doesn’t account for, however,
    are the soft benefits that are very real but difficult to account for. There is
    increased brand awareness that occurs, an enhanced reputation as an industry thought
    leader, competitive intelligence gathered, and new product ideas that came from
    face-to-face interaction with trade show attendees. None of these benefits are
    accounted for in the `ROI` calculation shown in Table 6-1, and their ultimate
    value could far exceed the $45,000 in sales in this example. Perhaps accounting
    for these soft benefits is not important when the hard costs and benefits deliver
    a 114 percent `ROI`, but when the business case is break-even or shows a loss,
    then quantifying the soft benefits becomes critical, yet it’s hard to do.


    Despite these challenges, measuring the `ROI` of marketing is politically smart.
