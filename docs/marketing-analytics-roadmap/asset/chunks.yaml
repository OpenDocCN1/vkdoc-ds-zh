- fmt: '# Lack of Enthusiasm


    > The real secret to success is enthusiasm. —Walter Chrysler


    It’s not unrealistic for an organization to have a welcoming culture and intellectual
    agreement with marketing analytics, but still fail to see an analytics initiative
    get traction and thrive. When a prosperous company hasn’t fully embraced marketing
    analytics, even though it is not opposed to them, more often than not the reason
    is because there’s little enthusiasm for doing so. To some of these organizations,
    analytics seems like unnecessary busywork. Because of the prosperity it is experiencing,
    there’s usually an “if it ain’t broke, don’t fix it” attitude. Marketing analytics
    is relegated to back-burner status, something that the company will get around
    to doing when it isn’t so busy or if it becomes really necessary.


    A crisis becomes the catalyst for the adoption of marketing analytics in these
    companies. Organizations that feel as if they are doing fine simply don’t have
    the motivation to seriously pursue marketing analytics. Weaving analytics into
    the fabric of marketing requires a mature view of analytics as a full-time commitment,
    something that occurs in lean and prosperous times. An effective marketing analytics
    process softens the lean times and magnifies the prosperous ones, smoothing out
    the economic peaks and valleys.


    It’s easy to understand this lack of enthusiasm for marketing analytics. What’s
    behind it is an attitude that parallels the view of a reasonably fit person toward
    exercise: there’s no compelling need as long as that person feels fine. It’s the
    same for companies: as long as business is reasonably good, marketing analytics
    is not a priority. There’s no disagreement about the worth of analytics, but neither
    is there enthusiasm for the effort involved in pursuing an initiative. The challenge
    is similar to that of convincing young people of the need to buy life insurance.
    Those with the ability to look ahead and think strategically can anticipate a
    day when they’ll be glad they bought life insurance. In many ways, marketing analytics
    is like an insurance policy, protecting marketing from the worst possible outcomes
    by showing it the best path to prosperity.


    **Note**


    When business is good, organizations may have no enthusiasm for pursuing an analytics
    initiative.


    There’s a complacency that comes with even small degrees of corporate success.
    It can take hold in companies that are not achieving their objectives but perceive
    that they’re making progress toward them and can easily rationalize that they’re
    on the right path. If that path doesn’t include marketing analytics, it is unlikely
    that they will add it for a number of reasons: it’s work, they don’t understand
    it, they don’t know where to begin, what they’re doing now seems to be working,
    there are too few resources that are better invested in other activities. The
    list of reasons (excuses) is almost endless. It’s easy for the marketing team
    or the C-suite to talk themselves out of pursuing an analytics initiative.


    What is ideal is for organizations, while healthy and growing, to commit to marketing
    analytics, gaining proficiency in the process and use of metrics during a time
    of strength. This kind of marketing analytics genesis works well because the process
    hopefully matures fast enough to help insulate the company from revenue downturns.
    The company that follows this path can identify alarming trends faster, have greater
    agility in responding to them, and do so with more authority and conviction because
    of the analytics process. This is the ideal scenario for birthing a marketing
    analytics process, but the barrier that can prevent it from occurring is satisfaction
    with the status quo.


    It’s more likely that some crisis will cause the hasty birthing of a marketing
    analytics process. When this happens, there is some underlying level of desperation,
    and with desperation comes a lack of patience. Analytics created out of these
    circumstances can ultimately succeed. But it takes strong leadership to take a
    novice organization and have it stay the course when it is looking for instant
    gratification from analytics. The risk here is that what is a very good idea—marketing
    analytics—gets abandoned when it doesn’t immediately prove to be the salvation
    for a company’s woes. This impatience is exactly the reason companies should embrace
    marketing analytics when they don’t think they need them, so they’ll be able to
    leverage them when they are needed most.


    As this book has described, there is a period of time required for learning, identifying
    proper metrics, collecting the data, and becoming proficient in its analysis.
    It is possible to gain some immediate benefits from marketing analytics, but to
    have the practice mature and deliver all the benefits takes time. If it takes
    a crisis to cause a company to embrace marketing analytics, so be it. The right
    view of the process is as a strategic initiative, not a tactical bandage. Marketers
    should take advantage of any opportunity that opens the door for analytics and
    move through that opening without looking back.


    When complacency and satisfaction with the status quo are the issue, here are
    some things marketers can do to generate enthusiasm for analytics and start weaving
    it into the fabric of marketing:


    *   **Accentuate the positive.** While analytics can help prevent a company from
    going over the cliff, they can also help it climb the mountain. In the early going,
    emphasize metrics and analysis that lead upward. This advice in no way is meant
    to imply that marketing should bury its head in the sand if metrics deliver bad
    news. But in the early going, using metrics that drive improvements others care
    about generates enthusiasm.

    *   **Come bearing gifts.** Analytics data can provide invaluable insights. Marketers
    can share that data with those it needs as allies, helping them gain insights
    that are otherwise inaccessible. The caution here is not to let analytics data
    become a political tool, as ideally there is complete transparency throughout
    the organization with respect to this data. But those who aren’t familiar with
    how helpful such data can be should receive the gift of marketing analytics data
    with appropriate explanations and assistance in interpreting it.

    *   **Practice internal public relations.** It’s unreasonable to expect the organization
    to connect all the dots where the analytics process is concerned just from seeing
    the data it produces. In other words, you can’t just throw data at the organization
    and expect them to appreciate it. Champion the process internally by intentionally
    promoting its successes, even the smallest ones.

    *   **Maintain the drumbeat.** Be persistent in encouraging the practice of marketing
    analytics. Do this by touting the benefits, not constantly warning of the potential
    dire consequences of not doing so. Fear is a motivator, but not the best one.


    The worst-case scenario for organizations without enthusiasm for marketing analytics
    is a crisis that triggers interest in them. Marketers that are not having success
    putting analytics on the corporate radar screen can do some background preparation,
    knowing that a day will come when the call goes out for the kind of help that
    analytics can provide.'
