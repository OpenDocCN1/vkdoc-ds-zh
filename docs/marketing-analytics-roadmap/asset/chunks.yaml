  raw: 'This book was born out of my past frustration and experience with how marketing
    manages its performance and how that performance is judged. I’ve written this
    book for the marketing organizations that have not yet started their analytics
    journey but know that they need to and are trying to figure out where to begin.
    I intend for this book to inspire marketers and marketing organizations to get
    moving and point them in the direction they should go. The advice contained here
    will provide them with a roadmap, as the title suggests, with recommendations
    on methods, metrics, and tools to consider on that journey. What this book will
    not do is provide detailed, turn-by-turn directions from start to finish of the
    marketing analytics journey. The reason is simple: each organization’s journey
    must be different. The things that define the speed, vehicle, and even detours
    of that journey vary from company to company.


    This book is not for those who have already achieved maturity with their marketing
    analytics process, unless perhaps they want a nostalgic tour of where they’ve
    been. That still leaves a broad audience for the direction this book provides.
    A study I completed in partnership with VisionEdge Marketing just as this book
    went to publication reveals that just one in five marketing organizations have
    an effective analytics process in place. For everyone else—the 80 percent—this
    book will provide some encouragement and advice for starting and completing the
    marketing analytics journey. As the Chinese proverb attributed to Laozi states:
    “A journey of a thousand miles begins with a single step.” I hope this book helps
    many marketers take that first step.


    Jerry Rackley


    May 2015


    Acknowledgments


    I’m grateful to my Demand Metric colleagues, particularly John Follett and Jesse
    Hopps for their encouragement and support in the writing of this book. Likewise,
    to Dr. Joshua Wiener and Dr. Tom Brown in the marketing department at the Oklahoma
    State University Spears School of Business, who have encouraged, supported and
    mentored me.


    There is a legion of marketing professionals who champion the cause of marketing
    analytics and the technology behind it: Scott Brinker, Laura Patterson, Clare
    Price, and Stephan Sorger, just to name a few. Their passion and enthusiasm has
    inspired me to put my thoughts and ideas into book form.


    I owe a debt to those who have allowed me to be their marketer, both clients and
    employers. The experience gained from working alongside them in the marketing
    trenches has provided the grist for this book.


    Finally, thanks to Jeff Olson, who found me, reached out to me, and convinced
    me to begin this book-writing adventure. Thanks to Rita, Susan, Laura, and the
    great team at Apress for their gracious and patient support throughout the process.


