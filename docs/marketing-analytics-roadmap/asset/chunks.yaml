    \ budget status or ROI, a subject covered in detail in [Chapter 6](../Text/A978-1-4842-0259-3_6_Chapter.html).\
    \ The right metrics in this category are those that help the CMO and the marketing\
    \ team know how well it is getting its work done.\n\nThe metrics portfolio should\
    \ also include some customer metrics. These metrics serve as the vital signs for\
    \ customers and are one of the most important marketing metrics categories. A\
    \ number of important metrics fall into this category, including customer lifetime\
    \ value (CLV), customer satisfaction, customer retention rates, Net Promoter Score\
    \ (NPS), cost of new customer acquisition, and customer churn rates. Almost all\
    \ of these metrics are tremendously valuable when it comes to understanding the\
    \ economics of marketing’s work and its impact on revenue.\n\nAny business needs\
    \ a steady stream of new prospects or leads to generate sales and grow. The metrics\
    \ associated with lead generation activities are a very important part of many\
    \ marketing analytics efforts. In fact, lead generation is the primary activity\
    \ for many marketing teams, and because much of the work of lead generation is\
    \ digital, there’s a rich set of data available for collection and analysis. Performance\
    \ of lead generation processes is tracked a number of ways, including new leads\
    \ by channel (e.g., email marketing, social media marketing, mobile marketing),\
    \ new leads by campaign, lead flow or volume, new opportunities created, qualified\
    \ leads created, conversion rates, cost per lead/qualified lead, and of course\
    \ revenue generated.\n\nThe final category of metrics is broad and expansive:\
    \ digital marketing. Within this category, there are sets of metrics for measuring\
    \ the growing list of digital marketing channels. Some of these digital marketing\
    \ metrics are:\n\n- **Website**: traffic sources, most visited pages, search ranking,\
    \ visits or unique visits, time on site or page, bounce rate, and exit pages are\
    \ all potentially important for measuring website performance.\n- **Social media**:\
    \ social network reach (followers, fans, subscribers, or contacts), shares/retweets,\
    \ engagement, posts, and referral traffic. Your social media metrics should include\
    \ your blog.\n- **Email marketing**: database or list size, number of sends, open\
    \ rate, click-through rate, and bounces are all standard metrics for email marketing.\n\
    - **Digital advertising**: this includes pay-per-click and other forms of paid,\
    \ digital media. Key metrics could include impressions, click-throughs, inquiries,\
    \ landing page views, conversion rate, opportunities identified, revenue generated,\
    \ and program ROI.\n\nWhat is presented here is just a sampling of the metrics\
    \ available to support a marketing analytics program. Each organization will have\
    \ a slightly different portfolio to support its process. The right ones measure\
    \ marketing’s success in the execution of its strategy and show real results.\
    \ Organizations that are getting started with marketing analytics should select\
    \ just a few to launch their process; as they mature, they will want to have metrics\
    \ for each of the categories described here.\n\n**Footnotes**\n\n1. David Raab,\
    \ “Winning the Marketing Measurement Marathon,” September 2010, [http://www.marketo.com/_assets/uploads/Winning-the-Measurement-Marathon-final.pdf](http://www.marketo.com/_assets/uploads/Winning-the-Measurement-Marathon-final.pdf).\n\
    2. Scott Brinker, “Rise of the Marketing Technologist,” Chiefmartec.com blog,\
