- fmt: '# 排版后的内容


    Start with a vision. Having a vision is the starting point for successfully leveraging
    big data analytics. A vision provides direction for the effort, and a vision that
    is more specific is better. An example of a good vision is understanding which
    customers are most likely to defect. Ideally, the vision you cast for big data
    analytics should align with specific business objectives. Get and build skills.
    Most marketing teams don’t have the in-house skills to pursue a big data analytics
    initiative. Before going very far down the big data path, assess your skills and
    determine where deficiencies exist, putting a plan in place to acquire them. Those
    deficiencies are usually technical skills, which are needed in the early going
    to design and implement an architecture for big data to support the analytics
    work. Use consultants and outside services to bridge the skills gap at first.
    Identify a pilot project. Prove the value of big data by using it to solve a real
    marketing problem, even on a small scale. A pilot project helps prove the business
    case for a longer-term investment in big data analytics and also creates the necessary
    internal support. It brings into clear focus the skills needed to move forward,
    helps define the right metrics for measuring future success, and clarifies the
    architectural elements needed to progress further. Design a big data architecture.
    Based on your vision and goals for big data analytics, map out the necessary architecture
    for achieving them. The scope of your architecture will include system design,
    data flows, timing, and data models necessary to support big data analytics in
    your organization. Evaluate the alternative big data tools and platforms, make
    recommendations, and acquire them. Present the business case for big data. The
    experience of a successful pilot project, a skills assessment, and an architectural
    plan are the necessary ingredients for creating a business case that should win
    easy approval for stepping up the investment big data analytics.


    Big data often gets its start in the business intelligence unit of a company.
    Companies are using big data analytics to understand and engage customers in a
    way that inspires greater loyalty. They can make better, data-driven decisions,
    seizing the opportunity to improve marketing ROI, develop new opportunities, tailor
    promotions to specific target markets and help optimize marketing’s strategy.


    ## Predictive Analytics


    > Any sufficiently advanced technology is indistinguishable from magic. —Arthur
    C. Clarke


    Any conversation about big data and marketing often leads to the topic of predictive
    analytics. Although these are not interchangeable terms or processes, big data
    and predictive analytics go hand in hand. Predictive analytics “is the use of
    statistics, machine learning, data mining, and modeling to analyze current and
    historical facts to make predictions about future events.”[⁴](#A978-1-4842-0259-3_10_Chapter.html#Fn4)
    Although it’s still analytics, it’s a very different kind because it is forward-looking.
    All other types of marketing analytics tell us what has already happened, perhaps
    very recently, but still looking backward. Predictive analytics give marketers
    the ability to know what is going to happen with amazing accuracy. The results
    that some are getting through the use of predictive analytics seems almost magical.


    Most of the automation and analytics that marketers use, while very helpful, provides
    a historical view of lead generation process performance. In fact, marketers have
    the ability to understand with great precision how campaigns have performed and
    where the bottlenecks are in the marketing funnel. What this technology can’t
    do is serve as a crystal ball that shows the conversion future of leads in the
    funnel. Marketers find themselves trying to make the most sense of the historical
    analytics data—looking in the rearview mirror—to squeeze the last drop of performance
    out of campaigns and lead-generation processes. What predictive analytics does
    is give sales and marketing that crystal ball: accurate predictions about which
    leads in the funnel will buy and when.


    Predictive analytics is best thought of as “predictive intelligence” that comes
    alongside marketers as they invent creative ways to connect with prospects and
    customers through various content, promotions, and offers. It helps marketers
    understand the propensity to buy for the leads in the funnel, separating the wheat
    from the chaff from a sales perspective. Predictive analytics forecasts how well
    customers will respond to those efforts to influence them. It looks at the likely
    positive and negative outcomes of doing that, showing marketing who is least likely
    to respond to an offer and who is most likely to buy or respond to an offer.


    > **Note**

    >

    > Predictive analytics helps marketers understand the readiness of leads in the
    sales funnel to buy and when.


    Predictive analytics, therefore, works on both the expense and revenue sides of
    the profit equation. By knowing who is least likely to respond to an offer, marketing
    can save budget dollars by eliminating those prospects in the database from future
    direct mail or telephone campaigns, perhaps opting to reach out via some less
    expensive channel. By contrast, when predictive analytics helps marketers understand
    who is most likely to respond, marketing can increase revenue by presenting offers
    to those prospects are most likely to accept.


    From the organization’s perspective, predictive analytics helps drive revenue.
    From marketing’s perspective, it helps marketing sustain higher levels of performance.
    Without predictive analytics, marketing is resigned to a trial-and-error approach
    to its campaigns, constantly trying to determine the best blend of campaign and
    media mix parameters to squeeze some incremental improvements out of its efforts.
    Predictive analytics can shortcut this trial and error process by enabling accurate
    predictions of how likely, how much, what, and when a prospect will buy.'
