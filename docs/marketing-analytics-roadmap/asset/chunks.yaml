- fmt: 'The fourth attitude depicted in Figure [2-6](#A978-1-4842-0259-3_2_Chapter.html#Fig6),
    held by 25 percent in the survey’s sample, is that analytics could help show the
    value marketing creates. This attitude communicates the reality about how marketing
    organizations can demonstrate their effect on revenue—through analytics. There
    is no other way for a CMO to account for the share of revenue directly attributable
    to marketing except through a set of metrics that link marketing’s activity to
    business results. Every marketing organization should aspire to show proof of
    its value to the company. Even when marketing organizations create intrinsic value
    through inspiring, creative campaign development and execution, they still need
    to offer proof of the value they deliver. An analytics process provides that proof.


    The fifth and final attitude depicted in Figure [2-6](#A978-1-4842-0259-3_2_Chapter.html#Fig6)
    is the most widely held. Almost half the survey sample responded that analytics
    are vitally important as a dashboard to help manage marketing processes. This
    attitude represents the ultimate goal of an analytics process: using the output
    from it as a management tool to continuously improve what marketing is doing.
    Analytics help show that marketing has credibility, and they are a way to demonstrate
    marketing’s value. These benefits flow out of using analytics as a dashboard to
    guide marketing’s efforts. This attitude, therefore, represents the primary analytics
    goal for marketers. Build an analytics process that serves as an effective dashboard
    to guide marketing’s work, and credibility and demonstrable value will follow.


    ## Marketing Analytics Challenges


    It’s easy enough to find some marketing metric on which to measure and report.
    However, creating an analytics process that measures and tracks meaningful things
    is complicated and sometimes difficult for most companies. The challenges to building
    an effective analytics process are broad in scope, ranging from attitudes, skills,
    technology, and resources. Just 6 percent of companies claim not to have any challenges
    related to marketing analytics.[⁶](#A978-1-4842-0259-3_2_Chapter.html#Fn6) Figure
    [2-7](#A978-1-4842-0259-3_2_Chapter.html#Fig7) summarizes the biggest challenges
    that companies have with their marketing analytics efforts.


    ![A978-1-4842-0259-3_2_Fig7_HTML.jpg](Images/A978-1-4842-0259-3_2_Fig7_HTML.jpg)


    Figure 2-7.


    Ninety-four percent of organizations report facing some kind of challenge with
    marketing analytics


    It’s worth noting what isn’t a big challenge to marketing analytics: buy-in or
    support. Over half the participants in the survey from which this data is drawn
    are marketing leaders: CMOs, brand managers, vice presidents of marketing, marketing
    directors, or marketing managers. What they tell us through this survey is that
    getting the buy-in from their own teams is negligible as a challenge. Members
    of the marketing team understand that it is in their best interest to have an
    analytics process. The challenge of securing the support of the executive or management
    team is also negligible. Rightly so, because what executive or manager would essentially
    communicate to the marketing team that it doesn’t desire accountability, ROI,
    or measurable value by failing to encourage an analytics initiative? The lack
    of support from above or below is not a serious challenge to analytics for CMOs.


    The greatest challenge is not having the systems or infrastructure to measure
    and track marketing analytics. The modern marketing organization uses multiple
    channels, most of them digital, and the campaigns and content that marketing produces
    are consumed across multiple devices. The problem this environment creates is
    not a lack of analytics data, but a plethora of it. The volume and variety of
    data coming at the marketing team can leave it feeling like it’s drinking from
    the fire hose. To capture and fully exploit it as part of an analytics process
    requires some technology. The data is simply too vast and varied to deal with
    through manual processes. The analytics initiative needs a technology assist to
    capture the data and make sense of it. [Chapter 8](../Text/A978-1-4842-0259-3_8_Chapter.html)
    explores some of the tools, systems, and technologies that the modern marketer
    can use to overcome the systems challenge of marketing analytics.


    The lack of time or staff for marketing analytics represents another significant
    challenge. Implementing an analytics process is a strategic endeavor, and for
    busy organizations, taking the time to plan and execute it seems analogous to
    changing the tires on the vehicle while it’s still in motion. These busy marketing
    organizations look forward to a time when things are calm enough to allow them
    time to conduct the proper planning to implement analytics well. However, there
    is no such thing as slack time in busy organizations. Most are busy because in
    the absence of an analytics process, activity is the evidence of progress. The
    organizations that claim to not have the time for analytics are the very ones
    that need it most. To them, the notion of stopping the marketing vehicle, even
    to make enhancements that will enable better performance, is anathema.'
