- fmt: "# Marketing Analytics Capabilities\n\nThis chapter has explored the landscape,\
    \ attitudes, and challenges associated with marketing analytics. Having provided\
    \ the big picture, we conclude with a brief, high-level discussion of the capabilities\
    \ and limitations of marketing analytics.\n\nSo far in this book, a number of\
    \ metaphors have represented marketing analytics: dashboards, a servant, guardrails,\
    \ and so on. These metaphors accurately convey an understanding of what marketing\
    \ analytics do: provide direction and guidance. When properly implemented, the\
    \ analytics process emits a steady stream of information that is useful for:\n\
    \n- Understanding marketing’s performance. For internal use, the metrics an analytics\
    \ process uses tell marketing how it is performing. To use the dashboard metaphor,\
    \ when the gauges are in the green, marketing can continue performing its work\
    \ with confidence, even accelerating its efforts. When the gauges are in the yellow,\
    \ it’s an indication that something is about to fail and needs attention. When\
    \ the gauges are in the red, marketing knows with certainty that something is\
    \ broken, and the broken process requires either an overhaul or abandonment in\
    \ favor of something better.\n- Reporting marketing’s performance. For external\
    \ use, the output of the analytics process, or at least part of it, is useful\
    \ to show the rest of the organization that it is getting a return on its investment\
    \ in marketing. Sharing the results of its work create confidence in across the\
    \ organization in what marketing is doing, helping the CMO keep marketing’s seat\
    \ at the big decisions table.\n\nAnalytics deliver these important capabilities\
    \ to the marketing organization. There are also limitations. Analytics don’t lead.\
    \ The process is not the functional equivalent of auto-pilot for the marketing\
    \ team. For the marketing function to thrive and provide the greatest value to\
    \ the companies it serves, it requires strong, visionary leadership from the CMO.\
    \ The CMO’s vision for marketing should include an analytics process. The combination\
    \ of vision and analytics produces the highest performing marketing function that\
    \ can fully account for its work and sustain its contribution. It represents what\
    \ every CEO wants from marketing.\n\n**Footnotes**\n\n[1](#A978-1-4842-0259-3_2_Chapter.html#Fn1_source)\
    \ “Marketing Report Card: Keeping Our Seat at the Table,” Demand Metric Research\
    \ Corporation, March 2014. [http://www.demandmetric.com/content/marketing-report-card-benchmark-report](http://www.demandmetric.com/content/marketing-report-card-benchmark-report).\n\
    \n[2](#A978-1-4842-0259-3_2_Chapter.html#Fn2_source) Ibid.\n\n[3](#A978-1-4842-0259-3_2_Chapter.html#Fn3_source)\
    \ “Marketing Analytics in 2013: Benchmarks, Insights & Advice,” Demand Metric\
    \ Research Corporation, March 2013. [http://www.demandmetric.com/content/marketing-analytics-benchmark-report](http://www.demandmetric.com/content/marketing-analytics-benchmark-report).\n\
    \n[4](#A978-1-4842-0259-3_2_Chapter.html#Fn4_source) Ibid.\n\n[5](#A978-1-4842-0259-3_2_Chapter.html#Fn5_source)\
    \ Ibid.\n\n[6](#A978-1-4842-0259-3_2_Chapter.html#Fn6_source) Ibid.\n\n[7](#A978-1-4842-0259-3_2_Chapter.html#Fn7_source)\
    \ Scott Brinker, The Marketing Technologist: Neo of the Marketing Matrix. [http://chiefmartec.com/2013/12/marketing-technologist-neo-marketing-matrix/](http://chiefmartec.com/2013/12/marketing-technologist-neo-marketing-matrix/).\n\
    \n[8](#A978-1-4842-0259-3_2_Chapter.html#Fn8_source) William Bruce Cameron, Informal\
    \ Sociology: A Casual Introduction to Sociological Thinking. New York: Random\
    \ House, page 13.\n\n# The Impact of Marketing Analytics\n\nShow Me the Money\n\
    \nThe first two chapters hopefully made a convincing argument for marketing analytics.\
    \ It’s not enough, however, to collect all the right data to input into a legitimate\
    \ marketing analytics process. The key to success with marketing analytics is\
    \ in the application. If the results and insights from the process are not used,\
    \ then a marketing analytics initiative is of little value. To benefit the whole\
    \ organization, the analytics must influence the thinking, the decisions, and\
    \ ultimately the way marketing works.\n\nTo look at marketing analytics as just\
    \ a performance management tool misses the point of the process. It is true that\
    \ a proper implementation of analytics can help marketing work better: more efficiently\
    \ and more effectively. Although the analytics process should provide the data\
    \ that helps marketing do more with less, ultimately analytics are about making\
    \ money. The highest and best use of the analytics process is to help marketing\
    \ operate as a revenue center. When the CEO says, in so many words, “show me the\
    \ money,” marketing is able to do so when it has the right analytics data and\
    \ uses it wisely.\n\n> **Note**  \n> Analytics, though useful for improving marketing’s\
    \ efficiency and effectiveness, are ultimately about helping the marketing function\
    \ operate as a revenue center.\n\nFor marketing organizations that have an analytics\
    \ process, there are certainly some extremes to avoid. The first extreme is to\
    \ have an analytics process but then do nothing with the output. The second is\
    \ to have an analytics process and expect its output to serve as the primary source\
