  trans: '

    ### 第三步：采取改进措施


    优秀的企业不相信卓越——他们只相信持续的改进和不断的变化。


    ——汤姆·彼得斯，《追求卓越》


    分析营销指标可以告诉我们正在发生什么以及原因，但如果结果未达到预期，它并不总能告诉我们该怎么做。当结果超出预期时，分析也并不总能帮助我们了解如何复制成功的做法。在这个分析流程步骤中，营销必须确定哪些行动和变化最有可能带来改进。无论分析多么透彻，如果不能导向某种改进措施，那它就是没有价值的。


    有时，改进措施是显而易见的。例如，对一次表现不佳的群发电子邮件进行分析后发现，异常多的电子邮件地址被退回，表明这些地址无效。这里的改进措施很明显：移除无效地址并保持邮件联系人列表为最新。在其他情况下，改进措施并不总是如此明显。


    在另一种场景中，一个`PPC`广告活动表现不佳。将这个表现不佳的`PPC`活动与之前的活动进行比较，发现来自着陆页的点击率（`CTR`）远低于正常水平。分析表明，所有`PPC`活动都采用了相同的策略：为点击广告的用户设置了唯一的着陆网页。着陆页上的优惠或“行动号召”转化与之前表现良好的活动类似。着陆页的流量也在预期参数范围内。那么问题出在哪里？更重要的是，正确的改进措施是什么？


    在这种场景下，着陆页显然存在某些问题，但分析并没有告诉我们如何解决；它只告诉我们问题似乎出在哪里。在这个例子中，问题就出在着陆页本身，因为它没有像之前的活动那样产生相同水平的转化率。为了找到解决方案，营销团队可以进行一些`A/B`测试，这一过程在第
    3 章中简要提及。


    `A/B`测试涉及向访问者展示着陆页的两个版本。`A`版本是对照页面，`B`版本则有一些变化。变化可能包括不同的行动号召文本、图形、不同的页面布局、配色方案或任何可以想到的改动。目标是找出哪些变化表现最佳。两个页面都会呈现给访问者，并密切监控分析数据。访问者自己决定获胜的页面。在这个例子中，获胜页面就是转化率最高的那个。很可能需要进行一系列的`A/B`测试才能完全优化一个活动。


    `A/B`测试以及其他类型的测试和研究，是确定营销应采取何种改进措施的非常有用工具。测试和研究有助于消除改进措施中的猜测成分，但很少有营销人员愿意花时间去做。测试和研究方法的大敌是图省事以及“我们一直这么做”的心态。进行测试、研究并据此决定该做什么，需要时间和自律。承受着快速出成果巨大压力的营销人员往往不愿在投入之前进行市场研究和测试方法，因为这实在太耗时了。但这时间花得值得，因为它有助于确保改进措施一开始就是正确的。因此，测试和研究是确定改进措施的绝佳初始步骤。


    在分析流程的所有步骤中，改进步骤是最少固定程式的。潜在改进措施的范围只受限于负责寻找这些措施的团队的创造力。在寻找要采取的改进措施时，要进行头脑风暴，想尽一切可能的主意。一开始不要拒绝任何想法。然后，在实施改进措施之前，如果可能的话，将候选想法的清单缩小到一个。同时进行太多改进，将使我们难以甚至无法知道哪个改进对绩效提升贡献最大。


    改进总是必要的吗？事情进展得非常顺利时，是否有可能跳过改进步骤？理论上，任何过程总有改进空间。实际上，对于营销正在做的事情，存在一个收益递减点。如果营销任务或活动有绩效目标或标准，并且指标分析表明营销持续达到或超过这些目标，那么营销就可以把时间和改进精力投入到其他地方。请记住，营销应该衡量的范围很广，因此在一个领域的成功并不意味着可以忽略整个分析流程。这仅仅意味着，基于指标分析，表现成功的领域解放了营销，使其可以去调查和改进其他方面。


    这个改进步骤不仅仅是为了应对低绩效。它也关乎复制那些行之有效的做法。分析步骤将识别出卓越的表现，一旦识别出来，营销团队就应该确定如何将导致这种卓越表现的原因应用到未来的工作中。产生理想结果的原因构成了最佳实践的基础，有助于组织持续地达成期望的结果。


    ### 循环往复


    > 你回去吧，杰克，再来一次。——斯蒂利·丹，《再来一次》


    本章描述的三步流程代表了营销分析流程应该执行的方式。每个组织都会对该流程有自己独特的变体，使用不同的指标，得出不同的分析结论，并采取不同的改进措施。然而，这三个步骤是恒定的：衡量、分析和改进。


    仅仅执行一次或断断续续地执行这个流程会产生一些好处，但其最大价值来自于持续使用。重复执行分析流程对于产生一致且持续的改进是必要的。分析的真正优势只有通过长期、持续地执行流程才能体现。每次营销为实现目标而开展工作时，该工作都应属于分析流程的范畴。


    对于每一个营销活动、沟通、事件和投资，在下一个活动、沟通、事件或投资开始之前，都应该完成衡量、分析和改进的循环。调用分析流程的频率当然会因营销的具体工作而异。有些营销行动非常重要，需要实时监控分析数据，而其他的则可能需要每日、每周或每月的审查。


    重要的是不要让自满情绪渗透到流程中。当定期审查指标显示一切正常时，人们很容易放松下来。事实上，在这种情况下，很容易认为营销工作已经调整得如此完美，可以在自动驾驶模式下运行了。这种营销的完美状态很少见，即使出现，也绝不会持续太久。对分析流程保持警惕是确保营销长期取得最佳绩效的方法。


    脚注 1


    约瑟夫·L·利维，“依我之见”，《CIO 企业》，1999 年 9 月 15 日，第 10 页。


    2


    ON24 网络研讨会基准报告，2014 年版。[`http://www.on24.com/wp-content/uploads/2014/04/ON24_Benchmark_2014_Final.pdf`](http://www.on24.com/wp-content/uploads/2014/04/ON24_Benchmark_2014_Final.pdf)

    '
- fmt: "# 5. Getting Started with Analytics\n\nReady, Set, Go!\n\n> Marketing has\
    \ always been a grueling and competitive sport—not unlike running a marathon.\
    \ With the changes in the buying process, in media and technology, and managing\
    \ expectations, it’s like running a marathon as the ground shifts beneath your\
    \ feet. What was already difficult is becoming increasingly difficult. If you’re\
    \ going to do it without measurement, it’s like running a marathon, in an earthquake,\
    \ blindfolded. [¹](#A978-1-4842-0259-3_5_Chapter.html#Fn1) —David Raab\n\nThe\
    \ critical part of any journey is the first step. Taking the first step in the\
    \ marketing analytics journey represents a willingness, commitment, and desire\
    \ to become a data-driven, revenue-oriented marketing organization. But it takes\
    \ more than just desire. Success with marketing analytics requires a plan that\
    \ encompasses resources, preparations, potential hazards one might encounter along\
    \ the way, and contingencies. This chapter provides the framework for developing\
    \ such a plan.\n\nThis chapter assumes that the reader is part of an organization\
    \ that has no analytics process in place and is preparing to begin this journey.\
    \ As Figure [2-4](../Text/A978-1-4842-0259-3_2_Chapter.html#Fig4) revealed, just\
    \ over a quarter of marketing organizations fall into this category. Other organizations\
    \ that are further along can still benefit from the information this chapter shares,\
    \ using it to help benchmark and assess their own process maturity.\n\nThis journey\
    \ has a beginning, but no end. As [Chapter 4](../Text/A978-1-4842-0259-3_4_Chapter.html)\
    \ shared, the marketing analytics process is a continuous loop. There are, however,\
    \ some preparatory steps for those who are just starting the journey and checkpoints\
    \ for those already on it. These milestones include assessing organizational readiness,\
    \ studying business objectives, determining or clarifying marketing objectives,\
    \ and establishing the right set of metrics. The remainder of this chapter explores\
    \ these milestones in greater detail.\n\n> **Note**  \n> The major milestones\
    \ in the marketing analytics journey include assessing organizational readiness,\
    \ reviewing or clarifying business objectives, and establishing the right set\
    \ of metrics.\n\n## Assessing Organizational Readiness\n\n> Most of us spend too\
    \ much time on what is urgent and not enough time on what is important. —Stephen\
    \ Covey, The Seven Habits of Highly Effective People\n\nIf it were possible to\
    \ observe how organizations with a mature marketing analytics process operate,\
    \ you would notice a certain characteristic: they don’t let urgent matters get\
    \ in the way of what’s important. To these organizations, analytics are very important,\
    \ not just in marketing but in all business areas. This kind of operational philosophy\
    \ is actually quite strategic. It’s a reliable indicator that the organization\
    \ is committed to a plan that is well understood, one that is metrics-enabled,\
