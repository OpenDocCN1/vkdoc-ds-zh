- fmt: '关于数据质量的最后一点思考：无论输入营销分析流程的数据多么纯净，那些对流程持（或可能持）批评态度的人也必须了解数据的清洁程度。营销团队在这方面需要承担一定的公关责任。如果营销部门要维护或提升其分析流程的可信度，就必须确保数据是干净的，并且让所有人都知道它是干净的。对数据质量的任何错误认知，都可能摧毁任何分析流程的可信度。


    对流程缺乏信心或信任，无论在选择和跟踪正确指标上投入了多少心血，都会严重阻碍营销分析工作的开展。分析流程中可信度问题的严重性，是分析领域一个非常现实的障碍。图
    [3-3](#A978-1-4842-0259-3_3_Chapter.html#Fig3) 展示了在营销分析可信度范围内，各组织所处的现状。


    ![A978-1-4842-0259-3_3_Fig3_HTML.jpg](Images/A978-1-4842-0259-3_3_Fig3_HTML.jpg)


    图 3-3. 营销分析可信度认知


    图 [3-3](#A978-1-4842-0259-3_3_Chapter.html#Fig3) 所示的数据触及了营销分析流程中信任度的核心。考虑到分析流程应如何运作——即产出数据，帮助营销部门使其工作与战略保持一致并表现出色——一个关键的成功因素是信任。如果分析流程不足以被信任来影响重大决策，那么它的价值何在？因此，该流程的输出必须能够影响决策。只有当流程的相关方对流程及其输出有信心时，它才可能具有影响力。


    目前，只有三分之一的公司声称对其营销分析给予了“良好”或“较高”的可信度。而“中等”、“较低”或“无”可信度的认知则表明存在怀疑。这些可信度数据表明，仅仅拥有一个健全的营销分析流程是不够的；该流程还必须赢得相关方的信任，以便分析能够影响决策。对营销分析流程的真正试金石是：公司是否愿意根据流程提供的指导做出严肃决策并投入资源？[第
    5 章](../Text/A978-1-4842-0259-3_5_Chapter.html)详细阐述了一个帮助组织实施健全营销分析流程的计划，该计划的一部分包括在流程输出中建立信任和信心的努力。


    ## 分析与决策制定


    最终，营销分析流程应提供有助于做出更好决策的数据。正如[第 1 章](../Text/A978-1-4842-0259-3_1_Chapter.html)所讨论的，营销组织中的分析并非为了让决策过时，而是为决策提供信息。在做出决策后，分析还有另一个用途：判断这些决策是否正确。最成熟的营销分析流程在决策前和决策后阶段都会使用分析。


    为了理解分析如何为决策提供信息并随后验证决策，让我们设想一个营销团队面临挑战时的假设性决策情景。假设你是首席营销官（CMO）。在一次高管团队会议上，首席财务官（CFO）报告称，本季度的收入预测显示将“未达标”50
    万美元。经过一番讨论，首席执行官（CEO）转向你，CMO，要求你想办法弥补预测的收入缺口。


    如果你所处的营销组织很少或根本不使用分析，你会怎么做？你仍然需要做出决策，并且会依赖你的经验和直觉。有时，这种方法对组织有益，但有时则不然。这就像掷骰子，在这种情况下，你会希望已经有一个分析流程可以提供一些见解。


    与 CEO 开完会后，你的第一站是销售副总裁。你们俩必须共同决定收入将从何而来：新客户、现有客户，还是两者兼有？由于公司已实施客户关系管理（CRM）和营销自动化系统，做出明智决策所需的指标是现成的。你知道的是，将一个合格的潜在新客户培养到成交的平均销售周期是六个月。此外，分析告诉你，销售团队成功将你们接触的合格潜在客户中的
    30% 转化为销售。以平均销售额 5000 美元计算，你需要达成 100 笔新销售才能填补收入缺口。根据你的销售转化率，营销团队需要识别出 330 个新的合格潜在客户，才能获得
    50万美元的新收入。


    问题在于：你来不及在本季度结束前产生 330 个新的合格潜在客户，并让至少其中 100 个完成六个月的销售周期。因此，你继续与销售副总裁进行商议，审视销售管道中已经在跟进的机会。同样，由于你使用了适当的系统（这里指
    CRM），你可以获取相关数据。


    与销售副总裁合作，你分析了管道数据，移除了本季度预计会转化的潜在客户。这样做之后，你发现销售管道中有 285 个合格的潜在客户被搁置。这些机会是作为合格潜在客户进入管道、已经经历了部分购买周期，但由于各种原因，要么没有引起销售团队的足够重视，要么没有被营销部门培育。


    你和销售副总裁断定，这 285 个现有的合格潜在客户代表了在本季度末弥补 50 万美元收入缺口的最佳机会。一个担忧是，平均转化率告诉你，你可以期望将这些潜在客户中的
    30% 转化为销售。按此转化率，仅有 285 个潜在客户，你将获得约 85 笔销售，即 42.5 万美元，距离填补收入缺口还差 7.5 万美元。过去的经验告诉你，采用相同的方法会产生相同的结果。你花了几分钟时间大声思考，尝试一些新方法来培育管道中这些被忽视的潜在客户。离开销售副总裁办公室时，你承诺会让你的团队制定一个计划，以更高的转化率来转化这
    285 个潜在客户。'
  raw: 'A last thought about data quality: regardless of how pristine the input data
    for the marketing analytics process is, those who are (or would be) critics of
    the process must understand the level of cleanliness. There’s a public relations
    burden the marketing team must shoulder in this regard. If marketing is going
    to preserve or promote the credibility of its analytics process, it must ensure
    that the data is clean and that everyone knows it is clean. A flawed perception
    of data quality can sink the credibility of any analytics process.


    A lack of faith or credibility in the process, no matter how much care went into
    selecting and tracking proper metrics, severely hobbles a marketing analytics
    effort. The seriousness of the credibility issue with analytics is a very real
    obstacle on the analytics landscape. Figure [3-3](#A978-1-4842-0259-3_3_Chapter.html#Fig3)
    provides a snapshot[⁵](#A978-1-4842-0259-3_3_Chapter.html#Fn5) of where organizations
    land on the spectrum of marketing analytics credibility.


    ![A978-1-4842-0259-3_3_Fig3_HTML.jpg](Images/A978-1-4842-0259-3_3_Fig3_HTML.jpg)


    Figure 3-3.


    Marketing analytics credibility perception


    The data represented in Figure [3-3](#A978-1-4842-0259-3_3_Chapter.html#Fig3)
    gets to the heart of how much trust exists in the marketing analytics process.
    Considering how the analytics process should work—producing data that helps marketing
    keep its efforts aligned with strategy and performing well—a critical success
    factor is trust. What value is the analytics process if it isn’t trusted enough
    to influence big decisions? The output from the process, therefore, must influence
    decision making. It can only have influence if the process stakeholders have confidence
    in the process and its output.


    Currently, just one-third of companies say they attach “good” or “high” credibility
    to their marketing analytics. Credibility perceptions of “moderate,” “low,” or
    “no” credibility indicate skepticism. This credibility data reveals that it isn’t
    enough to have a sound marketing analytics process; the process has to enjoy the
    confidence of its stakeholders so that analytics can influence decisions. The
    true litmus test for a marketing analytics process is this: is the company willing
    to make serious decisions and commit resources based on the guidance the process
    provides? [Chapter 5](../Text/A978-1-4842-0259-3_5_Chapter.html) detail a plan
    for helping organizations to implement a sound marketing analytics process, and
    part of that plan includes efforts to create trust and confidence in the process
    output.


    ## Analytics and Decision Making


    Ultimately, a marketing analytics process should provide data that facilitates
    better decision making. As discussed in [Chapter 1](../Text/A978-1-4842-0259-3_1_Chapter.html),
    analytics exist in the marketing organizations not to make decision making obsolete,
    but to inform decisions. After decisions are made, analytics have another use:
    to determine whether those decisions were the right ones. The most mature marketing
    analytics processes use analytics in both the pre– and post–decision-making phases.


    To understand how analytics can inform and then validate decisions, let’s walk
    through a hypothetical decision-making situation for a marketing team confronted
    with a challenge. Imagine that you are the CMO. During a meeting of the executive
    team, the chief financial officer (CFO) reports that revenue projections for the
    quarter show a “miss” by half a million dollars. After some discussion, the CEO
    turns to you, the CMO, with a charge to figure out how to make up the projected
    revenue shortfall.


    If you were in a marketing organization that did not use analytics or didn’t use
    them much what would you do? You would still make decisions, and you would use
    your experience and intuition. Sometimes, this approach would serve the organization
    well, but other times it wouldn’t. It’s a roll of the dice, and in situations
    like these you wish an analytics process was already in place to provide some
    insight.


    After the meeting with the CEO, your first stop is the VP of sales. Together,
    the two of you must determine where the revenue will come from: new customers,
    existing ones, or a combination of both? Because the company has implemented CRM
    and marketing automation systems, the metrics you need to make a wise decision
    are available. What you know is that the average sales cycle to take a new, qualified
    prospect to close is six months. Furthermore, the analytics tell you that your
    sales team successfully converts into a sale 30 percent of qualified prospects
    with which you engage. With an average sale of $5,000, you’ll need 100 new sales
    to close the revenue gap. Given your sales conversion rate, the marketing team
    will need to identify 330 new, qualified prospects to get $500,000 in new revenue.


    Here’s the problem: you don’t have time to generate 330 new, qualified leads,
    and take at least 100 of them through the six-month sales cycle before the end
    of this quarter. Therefore, you continue your deliberations with the VP of sales
    by reviewing the opportunities in the sales pipeline that are already in process.
    Again, because you use the proper systems—in this case, CRM—you have the data
    available.


    Working with the VP, you analyze the pipeline data, removing the leads that are
    already projected to convert this quarter. After doing this, you discover is that
    there are 285 qualified leads languishing in the sales pipeline. These are opportunities
    that entered the pipeline as qualified leads, have gone through part of the buying
    cycle already, but for various reasons have not warranted the attention of the
    sales team or have they been nurtured by marketing.


    You and the VP determine these 285 existing qualified leads represent the best
    opportunity to make up the $500,000 revenue shortfall by the end of the quarter.
    One concern is that the average conversion rate tells you that you can expect
    to turn 30 percent of these leads into sales. At that conversion rate, with just
    285 leads you’ll gain about 85 sales or $425,000, falling short of filling the
    revenue gap by $75,000. Past experience has taught you that taking the same approaches
    produces the same results. You think out loud for a few minutes about trying some
    new approaches to nurture these neglected leads in the pipeline. Leaving the VP’s
    office, you pledge to put your team to work on a plan to convert these 285 at
    a higher rate.'
