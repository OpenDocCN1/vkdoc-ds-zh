- fmt: '# 2. The Marketing Analytics Landscape


    ## Facts, Attitudes, and Challenges


    When viewing marketing as an entity, you can perceive it as having a persona,
    similar to the three types [Chapter 1](../Text/A978-1-4842-0259-3_1_Chapter.html)
    describes: no analytics, pseudo-analytics, or real analytics. These personas represent
    a spectrum of how the marketing team operates and creates value. On one end of
    the spectrum, marketing is reactive and operationally oriented, managed by the
    perpetually busy, "hair on fire" type of manager. Occupying the other end of the
    spectrum are organizations where marketing is a strategic asset, providing leadership
    to the whole company through a visionary leader executing a plan that aligns with
    corporate strategy. The foundation of that plan is a set of analytics that functions
    as guardrails to help marketing stay on course.


    On the operational side of this spectrum, marketing delivers incremental value
    at best, and it faces a constant struggle to justify not only its budget but its
    very existence. On this spectrum''s strategic side, marketing is a major driver
    of the company''s success. Because it uses analytics effectively, marketing has
    no trouble proving its worth. As a strategic, revenue-generating asset, marketing
    easily justifies its existence and provides a return on the investment made in
    it.


    The relevance of any marketing organization depends on its ability to shift from
    an operational orientation to a strategic one, and many marketers aspire to help
    their organizations make this transition. Making this shift is imperative for
    marketing to change its perception as a tolerated expense to that of a valued
    revenue center. From a leadership vantage point, there''s a lot riding on marketing''s
    ability to make this shift, because operational marketing organizations don''t
    enjoy much influence.


    Most marketers are not ignorant of the need to make this shift, but the pace of
    change at times seems absolutely glacial, frustrating the marketing team and the
    leaders to whom they are accountable. Generating lift for marketing are a growing
    array of technology solutions, tools, methods, channels, skills, and leadership
    that marketers are developing or exploiting. Figure [2-1](#A978-1-4842-0259-3_2_Chapter.html#Fig1)
    depicts the tremendous diversity of the marketing technology landscape, with virtually
    every solution having the capability to participate in or contribute data to a
    marketing analytics initiative.


    > Technology decisions and marketing strategy are intertwined. —Scott Brinker,
    Rise of the Marketing Technologist


    ![A978-1-4842-0259-3_2_Fig1_HTML.jpg](Images/A978-1-4842-0259-3_2_Fig1_HTML.jpg)


    Figure 2-1.


    The Chiefmartec.com marketing technology landscape reveals the diversity and complexity
    of the marketing solutions landscape. Used with permission


    The very complexity of the marketing technology landscape, however, is daunting
    because marketers assess myriad solutions that can help them attribute business
    results to their activities. The technology challenges, however, are temporary,
    and a marketing analytics initiative can''t take flight without some supporting
    systems and sources of reliable data. What creates the most drag against a marketing
    analytics initiative are attitudes, usually within organizations but sometimes
    within the organizations those marketers serve.


    Modern marketers generally understand how important it is to have the marketing
    team function as a revenue center, where that revenue contribution is quantified
    and reported through an analytics process. When marketing exists as an expense
    instead of a revenue center, it''s in jeopardy because it ranks high on the short
    list for cutbacks when the company experiences financial pressure. Functioning
    as a revenue center helps marketing not only survive but thrive when the company
    needs its services in difficult times. For this reason, even when CMOs haven''t
    completely figured out how to transform their team into a revenue center, they
    steadily press on with this shift because it is imperative to the long-term survival
    of marketing.


    From a macro perspective, how is marketing viewed today—as an expense or a revenue
    center? Demand Metric Research Corporation completed a study[¹](#A978-1-4842-0259-3_2_Chapter.html#Fn1)
    during the first quarter of 2014 that provides the answer. The first thing this
    study attempted to learn is the financial perception of marketing inside a company.
    Figure [2-2](#A978-1-4842-0259-3_2_Chapter.html#Fig2) displays the results from
    more than 250 study participants, most of whom were marketers, indicating how
    their marketing function is perceived inside their organization.


    ![A978-1-4842-0259-3_2_Fig2_HTML.jpg](Images/A978-1-4842-0259-3_2_Fig2_HTML.jpg)


    Figure 2-2.


    The dominant internal view of marketing is as an expense


    This data is a good indicator of the current state of marketing analytics, because
    the best tool for changing the perception of marketing as an expense is an analytics
    process. Further analysis of the data in this study reveals that of those organizations
    viewing marketing as an expense, half don''t use analytics at all or only to a
    slight extent. For whatever reasons, they are denying themselves the best means
    to guide their efforts and show accountability to the rest of the organization.


    By contrast, for the organizations represented in Figure [2-2](#A978-1-4842-0259-3_2_Chapter.html#Fig2)
    that perceive marketing as a revenue center, merely 16 percent report not having
    an analytics process. Any company that has properly implemented customer relationship
    management (`CRM`) and marketing automation systems, and also manages the quality
    of data in these systems, will have access to the information necessary to demonstrate
    not just relevance but revenue impact. There is no other way for the modern marketing
    organization to function.


    **Note**


    There is a strong relationship between marketing''s perception as a revenue center
    and the use of an analytics process.


    Modern marketers won''t argue that the way for the marketing function to operate
    is as a revenue center, one that is indispensable to the rest of the organization.
    What characterizes an "indispensable" marketing organization? We need some characteristics
    more detailed than "produces revenue" to understand how these kinds of marketing
    organizations operate and differ from the ones perceived as cost centers. Figure
    [2-3](#A978-1-4842-0259-3_2_Chapter.html#Fig3) reveals the three key characteristics
    of marketing organizations described as "we would not achieve our business objectives
    without marketing''s contribution"—or in other words, indispensable—in a survey
    on marketing analytics.[²](#A978-1-4842-0259-3_2_Chapter.html#Fn2) When using
    these three characteristics to compare these indispensable marketing organizations
    to all marketing organizations, there are significant differences.


    ![A978-1-4842-0259-3_2_Fig3_HTML.jpg](Images/A978-1-4842-0259-3_2_Fig3_HTML.jpg)


    Figure 2-3.


    "Indispensable" marketing organizations exhibit three characteristics: strategic
    orientation, sales and marketing alignment, and analytics-driven'
