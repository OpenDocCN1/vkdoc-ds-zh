    # 排版后的内容


    从愿景开始。拥有愿景是成功利用大数据分析的起点。愿景为努力指明方向，且越具体的愿景越好。一个良好的愿景示例是：了解哪些客户最有可能流失。理想情况下，你为大数据分析设定的愿景应与具体的业务目标保持一致。获取并培养技能。大多数营销团队不具备内部技能来推行大数据分析项目。在深入大数据领域之前，评估你的技能并找出不足之处，制定计划加以弥补。这些不足通常是技术技能，在初期用于设计和实现支持分析工作的大数据架构时必不可少。初期可借助顾问和外部服务来弥补技能差距。确定试点项目。通过利用大数据解决真实的营销问题来证明其价值，即使规模很小。试点项目有助于证明对大数据分析进行长期投资的商业案例，并建立必要的内部支持。它能清晰聚焦推进所需的技能，帮助定义衡量未来成功的正确指标，并明确进一步推进所需的架构要素。设计大数据架构。根据你对大数据分析的愿景和目标，规划实现它们所需的架构。你的架构范围将包括支持组织中大数据分析所需的系统设计、数据流、时间安排和数据模型。评估不同的大数据工具和平台，提出建议并进行采购。呈报大数据商业案例。成功的试点项目经验、技能评估和架构计划是创建商业案例的必要组成部分，该案例应能轻松获得批准，以加大在大数据分析方面的投资。


    大数据通常始于公司的商业智能部门。企业正在利用大数据分析来理解并吸引客户，从而激发更高的忠诚度。他们可以做出更明智、数据驱动的决策，抓住机会提升营销投资回报率、开发新机遇、针对特定目标市场定制促销活动，并帮助优化营销策略。


    ## 预测分析


    > 任何足够先进的技术都与魔法无异。 —阿瑟·C·克拉克


    任何关于大数据和营销的讨论常常会引出预测分析这一话题。虽然这些术语或过程不能互换，但大数据与预测分析是相辅相成的。预测分析“利用统计学、机器学习、数据挖掘和建模来分析当前和历史事实，以对未来事件进行预测。”⁴
    虽然它仍属于分析范畴，但因其前瞻性而截然不同。所有其他类型的营销分析都告诉我们已经发生了什么——也许非常近期发生——但仍然是回顾性的。预测分析使营销人员能够以惊人的准确性预知将要发生的事情。一些人通过使用预测分析获得的结果几乎像是魔法一般。


    营销人员使用的大多数自动化和分析工具虽然非常有帮助，但它们提供的是潜在客户生成过程绩效的历史视图。事实上，营销人员能够非常精确地了解各项活动的表现以及营销漏斗中的瓶颈所在。然而，这项技术无法充当能够显示漏斗中潜在客户未来转化情况的水晶球。营销人员发现自己正试图从历史分析数据中——即通过后视镜——挖掘出最大的价值，以从活动和潜在客户生成过程中榨取最后一滴绩效。而预测分析所做的正是为销售和营销部门提供那个水晶球：对漏斗中哪些潜在客户会购买以及何时购买做出准确预测。


    最好将预测分析视为“预测智能”，它伴随营销人员构思创新方式，通过各种内容、促销和优惠与潜在客户及现有客户建立联系。它帮助营销人员了解漏斗中潜在客户的购买倾向，从销售角度区分良莠。预测分析能预测客户对这些影响策略的响应程度。它审视这些策略可能产生的积极和消极结果，向营销人员展示哪些人最不可能回应优惠，哪些人最有可能购买或回应优惠。


    > **注意**

    >

    > 预测分析帮助营销人员了解销售漏斗中潜在客户的购买意愿及购买时机。


    因此，预测分析在利润公式的成本和收入两端都发挥作用。通过了解哪些人最不可能回应优惠，营销部门可以节省预算，将这些数据库中的潜在客户从未来的直邮或电话营销活动中剔除，或许选择通过成本更低的渠道进行接触。相反，当预测分析帮助营销人员了解哪些人最有可能回应时，营销部门可以通过向那些最可能接受的潜在客户提供优惠来增加收入。


    从组织角度来看，预测分析有助于推动收入增长。从营销角度来看，它有助于维持较高水平的绩效。没有预测分析，营销活动就只能依赖试错法，不断尝试确定活动和媒介组合参数的最佳搭配，以从努力中挤出一些增量改进。预测分析可以缩短这一试错过程，通过准确预测潜在客户购买的可能性、购买量、购买内容以及购买时间来实现。'
- fmt: '# Predictive Analytics and Personalization


    A technology that is a powerful adjunct to predictive analytics is personalization,
    the dynamic customization of the digital content that is presented to visitors
    based on known characteristics and preferences. Consumers experience this on a
    regular basis when they visit sites like `Amazon.com` or `Netflix`. These companies
    use predictive analytics to understand the interests of their visitors and then
    suggest other things to view or buy. A spokesperson for `Netflix` described how
    the company employs predictive analytics: “We monitor what you watch, how often
    you watch things. Does a movie have a happy ending, what’s the level of romance,
    what’s the level of violence, is it a cerebral kind of movie or is it light and
    funny?”[⁵](#A978-1-4842-0259-3_10_Chapter.html#Fn5) So far, business-to-consumer
    marketers have done the best job of using predictive analytics, and business-to-business
    marketers are learning how by observing them.


    The place predictive analytics begins is with the data captured in an organization’s
    Customer Relationship Management (`CRM`) and marketing automation systems. This
    data provides marketers with a digital profile of a prospect based on their interactions
    with the company’s digital outreach: web visits, email opens, and so on. This
    is where big data enters the picture: this digital profile is combined with publicly
    available data from a wide variety of sources, for example, social media posts.
    Comparisons are made to the characteristics of successful sales transactions,
    and predictions are made. Although this process is conceptually simple, predictive
    analytics is about adding more sources of data and analyzing all of it to better
    predict which prospects are signaling an intent to buy.


    Given the capabilities of predictive analytics, it’s not hard to understand why
    marketers are embracing it. It has, however, largely been the domain of large
    enterprises, because it takes some resources and expertise to put the infrastructure
    in place. Until recently, if a marketing team didn’t have the role of “data scientist”
    on its organization chart, then the chances were slim that it was doing predictive
    analytics. Now, however, a number of solution providers are offering cloud-based
    services to help make predictive analytics accessible to the masses. In short,
    it is becoming more mainstream and easier to do.


    Now is the time for marketers to understand the capabilities and benefits of predictive
    analytics. To embrace the intelligence it provides seems like a no-brainer, but
    it’s not for everyone. For example, if a company’s products are not bought via
    a considered purchasing process—one that advances through the stages of need awareness,
    discovery, consideration, and decision—then predictive analytics is not a great
    fit. In other words, for impulse-purchased products, predictive analytics won’t
    provide much value. When a company’s solutions are acquired via a considered purchase
    process, there are still readiness issues to consider. Chief among them is the
    cultural readiness necessary to commit to and get success from predictive analytics.
    Analytics-averse organizations are far from ready to take the plunge; a data-driven
    orientation is a prerequisite for success.


    ## Advanced Attribution


    > Think of attribution as the peanut butter to analytics’ jelly. Yes, each is
    great on its own, but for many, they’re even better together. —Natasha Moonka
    and Bill Kee


    An ongoing challenge for marketers is proving how their efforts are responsible
    for generating business results. Marketers intuitively understand that their work
    bears some fruit, but the degree to which it does is often hazy because it is
    hard to know with precision how campaigns, advertising, and promotions blend together
    to produce results. If marketing ran a single campaign using a single media channel,
    then the task of attributing business results to these efforts is simple. But
    modern marketing takes place in a complex arena, with an intricate customer journey
    that is largely hidden from the marketer. It occurs across multiple devices and
    through mixed media types delivered through multiple channels. How can marketing
    know with any certainty which part of that media stream produced the result? Marketers
    know that some part of the stream of media it produces has influence, but which
    part? The knowledge of how to accurately attribute results to efforts would provide
    a powerful means of optimizing marketing efforts.


    Back in the pre-Internet days, marketers could drop a direct mail piece to prospects
    and wait for responses. It was easy to match responses to the mailing and determine
    the conversion rate. The analytics to determine cost per customer acquisition
    and the `ROI` for the campaign were also simple. It wasn’t difficult to know what
    to attribute campaign conversions to, because the direct mail piece was the only
    element in the media stream that could produce it.


    Today, the Internet is the primary marketing platform, and the number of online
    channels available to marketers continues to proliferate. Marketers use many of
    them simultaneously, and the more they use, the more difficult it is to get clarity
    about which components are most responsible for conversions and which ones are
    not pulling their weight. What is known is that the collective influence of the
    marketing media stream produces conversions. But which part did the best job of
    creating awareness? Which was best at triggering the purchase? The fallback position
    for many marketers has been simply to assign full conversion credit to the last
    piece of media in the stream, no matter how diverse the media stream was. This
    “last click” method of attribution, however, is imprecise.


    Marketers need to know much more about how all their media perform so they can
    optimize the whole stream. Simply attributing credit for conversion to the last
    clicked element in the media steam is a wholly inaccurate approach, because the
    volume of media in use by most marketers is substantial and varied. The longer
    the media stream and the more varied it is, the less likely that last touch attribution
    accurately reports which part was most responsible for a conversion. The variety
    of channels makes accurate attribution difficult, and further complicating the
    attribution dilemma is the way customers consume content across multiple devices.
    A sales transaction may start online through a computer but end up being completed
    on a mobile device.'
