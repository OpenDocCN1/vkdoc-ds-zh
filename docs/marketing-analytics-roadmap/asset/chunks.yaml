    not merely a concerned passenger.”[²](#A978-1-4842-0259-3_5_Chapter.html#Fn2)


    The third skill requirement to assess is the ability to understand what the marketing
    analytics mean and what to do about it. Perhaps the best way to describe this
    is as insight. The analytical and technical skills will yield a result as an output
    of the process, but without the capability to draw insights from these results,
    the marketing analytics process will disappoint. The skill of drawing insights
    out of the analysis is often the result of experience, inquisitiveness, outside-the-box
    thinking, and the ability to see the big picture. Someone who is good at making
    the complex seem simple and who can see the inferences in the results will often
    have this skill.


    This skill area is difficult to describe and even more difficult to measure. What
    kind of people have these skills? They are generally those who have the capacity
    to process a lot of input, view it objectively, draw inferences from it, and see
    what isn’t obvious. They have excellent critical thinking skills and are not prone
    to jumping to conclusions. People who have this kind of insight are able to look
    beyond the numbers and discern what the numbers mean. Their ability to understand
    the implications of the marketing analytics process output is crucial to the effort.
    Some may argue that what is described here isn’t a skill at all but in inborn
    talent. Whatever it is, having this capability is important to the success of
    a marketing analytics effort.


    Communications are the fourth and final skill area to assess. Marketing can build
    amazingly accurate mathematical models of their work, perform detailed analysis
    of its marketing analytics data, and draw insightful conclusions about the implications
    of it all, but get no benefit from it if the results aren’t communicated well.
    The communication that must occur goes far beyond simply distributing reports.
    What is needed is a communicator who can speak with authority and conviction about
    the insights gained through the marketing analytics process.'
  trans: "\n# 在抵制性文化中，营销分析是否有机会？\n\n在那些企业文化本身构成障碍的组织中，营销分析是否还有成功的机会？事实上，是有机会的。文化演进和营销分析可以并行进行。尽管这些组织的文化可能不支持正式的营销分析计划，但它通常可以以\"\
    隐身\"模式启动。无需大张旗鼓，甚至无需官方认可，就有可能从小处着手，取得一些成功，然后谨慎地扩大营销分析的范围。这个想法很简单：创造一些成功，那么组织就很难否认这项工作的价值。一系列小而真实的营销分析成功案例，有助于推动文化变革。\n\
    \n拥有部分或全部催化剂文化属性的组织，可以满怀信心地推进，因为他们知道自己的环境是开展营销分析计划的理想场所。\n\n## 技能：需要评估的第二个领域\n\
    \n技能是需要评估的第二个领域。营销分析的成功需要四种关键的技能组合：分析能力、技术能力、洞察力或理解力，以及沟通能力。很难找到一个人同时具备这四种关键技能，但在希望开展营销分析的组织中，所有这些技能都必须存在。\n\
    \n> **注意**  \n> 营销分析的四个关键技能领域是：分析能力、技术能力、洞察力或理解力，以及沟通能力。\n\n### 分析能力\n\n第一个技能要求或许是最显而易见的：分析能力。这种能力实际上代表着一种探究数据以了解其所能揭示内容的渴望，以及构建和处理数据集与模型所需的统计和数学技能。天生具有分析头脑的人可以学习数学和建模技能。然而，对分析工作毫无兴趣的人，即使学习了这些技能，也会感到吃力。\n\
    \n一个人或一个组织需要具备什么样的分析能力才能在营销分析中取得成功？最初，要求并不十分严格。刚刚开始进行营销分析的组织会发现，跟踪和分析基本指标并不需要高级的分析技能。这更简单地归结为是否有纪律去完成工作，而这可能只不过是对数据进行审查。在早期阶段，大部分分析工作简单到只需获取数据、审查数据，然后据此决定下一步行动。\n\
    \n随着组织营销分析成熟度的提高，其熟练程度也会随之提升。营销分析流程的推进和成熟将导致需要使用基础的、应用性的统计技术，不仅要检查单个指标，还要检查其中一些指标之间的关系。交叉表和相关性分析等技术可以更深入地理解分析数据，有助于解释营销生态系统中某一部分的变化如何可能产生涟漪效应，从而影响另一部分的结果。使用像\
    \ `SAS` 或 `SPSS` 这类统计工具的实践经验可以帮助分析人员执行这种更深层次的分析。\n\n长期以来，深入了解客户行为一直是市场营销的圣杯，也是大数据分析在市场营销中的一项应用。要获得关于客户及其行为的宝贵洞察，营销人员需要利用各种大量、结构化和非结构化的客户交易数据。构建与大数据和预测分析相关的数据集和模型需要高级的数学和分析技能。第\
    \ 10 章将更详细地介绍大数据分析。通过大数据分析和预测分析所能获得的洞察，对许多公司来说具有变革意义。从事此类分析工作所需的高级技能代表了营销分析光谱中最成熟的终点，这需要花费一些时间和经验才能达到。\n\
    \n### 技术能力\n\n第二个技能要求领域是技术能力：熟练地检索数据并使用分析工具对其进行处理。这可以被视为一种 IT 技能组合。营销分析流程作为输入所使用的数据，通常存在于企业内的各个系统中。没有一个包含该流程可能所需所有数据的\"\
    记录系统\"来专门服务于营销分析。营销人员需要技术技能来从存储数据的地方检索数据，而满足这一需求的技术要求从非常简单到非常复杂不等。\n\n有些数据可以通过使用简单的图形界面，对存储数据的系统进行易于构造的查询来检索。其他系统则需要数据库编程技能，例如使用结构化查询语言（`SQL`）从存储数据的数据库中检索所需内容。随着营销分析流程的成熟，很可能需要将来自多个来源的数据合并到一个数据库中，以便对其进行分析、从中得出重要见解并报告结果。这通常需要使用商业智能工具。因此，营销分析就绪性评估的一部分必须考虑营销部门是否能够接触到支持该流程所需的技术技能。\n\
    \n分析和技能通常出现在同一个人身上；即使不是，擅长其中一项技能的人也倾向于学习另一项。然而，这种技能组合在营销团队中往往难以找到，这一点必须改变，不仅是为了分析，也是为了所有越来越以技术为基础或由技术驱动的营销工作。正如\
    \ Chiefmartec.com 博客的作者斯科特·布林克所说：\"你必须成为营销技术的驱动者，而不仅仅是一个忧心忡忡的乘客。\"²\n\n### 洞察力或理解力\n\
    \n需要评估的第三个技能是理解营销分析的含义以及如何据此采取行动的能力。也许描述这一能力的最佳方式是将其称为洞察力。分析和技术技能会产生流程输出结果，但如果缺乏从这些结果中提取洞察的能力，营销分析流程就会令人失望。从分析中提取洞察的技能通常是经验、好奇心、跳出框框思考的能力以及纵观全局的能力共同作用的结果。擅长化繁为简、并能从结果中看出推论的人通常具备这种技能。\n\
    \n这个技能领域难以描述，更难以衡量。什么样的人具备这些技能？他们通常是那些有能力处理大量输入信息、客观地审视它们、从中归纳推断，并看到那些不明显之处的人。他们拥有出色的批判性思维能力，且不容易仓促下结论。拥有这种洞察力的人能够超越数字本身，辨别出数字所代表的含义。他们理解营销分析流程输出结果所蕴含意义的能力，对于整个努力至关重要。有些人可能会争辩说，这里所描述的根本不是一种技能，而是一种与生俱来的天赋。无论如何，拥有这种能力对于营销分析工作的成功至关重要。\n\
    \n### 沟通能力\n\n沟通能力是需要评估的第四个也是最后一个技能领域。营销人员可以为其工作建立惊人准确的数学模型，对营销分析数据进行详细分析，并对其所有潜在影响得出富有洞察力的结论，但如果结果没有得到很好的沟通，就不会从中获得任何好处。所需的沟通远不止简单地分发报告。需要的是一个沟通者，他能够以权威和信念讲述通过营销分析过程所获得的洞察。\n"
- fmt: '围绕营销分析流程所必须进行的沟通，不仅仅是报告结果。（如果只是这样，那么一封简单的电子邮件就足够了。）相反，所需要的是一位能够客观传达分析所反映情况的领导者，帮助组织中的其他成员不仅理解，而且信服这些分析。这些沟通既有正式的，也有非正式的。代表营销分析流程进行沟通的人，既要在董事会会议室向高管做演示，也要能在茶水间进行闲聊式的交流。


    在这种背景下进行沟通，其技巧之一在于知道传递信息的详细程度。营销分析当然可能包含很多细节。有些人需要了解流程的复杂性，而另一些人则只想要结果摘要。负责流程沟通的人必须始终清楚受众是谁以及他们的信息需求是什么。用一个比喻来说，问“现在几点了？”的高管，并不想听到一套关于如何制造手表的说明作为回答。一个非常熟悉分析流程的人很容易沟通过度，但这通常不会赢得人们的认可。善于沟通营销分析的人懂得如何简洁地传达意思，同时在必要时提供细节。


    沟通营销分析的人还必须担任流程的教师和布道者。这需要具备洞察力，以识别哪些人不理解流程的价值和结果，然后对他们进行教育。同样，沟通者也需要不断地推广该流程，确保组织理解这些结果不仅有益于营销职能，而且有益于整个组织。因此，沟通者是营销分析流程的领导者、教师、说服者、捍卫者、推广者和倡导者。


    最后，沟通者必须理解保持透明度的必要性。组织不能有选择地只在分析显示营销产生良好结果时才进行沟通。无论分析结果如何显示营销绩效，沟通都必须进行。这就是分析流程的问责维度，如果流程要发挥作用，营销部门就不能回避或审查其输出。营销部门运用分析的能力越强，其报告良好结果的频率就越高。即使情况并非如此，正确的企业文化也会因营销团队的透明而尊重他们。


    与前两项技能要求（分析和技术）一样，洞察力和沟通技巧也很可能集中在同一个人身上。与前两项技能不同，后两项技能通常存在于营销团队内部。然而，罕见的是同一个人拥有所有这些关键技能。因此，营销分析最好被视为一项团队协作，由几个具备必要技能的人，在一个对运用分析有远见的领导者指导下共同努力。


    尽管分析和技术能力是硬技能，而洞察力和沟通是软技能，但它们同等重要。表[5-2](#A978-1-4842-0259-3_5_Chapter.html#Tab2)提供了一个简单的评估机制，用于对当前开展分析所需的技能进行评级。用它来盘点并评估你所在组织中可用于营销分析的当前技能。在表中每项技能对应的列中，勾选代表你当前状态的选项，并制定计划来解决任何不足之处。


    **表5-2.** 营销分析关键技能清单/评估


    | 技能 | 熟练 | 粗略掌握 | 缺失 | 未知 |

    | :--- | :--- | :--- | :--- | :--- |

    | 分析技能 | | | | |

    | 技术技能 | | | | |

    | 洞察力 | | | | |

    | 沟通能力 | | | | |


    下一个需要评估的主要领域是数据。你是否能获取所需的数据来支持你为营销分析流程定义的指标？挑战在于，实际上并不存在一个包含营销部门支持稳健分析流程所需一切数据的“系统记录”。[第4章](../Text/A978-1-4842-0259-3_4_Chapter.html)讨论了为此流程识别指标的过程。首先确定指标很重要，这样数据的可用性就不会过度影响测量的内容。换句话说，不要让“尾巴摇狗”：不要因为你有数据就只衡量你能衡量的东西。衡量你应该衡量的东西，并想办法获取相关数据。


    要评估你是否拥有作为营销分析流程输入所需的数据，首先研究你选择的用于跟踪、分析和报告的指标。这些指标需要什么数据？这些数据存在吗？如果存在，在哪里？如果不存在，是否可以获取？要能够访问营销分析项目所需的准确、可靠的数据，需要付出多少努力？你的数据可用性评估必须回答这些问题。


    尽管没有单一的营销记录系统，但一些系统提供了大部分必要的数据，至少对于基本指标是如此。例如，一个正在执行数字营销策略并使用营销自动化解决方案的组织会发现，它衡量着陆页访问量或行动呼吁按钮点击量（转化）所需的大部分数据都会被自动捕获，并且易于访问。同样，一个组织需要了解的关于其网站性能的几乎所有信息都可以通过使用`Google
    Analytics`获得。大多数基本销售活动指标、网络指标和数字营销指标的数据都可以在客户关系管理（`CRM`）、营销自动化或网络分析系统等各种系统中获得。


    随着营销分析流程的成熟，指标变得更加复杂，并且通常来源于多个数据源。例如，计算新客户获取成本可能需要来自营销自动化和会计系统的数据。同样，确定一场活动中从合格线索到销售的转化率，可能需要访问`CRM`和网络分析系统。总的来说，更具信息量的指标，尤其是那些显示与收入关联的指标，通常来源于多个数据源。如果数据存在于某种系统或数据库中，通常可以自动提取和推导该指标，并将其呈现在某种报告或仪表板中。关于使用工具实现此目的的更多讨论，请参见[第8章](../Text/A978-1-4842-0259-3_8_Chapter.html)。


    营销组织希望使用的指标很可能在任何现有系统或数据源中都不可用。在这种情况下，组织必须决定如何获取所需的数据。例如，假设营销部门确定某种倡导度指标作为分析流程的一部分来跟踪很重要。它可能决定使用净推荐值（`NPS`），因此会实施某种调查机制来收集`NPS`数据。其他指标也可能需要实施系统、流程或两者兼有来收集必要的数据。你的数据评估应考虑数据可能来自何处，以及收集它需要付出什么代价。'
  raw: 'The communications that must occur around the marketing analytics process
    is not mere reporting of results. (If that were the case, then a simple email
    message would do). Instead, what is needed is a leader who can objectively convey
    what is going on as reflected by the analytics, helping the rest of the organization
    not just understand it but believe in it. The communications that must occur are
    formal and informal. The person communicating on behalf of the marketing analytics
    process must master the board room presentation to the executives as well as the
    break room conversation around the water cooler.


    Part of the skill in communicating in this context is knowing the level of detail
    to convey. Marketing analytics can certainly consist of a lot of detail. Some
    will need to understand the intricacies of the process, whereas others will just
    want the results summary. The person doing the communications about the process
    will need to understand at all times who the audience is and what their information
    needs are. To use a metaphor, the executive who asks “what time is it?” doesn’t
    want to hear a set of instructions for building a watch as a reply. It’s easy
    for someone who is intimately familiar with the analytics process to overcommunicate
    about it, but that usually won’t win people over. A person who is adept at communicating
    about marketing analytics understands how to convey meaning succinctly while providing
    detail when it is helpful to do so.


    The person who communicates about marketing analytics must also be a teacher and
    evangelist for the process. This requires the discernment to know who doesn’t
    understand the value and results of the process and then educate them. In a similar
    way, the communicator is also always promoting the process, ensuring that the
    organization understands how the results help not just the marketing function
    but the entire organization. The communicator is therefore a leader, teacher,
    persuader, defender, promoter, and advocate of the marketing analytics process.


    Finally, the communicator must understand the necessity of being transparent.
    The organization can’t selectively choose to only communicate when the analytics
    indicate that marketing is producing good results. The communication must occur
    regardless of what the analytics show about marketing’s performance. This is the
    accountability dimension of the analytics process, and marketing cannot shy away
    from it or censor its output if the process is to work. The better marketing becomes
    at using analytics, the more frequently it will have good results to report. Even
    when it doesn’t, the right corporate culture will respect the marketing team for
    its transparency.


    As with the first two skills requirements—analytical and technical—it is also
    quite possible that the insight and communications skills are found in the same
    person. Unlike the first two skills, these last two skills are often found within
    the marketing team. What is rare, however, is for a single person to possess all
    these critical skills. For this reason, marketing analytics is best viewed as
    a team endeavor, with several people coming together with the necessary skills
    under the direction of a leader with a vision for using analytics.


    Although analytic and technical abilities are hard skills and insight and communications
    are soft skills, they are equally important. Table [5-2](#A978-1-4842-0259-3_5_Chapter.html#Tab2)
    provides a simple assessment mechanism for rating current skills required for
    analytics. Use it to take inventory and assess the current skills available in
    your organization for marketing analytics. Place a check mark in the column for
    each listed skill that represents your current state, and develop a plan for addressing
    any deficiencies.


    Table 5-2.


    Marketing Analytics Critical Skills Inventory/Assessment


    | Skill | Proficient | Cursory | Absent | Unknown |

    | --- | --- | --- | --- | --- |

    | Analytical skills |   |   |   |   |

    | Technical skills |   |   |   |   |

    | Insight |   |   |   |   |

    | Communication |   |   |   |   |


    The next major area to assess is data. Do you have access to the data you need
    to support the metrics you’ve defined for your marketing analytics process? The
    challenge is that there really is no “system of record” that contains all that
    marketing will need to support a robust analytics process. [Chapter 4](../Text/A978-1-4842-0259-3_4_Chapter.html)
    discussed the process of identifying metrics for this process. It’s important
    to have the metrics identified first, so that the availability of data doesn’t
    overly influence what gets measured. In other words, don’t let the tail wag the
    dog: don’t measure what you can measure because you have the data available. Measure
    what you should measure, and figure out how to get the data to do so.


    To assess if you have the data you need as input for your marketing analytics
    process, first study the metrics you’ve selected for tracking, analysis, and reporting.
    What data is required for these metrics? Does it exist? If so, where? If it doesn’t
    exist, is it obtainable? What effort is required to have access to accurate, reliable
    data needed for your marketing analytics program? Your data availability assessment
    must answer these questions.


    Although there is no single system of record for marketing, some systems provide
    much of the necessary data, at least for the basic metrics. For example, an organization
    that is executing a digital marketing strategy and also using a marketing automation
    solution will find that much of the data it needs to measure landing page visits
    or clicks on call-to-action buttons (conversions) is captured automatically and
    easily accessible. Likewise, almost anything an organization needs to know about
    its website performance is available through the use of Google Analytics. Data
    for most of the basic sales activity metrics, web metrics, and digital marketing
    metrics are available in various systems such as customer relationship management
    (CRM), marketing automation, or web analytics systems.


    As the marketing analytics process matures, metrics become more sophisticated,
    and they are often derived from multiple data sources. For example, calculating
    the cost of new customer acquisition may require data from marketing automation
    and accounting systems. Likewise, determining the conversion rate from qualified
    leads to sales for a campaign may require access to CRM and web analytics. In
    general, the more informative metrics, particularly the ones that show a link
    to revenue, are often derived from multiple data sources. If the data exists in
    some sort of system or database, it is often possible to automate the extraction
    and derivation of the metric and present it in some sort of report or dashboard.
    The use of tools for this purpose is discussed further in [Chapter 8](../Text/A978-1-4842-0259-3_8_Chapter.html).


    It’s always possible that the metrics the marketing organization wishes to use
    are not available in any existing system or source of data. When this is the case,
    the organization will have to determine how to get the data it needs. For example,
    suppose that marketing determines some sort of advocacy metric is important to
    track as part of the analytics process. It may decide to use Net Promoter Score[³](#A978-1-4842-0259-3_5_Chapter.html#Fn3)
    (NPS) and therefore will implement some sort of surveying mechanism to gather
    the NPS data. Other metrics may also require the implementation of systems, processes,
    or both to collect the necessary data. Your data assessment should consider where
    the data could come from and what it will take to collect it.'
  trans: '

    围绕营销分析流程所必须进行的沟通，不仅仅是报告结果。（如果只是这样，那么一封简单的电子邮件就足够了。）相反，所需要的是一位能够客观传达分析所反映情况的领导者，帮助组织中的其他成员不仅理解，而且信服这些分析。这些沟通既有正式的，也有非正式的。代表营销分析流程进行沟通的人，既要在董事会会议室向高管做演示，也要能在茶水间进行闲聊式的交流。


    在这种背景下进行沟通，其技巧之一在于知道传递信息的详细程度。营销分析当然可能包含很多细节。有些人需要了解流程的复杂性，而另一些人则只想要结果摘要。负责流程沟通的人必须始终清楚受众是谁以及他们的信息需求是什么。用一个比喻来说，问“现在几点了？”的高管，并不想听到一套关于如何制造手表的说明作为回答。一个非常熟悉分析流程的人很容易沟通过度，但这通常不会赢得人们的认可。善于沟通营销分析的人懂得如何简洁地传达意思，同时在必要时提供细节。


    沟通营销分析的人还必须担任流程的教师和布道者。这需要具备洞察力，以识别哪些人不理解流程的价值和结果，然后对他们进行教育。同样，沟通者也需要不断地推广该流程，确保组织理解这些结果不仅有益于营销职能，而且有益于整个组织。因此，沟通者是营销分析流程的领导者、教师、说服者、捍卫者、推广者和倡导者。


    最后，沟通者必须理解保持透明度的必要性。组织不能有选择地只在分析显示营销产生良好结果时才进行沟通。无论分析结果如何显示营销绩效，沟通都必须进行。这就是分析流程的问责维度，如果流程要发挥作用，营销部门就不能回避或审查其输出。营销部门运用分析的能力越强，其报告良好结果的频率就越高。即使情况并非如此，正确的企业文化也会因营销团队的透明而尊重他们。


    与前两项技能要求（分析和技术）一样，洞察力和沟通技巧也很可能集中在同一个人身上。与前两项技能不同，后两项技能通常存在于营销团队内部。然而，罕见的是同一个人拥有所有这些关键技能。因此，营销分析最好被视为一项团队协作，由几个具备必要技能的人，在一个对运用分析有远见的领导者指导下共同努力。


    尽管分析和技术能力是硬技能，而洞察力和沟通是软技能，但它们同等重要。表 5-2 提供了一个简单的评估机制，用于对当前开展分析所需的技能进行评级。用它来盘点并评估你所在组织中可用于营销分析的当前技能。在表中每项技能对应的列中，勾选代表你当前状态的选项，并制定计划来解决任何不足之处。


    **表 5-2.** 营销分析关键技能清单/评估


    | 技能 | 熟练 | 粗略掌握 | 缺失 | 未知 |

    | :--- | :--- | :--- | :--- | :--- |

    | 分析技能 | | | | |

    | 技术技能 | | | | |

    | 洞察力 | | | | |

    | 沟通能力 | | | | |


    下一个需要评估的主要领域是数据。你是否能获取所需的数据来支持你为营销分析流程定义的指标？挑战在于，实际上并不存在一个包含营销部门支持稳健分析流程所需一切数据的“系统记录”。第
    4 章讨论了为此流程识别指标的过程。首先确定指标很重要，这样数据的可用性就不会过度影响测量的内容。换句话说，不要让“尾巴摇狗”：不要因为你有数据就只衡量你能衡量的东西。衡量你应该衡量的东西，并想办法获取相关数据。


    要评估你是否拥有作为营销分析流程输入所需的数据，首先研究你选择的用于跟踪、分析和报告的指标。这些指标需要什么数据？这些数据存在吗？如果存在，在哪里？如果不存在，是否可以获取？要能够访问营销分析项目所需的准确、可靠的数据，需要付出多少努力？你的数据可用性评估必须回答这些问题。


    尽管没有单一的营销记录系统，但一些系统提供了大部分必要的数据，至少对于基本指标是如此。例如，一个正在执行数字营销策略并使用营销自动化解决方案的组织会发现，它衡量着陆页访问量或行动呼吁按钮点击量（转化）所需的大部分数据都会被自动捕获，并且易于访问。同样，一个组织需要了解的关于其网站性能的几乎所有信息都可以通过使用`Google
    Analytics`获得。大多数基本销售活动指标、网络指标和数字营销指标的数据都可以在客户关系管理（`CRM`）、营销自动化或网络分析系统等各种系统中获得。


    随着营销分析流程的成熟，指标变得更加复杂，并且通常来源于多个数据源。例如，计算新客户获取成本可能需要来自营销自动化和会计系统的数据。同样，确定一场活动中从合格线索到销售的转化率，可能需要访问`CRM`和网络分析系统。总的来说，更具信息量的指标，尤其是那些显示与收入关联的指标，通常来源于多个数据源。如果数据存在于某种系统或数据库中，通常可以自动提取和推导该指标，并将其呈现在某种报告或仪表板中。关于使用工具实现此目的的更多讨论，请参见第
    8 章。


    营销组织希望使用的指标很可能在任何现有系统或数据源中都不可用。在这种情况下，组织必须决定如何获取所需的数据。例如，假设营销部门确定某种倡导度指标作为分析流程的一部分来跟踪很重要。它可能决定使用净推荐值（`NPS`），因此会实施某种调查机制来收集`NPS`数据。其他指标也可能需要实施系统、流程或两者兼有来收集必要的数据。你的数据评估应考虑数据可能来自何处，以及收集它需要付出什么代价。

