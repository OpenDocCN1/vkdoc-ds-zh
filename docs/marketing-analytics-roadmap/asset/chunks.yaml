    \  \n\n同上。  \n\n“2013 年营销分析：基准、洞察与建议”，Demand Metric 研究公司，2013 年 3 月。[`http://www.demandmetric.com/content/marketing-analytics-benchmark-report`](http://www.demandmetric.com/content/marketing-analytics-benchmark-report)\
    \  \n\n# 4. 营销分析流程  \n\n起泡、冲洗、重复  \n\n> 如果你无法将自己的行动描述为一个流程，那你就不知道自己在做什么。——W. 爱德华兹·戴明\
    \  \n\n企业非常依赖流程驱动。销售、支持、会计、制造、招聘、培训，几乎企业所做的每一件事都有相应的流程。即便在我们的个人生活中，我们也时刻使用流程。虽然我们很少思考这一点，但大多数人洗澡的方式可能都如出一辙：日复一日地按相同顺序起泡、冲洗、擦干。从最小的任务到最大的项目，流程都是我们完成工作的方式。\
    \  \n\n流程帮助我们高效且有效地工作。当我们意识到某项任务或活动具有重复性，并且我们试图达成一致的结果时，我们就会为其制定一个流程。一旦找到了行之有效的流程，我们就会坚持使用，并在使用过程中不断改进。在一些公司中，这些流程相当正式，并由专人管理以优化绩效。可能会有指定的流程负责人持续评估流程表现，寻找消除低效环节、提升绩效的方法。在其他情况下，流程是非正式的，只要还能运转，就没有人会过多关注。无论哪种方式，流程都是组织内部完成工作的途径。\
    \  \n\n营销是一个宏观流程或系统，包含许多子流程。这种观点可能会让营销听起来过于机械化，仿佛将创造力排除在外。但这并非将营销置于流程语境中的本意：创意流程对营销的成功至关重要，并且它是可以被衡量、管理和改进的。\
    \  \n\n那么，为什么要大谈特谈流程呢？流程需要管理才能发挥最大效能。你无法管理无法衡量的流程，因此衡量——即分析——对于管理营销及其包含的所有流程至关重要。营销分析本身就是营销内部的一个核心或基础流程。让我们重新审视第一章中首次分享的营销分析定义：\
    \  \n\n> 营销分析是一个流程，旨在识别能够有效反映营销在实现目标过程中绩效的指标，持续跟踪这些指标，并利用结果来改进营销工作。  \n\n营销分析流程应作为所有其他营销流程的绩效接口。对于营销所做的每一件事——邮件营销、内容营销、潜在客户开发、活动营销、点击付费广告——理想情况下，这些流程都应关联相应的分析。营销分析流程要求为所有营销流程识别有意义的绩效指标，跟踪这些指标，进行分析，并基于分析采取改进措施。\
    \  \n\n> **注**  \n> 营销分析流程要求为所有营销流程识别有意义的绩效指标，跟踪这些指标，进行分析，并基于分析采取改进措施。  \n\n分析流程听起来很简单，但考虑到营销所涉及的所有事务，其范围往往相当庞大。仅以邮件营销流程相关的部分指标为例：打开率、退信率、点击率、取消订阅率和转化率。这些指标会因营销机构发送的邮件数量而成倍增加，由此可见营销团队淹没在数据之中是多么容易。正因如此，营销分析流程并非营销工作的附属品，而是其不可或缺的组成部分。用仪表盘来比喻分析十分贴切：分析为营销领导者提供绩效信息，使其能够以最高效率驱动营销机器，产生最佳成果。\
    \  \n\n有一则关于洗发水瓶上使用说明的老笑话：起泡、冲洗、重复。如果你严格按照说明操作，就会陷入无限循环的流程，直到洗发水用完为止。然而，在营销分析方面，我们恰恰希望严格按照这些说明来理解，形成一个衡量、分析、改进的持续循环。只进行一次流程循环的价值是有限的。只有当具备持续重复循环的纪律时，营销分析才能发挥最大效用。本章剩余部分将更详细地探讨分析流程。\
    \  \n\n> **注**  \n> 营销分析流程是一个衡量、分析和改进的持续循环。  \n"
- fmt: '# Step 1: Identify Metrics


    > Metrics aren’t a form of control—they monitor progress, provide direction, and
    remove blindfolds. —Christel Quek (via LinkedIn)


    In any endeavor, marketing or otherwise, measurements are critically important
    because they are the means of judging success or failure. Marketing is often considered
    an artistic endeavor, and as such, many don’t believe its true impact is measurable.
    There’s no denying the artistic and creative aspect of marketing. In fact, great
    creative talent and work is a major differentiator between merely good and truly
    great marketing efforts. But just because marketing is one of the most creative
    business disciplines should not exempt it from measurement. In this modern era,
    the debate about measuring marketing’s results has been settled in the affirmative.


    The fact is that in most organizations, marketing’s raison d’être is to produce
    revenue, either directly or indirectly. Although it is true that marketing has
    other missions, such as serving as guardian of the brand, if it is not a key variable
    in the revenue equation, most CEOs will dismiss marketing as a failure. So measurement
    is very important. The first challenge of measuring marketing is determining which
    metrics to use. This is no small matter, for the success of the entire analytics
    process hinges on the proper selection of metrics.


    In this discussion of marketing metrics, it’s helpful to consider sales, a part
    of the organization with a long history of being metrics-driven. The relationship
    between marketing and sales is close one from a mission and goals perspective.
    Both functions are tasked with generating revenue, but they go about it very differently.
    The measurement of sales results is usually pretty straightforward. Revenue goals
    are set, quotas assigned, and sales are tracked, quite often to the individual
    representative responsible. It’s not difficult, particularly in B2B sales organizations,
    to know who has contributed the most to attaining revenue. The relationship between
    sales activity and revenue is very direct and thus fairly easy to measure.


    It’s not always this clear in marketing. The reason isn’t because marketing has
    no effect on revenue but instead because the path to revenue for marketing’s activities
    is more indirect. It’s simply harder to connect the dots between the work marketing
    does and the results it produces. This indirect relationship between marketing’s
    output and revenue creates challenges to identify meaningful, relevant metrics.
    It’s not an impossible task, but it requires careful deliberation and selection
    of metrics.


    One of the challenges in identifying the best set of metrics for the marketing
    analytics process is the sheer number of metrics linked to the work of marketing.
    The average marketing organization can actually produce volumes of data about
    most of its work, but not all of that data provides insights into real results,
    nor does it have meaning outside of the marketing organization.


    If numbers are what the organization wants, marketing can provide them. Hundreds
    of metrics are available. Social media gives us likes, shares, posts, tweets,
    and other metrics. Email marketing generates opens, bounces, click-throughs, unsubscribes,
    and more. Websites let us track visits, unique visits, referral sources, search
    terms, and much more. There are conversion rates, content downloads, views, and
    a seemingly endless stream of metrics at the disposal of the modern marketing
    team.


    Each metric has potential value in helping marketing derive its revenue impact,
    but almost none of them are a direct tie to a revenue figure. It’s certainly expedient
    to simply track data that is easy to collect and then report it, particularly
    when there is pressure to show some accountability. It’s unwise, however, for
    marketing to simply shove its full collection of metrics at the organization to
    satisfy the need for accountability. Although the myriad available metrics show
    evidence of activity, they don’t really answer the question about how marketing
    is performing. Marketing must be selective about which metrics it chooses, sticking
    with the most relevant ones so that viewing a portfolio of metrics doesn’t feel
    like drinking from a fire hose.


    Another challenge to selecting metrics for the analytics process is that so many
    of them don’t have much meaning outside of the marketing department. This doesn’t
    mean they are useless, but it does infer that if marketing chooses to use metrics
    not well understood by nonmarketers, there is an obligation to explain what they
    mean and why they’re important.


    For example, consider an impression. Marketers understand that impressions are
    simply a count or measure of exposure to some form of content, traditional or
    digital. Measuring impressions is a pretty common metric for many things marketing
    does, such as various forms of advertising. Marketing is always interested in
    garnering as many impressions as possible, and digital impressions are fairly
    easy to track. Imagine this scenario: a CMO gets budget approval to run a digital
    marketing campaign. The campaign performs well, compared to similar, previous
    campaigns, producing 15 percent more impressions than expected. The marketing
    team is elated at this result.


    Should the CFO ask how the campaign went, it’s very easy for the marketing team
    to report the impressions data. But not all CFOs or CEOs understand exactly what
    an impression is, nor do they understand that not all impressions are of equal
    value. Furthermore, they’re not terribly interested in impressions anyway: they
    want to know what those impressions translate to in terms of revenue.


    Impressions data from a campaign can help the marketing team improve the performance
    of existing and future campaigns. If the performance is low, marketing should
    investigate why; usually the problem is that the messaging is wrong, the medium
    is wrong, or both. Analyzing the data can help the team improve campaign performance
    or replicate great performance. As H. James Harrington said, “Measurement is the
    first step that leads to control and eventually improvement.”[¹](#A978-1-4842-0259-3_4_Chapter.html#Fn1)


    As the campaign impressions example illustrates, impressions aren’t useless as
    a metric, but they don’t tell the story the C-suite longs to hear and marketing
    should want to know: the revenue impact of the campaign. To be fair, most marketers
    understand the need to translate metrics like impressions, visits, downloads,
    and so on into revenue. The problem is that they often don’t have the systems
    to collect the necessary data to do this with precision. Of course marketing can
    always estimate, taking the actual number of impressions and applying some historical,
    believed-to-be-accurate conversion rate and derive a figure of revenue generated.
    But as soon as they does this, it has left the realm of certainty and entered
    the realm of speculation, and it exposes itself to credibility issues as a result.'
  raw: '## Step 1: Identify Metrics


    > Metrics aren’t a form of control—they monitor progress, provide direction, and
    remove blindfolds. —Christel Quek (via LinkedIn)


    In any endeavor, marketing or otherwise, measurements are critically important
    because they are the means of judging success or failure. Marketing is often considered
    an artistic endeavor, and as such, many don’t believe its true impact is measurable.
    There’s no denying the artistic and creative aspect of marketing. In fact, great
    creative talent and work is a major differentiator between merely good and truly
    great marketing efforts. But just because marketing is one of the most creative
    business disciplines should not exempt it from measurement. In this modern era,
    the debate about measuring marketing’s results has been settled in the affirmative.


    The fact is that in most organizations, marketing’s raison d’être is to produce
    revenue, either directly or indirectly. Although it is true that marketing has
    other missions, such as serving as guardian of the brand, if it is not a key variable
    in the revenue equation, most CEOs will dismiss marketing as a failure. So measurement
    is very important. The first challenge of measuring marketing is determining which
    metrics to use. This is no small matter, for the success of the entire analytics
    process hinges on the proper selection of metrics.


    In this discussion of marketing metrics, it’s helpful to consider sales, a part
    of the organization with a long history of being metrics-driven. The relationship
    between marketing and sales is close one from a mission and goals perspective.
    Both functions are tasked with generating revenue, but they go about it very differently.
    The measurement of sales results is usually pretty straightforward. Revenue goals
    are set, quotas assigned, and sales are tracked, quite often to the individual
    representative responsible. It’s not difficult, particularly in B2B sales organizations,
    to know who has contributed the most to attaining revenue. The relationship between
    sales activity and revenue is very direct and thus fairly easy to measure.


    It’s not always this clear in marketing. The reason isn’t because marketing has
    no effect on revenue but instead because the path to revenue for marketing’s activities
    is more indirect. It’s simply harder to connect the dots between the work marketing
    does and the results it produces. This indirect relationship between marketing’s
    output and revenue creates challenges to identify meaningful, relevant metrics.
    It’s not an impossible task, but it requires careful deliberation and selection
    of metrics.


    One of the challenges in identifying the best set of metrics for the marketing
    analytics process is the sheer number of metrics linked to the work of marketing.
    The average marketing organization can actually produce volumes of data about
    most of its work, but not all of that data provides insights into real results,
    nor does it have meaning outside of the marketing organization.


    If numbers are what the organization wants, marketing can provide them. Hundreds
    of metrics are available. Social media gives us likes, shares, posts, tweets,
    and other metrics. Email marketing generates opens, bounces, click-throughs, unsubscribes,
    and more. Websites let us track visits, unique visits, referral sources, search
    terms, and much more. There are conversion rates, content downloads, views, and
    a seemingly endless stream of metrics at the disposal of the modern marketing
    team.


    Each metric has potential value in helping marketing derive its revenue impact,
    but almost none of them are a direct tie to a revenue figure. It’s certainly expedient
    to simply track data that is easy to collect and then report it, particularly
    when there is pressure to show some accountability. It’s unwise, however, for
    marketing to simply shove its full collection of metrics at the organization to
    satisfy the need for accountability. Although the myriad available metrics show
    evidence of activity, they don’t really answer the question about how marketing
    is performing. Marketing must be selective about which metrics it chooses, sticking
    with the most relevant ones so that viewing a portfolio of metrics doesn’t feel
    like drinking from a fire hose.


    Another challenge to selecting metrics for the analytics process is that so many
    of them don’t have much meaning outside of the marketing department. This doesn’t
    mean they are useless, but it does infer that if marketing chooses to use metrics
    not well understood by nonmarketers, there is an obligation to explain what they
    mean and why they’re important.


    For example, consider an impression. Marketers understand that impressions are
    simply a count or measure of exposure to some form of content, traditional or
    digital. Measuring impressions is a pretty common metric for many things marketing
    does, such as various forms of advertising. Marketing is always interested in
    garnering as many impressions as possible, and digital impressions are fairly
    easy to track. Imagine this scenario: a CMO gets budget approval to run a digital
    marketing campaign. The campaign performs well, compared to similar, previous
    campaigns, producing 15 percent more impressions than expected. The marketing
    team is elated at this result.


    Should the CFO ask how the campaign went, it’s very easy for the marketing team
    to report the impressions data. But not all CFOs or CEOs understand exactly what
    an impression is, nor do they understand that not all impressions are of equal
    value. Furthermore, they’re not terribly interested in impressions anyway: they
    want to know what those impressions translate to in terms of revenue.


    Impressions data from a campaign can help the marketing team improve the performance
    of existing and future campaigns. If the performance is low, marketing should
    investigate why; usually the problem is that the messaging is wrong, the medium
    is wrong, or both. Analyzing the data can help the team improve campaign performance
    or replicate great performance. As H. James Harrington said, “Measurement is the
    first step that leads to control and eventually improvement.”[¹](#A978-1-4842-0259-3_4_Chapter.html#Fn1)


    As the campaign impressions example illustrates, impressions aren’t useless as
    a metric, but they don’t tell the story the C-suite longs to hear and marketing
    should want to know: the revenue impact of the campaign. To be fair, most marketers
    understand the need to translate metrics like impressions, visits, downloads,
    and so on into revenue. The problem is that they often don’t have the systems
    to collect the necessary data to do this with precision. Of course marketing can
    always estimate, taking the actual number of impressions and applying some historical,
    believed-to-be-accurate conversion rate and derive a figure of revenue generated.
    But as soon as they does this, it has left the realm of certainty and entered
    the realm of speculation, and it exposes itself to credibility issues as a result.'
  trans: '

    # 第一步：确定指标


    > 指标并非控制手段——它们监控进展、提供方向、并摘除眼罩。——克里斯泰尔·克（来源：领英）


    在任何事业中，无论是市场营销还是其他领域，衡量都至关重要，因为它是判断成功或失败的手段。营销常被视为一门艺术事业，因此许多人认为其真实影响力无法衡量。不可否认，营销确实具有艺术和创意的一面。事实上，卓越的创意人才和作品是区分普通营销与真正优秀营销的关键因素。但仅仅因为营销是最具创造性的商业学科之一，并不意味着它应免于衡量。在现代，关于衡量营销成果的争论已经有了肯定的答案。


    事实上，在大多数组织中，营销存在的理由就是直接或间接地创造收入。尽管营销确实还有其他使命，例如充当品牌的守护者，但如果它不是收入方程中的关键变量，大多数 CEO
    将会认为营销是失败的。因此，衡量非常重要。衡量营销的第一个挑战是确定使用哪些指标。这绝非小事，因为整个分析过程的成功取决于指标的恰当选择。


    在讨论营销指标时，考虑销售部门是很有帮助的，该部门有着悠久的指标驱动历史。从使命和目标的角度来看，营销与销售的关系非常紧密。这两个职能都肩负着创造收入的任务，但它们的方式却截然不同。销售结果的衡量通常相当直接：设定收入目标、分配定额、跟踪销售情况，并且常常落实到具体的负责代表。在
    B2B 销售组织中，要知道谁对实现收入贡献最大并不困难。销售活动与收入之间的关系非常直接，因此相当容易衡量。


    在营销中，情况并非总是如此清晰。原因并非营销对收入没有影响，而是因为营销活动通向收入的路径更为间接。简单来说，就是将营销所做的工作与其产生的结果联系起来更加困难。营销产出与收入之间的这种间接关系给识别有意义、相关的指标带来了挑战。这并非不可能完成的任务，但它需要仔细的斟酌和筛选。


    为营销分析过程确定最佳指标集所面临的挑战之一，是与营销工作相关的指标数量极其庞大。一般的营销组织实际上可以产生大量关于其大部分工作的数据，但并非所有这些数据都能提供对真实结果的洞察，而且在营销组织之外也毫无意义。


    如果组织想要数字，营销可以提供。可用的指标有数百种。社交媒体为我们提供了点赞、分享、帖子、推文等指标。电子邮件营销产生了打开率、退信率、点击率、退订率等等。网站让我们能跟踪访问次数、独立访客数、推荐来源、搜索词条，以及更多。还有转化率、内容下载量、浏览量，以及看似无穷无尽的指标供现代营销团队使用。


    每个指标在帮助营销推导其收入影响方面都有潜在价值，但几乎没有一个与具体的收入数字直接挂钩。简单地跟踪容易收集的数据并进行报告当然很方便，尤其是在面临展示责任的压力时。然而，营销部门仅仅将其收集的所有指标抛给组织以满足责任需求，这是不明智的。尽管各种各样的可用指标显示了活动的证据，但它们并不能真正回答营销表现如何的问题。营销必须对其选择的指标有所甄别，坚持使用最相关的那些，这样查看一组指标时就不会感觉像对着消防水管喝水一样。


    为分析过程选择指标面临的另一个挑战是，许多指标在营销部门之外意义不大。这并不意味着它们无用，但它确实暗示，如果营销选择使用非营销人员不太理解的指标，就有责任解释它们的含义以及它们为何重要。


    例如，考虑一下“曝光量”。营销人员明白，曝光量仅仅是对某种形式的内容（传统或数字）的接触次数或衡量。衡量曝光量是营销许多工作的一个常见指标，例如各种形式的广告。营销总是希望获得尽可能多的曝光量，而数字曝光量相当容易跟踪。想象这样一个场景：首席营销官（CMO）获批预算开展一项数字营销活动。与以往类似的活动相比，该活动表现出色，产生的曝光量比预期高出
    15%。营销团队对这个结果欣喜若狂。


    如果首席财务官（CFO）询问活动进展如何，营销团队很容易报告曝光量数据。但并不是所有的 CFO 或 CEO 都确切理解曝光量是什么，也不明白并非所有曝光量的价值都相同。此外，他们对曝光量本身并不十分感兴趣：他们想知道这些曝光量在收入方面意味着什么。


    来自活动的曝光量数据可以帮助营销团队改进现有和未来活动的表现。如果表现不佳，营销部门应调查原因；通常问题在于信息传达错误、媒介错误，或两者兼而有之。分析数据可以帮助团队改进活动表现或复制出色表现。正如
    H. 詹姆斯·哈林顿所说：“衡量是通向控制并最终实现改进的第一步。”¹


    正如活动曝光量这个例子所示，曝光量作为指标并非无用，但它们无法讲述高层管理者渴望听到、也是营销部门应该想知道的那个故事：活动的收入影响。公平地说，大多数营销人员明白需要将曝光量、访问量、下载量等指标转化为收入。问题在于，他们往往没有相应的系统来收集精确计算所需的数据。当然，营销部门总是可以估算：根据实际的曝光量数量，应用一些历史上被认为准确的历史转化率，从而得出一个所产生的收入数字。但一旦这样做，它就离开了确定的领域，进入了推测的领域，并因此使其信誉面临风险。

    '
- fmt: '# 衡量营销成效：指标识别的挑战与指南


    ## 指标识别的主要挑战


    一个值得讨论的最终挑战是，找到能够衡量重要事物的指标非常困难。例如，以品牌资产（`brand equity`）这个概念为例，这是一种通过营销而增长的资产。根据定义，品牌资产是一个品牌所享有的心智份额（`mindshare`）和认知度（`recognition`），以及随之而来的收益。拥有高品牌资产的企业可以收取溢价、获得更忠实的追随者，并在一定程度上免受竞争威胁。然而，品牌资产很难衡量。对此进行评估的组织通常会采用一些指标组合，例如市场份额（`market
    share`）、无辅助回忆度（`unaided recall`）、净推荐值（`Net Promoter Score`）和推荐量（`referrals`）。对于提升品牌资产的重要性，很少有人质疑，但如何衡量它则完全是另一回事。因此，这为那些纯粹旨在提升品牌资产的营销活动准备商业案例和证明其合理性增加了难度。


    这些挑战——潜在指标数量庞大、许多指标与收入没有直接关系，以及某些重要事物难以衡量——似乎意味着识别指标就像穿越雷区。但这并非必然如此。在决定如何最佳衡量营销成果时，请遵循以下指南：


    *   专注于目标

    *   衡量效率

    *   衡量效果


    ## 以目标为导向的指标


    营销的指标集必须衡量朝着目标取得的进展，否则它们衡量的就是错误的东西。这些目标的理想来源是营销策略，而合理的目标总是具有时限性（`time-bound`）和可衡量性（`measurable`）。这一策略及支撑性目标应当与公司的愿景和业务目标保持一致。如果是这样，那么识别指标就是通过确定如何衡量实现这些目标的进展来完成的。当存在一个具有明确目标的营销策略时，这些目标会使选择正确的指标变得相当直接。


    为了说明这个概念，考虑一个非常常见的业务目标：利润最大化。营销团队制定了一个帮助最大化利润的策略，并设定了两个目标：


    1.  增加当前产品在当前市场的市场渗透率。

    2.  提高客户保留率。


    营销团队规划并执行一系列营销活动和行动来实现这些目标。由于这两个目标都是可衡量的，营销团队应该能轻松理解其行为是否朝着正确的方向“推动了指针”。对于第一个目标，营销可以衡量市场份额、新客户获取等指标，以了解取得的进展。同样，营销可以通过衡量客户保留率、满意度、推荐量、重复购买率以及其他指标，来理解保留情况及其对收入的影响。在这两个领域，理解营销活动对收入的影响并不困难。


    ## 策略与分析的共生关系


    如果没有营销策略或一系列相关目标，识别有意义的指标就非常困难。在缺乏营销策略的情况下，业务目标和营销目标从何而来？虽然可以随意选择一些目标来追求，然后确定与之匹配的指标，但这并非真正的策略性营销方法。营销策略（及其目标）与营销分析之间存在共生关系。营销策略应当先于分析过程存在，而该策略的目标应作为识别分析过程指标的基础。


    ## 效率指标与效果指标


    到目前为止，本章强调了指标必须与营销的收入绩效相关联。此外，还需要一些关于效率的指标，用以展示营销团队完成任务的效果如何。这些指标本质上是生产力衡量标准，大多数情况下仅供内部使用，帮助首席营销官（`CMO`）保持营销引擎高效运转。只要它们不是分析过程中使用的唯一指标类型，营销部门就应该拥有一些帮助其了解工作完成效率的指标。


    效率指标很容易变成“虚荣”指标（`vanity` metrics），因为它们让营销部门因完成大量工作而感觉良好。但这些指标无法告诉你是否在做正确的事情。在使用效率指标时，必须记住，它可能显示你正在非常出色地做一件错误的事情。


    由于效率指标只能告诉营销人员他们是否在正确地做事，因此需要另一种类型的指标来帮助营销人员了解他们是否在做正确的事情。这就是效果指标（`effectiveness
    metrics`），它们有助于衡量营销的影响力。效果指标的例子包括转化率（`conversion rates`），这是一个行为指标，意味着潜在客户自愿采取了预期行动，从而在销售漏斗中向下移动。虽然这个指标及类似指标并不总是意味着销售即将发生，但这是迈向可能销售的一步。将效果指标与收入联系起来要容易得多。


    ## 结论


    识别指标是营销分析过程中关键的第一步。没有正确的指标，该过程中后续步骤的价值将微乎其微。通常，刚接触分析的营销人员会确定一套核心指标，这些指标会随着时间的推移不断完善，并通过经验不断扩展。'
  raw: 'A final challenge worth discussing is the difficulty of finding metrics that
    measure things that are important. For example, take the concept of brand equity,
    an asset that is grown through marketing. By definition, brand equity is the mindshare
    and recognition that a brand enjoys and the benefits that come with that. Brands
    with a lot of equity can charge premium prices, enjoy a more loyal following,
    and have a degree of immunity from competitive threats. Yet brand equity is difficult
    to measure. Organizations that measure this often use some combination of metrics,
    such as market share, unaided recall, Net Promoter Score, and referrals. There
    is rarely a dispute about the importance of growing brand equity, but measuring
    it is another matter entirely. As a result, it makes the business case for campaigns
    designed solely to increase brand equity more difficult to prepare and justify.


    These challenges—the sheer number of potential metrics, the fact that many of
    them don’t relate directly to revenue, and the reality that some important things
    are difficult to measure—seem to imply that identifying metrics is like navigating
    a minefield. It doesn’t have to be like this. When determining how to best measure
    the results of marketing’s efforts, follow these guidelines:


    *   Focus on objectives

    *   Measure efficiency

    *   Measure effectiveness


    Marketing’s set of metrics must measure progress toward objectives, or they are
    measuring the wrong things. The ideal source of these objectives is the marketing
    strategy, and proper objectives are always time-bound and measurable. This strategy
    and supporting objectives are hopefully aligned with the company’s vision and
    business objectives. If this is the case, then identifying metrics is done by
    determining how to measure progress toward those objectives. When there is a marketing
    strategy with defined objectives, the objectives make selecting the right metrics
    pretty straightforward.


    To illustrate this concept, consider as an example a very common business objective:
    to maximize profits. The marketing team develops a strategy to help maximize profits
    and develops two objectives:


    Increase market penetration of current products in current markets. Improve customer
    retention.


    The marketing team plans and executes a series of campaigns and activities to
    achieve these objectives. Because both of these goals are measurable, marketing
    should have no difficulty understanding if the things it is doing are “moving
    the needle” in the right direction. For the first objective, marketing could measure
    market share, new customer acquisitions, and other things to know what progress
    it’s making. Likewise, marketing can measure customer retention, satisfaction,
    referrals, reorders, and other metrics to understand retention and the impact
    it has on revenue. It isn’t difficult to understand the revenue impact of what
    marketing is doing in either of these areas.


    Identifying meaningful metrics is very difficult if there is no marketing strategy
    or set of related objectives. In the absence of a marketing strategy, where do
    the business and marketing objectives come from? While it is possible to arbitrarily
    choose some objectives to pursue, and then identify some metrics that go with
    them, that isn’t really a strategic approach to marketing. There is a symbiotic
    relationship between the marketing strategy (and its objectives) and marketing
    analytics. The marketing strategy should preexist the analytics process, and the
    objectives of that strategy should serve as the basis for identifying metrics
    for the analytics process.


    So far, this chapter has driven home the need to have metrics that relate to marketing’s
    revenue performance. What’s also necessary are some metrics about efficiency that
    show how well the marketing team is getting its work done. These are essentially
    productivity measures, and most of the time, they’re for internal use, helping
    the CMO keep the marketing engine humming. Marketing should have some efficiency
    metrics that help it understand how well it is getting work done, as long as they
    are not the only type of metric the analytics process uses.


    It’s very easy for efficiency metrics to become “vanity” metrics, because they
    help marketing feel good about how much work is getting done. What these metrics
    don’t do is tell you whether you’re working on the right things. When you’re using
    efficiency metrics, it’s important to remember that it is possible that it could
    show that you’re doing a wrong thing very well.


    Because efficiency metrics only tell marketers if they’re doing things right,
    another type of metric is needed that helps marketers know if they’re doing the
    right things. These are effectiveness metrics, and they help marketing measure
    its impact. Examples of effectiveness metrics would include conversion rates,
    a behavioral indicator that means a prospect voluntarily took the desired action
    that moves them further down the sales funnel. Although this and similar metrics
    don’t always mean a sale is imminent, it’s a step toward a possible sale. It’s
    far easier to connect effectiveness metrics to revenue.


    Identifying metrics is the critical first step in the marketing analytics process.
    Without the proper metrics, the remaining steps in this process are of little
    value. Generally, marketers that are new to analytics will identify a core set
    of metrics that are refined over time and expanded through experience.'
