- fmt: '# ROI Is Not Enough


    > Most people use statistics the way a drunkard uses a lamp post, more for support
    than illumination. —Mark Twain


    As this chapter discusses, there are pros and cons to using `ROI` as a marketing
    metric. One extreme in the argument is that `ROI` is the ultimate marketing metric.
    The other extreme is that `ROI` isn’t important and in fact is even harmful as
    a marketing metric. Neither of these positions represent the place where marketing
    should live with respect to the `ROI` metric. As is true for many polarizing arguments,
    the truth is somewhere in the middle.


    Set aside for the moment all the challenges of accurately determining the `ROI`
    of anything or everything that marketing does. The `ROI` metric tells neither
    marketing nor the rest of the organization all it needs to know about marketing’s
    performance or how to improve it. In fact, there isn’t a single metric that serves
    this purpose. Marketing analytics done properly requires multiple metrics that
    provide a complete and accurate view. It’s unreasonable to view `ROI` as that
    one metric. The financial pragmatists who want to see marketing live and die based
    on its `ROI` must realize that other metrics reveal more about true marketing
    outcomes. Some of these metrics include market share, customer lifetime value,
    retention rate, and cost of customer acquisition.


    Those that feel that `ROI` has no place in the catalog of metrics must reconcile
    themselves to the fact that `ROI` can provide real value. For some marketing activities,
    `ROI` is a great performance indicator. True, there are important intangible contributions
    of marketing that are difficult or too expensive to measure—an `ROI` metric is
    clearly not appropriate for these things. But most campaigns and lead generation
    efforts easily lend themselves to `ROI` determination and scrutiny. Where it makes
    sense, marketing should embrace `ROI`. Furthermore, the marketing idealists must
    recognize that sometimes it’s simply expedient or politically wise to play the
    `ROI` game. If reporting `ROI` is the path to securing resources or the future
    of marketing, then marketers should not hesitate to do it.


    The right position to take with respect to `ROI` and marketing is this: use `ROI`
    where it makes sense. It is an important metric, but it is a means to an end,
    not the end itself. Marketers should own the process of determining and reporting
    `ROI`, not let that process own them. Recognize that it will take time to gain
    maturity in using `ROI` as a marketing metric, because of the challenges of doing
    so that this chapter discusses. It’s not hard to foresee, however, a day in the
    not-so-distant future where improved systems for tracking, collecting, and reporting
    on the needed `ROI` input data that now is elusive becomes standard and easy to
    obtain. As marketing technology continues to mature, the ability to precisely
    know the `ROI` of the entire marketing function will come within easier reach.


    ## Footnotes


    [1] “State of Inbound 2014,”, Hubspot, p. 31, `http://www.stateofinbound.com/`.


    [2] `http://www.quora.com/What-is-considered-a-good-ROI-for-a-digital-marketing-campaign-for-a-consultancy-company`.


    [3] Phil Johnson, “What’s the ROI of Putting Your Pants on in the Morning? The
    Dilemma of Measurement and Accountability,” Advertising Age, October 20, 2009.


    [4] James Archer, “Metric-lust: How Well Can You Really Measure Marketing ROI?,”
    `http://forty.co/metric-lust-how-well-can-you-really-measure-marketing-roi`.


    [5] Gordon Wyner, “Marketing Effectiveness: It’s More Than Just ROI,” Millward
    Brown blog, February 2008.


    [6] “Teradata Data-Driven Marketing Survey, Global,” 2013, Teradata, p. 28, `http://teradata.com/`.


    [7] “2013 Teradata Data-Driven Marketing Survey, Global,” p. 8.


    [8] “2013 Teradata Data-Driven Marketing Survey, Global,” p. 13.'
