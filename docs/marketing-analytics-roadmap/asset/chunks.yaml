  raw: '## Marketing Analytics Capabilities


    This chapter has explored the landscape, attitudes, and challenges associated
    with marketing analytics. Having provided the big picture, we conclude with a
    brief, high-level discussion of the capabilities and limitations of marketing
    analytics.


    So far in this book, a number of metaphors have represented marketing analytics:
    dashboards, a servant, guardrails, and so on. These metaphors accurately convey
    an understanding of what marketing analytics do: provide direction and guidance.
    When properly implemented, the analytics process emits a steady stream of information
    that is useful for:


    Understanding marketing’s performance. For internal use, the metrics an analytics
    process uses tell marketing how it is performing. To use the dashboard metaphor,
    when the gauges are in the green, marketing can continue performing its work with
    confidence, even accelerating its efforts. When the gauges are in the yellow,
    it’s an indication that something is about to fail and needs attention. When the
    gauges are in the red, marketing knows with certainty that something is broken,
    and the broken process requires either an overhaul or abandonment in favor of
    something better. Reporting marketing’s performance. For external use, the output
    of the analytics process, or at least part of it, is useful to show the rest of
    the organization that it is getting a return on its investment in marketing. Sharing
    the results of it’s work create confidence in across the organization in what
    marketing is doing, helping the CMO keep marketing’s seat at the big decisions
    table.


    Analytics deliver these important capabilities to the marketing organization.
    There are also limitations. Analytics don’t lead. The process is not the functional
    equivalent of auto-pilot for the marketing team. For the marketing function to
    thrive and provide the greatest value to the companies it serves, it requires
    strong, visionary leadership from the CMO. The CMO’s vision for marketing should
    include an analytics process. The combination of vision and analytics produces
    the highest performing marketing function that can fully account for its work
    and sustain its contribution. It represents what every CEO wants from marketing.


    Footnotes [1](#A978-1-4842-0259-3_2_Chapter.html#Fn1_source)


    “Marketing Report Card: Keeping Our Seat at the Table,” Demand Metric Research
    Corporation, March 2014\. [http://​www.​demandmetric.​com/​content/​marketing-report-card-benchmark-report](http://www.demandmetric.com/content/marketing-report-card-benchmark-report).


    [2](#A978-1-4842-0259-3_2_Chapter.html#Fn2_source)


    Ibid.


    [3](#A978-1-4842-0259-3_2_Chapter.html#Fn3_source)


    “Marketing Analytics in 2013: Benchmarks, Insights & Advice,” Demand Metric Research
    Corporation, March 2013\. [http://​www.​demandmetric.​com/​content/​marketing-analytics-benchmark-report](http://www.demandmetric.com/content/marketing-analytics-benchmark-report).


    [4](#A978-1-4842-0259-3_2_Chapter.html#Fn4_source)


    Ibid.


    [5](#A978-1-4842-0259-3_2_Chapter.html#Fn5_source)


    Ibid.


    [6](#A978-1-4842-0259-3_2_Chapter.html#Fn6_source)


    Ibid.


    [7](#A978-1-4842-0259-3_2_Chapter.html#Fn7_source)


    Scott Brinker, The Marketing Technologist: Neo of the Marketing Matrix. [http://​chiefmartec.​com/​2013/​12/​marketing-technologist-neo-marketing-matrix/​](http://chiefmartec.com/2013/12/marketing-technologist-neo-marketing-matrix/).


    [8](#A978-1-4842-0259-3_2_Chapter.html#Fn8_source)


    William Bruce Cameron, Informal Sociology: A Casual Introduction to Sociological
    Thinking. New York: Random House, page 13.


    # 3. The Impact of Marketing Analytics


    Show Me the Money


    The first two chapters hopefully made a convincing argument for marketing analytics.
    It’s not enough, however, to collect all the right data to input into a legitimate
    marketing analytics process. The key to success with marketing analytics is in
    the application. If the results and insights from the process are not used, then
    a marketing analytics initiative is of little value. To benefit the whole organization,
    the analytics must influence the thinking, the decisions, and ultimately the way
    marketing works.


    To look at marketing analytics as just a performance management tool misses the
    point of the process. It is true that a proper implementation of analytics can
    help marketing work better: more efficiently and more effectively. Although the
    analytics process should provide the data that helps marketing do more with less,
    ultimately analytics are about making money. The highest and best use of the analytics
    process is to help marketing operate as a revenue center. When the CEO says, in
    so many words, “show me the money,” marketing is able to do so when it has the
    right analytics data and uses it wisely.


    Note


    Analytics, though useful for improving marketing’s efficiency and effectiveness,
    are ultimately about helping the marketing function operate as a revenue center.


    For marketing organizations that have an analytics process, there are certainly
    some extremes to avoid. The first extreme is to have an analytics process but
    then do nothing with the output. The second is to have an analytics process and
    expect its output to serve as the primary source of leadership for the marketing
    team—this is the job of the CMO or marketing VP. Analytics are not a substitute
    or replacement for leadership. The place to situate a marketing analytics process
    is between these extremes. This is a place where the analytics are real, they
    have influence, and they serve as a reference point to help the CMO validate decisions
    and refine strategies.


    [Chapter 2](../Text/A978-1-4842-0259-3_2_Chapter.html) presented the state of
    marketing analytics, along with attitudes about them and the challenges with marketing
    analytics. How are organizations doing in the real world when it comes to finding
    this analytics “happy place” between the extremes just described? Figure [3-1](#A978-1-4842-0259-3_3_Chapter.html#Fig1)
    shares study results[¹](#A978-1-4842-0259-3_3_Chapter.html#Fn1) that reveal what
    marketing organizations are doing with the analytics data they measure and track.


    ![A978-1-4842-0259-3_3_Fig1_HTML.jpg](Images/A978-1-4842-0259-3_3_Fig1_HTML.jpg)


    Figure 3-1.


    Marketing analytics data use


    Figure [3-1](#A978-1-4842-0259-3_3_Chapter.html#Fig1) reveals that almost one-fourth
    of the marketing organizations that have analytics data occupy the first of the
    two extremes: they make no apparent use of it. For these organizations, analytics
    is nothing more than busy work. Within the data lies the power to improve performance
    or at least prove marketing’s contribution, but it goes unused. This lack of use
    indicates that marketing either feels it is already performing well enough and
    doesn’t need the boost it would get from using the data, or it doesn’t care.


    What’s best is for marketing and the CMO to desire to use analytics as a continuous
    improvement strategy. In the absence of any pressure from above, the ideal marketing
    team seeks to better itself and uses analytics as a tool to manage how it works.
    In the absence of this zeal for improvement, the company executives can also mandate
    the establishment of metrics and the collection of data around those metrics for
    the purposes of accountability. Either way, for the 24 percent who do not use
    the analytics data at their disposal, the accountability doesn’t exist to encourage
    use of that resource.'
