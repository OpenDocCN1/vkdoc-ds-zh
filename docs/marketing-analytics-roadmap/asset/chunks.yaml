- fmt: "### Step 2: Analyze the Metrics\n\n> The goal is to turn data into information,\
    \ and information into insight. —Carly Fiorina, Information: The Currency of the\
    \ Digital Age\n\nThe second step in the analytics process is analysis: taking\
    \ the data and, through inspection and analysis, turning it into actionable information.\
    \ The goal of this analysis step is to draw insights from the data about marketing’s\
    \ progress toward achieving its objectives. These insights aren’t always obvious,\
    \ so analysis and interpretation helps them come to light.\n\nDuring the first\
    \ step, we identified the metrics that are the crucial inputs to the marketing\
    \ analytics process. With the proper metrics identified, the analysis step begins\
    \ by capturing and tracking these metrics. In this modern era, where almost all\
    \ marketing is digital, this means having the right systems and mechanisms are\
    \ in place for reliably tracking metrics and making them available for analysis.\n\
    \nThe place where many marketing organizations were first introduced to analytics\
    \ is through their websites. The website is one of the most important marketing\
    \ channels for a company and capturing analytics data about website performance\
    \ is imperative. Even for bricks-and-mortar businesses, a website is often the\
    \ first stop for consumers who are looking for information as they consider a\
    \ purchase. Every website should have analytics enabled for it so that marketers\
    \ can understand performance and optimize the company’s web presence. `Google\
    \ Analytics` is the ubiquitous, free solution most marketers use for this purpose.\
    \ The realm of marketing analytics, however, extends far beyond web metrics.\n\
    \nIf the right systems are in place to capture metrics, understanding the current\
    \ state of things is not difficult. The modern marketing organization uses three\
    \ core systems to capture the analytics data it needs: web analytics, CRM, and\
    \ marketing automation. There are, of course, other systems that provide data\
    \ to marketing as well, such as purchase transaction data, but these three systems\
    \ are the pillars. Without the data collection mechanisms these key systems provide,\
    \ an analytics process is dead in the water. There is simply too much going on\
    \ in the modern marketing organization to track metrics data without the benefit\
    \ of automation and technology.\n\nWith the right systems in place, a marketer\
    \ can quickly get a snapshot of current performance metrics. In just a few clicks,\
    \ one can see how many unique visitors have hit a campaign landing page, how many\
    \ emails were opened, how many clicks a pay-per-click (PPC) scheme generated and\
    \ more. Most marketing organizations organize their metrics into some sort of\
    \ dashboard to visually present the data, making it easier to communicate and\
    \ understand. [Chapter 7](../Text/A978-1-4842-0259-3_7_Chapter.html) discusses\
    \ the use of dashboards in the marketing analytics process in greater detail.\n\
    \nWhen analyzing marketing metrics, what marketers should do is understand the\
    \ current state, compare it to the ideal state, and then do root-cause determination\
    \ to explain any differences.\n\n> **Note**  \n> The analysis step of the marketing\
    \ analytics process begins with understanding the current state, comparing it\
    \ to the ideal state, and understanding why there are differences.\n\nSeeing the\
    \ current state of marketing’s performance by reviewing the latest analytics data\
    \ is interesting for sure, but it’s just the beginning of the analysis process.\
    \ The first question that reviewing this data prompts is usually: are these results\
    \ good? Knowing whether any particular measurement result is good, bad, or indifferent\
    \ requires some sort of comparison, to historical data or a set of benchmarks\
    \ that represent a standard of excellence, preferably the latter.\n\nComparison\
    \ is important because without it, the metrics provide no sense of direction.\
    \ Consider the very important metric of customer satisfaction. An initial, quantitative\
    \ assessment of customer satisfaction has limited usefulness. To illustrate this,\
    \ suppose a survey of customer satisfaction is conducted using a scale from 1\
    \ to 5 where 1 equals very satisfied, and 5 equals very dissatisfied. This survey\
    \ result reveals that the average satisfaction level is 2.3. How should the organization\
    \ feel about this? This result is on the “satisfied” end of the scale, so there\
    \ is some comfort in that, but this single snapshot of customer satisfaction says\
    \ nothing about where this key metric is going.\n\nWhat’s ideal is to have the\
    \ data from the previous measurement period for comparison; even more useful is\
    \ to have historical data to understand the trend over time. If we’re looking\
    \ at landing page conversion rates, how have they performed historically? The\
    \ same is true for almost any marketing metric. When there is improvement from\
    \ one measurement period to the next, why did it occur? Likewise, when there is\
    \ degradation from one measurement period to the next, it’s important to investigate\
    \ to identify the reason. The root causes of changes in metrics are not always\
    \ easy to identify. Analyzing the data is an exercise that sometimes is akin to\
    \ detective work.\n\n> **Note**  \n> Effective analysis requires an objective\
    \ perspective and a determination to constantly pursue explanations for the results\
    \ marketing produces.\n\nBenchmark data from external sources isn’t always available,\
    \ but when it is, it provides a useful comparison. For example, webinar benchmark\
    \ data tells us that the ratio of registrants to attendees averages 42.9 percent.[²](#A978-1-4842-0259-3_4_Chapter.html#Fn2)\
    \ Less than half of the people who register for webinars actually attend them.\
    \ With this data, companies that produce webinars can know if their registration-to-attendee\
    \ ratio is cause for alarm or celebration, and they can do something about it\
    \ if they don’t like how their figures compare to the benchmark.\n\nThis analysis\
    \ step of the process is about drawing insights from the data about marketing’s\
    \ effectiveness. Analyzing all the metrics marketing collects about its work is\
    \ important because it is the way we understand marketing’s performance. It is\
    \ analogous to monitoring the gauges on the dashboard of a car. When a gauge goes\
    \ into the red, we understand there is a problem, but we don’t necessarily know\
    \ what the problem is. The gauge gives us some idea of where to begin looking\
    \ for the source of the problem. The diagnosis and prescription is the subject\
    \ of the next section of this chapter.\n\nThe analysis of the marketing metrics\
    \ provides a barometer of marketing’s performance. Because this analysis provides\
    \ the basis for taking improvement actions, it is very important that the data\
    \ used for analysis be accurate and complete. It’s possible to do excellent analysis\
    \ on bad or suspect data. The marketing analytics process requires accurate, complete\
    \ data, and attempting to execute the process without it will lead to erroneous\
    \ conclusions and ineffective attempts to improve what marketing is doing. When\
    \ this happens, as it sometimes does in the zeal to become analytics driven, it\
    \ damages marketing’s reputation and credibility. Marketers must ensure that the\
    \ data for the analytics process is accurate and reliable."
  raw: '### Step 2: Analyze the Metrics


    > The goal is to turn data into information, and information into insight. —Carly
    Fiorina, Information: The Currency of the Digital Age


    The second step in the analytics process is analysis: taking the data and, through
    inspection and analysis, turning it into actionable information. The goal of this
    analysis step is to draw insights from the data about marketing’s progress toward
    achieving its objectives. These insights aren’t always obvious, so analysis and
    interpretation helps them come to light.


    During the first step, we identified the metrics that are the crucial inputs to
    the marketing analytics process. With the proper metrics identified, the analysis
    step begins by capturing and tracking these metrics. In this modern era, where
    almost all marketing is digital, this means having the right systems and mechanisms
    are in place for reliably tracking metrics and making them available for analysis.


    The place where many marketing organizations were first introduced to analytics
    is through their websites. The website is one of the most important marketing
    channels for a company and capturing analytics data about website performance
    is imperative. Even for bricks-and-mortar businesses, a website is often the first
    stop for consumers who are looking for information as they consider a purchase.
    Every website should have analytics enabled for it so that marketers can understand
    performance and optimize the company’s web presence. Google Analytics is the ubiquitous,
    free solution most marketers use for this purpose. The realm of marketing analytics,
    however, extends far beyond web metrics.


    If the right systems are in place to capture metrics, understanding the current
    state of things is not difficult. The modern marketing organization uses three
    core systems to capture the analytics data it needs: web analytics, CRM, and marketing
    automation. There are, of course, other systems that provide data to marketing
    as well, such as purchase transaction data, but these three systems are the pillars.
    Without the data collection mechanisms these key systems provide, an analytics
    process is dead in the water. There is simply too much going on in the modern
    marketing organization to track metrics data without the benefit of automation
    and technology.


    With the right systems in place, a marketer can quickly get a snapshot of current
    performance metrics. In just a few clicks, one can see how many unique visitors
    have hit a campaign landing page, how many emails were opened, how many clicks
    a pay-per-click (PPC)scheme generated and more. Most marketing organizations organize
    their metrics into some sort of dashboard to visually present the data, making
    it easier to communicate and understand. [Chapter 7](../Text/A978-1-4842-0259-3_7_Chapter.html)
    discusses the use of dashboards in the marketing analytics process in greater
    detail.


    When analyzing marketing metrics, what marketers should do is understand the current
    state, compare it to the ideal state, and then do root-cause determination to
    explain any differences.


    Note


    The analysis step of the marketing analytics process begins with understanding
    the current state, comparing it to the ideal state, and understanding why there
    are differences.


    Seeing the current state of marketing’s performance by reviewing the latest analytics
    data is interesting for sure, but it’s just the beginning of the analysis process.
    The first question that reviewing this data prompts is usually: are these results
    good? Knowing whether any particular measurement result is good, bad, or indifferent
    requires some sort of comparison, to historical data or a set of benchmarks that
    represent a standard of excellence, preferably the latter.


    Comparison is important because without it, the metrics provide no sense of direction.
    Consider the very important metric of customer satisfaction. An initial, quantitative
    assessment of customer satisfaction has limited usefulness. To illustrate this,
    suppose a survey of customer satisfaction is conducted using a scale from 1 to
    5 where 1 equals very satisfied, and 5 equals very dissatisfied. This survey result
    reveals that the average satisfaction level is 2.3\. How should the organization
    feel about this? This result is on the “satisfied” end of the scale, so there
    is some comfort in that, but this single snapshot of customer satisfaction says
    nothing about where this key metric is going.


    What’s ideal is to have the data from the previous measurement period for comparison;
    even more useful is to have historical data to understand the trend over time.
    If we’re looking at landing page conversion rates, how have they performed historically?
    The same is true for almost any marketing metric. When there is improvement from
    one measurement period to the next, why did it occur? Likewise, when there is
    degradation from one measurement period to the next, it’s important to investigate
    to identify the reason. The root causes of changes in metrics are not always easy
    to identify. Analyzing the data is an exercise that sometimes is akin to detective
    work.


    Note


    Effective analysis requires an objective perspective and a determination to constantly
    pursue explanations for the results marketing produces.


    Benchmark data from external sources isn’t always available, but when it is, it
    provides a useful comparison. For example, webinar benchmark data tells us that
    the ratio of registrants to attendees averages 42.9 percent.[²](#A978-1-4842-0259-3_4_Chapter.html#Fn2)
    Less than half of the people who register for webinars actually attend them. With
    this data, companies that produce webinars can know if their registration-to-attendee
    ratio is cause for alarm or celebration, and they can do something about it if
    they don’t like how their figures compare to the benchmark.


    This analysis step of the process is about drawing insights from the data about
    marketing’s effectiveness. Analyzing all the metrics marketing collects about
    its work is important because it is the way we understand marketing’s performance.
    It is analogous to monitoring the gauges on the dashboard of a car. When a gauge
    goes into the red, we understand there is a problem, but we don’t necessarily
    know what the problem is. The gauge gives us some idea of where to begin looking
    for the source of the problem. The diagnosis and prescription is the subject of
    the next section of this chapter.


    The analysis of the marketing metrics provides a barometer of marketing’s performance.
    Because this analysis provides the basis for taking improvement actions, it is
    very important that the data used for analysis be accurate and complete. It’s
    possible to do excellent analysis on bad or suspect data. The marketing analytics
    process requires accurate, complete data, and attempting to execute the process
    without it will lead to erroneous conclusions and ineffective attempts to improve
    what marketing is doing. When this happens, as it sometimes does in the zeal to
    become analytics driven, it damages marketing’s reputation and credibility. Marketers
    must ensure that the data for the analytics process is accurate and reliable.'
  trans: "\n### 第二步：分析指标\n\n> 目标是将数据转化为信息，再将信息转化为洞察。——卡莉·菲奥莉娜，《信息：数字时代的货币》\n\n分析流程的第二步是分析：获取数据，并通过检查与分析，将其转化为可操作的信息。此分析步骤的目标是从数据中得出关于营销在实现目标方面进展的洞察。这些洞察并非总是显而易见，因此分析与解读有助于揭示它们。\n\
    \n在第一步中，我们确定了作为营销分析流程关键输入的指标。在确定合适的指标后，分析步骤就从捕获和追踪这些指标开始。在这个几乎所有营销活动都已数字化的现代时代，这意味着需要建立正确的系统和机制，以可靠地追踪指标，并使其可供分析。\n\
    \n许多营销组织首次接触分析，都是通过它们的网站。网站是公司最重要的营销渠道之一，捕获网站性能的分析数据至关重要。即使是实体企业，网站也往往是消费者在考虑购买时查找信息的第一站。每个网站都应启用分析功能，以便营销人员了解性能并优化公司的网络形象。`Google\
    \ Analytics` 是大多数营销人员为此目的普遍使用的免费解决方案。然而，营销分析的领域远不止于网络指标。\n\n如果已建立正确的系统来捕获指标，那么了解当前状况并不困难。现代营销组织使用三个核心系统来捕获所需的分析数据：网站分析、CRM\
    \ 和营销自动化。当然，还有其他系统也为营销提供数据，例如购买交易数据，但这三个系统是支柱。没有这些关键系统提供的数据收集机制，分析流程将寸步难行。现代营销组织中事务繁多，若不借助自动化与技术，根本不可能手动追踪指标数据。\n\
    \n有了正确的系统，营销人员可以快速获取当前性能指标的快照。只需点击几下鼠标，就能看到有多少独立访客访问了活动落地页，有多少封邮件被打开，按点击付费（PPC）方案产生了多少次点击，等等。大多数营销组织将指标整理到某种仪表盘中，以直观方式呈现数据，从而更易于沟通和理解。第\
    \ 7 章会更详细地讨论仪表盘在营销分析流程中的使用。\n\n在分析营销指标时，营销人员应该做的是：了解当前状态，将其与理想状态进行比较，然后进行根本原因分析，以解释任何差异。\n\
    \n> **注意**  \n> 营销分析流程的分析步骤始于了解当前状态，将其与理想状态进行比较，并理解存在差异的原因。\n\n通过查看最新的分析数据来了解营销的当前表现固然有趣，但这仅仅是分析流程的开始。查看这些数据后，首先提出的问题通常是：这些结果好吗？要知道某个特定测量结果是好、是坏、还是无关紧要，需要某种形式的比较，要么与历史数据比较，要么与代表卓越标准的一组基准进行比较，最好是后者。\n\
    \n比较之所以重要，是因为没有比较，指标就无法提供方向感。以客户满意度这一非常重要的指标为例。对客户满意度进行初步的量化评估，其作用十分有限。为了说明这一点，假设进行一次客户满意度调查，评分范围为\
    \ 1 到 5，其中 1 表示非常满意，5 表示非常不满意。调查结果显示平均满意度为 2.3。组织应如何看待这个结果？这个结果处于“满意”的一端，因此多少有些安慰，但这一单一的客户满意度快照完全无法说明这一关键指标的发展趋势。\n\
    \n理想的情况是拥有上一个测量周期的数据以供比较；更有用的是拥有历史数据以了解随时间变化的趋势。如果我们在看落地页转化率，历史上它的表现如何？几乎对于任何营销指标都是如此。当一个测量周期到下一个周期出现改进时，为什么会发生这种情况？同样，当一个周期到下一个周期出现退步时，进行调查以找出原因至关重要。指标变化的根本原因并不总是容易确定。分析数据有时类似于侦探工作。\n\
    \n> **注意**  \n> 有效的分析需要客观的视角，以及不断寻求营销结果成因的决心。\n\n来自外部的基准数据并非总是可用，但若有可用数据，则能提供有用的比较。例如，网络研讨会基准数据告诉我们，注册者到实际参会者的平均比率为\
    \ 42.9%。² 注册网络研讨会的人中，实际参会者不到一半。有了这些数据，举办网络研讨会的公司就能知道他们的注册-参会比率是值得警惕还是值得庆祝，并且如果他们对自身数据与基准的比较结果不满意，就可以采取相应措施。\n\
    \n这一分析步骤的目标是从数据中得出关于营销有效性的洞察。分析营销收集的所有关于其工作的指标至关重要，因为这是我们理解营销绩效的方式。这类似于监控汽车仪表盘上的仪表。当仪表指针进入红色区域时，我们知道存在问题，但未必知道问题是什么。仪表为我们提供了从哪里开始寻找问题根源的一些线索。诊断与处方将是本章下一节的主题。\n\
    \n营销指标的分析提供了衡量营销绩效的晴雨表。由于这一分析为采取改进措施提供了基础，因此用于分析的数据必须准确且完整，这一点非常重要。对糟糕或可疑的数据进行出色分析是有可能的。营销分析流程需要准确、完整的数据，若缺少这些数据而试图执行该流程，将导致错误的结论以及改进营销工作的无效尝试。当这种情况发生时（有时在急于成为分析驱动型组织时会发生），会损害营销的声誉和可信度。营销人员必须确保用于分析流程的数据准确可靠。\n"
- fmt: '### Step 3: Take Improvement Actions


    Excellent firms don’t believe in excellence—only in constant improvement and constant
    change.


    —Tom Peters, *In Search of Excellence*


    Analyzing the marketing metrics tells us what is happening and why, but it doesn’t
    always tell us what to do about it if the results don’t meet expectations. Nor
    does the analysis always help us know how to replicate what is happening when
    outcomes exceed expectations. What marketing must do in this step of the analytics
    process is determine what actions and changes are most likely to yield improvement.
    No matter how thorough the analysis, it is of no value if it doesn’t lead to some
    sort of improvement action.


    Sometimes, the improvement actions are obvious. For example, analysis of a mass
    email send that performs poorly reveals that an unusually high number of email
    addresses bounced back, indicating they were invalid. The improvement action here
    is obvious: remove the invalid addresses and keep the email contact list current.
    Improvement actions aren’t always so obvious in other cases.


    In another scenario, a `PPC` ad campaign doesn’t perform well. Comparing this
    underperforming `PPC` campaign to previous campaigns shows the click-through rate
    (`CTR`) from the landing page is well below the norm. The analysis shows that
    the same strategy was in use for all `PPC` campaigns: a unique landing web page
    was set up for those who clicked on the ad. The offer or “call to action” conversion
    on the landing page was similar to previous campaigns that did perform well. The
    traffic to the landing page was within expected parameters. So what’s wrong, and
    more important, what is the right improvement action?


    In this scenario, there’s clearly some problem with the landing page, but the
    analysis doesn’t tell us how to fix it; it only tells us where the problems seems
    to reside. In this example, it is the landing page itself, because it is not producing
    the conversions at a rate similar to previous campaigns. To find a solution, the
    marketing team could perform some `A/B` testing, a process referenced briefly
    in [Chapter 3](../Text/A978-1-4842-0259-3_3_Chapter.html).


    `A/B` testing involves presenting two versions of a landing page to visitors.
    The `A` version is the control page and the `B` version has some variation. The
    variations might include different call-to-action text, graphics, a different
    page layout, color scheme, or any conceivable change. The goal is to find what
    variations perform the best. Both pages are presented to visitors, and the analytics
    are monitored closely. The visitors themselves determine the winning page. In
    this example, the winning page is the one with the best conversion rate. It is
    likely that a series of `A/B` tests are needed to fully optimize a campaign.


    `A/B` and other kinds of testing and research are very helpful tools in determining
    which improvement actions marketing should take. Testing and research help eliminate
    the guesswork from improvement actions, but too few marketers take the time to
    do it. The enemy of the testing and research approach is expediency and the mind-set
    of “we’ve always done it this way.” It takes time and discipline to test, research,
    and determine what to do as a result. Marketers under a lot of pressure to produce
    immediate results are often reluctant to do market research and test approaches
    before committing to them, as it simply takes too much time. But it’s time well
    spent, because it helps ensure that improvement actions are the right ones the
    first time. Testing and research, therefore, are excellent initial steps to identifying
    improvement actions.


    Of all the steps in the analytics process, the improvement step is the least scripted.
    The range of potential improvement actions is limited only by the creativity of
    the team tasked with identifying them. When searching for improvement actions
    to take, brainstorm all possible ideas. Don’t reject any ideas in the beginning.
    Then, before implementing improvement actions, narrow the list of candidate ideas
    down to one if possible. Too many simultaneous improvements will make it difficult
    or impossible to know which one contributed the most to better performance.


    Are improvements always necessary? Is it ever possible to skip the improvement
    step because things are going so well? In theory, any process always has room
    for improvement. In practicality, there is a point of diminishing returns on improving
    something marketing is doing. If there are performance objectives or standards
    for marketing tasks or activities, and the metrics analysis indicates that marketing
    consistently meets or exceeds them, then marketing can look elsewhere to invest
    its time and improvement efforts. Keep in mind that the scope of what marketing
    should measure is broad, so success in one area doesn’t mean it’s all right to
    ignore the entire analytics process. It just means that the area where success
    is occurring, based on the metrics analysis, frees marketing to investigate and
    improve elsewhere.


    This improvement step isn’t just about addressing low performance. It’s also about
    replicating what’s working well. The analysis step will identify excellent performance,
    and when it does, the marketing team should determine how to apply what caused
    it to future efforts. The causes of ideal outcomes form the basis of best practices
    that help the organization consistently achieve the desired results.


    ### Do It Again


    > You go back, Jack, do it again. —Steely Dan, “Do It Again”


    The three-step process described in this chapter represents how the marketing
    analytics process should be executed. Each organization will have a unique variation
    of the process, with different metrics, different conclusions from the analysis,
    and different improvement actions to take. Yet the three steps remain constant:
    measure, analyze, and improve.


    Executing this process just once or intermittently will produce some benefit,
    but its greatest value comes from continuous use. Repetition of the analytics
    process is necessary to produce consistent and sustained improvement. The real
    advantages of analytics only come with ongoing, long-term execution of the process.
    Every time marketing does work in pursuit of its objectives, that work should
    fall within the scope of the analytics process.


    For every marketing campaign, communication, event, and investment, the cycle
    of measure, analyze, and improve should occur at the conclusion before the next
    campaign, communication, event, or investment takes place. The frequency of invoking
    the analytics process will of course vary depending on what marketing is doing.
    Some marketing actions are so important that analytics are monitored in real time,
    whereas others require daily, weekly, or monthly scrutiny.


    What’s important is to not let complacency infiltrate the process. It’s tempting
    to relax when regular reviews of the metrics show that everything is fine. In
    fact, in these circumstances, it is very easy to assume that marketing’s work
    is so fine-tuned that it can run on auto-pilot. This state of marketing nirvana,
    is rare, and when it does materialize, it never lasts for long. Remaining vigilant
    to the analytics process is the way to ensure the best long-term performance of
    marketing.


    Footnotes [1](#A978-1-4842-0259-3_4_Chapter.html#Fn1_source)


    Joseph L. Levy, “In My Opinion,” *CIO Enterprise*, September 15, 1999, p. 10.


    [2](#A978-1-4842-0259-3_4_Chapter.html#Fn2_source)


    ON24 Webinar Benchmarks Report, 2014 edition. [`http://www.on24.com/wp-content/uploads/2014/04/ON24_Benchmark_2014_Final.pdf`](http://www.on24.com/wp-content/uploads/2014/04/ON24_Benchmark_2014_Final.pdf).'
