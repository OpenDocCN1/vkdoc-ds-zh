    # 6. 投资回报率


    ## 终极指标？


    对于许多营销人员来说，证明市场营销的投资回报率（`ROI`）长期以来一直是他们的心头之痛。营销部门以外的人一致赞成让营销部门报告其`ROI`。他们希望营销部门能像其他部门一样，对`ROI`负有同等责任。而营销部门内部则意见不一。一些营销人员欣然接受计算和报告`ROI`，认为这是验证营销工作的最佳方式。他们认识到，能够准确报告营销的`ROI`可以赢得认可，并且如果回报达到或超过预期，就可以更轻松地证明预算和资源的合理性。`ROI`
    有可能使营销资金和运作去政治化。


    营销团队中的其他人则担心需要衡量自己的`ROI`，因为这可能暴露出低绩效，并使他们面临不利后果。还有一些人干脆认为，专注于`ROI`会损害营销的真正使命。无论立场如何，营销部门在将`ROI`作为一项指标方面一直进展缓慢，正如漫画家
    Brady Bonus 在图 6-1 中所描绘的那样，`ROI`成为营销讨论的一部分仍然是个例外。


    ![A978-1-4842-0259-3_6_Fig1_HTML.jpg](img/A978-1-4842-0259-3_6_Fig1_HTML.jpg)


    图 6-1。 对于大多数营销组织而言，理解其`ROI`仍然难以捉摸


    在营销人员面临的挑战中，证明`ROI`是首要挑战，其排名远在争取预算之上。¹ 无论营销人员是喜欢还是讨厌接受`ROI`的审视，许多高管层成员都期望看到这些数字，因此营销部门应该理解它是什么以及如何报告它。


    营销`ROI`的一个问题是，许多营销人员根本不理解它是什么，正如这个 Quora 帖子²所说明的那样：


    *   问题：“对于一家咨询公司的数字营销活动，什么样的`ROI`被认为是好的？”

    *   回答：“如果你能花低于 50 美元的成本产生销售线索，那你可能做得相当不错了。特别是当你的合同金额很可能在数千美元左右时。对于像电子书下载这样的‘软转化’，20%的响应率也被认为是好的。”


    这个帖子的回答虽然有所帮助，但从未明确提及任何关于`ROI`的内容，尽管它提供了一些可能有助于确定`ROI`的数据。


    `ROI` 是一个衡量每次投资所获利润的盈利比率，其结果以百分比表示。企业将`ROI`作为衡量各种投资和项目成功与否的指标。它既用于评估过去的成功，也用于预测未来的成功。计算`ROI`的公式相当简单：


    ![$$ \mathrm{Return}\kern0.5em \mathrm{on}\kern0.5em \mathrm{Investment}\kern0.5em
    =\kern0.5em \frac{\mathrm{Gain}\kern0.5em \mathrm{on}\kern0.5em \mathrm{investment}\kern0.5em
    \hbox{--} \kern0.5em \mathrm{Cost}\kern0.5em \mathrm{of}\kern0.5em \mathrm{investment}}{\mathrm{Cost}\kern0.5em
    \mathrm{of}\kern0.5em \mathrm{investment}} $$](img/A978-1-4842-0259-3_6_Chapter_TeX2GIF_Equa.gif)


    在计算中，成本部分不难获得。而这个等式中的“收益”要素却难以在足够的精确度下衡量，以使人们对结果产生信心。


    为了说明这一点，以参加贸易展会为例，这是一种常常需要证明其合理性并报告后续`ROI`的营销活动。本例中的假设是，参会最终会带来可归属的销售收入。如表 6-1
    所示，`ROI`的计算似乎非常简单，只需考虑硬性成本和收入。


    表 6-1。 确定展会`ROI`的示例


    | 描述 | 成本 | 收益 |

    | --- | --- | --- |

    | 展位/赞助费 | $15,000 | — |

    | 运输费 | $1,500 | — |

    | 差旅费 | $2,500 | — |

    | 促销品费用 | $1,000 | — |

    | 宣传资料及其他费用 | $1,000 | — |

    | 总成本 | $21,000 | — |

    | 展会线索带来的销售额 | — | $45,000 |

    | 总回报 |   | $24,000 |

    | `ROI` |   | 114% |


    表 6-1 中的示例似乎让确定参加展会的`ROI`变得简单，而事实上，这里显示 114%的`ROI`意味着这项投资的回报非常出色。然而，这个场景没有考虑的是那些虽然真实存在但难以量化的软性收益。例如，品牌知名度的提升、作为行业思想领袖声誉的增强、收集到的竞争情报，以及通过与展会参会者面对面交流而产生的新产品创意。这些收益都没有在表
    6-1 所示的`ROI`计算中体现出来，而其最终价值可能远远超过本例中 45,000 美元的销售额。当硬性成本和收益带来 114%的`ROI`时，或许核算这些软性收益并不重要，但当业务案例处于盈亏平衡或显示亏损时，量化这些软性收益就变得至关重要，然而却很难做到。


    尽管存在这些挑战，衡量营销的`ROI`在政治上是明智之举。营销人员不能抱着精英主义的态度，仅仅因为他们认为自己是一种无法衡量的、行善的神秘力量，就将自己置于`ROI`衡量的责任之上。组织中没有任何其他部门可以免于达到`ROI`期望的要求。为什么营销部门就要例外呢？


    现实情况是：在大多数组织中，以高度确定性来衡量营销的`ROI`是一个严峻的挑战，一些营销人员甚至认为这是不可能的。而日益完善的系统、技术以及使用它们捕获确定`ROI`所需数据的便捷性，正在使其成为可能。然而，并没有一个系统能够捕捉营销为创造价值所做的一切。即使有数据可以精确计算营销的`ROI`，业内一些人认为这并不总是合适的，而另一些人则认为这样做是完全错误的。


    你如何将更好的客户体验转化为`ROI`？营销人员使用的系统正在变得更好，他们使用这些系统的纪律也在增强，但你仍然无法将营销所做的一切都转化为`ROI`衡量指标。为了说明这一困难，SHIFT
    Communications 战略执行副总裁 Scott Monty 曾说过：“早上穿裤子能带来多少`ROI`？”³ 很难确切知道答案，但不穿裤子的负面后果却很容易想象。营销也是如此：它必须做一些事情，仅仅因为做这些事情是合理的——就好比早上穿裤子这个比喻——因此，捕捉营销所做一切的`ROI`是没有意义的。

