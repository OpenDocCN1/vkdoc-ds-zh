    shares these comments about the solution’s importance:


    > I’m not sure how anyone effectively does their job in the marketing field without
    a platform like this. HubSpot has been one of our greatest weapons, especially
    at a startup, as we’re going up against big companies with a strong and solidified
    groundwork. The data that HubSpot provides is simply unparalleled—any number you
    could possibly want to know, whether it’s website visits, page performance, blog
    hits, social media metrics, CTA clicks (and anything else you can think of), is
    all found within the portal. The easy to use interface allows you to aggregate
    all of your marketing efforts in one place, giving you numerical-proven insight
    into exactly what is and is not working. The depth that the information goes into
    in the platform is simply invaluable—it drives everything that our team does.


    Solar continues, reflecting on the shift toward analytics, metrics, and data-driven
    marketing:


    > Long gone are the days when marketing was viewed as “arts and crafts”—and this
    is largely due to platforms such as HubSpot. Marketing has shifted to a completely
    data-driven industry, powered by conversion rates, click-to-open percentages,
    SEO, keyword analytics, and submission rates. HubSpot not only allows you to see
    all of these metrics, but it guides you through the whole process with a robust
    knowledge center. HubSpot has transformed our company into a marketing powerhouse.


    Marketing automation solutions have a lot of affinity with CRM solutions, and
    they are often integrated. When they are, the marketing team has an even broader
    perspective of the buyer’s journey with the addition of data about sales interactions
    with prospects and customers. Whether implemented separately or integrated with
    CRM, marketing automation platforms are the foundation for marketing analytics.
    Marketers who want to build and sustain a marketing analytics process should prioritize
    the implementation of a marketing automation solution. Marketing automation is
    rapidly evolving into the system of record that marketing organizations have lacked.


    Note


    Marketing automation serves as the foundation for the marketing analytics process,
    on which marketers can build and sustain an analytics process.


    These solutions are only growing in importance and value. Today their analytics
    capabilities show what happened in the past, and this solution space is on the
    cusp of integrating predictive marketing analytics capabilities into their solutions.
    Predictive analytics, covered in greater detail in Chapter [10](../Text/A978-1-4842-0259-3_10_Chapter.html),
    will provide marketers with very accurate models that forecast future purchase
    decisions based on prospect behavior. The organizations that have mature, complete
    marketing automation implementations are poised to be the first to exploit this
    game-changing capability. Marketing automation is an essential platform for those
    who want to use analytics to become more revenue-driven and results-oriented.


    ## Marketing Analytics Tools


    > We become what we behold. We shape our tools and then our tools shape us. [⁵](#A978-1-4842-0259-3_8_Chapter.html#Fn5)
    —John M. Culkin


    Having marketing automation installed and fully implemented provides a great foundation
    for marketing analytics. As a marketing team develops proficiency with the analytics
    process, it begins to exploit the insights the process yields. When this maturing
    takes place, it often spawns a desire to expand the reach and range of the marketing
    analytics, which requires additional tools and data. The selection of specific
    tools to use is a challenge for any organization that wades into the deeper end
    of the marketing analytics pool. Of course, the type of metrics chosen for its
    analytics portfolio will drive tool selection, but there are easily hundreds of
    potential tools available. Where there was once just a handful to choices, marketers
    now have an embarrassment of riches in the analytics tools category.


    This chapter does not attempt to provide a comprehensive catalog of marketing
    analytics tools, because the offerings change so quickly and some of the information
    would be obsolete at the time of publication. Instead, the remainder of this chapter
    will describe two broad classes of marketing analytics and include examples of
    tools that exist in these categories. The goals here are to make the reader aware
    that tools exist for a wide variety of purposes and applications and encourage
    the reader to further research what these are and the latest offerings on the
    market.


    Because there are so many tools available for marketing analytics, it is easier
    to separate them into two broad categories based on high-level function, and then
    consider some example tools within each of those categories:


    Strategic: tools and systems for business intelligence, customer intelligence,
    understanding buying behavior, advanced attribution, and predictive analytics.
    Operations and logistics: tools and systems for managing, testing, and optimizing
    a web presence, mobile, multichannel campaign performance, demand, and geo-modeling.


    There is some overlap in the names of these two categories, as all analytics are
    strategic, and therefore by default so are the tools used to support them. However,
    even within the realm of strategic analytics, there some that are more operationally
    oriented than others. Most marketing analytics tools fall neatly into these two
    categories, which the rest of this chapter explores.'
