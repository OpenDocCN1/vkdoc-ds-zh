    \n本作品受版权保护。出版商保留所有权利，无论是涉及材料的全部或部分，特别是翻译、重印、重用插图、背诵、广播、缩微胶片复制或任何其他物理形式的复制权，以及传输或信息存储与检索、电子改编、计算机软件，或目前已知或未来开发的任何类似或不同方法的权利。法律保留的例外情况包括：与评论或学术分析相关的简短摘录，或专门为在计算机系统上输入和执行而提供的材料，仅供购买者独占使用。未经出版商所在地现行版权法规定许可，不得复制本出版物或其任何部分，且使用许可必须始终从\
    \ Springer 获取。使用许可可通过版权清算中心的 RightsLink 获取。违反者将根据相应版权法被起诉。\n\n本书中可能出现商标名称、标识和图像。我们并未在每个商标名称、标识或图像出现时都使用商标符号，而是仅在编辑性用途中使用这些名称、标识和图像，以维护商标所有者的利益，无意侵犯商标权。本出版物中使用的商品名称、商标、服务标志及类似术语，即使未明确标识，也不应被视为对其是否受专有权利保护的表达。\n\
    \n尽管本书中的建议和信息在出版时被认为是真实准确的，但作者、编辑和出版商均不对可能存在的任何错误或遗漏承担法律责任。出版商对本材料内容不作任何明示或暗示的保证。\n\
    \n本书通过 Springer Science+Business Media New York 在全球图书贸易中发行，地址为 233 Spring Street,\
    \ 6th Floor, New York, NY 10013。电话：1-800-SPRINGER，传真：(201) 348-4505，电子邮件：`orders-ny@springer-sbm.com`，或访问`www.springeronline.com`。\n\
    \nApress Media, LLC 是一家加利福尼亚州的有限责任公司，其唯一成员（所有者）是 Springer Science + Business Media\
    \ Finance Inc（SSBM Finance Inc）。SSBM Finance Inc 是一家特拉华州的公司。\n\n致丽莎：我三十年的妻子。一个男人在生活中再找不到更优秀、更真诚的伴侣了。\
    \  \n以及，致那些正在寻找更好方式来回答“你最近为我们做了什么？”这一问题的营销人员。\n\n## 引言\n\n我进入营销行业纯属偶然。30 多年前，我大学毕业，获得计算机科学学位。在攻读学位的四年里，我在大学的数据中心工作。我拥有软件开发的理论基础，简历上也包含了高度相关的经验。尽管毕业时就业市场相对不景气，我还是收到了三份不错的录用通知。令我自己惊讶的是，我选择了起薪最低的那一份，来自\
    \ IBM，因为我喜欢那里的文化和晋升机会。IBM 没有把我视为软件程序员，而是将我安排在了销售与营销分支机构。从那天起，我再也没有写过一行代码，并且我对此毫不后悔。\n\
    \n我立刻被吸引到了销售和营销的世界，并尽我所能从 IBM——业内最擅长营销其解决方案的公司之一——学习一切。通过一系列工作变动，每一次都让我更深入地进入营销行业，我从导师和经验（及错误）中了解到营销在现实世界中是如何运作的。我的分析编程背景从未离开过我。尽管我对营销充满热情，但也对如何将我的营销工作与业务成果联系起来知之甚少感到困扰。我见过营销部门获得了本非由其产生的业务成果的赞誉，也见过它创造了成果却未能获得认可，还因其贡献不足而受到（公平或不公平的）指责。几乎在每种情况下，对营销的判断都基于观点和推测，而非数据。这让我感到困扰。\n\
    \n不可避免的结论是，对营销成功的判定过于随意、过于主观。即使营销表现出色，如果没有数据证明，首席财务官仍可能削减营销预算。首席执行官会质疑营销的贡献。组织的其他部门很容易将营销视为一种奢侈品，而非必需品。在审视其他企业职能时，例如研发、人力资源或销售，我注意到它们各自都有一套特定的指标，清晰地表明了其工作完成情况。而营销部门并非如此。如果营销部门被送上法庭，因其表现接受审判，辩护方能为营销提供什么证据呢？似乎非常少。\n\
    \n营销所需要的是一套指标，能够将其成功的判定从主观臆测的领域带入客观事实的范畴。作为领导者，我知道我们需要的不仅仅是能够说出我们生产了 X 个资产或管理了\
    \ Y 次贸易展会的参与，以及其他类似的、试图将我们的工作与高层管理者关心的事情联系起来的模糊尝试。这些关于问责制的尝试在每个人心中都留下了关于营销真实表现如何的疑问。解决方案是采用分析方法和一套指标，提供有关营销贡献的有意义数据，这样，即使有人可能不同意营销的方法，也对结果无可争辩。\n"
- fmt: '# This Book''s Purpose and Audience


    This book was born out of my past frustration and experience with how marketing
    manages its performance and how that performance is judged. I’ve written this
    book for the marketing organizations that have not yet started their analytics
    journey but know that they need to and are trying to figure out where to begin.
    I intend for this book to inspire marketers and marketing organizations to get
    moving and point them in the direction they should go. The advice contained here
    will provide them with a roadmap, as the title suggests, with recommendations
    on methods, metrics, and tools to consider on that journey. What this book will
    not do is provide detailed, turn-by-turn directions from start to finish of the
    marketing analytics journey. The reason is simple: each organization’s journey
    must be different. The things that define the speed, vehicle, and even detours
    of that journey vary from company to company.


    This book is not for those who have already achieved maturity with their marketing
    analytics process, unless perhaps they want a nostalgic tour of where they’ve
    been. That still leaves a broad audience for the direction this book provides.
    A study I completed in partnership with VisionEdge Marketing just as this book
    went to publication reveals that just one in five marketing organizations have
    an effective analytics process in place. For everyone else—the 80 percent—this
    book will provide some encouragement and advice for starting and completing the
    marketing analytics journey. As the Chinese proverb attributed to Laozi states:
    “A journey of a thousand miles begins with a single step.” I hope this book helps
    many marketers take that first step.


    Jerry Rackley


    May 2015


    ## Acknowledgments


    I’m grateful to my Demand Metric colleagues, particularly John Follett and Jesse
    Hopps for their encouragement and support in the writing of this book. Likewise,
    to Dr. Joshua Wiener and Dr. Tom Brown in the marketing department at the Oklahoma
    State University Spears School of Business, who have encouraged, supported and
    mentored me.


    There is a legion of marketing professionals who champion the cause of marketing
    analytics and the technology behind it: Scott Brinker, Laura Patterson, Clare
    Price, and Stephan Sorger, just to name a few. Their passion and enthusiasm has
    inspired me to put my thoughts and ideas into book form.


    I owe a debt to those who have allowed me to be their marketer, both clients and
    employers. The experience gained from working alongside them in the marketing
    trenches has provided the grist for this book.


    Finally, thanks to Jeff Olson, who found me, reached out to me, and convinced
    me to begin this book-writing adventure. Thanks to Rita, Susan, Laura, and the
    great team at Apress for their gracious and patient support throughout the process.


    ## Apress Business: The Unbiased Source of Business Information


    Apress business books provide essential information and practical advice, each
    written for practitioners by recognized experts. Busy managers and professionals
    in all areas of the business world—and at all levels of technical sophistication—look
    to our books for the actionable ideas and tools they need to solve problems, update
    and enhance their professional skills, make their work lives easier, and capitalize
    on opportunity.


    Whatever the topic on the business spectrum—entrepreneurship, finance, sales,
    marketing, management, regulation, information technology, among others—Apress
    has been praised for providing the objective information and unbiased advice you
    need to excel in your daily work life. Our authors have no axes to grind; they
    understand they have one job only—to deliver up-to-date, accurate information
    simply, concisely, and with deep insight that addresses the real needs of our
    readers.


    It is increasingly hard to find information—whether in the news media, on the
    Internet, and now all too often in books—that is even-handed and has your best
    interests at heart. We therefore hope that you enjoy this book, which has been
    carefully crafted to meet our standards of quality and unbiased coverage.


    We are always interested in your feedback or ideas for new titles. Perhaps you’d
    even like to write a book yourself. Whatever the case, reach out to us at `editorial@apress.com`
    and an editor will respond swiftly. Incidentally, at the back of this book, you
