- fmt: "# 7. Marketing Dashboards\n\n## The Voice of the Analytics Process\n\nThink\
    \ about the experience of attending a professional sporting event where the scoreboard\
    \ isn’t working or doesn’t exist. Unless you’re very attentive to everything happening\
    \ on the field, it’s hard to know who’s winning. Or, as the opening paragraph\
    \ of [Chapter 1](../Text/A978-1-4842-0259-3_1_Chapter.html) describes, imagine\
    \ driving a vehicle without the benefit of any information the dashboard provides.\
    \ It’s possible to do so, but it leaves most drivers uneasy and full of questions.\
    \ How much fuel is left? Am I going too fast or too slow? The dashboard not only\
    \ provides vital performance information, it also provides reassurance or causes\
    \ alarm—both important emotional states to keeping the vehicle running well in\
    \ the long term.\n\nA scoreboard and a dashboard, while different, have similar\
    \ purposes: to provide a practical progress indicator and accountability mechanism\
    \ for the marketing strategy as measured by the marketing analytics process. Analytics\
    \ purists will recognize a difference between a scoreboard (or scorecard as they\
    \ are often called) and a dashboard. Scorecards are frequently associated with\
    \ the Harvard Business School business strategy of the balanced scorecard approach.[¹](#A978-1-4842-0259-3_7_Chapter.html#Fn1)\
    \ They are created via a top-down method that results in identifying Key Performance\
    \ Indicators (`KPIs`) that track an organization’s success executing the business\
    \ strategy. The process is effective when the `KPIs` of a scoreboard trickle down\
    \ into the lower levels of the organization, where they are interpreted by departments\
    \ and individuals in ways that influence their work. While the scoreboard or scorecard\
    \ is an interface to performance information deemed strategic or critical, it\
    \ isn’t necessarily a visual one.\n\nDashboards, on the other hand, provide a\
    \ visual interface for performance data for any area or business application,\
    \ not just marketing. They are frequently linked to real-time information sources\
    \ and display performance data in summary fashion in the form of graphs or “gauges”\
    \ that emulate an automobile dashboard. The intent is to share the dashboard,\
    \ for it to have visibility within the marketing department and outside to other\
    \ departments and executives, to facilitate accountability and decision making.\
    \ Although there are differences between scoreboards and dashboards, the distinctions\
    \ matter little when it comes to marketing analytics. What does matter is having\
    \ an easily accessible, visual interface for marketing’s key performance data.\
    \ For simplicity, this chapter will use the term `dashboard` to refer to this\
    \ interface.\n\nIn the marketing realm, a marketing dashboard is a performance\
    \ management tool and interface that provides an accessible, visual summary of\
    \ marketing’s `KPIs`. Stephen Few, founder and principal of Perceptual Edge, offers\
    \ this definition: “A dashboard is a visual display of the most important information\
    \ needed to achieve one or more objectives, consolidated and arranged on a single\
    \ screen so the information can be monitored at a glance.”[²](#A978-1-4842-0259-3_7_Chapter.html#Fn2)\
    \ These dashboards exist in a number of formats, from something as simple as a\
    \ series of charts printed on paper and posted to a bulletin board to a digital\
    \ display updated in real time.\n\nMarketing dashboards are important because\
    \ they render the large volume of data a marketing analytics process can produce\
    \ into a meaningful, understandable and actionable summary. As this chapter will\
    \ discuss, marketing dashboards (intentionally plural, as there are often more\
    \ than one) evolve in terms of what they report, but at the same time they provide\
    \ a consistent reference to users in and outside of the marketing organization.\
    \ Figure [7-1](#A978-1-4842-0259-3_7_Chapter.html#Fig1) displays a screenshot\
    \ of a sample marketing dashboard provided by the Lenskold Group.[³](#A978-1-4842-0259-3_7_Chapter.html#Fn3)\n\
    \n![A978-1-4842-0259-3_7_Fig1_HTML.jpg](Images/A978-1-4842-0259-3_7_Fig1_HTML.jpg)\n\
    \nFigure 7-1. This marketing dashboard example provided by the Lenskold Group\
    \ features gauges for goal tracking, tables with select data details, and trend\
    \ tracking graphs for key metrics\n\nWithin the marketing organization, a dashboard’s\
    \ primary use is as a performance management tool. The very act of creating and\
    \ managing a marketing dashboard requires a deep understanding of the source data.\
    \ Creating dashboards that let marketers see the trends and directions of the\
    \ big picture view provides otherwise difficult-to-access insights about marketing\
    \ processes. The marketing team, therefore, uses dashboards to manage and improve\
    \ its core processes. Sometimes, a review of the latest dashboard provides reassurance\
    \ that all is well. Other times, the dashboard reveals a trend that, if addressed\
    \ early, requires minor corrective actions now or major ones later if left unaddressed.\
    \ Properly constructed and maintained dashboards help marketers spot problems\
    \ in a timely way and then do something about them.\n\n> **Note**  \n> Marketing\
    \ dashboards, when properly constructed, help marketers identify problems early\
    \ and do something to correct them.\n\nOutside of the marketing organization,\
    \ a dashboard’s primary use is as a communications tool for informing stakeholders.\
    \ A marketing dashboard is ideally a visually rich, easy-to-understand summary\
    \ of marketing `KPIs`. It provides those outside of marketing with a window to\
    \ see what marketing is doing and what kind of results it is achieving, which\
    \ in turn provides accountability. In this capacity, marketing dashboards reassure\
    \ the organization that marketing is performing and to what degree. For most in\
    \ the organization outside of marketing, these dashboards are their primary interface\
    \ to marketing.\n\nThe development and deployment of marketing dashboards should\
    \ occur later in the marketing analytics process, after the planning, decisions,\
    \ and implementation described in [Chapters 5](../Text/A978-1-4842-0259-3_5_Chapter.html)\
    \ and [6](../Text/A978-1-4842-0259-3_6_Chapter.html) occur. Only after the determination\
    \ of metrics to support the marketing analytics process is complete can you begin\
    \ planning what kind of dashboard will best inform stakeholders and constituents\
    \ about the marketing’s performance."
  raw: '# 7. Marketing Dashboards


    The Voice of the Analytics Process


    Think about the experience of attending a professional sporting event where the
    scoreboard isn’t working or doesn’t exist. Unless you’re very attentive to everything
    happening on the field, it’s hard to know who’s winning. Or, as the opening paragraph
    of [Chapter 1](../Text/A978-1-4842-0259-3_1_Chapter.html) describes, imagine driving
    a vehicle without the benefit of any information the dashboard provides. It’s
    possible to do so, but it leaves most drivers uneasy and full of questions. How
    much fuel is left? Am I going too fast or too slow? The dashboard not only provides
    vital performance information, it also provides reassurance or causes alarm—both
    important emotional states to keeping the vehicle running well in the long term.


    A scoreboard and a dashboard, while different, have similar purposes: to provide
    a practical progress indicator and accountability mechanism for the marketing
    strategy as measured by the marketing analytics process. Analytics purists will
    recognize a difference between a scoreboard (or scorecard as they are often called)
    and a dashboard. Scorecards are frequently associated with the Harvard Business
    School business strategy of the balanced scorecard approach.[¹](#A978-1-4842-0259-3_7_Chapter.html#Fn1)
    They are created via a top-down method that results in identifying Key Performance
    Indicators (KPIs) that track an organization’s success executing the business
    strategy. The process is effective when the KPIs of a scoreboard trickle down
    into the lower levels of the organization, where they are interpreted by departments
    and individuals in ways that influence their work. While the scoreboard or scorecard
    is an interface to performance information deemed strategic or critical, it isn’t
    necessarily a visual one.


    Dashboards, on the other hand, provide a visual interface for performance data
    for any area or business application, not just marketing. They are ­frequently
    linked to real-time information sources and display performance data in ­summary
    fashion in the form or graphs or “gauges” that emulate an automobile dashboard.
    The intent is to share the dashboard, for it to have ­visibility within the marketing
    department and outside to other departments and ­executives, to facilitate accountability
    and decision making. Although there are differences between scoreboards and dashboards,
    the distinctions matter little when it comes to marketing analytics. What does
    matter is having a easily accessible, visual interface for marketing’s key performance
    data. For simplicity, this ­chapter will use the term dashboard to refer to this
    interface.


    In the marketing realm, a marketing dashboard is a performance management tool
    and interface that provides an accessible, visual summary of ­marketing’s KPIs.
    Stephen Few, founder and principal of Perceptual Edge, offers this ­definition:
    “A dashboard is a visual display of the most important information needed to achieve
    one or more objectives, consolidated and arranged on a single screen so the information
    can be monitored at a glance.”[²](#A978-1-4842-0259-3_7_Chapter.html#Fn2) These
    dashboards exist in a number of formats, from something as simple as a series
    of charts printed on paper and posted to a bulletin board to a digital display
    updated in real time.


    Marketing dashboards are important because they render the large ­volume of data
    a marketing analytics process can produce into a meaningful, ­understandable and
    actionable summary. As this chapter will discuss, marketing dashboards (intentionally
    plural, as there are often more than one) evolve in terms of what they report,
    but at the same time they provide a consistent reference to users in and outside
    of the marketing organization. Figure [7-1](#A978-1-4842-0259-3_7_Chapter.html#Fig1)
    displays a screenshot of a sample marketing dashboard provided by the Lenskold
    Group.[³](#A978-1-4842-0259-3_7_Chapter.html#Fn3)


    ![A978-1-4842-0259-3_7_Fig1_HTML.jpg](Images/A978-1-4842-0259-3_7_Fig1_HTML.jpg)


    Figure 7-1.


    This marketing dashboard example provided by the Lenskold Group features gauges
    for goal tracking, tables with select data details, and trend tracking graphs
    for key metrics


    Within the marketing organization, a dashboard’s primary use is as a performance
    management tool. The very act of creating and managing a marketing dashboard requires
    a deep understanding of the source data. Creating dashboards that let marketers
    see the trends and directions of the big picture view provides otherwise difficult-to-access
    insights about marketing processes. The marketing team, therefore, uses dashboards
    to manage and improve its core processes. Sometimes, a review of the latest dashboard
    provides reassurance that all is well. Other times, the dashboard reveals a trend
    that, if addressed early, requires minor corrective actions now or major ones
    later if left unaddressed. Properly constructed and maintained dashboards help
    marketers spot problems in a timely way and then do something about them.


    Note


    Marketing dashboards, when properly constructed, help marketers identify problems
    early and do something to correct them.


    Outside of the marketing organization, a dashboard’s primary use is as a communications
    tool for informing stakeholders. A marketing dashboard is ideally a visually rich,
    easy-to-understand summary of marketing KPIs. It provides those outside of marketing
    with a window to see what marketing is doing and what kind of results it is achieving,
    which in turn provides accountability. In this capacity, marketing dashboards
    reassure the organization that marketing is performing and to what degree. For
    most in the organization outside of marketing, these dashboards are their primary
    interface to marketing.


    The development and deployment of marketing dashboards should occur later in the
    marketing analytics process, after the planning, decisions, and implementation
    described in [Chapters 5](../Text/A978-1-4842-0259-3_5_Chapter.html) and [6](../Text/A978-1-4842-0259-3_6_Chapter.html)
    occur. Only after the determination of metrics to support the marketing analytics
    process is complete can you begin planning what kind of dashboard will best inform
    stakeholders and constituents about the marketing’s performance.'
  trans: "\n# 7. 营销仪表板\n\n## 分析流程的声音\n\n想象一下观看一场专业体育赛事，但记分牌无法使用或根本不存在的情景。除非你非常关注场上发生的一切，否则很难知道谁领先。或者，正如第\
    \ 1 章开篇所述，想象驾驶一辆没有仪表盘提供任何信息的车辆。虽然也能开，但这会让大多数驾驶员感到不安并充满疑问：还剩多少油？我开得太快还是太慢？仪表盘不仅提供关键的性能信息，还能带来安心感或引发警报——这两种情绪状态对于长期保持车辆良好运行都至关重要。\n\
    \n记分牌和仪表板虽然不同，但目的一致：为营销分析流程衡量的营销策略提供实用的进度指示和问责机制。纯粹的分析师会区分记分牌（或常说的记分卡）与仪表板的不同。记分卡通常与哈佛商学院的平衡计分卡战略相关联。¹它们通过自上而下的方法创建，最终确定用于跟踪组织在执行业务战略方面成功与否的关键绩效指标（`KPIs`）。当记分牌的`KPIs`层层分解到组织的较低层级，并由各部门和个人以影响其工作的方式进行解读时，这一流程便卓有成效。虽然记分牌或记分卡是战略或关键绩效信息的界面，但它不一定是可视化的。\n\
    \n另一方面，仪表板为任何领域或业务应用（不仅仅是营销）提供了绩效数据的可视化界面。它们通常与实时数据源相连，并以图表或模仿汽车仪表盘的“量表”形式汇总展示绩效数据。其目的是共享仪表板，使其在营销部门内部以及对外部其他部门和高管可见，以促进问责和决策。尽管记分牌和仪表板存在差异，但在营销分析领域，这些区别并不重要。重要的是拥有一个易于访问、可视化的营销关键绩效数据界面。为简单起见，本章将使用术语`仪表板`来指代此界面。\n\
    \n在营销领域，营销仪表板是一种绩效管理工具和界面，提供可访问、可视化的营销`KPIs`摘要。Perceptual Edge 的创始人兼负责人 Stephen\
    \ Few 给出了这样的定义：“仪表板是一个视觉展示，它集中并排列在单个屏幕上，显示实现一个或多个目标所需的最重要信息，以便一眼就能监控这些信息。”²这些仪表板有多种形式，简单到打印在纸上并贴在公告板上的一系列图表，复杂到实时更新的数字显示屏。\n\
    \n营销仪表板之所以重要，是因为它们能将营销分析流程产生的大量数据转化为有意义、可理解且可操作的摘要。正如本章将讨论的，营销仪表板（特意使用复数，因为通常不止一个）在其报告的内容上会不断演变，但同时它们也为营销组织内外的用户提供了一致的参照。图\
    \ 7-1 显示的是由 Lenskold Group 提供的示例营销仪表板截图。³\n\n![A978-1-4842-0259-3_7_Fig1_HTML.jpg](img/A978-1-4842-0259-3_7_Fig1_HTML.jpg)\n\
    \n图 7-1. 这个由 Lenskold Group 提供的营销仪表板示例包含用于目标跟踪的量表、带有选定数据明细的表格，以及关键指标的趋势跟踪图\n\n\
    在营销组织内部，仪表板的主要用途是作为绩效管理工具。创建和管理营销仪表板这一行为本身就要求对源数据有深入理解。创建能让营销人员看到宏观趋势和方向的仪表板，可以提供有关营销流程的、否则难以获得的洞察。因此，营销团队使用仪表板来管理和改进其核心流程。有时，查看最新的仪表板能让人确信一切顺利。另一些时候，仪表板会揭示一种趋势，如果及早处理，只需采取小幅纠正措施；但如果置之不理，未来则需大动干戈。构建和维护得当的仪表板能帮助营销人员及时发现并解决问题。\n\
    \n> **注意**  \n> 构建得当的营销仪表板能帮助营销人员及早发现问题并采取纠正措施。\n\n在营销组织外部，仪表板的主要用途是作为向利益相关者通报信息的沟通工具。营销仪表板理想情况下是一份视觉丰富、易于理解的营销`KPIs`摘要。它为营销外部人员提供了一个窗口，让他们了解营销在做什么以及取得了何种成果，进而实现问责。在这种能力下，营销仪表板向组织保证营销正在发挥作用及其程度。对于组织中大多数非营销人员来说，这些仪表板是他们了解营销的主要界面。\n\
    \n营销仪表板的开发与部署应在营销分析流程的后期进行，即在第 5 章和第 6 章所述的规划、决策和实施完成之后。只有在确定了支持营销分析流程的指标之后，你才能开始规划哪种仪表板最能有效地向利益相关者和相关方通报营销绩效。\n"
- fmt: "# Why You Need a Dashboard\n\n> The greatest value of a picture is when it\
    \ forces us to notice what we never expected to see. —John Wilder Tukey, *Exploratory\
    \ Data Analysis*\n\nA dashboard, or more probably a series of dashboards, are\
    \ critical enablers of the marketing analytics process. In the same way an elevator\
    \ pitch summarizes the key value proposition of a company or product to prospective\
    \ customers, a dashboard distills the most important results of the marketing\
    \ analytics process into an easily digested visual summary. If the output of the\
    \ marketing analytics process tells a *War and Peace*–length story, a dashboard\
    \ provides the *Cliff’s Notes* version. The marketing analytics dashboard is the\
    \ executive summary of marketing’s performance report. It is the one thing you\
    \ can count on that people will view.\n\nThose who are implementing a marketing\
    \ analytics process for the first time will discover just how much data the process\
    \ is capable of producing. Those who are managing a mature marketing analytics\
    \ process are already swimming, perhaps drowning, in an ocean of marketing metrics\
    \ data. The only way to consistently make sense of it all is through an effective\
    \ visual summary of that data, otherwise known as a dashboard. Not pairing a marketing\
    \ analytics process with one or more dashboards is to rob the process of a powerful\
    \ communications tool.\n\n> **Note**  \n> The failure to use one or more dashboards\
    \ as part of the marketing analytics process robs it of a powerful communications\
    \ tool.\n\nIn the beginning, when the scope of the marketing analytics process\
    \ is small, it is possible to use raw data to manage key marketing processes and,\
    \ to a lesser extent, to inform. But dealing with raw data is tedious, and if\
    \ the marketing analytics process expands to ultimately encompass all aspects\
    \ of marketing (as it should), dealing with raw data isn’t a scalable process.\
    \ It doesn’t take a lot of data for the management of it to become cumbersome\
    \ and unwieldy without some tools. The use of one or more dashboards is a necessity\
    \ to help organize and package this data so it can fulfill its intended purpose:\
    \ create awareness about performance and enable decisions that improve marketing’s\
    \ effectiveness.\n\nThe data from the marketing analytics process mushrooms. It\
    \ doesn’t take long for a large collection of data to accumulate for just a single\
    \ metric. As new metrics are added to the marketing analytics portfolio, each\
    \ with its own data set, the total volume of data can easily grow exponentially.\
    \ This is a normal occurrence as the analytics process evolves: it doesn’t take\
    \ long for the volume of data that requires analysis, review, and attention to\
    \ soar. To meet expectations, the analytics process needs data analysis and reporting\
    \ tools, and the dashboard is the pinnacle of that reporting.\n\nThe process of\
    \ data analysis, by its very nature, encourages the analyst to delve more deeply\
    \ into the data. The onion metaphor applies here, with multiple data layers into\
    \ which the analyst can go deeper and deeper searching for greater meaning. This\
    \ “zooming in” approach to analyzing marketing analytics data is important and\
    \ necessary, yielding many insights for those with the discipline to do it. Despite\
    \ the necessity of taking such a close-up view of the data, the downside is a\
    \ loss of the big picture. The marketing analytics process must use a microscope\
    \ to look at the data very closely, but also a telescope to view the data from\
