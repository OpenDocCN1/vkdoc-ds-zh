  trans: '

    一个不可或缺的营销组织的首要特征是战略导向。这意味着有一项计划驱动着营销工作的开展。理想情况下，该计划源于公司关键利益相关者参与的**战略规划**过程。这项计划与公司目标紧密对齐，并设有里程碑和衡量指标来跟踪进展。


    相比之下，作为成本中心存在的营销组织更倾向于**运营导向**。这并不意味着他们没有计划，而是计划往往被忽视甚至放弃。这些营销组织是由需求驱动的，反应更为被动。它们类似于第
    1 章中描述的那种在分析方面“瞎飞”的营销组织。


    不可或缺的营销组织的第二个特征是，它们与自己支持的销售团队高度协同。它们共同协作，而非各自为政，并且拥有兼容甚至共享的目标。


    不可或缺的营销组织的第三个特征是，它们高度甚至完全由**分析驱动**。分析是这些营销组织运作的核心。它们依靠分析和指标来验证自身努力，并向组织的其他部分展示责任担当。


    具备这些特征的营销组织不会面临被视为“开支”的风险。此外，分析并非独立于其他特征之外。分析能力支撑了上述前两个特征。我们将审视营销分析的现状，了解这些不可或缺的营销组织有多普遍。


    ## 营销分析的现状


    营销人员始终面临着一个挑战：向所在组织证明自身的价值和相关性。尽管有时不情愿，但营销人员普遍认同，分析过程提供了证明其贡献的最有力证据。那么，整个营销界的分析现状如何呢？


    图 2-4 提供了一张图表，总结了 700 多位公司总裁、CEO、CMO、营销副总裁、营销总监、营销经理、销售经理以及产品和品牌经理对其所在公司营销分析状况的看法。针对该群体的调查³采用以下回答类别，盘点了他们分析工作的状态：


    ![A978-1-4842-0259-3_2_Fig4_HTML.jpg](img/A978-1-4842-0259-3_2_Fig4_HTML.jpg)


    图 2-4.


    大多数营销组织都在尝试利用分析做点什么，但成功程度各不相同


    -   **回避**：除非被要求使用，否则我们尽量避免分析。

    -   **探索**：我们想做点事，正在寻找最佳切入点。

    -   **试验**：我们正在试验以确定最佳分析集，但尚未影响行为或活动。

    -   **低可见度**：我们正在追踪有意义的分析指标，但这些指标在营销组织外部尚未被关注。

    -   **高可见度**：我们正在追踪有意义的分析指标，并且这些指标在整个组织内都已被关注。


    在当今的现代营销时代，仅略超过三分之一的公司报告说他们正在追踪有意义的分析指标。同一组参与者还被要求使用 1 到 5 的评分标准（1 代表“回避”，5 代表“有意义且可见的结果”）来评价其营销流程。此项分析显示，大公司（员工超过
    1000 人）报告的分析进展更大，平均得分为 3.46，而小公司（员工不超过 100 人）的平均得分为 3.17。


    公司规模与分析状态之间也存在关联：


    -   33%的小公司要么回避分析，要么在寻找最佳切入点。

    -   26%的中型公司（员工 101 至 1000 人）属于这两类。

    -   19%的大公司属于这两类。


    公司规模越大，其营销部门似乎越有可能使用分析。小公司可能因多种原因觉得推行营销分析的动力不足。通常，小公司有一种“全员出动”的心态，每个人都为了公司的成功而全力投入，这自然也包括营销。小公司内的各种职能通常相互邻近，几乎是并肩工作。在这种环境下，每个人似乎都知道其他人在做什么，因此对分析所提供的责任担当的需求并不那么迫切。


    在考察营销分析现状时，分析举措获得的资金支持力度是一个重要的指标。公司投资的方向揭示了他们的优先事项以及努力的严肃程度。尽管营销分析并不代表巨额支出，但要想让流程产生影响，确实需要一定的资金和资源。图
    2-5 总结的数据展示了营销预算中有多少被指定用于分析。⁴


    ![A978-1-4842-0259-3_2_Fig5_HTML.jpg](img/A978-1-4842-0259-3_2_Fig5_HTML.jpg)


    图 2-5.


    近四分之一的组织在其营销预算中未为分析分配任何资金


    进一步分析图 2-5 中的数据，可以深入了解分析资金与有效性之间的关系。8%的研究参与者将超过 10%的营销预算投入到营销分析上。在精英群体中，50%的人报告说他们正在追踪在整个组织内具有可见性的有意义分析指标（图
    2-4）。这一分析成熟度水平几乎是预算支出在 6%到 10%之间的组织的两倍，是预算支出低于 5%的组织的三倍。此项分析清楚地表明，更多的投资能带来更高的分析数据可见度。那么，这种可见度是否也等同于更好的结果呢？尽管可见度很重要，但结果才是关键。


    对图 2-5 中预算数据的进一步分析显示，在营销分析投资上存在一个明显的回报递减点。将营销预算的 6%到 10%用于营销分析的组织取得了最佳结果，其中 51%报告称通过分析实现了营销效果的最高改善率。对于预算支出超过
    10%的精英群体，45%报告了最高的改善率；而对于分析预算低于 5%的组织，40%属于最高改善率范围。因此，最佳投入点似乎是将营销预算的 6%到 10%分配给分析。

    '
- fmt: '# Attitude Toward Marketing Analytics


    The presence of a marketing analytics process within a company isn’t necessarily
    an indicator of a favorable attitude toward analytics. Indeed, when it comes to
    marketing analytics data that is measured and tracked, almost one-fourth of companies
    report that “no one seems to be using it.”[⁵](#A978-1-4842-0259-3_2_Chapter.html#Fn5)
    In some companies, executives send the marketing team on a forced march to analytics.
    In such a case, resistance to the analytics process is quite high. Although the
    process often gains some converts, it’s still an uphill climb against the passive-aggressive
    response marketing often exhibits to having analytics forced upon it.


    Less common is the pro-analytics marketing team that can’t get the attention of
    the rest of the company about the value the process can provide. Here, too, it
    is likely that over time, the marketing team can win over converts to the process.
    In either case, real results from the analytics process are very convincing.


    These two positions reflect the varying attitudes that can exist within an organization
    about analytics. For any initiative, the biggest barriers are often attitudinal,
    so as we review the marketing analytics landscape, it’s helpful to understand
    the prevalence of the attitudes that shape it. The Demand Metric study also gives
    insight into the range of attitudes that exist toward analytics and how widely
    they are held. Figure [2-6](#A978-1-4842-0259-3_2_Chapter.html#Fig6) summarizes
    this data about attitudes.


    ![A978-1-4842-0259-3_2_Fig6_HTML.jpg](Images/A978-1-4842-0259-3_2_Fig6_HTML.jpg)


    Figure 2-6.


    By a wide margin, the prevailing attitude toward marketing analytics is that they
    are vitally important as a management tool


    Of the five attitudes presented in Figure [2-6](#A978-1-4842-0259-3_2_Chapter.html#Fig6),
    only two represent negative attitudes, and those are held by just 8 percent of
    the survey sample. The remaining three attitudes are positive. In the following
    paragraphs, we’ll explore these attitudes in detail.


    The least prevalent attitude contends that it is impossible to define a meaningful
    set of marketing analytics. To assert with absolute certainty that it isn’t possible
    to derive a set of metrics that have meaning is simply a sophisticated declaration
    of unwillingness. Of course it is possible for any marketing organization, through
    adequate thought and planning, to identify a set of metrics that are effective
    performance indicators. Although this attitude is rare—perhaps because few CEOs
    will tolerate it—it is associated with CMOs who don’t want facts or analytics
    data to interfere with their marketing agenda. To simply dismiss analytics with
    a declaration that it isn’t possible to measure the results of marketing’s efforts
    is either complete ignorance or arrogance. Although it’s true that barriers may
    exist to accurately measuring marketing’s business impact, none of them are insurmountable.


    The second attitude from Figure [2-6](#A978-1-4842-0259-3_2_Chapter.html#Fig6)
    that is negative also isn’t very prevalent: just 5 percent of the sample in this
    study report that analytics are too easily misinterpreted by those outside of
    marketing. There are three drivers that often account for this attitude. The first
    is a legitimate fear that those who don’t understand or appreciate the analytics
    might use them inappropriately. The second is the fear that the analytics will
    reveal marketing’s poor performance. The third driver is arrogance.


    The first underlying reason of the attitude that analytics are too easily misinterpreted
    by nonmarketers is a healthy fear of the consequences. Analytics, particularly
    when first implemented, don’t always have a happy story to tell. If marketing
    is completely transparent with its analytics data, some who are outside the marketing
    group could seize the opportunity to use the data for political gain. What really
    needs to occur, however, is for marketing to have the chance to use the data to
    improve, and this may require completing several cycles of measurement and analysis.
    It’s harder for this to happen if a dysfunctional culture exists in the company.
    In such a culture, marketing may have good reason to fear complete analytics transparency.
    It is an unfortunate fact that in corporate environments, not all cultures are
    healthy. Anyone who has been in marketing long enough can probably share experiences
    of communicating analytics and performance data transparently, and then getting
    punished for it.


    A second driver of the attitude that analytics are too easily misinterpreted by
    nonmarketers is insecurity. The roots of this insecurity come from the CMO knowing
    that meaningful analytics will reveal marketing’s poor performance. Even in the
    absence of analytics data, marketers have pretty good intuition about the kind
    of impact their work is having. A survival strategy for marketing managers who
    are insecure about their team’s performance is to avoid analytics and front the
    team with a flurry of activity and communicate in platitudes about the results.
    It strikes fear in the hearts of these CMOs when the CEO suggests—or decrees—the
    use of analytics. An almost automatic response in such situations is “analytics
    are too easily misinterpreted by nonmarketers.” The goal is to portray marketing
    as some sort of dark art, a practice so arcane that only those within its fraternity
    can hope to understand the analytics. The irony here is that a proper analytics
    initiative would provide this marketing organization with improvement data, vanquishing
    the fear of being “outed.”


    A third driver is simply arrogance. When arrogance is in play, marketing is essentially
    communicating to the rest of the organization that what it does is beyond comprehension
    by outsiders. From the outsider’s perspective, there isn’t a perceptible difference
    between insecurity and arrogance as the driver of this attitude, because both
    portray marketing as beyond comprehension. In either case, however, the net effect
    is to build a smokescreen to hide marketing’s true performance, and this comes
    from a willful decision to oppose marketing analytics. The fact remains that proper
    education and communication about the meaning of the marketing analytics data
    removes the concern over misinterpretation.


    The third attitude depicted in Figure [2-6](#A978-1-4842-0259-3_2_Chapter.html#Fig6)
    acknowledges that analytics could provide marketing with some needed credibility.
    Marketing organizations that don’t use analytics data to account for their contribution
    are susceptible to having their credibility questioned. At worst, marketing’s
    very existence is threatened when its credibility within the organization it serves
    is questioned. At best, when marketing has a credibility problem, it will struggle
    to gain acceptance for the strategies and campaigns it wishes to deploy. The 20
    percent of the survey sample who chose this attitude response option acknowledge
    one of the benefits of having an analytics process: the credibility of having
    data to prove marketing is effective. With that credibility comes a great deal
    of latitude and empowerment for the CMO. [Chapter 3](../Text/A978-1-4842-0259-3_3_Chapter.html)
    explores this issue in greater detail.'
