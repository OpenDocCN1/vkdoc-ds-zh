    ## The Impact of Analytics


    > Half the money I spend on advertising is wasted; the trouble is I don’t know
    which half. —John Wanamaker, 19th-century retail pioneer


    It’s true that analytics can help marketing improve its performance. With the
    proper selection of metrics, the collection of data, the diligent analysis and
    reporting of it, and the resulting decisions, analytics are a potent performance
    enhancer. But what kind of performance, and how do the improvements come about?
    If analytics are a means to an end, and that end is better revenue performance,
    how do analytics get us from here to there?


    The end game for marketing analytics is revenue, and with revenue impact and expenses
    known, it is possible to derive ROI for marketing, a topic of further discussion
    in [Chapter 6](../Text/A978-1-4842-0259-3_6_Chapter.html). How, then, does the
    analytics process help create revenue? Understanding how marketing analytics affect
    revenue is the fundamental starting point for many analytics initiatives.


    To understand this, consider the journey that most prospects take toward becoming
    customers. There is an initial recognition of need, followed by a process of discovering
    potential solutions, consideration of those solutions, and ultimately a decision.
    Marketing 101 teaches us that prospects must be aware of solutions so they can
    consider them and ultimately make a purchase. Much of marketing’s work, therefore,
    is about creating awareness as early as possible in this buying cycle.


    Generating this awareness happens a number of ways. In the earliest days of marketing,
    there were fewer tools and channels for generating awareness. Marketing and advertising
    were synonymous, and print was the primary channel. Even then, however, there
    was a need for analytics data.


    John Wanamaker, quoted above, understood the limits that a lack of analytics data
    about advertising efforts imposed. The only thing he had to help him optimize
    his advertising was his intuition.


    Fast forward to the 21st century, when marketers have at their disposal myriad
    channels, both traditional and digital, to create awareness. There are so many
    combinations of messages, creativity, and channels that there is no hope of making
    intelligent decisions about optimizing the media mix without analytics. They are
    indispensable to the modern marketer.


    The modern marketer’s awareness efforts take the form of campaigns whose desired
    output is leads: individuals or businesses that have identified themselves as
    having some level of need or interest in a solution, and who have also surrendered
    contact information. For most companies, leads are the fuel for the sales engine.
    It’s marketing’s job to ensure that a steady flow of leads is coming in that are
    nurtured, qualified, and then passed along to the sales team. Most of the time,
    the lead generation process is ground zero for marketing analytics.


    The right combination of testing and analytics can make the difference between
    a lead generation campaign that is a flop and one that is stellar. Because marketers
    don’t have unlimited budgets for lead generation, analytics are an important tool
    for helping them understand which campaigns to expand, which ones to revise, and
    which ones to abandon. The analytics provide the information marketers need to
    optimize campaigns, which in turn generates more leads, which the sales team turns
    into more revenue.'
  trans: "\n\n在图 3-1 所示的样本中，其余 76% 的受访者分散在四个选项里，表明他们在不同程度上使用了分析数据。这些剩余的回答均非负面，尽管其中一些可能代表了更高或更先进的使用水平。在这四个选项中，有两个——**CMO**（首席营销官）和营销团队对数据的审查——属于分析过程输出的内部使用。\n\
    \n仅在营销部门内部使用和报告分析数据并非坏事。即使这些数据从未流出营销部门，有效的分析数据同样具有影响决策的能力。在图 3-1 中，近半数的营销组织将分析数据保留在内部。最常见的情况是，只有营销团队成员（38%）能够访问并使用这些数据。较少见的是，只有\
    \ CMO（10%）能查看和使用这些数据。\n\n从宏观角度来看，分析数据的主要用途之一是为决策提供信息并验证决策的有效性。即使数据仅存于部门内部，营销分析数据也丝毫不会削弱其在这方面的作用。然而，分析数据的另一个主要用途是作为一种问责机制。将分析数据报告给营销部门之外的人员，通常是高管和其他利益相关者，能够建立起健康的问责水平。当数据留在营销部门内部时，它作为问责机制的大部分效力就会丧失。较低的分析成熟度通常与将数据保留在部门内相关联。\n\
    \n> **注意**  \n> 若分析数据仅停留在营销部门内部，其作为问责机制的很大一部分效力将被削弱。\n\n最高的营销分析成熟度与那些利用分析数据对外报告绩效的组织相关联。图\
    \ 3-1 显示了代表分析数据对外报告的两类回答：向高管团队报告以及向组织内的任何人报告。其中占比较大的是那 18% 向高管团队报告数据的典型营销组织，这是最重要的问责层级。当这种情况发生时，希望产生的一个结果是\
    \ CMO 与 CEO 之间就营销工作内容及其贡献方式展开持续、健康的对话。分析数据是这类讨论的绝佳催化剂，尤其是在 CEO 期望此类问责而 CMO 也愿意主动提供时。\n\
    \n构成对外报告分析数据的两个群体中，较小的是那些实行完全透明的营销组织。它们允许组织内任何想要查看分析数据的人获取这些信息。这种关于营销工作的“无可隐瞒”态度是一种值得称赞的立场，更多组织应当追求但鲜有达到。实践这种透明度的营销团队通常与最高的分析成熟度相关联。\n\
    \n## 分析的影响力\n\n> 我花在广告上的钱有一半都浪费了；问题是我不知道是哪一半。 ——约翰·沃纳梅克，19 世纪零售业先驱\n\n诚然，分析可以帮助营销提升其绩效。通过正确选择指标、收集数据、进行细致的分析与报告，并据此做出决策，分析是一种强大的绩效增强剂。但提升的是何种绩效？这些改进又是如何实现的？如果分析是达到目的的手段，而这个目的就是更好的营收绩效，那么分析是如何帮助我们实现这一跨越的呢？\n\
    \n营销分析的最终目标是营收，一旦明确了营收影响和支出，就有可能推导出营销的投资回报率（ROI），这是第 6 章将进一步讨论的话题。那么，分析过程是如何帮助创造营收的呢？理解营销分析如何影响营收是许多分析项目的根本出发点。\n\
    \n要理解这一点，不妨考虑大多数潜在客户转变为客户的旅程。首先是需求的初步认知，然后是发现潜在解决方案的过程，接着是评估这些方案，并最终做出决定。营销 101\
    \ 告诉我们，潜在客户必须先知晓解决方案，才能考虑它们并最终完成购买。因此，营销的很大一部分工作就是在这个购买周期中尽早建立认知。\n\n建立这种认知有多种方式。在营销的早期阶段，用于建立认知的工具和渠道较少。营销与广告几乎等同，而印刷品是主要渠道。但即便在那个时代，也仍然需要分析数据。\n\
    \n上文引用过的约翰·沃纳梅克，深知缺乏广告活动分析数据所带来的限制。他唯一能用来优化广告的就是自己的直觉。\n\n快进到 21 世纪，营销人员可以支配无数传统和数字渠道来建立认知。信息、创意和渠道的组合如此之多，以至于如果没有分析，几乎无法就优化媒体组合做出明智的决策。分析对现代营销人员而言不可或缺。\n\
    \n现代营销人员建立认知的努力表现为各种营销活动，其期望产出是线索：即那些表明对某种解决方案有某种程度需求或兴趣，并已提供联系方式的个人或企业。对大多数公司而言，线索是销售引擎的燃料。营销的职责是确保持续流入的线索得到培育、筛选，然后移交给销售团队。大多数时候，线索生成过程是营销分析的原点。\n\
    \n测试与分析的恰当结合，可以使线索生成活动要么惨淡收场，要么大获成功。由于营销人员用于线索生成的预算有限，分析便成为重要工具，帮助他们判断哪些活动应该扩大、哪些需要修改、哪些应当放弃。分析提供了营销人员优化活动所需的信息，进而生成更多线索，而销售团队则将线索转化为更多营收。\n"
- fmt: '# Analytics in Marketing: A Case Study and Credibility


    A wonderful example of how analytics help marketers execute more effective awareness
    and lead generation campaigns comes from the 2008 U.S. presidential election.
    In 2007, then-candidate Barack Obama was competing for the Democratic Party nomination
    and trailing by double digits in the polls. Dan Siroker, director of analytics
    for the campaign, recognized that every visitor to the Obama website was an opportunity
    to raise awareness and campaign funds. The home page of the website featured a
    large graphic of candidate Obama, and at the bottom of the page was a call-to-action
    button. The question facing Siroker was, which combination of media and call-to-action
    buttons would produce the best results?


    Siroker set up a series of A/B tests, also called landing page split tests, to
    determine which combination of six images and four call-to-action buttons was
    most effective. The images all featured the candidate in various settings. The
    call-to-action button options were labeled “JOIN US NOW,” “LEARN MORE,” “SIGN
    UP NOW,” and “SIGN UP.” Siroker’s goal was to determine which of the 24 possible
    combinations of image and button performed the best, so he set up an experiment
    to show the various combinations to website visitors and collected the data.


    The metric he used to measure success was sign-up rate—the rate for which a test
    combination of image and call-to-action button caused visitors to provide their
    email address to the campaign. After gathering enough data, the winning combination
    was determined, and it was not the combination the staff initially favored.


    The page with the top-performing combination had a sign-up rate of 11.6 percent,
    compared to the original sign-up rate of 8.3 percent. This represents an improvement
    rate of almost 41 percent. Over the course of the campaign, that difference translated
    into almost 2.9 million more email sign-ups, with an average donation per sign-up
    of $21. The analytics-optimized web page generated an additional $60 million for
    the campaign.


    In this example, analytics made a difference on a grand scale by illuminating
    critical information about the performance of web landing pages that otherwise
    would have remained in the dark. There certainly is a cost to taking the approach
    this example describes: it requires time, effort, and a little bit of technology,
    and this investment is often a barrier to getting it done. The return on the investment,
    however, almost always exceeds the cost. The value of being well informed is almost
    always higher than the cost of remaining ignorant. As Mike Krass, CEO of MKT Media
    Group, put it, “The price of light is less than the cost of darkness.”


    Analytics will certainly help marketers improve their calls to action and campaign
    landing pages on their websites, but their impact goes beyond that. Analytics
    can make an impact in these areas as well:


    - **Brand recognition**: Understand the mindshare your brand enjoys and the sentiments
    customers have toward it.

    - **Content**: Know with certainty which of your marketing content is most widely
    consumed, shared, and produces the best conversion.

    - **Channel optimization**: Compare performance of various marketing channels,
    such as email or pay-per-click, to improve their performance or invest only those
    that perform the best.

    - **Customer understanding**: Gain a deeper understanding of customer behavior
    to better understand their needs and preferences.

    - **Predictive intelligence**: Accurately predict early in the buying cycle which
    customers will buy and when.


    The list represents just some of the areas where analytics can have a significant
    impact, and not just on the marketing function but across the entire organization.
    Analytics can only have this impact, however, if they are based on the right metrics,
    which are diligently tracked and reported and used to influence decision-making,
    and the organization views the entire process as credible. Even when the analytics
    process is rock solid, if the organization has no faith in the process, the analytics
    won’t impact the organization the way they should.


    ## Analytics Credibility


    It’s one thing to have a marketing analytics process at some level of maturity,
    and quite another to have the basic output of that process—the data—enjoy credibility.
    Decisions are made on this data, so if the hope is to have confidence in those
    decisions, the analytics process and the data it produces must be sound. The marketing
    analytics process has to have integrity and credibility so that the entire organization
    will have faith in the process and the decisions born out of that process.


    Just because a marketing analytics process collects and reports data across a
    set of metrics doesn’t mean that everyone is going to believe the numbers. Doubt
    about the accuracy and credibility of the analytics data can exist inside and
    outside the marketing organization. Sometimes doubt creeps in because the process
    is suspect, or the input data has quality issues. Other times, the beneficiaries
    of the data simply don’t want to believe what the data reveals.


    It’s not uncommon for anyone to view the data that marketing collects, maintains,
    and uses as suspect. Much of the data on which marketing relies is often stored
    in CRM and marketing automation systems. This data finds its way into these systems
    through a number of paths, and each path presents challenges with respect to maintaining
    accuracy and quality.


    Ideally, an organization will have a process or mechanism for ensuring data quality
    or cleaning the data, because the longer dirty data is allowed to reside in a
    system, the higher the probability that quality issues will compromise the analytics,
    campaigns, people, or other systems that use it. Most organizations, however,
    don’t have a formal data cleaning process, and the lack of one is at the root
    of analytics credibility issues. Figure 3-2 summarizes the state of sales and
    marketing data quality.


    ![A978-1-4842-0259-3_3_Fig2_HTML.jpg](Images/A978-1-4842-0259-3_3_Fig2_HTML.jpg)


    **Figure 3-2.** Sales and marketing data cleanliness


    As Figure 3-2 depicts, only 36 percent of organizations indicated that their sales
    and marketing data was “clean” or “very clean.” Since the analytics process is
    built on the foundation of data, the implication for the other 64 percent is that
    they are bound to see their analytics process suffer a credibility gap, particularly
    if it is known or believed that the data quality is low. Even having clean data
    is no assurance that a marketing analytics process will enjoy credibility.


    Still, having clean data is a prerequisite for an effective, credible analytics
    process. The current data quality status in a majority of organizations should
    create a sense of urgency for cleaning up this data. This urgency is only heightened
    when data volume growth is factored in, because for most companies, that volume
    grows with every sales call, campaign, webinar, or trade show, compounding the
    problem.


    Even if the data volume isn’t growing, static data doesn’t remain valid indefinitely.
    Data quality decays through contacts changing companies, email addresses, roles,
    titles, and responsibilities. Marketing analytics data certainly consists of more
    than prospect or customer contact data, but most of the metrics marketing can
    track ultimately lead back to the customer, and it is therefore linked to a customer
    contact record. When it does, organizations need linkages to accurate customer
    and prospect data. To do nothing about data quality is a default commitment to
    poor data quality. Organizations must have some level of intentionality and process
    discipline to even maintain data quality at any level or (ideally) improve it.'
