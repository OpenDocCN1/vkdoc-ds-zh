  raw: '## Lack of Freedom


    > The truth will set you free, but first it will piss you off. —Gloria Steinem


    Is marketing more art or more science? This question has fueled plenty of debate
    in and outside of marketing circles for decades, and the intensity of the debated
    hasn’t diminished. Attempts to weave analytics into the fabric of marketing have
    run headlong into this debate before, and the result was often the failure of
    the initiative. This chapter’s previously discussed barriers of lack of direction,
    support, and enthusiasm can all originate from inside or outside the marketing
    department. The barrier of lack of freedom, however, almost always comes from
    within the marketing department.


    In this context, freedom refers to creative freedom. Whenever there is discussion
    of limiting someone’s freedom, the reaction is usually swift and harsh: “over
    my dead body” or some similarly strong invective. Analytics are viewed as a set
    of shackles, constraining marketing to some cold, clinically determined path that
    some perceive as boring and uninspired. This is an irrational view, of course,
    but that doesn’t prevent some from reacting this way to the “threat” of having
    analytics forced on them.


    The goal of this book isn’t to resolve once and for all the debate over whether
    marketing is science or art, but it will take a position: marketing is both. Receive
    with skepticism anyone who says it is all one or the other. The truth is, these
    two poles of marketing, although seemingly opposite, need one another and are
    both necessary for marketing to flourish. In fact, far from opposing one another,
    the creative and analytic personalities of marketing are very complementary. Effective
    CMOs understand the need for balance between these forces and intentionally manage
    them to proper levels to drive the maximum marketing contribution.


    Note


    The science and creative elements of marketing aren’t in conflict with one another,
    but complement each other: both are necessary for marketing to flourish.


    Imagine marketing that was almost entirely a product of analytics, with creativity
    playing a minor, supporting role at best. This scenario conjures up thoughts of
    unspectacular marketing assets that produce consistent, predictable, and incremental
    results from such an effort. The metrics are in the driver’s seat determining
    what marketing does.


    On the other end of this spectrum, imagine marketing that is entirely a creative
    venture, with analytics playing the minor supporting role. Here the results are
    more hit or miss. The assets are almost always dazzling, innovative, and even
    edgy. But these assets don’t always work. Sometimes the outcome of creativity
    is a smash hit, and other times a dud. Here marketing is riding the results roller
    coaster, experiencing plenty of highs and lows. Marketing vacillates between being
    the hero and the scapegoat. Creativity is in the driver’s seat determining what
    marketing does.


    Neither of the scenarios in the previous two paragraphs represent the place marketing
    should live. Historically, marketing has lived much more on the creative side
    of the spectrum, and that is one reason the greatest resistance to analytics often
    comes from within the marketing department. If the truth be told, creativity been
    used to deflect the pressure to adopt analytics within the marketing function.
    George Torok, marketing expert and speaker, weighs in with these thoughts: “I
    believe that many marketers try to portray marketing as art when they can''t measure
    their results. Hence they give up responsibility for their marketing programs.
    They suggest that marketing is all chance. Many self-declared branding experts
    talk about the art of branding and refuse to face the science of measurement.
    Don''t be fooled by that hocus pocus.”[⁴](#A978-1-4842-0259-3_9_Chapter.html#Fn4)


    There is a balance and order to maintain between the analytical and creative personalities
    of (and in) marketing. It starts with creating the understanding that great marketing
    is the result of properly combining science and art. There’s actually a lot of
    common ground on which the adherents of marketing analytics and the creative marketing
    types can stand. The creative process in marketing has long been an adaptation
    of the scientific method, something many marketers may not realize. Their creative
    ideas represent a hypothesis. The development of those ideas into campaigns and
    assets represent experiments from which they make observations to determine if
    the hypothesis was true, or if there is a need for a different hypothesis. Marketing
    analytics can step onto this stage and contribute a significantly better understanding
    of how true these hypotheses are.


    Marketing analytics isn’t a creativity killer. If it is, then its implementation
    and management is flawed. Analytics and creativity should have a symbiotic relationship
    in the marketing organization, where the analytics point to areas in need of more
    creativity, and where creativity is measured to understand the value it provides.
    Where analytics and creativity are concerned, the whole is greater than the sum
    of the parts.


    As the barriers discussed in this chapter illustrate, weaving analytics into the
    fabric of marketing requires patience and persistence. Building the analytics
    process on the company’s values and vision provides the foundation and direction
    the initiative needs to start and succeed. Those who champion marketing analytics
    should expect some resistance in one or more of the areas discussed in this chapter.
    A patient approach that persistently emphasizes the success of analytics will
    ultimately win over the doubters.


    Footnotes [1](#A978-1-4842-0259-3_9_Chapter.html#Fn1_source)


    Leon Festinger, Henry W. Riecken, and Stanley Schachter, When Prophecy Fails:
    A Social and Psychological Study of a Modern Group that Predicted the Destruction
    of the World (Minneapolis: University of Minnesota Press, 1956), p. 3.


    [2](#A978-1-4842-0259-3_9_Chapter.html#Fn2_source)


    Chris Mooney, “The Science of Why We Don’t Believe Science,” Mother Jones, May/June
    2011\. See [http://​www.​motherjones.​com/​politics/​2011/​03/​denial-science-chris-mooney](http://www.motherjones.com/politics/2011/03/denial-science-chris-mooney).


    [3](#A978-1-4842-0259-3_9_Chapter.html#Fn3_source)


    Ibid.


    [4](#A978-1-4842-0259-3_9_Chapter.html#Fn4_source)


    George Torok, “Marketing—Art or Science?” See [http://​www.​torok.​com/​articles/​marketing/​MarketingArtorSc​ience.​html](http://www.torok.com/articles/marketing/MarketingArtorScience.html).'
  trans: "\n# 缺失自由\n\n> 真相会让你获得自由，但首先它会让你愤怒。 — 格洛丽亚·斯泰纳姆\n\n市场营销更偏向艺术还是科学？几十年来，这个问题在营销圈内外引发了无数争论，且争论的激烈程度从未减弱。此前，将分析学融入营销体系的尝试曾引发过这场争论，结果往往是相关举措的失败。本章之前讨论的缺乏方向、支持和热情的障碍，可能源于营销部门内部或外部。然而，缺失自由这一障碍几乎总是来自营销部门内部。\n\
    \n在此语境下，自由指的是创作自由。每当讨论限制某人的自由时，反应通常是迅速而激烈的：“除非我死了”或类似强烈的谴责。分析学被视为一套枷锁，将营销束缚在一条冷漠、如临床诊断般的既定路径上，有些人认为这条路枯燥乏味、缺乏创意。当然，这是一种非理性的观点，但这并不能阻止某些人如此反应，当他们面临被迫接受分析学的“威胁”时。\n\
    \n本书的目标并非一劳永逸地解决营销是科学还是艺术的争论，但它会表明一个立场：营销既是一门科学，也是一门艺术。对那些声称营销完全是其中一种的人，请保持怀疑。事实是，营销的这两个极端，虽然看似对立，但彼此需要，并且都是营销蓬勃发展的必要条件。事实上，营销的创意与分析特质非但不相互对立，反而是高度互补的。高效的首席营销官深谙平衡这两种力量之必要，并有意识地将它们管理到适当水平，以驱动最大的营销贡献。\n\
    \n> **注意**  \n> 营销的科学与创意元素并非相互冲突，而是相辅相成：两者都是营销蓬勃发展的必要条件。\n\n想象一下，如果营销几乎完全是分析学的产物，而创意最多只扮演次要的支持角色。这种场景会让人联想到那些平淡无奇的营销资产，通过这样的努力只能产生持续、可预测且增量性的结果。各种指标主导着营销的方向，决定其具体行动。\n\
    \n在这个光谱的另一端，想象一下，如果营销完全是一项创意冒险，而分析学只扮演次要的支持角色。这样的结果更具偶然性。营销资产几乎总是令人惊艳、创新，甚至前卫。但这些资产并非总能奏效。有时，创意的成果是轰动一时的成功，有时则是惨败。在这里，营销犹如坐上成果的过山车，经历无数高峰与低谷。营销在英雄与替罪羊的角色之间摇摆不定。创意主导着营销的方向，决定其具体行动。\n\
    \n前两段描述的两种情况都不应成为营销的常态。历史上，营销更多地处于更偏向创意的光谱一端，这也是为什么对分析学的最大阻力常来自营销部门内部的原因之一。说实话，创意一直被用来转移在营销职能中采用分析学的压力。营销专家兼演说家乔治·托罗克分享了以下看法：“我认为，许多营销人员在无法衡量其成果时，就试图将营销描绘成一门艺术。因此，他们放弃了对营销计划的责任。他们暗示营销完全靠运气。许多自诩为品牌专家的人谈论品牌艺术，却拒绝面对衡量科学。不要被这种花招所迷惑。”⁴\n\
    \n营销（及其内部）的分析性与创意性特质之间需要维持一种平衡与秩序。这首先要建立一种共识：卓越的营销是科学与艺术恰当结合的结果。事实上，营销分析学的支持者和创意型营销人员有相当多的共同立场。长期以来，营销中的创意过程一直是科学方法的一种变体运用，这一点可能许多营销人员并未意识到。他们的创意点子代表了一种假设。将这些点子发展成营销活动和资产的过程，则代表了实验，通过实验观察来判断假设是否成立，或者是否需要提出不同的假设。营销分析学可以登上这个舞台，通过显著加深对这些假设真实程度的理解来做出贡献。\n\
    \n营销分析学不是创意的杀手。如果是，那么它的实施和管理就存在缺陷。在营销组织中，分析学与创意应建立共生关系：分析学指引出需要更多创意的领域，而创意的价值则通过衡量来理解。就分析学和创意而言，整体大于部分之和。\n\
    \n正如本章所讨论的障碍所示，将分析学融入营销体系需要耐心和坚持。将分析流程建立在公司的价值观和愿景之上，为相关举措的启动和成功提供了基础和方向。那些倡导营销分析的人，应预料到会在本章讨论的一个或多个领域遇到阻力。一种耐心且持续强调分析成功的做法，终将赢得怀疑者的支持。\n\
    \n## 脚注\n\n1 利昂·费斯廷格，亨利·W·里肯，斯坦利·沙赫特，《当预言落空：一个预测世界毁灭的现代群体的社会与心理学研究》（明尼阿波利斯：明尼苏达大学出版社，1956\
    \ 年），第 3 页。\n\n2 克里斯·穆尼，“我们为何不相信科学的科学”，《琼斯母亲》杂志，2011 年 5/6 月刊。参见 [`www.motherjones.com/politics/2011/03/denial-science-chris-mooney`](http://www.motherjones.com/politics/2011/03/denial-science-chris-mooney)。\n\
    \n3 同上。\n\n4 乔治·托罗克，“营销——艺术还是科学？”参见 [`www.torok.com/articles/marketing/MarketingArtorScience.html`](http://www.torok.com/articles/marketing/MarketingArtorScience.html)。\n"
- fmt: '# 10. The Marketing Analytics Frontier


    Big Data, Predictive Analytics, and Advanced Attribution


    Marketing analytics is not a static discipline that, once implemented, never changes.
    The reasons for doing marketing analytics don''t change much, nor do the core
    principles that drive analytics work. However, the approaches, techniques, and
    technologies involved in the practice of analytics are constantly changing. There
    is a marketing analytics frontier, and those who venture there are discovering
    game-changing insights that yield significant competitive advantages. This chapter
    explores some of the trails that the marketing analytics pioneers are currently
    blazing.


    Change in the marketing analytics discipline is actually occurring at a dizzying
    pace. In general, this change has come in the form of innovations that are providing
    business and customer insights never imagined possible just a few years ago. The
    most cutting-edge marketing analytics practices are delivering more precise information
    at a greater level of detail than ever before, and this information is reaching
    marketers almost in real time. With this information, marketers are able to understand
    their customers at the deepest possible level, accurately predicting events like
    purchases and defections. Marketers are able to optimize their channel and media
    mix based on data, not intuition. The frontier of marketing analytics promises
    to transform marketing into an undisputed revenue center, not just a producer
    of campaigns and enabler of sales.


    While there are many changes taking place on the marketing analytics frontier,
    this chapter focuses on three for which marketers can''t afford to claim ignorance:
    big data, predictive analytics, and advanced attribution. The rest of this chapter
    presents an overview of what these things are and why marketers should care about
    them.


    > **Note:** The marketing analytics frontier is transforming marketing into an
    undisputed revenue center, not just a producer of campaigns and enabler of sales.


    ## Big Data


    > Without big data, you are blind and deaf in the middle of a freeway. —Geoffrey
    Moore


    Understanding customers and what motivates their behavior has been a quest of
    merchants since commerce began. Marketing owns this mission, and marketers have
    traditionally studied their customers through a handful of research techniques,
    such as past transaction analysis, observation, surveys, and focus groups. Many
    organizations maintain some sort of master customer information file, often part
    of a larger data warehouse, that marketers can reference to study customers. This
    data, however, contains a finite set of information that exists in varying states
    of currency and accuracy. Although useful, this data gives marketers a limited
    understanding of customer behavior. For many, this state of customer data is their
    current reality: old and incomplete.


    The modern consumer drops plenty of digital breadcrumbs, and if the marketer can
    follow them, these would reveal previously hidden patterns, preferences, and signals
    about their intent. Consider what is typical behavior for a consumer on any given
    day: they communicate via mobile phone, review and post to social media, check
    email, browse the Internet, make purchases, download music, and read reviews of
    products and merchants. Consumers who do these things create an enormous data
    trail that marketers can leverage, and exploiting this data is at the intersection
    of marketing and big data.


    Big data is conceptually easy to understand. It simply is a set of data so large
    and varied that it defies processing and analysis through the use of standard
    database query tools. There is no specific size designation after which a set
    of data becomes "big." In this case, "big" refers more to the complexity of analyzing
    it, rather than the size. Although it is also "big" in terms of size, as the sheer
    volume is often very large. What makes it large and complex is that it comes from
    several sources, and it usually isn''t a single, discrete set of data. It''s better
    understood as a collection of related data from many sources.


    Historically, marketers have worked with data that is structured, and therefore
    easy to access and analyze, using tools as simple as a spreadsheet. In fact, a
    good way to think about structured data is as any form that will fit into the
    rows and columns of a spreadsheet. Sales transaction data is a good example of
    structured data. Almost all of the data that marketers have traditionally worked
    with in the analytics process is structured. Structured data certainly belongs
    in this discussion of big data, as it is one of the two broad classes of data
    that fit under the big data umbrella.


    The other class of data, and the one that presents the most challenges, is unstructured
    data. Some examples of unstructured data include digital images, online videos,
    blog post comments, online product reviews, chat logs, webinars, location, sensor
    and GPS data, to name a few. A vast quantity of this type of data exists, and
    it is growing at an astonishing rate. Unstructured data contains information marketers
    can use to better understand customers and their sentiments, particularly if they
    can match this data to preexisting, structured customer data.


    How can marketers access and use this data to their advantage? This application
    dilemma is the challenge and opportunity, because the hype and promise of big
    data is not about the data itself. The data is of little value without tools and
    applications for exploiting it. Big data essentially represents a large reservoir
    of potential energy. Transforming that potential into kinetic energy, to unlock
    the value it contains, requires analytics.


    > **Note:** The promise of big data is not about the data itself, but about the
    detailed insights it contains, made accessible through analytics.'
