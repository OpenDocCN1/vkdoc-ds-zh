- fmt: 'Table [5-3](#A978-1-4842-0259-3_5_Chapter.html#Tab3) provides a template for
    doing an assessment of the data your marketing analytics process requires. To
    use it, list each metric in the leftmost column, and under the appropriate data
    columns, briefly describe the source of the data. If the data does not exist (rightmost
    column), describe any options for obtaining it. When complete, develop a plan
    to address the metrics for which data does not currently exist. If the degree
    of difficulty of obtaining the data is too high or it’s too costly to obtain,
    you may need to reconsider how practical the associated metric is.


    **Table 5-3.** Marketing Analytics Data Inventory/Assessment


    | Metric | Data Exists | Data Derivable | Data Nonexistent |

    | --- | --- | --- | --- |

    | Example: email opens | Marketing automation | | |

    | Example: conversion rate | | CRM, marketing automation | |

    | Example: Net Promoter Score | | | Develop NPS survey process |

    | Metric 1 | | | |

    | Metric N | | | |


    The final area of assessment is the budget. Are funds allocated to support the
    startup of a marketing analytics process and for sustaining it once it is in place?
    Resources are required to reach success with marketing analytics. The importance
    of completing the assessment suggested here is to understand the level of investment
    the process will need to work as it should. Once the funding requirement is understood,
    make sure the organization is willing to commit to it before proceeding.


    When planning the marketing analytics budget, some of the places to invest may
    include some or all of the following:


    - **Staffing**: additional headcount to properly own and administer the marketing
    analytics process. It’s likely that additional staff are needed for the first
    two skill areas discussed previously: analytical and technical abilities.

    - **Systems**: the necessary systems for collecting, tracking, analyzing, and
    reporting on data needed as input to the marketing analytics process.

    - **Training & education**: even if the staff is available, the skills may not
    be. Training and education are often needed to equip the team that will manage
    the marketing analytics process, and to provide some level of continuing education.

    - **Outside consulting, services or expertise**: the fastest path to effectiveness
    in marketing analytics may go through outside expertise. Consulting and services
    can often help accelerate the implementation and success of the process.


    Marketing analytics isn’t an expensive endeavor, but it requires some funding
    if it is to have impact. Figure [2-5](../Text/A978-1-4842-0259-3_2_Chapter.html#Fig5)
    summarized data collected from more than 700 executives and marketing professionals
    about the percent of their budget allocated to analytics. As that graph and the
    related discussion in [Chapter 2](../Text/A978-1-4842-0259-3_2_Chapter.html) reveals,
    the return on marketing analytics is proportional to the investment made. Those
    organizations allocating the greatest portion of their marketing budget to analytics
    are claiming the get the most from their efforts.


    What is the right level of investment in marketing analytics? As [Chapter 2](../Text/A978-1-4842-0259-3_2_Chapter.html)
    discussed, that level appears between 6 and 10 percent of the marketing budget.
    This level is a guideline. Common sense should prevail when it comes to funding
    marketing analytics, making sure that the funding is adequate to enable the success
    of the process.


    ## Reviewing Objectives


    > Objectives are not fate; they are direction. They are not commands; they are
    commitments. They do not determine the future; they are means to mobilize the
    resources and energies of the business for the making of the future. —Peter Drucker,
    Management


    Marketing’s work should support corporate objectives. When developed the right
    way, marketing’s strategy and objectives are built from a deep understanding of
    corporate goals and objectives. Marketing’s purpose, is after all, to help the
    organization succeed in pursuit of those objectives.


    Marketing analytics should directly reflect the organization’s marketing strategy,
    and less directly the corporate objectives on which that strategy is based. For
    this reason, an important part of getting started with marketing analytics is
    to determine, refine, or clarify both sets of objectives: marketing’s and the
    corporation’s. These objective must remain in clear focus as the marketing team
    is putting together its own strategy and the analytics that measure how well it
    is working. A clearly discernible thread of continuity should run from the marketing
    analytics process through the marketing strategy to the corporate goals and objectives.


    Marketing analytics implementation planning should begin with a review of corporate
    goals or objectives, which are typically stated at a fairly high level. Corporate
    objectives represent what the organization wishes to accomplish. The marketing
    strategy is an expression of how to meet those objectives, and analytics are then
    the success indicators.


    For example, a common business or corporate objective is to improve profitability.
    All departments within the company should determine what strategy they should
    execute in pursuit of this and all other corporate objectives. Marketing may determine
    that it will pursue two strategies to improve profitability: increase market penetration
    of current solutions in established markets and improve customer retention. Marketing
    will then plan its work around these two elements of strategy, each of them cascading
    into multiple tactics or projects.


    Of course, each initiative should have some metrics associated with it. When the
    marketing initiatives and metrics are developed from the top down as described
    here, the organization has some level of assurance that there is alignment between
    the top-level corporate objectives and the things marketing is doing. Having alignment
    or continuity between corporate objectives and marketing’s work is imperative.
    One way to ensure it exists is to start the strategy planning process by using
    the corporate objectives as input and keeping those objectives in mind throughout.


    Although starting the marketing planning and analytics process with corporate
    objectives doesn’t guarantee success, it does ensure you’re oriented properly.
    This approach, as Stephen Covey describes it, “begins with the end in mind.” The
    chances that the ensuing strategy and metrics are the right ones are much higher.


    This planning process of deriving the marketing strategy from corporate objectives
    is not difficult to understand, and not too difficult to complete assuming that
    a clearly articulated set of corporate objectives exists. What if there are no
    stated corporate goals and objectives? Is marketing just to develop its strategy
    and related analytics in a vacuum? What is marketing to do in this situation?


    It’s a reality that not every organization’s leadership understands the value
    of intentionally developing and then communicating the top-level objectives to
    the employees. It’s not that such objectives don’t exist—they often do inside
    the head of the leader—it’s that they’ve never been communicated well (or at all).
    The reasons for this lack of communication vary: failure to see the need, lack
    of leadership or communication skills, or just the assumption that they’re obvious
    to everyone and therefore don’t need communicating. Whatever the reason, in this
    situation marketing must do its best to discern the corporate objectives before
    setting a strategy in place. The solution is often as simple as sitting down with
    the CEO for a discussion of objectives.


    The thing to keep in mind as you start a marketing analytics process: always make
    sure that the analytics track and measure the execution of the marketing strategy,
    and that the marketing strategy is based on corporate goals and objectives.'
