  raw: '# 6. Return on Investment


    The Ultimate Metric?


    For many marketers, proving the return on investment (ROI) for marketing has long
    been a thorn in their flesh. Those outside of the marketing ­department are uniformly
    in favor of having marketing report its ROI. They want the same level of ROI accountability
    for marketing as for every other department. Those within the department tend
    to have mixed opinions. Some ­marketers embrace ROI calculation and reporting
    as the best means of ­validating ­marketing’s work. They recognize that having
    the ability to accurately report on marketing’s ROI creates acceptance, and if
    the return meets or exceeds expectations, it makes justifying budget and resources
    much simpler. ROI has the potential to depoliticize marketing funding and operations.


    Others within the marketing team fear the expectation to measure their ROI because
    it could reveal low performance and expose them to repercussions. Others simply
    think that focusing on ROI compromises marketing’s true ­mission. Whatever the
    stance, marketing has been slow to embrace ROI as a metric, and as cartoonist
    Brady Bonus illustrates in Figure [6-1](#A978-1-4842-0259-3_6_Chapter.html#Fig1),
    it’s still the exception for ROI to be part of the marketing conversation.


    ![A978-1-4842-0259-3_6_Fig1_HTML.jpg](Images/A978-1-4842-0259-3_6_Fig1_HTML.jpg)


    Figure 6-1.


    For most marketing organizations, understanding its ROI remains elusive


    Of the challenges marketers face, proving ROI is the top challenge, ranked well
    ahead of securing budget.[¹](#A978-1-4842-0259-3_6_Chapter.html#Fn1) Regardless
    of whether marketers love or hate being subjected to ROI scrutiny, many members
    of the C-suite expect to see these numbers, so marketing should understand what
    it is and how to report it.


    One problem with marketing ROI is that many marketers simply don’t understand
    what it is, as this Quora post[²](#A978-1-4842-0259-3_6_Chapter.html#Fn2) illustrates:


    *   Question: “What is considered a good ROI for a digital marketing campaign
    for a consultancy company?”

    *   Answer: “If you can generate sales leads for under $50 you''re probably going
    pretty well. Especially since your contracts are probably in the thousands. A
    response rate of 20 percent for ‘soft conversions’ like ebook downloads would
    be considered good as well.”


    The response to this post, though helpful, never gets around to stating anything
    about ROI, although it provides some data that might help in its determination.


    ROI is a profitability ratio that measures the profit returned from each ­investment,
    with its results expressed as a percentage. Businesses use ROI as a success measure
    for various investments and projects. It is used to evaluate past successes as
    well as forecast future ones. The formula for calculating ROI is fairly simple:


    ![$$ \mathrm{Return}\kern0.5em \mathrm{on}\kern0.5em \mathrm{Investment}\kern0.5em
    =\kern0.5em \frac{\mathrm{Gain}\kern0.5em \mathrm{on}\kern0.5em \mathrm{investment}\kern0.5em
    \hbox{--} \kern0.5em \mathrm{Cost}\kern0.5em \mathrm{of}\kern0.5em \mathrm{investment}}{\mathrm{Cost}\kern0.5em
    \mathrm{of}\kern0.5em \mathrm{investment}} $$](Images/A978-1-4842-0259-3_6_Chapter_TeX2GIF_Equa.gif)


    In the calculation, the cost component is not hard to come by. The “gain” element
    of this equation is difficult to measure with a degree of precision that creates
    confidence in the result.


    To illustrate, consider the example of attending a trade show, a marketing activity
    that often requires justification and reporting of subsequent ROI. The assumption
    in this example is that revenue from sales will ultimately result that is attributable
    to participation in the show. The ROI calculation seems quite simple, accounting
    for the hard costs and revenue, as Table [6-1](#A978-1-4842-0259-3_6_Chapter.html#Tab1)
    delineates.


    Table 6-1.


    Example of Determining Trade Show ROI


    | Description | Cost | Gain |

    | --- | --- | --- |

    | Exhibit/sponsorship fees | $15,000 | — |

    | Transportation fees | $1,500 | — |

    | Travel expenses | $2,500 | — |

    | Promotional item expense | $1,000 | — |

    | Literature & misc. expense | $1,000 | — |

    | Total costs | $21,000 | — |

    | Sales from show leads | — | $45,000 |

    | Total return |   | $24,000 |

    | ROI |   | 114% |


    The example in Table [6-1](#A978-1-4842-0259-3_6_Chapter.html#Tab1) makes determining
    ROI for participation in a trade show seem simple, and in fact, with the 114 percent
    ROI shown here, the return on this investment is fantastic. What this scenario
    doesn’t account for, however, are the soft benefits that are very real but difficult
    to account for. There is increased brand awareness that occurs, an enhanced reputation
    as an industry thought leader, competitive intelligence gathered, and new product
    ideas that came from face-to-face interaction with trade show attendees. None
    of these benefits are accounted for in the ROI calculation shown in Table [6-1](#A978-1-4842-0259-3_6_Chapter.html#Tab1),
    and their ultimate value could far exceed the $45,000 in sales in this example.
    Perhaps accounting for these soft benefits is not important when the hard costs
    and benefits deliver a 114 percent ROI, but when the business case is break-even
    or shows a loss, then quantifying the soft benefits becomes critical, yet it’s
    hard to do.


    Despite these challenges, measuring the ROI of marketing is politically smart.
    Marketers cannot adopt an elitist attitude that puts them above the accountability
    of ROI measurement just because they feel they are a mysterious force for good
    that defies measurement. No other department in an organization gets a pass on
    meeting ROI expectations. Why should the marketing department be the exception?


    The reality is this: measuring marketing’s ROI with a high degree of certainty
    is a serious challenge in most organizations, and some marketers feel it is impossible.
    What is helping make it possible are the improved systems, technologies, and the
    ease of using them to capture the data essential to determining ROI. However,
    there isn’t a system that can capture all that marketing does to create value.
    Even if the data were available to precisely calculate the ROI of marketing, some
    in the industry feel it isn’t always appropriate, and others feel it is just plain
    wrong.


    How do you translate a better customer experience into ROI? The systems that marketers
    use are getting better, as is their discipline at using them, but you still can’t
    translate everything that marketing does into an ROI measurement. As an illustration
    of this difficulty, Scott Monty, executive vice president of strategy at SHIFT
    Communications once said, “What’s the ROI of putting your pants on in the morning?”[³](#A978-1-4842-0259-3_6_Chapter.html#Fn3)
    It’s difficult to know the answer with certainty, but easy to imagine the negative
    consequences of failing to do so. So it is with marketing: it must do some of
    the things it does because it just makes sense to do them—the metaphorical putting
    on pants in the morning—and it will therefore make no sense to capture the ROI
    of everything marketing does.'
