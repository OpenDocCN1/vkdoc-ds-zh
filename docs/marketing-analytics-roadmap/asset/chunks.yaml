  raw: 'Once back in your office, you gather your team and discuss the challenge.
    Typically, your lead nurturing efforts consist of emails linked to landing pages
    that offer some sort of premium content, such as a white paper or case study.
    Your team has developed a reputation for developing compelling content that is
    also visually appealing. The Achilles heel, however, has been getting prospects
    to the landing pages to get this content, which is “gated” or kept behind a form
    requiring the visitor to surrender their contact information.


    With your team, you review the results of several previous email campaigns. For
    each campaign, you have analytics data that includes open rates, bounce rates,
    click-through rates and even which recipients opened a message. As you review
    this data, you confirm what you thought was correct: your open rates have historically
    been strong. This is a benefit of efforts you make to ensure the quality of the
    data in your CRM and marketing automation systems. What the analytics also show,
    however, is that the click-rates are lower than industry averages, and they are
    declining. In other words, the response to your promotional email has been strong,
    but not enough recipients are clicking on the links in the email to the landing
    pages you’ve created. This is troubling, but at least the analytics are telling
    you where the problem is.


    The next thing you and the team review is the web analytics data for the landing
    pages. Here you discover another problem. Too few of the email recipients that
    are taking the time to click through to the landing pages are choosing the call-to-action
    button, usually something like “Download Case Study” or “Sign Up Now” and similar
    calls to action. This data confirms what your instincts have suggested for a few
    months: you’re experiencing eroding performance of the tried-and-true nurturing
    methods that have served you well. Until now, you’ve never had a projected revenue
    shortfall to create a sense of urgency about monitoring these analytics more closely.


    As you and the team ponder the implications of what the analytics are telling
    you, there is discussion about how to nurture these 285 leads differently, in
    a way that hopefully produces a conversion rate in excess of 30 percent. If you
    all can put together a campaign that produces a 35 percent conversion rate, you’ll
    get the 100 sales needed to generate the half million in revenue. The arithmetic
    is straightforward. The big questions is, what approach will do this?


    A member of your team has recently been experimenting with interactive video,
    conducting some A/B testing on various landing page configurations. Interactive
    video is marketing video content that features calls-to-action links built right
    into the video itself. The videos are usually less than two minutes in duration,
    and when it ends, the viewer is presented with one or more call-to-action buttons.
    In a departure from how you typically use landing pages, the team tested interactive
    video that was not “gated”—in other words, visitors to the landing page did not
    have to first put in their contact information. Instead, at the end of the video,
    one of the calls to action allowed the viewer to request further information and
    contact from a sales representative.


    Offering ungated content is a departure from the method your team has used in
    the past. Web forms have always been part of your campaign landing pages because
    they allow you to capture leads for the sales team. However, this case is different.
    You’re not trying to capture leads but accelerate the buying cycle for leads you
    already have. The analytics from the interactive video testing look very promising:
    visitors clearly seem to prefer video and they are opting to click the “Contact
    Me” button at the end of the video at twice the rate that you’ve experience for
    other forms of content. You make the decision to build a campaign using interactive
    video.


    The next big campaign decision is to determine what the video will feature. Video
    marketing best practices indicate that videos of 90 seconds or shorter are the
    most successful. Again, you and your team review analytics data to determine what
    type of marketing messages might work best for qualified prospects who are later
    in the buying stage. Analyzing past campaigns, you’ve seen the strongest conversion
    rates for content that features a case study, a real-world story of a customer
    that implemented your solution with a description of the benefits they received.
    Based on the available data, you put the team to work producing a 90-second interactive
    case study video.


    The team works quickly, and the video is ready to deploy in short order. Using
    your marketing automation system, you prepare the campaign landing page and the
    email that will go out to the 285 prospects you’ve identified. Using the analytics
    data in your marketing automation system, you identify the ideal day of the week
    and time to send the email.


    Because you have created a data-driven culture in the marketing team, they are
    always thinking about how to measure everything they do. This campaign video was
    created with the ability to track viewing duration and shares. Furthermore, your
    marketing automation system is fully integrated with the CRM system, so when a
    qualified prospect views the video, that activity is logged in both systems. In
    addition, when a prospect views the entire video, an email alert is sent to a
    member of the sales team. Your campaign will track and report these metrics in
    real time, allowing the sales team to respond quickly when a prospect’s behavior
    indicates interest.


    You launch the campaign. The first few days after the initial email send will
    tell you if your strategy is working, or if you need to develop a Plan B. The
    tracking data on the email open rate shows that it is within the normal range,
    as you expected. What’s most encouraging, however, is that the click-through rate
    to the campaign landing page is slightly above average. Even better, the landing
    page call to action to view the case study video is performing much better than
    previous landing page invitations to consume gated content. So far, the strategy
    is working beautifully, but the ultimate campaign metric—revenue—is still unknown.


    It’s time to check in with the VP of sales. You stop by for a quick update and
    find the sales bullpen is buzzing! The VP has little time to chat, but for the
    best of reasons. The interactive video is generating a flurry of inquiries to
    the sales team through the calls to action options embedded at the end of the
    video. The case study video is clearly resonating. The VP shares that a number
    of prospects have resumed a sales dialogue with words to the effect of “we’re
    having the same problem as the customer in the video—help us solve it.” The sales
    team is booking demonstrations and having quality interactions with many of the
    prospects targeted in the campaign.


    Within a matter of weeks, the quarterly revenue forecast is revised upward. The
    VP of sales reports that an additional 105 deals are forecast to close by the
    end of the quarter, erasing the projected revenue shortfall. You and the marketing
    team debrief about the campaign, reviewing all the metrics to determine how to
    improve tactics the next time. One thing everyone agrees on: when you approach
    the CFO for additional funds to invest more heavily in video marketing, you won’t
    have any difficulty getting approval given the results of this campaign.


    As the preceding scenario illustrates, analytics influence the decision making
    that takes place within a modern marketing organization in many ways, both large
    and small. This scenario represents just one way analytics help drive confident
    decisions whose results you can link directly to revenue.


