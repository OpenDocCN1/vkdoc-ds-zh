- fmt: "# 9. Becoming Data Driven\n\nWeaving Analytics into the Fabric of Marketing\n\
    \nHaving knowledge of something that needs to occur does not ensure it will get\
    \ done. Just understanding the need for and value of doing a certain thing is\
    \ not enough to guarantee it will happen. For example, most people understand\
    \ that dietary changes and exercise are the keys to a healthier lifestyle and\
    \ better fitness. In fact, they can have in-depth knowledge of exactly what changes\
    \ are required over what period of time to produce those changes. But actually\
    \ making those changes is another matter entirely. It takes will and discipline\
    \ to sustain an effort that achieves results; regular encouragement is also helpful,\
    \ because it is hard to change deeply engrained habits and thinking.\n\nAdopting\
    \ and committing to a marketing analytics process has many parallels to a pursuing\
    \ a healthy lifestyle. It is possible to gain the knowledge, proficiency, and\
    \ skills to succeed with marketing analytics and still fail. Understanding the\
    \ precepts, accepting the wisdom, internalizing the recommendations, and believing\
    \ the advice presented in this book or from other sources on marketing analytics\
    \ is necessary for success. However, these things are not enough to realize the\
    \ hoped-for change from making the effort to become a data-driven marketing organization\
    \ through the use of analytics. The gains and improvement that are possible through\
    \ marketing analytics are the result of embedding its processes deep into the\
    \ culture of marketing and the rest of the organization. In other words, the analytics\
    \ process can’t just be a patch sewn onto the marketing cloth to hide a flaw—it\
    \ must be a series of threads woven directly throughout the fabric so analytics\
    \ become integral, even indistinguishable, from what marketing does.\n\n> **Note**\
    \  \n> Marketing analytics has its full impact only when it is completely integrated\
    \ into the operations and culture of marketing.\n\nThe pursuit of success with\
    \ marketing analytics isn’t just a matter of adding the analytics process to what\
    \ marketing is already doing. Success requires changing the culture, and the resistance\
    \ to cultural change is often the most difficult obstacle to overcome. Full cultural\
    \ acceptance occurs when there is an organizational determination to pursue and\
    \ succeed with marketing analytics. It’s characterized by a long-term perspective,\
    \ the will to continue even when the results aren’t good or the process challenges\
    \ are difficult, and a resolve to follow the process wherever it leads. Conceptually,\
    \ it is quite simple to understand that these factors are critical to success\
    \ with marketing analytics, but that doesn’t make it easy to build and sustain\
    \ a successful process. A number of challenges stand in the way of spinning up\
    \ a marketing analytics initiative and maintaining its momentum.\n\nTo increase\
    \ the chances of success with marketing analytics, organizations cannot be naive\
    \ about the challenges that come with venturing into this territory. This chapter\
    \ discusses some of these challenges with the goal of creating awareness, so that\
    \ with awareness comes the ability to avoid or at least better manage these challenges.\
    \ In truth, these challenges are not fully avoidable. Any organization that attempts\
    \ to take a serious approach to marketing analytics is going to encounter challenges\
    \ at some level. Knowing what they are in advance minimizes the discouragement\
    \ that can cause marketers to abandon their efforts. The foreknowledge also helps\
    \ marketers prepare to deal with them; it’s far easier to avoid risks and dangers\
    \ when you know of them in advance.\n\nChallenges that marketing teams are likely\
    \ to face when attempting to instill analytics into the marketing psyche include\
    \ lack of clear direction, lack of support, lack of enthusiasm, and lack of freedom.\
    \ These challenges are on top of the skills, tools, or data challenges discussed\
    \ in previous chapters. These are broad areas of challenge, any one of which has\
    \ more than enough potential to sink an analytics initiative. The rest of this\
    \ chapter is concerned with exploring these areas of challenge in greater detail\
    \ and suggesting strategies for mitigating them.\n\n## Lack of Direction\n\n>\
    \ If you don’t know where you are going, you might wind up someplace else. —Yogi\
    \ Berra\n\nMarketing analytics, a business process that provides tremendous direction\
    \ for the marketing team, can itself suffer from a lack of direction. This lack\
    \ of direction is the result of failure to articulate the vision for embracing\
    \ analytics within the marketing function. Too often, leaders simply assume that\
    \ the vision for doing something is clear to everyone, when in fact it is not.\
    \ Other times, leaders fail to understand how important clarity and unity of vision\
    \ is to helping any initiative succeed. The higher the stakes of an initiative,\
    \ the more important it is to ensure that everyone buys in to the vision for doing\
    \ it. This is the first thing that must happen on the journey to success with\
    \ marketing analytics.\n\nWhen pursuing success with marketing analytics, having\
    \ a vision for doing it is the first important ingredient in the recipe. But defining,\
    \ clarifying, and communicating the vision is often sacrificed for the sake of\
    \ expediency. Failing to spend adequate time to sort out the vision is a fatal\
    \ oversight. In the metaphorical journey that marketing embarks on when adopting\
    \ analytics, the vision is the destination. Whatever marketing hopes to achieve\
    \ through analytics is the substance of the vision. The absence of a compelling\
    \ vision for marketing analytics puts marketing at risk of winding up someplace\
    \ other than where it intended, to paraphrase Yogi Berra.\n\nIt is the job of\
    \ the CMO to cast the vision for anything marketing does, and this certainly includes\
    \ analytics. It is entirely possible for a marketing team to throw itself headlong\
    \ into an analytics initiative without a vision to drive the effort. Marketing\
    \ analytics is, after all, a great idea. It’s very easy for everyone to agree\
    \ that it is something “we should be doing.” However, what is the purpose of the\
    \ effort? What goals does the team have in view for the analytics process? How\
    \ will the team allocate resources and use the data the process produces? How\
    \ will the team even know what kind of data to collect and analyze with the process?\n\
    \nAs this book has discussed, analytics is not some extracurricular activity the\
    \ marketing team pursues when it has time or feels like it. Analytics becomes\
    \ the hub of how marketing thinks, plans, and operates. But without a vision,\
    \ what happens when there are obstacles? What motivates the team to keep up the\
    \ effort when the work becomes difficult? In the absence of a vision, the answer\
    \ to these questions is “nothing.” A marketing analytics process that isn’t driven\
    \ by a compelling vision is a short-lived enterprise. The moment it is no longer\
    \ convenient or easy to stick with the analytics process, it is abandoned. There\
    \ will surely be moments where analytics are no longer convenient or easy.\n\n\
    What’s the right vision for marketing analytics? It’s increasingly common to see\
    \ marketers turn to analytics to help transform marketing into a true revenue-generating\
    \ function. Other marketing teams wish to minimize or eliminate the effect of\
    \ internal politics on how marketing operates and its budget. These examples are\
    \ just two of many that can give the initiative some direction. Each CMO must\
    \ determine the right vision for propelling the marketing analytics function.\
    \ They must regularly communicate it with clarity so that everyone on the marketing\
    \ team, as well as the external stakeholders, knows where analytics are taking\
    \ the team.\n\n> **Note**  \n> CMOs must determine the right vision to drive the\
    \ marketing analytics effort and regularly communicate it with clarity to everyone\
    \ on the marketing team."
  raw: '# 9. Becoming Data Driven


    Weaving Analytics into the Fabric of Marketing


    Having knowledge of something that needs to occur does not ensure it will get
    done. Just understanding the need for and value of doing a certain thing is not
    enough to guarantee it will happen. For example, most people understand that dietary
    changes and exercise are the keys to a healthier lifestyle and better fitness.
    In fact, they can have in-depth knowledge of exactly what changes are required
    over what period of time to produce those changes. But actually making those changes
    is another matter entirely. It takes will and discipline to sustain an effort
    that achieves results; regular encouragement is also helpful, because it is hard
    to change deeply engrained habits and thinking.


    Adopting and committing to a marketing analytics process has many parallels to
    a pursuing a healthy lifestyle. It is possible to gain the knowledge, proficiency,
    and skills to succeed with marketing analytics and still fail. Understanding the
    precepts, accepting the wisdom, internalizing the recommendations, and believing
    the advice presented in this book or from other sources on marketing analytics
    is necessary for success. However, these things are not enough to realize the
    hoped-for change from making the effort to become a data-driven marketing organization
    through the use of analytics. The gains and improvement that are possible through
    marketing analytics are the result of embedding its processes deep into the culture
    of marketing and the rest of the organization. In other words, the analytics process
    can’t just be a patch sewn onto the marketing cloth to hide a flaw—it must be
    a series of threads woven directly throughout the fabric so analytics become integral,
    even indistinguishable, from what marketing does.


    Note


    Marketing analytics has its full impact only when it is completely integrated
    into the operations and culture of marketing.


    The pursuit of success with marketing analytics isn’t just a matter of adding
    the analytics process to what marketing is already doing. Success requires changing
    the culture, and the resistance to cultural change is often the most difficult
    obstacle to overcome. Full cultural acceptance occurs when there is an organizational
    determination to pursue and succeed with marketing analytics. It’s characterized
    by a long-term perspective, the will to continue even when the results aren’t
    good or the process challenges are difficult, and a resolve to follow the process
    wherever it leads. Conceptually, it is quite simple to understand that these factors
    are critical to success with marketing analytics, but that doesn’t make it easy
    to build and sustain a successful process. A number of challenges stand in the
    way of spinning up a marketing analytics initiative and maintaining its momentum.


    To increase the chances of success with marketing analytics, organizations cannot
    be naive about the challenges that come with venturing into this territory. This
    chapter discusses some of these challenges with the goal of creating awareness,
    so that with awareness comes the ability to avoid or at least better manage these
    challenges. In truth, these challenges are not fully avoidable. Any organization
    that attempts to take a serious approach to marketing analytics is going to encounter
    challenges at some level. Knowing what they are in advance minimizes the discouragement
    that can cause marketers to abandon their efforts. The foreknowledge also helps
    marketers prepare to deal with them; it’s far easier to avoid risks and dangers
    when you know of them in advance.


    Challenges that marketing teams are likely to face when attempting to instill
    analytics into the marketing psyche include lack of clear direction, lack of support,
    lack of enthusiasm, and lack of freedom. These challenges are on top of the skills,
    tools, or data challenges discussed in previous chapters. These are broad areas
    of challenge, any one of which has more than enough potential to sink an analytics
    initiative. The rest of this chapter is concerned with exploring these areas of
    challenge in greater detail and suggesting strategies for mitigating them.


    ## Lack of Direction


    > If you don’t know where you are going, you might wind up someplace else. —Yogi
    Berra


    Marketing analytics, a business process that provides tremendous direction for
    the marketing team, can itself suffer from a lack of direction. This lack of direction
    is the result of failure to articulate the vision for embracing ­analytics within
    the marketing function. Too often, leaders simply assume that the vision for doing
    something is clear to everyone, when in fact it is not. Other times, leaders fail
    to understand how important clarity and unity of vision is to helping any initiative
    succeed. The higher the stakes of an initiative, the more important it is to ensure
    that everyone buys in to the vision for doing it. This is the first thing that
    must happen on the journey to success with marketing analytics.


    When pursuing success with marketing analytics, having a vision for doing it is
    the first important ingredient in the recipe. But defining, clarifying, and communicating
    the vision is often sacrificed for the sake of expediency. Failing to spend adequate
    time to sort out the vision is a fatal oversight. In the metaphorical journey
    that marketing embarks on when adopting analytics, the vision is the destination.
    Whatever marketing hopes to achieve through analytics is the substance of the
    vision. The absence of a compelling vision for marketing analytics puts marketing
    at risk of winding up someplace other than where it intended, to paraphrase Yogi
    Berra.


    It is the job of the CMO to cast the vision for anything marketing does, and this
    certainly includes analytics. It is entirely possible for a marketing team to
    throw itself headlong into an analytics initiative without a vision to drive the
    effort. Marketing analytics is, after all, a great idea. It’s very easy for everyone
    to agree that it is something “we should be doing.” However, what is the purpose
    of the effort? What goals does the team have in view for the analytics process?
    How will the team allocate resources and use the data the process produces? How
    will the team even know what kind of data to collect and analyze with the process?


    As this book has discussed, analytics is not some extracurricular activity the
    marketing team pursues when it has time or feels like it. Analytics becomes the
    hub of how marketing thinks, plans, and operates. But without a vision, what happens
    when there are obstacles? What motivates the team to keep up the effort when the
    work becomes difficult? In the absence of a vision, the answer to these questions
    is “nothing.” A marketing analytics process that isn’t driven by a compelling
    vision is a short-lived enterprise. The moment it is no longer convenient or easy
    to stick with the analytics process, it is abandoned. There will surely be moments
    where analytics are no longer convenient or easy.


    What’s the right vision for marketing analytics? It’s increasingly common to see
    marketers turn to analytics to help transform marketing into a true revenue-generating
    function. Other marketing teams wish to minimize or eliminate the effect of internal
    politics on how marketing operates and its budget. These examples are just two
    of many that can give the initiative some direction. Each CMO must determine the
    right vision for propelling the marketing analytics function. They must regularly
    communicate it with clarity so that everyone on the marketing team, as well as
    the external stakeholders, knows where ­analytics are taking the team.


    Note


    CMOs must determine the right vision to drive the marketing analytics effort and
    regularly communicate it with clarity to everyone on the marketing team.'
  trans: "\n# 9. 成为数据驱动\n\n将分析嵌入营销的脉络\n\n了解某件事需要发生，并不能保证它一定会被完成。仅仅理解做某件事的必要性和价值，并不足以确保它会成为现实。例如，大多数人都明白，改变饮食和坚持锻炼是通往更健康生活方式和更好体魄的关键。事实上，他们甚至可能深入了解需要做哪些具体的改变、在多长时间内进行，才能产生这些效果。但真正做出这些改变，则完全是另一回事。达成成果需要持之以恒的意志和纪律；定期的鼓励也很有帮助，因为改变根深蒂固的习惯和思维模式非常困难。\n\
    \n采纳并致力于营销分析流程，与追求健康的生活方式有许多相似之处。一个人可能具备了成功开展营销分析所需的知识、熟练度和技能，却仍然可能失败。理解原则、接受智慧、内化建议，并相信本书或其他渠道关于营销分析的忠告，这些都是成功所必需的。然而，仅凭这些并不足以通过应用分析来成为数据驱动的营销组织，从而实现期望的转变。通过营销分析所能获得的收益和改进，是将分析流程深深嵌入营销部门乃至整个组织文化的结果。换句话说，分析流程不能只是缝在营销这块布上用来掩盖瑕疵的补丁——它必须是一系列直接交织在整个织物中的丝线，使得分析成为营销工作不可或缺、甚至与其融为一体的部分。\n\
    \n> **注意**  \n> 只有当营销分析完全融入营销的运营和文化中时，它才能发挥全部影响力。\n\n追求营销分析的成功，并非仅仅是把分析流程添加到营销已有的工作中。成功需要改变文化，而对文化变革的抵制往往是需要克服的最困难障碍。当整个组织下定决心要通过营销分析追求成功时，才会实现全面的文化认同。其特点是具备长远眼光，即使在结果不佳或流程挑战重重时也能坚持下去的决心，以及无论流程将引向何方都遵循执行它的毅力。从概念上讲，理解这些因素对营销分析成功至关重要并不难，但这并不意味着构建并维持一个成功的流程是件容易的事。启动一项营销分析计划并保持其势头，面临着诸多挑战。\n\
    \n为了提高营销分析成功的几率，组织在涉足这一领域时，不能对随之而来的挑战掉以轻心。本章将讨论其中的一些挑战，旨在提高认识，以便有了认识就能避免或至少更好地管理这些挑战。事实上，这些挑战并非完全可以避免。任何试图认真对待营销分析的组织，都会在某种程度上遇到挑战。提前了解这些挑战，能最大限度地减少可能导致营销人员放弃努力的挫败感。这种预见性也有助于营销人员做好准备去应对它们；当你知道风险和危险时，避开它们就容易得多。\n\
    \n在试图将分析理念植入营销思维时，营销团队可能面临的挑战包括：方向不明确、缺乏支持、缺乏热情以及缺乏自由度。这些挑战是在前几章讨论的技能、工具或数据挑战之上的。这些是广泛的挑战领域，其中任何一个都足以让分析计划搁浅。本章剩余部分将更详细地探讨这些挑战领域，并提出缓解这些挑战的策略。\n\
    \n## 方向不明确\n\n> 如果你不知道要去哪里，你很可能最终会去到别的地方。——尤吉·贝拉\n\n营销分析，作为一个为营销团队提供巨大指导的业务流程，其本身也可能因方向不明确而受损。这种方向不明确源于未能清晰阐述在营销职能内拥抱分析的愿景。很多时候，领导者只是假设做某事的愿景对每个人都是清晰的，而事实并非如此。另一些时候，领导者未能理解愿景的清晰度和统一性对于任何计划成功的重要性。一项计划的利害关系越大，确保每个人都认同其愿景就越重要。这是在营销分析成功之路上必须完成的首要任务。\n\
    \n在追求营销分析的成功时，拥有一个愿景是成功配方中的第一个重要成分。但为了图省事，定义、阐明和沟通愿景的工作常常被牺牲。未能花足够的时间梳理愿景是一个致命的疏忽。在营销采用分析流程的比喻性旅程中，愿景就是目的地。营销希望通过分析实现的一切，就是愿景的内容。借用尤吉·贝拉的话来说，缺乏一个令人信服的营销分析愿景，会使营销面临风险，最终可能无法到达预期目的地。\n\
    \n首席营销官（CMO）的职责是为营销所做的任何事情规划愿景，这当然包括分析。营销团队完全有可能在没有愿景驱动的情况下，一头扎进一个分析计划。毕竟，营销分析是一个好主意。大家很容易一致认为这是“我们应该做的事”。然而，这项努力的目的何在？团队对分析流程设定了哪些目标？团队将如何分配资源并使用流程产生的数据？团队甚至如何知道应该收集哪些类型的数据并用流程进行分析？\n\
    \n正如本书所讨论的，分析并非营销团队在有时间或有兴致时才去参加的课外活动。分析应成为营销思考、规划和运营的核心。但如果没有愿景，当遇到障碍时会发生什么？当工作变得困难时，是什么激励团队保持努力？缺乏愿景时，这些问题的答案就是“没有”。没有一个令人信服的愿景驱动的营销分析流程，注定是短命的。当坚持分析流程变得不再方便或容易时，它就会被抛弃。而分析肯定会有不再方便或容易的时候。\n\
    \n营销分析的合适愿景是什么？我们越来越常见到营销人员转向分析，以帮助营销转变为真正的创收职能。其他营销团队则希望最小化或消除内部政治对营销运作方式及其预算的影响。这些例子只是众多能够为计划指明方向的例子中的两个。每位\
    \ CMO 都必须确定推动营销分析职能的合适愿景。他们必须定期、清晰地沟通这一愿景，以便营销团队的每一个人以及外部相关方都知道分析将把团队带向何方。\n\n\
    > **注意**  \n> CMO 必须确定合适的愿景来推动营销分析工作，并定期、清晰地向营销团队的每个人进行沟通。\n"
- fmt: "# 正文\n\nAs important as vision is to providing direction to all that marketing\
    \ does, including the analytics process, it gets its direction from values. What\
    \ are the non-negotiable values on which the marketing analytics function should\
    \ rest? The analytics need to stay firmly tethered to those values and pointed\
    \ in the direction of the vision. An example of a value associated with marketing\
    \ analytics is an “analytics first” approach to every marketing initiative. When\
    \ this value exists, one of the first steps in planning any marketing initiative\
    \ is the identification of metrics to measure it. Those metrics should serve as\
    \ the final arbiter of how an initiative is doing.\n\nThese values really determine\
    \ how seriously marketing will take analytics. Therefore, when a marketing team\
    \ is first embarking on an analytics initiative, it should take the time to determine\
    \ its values. For marketing teams that already have an analytics process but haven’t\
    \ expressed values to guide it, it’s never too late to put some in place. Here\
    \ are 10 representative values that could serve as guides for any marketing analytics\
    \ initiative:\n\n- Every marketing initiative will begin with the determination\
    \ of success metrics.\n- We will not use or report metrics based on inaccurate\
    \ or incomplete data.\n- We will not publish “vanity” metrics just to make marketing\
    \ look busy or because someone likes to see marketing numbers.\n- Everyone has\
    \ an opinion, but metrics are the final arbiter when determining results or success.\n\
    - When the analytics output conflicts with conventional wisdom, we’ll believe\
    \ the analytics.\n- When the analytics reveal good results, we’ll proudly take\
    \ credit.\n- When the analytics reveal poor results, we’ll take responsibility.\n\
    - We will not use the output of our analytics process punitively, only to improve.\n\
    - Analytics don’t make our decisions for us, but they will inform the decisions\
    \ we make.\n- Every marketing initiative will end with reviewing the success metrics.\n\
    \nHaving a vision to provide direction to the marketing analytics process, combined\
    \ with values to guide how the process and its output will work, go a long way\
    \ toward integrating analytics into the fabric of marketing. Even with this in\
    \ place, other challenges remain.\n\n## Lack of Support\n\n> Adversity is the\
    \ first path to truth. —Lord Byron\n\nIt is naive to believe that just because\
    \ something is a good idea, everyone will support it. Marketing analytics is certainly\
    \ a good idea, but the lack of support from in and outside the marketing department\
    \ may catch many supporters off guard. When pursued to a mature level, analytics\
    \ will transform a marketing department into a data-driven entity, for which most\
    \ of the doubt about its performance is vanquished. Who wouldn’t want this? As\
    \ Chapter [1](../Text/A978-1-4842-0259-3_1_Chapter.html) describes, most of the\
    \ marketers in organizations that are flying blind with respect to analytics,\
    \ or within organizations using pseudo-analytics, are either not receptive to\
    \ or are just feigning interest in them. These kinds of marketing organizations\
    \ probably don’t want an analytics initiative thrust on them, but everyone else\
    \ would, right? Not necessarily.\n\nChapter [2](../Text/A978-1-4842-0259-3_2_Chapter.html)\
    \ contains a discussion of marketing analytics challenges, summarized in Figure\
    \ [2-7](../Text/A978-1-4842-0259-3_2_Chapter.html#Fig7). This issue of support,\
    \ either from the executive team or the marketing team, doesn’t rank very high\
    \ on the list of challenges. It’s therefore important to clarify why this chapter\
    \ revisits this topic in much more detail. Support for marketing analytics, or\
    \ lack thereof, can come in two forms:\n\n- Support for having a marketing analytics\
    \ initiative: the subject of Chapter [2](../Text/A978-1-4842-0259-3_2_Chapter.html).\n\
    - Support for or belief in the output of the marketing analytics process: the\
    \ subject of this chapter.\n\nHere’s what every marketing analytics supporter\
    \ wants to believe: the output of a valid marketing analytics process based on\
    \ accurate data trumps all other beliefs, biases, superstitions, and opinions.\
    \ In other words, simply putting the metrics in front of nonbelievers should immediately\
    \ spur acceptance of the logical conclusions of those metrics. After all, the\
    \ data is the data. The data represents irrefutable fact. How is it even possible\
    \ to dispute it? Yet it happens with regularity: logic-defying resistance to metrics\
    \ that frustrates analytics supporters.\n\nThis phenomenon isn’t unique to marketing\
    \ analytics acceptance, support, and belief. It doesn’t matter whether the discussion\
    \ is about climate change, the link between vaccines and autism, or marketing\
    \ analytics: previously held convictions don’t just easily give way to cold, hard\
    \ facts. In a famous case study in psychology, Stanford University psychologist\
    \ Leon Festinger stated, “A man with a conviction is a hard man to change. Tell\
    \ him you disagree and he turns away. Show him facts or figures and he questions\
    \ your sources. Appeal to logic and he fails to see your point.”[¹](#A978-1-4842-0259-3_9_Chapter.html#Fn1)\
    \ Marketers must understand and prepare for the likelihood that the measurements\
    \ and data produced by their analytics process may not enjoy automatic and instant\
    \ acceptance. Becoming data driven and weaving analytics into the fabric of marketing\
    \ can’t occur until such bias is dealt with.\n\n> **Note**  \n> Marketers must\
    \ prepare for the possibility that the metrics and insights from their analytics\
    \ process may not enjoy immediate acceptance.\n\nAnyone who has ever uttered the\
    \ phrase “why won’t you listen to reason?” in an argument understands the frustration\
    \ of dealing with someone who discounts or ignores facts. There’s some interesting\
    \ science behind this phenomenon: “Reasoning is actually suffused with emotion\
    \ (or what researchers often call ‘affect’). Not only are the two inseparable,\
    \ but our positive or negative feelings about people, things, and ideas arise\
    \ much more rapidly than our conscious thoughts, in a matter of milliseconds—fast\
    \ enough to detect with an EEG device, but long before we're aware of it.”[²](#A978-1-4842-0259-3_9_Chapter.html#Fn2)"
  raw: 'As important as vision is to providing direction to all that marketing does,
    including the analytics process, it gets its direction from values. What are the
    non-negotiable values on which the marketing analytics function should rest? The
    analytics need to stay firmly tethered to those values and pointed in the direction
    of the vision. An example of a value associated with marketing analytics is an
    “analytics first” approach to every marketing initiative. When this value exists,
    one of the first steps in planning any marketing initiative is the identification
    of metrics to measure it. Those metrics should serve as the final arbiter of how
    an initiative is doing.


    These values really determine how seriously marketing will take analytics. Therefore,
    when a marketing team is first embarking on an analytics initiative, it should
    take the time to determine its values. For marketing teams that already have an
    analytics process but haven’t expressed values to guide it, it’s never too late
    to put some in place. Here are 10 representative values that could serve as guides
    for any marketing analytics initiative:


    Every marketing initiative will begin with the determination of success metrics.
    We will not use or report metrics based on inaccurate or incomplete data. We will
    not publish “vanity” metrics just to make marketing look busy or because someone
    likes to see marketing numbers. Everyone has an opinion, but metrics are the final
    arbiter when determining results or success. When the analytics output conflicts
    with conventional wisdom, we’ll believe the analytics. When the analytics reveal
    good results, we’ll proudly take credit. When the analytics reveal poor results,
    we’ll take responsibility. We will not use the output of our analytics process
    punitively, only to improve. Analytics don’t make our decisions for us, but they
    will inform the decisions we make. Every marketing initiative will end with reviewing
    the success metrics.


    Having a vision to provide direction to the marketing analytics process, combined
    with values to guide how the process and its output will work, go a long way toward
    integrating analytics into the fabric of marketing. Even with this in place, other
    challenges remain.


    ## Lack of Support


    > Adversity is the first path to truth. —Lord Byron


    It is naive to believe that just because something is a good idea, everyone will
    support it. Marketing analytics is certainly a good idea, but the lack of support
    from in and outside the marketing department may catch many supporters off guard.
    When pursued to a mature level, analytics will transform a marketing department
    into a data-driven entity, for which most of the doubt about its performance is
    vanquished. Who wouldn’t want this? As Chapter [1](../Text/A978-1-4842-0259-3_1_Chapter.html)
    describes, most of the marketers in organizations that are flying blind with respect
    to analytics, or within organizations using pseudo-analytics, are either not receptive
    to or are just feigning interest in them. These kinds of marketing organizations
    probably don’t want an analytics initiative thrust on them, but everyone else
    would, right? Not necessarily.


    Chapter [2](../Text/A978-1-4842-0259-3_2_Chapter.html) contains a discussion of
    marketing analytics challenges, summarized in Figure [2-7](../Text/A978-1-4842-0259-3_2_Chapter.html#Fig7).
    This issue of support, either from the executive team or the marketing team, doesn’t
    rank very high on the list of challenges. It’s therefore important to clarify
    why this chapter revisits this topic in much more detail. Support for marketing
    analytics, or lack thereof, can come in two forms:


    Support for having a marketing analytics initiative: the subject of Chapter [2](../Text/A978-1-4842-0259-3_2_Chapter.html).
    Support for or belief in the output of the marketing analytics process: the subject
    of this chapter.


    Here’s what every marketing analytics supporter wants to believe: the output of
    a valid marketing analytics process based on accurate data trumps all other beliefs,
    biases, superstitions, and opinions. In other words, simply putting the metrics
    in front of nonbelievers should immediately spur acceptance of the logical conclusions
    of those metrics. After all, the data is the data. The data represents irrefutable
    fact. How is it even possible to dispute it? Yet it happens with regularity: logic-defying
    resistance to metrics that frustrates ­analytics supporters.


    This phenomenon isn’t unique to marketing analytics acceptance, support, and belief.
    It doesn’t matter whether the discussion is about climate change, the link between
    vaccines and autism, or marketing analytics: previously held convictions don’t
    just easily give way to cold, hard facts. In a famous case study in psychology,
    Stanford University psychologist Leon Festinger stated, “A man with a conviction
    is a hard man to change. Tell him you disagree and he turns away. Show him facts
    or figures and he questions your sources. Appeal to logic and he fails to see
    your point.”[¹](#A978-1-4842-0259-3_9_Chapter.html#Fn1) Marketers must understand
    and prepare for the likelihood that the measurements and data produced by their
    ­analytics process may not enjoy automatic and instant acceptance. Becoming data
    driven and weaving analytics into the fabric of marketing can’t occur until such
    bias is dealt with.


    Note


    Marketers must prepare for the possibility that the metrics and insights from
    their analytics process may not enjoy immediate acceptance.


    Anyone who has ever uttered the phrase “why won’t you listen to reason?” in an
    argument understands the frustration of dealing with someone who discounts or
    ignores facts. There’s some interesting science behind this phenomenon: “Reasoning
    is actually suffused with emotion (or what researchers often call ‘affect’). Not
    only are the two inseparable, but our positive or negative feelings about people,
    things, and ideas arise much more rapidly than our conscious thoughts, in a matter
    of milliseconds—fast enough to detect with an EEG device, but long before we''re
    aware of it.”[²](#A978-1-4842-0259-3_9_Chapter.html#Fn2)'
  trans: "\n# 正文\n\n愿景虽能为市场营销的所有工作（包括分析流程）提供方向，但其本身也源自价值观。营销分析职能应当建立在哪些不可妥协的价值观之上？分析工作必须牢牢扎根于这些价值观，并朝着愿景指引的方向前进。与营销分析相关的一个价值观示例是，对每一项营销举措都采取“分析优先”的方法。当这一价值观确立后，策划任何营销举措的首要步骤之一便是识别衡量其效果的指标。这些指标应作为判定举措成效的最终裁决者。\n\
    \n这些价值观真正决定了营销团队对待分析的认真程度。因此，当营销团队初次启动分析项目时，应花时间确定其价值观。对于那些已经拥有分析流程但尚未明确价值观来指导工作的营销团队来说，任何时候建立价值观都为时不晚。以下是可作为任何营销分析项目指导方针的十个代表性价值观：\n\
    \n-   每一项营销举措都将从确定成功指标开始。\n-   我们不会使用或报告基于不准确或不完整数据的指标。\n-   我们不会仅仅为了让营销显得繁忙，或因为有人喜欢看到营销数据，而发布“虚荣”指标。\n\
    -   每个人都有自己的观点，但在判定结果或成功时，指标是最终的裁决者。\n-   当分析结果与传统认知相悖时，我们相信分析结果。\n-   当分析结果显示良好成果时，我们自豪地接受赞誉。\n\
    -   当分析结果显示不佳结果时，我们承担责任。\n-   我们不会将分析流程的输出用于惩罚目的，而仅用于改进。\n-   分析不会替我们做决策，但会为我们的决策提供信息。\n\
    -   每一项营销举措都将以回顾成功指标而告终。\n\n拥有愿景来为营销分析流程提供方向，并结合价值观来指导流程及其产出如何运作，对于将分析融入营销体系大有裨益。即使做到了这些，其他挑战依然存在。\n\
    \n## 缺乏支持\n\n> 逆境是通往真理的第一条道路。——拜伦勋爵\n\n认为只要某件事是个好主意，所有人都会支持它，这种想法是天真的。营销分析无疑是个好主意，但来自营销部门内部和外部的缺乏支持，可能会让许多支持者措手不及。当分析发展到成熟水平时，它将把营销部门转变为一个数据驱动的实体，届时对其绩效的大部分质疑都将被消除。谁会不想要这样呢？正如第\
    \ 1 章所述，许多组织中那些在分析方面盲目飞行，或使用伪分析的市场营销人员，要么对分析不接受，要么只是假装对其感兴趣。这类营销组织可能不希望强加一个分析项目，但其他组织会想要的，对吧？不一定。\n\
    \n第 2 章讨论了营销分析面临的挑战，总结于图 2-7。这种支持问题，无论是来自高管团队还是营销团队，在挑战清单上的排名并不高。因此，阐明本章为何更详细地重新探讨这一主题就显得尤为重要。对营销分析的支持——或缺乏支持——可能以两种形式出现：\n\
    \n-   支持开展营销分析项目：这是第 2 章的主题。\n-   支持或相信营销分析流程的输出：这是本章的主题。\n\n每个营销分析支持者都愿意相信：基于准确数据的有效营销分析流程的输出，胜过所有其他信念、偏见、迷信和观点。换句话说，仅仅把指标摆在怀疑者面前，就应该能立即促使他们接受这些指标得出的逻辑结论。毕竟，数据就是数据。数据代表着无可辩驳的事实。怎么可能对其提出异议呢？然而，这种情况却屡见不鲜：对指标那种违背逻辑的抵触，让分析支持者倍感挫败。\n\
    \n这种现象并非营销分析在获得接受、支持和信任时所独有。无论讨论的是气候变化、疫苗与自闭症之间的联系，还是营销分析：先前持有的信念并不会轻易向冰冷的事实让步。在一个著名的心理学案例研究中，斯坦福大学心理学家利昂·费斯廷格指出：“一个有信念的人很难改变。告诉他你不同意，他会转身离开。向他展示事实或数据，他会质疑你的来源。诉诸逻辑，他则无法理解你的观点。”¹\
    \ 营销人员必须理解并做好准备，他们分析流程所产生的测量结果和数据，可能不会自动且即时地获得接受。在处理这种偏见之前，数据驱动和将分析融入营销体系是无法实现的。\n\
    \n> **注意**  \n> 营销人员必须做好准备，其分析流程得出的指标和洞察可能不会立即获得认可。\n\n任何曾在争论中说过“你为什么就是不听劝？”这句话的人，都理解与那些漠视或忽略事实的人打交道时的挫败感。这种现象背后有一些有趣的科学原理：“推理实际上充满了情感（或研究人员常称之为‘情感因素’）。两者不仅不可分割，而且我们对人、事、物的积极或消极感受，产生速度远快于我们的意识思维——只需几毫秒，快得足以用脑电图设备检测到，但远在我们意识到它之前。”²\n"
- fmt: '# Data and Information Negatively Reinforcing Beliefs


    Data and information that negatively reinforces beliefs doesn’t have smooth sailing
    to acceptance in the brain of the recipient. When confronted with data that doesn’t
    conform to beliefs, often it isn’t reasoning that occurs but rationalization.


    Consider this scenario: an older business owner believes that traditional print
    media advertising is the best way to reach customers. “We have to be in the newspaper”
    is the edict from this owner. This owner’s marketing director runs both traditional
    print and digital media campaigns, tracking key metrics; these metrics prove that
    digital far outperforms traditional print. However, the owner doesn’t agree with
    the data, and instead allows personal bias to prevent the marketer from diverting
    funds away from traditional print to invest more heavily in digital.


    In this scenario, the marketer does exactly what should occur: identifying success
    metrics and using them to monitor results, then making improvement actions. The
    business owner won’t hear of it. What is happening in this scenario has been experienced
    by many a seasoned marketer, and its occurrence isn’t limited to just marketing
    or analytics. “Our ‘reasoning’ is a means to a predetermined end—winning our ‘case’—and
    is shot through with biases. They include ‘confirmation bias,’ in which we give
    greater heed to evidence and arguments that bolster our beliefs, and ‘disconfirmation
    bias,’ in which we expend disproportionate energy trying to debunk or refute views
    and arguments that we find uncongenial.”[³](#A978-1-4842-0259-3_9_Chapter.html#Fn3)


    ## The Challenge of Objectivity


    Scenarios like this reveal how truly difficult it is have complete objectivity
    about data. All data has to pass through a filter of understanding consisting
    of our biases and paradigms. We can’t easily suspend these because most of the
    time we don’t even realize we have them. Even when we do have awareness of them,
    we can’t just turn them off. The result is that even with the best of intentions
    we easily slip into rationalization mode to shade conclusions toward our own bias.


    This rationalization bias can come from any quarter. The example scenario presented
    here is of external bias affecting how marketing operates, but bias can just as
    easily come from within the marketing team.


    ## Minimizing the Effects of Bias


    What can marketing analytics advocates do to avoid this frustration? It isn’t
    entirely avoidable, but it is possible to minimize or counter the effects of bias:


    - **Recognize that it exists.** Like death and taxes, the presence of bias affecting
    the marketing analytics process is inevitable for most marketers. This bias against
    analytics is a feature of the marketing landscape (and many other landscapes).


    - **Don’t be surprised by it.** Being indignant because bias impedes progress
    or acceptance of marketing analytics is an understandable response, but it gets
    you nowhere. Plan to encounter it and diligently work through it.


    - **Know who your allies are.** While there are usually a few people with bias,
    there are also supporters of the analytics effort. Take a census to understand
    the views of the stakeholders, and then leverage the influence of your allies.


    - **Use the culture to your advantage.** Culture can create lift or drag for marketing
    analytics—sometimes both! If there are elements of culture or specific core values
    that support the marketing analytics process, don’t hesitate to use them.


    - **Think small.** When the response to the marketing analytics process is hostile,
    and it comes from a source with veto power, prepare to retreat temporarily. In
    the face of such opposition, don’t attempt to use analytics to justify major marketing
    changes, because those efforts will fail. Instead, temporarily limit the application
    of analytics to smaller matters.


    - **Avoid outright confrontation.** It’s tempting to turn efforts to instill marketing
    analytics and a culture of acceptance into a crusade, but avoid doing so. Allowing
    the emotion around analytics to escalate to overt hostility simply causes opponents
    to dig in and resist with more vigor. Even when you face resistance, keep the
    olive branch extended.


    - **Maintain a long-term perspective.** Don’t let resistance and a few setbacks
    discourage your efforts to engrain analytics into the marketing and corporate
    psyche. Mentally prepare for progress that often occurs in a “two steps forward,
    one step back” type of rhythm. Eventually, marketing analytics will prevail.


    - **Appeal to a higher power.** If one of your allies is the boss, president,
    CEO, or owner, consider enlisting that person to help flatten the internal barriers
    to the analytics acceptance. This, however, is sometimes a delicate operation,
    as it is easily viewed as “going over someone’s head,” a move that is rarely appreciated
    and can burn some bridges.


    ## Persistence and Truth


    Experiencing resistance to marketing analytics can make one feel like Galileo,
    who was persecuted for having the audacity to claim the Earth orbited the Sun.
    Nothing is more frustrating than having the facts and truth on your side and being
    met with stubborn, irrational resistance.


    The truth is like the force of water, capable of carving deep channels through
    the hardest rock. Persistence in pursuing an analytics initiative will ultimately
    yield the same result, eroding away the resistance to the truths it reveals.'
