- fmt: '# Marketing Dashboard Implementation Considerations


    ## Direct Integration with Data Sources


    One of the considerations that can facilitate reporting real-time data on a marketing
    dashboard is direct integration with data sources. Since there really is no “system
    of record” for marketing, the data that feeds the marketing analytics process
    can come from a number of different and even unrelated systems. To the extent
    that it is possible, marketing should link these data sources directly to the
    marketing dashboards through the use of any available integration paths, such
    as application programming interfaces (`API`s). Figure 7-2 shares research data
    that shows various data sources and the frequency with which they are part of
    a marketing analytics process.


    ![A978-1-4842-0259-3_7_Fig2_HTML.jpg](Images/A978-1-4842-0259-3_7_Fig2_HTML.jpg)


    **Figure 7-2.** Marketing analytics data is sourced from a variety of systems,
    many of which can provide data to a dashboard via an API


    When these integration paths exist, marketers should definitely use them to eliminate
    the tedious manual loading or copying of data into dashboards. Cutting and pasting
    or manually importing data will get the job done, but the process can quickly
    become unwieldy, and when it does, it becomes a barrier to producing quality dashboards.
    Even though some technical know-how is required to exploit these integrations,
    they are worth putting in place from the start so that an entire dashboard initiative
    doesn’t collapse under the weight of a manual data populating process.


    ## Technical Heavy Lifting Is Becoming Easier


    Fortunately, the technical heavy lifting associated with integrating all the data
    sources necessary for curating a marketing analytics dashboard is becoming easier.
    The Marketing Technology Landscape Supergraphic referenced in Chapter 2 identifies
    at least 35 vendor solutions for creating dashboards and other data visualizations.
    One thing most of these solutions have in common is a set of data connectors and
    `API`s that make integrating data from varied sources into a dashboard much easier,
    and in many cases, automatic. Though it’s certainly possible to create a dashboard
    using a spreadsheet or even printed charts and graphs, getting data into them
    is a manual process, and this often becomes the failure point of publishing dashboards.


    This author recently visited a client who published a paper-based dashboard by
    printing charts and graphs and posting them to a conference room wall. The array
    and variety of information on display was impressive, as was its organization
    on two walls of the conference room. On close inspection, most of the graphs were
    several months out of date, illustrating the problem that results when dashboards
    don’t integrate to and automatically populate with the data on which they are
    based. The use of a dashboard solution that eliminates this problem is highly
    recommended and in fact is a key enabler of success for a dashboard.


    ## Sharing and Collaboration


    The most important considerations for implementing marketing dashboards are sharing
    and collaboration. No matter how elaborate or how well constructed a dashboard
    is, it is just a piece of art if it doesn’t motivate the people who see it to
    take action. For the decision making to occur, sharing must first happen. What
    happens too often is that marketing thoughtfully creates and publishes one or
    more dashboards, but they never “escape” the marketing department and get seen
    by those who need to do something on the basis of the data they contain. The process
    of publishing a dashboard needs to include consideration of how to share the dashboard
    with those that need to see it. Each of the considerations discussed so far contribute
    to sharing of and collaboration around marketing dashboards.


    > **Note:** A marketing dashboard that doesn’t motivate the people who see it
    to take action is just a piece of art. Action comes from sharing and collaboration
    of dashboards.


    It is the effective sharing of dashboards that enables collaboration, and this
    collaboration is what creates the value from the dashboarding effort. A dashboard
    is a communication and collaboration tool, and if the collaboration doesn’t occur,
    producing dashboards essentially amounts to busy work. Collaboration should occur
    across several levels. Intradepartmental collaboration among members of the marketing
    team is the first level, and is the easiest to facilitate because often these
    team members share physical proximity. Still, a `CMO` should never assume that
    collaboration is occurring as a natural by-product of the existence of a dashboard.
    `CMO`s need to model the collaboration and create the expectation of how it should
    take place and what should result from it. As Figure 7-3 illustrates, collaboration
    around marketing analytics data and the dashboards that display it isn’t always
    a certainty.


    ![A978-1-4842-0259-3_7_Fig3_HTML.jpg](Images/A978-1-4842-0259-3_7_Fig3_HTML.jpg)


    **Figure 7-3.** More than a third of organizations have minimal to no collaboration
    occurring around their marketing analytics data


    ### What Does This Collaboration Look Like?


    The results on a dashboard are a catalyst for action, so when studying the data
    a dashboard displays, reviewers should concern themselves with the implications
    of what they’re seeing. The questions that dashboard results should prompt are
    simple, but the actions taken profound:


    - What do the results the dashboard displays say about meeting the underlying
    objectives?

    - What needs to happen or change because of the results the dashboard displays?


    Use the first question to determine if the metrics summarized on the dashboard
    indicate progress toward or regression from goals. This initial determination
    essentially amounts to marketing getting its bearings and knowing where it is
    with respect to achieving goals. Before any actions are taken or course correction
    attempts are made, marketing simply needs to know where it is. If the dashboard
    indicates progress, often nothing needs to occur, as the dashboard indicates current
    marketing processes are delivering hoped-for results. Still, it’s as valuable
    to understand why marketing is achieving favorable results as it is to determine
    why it isn’t. Collaboration around this first question is usually quite simple:
    a review of the dashboard results by all interested parties to determine if there
    is agreement around what they mean.


    Dashboard results that indicate progress is not being made toward objectives should
    trigger problem determination efforts. This is the point at which collaboration
    is most valuable, first to understand the root cause of the results and then determine
    what to do to change them. Marketers need to understand that the existence of
    the dashboard doesn’t ensure that this collaboration will occur. Marketing must
    lead the collaborative process, and the dashboard becomes a tool that facilitates
    that collaboration.


    ## Tool Choices and Collaboration


    The tools marketing chooses for its analytics process and dashboard reporting
    do affect how well collaboration occurs. Certain analytics tool choices facilitate
    collaboration better than others, and research reveals that some tool choices
    actually predict better collaboration:


    - Data visualization tools

    - Statistical analysis software

    - Business intelligence tools

    - Presentation software or tools'
