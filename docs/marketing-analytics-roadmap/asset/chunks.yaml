- fmt: 'The first characteristic of an indispensable marketing organization is strategic
    orientation. This implies that there is a plan that drives what marketing does.
    Ideally, this plan results from a strategic planning process involving the key
    stakeholders in the company. This plan aligns very closely with corporate goals
    and objectives, and there are milestones and measurements to track progress.


    By contrast, marketing organizations that exist as cost centers are more likely
    to have an operational orientation. This doesn’t mean they have no plan, but the
    plan is often ignored or even abandoned. These marketing organizations are request-driven
    and more reactive. They resemble the type of marketing organization described
    in [Chapter 1](../Text/A978-1-4842-0259-3_1_Chapter.html) that is flying blind
    with respect to analytics.


    The second characteristic of indispensable marketing organizations is that they
    have a high degree of alignment with the sales teams that they support. They work
    together, and not apart in silos, and they have compatible or even shared goals.


    The third characteristic of indispensable marketing organizations is that they
    are very or completely analytics-driven. Analytics are at the heart of how these
    marketing organizations work. They rely on analytics and metrics to validate their
    efforts and show accountability to the rest of the organization.


    The marketing organizations exhibiting these characteristics are not at risk of
    having the perception that they are an expense. Furthermore, analytics don’t occupy
    a silo separate from other characteristics. Analytics enable the first two characteristics
    discussed above. We’ll examine the current state of marketing analytics to see
    how prevalent these indispensable marketing organizations are.


    ## The State of Marketing Analytics


    Marketers will always face the challenge of demonstrating value and relevance
    to the organizations they serve. Marketers, although sometimes reluctantly, generally
    agree that an analytics process provides the most compelling evidence of their
    contribution. What is the current state of analytics across the marketing community
    at large?


    Figure [2-4](#A978-1-4842-0259-3_2_Chapter.html#Fig4) provides a graph, summarizing
    the views of more than 700 company presidents, CEOs, CMOs, vice presidents of
    marketing, marketing directors, marketing managers, sales managers, and product
    and brand managers on the status of marketing analytics in their companies. A
    survey[³](#A978-1-4842-0259-3_2_Chapter.html#Fn3) of this group inventoried the
    state of their analytics efforts using the following response categories:


    ![A978-1-4842-0259-3_2_Fig4_HTML.jpg](Images/A978-1-4842-0259-3_2_Fig4_HTML.jpg)


    Figure 2-4.


    Most marketing organizations are trying to do something with analytics, with varying
    degrees of success


    -   Avoidance: We’re trying to avoid analytics unless required to use them.

    -   Searching: We want to do something and are searching for the best way to start.

    -   Experimenting: We’re experimenting to identify the best set of analytics,
    but they aren’t yet influencing behavior or activity.

    -   Low visibility: We’re tracking meaningful analytics, but they don’t yet have
    visibility outside of the marketing organization.

    -   High visibility: We’re tracking meaningful analytics, and they have visibility
    throughout the organization.


    In this era of modern marketing, just over a third of companies report that they
    are tracking meaningful analytics. The same group of participants were also asked
    to rate their marketing process using a scale in which 1 equals “avoidance” and
    5 equals “meaningful and visible results.” This analysis reveals that large companies
    (more than 1,000 employees) report greater analytics progress with a mean score
    of 3.46, compared to small companies (100 employees or fewer) whose mean score
    was 3.17.


    There is also a relationship between company size and the state of analytics:


    -   33 percent of small companies are either avoiding analytics or searching for
    the best way to start.

    -   26 percent of medium-sized companies (between 101 and 1,000 employees) fall
    into these same two categories.

    -   19 percent of large companies fall into these categories.


    It seems that the larger the company, the more likely that its marketing department
    is using analytics. Small companies may feel less compelled to pursue a marketing
    analytics initiative for a number of reasons. Quite often, there is an “all hands
    on deck” mentality in small companies, and everyone pitches in to do whatever
    is necessary for the company to succeed, and this includes marketing. The various
    functions within a small company usually have proximity to one another, literally
    working side by side. In this setting, everyone seems to know what everyone else
    is doing, so the need for the accountability that analytics provides isn’t as
    urgent.


    As we consider the state of marketing analytics, the amount of funding analytics
    initiatives receive is a good indicator of importance. The things companies invest
    in reveal their priorities and the seriousness of their endeavors. Although marketing
    analytics don’t represent a massive outlay, it does require some funding and resources
    if the process is to have impact. The data summarized in Figure [2-5](#A978-1-4842-0259-3_2_Chapter.html#Fig5)
    provide a view of how much of the marketing budget is earmarked for analytics.[⁴](#A978-1-4842-0259-3_2_Chapter.html#Fn4)


    ![A978-1-4842-0259-3_2_Fig5_HTML.jpg](Images/A978-1-4842-0259-3_2_Fig5_HTML.jpg)


    Figure 2-5.


    Almost one-fourth of organizations have no allocation for analytics in their marketing
    budgets


    When analyzed further, the data in Figure [2-5](#A978-1-4842-0259-3_2_Chapter.html#Fig5)
    provides insights into the relationship between analytics funding and effectiveness.
    Eight percent of participants in this study are investing more than 10 percent
    of their marketing budgets on marketing analytics. For this elite group, 50 percent
    of them also report they are tracking meaningful analytics that have visibility
    throughout the organization (Figure [2-4](#A978-1-4842-0259-3_2_Chapter.html#Fig4)).
    This represents a level of analytics maturity that is almost double that for organizations
    spending between 6 and 10 percent of their budget and triple that of organizations
    spending less than 5 percent of their budget. This analysis makes clear that more
    investment leads to greater visibility of the analytics data. Does that visibility
    also equate to better results? Although visibility is important, results are what
    matters.


    Additional analysis of the budget data in Figure [2-5](#A978-1-4842-0259-3_2_Chapter.html#Fig5)
    shows an apparent point of diminishing returns on investing in marketing analytics.
    The marketing organizations that are allocating between 6 and 10 percent of their
    budget on marketing analytics are getting the best results, with 51 percent of
    them reporting the highest rate of improving marketing results with analytics.
    For the elite group that is spending more than 10 percent of their budget, 45
    percent report this highest rate of improvement, and for those budgeting less
    than 5 percent on analytics, 40 percent fell within this highest rate of improvement.
    It seems, therefore, that the sweet spot is to allocate between 6 and 10 percent
    of the marketing budget toward analytics.'
