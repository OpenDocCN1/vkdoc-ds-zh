  raw: '# 5. Getting Started with Analytics


    Ready, Set, Go!


    > Marketing has always been a grueling and competitive sport—not unlike running
    a marathon. With the changes in the buying process, in media and technology, and
    managing expectations, it’s like running a marathon as the ground shifts beneath
    your feet. What was already difficult is becoming increasingly difficult. If you’re
    going to do it without measurement, it’s like running a marathon, in an earthquake,
    blindfolded. [¹](#A978-1-4842-0259-3_5_Chapter.html#Fn1) —David Raab


    The critical part of any journey is the first step. Taking the first step in the
    marketing analytics journey represents a willingness, commitment, and desire to
    become a data-driven, revenue-oriented marketing organization. But it takes more
    than just desire. Success with marketing analytics requires a plan that encompasses
    resources, preparations, potential hazards one might encounter along the way,
    and contingencies. This chapter provides the framework for developing such a plan.


    This chapter assumes that the reader is part of an organization that has no analytics
    process in place and is preparing to begin this journey. As Figure [2-4](../Text/A978-1-4842-0259-3_2_Chapter.html#Fig4)
    revealed, just over a quarter of marketing organizations fall into this category.
    Other organizations that are further along can still benefit from the information
    this chapter shares, using it to help benchmark and assess their own process maturity.


    This journey has a beginning, but no end. As [Chapter 4](../Text/A978-1-4842-0259-3_4_Chapter.html)
    shared, the marketing analytics process is a continuous loop. There are, however,
    some preparatory steps for those who are just starting the journey and checkpoints
    for those already on it. These milestones include assessing organizational readiness,
    studying business objectives, determining or clarifying marketing objectives,
    and establishing the right set of metrics. The remainder of this chapter explores
    these milestones in greater detail.


    Note


    The major milestones in the marketing analytics journey include assessing organizational
    readiness, reviewing or clarifying business objectives, and establishing the right
    set of metrics.


    ## Assessing Organizational Readiness


    > Most of us spend too much time on what is urgent and not enough time on what
    is important. —Stephen Covey, The Seven Habits of Highly Effective People


    If it were possible to observe how organizations with a mature marketing analytics
    process operate, you would notice a certain characteristic: they don’t let urgent
    matters get in the way of what’s important. To these organizations, analytics
    are very important, not just in marketing but in all business areas. This kind
    of operational philosophy is actually quite strategic. It’s a reliable indicator
    that the organization is committed to a plan that is well understood, one that
    is metrics-enabled, of course.


    As organizations embark on the marketing analytics journey, they must first assess
    their readiness to do so. This path isn’t just about adding another à la carte
    process to the organizational menu. Instead, for analytics to effect the change
    and improvement of which they’re capable, organizations must weave analytics into
    the very fabric of their operational being. For this reason, the first thing to
    do when preparing to implement a marketing analytics process is to see if the
    organization is ready to make the journey. The initial areas to assess are the
    leadership and culture of the organization.


    Success with marketing analytics is the product of several characteristics, the
    first of which is culture, and culture is a function of leadership. If you’re
    trying to set out on this journey, will your organizational culture allow you
    to succeed? Even when leadership is providing encouragement and saying “yes” to
    analytics, the culture of the organization can still represent a barrier. Table
    [5-1](#A978-1-4842-0259-3_5_Chapter.html#Tab1) provides a contrast of cultures
    as they relate to marketing analytics success.


    Table 5-1.


    Cultures that Act as a Barrier and as a Catalyst for Marketing Analytics Success


    | Culture as a Barrier | Culture as a Catalyst |

    | --- | --- |

    | Work on what’s urgent (reactive) | Work on what’s important (proactive) |

    | Punish mistakes | Learn from mistakes |

    | Trust intuition | Trust data |

    | Political environment | Transparent environment |


    Culture is a deal-breaker for many corporate initiatives. A healthy culture is
    a greenhouse for marketing analytics; a dysfunctional culture a desert wasteland.
    The attributes in Table [5-1](#A978-1-4842-0259-3_5_Chapter.html#Tab1) represent
    the end points on a cultural and leadership readiness spectrum for marketing analytics.
    You should assess where your company is on this cultural spectrum so that an analytics
    initiative doesn’t shrivel up and die due to a hostile cultural environment.


    Organizations with some or all of their cultural attributes in the “barrier” column
    must understand that the environment for success with marketing analytics may
    not exist. The irony for these groups is that their dysfunctional cultures indicate
    a desperate need for the change that marketing analytics can help bring about.
    Yet, their cultures are a hostile environment for the marketing analytics process
    and the accountability it brings.


    What must happen in such organizations for marketing analytics to succeed? The
    culture must change, moving toward the attributes listed in the “catalyst” column
    of Table [5-1](#A978-1-4842-0259-3_5_Chapter.html#Tab1). Such change, however,
    doesn’t come easily. Cultural change usually requires existing leadership to change,
    adopting and modeling new attitudes, or for new leadership to replace existing
    leadership. Either way, cultural change doesn’t occur quickly and it’s rarely
    painless. Still, marketing leaders should be agents for change in such organizations,
    advocating for cultural evolution (not revolution) that will create benefits far
    beyond opening the door for marketing analytics.'
  trans: "\n# 5. 分析入门\n\n准备，就位，出发！\n\n> 市场营销一直以来都是一项艰苦卓绝且竞争激烈的运动——与跑马拉松并无二致。随着购买流程、媒体和技术的变化，以及管理预期的挑战，这就像在脚下地面不断移动中跑马拉松。原本艰难的事情正变得日益艰难。如果你不进行衡量，那就如同蒙着眼睛，在地震中跑马拉松。¹\
    \ ——大卫·拉布\n\n任何旅程的关键都是第一步。踏上营销分析之旅的第一步，代表着成为数据驱动、以收入为导向的营销组织的意愿、承诺和渴望。但这需要的不仅仅是渴望。营销分析的成功需要一个包含资源、准备、旅途中可能遇到的潜在危险以及应急计划的计划。本章提供了制定这样一个计划的框架。\n\
    \n本章假定读者所在的组织尚无分析流程，并正准备开启这段旅程。如图 2-4 所示，略超过四分之一的营销组织属于这一类别。其他走得更远的组织仍然可以从本章分享的信息中获益，利用它来帮助对标和评估自身的流程成熟度。\n\
    \n这段旅程有起点，但无终点。正如第 4 章所分享的，营销分析流程是一个持续循环。然而，对于刚刚开始旅程的人来说，有一些准备步骤，对于已经在路上的人来说，也有一些检查点。这些里程碑包括评估组织准备度、研究业务目标、确定或澄清营销目标，以及建立正确的指标体系。本章的其余部分将更详细地探讨这些里程碑。\n\
    \n> **注意**  \n> 营销分析之旅的主要里程碑包括评估组织准备度、审视或澄清业务目标，以及建立正确的指标体系。\n\n## 评估组织准备度\n\n\
    > 我们大多数人花太多时间在紧急的事情上，而没有花足够的时间在重要的事情上。——斯蒂芬·柯维，《高效能人士的七个习惯》\n\n如果能够观察拥有成熟营销分析流程的组织是如何运作的，你会发现一个显著特征：他们不会让紧急事务妨碍重要事务。对这些组织来说，分析非常重要，不仅在营销领域，而且在所有业务领域。这种运营哲学实际上颇具战略意义。它是一个可靠的指标，表明该组织致力于执行一个被充分理解、当然也具备指标支持的计划。\n\
    \n当组织踏上营销分析之旅时，他们必须首先评估自己是否已做好准备。这条路不仅仅是向组织菜单中添加另一个单独流程。相反，为了使分析能够带来其有能力实现的变化和改进，组织必须将分析融入到其运营体系的每个环节。因此，准备实施营销分析流程时要做的第一件事，就是看看组织是否准备好踏上这段旅程。最初需要评估的领域是组织的领导力和文化。\n\
    \n营销分析的成功是若干特征的产物，其中首要的是文化，而文化又是领导力的体现。如果你正试图开启这段旅程，你的组织文化会让你成功吗？即使领导层在鼓励并对分析说“是”，组织文化仍可能构成障碍。表\
    \ 5-1 对比了与营销分析成功相关的不同文化。\n\n**表 5-1.**  \n阻碍和促进营销分析成功的文化\n\n| 作为障碍的文化 | 作为催化剂的文化\
    \ |\n| --- | --- |\n| 处理紧急事务（被动应对） | 处理重要事务（主动作为） |\n| 惩罚错误 | 从错误中学习 |\n| 相信直觉\
    \ | 信任数据 |\n| 政治化环境 | 透明化环境 |\n\n对于许多公司举措来说，文化是成败的关键。健康的文化是营销分析的温室；功能失调的文化则是荒芜的沙漠。表\
    \ 5-1 中的属性代表了支持营销分析的文化与领导力准备度范围的两端。你应该评估贵公司在这个文化频谱上的位置，以免分析计划因敌对的文化环境而萎缩消亡。\n\n\
    那些文化属性部分或全部位于“障碍”一列的组织必须明白，可能并不存在营销分析成功的环境。对这些群体来说，具有讽刺意味的是，他们功能失调的文化恰恰表明迫切需要营销分析能够帮助带来的变革。然而，他们的文化对于营销分析流程及其所带来的责任制来说，却是一个充满敌意的环境。\n\
    \n在这样的组织中，营销分析如何才能成功？文化必须改变，向表 5-1 中“催化剂”一列所列的属性靠拢。然而，这种改变并不容易。文化变革通常需要现有领导层做出改变，采纳和践行新的态度，或者需要新的领导层取代现有领导层。无论哪种方式，文化变革都不会很快发生，而且很少是毫无痛苦的。尽管如此，营销领导者应该在这样的组织中充当变革的推动者，倡导文化演进（而非革命），这将带来远超为营销分析打开大门的益处。\n"
- fmt: "# Does Marketing Analytics Have a Chance in a Resistant Culture?\n\nDoes marketing\
    \ analytics have any chance for success in organizations where the culture is\
    \ a barrier? In fact, it does. Cultural evolution and marketing analytics can\
    \ occur in parallel. Although the cultures in these organizations may not support\
    \ a formal marketing analytics initiative, it can often get started in “stealth”\
    \ mode. Without fanfare or even official sanction, it’s possible to start small,\
    \ have some success, and then carefully expand the scope of marketing analytics.\
    \ The idea is simple: create some success, and it becomes very hard for the organization\
    \ to deny the value of the effort. A series of small, real marketing analytics\
    \ successes can help propel cultural change.\n\nOrganizations with some or all\
    \ of catalyst cultural attributes can proceed with the confidence of knowing that\
    \ their environment is ideal for a marketing analytics initiative.\n\n## Skills:\
    \ The Second Area to Assess\n\nSkills represent the second area to assess. There\
    \ are four critical skill sets necessary for success with marketing analytics:\
    \ analytical ability, technical ability, insight or understanding, and communications.\
    \ It is rare to find single individuals with each of these four key skills in\
    \ abundance, but all of these skills must be present in the organization that\
    \ wishes to pursue marketing analytics.\n\n> **Note**  \n> The four critical skill\
    \ areas for marketing analytics are analytical ability, technical ability, insight\
    \ or understanding, and communications.\n\n### Analytical Ability\n\nThe first\
    \ skill requirement is perhaps the most obvious: analytical ability. This ability\
    \ really represents a hunger to investigate the data to learn what it can reveal\
    \ and the statistical and mathematical skills to build and work with data sets\
    \ and models. Someone who is analytical by nature can learn the mathematical and\
    \ modeling skills. However, someone who has no taste for analytical work will\
    \ struggle with it, even if they learn the skills.\n\nWhat kind of analytical\
    \ capability must a person or organization have to succeed in marketing analytics?\
    \ Initially, the requirements aren’t very rigorous. Organizations just getting\
    \ started with marketing analytics will find that tracking and analyzing basic\
    \ metrics doesn’t require advanced analytical skills. It’s more simply a matter\
    \ of having the discipline to do the work, which can amount to little more than\
    \ reviewing the data. In the early going, much of the analytics work is as simple\
    \ as capturing the data, reviewing it, and determining what to do as a result.\n\
    \nAs the organization’s marketing analytics maturity grows, so will its proficiency.\
    \ The progression and maturation of the marketing analytics process will lead\
    \ to the need to use basic, applied statistical techniques to examine not just\
    \ individual metrics but the relationship between some of them. Techniques like\
    \ cross-tabulation and correlation analysis can provide a deeper understanding\
    \ of the analytics data, helping explain how a change somewhere in one part of\
    \ the marketing ecosystem might ripple through to affect an outcome in another\
    \ part. Experience with statistical tools like `SAS` or `SPSS` can help the analyst\
    \ perform this deeper analysis.\n\nDeveloping a deep understanding of customer\
    \ behavior has long been the Holy Grail of marketing and a marketing application\
    \ of Big Data analytics. Gaining valuable insights about customers and their behavior\
    \ requires marketers to exploit a wide variety and high volume of customer transaction\
    \ data that is both structured and unstructured. Advanced mathematical and analytical\
    \ skills are required to build the data sets and models associated with Big Data\
    \ and predictive analytics. [Chapter 10](../Text/A978-1-4842-0259-3_10_Chapter.html)\
    \ will cover Big Data in greater detail. The insights available through Big Data\
    \ and predictive analytics are game-changing for many companies. The advanced\
    \ skills necessary to do this type of analytics work represents the most mature\
    \ end of the marketing analytics spectrum, one that takes some time and experience\
    \ to reach.\n\n### Technical Ability\n\nThe second skill requirement area is technical\
    \ ability: proficiency retrieving data and using analysis tools on it. This could\
    \ be considered an IT skill set. The data a marketing analytics process uses as\
    \ input is usually found in various systems throughout an enterprise. There isn’t\
    \ a “system of record” for marketing analytics that houses all the data the process\
    \ might need. Marketers will need technical skills to retrieve the data from the\
    \ places where it is stored, and the technical requirements to do this range from\
    \ very simple to complex.\n\nSome data is retrieved through easily structured\
    \ queries into systems that house it, using a simple graphical interface to get\
    \ the job done. Other systems require database programming skills, such as the\
    \ use of Structured Query Language (`SQL`) to retrieve what is needed out of databases\
    \ where it is stored. As the marketing analytics process matures, it is highly\
    \ likely that data from several sources will need to be combined into a single\
    \ database to analyze it, draw important insights from it, and report results.\
    \ Doing this often requires the use of a business intelligence tool. Part of the\
    \ marketing analytics readiness assessment must therefore consider if marketing\
    \ has access to the technical skills required to support the process.\n\nThe analytical\
    \ and technical skills are often found in the same person; even when they’re not,\
    \ someone who is strong in one of these skills is predisposed to learning the\
    \ other one. This skill combination, however, is often not found on the marketing\
    \ team, and this must change, not just for the sake of analytics but for all marketing\
    \ work, which is increasingly technology-based or -driven. As Scott Brinker, author\
    \ of the Chiefmartec.com blog puts it, “You must be the driver of marketing technology,\
    \ not merely a concerned passenger.”[²](#A978-1-4842-0259-3_5_Chapter.html#Fn2)\n\
    \n### Insight or Understanding\n\nThe third skill requirement to assess is the\
    \ ability to understand what the marketing analytics mean and what to do about\
    \ it. Perhaps the best way to describe this is as insight. The analytical and\
    \ technical skills will yield a result as an output of the process, but without\
    \ the capability to draw insights from these results, the marketing analytics\
    \ process will disappoint. The skill of drawing insights out of the analysis is\
    \ often the result of experience, inquisitiveness, outside-the-box thinking, and\
    \ the ability to see the big picture. Someone who is good at making the complex\
    \ seem simple and who can see the inferences in the results will often have this\
    \ skill.\n\nThis skill area is difficult to describe and even more difficult to\
    \ measure. What kind of people have these skills? They are generally those who\
    \ have the capacity to process a lot of input, view it objectively, draw inferences\
    \ from it, and see what isn’t obvious. They have excellent critical thinking skills\
    \ and are not prone to jumping to conclusions. People who have this kind of insight\
    \ are able to look beyond the numbers and discern what the numbers mean. Their\
    \ ability to understand the implications of the marketing analytics process output\
    \ is crucial to the effort. Some may argue that what is described here isn’t a\
    \ skill at all but an inborn talent. Whatever it is, having this capability is\
    \ important to the success of a marketing analytics effort.\n\n### Communications\n\
    \nCommunications are the fourth and final skill area to assess. Marketing can\
    \ build amazingly accurate mathematical models of their work, perform detailed\
    \ analysis of its marketing analytics data, and draw insightful conclusions about\
    \ the implications of it all, but get no benefit from it if the results aren’t\
    \ communicated well. The communication that must occur goes far beyond simply\
    \ distributing reports. What is needed is a communicator who can speak with authority\
    \ and conviction about the insights gained through the marketing analytics process."
