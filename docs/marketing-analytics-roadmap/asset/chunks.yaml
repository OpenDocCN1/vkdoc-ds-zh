- fmt: "For some organizations, ROI is quite possibly the most important metric for\
    \ their marketing analytics process. For others, it’s neither a fit nor a requirement.\
    \ It’s never safe to assume that ROI is a must-have metric or key performance\
    \ indicator for everyone. To assume that it is puts the cart before the horse.\
    \ What is more important than achieving objectives? As discussed in [Chapter 4](../Text/A978-1-4842-0259-3_4_Chapter.html),\
    \ part of the analytics process is to understand the business objectives, execute\
    \ a marketing strategy that helps achieve them, and select metrics that provide\
    \ indicators of success in that endeavor. Isn’t it possible that marketing can\
    \ achieve its objectives without using ROI as one of its metrics? The honest answer\
    \ is “yes.” It’s not always a requirement to have ROI in the metrics portfolio\
    \ to guide marketing in its work, but the rest of the organization may not see\
    \ it this way.\n\nMarketers have to keep the proper perspective about ROI. It\
    \ should never become the tail that wags the dog. At the same time, marketers\
    \ can’t be cavalier about ROI, because there are times when the ability to demonstrate\
    \ a return keeps the marketing function intact. One of those times is when management\
    \ hands the marketing department a mandate to slash its spending. The marketing\
    \ department that can show the kind of return it consistently delivers has the\
    \ ability to defend its spending, perhaps even expand it if it truly functions\
    \ as a revenue center.\n\nWhen troubled economic times hit a company, CEOs and\
    \ CFOs are often compelled to cut expenses. Most experienced marketers know that\
    \ frequently the first place the executives look to cut costs is in the marketing\
    \ department. However unfair the characterization, many in the organization, including\
    \ the CEO, assume that marketing harbors waste and excess. When the ROI isn’t\
    \ measured and reported, marketing is a victim of this characterization. Measuring\
    \ ROI, therefore, can provide marketing with a shield to help deflect attempts\
    \ to gut marketing during rounds of budget cuts.\n\nSo how should marketers feel\
    \ about reporting the ROI of their work, and what stance should they take on this\
    \ matter, which is a source of some interdepartmental friction in many firms?\
    \ The primary pursuit of marketing isn’t producing a return, it is helping the\
    \ business achieve its objectives. Although there is almost always a return associated\
    \ with doing that, when marketing organizations start to obsess about ROI, they\
    \ can lose their focus. As Gordon Wyner, executive vice president at Millward\
    \ Brown says, “Linking marketing to financial performance is not now—nor has it\
    \ ever really been—solely about return on investment (ROI). Quantifying the return\
    \ achieved by marketing activities is a necessary step in the process of connecting\
    \ marketing to finance, but is not, in itself, sufficient for understanding how\
    \ marketing helps to achieve business objectives or how its contribution can be\
    \ improved.”[⁵](#A978-1-4842-0259-3_6_Chapter.html#Fn5)\n\nMarketing’s focus should\
    \ remain firmly fixed on achieving business objectives. When marketing properly\
    \ derives its own objectives from the business objectives and measures progress\
    \ toward achieving them with relevant metrics, it’s not always necessary to force\
    \ ROI into the metrics portfolio. Sometimes, it will make great sense to include\
    \ ROI as a metric. Other times, using ROI as a metric won’t really help marketing\
    \ execute its plan more effectively. One of the greatest shortcomings of ROI as\
    \ a metric is it’s inability to diagnose the root cause of low ROI. In this sense,\
    \ it’s a bit like a “check engine” light on the marketing vehicle dashboard that\
    \ only tells you there’s a problem somewhere, but without telling you where. For\
    \ this reason, knowing the ROI of marketing doesn’t directly help marketers improve\
    \ their effectiveness.\n\nAt the same time, marketers have to remain politically\
    \ astute. There are situations, economic times and company cultural influences\
    \ that make reporting ROI a necessity. If ROI is the yardstick that the CEO and\
    \ CFO use to measure departmental contribution and determine funding, then marketing\
    \ must participate. This is particularly true in firms that have organizational\
    \ silos, where one department or silo views another department as competition\
    \ for resources. In such environments, ROI may be used as a lever to gain an advantage\
    \ over another department in negotiations for resources and favor.\n\nIn truth,\
    \ there’s a healthy level of competition that should exist between departments\
    \ within companies because it spawns innovation and efficiency. In companies with\
    \ strong, healthy cultures, this kind of rivalry benefits everyone. In companies\
    \ with dysfunctional or unhealthy cultures—particularly where that dysfunction\
    \ manifests itself as organizational silos—the ROI metric can become a weapon,\
    \ not just to advance one department’s agenda but to harm another.\n\nSo is ROI\
    \ the ultimate metric for marketing? It really isn’t, but that doesn’t mean marketers\
    \ can ignore ROI. Marketers should use ROI in their metrics portfolio when it\
    \ helps them measure real progress toward objectives or when it serves as a tool\
    \ that helps manage the journey. Anything that marketing does to generate revenue,\
    \ such as demand generation and lead generation campaigns, should probably have\
    \ the ROI metric attached to it. If marketing is able to track the revenue they\
    \ help create, then the ROI calculation is just a step away.\n\n> **Note**  \n\
    > Marketers should use ROI in their metrics portfolio when it helps them measure\
    \ real progress toward objectives or when it serves as a tool that helps manage\
    \ the journey.\n\nMarketing will also find that reporting ROI is useful when it’s\
    \ necessary to position the value that marketing creates for the organization.\
    \ Reporting ROI provides proof that marketing is not an expense but a revenue\
    \ center. The need to report ROI can also arise as a result of internal, political\
    \ pressures, such as when marketing’s budget or existence is threatened, or simply\
    \ because it is the best way to justify marketing spending. The case for measuring\
    \ the ROI of marketing will vary from one organization to another, so each one\
    \ must determine what makes sense and not assume that it’s always the right or\
    \ wrong thing to do."
  raw: 'For some organizations, ROI is quite possibly the most important metric for
    their marketing analytics process. For others, it’s neither a fit nor a ­requirement.
    It’s never safe to assume that ROI is a must-have metric or key performance indicator
    for everyone. To assume that it is puts the cart before the horse. What is more
    important than achieving objectives? As discussed in [Chapter 4](../Text/A978-1-4842-0259-3_4_Chapter.html),
    part of the analytics process is to understand the business objectives, execute
    a marketing strategy that helps achieve them, and select metrics that provide
    indicators of success in that endeavor. Isn’t it possible that marketing can achieve
    its objectives without using ROI as one of its metrics? The honest answer is “yes.”
    It’s not always a requirement to have ROI in the metrics portfolio to guide marketing
    in its work, but the rest of the organization may not see it this way.


    Marketers have to keep the proper perspective about ROI. It should never become
    the tail that wags the dog. At the same time, marketers can’t be cavalier about
    ROI, because there are times when the ability to demonstrate a return keeps the
    marketing function intact. One of those times is when management hands the marketing
    department a mandate to slash its spending. The marketing department that can
    show the kind of return it consistently delivers has the ability to defend its
    spending, perhaps even expand it if it truly functions as a revenue center.


    When troubled economic times hit a company, CEOs and CFOs are often compelled
    to cut expenses. Most experienced marketers know that frequently the first place
    the executives look to cut costs is in the marketing department. However unfair
    the characterization, many in the organization, including the CEO, assume that
    marketing harbors waste and excess. When the ROI isn’t measured and reported,
    marketing is a victim of this characterization. Measuring ROI, therefore, can
    provide marketing with a shield to help deflect attempts to gut marketing during
    rounds of budget cuts.


    So how should marketers feel about reporting the ROI of their work, and what stance
    should they take on this matter, which is a source of some interdepartmental friction
    in many firms? The primary pursuit of marketing isn’t producing a return, it is
    helping the business achieve its objectives. Although there is almost always a
    return associated with doing that, when marketing organizations start to obsess
    about ROI, they can lose their focus. As Gordon Wyner, executive vice president
    at Millward Brown says, “Linking marketing to financial performance is not now—nor
    has it ever really been—solely about return on investment (ROI). Quantifying the
    return achieved by marketing activities is a necessary step in the process of
    connecting marketing to finance, but is not, in itself, sufficient for understanding
    how marketing helps to achieve business objectives or how its contribution can
    be improved.”[⁵](#A978-1-4842-0259-3_6_Chapter.html#Fn5)


    Marketing’s focus should remain firmly fixed on achieving business ­objectives.
    When marketing properly derives its own objectives from the business ­objectives
    and measures progress toward achieving them with relevant metrics, it’s not always
    necessary to force ROI into the metrics portfolio. Sometimes, it will make great
    sense to include ROI as a metric. Other times, using ROI as a metric won’t really
    help marketing execute its plan more effectively. One of the greatest shortcomings
    of ROI as a metric is it’s inability to diagnose the root cause of low ROI. In
    this sense, it’s a bit like a “check engine” light on the marketing vehicle dashboard
    that only tells you there’s a problem somewhere, but without telling you where.
    For this reason, knowing the ROI of marketing doesn’t directly help marketers
    improve their effectiveness.


    At the same time, marketers have to remain politically astute. There are ­situations,
    economic times and company cultural influences that make ­reporting ROI a necessity.
    If ROI is the yardstick that the CEO and CFO use to measure departmental contribution
    and determine funding, then ­marketing must participate. This is particularly
    true in firms that have organizational silos, where one department or silo views
    another department as ­competition for resources. In such environments, ROI may
    be used as a lever to gain an advantage over another department in negotiations
    for resources and favor.


    In truth, there’s a healthy level of competition that should exist between departments
    within companies because it spawns innovation and efficiency. In companies with
    strong, healthy cultures, this kind of rivalry benefits everyone. In companies
    with dysfunctional or unhealthy cultures—particularly where that dysfunction manifests
    itself as organizational silos—the ROI metric can become a weapon, not just to
    advance one department’s agenda but to harm another.


    So is ROI the ultimate metric for marketing? It really isn’t, but that doesn’t
    mean marketers can ignore ROI. Marketers should use ROI in their metrics portfolio
    when it helps them measure real progress toward objectives or when it serves as
    a tool that helps manage the journey. Anything that marketing does to generate
    revenue, such as demand generation and lead generation campaigns, should probably
    have the ROI metric attached to it. If marketing is able to track the revenue
    they help create, then the ROI calculation is just a step away.


    Note


    Marketers should use ROI in their metrics portfolio when it helps them measure
    real progress toward objectives or when it serves as a tool that helps manage
    the journey.


    Marketing will also find that reporting ROI is useful when it’s necessary to position
    the value that marketing creates for the organization. Reporting ROI provides
    proof that marketing is not an expense but a revenue center. The need to report
    ROI can also arise as a result of internal, political pressures, such as when
    marketing’s budget or existence is threatened, or simply because it is the best
    way to justify marketing spending. The case for measuring the ROI of marketing
    will vary from one organization to another, so each one must determine what makes
    sense and not assume that it’s always the right or wrong thing to do.'
  trans: "\n对于某些组织而言，ROI（投资回报率）很可能是其营销分析过程中最重要的指标。但对其他组织来说，它既不适合也不是硬性要求。绝不能想当然地认为\
    \ ROI 对所有人都必须是必备指标或关键绩效指标。持有这种想法无异于本末倒置。还有什么比实现目标更重要呢？正如第 4 章所讨论的，分析过程的一部分就是理解业务目标、执行有助于实现这些目标的营销策略，并选择能够指示该努力是否成功的指标。营销活动能否在不使用\
    \ ROI 作为指标之一的情况下实现其目标？诚实的答案是“能”。在指导营销工作的指标组合中，并不总是需要包含 ROI，但组织中的其他部门可能不这么认为。\n\
    \n营销人员必须对 ROI 保持正确的视角。它绝不应成为“尾巴摇狗”的主角。同时，营销人员也不能对 ROI 掉以轻心，因为有些时候，展示回报的能力恰恰是维持营销职能完整性的关键。其中一种情况就是管理层要求营销部门削减开支。能够展示其持续带来回报的营销部门，才有能力捍卫自己的预算，甚至——如果它真正发挥创收中心的作用——或许还能扩大预算。\n\
    \n当公司遭遇经济困难时期，CEO 和 CFO 往往被迫削减开支。大多数经验丰富的营销人员都知道，高管们寻找削减成本的首要目标通常是营销部门。无论这种刻板印象多么不公平，包括\
    \ CEO 在内的许多组织成员都认为营销部门存在浪费和过度开支。当 ROI 未被衡量和报告时，营销部门就会成为这种刻板印象的受害者。因此，衡量 ROI 可以为营销部门提供一面盾牌，有助于抵御在几轮预算削减中试图大幅削弱营销部门的企图。\n\
    \n那么，营销人员应如何看待报告其工作的 ROI？在这种在许多公司内部引发部门间摩擦的问题上，他们应该采取什么立场？营销的主要追求并非创造回报，而是帮助企业实现其目标。尽管这样做几乎总会伴随着某种回报，但当营销组织开始过分痴迷于\
    \ ROI 时，他们可能会失去焦点。正如 Millward Brown 公司执行副总裁戈登·怀纳所言：“将营销与财务绩效联系起来，现在不是——实际上也从来不仅仅是——关于投资回报率（ROI）。量化营销活动所实现的回报，是连接营销与财务流程中的一个必要步骤，但其本身并不足以理解营销如何帮助实现业务目标，或如何改进其贡献。”⁵\n\
    \n营销的核心焦点应始终坚定地放在实现业务目标上。当营销部门恰当地从业务目标中推导出自身目标，并用相关指标衡量实现目标的进展时，并不总是需要强行将 ROI\
    \ 纳入指标组合。有时，将 ROI 作为一项指标意义重大。而在其他时候，使用 ROI 作为指标并不能真正帮助营销部门更有效地执行其计划。ROI 作为指标的最大缺陷之一，是它无法诊断出\
    \ ROI 低的根本原因。从这个意义上说，它有点像营销车辆仪表板上的“检查发动机”灯，只能告诉你某个地方出了问题，却无法指出问题所在。因此，了解营销的 ROI\
    \ 并不能直接帮助营销人员提高其有效性。\n\n与此同时，营销人员必须保持政治上的敏锐。在某些情况下，经济形势和公司文化的影响使得报告 ROI 成为必需。如果\
    \ ROI 是 CEO 和 CFO 用来衡量部门贡献并决定资金分配的标尺，那么营销部门必须参与其中。这在存在组织孤立的公司尤其如此，即一个部门或孤立单位将另一个部门视为资源竞争者。在这种环境中，ROI\
    \ 可能被用作杠杆，以便在资源争夺和争取青睐的谈判中获取对另一个部门的优势。\n\n事实上，公司内部各部门之间应该存在一种健康的竞争水平，因为它能催生创新和效率。在拥有强大、健康文化的公司里，这种竞争对每个人都有利。而在存在功能失调或不健康文化的公司——特别是当这种失调表现为组织孤岛时——ROI\
    \ 指标就可能变成一种武器，不仅用于推进本部门的议程，还可能用于损害其他部门。\n\n那么，ROI 是营销的终极指标吗？并非如此，但这并不意味着营销人员可以忽视\
    \ ROI。当 ROI 有助于衡量实现目标的实际进展，或作为管理整个过程的有效工具时，营销人员应在指标组合中使用它。营销部门为创造收入所做的任何事情，例如需求生成和潜在客户开发活动，都可能需要附带\
    \ ROI 指标。如果营销部门能够追踪其帮助创造的收入，那么 ROI 的计算就仅一步之遥。\n\n> **注意**  \n> 当 ROI 有助于衡量实现目标的实际进展，或作为管理整个过程的有效工具时，营销人员应在指标组合中使用它。\n\
    \n营销部门还会发现，在需要定位营销为组织创造的价值时，报告 ROI 也很有用。报告 ROI 可以证明营销不是一个成本中心，而是一个创收中心。报告 ROI\
    \ 的需求也可能源于内部的政治压力，例如当营销部门的预算或生存受到威胁时，或者仅仅因为这是证明营销支出合理的最佳方式。衡量营销 ROI 的必要性因组织而异，因此每个组织都必须确定什么是有意义的，而不能想当然地认为它始终是正确或错误的事情。"
- fmt: "# ROI Measurement Challenges\n\n> We tend to overvalue the things we can measure\
    \ and undervalue the things we cannot. —John Hayes, CMO, American Express\n\n\
    Even when there is complete agreement within the organization about the need for\
    \ understanding the ROI of marketing, it isn’t easy to do. `Teradata`, a provider\
    \ of big data analytics solutions and integrated marketing applications reports\
    \ that 75 percent of marketers who attempt to calculate ROI report some kind of\
    \ problem or challenge in doing so. Even when the will to report marketing’s ROI\
    \ is present, significant challenges stand in the way.\n\nOne of the challenges\
    \ of measuring the ROI of marketing is determining the scope or level at which\
    \ to capture data and report ROI. Should marketing report the ROI of the entire\
    \ marketing function, providing a single metric that represents the macro-view?\
    \ Or should marketing take a micro-view of ROI and report it for certain aspects\
    \ of its work, such as demand generation? What about developing an ROI-based business\
    \ case for some of the investments marketing wishes to make, such as acquiring\
    \ important technology or executing a campaign? Determining the scope of marketing\
    \ ROI measurement efforts is one of the first challenges the marketer will face.\n\
    \nWhy not report the ROI for the entire marketing function? Why not just determine\
    \ the return percentage for everything that marketing does? Conceptually, it’s\
    \ a brilliant idea, but practically, it is difficult. The grander the scale on\
    \ which metrics are reported can sometimes make those metrics less meaningful.\
    \ A single ROI measurement is likely to underrepresent marketing’s true value\
    \ in some areas and overrepresent it in others. The caution here is much the same\
    \ as it is for using averages. As an old statistician’s saying goes, if your feet\
    \ are freezing and your head is in an oven, on average, you’re comfortable. Broad\
    \ or high-level measures, therefore, aren’t always that helpful and at times are\
    \ unintentionally deceptive.\n\nUnderstanding the impact on revenue for each thing\
    \ that marketing does—and capturing the data for these things—is still an impossible\
    \ task even in today’s digital marketing era. For those things marketing does\
    \ that have a direct relationship to revenue, such as a digital campaign, measurement\
    \ is pretty easy. Marketers can link specific revenue transactions to the campaign,\
    \ enabling precise calculation of ROI. If all that marketing did was execute easily\
    \ measured campaigns, then determining the ROI for the marketing function as a\
    \ whole is pretty straightforward.\n\nObviously most marketing functions don’t\
    \ just run digital campaigns. They provide a broad scope of services to their\
    \ organizations, many of which defy revenue impact measurement. For example, how\
    \ does marketing calculate the revenue impact of promotional items given away\
    \ at events? How does the keynote address an executive gave at a conference influence\
    \ revenue? What about the impact of advertising and other brand awareness activities?\
    \ Everyone can agree that these things have influence and value. But it is difficult,\
    \ for example, to connect the awareness created by the local sports team sponsorship\
    \ to the subsequent actions of interested fans who later click on a banner ad\
    \ because they recognized the sponsor’s brand. These challenges of attribution,\
    \ which Chapter 10 explores more fully, make precise calculation of marketing’s\
    \ ROI difficult.\n\nIf marketing takes only the measurable aspects of its work\
    \ and determines their ROI, and then somehow extrapolates that ROI across the\
    \ entire marketing function, the resulting ROI percentage is almost surely too\
    \ low, accounting for some of marketing’s revenue-generating activity but not\
    \ all of it. This approach ends up diluting the ROI calculation for all of marketing\
    \ by including all marketing costs in the calculation but only the directly attributable\
    \ revenue. It does not present a true ROI picture.\n\nSome might argue that the\
    \ flaws with the ROI calculation approach just described don’t matter if the resulting\
    \ ROI meets minimum requirements. Perhaps they are right much of the time. But\
    \ this approach to calculating ROI is still an estimate and therefore is at risk\
    \ of acceptance internally. If the stakeholders inside the company know that the\
    \ marketing ROI estimate is just that—an estimate—marketing may not see that ROI\
    \ estimate enjoy full internal support. Even if it is a conservative estimate,\
    \ marketing should expect some resistance to attempts to use ROI derived this\
    \ way to justify marketing investments.\n\nIt would be ideal if it were possible\
    \ to calculate the ROI of the whole, complete marketing function. The reality\
    \ for most marketing organizations is that the data just isn’t there or the cost\
    \ to obtain the data to enable this calculation with some degree of precision\
    \ is simply too high or too difficult. For this reason, knowing marketing’s ROI\
    \ at this level has to come with a disclaimer. Marketing must continually educate\
    \ the rest of the organization on how it creates value and why all of that value\
    \ isn’t measurable. It’s not wrong to try to report the ROI of the entire marketing\
    \ function, but that ROI information needs to come with an explanation.\n\n> **Note**\
    \  \n> Marketing must continually educate the entire organization on how it creates\
    \ value and why the ROI metric doesn’t measure all of that value.\n\nWhat’s much\
    \ easier is to look at some of the individual components of marketing. With the\
    \ proper data tracking, it’s not difficult to determine the ROI of a pay-per-click\
    \ campaign, or exhibiting at a trade show, or just about anything marketing does\
    \ to generate, qualify or nurture leads. There’s value in knowing the ROI from\
    \ these activities, particularly for comparing one campaign to a like campaign.\
    \ But even this approach has its flaws, and the main one is this: measuring the\
    \ ROI of a single marketing channel ignores the true, multichannel nature of modern\
    \ marketing. Marketers use a plethora of channels to do their work. Ascribing\
    \ all the credit for a conversion as a customer goes through the buying cycle\
    \ to just one channel completely ignores all the other channels that influenced\
    \ that conversion. So calculating the ROI for individual marketing components\
    \ or channels isn’t ideal either.\n\nOther challenges exist for the determination\
    \ of marketing ROI beyond just the scope and granularity of doing so, such as\
    \ the data challenge. This challenge is multifaceted, representing the skills,\
    \ alignment, organizational issues, and even cultural issues surrounding the access\
    \ to or integration of data needed to determine ROI. In fact, the `Teradata` Data-Driven\
    \ Marketing Survey reveals that marketers’ number one barrier to ROI calculation\
    \ is lack of data integration.\n\nPart of marketing’s challenge with data is ownership:\
    \ many marketing organizations don’t control their data destiny, because they\
    \ don’t have primary responsibility for their own data. In fact, less than one-third\
    \ of marketers claim to own or control customer data, and over half indicate that\
    \ they rely on the IT department to gain access to their data. If marketing doesn’t\
    \ have unfettered access to its data in real time, it will hinder any kind of\
    \ analytics process, let alone the calculation of ROI.\n\nThe data access challenge\
    \ is frequently made worse by an old nemesis: organizational silos. When these\
    \ exist, the interdepartmental cooperation needed to share data and information\
    \ for any reason, not just ROI determination, becomes an unproductive diplomatic\
    \ exercise. Suspicion abounds and turf battles are waged over data, information,\
    \ and who controls it. Attempting to gain access to the data marketing needs for\
    \ ROI calculation may require the expenditure of more political capital than marketing\
    \ has or is willing to spend."
  raw: '## ROI Measurement Challenges


    > We tend to overvalue the things we can measure and undervalue the things we
    cannot. —John Hayes, CMO, American Express


    Even when there is complete agreement within the organization about the need for
    understanding the ROI of marketing, it isn’t easy to do. Teradata, a provider
    of big data analytics solutions and integrated marketing applications reports
    that 75 percent of marketers who attempt to calculate ROI report some kind of
    problem or challenge in doing so.[⁶](#A978-1-4842-0259-3_6_Chapter.html#Fn6) Even
    when the will to report marketing’s ROI is present, significant challenges stand
    in the way.


    One of the challenges of measuring the ROI of marketing is determining the scope
    or level at which to capture data and report ROI. Should marketing report the
    ROI of the entire marketing function, providing a single metric that represents
    the macro-view? Or should marketing take a micro-view of ROI and report it for
    certain aspects of its work, such as demand generation? What about developing
    an ROI-based business case for some of the investments marketing wishes to make,
    such as acquiring important technology or executing a campaign? Determining the
    scope of marketing ROI measurement efforts is one of the first challenges the
    marketer will face.


    Why not report the ROI for the entire marketing function? Why not just determine
    the return percentage for everything that marketing does? Conceptually, it’s a
    brilliant idea, but practically, it is difficult. The grander the scale on which
    metrics are reported can sometimes make those metrics less meaningful. A single
    ROI measurement is likely to underrepresent marketing’s true value in some areas
    and overrepresent it in others. The caution here is much the same as it is for
    using averages. As an old statistician’s saying goes, if your feet are freezing
    and your head is in an oven, on average, you’re comfortable. Broad or high-level
    measures, therefore, aren’t always that helpful and at times are unintentionally
    deceptive.


    Understanding the impact on revenue for each thing that marketing does—and capturing
    the data for these things—is still an impossible task even in today’s digital
    marketing era. For those things marketing does that have a direct relationship
    to revenue, such as a digital campaign, measurement is pretty easy. Marketers
    can link specific revenue transactions to the campaign, enabling precise calculation
    of ROI. If all that marketing did was execute easily measured campaigns, then
    determining the ROI for the marketing function as a whole is pretty straightforward.


    Obviously most marketing functions don’t just run digital campaigns. They provide
    a broad scope of services to their organizations, many of which defy revenue impact
    measurement. For example, how does marketing calculate the revenue impact of promotional
    items given away at events? How does the keynote address an executive gave at
    a conference influence revenue? What about the impact of advertising and other
    brand awareness activities? Everyone can agree that these things have influence
    and value. But it is difficult, for example, to connect the awareness created
    by the local sports team sponsorship to the subsequent actions of interested fans
    who later click on a banner ad because they recognized the sponsor’s brand. These
    challenges of attribution, which [Chapter 10](../Text/A978-1-4842-0259-3_10_Chapter.html)
    explores more fully, make precise calculation of marketing’s ROI difficult.


    If marketing takes only the measurable aspects of its work and determines their
    ROI, and then somehow extrapolates that ROI across the entire marketing function,
    the resulting ROI percentage is almost surely too low, accounting for some of
    marketing’s revenue-generating activity but not all of it. This approach ends
    up diluting the ROI calculation for all of marketing by including all marketing
    costs in the calculation but only the directly attributable revenue. It does not
    present a true ROI picture.


    Some might argue that the flaws with the ROI calculation approach just described
    don’t matter if the resulting ROI meets minimum requirements. Perhaps they are
    right much of the time. But this approach to calculating ROI is still an estimate
    and therefore is at risk of acceptance internally. If the stakeholders inside
    the company know that the marketing ROI estimate is just that—an estimate—marketing
    may not see that ROI estimate enjoy full internal support. Even if it is a conservative
    estimate, marketing should expect some resistance to attempts to use ROI derived
    this way to justify marketing investments.


    It would be ideal if it were possible to calculate the ROI of the whole, ­complete
    marketing function. The reality for most marketing organizations is that the data
    just isn’t there or the cost to obtain the data to enable this calculation with
    some degree of precision is simply too high or too difficult. For this reason,
    knowing marketing’s ROI at this level has to come with a disclaimer. Marketing
    must continually educate the rest of the organization on how it creates value
    and why all of that value isn’t measurable. It’s not wrong to try to report the
    ROI of the entire marketing function, but that ROI information needs to come with
    an explanation.


    Note


    Marketing must continually educate the entire organization on how it creates value
    and why the ROI metric doesn’t measure all of that value.


    What’s much easier is to look at some of the individual components of ­marketing.
    With the proper data tracking, it’s not difficult to determine the ROI of a pay-per-click
    campaign, or exhibiting at a trade show, or just about anything marketing does
    to generate, qualify or nurture leads. There’s value in knowing the ROI from these
    activities, particularly for comparing one ­campaign to a like campaign. But even
    this approach has its flaws, and the main one is this: measuring the ROI of a
    single marketing channel ignores the true, ­multichannel nature of modern marketing.
    Marketers use a plethora of ­channels to do their work. Ascribing all the credit
    for a conversion as a ­customer goes through the buying cycle to just one channel
    completely ignores all the other channels that influenced that conversion. So
    calculating the ROI for individual marketing components or channels isn’t ideal
    either.


    Other challenges exist for the determination of marketing ROI beyond just the
    scope and granularity of doing so, such as the data challenge. This ­challenge
    is multifaceted, representing the skills, alignment, organizational issues, and
    even cultural issues surrounding the access to or integration of data needed to
    determine ROI. In fact, the Teradata Data-Driven Marketing Survey reveals that
    marketers’ number one barrier to ROI calculation is lack of data integration.[⁷](#A978-1-4842-0259-3_6_Chapter.html#Fn7)


    Part of marketing’s challenge with data is ownership: many marketing ­organizations
    don’t control their data destiny, because they don’t have primary responsibility
    for their own data. In fact, less than one-third of marketers claim to own or
    control customer data, and over half indicate that they rely on the IT department
    to gain access to their data.[⁸](#A978-1-4842-0259-3_6_Chapter.html#Fn8) If marketing
    doesn’t have unfettered access to its data in real time, it will hinder any kind
    of analytics process, let alone the calculation of ROI.


    The data access challenge is frequently made worse by an old nemesis: ­organizational
    silos. When these exist, the interdepartmental cooperation needed to share data
    and information for any reason, not just ROI determination, becomes an unproductive
    diplomatic exercise. Suspicion abounds and turf battles are waged over data, information,
    and who controls it. Attempting to gain access to the data marketing needs for
    ROI calculation may require the expenditure of more political capital than marketing
    has or is willing to spend.'
  trans: "\n# 投资回报率（ROI）衡量的挑战\n\n> 我们往往高估那些可衡量事物的价值，而低估那些不可衡量事物的价值。 — 约翰·海耶斯，美国运通首席营销官\n\
    \n即使组织内部对于理解营销投资回报率的必要性达成完全一致，做起来也并非易事。大数据分析解决方案与整合营销应用提供商`Teradata`报告称，75%尝试计算投资回报率的营销人员表示在过程中遇到了某种问题或挑战。即便存在报告营销\
    \ ROI 的意愿，重大的挑战依然存在。\n\n衡量营销 ROI 的挑战之一，在于确定数据采集和 ROI 报告的范畴或层级。营销部门是否应该报告整个营销职能的\
    \ ROI，提供一个代表宏观视角的单一指标？还是应该采取 ROI 的微观视角，针对其工作的特定方面（例如需求生成）进行报告？对于那些营销部门希望进行的投资（例如购置重要技术或执行某项营销活动），开发基于\
    \ ROI 的商业案例又该如何处理呢？确定营销 ROI 衡量工作的范围，是营销人员将面临的首要挑战之一。\n\n为什么不报告整个营销职能的 ROI 呢？为什么不直接确定营销所做一切事情的回报率呢？从概念上讲，这是一个绝妙的主意，但实际操作起来却很困难。指标报告的范围越宏大，有时反而会使这些指标的意义降低。单一\
    \ ROI 衡量指标很可能在某个领域低估营销的真实价值，而在另一个领域又高估它。这里的警示与使用平均值时非常相似。正如一位老统计学家所言：如果你的脚在冰水里，头在烤箱里，平均而言，你感觉很舒适。因此，宽泛或高层的衡量指标并非总是那么有用，有时还会在无意中产生误导。\n\
    \n即便在当今的数字营销时代，要理解营销每项活动对收入的影响并捕获这些数据，仍然是一项不可能完成的任务。对于营销活动中那些与收入有直接关联的部分，例如数字营销活动，衡量起来就相当容易。营销人员可以将特定的收入交易与营销活动关联起来，从而实现\
    \ ROI 的精确计算。如果营销部门所做的仅仅是执行易于衡量的营销活动，那么确定整个营销职能的 ROI 就相当直接了。\n\n显然，大多数营销职能并非只运行数字营销活动。它们为其组织提供广泛的服务，其中许多服务都难以衡量其对收入的影响。例如，营销部门如何计算在活动中赠送的促销品对收入的影响？高管在会议上发表的主题演讲如何影响收入？广告和其他品牌知名度活动的影响又如何呢？所有人都同意这些事情具有影响力和价值。但是，例如，很难将本地体育团队赞助所产生的品牌认知度，与那些因认出赞助商品牌而随后点击横幅广告的感兴趣粉丝的后续行为联系起来。这些归因挑战（第十章将更全面地探讨）使得精确计算营销\
    \ ROI 变得困难。\n\n如果营销部门只取其工作中可衡量的方面来确定其 ROI，然后以某种方式将该 ROI 推断至整个营销职能，那么由此得出的 ROI\
    \ 百分比几乎肯定过低，因为它只计入了营销部分创收活动，而非全部。这种方法最终会稀释整个营销部门的 ROI 计算，因为它在计算中包含了所有营销成本，却只纳入了可直接归因的收入。这并不能呈现真实的\
    \ ROI 图景。\n\n有些人可能会争辩说，如果计算出的 ROI 满足最低要求，那么上述 ROI 计算方法中的缺陷就无关紧要。也许在很多时候他们是正确的。但这种计算\
    \ ROI 的方法仍然是一种估算，因此在内部面临不被接受的风险。如果公司内部的利益相关者知道营销 ROI 估算仅仅是估算，那么营销部门可能无法看到该估算获得充分内部支持。即使这是一个保守的估算，营销部门也应预料到，在试图用这种方式得出的\
    \ ROI 来证明营销投资的合理性时，会遇到一些阻力。\n\n如果能够计算出整个、完整的营销职能的 ROI，那将是理想的情况。对大多数营销组织而言，现实情况是：要么数据根本不存在，要么获取数据以实现具有一定精确度计算的成本过高或过于困难。因此，在这个层面上了解营销的\
    \ ROI 必须附带免责声明。营销部门必须持续教育组织内的其他部门，让他们了解营销是如何创造价值的，以及为什么并非所有价值都可衡量。试图报告整个营销职能的\
    \ ROI 并没有错，但该 ROI 信息需要附带解释说明。\n\n> **注意**  \n> 营销部门必须持续教育整个组织，让他们了解营销是如何创造价值的，以及为什么\
    \ ROI 指标无法衡量所有这些价值。\n\n更容易的做法是审视营销的一些独立组成部分。有了恰当的数据追踪，确定一次点击付费广告活动、参加一次贸易展会或营销部门为产生、筛选或培育潜在客户所做的几乎任何事情的\
    \ ROI，都并不困难。了解这些活动的 ROI 是有价值的，尤其是在比较两次类似活动时。但这种方法也有其缺陷，主要在于：衡量单一营销渠道的 ROI 忽视了现代营销真正的多渠道特性。营销人员使用大量渠道开展工作。将客户在购买周期中完成转化的所有功劳都归因于一个渠道，完全忽视了影响该转化的所有其他渠道。因此，为独立的营销组成部分或渠道计算\
    \ ROI 也并非理想方案。\n\n除了确定 ROI 的范围和粒度之外，还存在其他挑战，例如数据挑战。这一挑战是多方面的，涉及到获取或整合确定 ROI 所需数据时面临的技能、协调、组织问题，甚至文化问题。事实上，`Teradata`数据驱动营销调查显示，营销人员计算\
    \ ROI 的首要障碍是缺乏数据整合。\n\n营销在数据方面面临的挑战部分在于所有权：许多营销组织无法掌控自己的数据命运，因为它们并不对自己拥有的数据承担主要责任。事实上，只有不到三分之一的营销人员声称拥有或控制客户数据，超过一半的营销人员表示他们依赖\
    \ IT 部门来获取数据。如果营销部门无法不受限制地实时访问其数据，这将阻碍任何类型的分析流程，更不用说计算 ROI 了。\n\n数据访问的挑战常常因一个老对手——组织孤岛——而变得更加糟糕。当存在孤岛时，为任何目的（而不仅仅是确定\
    \ ROI）共享数据和信息所需的跨部门合作，就变成了一场低效的外交斡旋。猜疑丛生，围绕数据、信息及其控制权的领地之争不断上演。试图获取营销部门计算 ROI\
    \ 所需的数据，可能需要消耗超出营销部门现有或愿意支付的政治资本。\n"
- fmt: '# 影响市场营销获取所需数据的因素


    另一个阻碍市场营销部门获取所需数据的因素是组织协调不一致。当市场营销的目标与销售目标或其他关键组织目标未能良好对齐时，不仅是在投资回报率（ROI）的确定上，在诸多其他领域也很可能存在问题。然而，具体到ROI，当销售和市场营销这两个紧密相关的职能拥有不同目标时，它们会收集不同的数据。这种协调问题带来的影响是，市场营销为了进行恰当、准确的ROI计算所需的数据可能根本不存在。


    在某些情况下，市场营销部门无法获取所需数据，是因为它已经放弃了责任，对这个问题撒手不管（可以这么说），因为这项工作需要该部门所不具备的技术技能。正如[图2-1](../Text/A978-1-4842-0259-3_2_Chapter.html#Fig1)所示，市场营销工作的轨迹无疑正朝着技术化方向发展。市场营销人员不能再维持技术上的无知，简单地将任何技术职能外包给IT部门或其他团队。即使市场营销部门不打算管理分析流程或计算其ROI，它仍然需要技术技能来完成工作。缺乏必要技术技能的市场营销部门，正将自身命运中日益增长的一部分控制权，拱手让给部门外部那些可能同情也可能不同情市场营销的人。


    销售流程的复杂性及其长度，也会给市场营销衡量ROI的努力带来挑战。在B2B环境中，长期且复杂的销售周期相当常见。在这种情况下，通常能够确定的是流程的开始时间——在收集到合格线索时，以及流程的结束时间——在达成销售时。在这两个端点之间，存在着通过多种渠道产生的众多影响因素，它们推动线索最终转化为销售。其中一些因素易于追踪，而另一些则完全未知。更长的销售周期通常会涉及更多这些影响因素。这些因素包括品牌印象和培育活动，而且很容易忽略在某个特定客户的销售周期中发生了哪些活动，或哪些活动是有效的。


    确定市场营销ROI的挑战众多。面对报告ROI的压力，首席营销官（CMO）该怎么办？答案取决于该组织在营销分析和ROI方面已经处于什么阶段。任何希望报告其ROI的营销组织都应关注该指标的精确性，因为精确性带来可信度。将ROI用作市场营销的指标或关键绩效指标（KPI）很像跑马拉松：如果你以前从未跑过，你不能第一次就系好鞋带跑完26.2英里。相反，从较短的距离开始，慢慢提升。在刚开始确定市场营销ROI时，为了避免不知所措，请遵循一条演进路径。


    *   **起步**：在衡量ROI时，不要试图“煮沸整个海洋”。先选择市场营销工作中的某些方面来确定其回报，从而让自己入门。例如，即使是刚刚起步的营销组织，也能确定付费搜索或其他数字营销活动的ROI，因为这些数据是现成的。这里有个问题：营销部门中许多“入门级”的ROI衡量领域可能与组织目标几乎或完全无关。开始时，为了学习如何衡量和使用ROI，这种不协调是可以接受的。但请确保衡量工作不要止步于此。在这个早期的学习阶段，ROI的衡量结果可能应该保留在市场营销部门内部。

    *   **扩展**：将ROI流程和指标应用于更广泛的市场营销工作。一旦在衡量和使用ROI方面获得一定熟练度，就应将其应用于重要的事项。使ROI的衡量与目标保持一致——无论是市场营销的目标还是组织的目标。正如本章所讨论的，数据的可用性或可访问性通常是实现这一点的挑战。在这个扩展阶段，你还需要开始将市场营销的ROI结果展示给部门外部人员，以此来测试文化氛围。这对市场营销来说仍然是一个学习过程，但同时也变成了一个教学体验。市场营销需要帮助组织的其他部门理解如何使用和解读其提供的ROI数据。在这个扩展阶段，市场营销不应过于雄心勃勃，试图表达其所有工作的ROI。此处的目标是在其工作中一些战略性选择的领域，为市场营销使用ROI赢得认可。

    *   **整合**：将ROI作为营销分析流程的一个组成部分，并依据常识尽可能广泛地加以应用。当ROI作为指标成为决策的关键影响因素时，它的使用就已经变得不可或缺。当组织达到这一成熟阶段时，本章讨论的所有关于使用ROI的注意事项都应适用。在适当的背景下使用ROI，即将其作为改进的指标或工具，而不是对市场营销的裁决。确保围绕ROI的计算过程具有完全的完整性：不要在计算中使用推测性数据或估计值。确保文化环境是包容的，因为在这个阶段，市场营销的ROI结果完全透明，ROI可能成为评判市场营销工作的唯一标准和裁决者（有时甚至是刽子手）。'
  raw: 'Another factor that impedes marketing’s access to needed data is organizational
    misalignment. When marketing’s goals are not well aligned with sales goals, or
    other key organizational goals, chances are quite high that problems exist in
    a number of other areas, not just in the determination of ROI. Specific to ROI,
    however, when two closely related functions such as sales and marketing have different
    goals, they will collect different data. The implication of this alignment problem
    is that the data marketing needs to do a proper, accurate ROI calculation may
    not exist.


    In some cases, marketing doesn’t have access to the data it needs because it has
    abdicated responsibility, washing its hands (so to speak) of the ­matter because
    it requires technical skills not found within the department. The ­trajectory
    of marketing’s work is unmistakably toward the technical, as Figure [2-1](../Text/A978-1-4842-0259-3_2_Chapter.html#Fig1)
    depicted. Marketers can no longer maintain technical ignorance, simply outsourcing
    any technical functions to IT or other groups. Even if marketing isn’t going to
    manage an analytics process or calculate its ROI, it still needs technical skills
    to do its work. The marketing department that doesn’t have the necessary technical
    skills is surrendering control of a growing part of its destiny to someone outside
    the department that may or may not have ­sympathy for marketing.


    The complexity of the sales process, as well as its length, can challenge marketing
    in its efforts to know its ROI. It’s quite common in the B-to-B environment to
    see long, complex sales cycles. When this is the case, what’s typically known
    with certainty is when the process began—at the point a qualified lead was collected—and
    when the process ended—when a sale was made. In between these two end points there
    are many influences through many channels that help move a lead toward an eventual
    sale. Some are easy to track, and others are simply unknown. Longer sales cycles
    generally involve more of these influences. These influences are things like brand
    impressions and nurturing activities, and it’s all too easy to lose track of which
    ones have occurred in any given customer sales cycle or which ones were effective.


    The challenges of determining the ROI of marketing are many. What is the CMO to
    do in the face of pressure to report it? The answer depends on where an organization
    already is with respect to marketing analytics and ROI. Any marketing organization
    that desires to report its ROI should focus on the precision of that metric, because
    with precision comes credibility. The use of ROI as a metric or key performance
    indicator for marketing is a lot like running a marathon: if you haven’t done
    it before, you can’t just lace up your shoes and run 26.2 miles your first time
    out. Instead, start by going shorter distances and slowly build your way up. To
    keep from getting overwhelmed when starting out with marketing ROI determination,
    follow an evolutionary path.


    *   Getting started: don’t try to “boil the ocean” when it comes to measuring
    ROI. Get your feet wet by selecting some aspects of marketing’s work for which
    to determine the return. For example, determining the ROI of paid search or other
    digital campaigns is within the ability of even those marketing organizations
    just getting started, because the data is readily available. Here’s the catch:
    many of the “starter” ROI measurement areas within marketing may have little or
    nothing to do with the organization’s goals. In the beginning, this misalignment
    is okay for the sake of learning how to measure and use ROI.  Just make sure that
    the measurement efforts don’t stay here. In this early learning stage, the ROI
    measurement results should probably stay within the marketing department.

    *   Expand: apply the ROI process and metric to a broader array of marketing’s
    work. Once some proficiency is gained at measuring and using ROI, it’s important
    to apply it to things that matter. Align the ROI measurements with goals—both
    marketing’s and the organization’s goals. As this chapter has discussed, data
    availability or accessibility is often a challenge in doing this. In this expansion
    stage, you will also test the cultural waters by beginning to expose marketing’s
    ROI results to those outside the department. This is still a learning process
    for marketing, but it also becomes a teaching experience. Marketing needs to help
    the rest of the organization understand how to use and interpret the ROI data
    marketing provides. In this expansion stage, marketing shouldn’t be too ambitious
    by trying to express the ROI of everything it’s doing. The goal here is to gain
    acceptance for ­marketing’s use of ROI in some strategically selected areas of
    its work.

    *   Integrate: Use ROI as an integral part of the marketing analytics process,
    applying it as broadly as common sense dictates. The use of ROI as a metric has
    become integral when it serves as a key influence in decision making. As the organization
    reaches this stage of maturity, all the caveats to using ROI discussed in this
    chapter should apply. Use ROI in the proper context, which is as a metric or tool
    for improvement, not a referendum on marketing. Ensure that there is complete
    integrity surrounding ROI derivation: don’t use speculative data or estimates
    in calculations. Make sure the cultural environment is accepting, as ROI can become
    the sole judge and jury (and sometimes executioner) of marketing’s work, because
    at this stage, there is full transparency of marketing’s ROI results.'
