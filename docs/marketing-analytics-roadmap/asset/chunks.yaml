- fmt: 'James Archer, founder and CEO of digital, brand, and communication design
    firm Forty, takes an even stronger position against what he calls the metric-lust
    of the marketing and advertising industry: “As technology has given our industry
    the ability to measure more things faster than ever, there’s been a steady trend
    towards having metrics serve as the basis for design and creative work, with the
    idea that this will ensure return on investment (ROI) for marketing efforts. It’s
    safe. It’s predictable. It’s simple. It’s easy to show your boss. It’s easy to
    show the client. It makes everyone look and feel good. And it’s wrong.”[⁴](#A978-1-4842-0259-3_6_Chapter.html#Fn4)
    There isn’t universal agreement even within the industry about measuring ROI.
    Some think it is imperative, others think it’s benign, and still others think
    it actually causes harm.


    Some of the things marketers do lend themselves to simple and easy data collection
    and ROI derivation. For example, any website activity generated by a marketing
    campaign is something the average marketer can use to smother the organization
    with data and credibly talk about the ROI. Attributing revenue to lead generation
    activities, a major responsibility for many marketing organizations, is reasonably
    simple. With the revenue and expenses known, determining the ROI of any digital
    campaign is usually simple arithmetic.


    Brand building and awareness, another responsibility everyone agrees is important,
    also falls to the marketing department. Brand equity is not so easily measured,
    and even if it were, its effect on revenue is hard to fully understand. To illustrate,
    imagine a group of soccer parents, because of the amazing customer experience
    you engineered for them, raving about your company or product on the sidelines
    during the kids’ match. This sentiment toward the brand is wonderful, but there’s
    just no way to capture that sentiment data easily. The organization will probably
    benefit from the advocacy, but determining its ROI just isn’t possible today,
    and if it were, there are probably all kinds of privacy considerations involved
    in doing so.


    The modern marketer still faces a dilemma when it comes to what kind of posture
    to maintain regarding ROI. Here are some of the cultural and practical realities
    of ROI measurement in the marketing department:


    * Anecdotes about marketing’s performance are inadequate substitutes for ROI data.
    When pressed, marketers are adept at pulling colorful and inspiring anecdotes
    out of their experience that help illustrate the value and effectiveness of marketing.
    This anecdotal information is often illustrative, but it’s not an acceptable substitute
    for real ROI information.

    * Anecdotal information is sometimes very useful. When valid ROI data about marketing
    is presented, anecdotes are very effective for helping create context and perspective,
    and they add color to the data.

    * When times are good, no one is giving much thought to marketing’s ROI. There
    are times in the life of most firms when everything is going right. New sales
    records are set every month, “Product of the Year” or “Best Place to Work” awards
    are won, and glowing reviews from customers and media flow in. In an environment
    such as this, not many in the firm are thinking about the ROI of marketing. Everyone
    just makes an assumption that marketing is doing a stellar job, and usually it
    is! “If it ain’t broke, don’t fix it” is the prevailing attitude. In times like
    these, marketing is given a free pass on reporting ROI, but they’re foolish to
    take it if it is offered.

    * When times are hard, the spotlight is shining on marketing, and scrutiny of
    its ROI becomes a corporate pastime. The judgmental question marketing gets from
    all corners of the firm is “What have you done for us lately?” The firm is suffering
    a revenue drought, and everyone looks to marketing to help make it rain. The difficult
    discussions and tough questions about marketing expense are inescapable, because
    through some amazing transformation, most people in the firm have become marketing
    subject matter experts. Without ROI data about marketing’s performance, everyone
    assumes the worst. Not only will marketing’s reputation suffer, but its headcount
    often does as well.


    Every firm has a unique personality and culture, and this affects how they perceive
    the return on their marketing investment. Firms with dominant finance or engineering
    cultures often don’t “get it” when it comes to the value of marketing. Their data-oriented
    cultures make it difficult to accept the intangible benefits marketing provides,
    so it gets no credit for them. Marketing equals “fluff” in these cultures, and
    getting respect, yet alone budget, is more challenging. Without ROI data to prove
    that marketing is helping generate revenue, it is difficult for marketing to help
    these companies succeed. Often when it does help, the credit goes elsewhere.


    Firms that have sales and marketing cultures are much more likely to “get it”
    when it comes to the value of marketing. Firms with these cultures place a high
    value on marketing, and they have an almost intuitive understanding that marketing
    is the oil in the sales engine—even if you can’t see it, you know it’s there doing
    its job, and the engine won’t run without it. ROI is helpful, but for these firms,
    marketing is an imperative that will exist in some form regardless of the existence
    of proven ROI.'
