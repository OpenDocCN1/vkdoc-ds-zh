    [8](#A978-1-4842-0259-3_7_Chapter.html#Fn8_source)


    “Sales & Marketing Analytics,” p. 27.


    # 8. Tools and Technologies


    Marketing Analytics Enablers


    From the beginning of the species, when humans had work to do, we usually invented
    some sort of tool to help us do it. Any time we recognize the need to complete
    a repetitive task, we almost immediately begin looking for ways to simplify that
    task by inventing tools, and we tend to refine those tools through use. Tools
    allow us to complete work faster, achieve greater precision and efficiency, or
    simplify work so it requires less skill or effort.


    Marketing analytics is certainly a discipline that benefits from the presence
    of tools; beyond that, tools enable the process. Without some basic tools and
    technology, marketers will find it very difficult to consider anything beyond
    the simplest metrics in their effort to leverage analytics to improve their outcomes.
    With tools, marketers can build and manage a sustainable analytics process, one
    that is sufficiently broad in scope and capable of considering the large volumes
    of data necessary to provide a true picture of marketing performance. Having the
    right collection of tools and technology is therefore essential to creating and
    managing an effective marketing analytics process.


    Note


    Marketing analytics is a technology-enabled process. Having the right technology
    in place and tools available is essential to success.


    In the context of marketing analytics, there are both “tools” and “technology,”
    and although these terms are often used interchangeably, it is useful to create
    a distinction to separate the must-have technology from the tools that provide
    more specialized functionality:


    *   Technology: the base platforms, systems, or clouds of technology that enable
    core marketing processes and results tracking.

    *   Tools: focused software solutions that enable specific functions, such as
    the dashboard functionality discussed in Chapter [7](../Text/A978-1-4842-0259-3_7_Chapter.html).


    This division between technology and tools is not sacred; it exists here simply
    to describe broad differences between these categories.


    As the marketing technology landscape continues to expand, with new solutions
    emerging on a continuous basis, and coalesce, with vendors acquiring each other,
    the distinction between technology and tools is blurring. Many functions that
    once were available only in separate, standalone tools are now integrated into
    the base systems that marketers use. The purpose of drawing the distinction is
    to clearly identify the technology that is essential infrastructure for marketing,
    not just analytics, from the nice-to-have tools that simplify specific analytics
    functions. The balance of this chapter examines the technology and the tools in
    greater detail, providing examples of how marketers are using them.


    ## Marketing Analytics Technology


    > The number one benefit of information technology is that it empowers people
    to do what they want to do. It lets people be creative. It lets people be productive.
    It lets people learn things they didn’t think they could learn before, and so
    in a sense it is all about potential. [¹](#A978-1-4842-0259-3_8_Chapter.html#Fn1)
    —Steve Ballmer


    As Chapter [5](../Text/A978-1-4842-0259-3_5_Chapter.html) discussed, there is
    no “system of record” for marketing. The marketing organization uses an expanding
    mix of technologies and platforms to fulfill its mission. In this mix are some
    platforms that are virtually indispensable to the marketing team, and chief among
    them is marketing automation. Demand Metric defines marketing automation as the
    strategies, processes, and software technology that enable marketing departments
    to automate, measure, and improve the performance of strategies, activities, and
    workflows.[²](#A978-1-4842-0259-3_8_Chapter.html#Fn2)


    In the not-too-distant past, marketing automation was considered a luxury and
    was found primarily in larger organizations. As is often the case when technology
    evolves, marketing automation has become more capable and affordable, and marketers
    are better educated about its benefits. As recently as mid-2013, just under 50
    percent of marketers reported using marketing automation, and in early 2015, that
    number has risen to between 61 and 70 percent (depending on the size of the enterprise),
    with larger enterprises slightly more likely to have marketing automation in place.[³](#A978-1-4842-0259-3_8_Chapter.html#Fn3)
    This marketing infrastructure has clearly hit the steep section of the technology
    adoption curve.


    Early in its life cycle, marketing automation was viewed as a productivity aid
    for marketers. It provided a better way to build campaign landing pages and send
    out email blasts, and it had some nice reporting and metrics features as well.
    Through sustained use, marketers began to understand the value of all the metrics
    data captured in an automation system, and they began to understand how to use
    it to their advantage. Now, the solution has evolved to the point where “marketing
    automation” as a solution category no longer does justice to its full range of
    capabilities. The automation dimension is still there, but it really is better
    thought of as a “marketing intelligence” platform that serves as an integration
    hub and data aggregation point for almost every other solution in the marketing
    technology stack.


    There are several implications of this high degree of integration that can exist
    between marketing automation and other solutions or tools. The implication that
    matters most to this discussion is this: marketing automation is a valuable aggregator
    and repository of data for the marketing analytics effort. This data, coupled
    with the tools for analyzing it that are built into marketing automation platforms,
    make it a cornerstone technology for marketing analytics under one big assumption:
    the platform gets fully implemented. The organizations that stop short of a complete
    implementation will not get the marketing analytics benefits available to them.
    When marketing automation is fully implemented, it provides as complete a view
    of a customer’s journey as one can obtain.


    Note


    Marketing automation is a cornerstone technology for marketing analytics because
    it aggregates and serves as a repository for data the process requires.'
  trans: "\n首席营销技术官博客，Scott Brinker，2015 年 1 月 12 日；[`http://chiefmartec.com/2015/01/marketing-technology-landscape-supergraphic-2015/`](http://chiefmartec.com/2015/01/marketing-technology-landscape-supergraphic-2015/)\
    \ 。\n\n7\n\n“销售与营销分析”，第 25 页。\n\n8\n\n“销售与营销分析”，第 27 页。\n\n# 8. 工具与技术\n\n营销分析的助力者\n\
    \n自人类起源以来，每当有工作要做，我们通常会发明某种工具来帮助我们完成。每当我们意识到需要完成一项重复性任务时，几乎立即开始寻找通过发明工具来简化任务的方法，并且在使用过程中不断改进这些工具。工具使我们能够更快地完成工作，实现更高的精度和效率，或简化工作，使其所需的技能或精力更少。\n\
    \n营销分析无疑是一门受益于工具存在的学科；不仅如此，工具还能赋能整个流程。如果没有一些基本工具和技术，营销人员会发现，在利用分析改善成果的努力中，几乎不可能考虑超出最简单指标之外的任何东西。借助工具，营销人员可以构建并管理一个可持续的分析流程，这个流程范围足够广泛，能够处理提供营销绩效真实图景所需的大量数据。因此，拥有合适的工具和技术集合对于创建和管理有效的营销分析流程至关重要。\n\
    \n> **注意**  \n> 营销分析是一个技术驱动的流程。拥有合适的技术和工具对成功至关重要。\n\n在营销分析领域，既有“工具”也有“技术”，尽管这两个术语常被互换使用，但区分开必备技术与提供更专业功能的工具是有益的：\n\
    \n*   **技术**：支持核心营销流程和结果追踪的基础平台、系统或技术云。\n*   **工具**：专注于特定功能的软件解决方案，例如第 7 章讨论的仪表盘功能。\n\
    \n这种技术与工具之间的划分并非绝对；在此只是为了描述这两类之间的广泛差异。\n\n随着营销技术格局的持续扩张（新解决方案不断涌现）和整合（供应商相互收购），技术与工具之间的界限正变得模糊。许多曾经只能在独立、单独的工具中使用的功能，现在已集成到营销人员使用的基础系统中。划分界限的目的是为了明确区分那些不仅是分析，更是营销所必需的底层基础设施技术，与那些简化特定分析功能的锦上添花的工具。本章其余部分将更详细地探讨技术与工具，并提供营销人员如何使用它们的示例。\n\
    \n## 营销分析技术\n\n> 信息技术最大的好处是它赋予人们做自己想做的事的能力。它让人们发挥创造力。它让人们提高效率。它让人们学习以前认为自己无法学会的东西，所以从某种意义上说，它关乎潜能。¹\
    \ ——史蒂夫·鲍尔默\n\n正如第 5 章所讨论的，营销并没有一个“记录系统”。营销组织使用日益多样化的技术和平台组合来完成其使命。在这个组合中，有些平台对营销团队来说几乎是不可或缺的，其中最主要的就是营销自动化。Demand\
    \ Metric 将营销自动化定义为使营销部门能够自动化、衡量并改进策略、活动和工作流程绩效的策略、流程和软件技术。²\n\n在不久之前，营销自动化还被认为是一种奢侈品，主要出现在大型组织中。随着技术的发展，营销自动化变得功能更强大、价格更实惠，营销人员对其优势也有了更深入的认识。就在\
    \ 2013 年中期，不到 50% 的营销人员报告使用了营销自动化，而到 2015 年初，这一数字已上升到 61% 到 70% 之间（取决于企业规模），大型企业使用营销自动化的可能性略高。³\
    \ 这种营销基础设施显然已进入技术采用曲线的陡峭上升阶段。\n\n在其生命周期早期，营销自动化被视为营销人员的生产力辅助工具。它提供了构建营销活动落地页面和发送批量邮件的更好方式，并具备一些不错的报告和指标功能。通过持续使用，营销人员开始理解自动化系统中捕获的所有指标数据的价值，并开始懂得如何利用这些数据为自己带来优势。如今，该解决方案已经发展到这样的程度：“营销自动化”这一解决方案类别已无法充分体现其全部能力。自动化维度仍然存在，但它实际上更适合被视作一个“营销情报”平台，作为营销技术栈中几乎所有其他解决方案的集成枢纽和数据聚合点。\n\
    \n营销自动化与其他解决方案或工具之间存在这种高度集成，具有多重含义。与本次讨论最相关的一点是：营销自动化是营销分析工作中宝贵的数据聚合器和存储库。这些数据，加上营销自动化平台内置的分析工具，使其成为营销分析的基石技术，但这基于一个重大假设：该平台被完全实施。那些未能完成全面实施的组织将无法获得可用的营销分析优势。当营销自动化被完全实施时，它能够提供尽可能全面的客户旅程视图。\n\
    \n> **注意**  \n> 营销自动化是营销分析的基石技术，因为它能聚合数据并充当该流程所需的数据存储库。\n"
- fmt: '# Understanding the Importance of Marketing Automation in Analytics


    To understand the importance of marketing automation in enabling analytics, consider
    how the buying journey typically progresses. For 81 percent of business-to-business
    buyers, that journey begins with a web search for a solution.[⁴](#A978-1-4842-0259-3_8_Chapter.html#Fn4)
    When that search leads to a vendor that uses marketing automation, data about
    the visit is captured. The subsequent interactions with that prospect are also
    captured. Should the prospect share his or her email address to gain access to
    content or register for events, the system then tracks email opens, clicks, shares,
    and other metrics. The system will track which web pages the prospect views and
    how much time was spent on each. Should the prospect register for a webinar or
    interact with the vendor through social media, all of these things are logged.


    By capturing information about every digital encounter a prospect has with a vendor,
    the marketing automation system accumulates a historical record of the prospect’s
    journey with the vendor. Companies that use marketing automation can make intelligent,
    profitable use of the detailed metrics the system solutions collect about the
    buyer’s journey. This data lets marketers understand with precision how long the
    journey takes, where it bogs down or fails, learning where to deploy content,
    offers, or other promotions to speed up the process and convert prospects to customers.
    Reflecting on this capability, one marketer with a commercial real estate technology
    company shared that they were integrating their marketing automation system with
    their customer relationship management (CRM) system to “collect more info about
    our customers and use this data to dictate the cadence of messaging and the content
    they receive from us throughout the customer life cycle.”


    UrbanBound, a relocation management software and solution provider, uses the HubSpot
    marketing automation platform. Aria Solar, inbound marketing coordinator at UrbanBound,
    shares these comments about the solution’s importance:


    > I’m not sure how anyone effectively does their job in the marketing field without
    a platform like this. HubSpot has been one of our greatest weapons, especially
    at a startup, as we’re going up against big companies with a strong and solidified
    groundwork. The data that HubSpot provides is simply unparalleled—any number you
    could possibly want to know, whether it’s website visits, page performance, blog
    hits, social media metrics, CTA clicks (and anything else you can think of), is
    all found within the portal. The easy to use interface allows you to aggregate
    all of your marketing efforts in one place, giving you numerical-proven insight
    into exactly what is and is not working. The depth that the information goes into
    in the platform is simply invaluable—it drives everything that our team does.


    Solar continues, reflecting on the shift toward analytics, metrics, and data-driven
    marketing:


    > Long gone are the days when marketing was viewed as “arts and crafts”—and this
    is largely due to platforms such as HubSpot. Marketing has shifted to a completely
    data-driven industry, powered by conversion rates, click-to-open percentages,
    SEO, keyword analytics, and submission rates. HubSpot not only allows you to see
    all of these metrics, but it guides you through the whole process with a robust
    knowledge center. HubSpot has transformed our company into a marketing powerhouse.


    Marketing automation solutions have a lot of affinity with CRM solutions, and
    they are often integrated. When they are, the marketing team has an even broader
    perspective of the buyer’s journey with the addition of data about sales interactions
    with prospects and customers. Whether implemented separately or integrated with
    CRM, marketing automation platforms are the foundation for marketing analytics.
    Marketers who want to build and sustain a marketing analytics process should prioritize
    the implementation of a marketing automation solution. Marketing automation is
    rapidly evolving into the system of record that marketing organizations have lacked.


    > **Note:** Marketing automation serves as the foundation for the marketing analytics
    process, on which marketers can build and sustain an analytics process.


    These solutions are only growing in importance and value. Today their analytics
    capabilities show what happened in the past, and this solution space is on the
    cusp of integrating predictive marketing analytics capabilities into their solutions.
    Predictive analytics, covered in greater detail in Chapter [10](../Text/A978-1-4842-0259-3_10_Chapter.html),
    will provide marketers with very accurate models that forecast future purchase
    decisions based on prospect behavior. The organizations that have mature, complete
    marketing automation implementations are poised to be the first to exploit this
    game-changing capability. Marketing automation is an essential platform for those
    who want to use analytics to become more revenue-driven and results-oriented.


    ## Marketing Analytics Tools


    > We become what we behold. We shape our tools and then our tools shape us.[⁵](#A978-1-4842-0259-3_8_Chapter.html#Fn5)
    —John M. Culkin


    Having marketing automation installed and fully implemented provides a great foundation
    for marketing analytics. As a marketing team develops proficiency with the analytics
    process, it begins to exploit the insights the process yields. When this maturing
    takes place, it often spawns a desire to expand the reach and range of the marketing
    analytics, which requires additional tools and data. The selection of specific
    tools to use is a challenge for any organization that wades into the deeper end
    of the marketing analytics pool. Of course, the type of metrics chosen for its
    analytics portfolio will drive tool selection, but there are easily hundreds of
    potential tools available. Where there was once just a handful to choices, marketers
    now have an embarrassment of riches in the analytics tools category.


    This chapter does not attempt to provide a comprehensive catalog of marketing
    analytics tools, because the offerings change so quickly and some of the information
    would be obsolete at the time of publication. Instead, the remainder of this chapter
    will describe two broad classes of marketing analytics and include examples of
    tools that exist in these categories. The goals here are to make the reader aware
    that tools exist for a wide variety of purposes and applications and encourage
    the reader to further research what these are and the latest offerings on the
    market.


    Because there are so many tools available for marketing analytics, it is easier
    to separate them into two broad categories based on high-level function, and then
    consider some example tools within each of those categories:


    - **Strategic:** tools and systems for business intelligence, customer intelligence,
    understanding buying behavior, advanced attribution, and predictive analytics.

    - **Operations and logistics:** tools and systems for managing, testing, and optimizing
    a web presence, mobile, multichannel campaign performance, demand, and geo-modeling.


    There is some overlap in the names of these two categories, as all analytics are
    strategic, and therefore by default so are the tools used to support them. However,
    even within the realm of strategic analytics, there are some that are more operationally
    oriented than others. Most marketing analytics tools fall neatly into these two
    categories, which the rest of this chapter explores.'
