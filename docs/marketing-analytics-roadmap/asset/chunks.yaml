    Marketing professionals that have had experience working in all three kinds of
    organizations almost always find the last kind the best place to work. The reason
    is because in the first two kinds, marketing is viewed as an expense, a necessary
    one perhaps, but still an expense. Should economic pressures affect companies
    that view marketing this way, the marketing functions is one of the first place
    the company makes cuts.


    By contrast, in marketing organizations that use a real analytics process, the
    value of marketing is known and understood by the entire company. Here, marketing
    is a revenue center, and its performance makes it an invaluable contributor to
    the company’s success. Marketing organizations that do not learn how to transform
    themselves from cost centers to revenue centers are transient. Their future is
    never certain; their existence is often in jeopardy. The reason marketing organizations
    should adopt a real analytics process is so they can make the transformation from
    a cost to a revenue center, and provide ongoing proof of that transformation.
    The remainder of this book discusses how to create such a marketing organization.


    Footnotes [1](#A978-1-4842-0259-3_1_Chapter.html#Fn1_source)


    “Sales & Marketing Analytics: Gauging and Optimizing Performance,” p. 7, Demand
    Metric benchmark report, December 2013.


    [2](#A978-1-4842-0259-3_1_Chapter.html#Fn2_source)


    Earnings before interest, taxes, depreciation, and amortization.


    [3](#A978-1-4842-0259-3_1_Chapter.html#Fn3_source)


    See [http://​www.​demandmetric.​com/​content/​eworkshop-learning-love-analytics](http://www.demandmetric.com/content/eworkshop-learning-love-analytics).'
