- fmt: '# Achieving Dashboard Nirvana


    > The journey of a thousand miles begins with a single step. —Lao Tzu


    Although the tool choices listed above help drive collaboration, this same research
    identified one tool choice whose use actually lowered collaboration: spreadsheets.
    This is a concern because spreadsheets are also one of the most frequently used
    marketing analytics tools. They have the advantage of ubiquity, and most marketers
    need no training on using spreadsheets. It’s relatively easy to build a spreadsheet
    using analytics data, crunch the numbers, and produce some dashboard graphs with
    a few clicks. The problems occur when it comes to sharing spreadsheet data and
    tracking various versions of them and then managing distribution. Spreadsheets
    weren’t designed as a collaboration tool. Marketers will likely always use spreadsheets
    as part of the marketing analytics process, but they should understand their limitations
    and seek to use tools that better promote collaboration and decision making around
    their analytics data.


    An earlier section of this chapter alluded to the fact that not just one but a
    series of dashboards are ideal companions for the marketing analytics process.
    As the marketing analytics process matures, it is highly probable that it will
    use a series of dashboards to present data across some very specific areas of
    focus. How many dashboards should be used? The answer is not the same for every
    marketing organization, but there is a simple model that works well: an executive-level
    dashboard that summarizes the most important metrics, and then supporting dashboards
    that provide detail in strategic areas. The goal is to make the information accessible
    and communicate it effectively, not to make dashboards dense with data. Build
    and organize marketing dashboards with this goal in mind.


    Creating the right collection of dashboards is an evolutionary process. Marketers
    shouldn’t endeavor to put every dashboard it may ultimately need in place right
    out of the starting gate. Begin with the executive-level dashboard that provides
    just the broadest view of metrics tracked as part of the analytics process. Marketing
    should customize this executive-level dashboard to match the informational needs
    of the audience for it, and as the name implies, it is usually the C-suite. Here
    is a sample configuration of data elements for the executive-level marketing dashboard:


    * Marketing program metrics: overall performance indicators such as revenue generated
    and current budget status.

    * Customer program metrics: customer acquisition costs, customer retention rate,
    customer lifetime value, Net Promoter Score, and so on.

    * Lead generation metrics: new leads by channel, cost per lead, conversion rates,
    opportunities created, and so on.

    * Website metrics: traffic sources, top pages, unique visitors, bounce rate, time
    on site, and so on.


    Perfecting the executive-level marketing dashboard is an iterative process. It
    will require some tinkering to structure the right mix of metrics to clearly and
    concisely communicate the state of marketing''s performance. Once a satisfactory
    configuration is achieved, expect future changes to accommodate a changing marketing
    landscape and strategy. It is best to understand that the executive-level marketing
    dashboard is fluid with respect to the results it needs to communicate.


    With an executive-level marketing dashboard in place, a series of supporting dashboards
    are probably in order. The marketing team should create additional dashboards
    that reflect their priorities and the need to convey information about them. There
    is no prescribed number of dashboards to have, and more dashboards are not necessarily
    better than fewer dashboards. As previously stated, dashboards are management
    and communications tools, so have enough to do these jobs well. There are, however,
    specific dashboards that are commonly found in marketing organizations. Here is
    a partial list of themes for other, more specific marketing dashboards:


    * Demand generation metrics: a dashboard for reporting on the performance of campaigns
    and metrics associated with the flow of leads from capture to qualification and
    conversion.

    * Content marketing metrics: a dashboard for tracking the content creation, publication,
    and consumption process. The content marketing dashboard should include metrics
    for volume as well as engagement, such as sharing.

    * Social media metrics: a dashboard for tracking the activity, engagement, and
    reach of social media marketing efforts across all social media networks in use.

    * Public relations metrics: a dashboard for tracking media mentions by frequency,
    source, topic, type, tone, impressions, and impact (response).

    * Events marketing metrics: a dashboard for tracking events by type, cost, participation,
    leads, and revenue generated.

    * Digital marketing metrics: a dashboard for tracking the results of digital marketing
    efforts such as impressions, landing page views, conversion rates, leads captured,
    and revenue generated.

    * Web marketing metrics: a dashboard for tracking website effectiveness through
    traffic sources, page views, unique visits, referrals, keywords, search rank,
    and other key metrics.


    Just from scanning this partial list of marketing dashboards, it''s easy to see
    some redundancies in the data they track. It''s okay, and in fact necessary, for
    these dashboards to report data that also exists on other dashboards. Each dashboard
    should present a complete summary of the marketing initiative it was designed
    to track, and this will result in the same data appearing on multiple dashboards.
    The need to do this illustrates the challenge of manually populating dashboards
    with data: you have to keep track of all the places data needs to appear and make
    sure the data is consistent. The more dashboards marketing publishes, the more
    likely it will encounter this version control challenge of manually populating
    dashboards with data.


    The marketing dashboard is an important component of the marketing analytics process.
    It is the way to give the process a voice and facilitate sharing and collaboration
    around the marketing results, which will help marketing get better at what it
    does. Once marketing has determined which metrics it needs to track and has begun
    to collect reliable data for the analytics process, it is time to start publishing
    that data in the form of a dashboard.


    ## Footnotes


    1. “Scorecards and Dashboards,” Klipfolio, [`http://www.klipfolio.com/resources/articles/what-are-dashboards-scorecards`](http://www.klipfolio.com/resources/articles/what-are-dashboards-scorecards).

    2. Stephen Few, “Common Pitfalls in Dashboard Design,” February 2006, p. 2, [`http://www.perceptualedge.com/articles/Whitepapers/Common_Pitfalls.pdf`](http://www.perceptualedge.com/articles/Whitepapers/Common_Pitfalls.pdf).

    3. See [`http://www.lenskold.com/solutions/dashboards.html`](http://www.lenskold.com/solutions/dashboards.html).

    4. “Seattle’s Leroy Hood receives National Medal of Science at White House,” Valerie
    Bauman, Puget Sound Business Journal, February 1, 2013; [`http://www.bizjournals.com/seattle/blog/2013/02/seattles-lee-hood-receives-national.html?page=all`](http://www.bizjournals.com/seattle/blog/2013/02/seattles-lee-hood-receives-national.html?page=all).

    5. “Sales & Marketing Analytics: Gauging and Optimizing Performance, Demand Metric,
    December 2013, p. 13; [`http://www.demandmetric.com/content/sales-marketing-analytics-benchmark-report`](http://www.demandmetric.com/content/sales-marketing-analytics-benchmark-report).

