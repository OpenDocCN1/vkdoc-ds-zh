    \ Media Finance Inc (SSBM Finance Inc). SSBM Finance Inc is a Delaware corporation.\n\
    \nTo Lisa: my wife of three decades. A man could want no finer or truer partner\
    \ in life. And, To marketers who are searching for a better way to answer the\
    \ question: “What have you done for us lately?”\n\n## Introduction\n\nI entered\
    \ the marketing profession quite by accident. Over 30 years ago I graduated from\
    \ university with a degree in computer science, and for the 4 years I was earning\
    \ that degree, I worked at the university data center. I had the academic underpinnings\
    \ to develop software and a résumé that included highly relevant experience. Despite\
    \ the relatively poor job market when I graduated, I had three good offers. Surprising\
    \ myself, I chose the one with the lowest starting salary, at IBM, because I liked\
    \ the culture and upward mobility there. IBM didn’t see me as a software programmer,\
    \ but instead put me in a sales and marketing branch office. I never wrote a line\
    \ of code from that day forward, and I didn’t regret it.\n\nI was immediately\
    \ drawn into the world of sales and marketing, and I learned everything I could\
    \ from IBM, one of the best in the business at marketing its solutions. Through\
    \ a series of job changes, each one pulling me deeper into the marketing profession,\
    \ I learned from mentors and experience (mistakes) about how marketing works in\
    \ the real world. My analytical programming background never left me. As fascinated\
    \ as I was with marketing, I was also troubled by how little was known about how\
    \ to connect my marketing efforts to business results. I have seen marketing get\
    \ credit for business results it didn’t necessarily produce, fail to get credit\
    \ when it did produce results, and get blamed (fairly and unfairly) for its lack\
    \ of contribution. In almost every case, judgments about marketing were based\
    \ on opinion and conjecture, not data. This bothered me.\n\nThe inescapable conclusion\
    \ was that the determination of marketing’s success was too arbitrary, too subjective.\
    \ Even if marketing was performing brilliantly, without data to prove it, the\
    \ CFO could still cut marketing’s budget. The CEO would question marketing’s contribution.\
    \ The rest of the organization could easily view marketing as a luxury, not a\
    \ necessity. When reviewing other corporate functions, such as development, human\
    \ resources, or sales, I noticed they each had a specific set of metrics that\
    \ created clarity about how well they were getting their jobs done. This was not\
    \ the case in marketing. If marketing were to get taken to court and tried for\
    \ its performance, what evidence could the defense provide in favor of marketing?\
    \ Very little, it seemed.\n\nWhat marketing needed was a set of metrics that moved\
    \ the determination of its success out of the realm of subjective conjecture and\
    \ into the world of objective fact. As a leader, I knew we needed more than the\
    \ ability to say that we had churned out X number of assets or managed participation\
    \ in Y number of trade shows and other, similarly vague attempts to connect our\
    \ work to something the C-suite cared about. These attempts at accountability\
    \ left questions in everyone’s minds about how well marketing was truly performing.\
    \ The solution was analytics with a set of metrics that provided meaningful data\
    \ about marketing’s contribution, so that even for those who might disagree with\
    \ marketing’s methods, there was no argument about the results."
