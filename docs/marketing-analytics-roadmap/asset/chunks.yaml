- fmt: '在决策方面，这些营销组织既依赖直觉也依赖伪分析，但更侧重于前者而非后者。他们不愿过度依赖分析，因为对其缺乏完全的信心。更值得担忧的是，让分析掌握营销部门的主导权，因此营销部门与分析保持一臂之距。只要分析能为营销想做的事情提供掩护，它们就是有用的。但允许分析影响决策和战略是不可想象的，因为这有可能让分析坐上驾驶座，而将首席营销官（CMO）置于一旁。


    这种定位使营销在决策方面明确地处于骑墙状态。它既没有良好分析流程带来的好处，也不完全依赖直觉，而是依赖伪分析与直觉的模糊结合。这产生了不确定性，而营销需要做出的决策越大，其中的不确定性就越大。因此，与那些没有分析流程的组织相比，这些组织对自己做出的重大决策往往缺乏信心。


    ## 真正的分析计划：实打实的大招


    > 如果我能给所有地方的营销人员一个评估和使用营销分析的建议，那就是：让自己成为数据知情者，而不是完全的数据驱动者，因为意外发现的力量以及投资于无法衡量的营销活动所带来的效果可能是不可思议的。
    ——兰德·菲什金，Moz


    最后一种情景考察的是一个拥有并实际使用真正分析流程的营销组织。这里所说的“真正”是指一个追踪那些能真实、直接指示营销绩效和贡献的指标的流程。使用这些指标，营销团队及其所服务的公司能够精确地确定营销如何影响收入。此外，这些分析还是一种管理工具，能帮助营销优化其努力并产生最佳可能的结果。在这个营销团队的比喻性车辆中，所有仪表盘上的量表和指示灯都正常运作，团队也知道如何读取它们。当“检查引擎”灯亮起时，会立即进行问题确定和解决。该流程产生的指标和绩效数据不仅指导着营销团队，还会与组织的其他部门自由分享。


    与那些盲目飞行或使用伪分析的营销组织不同，这些组织持续取得成功，并且由于他们使用了有效的分析流程，他们能够毫无困难地向公司其他部门展示自己的价值。成功几乎从来不是偶然或CMO的偶然猜测的结果。相反，它来自于使用分析来衡量营销所做的一切，然后在分析表明需要时进行调整，或者在管理者确认某条路线是正确的时继续坚持。


    人们很容易认为这些组织让分析坐上驾驶座，简单地跟着数字走。分析是营销成功的关键因素，但在此它们并不发号施令。对这种关系的正确理解是：将CMO视为营销的真正主宰者，而分析则是忠实的仆人。正如我的同事斯蒂芬·索尔格在我们共同教授的一次网络研讨会上所说的：“分析是好的仆人，但却是糟糕的主人。”[³](#A978-1-4842-0259-3_1_Chapter.html#Fn3)


    战略的制定与实施，活动的策划与推出，都伴随着一套可靠的内置指标来测量影响。


    分析流程的输出被持续监控，以确定：


    - **绩效**：指标揭示了关于营销正在产生的结果的哪些信息？

    - **有效性**：所使用的指标是否正确，能否提供真实且精确的绩效指示？


    如果指标显示某项营销举措或活动效果不佳，就会进行改变以产生更好的结果。营销不会只是继续做同样的事情，寄希望于结果奇迹般地改善。相反，它会识别出分析流程正在告诉它的信息：必须做出改变。同样，指标本身也会不断受到审视，以确保它们是绩效的准确指示器。这些营销组织知道，在分析领域，很容易被权宜之计所主导，导致衡量那些容易衡量的东西，而不是相关的东西。


    注意


    分析对于营销方案是有用的，甚至是必不可少的。但这并不意味着数字会告诉你每一步需要做什么。CMO不能简单地跟随着分析“亦步亦趋”。'
  raw: 'As for decision making, these marketing organizations rely both on intuition
    and the pseudo-analytics, but more on the former than the latter. They are reluctant
    to lean too heavily on their analytics, because they don’t have complete confidence
    in them. Of greater concern is having the analytics become master over the marketing
    department, so marketing maintains an arm''s-length relationship with its analytics.
    As long as they provide cover for what marketing wants to do, the analytics are
    useful. But allowing analytics to influence decision and strategy is unthinkable,
    because it risks putting analytics in the driver’s seat instead of the CMO.


    This orientation puts marketing squarely on the fence with respect to decision
    making. It doesn’t have the benefit of a good analytics process, nor does it rely
    fully on intuition but instead a murky combination of pseudo-analytics and gut
    feeling. This produces uncertainty, and the bigger the decision marketing has
    to make, the more uncertainty there is about it. For this reason, these organizations
    tend to have less conviction about the big decisions they make than those with
    no analytics process.


    ## A True Analytics Program: The Real Deal


    > If I could give marketers everywhere one tip on evaluating and using marketing
    analytics, it would be to make yourself data-informed, but not exclusively data-driven
    because the power of serendipity and of investing in unmeasurable marketing can
    be incredible. —Rand Fishkin, Moz


    The final scenario examines a marketing organization that has a real analytics
    process in place and uses it. What is meant by “real” is a process that tracks
    metrics that provide true and direct indicators of marketing’s performance and
    contribution. Using these metrics, the marketing team and the company it serves
    can determine with precision how marketing influences revenue. Furthermore, these
    analytics are a management tool that helps marketing optimize its efforts and
    produce the best possible outcomes. In this marketing team’s metaphorical vehicle,
    all the dashboard gauges and indicators work, and the team knows how to read them.
    When the check engine light comes on, immediate problem determination and resolution
    takes place. The metrics and performance data this process produces not only guides
    the marketing team, it is shared freely with the rest of the organization.


    Unlike marketing organizations that are flying blind or using pseudo-analytics,
    these organizations consistently produce success, and because they use an effective
    analytics process, they have no difficulty demonstrating their value to the rest
    of the company. Success is almost never the result of luck or a good guess by
    the CMO. Instead, it comes from using analytics to measure what marketing does,
    and then pivoting when the analytics indicate a need for it, or staying the course
    when managers confirm it is the right one.


    It’s easy to assume that these organizations put analytics in the driver’s seat
    and simply go wherever the numbers lead them. Analytics are critical success factors
    for marketing, but they don’t call the shots here. The correct understanding of
    this relationship is to see the CMO as the true master of marketing, with analytics
    as a trusty servant. As my colleague Stephan Sorger put it in a webinar we taught,
    “Analytics are good servants, but poor masters.”[³](#A978-1-4842-0259-3_1_Chapter.html#Fn3)


    Strategies are devised and implemented, campaigns developed and launched, all
    with a reliable set of built-in metrics to measure impact.


    The output of the analytics process is constantly monitored to determine:


    Performance: what do the metrics reveal about the results marketing is producing?
    Validity: are the right metrics in use to provide a true and precise indication
    of performance?


    If the metrics reveal that a marketing initiative or campaign isn’t working, changes
    are made to produce better results. Marketing doesn’t just continue to do the
    same thing hoping that the results will magically improve. Instead, it recognizes
    what the analytics process is telling it: change must occur. Likewise, the metrics
    themselves are constantly under scrutiny to make sure they are accurate indicators
    of performance. These marketing organizations know that in the area of analytics,
    it’s easy for expediency to take over, leading to measuring what’s easy instead
    of what’s relevant.


    Note


    Analytics are useful and even essential to a marketing program. That doesn’t mean
    the numbers tell you each and every move you need to make. The CMO can’t just
    play “follow the leader” with analytics.'
