  trans: '

    # 10. 营销分析前沿


    大数据、预测性分析与高级归因


    营销分析并非是一门一旦实施便一成不变的静态学科。开展营销分析的原因没有太大变化，驱动分析工作的核心原则也是如此。然而，分析实践所涉及的方法、技术和工具却在不断演变。营销分析存在着一个前沿领域，而那些勇于探索这片领域的人，正在发现能够带来显著竞争优势的、具有变革意义的洞察。本章将探讨营销分析先驱们当前正在开辟的一些路径。


    事实上，营销分析学科正以令人目眩的速度发生着变化。总的来说，这种变化表现为各类创新，这些创新提供了几年前还无法想象的企业与客户洞察。最前沿的营销分析实践正在以前所未有的细节水平提供更精确的信息，并且这些信息几乎能实时送达营销人员手中。凭借这些信息，营销人员能够以最深入的层次理解客户，准确预测诸如购买和流失等事件。营销人员能够基于数据而非直觉来优化其渠道和媒体组合。营销分析的前沿有望将营销转变为一个无可争议的收入中心，而不仅仅是活动产出者和销售推动者。


    尽管营销分析前沿领域正在发生诸多变化，但本章将聚焦于三个营销人员不能声称不了解的领域：大数据、预测性分析和高级归因。本章其余部分将概述这些概念是什么，以及营销人员为何应予以重视。


    > **注：** 营销分析的前沿正在将营销转变为一个无可争议的收入中心，而不仅仅是活动产出者和销售推动者。


    ## 大数据


    > 没有大数据，你就像在高速公路中间又盲又聋。——杰弗里·摩尔


    自商业诞生以来，理解客户及其行为动机一直是商人的追求。营销肩负着这一使命，传统上，营销人员通过少数几种研究技巧来研究客户，例如过往交易分析、观察、调查和焦点小组。许多组织会维护某种形式的客户主信息档案（通常是更大规模数据仓库的一部分），营销人员可以据此研究客户。然而，这些数据包含的信息集是有限的，其时效性和准确性也参差不齐。尽管有用，但这些数据让营销人员对客户行为的理解十分有限。对许多人而言，这种客户数据现状就是他们当前的现实：陈旧且不完整。


    现代消费者会留下大量的数字踪迹，如果营销人员能够追踪这些踪迹，就能揭示出以往不为人知的模式、偏好和意图信号。想想消费者在任何一天中的典型行为：他们通过手机交流、浏览和发布社交媒体、查看邮件、上网冲浪、进行购买、下载音乐、阅读产品和商家评论。做这些事情的消费者会创建一条巨大的数据轨迹，营销人员可以利用它，而挖掘这些数据正是营销与大数据的交汇点。


    大数据在概念上很容易理解。它就是指数据量巨大且种类繁多，以至于无法通过标准数据库查询工具进行处理和分析的数据集。没有特定的规模标准来决定一个数据集何时变成“大”数据。在这种情况下，“大”更多地指的是分析它的复杂性，而非其规模。当然，它在规模上也是“大”的，因为其绝对数量通常非常庞大。使其变得庞大而复杂的原因是它来自多个来源，并且通常不是一个单一的、离散的数据集。它更应被理解为来自多个来源的相关数据的集合。


    过去，营销人员处理的是结构化数据，因此可以使用像电子表格这样简单的工具轻松访问和分析。事实上，理解结构化数据的一个好方法是：任何能放入电子表格行和列中的数据形式。销售交易数据就是结构化数据的一个典型例子。在分析过程中，营销人员过去处理的几乎所有数据都是结构化的。在对大数据的讨论中，结构化数据当然也占有一席之地，因为它是大数据范畴下的两大类数据之一。


    另一类数据，也是带来最多挑战的一类，是非结构化数据。非结构化数据的一些例子包括数字图像、在线视频、博客评论、在线产品评论、聊天记录、网络研讨会、位置信息、传感器数据和
    GPS 数据等。这类数据数量巨大，并且正以惊人的速度增长。非结构化数据包含营销人员可以用来更好地理解客户及其情感的信息，特别是当他们能够将这些数据与预先存在的结构化客户数据进行匹配时。


    营销人员如何获取并利用这些数据为自己服务？这个应用难题既是挑战也是机遇，因为对大数据的炒作和承诺并非关乎数据本身。如果没有用于挖掘数据价值的工具和应用，数据的价值就微乎其微。大数据本质上代表着一个巨大的势能储备。要将这种势能转化为动能，以释放其所包含的价值，就需要分析。


    > **注：** 大数据的承诺不在于数据本身，而在于其所包含的、通过分析手段才能获取的详细洞察。

    '
- fmt: '# Standing in the Way of Big Data Applications


    Standing in the way of big data applications that provide marketing benefits are
    the three V’s of big data, characteristics described by Doug Laney in a 2001 META
    Group research note: volume, velocity, and variety. These help explain why big
    data requires new forms of processing to allow integration of insights extracted
    from big data with marketing and corporate decision making.


    - **Volume**: The sheer amount of data that is becoming accessible to marketers,
    which is quite large. The opportunity of big data lies in having the capacity
    to process the large volume of data that exists.

    - **Velocity**: The rate data is created or otherwise becomes available. For example,
    every second, on average, about 6,000 tweets go through Twitter. The challenge
    of velocity is having the capacity to absorb the data at the increasingly rapid
    speeds at which it arrives.

    - **Variety**: The diversity of structured but mostly unstructured data types
    and sources. Big data implies the ability to simultaneously take multiple sources,
    such as video files, images, documents, text, call center notes, and geo-location
    data, and form a composite, actionable view of that data.


    ## How Big Data Provides Value for Marketers


    The application of big data analytics isn’t limited to marketing, but within the
    marketing department, it is driving more intelligent decisions that increase marketing
    effectiveness, improving return on investment. Some of the ways big data is proving
    valuable for marketers include:


    - **Greater information transparency**: Information and insights that are normally
    locked with disparate types of data become accessible and usable for marketers.
    For example, by exploiting big data, marketers can more precisely segment customers,
    which leads to better matching of products and services to their needs.

    - **Personalization**: Through big data analysis, marketers can develop a deeper
    and more sophisticated understanding of individual customers and their buying
    patterns. With this understanding it becomes possible to develop and deploy highly
    personalized marketing approaches that better allocate marketing budgets and resources
    and achieve a higher ROI.

    - **Predictive modeling**: Build accurate models that help organizations understand
    how customers will respond to certain actions, such as a price change or new terms
    and conditions.

    - **Sentiment analysis**: Because big data analytics considers data from many
    different sources, such as social media, it is possible to discern how customers
    or the public feel about a company, product, or service.

    - **Behavioral analysis**: Using big data to analyze trends helps marketers understand
    how customers are responding to market conditions, sales, coupons, competitive
    pressures, or myriad situations as they are occurring. This analysis lets marketing
    refine strategies and develop messaging that resonates with customers.


    ## Challenges of Big Data


    These are just a few examples of how marketers can exploit big data. These benefits
    reveal why there is such interest in big data, and as marketers race to take advantage
    of analytics, they are encountering some challenges, many of them related to the
    three V’s identified earlier. Because there is so much data for marketers to consider
    and use, properly storing and managing it is a challenge. Big data analytics requires
    different software, tools, and skills to perform, and many marketing organizations
    discover they don’t have them on the team, let alone anywhere else in the organization.
    As organizations move to exploit big data, many are finding they have to add a
    technical skill set to the marketing team. Big data is taking marketing to a place
    it has never been before, but the promised results are causing increasing numbers
    of marketers to venture into this strange, new territory.


    ### The People Challenge


    The people challenge for marketers who wish to make use of big data is a major
    hurdle. Big data analytics requires people with skills who have never before inhabited
    the marketing department. The ideal blend of skills for a big data marketing team
    member includes:


    - **Mathematical**: the skills required to build, understand, and work with what
    are often complex data sets and models. This is the theoretical aspect of big
    data analytics. These skills are most often associated with a scientist.

    - **Technical**: the technical proficiency to use software and tools to retrieve,
    analyze, manage, and store the data from a wide variety of sources. These skills
    are most often associated with someone in the IT department.

    - **Insightful**: the ability to interpret the output of big data analytics and
    discern the “big picture” implications, translating them into actions marketing
    should take. This ability is most often associated with a researcher.

    - **Communications**: the talent and skill of sharing results with the people
    who need to hear them and inspiring them to take the appropriate actions as a
    result. This ability is most often associated with a visionary leader.


    A quick scan of this necessary skills list produces a realization: not only do
    people who have these skills not work in the marketing department, few people
    anywhere have all of these skills. These skills represent a rare combination that
    is not often found packaged in one person. It’s possible to find the mathematical
    and technical skills in one person, or the insight and communications skills together,
    but rarely all four. This people challenge is the greatest one for most marketers
    seeking to use big data. What many organizations are doing is outsourcing the
    mathematical and technical skills while working to develop them internally.


    > **Note**: The ideal blend of skills for exploiting big data—mathematical, technical,
    insight, and communications—are not generally found in the marketing department.


    ### The Data Challenge


    Another major area of challenge when marketing goes to use big data analytics
    is of course the data itself. Harmonizing the many data sources is difficult,
    because organizations generally have the data marketing wants to use in different
    formats, structures, and databases. Creating a single, harmonized view of it all
    that makes it easy for marketing to use is difficult if not impossible. On top
    of these challenges are concerns and issues with security and privacy, often because
    some of the data is stored in the cloud or in systems with vulnerabilities. In
    the rush to take advantage of big data, some organizations may not give enough
    thought to keeping it secure, and breaches are damaging, both monetarily and reputationally.


    ## Moving Forward


    Although these risks and challenges seem daunting, they shouldn’t dissuade marketers
    from testing the waters of big data. All of the risks are manageable, and none
    of the challenges are impossible to overcome. The opportunities and advantages
    that big data can provide are simply too great to ignore. Marketers who want to
    move forward with big data should follow this action plan:'
  raw: 'Standing in the way of big data applications that provide marketing benefits
    are the three V’s of big data, characteristics described by Doug Laney in a 2001
    META Group research note: volume, velocity, and variety.[²](#A978-1-4842-0259-3_10_Chapter.html#Fn2)
    These help explain why big data requires new forms of processing to allow integration
    of insights extracted from big data with marketing and corporate decision making.


    *   Volume: The sheer amount of data that is becoming accessible to marketers,
    which is quite large. The opportunity of big data lies in having the capacity
    to process the large volume of data that exists.

    *   Velocity: The rate data is created or otherwise becomes available. For example,
    every second, on average, about 6,000 tweets go through Twitter.[³](#A978-1-4842-0259-3_10_Chapter.html#Fn3)
    The challenge of velocity is having the capacity to absorb the data at the increasingly
    rapid speeds at which it arrives.

    *   Variety: The diversity of structured but mostly unstructured data types and
    sources. Big data implies the ability to simultaneously take multiple sources,
    such as video files, images, documents, text, call center notes, and geo-location
    data, and form a composite, actionable view of that data.


    The application of big data analytics isn’t limited to marketing, but within the
    marketing department, it is driving more intelligent decisions that increase marketing
    effectiveness, improving return on investment. Some of the ways big data is proving
    valuable for marketers include:


    *   Greater information transparency. Information and insights that are normally
    locked with disparate types of data become accessible and usable for marketers.
    For example, by exploiting big data, marketers can more precisely segment customers,
    which leads to better matching of products and services to their needs.

    *   Personalization. Through big data analysis, marketers can develop a deeper
    and more sophisticated understanding of individual customers and their buying
    patterns. With this understanding it becomes possible to develop and deploy highly
    personalized marketing approaches that better allocate marketing budgets and resources
    and achieve a higher ROI.

    *   Predictive modeling. Build accurate models that help organizations understand
    how customers will respond to certain actions, such as a price change or new terms
    and conditions.

    *   Sentiment analysis. Because big data analytics considers data from many different
    sources, such as social media, it is possible to discern how customers or the
    public feel about a company, product, or service.

    *   Behavioral analysis. Using big data to analyze trends helps marketers understand
    how customers are responding to market conditions, sales, coupons, competitive
    pressures, or myriad situations as they are occurring. This analysis lets marketing
    refine strategies and develop messaging that resonates with customers.


    These are just a few examples of how marketers can exploit big data. These benefits
    reveal why there is such interest in big data, and as marketers race to take advantage
    of analytics, they are encountering some challenges, many of them related to the
    three V’s identified earlier. Because there is so much data for marketers to consider
    and use, properly storing and managing it is a challenge. Big data analytics requires
    different software, tools, and skills to perform, and many marketing organizations
    discover they don’t have them on the team, let alone anywhere else in the organization.
    As organizations move to exploit big data, many are finding they have to add a
    technical skill set to the marketing team. Big data is taking marketing to a place
    it has never been before, but the promised results are causing increasing numbers
    of marketers to venture into this strange, new territory.


    The people challenge for marketers who wish to make use of big data is a major
    hurdle. Big data analytics requires people with skills who have never before inhabited
    the marketing department. The ideal blend of skills for a big data marketing team
    member includes:


    *   Mathematical: the skills required to build, understand, and work with what
    are often complex data sets and models. This is the theoretical aspect of big
    data analytics. These skills are most often associated with a scientist.

    *   Technical: the technical proficiency to use software and tools to retrieve,
    analyze, manage, and store the data from a wide variety of sources. These skills
    are most often associated with someone in the IT department.

    *   Insightful: the ability to interpret the output of big data analytics and
    discern the “big picture” implications, translating them into actions marketing
    should take. This ability is most often associated with a researcher.

    *   Communications: the talent and skill of sharing results with the people who
    need to hear them and inspiring them to take the appropriate actions as a result.
    This ability is most often associated with a visionary leader.


    A quick scan of this necessary skills list produces a realization: not only do
    people who have these skills not work in the marketing department, few people
    anywhere have all of these skills. These skills represent a rare combination that
    is not often found packaged in one person. It’s possible to find the mathematical
    and technical skills in one person, or the insight and communications skills together,
    but rarely all four. This people challenge is the greatest one for most marketers
    seeking to use big data. What many organizations are doing is outsourcing the
    mathematical and technical skills while working to develop them internally.


    Note


    The ideal blend of skills for exploiting big data—mathematical, technical, insight,
    and communications—are not generally found in the marketing department.


    Another major area of challenge when marketing goes to use big data analytics
    is of course the data itself. Harmonizing the many data sources is difficult,
    because organizations generally have the data marketing wants to use in different
    formats, structures, and databases. Creating a single, harmonized view of it all
    that makes it easy for marketing to use is difficult if not impossible. On top
    of these challenges are concerns and issues with security and privacy, often because
    some of the data is stored in the cloud or in systems with vulnerabilities. In
    the rush to take advantage of big data, some organizations may not give enough
    thought to keeping it secure, and breaches are damaging, both monetarily and reputationally.


    Although these risks and challenges seem daunting, they shouldn’t dissuade marketers
    from testing the waters of big data. All of the risks are manageable, and none
    of the challenges are impossible to overcome. The opportunities and advantages
    that big data can provide are simply too great to ignore. Marketers who want to
    move forward with big data should follow this action plan:'
  trans: '

    # 阻碍大数据应用的因素


    阻碍具有营销价值的大数据应用的因素，是大数据的三个 V 特性，即道格·莱尼在 2001 年梅塔集团研究报告中描述的特征：体量、速度和多样性。这些特性有助于解释为何大数据需要新的处理方式，才能将从大数据中提取的洞察与营销及企业决策相结合。


    -   **体量**：营销人员能够获取的数据总量，这个量非常庞大。大数据的机遇在于有能力处理海量现存数据。

    -   **速度**：数据被创建或变得可用的速率。例如，Twitter 上平均每秒约有 6000 条推文。速度带来的挑战在于，是否有能力以数据到达时越来越快的速度来吸收这些数据。

    -   **多样性**：数据类型的多样性，尤其是非结构化数据的多样性和来源的广泛性。大数据意味着有能力同时处理多种来源的数据，例如视频文件、图像、文档、文本、呼叫中心记录和地理位置数据，并形成统一且可操作的数据视图。


    ## 大数据如何为营销人员创造价值


    大数据分析的应用并不仅限于营销领域，但在营销部门内部，它正推动着更智能的决策，以提高营销效率并改善投资回报率。大数据为营销人员创造价值的一些方式包括：


    -   **更高的信息透明度**：通常锁定在不同数据类型中的信息和洞察，现在对营销人员来说变得可访问和可用了。例如，通过利用大数据，营销人员可以更精确地细分客户，从而更好地将产品和服务与客户需求相匹配。

    -   **个性化**：通过大数据分析，营销人员可以对个体客户及其购买模式形成更深入、更精细的理解。有了这种理解，就有可能制定和部署高度个性化的营销方法，从而更好地分配营销预算和资源，实现更高的投资回报率。

    -   **预测建模**：构建精确的模型，帮助组织了解客户将如何对特定行动（例如价格变动或新的条款与条件）做出反应。

    -   **情感分析**：由于大数据分析考虑了来自许多不同来源的数据，例如社交媒体，因此有可能识别出客户或公众对某个公司、产品或服务的情感倾向。

    -   **行为分析**：利用大数据分析趋势，帮助营销人员了解客户在市场条件、促销活动、优惠券、竞争压力或正在发生的各种情况下的反应方式。这种分析让营销能够精炼策略并开发能与客户产生共鸣的信息。


    ## 大数据的挑战


    以上仅仅是营销人员如何利用大数据的几个例子。这些益处揭示了大数据如此受关注的原因。当营销人员争相利用分析技术时，他们也面临一些挑战，其中许多与之前提到的三个
    V 特性有关。由于有如此多的数据需要营销人员考虑和使用，如何正确存储和管理这些数据便是一项挑战。大数据分析需要不同的软件、工具和技能来执行，许多营销组织发现，不仅团队内部缺乏这些，甚至组织其他部门也难以找到。随着组织开始利用大数据，许多人发现他们需要为营销团队增加技术技能。大数据正在将营销带到一个前所未有的领域，但其承诺的结果正促使越来越多的营销人员涉足这片陌生而新奇的土地。


    ### 人员挑战


    对于希望利用大数据的营销人员来说，人员挑战是一个主要障碍。大数据分析需要具备某些技能的人员，而这些人员以前从未在营销部门工作过。大数据营销团队成员理想的技能组合包括：


    -   **数学技能**：构建、理解并处理通常复杂的数据集和模型所需的技能。这是大数据分析的理论层面。这些技能通常与科学家相关。

    -   **技术技能**：使用软件和工具从各种来源检索、分析、管理和存储数据的技术熟练度。这些技能通常与 IT 部门的人员相关。

    -   **洞察力**：解读大数据分析的输出结果并辨别“全局”影响的能力，将其转化为营销应采取的行动。这种能力通常与研究人员相关。

    -   **沟通能力**：与需要听取结果的人员分享结果并激励他们采取相应行动的天赋和技巧。这种能力通常与富有远见的领导者相关。


    快速浏览这份必要的技能清单会发现一个事实：不仅拥有这些技能的人不在营销部门工作，而且几乎很少有人能同时具备所有这些技能。这些技能代表了一种罕见的组合，很少能集中体现在同一个人身上。有可能在同一个人身上找到数学技能和技术技能，或者洞察力和沟通能力，但很少能集齐全部四项技能。对于大多数寻求利用大数据的营销人员来说，这个人员挑战是最大的障碍。许多组织正在做的，是在内部培养这些技能的同时，将数学和技术技能外包出去。


    > **注意**：利用大数据所需的最佳技能组合——数学、技术、洞察和沟通——通常在营销部门中是找不到的。


    ### 数据挑战


    当营销部门开始使用大数据分析时，另一个主要的挑战领域当然是数据本身。协调众多数据源非常困难，因为组织通常以不同的格式、结构和数据库存储营销想要使用的数据。创建一个统一的、协调的数据视图，以便营销人员轻松使用，即使不是不可能，也是非常困难的。在这些挑战之上，还有与安全和隐私相关的担忧和问题，这通常是因为部分数据存储在云端或存在漏洞的系统中。在急于利用大数据的过程中，一些组织可能没有充分考虑如何保证数据安全，而数据泄露在金钱和声誉上都会造成严重损害。


    ## 展望未来


    尽管这些风险和挑战看似令人生畏，但它们不应阻止营销人员去试水大数据。所有风险都是可控的，所有挑战也并非无法克服。大数据能够提供的机遇和优势实在太大了，不容忽视。希望在大数据方面取得进展的营销人员应遵循以下行动计划：

