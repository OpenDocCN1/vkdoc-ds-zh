- fmt: '### Strategic Marketing Analytics


    Strategic marketing analytics are those that help provide direction to the marketing
    function. The work done under the banner of "strategic" analytics ensures that
    the marketing team is doing the right things, those that have the greatest impact.
    These analytics guide marketing to invest its limited resources in the best possible
    way. To provide the insights necessary to guide the team, strategic marketing
    analytics uses tools for customer and business intelligence gathering. There is
    a forward-looking aspect to this type of analytics. Where many operations and
    logistics analytics are backward-looking—measuring historical results of campaigns
    and programs—strategic marketing analytics helps peer ahead by providing predictive
    results.


    Most organizations now collect exponentially more data about their business and
    customers than they once did. As an example of this data explosion, consider how
    many auto insurance providers now offer apps and devices to help with policy quoting.
    These devices plug into a vehicle and record a stream of data about how that vehicle
    is driven. Where there was once a single customer record in the database, there
    is now substantially more data about a customer''s driving patterns. This example
    is just one of many that illustrate how much data is available to companies about
    their customers. The challenge is making good use of that data, which often requires
    retrieving it from disparate systems and performing some analysis to reveal insights
    that influence strategy. This is where business intelligence (BI) systems come
    into play.


    `BI` refers to the software tools that help organizations analyze virtually any
    source of raw data. The purpose of `BI` tools is to turn that data into actionable
    information. They simplify the process of querying data from multiple sources,
    performing various analyses on it, and then reporting the results, often in the
    form of a dashboard or other data visualization. `BI` tools put a lot of power
    in the hands of the user without requiring technical programming skills to get
    results. A common challenge with using them is the quality of the source data.
    Some remarkable and sophisticated analyses are possible with `BI` tools, but if
    the data on which the analyses are performed is suspect, the results are unreliable.


    `Gartner`, an information technology research and advisory company, publishes
    a `BI and Analytics Platforms Magic Quadrant`,[⁶](#A978-1-4842-0259-3_8_Chapter.html#Fn6)
    a visual summary analysis of the direction and maturity of markets and their vendors.
    The most recent version of the `Magic Quadrant` categorizes several vendors as
    "leaders," including `IBM`, `Information Builders`, `Microsoft`, `MicroStrategy`,
    `Oracle`, `QlikTech`, `SAP`, `SAS`, `Tableau`, and `Tibco Software`.


    Customer intelligence (CI) is conceptually similar to `BI` but with a different
    focus. Where `BI` has traditionally been oriented around financial reporting,
    the focus of `CI` is on understanding customer behavior. Using `CI` tools, marketing
    organizations can analyze the customer data they have amassed, usually in `CRM`
    systems, using the intelligence locked in this data to improve the customer experience
    and ultimately generate more revenue from customers. `CI` helps marketers better
    understand the customer experience and answer questions like how to increase the
    share of wallet captured, which segments are most important, or how to improve
    customer retention. The insights gained from using `CI` tools provide marketers
    with a much deeper understanding of who the customers are, how they behave, and
    why.


    Many of the `CI` tool and solution providers are the same as for `BI`. `Gleanster
    Research`, a company that surveys users and publishes the results in benchmark
    reports, covers the `CI` solution space. It has compiled a list of vendors that
    provide a `CI` solution, including `Infer`, `Lattice Engines`, `Lithium`, and
    `Marketforce`.[⁷](#A978-1-4842-0259-3_8_Chapter.html#Fn7)


    `CI` tools are increasingly providing their users predictive analytics capability.
    Most marketing organizations are charged with generating leads, so they invest
    in lead generation activities across multiple channels, using metrics to monitor
    the lead flow and effectiveness of the various channels and using data from the
    analytics process to optimize the mix, score the leads, and then pass the qualified
    leads on to sales. This process is a big part of what many marketing organizations
    do, and their effectiveness in doing so has a direct effect on revenue. This process
    has a lot of moving parts, so it takes constant care, attention, and analytics
    monitoring to ensure that the process is performing at acceptable levels.


    The lead generation process is heavily dependent on technology and digital marketing
    approaches, so this process produces a lot of analytics data. Indeed, managing
    the lead generation process without analytics data would involve guesswork to
    determine which channels were performing best. Despite the digital nature of this
    process, very little of the technology involved in lead generation has been about
    enabling this process in a predictive way. Most of the analytics surrounding the
    lead generation process provide a historical view of process performance. In other
    words, it''s possible to know with a great precision what has happened through
    metrics that are largely backward-looking. Now `CI` and predictive analytics solutions
    are providing users with the ability to accurately predict the conversion of future
    leads in the sales funnel.


    In the real world, predictive analytics are allowing marketers to create models
    that lead to customers most likely to buy, thus accelerating revenue. `AgilOne`,
    a provider of a cloud-based predictive analytics solution, documents ten use cases
    for predictive analytics in its ebook, *The Definitive Guide to Predictive Analytics
    for Retail Marketers*.[⁸](#A978-1-4842-0259-3_8_Chapter.html#Fn8)


    - **Behavioral clustering**: helps better understand how customers behave while
    purchasing.

    - **Product/category-based clustering**: segments customers into groups based
    on which products they purchase. This insight lets marketers make more intelligent
    choices about which offers to extend to customers.

    - **Brand-based clustering**: identifies brand affinity groupings that customers
    have. For example, customers who prefer brand A also prefer brand C, but not brand
    B.

    - **Predictive lifetime value**: predicts future lifetime values of customers.
    Useful for setting spending parameters on costs of new customer acquisition.

    - **Propensity to engage**: predicts how likely it is for a customer to take certain
    actions, such as clicking on a link in a promotional email message.

    - **Propensity to convert**: predicts the likelihood that a customer will respond
    to call-to-action offers extended to them via email, direct mail, or other means.

    - **Propensity to buy**: identifies customers who are ready to make a purchase,
    allowing marketers to trigger those purchases with a special offer, or market
    more aggressively to those who aren''t ready to buy.

    - **Upsell recommendations**: helps increase the average size of order by predicting
    premium products or greater quantities in which a customer might have interest.

    - **Cross-sell recommendations**: at the time of purchase suggests other products
    that are frequently purchased together.

    - **Next sell recommendations**: after a customer has already purchased a product,
    suggests products that are likely next purchases.


    Predictive analytics is a relatively recent phenomenon, but it is gaining rapid
    acceptance. As is the case with most leading edge technologies, it initially gained
    a foothold with large enterprises as a specialty solution. It continues to evolve,
    moving downmarket and becoming more accessible as its functionality is added to
    marketing automation and `CI` platforms.'
