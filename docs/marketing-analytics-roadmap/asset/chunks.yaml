    analytics process. The challenge of securing the support of the executive or management
    team is also negligible. Rightly so, because what executive or manager would essentially
    communicate to the marketing team that it doesn’t desire accountability, ROI,
    or measurable value by failing to encourage an analytics initiative? The lack
    of support from above or below is not a serious challenge to analytics for CMOs.


    The greatest challenge is not having the systems or infrastructure to measure
    and track marketing analytics. The modern marketing organization uses multiple
    channels, most of them digital, and the campaigns and content that marketing produces
    are consumed across multiple devices. The problem this environment creates is
    not a lack of analytics data, but a plethora of it. The volume and variety of
    data coming at the marketing team can leave it feeling like it’s drinking from
    the fire hose. To capture and fully exploit it as part of an analytics process
    requires some technology. The data is simply too vast and varied to deal with
    through manual processes. The analytics initiative needs a technology assist to
    capture the data and make sense of it. [Chapter 8](../Text/A978-1-4842-0259-3_8_Chapter.html)
    explores some of the tools, systems, and technologies that the modern marketer
    can use to overcome the systems challenge of marketing analytics.


    The lack of time or staff for marketing analytics represents another significant
    challenge. Implementing an analytics process is a strategic endeavor, and for
    busy organizations, taking the time to plan and execute it seems analogous to
    changing the tires on the vehicle while it’s still in motion. These busy marketing
    organizations look forward to a time when things are calm enough to allow them
    time to conduct the proper planning to implement analytics well. However, there
    is no such thing as slack time in busy organizations. Most are busy because in
    the absence of an analytics process, activity is the evidence of progress. The
    organizations that claim to not have the time for analytics are the very ones
    that need it most. To them, the notion of stopping the marketing vehicle, even
    to make enhancements that will enable better performance, is anathema.'
  trans: '

    图 2-6 所示的第四种态度（在调查样本中占比 25%）认为，分析有助于展示营销创造的价值。这种态度揭示了一个现实：营销组织可以通过分析来证明其对收入的影响。除了通过一系列将营销活动与业务成果联系起来的指标外，首席营销官（CMO）别无他法能够说明直接归因于营销的收入份额。每个营销组织都应努力向公司证明自己的价值。即使营销组织通过启发性的创意活动和执行创造了内在价值，它们仍然需要提供所交付价值的证据。而分析流程正是提供这种证据的方式。


    图 2-6 所示的第五种也是最后一种态度是持有最广泛的。近一半的受访者认为，作为帮助管理营销流程的仪表板，分析至关重要。这种态度代表了分析流程的最终目标：将其输出作为管理工具，持续改进营销工作。分析有助于证明营销的可信度，并且是展示营销价值的一种方式。这些收益源于将分析用作指导营销工作的仪表板。因此，这种态度代表了营销人员的首要分析目标：建立一个能够作为有效仪表板来指导营销工作的分析流程，随之而来的将是可信度和可证明的价值。


    ## 营销分析面临的挑战


    找到一些营销指标来衡量和报告固然容易。然而，对大多数公司而言，创建一个能够衡量和追踪有意义内容的分析流程却复杂且时常困难。构建有效分析流程面临的挑战范围广泛，涉及态度、技能、技术和资源等方面。仅有
    6%的公司声称没有任何与营销分析相关的挑战。⁶ 图 2-7 总结了公司在营销分析工作中面临的最大挑战。


    ![A978-1-4842-0259-3_2_Fig7_HTML.jpg](img/A978-1-4842-0259-3_2_Fig7_HTML.jpg)


    图 2-7.


    94%的组织报告称在营销分析方面面临某种挑战


    值得注意的是，什么不是营销分析面临的重大挑战：即接受度或支持度。在本数据来源的调查中，超过半数的参与者是营销领导者：包括 CMO、品牌经理、营销副总裁、营销总监或营销经理。通过这项调查，他们告诉我们，获取自己团队的支持几乎不成问题。营销团队成员明白，拥有分析流程符合他们的最大利益。获得高管或管理团队支持的挑战也微不足道。这合情合理，因为哪位高管或管理者会通过不支持分析计划，来向营销团队暗示其不想要问责制、投资回报率（ROI）或可衡量的价值呢？对于
    CMO 而言，缺乏上下级的支持并不是分析的严重挑战。


    最大的挑战是缺乏衡量和追踪营销分析的系统或基础设施。现代营销组织使用多种渠道，其中大部分是数字渠道，而营销制作的活动和内容是在多种设备上被消费的。这种环境带来的问题不是缺乏分析数据，而是数据过多。涌向营销团队的数据量和种类之多，让人感觉像是在对着消防水管喝水。要捕捉这些数据并将其作为分析流程的一部分充分利用，就需要一定的技术。这些数据过于庞大和多样，无法通过人工流程处理。分析计划需要技术辅助来捕捉数据并使其有意义。第
    8 章将探讨现代营销人员可以用来克服营销分析系统挑战的一些工具、系统和技术。


    缺乏进行营销分析的时间或人员是另一个重大挑战。实施分析流程是一项战略性工作，对于忙碌的组织而言，花时间规划和执行它，就像在车辆行驶途中更换轮胎一样困难。这些忙碌的营销组织期待某个风平浪静的时刻，以便能有时间进行恰当的规划，从而很好地实施分析。然而，在忙碌的组织中根本不存在所谓的闲暇时间。大多数组织之所以忙碌，是因为在没有分析流程的情况下，活动本身就是进展的证据。那些声称没有时间做分析的组织，恰恰是最需要分析的组织。对他们而言，停下营销这辆车（哪怕是为了做出能提升性能的改进）的想法，是令人深恶痛绝的。

    '
- fmt: '# Staffing for Analytics


    Staffing for analytics is a challenge that reflects priorities. Few marketing
    organizations—even those that guide their efforts with an effective analytics
    process—claim to have all the staff they need. An analytics process is the foundation
    for marketing excellence and achievement. It’s unthinkable to fail to devote staff
    to the process because this factor is critical to marketing’s long-term success.
    Staffing the analytics function should have top priority, because the output of
    the process can help make the business case to staff and fund other areas of marketing.


    # Knowledge or Expertise


    The lack of knowledge or expertise presents another challenge to marketing analytics.
    The question marketers should ask is: knowledge or expertise of what? As long
    as there has been a marketing discipline, it’s been important to understand the
    customer and products well. This will never change. When analytics enter the picture,
    it’s natural to assume that statistical prowess is necessary. It certainly isn’t
    a liability to understand statistical processes, but neither is it an imperative.


    ## Technical Skills


    What’s increasingly critical for the modern marketer are technical skills, or
    perhaps more accurately, technology skills. The ability to effectively use the
    software and technology at our disposal is fast becoming the critical distinction
    on marketing résumé. Skilled modern marketers that are at the top of their profession
    blend the traditional creative skills of marketing with technical skills. “Software
    is marketing’s interface to reality,” says Scott Brinker.


    Modern marketers don’t need to know how to use every solution depicted in Figure
    2-1, but there’s a good chance they will use one solution from most of the categories.
    These solutions enable the capture and tracking of the performance data for an
    analytics process. The good news for marketers is that the capabilities of these
    solutions continue to expand while they become easier to use. Still, having a
    firm grasp on the technology for marketing is no longer a luxury but a necessity,
    and marketers cannot outsource the technical part of marketing to the IT department.
    Modern marketing organizations must invest in acquiring and growing their technical
    capabilities, not just for success with analytics but for all of marketing’s work.


    # Identifying and Tracking Meaningful Analytics


    The final challenge that Figure 2-7 summarizes is identifying and tracking meaningful
    analytics. Although selected by just 16 percent of participants in the study,
    it is perhaps the most difficult challenge to overcome in the journey toward becoming
    data-driven. Once all the other challenges are overcome—systems, resources, staffing,
    and skills—this challenge remains.


    Marketers don’t have to stick their toe very deeply into the analytics pool to
    understand the seriousness of this challenge. The activities of modern marketing
    create lots of data. It’s relatively easy to pick something, start tracking it,
    and make some summary graphs with trend lines headed in what seems like the right
    direction. The problem is one of relevancy. It’s gratifying, for example, to know
    that a particular email blast had a higher than average open rate, or to know
    how many times a social media post is shared. These things are relatively easy
    to count, but how do they count in terms of creating value? As William Bruce Cameron
    put it, “not everything that can be counted counts, and not everything that counts
    can be counted.”


    The challenge for marketers is to identify metrics that matter. This process cannot
    begin with looking for whatever metrics are available or just tracking existing
    marketing processes. Instead, the metrics identification process has to start
    with understanding the strategic objectives marketing is pursuing. It is a top-down
    approach. To do otherwise is putting the horse before the cart. Marketing must
    determine what metric provides evidence of effectiveness, value, or meaningful
    outcomes in the pursuit of its objectives.


    After identifying the best metrics, the ideal is for those metrics to come directly
    out of some system in real time and an easy-to-understand, shareable report. Sometimes,
    this occurs. More often, however, there is no easy, direct path for getting at
    the best set of metrics for an analytics process. Marketers will find they must
    derive the right set of metrics from multiple sources, blending and calculating
    numbers to arrive at something that truly indicates how a process is performing
    and what value it is producing. This is a process of planning, testing, and refining.
    It can easily take several reporting cycles to get it right, and even then, it
    requires periodic validation to determine if the numbers still have meaning.'
