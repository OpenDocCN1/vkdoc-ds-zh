  raw: 'To understand this challenge, consider the scenario in which a consumer sees
    paid search media on her computer at work, leading her to visit a seller’s website,
    where she downloads a free buyer’s guide. The next day, that consumer receives
    an email from the seller with a discount offer, and as she is riding the train
    home from work, she uses her mobile phone to click on the offer, investigate it,
    and ultimately make a purchase. In this scenario, which element of the media stream
    gets credit for the conversion? The downloaded buyer’s guide might have been highly
    influential, but if last-click attribution is in use, the email will receive credit
    for the conversion. This leads to erroneous decision making about which part of
    the media stream to optimize or where to invest further.


    Marketers need a holistic method that considers everything the consumer or buyer
    sees, the entire media stream from the customer’s perspective, accounting for
    all channels and devices. With this information, marketers can accurately understand
    the influence of each media stream element in a conversion. Getting this view
    of media performance is necessary because a customer conversion is driven by all
    that a customer sees, not just one part of it. The great news for modern marketers
    is that there is a way to get this kind of information about their campaigns,
    and it’s called advanced or data-driven attribution.


    Note


    Advanced attribution helps marketers understand how every element of the media
    stream seen by a customer contributes to or influences conversion.


    Advanced attribution is an approach for properly and precisely allocating fractional
    conversion credit across the entire media stream that customers are exposed to
    on their buying journeys. Marketers can understand how their content and media
    choices are helping produce conversions, and the extent to which each component
    in the media stream contributes to producing conversions. This level of attribution
    is something that marketers have longed wished for, but never thought possible.
    Advanced attribution is no longer in the realm of science fiction or wishful thinking:
    it’s here!


    By using advanced attribution, marketers can know which components of their campaigns
    generated conversions, and even how long before the conversion event those components
    influenced the conversion. This information makes it much easier to distinguish
    between media elements that created awareness, which ones promoted interest, and
    which ones were most influential in the conversion. By using advanced attribution,
    marketers gain tremendous clarity on what’s going on with their campaigns. This
    information allows them to make smarter decisions about which elements of the
    media stream are most effective at the various stages in the buying cycle, enabling
    more effective use of them to get better response and conversion rates.


    The capabilities of advanced attribution allow marketing to answer a series of
    questions that once instilled fear:


    *   How does each marketing channel fractionally or incrementally contribute to
    the results marketing produces?

    *   If marketing gets an increased budget for campaigns or promotions, where is
    the best place to spend it?

    *   If marketing gets a decrease in budget for campaigns or promotion, where will
    cuts least affect the outcomes?

    *   How do differences in the key campaign variables—creative, devices, audiences,
    and tactics—produce different outcomes?

    *   How do these key campaign variables interact or work together to produce the
    outcomes?

    *   What is the optimal blend of tactics and media channels to achieve the best
    possible business result?


    For the marketing team using advanced attribution, when their executives want
    to know how much the group needs to spend to generate a needed amount of revenue,
    the answer is no longer an educated guess.


    So far, the discussion of advanced attribution has assumed that everything marketing
    is doing is in the digital realm. In practical application, marketing campaigns
    frequently blend digital and traditional (offline) media to generate conversions.
    For example, a retailer might exploit several digital channels in a campaign or
    promotion, in addition to sending coupons through the mail, which are tracked
    by the retailer when customers redeem them. The coupon redemption data is added
    to what is also known about how those customers were influenced by the digital
    media to which they were exposed. In this way, the retailer gets a complete picture
    of how the channels worked to influence customers. The scope of advanced attribution
    isn’t limited to just digital media, but can include traditional media, too, as
    in this example. It can provide a very holistic view of everything that influences
    conversion.


    The competitive implications of advanced attribution are enormous. For markets
    where the key players rely heavily on digital media, advanced attribution has
    the ability to tilt the playing field in favor of those who use it. Those who
    don’t use advanced attribution are caught in an ongoing effort of straining to
    see incremental improvements in media performance, because they’re making media
    decisions that don’t always work. Those marketers that do use advanced attribution
    have clarity about conversion credit, allowing them to make smarter media choices
    with proven results. Advanced attribution provides a new window of understanding
    about where conversion credit truly belongs. It puts a powerful lever in the hands
    of marketing for generating sales lift from every channel in use.


    The three types of analytics presented in this chapter are currently the frontier
    of marketing analytics, but this won’t be the case for long. All of these solutions
    are in current use, sometimes in combination. The increased use of big data, predictive
    analytics, and advanced attribution by marketers is moving awareness of their
    benefits up, while costs and ease of use are getting better. Already these approaches
    are well within reach of medium and even small companies. They are no longer the
    exclusive domain of large, well-funded enterprise marketing teams. The advantages
    from using these—and most innovative solutions and approaches—comes with being
    agile and deploying them quickly. In other words, the longer it takes to exploit
    them, the more mainstream these approaches become, and the less differentiation
    they provide.


    Today’s frontier is tomorrow’s civilized territory. So it is with big data, predictive
    analytics, and advanced attribution: there will come a day when “everyone’s doing
    it.” Marketers looking to manage their performance to higher levels and transform
    marketing into a true revenue center should always be scanning the horizon, looking
    for the next innovation to reveal itself.


    Footnotes [1](#A978-1-4842-0259-3_10_Chapter.html#Fn1_source)


    See [http://siliconangle.com/blog/2012/06/15/geoffrey-moore-discusses-big-data/](http://siliconangle.com/blog/2012/06/15/geoffrey-moore-discusses-big-data/)
    .


    [2](#A978-1-4842-0259-3_10_Chapter.html#Fn2_source)


    Douglas Laney, “3D Management: Controlling Data Volume, Velocity and Variety,”
    February 6, 2001, META Group. [http://​blogs.​gartner.​com/​doug-laney/​files/​2012/​01/​ad949-3D-Data-Management-Controlling-Data-Volume-Velocity-and-Variety.​pdf](http://blogs.gartner.com/doug-laney/files/2012/01/ad949-3D-Data-Management-Controlling-Data-Volume-Velocity-and-Variety.pdf).


    [3](#A978-1-4842-0259-3_10_Chapter.html#Fn3_source)


    See [http://​www.​internetlivestat​s.​com/​twitter-statistics/​](http://www.internetlivestats.com/twitter-statistics/).


