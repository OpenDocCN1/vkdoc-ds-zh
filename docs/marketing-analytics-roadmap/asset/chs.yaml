- "# 2. 营销分析全景\n\n## 事实、态度与挑战\n\n如果将营销视为一个实体，你可以把它看作具有三种类型的人格，类似于 第 1 章 所描述的：无分析、伪分析或真分析。这些人格代表了营销团队运作和创造价值的不同光谱。在光谱的一端，营销是被动且以运营为导向的，由永远忙碌、焦头烂额的管理者掌控。占据光谱另一端的是那些将营销视为战略资产的组织，它们通过一位富有远见的领导者来执行与公司战略一致的计划，从而为整个公司提供领导力。该计划的基础是一套分析工具，如同护栏一般帮助营销保持正确航向。\n\
  \n在这条光谱的运营侧，营销充其量只能带来增量价值，并且它一直苦苦挣扎，不仅需要为其预算正名，更要证明其存在的必要性。而在光谱的战略侧，营销是公司成功的主要驱动力。由于有效运用了分析工具，营销能够毫不费力地证明其价值。作为一项具有战略意义的创收资产，营销很容易证明自身存在的合理性，并为其投资提供回报。\n\
  \n任何营销组织的相关性都取决于其从运营导向向战略导向转变的能力，许多营销人员都渴望帮助他们的组织完成这一转型。进行这一转变对于营销将其地位从可容忍的支出转变为有价值的收入中心至关重要。从领导力的角度来看，营销完成这一转型的能力关系重大，因为以运营为导向的营销组织影响力有限。\n\
