- "# 营销分析学\n\n它是什么，以及你为何需要它\n\n想象一下，你正驾车行驶在高速公路上。你知道自己的目的地，也大致清楚该走哪条路线，但你的车上没有仪表盘。你完全不知道自己开得多快、油箱里还有多少油，甚至不知道引擎是否过热。如果“检查引擎”灯亮起，提示某些问题，你对此也毫不知情。如果运气站在你这边，你或许能在这种情况下把车开到旅程终点。但长期在没有仪表盘提供信息的情况下继续驾驶，无异于在挑战命运。最终，一个你无法察觉的问题总会发生。没有仪表盘，你对车辆的性能表现一无所知。最终，这样开车会导致后果，有些甚至相当严重。你很可能轻易就冲到路边的沟里。\n\
  \n这个关于车辆的比喻同样适用于各类组织及其分析系统——也就是它们的仪表盘——这些系统能帮助组织维持营销引擎的高效运转。一个恰当实施的分析流程能帮助营销组织避免负面后果。但分析的目的不仅仅是让营销活动不“掉进沟里”；分析还能优化营销表现。因此，一个分析流程不仅是为了让营销组织“不惹麻烦”，更是为了帮助其以最高水平运转。\n\
  \n> **注**  \n> 营销分析流程不仅是为了让营销组织不惹麻烦，更是为了帮助其以最高水平运转。\n\n对大多数公司而言，分析是业务管理的核心。财务部门或许最常与整个组织都熟悉的衡量指标和分析方法相关联：收入、利润、投资回报率（ROI）、净资产收益率（ROE）等等。制造部门会追踪产量和缺陷率等指标。人力资源部门会衡量员工留存率和绩效。公司里的每个部门或分部都会运用分析来确保工作与目标一致并朝着目标推进。而营销部门常常是个例外。即使在今天，仍有\
  \ 14%的营销组织没有建立分析流程，¹这反映了营销部门历史上对分析的抵触态度。\n\n本书将探讨营销部门对分析的态度、实施分析流程面临的挑战、以有意义的方式拥抱分析的见解，以及获取所需信息以了解营销方案表现的工具。\n\
  \n## 营销分析学定义\n\n对分析的一般理解是，它们是表明某个流程表现如何的衡量指标或数字。这个定义当然也适用于营销分析，然而，对分析更深入的理解能帮助营销组织充分利用分析流程所能带来的好处，以驱动更好的表现。为此，我给出以下定义：\n\
  \n营销分析是一个过程，包括识别能够有效反映营销在追求目标过程中表现如何的指标，长期追踪这些指标，并利用结果来改进营销工作的方式。\n\n这个定义的核心组成部分值得更仔细地审视：\n\
  \n- **有效指标**：营销的工作和结果中有许多方面是可衡量的。然而，并非所有可衡量方面都是表现的真实指标。分析流程必须确定哪些指标具有意义，并能最好地代表营销为组织创造的价值。\n\
  - **追求目标**：理想情况下，分析流程是为了衡量朝着系列目标的进展情况而建立的，这一概念将在第 5 章中更全面地探讨。目标先行，然后才是确定相关的绩效指标。\n\
  - **长期追踪指标**：分析流程并非对绩效指标进行一次随机的、一次性的快照式测量，而是长期追踪测量结果，以监控绩效的趋势和方向。\n- **改进营销工作方式**：营销组织实施分析流程可能出于多种原因，例如为了问责或证明资源使用的合理性，但最高尚且最终最有价值的原因是为了改进其绩效。\n\
  \n本书中会交替使用“分析”和“指标”这两个词。这些术语含义相近。分析既指代流程本身，也指代该流程的集体产出——即以作为管理工具为理想用途的绩效信息。指标是分析的“原子单位”。营销分析流程包含在特定领域创建一系列指标或衡量标准。\n\
  \n正如营销分析学的定义所示，它不仅仅是一组数字。相反，它是一个包含以下主要组成部分的流程：\n\n- **人员**：营销分析流程由拥有它的相关人员创建、执行和管理。在大多数营销组织中，流程负责人是首席营销官（CMO）或营销总监。\n\
  - **步骤**：营销分析流程包含一系列步骤。构成营销分析流程的步骤将在第 4 章中描述。\n- **工具与技术**：虽然营销分析流程未必复杂，但工具和技术能帮助营销组织比通常更快地交付更大的价值。第\
  \ 8 章将更详细地讨论工具和技术。\n- **输入与输出**：数据是流程的输入，而洞察和决策则是流程的输出。\n\n像许多流程一样，营销分析应该有明确的起点，但没有终点——它是一个一旦启动就应无限期持续下去的流程。\n\
  \n到目前为止，对营销分析的讨论都是概念性的。为了更清晰地说明营销分析流程如何影响一个组织，我们将考虑三种营销组织的情景：一种是没有分析流程的，一种是有“伪”分析流程的，还有一种是有真正有效的分析流程的。在考察这三个组织时，我们将关注它们在领导方式、获取资金的方式、运营方式以及决策方式上的差异。\n\
  \n\n\n## 缺乏分析流程：盲目飞行\n\n我们首先要考察的第一类营销组织，是那些没有分析流程的。打个比方，如果营销组织是辆车，那么它们连仪表盘都没有。首席营销官（CMO）凭直觉规划组织的路线并掌舵。衡量营销成功与否完全是主观的，而且常常充满政治色彩。因此，选择在分析方面“盲目飞行”的\
  \ CMO，往往精于组织内部的政治博弈。他们的生存依赖于与 CEO 保持良好关系的能力。\n\n人们很容易认为，这样的组织不可能取得营销成功，但事实并非如此。尽管缺乏分析流程，这些营销组织仍能取得一些令人印象深刻（尽管是间歇性的）的成功。问题在于持续性。当这些组织成功时，他们很难理解成功的原因，因为营销本质上是一场没有控制变量的实验。“我们运气好”通常是营销部门对成功的内部回应。反之，当营销未能产生成果时，同样难以解释失败的原因。\n\
  \n这类营销组织常见的一个领导层更替场景是：新任 CMO 接替因未能产生成果而被解雇的前任。当然，问题在于，既然没有分析流程，那么对成果——或者说成果的缺失——得出的结论就完全是主观的。CEO\
  \ 可以简单地断定这位 CMO 表现不佳。这对那些 CMO 来说似乎极不公平，但如果他们没有实施一套营销绩效衡量标准，那就等于默认将自己置于这个主观的滑坡之上。\n\
  \n在这类组织中，接替上任的新任 CMO 任期通常约为 18 个月。最初六个月是蜜月期，CMO 可以评估已完成的工作，并确定需要做什么。新任 CMO 明白，按部就班无法创造成功，因此这是一个变革的时期。在此期间，CMO\
  \ 将拥有最大的创意自由度，因为整个组织普遍认为旧的方法已经行不通了。在这种情况下，CMO 的领导风格通常是直觉、创造力和过往经验的结合体。\n\n新任 CMO\
  \ 任期的第二个六个月用于实施新的营销议程。营销团队怀着对成功的极大期望进入执行模式。这个营销组织不使用指标或分析来指导决策或衡量成功，那么它如何知道自己是否实现了目标呢？这种判断仍然是主观的，但组织中的每个人都会形成一些直觉感受，或使用自己的主观标准来判断营销是否成功。\n\
  \n新任 CMO 任期的第三个六个月是成果阶段。这是任职第二年的开始，此时蜜月期通常已经结束。普遍的共识是，该出成果了。很多时候，业务成果是喜人的，但这些成果能归功于营销工作吗？这是一个毋需回答的问题，因为没有任何衡量标准来支持营销部门可能为取得良好成果所做的贡献。当业务表现良好时，营销部门通常可以免于证明其贡献。CMO\
  \ 有理由相信自己还能再保住 6-12 个月的饭碗。\n\n然而，当业务表现不佳时，缺乏证据证明营销成果通常意味着 CMO 职业生涯的终结。完全有可能的是，这位\
  \ CMO 的营销议程非常有效，阻止了公司业绩进一步恶化。但营销部门没有坚实的依据来提出这一论点，而且营销历来是一个方便的替罪羊。营销是否真的该受责备已无关紧要。CMO\
  \ 的命运和营销团队的未来，最终取决于 CEO 的主观判断、CMO 的说服力，以及他/她拥有多少政治盟友。如果铡刀落下，新任 CMO 就会上任，然后循环再次开始。\n\
  \n在没有分析流程环境下运作的营销组织，其资金投入通常如同坐过山车。新任 CMO 会得到信任，并发现公司更愿意对营销进行更大规模的投资。但对于大多数此类营销组织而言，资金审批过程是一场磨人的战斗。每年为营销资金进行的预算争夺战是心理战，因为没有绩效数据来为营销部门的计划建立商业案例。能否成功获得资金，取决于\
  \ CMO 的魅力、说服力以及政治联盟。通常，营销部门只能争取到资金和资源的渐进式增长，而且只有在好年景才能如此。如果营销部门想在现状之外做一些雄心勃勃的事情，资金审批过程可能会是一场政治考验。\n\
  \n从运营的角度看，摒弃分析的营销组织往往在没有战略规划的情况下运作。这并不是说它们没有方向，而是正规的营销规划会制定出带有目标衡量标准的计划。在这种情况下，是有计划的，但它是基于直觉的，而且非常灵活。这个计划主要存在于\
  \ CMO 的头脑中，这意味着公司其他部门对营销部门的动向了解甚少。\n\n这种营销计划缺乏透明度的情况，会对营销团队造成长期的破坏性影响。缺少一个在公司内部被广泛理解的、成文的营销计划，使得营销团队很难对所有营销组织都会收到的、来自公司内部的无数临时请求说“不”。对营销请求说“不”——哪怕这个请求营销团队知道很荒谬——也会消耗政治资本。当没有分析流程来证明其价值时，营销部门需要在组织内部广结善缘。这导致营销部门即使知道应该拒绝时也不愿意说“不”。当公司其他部门习惯于有求必应时，营销团队就会变得非常忙碌——事实上是过于忙碌。它会被视为公司里“焦头烂额”的部门。\n\
  \n> **注意**  \n> 一个依赖政治资本而非分析来执行其计划的营销组织，最终会对那些价值可疑的请求说“是”。然后，当这些努力失败时，营销部门就会受到指责，从而加速营销高管被扫地出门之日的到来。\n\
  \n这种运作模式证明了基于分析的营销计划的价值。当这样的计划到位时，很容易将其作为拒绝公司各部门提出的那些临时资源请求的理由。营销部门可以放心地说“不”，因为还有更重要、更具优先级的承诺：营销计划，它代表着一份成功蓝图。任何与计划不符的请求都是有害的干扰，CMO\
  \ 和营销团队可以权威地对其说“不”。但是，当没有计划时（这在这些类型的组织中很常见），对那些提出服务或资源请求的人来说，说“不”就显得很武断。\n\n这些营销组织坚定地站在决策围墙的直觉这一边。这意味着几乎每一个决策都伴随着很大程度的不确定性。公平地说，即使是拥有高效分析流程的组织，也无法消除其决策中的所有不确定性。尽管没有分析流程意味着决策基本上都是基于经验的有根据的猜测，但这些组织对自己所做的猜测却充满信心。\n\
  \n\n\n## 伪分析式营销项目：半数仪表盘失灵\n\n我们接下来审视的这类营销组织，其内部流程采用了伪分析机制。在这辆承载营销团队的隐喻性汽车中，虽然有一块仪表盘，但部分仪表要么失灵，要么干脆被忽略。另一种可能是，营销团队不知道如何读取仪表盘并理解其含义。从许多方面来看，这个营销团队很像“皇帝的新衣”故事中的情景。因为他们掌握了一些与营销相关的数字，便觉得自己有了“衣裳”，但公司里很多人都看出了他们的“赤裸”。\n\
  \n与那些盲目飞行的营销组织一样，这些伪分析型组织也能取得一些成功。区别在于，这些组织试图将指标作为其营销流程的一部分。他们通常会怀着高度的热忱，利用一些与营销活动相关的数字。然而，他们方法中的缺陷在于，这些数字并非衡量营销绩效的真实指标。那些反映某些营销活动的指标与业务成果之间，缺乏清晰的联系。简单的现实是，某些被使用的指标实际上会营造一种虚假的成就感。营销团队明白应该有一些指标来定义其绩效。因此，拥有一些指标让他们自我感觉良好，但他们所使用的伪分析流程并未产生具有真正意义或能提供战略洞察的指标。\n\
  \n在使用伪分析法的营销组织中，通常存在两种常见的领导情景。第一种情景是，领导者知道分析很重要，但就是不明白如何定义有意义的绩效指标。缺乏经验、技能、时间或指导，使得这位首席营销官（CMO）无法理解如何将分析用作绩效指标，并从中获取提升营销效能的洞察。这种情况往往导致这位领导者抓住任何唾手可得的分析数据不放。一系列看起来有趣的分析数据常常被拼凑成某种仪表盘，其中通常包含诸如：\n\
  \n-   生产率指标：完成的项目数、设计的广告数、召开的会议次数等。\n-   营销指标：网络分析数据（例如页面浏览量、独立访客数）、社交媒体关注数、发送的直邮广告数量等。\n\
  -   内部客户满意度：衡量营销团队服务于整个组织的表现，通常是响应速度的衡量标准。\n\n这些指标非常以活动为中心，但并不能提供多少关于营销活动如何实际助力实现公司收入目标的洞察。接收该组织分析仪表盘的高管们，在审阅时可能会点头微笑，但对这些指标的真实含义却心怀不满，却未表达出来。在讨论收入、利润、投资回报率（ROI）、息税折旧摊销前利润（EBITDA）及其他关键财务指标的董事会议上，没有人——这位营销领导者更不例外——知道如何将营销团队的活动与业务成果联系起来。\n\
  \n另一种领导情景看起来更加险恶，涉及一位利用分析数据作为烟幕弹的营销领导者。这位首席营销官明白组织期望营销部门使用分析工具，因此他/她也照做了，却抛出一堆指标作为烟幕弹，掩盖营销工作的真实情况。与第一种领导情景一样，这位\
  \ CMO 所使用的分析流程也采用了那些并未真正将营销活动与业务成果联系起来的指标。如果说这种领导情景与第一种有什么区别的话，那就是有时分析数据会被反向工程，用来证明\
  \ CMO 预先决定的行动方案是合理的。它们只是为 CMO 提供了掩护。\n\n这第二种领导情景看起来像是诡计多端的 CMO 的产物，但它很少是某种邪恶阴谋的结果。相反，它源于恐惧——害怕分析数据会揭示营销工作的失败。这种恐惧又因不安全感而加剧——他/她不能冒险让指标显示出营销无效或不知道自己在做什么。这种恐惧是合理的，任何在营销界待得足够久的人，可能都能讲出一两个关于分析数据如何被惩罚性地用于对付营销组织的故事。在这些情况下，问题不在于分析数据，而在于文化。\n\
  \n无论哪种领导情景，伪分析流程都会造成不透明，而 CMO 对此结果感到满意。由于营销部门以外的人真的无法理解出自营销部门的分析数据意味着什么，他们不得不去找\
  \ CMO 进行解读。这种质询得到的解释听起来往往是这样的：“没有营销背景的人很难理解这些数据，但请相信我们：这些都是好数字。”只要业务成果还算不错，组织中的大多数人即使摸不着头脑，也会接受这种解释。然而，真相是，使用伪分析法的营销组织，与那些完全不使用分析法的组织一样，都处于同样主观且不稳定的斜坡上。当财务压力促使高管们用批判的眼光审视实际情况时，营销部门就无法回答关于其贡献的棘手问题了。\n\
  \n**注意**\n\n使用伪分析法的营销人员与完全不使用分析法的营销人员一样，都处于一个不稳定且下滑的斜坡上。当注重数字的高管对营销工作投以批判的目光时，营销经理们将难以拿出答案来解释其价值或证明其对财务成果的贡献。\n\
  \n在资金方面，采用伪分析法的组织与没有分析流程的组织情况差别不大。仍然每年都要为预算的增量而斗争。一个区别是，营销部门可以引用指标的改善作为资金申请的合理依据。姑且不论营销部门提出的分析数据是否真的能反映营销绩效；仅仅因为有数字存在，就为其披上了一层原本可能没有的可信度外衣。即使批准预算的高管们不太了解营销工作，他们也常常会凭信任接受其预算理由。\n\
  \n对于大额资金申请，这些营销组织比那些不使用分析法的组织要顺利一些。因为雄心勃勃的项目需要某种商业案例，其合理性建立在与营销部门想做之事有间接关联的一系列指标之上。当没人知道如何去质疑时，数字——即使是错误的数字——也具有说服力。然而，任何关于投资回报率（ROI）的讨论都只是猜测，因为没有任何指标——或使用指标的文化——能够计算甚至估算\
  \ ROI。\n\n在运营层面，这些营销组织非常忙碌。“忙碌”是任何营销组织的共同特征，但这些组织未必忙在点子上。没有良好分析流程的护栏，组织永远不确定自己是否走在正确的道路上，也不确定自己到底有多高效。它们所使用的伪分析法更侧重于追踪活动而非结果。已完成营销任务的数量，例如发出的邮件数、更新的网页数、印刷的宣传册数或投放的广告数，表明营销部门是多么忙碌，但并不能说明它在成果方面产生了什么。\n\
  \n\n\n在决策方面，这些营销组织既依赖直觉也依赖伪分析，但更侧重于前者而非后者。他们不愿过度依赖分析，因为对其缺乏完全的信心。更值得担忧的是，让分析掌握营销部门的主导权，因此营销部门与分析保持一臂之距。只要分析能为营销想做的事情提供掩护，它们就是有用的。但允许分析影响决策和战略是不可想象的，因为这有可能让分析坐上驾驶座，而将首席营销官（CMO）置于一旁。\n\
  \n这种定位使营销在决策方面明确地处于骑墙状态。它既没有良好分析流程带来的好处，也不完全依赖直觉，而是依赖伪分析与直觉的模糊结合。这产生了不确定性，而营销需要做出的决策越大，其中的不确定性就越大。因此，与那些没有分析流程的组织相比，这些组织对自己做出的重大决策往往缺乏信心。\n\
  \n## 真正的分析计划：实打实的大招\n\n> 如果我能给所有地方的营销人员一个评估和使用营销分析的建议，那就是：让自己成为数据知情者，而不是完全的数据驱动者，因为意外发现的力量以及投资于无法衡量的营销活动所带来的效果可能是不可思议的。\
  \ ——兰德·菲什金，Moz\n\n最后一种情景考察的是一个拥有并实际使用真正分析流程的营销组织。这里所说的“真正”是指一个追踪那些能真实、直接指示营销绩效和贡献的指标的流程。使用这些指标，营销团队及其所服务的公司能够精确地确定营销如何影响收入。此外，这些分析还是一种管理工具，能帮助营销优化其努力并产生最佳可能的结果。在这个营销团队的比喻性车辆中，所有仪表盘上的量表和指示灯都正常运作，团队也知道如何读取它们。当“检查引擎”灯亮起时，会立即进行问题确定和解决。该流程产生的指标和绩效数据不仅指导着营销团队，还会与组织的其他部门自由分享。\n\
  \n与那些盲目飞行或使用伪分析的营销组织不同，这些组织持续取得成功，并且由于他们使用了有效的分析流程，他们能够毫无困难地向公司其他部门展示自己的价值。成功几乎从来不是偶然或\
  \ CMO 的偶然猜测的结果。相反，它来自于使用分析来衡量营销所做的一切，然后在分析表明需要时进行调整，或者在管理者确认某条路线是正确的时继续坚持。\n\n人们很容易认为这些组织让分析坐上驾驶座，简单地跟着数字走。分析是营销成功的关键因素，但在此它们并不发号施令。对这种关系的正确理解是：将\
  \ CMO 视为营销的真正主宰者，而分析则是忠实的仆人。正如我的同事斯蒂芬·索尔格在我们共同教授的一次网络研讨会上所说的：“分析是好的仆人，但却是糟糕的主人。”³\n\
  \n战略的制定与实施，活动的策划与推出，都伴随着一套可靠的内置指标来测量影响。\n\n分析流程的输出被持续监控，以确定：\n\n- **绩效**：指标揭示了关于营销正在产生的结果的哪些信息？\n\
  - **有效性**：所使用的指标是否正确，能否提供真实且精确的绩效指示？\n\n如果指标显示某项营销举措或活动效果不佳，就会进行改变以产生更好的结果。营销不会只是继续做同样的事情，寄希望于结果奇迹般地改善。相反，它会识别出分析流程正在告诉它的信息：必须做出改变。同样，指标本身也会不断受到审视，以确保它们是绩效的准确指示器。这些营销组织知道，在分析领域，很容易被权宜之计所主导，导致衡量那些容易衡量的东西，而不是相关的东西。\n\
  \n注意\n\n分析对于营销方案是有用的，甚至是必不可少的。但这并不意味着数字会告诉你每一步需要做什么。CMO 不能简单地跟随着分析“亦步亦趋”。\n\n\n\n"
- '# 分析在营销文化中的运用


  分析的运用是每个人都认同的营销文化的一部分。文化是领导力的体现，因此，`CMO`设定期望值，并将分析的运用作为营销文化的一部分进行示范。`CMO`是分析流程的负责人，理想情况下，他是一位深思熟虑的人，明白不应将分析作为鞭笞糟糕结果的工具。当分析被用于惩罚目的时，它们会立即遭到抵制，或者被操纵以只产生有利的数据，从而侵蚀了流程的价值。为了使流程按预期运作，这些`CMO`必须消除因使用分析来揭露营销活动绩效不佳而产生的负面后果的恐惧。相反，`CMO`围绕分析创造一种文化，奖励那些识别问题和绩效不佳的行为，以便问题能够得到解决。


  ## 预算与资金


  对于任何类型的营销组织而言，预算编制过程很少仅仅是一种形式。然而，那些将分析置于其文化核心的组织，在获得资金方面要容易得多。原因之一在于营销的价值是已知的：它所运用的分析能够向整个组织清晰地展示营销如何帮助创造收入。由于能够将收入直接与其活动挂钩，营销部门的`ROI`是明确的。尽管分析和呈现数据可能需要一些努力，但由于这些营销组织拥有真正的分析流程，因此证明支出合理性从来不是凭空猜测。因为所需的数据是可获取的，所以这要容易得多。


  在论证雄心勃勃、超出预算项目的合理性时，这些营销组织的分析能力也大有裨益。有时，组织会察觉到需要预算外资金以及快速利用机会的灵活性的机遇。当营销部门有能力衡量结果时，高层管理者（`C-suite`）更有可能进行这些投资。这种能力并不能保证努力会成功，但至少组织会确切地知道结果。对于这些投资会产生什么样的回报，不再有模糊的猜测。


  ## 运营与决策


  与那些盲目运作或使用伪分析的组织相比，这些组织通常以更高的权威和信念进行运作。对于任何重要的营销活动或战役，先决条件是确定衡量其成功的指标。这种运营方式在成功方面建立了一种健康的怀疑态度：除非指标提供了证据，否则营销团队通常不会庆祝成功，也不会将某事判定为失败。


  以分析流程为指导，营销团队持续专注于产生结果，不断完善其工作方法，以持续改进、创造更多收入或提高利润率。这种导向与前两种以活动为荣的组织类型感觉截然不同。当分析处于营销团队文化的核心时，除非活动能产生企业关心的结果，否则它们毫无意义。这种态度带来的一个影响是，对不产生价值的空洞活动或无效忙碌工作零容忍。


  很容易在脑海中将这些营销组织想象成冷静无情的数字运算者，数字怎么说他们就怎么做。这种形象是对他们决策方式的不准确描述。数字当然重要，但一个仅仅追随数字的组织无法提供其营销职能所需的领导力或创造力。实际情况是，`CMO`推动战略的制定，通常与营销团队和关键的组织利益相关者密切合作。


  决策的一部分总是充分考虑确定正确的指标，以评估战略和战术的效果。营销分析不能消除营销活动中的所有风险，但它们使营销部门能够更快、更准确地判断结果是否在可接受的风险参数范围内。因此，这类营销组织通常比其他两种类型的组织更乐于承担风险。


  > **提示**

  >

  > 一个好的分析程序将使你能够在可能带来回报的赌注中更自如地承担更多风险。


  毫无疑问，这些营销组织立场坚定：坚定地站在分析这一边。这并不意味着直觉在这些组织的运作中不起作用，但确实意味着直觉总是与一套指标相伴而行。直觉有其价值，并且仍然是这些营销组织制定战略的关键部分。直觉可能引领方向，但验证指标总是紧随其后。因此，这些组织比其他两种组织更清楚他们可以在多大程度上信任自己的直觉。


  ## 总结：三种类型的营销组织


  表 1-1 总结了本章考察的每种营销组织类型。


  **表 1-1.** 三种营销分析场景：无分析、伪分析与真分析


  | 类型 | 领导力 | 运营 | 资金 | 决策 |

  | --- | --- | --- | --- | --- |

  | 无分析 | 直觉驱动 | 忙碌 | 协商的政治过程 | 有根据的猜测 |

  | 伪分析 | 直觉驱动；分析烟雾弹 | 忙碌 | 协商的政治过程 | 有根据的猜测 |

  | 真分析 | 直觉驱动；分析佐证 | 结果导向 | 基于商业案例 | 分析辅助决策 |


  ### 并非同类


  本章细致剖析的三种营销组织有一个共同点：它们都位列组织结构图中的“营销”一栏。虽然那些盲目运作的组织和使用伪分析的组织有几个共同特征，但它们与使用真分析的组织之间几乎没有相似之处。


  在三种类型的组织中都有过工作经验的营销专业人士几乎总是发现最后一种是最佳工作场所。原因在于，在前两种组织中，营销被视为一项支出，也许是必要的支出，但仍然是支出。如果经济压力影响了那些以这种方式看待营销的公司，营销职能往往是公司首先削减的领域之一。


  相比之下，在使用真正分析流程的营销组织中，营销的价值为整个公司所认知和理解。在这里，营销是一个收入中心，其表现使其成为公司成功中不可或缺的贡献者。未能学会如何从成本中心转型为收入中心的营销组织是短暂的。它们的未来充满不确定性；它们的存在常常岌岌可危。营销组织应该采用真正的分析流程的原因，正是为了能够实现从成本中心向收入中心的转变，并提供这一转变的持续证明。本书的其余部分将讨论如何创建这样一个营销组织。


  ## 脚注


  1. 《销售与营销分析：衡量与优化绩效》，第 7 页，Demand Metric 基准报告，2013 年 12 月。

  2. 息税折旧摊销前利润。

