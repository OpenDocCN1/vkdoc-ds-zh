- "# 9. 成为数据驱动\n\n将分析嵌入营销的脉络\n\n了解某件事需要发生，并不能保证它一定会被完成。仅仅理解做某件事的必要性和价值，并不足以确保它会成为现实。例如，大多数人都明白，改变饮食和坚持锻炼是通往更健康生活方式和更好体魄的关键。事实上，他们甚至可能深入了解需要做哪些具体的改变、在多长时间内进行，才能产生这些效果。但真正做出这些改变，则完全是另一回事。达成成果需要持之以恒的意志和纪律；定期的鼓励也很有帮助，因为改变根深蒂固的习惯和思维模式非常困难。\n\
  \n采纳并致力于营销分析流程，与追求健康的生活方式有许多相似之处。一个人可能具备了成功开展营销分析所需的知识、熟练度和技能，却仍然可能失败。理解原则、接受智慧、内化建议，并相信本书或其他渠道关于营销分析的忠告，这些都是成功所必需的。然而，仅凭这些并不足以通过应用分析来成为数据驱动的营销组织，从而实现期望的转变。通过营销分析所能获得的收益和改进，是将分析流程深深嵌入营销部门乃至整个组织文化的结果。换句话说，分析流程不能只是缝在营销这块布上用来掩盖瑕疵的补丁——它必须是一系列直接交织在整个织物中的丝线，使得分析成为营销工作不可或缺、甚至与其融为一体的部分。\n\
  \n> **注意**  \n> 只有当营销分析完全融入营销的运营和文化中时，它才能发挥全部影响力。\n\n追求营销分析的成功，并非仅仅是把分析流程添加到营销已有的工作中。成功需要改变文化，而对文化变革的抵制往往是需要克服的最困难障碍。当整个组织下定决心要通过营销分析追求成功时，才会实现全面的文化认同。其特点是具备长远眼光，即使在结果不佳或流程挑战重重时也能坚持下去的决心，以及无论流程将引向何方都遵循执行它的毅力。从概念上讲，理解这些因素对营销分析成功至关重要并不难，但这并不意味着构建并维持一个成功的流程是件容易的事。启动一项营销分析计划并保持其势头，面临着诸多挑战。\n\
  \n为了提高营销分析成功的几率，组织在涉足这一领域时，不能对随之而来的挑战掉以轻心。本章将讨论其中的一些挑战，旨在提高认识，以便有了认识就能避免或至少更好地管理这些挑战。事实上，这些挑战并非完全可以避免。任何试图认真对待营销分析的组织，都会在某种程度上遇到挑战。提前了解这些挑战，能最大限度地减少可能导致营销人员放弃努力的挫败感。这种预见性也有助于营销人员做好准备去应对它们；当你知道风险和危险时，避开它们就容易得多。\n\
  \n在试图将分析理念植入营销思维时，营销团队可能面临的挑战包括：方向不明确、缺乏支持、缺乏热情以及缺乏自由度。这些挑战是在前几章讨论的技能、工具或数据挑战之上的。这些是广泛的挑战领域，其中任何一个都足以让分析计划搁浅。本章剩余部分将更详细地探讨这些挑战领域，并提出缓解这些挑战的策略。\n\
  \n## 方向不明确\n\n> 如果你不知道要去哪里，你很可能最终会去到别的地方。——尤吉·贝拉\n\n营销分析，作为一个为营销团队提供巨大指导的业务流程，其本身也可能因方向不明确而受损。这种方向不明确源于未能清晰阐述在营销职能内拥抱分析的愿景。很多时候，领导者只是假设做某事的愿景对每个人都是清晰的，而事实并非如此。另一些时候，领导者未能理解愿景的清晰度和统一性对于任何计划成功的重要性。一项计划的利害关系越大，确保每个人都认同其愿景就越重要。这是在营销分析成功之路上必须完成的首要任务。\n\
  \n在追求营销分析的成功时，拥有一个愿景是成功配方中的第一个重要成分。但为了图省事，定义、阐明和沟通愿景的工作常常被牺牲。未能花足够的时间梳理愿景是一个致命的疏忽。在营销采用分析流程的比喻性旅程中，愿景就是目的地。营销希望通过分析实现的一切，就是愿景的内容。借用尤吉·贝拉的话来说，缺乏一个令人信服的营销分析愿景，会使营销面临风险，最终可能无法到达预期目的地。\n\
  \n首席营销官（CMO）的职责是为营销所做的任何事情规划愿景，这当然包括分析。营销团队完全有可能在没有愿景驱动的情况下，一头扎进一个分析计划。毕竟，营销分析是一个好主意。大家很容易一致认为这是“我们应该做的事”。然而，这项努力的目的何在？团队对分析流程设定了哪些目标？团队将如何分配资源并使用流程产生的数据？团队甚至如何知道应该收集哪些类型的数据并用流程进行分析？\n\
  \n正如本书所讨论的，分析并非营销团队在有时间或有兴致时才去参加的课外活动。分析应成为营销思考、规划和运营的核心。但如果没有愿景，当遇到障碍时会发生什么？当工作变得困难时，是什么激励团队保持努力？缺乏愿景时，这些问题的答案就是“没有”。没有一个令人信服的愿景驱动的营销分析流程，注定是短命的。当坚持分析流程变得不再方便或容易时，它就会被抛弃。而分析肯定会有不再方便或容易的时候。\n\
  \n营销分析的合适愿景是什么？我们越来越常见到营销人员转向分析，以帮助营销转变为真正的创收职能。其他营销团队则希望最小化或消除内部政治对营销运作方式及其预算的影响。这些例子只是众多能够为计划指明方向的例子中的两个。每位\
  \ CMO 都必须确定推动营销分析职能的合适愿景。他们必须定期、清晰地沟通这一愿景，以便营销团队的每一个人以及外部相关方都知道分析将把团队带向何方。\n\n>\
  \ **注意**  \n> CMO 必须确定合适的愿景来推动营销分析工作，并定期、清晰地向营销团队的每个人进行沟通。\n\n\n\n"
- "# 正文\n\n愿景虽能为市场营销的所有工作（包括分析流程）提供方向，但其本身也源自价值观。营销分析职能应当建立在哪些不可妥协的价值观之上？分析工作必须牢牢扎根于这些价值观，并朝着愿景指引的方向前进。与营销分析相关的一个价值观示例是，对每一项营销举措都采取“分析优先”的方法。当这一价值观确立后，策划任何营销举措的首要步骤之一便是识别衡量其效果的指标。这些指标应作为判定举措成效的最终裁决者。\n\
  \n这些价值观真正决定了营销团队对待分析的认真程度。因此，当营销团队初次启动分析项目时，应花时间确定其价值观。对于那些已经拥有分析流程但尚未明确价值观来指导工作的营销团队来说，任何时候建立价值观都为时不晚。以下是可作为任何营销分析项目指导方针的十个代表性价值观：\n\
  \n-   每一项营销举措都将从确定成功指标开始。\n-   我们不会使用或报告基于不准确或不完整数据的指标。\n-   我们不会仅仅为了让营销显得繁忙，或因为有人喜欢看到营销数据，而发布“虚荣”指标。\n\
  -   每个人都有自己的观点，但在判定结果或成功时，指标是最终的裁决者。\n-   当分析结果与传统认知相悖时，我们相信分析结果。\n-   当分析结果显示良好成果时，我们自豪地接受赞誉。\n\
  -   当分析结果显示不佳结果时，我们承担责任。\n-   我们不会将分析流程的输出用于惩罚目的，而仅用于改进。\n-   分析不会替我们做决策，但会为我们的决策提供信息。\n\
  -   每一项营销举措都将以回顾成功指标而告终。\n\n拥有愿景来为营销分析流程提供方向，并结合价值观来指导流程及其产出如何运作，对于将分析融入营销体系大有裨益。即使做到了这些，其他挑战依然存在。\n\
  \n## 缺乏支持\n\n> 逆境是通往真理的第一条道路。——拜伦勋爵\n\n认为只要某件事是个好主意，所有人都会支持它，这种想法是天真的。营销分析无疑是个好主意，但来自营销部门内部和外部的缺乏支持，可能会让许多支持者措手不及。当分析发展到成熟水平时，它将把营销部门转变为一个数据驱动的实体，届时对其绩效的大部分质疑都将被消除。谁会不想要这样呢？正如第\
  \ 1 章所述，许多组织中那些在分析方面盲目飞行，或使用伪分析的市场营销人员，要么对分析不接受，要么只是假装对其感兴趣。这类营销组织可能不希望强加一个分析项目，但其他组织会想要的，对吧？不一定。\n\
  \n第 2 章讨论了营销分析面临的挑战，总结于图 2-7。这种支持问题，无论是来自高管团队还是营销团队，在挑战清单上的排名并不高。因此，阐明本章为何更详细地重新探讨这一主题就显得尤为重要。对营销分析的支持——或缺乏支持——可能以两种形式出现：\n\
  \n-   支持开展营销分析项目：这是第 2 章的主题。\n-   支持或相信营销分析流程的输出：这是本章的主题。\n\n每个营销分析支持者都愿意相信：基于准确数据的有效营销分析流程的输出，胜过所有其他信念、偏见、迷信和观点。换句话说，仅仅把指标摆在怀疑者面前，就应该能立即促使他们接受这些指标得出的逻辑结论。毕竟，数据就是数据。数据代表着无可辩驳的事实。怎么可能对其提出异议呢？然而，这种情况却屡见不鲜：对指标那种违背逻辑的抵触，让分析支持者倍感挫败。\n\
  \n这种现象并非营销分析在获得接受、支持和信任时所独有。无论讨论的是气候变化、疫苗与自闭症之间的联系，还是营销分析：先前持有的信念并不会轻易向冰冷的事实让步。在一个著名的心理学案例研究中，斯坦福大学心理学家利昂·费斯廷格指出：“一个有信念的人很难改变。告诉他你不同意，他会转身离开。向他展示事实或数据，他会质疑你的来源。诉诸逻辑，他则无法理解你的观点。”¹\
  \ 营销人员必须理解并做好准备，他们分析流程所产生的测量结果和数据，可能不会自动且即时地获得接受。在处理这种偏见之前，数据驱动和将分析融入营销体系是无法实现的。\n\
  \n> **注意**  \n> 营销人员必须做好准备，其分析流程得出的指标和洞察可能不会立即获得认可。\n\n任何曾在争论中说过“你为什么就是不听劝？”这句话的人，都理解与那些漠视或忽略事实的人打交道时的挫败感。这种现象背后有一些有趣的科学原理：“推理实际上充满了情感（或研究人员常称之为‘情感因素’）。两者不仅不可分割，而且我们对人、事、物的积极或消极感受，产生速度远快于我们的意识思维——只需几毫秒，快得足以用脑电图设备检测到，但远在我们意识到它之前。”²\n\
  \n\n\n## 负面强化信念的数据与信息\n\n那些与既有信念相悖的数据和信息，在接收者的大脑中并不会畅通无阻地被接受。当面对不符合自身信念的数据时，人们往往不会进行推理，而会进行合理化解释。\n\
  \n设想这样一个场景：一位年长的企业主坚信传统纸质媒体广告是与客户沟通的最佳方式。\"我们必须登在报纸上\"是这位老板下达的指令。该企业的营销总监同时运行传统纸媒和数字媒体宣传活动，并追踪关键指标；这些指标证明数字广告的效果远优于传统纸媒。然而，企业主并不认可这些数据，反而让个人偏见阻碍营销人员将资金从传统纸媒转移，以加大对数字媒体的投入。\n\
  \n在这个场景中，营销总监的做法完全正确：确定成功指标，用其监控结果，然后采取改进措施。但企业主根本不听。许多经验丰富的营销人员都经历过类似情况，而其发生并不局限于营销或数据分析领域。\"\
  我们的'推理'是为预定目标——赢得我们的'案例'——服务的手段，且充满偏见。这些偏见包括'确认偏差'，即我们更加重视支持自身信念的证据和论点；以及'证伪偏差'，即我们花费不成比例的精力去试图推翻或驳斥那些我们不认同的观点和论点。\"\
  ³\n\n## 客观性的挑战\n\n诸如此类的场景揭示了要对数据保持完全客观是多么困难。所有数据都必须通过一个由我们的偏见和思维模式构成的理解过滤器。我们很难放下这些偏见，因为大多数时候我们甚至没有意识到它们的存在。即便意识到了，我们也无法轻易将其关闭。结果是，即使怀着最好的意图，我们也容易滑入合理化模式，使结论偏向于自己的偏见。\n\
  \n这种合理化偏见可能来自任何方面。这里给出的例子是外部偏见影响营销运作，但偏见同样可能来自营销团队内部。\n\n## 最小化偏见的影响\n\n营销分析倡导者可以做些什么来避免这种挫败感？这并非完全无法避免，但可以最小化或抵消偏见的影响：\n\
  \n-   **承认偏见的存在。** 就像死亡和税收一样，对大多数营销人员来说，偏见影响营销分析过程是不可避免的。这种对分析工作的偏见是营销领域（以及许多其他领域）的一个特征。\n\
  \n-   **对此不要感到意外。** 因偏见阻碍营销分析工作的进展或接受而感到愤慨是可以理解的反应，但这无济于事。要做好遇到它的准备，并勤勉地加以应对。\n\n\
  -   **知道谁是你的盟友。** 虽然通常有少数人抱有偏见，但也有分析工作的支持者。进行一次摸底，了解利益相关者的看法，然后利用你盟友的影响力。\n\n- \
  \  **善用文化优势。** 文化可以为营销分析提供助力或阻力——有时两者兼有！如果文化中的某些元素或特定的核心价值观支持营销分析流程，那就毫不犹豫地加以利用。\n\
  \n-   **从小处着手。** 当营销分析流程遭遇来自拥有否决权一方的敌意时，准备暂时退却。面对这样的反对，不要试图用分析工作来证明重大营销变革的合理性，因为这些努力将会失败。相反，暂时将分析工作的应用范围限制在较小的事务上。\n\
  \n-   **避免正面冲突。** 很容易将灌输营销分析文化及其接受度的努力变成一场圣战，但要避免这样做。让围绕分析工作的情绪升级为公开敌意，只会让对手更加固执，反抗更激烈。即使面对阻力，也要保持和解的姿态。\n\
  \n-   **保持长远眼光。** 不要让阻力和几次挫折打击你将分析工作植入营销和企业心智的努力。要在心理上做好准备，认识到进展往往遵循\"前进两步，后退一步\"\
  的节奏。最终，营销分析终将胜出。\n\n-   **诉诸更高权威。** 如果你的盟友是老板、总裁、首席执行官或企业主，考虑请他们帮忙扫平内部接受分析工作的障碍。然而，这有时是个微妙操作，因为它很容易被视为\"\
  越级上报\"，这种做法很少被赏识，也可能断送一些关系。\n\n## 坚持与真理\n\n在营销分析工作中遭遇阻力，会让人感觉自己像伽利略，只因大胆声称地球围绕太阳转就遭受迫害。没有什么比手握事实与真理，却遭遇顽固、非理性的阻力更令人沮丧了。\n\
  \n真理如同水力，足以在最坚硬的岩石上冲刷出深沟。坚持不懈地推进分析工作最终会产生同样的效果，逐渐侵蚀掉对它所揭示的真理的抵抗。\n\n\n\n## 缺乏热情\n\
  \n> 成功的真正秘诀是热情。——沃尔特·克莱斯勒\n\n一个组织即便拥有热情好客的文化，并在理念上认同营销分析，却仍可能无法让分析计划获得动力并蓬勃发展，这并非不切实际。当一家繁荣的公司尚未全面拥抱营销分析，尽管它并不反对这么做时，原因往往在于缺乏这么做的热情。对其中一些组织而言，分析似乎是无谓的忙碌。由于正处在繁荣期，通常抱有一种“东西没坏，就别去修它”的态度。营销分析因此被搁置，沦为次要事项，变成公司计划在不太忙时或者确有必要时才做的事。\n\
  \n在这些公司中，危机往往成为采用营销分析的催化剂。那些自认为运营状况良好的组织根本缺乏认真推行营销分析的动机。将分析融入到营销的肌理中，需要将分析视为一项全职投入，一种在逆境和顺境中都持续存在的成熟观念。一个有效的营销分析流程能够缓冲低谷期，放大繁荣期，平抑经济周期的起起落落。\n\
  \n这种对营销分析缺乏热情的现象很容易理解。其背后的心态，与一个体格尚佳的人对待锻炼的态度如出一辙：只要自我感觉良好，就没有迫切的必要。对公司而言也是如此：只要业务还算不错，营销分析就不是优先事项。人们并不否认分析的价值，但对于为此投入精力去推进一项计划也毫无热情。这其中的挑战与说服年轻人购买人寿保险的必要性相似。那些有远见并能进行战略性思考的人，可以预见到未来某天他们会庆幸自己买了保险。从很多方面来看，营销分析就像是一份保险单，通过展示通往繁荣的最佳路径，来保护营销免受最坏结果的影响。\n\
  \n**说明**\n\n当业务景气时，组织可能对推行分析计划毫无热情。\n\n即便是小有成就的公司，也容易滋生自满情绪。这种情绪也会出现在那些尚未达成目标，但自认为正朝着目标迈进，并且轻易就能合理化自己走在正确道路上的公司里。如果这条道路不包括营销分析，那么出于多种原因，他们也不太可能将其加入进来：这是额外的工作、他们不理解它、不知从何入手、目前的做法似乎有效、资源有限且更适合投到其他活动上。诸如此类的理由（借口）几乎数不胜数。营销团队或高管层很容易说服自己不去推行分析计划。\n\
  \n理想的状况是，组织在健康成长的时期就致力于营销分析，在实力强劲的阶段就掌握分析流程及指标的使用。这种营销分析的起步方式效果很好，因为流程有望足够快地成熟起来，从而帮助公司抵御收入下滑。遵循这条道路的公司能够更快地识别出警示性趋势，在应对时更具灵活性，并且由于有了分析流程的支撑，行动时也会更有权威和信心。这是催生营销分析流程的理想情景，但阻碍其实现的壁垒是对现状的满足。\n\
  \n更常见的情况是，某场危机会催生一个仓促上马的营销分析流程。当这种情况发生时，背后存在着某种程度的绝望，而绝望伴随着缺乏耐心。在这种情形下诞生的分析最终也可能成功。但这需要强有力的领导，来引导一个刚开始接触分析的组织，在它期望从分析中获得立竿见影的效果时，依然能坚持到底。这里的风险在于，一个非常好的想法——营销分析——可能会因为未能立即证明自己能拯救公司的困境而被抛弃。这种缺乏耐心正是公司应该在自认为不需要营销分析时就拥抱它的原因，这样它们才能在最需要的时候加以利用。\n\
  \n正如本书所描述的，学习、识别恰当的指标、收集数据以及熟练掌握分析都需要一段时间。从营销分析中获得一些即时收益是可能的，但要让实践成熟并带来全部益处则需要时间。如果非要等到危机才能让一家公司拥抱营销分析，那也只好如此。正确的观点是将其视为一项战略举措，而不是战术上的创可贴。营销人员应抓住任何能为分析打开大门的机遇，并果断地穿过那扇门，绝不回头。\n\
  \n当自满和对现状的满足成为问题时，营销人员可以采取以下措施来激发对分析的热情，并开始将其融入营销的肌理：\n\n*   **强调积极面。** 分析固然可以帮助公司避免跌落悬崖，但它也能帮助公司攀登高峰。在初期阶段，要着重强调能带来上行趋势的指标和分析。这条建议绝非要暗示营销在指标传来坏消息时应把头埋进沙子里。但在初期，使用那些能推动他人关心的改进的指标，能够激发热情。\n\
  *   **带着礼物来。** 分析数据能提供宝贵的洞察。营销人员可以将这些数据分享给那些需要争取为盟友的部门，帮助他们获得原本无法触及的见解。这里需要注意的是，不要让分析数据成为政治工具，理想情况下，整个组织在这些数据方面应完全透明。但对于那些不熟悉此类数据有多大帮助的人，应该将营销分析数据作为礼物赠予，并附上适当的解释和解读协助。\n\
  *   **开展内部公关。** 指望组织仅凭看到分析流程产出的数据，就能自动将所有环节联系起来是不现实的。换句话说，你不能只是把数据扔给组织，就期望他们能赏识它。要主动在内部倡导这一流程，积极宣传其成功，哪怕是最微小的成功。\n\
  *   **保持节奏。** 坚持不懈地推动营销分析实践的开展。要通过宣扬其好处来做到这一点，而不是一味地警告如果不这样做可能带来的可怕后果。恐惧是一种激励因素，但不是最好的那一种。\n\
  \n对于缺乏营销分析热情的组织来说，最坏的情况是一场危机引发了他们对分析的兴趣。那些未能成功将分析纳入公司议程的营销人员，可以做一些背景准备工作，因为他们知道，总有一天，人们会呼唤分析所能提供的那种帮助。\n\
  \n\n\n## 缺失自由\n\n> 真相会让你获得自由，但首先它会让你愤怒。 — 格洛丽亚·斯泰纳姆\n\n市场营销更偏向艺术还是科学？几十年来，这个问题在营销圈内外引发了无数争论，且争论的激烈程度从未减弱。此前，将分析学融入营销体系的尝试曾引发过这场争论，结果往往是相关举措的失败。本章之前讨论的缺乏方向、支持和热情的障碍，可能源于营销部门内部或外部。然而，缺失自由这一障碍几乎总是来自营销部门内部。\n\
  \n在此语境下，自由指的是创作自由。每当讨论限制某人的自由时，反应通常是迅速而激烈的：“除非我死了”或类似强烈的谴责。分析学被视为一套枷锁，将营销束缚在一条冷漠、如临床诊断般的既定路径上，有些人认为这条路枯燥乏味、缺乏创意。当然，这是一种非理性的观点，但这并不能阻止某些人如此反应，当他们面临被迫接受分析学的“威胁”时。\n\
  \n本书的目标并非一劳永逸地解决营销是科学还是艺术的争论，但它会表明一个立场：营销既是一门科学，也是一门艺术。对那些声称营销完全是其中一种的人，请保持怀疑。事实是，营销的这两个极端，虽然看似对立，但彼此需要，并且都是营销蓬勃发展的必要条件。事实上，营销的创意与分析特质非但不相互对立，反而是高度互补的。高效的首席营销官深谙平衡这两种力量之必要，并有意识地将它们管理到适当水平，以驱动最大的营销贡献。\n\
  \n> **注意**  \n> 营销的科学与创意元素并非相互冲突，而是相辅相成：两者都是营销蓬勃发展的必要条件。\n\n想象一下，如果营销几乎完全是分析学的产物，而创意最多只扮演次要的支持角色。这种场景会让人联想到那些平淡无奇的营销资产，通过这样的努力只能产生持续、可预测且增量性的结果。各种指标主导着营销的方向，决定其具体行动。\n\
  \n在这个光谱的另一端，想象一下，如果营销完全是一项创意冒险，而分析学只扮演次要的支持角色。这样的结果更具偶然性。营销资产几乎总是令人惊艳、创新，甚至前卫。但这些资产并非总能奏效。有时，创意的成果是轰动一时的成功，有时则是惨败。在这里，营销犹如坐上成果的过山车，经历无数高峰与低谷。营销在英雄与替罪羊的角色之间摇摆不定。创意主导着营销的方向，决定其具体行动。\n\
  \n前两段描述的两种情况都不应成为营销的常态。历史上，营销更多地处于更偏向创意的光谱一端，这也是为什么对分析学的最大阻力常来自营销部门内部的原因之一。说实话，创意一直被用来转移在营销职能中采用分析学的压力。营销专家兼演说家乔治·托罗克分享了以下看法：“我认为，许多营销人员在无法衡量其成果时，就试图将营销描绘成一门艺术。因此，他们放弃了对营销计划的责任。他们暗示营销完全靠运气。许多自诩为品牌专家的人谈论品牌艺术，却拒绝面对衡量科学。不要被这种花招所迷惑。”⁴\n\
  \n营销（及其内部）的分析性与创意性特质之间需要维持一种平衡与秩序。这首先要建立一种共识：卓越的营销是科学与艺术恰当结合的结果。事实上，营销分析学的支持者和创意型营销人员有相当多的共同立场。长期以来，营销中的创意过程一直是科学方法的一种变体运用，这一点可能许多营销人员并未意识到。他们的创意点子代表了一种假设。将这些点子发展成营销活动和资产的过程，则代表了实验，通过实验观察来判断假设是否成立，或者是否需要提出不同的假设。营销分析学可以登上这个舞台，通过显著加深对这些假设真实程度的理解来做出贡献。\n\
  \n营销分析学不是创意的杀手。如果是，那么它的实施和管理就存在缺陷。在营销组织中，分析学与创意应建立共生关系：分析学指引出需要更多创意的领域，而创意的价值则通过衡量来理解。就分析学和创意而言，整体大于部分之和。\n\
  \n正如本章所讨论的障碍所示，将分析学融入营销体系需要耐心和坚持。将分析流程建立在公司的价值观和愿景之上，为相关举措的启动和成功提供了基础和方向。那些倡导营销分析的人，应预料到会在本章讨论的一个或多个领域遇到阻力。一种耐心且持续强调分析成功的做法，终将赢得怀疑者的支持。\n\
  \n## 脚注\n\n1 利昂·费斯廷格，亨利·W·里肯，斯坦利·沙赫特，《当预言落空：一个预测世界毁灭的现代群体的社会与心理学研究》（明尼阿波利斯：明尼苏达大学出版社，1956\
  \ 年），第 3 页。\n\n2 克里斯·穆尼，“我们为何不相信科学的科学”，《琼斯母亲》杂志，2011 年 5/6 月刊。参见 [`www.motherjones.com/politics/2011/03/denial-science-chris-mooney`](http://www.motherjones.com/politics/2011/03/denial-science-chris-mooney)。\n\
  \n3 同上。\n\n4 乔治·托罗克，“营销——艺术还是科学？”参见 [`www.torok.com/articles/marketing/MarketingArtorScience.html`](http://www.torok.com/articles/marketing/MarketingArtorScience.html)。\n\
  \n\n\n"
- '# 10. 营销分析前沿


  大数据、预测性分析与高级归因


  营销分析并非是一门一旦实施便一成不变的静态学科。开展营销分析的原因没有太大变化，驱动分析工作的核心原则也是如此。然而，分析实践所涉及的方法、技术和工具却在不断演变。营销分析存在着一个前沿领域，而那些勇于探索这片领域的人，正在发现能够带来显著竞争优势的、具有变革意义的洞察。本章将探讨营销分析先驱们当前正在开辟的一些路径。


  事实上，营销分析学科正以令人目眩的速度发生着变化。总的来说，这种变化表现为各类创新，这些创新提供了几年前还无法想象的企业与客户洞察。最前沿的营销分析实践正在以前所未有的细节水平提供更精确的信息，并且这些信息几乎能实时送达营销人员手中。凭借这些信息，营销人员能够以最深入的层次理解客户，准确预测诸如购买和流失等事件。营销人员能够基于数据而非直觉来优化其渠道和媒体组合。营销分析的前沿有望将营销转变为一个无可争议的收入中心，而不仅仅是活动产出者和销售推动者。


  尽管营销分析前沿领域正在发生诸多变化，但本章将聚焦于三个营销人员不能声称不了解的领域：大数据、预测性分析和高级归因。本章其余部分将概述这些概念是什么，以及营销人员为何应予以重视。


  > **注：** 营销分析的前沿正在将营销转变为一个无可争议的收入中心，而不仅仅是活动产出者和销售推动者。


  ## 大数据


  > 没有大数据，你就像在高速公路中间又盲又聋。——杰弗里·摩尔


  自商业诞生以来，理解客户及其行为动机一直是商人的追求。营销肩负着这一使命，传统上，营销人员通过少数几种研究技巧来研究客户，例如过往交易分析、观察、调查和焦点小组。许多组织会维护某种形式的客户主信息档案（通常是更大规模数据仓库的一部分），营销人员可以据此研究客户。然而，这些数据包含的信息集是有限的，其时效性和准确性也参差不齐。尽管有用，但这些数据让营销人员对客户行为的理解十分有限。对许多人而言，这种客户数据现状就是他们当前的现实：陈旧且不完整。


  现代消费者会留下大量的数字踪迹，如果营销人员能够追踪这些踪迹，就能揭示出以往不为人知的模式、偏好和意图信号。想想消费者在任何一天中的典型行为：他们通过手机交流、浏览和发布社交媒体、查看邮件、上网冲浪、进行购买、下载音乐、阅读产品和商家评论。做这些事情的消费者会创建一条巨大的数据轨迹，营销人员可以利用它，而挖掘这些数据正是营销与大数据的交汇点。


  大数据在概念上很容易理解。它就是指数据量巨大且种类繁多，以至于无法通过标准数据库查询工具进行处理和分析的数据集。没有特定的规模标准来决定一个数据集何时变成“大”数据。在这种情况下，“大”更多地指的是分析它的复杂性，而非其规模。当然，它在规模上也是“大”的，因为其绝对数量通常非常庞大。使其变得庞大而复杂的原因是它来自多个来源，并且通常不是一个单一的、离散的数据集。它更应被理解为来自多个来源的相关数据的集合。


  过去，营销人员处理的是结构化数据，因此可以使用像电子表格这样简单的工具轻松访问和分析。事实上，理解结构化数据的一个好方法是：任何能放入电子表格行和列中的数据形式。销售交易数据就是结构化数据的一个典型例子。在分析过程中，营销人员过去处理的几乎所有数据都是结构化的。在对大数据的讨论中，结构化数据当然也占有一席之地，因为它是大数据范畴下的两大类数据之一。


  另一类数据，也是带来最多挑战的一类，是非结构化数据。非结构化数据的一些例子包括数字图像、在线视频、博客评论、在线产品评论、聊天记录、网络研讨会、位置信息、传感器数据和
  GPS 数据等。这类数据数量巨大，并且正以惊人的速度增长。非结构化数据包含营销人员可以用来更好地理解客户及其情感的信息，特别是当他们能够将这些数据与预先存在的结构化客户数据进行匹配时。


  营销人员如何获取并利用这些数据为自己服务？这个应用难题既是挑战也是机遇，因为对大数据的炒作和承诺并非关乎数据本身。如果没有用于挖掘数据价值的工具和应用，数据的价值就微乎其微。大数据本质上代表着一个巨大的势能储备。要将这种势能转化为动能，以释放其所包含的价值，就需要分析。


  > **注：** 大数据的承诺不在于数据本身，而在于其所包含的、通过分析手段才能获取的详细洞察。




  ### 阻碍大数据应用的因素


  阻碍具有营销价值的大数据应用的因素，是大数据的三个 V 特性，即道格·莱尼在 2001 年梅塔集团研究报告中描述的特征：体量、速度和多样性。这些特性有助于解释为何大数据需要新的处理方式，才能将从大数据中提取的洞察与营销及企业决策相结合。


  -   **体量**：营销人员能够获取的数据总量，这个量非常庞大。大数据的机遇在于有能力处理海量现存数据。

  -   **速度**：数据被创建或变得可用的速率。例如，Twitter 上平均每秒约有 6000 条推文。速度带来的挑战在于，是否有能力以数据到达时越来越快的速度来吸收这些数据。

  -   **多样性**：数据类型的多样性，尤其是非结构化数据的多样性和来源的广泛性。大数据意味着有能力同时处理多种来源的数据，例如视频文件、图像、文档、文本、呼叫中心记录和地理位置数据，并形成统一且可操作的数据视图。


  ### 大数据如何为营销人员创造价值


  大数据分析的应用并不仅限于营销领域，但在营销部门内部，它正推动着更智能的决策，以提高营销效率并改善投资回报率。大数据为营销人员创造价值的一些方式包括：


  -   **更高的信息透明度**：通常锁定在不同数据类型中的信息和洞察，现在对营销人员来说变得可访问和可用了。例如，通过利用大数据，营销人员可以更精确地细分客户，从而更好地将产品和服务与客户需求相匹配。

  -   **个性化**：通过大数据分析，营销人员可以对个体客户及其购买模式形成更深入、更精细的理解。有了这种理解，就有可能制定和部署高度个性化的营销方法，从而更好地分配营销预算和资源，实现更高的投资回报率。

  -   **预测建模**：构建精确的模型，帮助组织了解客户将如何对特定行动（例如价格变动或新的条款与条件）做出反应。

  -   **情感分析**：由于大数据分析考虑了来自许多不同来源的数据，例如社交媒体，因此有可能识别出客户或公众对某个公司、产品或服务的情感倾向。

  -   **行为分析**：利用大数据分析趋势，帮助营销人员了解客户在市场条件、促销活动、优惠券、竞争压力或正在发生的各种情况下的反应方式。这种分析让营销能够精炼策略并开发能与客户产生共鸣的信息。


  ### 大数据的挑战


  以上仅仅是营销人员如何利用大数据的几个例子。这些益处揭示了大数据如此受关注的原因。当营销人员争相利用分析技术时，他们也面临一些挑战，其中许多与之前提到的三个 V
  特性有关。由于有如此多的数据需要营销人员考虑和使用，如何正确存储和管理这些数据便是一项挑战。大数据分析需要不同的软件、工具和技能来执行，许多营销组织发现，不仅团队内部缺乏这些，甚至组织其他部门也难以找到。随着组织开始利用大数据，许多人发现他们需要为营销团队增加技术技能。大数据正在将营销带到一个前所未有的领域，但其承诺的结果正促使越来越多的营销人员涉足这片陌生而新奇的土地。


  #### 人员挑战


  对于希望利用大数据的营销人员来说，人员挑战是一个主要障碍。大数据分析需要具备某些技能的人员，而这些人员以前从未在营销部门工作过。大数据营销团队成员理想的技能组合包括：


  -   **数学技能**：构建、理解并处理通常复杂的数据集和模型所需的技能。这是大数据分析的理论层面。这些技能通常与科学家相关。

  -   **技术技能**：使用软件和工具从各种来源检索、分析、管理和存储数据的技术熟练度。这些技能通常与 IT 部门的人员相关。

  -   **洞察力**：解读大数据分析的输出结果并辨别“全局”影响的能力，将其转化为营销应采取的行动。这种能力通常与研究人员相关。

  -   **沟通能力**：与需要听取结果的人员分享结果并激励他们采取相应行动的天赋和技巧。这种能力通常与富有远见的领导者相关。


  快速浏览这份必要的技能清单会发现一个事实：不仅拥有这些技能的人不在营销部门工作，而且几乎很少有人能同时具备所有这些技能。这些技能代表了一种罕见的组合，很少能集中体现在同一个人身上。有可能在同一个人身上找到数学技能和技术技能，或者洞察力和沟通能力，但很少能集齐全部四项技能。对于大多数寻求利用大数据的营销人员来说，这个人员挑战是最大的障碍。许多组织正在做的，是在内部培养这些技能的同时，将数学和技术技能外包出去。


  > **注意**：利用大数据所需的最佳技能组合——数学、技术、洞察和沟通——通常在营销部门中是找不到的。


  #### 数据挑战


  当营销部门开始使用大数据分析时，另一个主要的挑战领域当然是数据本身。协调众多数据源非常困难，因为组织通常以不同的格式、结构和数据库存储营销想要使用的数据。创建一个统一的、协调的数据视图，以便营销人员轻松使用，即使不是不可能，也是非常困难的。在这些挑战之上，还有与安全和隐私相关的担忧和问题，这通常是因为部分数据存储在云端或存在漏洞的系统中。在急于利用大数据的过程中，一些组织可能没有充分考虑如何保证数据安全，而数据泄露在金钱和声誉上都会造成严重损害。


  ## 展望未来


  尽管这些风险和挑战看似令人生畏，但它们不应阻止营销人员去试水大数据。所有风险都是可控的，所有挑战也并非无法克服。大数据能够提供的机遇和优势实在太大了，不容忽视。希望在大数据方面取得进展的营销人员应遵循以下行动计划：




  '
- '# 排版后的内容


  从愿景开始。拥有愿景是成功利用大数据分析的起点。愿景为努力指明方向，且越具体的愿景越好。一个良好的愿景示例是：了解哪些客户最有可能流失。理想情况下，你为大数据分析设定的愿景应与具体的业务目标保持一致。获取并培养技能。大多数营销团队不具备内部技能来推行大数据分析项目。在深入大数据领域之前，评估你的技能并找出不足之处，制定计划加以弥补。这些不足通常是技术技能，在初期用于设计和实现支持分析工作的大数据架构时必不可少。初期可借助顾问和外部服务来弥补技能差距。确定试点项目。通过利用大数据解决真实的营销问题来证明其价值，即使规模很小。试点项目有助于证明对大数据分析进行长期投资的商业案例，并建立必要的内部支持。它能清晰聚焦推进所需的技能，帮助定义衡量未来成功的正确指标，并明确进一步推进所需的架构要素。设计大数据架构。根据你对大数据分析的愿景和目标，规划实现它们所需的架构。你的架构范围将包括支持组织中大数据分析所需的系统设计、数据流、时间安排和数据模型。评估不同的大数据工具和平台，提出建议并进行采购。呈报大数据商业案例。成功的试点项目经验、技能评估和架构计划是创建商业案例的必要组成部分，该案例应能轻松获得批准，以加大在大数据分析方面的投资。


  大数据通常始于公司的商业智能部门。企业正在利用大数据分析来理解并吸引客户，从而激发更高的忠诚度。他们可以做出更明智、数据驱动的决策，抓住机会提升营销投资回报率、开发新机遇、针对特定目标市场定制促销活动，并帮助优化营销策略。


  ## 预测分析


  > 任何足够先进的技术都与魔法无异。 —阿瑟·C·克拉克


  任何关于大数据和营销的讨论常常会引出预测分析这一话题。虽然这些术语或过程不能互换，但大数据与预测分析是相辅相成的。预测分析“利用统计学、机器学习、数据挖掘和建模来分析当前和历史事实，以对未来事件进行预测。”⁴
  虽然它仍属于分析范畴，但因其前瞻性而截然不同。所有其他类型的营销分析都告诉我们已经发生了什么——也许非常近期发生——但仍然是回顾性的。预测分析使营销人员能够以惊人的准确性预知将要发生的事情。一些人通过使用预测分析获得的结果几乎像是魔法一般。


  营销人员使用的大多数自动化和分析工具虽然非常有帮助，但它们提供的是潜在客户生成过程绩效的历史视图。事实上，营销人员能够非常精确地了解各项活动的表现以及营销漏斗中的瓶颈所在。然而，这项技术无法充当能够显示漏斗中潜在客户未来转化情况的水晶球。营销人员发现自己正试图从历史分析数据中——即通过后视镜——挖掘出最大的价值，以从活动和潜在客户生成过程中榨取最后一滴绩效。而预测分析所做的正是为销售和营销部门提供那个水晶球：对漏斗中哪些潜在客户会购买以及何时购买做出准确预测。


  最好将预测分析视为“预测智能”，它伴随营销人员构思创新方式，通过各种内容、促销和优惠与潜在客户及现有客户建立联系。它帮助营销人员了解漏斗中潜在客户的购买倾向，从销售角度区分良莠。预测分析能预测客户对这些影响策略的响应程度。它审视这些策略可能产生的积极和消极结果，向营销人员展示哪些人最不可能回应优惠，哪些人最有可能购买或回应优惠。


  > **注意**

  >

  > 预测分析帮助营销人员了解销售漏斗中潜在客户的购买意愿及购买时机。


  因此，预测分析在利润公式的成本和收入两端都发挥作用。通过了解哪些人最不可能回应优惠，营销部门可以节省预算，将这些数据库中的潜在客户从未来的直邮或电话营销活动中剔除，或许选择通过成本更低的渠道进行接触。相反，当预测分析帮助营销人员了解哪些人最有可能回应时，营销部门可以通过向那些最可能接受的潜在客户提供优惠来增加收入。


  从组织角度来看，预测分析有助于推动收入增长。从营销角度来看，它有助于维持较高水平的绩效。没有预测分析，营销活动就只能依赖试错法，不断尝试确定活动和媒介组合参数的最佳搭配，以从努力中挤出一些增量改进。预测分析可以缩短这一试错过程，通过准确预测潜在客户购买的可能性、购买量、购买内容以及购买时间来实现。



  ### 预测分析与个性化


  个性化技术是预测分析的有力辅助手段，它根据已知的用户特征和偏好，动态定制向访问者呈现的数字内容。消费者在访问 `Amazon.com` 或 `Netflix`
  等网站时，会经常体验到这一点。这些公司利用预测分析来了解访问者的兴趣，然后推荐其他可观看或购买的内容。`Netflix` 的一位发言人描述了该公司如何运用预测分析：“我们会追踪你看什么、看多久，以及电影是否有圆满结局、浪漫程度如何、暴力程度如何，是烧脑型影片还是轻松搞笑型。”⁵
  迄今为止，面向消费者的营销人员（B2C）在运用预测分析方面做得最为出色，而面向企业的营销人员（B2B）正通过观察他们来学习如何应用。


  预测分析的起点，是组织客户关系管理（`CRM`）和营销自动化系统中捕获的数据。这些数据根据潜在客户与公司数字推广活动（如网页访问、邮件打开等）的互动，为营销人员提供了一份数字画像。这便是大数据登场之处：该数字画像会与来自各种渠道（例如社交媒体帖子）的公开数据相结合。通过与成功销售交易的特征进行对比，进而做出预测。虽然这个过程概念上很简单，但预测分析的核心在于整合更多数据来源并全面分析，从而更精准地判断哪些潜在客户正显示出购买意向。


  鉴于预测分析的能力，营销人员对其趋之若鹜并不难理解。然而，它很大程度上一直是大型企业的专属领域，因为部署相应基础设施需要一定的资源和技术专长。直到最近，如果一个营销团队的组织架构图中没有“数据科学家”这个角色，那么它进行预测分析的可能性就微乎其微。不过现在，许多解决方案提供商正在提供基于云的服务，旨在让大众都能用上预测分析。简而言之，它正变得越来越主流，操作也日益简便。


  当下正是营销人员了解预测分析能力与优势的时机。拥抱它所提供的洞察力似乎是不言自明的事，但它并非适合所有企业。例如，如果公司的产品并非通过审慎的购买流程（即经历需求认知、发现、考虑和决策这几个阶段）进行销售，那么预测分析就不太适用。换句话说，对于冲动型购买的产品，预测分析无法提供太多价值。当公司的解决方案是通过审慎的购买流程获得时，仍存在一些准备就绪的问题需要考虑。其中最主要的是文化上的准备——即承诺运用并成功实施预测分析所必需的文化氛围。对分析技术持抵触态度的组织远未准备好迈出这一步；以数据为导向是成功的先决条件。


  ### 高级归因


  > 将归因视为分析中的花生酱和果酱。没错，它们各自单独品尝都很棒，但对许多人来说，两者结合更佳。——娜塔莎·蒙卡与比尔·基


  营销人员面临的一个持续挑战，是如何证明他们的努力带来了商业成果。营销人员凭直觉知道自己的工作会产生一些效果，但具体效果程度往往很模糊，因为很难精确了解各种营销活动、广告和促销是如何协同作用产生结果的。如果营销仅通过单一媒介渠道开展一次活动，那么将商业成果归因于这些努力就很简单。但现代营销发生在复杂的舞台上，客户旅程复杂且大多不为营销人员所见。它跨越多种设备，通过多渠道传递的混合媒体类型展开。营销人员如何才能确切知道媒体流中的哪一部分产生了结果？营销人员清楚自己所生产的媒体流中有一部分发挥了影响力，但究竟是哪一部分？掌握如何将结果准确归因于努力的方法，将为优化营销活动提供强大手段。


  在互联网时代之前，营销人员可以向潜在客户邮寄直邮广告并等待回应。将回应与邮件匹配并确定转化率很容易。据此计算每用户获取成本和营销活动`ROI`的分析方法也很简单。不难知道转化应归因于什么，因为直邮广告是媒体流中唯一能产生转化的要素。


  如今，互联网已成为主要营销平台，可供营销人员使用的在线渠道数量持续激增。营销人员会同时使用其中许多渠道，用得越多，就越难弄清哪些组件对转化贡献最大，哪些则是徒劳无功。已知的是，营销媒体流的集体影响力产生了转化。但哪个部分在创造认知方面做得最好？哪个最能触发购买？许多营销人员的权宜之计是，无论媒体流多么多样化，简单地将全部转化功劳归因于媒体流中的最后一个接触点。然而，这种“最后一次点击”的归因方法并不精确。


  营销人员需要更深入地了解其所有媒体的表现，以便优化整个媒体流。仅仅将转化功劳归因于媒体流中最后一个被点击的元素，是一种完全不准确的方法，因为大多数营销人员使用的媒体数量庞大且种类繁多。媒体流越长、越多样化，最后一次触点归因准确报告哪一部分对转化贡献最大的可能性就越低。渠道的多样性使得精准归因变得困难，而客户跨设备消费内容的方式则进一步加剧了归因难题。一笔销售交易可能始于电脑端在线操作，却最终在移动设备上完成。




  要理解这一挑战，请考虑以下场景：一名消费者在工作时用电脑看到付费搜索广告，进而访问了卖家的网站，并在网站上下载了一份免费的买家指南。第二天，该消费者收到卖家发送的、带有折扣优惠的电子邮件，在她下班乘火车回家的路上，她用手机点击了该优惠信息，进行研究，并最终完成了购买。在这一场景中，媒体流中的哪个要素应获得此次转化的功劳？下载的买家指南可能极具影响力，但如果使用的是“最后点击”归因模型，那么电子邮件将获得此次转化的功劳。这会导致在优化媒体流的哪个部分或进一步投资何处时做出错误的决策。


  营销人员需要一种整体性的方法，该方法要考虑消费者或买家看到的一切，即从客户角度出发的整个媒体流，并涵盖所有渠道和设备。有了这些信息，营销人员就能准确理解媒体流中各要素在转化中的影响力。获得这种媒体表现视图之所以必要，是因为客户的转化是由客户看到的所有内容共同驱动的，而不仅仅是其中一部分。对现代营销人员来说，好消息是，有一种方法可以获得关于其营销活动的此类信息，它被称为高级归因或数据驱动归因。


  > **注意**：高级归因帮助营销人员理解客户看到的媒体流中的每一个要素是如何促成或影响转化的。


  高级归因是一种方法，用于在客户购买旅程中接触到的整个媒体流中，恰当且精确地分配部分转化功劳。营销人员可以了解其内容和媒体选择如何帮助产生转化，以及媒体流中每个组成部分对转化的贡献程度。这种级别的归因是营销人员长久以来梦寐以求但未曾想到能够实现的。高级归因已不再属于科幻小说或一厢情愿的范畴：它已成为现实！


  通过使用高级归因，营销人员可以知道其营销活动中的哪些组成部分产生了转化，甚至可以知道这些组成部分在转化事件发生前多久就对转化产生了影响。这些信息使得区分哪些媒体要素创造了认知、哪些促进了兴趣、哪些对转化最具影响力变得容易得多。通过使用高级归因，营销人员对其营销活动的现状获得了极大的清晰度。这些信息使他们能够做出更明智的决策，了解在购买周期的不同阶段，媒体流的哪些要素最为有效，从而更有效地利用它们来获得更好的响应率和转化率。


  高级归因的能力使市场营销能够回答一系列曾令人心生恐惧的问题：


  -   每个营销渠道对营销成果的贡献是部分的还是递增的？

  -   如果营销部门获得更多的活动或促销预算，最佳的投资方向在哪里？

  -   如果营销部门的活动或促销预算被削减，哪里是削减时对结果影响最小的部分？

  -   关键营销活动变量——创意、设备、受众和策略——的差异如何导致不同的结果？

  -   这些关键营销活动变量如何相互作用或协同工作以产生结果？

  -   为实现最佳业务成果，策略和媒体渠道的最佳组合是什么？


  对于使用高级归因的营销团队来说，当他们的高管想要知道需要花费多少才能产生所需收入时，答案不再是一个有根据的猜测。


  到目前为止，关于高级归因的讨论都假设营销所做的一切都发生在数字领域。在实际应用中，营销活动经常融合数字媒体和传统（线下）媒体来产生转化。例如，零售商可能会在某个活动或促销中利用多个数字渠道，同时通过邮寄方式发送优惠券，并在客户兑换时进行追踪。优惠券兑换数据会被添加到关于这些客户如何受到其接触过的数字媒体影响的已知信息中。通过这种方式，零售商就能全面了解各个渠道是如何共同影响客户的。高级归因的范围不仅限于数字媒体，也可以像本例一样包含传统媒体。它能提供关于影响转化的一切因素的整体视图。


  高级归因带来的竞争影响是巨大的。对于关键参与者严重依赖数字媒体的市场，高级归因有能力使竞争格局向使用它的企业倾斜。那些不使用高级归因的企业会陷入持续努力，艰难地寻找媒体表现的渐进式改进，因为他们做出的媒体决策并不总是奏效。而那些使用高级归因的营销人员则对转化功劳归属有着清晰的认识，使他们能够做出已被证明有效、更明智的媒体选择。高级归因提供了一个理解转化功劳真正归属的新窗口。它把强大的杠杆交到了营销人员手中，使其能够从使用的每个渠道中提升销售额。


  本章介绍的三种分析类型目前处于营销分析的前沿，但这种情况不会持续太久。所有这些解决方案都在当前被使用，有时是组合使用。营销人员对大数据、预测分析和高级归因的使用日益增多，这正提升着人们对它们益处的认识，同时其成本和易用性也在改善。目前，这些方法对于中型甚至小型公司来说都已经完全可以触及。它们不再仅仅是资金雄厚的大型企业营销团队专属的领域。从这些——以及大多数创新的解决方案和方法——中获取优势的关键在于快速行动并迅速部署。换句话说，利用它们所需的时间越长，这些方法就越主流，它们所能提供的差异化优势也就越小。


  今天的边疆就是明日的文明之地。大数据、预测分析和高级归因也是如此：总有一天会“人人都在使用”。那些希望将自身绩效提升到更高水平并将营销转变为真正收入中心的营销人员，应当时刻瞭望地平线，寻找下一个即将显现的创新。


