  \n图 2-5.\n\n近四分之一的组织在其营销预算中未为分析分配任何资金\n\n进一步分析图 2-5 中的数据，可以深入了解分析资金与有效性之间的关系。8%的研究参与者将超过\
  \ 10%的营销预算投入到营销分析上。在精英群体中，50%的人报告说他们正在追踪在整个组织内具有可见性的有意义分析指标（图 2-4）。这一分析成熟度水平几乎是预算支出在\
  \ 6%到 10%之间的组织的两倍，是预算支出低于 5%的组织的三倍。此项分析清楚地表明，更多的投资能带来更高的分析数据可见度。那么，这种可见度是否也等同于更好的结果呢？尽管可见度很重要，但结果才是关键。\n\
  \n对图 2-5 中预算数据的进一步分析显示，在营销分析投资上存在一个明显的回报递减点。将营销预算的 6%到 10%用于营销分析的组织取得了最佳结果，其中 51%报告称通过分析实现了营销效果的最高改善率。对于预算支出超过\
  \ 10%的精英群体，45%报告了最高的改善率；而对于分析预算低于 5%的组织，40%属于最高改善率范围。因此，最佳投入点似乎是将营销预算的 6%到 10%分配给分析。\n\
  \n\n\n## 对营销分析的态度\n\n公司内部存在营销分析流程，并不一定意味着对分析持积极态度。事实上，对于被测量和追踪的营销分析数据，近四分之一的公司报告称“似乎没人使用”。⁵\
  \ 在某些公司，高管们迫使营销团队强行推进分析工作。在这种情况下，对分析流程的抵触情绪相当高。尽管该流程往往能争取到一些转变者，但要克服营销团队在面对被强加的分析任务时通常表现出的被动抵抗，仍然是一场艰苦的战斗。\n\
  \n较少见的情况是，推崇分析的营销团队无法让公司其他部门注意到该流程所能提供的价值。同样，随着时间的推移，营销团队很可能也能赢得对此流程的转变者。无论哪种情况，分析流程带来的实际成果都极具说服力。\n\
  \n这两种立场反映了组织内部可能存在的对分析的不同态度。对于任何举措而言，最大的障碍往往是态度上的，因此，在我们审视营销分析格局时，了解塑造它的各种态度的普遍性会有所帮助。“需求指标”（Demand\
  \ Metric）研究也揭示了关于分析存在的各种态度及其广泛程度。图 2-6 总结了关于这些态度的数据。\n\n![A978-1-4842-0259-3_2_Fig6_HTML.jpg](img/A978-1-4842-0259-3_2_Fig6_HTML.jpg)\n\
  \n图 2-6.\n\n绝大多数情况下，对营销分析的主流态度是认为其作为一种管理工具至关重要\n\n在图 2-6 所示的五种态度中，只有两种是消极态度，且仅占调查样本的\
  \ 8%。其余三种态度是积极的。在接下来的段落中，我们将详细探讨这些态度。\n\n最不普遍的态度认为，定义一套有意义的营销分析指标是不可能的。断然声称无法得出一套有意义的指标，这不过是一种巧妙包装的“不愿意”声明。当然，任何营销组织通过充分的思考和规划，都有可能识别出一套有效的绩效指标。尽管这种态度很少见——也许是因为很少有\
  \ CEO 能够容忍它——但它往往与那些不希望事实或分析数据干扰其营销议程的 CMO 相关。简单地用一句“不可能衡量营销努力的结果”来否定分析，要么是完全无知，要么是傲慢自大。诚然，精确衡量营销业务影响可能存在障碍，但没有任何障碍是无法克服的。\n\
  \n图 2-6 中第二种消极态度也并非常见：该研究中仅有 5%的样本报告称，分析数据太容易被营销部门以外的人误解。通常有三种驱动因素导致这种态度。第一是合理的担忧，即那些不理解或不欣赏分析数据的人可能会不当使用它们。第二是担心分析会暴露营销部门的糟糕表现。第三是傲慢。\n\
  \n认为分析数据太容易被非营销人员误解这一态度的第一个根本原因，是对后果的合理恐惧。分析数据，尤其是在初次实施时，并不总能讲述一个令人愉快的故事。如果营销部门对其分析数据完全透明，一些营销部门之外的人可能会抓住机会，利用这些数据谋取政治利益。然而，真正需要发生的是，营销部门有机会利用这些数据进行改进，而这可能需要完成几个周期的测量和分析。如果公司内部存在一种功能失调的文化，这种情况就更难发生。在这种文化下，营销部门可能有充分的理由担心完全的分析透明。不幸的是，在企业环境中，并非所有文化都是健康的。任何在营销领域工作时间够长的人，或许都能分享一些因透明地沟通分析和绩效数据而受到惩罚的经历。\n\
  \n认为分析数据太容易被非营销人员误解这种态度的第二个驱动因素是缺乏安全感。这种不安全感的根源在于 CMO 知道，有意义的分析数据会暴露营销部门的糟糕表现。即使没有分析数据，营销人员对自己工作所产生的影响也有相当好的直觉。对于对自己团队表现缺乏安全感的营销经理来说，一种生存策略是避开分析，用一连串的活动来粉饰团队，并空谈结果。当\
  \ CEO 建议或下令使用分析时，这会让这些 CMO 心生恐惧。在这种情况下，几乎自动的反应就是：“分析数据太容易被非营销人员误解了。”其目的是将营销描绘成某种深奥的艺术，一种如此神秘的实践，以至于只有行内人士才能指望理解其中的分析。具有讽刺意味的是，一个恰当的分析举措恰恰能为这个营销组织提供改进数据，从而消除对被“曝光”的恐惧。\n\
  \n第三个驱动因素纯粹是傲慢。当傲慢作祟时，营销部门实质上是在向组织其他部门传达：其所做的事情是外人无法理解的。从外人的角度来看，作为这种态度的驱动因素，不安全感与傲慢之间并无明显区别，因为两者都将营销描绘成不可理解之物。然而，无论哪种情况，其最终效果都是建立一道烟幕，以掩盖营销的真实绩效，而这源于反对营销分析的故意决定。事实仍然是，对营销分析数据含义进行适当的教育和沟通，就能消除对误解的担忧。\n\
  \n图 2-6 中描述的第三种态度承认分析可以为营销提供一些所需的公信力。不使用分析数据来证明其贡献的营销组织，其公信力很容易受到质疑。最坏的情况下，当营销组织在其所服务的组织内部的公信力受到质疑时，其自身的存续都可能面临威胁。最好的情况下，当营销存在公信力问题时，它将难以获得其希望部署的战略和活动的认可。调查样本中\
  \ 20%选择这种态度选项的人，承认了拥有分析流程的好处之一：拥有数据证明营销有效性的公信力。伴随这种公信力而来的是 CMO 极大的自主权和授权。第 3 章将更详细地探讨这个问题。\n\
  \n\n\n图 2-6 所示的第四种态度（在调查样本中占比 25%）认为，分析有助于展示营销创造的价值。这种态度揭示了一个现实：营销组织可以通过分析来证明其对收入的影响。除了通过一系列将营销活动与业务成果联系起来的指标外，首席营销官（CMO）别无他法能够说明直接归因于营销的收入份额。每个营销组织都应努力向公司证明自己的价值。即使营销组织通过启发性的创意活动和执行创造了内在价值，它们仍然需要提供所交付价值的证据。而分析流程正是提供这种证据的方式。\n\
  \n图 2-6 所示的第五种也是最后一种态度是持有最广泛的。近一半的受访者认为，作为帮助管理营销流程的仪表板，分析至关重要。这种态度代表了分析流程的最终目标：将其输出作为管理工具，持续改进营销工作。分析有助于证明营销的可信度，并且是展示营销价值的一种方式。这些收益源于将分析用作指导营销工作的仪表板。因此，这种态度代表了营销人员的首要分析目标：建立一个能够作为有效仪表板来指导营销工作的分析流程，随之而来的将是可信度和可证明的价值。\n\
  \n## 营销分析面临的挑战\n\n找到一些营销指标来衡量和报告固然容易。然而，对大多数公司而言，创建一个能够衡量和追踪有意义内容的分析流程却复杂且时常困难。构建有效分析流程面临的挑战范围广泛，涉及态度、技能、技术和资源等方面。仅有\
  \ 6%的公司声称没有任何与营销分析相关的挑战。⁶ 图 2-7 总结了公司在营销分析工作中面临的最大挑战。\n\n![A978-1-4842-0259-3_2_Fig7_HTML.jpg](img/A978-1-4842-0259-3_2_Fig7_HTML.jpg)\n\
  \n图 2-7.\n\n94%的组织报告称在营销分析方面面临某种挑战\n\n值得注意的是，什么不是营销分析面临的重大挑战：即接受度或支持度。在本数据来源的调查中，超过半数的参与者是营销领导者：包括\
  \ CMO、品牌经理、营销副总裁、营销总监或营销经理。通过这项调查，他们告诉我们，获取自己团队的支持几乎不成问题。营销团队成员明白，拥有分析流程符合他们的最大利益。获得高管或管理团队支持的挑战也微不足道。这合情合理，因为哪位高管或管理者会通过不支持分析计划，来向营销团队暗示其不想要问责制、投资回报率（ROI）或可衡量的价值呢？对于\
  \ CMO 而言，缺乏上下级的支持并不是分析的严重挑战。\n\n最大的挑战是缺乏衡量和追踪营销分析的系统或基础设施。现代营销组织使用多种渠道，其中大部分是数字渠道，而营销制作的活动和内容是在多种设备上被消费的。这种环境带来的问题不是缺乏分析数据，而是数据过多。涌向营销团队的数据量和种类之多，让人感觉像是在对着消防水管喝水。要捕捉这些数据并将其作为分析流程的一部分充分利用，就需要一定的技术。这些数据过于庞大和多样，无法通过人工流程处理。分析计划需要技术辅助来捕捉数据并使其有意义。第\
  \ 8 章将探讨现代营销人员可以用来克服营销分析系统挑战的一些工具、系统和技术。\n\n缺乏进行营销分析的时间或人员是另一个重大挑战。实施分析流程是一项战略性工作，对于忙碌的组织而言，花时间规划和执行它，就像在车辆行驶途中更换轮胎一样困难。这些忙碌的营销组织期待某个风平浪静的时刻，以便能有时间进行恰当的规划，从而很好地实施分析。然而，在忙碌的组织中根本不存在所谓的闲暇时间。大多数组织之所以忙碌，是因为在没有分析流程的情况下，活动本身就是进展的证据。那些声称没有时间做分析的组织，恰恰是最需要分析的组织。对他们而言，停下营销这辆车（哪怕是为了做出能提升性能的改进）的想法，是令人深恶痛绝的。\n\
  \n\n\n## 分析团队的人员配置\n\n分析团队的人员配置是一项挑战，它反映了企业的优先级。很少有营销组织——即使是那些借助有效分析流程来指导工作的组织——声称拥有所有需要的员工。分析流程是营销卓越与成就的基石。未能为这一流程配备足够的人员都是不可想象的，因为这一因素对营销的长期成功至关重要。分析职能的人员配置应享有最高优先级，因为该流程的产出有助于为其他营销领域的人员配置和资金投入提供商业依据。\n\
  \n## 知识或专业技能\n\n知识或专业技能的缺乏是营销分析面临的另一项挑战。营销人员应该问的问题是：哪方面的知识或专业技能？只要有营销学科存在，深入了解客户和产品就始终至关重要。这一点永远不会改变。当分析进入视野时，人们很自然地会认为统计能力是必备的。理解统计过程当然不会是一种负担，但它也并非当务之急。\n\
  \n### 技术技能\n\n对现代营销人员而言，日益关键的是技术技能，或者更准确地说，是科技技能。有效利用我们可用的软件和技术的能力，正迅速成为营销简历上的关键区分点。那些处于行业顶端的、熟练的现代营销人员，将传统的营销创意技能与技术技能融为一体。“软件是营销与现实世界的接口，”斯科特·布林克说道。\n\
  \n现代营销人员无需了解图 2-1 中描绘的每一种解决方案，但他们很可能会用到其中大多数类别中的一种解决方案。这些解决方案能够捕获和追踪分析流程所需的绩效数据。对营销人员来说，好消息是这些解决方案的功能在不断增强，同时使用起来也变得更加简便。尽管如此，牢固掌握营销技术已不再是奢侈，而是必需，营销人员不能将营销的技术部分外包给\
  \ IT 部门。现代营销组织必须投资于获取和提升自身的技术能力，这不仅是为了在分析方面取得成功，也是为了完成营销的全部工作。\n\n## 识别与追踪有意义的分析指标\n\
  \n图 2-7 总结的最后一个挑战是识别与追踪有意义的分析指标。尽管仅有 16%的研究参与者选择了这一点，但它或许是在通往数据驱动之路中*最难克服的挑战*。一旦其他所有挑战——系统、资源、人员配置和技能——都被克服，这个挑战依然存在。\n\
  \n营销人员无需深入探究分析的细节，就能理解这一挑战的严重性。现代营销活动会产生大量的数据。从中挑选一些内容、开始追踪并制作一些带有看似正确方向趋势线的摘要图表，是相对容易的。问题在于相关性。例如，知道某次特定的邮件群发获得了高于平均水平的打开率，或者知道一篇社交媒体帖子被分享了多少次，这令人满足。这些事情相对容易统计，但它们在创造价值方面有多重要呢？正如威廉·布鲁斯·卡梅伦所言，“并非所有可数之物都重要，也并非所有重要之物都可数。”\n\
  \n营销人员面临的挑战是识别出真正重要的指标。这一过程不能从寻找任何现成的指标或仅仅追踪现有的营销流程开始。相反，指标的识别过程必须始于理解营销所追求的战略目标。这是一种自上而下的方法。不这么做就是本末倒置。营销部门必须确定哪些指标能够证明其在追求目标过程中所取得的成效、创造的价值或产出的有意义成果。\n\
  \n在确定了最佳指标后，理想的情况是这些指标能够实时地从某个系统中直接提取出来，并形成易于理解、可共享的报告。有时这可以实现。但更多时候，并没有一条简单直接的途径来获取用于分析流程的最佳指标组合。营销人员会发现他们必须从多个来源推导出正确的指标组合，通过混合和计算数字，最终得出能够真正反映流程运行状况及其所创造价值的东西。这是一个规划、测试和优化的过程。完全做对可能需要几个报告周期，即便如此，还需要定期验证这些数字是否仍然具有意义。\n\
  \n\n\n## 营销分析能力\n\n本章探讨了与营销分析相关的图景、态度和挑战。在描绘了整体概况之后，我们以一个关于营销分析能力与局限性的简要、高层级讨论作为总结。\n\
  \n截至目前，本书已使用了多种隐喻来描述营销分析：仪表盘、仆从、护栏等等。这些隐喻准确地传达了人们对营销分析作用的理解：提供方向和指导。当正确实施时，分析过程会持续输出一系列有用的信息，用于：\n\
  \n-   **了解营销绩效。** 内部使用方面，分析过程使用的指标能告知营销部门自身的表现如何。借用仪表盘的隐喻：当指针处于绿色区域时，营销部门可以自信地继续开展工作，甚至加速推进工作；当指针处于黄色区域时，则表示某方面即将出现故障，需要关注；当指针处于红色区域时，营销部门就能确定某方面出现了问题，故障流程需要彻底检修或弃用，转而采用更好的方案。\n\
  -   **报告营销绩效。** 外部使用方面，分析过程的输出结果（或至少是部分结果）有助于向组织其他部门展示其在营销投入上获得了回报。分享工作成果能在整个组织内建立对营销工作的信心，帮助首席营销官（CMO）维持营销部门在重大决策会议上的席位。\n\
  \n分析为营销组织提供了这些重要的能力。但同样也存在局限性。分析不会引领方向。这个过程在功能上并不等同于营销团队的自动驾驶仪。营销职能若要蓬勃发展并为所服务的公司提供最大价值，就需要\
  \ CMO 提供强有力的、富有远见的领导。CMO 对营销的愿景应包含一套分析流程。愿景与分析的结合将创造出绩效最高、能够全面解释其工作并持续做出贡献的营销职能。这代表了每一位\
  \ CEO 对营销的期望。\n\n**脚注**\n\n1 “营销报告卡：保住我们在会议桌上的席位，” Demand Metric Research Corporation，2014\
  \ 年 3 月。[`www.demandmetric.com/content/marketing-report-card-benchmark-report`](http://www.demandmetric.com/content/marketing-report-card-benchmark-report)。\n\
  \n2 同上。\n\n3 “2013 年营销分析：基准、洞察与建议，” Demand Metric Research Corporation，2013 年 3\
  \ 月。[`www.demandmetric.com/content/marketing-analytics-benchmark-report`](http://www.demandmetric.com/content/marketing-analytics-benchmark-report)。\n\
  \n4 同上。\n\n5 同上。\n\n6 同上。\n\n7 斯科特·布林克，营销技术专家：营销矩阵中的尼奥。[`chiefmartec.com/2013/12/marketing-technologist-neo-marketing-matrix/`](http://chiefmartec.com/2013/12/marketing-technologist-neo-marketing-matrix/)。\n\
  \n8 威廉·布鲁斯·卡梅伦，《非正式社会学：社会学思维的非正式入门》。纽约：兰登书屋，第 13 页。\n\n## 营销分析的影响\n\n给我看钱\n\n希望前两章已经为营销分析提供了令人信服的理由。然而，仅仅收集所有正确的数据输入到合法的营销分析流程中是不够的。营销分析成功的关键在于应用。如果流程得出的结果和洞察未被使用，那么营销分析计划就没什么价值。为了让整个组织受益，分析必须影响思考、决策，并最终影响营销的运作方式。\n\
  \n仅将营销分析视为一种绩效管理工具，就错失了这个流程的意义。诚然，正确实施分析可以帮助营销工作做得更好：更高效、更有效。尽管分析流程应提供有助于营销事半功倍的数据，但归根结底，分析是为了创造收入。分析流程最高和最佳的用途是帮助营销部门作为一个收入中心来运作。当\
  \ CEO 用某种方式说“给我看钱”时，拥有正确分析数据并明智使用它的营销部门就能够做到这一点。\n\n> **注意**\n> 分析虽然有助于提高营销的效率和效果，但其最终目的是帮助营销职能部门作为一个收入中心来运作。\n\
  \n对于拥有分析流程的营销组织来说，肯定有一些极端情况需要避免。第一个极端是拥有了分析流程，但对输出结果不采取任何行动。第二个极端是拥有了分析流程，并期望其输出结果成为营销团队领导力的主要来源——而这其实是\
  \ CMO 或营销副总裁的工作。分析不能替代领导力。营销分析流程的定位应处于这两个极端之间。在这个位置上，分析是真实的，具有影响力，并作为一个参考点来帮助 CMO\
  \ 验证决策和完善战略。\n\n第 2 章介绍了营销分析的现状，以及人们对它们的态度和所面临的挑战。在现实世界中，组织在寻找上述两个极端之间的分析“最佳平衡点”方面做得如何？图\
  \ 3-1 分享了一项研究结果¹，揭示了营销组织如何利用他们所衡量和追踪的分析数据。\n\n![A978-1-4842-0259-3_3_Fig1_HTML.jpg](img/A978-1-4842-0259-3_3_Fig1_HTML.jpg)\n\
  \n图 3-1. 营销分析数据使用情况\n\n图 3-1 显示，近四分之一的拥有分析数据的营销组织处于两个极端中的第一个：他们完全没有利用这些数据。对于这些组织来说，分析不过是瞎忙活。数据中蕴含着提升绩效或至少证明营销贡献的力量，但却被闲置了。这种不使用的情况表明，营销部门要么认为自己已经表现足够好，不需要通过使用数据来提升，要么就是根本不在乎。\n\
  \n最好的情况是，营销部门和 CMO 渴望将分析作为一项持续改进的策略。在没有任何来自上级压力的情况下，理想的营销团队会寻求自我提升，并利用分析作为管理其工作方式的工具。如果缺乏这种改进的热情，公司高管也可以强制要求建立指标并围绕这些指标收集数据，以便进行问责。无论哪种方式，对于那\
  \ 24%不利用手头分析数据的人来说，并不存在要求其使用该资源的问责机制。\n\n\n\n\n在图 3-1 所示的样本中，其余 76% 的受访者分散在四个选项里，表明他们在不同程度上使用了分析数据。这些剩余的回答均非负面，尽管其中一些可能代表了更高或更先进的使用水平。在这四个选项中，有两个——**CMO**（首席营销官）和营销团队对数据的审查——属于分析过程输出的内部使用。\n\
  \n仅在营销部门内部使用和报告分析数据并非坏事。即使这些数据从未流出营销部门，有效的分析数据同样具有影响决策的能力。在图 3-1 中，近半数的营销组织将分析数据保留在内部。最常见的情况是，只有营销团队成员（38%）能够访问并使用这些数据。较少见的是，只有\
  \ CMO（10%）能查看和使用这些数据。\n\n从宏观角度来看，分析数据的主要用途之一是为决策提供信息并验证决策的有效性。即使数据仅存于部门内部，营销分析数据也丝毫不会削弱其在这方面的作用。然而，分析数据的另一个主要用途是作为一种问责机制。将分析数据报告给营销部门之外的人员，通常是高管和其他利益相关者，能够建立起健康的问责水平。当数据留在营销部门内部时，它作为问责机制的大部分效力就会丧失。较低的分析成熟度通常与将数据保留在部门内相关联。\n\
  \n> **注意**  \n> 若分析数据仅停留在营销部门内部，其作为问责机制的很大一部分效力将被削弱。\n\n最高的营销分析成熟度与那些利用分析数据对外报告绩效的组织相关联。图\
  \ 3-1 显示了代表分析数据对外报告的两类回答：向高管团队报告以及向组织内的任何人报告。其中占比较大的是那 18% 向高管团队报告数据的典型营销组织，这是最重要的问责层级。当这种情况发生时，希望产生的一个结果是\
  \ CMO 与 CEO 之间就营销工作内容及其贡献方式展开持续、健康的对话。分析数据是这类讨论的绝佳催化剂，尤其是在 CEO 期望此类问责而 CMO 也愿意主动提供时。\n\
  \n构成对外报告分析数据的两个群体中，较小的是那些实行完全透明的营销组织。它们允许组织内任何想要查看分析数据的人获取这些信息。这种关于营销工作的“无可隐瞒”态度是一种值得称赞的立场，更多组织应当追求但鲜有达到。实践这种透明度的营销团队通常与最高的分析成熟度相关联。\n\
  \n### 分析的影响力\n\n> 我花在广告上的钱有一半都浪费了；问题是我不知道是哪一半。 ——约翰·沃纳梅克，19 世纪零售业先驱\n\n诚然，分析可以帮助营销提升其绩效。通过正确选择指标、收集数据、进行细致的分析与报告，并据此做出决策，分析是一种强大的绩效增强剂。但提升的是何种绩效？这些改进又是如何实现的？如果分析是达到目的的手段，而这个目的就是更好的营收绩效，那么分析是如何帮助我们实现这一跨越的呢？\n\
  \n营销分析的最终目标是营收，一旦明确了营收影响和支出，就有可能推导出营销的投资回报率（ROI），这是第 6 章将进一步讨论的话题。那么，分析过程是如何帮助创造营收的呢？理解营销分析如何影响营收是许多分析项目的根本出发点。\n\
  \n要理解这一点，不妨考虑大多数潜在客户转变为客户的旅程。首先是需求的初步认知，然后是发现潜在解决方案的过程，接着是评估这些方案，并最终做出决定。营销 101\
  \ 告诉我们，潜在客户必须先知晓解决方案，才能考虑它们并最终完成购买。因此，营销的很大一部分工作就是在这个购买周期中尽早建立认知。\n\n建立这种认知有多种方式。在营销的早期阶段，用于建立认知的工具和渠道较少。营销与广告几乎等同，而印刷品是主要渠道。但即便在那个时代，也仍然需要分析数据。\n\
  \n上文引用过的约翰·沃纳梅克，深知缺乏广告活动分析数据所带来的限制。他唯一能用来优化广告的就是自己的直觉。\n\n快进到 21 世纪，营销人员可以支配无数传统和数字渠道来建立认知。信息、创意和渠道的组合如此之多，以至于如果没有分析，几乎无法就优化媒体组合做出明智的决策。分析对现代营销人员而言不可或缺。\n\
  \n现代营销人员建立认知的努力表现为各种营销活动，其期望产出是线索：即那些表明对某种解决方案有某种程度需求或兴趣，并已提供联系方式的个人或企业。对大多数公司而言，线索是销售引擎的燃料。营销的职责是确保持续流入的线索得到培育、筛选，然后移交给销售团队。大多数时候，线索生成过程是营销分析的原点。\n\
  \n测试与分析的恰当结合，可以使线索生成活动要么惨淡收场，要么大获成功。由于营销人员用于线索生成的预算有限，分析便成为重要工具，帮助他们判断哪些活动应该扩大、哪些需要修改、哪些应当放弃。分析提供了营销人员优化活动所需的信息，进而生成更多线索，而销售团队则将线索转化为更多营收。\n\
  \n\n\n## 市场营销中的分析：案例研究与可信度\n\n一个绝佳的例子，说明分析如何帮助营销人员开展更有效的品牌认知和潜在客户开发活动，来自 2008 年美国总统大选。2007\
  \ 年，当时的候选人巴拉克·奥巴马正角逐民主党提名，但在民调中落后两位数。竞选团队的分析总监丹·西罗克认为，访问奥巴马网站的每一位访客都是提升认知度和筹集竞选资金的机遇。网站首页展示了一张候选人奥巴马的大型图片，页面底部有一个行动号召按钮。西罗克面临的问题是，哪种媒体与行动号召按钮的组合能产生最佳效果？\n\
  \n西罗克进行了一系列 A/B 测试（也称为着陆页拆分测试），以确定六张图片和四种行动号召按钮的哪种组合最为有效。所有图片都展示了候选人在不同场景下的形象。行动号召按钮的选项分别标注为“立即加入我们”、“了解更多”、“立即注册”和“注册”。西罗克的目标是找出\
  \ 24 种可能的图文组合中哪种表现最佳，因此他设计了一项实验，向网站访客展示各种组合并收集数据。\n\n他用来衡量成功的指标是注册率——即某测试组合的图片和行动号召按钮促使访客向竞选活动提供电子邮箱地址的比率。在收集到足够数据后，获胜组合得以确定，而这并非工作人员最初青睐的组合。\n\
  \n表现最佳组合的页面注册率为 11.6%，而原先的注册率为 8.3%。这意味着提升了近 41%的效率。在整个竞选过程中，这一差异转化为了近 290 万个额外电子邮箱注册量，平均每笔注册捐赠金额为\
  \ 21 美元。经过分析优化的网页为竞选活动额外带来了 6000 万美元的收益。\n\n在这个例子中，分析通过揭示关于网页着陆页表现的关键信息（否则这些信息将不为人知），在大范围内产生了显著影响。采取本例所述的方法当然需要成本：它需要时间、精力和一些技术投入，而这种投资往往是实施的障碍。然而，这项投资的回报几乎总是超过成本。充分了解信息的价值几乎总高于保持无知所需付出的代价。正如\
  \ MKT Media Group 首席执行官迈克·克拉斯所说：“光明的代价低于黑暗的成本。”\n\n分析无疑将帮助营销人员改进网站上的行动号召和营销活动着陆页，但其影响远不止于此。分析还可以在以下领域发挥影响：\n\
  \n- **品牌认知度**：了解您的品牌所拥有的心智份额以及客户对它的情感倾向。\n- **内容**：确切地知道哪些营销内容消费最广、分享最多，并能产生最佳转化效果。\n\
  - **渠道优化**：比较各种营销渠道（如电子邮件或点击付费广告）的表现，以改进其绩效或仅投资于表现最佳的渠道。\n- **客户理解**：更深入地了解客户行为，从而更好地理解其需求和偏好。\n\
  - **预测智能**：在购买周期早期就准确预测哪些客户会购买以及何时购买。\n\n这份清单仅列举了分析能够产生重大影响的部分领域，而且这些影响不仅限于营销职能，而是贯穿整个组织。然而，分析只有在基于正确的指标时才能发挥这种影响力，这些指标需要被勤勉地追踪、报告并用于影响决策，并且组织认为整个过程是可信的。即使分析流程坚如磐石，如果组织对其缺乏信任，分析也无法以应有的方式影响组织。\n\
  \n### 分析的可信度\n\n拥有一个达到一定成熟度的营销分析流程是一回事，而让该流程的基本输出——数据——享有可信度则是另一回事。决策是基于这些数据做出的，因此，如果希望对这些决策有信心，那么分析流程及其产生的数据必须可靠。营销分析流程必须具有完整性和可信度，以便整个组织能够信任该流程以及由此产生的决策。\n\
  \n仅仅因为营销分析流程收集并报告一组指标的数据，并不意味着每个人都会相信这些数字。对于分析数据准确性和可信度的质疑，可能存在于营销组织内部和外部。有时，怀疑是因为流程可疑或输入数据存在质量问题；其他时候，数据的受益者只是不愿意相信数据所揭示的信息。\n\
  \n任何人怀疑营销部门收集、维护和使用的数据都是常有的事。营销所依赖的大部分数据通常存储在客户关系管理系统和营销自动化系统中。这些数据通过多种途径进入这些系统，而每条途径在保持准确性和质量方面都面临挑战。\n\
  \n理想情况下，组织应具备确保数据质量或清理数据的流程或机制，因为脏数据在系统中存留的时间越长，质量问题损害使用它的分析、营销活动、人员或其他系统的可能性就越高。然而，大多数组织没有正式的数据清理流程，而缺乏这一流程正是分析可信度问题的根源。图\
  \ 3-2 总结了销售和营销数据质量的现状。\n\n![A978-1-4842-0259-3_3_Fig2_HTML.jpg](img/A978-1-4842-0259-3_3_Fig2_HTML.jpg)\n\
  \n**图 3-2.** 销售和营销数据清洁度\n\n如图 3-2 所示，仅有 36%的组织表示其销售和营销数据“清洁”或“非常清洁”。由于分析流程建立在数据基础之上，这意味着其余\
  \ 64%的组织必然会看到其分析流程面临可信度差距，特别是在已知或认为数据质量较低的情况下。即使拥有清洁的数据，也不能保证营销分析流程会享有可信度。\n\n尽管如此，拥有清洁的数据仍是一个有效、可信的分析流程的先决条件。多数组织当前的数据质量状况应当为清理这些数据营造一种紧迫感。当考虑到数据量增长时，这种紧迫感只会加剧，因为对大多数公司而言，数据量会随着每一次销售电话、营销活动、网络研讨会或贸易展览而增长，从而使问题复杂化。\n\
  \n即使数据量没有增长，静态数据也不会无限期地保持有效。数据质量会随着联系人更换公司、电子邮箱、角色、职位和职责而衰减。营销分析数据当然不仅仅包含潜在客户或客户联系数据，但营销能够追踪的大多数指标最终都会追溯到客户，因此它与客户联系记录相关联。当这种情况发生时，组织需要与准确的客户和潜在客户数据建立联系。在数据质量方面不作为，就是对低劣数据质量的默认承诺。组织必须具有某种程度的主动性和流程纪律，才能将数据质量维持在任何水平上，或者（理想情况下）提升它。\n\
  \n\n\n关于数据质量的最后一点思考：无论输入营销分析流程的数据多么纯净，那些对流程持（或可能持）批评态度的人也必须了解数据的清洁程度。营销团队在这方面需要承担一定的公关责任。如果营销部门要维护或提升其分析流程的可信度，就必须确保数据是干净的，并且让所有人都知道它是干净的。对数据质量的任何错误认知，都可能摧毁任何分析流程的可信度。\n\
  \n对流程缺乏信心或信任，无论在选择和跟踪正确指标上投入了多少心血，都会严重阻碍营销分析工作的开展。分析流程中可信度问题的严重性，是分析领域一个非常现实的障碍。图\
  \ 3-3 展示了在营销分析可信度范围内，各组织所处的现状。\n\n![A978-1-4842-0259-3_3_Fig3_HTML.jpg](img/A978-1-4842-0259-3_3_Fig3_HTML.jpg)\n\
  \n**图 3-3.** 营销分析可信度认知\n\n图 3-3 所示的数据触及了营销分析流程中信任度的核心。考虑到分析流程应如何运作——即产出数据，帮助营销部门使其工作与战略保持一致并表现出色——一个关键的成功因素是信任。如果分析流程不足以被信任来影响重大决策，那么它的价值何在？因此，该流程的输出必须能够影响决策。只有当流程的相关方对流程及其输出有信心时，它才可能具有影响力。\n\
  \n目前，只有三分之一的公司声称对其营销分析给予了“良好”或“较高”的可信度。而“中等”、“较低”或“无”可信度的认知则表明存在怀疑。这些可信度数据表明，仅仅拥有一个健全的营销分析流程是不够的；该流程还必须赢得相关方的信任，以便分析能够影响决策。对营销分析流程的真正试金石是：公司是否愿意根据流程提供的指导做出严肃决策并投入资源？第\
  \ 5 章详细阐述了一个帮助组织实施健全营销分析流程的计划，该计划的一部分包括在流程输出中建立信任和信心的努力。\n\n### 分析与决策制定\n\n最终，营销分析流程应提供有助于做出更好决策的数据。正如第\
  \ 1 章所讨论的，营销组织中的分析并非为了让决策过时，而是为决策提供信息。在做出决策后，分析还有另一个用途：判断这些决策是否正确。最成熟的营销分析流程在决策前和决策后阶段都会使用分析。\n\
  \n为了理解分析如何为决策提供信息并随后验证决策，让我们设想一个营销团队面临挑战时的假设性决策情景。假设你是首席营销官（CMO）。在一次高管团队会议上，首席财务官（CFO）报告称，本季度的收入预测显示将“未达标”50\
  \ 万美元。经过一番讨论，首席执行官（CEO）转向你，CMO，要求你想办法弥补预测的收入缺口。\n\n如果你所处的营销组织很少或根本不使用分析，你会怎么做？你仍然需要做出决策，并且会依赖你的经验和直觉。有时，这种方法对组织有益，但有时则不然。这就像掷骰子，在这种情况下，你会希望已经有一个分析流程可以提供一些见解。\n\
  \n与 CEO 开完会后，你的第一站是销售副总裁。你们俩必须共同决定收入将从何而来：新客户、现有客户，还是两者兼有？由于公司已实施客户关系管理（CRM）和营销自动化系统，做出明智决策所需的指标是现成的。你知道的是，将一个合格的潜在新客户培养到成交的平均销售周期是六个月。此外，分析告诉你，销售团队成功将你们接触的合格潜在客户中的\
  \ 30% 转化为销售。以平均销售额 5000 美元计算，你需要达成 100 笔新销售才能填补收入缺口。根据你的销售转化率，营销团队需要识别出 330 个新的合格潜在客户，才能获得\
  \ 50 万美元的新收入。\n\n问题在于：你来不及在本季度结束前产生 330 个新的合格潜在客户，并让至少其中 100 个完成六个月的销售周期。因此，你继续与销售副总裁进行商议，审视销售管道中已经在跟进的机会。同样，由于你使用了适当的系统（这里指\
  \ CRM），你可以获取相关数据。\n\n与销售副总裁合作，你分析了管道数据，移除了本季度预计会转化的潜在客户。这样做之后，你发现销售管道中有 285 个合格的潜在客户被搁置。这些机会是作为合格潜在客户进入管道、已经经历了部分购买周期，但由于各种原因，要么没有引起销售团队的足够重视，要么没有被营销部门培育。\n\
  \n你和销售副总裁断定，这 285 个现有的合格潜在客户代表了在本季度末弥补 50 万美元收入缺口的最佳机会。一个担忧是，平均转化率告诉你，你可以期望将这些潜在客户中的\
  \ 30% 转化为销售。按此转化率，仅有 285 个潜在客户，你将获得约 85 笔销售，即 42.5 万美元，距离填补收入缺口还差 7.5 万美元。过去的经验告诉你，采用相同的方法会产生相同的结果。你花了几分钟时间大声思考，尝试一些新方法来培育管道中这些被忽视的潜在客户。离开销售副总裁办公室时，你承诺会让你的团队制定一个计划，以更高的转化率来转化这\
  \ 285 个潜在客户。\n\n\n\n\n回到办公室后，你召集团队讨论这个挑战。通常情况下，你的潜在客户培育工作包括通过电子邮件链接到登录页面，提供某种高级内容，例如白皮书或案例研究。你的团队因制作既引人入胜又具有视觉吸引力的内容而享有盛誉。然而，弱点一直在于让潜在客户访问登录页面以获取这些内容，这些内容被“封锁”在需要访问者提供联系信息的表单后面。\n\
  \n你与团队一起回顾了几次以往电子邮件营销活动的结果。每次活动，你都有包含打开率、跳出率、点击率甚至哪些收件人打开了邮件的分析数据。在审查这些数据时，你确认了之前的想法是正确的：你的打开率一直很高。这得益于你为确保\
  \ CRM 和营销自动化系统中数据质量所做的努力。然而，这些分析还显示，点击率低于行业平均水平，并且正在下降。换句话说，你的促销邮件反馈很强，但点击邮件中链接到你创建的登录页面的收件人不够多。这令人担忧，但至少分析数据告诉了你问题所在。\n\
  \n接下来，你与团队审查的是登录页面的网络分析数据。在这里，你发现了另一个问题。只有极少数花时间点击进入登录页面的邮件收件人会选择行动号召按钮，通常像“下载案例研究”或“立即注册”以及类似的行动号召。这些数据证实了你几个月来的直觉：你正在经历那些曾经行之有效的、经过验证的培育方法的性能下降。在此之前，你从未因预计收入缺口而产生更密切监控这些分析数据的紧迫感。\n\
  \n当你和团队思考这些分析数据所揭示的问题时，大家讨论了如何以不同方式培育这 285 个潜在客户，希望能产生超过 30%的转化率。如果你们能策划出一个达到 35%转化率的活动，就将获得所需的\
  \ 100 笔销售，从而产生 50 万美元的收入。这个算术很简单。关键问题是，采用什么方法才能实现这一目标？\n\n你团队中的一名成员最近一直在试验互动视频，对各种登录页面的配置进行\
  \ A/B 测试。互动视频是一种营销视频内容，其特色是内置于视频本身的行动号召链接。这些视频时长通常不超过两分钟，当视频结束时，会向观看者展示一个或多个行动号召按钮。与你通常使用登录页面的方式不同，团队测试了未被“封锁”的互动视频——换句话说，访问者不必先输入他们的联系信息。取而代之的是，在视频的结尾，其中一项行动号召允许观看者请求更多信息并与销售代表联系。\n\
  \n提供未封锁的内容与你团队过去使用的方法有所不同。网络表单一直是你们活动登录页面的一部分，因为它们允许你为销售团队捕获潜在客户。然而，这种情况有所不同。你并非试图捕获新潜在客户，而是为已经拥有的潜在客户加速购买周期。来自互动视频测试的分析数据看起来非常有希望：访问者显然更喜欢视频，并且他们选择点击视频末尾的“联系我”按钮的比率是你以前对其他形式内容经验数据的两倍。你决定使用互动视频来构建一个营销活动。\n\
  \n下一个重大的活动决策是确定视频将展示什么内容。视频营销的最佳实践表明，90 秒或更短的视频最为成功。你再次与团队一起审查分析数据，以确定哪种类型的营销信息可能对处于购买阶段后期的合格潜在客户最有效。分析过去的营销活动，你发现那些以案例研究——一个关于客户实施你的解决方案并描述所获收益的真实故事——为特色的内容具有最强的转化率。基于现有数据，你安排团队着手制作一个\
  \ 90 秒的互动案例研究视频。\n\n团队工作迅速，视频很快准备好投放。使用你的营销自动化系统，你准备了活动登录页面以及将发送给确定的那 285 个潜在客户的邮件。利用营销自动化系统中的分析数据，你确定了发送邮件的理想星期几和时间。\n\
  \n由于你在营销团队中建立了数据驱动的文化，他们总是思考如何衡量所做的每一件事。这个活动视频在制作时就具备了追踪观看时长和分享次数的能力。此外，你的营销自动化系统与\
  \ CRM 系统完全集成，因此当合格潜在客户观看视频时，该活动会在两个系统中被记录。另外，当潜在客户看完整个视频时，一封电子邮件提醒会被发送给销售团队的某位成员。你的活动将实时跟踪并报告这些指标，使销售团队能够在潜在客户的行为表明其兴趣时迅速做出响应。\n\
  \n你启动了营销活动。初始邮件发送后的头几天将告诉你策略是否有效，或者你是否需要制定一个 B 计划。邮件的打开率跟踪数据显示其处于正常范围，正如你所预期。然而，最令人鼓舞的是，指向活动登录页面的点击率略高于平均水平。更棒的是，登录页面上观看案例研究视频的行动号召表现远优于之前邀请访问者消费封锁内容的登录页面。到目前为止，策略运作得非常出色，但最终的活动指标——收入——仍然未知。\n\
  \n是时候去查看销售副总裁那边的情况了。你顺道过去做个快速更新，发现销售部门一片沸腾！副总裁没什么时间聊天，但这是出于最好的原因。互动视频通过视频末尾嵌入的行动号召选项，引发了向销售团队咨询的热潮。案例研究视频显然引起了共鸣。副总裁分享说，许多潜在客户已经重新开始了销售对话，大意是“我们和视频中的客户有同样的问题——帮我们解决它”。销售团队正在预订演示，并与活动中定位的许多潜在客户进行高质量的互动。\n\
  \n几周之内，季度收入预测被上调。销售副总裁报告说，预计到本季度末将额外完成 105 笔交易，抹平了预测的收入缺口。你与营销团队复盘了这次活动，回顾所有指标以确定下次如何改进策略。大家一致认为：当你向首席财务官申请更多资金以更大力投资视频营销时，鉴于这次活动的结果，获得批准不会有任何困难。\n\
  \n正如上述场景所示，分析以多种方式影响着现代营销组织内部的决策，无论大小。这个场景只是展示了分析如何帮助驱动自信决策的一种方式，而这些决策的结果可以直接与收入挂钩。\n\
  \n脚注 1\n\n\n  \n“2013 年营销分析：基准、洞察与建议”，Demand Metric 研究公司，2013 年 3 月。[`http://www.demandmetric.com/content/marketing-analytics-benchmark-report`](http://www.demandmetric.com/content/marketing-analytics-benchmark-report)\
  \  \n\n“奥巴马如何通过一个简单的实验筹集了 6000 万美元”，Optimizely 博客，2010 年 11 月 29 日。[`http://blog.optimizely.com/2010/11/29/how-obama-raised-60-million-by-running-a-simple-experiment/`](http://blog.optimizely.com/2010/11/29/how-obama-raised-60-million-by-running-a-simple-experiment/)\
  \  \n\n“销售与营销数据质量基准报告”，Demand Metric 研究公司，2013 年 11 月。[`http://www.demandmetric.com/content/sales-marketing-data-quality-benchmark-report`](http://www.demandmetric.com/content/sales-marketing-data-quality-benchmark-report)\
  \  \n\n同上。  \n\n“2013 年营销分析：基准、洞察与建议”，Demand Metric 研究公司，2013 年 3 月。[`http://www.demandmetric.com/content/marketing-analytics-benchmark-report`](http://www.demandmetric.com/content/marketing-analytics-benchmark-report)\
  \  \n\n"
- "# 4. 营销分析流程  \n\n起泡、冲洗、重复  \n\n> 如果你无法将自己的行动描述为一个流程，那你就不知道自己在做什么。——W. 爱德华兹·戴明 \
  \ \n\n企业非常依赖流程驱动。销售、支持、会计、制造、招聘、培训，几乎企业所做的每一件事都有相应的流程。即便在我们的个人生活中，我们也时刻使用流程。虽然我们很少思考这一点，但大多数人洗澡的方式可能都如出一辙：日复一日地按相同顺序起泡、冲洗、擦干。从最小的任务到最大的项目，流程都是我们完成工作的方式。\
  \  \n\n流程帮助我们高效且有效地工作。当我们意识到某项任务或活动具有重复性，并且我们试图达成一致的结果时，我们就会为其制定一个流程。一旦找到了行之有效的流程，我们就会坚持使用，并在使用过程中不断改进。在一些公司中，这些流程相当正式，并由专人管理以优化绩效。可能会有指定的流程负责人持续评估流程表现，寻找消除低效环节、提升绩效的方法。在其他情况下，流程是非正式的，只要还能运转，就没有人会过多关注。无论哪种方式，流程都是组织内部完成工作的途径。\
  \  \n\n营销是一个宏观流程或系统，包含许多子流程。这种观点可能会让营销听起来过于机械化，仿佛将创造力排除在外。但这并非将营销置于流程语境中的本意：创意流程对营销的成功至关重要，并且它是可以被衡量、管理和改进的。\
  \  \n\n那么，为什么要大谈特谈流程呢？流程需要管理才能发挥最大效能。你无法管理无法衡量的流程，因此衡量——即分析——对于管理营销及其包含的所有流程至关重要。营销分析本身就是营销内部的一个核心或基础流程。让我们重新审视第一章中首次分享的营销分析定义：\
  \  \n\n> 营销分析是一个流程，旨在识别能够有效反映营销在实现目标过程中绩效的指标，持续跟踪这些指标，并利用结果来改进营销工作。  \n\n营销分析流程应作为所有其他营销流程的绩效接口。对于营销所做的每一件事——邮件营销、内容营销、潜在客户开发、活动营销、点击付费广告——理想情况下，这些流程都应关联相应的分析。营销分析流程要求为所有营销流程识别有意义的绩效指标，跟踪这些指标，进行分析，并基于分析采取改进措施。\
  \  \n\n> **注**  \n> 营销分析流程要求为所有营销流程识别有意义的绩效指标，跟踪这些指标，进行分析，并基于分析采取改进措施。  \n\n分析流程听起来很简单，但考虑到营销所涉及的所有事务，其范围往往相当庞大。仅以邮件营销流程相关的部分指标为例：打开率、退信率、点击率、取消订阅率和转化率。这些指标会因营销机构发送的邮件数量而成倍增加，由此可见营销团队淹没在数据之中是多么容易。正因如此，营销分析流程并非营销工作的附属品，而是其不可或缺的组成部分。用仪表盘来比喻分析十分贴切：分析为营销领导者提供绩效信息，使其能够以最高效率驱动营销机器，产生最佳成果。\
  \  \n\n有一则关于洗发水瓶上使用说明的老笑话：起泡、冲洗、重复。如果你严格按照说明操作，就会陷入无限循环的流程，直到洗发水用完为止。然而，在营销分析方面，我们恰恰希望严格按照这些说明来理解，形成一个衡量、分析、改进的持续循环。只进行一次流程循环的价值是有限的。只有当具备持续重复循环的纪律时，营销分析才能发挥最大效用。本章剩余部分将更详细地探讨分析流程。\
  \  \n\n> **注**  \n> 营销分析流程是一个衡量、分析和改进的持续循环。  \n\n\n\n## 第一步：确定指标\n\n> 指标并非控制手段——它们监控进展、提供方向、并摘除眼罩。——克里斯泰尔·克（来源：领英）\n\
  \n在任何事业中，无论是市场营销还是其他领域，衡量都至关重要，因为它是判断成功或失败的手段。营销常被视为一门艺术事业，因此许多人认为其真实影响力无法衡量。不可否认，营销确实具有艺术和创意的一面。事实上，卓越的创意人才和作品是区分普通营销与真正优秀营销的关键因素。但仅仅因为营销是最具创造性的商业学科之一，并不意味着它应免于衡量。在现代，关于衡量营销成果的争论已经有了肯定的答案。\n\
  \n事实上，在大多数组织中，营销存在的理由就是直接或间接地创造收入。尽管营销确实还有其他使命，例如充当品牌的守护者，但如果它不是收入方程中的关键变量，大多数 CEO\
  \ 将会认为营销是失败的。因此，衡量非常重要。衡量营销的第一个挑战是确定使用哪些指标。这绝非小事，因为整个分析过程的成功取决于指标的恰当选择。\n\n在讨论营销指标时，考虑销售部门是很有帮助的，该部门有着悠久的指标驱动历史。从使命和目标的角度来看，营销与销售的关系非常紧密。这两个职能都肩负着创造收入的任务，但它们的方式却截然不同。销售结果的衡量通常相当直接：设定收入目标、分配定额、跟踪销售情况，并且常常落实到具体的负责代表。在\
  \ B2B 销售组织中，要知道谁对实现收入贡献最大并不困难。销售活动与收入之间的关系非常直接，因此相当容易衡量。\n\n在营销中，情况并非总是如此清晰。原因并非营销对收入没有影响，而是因为营销活动通向收入的路径更为间接。简单来说，就是将营销所做的工作与其产生的结果联系起来更加困难。营销产出与收入之间的这种间接关系给识别有意义、相关的指标带来了挑战。这并非不可能完成的任务，但它需要仔细的斟酌和筛选。\n\
  \n为营销分析过程确定最佳指标集所面临的挑战之一，是与营销工作相关的指标数量极其庞大。一般的营销组织实际上可以产生大量关于其大部分工作的数据，但并非所有这些数据都能提供对真实结果的洞察，而且在营销组织之外也毫无意义。\n\
  \n如果组织想要数字，营销可以提供。可用的指标有数百种。社交媒体为我们提供了点赞、分享、帖子、推文等指标。电子邮件营销产生了打开率、退信率、点击率、退订率等等。网站让我们能跟踪访问次数、独立访客数、推荐来源、搜索词条，以及更多。还有转化率、内容下载量、浏览量，以及看似无穷无尽的指标供现代营销团队使用。\n\
  \n每个指标在帮助营销推导其收入影响方面都有潜在价值，但几乎没有一个与具体的收入数字直接挂钩。简单地跟踪容易收集的数据并进行报告当然很方便，尤其是在面临展示责任的压力时。然而，营销部门仅仅将其收集的所有指标抛给组织以满足责任需求，这是不明智的。尽管各种各样的可用指标显示了活动的证据，但它们并不能真正回答营销表现如何的问题。营销必须对其选择的指标有所甄别，坚持使用最相关的那些，这样查看一组指标时就不会感觉像对着消防水管喝水一样。\n\
  \n为分析过程选择指标面临的另一个挑战是，许多指标在营销部门之外意义不大。这并不意味着它们无用，但它确实暗示，如果营销选择使用非营销人员不太理解的指标，就有责任解释它们的含义以及它们为何重要。\n\
  \n例如，考虑一下“曝光量”。营销人员明白，曝光量仅仅是对某种形式的内容（传统或数字）的接触次数或衡量。衡量曝光量是营销许多工作的一个常见指标，例如各种形式的广告。营销总是希望获得尽可能多的曝光量，而数字曝光量相当容易跟踪。想象这样一个场景：首席营销官（CMO）获批预算开展一项数字营销活动。与以往类似的活动相比，该活动表现出色，产生的曝光量比预期高出\
  \ 15%。营销团队对这个结果欣喜若狂。\n\n如果首席财务官（CFO）询问活动进展如何，营销团队很容易报告曝光量数据。但并不是所有的 CFO 或 CEO 都确切理解曝光量是什么，也不明白并非所有曝光量的价值都相同。此外，他们对曝光量本身并不十分感兴趣：他们想知道这些曝光量在收入方面意味着什么。\n\
  \n来自活动的曝光量数据可以帮助营销团队改进现有和未来活动的表现。如果表现不佳，营销部门应调查原因；通常问题在于信息传达错误、媒介错误，或两者兼而有之。分析数据可以帮助团队改进活动表现或复制出色表现。正如\
  \ H. 詹姆斯·哈林顿所说：“衡量是通向控制并最终实现改进的第一步。”¹\n\n正如活动曝光量这个例子所示，曝光量作为指标并非无用，但它们无法讲述高层管理者渴望听到、也是营销部门应该想知道的那个故事：活动的收入影响。公平地说，大多数营销人员明白需要将曝光量、访问量、下载量等指标转化为收入。问题在于，他们往往没有相应的系统来收集精确计算所需的数据。当然，营销部门总是可以估算：根据实际的曝光量数量，应用一些历史上被认为准确的历史转化率，从而得出一个所产生的收入数字。但一旦这样做，它就离开了确定的领域，进入了推测的领域，并因此使其信誉面临风险。\n\
  \n\n\n## 衡量营销成效：指标识别的挑战与指南\n\n### 指标识别的主要挑战\n\n一个值得讨论的最终挑战是，找到能够衡量重要事物的指标非常困难。例如，以品牌资产（`brand\
  \ equity`）这个概念为例，这是一种通过营销而增长的资产。根据定义，品牌资产是一个品牌所享有的心智份额（`mindshare`）和认知度（`recognition`），以及随之而来的收益。拥有高品牌资产的企业可以收取溢价、获得更忠实的追随者，并在一定程度上免受竞争威胁。然而，品牌资产很难衡量。对此进行评估的组织通常会采用一些指标组合，例如市场份额（`market\
  \ share`）、无辅助回忆度（`unaided recall`）、净推荐值（`Net Promoter Score`）和推荐量（`referrals`）。对于提升品牌资产的重要性，很少有人质疑，但如何衡量它则完全是另一回事。因此，这为那些纯粹旨在提升品牌资产的营销活动准备商业案例和证明其合理性增加了难度。\n\
  \n这些挑战——潜在指标数量庞大、许多指标与收入没有直接关系，以及某些重要事物难以衡量——似乎意味着识别指标就像穿越雷区。但这并非必然如此。在决定如何最佳衡量营销成果时，请遵循以下指南：\n\
  \n*   专注于目标\n*   衡量效率\n*   衡量效果\n\n### 以目标为导向的指标\n\n营销的指标集必须衡量朝着目标取得的进展，否则它们衡量的就是错误的东西。这些目标的理想来源是营销策略，而合理的目标总是具有时限性（`time-bound`）和可衡量性（`measurable`）。这一策略及支撑性目标应当与公司的愿景和业务目标保持一致。如果是这样，那么识别指标就是通过确定如何衡量实现这些目标的进展来完成的。当存在一个具有明确目标的营销策略时，这些目标会使选择正确的指标变得相当直接。\n\
  \n为了说明这个概念，考虑一个非常常见的业务目标：利润最大化。营销团队制定了一个帮助最大化利润的策略，并设定了两个目标：\n\n1.  增加当前产品在当前市场的市场渗透率。\n\
  2.  提高客户保留率。\n\n营销团队规划并执行一系列营销活动和行动来实现这些目标。由于这两个目标都是可衡量的，营销团队应该能轻松理解其行为是否朝着正确的方向“推动了指针”。对于第一个目标，营销可以衡量市场份额、新客户获取等指标，以了解取得的进展。同样，营销可以通过衡量客户保留率、满意度、推荐量、重复购买率以及其他指标，来理解保留情况及其对收入的影响。在这两个领域，理解营销活动对收入的影响并不困难。\n\
  \n### 策略与分析的共生关系\n\n如果没有营销策略或一系列相关目标，识别有意义的指标就非常困难。在缺乏营销策略的情况下，业务目标和营销目标从何而来？虽然可以随意选择一些目标来追求，然后确定与之匹配的指标，但这并非真正的策略性营销方法。营销策略（及其目标）与营销分析之间存在共生关系。营销策略应当先于分析过程存在，而该策略的目标应作为识别分析过程指标的基础。\n\
  \n### 效率指标与效果指标\n\n到目前为止，本章强调了指标必须与营销的收入绩效相关联。此外，还需要一些关于效率的指标，用以展示营销团队完成任务的效果如何。这些指标本质上是生产力衡量标准，大多数情况下仅供内部使用，帮助首席营销官（`CMO`）保持营销引擎高效运转。只要它们不是分析过程中使用的唯一指标类型，营销部门就应该拥有一些帮助其了解工作完成效率的指标。\n\
  \n效率指标很容易变成“虚荣”指标（`vanity` metrics），因为它们让营销部门因完成大量工作而感觉良好。但这些指标无法告诉你是否在做正确的事情。在使用效率指标时，必须记住，它可能显示你正在非常出色地做一件错误的事情。\n\
  \n由于效率指标只能告诉营销人员他们是否在正确地做事，因此需要另一种类型的指标来帮助营销人员了解他们是否在做正确的事情。这就是效果指标（`effectiveness\
  \ metrics`），它们有助于衡量营销的影响力。效果指标的例子包括转化率（`conversion rates`），这是一个行为指标，意味着潜在客户自愿采取了预期行动，从而在销售漏斗中向下移动。虽然这个指标及类似指标并不总是意味着销售即将发生，但这是迈向可能销售的一步。将效果指标与收入联系起来要容易得多。\n\
  \n## 结论\n\n识别指标是营销分析过程中关键的第一步。没有正确的指标，该过程中后续步骤的价值将微乎其微。通常，刚接触分析的营销人员会确定一套核心指标，这些指标会随着时间的推移不断完善，并通过经验不断扩展。\n\
  \n\n\n## 第二步：分析指标\n\n> 目标是将数据转化为信息，再将信息转化为洞察。——卡莉·菲奥莉娜，《信息：数字时代的货币》\n\n分析流程的第二步是分析：获取数据，并通过检查与分析，将其转化为可操作的信息。此分析步骤的目标是从数据中得出关于营销在实现目标方面进展的洞察。这些洞察并非总是显而易见，因此分析与解读有助于揭示它们。\n\
  \n在第一步中，我们确定了作为营销分析流程关键输入的指标。在确定合适的指标后，分析步骤就从捕获和追踪这些指标开始。在这个几乎所有营销活动都已数字化的现代时代，这意味着需要建立正确的系统和机制，以可靠地追踪指标，并使其可供分析。\n\
  \n许多营销组织首次接触分析，都是通过它们的网站。网站是公司最重要的营销渠道之一，捕获网站性能的分析数据至关重要。即使是实体企业，网站也往往是消费者在考虑购买时查找信息的第一站。每个网站都应启用分析功能，以便营销人员了解性能并优化公司的网络形象。`Google\
  \ Analytics` 是大多数营销人员为此目的普遍使用的免费解决方案。然而，营销分析的领域远不止于网络指标。\n\n如果已建立正确的系统来捕获指标，那么了解当前状况并不困难。现代营销组织使用三个核心系统来捕获所需的分析数据：网站分析、CRM\
  \ 和营销自动化。当然，还有其他系统也为营销提供数据，例如购买交易数据，但这三个系统是支柱。没有这些关键系统提供的数据收集机制，分析流程将寸步难行。现代营销组织中事务繁多，若不借助自动化与技术，根本不可能手动追踪指标数据。\n\
  \n有了正确的系统，营销人员可以快速获取当前性能指标的快照。只需点击几下鼠标，就能看到有多少独立访客访问了活动落地页，有多少封邮件被打开，按点击付费（PPC）方案产生了多少次点击，等等。大多数营销组织将指标整理到某种仪表盘中，以直观方式呈现数据，从而更易于沟通和理解。第\
  \ 7 章会更详细地讨论仪表盘在营销分析流程中的使用。\n\n在分析营销指标时，营销人员应该做的是：了解当前状态，将其与理想状态进行比较，然后进行根本原因分析，以解释任何差异。\n\
  \n> **注意**  \n> 营销分析流程的分析步骤始于了解当前状态，将其与理想状态进行比较，并理解存在差异的原因。\n\n通过查看最新的分析数据来了解营销的当前表现固然有趣，但这仅仅是分析流程的开始。查看这些数据后，首先提出的问题通常是：这些结果好吗？要知道某个特定测量结果是好、是坏、还是无关紧要，需要某种形式的比较，要么与历史数据比较，要么与代表卓越标准的一组基准进行比较，最好是后者。\n\
  \n比较之所以重要，是因为没有比较，指标就无法提供方向感。以客户满意度这一非常重要的指标为例。对客户满意度进行初步的量化评估，其作用十分有限。为了说明这一点，假设进行一次客户满意度调查，评分范围为\
  \ 1 到 5，其中 1 表示非常满意，5 表示非常不满意。调查结果显示平均满意度为 2.3。组织应如何看待这个结果？这个结果处于“满意”的一端，因此多少有些安慰，但这一单一的客户满意度快照完全无法说明这一关键指标的发展趋势。\n\
  \n理想的情况是拥有上一个测量周期的数据以供比较；更有用的是拥有历史数据以了解随时间变化的趋势。如果我们在看落地页转化率，历史上它的表现如何？几乎对于任何营销指标都是如此。当一个测量周期到下一个周期出现改进时，为什么会发生这种情况？同样，当一个周期到下一个周期出现退步时，进行调查以找出原因至关重要。指标变化的根本原因并不总是容易确定。分析数据有时类似于侦探工作。\n\
  \n> **注意**  \n> 有效的分析需要客观的视角，以及不断寻求营销结果成因的决心。\n\n来自外部的基准数据并非总是可用，但若有可用数据，则能提供有用的比较。例如，网络研讨会基准数据告诉我们，注册者到实际参会者的平均比率为\
  \ 42.9%。² 注册网络研讨会的人中，实际参会者不到一半。有了这些数据，举办网络研讨会的公司就能知道他们的注册-参会比率是值得警惕还是值得庆祝，并且如果他们对自身数据与基准的比较结果不满意，就可以采取相应措施。\n\
  \n这一分析步骤的目标是从数据中得出关于营销有效性的洞察。分析营销收集的所有关于其工作的指标至关重要，因为这是我们理解营销绩效的方式。这类似于监控汽车仪表盘上的仪表。当仪表指针进入红色区域时，我们知道存在问题，但未必知道问题是什么。仪表为我们提供了从哪里开始寻找问题根源的一些线索。诊断与处方将是本章下一节的主题。\n\
  \n营销指标的分析提供了衡量营销绩效的晴雨表。由于这一分析为采取改进措施提供了基础，因此用于分析的数据必须准确且完整，这一点非常重要。对糟糕或可疑的数据进行出色分析是有可能的。营销分析流程需要准确、完整的数据，若缺少这些数据而试图执行该流程，将导致错误的结论以及改进营销工作的无效尝试。当这种情况发生时（有时在急于成为分析驱动型组织时会发生），会损害营销的声誉和可信度。营销人员必须确保用于分析流程的数据准确可靠。\n\
  \n\n\n## 第三步：采取改进措施\n\n优秀的企业不相信卓越——他们只相信持续的改进和不断的变化。\n\n——汤姆·彼得斯，《追求卓越》\n\n分析营销指标可以告诉我们正在发生什么以及原因，但如果结果未达到预期，它并不总能告诉我们该怎么做。当结果超出预期时，分析也并不总能帮助我们了解如何复制成功的做法。在这个分析流程步骤中，营销必须确定哪些行动和变化最有可能带来改进。无论分析多么透彻，如果不能导向某种改进措施，那它就是没有价值的。\n\
  \n有时，改进措施是显而易见的。例如，对一次表现不佳的群发电子邮件进行分析后发现，异常多的电子邮件地址被退回，表明这些地址无效。这里的改进措施很明显：移除无效地址并保持邮件联系人列表为最新。在其他情况下，改进措施并不总是如此明显。\n\
  \n在另一种场景中，一个`PPC`广告活动表现不佳。将这个表现不佳的`PPC`活动与之前的活动进行比较，发现来自着陆页的点击率（`CTR`）远低于正常水平。分析表明，所有`PPC`活动都采用了相同的策略：为点击广告的用户设置了唯一的着陆网页。着陆页上的优惠或“行动号召”转化与之前表现良好的活动类似。着陆页的流量也在预期参数范围内。那么问题出在哪里？更重要的是，正确的改进措施是什么？\n\
  \n在这种场景下，着陆页显然存在某些问题，但分析并没有告诉我们如何解决；它只告诉我们问题似乎出在哪里。在这个例子中，问题就出在着陆页本身，因为它没有像之前的活动那样产生相同水平的转化率。为了找到解决方案，营销团队可以进行一些`A/B`测试，这一过程在第\
  \ 3 章中简要提及。\n\n`A/B`测试涉及向访问者展示着陆页的两个版本。`A`版本是对照页面，`B`版本则有一些变化。变化可能包括不同的行动号召文本、图形、不同的页面布局、配色方案或任何可以想到的改动。目标是找出哪些变化表现最佳。两个页面都会呈现给访问者，并密切监控分析数据。访问者自己决定获胜的页面。在这个例子中，获胜页面就是转化率最高的那个。很可能需要进行一系列的`A/B`测试才能完全优化一个活动。\n\
  \n`A/B`测试以及其他类型的测试和研究，是确定营销应采取何种改进措施的非常有用工具。测试和研究有助于消除改进措施中的猜测成分，但很少有营销人员愿意花时间去做。测试和研究方法的大敌是图省事以及“我们一直这么做”的心态。进行测试、研究并据此决定该做什么，需要时间和自律。承受着快速出成果巨大压力的营销人员往往不愿在投入之前进行市场研究和测试方法，因为这实在太耗时了。但这时间花得值得，因为它有助于确保改进措施一开始就是正确的。因此，测试和研究是确定改进措施的绝佳初始步骤。\n\
  \n在分析流程的所有步骤中，改进步骤是最少固定程式的。潜在改进措施的范围只受限于负责寻找这些措施的团队的创造力。在寻找要采取的改进措施时，要进行头脑风暴，想尽一切可能的主意。一开始不要拒绝任何想法。然后，在实施改进措施之前，如果可能的话，将候选想法的清单缩小到一个。同时进行太多改进，将使我们难以甚至无法知道哪个改进对绩效提升贡献最大。\n\
  \n改进总是必要的吗？事情进展得非常顺利时，是否有可能跳过改进步骤？理论上，任何过程总有改进空间。实际上，对于营销正在做的事情，存在一个收益递减点。如果营销任务或活动有绩效目标或标准，并且指标分析表明营销持续达到或超过这些目标，那么营销就可以把时间和改进精力投入到其他地方。请记住，营销应该衡量的范围很广，因此在一个领域的成功并不意味着可以忽略整个分析流程。这仅仅意味着，基于指标分析，表现成功的领域解放了营销，使其可以去调查和改进其他方面。\n\
  \n这个改进步骤不仅仅是为了应对低绩效。它也关乎复制那些行之有效的做法。分析步骤将识别出卓越的表现，一旦识别出来，营销团队就应该确定如何将导致这种卓越表现的原因应用到未来的工作中。产生理想结果的原因构成了最佳实践的基础，有助于组织持续地达成期望的结果。\n\
  \n## 循环往复\n\n> 你回去吧，杰克，再来一次。——斯蒂利·丹，《再来一次》\n\n本章描述的三步流程代表了营销分析流程应该执行的方式。每个组织都会对该流程有自己独特的变体，使用不同的指标，得出不同的分析结论，并采取不同的改进措施。然而，这三个步骤是恒定的：衡量、分析和改进。\n\
  \n仅仅执行一次或断断续续地执行这个流程会产生一些好处，但其最大价值来自于持续使用。重复执行分析流程对于产生一致且持续的改进是必要的。分析的真正优势只有通过长期、持续地执行流程才能体现。每次营销为实现目标而开展工作时，该工作都应属于分析流程的范畴。\n\
  \n对于每一个营销活动、沟通、事件和投资，在下一个活动、沟通、事件或投资开始之前，都应该完成衡量、分析和改进的循环。调用分析流程的频率当然会因营销的具体工作而异。有些营销行动非常重要，需要实时监控分析数据，而其他的则可能需要每日、每周或每月的审查。\n\
  \n重要的是不要让自满情绪渗透到流程中。当定期审查指标显示一切正常时，人们很容易放松下来。事实上，在这种情况下，很容易认为营销工作已经调整得如此完美，可以在自动驾驶模式下运行了。这种营销的完美状态很少见，即使出现，也绝不会持续太久。对分析流程保持警惕是确保营销长期取得最佳绩效的方法。\n\
  \n脚注 1\n\n约瑟夫·L·利维，“依我之见”，《CIO 企业》，1999 年 9 月 15 日，第 10 页。\n\n2\n\nON24 网络研讨会基准报告，2014\
  \ 年版。[`http://www.on24.com/wp-content/uploads/2014/04/ON24_Benchmark_2014_Final.pdf`](http://www.on24.com/wp-content/uploads/2014/04/ON24_Benchmark_2014_Final.pdf)\n\
  \n\n\n"
- "# 5. 分析入门\n\n准备，就位，出发！\n\n> 市场营销一直以来都是一项艰苦卓绝且竞争激烈的运动——与跑马拉松并无二致。随着购买流程、媒体和技术的变化，以及管理预期的挑战，这就像在脚下地面不断移动中跑马拉松。原本艰难的事情正变得日益艰难。如果你不进行衡量，那就如同蒙着眼睛，在地震中跑马拉松。¹\
  \ ——大卫·拉布\n\n任何旅程的关键都是第一步。踏上营销分析之旅的第一步，代表着成为数据驱动、以收入为导向的营销组织的意愿、承诺和渴望。但这需要的不仅仅是渴望。营销分析的成功需要一个包含资源、准备、旅途中可能遇到的潜在危险以及应急计划的计划。本章提供了制定这样一个计划的框架。\n\
  \n本章假定读者所在的组织尚无分析流程，并正准备开启这段旅程。如图 2-4 所示，略超过四分之一的营销组织属于这一类别。其他走得更远的组织仍然可以从本章分享的信息中获益，利用它来帮助对标和评估自身的流程成熟度。\n\
  \n这段旅程有起点，但无终点。正如第 4 章所分享的，营销分析流程是一个持续循环。然而，对于刚刚开始旅程的人来说，有一些准备步骤，对于已经在路上的人来说，也有一些检查点。这些里程碑包括评估组织准备度、研究业务目标、确定或澄清营销目标，以及建立正确的指标体系。本章的其余部分将更详细地探讨这些里程碑。\n\
  \n> **注意**  \n> 营销分析之旅的主要里程碑包括评估组织准备度、审视或澄清业务目标，以及建立正确的指标体系。\n\n## 评估组织准备度\n\n>\
  \ 我们大多数人花太多时间在紧急的事情上，而没有花足够的时间在重要的事情上。——斯蒂芬·柯维，《高效能人士的七个习惯》\n\n如果能够观察拥有成熟营销分析流程的组织是如何运作的，你会发现一个显著特征：他们不会让紧急事务妨碍重要事务。对这些组织来说，分析非常重要，不仅在营销领域，而且在所有业务领域。这种运营哲学实际上颇具战略意义。它是一个可靠的指标，表明该组织致力于执行一个被充分理解、当然也具备指标支持的计划。\n\
  \n当组织踏上营销分析之旅时，他们必须首先评估自己是否已做好准备。这条路不仅仅是向组织菜单中添加另一个单独流程。相反，为了使分析能够带来其有能力实现的变化和改进，组织必须将分析融入到其运营体系的每个环节。因此，准备实施营销分析流程时要做的第一件事，就是看看组织是否准备好踏上这段旅程。最初需要评估的领域是组织的领导力和文化。\n\
  \n营销分析的成功是若干特征的产物，其中首要的是文化，而文化又是领导力的体现。如果你正试图开启这段旅程，你的组织文化会让你成功吗？即使领导层在鼓励并对分析说“是”，组织文化仍可能构成障碍。表\
  \ 5-1 对比了与营销分析成功相关的不同文化。\n\n**表 5-1.**  \n阻碍和促进营销分析成功的文化\n\n| 作为障碍的文化 | 作为催化剂的文化\
  \ |\n| --- | --- |\n| 处理紧急事务（被动应对） | 处理重要事务（主动作为） |\n| 惩罚错误 | 从错误中学习 |\n| 相信直觉 |\
  \ 信任数据 |\n| 政治化环境 | 透明化环境 |\n\n对于许多公司举措来说，文化是成败的关键。健康的文化是营销分析的温室；功能失调的文化则是荒芜的沙漠。表\
  \ 5-1 中的属性代表了支持营销分析的文化与领导力准备度范围的两端。你应该评估贵公司在这个文化频谱上的位置，以免分析计划因敌对的文化环境而萎缩消亡。\n\n\
  那些文化属性部分或全部位于“障碍”一列的组织必须明白，可能并不存在营销分析成功的环境。对这些群体来说，具有讽刺意味的是，他们功能失调的文化恰恰表明迫切需要营销分析能够帮助带来的变革。然而，他们的文化对于营销分析流程及其所带来的责任制来说，却是一个充满敌意的环境。\n\
  \n在这样的组织中，营销分析如何才能成功？文化必须改变，向表 5-1 中“催化剂”一列所列的属性靠拢。然而，这种改变并不容易。文化变革通常需要现有领导层做出改变，采纳和践行新的态度，或者需要新的领导层取代现有领导层。无论哪种方式，文化变革都不会很快发生，而且很少是毫无痛苦的。尽管如此，营销领导者应该在这样的组织中充当变革的推动者，倡导文化演进（而非革命），这将带来远超为营销分析打开大门的益处。\n\
  \n\n\n## 在抵制性文化中，营销分析是否有机会？\n\n在那些企业文化本身构成障碍的组织中，营销分析是否还有成功的机会？事实上，是有机会的。文化演进和营销分析可以并行进行。尽管这些组织的文化可能不支持正式的营销分析计划，但它通常可以以\"\
  隐身\"模式启动。无需大张旗鼓，甚至无需官方认可，就有可能从小处着手，取得一些成功，然后谨慎地扩大营销分析的范围。这个想法很简单：创造一些成功，那么组织就很难否认这项工作的价值。一系列小而真实的营销分析成功案例，有助于推动文化变革。\n\
  \n拥有部分或全部催化剂文化属性的组织，可以满怀信心地推进，因为他们知道自己的环境是开展营销分析计划的理想场所。\n\n## 技能：需要评估的第二个领域\n\n\
  技能是需要评估的第二个领域。营销分析的成功需要四种关键的技能组合：分析能力、技术能力、洞察力或理解力，以及沟通能力。很难找到一个人同时具备这四种关键技能，但在希望开展营销分析的组织中，所有这些技能都必须存在。\n\
  \n> **注意**  \n> 营销分析的四个关键技能领域是：分析能力、技术能力、洞察力或理解力，以及沟通能力。\n\n### 分析能力\n\n第一个技能要求或许是最显而易见的：分析能力。这种能力实际上代表着一种探究数据以了解其所能揭示内容的渴望，以及构建和处理数据集与模型所需的统计和数学技能。天生具有分析头脑的人可以学习数学和建模技能。然而，对分析工作毫无兴趣的人，即使学习了这些技能，也会感到吃力。\n\
  \n一个人或一个组织需要具备什么样的分析能力才能在营销分析中取得成功？最初，要求并不十分严格。刚刚开始进行营销分析的组织会发现，跟踪和分析基本指标并不需要高级的分析技能。这更简单地归结为是否有纪律去完成工作，而这可能只不过是对数据进行审查。在早期阶段，大部分分析工作简单到只需获取数据、审查数据，然后据此决定下一步行动。\n\
  \n随着组织营销分析成熟度的提高，其熟练程度也会随之提升。营销分析流程的推进和成熟将导致需要使用基础的、应用性的统计技术，不仅要检查单个指标，还要检查其中一些指标之间的关系。交叉表和相关性分析等技术可以更深入地理解分析数据，有助于解释营销生态系统中某一部分的变化如何可能产生涟漪效应，从而影响另一部分的结果。使用像\
  \ `SAS` 或 `SPSS` 这类统计工具的实践经验可以帮助分析人员执行这种更深层次的分析。\n\n长期以来，深入了解客户行为一直是市场营销的圣杯，也是大数据分析在市场营销中的一项应用。要获得关于客户及其行为的宝贵洞察，营销人员需要利用各种大量、结构化和非结构化的客户交易数据。构建与大数据和预测分析相关的数据集和模型需要高级的数学和分析技能。第\
  \ 10 章将更详细地介绍大数据分析。通过大数据分析和预测分析所能获得的洞察，对许多公司来说具有变革意义。从事此类分析工作所需的高级技能代表了营销分析光谱中最成熟的终点，这需要花费一些时间和经验才能达到。\n\
  \n### 技术能力\n\n第二个技能要求领域是技术能力：熟练地检索数据并使用分析工具对其进行处理。这可以被视为一种 IT 技能组合。营销分析流程作为输入所使用的数据，通常存在于企业内的各个系统中。没有一个包含该流程可能所需所有数据的\"\
  记录系统\"来专门服务于营销分析。营销人员需要技术技能来从存储数据的地方检索数据，而满足这一需求的技术要求从非常简单到非常复杂不等。\n\n有些数据可以通过使用简单的图形界面，对存储数据的系统进行易于构造的查询来检索。其他系统则需要数据库编程技能，例如使用结构化查询语言（`SQL`）从存储数据的数据库中检索所需内容。随着营销分析流程的成熟，很可能需要将来自多个来源的数据合并到一个数据库中，以便对其进行分析、从中得出重要见解并报告结果。这通常需要使用商业智能工具。因此，营销分析就绪性评估的一部分必须考虑营销部门是否能够接触到支持该流程所需的技术技能。\n\
  \n分析和技能通常出现在同一个人身上；即使不是，擅长其中一项技能的人也倾向于学习另一项。然而，这种技能组合在营销团队中往往难以找到，这一点必须改变，不仅是为了分析，也是为了所有越来越以技术为基础或由技术驱动的营销工作。正如\
  \ Chiefmartec.com 博客的作者斯科特·布林克所说：\"你必须成为营销技术的驱动者，而不仅仅是一个忧心忡忡的乘客。\"²\n\n### 洞察力或理解力\n\
  \n需要评估的第三个技能是理解营销分析的含义以及如何据此采取行动的能力。也许描述这一能力的最佳方式是将其称为洞察力。分析和技术技能会产生流程输出结果，但如果缺乏从这些结果中提取洞察的能力，营销分析流程就会令人失望。从分析中提取洞察的技能通常是经验、好奇心、跳出框框思考的能力以及纵观全局的能力共同作用的结果。擅长化繁为简、并能从结果中看出推论的人通常具备这种技能。\n\
  \n这个技能领域难以描述，更难以衡量。什么样的人具备这些技能？他们通常是那些有能力处理大量输入信息、客观地审视它们、从中归纳推断，并看到那些不明显之处的人。他们拥有出色的批判性思维能力，且不容易仓促下结论。拥有这种洞察力的人能够超越数字本身，辨别出数字所代表的含义。他们理解营销分析流程输出结果所蕴含意义的能力，对于整个努力至关重要。有些人可能会争辩说，这里所描述的根本不是一种技能，而是一种与生俱来的天赋。无论如何，拥有这种能力对于营销分析工作的成功至关重要。\n\
  \n### 沟通能力\n\n沟通能力是需要评估的第四个也是最后一个技能领域。营销人员可以为其工作建立惊人准确的数学模型，对营销分析数据进行详细分析，并对其所有潜在影响得出富有洞察力的结论，但如果结果没有得到很好的沟通，就不会从中获得任何好处。所需的沟通远不止简单地分发报告。需要的是一个沟通者，他能够以权威和信念讲述通过营销分析过程所获得的洞察。\n\
  \n\n\n围绕营销分析流程所必须进行的沟通，不仅仅是报告结果。（如果只是这样，那么一封简单的电子邮件就足够了。）相反，所需要的是一位能够客观传达分析所反映情况的领导者，帮助组织中的其他成员不仅理解，而且信服这些分析。这些沟通既有正式的，也有非正式的。代表营销分析流程进行沟通的人，既要在董事会会议室向高管做演示，也要能在茶水间进行闲聊式的交流。\n\
  \n在这种背景下进行沟通，其技巧之一在于知道传递信息的详细程度。营销分析当然可能包含很多细节。有些人需要了解流程的复杂性，而另一些人则只想要结果摘要。负责流程沟通的人必须始终清楚受众是谁以及他们的信息需求是什么。用一个比喻来说，问“现在几点了？”的高管，并不想听到一套关于如何制造手表的说明作为回答。一个非常熟悉分析流程的人很容易沟通过度，但这通常不会赢得人们的认可。善于沟通营销分析的人懂得如何简洁地传达意思，同时在必要时提供细节。\n\
  \n沟通营销分析的人还必须担任流程的教师和布道者。这需要具备洞察力，以识别哪些人不理解流程的价值和结果，然后对他们进行教育。同样，沟通者也需要不断地推广该流程，确保组织理解这些结果不仅有益于营销职能，而且有益于整个组织。因此，沟通者是营销分析流程的领导者、教师、说服者、捍卫者、推广者和倡导者。\n\
  \n最后，沟通者必须理解保持透明度的必要性。组织不能有选择地只在分析显示营销产生良好结果时才进行沟通。无论分析结果如何显示营销绩效，沟通都必须进行。这就是分析流程的问责维度，如果流程要发挥作用，营销部门就不能回避或审查其输出。营销部门运用分析的能力越强，其报告良好结果的频率就越高。即使情况并非如此，正确的企业文化也会因营销团队的透明而尊重他们。\n\
  \n与前两项技能要求（分析和技术）一样，洞察力和沟通技巧也很可能集中在同一个人身上。与前两项技能不同，后两项技能通常存在于营销团队内部。然而，罕见的是同一个人拥有所有这些关键技能。因此，营销分析最好被视为一项团队协作，由几个具备必要技能的人，在一个对运用分析有远见的领导者指导下共同努力。\n\
  \n尽管分析和技术能力是硬技能，而洞察力和沟通是软技能，但它们同等重要。表 5-2 提供了一个简单的评估机制，用于对当前开展分析所需的技能进行评级。用它来盘点并评估你所在组织中可用于营销分析的当前技能。在表中每项技能对应的列中，勾选代表你当前状态的选项，并制定计划来解决任何不足之处。\n\
  \n**表 5-2.** 营销分析关键技能清单/评估\n\n| 技能 | 熟练 | 粗略掌握 | 缺失 | 未知 |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| 分析技能 | | | | |\n| 技术技能 | | | | |\n| 洞察力 | | | | |\n| 沟通能力 |\
  \ | | | |\n\n下一个需要评估的主要领域是数据。你是否能获取所需的数据来支持你为营销分析流程定义的指标？挑战在于，实际上并不存在一个包含营销部门支持稳健分析流程所需一切数据的“系统记录”。第\
  \ 4 章讨论了为此流程识别指标的过程。首先确定指标很重要，这样数据的可用性就不会过度影响测量的内容。换句话说，不要让“尾巴摇狗”：不要因为你有数据就只衡量你能衡量的东西。衡量你应该衡量的东西，并想办法获取相关数据。\n\
  \n要评估你是否拥有作为营销分析流程输入所需的数据，首先研究你选择的用于跟踪、分析和报告的指标。这些指标需要什么数据？这些数据存在吗？如果存在，在哪里？如果不存在，是否可以获取？要能够访问营销分析项目所需的准确、可靠的数据，需要付出多少努力？你的数据可用性评估必须回答这些问题。\n\
  \n尽管没有单一的营销记录系统，但一些系统提供了大部分必要的数据，至少对于基本指标是如此。例如，一个正在执行数字营销策略并使用营销自动化解决方案的组织会发现，它衡量着陆页访问量或行动呼吁按钮点击量（转化）所需的大部分数据都会被自动捕获，并且易于访问。同样，一个组织需要了解的关于其网站性能的几乎所有信息都可以通过使用`Google\
  \ Analytics`获得。大多数基本销售活动指标、网络指标和数字营销指标的数据都可以在客户关系管理（`CRM`）、营销自动化或网络分析系统等各种系统中获得。\n\
  \n随着营销分析流程的成熟，指标变得更加复杂，并且通常来源于多个数据源。例如，计算新客户获取成本可能需要来自营销自动化和会计系统的数据。同样，确定一场活动中从合格线索到销售的转化率，可能需要访问`CRM`和网络分析系统。总的来说，更具信息量的指标，尤其是那些显示与收入关联的指标，通常来源于多个数据源。如果数据存在于某种系统或数据库中，通常可以自动提取和推导该指标，并将其呈现在某种报告或仪表板中。关于使用工具实现此目的的更多讨论，请参见第\
  \ 8 章。\n\n营销组织希望使用的指标很可能在任何现有系统或数据源中都不可用。在这种情况下，组织必须决定如何获取所需的数据。例如，假设营销部门确定某种倡导度指标作为分析流程的一部分来跟踪很重要。它可能决定使用净推荐值（`NPS`），因此会实施某种调查机制来收集`NPS`数据。其他指标也可能需要实施系统、流程或两者兼有来收集必要的数据。你的数据评估应考虑数据可能来自何处，以及收集它需要付出什么代价。\n\
  \n\n\n表 5-3 提供了一个模板，用于评估你的营销分析流程所需的数据。使用时，在最左列列出每个指标，并在相应的数据列下简要描述数据来源。如果数据不存在（最右列），请描述获取数据的可选方案。完成后，制定一个计划来处理当前不存在数据的指标。如果获取数据的难度过大或成本过高，你可能需要重新考虑相关指标的可行性。\n\
  \n**表 5-3.** 营销分析数据清单/评估\n\n| 指标 | 数据存在 | 数据可推导 | 数据不存在 |\n| --- | --- | --- | ---\
  \ |\n| 示例：电子邮件打开率 | 营销自动化 | | |\n| 示例：转化率 | | CRM、营销自动化 | |\n| 示例：净推荐值 | | | 制定净推荐值调查流程\
  \ |\n| 指标 1 | | | |\n| 指标 N | | | |\n\n评估的最后一个领域是预算。是否有资金用于支持营销分析流程的启动，并在其建立后维持运行？要成功运用营销分析，资源是必需的。完成此处建议的评估的重要性在于，了解该流程按预期运行所需的投资水平。一旦明确了资金需求，在继续推进之前，请确保组织愿意投入。\n\
  \n在规划营销分析预算时，一些可能的投资方向包括以下部分或全部内容：\n\n- **人员配置**：增加人手，以妥善负责和管理营销分析流程。很可能需要为前面讨论过的头两个技能领域——分析能力和技术能力——增加额外人员。\n\
  - **系统**：必要的系统，用于收集、追踪、分析和报告营销分析流程所需的数据输入。\n- **培训与教育**：即使人员到位，技能可能仍不匹配。通常需要培训和教育来装备负责管理营销分析流程的团队，并提供一定程度的继续教育。\n\
  - **外部咨询、服务或专业知识**：在营销分析中取得成效的最快途径可能是借助外部专业知识。咨询和服务通常有助于加速流程的实施和成功。\n\n营销分析并非一项昂贵的事业，但要想产生影响，确实需要一些资金投入。图\
  \ 2-5 总结了从 700 多位高管和营销专业人士那里收集的数据，展示了他们分配给分析的预算百分比。正如该图表及第 2 章中的相关讨论所示，营销分析的回报与投资成正比。那些将大部分营销预算分配给分析的组织，声称从他们的努力中获得了最大收益。\n\
  \n在营销分析中，合理的投资水平是多少？正如第 2 章所讨论的，这个水平介于营销预算的 6% 到 10% 之间。这只是一个指导原则。在营销分析的资金投入上，常识应占主导地位，确保资金充足，以支持该流程的成功。\n\
  \n## 审视目标\n\n> 目标不是命运，而是方向。它们不是命令，而是承诺。它们不决定未来，而是调动企业资源和精力以创造未来的手段。 ——彼得·德鲁克，《管理》\n\
  \n市场营销的工作应支持企业目标。如果方法得当，营销战略和目标的制定应建立在对公司目标和宗旨的深刻理解之上。毕竟，营销的目的是帮助组织在追求这些目标的过程中取得成功。\n\
  \n营销分析应直接反映组织的营销战略，并间接反映该战略所依据的企业目标。因此，启动营销分析的一个重要部分就是确定、完善或明确这两类目标：营销目标和企业目标。在营销团队制定自身战略以及衡量其成效的分析指标时，必须始终清晰聚焦这些目标。从营销分析流程，到营销战略，再到企业目标和宗旨，应有一条清晰可辨的连续性主线贯穿始终。\n\
  \n营销分析实施规划应从审视企业目标或宗旨入手，这些目标通常表述得相当宏观。企业目标代表了组织希望达成的成果。营销战略则是如何实现这些目标的一种表达方式，而分析指标则是成功的指示器。\n\
  \n例如，一个常见的业务或企业目标是提高盈利能力。公司内的所有部门都应确定各自应采取何种战略来实现这一目标及所有其他企业目标。营销部门可能会决定通过两种战略来提高盈利能力：在现有市场中提高现有解决方案的市场渗透率，以及提高客户留存率。随后，营销部门将围绕这两个战略要素规划工作，每个要素又会分解为多个策略或项目。\n\
  \n当然，每项举措都应附有一些相关指标。当营销举措和指标像这样自上而下地制定时，组织就能在一定程度上确保高层企业目标与营销部门所做的事情之间的一致性。保持企业目标与营销工作之间的一致性或连续性至关重要。确保这一点的途径之一是，在战略规划流程开始时，将企业目标作为输入，并在整个过程中始终牢记这些目标。\n\
  \n尽管以企业目标为起点来启动营销规划和分析流程并不能保证成功，但它确实能确保你方向正确。正如斯蒂芬·柯维所描述的那样，这种方法“以终为始”。由此产生的战略和指标是正确的可能性会高得多。\n\
  \n这种从企业目标推导出营销战略的规划流程不难理解，并且假设有一套清晰阐述的企业目标存在，执行起来也不算太难。如果没有明确的企业目标和宗旨呢？营销部门是否只能在真空中制定其战略和相关分析？在这种情况下，营销部门该怎么做？\n\
  \n现实情况是，并非每个组织的领导层都理解有意制定并向员工传达高层目标的价值。这并非因为这些目标不存在——它们通常存在于领导者的脑海中——而是因为它们从未被有效传达（或者根本没有传达）。这种沟通缺失的原因多种多样：未能认识到其必要性、缺乏领导力或沟通技巧，或者只是认为这些目标对每个人来说显而易见，因此无需沟通。无论原因如何，在这种情况下，营销部门必须在制定战略之前尽力洞察企业目标。解决方案通常很简单，就是与\
  \ CEO 坐下来讨论一下目标。\n\n在启动营销分析流程时要记住的一点是：始终确保分析能够追踪和衡量营销战略的执行情况，并且确保营销战略是基于企业目标和宗旨的。\n\
  \n\n\n## 确立度量指标\n\n> 衡量忙碌程度远比衡量业务成效要容易得多。 ——赛斯·高汀\n\n营销分析的所有规划最终都会归结为：选择恰当的度量指标，建立测量和追踪这些指标的流程，然后利用数据采取行动。\n\
  \n当你刚开始接触分析时，将每一个可能用到的营销指标都纳入考量并非明智之举。相反，应从少数最相关的指标入手，随着你对分析流程的日益熟练，再逐步扩充指标组合。事实上，很可能发生的情况是，你最初选定的那套指标会引导你发现其他同样需要追踪的指标。\n\
  \n对于营销分析流程而言，什么才是合适的指标组合？答案完全取决于组织的营销策略。正如前一节所讨论的，最佳或最合适的指标组合源自营销策略本身。营销分析流程中常用到一些指标类别，包括营销流程指标、客户指标、潜在客户生成指标以及社交/数字营销指标。\n\
  \n> **注意**  \n> 常见的营销指标类别包括：营销流程、客户、潜在客户生成以及数字营销这几个方面的衡量指标。\n\n你的指标组合应包含一些能反映营销团队生产力的指标。正如之前所提醒的，这些指标很容易变成“虚荣”指标，但如果使用得当，它们能帮助团队了解自身工作效率。这类指标的示例包括：已创建的资产数量、产生的曝光量、年初至今的预算状况或投资回报率（ROI）——这一主题在第\
  \ 6 章中有详细阐述。此类别中的恰当指标，应能帮助首席营销官及营销团队了解其工作完成情况。\n\n指标组合还应包含一些客户指标。这些指标是客户的“生命体征”，也是最重要的营销指标类别之一。许多重要指标都属于这一类，包括客户生命周期价值（CLV）、客户满意度、客户留存率、净推荐值（NPS）、新客户获取成本以及客户流失率。在理解营销工作的经济效益及其对收入的影响时，几乎所有这些指标都具有巨大的价值。\n\
  \n任何企业都需要源源不断的新潜在客户或线索，以推动销售和增长。与潜在客户生成活动相关的指标，是许多营销分析工作中至关重要的一部分。事实上，潜在客户生成是许多营销团队的主要活动，并且由于这项工作大部分是数字化的，因此有丰富的数据可供收集和分析。潜在客户生成流程的表现可通过多种方式进行追踪，包括：按渠道（如电子邮件营销、社交媒体营销、移动营销）统计的新线索数、按活动统计的新线索数、线索流量或数量、新增商机数、合格的线索数、转化率、每条线索/每条合格线索的成本，当然还有产生的收入。\n\
  \n最后一类指标广泛而庞大：数字营销。在此类别中，包含用于衡量日益增多的数字营销渠道的一系列指标。其中一些数字营销指标包括：\n\n- **网站**：流量来源、最常访问的页面、搜索排名、访问量或独立访客数、网站或页面停留时间、跳出率以及退出页面，这些对于衡量网站表现都至关重要。\n\
  - **社交媒体**：社交网络覆盖范围（粉丝、关注者、订阅者或联系人）、分享/转推数、互动量、帖子数以及引荐流量。你的社交媒体指标应包括博客相关数据。\n- **电子邮件营销**：数据库或列表规模、发送数量、打开率、点击率以及退信率，这些都是电子邮件营销的标准指标。\n\
  - **数字广告**：包括按点击付费及其他形式的付费数字媒体。关键指标可能包括：曝光量、点击量、咨询量、落地页浏览量、转化率、识别出的商机数、产生的收入以及项目投资回报率。\n\
  \n这里所呈现的仅仅是支持营销分析项目可用的指标中的一小部分。每个组织都会有一套略有不同的指标组合来支撑其流程。正确的指标应能衡量营销策略执行的成功与否，并展示真实成果。刚起步进行营销分析的组织应只选择少数几个指标来启动流程；随着成熟度的提升，他们应逐步为这里描述的每个类别都建立相应的指标。\n\
  \n**脚注**\n\n1. 大卫·拉布，《赢得营销测量马拉松》，2010 年 9 月，[`www.marketo.com/_assets/uploads/Winning-the-Measurement-Marathon-final.pdf`](http://www.marketo.com/_assets/uploads/Winning-the-Measurement-Marathon-final.pdf)。\n\
  2. 斯科特·布林克，《营销技术专家的崛起》，Chiefmartec.com 博客，2010 年 4 月 18 日，[`http://chiefmartec.com/2010/04/rise-of-the-marketing-technologist/`](http://chiefmartec.com/2010/04/rise-of-the-marketing-technologist/)。\n\
  3. 参见[`http://www.netpromoter.com/why-net-promoter/know/`](http://www.netpromoter.com/why-net-promoter/know/)。\n\
  \n\n\n"
- "# 6. 投资回报率\n\n## 终极指标？\n\n对于许多营销人员来说，证明市场营销的投资回报率（`ROI`）长期以来一直是他们的心头之痛。营销部门以外的人一致赞成让营销部门报告其`ROI`。他们希望营销部门能像其他部门一样，对`ROI`负有同等责任。而营销部门内部则意见不一。一些营销人员欣然接受计算和报告`ROI`，认为这是验证营销工作的最佳方式。他们认识到，能够准确报告营销的`ROI`可以赢得认可，并且如果回报达到或超过预期，就可以更轻松地证明预算和资源的合理性。`ROI`\
  \ 有可能使营销资金和运作去政治化。\n\n营销团队中的其他人则担心需要衡量自己的`ROI`，因为这可能暴露出低绩效，并使他们面临不利后果。还有一些人干脆认为，专注于`ROI`会损害营销的真正使命。无论立场如何，营销部门在将`ROI`作为一项指标方面一直进展缓慢，正如漫画家\
  \ Brady Bonus 在图 6-1 中所描绘的那样，`ROI`成为营销讨论的一部分仍然是个例外。\n\n![A978-1-4842-0259-3_6_Fig1_HTML.jpg](img/A978-1-4842-0259-3_6_Fig1_HTML.jpg)\n\
  \n图 6-1。 对于大多数营销组织而言，理解其`ROI`仍然难以捉摸\n\n在营销人员面临的挑战中，证明`ROI`是首要挑战，其排名远在争取预算之上。¹ 无论营销人员是喜欢还是讨厌接受`ROI`的审视，许多高管层成员都期望看到这些数字，因此营销部门应该理解它是什么以及如何报告它。\n\
  \n营销`ROI`的一个问题是，许多营销人员根本不理解它是什么，正如这个 Quora 帖子²所说明的那样：\n\n*   问题：“对于一家咨询公司的数字营销活动，什么样的`ROI`被认为是好的？”\n\
  *   回答：“如果你能花低于 50 美元的成本产生销售线索，那你可能做得相当不错了。特别是当你的合同金额很可能在数千美元左右时。对于像电子书下载这样的‘软转化’，20%的响应率也被认为是好的。”\n\
  \n这个帖子的回答虽然有所帮助，但从未明确提及任何关于`ROI`的内容，尽管它提供了一些可能有助于确定`ROI`的数据。\n\n`ROI` 是一个衡量每次投资所获利润的盈利比率，其结果以百分比表示。企业将`ROI`作为衡量各种投资和项目成功与否的指标。它既用于评估过去的成功，也用于预测未来的成功。计算`ROI`的公式相当简单：\n\
  \n![$$ \\mathrm{Return}\\kern0.5em \\mathrm{on}\\kern0.5em \\mathrm{Investment}\\\
  kern0.5em =\\kern0.5em \\frac{\\mathrm{Gain}\\kern0.5em \\mathrm{on}\\kern0.5em\
  \ \\mathrm{investment}\\kern0.5em \\hbox{--} \\kern0.5em \\mathrm{Cost}\\kern0.5em\
  \ \\mathrm{of}\\kern0.5em \\mathrm{investment}}{\\mathrm{Cost}\\kern0.5em \\mathrm{of}\\\
  kern0.5em \\mathrm{investment}} $$](img/A978-1-4842-0259-3_6_Chapter_TeX2GIF_Equa.gif)\n\
  \n在计算中，成本部分不难获得。而这个等式中的“收益”要素却难以在足够的精确度下衡量，以使人们对结果产生信心。\n\n为了说明这一点，以参加贸易展会为例，这是一种常常需要证明其合理性并报告后续`ROI`的营销活动。本例中的假设是，参会最终会带来可归属的销售收入。如表\
  \ 6-1 所示，`ROI`的计算似乎非常简单，只需考虑硬性成本和收入。\n\n表 6-1。 确定展会`ROI`的示例\n\n| 描述 | 成本 | 收益 |\n\
  | --- | --- | --- |\n| 展位/赞助费 | $15,000 | — |\n| 运输费 | $1,500 | — |\n| 差旅费 | $2,500\
  \ | — |\n| 促销品费用 | $1,000 | — |\n| 宣传资料及其他费用 | $1,000 | — |\n| 总成本 | $21,000 | —\
  \ |\n| 展会线索带来的销售额 | — | $45,000 |\n| 总回报 |   | $24,000 |\n| `ROI` |   | 114% |\n\
  \n表 6-1 中的示例似乎让确定参加展会的`ROI`变得简单，而事实上，这里显示 114%的`ROI`意味着这项投资的回报非常出色。然而，这个场景没有考虑的是那些虽然真实存在但难以量化的软性收益。例如，品牌知名度的提升、作为行业思想领袖声誉的增强、收集到的竞争情报，以及通过与展会参会者面对面交流而产生的新产品创意。这些收益都没有在表\
  \ 6-1 所示的`ROI`计算中体现出来，而其最终价值可能远远超过本例中 45,000 美元的销售额。当硬性成本和收益带来 114%的`ROI`时，或许核算这些软性收益并不重要，但当业务案例处于盈亏平衡或显示亏损时，量化这些软性收益就变得至关重要，然而却很难做到。\n\
  \n尽管存在这些挑战，衡量营销的`ROI`在政治上是明智之举。营销人员不能抱着精英主义的态度，仅仅因为他们认为自己是一种无法衡量的、行善的神秘力量，就将自己置于`ROI`衡量的责任之上。组织中没有任何其他部门可以免于达到`ROI`期望的要求。为什么营销部门就要例外呢？\n\
  \n现实情况是：在大多数组织中，以高度确定性来衡量营销的`ROI`是一个严峻的挑战，一些营销人员甚至认为这是不可能的。而日益完善的系统、技术以及使用它们捕获确定`ROI`所需数据的便捷性，正在使其成为可能。然而，并没有一个系统能够捕捉营销为创造价值所做的一切。即使有数据可以精确计算营销的`ROI`，业内一些人认为这并不总是合适的，而另一些人则认为这样做是完全错误的。\n\
  \n你如何将更好的客户体验转化为`ROI`？营销人员使用的系统正在变得更好，他们使用这些系统的纪律也在增强，但你仍然无法将营销所做的一切都转化为`ROI`衡量指标。为了说明这一困难，SHIFT\
  \ Communications 战略执行副总裁 Scott Monty 曾说过：“早上穿裤子能带来多少`ROI`？”³ 很难确切知道答案，但不穿裤子的负面后果却很容易想象。营销也是如此：它必须做一些事情，仅仅因为做这些事情是合理的——就好比早上穿裤子这个比喻——因此，捕捉营销所做一切的`ROI`是没有意义的。\n\
  \n\n\n数字、品牌与传播设计公司 Forty 的创始人兼 CEO 詹姆斯·阿彻（James Archer）对他所谓的营销与广告行业的“指标迷恋”持更强烈的反对态度：“随着技术赋予我们的行业以前所未有的速度测量更多事物的能力，一种日益明显的趋势是将指标作为设计与创意工作的基础，其理念是这将确保营销工作的投资回报率。这种方法安全、可预测、简单、便于向老板展示、也便于向客户展示。它让每个人都看起来不错，感觉良好。但它是错的。”⁴\
  \ 即使在行业内部，关于衡量投资回报率也并没有达成共识。一些人认为这势在必行，另一些人认为它无伤大雅，还有一些人则认为它实际上会造成危害。\n\n营销人员所做的某些事情确实有助于简单轻松地收集数据和计算投资回报率。例如，营销活动产生的任何网站流量，普通营销人员都可以利用它用数据淹没整个组织，并令人信服地谈论投资回报率。将收入归因于线索生成活动——这是许多营销组织的主要职责——相当简单。在收入和支出已知的情况下，确定任何数字营销活动的投资回报率通常只是简单的算术问题。\n\
  \n品牌建设和知名度提升，同样是大家公认的重要职责，也落在营销部门肩上。品牌资产并非那么容易衡量，即使可以衡量，它对收入的影响也很难完全理解。为了说明这一点，设想一群参加足球比赛的家长，由于你为他们设计的美妙客户体验，他们在孩子们比赛期间在场边热情地谈论你的公司或产品。这种对品牌的好感非常棒，但根本没有办法轻易捕捉这些好感数据。组织可能会从这种口碑宣传中受益，但如今根本不可能确定其投资回报率，即便可能，其中也可能涉及各种隐私方面的考量。\n\
  \n在关于对投资回报率应持何种态度的问题上，现代营销人员仍然面临困境。以下是营销部门衡量投资回报率的几种文化与现实情况：\n\n*   关于营销成效的轶事不足以替代投资回报率数据。在压力之下，营销人员擅长从自身经验中提炼出生动且鼓舞人心的轶事，用以说明营销的价值和有效性。这类轶事信息往往具有说明性，但不能作为真实投资回报率信息的可接受替代品。\n\
  *   轶事信息有时非常有用。当呈现关于营销的有效投资回报率数据时，轶事对于帮助建立背景和视角非常有效，并且能为数据增添色彩。\n*   市场景气时，没人会过多考虑营销的投资回报率。在大多数公司的生命周期中，总有那么一段顺风顺水的时候：每月刷新销售纪录，赢得“年度产品”或“最佳雇主”等奖项，客户和媒体的好评如潮。在这样的环境下，公司内部没多少人会考虑营销的投资回报率。每个人都默认营销工作做得极其出色，而且通常也确实如此！“东西没坏，就别修”是占主导的态度。在这种时期，营销部门在报告投资回报率方面会被免于考核，但如果真的被免了，还傻乎乎接受那才叫蠢。\n\
  *   市场艰难时，聚光灯会打在营销部门身上，对其投资回报率的审视会成为全公司的消遣。营销部门会收到来自公司各个角落的质疑性问题：“你们最近为我们做了什么？”公司正遭受收入枯竭之苦，每个人都指望营销部门能带来甘霖。关于营销支出的艰难讨论和尖锐问题不可避免，因为通过某种神奇的转变，公司里的大多数人都变成了营销领域的所谓专家。如果没有关于营销绩效的投资回报率数据，每个人都会做最坏的打算。不仅营销部门的声誉会受损，其人员编制也常常会随之缩减。\n\
  \n每家公司都有其独特的个性和文化，这影响着它们如何看待营销投资回报。以财务或工程文化为主导的公司，往往“不理解”营销的价值。它们以数据为导向的文化使其难以接受营销所提供的无形利益，因此营销在这些方面也得不到认可。在这种文化中，营销等同于“花架子”，要想获得尊重，更别提预算了，都难上加难。没有投资回报率数据来证明营销正在帮助创造收入，营销部门就很难帮助这些公司取得成功。而当它确实有所贡献时，功劳又往往归于别处。\n\
  \n拥有销售和营销文化的公司，在理解营销价值方面则更可能“开窍”。这些文化下的公司高度重视营销，几乎有一种直觉式的理解：营销是销售引擎的润滑油——即使你看不见，你也知道它在发挥作用，没有它引擎就无法运转。投资回报率固然有用，但对这些公司而言，营销是一种必需，无论是否有确凿的投资回报率证明，它都会以某种形式存在。\n\
  \n\n\n对于某些组织而言，ROI（投资回报率）很可能是其营销分析过程中最重要的指标。但对其他组织来说，它既不适合也不是硬性要求。绝不能想当然地认为 ROI\
  \ 对所有人都必须是必备指标或关键绩效指标。持有这种想法无异于本末倒置。还有什么比实现目标更重要呢？正如第 4 章所讨论的，分析过程的一部分就是理解业务目标、执行有助于实现这些目标的营销策略，并选择能够指示该努力是否成功的指标。营销活动能否在不使用\
  \ ROI 作为指标之一的情况下实现其目标？诚实的答案是“能”。在指导营销工作的指标组合中，并不总是需要包含 ROI，但组织中的其他部门可能不这么认为。\n\n\
  营销人员必须对 ROI 保持正确的视角。它绝不应成为“尾巴摇狗”的主角。同时，营销人员也不能对 ROI 掉以轻心，因为有些时候，展示回报的能力恰恰是维持营销职能完整性的关键。其中一种情况就是管理层要求营销部门削减开支。能够展示其持续带来回报的营销部门，才有能力捍卫自己的预算，甚至——如果它真正发挥创收中心的作用——或许还能扩大预算。\n\
  \n当公司遭遇经济困难时期，CEO 和 CFO 往往被迫削减开支。大多数经验丰富的营销人员都知道，高管们寻找削减成本的首要目标通常是营销部门。无论这种刻板印象多么不公平，包括\
  \ CEO 在内的许多组织成员都认为营销部门存在浪费和过度开支。当 ROI 未被衡量和报告时，营销部门就会成为这种刻板印象的受害者。因此，衡量 ROI 可以为营销部门提供一面盾牌，有助于抵御在几轮预算削减中试图大幅削弱营销部门的企图。\n\
  \n那么，营销人员应如何看待报告其工作的 ROI？在这种在许多公司内部引发部门间摩擦的问题上，他们应该采取什么立场？营销的主要追求并非创造回报，而是帮助企业实现其目标。尽管这样做几乎总会伴随着某种回报，但当营销组织开始过分痴迷于\
  \ ROI 时，他们可能会失去焦点。正如 Millward Brown 公司执行副总裁戈登·怀纳所言：“将营销与财务绩效联系起来，现在不是——实际上也从来不仅仅是——关于投资回报率（ROI）。量化营销活动所实现的回报，是连接营销与财务流程中的一个必要步骤，但其本身并不足以理解营销如何帮助实现业务目标，或如何改进其贡献。”⁵\n\
  \n营销的核心焦点应始终坚定地放在实现业务目标上。当营销部门恰当地从业务目标中推导出自身目标，并用相关指标衡量实现目标的进展时，并不总是需要强行将 ROI 纳入指标组合。有时，将\
  \ ROI 作为一项指标意义重大。而在其他时候，使用 ROI 作为指标并不能真正帮助营销部门更有效地执行其计划。ROI 作为指标的最大缺陷之一，是它无法诊断出\
  \ ROI 低的根本原因。从这个意义上说，它有点像营销车辆仪表板上的“检查发动机”灯，只能告诉你某个地方出了问题，却无法指出问题所在。因此，了解营销的 ROI\
  \ 并不能直接帮助营销人员提高其有效性。\n\n与此同时，营销人员必须保持政治上的敏锐。在某些情况下，经济形势和公司文化的影响使得报告 ROI 成为必需。如果\
  \ ROI 是 CEO 和 CFO 用来衡量部门贡献并决定资金分配的标尺，那么营销部门必须参与其中。这在存在组织孤立的公司尤其如此，即一个部门或孤立单位将另一个部门视为资源竞争者。在这种环境中，ROI\
  \ 可能被用作杠杆，以便在资源争夺和争取青睐的谈判中获取对另一个部门的优势。\n\n事实上，公司内部各部门之间应该存在一种健康的竞争水平，因为它能催生创新和效率。在拥有强大、健康文化的公司里，这种竞争对每个人都有利。而在存在功能失调或不健康文化的公司——特别是当这种失调表现为组织孤岛时——ROI\
  \ 指标就可能变成一种武器，不仅用于推进本部门的议程，还可能用于损害其他部门。\n\n那么，ROI 是营销的终极指标吗？并非如此，但这并不意味着营销人员可以忽视\
  \ ROI。当 ROI 有助于衡量实现目标的实际进展，或作为管理整个过程的有效工具时，营销人员应在指标组合中使用它。营销部门为创造收入所做的任何事情，例如需求生成和潜在客户开发活动，都可能需要附带\
  \ ROI 指标。如果营销部门能够追踪其帮助创造的收入，那么 ROI 的计算就仅一步之遥。\n\n> **注意**  \n> 当 ROI 有助于衡量实现目标的实际进展，或作为管理整个过程的有效工具时，营销人员应在指标组合中使用它。\n\
  \n营销部门还会发现，在需要定位营销为组织创造的价值时，报告 ROI 也很有用。报告 ROI 可以证明营销不是一个成本中心，而是一个创收中心。报告 ROI 的需求也可能源于内部的政治压力，例如当营销部门的预算或生存受到威胁时，或者仅仅因为这是证明营销支出合理的最佳方式。衡量营销\
  \ ROI 的必要性因组织而异，因此每个组织都必须确定什么是有意义的，而不能想当然地认为它始终是正确或错误的事情。\n\n\n## 投资回报率（ROI）衡量的挑战\n\
  \n> 我们往往高估那些可衡量事物的价值，而低估那些不可衡量事物的价值。 — 约翰·海耶斯，美国运通首席营销官\n\n即使组织内部对于理解营销投资回报率的必要性达成完全一致，做起来也并非易事。大数据分析解决方案与整合营销应用提供商`Teradata`报告称，75%尝试计算投资回报率的营销人员表示在过程中遇到了某种问题或挑战。即便存在报告营销\
  \ ROI 的意愿，重大的挑战依然存在。\n\n衡量营销 ROI 的挑战之一，在于确定数据采集和 ROI 报告的范畴或层级。营销部门是否应该报告整个营销职能的\
  \ ROI，提供一个代表宏观视角的单一指标？还是应该采取 ROI 的微观视角，针对其工作的特定方面（例如需求生成）进行报告？对于那些营销部门希望进行的投资（例如购置重要技术或执行某项营销活动），开发基于\
  \ ROI 的商业案例又该如何处理呢？确定营销 ROI 衡量工作的范围，是营销人员将面临的首要挑战之一。\n\n为什么不报告整个营销职能的 ROI 呢？为什么不直接确定营销所做一切事情的回报率呢？从概念上讲，这是一个绝妙的主意，但实际操作起来却很困难。指标报告的范围越宏大，有时反而会使这些指标的意义降低。单一\
  \ ROI 衡量指标很可能在某个领域低估营销的真实价值，而在另一个领域又高估它。这里的警示与使用平均值时非常相似。正如一位老统计学家所言：如果你的脚在冰水里，头在烤箱里，平均而言，你感觉很舒适。因此，宽泛或高层的衡量指标并非总是那么有用，有时还会在无意中产生误导。\n\
  \n即便在当今的数字营销时代，要理解营销每项活动对收入的影响并捕获这些数据，仍然是一项不可能完成的任务。对于营销活动中那些与收入有直接关联的部分，例如数字营销活动，衡量起来就相当容易。营销人员可以将特定的收入交易与营销活动关联起来，从而实现\
  \ ROI 的精确计算。如果营销部门所做的仅仅是执行易于衡量的营销活动，那么确定整个营销职能的 ROI 就相当直接了。\n\n显然，大多数营销职能并非只运行数字营销活动。它们为其组织提供广泛的服务，其中许多服务都难以衡量其对收入的影响。例如，营销部门如何计算在活动中赠送的促销品对收入的影响？高管在会议上发表的主题演讲如何影响收入？广告和其他品牌知名度活动的影响又如何呢？所有人都同意这些事情具有影响力和价值。但是，例如，很难将本地体育团队赞助所产生的品牌认知度，与那些因认出赞助商品牌而随后点击横幅广告的感兴趣粉丝的后续行为联系起来。这些归因挑战（第十章将更全面地探讨）使得精确计算营销\
  \ ROI 变得困难。\n\n如果营销部门只取其工作中可衡量的方面来确定其 ROI，然后以某种方式将该 ROI 推断至整个营销职能，那么由此得出的 ROI 百分比几乎肯定过低，因为它只计入了营销部分创收活动，而非全部。这种方法最终会稀释整个营销部门的\
  \ ROI 计算，因为它在计算中包含了所有营销成本，却只纳入了可直接归因的收入。这并不能呈现真实的 ROI 图景。\n\n有些人可能会争辩说，如果计算出的 ROI\
  \ 满足最低要求，那么上述 ROI 计算方法中的缺陷就无关紧要。也许在很多时候他们是正确的。但这种计算 ROI 的方法仍然是一种估算，因此在内部面临不被接受的风险。如果公司内部的利益相关者知道营销\
  \ ROI 估算仅仅是估算，那么营销部门可能无法看到该估算获得充分内部支持。即使这是一个保守的估算，营销部门也应预料到，在试图用这种方式得出的 ROI 来证明营销投资的合理性时，会遇到一些阻力。\n\
  \n如果能够计算出整个、完整的营销职能的 ROI，那将是理想的情况。对大多数营销组织而言，现实情况是：要么数据根本不存在，要么获取数据以实现具有一定精确度计算的成本过高或过于困难。因此，在这个层面上了解营销的\
  \ ROI 必须附带免责声明。营销部门必须持续教育组织内的其他部门，让他们了解营销是如何创造价值的，以及为什么并非所有价值都可衡量。试图报告整个营销职能的 ROI\
  \ 并没有错，但该 ROI 信息需要附带解释说明。\n\n> **注意**  \n> 营销部门必须持续教育整个组织，让他们了解营销是如何创造价值的，以及为什么\
  \ ROI 指标无法衡量所有这些价值。\n\n更容易的做法是审视营销的一些独立组成部分。有了恰当的数据追踪，确定一次点击付费广告活动、参加一次贸易展会或营销部门为产生、筛选或培育潜在客户所做的几乎任何事情的\
  \ ROI，都并不困难。了解这些活动的 ROI 是有价值的，尤其是在比较两次类似活动时。但这种方法也有其缺陷，主要在于：衡量单一营销渠道的 ROI 忽视了现代营销真正的多渠道特性。营销人员使用大量渠道开展工作。将客户在购买周期中完成转化的所有功劳都归因于一个渠道，完全忽视了影响该转化的所有其他渠道。因此，为独立的营销组成部分或渠道计算\
  \ ROI 也并非理想方案。\n\n除了确定 ROI 的范围和粒度之外，还存在其他挑战，例如数据挑战。这一挑战是多方面的，涉及到获取或整合确定 ROI 所需数据时面临的技能、协调、组织问题，甚至文化问题。事实上，`Teradata`数据驱动营销调查显示，营销人员计算\
  \ ROI 的首要障碍是缺乏数据整合。\n\n营销在数据方面面临的挑战部分在于所有权：许多营销组织无法掌控自己的数据命运，因为它们并不对自己拥有的数据承担主要责任。事实上，只有不到三分之一的营销人员声称拥有或控制客户数据，超过一半的营销人员表示他们依赖\
  \ IT 部门来获取数据。如果营销部门无法不受限制地实时访问其数据，这将阻碍任何类型的分析流程，更不用说计算 ROI 了。\n\n数据访问的挑战常常因一个老对手——组织孤岛——而变得更加糟糕。当存在孤岛时，为任何目的（而不仅仅是确定\
  \ ROI）共享数据和信息所需的跨部门合作，就变成了一场低效的外交斡旋。猜疑丛生，围绕数据、信息及其控制权的领地之争不断上演。试图获取营销部门计算 ROI 所需的数据，可能需要消耗超出营销部门现有或愿意支付的政治资本。\n\
  \n\n\n## 影响市场营销获取所需数据的因素\n\n另一个阻碍市场营销部门获取所需数据的因素是组织协调不一致。当市场营销的目标与销售目标或其他关键组织目标未能良好对齐时，不仅是在投资回报率（ROI）的确定上，在诸多其他领域也很可能存在问题。然而，具体到\
  \ ROI，当销售和市场营销这两个紧密相关的职能拥有不同目标时，它们会收集不同的数据。这种协调问题带来的影响是，市场营销为了进行恰当、准确的 ROI 计算所需的数据可能根本不存在。\n\
  \n在某些情况下，市场营销部门无法获取所需数据，是因为它已经放弃了责任，对这个问题撒手不管（可以这么说），因为这项工作需要该部门所不具备的技术技能。正如图 2-1\
  \ 所示，市场营销工作的轨迹无疑正朝着技术化方向发展。市场营销人员不能再维持技术上的无知，简单地将任何技术职能外包给 IT 部门或其他团队。即使市场营销部门不打算管理分析流程或计算其\
  \ ROI，它仍然需要技术技能来完成工作。缺乏必要技术技能的市场营销部门，正将自身命运中日益增长的一部分控制权，拱手让给部门外部那些可能同情也可能不同情市场营销的人。\n\
  \n销售流程的复杂性及其长度，也会给市场营销衡量 ROI 的努力带来挑战。在 B2B 环境中，长期且复杂的销售周期相当常见。在这种情况下，通常能够确定的是流程的开始时间——在收集到合格线索时，以及流程的结束时间——在达成销售时。在这两个端点之间，存在着通过多种渠道产生的众多影响因素，它们推动线索最终转化为销售。其中一些因素易于追踪，而另一些则完全未知。更长的销售周期通常会涉及更多这些影响因素。这些因素包括品牌印象和培育活动，而且很容易忽略在某个特定客户的销售周期中发生了哪些活动，或哪些活动是有效的。\n\
  \n确定市场营销 ROI 的挑战众多。面对报告 ROI 的压力，首席营销官（CMO）该怎么办？答案取决于该组织在营销分析和 ROI 方面已经处于什么阶段。任何希望报告其\
  \ ROI 的营销组织都应关注该指标的精确性，因为精确性带来可信度。将 ROI 用作市场营销的指标或关键绩效指标（KPI）很像跑马拉松：如果你以前从未跑过，你不能第一次就系好鞋带跑完\
  \ 26.2 英里。相反，从较短的距离开始，慢慢提升。在刚开始确定市场营销 ROI 时，为了避免不知所措，请遵循一条演进路径。\n\n*   **起步**：在衡量\
  \ ROI 时，不要试图“煮沸整个海洋”。先选择市场营销工作中的某些方面来确定其回报，从而让自己入门。例如，即使是刚刚起步的营销组织，也能确定付费搜索或其他数字营销活动的\
  \ ROI，因为这些数据是现成的。这里有个问题：营销部门中许多“入门级”的 ROI 衡量领域可能与组织目标几乎或完全无关。开始时，为了学习如何衡量和使用 ROI，这种不协调是可以接受的。但请确保衡量工作不要止步于此。在这个早期的学习阶段，ROI\
  \ 的衡量结果可能应该保留在市场营销部门内部。\n*   **扩展**：将 ROI 流程和指标应用于更广泛的市场营销工作。一旦在衡量和使用 ROI 方面获得一定熟练度，就应将其应用于重要的事项。使\
  \ ROI 的衡量与目标保持一致——无论是市场营销的目标还是组织的目标。正如本章所讨论的，数据的可用性或可访问性通常是实现这一点的挑战。在这个扩展阶段，你还需要开始将市场营销的\
  \ ROI 结果展示给部门外部人员，以此来测试文化氛围。这对市场营销来说仍然是一个学习过程，但同时也变成了一个教学体验。市场营销需要帮助组织的其他部门理解如何使用和解读其提供的\
  \ ROI 数据。在这个扩展阶段，市场营销不应过于雄心勃勃，试图表达其所有工作的 ROI。此处的目标是在其工作中一些战略性选择的领域，为市场营销使用 ROI 赢得认可。\n\
  *   **整合**：将 ROI 作为营销分析流程的一个组成部分，并依据常识尽可能广泛地加以应用。当 ROI 作为指标成为决策的关键影响因素时，它的使用就已经变得不可或缺。当组织达到这一成熟阶段时，本章讨论的所有关于使用\
  \ ROI 的注意事项都应适用。在适当的背景下使用 ROI，即将其作为改进的指标或工具，而不是对市场营销的裁决。确保围绕 ROI 的计算过程具有完全的完整性：不要在计算中使用推测性数据或估计值。确保文化环境是包容的，因为在这个阶段，市场营销的\
  \ ROI 结果完全透明，ROI 可能成为评判市场营销工作的唯一标准和裁决者（有时甚至是刽子手）。\n\n\n\n## 投资回报率并非万能\n\n> 大多数人使用统计数据，就像醉汉使用路灯柱——更多是为了支撑，而非照亮。\
  \ ——马克·吐温\n\n如本章所述，将`ROI`作为营销指标有其利弊。争议的一方认为`ROI`是终极营销指标，而另一方则认为`ROI`并不重要，甚至作为营销指标是有害的。这两种立场都无法代表营销在`ROI`指标上应有的定位。正如许多两极分化的争论一样，真相往往介于两者之间。\n\
  \n暂且抛开准确衡量营销任何行为或整体行为的`ROI`所面临的所有挑战不谈。`ROI`指标既无法让营销部门，也无法让企业其他部门全面了解营销的绩效表现或改进方向。事实上，没有任何一个单一的指标能服务于这一目的。要正确进行营销分析，需要多项指标才能提供完整而准确的视角。将`ROI`视为那唯一的关键指标是不合理的。那些希望营销成败全系于`ROI`的财务实用主义者必须认识到，其他指标往往更能揭示真实的营销成果。这些指标包括市场份额、客户生命周期价值、留存率和客户获取成本等。\n\
  \n而那些认为`ROI`在指标体系中没有立足之地的人，也必须正视一个事实：`ROI`确实能提供实际价值。对于某些营销活动而言，`ROI`是一个极佳的效果指标。诚然，营销存在一些难以或成本过高衡量且重要的无形贡献——`ROI`显然不适用于评估这些方面。但大多数营销活动和潜在客户开发工作则很容易进行`ROI`的测定与审视。在合理的情况下，营销部门应当拥抱`ROI`。此外，营销理想主义者必须明白，有时参与`ROI`的游戏不过是出于权宜之计或政治上的明智之举。如果报告`ROI`是获取资源或保障营销未来的途径，那么营销人员就应该毫不犹豫地去做。\n\
  \n关于`ROI`与营销的正确立场应该是：在合理的场景下使用`ROI`。它是一个重要的指标，但它是达成目的的手段，而非目的本身。营销人员应当主动掌控确定和报告`ROI`的过程，而不是被这个过程所掌控。同时要认识到，由于本章讨论的各种挑战，将`ROI`作为营销指标使用需要时间才能成熟。然而，不难预见，在不太遥远的未来，用于追踪、收集和报告目前尚难获取的`ROI`所需输入数据的改进系统，将变得标准化且易于获得。随着营销技术的持续成熟，精确了解整个营销职能的`ROI`能力将变得更为触手可及。\n\
  \n## 脚注\n\n[1] “2014 年入站营销状况”，Hubspot，第 31 页，`http://www.stateofinbound.com/`。\n\
  \n[2] `http://www.quora.com/What-is-considered-a-good-ROI-for-a-digital-marketing-campaign-for-a-consultancy-company`。\n\
  \n[3] 菲尔·约翰逊，“早上穿裤子的投资回报率是多少？衡量与问责的困境”，《广告时代》，2009 年 10 月 20 日。\n\n[4] 詹姆斯·阿彻，“指标之欲：你真的能很好地衡量营销投资回报率吗？”，`http://forty.co/metric-lust-how-well-can-you-really-measure-marketing-roi`。\n\
  \n[5] 戈登·怀纳，“营销效果：不仅仅是投资回报率”，Millward Brown 博客，2008 年 2 月。\n\n[6] “Teradata 数据驱动营销调查，全球版”，2013\
  \ 年，Teradata，第 28 页，`http://teradata.com/`。\n\n[7] “2013 年 Teradata 数据驱动营销调查，全球版”，第\
