  \ 。\n\n7\n\n“销售与营销分析”，第 25 页。\n\n8\n\n“销售与营销分析”，第 27 页。\n\n"
- "# 8. 工具与技术\n\n营销分析的助力者\n\n自人类起源以来，每当有工作要做，我们通常会发明某种工具来帮助我们完成。每当我们意识到需要完成一项重复性任务时，几乎立即开始寻找通过发明工具来简化任务的方法，并且在使用过程中不断改进这些工具。工具使我们能够更快地完成工作，实现更高的精度和效率，或简化工作，使其所需的技能或精力更少。\n\
  \n营销分析无疑是一门受益于工具存在的学科；不仅如此，工具还能赋能整个流程。如果没有一些基本工具和技术，营销人员会发现，在利用分析改善成果的努力中，几乎不可能考虑超出最简单指标之外的任何东西。借助工具，营销人员可以构建并管理一个可持续的分析流程，这个流程范围足够广泛，能够处理提供营销绩效真实图景所需的大量数据。因此，拥有合适的工具和技术集合对于创建和管理有效的营销分析流程至关重要。\n\
  \n> **注意**  \n> 营销分析是一个技术驱动的流程。拥有合适的技术和工具对成功至关重要。\n\n在营销分析领域，既有“工具”也有“技术”，尽管这两个术语常被互换使用，但区分开必备技术与提供更专业功能的工具是有益的：\n\
  \n*   **技术**：支持核心营销流程和结果追踪的基础平台、系统或技术云。\n*   **工具**：专注于特定功能的软件解决方案，例如第 7 章讨论的仪表盘功能。\n\
  \n这种技术与工具之间的划分并非绝对；在此只是为了描述这两类之间的广泛差异。\n\n随着营销技术格局的持续扩张（新解决方案不断涌现）和整合（供应商相互收购），技术与工具之间的界限正变得模糊。许多曾经只能在独立、单独的工具中使用的功能，现在已集成到营销人员使用的基础系统中。划分界限的目的是为了明确区分那些不仅是分析，更是营销所必需的底层基础设施技术，与那些简化特定分析功能的锦上添花的工具。本章其余部分将更详细地探讨技术与工具，并提供营销人员如何使用它们的示例。\n\
  \n## 营销分析技术\n\n> 信息技术最大的好处是它赋予人们做自己想做的事的能力。它让人们发挥创造力。它让人们提高效率。它让人们学习以前认为自己无法学会的东西，所以从某种意义上说，它关乎潜能。¹\
  \ ——史蒂夫·鲍尔默\n\n正如第 5 章所讨论的，营销并没有一个“记录系统”。营销组织使用日益多样化的技术和平台组合来完成其使命。在这个组合中，有些平台对营销团队来说几乎是不可或缺的，其中最主要的就是营销自动化。Demand\
  \ Metric 将营销自动化定义为使营销部门能够自动化、衡量并改进策略、活动和工作流程绩效的策略、流程和软件技术。²\n\n在不久之前，营销自动化还被认为是一种奢侈品，主要出现在大型组织中。随着技术的发展，营销自动化变得功能更强大、价格更实惠，营销人员对其优势也有了更深入的认识。就在\
  \ 2013 年中期，不到 50% 的营销人员报告使用了营销自动化，而到 2015 年初，这一数字已上升到 61% 到 70% 之间（取决于企业规模），大型企业使用营销自动化的可能性略高。³\
  \ 这种营销基础设施显然已进入技术采用曲线的陡峭上升阶段。\n\n在其生命周期早期，营销自动化被视为营销人员的生产力辅助工具。它提供了构建营销活动落地页面和发送批量邮件的更好方式，并具备一些不错的报告和指标功能。通过持续使用，营销人员开始理解自动化系统中捕获的所有指标数据的价值，并开始懂得如何利用这些数据为自己带来优势。如今，该解决方案已经发展到这样的程度：“营销自动化”这一解决方案类别已无法充分体现其全部能力。自动化维度仍然存在，但它实际上更适合被视作一个“营销情报”平台，作为营销技术栈中几乎所有其他解决方案的集成枢纽和数据聚合点。\n\
  \n营销自动化与其他解决方案或工具之间存在这种高度集成，具有多重含义。与本次讨论最相关的一点是：营销自动化是营销分析工作中宝贵的数据聚合器和存储库。这些数据，加上营销自动化平台内置的分析工具，使其成为营销分析的基石技术，但这基于一个重大假设：该平台被完全实施。那些未能完成全面实施的组织将无法获得可用的营销分析优势。当营销自动化被完全实施时，它能够提供尽可能全面的客户旅程视图。\n\
  \n> **注意**  \n> 营销自动化是营销分析的基石技术，因为它能聚合数据并充当该流程所需的数据存储库。\n\n\n\n## 理解营销自动化在数据分析中的重要性\n\
  \n要理解营销自动化在赋能数据分析方面的重要性，不妨先思考购买旅程的典型推进方式。对于 81%的企业对企业（B2B）买家而言，这段旅程始于在网络上搜索解决方案。⁴\
  \ 当这个搜索行为将买家引向一家使用营销自动化的供应商时，有关这次访问的数据就会被捕获。此后与该潜在客户的每一次互动也同样会被记录。如果潜在客户为了获取内容或注册活动而分享其电子邮件地址，系统便会追踪邮件的打开、点击、分享以及其他指标。系统还会追踪潜在客户浏览了哪些网页，以及在每个页面上停留了多长时间。如果潜在客户注册了网络研讨会，或通过社交媒体与供应商互动，所有这些行为都会被记录下来。\n\
  \n通过捕获潜在客户与供应商的每一次数字接触信息，营销自动化系统积累了一份关于该潜在客户与供应商互动历程的历史记录。使用营销自动化的公司能够明智且富有成效地利用该系统解决方案收集到的关于买家旅程的详细指标。这些数据让营销人员能够精确了解旅程耗时多久、在何处陷入僵局或失败，从而学习在哪里部署内容、优惠或其他促销活动来加速流程，并将潜在客户转化为客户。一家商业地产科技公司的营销人员反思这种能力时分享道，他们正将自己的营销自动化系统与客户关系管理系统（CRM）集成，以“收集更多关于我们客户的信息，并利用这些数据来规定整个客户生命周期中信息传递的节奏以及他们从我们这里接收的内容”。\n\
  \nUrbanBound 是一家搬迁管理软件和解决方案提供商，它使用 HubSpot 营销自动化平台。该公司的集客营销协调员 Aria Solar 分享了对该解决方案重要性的看法：\n\
  \n> 我无法想象，在营销领域没有像 HubSpot 这样的平台，任何人如何能有效地完成工作。HubSpot 一直是我们最强大的武器之一，尤其是对于一家初创公司而言，因为我们正在与那些拥有稳固基础的大型公司竞争。HubSpot\
  \ 提供的数据简直无与伦比——任何你可能想知道的数字，无论是网站访问量、页面表现、博客点击量、社交媒体指标、行动号召（CTA）点击率（以及你能想到的任何其他数据），都尽在这个门户中。易于使用的界面让你能够将所有营销工作整合到一个地方，并提供基于数据的精确洞察，让你清楚地知道什么有效、什么无效。该平台信息的深度简直是无价的——它驱动着我们团队所做的一切。\n\
  \nSolar 接着反思了向数据分析、指标和数据驱动型营销的转变：\n\n> 营销被视为“手工工艺”的时代早已一去不复返——这在很大程度上要归功于像 HubSpot\
  \ 这样的平台。营销已经转变为一个完全由数据驱动的行业，其驱动力来自转化率、点击打开率、搜索引擎优化（SEO）、关键词分析以及提交率。HubSpot 不仅让你能够看到所有这些指标，还能通过其强大的知识中心指引你完成整个过程。HubSpot\
  \ 已经将我们的公司转变为一个营销强手。\n\n营销自动化解决方案与客户关系管理（CRM）解决方案具有很多共性，并且它们经常被集成在一起。当它们集成时，营销团队通过增加关于与潜在客户和客户的销售互动的数据，对买家旅程拥有了更广阔的视角。无论是单独实施还是与\
  \ CRM 集成，营销自动化平台都是营销分析的基础。想要建立并维持营销分析流程的营销人员，应优先考虑实施营销自动化解决方案。营销自动化正迅速演变为营销组织一直缺失的记录系统。\n\
  \n> **注：** 营销自动化是营销分析流程的基础，营销人员可以在其上建立并维持一个分析流程。\n\n这些解决方案的重要性和价值只会与日俱增。如今，它们的分析能力可以展示过去发生了什么，而这个解决方案领域正处于将预测性营销分析功能集成到其解决方案中的前沿。预测性分析（在第\
  \ 10 章中有更详细的介绍）将为营销人员提供非常精确的模型，这些模型能够根据潜在客户的行为预测未来的购买决策。那些拥有成熟、完整营销自动化实施的组织，将率先利用这一颠覆性能力。对于那些希望利用数据分析来变得更加以收入为导向、以结果为导向的人来说，营销自动化是一个必不可少的平台。\n\
  \n## 营销分析工具\n\n> 我们成为我们所专注的东西。我们塑造工具，然后工具塑造我们。⁵ ——约翰·M·库尔金\n\n安装并全面实施营销自动化，为营销分析奠定了坚实的基础。随着营销团队在分析流程方面日益熟练，他们开始利用该流程产生的洞察。当这种成熟度提升时，往往会激发扩展营销分析范围和领域的愿望，这就需要额外的工具和数据。对于任何涉足营销分析深水区的组织来说，选择具体的工具都是一项挑战。当然，为其分析组合选择的指标类型将驱动工具的选择，但潜在可用的工具数量极易达到数百种。曾经只有少数几个选择，而现在营销人员在分析工具类别中则拥有了“富足的烦恼”。\n\
  \n本章并不试图提供一个全面的营销分析工具目录，因为相关产品变化迅速，而且部分信息在出版时可能已经过时。相反，本章的剩余部分将描述两大类营销分析，并包含这些类别中存在的一些工具示例。这里的目标是让读者意识到，存在适用于各种目的和应用的工具，并鼓励读者进一步研究这些工具以及市场上最新的产品。\n\
  \n由于可用于营销分析的工具如此之多，根据高层次功能将其分为两大类别，然后在每个类别中考虑一些示例工具，会更容易：\n\n- **战略类：** 用于商业智能、客户智能、理解购买行为、高级归因和预测性分析的工具与系统。\n\
  - **运营与物流类：** 用于管理、测试和优化网站形象、移动端、多渠道活动绩效、需求和地理建模的工具与系统。\n\n这两个类别的名称存在一些重叠，因为所有分析都具有战略性，因此默认情况下，支持它们的工具也是如此。然而，即使在战略分析的范畴内，有些工具也比其他工具更具运营导向性。大多数营销分析工具都明确地归入这两个类别，本章的其余部分将对此进行探讨。\n\
  \n\n\n### 战略营销分析\n\n战略营销分析是指那些能为营销职能提供方向指引的分析。在“战略”分析这一框架下所进行的工作，旨在确保营销团队在做正确的事情，即那些能产生最大影响力的事情。这类分析引导营销部门以最优方式投资其有限的资源。为了提供指导团队所需的洞察，战略营销分析运用了客户与商业情报收集工具。这类分析具有前瞻性。许多运营和物流分析是回顾性的——它们衡量历史营销活动和项目的成果——而战略营销分析则通过提供预测性结果，帮助团队向前展望。\n\
  \n如今，大多数组织收集的关于自身业务和客户的数据量，相比过去呈指数级增长。作为这一数据爆炸的例证，不妨想想有多少汽车保险提供商现在都提供应用程序和设备来帮助进行保单报价。这些设备会插入车辆，并记录关于该车辆驾驶方式的一连串数据。过去数据库中只有一个客户记录，而现在则有关于客户驾驶模式的更多数据。这个例子只是众多案例中的一个，说明企业可以获取关于其客户的大量数据。挑战在于如何充分利用这些数据，这通常需要从不同的系统中检索数据，并进行一些分析来揭示能影响战略的洞察。这正是商业智能（BI）系统发挥作用的地方。\n\
  \n`BI` 指的是帮助组织分析几乎任何来源原始数据的软件工具。`BI` 工具的目的是将这些数据转化为可操作的信息。它们简化了从多个来源查询数据、对其进行各种分析，然后报告结果（通常以仪表盘或其他数据可视化的形式呈现）的过程。`BI`\
  \ 工具将强大的功能交到用户手中，而无需他们掌握编程技能。使用这些工具时的一个常见挑战是源数据的质量。使用 `BI` 工具可以进行一些卓越且复杂的分析，但如果被分析的数据本身存疑，那么结果就是不可靠的。\n\
  \n信息技术研究与咨询公司 `Gartner` 发布了《`BI`与分析平台魔力象限》⁶，这是一份对市场及其供应商的发展方向和成熟度的可视化总结分析报告。最新版本的《魔力象限》将多家供应商归类为“领导者”，包括\
  \ `IBM`、`Information Builders`、`Microsoft`、`MicroStrategy`、`Oracle`、`QlikTech`、`SAP`、`SAS`、`Tableau`\
  \ 和 `Tibco Software`。\n\n客户智能（CI）在概念上与 `BI` 类似，但侧重点不同。`BI` 传统上侧重于财务报告，而 `CI` 的焦点则是理解客户行为。营销组织可以利用\
  \ `CI` 工具分析其积累的客户数据（通常存储在 `CRM` 系统中），利用这些数据中蕴含的智能来改善客户体验，并最终从客户那里获得更多收入。`CI` 帮助营销人员更好地理解客户体验，并解答诸如如何提高钱包份额、哪些细分市场最重要、或者如何提高客户留存率等问题。通过使用\
  \ `CI` 工具获得的洞察，让营销人员能更深入地了解客户是谁、他们的行为方式以及原因。\n\n许多 `CI` 工具和解决方案提供商与 `BI` 的提供商是相同的。`Gleanster\
  \ Research` 公司会对用户进行调查并将结果发布在标杆报告中，它覆盖了 `CI` 解决方案领域。该公司已经整理了一份提供 `CI` 解决方案的供应商名单，包括\
  \ `Infer`、`Lattice Engines`、`Lithium` 和 `Marketforce`。⁷\n\n`CI` 工具正越来越多地为其用户提供预测分析能力。大多数营销组织的职责是生成潜在客户，因此它们会在多个渠道上投资于线索生成活动，使用指标来监控不同渠道的线索流量和有效性，并利用分析过程的数据来优化组合、对线索进行评分，然后将合格的线索传递给销售部门。这个过程是许多营销组织工作的重头戏，而其有效性直接影响着收入。这个过程涉及很多动态因素，因此需要持续的关注、精力和分析监控，以确保其性能维持在可接受的水平。\n\
  \n线索生成过程高度依赖于技术和数字营销方法，因此这个过程会产生大量分析数据。事实上，如果没有分析数据，管理线索生成过程将需要依靠猜测来确定哪些渠道表现最佳。尽管这个过程具有数字性质，但其中涉及的技术很少有能够以预测方式支持这一过程的。围绕线索生成过程的大多数分析只能提供过程性能的历史视图。换句话说，通过很大程度上是回顾性的指标，我们可以非常精确地了解已经发生了什么。现在，`CI`\
  \ 和预测分析解决方案正为用户提供准确预测销售漏斗中未来线索转化率的能力。\n\n在现实世界中，预测分析让营销人员能够创建模型，从而识别出最有可能购买的客户，进而加速创收。基于云的预测分析解决方案提供商\
  \ `AgilOne` 在其电子书《零售营销人员预测分析权威指南》中记录了预测分析的十个用例。⁸\n\n- **行为聚类**：帮助更好地理解客户在购买过程中的行为。\n\
  - **基于产品/类别的聚类**：根据客户购买的产品将其划分到不同群体。这一洞察使营销人员能更明智地选择向客户提供哪些优惠。\n- **基于品牌的聚类**：识别客户具有的品牌亲和力分组。例如，偏好品牌\
  \ A 的客户也偏好品牌 C，但不偏好品牌 B。\n- **预测生命周期价值**：预测客户未来的生命周期价值。有助于设定获取新客户的成本支出参数。\n- **参与倾向**：预测客户采取某些行动的可能性，例如点击推广邮件中的链接。\n\
  - **转化倾向**：预测客户对通过电子邮件、直邮或其他方式向他们提供的号召性用语优惠做出回应的可能性。\n- **购买倾向**：识别出准备购买的客户，使营销人员能够通过特别优惠触发这些购买，或对那些尚未准备购买的客户进行更积极的营销。\n\
  - **追加销售推荐**：通过预测客户可能感兴趣的优质产品或更大数量，帮助提高平均订单金额。\n- **交叉销售推荐**：在购买时推荐其他经常同时购买的产品。\n\
  - **下一次销售推荐**：在客户购买某个产品后，推荐他们可能接下来会购买的产品。\n\n预测分析是一种相对较新的现象，但它正在迅速获得认可。与大多数尖端技术的情况一样，它最初是作为专业解决方案在大企业中站稳脚跟的。随着其功能被添加到营销自动化和\
  \ `CI` 平台中，它不断演变，向下层市场拓展，并变得更易于使用。\n\n\n\n### 高级、数据驱动归因\n\n高级数据驱动归因（有时也称为跨渠道归因）是一种精确地将部分功劳分配给客户在购买旅程中所接触到的完整内容或媒体流中各个元素的方法。第\
  \ 10 章将详细介绍高级归因，但此处值得提及，因为它属于战略营销分析的范畴。\n\n使用高级归因的营销人员可以精确地知道哪些优惠、元素和媒体流组件真正促成了转化。这种能够洞察营销多渠道活动中的哪些组件真正应得功劳的深度，长期以来被认为是不可实现或不可知的，但通过高级归因，这已成为现实。\n\
  \n高级归因之所以重要，是因为它为营销人员提供了数据，以便对其媒体组合做出明智的决策。营销人员曾经依靠直觉和猜测来确定电子邮件、在线展示广告、社交媒体广告、付费搜索和直邮的正确组合。现在，通过高级归因，可以获取有关每个使用中的渠道及其协同表现方式的准确数据。高级归因解决方案领域在\
  \ 2014 年经历了显著的整合。⁹ Forrester Research 发布了一份跨渠道归因解决方案的评估报告，涵盖了以下供应商：`Abakus`、`AOL/Convertro`、`eBay\
  \ Enterprise`、`Google`、`Marketing Evolution`、`MarketShare`、`Rakuten DC Storm` 和\
  \ `Visual IQ`。¹⁰\n\n### 同期群分析\n\n同期群分析是对具有共同特征的一组客户在时间推移中的行为所进行的研究。这些行为是营销人员感兴趣的任何行为，研究这些行为能够识别出群体（同期群）特征与其行为之间的关系。同期群分析提供了客户群体之间那种通常难以实现的“苹果对苹果”比较。关于同期群分析的文献经常以大学毕业年份作为同期群的例子。每个毕业班都是一个同期群，通过追踪和比较不同同期群的特征，可以确定例如该同期群的毕业年份与其平均收入之间是否存在关系。\n\
  \n同期群分析之所以重要，是因为针对关键业务或营销指标，同期群分析揭示了这些指标在客户关系生命周期内如何变化。这些发现有助于提高客户留存率，并更精确地估算客户生命周期价值（`CLV`）。精确了解\
  \ `CLV` 非常重要，因为它指导着公司应投入多少资金来获取新客户的决策。这种方法已被应用和游戏开发商、在线企业、电子商务以及软件即服务企业所采纳，并且在这些领域中尤其适用。除了\
  \ `CLV` 分析之外，一些常见的同期群分析还包括日/周/月销售额、新销售与重复销售对比、平均订单价值以及购买间隔时间。\n\n用于构建同期群分析的工具包括许多之前提及的\
  \ `BI` 和 `CI` 解决方案，以及 `CoolaData`、`Flurry`、`Google Analytics`、`KISSmetrics`、`Kontagent`、`Mixpanel`、`RJMetrics`\
  \ 等。`Cohort.ly` 和 `USERcycle` 都提供一定程度的免费同期群分析服务。在选择工具时，请确保它提供应用程序接口（`API`）或以其他方式与你希望纳入分析的环境集成，并且能够轻松纳入对你的分析至关重要的历史数据。\n\
  \n### 运营与物流营销分析\n\n属于运营和物流领域的分析工具和解决方案与组织的数字存在密切相关。过去，这种数字存在仅仅是公司网站，而现在它涵盖了每一个数字触点：网站、微型网站、所有公司策划的社交媒体、搜索引擎优化（`SEO`）、搜索引擎营销（`SEM`）以及移动端。营销人员需要的工具不仅能够让他们了解每个独立数字渠道的个体表现，还能让他们对其整体表现有一个全面的视图。\n\
  \n讨论的起点是网站以及帮助管理和优化网站的 analytics 工具。一个日益频繁的现象是，购买者会在线上调查潜在供应商，甚至在供应商意识到潜在买家兴趣之前就深入到了购买考虑流程中。因此，对于大多数组织来说，网站仍然是数字营销工作的基石。如果一个公司的网站不能轻松快速地提供潜在买家所需的内容，它将会因此受损。需要有这样的工具，能让公司实时了解访问者如何与其网站互动，以便公司能够迅速调整，解决网站和内容方面的不足。\n\
  \n在营销分析领域占据主导地位的工具是 `Google Analytics`。许多营销人员首次接触分析就是通过使用这个工具。声称 `Google Analytics`\
  \ 主导了该领域并非夸大其词：它被一半的网站所使用，作为网络分析工具，其市场份额高达 82%。¹¹ 如果一个营销组织不得不将自己限制于仅使用一个分析工具，那么\
  \ `Google Analytics` 就是那个工具。如果拥有一个表现良好的网站对组织的成功至关重要，那么使用 `Google Analytics` 来管理该网站是极具意义的，仅凭一个原因：美国大约三分之二的搜索流量都通过\
  \ `Google`。¹² 如果目标是让访问者通过 `Google` 搜索轻松找到你的网站，为什么不用这家搜索巨头提供的分析工具呢？\n\n`Google Analytics`\
  \ 有许多吸引人的特点。对于任何想使用它的人来说都是免费的，易于实施和使用，拥有出色的报告功能，并且 `Google` 不断添加新功能使其更有价值并扩展其能力。对于任何认为其网络存在很重要的组织来说，这是一个必备工具，因为它能揭示关于访问者、流量和内容的信息，否则组织对这些信息将一无所知。以下是\
  \ `Google Analytics` 用户可以了解到的一些内容：\n\n\n\n*   `Visitors`：网站访问者数量、独立访客数、访问时长、首次访问与回访用户数等。此外还可获取访客的人口统计数据，例如其地理位置（国家与城市），以及访问网站时使用的浏览器和设备。\n\
  *   `Traffic`：谷歌分析会告知网站获得的流量，但更重要的是，它能揭示访问者是如何抵达网站的。随着网站访问路径日益多样化，营销人员了解其网络流量的来源至关重要，特别是其中有多少来自搜索引擎及其他引荐来源。在搜索引擎流量方面，谷歌分析还能告知为网站带来流量的关键字，这些信息对执行搜索引擎优化（SEO）至关重要。\n\
  *   `Content`：通过谷歌分析，营销人员可以了解访问者如何使用其网络内容。系统会记录网页的进入和退出点，以及访问者查看某个页面的次数和停留时长。这些信息有助于营销人员优化并改善其内容的\
  \ SEO 特性。谷歌分析甚至能提供页面加载时长统计，帮助识别并修正加载缓慢的页面。\n\n关于网站访问者、流量和内容的数据只是谷歌分析强大功能的冰山一角。这是一个强大的工具，并且随着每次后续发布而变得更强。2013\
  \ 年，谷歌推出了通用分析（Universal Analytics），增加了跨设备追踪用户的功能。借助谷歌通用分析，可以从任何能够发送 HTTP 数据请求的联网设备收集指标数据。这种互联性的意义在于，诸如游戏主机、各类应用，甚至联网的蓝光播放器等多种设备，都能与谷歌分析共享使用数据。\n\
  \n谷歌分析是数字分析领域的巨头，但也存在其他厂商，它们的解决方案同样值得考虑。TrustRadius 已针对数字分析软件发布了以 TrustMap 形式呈现的分析报告¹³，其中分析解决方案根据用户评价以及在小企业、中型企业和企业级市场中的采用率进行排名。正在考虑实施分析技术的营销人员在试图了解市场上的各种产品时，会发现这类分析极具价值。\n\
  \n在当今的现代营销时代，公司的数字存在已不再局限于其网站，还包括社交媒体和移动端。任何分析方法都需要覆盖整个数字领域，包括社交和移动渠道。对于某些组织而言，社交媒体的重要性已超越网站。谷歌分析确实提供了一些社交报告功能，同时还有一系列更为专业的解决方案，可洞察社交领域中的品牌对话。\n\
  \n社交媒体工具对于识别和参与社交领域中发生的关于品牌或公司的对话至关重要。这些解决方案有助于监控这些对话，从看似无穷无尽的社交媒体帖子中筛选出需要了解的内容，因为它们与品牌相关。仅仅知道这些对话的存在，就能参与其中。例如，某个抱怨品牌糟糕服务体验的用户，现在可能会看到该品牌作为服务补救努力的一部分而做出回应。\n\
  \n除了提供处理社交媒体投诉的机会外，这些工具还允许品牌衡量关于品牌、其产品或所代表理念的情感倾向。它们不仅能让用户简单统计点赞、关注或分享的数量，还能衡量品牌与其关注者的真实互动水平。许多工具都属于社交媒体监控（也称为社交媒体倾听）和分析类别，包括\
  \ HootSuite、Netbase、Radian6（来自 Salesforce）、SproutSocial、Sysomos 等。有些解决方案是免费的，因此预算不应成为营销人员管理和衡量其社交媒体存在的理由。\n\
  \n关于社交媒体的讨论同样适用于移动渠道。如果移动渠道是组织媒体组合的一部分，那么该组织需要确保其被纳入营销分析体系。移动是最快速增长的营销渠道之一，它能利用支持\
  \ GPS 的移动设备收集客户的地理和行为数据。这些数据可以使企业检测到客户的接近程度，并向其推送优惠券、促销提醒或其他优惠信息。\n\n\n## 结论\n\n\
  本章仅揭示了营销分析工具的冰山一角。可供选择的工具众多，拥有成熟营销分析流程的企业同时使用五种或五种以上工具的情况并不少见。在这种情况下，拥有一个能够呈现全面视图的仪表板（如第\
  \ 7 章所述）就变得更为重要，它能方便地访问和理解营销分析流程所产生的所有重要信息。如果使用了商业智能（BI）工具，它们就能支持仪表板的开发和发布。也有一些专门用于创建分析仪表板的供应商解决方案，例如\
  \ `Birst`、`Cyfe`、`Domo`、`iDashboards` 和 `QlikView`。免费方案也同样存在。出于第 7 章所述的诸多原因，仪表板是营销分析流程中重要的沟通和流程管理工具。\n\
  \n这番关于支持战略、运营和后勤营销分析的工具与解决方案的讨论，仅仅触及了现代营销人员可用的所有技术的一角。在选择工具时，琳琅满目的选项令人眼花缭乱。营销人员如何才能做出正确的选择？正如本书一贯建议的那样，从目标开始。明确目标可以缩小你搜索工具和技术的范围。接下来，上网搜索并研究候选供应商，重点关注那些已经创造出你想要复制的成功模式的供应商。在考虑各种选项时，优先考虑易用性。最后，对候选清单上的解决方案进行评估，以做出最终选择。大多数供应商都提供免费试用，这样你就可以看到分析工具在您的环境和数据下是如何工作的。\n\
