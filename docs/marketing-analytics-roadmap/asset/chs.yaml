  \ Brinker，《营销技术专家的崛起》\n\n![A978-1-4842-0259-3_2_Fig1_HTML.jpg](img/A978-1-4842-0259-3_2_Fig1_HTML.jpg)\n\
  \n图 2-1.\n\nChiefmartec.com 的营销技术全景图揭示了营销解决方案领域的多样性和复杂性。经许可使用\n\n然而，营销技术领域的复杂性本身也令人望而生畏，因为营销人员需要评估无数种能够帮助他们将业务成果归因于其活动的解决方案。不过，技术挑战是暂时的，如果没有一些支持系统和可靠的数据源，营销分析计划就无法启动。对营销分析计划造成最大阻碍的是各种态度，这些态度通常存在于组织内部，有时也存在于营销人员所服务的组织之中。\n\
  \n现代营销人员普遍理解让营销团队作为收入中心运作的重要性，即通过分析流程来量化并报告其收入贡献。当营销作为一项支出而非收入中心存在时，它就处于危险之中，因为当公司面临财务压力时，营销总是裁员或削减开支的首要候选。作为收入中心运作，不仅能帮助营销在公司困难时期生存下来，甚至能蓬勃发展。正因如此，即使首席营销官（CMO）尚未完全弄清楚如何将团队转变为收入中心，他们也会稳步推进这一转型，因为这对营销的长期生存至关重要。\n\
  \n从宏观角度来看，当今的营销被视为支出中心还是收入中心？Demand Metric 研究公司在 2014 年第一季度完成了一项研究¹ 提供了答案。该研究首先试图了解公司内部对营销的财务认知。图\
  \ 2-2 显示了来自 250 多位研究参与者的结果（其中大部分是营销人员），展示了他们所在的营销职能在组织内部是如何被看待的。\n\n![A978-1-4842-0259-3_2_Fig2_HTML.jpg](img/A978-1-4842-0259-3_2_Fig2_HTML.jpg)\n\
  \n图 2-2.\n\n组织内部对营销的主流看法是将其视为一项支出\n\n这个数据很好地反映了营销分析的现状，因为改变“营销是支出”这一看法的最佳工具就是分析流程。对该研究数据的进一步分析表明，在那些将营销视为支出的组织中，有一半根本不使用分析工具，或者使用程度很低。无论出于何种原因，它们正在剥夺自己引导努力方向并向组织其他部门展示责任归属的最佳手段。\n\
