  \ Finance Inc（SSBM Finance Inc）。SSBM Finance Inc 是一家特拉华州的公司。\n\n致丽莎：我三十年的妻子。一个男人在生活中再找不到更优秀、更真诚的伴侣了。\
  \  \n以及，致那些正在寻找更好方式来回答“你最近为我们做了什么？”这一问题的营销人员。\n\n## 引言\n\n我进入营销行业纯属偶然。30 多年前，我大学毕业，获得计算机科学学位。在攻读学位的四年里，我在大学的数据中心工作。我拥有软件开发的理论基础，简历上也包含了高度相关的经验。尽管毕业时就业市场相对不景气，我还是收到了三份不错的录用通知。令我自己惊讶的是，我选择了起薪最低的那一份，来自\
  \ IBM，因为我喜欢那里的文化和晋升机会。IBM 没有把我视为软件程序员，而是将我安排在了销售与营销分支机构。从那天起，我再也没有写过一行代码，并且我对此毫不后悔。\n\
  \n我立刻被吸引到了销售和营销的世界，并尽我所能从 IBM——业内最擅长营销其解决方案的公司之一——学习一切。通过一系列工作变动，每一次都让我更深入地进入营销行业，我从导师和经验（及错误）中了解到营销在现实世界中是如何运作的。我的分析编程背景从未离开过我。尽管我对营销充满热情，但也对如何将我的营销工作与业务成果联系起来知之甚少感到困扰。我见过营销部门获得了本非由其产生的业务成果的赞誉，也见过它创造了成果却未能获得认可，还因其贡献不足而受到（公平或不公平的）指责。几乎在每种情况下，对营销的判断都基于观点和推测，而非数据。这让我感到困扰。\n\
  \n不可避免的结论是，对营销成功的判定过于随意、过于主观。即使营销表现出色，如果没有数据证明，首席财务官仍可能削减营销预算。首席执行官会质疑营销的贡献。组织的其他部门很容易将营销视为一种奢侈品，而非必需品。在审视其他企业职能时，例如研发、人力资源或销售，我注意到它们各自都有一套特定的指标，清晰地表明了其工作完成情况。而营销部门并非如此。如果营销部门被送上法庭，因其表现接受审判，辩护方能为营销提供什么证据呢？似乎非常少。\n\
  \n营销所需要的是一套指标，能够将其成功的判定从主观臆测的领域带入客观事实的范畴。作为领导者，我知道我们需要的不仅仅是能够说出我们生产了 X 个资产或管理了 Y\
  \ 次贸易展会的参与，以及其他类似的、试图将我们的工作与高层管理者关心的事情联系起来的模糊尝试。这些关于问责制的尝试在每个人心中都留下了关于营销真实表现如何的疑问。解决方案是采用分析方法和一套指标，提供有关营销贡献的有意义数据，这样，即使有人可能不同意营销的方法，也对结果无可争辩。\n\
  \n\n\n## 本书目的与读者\n\n本书源于我过去在营销绩效管理及其评估方式上的挫折与经验。我专为那些尚未开启数据分析之旅，但深知其必要性并正在摸索起点的营销组织而撰写。我希望这本书能激励营销人员与营销组织行动起来，并为他们指明前进方向。正如书名所示，书中的建议提供了一张路线图，并针对旅途中应考虑的方法、指标和工具给出了推荐。本书不会提供从营销分析之旅开始到结束的详细、逐步骤的指引。原因很简单：每个组织的旅程都必然不同。决定这段旅程的速度、载体甚至绕行路线的因素，每家公司都各不相同。\n\
  \n本书不适合那些已经实现营销分析流程成熟的组织，除非他们希望来一次怀旧之旅，回顾自己走过的路。即便如此，本书所指引的方向依然拥有广泛的读者群体。就在本书即将出版之际，我与\
  \ VisionEdge Marketing 合作完成的一项研究显示，仅有五分之一的营销组织建立了有效的分析流程。对于其余 80%的读者来说，本书将为启动并完成营销分析之旅提供一些鼓励和建议。正如老子所言：“千里之行，始于足下。”我希望这本书能帮助众多营销人员迈出那第一步。\n\
  \n杰里·拉克利\n2015 年 5 月\n\n## 致谢\n\n我感激我的 Demand Metric 同事们，特别是约翰·福利特和杰西·霍普斯，感谢他们在本书写作过程中给予的鼓励和支持。同样感谢俄克拉荷马州立大学斯皮尔斯商学院营销系的约书亚·维纳博士和汤姆·布朗博士，他们一直鼓励、支持并指导着我。\n\
  \n还有一大批营销专业人士倡导营销分析事业及其背后的技术：仅举几例，如斯科特·布林克、劳拉·帕特森、克莱尔·普莱斯和斯蒂芬·索格。他们的热情与激情激励我将自己的想法和理念付诸书籍。\n\
