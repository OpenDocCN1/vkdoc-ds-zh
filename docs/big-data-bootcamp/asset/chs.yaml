- "# 大数据最终带来信息优势\n\n`Amazon Web Services` 等基础设施与 `Hadoop` 等开源技术的普及，意味着企业终于能够实现 IT\
  \ 界长期承诺的种种好处。\n\n几十年来，IT 领域的焦点始终是“技术”本身。首席信息官（`CIO`）的职责是购买并管理服务器、存储设备和网络。\n\n然而，如今为企业带来竞争优势的，却是信息以及基于信息进行存储、分析和预测的能力（图\
  \ 1-1）。\n\n在 IT 技术刚刚普及时，早期采用的企业能够更快行动、执行更优，从而超越那些未采用的企业。有人认为，微软在 20 世纪 90 年代的崛起，不仅得益于其交付了全球最广泛使用的操作系统，更在于公司内部率先拥抱电子邮件，将其作为标准沟通机制。\n\
  \n![9781484200414_Fig01-01.jpg](img/9781484200414_Fig01-01.jpg)\n\n图 1-1. 信息正在成为曾经技术所扮演的关键资产角色\n\
  \n当许多公司还在犹豫是否以及如何采用电子邮件时，微软内部已将其作为讨论新员工招聘、产品决策、营销策略等事宜的实际沟通工具。虽然电子群组通讯如今已司空见惯，但在当时，这赋予了微软相比那些尚未采用电子邮件的公司更快的速度和更强的协作优势。\n\
  \n那些拥抱数据，并在整个组织内推动数据民主化使用的公司，将获得类似的优势。谷歌和 Facebook 等公司已从这种数据民主化中获益。\n\n通过向组织内的分析师、经理和高管开放内部数据分析平台，谷歌、Facebook\
  \ 等公司使得组织内的每个人都能快速地向数据提出业务问题，并获得所需答案。正如 Facebook 前大数据负责人 Ashish Thusoo 所言，新技术已将讨论的话题从“存储什么数据”转变为“有了更多数据我们能做什么？”\n\
  \n例如，Facebook 将其大数据工作作为一个内部服务来运行。这意味着该服务并非为工程师设计，而是为最终用户——那些需要运行查询来弄清楚什么有效、什么无效的直线经理——设计的。\n\
  \n因此，经理们无需等待数天或数周才能知道哪些网站更改最有效，或哪种广告方法效果最佳。他们可以利用内部大数据服务实时获得业务问题的答案。并且，该服务从运营稳定性到社交功能（使数据分析结果易于与同事分享）等方方面面，都充分考虑了最终用户的需求。\n\
  \n过去的二十年是属于 IT 中“技术”的二十年。相比之下，接下来的二十年将是属于 IT 中“信息”的二十年。那些能够更快处理数据，并整合公共与内部数据源的公司，将获得独特的洞察力，从而超越竞争对手。\n\
  \n正如大数据初创公司 SpaceCurve 的创始人兼 CTO J. Andrew Rogers 所说：“分析数据的速度越快，其预测价值就越大。”企业正从批处理（即先存储数据，事后再对数据运行缓慢的分析处理）转向实时分析，以获取竞争优势。\n\
  \n对于高管们来说，好消息是，大数据带来的信息优势不再仅为谷歌和亚马逊这样的公司所独享。像 `Hadoop` 这样的开源技术正使得众多其他公司——无论是老牌的《财富》1000\
  \ 强企业还是新兴初创公司——都能够以合理的成本利用大数据获得竞争优势。大数据确实带来了长期承诺的信息优势。\n\n## 大数据正在颠覆什么\n\n大数据带来的巨大颠覆，不仅仅在于能够比过去捕获和分析更多的数据，更在于能够以低一个数量级的价格实现这一点。随着价格下降，消耗量反而上升。\n\
  \n这种具有讽刺意味的反转被称为*杰文斯悖论*，得名于这位对工业革命做出此观察的经济学家。随着技术进步使数据存储和分析更加高效，企业进行的分析不是变少了，而是大大增加了。简而言之，这就是大数据的颠覆性所在。\n\
  \n从亚马逊到谷歌，从 IBM 到微软，许多大型科技公司都在涉足大数据。与此同时，数十家初创公司如雨后春笋般涌现，提供开源和基于云的大数据解决方案。\n\n当大公司专注于横向的大数据解决方案——用于通用分析的平台——时，小公司则专注于为特定业务线和关键垂直领域提供应用程序。一些产品优化销售效率，而另一些产品则通过将多个不同渠道的营销表现与实际的產品使用数据进行关联，为未来的营销活动提供建议。还有大数据产品可以帮助企业更高效地招聘员工，并在招聘后留住他们。\n\
  \n还有一些产品通过分析海量的调查数据，提供对客户需求的洞察。大数据产品可以评估医疗记录，帮助医生和制药公司提供更好的医疗服务。创新的应用程序现在可以利用学生的出勤率和考试成绩统计数据，帮助学生更有效地学习，并提高完成学业的几率。\n\
  \n从历史上看，我们很容易说没有所需的数据，或者数据太难分析了。而现在，这些大数据应用的普及意味着公司无需在内部开发和部署所有的大数据技术。在很多情况下，他们可以利用基于云的服务来满足分析需求。大数据正在让数据本身，以及分析和获取可执行洞察的能力，变得比以往任何时候都更容易、更便捷。这确实是颠覆性的。\n\
  \n## 改变你工作方式的大数据应用\n\n大数据应用（Big Data Applications，BDAs）代表了大数据领域的下一波浪潮。行业分析机构 CB\
  \ Insights 研究了大数据领域的融资情况，报告称仅 2013 年上半年，大数据公司就筹集了约 12.8 亿美元。此后，投资者继续向现有基础设施企业注入资金。`Hadoop`\
  \ 软件的商业供应商 Cloudera 公司于 2014 年 3 月宣布了一轮 9 亿美元的巨额融资，使该公司的总融资额达到 12 亿美元。\n\n展望未来，焦点将从处理大量数据所需的基础设施，转移到如何利用这些数据上来。问题将不再是“在哪里以及如何存储大量数据”。相反，用户会问“如何利用所有这些数据来获得洞察和竞争优势”。\n\
  \n![Image](img/sq.jpg) **注意** 创建和提供处理大数据所需基础设施的时代已近尾声。展望未来，焦点将集中在一个关键问题上：“我们如何利用所有数据来创造新产品、销售更多产品，并全面超越我们的竞争对手？”\n\
  \n\n\nSplunk，一家运营智能公司，就是一个现成的例子。从历史上看，企业不得不以一种相对手动的流程，使用自己开发的脚本来分析*日志文件*——那些由构成其\
  \ IT 系统的网络设备和服务器生成的文件。\n\nIT 管理员不仅要维护企业基础设施的服务器、网络设备和软件，还必须以脚本形式构建自己的工具，以确定这些系统所产生问题的根源。而这些系统生成了海量的数据。每次用户登录或访问文件，每次软件生成警告或错误，这些都是管理员必须梳理的数据，以查明情况。\n\
  \n借助 BDA，企业不再需要自己构建工具。他们可以利用预先构建好的应用程序，专注于运营业务。例如，Splunk 的软件可以通过搜索 IT 日志文件并可视化问题的位置和频率，轻松找到基础设施问题。当然，该公司的软件主要是*安装型软件*，这意味着它必须安装在客户的站点上。\n\
  \n基于云的 BDA 有望使企业完全无需安装任何硬件或软件。在某些方面，它们可以被看作是软件即服务（SaaS）产品之后的合理下一步。SaaS，即通过互联网交付的软件产品，已经相对成熟。例如，Salesforce.com，它在十多年前首次引入了“无软件”的概念，如今已成为云端客户关系管理（CRM）的事实标准，这是一种帮助企业管理客户列表和关系的软件。\n\
  \nSaaS 将软件转变为一种可以随时随地被使用、且用户几乎无需维护的产品。就像 SaaS 改变了我们访问软件的方式一样，BDA 正在改变我们访问数据的方式。此外，BDA\
  \ 正在将软件的价值从软件本身转移到那些软件使我们能够操作的数据上。换句话说，BDA 有潜力将当今的技术公司转变为未来极具价值的信息企业。\n\nBDA 正在同时改变我们的工作和个人生活。例如，Opower\
  \ 正在改变能源的消耗方式。该公司与 75 家不同的公用事业公司合作，追踪全美约 5000 万家庭的能源消耗情况。公司利用来自智能电表（一种追踪家庭能源使用情况的设备）的数据，为消费者提供详细的能源消耗报告。即使是能源消耗上的微小变化，当它扩展到数千万个家庭时，也能产生巨大影响。\n\
  \n就像谷歌可以访问海量的关于消费者在互联网上行为的数据一样，Opower 也掌握着大量关于人们在能源使用方面行为的数据。这类数据最终将赋予 Opower 以及类似公司高度差异化的洞察力。虽然该公司从提供能源报告起步，但通过持续积累其信息资产，它将很好地定位为一家大数据企业。⁹\n\
  \n然而，BDA 并非只出现在商业领域。各公司正在开发许多其他能够对我们的日常生活产生积极影响的数据应用程序。举个例子，一些移动应用程序会追踪健康相关的指标，并提出改善人类行为的建议。这类产品有望减少肥胖、提高生活质量并降低医疗成本。它们也证明了，最具有创新性和变革性的大数据应用可能出现在新型移动设备、大数据和云计算的交汇之处。\n\
  \n**大数据助力迈向实时处理**\n\n如果说过去几年的大数据是关于以更低成本捕获、存储和分析数据，那么接下来的几年将是关于加速对这些数据的访问，并使我们能够实时地对其进行操作。如果你曾经点击过网站按钮却只看到等待屏幕，你就会知道等待交易完成或报告生成是多么令人沮丧。\n\
  \n相比之下，谷歌搜索结果的响应时间则截然不同。谷歌在 2010 年推出的`Google Instant`，可以在你输入时实时显示搜索结果。通过引入这一功能，谷歌对典型搜索的搜索结果页面展现量增加了五到七倍。当这个界面刚推出时，人们并不确定是否喜欢它¹⁰。而仅仅几年后的今天，没有人能想象没有它的生活。\n\
  \n数据分析师、经理和高管们希望在了解其业务时获得`Google Instant`那样的即时性。随着这些大数据用户追求越来越快的结果，仅仅采用大数据技术将不再足够。持续的竞争优势将不再来自大数据本身，而是来自比他人更快地从信息资产中获取洞察的能力。像`Google\
  \ Instant`这样的界面展示了即时访问的强大力量。\n\n根据 IBM 的说法，“我们每天产生 2.5×10¹⁸字节的数据——如此之多，以至于世界上 90%的数据都是在过去两年内创造的。”¹¹行业研究公司\
  \ Forrester 估计，企业数据总量每年增长 94%。¹²\n\n面对这种增长，每家公司都需要一个大数据路线图。至少，公司需要有一个捕获数据的策略——从内部计算机系统生成的机器日志文件到网站上的用户交互——即使他们直到后来才决定如何处理这些数据。正如\
  \ Rogers 所说：“数据的价值远超你最初的预期——不要丢弃它。”\n\n![Image](img/sq.jpg)  \n**提示** “数据的价值远超你最初的预期——不要丢弃它。”\
  \ ——J. Andrew Rogers，SpaceCurve 公司 CTO。\n\n公司需要为其数据的指数级增长做好规划。尽管照片、即时消息和电子邮件的数量非常庞大，但由联网“传感器”（如手机、GPS\
  \ 和其他设备）生成的数据量则要大得多。\n\n理想情况下，公司应具有一个愿景，使数据分析能够在整个组织内进行，并且尽可能接近实时地完成。通过研究谷歌、亚马逊、Facebook\
  \ 和其他科技领导者的大数据方法，你可以看到大数据能实现什么。在此基础上，你可以在自己的组织中制定有效的大数据策略。\n\n那些在大数据方面取得成功的公司还为其组合增加了一个关键要素：一位大数据领导者。如果你无法从中获取洞察，那么世界上所有的数据都毫无意义。你的大数据领导者——无论是首席数据官还是数据洞察副总裁——不仅可以帮助你的整个组织制定正确的战略，还可以指导你的组织获得其所需的可操作洞察。\n\
  \n像谷歌和亚马逊这样的公司多年来一直利用数据驱动决策，并在此过程中取得了巨大的成功。有了大数据，你现在也可以利用这些能力。你将在第 3 章中读到更多关于如何利用这些能力并制定你自己的大数据路线图的内容。但首先，让我们看看整个大数据领域中令人难以置信的市场驱动力和创新技术。¹³\n\
  \n______________________________\n\n¹`http://radar.oreilly.com/2012/01/what-is-big-data.html`\n\
