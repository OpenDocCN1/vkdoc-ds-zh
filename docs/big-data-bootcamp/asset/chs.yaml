- "# 戈特曼论亲密关系\n\n戈特曼研究了那些对婚姻保持满意度的人，以找出是什么让他们的关系保持幸福。他的结论是，那些注重相互了解、彼此欣赏和关爱的夫妻，比不这样做的夫妻更有可能感到幸福。他特别发现，夫妻之间积极互动的次数必须是消极互动的五倍。\n\
  \n失败的婚姻能挽救吗？根据戈特曼的分析研究，答案是肯定的。许多接受过所谓婚姻咨询的夫妻，两年后又会复发，重蹈覆辙。\n\n然而，根据他的研究，戈特曼总结出有两个有效成分可以对婚姻产生持久的积极影响。第一，在解决冲突时减少消极情绪。第二，通过专注于帮助婚姻中的伴侣“成为更好的朋友”来增加整体积极性。最重要的是，戈特曼的研究不仅仅是大量的数据点。与所有最优秀的大数据分析一样，戈特曼将他的研究转化为简单而强大的可操作见解。在这种情况下，这些见解可以引导我们建立更幸福、更令人满意的关系。\n\
  \n![图片](img/sq.jpg) **注** 最优秀的大数据分析，以及那些最容易转化为成功产品的分析，是将繁重的研究转化为简单、强大、可操作见解的分析。\n\
  \n## Facebook 如何塑造人际关系\n\n当戈特曼和他的同事基于多年的研究在现实世界中帮助夫妻时，也许没有哪家在线公司能比社交网络巨头 Facebook\
  \ 对人际关系产生更大的影响。\n\n这家如今在全球拥有超过十亿用户的公司，是分享照片、更新状态和记录你（无论是独自一人还是与他人一起）生活时间线的首选目的地。\n\
  \n像 Facebook 这样的社交网站，通过所谓的“社交图谱”来呈现这类关系。与一对一的关系不同，社交图谱由许多相互关联的关系组成。如果乔认识弗雷德，弗雷德认识莎拉，那么在社交图谱的语境中，乔就通过弗雷德与莎拉有了联系。但此类互联关系通过纳入兴趣、地点、公司、品牌、生日和状态更新等非人类元素而进一步延伸。在社交图谱的语境中，人们不仅与他人建立联系，还与活动、事件、公司和产品建立联系。\n\
  \n![图片](img/sq.jpg) **提示** 正如一些公司专注于构建用于结构化和非结构化数据的数据库一样，也有一些公司专门为基于图谱的数据构建数据库。例如，Neo4j\
  \ 就专注于构建专门用于表示连接的数据库。迄今为止，该公司已筹集了约 2400 万美元，其客户包括 eBay、惠普和沃尔玛等公司。\n\n六度分隔理论普及了这样一种观念：在社交联系方面，任意两个人之间最多相隔六步。商务社交网站\
  \ LinkedIn 利用这一概念，向商务人士展示他们如何通过中间人与其他人建立联系。当这些专业人士想要与那些他们不直接认识、但却是朋友的朋友或同事的同事的人交谈时，他们就利用这种连通性。\n\
  \n在 Facebook 上，人们之间的联系甚至比六度理论所暗示的还要紧密。该公司的工程经理桑吉夫·库马尔指出，Facebook 用户之间的连接度很高，平均分隔度仅为\
  \ 4.74。社交图谱中的关系因与地点、兴趣和其他元素的联系而变得更加密集。\n\n通过表示大量连接之间的关系，社交图谱可以回答许多有趣的大数据问题。这包括数据分析师提出的问题，也包括数亿用户主动或被动提出的问题，例如“我应该与谁联系？”、“我应该看哪些照片？”以及“哪些信息对我很重要？”\n\
  \n尽管这些用户中的大多数并不认为自己是在对作为大数据的社交图谱执行查询，但这正是他们正在做的事情，或者至少是社交网络服务正在代表他们做的事情。\n\n从技术角度来看，社交图谱在大数据领域也同样引人入胜。回答诸如上述之类的问题会消耗大量计算资源。每个查询都涉及处理整个图谱的一个非常大的子集（技术上称为工作集），并且是针对每个用户高度定制的。\n\
  \n![图片](img/sq.jpg) **提示** 社交图谱是我们人类关系的数字化表示。它们可能是洞悉人类关系最强大的信息来源之一。\n\n更重要的是，社交图谱代表了大量实际数据，不仅仅是图谱本身的互联关系，还包括与每个用户关联的照片、视频、状态更新、生日和其他信息。一个查询必须返回正确的关联集，还必须几乎瞬间返回这些关联所关联的数据。\n\
  \n社交图谱代表的数据量如此之大，以至于为了跟上步伐，Facebook 不得不开发定制服务器，建立自己的数据中心，并设计专门的软件来高效地查询图谱，以及存储和检索其关联数据。\n\
  \n那么，这一切对我们的关系意味着什么呢？\n\n在 Facebook 上表达自我的众多方式中，“关系状态是唯一一种直接涉及另一个人的方式。”我们通常在这个社交网站上宣布订婚、结婚、分手和离婚。\n\
  \n2010 年，大约 60%的 Facebook 用户在个人资料中设置了关系状态，截至同年 12 月，女性用户数量是男性的 1.28 倍。截至 2014 年\
  \ 1 月，该网站约 53.3%的用户为女性，45.6%为男性。2011 年，三分之一的离婚申请中提到了“Facebook”这个词，高于前一年的 20%。\n\n\
  在线宣布我们的关系状态可以强化研究人员所谓的“情感规则提醒”。这些规则是社会规范，告诉我们何时该有何感受、感受什么，以及我们的情感应该有多强烈。通过在线声明我们的关系状态，我们强化了这些规则。\n\
  \n像 Facebook 这样的社交网站也会影响一个人的健康和个性。有些人在网站上真实地展现自己，而另一些人则由于不安全感而展现出一个经过美化的自己。\n\n\
  根据社交网络统计网站 *The Social Skinny* 的卡拉·普林引用的统计数据，大约 24%的美国人和 28%的英国人承认在社交网络上就自己做过什么和/或见过谁撒过谎或夸大其词。与此同时，过于频繁地访问我们的个人主页会让你我们过度关注自我，从而引起压力和焦虑。\n\
  \n拥有比其他人更多的数字好友——Facebook 用户平均拥有 229 个社交网络好友——可能会因为我们获得额外的社会支持而给我们带来一点自信。大约 25%的人认为社交网络增强了他们的自信心。拥有比其他人更少的好友可能会让我们感到难为情，但较小的数字社交圈也可能带来更真实的互动。\n\
  \n\n\n### 在线社交的影响\n\n若有人对在线社交对我们生活产生的巨大影响心存疑虑，数据显示，40%的人花在线上社交的时间超过了面对面互动。互联网用户将\
  \ 22.5%的上网时间用于社交网络活动，其中超过一半的 Facebook 用户每天都会登录该网站。\n\n![图片](img/sq.jpg) **注意** 如果你担心自己的社交媒体应用市场不够大，请记住，近半数线上社交者花在网上的时间比与现实世界中的人互动的时间更多。\n\
  \n### 大数据如何增加——与减少——社交资本\n\n我们珍视自己的线上身份及其带来的人际关系，不仅因为它们是自我表达的方式，还因为我们将其与社交资本相联系。社交资本是指我们因在社会网络中的位置，以及该网络（包括线上和线下）中相关的联系和资源而获得的利益。\n\
  \n根据卡内基梅隆大学人机交互研究所与 Facebook 的研究人员所述¹⁸，这种资本有两种形式：纽带型与桥梁型。纽带型指从与家人和亲密朋友的关系中获得的社交资本；而桥梁型则指从熟人关系中获得的社交资本。\n\
  \n两者都有价值，但纽带型通常提供情感支持与陪伴。桥梁型则源于更松散、更多样化的人际关系，通常能带来新的沟通机会和就业信息等机遇，因为关系过于紧密的圈子往往信息重复。\n\
  \n研究人员将社交网络上的活动分为三类。第一类是通过聊天或留言板与特定朋友进行定向沟通。第二类是被动消费社交新闻，即阅读他人的动态更新。最后一类是广播，即发布不针对特定个人的更新。\n\
  \n研究人员得出结论，由于定向沟通内容的丰富性以及沟通双方关系的强度，它有可能同时提升纽带型和桥梁型社交资本。在一对一沟通中，提供和接收信息都能增强关系强度。此外，与广播式沟通相比，仅因一对一沟通所需的努力，就体现了关系的重要性。\n\
  \n对于桥梁型社交资本，只有一对一沟通能增加 Facebook 发信方的社交资本。其他形式的沟通仅能增加收信方的社交资本。正如研究人员指出的，非定向广播以及被动消费新闻和动态，可能会增加接收者和消费者的知识，但无助于关系的发展。\n\
  \n广播式沟通作为获取他人信息的来源很有用，我们可以利用这些信息，通过提及共同兴趣来增强现有关系或发展新友谊。对于泛泛之交而言，发布广播对我们帮助不大，但接收广播和消费新闻却可能有益。（讽刺的是，接收者能获得这种价值，自然是因为发送者进行了广播。）对于现有社交沟通技能较低的人来说，接收广播信息的益处更大。\n\
  \n研究人员还发现，只有少数重大人生变故对桥梁型社交资本有显著影响。例如，搬家对桥梁型社交资本有积极影响，这可能是由于增加了新的人际关系，使我们获取信息和资源的途径多样化。然而，失业则因失去了与前同事相关的社交情境而产生负面影响。\n\
  \n那么，个人关系的变化对我们更广泛社交网络的影响又如何呢？尽管我们非常担心结婚、离婚、死亡、家庭添丁、换工作、疾病等人生变故对更广泛社交网络的影响，但现实是，这类事件虽然对个人影响巨大，但对更广泛社交网络的影响却相对较小。\n\
  \n这与通过 Facebook 增减社交资本的方式相比如何？每当我们在网络中的一对一沟通量翻倍时，其对桥梁型社交资本的影响量相当于搬到一个新城市。这大约相当于失业影响的一半。换句话说，一条建立新联系的一对一数字信息，对桥梁型关系的影响可能与搬到一个新城市相当。\n\
  \n这意味着，如果我们选择利用在线一对一沟通，社交网络可以大大减少通常与扩展更广泛网络相关的摩擦。这可能就是为什么在求职方面，职业社交网站 LinkedIn 上的一对一消息（甚至是经由联系人发送的消息）如此有效的原因之一。\n\
  \n虽然沟通显然在关系发展中扮演着重要角色，但信息也同样重要。尽管其作用可能不如 Facebook 那样明显，但 Google 同样影响着我们的关系。\n\n\
  问问几乎所有经历过线上约会的人，他们都会告诉你他们曾用 Google 搜索过潜在伴侣。根据婚恋服务公司《It's Just Lunch》的数据，43%的单身人士在约会前会用\
  \ Google 搜索对方。在接受调查的 1167 名单身人士中，88%的人表示，如果约会对象搜索过自己，他们不会介意。¹⁹\n\n几乎在搜索引擎中输入任何人的名字，你都会看到一系列与该人相关的结果。其中包括提供背景信息的网站、提及或撰写某人的文章，以及\
  \ LinkedIn 上的工作档案。\n\nFacebook、Twitter 和其他形式的数字社交通信相对较新，这意味着对此类媒介影响的学术研究相对有限。然而，显而易见的是，一个人的线上身份是一种海量的大数据形式。\n\
  \n就人类而言，大数据是我们以照片、视频、状态更新、推文和帖子形式分享的关于自己及人际关系的信息，更不用说我们以网站点击和在线购买形式留下的数字踪迹了。\n\n\
  ### 大数据与浪漫：未来展望\n\n数字社交通信的增强功能，如虚拟礼物，可能看起来不像人们表达浪漫兴趣的方式，但这种表达形式正变得越来越普遍。虚拟物品，如看起来像真实世界商品但仅以数字形式存在的鲜花，在社交游戏和社交网络中都变得非常流行。人们已经表现出为这些数字物品付费的意愿。\n\
  \n可以想象，在未来，推荐引擎能够准确预测哪些礼物会最受欢迎，并向发送者提出建议。当然，社交网络可能首先要确保伴侣们不会忘记彼此的周年纪念日！\n\n无论我们是否想要这种洞察力，大数据都在收集并提供更多关于我们及我们人际关系的信息。像*Match.com*开发的尝试推荐更佳匹配的算法，可能忽略了关于关系如何随时间演变的重要数据，但我们可以预见，一个与\
  \ Facebook 及其他平台整合的服务提供高质量推荐和预测的时代终将到来。\n\n\n\n事实上，随着时间的推移，脸书对我们人际关系的洞察力可能超过其他任何网站。博客网站《*All\
  \ Facebook*》引用了《脸书效应：连接世界公司内幕》一书中的一段话：“通过分析好友关系和沟通模式，[脸书联合创始人兼首席执行官扎克伯格]能够以大约 33%的准确率提前一周预测用户将与谁建立恋爱关系。”扎克伯格显然能够利用关于谁刚恢复单身、谁正在查看哪些个人资料、以及谁和谁互为好友等数据来获得此类洞察。²⁰\n\
  \n在线约会和社交沟通正变得越来越被社会所接受，并在此过程中产生了海量数据。大众化的沟通形式无法替代一对一的交流。但那些使此类沟通变得更加便捷的社交网络，能够大幅减少建立新关系以及维护现有关系所需投入的精力。如今，像\
  \ Match.com 开发的这类算法或许只是开启沟通的一种方式。但在未来，大数据在改善我们个人及职业关系方面蕴藏着巨大机遇。\n\n随着越来越多的人使用像 iPhone\
  \ 和安卓设备这样的智能手机，我们看到针对约会以及更广泛的结识新朋友场景的移动应用层出不穷。Skout 等应用帮助用户无论身在何处——是当地酒吧、体育赛事现场，还是游览新城市时——都能发现新朋友。该应用提供了聊天、交换照片和赠送礼物等集成功能。移动应用将继续降低沟通障碍，帮助我们与关心的人保持联系，同时持续产生海量数据，这些数据有助于进一步优化互动并促成新的联系。\n\
  \n大数据或许还无法挽救一段濒临破裂的关系，但它能让我们洞察人际关系所处的背景环境，例如根据特定时期分手事件的数量，判断一年中哪段时间对情侣关系来说最为艰难。通过学习这些数据，我们可以采取积极措施来改善我们的关系。\n\
  \n大数据还能帮助我们判断亲友是否正面临麻烦，比如通过分析他/她是否比平时沟通频率降低、压力水平升高，或是否经历了离婚、失业、亲属或密友去世等可能导致抑郁或其他问题的重大人生事件。与此同时，通过持续降低沟通门槛，大数据很可能将巩固现有关系，并支持新关系的建立。\n\
  \n我们渴望建立新纽带并巩固现有纽带——这种作为人类与生俱来的社交天性——是推动新技术产生以帮助我们更便捷沟通的最大动力之一。\n\n![Image](img/sq.jpg)\
  \ **提示** 婚恋配对应用的市场规模巨大。但利用大数据帮助现有关系蓬勃发展的市场，或许更为广阔。\n\n我们可能不会将脸书或谷歌这类网站视为大数据应用，因为它们被包装在易于使用、对消费者友好的界面之下。然而实际上，它们代表了大数据巨大的潜力。\n\
  \n在应用大数据来改善我们的人际关系并建立新友谊方面，像脸书这样的应用只是冰山一角。通过将数据与移动技术相结合，各种新型应用成为可能。何必只局限于根据一般兴趣进行匹配？为什么不更进一步，根据我们最近听的音乐、喜欢看的电影或爱吃的食物来推荐匹配对象呢？在构建新型人际关系应用时，如今的创业者有机会像\
  \ iPod 颠覆随身听一样，对现有的婚恋配对和社交网络服务产生颠覆性影响。\n\n在所有关于大数据规模与经济性、实时数据流以及存储和分析成本下降的讨论中，我们很容易忽视大数据对我们日常生活的积极影响——无论是讨论在线婚恋配对，还是采取措施改善关系。大数据不仅能为你开启寻找一生所爱的新途径，对于全世界的单身人士而言，好消息是：在未来，大数据一旦助你找到真爱，也很可能帮你牢牢把握住这份爱情。\n\
