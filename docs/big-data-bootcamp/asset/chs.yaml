  *   Tableau Software：`www.tableausoftware.com`\n\n## 大数据术语表\n\n以下术语表定义了大数据的领域中一些关键术语。随着大数据的不断发展，还会出现更多术语。\n\
  \n*Amazon Kinesis*——一种基于云的服务，用于实时处理流式大数据，例如金融数据和推文。\n\n*Apache Hadoop*——一种用于处理大量数据的开源框架，传统上属于批处理性质。¹\n\
  \n*Apache Hive*——用于查询存储在分布式存储（如 Hadoop）中的大型数据集的软件。`Hive`使用一种称为`HiveQL`的类似 SQL 的查询语言来支持数据查询。\n\
  \n*Batch*——一种数据分析方法，将数据以称为批次的大块进行处理。\n\n*Data analyst*——负责分析、处理和可视化数据的人员。\n\n*Google\
  \ BigQuery*——谷歌提供的一种基于云的服务，用于使用类似 SQL 的查询在谷歌基础设施上分析大量数据。\n\n*Google Cloud Dataflow*——一种基于云的服务，用于数据集成、准备、实时流处理和多步骤数据处理管道。谷歌将`Cloud\
  \ Dataflow`定位为`Hadoop`和`MapReduce`的继任者。\n\n*HDFS*——`Hadoop`分布式文件系统，一种用于在商用硬件上运行的系统上存储大量数据的分布式文件系统。\n\
  \n*Machine data*——由计算机、网络设备、汽车和其他设备等机器生成的系统日志等数据。\n\n*MapReduce*——一种编程模型，用于在计算机集群中的多个节点上并行处理大量数据。\n\
  \n*MongoDB*——一种开源文档数据库，也是领先的 NoSQL 数据库。²\n\n*NoSQL*——一种数据库系统，数据不以传统的关系形式存储，而是以键值、图或其他格式存储。\n\
  \n*Quantified Self*——一种通过追踪个人数据来更好地了解自我的运动。³\n\n*Real-time*——在数据可用时立即对其进行分析。实时分析与基于批处理的分析（在接收到数据后几分钟、几小时或几天后进行分析）形成对比。\n\
  \n\n\n*关系数据库*——一种以结构化形式存储数据的软件，能指明不同数据表和元素之间的关系。`Oracle`、`Microsoft SQL Server`、`MySQL`和`PostgreSQL`是知名的关系数据库。\n\
  \n*半结构化数据*——兼具结构化数据和非结构化数据特征的数据。\n\n`SQL`——结构化查询语言；一种用于在关系数据库中存储和检索数据的语言。\n\n*非结构化数据*——如原始文本、图片和视频等数据，它们不包含明确定义数据之间关联关系的结构。\n\
  \n*可视化*——以图形形式查看大量数据的一种方式。\n\n*体量、多样性和速度*——也称为“三 V”，是衡量大数据的三种常用指标。体量指数据量的多少；多样性指数据的种类；速度指数据流动的快慢。\n\
