  Public Data Explorer`允许人们在线探索公共数据集，例如人口增长和人均收入。


  ## 利用公共数据集


  可视化工具的商业用户通常从创建仪表盘的角度来思考可视化。仪表盘获取关于销售、营销和供应链的数据，并将这些数据转化为管理层可以轻松审阅的有意义的图表。


  但可视化的力量远不止于此。公共数据集指的是公众可获取且通常由政府或政府相关组织收集的数据。1790 年进行的第一次美国人口普查就是这类数据收集的一种形式。¹²
  人口普查的结果提供了大量关于美国人口的信息，包括人口的构成及其地理分布。


  在网上很容易找到公共数据集。一个有用的资源是`data.gov`，它链接到种类繁多的公共数据源。这些数据源包括国家气象局数据、劳动数据、美国人口普查数据、经济活动数据以及一系列其他数据源。NASA
  在其网站`http://data.nasa.gov/`上有许多有趣的数据源，包括具有历史意义的图像和来自火星探测器项目的图像。这些图像是很好的非结构化数据示例。它们在创建大数据规模的图像管理、分类和处理系统中极为有用。


  另一个有趣的公共数据集是位于`http://commoncrawl.org/`的`Common Crawl Corpus`。该语料库包含超过 50 亿个网页。这个数据集是开发处理大量非结构化文本的应用程序的宝贵资源。它对于开发检测文本模式、语言处理软件和搜索产品的机器学习算法也很有用。


  公共数据源对于学习如何处理和可视化大量数据很有用。它们在进行真实世界的数据分析时也很有用。正如数据讲述者`Hans Rosling`所展示的那样，公开的人口和健康数据对于理解人口变化、国家的兴衰以及抗击婴儿死亡率和其它流行病的进展（或缺乏进展）极其有价值。¹³
  `Rosling`使用数据可视化来用数据讲故事，特别是公共数据，就像足球评论员使用比赛回放一样。


  `Rosling`将数据动画化。他不是用数据制作卡通片。相反，他在图表上绘制数据，然后展示数据如何随时间变化——例如，不同国家的相对人口或收入在 40 或 50
  年期间如何演变。这种动画化让数据变得生动起来，而`Rosling`与他的儿子和儿媳一起开发的软件成为了`Google Public Data Explorer`的基础。


  一些有史以来最著名的可视化，都是基于以新颖且引人注目的方式呈现公开可用数据。`Visual.ly`在其网站上的一篇题为 *12 Great Visualizations
  That Made History* 的文章中展示了几个这样的图表。¹⁴ 其中一些可视化展示了正确的图形能产生多么巨大的影响。在一个例子中，`John Snow`在
  1854 年绘制的伦敦霍乱爆发地图帮助解释了受污染水井中的水是疾病传播的原因。


  大约同一时期，另一个著名的、拯救生命的图表来自现代护理学之母`Florence Nightingale`。`Nightingale`使用玫瑰图（`coxcomb
  diagram`）来“向广泛的受众戏剧性地传达复杂的统计信息”。¹⁵ 见图 Figure 5-7。


  ![9781484200414_Fig05-07.jpg](img/9781484200414_Fig05-07.jpg)


  Figure 5-7. `Nightingale`关于英国陆军死亡原因图表


  特别是，`Nightingale`的图表显示，对于英国陆军来说，许多死亡是可以预防的。死于非战斗原因的士兵比死于战斗相关原因的士兵更多。因此，她说服了政府重视利用卫生设施来降低死亡率的重要性。


  ## 实时可视化


  大多数信息图表提供的信息本质上是静态的，即使`Rosling`创建的引人入胜的动画，也由历史数据构成。




