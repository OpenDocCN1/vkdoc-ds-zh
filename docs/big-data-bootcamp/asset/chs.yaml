  如今涌现出越来越多具有动态特性的可视化。与过去静态、固定的可视化不同，当今的交互式可视化允许用户与之互动，从而可以改变查看的时间段、放大特定地理区域以获取更多细节，或改变可视化中包含的变量组合，以不同的方式查看数据。交互式可视化结合了传统可视化的最佳特性——以图形形式呈现数据的强大能力——以及易于使用的现代动态分析能力。


