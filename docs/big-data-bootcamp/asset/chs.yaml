- '# 加入大数据集团之前


  费因莱布先生曾是莫尔·达维多风险投资公司的普通合伙人。他共同创立了`Consera Software`（后被惠普收购）、`Likewise Software`（后被
  EMC Isilon 收购）以及`Speechpad`（基于网络的音视频转录领域领导者）。他的职业生涯始于微软。费因莱布先生拥有康奈尔大学学士学位，以*最优等成绩*毕业，并持有斯坦福大学商学院工商管理硕士学位。他是《*为什么初创公司会失败*》（Apress，2011
  年出版）的作者，同时也是一位热衷于小提琴演奏并两次完成铁人三项赛的选手。


