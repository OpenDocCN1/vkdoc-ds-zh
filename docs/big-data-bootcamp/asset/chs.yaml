  这种轻松捕捉和分享图像的能力向我们展示了这项活动是多么有趣和有回报。因此，当我们遇到有趣的信息图表时，我们自然也想分享它们。


  和照片一样，如今创建信息图表也比过去容易得多。公司也有更多动力去创建这类图形。2011 年 2 月，搜索引擎巨头谷歌对其算法进行了调整，以奖励高质量网站，特别是那些“拥有原创内容和信息，如研究、深度报告、深入分析等的网站”。¹¹
  因此，公司的营销人员意识到，他们需要做更多工作才能让网站在谷歌搜索结果中获得高排名。


  但是，对于一个信息有限的营销人员来说，要如何创建一份引人注目的研究呢？创建信息图表。信息图表可以整合广泛的数据源，将它们融合在一起，并讲述一个引人入胜的故事。这些故事可以是关于
  IE、Chrome、Firefox 和 Safari 之间激烈的浏览器大战，也可以是关于众筹法案带来的就业机会。寻找引人注目的图表以融入作品的博主和记者们喜欢这类图形，因为读者喜欢观看和分享它们。


  最有效的信息图表不仅仅是被发布到网上——它们会被分享，而且会被反复分享。其中一些会像病毒一样传播，在 Twitter、Facebook 和 LinkedIn 等社交网络上，以及通过传统邮件，被分享成千上万次，甚至数百万次。


