  ## 第 1 章：大数据：它是什么，以及你为何应该关心


  搜索互联网，你会找到数十个关于大数据的定义。有“三 V”——体量（Volume）、多样性（Variety）和速度（Velocity）。也有一些更技术性的定义，比如
  O''Reilly Media 的分析师埃德·邓比尔（Edd Dumbill）给出的这个定义：“大数据是指超出了传统数据库系统处理能力的数据。这些数据太大、变化太快，或者不符合数据库架构的约束条件。为了从这些数据中获取价值，你必须选择一种替代的方法来处理它。”¹




  '
- '# 大数据的真正价值


  这些定义虽然准确，却忽略了大数据的真正价值。大数据的衡量标准应该是其影响力的大小，而非其消耗的存储空间或处理能力。很多时候，关于大数据的讨论都陷入了几 TB（太字节）和
  PB（拍字节）的泥潭，以及如何存储和处理数据，而不是如何使用数据。


  作为消费者和商业用户，数据的规模和体量并不是我们关心的。相反，我们希望能够提出并回答那些对我们至关重要的问题。我们应该服用什么药物来治疗严重的健康问题？我们应该给学生提供哪些信息、学习工具和练习，以帮助他们更有效地学习？我们应该在营销活动上多花多少钱？我们新产品的哪些功能正在被客户使用？


  这才是大数据的真正意义所在。它指的是以比以往低得多的成本，获取和分析数据，并从数据中获得可操作洞察的能力。


  大数据真正的变革性在于我们现在使用数据的便捷性。我们不再需要那些需要数月或数年才能搭建和使用的复杂软件。几乎所有我们需要的分析能力，都可以通过简单的软件下载或在云端获得。


  我们不再需要昂贵的设备来收集数据。现在，我们可以从汽车中收集性能和驾驶数据，从 GPS 手表中收集健康和位置数据，甚至可以通过手机的低成本附件收集个人健康数据。正是这些能力的结合——大数据与云计算和移动技术的融合——才真正改变了游戏规则，让数据的使用和应用变得简单。


  ![Image](img/sq.jpg) **注意**  大数据具有变革性：你不需要复杂的软件或昂贵的数据收集技术来利用它。大数据与云端和移动世界的结合，正在改变所有规模企业的竞争格局。


  ## 大数据进入主流视野


  那么，为什么大数据会突然变得如此火爆？大数据之所以进入主流视野，是由于三大趋势的汇聚。


  首先，多家备受瞩目的消费品公司加大了对大数据的应用。社交网络巨头 Facebook 利用大数据追踪其网络内的用户行为。该公司通过分析您还认识谁，来为您推荐新朋友。


  您的朋友越多，您在 Facebook 上保持活跃的可能性就越大。更多的朋友意味着您会浏览更多内容、分享更多照片、发布更多状态更新。


  商务社交网站 LinkedIn 利用大数据将求职者与工作机会联系起来。有了 LinkedIn，猎头不再需要给潜在员工打冷电话。他们可以通过一次简单的搜索找到并联系他们。同样，求职者也可以通过联系网站上的其他人，获得向潜在招聘经理进行“暖介绍”的机会。


  LinkedIn 首席执行官杰夫·韦纳最近谈到了该网站的未来及其“经济图谱”——一个全球经济的数字地图，它将实时识别“指向经济机会的趋势”。² 实现这样一个图谱及其预测能力所面临的挑战，正是一个大数据问题。


  其次，这两家公司（Facebook 和 LinkedIn）都在过去几年内上市了——Facebook 在纳斯达克上市，LinkedIn 在纽交所上市。尽管这些公司和谷歌表面上是消费品公司，但它们的核心实际上是庞大的大数据公司。


  这些公司的上市——连同运营智能软件提供商 Splunk 和可视化公司 Tableau Software 的上市——极大地提高了华尔街对大数据业务的兴趣。


  因此，硅谷的风险投资家们正以前所未有的热情排队资助大数据公司。大数据正在定义下一波重大的创业浪潮，而硅谷希望在未来几年内将这些公司推向华尔街。


  Facebook 的早期投资者 Accel Partners 在 2011 年底宣布设立一只 1 亿美元的大数据基金，并于 2012 年初进行了首次投资。Zetta
  Venture Partners 是 2013 年推出的一个新基金，专门专注于大数据分析。Zetta 由马克·戈伦伯格创立，他曾是 Hummer Winblad
  的董事总经理。³ 知名投资者 Andreessen Horowitz、Greylock Partners 等也在该领域进行了多项投资。


  第三，作为亚马逊、Facebook、LinkedIn 以及其他以数据为核心的消费产品的活跃用户，商业人士开始期望在工作中也能获得与在家中同样快速便捷的大数据访问体验。如果互联网零售商亚马逊能够利用大数据推荐要读的书、要看的电影和要购买的商品，那么商业用户认为他们自己的公司也应该能够利用大数据。


  例如，为什么一家租车公司不能更智能地为租车者推荐合适的车辆呢？毕竟，公司拥有该人过去租车的记录和当前可用车辆的信息。但借助新技术，该公司还能获取关于特定市场动态的公开信息——有关可能影响市场需求和可用性的会议、活动及其他活动的信息。


  通过将内部供应链数据与外部市场数据相结合，公司应该能够更准确地预测哪些车辆应该在何时投入使用。


  同样，零售商应该能够结合内部和外部数据，逐日设定产品价格、陈列位置和品类组合。通过考虑从产品供应情况到消费者购物习惯（包括哪些产品倾向于一起畅销）等多种因素，零售商可以提升平均购物篮大小，从而获得更高利润。这反过来又能确保在正确的时间有正确的商品库存，从而保持客户满意度。


  因此，尽管大数据似乎在一夜之间变得炙手可热，但实际上，大数据是多年软件开发、市场增长以及消费者和商业用户被压抑的需求共同作用下的最终成果。


  ## 谷歌如何践行大数据计划


  如果说有一家科技公司抓住了这一需求并成为了大数据的典范，那便是搜索引擎巨头谷歌公司。据谷歌称，该公司每月处理的搜索查询量高达惊人的 1000 亿次。⁴


  但谷歌存储的不仅仅是搜索结果中出现的网站链接。它还存储了人们进行的所有搜索，这使得该公司对人们搜索行为的时间、内容和方式拥有无与伦比的洞察力。


  这些洞察意味着，谷歌可以优化其展示的广告，从而比全球几乎所有其他公司更好地将网络流量变现。这也意味着谷歌可以预测人们接下来会搜索什么。换句话说，在你搜索之前，谷歌就已经知道你在找什么了！


  多年来，谷歌不得不处理海量的非结构化数据，例如网页、图像等，而不是更传统的结构化数据，比如包含姓名和地址的表格。因此，谷歌的工程师从零开始开发了创新的大数据技术。这样的机会帮助谷歌吸引了一支才华横溢的工程师队伍，这些人正是被谷歌技术挑战的独特规模和体量所吸引。


  该公司的另一个优势是其基础设施。谷歌搜索引擎本身就是为在数十万台服务器上无缝运行而设计的。如果需要更多的处理能力或存储空间，或者某台服务器出现故障，谷歌的工程师只需添加更多服务器即可。据估计，谷歌的服务器总数已超过一百万台。




  '
- '# 谷歌的大数据技术


  谷歌的软件技术在设计之初就考虑了这种基础设施。其中有两项技术尤为突出，即`MapReduce`和`谷歌文件系统`，它们在 2012 年夏季被《连线》杂志报道为“重塑了谷歌构建搜索索引的方式”。⁵


  如今，许多公司都在拥抱`Hadoop`，它是`MapReduce`和`谷歌文件系统`的开源衍生品。`Hadoop`由雅虎公司基于谷歌一篇关于`MapReduce`的论文率先开发，它支持在多台计算机上对大型数据集进行分布式处理。


  当其他公司才刚刚开始使用`Hadoop`时，谷歌已经大规模应用大数据技术多年，这让它在行业中占据了巨大优势。与此同时，谷歌正将重心转向其他更新的技术。这些技术包括用于内容索引的`Caffeine`、用于映射关系的`Pregel`，以及用于查询海量数据的`Dremel`。`Dremel`是该公司`BigQuery`服务的基础。⁶


  现在，谷歌正将其在数据处理方面的一些投资开放给第三方。`Google BigQuery`是一项网络服务，允许对包含数十亿行数据的海量数据集进行交互式分析。`BigQuery`是一种按需的云端数据分析服务。2014
  年，谷歌推出了`Cloud Dataflow`，作为`Hadoop`和`MapReduce`的继任者，它能够处理大批量的批处理数据和流式数据。


  以前，公司必须购买昂贵的安装软件并建立自己的基础设施才能进行此类分析。借助`BigQuery`这样的服务，这些公司现在无需进行巨额前期投资就能分析大型数据集。


  谷歌还能获取海量的机器数据，这些数据来源于用户在其网站及其整个网络上进行的搜索。每当有人输入搜索查询，谷歌就知道此人在寻找什么。人们在互联网上的每一个动作都会留下痕迹，而谷歌恰好能够很好地捕捉并分析这些痕迹。


  然而，谷歌掌握的数据远不止搜索数据。公司安装`Google Analytics`等产品来追踪自己网站的访客，谷歌也能获取这些数据。网站使用`Google AdSense`在自己的网站上展示来自谷歌广告商网络的广告，因此谷歌不仅了解广告在自己网站上的表现，还能洞悉广告在其他发布者网站上的情况。谷歌还拥有来自`Google
  Maps`和`Google Earth`的大量地图数据。


  将所有数据整合在一起，其结果是，一项业务不仅能从最顶尖的技术中受益，还能从最优质的信息中获益。在信息技术方面，许多公司都在 IT 的“技术”部分投入巨资，但很少有公司能像谷歌那样，在
  IT 的“信息”部分投入同样巨大且卓有成效。


  ![Image](img/sq.jpg) **注释** 在信息技术领域，最具前瞻性的公司在信息方面的投入与在技术方面的投入一样多。


  ## 大数据如何助力亚马逊成为全球最大零售商的雄心


  当然，谷歌并非唯一一家将大数据投入应用的大型科技公司。互联网零售商亚马逊已采取了一些激进的举措，并且可能对谷歌以数据驱动的主导地位构成最大的长期威胁。


  至少有一位分析师预测，到 2015 年亚马逊的收入将超过 1000 亿美元，这将使其有望超越沃尔玛，成为全球最大的零售商。与谷歌类似，亚马逊手中也掌握着海量数据，尽管其数据更偏向电子商务性质。


  每当客户在其网站上搜索要观看的电视节目或要购买的商品时，亚马逊对该客户的了解就会增加一分。基于搜索和产品购买行为，亚马逊可以判断出接下来应该推荐哪些产品。


  该公司甚至比这还要智能。它不断在其网站上测试新的设计方案，以找出哪种方案能带来最高的转化率。


  你以为亚马逊网站页面上某段文字只是恰好放在那里？再想想吧。布局、字体大小、颜色、按钮以及公司网站设计的其他元素都经过了精心的反复测试，以确保达到最佳效果。


  数据驱动的方法还不止于此。据多位前员工透露，公司文化是冷酷无情地以数据为导向。数据会显示什么行得通，什么行不通，而任何新的业务投资理由都必须有数据支撑。


  这种对数据的持续关注使得亚马逊能够提供更低的价格和更好的服务。消费者往往直接登录亚马逊网站搜索要购买的商品或直接下单，完全跳过了谷歌等搜索引擎。


  对消费者的争夺战甚至蔓延到了更广阔的领域。苹果、亚马逊、谷歌和微软——合称“四巨头”——不仅在线上展开激烈竞争，在移动领域亦是如此。


  随着消费者将越来越多的时间花在手机和平板电脑上，而不是电脑前，拥有消费者手中移动设备的公司将具备最强的向该消费者销售产品的能力，并能最深入地洞察其行为。一个公司掌握的关于消费者群体和个体的信息越多，就越能有效地向这些消费者定向投放内容、广告和产品。


  令人难以置信的是，亚马逊的影响力从支撑新兴科技公司的基础设施，一直延伸到了人们消费内容的移动设备上。多年前，亚马逊就预见到了将其电子商务平台支柱——服务器和存储基础设施——向他人开放的价值。


  `Amazon Web Services`（AWS），作为该公司的公有云服务，为新兴公司和成熟公司提供可扩展的计算和存储资源。虽然 AWS 仍处于增长的相对早期阶段，但一位分析师估计，该服务的年收入运行率已超过
  38 亿美元。⁷


  这种易于获取的计算能力的普及，为新的数据计划铺平了道路。当然，公司仍然可以并且会继续以私有云的形式投资建设自己的私有基础设施。当涉及到特定的安全、监管或可用性问题时，私有云——即公司在内部管理和托管的云——是合理的。


  但如果公司想要快速利用额外的或可扩展的计算资源，他们只需在亚马逊的公有云中启动一批服务器实例即可。更重要的是，亚马逊还在持续降低其计算和存储服务的价格。凭借其巨大的购买力和基础设施规模，它能够以远低于其他大多数大公司所能获得的价格来协商采购计算机和网络设备。亚马逊的`Web
  Services`服务不仅通过其面向消费者的网站和`Kindle Fire`等移动设备脱颖而出，还通过支撑数千个其他流行网站的基础设施占据了核心地位。


  其结果是，大数据分析不再需要前期对固定成本的 IT 进行投资。用户只需在需要时购买更多的计算能力进行分析或购买更多的存储空间来保存数据。数据捕获和分析可以在云端快速轻松地完成，用户无需就
  IT 基础设施做出昂贵的前期决策。相反，他们可以根据实际需要，仅在需要的时间和期限内购买满足其大数据需求的计算和存储资源。


  如今，企业可以捕获和分析前所未有的数据量——这些数据在过去是它们根本无力分析或存储而不得不丢弃的。



  ![Image](img/sq.jpg) **注意** 大数据最强大的特性之一在于其可扩展性。借助云计算资源（包括分析和存储），企业在数据存储、处理与价值挖掘方面，如今已不再有容量限制。


