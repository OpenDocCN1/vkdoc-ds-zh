  \n¹³ 本章部分素材来源于我以特约撰稿人身份发表在《*哈佛商业评论*》（中文版）2013 年 1 月刊上的文章。\n\n## 章节\n\n## 大数据全景图\n\
  \n### 基础设施与应用\n\n在探讨了大数据的几个方面之后，接下来我们将放眼更广阔的领域，了解那些在大数据生态系统中扮演重要角色的公司。从基础设施和应用的角度来思考大数据全景图，是最容易理解的方式。\n\
  \n随后的图表（见图 2-1）展示了“大数据全景图”。该图对大数据领域中的众多参与者进行了分类。由于新入行者层出不穷，该全景图的最新版本始终可在网页 `www.bigdatalandscape.com`\
  \ 上查阅。\n\n![9781484200414_Fig02-01.jpg](img/9781484200414_Fig02-01.jpg)\n\n图 2-1.\
  \ 大数据全景图\n\n基础设施主要负责存储，并在一定程度上处理公司所捕获的海量数据。人类和计算机系统则使用应用程序从数据中获取洞察。\n\n人们使用应用程序来可视化数据，以便做出更明智的决策；而计算机系统则使用应用程序来向合适的人群投放精准广告、检测信用卡欺诈，以及执行众多其他活动。虽然我们无法在此逐一介绍全景图中的每一家公司，但我们将描述其中的一部分，并说明该生态系统是如何形成的。\n\
  \n### 大数据市场增长\n\n大数据是一个巨大的市场。市场研究机构 IDC 预计，到 2016 年，大数据市场将增长至每年 238 亿美元，且该领域的年增长率将达到\
  \ 31.7%。这还不包括分析软件，仅该市场本身的价值就高达 510 亿美元。\n\n我们生成的数据量正以惊人的速度增长。其中一个最有趣的衡量指标是 Facebook\
  \ 的增长。2012 年 10 月，该公司宣布其用户数已达到 10 亿——几乎占全球人口的 15%。截至 2013 年底，Facebook 在全球拥有超过 12.3\
  \ 亿用户（见图 2-2），一年内新增了 1.7 亿用户。为了跟上其庞大的用户增长，该公司不得不开发各种新的基础设施和分析技术。²\n\n![9781484200414_Fig02-02.jpg](img/9781484200414_Fig02-02.jpg)\n\
  \n图 2-2. Facebook 用户增长率\n\nFacebook 每天处理约 3.5 亿次照片上传、45 亿次“赞”和 100 亿条消息。这意味着该公司用于分析的存储数据超过\
  \ 100 PB，并且每天新增超过 500 TB 的数据。³,⁴ 这相当于大约 2000 个完全装满数据的 Macintosh Air 硬盘所存储的数据量。\n\
  \nTwitter 提供了另一个衡量数据增长的有趣指标。截至 2013 年，该公司的注册用户数已超过 8.83 亿，每天处理超过 5 亿条推文，而仅在五年前，这一数字仅为每天\
  \ 2 万条（见图 2-3）。⁵\n\n![9781484200414_Fig02-03.jpg](img/9781484200414_Fig02-03.jpg)\n\
  \n图 2-3. 社交网站 Twitter 上的推文增长\n\n然而，需要客观看待的是，这些仅仅是人类产生的数据。机器生成的数据甚至更多。每次我们点击网站按钮、进行购买、打电话或进行几乎任何其他活动时，都会留下数字足迹。上传一张照片这个简单操作，就会生成大量其他数据：谁上传了照片、何时上传的、与谁分享了、关联了哪些标签，等等。\n\
  \n数据量无处不在增长：沃尔玛每小时处理超过一百万笔客户交易，每年发送大约 90 万亿封电子邮件。具有讽刺意味的是，所有这些邮件中超过一半（71.8%）被视为垃圾邮件。根据一项估计，商业数据量每\
  \ 1.2 年就会翻一番。⁶,⁷\n\n为了应对这种惊人的增长，涌现出许多新公司，同时也有许多现有公司正在围绕大数据重新定位自己和他们的产品。\n\n### 开源的作用\n\
  \n开源在大数据近年来的发展中发挥了重要作用。但在讨论这一点之前，有必要先对开源角色的更广泛背景进行说明。\n\n就在几年前，Linux 成为主流操作系统，并与商品化硬件（低成本、现成的服务器）相结合，蚕食了像\
  \ Sun Microsystems 这样曾经占据主导地位的厂商的市场。例如，Sun 以其名为 Solaris 的 Unix 版本而闻名，该版本运行在其定制的\
  \ SPARC 硬件上。\n\n通过使用 Linux，企业能够在低成本硬件上利用开源操作系统，以低得多的成本获得大部分相同的功能。开源数据库 MySQL、开源\
  \ Web 服务器 Apache 以及最初为构建网站而创建的开源脚本语言 PHP 的可用性，也推动了 Linux 的普及。\n\n随着企业开始在大型商业用途中使用和采用\
  \ Linux，他们需要企业级的支持与可靠性。工程师在实验室里使用开源的 Linux 没问题，但企业需要一个他们可以寻求培训、支持和定制的供应商。换句话说，大公司喜欢从其他大公司购买。\n\
  \n在众多供应商中，红帽（Red Hat）脱颖而出，成为为 Linux 提供商业支持和服务的市场领导者。该公司目前的市值略高于 100 亿美元。瑞典公司 MySQL\
  \ AB 赞助了开源 MySQL 数据库项目的开发。Sun Microsystems 于 2008 年初以 10 亿美元收购了 MySQL AB，随后 Oracle\
  \ 于 2009 年底收购了 Sun。\n\n包括 IBM 和 Oracle 在内的几家公司，将大规模关系型数据库商业化。关系型数据库允许将数据存储在定义良好的表中，并通过键进行访问。例如，一名员工可以通过员工编号来识别，然后该编号将与包含该员工信息的多个其他字段关联，例如其姓名、地址、入职日期和职位。\n\
  \n\n\n此类数据库运行良好，直到公司不得不处理海量的非结构化数据。谷歌需要处理海量的网页以及这些网页中链接之间的关系。脸书则需要应对社交图谱数据。社交图谱是其社交网络上人与人之间关系的数字表示，以及图谱中每个节点所关联的所有非结构化数据，例如照片、消息和个人资料。这些公司还希望利用廉价硬件成本较低的优势。\n\
  \n![Image](img/sq.jpg) **注意** 关系型数据库曾是许多大型企业 IT 环境的主力，它们运行良好，直到公司意识到自己生成了更多的非结构化数据，需要一种不同的解决方案。于是，NoSQL\
  \ 和图数据库等专为当今多样化数据环境设计的方案应运而生。\n\n因此，像谷歌、雅虎、脸书等公司开发了自己的解决方案来存储和处理海量数据。在操作系统和数据库市场中，Linux\
  \ 作为 Unix 的开源版本出现，而 MySQL 则作为 Oracle 等数据库的开源替代品。如今，类似的情况正在大数据领域发生。\n\n`Apache Hadoop`\
  \ 是一个开源的分布式计算平台，它通过 `Hadoop 分布式文件系统（HDFS）` 存储大量数据，并通过名为 `MapReduce` 的编程模型将针对这些数据的操作拆分为小片段。它源自谷歌和雅虎最初构建的技术。\n\
  \n围绕 Hadoop 涌现了其他开源技术。`Apache Hive` 提供了数据仓库功能，包括数据提取/转换/加载（`ETL`）——这是一个从各种来源提取数据、将其转换为满足运营需求（包括确保数据质量）并加载到目标数据库的过程。`Apache\
  \ HBase` 在 Hadoop 之上为非常大的结构化表提供实时读写访问。它模仿了谷歌的 `BigTable`。同时，`Apache Cassandra` 通过复制数据提供容错的数据存储。\n\
  \n从历史上看，这些功能只能从商业软件供应商那里获得，并且通常运行在专用硬件上。Linux 使 Unix 的功能在通用硬件上得以实现，大幅降低了计算成本。同样地，开源大数据技术正在使数据存储和处理能力变得人人可用，这些能力以前只有谷歌这样的公司或商业供应商才能提供，如今则可在通用硬件上获得。\n\
  \n低成本大数据技术的广泛普及降低了处理大数据的初始成本，并有潜力使大数据为更多潜在用户所用。闭源供应商指出，虽然开源软件可以免费使用，但其维护成本可能很高，尤其是在大规模部署时。\n\
  \n尽管如此，开源可以免费上手这一事实使其成为许多人的有吸引力的选择。一些商业供应商采用了“免费增值”商业模式来竞争。产品可以在个人使用或有限数据量下免费使用，但客户需要为部门级或更大规模的数据使用付费。\n\
  \n那些长期采用开源技术的企业最终需要商业支持，这与他们对待 Linux 的方式类似。像 `Cloudera`、`Hortonworks` 和 `MapR` 这样的公司正在满足\
  \ Hadoop 的这一需求，而像 `DataStax` 这样的公司则为 `Cassandra` 提供同样的服务。同样地，`LucidWorks` 正在为 `Apache\
  \ Lucerne` 扮演这样的角色，后者是用于索引和搜索海量网页和文档的开源文本搜索引擎。\n\n![Image](img/sq.jpg) **注意** 尽管像\
  \ `Cloudera` 和 `Hortonworks` 这样的公司提供基于开源软件（如 Hadoop、Hive、Pig 等）构建的产品，但企业始终需要经过商业打包、测试的版本，以及相应的支持和培训。因此，英特尔最近向\
  \ `Cloudera` 注资 9 亿美元。\n\n## 进入云端\n\n另外两个市场趋势正在并行发生。首先，数据量正在增加——几乎每年翻一番。我们以照片、推文、点赞和电子邮件的形式生成更多数据。我们的数据本身也有相关联的数据。此外，机器正在以服务器、汽车、飞机、手机和其他设备的状态更新及其他信息的形式生成数据。\n\
  \n因此，处理所有这些数据的复杂性也在增加。更多的数据意味着需要整合、理解并尝试从中获取洞察的数据更多。这也意味着数据安全和数据隐私的风险更高。虽然企业历来将内部数据（如销售数据）和外部数据（如品牌情绪或市场研究数据）分开看待，但他们现在希望整合这些类型的数据，以利用由此产生的洞察。\n\
  \n其次，企业正在将计算和处理迁移到云端。这意味着他们不再购买硬件和软件并将其安装在自己的数据中心并维护那套基础设施，而是通过互联网按需获取所需的能力。如前所述，软件即服务（`SaaS`）公司\
  \ `Salesforce.com` 以其“无软件”模式开创了通过 Web 提供应用程序的先河，用于客户关系管理（`CRM`）。该公司继续构建一个产品生态系统以补充其核心\
  \ CRM 解决方案。`SaaS` 模式已经获得了动力，许多其他公司也提供了面向商业用户的基于云的服务。\n\n与此同时，`Amazon` 通过 `Amazon\
  \ Web Services（AWS）` 为实现按需基础设施铺平了道路，AWS 是该公司极受欢迎的基于云的计算和存储服务。Amazon 于 2002 年推出 `AWS`，其初衷是利用运行\
  \ `Amazon.com` 商店所需的基础设施来盈利。该公司继续增加按需基础设施服务，使开发人员能够快速启动新的服务器、存储和数据库。\n\nAmazon 还推出了针对大数据的特定服务，包括\
  \ `Amazon Elastic MapReduce（EMR）`——一个基于 Amazon 云的开源 `Hadoop MapReduce` 版本。`Amazon\
  \ Redshift` 是一个按需数据仓库解决方案，Amazon 预计其成本低至每年每 TB 1,000 美元，不到企业通常为本地数据仓库支付费用的十分之一，后者每年每\
  \ TB 的费用可能超过 20,000 美元。同时，`Amazon Glacier` 提供低成本数字归档服务，费用为每月每 GB 0.01 美元，或每年每 TB\
  \ 约 120 美元。\n\nAmazon 相对于其他供应商有两个主要优势。它拥有一个非常知名的消费品牌。该公司还受益于支撑 `Amazon.com` 网站以及在其基础设施上服务众多客户所带来的规模经济。其他技术市场领导者也提供云基础设施服务，包括谷歌的\
  \ `Google Cloud Platform` 和微软的 `Windows Azure`，但 Amazon 已经铺平了道路，并通过 `AWS` 占据了领先地位。\n\
  \n\n\nAWS 已实现惊人的增长。2013 年，该服务预计将为公司带来 32 亿美元的收入。截至 2012 年 6 月，Amazon 在其简单存储服务（`S3`）中存储了超过一万亿个对象，并且每秒新增超过\
  \ 40,000 个对象。这一数字远高于 2006 年底的 29 亿个对象和 2010 年底的 2620 亿个对象。Netflix、Dropbox 等主要公司均在\
  \ AWS 上运营其业务¹²,¹³。\n\nAmazon 持续拓展其基础设施即服务（Infrastructure-on-Demand）产品，新增了 IP 路由、电子邮件发送以及一系列大数据相关服务。除了提供自己的按需基础设施外，Amazon\
  \ 还与一个合作伙伴生态系统合作，提供他们的基础设施产品。因此，任何考虑构建公共云产品的新基础设施初创公司都可能面临以下局面：要么找到与 Amazon 合作的方式，要么就得预期该公司将推出具有竞争力的产品。\n\
  \n借助云服务，客户只需按使用量付费。这使得启动新的 Big Data 项目变得更加容易。公司不再受制于通常与购买、部署和管理服务器及存储基础设施相关的高昂前期成本。\n\
  \n我们能够比过去更快速、更经济地存储和分析与大数据计划相关的大量数据。借助基于云的大数据基础设施，从规划到获得洞见可能只需数天，而非数月或数年。这反过来意味着，在初创公司和大型企业中，大数据领域的创新会更多，并且数据驱动的洞见获取也变得更加容易。\n\
  \n![Image](img/sq.jpg) **Note** 经济实惠的基于云的大数据基础设施意味着公司可以在几天内从设计走向产品，或从假设到发现洞见，而不是数月或数年。\n\
  \n## 克服云的挑战\n\n当然，许多人仍然对利用公共云基础设施持怀疑态度。从历史上看，公共云服务存在三个主要的潜在问题。首先，大型企业的技术人员认为此类服务不安全，而内部基础设施更安全。其次，许多大型供应商根本不提供其软件的互联网/云端版本。公司必须自行购买硬件并运行软件，或聘请第三方来完成。最后，将大量数据从内部系统迁移到云端很困难。\n\
  \n尽管第一个挑战对某些受合规性要求的政府机构和企业来说仍然存在，但 `Salesforce` 用于管理客户数据，以及 `Box`、`Dropbox` 和 `Google\
  \ Drive` 用于存储文件等服务的广泛采用表明，许多公司现在已习惯让第三方供应商存储其机密信息。简而言之，企业使用的基于网络交付的应用程序比过去多得多。\n\
  \n首先是客户数据，然后是人力资源数据。如今，市场对基于网络的人力资源管理解决方案提供商 `Workday` 的估值接近 90 亿美元。随着时间的推移，企业将把越来越多的业务应用程序和数据迁移到云端。\n\
  \n第三个挑战，即将海量数据迁移到云端，仍然是个问题。许多专家认为，对于真正高容量的数据，数据会受到一种“引力”的影响。他们认为，始于公司本地的数据将留在本地，而始于云端的数据将留在云端。\n\
  \n但随着越来越多的业务应用程序通过网络提供服务，更多的数据将从云端开始并留在那里。此外，一些公司正在涌现，提供加速大量数据传输的技术。例如，`Aspera`\
  \ 专注于加速文件传输速度，特别是对于大型音频和视频文件。Netflix 和 Amazon 等公司使用 `Aspera` 以高达传统速度 10 倍的速度传输文件。\n\
  \n借助云，公司还能获得一系列其他优势：他们花在维护和部署硬件与软件上的时间减少，并且可以按需扩展。如果公司需要更多的计算资源或存储空间，这不再是几个月的问题，而是几分钟的问题。更重要的是，使用已安装软件的公司在使用最新版本软件方面历来落后。对于通过网络提供的应用程序，用户可以在最新版本可用时立即使用。\n\
  \n当然，也有一些权衡取舍。在成本方面，公司受制于他们选择合作的公共云提供商。但云供应商之间的竞争持续推动价格下降。一旦公司在特定云供应商之上构建并部署了应用程序，切换平台可能会很困难。尽管底层基础设施相似，但用于部署新应用程序构建的脚本、特定平台服务的钩子以及网络配置都基于所选平台。\n\
  \n![Image](img/sq.jpg) **Note** 大多数公司倾向于坚持使用他们最初选择的公共云平台。这也是云客户争夺战比以往任何时候都更加激烈的原因之一。\n\
  \n客户还依赖此类提供商提供可靠的服务。Amazon 曾遭受过几次重大的高调宕机事件，这导致一些人质疑依赖其服务是否明智。其中一次宕机事件导致电影流媒体提供商\
  \ Netflix 在 2012 年圣诞节前夕和圣诞节当天服务中断，而传统上这是观看电影的高峰期。然而，总体而言，基于云的基础设施服务在其服务可用性方面已变得更加透明，并增加了企业级的服务和支持选项，以满足企业客户的需求。在许多情况下，像\
  \ Amazon、Google 和 Microsoft 这样的提供商，凭借其运营的惊人规模，可以提供比许多企业自行交付的基础设施更可靠、更安全且更具成本效益的服务。\n\
  \n云提供商将继续推出更多的按需基础设施能力。随着他们相互竞争并降低价格，更多的企业将利用此类产品。初创公司将推出基于这些基础设施服务的新型创新大数据应用程序，企业和消费者都将从中受益。\n\
  \n## 大数据基础设施\n\n在了解了开源和大数据在云中的背景后，我们现在来看一些在基础设施和应用领域扮演关键角色的公司。\n\n在大背景下，投资者直到最近才将相对较少量的资本投入到大数据基础设施中。截至\
  \ 2013 年底，他们对 Hadoop 相关公司（`Cloudera`、`Hortonworks` 和 `MapR`）以及 NoSQL 公司（`MongoDB`、`Couchbase`\
  \ 等）的总投资额不到十亿美元。然而，在 2014 年初，英特尔和 Cloudera 因英特尔向 Cloudera 投资了高达 9 亿美元而成为头条新闻。\n\n\
  \n\n"
- '# 大数据基础设施公司


  Cloudera 是所有新兴大数据基础设施公司中最引人注目的。该公司销售帮助企业管理 `Hadoop` 的工具和咨询服务。其投资者包括 `Accel Partners`、`Ignition
  Partners`、`In-Q-Tel`、`Intel`、`Greylock Partners` 和 `Meritech Capital Partners`。Cloudera
  由明星团队创立，成员包括曾在 `Yahoo!` 参与 `Hadoop` 工作的 `Mike Olson` 和 `Amr Awadallah`、曾在 `Facebook`
  使用过它的 `Jeff Hammerbacher`，以及来自 `Google` 的 `Christophe Bisciglia`。¹⁴,¹⁵


  值得注意的是，`Google` 早在 2004 年就首次发表了一篇描述 `Google MapReduce` 和 `Google File System` 的论文，`Hadoop`
  正是源于此。这充分说明了像 `Google` 和 `Yahoo!` 这样的大型消费者企业所使用的技术，需要经过多长时间才能进入企业领域。¹⁶


  `Cloudera` 的竞争对手 `Hortonworks` 是从 `Yahoo!` 分拆出来的。其工程师为 `Apache Hadoop` 贡献了超过 80%
  的代码。`MapR` 则专注于通过其 `M5` 产品提供更高性能的 `Hadoop` 版本，旨在解决 `Hadoop` 最大的诟病：处理数据所需时间过长。


  在这些公司向企业交付和支持 `Hadoop` 的同时，其他公司也纷纷涌现，在云端交付 `Hadoop`。`Qubole`、`Nodeable` 和 `Platfora`
  是云 `Hadoop` 领域的三个玩家。这些公司面临的挑战将是如何从诸如 `Amazon` 自家的 `EMR` 产品等原生大数据云处理服务中脱颖而出。


  '
- '# Hadoop 能做什么？


  `Hadoop` 旨在跨非常大的数据集执行基于批处理的操作。在传统的 `Hadoop` 模型中，工程师设计作业，这些作业在数百或数千台服务器上并行处理。各个结果被汇总以产生最终结果。举一个非常简单的例子，一个
  `Hadoop MapReduce` 作业可能被用来统计不同文档中单词出现的次数。如果有数百万份文档，在单台机器上执行这样的计算将非常困难。`Hadoop` 将任务分解成每台机器都能执行的较小作业。每个单独计数作业的结果相加起来得到最终的计数。


  挑战在于，运行此类作业可能会消耗大量时间，这对于希望实时查询数据的分析师和其他业务用户来说并不理想。`Hadoop` 的新增功能，例如 `Cloudera Impala`
  项目，有望使 `Hadoop` 响应更快，不仅适用于批处理，也适用于近实时分析应用。当然，这样的创新使得 `Cloudera` 成为一个理想的收购目标（在上市之前或之后），无论是被作为其投资后续的
  `Intel`，还是被现有的分析或数据仓储巨头如 `EMC`、`HP`、`IBM` 或 `Oracle` 等公司收购。¹⁷


  ![Image](img/sq.jpg)**注意** 无需再花几天或几周时间等待分析运行和解读。大数据基础设施和应用正使实时分析成为有史以来的首次可能。


  '
- '# 大数据应用


  我们每天都在使用各种各样的**大数据应用程序**，通常甚至不认为它们是 BDA。`Facebook`、`Google`、`LinkedIn`、`Netflix`、`Pandora`
  和 `Twitter` 只是其中几个利用海量数据为我们提供洞察并带来娱乐的应用。


  尽管我们将会继续看到大数据基础设施方面的创新，但未来大数据的许多兴趣点将集中在利用生成的海量数据和处理这些数据所需低廉计算能力的 BDA 上。以下是一些例子：


  - `Facebook` 以用户资料、照片、信息和广告的形式存储并利用大数据。通过分析这些数据，该公司能够更好地了解其用户，并弄清楚向他们展示什么内容。

  - `Google` 抓取数十亿个网页，并拥有大量其他大数据源，例如 `Google Maps`，它包含了海量数据，包括物理街道位置、卫星图像、街景照片，甚至许多建筑物的内部视图。

  - `LinkedIn` 拥有数亿份在线简历，以及了解人们如何相互关联的知识。该公司利用所有这些数据来建议我们可能想要联系的人群子集。`LinkedIn` 还利用这些数据向我们展示关于朋友和同事的相关动态。

  - 互联网广播服务 `Pandora` 使用大约 450 首歌曲的属性来确定推荐哪些歌曲。该公司雇佣音乐学家，对几乎每首新歌的属性进行特征描述，并将其特征存储为
  `Music Genome Project` 的一部分。¹⁸ 该公司的数据库中有来自超过 90,000 位艺术家的 900,000 多首歌曲。

  - `Netflix` 以其电影预测算法而闻名，该算法使其能够向电影观众推荐接下来该看什么电影。该公司依赖一个由大约 40 名人工标注员组成的团队，对每部电影从故事情节到基调等
  100 多个属性进行标注。¹⁹

  - `Twitter` 每天处理超过 5 亿条推文。像 `Topsy`（最近被 `Apple` 收购），一家对推文进行实时分析的数据分析初创公司，正在利用这些数据源在
  `Twitter` 和其他平台之上构建应用。


  '
- '# 用于个人生活的大数据应用


  大数据应用也正在涌现以改善我们的个人生活。教育初创公司 `Knewton` 利用大数据创造动态学习体验，并了解哪些学生可能辍学，以便顾问可以帮助他们留在学校。医疗保健初创公司
  `Practice Fusion` 通过使医生更轻松地处理患者病历，改善了患者体验。`SurveyMonkey` 将数百万份调查的回复转化为市场人员和产品设计师可以用来更好地理解其客户的数据。


  这些应用在大数据应用领域只是冰山一角。企业历来都是构建和维护自己的基础设施来处理大数据，并且在许多情况下开发定制应用来分析这些数据。从利用运营智能工具更好地服务现有客户，到在线提供更相关的广告，这一切在多个领域都开始发生变化。越来越多的企业将继续利用预先构建的、基于云的应用来满足其需求。


  '
- '# 在线广告应用


  为了决定向你展示哪个广告，公司使用算法解决方案实时处理海量数据。这些算法方法结合了多种规则，这些规则告诉计算机如何处理关于市场当前状况的实时数据，以及关于你（或与你类似的用户）过去是否对相关内容表现出兴趣的数据。例如，一个算法广告竞价系统可能会判断出你最近访问过一个汽车网站，并且汽车广告的广告位可以以理想的价格获得。基于此信息，竞价算法将获取该广告位并向你展示一个相关的汽车广告。


  通过这种自动化分析，计算机程序可以判断出哪个广告与你最相关，以及特定广告展示应该支付（或收取）多少费用。这个领域的供应商包括 `Collective`、`DataXu`、`Metamarkets`、`Rocket
  Fuel`、`Turn` 以及其他一些公司。




  这些供应商真正在大数据规模下运营。`Turn`平台每天处理约 1000 亿个数据事件，并存储约 20 万亿个属性。²⁰ `Rocket Fuel`平台目前每天处理约
  432 亿次查询。²¹ 与此同时，`Admeld`（现为`Google`的一部分）与发布商合作，帮助他们优化广告库存。这些公司不仅仅提供基本的广告服务，而是使用先进算法分析来自一系列数据源的多种属性，以优化广告投放。


  营销人员将继续将更多资金转向在线广告，这表明该领域可能会迎来增长和整合。移动广告和移动分析呈现出最大的潜在增长市场之一，因为消费者和商业用户现在在移动设备上花费的时间越来越多。


  像`Flurry`（最近被`Yahoo!`收购）这样的公司提供分析能力，使移动应用开发者能够衡量消费者行为并更有效地将受众变现。与此同时，由于亚马逊、苹果、谷歌以及三星等硬件制造商在该领域施加的控制，移动领域也是最复杂的领域之一。


  ## 销售与营销应用


  `Salesforce.com`通过引入其托管的“无软件”客户关系管理（CRM）模式，改变了公司进行客户关系管理的方式，以此替代了`PeopleSoft`等需要安装、定制并在本地运行的产品。


  最近，像`Eloqua`（现为`Oracle`的一部分）、`Marketo`（现已上市）和`HubSpot`这样的营销自动化公司，使公司进行潜在客户管理、需求生成和电子邮件营销的方式系统化。


  但如今的营销人员面临着一系列新的挑战。他们必须管理和理解跨大量渠道的客户活动和互动。


  如今的营销人员需要确保公司优化其网页，以便它们能被`Google`和`Bing`索引，并易于潜在客户找到。他们需要在诸如`Facebook`、`Twitter`和`Google
  Plus`等社交媒体渠道上保持定期存在。这不仅是因为这些是人们娱乐和获取信息的场所，还因为`Google`越来越强调将社交媒体作为衡量特定内容重要性的方式。


  正如应用性能监控公司`New Relic`的首席营销官`Patrick Moran`所指出的，营销人员还需要考虑各种其他数据源，以全面了解其客户。这包括实际产品使用数据、潜在客户来源和故障单信息。这些数据可以让营销人员深入了解哪些客户最有价值，以便他们寻找具有类似属性的其他潜在客户。他们还可以确定哪些营销活动最有可能促使潜在客户转化为客户。


  所有这些都意味着营销人员需要可视化大量数据并据此采取行动。正如`Lattice Engines`（前身为`Eloqua`和`Forrester Research`）的首席营销官`Brian
  Kardon`所言，未来的营销在很大程度上将关乎算法。华尔街的交易曾经是人类的主场，直到计算机运行的算法交易取代了它。`Kardon`预见了营销领域的类似未来，一个由算法分析所有这些数据源以发现有用模式，并告诉营销人员下一步该做什么的未来。²²


  ![Image](img/sq.jpg) **注意** 基于云的销售和营销软件现在允许公司分析流入公司的任何数据，包括产品使用情况、在线行为、故障单信息等。营销人员需要保持警惕，在竞争对手之前实施利用此类数据所必需的技术。


  此类软件很可能会告诉营销人员该运行哪些活动、发送哪些电子邮件、撰写哪些博客帖子，以及何时发推文、发什么内容。然而，它不会止步于此。


  最终，大数据营销应用不仅会分析所有这些数据源，还会基于数据执行大量优化营销活动的工作。像`BloomReach`和`Content Analytics`这样的公司已经在这条道路上迈进，它们使用基于算法的软件帮助电子商务公司优化其网站，以实现最高的转化率和可见性。


  当然，营销中创造性的部分仍将至关重要，营销人员仍将就投资方向以及如何相对于竞争对手进行定位做出宏观决策。但是，大数据应用将在自动化目前与在线营销相关的大量手动工作中发挥巨大作用。


  ## 可视化应用


  随着数据获取变得更加民主化，可视化变得愈发重要。可视化领域有许多公司，因此在本节中我们仅重点介绍其中几家。`Tableau Software`以其交互式且易于使用的可视化软件而闻名。该公司的技术源自斯坦福大学的研究。该公司最近成功完成了首次公开募股。


  `QlikTech`提供其广受欢迎的`QlikView`可视化产品，全球约有 26,000 家公司在使用该产品。该公司于 2010 年上市，截至 2014 年
  2 月，其估值约为 23 亿美元。还有许多其他新进入者。`SiSense`在像笔记本电脑这样的小型计算机上执行大量数据处理，并以可视化形式输出结果。


  虽然严格来说不是一家可视化公司，但`Palantir`以其大数据软件而闻名，并在政府和金融服务领域拥有强大的客户基础。此外，大型企业供应商也提供相关产品，包括`IBM`、`Microsoft`、`Oracle`、`SAS`、`SAP`和`TIBCO`。


  越来越多的公司正在添加将交互式可视化嵌入网站的工具。出版商现在使用此类可视化工具为读者提供对数据的更深入洞察。


  像`Yammer`这样的企业协作和社交网络公司的出现，使得无论是内部还是外部的商业沟通都更具社交性。预计类似的社交能力将成为几乎所有数据分析和可视化产品的标准配置。


  鉴于可视化作为理解大型数据集和复杂关系的重要性，新的工具将继续涌现。此类工具的挑战和机遇在于，帮助人们以提供更深入洞察的方式查看数据，并帮助他们基于这些洞察采取有意义的行动。


  ## 商业智能应用


  数据分析的很大一部分历史在于商业智能（BI）。组织依赖商业智能来组织和分析大量公司数据，以帮助管理者做出更好的决策。例如，通过分析销售和供应链数据，管理者未来可能能够确定更好的定价方法。


  商业智能首次出现在 1958 年一位`IBM`研究人员的文章中，该公司通过算法交易和`IBM Watson`等技术进步不断开创新领域。包括`SAP`、`SAS`和`Oracle`在内的其他主要供应商都提供商业智能产品。`MicroStrategy`仍是该领域少数几家大规模独立参与者之一。其市值约为
  10 亿美元，并且最近向市场推出了引人注目的移动产品。²³




  '
- '# Domo


  `Domo`，一家基于云计算的商业智能软件公司，是市场相对较晚的进入者。`Domo`由`Josh James`创立，他是分析领域领导者`Omniture`（现为`Adobe`）的创始人兼前首席执行官。该领域的其他知名玩家包括`GoodData`和`Birst`。然而，由于让公司将关键任务数据迁移到云端面临的挑战以及传统上所需的定制化程度，托管式商业智能领域一直难以攻克。但正如其他领域一样，这种情况正在开始改变。用户希望能够在其台式机、平板电脑和手机上访问和处理相同的数据，这意味着更多数据需要迁移到云端，以便于轻松访问和共享。


  '
- '# 运营智能


  通过执行搜索和查看图表，公司可以了解服务器故障及其他基础设施问题的原因。企业不再构建自己的脚本和软件来理解基础设施故障，而是开始依赖像`Splunk`这样的新型运营智能公司。该公司提供其软件的本地部署版和云端版，IT
  工程师利用它来分析服务器、网络设备及其他设备产生的大量日志数据。


  `Sumo Logic`和`Loggly`是该领域较新的进入者，而大型供应商如`TIBCO`（收购了`LogLogic`）、`HP`（收购了`ArcSight`）以及现有玩家`Vitria`也各有产品。与此同时，`AppDynamics`和`New
  Relic`提供网络服务，使工程师能够理解应用程序层面的问题。


  '
- '# 数据即服务


  介于大数据基础设施和应用程序之间的是数据即服务类别。历史上，公司在获取大数据集方面一直面临挑战。获取最新数据或通过互联网获取数据通常很困难。然而，如今数据即服务提供商以多种形式出现。`Dun
  & Bradstreet`为金融、地址及其他形式的数据提供网络编程接口，而`FICO`则提供金融数据。大量流式数据，例如`Twitter`提供的推文流，是最有趣的新数据源之一。


  这些数据源使其他人能够基于它们构建引人注目的应用程序。新的应用程序可以以非常高的准确率预测总统选举结果，或帮助公司了解大量消费者对其品牌的看法。还有一些公司通过服务接口提供垂直特定数据。`BlueKai`提供与消费者画像相关的数据，`INRIX`提供交通数据，而`LexisNexis`提供法律数据。


  '
- '# 数据清洗


  在处理数据时，或许最不引人注目但至关重要的领域之一是数据清洗与集成。像`Informatica`这样的公司长期以来在该领域占据主导地位。内部和外部数据可能以多种格式存储，并可能包含错误和重复记录。此类数据通常需要在被使用前，或在多个数据源被一同使用前进行清洗。


  在最简单的层面上，数据清洗涉及删除重复记录和规范化地址字段等任务。由知名风险投资公司`Andreessen Horowitz`和`Greylock`投资的`Trifacta`等公司，正在将用于清洗数据和处理多样化数据源的新应用程序推向市场。作为一种云服务的数据清洗，也许通过机器算法和众包的结合，呈现出一个有趣且迄今尚未被充分开发的市场机会。


  '
- '# 数据隐私


  随着我们将更多数据迁移到云端，并在网络上发布更多关于我们自己的信息，数据隐私和安全问题日益受到关注。`Facebook`已加强了对用户共享信息方式的控制。`Google`增加了安全层和加密措施，以使其数据中心更加安全。近期在`Target`等零售商处发生的大规模消费者数据泄露事件，也提高了消费者和企业对数据安全和隐私的认识。


  与任何新技术一样，大数据提供了许多潜在的好处，但也带来了各种风险。它要求我们围绕存储的数据类型以及如何使用这些数据，制定深思熟虑的政策。例如，匿名数据可能并不像看起来那样匿名。在一项研究中，分析师能够查看匿名的电影观看数据，并通过查看在互联网电影数据库（`IMDB`）上发布评论的用户评价，确定哪些用户观看了哪些电影。


  未来，可能出现的大数据分析应用不仅让我们决定共享哪些数据，还帮助我们理解共享个人信息的隐藏含义，无论这些信息是否能识别个人身份。


  '
- "# 领域未来\n\n数据以及旨在利用数据的算法，正成为消费者导向和商业导向公司的一项基础性、具有显著竞争优势的资产。\n\n文件共享和协作解决方案`Box`和`Dropbox`很可能被视为大数据分析应用，考虑到它们存储的海量文件。越来越多垂直聚焦的大数据分析应用正在涌现。正如后续章节中提到的，像`Opower`这样的公司，从电表获取数据，帮助消费者和企业了解其电力消耗，并更有效地利用能源。\n\
  \n最近被`Google`以 32 亿美元收购的`Nest`，是一款学习型恒温器，它能理解消费者行为，并将算法应用于其收集的数据，从而更好地调节家庭冷暖。这些大数据分析公司中，有些将被收购，而另一些则将效仿`QlikTech`、`Tableau`和`Splunk`，在寻求建立领先、独立的大数据分析公司的过程中上市。显而易见的是，市场对大数据的胃口才刚刚开始。\n\
  \n![Image](img/sq.jpg) **注意** 市场对大数据的胃口才刚刚开始。\n\n随着越来越多的大数据分析应用进入市场，基础设施提供商的定位如何？在基于云的基础设施方面，`Amazon`很可能在几乎每个领域都提供极具竞争力的产品。对于那些它不涉及的领域，更大的开源基础设施供应商可能会介入，提供基于云的产品。如果历史具有预测性，大型企业玩家，从`Cisco`到`EMC`、`IBM`和`Oracle`，很可能会继续成为这些供应商极其活跃的收购方。`Intel`对`Cloudera`的\
  \ 9 亿美元投资表明，它对大数据极为重视。\n\n展望未来，预计会有更多的大数据分析应用涌现，以提升我们的工作和个人生活。其中一些应用程序将帮助我们更好地理解信息。但许多应用程序不会止步于此。大数据分析应用将提高我们触达正确客户的能力，以及在触达后有效服务客户的能力。但它们不会就此止步。处于大数据和移动交叉点的大数据分析应用，将改善我们就医时获得的护理质量。有朝一日，大数据分析应用甚至可能使自动驾驶汽车接管我们的日常通勤。无论应用场景如何，大数据领域在未来几年内必将成为深刻创新的源泉。\n\
