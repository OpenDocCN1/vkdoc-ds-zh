- "# 工作中的大数据：数据如何指导设计\n\n在数据与设计之间，存在着一场博弈。一些人认为最好的设计来自直觉本能，而另一些人则认为设计应当由数据驱动。数据在设计中的确扮演着角色，现代技术可以提供关于用户如何与产品交互的深刻洞察——用户使用哪些功能，又忽略哪些功能。本章探讨了包括\
  \ Facebook 和苹果在内的当今一些领先公司如何将数据应用于设计，以及你如何能够采用数据知情（data-informed）的设计方法来开发自己的产品。\n\
  \n## Facebook 如何以数据指导设计\n\n如果有一家公司的设计决策影响着超过十亿人，那非社交网络巨头 Facebook 莫属。通常，当 Facebook\
  \ 做出设计变更时，用户并不喜欢，甚至可以说是厌恶。\n\n2006 年，当 Facebook 首次推出\"新闻推送\"功能时，当时这个社交网站只有 800 万用户，数十万学生表示了抗议。然而，据\
  \ Facebook 产品总监亚当·莫塞里称，\"新闻推送\"后来成为了该网站最受欢迎的功能之一，也是流量和用户参与度的主要驱动因素。\n\n这也是 Facebook\
  \ 采取莫塞里所谓的\"数据知情\"而非\"数据驱动\"方法进行决策的原因之一。正如莫塞里所指出的，有许多相互竞争的因素可以影响产品设计决策。他强调了六个此类因素：定量数据、定性数据、战略利益、用户利益、网络利益和商业利益。\n\
  \n![Image](img/sq.jpg)  **提示**  与其在产品决策中采取严格的数据驱动方法，不如考虑采用更灵活的数据知情方法。这一区别对 Facebook\
  \ 很有帮助。\n\n*定量数据*是指显示用户实际如何使用 Facebook 产品的数据。例如，这可能包括上传照片的用户百分比，或者一次上传多张照片而非仅上传一张的用户百分比。\n\
  \n据莫塞里称，Facebook 20%的用户——那些每月登录超过 25 天的用户——生成了该网站 85%的内容。因此，让更多人在网站上生成内容，例如上传照片，显得极为重要。\n\
  \n*定性数据*是诸如眼动追踪研究结果之类的数据。眼动追踪研究可以观察你浏览网页时视线移动的轨迹。眼动追踪研究为产品设计师提供了关键信息，比如网页元素是否易于发现，以及信息是否以有用的方式呈现。研究可以向观察者展示两种或多种不同的设计，看看哪种设计能带来更高的信息留存率——例如，这对于设计数字书籍或构建一个引人入胜的新闻网站来说是重要的知识。\n\
  \n莫塞里将 Facebook 推出的\"问答\"功能——即向朋友提问并获得答案的能力——作为*战略利益*的一个例子。此类利益可能会与其他利益竞争或对其他利益产生重大影响。就问答功能而言，提问所需的输入框会对询问用户\"\
  你在想什么？\"的状态输入框产生强烈影响。\n\n*用户利益*是人们抱怨的内容以及他们要求的功能和能力。\n\n\n  \n*网络利益* 涉及竞争以及隐私组织或政府提出的监管问题等因素。例如，`Facebook`\
  \ 不得不采纳欧盟对其 `Places` 功能的意见。  \n\n最后，还有*商业利益*，即影响收入生成和盈利能力的因素。收入生成可能与用户增长和参与度相冲突。在网站上投放更多广告短期内可能带来更多收入，但代价是长期参与度的下降。\
  \  \n\n`Mosseri` 指出，仅靠数据驱动决策的挑战之一，是存在优化局部最大值的风险。他列举了 `Facebook` 的两个此类案例：照片和应用程序。\
  \  \n\n`Facebook` 最初的照片上传器是一款可下载的软件，用户必须将其安装到网页浏览器中。在 `Macintosh Safari` 浏览器上，用户会看到一个令人担忧的警告：“来自\
  \ `Facebook` 的小程序正在请求访问您的计算机。”在 `Internet Explorer` 浏览器中，用户需要下载一个 `ActiveX` 控件——一种在浏览器内运行的软件。但为了安装该控件，用户首先必须找到并点击一个只有\
  \ 11 像素高的黄色提示条，该提示条会告知用户此控件的存在。  \n\n设计团队发现，在 `Facebook` 要求安装上传器的 120 万用户中，只有 37%\
  \ 的人尝试这样做。部分用户已安装了上传器，但许多人没有。因此，尽管 `Facebook` 试图优化照片上传器体验，设计团队实际上不得不重新审视整个照片上传流程。他们必须让整个过程变得更加简单——不是渐进式改进，而是显著提升。在这种情况下，数据可以告诉\
  \ `Facebook` 他们在照片上传方面存在问题，并助力渐进式改进，但无法引导团队基于一个全新的上传器进行全新设计。  \n\n`Facebook` 为支持第三方游戏和应用程序（即\
  \ `Facebook` 应用）而实施的视觉框架，是设计团队必须彻底重新设计的另一个领域。借助像 `Mafia Wars` 和 `FrontierVille`（两者均由\
  \ `Zynga` 创建）这样的知名游戏，`Facebook` 在网站上实施的导航框架本质上限定了其能够向此类应用发送的流量。虽然设计团队能够在现有布局范围内进行渐进式改进，但他们无法产生显著影响。直到采用新布局，这些应用获得的流量才大幅提升。\
  \  \n\n正如 `Mosseri` 所言，“真正的创新必然伴随着颠覆。”此类颠覆，如 `News Feed`，往往会导致指标短期内下降，但它们是能够产生有意义长期结果的行动。在\
  \ `Facebook` 的设计中，数据为设计提供信息，而非支配设计。  \n\n`Mosseri` 还强调了 `Facebook` 历史上进行设计的另一个特点：“我们长期以来一直在为自己设计很多东西。”如果这听起来耳熟，那是因为另一家著名科技公司也以这种方式设计其产品。\
  \  \n\n## Apple 定义了设计  \n\n如果要找一家完美诠释卓越设计的公司，那就是 `Apple`。正如 `Steve Jobs` 那句名言：“我们不做市场调研。”⁴\
  \ 相反，`Jobs` 表示：“我们弄清楚自己想要什么。而且我认为我们相当擅长通过严格的纪律来思考，是否很多其他人也会想要它。”  \n\n据 `Apple`\
  \ 前高级工程经理 `Michael Lopp` 和 `John Gruber` 所说，⁵ 谈到全球最著名的设计公司，有几个突出特点。  \n\n首先，`Apple`\
  \ 认为优秀的设计是一份礼物。`Apple` 不仅关注产品本身的设计，还关注产品包装的设计。“`Apple` 所提供的打开礼物前的期待感，是人们从 `Apple`\
  \ 产品中获得愉悦的重要（如果不是最重要）方面。”对 `Apple` 而言，每个产品都是礼物中的礼物中的礼物：从包装本身，到 `iPad`、`iPhone` 或\
  \ `MacBook` 的外观和质感，再到内部运行的软件。  \n\n其次，“像素级完美的模型至关重要。”`Apple` 设计师会将潜在设计细化到最后一个像素。这种方法消除了产品实际外观的所有模糊性。`Apple`\
  \ 设计师甚至使用真实文本，而不是许多模型中常见的拉丁语“lorem ipsum”占位文字。  \n\n第三，`Apple` 设计师通常为任何潜在的新功能制作\
  \ 10 个设计方案。然后 `Apple` 设计团队将 10 个方案缩减到 3 个，再缩减到 1 个。这被称为 10:3:1 设计方法。  \n\n第四，`Apple`\
  \ 设计团队每周举行两类会议。头脑风暴会议允许自由思考，对能做什么或构建什么没有任何限制。生产会议则聚焦于结构现实以及产品交付所需的日程安排。  \n\n`Apple`\
  \ 还做了其他一些事情，使其设计方法与众不同。该公司不做市场调研。相反，员工专注于构建他们自己愿意使用的产品。⁶  \n\n该公司依靠一个非常小的团队来设计其产品。`Apple`\
  \ 工业设计高级副总裁 `Jonathan Ive` 依靠不超过 20 人的团队来设计 `Apple` 的大部分核心产品。  \n\n`Apple` 同时拥有硬件和软件，这使其能够提供完全集成、同类最佳的体验。更重要的是，对于其规模而言，该公司专注于交付数量极少的产品。这使公司能够专注于只提供同类最佳的产品。最后，该公司“对完美有着狂热的追求”，据说\
  \ `Jobs` 会将一半的工作时间投入到特定产品所需的“高水平和极低水平的开发工作中”。  \n\n`Apple` 以其产品的简洁、优雅和易用性而闻名。该公司对设计的关注不亚于对功能的关注。`Jobs`\
  \ 曾指出，优秀的设计不仅仅是为了审美价值——它关乎功能。让产品具有美感的过程，源于让产品易于使用的基本愿望。正如 `Jobs` 曾经说过的：“设计不只是它看起来和摸起来怎么样。设计是它如何工作。”\
  \  \n\n## 大数据在游戏设计中的应用  \n\n`大数据` 发挥关键作用的另一个技术领域是游戏设计。分析工具使游戏设计师能够评估新的留存和变现机会，并交付更令人满意的游戏体验，即使在现有游戏中也是如此。游戏设计师可以查看诸如获取一名玩家的成本、留存率、日活跃用户、月活跃用户、每付费用户收入以及会话时长（即玩家每次游戏时的持续参与时间）等指标。⁷\
  \  \n\n`Kontagent` 是一家提供收集此类数据工具的公司。该公司与数千家游戏工作室合作，帮助他们测试和改进所创建的游戏。  \n\n游戏公司正在创建具有完全可定制组件的游戏。他们采用内容管线方法，即游戏引擎可以导入游戏元素，包括图形元素、关卡、对象以及玩家需要克服的挑战。⁸\
  \  \n\n\n\n"
- '# 流水线方法与数据驱动设计


  流水线方法意味着游戏公司可以将不同类型的工作分离开来——例如，软件工程师的工作与图形设计师和关卡设计师的工作分开。它还能让扩展现有游戏变得更加容易，只需添加更多关卡，而无需开发者重写整个游戏。


  取而代之的是，设计师和图形艺术家只需为新的关卡编写脚本、添加新的挑战、创作新的图形和音效元素。这也意味着，不仅游戏设计师自己可以添加新关卡，玩家也有可能为游戏添加新关卡，或至少是新的图形对象。


  将游戏设计的不同组件分离出来，还意味着游戏设计师可以利用全球范围内的人才资源。图形艺术家可能位于一个地方，而软件工程师则在另一个地方。


  Outrage Games 的斯科特·舒梅克认为，数据驱动的游戏设计方法可以降低通常与游戏创作相关的风险。许多游戏不仅从未完成，而且许多已完成的作品在商业上也不成功。正如舒梅克所指出的，打造一款出色的游戏不仅仅是设计精美的图形和关卡，还在于让游戏变得有趣且具有吸引力。


  游戏设计师在实现游戏之前很难评估这些因素，因此，能够先实现、测试，然后再调整游戏设计至关重要。通过将游戏数据与游戏引擎分离，调整游戏玩法元素（例如《吃豆人》中幽灵的速度）就变得容易多了。


  Zynga 是将数据驱动游戏设计提升到新高度的公司之一。凭借《城市小镇》和《黑手党战争》等成功的 Facebook 游戏而闻名，Zynga 几乎可以实时评估游戏变化带来的影响。Zynga
  的游戏制作人可以观察到特定功能如何影响人们互相赠送礼物的数量，以及人们是否在病毒式传播游戏。


  通过分析数据，Zynga 能够确定在《边疆小镇》中，新玩家完成他们第一个任务（建造一座小木屋）过于困难。通过让任务变得更容易，更多玩家最终留了下来继续玩这款游戏。尽管
  Zynga 的公开市场价值最近有所下降，但它的游戏设计方法显然有很多值得学习的地方。


  '
- '# 大数据打造更好的汽车


  科技领域之外的情况又如何呢？福特的首席大数据官约翰·金德认为，这家汽车公司坐拥海量数据，这些数据可以“惠及消费者、公众以及福特自身”。由于 21 世纪初福特的金融危机以及
  2006 年新 CEO 艾伦·穆拉利的到来，公司变得更加开放，愿意基于数据而非直觉来做决策。该公司正在考虑基于分析和模拟的新方法。


  福特在其不同的职能部门都有分析团队，例如福特信贷部门的风险分析、市场部门的市场分析，以及研发部门的基础汽车研究。数据在公司的扭亏为盈中发挥了巨大作用，因为数据和分析不仅被用来解决单个部门内的战术问题，而且成为制定公司前进战略的关键资产。与此同时，穆拉利非常强调数据驱动的文化；据金德称，这种自上而下对衡量的关注对公司的数据使用及其扭亏为盈产生了巨大影响。


  福特还在硅谷开设了一个实验室，以帮助公司获取技术创新。公司从大约四百万辆具备车载传感能力的车辆中获取数据。工程师可以分析有关人们如何使用汽车、驾驶环境以及车辆响应方式的数据。


  所有这些数据都有潜力帮助公司改进汽车的操控性、燃油经济性和尾气排放。公司已经利用此类数据通过减少车内噪音来改进汽车设计，这种噪音曾干扰车载语音识别软件。这类数据还帮助福特工程师确定了用于接收语音命令的麦克风的最佳位置。


  大数据还帮助汽车设计师打造更好的发动机。马自达使用 MathWorks 的工具开发了其创驰蓝天发动机技术系列。模型使马自达的工程师能够“更深入地了解发动机内部的情况”，并因此实现更好的燃油效率和发动机性能。这种模型使发动机设计师能够在制造昂贵的原型之前测试新的发动机部件和设计。


  从历史上看，挑战在于为绝大多数车辆提供动力的内燃机极其难以建模。这是因为它们本质上是复杂的系统。它们涉及流体运动、热传递、点火、污染物的形成，以及在柴油机和燃油喷射发动机中的喷雾动力学。


  设计师也在使用数据分析来做出如何改进赛车的决策，这些决策最终可能会影响到消费者购买的汽车。举一个例子，彭斯克赛车队一直在输掉比赛。为了找出原因，工程师为车队赛车配备了传感器，收集了包括轮胎温度和转向在内的
  20 多个不同变量的数据。尽管工程师对这些数据进行了为期两年的分析，他们仍然无法弄清楚车手为什么会输掉比赛。


  数据分析公司 Event Horizon 获取了相同的数据，但采用了一种不同的方法来理解它。他们没有查看原始数据，而是使用动画可视化来表示赛车的动态变化。通过使用这些可视化，他们很快发现，从车手转动方向盘到车辆实际转向之间存在一个延迟。这导致车手进行了大量细微的调整，所有这些调整累积起来造成了时间损失。仅仅拥有正确的数据是不够的——在设计以及大数据的其他方面，能够以正确的方式查看数据至关重要。


  ![Image](img/sq.jpg) **注意** 收集大数据是容易的部分。解读它才是困难的部分。但如果你做对了，你将获得竞争优势，这将推动你达到卓越和公司价值的新高度。


  '
- '# 大数据与音乐


  大数据不仅帮助我们制造更好的汽车和飞机。它还在帮助我们设计更好的音乐厅。哈佛大学讲师 W.C. 赛宾在 20 世纪之交创立了建筑声学领域。


  在他最初的研究中，赛宾将听众觉得难以听清的福格演讲厅与附近被认为音效极佳的桑德斯剧院进行了声学比较。赛宾和他的助手们将座椅坐垫等材料从桑德斯剧院搬到福格演讲厅，以确定这些材料对大厅声学效果的影响。值得注意的是，赛宾和他的助手们是在夜间进行这项工作的，仔细测量，然后在早晨之前将所有材料归位，以免干扰两个大厅白天的使用。




  经过大量研究，赛宾定义了混响时间或“回声效应”，即声音从其起始水平下降 60 分贝所需的秒数。赛宾发现，最佳音乐厅的混响时间在 2 到 2.25 秒之间。混响时间过长的厅堂被认为过于“活跃”，而混响时间过短的厅堂则被认为过于“干涩”。


  混响时间基于两个因素计算：房间容积和总吸声面积，即存在的吸声表面量。在福格讲堂的案例中，该厅堂中说完的话语大约在 5.5 秒后仍能听清，大约相当于追加了 12
  到 15 个单词，赛宾得以减少了回声效应并改善了该讲堂的声学效果。后来，赛宾还参与了波士顿交响音乐厅的设计。


  自赛宾时代以来，该领域持续发展。现在，数据分析师可以使用模型来评估现有厅堂的声学问题，并模拟新厅堂的设计。一项创新是引入了具有可重构几何形状和材料的厅堂，这些厅堂可以调整，以使其适用于不同的用途（如音乐或演讲）。


  具有讽刺意味的是，古典音乐厅（例如 19 世纪末建造的那些）具有极佳的声学效果，而许多近期建造的厅堂则不然。过去，建筑师受到历史上用于建造此类厅堂的木材强度和刚度限制。近期，由于希望容纳更多座位，以及新型建筑材料的引入使得建筑师能够设计几乎任何尺寸和形状的音乐厅，这使得数据驱动的厅堂设计需求日益增加。


  建筑师现在正试图设计出听起来与波士顿和维也纳的音乐厅非常相似的新型厅堂。声学质量、厅堂容量和厅堂形状可能并非互斥。通过利用大数据，建筑师或许能够在使用当今的建筑材料并满足当今座位需求的同时，再现旧时音乐厅的音质。


  ## 大数据与建筑


  音乐厅并非建筑师运用大数据的唯一建筑领域。建筑师正更普遍地将数据驱动的设计应用于建筑学。正如拥有 100 名员工的建筑事务所 LMN 的萨姆·米勒所指出的，旧的建筑设计模式是设计、记录、建造、重复。这需要数年时间才能吸取经验教训，而一位有
  20 年经验的建筑师可能只经历过十几个这样的设计周期。


  通过数据驱动的建筑方法，建筑师用一个迭代循环取代了这一过程：建模、模拟、分析、综合、优化、重复。就像发动机设计师可以使用模型来模拟发动机性能一样，建筑师现在也可以使用模型来模拟建筑的实际建造过程。


  据米勒称，他的团队现在可以在几天内对数百个设计进行模拟，并且他们可以找出哪些因素影响最大。“直觉，”米勒说，“在数据驱动的设计过程中所起的作用比在模拟过程中要小。”更重要的是，由此产生的建筑性能显著提升。


  建筑师并不按研究和设计时间收费，但米勒表示，采用数据驱动的方法使得此类时间投资变得物有所值，因为这为他的公司带来了竞争优势。


  大数据还通过利用收集到的关于节能节水的数据，帮助设计更环保的建筑。建筑师、设计师和建筑管理者现在可以评估基准数据，以确定某栋特定建筑与其他绿色建筑相比如何。美国环保署的`Portfolio
  Manager`就是支持这种方法的软件工具之一。`Portfolio Manager`是一个交互式能源管理工具，允许业主、管理者和投资者跟踪并评估投资组合中所有建筑的能源和用水情况。


  `Sefaira`提供基于网络的软件，该软件利用深厚的物理学专业知识，提供设计分析、知识管理和决策支持能力。使用该公司的软件，用户可以衡量并优化不同设计策略在能源、用水、碳足迹和财务方面的收益。


  ## 数据驱动设计


  在研究许多不同公司的设计方法以及使用数据的方式时，可以清晰地看到，数据正越来越多地被用于指导设计。但同样清晰的是，设计，以及伴随着重大变革而来的颠覆，仍然依赖于直觉——无论是在苹果、Facebook，还是在你的公司。


  正如网站分析公司 Adobe/Omniture 的客户分析布道师兼博客`AnalyticsHero`的作者布伦特·戴克斯所指出的，创意和数据常常被视为相互对立。设计师们通常将数据视为创造力的障碍，而非更好设计的助推器。


  在一个著名的例子中，谷歌的设计师道格拉斯·鲍曼离开了该公司，理由是其压抑的、数据驱动的设计方法。鲍曼描述了一个事件：谷歌的一个团队无法在两种蓝色之间做出选择，于是他们测试了这两种蓝色之间的
  41 种色度，以确定哪一种表现最好。


  然而，如今担任推特创意总监的鲍曼并未因此指责谷歌的设计方法。考虑到数以亿计美元的价值，他将这种方法描述为将“每个决策简化为一个简单的逻辑问题”。但他确实将数据描述为“每个决策的拐杖，使公司瘫痪并阻止其做出任何设计决策”。


  相比之下，戴克斯认为，数据引入的限制反而增强了创造力。在确定设计变更是否帮助更多人完成他们的任务，或者是否导致网站从试用用户向付费客户的转化率提高方面，数据可能极具帮助。


  数据有助于改进现有设计，但正如 Facebook 设计师亚当·莫塞里所指出的，它无法为设计师呈现一个全新的设计。它可以改善一个网站，但如果需要的话，它还不能从零开始创建一个全新的网站。换句话说，在涉及设计时，数据在达到局部最优方面可能比达到全局最优更有帮助。


  数据还可以告诉你设计何时根本不起作用。正如连续创业者和斯坦福大学讲师史蒂夫·布兰克曾对一位向他寻求建议的企业家所说：“看看数据。”布兰克是在强调，这位企业家的论点根本站不住脚。


  同样清晰的是，从游戏到汽车再到建筑等许多不同的设计领域，设计过程本身正在发生变化。由于大数据资源的运用，从创建设计到测试设计的周期正在变得短得多。


  获取现有设计的数据并找出问题所在或如何逐步改进的过程，无论是在线上还是线下，也都在变得更快。低成本的數據收集和计算资源在加速设计、测试和重新设计的过程中正发挥着重要作用。这反过来又使人们不仅能够使他们的设计，而且能够使设计过程本身，都受益于数据。




