reviews:
- 'no': 2972
  overturn_probability: 0.1
  alternative: 正文小标题或子章节标题
  counter_evidence:
  - 该标题使用 Markdown 一级标记 `#`，但在上下文中（2962行有 `##` 标题），通常 `#` 代表最高层级。然而，2972行标题“影响远不止于此”语义上更像是对前文（2950-2971行关于大脑处理信息）的一个总结性过渡，而非一个完全独立的顶级大章。如果本书采用
    `#` 作为章节（Chapter）级别，`##` 作为节（Section）级别，那么 2962行（`##`）和 2972行（`#`）混用可能存在层级混乱。但更关键的证据是：该标题后没有跟随典型的章节起始特征（如目录页码、独立的引言段），而是紧接着具体的论述。此外，如果前文
    2950行附近没有更高级的 `#` 标题，这个 `#` 可能是误用的章节标记，或者确实是一个新章节。考虑到规则中“只划分全书最高层级的大章”，若全书其他章节也用
    `#`，则应分章。若全书章节用 `##`，则此为误报。基于仅给出的片段，无法确定全书层级映射，但 2962行是 `##`，2972行是 `#`，这种跳跃暗示
    `#` 是比 `##` 更高或独立的层级。如果 `#` 是章，`##` 是节，那么 2972 是新章。但是，观察 3074行也是 `#`，3172行也是 `#`。如果这些
    `#` 都是章，那么 2962 的 `##` 可能是上一章里的节。因此 2972 很有可能是新章。反方证据薄弱，主要基于语义连贯性，它可能只是上一章的一个大标题。
  - 该标题长度短，无句号，符合章标题格式特征。
  keep_split: true
- 'no': 3012
  overturn_probability: 0.2
  alternative: 正文小标题或子章节标题
  counter_evidence:
  - 标题“应对数据过载：大数据如何帮助消化和过滤信息”使用 `#` 标记。在 3074行之前，3012行是唯一的 `#` 标题。如果 2972行是 `#`，3012行也是
    `#`，它们之间隔了40行。通常章节不会这么短且密集，除非是短篇合集。但结合 3074行也是 `#`，且 3172行也是 `#`，这些 `#` 标题间隔较长（几十到一百行），符合章节特征。反方证据在于：如果这本书的
    `##` 是章，`#` 是部分，或者反之。通常 Markdown 中 `#` 是 H1。如果 H1 是部分（Part），H2 是章（Chapter），那么
    H1 不应该划为新章（除非部分-章节模式，但规则说“只划分全书最高层级的大章...如果遇到...子层级，不划分”。如果 H1 是最高层级，则应划分）。规则指出“只划分全书最高层级的大章（如‘第
    X 章’...）”。这里的 `#` 没有序号。如果 `#` 对应“第 X 章”的地位，则应分章。
  - 该标题具有统领性，覆盖了后续关于大数据过滤信息的多个段落。
  keep_split: true
- 'no': 3074
  overturn_probability: 0.1
  alternative: 正文小标题或子章节标题
  counter_evidence:
  - 标题“顶石案例研究：大数据邂逅爱情”使用 `#`。紧随其后的 3076行是 `## 产品、服务与爱情...`。这表明 `#` 包含 `##`。如果 `#`
    是章，`##` 是节，符合常规层级。反方证据极少，因为层级结构清晰。
  - 内容具有明确的案例研究主题，区别于前文的理论讨论。
  keep_split: true
- 'no': 3172
  overturn_probability: 0.3
  alternative: 正文小标题或子章节标题
  counter_evidence:
  - 标题“戈特曼论亲密关系”使用 `#`。它位于 3074行（`# 顶石案例研究...`）的覆盖范围内。3074行后面有大量 `##` 级别的内容（如 3110,
    3132, 3150 等）。3172行突然出现 `#`，这意味着它可能是一个新的顶级章节，或者是一个排版错误（本应是 `##` 或 `###`）。
  - 反方证据：如果本书结构是“章(`#`) -> 节(`##`)”，那么 3172 作为 `#` 确实开启新章。但如果 3074 是章，3172 也是章，那么
    3074 章节的内容（3074-3171）中包含了多个 `##`，而 3172 跳回了 `#`。这在逻辑上是通顺的（新章开始）。然而，观察 3182行 `##
    Facebook...` 又回到了二级。这说明 3172 很可能是一个独立的顶级章节，或者是“顶石案例研究”这个大章下的一个并列大节（但用了错误的标记）。考虑到
    Markdown 标记的一致性，`#` 通常指代最高层级。如果没有“部分”概念，`#` 即为章。因此分章是合理的。但存在误报风险，即它只是同一章内的另一个主要部分，作者误用了
    `#` 而非 `##`。
  - 该标题语义上聚焦于特定人物（戈特曼）的研究，范围较窄，可能属于上一大章“顶石案例研究”中的一个具体案例小节，而非独立大章。
  keep_split: true
- 'no': 3317
  overturn_probability: 0.0
  alternative: 附录标题
  counter_evidence:
  - 位于 3315行 `## 附录 A` 之下。通常附录是书的组成部分。规则规定“前言、序言...文末索引也划分为一章”。附录通常也被视为独立的结尾部分。
  - 该行是 `#` 一级标题，且内容是“大数据资源”，作为附录的具体内容标题。如果 `## 附录 A` 被视为一个独立的章节（或 `#` 才是章节层级），那么
    `#` 应该分章。注意 3315 是 `##`，3317 是 `#`。层级反转了？通常 `##` 是节，`#` 是章。这里 `## 附录 A` 下面跟着 `#
    大数据资源`。这在 Markdown 层级上很怪异（父级比子级高？或者 `##` 只是装饰）。如果 `#` 是最高层级，3317 应该是章。
  - 规则明确说“文末索引也划分为一章”，附录通常同等对待。
  keep_split: true
