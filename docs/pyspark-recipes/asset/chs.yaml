- "# 4. Spark 架构与弹性分布式数据集\n\n您在上一章学习了 Python。现在是学习 PySpark 并利用分布式系统的强大功能来解决与大数据相关的问题的时候了。我们通常将大量数据分布在集群上，并对其执行处理。\n\
  \n本章涵盖以下内容：\n\n- 方案 4-1：创建 RDD\n- 方案 4-2：转换温度数据\n- 方案 4-3：执行基本数据操作\n- 方案 4-4：运行集合操作\n\
  - 方案 4-5：计算汇总统计信息\n- 方案 4-6：在独立集群管理器上启动 PySpark shell\n- 方案 4-7：在 Mesos 上启动 PySpark\
  \ shell\n- 方案 4-8：在 YARN 上启动 PySpark shell\n\n了解 Spark 的架构将非常有助于理解 Spark 的各种组件。在深入研究这些方案之前，让我们先探讨这个主题。\n\
  \n图 4-1 描述了 Spark 架构。\n\n![A430628_1_En_4_Fig1_HTML.gif](img/A430628_1_En_4_Fig1_HTML.gif)\n\
  \n**图 4-1.** Spark 架构\n\nSpark 架构的主要组件是 driver 和 executors。对于每个 PySpark 应用程序，将会有一个\
  \ driver 程序和一个或多个在集群从节点上运行的 executors。您可能想知道，在 PySpark 的上下文中，什么是应用程序？应用程序是用于解决一整套代码的问题。\n\
  \n**driver** 是协调在各个从节点机器上运行的许多 executors 的进程。Spark 遵循主从架构。`SparkContext` 对象由 driver\
  \ 创建。`SparkContext` 是 PySpark 应用程序的主要入口点。您将在后续章节中了解更多关于 `SparkContext` 的信息。在本章中，我们将在\
  \ PySpark shell 中运行 PySpark 命令。启动 shell 后，我们会发现 `SparkContext` 对象是自动创建的。我们将在 PySpark\
  \ shell 中以变量 `sc` 的形式遇到 `SparkContext` 对象。shell 本身充当我们的 driver。driver 将我们的应用程序分解为小任务；任务是我们应用程序的最小单元。任务在不同的\
  \ executors 上并行执行。driver 还负责将任务调度到不同的 executors。\n\n**Executors** 是从进程。executor\
  \ 运行任务。它还具有通过使用 `BlockManager` 进程在内存中缓存数据的能力。每个 executor 在自己的 Java 虚拟机（JVM）中运行。\n\
  \n**集群管理器** 管理集群资源。driver 与集群管理器协商资源。集群管理器还在各个从 executor 进程上代表 driver 调度任务。PySpark\
  \ 随附了独立集群管理器。PySpark 也可以在 YARN 和 Apache Mesos 上配置。在我们的方案中，您将看到如何在独立集群管理器和 Apache\
  \ Mesos 上配置 PySpark。在单机模式下，PySpark 也可以在本地模式下启动。\n\nPySpark 中备受推崇的主要组件是**弹性分布式数据集（RDD）**。RDD\
  \ 是对分布式集合的数据抽象。Python 集合（如列表、元组和集合）可以非常容易地被分布。RDD 会在节点故障时重新计算。根据需要，仅计算或重新计算部分数据。RDD\
  \ 是使用 `SparkContext` 类中定义的各种函数创建的。创建 RDD 的一个重要函数是 `parallelize()`，您将在本章中反复遇到它。图\
  \ 4-2 说明了 RDD 的创建。\n\n![A430628_1_En_4_Fig2_HTML.gif](img/A430628_1_En_4_Fig2_HTML.gif)\n\
  \n**图 4-2.** 创建 RDD\n\n假设我们有一个 Python 集合，其元素为 `Data1`、`Data2`、`Data3`、`Data4`、`Data5`、`Data6`\
  \ 和 `Data7`。该集合分布在集群上以创建 RDD。为简单起见，我们可以假设正在运行两个 executors。我们的集合被分成两部分。第一个 executor\
  \ 获取集合的第一部分，其中包含元素 `Data1`、`Data2`、`Data3` 和 `Data4`。集合的第二部分被发送到第二个 executor。因此，第二个\
  \ executor 拥有数据元素 `Data5`、`Data6` 和 `Data7`。\n\n\n\n我们可以对 RDD 执行两种操作：**转换**（transformation）和**行动**（action）。对\
  \ RDD 进行转换会返回另一个 RDD。我们知道 RDD 是不可变的；因此，不可能改变 RDD。所以转换总是返回另一个 RDD。转换是惰性的，而行动则会被立即执行。我说转换是惰性的，因为每当对\
  \ RDD 应用转换时，该操作并不会同时应用到数据上。相反，PySpark 会记录下这个操作请求，但所有转换都会在首次调用行动时才会被真正执行。\n\n图 4-3\
  \ 展示了一个转换操作。对 `RDD1` 进行转换创建了 `RDD2`。`RDD1` 有两个分区。`RDD1` 的第一个分区有四个数据元素：`Data1`、`Data2`、`Data3`\
  \ 和 `Data4`。`RDD1` 的第二个数据分区有三个元素：`Data5`、`Data6` 和 `Data7`。对 `RDD1` 进行转换后，`RDD2`\
  \ 被创建。`RDD2` 有六个元素。因此很明显，子 RDD 的数据元素数量可能与父 RDD 不同。`RDD2` 也有两个分区。`RDD2` 的第一个分区有三个数据点：`Data8`、`Data9`\
  \ 和 `Data10`。`RDD2` 的第二个分区也有三个元素：`Data11`、`Data12` 和 `Data13`。不必困惑于子 RDD 的分区数量可能与父\
  \ RDD 不同。\n\n![A430628_1_En_4_Fig3_HTML.gif](img/A430628_1_En_4_Fig3_HTML.gif)\n\
  \n图 4-3. RDD 转换\n\n图 4-4 展示了对 RDD 执行的一个行动。在这个例子中，我们应用了求和行动。求和后的数据被返回给驱动程序。在其他情况下，行动的结果可以保存到文件或其他目标。\n\
  \n![A430628_1_En_4_Fig4_HTML.gif](img/A430628_1_En_4_Fig4_HTML.gif)\n\n图 4-4. RDD\
  \ 行动\n\n你可能在想，既然 Spark 是用 Scala 编写的，那么 Python 是如何与 Scala 通信的呢？你可能会猜测 PySpark 的 Python\
  \ 包装器是用 Jython 编写的，并且这些 Jython 代码被编译成 Java 字节码并在 JVM 上运行。这个猜测是不正确的。\n\n一个正在运行的 Python\
  \ 程序可以通过 Py4J 访问 JVM 中的 Java 对象。一个正在运行的 Java 程序也可以通过 Py4J 访问 Python 对象。Python 和\
  \ Java 之间的网关使得 Python 能够使用 Java 对象。\n\n驱动程序使用 Py4J 在 Python 和 Java `SparkContext`\
  \ 对象之间进行通信。PySpark 使用 Py4J，以便 PySpark 的 Python 代码能够与 Java `SparkContext` 交互。\n\n\
  在远程集群机器上，`PythonRDD` 对象会创建 Python 子进程，并通过管道与它们通信。`PythonRDD` 对象在 JVM 中运行，并通过管道与\
  \ Python 进程通信。\n\n**注意**\n\n您可以在以下位置了解更多关于 Py4J 的信息：\n\n*   [`www.py4j.org`](https://www.py4j.org)\n\
  *   [`https://cwiki.apache.org/confluence/display/SPARK/PySpark+Internals`](https://cwiki.apache.org/confluence/display/SPARK/PySpark+Internals)\n\
  \n## 配方 4-1. 创建一个 RDD\n\n### 问题\n\n你想要创建一个 RDD。\n\n### 解决方案\n\n如同我们所知，RDD 是一个分布式集合。你有一个包含以下数据的列表：\n\
  \n```\npythonList = [2.3,3.4,4.3,2.4,2.3,4.0]\n```\n\n你想要执行以下操作：\n\n*   创建该列表的 RDD\n\
  *   获取第一个元素\n*   获取前两个元素\n*   获取 RDD 中的分区数\n\n在 PySpark 中，可以通过多种方式创建 RDD。从给定集合创建\
  \ RDD 的一种方法是使用 `parallelize()` 函数。`SparkContext` 对象用于调用 `parallelize()` 函数。你将在后续章节中了解更多关于\
  \ `SparkContext` 的信息。\n\n对于大数据，即使是表格数据，一张表也可能有超过 1000 列。有时分析师希望查看这些数据列的外观。`first()`\
  \ 函数定义在 RDD 上，它会返回 RDD 的第一个元素。\n\n要从列表中获取多个元素，我们可以使用 `take()` 函数。可以通过 `getNumPartitions()`\
  \ 获取集合的分区数。\n\n### 工作原理\n\n\n\n让我们按照本节中的步骤来解决问题。\n\n#### 步骤 4-1-1. 创建一个列表的 RDD\n\
  \n首先，通过以下代码创建一个 Python 列表：\n\n```\n>>> pythonList = [2.3,3.4,4.3,2.4,2.3,4.0]\n\
  >>> pythonList\n```\n\n输出如下：\n\n```\n[2.3, 3.4, 4.3, 2.4, 2.3, 4.0]\n```\n\n数据的并行化或分布是通过\
  \ `parallelize()` 函数完成的。该函数接收两个参数。第一个参数是要并行化的集合，第二个参数表示你希望将数据分成的块数：\n\n```\n>>>\
  \ parPythonData = sc.parallelize(pythonList,2)\n```\n\n使用 `parallelize()` 函数，我们将数据分布到了两个分区中。为了在驱动程序上获取所有数据，我们可以使用\
  \ `collect()` 函数，如下方代码行所示。在生产环境中不建议使用 `collect()` 函数，它仅应用于代码调试。\n\n```\n>>> parPythonData.collect()\n\
  ```\n\n输出如下：\n\n```\n[2.3, 3.4, 4.3, 2.4, 2.3, 4.0]\n```\n\n#### 步骤 4-1-2. 获取第一个元素\n\
  \n`first()` 函数可用于从 RDD 中获取第一条数据。你可能已经注意到，`collect()` 和 `first()` 函数执行的是动作操作：\n\n\
  ```\n>>> parPythonData.first()\n```\n\n输出如下：\n\n```\n2.3\n```\n\n#### 步骤 4-1-3.\
  \ 获取前两个元素\n\n有时数据分析师希望查看多行数据。`take()` 函数可用于从 RDD 中获取多行数据。你需要获取的行数作为参数传递给 `take()`\
  \ 函数：\n\n```\n>>> parPythonData.take(2)\n```\n\n输出如下：\n\n```\n[2.3, 3.4]\n```\n\n\
  #### 步骤 4-1-4. 获取 RDD 中的分区数\n\n为了优化 PySpark 代码，需要合理分布数据。RDD 的分区数可以通过 `getNumPartitions()`\
  \ 函数获取：\n\n```\n>>> parPythonData.getNumPartitions()\n```\n\n输出如下：\n\n```\n2\n```\n\
  \n回顾一下，我们在使用 `parallelize()` 函数时将数据划分成了两个分区。\n\n## 食谱 4-2. 转换温度数据\n\n### 问题\n\n\
  你希望通过在 RDD 上编写温度单位转换程序来转换温度数据。\n\n### 解决方案\n\n你拥有华氏度的每日温度数据，并希望对数据进行一些分析。但你的新软件只接收摄氏度的输入。因此，你需要将温度数据从华氏度转换为摄氏度。表\
  \ 4-1 显示了你拥有的数据。\n\n![A430628_1_En_4_Figa_HTML.gif](img/A430628_1_En_4_Figa_HTML.gif)\n\
  \n**表 4-1.** 每日华氏温度\n\n你需要完成以下操作：\n\n* 将温度从华氏度转换为摄氏度\n* 获取所有大于 13°C 的温度数据点\n\n我们可以通过以下数学公式将温度从华氏度转换为摄氏度：\n\
  \n```\noC = (oF – 32) × 5/9\n```\n\n在 PySpark 中，这属于一个转换问题。我们可以通过在 RDD 上使用 `map()`\
  \ 函数来完成此任务。\n\n获取所有大于 13°C 的温度则是一个过滤问题。数据的过滤可以通过在 RDD 上使用 `filter()` 函数来完成。\n\n\
  ### 工作原理\n\n我们将按照本节中的步骤完成转换和过滤练习。\n\n#### 步骤 4-2-1. 并行化数据\n\n我们将使用 `parallelize()`\
  \ 函数来并行化数据。我们将数据分布到两个分区中，如下所示：\n\n```\n>>> tempData = [59,57.2,53.6,55.4,51.8,53.6,55.4]\n\
  >>> parTempData = sc.parallelize(tempData,2)\n>>> parTempData.collect()\n```\n\n\
  输出如下：\n\n```\n[59, 57.2, 53.6, 55.4, 51.8, 53.6, 55.4]\n```\n\n数据集合返回了我们已经并行化的数据。\n\
  \n#### 步骤 4-2-2. 将温度从华氏度转换为摄氏度\n\n现在我们将把华氏度温度转换为摄氏度。我们将编写一个 `fahrenheitToCentigrade`\
  \ 函数，该函数接收华氏度温度作为输入，并返回对应的摄氏度温度：\n\n```\n>>> def fahrenheitToCentigrade(temperature)\
  \ :\n...  centigrade = (temperature-32)*5/9\n...  return centigrade\n```\n\n\n\n\
  让我们测试一下 `fahrenheitToCentigrade` 函数：\n\n```\n>>> fahrenheitToCentigrade(59)\n```\n\
  \n输出结果如下：\n\n```\n\n```\n\n我们提供的输入华氏温度是 59。该函数返回了该华氏输入值对应的摄氏温度值；59°F 等于 15°C。\n\n\
  ```\n>>> parCentigradeData = parTempData.map(fahrenheitToCentigrade)\n>>> parCentigradeData.collect()\n\
  ```\n\n输出结果如下：\n\n```\n[15, 14.000000000000002, 12.0, 13.0, 10.999999999999998,\
  \ 12.0, 13.0]\n```\n\n我们已经将给定的温度转换成了摄氏度。现在，让我们筛选出所有大于或等于 13°C 的温度。\n\n#### 步骤 4-2-3.\
  \ 筛选大于 13°C 的温度\n\n要筛选数据，我们可以对 RDD 使用 `filter()` 函数。我们需要向 `filter()` 函数提供一个谓词作为输入。谓词是一个测试条件并返回\
  \ `True` 或 `False` 的函数。\n\n让我们定义谓词 `tempMoreThanThirteen`，它接收一个温度值，如果输入大于或等于 13，则返回\
  \ `True`：\n\n```\n>>> def tempMoreThanThirteen(temperature):\n...  return temperature\
  \ >=13\n```\n\n我们将把 `tempMoreThanThirteen` 函数作为输入传递给 `filter()` 函数。`filter()` 函数会遍历\
  \ `parCentigradeData` RDD 中的每一个值。对于每个值，都会应用 `tempMoreThanThirteen` 函数。如果该值大于或等于\
  \ 13，则返回 `True`。`tempMoreThanThirteen` 返回 `True` 的那些值会被存入 `filteredTemprature`：\n\
  \n```\n>>> filteredTemprature = parCentigradeData.filter(tempMoreThanThirteen)\n\
  >>> filteredTemprature.collect()\n```\n\n输出结果如下：\n\n```\n[15, 14.000000000000002,\
  \ 13.0, 13.0]\n```\n\n我们可以使用 lambda 函数来替代我们的谓词（我们在第 3 章讨论过 lambda 函数）。使用 lambda\
  \ 函数能让代码更具可读性。下面这行代码清晰地表明 `filter()` 函数接收一个谓词作为输入，并对所有大于或等于 13 的值返回 `True`：\n\n\
  ```\n>>> filteredTemprature = parCentigradeData.filter(lambda x : x>=13)\n>>> filteredTemprature.collect()\n\
  ```\n\n输出结果如下：\n\n```\n[15, 14.000000000000002, 13.0, 13.0]\n```\n\n我们最终得到了四个元素，它们表示的温度都大于或等于\
  \ 13。至此，你已经了解了如何使用 PySpark 对数据进行基本分析。\n\n## 方案 4-3. 执行基本的数据操作\n\n### 问题\n\n你想要进行数据操作并执行聚合操作。\n\
  \n### 解决方案\n\n在本方案中，你将获得一份数据，这些数据展示了学生在两年（四个学期）课程中的成绩。有七名学生选修了这门课程。表 4-2 展示了七名学生在两年内按学期划分的成绩数据。\n\
  \n![A430628_1_En_4_Figb_HTML.gif](img/A430628_1_En_4_Figb_HTML.gif)\n\n**表 4-2.**\
  \ 学生成绩\n\n你需要计算以下内容：\n\n-   每个学生每年每学期的平均成绩\n-   第二年平均成绩最高的前三名学生\n-   第二年平均成绩最低的后三名学生\n\
  -   在第二年第二学期平均成绩超过 80% 的所有学生\n\n使用 `map()` 函数通常很有帮助。在本例中，可以使用 `map()` 计算每年每学期的平均成绩。\n\
  \n获取前 k 个元素（例如表现最好的前 k 个债券）是一个常见的数据科学问题。PySpark 的 `takeOrdered()` 函数将用于从我们的 RDD\
  \ 中获取前 k 个或后 k 个元素。\n\n在第二年平均成绩超过 80% 的学生可以使用 `filter()` 函数来筛选。\n\n### 实现原理\n\n\
  让我们分步解决这个问题。我们首先从创建数据集的 RDD 开始。\n\n#### 步骤 4-3-1. 从给定表格创建列表\n\n在这一步中，我们将创建一个嵌套列表。这意味着列表中的每个元素都是一条记录，而每条记录本身也是一个列表：\n\
  \n\n```python\n>>> studentMarksData = [[\"si1\",\"year1\",62.08,62.4],\n...  [\"\
  si1\",\"year2\",75.94,76.75],\n...  [\"si2\",\"year1\",68.26,72.95],\n...  [\"si2\"\
  ,\"year2\",85.49,75.8],\n...  [\"si3\",\"year1\",75.08,79.84],\n...  [\"si3\",\"\
  year2\",54.98,87.72],\n...  [\"si4\",\"year1\",50.03,66.85],\n...  [\"si4\",\"year2\"\
  ,71.26,69.77],\n...  [\"si5\",\"year1\",52.74,76.27],\n...  [\"si5\",\"year2\",50.39,68.58],\n\
  ...  [\"si6\",\"year1\",74.86,60.8],\n...  [\"si6\",\"year2\",58.29,62.38],\n...\
  \  [\"si7\",\"year1\",63.95,74.51],\n...  [\"si7\",\"year2\",66.69,56.92]]\n```\n\
  \n#### 步骤 4-3-2. 并行化数据\n\n使用 `parallelize()` 函数并行化数据后，我们会得到一个 RDD，其中每个元素本身就是一个列表：\n\
  \n```python\n>>> studentMarksDataRDD = sc.parallelize(studentMarksData,4)\n```\n\
  \n正如我们所知，`collect()` 函数会将整个 RDD 拉取到驱动程序。如果 RDD 规模非常大，驱动程序可能会面临内存问题。为了获取 RDD 的前 k\
  \ 个元素，我们可以使用 `take()` 函数，并将 n 作为 `take()` 的输入。例如，在下面的代码行中，我们正在获取 RDD 的两个元素。请记住，这里的\
  \ `take()` 是一个动作（action）：\n\n```python\n>>> studentMarksDataRDD.take(2)\n```\n\n\
  输出如下：\n\n```python\n[['si1', 'year1', 62.08, 62.4],\n['si1', 'year2', 75.94, 76.75]]\n\
  ```\n\n#### 步骤 4-3-3. 计算学期平均成绩\n\n现在让我解释一下我想在下面的代码中做什么。以 RDD 的第一个元素为例。我们 RDD 的第一个元素是\
  \ `['si1', 'year1', 62.08, 62.4]`，这是一个包含四个元素的列表。我们的工作是计算两个学期成绩的平均值。在第一个元素中，平均值是\
  \ `0.5(62.08 + 62.4)`。我们将使用 `map()` 函数来得到我们的解决方案。\n\n```python\n>>> studentMarksMean\
  \ = studentMarksDataRDD.map(lambda x : [x[0],x[1],(x[2]+x[3])/2])\n```\n\n再次，我们使用\
  \ `take()` 函数来可视化 `map()` 函数的输出：\n\n```python\n>>> studentMarksMean.take(2)\n```\n\
  \n输出如下：\n\n```python\n[['si1', 'year1', 62.239999999999995],\n['si1', 'year2', 76.345]]\n\
  ```\n\n#### 步骤 4-3-4. 筛选二年级学生平均成绩\n\n下面的代码行将筛选出所有二年级的数据。我们使用一个 lambda 函数实现了我们的谓词。我们的谓词函数检查\
  \ `year2` 是否在列表中。如果谓词返回 `True`，则该列表包含二年级的成绩。\n\n```python\n>>> secondYearMarks =\
  \ studentMarksMean.filter(lambda x : \"year2\" in x)\n>>> secondYearMarks.take(2)\n\
  ```\n\n输出如下：\n\n```python\n[['si1', 'year2', 76.345],\n['si2', 'year2', 80.645]]\n\
  ```\n\n我们可以清楚地看到 `secondYearMarks` 的 RDD 输出仅包含二年级的成绩。\n\n#### 步骤 4-3-5. 查找前三名学生\n\
  \n我们可以通过两种方式获得前三名学生。第一种方法是根据成绩对全部数据进行排序。显然，我们将按降序对数据进行排序。排序通过 `sortBy()` 函数完成。让我们看看实现：\n\
  \n```python\n>>> sortedMarksData = secondYearMarks.sortBy(keyfunc = lambda x : -x[2])\n\
  ```\n\n在我们的 `sortBy()` 函数中，我们提供了 `keyfunc` 参数。此参数指示按降序对成绩数据进行排序。现在收集输出并查看结果：\n\n\
  ```python\n>>> sortedMarksData.collect()\n```\n\n输出如下：\n\n```python\n[['si2', 'year2',\
  \ 80.645],\n['si1', 'year2', 76.345],\n['si3', 'year2', 71.35],\n['si4', 'year2',\
  \ 70.515],\n['si7', 'year2', 61.805],\n['si6', 'year2', 60.335],\n['si5', 'year2',\
  \ 59.485]]\n```\n\n排序数据后，我们可以使用 `take()` 函数获取前三个元素：\n\n```python\n>>>  sortedMarksData.take(3)\n\
  ```\n\n输出如下：\n\n```python\n[['si2', 'year2', 80.645],\n['si1', 'year2', 76.345],\n\
  ['si3', 'year2', 71.35]]\n```\n\n我们得到了答案。但是我们可以进一步优化吗？为了获得前三的数据，我们对整个列表进行了排序。我们可以通过使用\
  \ `takeOrdered()` 函数来优化这一点。该函数接受两个参数：我们需要的元素数量，以及 `key`，它使用一个 lambda 函数来确定如何取出数据。\n\
  \n```python\n>>> topThreeStudents = secondYearMarks.takeOrdered(num=3, key = lambda\
  \ x :-x[2])\n```\n\n在前面的代码中，我们将 `num` 设置为 3 以获取前三个元素，并在 `key` 中设置 `lambda`，以便它能以降序提供前三名的数据。\n\
  \n```python\n>>> topThreeStudents\n```\n\n输出如下：\n\n```python\n[['si2', 'year2',\
  \ 80.645],\n['si1', 'year2', 76.345],\n['si3', 'year2', 71.35]]\n```\n\n为了打印结果，我们没有使用\
  \ `collect()` 函数来获取数据。请记住，转换会创建另一个 RDD，因此我们需要 `collect()` 函数来收集数据。但一个动作会直接将数据提取到驱动程序，因此不需要\
  \ `collect()`。所以你可以得出结论，`takeOrdered()` 函数是一个动作。\n\n#### 步骤 4-3-6. 查找后三名学生\n\n我们需要根据平均成绩找出后三名学生。一种方法是按升序对数据进行排序，然后取前三名。但这不是一种有效的方法，所以我们将再次使用\
  \ `takeOrdered()` 函数，但使用不同的 key 参数：\n\n```python\n>>> bottomThreeStudents = secondYearMarks.takeOrdered(num=3,\
  \ key = lambda x :x[2])\n>>> bottomThreeStudents\n```\n\n输出如下：\n\n```python\n[['si5',\
  \ 'year2', 59.485],\n['si6', 'year2', 60.335],\n['si7', 'year2', 61.805]]\n```\n\
  \n#### 步骤 4-3-7. 获取所有平均成绩达到 80% 的学生\n\n既然你理解了 `filter()` 函数，就很容易猜到我们可以通过使用 `filter()`\
  \ 来解决这个问题。我们需要提供一个谓词，如果成绩大于 80，则返回 `True`；否则，返回 `False`。\n\n```python\n>>> moreThan80Marks\
  \ = secondYearMarks.filter(lambda x : x[2] > 80)\n>>> moreThan80Marks.collect()\n\
  ```\n\n输出如下：\n\n```python\n[['si2', 'year2', 80.645]]\n```\n\n可以观察到，只有一名学生（学号为 `si2`）在二年级的平均成绩超过了\
  \ 80%。\n\n## 方案 4-4. 运行集合操作\n\n### 问题\n\n你想对一家研究公司的数据进行集合操作。\n\n### 解决方案\n\nXYZ\
  \ Research 是一家从事多个多元化主题研究的公司。每个研究项目都有一个研究 ID。研究可能一年内完成，也可能需要超过一年的时间。提供了以下数据，显示了三年内进行的研究项目数量：\n\
  \n```\n2001: RIN1, RIN2, RIN3, RIN4, RIN5, RIN6, RIN7\n2002: RIN3, RIN4, RIN7, RIN8,\
  \ RIN9\n2003: RIN4, RIN8, RIN10, RIN11, RIN12\n```\n\n现在我们需要回答以下问题：\n\n- 三年中启动了多少个研究项目？\n\
  - 第一年完成了多少个项目？\n- 前两年完成了多少个项目？\n\n集合是不同元素的集合。PySpark 执行伪集合操作。之所以称为伪集合操作，是因为某些函数不会移除重复元素。\n\
  \n请记住，第一个问题问的不是已完成的项目。三年中启动的研究项目总数就是三年数据的并集。你可以使用 `union()` 函数对两个 RDD 执行并集操作。\n\n\
  在第一年启动而未在第二年启动的项目就是在第一年完成的项目。每个启动的项目都会完成。我们可以使用 `subtract()` 函数来查找所有在第一年完成的项目。\n\
  \n如果我们对第一年和第二年的项目进行并集操作，然后减去第三年的项目，我们就能得到所有在前两年完成的项目。\n\n### 工作原理\n\n让我们一步步解决这个问题。\n\
  \n#### 步骤 4-4-1. 按年份创建研究数据列表\n\n我们首先创建一个列表，列出公司每年从事的所有项目：\n\n```python\n>>> data2001\
  \ = ['RIN1', 'RIN2', 'RIN3', 'RIN4', 'RIN5', 'RIN6', 'RIN7']\n>>> data2002 = ['RIN3',\
  \ 'RIN4', 'RIN7', 'RIN8', 'RIN9']\n>>> data2003 = ['RIN4', 'RIN8', 'RIN10', 'RIN11',\
  \ 'RIN12']\n```\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n`data2001`\
  \ 是 2001 年启动的所有项目的列表。类似地，`data2002` 包含所有从 2001 年延续下来或在 2002 年启动的研究项目。`data2003`\
  \ 数据列表包含公司在 2003 年处理的所有项目。\n\n### 步骤 4-4-2：并行化数据（创建 RDD）\n\n创建列表后，我们需要并行化数据：\n\n\
  ```python\n>>> parData2001 = sc.parallelize(data2001,2)\n>>> parData2002 = sc.parallelize(data2002,2)\n\
  >>> parData2003 = sc.parallelize(data2003,2)\n```\n\n并行化后，我们得到三个 RDD。第一个 RDD 是 `parData2001`，第二个\
  \ RDD 是 `parData2002`，最后一个是 `parData2003`。\n\n### 步骤 4-4-3：查找三年内启动的项目\n\n三年内启动的项目总数可以通过获取这三年的所有数据的并集来确定。RDD\
  \ 的 `union()` 方法接受另一个 RDD 作为输入，并返回合并这两个 RDD 的结果。让我们看看它是如何工作的：\n\n```python\n>>>\
  \ unionOf20012002 = parData2001.union(parData2002)\n>>> unionOf20012002.collect()\n\
  ```\n\n输出如下：\n\n```\n['RIN1', 'RIN2', 'RIN3', 'RIN4',\n'RIN5', 'RIN6', 'RIN7', 'RIN3',\n\
  'RIN4', 'RIN7', 'RIN8', 'RIN9']\n```\n\n我们已经计算了第一年或第二年启动的不同研究项目的并集。我们可以观察到，合并后的数据\
  \ `unionOf20012002` 包含重复值。在集合中不允许有重复值。因此，对 RDD 的集合操作也称为伪集合操作。别担心，我们接下来会移除这些重复项。\n\
  \n为了获取三年内启动的所有研究项目，我们需要获取 `parData2003` 和 `unionOf20012002` 的并集：\n\n```python\n\
  >>> allResearchs = unionOf20012002.union(parData2003)\n>>> allResearchs.collect()\n\
  ```\n\n输出如下：\n\n```\n['RIN1', 'RIN2', 'RIN3', 'RIN4',\n'RIN5', 'RIN6', 'RIN7', 'RIN3',\n\
  'RIN4', 'RIN7', 'RIN8', 'RIN9',\n'RIN4', 'RIN8', 'RIN10', 'RIN11', 'RIN12']\n```\n\
  \n现在我们有了所有三年数据的并集。接下来，我们需要去除重复项。\n\n### 步骤 4-4-4：创建去重数据集\n\n我们将对 RDD `allResearchs`\
  \ 应用 `distinct()` 函数：\n\n```python\n>>> allUniqueResearchs = allResearchs.distinct()\n\
  >>> allUniqueResearchs.collect()\n```\n\n输出如下：\n\n```\n['RIN1', 'RIN12', 'RIN5',\
  \ 'RIN3',\n'RIN4', 'RIN2', 'RIN11', 'RIN7',\n'RIN9', 'RIN6', 'RIN8', 'RIN10']\n\
  ```\n\n我们可以看到，我们拥有了前三年启动的所有研究项目。\n\n### 步骤 4-4-5：计算去重元素数量\n\n现在，通过对 RDD 使用 `count()`\
  \ 函数来计算所有去重研究项目的数量：\n\n```python\n>>> allResearchs.distinct().count()\n```\n\n输出如下：\n\
  \n```\n\n```\n\n**注意**\n\n我们也可以在 PySpark 中运行链式命令。\n\n以下是以链式方式运行的命令：\n\n```python\n\
  >>> parData2001.union(parData2002).union(parData2003).distinct().count()\n```\n\n\
  输出如下：\n\n```\n\n```\n\n### 步骤 4-4-6：查找第一年完成的项目\n\n假设我们有两个集合 A 和 B。从 A 中减去 B 会得到所有属于\
  \ A 但不属于 B 的元素。所以，现在很清楚，为了知道第一年（2001 年）完成的所有项目，我们必须从 2001 年的所有项目中减去 2002 年的项目。\n\
  \n集合的减法可以使用 `subtract()` 函数完成：\n\n```python\n>>> firstYearCompletion = parData2001.subtract(parData2002)\n\
  >>> firstYearCompletion.collect()\n```\n\n输出如下：\n\n```\n['RIN5', 'RIN1', 'RIN6',\
  \ 'RIN2']\n```\n\n我们得到了 2001 年完成的所有项目。2001 年完成了四个项目。\n\n### 步骤 4-4-7：查找前两年完成的项目\n\
  \nRDD 的并集提供了前两年启动的所有项目。获取前两年启动的所有项目后，如果我们再减去第三年运行和启动的项目，我们将得到前两年完成的全部项目。实现如下：\n\n\
  ```python\n>>> unionTwoYears = parData2001.union(parData2002)\n>>> unionTwoYears.subtract(parData2003).collect()\n\
  ```\n\n输出如下：\n\n```\n['RIN1', 'RIN5', 'RIN3', 'RIN3',\n'RIN2', 'RIN7', 'RIN7', 'RIN9',\
  \ 'RIN6']\n```\n\n现在进行减法：\n\n```python\n>>> unionTwoYears.subtract(parData2003).distinct().collect()\n\
  ```\n\n输出如下：\n\n```\n['RIN1', 'RIN5', 'RIN3',\n'RIN2', 'RIN7', 'RIN9', 'RIN6']\n\
  ```\n\n### 步骤 4-4-8：查找 2001 年启动并持续到 2003 年的项目\n\n此步骤需要对 RDD 使用 PySpark 中定义的 `intersection()`\
  \ 方法：\n\n```python\n>>> projectsInTwoYear = parData2001.intersection(parData2002)\n\
  >>> projectsInTwoYear.collect()\n```\n\n输出如下：\n\n```\n['RIN4', 'RIN7', 'RIN3']\n\
  >>> projectsInTwoYear.subtract(parData2003).distinct().collect()\n```\n\n输出如下：\n\
  \n```\n['RIN3', 'RIN7']\n```\n\n## 配方 4-5：计算汇总统计\n\n### 问题\n\n你想计算给定数据的汇总统计量。\n\n\
  ### 解决方案\n\n可再生能源在世界范围内越来越受欢迎。公司 FindEnergy 希望在一个特定位置安装风力发电机。为了风力发电机的高效运行，空气需要某些特性。\n\
  \n数据收集如下表[4-3]所示。\n\n![A430628_1_En_4_Figc_HTML.gif](img/A430628_1_En_4_Figc_HTML.gif)\n\
  \n**表 4-3.** 风速数据\n\n作为一名数据科学家，你想要计算以下量：\n\n*   数据点数量\n*   一天中风速的总和\n*   一天中的平均风速\n\
  *   空气数据的方差\n*   空气数据的样本方差\n*   空气数据的标准差\n*   空气数据的样本标准差\n\nPySpark 提供了许多在 RDD 上汇总数据的函数。RDD\
  \ 中元素的数量可以通过对 RDD 使用 `count()` 函数找到。有两种方法可以求给定 RDD 中所有数据的和。第一种是对 RDD 应用 `sum()`\
  \ 方法。第二种是对 RDD 应用 `reduce()` 函数。\n\n均值表示给定数据的中心点，它也可以用两种方式计算。我们将使用 `mean()` 方法和\
  \ `fold()` 方法来计算均值。\n\n方差表示数据围绕均值的分散程度，可以使用 `variance()` 函数计算。类似地，样本方差可以通过在 RDD\
  \ 上使用 `sampleVariance()` 方法计算。\n\n标准差和样本标准差将分别使用 `stdev()` 和 `sampleStdev()` 方法计算。\n\
  \nPySpark 提供了 `stats()` 方法，它可以一次性地计算所有前述的量。\n\n### 原理\n\n我们将按照本节中的步骤来解决问题。\n\n####\
  \ 步骤 4-5-1：并行化数据\n\n让我们从一个列表中并行化风速数据：\n\n```python\n>>> airVelocityKMPH = [12,13,15,12,11,12,11]\n\
  >>> parVelocityKMPH = sc.parallelize(airVelocityKMPH,2)\n```\n\n`parVelocityKMPH`\
  \ 变量是一个 RDD。\n\n#### 步骤 4-5-2：获取数据点数量\n\n数据点的数量让我们对数据大小有一个概念。我们应用 `count()` 函数来获取\
  \ RDD 中元素的数量：\n\n```python\n>>>countValue =  parVelocityKMPH.count()\n```\n\n输出如下：\n\
  \n```\n\n```\n\n总共有七个数据点。\n\n#### 步骤 4-5-3：求和一天中的风速\n\n让我们使用 `sum()` 方法来求和：\n\n\
  ```python\n>>>sumValue =  parVelocityKMPH.sum()\n```\n\n输出如下：\n\n```\n\n```\n\n\
  #### 步骤 4-5-4：计算平均风速\n\n图[4-5]展示了计算均值的数学公式，其中 x1, x2, ... xn 是 n 个数据点。\n\n![A430628_1_En_4_Fig5_HTML.gif](img/A430628_1_En_4_Fig5_HTML.gif)\n\
  \n**图 4-5.** 计算均值\n\n我们通过在 RDD 上定义的 `mean()` 函数来计算均值：\n\n```python\n>>>meanValue\
  \ =  parVelocityKMPH.mean()\n```\n\n输出如下：\n\n```\n12.285714285714286\n```\n\n####\
  \ 步骤 4-5-5：计算空气数据的方差\n\n\n\n#### 步骤 4-5-6. 计算样本方差\n\n如果我们有数据点 `x1`、`x2`、……、`xn`，那么图\
  \ 4-6 显示的是计算方差的数学公式。我们将使用定义在 `RDD` 上的 `variance()` 函数来计算给定空气数据的方差。\n\n![A430628_1_En_4_Fig6_HTML.gif](img/A430628_1_En_4_Fig6_HTML.gif)\n\
  *图 4-6. 计算方差*\n\n```\n>>> varianceValue = parVelocityKMPH.variance()\n```\n\n输出如下：\n\
  \n```\n1.63265306122449\n```\n\n`variance` 函数计算的是总体方差。为了计算样本方差，我们必须使用定义在 `RDD` 上的\
  \ `sampleVariance()` 函数。\n\n对于数据点 `x1`、`x2`、……、`xn`，样本标准差在图 4-7 中定义。\n\n![A430628_1_En_4_Fig7_HTML.gif](img/A430628_1_En_4_Fig7_HTML.gif)\n\
  *图 4-7. 计算样本方差*\n\n下面这行代码计算样本标准差：\n\n```\n>>> sampleVarianceValue =  parVelocityKMPH.sampleVariance()\n\
  ```\n\n输出如下：\n\n```\n1.904761904761905\n```\n\n#### 步骤 4-5-7. 计算标准差\n\n标准差是方差值的平方根。让我们使用\
  \ `stdev()` 函数来计算标准差：\n\n```\n>>> stdevValue = parVelocityKMPH.stdev()\n```\n\n\
  输出如下：\n\n```\n1.2777531299998799\n```\n\n给定空气速度数据的标准差是 `1.2777531299998799`。\n\n\
  #### 步骤 4-5-8. 计算样本标准差\n\n```\n>>> sampleStdevValue = parVelocityKMPH.sampleStdev()\n\
  ```\n\n输出如下：\n\n```\n1.3801311186847085\n```\n\n#### 步骤 4-5-9. 一步计算所有值\n\n我们可以通过使用\
  \ `stats()` 函数一次性计算汇总统计的所有值。`stats()` 函数返回一个 `StatCounter` 对象。让我们使用 `stats()` 函数来计算空气速度数据的汇总统计：\n\
  \n```\n>>> type(parVelocityKMPH.stats())\n```\n\n输出如下：\n\n```\n<class 'pyspark.rdd.StatCounter'>\n\
  ```\n\n```\n>>> parVelocityKMPH.stats()\n```\n\n输出如下：\n\n```\n(count: 7, mean: 12.2857142857,\
  \ stdev: 1.27775313, max: 15.0, min: 11.0)\n```\n\n我们可以看到 `stats()` 函数是一个动作。它一次性计算一个\
  \ `RDD` 的计数、均值、标准差、最大值和最小值。它返回的结果是一个元组，其中的元素是键/值对。使用 `asDict()` 函数可以将 `stats()`\
  \ 函数的结果转换为字典：\n\n```\n>>> parVelocityKMPH.stats().asDict()\n```\n\n输出如下：\n\n```\n\
  {'count': 7, 'min': 11.0, 'max': 15.0, 'sum': 86.0, 'stdev': 1.3801311186847085,\
  \ 'variance': 1.904761904761905, 'mean': 12.285714285714286}\n```\n\n我们也可以通过使用 `StatCounter`\
  \ 上定义的不同函数来获取单个元素。让我们从获取均值开始。可以使用定义在 `StatCounter` 对象上的 `mean()` 函数来找到均值：\n\n```\n\
  >>> parVelocityKMPH.stats().mean()\n```\n\n输出如下：\n\n```\n12.285714285714286\n```\n\
  \n类似地，我们可以通过分别使用 `count()`、`min()`、`max()` 和 `stdev()` 函数来获取 `RDD` 中的元素数量、最小值、最大值和标准差。让我们先从标准差开始：\n\
  \n```\n>>> parVelocityKMPH.stats().stdev()\n```\n\n输出如下：\n\n```\n1.2777531299998799\n\
  ```\n\n这个命令提供元素的数量：\n\n```\n>>> parVelocityKMPH.stats().count()\n```\n\n输出如下：\n\n\
  ```\n7\n```\n\n接下来，我们找到最小值：\n\n```\n>>> parVelocityKMPH.stats().min()\n```\n\n输出如下：\n\
  \n```\n11.0\n```\n\n然后找到最大值：\n\n```\n>>> parVelocityKMPH.stats().max()\n```\n\n\
  输出如下：\n\n```\n15.0\n```\n\n### 方法 4-6. 在独立集群管理器上启动 PySpark Shell\n\n### 问题\n\n你想使用独立集群管理器启动\
  \ PySpark Shell。\n\n### 解决方案\n\n独立集群管理器提供了一个主/从结构。为了在单台机器上启动独立集群管理器，我们可以使用 `start-all.sh`\
  \ 脚本。我们可以在 `$SPARK_HOME/sbin` 目录下找到这个脚本。在我们的案例中，`$SPARK_HOME` 是 `/allPySpark/spark`。在集群环境中，我们可以在一台机器上运行主脚本来启动主节点，并在另一台不同的从机器上运行从脚本来启动从节点。\n\
  \n我们可以通过使用独立主节点的主节点 URL 来启动 PySpark Shell。独立主节点的 URL 看起来像 `spark://<主节点主机名>:<主节点端口>`。这可以在主节点的日志文件中轻松找到。\n\
  \n### 工作原理\n\n我们必须启动独立主节点和从节点进程。有两种方法可以做到这一点。在 `spark/sbin` 目录下，我们会找到 `start-all.sh`\
  \ 脚本。它将在同一台机器上同时启动主节点和从节点。\n\n另一种启动进程的方法如下：在主节点机器上，使用 `start-master.sh` 脚本来启动主节点；并使用\
  \ `start-slave.sh` 在不同的机器上启动从节点。\n\n#### 步骤 4-6-1. 使用 start-all.sh 脚本启动独立集群管理器\n\
  \n在这一步中，我们将运行 `start-all.sh` 脚本：\n\n```\n[pysparkbook@localhost ∼]$ /allPySpark/spark/sbin/start-all.sh\n\
