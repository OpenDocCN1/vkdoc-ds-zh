  ## 引言\n\n本书将通过问题-解决方案的方法，带你踏上一段有趣的旅程，学习 PySpark 和大数据。每个问题都附有详细、逐步的解答，这将有助于提升你使用\
  \ PySpark 解决大数据问题的思维能力。本书共分为九章，以下是各章的简要介绍：\n\n-   **第 1 章，“大数据、Hadoop 及其他大数据处理框架的时代”**，涵盖了众多大数据处理工具，例如\
  \ Apache Hadoop、Apache Pig、Apache Hive 和 Apache Spark。本章讨论了 Hadoop 的不足之处以及 Spark\
  \ 的演进过程，并解释了作为发布-订阅系统的 Apache Kafka。本章还介绍了 NoSQL 数据库 HBase。\n-   **第 2 章，“安装”**，将带你进入实战战场。你将学习如何安装多种大数据处理工具，如\
  \ Hadoop、Hive、Spark、Apache Mesos 和 Apache HBase。\n-   **第 3 章，“Python 和 NumPy 入门”**，面向\
  \ Python 新手。你将通过问题-解决方案的方式，学习 Python 和 NumPy 的基础知识。本章中的问题均以数据科学为导向。\n-   **第 4 章，“Spark\
  \ 架构与弹性分布式数据集”**，阐述了 Spark 的架构并介绍了弹性分布式数据集。你将学习如何创建 RDD，以及如何在 RDD 上使用数据聚合、数据过滤和集合运算等数据分析算法。\n\
  -   **第 5 章，“键值对的威力：配对 RDD”**，展示了如何创建配对 RDD，以及如何在这些配对 RDD 上执行数据聚合、数据连接和其他算法。\n-\
  \   **第 6 章，“PySpark 中的输入/输出”**，将教你如何从各类文件中读取数据，并将结果保存为 RDD。\n-   **第 7 章，“优化 PySpark\
  \ 与 PySpark Streaming”**，是最重要的章节之一。你将首先优化一个网页排名算法。然后实现一个 k-近邻算法，并通过使用 PySpark 框架提供的广播变量对其进行优化。学习\
  \ PySpark Streaming 最终将引导我们将 Apache Kafka 与 PySpark Streaming 框架集成。\n-   **第 8 章，“PySparkSQL”**，对于使用\
  \ SQL 的读者来说是天堂。但新手也将通过学习 PySparkSQL，使用问题-解决方案的方法，在 DataFrame 上编写类似 SQL 的查询。除了 DataFrame，我们还将使用\
  \ GraphFrames 库实现广度优先搜索和网页排名这两种图算法。\n-   **第 9 章，“PySpark MLlib 与线性回归”**，描述了 PySpark\
  \ 的机器学习库 MLlib。你将看到许多关于 PySpark MLlib 提供的各种数据结构的示例。你还将实现线性回归。本章包含了关于套索回归和岭回归的示例。\n\
