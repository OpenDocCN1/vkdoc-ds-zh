  ```\n\n使用`jps`命令，我们可以查看机器上运行的 worker 和 master 进程：\n\n```\n[pysparkbook@localhost\
  \ ∼]$ jps\n```\n\n输出如下：\n\n```\n4246 Worker\n3977 Master\n4285 Jps\n```\n\n你可能还记得，当我们使用`stop-all.sh`时，脚本会先停止\
  \ worker 进程，再停止 master 进程。我们必须遵循此顺序：先停止 worker 进程，再停止 master 进程。\n\n要停止 worker 进程，请使用`stop-slave.sh`脚本：\n\
  \n```\n[pysparkbook@localhost ∼]$ /allPySpark/spark/sbin/stop-slave.sh\n```\n\n\
  输出如下：\n\n```\nstopping org.apache.spark.deploy.worker.Worker\n```\n\n运行`jps`命令将只显示\
  \ master 进程：\n\n```\n[pysparkbook@localhost ∼]$ jps\n```\n\n输出如下：\n\n```\n4341 Jps\n\
  3977 Master\n```\n\n同样，我们可以使用`stop-master.sh`脚本停止 master 进程：\n\n```\n[pysparkbook@localhost\
  \ ∼]$ /allPySpark/spark/sbin/stop-master.sh\n```\n\n输出如下：\n\n```\nstopping org.apache.spark.deploy.master.Master\n\
  ```\n\n## Recipe 4-7. 在 Mesos 上启动 PySpark Shell\n\n### 问题\n\n你想在 Mesos 集群管理器上启动\
  \ PySpark shell。\n\n### 解决方案\n\nMesos 是另一种集群管理器。Mesos 也遵循类似于独立集群管理器的 master/slave\
  \ 架构。为了启动 Mesos，我们首先必须启动 Mesos master，然后启动 Mesos slave。之后，可以通过 Mesos 上的 master URL\
  \ 启动 PySpark shell。\n\n### 工作原理\n\n我们在第 3 章安装了 Mesos。现在我们必须逐个启动 master 和 slave 进程。启动\
  \ master 和 slave 后，我们需要启动 PySpark shell。以下命令启动 Mesos master 进程：\n\n```\n[pysparkbook@localhost\
  \ ∼]$  mesos-master –work_dir=/allPySpark/mesos/workdir\n```\n\n输出如下：\n\n```\nI0224\
  \ 09:50:57.575908  9839 main.cpp:263] Build: 2016-12-29 00:42:08 by pysparkbook\n\
  I0224 09:50:57.576501  9839 main.cpp:264] Version: 1.1.0\nI0224 09:50:57.582787\
  \  9839 main.cpp:370] Using 'HierarchicalDRF' allocator\n```\n\nslave 进程将在 master\
  \ 进程启动后启动：\n\n```\n[root@localhost binaries]#mesos-slave --master=127.0.0.1:5050\
  \ --work_dir=/allPySpark/mesos/workdir1 --systemd_runtime_directory=/allPySpark/mesos/systemd\n\
  ```\n\n输出如下：\n\n```\nI0224 18:22:25.002970  3797 gc.cpp:55] Scheduling '/allPySpark/mesos/workdirSlave/slaves/dd2c5f22-57f9-416e-a71a-0cc83de8558d-S1/frameworks/dd2c5f22-57f9-416e-a71a-0cc83de8558d-0000/executors/1/runs/a7c3d613-9696-4d42-afe2-a27c5c825e72'\
  \ for gc 6.99998839417778days in the future\nI0224 18:22:25.003083  3797 gc.cpp:55]\
  \ Scheduling\nI0224 18:22:25.003123  3797 gc.cpp:55] Scheduling '/allPySpark/mesos/workdirSlave/slaves/dd2c5f22-57f9-416e-a71a-0cc83de8558d-S1/frameworks/dd2c5f22-57f9-416e-a71a-0cc83de8558d-0000'\
  \ for gc 6.99998839205926days in the future\n```\n\nmaster 和 slave 进程都已启动。现在我们可以使用以下命令启动\
  \ PySpark shell。我们提供 master URL 和一个参数`spark.executor.uri`。`spark.executor.uri`参数告诉\
  \ Mesos 获取 PySpark assembly 的位置。\n\n```\n[pysparkbook@localhost binaries]$ /allPySpark/spark/bin/pyspark\
  \ --master mesos://127.0.0.1:5050 --conf spark.executor.uri=/home/pysparkbook/binaries/spark-2.0.0-bin-hadoop2.6.tgz\n\
  ```\n\n在 Mesos 上运行 PySpark 后，我们可以运行`jps`命令来查看 Java 进程：\n\n```\n[pysparkbook@localhost\
  \ binaries]$jps\n```\n\n输出如下：\n\n```\n4174 SparkSubmit\n4287 CoarseGrainedExecutorBackend\n\
  ```\n\n## 5. 键值对的威力：配对 RDD\n\n键/值对对于以并行方式高效解决许多问题非常有用。Apache Mahout（一个最初基于 Apache\
  \ Hadoop 开发的机器学习库）通过使用 MapReduce 键/值对架构，实现了分类、聚类和协同过滤等领域的许多机器学习算法。在本章中，你将通过实践菜谱来培养解决多学科中大数据问题的技能。\n\
  \n本章涵盖以下菜谱：\n\n*   Recipe 5-1. 创建配对 RDD\n*   Recipe 5-2. 执行数据聚合\n*   Recipe 5-3.\
  \ 连接数据\n*   Recipe 5-4. 计算 PageRank\n\n## Recipe 5-1. 创建配对 RDD\n\n### 问题\n\n你想创建一个配对\
  \ RDD。\n\n### 解决方案\n\n你有一个 RDD，`RDD1`。`RDD1`的元素有`b`、`d`、`m`、`t`、`e`和`u`。你想创建一个配对\
  \ RDD，其中键是单个 RDD 的元素，如果元素是辅音，则值为 0；如果是元音，则值为 1。图 5-1 清晰地描述了这些要求。\n\n![A430628_1_En_5_Fig1_HTML.gif](img/A430628_1_En_5_Fig1_HTML.gif)\n\
  \n**图 5-1.** 创建配对 RDD\n\n创建配对 RDD 的方法有很多种。一种方法是直接从文件读取数据。我们将在后续章节中探讨这种方法。另一种创建配对\
  \ RDD 的方法是使用`map()`方法，你将在本菜谱中学习到。\n\n### 工作原理\n\n在本节中，你将按照几个步骤来达到解决方案。\n\n**步骤 5-1-1.\
  \ 创建包含单个元素的 RDD**\n\n让我们从给定数据创建一个 RDD 开始：\n\n```\n>>> pythonList  =  ['b', 'd',\
  \ 'm', 't', 'e', 'u']\n>>> RDD1 = sc.parallelize(pythonList,2)\n>>>RDD1.collect()\n\
  ```\n\n输出如下：\n\n```\n['b', 'd', 'm', 't', 'e', 'u']\n```\n\n我们创建了一个名为`RDD1`的 RDD。`RDD1`的元素有`b`、`d`、`m`、`t`、`e`和`u`。这是一个字母的\
  \ RDD。可以看出，元素`b`、`d`、`m`和`t`是辅音。`RDD1`的其他元素，`e`和`u`，是元音。\n\n**步骤 5-1-2. 编写一个 Python\
  \ 方法来检查辅音**\n\n我们将定义一个名为`vowelCheckFunction()`的 Python 函数。此函数将接收一个字母作为输入，如果输入是辅音则返回\
  \ 1，否则返回 0。让我们实现这个函数：\n\n```\n>>> def vowelCheckFunction( data) :\n...     if data\
  \ in ['a','e','i','o','u']:\n...        return 1\n...     else :\n...        return\
  \ 0\n```\n\n可以看出，我们的 Python 函数`vowelCheckFunction`将接收一个输入数据。在本例中，我们将发送一个字母。在函数内部，我们检查数据是否是元音。如果我们的`if`块逻辑表达式结果为`True`，函数将返回\
  \ 1；否则返回 0。\n\n没有经过测试，我们不应该信任`vowelCheckFunction`。所以，让我们从元音输入开始：\n\n```\n>>> vowelCheckFunction('a')\n\
  ```\n\n输出如下：\n\n```\n1\n```\n\n对于元音输入，我们得到输出 1。我们的 Python 函数`vowelCheckFunction`符合我们对元音的预期。这很好，但我们也测试一下辅音。这次我们发送`b`，一个辅音，作为输入：\n\
  \n```\n>>> vowelCheckFunction('b')\n```\n\n输出如下：\n\n```\n0\n```\n\n我们已经测试了我们的函数。对于辅音和元音，它都能按预期工作。我们可以信赖我们开发的这个函数。\n\
  \n**步骤 5-1-3. 创建配对 RDD**\n\n\n\n我们可以通过使用 `map()` 函数来创建所需的 RDD。我们需要创建一个配对 RDD：键将是\
  \ `RDD1` 中的元素，值为 0（表示辅音）或 1（表示元音）：\n\n```\n>>> RDD2 = RDD1.map( lambda data : (data,\
  \ vowelCheckFunction(data)))\n>>> RDD2.collect()\n```\n\n输出结果如下：\n\n```\n[('b',\
  \ 0),\n('d', 0),\n('m', 0),\n('t', 0),\n('e', 1),\n('u', 1)]\n```\n\n## 步骤 5-1-4.\
  \ 从配对 RDD 中提取键\n\n`keys()` 函数可用于提取所有键：\n\n```\n>>> RDD2Keys = RDD2.keys()\n>>> RDD2Keys.collect()\n\
  ```\n\n输出结果如下：\n\n```\n['b', 'd', 'm', 't', 'e', 'u']\n```\n\n我们可以看到 `keys()` 函数执行了一次转换。因此，`keys()`\
  \ 返回一个 RDD，需要调用 `collect()` 函数才能将数据传递到驱动程序。\n\n## 步骤 5-1-5. 从配对 RDD 中提取值\n\n与 `keys()`\
  \ 函数类似，`values()` 函数将从配对 RDD 中提取所有值。它同样执行一次转换：\n\n```\n>>> RDD2Values = RDD2.values()\n\
  >>> RDD2Values.collect()\n```\n\n输出结果如下：\n\n```\n[0, 0, 0, 0, 1, 1]\n```\n\n## 方案\
  \ 5-2. 数据聚合\n\n### 问题\n\n你希望对数据进行聚合。\n\n### 解决方案\n\n你需要对某灯泡制造商的数据进行聚合，如下表 5-1 所示。\n\
  \n![A430628_1_En_5_Figa_HTML.gif](img/A430628_1_En_5_Figa_HTML.gif)\n\n**表 5-1.**\
  \ 灯丝数据\n\nYP 公司生产两种类型的灯丝：filamentA 和 filamentB。这两种灯丝均可用于制造 100W 和 200W 的电灯泡。表 5-1\
  \ 显示了每种灯泡的预期寿命。\n\n你需要计算以下指标：\n\n* 每种灯丝类型灯泡的平均寿命（小时）\n* 每种功率等级灯泡的平均寿命（小时）\n* 基于灯丝类型和功率两者的平均寿命（小时）\n\
  \n我们在数据科学问题中通常会遇到数据聚合的需求。为了获取聚合数据，我们可以使用许多 PySpark 函数。\n\n在本方案中，我们将使用 `reduceByKey()`\
  \ 函数通过键来计算平均值。计算复杂键的平均值需要先创建这些复杂键。复杂键可以通过使用 `map()` 函数来创建。\n\n### 工作原理\n\n我们从创建\
  \ RDD 开始。\n\n#### 步骤 5-2-1. 创建包含单个元素的 RDD\n\n```\n>>> filDataSingle = [['filamentA','100W',605],\n\
  ...                  ['filamentB','100W',683],\n...                  ['filamentB','100W',691],\n\
  ...                  ['filamentB','200W',561],\n...                  ['filamentA','200W',530],\n\
  ...                  ['filamentA','100W',619],\n...                  ['filamentB','100W',686],\n\
  ...                  ['filamentB','200W',600],\n...                  ['filamentB','100W',696],\n\
  ...                  ['filamentA','200W',579],\n...                  ['filamentA','200W',520],\n\
  ...                  ['filamentA','100W',622],\n...                  ['filamentA','100W',668],\n\
  ...                  ['filamentB','200W',569],\n...                  ['filamentB','200W',555],\n\
  ...                  ['filamentA','200W',541]]\n>>> filDataSingleRDD = sc.parallelize(filDataSingle,\
  \ 2)\n>>> filDataSingleRDD.take(3)\n```\n\n输出结果如下：\n\n```\n[['filamentA', '100W',\
  \ 605],\n['filamentB', '100W', 683],\n['filamentB', '100W', 691]]\n```\n\n这里我们首先创建了一个名为\
  \ `filDataSingle` 的嵌套 Python 列表，用于存储灯丝数据。然后我们创建了 RDD `filDataSingleRDD`，并将数据分为两部分。在\
  \ `filDataSingleRDD` 上调用 `take()` 函数的输出结果清晰地表明，该 RDD 的元素是一个列表。\n\n#### 步骤 5-2-2.\
  \ 创建配对 RDD\n\n首先我们需要根据灯丝类型计算灯泡的平均寿命。更好的做法是创建一个配对 RDD，其中键为灯丝类型，值为寿命（小时）。那么让我们创建所需的配对\
  \ RDD 并进行查看：\n\n```\n>>> filDataPairedRDD1 = filDataSingleRDD.map(lambda x : (x[0],\
  \ x[2]))\n>>> filDataPairedRDD1.take(4)\n```\n\n输出结果如下：\n\n\n\n\n```python\n[('filamentA',\
  \ 605),\n('filamentB', 683),\n('filamentB', 691),\n('filamentB', 561)]\n```\n\n\
  我们创建了一个配对 RDD `filDataPairedRDD1`，使用了定义在 RDD 上的 `map()` 函数。配对 RDD `filDataPairedRDD1`\
  \ 以灯丝类型为键，以寿命（小时）为值。\n\n**步骤 5-2-3：根据灯丝类型计算平均寿命**\n\n现在我们有了所需的配对 RDD。但这足够了吗？不。要计算平均值，我们需要总和与计数。我们必须向配对\
  \ RDD 中添加一个额外的 1，这样我们才能得到总和与计数。现在让我们在每个 RDD 元素中添加一个额外的 1：\n\n```python\n>>> filDataPairedRDD11\
  \ = filDataPairedRDD1.map(lambda x : (x[0], [x[1], 1]))\n>>> filDataPairedRDD11.take(4)\n\
  ```\n\n输出如下：\n\n```python\n[('filamentA', [605, 1]),\n('filamentB', [683, 1]),\n\
  ('filamentB', [691, 1]),\n('filamentB', [561, 1])]\n```\n\n`filDataPairedRDD11`\
  \ 是一个配对 RDD。`filDataPairedRDD11` 的值以列表形式呈现；第一个元素是灯泡的寿命（小时），第二个元素就是 1。\n\n现在我们必须计算每种灯丝类型的寿命值的总和以及计数值，这样我们才能计算平均值。许多\
  \ PySpark 函数都可以完成这项工作，但这里我们将使用配对 RDD 的 `reduceByKey()` 函数。\n\n`reduceByKey()` 函数按键应用聚合操作。它接受一个聚合函数作为输入，并在每个\
  \ RDD 键的值上应用该函数。\n\n让我们根据灯丝类型计算灯泡总寿命小时数的总和，以及每种灯丝类型的元素计数：\n\n```python\n>>> filDataSumandCount\
  \ = filDataPairedRDD11.reduceByKey(lambda l1,l2 : [l1[0] + l2[0], l1[1]+l2[1]])\n\
  >>> filDataSumandCount.collect()\n```\n\n输出如下：\n\n```python\n[('filamentA', [4684,\
  \ 8]),\n('filamentB', [5041, 8])]\n```\n\n我们正在将 `reduceByKey()` 函数应用于我们的配对 RDD `filDataPairedRDD11`。为了理解\
  \ `reduceByKey()` 的工作原理，让我们看看我们的配对 RDD 是如何分布的。从 RDD 中的元素数量开始：`filDataPairedRDD11`\
  \ 的五个元素：\n\n```python\n>>> filDataPairedRDD11.count()\n```\n\n输出如下：\n\n```python\n\
  \n```\n\n我们的配对 RDD 有 16 个元素。现在让我们看看我们的数据有多少个分区：\n\n```python\n>>> filDataPairedRDD11.getNumPartitions()\n\
  ```\n\n输出如下：\n\n```python\n\n```\n\n很明显数据已被分布到两个部分。PySpark 会尝试将数据均匀分布到执行器，因此它将八个数据点分配给每个执行器。现在让我们从\
  \ RDD 中取出五个数据点，看看这些数据是什么样的：\n\n```python\n>>> filDataPairedRDD11.take(5)\n```\n\n\
  输出如下：\n\n```python\n[('filamentA', [605, 1]),\n('filamentB', [683, 1]),\n('filamentB',\
  \ [691, 1]),\n('filamentB', [561, 1]),\n('filamentA', [530, 1])]\n```\n\n我们可以看到\
  \ `filDataPairedRDD11` RDD 的第一个和第五个元素的键是 `filamentA`。因此，对于灯丝类型 `filamentA`，`reduceByKey()`\
  \ 函数中的第一个 `l1` 和 `l2` 将分别是 `[605, 1]` 和 `[530, 1]`。\n\n```python\n>>> filDataSumandCount.collect()\n\
  ```\n\n输出如下：\n\n```python\n[('filamentA', [4684, 8]),\n('filamentB', [5041, 8])]\n\
  ```\n\n最后，我们得到了基于灯丝类型的灯泡寿命小时数的总和以及计数。下一步是将总和除以计数以得到平均值。让我们这样做：\n\n```python\n>>>\
  \ filDataMeanandCount = filDataSumandCount.map( lambda l : [l[0],float(l[1][0])/l[1][1],l[1][1]])\n\
  >>> filDataMeanandCount.collect()\n```\n\n输出如下：\n\n```python\n[['filamentA', 585.5,\
  \ 8],\n['filamentB', 630.125, 8]]\n```\n\n最后，我们得到了基于灯丝类型所需的平均值。filamentA 的平均寿命是\
  \ 585.5 小时，filamentB 的平均寿命是 630.125 小时。我们可以推断出 filamentB 的寿命比 filamentA 长。\n\n**步骤\
  \ 5-2-4：根据灯泡功率计算平均寿命**\n\n首先，我们将从创建我们的配对 RDD 开始。键将是灯泡功率，值将是寿命（小时）：\n\n\n\n```python\n\
  >>> filDataPairedRDD2 = filDataSingleRDD.map(lambda x : (x[1], x[2]))\n>>> filDataPairedRDD2.take(4)\n\
  ```\n\n以下是输出结果：\n\n```\n[('100W', 605),\n('100W', 683),\n('100W', 691),\n('200W',\
  \ 561)]\n```\n\n我们已经创建了一个配对 RDD `filDataPairedRDD2`，其中每个元素都是一个键值对：灯泡功率及其对应的寿命小时数。\n\
  \n```python\n>>> fillDataPairedRDD22 = filDataPairedRDD2.map( lambda x : (x[0],[x[1],1]))\n\
  >>> fillDataPairedRDD22.take(4)\n```\n\n以下是输出结果：\n\n```\n[('100W', [605, 1]),\n\
  ('100W', [683, 1]),\n('100W', [691, 1]),\n('200W', [561, 1])]\n```\n\n现在我们在 RDD\
  \ 的值部分中包含了`1`。因此，每个值都是一个包含寿命小时数和`1`的列表。\n\n```python\n>>> powerSumandCount = fillDataPairedRDD22.reduceByKey(lambda\
  \ l1,l2 : [l1[0]+l2[0], l1[1]+l2[1]])\n>>> powerSumandCount.collect()\n```\n\n以下是输出结果：\n\
  \n```\n[('100W', [5270, 8]),\n('200W', [4455, 8])]\n```\n\n我们计算了不同灯泡功率下的总寿命小时数之和以及计数，并以灯泡功率作为键。\n\
  \n```python\n>>> meanandCountPowerWise =powerSumandCount.map(lambda val : [val[0],[float(val[1][0])/val[1][1],val[1][1]]])\n\
  >>> meanandCountPowerWise.collect()\n```\n\n以下是输出结果：\n\n```\n[['100W', [658.75,\
  \ 8]], ['200W', [556.875, 8]]]\n```\n\n在最后一步，我们计算了平均值和计数。从结果可以推断，100W 灯泡的平均寿命长于\
  \ 200W 灯泡。\n\n## 步骤 5-2-5. 基于灯丝类型和功率计算平均寿命\n\n要完成练习的这一部分，我们需要一个键是复合类型的配对 RDD。你可能想知道什么是复合键。复合键包含不止一种类型。在本例中，我们的复合键将同时包含灯丝类型和灯泡功率类型。让我们开始创建具有复合键类型的配对\
  \ RDD：\n\n```python\n>>> filDataSingleRDD.take(4)\n```\n\n以下是输出结果：\n\n```\n[['filamentA',\
  \ '100W', 605],\n['filamentB', '100W', 683],\n['filamentB', '100W', 691],\n['filamentB',\
  \ '200W', 561]]\n>>> filDataComplexKeyData = filDataSingleRDD.map( lambda val :\
  \ [(val[0], val[1]),val[2]])\n>>> filDataComplexKeyData.take(4)\n```\n\n以下是输出结果：\n\
  \n```\n[[('filamentA', '100W'), 605],\n[('filamentB', '100W'), 683],\n[('filamentB',\
  \ '100W'), 691],\n[('filamentB', '200W'), 561]]\n```\n\n我们已经创建了一个名为 `filDataComplexKeyData`\
  \ 的配对 RDD。可以很容易地观察到它使用了复合键。这些键是灯丝类型和灯泡功率的组合。练习的其余部分将按照上一步的方式进行。在下面的代码中，我们将在值中添加一个额外的\
  \ `1`：\n\n```python\n>>> filDataComplexKeyData1 = filDataComplexKeyData.map(lambda\
  \ val : [val[0], [val[1],1]])\n>>> filDataComplexKeyData1.take(4)\n```\n\n以下是输出结果：\n\
  \n```\n[[('filamentA', '100W'), [605, 1]],\n[('filamentB', '100W'), [683, 1]],\n\
  [('filamentB', '100W'), [691, 1]],\n[('filamentB', '200W'), [561, 1]]]\n```\n\n\
  我们已经创建了所需的配对 RDD `filDataComplexKeyData1`。现在我们可以应用 `reduceByKey()` 函数，基于复合键来获取总和与计数：\n\
  \n```python\n>>> filDataComplexKeySumCount = filDataComplexKeyData1.reduceByKey(lambda\
  \ l1,l2 : [l1[0]+l2[0], l1[1]+l2[1]])\n>>> filDataComplexKeySumCount.collect()\n\
  ```\n\n以下是输出结果：\n\n```\n[(('filamentA', '100W'), [2514, 4]),\n(('filamentB', '200W'),\
  \ [2285, 4]),\n(('filamentB', '100W'), [2756, 4]),\n(('filamentA', '200W'), [2170,\
  \ 4])]\n```\n\n得到总和后，可以按如下方式计算平均值：\n\n```python\n>>> filDataComplexKeyMeanCount\
  \ = filDataComplexKeySumCount.map(lambda val : [val[0],[float(val[1][0])/val[1][1],val[1][1]]])\n\
  >>> filDataComplexKeyMeanCount.collect()\n[[('filamentA', '100W'), [628.5, 4]],\n\
  [('filamentB', '200W'), [571.25, 4]],\n[('filamentB', '100W'), [689.0, 4]],\n[('filamentA',\
  \ '200W'), [542.5, 4]]]\n```\n\n最后，我们计算了平均值和计数值。\n\n> **注意**  \n> 以下是一个关于使用 `reduceByKey()`\
  \ 的优秀教程：  \n> [`stackoverflow.com/questions/30145329/reducebykey-how-does-it-work-internally`](http://stackoverflow.com/questions/30145329/reducebykey-how-does-it-work-internally)。\n\
  \n## 配方 5-3. 数据连接\n\n\n\n### 问题\n\n你需要对数据进行连接。\n\n### 解决方案\n\n我们有两个表：一个 `Students`\
  \ 表（表 5-2 ）和一个 `Subjects` 表（表 5-3 ）。\n\n![A430628_1_En_5_Figc_HTML.gif](img/A430628_1_En_5_Figc_HTML.gif)\n\
  \n表 5-3. `Subjects`\n\n![A430628_1_En_5_Figb_HTML.gif](img/A430628_1_En_5_Figb_HTML.gif)\n\
  \n表 5-2. `Students`\n\n你想在 `Students` 和 `Subjects` 表上执行以下操作：\n\n- 内连接\n- 左外连接\n\
  - 右外连接\n- 全外连接\n\n连接数据表是数据预处理中不可或缺的一部分。在本节中，我们将执行四种类型的数据连接。\n\n内连接返回两个表中所有共同的键，并丢弃不共有的键元素。在\
  \ PySpark 中，内连接通过 RDD 上定义的 `join()` 方法完成。\n\n左外连接包含左表中的所有键，并排除右表中的非共有键。在 PySpark\
  \ 中，可以使用 RDD 上定义的 `leftOuterJoin()` 函数执行左外连接。\n\n另一种重要的连接类型是右外连接。在右外连接中，第二个表的每个键都会被包含，但第一个表中只有那些两个表共有的键会被包含。我们可以通过\
  \ PySpark 中的 `rightOuterJoin()` 函数进行右外连接。\n\n如果你想包含两个表中的所有键，请使用全外连接。它可以通过 `fullOuterJoin()`\
  \ 执行。\n\n### 工作原理\n\n我们将按照本节的步骤处理连接操作。\n\n#### 步骤 5-3-1. 创建嵌套列表\n\n让我们从创建 `Students`\
  \ 表数据的嵌套列表开始：\n\n```\n>>> studentData = [['si1','Robin','M'],\n...             \
  \   ['si2','Maria','F'],\n...                ['si3','Julie','F'],\n...         \
  \       ['si4','Bob',  'M'],\n...                ['si6','William','M']]\n```\n\n\
  创建完 `Students` 表数据后，下一步是创建 `Subjects` 表数据的嵌套列表：\n\n```\n>>> subjectsData = [['si1','Python'],\n\
  ...                 ['si3','Java'],\n...                 ['si1','Java'],\n...  \
  \               ['si2','Python'],\n...                 ['si3','Ruby'],\n...    \
  \             ['si4','C++'],\n...                 ['si5','C'],\n...            \
  \     ['si4','Python'],\n...                 ['si2','Java']]\n```\n\n我们已经从 `Students`\
  \ 表和 `Subjects` 表创建了嵌套列表。\n\n#### 步骤 5-3-2. 创建 `Students` 和 `Subjects` 的配对 RDD\n\
  \n在创建配对 RDD 之前，我们首先必须创建一个单一的 RDD。让我们创建 `studentRDD`：\n\n```\n>>> studentRDD = sc.parallelize(studentData,\
  \ 2)\n>>> studentRDD.take(4)\n```\n\n输出如下：\n\n```\n[['si1', 'Robin', 'M'],\n['si2',\
  \ 'Maria', 'F'],\n['si3', 'Julie', 'F'],\n['si4', 'Bob', 'M']]\n```\n\n我们可以看到 `studentRDD`\
  \ RDD 的每个元素都是一个列表，每个列表有三个元素。现在我们必须将其转换为配对 RDD：\n\n```\n>>> studentPairedRDD = studentRDD.map(lambda\
  \ val : (val[0],[val[1],val[2]]))\n>>> studentPairedRDD.take(4)\n```\n\n输出如下：\n\n\
  ```\n[('si1', ['Robin', 'M']),\n('si2', ['Maria', 'F']),\n('si3', ['Julie', 'F']),\n\
  ('si4', ['Bob', 'M'])]\n```\n\n配对 RDD `studentPairedRDD` 以学生 ID 作为键。现在我们必须为科目数据创建一个配对\
  \ RDD：\n\n```\n>>> subjectsPairedRDD = sc.parallelize(subjectsData, 2)\n>>> subjectsPairedRDD.take(4)\n\
  ```\n\n输出如下：\n\n```\n[['si1', 'Python'],\n['si3', 'Java'],\n['si1', 'Java'],\n['si2',\
  \ 'Python']]\n```\n\n我们不需要做任何额外的工作来创建科目数据的配对 RDD。\n\n#### 步骤 5-3-3. 执行内连接\n\n我们知道，在\
  \ PySpark 中内连接是通过使用 `join()` 函数完成的。我们需要将此函数应用于配对 RDD `studentPairedRDD`，并将 `subjectsPairedRDD`\
  \ 作为参数提供给 `join()` 函数：\n\n```\n>>> studenSubjectsInnerJoin = studentPairedRDD.join(subjectsPairedRDD)\n\
  >>> studenSubjectsInnerJoin.collect()\n```\n\n输出如下：\n\n```\n[('si3', (['Julie',\
  \ 'F'], 'Java')),\n('si3', (['Julie', 'F'], 'Ruby')),\n('si2', (['Maria', 'F'],\
  \ 'Python')),\n('si2', (['Maria', 'F'], 'Java')),\n('si1', (['Robin', 'M'], 'Python')),\n\
  ('si1', (['Robin', 'M'], 'Java')),\n('si4', (['Bob', 'M'], 'C++')),\n('si4', (['Bob',\
  \ 'M'], 'Python'))]\n```\n\n分析此内连接的输出可以发现，键部分仅包含 `Students` 和 `Subjects` 表中共同的键；这些键出现在连接后的表中。两个表共有的键之外的其他键不会出现在连接后的表中。\n\
  \n#### 步骤 5-3-4. 执行左外连接\n\n左外连接可以通过使用 `leftOuterJoin()` 函数执行：\n\n```\n>>> studentSubjectsleftOuterJoin\
  \ = studentPairedRDD.leftOuterJoin(subjectsPairedRDD)\n>>> studentSubjectsleftOuterJoin.collect()\n\
  ```\n\n输出如下：\n\n```\n[('si3', (['Julie', 'F'], 'Java')),\n('si3', (['Julie', 'F'],\
  \ 'Ruby')),\n('si2', (['Maria', 'F'], 'Python')),\n('si2', (['Maria', 'F'], 'Java')),\n\
  ('si6', (['William', 'M'], None)),\n('si1', (['Robin', 'M'], 'Python')),\n('si1',\
  \ (['Robin', 'M'], 'Java')),\n('si4', (['Bob', 'M'], 'C++')),\n('si4', (['Bob',\
  \ 'M'], 'Python'))]\n```\n\n学生 ID `si6` 存在于 `Students` 表中，但不在 `Subjects` 表中。因此，左外连接将\
  \ `si6` 包含在连接后的表中。由于 `si6` 在 `Subjects` 表中没有对应项，其科目位置显示为 `None`。\n\n#### 步骤 5-3-5.\
  \ 执行右外连接\n\n在 `Students` 和 `Subjects` 表上的右外连接可以通过使用 `rightOuterJoin()` 函数执行：\n\n\
  ```\n>>> studentSubjectsrightOuterJoin = studentPairedRDD.rightOuterJoin(subjectsPairedRDD)\n\
  >>> studentSubjectsrightOuterJoin.collect()\n```\n\n输出如下：\n\n```\n[('si3', (['Julie',\
  \ 'F'], 'Java')),\n('si3', (['Julie', 'F'], 'Ruby')),\n('si2', (['Maria', 'F'],\
  \ 'Python')),\n('si2', (['Maria', 'F'], 'Java')),\n('si1', (['Robin', 'M'], 'Python')),\n\
  ('si1', (['Robin', 'M'], 'Java')),\n('si5', (None, 'C')),\n('si4', (['Bob', 'M'],\
  \ 'C++')),\n('si4', (['Bob', 'M'], 'Python'))]\n```\n\n学生 ID `si5` 仅存在于 `Subjects`\
  \ 表中；它不属于 `Students` 表。因此，它出现在连接后的表中。\n\n#### 步骤 5-3-6. 执行全外连接\n\n现在让我们执行全外连接。在全外连接中，两个表的键都会被包含：\n\
  \n```\n>>> studentSubjectsfullOuterJoin = studentPairedRDD.fullOuterJoin(subjectsPairedRDD)\n\
  >>> studentSubjectsfullOuterJoin.collect()\n```\n\n输出如下：\n\n```\n[('si3', (['Julie',\
  \ 'F'], 'Java')),\n('si3', (['Julie', 'F'], 'Ruby')),\n('si2', (['Maria', 'F'],\
  \ 'Python')),\n('si2', (['Maria', 'F'], 'Java')),\n('si6', (['William', 'M'], None)),\n\
  ('si1', (['Robin', 'M'], 'Python')),\n('si1', (['Robin', 'M'], 'Java')),\n('si5',\
  \ (None, 'C')),\n('si4', (['Bob', 'M'], 'C++')),\n('si4', (['Bob', 'M'], 'Python'))]\n\
  ```\n\n在连接后的表中，两个表的键都被包含。学生 ID `si6` 仅属于 `Students` 数据，但它出现在连接后的表中。同样，学生 ID `si5`\
  \ 仅属于 `Subjects` 表，但它也出现在我们的连接后的表中。\n\n"
- '# 配方 5-4. 计算页面排名


  ### 问题


  你想计算图 5-2 中所示网页系统的页面排名。


  ![A430628_1_En_5_Fig2_HTML.gif](img/A430628_1_En_5_Fig2_HTML.gif)


  图 5-2. 一个网页系统


  我们的系统中有四个网页（`a`、`b`、`c` 和 `d`）。网页 `a` 有指向页面 `b`、`c` 和 `d` 的出站链接。类似地，页面 `b` 有指向页面
  `d` 和 `c` 的出站链接。网页 `c` 有指向页面 `b` 的出站链接，页面 `d` 有指向页面 `a` 和 `c` 的出站链接。


  ### 解决方案


  页面排名算法由谢尔盖·布林和拉里·佩奇开发。在算法名称中，页面代表拉里·佩奇。页面排名算法的开发者后来创立了谷歌。这是一种迭代算法。


  特定网页的页面排名表示其在网页群组中的相对重要程度。页面排名越高，它在搜索结果列表中的出现位置就越靠上。




  '
- "# 页面排名\n\n一个页面的重要性，由所有指向该页面的出站链接所在网页的重要性共同决定。例如，假设网页 `X` 的相对重要性非常高。网页 `X` 有一个指向网页\
  \ `Y` 的出站链接；因此，网页 `Y` 也会具有较高的重要性。\n\n## 页面排名算法总结\n\n我们来总结一下页面排名算法：\n\n1.  将每个页面的排名初始化为\
  \ 1 或某个任意数值。\n2.  对于 `someSequence` 中的 `i`，执行以下操作：\n    1.  计算每个入站页面贡献的分数。\n   \
  \ 2.  计算所有贡献分数之和。\n    3.  按如下公式计算更新后的页面排名：\n\n    ```\n    更新后的页面排名 = 1 – s + s\
  \ × 贡献分数之和\n    ```\n\n## 示例\n\n让我给你展示一个例子。假设 `PR(a)`、`PR(b)`、`PR(c)` 和 `PR(d)`\
  \ 分别是页面 `a`、`b`、`c` 和 `d` 的页面排名。页面 `d` 有两个入站链接：第一个来自页面 `a`，第二个来自页面 `b`。\n\n现在我们需要知道一个网页对页面排名的贡献是如何计算的。其对页面排名的贡献由以下公式给出：\n\
  \n```\n对某页面的贡献 = 贡献页面的页面排名 / 贡献页面的总出站链接数\n```\n\n在我们的例子中，网页 `a` 有三个出站链接：第一个指向页面\
  \ `b`，第二个指向页面 `c`，最后一个指向页面 `d`。因此，页面 `a` 对页面 `d` 页面排名的贡献是 `PR(a) / 3`。现在我们需要计算页面\
  \ `b` 对页面 `d` 的贡献。页面 `b` 有两个出站链接：第一个指向页面 `c`，第二个指向页面 `d`。因此，页面 `b` 的贡献是 `PR(b) /\
  \ 2`。\n\n所以，页面 `d` 的页面排名将按如下方式更新，其中 `s` 称为阻尼系数：\n\n```\nPR(d) = 1 – s + s × (PR(a)/3\
  \ + PR(b)/2)\n```\n\n**注意：** 如需了解更多关于页面排名的信息，请访问维基百科 [`https://en.wikipedia.org/wiki/PageRank`](https://en.wikipedia.org/wiki/PageRank)。\n\
  \n### 工作原理\n\n请按照本节中的步骤来使用页面排名。\n\n### 第 5-4-1 步：创建包含出站链接的网页嵌套列表并初始化排名\n\n我们已经创建了一个网页及其出站链接的嵌套列表。现在我们需要初始化所有页面的页面排名。我们将它们初始化为\
  \ 1：\n\n```\n>>> pageLinks =  [['a', ['b','c','d']],\n['c', ['b']],\n...       \
  \                      ['b', ['d','c']],\n...                             ['d',\
  \ ['a','c']]]\n```\n\n```\n>>> pageRanks =  [['a',1],\n...               ['c',1],\n\
  ...               ['b',1],\n...               ['d',1]]\n```\n\n为嵌套列表创建排名后，我们需要定义运行页面排名的迭代次数。\n\
  \n### 第 5-4-2 步：编写一个计算贡献的函数\n\n我们将编写一个函数，它接收两个参数。函数的第一个参数是网页 URI 列表，这些 URI 提供了指向其他网页的出站链接。第二个参数是通过第一个参数中的出站链接访问到的网页的排名。该函数将返回对第一个参数中所有网页的贡献：\n\
  \n```\n>>> def rankContribution(uris, rank):\n...     numberOfUris = len(uris)\n\
  ...     rankContribution = float(rank) / numberOfUris\n...     newrank =[]\n...\
  \     for uri in uris:\n...       newrank.append((uri, rankContribution))\n... \
  \    return newrank\n```\n\n这段代码非常清晰。我们的函数 `rankContribution()` 将返回 URI 列表（第一个变量）对页面排名的贡献。该函数首先计算列表\
  \ `URIs` 中元素的数量；然后计算对给定 URIs 的排名贡献。最后，对于每个 URI，返回其贡献的排名。\n\n### 第 5-4-3 步：创建配对 RDD\n\
  \n首先，让我们创建链接数据的配对 RDD：\n\n```\n>>> pageLinksRDD  = sc.parallelize(pageLinks, 2)\n\
  >>> pageLinksRDD.collect()\n```\n\n输出如下：\n\n```\n[['a', ['b', 'c', 'd']],\n['c',\
  \ ['b']],\n['b', ['d', 'c']],\n['d', ['a', 'c']]]\n```\n\n然后，我们创建排名数据的配对 RDD：\n\n\
  ```\n>>> pageRanksRDD  = sc.parallelize(pageRanks, 2)\n>>> pageRanksRDD.collect()\n\
  ```\n\n输出如下：\n\n```\n[['a', 1],\n['c', 1],\n['b', 1],\n['d', 1]]\n```\n\n### 第 5-4-4\
  \ 步：创建更新页面排名的循环\n\n现在是时候编写最终循环来更新每个页面的页面排名了：\n\n```\n>>>numIter = 20\n>>>s = 0.85\n\
  ```\n\n我们定义了迭代次数和阻尼系数 `s`。\n\n```\n>>> for i in range(numIter):\n...     linksRank\
  \ = pageLinksRDD.join(pageRanksRDD)\n...     contributedRDD = linksRank.flatMap(lambda\
  \ x : rankContribution(x[1][0],x[1][1]))\n...     sumRanks = contributedRDD.reduceByKey(lambda\
  \ v1,v2 : v1+v2)\n...     pageRanksRDD = sumRanks.map(lambda x : (x[0],(1-s)+s*x[1]))\n\
  ...\n```\n\n让我们分析一下我们的 `for` 循环。首先，我们通过内连接将 `pageLinksRDD` 与 `pageRanksRDD` 连接起来。然后，`for`\
  \ 块的第二行使用我们之前定义的 `rankContribution()` 函数计算页面排名的贡献。\n\n在下一行中，我们汇总所有获得的贡献。在最后一行中，我们使用\
  \ `map()` 函数更新每个网页的排名。现在是时候查看结果了：\n\n```\n>>> pageRanksRDD.collect()\n```\n\n输出如下：\n\
  \n```\n[('b', 1.3572437951279825),\n('c', 1.2463781024360086),\n('d', 0.8746512999550939),\n\
  ('a', 0.521726802480915)]\n```\n\n最终，我们得到了每个页面的估计页面排名。\n\n"
- '# 6. PySpark 中的 I/O


  文件输入/输出（I/O）操作是许多软件活动和处理数据的重要组成部分。数据科学家需要处理多种类型的文件，包括文本文件、逗号分隔值（CSV）文件、JavaScript
  对象表示法（JSON）文件等等。Hadoop 分布式文件系统（HDFS）是一个非常优秀的分布式文件系统。


  本章涵盖以下实践：


  - 实践 6-1. 读取简单的文本文件

  - 实践 6-2. 将 RDD 写入简单的文本文件

  - 实践 6-3. 读取目录

  - 实践 6-4. 从 HDFS 读取数据

  - 实践 6-5. 将 RDD 保存到 HDFS

  - 实践 6-6. 从顺序文件读取数据

  - 实践 6-7. 将数据写入顺序文件

  - 实践 6-8. 读取 CSV 文件

  - 实践 6-9. 将 RDD 写入 CSV 文件

  - 实践 6-10. 读取 JSON 文件

  - 实践 6-11. 将 RDD 写入 JSON 文件

  - 实践 6-12. 使用 PySpark 从 HBase 读取表数据


  ## 实践 6-1. 读取简单的文本文件


  ### 问题


  你想要读取一个简单的文本文件。


  ### 解决方案


  你有一个名为 `shakespearePlays.txt` 的简单文本文件。文件内容如下：


  - Love’s Labour’s Lost

  - A Midsummer Night’s Dream

  - Much Ado About Nothing

  - As You Like It


  `shakespearePlays.txt` 文件包含四行。你想使用 PySpark 读取这个文件。读取文件后，你想要计算以下内容：


  - 文件中的总行数

  - 文件中的总字符数


  要读取一个简单的文件，你可以使用两个函数：`textFile()` 和 `wholeTextFiles()`。这两个函数定义在我们的 `SparkContext`
  对象上。


  `textFile()` 方法读取一个文本文件并生成一个行的 RDD。`textFile()` 方法是一个转换操作，因此 `textFile()` 在第一个动作被调用之前不会读取数据。由于在运行
  `textFile()` 时文件可能不可用，它不会抛出错误。它将在第一个动作被调用时抛出错误。这是为什么？与其他转换操作一样，`textFile()` 函数会在第一个动作被调用时执行。


  另一个方法 `wholeTextFiles()` 的工作方式与 `textFile()` 类似，但它将文件作为键/值对读取。文件名被读取为键，文件数据被读取为与该键关联的值。


  ### 工作原理


  让我们看看这些内置方法是如何工作的。


  #### 第 6-1-1 步：使用 `textFile()` 函数读取文本文件




  `textFile()` 函数接受三个输入。第一个输入是 `textFile()` 的文件路径，第二个参数是 `minPartitions`，用于定义 RDD
  中的最小数据分区数，第三个参数是 `use_unicode`。如果 `use_unicode` 为 `False`，文件将作为字符串读取。以下是 `textFile()`
  函数：


  ```

  >>> playData = sc.textFile(''/home/pysparkbook/pysparkBookData/shakespearePlays.txt'',2)

  ```


  输出如下：


  ```

  17/03/18 07:10:17 INFO MemoryStore: Block broadcast_8 stored as values in memory
  (estimated size 61.8 KB, free 208.0 KB)

  17/03/18 07:10:17 INFO MemoryStore: Block broadcast_8_piece0 stored as bytes in
  memory (estimated size 19.3 KB, free 227.3 KB)

  ```


  在之前的代码中，我们提供了文件路径，并将 `minPartitions` 设置为 2。


  ```

  >>> playDataList = playData.collect()

  >>> type(playDataList)

  ```


  输出如下：


  ```

  <class ''list''>

  ```


  我们可以看到，`textFile()` 函数已读取文件并创建了 RDD。RDD 的元素是行：


  ```

  >>> playDataList[0:4]

  ```


  输出如下：


  ```

  [u"Love''s Labour''s Lost",

  u"A Midsummer Night''s Dream",

  u''Much Ado About Nothing'',

  u''As You Like It'']

  ```


  **步骤 6-1-2. 使用 `wholeTextFiles()` 读取文本文件**


  `wholeTextFiles()` 函数也接受三个输入。第一个输入是 `wholeTextFiles()` 的文件路径，第二个参数是 `minPartitions`，用于定义
  RDD 中的最小数据分区数，第三个参数是 `use_unicode`。如果 `use_unicode` 为 `False`，文件将作为字符串读取。这次我们使用
  `wholeTextFiles()` 函数读取相同的文本文件：


  ```

  >>> playData = sc.wholeTextFiles(''/home/pysparkbook/pysparkBookData/shakespearePlays.txt'',2)

  ```


  输出如下：


  ```

  17/03/18 07:19:06 INFO MemoryStore: Block broadcast_11 stored as values in memory
  (estimated size 209.0 KB, free 446.0 KB)

  17/03/18 07:19:06 INFO MemoryStore: Block broadcast_11_piece0 stored as bytes in
  memory (estimated size 19.4 KB, free 465.4 KB)

  ```


  如我们所知，`wholeTextFiles()` 函数将文件作为键/值对读取，其中文件名为键，内容为值。让我们获取文件名：


  ```

  >>> playData.keys().collect()

  ```


  输出如下：


  ```

  [u''file:/home/pysparkbook/pysparkBookData/shakespearePlays.txt'']

  ```


  现在让我们获取文件的内容：


  ```

  >>> playData.values().collect()

  ```


  输出如下：


  ```

  [u"Love''s Labour''s Lost",

  u"A Midsummer Night''s Dream",

  u''Much Ado About Nothing'',

  u''As You Like It'']

  ```


  **步骤 6-1-3. 计算文件中的行数**


  我们可以使用 `count()` 函数计算文件中的行数：


  ```

  >>> playData.count()

  ```


  输出如下：


  ```

  4

  ```


  **步骤 6-1-4. 计算每行的字符数**


  要计算文件中的总字符数，我们可以计算每行的字符数，然后将它们相加。要计算每行的总字符数，我们可以使用 `len()` 函数。`len()` 函数在 Python
  中定义，用于计算序列中的元素数量。对于 Python 字符串，`len()` 函数将返回该字符串的总字符数。让我们通过以下示例观察 `len()` 函数的工作方式：


  ```

  >>> pythonString = "My python"

  >>> len(pythonString)

  ```


  输出如下：


  ```

  9

  ```


  我们创建了一个名为 `pythonString` 的字符串，然后为 `pythonString` 赋值 `My python`。字符串 `My python`
  有九个字符（包括空格）。因此，在 `pythonString` 变量上调用 `len()` 函数返回了 9 作为输出。现在让我们在 RDD `map()` 函数中使用
  `len()` 函数：


  ```

  >>> playDataLineLength = playData.map(lambda x : len(x))

  >>> playDataLineLength.collect()

  ```


  输出如下：


  ```

  [21, 25, 22, 14]

  ```




  最终，我们计算了每一行的字符数。如果对 `playDataLineLength` 这个 RDD 应用 `sum()` 方法，就能得到文件的总字符数：


  ```

  >>> totalNumberOfCharacters = playDataLineLength.sum()

  >>> totalNumberOfCharacters

  ```


  输出如下：


  ```


  ```


  最后，我们计算出文件的总字符数为 82。请注意，这个计数不包括换行符。


  ## 配方 6-2. 将 RDD 写入简单文本文件


  ### 问题


  你想将一个 RDD 写入一个简单文本文件。


  ### 解决方案


  在配方 6-1 中，你计算出每一行的字符数并存入 RDD `playDataLineLength`。现在你想将其保存到一个文本文件中。


  我们可以使用 `saveAsTextFile()` 函数将 RDD 保存为文本文件。该方法是定义在 RDD 上的——而不是像 `textFile()` 和 `wholeTextFiles()`
  函数那样定义在 `SparkContext` 上。你需要提供输出目录，但不需要文件名。你提供的目录名必须尚不存在，否则写入操作会失败。RDD 是分区存在的，因此
  PySpark 会启动多个并行进程来写入文件。


  `saveAsTextFile()` 函数接受两个参数。第一个参数是 `path`，即保存 RDD 的目录路径。第二个参数是 `compressionCodecClass`，这是一个可选参数，默认值为
  `None`。我们可以使用诸如 Gzip 等压缩编解码器来压缩文件，从而实现更高效的计算。


  ### 工作原理


  首先，我们从统计每行字符数的代码开始。虽然我们已经做过，但为了清晰起见，我再次提供了计算每行字符数的代码。


  #### 步骤 6-2-1. 统计每行字符数


  让我们读取文件并统计每行的字符数：


  ```

  >>> playData = sc.textFile(''/home/pysparkbook/pysparkBookData/shakespearePlays.txt'',4)

  >>> playDataLineLength = playData.map(lambda x : len(x))

  >>> playDataLineLength.collect()

  ```


  输出如下：


  ```

  [21, 25, 22, 14]

  ```


  我们的 `playDataLineLength` RDD 中的每个元素就是每行的字符数。


  #### 步骤 6-2-2. 将 RDD 保存到文件


  现在我们有了统计好的 RDD，想将其保存到一个名为 `savedData` 的目录中：


  ```

  >>> playDataLineLength.saveAsTextFile(''/home/pysparkbook/savedData'')

  ```


  让我们检查一下 `savedData` 目录。我们会发现该目录下共有五个文件。其中四个文件——`part-00000`、`part-00001`、`part-00002`
  和 `part-00003`——包含实际数据，而 `_SUCCESS` 文件表示数据已成功写入。你有没有想过为什么数据会分布在四个文件中？答案是 `playDataLineLength`
  RDD 被分成了四个部分，并由四个并行进程来写入文件。


  让我们看看这些文件的内容。我们会发现每个数据点都位于单独的文件中：


  ```

  savedData$ cat part-00000

  ```


  输出如下：


  ```


  savedData$ cat part-00001

  ```


  输出如下：


  ```


  savedData$ cat part-00002

  ```


  输出如下：


  ```


  savedData$ cat part-00003

  ```


  输出如下：


  ```


  ```


  ## 配方 6-3. 读取目录


  ### 问题


  你想读取一个目录。


  ### 解决方案


  一个目录里有很多文件。你想一次性读取该目录（中的所有文件）。


  如今，从目录中一次性读取多个文件是非常常见的任务。要读取目录，我们使用 `textFile()` 函数或 `wholeTextFiles()` 函数。`textFile()`
  函数会读取目录中的小文件并将它们合并。相比之下，`wholeTextFiles()` 函数会将文件读取为键/值对，其中文件名作为键，文件内容作为值。


  你已有一个名为 `manyFiles` 的目录。该目录包含两个文件：`playData1.txt` 和 `playData2.txt`。让我们逐一查看这些文件的内容：


  ```

  manyFiles$ cat playData1.txt

  ```


  输出如下：




  ```

  爱的徒劳

  仲夏夜之梦

  manyFiles$ cat playData2.txt

  ```


  输出如下：


  ```

  无事生非

  皆大欢喜

  ```


  你的任务是一次性从这个目录中读取所有文件。


  ### 工作原理


  我们将依次使用`textFile()`和`wholeTextFiles()`两个函数来读取前面提到的目录。先从`textFile()`开始。


  #### 步骤 6-3-1. 使用 `textFile()` 读取目录


  在之前的示例中，我们通过提供绝对文件路径作为`textFile()`函数的输入来读取文件。`textFile()`函数最棒的一点是，只需更改路径输入，就能改变该函数读取数据的方式。为了读取一个目录中的所有文件，我们需要将目录的绝对路径作为`textFile()`的输入。以下代码行通过`textFile()`函数读取了`manyFiles`目录中的所有文件：


  ```

  >>> manyFilePlayData = sc.textFile(''/home/pysparkbook/pysparkBookData/manyFiles'',4)

  >>> manyFilePlayData.collect()

  ```


  输出如下：


  ```

  [u''无事生非'',

  u''皆大欢喜'',

  u"爱的徒劳",

  u"仲夏夜之梦"]

  ```


  结果非常清晰。`textFile()`函数读取了目录中的所有文件，并将文件内容合并，创建了一个包含合并数据的 RDD。


  #### 步骤 6-3-2. 使用 `wholeTextFiles()` 读取目录


  现在，我们使用`wholeTextFiles()`函数来读取相同的文件集。和`textFile()`一样，这里我们也提供目录路径作为`wholeTextFiles()`函数的输入之一。以下代码演示了使用`wholeTextFiles()`函数读取目录的方法：


  ```

  >>> manyFilePlayDataKeyValue = sc.wholeTextFiles(''/home/pysparkbook/pysparkBookData/manyFiles'',4)

  >>> manyFilePlayDataKeyValue.collect()

  ```


  输出如下：


  ```

  [(u''file:/home/pysparkbook/pysparkBookData/manyFiles/playData2.txt'', u''无事生非\n
  皆大欢喜\n''),

  (u''file:/home/pysparkbook/pysparkBookData/manyFiles/playData1.txt'', u"爱的徒劳\n 仲夏夜之梦\n")]

  ```


  输出结果由文件名和内容的键值对组成。之后，我们需要根据问题要求进行进一步处理。


  ## 配方 6-4. 从 HDFS 读取数据


  ### 问题


  你想使用 PySpark 从 HDFS 读取一个文件。


  ### 解决方案


  HDFS 非常适合存储大量文件。假设在 HDFS 中有一个名为`filamentData.csv`的文件，该文件位于`bookData`目录下，而`bookData`位于
  HDFS 的根目录下。你想使用 PySpark 读取这个文件。


  要从 HDFS 读取文件，我们首先需要了解`core-site.xml`属性文件中的`fs.default.name`属性。我们将从 Hadoop 配置目录中获取`core-site.xml`文件。对我们来说，`fs.default.name`的值是`hdfs://localhost:9746`。因此，文件在
  HDFS 中的完整路径是`hdfs://localhost:9746/bookData/filamentData.csv`。


  我们可以使用`textFile()`函数，通过提供文件的完整路径来从 HDFS 读取文件。


  ### 工作原理


  从 HDFS 读取文件就像从本地机器读取数据一样简单。在以下代码行中，我们使用`textFile()`函数来读取所需的文件：


  ```

  >>> filamentdata = sc.textFile(''hdfs://localhost:9746/bookData/filamentData.csv'',4)

  >>> filamentdata.take(4)

  ```


  输出如下：


  ```

  [u''filamentA,100W,605'',

  u''filamentB,100W,683'',

  u''filamentB,100W,691'',

  u''filamentB,200W,561'']

  ```


  结果证实我们能够从 HDFS 读取文件。


  ## 配方 6-5. 将 RDD 数据保存到 HDFS


  ### 问题


  你想将 RDD 数据保存到 HDFS。


  ### 解决方案


  可以使用`saveAsTextFile()`函数将 RDD 数据保存到 HDFS。在配方 6-2 中，我们将 RDD 保存到了本地文件系统的文件中。现在，我们将把同一个
  RDD（即`playDataLineLength`）保存到 HDFS。


  与使用`textFile()`函数的方式类似，我们需要向`saveAsTextFile()`提供包含 NameNode URI 在内的完整文件路径，以将 RDD
  写入 HDFS。


  ### 工作原理




  鉴于您是一位专注的读者，可能不希望被打扰，我们将从编写统计每行字符总数的代码开始。


  #### 步骤 6-5-1. 统计每行的字符数


  ```

  >>> playData = sc.textFile(''/home/muser/bData/shakespearePlays.txt'',4)

  >>> playDataLineLength = playData.map(lambda x : len(x))

  >>> playDataLineLength.collect()

  ```


  以下是输出结果：


  ```

  [21, 25, 22, 14]

  ```


  #### 步骤 6-5-2. 将 RDD 保存到 HDFS


  使用以下代码行写入 `playDataLineLength` RDD：


  ```

  >>> playDataLineLength.saveAsTextFile(''hdfs://localhost:9746/savedData/'')

  ```


  我们已将 RDD 保存在 HDFS 根目录下的 `savedData` 目录中。请记住，在我们保存数据之前，`savedData` 目录并不存在；否则，`saveAsTextFile()`
  函数会抛出错误。我们已经保存了 RDD，接下来要检查已保存的数据。我们将在 `savedData` 目录中找到五个文件：`part-00000`、`part-00001`、`part-0002`、`part-00003`
  以及我们的 `_SUCCESS` 文件。让我们使用 HDFS 的 `cat` 命令逐一查看每个文件的内容。此命令将文件数据显示到控制台：


  ```

  $ hadoop fs -cat /savedData/part-00000

  ```


  以下是输出结果：


  ```


  $ hadoop fs -cat /savedData/part-00001

  ```


  以下是输出结果：


  ```


  $ hadoop fs -cat /savedData/part-00002

  ```


  以下是输出结果：


  ```


  $ hadoop fs -cat /savedData/part-00003

  ```


  以下是输出结果：


  ```


  ```


  每个文件都包含一个单独的数据点，因为我们的 RDD 有四个分区。


  ## 配方 6-6. 从顺序文件中读取数据


  ### 问题


  您希望从顺序文件中读取数据。


  ### 解决方案


  顺序文件使用键/值文件格式。此处的键值采用二进制格式。这是 Hadoop 常用的文件格式。键和值都是 Hadoop `Writable` 类的子类型。


  我们在 HDFS 根目录下的 `sequenceFileToRead` 目录中存储了一个顺序文件。该目录下的文件包含了表 6-1 中的数据。


  表 6-1. 顺序文件数据


  ![A430628_1_En_6_Figa_HTML.gif](img/A430628_1_En_6_Figa_HTML.gif)


  我们可以使用 `SparkContext` 类中定义的 `sequenceFile()` 方法来读取顺序文件。


  ### 工作原理


  `sequenceFile()` 函数接受多个参数。下面讨论其中一些。第一个参数是 `path`，即顺序文件的路径。第二个参数是 `keyClass`，用于指明顺序文件中数据的键类。`valueClass`
  参数表示值的数据类型。请记住，键和值类都是 Hadoop `Writable` 类的子类。


  ```

  >>> simpleRDD = sc.sequenceFile(''hdfs://localhost:9746/sequenceFileToRead'')

  >>> simpleRDD.collect()

  ```


  以下是输出结果：


  ```

  [(u''p'', 20),

  (u''q'', 30),

  (u''r'', 20),

  (u''m'', 25)]

  ```


  最终，我们成功读取了顺序文件。


  ## 配方 6-7. 将数据写入顺序文件


  ### 问题


  您希望将数据写入顺序文件。


  ### 解决方案


  很多时候，我们希望将 PySpark 处理的结果保存到顺序文件中。我们有一个科目数据的 RDD，如表 6-2 所示，您希望将其写入一个顺序文件。


  表 6-2. 学生科目数据


  ![A430628_1_En_6_Figb_HTML.gif](img/A430628_1_En_6_Figb_HTML.gif)


  ### 工作原理


  在本配方中，我们将首先创建一个 RDD，然后将其保存到顺序文件中。


  #### 步骤 6-7-1. 创建配对 RDD


  首先，创建一个元组列表：


  ```

  >>> subjectsData = [(''si1'',''Python''),

  ...                 (''si3'',''Java''),

  ...                 (''si1'',''Java''),

  ...                 (''si2'',''Python''),

  ...                 (''si3'',''Ruby''),

  ...                 (''si4'',''C++''),

  ...                 (''si5'',''C''),

  ...                 (''si4'',''Python''),

  ...                 (''si2'',''Java'')]

  ```


  接下来，将数据并行化：


  ```

  >>> subjectsPairedRDD = sc.parallelize(subjectsData, 4)

  >>> subjectsPairedRDD.take(4)

  [(''si1'', ''Python''),

  (''si3'', ''Java''),

  (''si1'', ''Java''),

  (''si2'', ''Python''),

  ]

  ```


  #### 步骤 6-7-2. 将 RDD 保存为顺序文件


  最后，将我们的配对 RDD 写入一个顺序文件：


  ```

  >>>subjectsPairedRDD.saveAsSequenceFile(''hdfs://localhost:9746/sequenceFiles'')

  ```


  我们的顺序文件位于 HDFS 中的 `sequenceFiles` 目录下。现在让我们检查已保存的文件：


  ```

  $ hadoop fs -ls /sequenceFiles

  ```


  我们找到了五个项目：


  ```

  -rw-r--r--  3 pysparkbook  supergroup 0 2017-05-22 00:18 /sequenceFiles /_SUCCESS

  -rw-r--r--   3 pysparkbook supergroup        114 2017-05-22 00:18 /sequenceFiles/part-00000

  -rw-r--r--   3 pysparkbook supergroup        114 2017-05-22 00:18 /sequenceFiles/part-00001

  -rw-r--r--   3 pysparkbook supergroup        111 2017-05-22 00:18 /sequenceFiles/part-00002

  -rw-r--r--   3 pysparkbook supergroup        128 2017-05-22 00:18 /sequenceFiles/part-00003

  ```


  这里我们可以看到文件已保存为四个部分。


  ## 配方 6-8. 读取 CSV 文件


  ### 问题


  您希望读取一个 CSV 文件。


  ### 解决方案


  正如我们所提到的，CSV 代表逗号分隔值。在 CSV 文件中，每一行都包含由分隔符分隔的字段。通常，逗号（`,`）被用作分隔符，但分隔符也可能是其他字符。


  我们已经知道，如果 PySpark 读取一个文件，它会创建一个由行组成的 RDD。因此，读取 CSV 文件的最佳方法是使用 `textFile()` 函数读取它，然后使用
  Python 的 CSV 解析器解析每一行。


  在 Python 中，我们可以使用 `csv` 模块来解析 CSV 行。该模块提供了处理 CSV 数据的所有功能。我们还使用 `reader()` 函数，它会返回一个
  reader 对象。reader 对象可以迭代行。


  您会得到一个灯丝数据的 CSV 文件，这与我们在第 5 章中使用的灯丝数据相同。灯丝数据文件的行内容如下：


  ```

  filamentA,100W,605

  filamentB,100W,683

  filamentB,100W,691

  filamentB,200W,561

  filamentA,200W,530

  ```


  我们可以看到文件中的每一行都由逗号分隔。因此，通过 CSV 解析器解析每一行就完成了我们的任务。


  注


  您可以在 [`https://stackoverflow.com/questions/28782940/load-csv-file-with-spark`](https://stackoverflow.com/questions/28782940/load-csv-file-with-spark)
  阅读更多关于使用 PySpark 读取 CSV 文件的内容。


  ### 工作原理


  我们将从编写一个 Python 函数开始，该函数将解析每一行。


  #### 步骤 6-8-1. 编写一个 Python 函数来解析 CSV 行


  我们将编写一个名为 `parseCSV()` 的函数。此函数将接收每一行并解析它以返回一个列表：


  ```

  >>> import csv

  >>> import  StringIO

  >>> def parseCSV(csvRow) :

  ...      data = StringIO.StringIO(csvRow)

  ...      dataReader =  csv.reader(data)

  ...      return(dataReader.next())

  ```


  我们的函数一次处理一行。每行由 `StringIO` 模块中定义的 `StringIO` 函数接收。使用 `StringIO` 模块，我们可以创建一个类似文件的对象。我们将
  data 对象传递给 `csv` 模块的 `reader()` 函数。它将返回一个 reader 对象。`next()` 函数将返回一个由逗号分隔的字段列表。让我们检查一下函数是否正常工作：


  ```

  >>> csvRow = "p,s,r,p"

  >>> parseCSV(csvRow)

  ```


  以下是输出结果：


  ```

  [''p'', ''s'', ''r'', ''p'']

  ```


  我们创建了一个字符串 `csvRow`。可以看到，字符串中的字段由逗号分隔。现在我们使用函数解析该行，并得到一个列表作为结果。这证实了我们的函数符合预期。


  #### 步骤 6-8-2. 创建配对 RDD


  我们将读取文件并解析其行。以下代码将读取文件、解析行并返回所需的数据：


  ```

  >>> filamentRDD =sc.textFile(''/home/pysparkbook/pysparkBookData filamentData.csv'',4)

  >>> filamentRDDCSV = filamentRDD.map(parseCSV)

  >>> filamentRDDCSV.take(4)

  ```




  输出如下：


  ```

  [[''filamentA'', ''100W'', ''605''],

  [''filamentB'', ''100W'', ''683''],

  [''filamentB'', ''100W'', ''691''],

  [''filamentB'', ''200W'', ''561'']]

  ```


  最终输出是一个嵌套列表。每个内部列表由解析后的行组成。


  ## 配方 6-9：将 RDD 写入 CSV 文件


  ### 问题


  你想将一个 RDD 写入 CSV 文件。


  ### 解决方案


  将数据写入 CSV 文件需要我们把字段列表转换成逗号分隔的字符串。当元素被连接时，可以将列表转换为字符串。


  ### 实现原理


  #### 步骤 6-9-1：创建将列表转换为字符串的函数


  我们创建一个名为`createCSV`的函数，该函数接收一个列表，并通过连接列表中被逗号分隔的元素来返回一个字符串。


  ```

  >>> import csv

  >>> import StringIO

  >>> def createCSV(dataList):

  ...       data = StringIO.StringIO()

  ...       dataWriter = csv.writer(data,lineterminator='''')

  ...       dataWriter.writerow(dataList)

  ...       return (data.getvalue())

  ```


  `StringIO()`函数返回一个类文件对象。然后，`csv`模块的`writerow()`函数将其转换为字符串。让我们观察一下`createCSV()`函数的作用：


  ```

  >>> listData = [''p'',''q'',''r'',''s'']

  >>> createCSV(listData)

  ```


  输出如下：


  ```

  ''p,q,r,s''

  ```


  `listData`列表有四个元素。我们将`listData`作为输入提供给`createCSV()`函数。最后，我们得到一个字符串，该字符串是通过连接列表中被逗号分隔的元素而创建的。


  #### 步骤 6-9-2：将数据保存到文件


  我们的问题要求将数据保存到文件。不过我们先创建一个 RDD，然后再保存数据。我们将从`simpleData`嵌套列表中创建一个 RDD：


  ```

  >>> simpleData = [[''p'',20],

  ...               [''q'',30],

  ...               [''r'',20],

  ...               [''m'',25]]

  >>> simpleRDD = sc.parallelize(simpleData,4)

  >>> simpleRDD.take(4)

  ```


  输出如下：


  ```

  [[''p'', 20],

  [''q'', 30],

  [''r'', 20],

  [''m'', 25]]

  ```


  我们已经创建了所需的 RDD。现在，使用`map()`函数，我们将数据转换为适合保存的格式：


  ```

  simpleRDDLines = simpleRDD.map( createCSV)

  simpleRDDLines.take(4)

  simpleRDDLines.saveAsTextFile(''/home/pysparkbook/csvData/'')

  ```


  我们已经将数据作为 CSV 文件保存到了`csvData`目录中。


  ## 配方 6-10：读取 JSON 文件


  ### 问题


  你想通过使用 PySpark 读取一个 JSON 文件。


  ### 解决方案


  如前文所述，JSON 代表 JavaScript 对象表示法（JavaScript Object Notation）。几十年来，JSON 数据文件的流行度不断增长。它是一种数据交换格式。几乎所有编程语言都支持读取和写入
  JSON。JSON 格式具有类似字段名和值的配对。两个字段名/值对用逗号（`,`）分隔，每个字段名与其关联的值用冒号（`:`）分隔。数据科学家经常从客户那里获取
  JSON 格式的数据。


  给你一个 JSON 文件`tempData.json`。JSON 文件具有`.json`扩展名。该文件包含以下格式的数据：


  ```

  $ cat tempData.json

  ```


  输出如下：


  ```

  {"Time":"6AM",  "Temperature":15}

  {"Time":"8AM",  "Temperature":16}

  {"Time":"10AM", "Temperature":17}

  {"Time":"12AM", "Temperature":17}

  {"Time":"2PM",  "Temperature":18}

  {"Time":"4PM",  "Temperature":17}

  {"Time":"6PM",  "Temperature":16}

  {"Time":"8PM",  "Temperature":14}

  ```


  我们的 JSON 文件由两个键`Time`和`Temperature`及其关联的值组成。我们可以看到，对于特定字段，字段名和值通过冒号关联。两个字段的名称/值对由逗号分隔。


  在 PySpark 中读取 JSON 文件有何特别之处？现在你明白了，每当我们读取一个 JSON 文件时，它会创建一个由行组成的 RDD，然后逐行解析数据。因此，我们需要一个解析器来解析这些行，更准确地说，我们需要一个
  JSON 数据解析器。


  ### 实现原理


  有许多 Python 模块可用于 JSON 解析，但我们将使用`json`这个 Python 模块。该模块提供了许多用于处理 JSON 格式的工具。




  #### 步骤 6-10-1. 创建解析 JSON 数据的函数


  让我们创建一个函数，用于解析 JSON 数据，并为每一行返回一个 Python 列表：


  ```python

  >>> import json

  >>> def jsonParse(dataLine):

  ...      parsedDict = json.loads(dataLine)

  ...      valueData = parsedDict.values()

  ...      return(valueData)

  ```


  `jsonParse()` 函数将接收一个 JSON 格式的字符串，并返回一个列表。输入到 `jsonParse()` 函数的数据会传递给 `json.loads()`
  函数。`json.loads()` 函数接收一个 JSON 字符串作为参数，并返回一个字典。然后我们在下一行获取字典的值，最后将其返回。我们必须测试一下这个函数：


  ```python

  >>> jsonData = ''{"Time":"6AM",  "Temperature":15}''

  ```


  我们创建了一个 JSON 字符串 `jsonData`：


  ```python

  >>> jsonParsedData = jsonParse(jsonData)

  >>> print jsonParsedData

  ```


  以下是输出结果：


  ```

  [15, ''6AM'']

  ```


  为了解析我们的 JSON 字符串，我们使用了 `jsonParse()` 函数，并得到了 Python 列表 `jsonParsedData`。


  #### 步骤 6-10-2. 读取文件


  我们将使用 `textFile()` 函数来读取文件：


  ```python

  >>> tempData = sc.textFile("/home/pysparkbook//pysparkBookData/tempData.json",4)

  >>> tempData.take(4)

  ```


  以下是输出结果：


  ```

  [u''{"Time":"6AM",  "Temperature":15}'',

  u''{"Time":"8AM",  "Temperature":16}'',

  u''{"Time":"10AM", "Temperature":17}'',

  u''{"Time":"12AM", "Temperature":17}'']

  ```


  我们已经读取了文件，输出结果显示 RDD 是一行行 JSON 字符串。


  #### 步骤 6-10-3. 创建配对 RDD


  现在我们需要解析每一行。这可以通过将 `jsonParse()` 函数作为参数传递给 RDD `tempData` 的 `map()` 函数来实现：


  ```python

  >>> tempDataParsed = tempData.map(jsonParse)

  >>> tempDataParsed.take(4)

  ```


  以下是输出结果：


  ```

  [[15, u''6AM''],

  [16, u''8AM''],

  [17, u''10AM''],

  [17, u''12AM'']]

  ```


  最终，我们得到了所需的结果。


  ### 方法 6-11. 将 RDD 写入 JSON 文件


  ### 问题


  你想要将一个 RDD 写入到一个 JSON 文件中。


  ### 解决方案


  可以通过使用 `json` 模块从 Python 字典创建 JSON 字符串对象。


  #### 实现原理


  #### 步骤 6-11-1. 创建接收列表并返回 JSON 字符串的函数


  我们将创建一个名为 `createJSON()` 的函数，它接收一个 Python 列表并返回一个 JSON 字符串：


  ```python

  >>> def createJSON(data):

  ...     dataDict = {}

  ...     dataDict[''Name''] = data[0]

  ...     dataDict[''Age''] = data[1]

  ...     return(json.dumps(dataDict))

  ```


  在 `createJSON()` 函数内部，我们首先创建了一个 `dataDict` 字典。然后，我们将该字典传递给 `json` 模块的 `dumps()`
  函数。这个函数会返回一个 JSON 字符串对象。下面这行代码将测试我们的函数：


  ```python

  >>> nameAgeList = [''Arun'',22]

  >>> createJSON(nameAgeList)

  ```


  以下是输出结果：


  ```

  ''{"Age": 22, "Name": "Arun"}''

  ```


  我们的函数返回了一个 JSON 字符串对象。


  #### 步骤 6-11-2. 以 JSON 格式保存数据


  我们将遵循与之前相同的流程。首先，创建一个 RDD。然后，将该 RDD 以 JSON 格式写入一个文件。


  ```python

  >>> nameAgeData = [[''Arun'',22],

  ...                                  [''Bony'',35],

  ...                                  [''Juna'',29]]

  >>> nameAgeRDD = sc.parallelize(nameAgeData,3)

  >>> nameAgeRDD.collect()

  ```


  以下是输出结果：


  ```

  [[''Arun'', 22],

  [''Bony'', 35],

  [''Juna'', 29]]

  ```


  我们已经创建了一个 RDD；现在需要将这些数据转换为 JSON 字符串。`createJSON()` 函数作为参数传递给了 `map()` 函数。`map()`
  函数作用于我们的 `nameAgeRDD` RDD。


  ```python

  >>> nameAgeJSON = nameAgeRDD.map(createJSON)

  >>> nameAgeJSON.collect()

