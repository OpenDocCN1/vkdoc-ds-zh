  \ 设置密码。\n\n创建用户后，我们必须将其添加到 sudo 用户组。Sudo 代表超级用户执行（superuser do）。使用 sudo，我们可以以超级用户身份运行任何代码。Sudo\
  \ 用于安装软件。\n\n#### 步骤 2-1-2. 创建新的 CentOS 用户\n\n新用户已创建。你可能会想，为什么要新用户？为什么不能将 Hadoop\
