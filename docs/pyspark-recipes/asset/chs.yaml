  ### Apache Kafka


  Apache Kafka 是一个发布-订阅式的分布式消息平台。它由 LinkedIn 开发，随后开源给 Apache 基金会。它具有容错性、可扩展性和高速性。在
  Kafka 术语中，消息（message）是可以通过 Kafka 服务器从生产者（producer）流向消费者（consumer）的最小数据单元，并且可以被持久化供以后使用。您可能会对
  `producer` 和 `consumer` 这两个术语感到困惑。我们稍后会讨论这些术语。在 Kafka 上下文中，我们将使用的另一个关键术语是 `topic`。`Topic`
  是一个包含相似类别消息的流。Kafka 自带一个内置 API，开发者可以使用它来构建自己的应用程序。由我们来定义 `topic`。现在，我们来讨论 Apache
  Kafka 的三个主要组件。


  ## 生产者（Producer）


  Kafka 生产者将消息生成到 Kafka 的 `topic`。它可以向多个 `topic` 发布数据。


  ## 代理（Broker）


  代理是运行在专用机器上的主要 Kafka 服务器。消息由生产者推送到代理。代理将 `topic` 持久化到不同的分区中，并且这些分区会被复制到不同的代理上以应对故障。代理是无状态的，因此消费者需要追踪已经消费过的消息。


  ## 消费者（Consumer）


  消费者从 Kafka 代理获取消息。记住，是消费者获取消息；Kafka 代理不会将消息推送给消费者；相反，消费者从 Kafka 代理拉取数据。消费者订阅了 Kafka
  代理上的一个或多个 `topic`，并读取其中的消息。消费者还会跟踪所有已经消费过的消息。数据会在代理中持久化一段指定的时间。如果消费者发生故障，它可以在重启后重新获取数据。


  图 1-6 解释了 Apache Kafka 的消息流。生产者将消息发布到 `topic`。然后消费者从代理拉取数据。在发布和拉取之间，消息由 Kafka 代理持久化存储。


  ![A430628_1_En_1_Fig6_HTML.gif](img/A430628_1_En_1_Fig6_HTML.gif)


  图 1-6. Apache Kafka 消息流


  我们将在第 7 章中将 Apache Kafka 与 PySpark 集成，届时会进一步讨论 Kafka。


