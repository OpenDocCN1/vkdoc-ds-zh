  ```\n>>> filamentDataFrame.filter((filamentDataFrame.FilamentType == 'filamentA')\
  \ & (filamentDataFrame.BulbPower == '200W')).count()\n```\n\n输出为空（未显示具体数字）。\n\n\
  ```\n>>> filamentDataFrame.filter((filamentDataFrame.FilamentType == 'filamentA')\
  \ & (filamentDataFrame.BulbPower == '100W')).count()\n```\n\n输出为空（未显示具体数字）。\n\n\
  ## 食谱 8-3. 在 DataFrame 上执行聚合操作\n\n### 问题\n\n你希望对 DataFrame 执行数据聚合。\n\n### 解决方案\n\
  \n为了获得数据的汇总模式，数据科学家会对给定的数据集执行聚合。汇总模式易于理解。有时汇总会基于某个键进行。要基于键执行聚合，我们首先需要按键对数据进行分组。\n\
  \n在 PySparkSQL 中，可以使用`groupBy()`函数按键进行分组。该函数返回`pyspark.sql.group.GroupedData`对象。创建此\
  \ GroupedData 对象后，我们可以对其应用许多聚合函数，例如`avg()`、`sum()`、`count()`、`min()`、`max()`和`sum()`。\n\
  \n我们有一个名为`adult.data`的数据文件。我从加州大学尔湾分校（UCI）信息与计算机科学学院网站获取了这些数据。这是一个包含 15 列的简单 CSV\
  \ 文件。表 8-1 描述了所有 15 列。\n\n你需要完成以下任务：\n\n- 从`adult.data`文件创建一个 DataFrame\n- 统计 DataFrame\
  \ 中的记录总数\n- 统计薪资大于$50,000 和小于$50,000 的次数\n- 对数值列`age`、`capital-gain`、`capital-loss`和`hours-per-week`执行汇总统计\n\
  - 从数据中找出男性和女性工人的平均年龄\n- 找出薪资大于$50,000 的情况在男性还是女性中更常见\n- 找出薪资最高的职业\n\n**表 8-1. adult.data\
  \ 文件的列描述**\n\n![A430628_1_En_8_Figa_HTML.gif](img/A430628_1_En_8_Figa_HTML.gif)\n\
  \n### 工作原理\n\n首先下载所需数据，然后逐步执行所有所需操作。\n\n#### 步骤 8-3-1. 从 adult.data 文件创建 DataFrame\n\
  \n让我们从 UCI 机器学习仓库网站下载`adult.data`文件。我们可以使用`wget` Linux 命令获取数据文件：\n\n```\n$ wget\
  \ https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.data\n```\n\
  \n我们已下载数据文件。现在使用`spark.read.csv()`函数读取数据：\n\n```\n>>> censusDataFrame = spark.read.csv('file:///home/pysparkbook/pysparkBookData/adult.data',\
  \ header=True, inferSchema=True)\n```\n\n在上述代码中，`spark.read.csv()`函数的第二个参数是`header\
  \ = True`。这表示`adult.data`文件包含列标题。`inferSchema = True`参数表示从数据本身推断模式。我们没有为 DataFrame\
  \ 提供显式模式。\n\n```\n>>> censusDataFrame.printSchema()\n```\n\n输出如下（未显示具体输出内容）。\n\n\
  \n  \n```root\n|-- age: integer (nullable = true)\n|-- workclass: string (nullable\
  \ = true)\n|-- fnlwgt: double (nullable = true)\n|-- education: string (nullable\
  \ = true)\n|-- education-num: double (nullable = true)\n|-- marital-status: string\
  \ (nullable = true)\n|-- occupation: string (nullable = true)\n|-- relationship:\
  \ string (nullable = true)\n|-- race: string (nullable = true)\n|-- sex: string\
  \ (nullable = true)\n|-- capital-gain: double (nullable = true)\n|-- capital-loss:\
  \ double (nullable = true)\n|-- hours-per-week: double (nullable = true)\n|-- native-country:\
  \ string (nullable = true)\n|-- income: string (nullable = true)\n```\n\n从 DataFrame\
  \ 的 schema 可以清晰看出，共有 15 列。其中一些列是数值型，其余是字符串型。我们的数据集混合了分类字段和数值字段。\n\n#### 步骤 8-3-2.\
  \ 统计 DataFrame 中的总记录数\n\n让我们统计一下 DataFrame 中有多少条记录。最简单的 `count()` 方法就能满足这个需求：\n\n\
  ```\n>>> censusDataFrame.count()\n```\n\n以下是输出结果：\n\n```\n\n```\n\n我们的数据帧共有 32,561\
  \ 条记录。这是一个相当大的数据量。\n\n#### 步骤 8-3-3. 统计工资高于和低于 50K 的频率\n\n我们可以先按 `income` 列对数据进行分组，然后使用\
  \ `count()` 函数进行计数，从而实现统计特定工资频率的目标：\n\n```\n>>> groupedByIncome = censusDataFrame.groupBy('income').count()\n\
  >>> groupedByIncome.show()\n```\n\n以下是输出结果：\n\n```\n+----------+---------+\n|income\
  \    |count    |\n+----------+---------+\n|  >50K    | 7841    |\n| <=50K    |24720\
  \    |\n+----------+---------+\n```\n\n从这张表中可以明显看出，工资高于 50,000 美元的频率低于工资小于或等于该金额的频率。\n\
  \n#### 步骤 8-3-4. 对数值列执行汇总统计\n\n如下所示的 `describe()` 函数非常有用：\n\n```\n>>> censusDataFrame.describe('age').show()\n\
  ```\n\n以下是输出结果：\n\n```\n+-------+------------------+\n|summary|               age|\n\
  +-------+------------------+\n|  count|             32561|\n|   mean| 38.58164675532078|\n\
  | stddev|13.640432553581356|\n|    min|                17|\n|    max|          \
  \      90|\n+-------+------------------+\n```\n\n在职人员的最大年龄为 90 岁，最小年龄为 17 岁。在职人员的平均年龄为\
  \ 38.58 岁。从这个平均值可以推断，大多数在职人员年龄在 30 多岁。\n\n类似地，我们可以找出 `capital-gain` 和 `capital-loss`\
  \ 数据的汇总统计信息：\n\n```\n>>> censusDataFrame.describe('capital-gain').show()\n+-------+------------------+\n\
  |summary|      capital-gain|\n+-------+------------------+\n|  count|          \
  \   32561|\n|   mean|1077.6488437087312|\n| stddev| 7385.292084840354|\n|    min|\
  \               0.0|\n|    max|           99999.0|\n+-------+------------------+\n\
  >>> censusDataFrame.describe('capital-loss').show()\n```\n\n以下是输出结果：\n\n```\n+-------+----------------+\n\
  |summary|    capital-loss|\n+-------+----------------+\n|  count|           32561|\n\
  |   mean| 87.303829734959|\n| stddev|402.960218649002|\n|    min|             0.0|\n\
  |    max|          4356.0|\n+-------+----------------+\n```\n\n我们来看看劳动者每周工作小时数的分布情况：\n\
  \n```\n>>> censusDataFrame.describe('hours-per-week').show()\n```\n\n以下是输出结果：\n\n\
  ```\n+-------+------------------+\n|summary|    hours-per-week|\n+-------+------------------+\n\
  |  count|             32561|\n|   mean|40.437455852092995|\n| stddev|12.347428681731838|\n\
  |    min|               1.0|\n|    max|              99.0|\n```\n\n很明显，每周最长工作小时数为\
  \ 99.0。\n\n#### 步骤 8-3-5. 从数据中查找男性和女性劳动者的平均年龄\n\n男性和女性劳动者的平均年龄可以通过以下方式找到：\n\n```\n\
  >>> groupedByGender = censusDataFrame.groupBy('sex')\n>>> type(groupedByGender)\n\
  ```\n\n以下是输出结果：\n\n```\n>>> groupedByGender.mean('age').show()\n```\n\n以下是输出结果：\n\
  \n\n```text\n+----------+------------------------+\n|   性别   |    平均年龄         \
  \   |\n+----------+------------------------+\n|   男性   |  39.43354749885268    \
  \ |\n|   女性   |  36.85823043357163     |\n+----------+------------------------+\n\
  ```\n\n平均来看，男性员工比女性员工年龄更大。\n\n```\n>>> groupedByGender.mean('hours-per-week').show()\n\
  ```\n\n输出结果如下：\n\n```\n+-----------+-------------------------+\n|    性别   |  平均每周工作小时数\
  \     |\n+-----------+-------------------------+\n|    男性   |  42.42808627810923\
  \      |\n|    女性   |  36.410361154953115     |\n+-----------+-------------------------+\n\
  ```\n\n根据我们的数据，女性员工平均每周工作小时数少于男性员工。\n\n#### 步骤 8-3-6. 探究高薪在男性和女性中出现的频率差异\n\n由于我们的结果依赖于两个字段：`sex`\
  \ 和 `income`，因此需要同时按这两个字段对数据进行分组：\n\n```\n>>> groupedByGenderIncome = censusDataFrame.groupBy(['income',\
  \ 'sex'])\n```\n\n现在，我们可以对分组后的数据应用 `count()` 函数，从而获得所需结果：\n\n```\n>>> groupedByGenderIncome.count().show()\n\
  ```\n\n输出结果如下：\n\n```\n+------+-------+-----+\n|收入  |  性别 | 人数 |\n+------+-------+-----+\n\
  |  >50K|   男性| 6662|\n|  >50K|   女性| 1179|\n| <=50K|   女性| 9592|\n| <=50K|   男性|15128|\n\
  +------+-------+-----+\n```\n\n可以看出，收入超过 50,000 美元的情况在男性中更为常见。\n\n#### 步骤 8-3-7.\
  \ 寻找最高薪职业\n\n要找到收入最高的职业，我们需要按 `occupation` 和 `income` 字段对 DataFrame 进行分组：\n\n```\n\
  >>> groupedByOccupationIncome = censusDataFrame.groupBy(['occupation', 'income'])\n\
  ```\n\n然后对分组后的数据应用 `count()` 函数。我们需要找到薪酬最高的职业，因此还要对数据进行排序：\n\n```\n>>> groupedByOccupationIncome.count().sort(['income','count'],\
  \ ascending=0).show(5)\n```\n\n输出结果如下（仅显示前五行）：\n\n```\n+----------------+------+-----+\n\
  |        职业    | 收入 | 人数|\n+----------------+------+-----+\n|  执行/管理类   |  >50K|\
  \ 1968|\n|  专业/技术类   |  >50K| 1859|\n|        销售类   |  >50K|  983|\n|   手工艺/维修类|\
  \  >50K|  929|\n|   行政管理/文员|  >50K|  507|\n+----------------+------+-----+\n```\n\
  \n可以看出，在收入超过 50,000 美元的群体中，执行/管理类人员占据了很高的比例。\n\n## 方案 8-4.  在 DataFrame 上执行 SQL\
  \ 和 HiveQL 查询\n\n### 问题\n\n你希望在 DataFrame 上运行 SQL 和 HiveQL 查询。\n\n### 解决方案\n\n我们可以使用\
  \ `createOrReplaceTempView()` 方法创建一个临时视图。`DataFrame` 类提供了此函数。该视图的生命周期与创建该 DataFrame\
  \ 的 `SparkSession` 保持一致。\n\n还有一个名为 `registerTempTable()` 的函数，它会在内存中创建一个临时表。使用 `SQLContext`\
  \ 可以运行 SQL 命令，而使用 `HiveContext` 则可以在这些临时表上运行 HiveQL 查询。在 PySpark 的新版本中，此方法已被弃用。但如果你正在处理较旧的\
  \ PySpark 代码，仍可能会遇到 `registerTempTable()`。\n\n在前面的方案中，我们创建了一个名为 `censusDataFrame`\
  \ 的 DataFrame。现在，你希望对该 DataFrame 执行以下操作：\n\n- 创建一个临时视图\n- 使用 SQL 命令选择 `age` 和 `income`\
  \ 列\n- 根据教育水平计算每周平均工作时长\n\n### 工作原理\n\n我们将从为 DataFrame 创建一个临时视图开始。创建该临时视图后，我们将应用\
  \ SQL 命令来执行我们的任务。\n\n#### 步骤 8-4-1.  在内存中创建临时视图\n\n首先创建一个临时表，然后我们就可以在该表上运行 SQL 或\
  \ HiveQL 命令。\n\n```\n>>> censusDataFrame.createOrReplaceTempView(\"censusDataTable\"\
  )\n```\n\n这会创建一个名为 `censusDataTable` 的临时表。\n\n#### 步骤 8-4-2.  使用 SQL 命令选择年龄和收入列\n\
  \n`select` 命令是 SQL 中非常常用且广受欢迎的命令。我们需要选择 `age` 和 `income` 这两列：\n\n```\n>>> censusDataAgeIncome\
  \ = spark.sql('select age, income from censusDataTable limit 5')\n```\n\n\n\n上述代码中的\
  \ SQL 命令是一个通用的 SQL `select` 指令，用于获取 `age`（年龄）和 `income`（收入）这两列数据。`spark.sql()` 函数可用于执行\
  \ SQL 命令。\n\n在 `spark.sql()` 函数中，Spark 代表一个 `SparkSession` 对象。每当我们启动 PySpark Shell\
  \ 时，都会发现 `SparkSession` 以 `spark` 的形式可用。在上述 SQL 命令中，`limit 5` 将仅返回五条记录。\n\n通过 `spark.sql()`\
  \ 函数运行 SQL 命令会返回一个 DataFrame。在我们的例子中，DataFrame `censusDataAgeIncome` 只包含 `age` 和\
  \ `income` 两列。因此，我们知道可以使用 `show()` 函数来打印 DataFrame 的列。让我们看看结果：\n\n```\n>>> censusDataAgeIncome.show()\n\
  ```\n\n输出如下：\n\n```\n+---+------+\n|age|income|\n+---+------+\n| 39| <=50K|\n| 50|\
  \ <=50K|\n| 38| <=50K|\n| 53| <=50K|\n| 28| <=50K|\n+---+------+\n```\n\n`spark.sql()`\
  \ 函数返回一个 DataFrame。我们可以通过 `type()` 函数来验证这一点。下面这行代码用于测试 `censusDataAgeIncome` 的数据类型：\n\
  \n```\n>>> type(censusDataAgeIncome)\n```\n\n输出如下：`censusDataAgeIncome` 的类型是 `DataFrame`。\n\
  \n#### 步骤 8-4-3. 根据教育水平计算平均每周工作小时数\n\n要根据工人的教育水平计算其平均每周工作小时数，首先需要按教育水平对数据进行分组。在\
  \ SQL 和 HiveQL 中，我们可以使用 `group by` 子句来获取分组后的数据：\n\n```\n>>> avgHoursPerWeekByEducation\
  \ = spark.sql(\"select education, round(avg(`hours-per-week`),2) as averageHoursPerWeek\
  \ from censusDataTable group by education\")\n```\n\nSQL 的 `avg()` 函数将计算平均值。`round()`\
  \ 函数用于以良好的格式呈现数据。我们将平均每周工作小时数取别名为 `averageHoursPerWeek`。计算结束后，我们得到 DataFrame `avgHoursPerWeekByEducation`，它包含两列：第一列是\
  \ `education`，第二列是 `averageHoursPerWeek`。让我们应用 `show()` 函数来查看 DataFrame 的内容：\n\n\
  ```\n>>> avgHoursPerWeekByEducation.show()\n```\n\n输出如下：\n\n```\n+---------------+-----------------------------------+\n\
  |    education  |  averageHoursPerWeek              |\n+---------------+-----------------------------------+\n\
  |  Prof-school  |              47.43                |\n|         10th   |      \
  \        37.05                |\n|      7th-8th   |              39.37         \
  \       |\n|      5th-6th   |              38.90                |\n|   Assoc-acdm\
  \  |              40.50                |\n|    Assoc-voc  |              41.61 \
  \               |\n|      Masters  |              43.84                |\n|    \
  \     12th   |              35.78                |\n|    Preschool  |          \
  \    36.65                |\n|          9th   |              38.04             \
  \   |\n|    Bachelors  |              42.61                |\n|    Doctorate  |\
  \              46.97                |\n|      HS-grad  |              40.58    \
  \            |\n|         11th   |              33.93                |\n| Some-college\
  \  |              38.85                |\n|      1st-4th  |              38.26 \
  \               |\n+---------------+-----------------------------------+\n```\n\n\
  ## 方法 8-5. 在 DataFrame 上执行数据连接\n\n### 问题\n\n你希望对两个 DataFrame 执行连接操作。\n\n### 解决方案\n\
  \n我们经常需要合并两个或多个 DataFrame 或表中的信息。为此，我们需要执行 DataFrame 连接。基本上，表连接是一个 SQL 术语，其中我们连接两个或多个表以获取非规范化表。对两个表执行连接操作在数据科学中非常常见。\n\
  \n在 PySparkSQL 中，我们可以执行以下类型的连接：\n* 内连接\n* 左外连接\n* 右外连接\n* 全外连接\n\n在第 5 章中，我们讨论了配对\
  \ RDD 连接。在本方法中，我们将讨论连接 DataFrame。你希望执行以下操作：\n* 从 PostgreSQL 数据库中读取学生数据表\n* 从 JSON\
  \ 文件中读取科目数据\n* 对 DataFrame 执行内连接\n* 将内连接后的 DataFrame 保存为 JSON 文件\n* 执行右外连接\n* 将右外连接后的\
  \ DataFrame 保存到 PostgreSQL\n* 执行左外连接\n* 执行全外连接\n\n为了连接两个 DataFrame，PySparkSQL 提供了\
  \ `join()` 函数，该函数作用于 DataFrame。\n\n### 工作原理\n\n让我们开始探索 PostgreSQL 数据库及其内部的表。我们必须从\
  \ PostgreSQL 数据库中读取数据。让我们在 PostgreSQL 数据库中创建一个表，并向表中插入记录。\n\n让我们进入数据库服务器：\n\n```\n\
  $ sudo -u postgres psql\n```\n\n对于本方法，我们将创建数据库 `pysparkbookdb`：\n\n```\npostgres=#\
  \ create database pysparkbookdb;\n```\n\n输出如下：\n\n```\nCREATE DATABASE\n```\n\n\
  我们可以检查数据库是否已成功创建。以下 SQL `select` 命令获取数据库服务器上所有存在的数据库：\n\n```\npostgres=# SELECT\
  \ datname FROM pg_database;\n结果：\ndatname\n\ntemplate1\ntemplate0\npostgres\nmetastore\n\
  pymetastore\npysparkbookdb\n(6 rows)\n```\n\n我们可以看到 `pysparkbookdb` 数据库已成功创建。\n\n\
  创建 `pysparkbookdb` 数据库后，我们必须连接到该数据库。我们可以使用 `\\c` 命令连接到数据库，该命令代表连接。连接到数据库后，我们将创建一个表\
  \ `studentTable`。然后将学生数据插入到该表中。\n\n```\npostgres=# \\c pysparkbookdb\n```\n\n你现在已作为用户\
  \ `postgres` 连接到 `pysparkbookdb` 数据库。让我们也创建所需的表：\n\n```\npysparkbookdb=# create\
  \ table studentTable(\npysparkbookdb(# studentID char(50) not null,\npysparkbookdb(#\
  \ name char(50) not  null,\npysparkbookdb(# gender char(5) not null\npysparkbookdb(#\
  \ );\nCREATE TABLE\n```\n\n我们已经在 RDBMS 中创建了 `studentTable` 表。`\\d` 命令如果与表名一起使用，会提供该表的模式；但如果该命令不带任何参数使用，则会打印该特定数据库中的所有表。在以下几行中，我们打印\
  \ `studentTable` 表的模式：\n\n```\npysparkbookdb=# \\d  studentTable\n```\n\n输出如下：\n\
  \n```\nTable \"public.studenttable\"\nColumn   |     Type      | Modifiers\n-----------+---------------+-----------\n\
  studentid | character(50) | not null\nname      | character(50) | not null\ngender\
  \    | character(5)  | not null\n```\n\n让我们向表中插入一些数据。我们将插入五条学生记录：\n\n```\ninsert\
  \ into studentTable values ('si1', 'Robin', 'M');\ninsert into studentTable values\
  \ ('si2', 'Maria', 'F');\ninsert into studentTable values ('si3', 'Julie',   'F');\n\
  insert into studentTable values ('si4', 'Bob',   'M');\ninsert into studentTable\
  \ values ('si6','William','M');\n```\n\n记录已插入表中。我们可以使用 SQL `select` 命令查看表数据。\n\n\
  ```\npysparkbookdb=# select * from studentTable;\n```\n\n输出如下：\n\n```\nstudentid\
  \         |               name                |  gender\n------------------------+----------------------------------\
  \ +--------\nsi1          |               Robin               |    M\nsi2      \
  \    |               Maria               |    F\nsi3          |               Julie\
  \               |    F\nsi4          |               Bob                 |    M\n\
  si6          |               William             |    M\n(5 rows)\n```\n\n我们已经创建了一个表并插入了记录。\n\
  \n#### 步骤 8-5-1. 从 PostgreSQL 数据库读取学生数据表\n\n我们知道学生数据存在于 PostgreSQL 服务器的 `studentTable`\
  \ 表中。我们需要从 `pysparkbookdb` 数据库中的 `studentTable` 读取数据。为了将 PySpark 连接到 PostgreSQL\
  \ 服务器，我们需要一个数据库 JDBC 连接器。我们将使用以下命令启动 PySpark Shell：\n\n\n\n\n```bash\npyspark --driver-class-path\
  \ .ivy2/jars/org.postgresql_postgresql-9.4.1212.jar --packages org.postgresql:postgresql:9.4.1212\n\
  ```\n\n启动包含连接器 JAR 包的 PySpark shell 后，我们可以使用 `spark.read` 函数读取表数据：\n\n```python\n\
  >>> dbURL=\"jdbc:postgresql://localhost/pysparkbookdb?user=postgres&password=''\"\
  \n```\n\n我们已经创建了数据库 URL。我们使用 `postgres` 用户连接到 `pysparkbookdb` 数据库。`postgres` 用户没有密码。PostgreSQL\
  \ 服务器运行在 localhost 机器上。我们将使用 `spark.read` 函数从 PostgreSQL 服务器读取数据。\n\n```python\n\
  >>> studentsDataFrame = spark.read.format('jdbc').options(\nurl = dbURL,\ndatabase='pysparkbookdb',\n\
  dbtable='studenttable'\n).load()\n```\n\n在 `options` 部分，我们提供了数据库的 URL、`database`\
  \ 参数的数据库名称以及 `dbtable` 参数的表名。我们读取了表数据，这些数据被转换成了 DataFrame `studentsDataFrame`。让我们检查一下\
  \ `studentsDataFrame`：\n\n```python\n>>> studentsDataFrame.show()\n```\n\n输出如下：\n\
  \n```\n+--------------------+--------------------+------+\n|           studentid|\
  \                name|gender|\n+--------------------+--------------------+------+\n\
  |si1              ...|Robin            ...| M    |\n|si2              ...|Maria\
  \            ...| F    |\n|si3              ...|Julie            ...| F    |\n|si4\
  \              ...|Bob              ...| M    |\n|si6              ...|William \
  \         ...| M    |\n+--------------------+--------------------+------+\n```\n\
  \n我们得到了所需的学生 DataFrame。但是，你看到我们的 DataFrame 有什么问题吗？再看一眼。你看到 DataFrame 中的省略号 (. .\
  \ .) 了吗？我们必须删除它们。我们可以通过对列应用 `trim()` 函数来做到这一点。\n\n要修剪字符串，我们必须导入 `trim()` 函数。该函数位于子模块\
  \ `pyspark.sql.functions` 中。导入 `trim()` 函数后，我们可以使用它从列中删除点，如下所示：\n\n```python\n>>>\
  \ from pyspark.sql.functions import trim\n>>> studentsDataFrame = studentsDataFrame.select(trim(studentsDataFrame.studentid),trim(studentsDataFrame.name),studentsDataFrame.gender)\n\
  ```\n\n让我们打印一下，看看是否解决了问题：\n\n```python\n>>> studentsDataFrame.show()\n```\n\n输出如下：\n\
  \n```\n+---------------+----------+------+\n|trim(studentid)|trim(name)|gender|\n\
  +---------------+----------+------+\n|            si1|     Robin| M    |\n|    \
  \        si2|     Maria| F    |\n|            si3|     Julie| F    |\n|        \
  \    si4|       Bob| M    |\n|            si6|   William| M    |\n+---------------+----------+------+\n\
  ```\n\n我们解决了问题。但你确定所有问题都解决了吗？DataFrame 列的名称怎么办？现在我们必须更改列名，使其更清晰：\n\n```python\n\
  >>> studentsDataFrame = studentsDataFrame.withColumnRenamed('trim(studentid)', 'studentID').withColumnRenamed('trim(name)','Name').withColumnRenamed('gender',\
  \ 'Gender')\n```\n\n你可以通过打印 schema 来查看更改后的列名：\n\n```python\n>>> studentsDataFrame.printSchema()\n\
  ```\n\n输出如下：\n\n```\nroot\n|-- studentID: string (nullable = false)\n|-- Name: string\
  \ (nullable = false)\n|-- Gender: string (nullable = false)\n```\n\n我们的列名现在是可读格式。我们应该通过打印\
  \ DataFrame 来检查一切是否合适：\n\n```python\n>>> studentsDataFrame.show()\n```\n\n输出如下：\n\
  \n```\n+---------+-------+------+\n|studentID|   Name|Gender|\n+---------+-------+------+\n\
  |      si1|  Robin| M    |\n|      si2|  Maria| F    |\n|      si3|  Julie| F  \
  \  |\n|      si4|    Bob| M    |\n|      si6|William| M    |\n+---------+-------+------+\n\
  ```\n\n现在我们可以继续学习 DataFrame 连接了。\n\n#### 步骤 8-5-2. 从 JSON 文件读取科目数据\n\n让我们从 `subjects.json`\
  \ 文件中读取科目数据：\n\n```python\n>>> subjectsDataFrame = sqlContext.read.format(\"json\"\
  ).load('/home/pysparkbook/pysparkBookData/subjects.json')\n```\n\n我们有了另一个 DataFrame\
  \ `subjectsDataFrame`。让我们使用 `show()` 函数来调查一下 `subjectsDataFrame`：\n\n```python\n\
  >>> subjectsDataFrame.show()\n```\n\n输出如下：\n\n```\n+---------+-------+\n|studentID|subject|\n\
  +---------+-------+\n|      si1| Python|\n|      si3|   Java|\n|      si1|   Java|\n\
  |      si2| Python|\n|      si3|   Ruby|\n|      si4|    C++|\n|      si5|     \
  \ C|\n|      si4| Python|\n|      si2|   Java|\n+---------+-------+\n>>> subjectsDataFrame.printSchema()\n\
  ```\n\n输出如下：\n\n```\nroot\n|-- studentID: string (nullable = true)\n|-- subject:\
  \ string (nullable = true)\n```\n\n#### 步骤 8-5-3. 对 DataFrame 执行内连接\n\n我们有两个 DataFrame，`subjectsDataFrame`\
  \ 和 `studentsDataFrame`。在两个 DataFrame 中，我们必须在 `studentID` 列上执行连接。该列是两个 DataFrame\
  \ 共有的。内连接返回具有匹配键值的记录。如果我们查看两个 DataFrame 中 `studentID` 列的值，会发现值 `si1`、`si2`、`si3`\
  \ 和 `si4` 是两个 DataFrame 共有的。因此，内连接将仅返回这些值的记录。\n\n```python\n>>> joinedDataInner\
  \ = subjectsDataFrame.join(studentsDataFrame, subjectsDataFrame.studentID==studentsDataFrame.studentID,\
  \ how='inner')\n>>> joinedDataInner.show()\n```\n\n输出如下：\n\n```\n+---------+-------+---------+-----+------+\n\
  |studentID|subject|studentID| Name|Gender|\n+---------+-------+---------+-----+------+\n\
  |      si1|   Java|      si1|Robin| M    |\n|      si1| Python|      si1|Robin|\
  \ M    |\n|      si2|   Java|      si2|Maria| F    |\n|      si2| Python|      si2|Maria|\
  \ F    |\n|      si3|   Ruby|      si3|Julie| F    |\n|      si3|   Java|      si3|Julie|\
  \ F    |\n|      si4| Python|      si4|  Bob| M    |\n|      si4|    C++|      si4|\
  \  Bob| M    |\n+---------+-------+---------+-----+------+\n```\n\n在生成的 DataFrame\
  \ `joinedDataInner` 中，可以很容易地观察到我们有学生 ID `si1`、`si2`、`si3` 和 `si4`。\n\n#### 步骤 8-5-4.\
  \ 将内连接后的 DataFrame 保存为 JSON 文件\n\n完成分析后，我们通常会将结果保存在某个地方。这里我们将把 DataFrame `joinedDataInner`\
  \ 保存为一个 JSON 文件。让我们看看 `joinedDataInner` 中的列；可以看到 `studentID` 列出现了两次。如果我们以相同格式保存数据，它会抛出\
  \ `pyspark.sql.utils.AnalysisException` 异常。因此，我们必须首先删除重复的列。为此，`select()` 函数将非常有用。以下代码删除了重复的\
  \ `studentID` 列：\n\n```python\n>>> joinedDataInner = joinedDataInner.select(subjectsDataFrame.studentID,'subject',\
  \ 'Name', 'Gender')\n```\n\nDataFrame 的列如下所示：\n\n```python\n>>> joinedDataInner.columns\n\
  ['studentID', 'subject', 'Name', 'Gender']\n```\n\n重复的 `studentID` 列已被删除。以下代码将 DataFrame\
  \ 保存为 `innerJoinedTable` 目录内的 JSON 文件：\n\n```python\n>>> joinedDataInner.write.format('json').save('/home/muser/innerJoinedTable')\n\
  ```\n\n我们应该看看 `innerJoinedTable` 目录下保存了什么内容：\n\n```bash\ninnerJoinedTable$ ls\n\
  ```\n\n输出如下：\n\n```\npart-r-00000-77838a67-4a1f-441a-bb42-4cd03be525a9.json  _SUCCESS\n\
  ```\n\n`ls` 命令显示目录内有两个文件。JSON 文件包含我们的数据，第二个文件告诉我们数据已成功写入。现在你想知道 JSON 文件里面是什么。`cat`\
  \ 命令最适合做这个工作：\n\n```bash\ninnerJoinedTable$ cat part-r-00000-77838a67-4a1f-441a-bb42-4cd03be525a9.json\n\
  ```\n\n输出如下：\n\n\n```json\n\n```\n{\"studentID\":\"si1\",\"subject\":\"Java\",\"\
  Name\":\"Robin\",\"Gender\":\"M    \"}\n{\"studentID\":\"si1\",\"subject\":\"Python\"\
  ,\"Name\":\"Robin\",\"Gender\":\"M    \"}\n{\"studentID\":\"si2\",\"subject\":\"\
  Java\",\"Name\":\"Maria\",\"Gender\":\"F    \"}\n{\"studentID\":\"si2\",\"subject\"\
  :\"Python\",\"Name\":\"Maria\",\"Gender\":\"F    \"}\n{\"studentID\":\"si3\",\"\
  subject\":\"Ruby\",\"Name\":\"Julie\",\"Gender\":\"F    \"}\n{\"studentID\":\"si3\"\
  ,\"subject\":\"Java\",\"Name\":\"Julie\",\"Gender\":\"F    \"}\n{\"studentID\":\"\
  si4\",\"subject\":\"Python\",\"Name\":\"Bob\",\"Gender\":\"M    \"}\n{\"studentID\"\
  :\"si4\",\"subject\":\"C++\",\"Name\":\"Bob\",\"Gender\":\"M    \"}\n```\n\n我们又成功完成了一项工作。\n\
  \n#### 步骤 8-5-5. 执行左外连接\n\n接下来，我们将执行左外连接。在左外连接中，`subjectsDataFrame` 数据框的 `studentID`\
  \ 列中的每个值都会被考虑，即使在 `studentsDataFrame` 数据框的 `studentID` 列中没有匹配项。对于左外连接，我们需要将 `left_outer`\
  \ 作为 `join()` 函数中 `how` 参数的值。\n\n```\n>>> joinedDataLeftOuter = subjectsDataFrame.join(studentsDataFrame,\
  \ subjectsDataFrame.studentID==studentsDataFrame.studentID, how='left_outer')\n\
  >>> joinedDataLeftOuter.show()\n```\n\n以下是输出结果：\n\n```\n+---------+-------+---------+-----+------+\n\
  |studentID|subject|studentID| Name|Gender|\n+---------+-------+---------+-----+------+\n\
  |      si5|      C|     null| null|  null|\n|      si2| Python|      si2|Maria|\
  \ F    |\n|      si2|   Java|      si2|Maria| F    |\n|      si4|    C++|      si4|\
  \  Bob| M    |\n|      si4| Python|      si4|  Bob| M    |\n|      si3|   Java|\
  \      si3|Julie| F    |\n|      si3|   Ruby|      si3|Julie| F    |\n|      si1|\
  \ Python|      si1|Robin| M    |\n|      si1|   Java|      si1|Robin| M    |\n+---------+-------+---------+-----+------+\n\
  ```\n\n左外连接生成的表显示，属于 `subjectsDataFrame` 中 `studentID` 列的 `si5` 也出现在了连接后的表中。\n\n\
  #### 步骤 8-5-6. 将左外连接后的 DataFrame 保存到 PostgreSQL\n\n将结果数据保存到 PostgreSQL 数据库有助于数据分析师将数据妥善保管。其他用户可以将这些结果数据用于多种用途。现在让我们将结果保存到\
  \ PostgreSQL 数据库中。\n\n同样，在将数据保存到 PostgreSQL 数据库之前，我们需要删除重复的列：\n\n```\n>>> joinedDataLeftOuter\
  \ = joinedDataLeftOuter.select(subjectsDataFrame.studentID,'subject', 'Name', 'Gender')\n\
  ```\n\n最好检查一下数据是否已正确保存到数据库中。`\\d` 命令将打印 PostgreSQL 数据库中所有现有的表。我们已经创建了数据库 `pysparkbookdb`，现在我们要将\
  \ DataFrame 保存到同一个数据库中：\n\n```\npysparkbookdb=# \\d\n```\n\n以下是输出结果：\n\n```\n关联列表\n\
  架构  |      名称      |  类型  |  拥有者\n--------+---------------+-------+----------\n\
  public | studenttable  | table | postgres\n(1 行)\n```\n\n`\\d` 命令显示，在 `pysparkbookdb`\
  \ 数据库中，我们只有一个表 `studenttable`。现在让我们保存 DataFrame：\n\n```\n>>> props = { 'user' :\
  \ 'postgres', 'password' : '' }\n>>> joinedDataLeftOuter.write.jdbc(\n...      \
  \                           url   = dbURL,\n...                                \
  \ table = 'joineddataleftoutertable',\n...                                 mode\
  \  = 'overwrite',\n...                                 properties = props\n... \
  \                               )\n```\n\n上述代码将 DataFrame 保存到 `joineddataleftoutertable`\
  \ 表中。它还定义了变量 `dbURL`。`mode` 参数的值为 `overwrite`，这意味着如果之前存在数据，它将会覆盖。\n\n将数据保存到 PostgreSQL\
  \ 后，我们应该再次检查一下。我们再次使用 `\\d` 命令查看 `pysparkbookdb` 数据库中的所有表：\n\n```\npysparkbookdb=#\
  \ \\d\n```\n\n以下是输出结果：\n\n```\n关联列表\n架构  |          名称           |  类型  |  拥有者\n\
  --------+--------------------------+-------+----------\npublic | joineddataleftoutertable\
  \ | table | postgres\npublic | studenttable             | table | postgres\n(2 行)\n\
  ```\n\n现在，我们的 DataFrame 已作为 `joineddataleftoutertable` 表保存在 `pysparkbookdb` 数据库中。让我们使用\
  \ `select` 命令检查表中的值：\n\n```\npysparkbookdb=# select * from joineddataleftoutertable;\n\
  ```\n\n以下是输出结果：\n\n```\nstudentID | subject | Name  | Gender\n-----------+---------+-------+--------\n\
  si5       | C       |       |\nsi2       | Python  | Maria | F\nsi2       | Java\
  \    | Maria | F\nsi4       | C++     | Bob   | M\nsi4       | Python  | Bob   |\
  \ M\nsi3       | Java    | Julie | F\nsi3       | Ruby    | Julie | F\nsi1     \
  \  | Python  | Robin | M\nsi1       | Java    | Robin | M\n(9 行)\n```\n\n为了后续使用结果数据，我们已将其保存到\
  \ PostgreSQL 数据库中。完成左外连接后，我们将对 DataFrame 执行右外连接。\n\n#### 步骤 8-5-7. 执行右外连接\n\n在右外连接中，会考虑\
  \ `studentsDataFrame` 的 `studentID` 列中的每个值。\n\n```\n>>> joinedDataRightOuter = subjectsDataFrame.join(studentsDataFrame,\
  \ subjectsDataFrame.studentID==studentsDataFrame.studentID, how='right_outer')\n\
  >>> joinedDataRightOuter.show()\n```\n\n以下是输出结果：\n\n```\n+---------+-------+---------+-------+------+\n\
  |studentID|subject|studentID|   Name|Gender|\n+---------+-------+---------+-------+------+\n\
  |      si1|   Java|      si1|  Robin| M    |\n|      si1| Python|      si1|  Robin|\
  \ M    |\n|      si2|   Java|      si2|  Maria| F    |\n|      si2| Python|    \
  \  si2|  Maria| F    |\n|      si3|   Ruby|      si3|  Julie| F    |\n|      si3|\
  \   Java|      si3|  Julie| F    |\n|      si4| Python|      si4|    Bob| M    |\n\
  |      si4|    C++|      si4|    Bob| M    |\n|     null|   null|      si6|William|\
  \ M    |\n+---------+-------+---------+-------+------+\n```\n\n#### 步骤 8-5-8. 执行全外连接\n\
  \n全外连接会合并键列中的所有值：\n\n```\n>>> joinedDataOuter = subjectsDataFrame.join(studentsDataFrame,\
  \ subjectsDataFrame.studentID==studentsDataFrame.studentID, how='outer')\n>>> joinedDataOuter.show()\n\
  ```\n\n以下是输出结果：\n\n```\n+---------+-------+---------+-------+------+\n|studentID|subject|studentID|\
  \   Name|Gender|\n+---------+-------+---------+-------+------+\n|      si5|    \
  \  C|     null|   null|  null|\n|      si2| Python|      si2|  Maria| F    |\n|\
  \      si2|   Java|      si2|  Maria| F    |\n|      si4|    C++|      si4|    Bob|\
  \ M    |\n|      si4| Python|      si4|    Bob| M    |\n|      si3|   Java|    \
  \  si3|  Julie| F    |\n|      si3|   Ruby|      si3|  Julie| F    |\n|     null|\
  \   null|      si6|William| M    |\n|      si1| Python|      si1|  Robin| M    |\n\
  |      si1|   Java|      si1|  Robin| M    |\n+---------+-------+---------+-------+------+\n\
  ```\n\n# 方案 8-6. 使用 GraphFrames 执行广度优先搜索\n\n### 问题\n\n您希望使用 GraphFrames 执行广度优先搜索。\n\
  \n### 解决方案\n\n广度优先搜索是一种非常流行的算法，可用于查找两个给定节点之间的最短距离。图 8-1 展示了一个给定的图。它有七个节点：A、B、C、D、E、F\
  \ 和 G。\n\n![A430628_1_En_8_Fig1_HTML.gif](img/A430628_1_En_8_Fig1_HTML.gif)\n\n\
  **图 8-1.** 一个图\n\n如果我们查看节点之间的连接，会发现以下信息：\n\n```\nA – C – B\nB – A – C – G – F\n\
  C – A – B – F – D\nD – C – F – E\nE – D – F\nF – B – C – D -- E – G\nG – B – F\n\
  ```\n\n让我解释一下这个结构。请看第一行。这一行 A – C – B 告诉我们节点 A 与 B 和 C 相连。\n\n您希望执行广度优先搜索并找到节点之间的最短距离。为此，我们将使用一个外部库\
  \ GraphFrames。我们可以非常轻松地将 PySpark 与 GraphFrames 结合使用。GraphFrames 提供了基于 DataFrame\
  \ 的图。\n\n### 工作原理\n\n```\n\n\n\n要使用`GraphFrames`，首先需要像引入`PostgreSQL`连接器`JAR`文件那样引入它。我们将通过使用`GraphFrames\
  \ JAR`来启动`PySpark shell`。这里使用`GraphFrames`版本`0.4.0`。\n\n```bash\n$ pyspark --packages\
  \ graphframes:graphframes:0.4.0-spark2.0-s_2.11\n```\n\n`GraphFrames`包已添加。现在我们将使用`GraphFrames`运行广度优先搜索。\n\
  \n### 第 8-6-1 步：创建给定图的顶点 DataFrame\n\n我们知道`GraphFrames`运行在`PySparkSQL DataFrame`上。让我们创建一个顶点`DataFrame`。我们已经知道如何创建`DataFrame`。我们将执行与第\
  \ 8-1 节中相同的步骤：\n\n```python\n>>> from pyspark.sql.types import *\n>>> from pyspark.sql\
  \ import Row\n>>> verticesDataList = ['A', 'B', 'C', 'D', 'E', 'F', 'G']\n>>> verticesSchema\
  \ = StructType([StructField('id',StringType(),True)])\n>>> verticesRDD = sc.parallelize(verticesDataList,\
  \ 4)\n>>> verticesRDDRows = verticesRDD.map(lambda data : Row(data[0]))\n>>> verticesDataFrame\
  \ = sqlContext.createDataFrame(verticesRDDRows, verticesSchema)\n>>> verticesDataFrame.show(4)\n\
  ```\n\n以下是输出结果，仅显示前四行：\n\n```plaintext\n+---+\n| id|\n+---+\n|  A|\n|  B|\n|  C|\n\
  |  D|\n+---+\n```\n\n我们已经创建了顶点`DataFrame`。相信您已经注意到，顶点`DataFrame`的列名是`id`。可以为顶点`DataFrame`的列使用其他名称吗？答案是否定的。将列命名为`id`是强制性的。接下来让我们创建一个边`DataFrame`。\n\
  \n### 第 8-6-2 步：创建给定图的边 DataFrame\n\n我们必须创建一个边`DataFrame`。首先创建一个元组列表；每个元组将包含一条边的源节点和目标节点：\n\
  \n```python\n>>> edgeDataList = [('A','C'),('A','B'),('B','A'),('B','C'),('B','G'),('B','F'),('C','A'),\n\
  ('C','B'),('C','F'),('C','D'),('D','C'),('D','F'),('D','E'),('E','D'),\n('E','F'),('F','B'),('F','C'),('F','D'),('F','E'),('F','G'),('G','B'),\n\
  ('G','F')]\n```\n\n创建边列表后，需要使用`parallelize()`函数将此列表并行化。我们将这些数据并行化到四个分区中：\n\n```python\n\
  >>> edgeRDD = sc.parallelize(edgeDataList, 4)\n```\n\n我们已经创建了边列表的`RDD`。\n\n```python\n\
  >>> edgeRDD.take(4)\n```\n\n以下是输出结果：\n\n```plaintext\n[('A', 'C'),\n('A', 'B'),\n\
  ('B', 'A'),\n('B', 'C')]\n```\n\n创建边`RDD`后，需要创建行的`RDD`以创建`DataFrame`。以下代码行创建了`Row`对象的`RDD`：\n\
  \n```python\n>>> edgeRDDRows = edgeRDD.map( lambda data : Row(data[0], data[1]))\n\
  >>> edgeRDDRows.take(4)\n```\n\n以下是输出结果：\n\n```plaintext\n[Row('A', 'C'),\n Row('A',\
  \ 'B'),\n Row('B', 'A'),\n Row('B', 'C')]\n```\n\n我们的边`DataFrame`需要一个模式。我们必须为源节点列和目标节点列创建列模式。然后，使用`StructType()`函数，我们将为边`DataFrame`创建一个模式。\n\
  \n```python\n>>> sourceColumn = StructField('src', StringType(),True)\n>>> destinationColumn\
  \ = StructField('dst', StringType(), True)\n>>> edgeSchema = StructType([sourceColumn,\
  \ destinationColumn])\n```\n\n您是否注意到，对于`sourceColumn`，我们将其命名为`src`；对于`destinationColumn`，我们将其命名为`dst`？这也是强制性的；这是`GraphFrames`的语法要求。`DataFrame`的模式已创建。下一步，显而易见，是创建`DataFrame`：\n\
  \n```python\n>>> edgeDataFrame = sqlContext.createDataFrame(edgeRDDRows, edgeSchema)\n\
  >>> edgeDataFrame.show(5)\n```\n\n以下是输出结果，仅显示前五行：\n\n```plaintext\n+---+---+\n|src|dst|\n\
  +---+---+\n|  A|  C|\n|  A|  B|\n|  B|  A|\n|  B|  C|\n|  B|  G|\n+---+---+\n```\n\
  \n### 第 8-6-3 步：创建 GraphFrames 对象\n\n此时，我们有`verticesDataFrame`（一个顶点`DataFrame`）和`edgeDataFrame`（一个边`DataFrame`）。使用这两个`DataFrame`，我们可以创建图。在`GraphFrames`中，我们可以使用以下代码行创建图：\n\
  \n```python\n>>> import graphframes.graphframe  as gfm\n>>> ourGraph = gfm.GraphFrame(verticesDataFrame,\
  \ edgeDataFrame)\n```\n\n\n\n\n`GraphFrame` Python 类定义在 `graphframes.graphframe`\
  \ 子模块下。`GraphFrame()` 接收顶点和边的 DataFrame，并返回一个 GraphFrames 对象。我们得到了 GraphFrames 对象\
  \ `ourGraph`。可以按如下方式获取所有顶点：\n\n```\n>>> ourGraph.vertices.show(5)\n```\n\n以下是输出结果，仅显示前五行：\n\
  \n```\n+---+\n| id|\n+---+\n|  A|\n|  B|\n|  C|\n|  D|\n|  E|\n+---+\n```\n\n我们也可以获取边，以下是前五行：\n\
  \n```\n>>> ourGraph.edges.show(5)\n+---+---+\n|src|dst|\n+---+---+\n|  A|  C|\n\
  |  A|  B|\n|  B|  A|\n|  B|  C|\n|  B|  G|\n+---+---+\n```\n\n#### 步骤 8-6-4. 运行广度优先搜索算法\n\
  \n我们已经从所需数据创建了一个图。现在可以在 `ourGraph` 图上运行广度优先算法。`bfs()` 函数是 GraphFrames 中广度优先搜索（BFS）的实现。该函数定义在\
  \ GraphFrames 对象上，因此我们可以在 GraphFrames 对象 `ourGraph` 上运行此 BFS。我们想要获取节点 D 和节点 G 之间的最短路径。第一个参数\
  \ `fromExpr` 是一个表达式，指明我们应从节点 D 开始 BFS。第二个参数是 `toExpr`，`toExpr` 的值表明搜索的目标节点是 G。\n\
  \n```\n>>> bfsPath = ourGraph.bfs(fromExpr=\"id='D'\", toExpr = \"id='G'\")\n>>>\
  \ bfsPath.show()\n```\n\n以下是输出结果：\n\n```\n+----+-----+---+-----+---+\n|from|   e0|\
  \ v1|   e1| to|\n+----+-----+---+-----+---+\n| [D]|[D,F]|[F]|[F,G]|[G]|\n+----+-----+---+-----+---+\n\
  ```\n\nBFS 的输出非常清晰。`from` 列中的 `[D]` 表示 BFS 的起始节点是 D。`to` 列中的 `[G]` 表示 BFS 的目标节点是\
  \ G。D 和 G 之间的最短路径是 D 到 F，再到 G。\n\n> **注意**\n> \n> 您可以通过以下网页了解更多关于 GraphFrames 的信息：\n\
  > \n> [`https://graphframes.github.io/user-guide.html`](https://graphframes.github.io/user-guide.html)\n\
  > \n> [`https://graphframes.github.io/quick-start.html`](https://graphframes.github.io/quick-start.html)\n\
  > \n> [`https://graphframes.github.io/api/python/index.html`](https://graphframes.github.io/api/python/index.html)\n\
  \n## 配方 8-7. 使用 GraphFrames 计算 PageRank\n\n### 问题\n\n您想使用 GraphFrames 执行 PageRank\
  \ 算法。\n\n### 解决方案\n\n我们已在第 [5] 章讨论了 PageRank。我们使用了与上一章相同的网页图。您想使用 DataFrame 运行 PageRank\
  \ 算法。图 [8-2] 展示了网页的网络结构。\n\n![A430628_1_En_8_Fig2_HTML.gif](img/A430628_1_En_8_Fig2_HTML.gif)\n\
  \n**图 8-2. 网页图**\n\n### 工作原理\n\n首先，我们必须为给定的图创建一个 GraphFrames 对象。然后需要创建一个顶点 DataFrame\
  \ 和一个边 DataFrame。\n\n#### 步骤 8-7-1. 创建顶点 DataFrame\n\n我们有一个包含四个节点的图。这四个节点分别是 `a`、`b`、`c`\
  \ 和 `d`。首先，创建这四个节点的列表：\n\n```\n>>> verticesList  = ['a', 'b', 'c', 'd']\n>>> verticesListRDD\
  \ = sc.parallelize(verticesList, 4)\n>>> verticesListRowsRDD = verticesListRDD.map(\
  \ lambda data : Row(data))\n>>> verticesListRowsRDD.collect()\n```\n\n以下是输出结果：\n\
  \n```\n[Row(data='a'), Row(data='b'), Row(data='c'), Row(data='d')]\n>>> verticesSchema\
  \ = StructType([StructField('id', StringType(), True)])\n>>> verticesDataFrame =\
  \ sqlContext.createDataFrame(verticesListRowsRDD, verticesSchema)\n>>> verticesDataFrame.show()\n\
  +---+\n| id|\n+---+\n|  a|\n|  b|\n|  c|\n|  d|\n+---+\n```\n\n我们已经创建了顶点 DataFrame。现在需要创建边\
  \ DataFrame。\n\n#### 步骤 8-7-2. 创建边 DataFrame\n\n创建边 DataFrame 的步骤与许多之前的配方类似。首先，创建一个边的列表，列表中的每条边由一个元组定义。然后，创建一个边的\
  \ RDD。接着，将 RDD 转换为行对象的 RDD。最后，创建边 DataFrame 的 schema 和 DataFrame。让我们执行这些步骤：\n\n\n\
  ```markdown\n\n```python\n>>> edgeDataList = [('a','b'), ('a','c'), ('a','d'), ('b',\
  \ 'c'),\n('b', 'd'),('c', 'b'), ('d', 'a'), ('d', 'c')]\n>>> sourceColumn = StructField('src',\
  \ StringType(),True)\n>>> destinationColumn = StructField('dst', StringType(), True)\n\
  >>> edgeSchema = StructType([sourceColumn, destinationColumn])\n>>> edgeRDD = sc.parallelize(edgeDataList,\
  \ 4)\n>>> edgeRDD.take(4)\n```\n\n以下是输出结果：\n\n```\n[('a', 'b'),\n('a', 'c'),\n('a',\
  \ 'd'),\n('b', 'c')]\n>>> edgeRDDRows = edgeRDD.map( lambda data : Row(data[0],\
  \ data[1]))\n>>> edgeRDDRows.take(4)\n```\n\n以下是输出结果：\n\n```\n[,\n,\n,\n]\n>>> edgeDataFrame\
  \ = sqlContext.createDataFrame(edgeRDDRows, edgeSchema)\n>>> edgeDataFrame.show(5)\n\
  ```\n\n以下是输出结果，仅显示前五行：\n\n```\n+---+---+\n|src|dst|\n+---+---+\n|  a|  b|\n|  a|\
  \  c|\n|  a|  d|\n|  b|  c|\n|  b|  d|\n+---+---+\n```\n\n我们已经创建了一个边构成的 DataFrame。现在来创建一个图。\n\
  \n### 步骤 8-7-3\\. 创建图\n\n创建图的过程与之前食谱中的方法相同：\n\n```python\n>>> import graphframes.graphframe\
  \  as gfm\n>>> ourGraph = gfm.GraphFrame(verticesDataFrame, edgeDataFrame)\n>>>\
  \ ourGraph.vertices.show(5)\n```\n\n以下是输出结果：\n\n```\n+---+\n| id|\n+---+\n|  a|\n\
  |  b|\n|  c|\n|  d|\n+---+\n>>> ourGraph.edges.show(5)\n```\n\n以下是输出结果，仅显示前五行：\n\
  \n```\n+---+---+\n|src|dst|\n+---+---+\n|  a|  b|\n|  a|  c|\n|  a|  d|\n|  b| \
  \ c|\n|  b|  d|\n+---+---+\n```\n\n### 步骤 8-7-4\\. 运行 PageRank 算法\n\n通过使用定义在`GraphFrames`对象上的`pageRank()`函数，可以计算页面的\
  \ PageRank 值：\n\n```python\n>>> pageRanks = ourGraph.pageRank(resetProbability=0.15,\
  \ tol=0.01)\n```\n\n你可能想知道`pageRank()`函数的返回类型。我们通过打印来查看：\n\n```python\n>>> pageRanks\n\
  ```\n\n以下是输出结果：\n\n```\nGraphFrame(v:[id: string, pagerank: double], e:[src: string,\
  \ dst: string ... 1 more field])\n```\n\n`pageRank()`函数返回一个`GraphFrame`对象。返回的`GraphFrame`对象包含顶点和边。该对象中的顶点部分包含网页及其对应的\
  \ PageRank 值。让我们探索一下`pageRanks`的边部分包含什么：\n\n```python\n>>> pageRanks.edges.show()\n\
  ```\n\n以下是输出结果：\n\n```\n+---+---+------------------+\n|src|dst|            weight|\n\
  +---+---+------------------+\n|  d|  a|               0.5|\n|  b|  d|          \
  \     0.5|\n|  a|  b|0.3333333333333333|\n|  a|  d|0.3333333333333333|\n|  d|  c|\
  \               0.5|\n|  a|  c|0.3333333333333333|\n|  b|  c|               0.5|\n\
  |  c|  b|               1.0|\n+---+---+------------------+\n```\n\n可以观察到，`pageRanks`对象的边部分由边及其对应的权重组成：\n\
  \n```python\n>>> pageRanks.vertices.select('id','pagerank')\n```\n\n以下是输出结果：\n\n\
  ```\nDataFrame[id: string, pagerank: double]\n>>> pageRanks.vertices.select('id','pagerank').show()\n\
  ```\n\n以下是输出结果：\n\n```\n+---+------------------+\n| id|          pagerank|\n+---+------------------+\n\
  |  a|0.4831888601952005|\n|  b| 1.238562817904233|\n|  d| 0.806940642367432|\n|\
  \  c|1.1401295025626326|\n+---+------------------+\n```\n\n最终，我们得到了给定页面的 PageRank\
  \ 值。\n\n## 食谱 8-8\\. 从 Apache Hive 读取数据\n\n### 问题\n\n你想从 Apache Hive 中读取表数据。\n\n\
  ### 解决方案\n\n我们在 Hive 中有一个名为`filamentdata`的表。这与我们在许多食谱中使用的灯丝数据相同。我们需要使用 PySparkSQL\
  \ 从 Apache Hive 中读取这些数据。让我们看一下整个过程。首先，我们将在 Hive 中创建一个表并将数据上传到其中。我们从创建`filamentdata`表开始。我们将在\
  \ Hive 的`apress`数据库中创建表。我们在第 2 章安装时创建了这个数据库。但让我们检查一下它是否仍然存在。我们可以使用`show`命令显示 Hive\
  \ 中的所有数据库：\n\n```\nhive> show databases;\n```\n\n以下是输出结果：\n\n```\nOK\napress\ndefault\n\
  Time taken: 3.275 seconds, Fetched: 2 row(s)\n```\n\n我们有一个名为`apress`的数据库。因此，我们需要使用`use`命令来使用这个数据库：\n\
  \n```\nhive> use apress;\n```\n\n以下是输出结果：\n\n```\nOK\nTime taken: 0.125 seconds\n\
  ```\n\n使用数据库后，我们使用以下命令创建一个名为`filamenttable`的表：\n\n```\nhive> create table filamenttable\
  \ (\n>  filamenttype string,\n>  bulbpower string,\n>   lifeinhours float\n>)\n\
  > row format delimited\n> fields terminated by ',';\n```\n\n我们创建了一个包含三列的 Hive 表。第一列是`filamenttype`，类型为`string`。第二列是`bulbpower`，数据类型为`string`。第三列是`lifeinhours`，类型为`float`。现在我们可以使用`show`命令来显示我们的表：\n\
  \n```\nhive> show tables;\n```\n\n以下是输出结果：\n\n```\nOK\nfilamenttable\nTime taken:\
  \ 0.118 seconds, Fetched: 1 row(s)\n```\n\n所需的表已成功创建。让我们将数据加载到我们创建的表中。我们将使用`load`命令从本地目录将数据加载到\
  \ Hive 中。以下命令中的`local`子句告诉 Hive 数据是从本地目录中的文件加载的，而不是从 HDFS 加载的。\n\n```\nhive> load\
  \ data local inpath '/home/pysparkbook/pysparkBookData/filamentData.csv' overwrite\
  \ into table filamenttable;\n```\n\n以下是输出结果：\n\n```\nLoading data to table apress.filamenttable\n\
  OK\nTime taken: 5.39 seconds\n```\n\n数据加载完成后，我们可以查询该表。我们可以使用带`limit`的`select`命令来显示行，以限制行数：\n\
  \n```\nhive> select * from filamenttable limit 5;\nOK\nfilamentA       100W    605.0\n\
  filamentB       100W    683.0\nfilamentB       100W    691.0\nfilamentB       200W\
  \    561.0\nfilamentA       200W    530.0\nTime\ntaken: 0.532 seconds, Fetched:\
  \ 5 row(s)\n```\n\n我们已经显示了`filamenttable`表的部分行。我们需要使用 PySparkSQL 读取这个表的数据。\n\n###\
  \ 工作原理\n\n#### 步骤 8-8-1\\. 创建`HiveContext`对象\n\n`HiveContext`类定义在`pyspark.sql`子模块中。我们可以使用这个类，并将`sc`作为输入传递给`HiveContext`构造函数来创建`HiveContext`对象：\n\
  \n```python\n>>> from pyspark.sql import HiveContext\n>>> ourHiveContext = HiveContext(sc)\n\
  ```\n\n我们已经创建了`HiveContext`对象。\n\n#### 步骤 8-8-2\\. 从 Hive 读取表数据\n\n我们可以使用定义在`HiveContext`对象上的`table()`函数来读取表。在`table()`函数中，我们需要以`<databaseName>.<tableName>`格式提供表名。在我们的例子中，数据库名称是`apress`，表名称是`filamenttable`。因此，`table()`函数的参数值将是`apress.filamenttable`。\n\
  \n```python\n>>> FilamentDataFrame = ourHiveContext.table('apress.filamenttable')\n\
  >>> FilamentDataFrame.show(5)\n+------------+---------+-----------+\n|filamenttype|bulbpower|lifeinhours|\n\
  +------------+---------+-----------+\n|   filamentA|     100W|      605.0|\n|  \
  \ filamentB|     100W|      683.0|\n|   filamentB|     100W|      691.0|\n|   filamentB|\
  \     200W|      561.0|\n|   filamentA|     200W|      530.0|\n+------------+---------+-----------+\n\
  only showing top 5 rows\n```\n\n最后，我们从 Apache Hive 中的表创建了一个 DataFrame。\n\n## 9\\\
  . PySpark MLlib 与线性回归\n\n机器学习经历了最近许多发展，并且日益普及。来自各个领域的人们，包括计算机科学、数学和管理学，都在各种项目中使用机器学习来发现数据中的隐藏信息。当我们开始将机器学习算法应用于大数据时，大数据变得更加有趣。\n\
  \n```\n\n\n"
- "# 排版后的内容\n\n## PySpark MLlib 简介\n\n`PySpark MLlib` 是一个机器学习库。它是基于 `PySpark Core`\
  \ 的封装，用于使用机器学习算法进行数据分析。它运行在分布式系统上，并且是可扩展的。我们可以在 `PySpark MLlib` 中找到分类、聚类、线性回归以及其他机器学习算法的实现。我们知道\
  \ `PySpark` 擅长迭代算法。许多机器学习算法已利用迭代算法在 `PySpark MLlib` 中实现。除了 `PySpark` 的高效性和可扩展性之外，`PySpark\
  \ MLlib` 的 API 也非常用户友好。\n\n软件库是为解决各种问题而定义的，它们自带数据结构。这些数据结构旨在通过高效的方式解决特定类型的问题。`PySpark\
  \ MLlib` 提供了多种数据结构，包括稠密向量、稀疏向量以及局部和分布式矩阵。\n\n线性回归是最流行的机器学习算法之一。我们会在一个或多个自变量与一个因变量之间建立线性数学模型。\n\
  \n在本章中，我们将首先了解 `PySpark MLlib` 中定义的各种数据结构。然后，我们将探索 MLlib 中的线性回归。我们还将使用岭回归（ridge）和套索回归（lasso）方法实现线性回归。\n\
  \n本章涵盖以下操作指南：\n\n- 操作指南 9-1：创建稠密向量\n- 操作指南 9-2：创建稀疏向量\n- 操作指南 9-3：创建局部矩阵\n- 操作指南\
  \ 9-4：创建 `RowMatrix`\n- 操作指南 9-5：创建标记点\n- 操作指南 9-6：应用线性回归\n- 操作指南 9-7：应用岭回归\n- 操作指南\
  \ 9-8：应用套索回归\n\n## 操作指南 9-1：创建稠密向量\n\n### 问题\n\n你想创建一个稠密向量。\n\n### 解决方案\n\n`DenseVector`\
  \ 是一个局部向量。在 `PySpark` 中，我们可以使用 `DenseVector` 构造函数来创建稠密向量。\n\n### 实现原理\n\n创建稠密向量需要我们从\
  \ `pyspark.mllib.linalg` 子模块中导入 `DenseVector` 类：\n\n```\n>>> from pyspark.mllib.linalg\
  \ import DenseVector\n>>> denseDataList = [1.0,3.4,4.5,3.2]\n```\n\n我们创建了一个包含四个元素的列表。这个列表\
  \ `denseDataList` 包含浮点类型的数据元素。我们已经导入了 `DenseVector`，现在我们将创建一个稠密向量：\n\n```\n>>> denseDataVector\
  \ = DenseVector(denseDataList)\n>>> print denseDataVector\n```\n\n以下是输出结果：\n\n```\n\
  [1.0,3.4,4.5,3.2]\n```\n\n我们创建了一个名为 `denseDataVector` 的稠密向量。我们可以索引 `DenseVector`\
  \ 的元素。`DenseVector` 的元素是零索引的。在接下来的代码行中，我们将首先获取 `DenseVector` 的第二个元素，然后获取索引为 0 的第一个元素。最后，我们将通过索引\
  \ 2 获取 `denseDataVector` 的第三个元素。\n\n```\n>>> denseDataVector[1]\n```\n\n以下是输出结果：\n\
  \n```\n3.3999999999999999\n>>> denseDataVector[0]\n```\n\n以下是输出结果：\n\n```\n1.0\n\
  >>> denseDataVector[2]\n```\n\n以下是输出结果：\n\n```\n4.5\n```\n\n> **注意：** 我们之前已经讨论过\
  \ `NumPy`。为了提高效率，建议使用 `NumPy` 数组而不是 Python 列表来创建稠密向量。你可以通过 [`spark.apache.org/docs/2.0.0-preview/mllib-data-types.html`](https://spark.apache.org/docs/2.0.0-preview/mllib-data-types.html)\
  \ 了解更多关于 `DenseVector` 和 `SparseVector` 的信息。\n\n## 操作指南 9-2：创建稀疏向量\n\n### 问题\n\n\
  你想创建一个稀疏向量。\n\n### 解决方案\n\n有时我们得到的数据集中，数据元素的最大值为 0。我们能省略存储零吗？是的，我们可以这样做。在 `PySpark\
  \ MLlib` 中，我们可以将稀疏向量保存为 `SparseVector` 对象。\n\n你已获得一个向量。该向量的许多元素值为 0，如表 9-1 所示。索引\
  \ 1、2、3、4、5 和 7 处的值为 0.0。\n\n**表 9-1：一个稀疏数据集**\n\n![A430628_1_En_9_Figa_HTML.gif](img/A430628_1_En_9_Figa_HTML.gif)\n\
  \n因此，八个值中有六个是 0。我们将据此创建一个 `SparseVector`。\n\n### 实现原理\n\n\n\n在本节中，我们将创建一个`SparseVector`。首先，我们需要从子模块`pyspark.mllib.linalg`中导入`SparseVector`类：\n\
  \n```\n>>> from pyspark.mllib.linalg import SparseVector\n>>> sparseDataList = [1.0,3.2]\n\
  >>> sparseDataVector = SparseVector(8,[0,7],sparseDataList)\n```\n\n我们创建了一个名为`sparseDataVector`的稀疏向量。让我解释一下`SparseVector`的参数。第一个参数`8`表示我们的`SparseVector`中有八个元素。第二个参数是一个列表，包含非零元素的索引列表。我们在索引\
  \ 0 处有`1.0`，在索引 7 处有`3.2`。\n\n打印`sparseDataVector`并查看结果：\n\n```\n>>> sparseDataVector\n\
  ```\n\n输出如下：\n\n```\nSparseVector(8, {0: 1.0, 7: 3.2})\n```\n\n可以看到，索引 0 和索引 7 处有我们的数值。我们也可以通过`[]`对`SparseVector`进行索引：\n\
  \n```\n>>> sparseDataVector[1]\n```\n\n输出如下：\n\n```\n0.0\n>>> sparseDataVector[7]\n\
  ```\n\n输出如下：\n\n```\n3.2000000000000002\n```\n\n因此，我们发现索引 1 处的值为`0.0`，索引 7 处的值为`3.2`。非零元素的总数可以通过`numNonzeros()`函数获取。在以下代码行中，我们发现`SparseVector`中只有两个非零元素：\n\
  \n```\n>>> sparseDataVector.numNonzeros()\n```\n\n输出如下：`2`\n\n我们可以对`SparseVector`执行许多操作。以下代码行展示了如何计算两个给定`SparseVector`之间的平方距离。我们使用`squared_distance()`函数计算平方距离：\n\
  \n```\n>>> sparseDataList1 = [3.0,1.4,2.5,1.2]\n>>> sparseDataVector1 = SparseVector(8,[0,3,4,6],sparseDataList1)\n\
  >>> squaredDistance = sparseDataVector.squared_distance(sparseDataVector1)\n>>>\
  \ squaredDistance\n```\n\n输出如下：\n\n```\n23.890000000000001\n```\n\n我们得到了平方距离。\n\n\
  ## 配方 9-3：创建局部矩阵\n\n### 问题\n\n您想创建局部矩阵。\n\n### 解决方案\n\n局部矩阵存储在单台机器上，并且显然对该机器来说是本地的。局部矩阵的索引是整数类型，其值是双精度类型。局部矩阵有两种形式：稠密矩阵和稀疏矩阵。稠密矩阵的元素以列主序存储在单个数组中。在稀疏矩阵中，非零值以压缩稀疏列格式存储。我们可以通过`Matrices`类中定义的`dense()`方法创建稠密矩阵。`dense()`方法是一个静态方法，因此无需创建`Matrices`类的对象。类似地，我们可以通过`Matrices`类中定义的`sparse()`方法创建稀疏局部矩阵。该方法也是静态方法。\n\
  \n### 工作原理\n\n首先，我们将创建一个局部稠密矩阵。然后，创建一个局部稀疏矩阵。让我们先创建一个 Python 列表：\n\n```\n>>> denseDataList\
  \ = [1.0,3.4,4.5,3.2]\n>>> ourDenseMatrix = Matrices.dense(numRows = 2, numCols\
  \ = 2, values= denseDataList)\n```\n\n我们创建了一个局部稠密矩阵`ourDenseMatrix`。我们应该讨论一下`dense()`方法的参数。我们向它提供了三个参数。第一个参数定义矩阵的行数。第二个参数是列数。第三个参数是矩阵元素的列表。现在打印我们创建的矩阵，看看它的样子：\n\
  \n```\n>>> ourDenseMatrix\n```\n\n输出如下：\n\n```\nDenseMatrix(2, 2, [1.0, 3.4, 4.5,\
  \ 3.2], False)\n```\n\n结果中出现了一个新东西——`False`。这是什么？这告诉我们矩阵是否被转置。\n\n您可能想知道如何可视化我们创建的稠密矩阵的结构。帮助我们的是`toArray()`函数。这会将我们的稠密矩阵转换为一个\
  \ NumPy 数组：\n\n```\n>>> ourDenseMatrix.toArray()\n```\n\n输出如下：\n\n```\narray([[\
  \ 1\\. ,  4.5],\n       [ 3.4,  3.2]])\n```\n\n我们可以看到，数据点按列填充到了稠密矩阵中。让我解释一下：`denseDataList`列表的前两个值首先填充到稠密矩阵的第一列，然后剩余的两个元素放置在第二列。\n\
  \n我们使用以下代码行创建一个稀疏矩阵：\n\n```\n>>> sparseDataList = [1.0,3.2]\n```\n\n我们的稀疏矩阵只有两个非零元素。我们想要创建一个\
  \ 2×2 的矩阵。因此，很明显我们的矩阵也将有两个零元素。我们知道 PySpark 以压缩稀疏列格式保存 Spark 局部矩阵。因此，我们必须提供列指针作为参数。我们想要使用数值`1.0`和`3.2`创建一个对角矩阵：\n\
  \n```\n>>> ourSparseMatrix = Matrices.sparse(numRows = 2,  numCols = 2, colPtrs\
  \ = [0,1,2],  rowIndices = [0,1], values = sparseDataList)\n>>> ourSparseMatrix.toArray()\n\
  ```\n\n输出如下：\n\n```\narray([[ 1\\. ,  0\\. ],\n       [ 0\\. ,  3.2]])\n```\n\n\
  注意\n\n您可以在维基百科上阅读更多关于压缩稀疏列格式的信息： [`https://en.wikipedia.org/wiki/Sparse_matrix`](https://en.wikipedia.org/wiki/Sparse_matrix)\
  \ 。\n\n## 配方 9-4：创建行矩阵\n\n### 问题\n\n您想创建一个行矩阵。\n\n### 解决方案\n\n`RowMatrix`是一个分布式矩阵。`RowMatrix`的行索引是无意义的。它是一个面向行的分布式矩阵。\n\
  \n### 工作原理\n\n`RowMatrix`类位于 PySpark 子模块`pyspark.mllib.linalg.distributed`中。让我们首先导入这个类。然后，我们将创建一个`RowMatrix`。\n\
  \n```\n>>> from pyspark.mllib.linalg.distributed import RowMatrix as rm\n```\n\n\
  要创建`RowMatrix`，我们首先需要一个向量的 RDD。但即使您有一个列表的 RDD，那也是可以的。我们的数据在一个嵌套列表`dataList`中：\n\n\
  ```\n>>> dataList  = [[ 94.88,  82.04,  52.57],\n...                         [ 35.85,\
  \  26.9 ,   3.63],\n...                         [ 41.76,  69.67,  50.62],\n... \
  \                        [ 90.45,  54.66,  64.07]]\n```\n\n嵌套列表`dataList`有四行三列。现在我们必须从`dataList`创建一个\
  \ RDD：\n\n```\n>>> dataListRDD = sc.parallelize(dataList,4)\n>>> ourRowMatrix =\
  \ rm(rows = dataListRDD, numRows = 4 , numCols = 3)\n```\n\n我们已经创建了`RowMatrix`。`RowMatrix`的第一个参数是列表的\
  \ RDD。第二个和第三个参数分别是行数和列数。\n\n```\n>>> ourRowMatrix.numRows()\n```\n\n输出如下：\n\n```\n\
  4L\n>>> ourRowMatrix.numCols()\n```\n\n输出如下：\n\n```\n3L\n```\n\n## 配方 9-5：创建标注点\n\
  \n### 问题\n\n您想创建一个标注点。\n\n### 解决方案\n\n标注点是线性回归和分类算法的一种基本数据结构。它由一个与标签关联的稀疏或稠密向量组成。标签是双精度数据类型；因此，标注点可用于回归和分类。`LabeledPoint`类位于`pyspark.mllib.regression`子模块中。让我们创建`LabeledPoint`数据。\n\
  \n### 工作原理\n\n首先定义一个嵌套列表：\n\n```\n>>> from pyspark.mllib.regression import LabeledPoint\n\
  >>> labeledPointData = [[3.09,1.97,3.73,1],\n...                     [2.96,2.15,4.16,1],\n\
  ...                     [2.87,1.93,4.39,1],\n...                     [3.02,1.55,4.43,1],\n\
  ...                     [1.8,3.65,2.08,2],\n...                     [1.36,4.43,1.95,2],\n\
  ...                     [1.71,4.35,1.94,2],\n...                     [1.03,3.75,2.12,2],\n\
  ...                     [2.3,3.59,1.99,2]]\n```\n\n嵌套列表`labeledPointData`中每个列表的最后一个数据点就是我们的标签。让我们对数据进行并行化：\n\
  \n```\n>>> labeledPointDataRDD = sc.parallelize(labeledPointData, 4)\n>>> labeledPointDataRDD.take(4)\n\
  ```\n\n输出如下：\n\n```\n[[3.09, 1.97, 3.73, 1],\n[2.96, 2.15, 4.16, 1],\n[2.87, 1.93,\
  \ 4.39, 1],\n[3.02, 1.55, 4.43, 1]]\n>>> labeledPointRDD = labeledPointDataRDD.map(lambda\
  \ data : LabeledPoint(data[3],data[0:3]))\n>>> labeledPointRDD.take(4)\n```\n\n\
  输出如下：\n\n\n\n```\n[LabeledPoint(1.0, [3.09,1.97,3.73]),\nLabeledPoint(1.0, [2.96,2.15,4.16]),\n\
  LabeledPoint(1.0, [2.87,1.93,4.39]),\nLabeledPoint(1.0, [3.02,1.55,4.43])]\n```\n\
  \n我们已经创建了 `labeledPointRDD`。可以看到，这些标记点已被转换为双精度浮点类型数据。\n\n<https://spark.apache.org/docs/2.0.0/mllib-data-types.html>\n\
  \n## 方法 9-6. 应用线性回归\n\n### 问题\n\n你需要应用线性回归。\n\n### 解决方案\n\n线性回归是一种监督式机器学习算法。在此算法中，我们会拟合一条直线（或曲线），用以生成因变量与自变量之间的线性关系。\n\
  \n我们已获得一个名为 `linearRegressionData.csv` 的文件。该文件包含四列数据。将文件数据可视化后，结果如下所示：\n\n```\n\
  +-----+----+----+----+\n| dvs1|ivs1|ivs2|ivs3|\n+-----+----+----+----+\n|34.63|5.53|5.58|5.41|\n\
  |40.89|3.89|6.48|6.97|\n|37.25|5.07| 4.5| 6.5|\n|45.09|5.81|5.71|8.59|\n| 39.4|5.61|5.79|6.77|\n\
  +-----+----+----+----+\n```\n\n`dvs1` 列是因变量，它依赖于 `ivs1`、`ivs2` 和 `ivs3` 这三个自变量。我们需要创建一个数学模型，用以展示因变量与自变量之间的线性关系。线性回归模型的数学公式如图\
  \ 9-1 所示。\n\n![A430628_1_En_9_Fig1_HTML.jpg](img/A430628_1_En_9_Fig1_HTML.jpg)\n\
  \n**图 9-1.** 线性回归模型的数学公式\n\n我们需要估算截距和权重的值。\n\n### 工作原理\n\n接下来，我们逐步创建该模型。\n\n####\
  \ 步骤 9-6-1. 读取 CSV 文件数据\n\n我们的回归数据位于 `linearRegressionData.csv` 文件中。为了对其执行线性回归分析，我们需要读取该数据并将其转换为标记点。我认为更好的策略是将数据转换为标记点的\
  \ RDD，这可以通过首先使用 `spark.read.csv()` 函数读取文件来实现。我们知道 `spark.read.csv()` 函数会返回一个 DataFrame。我们需要以某种方式将该\
  \ DataFrame 转换为标记点的 RDD。因此，首先让我们读取文件。\n\n```\n>>> regressionDataFrame = spark.read.csv('file:///home/pysparkbook/bData/linearRegressionData.csv',header=True,\
  \ inferSchema = True)\n>>> regressionDataFrame.show(5)\n```\n\n以下输出仅显示前五行：\n\n```\n\
  +-----+----+----+----+\n| dvs1|ivs1|ivs2|ivs3|\n+-----+----+----+----+\n|34.63|5.53|5.58|5.41|\n\
  |40.89|3.89|6.48|6.97|\n|37.25|5.07| 4.5| 6.5|\n|45.09|5.81|5.71|8.59|\n| 39.4|5.61|5.79|6.77|\n\
  +-----+----+----+----+\n```\n\n读取文件后，我们得到了 DataFrame。下面这行代码将我们的 DataFrame 转换为 RDD：\n\
  \n```\n>>> regressionDataRDDDict = regressionDataFrame.rdd\n>>> regressionDataRDDDict.take(5)\n\
  ```\n\n以下是输出结果：\n\n```\n[Row(dvs1=34.63, ivs1=5.53, ivs2=5.58, ivs3=5.41),\nRow(dvs1=40.89,\
  \ ivs1=3.89, ivs2=6.48, ivs3=6.97),\nRow(dvs1=37.25, ivs1=5.07, ivs2=4.5, ivs3=6.5),\n\
  Row(dvs1=45.09, ivs1=5.81, ivs2=5.71, ivs3=8.59),\nRow(dvs1=39.4, ivs1=5.61, ivs2=5.79,\
  \ ivs3=6.77)]\n```\n\n我们看到了 `regressionDataRDDDict` 转换为 RDD 后的输出。这是一个由行对象构成的 RDD。你可能在想，自己了解行对象。我们在创建\
  \ DataFrame 时会用到它们。但这并非我们的需求。你可以看到行对象中的数据是以键/值格式存在的。因此，我们需要进一步转换，以便在 RDD 中只获取值：\n\
  \n```\n>>> regressionDataRDD = regressionDataFrame.rdd.map(list)\n>>> regressionDataRDD.take(5)\n\
  ```\n\n以下是输出结果：\n\n```\n[[34.63, 5.53, 5.58, 5.41],\n[40.89, 3.89, 6.48, 6.97],\n\
  [37.25, 5.07, 4.5, 6.5],\n[45.09, 5.81, 5.71, 8.59],\n[39.4, 5.61, 5.79, 6.77]]\n\
  ```\n\n将 `list` 作为参数传递给 RDD 的 `map()` 函数后，我们的数据已被转换为一种便于创建标记点 RDD 的格式。在下一步中，我们将创建一个\
  \ `LabeledPoint` RDD。\n\n#### 步骤 9-6-2. 创建标记点的 RDD\n\n为了运行线性回归，我们已将数据转换为标记点。如前所述，RDD\
  \ 的第一列是因变量，它依赖于其余变量。因此，每个 RDD 元素的第一个值就是我们的标签，其余值则是特征。现在我们可以创建 `LabeledPoint` RDD。我们知道，要使用\
  \ `LabeledPoint`，必须先导入该类：\n\n```\n>>> from pyspark.mllib.regression import LabeledPoint\n\
  >>> regressionDataLabelPoint = regressionDataRDD.map(lambda data : LabeledPoint(data[0],data[1:4]))\n\
  ```\n\n`map()` 函数可用于将我们的 RDD 转换为 `LabeledPoint` RDD。`LabeledPoint` 的第一个参数是标签，在上述代码中我们将其设置为\
  \ `data[0]`。接下来，我们将通过 `regressionDataLabelPoint` 从 `LabeledPoint` RDD 中取出五个元素。当然，我们将使用\
  \ `take()` 函数，并将参数 `5` 传入其中：\n\n```\n>>> regressionDataLabelPoint.take(5)\n```\n\
  \n以下是输出结果：\n\n```\n[LabeledPoint(34.63, [5.53,5.58,5.41]),\nLabeledPoint(40.89,\
  \ [3.89,6.48,6.97]),\nLabeledPoint(37.25, [5.07,4.5,6.5]),\nLabeledPoint(45.09,\
  \ [5.81,5.71,8.59]),\nLabeledPoint(39.4, [5.61,5.79,6.77])]\n```\n\n我们已经创建了所需的 LabeledPoint\
  \ RDD。如前所述，线性回归是一种监督式机器学习算法。因此，我们首先将给定的数据集划分为训练数据集和测试数据集。训练数据集将用于创建模型，然后我们应用测试数据来检查所创建的线性回归模型的准确性。在下一步中，我们将把数据集划分为训练数据集和测试数据集。\n\
  \n#### 步骤 9-6-3. 划分训练数据和测试数据\n\nPySpark 提供了 `randomSplit()` 函数，我们可以用它来将数据集划分为训练数据集和测试数据集：\n\
  \n```\n>>> regressionLabelPointSplit = regressionDataLabelPoint.randomSplit([0.7,0.3])\n\
  ```\n\n我们提供了列表 `[0.7 , 0.3]` 作为参数。这个列表表示我们需要 70% 的数据点作为训练数据集，其余 30% 作为测试数据集。在我们的数据集中，总共有\
  \ 30 条记录。因此，训练数据集将包含 22 条记录，测试数据集将包含 8 条记录。\n\n```\n>>> regressionLabelPointTrainData\
  \ = regressionLabelPointSplit[0]\n>>> regressionLabelPointTrainData.take(5)\n```\n\
  \n以下是输出结果：\n\n```\n[LabeledPoint(34.63, [5.53,5.58,5.41]),\nLabeledPoint(45.09,\
  \ [5.81,5.71,8.59]),\nLabeledPoint(39.4, [5.61,5.79,6.77]),\nLabeledPoint(33.25,\
  \ [5.33,5.78,4.94]),\nLabeledPoint(44.17, [6.11,6.18,8.2])]\n```\n\n训练数据集已准备就绪：\n\
  \n```\n>>> regressionLabelPointTrainData.count()\n```\n\n以下是输出结果：\n\n```\n22\n```\n\
  \n如我们所述，训练数据集中有 22 个数据点：\n\n```\n>>> regressionLabelPointTestData = regressionLabelPointSplit[1]\n\
  >>> regressionLabelPointTestData.take(5)\n```\n\n以下是输出结果：\n\n```\n[LabeledPoint(40.89,\
  \ [3.89,6.48,6.97]),\nLabeledPoint(37.25, [5.07,4.5,6.5]),\nLabeledPoint(42.92,\
  \ [5.39,6.59,7.56]),\nLabeledPoint(38.23, [4.19,6.47,6.52]),\nLabeledPoint(36.33,\
  \ [5.65,5.78,5.47])]\n>>> regressionLabelPointTestData.count()\n```\n\n以下是输出结果：\n\
  \n```\n8\n```\n\n测试数据集已创建为 `regressionLabelPointTestData`。对测试数据调用 `count()` 函数可确保测试数据集中有\
  \ 8 个数据点。\n\n现在我们已经拥有了训练数据集和测试数据集，接下来就可以将回归模型拟合到我们的训练数据集上了。在下一步中，我们将创建线性回归模型。\n\n\
  #### 步骤 9-6-4. 创建线性回归模型\n\nPySpark 使用随机梯度下降（SGD）算法来计算线性回归模型的系数。这是一种优化算法。PySpark\
  \ 中的 `LinearRegressionWithSGD` 类用于执行与线性回归相关的操作。\n\n现在，让我们导入 `LinearRegressionWithSGD`；我们将其导入并重命名为\
  \ `lrSGD`：\n\n\n```python\n>>> from pyspark.mllib.regression import LinearRegressionWithSGD\
  \ as lrSGD\n>>> ourModelWithLinearRegression  = lrSGD.train(\ndata = regressionLabelPointTrainData,\n\
  ...                                             iterations = 200,\n...         \
  \                                    step = 0.02,\n...                         \
  \                    intercept = True)\n```\n\n在 `LinearRegressionWithSGD` 类中定义了一个静态方法\
  \ `train()`，该方法用于创建线性回归模型。`train()` 方法的第一个参数是训练数据。SGD 是一种迭代算法，因此我们将迭代次数作为第二个参数传入\
  \ `train()` 方法。第三个参数 `step` 定义了 SGD 算法中的移动步长。如果线性模型包含截距，则需将 `intercept` 参数设为 `True`。最后，这会创建名为\
  \ `ourModelWithLinearRegression` 的线性回归模型。\n\n```\n>>> ourModelWithLinearRegression.intercept\n\
  ```\n\n输出如下：\n\n```\n1.3475409224629387\n>>> ourModelWithLinearRegression.weights\n\
  ```\n\n输出如下：\n\n```\nDenseVector([1.7083, 2.1529, 2.3226])\n```\n\n我们可以通过截距和权重来创建回归模型。创建的模型如图\
  \ 9-2 所示。\n\n![A430628_1_En_9_Fig2_HTML.jpg](img/A430628_1_En_9_Fig2_HTML.jpg)\n\
  \n**图 9-2.** 回归模型\n\n**注意**  \n你可以在维基百科上阅读更多关于随机梯度下降的内容：[`en.wikipedia.org/wiki/Stochastic_gradient_descent`](https://en.wikipedia.org/wiki/Stochastic_gradient_descent).\n\
  \n#### 步骤 9-6-5. 保存创建的模型\n\n有时我们需要保存创建的模型以备将来使用。我们可以通过 `save()` 方法保存模型：\n\n```\n\
  >>> ourModelWithLinearRegression.save(sc, '/home/pysparkbook/ourModelWithLinearRegression')\n\
  ```\n\n`save()` 方法的第一个参数是 `SparkContext`，第二个参数是保存模型的目录路径。模型已保存，但如何读取它呢？读取保存的模型需要\
  \ `load()` 方法，该方法位于 `LinearRegressionModel` 类中。\n\n```\n>>> from pyspark.mllib.regression\
  \ import LinearRegressionModel as linearRegressModel\n>>> ourModelWithLinearRegressionReloaded\
  \ = linearRegressModel.load(sc, '/home/pysparkbook/ourModelWithLinearRegression')\n\
  ```\n\n保存的模型已重新加载，现在我们可以使用它了。既然已重新加载模型，让我们检查一下能否从重新加载的模型中获取截距和权重值：\n\n```\n>>> ourModelWithLinearRegressionReloaded.intercept\n\
  ```\n\n输出如下：\n\n```\n1.34754092246\n>>> ourModelWithLinearRegressionReloaded.weights\n\
  ```\n\n输出如下：\n\n```\nDenseVector([1.7083, 2.1529, 2.3226])\n```\n\n很明显，我们已经成功重新加载了模型。\n\
  \n#### 步骤 9-6-6. 使用模型预测数据\n\n创建数学模型后，我们可以检验模型的可信度。为了检验模型的可信度，我们将测试数据的实际值和预测值组成一个\
  \ RDD：\n\n```\n>>> actualDataandLinearRegressionPredictedData = regressionLabelPointTestData.map(lambda\
  \ data : (float(data.label) , float(ourModelWithLinearRegression.predict(data.features))))\n\
  ```\n\n`predict()` 方法会接受特征数据（即自变量），并返回因变量的预测值。现在我们将得到一个包含实际值和预测值的 RDD。\n\n```\n\
  >>> actualDataandLinearRegressionPredictedData.take(5)\n```\n\n输出如下：\n\n```\n[(40.89,\
  \ 38.1322613341641),\n(37.25, 34.79375295252528),\n(42.92, 42.30191258048799),\n\
  (38.23, 37.57804867136557),\n(36.33, 36.14796052442989)]\n```\n\n#### 步骤 9-6-7.\
  \ 评估创建的模型\n\n获得实际值和预测值的 RDD 后，我们将计算评估指标。首先计算均方根误差（RMSE）。均方根误差的数学公式如图 9-3 所示。\n\n\
  ![A430628_1_En_9_Fig3_HTML.jpg](img/A430628_1_En_9_Fig3_HTML.jpg)\n\n**图 9-3.**\
  \ 均方根误差的数学公式\n\n其中 `dvs1` 是因变量的实际值，`dvs1pred` 是因变量的预测值，共有 n 个数据点。\n\n我们需要导入 `RegressionMetrics`\
  \ 类来评估模型：\n\n```\n>>> from pyspark.mllib.evaluation import RegressionMetrics as\
  \ rmtrcs\n>>> ourLinearRegressionModelMetrics = rmtrcs(actualDataandLinearRegressionPredictedData)\n\
  >>> ourLinearRegressionModelMetrics.rootMeanSquaredError\n```\n\n输出如下：\n\n```\n\
  1.8446573587605941\n```\n\n我们的均方根误差值为 `1.844657`。类似地，我们计算 R² 的值：\n\n```\n>>> ourLinearRegressionModelMetrics.r2\n\
  ```\n\n输出如下：\n\n```\n0.47423120771913974\n```\n\nR² 的值较小，甚至低于 0.5。那么这是一个好的模型吗？我认为不是。另一个问题是，我们能否提高模型的效率？答案是肯定的；我只是通过调整学习步长和迭代次数就实现了这一点：\n\
  \n```\n>>> ourModelWithLinearRegression  = lrSGD.train(data = regressionLabelPointTrainData,\n\
  ...                                             iterations = 100,\n...         \
  \                                    step = 0.05,\n...                         \
  \                    intercept = True)\n>>> actualDataandLinearRegressionPredictedData\
  \ = regressionLabelPointTestData.map(lambda data : (float(data.label) , float(ourModelWithLinearRegression.predict(data.features))))\n\
  >>> from pyspark.mllib.evaluation import RegressionMetrics as rmtrcs\n>>> ourLinearRegressionModelMetrics\
  \ = rmtrcs(actualDataandLinearRegressionPredictedData)\n>>> ourLinearRegressionModelMetrics.rootMeanSquaredError\n\
  ```\n\n输出如下：\n\n```\n1.7856232547826518\n>>> ourLinearRegressionModelMetrics.r2\n\
  ```\n\n输出如下：\n\n```\n0.6377723547885376\n```\n\n最终，我们成功提高了 R² 的值。\n\n**注意**  \n\
  你可以通过以下链接了解更多关于 R² 的内容：[`en.wikipedia.org/wiki/Coefficient_of_determination`](https://en.wikipedia.org/wiki/Coefficient_of_determination).\n\
  \n## 配方 9-7. 应用岭回归\n\n### 问题\n\n你想要应用岭回归。\n\n### 解决方案\n\n你已获得 CSV 文件 `autoMPGDataModified.csv`\
  \ 中的数据集。该数据集包含五列。我们需要使用岭正则化对该数据拟合一个线性回归模型。第一列是每加仑英里数（mpg），这是本例中的因变量。\n\n```\n+----+------------+----------+------+------------+\n\
  | mpg|displacement|horsepower|weight|acceleration|\n+----+------------+----------+------+------------+\n\
  |18.0|       307.0|        18|  3504|        12.0|\n|15.0|       350.0|        36|\
  \  3693|        11.5|\n|18.0|       318.0|        30|  3436|        11.0|\n|16.0|\
  \       304.0|        30|  3433|        12.0|\n|17.0|       302.0|        25|  3449|\
  \        10.5|\n+----+------------+----------+------+------------+\n```\n\n我从 UCI\
  \ 机器学习库 ([`archive.ics.uci.edu/ml/datasets/auto+mpg`](https://archive.ics.uci.edu/ml/datasets/auto+mpg))\
  \ 中获取了该数据集，并移除了一些列。根据网页说明，该数据集取自卡内基梅隆大学维护的 StatLib 库，并在 1983 年美国统计协会博览会上使用过。\n\n\
  你可能想知道线性回归与带岭参数的线性回归有何区别。我们知道使用 SGD 进行误差部分的优化。因此，在误差部分中，会添加一个额外的项，如图 9-4 所示。\n\n\
  ![A430628_1_En_9_Fig4_HTML.jpg](img/A430628_1_En_9_Fig4_HTML.jpg)\n\n**图 9-4.**\
  \ 岭回归中的额外误差项\n\n让我们在给定的数据集上执行岭回归。\n\n**注意**  \n你可以在以下网站阅读更多关于 `auto-mpg` 数据的内容：\
  \  \n[`archive.ics.uci.edu/ml/datasets/auto+mpg`](https://archive.ics.uci.edu/ml/datasets/auto+mpg)\n\
  ```\n\n\n[`https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/`](https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/)\n\
  \n你可以在以下网站了解更多关于岭回归的内容：\n\n[`www.quora.com/Why-is-it-that-the-lasso-unlike-ridge-regression-results-in-coefficient-estimates-that-are-exactly-equal-to-zero`](https://www.quora.com/Why-is-it-that-the-lasso-unlike-ridge-regression-results-in-coefficient-estimates-that-are-exactly-equal-to-zero)\n\
  \n[`https://en.wikipedia.org/wiki/Tikhonov_regularization`](https://en.wikipedia.org/wiki/Tikhonov_regularization)\n\
  \n[`https://en.wikipedia.org/wiki/Regularization_(mathematics`](https://en.wikipedia.org/wiki/Regularization_(mathematics)\
  \ `)`\n\n### 工作原理\n\n#### 步骤 9-7-1. 读取 CSV 文件数据\n\n我们需要读取数据并将其转换为 `RDD`，这与我们在之前的方法中所做的一样：\n\
  \n```\n>>> autoDataFrame = spark.read.csv('file:///home/pysparkbook/bData/autoMPGDataModified.csv',header=True,\
  \ inferSchema = True)\n>>> autoDataFrame.show(5)\n```\n\n以下是输出，仅显示前五行：\n\n```\n\
  +----+------------+----------+------+------------+\n| mpg|displacement|horsepower|weight|acceleration|\n\
  +----+------------+----------+------+------------+\n|18.0|       307.0|        18|\
  \  3504|        12.0|\n|15.0|       350.0|        36|  3693|        11.5|\n|18.0|\
  \       318.0|        30|  3436|        11.0|\n|16.0|       304.0|        30|  3433|\
  \        12.0|\n|17.0|       302.0|        25|  3449|        10.5|\n+----+------------+----------+------+------------+\n\
  >>> autoDataFrame.printSchema()\n```\n\n以下是输出：\n\n```\nroot\n|-- mpg: double (nullable\
  \ = true)\n|-- displacement: double (nullable = true)\n|-- horsepower: integer (nullable\
  \ = true)\n|-- weight: integer (nullable = true)\n|-- acceleration: double (nullable\
  \ = true)\n>>> autoDataRDDDict = autoDataFrame.rdd\n>>> autoDataRDDDict.take(5)\n\
  ```\n\n以下是输出：\n\n```\n[Row(mpg=18.0, displacement=307.0, horsepower=18, weight=3504,\
  \ acceleration=12.0),\nRow(mpg=15.0, displacement=350.0, horsepower=36, weight=3693,\
  \ acceleration=11.5),\nRow(mpg=18.0, displacement=318.0, horsepower=30, weight=3436,\
  \ acceleration=11.0),\nRow(mpg=16.0, displacement=304.0, horsepower=30, weight=3433,\
  \ acceleration=12.0),\nRow(mpg=17.0, displacement=302.0, horsepower=25, weight=3449,\
  \ acceleration=10.5)]\n```\n\n我们将 DataFrame 转换为 `RDD`，以便进一步将其转换为 `LabeledPoint`\
  \ 类型的 `RDD`：\n\n```\n>>> autoDataRDD = autoDataFrame.rdd.map(list)\n>>> autoDataRDD.take(5)\n\
  ```\n\n以下是输出：\n\n```\n[[18.0, 307.0, 18, 3504, 12.0],\n[15.0, 350.0, 36, 3693, 11.5],\n\
  [18.0, 318.0, 30, 3436, 11.0],\n[16.0, 304.0, 30, 3433, 12.0],\n[17.0, 302.0, 25,\
  \ 3449, 10.5]]\n```\n\n#### 步骤 9-7-2. 创建包含标签点的 RDD\n\n获取 `RDD` 后，我们需要将其转换为 `LabeledPoint`\
  \ 类型的 `RDD`：\n\n```\n>>> from pyspark.mllib.regression import LabeledPoint\n>>>\
  \ autoDataLabelPoint = autoDataRDD.map(lambda data : LabeledPoint(data[0],[data[1]/10,data[2],float(data[3])/100,data[4]]))\n\
  ```\n\n在数据集中，我们可以看到最好对数据进行归一化处理。因此，我们将排量除以 10，将重量除以 100：\n\n```\n>>> autoDataLabelPoint.take(5)\n\
  ```\n\n以下是输出：\n\n```\n[LabeledPoint(18.0, [30.7,18.0,35.04,12.0]),\nLabeledPoint(15.0,\
  \ [35.0,36.0,36.93,11.5]),\nLabeledPoint(18.0, [31.8,30.0,34.36,11.0]),\nLabeledPoint(16.0,\
  \ [30.4,30.0,34.33,12.0]),\nLabeledPoint(17.0, [30.2,25.0,34.49,10.5])]\n```\n\n\
  #### 步骤 9-7-3. 划分训练集和测试集\n\n现在，我们将数据集划分为训练集和测试集：\n\n```\n>>> autoDataLabelPointSplit\
  \ = autoDataLabelPoint.randomSplit([0.7,0.3])\n>>> autoDataLabelPointTrain = autoDataLabelPointSplit[0]\n\
  >>> autoDataLabelPointTest = autoDataLabelPointSplit[1]\n>>> autoDataLabelPointTrain.take(5)\n\
  ```\n\n以下是输出：\n\n```\n[LabeledPoint(18.0, [30.7,18.0,35.04,12.0]),\nLabeledPoint(15.0,\
  \ [35.0,36.0,36.93,11.5]),\nLabeledPoint(18.0, [31.8,30.0,34.36,11.0]),\nLabeledPoint(16.0,\
  \ [30.4,30.0,34.33,12.0]),\nLabeledPoint(17.0, [30.2,25.0,34.49,10.5])]\n>>> autoDataLabelPointTest.take(5)\n\
  ```\n\n以下是输出：\n\n```\n[LabeledPoint(14.0, [45.5,48.0,44.25,10.0]),\nLabeledPoint(15.0,\
  \ [39.0,41.0,38.5,8.5]),\nLabeledPoint(15.0, [40.0,30.0,37.61,9.5]),\nLabeledPoint(24.0,\
  \ [11.3,92.0,23.72,15.0]),\nLabeledPoint(26.0, [9.7,51.0,18.35,20.5])]\n>>> autoDataLabelPointTest.count()\n\
  ```\n\n以下是输出：\n\n```\n>>> autoDataLabelPointTrain.count()\n```\n\n以下是输出：\n\n```\n\
  \n```\n\n#### 步骤 9-7-4. 创建线性回归模型\n\n我们可以使用 `RidgeRegressionWithSGD` 类的 `train()`\
  \ 方法来创建模型。因此，首先需要导入 `RidgeRegressionWithSGD` 类，然后运行 `train()` 方法：\n\n```\n>>> from\
  \ pyspark.mllib.regression import RidgeRegressionWithSGD  as ridgeSGD\n>>> ourModelWithRidge\
  \  = ridgeSGD.train(\ndata = autoDataLabelPointTrain,\niterations = 400,\nstep =\
  \ 0.0005,\nregParam = 0.05,\nintercept = True\n)\n```\n\n在我们的 `train()` 方法中，比之前的方法多了一个参数\
  \ `regParam`。`regParam` 参数是正则化参数 alpha，如前面图 9-4 所示。\n\n```\n>>> ourModelWithRidge.intercept\n\
  ```\n\n以下是输出：\n\n```\n1.0192595005891258\n>>> ourModelWithRidge.weights\n```\n\n\
  以下是输出：\n\n```\nDenseVector([-0.0575, 0.2025, 0.1961, 0.3503])\n```\n\n我们已经创建了模型，并得到了截距和系数。\n\
  \n#### 步骤 9-7-5. 保存已创建的模型\n\n我们可以像在之前的方法中那样保存模型并重新加载。以下代码首先保存模型，然后重新加载。重新加载模型后，我们将检查其是否正常工作。\n\
  \n```\n>>> ourModelWithRidge.save(sc, '/home/pysparkbook/ourModelWithRidge')\n>>>\
  \ from  pyspark.mllib.regression import RidgeRegressionModel as ridgeRegModel\n\
  >>> ourModelWithRidgeReloaded = ridgeRegModel.load(sc, '/home/pysparkbook/ourModelWithRidge')\n\
  >>> ourModelWithRidgeReloaded.intercept\n```\n\n以下是输出：\n\n```\n1.01925950059\n>>>\
  \ ourModelWithRidgeReloaded.weights\n```\n\n以下是输出：\n\n```\nDenseVector([-0.0575,\
  \ 0.2025, 0.1961, 0.3503])\n```\n\n保存的模型运行正常。\n\n#### 步骤 9-7-6. 使用模型预测数据\n\n在此步骤中，我们将创建一个包含实际值和预测值的\
  \ `RDD`。预测值将使用 `predict()` 函数计算得出。\n\n```\n>>> actualDataandRidgePredictedData =\
  \ autoDataLabelPointTest.map(lambda data : [float(data.label) , float(ourModelWithRidge.predict(data.features))])\n\
  >>> actualDataandRidgePredictedData.take(5)\n```\n\n以下是输出：\n\n```\n[[18.0, 15.857286660271024],\n\
  [16.0, 16.28216643081738],\n[17.0, 14.787196092732607],\n[15.0, 17.60672713589945],\n\
  [14.0, 17.67800889949583]]\n```\n\n#### 步骤 9-7-7. 评估已创建的模型\n\n我们需要再次计算均方根误差：\n\n\
  ```\n>>> ourRidgeModelMetrics = rmtrcs(actualDataandRidgePredictedData)\n>>> ourRidgeModelMetrics.rootMeanSquaredError\n\
  ```\n\n以下是输出：\n\n```\n8.149263319131556\n```\n\n这就是误差值。误差值越高，模型精度越低。我们已经计算了均方根误差，并检验了模型的可靠性。\n\
  \n## 方法 9-8. 应用套索回归\n\n### 问题\n\n您想要应用套索回归。\n\n### 解决方案\n\n带有套索正则化的线性回归用于拟合不佳的模型。在套索回归中，在误差最小化时，我们会添加图\
  \ 9-5 中所示的项。\n\n![A430628_1_En_9_Fig5_HTML.jpg](img/A430628_1_En_9_Fig5_HTML.jpg)\n\
  \n**图 9-5.** 套索回归中的额外误差项\n\n### 工作原理\n\n#### 步骤 9-8-1. 使用套索回归创建线性回归模型\n\n我们已经创建了包含汽车数据的\
  \ `LabeledPoint`。现在可以应用 `LassoWithSGD` 类中定义的 `train()` 方法：\n\n\n\n# 使用 Lasso 回归进行模型训练与评估\n\
  \n## 步骤 9-8-1: 创建 Lasso 模型\n\n```python\n>>> from pyspark.mllib.regression import\
  \ LassoWithSGD  as lassoSGD\n>>> ourModelWithLasso  = lassoSGD.train(data = autoDataLabelPointTrain,\
  \ iterations = 400, step = 0.0005,regParam = 0.05, intercept = True)\n```\n\n我们已经创建了模型。\n\
  \n```python\n>>> ourModelWithLasso.intercept\n```\n\n输出如下：\n\n```\n1.020329086499831\n\
  >>> ourModelWithLasso.weights\n```\n\n输出如下：\n\n```\nDenseVector([-0.063, 0.2046,\
  \ 0.198, 0.3719])\n```\n\n我们得到了模型的截距和权重。\n\n## 步骤 9-8-2: 使用 Lasso 模型预测数据\n\n为了获取实际数据和预测数据的`RDD`，我们将使用与之前配方相同的策略：\n\
  \n```python\n>>> actualDataandLassoPredictedData = autoDataLabelPointTest.map(lambda\
  \ data : (float(data.label) , float(ourModelWithLasso.predict(data.features))))\n\
  >>> actualDataandLassoPredictedData.take(5)\n```\n\n输出如下：\n\n```\n[(15.0, 17.768596038896607),\n\
