  ## Apache Spark


  Apache Spark 是一个通用的分布式编程框架。它被认为非常适合数据的迭代处理以及批处理。Spark 由加州大学伯克利分校的 AMPLab 开发，现在是一个提供内存计算框架的开源软件。一方面，它擅长批处理；另一方面，它也适用于实时（或更准确地说，近实时）数据处理。机器学习和图算法是迭代的，这正是
  Spark 大显身手的地方。根据其研究论文，它的速度大约比其同类产品 Hadoop 快 100 倍。数据可以缓存在内存中。在迭代算法中缓存中间数据提供了惊人的快速处理速度。可以使用
  Java、Scala、Python 和 R 来编写 Spark 程序。


  如果有人将 Spark 视为改进版的 Hadoop，我认为在某种程度上是可以接受的。因为我们可以在 Spark 中实现 MapReduce 算法，而且 Spark
  利用了 HDFS 的优势；这意味着 Spark 既可以从 HDFS 读取数据，也可以将数据存储到 HDFS，并且由于数据可以持久化在内存中，Spark 能够高效地处理迭代计算。除了内存计算之外，Spark
  还非常适合交互式数据分析。


  我们将使用 Python 来学习 Apache Spark。这也被称为 PySpark。PySpark 自带了许多用于编写高效程序的库，同时也有一些外部库可用。以下是一些
  PySpark 库：


  - **PySparkSQL:** 一个 PySpark 库，用于对大量结构化或半结构化数据应用类似 SQL 的分析。我们也可以将 SQL 查询与 PySparkSQL
  一起使用。它可以连接到 Apache Hive，并且也可以应用 HiveQL。PySparkSQL 是 PySpark 核心的一个包装器。PySparkSQL
  引入了 `DataFrame`，它是结构化数据的表格化表示，类似于关系数据库管理系统中的表。另一个数据抽象 `DataSet` 是在 Spark 1.6 中引入的，但它不能与
  PySparkSQL 一起使用。

  - **MLlib:** MLlib 是 PySpark 核心的一个包装器，用于处理机器学习算法。`MLlib` 库提供的机器学习 API 易于使用。`MLlib`
  支持许多用于分类、聚类、文本分析等的机器学习算法。

  - **GraphFrames:** `GraphFrames` 库提供了一套 API，用于利用 PySpark 核心和 PySparkSQL 高效地执行图分析。在撰写本文时，`DataFrames`
  是一个外部库，您需要单独下载和安装它。我们将在第 8 章中进行图分析。




  ### 集群管理器


  在分布式系统中，一个作业或应用程序会被分解成不同的任务，这些任务可以在集群的不同机器上并行运行。一个任务在运行过程中需要内存和处理器等资源。最重要的是，如果某台机器发生故障，就必须将任务重新调度到另一台机器上。由于资源管理不善，分布式系统通常会面临可扩展性问题。另一种情况是，假设一个作业已经在集群上运行，另一个人想要运行另一个作业，那么第二个作业就必须等待第一个作业完成。但这样一来，我们就无法最优地利用资源。这种资源管理说起来容易，但在分布式系统上实现却很困难。


  集群管理器就是为了最优地管理集群资源而开发的。Spark 有三种可用的集群管理器：`Standalone`、`Apache Mesos` 和 `YARN`。这些集群管理器最大的优点是它们在用户和集群之间提供了一个抽象层。由于集群管理器提供的这种抽象，用户感觉就像在单台机器上工作，而实际上他是在一个集群上工作。集群管理器会将集群资源调度给正在运行的应用程序。


  ## Standalone 集群管理器


  Apache Spark 内置了 `Standalone` 集群管理器。它为 Spark 集群提供了主/从架构。这是 Spark 自带的唯一集群管理器。使用 `Standalone`
  集群管理器时，你只能运行 Spark 应用程序。其组件包括 master 和 workers。Workers 是 master 进程的从属。`Standalone`
  是最简单的集群管理器。可以通过 Spark 目录中 `sbin` 目录下的脚本配置 Spark Standalone 集群管理器。我们将在后续章节配置 Spark
  Standalone 集群管理器，并使用 Standalone 集群管理器部署 PySpark 应用程序。


  #### Apache Mesos 集群管理器


  Apache Mesos 是一个通用集群管理器。它由加州大学伯克利分校的 AMPLab 开发。Apache Mesos 有助于分布式解决方案高效扩展。使用 `Mesos`
  时，你可以在同一个集群上使用不同的框架运行不同的应用程序。“使用不同框架运行不同应用程序”是什么意思呢？我的意思是，我们可以在 `Mesos` 上同时运行一个
  Hadoop 应用程序和一个 Spark 应用程序。当多个应用程序在 `Mesos` 上运行时，它们共享集群的资源。Apache Mesos 的两个重要组件是
  master 和 slaves。它拥有类似于 Spark Standalone 集群管理器的主/从架构。在 `Mesos` 上运行的应用程序被称为框架。Slaves
  会以资源邀约的形式将可用资源告知 master。Slave 机器会定期提供资源邀约。master 服务器的分配模块决定哪个框架将获得资源。


  #### YARN 集群管理器


  `YARN` 代表 Yet Another Resource Negotiator。`YARN` 是在 Hadoop 2 中引入的，用于扩展 Hadoop；它将资源管理和作业管理分离。分离这两个组件使
  Hadoop 的扩展性更好。`YARN` 的主要组件是 `ResourceManager`、`ApplicationMaster` 和 `NodeManager`。存在一个全局的
  `ResourceManager`，每个集群会运行多个 `NodeManager`。`NodeManager` 是 `ResourceManager` 的从属。`Scheduler`
  是 `ResourceManager` 的一个组件，它为集群上运行的不同应用程序分配资源。最棒的是，我们可以在由 `YARN` 管理的集群上同时运行 Spark
  应用程序以及任何其他应用程序，如 Hadoop 或 MPI。每个应用程序都有一个 `ApplicationMaster`，它负责处理在分布式系统上并行运行的任务。请记住，Hadoop
  和 Spark 有各自类型的 `ApplicationMaster`。


  **注意**


  您可以通过以下网页了解更多关于 Standalone、Apache Mesos 和 YARN 集群管理器的信息：


