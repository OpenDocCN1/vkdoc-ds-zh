- '# 3\. Python 与 NumPy 简介


  Python 是一种通用的高级编程语言。它由 Guido van Rossum 开发，自诞生以来，其受欢迎程度呈指数级增长。大量用于数值和统计计算的高性能便捷包使
  Python 深受数据科学家的欢迎。Python 是一种缩进式语言，这可能会困扰刚学习 Python 的程序员。但缩进代码能提高代码可读性，而且 Python
  的普及性及其易用性使其非常适合为 Spark 编程。


  本章介绍 Python 编程的基础知识。我们还将讨论 NumPy。此外，我还包含了一篇关于 IPython 以及如何将 IPython 与 PySpark 集成的教程。


  如果你对 Python 很熟悉，可以跳过本章。但我建议无论如何都通读一遍本章内容，因为本章可能仍能提供良好的见解，进一步加深你的知识储备。


  本章涵盖以下教程：


  *   教程 3-1\. 创建数据并验证数据类型

  *   教程 3-2\. 创建和索引 Python 字符串

  *   教程 3-3\. 在不同数据类型之间进行类型转换

  *   教程 3-4\. 操作 Python 列表

  *   教程 3-5\. 操作 Python 元组

  *   教程 3-6\. 操作 Python 集合

  *   教程 3-7\. 操作 Python 字典

  *   教程 3-8\. 使用 `Define` 和 `Call` 函数

  *   教程 3-9\. 使用 `Create` 和 `Call` lambda 函数

  *   教程 3-10\. 使用 Python 条件语句

  *   教程 3-11\. 使用 Python 的 `for` 和 `while` 循环

  *   教程 3-12\. 使用 NumPy

  *   教程 3-13\. 将 IPython 和 IPython Notebook 与 PySpark 集成


  ## 教程 3-1\. 创建数据并验证数据类型


  ### 问题


  你想创建数据并验证数据类型。


  ### 解决方案


  Python 是一种动态类型语言。这意味着什么？动态类型意味着在定义变量时，程序员不需要像在 C 等其他编程语言中那样指明数据类型。为了学习 Python 的数据类型，你需要执行以下操作：


  *   创建一个整数并验证其数据类型

  *   创建一个长整数并验证其数据类型

  *   创建一个小数并验证其数据类型

  *   创建一个布尔值并验证其数据类型


  每当在控制台或 Python 脚本中提到字面量时，Python 解释器就会解释其数据类型。当字面量被赋值给变量时，Python 解释器会解释该字面量的数据类型。为了验证字面量或变量的数据类型，你可以使用
  Python 的 `type()` 函数。


  ### 工作原理


  让我们按照本节的步骤来创建数据并验证数据类型。


  #### 步骤 3-1-1\. 创建整数并验证其数据类型


  让我们在 Python 中创建一个整数。在下面这行代码中，我们将 Python 变量 `pythonInt` 与值 15 关联起来：


  ```

  >>> pythonInt = 15

  >>> pythonInt

  ```


  输出如下：


  ```

  15

  ```


  我们可以使用 `type()` 函数来验证 Python 对象的类型：


  ```

  >>> type(pythonInt)

  ```


  输出如下：


  ```

  <type ''int''>

  ```


  #### 步骤 3-1-2\. 创建长整数并验证其数据类型


  长整型（Long）数据类型用于表示大整数。在创建时，数字后面会加上 `L` 后缀。下面是创建长整型数据类型的示例：


  ```

  >>> pythonLongInt = 15L

  >>> pythonLongInt

  ```


  输出如下：


  ```

  15L

  ```


  使用 `type()` 函数，我们可以看到 `pythonLongInt` 的数据类型是 `long`。


  ```

  >>> type(pythonLongInt)

  ```


  输出如下：


  ```

  <type ''long''>

  ```


  #### 步骤 3-1-3\. 创建小数并验证其数据类型


  小数在任何数值计算中都经常使用。让我们创建一个浮点数：


  ```

  >>> pythonFloat = 15.4

  >>> pythonFloat

  ```


  输出如下：


  ```

  15.4

  ```


  现在让我们检查它的类型：


  ```

  >>> type(pythonFloat)

  ```


  输出如下：


  ```

  <type ''float''>

  ```


  #### 步骤 3-1-4\. 创建布尔值并验证其数据类型


  程序员的生涯充满了对各种条件的关注，例如，一个给定的数字是否大于 5。示例如下：


  ```

  >>> pythonBool = True

  >>> pythonBool

  ```


  输出如下：


  ```

  True

  >>> type(pythonBool)

  ```


  输出如下：


  ```

  <type ''bool''>

  >>> pythonBool = False

  >>> pythonBool

  ```


  输出如下：


  ```

  False

  ```


  ## 教程 3-2\. 创建和索引 Python 字符串


  ### 问题


  你想创建和索引 Python 字符串。


  ### 解决方案


  处理自然语言处理以及其他与字符串相关的问题。你需要执行以下操作：


  *   创建一个字符串并验证其数据类型

  *   索引字符串

  *   验证子字符串是否存在于给定字符串中

  *   检查字符串是否以给定的子字符串开头

  *   检查字符串是否以给定的子字符串结尾


  你可以使用一组双引号（`" "`）或一组单引号（`'' ''`）来创建字符串。索引可以使用一组方括号来完成。你可以使用多种方法来验证子字符串是否在给定的字符串中。可以使用
  `find()` 函数来查找子字符串是否存在于字符串内部。


  `startswith()` 函数指示给定的字符串是否以给定的子字符串开头。类似地，`endswith()` 函数可以确认给定的字符串是否以给定的子字符串结尾。


  ### 工作原理


  本节的步骤将解决我们的问题。


  #### 步骤 3-2-1\. 创建字符串并验证其数据类型


  要创建字符串，必须将给定的字符串字面量放在双引号或单引号之间。始终记住不要混用引号，即，一边使用单引号，另一边使用双引号。以下几行代码使用双引号和单引号创建字符串。让我们从双引号开始：


  ```

  >>> pythonString  = "PySpark Recipes"

  >>> pythonString

  ```


  输出如下：


  ```

  ''PySpark Recipes''

  ```


  你可以使用以下代码验证类型：


  ```

  >>> type(pythonString)

  ```


  输出如下：


  ```

  <type ''str''>

  ```


  现在让我们使用单引号创建一个字符串：


  ```

  >>> pythonString  = ''PySpark Recipes''

  >>> pythonString

  ```


  输出如下：


  ```

  ''PySpark Recipes''

  ```


  #### 步骤 3-2-2\. 索引字符串


  字符串元素可以被索引。当你索引字符串时，是从零开始的：


  ```

  >>> pythonStr = "Learning PySpark is fun"

  >>> pythonStr

  ```


  输出如下：


  ```

  ''Learning PySpark is fun''

  ```


  让我们获取第十个位置的字符串。让我再次提醒，字符串索引从零开始：


  ```

  >>> pythonStr[9]

  ```


  输出如下：


  ```

  ''P''

  ```


  #### 步骤 3-2-3\. 验证子字符串是否存在于给定字符串中


  如果在字符串中找到子字符串，Python 字符串的 `find()` 函数将返回字符串中匹配子字符串的最低索引。但是，如果在给定的字符串中未找到给定的子字符串，`find()`
  方法会返回 `-1`。让我们索引第九个位置的元素：




  ```python

  >>> pythonStr[9]

  ```


  输出结果如下：


  ```

  ''P''

  ```


  我们要查找子字符串 `Py` 是否存在于字符串 `pythonStr` 中。我们将使用 `find()` 方法：


  ```

  >>> pythonStr.find("Py")

  ```


  输出结果如下：


  ```

  9

  ```


  ```

  >>> pythonStr.find("py")

  ```


  输出结果如下：


  ```

  -1

  ```


  我们可以看到输出结果为 `9`。这是 `Py` 开始的索引位置。


  #### 步骤 3-2-4. 检查字符串是否以指定子字符串开头


  现在让我们关注另一个重要函数 `startswith()`。该函数用于判断一个给定字符串是否以某个特定子字符串开头。如果字符串以指定的子字符串开头，则返回 `True`；否则返回
  `False`。示例如下：


  ```

  >>> pythonStr.startswith("Learning")

  ```


  输出结果如下：


  ```

  True

  ```


  #### 步骤 3-2-5. 检查字符串是否以指定子字符串结尾


  类似地，`endswith()` 函数用于判断一个给定字符串是否以某个子字符串结尾。


  ```

  >>> pythonStr.endswith("fun")

  ```


  输出结果如下：


  ```

  True

  ```


  ## 方案 3-3. 数据类型转换


  ### 问题描述


  你希望将一种数据类型转换为另一种数据类型。


  ### 解决方案


  在数据分析中，数据类型转换是一项常见操作。以下一组问题将帮助你理解 Python 中的类型转换。你需要完成以下任务：


  * 将整数转换为浮点数

  * 将字符串转换为整数

  * 将字符串转换为浮点数


  类型转换是指将一种数据类型更改为另一种数据类型——例如，将字符串更改为整数或浮点数。在 PySpark 中，我们经常需要进行数据类型转换。Python 中有四个重要的类型转换函数：`int()`、`float()`、`long()`
  和 `str()`。


  ### 实现方法


  我们将按照本节中的步骤来解决上述问题。


  #### 步骤 3-3-1. 将整数转换为浮点数


  首先创建一个整数：


  ```

  >>> pythonInt = 17

  ```


  我们创建了一个整数变量 `pythonInt`。可以通过 `type()` 函数来查看 Python 对象的类型：


  ```

  >>> type(pythonInt)

  ```


  输出结果如下：


  ```

  <type ''int''>

  ```


  我们可以清楚地看到 `type()` 函数返回了 `int`。


  要将任何数据类型转换为 `float`，我们使用 `float()` 函数：


  ```

  >>> pythonFloat = float(pythonInt)

  ```


  `pythonInt` 的值已被转换为 `float` 类型。通过打印该变量可以看到变化：


  ```

  >>> print pythonFloat

  ```


  输出结果如下：


  ```

  17.0

  ```


  对 `pythonFloat` 执行 `type()` 函数，可以确认整数值已转换为浮点数：


  ```

  >>> type(pythonFloat)

  ```


  输出结果如下：


  ```

  <type ''float''>

  ```


  #### 步骤 3-3-2. 将字符串转换为整数


  `int()` 函数可以将字符串、浮点数或长整型转换为整数。在 PySpark 解决问题时，将字符串转换为整数会反复出现。我们先创建一个字符串：


  ```

  >>> pythonString = "15"

  >>> type(pythonString)

  ```


  输出结果如下：


  ```

  <type ''str''>

  ```


  在上面的 Python 代码片段中，我们创建了一个字符串，并检查了变量 `pythonString` 的类型。


  Python 内置的 `int()` 函数可以将变量转换为整数。以下代码使用 `int()` 函数将字符串更改为整数：


  ```

  >>> pythonInteger = int(pythonString)

  >>> pythonInteger

  ```


  输出结果如下：


  ```

  15

  ```


  ```

  >>> type(pythonInteger)

  ```


  输出结果如下：


  ```

  <type ''int''>

  ```


  #### 步骤 3-3-3. 将字符串转换为浮点数


  让我们解决最后一个类型转换问题。创建一个值为 `15.4` 的字符串，并使用 `float()` 函数将其转换为浮点数：


  ```

  >>> pythonString = "15.4"

  >>> type(pythonString)

  ```


  输出结果如下：


  ```

  <type ''str''>

  ```


  接下来，将我们的字符串转换为浮点数：


  ```

  >>> pythonFloat = float(pythonString)

  >>> pythonFloat

  ```


  输出结果如下：


  ```

  15.4

  ```


  ```

  >>> type(pythonFloat)

  ```


  输出结果如下：


  ```

  <type ''float''>

  ```


  Python 中有四种集合类型：列表、集合、字典和元组。在接下来的方案中，我们将逐一讨论这些集合。




