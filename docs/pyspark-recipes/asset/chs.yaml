- '# 创建 Lambda 函数


  你想要创建一个 lambda 函数，它接受一个整数作为输入，如果输入是偶数则返回 `True`，否则返回 `False`。


  ### 解决方案


  一个 lambda 函数也被称为匿名函数。lambda 函数是一个没有名字的函数。Python 中的 lambda 函数使用 `lambda` 关键字定义。


  ### 工作原理


  让我们创建一个 lambda 函数，检查一个给定的数字是否为偶数：


  ```

  >>> isEvenInteger = lambda ourNum : ourNum%2 == 0

  ```


  我们的 lambda 函数是 `lambda ourNum : ourNum%2 == 0`。你可以看到我们使用了关键字 `lambda` 来定义它。在关键字
  `lambda` 之后，我们写入了函数的参数。然后在冒号之后，我们有一个逻辑表达式。我们的逻辑表达式将检查输入的数字是否能被 2 整除。在 Python 中，函数是对象，所以我们的
  lambda 函数也是一个对象。因此，我们可以将我们的对象放入一个变量中。这就是我们如何将 lambda 函数放入变量 `isEvenInteger` 的方法：


  ```

  >>> isEvenInteger(4)

  ```


  输出如下：


  ```

  True

  >>> isEvenInteger(5)

  ```


  输出如下：


  ```

  False

  ```


  lambda 函数的缺点是只能编写一个表达式。该特定表达式的结果将被返回。Python 关键字 `return` 不需要用于返回表达式的值。lambda 函数不能扩展到超过一行。


  '
- '# 食谱 3-10：使用 Python 条件语句


  ### 问题


  你想使用 Python 条件语句。


  ### 解决方案


  一家汽车制造公司生产三种类型的汽车。这三种汽车通过其气缸数进行区分。显而易见，不同的气缸数会导致不同的油耗。汽车 A 有四个气缸，汽车 B 有六个气缸，汽车 C
  有八个气缸。表 3-1 显示了汽车的气缸数和相应的油耗。


  **表 3-1.** 气缸数与相应油耗


  | 气缸数 | 油耗（英里/加仑） |

  | --- | --- |

  | 4 | 22 |

  | 6 | 18 |

  | 8 | 16 |


  销售主管 A 先生总是忘记气缸数和油耗之间的关系。所以你想创建一个小的 Python 应用程序，在给定气缸数的情况下返回油耗。这将是对 A 先生极大的帮助。


  条件语句对于解决任何编程问题都是必不可少的。Python 也不例外。在 Python 中，条件语句通过使用 `if`、`elif` 和 `else` 关键字来实现。


  ### 工作原理


  为了创建所需的 Python 应用程序，我们将编写一个 Python 函数，该函数将气缸数作为输入并返回相应的油耗。


  以下是我们将用来创建应用程序的函数：


  ```

  >>> def mpgFind(numOfCylinders) :

  ...       if(numOfCylinders == 4 ):

  ...             mpg = 22

  ...       elif(numOfCylinders == 6 ):

  ...            mpg = 18

  ...       else :

  ...            mpg = 16

  ...       return mpg

  ```


  这里我们定义了一个名为 `mpgFind` 的函数。我们的函数将接受变量 `numOfCylinders`。进入函数后，我们的变量将面临一个逻辑表达式 `numOfCylinders
  == 4`。如果 `numOfCylinders` 的值为 4，逻辑表达式将返回 `True`，并且 `if` 块将被执行。我们的 `if` 块只有一个语句 `mpg=22`。如果需要，可以提供多个语句。


  如果 `numOfCylinders == 4` 的结果是 `False`，则 `elif` 逻辑表达式将被测试。如果 `numOfCylinders` 的值是
  6，`elif` 的逻辑表达式将返回 `True`，并且 18 将被赋值给 `mpg`。


  如果 `if` 和 `elif` 的逻辑表达式都返回 `False` 会怎样？在这种情况下，`else` 块将被执行。变量 `mpg` 将被赋值为 16。


  让我们用输入 4 调用我们的函数并查看结果：


  ```

  >>> mpgFind(4)

  ```


  输出如下：


  ```

  22

  ```


  你可以清楚地看到，我们的函数可以帮助我们的销售主管 A 先生。




  '
- '# 方法 3-11：使用 Python 的 `for` 和 `while` 循环


  ### 问题


  你想要使用 Python 的 `for` 和 `while` 循环。


  ### 解决方案


  销售主管 A 先生得知自己的应用程序是用 Python 编写的后，对学习 Python 产生了兴趣。他参加了一个 Python 课程。他的导师 X 先生给他布置了一道作业题。X
  先生要求全班同学实现一个 Python 函数，该函数以 1 到 101 的整数列表作为输入，然后返回列表中所有偶数的和。A 先生发现，可以使用以下循环来实现所需函数：


  * `for` 循环

  * `while` 循环


  循环最适合提高代码的复用性。我们使用循环来多次运行某段代码。可以通过 `for` 和 `while` 循环来运行特定的代码段。要计算列表中偶数的总和，需要两个步骤：首先找出所有偶数，然后进行求和。


  ### 工作原理


  ### 步骤 3-11-1：实现 `for` 循环


  首先，我们将通过 Python 中的 `for` 循环来获取列表中偶数的总和：


  ```

  >>> def sumUsingForLoop(numbers) :

  ...       sumOfEvenNumbers = 0

  ...       for i in numbers :

  ...           if i % 2 ==0 :

  ...               sumOfEvenNumbers = sumOfEvenNumbers +i

  ...           else :

  ...              pass

  ...       return   sumOfEvenNumbers

  ```


  这里我们编写了一个名为 `sumUsingForLoop` 的 Python 函数。该函数将 `numbers` 作为输入。Python 中的 `for` 循环会遍历一个
  Python 序列。如果我们传入一个整数列表，`for` 循环会逐个元素开始迭代。`if` 块将检查当前数字是否为偶数。如果是偶数，变量 `sumOfEvenNumbers`
  将通过累加增加该数值。迭代完成后，返回最终的累加和。


  让我们测试一下该函数的运行情况：


  ```

  >>> numbers = range(1,102)

  >>> numbers

  ```


  输出如下：


  ```

  [1, 2, 3, 4, 5, 6, 7,............,  98, 99, 100, 101]

  ```


  我们使用 `range()` 函数创建了一个从 1 到 101 的整数列表。现在调用我们的函数 `sumUsingForLoop` 并查看结果：


  ```

  >>> sumUsingForLoop(numbers)

  ```


  输出如下：


  ```

  ```


  ### 步骤 3-11-2：实现 `while` 循环


  在本节中，我们将实现一个使用 `while` 循环的解决方案：


  ```

  >>> def sumUsingWhileLoop(numbers) :

  ...      i = 1

  ...      sumOfEvenNumbers = 0

  ...      while i <= 101 :

  ...           if i % 2 ==0 :

  ...                sumOfEvenNumbers = sumOfEvenNumbers +i

  ...           i = i + 1

  ...      return  sumOfEvenNumbers

  ```


  这里我们定义了一个名为 `sumUsingWhileLoop` 的 Python 函数。该函数将 `numbers` 作为输入。Python 中的 `while`
  循环有助于遍历 Python 序列。如果我们传入一个整数列表，可以像代码中所示那样逐个元素进行迭代。`if` 块将检查当前数字是否为偶数。如果是偶数，变量 `sumOfEvenNumbers`
  将通过累加增加该数值。迭代完成后，返回最终的累加和。


  让我们测试一下这个函数：


  ```

  >>> sumUsingWhileLoop(numbers)

  ```


