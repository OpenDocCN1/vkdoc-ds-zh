  \ 的两个组件：HDFS 和 YARN——HDFS 用于数据存储，YARN 用作集群管理器。安装 Hadoop 需要你下载并配置它。\n\n### 工作原理\n\
  \n请按照以下步骤完成安装。\n\n#### 步骤 2-1-1. 创建新的 CentOS 用户\n\n在此步骤中，我们将创建一个新用户。你可能会想，为什么要创建新用户？为什么不能安装到现有用户上？原因在于，我们想为所有大数据框架提供一个专用用户。通过以下代码行，我们创建用户\
  \ `pysparkbook`：\n\n```\n[root@localhost pyspark]# adduser pysparkbook\n[root@localhost\
