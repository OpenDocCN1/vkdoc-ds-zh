  \ 可以从 HDFS、NoSQL 数据库或关系数据库管理系统（RDBMS）中读取数据。在数据分析之后，我们也可以将结果保存到 HDFS 或数据库中。\n\n本章涵盖阅读本书所需的所有软件安装。我们将在\
  \ CentOS 操作系统上安装所有必需的大数据框架。CentOS 是一款企业级操作系统，免费使用且易于获取。你可以从 [www.centos.org/download/](https://www.centos.org/download/)\
  \ 下载 CentOS，然后将其安装在虚拟机上。\n\n本章包含以下实践方案：\n\n*   方案 2-1. 在单机上安装 Hadoop\n*   方案 2-2.\
