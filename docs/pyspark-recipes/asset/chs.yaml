  \ `{}` 来创建。最重要的一点是，在创建时，我们可以向集合中放入重复项。但集合随后会移除其中所有重复的项。与其他集合一样，集合对象上也定义了许多函数。如果你想向集合中添加一个新元素，可以使用\
  \ `add()` 函数。\n\n求两个集合的并集是我们日常任务中常见的一个操作。定义在我们集合对象上的 `union()` 函数会为我们计算两个集合的并集。\n\
  \n\n\n`intersect()`\n函数用于对两个给定的 Python 集合执行交集运算。\n\n### 工作原理\n\n在本节中，我们将逐步解决给定的问题。\n\
  \n### 步骤 3-6-1：创建一个集合\n\n让我们创建一个包含文具的集合，然后验证不同元素是否存在。以下代码行创建了一个文具集合：\n\n```\n>>>\
  \ pythonSet = {'Book','Pen','NoteBook','Pencil','Book'}\n>>> pythonSet\n```\n\n\
  输出如下：\n\n```\nset(['Pencil', 'Pen', 'Book', 'NoteBook'])\n```\n\n我们已经创建了一个集合。可以观察到，放入重复元素不会引发错误，但集合在创建时不会考虑该重复元素。\n\
  \n### 步骤 3-6-2：向集合添加新元素\n\n使用`add()`函数可以向集合添加新元素。我们已经创建了集合`pythonSet`。现在我们将向集合中添加一个新元素`Eraser`，如下所示：\n\
  \n```\n>>> pythonSet.add(\"Eraser\")\n>>> pythonSet\n```\n\n输出如下：\n\n```\nset(['Pencil',\
  \ 'Pen', 'Book', 'Eraser', 'NoteBook'])\n```\n\n在这个例子中可以看到，我们已经向集合中添加了新元素`Eraser`。\n\
  \n### 步骤 3-6-3：对集合执行并集运算\n\nPython 集合的并集运算将以数学方式执行。让我们为此示例创建另一个集合：\n\n```\n>>> pythonSet1\
  \ = {'NoteBook','Pencil','Diary','Marker'}\n>>> pythonSet1\n```\n\n输出如下：\n\n```\n\
  set(['Marker', 'Pencil', 'NoteBook', 'Diary'])\n```\n\n两个集合的并集将返回另一个包含两个集合中所有元素（包括任一集合中的元素或两者共有的元素）的集合。在以下示例中，可以看到`pythonSet`和`pythonSet1`的并集返回了两者在`pythonSet`和`pythonSet1`中所有合并的元素：\n\
  \n```\n>>> pythonSet.union(pythonSet1)\n```\n\n输出如下：\n\n```\nset(['Pencil', 'Pen',\
  \ 'NoteBook', 'Book', 'Eraser',  'Diary', 'Marker'])\n```\n\n### 步骤 3-6-4：对集合执行交集运算\n\
  \n`intersection()`函数将返回一个包含两个给定集合中共同元素的新集合。我们已经创建了两个集合`pythonSet`和`pythonSet1`。可以观察到`Pencil`和`NoteBook`是这两个集合中的共同元素。在以下代码行中，我们对集合使用了`intersection()`：\n\
  \n```\n>>> pythonSet.intersection(pythonSet1)\n```\n\n输出如下：\n\n```\nset(['Pencil',\
  \ 'NoteBook'])\n```\n\n运行代码后，可以清楚地看到交集将返回两个集合中共同的元素。\n\n## 食谱 3-7：使用 Python 字典\n\
  \n### 问题\n\n你想使用 Python 字典。\n\n### 解决方案\n\n你已经看到列表和元组是通过它们的索引编号进行索引。当索引使用单词时，这种情况变得更加清晰。Python\
  \ 字典是一种存储键/值对的数据结构。Python 字典的每个元素都是一个键/值对。在此练习中，你希望对 Python 字典执行以下操作：\n\n*   创建一个文具字典，以商品\
  \ ID 作为键，商品名称作为值\n*   使用键索引元素\n*   获取所有键\n*   获取所有值\n\n创建字典可以通过使用一对花括号`{ }`来实现。你可能会有些困惑，因为我们之前使用花括号创建了\
  \ Python 集合，而现在又要以同样的方式创建字典。但让我告诉你，为了创建字典，我们必须在花括号内提供键/值对——例如`{key:value}`。可以观察到，在键/值对中，键与值通过冒号（`:`）分隔。两个不同的键/值对通过逗号（`,`）分隔。\n\
  \n你可以使用方括号`[ ]`对字典进行索引。Python 字典对象有一个`get()`函数，该函数返回给定键对应的值。\n\n你可以使用`keys()`函数获取所有键；`values()`函数返回所有值。\n\
  \n### 工作原理\n\n我们将使用本节的步骤来解决我们的问题。\n\n#### 步骤 3-7-1：创建一个文具字典\n\n我们将使用以下 Python 代码行创建一个字典：\n\
  \n\n\n```python\n>>> pythonDict = {'item1':'Pencil','item2':'Pen', 'item3':'NoteBook'}\n\
  >>> pythonDict\n```\n\n输出如下：\n\n```python\n{'item2': 'Pen', 'item3': 'NoteBook',\
  \ 'item1': 'Pencil'}\n```\n\n### 第 3-7-2 步：通过键索引元素\n\n让我们获取`'item1'`的值：\n\n```python\n\
  >>> pythonDict['item1']\n```\n\n输出如下：\n\n```python\n'Pencil'\n```\n\n但如果字典中找不到该键，则会抛出`KeyError`异常：\n\
  \n```python\n>>> pythonDict['item4']\n```\n\n输出如下：\n\n```python\nTraceback (most\
  \ recent call last):\nFile \"\", line 1, in \nKeyError: 'item4'\n```\n\n为了防止`KeyError`异常，我们可以对字典使用`get()`函数。这样，如果给定键未找到值，它将返回空值（否则返回与该键关联的值）。让我们在以下\
  \ Python 代码片段中探索`get()`：\n\n```python\n>>> pythonDict.get('item1')\n```\n\n输出如下：\n\
  \n```python\n'Pencil'\n```\n\n我们知道键`item4`不在我们的字典中。因此，在这种情况下，Python 的`get()`函数将返回空值：\n\
  \n```python\n>>> pythonDict.get('item4')\n```\n\n### 第 3-7-3 步：获取所有键\n\n在解决问题时，经常需要一次性获取所有键。让我们通过使用`keys()`函数来获取所有键：\n\
  \n```python\n>>> pythonDict.keys()\n```\n\n输出如下：\n\n```python\n['item2', 'item3',\
  \ 'item1']\n```\n\n`keys()`以列表形式返回所有键。\n\n### 第 3-7-4 步：获取所有值\n\n应用`values()`函数将返回字典中的所有值：\n\
  \n```python\n>>> pythonDict.values()\n```\n\n输出如下：\n\n```python\n['Pen', 'NoteBook',\
  \ 'Pencil']\n```\n\n与`keys()`函数类似，`values()`也以列表形式返回所有值。\n\n### 方案 3-8：使用定义和调用函数\n\
  \n### 问题\n\n你想编写一个 Python 函数，该函数接受一个整数作为输入，如果输入是偶数则返回`True`，否则返回`False`。\n\n###\
  \ 解决方案\n\n函数可以提高代码的可读性和可重用性。在 Python 中，函数定义以`def`关键字开头。用户定义的函数名紧随`def`关键字之后。如果函数接受参数，则将其写在括号内；否则，我们只写一对括号。括号后面是冒号（`:`）。然后我们开始编写语句作为函数体。函数体相对于包含`def`关键字的行进行缩进。如果用户定义的函数返回一个值，则通过使用\
  \ Python 的`return`关键字来实现。\n\n### 工作原理\n\n我们将创建一个名为`isEvenInteger`的函数。以下几行定义了我们函数：\n\
  \n```python\n>>> def isEvenInteger(ourNum) :\nreturn ourNum %2 == 0\n```\n\n在这个代码示例中，我们可以看到我们的函数名是`isEvenInteger`。函数名位于`def`关键字之后。函数的参数（本例中是`ourNum`）位于括号内。冒号之后，我们定义了函数体。在这个函数体中，只有一个语句。函数体语句返回一个逻辑表达式的输出。我们通过使用`return`关键字从函数中返回一个值。如果函数不返回任何值，则省略`return`关键字。函数体的逻辑表达式用来检查输入数字模\
  \ 2 是否等于零。\n\n定义完函数`isEvenInteger`后，我们需要调用它才能观察其工作效果。为了测试函数的运行，我们将先使用一个偶数参数调用它，然后再用一个奇数整数参数调用它。我们从偶数整数输入开始。这里我们提供输入\
  \ 4，它是一个偶数整数：\n\n```python\n>>> isEvenInteger(4)\n```\n\n输出如下：\n\n```python\nTrue\n\
  ```\n\n正如我们所见，输出是`True`。这意味着我们提供的输入是一个偶数。\n\n现在让我们提供一个奇数作为输入：\n\n```python\n>>>\
  \ isEvenInteger(5)\n```\n\n输出如下：\n\n```python\nFalse\n```\n\n当输入为奇数时，我们的函数`isEvenInteger`返回了`False`。\n\
