  \ Spark\n\n### 问题\n\n您想在一台机器上安装 Spark。\n\n### 解决方案\n\n我们将为 Hadoop 版本 2.6 安装预构建的\
  \ `spark-2.0.0`。我们可以从源代码构建 Spark。但在本例中，我们将使用预构建的 Apache Spark。\n\n### 工作原理\n\n按照本节中的步骤完成安装。\n\
  \n#### 步骤 2-2-1。下载 Apache Spark\n\n我们将从其镜像站点下载 Spark。我们将使用`wget`命令，如下所示：\n\n```\n\
  [pysparkbook@localhost binaries]$ wget  https://d3kbcqa49mib13.cloudfront.net/spark-2.0.0-bin-hadoop2.6.tgz\n\
  ```\n\n#### 步骤 2-2-2。解压 Spark 的 .tgz 文件\n\n使用以下命令解压 .tgz 文件：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ tar xvzf spark-2.0.0-bin-hadoop2.6.tgz\n```\n\n#### 步骤 2-2-3。将解压后的\
  \ Spark 目录移动到 /allPySpark\n\n现在我们必须将解压后的 Spark 目录移动到`/allPySpark`位置下。使用以下命令：\n\n\
  ```\n[pysparkbook@localhost binaries]$ sudo mv spark-2.0.0-bin-hadoop2.6   /allPySpark/\
  \ spark\n```\n\n#### 步骤 2-2-4。修改 Spark 环境文件\n\nSpark 环境文件包含了运行 Spark 所需的所有环境变量。我们将在环境文件中设置以下环境变量：\n\
  \n*   `HADOOP_CONF_DIR`：Hadoop 的配置目录\n*   `SPARK_CONF_DIR`：备用配置目录（默认：`${SPARK_HOME}/conf`）\n\
  *   `SPARK_LOG_DIR`：存储日志文件（默认：`${SPARK_HOME}/log`）\n*   `SPARK_WORKER_DIR`：设置工作进程的工作目录\n\
  *   `HIVE_CONF_DIR`：用于从 Hive 读取数据\n\n首先，我们必须将`spark-env.sh.template`文件复制到`spark-env.sh`。Spark\
  \ 环境文件`spark-env.sh`位于`spark/conf`（配置目录位置）内。以下是命令：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ cp /allPySpark/spark/conf/spark-env.sh.template /allPySpark/spark/conf/spark-env.sh\n\
  ```\n\n现在让我们打开`spark-env.sh`文件：\n\n```\n[pysparkbook@localhost binaries]$ vim /allPySpark/spark/conf/spark-env.sh\n\
  ```\n\n现在将以下行追加到`spark-env.sh`的末尾：\n\n```\nexport HADOOP_CONF_DIR=/allPySpark/hadoop/etc/hadoop/\n\
  export SPARK_LOG_DIR=/allPySpark/logSpark/\nexport SPARK_WORKER_DIR=/tmp/spark\n\
  export HIVE_CONF_DIR=/allPySpark/hive/conf\n```\n\n#### 步骤 2-2-5。修改 .bashrc 文件\n\
  \n在 `.bashrc` 文件中，我们必须添加 Spark 的 `bin` 目录。使用以下命令：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ vim  ∼/.bashrc\n```\n\n然后在 `.bashrc` 文件中添加以下行：\n\n```\nexport SPARK_HOME=/allPySpark/spark\n\
  export PATH=$PATH:$SPARK_HOME/bin\n```\n\n之后，执行 source 命令使 `.bashrc` 文件生效：\n\n```\n\
  [pysparkbook@localhost binaries]$ source  ∼/.bashrc\n```\n\n#### 步骤 2-2-6。启动 PySpark\n\
  \n我们可以使用`pyspark`脚本来启动 PySpark shell。关于`pyspark`脚本的讨论将在下一个配方中继续。\n\n```\n[pysparkbook@localhost\
  \ binaries]$ pyspark\n```\n\n我们已经完成了又一个成功的安装。要完成本书的学习，还需要其他安装，但让我们先关注 PySpark shell。\n\
  \n## 配方 2-3。使用 PySpark Shell\n\n### 问题\n\n您想使用 PySpark shell。\n\n### 解决方案\n\nPySpark\
  \ shell 是一个交互式 shell，用于通过 Python 与 PySpark 交互。PySpark shell 可以通过使用 PySpark 脚本来启动。PySpark\
  \ 脚本可以在 `spark/bin` 位置找到。\n\n### 工作原理\n\nPySpark shell 可以如下启动：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ pyspark\n```\n\n启动后，PySpark 将显示如图 2-1 所示的屏幕。\n\n![A430628_1_En_2_Fig1_HTML.jpg](img/A430628_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1。\n\n启动 PySpark 中的控制台屏幕\n\n您可以看到，启动后，PySpark 会显示大量信息。它显示正在使用的 Python 版本以及\
  \ PySpark 版本信息。\n\n`>>>` 符号对于 Python 程序员来说是熟知的。每当我们启动 Python shell 时，都会得到这个符号。它告诉我们，现在可以编写我们的\
  \ Python 命令了。类似地，在 PySpark 中，此符号告诉我们，现在可以编写我们的 Python 或 PySpark 命令并查看结果。\n\nPySpark\
  \ shell 在 PySpark 的单机安装和集群安装上工作方式类似。\n\n## 配方 2-4。在单机上安装 Hive\n\n### 问题\n\n您想在一台机器上安装\
  \ Hive。\n\n### 解决方案\n\n我们在第一章中讨论了 Hive。现在是在我们的机器上安装 Hive 的时候了。我们将在后续章节中从 PySpark\
  \ 读取 Hive 中的数据。\n\n### 工作原理\n\n按照本节中的步骤完成安装。\n\n#### 步骤 2-4-1。下载 Hive\n\n我们可以从 Apache\
  \ Hive 网站下载 Hive。我们使用`wget`命令下载 Hive 的 tar.gz 文件，如下所示：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ wget http://www-eu.apache.org/dist/hive/hive-2.0.1/apache-hive-2.0.1-bin.tar.gz\n\
  ```\n\n以下是输出：\n\n```\n100%[=============================================>] 139,856,338\
  \  709KB/s   in 3m 5s\n2016-12-26 09:34:21 (737 KB/s) - 'apache-hive-2.0.1-bin.tar.gz'\
  \ saved [139856338/139856338]\n```\n\n#### 步骤 2-4-2。解压 Hive\n\n我们已经下载了 `apache-hive-2.0.1-bin.tar.gz`，一个\
  \ `.tar.gz` 文件。所以现在我们必须解压它。我们可以使用`tar`命令解压它，如下所示：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ tar xvzf   apache-hive-2.0.1-bin.tar.gz\n```\n\n#### 步骤 2-4-3。移动解压后的\
  \ Hive 目录\n\n```\n[pysparkbook@localhost binaries]$ sudo mv apache-hive-2.0.1-bin\
  \ /allPySpark/hive\n```\n\n\n\n#### 步骤 2-4-4. 更新 `hive-site.xml`\n\nHive 默认使用嵌入式的\
  \ Derby 数据库作为元数据存储。Derby 数据库是无内存的，因此最好为其指定一个明确的位置。我们可以在 `hive-site.xml` 中提供该位置。为此，我们需要将\
  \ `hive-default.xml.template` 移动为 `hive-site.xml`。\n\n```\n[pysparkbook@localhost\
  \ binaries]$ mv /allPySpark/hive/conf/hive-default.xml.template /allPySpark/hive/conf/hive-default.xml.templatehive-site.xml\n\
  ```\n\n然后打开 `hive-site.xml` 并进行如下更新：\n\n```\n[pysparkbook@localhost binaries]$ vim\
  \ /allPySpark/hive/conf/hive-site.xml\n```\n\n你可以将以下几行添加到 `hive-site.xml` 的末尾，或者直接修改\
  \ `hive-site.xml` 文件中的 `javax.jdo.option.ConnectionURL`：\n\n```\njavax.jdo.option.ConnectionURL\n\
  jdbc:derby:;databaseName=/allPySpark/hive/metastore/metastore_db;create=true\n```\n\
  \n之后，我们需要将 `HADOOP_HOME` 添加到 `hive_env.sh` 文件中，操作如下：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ mv /allPySpark/hive/conf/hive-env.sh.template /allPySpark/hive/conf/hive-env.sh\n\
  [pysparkbook@localhost binaries]$ vim  /allPySpark/hive/conf/hive-env.sh\n```\n\n\
  然后在 `hive-env.sh` 中添加以下行：\n\n```\n# Set HADOOP_HOME to point to a specific hadoop\
  \ install directory\nHADOOP_HOME=/allPySpark/hadoop\n```\n\n#### 步骤 2-4-5. 更新 `.bashrc`\
  \ 文件\n\n打开 `.bashrc` 文件。该文件位于主目录中：\n\n```\n[pysparkbook@localhost binaries]$ vim\
  \  ∼/.bashrc\n```\n\n将以下行添加到 `.bashrc` 文件中：\n\n```\n####################Hive 参数\
  \ ######################\nexport HIVE_HOME=/allPySpark/hive\nexport PATH=$PATH:$HIVE_HOME/bin\n\
  ```\n\n现在使用以下命令加载 `.bashrc` 文件：\n\n```\n[pysparkbook@localhost binaries]$ source\
  \ ∼/.bashrc\n```\n\n#### 步骤 2-4-6. 创建 Hive 数据仓库目录\n\n现在我们需要创建数据仓库目录。Hive 会使用该数据仓库目录来放置数据文件。\n\
  \n```\n[pysparkbook@localhost binaries]$hadoop fs -mkdir -p /user/hive/warehouse\n\
  [pysparkbook@localhost binaries]$hadoop fs -mkdir -p /tmp\n[pysparkbook@localhost\
  \ binaries]$hadoop fs -chmod g+w /user/hive/warehouse\n[pysparkbook@localhost binaries]$hadoop\
  \ fs -chmod g+w /tmp\n```\n\n`/user/hive/warehouse` 目录就是 Hive 的数据仓库目录。\n\n#### 步骤\
  \ 2-4-7. 初始化元数据存储数据库\n\n有时需要初始化一个模式。你可能会想，是什么的模式？我们知道 Hive 将表的元数据存储在关系数据库中。目前，我们将使用\
  \ Derby 数据库作为 Hive 的元数据存储数据库。在接下来的方法中，我们将把 Hive 连接到外部的 PostgreSQL。在 Ubuntu 中，Hive\
  \ 安装无需此命令即可工作。但在 CentOS 中我发现必须执行它。如果不执行以下命令，Hive 会抛出错误：\n\n```\n[pysparkbook@localhost\
  \  binaries]$ schematool -initSchema -dbType derby\n```\n\n#### 步骤 2-4-8. 检查 Hive\
  \ 安装\n\n现在 Hive 已经安装完成，我们应该检查一下工作是否正常。使用以下命令启动 Hive Shell：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ hive\n```\n\n然后我们会发现 Hive Shell 已经打开，如下所示：\n\n```\nhive>\n```\n\n##\
  \ 方法 2-5. 安装 PostgreSQL\n\n### 问题\n\n你想要安装 PostgreSQL。\n\n### 解决方案\n\nPostgreSQL\
  \ 是一个由加州大学开发的关系数据库管理系统。PostgreSQL 许可证允许使用、修改和分发 PostgreSQL。PostgreSQL 可以在 macOS\
  \ 以及类 Unix 系统（如 Red Hat 和 Ubuntu）上运行。我们将在 CentOS 上进行安装。\n\n我们将以两种方式使用 PostgreSQL。首先，我们将\
  \ PostgreSQL 用作 Hive 的元数据存储数据库。有了外部数据库作为元数据存储，我们将能够轻松读取现有 Hive 中的数据。其次，我们将从 PostgreSQL\
  \ 读取数据，分析后将结果保存回 PostgreSQL。\n\n安装 PostgreSQL 可以通过源代码进行，但我们将通过命令行 `yum` 安装程序来安装。\n\
  \n### 实现原理\n\n按照本节中的步骤完成安装。\n\n#### 步骤 2-5-1. 安装 PostgreSQL\n\n可以使用 `yum` 安装程序安装\
  \ PostgreSQL。命令如下：\n\n```\n[pysparkbook@localhost binaries]$ sudo yum install postgresql-server\n\
  ```\n\n[sudo] pysparkbook 的密码：\n\n#### 步骤 2-5-2. 初始化数据库\n\n要使用 PostgreSQL，我们首先需要使用\
  \ `initdb` 工具来初始化数据库。如果不初始化数据库，我们就无法使用它。在初始化数据库时，我们还可以指定数据库的数据文件。安装 PostgreSQL 后，我们必须对其进行初始化。可以使用以下命令初始化数据库：\n\
  \n```\n[pysparkbook@localhost binaries]$ sudo postgresql-setup initdb\n```\n\n输出如下：\n\
  \n```\n初始化数据库 ... 确定\n```\n\n#### 步骤 2-5-3. 启用并启动数据库\n\n```\n[pysparkbook@localhost\
  \ binaries]$ sudo systemctl enable postgresql\n[pysparkbook@localhost binaries]$\
  \ sudo systemctl start postgresql\n[pysparkbook@localhost binaries]$ sudo -i -u\
  \ postgres\n```\n\n输出如下：\n\n```\n-bash-4.2$ psql\npsql (9.2.18)\n输入 \"help\" 获取帮助。\n\
  postgres=#\n```\n\n注意\n\n安装步骤位于以下网页：\n\n[`https://wiki.postgresql.org/wiki/YUM_Installation`](https://wiki.postgresql.org/wiki/YUM_Installation)\n\
  \n## 方法 2-6. 在 PostgreSQL 上配置 Hive 元数据存储\n\n### 问题\n\n你想要在 PostgreSQL 上配置 Hive 元数据存储。\n\
  \n### 解决方案\n\n我们知道，Hive 将表的元数据存放在关系数据库中。我们已经安装了 Hive。我们的 Hive 安装包含一个内嵌的元数据存储。Hive\
  \ 使用 Derby 关系数据库系统作为其元数据存储。在接下来的章节中，我们将从 PySpark 读取现有的 Hive 表。\n\n在 PostgreSQL 上配置\
  \ Hive 元数据存储需要我们在 PostgreSQL 数据库中填充表。这些表将保存 Hive 表的元数据。之后，我们必须配置 Hive 的属性文件。\n\n\
  ### 实现原理\n\n在本节中，我们将在 PostgreSQL 数据库上配置 Hive 元数据存储。然后，我们的 Hive 元数据将存放在 PostgreSQL\
  \ 中。\n\n#### 步骤 2-6-1. 下载 PostgreSQL JDBC 连接器\n\n我们需要一个 JDBC 连接器，以便 Hive 进程可以连接到外部的\
  \ PostgreSQL。我们可以使用以下命令获取 JDBC 连接器：\n\n```\n[pysparkbook@localhost binaries]$ wget\
  \ https://jdbc.postgresql.org/download/postgresql-9.4.1212.jre6.jar\n```\n\n####\
  \ 步骤 2-6-2. 将 JDBC 连接器复制到 Hive 的 `lib` 目录\n\n获取 JDBC 连接器后，我们需要将其放入 Hive 的 `lib`\
  \ 目录：\n\n```\n[pysparkbook@localhost binaries]$ cp postgresql-9.4.1212.jre6.jar\
  \  /allPySpark/hive/lib/\n```\n\n#### 步骤 2-6-3. 连接到 PostgreSQL\n\n使用此命令连接到 PostgreSQL：\n\
  \n```\n[pysparkbook@localhost binaries]$ sudo -u postgres psql\n```\n\n#### 步骤 2-6-4.\
  \ 创建所需的用户和数据库\n\n在此步骤中，我们将创建一个 PostgreSQL 用户 `pysparkBookUser`。然后，我们将创建一个名为 `pymetastore`\
  \ 的数据库。我们的数据库将保存与 Hive 元数据存储相关的所有表。\n\n首先，创建用户：\n\n```\npostgres=# CREATE USER pysparkBookUser\
  \ WITH PASSWORD 'pbook';\n```\n\n输出如下：\n\n```\nCREATE ROLE\n```\n\n接下来，创建数据库：\n\n\
  ```\npostgres=# CREATE DATABASE pymetastore;\n```\n\n输出如下：\n\n```\nCREATE DATABASE\n\
  ```\n\n`\\c` 是 PostgreSQL 的 connect 命令。我们已经创建了数据库 `pymetastore`。现在我们将使用 `\\c` 命令连接到这个数据库：\n\
  \n```\npostgres=# \\c pymetastore;\n```\n\n您现在已连接到 `pymetastore` 数据库。您可以在 [`www.postgresql.org/docs/9.0/static/app-psql.html`](https://www.postgresql.org/docs/9.0/static/app-psql.html)\
  \ 查看更多 PostgreSQL 命令。\n\n\n\n#### 步骤 2-6-5. 在 `pymetastore` 数据库中填充数据\n\nHive 拥有自己的\
  \ PostgreSQL 脚本来为元存储填充表。`\\i` 命令从 PostgreSQL 脚本中读取命令并执行这些命令。以下命令运行 `hive-txn-schema-2.0.0.postgres.sql`\
  \ 脚本，该脚本将创建 Hive 元存储所需的所有表：\n\n```\npymetastore=#  \\i /allPySpark/hive/scripts/metastore/upgrade/postgres/hive-txn-schema-2.0.0.postgres.sql\n\
  ```\n\n以下是输出：\n\n```\npsql:/allPySpark/hive/scripts/metastore/upgrade/postgres/hive-txn-schema-2.0.0.postgres.sql:30:\
  \ NOTICE:  CREATE TABLE / PRIMARY KEY will create implicit index \"txns_pkey\" for\
  \ table \"txns\"\nCREATE TABLE\nCREATE TABLE\nINSERT 0 1\npsql:/allPySpark/hive/scripts/metastore/upgrade/postgres/hive-txn-schema-2.0.0.postgres.sql:69:\
  \ NOTICE:  CREATE TABLE / PRIMARY KEY will create implicit index \"hive_locks_pkey\"\
  \ for table \"hive_locks\"\nCREATE TABLE\n```\n\n#### 步骤 2-6-6. 授予权限\n\n以下命令将授予一些权限：\n\
  \n```\npymetastore=# grant select, insert,update,delete on public.txns to pysparkBookUser;\n\
  GRANT\npymetastore=# grant select, insert,update,delete on public.txn_components\
  \ to pysparkBookUser;\nGRANT\npymetastore=# grant select, insert,update,delete on\
  \ public.completed_txn_components   to pysparkBookUser;\nGRANT\npymetastore=# grant\
  \ select, insert,update,delete on public.next_txn_id to pysparkBookUser;\nGRANT\n\
  pymetastore=# grant select, insert,update,delete on public.hive_locks to pysparkBookUser;\n\
  GRANT\npymetastore=# grant select, insert,update,delete on public.next_lock_id to\
  \ pysparkBookUser;\nGRANT\npymetastore=# grant select, insert,update,delete on public.compaction_queue\
  \ to pysparkBookUser;\nGRANT\npymetastore=# grant select, insert,update,delete on\
  \ public.next_compaction_queue_id to pysparkBookUser;\nGRANT\npymetastore=# grant\
  \ select, insert,update,delete on public.completed_compactions to pysparkBookUser;\n\
  GRANT\npymetastore=# grant select, insert,update,delete on public.aux_table to pysparkBookUser;\n\
  GRANT\n```\n\n#### 步骤 2-6-7. 修改 `pg_hba.conf` 文件\n\n请记住，为了更新 `pg_hba.conf`，你应该是\
  \ root 用户。所以首先成为 root 用户。然后打开 `pg_hba.conf` 文件：\n\n```\n[root@localhost binaries]#\
  \ vim /var/lib/pgsql/data/pg_hba.conf\n```\n\n然后将所有 peer 和 ident 改为 `trust`：\n\n\
  ```\n#local   all             all                                     peer\nlocal\
  \    all             all                                     trust\n# IPv4 local\
  \ connections:\n#host    all             all             127.0.0.1/32          \
  \  ident\nhost     all             all             127.0.0.1/32            trust\n\
  # IPv6 local connections:\n#host    all             all             ::1/128    \
  \             ident\nhost     all             all             ::1/128          \
  \       trust\n```\n\n你可以在 [`stackoverflow.com/questions/2942485/psql-fatal-ident-authentication-failed-for-user-postgres`](http://stackoverflow.com/questions/2942485/psql-fatal-ident-authentication-failed-for-user-postgres)\
  \ 找到关于此更改的更多详细信息。退出 root 用户。\n\n#### 步骤 2-6-8. 测试我们的用户\n\n接下来，我们将测试我们能否以创建的用户轻松进入数据库：\n\
  \n```\n[pysparkbook@localhost binaries]$ psql -h localhost -U pysparkbookuser -d\
  \ pymetastore\n```\n\n以下是输出：\n\n```\npsql (9.2.18)\nType \"help\" for help.\npymetastore=>\n\
  ```\n\n#### 步骤 2-6-9. 修改我们的 `hive-site.xml`\n\n我们可以在配置文件 `hive-site.xml` 中修改与 Hive\
  \ 相关的配置。我们必须修改以下属性：\n\n*   `javax.jdo.option.ConnectionURL`：数据库的连接 URL\n*   `javax.jdo.option.ConnectionDriverName`：连接\
  \ JDBC 驱动名称\n*   `javax.jdo.option.ConnectionUserName`：数据库连接用户\n*   `javax.jdo.option.ConnectionPassword`：连接密码\n\
  \n你可以修改这些属性，或者在 Hive 属性文件的末尾添加以下内容以获得所需结果：\n\n```\njavax.jdo.option.ConnectionURL\n\
  jdbc:postgresql://localhost/pymetastore\npostgreSQL server metadata store\n\njavax.jdo.option.ConnectionDriverName\n\
  org.postgresql.Driver\nDriver class of postgreSQL\n\njavax.jdo.option.ConnectionUserName\n\
  pysparkbookuser\nUser name to connect to postgreSQL\n\njavax.jdo.option.ConnectionPassword\n\
  pbook\npassword for connecting to PostgreSQL server\n```\n\n#### 步骤 2-6-10. 启动 Hive\n\
  \n我们已经将 Hive 连接到一个外部关系数据库管理系统。所以现在是时候启动 Hive 并检查一切是否正常了。首先，启动 Hive：\n\n```\n[pysparkbook@localhost\
  \ binaries]$ hive\n```\n\n我们的操作将反映在 PostgreSQL 中。让我们在数据库中创建一个数据库和一个表。我们将通过以下命令创建数据库\
  \ `apress` 和表 `apressBooks`：\n\n```\nhive> create database apress;\n```\n\n以下是输出：\n\
