  \ 8080.\n17/03/02 03:34:10 INFO ui.MasterWebUI: Started MasterWebUI at http://10.0.2.15:8080\n\
  ```\n\n主节点日志文件中的日志表明，主节点已在 `spark://localhost.localdomain:7077` 上启动，并且主节点 Web UI\
  \ 在 `http://10.0.2.15:8080`。\n\n让我们打开主节点 Web UI，如图 4-8 所示。在这个 UI 中，我们可以看到独立主节点的\
