  stopping org.apache.spark.deploy.master.Master\n```\n\n我们可以看到 `stop-all.sh` 脚本首先停止从节点（工作节点），然后停止主节点。\n\
  \n#### 步骤 4-6-2. 使用单独脚本启动独立集群管理器\n\n\n\nPySpark 框架提供了一个独立的脚本来在不同机器上启动 master 和 worker。我们首先使用`start-master.sh`脚本启动\
  \ master：\n\n```\n[pysparkbook@localhost ∼]$ /allPySpark/spark/sbin/start-master.sh\n\
  ```\n\n输出如下：\n\n```\nstarting org.apache.spark.deploy.master.Master, logging to\
  \ /allPySpark/logSpark//spark-pysparkbook-org.apache.spark.deploy.master.Master-1-localhost.localdomain.out\n\
  ```\n\n和之前一样，我们需要从日志文件中获取 master URL。使用该 master URL，我们可以通过`start-slave.sh`脚本在不同机器上启动\
  \ slave：\n\n```\n[pysparkbook@localhost ∼]$ /allPySpark/spark/sbin/start-slave.sh\
  \ spark://localhost.localdomain:7077\n```\n\n输出如下：\n\n```\nstarting org.apache.spark.deploy.worker.Worker,\
