  ## PostgreSQL


  关系数据库管理系统在各类组织中仍然非常普遍。这里的“关系”是什么意思？它指的是表。PostgreSQL 是一个关系数据库管理系统。它几乎可以在所有主流操作系统上运行，包括
  Microsoft Windows、基于 Unix 的操作系统、macOS 等等。它是一个开源软件，其代码在 PostgreSQL 许可证下可用。因此，你可以自由使用并根据需求修改它。


  PostgreSQL 数据库可以通过其他编程语言（如 Java、Perl、Python、C 和 C++）以及各种编程接口进行连接。它还可以通过一种过程式编程语言
  PL/pgSQL（Procedural Language/PostgreSQL）进行编程，该语言类似于 PL/SQL。用户可以为此数据库添加自定义函数。我们可以用
  C/C++ 和其他编程语言编写自定义函数。我们可以通过使用 Java 数据库连接（JDBC）连接器，从 PySparkSQL 中读取 PostgreSQL 的数据。在接下来的章节中，我们将使用
  PySparkSQL 从 PostgreSQL 读取数据表。我们还将探索 PostgreSQL 的更多方面。


  PostgreSQL 遵循 ACID（原子性、一致性、隔离性和持久性）原则。它功能丰富，其中一些可能是 PostgreSQL 独有的。它支持可更新视图、事务完整性、复杂查询、触发器和其他特性。PostgreSQL
  通过使用多版本并发控制模型来进行并发管理。


  如果你在使用 PostgreSQL 时遇到问题，有一个庞大的社区可以提供支持。PostgreSQL 的设计和开发宗旨就是可扩展性。


  **注意**


  如果你想深入学习 PostgreSQL，以下链接会对你有所帮助：


  [`https://wiki.postgresql.org/wiki/Main_Page`](https://wiki.postgresql.org/wiki/Main_Page)


  [`https://en.wikipedia.org/wiki/PostgreSQL`](https://en.wikipedia.org/wiki/PostgreSQL)


  [`https://en.wikipedia.org/wiki/Multiversion_concurrency_control`](https://en.wikipedia.org/wiki/Multiversion_concurrency_control)


  [`http://postgresguide.com/`](http://postgresguide.com/)




  ## HBase


  HBase 是一个开源、分布式的 NoSQL 数据库。提到 NoSQL，你可能会认为它没有模式（schemaless）。在某种程度上，你是对的，但也不完全正确。因为在定义表时，你必须指定列族，所以它并非完全无模式。本节我们将创建一个
  HBase 表，以便你理解这种半无模式的属性。HBase 是一个面向列的数据库。你可能会好奇这意味着什么。让我解释一下：在面向列的数据库中，数据是按列保存的。


  我们将在下一章安装 HBase，但这里先展示如何创建表以及如何向表中插入数据。你可以在自己的系统上安装 HBase 后，尝试这些命令。在接下来的章节中，我们将使用
  PySpark 读取同一个数据表。


