- '# 8. PySparkSQL


  数据科学家处理的大部分数据要么是结构化的，要么是半结构化的。如今，非结构化数据的数量正在迅速增长。`PySparkSQL` 模块是建立在 PySpark Core
  之上的一个更高级的抽象，用于处理结构化和半结构化数据集。通过使用 `PySparkSQL`，我们也可以使用 SQL 和 HiveQL 代码，这使得该模块在数据库程序员和
  Apache Hive 用户中广受欢迎。`PySparkSQL` 提供的 API 是经过优化的。`PySparkSQL` 可以从多种文件类型中读取数据，例如 CSV
  文件、JSON 文件以及其他数据库的文件。


  `DataFrame` 这个抽象概念类似于关系数据库管理系统中的表。`DataFrame` 由命名的列组成，并且是一个 `Row` 对象的集合。`Row` 对象在
  `PySparkSQL` 中定义。用户对表格形式的模式很熟悉，因此操作 `DataFrames` 变得很容易。


  在 `PySparkSQL` 1.6 版本中，引入了一个新的 `Dataset` 接口。这个接口是 `DataFrame` 和 `RDD` 的混合体，因此它兼具两者的优点。不过，`Dataset`
  接口尚未在 Spark 的 Python 版本中实现。


  `GraphFrames` 库用于处理图。它类似于 `GraphX` 库，但 `GraphX` 不支持 Python。对于 PySpark 用户来说，`GraphFrames`
  库是最适合进行图处理的。它是在 `SparkSQL DataFrame` 之上开发的。我们可以通过 `GraphFrames` 来运行 `DataFrame`
  查询，这使得它与 `GraphX` 有所不同。


  你会发现本章充满了激动人心的主题，从 `PySparkSQL` 和 `DataFrames` 一直到图分析技巧。


  本章涵盖以下技巧：


  *   技巧 8-1. 创建一个 `DataFrame`

  *   技巧 8-2. 对 `DataFrames` 执行探索性数据分析

  *   技巧 8-3. 对 `DataFrames` 执行聚合操作

  *   技巧 8-4. 在 `DataFrames` 上执行 SQL 和 HiveQL 查询

  *   技巧 8-5. 在 `DataFrames` 上执行数据连接

  *   技巧 8-6. 使用 `GraphFrames` 计算广度优先搜索

  *   技巧 8-7. 使用 `GraphFrames` 计算 PageRank

  *   技巧 8-8. 从 Apache Hive 读取数据


  '
- "# 技巧 8-1. 创建一个 DataFrame\n\n### 问题\n\n你希望创建一个 `DataFrame`。\n\n### 解决方案\n\n如你所知，`DataFrame`\
  \ 是一个命名列的集合。你可能还记得第 5 章中的灯丝数据。你希望对灯丝数据执行以下操作：\n\n*   创建一个 `DataFrame`\n*   了解 `DataFrame`\
  \ 的模式\n*   打印 `DataFrame` 的内容\n*   筛选出 100W 灯泡的数据\n*   从 `DataFrame` 中选择寿命大于某个值的\
  \ 100W 灯泡数据\n\n### 工作原理\n\n#### 步骤 8-1-1. 创建灯丝数据的嵌套列表\n\n首先，我们必须创建一个灯丝数据的嵌套列表。你在第\
  \ 5 章中已经熟悉了这个数据。\n\n\n\n```python\n>>> filamentData = [['filamentA','100W',605],\n\
  ...  ['filamentB','100W',683],\n...  ['filamentB','100W',691],\n...  ['filamentB','200W',561],\n\
  ...  ['filamentA','200W',530],\n...  ['filamentA','100W',619],\n...  ['filamentB','100W',686],\n\
  ...  ['filamentB','200W',600],\n...  ['filamentB','100W',696],\n...  ['filamentA','200W',579],\n\
  ...  ['filamentA','200W',520],\n...  ['filamentA','100W',622],\n...  ['filamentA','100W',668],\n\
  ...  ['filamentB','200W',569],\n...  ['filamentB','200W',555],\n...  ['filamentA','200W',541]]\n\
  ```\n\n创建这个`filamentData`嵌套列表后，我们将为其创建一个 RDD。为了创建 RDD，我们将使用`parallelize()`函数：\n\n\
  ```python\n>>> filamentDataRDD = sc.parallelize(filamentData, 4)\n>>> filamentDataRDD.take(4)\n\
  ```\n\n输出如下：\n\n```python\n[['filamentA', '100W', 605],\n['filamentB', '100W', 683],\n\
  ['filamentB', '100W', 691],\n['filamentB', '200W', 561]]\n```\n\n`filamentDataRDD`这个\
  \ RDD 有四个分区。我们已成功创建了 RDD。下一步是为我们的 DataFrame 创建模式。\n\n#### 步骤 8-1-2. 创建 DataFrame\
  \ 的模式\n\n在我们的 DataFrame 中，有三个列。首先，我们要定义这些列。我们通过使用`StructField()`函数来定义列。PySparkSQL\
  \ 有自己的数据类型，所有这些类型都定义在子模块`pyspark.sql.types`中。我们必须从`pyspark.sql.types`导入所有内容：\n\n\
  ```python\n>>> from pyspark.sql.types import *\n```\n\n导入所需的子模块后，我们定义 DataFrame\
  \ 的第一个列：\n\n```python\n>>> FilamentTypeColumn = StructField(\"FilamentType\",StringType(),True)\n\
  ```\n\n让我们看一下`StructField()`的参数。第一个参数是列名。在这个例子中，列名是`FilamentType`。第二个参数是列中元素的数据类型。在这个例子中，第一个列的数据类型是`StringType()`。我们知道，某个列的某些元素可能为空。因此，最后一个参数（其值为`True`）表示此列可能包含空值或缺失数据。\n\
  \n```python\n>>> BulbPowerColumn = StructField(\"BulbPower\",StringType(),True)\n\
  >>> LifeInHoursColumn = StructField(\"LifeInHours\",StringType(),True)\n```\n\n\
  我们为每个列创建了一个`StructField`。现在，我们必须使用`StructType`对象来创建完整 DataFrame 的模式，如下所示：\n\n```python\n\
  >>> FilamentDataFrameSchema = StructType([FilamentTypeColumn, BulbPowerColumn, LifeInHoursColumn])\n\
  ```\n\n`FilamentDataFrameSchema`就是我们 DataFrame 的完整模式。\n\n```python\n>>> FilamentDataFrameSchema\n\
  ```\n\n输出如下：\n\n```\nStructType(\nList(StructField(FilamentType,StringType,true),\n\
  StructField(BulbPower,StringType,true),\nStructField(LifeInHours,StringType,true))\n\
  )\n```\n\n从上面的代码可以看出，我们可以通过`FilamentDataFrameSchema`变量观察到 DataFrame 三个列的模式。\n\n\
  我们知道，DataFrame 是`Row`对象的 RDD。因此，我们必须将`filamentDataRDD`这个 RDD 转换为`Row`对象的 RDD。在`Row`对象的\
  \ RDD 中，每一行都是一个`Row`对象。在下一个配方步骤中，我们将把 RDD 转换为`Row`对象的 RDD。\n\n#### 步骤 8-1-3. 创建\
  \ Row 对象的 RDD\n\nRDD 的`map()`函数最适合将任何 RDD 从一种结构转换为另一种结构，以便将我们的`filamentRDD2`这个 RDD\
  \ 转换为`Row`对象的 RDD。DataFrame 本质上就是`Row`对象的 RDD。让我们创建一个行的 RDD。但是，为了使用`Row`，我们必须首先导入它。`Row`位于`pyspark.sql`中。我们可以像这样导入`Row`：\n\
  \n```python\n>>> from pyspark.sql import Row\n>>> filamentRDDofROWs = filamentDataRDD.map(lambda\
  \ x :Row(str(x[0]), str(x[1]), str(x[2])))\n>>> filamentRDDofROWs.take(4)\n```\n\
  \n输出如下：\n\n```\n[Row('filamentA', '100W', '605'),\n Row('filamentB', '100W', '683'),\n\
  \ Row('filamentB', '100W', '691'),\n Row('filamentB', '200W', '561')]\n```\n\n可以看到，我们已经创建了一个行的\
  \ RDD：`filamentRDDofROWs`。我们对 RDD 应用了`take()`函数，并打印出了其中的四行元素。\n\n#### 步骤 8-1-4.\
  \ 创建 DataFrame\n\n我们已经创建了模式和行的 RDD。因此，我们可以创建 DataFrame 了。为了创建 DataFrame，我们需要`SQLContext`对象。让我们在下面一行代码中创建`SQLContext`对象：\n\
  \n```python\n>>> from pyspark.sql import SQLContext\n>>> sqlContext = SQLContext(sc)\n\
  ```\n\n我们创建了`sqlContext`对象。就像`SparkContext`（在我们的案例中，即在 PySpark 控制台中，`sc`是 PySpark\
  \ 的入口点，我曾提到`sc`是`SparkContext`的一个对象）一样，`SQLContext`是 PySparkSQL 的入口点。\n\n使用定义在`SQLContext`上的`createDataFrame()`函数，我们将创建我们的\
  \ DataFrame：`filamentDataFrameRaw`。我们向`createDataFrame()`函数提供两个参数：第一个是`Row`对象的 RDD\
  \ `filamentRDDofROWs`；第二个参数是我们 DataFrame 的模式`FilamentDataFrameSchema`。\n\n```python\n\
  >>> filamentDataFrameRaw = sqlContext.createDataFrame(filamentRDDofROWs, FilamentDataFrameSchema)\n\
  ```\n\n我们已经根据灯丝数据创建了 DataFrame。我们给这个 DataFrame 赋了引用名`filamentDataFrameRaw`。让我们在控制台上打印\
  \ DataFrame 的记录。之前，我们使用`take()`函数从 DataFrame 获取数据。但现在我们要改变获取数据的方式；我们将使用`show()`函数。`show()`函数能以一种美观的方式打印数据。我们可以向`show()`函数提供要显示的行数。在下面一行中，将获取四条记录：\n\
  \n```python\n>>> filamentDataFrameRaw.show(4)\n```\n\n输出如下，仅显示前四行：\n\n```\n+------------+---------+-----------+\n\
  |FilamentType|BulbPower|LifeInHours|\n+------------+---------+-----------+\n|  \
  \ filamentA|     100W|        605|\n|   filamentB|     100W|        683|\n|   filamentB|\
  \     100W|        691|\n|   filamentB|     200W|        561|\n+------------+---------+-----------+\n\
  ```\n\n#### 步骤 8-1-5. 打印 DataFrame 的模式\n\n我们已经创建了 DataFrame。让我们检查一下它的模式。我们可以通过使用\
  \ DataFrame 上定义的`printSchema()`函数来获取 DataFrame 的模式：\n\n```python\n>>> filamentDataFrameRaw.printSchema()\n\
  ```\n\n输出如下：\n\n```\nroot\n|-- FilamentType: string (nullable = true)\n|-- BulbPower:\
  \ string (nullable = true)\n|-- LifeInHours: string (nullable = true)\n```\n\n`printSchema()`函数的输出显示该\
  \ DataFrame 有三个列。这些列指示了列名、列的数据类型以及列是否可空（nullable）。如果你注意到`LifeInHours`列的数据类型是`string`，那你真是个细心的读者。以小时表示的时间最好用整数数据类型或浮点类型来表示。因此，我们必须更改第三列的数据类型。\n\
  \n我们可以通过使用`cast()`函数将列值从一种数据类型转换为另一种数据类型。\n\n#### 步骤 8-1-6. 更改列的数据类型\n\n`withColumn()`函数通过向\
  \ DataFrame 添加一个新列来返回一个新的 DataFrame。但如果该列已存在于 DataFrame 中，`withColumn()`函数将替换现有列：\n\
  \n```python\n>>> filamentDataFrame = filamentDataFrameRaw.withColumn('LifeInHours',filamentDataFrameRaw.LifeInHours.cast(FloatType()))\n\
  ```\n\n现在，检查模式将返回`float`作为`LifeInHours`列的数据类型：\n\n```python\n>>> filamentDataFrame.printSchema()\n\
  ```\n\n输出如下：\n\n```\nroot\n|-- FilamentType: string (nullable = true)\n|-- BulbPower:\
  \ string (nullable = true)\n|-- LifeInHours: float (nullable = true)\n```\n\n`LifeInHours`列的数据类型已从`string`类型转换为`float`类型。让我们通过获取一些行来检查\
  \ DataFrame。我们可以使用以下函数显示行：\n\n```python\n>>> filamentDataFrame.show(5)\n```\n\n\
  输出如下，仅显示前五行：\n\n\n\n``` \n+--------------+----------+------------+ \n|FilamentType\
  \  |BulbPower |LifeInHours | \n+--------------+----------+------------+ \n|   filamentA\
  \  |   100W   |   605.0    | \n|   filamentB  |   100W   |   683.0    | \n|   filamentB\
  \  |   100W   |   691.0    | \n|   filamentB  |   200W   |   561.0    | \n|   filamentA\
  \  |   200W   |   530.0    | \n+--------------+----------+------------+ \n``` \n\
  \n我们可以观察到，`LifeInHours` 列的数据类型已更改为浮点型。\n\n可以使用 DataFrame 对象的 `columns` 属性获取列名：\n\
  \n``` \n>>> filamentDataFrame.columns \n``` \n\n输出结果如下：\n\n``` \n['FilamentType',\
  \ 'BulbPower', 'LifeInHours'] \n``` \n\n#### 步骤 8-1-7. 筛选出 BulbPower 为 100W 的数据\n\
  \n根据特定逻辑筛选行可以通过使用 `filter()` 函数完成。该函数接受一个逻辑表达式，并返回一个包含筛选后数据的 DataFrame：\n\n``` \n\
  >>> filamentDataFrame100Watt = filamentDataFrame.filter(filamentDataFrame.BulbPower\
  \ == '100W') \n``` \n\n我们需要所有 `BulbPower` 等于 `100W` 的行。因此，我们将 `filamentDataFrame.BulbPower\
  \ == '100W'` 作为参数传递给 `filter()` 函数。让我们看看 `filamentDataFrame100Watt` DataFrame 中的内容：\n\
  \n``` \n>>> filamentDataFrame100Watt.show() \n``` \n\n输出结果如下：\n\n``` \n+--------------+------------+---------------+\
  \ \n|FilamentType  |BulbPower   |LifeInHours    | \n+----------------+-------------+---------------+\
  \ \n|   filamentA  |   100W     |   605.0    | \n|   filamentB  |   100W     | \
  \  683.0    | \n|   filamentB  |   100W     |   691.0    | \n|   filamentA  |  \
  \ 100W     |   619.0    | \n|   filamentB  |   100W     |   686.0    | \n|   filamentB\
  \  |   100W     |   696.0    | \n|   filamentA  |   100W     |   622.0    | \n|\
  \   filamentA  |   100W     |   668.0    | \n+----------------+-------------+---------------+\
  \ \n``` \n\n`filter()` 函数准确地完成了任务。\n\n#### 步骤 8-1-8. 从 DataFrame 中选择数据\n\n复合逻辑表达式也可以在\
  \ `filter()` 函数中使用。在此步骤中，我们将使用带有 `&` 运算符的复合逻辑表达式：\n\n``` \n>>> filamentData100WGreater650\
  \ = filamentDataFrame.filter((filamentDataFrame.BPower == '100W') & (filamentDataFrame.LifeInHours\
  \ > 650.0)) \n>>> filamentData100WGreater650.show() \n``` \n\n输出结果如下：\n\n``` \n\
  +--------------+-----------+------------+ \n|FilamentType  |BulbPower  |LifeInHours\
  \ | \n+--------------+-----------+------------+ \n|   filamentB  |   100W    | \
  \  683.0    | \n|   filamentB  |   100W    |   691.0    | \n|   filamentB  |   100W\
  \    |   686.0    | \n|   filamentB  |   100W    |   696.0    | \n|   filamentA\
  \  |   100W    |   668.0    | \n+--------------+-----------+------------+ \n```\
  \ \n\n最终，我们满足了要求。在下一个方法中，我们将对 DataFrame 进行探索性分析。\n\n"
- "# 方法 8-2. 对 DataFrame 执行探索性数据分析\n\n### 问题\n\n你希望对 DataFrame 执行探索性数据分析。\n\n### 解决方案\n\
  \n在探索性数据分析中，我们探索给定的数据。探索数据意味着统计记录数量，然后寻找有意义的模式。对于数值列的数据，我们计算数据的集中趋势和离散程度。数据的离散程度实际上就是数据的变异性。你可能知道，集中趋势的度量包括均值、中位数和众数。但变异性或数据离散程度是如何度量的呢？我们可以通过方差或标准差来度量它。\n\
  \n给定的数据集可能包含类别列。对于类别列，我们统计该变量每个值的频数。记录计数让我们了解拥有的数据点数量。我们根据给定的数值列计算最小和最大数据点。了解最小值和最大值可以展示数据的范围。\n\
  \nPySparkSQL 在 DataFrame 上定义了一个 `summary()` 函数。该函数将返回 DataFrame 中数值列记录数(`count`)、均值、标准差(`stdev`)、最小值(`min`)和最大值(`max`)。\n\
  \n你有一个文件 `filamentData.csv`。这次我们需要从 CSV 文件读取数据并创建一个 DataFrame。创建 DataFrame 后，我们需要对\
  \ DataFrame 的数值列进行汇总分析。除了数值列的汇总统计外，我们还需要了解每个类别字段中不同值的频数。\n\n你需要对灯丝数据的 DataFrame\
  \ 执行以下操作：\n\n- 从 CSV 文件 `filamentData.csv` 读取数据\n- 创建一个 DataFrame\n- 计算数值列的汇总统计量\n\
  - 统计 `FilamentType` 类别列中不同值的频数\n- 统计 `BulbPower` 类别列中不同值的频数\n\n### 工作原理\n\n首先，我们必须读取给定的文件并将数据转换为\
  \ DataFrame。在前面一个方法中，我们从嵌套列表开始，并执行了几个步骤来创建 DataFrame。在第 6 章中，我们发现从 CSV 文件获取嵌套列表需要多个步骤。如果能有一些更简便的方法就好了。\n\
  \nPySpark 包可以读取 CSV 文件并将数据直接转换为 DataFrame。我们应该感到高兴，因为有一个 PySpark 包可以帮助我们。该包名称是 `com.databricks.spark.csv`。这个包由\
  \ Databricks 开发。在 PySpark 2.x.x 之前，用户需要单独使用这个包。但在 PySpark 版本 2.x.x.x 中，该包已合并到 PySpark\
  \ 中，因此你不需要单独引入 JAR 包。感谢 Databricks 提供了这个漂亮且非常有用的包。\n\n#### 步骤 8-2-1. 定义 DataFrame\
  \ 模式\n\n这里我们将定义 DataFrame 的模式。在我们的模式中，有三个列。第一列是 `FilamentType`，数据类型为 `string`。第二列是\
  \ `BulbPower`，数据类型也为 `string`。最后一列是 `LifeInHours`，数据类型为 `double`。\n\n我们需要 PySparkSQL\
  \ 中定义的不同数据类型。我们可以在 `pyspark.sql.types` 子模块中找到所有数据类型：\n\n``` \n>>> from pyspark.sql.types\
  \ import * \n>>> FilamentTypeColumn = StructField(\"FilamentType\",StringType(),True)\
  \ \n>>> BulbPowerColumn = StructField(\"BulbPower\",StringType(),True) \n>>> LifeInHoursColumn\
  \ = StructField(\"LifeInHours\",DoubleType(),True) \n``` \n\n我们创建了三个 `StructFields`：\n\
  \n``` \n>>> FilamentDataFrameSchema = StructType([FilamentTypeColumn, BulbPowerColumn,\
  \ LifeInHoursColumn]) \n``` \n\n使用这些 `StructFields`，我们为 DataFrame 创建了一个模式。我们的 DataFrame\
  \ 模式的名称为 `FilamentDataFrameSchema`。\n\n#### 步骤 8-2-2. 读取 CSV 文件并创建 DataFrame\n\n\
  让我们创建一个 DataFrame。我们将使用 `spark.read.csv` 函数来读取文件数据并将其转换为 DataFrame：\n\n``` \n>>>\
  \ filamentDataFrame = spark.read.csv('file:///home/pysparkbook/pysparkBookData/filamentData.csv',header=True,\
  \ schema = FilamentDataFrameSchema, mode=\"DROPMALFORMED\") \n``` \n\n我们来讨论一下 `spark.read.csv`\
  \ 函数的参数。第一个参数是文件路径。第二个参数表示我们的文件有一个标题行。第三个参数提供了 DataFrame 的模式。`mode` 参数是什么？这第四个参数\
  \ `mode` 提供了一种在解析期间处理损坏记录的方法。`mode` 参数的值是 `DROPMALFORMED`。这个值表示丢弃所有损坏的数据。\n\n\n\n\
  我们已经读取了`filamentData.csv`数据文件，并且`spark.read.csv()`函数已经将 CSV 数据转换成了 DataFrame。现在让我们检查是否成功创建了\
  \ DataFrame。还记得 DataFrame 上哪些函数可以帮助你可视化数据吗？`show()`函数就能满足我们的需求。我们来获取 DataFrame 的前五行。`show()`函数会在控制台上以表格形式打印\
  \ DataFrame 的记录，这种格式更易于阅读和理解。让我们应用`show()`函数打印五条记录：\n\n```\n>>> filamentDataFrame.show(5)\n\
  ```\n\n输出显示前五行：\n\n```\n+------------+---------+-----------+\n|FilamentType|BulbPower|LifeInHours|\n\
  +------------+---------+-----------+\n|   filamentA|     100W|      605.0|\n|  \
  \ filamentB|     100W|      683.0|\n|   filamentB|     100W|      691.0|\n|   filamentB|\
  \     200W|      561.0|\n|   filamentA|     200W|      530.0|\n+------------+---------+-----------+\n\
  ```\n\n我们现在有了 DataFrame。接下来检查它的模式（schema）：\n\n```\n>>> filamentDataFrame.printSchema()\n\
  ```\n\n输出如下：\n\n```\nroot\n|-- FilamentType: string (nullable = true)\n|-- BulbPower:\
  \ string (nullable = true)\n|-- LifeInHours: double (nullable = true)\n```\n\n模式也是正确的。\n\
  \n> **注意**：要了解更多关于将 CSV 文件读入 Spark DataFrame 的信息，请阅读 Stack Overflow 上的讨论：[`stackoverflow.com/questions/29936156/get-csv-to-spark-dataframe`](https://stackoverflow.com/questions/29936156/get-csv-to-spark-dataframe)\n\
  \n#### 步骤 8-2-3. 计算汇总统计量\n\nDataFrame 上定义的`describe()`函数会给出以下结果：\n\n```\n>>> dataSummary\
  \ = filamentDataFrame.describe()\n>>> dataSummary.show()\n```\n\n输出如下：\n\n```\n\
  +---------+------------------------------+\n|summary  |       LifeInHours      \
  \      |\n+---------+------------------------------+\n|  count  |              \
  \  16            |\n|   mean  |          607.8125            |\n| stddev  | 61.11652122517009\
  \            |\n|    min  |             520.0            |\n|    max  |        \
  \     696.0            |\n+---------+------------------------------+\n```\n\n我们得到了结果：`count`、`mean`、`stddev`、`min`和`max`。接下来，我们需要找出两个分类列`FilamentType`和`BulbPower`及其组合的频率分布。\n\
  \n#### 步骤 8-2-4. 统计 FilamentType 分类列中不同值的频率\n\n统计频率最简单的方法是对记录使用`filter()`函数进行过滤，然后进行计数。我们逐步执行这些操作：\n\
  \n```\n>>> filamentDataFrame.filter(filamentDataFrame.FilamentType == 'filamentA').count()\n\
  ```\n\n输出为空（未显示具体数字）。\n\n在上述代码中，我们过滤出了所有`FilamentType`等于`filamentA`的记录。有 8 行包含`filamentA`。现在看看第一列中有多少行包含`filamentB`：\n\
  \n```\n>>> filamentDataFrame.filter(filamentDataFrame.FilamentType == 'filamentB').count()\n\
  ```\n\n输出为空（未显示具体数字）。\n\n我们已经过滤出了所有`FilamentType`等于`filamentB`的记录。对过滤后的数据应用`count()`函数会返回第一列中包含`filamentB`的总行数。有\
  \ 8 行在第一列中包含`filamentB`。\n\n#### 步骤 8-2-5. 统计 BulbPower 分类列中不同值的频率\n\n现在过滤`BulbPower`等于`100W`的数据。过滤出所需行后，进行计数：\n\
  \n```\n>>> filamentDataFrame.filter(filamentDataFrame.BulbPower == '100W').count()\n\
  ```\n\n输出为空（未显示具体数字）。\n\n有 8 行的`BulbPower`值为`100W`。同样地，我们可以统计其他值及其组合的频率。让我们计算 200W\
  \ 灯泡的频率：\n\n```\n>>> filamentDataFrame.filter(filamentDataFrame.BulbPower == '200W').count()\n\
  ```\n\n输出为空（未显示具体数字）。\n\n我们的`BulbPower`列中有 8 个 100W 灯泡和 8 个 200W 灯泡。\n\n#### 步骤\
  \ 8-2-6. 统计 FilamentType 和 BulbPower 列组合中不同值的频率\n\n在下面的代码中，我们将基于复合逻辑表达式进行计数：\n\n\
  ```\n>>> filamentDataFrame.filter((filamentDataFrame.FilamentType == 'filamentB')\
  \ & (filamentDataFrame.BulbPower == '100W')).count()\n```\n\n输出为空（未显示具体数字）。\n\n\
