  \ = WebDriverWait(driver, 10)\nwait.until(EC.presence_of_element_located((By.ID,\
  \ \"readability-script\")))\nreturned_result = driver.execute_script(get_article_cmd)\n\
  ```\n\n\n```python\n##### Do something with returned_result\ndriver.quit()\n```\n\
  \n注意，我们使用了两个“for”循环：一个用于提取我们要抓取的链接，并将它们存储在一个列表中；另一个用于遍历该列表。在这种情况下，使用一个循环是行不通的：因为当我们在循环内部导航到其他页面时，Selenium\
  \ 会在尝试使用 `find_elements_by_css_selector` 查找下一个链接时抱怨“元素失效”。这基本上是在说：“我正在为你查找下一个元素，但页面在这期间已经发生了变化，所以我无法再确定你想要获取什么内容。”\n\
  \n如果你尝试执行这个脚本，你会注意到它很快就会失败。这是怎么回事？要弄清楚出了什么问题，试着在浏览器中打开另一个链接，例如 [`https://www.washingtonpost.com/world/chinas-leader-elevated-to-the-level-of-mao-in-communist-pantheon/2017/10/24/ddd911e0-b832-11e7-9b93-b97043e57a22_story.html?utm_term=.720e06a5017d`](https://www.washingtonpost.com/world/chinas-leader-elevated-to-the-level-of-mao-in-communist-pantheon/2017/10/24/ddd911e0-b832-11e7-9b93-b97043e57a22_story.html?utm_term=.720e06a5017d)\
  \ （一个使用 HTTPS 的网站），然后在浏览器控制台中手动执行第一个 JavaScript 命令，也就是复制粘贴并执行：\n\n```javascript\n\
  (function(d, script) {\nscript = d.createElement('script');\nscript.type = 'text/javascript';\n\
  script.async = true;\nscript.onload = function() {\nscript.id = 'readability-script';\n\
  }\nscript.src = 'http://www.webscrapingfordatascience.com/readability/Readability.js';\n\
  d.getElementsByTagName('head')[0].appendChild(script);\n}(document));\n```\n\n你可能会得到类似下面的结果：\n\
  \n```\nGET https://www.webscrapingfordatascience.com/readability/Readability.js\
  \ net::ERR_CONNECTION_CLOSED\n```\n\n在其他页面上，你可能会得到：\n\n```\nMixed Content: 页面 [...]\
  \ 是通过 HTTPS 加载的，但请求了一个不安全的脚本 'http://www.webscrapingfordatascience.com/readability/Readability.js'。\n\
  此请求已被阻止；内容必须通过 HTTPS 提供。\n```\n\n这里的情况很明显：如果我们通过 HTTPS 加载一个网站，并尝试通过 HTTP 注入一个脚本，Chrome\
  \ 会因为认为该请求不安全（事实也确实如此）而阻止它。其他网站可能会采用其他方法来防止脚本注入，例如，使用 `Content-Security-Policy`\
  \ 头信息，这会导致如下错误：\n\n```\nRefused to load the script\n'http://www.webscrapingfordatascience.com/readability/Readability.js'\
  \  because it violates the following Content Security Policy directive:\n\"script-src\
  \ 'self' 'unsafe-eval' 'unsafe-inline'\".\n```\n\nChrome 有一些可用的扩展可以禁用此类检查，但我们将采用一种不同的方法，该方法适用于大多数页面，除了那些具有最严格内容安全策略的页面：我们将不再尝试注入一个\
  \ `<script>` 标签，而是直接获取我们 JavaScript 文件的内容，并使用 Selenium 直接执行它们。我们可以通过从本地文件加载内容来实现这一点，但由于我们已经将文件托管在线上，我们将使用\
  \ `requests` 来获取内容：\n\n```python\nfrom selenium import webdriver\nimport requests\n\
  base_url = 'https://news.google.com/news/?ned=us&hl=en'\nscript_url = 'http://www.webscrapingfordatascience.com/readability/Readability.js'\n\
  get_article_cmd = requests.get(script_url).text\nget_article_cmd += '''\nvar documentClone\
