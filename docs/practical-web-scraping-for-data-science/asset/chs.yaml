  \        html_soup = BeautifulSoup(json_fragment[2], 'html.parser')\n        div\
  \ = html_soup.find('div', class_=\"review\")\n        if not div:\n            continue\n\
  \        review_id = div.get('id')\n        review_cls = ' '.join(html_soup.find(class_='review-rating').get('class'))\n\
  \        rating = re.search('a-star-(\\d+)', review_cls).group(1)\n        title\
  \ = html_soup.find(class_='review-title').get_text(strip=True)\n        review =\
  \ html_soup.find(class_='review-text').get_text(strip=True)\n        reviews.append({'review_id':\
  \ review_id,\n                        'rating': rating,\n                      \
  \  'title': title,\n                        'review': review})\n    return reviews\n\
  \n\ndef get_reviews(product_id, page):\n    data = {\n        'sortBy': '',\n  \
  \      'reviewerType': 'all_reviews',\n        'formatType': '',\n        'mediaType':\
  \ '',\n        'filterByStar': 'all_stars',\n        'pageNumber': page,\n     \
  \   'filterByKeyword': '',\n        'shouldAppend': 'undefined',\n        'deviceType':\
  \ 'desktop',\n        'reftag': 'cm_cr_getr_d_paging_btm_{}'.format(page),\n   \
