  \ = html_soup.find('div', class_=\"review\")\n        if not div:\n            continue\n\
  \        review_id = div.get('id')\n        title = html_soup.find(class_='review-title').get_text(strip=True)\n\
  \        review = html_soup.find(class_='review-text').get_text(strip=True)\n\n\
