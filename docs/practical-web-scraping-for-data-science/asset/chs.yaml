  \ 提取文章信息\n\n```\nThe script was successfully injected!\n```\n\n现在，`<script>` 标签已注入并执行，我们需要弄清楚如何使用它。Mozilla\
  \ 在 `https://github.com/mozilla/readability` 的文档为我们提供了一些说明，基于这些说明，我们可以尝试执行以下代码（仍在控制台窗口中）：\n\
