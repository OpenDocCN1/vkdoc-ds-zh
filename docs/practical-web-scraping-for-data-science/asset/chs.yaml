  \n美国国会图书馆控制号：2018940455\n\n© Seppe vanden Broucke 和 Bart Baesens，2018  \n本作品受版权保护。出版商保留所有权利，无论是全部还是部分材料，特别是翻译、重印、重用插图、朗诵、广播、微缩胶片或任何其他物理形式的复制，以及电子改编、计算机软件或现在已知或以后开发的类似或不相似方法的传输、信息存储与检索。\n\
