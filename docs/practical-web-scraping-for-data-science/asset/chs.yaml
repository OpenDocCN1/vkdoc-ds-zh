  \ \"//\" + loc.host +\nloc.pathname.substr(0, loc.pathname.lastIndexOf(\"/\") +\
  \ 1)\n};\nvar article = new Readability(uri, documentClone).parse();\nreturn JSON.stringify(article);\n\
  '''\ndriver = webdriver.Chrome()\ndriver.implicitly_wait(10)\ndriver.get(base_url)\n\
  news_urls = []\nfor link in driver.find_elements_by_css_selector('main a[role=\"\
  heading\"]'):\nnews_url = link.get_attribute('href')\nnews_urls.append(news_url)\n\
  for news_url in news_urls:\nprint('Now scraping:', news_url)\ndriver.get(news_url)\n\
  print('Injecting script')\nreturned_result = driver.execute_script(get_article_cmd)\n\
  \n##### 对 returned_result 做一些处理\ndriver.quit()\n```\n\n这种方法还有一个好处，即我们可以一次性执行整个 JavaScript\
  \ 命令，而不再需要依赖显式等待来检查脚本是否加载完成。剩下的唯一工作就是将获取的结果转换为 Python 字典，并使用“dataset”库将结果存储到数据库中：\n\
  \n```python\nfrom selenium import webdriver\nimport requests\nimport dataset\nfrom\
  \ json import loads\ndb = dataset.connect('sqlite:///news.db')\nbase_url = 'https://news.google.com/news/?ned=us&hl=en'\n\
  script_url = 'http://www.webscrapingfordatascience.com/readability/Readability.js'\n\
  get_article_cmd = requests.get(script_url).text\nget_article_cmd += '''\nvar documentClone\
  \ = document.cloneNode(true);\nvar loc = document.location;\nvar uri = {\nspec:\
  \ loc.href,\nhost: loc.host,\nprePath: loc.protocol + \"//\" + loc.host,\nscheme:\
  \ loc.protocol.substr(0, loc.protocol.indexOf(\":\")),\npathBase: loc.protocol +\
  \ \"//\" + loc.host +\nloc.pathname.substr(0, loc.pathname.lastIndexOf(\"/\") +\
  \ 1)\n};\nvar article = new Readability(uri, documentClone).parse();\nreturn JSON.stringify(article);\n\
  '''\ndriver = webdriver.Chrome()\ndriver.implicitly_wait(10)\ndriver.get(base_url)\n\
  news_urls = []\nfor link in driver.find_elements_by_css_selector('main a[role=\"\
  heading\"]'):\nnews_url = link.get_attribute('href')\nnews_urls.append(news_url)\n\
  for news_url in news_urls:\nprint('Now scraping:', news_url)\ndriver.get(news_url)\n\
  print('Injecting script')\nreturned_result = driver.execute_script(get_article_cmd)\n\
  \n##### 将 JSON 字符串转换为 Python 字典\narticle = loads(returned_result)\nif not article:\n\
  ##### 未能提取文章，直接继续\ncontinue\n\n##### 添加 URL\narticle['url'] = news_url\n\n#####\
  \ 删除 'uri'，因为它本身是一个字典\ndel article['uri']\n```\n\n\n##### 添加到数据库\n\n`db['articles'].upsert(article,\
  \ ['url'])`\n`print('Title was:', article['title'])`\n`driver.quit()`\n\n输出结果如下：\n\
  \n![A463931_1_En_9_Fig13_HTML.jpg](img/A463931_1_En_9_Fig13_HTML.jpg)\n\n**图 9-13**\
  \ 使用 DB Browser for SQLite 浏览已抓取的文章\n\n```\nNow scraping: https://www.usnews.com/news/world/articles/2017-10-24/\n\
  china-southeast-asia-aim-to-build-trust-with-sea-drills-singapore-says Injecting\
  \ script\nTitle was: China, Southeast Asia Aim to Build Trust With Sea Drills, \
  \     Singapore Says | World News\nNow scraping: http://www.philstar.com/headlines/2017/10/24/\n\
  1751999/pentagon-chief-seeks-continued-maritime-cooperation-asean Injecting script\n\
  Title was: Pentagon chief seeks continued maritime cooperation with ASEAN | Headlines\
  \ News, The Philippine Star,\n[...]\n```\n\n请务必使用 `DB Browser for SQLite` 等 SQLite\
  \ 客户端查看数据库 (`news.db`)；见图 9-13。\n\n现在我们能用 Python 分析收集到的文章了。我们将使用潜在狄利克雷分配（LDA）构建一个主题模型，帮助我们按主题对文章进行分类。为此，我们将使用\
  \ `nltk`、`stop-words` 和 `gensim` 库，这些库只需通过 `pip` 即可安装：\n\n```\npip install -U nltk\n\
  pip install -U stop-words\npip install -U gensim\n```\n\n首先，我们将遍历所有文章，使用一个简单的正则表达式对它们进行分词（将文本转换为单词元素列表），去除停用词，并应用词干提取：\n\
  \n```\nimport dataset\nfrom nltk.tokenize import RegexpTokenizer\nfrom nltk.stem.porter\
  \ import PorterStemmer\nfrom stop_words import get_stop_words\ndb = dataset.connect('sqlite:///news.db')\n\
  articles = []\ntokenizer = RegexpTokenizer(r'\\w+')\nstop_words = get_stop_words('en')\n\
  p_stemmer = PorterStemmer()\nfor article in db['articles'].all():\n    text = article['title'].lower().strip()\n\
  \    text += \" \" + article['textContent'].lower().strip()\n    if not text:\n\
  \        continue\n\n    # 分词\n    tokens = tokenizer.tokenize(text)\n\n    # 移除停用词和小词\n\
  \    clean_tokens = [i for i in tokens if not i in stop_words]\n    clean_tokens\
  \ = [i for i in clean_tokens if len(i) > 2]\n\n    # 词干提取\n    stemmed_tokens =\
  \ [p_stemmer.stem(i) for i in clean_tokens]\n\n    # 添加到列表\n    articles.append((article['title'],\
  \ stemmed_tokens))\nprint(articles[0])\n```\n\n我们的第一篇文章现在看起来像这样（我们保留标题以便后续报告）：\n\
  \n```\n('Paul Manafort, former business partner to surrender in Mueller investigation',\
  \ ['presid', 'trump', 'former', 'campaign', 'chairman', [...]]\n```\n\n要生成一个 LDA\
  \ 模型，我们需要计算每个词条在每篇文档中出现的频率。为此，我们可以用 `gensim` 构建一个文档-词条矩阵：\n\n```\nfrom gensim import\
  \ corpora\ndictionary = corpora.Dictionary([a[1] for a in articles])\ncorpus = [dictionary.doc2bow(a[1])\
  \ for a in articles]\nprint(corpus[0])\n```\n\n`Dictionary` 类遍历文本，为每个独特的词条分配一个唯一的整数\
  \ ID，同时收集词频和相关统计信息。接下来，我们的字典被转换成一个词袋语料库，该语料库生成一个向量列表，其数量等于文档数量。每个文档向量都由一系列 `(id,\
  \ count)` 元组构成：\n\n```\n[(0, 10), (1, 17), (2, 7), (3, 11), [...]]\n```\n\n现在我们准备构建一个\
  \ LDA 模型：\n\n```\nfrom gensim.models.ldamodel import LdaModel\nnr_topics = 30\n\
  ldamodel = LdaModel(corpus, num_topics=nr_topics,\n                    id2word=dictionary,\
  \ passes=20)\nprint(ldamodel.print_topics())\n```\n\n这将输出类似如下的结果：\n\n```\n[(0, '0.027*\"\
  s\" + 0.018*\"trump\" + 0.018*\"manafort\" + 0.011*\"investig\"    + 0.008*\"presid\"\
  \ + 0.008*\"report\" + 0.007*\"mueller\" + 0.007*\"year\"  + 0.007*\"campaign\"\
  \ + 0.006*\"said\"'),\n(1, '0.014*\"s\" + 0.014*\"said\" + 0.013*\"percent\" + 0.008*\"\
  1\" +           0.007*\"0\" + 0.006*\"year\" + 0.006*\"month\" + 0.005*\"increas\"\
