  ```\n\n### 从 SQL 到 ORM\n\n我们在这里手动编写 SQL（结构化查询语言）语句来与数据库交互，这在小型项目中是可行的。但对于更复杂的项目，研究一些\
  \ Python 可用的 ORM（对象关系映射）库是值得的，例如`SQLAlchemy`或`Pee-wee`，它们可以在关系数据库和 Python 对象之间实现更流畅、更可控的“映射”，这样你就可以直接操作对象，而无需处理\
  \ SQL 语句。在示例章节中，我们将使用另一个名为“dataset”的库，它也提供了一种便捷的方式，无需编写 SQL 即可快速将信息转储到数据库。另外请注意，在\
  \ Python 中使用 SQLite 数据库并非一定要用“records”库。Python 自带了内置的`sqlite3`模块（该模块被`records`所使用），你也可以直接使用它（参见[`docs.python.org/3/library/sqlite3.html`](https://docs.python.org/3/library/sqlite3.html)）。我们在这里使用`records`的原因是，它涉及的样板代码更少一些。\n\
