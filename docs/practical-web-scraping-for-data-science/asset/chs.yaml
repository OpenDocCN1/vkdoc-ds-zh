  \ Google 新闻页面抓取每篇文章的标签，这些标签在其页面上也作为`主题`列出。\n\n### 9.13 抓取并分析维基百科图\n\n在本示例中，我们将再次处理维基百科（我们已在关于网络爬虫的章节中使用过维基百科）。我们的目标是抓取维基百科页面的标题，同时跟踪它们之间的链接，我们将利用这些链接来构建一个图，并使用\
  \ Python 进行分析。我们将再次使用 `dataset` 库作为存储结果的简便方法。以下代码包含了完整的爬虫设置：\n\n\n```python\nimport\
  \ requests\nimport dataset\nfrom bs4 import BeautifulSoup\nfrom urllib.parse import\
  \ urljoin, urldefrag\nfrom joblib import Parallel, delayed\ndb = dataset.connect('sqlite:///wikipedia.db')\n\
  base_url = 'https://en.wikipedia.org/wiki/'\ndef store_page(url, title):\n    print('已访问页面:',\
  \ url)\n    print(' 标题:', title)\n    db['pages'].upsert({'url': url, 'title': title},\
  \ ['url'])\ndef store_links(from_url, links):\n    db.begin()\n    for to_url in\
  \ links:\n        db['links'].upsert({'from_url': from_url, 'to_url': to_url},\n\
  \                           ['from_url', 'to_url'])\n    db.commit()\ndef get_random_unvisited_pages(amount=10):\n\
  \    result = db.query('''SELECT * FROM links\n                         WHERE to_url\
  \ NOT IN (SELECT url FROM pages)\n                         ORDER BY RANDOM() LIMIT\
  \ {}'''.format(amount))\n    return [r['to_url'] for r in result]\ndef should_visit(base_url,\
  \ url):\n    if url is None:\n        return None\n    full_url = urljoin(base_url,\
  \ url)\n    full_url = urldefrag(full_url)[0]\n    if not full_url.startswith(base_url):\n\
  \        # 这是一个外部链接\n        return None\n    ignore = ['Wikipedia:', 'Template:',\
  \ 'File:', 'Talk:', 'Special:',\n              'Template talk:', 'Portal:', 'Help:',\
  \ 'Category:', 'index.php']\n    if any([i in full_url for i in ignore]):\n    \
  \    return None\n```\n\n\n#### 这是一个需要忽略的页面\n\n`return None`\n`return full_url`\n\
  \n`def get_title_and_links(base_url, url):`\n```\nhtml = requests.get(url).text\n\
  html_soup = BeautifulSoup(html, 'html.parser')\npage_title = html_soup.find(id='firstHeading')\n\
  page_title = page_title.text if page_title else ''\nlinks = []\nfor link in html_soup.find_all(\"\
  a\"):\n    link_url = should_visit(base_url, link.get('href'))\n    if link_url:\n\
  \        links.append(link_url)\nreturn url, page_title, links\n```\n\n```\nif __name__\
  \ == '__main__':\n    urls_to_visit = [base_url]\n    while urls_to_visit:\n   \
  \     scraped_results = Parallel(n_jobs=5, backend=\"threading\")(\n           \
  \ delayed(get_title_and_links)(base_url, url) for url in urls_to_visit\n       \
  \ )\n        for url, page_title, links in scraped_results:\n            store_page(url,\
  \ page_title)\n            store_links(url, links)\n        urls_to_visit = get_random_unvisited_pages()\n\
  ```\n\n这里有很多值得额外解释的地方：\n\n*   数据库的结构如下：表 `\"pages\"` 保存了已访问的 URL 及其页面标题。方法 `store_page`\
  \ 用于在此表中存储条目。另一个表 `\"links\"` 仅包含 URL 对，用于表示页面之间的链接。方法 `store_link` 用于更新这些信息，并且两个方法都使用了\
  \ `\"dataset\"` 库。对于后者，我们在单个显式数据库事务中执行多次更新插入（upsert）操作以加快速度。\n\n*   方法 `get_random_unvisited_pages`\
  \ 现在返回一个未访问 URL 列表，而不仅仅是单个 URL，它通过从尚未出现在 `\"pages\"` 表（因此尚未被访问）中的被链接 URL 里随机选择列表来实现。\n\
  \n*   `should_visit` 方法用于确定一个链接是否应被考虑用于爬取。如果该链接应被包含，则返回一个格式正确的 URL，否则返回 `None`。\n\
  \n*   `get_title_and_links` 方法执行实际的页面抓取，获取其标题和 URL 列表。\n\n*   脚本本身循环执行，直到没有更多未访问的页面（基本上会永远运行，因为会不断发现新页面）。它会拉取一个我们尚未访问的随机页面列表，获取其标题和链接，并将这些信息存储在数据库中。\n\
  \n*   请注意，我们在这里使用 `\"joblib\"` 库来建立并行方法。如果简单地将 URL 逐一访问，那会太慢了，因此我们使用 joblib 建立一种多线程方法来同时访问链接，从而有效地产生多个网络请求。重要的是不要过度负担我们自己的连接或维基百科，所以我们将\
  \ `n_jobs` 参数限制为五个。这里使用 `back-end` 参数表示我们希望使用多个线程而不是多个进程来建立并行计算。这两种方法在 Python 中各有优劣。多进程方法的设置开销稍大，但由于\
  \ Python 的内部线程系统可能会因为“全局解释器锁”（GIL）而变得有些繁琐，因此多进程方法可能更快（关于 GIL 的完整讨论超出了本文范围，但如果你是第一次听说，可以随时在网上查找更多信息）。在我们的案例中，工作本身相对简单：执行一个网络请求并执行一些解析，因此多线程方法是可以的。\n\
  \n*   这也是我们不在 `get_title_and_links` 方法内部直接将结果存储到数据库，而是等待并行任务执行完毕并返回结果的原因。SQLite\
  \ 不喜欢同时从多个线程或多个进程写入数据，因此我们等到收集到结果后再将其写入数据库。另一种方案是使用客户端-服务器数据库系统。请注意，我们应该避免用大量的结果过度重载数据库。不仅中间结果必须存储在内存中，而且在写入大量结果时也会产生等待时间。由于\
  \ `get_random_unvisited_pages` 方法最多返回十个 URL 的列表，在我们的案例中对此不必过于担心。\n\n*   最后，请注意脚本的主入口点现在被放置在\
  \ `if __name__ == '__main__':` 之下。在其他示例中，为了简单起见我们没有这样做，尽管这样做是良好的实践。原因如下：当 Python\
  \ 脚本导入另一个模块时，该模块中包含的所有代码会立即执行。例如，如果我们想在另一个脚本中重用 `should_visit` 方法，我们可以使用 `\"import\
  \ myscript\"` 或 `\"from myscript import should_visit\"` 导入原始脚本。在这两种情况下，`\"myscript.py\"\
  ` 中的完整代码都将被执行。如果此脚本包含一个代码块，比如我们本例中的 `\"while\"` 循环，那么在导入脚本时就会开始执行该代码块，这不是我们想要的；我们只想加载函数定义。因此，我们希望向\
  \ Python 指出“仅当脚本被直接执行时才执行此代码块”，这正是 `if __name__ == '__main__':` 检查的作用。如果我们从命令行启动脚本，特殊的\
  \ `__name__` 变量将被设置为 `__main__`。如果我们的脚本是从另一个模块导入的，`__name__` 将被设置为该模块的名称。当我们像这里一样使用\
  \ joblib 时，脚本的内容将被发送给所有“工作进程”（线程或进程），以便它们执行正确的导入并加载正确的函数定义。例如在我们的案例中，不同的工作进程需要知道\
  \ `get_title_and_links` 方法。然而，由于工作进程也会执行脚本中包含的完整代码（就像导入一样），我们还需要阻止它们运行主代码块，这就是我们需要提供\
  \ `if __name__ == '__main__':` 检查的原因。\n\n你可以让爬虫运行任意长时间，但请注意它极不可能完成，而且一个较小的图在下一步中也更容易查看。一旦它运行了一段时间，直接中断即可停止。由于我们使用了\
  \ `\"upsert\"`，可以随时稍后恢复运行（它只会从上次停止的地方继续爬取）。\n\n现在，我们可以使用抓取的结果进行一些有趣的图形分析。在 Python\
  \ 中，有两个流行的库可以用来做这件事，即 NetworkX（pip 中的 `\"networkx\"` 库）和 iGraph（pip 中的 `\"python-igraph\"\
  `）。我们将在这里使用 NetworkX 以及 `\"matplotlib\"` 来可视化图形。\n\n#### 图形可视化是困难的\n\n正如 NetworkX\
  \ 文档本身所述，适当的图形可视化是困难的，并且库作者建议人们使用专门用于此任务的工具来可视化图形。对于我们简单的用例，内置方法就足够了，尽管我们需要与 matplotlib\
  \ 周旋一番才能使效果更具吸引力。如果你对图形可视化感兴趣，可以看看诸如 Cytoscape、Gephi 和 Graphviz 之类的程序。在下一个示例中，我们将使用\
  \ Gephi 来处理可视化工作。\n\n以下代码用于可视化图形。我们首先构建一个新的 NetworkX 图形对象，并将页面作为已访问节点添加进去。接下来，我们添加边，但仅限于已访问的页面之间。作为额外步骤，我们还删除完全未连接的节点（尽管在此阶段它们应该不存在）。然后，我们计算一个称为介数（betweenness）的中心性度量，作为节点重要性的衡量指标。该指标的计算基于所有节点到其他所有节点的最短路径中，穿过我们正在计算指标的那个节点的数量。一个节点位于两个其他节点之间最短路径上的次数越多，根据此指标它就越重要。我们将根据此指标为节点着色，赋予它们不同的蓝色阴影。我们对介数度量应用一个快速而粗糙的\
  \ Sigmoid 函数，以将值“压缩”到一个能产生更具吸引力可视化的范围内。我们还手动为节点添加标签，以便它们显示在实际节点上方。这将产生如图 9-14 所示的结果。\n\
  \n![A463931_1_En_9_Fig14_HTML.jpg](img/A463931_1_En_9_Fig14_HTML.jpg)\n\n**图 9-14**\
  \ 可视化我们抓取的图形\n\n#### 忽略警告\n\n在运行可视化代码时，你很可能会看到来自 matplotlib 的警告，抱怨 NetworkX 使用了已弃用的函数。这没关系，可以安全地忽略，尽管未来版本的\
  \ matplotlib 可能无法再与 NetworkX 良好兼容。目前尚不清楚 NetworkX 的作者未来是否会继续专注于可视化。正如你会注意到的那样，可视化中边的“箭头”看起来也不太美观。这是\
  \ NetworkX 的一个长期存在的问题。再次强调：NetworkX 适用于分析和图形处理，但不太适合可视化。如果可视化是你的核心关注点，请了解一下其他库。\n\
  \n```\nimport networkx\nimport matplotlib.pyplot as plt\nimport dataset\ndb = dataset.connect('sqlite:///wikipedia.db')\n\
  G = networkx.DiGraph()\nprint('正在构建图形...')\nfor page in db['pages'].all():\n   \
  \ G.add_node(page['url'], title=page['title'])\nfor link in db['links'].all():\n\
  ```\n\n\n\n##### 仅当端点均已被访问时才执行 `addedge`\n```python\nif G.has_node(link['from_url'])\
  \ and G.has_node(link['to_url']):\n    G.add_edge(link['from_url'], link['to_url'])\n\
  ```\n\n##### 移除孤立节点以精简图形\n```python\nG.remove_nodes_from(networkx.isolates(G))\n\
  ```\n\n##### 计算节点介数中心性作为重要性度量\n```python\nprint('正在计算介数...')\nbetweenness = networkx.betweenness_centrality(G,\
  \ endpoints=False)\nprint('正在绘制图形...')\n```\n\n##### 使用 Sigmoid 函数使颜色（稍微）更美观\n```python\n\
  squash = lambda x : 1 / (1 + 0.5**(20*(x-0.1)))\ncolors = [(0, 0, squash(betweenness[n]))\
  \ for n in G.nodes()]\nlabels = dict((n, d['title']) for n, d in G.nodes(data=True))\n\
  positions = networkx.spring_layout(G)\nnetworkx.draw(G, positions, node_color=colors,\
  \ edge_color='#AEAEAE')\n```\n\n##### 手动绘制标签使其显示在节点上方\n```python\nfor k, v in positions.items():\n\
  \    plt.text(v[0], v[1]+0.025, s=labels[k],\n             horizontalalignment='center',\
  \ size=8)\nplt.show()\n```\n\n### 9.14 抓取与可视化董事会成员关系图\n\n本示例中，我们的目标是构建一个标普 500 企业的社交关系图，展示它们通过董事会成员形成的相互关联性。我们将从路透社的标普\
  \ 500 页面（[`https://www.reuters.com/finance/markets/index/.SPX`](https://www.reuters.com/finance/markets/index/.SPX)）入手，获取股票代码列表：\n\
  \n```python\nfrom bs4 import BeautifulSoup\nimport requests\nimport re\n\nsession\
  \ = requests.Session()\nsp500 = 'https://www.reuters.com/finance/markets/index/.SPX'\n\
  page = 1\nregex = re.compile(r'\\/finance\\/stocks\\/overview\\/.*')\nsymbols =\
  \ []\n\nwhile True:\n    print('正在抓取页面：', page)\n    params = {'sortBy': '', 'sortDir':\
  \ '', 'pn': page}\n    html = session.get(sp500, params=params).text\n    soup =\
  \ BeautifulSoup(html, \"html.parser\")\n    pagenav = soup.find(class_='pageNavigation')\n\
  \    if not pagenav:\n        break\n    companies = pagenav.find_next('table',\
  \ class_=\"dataTable\")\n    for link in companies.find_all('a', href=regex):\n\
  \        symbols.append(link.get('href').split('/')[-1])\n    page += 1\n\nprint(symbols)\n\
  ```\n\n获取股票代码列表后，我们可以抓取每个公司的董事会成员页面（例如：[`https://www.reuters.com/finance/stocks/company-officers/MMM.N`](https://www.reuters.com/finance/stocks/company-officers/MMM.N)），提取董事会成员表格，并将其存储为\
  \ pandas 数据框，最后使用 pandas 的 `to_pickle` 方法保存。如果尚未安装 pandas，请先安装：\n\n```bash\npip\
  \ install -U pandas\n```\n\n将以下代码添加至脚本末尾：\n\n```python\nimport pandas as pd\n\n\
  officers = 'https://www.reuters.com/finance/stocks/company-officers/{symbol}'\n\
  dfs = []\n\nfor symbol in symbols:\n    print('正在抓取代码：', symbol)\n    html = session.get(officers.format(symbol=symbol)).text\n\
  \    soup = BeautifulSoup(html, \"html.parser\")\n    officer_table = soup.find('table',\
  \ {\"class\": \"dataTable\"})\n    df = pd.read_html(str(officer_table), header=0)[0]\n\
  \    df.insert(0, 'symbol', symbol)\n    dfs.append(df)\n```\n\n\n\n#### 存储结果\n\
  ```\ndf = pd.concat(dfs)\ndf.to_pickle('sp500.pkl')\n```\n\n这类信息可以催生许多有趣的用例，尤其是在图分析和社交网络分析领域。我们将再次使用\
  \ `NetworkX`，但只需解析收集到的信息，并将图导出为 `Gephi` 可读取的格式。`Gephi` 是一款流行的图可视化工具，可从 [`https://gephi.org/users/download/`](https://gephi.org/users/download/)\
  \ 下载：\n\n```\nimport pandas as pd\nimport networkx as nx\nfrom networkx.readwrite.gexf\
  \ import write_gexf\ndf = pd.read_pickle('sp500.pkl')\nG = nx.Graph()\nfor row in\
  \ df.itertuples():\n    G.add_node(row.symbol, type='company')\n    G.add_node(row.Name,\
  \ type='officer')\n    G.add_edge(row.symbol, row.Name)\nwrite_gexf(G, 'graph.gexf')\n\
  ```\n\n在 `Gephi` 中打开该图文件，并应用 “ForceAtlas 2” 布局技术执行几次迭代。我们还可以显示标签，最终得到如图 9-15 所示的图形。\n\
  \n如果你愿意，可以花些时间探索 `Gephi` 的可视化和过滤选项。你在 `NetworkX` 中设置的所有属性（本例中的 “type”）也将在 `Gephi`\
  \ 中可用。图 9-16 显示了针对谷歌、亚马逊和苹果及其董事会成员的过滤图，这些成员充当着与其他公司的连接点。\n\n![A463931_1_En_9_Fig16_HTML.jpg](img/A463931_1_En_9_Fig16_HTML.jpg)\n\
  \n图 9-16\n展示谷歌、亚马逊和苹果的相关董事会成员\n\n![A463931_1_En_9_Fig15_HTML.jpg](img/A463931_1_En_9_Fig15_HTML.jpg)\n\
  \n图 9-15\n使用 `Gephi` 可视化爬取到的图\n\n### 9.15 利用深度学习破解验证码\n\n这最后一个例子无疑是最具挑战性的，同时它也与“数据科学”更相关，而非网络爬取。实际上，我们在这里不会使用任何网络爬取工具。相反，我们将通过一个相对独立的示例，说明如何将预测模型集成到网络爬取流程中，以绕过验证码检查。\n\
  \n我们首先需要安装一些工具。我们将使用 `OpenCV`（一个非常全面的计算机视觉库）以及 `numpy`（用于基本数据处理）。最后，我们将使用 `captcha`\
  \ 库来生成示例图像。所有这些都可以通过以下命令安装：\n\n```\npip install -U opencv-python\npip install -U\
  \ numpy\npip install -U captcha\n```\n\n接下来，在你的系统中创建一个目录，用于存放我们将要创建的 Python 脚本。第一个脚本（`constants.py`）将包含一些常量：\n\
  \n```\nCAPTCHA_FOLDER = 'generated_images'\nLETTERS_FOLDER = 'letters'\nCHARACTERS\
  \ = list('QWERTPASDFGHKLZXBNM')\nNR_CAPTCHAS = 1000\nNR_CHARACTERS = 4\nMODEL_FILE\
  \ = 'model.hdf5'\nLABELS_FILE = 'labels.dat'\nMODEL_SHAPE = (100, 100)\n```\n\n\
  另一个脚本（`generate.py`）将生成一批验证码图像，并保存到 `generated_images` 目录中：\n\n```\nfrom random\
  \ import choice\nfrom captcha.image import ImageCaptcha\nimport os.path\nfrom os\
  \ import makedirs\nfrom constants import *\nmakedirs(CAPTCHA_FOLDER)\nimage = ImageCaptcha()\n\
  for i in range(NR_CAPTCHAS):\n    captcha = ''.join([choice(CHARACTERS) for c in\
  \ range(NR_CHARACTERS)])\n    filename = os.path.join(CAPTCHA_FOLDER, '{}_{}.png'.format(captcha,\
  \ i))\n    image.write(captcha, filename)\n    print('Generated:', captcha)\n```\n\
  \n运行此脚本后，你应该会得到一批验证码图像（正确答案包含在文件名中），如图 9-17 所示。\n\n![A463931_1_En_9_Fig17_HTML.jpg](img/A463931_1_En_9_Fig17_HTML.jpg)\n\
  \n图 9-17\n生成的一批验证码图像\n\n#### 这不算作弊吗？\n\n当然，我们很幸运，这里是自己生成验证码，因此有机会同时保留答案。但在现实世界中，验证码不会暴露其答案（否则就违背了验证码的初衷），因此我们需要另寻途径来创建训练集。一种方法是找出某个网站生成验证码所用的库，并用它来收集自己的训练图像，尽可能还原原始验证码。另一种方法是手动标注图像，虽然听起来很繁琐，但你可能不需要标注数千张图像就能达到理想效果。由于人们在填写验证码时也会出错，我们就有多次机会获取正确答案，因此无需追求\
  \ 100% 的准确率。即使我们的预测模型每十张图像只能正确识别一张，经过几次重试后，也足以突破验证码。\n\n接下来，我们将编写另一个脚本，将图像切割成单独的小块，每个字符一块。我们也可以尝试构建一个一次性预测完整答案的模型，但在许多情况下，逐字符预测要容易得多。为了切割图像，我们需要借助\
  \ `OpenCV` 来完成一些繁重的工作。关于 `OpenCV` 和计算机视觉的完整讨论足以写成一本书，因此我们只介绍一些基础知识。这里用到的主要概念是阈值处理、开运算和轮廓检测。为了演示其工作原理，我们先创建一个小的测试脚本：\n\
  \n```\nimport cv2\nimport numpy as np\n\n##### 将此路径改为你生成的图像之一：\nimage_file = 'generated_images/ABQM_116.png'\n\
  image = cv2.imread(image_file)\ncv2.imshow('原始图像', image)\n\n##### 转换为灰度图，然后进行阈值处理得到黑白图像\n\
  gray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n_, thresh = cv2.threshold(gray,\
  \ 0, 255, cv2.THRESH_BINARY_INV | cv2.THRESH_OTSU)\ncv2.imshow('黑白图像', thresh)\n\
  \n##### 应用开运算：先“腐蚀”后“膨胀”\ndenoised = thresh.copy()\nkernel = np.ones((4, 3), np.uint8)\n\
  denoised = cv2.erode(denoised, kernel, iterations=1)\nkernel = np.ones((6, 3), np.uint8)\n\
  denoised = cv2.dilate(denoised, kernel, iterations=1)\ncv2.imshow('去噪后', denoised)\n\
  ```\n\n\n\n##### 现在查找轮廓并将其叠加到原始图像上\n```\n_, cnts, _ = cv2.findContours(denoised.copy(),\
  \ cv2.RETR_TREE, cv2.CHAIN_APPROX_NONE)\ncv2.drawContours(image, cnts, contourIdx=-1,\
  \ color=(255, 0, 0), thickness=-1)\ncv2.imshow('Contours', image)\ncv2.waitKey(0)\n\
  ```\n\n如果运行此脚本，您将获得一系列预览窗口，如图 9-18 所示。在前两个步骤中，我们用 OpenCV 打开图像，并将其转换为简单的纯黑白表示。接下来，我们应用一个“开运算”形态学变换，它本质上就是先进行腐蚀，再进行膨胀。腐蚀的基本思想就像土壤侵蚀：这种变换通过在图像上滑动一个“核”（可以理解为“窗口”），来“侵蚀掉”前景对象（假定为白色）的边界，只有当周围核中的所有像素也都是白色时，这些白色像素才会被保留，否则就变为黑色。膨胀则相反：它通过将像素设置为白色（如果周围核中至少有一个像素是白色）来扩大图像。应用这些步骤是去除图像噪声的常见策略。上面脚本中使用的核大小只是反复尝试的结果，对于其他类型的验证码图像，您可能需要调整这些值。请注意，我们允许图像中残留一些噪声。我们不需要获得完美的图像，因为我们相信我们的预测模型能够“忽略这些噪声”。\n\
  \n![A463931_1_En_9_Fig18_HTML.jpg](img/A463931_1_En_9_Fig18_HTML.jpg)\n\n**图 9-18**\
  \ 使用 OpenCV 处理图像。从左到右依次为：原始图像、转换为黑白后的图像、应用开运算去除噪声后的图像，以及在原始图像上以蓝色叠加显示提取到的轮廓。\n\n\
  接下来，我们使用 OpenCV 的 `findContours()` 方法来提取由白色像素连接而成的“斑点”。OpenCV 提供了多种方法来执行此提取，并以不同方式表示结果（例如，是否简化轮廓、是否构建层级关系等）。最后，我们使用\
  \ `drawContours()` 方法来绘制发现的斑点。这里的 `contourIdx` 参数表示我们要绘制所有顶层轮廓，`thickness` 值为 `-1`\
  \ 则指示 OpenCV 填充这些轮廓。\n\n#### 使用掩码提取单个字符\n\n现在我们仍然需要一种方法来利用轮廓创建独立的图像：每个字符一张。我们将通过使用掩码来实现这一点。请注意，OpenCV\
  \ 也允许获取每个轮廓的“外接矩形”，这会使“裁剪”图像变得容易得多，但如果字符的部分区域相互靠近，这可能会给我们带来麻烦。相反，我们将采用以下代码片段所示的方法：\n\
  \n```\nimport cv2\nimport numpy as np\nimage_file = 'generated_images/ABQM_116.png'\n\
  \n##### 执行阈值处理、腐蚀和轮廓查找，与之前所示相同\nimage = cv2.imread(image_file)\ngray = cv2.cvtColor(image,\
  \ cv2.COLOR_BGR2GRAY)\n_, thresh = cv2.threshold(gray, 0, 255, cv2.THRESH_BINARY_INV\
  \ | cv2.THRESH_OTSU)\ndenoised = thresh.copy()\nkernel = np.ones((4, 3), np.uint8)\n\
  denoised = cv2.erode(denoised, kernel, iterations=1)\nkernel = np.ones((6, 3), np.uint8)\n\
  denoised = cv2.dilate(denoised, kernel, iterations=1)\n_, cnts, _ = cv2.findContours(denoised.copy(),\
  \ cv2.RETR_TREE, cv2.CHAIN_APPROX_NONE)\n\n##### 创建一个全新的“掩码”图像\nmask = np.ones((image.shape[0],\
  \ image.shape[1]), dtype=\"uint8\") * 0\n\n##### 我们将使用第一个轮廓作为示例\ncontour = cnts[0]\n\
  \n##### 在掩码上绘制此轮廓\ncv2.drawContours(mask, [contour], -1, (255, 255, 255), -1)\n\
  cv2.imshow('Denoised image', denoised)\ncv2.imshow('Mask after drawing contour',\
  \ mask)\nresult = cv2.bitwise_and(denoised, mask)\ncv2.imshow('Result after and\
  \ operation', result)\nretain = result > 0\nresult = result[np.ix_(retain.any(1),\
  \ retain.any(0))]\ncv2.imshow('Final result', result)\ncv2.waitKey(0)\n```\n\n如果运行此脚本，您将获得如图\
  \ 9-19 所示的结果。首先，我们创建一个与起始去噪图像尺寸相同的新黑色图像。我们取一个轮廓，并将其以白色绘制在此“掩码”上。然后，对去噪图像和掩码执行按位“与”操作，如果两个输入图像中对应的像素都是白色，则保留该白色像素，否则将其设置为黑色。接着，我们应用一些巧妙的\
  \ numpy 切片来裁剪图像。\n\n这足以让我们入门，但还有一个问题需要解决：重叠。如果字符重叠，它们会被检测为一个大的轮廓。为了解决这个问题，我们将应用以下操作。首先，从一个轮廓列表开始，检查两个不同轮廓之间是否存在显著的重叠，如果存在，则只保留较大的那个。接下来，我们根据轮廓的大小进行排序，取前\
  \ `n` 个轮廓，然后按横轴方向从左到右排序（其中 `n` 是验证码中的字符数）。这仍然可能导致轮廓数量少于我们所需，因此我们遍历每个轮廓，检查其宽度是否高于预期值。一个很好的预期值启发式方法是：估算宽度，即图像中最左侧白色像素到最右侧白色像素的距离除以我们期望看到的字符数。如果某个轮廓的宽度超出预期，我们将其切割成\
  \ `m` 个相等的部分，其中 `m` 等于该轮廓的宽度除以预期宽度。这是一种启发式方法，仍然可能导致某些字符无法被完美切割（有些字符比其他字符大），但这一点我们只能接受。如果在所有这些操作之后，我们最终没有得到所需的字符数，我们将直接跳过该图像。\n\
  \n![A463931_1_En_9_Fig19_HTML.jpg](img/A463931_1_En_9_Fig19_HTML.jpg)\n\n**图 9-19**\
  \ 使用 OpenCV 中的轮廓掩码提取图像的一部分。左上角显示的是起始图像。右侧创建了一个新图像，轮廓以白色绘制并填充。这两幅图像通过按位“与”操作合成，得到第二行中部的图像。最下方的图像显示了应用裁剪后的最终结果。\n\
  \n#### 将所有内容整合到一个辅助模块中\n\n我们将在单独的函数列表（位于 `functions.py` 文件中）中实现所有这些功能：\n\n```\n\
  import cv2\nimport numpy as np\nfrom math import ceil, floor\nfrom constants import\
  \ *\n\ndef overlaps(contour1, contour2, threshold=0.8):\n    # 检查两个轮廓的外接矩形是否重叠\n\
  \    area1 = contour1['w'] * contour1['h']\n    area2 = contour2['w'] * contour2['h']\n\
  \    left = max(contour1['x'], contour2['x'])\n    right = min(contour1['x'] + contour1['w'],\
  \ contour2['x'] + contour2['w'])\n    top = max(contour1['y'], contour2['y'])\n\
  \    bottom = min(contour1['y'] + contour1['h'], contour2['y'] + contour2['h'])\n\
  \    if left < right and top < bottom:\n        intArea = (right - left) * (bottom\
  \ - top)\n        intRatio = intArea / min(area1, area2)\n        if intRatio >=\
  \ threshold:\n            # 如果第二个轮廓更大，则返回 True\n            return area2 > area1\n\
  \    # 不重叠或未超过阈值\n    return None\n\ndef remove_overlaps(cnts):\n    contours =\
  \ []\n    for c in cnts:\n        x, y, w, h = cv2.boundingRect(c)\n        new_contour\
  \ = {'x': x, 'y': y, 'w': w, 'h': h, 'c': c}\n        for other_contour in contours:\n\
  \            overlap = overlaps(other_contour, new_contour)\n            if overlap\
  \ is not None:\n                if overlap:\n                    # 保留当前这个...\n \
  \                   contours.remove(other_contour)\n                    contours.append(new_contour)\n\
  \                # ... 否则不做任何操作：保留原始的那个\n                break\n        else:\n\
  \            # 没有 break，所以未发现重叠，添加该轮廓\n            contours.append(new_contour)\n\
  \    return contours\n\ndef process_image(image):\n```\n\n\n\n##### 执行基本预处理\n\n\
  ```python\ngray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n_, thresh = cv2.threshold(gray,\
  \ 0, 255, cv2.THRESH_BINARY_INV | cv2.THRESH_OTSU)\ndenoised = thresh.copy()\nkernel\
  \ = np.ones((4, 3), np.uint8)\ndenoised = cv2.erode(denoised, kernel, iterations=1)\n\
  kernel = np.ones((6, 3), np.uint8)\ndenoised = cv2.dilate(denoised, kernel, iterations=1)\n\
  return denoised\n```\n\n```python\ndef get_contours(image):\n    # 检索轮廓\n    _,\
  \ cnts, _ = cv2.findContours(image.copy(), cv2.RETR_TREE, cv2.CHAIN_APPROX_NONE)\n\
  \n    # 移除重叠的轮廓\n    contours = remove_overlaps(cnts)\n\n    # 按大小排序，仅保留前 NR_CHARACTERS\
  \ 个\n    contours = sorted(contours, key=lambda x: x['w'] * x['h'], reverse=True)[:NR_CHARACTERS]\n\
  \n    # 从左到右排序\n    contours = sorted(contours, key=lambda x: x['x'], reverse=False)\n\
  \    return contours\n```\n\n```python\ndef extract_contour(image, contour, desired_width,\
  \ threshold=1.7):\n    mask = np.ones((image.shape[0], image.shape[1]), dtype=\"\
  uint8\") * 0\n    cv2.drawContours(mask, [contour], -1, (255, 255, 255), -1)\n \
  \   result = cv2.bitwise_and(image, mask)\n    mask = result > 0\n    result = result[np.ix_(mask.any(1),\
  \ mask.any(0))]\n    if result.shape[1] > desired_width * threshold:\n        #\
  \ 此轮廓比预期更宽，将其分割\n        amount = ceil(result.shape[1] / desired_width)\n      \
  \  each_width = floor(result.shape[1] / amount)\n\n        # 注意：基于 im[y1:y2, x1:x2]\
  \ 进行索引\n        results = [result[0:(result.shape[0] - 1), (i * each_width):((i\
  \ + 1) * each_width - 1)] \\\n                   for i in range(amount)]\n     \
  \   return results\n    return [result]\n```\n\n```python\ndef get_letters(image,\
  \ contours):\n    desired_size = (contours[-1]['x'] + contours[-1]['w'] - contours[0]['x'])\
  \ / NR_CHARACTERS\n    masks = [m for l in [extract_contour(image, contour['c'],\
  \ desired_size) \\\n                         for contour in contours] for m in l]\n\
  \    return masks\n```\n\n至此，我们终于可以开始编写切割脚本（`cut.py`）了。\n\n![A463931_1_En_9_Fig20_HTML.jpg](img/A463931_1_En_9_Fig20_HTML.jpg)\n\
  \n**图 9-20** 提取出的\"S\"图像集合\n\n```python\nfrom os import makedirs\nimport os.path\n\
  from glob import glob\nfrom functions import *\nfrom constants import *\n\nimage_files\
  \ = glob(os.path.join(CAPTCHA_FOLDER, '*.png'))\nfor image_file in image_files:\n\
  \    print('正在处理文件:', image_file)\n    answer = os.path.basename(image_file).split('_')[0]\n\
  \    image = cv2.imread(image_file)\n    processed = process_image(image)\n    contours\
  \ = get_contours(processed)\n    if not len(contours):\n        print('[!] 无法提取轮廓')\n\
  \        continue\n    letters = get_letters(processed, contours)\n    if len(letters)\
  \ != NR_CHARACTERS:\n        print('[!] 无法提取所需数量的字符')\n        continue\n    if\
  \ any([l.shape[0] < 10 or l.shape[1] < 10 for l in letters]):\n        print('[!]\
  \ 部分提取的字符尺寸过小')\n        continue\n    for i, mask in enumerate(letters):\n    \
  \    letter = answer[i]\n        outfile = '{}_{}.png'.format(answer, i)\n     \
  \   outpath = os.path.join(LETTERS_FOLDER, letter)\n        if not os.path.exists(outpath):\n\
  \            makedirs(outpath)\n        print('[i] 保存', letter, '为', outfile)\n\
  \        cv2.imwrite(os.path.join(outpath, outfile), mask)\n```\n\n如果你运行此脚本，`letters`\
  \ 目录下现在应为每个字母创建一个子目录，具体可参考图 9-20。现在我们已经准备好构建深度学习模型。我们将使用一个简单的卷积神经网络架构，并借助 `Keras`\
  \ 库来实现。\n\n```\npip install -U keras\n```\n\n要使用 `Keras`，我们还需要安装一个后端（可以理解为 `Keras`\
  \ 所使用的“引擎”）。你可以使用功能相对有限的 `theano` 库、谷歌的 `Tensorflow`，或者微软的 `CNTK`。我们假设你使用的是 Windows\
  \ 系统，因此 `CNTK` 是最容易上手的选择。（否则，请改用 `pip` 安装 `theano` 库。）要安装 `CNTK`，请访问 [`https://docs.microsoft.com/en-us/cognitive-toolkit/setup-windows-python?tabs=cntkpy231`](https://docs.microsoft.com/en-us/cognitive-toolkit/setup-windows-python?tabs=cntkpy231)\
  \ 并查找与你 Python 版本对应的 URL。如果你的计算机有兼容的 GPU，可以使用 `GPU` 选项。如果这不起作用或者遇到问题，请坚持使用 `CPU`\
  \ 选项。然后按如下方式执行安装（使用 GPU Python 3.6 版本 URL）：\n\n```\npip install -U https://cntk.ai/PythonWheel/GPU/cntk-2.3.1-cp36-cp36m-win_amd64.whl\n\
  ```\n\n接下来，我们需要创建一个 `Keras` 配置文件。运行一个 Python REPL 并按如下方式导入 `Keras`：\n\n```python\n\
