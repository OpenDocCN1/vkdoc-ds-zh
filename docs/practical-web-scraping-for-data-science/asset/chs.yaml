  \n### 9.5 爬取 GitHub Stars\n\n我们将使用 `requests` 和 Beautiful Soup 来爬取 [`https://github.com`](https://github.com/)。我们的目标是，针对给定的\
  \ GitHub 用户名（例如 [`https://github.com/google`](https://github.com/google)），获取包含仓库列表、GitHub\
  \ 分配的主要编程语言以及仓库星标数量的信息。\n\n这个爬虫的基本结构相当简单：\n\n```\nimport requests\nfrom bs4 import\
  \ BeautifulSoup\nimport re\nsession = requests.Session()\nurl = 'https://github.com/{}'\n\
  username = 'google'\nr = session.get(url.format(username), params={'page': 1, 'tab':\
  \ 'repositories'})\nhtml_soup = BeautifulSoup(r.text, 'html.parser')\nrepos = html_soup.find(class_='repo-list').find_all('li')\n\
  for repo in repos:\nname = repo.find('h3').find('a').get_text(strip=True)\nlanguage\
  \ = repo.find(attrs={'itemprop': 'programmingLanguage'})\nlanguage = language.get_text(strip=True)\
  \ if language else 'unknown'\nstars = repo.find('a', attrs={'href': re.compile('\\\
  /stargazers')})\nstars = int(stars.get_text(strip=True).replace(',', '')) if stars\
  \ else 0\nprint(name, language, stars)\n```\n\n运行这段代码会输出：\n\n```\nsagetv Java 192\n\
  ggrc-core Python 233\ngapid Go 445\ncertificate-transparency-rfcs Python 55\nmtail\
