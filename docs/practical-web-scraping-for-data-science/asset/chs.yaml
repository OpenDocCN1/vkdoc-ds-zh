  \ = 'readability-script';\n}\nscript.src = 'http://www.webscrapingforscience.com/readability/Readability.js';\n\
  d.getElementsByTagName('head')[0].appendChild(script);\n}(document));\n'''\nget_article_cmd\
  \ = '''\nvar documentClone = document.cloneNode(true);\nvar loc = document.location;\n\
  var uri = {\nspec: loc.href,\nhost: loc.host,\nprePath: loc.protocol + \"//\" +\
  \ loc.host,\nscheme: loc.protocol.substr(0, loc.protocol.indexOf(\":\")),\npathBase:\
  \ loc.protocol + \"//\" + loc.host +\nloc.pathname.substr(0, loc.pathname.lastIndexOf(\"\
  /\") + 1)\n};\nvar article = new Readability(uri, documentClone).parse();\nreturn\
  \ JSON.stringify(article);\n'''\ndriver = webdriver.Chrome()\ndriver.implicitly_wait(10)\n\
  driver.get(base_url)\nnews_urls = []\nfor link in driver.find_elements_by_css_selector('main\
  \ a[role=\"heading\"]'):\nnews_url = link.get_attribute('href')\nnews_urls.append(news_url)\n\
  for news_url in news_urls:\nprint('Now scraping:', news_url)\ndriver.get(news_url)\n\
