- "# 第一部分：网络抓取基础\n\n## 1. 简介\n\n在本章中，我们将向你介绍网络抓取的概念，并强调这一实践对数据科学家的用处。在展示了近年来网络抓取在各个领域和行业中的一些有趣用例之后，我们将通过准备你的编程环境，确保你已准备好开始网络抓取。\n\
  \n\n### 1.1 什么是网络爬虫？\n\n网络“爬虫”（也称“网络采集”、“网络数据提取”甚至“网络数据挖掘”）可定义为“构建一个代理，以自动化方式从网络下载、解析并整理数据”。或者换句话说：不再是最终用户手动在网页浏览器中点击、将感兴趣的内容复制粘贴到电子表格等处，而是由网络爬虫将这一任务交给计算机程序，它能够比人类更快、更准确地执行。\n\
  \n从互联网上自动收集数据可能和互联网本身一样古老，而“爬虫”这个术语的出现时间远早于万维网。在“网络爬虫”作为一个术语普及之前，一种被称为“屏幕抓取”的做法早已成为从可视化表示中提取数据的成熟方式——在计算机早期（想想\
  \ 20 世纪 60 年代到 80 年代），这通常简化为基于文本的“终端”。和今天一样，当时的人们也热衷于从这类终端“抓取”大量文本，并将这些数据存储起来以备后用。\n\
  \n#### 1.1.1 数据科学为何需要网络爬虫？\n\n当使用普通网页浏览器上网时，你可能遇到过不少网站，考虑过收集、存储和分析其页面上展示数据的可能性。尤其对于数据科学家而言，其“原材料”就是数据，网络提供了大量有趣的机会：\n\
  \n*   维基百科的某个页面（或多个页面）上可能有一个你感兴趣的数据表格，想要获取它来进行一些统计分析。\n*   也许你想从某个电影网站获取一份评论列表，用于执行文本挖掘、构建推荐引擎，或建立预测模型来识别虚假评论。\n\
  *   你可能希望从房地产网站获取房源列表，用于制作吸引人的地理可视化图表。\n*   你可能想根据在网上找到的信息（例如天气信息）来收集额外的特征以丰富你的数据集，比如预测软饮料的销量。\n\
  *   你可能正在思考如何利用网络论坛上的个人资料数据进行社交网络分析。\n*   监控某个新闻网站，以了解特定感兴趣话题的最新动态，这可能也颇有趣味。\n\n\
  网络包含了大量有趣的数据源，为各种有意思的应用提供了宝藏。遗憾的是，当前网络非结构化的特性，并不总能让我们轻易地收集或导出这些数据。网页浏览器非常擅长展示图像、播放动画以及布局网站，使其在视觉上对人类有吸引力，但它们并没有提供一种简单的数据导出方式，至少在大多数情况下没有。与其在你的浏览器窗口中一页一页地浏览网页，难道不能自动收集一个丰富的数据集吗？这正是网络爬虫大显身手的场合。\n\
  \n如果你对网络稍有了解，可能会想：“这不正是应用程序编程接口（API）的用途吗？”确实，如今许多网站都提供这样的 API，为外界提供一种结构化的方式来访问其数据存储库——这些\
  \ API 旨在供计算机程序（而非人类）使用和访问（当然，程序是由人类编写的）。例如，Twitter、Facebook、LinkedIn 和谷歌都提供了此类 API，用于搜索和发布推文、获取好友列表及其喜好、查看你与谁有联系等等。那么，为什么我们还需要网络爬虫呢？关键在于，API\
  \ 是访问数据源的绝佳手段，但前提是目标网站提供了 API，并且该 API 具备你想要的功能。一般的经验法则是：在着手构建网络爬虫来收集数据之前，先寻找是否提供\
  \ API，如果可能的话，优先使用 API。例如，你可以轻松地使用 Twitter 的 API 来获取最近的推文列表，而不是重复造轮子。尽管如此，在某些情况下，使用网络爬虫仍然比使用\
  \ API 更可取：\n\n*   你想要提取数据的网站不提供 API。\n*   提供的 API 不是免费的（而网站是免费的）。\n*   提供的 API 有速率限制：意味着你每秒、每天只能访问一定次数……\n\
  *   API 没有暴露你想要获取的所有数据（而网站上却有）。\n\n在所有这些情况下，使用网络爬虫就能派上用场。事实仍然是：如果你能在网页浏览器中看到一些数据，你就能够通过程序访问并检索到它。如果你能通过程序访问它，那么这些数据就可以被存储、清洗并以任何方式使用。\n\
  \n\n\n#### 1.1.2 谁在使用网络爬虫？\n\n访问和收集网络上的数据有许多实际应用，其中很多都属于数据科学领域。以下列表概述了一些有趣的实际用例：\n\
  \n-   Google 的许多产品都得益于其爬取网页的核心业务。例如，Google 翻译利用网络上存储的文本来训练和改进自身。\n-   爬虫技术广泛应用于人力资源和员工分析领域。例如，位于旧金山的初创公司\
  \ hiQ 就通过收集和分析公开的个人资料信息（例如来自领英）来专门销售员工分析报告（领英对此并不高兴，但在一场官司之后，至今未能阻止这种做法；参见 [`https://www.bloomberg.com/news/features/2017-11-15/the-brutal-fight-to-mine-your-data-and-sell-it-to-your-boss`](https://www.bloomberg.com/news/features/2017-11-15/the-brutal-fight-to-mine-your-data-and-sell-it-to-your-boss)\
  \ ）。\n-   数字营销人员和数字艺术家经常利用网络数据进行各种有趣且富有创意的项目。例如，乔纳森·哈里斯和塞普·坎瓦尔创作的“我们感觉很好”，就爬取了各种博客网站中以“我感觉”开头的短语，其结果可以可视化展示全世界人们一整天的情绪感受。\n\
  -   在另一项研究中，研究人员爬取了来自推特、博客和其他社交媒体上的信息，构建了一个数据集，用于建立预测模型来识别抑郁和自杀念头的模式。这可能成为援助人员非常宝贵的工具，当然，这也需要对隐私相关问题进行深思熟虑（参见\
  \ [`https://www.sas.com/en_ca/insights/articles/analytics/using-big-data-to-predictsuicide-risk-canada.html`](https://www.sas.com/en_ca/insights/articles/analytics/using-big-data-to-predictsuicide-risk-canada.html)\
  \ ）。\n-   Emmanuel Sales 也爬取了推特，但他的目标是理解自己的社交圈和时间线上的帖子（参见 [`https://emsal.me/blog/4`](https://emsal.me/blog/4)\
  \ ）。这里一个有趣的观察是，作者最初考虑使用推特的 API，但发现“推特对此有严格的速度限制：如果你想获取用户的关注者列表，每 15 分钟只能操作 15 次，这非常不灵活。”\n\
  -   在一篇题为“十亿美元价格项目：使用在线价格进行测量与研究”的论文中（参见 [`http://www.nber.org/papers/w22111`](http://www.nber.org/papers/w22111)\
  \ ），研究人员使用网络爬虫收集了一个在线价格信息数据集，用于构建多个国家稳健的每日价格指数。\n-   银行和其他金融机构正在使用网络爬虫进行竞争对手分析。例如，银行经常爬取竞争对手的网站，以了解其分支机构的开设或关闭地点，或追踪其提供的贷款利率——这些都是可以纳入其内部模型和预测的有趣信息。投资公司也经常使用网络爬虫，例如，跟踪其投资组合中相关资产的新闻文章。\n\
  -   社会政治学家正在爬取社交网站，以追踪民众情绪和政治倾向。一篇名为“剖析特朗普最狂热的网络追随者”的著名文章（参见 [`https://fivethirtyeight.com/features/dissecting-trumps-most-rabid-online-following/`](https://fivethirtyeight.com/features/dissecting-trumps-most-rabid-online-following/)\
  \ ）使用语义分析来分析 Reddit 上的用户讨论，以描绘唐纳德·特朗普的网络追随者和粉丝的特征。\n-   一位研究人员能够根据从 Tinder 和 Instagram\
  \ 爬取的图片及其“点赞”数据来训练一个深度学习模型，以预测一张图片是否会被认为是“有吸引力的”（参见 [`http://karpathy.github.io/2015/10/25/selfie/`](http://karpathy.github.io/2015/10/25/selfie/)\
  \ ）。智能手机制造商已经将此类模型整合到他们的照片应用中，以帮助你美化照片。\n-   在“戴砖耳环的女孩”项目中，Lucas Woltmann 着手从 [`https://www.bricklink.com`](https://www.bricklink.com)\
  \ 爬取乐高积木信息，以确定最能表现一幅图像的最佳乐高零件组合（参见 [`http://lucaswoltmann.de/art'n'images/2017/04/08/the-girl-with-the-brick-earring.html`](http://lucaswoltmann.de/art'n'images/2017/04/08/the-girl-with-the-brick-earring.html)\
  \ ）（本书的一位合著者是狂热的乐高迷，所以我们一定要包括这个例子）。\n-   在“用 Python 分析 1000 多种希腊葡萄酒”项目中，Florents\
  \ Tselai 从一家希腊葡萄酒商店爬取了上千种葡萄酒的信息（参见 [`https://tselai.com/greek-wines-analysis.html`](https://tselai.com/greek-wines-analysis.html)\
  \ ），以分析它们的产地、评分、类型和酒精度（本书的一位合著者是狂热的葡萄酒爱好者，所以我们一定要包括这个例子）。\n-   总部位于伦敦的在线时尚市场 Lyst，爬取网络上半结构化的时尚产品信息，然后应用机器学习，通过一个中心网站将这些信息整洁优雅地呈现给消费者。其他数据科学家也做过类似的项目来对相似的时尚产品进行聚类（参见\
  \ [`http://talks.lystit.com/dsl-scraping-presentation/`](http://talks.lystit.com/dsl-scraping-presentation/)\
  \ ）。\n-   我们指导过一项研究，利用网络爬虫从招聘网站提取信息，以了解职场中不同数据科学和分析相关工具的流行程度（剧透：Python 和 R 都在稳步上升）。\n\
  -   我们研究小组的另一项研究涉及使用网络爬虫监控新闻媒体和网络论坛，以追踪公众对比特币的情绪。\n\n无论你兴趣领域如何，几乎总能找到基于数据来改进或丰富实践的应用场景。“数据是新的石油”，这句俗话如是说，而网络上拥有大量的数据。\n\
  \n### 1.2 准备工作\n\n#### 1.2.1 环境搭建\n\n本书将全程使用 Python 3。你可以从 [`https://www.python.org/downloads/`](https://www.python.org/downloads/)\
  \ 为你的平台（Windows、Linux 或 MacOS）下载并安装 Python 3。\n\n**为什么用 Python 3 而不是 2？**\n\n根据\
  \ Python 创始人自己的说法，“Python 2 是遗留版本，Python 3 是该语言的现在和未来。”由于我们力求提供一份现代的指南，我们特意选择了 Python\
  \ 3 作为我们的工作语言。话虽如此，仍然有很多 Python 2 的代码在流传（甚至可能在你的公司里）。如果你在你的 Python 2 代码中添加以下导入语句，本书提供的大多数概念和示例也应该能在\
  \ Python 2 中正常工作：\n\n```\nfrom __future__ import absolute_import, division, print_function\n\
  ```\n\n你还需要安装 Python 的包管理器 “pip”。如果你安装了较新版本的 Python 3，它会自带 pip。然而，最好通过在命令行执行以下命令来确保\
  \ pip 是最新版本：\n\n```\npython -m pip install -U pip\n```\n\n或者（如果你使用的是 Linux 或 MacOS）：\n\
  \n```\npip install -U pip\n```\n\n**手动安装 pip**\n\n你的系统上还没有 pip？请参考以下页面在你的系统上进行安装（参考“使用\
  \ get-pip.py 安装”部分）：[`https://pip.pypa.io/en/stable/installing/`](https://pip.pypa.io/en/stable/installing/)。\n\
  \n最后，你可能还希望在你的系统上安装一个合适的文本编辑器来编辑 Python 代码文件。Python 自带了一个基本的编辑器（在你的程序菜单中查找 “Idle”），但其他文本编辑器，如\
  \ Notepad++、Sublime Text、VSCode、Atom 等，也同样好用。\n\n\n\n#### 1.2.2 Python 快速入门\n\n\
  我们假设你已经具备一定的编程经验，或许已经能熟练阅读和编写 Python 代码。如果尚未达到，下面的概述将帮助你快速上手。\n\nPython 代码可以通过两种方式编写和执行：\n\
  \n1.  使用 Python 解释器 REPL（“读取-求值-打印-循环”），它提供了一个交互式会话，你可以逐行输入 Python 命令 (`读取`)，这些命令会被求值\
  \ (`求值`)，然后显示结果 (`打印`)。这些步骤会重复（“循环”），直到你关闭会话。\n2.  在 “.py” 文件中编写 Python 源代码，然后运行这些文件。\n\
  \n对于几乎任何用例来说，使用规范的 “.py” 文件并运行它们都是一个好主意，尽管 Python REPL 在测试一个快速想法或试验几行代码时很方便。要启动它，只需在命令行窗口中输入\
  \ `python` 并按回车键，如图 1-1 所示。\n\n![A463931_1_En_1_Fig1_HTML.jpg](img/A463931_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n从命令行打开 Python 解释器\n\n三个尖括号 (`>>>`) 表示一个提示符，意味着 Python REPL 正在等待你的命令。尝试执行以下命令：\n\
  \n```\n>>> 1 + 1\n>>> 8 - 1\n>>> 10 * 2\n>>> 35 / 5\n7.0\n>>> 5 // 3\n>>> 7 % 3\n\
  >>> 2 ** 3\n```\n\n数学运算与你预期的一致；`//` 表示整数除法；`%` 是取模运算符，返回除法后的余数；`**` 表示“乘方”。\n\n\
  Python 支持以下数字类型：\n\n-   整数 (`int`)，表示有符号整数值（即非小数），例如 10、100、-700 等。\n-   长整数 (`long`)，表示有符号整数值，占用比标准整数更多的内存，因此可以表示更大的数字。通过在末尾加上\
  \ `L` 来编写，例如 535633629843L、10L、-100000000L 等。\n-   浮点数 (`float`)，也就是小数，例如 0.4、-10.2\
  \ 等。\n-   复数 (`complex`)，在非数学代码中不常用。通过在末尾加上 `j` 来编写，例如 3.14j、.876j 等。\n\n除了数字，Python\
  \ 还支持字符串 (`str`)：用双引号或单引号括起来的文本值，以及布尔 (`bool`) 逻辑值：`True` 和 `False`（注意大小写）。`None`\
  \ 表示一个代表“空”的特殊值。尝试执行以下几行代码来体验这些类型：\n\n```\n>>> 'This is a string value'\n'This is\
  \ a string value'\n>>> \"This is also a string value\"\n'This is also a string value'\n\
  >>> \"Strings can be \" + 'added'\n'Strings can be added'\n>>> \"But not to a number:\
  \ \" + 5\nTraceback (most recent call last):\nFile \"\", line 1, in \nTypeError:\
  \ must be str, not int\n>>> \"So we convert it first: \" + str(5)\n'So we convert\
  \ it first: 5'\n>>> False and False\nFalse\n>>> False or True\nTrue\n>>> not False\n\
  True\n>>> not True\nFalse\n>>> not False and True\nTrue\n>>> None + 5\nTraceback\
  \ (most recent call last):\nFile \"\", line 1, in \nTypeError: unsupported operand\
  \ type(s)\nfor +: 'NoneType' and 'int'\n>>> 4  also works\nFalse\n>>> 100 >= 10\
  \ # >> 10 == 10\nTrue\n>>> None == False\nFalse\n>>> False == 0\nTrue\n>>> True\
  \ == 1\nTrue\n>>> True == 2\nFalse\n>>> 2 != 3\nTrue\n>>> 2 != '2'\nTrue\n```\n\n\
  同样，上面的指令应该很容易理解，也许最后几行除外。在 Python 中，`==` 表示相等比较，因此返回 `True` 或 `False` 作为结果。`None`\
  \ 既不等于 `False` 也不等于 `True`，但在 Python 中，`False` 被视为等于零 (0)，`True` 被视为等于一 (1)。注意，相等和不等运算符（`==`\
  \ 和 `!=`）会考虑被比较的类型；因此数字 2 不等于字符串 `\"2\"`。\n\n##### `is` 和 `==` 一样吗？\n\n除了 `==`，Python\
  \ 还提供了 `is` 关键字，如果两个变量指向同一个对象（因此它们的内容也总是相等的），它将返回 `True`。`==` 检查两个变量的内容是否相等，即使它们可能不指向同一个对象。通常，你会使用\
  \ `==`，但有几个例外，即检查变量是否等于 `True`、`False` 或 `None`。所有值为这些的变量在内存中都指向同一个对象，因此，除了编写 `my_var\
  \ == None`，你还可以编写 `my_var is None`，这样读起来更好一些。\n\n在 REPL 交互式会话中，我们输入的所有结果都会立即显示在屏幕上。然而，在执行\
  \ Python 文件时，情况并非如此，因此我们需要一个函数来显式地在屏幕上“打印出”信息。在 Python 中，可以通过 `print` 函数来完成：\n\n\
  ```\n>>> print(\"Nice to meet you!\")\nNice to meet you!\n>>> print(\"Nice\", \"\
  to\", \"meet\", \"you!\")\nNice to meet you!\n>>> print(\"HE\", \"LLO\", sep=\"\
  --\")\nHE--LLO\n>>> print(\"HELLO\", end=\"!!!\\n\")\nHELLO!!!\n```\n\n在处理数据时，我们显然希望将数据保留在程序中，以便在程序的不同部分使用。也就是说，我们希望将数字、字符串等存储在变量中。Python\
  \ 简单使用 `=` 运算符进行变量赋值：\n\n```\n>>> var_a = 3\n>>> var_b = 4\n>>> var_a + var_b +\
  \ 2\n>>> var_str = 'This is a string'\n>>> print(var_str)\nThis is a string\n```\n\
  \nPython 中的字符串可以通过多种不同的方式进行格式化。首先，字符串中带有反斜杠 (`\\`) 前缀的字符表示所谓的“转义字符”，代表了特殊的格式化指令。例如，在上面的例子中，`\\\
  n` 表示换行。另一方面，`\\t` 表示制表符，而 `\\\\` 就是反斜杠字符本身。其次，可以通过 `format` 函数来格式化字符串：\n\n```\n\
  >>> \"{} : {}\".format(\"A\", \"B\")\n'A : B'\n>>> \"{0}, {0}, {1}\".format(\"A\"\
  , \"B\")\n'A, A, B'\n>>> \"{name} wants to eat {food}\".format(name=\"Seppe\", food=\"\
  lasagna\")\n'Seppe wants to eat lasagna'\n```\n\n##### 格式化的多种方式\n\n如果说新版 Python\
  \ 有什么不需要的，那就是更多格式化字符串的方法。除了使用这里演示的 `format` 函数外，Python 还允许我们使用 `%` 运算符来格式化字符串：\n\
  \n```\n\"%s is %s\" % (\"Seppe\", \"happy\")\n```\n\nPython 3.6 还增加了“f-strings”，以一种更简洁的方式格式化字符串：\n\
  \n```\nf 'Her name is {name} and she is {age} years old.'\n```\n\n为了保持清晰，我们将坚持使用\
  \ `format`。\n\n除了数字、布尔值和字符串，Python 还内置了一些非常有用的数据结构，我们将会经常用到它们：列表、元组、字典和集合。\n\n列表用于存储有序的元素序列。下面的指令概述了它们在\
  \ Python 中如何工作。请注意，下面的代码片段也包含注释，这些注释将被 Python 忽略，并以 `#` 字符开头：\n\n```\n>>> li = []\n\
  >>> li.append(1) # li 现在是 [1]\n>>> li.append(2) # li 现在是 [1, 2]\n>>> li.pop() #\
  \ 移除并返回最后一个元素\n>>> li = ['a', 2, False] # 并非所有元素都必须是相同类型\n>>> li = [[3], [3, 4],\
  \ [1, 2, 3]] # 甚至可以是列表的列表\n>>> li = [1, 2, 4, 3]\n>>> li[0]\n>>> li[-1]\n>>> li[1:3]\n\
  [2, 4]\n>>> li[2:]\n[4, 3]\n>>> li[:3]\n[1, 2, 4]\n>>> li[::2] # 通用格式是 li[start:end:step]\n\
  [1, 4]\n>>> li[::-1]\n[3, 4, 2, 1]\n>>> del li[2] # li 现在是 [1, 2, 3]\n>>> li.remove(2)\
  \ # li 现在是 [1, 3]\n>>> li.insert(1, 1000) # li 现在是 [1, 1000, 3]\n>>> [1, 2, 3] +\
  \ [10, 20]\n[1, 2, 3, 10, 20]\n>>> li = [1, 2, 3]\n>>> li.extend([1, 2, 3])\n>>>\
  \ li\n[1, 2, 3, 1, 2, 3]\n>>> len(li)\n>>> len('This works for strings too')\n>>>\
  \ 1 in li\nTrue\n>>> li.index(2)\n>>> li.index(200)\nTraceback (most recent call\
  \ last):\nFile \"\", line 1, in \nValueError: 200 is not in list\n```\n\n元组类似于列表，但它是不可变的，这意味着创建后不能添加或移除元素：\n\
  \n```\n>>> tup = (1, 2, 3)\n>>> tup[0]\n```\n\n\n\n```python\n>>> type((1)) # 单元素元组必须在最后一个元素后面加逗号，但其他长度（甚至零长度）的元组不需要\n\
  >>> type((1,))\n>>> type(())\n>>> len(tup)\n>>> tup + (4, 5, 6)\n(1, 2, 3, 4, 5,\
  \ 6)\n>>> tup[:2]\n(1, 2)\n>>> 2 in tup\nTrue\n>>> a, b, c = (1, 2, 3) # a 现在是 1，b\
  \ 现在是 2，c 现在是 3\n>>> a, *b, c = (1, 2, 3, 4) # a 现在是 1，b 现在是 [2, 3]，c 现在是 4\n>>>\
  \ d, e, f = 4, 5, 6 # 你也可以省略括号\n>>> e, d = d, e # d 现在是 5，e 现在是 4\n```\n\n**集合**（Sets）与列表类似，但它们存储的是唯一且无序的元素集合，就像数学中的集合：\n\
  \n```python\n>>> empty_set = set()\n>>> some_set = {1, 1, 2, 2, 3, 4} # some_set\
  \ 现在是 {1, 2, 3, 4}\n>>> filled_set = some_set\n>>> filled_set.add(5) # filled_set\
  \ 现在是 {1, 2, 3, 4, 5}\n>>> other_set = {3, 4, 5, 6}\n>>> filled_set & other_set\
  \ # 交集\n{3, 4, 5}\n>>> filled_set | other_set # 并集\n{1, 2, 3, 4, 5, 6}\n>>> {1,\
  \ 2, 3, 4} - {2, 3, 5} # 差集\n{1, 4}\n>>> {1, 2} >= {1, 2, 3}\nFalse\n>>> {1, 2}\
  \ < {1, 2, 3}\nTrue\n>>> 2 in filled_set\nTrue\n```\n\n**字典**（Dictionaries）存储一系列唯一键与值之间的映射关系：\n\
  \n```python\n>>> empty_dict = {}\n>>> filled_dict = {\"one\": 1, \"two\": 2, \"\
  three\": 3}\n>>> filled_dict[\"one\"]\n1\n>>> list(filled_dict.keys())\n[\"one\"\
  , \"two\", \"three\"]\n>>> list(filled_dict.values())\n[1, 2, 3]\n>>> \"one\" in\
  \ filled_dict # in 是基于键进行判断的\nTrue\n>>> 1 in filled_dict\nFalse\n>>> filled_dict.get(\"\
  one\")\n1\n>>> filled_dict.get(\"four\")\nNone\n>>> filled_dict.get(\"four\", 4)\
  \ # 如果未找到则返回默认值\n4\n>>> filled_dict.update({\"four\":4})\n>>> filled_dict[\"four\"\
  ] = 4 # 也可以用这种方式添加/更新\n>>> del filled_dict[\"one\"] # 删除键 \"one\"\n```\n\n最后，Python\
  \ 中的控制流也相对简单：\n\n```python\n>>> some_var = 10\n>>> if some_var > 1:\n...   print('Bigger\
  \ than 1')\n...\nBigger than 1\n```\n\n注意 `if` 语句后面的冒号（“:”），以及 REPL 中的三个点“...”，这表示在代码可以执行之前还需要更多输入。Python\
  \ 代码通过空白（缩进）来组织结构，例如，`if` 块中的所有内容都应使用空格或制表符缩进。\n\n##### 缩进（Indentation）\n\n一些程序员初次接触\
  \ Python 时会对这种空白缩进感到困惑，但它确实能带来更易读、更清晰组织的代码。请确保不要在源代码中混用制表符和空格！\n\nPython 中的 `if`\
  \ 块还可以包含可选的 `elif` 和 `else` 块：\n\n```python\n>>> some_var = 10\n>>> if some_var\
  \ > 10:\n...   print('Bigger than 10')\n... elif some_var > 5:\n...   print('Bigger\
  \ than 5')\n... else:\n...   print('Smaller than or equal to 5')\n...\nBigger than\
  \ 5\n```\n\n##### 可读的 If 块\n\n请记住，Python 中的零（0）整数、浮点数和复数都会求值为 `False`。同样，空字符串、集合、元组、列表和字典也会求值为\
  \ `False`。因此，与其写成 `if len(my_list) > 0:`，不如直接使用 `if my_list:`，这样更易读。\n\n我们已经看到 `in`\
  \ 运算符可用于检查列表、元组、集合和字典的成员关系。该运算符也可以用于编写 `for` 循环：\n\n```python\n>>> some_list = [1,\
  \ 2, 3]\n>>> some_string = 'a string'\n>>> 1 in some_list\nTrue\n>>> 'string' in\
  \ some_string\nTrue\n>>> for num in some_list:\n... print(num)\n...\n1\n2\n3\n>>>\
  \ for chr in some_string:\n...   print(chr)\n...\na\ns\nt\nr\ni\nn\ng\n```\n\n为了遍历数字范围，Python\
  \ 还提供了有用的内置函数 `range`：\n\n*   `range(number)`：返回从零到（但不包括）给定数字的一个可迭代对象。\n*   `range(lower,\
  \ upper)`：返回从 `lower` 到（但不包括）`upper` 的一个可迭代对象。\n*   `range(lower, upper, step)`：返回从\
  \ `lower` 到 `upper`、步长为 `step` 的一个可迭代对象。\n\n##### 仅支持整数\n\n遗憾的是，所有这些函数都需要整数作为输入参数。如果你想遍历一个小数范围，你需要自己定义函数。\n\
  \n\n\n请注意此处“可迭代对象”这一概念的使用。在 Python 中，可迭代对象本质上是一种“智能”列表。Python 不会立即用完整的列表数据填满计算机内存，而是会等到你真正需要访问元素本身时再这样做。这就是为什么使用\
  \ `range` 函数会显示如下内容：\n\n```\n>>> range(3)\nrange(0, 3)\n```\n\n将可迭代对象转换为真正的列表很简单，只需把值显式转为列表即可：\n\
  \n```\n>>> list(range(3))\n[0, 1, 2]\n```\n\n然而，在循环遍历可迭代对象时，你无需先显式地进行转换。\n\n因此，你可以像下面这样直接使用\
  \ `range` 函数：\n\n```\n>>> for num in range(1, 100, 15):\n...   print(num)\n...\n\
  \n```\n\n而且，Python 当然也支持“while”风格的循环：\n\n```\n>>> x = 0\n>>> while x < 3:\n... \
  \  print(x)\n...   x = x + 1\n\n```\n\n##### 无限循环\n\n忘了加 `x = x + 1` 这一行？试了 `while\
  \ True:`，或者你的“for”循环陷入了死循环？你可以按下键盘上的 `Control+C` 来执行“键盘中断（Keyboard Interrupt）”，从而停止当前代码块的执行。\n\
  \n每当编写代码时，将可复用的代码片段封装起来是个好习惯，这样可以在不同地方调用和执行它们，而无需复制粘贴大量代码。实现这一点的基本方法是创建函数，这需要使用\
  \ `def` 关键字：\n\n```\n>>> def add(x, y):\n...   print(\"x is {} and y is {}\".format(x,\
  \ y))\n...   return x + y  # 返回值\n...\n>>> add(5, 6)\nx is 5 and y is 6\n\n>>> add(y=10,\
  \ x=5)\nx is 5 and y is 10\n\n```\n\n这里还有两个值得特别注意的结构：`*` 和 `**`。两者都可以在函数签名中使用，分别表示“其余的参数”和“其余的命名参数”。让我们通过一个示例来看看它们是如何工作的：\n\
  \n```\n>>> def many_arguments(*args):\n...   # args 将是一个元组\n...   print(args)\n\
  ...\n>>> many_arguments(1, 2, 3)\n(1, 2, 3)\n>>> def many_named_arguments(**kwargs):\n\
  ...   # kwargs 将是一个字典\n...   print(kwargs)\n...\n>>> many_named_arguments(a=1, b=2)\n\
  {'a': 1, 'b': 2}\n>>> def both_together(*args, **kwargs):\n...   print(args, kwargs)\n\
  ```\n\n除了在方法签名中使用它们之外，你还可以在调用函数时使用它们，以表示你想将一个可迭代对象作为位置参数传递，或将一个字典作为命名参数传递：\n\n```\n\
  >>> def add(a, b):\n...   return a + b\n...\n>>> l = [1,2] # 元组也可以\n>>> add(*l)\n\
  \n>>> d = {'a': 2, 'b': 1}\n>>> add(**d)\n\n```\n\n最后，我们不再使用 Python 的交互式解释器（REPL），而是来看看如何通过源文件编写\
  \ Python 代码。在你能轻松找到的地方创建一个名为 `test.py` 的文件，并添加以下内容：\n\n```\n### test.py\ndef add(x,\
  \ y):\nreturn x + y\nfor i in range(5):\nprint(add(i, 10))\n```\n\n保存文件，然后打开一个新的命令行窗口。你可以通过将文件名传递给\
  \ `python` 可执行程序来运行这个文件，如图 1-2 所示：\n\n![A463931_1_En_1_Fig2_HTML.jpg](img/A463931_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\n从命令行运行 Python 源文件 (`test.py`)\n\n至此，我们快速介绍了 Python 的基础知识。这里跳过了一些细节（如类、try-except-catch\
  \ 块、迭代器与生成器、继承等），但这些并不是开始我们真正要做的：网络爬虫（web scraping）所必需的。\n\n如果你在寻找更多关于 Python 编程的资源，可以看看这些链接：\n\
  \n*   Python 3 官方文档：[`https://docs.python.org/3/`](https://docs.python.org/3/)\n\
  *   深入理解 Python 3：[`http://www.diveintopython3.net/index.html`](http://www.diveintopython3.net/index.html/)\n\
  *   用 Python 自动化处理无聊的事情：[`https://automatetheboringstuff.com/`](https://automatetheboringstuff.com/)\n\
  *   Python 指南（The Hitchhiker’s Guide to Python）：[`http://docs.python-guide.org/en/latest/`](http://docs.python-guide.org/en/latest/)\n\
  *   Python 入门第一步：[`https://realpython.com/learn/python-first-steps/`](https://realpython.com/learn/python-first-steps/)\n\
  \n"
- "# 2. 网络语言 HTTP\n\n在本章中，我们将在对计算机网络进行简要介绍之后，介绍构成网络的核心构建块之一：超文本传输协议（HTTP）。然后，我们将介绍\
  \ Python 的 `requests` 库，我们将用它来执行 HTTP 请求，并开始有效地使用 Python 获取网站内容。本章末尾将介绍如何在 URL 中使用参数。\n\
  \n### 2.1 网络的神奇之处\n\n如今，网络已经深度融入了我们的日常生活，以至于我们很少思考其复杂性。当你上网浏览时，一系列的网络协议便会启动，用于建立与世界各地的计算机的连接并检索数据，这一切都在几秒钟内完成。例如，当你导航到一个网站，比如\
  \ [`www.google.com`](http://www.google.com) 时，你的网络浏览器会执行以下一系列步骤：\n\n\n\n1. 你在浏览器中输入“`www.google.com`”，浏览器需要找出该网站的\
  \ IP 地址。IP 是“Internet Protocol”（互联网协议）的缩写，它是互联网的核心协议之一，使网络能够在连接的计算机之间路由和重定向通信数据包，这些计算机都被分配了一个\
  \ IP 地址。要与谷歌的 Web 服务器通信，需要知道其 IP 地址。由于 IP 地址本质上是一串数字，记住每个网站的 IP 地址会很麻烦。因此，就像你将电话号码与手机通讯录中的姓名关联起来一样，网络也提供了一种机制，将域名（如“`www.google.com`”）转换为\
  \ IP 地址。\n\n2. 你的浏览器开始查找“`www.google.com`”对应的正确 IP 地址。为此，你的 Web 浏览器将使用另一种称为 DNS（域名系统）的协议，过程如下：首先，浏览器会检查其自身的缓存（即“短期记忆”），以确认你最近是否访问过这个网站。如果访问过，浏览器可以重用存储的地址。如果没有，浏览器会询问底层操作系统（例如\
  \ Windows），看它是否知道`www.google.com`的地址。\n\n3. 如果操作系统也不知道这个域名，浏览器会向你的路由器发送 DNS 请求。路由器是连接你与互联网的设备，通常也维护着自己的\
  \ DNS 缓存。如果你的路由器也不知道正确的地址，浏览器将开始向已知的 DNS 服务器发送多个数据包，例如向你的互联网服务提供商（ISP）维护的 DNS 服务器发送请求——该服务器的\
  \ IP 地址已知并存储在路由器中。然后 DNS 服务器会回复，表明“`www.google.com`”映射到了 IP 地址“172.217.17.68”。请注意，即使你的\
  \ ISP 的 DNS 服务器，如果手头没有这条记录，也可能需要向其他 DNS 服务器（位于 DNS 层级结构更高层）查询。\n\n4. 所有这些操作都只是为了找出`www.google.com`的\
  \ IP 地址。现在，你的浏览器可以连接到 Google 的 Web 服务器 172.217.17.68。许多协议（协议是通信方之间关于消息格式的标准约定）被组合在一起（可以说是相互包裹），以构建一个复杂的消息。在这个“洋葱”的最外层，我们发现了\
  \ IEEE 802.3（以太网）协议，用于与同一网络中的机器通信。由于我们不在同一个网络上通信，因此使用 IP（互联网协议）来嵌入另一条消息，表明我们希望联系地址为\
  \ 172.217.17.68 的服务器。在 IP 内部，我们发现另一个名为 TCP（传输控制协议）的协议，该协议提供了一种通用、可靠的网络消息传递方式，因为它包含错误检查和将消息拆分为更小数据包的功能，从而确保这些数据包按正确顺序传递。TCP\
  \ 还会在数据包传输丢失时重新发送。最后，在 TCP 消息内部，我们找到了另一条消息，其格式遵循 HTTP 协议（超文本传输协议），这是实际用于请求和接收网页的协议。基本上，这里的\
  \ HTTP 消息表达了我们 Web 浏览器的请求：“能给我你的首页吗？”\n\n5. Google 的 Web 服务器现在发回一条 HTTP 回复，包含我们想要访问页面的内容。在大多数情况下，这个文本内容使用\
  \ HTML（一种标记语言，我们稍后会详细了解）格式化。从这一大段（通常很大）文本中，我们的 Web 浏览器可以开始渲染实际的页面，即确保所有内容按照 HTML\
  \ 内容的指示整齐地显示在屏幕上。请注意，一个网页通常包含一些内容片段，浏览器会（在后台）为其发起新的 HTTP 请求。例如，如果接收到的页面指示浏览器显示一张图片，浏览器会发起另一个\
  \ HTTP 请求来获取图片内容（该内容看起来不是 HTML 格式的文本，而只是原始的二进制数据）。因此，仅渲染一个网页就可能涉及大量的 HTTP 请求。幸运的是，现代浏览器非常智能，一旦信息到达，它们就会开始渲染页面，并在获取图片和其他视觉元素时显示它们。此外，如果可能，浏览器会尝试并行发送多个请求以加快这一过程。\n\
  \n在如此多的协议、请求和机器之间的通信中，你能够在不到一秒内查看一个简单的网页，这实在令人惊叹。为了规范构成网络的大量协议，国际标准化组织（ISO）维护着开放系统互连（OSI）模型，该模型将计算机通信组织为七个层次：\n\
  \n*   第 1 层：物理层：包含以太网协议，还包括 USB、蓝牙及其他无线协议。\n*   第 2 层：数据链路层：包含以太网协议。\n*   第 3 层：网络层：包含\
  \ IP（互联网协议）。\n*   第 4 层：传输层：包含 TCP，同时也包含像 UDP 这样的协议，UDP 为了速度不提供 TCP 那样的高级错误检查和恢复机制。\n\
  *   第 5 层：会话层：包含用于打开、关闭和管理会话的协议。\n*   第 6 层：表示层：包含用于格式化和转换数据的协议。\n*   第 7 层：应用层：例如\
  \ HTTP 和 DNS。\n\n并非所有网络通信都需要使用所有这些层的协议。例如，请求一个网页会涉及第 1 层（物理层）、第 2 层（以太网）、第 3 层（IP）、第\
  \ 4 层（TCP）和第 7 层（HTTP），但这些层的设计使得位于较高层的每个协议都可以包含在较低层协议的消息中。例如，当你请求一个安全网页时，HTTP 消息（第\
  \ 7 层）将被编码为加密消息（第 6 层）（这就是你访问“https”地址时发生的情况）。在编程网络应用程序时，你面向的层级越低，需要处理的功能和复杂性就越多。幸运的是，对于我们这些网络爬虫来说，我们关注的是最顶层，即\
  \ HTTP，这是用于请求和接收网页的协议。这意味着我们可以将涉及 TCP、IP、以太网甚至使用 DNS 解析域名的所有复杂性留给所使用的 Python 库以及底层操作系统去处理。\n\
  \n\n\n### 2.2 超文本传输协议：HTTP\n\n现在我们已经了解了你的网页浏览器是如何与世界 Wide Web 上的服务器通信的。这种消息交换的核心组件包括向\
  \ Web 服务器发送一个超文本传输协议（HTTP）请求消息，然后接收一个可以被浏览器渲染的 `HTTP` 响应（也常被称为 `HTTP` 回复）。由于我们的所有网络爬取都将基于\
  \ `HTTP`，我们确实需要更仔细地研究 `HTTP` 消息，以了解它们的样子。\n\n实际上，`HTTP` 是一种相当简单的网络协议。它是基于文本的，这至少使其消息对最终用户具有一定可读性（相比于没有任何文本结构的原始二进制消息），并且遵循一种简单的基于请求-回复的通信模式。也就是说，联系一个\
  \ Web 服务器并接收回复仅涉及两条 `HTTP` 消息：一个请求和一个回复。如果你的浏览器想要下载或获取额外的资源（如图片），这仅仅意味着要发送额外的请求-回复消息。\n\
  \n**保持连接**\n\n在最简单的情况下，`HTTP` 中的每个请求-回复周期也涉及建立一个全新的底层 `TCP` 连接。对于流量较大的网站，快速连续地建立和拆除许多\
  \ `TCP` 连接会造成大量开销，因此 `HTTP` 版本 1.1 允许我们保持 `TCP` 连接“活跃”，以用于并发的请求-回复 `HTTP` 消息。`HTTP`\
  \ 版本 2.0 甚至允许我们在同一连接中进行“多路复用”（一个表示“混合消息”的复杂词汇），例如，发送多个并发请求。幸运的是，在使用 `Python` 时，我们无需过多关注这些细节，因为我们将要使用的\
  \ `requests` 库会在后台自动为我们处理这些。\n\n现在让我们来看看一个 `HTTP` 请求和回复是什么样子的。正如我们所知道的，客户端（大多数情况下是\
  \ Web 浏览器）和 Web 服务器通过发送纯文本消息进行通信。客户端向服务器发送请求，服务器则发送响应或回复。\n\n一条请求消息由以下几部分组成：\n\n\
  *   一个请求行；\n*   若干请求头部，每个占一行；\n*   一个空行；\n*   一个可选的、可能占用多行的消息体。\n\n`HTTP` 消息中的每一行都必须以\
  \ `<CR><LF>`（ASCII 字符 `0D` 和 `0A`）结尾。\n\n空行仅仅是 `<CR><LF>`，没有其他额外的空白字符。\n\n**换行**\n\
  \n`<CR>` 和 `<LF>` 是两个特殊字符，用于指示应开始新的一行。你并不会直接看到它们出现，但是当你在例如 `记事本` 中输入纯文本文档时，每次你按下回车键，这两个字符就会被放入文档的内容中，以表示“此处出现新的一行”。计算中一个令人烦恼的方面是，操作系统对于使用哪个字符来表示换行并未达成一致。`Linux`\
  \ 程序倾向于使用 `<LF>`（“换行”字符），而较旧版本的 `MacOS` 使用 `<CR>`（“回车”字符）。`Windows` 同时使用 `<CR>`\
  \ 和 `<LF>` 来表示换行，这也被 `HTTP` 标准所采纳。对此不必过于担心，因为 `Python` 的 `requests` 库会为我们处理 `HTTP`\
  \ 消息的正确格式化。\n\n下面的代码片段显示了 Web 浏览器执行的一条完整 `HTTP` 请求消息（我们不在每一行后面显示“`<CR><LF>`”，除了最后一行空行）：\n\
  \n```\nGET / HTTP/1.1\nHost: example.com\nConnection: keep-alive\nCache-Control:\
  \ max-age=0\nUpgrade-Insecure-Requests: 1\nUser-Agent: Mozilla/5.0 (Windows NT 10.0;\
  \ Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/60.0.3112.90 Safari/537.36\n\
  Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\nReferer:\
  \ https://www.google.com/\nAccept-Encoding: gzip, deflate\nAccept-Language: en-US,en;q=0.8,nl;q=0.6\n\
  \n```\n\n让我们仔细看看这条消息。“`GET / HTTP/1.1`” 是请求行。它包含了我们想要执行的 `HTTP` “动词”或“方法”（上面的例子中是“`GET`”）、我们想要获取的\
  \ `URL`（“`/`”）以及我们理解的 `HTTP` 版本（“`HTTP/1.1`”）。不必太担心“`GET`”动词。`HTTP` 有多个动词（我们稍后会讨论）。目前，重要的是要知道“`GET`”的意思是：“为我获取这个\
  \ `URL` 的内容。”每当你在地址栏输入一个 `URL` 并按下回车键时，你的浏览器都会执行一个 `GET` 请求。\n\n接下来是请求头部，每个占一行。在这个例子中，我们已经有了不少头部。请注意，每个头部都包含一个名称（例如“`Host`”），后面跟着一个冒号（“`:`”），以及头部的实际值（“`example.com`”）。浏览器在其头部中包含的内容方面非常“话多”，而\
  \ `Chrome`（这里使用的 Web 浏览器）也不例外。\n\n`HTTP` 标准包含一些标准化的头部，这些头部会被正规的 Web 浏览器所使用，不过你也可以自由地包含额外的头部。例如，“`Host`”是\
  \ `HTTP` 1.1 及更高版本中标准化且强制性的头部。它在 `HTTP` 1.0（第一个版本）中不存在的原因很简单：在那个时代，每个 Web 服务器（及其\
  \ `IP` 地址）负责提供一个特定的网站。因此，如果我们向负责“`example.com`”的 Web 服务器发送“`GET / HTTP/1.1`”，服务器就知道要获取并返回哪个页面。然而，不久就出现了这样一个聪明的主意：为什么不在同一个服务器上（使用同一个\
  \ `IP` 地址）托管多个网站呢？例如，负责“`example.com`”的同一台服务器可能也负责提供属于“`example.org`”的页面。但是，我们需要一种方式来告诉服务器我们希望从哪个域名获取页面。在请求行中包含域名，例如“`GET\
  \ example.org/ HTTP/1.1`”，可能是一个不错的想法，但这会破坏与早期 Web 服务器的向后兼容性，这些服务器期望请求行中包含一个没有域名的\
  \ `URL`。于是，解决方案以强制性“`Host`”头部的形式出现，指示服务器应从哪个域名获取页面。\n\n**错误的主机**\n\n不要试图自作聪明，向负责“`example.com`”的\
  \ Web 服务器发送请求，并将“`Host`”头部改为“`Host: somethingentirely-different.com`”。正规的 Web 服务器会报错，并简单地返回一个错误页面，提示：“嘿，我不是托管该域名的服务器。”话虽如此，在那些可以通过欺骗此头部来混淆和误导访问的网站上，已经发现了安全问题。\n\
  \n除了强制性的“`Host`”头部，我们还看到许多其他头部出现，它们构成了一组“标准化的请求头部”，这些头部虽然非强制性，但所有现代 Web 浏览器都会包含。例如，“`Connection:\
  \ keep-alive`”向服务器示意，如果可能的话，它应该保持连接打开以用于后续请求。“`User-Agent`”包含一个很长的文本值，浏览器通过它愉快地告知服务器自己是什么（`Chrome`）以及运行的版本。\n\
  \n**User-Agent 的混乱**\n\n\n\n#### HTTP 请求与响应详解\n\n##### User-Agent 头部的历史遗留问题\n\n\
  你可能会注意到，“User-Agent”头部中包含了“Chrome”，同时也包含了许多看似不相关的额外文本，例如“Mozilla”、“AppleWebKit”等等。难道是\
  \ Chrome 在伪装自己，冒充其他浏览器吗？在某种程度上确实如此，但它并不是唯一这么做的浏览器。问题在于：当“User-Agent”头部出现，浏览器开始发送自己的名称和版本号时，一些网站所有者认为检查这个头部并根据请求的浏览器返回不同版本的页面是个好主意，例如告知用户“该服务器不支持\
  \ Netscape 4.0”。负责这些检查的例程通常实现得很草率，因此会错误地将运行未知浏览器的用户拒之门外，或者无法正确检查浏览器的版本。因此，多年来，浏览器供应商别无选择，只能发挥创意，在`User-Agent`头部中包含许多其他文本字段。基本上，我们的浏览器是在说：“我是\
  \ Chrome，但我也与所有这些其他浏览器兼容，所以请让我通过。”\n\n##### 其他请求头部\n\n`Accept`头部告诉服务器浏览器更希望返回哪种形式的内容，`Accept-Encoding`头部告诉服务器浏览器也能接收压缩后的内容。`Referer`头部（其拼写错误是故意的）告诉服务器浏览器是从哪个页面访问过来的（在这个例子中，是点击了“google.com”上的一个链接，将浏览器带到了“example.com”）。\n\
  \n##### 礼貌的请求\n\n尽管你的网络浏览器会尽量表现得礼貌，例如告诉网络服务器它接受哪些形式的内容，但没有任何保证网络服务器会真正查看这些头部或遵循它们。浏览器可能在其`Accept`头部中表明它理解“webp”图像，但网络服务器可以忽略这个请求，仍然以“jpg”或“png”格式返回图像。将这些请求头部视为礼貌的请求即可，仅此而已。\n\
  \n最后，我们的请求消息以一个空白的 `<CR><LF>` 行结束，并且没有消息体。`GET`请求中不包含这些，但我们稍后会看到 HTTP 消息中消息体会发挥作用的情况。\n\
  \n##### HTTP 响应\n\n如果一切顺利，网络服务器会处理我们的请求并返回一个 HTTP 回复。\n\n这些回复看起来与 HTTP 请求非常相似，并包含：\n\
  \n*   一个状态行，包含状态码和状态消息；\n*   一些响应头部，同样每行一个；\n*   一个空行；\n*   一个可选的响应体。\n\n因此，针对我们上面的请求，我们可能会得到如下响应：\n\
  \n```\nHTTP/1.1 200 OK\nConnection: keep-alive\nContent-Encoding: gzip\nContent-Type:\
  \ text/html;charset=utf-8\nDate: Mon, 28 Aug 2017 10:57:42 GMT\nServer: Apache v1.3\n\
  Vary: Accept-Encoding\nTransfer-Encoding: chunked\n\nWelcome to My Web Page\n\n\
  ```\n\n同样，让我们逐行看一下 HTTP 回复。第一行指示请求的状态结果。它以列出服务器理解的 HTTP 版本（`HTTP/1.1`）开头，后面跟着一个状态码（`200`）和一个状态消息（`OK`）。如果一切顺利，状态码将是`200`。有许多约定俗成的\
  \ HTTP 状态码，我们稍后会详细查看，但你很可能也熟悉`404`状态消息，它表示请求中列出的 URL 无法被检索，即该页面在服务器上“未找到”。\n\n接下来——同样地——是一些头部，这次来自服务器。就像浏览器一样，服务器在提供信息方面也可能相当健谈，并且可以包含任意多的头部。在这里，服务器在其头部中包含了当前日期和版本（`Apache\
  \ v1.3`）。另一个重要的头部是`Content-Type`，因为它会向浏览器提供回复中包含的内容类型信息。这里，内容是 HTML 文本，但也可能是二进制图像数据、电影数据等等。\n\
  \n在头部之后是一个空白的 `<CR><LF>` 行，以及可选的响应体，包含了回复的实际内容。这里的内容是一段 HTML 文本，包含“Welcome to My\
  \ Web Page。”这个 HTML 内容随后将由你的网络浏览器解析并显示在屏幕上。同样，响应体是可选的，但由于我们期望大多数请求实际上都会返回一些内容，因此在几乎所有情况下都会存在响应体。\n\
  \n##### 响应体\n\n例如，即使回复的状态码是`404`，许多网站也会包含一个响应体，为用户提供一个美观的页面，指出——抱歉——找不到这个页面。如果服务器省略了它，网络浏览器就会显示其默认的“页面未找到”页面。还有其他一些情况，HTTP\
  \ 回复不包含响应体，我们稍后会提及。\n\n\n\n### 2.3 Python 中的 HTTP：Requests 库\n\n我们已经了解了 HTTP 的基础知识，现在该动手写一些\
  \ Python 代码了。回顾一下网络爬虫的主要目的：以自动化方式从网络获取数据。基本上，我们要抛弃网页浏览器，转而使用 Python 程序来浏览网页。这意味着我们的\
  \ Python 程序需要能够使用并理解 HTTP。\n\n当然，我们完全可以尝试在 Python（或其他语言）内置的标准网络功能基础上自行编程实现，确保我们能正确地格式化\
  \ HTTP 请求消息并解析传入的响应。然而，我们并不想重复造轮子，而且已经有很多 Python 库可以让这项任务变得更加轻松愉快，这样我们就能专注于真正要完成的目标。\n\
  \n事实上，Python 生态系统中相当多的库可以为我们处理 HTTP。仅举几例：\n\n*   Python 3 自带一个名为 `urllib` 的内置模块，可以处理所有\
  \ HTTP 相关事务（参见 [`docs.python.org/3/library/urllib.html`](https://docs.python.org/3/library/urllib.html)）。与\
  \ Python 2 中的对应模块相比，该模块进行了大幅修订，在 Python 2 中，HTTP 功能分散在 `urllib` 和 `urllib2` 两个模块中，使用起来有些繁琐。\n\
  *   `httplib2`（参见 [`github.com/httplib2/httplib2`](https://github.com/httplib2/httplib2)）：一个小巧、快速的\
  \ HTTP 客户端库。最初由 Google 员工 Joe Gregorio 开发，现已由社区支持。\n*   `urllib3`（参见 [`urllib3.readthedocs.io/`](https://urllib3.readthedocs.io/)）：一个功能强大的\
  \ Python HTTP 客户端，被下面的 `requests` 库所使用。\n*   `requests`（参见 [`docs.python-requests.org/`](http://docs.python-requests.org/)）：一个优雅简洁的\
  \ Python HTTP 库，专为\"人类\"而构建。\n*   `grequests`（参见 [`pypi.python.org/pypi/grequests`](https://pypi.python.org/pypi/grequests)）：扩展了\
  \ `requests` 以处理异步、并发的 HTTP 请求。\n*   `aiohttp`（参见 [`aiohttp.readthedocs.io/`](http://aiohttp.readthedocs.io/)）：另一个专注于异步\
  \ HTTP 的库。\n\n在本书中，我们将使用 `requests` 库来处理 HTTP。原因很简单：尽管 `urllib` 提供了可靠的 HTTP 功能（尤其是与\
  \ Python 2 中的情况相比），但使用它通常需要编写大量样板代码，使得该模块使用起来不那么令人愉悦，并且可读性也不佳。与 `urllib` 相比，`urllib3`（不属于标准\
  \ Python 模块）通过一些高级特性扩展了 Python 在处理 HTTP 方面的生态系统，但它同样没有真正专注于优雅或简洁。这正是 `requests`\
  \ 的用武之地。这个库构建于 `urllib3` 之上，但它允许你用简短、美观且易于使用的代码来处理大多数 HTTP 使用场景。`grequests` 和 `aiohttp`\
  \ 则更偏向现代化，旨在让 Python 中的 HTTP 处理更加异步化。这对于那些需要尽可能快速地发出大量 HTTP 请求的重度应用程序尤其重要。在接下来的内容中，我们将坚持使用\
  \ `requests`，因为异步编程本身就是一个颇具挑战性的主题，我们将讨论以更稳健的方式加速网络爬虫程序的传统方法。如果你日后希望从 `requests`\
  \ 转向 `grequests` 或 `aiohttp`（或其他库），应该也不会有太大困难。\n\n通过 `pip` 可以轻松安装 `requests`（如果你还需要安装\
  \ Python 3 和 `pip`，请回顾第 1.2.1 节）。在命令行窗口中执行以下命令（`-U` 参数将确保更新已存在的 `requests` 版本，如果有的话）：\n\
  \n```\npip install -U requests\n```\n\n接下来，创建一个 Python 文件（`firstexample.py` 是个好名字），并输入以下内容：\n\
  \n```\nimport requests\nurl = 'http://www.webscrapingfordatascience.com/basichttp/'\n\
  r = requests.get(url)\nprint(r.text)\n```\n\n如果一切顺利，执行此脚本时，你应该会看到如下一行输出：\n\n```\n\
  Hello from the web!\n```\n\n#### Webscrapingfordatascience Dot Com？\n\n[`www.webscrapingfordatascience.com`](http://www.webscrapingfordatascience.com)\
  \ 是本书的配套网站。在本书中，我们将使用该网站上的页面来展示各种示例。鉴于网络世界瞬息万变，我们希望确保所提供的示例能够尽可能长久地正常工作。暂时停留在\"\
  安全游乐场\"里不用太沮丧，因为最后一章也包含了各种真实世界的例子。\n\n让我们看看这个简短示例中发生了什么：\n\n*   首先，我们导入了 `requests`\
  \ 模块。如果你已经在系统上正确安装了 `requests`，那么 import 这一行应该能正常工作，不会出现任何错误或警告。\n*   我们将检索 [`http://www.webscrapingfordatascience.com/basichttp/`](http://www.webscrapingfordatascience.com/basichttp/)\
  \ 的内容。尝试在浏览器中打开这个网页。你会看到页面上显示\"Hello from the web!\"。这就是我们想要用 Python 提取的内容。\n* \
  \  我们使用 `requests.get` 方法向提供的 URL 执行\"HTTP GET\"请求。在最简单的情况下，我们只需要提供想要检索的页面的 URL。Requests\
  \ 会根据我们之前看到的内容，确保格式化一个正确的 HTTP 请求消息。\n*   `requests.get` 方法返回一个 `requests.Response`\
  \ Python 对象，其中包含关于接收到的 HTTP 回应的许多信息。同样地，`requests` 负责解析 HTTP 回应，以便你可以立即开始使用它。\n\
  *   `r.text` 以文本形式包含 HTTP 回应内容体。在这里，HTTP 回应体只简单地包含了内容\"Hello from the web!\"\n\n\
  #### 更通用的请求\n\n由于（目前）我们只处理 HTTP GET 请求，`requests.get` 方法将成为后续示例的基石。稍后，我们还会处理其他类型的\
  \ HTTP 请求，比如 POST。这些请求类型在 `requests` 中都有对应的方法，例如 `requests.post`。还有一个通用的请求方法，看起来像这样：`requests.request('GET',\
  \ url)`。虽然写起来稍微长一点，但在你事先不知道要发起哪种类型的 HTTP 请求（GET 或其他）的情况下，它可能会派上用场。\n\n让我们进一步扩展这个示例，看看底层发生了什么：\n\
  \n```\nimport requests\nurl = 'http://www.webscrapingfordatascience.com/basichttp/'\n\
  r = requests.get(url)\n##### 我们从服务器获取到的 HTTP 状态码是什么？\nprint(r.status_code)\n#####\
  \ 文本形式的状态码是什么？\nprint(r.reason)\n##### HTTP 响应头是什么？\nprint(r.headers)\n##### 请求信息被保存为\
  \ r.request 中的一个 Python 对象：\nprint(r.request)\n##### HTTP 请求头是什么？\nprint(r.request.headers)\n\
  ##### HTTP 响应内容：\nprint(r.text)\n```\n\n如果你运行这段代码，将会看到以下结果：\n\n\n\n*   回顾我们之前关于\
  \ HTTP 请求和响应的讨论。通过使用`request.Response`对象的`status_code`和`reason`属性，我们可以从服务器获取 HTTP\
  \ 状态码和相关的文本消息。在这里，状态码和消息为“`200 OK`”，表示一切正常。\n*   `request.Response`对象的`headers`属性返回一个字典，其中包含服务器在其\
  \ HTTP 回复中包含的标头。再次强调：服务器可能相当健谈。本服务器报告了其数据、服务器版本，并提供了“`Content-Type`”标头。\n*   要获取有关已发出的\
  \ HTTP 请求的信息，你可以访问`request.Response`对象的`request`属性。该属性本身是一个`request.Request`对象，包含了关于所准备的\
  \ HTTP 请求的信息。\n*   由于 HTTP 请求消息也包含标头，我们也可以访问此对象的`headers`属性，以获取一个表示`requests`库所包含标头的字典。请注意，`requests`库默认会礼貌地报告其“`User-Agent`”。此外，`requests`库还可以自动处理压缩页面，因此它还包含一个“`Accept-Encoding`”标头来标识这一点。最后，它包含一个“`Accept`”标头，表示“你可以发回任何格式的内容”，并且也能处理“`keep-alive`”连接。不过，在后面我们将会看到需要覆盖`requests`库默认请求标头行为的情况。\n\
  \n```\nOK\n{'Date': 'Wed, 04 Oct 2017 08:26:03 GMT',\n'Server': 'Apache/2.4.18 (Ubuntu)',\n\
  'Content-Length': '20',\n'Keep-Alive': 'timeout=5, max=99',\n'Connection': 'Keep-Alive',\n\
  'Content-Type': 'text/html; charset=UTF-8'}\n\n{'User-Agent': 'python-requests/2.18.4',\n\
  'Accept-Encoding': 'gzip, deflate',\n'Accept': '*/*',\n'Connection': 'keep-alive'}\n\
  Hello from the web!\n```\n\n#### 查询字符串：带参数的 URL\n\n关于 HTTP 的基本工作原理，还有一点我们需要讨论：URL\
  \ 参数。尝试修改上面的代码示例，以抓取 URL `http://www.webscrapingfordatascience.com/paramhttp/`。你应该会得到以下内容：\n\
  \n```\nPlease provide a \"query\" parameter\n```\n\n尝试在你的网页浏览器中打开此页面，以验证你得到相同的结果。现在尝试导航到页面`http://www.webscrapingfordatascience.com/paramhttp/?query=test`。你看到了什么？\n\
  \nURL 中可选的“`?`...”部分被称为“查询字符串”，它旨在包含不适合 URL 正常层次路径结构的数据。你在浏览网页时很可能多次遇到过这种类型的 URL，例如：\n\
  \n*   `http://www.example.com/product_page.html?product_id=304`\n*   `https://www.google.com/search?dcr=0&source=hp&q=test&oq=test`\n\
  *   `http://example.com/path/to/page/?type=animal&location=asia`\n\nWeb 服务器是智能的软件。当服务器收到针对此类\
  \ URL 的 HTTP 请求时，它可能会运行一个程序，该程序使用查询字符串中包含的参数（即“URL 参数”）来呈现不同的内容。例如，对比`http://www.webscrapingfordatascience.com/paramhttp/?query=test`与`http://www.webscrapingfordatascience.com/paramhttp/?query=anothertest`。即使对于这个简单的页面，你也能看到响应如何动态地合并你在\
  \ URL 中提供的参数数据。\n\nURL 中的查询字符串应遵循以下约定：\n\n*   查询字符串位于 URL 的末尾，以一个问号“`?`”开头。\n* \
  \  参数以键值对的形式提供，并用“`&`”符号分隔。\n*   键和值使用等号“`=`”分隔。\n*   由于某些字符不能作为 URL 的一部分，或者具有特殊含义（例如字符“`/`”、“`?`”、“`&`”和“`=`”），因此在\
  \ URL 中使用这些字符时，需要应用 URL“编码”来正确格式化它们。尝试使用 URL `http://www.webscrapingfordatascience.com/paramhttp/?query=another%20test%3F%26`\
  \ 进行测试，该 URL 以编码形式将“`another test?&`”作为“`query`”参数的值发送给服务器。\n*   其他确切的语义并未标准化。通常，Web\
  \ 服务器不会考虑 URL 参数的指定顺序，但有些服务器可能会考虑。许多 Web 服务器也能够处理并使用不带值的 URL 参数页面，例如，`http://www.example.com/?noparam=&anotherparam`。由于完整的\
  \ URL 包含在 HTTP 请求的请求行中，Web 服务器可以决定如何解析和处理这些内容。\n\n#### URL 重写\n\n\n\n##### URL 参数与编码\n\
  \n上述说明也凸显了 URL 参数的另一个重要方面：尽管它们有一定标准化程度，但并未被视为 URL 的“特殊”部分，在 HTTP 请求中仅以纯文本行形式发送。大多数\
  \ Web 服务器会在其端解析这些参数，以便在渲染页面时使用其中的信息（甚至可能在未使用时忽略它们——例如，尝试访问 URL [`http://www.webscrapingfordatascience.com/paramhttp/?query=test`\
  \ `&` `other=ignored`](http://www.webscrapingfordatascience.com/paramhttp/%3Fquery=test&other=ignored)），但近年来，URL\
  \ 参数的使用正在逐渐被避免。取而代之的是，大多数 Web 框架允许我们定义“美观的”URL，这些 URL 仅将参数包含在路径中，例如，`/product/302/`\
  \ 而非 `products.html?p=302`。前者对用户而言在查看 URL 时更美观，同时搜索引擎优化（SEO）专家也会告诉你，搜索引擎更青睐此类 URL。从服务器端来看，任何传入的\
  \ URL 都可被随意解析，从中提取片段并进行所谓的“重写”，因此某些部分可能最终在准备响应时被用作输入。对于我们这些网络爬虫开发者而言，这基本上意味着即使你在\
  \ URL 中看不到查询字符串，URL 中仍可能存在动态部分，服务器会根据这些部分以不同方式响应。\n\n让我们看看如何在 `requests` 中处理 URL\
  \ 参数。最简单的处理方法是直接将它们包含在 URL 中：\n\n```python\nimport requests\nurl = 'http://www.webscrapingfordatascience.com/paramhttp/?query=test'\n\
  r = requests.get(url)\nprint(r.text)\n##### 将显示：I don't have any information on\
  \ \"test\"\n```\n\n在某些情况下，`requests` 会尝试帮助你编码一些字符：\n\n```python\nimport requests\n\
  url = 'http://www.webscrapingfordatascience.com/paramhttp/?query=a query with spaces'\n\
  r = requests.get(url)\n##### 参数将被编码为 'a%20query%20with%20spaces'\n##### 你可以通过查看准备好的请求\
  \ URL 来验证：\nprint(r.request.url)\n##### 将显示 [...]/paramhttp/?query=a%20query%20with%20spaces\n\
  print(r.text)\n##### 将显示：I don't have any information on \"a query with spaces\"\
  \n```\n\n然而，有时 URL 对于 `requests` 来说过于模糊，难以解析：\n\n```python\nimport requests\nurl\
  \ = 'http://www.webscrapingfordatascience.com/paramhttp/?query=complex?&'\n#####\
  \ 参数不会被编码\nr = requests.get(url)\n##### 你可以通过查看准备好的请求 URL 来验证：\nprint(r.request.url)\n\
  ##### 将显示 [...]/paramhttp/?query=complex?&\nprint(r.text)\n##### 将显示：I don't have\
  \ any information on \"complex?\"\n```\n\n在这种情况下，`requests` 不确定你是想让 `?&` 按原样属于实际\
  \ URL，还是想对其进行编码。因此，`requests` 不会做任何处理，直接按原样请求该 URL。在服务器端，这个特定的 Web 服务器能够判断出第二个问号（`?`）应该是\
  \ URL 参数的一部分（并且本应正确编码，但它不会报错），不过在这种情况下，`&` 符号过于模糊。此 Web 服务器会假定它是一个常规分隔符，而非 URL 参数值的一部分。\n\
  \n#### 正确解决编码问题\n\n那么，我们该如何正确解决这个问题呢？第一种方法是使用 `urllib.parse` 模块的 `quote` 和 `quote_plus`\
  \ 函数。前者用于编码 URL 路径部分的特殊字符，使用百分号 `%XX` 编码对特殊字符（包括空格）进行编码。后者执行类似的操作，但将空格替换为加号，通常用于编码查询字符串：\n\
  \n```python\nimport requests\nfrom urllib.parse import quote, quote_plus\nraw_string\
  \ = 'a query with /, spaces and?&'\nprint(quote(raw_string))\nprint(quote_plus(raw_string))\n\
  ```\n\n此示例将输出以下两行内容：\n\n```\na%20query%20with%20/%2C%20spaces%20and%3F%26\na+query+with+%2F%2C+spaces+and%3F%26\n\
  ```\n\n`quote` 函数应用百分号编码，但保留斜杠（`/`）不变（至少默认情况下如此），因为此函数旨在用于 URL 路径。`quote_plus` 函数应用类似的编码，但使用加号（`+`）编码空格，并且也会编码斜杠。只要我们确保查询参数不使用斜杠，这两种编码方法都可以用于编码查询字符串。如果我们的查询字符串确实包含斜杠，并且我们仍想使用\
  \ `quote`，只需按如下方式覆盖其 `safe` 参数即可：\n\n```python\nimport requests\nfrom urllib.parse\
  \ import quote, quote_plus\nraw_string = 'a query with /, spaces and?&'\nurl = 'http://www.webscrapingfordatascience.com/paramhttp/?query='\n\
  print('\\n 使用 quote:')\n##### 没有安全字符，连 '/' 字符也编码，所以编码所有内容\nr = requests.get(url\
  \ + quote(raw_string, safe=''))\nprint(r.url)\nprint(r.text)\nprint('\\n 使用 quote_plus:')\n\
  r = requests.get(url + quote_plus(raw_string))\nprint(r.url)\nprint(r.text)\n```\n\
  \n此示例将输出：\n\n```\n使用 quote:\nhttp://[...]/?query=a%20query%20with%20%2F%2C%20spaces%20and%3F%26\n\
  I don't have any information on \"a query with /, spaces and?&\"\n使用 quote_plus:\n\
  http://[...]/?query=a+query+with+%2F%2C+spaces+and%3F%26\nI don't have any information\
  \ on \"a query with /, spaces and?&\"\n```\n\n所有这些编码操作很容易让人头疼。难道 `requests` 不应该让我们更轻松地处理这些吗？别担心，我们可以按如下方式仅使用\
  \ `requests` 重写上述示例：\n\n```python\nimport requests\nurl = 'http://www.webscrapingfordatascience.com/paramhttp/'\n\
  parameters = {\n'query': 'a query with /, spaces and?&'\n}\nr = requests.get(url,\
  \ params=parameters)\nprint(r.url)\nprint(r.text)\n```\n\n请注意 `requests.get` 方法中\
  \ `params` 参数的用法：你可以直接传入一个包含未编码 URL 参数的 Python 字典，`requests` 将负责为你编码它们。\n\n####\
  \ 空参数与有序参数\n\n空参数，例如 `params={'query': ''}`，最终会在 URL 中包含一个等号，即 `?query=`。如果需要，你也可以向\
  \ `params` 传递一个列表，其中每个元素本身是由两个元素组成的元组或列表，分别表示每个参数的键和值，此时列表的顺序将被保留。你也可以传递一个 `OrderedDict`\
  \ 对象（Python 3 中 `collections` 模块提供的内置对象），该对象会保留顺序。最后，你还可以传递一个表示查询字符串部分的字符串。在这种情况下，`requests`\
  \ 会为你添加问号（`?`），但同样无法提供智能的 URL 编码，因此你需要自己确保查询字符串编码正确。尽管这并不常用，但在 Web 服务器期望 `?param`\
  \ 末尾没有等号的情况下，这可能会派上用场——这种情况在实践中很少发生，但确实存在。\n\n#### 完全禁用 `requests` 的编码\n\n即使向 `params`\
  \ 传递字符串，或在 `requests.get` 方法中包含完整的 URL，`requests` 仍然会尝试提供一些帮助，正如我们所见。例如，编写以下代码：\n\
  \n```python\nrequests.get('http://www.example.com/?spaces |pipe')\n```\n\n会导致请求\
  \ URL 中的查询字符串变为 `?spaces%20%7Cpipe`，其中的空格和竖线（`|`）字符已被自动编码。在极少数情况下，非常挑剔的 Web 服务器可能期望接收未经编码的\
  \ URL。同样，这种情况极为罕见，但我们确实在实际应用中遇到过此类情况。此时，你需要按以下方式覆盖 `requests` 的行为。\n\n\n\n```python\n\
  import requests\nfrom urllib.parse import unquote\n\nclass NonEncodedSession(requests.Session):\n\
  \    # 重写默认的 send 方法\n    def send(self, *a, **kw):\n        # 撤销已应用的编码\n      \
  \  a[0].url = unquote(a[0].url)\n        return requests.Session.send(self, *a,\
  \ **kw)\n\nmy_requests = NonEncodedSession()\nurl = 'http://www.example.com/?spaces\
  \ |pipe'\nr = my_requests.get(url)\nprint(r.url)\n##### 将显示：http://www.example.com/?spaces\
  \ |pipe\n```\n\n作为最后的练习，请访问 [`http://www.webscrapingfordatascience.com/calchttp/`](http://www.webscrapingfordatascience.com/calchttp/)。尝试调整其中的\
  \ “a”、“b” 和 “op” URL 参数。你应该能弄清楚以下代码的功能：\n\n```python\nimport requests\n\ndef calc(a,\
  \ b, op):\n    url = 'http://www.webscrapingfordatascience.com/calchttp/'\n    params\
  \ = {'a': a, 'b': b, 'op': op}\n    r = requests.get(url, params=params)\n    return\
  \ r.text\n\nprint(calc(4, 6, '*'))\nprint(calc(4, 6, '/'))\n```\n\n基于以上所学，你可能已经跃跃欲试，想用真实网站来实践所学内容了。但在真正面向网络之前，我们还需要克服另一个障碍。例如，当你运行以下代码时会发生什么：\n\
  \n```python\nimport requests\nurl = 'https://en.wikipedia.org/w/index.php' + \\\n\
  \      '?title=List_of_Game_of_Thrones_episodes&oldid=802553687'\nr = requests.get(url)\n\
  print(r.text)\n```\n\n#### Wikipedia 版本控制\n\n我们在这里使用了 `oldid` URL 参数，以便获取《权力的游戏》剧集列表页面的特定版本，确保后续示例能够正常运行。顺便提一下，这里你可以看到“URL\
  \ 重写”的实际应用：<https://en.wikipedia.org/wiki/List_of_Game_of_Thrones_episodes> 和 <https://en.wikipedia.org/w/index.php?title=List_of_Game_of_Thrones_episodes>\
  \ 这两个地址指向完全相同的页面。区别在于后者使用了 URL 参数，而前者没有，不过 Wikipedia 的 Web 服务器足够智能，能够将 URL 路由到正确的“页面”。另外，你可能注意到这里我们没有使用\
  \ `params` 参数。虽然也可以使用，但这里的 “title” 和 “oldid” 参数都不需要编码，因此我们可以直接将它们放入 URL 中，以保持其余代码更简洁。\n\
  \n如你所见，通过 `r.text` 捕获的响应体现在输出了一大堆看似混乱的文本。这是 HTML 格式的文本，尽管我们要找的内容就埋藏在这锅“汤”里，但我们需要学习一种恰当的方法来从中提取我们想要的信息。这正是我们在下一章要做的事情。\n\
  \n#### 片段标识符\n\n除了查询字符串之外，URL 其实还有另一个你可能遇到过的可选部分：片段标识符，有时也被称为“哈希”。它由井号（`#`）引导，位于\
  \ URL 的最末尾，甚至排在查询字符串之后，例如：“`http://www.example.org/about.htm?p=8#contact`”。URL 的这一部分用于标识与\
  \ URL 对应的文档中的某个部分。例如，一个网页可以包含带有片段标识符的链接，点击后页面会立即滚动到该链接对应的位置。然而，片段标识符的功能与 URL 的其他部分不同，它完全由\
  \ Web 浏览器处理，Web 服务器完全不参与。事实上，规范的 Web 浏览器在向 Web 服务器请求资源时，甚至不应该在 HTTP 请求中包含片段标识符。相反，浏览器会等待\
  \ Web 服务器发送响应，然后使用片段标识符滚动到页面的正确位置。如果你在请求 URL 中包含片段标识符，大多数 Web 服务器会直接忽略它，尽管有些服务器可能被编程为也会考虑它们。再次强调：这种情况相当罕见，因为如果服务器提供的内容依赖于片段标识符，大多数\
  \ Web 浏览器将无法正常显示，因为它们会在请求中省略片段标识符部分——不过，网络世界中充满了各种有趣的边缘情况。\n\n现在我们已经了解了 `requests`\
  \ 库的基础知识。请花些时间探索该库的文档，地址是 [`docs.python-requests.org/en/master/`](http://docs.python-requests.org/en/master/)。`requests`\
  \ 文档的质量非常高，一旦你在项目中开始使用这个库，查阅它会非常方便。\n\n## 3. 搅拌 HTML 与 CSS 这锅“汤”\n\n到目前为止，我们已经讨论了\
  \ HTTP 的基础知识，以及如何使用 `requests` 库在 Python 中执行 HTTP 请求。然而，由于大多数网页都使用超文本标记语言（HTML）进行格式化，我们需要了解如何从这些页面中提取信息。因此，本章将介绍\
  \ HTML，以及用于格式化和美化现代网页的另一个核心构建块：层叠样式表（CSS）。随后，本章将讨论 Beautiful Soup 库，它将帮助我们理清 HTML\
  \ 和 CSS 这锅“汤”。\n\n\n\n### 3.1 超文本标记语言：HTML\n\n在前一章中，我们介绍了 HTTP 的基础知识，并了解了如何使用 Python\
  \ 的 `requests` 库执行 HTTP 请求，但目前我们需要找到一种解析 HTML 内容的方法。回想一下我们在上一章结尾处提到的小型维基百科示例，以及从中获取到的混乱的\
  \ HTML 内容：\n\n```\nimport requests\nurl = 'https://en.wikipedia.org/w/index.php'\
  \ + \\\n'?title=List_of_Game_of_Thrones_episodes&oldid=802553687'\nr = requests.get(url)\n\
  print(r.text)\n```\n\n也许你曾尝试用其他你喜欢的网站来运行这个示例……无论如何，一旦你开始更深入地了解网络的工作原理，并实际开始进行网页抓取时，你无疑会开始惊叹于你的网页浏览器为你做的所有事情：获取网页；将这种“混乱内容”转换成格式精美的页面，包括图片、动画、样式、视频等等。此时，你可能会感到非常畏惧——我们当然不必从头开始复制网页浏览器的所有功能吧？答案是，幸运的是，我们不需要。就像处理\
  \ HTTP 一样，我们将使用一个强大的 Python 库来帮助我们处理这一堆文本混乱。而且，与网页浏览器相反，我们并不关心获取完整的页面内容并进行渲染，而只关心提取我们感兴趣的那些部分。\n\
  \n如果你运行上面的示例，你会看到屏幕上打印出以下内容：\n\n```\nList of Game of Thrones episodes - Wikipedia\n\
  [...]\n```\n\n这就是超文本标记语言（HTML），它是用于创建网页的标准标记语言。虽然有些人会将 HTML 称为“编程语言”，但“标记语言”是更合适的术语，因为它规定了文档的结构和格式。严格来说，并不需要使用\
  \ HTML 来格式化网页——事实上，我们在上一章中处理的所有示例都只是返回简单的文本页面。然而，如果你想创建在浏览器中看起来美观的页面（哪怕只是给页面添加一些颜色），HTML\
  \ 就是你要采用的方式。\n\nHTML 提供了构建块，用于为文档提供结构和格式。这是通过一系列“标签”来实现的。HTML 标签通常成对出现，并用尖括号括起来，`\"\
  <tagname>\"` 是开始标签，`\"</tagname>\"` 表示结束标签。有些标签以不成对的形式出现，不需要结束标签。一些常用的标签如下：\n\n\
  -   `<p>...</p>` 用于包含一个段落；\n-   `<br>` 用于设置换行；\n-   `<table>...</table>` 用于开始一个表格块；其中，`<tr>...<tr/>`\
  \ 用于行；`<td>...</td>` 用于单元格；\n-   `<img>` 用于图片；\n-   `<h1>...</h1>` 到 `<h6>...</h6>`\
  \ 用于标题；\n-   `<div>...</div>` 用于表示 HTML 文档中的一个“分区”，主要用于对一组元素进行分组；\n-   `<a>...</a>`\
  \ 用于超链接；\n-   `<ul>...</ul>` 和 `<ol>...</ol>` 分别用于无序列表和有序列表；在这些列表内部，`<li>...</li>`\
  \ 用于每个列表项。\n\n标签可以相互嵌套，因此 `\"<div><p>Hello</p></div>\"` 是完全有效的，但像 `\"<div><p>Oops</div></p>\"\
  ` 这样的重叠嵌套则是不允许的。即使这不符合规范的 HTML，每个网页浏览器仍会尽最大努力尽可能好地解析和渲染 HTML 页面。如果网页浏览器要求所有网页都必须完全符合\
  \ HTML 标准格式，那么可以肯定大多数网站都无法通过。HTML 是一团乱麻。\n\n成对出现的标签含有内容。例如，`\"<a>click here</a>\"\
  ` 会在你的浏览器中将“click here”渲染成一个超链接。标签也可以有属性，这些属性放在开始标签内。例如，`\"<a href=\"http://www.google.com\"\
  >click here\"` 会在点击链接时将用户重定向到 Google 的主页。因此，`\"href\"` 属性指明了链接的网络地址。对于不成对出现的图片标签，`\"\
  src\"` 属性用于指示浏览器应获取的图片的 URL，例如 `\"<img src=\"http://www.example.com/image.jpg\"\
  \ />\"`。\n\n### 3.2 将浏览器用作开发工具\n\n如果这一切进展得有些快，不必过于担心，因为在接下来的示例中，我们会更深入地理解 HTML。在继续之前，我们想给你提供一些在构建网络爬虫时会派上用场的技巧。\n\
  \n如今，大多数现代浏览器都内置了一套强大的工具包，你可以利用它们来了解 HTML 和 HTTP 的相关情况。请在你的浏览器中再次导航到维基百科页面 `https://en.wikipedia.org/w/index.php?title=List_of_Game_of_Thrones_episodes&oldid=802553687`——我们假设你接下来使用的是谷歌\
  \ Chrome 浏览器。首先，了解如何查看此页面的底层 HTML 会很有帮助。要做到这一点，你可以右键点击页面并选择“查看源代码”，或者在谷歌 Chrome\
  \ 浏览器中直接按 Control+U。一个新的页面将会打开，其中包含当前页面的原始 HTML 内容（与我们使用 `r.text` 获取到的内容相同）；参见图\
  \ 3-1。\n\n![A463931_1_En_3_Fig1_HTML.jpg](img/A463931_1_En_3_Fig1_HTML.jpg)\n\n\
  **图 3-1**\n在 Chrome 中查看页面源代码\n\n此外，你还可以打开 Chrome 的“开发者工具”。为此，请选择浏览器窗口右上角的 Chrome\
  \ 菜单，然后选择“更多工具”、“开发者工具”，或者按 Control+Shift+I。或者，你也可以右键点击任意页面元素并选择“检查”。其他浏览器如 Firefox\
  \ 和 Microsoft Edge 也内置了类似的工具。你应该会看到一个类似图 3-2 所示的屏幕。\n\n![A463931_1_En_3_Fig2_HTML.jpg](img/A463931_1_En_3_Fig2_HTML.jpg)\n\
  \n**图 3-2**\nChrome 开发者工具窗口包含许多对网络爬虫有用的工具\n\n花些时间探索一下开发者工具面板。你的面板可能会出现在浏览器窗口的底部。如果你希望它出现在右侧，请找到带有三点冒号图标（三冒号）的菜单，并选择不同的“停靠侧边位置”。\n\
  \n开发者工具面板通过一系列标签页进行组织，其中“元素”和“网络”标签页将最为有用。\n\n让我们先来看一下网络标签页。你应该会在工具栏中看到一个红色的“录制”图标，表示\
  \ Chrome 正在跟踪网络请求（如果图标未亮起，请点击它以开始跟踪）。刷新维基百科页面，然后观察开发者工具面板中发生的情况：Chrome 开始记录它发出的所有请求，从页面本身的\
  \ HTTP 请求开始（位于顶部）。请注意，你的网页浏览器还会发出许多其他请求来实际渲染页面，其中大部分是为了获取图片数据（“类型：png”）。通过点击某个请求，你可以获取关于它的更多信息。例如，点击顶部的\
  \ `\"index.php\"` 请求，你会看到一个类似图 3-3 的屏幕。选择某个请求会打开另一个面板，其中提供了丰富的信息，既然你已经学习了 HTTP，这些信息对你来说应该已经很熟悉了。例如，确保在侧面板中选中了“标头”标签页，我们会看到诸如请求\
  \ URL、方法（动词）以及服务器返回的状态码等常规信息，同时还包含完整的请求和响应标头列表。\n\n\n\n最后，网络（Network）选项卡中有几个值得注意的实用复选框。启用“保留日志（Preserve\
  \ log）”可以防止 Chrome 在每次执行新页面请求时“清理”概览信息。当您需要跟踪浏览网站时的一系列操作时，这会非常有用。“停用缓存（Disable cache）”将阻止\
  \ Chrome 使用其“短期记忆”。Chrome 会自作聪明，如果它仍有最近页面的内容，就会避免执行请求；如果您希望强制 Chrome 实际执行每一次请求，则可以覆盖此设置。\n\
  \n![A463931_1_En_3_Fig3_HTML.jpg](img/A463931_1_En_3_Fig3_HTML.jpg)\n\n图 3-3 在 Chrome\
  \ 中检查 HTTP 请求\n\n转到“元素（Elements）”选项卡，我们看到与查看页面源代码时类似的视图，不过现在被整齐地格式化为基于树状的视图，带有可展开和折叠的小箭头，如图\
  \ 3-4 所示。\n\n此处特别有帮助的一点是，您可以将鼠标悬停在“元素”选项卡中的 HTML 标签上，Chrome 会在网页本身的对应视觉表示上显示一个透明框。这可以帮助您快速找到想要的内容片段。或者，您可以右键单击网页上的任意元素，然后按下“检查元素（Inspect\
  \ element）”以立即在“元素”选项卡中高亮显示其对应的 HTML 代码。请注意，“元素”选项卡底部的“面包屑导航（breadcrumb trail）”会显示您当前在\
  \ HTML“树”中的位置。\n\n#### 检查元素与查看源代码\n\n您可能会疑惑，既然“元素”选项卡提供了更加用户友好的替代方案，为何“查看源代码（View\
  \ source）”选项对于查看页面的原始 HTML 代码仍然有用？这里需要提醒一下：“查看源代码”选项显示的是 Web 服务器返回的 HTML 代码，并且在使用\
  \ `requests` 库时，其内容将与 `r.text` 相同。另一方面，“元素”选项卡中的视图则提供了 HTML 被 Web 浏览器解析后的“清理后”版本。例如，重叠的标签会被修正，多余的空白字符会被移除。因此，这两种视图之间可能存在细微差异。此外，“元素”选项卡提供的是动态的实时视图。网站可能包含由\
  \ Web 浏览器执行并能随意更改页面内容的脚本。因此，“元素”选项卡始终反映页面的当前状态。这些脚本是用一种名为 JavaScript 的编程语言编写的，可以在\
  \ HTML 中的 `<script>` 标签内找到。我们将在几个章节之后，更仔细地研究 JavaScript 以及它在网页抓取上下文中的重要性。\n\n![A463931_1_En_3_Fig4_HTML.jpg](img/A463931_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4 查看 Chrome 中的“元素”选项卡\n\n接下来请注意，“元素”选项卡中的任何 HTML 元素都可以右键单击。“复制（Copy）”、“复制选择器（Copy\
  \ selector）”和“复制 XPath（Copy XPath）”尤其有用，我们稍后会经常用到它们。您甚至会发现可以实时编辑 HTML 代码（网页会自我更新以反映您的编辑），不过别太把自己当成《犯罪现场调查：迈阿密》风格的黑客：这些更改当然只是本地的。它们不会对\
  \ Web 服务器本身产生任何影响，一旦您刷新页面就会消失，尽管如此，这仍是一种试验 HTML 的有趣方式。无论如何，在处理网页抓取项目时，您的 Web 浏览器将成为您最好的朋友。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n### 3.3 层叠样式表：CSS\n\
  \n在开始用 Python 处理 HTML 之前，我们需要先讨论另一项关键技术：层叠样式表（CSS）。当你在浏览器中浏览 HTML 元素时，可能已经注意到许多标签中都有一些\
  \ HTML 属性：\n\n*   `id`，用于为特定标签附加一个页面唯一的标识符；\n*   `class`，用于列出以空格分隔的一系列 CSS 类名。\n\
  \n`id` 属性对于快速获取我们感兴趣的 HTML 页面部分非常有用，而 `class` 属性则需要进一步的介绍，它与 CSS 的概念密切相关。\n\nCSS\
  \ 和 HTML 是相辅相成的。回想一下，HTML 最初被设计为定义网站结构和格式的方式。因此，在早期的网络中，经常会看到许多用于定义内容外观的 HTML 标签，例如：`<b>...</b>`\
  \ 用于粗体文本；`<i>...</i>` 用于斜体文本；`<font>...</font>` 用于更改字体系列、大小、颜色和其他字体属性。然而，过了一段时间，Web\
  \ 开发者们开始争论——这是正确的——文档的结构和格式实际上涉及两个不同的问题。这可以类比于使用 Word 这样的文字处理器编写文档。你可以直接将格式应用于文档，但更好的方法是使用样式来指示标题、列表、表格等，然后通过修改样式的定义来轻松更改它们的格式。CSS\
  \ 的工作方式类似。HTML 仍然用于定义文档的一般结构和语义，而 CSS 则控制文档应该如何被样式化，换句话说，就是决定它应该是什么样子。\n\nCSS 语言看起来与\
  \ HTML 有些不同。在 CSS 中，样式信息被写成一系列用冒号分隔的键值对语句，每个语句本身由分号分隔，如下所示：\n\n```\ncolor: 'red';\n\
  background-color: #ccc;\nfont-size: 14pt;\nborder: 2px solid yellow;\n```\n\n这些样式声明可以通过三种不同的方式包含在文档中：\n\
  \n*   在常规的 HTML “style” 属性中，例如：`<p style=\"color:'red';\">...</p>`。\n*   在 HTML\
  \ 的 `<style>...</style>` 标签内，该标签放置在页面的 `<head>` 标签中。\n*   在一个单独的文件中，然后通过页面 `<head>`\
  \ 标签内的 `<link>` 标签进行引用。这是最清晰的工作方式。当加载网页时，你的浏览器会执行额外的 HTTP 请求来下载这个 CSS 文件，并将其定义的样式应用于文档。\n\
  \n如果样式声明被放在 “style” 属性中，那么声明应该应用于哪个元素就很明确了：就是这个 HTML 标签本身。在另外两种情况下，样式定义需要包含关于一个或多个应该应用样式的\
  \ HTML 元素的信息。这是通过将样式声明放在花括号内进行分组，并在每个组的开头放置一个“CSS 选择器”来实现的：\n\n```\nh1 {\ncolor:\
  \ red;\n}\ndiv.box {\nborder: 1px solid black;\n}\n#intro-paragraph {\nfont-weight:\
  \ bold;\n}\n```\n\nCSS 选择器定义了用于“选择”你想要设置样式的 HTML 元素的模式。它们的语法非常全面。以下列表提供了一个完整参考：\n\
  \n*   `tagname` 选择所有具有特定标签名称的元素。例如，“h1” 简单地匹配页面上的所有 `<h1>` 标签。\n*   `.classname`\
  \ （注意点号）选择 HTML 文档中定义了特定类的所有元素。这正是 “class” 属性的用武之地。例如，`.intro` 将匹配 `<p>` 和 `<h1>`。请注意，HTML\
  \ 元素可以有多个类，例如，`<p class=\"intro main\">`。\n*   `#idname` 基于元素的 “id” 属性来匹配元素。与类相反，规范的\
  \ HTML 文档应确保每个 “id” 都是唯一的，并且只赋予一个元素（不过，如果某些特别混乱的 HTML 页面打破了这一约定，并多次使用了相同的 id 值，也不要感到惊讶）。\n\
  *   这些选择器可以通过各种方式组合。例如，`div.box` 会选择所有 `<div class=”box”>` 标签，但不会选择 `<p>` 标签。\n\
  *   可以使用逗号 “,” 指定多个选择器规则，例如 `h1, h2, h3`。\n*   `selector1 selector2` 定义了一个链式规则（注意空格），会选择所有在匹配\
  \ `selector1` 的元素内部的、匹配 `selector2` 的元素。注意，可以链式连接两个以上的选择器。\n*   `selector1 > selector2`\
  \ 会选择所有父元素匹配 `selector1` 且本身匹配 `selector2` 的元素。注意这里与上一行的细微差别。“父”元素指的是“直接父元素”。例如，`div\
  \ > span` 不会匹配 `<p><span>` 中的 span 元素（因为这里的父元素是 `<p>` 标签），而 `div span` 则会。\n*  \
  \ `selector1 + selector2` 会选择所有紧跟在匹配 `selector1` 的元素之后（即在 HTML 层级结构中的同一层级）的、匹配 `selector2`\
  \ 的元素。\n*   `selector1 ~ selector2` 会选择所有位于匹配 `selector1` 的元素之后（在 HTML 层级结构中的同一层级）的、匹配\
  \ `selector2` 的元素。同样，这里与上一条规则有细微差别：这里的“之后”不需要是“直接”的；中间可以存在其他标签。\n*   还可以基于元素的属性添加更精细的选择规则。`tagname[attributename]`\
  \ 会选择所有具有名为 `attributename` 的属性的 `tagname` 元素。请注意，标签选择符是可选的，仅写 `[title]` 会选择所有具有\
  \ “title” 属性的元素。\n*   属性选择器可以进一步细化。`[attributename=value]` 还会检查属性的实际值。如果要包含空格，请将值用双引号括起来。\n\
  *   `[attributename~=value]` 执行类似的功能，但不是进行精确值比较，这里会选择其 `attributename` 属性的值是一个空格分隔的单词列表，并且其中一个单词等于\
  \ `value` 的所有元素。\n*   `[attributename|=value]` 会选择其 `attributename` 属性的值是一个空格分隔的单词列表，并且其中任何一个单词等于\
  \ “value” 或以 “value” 开头并后跟连字符 (“-”) 的所有元素。\n*   `[attributename^=value]` 会选择其属性值以提供的值开头的所有元素。如果要包含空格，请将值用双引号括起来。\n\
  *   `[attributename$=value]` 会选择其属性值以提供的值结尾的所有元素。如果要包含空格，请将值用双引号括起来。\n*   `[attributename*=value]`\
  \ 会选择其属性值包含所提供值的所有元素。如果要包含空格，请将值用双引号括起来。\n*   最后，还有一些“单冒号”和“双冒号”“伪类”也可以在选择器规则中使用。`p:first-child`\
  \ 选择每个是其父元素的第一个子元素的 `<p>` 标签，而 `p:last-child` 和 `p:nth-child(10)` 提供类似的功能。\n\n使用\
  \ Chrome 的开发者工具（或你浏览器的等效工具）来探索维基百科页面：尝试找到 “class” 属性的实例。页面的 CSS 资源是通过 `<link>` 标签引用的（请注意，页面也可以加载多个\
  \ CSS 文件）：\n\n```\n<link rel=\"stylesheet\" href=\"/w/load.php?...\" />\n```\n\n\
  我们不会使用 CSS 来构建网站。相反，我们要用它来抓取网站。因此，你可能想知道为什么关于 CSS 的讨论对我们的目标有用。原因在于，同样的 CSS 选择器语法可以用来使用\
  \ Python 快速查找和检索 HTML 页面中的元素。尝试在 Chrome 开发者工具窗格的 Elements 选项卡中右键单击一些 HTML 元素，然后选择“复制，复制\
  \ selector”。注意，你会得到一个 CSS 选择器。例如，这是获取页面上某个表格的选择器：\n\n```\n#mw-content-text > div\
  \ > table:nth-child(9)\n```\n\n或者：“在 id 为 `mw-content-text` 的元素内部，获取子元素 `div`，然后获取第\
  \ 9 个子元素 `table`。”一旦我们开始在网页抓取脚本中处理 HTML，就会经常使用这些选择器。\n\n### 3.4 Beautiful Soup 库\n\
  \n我们现在准备开始使用 Python 处理 HTML 页面了。回想一下下面的几行代码：\n\n```\nimport requests\nurl = 'https://en.wikipedia.org/w/index.php'\
  \ + \\\n'?title=List_of_Game_of_Thrones_episodes&oldid=802553687'\nr = requests.get(url)\n\
  html_contents = r.text\n```\n\n我们如何处理 `html_contents` 中包含的 HTML？为了正确解析和处理这份“汤”，我们将引入另一个名为“Beautiful\
  \ Soup”的库。\n\n#### 汤，浓郁而翠绿\n\n最后，我们明白了为什么之前一直把混乱的 HTML 页面称为“汤”。Beautiful Soup 库的名字来源于刘易斯·卡罗尔的一首同名诗，这首诗出自《爱丽丝梦游仙境》。在这个故事中，这首诗由一只叫“假海龟”的角色演唱，内容如下：“美丽的汤，如此浓郁而翠绿，//\
  \ 等候在热气腾腾的汤碗里！// 谁会不为这样的美味弯腰？// 傍晚的汤，美丽的汤！”。就像故事里一样，Beautiful Soup 试图整理复杂性：它通过修复糟糕的\
  \ HTML，并向我们呈现一个易于使用的 Python 结构，来帮助解析、构建和组织经常非常混乱的网页。\n\n就像 `requests` 一样，用 `pip`\
  \ 安装 Beautiful Soup 也很容易（如果你还需要设置 Python 3 和 pip，请回顾第 1.2.1 节），注意包名中的 “4”：\n\n```\n\
  pip install -U beautifulsoup4\n```\n\n使用 Beautiful Soup 从创建一个 `BeautifulSoup` 对象开始。如果你已经将\
  \ HTML 页面包含在一个字符串中（就像我们现在这样），这很简单。别忘了添加新的导入行：\n\n```\nimport requests\nfrom bs4\
  \ import BeautifulSoup\nurl = 'https://en.wikipedia.org/w/index.php' + \\\n'?title=List_of_Game_of_Thrones_episodes&oldid=802553687'\n\
  r = requests.get(url)\nhtml_contents = r.text\nhtml_soup = BeautifulSoup(html_contents)\n\
  ```\n\n尝试运行这段代码。如果一切顺利，你应该不会得到错误，不过你可能会看到如下警告：\n\n```\nWarning (from warnings module):\n\
  File \"__init__.py\", line 181     markup_type=markup_type))\nUserWarning: No parser\
  \ was explicitly specified, so I'm using the best available HTML parser for this\
  \ system (\"html.parser\"). This usually isn't a problem, but if you run this code\
  \ on another system, or in a different virtual environment, it may use a different\
  \ parser and behave differently.\nThe code that caused this warning is on line 1\
  \ of the file . To get rid of this warning, change code so that it looks like this:\n\
  BeautifulSoup(YOUR_MARKUP})\nto this:\nBeautifulSoup(YOUR_MARKUP, \"html.parser\"\
  )\n```\n\n哎呀，这是怎么回事？Beautiful Soup 库本身依赖于一个 HTML 解析器来执行大部分繁重的解析工作。在 Python 中，有多个解析器可以做到这一点：\n\
  \n*   `html.parser`：Python 内置的解析器，性能不错（尤其是在使用较新版本的 Python 3 时），并且不需要额外安装。\n*   `lxml`：速度非常快，但需要额外安装。\n\
  *   `html5lib`：旨在以与 Web 浏览器完全相同的方式解析网页，但速度稍慢。\n\n由于这些解析器之间存在细微差异，如果你没有显式指定一个解析器，Beautiful\
  \ Soup 会警告你，这可能导致你的代码在不同的机器上执行相同的脚本时行为略有不同。为了解决这个问题，我们只需自己指定一个解析器——这里我们将使用默认的 Python\
  \ 解析器：\n\n```\nhtml_soup = BeautifulSoup(html_contents, 'html.parser')\n```\n\n\
  Beautiful Soup 的主要任务是将 HTML 内容转换为基于树的表示形式。一旦创建了 `BeautifulSoup` 对象，你将使用两种方法从页面中获取数据：\n\
  \n*   `find(name, attrs, recursive, string, **keywords);`\n*   `find_all(name, attrs,\
  \ recursive, string, limit, **keywords).`\n\n#### 下划线\n\n如果你不喜欢写下划线，Beautiful Soup\
  \ 也提供了使用“驼峰式”大小写命名的大部分方法。因此，如果你愿意，可以使用 `findAll` 代替 `find_all`。\n\n这两个方法看起来非常相似，区别在于\
  \ `find_all` 额外接受一个 `limit` 参数。为了测试这些方法，将以下行添加到你的脚本中并运行它：\n\n```\nprint(html_soup.find('h1'))\n\
  print(html_soup.find('', {'id': 'p-logo'}))\nfor found in html_soup.find_all(['h1',\
  \ 'h2']):\nprint(found)\n```\n\n这两个方法的基本概念应该相对清楚：它们用于在 HTML 树中查找元素。让我们逐步讨论这两个方法的参数：\n\
  \n*   `name` 参数定义了你希望“查找”的标签名称。你可以传递一个字符串，或一个标签列表。将此参数保留为空字符串将会选择所有元素。\n*   `attrs`\
  \ 参数接受一个 Python 属性字典，并匹配具有这些属性的 HTML 元素。\n\n##### 与或逻辑？\n\n一些指南指出，在 `attrs` 字典中定义的属性遵循“或此或彼”的关系，即匹配至少一个属性的元素都会被检索到。然而，这不是真的：你的\
  \ `attrs` 中定义的过滤器和你用在 `**keywords` 中的关键字必须全部匹配，元素才会被检索到。\n\n*   `recursive` 参数是一个布尔值，控制搜索的深度。如果设置为\
  \ True（默认值），`find` 和 `find_all` 方法将会在子元素、子元素的子元素等中查找... 查找匹配你查询的元素。如果为 False，它将只查找直接子元素。\n\
  *   `string` 参数用于基于元素的文本内容进行匹配。\n\n##### Text 还是 String？\n\n`string` 参数相对较新。在早期的\
  \ Beautiful Soup 版本中，这个参数被命名为 `text`。实际上，如果你愿意，仍然可以使用 `text` 代替 `string`。如果你同时使用两者（不推荐），那么\
  \ `text` 优先，而 `string` 最终会进入下面的 `**keywords` 列表中。\n\n*   `limit` 参数仅在 `find_all`\
  \ 方法中使用，可用于限制检索到的元素数量。请注意，`find` 在功能上等同于调用 `limit` 设置为 1 的 `find_all`，区别在于前者直接返回检索到的元素，而后者总是返回一个项目列表，即使它只包含一个元素。同样重要的一点要知道，当\
  \ `find_all` 找不到任何东西时，它会返回一个空列表，而如果 `find` 找不到任何东西，它会返回 `None`。\n*   `**keywords`\
  \ 是一种特殊情况。基本上，方法签名的这一部分表示你可以添加任意数量的额外命名参数，这些参数将被用作属性过滤器。因此，写 `find(id='myid')` 等同于\
  \ `find(attrs={'id': 'myid'})`。如果同时定义了 `attrs` 参数和额外的关键字，它们将一起用作过滤器。提供此功能主要是为了方便起见，以便编写更易读的代码。\n\
  \n##### 小心使用关键字\n\n尽管 `**keywords` 参数在实践中非常有用，但这里有一些重要的注意事项。首先，不能将 `class` 用作关键字，因为它是\
  \ Python 的保留关键字。这很遗憾，因为它将是在 HTML 中查找内容时最常用的属性之一。幸运的是，Beautiful Soup 提供了一个变通方法。不要使用\
  \ `class`，只需写成 `class_`，如下所示：`find(class_='myclass')`。请注意，`name` 也不能用作关键字，因为它已经被用作\
  \ `find` 和 `find_all` 的第一个参数名称。遗憾的是，Beautiful Soup 没有为此提供 `name_` 替代方案。相反，如果你希望基于\
  \ \"name\" HTML 属性进行选择，则需要使用 `attrs`。\n\n`find` 和 `find_all` 都返回 `Tag` 对象。使用这些对象，你可以做一些有趣的事情：\n\
  \n*   访问 `name` 属性来获取标签名称。\n*   访问 `contents` 属性来获取一个 Python 列表，其中包含标签的子元素（其直接后代标签）作为一个列表。\n\
  *   `children` 属性执行相同的操作，但提供的是一个迭代器；`descendants` 属性也返回一个迭代器，现在以递归方式包含标签的所有后代。当你调用\
  \ `find` 和 `find_all` 时会使用这些属性。\n*   类似地，你也可以通过使用 `parent` 和 `parents` 属性在 HTML\
  \ 树中“向上”移动。要“横向”移动（即在层级结构中的同一层级查找前一个和下一个元素），可以使用 `next_sibling`、`previous_sibling`、`next_siblings`\
  \ 和 `previous_siblings`。\n*   将 `Tag` 对象转换为字符串会将标签及其 HTML 内容显示为一个字符串。例如，当你打印输出 `Tag`\
  \ 对象，或者将这样的对象包装在 `str` 函数中时，就会发生这种情况。\n*   通过 `Tag` 对象的 `attrs` 属性访问元素的属性。为方便起见，你也可以直接将\
  \ `Tag` 对象本身用作字典。\n*   使用 `text` 属性获取 `Tag` 对象的纯文本内容（不带 HTML 标签）。\n*   或者，你也可以使用\
  \ `get_text` 方法，可以向它传递一个 `strip` 布尔参数，以便 `get_text(strip=True)` 等同于 `text.strip()`。也可以指定一个字符串，用于连接元素中包含的文本片段，例如\
  \ `get_text('--')`。\n*   如果一个标签只有一个子元素，并且该子元素本身就是文本，那么你也可以使用 `string` 属性来获取文本内容。但是，如果一个标签包含嵌套在其中的其他\
  \ HTML 标签，`string` 将返回 `None`，而 `text` 将递归地获取所有文本。\n*   最后，并非所有的 `find` 和 `find_all`\
