  \ ' '.join(main.find(class_='star-rating') \\\n        .get('class')).replace('star-rating',\
  \ '').strip()\n    book['img'] = html_soup.find(class_='thumbnail').find('img').get('src')\n\
  \    desc = html_soup.find(id='product_description')\n    book['description'] =\
  \ ''\n    if desc:\n        book['description'] = desc.find_next_sibling('p') \\\
  \n            .get_text(strip=True)\n    info_table = html_soup.find(string='Product\
