  \n现在的问题是如何将这些信息返回给 Selenium。请记住，我们可以通过 `execute_script` 方法从 Selenium 执行 JavaScript\
  \ 命令。一种获取我们所需信息的可行方法是，使用 JavaScript 将整个页面的内容替换为我们想要的信息，然后使用 Selenium 提取该信息。\n\n\n\
  \n```\nfrom selenium import webdriver\nbase_url = 'http://edition.cnn.com/2017/10/24/asia/china-xi-jinping-thought/index.html'\n\
