  \ 1)\n};\nvar article = new Readability(uri, documentClone).parse();\ndocument.body.innerHTML\
  \ = '' + article.title + '' +\n'' + article.content + '';\n};\nscript.src = 'http://www.webscrapingforscience.com/readability/Readability.js';\n\
  d.getElementsByTagName('head')[0].appendChild(script);\n}(document));\n'''\ndriver.execute_script(js_cmd)\n\
  title = driver.find_element_by_id('title').text.strip()\ncontent = driver.find_element_by_id('content').text.strip()\n\
  print('Title was:', title)\ndriver.quit()\n```\n\n`document.body.innerHTML` 这一行在\
  \ JavaScript 命令中会替换 `<body>` 标签的内容，改为一个标题和一个 `<div>` 标签，我们可以从中直接获取所需信息。\n\n然而，`execute_script`\
  \ 方法也允许我们将 JavaScript 对象传回 Python，因此以下方法同样可行：\n\n```\nfrom selenium import webdriver\n\
  from selenium.webdriver.common.by import By\nfrom selenium.webdriver.support.ui\
  \ import WebDriverWait\nfrom selenium.webdriver.support import expected_conditions\
  \ as EC\nbase_url = 'http://edition.cnn.com/2017/10/24/asia/china-xi-jinping-thought/index.html'\n\
  driver = webdriver.Chrome()\ndriver.implicitly_wait(10)\ndriver.get(base_url)\n\
  js_cmd = '''\n(function(d, script) {\nscript = d.createElement('script');\nscript.type\
  \ = 'text/javascript';\nscript.async = true;\nscript.onload = function() {\nscript.id\
  \ = 'readability-script';\n}\nscript.src = 'http://www.webscrapingforscience.com/readability/Readability.js';\n\
  d.getElementsByTagName('head')[0].appendChild(script);\n}(document));\n'''\njs_cmd2\
  \ = '''\nvar documentClone = document.cloneNode(true);\nvar loc = document.location;\n\
  var uri = {\nspec: loc.href,\nhost: loc.host,\nprePath: loc.protocol + \"//\" +\
  \ loc.host,\nscheme: loc.protocol.substr(0, loc.protocol.indexOf(\":\")),\npathBase:\
  \ loc.protocol + \"//\" + loc.host +\nloc.pathname.substr(0, loc.pathname.lastIndexOf(\"\
  /\") + 1)\n};\nvar article = new Readability(uri, documentClone).parse();\nreturn\
  \ JSON.stringify(article);\n'''\ndriver.execute_script(js_cmd)\nwait = WebDriverWait(driver,\
  \ 10)\nwait.until(EC.presence_of_element_located((By.ID, \"readability-script\"\
  )))\nreturned_result = driver.execute_script(js_cmd2)\nprint(returned_result)\n\
  driver.quit()\n```\n\n这里有一些细节需要额外说明。首先，注意我们使用了两次 `execute_script` 方法：第一次用于注入 `<script>`\
