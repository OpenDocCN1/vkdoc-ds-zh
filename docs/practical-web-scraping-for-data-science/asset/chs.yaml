  \n图 9-2\n\n巴克莱银行抵押贷款模拟器通过 JavaScript 提交 POST 请求，并将请求数据嵌入为 JSON 格式\n\n### 9.6 抓取抵押贷款利率\n\
  \n我们将要抓取巴克莱银行提供的抵押贷款模拟器，网址是 [`https://www.barclays.co.uk/mortgages/mortgage-calculator/`](https://www.barclays.co.uk/mortgages/mortgage-calculator/)。选择这家金融服务提供商并非特殊原因，只是因为它运用了一些有趣的技术，正好可以作为很好的示例。\n\
  \n花点时间浏览一下这个网站（使用“What would it cost?”功能）。系统会要求我们填写一些参数，之后就能看到希望抓取的可选产品概览。\n\n如果你同时打开浏览器的开发者工具，会注意到一个\
  \ POST 请求被发送到 [`https://www.barclays.co.uk/dss/service/co.uk/mortgages/costcalculator/productservice`](https://www.barclays.co.uk/dss/service/co.uk/mortgages/costcalculator/productservice)，它有一个有趣的特性：执行\
  \ POST 请求的页面 JavaScript 在 `Content-Type` 头部中使用了 `application/json` 值，并将 POST 数据以纯\
  \ JSON 格式包含在内；参见图 9-2。对于 `requests` 库来说，这种情况下 `data` 参数无法生效，因为它会对 POST 数据进行编码。相反，我们需要使用\
  \ `json` 参数，这基本上会指示 `requests` 将 POST 数据格式化为 JSON。\n\n此外，你会注意到结果页面虽然以相对复杂的表格形式呈现（每个条目都有“Show\
  \ more”链接），但 POST 请求返回的响应实际上是一个格式规整的 JSON 对象；参见图 9-3，因此我们可能根本不需要使用 Beautiful Soup\
  \ 来访问这个“内部 API”。\n\n![A463931_1_En_9_Fig3_HTML.jpg](img/A463931_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3\n\nPOST 响应数据同样以格式规整的 JSON 返回\n\n让我们通过 Python 实现来看一下会得到什么响应：\n\n```\nimport\
  \ requests\nurl = 'https://www.barclays.co.uk/dss/service/co.uk/mortgages/' + \\\
  \n'costcalculator/productservice'\nsession = requests.Session()\nestimatedPropertyValue\
  \ = 200000\nrepaymentAmount = 150000\nmonths = 240\ndata = {\"header\": {\"flowId\"\
  :\"0\"},\n\"body\":\n{\"wantTo\":\"FTBP\",\n\"estimatedPropertyValue\":estimatedPropertyValue,\n\
  \"borrowAmount\":repaymentAmount,\n\"interestOnlyAmount\":0,\n\"repaymentAmount\"\
  :repaymentAmount,\n\"ltv\":round(repaymentAmount/estimatedPropertyValue*100),\n\"\
  totalTerm\":months,\n\"purchaseType\":\"Repayment\"}}\nr = session.post(url, json=data)\n\
  print(r.json())\n```\n\n运行这段代码会输出：\n\n```\n{'header':\n{'result': 'error', 'systemError':\n\
  {'errorCode': 'DSS_SEF001', 'type': 'E',\n'severity': 'FRAMEWORK',\n'errorMessage':\
  \ 'State details not found in database',\n'validationErrors': [],\n'contentType':\
  \ 'application/json', 'channel': '6'}\n}}\n```\n\n看起来不太对劲。请记住，当我们没有得到预期的结果时，可以尝试以下几种方法：\n\
  \n- 检查是否漏掉了某些 Cookie。例如，我们可能需要先访问入口页面，或者可能存在由 JavaScript 设置的 Cookie。如果在浏览器中检查请求，你会发现存在大量\
  \ Cookie。\n- 检查是否漏掉了某些头部信息，或者是否需要伪造一些头部。\n- 如果以上方法都无效，最后可以求助于 Selenium 来实现完整的浏览器行为。\n\
  \n在这个特定情况下，请求中包含了很多 Cookie，其中一些是通过常规的 `Set-Cookie` 头部设置的，但许多是通过页面中引入的大量 JavaScript\
  \ 文件设置的。由于这些 JavaScript 经过了混淆处理，想要理清它们确实非常困难。不过，POST 请求中由 JavaScript 设置并包含的某些特殊头部似乎与错误信息有关。让我们尝试包含这些头部，同时伪造\
  \ `User-Agent` 和 `Referer` 头部：\n\n```\nimport requests\nurl = 'https://www.barclays.co.uk/dss/service/co.uk/mortgages/'\
  \ + \\\n'costcalculator/productservice'\nsession = requests.Session()\nsession.headers.update({\n\
  #### 这些是非常规头部，我们将其包含进来\n'currentState': 'default_current_state',\n'action': 'default',\n\
  'Origin': 'https://www.barclays.co.uk',\n#### 伪造 referer、用户代理和 X-Requested-With\n\
  'Referer': 'https://www.barclays.co.uk/mortgages/mortgage-calculator/',\n'User-Agent':\
  \ 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' + ' (KHTML, like\
  \ Gecko) Chrome/62.0.3202.62 Safari/537.36',\n'X-Requested-With': 'XMLHttpRequest',\n\
  })\nestimatedPropertyValue = 200000\nrepaymentAmount = 150000\nmonths = 240\ndata\
  \ = {\"header\": {\"flowId\":\"0\"},\n\"body\":\n{\"wantTo\":\"FTBP\",\n\"estimatedPropertyValue\"\
  :estimatedPropertyValue,\n\"borrowAmount\":repaymentAmount,\n\"interestOnlyAmount\"\
  :0,\n\"repaymentAmount\":repaymentAmount,\n\"ltv\":round(repaymentAmount/estimatedPropertyValue*100),\n\
  \"totalTerm\":months,\n\"purchaseType\":\"Repayment\"}}\nr = session.post(url, json=data)\n\
  #### 仅打印头部以避免输出过长\nprint(r.json()['header'])\n```\n\n这似乎奏效了！实际上，在这个例子中我们发现根本不需要包含任何\
  \ Cookie。现在我们可以清理一下代码：\n\n```\nimport requests\ndef get_mortgages(estimatedPropertyValue,\
  \ repaymentAmount, months):\nurl = 'https://www.barclays.co.uk/dss/service/' + \\\
  \n'co.uk/mortgages/costcalculator/productservice'\nheaders = {\n#### 这些是非常规头部，我们将其包含进来\n\
  'currentState': 'default_current_state',\n'action': 'default',\n'Origin': 'https://www.barclays.co.uk',\n\
  ```\n\n\n\n#### 伪造 Referer、User-Agent 和 X-Requested-With\n\n```python\n'Referer':\
  \ 'https://www.barclays.co.uk/mortgages/mortgage-calculator/',\n'User-Agent': 'Mozilla/5.0\
  \ (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' + ' (KHTML, like Gecko) Chrome/62.0.3202.62\
  \ Safari/537.36',\n'X-Requested-With': 'XMLHttpRequest',\n}\ndata = {\"header\"\
  : {\"flowId\":\"0\"},\n\"body\":\n{\"wantTo\":\"FTBP\",\n\"estimatedPropertyValue\"\
  :estimatedPropertyValue,\n\"borrowAmount\":repaymentAmount,\n\"interestOnlyAmount\"\
  :0,\n\"repaymentAmount\":repaymentAmount,\n\"ltv\":round(repaymentAmount/estimatedPropertyValue*100),\n\
  \"totalTerm\":months,\n\"purchaseType\":\"Repayment\"}}\nr = requests.post(url,\
  \ json=data, headers=headers)\nresults = r.json()\nreturn results['body']['mortgages']\n\
  mortgages = get_mortgages(200000, 150000, 240)\n\n#### 打印第一条抵押贷款信息\nprint(mortgages[0])\n\
  ```\n\n运行此代码将输出：\n\n```python\n{'mortgageName': '5 Year Fixed', 'mortgageId': '1321127853346',\n\
  'ctaType': None, 'uniqueId': '590b357e295b0377d0fb607b',\n'mortgageType': 'FIXED',\n\
  'howMuchCanBeBorrowedNote': '95% (max) of the value of your home',\n'initialRate':\
  \ 4.99, 'initialRateTitle': '4.99%',\n'initialRateNote': 'until 31st January 2023',\n\
  [...]\n```\n\n### 9.7 抓取与可视化 IMDB 评分\n\n接下来的系列示例将转向包含更多数据科学导向的用例。我们将从简单的任务开始——使用\
  \ IMDB（互联网电影数据库）抓取电视剧剧集的评论列表。我们以*《权力的游戏》*为例，其剧集列表可在 [`http://www.imdb.com/title/tt0944947/episodes`](http://www.imdb.com/title/tt0944947/episodes)\
  \ 找到。请注意，IMDB 的概览页面分布在多个页面（按季或按年），因此我们使用一个额外的循环遍历想要获取的剧集：\n\n```python\nimport requests\n\
  from bs4 import BeautifulSoup\nurl = 'http://www.imdb.com/title/tt0944947/episodes'\n\
  episodes = []\nratings = []\n\n#### 遍历第 1 季到第 7 季\nfor season in range(1, 8):\n\
  \    r = requests.get(url, params={'season': season})\n    soup = BeautifulSoup(r.text,\
  \ 'html.parser')\n    listing = soup.find('div', class_=\"eplist\")\n    for epnr,\
  \ div in enumerate(listing.find_all('div', recursive=False)):\n        episode =\
  \ \"{}.{}\".format(season, epnr + 1)\n        rating_el = div.find(class_='ipl-rating-star__rating')\n\
  \        rating = float(rating_el.get_text(strip=True))\n        print('剧集:', episode,\
  \ '-- 评分:', rating)\n        episodes.append(episode)\n        ratings.append(rating)\n\
  ```\n\n然后，我们可以使用`matplotlib`来绘制抓取到的评分。`matplotlib`是一个广为人知的 Python 绘图库，可以通过`pip`轻松安装：\n\
  \n```\npip install -U matplotlib\n```\n\n### 使用 Python 绘图\n\n当然，你也可用 Excel 等工具复现下面的图表，但本示例仅作为入门介绍，因为我们在后续的示例中还会继续使用`matplotlib`。请注意，这绝不是在\
  \ Python 中唯一的绘图库，甚至不是最易用的，但它仍然是最流行的绘图库之一。也可以看看其他优秀的库，如 Seaborn ([`https://seaborn.pydata.org/`](https://seaborn.pydata.org/))、Altair\
  \ ([`https://altair-viz.github.io/`](https://altair-viz.github.io/)) 和 ggplot ([`http://ggplot.yhathq.com/`](http://ggplot.yhathq.com/))。\n\
  \n将以下代码行添加到我们的脚本中，即可将结果绘制成一个简单的柱状图，如图 9-4 所示。\n\n![A463931_1_En_9_Fig4_HTML.jpg](img/A463931_1_En_9_Fig4_HTML.jpg)\n\
  \n**图 9-4** 使用 `matplotlib` 绘制每集 IMDB 评分\n\n添加如下代码：\n\n```python\nimport matplotlib.pyplot\
  \ as plt\nepisodes = ['S' + e.split('.')[0] if int(e.split('.')[1]) == 1 else ''\
  \ \\\nfor e in episodes]\nplt.figure()\npositions = [a*2 for a in range(len(ratings))]\n\
  plt.bar(positions, ratings, align=\"center\")\nplt.xticks(positions, episodes)\n\
  plt.show()\n```\n\n### 9.8 抓取 IATA 航空公司信息\n\n我们将使用 [`http://www.iata.org/publications/Pages/code-search.aspx`](http://www.iata.org/publications/Pages/code-search.aspx)\
  \ 上的搜索表单来抓取航空公司信息。这是一个有趣的案例，用以说明某些网站的“棘手之处”，尽管我们想要使用的表单看起来极其简单（页面上只显示一个下拉菜单和一个文本字段）。正如\
  \ URL 所示，驱动此页面的 Web 服务器基于 ASP.NET (`.aspx`) 构建，它在处理表单数据方面有着非常独特的机制。\n\n建议你尝试使用浏览器提交此表单，并通过开发者工具观察发生了什么。如图\
  \ 9-5 所示，似乎有大量的表单数据被包含在 POST 请求中——远远多于我们看到的两个字段。\n\n![A463931_1_En_9_Fig5_HTML.jpg](img/A463931_1_En_9_Fig5_HTML.jpg)\n\
  \n**图 9-5** 提交 IATA 表单包含了大量表单数据\n\n显然，手动在 Python 脚本中包含所有这些字段是不可行的。例如，`__VIEWSTATE`\
  \ 字段包含会话信息，每次请求都会发生变化。甚至某些字段的名称似乎包含了一些我们无法确定未来是否会改变的部分，这会导致我们的脚本出错。此外，我们似乎还需要跟踪\
  \ Cookie。最后，看看 POST 请求返回的响应内容。这看起来像是一个部分响应（将由 JavaScript 解析并显示），而不是一个完整的 HTML 页面：\n\
  \n```\n1|#||4|1330|updatePanel|ctl00_SPWebPartManager1_g_e3b09024_878e\n[...]\n\
  MSOSPWebPartManager_StartWebPartEditingName|false|5|hiddenField|\nMSOSPWebPartManager_EndWebPartEditing|false|\n\
  ```\n\n为了解决这些问题，我们将尝试使代码尽可能健壮。首先，我们将使用 `requests` 的会话机制向搜索页面发起一个 GET 请求。接下来，我们将使用\
  \ `BeautifulSoup` 提取所有表单元素及其名称和值：\n\n```python\nimport requests\nfrom bs4 import\
  \ BeautifulSoup\nurl = 'http://www.iata.org/publications/Pages/code-search.aspx'\n\
  session = requests.Session()\n\n#### 作为预防措施，伪造用户代理\nsession.headers.update({\n'User-Agent'\
  \ : 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' + ' (KHTML,\
  \ like Gecko) Chrome/62.0.3202.62 Safari/537.36'\n})\n\n#### 获取搜索页面\nr = session.get(url)\n\
  html_soup = BeautifulSoup(r.text, 'html.parser')\nform = html_soup.find(id='aspnetForm')\n\
  \n#### 获取表单字段\ndata = {}\nfor inp in form.find_all(['input', 'select']):\n    name\
  \ = inp.get('name')\n    value = inp.get('value')\n    if not name:\n        continue\n\
  \    data[name] = value if value else ''\nprint(data, end=\"\\n\\n\\n\")\n```\n\n\
  这将输出以下内容：\n\n```python\n{'_wpcmWpid': '',\n'wpcmVal': '',\n'MSOWebPartPage_PostbackSource':\
  \ '',\n'MSOTlPn_SelectedWpId': '',\n'MSOTlPn_View': '0',\n'MSOTlPn_ShowSettings':\
  \ 'False',\n'MSOGallery_SelectedLibrary': '',\n'MSOGallery_FilterString': '',\n\
  'MSOTlPn_Button': 'none',\n'__EVENTTARGET': '',\n'__EVENTARGUMENT': '',\n[...]\n\
  ```\n\n接下来，我们将使用收集到的表单数据执行一个 POST 请求。不过，我们还需要为下拉菜单和文本框设置正确的值。我们在脚本中添加以下代码行：\n\n\
  ```python\n#### 设置我们想要搜索的查询条件\nfor name in data.keys():\n    # 搜索方式\n    if 'ddlImLookingFor'\
  \ in name:\n        data[name] = 'ByAirlineName'\n    # 航空公司名称\n    if 'txtSearchCriteria'\
  \ in name:\n        data[name] = 'Lufthansa'\n```\n\n\n\n"
- "# 执行 POST 请求  \n`r = session.post(url, data=data)`  \n`print(r.text)`  \n\n奇怪的是，与浏览器中的情况相反，这里的\
  \ `POST` 请求返回的是一个完整的 `HTML` 页面，而不是部分结果。不过这也不算太糟，因为我们现在可以使用 `Beautiful Soup` 来提取结果表格。\n\
  \n与其手动解析这个表格，不如使用一个名为 `pandas` 的热门数据科学库来处理表格数据，它内置了一个便捷的方法，可将 `HTML` 表格直接转换为数据框。使用\
  \ `pip` 即可轻松安装该库：\n\n```\npip install -U pandas\n```\n\n为了解析 `HTML`，`pandas` 默认依赖\
  \ `lxml`，如果找不到 `lxml`，则会回退到使用 `Beautiful Soup` 和 `html5lib`。为确保 `lxml` 可用，请使用以下命令安装：\n\
  \n```\npip install -U lxml\n```\n\n现在，完整的脚本可以组织如下：\n\n```python\nimport requests\n\
  from bs4 import BeautifulSoup\nimport pandas\nurl = 'http://www.iata.org/publications/Pages/code-search.aspx'\n\
  def get_results(airline_name):\nsession = requests.Session()\n\n#### 作为预防措施，伪装用户代理\n\
  session.headers.update({\n'User-Agent' : 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)\
  \ AppleWebKit/537.36 ' + ' (KHTML, like Gecko) Chrome/62.0.3202.62 Safari/537.36'\n\
  })\nr = session.get(url)\nhtml_soup = BeautifulSoup(r.text, 'html.parser')\nform\
  \ = html_soup.find(id='aspnetForm')\ndata = {}\nfor inp in form.find_all(['input',\
  \ 'select']):\nname = inp.get('name')\nvalue = inp.get('value')\nif not name:\n\
  continue\nif 'ddlImLookingFor' in name:\nvalue = 'ByAirlineName'\nif 'txtSearchCriteria'\
  \ in name:\nvalue = airline_name\ndata[name] = value if value else ''\nr = session.post(url,\
  \ data=data)\nhtml_soup = BeautifulSoup(r.text, 'html.parser')\ntable = html_soup.find('table',\
  \ class_=\"datatable\")\ndf = pandas.read_html(str(table))\nreturn df\ndf = get_results('Lufthansa')\n\
  print(df)\n```\n\n运行这段代码将输出：\n\n```\n[                               0   1     2\
  \      3\n0           Deutsche Lufthansa AG  LH 220.0  220.0\n1              Lufthansa\
  \ Cargo AG  LH   NaN   20.0\n2         Lufthansa CityLine GmbH  CL 683.0  683.0\n\
  3 Lufthansa Systems GmbH & Co. KG  S1   NaN    NaN]\n```\n\n等效的 `Selenium` 代码如下所示：\n\
  \n```python\nimport pandas\nfrom selenium import webdriver\nfrom selenium.webdriver.support.ui\
  \ import Select\nurl = 'http://www.iata.org/publications/Pages/code-search.aspx'\n\
  driver = webdriver.Chrome()\ndriver.implicitly_wait(10)\ndef get_results(airline_name):\n\
  driver.get(url)\n\n#### 确保选择了表单的正确部分\n\n#### 这将使查找元素更容易\n\n#### 因为 #aspnetForm 包裹了整个页面，包括\n\
  \n#### 搜索框\nform_div = driver.find_element_by_css_selector('#aspnetForm .iataStandardForm')\n\
  select = Select(form_div.find_element_by_css_selector('select'))\nselect.select_by_value('ByAirlineName')\n\
  text = form_div.find_element_by_css_selector('input[type=text]')\ntext.send_keys(airline_name)\n\
  submit = form_div.find_element_by_css_selector('input[type=submit]')\nsubmit.click()\n\
  table = driver.find_element_by_css_selector('table.datatable')\ntable_html = table.get_attribute('outerHTML')\n\
  df = pandas.read_html(str(table_html))\nreturn df\ndf = get_results('Lufthansa')\n\
  print(df)\ndriver.quit()\n```\n\n还有一个谜团需要我们解开：还记得吗，由 `requests` 发起的 `POST` 请求返回的是一个完整的\
  \ `HTML` 页面，而不是我们在浏览器中观察到的部分结果。服务器是如何区分这两种结果类型的？答案在于搜索表单的提交方式。在 `requests` 中，我们执行了一个只有最少头信息的简单\
  \ `POST` 请求。然而，在实时网页上，表单提交是由 `JavaScript` 处理的，它会执行实际的 `POST` 请求，并解析出部分结果进行显示。为了向服务器表明是\
  \ `JavaScript` 在发起请求，请求中包含了两个头信息，我们也可以在 `requests` 中伪装这两个头信息。如果我们像下面这样修改代码，也确实能得到相同的部分结果：\n\
  \n```python\n#### 包含头信息以表明我们需要部分结果\nsession.headers.update({\n'X-MicrosoftAjax'\
  \  : 'Delta=true',\n'X-Requested-With' : 'XMLHttpRequest',\n'User-Agent' : 'Mozilla/5.0\
  \ (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' + ' (KHTML, like Gecko) Chrome/62.0.3202.62\
  \ Safari/537.36'\n})\n```\n\n9.9 抓取并分析网络论坛互动  \n\n在这个例子中，我们将抓取 [`http://bpbasecamp.freeforums.net/board/27/gear-closet`](http://bpbasecamp.freeforums.net/board/27/gear-closet)（一个背包客和徒步旅行者论坛）上的网络论坛帖子，以了解哪些用户最活跃，以及谁经常与谁互动。我们将记录互动次数，其构建方式如下：\n\
  \n- `话题`中的第一个帖子没有`回复`任何人，因此我们不将其视为互动。\n- 话题中后续的帖子可能包含一个或多个引用块，这表明发帖者直接回复了另一个用户，我们将此视为一次互动。\n\
  - 如果某个帖子不包含任何引用块，我们就假定该帖子是对原帖作者的回复。实际情况可能并非如此，用户通常会使用像 `^^` 这样的小段文字来表示他们在回复直接上一位发帖者，但在这个例子中，我们会保持方法简单（不过，你也可以随意修改脚本，使其符合你自己对`互动`的定义）。\n\
  \n让我们开始吧。首先，我们将根据给定的论坛 `URL` 提取话题列表：\n\n```python\nimport requests\nimport re\n\
  from bs4 import BeautifulSoup\ndef get_forum_threads(url, max_pages=None):\npage\
  \ = 1\nthreads = []\nwhile not max_pages or page <= max_pages:\nprint('正在抓取论坛页面:',\
  \ page)\nr = requests.get(url, params={'page': page})\nsoup = BeautifulSoup(r.text,\
  \ 'html.parser')\ncontent = soup.find(class_='content')\nlinks = content.find_all('a',\
  \ attrs={'href': re.compile('^\\/thread\\/')})\nthreads_on_page = [a.get('href')\
  \ for a in links \\\nif a.get('href') and not 'page=' in a.get('href')]\nthreads\
  \ += threads_on_page\npage += 1\nnext_page = soup.find('li', class_=\"next\")\n\
  if 'state-disabled' in next_page.get('class'):\nbreak\nreturn threads\nurl = 'http://bpbasecamp.freeforums.net/board/27/gear-closet'\n\
  threads = get_forum_threads(url, max_pages=5)\nprint(threads)\n```\n\n注意，在分页方面我们需要稍微聪明一点。即使将大于最大页码的数字作为\
  \ `URL` 参数传入，这个论坛也会持续返回最后一页，因此我们可以检查具有 `next` 类的元素是否也同时具有 `state-disabled` 类，以判断是否到达了话题列表的末尾。由于我们只想要对应于第一页的话题链接，因此我们也要移除所有\
  \ `URL` 中包含 `page=` 的链接。在这个例子中，我们还决定只限制抓取五页。运行这段代码将输出：\n\n```\n正在抓取论坛页面: 1\n正在抓取论坛页面:\
  \ 2\n正在抓取论坛页面: 3\n正在抓取论坛页面: 4\n正在抓取论坛页面: 5\n['/thread/2131/before-asking-which-pack-boot',\
  \ [...] ]\n```\n\n现在，对于每个话题，我们想要获取一个帖子列表。我们可以先用一个话题来尝试：\n\n```python\nimport requests\n\
  import re\nfrom urllib.parse import urljoin\nfrom bs4 import BeautifulSoup\ndef\
  \ get_thread_posts(url, max_pages=None):\npage = 1\nposts = []\nwhile not max_pages\
  \ or page <= max_pages:\nprint('正在抓取话题 URL/页面:', url, page)\nr = requests.get(url,\
  \ params={'page': page})\nsoup = BeautifulSoup(r.text, 'html.parser')\ncontent =\
  \ soup.find(class_='content')\nfor post in content.find_all('tr', class_=\"item\"\
  ):\nuser = post.find('a', class_='user-link')\nif not user:\n```\n\n\n\n#### 用户可能已被删除，跳过...\n\
  继续\n`user = user.get_text(strip=True)`\n`quotes = []`\n`for quote in post.find_all(class_='quote_header'):`\n\
  `quoted_user = quote.find('a', class_='user-link')`\n`if quoted_user:`\n`quotes.append(quoted_user.get_text(strip=True))`\n\
  `posts.append((user, quotes))`\n`page += 1`\n`next_page = soup.find('li', class_=\"\
  next\")`\n`if 'state-disabled' in next_page.get('class'):`\n`break`\n`return posts`\n\
  \n`url = 'http://bpbasecamp.freeforums.net/board/27/gear-closet'`\n`thread = '/thread/2131/before-asking-which-pack-boot'`\n\
  `thread_url = urljoin(url, thread)`\n`posts = get_thread_posts(thread_url)`\n`print(posts)`\n\
  \n运行这段代码，会输出一个列表，其中每个元素都是一个元组，包含发帖人姓名以及该帖中引用的用户列表：\n\n```\nScraping thread url/page:\n\
  http://bpbasecamp.freeforums.net/thread/2131/before-asking-which-pack-boot 1\nScraping\
  \ thread url/page:\nhttp://bpbasecamp.freeforums.net/thread/2131/before-asking-which-pack-boot\
  \ 2\n[('almostthere', []), ('trinity', []), ('paula53', []),                   \
  \  ('toejam', ['almostthere']), ('stickman', []), ('tamtrails', []),\n('almostthere',\
  \ ['tamtrails']), ('kayman', []), ('almostthere',       ['kayman']), ('lanceman',\
  \ []), ('trinity', ['trinity']),\n('Christian', ['almostthere']), ('pollock', []),\
  \ ('mitsmit', []),\n('intothewild', []), ('Christian', []), ('softskull', []), ('argus',\
  \    []),('lyssa7', []), ('kevin', []), ('greenwoodsuncharted', [])]\n```\n\n将这两个函数结合，我们就得到了下面的脚本。我们将使用\
  \ Python 的 `pickle` 模块来存储爬取结果，这样就不必反复爬取论坛了：\n\n```python\nimport requests\nimport\
  \ re\nfrom urllib.parse import urljoin\nfrom bs4 import BeautifulSoup\nimport pickle\n\
  \ndef get_forum_threads(url, max_pages=None):\n    page = 1\n    threads = []\n\
  \    while not max_pages or page <= max_pages:\n        print('正在爬取论坛页面：', page)\n\
  \        r = requests.get(url, params={'page=': page})\n        soup = BeautifulSoup(r.text,\
  \ 'html.parser')\n        content = soup.find(class_='content')\n        links =\
  \ content.find_all('a', attrs={'href': re.compile('^\\/thread\\/')})\n        threads_on_page\
  \ = [a.get('href') for a in links \\\n                           if a.get('href')\
  \ and not 'page' in a.get('href')]\n        threads += threads_on_page\n       \
  \ page += 1\n        next_page = soup.find('li', class_=\"next\")\n        if 'state-disabled'\
  \ in next_page.get('class'):\n            break\n    return threads\n\ndef get_thread_posts(url,\
  \ max_pages=None):\n    page = 1\n    posts = []\n    while not max_pages or page\
  \ <= max_pages:\n        print('正在爬取主题链接/页面：', url, page)\n        r = requests.get(url,\
  \ params={'page': page})\n        soup = BeautifulSoup(r.text, 'html.parser')\n\
  \        content = soup.find(class_='content')\n        for post in content.find_all('tr',\
  \ class_=\"item\"):\n            user = post.find('a', class_='user-link')\n   \
  \         if not user:\n                # 用户可能已被删除，跳过...\n                continue\n\
  \            user = user.get_text(strip=True)\n            quotes = []\n       \
  \     for quote in post.find_all(class_='quote_header'):\n                quoted_user\
  \ = quote.find('a', class_='user-link')\n                if quoted_user:\n     \
  \               quotes.append(quoted_user.get_text(strip=True))\n            posts.append((user,\
  \ quotes))\n        page += 1\n        next_page = soup.find('li', class_=\"next\"\
  )\n        if 'state-disabled' in next_page.get('class'):\n            break\n \
  \   return posts\n\nurl = 'http://bpbasecamp.freeforums.net/board/27/gear-closet'\n\
  threads = get_forum_threads(url, max_pages=5)\nall_posts = []\nfor thread in threads:\n\
  \    thread_url = urljoin(url, thread)\n    posts = get_thread_posts(thread_url)\n\
  \    all_posts.append(posts)\n\nwith open('forum_posts.pkl', \"wb\") as output_file:\n\
  \    pickle.dump(all_posts, output_file)\n```\n\n接下来，我们可以加载结果，并用热力图实现可视化。我们将使用 `pandas`、`numpy`\
  \ 和 `matplotlib` 来完成这项工作，这些库都可以通过 `pip` 安装（如果你已经按照之前的示例安装了 pandas 和 matplotlib，就无需再安装其他东西了）：\n\
  \n```bash\npip install -U pandas\npip install -U numpy\npip install -U matplotlib\n\
  ```\n\n我们先从可视化第一个主题开始（即上文爬虫输出片段中所示的内容）：\n\n```python\nimport pickle\nimport numpy\
  \ as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n#### 加载存储的结果\n\
  with open('forum_posts.pkl', \"rb\") as input_file:\n    posts = pickle.load(input_file)\n\
  \ndef add_interaction(users, fu, tu):\n    if fu not in users:\n        users[fu]\
  \ = {}\n    if tu not in users[fu]:\n        users[fu][tu] = 0\n    users[fu][tu]\
  \ += 1\n\n#### 创建互动字典\nusers = {}\nfor thread in posts:\n    first_one = None\n\
  \    for post in thread:\n        user = post[0]\n        quoted = post[1]\n   \
  \     if not first_one:\n            first_one = user\n        elif not quoted:\n\
  \            add_interaction(users, user, first_one)\n        else:\n          \
  \  for qu in quoted:\n                add_interaction(users, user, qu)\n```\n\n\n\
  \n#### 在第一个线程后停止\n`break`\n\n```\ndf = pd.DataFrame.from_dict(users, orient=\"index\"\
  ).fillna(0)\nheatmap = plt.pcolor(df, cmap=\"Blues\")\ny_vals = np.arange(0.5, len(df.index),\
  \ 1)\nx_vals = np.arange(0.5, len(df.columns), 1)\nplt.yticks(y_vals, df.index)\n\
  plt.xticks(x_vals, df.columns, rotation=\"vertical\")\nfor y in range(len(df.index)):\n\
  \    for x in range(len(df.columns)):\n        if df.iloc[y, x] == 0:\n        \
  \    continue\n        plt.text(x + 0.5, y + 0.5, '%.0f' % df.iloc[y, x],\n    \
  \             horizontalalignment='center',\n                 verticalalignment='center')\n\
  plt.show()\n```\n\n这将为您提供如图 9-6 所示的结果。可以看到，不同的用户正在回复原始发帖人，而原始发帖人也在引用其他用户。\n\n![A463931_1_En_9_Fig6_HTML.jpg](img/A463931_1_En_9_Fig6_HTML.jpg)\n\
  \n**图 9-6** 可视化一个论坛线程中的用户交互\n\n有多种方式可以调整这个可视化效果。例如，图 9-7 展示了所有论坛线程中的用户交互，但仅考虑了直接引用的情况。\n\
  \n![A463931_1_En_9_Fig7_HTML.jpg](img/A463931_1_En_9_Fig7_HTML.jpg)\n\n**图 9-7**\
  \ 可视化所有抓取到的论坛线程中的用户交互（仅限直接引用）\n\n### 9.10 收集并聚类时尚数据集\n\n在这个示例中，我们将使用 Zalando（一家广受欢迎的瑞典网店）来获取一批时尚产品图片，并使用\
  \ t-SNE 算法对它们进行聚类。\n\n#### 检查 API\n\n请注意，Zalando 也提供了一个易于使用的 API（文档请参见 [`https://github.com/zalando/shop-api-documentation/wiki/Api-introduction`](https://github.com/zalando/shop-api-documentation/wiki/Api-introduction)）。在撰写本文时，该\
  \ API 不需要身份验证，但计划在不久的将来进行更改，届时用户需要注册才能获取 API 访问令牌。由于我们只需抓取图片，因此无需注册；不过在一个正式的“应用程序”中，使用\
  \ API 选项无疑是值得推荐的。\n\n我们的第一个脚本会下载图片并将它们存储在一个目录中，请参见图 9-8：\n\n![A463931_1_En_9_Fig8_HTML.jpg](img/A463931_1_En_9_Fig8_HTML.jpg)\n\
  \n**图 9-8** 收集到的连衣裙图片集合\n\n```\nimport requests\nimport os, os.path\nfrom bs4 import\
  \ BeautifulSoup\nfrom urllib.parse import urljoin, urlparse\n\nstore = 'images'\n\
  if not os.path.exists(store):\n    os.makedirs(store)\n\nurl = 'https://www.zalando.co.uk/womens-clothing-dresses/'\n\
  pages_to_crawl = 15\n\ndef download(url):\n    r = requests.get(url, stream=True)\n\
  \    filename = urlparse(url).path.split('/')[-1]\n    print('Downloading to:',\
  \ filename)\n    with open(os.path.join(store, filename), 'wb') as the_image:\n\
  \        for byte_chunk in r.iter_content(chunk_size=4096*4):\n            the_image.write(byte_chunk)\n\
  \nfor p in range(1, pages_to_crawl+1):\n    print('Scraping page:', p)\n    r =\
  \ requests.get(url, params={'p' : p})\n    html_soup = BeautifulSoup(r.text, 'html.parser')\n\
  \    for img in html_soup.select('#z-nvg-cognac-root z-grid-item img'):\n      \
  \  img_src = img.get('src')\n        if not img_src:\n            continue\n   \
  \     img_url = urljoin(url, img_src)\n        download(img_url)\n```\n\n接下来，我们将使用\
  \ t-SNE 聚类算法来对照片进行聚类。t-SNE 是一种相对较新的降维技术，特别适用于可视化高维数据集，比如图像。您可以在 [`https://lvdmaaten.github.io/tsne/`](https://lvdmaaten.github.io/tsne/)\
  \ 了解该技术。我们将使用\"scikit-learn\"以及\"matplotlib\"、\"scipy\"和\"numpy\"，这些都是数据科学家熟悉的库，可以通过\
  \ `pip` 安装：\n\n```\npip install -U matplotlib\npip install -U scikit-learn\npip\
  \ install -U numpy\npip install -U scipy\n```\n\n我们的聚类脚本如下所示：\n\n```\nimport os.path\n\
  import numpy as np\nimport matplotlib.pyplot as plt\nfrom matplotlib import offsetbox\n\
  from sklearn import manifold\nfrom scipy.misc import imread\nfrom glob import iglob\n\
  \nstore = 'images'\nimage_data = []\nfor filename in iglob(os.path.join(store, '*.jpg')):\n\
  \    image_data.append(imread(filename))\n\nimage_np_orig = np.array(image_data)\n\
  image_np = image_np_orig.reshape(image_np_orig.shape[0], -1)\n\ndef plot_embedding(X,\
  \ image_np_orig):\n    # 重新缩放\n    x_min, x_max = np.min(X, 0), np.max(X, 0)\n \
  \   X = (X - x_min) / (x_max - x_min)\n\n    # 根据 t-SNE 位置绘制图像\n    plt.figure()\n\
  \    ax = plt.subplot(111)\n    for i in range(image_np.shape[0]):\n        imagebox\
  \ = offsetbox.AnnotationBbox(\n            offsetbox=offsetbox.OffsetImage(image_np_orig[i],\
  \ zoom=.1),\n            xy=X[i],\n            frameon=False)\n        ax.add_artist(imagebox)\n\
  \nprint(\"计算 t-SNE 嵌入\")\ntsne = manifold.TSNE(n_components=2, init=\"pca\")\nX_tsne\
  \ = tsne.fit_transform(image_np)\nplot_embedding(X_tsne, image_np_orig)\nplt.show()\n\
  ```\n\n这段代码的工作原理如下。首先，我们加载所有图像（使用 `imread`），并将它们转换为一个 `numpy` 数组。`reshape` 函数确保我们得到一个\
  \ *n* x *3m* 的矩阵，其中 *n* 是图像数量，*m* 是每张图像的像素数，而不是一个 *n* x *r* x *g* x *b* 的张量。在构建\
  \ t-SNE 嵌入之后，我们使用 matplotlib 根据计算出的 x 和 y 坐标绘制图像，结果如图 9-9 所示（使用了大约一千张抓取的照片）。可以看出，这里的聚类主要受图像颜色的饱和度和强度驱动。\n\
  \n#### 图像尺寸\n\n幸运的是，我们抓取的所有图像都具有相同的宽度和高度。如果情况并非如此，我们首先需要进行尺寸调整，以确保每张图像都能在数据集中生成一个长度相等的向量。\n\
  \n![A463931_1_En_9_Fig9_HTML.jpg](img/A463931_1_En_9_Fig9_HTML.jpg)\n\n**图 9-9**\
  \ t-SNE 聚类的结果（应用于大约一千张照片）\n\n### 9.11 对抓取的亚马逊评论进行情感分析\n\n我们将要抓取某个特定产品的一系列亚马逊评论及其评分。我们将选择一本评论数量丰富的书，比如\
  \ Mark Lutz 的《Learning Python》，你可以在 [`https://www.amazon.com/Learning-Python-5th-Mark-Lutz/dp/1449355730/`](https://www.amazon.com/Learning-Python-5th-Mark-Lutz/dp/1449355730/)\
  \ 找到它。如果你点击“查看所有客户评论”，最终会到达 [`https://www.amazon.com/Learning-Python-5th-Mark-Lutz/product-reviews/1449355730/`](https://www.amazon.com/Learning-Python-5th-Mark-Lutz/product-reviews/1449355730/)。请注意，该产品的\
  \ ID 是“1449355730”，即使使用不包含产品名称的 URL [`https://www.amazon.com/product-reviews/1449355730/`](https://www.amazon.com/product-reviews/1449355730/)，同样可以访问。\n\
  \n#### 简单的 URL\n\n在编写网络爬虫之前，像我们这样尝试不同的 URL 总是一个好主意。基于上述内容，我们知道一个给定的产品标识符就足以获取评论页面，而无需费心找出包含产品名称的确切\
  \ URL。那么，为什么亚马逊允许这两种方式，并且默认包含产品名称呢？原因很可能是搜索引擎优化（SEO）。像谷歌这样的搜索引擎更喜欢包含人类可读组件的 URL。\n\
  \n如果您探索一下评论页面，会发现评论是分页显示的。通过浏览其他页面并在浏览器开发者工具中进行追踪，我们看到 POST 请求（由 JavaScript 发起）被发送到类似于\
  \ [`https://www.amazon.com/ss/customer-reviews/ajax/reviews/get/ref=cm_cr_arp_d_paging_btm_2`](https://www.amazon.com/ss/customer-reviews/ajax/reviews/get/ref=cm_cr_arp_d_paging_btm_2)\
  \ 的 URL，并在表单数据中包含了产品 ID，以及其他一些看起来相对容易模拟的表单字段。让我们看看请求能返回什么结果。\n\n\n\n```python\n\
  import requests\nfrom bs4 import BeautifulSoup\n\nreview_url = 'https://www.amazon.com/ss/customer-reviews/ajax/reviews/get/'\n\
  product_id = '1449355730'\n\nsession = requests.Session()\nsession.headers.update({\n\
  \    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\
  \ ' +\n                  '(KHTML, like Gecko) Chrome/62.0.3202.62 Safari/537.36'\n\
  })\nsession.get('https://www.amazon.com/product-reviews/{}/'.format(product_id))\n\
  \n\ndef get_reviews(product_id, page):\n    data = {\n        'sortBy': '',\n  \
  \      'reviewerType': 'all_reviews',\n        'formatType': '',\n        'mediaType':\
  \ '',\n        'filterByStar': 'all_stars',\n        'pageNumber': page,\n     \
  \   'filterByKeyword': '',\n        'shouldAppend': 'undefined',\n        'deviceType':\
  \ 'desktop',\n        'reftag': 'cm_cr_getr_d_paging_btm_{}'.format(page),\n   \
  \     'pageSize': 10,\n        'asin': product_id,\n        'scope': 'reviewsAjax1'\n\
  \    }\n    r = session.post(review_url + 'ref=' + data['reftag'], data=data)\n\
  \    return r.text\n\n\nprint(get_reviews(product_id, 1))\n```\n\n需要注意的是，这里我们伪造了`User-Agent`请求头。如果不这样做，亚马逊会回复一条消息，要求我们验证是否为真人（你可以从浏览器的开发者工具中复制这个请求头的值）。此外，请注意我们设置的`scope`表单字段值为`reviewsAjax1`。如果在浏览器中浏览评论页面，你会看到这个字段的值实际上每次请求都会递增，即`reviewsAjax1`、`reviewsAjax2`等。我们也可以选择模拟这种行为——如果亚马逊发现我们的策略，我们就必须这样做，不过目前看来，不这样做也能正常获取结果。\n\
  \n最后，注意 POST 请求返回的不是完整的 HTML 页面，而是一种手工编码的结果，通常由 JavaScript 解析：\n\n```\n[\"script\"\
  ,\n\"if(window.ue) { ues('id','reviewsAjax1','FE738GN7GRDZK6Q09S9G');\nues('t0','reviewsAjax1',new\
  \ Date());\nues('ctb','reviewsAjax1','1');\nuet('bb','reviewsAjax1'); }\"\n]\n&&&\n\
  [\"update\",\"#cm_cr-review_list\",\"\"]\n&&&\n[\"loaded\"]\n&&&\n[\"append\",\"\
  #cm_cr-review_list\",\"     <a class=\\\"a-link-normal\\\"title=\\\"5.0 out    \
  \  of 5 stars\\\"\n[...]\n```\n\n幸运的是，在稍微探索一下回复内容之后（你可以随意将完整的回复复制粘贴到文本编辑器中并通读一遍），其结构似乎很容易弄清楚：\n\
  \n-   回复由若干条“指令”组成，格式为 JSON 列表；\n-   指令之间由三个与符号`&&&`分隔；\n-   包含评论的指令以`append`字符串开头；\n\
  -   评论的实际内容格式化为 HTML 元素，位于列表的第三个位置。\n\n让我们调整代码，以结构化格式解析评论。我们将遍历所有指令；使用`json`模块转换它们；检查`append`条目；然后使用\
  \ Beautiful Soup 解析 HTML 片段，获取评论 ID、评分、标题和正文。我们还需要一个小的正则表达式来提取评分，评分被设置为一个类，其值类似于`a-start-1`到`a-star-5`。我们可以直接使用这些值，但简单地获取`1`到`5`可能更便于后续处理，因此我们在这里预先进行一些清理：\n\
  \n```python\nimport requests\nimport json\nimport re\nfrom bs4 import BeautifulSoup\n\
  \nreview_url = 'https://www.amazon.com/ss/customer-reviews/ajax/reviews/get/'\n\
  product_id = '1449355730'\n\nsession = requests.Session()\nsession.headers.update({\n\
  \    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\
  \ ' +\n                  '(KHTML, like Gecko) Chrome/62.0.3202.62 Safari/537.36'\n\
  })\nsession.get('https://www.amazon.com/product-reviews/{}/'.format(product_id))\n\
  \n\ndef parse_reviews(reply):\n    reviews = []\n    for fragment in reply.split('&&&'):\n\
  \        if not fragment.strip():\n            continue\n        json_fragment =\
  \ json.loads(fragment)\n        if json_fragment[0] != 'append':\n            continue\n\
