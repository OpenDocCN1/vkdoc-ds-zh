  : \"cntk\",\n    \"image_data_format\": \"channels_last\"\n}\n```\n\n#### 使用其他后端\n\
  \n如果你使用的是 `Tensorflow`，只需将 `backend` 值保留为 `tensorflow`。如果你使用的是 `theano`，请将该值设置为\
  \ `theano`。请注意，在后一种情况下，你可能还需要在系统中查找 `.theanorc.txt` 文件并修改其内容，以确保一切正常工作，尤其是 `device`\
  \ 条目，如果 `theano` 无法找到 GPU，则应将其设置为 `cpu`。\n\n完成此更改后，尝试在一个新的 REPL 会话中再次测试导入 `Keras`。现在你应该看到以下输出：\n\
  \n```python\n>>> import keras\nUsing CNTK backend\nSelected GPU[1] GeForce GTX 980M\
  \ as the process wide default device.\n```\n\n`Keras` 现已设置完成，并且能够识别我们的 GPU。如果 `CNTK`\
  \ 报错，请记得尝试 CPU 版本，但要注意，在这种情况下（以及只能使用 CPU 计算时的 `theano` 和 `Tensorflow`），训练模型所需的时间会显著增加。\n\
  \n现在我们可以创建另一个 Python 脚本来训练模型（`train.py`）：\n\n```python\nimport cv2\nimport pickle\n\
  from os import listdir\nimport os.path\nimport numpy as np\nfrom glob import glob\n\
  from sklearn.preprocessing import LabelBinarizer\nfrom sklearn.model_selection import\
  \ train_test_split\nfrom keras.models import Sequential\nfrom keras.layers.convolutional\
  \ import Conv2D, MaxPooling2D\nfrom keras.layers.core import Flatten, Dense\nfrom\
  \ constants import *\n\ndata = []\nlabels = []\nnr_labels = len(listdir(LETTERS_FOLDER))\n\
  \n##### 将每个图像转换为数据矩阵\nfor label in listdir(LETTERS_FOLDER):\n    for image_file\
  \ in glob(os.path.join(LETTERS_FOLDER, label, '*.png')):\n        image = cv2.imread(image_file)\n\
  \        image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\n        # 调整图像大小，使所有图像具有相同的输入形状\n\
  \        image = cv2.resize(image, MODEL_SHAPE)\n\n        # 扩展维度以满足 Keras 的要求\n\
  \        image = np.expand_dims(image, axis=2)\n        data.append(image)\n   \
  \     labels.append(label)\n\n##### 归一化数据，使每个值介于 0 和 1 之间\ndata = np.array(data,\
  \ dtype=\"float\") / 255.0\nlabels = np.array(labels)\n\n##### 创建训练-测试拆分\n(X_train,\
  \ X_test, Y_train, Y_test) = train_test_split(data, labels,\n                  \
  \                                    test_size=0.25, random_state=0)\n\n##### 对标签进行二值化\n\
  lb = LabelBinarizer().fit(Y_train)\nY_train = lb.transform(Y_train)\nY_test = lb.transform(Y_test)\n\
  \n##### 保存二值化结果供后续使用\nwith open(LABELS_FILE, \"wb\") as f:\n    pickle.dump(lb,\
  \ f)\n```\n\n\n\n##### 构建模型架构\n\n```\nmodel = Sequential()\nmodel.add(Conv2D(20,\
  \ (5, 5), padding=\"same\",\ninput_shape=(MODEL_SHAPE[0], MODEL_SHAPE[1], 1), activation=\"\
  relu\"))\nmodel.add(MaxPooling2D(pool_size=(2, 2), strides=(2, 2)))\nmodel.add(Conv2D(50,\
  \ (5, 5), padding=\"same\", activation=\"relu\"))\nmodel.add(MaxPooling2D(pool_size=(2,\
  \ 2), strides=(2, 2)))\nmodel.add(Flatten())\nmodel.add(Dense(500, activation=\"\
  relu\"))\nmodel.add(Dense(nr_labels, activation=\"softmax\"))\nmodel.compile(loss=\"\
  categorical_crossentropy\", optimizer=\"adam\", metrics=[\"accuracy\"])\n\n#####\
  \ 训练并保存模型\nmodel.fit(X_train, Y_train, validation_data=(X_test, Y_test),\nbatch_size=32,\
  \ epochs=10, verbose=1)\nmodel.save(MODEL_FILE)\n```\n\n我们在这里做了几件事。首先，我们遍历所有已生成的图像，调整其大小，并存储它们的像素矩阵以及对应的答案。接着，我们对数据进行归一化处理，使每个值都介于\
  \ 0 和 1 之间，这能让神经网络更容易处理。然后，由于 Keras 无法直接处理 `\"Q\"`、`\"W\"` 等标签，我们需要对其进行二值化处理：每个标签都被转换成一个输出顶点，每个索引对应一个可能的字符，其值设为\
  \ 1 或 0，这样一来，`\"Q\"` 就变成了 `[1, 0, 0, 0,…]`，`\"W\"` 则变成了 `[0, 1, 0, 0,…]`，依此类推。我们保存了这个转换关系，因为在应用模型时，我们还需要用它来将输出转换回字符。接下来，我们构建神经网络架构（实际上相对简单），并开始训练模型。如果你运行这个脚本，你会得到类似如下的输出：\n\
  \n```\nUsing CNTK backend\nSelected GPU[0] GeForce GTX 980M as the process wide\
  \ default device.\nTrain on 1665 samples, validate on 555 samples\nEpoch 1/10\n\
  C:\\Users\\Seppe\\Anaconda3\\lib\\site-packages\\cntk\\core.py:361: UserWarning:\
  \ your data is of type \"float64\", but your input variable (uid \"Input4\")\nexpects\
  \ \"\". Please convert your data           beforehand to speed up training.\n(sample.dtype,\
  \ var.uid, str(var.dtype)))\n32/1665 [..............................] - ETA: 36s\
  \ - loss: 3.0294 - acc: 0.0312\n64/1665 [>.............................] - ETA:\
  \ 22s - loss: 5.1515 - acc: 0.0312\n[...]\n1600/1665 [===========================>..]\
  \ - ETA: 0s - loss: 7.6135e-04 - acc: 1.0000\n1632/1665 [============================>.]\
  \ - ETA: 0s - loss: 8.3265e-04 - acc: 1.0000\n1664/1665 [============================>.]\
  \ - ETA: 0s - loss: 8.2343e-04 - acc: 1.0000\n1665/1665 [==============================]\
  \ - 3s 2ms/step - loss: 8.2306e-04 - acc:\n1.0000 - val_loss: 0.3644 - val_acc:\
  \ 0.9207\n```\n\n我们在验证集上获得了 92% 的准确率，这成绩相当不错！剩下的唯一一件事就是展示如何使用这个网络来预测验证码（`apply.py`）：\n\
  \n```\nfrom keras.models import load_model\nimport pickle\nimport os.path\nfrom\
  \ glob import glob\nfrom random import choice\nfrom functions import *\nfrom constants\
  \ import *\nwith open(LABELS_FILE, \"rb\") as f:\nlb = pickle.load(f)\nmodel = load_model(MODEL_FILE)\n\
  \n##### 我们在这里随机选取一张训练图像来演示预测的工作方式。在实际场景中，你显然会将其接入你的网络抓取流程，并传入一个\"实时的\"验证码图像。\nimage_files\
  \ = list(glob(os.path.join(CAPTCHA_FOLDER, '*.png')))\nimage_file = choice(image_files)\n\
  print('Testing:', image_file)\nimage = cv2.imread(image_file)\nimage = process_image(image)\n\
  contours = get_contours(image)\nletters = get_letters(image, contours)\nfor letter\
  \ in letters:\nletter = cv2.resize(letter, MODEL_SHAPE)\nletter = np.expand_dims(letter,\
  \ axis=2)\nletter = np.expand_dims(letter, axis=0)\nprediction = model.predict(letter)\n\
  predicted = lb.inverse_transform(prediction)[0]\nprint(predicted)\n```\n\n如果你运行这个脚本，你应该会看到类似如下的输出：\n\
  \n```\nUsing CNTK backend\nSelected GPU[0] GeForce GTX 980M as the process wide\
  \ default device.\nTesting: generated_images\\NHXS_322.png\nN\nH\nX\nS\n```\n\n\
  如你所见，网络正确地预测了验证码中的字符序列。这就结束了我们对验证码破解的简要介绍。正如我们之前讨论过的，请记住，存在几种替代方法，例如训练 OCR 工具包，或者以低成本使用提供“人工破解”的服务。同时请注意，如果你计划将这个想法应用于其他验证码，你可能需要对\
  \ OpenCV 和 Keras 模型进行微调，而且我们这里使用的验证码生成器仍然相对“简单”。然而，最重要的一点是，验证码本身就是一个警告，明确表示不欢迎网络爬虫。在开始四处破解验证码之前，请务必牢记这一复杂性。\n\
  \n#### 甚至传统模型也可能奏效\n\n正如我们所看到的，建立一个深度学习流程并非易事。如果你想知道像随机森林或支持向量机这样的传统预测建模技术是否也能奏效（例如，这两者在\
  \ `scikit-learn` 中都有提供，并且设置和训练起来快得多），答案是肯定的，在某些情况下它们确实可能有效，尽管准确率会大打折扣。这些传统技术难以理解图像的二维结构，而这正是卷积神经网络旨在解决的问题。话虽如此，我们曾使用随机森林和大约\
  \ 100 张手动标注的验证码图像搭建过流程，获得的准确率较低，大约只有 10%，但足以在尝试几次后得到正确的答案。\n\n## 索引\n\n### A\n\n\
