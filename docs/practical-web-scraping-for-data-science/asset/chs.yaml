  \n### 9.1 抓取 Hacker News\n\n我们将使用`requests`和 Beautiful Soup 抓取[`https://news.ycombinator.com/news`](https://news.ycombinator.com/news)的首页。如果你还不了解这个网站，请花些时间探索一下。Hacker\
  \ News 是一个流行的新闻聚合器，聚合了“黑客”（计算机科学家、企业家、数据科学家）感兴趣的新闻。\n\n在本示例中，我们将抓取到的信息存储在一个由字典对象组成的简单\
  \ Python 列表中。抓取该页面的代码如下所示：\n\n```\nimport requests\nimport re\nfrom bs4 import BeautifulSoup\n\
  articles = []\nurl = 'https://news.ycombinator.com/news'\nr = requests.get(url)\n\
  html_soup = BeautifulSoup(r.text, 'html.parser')\nfor item in html_soup.find_all('tr',\
  \ class_=\"athing\"):\nitem_a = item.find('a', class_=\"storylink\")\nitem_link\
  \ = item_a.get('href') if item_a else None\nitem_text = item_a.get_text(strip=True)\
  \ if item_a else None\nnext_row = item.find_next_sibling('tr')\nitem_score = next_row.find('span',\
  \ class_=\"score\")\nitem_score = item_score.get_text(strip=True) if item_score\
  \ else '0 points'\n\n#### 我们在此使用正则表达式来定位正确的元素\nitem_comments = next_row.find('a',\
  \ string=re.compile('\\d+(&nbsp;|\\s)comment(s?)'))\nitem_comments = item_comments.get_text(strip=True).replace('\\\
  xa0', ' ') \\\nif item_comments else '0 comments'\narticles.append({\n'link' : item_link,\n\
  'title' : item_text,\n'score' : item_score,\n'comments' : item_comments})\nfor article\
  \ in articles:\nprint(article)\n```\n\n这将输出以下内容：\n\n```\n{'link': 'http://moolenaar.net/habits.html',\
  \ 'title': 'Seven habits of    effective text editing (2000)', 'score': '44 points',\
  \ 'comments':     '9 comments'}\n{'link': 'https://www.repository.cam.ac.uk/handle/1810/251038',\
  \ 'title': 'Properties of expanding universes (1966)', 'score': '52 points',   \
  \  'comments': '8 comments'}\n[...]\n```\n\n尝试扩展此代码，以抓取评论页面的链接。思考一下，如果同时抓取评论本身（例如，在文本挖掘的背景下），可能会产生哪些潜在的用例。\n\
  \n### 9.2 使用 Hacker News API\n\n请注意，Hacker News 还提供了一个 API，提供结构化的 JSON 格式结果（参见[`https://github.com/HackerNews/API`](https://github.com/HackerNews/API)）。让我们重新编写\
  \ Python 代码，使其充当 API 客户端，而无需依赖 Beautiful Soup 进行 HTML 解析：\n\n```\nimport requests\n\
  articles = []\nurl = 'https://hacker-news.firebaseio.com/v0'\ntop_stories = requests.get(url\
  \ + '/topstories.json').json()\nfor story_id in top_stories:\nstory_url = url +\
  \ '/item/{}.json'.format(story_id)\nprint('Fetching:', story_url)\nr = requests.get(story_url)\n\
  story_dict = r.json()\narticles.append(story_dict)\nfor article in articles:\nprint(article)\n\
  ```\n\n这将输出以下内容：\n\n```\nFetching: https://hacker-news.firebaseio.com/v0/item/15532457.json\n\
  Fetching: https://hacker-news.firebaseio.com/v0/item/15531973.json\nFetching: https://hacker-news.firebaseio.com/v0/item/15532049.json\n\
  [...]\n{'by': 'laktak', 'descendants': 30, 'id': 15532457, 'kids': [15532761,\n\
  15532768, 15532635, 15532727, 15532776, 15532626, 15532700, 15532634], 'score':\
  \ 60, 'time': 1508759764, 'title': 'Seven habits of effective\ntext editing (2000)',\
  \ 'type': 'story', 'url': 'http://moolenaar.net/    habits.html'}\n[...]\n```\n\n\
  ### 9.3 待抓取的语录\n\n我们将使用`requests`和 Beautiful Soup 抓取[`http://quotes.toscrape.com`](http://quotes.toscrape.com/)。该页面由\
  \ Scrapinghub 提供，是一个更真实的抓取练习场。请花些时间探索该页面。我们将抓取所有信息，包括：\n\n*   语录，及其作者和标签；\n*   作者信息，即出生日期和地点，以及描述。\n\
  \n我们将把这些信息存储在 SQLite 数据库中。我们将使用`dataset`库（参见[`https://dataset.readthedocs.io/en/latest/`](https://dataset.readthedocs.io/en/latest/)），而不是使用`records`库并编写手动\
  \ SQL 语句。该库提供了一个简单的抽象层，无需完整的 ORM 模型就能省去大多数直接的 SQL 语句，这样我们就可以像使用 CSV 或 JSON 文件一样使用数据库来快速存储一些信息。可以通过`pip`轻松安装\
  \ dataset：\n\n```\npip install -U dataset\n```\n\n#### 并非完整的 ORM\n\n请注意，`dataset`\
  \ 并不打算取代像 SQLAlchemy 这样的完整 ORM（对象关系映射）库（尽管它在底层使用了 SQLAlchemy）。它的目的仅在于快速地将一批数据存储在数据库中，而无需定义模式或编写\
  \ SQL。对于更高级的用例，最好考虑使用真正的 ORM 库，或者手动定义数据库模式并进行手动查询。\n\n抓取该网站的代码如下所示：\n\n```\nimport\
  \ requests\nimport dataset\nfrom bs4 import BeautifulSoup\nfrom urllib.parse import\
  \ urljoin, urlparse\ndb = dataset.connect('sqlite:///quotes.db')\nauthors_seen =\
  \ set()\nbase_url = 'http://quotes.toscrape.com/'\ndef clean_url(url):\n\n#####\
  \ 将 '/author/Steve-Martin' 清理为 'Steve-Martin'\n\n##### 使用 urljoin 生成绝对 URL\nurl\
  \ = urljoin(base_url, url)\n\n##### 使用 urlparse 提取路径部分\npath = urlparse(url).path\n\
  \n##### 现在按 '/' 分割路径并获取第二部分\n\n##### 例如：'/author/Steve-Martin' -> ['', 'author',\
  \ 'Steve-Martin']\nreturn path.split('/')[2]\ndef scrape_quotes(html_soup):\nfor\
  \ quote in html_soup.select('div.quote'):\nquote_text = quote.find(class_='text').get_text(strip=True)\n\
  quote_author_url = clean_url(quote.find(class_='author') \\\n.find_next_sibling('a').get('href'))\n\
  quote_tag_urls = [clean_url(a.get('href'))\nfor a in quote.find_all('a', class_=\"\
  tag\")]\nauthors_seen.add(quote_author_url)\n```\n\n\n\n##### 存储此条引用及其标签\n`quote_id\
  \ = db['quotes'].insert({ 'text' : quote_text,\n'author' : quote_author_url })`\n\
  `db['quote_tags'].insert_many(\n[{'quote_id' : quote_id, 'tag_id' : tag} for tag\
  \ in quote_tag_urls])`\n```python\ndef scrape_author(html_soup, author_id):\n  \
  \  author_name = html_soup.find(class_='author-title').get_text(strip=True)\n  \
  \  author_born_date = html_soup.find(class_='author-born-date').get_text(strip=True)\n\
  \    author_born_loc = html_soup.find(class_='author-born-location').get_text(strip=True)\n\
  \    author_desc = html_soup.find(class_='author-description').get_text(strip=True)\n\
  \    db['authors'].insert({ 'author_id' : author_id,\n                         \
  \  'name' : author_name,\n                           'born_date' : author_born_date,\n\
  \                           'born_location' : author_born_loc,\n               \
  \            'description' : author_desc})\n```\n\n##### 从抓取所有引用页面开始\n`url = base_url`\n\
  ```python\nwhile True:\n    print('现在正在抓取页面：', url)\n    r = requests.get(url)\n\
  \    html_soup = BeautifulSoup(r.text, 'html.parser')\n\n    # 抓取引用\n    scrape_quotes(html_soup)\n\
  \n    # 是否有下一页？\n    next_a = html_soup.select('li.next > a')\n    if not next_a\
  \ or not next_a[0].get('href'):\n        break\n    url = urljoin(url, next_a[0].get('href'))\n\
  ```\n\n##### 现在提取作者信息\n```python\nfor author_id in authors_seen:\n    url = urljoin(base_url,\
  \ '/author/' + author_id)\n    print('现在正在抓取作者：', url)\n    r = requests.get(url)\n\
  \    html_soup = BeautifulSoup(r.text, 'html.parser')\n\n    # 抓取作者信息\n    scrape_author(html_soup,\
  \ author_id)\n```\n\n这会输出以下内容：\n\n```\n现在正在抓取页面：http://quotes.toscrape.com/\n现在正在抓取页面：http://quotes.toscrape.com/page/2/\n\
  现在正在抓取页面：http://quotes.toscrape.com/page/3/\n现在正在抓取页面：http://quotes.toscrape.com/page/4/\n\
  现在正在抓取页面：http://quotes.toscrape.com/page/5/\n现在正在抓取页面：http://quotes.toscrape.com/page/6/\n\
  现在正在抓取页面：http://quotes.toscrape.com/page/7/\n现在正在抓取页面：http://quotes.toscrape.com/page/8/\n\
  现在正在抓取页面：http://quotes.toscrape.com/page/9/\n现在正在抓取页面：http://quotes.toscrape.com/page/10/\n\
  现在正在抓取作者：http://quotes.toscrape.com/author/Ayn-Rand\n现在正在抓取作者：http://quotes.toscrape.com/author/E-E-Cummings\n\
  [...]\n```\n\n请注意，本代码仍有多种方法可以使其更加健壮。我们在抓取引用或作者页面时，并没有检查是否存在 `None` 结果。此外，我们使用 `\"\
  dataset\"` 来简单地在三个表中插入行。在这种情况下，`dataset` 会自动递增主键 `\"id\"`。因此，如果你想再次运行此脚本，必须首先清理数据库以重新开始，或者修改脚本以允许从中断处继续执行或正确更新结果。在后面的示例中，我们将使用\
  \ `dataset` 的 `upsert` 方法来实现这一点。\n\n脚本运行完毕后，你可以使用 SQLite 客户端（例如 `\"DB Browser for\
  \ SQLite\"`）查看数据库（`\"quotes.db\"`），该客户端可从 [`http://sqlitebrowser.org/`](http://sqlitebrowser.org/)\
  \ 获取。图 9-1 展示了该工具的实际运行情况。\n\n![A463931_1_En_9_Fig1_HTML.jpg](img/A463931_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1\n\n使用 `\"DB Browser for SQLite\"` 探索 SQLite 数据库\n\n### 9.4 待爬取书籍\n\n我们将使用\
  \ `requests` 和 Beautiful Soup 抓取 [`http://books.toscrape.com`](http://books.toscrape.com/)\
  \ 。该页面由 Scrapinghub 提供，是一个更真实的爬取练习场。请花一些时间探索这个页面。我们将抓取所有信息，即每本书会获取以下内容：\n\n*   书名；\n\
  *   封面图；\n*   价格和库存情况；\n*   评分；\n*   产品描述；\n*   其他产品信息。\n\n我们将把这些信息存储到 SQLite 数据库中，同样使用\
  \ `\"dataset\"` 库。不过，这次我们要将程序编写为能够处理更新的方式——这样我们就可以多次运行它，而不会在数据库中插入重复记录。\n\n抓取该网站的代码如下所示：\n\
  \n```python\nimport requests\nimport dataset\nimport re\nfrom datetime import datetime\n\
  from bs4 import BeautifulSoup\nfrom urllib.parse import urljoin, urlparse\ndb =\
  \ dataset.connect('sqlite:///books.db')\nbase_url = 'http://books.toscrape.com/'\n\
  def scrape_books(html_soup, url):\n    for book in html_soup.select('article.product_pod'):\n\
  \n        # 目前只存储书籍的 URL\n        book_url = book.find('h3').find('a').get('href')\n\
  \        book_url = urljoin(url, book_url)\n        path = urlparse(book_url).path\n\
  \        book_id = path.split('/')[2]\n\n        # upsert 优先尝试更新，然后才执行插入操作\n   \
  \     db['books'].upsert({'book_id' : book_id,\n                            'last_seen'\
  \ : datetime.now()\n                          }, ['book_id'])\ndef scrape_book(html_soup,\
  \ book_id):\n    main = html_soup.find(class_='product_main')\n    book = {}\n \
  \   book['book_id'] = book_id\n    book['title'] = main.find('h1').get_text(strip=True)\n\
  \    book['price'] = main.find(class_='price_color').get_text(strip=True)\n    book['stock']\
