  \ 作为起始点、添加实时幻灯片、编辑演示文稿详情（仅编辑名称）、打印演示文稿或删除演示文稿。如果你选中了一张幻灯片，你还可以创建自定义幻灯片（如果你正在编辑的是一张上传的幻灯片）、编辑你创建时选中的幻灯片以及编辑幻灯片内容（仅允许你编辑热点）。\n\
  \n**注意**\n\n许多用户开始使用 PowerPoint 离线创建演示文稿，或通过创建 PDF 来创建。通常，演示文稿是“实时”幻灯片（在工具中创建并访问实时数据）与这些上传幻灯片（包含离线创建的文本和图像）的组合。\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig32_HTML.jpg](img/510611_1_En_7_Fig32_HTML.jpg)\n\
  \n图 7-32 显示信息卡的继任组织结构图实时幻灯片演示\n\n1.  将幻灯片添加到演示文稿后，顶部的三个视图模式图标可以在以下模式间切换：将所有幻灯片显示为小图标、在底部滚动列表中选择幻灯片后查看其大预览图、或在演示模式下查看它们。\n\
  \n\n\n# 演示模式与导航\n\n1.  在演示模式下，您可以通过点击左箭头或右箭头来切换幻灯片，点击热区，或者点击实时幻灯片上显示的任意个人以查看其人才卡片，如图\
  \ 7-32 所示。\n2.  要共享演示，请点击分子图标。\n3.  将出现一个新弹出窗口，允许您按姓名或按组进行搜索（关于如何创建组，请参考第 5 章的“运行和使用矩阵网格报告”部分）。\n\
  4.  输入并选择姓名或组。根据需要重复此操作，直到您列出所有您想要共享的个人和组。\n5.  可选地，勾选复选框以向您正在与之共享的个人发送电子邮件。您也可以通过点击“自定义电子邮件”按钮来自定义此电子邮件。（您可以在“电子邮件通知模板设置”屏幕中编辑和激活此电子邮件模板）。\n\
  6.  点击“完成”以共享演示。\n7.  点击演示上的三点菜单图标以编辑标题、复制演示、将其移动到另一个文件夹或删除它。选择删除只会将演示移动到“回收站”文件夹。\n\
  8.  点击“与我共享”选项卡以查看其他人共享给您的演示。您只能查看和复制已共享给您的演示。\n9.  要返回主屏幕，请点击屏幕左上角的“演示”。\n10. 要退出演示模式，请点击屏幕左上角的下箭头（仅当鼠标悬停在其上时才会出现！）。\n\
  \n以我们的模范公司为例，我们的总裁以及任何支持的人力资源管理员，现在都可以使用一个工具，该工具将他们从为高级领导团队创建演示所需的手动流程中解放出来。他们可以快速为这些高管整理一份演示文稿，以有条理且引导式的方式呈现关于\
  \ SVP 和区域经理的最新事实信息，从而无需进行艰难的对话或尝试使用可能过时的电子表格作为参考。\n\n# 结论\n\n我们希望您喜欢这次配置和使用继任管理的探索之旅！至此，您应该对每个功能是什么以及如何配置和授权访问它们有了扎实的理解。此外，我们还根据实际经验逐步介绍了推荐的设置，并定期简要说明我们的模范公司将如何利用该模块的所有功能。凭借这套系统和实践应用知识，您应该能够很好地利用这个强大的继任工具赋能任何组织！\n\
  \n# 8. 结论\n\n恭喜您完成我们全面讲解 SAP SuccessFactors 人才管理模块和功能的第二卷！让我们回顾一下我们在两卷中学到的内容，以便了解这些模块如何协同工作，提供全面的人才管理解决方案。\n\
  \n在第一卷中，我们从人才档案和职位档案生成器开始。我们向您展示了如何存储、组织和显示员工及职位相关的人才管理数据，以便在 SuccessFactors Talent\
  \ 的各个模块中使用。然后，我们深入探讨了目标管理和绩效管理模块，向您展示了如何设定目标并衡量员工实现目标的成功程度。\n\n在本卷中，我们从深入探讨发展模块开始。第\
  \ 1、2、3 和 4 章介绍了各种员工发展功能。在第 1 章中，您学习了如何配置发展计划，包括从 SuccessStore 创建基本计划以及直接编辑 XML。类似地，第\
  \ 2 和第 3 章向您展示了如何配置职业工作表，以便员工可以通过与职位档案生成器集成，查看建议的角色并针对特定角色进行发展。在第 4 章中，我们学习了如何为三种不同类型的标准导师计划设置管理员和参与者，或者如何创建一个适合您组织需求的自定义导师计划，以将员工聚集在一起促进他们的职业发展。总的来说，这些章节向您展示了系统如何帮助员工设定发展目标、与经理合作实现这些目标、将目标与特定学习联系起来、瞄准特定角色和职业路径，以及通过导师制在直属经理之外寻求帮助。\n\
  \n最后，在第 5、6 和 7 章中，您探索了继任管理模块。第 5 章向您介绍了配置和使用九宫格及人才评审表，并展示了它们如何整合到校准中。第 6 章探讨了提名如何工作，以及如何配置继任组织图以利用各种数据来帮助决策者进行关键职位提名。在第\
  \ 7 章中，我们探索了其他有用的工具，如人才搜索、人才库、职位磁贴视图、谱系图和演示。总之，您看到了继任管理模块如何利用整个人才管理套件的数据来识别顶尖人才，并协助决策者进行关键职位的继任决策。\n\
  \n在回顾了这两卷的所有章节之后，我们希望您现在能够认识到 SAP SuccessFactors 的功能和模块所支持的高层业务流程。此外，我们希望您能看到这些模块如何整合成一个连贯的解决方案。确实，当正确实施和使用时，SAP\
  \ SuccessFactors 可以帮助员工和组织协同设定并跟踪业务和发展目标，同时提供有价值的职业发展机会，帮助企业和员工共同成功。在下一节中，我们将介绍如何通过实施一个全面高效的系统来实现这一潜在的业务价值。\n\
  \n\n\n# 实现商业价值与后续步骤\n\n在回顾中，我们逐一讲解了每个章节，从宏观层面描绘了每个模块和功能所带来的商业价值。在整本书中，我们还融入了实际经验以及示范公司案例，为配置决策提供建议。此外，我们指出了每个模块如何相互关联，从而构建成一个统一的解决方案。\n\
  \n实施咨询的艺术在于理解客户需求，同时平衡这些需求与实用性和典型做法之间的关系。这需要通过汲取关于可能性的知识以及他人的成功经验来实现，同时不忘如何提供真正的长期价值。希望阅读本书后，您已基于我们的技术知识和实际案例，获得了大量所需的知识。现在的关键在于理解业务优先级，并利用产品将其转化为商业价值。设定并实现这些优先级的第一步，就是规划系统部署。\n\
  \n## 规划您的部署\n\n通过了解完整的人才管理套件的功能以及各模块如何协同工作，您可以规划如何推进组织的实施工作。通常，我们看到人才管理套件中的各个模块是逐一部署的，而不是采用“大爆炸”式的方法。我们有意识地按照我们推荐（并且经常看到）客户部署各个模块和功能的顺序来安排章节结构。但这并非意味着这是推荐部署人才管理套件的唯一方式。\n\
  \n例如，许多组织在实施 `Job Profile Builder` 之前，需要时间来创建职位目录，因此他们可能会在部署 `目标管理` 和 `绩效管理` 时，不与\
  \ `Job Profile Builder` 建立任何关联。他们甚至可能在未使用 `Job Profile Builder` 的情况下部署 `发展` 和 `继任`\
  \ 模块，待职位目录完成后，再通过较小规模的迭代来添加集成功能。诸如传统绩效考核系统合同到期之类的事件，往往会驱动时间表——但我们发现，在这些场景下，如果对整个套件有前瞻性的认识，可以避免在后续实施其他模块时进行返工。最终的部署计划应同时考虑业务优先级和时间价值因素。\n\
  \n## 实施\n\n在制定了部署策略和时间表后，就可以开始第一个模块的实施了！无论是合作伙伴还是客户，都应确保熟悉 `SAP Activate` 实施方法论。从宏观角度看，该方法论采用了敏捷方法。通常，实施过程会经历三个迭代周期：在工作手册中收集客户需求，配置系统，向业务相关方演示，然后根据反馈进行重新配置，最后正式上线。通常，配置在测试实例中完成，待所有测试完成并获得业务相关方批准后，再迁移到独立的生产实例。实施过程可能充满挑战，但根据我们的经验，人才管理模块是使用\
  \ `SAP SuccessFactors` 实施起来最直接的模块之一。\n\n## 上线后的生命周期\n\n一旦实施完成，系统其实才刚刚开始发挥其有用性。重要的是要认识到，作为一款云产品，`SAP\
  \ SuccessFactors` 并非静态不变。在撰写本书时，SAP 每年进行两次重大版本发布。这些版本会首先部署在测试数据中心的测试实例中，然后再迁移到客户的生产实例，以便客户在版本部署到生产环境之前有机会进行探索。这些版本通常包含所有模块的产品增强功能。务必查看产品发布计划详情，了解每个版本包含哪些新功能和变更功能的具体日期和细节。SAP\
  \ 还为其每个产品模块未来几年的发展愿景提供了路线图。我们建议定期查看这些信息，以便调整您的持续系统维护和部署策略，从而充分利用最新的技术增强功能，并根据业务优先级的变化调整系统方向。\n\
  \n根据我们的经验，系统上线后，会有一个持续的工作循环：与业务相关方合作，定期用新的相关功能更新系统，并向用户传达这些发布变更。作为一款不断演进的产品，目睹 `SAP\
  \ SuccessFactors` 的未来发展令人兴奋！\n\n## 最后的思考\n\n感谢您与我们一同探索 `SAP SuccessFactors` 的各项功能和模块！我们希望您的阅读体验是积极的，并且您会像我们一样喜欢实施和管理\
  \ `SAP SuccessFactors`。如果您是这项技术的新手，我们欢迎您加入社区，并迎接它带来的激动人心的职业机会。如果您是经验丰富的专业人士，我们希望您能学到新东西。如果您只是在评估，我们希望您能考虑这款全面的产品。祝您在人才管理的征程上一帆风顺，并期待在行业中与您相遇！\n\
