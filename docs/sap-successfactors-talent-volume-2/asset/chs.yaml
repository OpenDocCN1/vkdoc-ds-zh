  \ | 实现发展目标的里程碑表：一个目标可以有多个里程碑。 |\n| `Competency` | 将发展目标与能力关联；一个目标可以关联多个能力。 |\n\n\
  请注意，当我们从`SuccessStore`下载模板时，其中几个字段并未出现在计划中。要使用这些字段（`Metric`、`Tasks`、`Milestones`、`Weight`、`Done`），需要将它们添加到\
  \ XML 中。\n\n`State`字段通常用作发展目标的状态字段。它被定义为一个以颜色显示的文本值，通常呈现为下拉列表，每个值都关联了背景色和字体颜色。列表中的最后一个值表示发展目标的完成。当目标完成后，不能再向该目标添加学习活动。\n\
