  \ 20 个以内。\n\n职业工作表模板的权限\nXML\n对职业工作表以及特定职业工作表计划的访问权限由实例中的基于角色的权限控制。在职业工作表中查看、添加或删除目标工作角色的权限，以及职业工作表中某些字段的读取权限，均在职业工作表模板\
