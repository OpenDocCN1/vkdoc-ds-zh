- '# 内容权限


  内容权限控制发展目标计划中各字段的可见性以及用户允许执行的操作。操作权限控制用户可在发展计划上执行的操作。“查看”和“写入”权限控制指定角色在创建或编辑发展目标时可以查看和写入哪些字段。发展计划同时支持公开目标和私有目标，因此您可以根据组织的需求，为这两种类型的目标配置不同的角色权限。


  #### 操作权限


  如表 1-8 所示，描述了用户可在发展计划上执行的操作。


  **表 1-8 — 发展模板 XML 中的操作**


  | 操作 | 描述 |

  | --- | --- |

  | `Private-access` | 访问私有目标的权限。 |

  | `Create` | 创建发展目标的权限。 |

  | `Delete` | 删除发展目标的权限。 |

  | `Move` | 在发展计划中上下移动发展目标的权限。 |

  | `Share` | 将私有目标设为公开的权限。 |


  典型的操作权限如下：


  - 员工和经理可以创建、删除和移动发展目标。

  - 将目标设为私有。

  - 经理的经理和 HR 经理层级可以进入员工的发展目标计划进行查看。


  由于不支持发展目标的级联和对齐，您可以从模板中移除所有级联和取消对齐的操作，包括 `cascade-push`、`cascade-pull`、`cascade-align`、`unalign-parent`
  和 `unalign-child`。接下来，您需要确定哪些角色可以执行这些操作，并相应更新模板。实例中基于角色的权限定义了哪些角色可以访问发展计划，但如果没有发展计划
  XML 中的权限，计划数据将不可见。


  在创建或编辑目标时，用户可以将其设为私有。`private-access` 权限标识了哪些角色可以在目标计划上看到私有目标。使用 `private-access`
  操作来标识可以查看私有目标的角色，如下面的代码片段示例所示：


  此操作权限将允许用户将目标标记为私有，从而限制只有被授权的角色才能在计划中看到这些目标。在此示例中，只有员工、其经理层级和 HR 经理才能看到员工计划中的私有目标。发展计划通常被视为员工与其经理之间的私密内容，因此所有目标都可能是私有的。因此，您可能需要完全移除计划中的“可见性”列。


  移除该列需要四个步骤：


  1.  从模板中移除“共享”权限。

  2.  移除 `private-access` 权限。

  3.  将属性 `new-obj-share-status-public` 更改为 `"false"`，或从模板中移除该属性。

  4.  将属性 `use-text-for-privacy` 更改为 `"false"`。


