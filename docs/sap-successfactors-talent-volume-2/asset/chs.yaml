  \    4.  要访问文件夹并查看其中的演示文稿，请单击该文件夹的名称。\n    5.  要创建演示文稿，请单击“+”号。\n        1.  在出现的弹出窗口中输入演示文稿名称，然后单击“确定”。你将看到\
  \ Presentations 编辑屏幕加载，如图 7-30 所示。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig30_HTML.jpg](img/510611_1_En_7_Fig30_HTML.jpg)\n\
