  ```\n\n**开关**\n\n在 XML 中的这些元素之后，可以添加一系列开关。开关用于开启或关闭功能。职业工作表模板中可能使用的开关如表 2-1 所示。\n\
  \n**表 2-1** 职业工作表 XML 开关汇总\n\n| 开关 | 描述 | 默认值 |\n| --- | --- | --- |\n| `cws-dispoption-competency-desc`\
