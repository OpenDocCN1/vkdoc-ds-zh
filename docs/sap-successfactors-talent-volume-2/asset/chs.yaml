  \n## 矩阵网格退休资格配置屏幕\n\n某些组织可能希望在员工接近退休年龄时自动显示退休资格图标。这在继任规划讨论中非常有用，有助于识别可能因退休而即将离职的员工。\n\
  \n> **注意**\n> 最终用户无法手动编辑此字段。它将仅根据“出生日期”和“入职日期”字段自动开启。请确保在配置前，Talent Profile 中已包含这些字段。有关更多信息，请参见第\
  \ 1 卷，第 2 章。\n\n要配置“退休资格”功能，请遵循以下步骤：\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig15_HTML.jpg](img/510611_1_En_5_Fig15_HTML.jpg)\n\
  \n**图 5-15** 退休资格设置配置屏幕\n\n1.  确保已配置退休资格图标（请参见本章中的“矩阵网格图标配置屏幕”部分），并且 Talent Profile\
  \ 中已包含“出生日期”和“入职日期”字段。\n2.  在搜索栏中键入并选择“Matrix Grid Reports: Retirement Eligibility”。\n\
  3.  屏幕将显示如图 5-15 所示的“退休资格设置”屏幕。\n4.  输入年龄阈值和服务年限阈值，并根据组织政策在下拉列表中选择“and”或“or”。选择“and”将要求两个条件均被满足时图标才会显示，而“or”则在任意一个条件满足时显示图标。\n\
  5.  单击“Save”。\n\n## 运行和使用矩阵网格报告\n\n现在，我们已经完成了矩阵网格的配置，是时候看看它的实际效果了！在引言中，我们提到了矩阵网格可以显示的多个位置。可以查看矩阵网格信息的主要报告是“Performance-Potential\
  \ Matrix”和“How vs. What Matrix”。\n\n> **注意**\n> 请记住，这些报告的标准名称可以根据您的配置进行更改！在以下导航步骤中，我们将引用标准名称。如果您更改了名称，请单击您自定义的名称。\n\
  \n以我们模型公司为例，这些报告可用于区域总裁和当前负责销售部门的 SVP，以便在尚未为空缺的 SVP 销售职位确定继任者时，寻找团队中的高潜力人才，或者仅用于检查他们当前的提名是否仍以高潜力水平表现良好。\n\
  \n### 运行报告的先决条件\n\n除了本章已介绍的配置之外，可能还需要执行一些额外的配置。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig16_HTML.jpg](img/510611_1_En_5_Fig16_HTML.jpg)\n\
  \n**图 5-16** 动态组屏幕\n\n1.  确保已为您的公司加载了部门、子部门和地点。在基本的人才管理实施中，这些会在您加载用户数据文件中的字段时自动填充。\n\
  2.  如果您想使用任何动态组，请确保在尝试运行报告之前添加这些组。为此，请单击登录用户的头像图标，然后选择“Settings”。在左侧菜单中，选择“Groups”。单击“Create\
  \ New Group”以添加一个组。示例如图 5-16 所示。\n\n### 运行报告\n\n要运行任一报告，请遵循以下步骤：\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig17_HTML.jpg](img/510611_1_En_5_Fig17_HTML.jpg)\n\
  \n**图 5-17** Performance-Potential Matrix 报告\n\n1.  导航至 `Succession ➤ Performance-Potential\
  \ Matrix` 或 `Succession ➤ How vs. What Matrix`。\n2.  屏幕将加载您选择的报告，如图 5-17 所示。\n3.\
  \  通过单击铅笔图标选择评估周期日期范围。如果您选择多个年份，请记住，您在配置期间选择的设置将影响结果显示的是最新评分还是平均评分。\n4.  接下来，选择目标人群。首先，从单选按钮中选择“Team\
  \ View”、“Succession Management and Matrix Report Permissions”或“Group”：\n    -  \
  \ **团队视图**：使用此选项显示从特定经理开始及其下属的团队成员。填写选项，指定要包含在筛选条件中的经理向下层数，以及要从中选择的部门、子部门和地点（部门、子部门和地点配置作为平台配置的一部分执行）。例如，如果我们的区域总裁有权在运营部门内查找所有地区的高绩效员工，他可以在“Starting\
  \ From”字段中选择 CEO、所有层级，并选择整个运营部门。\n    -   **继任管理和矩阵报告权限**：此选项将为您提供有权查看的所有结果（请参见本章前面的“权限”部分）。选择此选项后，出现的唯一额外筛选条件是部门、子部门和地点。根据需要输入这些条件的选项。例如，如果某位\
  \ HR 管理员正在协助我们的区域总裁寻找高绩效和高潜力候选人，并且有权查看整个公司，他们可以选择此选项并选择运营部门以细化条件。\n\n\n\n### 3.\
  \ 群组\n此选项列出系统中已创建的所有动态组。您无法在此处添加动态组，只能选择已创建好的组。动态组有助于进行临时分组，例如，如果 HR 管理员希望通过动态组标记某些无法通过常规选择条件定义的用户，以对其进行跟踪。\n\
  \n### 3. 输入选择条件后，点击“Generate”运行报告。\n\n**注意**\n\n通常，矩阵网格报告可能返回空结果或令人困惑的结果。我们建议按照以下步骤进行故障排查：\n\
  \n1.  **检查报告运行的日期——您运行的是当前年份还是去年？**\n2.  **在配置界面中，确保数据源正确，并且在报告选择条件中所选年份内，您在配置中选择的员工档案和流程中确实存在数据。**\n\
  3.  **检查您是否拥有适当的基于角色的权限，以查看选择条件中您试图查看的人员。**\n4.  **是否在矩阵网格报告配置界面中选择了“All data sources”数据源？或者是否勾选了“Use\
  \ average of all found ratings, instead of latest”？** 这可以解释为何会显示来自其他流程的意外评级，或者为何会出现跨多个年份的评级平均值。\n\
  \n## 使用报告\n\n按照上一节中的说明运行报告后，报告将根据您的配置显示，如图 5-18 所示。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig18_HTML.jpg](img/510611_1_En_5_Fig18_HTML.jpg)\n\
  \n**图 5-18** 绩效-潜力矩阵报告\n\n**注意**\n\n这是一个只读报告。要编辑候选人的位置，必须编辑配置中所选数据源中的数据。要编辑每个员工旁边显示的图标相关的数据，必须在“人才档案”界面上编辑该员工的“人才档案”数据。\n\
  \n我们将从上到下、从左到右逐一查看上图中出现的每个图标的功能：\n\n1.  点击`filter`图标可重新打开上一节中介绍的选择条件界面。\n2.  点击`eye`图标可打开显示选项。这将根据您的图标配置，添加/移除不同图标的显示。\n\
  3.  点击`person`图标可在矩阵右侧打开一个区域，显示选择条件内根据您的配置属于“太新无法评级”或“未评级”的员工。\n4.  点击`print`图标可打开打印预览界面，您可以在其中打印矩阵。\n\
  5.  点击`download`图标可下载关于矩阵及每个人才类别详细信息的 Excel 报告。\n6.  点击`“i”`图标可打开您在矩阵配置中可能添加的链接（如果未添加链接，此图标将不会显示）。\n\
  7.  点击`display both name and photo`图标可显示所有员工及其照片和照片右侧的信息（上图当前即选中此选项）。\n8.  点击`display\
  \ name only`图标可移除照片，仅显示姓名。此选项有助于在单元格中查看更多员工。\n9.  点击`display photo only`图标可仅显示矩阵上员工的照片。此选项也有助于在单元格中查看更多员工。\n\
  10. 点击一个矩阵单元格可展开该单元格，显示其中更多的员工（如果适用）。\n11. 点击一个员工的姓名/照片可显示该员工的人才卡片。我们将在下一章介绍人才卡片配置。可以同时打开多张人才卡片，以便对员工进行并排比较。\n\
  \n## 人才评估表\n\n人才评估表是一种特殊类型的独立绩效表，旨在与矩阵网格信息配合使用。它提供了一种表单，可以使用矩阵网格布局动态地对员工数据进行绩效和潜力更改。\n\
  \n**注意**\n\n虽然独立的人才评估表是继任管理的一部分，但它可能并非适合所有组织。在设计人才管理和继任流程时，最重要的决策之一是如何保持人才数据的新鲜度——是使用像人才评估表这样的表单，作为大型综合绩效表单的一部分，还是仅使用人才档案数据。从本节中获得的最重要信息是，将潜力评级包含在表单中的唯一方法是在表单中包含“绩效潜力总结”部分。否则，矩阵网格的唯一数据源将是“员工人才档案”中的潜力字段。同样，要使目标-能力评级显示在人才档案中，员工必须在包含“目标能力总结”部分（尽管该部分可以隐藏）的表单上获得评级。\n\
  \n以我们的模型公司为例，总裁和销售高级副总裁将使用人才评估表（或备选的综合绩效表单和/或校准方法）作为年度评估流程的一部分，为潜在继任者分配 9 宫格位置。这样，人才数据将在系统中定期更新，并在需要进行继任提名或调动时准备就绪。\n\
  \n## 配置人才评估表的先决条件\n\n由于人才评估表运行于绩效模块之上，所需的先决条件配置是相同的。请参见第 1 卷第 6 章和第 7 章了解这些先决条件。与其他绩效表单不同，人才评估表在使用前还必须完成矩阵网格配置。这是因为该表单将使用配置中的评级量表、定义的轴配置、单元格颜色和标签。\n\
  \n## 配置人才评估表\n\n与绩效表单类似，人才评估表在“管理模板”界面中进行配置。请按照以下步骤配置表单：\n\n**注意**\n\n通常，人才评估表在客户实例或`SuccessStore`中并不可用。在这种情况下，请从`Provisioning`的演示系统中下载一份副本，并通过目标实例中的`Provisioning`上传。或者，您也可以通过创建一个绩效表单并添加“绩效潜力总结”部分或“目标能力总结”部分（取决于您要编辑的矩阵类型），从头开始创建一个。这些部分也可以添加到年度绩效评估表中，以制作一个综合表单，而不是单独的人才评估表。\n\
  \n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig19_HTML.jpg](img/510611_1_En_5_Fig19_HTML.jpg)\n\
  \n**图 5-19** 人才评估表中的绩效潜力总结部分配置\n\n1.  在搜索栏中输入并选择“Manage Templates”以访问“管理模板”界面。\n\
  2.  点击人才评估表的名称以选择它。\n\n**注意** 以下示例表单包含一个“简介”部分、一个“绩效潜力总结”部分和一个“评论”部分。由于“简介”和“评论”部分已在第\
  \ 1 卷第 7 章关于绩效管理的部分中介绍过，我们在此仅介绍“绩效潜力总结”部分。“目标能力总结”部分类型提供相同的配置选项，只是使用这些字段作为输入，并提供一个从“目标”和“能力”部分查看计算后评级的选项，因此不再单独介绍。\n\
  \n\n\n### 3. 点击“绩效 vs. 潜力”版块。屏幕将如图 5-19 所示加载。\n\n1. 为`版块名称`输入一个文本值，例如“绩效 vs. 潜力”或“九宫格”。\n\
  2. （可选）输入针对该版块的最终用户描述或说明。\n3. 点击“显示高级选项…”以查看下列项目。\n4. “显示版块评论”框的操作方式与其他版块中的此类框相同，评估者可在其中添加针对该版块的评论。如果希望启用这些评论，请选中此框。\n\
  5. 根据需要勾选“允许编辑总体绩效评级”、“允许编辑总体潜力评级”和“显示总体绩效-潜力矩阵”。这些选项将使该版块表单中的绩效和潜力字段可编辑，并提供一个可视化的矩阵网格，供员工被评主体拖放至所需单元格。\n\
  \n**注意** 如果实施独立的**人才评审表**，我们建议开启此处所有三个选项。如果使用的是包含完整绩效周期和潜力评级的综合绩效表单，则可能只需开启“允许编辑总体潜力评级”，并隐藏其他选项。\n\
  \n6. “版块显示顺序”单选按钮仅控制绩效字段和潜力字段在矩阵上方的显示顺序。\n7. 其余选项用于权限设置。有关这些权限如何运作的更多详细信息，请参阅第 1\
  \ 卷，第 6 章至[第 10 章](https://doi.org/10.1007/978-1-4842-6995-4_10)。\n\n## 启动和管理人才评审表流程\n\
  \n人才评审表必须分配路由图，并像其他绩效表单一样启动和管理。有关如何创建和关联路由图、启动表单以及管理流程的详细说明，请参阅第 1 卷，第 6 章至[第 10\
  \ 章](https://doi.org/10.1007/978-1-4842-6995-4_10)。您可能还希望在此类路由图的末尾包含一个校准会议。有关设置校准会议的详细信息，可参考第\
  \ 1 卷的[第 14 章](https://doi.org/10.1007/978-1-4842-6995-4_14)和[第 15 章](https://doi.org/10.1007/978-1-4842-6995-4_15)。\n\
  \n## 作为最终用户使用人才评审表\n\n人才评审表启动后，将像其他任何绩效表单一样遵循路由图。一旦表单作为路由图步骤的一部分到达最终用户处，表单将出现在用户的“绩效收件箱”以及主页“待办事项”版块的“审核绩效”磁贴中。\n\
  \n请按照以下步骤使用表单：\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig20_HTML.jpg](img/510611_1_En_5_Fig20_HTML.jpg)\n\
  \n**图 5-20** 人才评审表 – 绩效 vs 潜力版块\n\n1. 导航至绩效模块以加载绩效收件箱，然后点击该员工的人才评审表。表单加载后，您将能够查看如图\
  \ 5-20 所示的“绩效 vs. 潜力”版块。\n2. 点击绩效或潜力旁边的“？”图标以查看评级量表。\n3. 您可以通过将一个单元格拖放到另一个单元格，或在绩效和潜力下拉菜单中选择数值，来调整员工在矩阵网格中的位置。首先在下拉菜单中选择值以放置员工，然后尝试拖放以更改评级。\n\
  4. “尚新无法评级”和“未评级”框显示在底部——您也可以将员工拖入或拖出这些区域。务必先点击向下箭头展开这些框。\n5. 评审者还可以选择仅查看正在被评审的一名员工、所有已评估的员工，或仅查看直接下属。通过取消选中两个框或选中其中一个（两个复选框不能同时选中）在这三种模式间切换。\n\
  \n**注意** 对于管理者而言，使用“我的直接下属”选项最为有用。HR 管理员可能会选择“所有已评估的员工”，因为他们支持的员工很可能不是其直接下属。“所有已评估的员工”允许评审者查看其出现在路由图中的所有已创建表单的员工。\n\
  \n6. 点击名片图标将打开该员工的名片。请注意，这与矩阵报告、演示文稿和校准中出现的人才卡片不同。\n7. 点击矩阵上其他员工的姓名，视图将切换至该员工的表单。评审者随后可以更改被点击员工的放置位置。\n\
  \n**注意** 这种即时切换表单的功能可能会让最终用户感到些许困惑。务必在您的变更管理/培训会议中涵盖此内容！正在编辑的员工姓名和照片将在表单顶部切换，以提示评审者当前所在的是哪位员工的表单。\n\
  \n8. 完成评级后，点击“最终确定表单”，将表单移至被评定员工路由图中的下一步。\n\n至此，您已完成对该员工的评审！该员工的矩阵网格报表数据现在将显示（前提是此表单被包含为数据源，且当前日期包含在您的选择条件中）。如果您选择不包含处理中的表单，则必须确保在结果显示在报告中之前完成路由图。\n\
  \n## 可选的校准步骤\n\n在此，我们还想提一下校准环节。一些组织将这些校准会议视为流程中矩阵网格排版的最终确定环节。在此场景下，您需要配置路由图，使得在每位管理者评审完其员工之后，有一个校准步骤，让管理者小组和/或其他参与者共同参加校准会议，并商定个体的最终排版。在此场景下，管理者为绩效和潜力以及/或者目标和能力输入的评级，可能会被校准会议所覆盖。\n\
  \n在第 1 卷的[第 14 章](https://doi.org/10.1007/978-1-4842-6995-4_14)和[第 15 章](https://doi.org/10.1007/978-1-4842-6995-4_15)中，我们概述了校准会议的所有配置选项，这应能指导您将人才评审表（或包含绩效和潜力以及/或者目标和能力的大型绩效表单）作为校准会议中的数据源。我们恳请您牢记，校准会议也可用于决定通过继任管理显示的人才档案/继任数据模型字段的值（我们将在后续章节中更详细地介绍这些内容）。因此，值得提及的是，校准可以作为一个全面的工具来进行人才评审，其范围不仅仅是对绩效评级应用正态分布曲线！我们发现，校准的这些额外功能在设计与实际公司合作的人才评审流程中非常有用。\n\
  \n\n\n# 结论\n\n在阅读本书两卷至此的内容后，您已掌握足够信息，可配置独立式人才评审表或综合绩效表单中的 `绩效潜力摘要` 和 `目标能力摘要` 部分（后者将\
  \ `绩效潜力摘要` 部分作为年度绩效周期中众多环节之一）。本章内容应能帮助您理解数据如何被填充至矩阵网格报告，并如何出现在我们将在接下来两章介绍的继任管理模块的其他功能中。\n\
  \n# 6. 核心继任管理\n\n上一章中，我们重点介绍了九宫格与人才评审表。这些功能为我们提供了关于组织中哪些人员值得纳入继任规划的基础信息。现在，我们将聚焦继任管理的核心功能：将员工提名为岗位候选人。我们将首先配置模块中随处可见的人才卡片，随后深入配置提名功能——该步骤至关重要，因其将贯穿整个模块使用。之后，我们将通过\"\
  继任组织架构图\"部分的说明，实际运用提名设置来提名员工。\n\n## 人才卡片\n\n人才卡片是可配置的弹出窗口，用于展示员工额外的人才详情。通过配置，可显示与您组织最相关的信息。人才卡片出现在多个位置：继任组织架构图、谱系图、职位磁贴视图、MDF\
  \ 人才池、矩阵网格报告、校准会议及演示文稿。本节将教授如何配置人才卡片，并以最终用户视角进行查看。\n\n### 配置人才卡片的前提条件\n\n要配置人才卡片，首先需要获得权限：\n\
  \n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig1_HTML.jpg](img/510611_1_En_6_Fig1_HTML.jpg)\n\
  \n**图 6-1** 管理人才卡片配置权限\n\n1.  在搜索栏中输入并选择 `管理权限角色`。\n2.  页面加载后，点击您希望修改的角色。然后点击 `权限...`。\n\
  3.  `管理人才卡片配置` 权限可在权限设置的 `管理人才卡片` 部分找到，如图 6-1 所示。点击 `完成`。\n\n### 配置人才卡片\n\n请按以下配置步骤操作：\n\
  \n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig2_HTML.jpg](img/510611_1_En_6_Fig2_HTML.jpg)\n\
  \n**图 6-2** 管理人才卡片配置界面\n\n1.  在搜索栏中输入并选择 `管理人才卡片`，以访问配置界面。您将看到如图 6-2 所示的界面。\n\n\
  > **注意**\n> 您会看到实际上有三种人才卡片可供配置。每个界面的配置选项相同，因此我们仅介绍继任人才卡片的配置。继任人才卡片配置将应用于继任组织架构图、谱系图、职位磁贴视图、MDF\
  \ 人才池以及矩阵网格报告中的人才卡片。校准人才卡片仅在校准会议中显示。演示文稿人才卡片仅在演示文稿中显示。我们建议将三种类型配置为相互一致，除非高级领导层对演示文稿或校准会议有特殊差异要求。\n\
