  \ `Role Readiness Assessment` 表单。\n\n无论哪种情况，如果使用表单中的评级，都应在职业工作表模板 XML 中添加 `<*assessment-filter*>`\
  \ 过滤器来标识评级来源。必须引用表单模板 ID。你可以在“表单模板管理”下的“Provisioning”中找到表单 ID，如图 2-6 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig6_HTML.jpg](img/510611_1_En_2_Fig6_HTML.jpg)\n\
  \n**图 2-6** 带 ID 的表单模板\n\n若要使用多个能力评级来源，表单 ID 应以逗号分隔列出。当包含多个表单时，系统将使用最近完成的表单中的评级：\n\
