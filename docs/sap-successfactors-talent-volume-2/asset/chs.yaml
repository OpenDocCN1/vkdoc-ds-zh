  \ 4-16 所示，选择其中一种辅导计划类型。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig16_HTML.jpg](img/510611_1_En_4_Fig16_HTML.jpg)\n\
  \n**图 4-16** 自定义计划的选择\n\n通过从“辅导计划文本替换选项”列表中选择新定义的文本包，计划将使用这些标签，而非系统默认标签。这些标签适用于辅导界面以及系统生成的辅导邮件。你可以使用新标签创建公开报名、受监督或非受监督计划，而无需更改标准计划的标签。\n\
  \n自定义计划创建完成后，当用户进入“辅导”功能进行注册时，他们将看到这个新计划，并且该计划将包含新的标签，如图 4-17 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig17_HTML.jpg](img/510611_1_En_4_Fig17_HTML.jpg)\n\
  \n**图 4-17** 使用自定义标签的公开报名计划\n\n\n  \n所有之前对导师、学员或导师计划的引用现在都将引用新标签。  \n\n现在回到“详细信息”页面。根据您正在创建的导师计划类型，填写“导师计划详细信息”页面，保存，然后继续到下一个界面。\
  \  \n\n正如我们在表 4-4 中之前所见，`Mentors`和`Mentees`页面包含在监督式和未监督式导师计划中。这些界面不适用于开放注册计划，因为此类计划对所有人开放，员工可以注册为导师、学员，或两者兼备。\
  \  \n\n`Mentors`和`Mentees`页面用于确定哪些员工将被邀请参与导师计划。  \n\n`Mentors`页面如图 4-18 所示。  \n\n\
  ![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig18_HTML.jpg](img/510611_1_En_4_Fig18_HTML.jpg)\
  \  \n\n**图 4-18**  \n用于确定受邀导师的`Mentors`页面  \n\n在`Mentors`和`Mentees`页面上，使用名称搜索来选择个人或已设置好的任何组。\
  \  \n\n对于监督式和未监督式计划，`Mentees`页面与`Mentors`页面看起来相同，并且遵循相同的逻辑。在此，管理员将选择那些将收到邀请以学员身份加入导师计划的员工。\
  \  \n\n所有类型的导师计划都包含“报名表”页面。此页面用于创建参与者在报名时需要回答的问题。匹配规则也将在此处定义。在匹配过程中，系统将根据这些规则进行推荐匹配。\
  \  \n\n界面示例如图 4-19 所示。  \n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig19_HTML.jpg](img/510611_1_En_4_Fig19_HTML.jpg)\
  \  \n\n**图 4-19**  \n用于创建问题的报名表  \n\n`Signup Form`界面上显示的字段如表 4-5 所示。在创建表单时，请审阅这些描述，以指导您创建问题和匹配规则。\
  \  \n\n**表 4-5**  \n报名表创建页面上的问题字段  \n\n| 报名表字段 | 描述 |\n| :--- | :--- |\n| `Question\
  \ Category` | 如果问题是从选择列表中回答的，请确定要使用的选择列表。另一种选项是自由格式文本。使用此选项时，没有“匹配依据”字段和匹配类型。如果您不使用问题，请选择一个类别以用于员工资料匹配。为了让导师能够与学员匹配，所有问题不能都是自由格式文本。\
  \ |\n| `Matching Based On` | 偏好、资料、学员偏好或导师偏好。• 基于偏好匹配：导师和学员根据他们对问题的回答进行匹配。• 学员偏好：使用此匹配类型，问题仅针对学员。导师不会在他们的报名表上看到该问题。匹配基于学员的回答和导师的员工资料。•\
  \ 导师偏好：使用此匹配类型，问题仅针对导师。学员不会在他们的报名表上看到该问题。匹配基于导师的回答和学员的员工资料。• 资料：此匹配类型不使用问题。匹配基于导师和学员的员工资料进行。\
  \ |\n| `Questions to Mentor` | 提供一个要问导师的问题。这是一个文本字段，可以本地化。此问题仅在导师注册计划时可见。 |\n| `Questions\
  \ to Mentee` | 提供一个要问学员的问题。这是一个文本字段，可以本地化。此问题仅在学员注册计划时可见。 |\n| `Key Question` |\
  \ 如果一个问题被标记为“关键”，并且导师和学员对该问题的回答不匹配，那么他们将不会被匹配。 |\n| `Matching Type` | 选项为“已匹配”或“不匹配”。匹配的进行方式取决于参与者的回答或匹配的员工资料。\
  \ |\n| `Weight` | 如果每个问题的权重留空，则问题权重均等。否则，应输入 1-100 的整数。权重总和必须为 100。 |\n| `Email\
  \ Template Setup: Mentor invitation and Mentee invitation` | 仅对监督式和未监督式计划可见。管理员可以修改所发送的电子邮件邀请的标准文本。\
  \ |\n\n每个问题必须填写的字段如图 4-20 所示。  \n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig20_HTML.jpg](img/510611_1_En_4_Fig20_HTML.jpg)\
  \  \n\n**图 4-20**  \n报名表页面上问题的字段  \n\n根据所选的问题类别，某些字段将会变灰。表 4-6 指出了哪些字段可用于每个文本问题和选择列表。由于选择列表有四种匹配选项，因此需要填写的字段会有所不同。\
  \  \n\n**表 4-6**  \n根据问题类别要填写的字段  \n\n| 问题类别 | 匹配依据 | 给导师的问题 | 给学员的问题 | 关键问题 | 匹配类型\
  \ | 权重 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 自由格式文本 | N/A | X\
  \ | X | N/A | N/A | N/A |\n| 选择列表 | 偏好 | X | X | X | X | X |\n| 选择列表 | 资料 | N/A\
  \ | N/A | X | X | N/A |\n| 选择列表 | 学员偏好 | N/A | X | X | X | X |\n| 选择列表 | 导师偏好 |\
  \ X | N/A | X | X | X |\n\n使用“问题类别”字段来识别问题中使用的选择列表，这样当导师和学员回答问题时会显示相应的值。选择列表后，确定匹配标准。“匹配依据”偏好将决定该问题在报名表上会显示哪些字段。\
  \  \n\n请注意，使用自由文本问题时，回答限制为 128 个字符。此外，这些答案不用于匹配，也不用于匹配算法。这些答案主要是信息性的，因为当在导师/学员的导师偏好中查看潜在人选时可能会看到这些回答。\
  \  \n\n导师和学员将在注册过程中回答问题。推荐的导师由所使用的问题以及每个问题的匹配规则共同定义。  \n\n匹配顺序的规则包括：  \n\n*   学员选择一个首选的导师，除非该导师已达到允许的最大学员人数。\
  \  \n*   学员选择多个首选导师，则与匹配分数最高的导师进行匹配。  \n*   如果学员的首选导师不可用，则学员将与匹配分数最高的导师进行匹配。  \n\
  *   如果学员未选择首选导师，则学员将与匹配分数最高的导师进行匹配。  \n\n监督式计划使用不同的方法来计算匹配。映射程序将在本章后面讨论。  \n\n对于监督式和未监督式计划，管理员将可以选择更新发给导师和学员的电子邮件邀请。电子邮件模板如图\
  \ 4-21 所示。要修改电子邮件模板，请点击“设置”。在此，管理员可以修改导师和学员邀请的主题和电子邮件正文。  \n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig21_HTML.jpg](img/510611_1_En_4_Fig21_HTML.jpg)\
  \  \n\n**图 4-21**  \n用于编辑的电子邮件通知  \n\n在创建问题并在适用情况下修改电子邮件邀请后，管理员将前往“摘要”界面。在创建过程中使用的每个界面的内容都将显示在“摘要”页面上。图\
  \ 4-22 展示了一个监督式导师计划“摘要”页面的示例。  \n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig22_HTML.jpg](img/510611_1_En_4_Fig22_HTML.jpg)\
  \  \n\n**图 4-22**  \n监督式计划的摘要页面  \n\n\n\n进行任何更新后，程序可以被删除、保存或启动。如果保存表单但未启动，程序设置状态为`Draft`，并保留在概览页面的`Not\
  \ Started`存储桶中。如果启动，邀请将发出，报名随即开始。让我们快速回顾一下程序创建过程，并重点说明基于程序类型的一些差异。\n\n## 开放报名计划\n\
  \n创建过程包含三个界面：`Mentoring Program Details`、`Signup Form` 和 `Summary`。此类计划不使用日期，也不邀请导师或被指导者。该计划对任何人开放，可作为导师、被指导者或两者兼任。如果您不希望计划对所有人开放，也可指定一个群组。开放报名的一个独特之处在于，管理员可以选择让导师的参与需经经理或管理员批准。\n\
  \n如果您将计划配置为需要经理批准，则必须使用主页磁贴。请前往 `Manage Home Page` ➤ `To-Do Settings` ➤ `Show/Hide\
  \ To-Do Tiles`，如图 4-23 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig23_HTML.jpg](img/510611_1_En_4_Fig23_HTML.jpg)\n\
  \n**图 4-23：** 显示/隐藏待办事项磁贴\n\n必须启用`Approve Requests`待办事项磁贴，如图 4-24 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig24_HTML.jpg](img/510611_1_En_4_Fig24_HTML.jpg)\n\
  \n**图 4-24：** 启用“批准请求”待办事项磁贴\n\n配置完成后，当员工需要经理批准才能以导师身份参与开放报名计划时，经理的主页上将出现一个待办事项磁贴，他们可以在该磁贴上批准或拒绝请求。\n\
  \n所有计划细节设置完毕后，即可启动计划。此时，该计划将出现在概览页面的*In-Progress*部分。\n\n在开放报名启动过程中，管理员可以发送加入计划的邀请。与监督型和非监督型计划不同，这里没有邀请邮件。相反，管理员需要创建一封邮件，并包含一个指向该计划的深层链接。要查找深层链接，请前往概览页面找到该计划。点击计划名称，查看`Details`选项卡。向下滚动即可看到深层链接，如图\
  \ 4-25 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig25_HTML.jpg](img/510611_1_En_4_Fig25_HTML.jpg)\n\
  \n**图 4-25：** 开放报名计划内的深层链接\n\n导师和被指导者的链接不同，因为需要回答的问题基于各自的视角，并且在指导流程中需要执行不同的步骤。但是，如果您打算允许任何人成为导师或被指导者，可以将两个链接都放在邮件中。\n\
  \n收到邮件通知后，导师和被指导者即可前往报名页面进行注册。如果导师加入需要管理员批准，管理员需要进入计划并接受或拒绝请求，如图 4-26 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig26_HTML.jpg](img/510611_1_En_4_Fig26_HTML.jpg)\n\
  \n**图 4-26：** 向指导管理员发送的导师参与请求通知\n\n拒绝请求将向导师发送一封邮件，并将该计划从导师的`My Mentoring Programs`选项卡中移除。批准则会使导师可供匹配，并移除其待处理状态。\n\
  \n在报名期间的任何时候，管理员都可以返回计划进行更改，例如添加问题、更改日期或更改所有者。此时他们将看到`Mentors`、`Mentees`和`Matches`选项卡。管理员可以查看谁已加入、谁有导师，还可以分配或重新分配匹配。该计划将持续开放，直到管理员关闭它。对于监督型和非监督型计划也是如此。\n\
  \n## 创建监督型和非监督型指导计划\n\n管理员遵循与创建开放报名指导计划相同的初始步骤。表 4-7 展示了一些功能及其在两种计划类型之间的区别。\n\n\
  **表 4-7：** 计划类型比较\n\n| 功能 | 监督型计划 | 非监督型计划 |\n| --- | --- | --- |\n| 明确的开始和结束日期，严格规定导师和被指导者何时可以报名。一旦被指导者开始报名，导师报名即关闭。\
  \ | 日期更灵活，因此被指导者可以在导师报名进行中时报名。 |\n| 手动将计划推进到下一步。 | 基于日期，系统自动将计划推进到下一步，也可选择手动推进。\
  \ |\n| 邀请邮件必须由管理员手动发起。 | 邀请邮件根据计划定义的开始日期自动发送，或可手动完成。 |\n| 被指导者邀请发出后，已受邀的导师将无法再报名。\
  \ | 对于导师和被指导者，报名期在计划结束前一天结束。 |\n| 使用匹配开始日期。 | 不使用匹配开始日期。 |\n| 可在匹配前编辑问题。 | 只要计划尚未结束，即可编辑问题。\
  \ |\n| 根据配置和偏好进行匹配，但管理员可以编辑匹配。 | 提供匹配指导，但由被指导者直接联系导师。 |\n| 被指导者在报名时不必选择导师。如果他们确实选择了导师，在匹配程序运行之前不会向该导师发送邮件。\
  \ | 被指导者报名时，必须选择一位导师。请求会立即发送给该导师。 |\n| 无需导师批准。匹配程序结束后，导师和被指导者将通过邮件收到他们的匹配结果。 | 导师必须批准被指导者的请求才能完成匹配。如果不批准，管理员可以手动进行匹配。\
  \ |\n| 导师和被指导者可在报名期间退出，但之后不能决定重新报名。 | 导师和被指导者可在报名期间退出，但之后不能决定重新报名。 |\n| 管理员可以在计划启动后添加、编辑和删除报名表单问题，以及修改匹配规则。\
  \ | 管理员可以在计划启动后添加、编辑和删除报名表单问题，以及修改匹配规则。 |\n| 被指导者报名开始日期不能与导师开始日期相同或早于导师开始日期。 | 被指导者报名开始日期不能与导师开始日期相同或早于导师开始日期。\
  \ |\n| 导师开始日期不能是当前日期。 | 导师开始日期不能是当前日期。 |\n| 匹配触发计划从`Not Started`转变为`In-Progress`。\
  \ | 无匹配程序。 |\n| 在匹配程序运行之前，管理员不会在计划中看到`Matches`选项卡。 | 在导师收到邀请后，管理员将看到`Matches`选项卡。\
  \ |\n| 在匹配程序运行之前，管理员无法分配或重新分配导师和被指导者。 | 一旦有导师和被指导者注册了计划，管理员即可进行分配和重新分配。 |\n| 计划在匹配程序完成且管理员进行任何重新分配之前，不会显示为`In-Progress`。\
  \ | 一旦被指导者完成报名且管理员进行任何匹配重新分配后，计划即显示为`In-Progress`。 |\n\n### 监督型指导计划\n\n监督型指导计划使用明确的开始和结束日期，并且管理员必须通过点击计划上的按钮手动发送邀请，如图\
  \ 4-27 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig27_HTML.jpg](img/510611_1_En_4_Fig27_HTML.jpg)\n\
  \n**图 4-27：** 管理员指导概览页面上的监督型计划\n\n\n\n确认后，邮件将发送给在项目创建期间被识别为导师的所有员工。在报名期间的任何时候，管理员都可以返回项目进行更改，例如添加问题、更改日期或更改负责人。但是，导师开始日期不能更改，也不能再添加导师。\n\
  \n一旦学员开始日期到来，管理员必须返回概览页面，在计划的学员开始日期发送学员邀请。如果管理员在指定的学员开始日期之前发送邮件，则不能再有导师注册。同样，在报名期间，管理员仍可进行项目更改。然而，一旦学员邀请发出，学员开始日期就不能更改，也不能再添加学员。\n\
  \n管理员等待导师和学员注册或退出项目。学员和导师的加入时间没有重叠。对于受监督的项目，匹配将根据配置的匹配开始日期开始。在匹配程序运行之前，管理员不会在项目中看到“匹配”选项卡。管理员将看到所有已加入或退出的导师和学员，并可查看他们的偏好。\n\
  \n学员注册完成后，管理员将手动启动匹配程序，如图 4-28 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig28_HTML.jpg](img/510611_1_En_4_Fig28_HTML.jpg)\n\
  \n图 4-28 设置为运行匹配程序的受监督项目\n\n在管理员查看匹配结果并手动进行任何调整之前，项目不会进入“进行中”状态。一旦匹配最终确定，管理员将启动项目。邮件将发送给导师和学员，通知他们各自的辅导伙伴。\n\
  \n**非受监督辅导项目**\n\n对于非受监督的项目，系统将根据项目创建时确定的开始日期自动发送项目邀请。但是，管理员可以在系统发送日期之前手动发送邀请。学员注册也采用相同的流程。根据创建项目时确定的开始日期，学员邀请将被发出，或者管理员可以手动发送邀请。\n\
  \n在此期间，管理员可以进行项目更改，并查看已加入、退出或未回复的导师和学员。“匹配”选项卡也将可见，因此管理员可以看到学员所做的导师选择。管理员还可以进行任何匹配重新分配。一旦管理员审查了匹配结果并做出了最终更改，项目将进入“进行中”状态。任何导师发生变更的人都会收到电子邮件通知。\n\
  \n项目现已全面运行。受监督和非受监督的辅导项目将持续运行，直到其结束日期或由管理员终止。如果配置允许，导师和学员也可以结束他们的辅导关系。\n\n**管理项目**\n\
  \n我们之前已经简要介绍了通知开始发出后管理员可以执行的操作。现在我们将更深入地了解这些功能。如前所述，管理员或负责人使用“管理辅导项目”工具从项目概览屏幕进行所有项目管理。除创建项目外，负责人可以执行所有项目管理功能。\n\
  \n项目创建后，辅导管理员可以对项目进行更改、查看导师和学员、查看匹配结果以及分配和重新分配匹配。这将根据辅导项目的不同而在不同时间进行。\n\n对于所有项目类型，辅导管理员可以在流程的任何步骤查看项目。根据项目状态，管理员可以修改问题、更改导师/学员限制、将导师标记为不可用或进行匹配。\n\
  \n对于受监督的项目，问题和匹配规则可以在匹配程序运行之前修改。对于开放注册和非受监督的项目，可以在项目结束之前进行更改。\n\n一旦学员和导师成为项目的一部分，管理员可以更改辅导关系，并为未分配的学员分配导师。\n\
  \n如果管理员在启动后添加问题，则这些问题适用于添加问题后注册的人员。现有参与者如果编辑他们的偏好，将会看到新问题。\n\n管理员删除问题后，后续注册的人员将看不到已删除的问题。已经注册的人员也不会再看到该问题。\n\
  \n所有项目类型都支持手动匹配功能。在回顾手动匹配功能后，我们将介绍受监督项目使用的匹配程序。\n\n**管理员匹配**\n\n对于开放注册和非受监督的辅导项目，一旦项目邀请发出，管理员将在项目中看到“匹配”选项卡。此选项卡在受监督项目中不可见，直到匹配程序运行后才会显示。“匹配”选项卡有两个子选项卡：“已匹配”和“未匹配”。“已匹配”选项卡包含基于导师批准学员请求的分配。没有推荐匹配或请求被拒绝的学员将出现在“未匹配”选项卡中。图\
  \ 4-29 显示了“未匹配”选项卡。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig29_HTML.jpg](img/510611_1_En_4_Fig29_HTML.jpg)\n\
  \n图 4-29 未匹配或未分配的导师和学员\n\n在图 4-30 中，管理员为一名学员选择了一位新导师。这是基于可用导师进行的。如果允许导师有多名学员且尚未达到上限，他们也将作为可能的导师出现。\n\
  \n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig30_HTML.jpg](img/510611_1_En_4_Fig30_HTML.jpg)\n\
  \n图 4-30 管理员分配导师\n\n辅导管理员也可以在“已匹配”选项卡中更改现有的辅导关系。这是通过从导师列表中删除学员来实现的。当学员出现在“未匹配”选项卡中时，管理员可以进行新的匹配。\n\
  \n一旦管理员将项目移至“进行中”状态，任何导师的变更都将触发电子邮件通知。如果管理员删除一个关系，学员将收到电子邮件通知。如果建立了新的辅导关系，则会向导师和学员发送电子邮件通知。\n\
  \n受监督项目具有一个映射项目功能，该功能在其他两种辅导项目类型中不可用。以下将对此进行详细说明。\n\n\n\n# 监督制项目的匹配程序\n\n导师与学员之间的匹配基于注册表单问题所设定的规则。匹配规则决定了推荐匹配结果。匹配程序首先通过关键问题的匹配规则进行筛选，若不满足规则，则导师与学员不被视为匹配。若基于某个关键问题的规则存在匹配，系统则会继续根据附加问题的匹配规则进行匹配。对于非关键问题，系统会对比偏好或员工档案来计算匹配分数。\n\
  \n技能与能力类问题基于所选列表值的匹配数量进行匹配。匹配值数量除以学员的总值数量即为匹配分数，范围是 0–100。其余的标准选项列表和自定义选项列表问题采用\
  \ 0 或 100 的分数。导师与学员之间至少需要有一个值匹配，该问题才能获得 100 分。\n\n所有匹配分数累加后得到导师的最终分数。如果各问题权重不同，则权重也将纳入最终匹配分数的计算。\n\
  \n系统最多为每位学员推荐十位导师。匹配采用星级制，共分四个匹配等级：\n\n1.  首选匹配（四星）：基于注册时选择的优先导师\n2.  优秀匹配（三星）：匹配分数达到\
  \ 75%或以上\n3.  良好匹配（两星）：匹配分数在 50%–74.99%之间\n4.  一般匹配（一星）：匹配分数在 49.99%或以下\n\n一旦匹配程序完成，管理员可以点击项目名称查看项目详情。\n\
  \n只有在匹配程序运行之后，`Matches`（匹配结果）选项卡才会显示。该选项卡最多可列出 200 个匹配结果。图 4-31 展示了`Matched`（已匹配）选项卡的示例。\n\
  \n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig31_HTML.jpg](img/510611_1_En_4_Fig31_HTML.jpg)\n\
  \n**图 4-31** 监督制项目中的匹配程序结果\n\n如图 4-32 所示的示例，管理员可以按匹配等级进行筛选，以便查看更易于管理的匹配列表。如果有数百条记录需要审核，筛选功能可以让查找更改内容变得更加轻松。\n\
  \n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig32_HTML.jpg](img/510611_1_En_4_Fig32_HTML.jpg)\n\
  \n**图 4-32** 通过筛选缩小匹配列表范围\n\n管理员可以删除任何匹配记录，这会导致该导师和学员都进入`Not Matched`（未匹配）选项卡。此外，可能会有一些未分配导师或未达到匹配标准的学员，他们也会出现在`Not\
  \ Matched`选项卡中。管理员需要为所有未匹配的学员分配导师。如果允许一名导师指导多名学员，或者导师数量过剩，也可能出现没有学员的导师。\n\n在`Not\
  \ Matched`选项卡中，会显示前 500 个未匹配的记录。随着配对关系的分配，该列表将包含超出初始 500 个未匹配记录的其他名字。`Not Matched`（未匹配）结果将包括因学员不足而剩余的导师，或因导师不足而剩余的学员。\n\
  \n管理员可以按导师或学员进行筛选，如图 4-33 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig33_HTML.jpg](img/510611_1_En_4_Fig33_HTML.jpg)\n\
  \n**图 4-33** 通过筛选查看未匹配的参与者\n\n管理员可以根据剩余可用的导师或学员进行分配。当所有匹配决策完成后，管理员返回概览页面，点击项目的“开始”按钮。项目状态将从`Not\
  \ Started`（未开始）变为`In-Progress`（进行中）。\n\n随后，导师匹配邮件会发送给导师和学员，告知他们各自的匹配结果。如果学员在注册时选择了推荐导师，但管理员或匹配程序更改了分配，学员将收到通知，并获知新导师的姓名。接下来，就由导师和学员自行会面，并确定他们希望通过导师制实现的目标。\n\
  \n项目将保持`In-Progress`（进行中）状态，直到项目结束日期，或直到管理员手动强制项目完成，届时项目状态将变为`Finished`（已完成）。\n\n\
  # 用户访问导师制功能\n\n在从参与者角度介绍导师制项目的生命周期之前，我们先了解员工如何访问项目。\n\n要访问`Development`（发展）下的`Mentoring`（导师制）选项卡，用户需要拥有`Career\
  \ Development Plan (CDP) Access Permission`（职业发展计划访问权限）和`Mentoring Programs Access\
  \ Permission`（导师制项目访问权限）。\n\n所有与员工导师制相关的功能均通过`Mentoring overview`（导师制概览）页面访问：\n\n\
  -   访问当前参与中的导师制项目\n-   注册基于邀请的项目\n-   注册开放报名项目\n\n`Mentoring overview`（导师制概览）页面由三个选项卡组成：\n\
  \n1.  **My Mentoring Programs**（我的导师制项目）是默认选项卡，包含用户当前参与的所有项目。\n2.  **Invitations**（邀请）包含对监督制和非监督制项目的邀请。这些是用户已被邀请但尚未注册的项目。\n\
  3.  **Open Enrollment**（开放报名）包含用户有资格加入的开放报名项目。\n\n员工的`Mentoring overview`（导师制概览）页面示例如图\
  \ 4-34 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig34_HTML.jpg](img/510611_1_En_4_Fig34_HTML.jpg)\n\
  \n**图 4-34** 参与者导师制概览页面\n\n在此示例中，该员工当前已注册两个项目，一个作为导师，一个作为学员。同时还有一个待处理的邀请。\n\n监督制和非监督制项目的邀请会显示在`Invitations`（邀请）选项卡中，而开放报名项目则显示在`Open\
  \ Enrollment`（开放报名）选项卡中。\n\n现在，我们将从用户的角度来看导师制项目的生命周期。项目类型不同导致的行为差异会予以注明。\n\n## 导师注册\n\
  \n在所有类型的项目中，导师应优先注册。学员需要选择导师，因此项目中必须有可供选择的导师。\n\n管理员启动监督制或非监督制导师项目后，邀请会发送给导师。发送给导师的邀请示例如图\
  \ 4-35 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig35_HTML.jpg](img/510611_1_En_4_Fig35_HTML.jpg)\n\
  \n**图 4-35** 导师邀请邮件\n\n导师可以使用邮件邀请中的链接访问注册表单，或前往`Mentoring`（导师制）页面查看请求。任何新邀请都会出现在`Invitations`（邀请）选项卡中，如图\
  \ 4-36 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig36_HTML.jpg](img/510611_1_En_4_Fig36_HTML.jpg)\n\
  \n**图 4-36** 待注册项目的邀请选项卡\n\n导师需要点击“Sign Up As Mentor”（注册为导师）按钮加入，或选择退出：\n\n-   对于监督制项目，如果导师在学员注册开始日期前未注册，则导师注册通道将关闭，他们将无法注册。\n\
  \n\n\n## 程序类型与导师注册\n\n对于**无监督**项目，即使在学员注册开始后，导师也可以继续注册。导师和学员都可以在辅导项目开始日期的前一天之前进行注册。\n\
  \n对于**开放注册**项目，如图 4-37 所示，邀请函位于`Open Enrollment`选项卡中，用户可以注册为导师、学员或两者皆是。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig37_HTML.jpg](img/510611_1_En_4_Fig37_HTML.jpg)\n\
  \n*图 4-37 包含邀请函的开放注册选项卡*\n\n对于**开放注册**项目，没有退出选项。如果您不注册，您就不会加入该项目。由于日期是开放式的，受邀者可以在以后加入。对于开放注册项目，可以以导师或学员的身份进行注册。\n\
  \n所有三种项目类型在注册过程中都使用相同的三个界面：欢迎、偏好和完成。\n\n欢迎页面如图 4-38 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig38_HTML.jpg](img/510611_1_En_4_Fig38_HTML.jpg)\n\
  \n*图 4-38 用于加入或退出的欢迎页面*\n\n欢迎页面显示项目名称和描述，以及注册截止日期和项目的开始与结束日期。对于开放注册项目，不会列出注册日期或项目开始与结束日期。\n\
  \n对于**受监督**和**无监督**项目，可以选择拒绝邀请。要退出项目，用户将点击“退出”按钮。在确认他们希望拒绝邀请后，该项目将从用户的`Invitations`（邀请）选项卡中移除。不会因退出项目而生成任何电子邮件，并且该项目将不再出现在项目概览页面上。如果他们之后改变主意，将无法注册。\n\
  \n对于**开放注册**项目，会有加入的选项，但没有退出选项。如果他们不采取任何行动，他们就不会成为项目的一部分。但是，只要项目尚未关闭，他们可以随时进入并注册。\n\
  \n偏好页面在所有项目中使用。这是为了找到匹配对象而回答问题的地方。导师将回答问题以便与学员匹配。导师不会进行任何学员选择。这由学员或匹配程序决定。\n\n示例如图\
  \ 4-39 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig39_HTML.jpg](img/510611_1_En_4_Fig39_HTML.jpg)\n\
  \n*图 4-39 导师的偏好页面*\n\n在注册期间，如果项目已配置为允许导师带多个学员，则导师可以更改学员人数。\n\n回答问题后，导师即完成注册，注册过程中的最后一个界面将显示，如图\
  \ 4-40 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig40_HTML.jpg](img/510611_1_En_4_Fig40_HTML.jpg)\n\
  \n*图 4-40 导师注册完成*\n\n导师可以查看项目详情、编辑偏好设置以及更改他们在项目中的可用状态。项目级别的概览页面如图 4-41 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig41_HTML.jpg](img/510611_1_En_4_Fig41_HTML.jpg)\n\
  \n*图 4-41 导师的项目概览页面*\n\n注册后，该项目将从`Invitations`（邀请）选项卡移动到`My Mentoring Programs`（我的辅导项目）选项卡。\n\
  \n### 开放注册导师注册的特殊情况\n\n对于**开放注册**项目，项目可能被设置为要求导师获得经理或管理员批准才能参与。在这种情况下，导师状态为待定。在获得批准之前，导师不会成为项目的一部分。这意味着潜在的导师不能更改其偏好设置、更改可用性或查看项目详情。\n\
  \n导师的经理将收到一封电子邮件，引导他们访问其主页。将有一个`To-Do`（待办）磁贴来批准该请求。`To-Do`磁贴如图 4-42 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig42_HTML.jpg](img/510611_1_En_4_Fig42_HTML.jpg)\n\
  \n*图 4-42 用于导师批准的经理待办磁贴*\n\n如果经理拒绝该请求，经理可以选择添加一条备注，该备注将在导师收到拒绝通知时包含在内。\n\n同样，如果导师需要获得管理员批准才能加入，则管理员必须批准该请求。有两种拒绝类型：拒绝文档或拒绝导师参与。通过拒绝支持文档，可以在通知中添加备注，以便导师知道需要重新提交什么。导师状态保持为待定，直到获得批准。如果管理员批准，导师就成为项目的一部分。导师现在可以在其`My\
  \ Mentoring Programs`（我的辅导项目）选项卡中看到该项目，并可以以导师身份查看或以学员身份注册。\n\n如果被拒绝，导师将从项目中移除，并且该项目将不再显示在`My\
  \ Mentoring Programs`（我的辅导项目）选项卡中。导师仍然可以通过返回主页上的`Open Enrollment`（开放注册）选项卡并点击“注册为学员”来以学员身份加入。\n\
  \n如果获得批准，导师将收到一封确认电子邮件，并且现在可以被学员选择。导师现在可以返回项目级别概览页面更改其偏好设置或可用性。\n\n表 4-8 总结了导师注册期间不同项目类型的差异。\n\
  \n*表 4-8 按项目类型划分的导师注册选项*\n\n| 操作/项目类型 | 受监督 | 无监督 | 开放注册 |\n| :--- | :---: | :---:\
  \ | :---: |\n| 向导师发送邀请。 | X | X | X (可选) |\n| 邀请位于`Invitations`选项卡中。 | X | X | |\n\
  | 邀请位于`Open Enrollment`选项卡中。 | | | X |\n| 导师可以选择退出项目。 | X | X | |\n| 经理或管理员批准导师参与。\
  \ | | | X |\n| 导师可以在注册和接受过程中查看其偏好设置。导师可以更改其可用性。 | X | X | X |\n\n### 学员注册\n\n在学员收到加入**受监督**或**无监督**项目的邀请后，学员将使用电子邮件邀请中的链接或直接前往`Mentoring`（辅导）页面来加入或退出。该邀请将出现在`Invitations`（邀请）选项卡中，如图\
  \ 4-43 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig43_HTML.jpg](img/510611_1_En_4_Fig43_HTML.jpg)\n\
  \n*图 4-43 学员的辅导项目邀请*\n\n### 学员注册日期\n\n注册日期因项目类型而异：\n\n*   对于**受监督**项目，如果学员在项目匹配开始日期之前未注册，则学员注册将关闭，他们无法再注册。\n\
  *   对于**无监督**项目，学员可以在辅导项目开始日期的前一天之前继续注册。\n*   对于**开放注册**项目，注册可以持续进行，直到管理员结束项目。\n\
  \n学员必须点击“注册为学员”才能加入或退出。如果他们不采取任何行动或试图在项目开始后注册，他们将不会加入该项目。如果他们退出，该邀请将从`Invitations`（邀请）选项卡中移除。\n\
  \n\n\n与导师注册流程相同，学员将看到项目详情，随后可以选择退出或加入。对于开放注册的项目，唯一的选择就是加入。如果学员不希望加入，则无需任何操作。若要加入，他们需填写注册表格，列出自己偏好的导师。\n\
  \n学员注册界面有一些导师注册界面没有的额外功能：`显示推荐导师`和`搜索导师`。此功能适用于所有三种项目类型。示例注册页面如图 4-44 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig44_HTML.jpg](img/510611_1_En_4_Fig44_HTML.jpg)\n\
  \n**图 4-44** 学员偏好页面\n\n要注册，学员必须完成问卷。问题将针对学员的视角进行定制，但会使用与导师问题相同的选项列表。自由文本问题对导师和学员均相同。\n\
  \n完成问题后，学员需点击`显示推荐导师`按钮，查看根据其偏好和匹配规则推荐的所有导师。如果没有匹配结果，学员可以通过姓名搜索来寻找导师。无监督项目不允许学员在不选择导师的情况下注册。对于监督项目，这是可选的，因为匹配程序会为学员找到最佳匹配。\n\
  \n图 4-45 显示了学员输入偏好后推荐的导师。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig45_HTML.jpg](img/510611_1_En_4_Fig45_HTML.jpg)\n\
  \n**图 4-45** 基于偏好和匹配规则的推荐匹配\n\n在选择了一位导师（或根据推荐导师数量选择多位）后，学员完成注册，如图 4-46 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig46_HTML.jpg](img/510611_1_En_4_Fig46_HTML.jpg)\n\
  \n**图 4-46** 学员注册完成页面\n\n学员可以查看项目以了解详情，并可以更改其偏好或邀请更多导师，如图 4-47 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig47_HTML.jpg](img/510611_1_En_4_Fig47_HTML.jpg)\n\
  \n**图 4-47** 学员项目概览页面\n\n在导师批准之前（对于无监督和开放注册项目），导师信息不会显示。\n\n学员可以发送更多邀请，系统会提示他们重新回答问题，然后选择导师。示例如图\
  \ 4-48 所示。与注册时选择导师的情况类似，如果在添加更多导师时没有匹配结果，学员可以通过姓名搜索找到导师。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig48_HTML.jpg](img/510611_1_En_4_Fig48_HTML.jpg)\n\
  \n**图 4-48** 学员添加更多导师\n\n如果根据学员的回答没有推荐匹配的导师，学员可以进行姓名搜索来寻找导师。对于开放注册和无监督项目，导师必须批准学员的请求。邀请将发送给导师，并需要其批准。对于监督项目，学员在注册时无需选择导师，因为匹配程序会确定匹配。\n\
  \n表 4-9 总结了学员注册期间不同项目的差异。\n\n**表 4-9** 按项目类型划分的学员注册操作\n\n| 操作/项目类型 | 监督式 | 非监督式\
  \ | 开放注册 |\n| --- | --- | --- | --- |\n| 向学员发送邀请。 | X | X | X (可选) |\n| 邀请位于“邀请”选项卡中。\
  \ | X | X |  |\n| 邀请位于“开放注册”选项卡中。 |  |  | X |\n| 学员接受或拒绝加入项目的邀请。 | X | X |  |\n\n\
  \n\n| 功能 | 学员注册时 | 学员选择导师后 | 导师批准后 |\n|---|---|---|---|\n| 学员可查看推荐导师的偏好 | X | -\
  \ | - |\n| 学员选择导师 | X (可选) | - | - |\n| 导师必须批准学员请求 | - | X | - |\n| 学员注册后可添加更多导师请求\
  \ | X | - | - |\n| 学员注册后可查看和更新偏好 | X | - | - |\n| 学员查看导师在注册和接受过程中设置的偏好 | X | - |\
  \ - |\n| 学员注册开始后，导师可继续注册 | - | X | - |\n\n## 导师批准\n\n学员完成注册并选择导师后，在非监督式和开放注册项目中，导师必须批准学员的任何选择。在注册期间选择导师会触发系统向导师发送自动生成的电子邮件通知。\n\
  \n图 4-49 显示了一个示例导师申请。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig49_HTML.jpg](img/510611_1_En_4_Fig49_HTML.jpg)\n\
  \n**图 4-49** 发送给导师的邮件请求\n\n此电子邮件通知不用于监督式导师项目，因为该项目不使用批准流程。\n\n导师将点击邮件中的链接查看请求，或直接进入导师项目级别页面，如图\
  \ 4-50 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig50_HTML.jpg](img/510611_1_En_4_Fig50_HTML.jpg)\n\
  \n**图 4-50** 导师视角：带有待处理请求的项目概览页面\n\n如图 4-51 所示，导师可以查看请求、查看学员的偏好，并接受或拒绝该导师关系。\n\n\
  ![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig51_HTML.jpg](img/510611_1_En_4_Fig51_HTML.jpg)\n\
  \n**图 4-51** 导师批准或拒绝学员请求\n\n拒绝请求将向学员发送一封邮件，以便他们可以返回项目并重新选择。如果导师接受学员的请求，则会向学员发送确认邮件，此时学员即被分配。\n\
  \n一旦请求被接受，该学员将显示在导师的项目页面中，如图 4-52 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig52_HTML.jpg](img/510611_1_En_4_Fig52_HTML.jpg)\n\
  \n**图 4-52** 导师项目概览页面（显示已分配的学员）\n\n导师可以查看学员的详细信息，并为学员的计划添加活动，如图 4-53 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig53_HTML.jpg](img/510611_1_En_4_Fig53_HTML.jpg)\n\
  \n**图 4-53** 导师为学员计划添加活动\n\n导师和学员之间最多可以添加五项活动。\n\n当学员返回其项目页面时，将看到其导师已被添加，并且导师创建的任何活动也会显示。图\
  \ 4-54 显示了一个示例。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig54_HTML.jpg](img/510611_1_En_4_Fig54_HTML.jpg)\n\
  \n**图 4-54** 学员视角：项目概览页面\n\n这种关系将持续到项目结束、管理员进行重新分配，或者导师和学员结束关系为止。在项目开始前，管理员可以手动匹配之前未分配的导师和学员。导师和学员将收到导师关系匹配通知。管理员也可以更改分配，任何被重新分配的导师或学员将收到邮件通知。即使在项目开始后，管理员也可以更改任何导师关系，并会发送邮件通知。\n\
  \n## 项目开始后的导师和学员功能\n\n项目开始后，学员和导师可用的功能如下：\n\n- 导师和学员可以为学员添加活动。\n\n\n\n- 结束并重启指导关系。\n\
  - 更新偏好设置。\n- 导师可设置自身为不可用/可用状态。\n- 查看指导计划详细信息。\n\n计划启动后，导师或学员均可终止其指导关系。然而，任何一方都无法创建新的指导关系。学员终止关系的示例如图\
  \ 4-55 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig55_HTML.jpg](img/510611_1_En_4_Fig55_HTML.jpg)\n\
  \n**图 4-55**  \n终止指导关系选项\n\n可在发送给导师的邮件中添加备注，如图 4-56 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig56_HTML.jpg](img/510611_1_En_4_Fig56_HTML.jpg)\n\
  \n**图 4-56**  \n终止关系时可添加的可选备注\n\n此时关系将显示为已终止，如图 4-57 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig57_HTML.jpg](img/510611_1_En_4_Fig57_HTML.jpg)\n\
  \n**图 4-57**  \n计划级别概览页面上的已终止指导关系\n\n导师将收到一封邮件通知。示例如图 4-58 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig58_HTML.jpg](img/510611_1_En_4_Fig58_HTML.jpg)\n\
  \n**图 4-58**  \n指导关系终止邮件通知\n\n终止指导关系的用户可重启关系，如图 4-59 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig59_HTML.jpg](img/510611_1_En_4_Fig59_HTML.jpg)\n\
  \n**图 4-59**  \n重启指导关系\n\n至此，我们已完整演示了从注册到计划完成的导师与学员示例。以下列出了整个计划中涉及管理员、导师和学员的步骤。\n\
  \n## 受监督计划的高层级步骤\n\n- 管理员创建受监督的指导计划。\n- 计划启动并保持“未开始”状态。\n- 管理员手动发送导师邀请。\n- 导师在“邀请”选项卡中查看邀请。\n\
  - 导师收到加入计划的邮件邀请：\n  - 若加入，则填写注册表单，计划将显示在“我的指导计划”选项卡中。\n  - 若选择退出，则从计划中移除，邀请也从“邀请”选项卡中移除。\n\
  - 指导注册期结束：\n  - 不再有导师可以注册。\n  - 管理员可在发送邀请前添加或删除学员。\n- 管理员手动发送学员邀请邮件。\n- 学员收到邀请：\n\
  \  - 学员选择退出计划并被移除：\n    - 邀请从“邀请”选项卡中移除。\n  - 学员加入计划并填写注册表单以指定偏好：\n    - 计划现在显示在“我的指导计划”选项卡中。\n\
  \    - 学员可通过姓名搜索或从推荐列表中选择导师。\n    - 若学员做出选择，则不会向导师发送邮件邀请。\n    - 学员可不选择导师直接注册。\n\
  - 学员注册期结束。\n- 在所有导师和学员注册后，管理员可编辑问题、修改匹配开始日期及指导计划的开始和结束日期，并上传图片。\n- 匹配期开始，管理员运行匹配程序：\n\
  \  - 此阶段不再有学员可以注册。\n  - 根据偏好和员工档案生成建议匹配。\n  - 管理员可分配任何未分配的参与者。\n  - 管理员可取消分配任何已分配的参与者。\n\
  \  - 管理员完成最终匹配，计划进入“进行中”状态。\n  - 向导师和学员发送包含匹配信息的邮件。\n- 在“进行中”阶段：\n  - 若管理员取消任何关系，学员将收到通知。\n\
  \  - 若管理员重新分配，学员和导师将收到通知。\n\n\n\n# 指导原则：非监督式与开放式注册辅导计划\n\n- 导师和学员安排会面以开始辅导。\n- 导师或学员均可终止关系。\n\
  - 计划在指定结束日期或由管理员终止时结束。\n\n## 非监督式计划的高级步骤\n\n- 管理员创建一个非监督式辅导计划。\n- 计划启动并保持“未开始”状态。\n\
  - 根据导师注册开始日期，系统自动向导师发送电子邮件，或管理员可手动触发邮件。\n- 导师收到加入计划的电子邮件邀请：\n  - 邀请位于“邀请”选项卡中。\n\
  \  - 若导师加入，他们将填写注册表以提供偏好，计划现位于“我的辅导计划”选项卡中。\n  - 若导师选择退出，他们将被从计划中移除，邀请也会从“邀请”选项卡中移除。\n\
  - 辅导注册期结束。\n- 根据学员注册开始日期，系统自动发送学员电子邮件，或由管理员手动发送。\n- 学员收到邀请：\n  - 学员选择退出计划，并被从计划中移除。\n\
  \  - 学员加入计划并填写注册表以确定偏好：\n    - 学员必须通过姓名搜索或从推荐中选择一位导师。\n    - 向导师发送电子邮件邀请。\n  - 导师收到来自学员的邀请。\n\
  \    - 若导师拒绝，将向学员发送电子邮件通知他们并让其重新选择：\n      - 学员继续请求导师，直到有人接受。\n    - 若导师接受邀请，将向学员发送电子邮件，并完成配对。\n\
  \  - 学员和导师可以查看彼此的偏好。\n- 管理员可以取消分配或分配由学员创建的配对，并且在学员开始配对后可以进行任何更改。\n  - 管理员所做的任何配对更改都将为学员和导师创建通知。\n\
  \  - 由管理员更改的配对无需经理批准。\n- 一旦分配最终确定，管理员启动计划：\n  - 计划现在处于“进行中”状态。\n  - 仍然可以进行更改，任何配对更改都会生成电子邮件。\n\
  - 导师和学员决定如何以及何时见面。\n- 导师和学员可以为学员添加活动。\n- 若已配置，导师或学员可以随时终止关系。\n- 计划在指定的计划结束日期或由管理员手动结束时终止。\n\
  \n以下是开放式注册辅导计划发生的步骤。\n\n## 开放式注册计划的高级步骤\n\n- 管理员创建计划。\n- 管理员启动计划；它立即进入“进行中”状态。管理员现在将看到“导师”、“学员”和“配对”选项卡。\n\
  - 管理员通过深层链接手动发送邀请，并为导师和学员分别发送电子邮件。\n  - 电子邮件可以在现在或导师设置后发送给学员。\n  - 邀请位于“开放式注册”选项卡中。\n\
  - 导师可以选择加入或拒绝。\n  - 若导师加入，他们填写注册表，计划转到“我的辅导计划”选项卡。\n  - 若需经理批准，将向经理发送一封电子邮件：\n \
  \   - 导师状态为“待定”，直到被批准或拒绝。\n    - 经理可以批准或拒绝导师参与计划：\n      - 若拒绝，将向导师发送电子邮件，并将导师从计划中移除。\n\
  \      - 若批准，导师会收到电子邮件并等待配对。\n  - 若需管理员批准，导师必须在注册表上附加文档：\n    - 导师状态为“待定”，直到被批准或拒绝。\n\
  \    - 若拒绝，将向导师发送电子邮件，导师可以附上正确的文档重新提交请求。\n    - 若批准，导师会收到电子邮件并等待配对。\n- 学员回复邀请。\n\
  \  - 在至少有一位导师注册之前，学员无法注册。\n  - 学员可以选择加入或拒绝：\n    - 若学员拒绝，他们将被从计划中移除。\n    - 若学员加入，他们回答注册表上的问题。\n\
  \n\n\n# 导师指导流程\n\n-   受指导者根据回答，通过推荐或姓名搜索来寻找导师。\n-   受指导者提交导师申请。\n-   系统会发送电子邮件给导师，让其接受或批准。\n\
  -   一旦加入，该计划状态会从“公开报名”变为“我的指导计划”。\n-   导师收到受指导者的申请邮件：\n    -   导师拒绝：\n        -\
  \   系统会向受指导者发送邮件，告知其必须选择并申请另一位导师。\n    -   导师接受：\n        -   导师和受指导者完成配对。\n   \
  \     -   系统会向受指导者发送邮件通知。\n-   管理员监控计划，查看注册情况。\n-   管理员可以取消或强制分配配对。\n-   当导师变更时，参与者会收到通知。\n\
  -   计划持续进行，直至管理员结束。\n-   如果系统配置允许，导师或受指导者可以随时中止参与。\n\n接下来，我们将回顾指导流程中使用的邮件通知。\n\n\
  #### 电子邮件通知\n\n从注册到计划完成，系统共使用了 24 种电子邮件通知。系统会根据特定操作，自动向导师、受指导者、导师的经理以及导师管理员发送电子邮件通知。\n\
  \n这些邮件通知是指导流程专用的，无法在“电子邮件通知模板”中找到。唯一可以修改的邮件通知是之前看到的参与指导计划的邀请函。在创建计划期间，可以针对有监督和无监督计划修改这些导师和受指导者邀请函。\n\
  \n其余的通知无法控制其开关或进行编辑。\n\n表 4-10 列出了发送的指导流程邮件通知。\n\n### 表 4-10 导师指导全过程的电子邮件通知\n\n\
  | 触发发送通知的条件 | 接收人 | 目的 |\n|---|---|---|\n| 公开计划开始 | 导师 | 邀请其作为导师加入。 |\n| 公开计划开始\
  \ | 受指导者 | 邀请其作为受指导者加入。 |\n| 有监督计划配对 | 导师 | 有监督计划与受指导者配对。 |\n| 有监督计划配对 | 受指导者 |\
  \ 有监督计划与导师配对。 |\n| 申请导师 | 导师 | 受指导者请求导师批准。 |\n| 拒绝导师申请 | 受指导者 | 导师未批准受指导者。 |\n|\
  \ 导师不可用 | 受指导者 | 导师不可用。 |\n| 导师变为不可用 | 导师 | 导师状态变更为“不可用”，并附有结束日期。可更改状态。 |\n| 当前导师变为不可用\
  \ | 受指导者 | 导师状态变更为“不可用”，并附有结束日期。可申请另一位导师。 |\n| 待定导师审批；导师变为不可用 | 受指导者 | 待定导师的状态变更为“不可用”。可申请另一位导师。\
  \ |\n| 导师变为可用 | 导师 | 导师状态从“不可用”变更为（可用），并附有结束日期。现在可以选择成为导师，或更改状态。 |\n| 导师再次变为可用 |\
  \ 受指导者 | 导师再次可用。 |\n| 待定导师再次变为可用 | 受指导者 | 导师可用。回到待定审批状态，或更改申请。 |\n| 导师次日可用 | 导师\
  \ | 通知导师明天他们将可以作为导师使用。可更改状态。 |\n| 导师 7 天内可用 | 导师 | 通知导师他们将在 7 天内作为导师可用。可更改状态。 |\n\
  | 导师结束与受指导者的关系 | 受指导者 | 不再接受指导。 |\n| 导师重新建立与受指导者的关系 | 受指导者 | 受指导者重新接受之前不可用导师的指导。\
  \ |\n| 导师需要经理批准才能参与 | 导师的经理 | 通知经理其直接下属有成为导师的意向。经理可以批准或拒绝。 |\n| 经理批准导师申请 | 导师 |\
  \ 经理已批准申请。导师现在等待配对。 |\n| 经理拒绝导师申请 | 导师 | 潜在导师的经理拒绝了申请。不再参与计划。 |\n| 批准参与公开报名 | 导师\
  \ | 导师获得管理员或负责人批准，可参与公开报名计划。等待配对。 |\n| 拒绝参与公开报名 | 导师 | 管理员或计划负责人拒绝导师参与公开报名计划的请求。可重新提交表格再次申请批准。\
  \ |\n| 管理员移除配对 | 受指导者 | 配对已移除，等待重新配对。 |\n| Jam 群组创建失败 | 指导管理员 | 计划负责人未成为计划的群组管理员。\
  \ |\n| Jam 群组图片失败 | 指导管理员 | 未为 Jam 群组创建计划图片。 |\n| 用户未被邀请加入 Jam 群组 | 指导管理员 | 未为 Jam\
  \ 群组创建自动邀请。 |\n\n## 临时报告\n\n虽然没有可用的标准指导仪表板，但管理员可以创建临时的指导报告。可以报告以下数据元素：\n\n-   指导计划\n\
  -   指导参与者\n-   指导计划负责人\n-   指导计划活动\n-   指导计划已配对参与者\n-   指导计划导师申请\n-   指导计划导师注册表\n\
  -   指导计划受指导者注册表\n-   指导计划电子邮件模板\n-   指导计划注册模板\n-   所有受邀参与者的状态：已注册、已配对、未注册或待定\n-\
  \   来自导师和受指导者的指导偏好回复\n-   与指导计划关联的 Jam 群组\n-   可以手动结束指导关系的参与者\n\n此处使用的数据来自“指导计划”，如图\
  \ 4-60 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig60_HTML.jpg](img/510611_1_En_4_Fig60_HTML.jpg)\n\
  \n**图 4-60** 用于报告的指导计划域\n\n然后选择要用作数据集的指导计划，如图 4-61 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig61_HTML.jpg](img/510611_1_En_4_Fig61_HTML.jpg)\n\
  \n**图 4-61** 选择要报告的指导计划\n\n有相当多的指导字段可供报告，例如计划详细信息页面、负责人和参与者信息、导师申请和批准、注册表字段、电子邮件和匹配结果。管理员可以运行报告来跟踪参与情况，检查有多少邀请未能促成注册，查看待处理的批准请求，并识别参与者。\n\
  \n# 结论\n\n至此，我们已经了解了如何配置指导功能以及所需的基于角色的权限。我们学习了管理员如何创建和管理指导计划，以及让受指导者与导师配对的步骤。指导计划充当联结导师和受指导者的框架。计划由管理员创建、跟踪和关闭。一旦配对成功，就取决于导师和受指导者自己确定他们希望通过指导关系实现什么目标。所有这些都在系统之外进行，因为每段关系都有其独特的需求。此工具的优势在于，它创建了一种根据受指导者的需求和导师可能提供的帮助来匹配人员的方法。指导计划在一个地方进行跟踪；管理员可以控制所使用的计划类型、参与人员、计划时长，以及谁有能力创建适合其组织需求的指导计划。\n\
  \n# 5. 继任管理简介、九宫格与人才评估表格\n\n\n\n## 继任管理\n\n管理是指识别顶尖人才并将其标记为潜在候选人以接任组织内关键职位的业务流程。例如，一家在全球开展销售业务的公司，可能会持续物色能监督美国各地区经理的销售高级副总裁。对于这样的公司而言，拥有一份能在销售高级副总裁离职时迅速填补这一关键职位的人员名单至关重要。然而，继任管理远不止是维护一份潜在继任者名单。事实上，一项优秀的继任管理策略涉及识别继任战略中的缺口，并主动识别、招募和培养适合关键职位的优秀人才，从而使企业不仅能够生存，更能繁荣发展。\n\
  \n为了进一步阐释这一点，让我们看两个销售高级副总裁即将离职的公司案例：\n\n1.  一家模范公司，它使用 `SAP SuccessFactors` 实施了全面完善的继任管理策略\n\
  2.  一家仅实施了最低限度继任管理策略的公司\n\n在实施最低限度继任管理策略的公司中，销售高级副总裁决定离职。他们认为自己在当前公司已到达职业生涯的顶峰，没有晋升的希望，除了离开别无发展途径。美国总裁有一份去年与高管领导团队审核过的潜在继任者电子表格，他联系了名单上排名第一的人，询问其是否对该职位感兴趣。继任者接受了，总裁安排两人在交接日前进行一次交接通话。他们发送了一封说明交接事宜的邮件，随后继任者开始担任新职位。公司的日常工作照常进行，只是短期内销售额略有下降。\n\
  \n在实施模范继任管理策略的公司中，总裁持续使用 `SAP SuccessFactors` 与现任销售高级副总裁进行绩效管理会议。作为这些会议的一部分，总裁主动识别出销售高级副总裁离职风险较高，并在系统中将其标记为“高风险”。在此之前，总裁已经与高管领导团队进行了一次\
  \ 9 宫格校准会议，会上销售高级副总裁被标记为高潜力人才。该销售高级副总裁也在系统中被提名为总裁职位的继任者。系统计算了他们当前能力集与履行新职位职责所需能力之间的差距。这使得销售高级副总裁和总裁的生活都变得更轻松，因为他们现在有了一个共同的奋斗目标。作为持续绩效管理会议的一部分，他们一直在系统中根据销售高级副总裁的发展计划进行工作，以帮助其为新角色做好准备。同时，作为\
  \ `SuccessFactors` 导师计划的一部分，该销售高级副总裁也与另一位副总裁搭档，由后者担任导师，以帮助其为新角色做准备。由于在当前模范公司的职业生涯中如此积极主动地参与，这位销售高级副总裁根本没有考虑过离职，并且正在帮助指导其下属的区域经理（他们自己的潜在继任者）。与此同时，总裁也一直在为潜在的接任销售高级副总裁做着同样的工作。随着销售高级副总裁职位交接日的临近，总裁与变革管理团队合作，评估交接的影响以及如何最好地进行交接沟通。在\
  \ `SuccessFactors` 系统中看到新任销售高级副总裁是从一个小客户主管一步步晋升上来的，他们决定为其成就举办一场面对面的庆祝活动效果最佳。活动顺利举行，员工士气得到提升，销售额保持稳定，对发展计划的兴趣和员工保留率也随之提高。\n\
  \n尽管前面的例子是理论性的，但不可否认的是，`SAP SuccessFactors` 提供了多种工具来帮助客户实现这种理想化的模式。`SAP SuccessFactors\
  \ 继任管理` 或许提供了最集成的解决方案，它基于其他模块的数据构建，创建了一个如示例中所概述的综合性业务解决方案。前文例子中提到的一些工具已在第一卷和第二卷的先前章节中介绍过。本章将向读者展示如何最大限度地发挥\
  \ `SAP SuccessFactors 继任管理` 的潜力，如同此处给出的模范公司示例。随着我们深入探讨继任管理模块各项功能的配置，我们将以这个模范公司为例进行参照。\n\
  \n本章及接下来的两章将遵循配置继任管理模块（也称为 `SCM`）的逻辑流程。我们将从本章的 9 宫格或矩阵网格配置开始。然后介绍标准的“人才评估表”，以及如何调整它以满足您组织的特定业务需求。在下一章中，我们将展示如何配置人才卡片。接着，我们将逐步讲解提名设置和继任组织架构图。之后，将介绍世系图功能。最后，在第\
  \ 6 章中，我们将深入探讨其余功能，包括人才搜索、人才池、职位磁贴视图、世系图以及继任演示文稿。让我们开始吧！\n\n\n\n# 基本设置\n\n本章及后续两章的每个小节都将详细探讨继任模块不同主要区域的功能与配置。每个小节均假设已完成以下步骤，以开启基本的继任管理设置：\n\
  \n1. 登录配置系统，导航至您的组织，点击“公司设置”。\n2. 勾选“继任计划”和“继任管理”旁的复选框。\n3. 点击“保存”。\n\n**注意**  \n\
  本章还假设已启用基于角色的权限和 MDF。\n\n# 九宫格或矩阵网格\n\n矩阵网格通常被称为九宫格，因为许多公司采用 3 `×` 3 的配置，从而形成九个格子（有些公司使用其他数量的格子，如\
  \ 2 `×` 2 或 3 `×` 4，SAP SuccessFactors 也支持此类配置）。它是一种工具，通过将员工归入其中一个格子，直观地识别员工在两个维度上的同时表现。这两个维度通常是绩效-潜能（最常见，如图\
  \ 5-1 所示）以及目标-胜任力（也称为“怎么做 vs. 做什么”，如图 5-2 所示）。SAP SuccessFactors 支持同时配置这两种类型的矩阵网格，或仅使用其中一种。\n\
  \n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig2_HTML.jpg](img/510611_1_En_5_Fig2_HTML.jpg)\n\
  \n**图 5-2** 目标-胜任力或“怎么做 vs. 做什么”九宫格示例\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig1_HTML.jpg](img/510611_1_En_5_Fig1_HTML.jpg)\n\
  \n**图 5-1** 绩效-潜能九宫格示例\n\n就采用哪些维度以及每个维度采用何种量表达成一致，是一项重要的业务决策，这不仅决定了组织矩阵网格的大小，也便于始终如一地向人才决策者传达信息。根据我们的经验，我们发现继任管理实施项目最大的风险之一，就是组织内部对矩阵网格的外观、或对每个格子内员工归属标准未能达成一致。在配置系统此区域之前，理解这些至关重要。\n\
  \n系统中显示和/或使用矩阵网格的区域有多处：\n\n1. 矩阵网格报告\n2. 人才卡片\n   - 在演示文稿中\n   - 在继任组织架构图中\n   -\
  \ 作为演示幻灯片\n3. 员工档案（概览计分卡、绩效历史、趋势元素和矩阵网格位置历史组件上的迷你九宫格）\n4. 人才评审表单\n5. 校准\n6. 精准像素级人才卡片\n\
  \n就本节而言，我们将涵盖矩阵网格报告的配置。这将设定系统中大部分区域的矩阵网格定义。若有例外情况，我们将在每个特定章节中予以说明。\n\n**注意**  \n\
  我们不建议在概览计分卡组件上使用迷你九宫格，因为它是一个遗留组件。有关概览计分卡组件上迷你九宫格的更多信息，请参见 SAP 注释 2091458。\n\n# 配置矩阵网格的先决条件\n\
  \n在能够访问矩阵网格配置界面之前，需要完成以下设置和配置。\n\n## 配置设置\n\n在配置系统中，导航至“公司设置”，勾选“矩阵网格报告（九宫格）”和“矩阵网格怎么做\
  \ vs. 做什么报告（九宫格）”，如图 5-3 所示，然后点击“保存”。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig3_HTML.jpg](img/510611_1_En_5_Fig3_HTML.jpg)\n\
  \n**图 5-3** 矩阵网格配置前需完成的配置设置\n\n### 权限\n\n一旦配置设置完成后，在“管理权限角色”界面中，将为各个角色提供可选的权限选项。\n\
  \n**注意**\n\n\n\n在本章中，我们假定已在 Provisioning 中启用了基于角色的权限。另请注意，配置设置有时需要一段时间才能在系统中生效。如果您没有立即看到权限出现，请注销并在大约一小时后重新登录。更改通常不会超过一夜即可生效。\n\
  \n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig4_HTML.jpg](img/510611_1_En_5_Fig4_HTML.jpg)\n\
  \n**图 5-4** 最终用户访问矩阵网格报告所需的权限\n\n1.  在搜索栏中输入并选择 `\"管理权限角色\"`。\n2.  加载屏幕后，点击您要修改的角色。然后点击\
  \ `\"权限…\"`。\n3.  为了使最终用户能够访问矩阵网格报告，需要为权限角色选中 `\"继任管理与矩阵报告权限\"` 和 `\"矩阵报告权限\"`，如图\
  \ 5-4 所示。\n\n**注意** `\"继任管理与矩阵报告权限\"` 需要一个目标人群。这将定义最终用户运行报告时可看到的人群。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig5_HTML.jpg](img/510611_1_En_5_Fig5_HTML.jpg)\n\
  \n**图 5-5** 配置矩阵网格所需的权限\n\n1.  为了访问配置矩阵网格的屏幕，需要为分配的权限角色在 `\"管理继任\"` 部分下勾选 `\"如何\
  \ vs. 什么配置\"`、`\"矩阵网格评分量尺\"` 和 `\"绩效-潜力配置\"` 选项，如图 5-5 所示。点击 `\"完成\"`。请务必也在主屏幕上保存您的角色。\n\
  \n## 流程与表单配置\n\n许多公司将多个表单组织到逻辑上的年度流程分组中，以便最终用户只能看到相关的表单。这可以通过使用图 5-6 所示的“流程与表单”配置屏幕来实现。如果您尚未完成，请确保在矩阵网格配置之前完成此配置。有关绩效评估表单和流程的更多信息，请参阅第一卷，第\
  \ 6 章至[第 10 章](https://doi.org/10.1007/978-1-4842-6995-4_10)。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig6_HTML.jpg](img/510611_1_En_5_Fig6_HTML.jpg)\n\
  \n**图 5-6**“流程与表单”配置屏幕\n\n## 矩阵网格配置\n本节详细介绍了用于配置矩阵网格的屏幕和步骤。\n\n### 矩阵网格评分量尺配置屏幕\n\
  \n在对任一矩阵网格进行主要配置之前，您应检查并修改评分量尺配置。这些量尺允许您控制矩阵网格的维度，例如，使其成为 9 宫格或其他大小的网格。它还允许您为系统启用的所有语言更改与每个评分等级关联的文本。要访问矩阵网格评分量尺配置屏幕，请在搜索栏中输入并选择\
  \ `\"矩阵网格评分量尺\"`。图 5-7 显示了该屏幕。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig7_HTML.jpg](img/510611_1_En_5_Fig7_HTML.jpg)\n\
  \n**图 5-7**“矩阵网格评分量尺”配置屏幕\n\n请按以下步骤在屏幕上进行配置：\n\n1.  加载屏幕后，主下拉菜单中有六个可选的评分量尺：`绩效`、`潜力`、`目标`、`能力`、`自定义\
  \ 1` 和 `自定义 2`。\n2.  选择其中一个选项并点击 `\"编辑\"`。\n3.  下拉菜单下方的区域将展开，显示量尺中的数值数量以及您实例中激活的每种语言的翻译。\n\
  4.  您可以通过在 `所需量尺大小` 下拉菜单中选择不同的数字并点击 `\"设置\"` 来更改量尺。\n5.  选择量尺大小后，输入文本描述。\n6.  完成后，点击\
  \ `保存`。\n7.  对其余量尺重复此过程。\n\n**注意**\n\n您在此处选择的选项也会影响员工档案中的量尺。例如，如果您允许经理直接在员工档案中选择潜力评级，则量尺将来自此配置。\n\
  \n为了我们的示例公司，我们建议对绩效和潜力都使用三点量尺。这将允许进行 9 宫格配置。此外，我们建议此量尺与年度绩效评估量尺匹配，以便在绩效评级中使用三点量尺。如果绩效评级未使用三点量尺，请参考下一节关于如何归一化的步骤。同样，对于目标和能力评级，我们建议使用与绩效评估的\
  \ `目标` 部分和 `能力` 部分给出的评级相匹配的三点量尺。如果您选择使用高于或低于三点的量尺进行绩效评估，但希望使用 9 宫格，则需要制定一个计划，以简单系统的方式将这些量尺转换为\
  \ 9 宫格。这可能是那些在矩阵网格流程中遇到问题的公司最大的问题领域。\n\n### 矩阵网格配置屏幕\n\nSAP SuccessFactors 支持两种矩阵网格报告：一种用于绩效-潜力，一种用于目标-能力。因此，有两个独立的配置屏幕，每个报告对应一个（尽管这些屏幕看起来并且对每个报告执行相同的操作）。这些是配置矩阵网格的主要区域。要访问绩效-潜力报告配置屏幕，请在搜索栏中输入并选择\
  \ `\"矩阵网格报告：绩效-潜力\"`。要访问目标-能力报告配置屏幕，请在搜索栏中输入并选择 `\"矩阵网格：如何 vs. 什么\"`。图 5-8 显示了一个典型的绩效-潜力\
  \ 9 宫格配置。由于两个配置屏幕完全相同，我们不再赘述。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig8_HTML.jpg](img/510611_1_En_5_Fig8_HTML.jpg)\n\
  \n**图 5-8**“矩阵网格”配置屏幕\n\n**注意**\n\n虽然配置屏幕分别命名为“绩效-潜力”和“如何 vs. 什么”，但系统足够灵活，可以通过重新标记一个或两个配置屏幕来创建您的组织所需的任何类型的矩阵网格。请注意，您仅限于两个报告。\n\
  \n要配置矩阵网格，请遵循以下步骤：\n\n1.  屏幕顶部的下拉菜单表示您正在编辑屏幕所用的语言选择。选择您所需的语言，屏幕将自动重新填充所选语言的内容。如果您的组织需要多种语言，您需要为每种所需语言重复此步骤及后续步骤。\n\
  2.  `\"报告名称\"` 字段允许您调整报告名称的措辞，以符合您组织的术语。例如，如果您的组织只使用通常称为 `\"9 宫格\"` 的绩效-潜力矩阵网格，您可能希望将报告名称重新标记为\
  \ `\"9 宫格\"`。这也将自动更改最终用户的导航标签。\n3.  `X 轴` 框允许您配置矩阵的水平维度。\n    1.  使用 `\"标签\"` 字段，您可以更改最终用户屏幕中沿\
  \ X 轴底部显示的标签。\n    2.  `\"趋势\"` 字段还允许您选择在 `\"矩阵网格评分量尺\"` 配置屏幕中配置的量尺之一。这不仅会控制沿此轴显示多少个框，还会根据您在\
  \ `\"矩阵网格评分量尺\"` 配置屏幕中的配置控制量尺中每个点的标签。\n\n\n\n3.  如果您希望使用自定义权重沿此轴对评分分布进行归一化处理，请勾选`Custom\
  \ Weight`复选框，并在每个评级值旁边输入一个百分比权重。\n\n**注意** 在此处输入数值将控制如何，例如，将五分制的绩效量表转换为九宫格上的三分制量表。例如，如果为\
  \ 1 评级输入了 100%，则所有员工都将落在 1 评级上。如果在 1 评级上输入了 50%，那么五分制量表中评分范围为 1–2.5 的任何人将落在 1 评级上。一个常见的例子是\
  \ 20/60/20 分布，它会使大部分评分落在 2 评级上。\n\n4.  `Process`下拉菜单允许您选择已配置的流程之一、员工计分卡（员工档案）或所有可用的数据源来填充您的报告。请根据情况选择其中一项。\n\
  \n**注意**\n\n理解矩阵网格报告的数据源是正确配置的基础。驱动每个维度评分（从而决定在网格中的位置）的评级可以来自两个来源：\n\n1.  员工档案（例如，实时档案或计分卡；此外，在“管理校准设置”屏幕上还有一个选项，可以包含或排除实时档案中任何正在进行中的校准会议）\n\
  2.  表单（例如，绩效表单或人才评审表单，以及可能包含在表单路线图中的校准会议，如前所述——这取决于使用`Processes and Forms`配置屏幕设置流程的方式）\n\
  \n1.  对`Y-Axis box`重复上述`X-Axis box`的步骤。\n\n2.  `Include axis rating labels`复选框将显示在`Matrix\
  \ Grid Rating Scales`配置屏幕中为评级量表配置的标签。\n\n3.  `Exclude in-progress forms when retrieving\
  \ the most recent ratings`复选框的功能正如其字面意思。根据需要勾选此框。\n\n**注意** 我们通常建议不要勾选此框。在流程进行中，让经理和人力资源人员查看员工的评分情况往往有助于最终确定评级。\n\
  \n4.  `Show trend icon & popup`实际上已弃用，它指的是一个旧的弹出窗口，该功能已被员工人才卡片上的趋势视图所取代。我们通常保持勾选此框，因为它已经没有实际效果了。\n\
  \n5.  `Use average of all found ratings, instead of latest`复选框在某人跨多个年份执行报告时生效。通常系统会取最新的评分，而在此情况下，它会计算所有找到的评分的平均值。根据需要勾选此框。\n\
  \n**注意** 用户在运行矩阵网格报告时，将能够选择要搜索的日期范围。默认情况下，系统会使用从今天起向前推一年的日期填充此字段；此后，它将使用用户上次运行报告时所选的最后日期范围。无法更改此行为。我们通常建议不要勾选上一步中提到的复选框，因为这可能会让最终用户感到困惑。通常情况下，用户关心的是员工的最新信息以做出继任决策，而不是平均值。此外，如果需要此类信息，他们可以点击员工人才卡片并查看其随时间变化的趋势。\n\
  \n6.  `Links on Quickcard should open in a new browser window` 指的是一个名为快速卡片的过时选项。此项已不再适用。\n\
  \n7.  `Display User Limit Per Cell` 字段将限制矩阵中每个单元格最多可容纳的员工数量。您在此字段中输入的最大值为 5000。如果用户运行报告时超出此最大值，将显示一条提示消息，告知用户已超过上限。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将以下英文文本翻译成中文。\n\n\n> **注意** 我们不建议在每个单元格中显示大量用户，因为这可能会导致系统性能问题，并且也可能使用户难以直观查看。\n\
  \n8.  `“每个单元格的打印用户限制”` 的作用方式相同，但适用于报告的打印版本。\n9.  每个坐标轴旁的 `“反向刻度”` 复选框将分别翻转该坐标轴上的刻度顺序（例如，从升序变为降序）。\n\
  \n> **注意** 我们建议不要使用反向刻度——按照惯例，大多数组织假设右上角的单元格代表最佳评分。\n\n10. 每个单元格内的 `“背景颜色”` 字段允许您设置该单元格的背景颜色。输入您想要的每个单元格颜色的\
  \ HTML 颜色十六进制代码。\n\n> **注意** 您可以使用类似 W3Schools 网站这样的参考站点来查询代码对应的颜色：[`www.w3schools.com/colors/colors_picker.asp`](http://www.w3schools.com/colors/colors_picker.asp)。\n\
  \n11. 同样，`“文本颜色”` 字段允许您选择每个框中将显示的文本颜色。为每个单元格输入另一个 HTML 十六进制代码。\n\n> **注意** 您应尝试为每个单元格选择对比度良好的文本颜色和背景颜色，以帮助满足无障碍指南，并使其成为一个易于使用的系统。美国总务管理局网站概述了无障碍指南，并在此处提供了一个很棒的可用颜色调色板生成器：[`https://accessibility.digital.gov/visual-design/color-and-contrast/`](https://accessibility.digital.gov/visual-design/color-and-contrast/)。\n\
  \n12. 根据您当前选择的语言，在每个 `“标签”` 字段内为每个标签输入文本。\n13. 如果您希望允许用户在矩阵网格右侧的额外区域中查看其报告选择标准中哪些人未评级，请选中\
  \ `“启用未评级”` 复选框。同样，勾选 `“启用太新而无法评级”` 复选框，可以在右侧看到被选中进行此评级的员工。与单元格背景颜色、标签和文本颜色类似，为这些框选择颜色或将其留空。\n\
  \n> **注意** 我们建议同时使用这两个选项（除非 `“太新而无法评级”` 在您的绩效评估周期中不是一个选项，在这种情况下我们仅建议使用 `“启用未评级”`\
  \ – 有关 `“太新而无法评级”` 的更多信息，请参阅第 1 卷，第 6 章）。选择这些选项对于识别可能在此过程中被忽略的员工非常有帮助。例如，经理在查看其团队的评级报告时，可能会意识到他们从未对出现在此区域中的员工进行人才评审。\n\
  \n14. 通过填写 `“链接标题”` 和 `“链接 URL”` 字段，为矩阵网格报告添加链接。在这些字段中输入值后，报告右上角将显示一个 `“i”` 图标，点击即可打开该链接。\n\
  \n- *如果选择了 `“所有数据源”`，则系统将获取员工计分卡和系统中所有活动流程的最新评分。虽然此选项提供最新的信息，但也可能让最终用户感到非常困惑。我们通常建议选择您最新配置的流程，然后告知经理/决策者系统何时将切换到下一个流程。创建示例数据并测试您的配置是否给出预期结果非常重要。很多时候，源选择可能会变得混乱，并导致报告中出现意外结果。根据我们的经验，此区域配置错误通常是罪魁祸首！*\n\
  \n> **注意** 我们建议将此链接用作贵组织政策文档的参考点，和/或用作经理有关九宫格放置标准的使用指南。\n\n## 矩阵网格图标配置屏幕\n\n矩阵网格图标配置屏幕（图\
  \ 5-9）用于在员工拥有此屏幕配置字段中填充的人才数据时，在矩阵网格报告上显示图标。例如，如果员工是男性或女性，您可以选择在报告上其姓名旁边显示男性或女性符号。您在此处进行的配置将控制整个继任模块中显示的图标，例如在继任组织架构图中。\n\
  \n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig9_HTML.jpg](img/510611_1_En_5_Fig9_HTML.jpg)\n\
  \n*图 5-9*\n*矩阵网格报告图标配置屏幕*\n\n请按照以下步骤在此屏幕上执行配置：\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig10_HTML.jpg](img/510611_1_En_5_Fig10_HTML.jpg)\n\
  \n*图 5-10*\n*添加字段弹出窗口*\n\n1.  单击 `“添加新字段”` 按钮以调出 `“添加字段”` 弹出窗口（图 5-10）。选择您要为其添加图标的字段，然后单击\
  \ `“确定。”` 此处的字段列表代表数据模型中尚未分配图标集的所有人才字段。有关数据模型的更多信息，请参阅第 1 卷，第 2 章。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig11_HTML.jpg](img/510611_1_En_5_Fig11_HTML.jpg)\n\
  \n*图 5-11*\n*`“影响损失”` 类别字段的编辑屏幕*\n\n2.  将出现 `“编辑字段”` 弹出窗口（图 5-11）。此弹出窗口将读取与该字段关联的选项集\
  \ ID，并列出该选项集中的所有项目。\n\n> **注意** 系统中的选项集 ID 必须与数据模型中字段的技术字段名匹配，才能显示在前面的屏幕中。如果选项集不匹配，则会出现错误屏幕，并且您将无法进行配置。您可以在选项集中心（图\
  \ 5-12）编辑字段的可能值列表。有关配置人才字段（包括分配选项集）的更多信息，请参阅第 1 卷，第 2 章。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig12_HTML.jpg](img/510611_1_En_5_Fig12_HTML.jpg)\n\
  \n*图 5-12*\n*选项集中心屏幕显示选项集 ID `impactOfLoss` 与技术字段名 `impactOfLoss` 匹配*\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig13_HTML.jpg](img/510611_1_En_5_Fig13_HTML.jpg)\n\
  \n*图 5-13*\n*未配置选项集时针对字段类别显示的错误*\n\n3.  只要您的选项集配置正确，您就可以在 `“编辑字段”` 屏幕（图 5-13）上单击每个图标旁的\
  \ `“更改”` 按钮来为其选择图标。系统标准图标列表将显示供您选择。您必须从标准图标列表中选择——您不能上传自定义图标。完成后单击 `保存更改`，您将返回到主屏幕。\n\
  4.  对所有所需的字段图标分配重复上述步骤。\n5.  如果您不希望显示图标，而是希望看到选项集的文本，只需通过单击 `“执行操作”`，然后选择 `“删除”`\
  \ 来删除类别字段的条目。\n\n> **注意** 我们建议对所有人才字段使用图标，以便它们显示在所有可用的屏幕上。这将带来优化的可视化体验。当不使用图标时，文本可能不会显示在某些概览屏幕上，例如在继任组织架构图中。\n\
  \n6.  要对现有配置进行编辑，请单击 `“执行操作”` 并选择 `“编辑。”` 将出现 `“编辑字段”` 弹出窗口，您可以重复步骤 2 来完成该字段的配置。\n\
  \n\n\n5. 要更改字段的显示顺序，请单击“Take Action”，然后为字段选择向上或向下箭头。获得所需顺序后，单击“Save Changes”。\n\n\
  ## Provisioning 中的 Matrix 类别配置屏幕\n\n另一种配置矩阵网格图标配置屏幕上显示的图标的方法是直接在 Provisioning 中访问\
  \ XML 配置。为此，请登录 provisioning 并选择所需公司，然后选择“Matrix Category Configuration”（见图 5-14）。在直接对\
  \ XML 完成编辑后，单击“Save Content”。\n\n![../images/510611_1_En_5_Chapter/510611_1_En_5_Fig14_HTML.jpg](img/510611_1_En_5_Fig14_HTML.jpg)\n\
  \n**图 5-14** Provisioning 中的 Matrix 类别配置屏幕\n\n> **注意**\n> 如果使用矩阵网格图标配置屏幕，则不应在 Provisioning\
  \ 中执行此步骤。您可以将以下代码段与“Impact of loss”配置的截图进行比较，以了解 XML 和配置屏幕如何相互对应。\n\n以下是“impactOfLoss”类别的\
