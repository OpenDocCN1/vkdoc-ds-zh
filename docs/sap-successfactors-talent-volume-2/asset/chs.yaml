  \ |\n| `obj-plan-due` | 结束日期定义了发展目标实现的期限。当用户创建发展目标时，它同时充当默认结束日期。发展计划是持续进行的，并不限于一年期限。\
  \ | `<obj-plan-due>12/31/2023</obj-plan-due>` |\n\n这些元素的示例代码片段如下所示：\n\n```\nDevelopment\n\
  Career Development Plan\n\n5/29/20 6:54 PM\n01/01/2020\n12/31/2023\n```\n\n**开关**\n\
  \n`switches`元素用于开启或关闭发展目标计划的功能。默认值为`off`，这意味着如果您不想使用默认值，则只需将开关插入模板。特定于发展计划模板的开关如表\
  \ 1-6 所示。\n\n**表 1-6 发展计划开关**\n\n| 开关 | 说明 |\n| --- | --- |\n| `show-competency-browser`\
  \ | 在发展目标上添加能力项。 |\n| `continuouspm-integration` | 在计划上显示与发展目标相关的 CPM 成就。 |\n| `development-scorecard-show-all-goals`\
  \ | 在计分卡中包含发展目标。 |\n\n开关在 XML 中应添加在“`<obj-plan-due>`”或“`<obj-plan-numbering>`”（如果使用）之后。\n\
