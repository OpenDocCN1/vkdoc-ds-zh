  \ |\n| 分析 | 从您的可用磁贴库中显示最多四个分析磁贴。 | ![../images/510611_1_En_7_Chapter/510611_1_En_7_Figk_HTML.jpg](img/510611_1_En_7_Figk_HTML.jpg)\
  \ |\n\n1.  单击“添加实时幻灯片”。根据表 7-1 选择“实时幻灯片”的类型。\n2.  打印演示文稿时，你将可以选择在最终打印前如何格式化演示文稿中包含的每种类型的幻灯片。单击“打印”。\n\
  3.  编辑幻灯片内容引入了热点的概念，你只需在演示模式下单击热点区域即可打开链接或特定个人的信息卡。选择此选项后，单击正在编辑的幻灯片右上角的方形图标，然后单击并拖动以覆盖要制作热点的幻灯片区域。然后从出现的菜单中选择单击热点时要显示的链接或个人。单击“确定”完成热点设置。完成所有幻灯片的编辑后，单击“完成”。\n\
  4.  创建自定义幻灯片允许你选择一个已静态上传的幻灯片，并使用拖放编辑器覆盖实时人才信息，如图 7-31 所示。选择此选项将提示你在进入下图所示的编辑器之前，先查找一个你想要输入其信息的员工。SAP\
  \ 的理念是用此功能来替代像素完美的人才卡片。\n\n1.  在此屏幕上，你可以管理所有现有的演示文稿。\n    1.  单击“创建新文件夹”创建一个除默认文件夹（“演示文稿”、“已归档”和“回收站”）之外的目录。将弹出一个窗口供你输入文件夹名称。完成后单击“确定”。\n\
