  \ | X | X |   |\n| 注册表单 | 定义参与者报名时需要完成的问题。同时定义匹配规则。 | X | X | X |\n| 摘要 | 包含用于创建表单的每个页面的内容，为管理员在启动前提供进行任何更新的机会。\
