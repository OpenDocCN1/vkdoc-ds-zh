  \ | 开启 |\n| `hide-position-count` | 隐藏角色的空缺职位数量。仅当在 Provisioning 中启用真实职位层级时适用。 |\
  \ 关闭 |\n| `new-role-readiness-calculation` | 定义角色就绪度的计算方式：求和或平均。当设置为“on”时，就绪度基于平均值计算。\
  \ | 关闭 |\n| `show-self-assessment-in-current-role-tab` | 允许员工在其职业工作表中为当前角色启动角色就绪评估表单。\
  \ | 关闭 |\n\n职业工作表模板 XML 中的开关代码示例如下：\n\n```\n<switch-code-example>\n```\n\n现在我们将详细查看每个开关及其控制的功能。\n\
  \n`cws-dispoption-competency-desc`\n\n此开关控制是否显示目标角色能力的详细信息。如果希望开启开关以查看能力描述，你需要为每个能力创建描述。你可以手动为每个能力添加描述，或使用包含描述的能力批量上传功能。这可以通过“管理工作简介内容导入/导出”来完成，本章稍后将对此进行说明。\n\
  \n当开关设置为“on”时，可通过将鼠标悬停在职业工作表上的信息图标上来查看每个能力的描述。\n\n`disable-jpb-profile-in-cws`\n\
  \n当启用“职位简介生成器”并定义了职位简介时，使用此开关。当此开关设置为“off”时，将显示目标角色的职位简介详情。\n\n`hide-position-count`\n\
  \n此开关显示目标角色有多少个空缺职位。默认情况下，空缺职位数量会显示。空缺职位与继任计划中的职位关联，而非招聘管理中的职位申请。然而，空缺职位计数仅适用于传统职位提名方法，并且需要在\
  \ Provisioning 中启用真实职位层级。MDF 职位不支持此功能。\n\n要隐藏空缺职位数量，应将开关值设置为“on”。如果未设置开关且未使用传统职位提名方法，空缺职位数量将显示为\
  \ 0。\n\n`new-role-readiness-calculation`\n\n此开关用于定义如何计算角色的就绪度。就绪度可以按“就绪能力求和”或“能力就绪度平均值”来计算。当此开关设置为“yes”时，就绪度计算是比例值（平均值）。如果未定义开关，默认值为“off”，即使用求和作为计算类型。\n\
  \n**就绪度计算类型**\n\n既然我们刚刚介绍了用于标识角色就绪计算类型的开关，让我们深入探讨一下。求和与平均都使用员工最新的能力评级，这些评级可能来自绩效评估表、360\
  \ 评估的平均评级、一个或多个指定表单，或 `Role Readiness Assessment` 表单。\n\n我们将介绍这两种就绪度计算类型，以便你决定使用哪一种。先从求和开始。\n\
  \n**求和**\n\n系统首先检查员工针对目标角色各项能力的就绪评级。如果员工当前的能力评级等于或高于预期评级，则员工对该目标角色的能力“已就绪”。如果员工不具备目标角色所需的能力，则员工对该能力“未就绪”。然后，就绪度按\
  \ (员工已就绪的能力数量)/(所需能力总数)% 计算。\n\n**平均**\n\n就绪度基于对员工在目标角色各项能力上的就绪程度进行计算。然后计算这些评级的平均值以确定整体就绪度。计算使用\
  \ XML 中定义的评定量表：\n\n- 如果某项能力的评级达到或超过预期能力评级，则该能力的就绪度为 100%。\n\n\n- 如果员工在当前目标角色的能力评级低于预期评级，则能力准备度的计算公式如下：\n\
  \n（当前评级 – 评级量表最低评级）/（预期能力评级 – 评级量表最低评级）%。\n\n- 如果某项能力没有预期评级，或者员工没有该能力的评级，则该能力的准备度为\
  \ 0。\n\n接下来，将所有百分比相加，再除以目标角色的能力总数，得出角色准备度百分比。\n\n这种方法可能不是最准确的，因为如果某项能力没有预期评级，或者员工没有该能力的评级，平均值计算将会出现偏差。\n\
  \n```\n在 2019 年第四季度发布之前，如果员工想为其当前角色启动角色准备度评估表单，需要在绩效管理中完成。现在，员工可以直接在其职业工作表中为当前角色启动角色准备度评估表单。开启该开关后，将在“我的当前角色”选项卡中创建一个用于评估准备度的链接。\n\
  此开关必须与<current-self-assessment>标签结合使用，该标签用于标识要启动的角色准备度评估表单。\n既然我们已经审查了职业工作表的可用开关，接下来让我们看一个额外的选项。\n\
  在开关之后，您可以限制用户可以考虑的目标角色数量。这是通过<max-per-category>属性在<category-config>中完成的，并紧随开关之后，如下面的示例代码片段所示：\n\
