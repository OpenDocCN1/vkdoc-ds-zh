  \ 1-26 所示。虽然可以从指定的能力库中为发展目标添加能力项，但此开关会在能力浏览器中启用一个“添加能力项”链接，该浏览器包含所有能力项。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig26_HTML.jpg](img/510611_1_En_1_Fig26_HTML.jpg)\n\
  \n图 1-26  \n允许为发展目标额外添加能力项的开关\n\n此开关允许“持续绩效管理（CPM）”列显示在发展目标计划中，该列指示与某个发展目标关联的成就数量。这与目标计划上的功能相同。除了在\
  \ XML 中添加此选项外，您还可以在实例中的发展计划模板中勾选“在发展目标计划上显示持续绩效管理成就”复选框。\n\n无论采用哪种方法，都会在发展计划上启用成就显示。在\
  \ XML 中设置开关，将在模板中勾选复选框。同样，在模板中勾选复选框，也将在 XML 中创建开关。无论哪种情况，在设置此开关之前，请确保您的实例正在使用 CPM\
  \ 数据。\n\n此开关用于在人员档案中包含发展计划门户部件。设置此开关后，将在人员档案的发展计划门户部件中显示用户的所有发展目标。开启此开关后，员工将无法在门户部件中隐藏其发展计划中的任何目标。同时，员工也将无法直接从其发展计划中手动向门户部件添加发展目标。此开关仅在以下条件下生效：在继任数据模型中配置了发展计划门户部件，在人员档案中配置了该门户部件，并且设置了基于角色的权限来查看该门户部件。我们将在本章后面更详细地介绍这一点。\n\
  \n## 将能力项链接到发展目标：能力过滤器\n\n要在发展目标计划中使用能力项，需要对 XML 进行一些补充：\n\n- 在计划上创建一个能力字段（如果在实例中创建模板时未添加该字段）。\n\
  - 确定哪些能力项可以使用。\n- 可选地允许能力浏览器从任何可用的能力库中添加额外能力项。\n\n要允许用户将能力项链接到发展目标，必须在发展计划 XML 中添加一个能力字段。在创建发展目标计划模板时，我们已看到该字段可以在模板中添加。但是，我们仍然需要在\
  \ XML 中添加权限。使用该字段时，还需要在 XML 中指定一个能力库。这定义了用户可以从哪个能力库中选择能力项来添加到发展目标中。\n\n使用`<competency-filters>`标签来定义发展计划可引用的能力项来源（类型）。有效的类型包括角色、表单、类别和库。该标签与“排除”和“包含”值一起使用。“排除”类型用于指定要排除的能力类型。“包含”类型则通过匹配来指定类型（表单、角色、类别、库）。这用于确定可以使用哪个特定的角色、表单、类别或库。\n\
  \n在以下示例代码段中，只有来自特定库的特定类别中的能力项才能被添加到发展目标中。用户只能选择这些能力项添加到他们的发展目标中：\n\n```\ndefault-category\
  \ id=\"Goals\">\nDevelopment Goals\nDevelopment Goals\n```\n\n`<competency-filters>`标签位于`<default-category>`之后，`<field-definition>`之前。\n\
  \n\n\n为了允许用户向发展目标添加学习活动，需要引用学习活动模板。模板 ID 应为`4201`，代码片段如下所示：\n\n```\nThis should\
  \ follow text replacements and appear before the default\ncategory ID as seen in\
  \ the code segment sample that follows:\n```\n\n### 发展计划字段\n\n`field-definition`元素定义了发展计划模板中的字段。目标计划中可用的标准字段（除能力字段外）同样适用于发展目标计划。表\
  \ 1-7 显示了发展计划中可能使用的字段。\n\n**表 1-7** 标准发展目标计划字段\n\n| 字段 | 描述 |\n| --- | --- |\n|\
  \ `Name` | 发展目标名称。 |\n| `Description` | 发展目标的描述。 |\n| `Metric` | 衡量发展目标的方式。 |\n\
  | `Start` | 目标的开始日期。默认值为`<obj-date-start>`。 |\n| `Due` | 目标的完成日期。默认值为`<obj-date-due>`。\
  \ |\n| `State` | 目标的状态。 |\n| `Done` | 完成百分比。 |\n| `Weight` | 通常是一个百分比；如果发展计划用于绩效管理表单，该值会自动填充。\
