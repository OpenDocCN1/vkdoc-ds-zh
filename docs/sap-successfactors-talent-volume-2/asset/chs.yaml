  \n**图 6-3** 继任人才卡片配置界面\n\n1.  点击 `继任人才卡片` 开始配置。将出现如图 6-3 所示的界面。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig4_HTML.jpg](img/510611_1_En_6_Fig4_HTML.jpg)\n\
  \n\n\n### 图 6-4  \n**“编辑扩展信息”界面**  \n\n1. 点击向下箭头展开并编辑扩展信息区域，然后点击“编辑”。该区域将显示为图 6-4\
  \ 所示。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig5_HTML.jpg](img/510611_1_En_6_Fig5_HTML.jpg)\n\
  \n### 图 6-5  \n**“人才信息板块”界面**  \n\n1. 勾选您希望显示的板块各区域旁边的复选框，并选择是否显示该区域的标签。对于**职位级别**、**职能**和**国家/地区名称**，请从数据模型中选择要与此区域值关联的人才字段。完成后，点击“保存”。\
  \  \n2. 点击**人才信息**板块上的“编辑”（如果板块尚未显示在人才卡片上，则点击“添加新板块”并选择**人才信息**）。弹出窗口将加载，如图 6-5\
  \ 所示。勾选您希望显示的字段旁的复选框，并从数据模型中选择要与该字段值关联的人才字段。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig7_HTML.jpg](img/510611_1_En_6_Fig7_HTML.jpg)\n\
  \n### 图 6-7  \n**“能力与目标板块”界面**  \n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig6_HTML.jpg](img/510611_1_En_6_Fig6_HTML.jpg)\n\
  \n### 图 6-6  \n**“绩效与潜力板块”界面**  \n\n1. 点击**绩效与潜力**板块上的“编辑”（如果板块尚未显示在人才卡片上，则点击“添加新板块”并选择**绩效与潜力**）。弹出窗口将加载，如图\
  \ 6-6 所示。选择您希望使用员工档案评分还是矩阵网格配置。对**能力与目标**板块重复此步骤，如图 6-7 所示。  \n\n**注意：** 如果您为管理者提供矩阵网格报告的访问权限并已完成相应配置，建议使用矩阵网格管理配置以保持一致性。**员工人才档案**应仅在简单实施中（作为唯一可用数据源时）使用。由于不推荐使用，我们将不详细说明——有关**员工人才档案**中旧版**概览计分卡\
  \ portlet**迷你九宫格的更多信息，请参见 SAP 注释 2091458。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig8_HTML.jpg](img/510611_1_En_6_Fig8_HTML.jpg)\n\
  \n### 图 6-8  \n**“添加/编辑自定义板块/背景元素”界面**  \n\n1. 通过点击板块的**编辑**或点击**添加板块**，然后选择**自定义板块**，再选择特定的背景元素（如图\
  \ 6-8 所示），添加/编辑数据模型中您希望包含的任何背景元素。选择您希望显示的字段。无论数据模型中定义的背景元素结构如何，您最多只能设置两个标题和两个副标题。\
  \  \n2. 如果需要，添加徽章板块：点击**添加板块**，选择**徽章**，然后点击**添加**。除添加操作外，徽章没有其他配置选项。该板块将显示授予员工的所有徽章。\
  \  \n\n**注意：** 徽章可以是一种有趣且免费的奖励方式，允许管理者和其他员工相互奖励出色的工作或积极的态度。然而，由于该功能的开放性，我们发现大多数公司并不使用徽章。\
  \  \n\n3. 根据需要，点击任意板块上的**上移**或**下移**以调整顺序。  \n4. 根据需要，点击**删除**以移除任意板块。  \n5. 对**校准**和**演示文稿**人才卡片重复上述步骤。\n\
  \n### 最终用户查看人才卡片  \n\n完成人才卡片配置后，您可以通过在系统的以下任意区域点击员工姓名或照片来查看人才卡片：**继任组织架构图**、**血缘图**、**职位磁贴视图**、**MDF\
  \ 人才池**、矩阵网格报告、**校准**和**演示文稿**。您可以滚动人才卡片以查看已配置的所有板块。如果您被分配了继任提名和/或人才池提名的权限（请参见本章中的“设置最终用户权限”部分），则可以直接在人才卡片上添加和编辑提名。所有其他字段均为只读。完整示例如图\
  \ 6-9 所示。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig9_HTML.jpg](img/510611_1_En_6_Fig9_HTML.jpg)\n\
  \n### 图 6-9  \n**人才卡片示例**  \n\n现在您已经了解如何配置和查看人才卡片，我们可以继续以示例公司为例。当销售高级副总裁和总裁使用矩阵网格报告识别出潜在的明星候选人以接替销售高级副总裁时，他们可以点击员工姓名或照片打开人才卡片。通过人才卡片，他们可以查看候选人的更多信息，并立即提名该候选人。\n\
  \n## 提名配置  \n\n继任规划的核心概念是为特定职位提名特定人员，并将其培养为继任者。这一概念对于**继任组织架构图**至关重要（我们将在下一节中介绍），对**人才池**也十分重要。因此，我们现在重点介绍提名在整个继任规划功能中如何在系统中进行配置。\n\
  \n### 了解提名方法  \n\n继任规划配置中最重要的决策之一是选择提名方法。SuccessFactors 允许您在基于职位和基于角色-人员的提名方法之间进行选择。我们建议拥有职位数据并实施职位管理的组织使用基于\
  \ MDF 职位的提名方法。简而言之，职位管理是将单个员工数据与其工作相关信息（如所需技能、分类等，细化到个人角色级别）分离的做法。两者被视为独立的数据对象。一种常见的理解方式是：将职位视为“座位”，员工视为坐在座位上的人。该座位可以有人占用或空置，具体取决于是否有人就座。SAP\
  \ SuccessFactors Employee Central 以及传统的本地部署 SAP 通常使用职位管理进行实施。  \n\n**注意：** 在基于职位的提名方法中，存在传统的职位提名方法和基于\
  \ MDF 职位的方法。由于选择传统的基于职位的方法没有太大意义（因为它无法利用 MDF 的强大功能），因此本文未作介绍。我们同样建议在可能的情况下优先使用基于\
  \ MDF 职位的提名方法，而非基于角色的方法。仅当您的组织完全没有可用职位数据时，才应选择基于角色-人员的提名方法。即便如此，SAP 也提供了一项特殊的 MDF\
  \ 职位同步功能，该功能尝试基于员工层级创建职位层级。我们不会详细讨论此功能，因为它很少使用，且所需的冗长解释会分散您（读者）对更常见场景的注意力。  \n\n\
  基于角色-人员的提名方法（也称为基于现任者的方法）适用于正在过渡到 SuccessFactors 但尚未达到基于职位提名所需的职位数据水平的组织。在这种方法中，您实质上是在提名人员接替特定员工，而非该员工所担任的职位。提名实际上是针对人员与职位代码之间的关系建立的，如果职位代码发生变更，提名数据将被丢弃。\n\
  \n\n\n# 选择提名方法并启用报告\n\n现在我们已经基本了解不同提名方法的含义，接下来让我们在系统中设置一个方法，以便开始使用！\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig10_HTML.jpg](img/510611_1_En_6_Fig10_HTML.jpg)\n\
  \n**图 6-10** 在配置中选择继任提名方法\n\n1. 登录所属组织的 `Provisioning`，点击“公司设置”。\n2. 向下滚动到“继任提名方法”，按图\
  \ 6-10 所示选择方法。\n3. 勾选“使用无表单提名审批工作流”旁的复选框，如图 6-10 所示（请注意，只有角色-人员提名方法才能使用基于表单的提名审批工作流）。同时勾选“超组织结构图”旁的复选框（图中未显示）。\n\
  4. 点击“保存”。\n\n**注意**\n\n在选择 `MDF` 职位前，应确保已激活 `MDF` 以及基于角色的权限。由于报告功能与提名方法相关联，此时可能还需要启用报告。请勾选“继任（基于\
  \ MDF 职位提名）”、“继任历史（基于 MDF 职位提名）”和“包容性继任（基于 MDF 职位提名）”复选框。本章不对报告功能进行详细说明，因为即席报告和仪表板的概念与其他模块一致。我们只需开启数据访问权限即可。\n\
  \n### 就绪度评级量表\n\n必须配置就绪度评级量表，以便用户在提名他人时，能选择被提名者对应职位的就绪程度。其配置方式与绩效管理类似。请按以下步骤操作：\n\
  \n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig11_HTML.jpg](img/510611_1_En_6_Fig11_HTML.jpg)\n\
  \n**图 6-11** 就绪度评级量表配置\n\n1. 在搜索栏中输入并选择“评级量表”。\n2. 点击“创建新评级量表”按钮。屏幕将显示如图 6-11 所示界面。\n\
  3. 在“名称”字段中，准确输入“Readiness”（所有实施场景中该名称必须始终为 Readiness）。\n4. 选择量表的等级数量。然后为每个等级输入分数、标签和描述，并点击“保存”。\n\
  \n**注意**\n\n我们建议最低分表示最不成熟，最高分表示最成熟。你还需要在继任组织结构图 XML 中定义此量表，且两者必须完全一致。我们将在“继任组织结构图”部分介绍组织结构图\
  \ XML。\n\n## 提名设置界面\n\n在使用此界面之前，请务必按照以下步骤配置提名设置界面：\n\n**表 6-1** 提名设置界面选项\n\n| 选项\
  \ | 描述 |\n| --- | --- |\n| 隐藏此日期之前的继任提名历史记录（留空则显示所有记录） | 建议留空此字段，以便显示所有历史记录。如果评审周期中数据已过时，或已过渡到新流程，此工具可帮助你隐藏不再相关的旧数据。\
  \ |\n| 启用继任者排名 | 勾选此复选框后，每当有继任者被提名时，系统将允许用户同时输入排名编号，该编号将作为职位继任者的次要排序依据。 |\n| 允许按就绪度排名\
  \ | 勾选此复选框后，用户将优先按排名排序，而非按就绪度排序。仅当前一个复选框被勾选时，此选项才会出现。 |\n| 如用户拥有相应的表单创建权限，允许报告启动未来角色能力评估。\
  \ | 如果你的组织使用能力评估，可勾选此复选框启用。用户在选择就绪度级别时将看到“评估就绪度”选项。若勾选此框，则需要为每个已配置区域设置选择一个标识就绪度模板的表单模板。\
  \ |\n\n\n\n# 根据继任计划权限过滤“当前提名”Portlet 数据\n\n默认情况下，如果你拥有查看某人的权限，你将看到所有针对该职位的提名。如果勾选此复选框，用户将仅能查看其同时拥有继任计划权限的职位的提名。\n\
  \n# 在“当前提名”Portlet 中显示隐藏提名的数量\n\n如果勾选了上一个复选框，此复选框将出现。勾选后，它会向用户弹出一个警告提示，告知有多少职位因安全限制而被隐藏。\n\
  \n# 对所有用户隐藏记分卡 Portlet 中的待处理提名\n\n如果你已选择将提名与审批分离，则此复选框会在用户查看人才档案中的员工记分卡时，隐藏尚未获得批准的提名。\n\
  \n# 允许拥有候选人搜索权限的继任计划制定者提名外部候选人\n\n如果你已启用招聘功能，并且用户拥有执行招聘候选人搜索的权限，勾选此复选框将允许他们基于招聘外部候选人数据库执行外部候选人搜索以进行提名。\n\
  \n# 若被提名人成为现任者，则自动移除该提名\n\n如果你使用的是 MDF 职位，可以勾选此选项，以便在继任者占据该职位时隐藏提名。该提名仍会存在，但会被记录为“继任成功”，仅不会在继任组织架构图中显示，从而确保任何历史报告数据不被移除。勾选此复选框后，系统不会追溯隐藏被提名人。\n\
  \n# 将目标人群应用于人才库提名权限\n\n如果勾选此复选框，你需要为人才库提名权限定义目标权限。我们将在本章后续的“人才库”部分详细讨论此设置。\n\n#\
  \ 在“添加提名”对话框中，为“职位”搜索和“现任者”搜索显示独立字段（推荐用于大量用户和职位场景以获得更优性能）\n\n如果勾选此复选框，搜索提名人的用户将看到一个带有单选按钮的弹出框，允许他们在职位或被提名人之间进行选择。此功能推荐给拥有大量职位、且在未启用此功能时提名搜索速度缓慢的公司。请注意，此选项仅适用于\
  \ MDF 职位提名方法。\n\n1. 在搜索栏中输入并选择“提名设置”。\n2. 根据表 6-1 选择配置选项。\n3. 点击“保存”。\n\n现在提名设置已完成，我们将能够详细查看使用提名的各项功能，首先从最常用的提名创建方式——继任组织架构图开始。\n\
  \n## 继任组织架构图\n\n既然我们已经完成了执行提名的设置，接下来让我们深入了解如何将那些有才华的人提名到具体职位。继任组织架构图允许用户以基于职位的组织架构图形式查看人才和提名信息。我们倾向于将继任组织架构图视为\
  \ SuccessFactors 人才管理的巅峰之作。它为您提供了组织的鸟瞰图，并展示了在您选择的任意层级上，每个职位和人员处于继任计划中的哪个阶段。在销售演示中，它是最能引起高管们赞叹的功能——这绝非空穴来风。它所呈现的可视化信息是大量数据以及为确保这些数据保持最新而付出的巨大努力的结晶！不过，我们倾向于认为\
  \ SAP SuccessFactors 让这项工作变得更容易、更有趣。让我们更详细地了解一下吧！\n\n## 配置和使用继任组织架构图的先决条件\n\n在配置或使用组织架构图之前，我们需要确保一些关键系统设置和权限已就位。接下来我们看看这些内容。\n\
  \n### 激活组织架构图\n\n\n\n# 设置继任提名方法\n\n现在我们对不同的提名方法有了基本了解，接下来在系统中设置一个方法以便开始使用！\n\n1.\
  \ 登录到您组织的 Provisioning 系统，点击“**Company Settings**”（公司设置）。\n2. 向下滚动到“**Succession\
  \ nomination method**”（继任提名方法），选择您的方法。\n3. 勾选“**Ultra Organization Chart**”（超级组织架构图）旁边的复选框。\n\
  4. 点击“**Save**”（保存）。\n\n> **注意**  \n> “**Ultra Organization Chart**”（超级组织架构图）适用于系统中的所有组织架构图，而不仅仅是继任管理。您可以通过勾选“**Turn\
  \ off Succession Organization Chart**”（关闭继任组织架构图）旁边的复选框来选择关闭继任组织架构图功能。\n\n# 设置 MDF\
  \ 职位对象和授予配置权限\n\n如果您使用的是基于 MDF 职位的提名方法，建议您先设置好职位数据。设置系统中 MDF 职位的权限和流程将在下一章的“**Position\
  \ Tile View**”（职位磁贴视图）部分中介绍。我们特意将配置分散到这两个部分中，以展示相同的数据如何以不同方式查看，以及相同的配置如何类似地影响系统的两个区域。\n\
  \n### 加载 MDF 职位数据\n\n现在前提条件已经完成，MDF 对象也已定义，我们可以开始加载您可能拥有的任何历史职位数据。请按照以下步骤导入这些数据：\n\
  \n### 表 6-3：MDF 导入选项说明\n\n| 选项 | 说明 |\n| --- | --- |\n| `File Encoding`（文件编码） |\
  \ 指文件的字符编码。请注意，当您使用编辑器保存本地 `.csv` 文件时，务必在此处也选择相同的编码。我们推荐使用 `UTF-8`，因为它对国际语言的处理效果最佳。\
  \ |\n| `Purge Type`（清除类型） | “**Incremental Load**”（增量加载）仅添加新对象或替换旧对象。“**Full Purge**”（完全清除）将删除上传中不存在的任何现有对象。\
  \ |\n| `Suppress Redundant Date-Effective Records`（抑制冗余的日期生效记录） | 选择“**Yes**”或“**No**”；我们推荐选择“**Yes**”，以避免系统中存在冗余数据。\
  \ |\n| `Key Preference`（键偏好） | 请参见上一张表，并选择与模板导出相同的选项。 |\n| `Use Locale Format`（使用区域设置格式）\
  \ | 根据区域设置定义日期等的格式。如果选择“**No**”，屏幕底部将显示 `MM/DD/YYYY` 的示例日期格式。如果选择“**Yes**”，系统将提示您选择区域设置偏好。\
  \ |\n| `Enable Decimal Round Option`（启用小数舍入选项） | 如果您在 MDF 中为某个字段定义了小数舍入，此选项将启用该舍入功能。\
  \ |\n| `Identity Type`（身份类型） | 请参见上一张表，并输入为模板选择的相同值。 |\n\n### 表 6-2：MDF 导入模板选项说明\n\
  \n| 选项 | 说明 |\n| --- | --- |\n| `Include Dependencies`（包含依赖项） | 选择“**Yes**”将下载一个包含父对象及根据\
  \ MDF 对象定义的所有子对象的 `.csv` 模板的 zip 文件。该 zip 文件随后也必须通过导入屏幕上的 zip 文件选项进行上传。选择“**No**”将仅为职位对象下载一个\
  \ `.csv` 文件。 |\n| `Include Immutable IDs`（包含不可变 ID） | 如果选择“**Yes**”，将下载实体 ID 和记录\
  \ ID。 |\n| `Exclude Reference Objects`（排除参考对象） | 如果分别选择“**No**”或“**Yes**”，则在 `.zip`\
  \ 文件中包含或排除参考对象 `.csv` 模板。 |\n| `Key Preference`（键偏好） | 选择“**Business Key**”（业务键）将使用\
  \ MDF 用于创建唯一标识符的一组字段。“**External Code**”（外部代码）可以是基于此输入字段手动设置的键。 |\n| `Hide External\
  \ Code`（隐藏外部代码） | 将从下载的 `.csv` 文件中隐藏此字段。请注意，如果您的键偏好设置为“**External Code**”，则无法选择此选项。\
  \ |\n| `Identity Type`（身份类型） | 定义使用“**User ID**”（用户 ID）还是“**Assignment ID**”（分配\
  \ ID）来引用员工身份。分配 ID 是 Employee Central 引入的一个较新概念，用于简化全球分配。如果您尚未实施 Employee Central，则使用用户\
  \ ID。 |\n\n1. 在搜索栏中键入并选择“**Import and Export Data**”（导入和导出数据）。\n2. 在“**Select action\
  \ to perform**”（选择要执行的操作）字段中，选择“**Download Template**”（下载模板）。\n3. 在“**Select Generic\
  \ Object**”（选择通用对象）字段中，选择“**Position**”（职位）。\n\n\n\n### 参考表格\n4.  参考表 6-2 选择其他字段。\n\
  5.  点击“下载”。\n6.  在编辑器中打开文件，并添加您的历史数据。\n7.  在“要执行的操作”字段中，选择“导入数据”。\n8.  在“选择通用对象”中，选择“职位”。\n\
  9.  点击“选择文件”，在本地计算机上找到该文件。\n10. 参考表 6-3 了解所有其他字段选项。\n11. 点击“导入”。\n\n系统会创建一个作业来导入数据。您可以通过在搜索栏中输入并选择“监控作业”来检查作业进度和错误日志。\n\
  \n### 配置继任组织架构图\n现在我们已经设置了基本的系统设置和权限，并定义和加载了职位数据，接下来需要定义继任数据的结构和可视化方式。这可以通过“继任组织架构图\
  \ XML”来实现。\n\n#### 了解继任组织架构图 XML 中的字段并确保配置好选择列表\n在了解如何编辑“继任组织架构图 XML”之前，需要先掌握一些关键概念。继任管理中一个容易混淆的概念是理解“继任数据模型\
  \ XML”键与“继任数据模型”之间的映射关系。虽然这些技术字段名在 XML 中通常是一致的，但并非总是如此。例如，数据模型中的`addressLine1`对应“继任组织架构图\
  \ XML”中的`addr1`键，而`lastReviewDate`映射到`last_review_date`。如果不熟悉这些细微差别，在创建 XML 时可能会遇到困扰。此外，在“继任组织架构图”的最新版本（v12）中，您只能直观地显示非文本类型的项目。为澄清这些细微差别，请参考表\
  \ 6-4。\n\n**表 6-4：数据模型到继任组织架构图字段映射及字段类型**\n\n| 继任数据模型字段 | 继任组织架构图键 | 字段类型 |\n| :---\
  \ | :--- | :--- |\n| `addressLine1` | `addr1` | `text` |\n| `addressLine2` | `addr2`\
  \ | `text` |\n| `benchStrength` | `benchStrength` | `picklist` |\n| `businessPhone`\
  \ | `biz_phone` | `text` |\n| `businessSegment` | `businessSegment` | `picklist`\
  \ |\n| `Citizenship` | `citizenship` | `picklist` |\n| `City` | `city` | `text`\
  \ |\n| `competency` | `competency` | 遵循使用在该处配置的能力量表的矩阵网格配置 |\n| `Country` | `country`\
  \ | `text` |\n| `custom01`–`custom15` | `custom01`–`custom15` | `text` |\n| `sysOverallCustom1`\
  \ | `customrating1` | 遵循使用在该处配置的自定义 1 量表的矩阵网格配置 |\n| `sysOverallCustom2` | `customrating2`\
  \ | 遵循使用在该处配置的自定义 2 量表的矩阵网格配置 |\n| `dateOfBirth` | `dateOfBirth` | `text`（日期格式）\
  \ |\n| `dateOfPosition` | `dateOfPosition` | `text`（日期格式） |\n| `Department` | `department`\
  \ | 根据用户数据文件中加载的系统部门自动生成的列表 |\n| `Division` | `division` | 根据用户数据文件中加载的系统部门自动生成的列表\
  \ |\n| `Email` | `email` | `text` |\n| `empId` | `empId` | `text` |\n| `Ethnicity`\
  \ | `ethnicity` | `picklist` |\n| `Fax` | `fax` | `text` |\n| `firstName` | `firstName`\
  \ | `text` |\n| `Function` | `function` | `picklist` |\n| `futureLeader` | `futureLeader`\
  \ | `Boolean`（`true`/`false`） |\n| `Gender` | `gender` | 硬编码枚举，值为 M、F |\n| `hireDate`\
  \ | `hireDate` | `text`（日期格式） |\n| `impactOfLoss` | `impactOfLoss` | `picklist`\
  \ |\n| `jobCode` | `jobCode` | `text` |\n| `keyPosition` | `keyPosition` | `Boolean`（`true`/`false`）\
  \ |\n| `lastName` | `lastName` | `text` |\n| `lastReviewDate` | `lastReviewDate`\
  \ | `text`（日期格式） |\n| `Level` | `level` | `picklist` |\n| `location` | `location`\
  \ | 根据用户数据文件中加载的系统地点自动生成的列表 |\n| `managerId` | `managerId` | `text` |\n| `Married`\
  \ | `married` | `Boolean`（`true`/`false`） |\n| `matrix1label` | `matrix1label` |\
  \ `text`（来自矩阵网格配置） |\n| `matrix2label` | `matrix2label` | `text`（来自矩阵网格配置） |\n|\
  \ `matrixManaged` | `matrixManaged` | `Boolean`（`true`/`false`） |\n| `Mi` | `mi`\
  \ | `text` |\n| `Minority` | `minority` | `Boolean`（`true`/`false`） |\n| `Nationality`\
  \ | `nationality` | `picklist` |\n\n\n\n\n`newToPosition` | `newToPosition` | 布尔值\
  \ (true/false)\n`objective` | `objective` | 遵循矩阵网格配置，使用其中配置的目标标尺\n`performance`\
  \ | `performance` | 遵循矩阵网格配置，使用其中配置的绩效标尺\n`potential` | `potential` | 遵循矩阵网格配置，使用其中配置的潜力标尺\n\
  `reasonForLeaving` | `reasonForLeaving` | 选择列表\n`reviewFreq` | `review_freq` | 文本\n\
  `riskOfLoss` | `riskOfLoss` | 选择列表\n`serviceDate` | `serviceDate` | 文本\n`Ssn` |\
  \ `ssn` | 文本\n`State` | `state` | 文本\n`talentPool` | `talentPool` | 选择列表\n`Title`\
  \ | `title` | 文本\n`userId` | `userId` | 文本\n`Username` | `username` | 文本\n`zipCode`\
  \ | `zip` | 文本\n\n我们建议为您选择包含在组织架构图配置中的每个继任数据模型字段（如上表所述）配置选择列表。这将确保您可以在 XML 配置中为它们建立图标关联。在进行\
  \ XML 配置之前，您需要在搜索栏中输入并选择“选择列表中心”来维护这些选择列表。作为卷 1 第 2 章概述的继任数据模型配置的一部分，您可能已经完成了此操作。选择列表很重要，因为您可以在继任组织架构图配置中将选择列表与颜色渐变和/或图标关联。\n\
  \n## 在 Provisioning 中编辑继任组织架构图 XML\n\n现在选择列表已设置好，我们可以开始 XML 配置了！请按照以下步骤在 Provisioning\
  \ 中访问和编辑 XML：\n\n1.  登录 Provisioning 并选择您的公司。\n2.  在“继任管理”下，点击“编辑组织架构图配置”。\n3. \
  \ 对 XML 进行编辑（我们建议复制粘贴到离线编辑器中），以显示您希望在组织架构图上可用的图标和渐变。\n4.  点击“保存”。\n\n图 6-12 显示了一个示例\
  \ XML 文件，其中每个元素都已折叠，以显示文件的最高层级结构。您可以看到每个高层级元素要么是 `gradientOption`、`iconSetOption`、`textOption`，要么是\
  \ `keyPositionOption`。由于我们使用的是最新的继任组织架构图 (v12)，`textOptions` 将被忽略（仅在旧版本中使用）。唯一允许的\
  \ `gradientOptions` 是“`readiness`”和“`benchStrength`”。前面表格中所有其他非文本字段都可以配置为 `iconSetOptions`。`keyPositionOption`\
  \ 必须在 XML 的顺序中排在最后。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig12_HTML.jpg](img/510611_1_En_6_Fig12_HTML.jpg)\n\
  \n**图 6-12** 继任组织架构图 XML 的折叠视图\n\n> **注意：** 我们建议至少配置 XML，使其包含 `readiness` 和 `benchStrength`\
  \ 的 `gradientOption` 以及 `keyPosition`。其余的配置取决于您希望将前面表格中的哪些选择列表和布尔字段显示为图标，以及每个字段值对应哪个图标。\n\
  \n图 6-13 显示了每个 `gradientOption`、`iconSetOption` 元素以及 `keyPositionOption` 配置完成后的最终结果。您可以看到每个图标都作为显示选项中的一个图标被计入，并且每个渐变都关联了一种颜色。例如，“SVP\
  \ Sales”职位左侧显示了一个绿色标记，因为其总体板凳强度为“随时就绪”，因为该职位有一名候选人其就绪程度为“随时就绪”（也以绿色显示）。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig13_HTML.jpg](img/510611_1_En_6_Fig13_HTML.jpg)\n\
  \n**图 6-13** 继任组织架构图 XML 的最终可视化结果\n\n接下来的小节将举例说明如何配置上例中所示的每种高层级 XML 元素。请参考表 6-5，了解应如何处理\
  \ XML 中的每个元素。\n\n### 表 6-5 继任组织架构图 XML 元素/属性描述\n\n| 元素/属性 | 描述 |\n| --- | --- |\n\
  | `index=` | 唯一递增编号。为 `readiness` 使用“1”，为 `benchStrength` 使用“2”。对于其余图标，按照您希望图标出现的顺序使用递增编号。\
  \ |\n| `key=` | 填写本章提供的映射表中的继任组织架构图字段键。 |\n| `Type` | `readiness` 始终为“`readiness`”，`benchStrength`\
  \ 始终为“`titleGradient`”。任何 `iconOption` 始终为“`iconset`”。 |\n| `Label` | 用户将看到的默认文本标签。请参阅下一小节中\
  \ `gradientOption` 的示例，了解如何提供本地化标签。 |\n| `Value` | 输入选择列表值。确保在“选择列表中心”屏幕中也已填写相应的值字段。对于就绪级别，值越高表示越就绪。对于性别，使用“M”或“F”；对于布尔字段，使用“true”或“false”。\
  \ |\n| `Index` | 仅用于 `gradientOption`。一个单独的数字，对应于 SAP 在此维护的颜色表：`https://help.sap.com/viewer/55e0a1102eda4d83a5638a3526003bd0/2005/en-US/6dadf9f3ebc34b51a65102c6dba07081.html`。\
  \ |\n| `image` | 仅用于 `iconOption`。标识将为字段的每个值显示的图标图像。SAP 在此维护图像值及对应图像的表格：`https://help.sap.com/viewer/55e0a1102eda4d83a5638a3526003bd0/2005/en-US/523be343cf874f10a633c5089ac65117.html`。\
  \ |\n\n### `readiness` 的 `gradientOption` 元素 XML 配置示例\n\n```xml\n<gradientOption>\n\
  \  <key>readiness</key>\n  <Type>readiness</Type>\n  <Label>Readiness</Label>\n\
  \  <value>\n    <Value>3-5 Years</Value>\n    <Label>3-5 Years</Label>\n    <Index>1.0</Index>\n\
  \  </value>\n  <value>\n    <Value>1-2 Years</Value>\n    <Label>1-2 Years</Label>\n\
  \    <Index>2.0</Index>\n  </value>\n  <value>\n    <Value>Ready Now</Value>\n \
  \   <Label>Ready Now</Label>\n    <Index>3.0</Index>\n  </value>\n</gradientOption>\n\
  ```\n\n> **注意：** 在上例中，为简洁起见，我们仅为 `en_US` 区域设置包含了一个“3–5 Years”的本地化标签。为您希望本地化的每个标签和区域设置重复此模式。这适用于\
  \ `gradientOption`、`iconOption`、和 `keyPositionOption`。\n\n### `riskOfLoss` 的 `iconOption`\
  \ 元素 XML 配置示例\n\n```xml\n<iconSetOption>\n  <key>riskOfLoss</key>\n  <Type>iconset</Type>\n\
  \  <Label>Risk of Loss</Label>\n  <value>\n    <Value>High</Value>\n    <image>sap_ui5_icon_RiskOfLoss01_high</image>\n\
  \    <Index>3.0</Index>\n  </value>\n  <value>\n    <Value>Medium</Value>\n    <image>sap_ui5_icon_RiskOfLoss01_medium</image>\n\
  \    <Index>2.0</Index>\n  </value>\n  <value>\n    <Value>Low</Value>\n    <image>sap_ui5_icon_RiskOfLoss01_low</image>\n\
  \    <Index>1.0</Index>\n  </value>\n</iconSetOption>\n```\n\n### `keyPosition`\
  \ 元素 XML 配置示例\n\n```xml\n<keyPositionOption>\n  <Type>keyPosition</Type>\n  <Label>Highlight\
  \ key positions</Label>\n</keyPositionOption>\n```\n\n### 其他可选设置\n\n如果您希望在继任组织架构图中显示自定义管理者，请将\
  \ XML 的第二行替换为以下内容：\n\n```xml\n<setting key=\"usedefinedmanager\" value=\"true\"\
  \ />\n```\n\n## 组织架构图配置屏幕\n\n我们通过组织架构图配置屏幕来结束组织架构图配置。要访问该屏幕，请执行以下步骤：\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig14_HTML.jpg](img/510611_1_En_6_Fig14_HTML.jpg)\n\
  \n**图 6-14** 组织架构图配置屏幕\n\n1.  在搜索栏中输入并选择“组织架构图配置”。\n2.  点击“继任组织架构图”选项卡。屏幕将如图 6-14\
  \ 所示加载。\n\n### 表 6-6 组织架构图配置字段\n\n| 字段 | 描述 |\n| --- | --- |\n| `Display Photo`\
  \ | 我们建议勾选此框以显示照片，除非您的组织尚未在员工档案中加载任何照片，或已禁用员工自行上传照片的功能。 |\n| `Allow succession planners\
  \ to view successors on org chart nodes/position tile view` | 当您勾选此框时，系统还将使用“继任计划”权限来确定谁可以查看继任信息，而不仅仅是使用“继任管理和矩阵报告权限”（请参阅本章后面关于设置最终用户权限的小节）。我们建议勾选此框，除非您有这样一种场景：您希望限制某些可以提名的人员的可见性——例如，如果管理者可以为其员工提名，但您不希望他们在同一管理范围内看到其他提名信息。\
  \ |\n\n\n\n\n# 将继任组织架构图可见性限制为基本组织架构图目标人群\n\n勾选此框后，在创建基于角色的权限时，会将可见性限制为`权限`界面中`常规用户权限`下的`组织架构图导航权限`设置。我们尚未遇到组织需要此功能的场景，因为您已经可以通过`继任管理与矩阵报告权限`来定义人群。如果您希望这些权限完全相互对应，该功能可能会很有用。\n\
  \n# 隐藏团队总人数以加快加载速度\n\n如果您的组织非常庞大，在查看组织架构的顶层几级时可能会遇到问题，因为系统会尝试计算每个职位下的所有汇报关系。例如，一个拥有\
  \ 30 万名员工的组织，其 CEO 会显示`x`名直接下属和总计 299999 名汇报人员。如果您在这些层级加载组织架构图时遇到长时间等待，我们建议勾选此选项，以便屏幕加载前不执行此计算。\n\
  \n# 隐藏矩阵团队规模以加快加载速度（仅限矩阵报告模式）\n\n与前述场景类似，如果您使用矩阵报告并选择`仅矩阵报告`可视化选项，可以勾选此框以加快屏幕加载时间。\n\
  \n1.  按表 6-6 所示进行推荐选择，然后点击`保存`。\n\n# 加载遗留继任者数据\n\n完成所有配置并加载职位数据后，我们可以加载来自前一个系统的任何遗留继任者数据。请按照以下步骤访问导入界面、下载模板并上传任何遗留数据：\n\
  \n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig15_HTML.jpg](img/510611_1_En_6_Fig15_HTML.jpg)\n\
  \n**图 6-15** 导入继任者界面\n\n1.  在搜索栏中输入并选择`导入继任者`。导入继任者界面将加载，如图 6-15 所示。\n\n## 表 6-7\
  \ 继任者导入模板中的字段\n\n| 字段 | 描述 |\n| --- | --- |\n| `GENERIC_POSITION_CODE` | 输入您希望提名为继任者的\
  \ MDF 职位对象的`代码`字段值。 |\n| `OLD_GENERIC_POSITION_CODE` | 如果使用`转移`操作，请输入将被提名人转出的来源职位代码。\
  \ |\n| `POOL_CODE` | 输入您希望提名为继任者的 MDF 人才库对象的`代码`字段值。 |\n| `OLD_POOL_CODE` | 如果使用`转移`操作，请输入将被提名人转出的来源人才库代码。\
  \ |\n| `READINESS` | 输入就绪程度的值 – 例如，选项列表和继任组织架构图 XML 中的`值`字段。 |\n| `SUCCESSOR_USERID`\
  \ | 输入继任数据模型/员工数据文件中该员工的`USERID`。 |\n| `NOTE` | 输入您希望显示在评论部分中关于该提名的任何评论。 |\n| `RANK`\
  \ | 假设您在提名设置中选择了包含排名，请输入候选人的数字就绪排名。 |\n| `ACTION` | 值可以是`ADD`、`UPDATE`、`TRANSFER`或`DELETE`。将此字段留空或使用`ADD`或`UPDATE`执行相同的功能：系统将查找现有记录进行更新；如果未找到，则添加记录。`DELETE`将删除记录。对于`TRANSFER`，您需要定义移动记录的目标和来源提名。\
  \ |\n\n1.  点击`下载模板`。\n\n**注意：** 模板将根据您所做的配置动态变化，因此模板不一定能在组织之间转移。\n\n2.  在本地机器上以表\
  \ 6-7 为指南填写模板（假设您到目前为止已遵循我们推荐的配置）。\n\n3.  选择您的文件编码（我们推荐 UTF-8，因为它能最好地处理本地化语言）。\n\
  \n4.  点击`选择文件`，选择您已使用继任者数据编辑过的文件。\n\n5.  点击`导入继任者`。导入完成后，您将收到一封包含导入详细信息的电子邮件。重复上述步骤以解决邮件中所述未成功加载的任何继任者数据。\n\
  \n### 设置最终用户权限\n\n我们已经为设置继任组织架构图付出了很多努力。我们快完成了！最后一步是为我们的用户设置权限。为了正确查看继任组织架构图，您需要拥有查看\
  \ MDF 职位、继任数据和组织架构图界面本身的权限。我们将在下一章的`职位卡片视图`部分介绍 MDF 职位对象的权限，因为这也涉及在那里完成的 MDF 配置。请按照以下步骤授予对继任组织架构图界面和继任数据的访问权限：\n\
  \n## 表 6-8 继任组织架构图权限选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `继任组织架构图权限` | 授予对继任组织架构图界面的访问权限。\
  \ |\n| `继任审批权限` | 允许用户审批提名。系统中的提名审批很简单 – 您可以通过始终同时授予`继任规划权限`和`审批权限`来有效取消审批流程。如果对同一用户和员工人群未授予审批权限，则用户的提名必须由对该人群具有审批权限的用户批准。在前文中选择此选项时，请务必在角色上定义您的目标人群。（注意，您可以选择在系统中设置待审批电子邮件。这需要在配置中设置`发送待处理提名电子邮件`批处理作业，并在`电子邮件通知模板设置`界面上设置`继任电子邮件审批者`电子邮件模板。）\
  \ |\n| `继任管理与矩阵报告权限` | 允许用户在组织架构图中看到此已定义的人群。 |\n| `继任规划权限` | 允许用户为此已定义的人群提名继任者。\
  \ |\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig16_HTML.jpg](img/510611_1_En_6_Fig16_HTML.jpg)\n\
  \n**图 6-16** 继任组织架构图权限\n\n1.  在搜索栏中输入并选择`管理权限角色`。\n\n2.  界面加载后，点击您希望修改的角色。然后点击`权限...`\n\
  \n3.  点击`继任规划者`（图 6-16）并根据需要从表 6-8 中选择以下选项。\n\n4.  可选地，如果您希望在职位卡片中看到推荐的继任者，请转至`职业发展规划`并选择`推荐继任者`。\n\
  \n5.  可选地，如果您已实施 SuccessFactors LMS 并希望能够从组织架构图分配学习任务，请转至`学习`并选择`学习访问权限`。点击`完成`。请务必在主界面上也保存您的角色。\n\
  \n# 使用继任组织架构图\n\n是时候开始使用我们的继任组织架构图了！请按照以下步骤逐步操作继任组织架构图：\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig17_HTML.jpg](img/510611_1_En_6_Fig17_HTML.jpg)\n\
  \n**图 6-17** 继任组织架构图\n\n1.  在搜索框中，输入并选择`查看继任组织架构图`。组织架构图将从登录用户的职位开始显示。\n\n2.  要选择其他用户或职位，请点击单选按钮，指示您希望通过职位或个人进行搜索。在搜索框中输入并选择人员或职位名称。组织架构图将如图\
  \ 6-17 所示显示。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig18_HTML.jpg](img/510611_1_En_6_Fig18_HTML.jpg)\n\
  \n**图 6-18** 职位卡片\n\n\n\n1.  如果您已为人员填写了任何人才字段，并在组织架构图 XML 中设置了图标（例如`riskOfLoss`），这些图标将显示在该人员旁边。您可以将鼠标悬停在图标上，通过弹出的小窗口查看同样已配置好的文本描述，以防您不熟悉每个图标的含义。\n\
  \n**注意**：客户常见的一个困惑/误解是，他们认为这些人才字段可以直接在此处编辑。用户必须导航至员工的“人才档案”才能编辑这些字段中的值。您可以通过单击员工的姓名或照片打开职位磁贴，然后再次单击姓名或照片打开该员工的才能卡片，接着在才能卡片上再次单击姓名或照片，即可在新窗口中打开“人才档案”。进入后，您可以向下滚动到档案的“人才”部分，在拥有相应权限的情况下进行编辑。\n\
  \n2.  如果您无法看到任何图标，请单击右上角的“眼睛”图标以调出显示选项。您可以在此选择显示所有汇报人、仅显示直接下属或仅显示矩阵汇报人。您还可以勾选每个已配置图标旁的复选框，以控制该图标是否在主屏幕上显示。此外，您还可以选择为每个职位显示\
  \ 3 位还是 12 位继任者。另外，还有一个选项可以仅高亮显示关键职位（其他所有职位将变为灰色）。\n\n3.  要显示或隐藏单个职位的图标和候选人，请切换职位右上角的“更多”或“更少”链接。\n\
  \n4.  您可以通过单击职位顶部的“上移一级”或职位底部的“汇报人数”，在组织架构图中向上或向下导航。\n\n5.  如果组织架构图变得杂乱，您可以再次单击已显示直接下属的职位底部的“汇报人数”，以关闭该职位的直接下属显示。\n\
  \n6.  您还可以通过单击并拖动鼠标来移动组织架构图。\n\n7.  要放大或缩小，请单击屏幕右上角的“+”或“-”图标。\n\n8.  要隐藏顶部的菜单栏并为组织架构图腾出更多空间，请单击屏幕右上角的双箭头方框图标。\n\
  \n9.  要下载屏幕上的图表副本，请单击屏幕右上角的向下箭头图标。您可以选择以`.pdf`或`.jpg`格式下载。\n\n10. 要打开职位卡片，请单击屏幕上的任意位置。职位卡片将弹出，如图\
  \ 6-18 所示。\n\n![../images/510611_1_En_6_Chapter/510611_1_En_6_Fig19_HTML.jpg](img/510611_1_En_6_Fig19_HTML.jpg)\n\
  \n**图 6-19** 提名弹出窗口\n\n1.  单击右上角的“菜单”汉堡图标，以编辑 MDF 职位对象、删除 MDF 职位对象、查看提名历史记录（显示对候选人执行的提名操作）、创建职位申请、查看世系图、查看职位角色详细信息或隐藏该职位。如果您使用的是招聘模块，您还可以在此添加“创建申请”菜单项。所有这些选项都取决于您的配置和权限。MDF\
  \ 职位相关的配置和权限在下一章的“职位磁贴视图”部分中介绍。提名在本节的前面部分以及本章的“提名设置屏幕”部分中介绍。世系图在下一章的“世系图”部分中介绍。职位角色权限在第\
  \ 1 卷，第 3 章中介绍。\n    *   如果您隐藏了一个职位，组织架构图右上角将出现一个新图标，该图标带有一个轮廓和一把锁，表示隐藏职位的数量。您可以单击此图标以取消隐藏所有隐藏职位。\n\
  \    *   要更改关键职位值，请从下拉菜单中选择。\n    *   您可以通过单击相应的栏，在查看在职者、已命名的继任者或通过职位代码与职位关联的人才库之间切换。单击任何员工姓名或照片，以打开这些人员的才能卡片。才能卡片配置在本章前面的“才能卡片”部分中介绍。请注意，您可以从此人的才能卡片中将其提名到某个职位，也可以提名某人到该员工的职位。此外，您可以通过单击“已命名继任者”栏中的“+\
  \ 添加继任者”来提名继任者（弹出窗口将如图 6-19 所示显示）。您会注意到，当您在此处添加具有不同就绪等级的继任者时，职位卡片上的替补实力以及职位左侧对应的颜色将调整为被提名者中的最佳就绪等级。最后，您还可以单击所选特定人才库栏中的“管理库”来打开该库的人才库屏幕（参见下一章的“人才库”部分）。\n\
  \n**注意**\n\n您将注意到，在图中，您的搜索选项（例如是按职位还是按人员单独搜索、搜索外部候选人的能力，以及建议的继任者是否会在提名屏幕上显示）都将根据您在本章前面部分介绍的提名设置配置来显示或隐藏。在弹出窗口中单击“高级搜索…”将在弹出窗口中打开人才搜索——人才搜索在本章前面的部分中已介绍。\n\
  \n通过以上步骤，看到继任组织架构图如何将我们本章及许多其他章节中的众多配置整合到一个集中位置，这是非常令人欣慰的！回到我们的示例公司，我们可以看到继任组织架构图为其总裁提供的强大可视化功能和快速查看及编辑数据的能力，帮助其评估组织的继任情况。他们可以通过职位上显示的图标快速看到高级副总裁具有较高的流失风险和影响。他们还能够将高级副总裁提名到他们自己的职位上，并指定就绪等级。他们还可以看到哪些区域销售经理正在被考虑担任高级副总裁职位，以及他们的就绪等级！基于这些快速信息，管理者可以与高级副总裁进行有依据的对话，讨论其发展以及如何在高级副总裁成功继任后最佳地填补其职位。\n\
  \n**结论**\n\n在继任管理之旅的这个阶段，我们已经在第 5 章中了解了如何使用九宫格和人才评估表来识别我们的顶尖人才。现在，我们还了解了如何使用组织架构图风格的可视化方式将这些员工提名到特定职位。在下一章中，我们将通过介绍一系列其他功能来总结，这些功能使我们能够组织和提名我们的员工，并提供其他方式来可视化这些及其他人才数据。\n\
  \n**7. 继任管理其他功能**\n\n\n\n## 继任管理\n\n在本章中，我们将介绍继任管理模块（SCM）的其余功能。这些功能允许您以多种有用的方式查看和组织人才与继任数据。首先介绍的是人才搜索（`Talent\
  \ Search`），它允许您通过搜索任意人才字段来查找员工。然后介绍人才库（`Talent Pools`），它允许您将这些员工组织成逻辑分组。接下来介绍职位磁贴视图（`Position\
  \ Tile View`），它提供了一种继任组织图之外的职位查看方式。随后介绍世系图（`Lineage Chart`），它展示了继任规划者的“假设”继任场景。最后，我们以继任演示（`Succession\
  \ Presentations`）作为结尾，该功能帮助规划者使用实时人才管理数据进行高质量的演示。我们将继续使用第 5 章中描述的样板公司示例，为每个功能提供实际示例。\n\
  \n## 人才搜索\n\n人才搜索（`Talent Search`）允许最终用户在其安全权限范围内，通过任何人才字段搜索员工。此外，用户还可以下载搜索结果、比较员工、进行继任提名和人才库提名等。本节将向您展示如何配置该功能并以最终用户身份运行它。\n\
  \n### 配置人才搜索的先决条件\n\n在能够配置和运行人才搜索之前，必须设置以下设置和权限。此外，请确保您的员工人才档案（`Employee Talent\
  \ Profile`）已在数据模型中配置。更多信息，请参见第 1 卷的第 2 章。\n\n#### 人才搜索所需的配置设置\n\n请按照以下步骤在配置（`Provisioning`）中启用人才搜索。这些步骤必须在安全设置和其他配置设置之前完成：\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig1_HTML.jpg](img/510611_1_En_7_Fig1_HTML.jpg)\n\
  \n**图 7-1** 继任人才搜索配置设置\n\n1. 登录配置（`Provisioning`）并选择您的公司实例。\n2. 导航至公司设置（`Company\
  \ Settings`），并勾选“继任人才搜索”（`Succession Talent Search`）复选框，如图 7-1 所示。点击保存（`Save`）。\n\
  3. 如果您希望使用选项关键字搜索（`keyword search`），该搜索可在所有可用字段中执行快速搜索，而不是仅针对单个字段进行关键字搜索，请执行以下额外步骤：\n\
  \   1. 在数据模型 XML 中为您希望设为可搜索的所有字段添加读取（`Read`）权限。更多信息，请参见第 1 卷第 2 章。\n   2. 在配置（`Provisioning`）中，转到搜索索引（`Search\
  \ Index`）并生成索引（即使是合作伙伴，您也没有权限访问此功能，需要联系 SAP 进行首次索引）。\n\n#### 人才搜索所需的权限设置\n\n请按照以下步骤确保您拥有人才搜索的适当权限：\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig2_HTML.jpg](img/510611_1_En_7_Fig2_HTML.jpg)\n\
  \n**图 7-2** 启用人才搜索配置的权限\n\n1. 在搜索栏中输入并选择“管理权限角色”（`Manage Permission Roles`）。\n2.\
  \ 屏幕加载后，点击您要修改的角色。然后点击“权限...”（`Permission…`）。\n3. 确保您分配的角色上已激活如图 7-2 所示的以下权限，以启用人才搜索配置：管理系统属性（`Manage\
  \ System Properties`）➤ 人才搜索管理（`Talent Search Management`）。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig3_HTML.jpg](img/510611_1_En_7_Fig3_HTML.jpg)\n\
  \n**图 7-3** 最终用户启用人才搜索的权限\n\n1. 确保您分配的角色上已激活如图 7-3 所示的以下权限，以启用最终用户的人才搜索功能：继任规划者（`Succession\
  \ Planners`）➤ 人才搜索访问（`Talent Search Access`）。如果您希望下载搜索结果的导出文件，可以额外添加人才搜索导出（`Talent\
  \ Search Export`）权限。点击“完成”（`Done`）。请确保也在主屏幕上保存您的角色。\n\n> **注意**  \n> 您在第 5 章中添加的继任管理和矩阵报告权限（`Succession\
  \ Management` 和 `Matrix Report Permissions`）也需要启用。与此权限关联的已分配用户组将决定您可以搜索哪些员工。\n\n\
  ### 配置人才搜索\n\n现在所有先决条件的配置和权限都已分配完毕，我们可以访问人才搜索设置（`Talent Search Settings`）配置屏幕。请按照以下步骤完成配置：\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig4_HTML.jpg](img/510611_1_En_7_Fig4_HTML.jpg)\n\
  \n**图 7-4** 人才搜索设置屏幕\n\n1. 在搜索栏中输入并选择“人才搜索设置”（`Talent Search Settings`）以访问配置屏幕。屏幕将如图\
  \ 7-4 所示加载。\n2. 如果您希望启用本节前面提到的简单关键字搜索，请勾选“在人才搜索中启用关键字搜索”（`Enable keyword search\
  \ in Talent Search`）。\n   > **注意**  \n   > 我们建议启用此选项，因为它可以节省最终用户构建查询的时间。此外，用户可能不知道数据模型结构中特定字段的位置。这样，用户无需深入了解这些结构也能进行搜索。\n\
  3. 如果您希望在搜索中包含能力项，请勾选“显示能力与行为”（`Show Competencies & Behaviors`）。\n   > **注意**  \n\
  \   > 如果您的组织使用能力项，我们建议启用此选项，因为这是将能力项纳入搜索的唯一方法。\n4. 对于“选择流程”（`Choose process`）字段，选择“所有数据源”（`All\
  \ data sources`）或您配置的某个流程。\n   > **注意**  \n   > 我们建议您镜像上一章矩阵网格配置中为数据源选择的相同配置，以保持最终用户使用的一致性。\n\
  5. 为“搜索人才基于”（`Search talents based on their`）字段选择一个值。“所有评级”（`All ratings`）将包含所有评级，而“最新评级”（`Latest\
  \ rating`）仅包含最新评级。\n   > **注意**  \n   > 我们建议将此设置为“最新评级”（`Latest rating`），以便显示最相关的评级，除非资源有特定需求需要搜索历史分数。\n\
  6. 为“搜索职位信息基于”（`Search Job Info based on`）字段选择一个值。选择“截至日期”（`As Of Date`）将提供一个日期字段，员工在搜索时必须在该日期担任该职位；而选择“日期范围”（`Date\
  \ Range`）将提供两个日期字段，员工可以在这些日期之间的任意时间担任该职位。\n   > **注意**  \n   > 我们建议使用“日期范围”（`Date\
  \ Range`）选项，因为它提供了更大的灵活性。\n7. 为每种高级信息搜索的默认评级量表选择一个值。这允许您从矩阵网格配置或绩效评级量表中的任何设置中进行选择。\n\
  \   > **注意**  \n   > 我们建议这些设置与您在矩阵网格配置中的设置一致，除非您未进行此类配置。\n8. 选择页面首次加载或用户点击“重新开始”（`Start\
  \ Over`）时希望显示的默认搜索字段。\n   > **注意**  \n   > 我们建议在此处不设置任何默认字段。\n9. 点击“保存”（`Save`）。\n\
  \n### 运行人才搜索\n\n现在所有配置和权限均已设置完毕，我们可以运行人才搜索了！请按照以下说明进行人才搜索：\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig5_HTML.jpg](img/510611_1_En_7_Fig5_HTML.jpg)\n\
  \n**图 7-5** 人才搜索选择条件屏幕\n\n\n\n1.  在搜索栏中输入并选择 `Talent Search`（人才搜索），即可加载如图 7-5 所示的人才搜索界面。\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig6_HTML.jpg](img/510611_1_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** 人才搜索结果界面\n\n1.  如果已配置关键词搜索，您首先看到的将是一个按关键词搜索的字段。此字段用于在所有可用字段中执行快速搜索，而非仅针对单个字段的关键词搜索。它便于快速搜索，但不如单独选择字段精确。在此输入关键词，或点击\
  \ `More options…`（更多选项...）展开界面以分别搜索各个字段。如果您使用引号将词组括起来，系统将按“与”逻辑处理这些词；而不使用引号则采用“或”逻辑。\n\
  \n2.  如果您按字段分别搜索，请点击要搜索的信息类型旁的 `+` 图标：\n    - **基本信息**：此区域列出了数据模型 XML 中的所有基本字段。在每个选定字段旁输入搜索文本。\n\
  \    - **高级信息**：此区域列出了来自您已配置数据模型的后台元素（无论 XML 中设置的权限如何），以及您的人才库（有关人才库的更多信息，请参阅下一节）。您需要根据配置选项选择\
  \ `As Of Date`（截至日期）或 `Date Range`（日期范围）。后台元素允许您搜索后台元素中的每个单独字段。人才库则允许您从人才库列表以及您在\
  \ MDF 对象中可能配置的其他字段中进行选择（有关如何配置 MDF 对象，请参阅下一节）。\n    - **评级与能力**：此区域允许您选择绩效、潜力、目标及能力等级。选择类型，然后从评分量表中选取高值和低值。如果您想选择单项能力，请点击\
  \ `Competencies…`（能力...）；在弹出的窗口中，从您选择的库中选择一项能力，然后点击 `Select`（选择）。\n\n3.  在运行搜索之前，请点击\
  \ `Settings`（设置）图标，从以下选项中选择：\n    - **运行时使用的角色**：您可以选择用于查询的权限角色。例如，如果您既是一名经理又是 HR\
  \ 管理员，您可能同时拥有两个角色。HR 管理员角色将返回您作为 HR 负责人的所有员工结果，而经理角色则将返回您作为其经理的所有员工结果。\n    - 勾选\
  \ `Make All Criteria Optional`（使所有条件为可选）复选框将使搜索具有包容性，而不勾选则使搜索具有排他性。\n\n4.  您也可以通过点击\
  \ `Save`（保存）图标来调用已保存的搜索。\n\n5.  如果您想将搜索界面重置为默认搜索条件，请点击 `Start Over`（重新开始）。\n\n6.\
  \  当您准备执行搜索查询时，点击 `Search`（搜索）。将显示一个类似于图 7-6 的结果界面。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig7_HTML.jpg](img/510611_1_En_7_Fig7_HTML.jpg)\n\
  \n**图 7-7** 用户比较弹出窗口\n\n1.  结果界面显示了一份员工列表，以及根据您在前一界面中定义的条件计算出的匹配百分比。左侧是用于细化当前搜索结果的筛选条件：\n\
  \    - 点击员工的姓名可打开该员工的快速信息卡。\n    - 点击百分比可查看员工与搜索条件匹配的详细信息。\n    - 点击 `Add Criteria`（添加条件）可添加额外的筛选条件。\n\
  \    - 勾选左侧条件旁的复选框，可立即细化搜索。\n    - 点击 `Export All`（全部导出）可打开“导出”弹出窗口。您可以为导出文件命名，并选择要包含的字段。点击\
  \ `Export`（导出）即可生成 `.xls` 格式的导出文件。\n    - 点击 `Save Search`（保存搜索）可将这些搜索条件列在您的已保存搜索中（位于选择条件界面上）。\n\
  \    - 点击 `Modify Search`（修改搜索）可返回选择条件界面。\n    - 勾选您要选择的每位员工旁的复选框。选择界面的顶部将出现一个菜单，包含以下选项：\n\
  \        - **添加到人才库**：选择此选项将打开一个弹出窗口，允许您从现有的人才库中进行选择。您可以根据您的人才库 MDF 配置添加就绪水平、备注等。点击\
  \ `Nominate`（提名）将员工添加到人才库。\n        - **导出**：将打开与“全部导出”相同的“导出”弹出窗口，但仅导出所选员工。点击弹出窗口中的\
  \ `Export`（导出）即可下载 `.xls` 文件。\n        - **比较**：这将打开一个弹出窗口，如图 7-7 所示，显示所选员工在您选择条件的每个字段上的并排比较。您可以点击\
  \ `Configure Fields`（配置字段）调出另一个弹出窗口，允许您即时添加任何您可能想要考虑的额外字段（非常酷！）。您还可以点击 `Print`（打印）打开一个可发送到打印机的打印预览页面。\n\
  \n2.  `Nominate`（提名）：在“`Nominate employees for`（提名员工至...）”字段中输入职位名称或编号，以提名所选员工担任该职位。根据您的继任提名配置（请参阅下一节）选择就绪水平和排名，以及在“`Notes`（备注）”字段中为每位员工添加备注。点击\
  \ `Nominate`（提名）完成操作。\n\n至此，我们已经逐步介绍了运行人才搜索的所有步骤。现在，让我们回顾一下我们模型公司的例子。就我们的示例而言，此功能允许\
  \ HR 管理员或总裁定期搜索那些流失风险高、流失影响大，且位于九宫格（参见前图的示例）中最高绩效和潜力格中的员工。通过这种方式，HR 管理员或副总裁可以识别出我们示例中的销售高级副总裁可能即将离开公司！然后，他们可以主动与销售高级副总裁合作，为其制定针对总裁职位的培养计划，同时为销售高级副总裁寻找继任者，而不是让销售高级副总裁的离开成为意外。接下来，我们将探讨如何将我们的搜索结果组织到人才库中。\n\
  \n## 人才库\n\n`人才库`允许用户为人才管理目的创建有组织的员工分组。它们通过允许更通用的分组，为针对特定职位的继任规划提供了备选方案。它们还可用于非继任相关需求，如发展规划、轮岗计划或高潜人才库。人才池也可以与职位关联，例如，如果组织内有多名员工可能符合我们模型公司销售高级副总裁职位的资格，这些员工和职位的分组就可以通过人才池连接在一起！MDF\
  \ 人才池利用元数据框架（MDF）使这些分组更有组织性。MDF 允许系统配置员详细说明人才池对象的数据结构，并允许详细的权限角色分配。在本节中，我们将介绍如何配置和使用人才库。\n\
  \n> **注意**：将不介绍传统人才库，因为它们不再是配置系统的合理选择，并且已进入 SAP 的维护终止阶段。\n\n### 配置和使用人才库的先决条件\n\n\
  在能够配置和使用人才库之前，请确保本节中的要求和步骤已完成。\n\n> **注意**\n\n\n在执行这些配置步骤之前，我们假设已在配置中启用了 `MDF`。\n\
  \n### 升级中心\n\n如果您的系统中尚未激活“人才库”，请按照以下步骤进行激活：\n\n1.  在搜索栏中输入并选择“升级中心”。\n2.  从列表中选择“基于新\
  \ MDF 人才库的继任计划”，然后按照屏幕提示进行操作。\n\n### 配置器权限\n\n在配置人才库之前，请确保您分配的角色权限下拥有“管理员权限” ➤ “元数据框架”权限，如图\
  \ 7-8 所示（`Configure Object Definitions`， `Manage Data`， `Configure Business Rules`，\
  \ `Access to non-secured objects`， `Import Permission on Metadata Framework`， `Admin\
  \ access to MDF OData API`， `Manage Configuration UI`， `Manage Positions`， `Manage\
  \ Sequence`）。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig8_HTML.jpg](img/510611_1_En_7_Fig8_HTML.jpg)\n\
  \n*图 7-8 管理员权限 ➤ 元数据框架权限*\n\n**注意**\n\n与其他部分不同，我们将配置器权限与用户权限分开说明。这是因为 MDF 结构应在用户权限之前定义，因为用户权限依赖于\
  \ MDF 配置。\n\n此外，请确保已在“管理继任计划”下选中“人才库字段配置”，如图 7-9 所示。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig9_HTML.jpg](img/510611_1_En_7_Fig9_HTML.jpg)\n\
  \n*图 7-9 人才库字段配置权限*\n\n## 通过 MDF 配置人才库\n\n现在您已拥有相应权限，可以开始定义人才库的数据结构了。\n\n**注意**\n\
  \n本节将介绍我们为配置人才库对象定义所推荐的一些步骤。这不应被视为所有 MDF 对象定义选项的全面指南。MDF 是一个非常庞大且功能强大的工具，其内容足以写成一整本书！在下面的示例中，我们仅为对象添加安全性，并从我们的模型公司中添加一个字段，以便对人才库进行筛选过滤。\n\
  \n定义人才库的数据结构需通过 MDF 的 `Configure Object Definitions` 完成。请按照以下步骤完成配置：\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig10_HTML.jpg](img/510611_1_En_7_Fig10_HTML.jpg)\n\
  \n*图 7-10 人才库对象定义界面*\n\n1.  在搜索栏中输入并选择 `Configure Object Definitions`。\n2.  在 `Search`\
  \ 字段中，选择 `Object Definition`。在下一个下拉菜单中，选择 `Talent Pool`。此时将显示人才库对象定义，如图 7-10 所示。\n\
  3.  选择 `Take Action` 下拉菜单，然后选择 `Make Correction`。字段将变为可编辑状态。\n4.  滚动到 `Fields` 部分的末尾，通过以下方式添加一个字段：在\
  \ `Name` 字段中输入 `cust_ExecutiveLevel`，在 `Maximum Length` 字段中输入 `2`，在 `Data Type`\
  \ 字段中选择 `Number`。点击字段旁的 `Details`。将弹出一个窗口。\n    - 在弹出窗口中，向下滚动到 `Label` 字段，输入 `Executive\
  \ Level`。点击 `Done`。\n5.  返回主界面，向下滚动到 `Searchable Fields` 部分，在 `Name` 字段中输入 `cust_ExecutiveLevel`。然后向下滚动到\
  \ `Security` 部分，在 `Secured` 字段中选择 `Yes`，在 `Permission Category` 字段中选择 `Miscellaneous\
  \ Permissions`。滚动到底部并点击 `Save`。\n\n## 用户权限\n\n既然我们已经将 MDF 中的人才库对象配置为安全对象，就可以修改任何我们希望授予其人才库访问权限的用户权限角色。请按照以下步骤为角色添加人才库权限：\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig11_HTML.jpg](img/510611_1_En_7_Fig11_HTML.jpg)\n\
  \n*图 7-11 人才库用户权限角色的权限设置*\n\n1.  使用搜索栏导航到 `Manage Permission Roles`。\n2.  点击您想要编辑的角色。然后点击\
  \ `Permissions…`。\n3.  在 `Permission settings` 界面上，点击 `Miscellaneous Permissions`\
  \ 并滚动到 `Talent Pool`。勾选 `View Current`、`View History`、`Create`、`Insert`、`Correct`、`Delete`\
  \ 和 `Import/Export` 旁边的复选框，如图 7-11 所示。点击 `Done`。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig12_HTML.jpg](img/510611_1_En_7_Fig12_HTML.jpg)\n\
  \n*图 7-12 将人才库的目标人群定义为执行级别 2 或以下*\n\n4.  您可以进一步细化最终用户可以访问哪些人才库。在本例中，我们将使用新创建的字段\
  \ `cust_ExecutiveLevel`，允许不同用户访问不同的人才库。如图 7-12 所示，我们将授予此特定角色访问执行级别 2 的权限，供 HR 管理员使用，并假设将为执行级别\
  \ 1 创建另一个角色，仅供高管团队使用。在“权限角色详情”界面上，点击 `Edit Granting`，向下滚动到 `Talent Pool`，然后选中 `Restrict\
  \ target population to:` 的单选按钮。勾选第一个复选框，并输入 `Executive Level`、`>=` 和 `2`。点击 `Done`。\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig13_HTML.jpg](img/510611_1_En_7_Fig13_HTML.jpg)\n\
  \n*图 7-13 查看和编辑人才库提名的权限*\n\n5.  请务必记住，上述权限仅授予用户查看和编辑人才库对象的权限，并不能查看人才库中的实际提名！要添加查看提名的权限，请在\
  \ `Permission settings` 界面上点击 `Succession Planners`，勾选 `View Talent Pool nominations`\
  \ 和 `Add/edit/delete Talent Pool nominations` 旁边的复选框，如图 7-13 所示，然后点击 `Done`。请确保同时保存主界面上的角色。\n\
  \n**注意** 默认情况下，这将使所有员工都能访问提名。要使此权限特定于某个目标人群，请在 `Nomination Setup` 界面上点击 `Apply target\
  \ population to Talent Pool Nominations Permissions`，然后像处理任何其他权限角色一样定义目标人群。我们将在下一节更详细地介绍此界面。\n\
  \n6.  对于某些组织而言，即使经理没有通过步骤 1 和 2 设置的权限，允许他们查看“人才档案”和“人才卡片”中的提名也是合理的。如果您想启用此功能，请登录到\
  \ Provisioning，选择您的组织，然后点击 `Company Settings`。勾选 `Viewing Talent Pool Nominations\
  \ in People Profile and Talent Card Without Having the Talent Pool Object Level\
  \ Permission` 旁边的复选框。\n\n## 配置人才库提名字段\n\n`Manage Talent Pool Field Settings` 配置界面用于控制哪些员工字段可以作为列显示或作为人才库提名中的筛选条件。请按照以下步骤配置人才库字段：\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig14_HTML.jpg](img/510611_1_En_7_Fig14_HTML.jpg)\n\
  \n*图 7-14 管理人才库字段设置界面*\n\n1.  在搜索栏中输入并选择 `Manage Talent Pool Field Settings`。配置界面将如图\
  \ 7-14 所示。\n2.  界面将显示数据模型中的所有标准人才库字段。勾选您希望添加为潜在列或筛选条件的每个字段旁边的复选框，然后点击 `Save`。\n\n\
  **注意** `Job Title` 和 `Readiness` 默认始终被选中。\n\n## 使用人才库\n\n\n\n既然我们已经完成了人才库的配置，接下来就可以创建一些人才库并提名员工了！请按照以下步骤查看人才库、创建人才库、提名员工，并整理人才库内员工的视图：\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig15_HTML.jpg](img/510611_1_En_7_Fig15_HTML.jpg)\n\
  \n**图 7-15** 创建人才库界面\n\n1.  在搜索栏中输入并选择“查看人才库”。\n2.  点击“+”创建一个新的人才库。将弹出如图 7-15 所示的弹窗。在“代码”字段中输入“GenManagers”，在“状态”字段中选择“启用”，在“开始日期”字段中选择今天的日期，在“名称”字段中输入“销售高级副总裁”，在“启用就绪度”字段中选择“是”，在“高管层级”字段中选择“3”。完成后，点击“保存”。\n\
  \n> **注意**  \n> 此处显示的字段完全取决于您的 MDF 配置。如果某些额外字段对您的实施无意义，您可以将其隐藏，或添加其他字段。就我们的示例而言，我们只想展示自定义字段“高管层级”已出现，这有助于我们实现额外的安全级别。另请注意，任何带有地球图标的字段都可以根据您实例中激活的语言，翻译成多种语言。\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig16_HTML.jpg](img/510611_1_En_7_Fig16_HTML.jpg)\n\
  \n**图 7-16** 人才库 MDF 对象信息界面\n\n3.  然后您将进入一个确认界面，该界面会显示您刚为新人才库 MDF 对象输入的信息，如图 7-16\
  \ 所示。您可以通过点击“编辑”或“管理”来更改信息。点击“x”关闭并返回到主人才库界面，如下图所示。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig17_HTML.jpg](img/510611_1_En_7_Fig17_HTML.jpg)\n\
  \n**图 7-17** 按名称“销售高级副总裁”过滤的人才库\n\n4.  对于您想要创建的所有人才库，重复步骤 2 和 3。\n5.  创建人才库后，它们将显示在主界面上，如图\
  \ 7-17 所示。您可以通过点击右上角的漏斗图标，按代码或名称对它们进行过滤和排序。在“代码”或“名称”字段中输入您的条件，然后点击“过滤”。点击“重置”可清除过滤条件。您也可以点击漏斗图标旁的“排序方式…”来更改排序字段和顺序（升序或降序）。\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig18_HTML.jpg](img/510611_1_En_7_Fig18_HTML.jpg)\n\
  \n**图 7-18** 人才库提名界面\n\n6.  点击任意人才库名称旁的三个点，以编辑该人才库 MDF 对象信息或删除它。\n7.  点击人才库的名称，以查看和编辑该人才库内的提名。界面将刷新，显示当前的提名，如图\
  \ 7-18 所示。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig19_HTML.jpg](img/510611_1_En_7_Fig19_HTML.jpg)\n\
  \n**图 7-19** 定义在人才库提名界面上显示的列\n\n8.  要将员工添加到人才库，请点击名片图标。在弹出的搜索栏中输入并选择员工姓名。点击“下一步”按钮。输入就绪度级别和任何备注，然后点击“提交”。您将返回到上图所示的界面，其中会显示新添加的员工。\n\
  9.  对于您想进行的任何其他提名，重复步骤 8。\n\n> **注意** 只要您拥有适当的权限，您也可以从任何人才卡片（如继任组织架构图、校准或演示文稿）以及人才搜索中进行提名。有关更多详细信息，请参阅本章中的相应章节。这些其他区域通常用于提名员工，因为它们提供了关于员工的更多上下文信息，而不仅仅是输入他们的姓名。\n\
  \n10. 点击菜单图标以编辑人才库 MDF 对象属性。\n11. 点击眼睛图标。将弹出一个如图 7-19 所示的界面，用于控制被提名者列表中每个员工显示哪些列。您会注意到这些是您在配置期间选择的人才字段。点击您希望显示为列的每个字段旁的复选框，然后点击“确定”。您将返回到主人才库提名界面。\n\
  12. 您可以点击任何列的标题，以升序或降序对该列进行排序。\n13. 点击“调整过滤器”。将弹出一个界面显示当前过滤器。如果要添加配置中尚未用作过滤器的字段，请点击“更多过滤器”。在新弹出的界面中，勾选您要添加的字段旁的复选框，然后点击“确定”。您可以通过取消勾选字段旁的复选框来移除字段。每个字段都会显示一个下拉菜单，其中包含人才库中被提名者的所有有效值。选择您希望用来过滤被提名者列表的值，然后点击“执行”以应用过滤器。您将返回到应用了过滤器的主被提名者列表。过滤器将显示在屏幕顶部的过滤器栏中。点击向上或向下箭头可切换过滤器栏的打开或关闭状态。\n\
  14. 点击任意被提名者旁的铅笔图标，可以在新的弹出界面中编辑该被提名者的就绪度或备注。完成后点击“提交”。\n15. 点击任意被提名者旁的垃圾桶图标，可将该被提名者从人才库中移除。在弹出界面中点击“确认”以继续执行移除操作。\n\
  \n以我们示例中的模型公司为例，我们可以很容易地看到，如何利用人才库，基于最新的人才数据，以电子方式捕获整个组织内潜在销售高级副总裁的活跃名单，而不是基于过时信息维护手动离线列表。人才库界面允许用户组织其列表，而\
  \ MDF 允许捕获关于人才库的任何所需数据。我们甚至可以利用这些 MDF 字段来增强安全性。在我们的示例中，我们可以确信美国总统可以访问其级别及以下级别的人才库，但不能访问更高级别（例如全球高级领导团队级别）。我们还了解到，用户可以从系统中的多个区域进行提名，以便每当在系统中产生相关想法或讨论时，甚至可以通过主动使用人才搜索，将被提名者组织到人才库中。通过这种方式，当继任事件发生时，我们的用户就能做好充分准备，确定一份高度合格的继任者名单，并为他们未来的潜在职位做好准备！\n\
  \n> **注意**  \n> 我们甚至可以在使用职位档案生成器创建人才库时，直接将其映射到职位档案。在职位档案生成器的“角色”选项卡中，选择一个角色，然后转到“映射的人才库”选项卡。以我们的示例为例，我们可以确保销售高级副总裁人才库始终与职位档案相关联，这样，无论在继任组织架构图还是职位图块视图上查看时，该人才库都会显示出来。有关职位档案生成器的更多信息，请参阅第\
  \ 1 卷第 2 章。\n\n\n\n## 职位磁贴视图\n\n职位磁贴视图允许用户从与传统组织架构图不同的角度查看职位。用户无需在层级结构中查看职位及其任职者，而是可以通过多种筛选条件，在其拥有安全访问权限的组织内所有职位中进行搜索。搜索结果以按字母顺序排列的磁贴列表形式呈现。我们可以通过\
  \ MDF 职位对象定义来设定用户可以使用哪些筛选条件。如果您已向 MDF 职位对象定义中添加了有助于区分组织中不同职位的关键字段，这将是一个非常实用的工具。让我们一起来了解一下吧！\n\
  \n## 配置和使用职位磁贴视图的先决条件\n\n在开始配置之前，我们需要执行几个步骤来确保系统已准备就绪。下面我们来逐一了解。\n\n> **注意**  \n\
  > 与前一章中的“继任组织架构图”部分一样，我们假设您已按照我们对继任组织架构图的建议使用了 MDF 职位。如果没有 MDF 职位，则无法使用职位磁贴视图。\n\
  \n### 配置启用\n\n在职位磁贴视图权限显示在系统之前，我们需要在配置启用中将其打开。登录配置启用并选择您要更改的公司，点击“公司设置”，然后勾选“职位磁贴视图”旁边的复选框，如图\
  \ 7-20 所示。点击“保存”。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig20_HTML.jpg](img/510611_1_En_7_Fig20_HTML.jpg)\n\
  \n**图 7-20** 职位磁贴视图的配置启用设置\n\n### 配置器权限\n\n与人才库类似，我们需要在使用职位磁贴视图之前定义 MDF 职位对象。更多详细信息，请参见本章“人才库”部分中的“配置器权限”。\n\
  \n## 配置职位磁贴视图\n\n一旦拥有适当的权限，我们就可以配置 MDF 职位对象了。在下面的步骤中，我们将添加一个字段并使其可搜索，这样我们就有了一个额外有意义的字段，可以依据该字段筛选职位并设置额外的安全权限。请按照以下步骤完成配置：\n\
  \n> **注意**  \n> 如果您的实施是 Employee Central (EC) 实施的一部分，您可能已经配置了职位对象，或者需要与 EC 团队密切合作，以确保构建一个协调一致的解决方案，因为这是继任管理和\
  \ Employee Central 之间的一个重要接触点！\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig21_HTML.jpg](img/510611_1_En_7_Fig21_HTML.jpg)\n\
  \n**图 7-21** 职位对象定义\n\n1. 在搜索栏中输入并选择“配置对象定义”。\n2. 在“搜索”字段中，选择“对象定义”。在下一个下拉菜单中，选择“职位”。职位对象定义将出现，如图\
  \ 7-21 所示。\n3. 点击“执行操作” ➤ “进行修正”。\n4. 滚动到“字段”部分的末尾，通过在“名称”字段中输入 `cust_ExecutiveLevel`，在“最大长度”字段中输入\
  \ `2`，并在数据类型字段中选择 `数字` 来添加一个字段。点击字段旁边的“详细信息”。将出现一个弹出窗口。\n5. 在弹出窗口中，向下滚动到“标签”字段，输入“高管级别”。点击完成。\n\
  6. 回到主屏幕，向下滚动到“可搜索字段”部分，在“名称”字段中输入 `cust_ExecutiveLevel`。然后向下滚动到“安全性”部分，为“受保护”字段选择“是”，并为“权限类别”字段选择“杂项权限”。滚动到底部并点击“保存”。\n\
  \n> **注意**  \n> 虽然我们在此不涵盖所有可用字段，仅尝试展示如何添加和编辑字段，但您至少需要将 `code`、`effectiveStatus`、`effectiveStartDate`、`effectiveEndDate`\
  \ 和 `positionCriticality` 字段设置为必填。`Incumbent` 字段也应包含在内，但可以设置为可选，因为职位可能没有任职者。如果您希望关联职位分类，则还应包含职位代码。您还应使用此屏幕确保为您的\
  \ `positionCriticality` 字段创建了一个适当的选择列表。选择列表的名称必须严格为“PositionCriticality”。\n\n##\
  \ 配置最终用户权限\n\n现在 MDF 已配置完成，并且职位对象已设置为受保护，我们可以修改任何我们希望授予其职位访问权限的用户权限角色。请按照以下步骤向角色添加职位磁贴权限：\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig22_HTML.jpg](img/510611_1_En_7_Fig22_HTML.jpg)\n\
  \n**图 7-22** 职位磁贴访问权限\n\n1. 首先，我们将授予对职位磁贴视图屏幕的权限。在您角色的“权限设置”屏幕上，点击“继任规划者”，然后勾选“职位磁贴访问”旁边的复选框，如图\
  \ 7-22 所示。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig23_HTML.jpg](img/510611_1_En_7_Fig23_HTML.jpg)\n\
  \n**图 7-23** 授予职位权限\n\n2. 接下来，我们将授予对职位对象的权限，以便某些职位会显示在屏幕上。在“权限设置”屏幕上，点击“杂项权限”并滚动到“职位”。勾选“查看当前”、“查看历史”、“创建”、“插入”、“更正”、“删除”和“导入/导出”旁边的复选框，如图\
  \ 7-23 所示。点击“完成”。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig24_HTML.jpg](img/510611_1_En_7_Fig24_HTML.jpg)\n\
  \n**图 7-24** 将职位访问权限限定为高管级别 2 及以下\n\n3. 您可以进一步细化最终用户可以访问的职位。出于示例目的，我们将使用新创建的字段 `cust_ExecutiveLevel`，以允许不同用户访问不同的职位。我们将授予此特定角色对高管级别\
  \ 2 的访问权限，供 HR 管理员使用，如下图所示，并假设将创建另一个角色用于级别 1，仅供高级领导团队使用。在权限角色详情屏幕上，点击“编辑授权”并向下滚动到“职位”，然后选中“将目标人群限制为：”的单选按钮。勾选第一个复选框并输入“高管级别”、`>=`\
  \ 和 `2`。点击“完成”。示例如图 7-24 所示。\n\n4. 请务必记住，上述权限仅授予用户查看和编辑职位对象的权限，而非查看职位内实际提名的权限！要添加查看和进行提名的权限，请同样从步骤\
  \ 1 中选择“继任规划权限”。\n\n5. 完成所有权限角色更改后，点击“保存”。\n\n## 使用职位磁贴视图\n\n既然职位磁贴视图已激活并配置完成，并且我们拥有安全访问权限，现在可以进入该屏幕并开始使用它了。请按照以下步骤使用该屏幕：\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig25_HTML.jpg](img/510611_1_En_7_Fig25_HTML.jpg)\n\
  \n**图 7-25** 职位磁贴视图\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，为您翻译以下英文文本。\n\n\n\
  1.  在搜索栏中，输入并选择“职位磁贴”。默认情况下，屏幕会加载您拥有安全访问权限的所有职位结果，并按职位名称的字母顺序排列。这些职位以磁贴形式显示，顶部是职位名称，其下方是现任者（如果有）。任何已命名的职位继任者也会一并显示。\n\
  \n2.  点击 `+` 图标以添加一个职位。请注意，此处的字段会因您对 MDF 职位对象的配置而异。将开始日期设置为今天的日期，并将职位名称设置为“区域经理\
  \ – 美国各属地”，将“状态”设置为“在职”，并将“高管级别”设置为“3”。点击“保存”。然后在确认屏幕上点击 `x`。\n\n3.  点击漏斗图标或“添加筛选条件”以在屏幕右侧打开筛选条件面板。滚动到底部，点击“添加”以添加筛选条件。您会注意到“高管级别”已经存在，因为我们已将其作为可搜索字段添加到职位对象中！选择“高管级别”并输入“3”。点击“搜索”，系统将调出我们的职位！点击“清除筛选条件”以再次显示您所有可用的职位。见图\
  \ 7-25。\n\n1.  点击任何职位的磁贴以调出职位卡片。其操作方式与继任组织架构图相同，您可以查看现任者的人才卡片、将该职位设置为关键职位或提名继任者。您也可以点击菜单图标来编辑职位、删除职位、显示提名历史或查看谱系图。点击\
  \ `x` 关闭职位卡片。\n\n**注意** 如果您已实施招聘，也可以从此处创建职位申请！\n\n2.  如果您已为此屏幕创建了 BIRT 报告，还可以点击下载图标下载屏幕上职位的输出内容。\n\
  \n**注意** 要下载此屏幕的可打印版本，需要构建 BIRT 报告并将其上传到 Provisioning。该报告可以在 Provisioning 的“导入/更新/导出\
  \ – BI Publisher 模板/BIRT 模板”部分上传。本书不涉及编写 BIRT 报告。\n\n## 谱系图\n\n在通过继任组织架构图或职位磁贴视图对组织架构图上下的不同职位进行多次提名后，谱系图功能将变得非常有用！该功能允许用户直观地了解特定的继任场景可能是什么样子，不仅是直接替换的人选，还包括该替换者之下的候选人。\n\
  \n### 访问谱系图的先决条件\n\n谱系图本身没有特定的配置屏幕或权限。该图表仅基于与继任组织架构图相同的配置和权限。由于我们已在之前的章节中详细介绍了这些内容，这里不再赘述。要启用谱系图，必须在\
  \ Provisioning 中激活。登录 Provisioning 并访问您的公司。点击“公司设置”，然后勾选“继任谱系报告”旁边的复选框，如图 7-26 所示。点击“保存”。\n\
  \n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig26_HTML.jpg](img/510611_1_En_7_Fig26_HTML.jpg)\n\
  \n图 7-26 在 Provisioning 中开启继任谱系报告\n\n### 使用谱系图\n\n要使用谱系图，请遵循以下步骤：\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig27_HTML.jpg](img/510611_1_En_7_Fig27_HTML.jpg)\n\
  \n图 7-27 示例谱系图\n\n1.  在搜索栏中输入并选择“查看继任谱系图”。\n2.  在出现的屏幕上，在新搜索栏中输入您要为其开始谱系的员工姓名。\n\
  3.  当该员工出现时，您可以点击名片图标以打开该员工的人才卡片。\n4.  点击员工姓名以查看为该员工显示的所有人才字段图标的文本描述（这些信息取自继任组织架构图配置\
  \ XML；有关更多详细信息，请参见第 [21](https://doi.org/10.1007/978-1-4842-6995-4_21) 章的“继任组织架构图”部分）。\n\
  5.  点击显示提名数量的底部栏以展开并显示这些被提名人的磁贴。\n6.  对您想要查看的谱系的所有层级重复步骤 5。\n7.  点击并拖动鼠标以移动您的谱系视图。您也可以使用\
  \ `+` 和 `-` 进行放大和缩小。最终输出的示例如图 7-27 所示。\n8.  点击向下箭头图标以将图表下载为 PDF 或 JPEG 格式。\n\n就我们的示例模型公司而言，您可以看到总裁会发现此工具非常有用。他们不仅可以看到谁可能接替高级副总裁，还可以轻松地直观了解谁已准备好接替这些接替者！上图中的示例很好地展示了我们模型继任场景的可视化效果！总裁可以确信，如果高级副总裁接任其职位，那么现在已经有一名区域销售经理准备好接替高级副总裁的位置，并且相应地有一名客户经理准备好接替该区域经理的位置。\n\
  \n## 继任演示\n\n现在，我们已经了解了继任管理的整套配置和功能，只剩下最后一个功能要介绍：演示。演示通常用于在继任会议期间以引导方式向高级管理人员展示继任数据。此功能对于刚刚开始在线继任规划、并且传统上通过手动构建\
  \ PowerPoint 演示文稿向高级领导团队进行继任规划的组织来说很受欢迎。该功能在利用传统 PowerPoint 格式和利用系统中可用的最新信息之间架起了一座很好的桥梁。激活演示所需的配置最少。演示中的功能一旦激活，将采用本章前几节中的配置。\n\
  \n### 开启演示功能\n\n在我们为演示功能分配权限之前，需要先激活它。要激活此功能，请遵循以下步骤：\n\n1.  在搜索栏中输入并选择“升级中心”。\n\
  2.  在可选升级中找到“演示”。点击“了解更多并立即升级”。\n3.  点击“立即升级”。\n4.  点击“是”和“确定”。\n\n### 授予演示访问权限\n\
  \n与几乎所有功能一样，我们需要为最终用户添加访问该屏幕的权限。请遵循以下步骤向您的权限角色添加权限：\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig28_HTML.jpg](img/510611_1_En_7_Fig28_HTML.jpg)\n\
  \n图 7-28 管理演示权限\n\n1.  在搜索栏中输入并选择“管理权限角色”。\n2.  屏幕加载后，点击您要修改的角色。然后点击“权限…”。\n3. \
  \ 点击“管理演示”，然后选择“管理演示”旁边的复选框，如图 7-28 所示。点击“完成”。请确保也在主屏幕上保存您的角色。\n\n**注意** 上述权限仅授予对演示屏幕本身的访问权限。请务必记住，用户在演示中可以看到的数据基于我们本章已介绍过的针对职位、员工和提名的目标权限。\n\
  \n### 使用演示\n\n现在我们已经设置了权限，让我们开始使用演示功能。请遵循以下步骤：\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig29_HTML.jpg](img/510611_1_En_7_Fig29_HTML.jpg)\n\
  \n图 7-29 演示主屏幕\n\n\n\n1.  在首次访问 Presentations 之前，你需要同意最终用户许可协议（EULA）。在搜索栏中输入并选择“Accept\
  \ EULA”。\n2.  单击“Accept EULA”并阅读 EULA。\n3.  单击“Accept”。\n4.  在搜索栏中输入并选择“Presentations”。屏幕将如图\
  \ 7-29 所示。\n\n![../images/510611_1_En_7_Chapter/510611_1_En_7_Fig31_HTML.jpg](img/510611_1_En_7_Fig31_HTML.jpg)\n\
