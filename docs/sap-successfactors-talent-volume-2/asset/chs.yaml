- '# 引言


  欢迎阅读《SAP SuccessFactors 人才管理》第 2 卷！在第 2 卷中，我们延续了在第 1 卷中开始构建全面 SAP SuccessFactors
  人才解决方案的逻辑进程，深入探讨了发展与继任的细节。


  在第 1 章，我们首先学习如何配置发展计划，了解其与我们第 1 卷中创建的目标计划的相似之处，以及它们如何与系统其他部分集成。在第 2 章，我们继续探讨职业工作表，讨论什么是职业工作表、如何配置它，以及它如何与其他模块集成。本章还涵盖了职业探索器。在第
  3 章，我们将以最终用户的身份逐步体验职业工作表。第 4 章将深入探讨导师制的配置和使用。接下来的三章涵盖继任管理。在第 5 章中，我们介绍继任管理，并指导您完成九宫格和人才评估表的配置与使用。第
  6 章随后深入核心继任管理，涉及人才卡片、设置提名以及配置和使用继任组织架构图。第 7 章对继任管理进行总结，涵盖人才搜索、人才池、职位磁贴视图和血统图等附加功能。然后，我们以结论部分结束第
  2 卷，回顾我们涵盖的内容，并展望如何实现业务价值以及长期维护系统。


  '
