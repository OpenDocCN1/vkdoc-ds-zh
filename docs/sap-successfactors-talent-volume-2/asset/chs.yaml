  \ | X | X | X |\n| 创建与此辅导计划关联的社区群组 | 将社区群组与计划关联。辅导管理员和所有者被邀请加入该群组并担任管理员。导师和学员匹配后，他们也会被加入该群组。辅导计划的导师和学员概览页面会显示\
  \ SAP Jam 群组动态。 | X | X | X |\n| 导师审批方式 ➤ 需要导师审批（由辅导计划管理员或经理审批） | 仅适用于公开报名计划。如果勾选，辅导计划管理员或经理必须批准导师参与计划。\
