- "# 发展目标状态值\n\n-   `Locked`（已锁定）\n-   `Deleted`（已删除）\n-   `Failed`（未达成）\n-   `Completed`（已完成）\n\
  \n当发展目标完成时，所有关联的学习活动将被设置为“Completed”（已完成）或“Locked”（已锁定）。条件权限也可能被添加到 XML 中。通过标签 `<condition>`\
  \ 进行标识，必须满足某个条件，才能允许某个角色查看计划中的字段。\n\n角色可以根据条件读取字段，如下面的代码片段所示：\n\n以下是自定义学习类型的代码片段示例：\n\
  \n```\nItem Type\nItem TypeItem Type\nItem Type\n\nExternal Course\nExternal Course\n\
  \nProject\nProject\n\nOn-the-Job Training (OJT)\nOn-the-Job-Training (OJT)\n\nJob\
  \ Rotation\nJob Rotation\n\nE-Learning/Webinars\nE-Learning/Webinars\n\nConference\
  \ / Seminar\nConference/Seminar\n\nAssignment\nAssignment\n\nSelf-Learning\nSelf-Learning\n\
  \nOthers\nOthers\n```\n\n计划布局（plan-layout）定义了学习活动字段在发展目标中的显示方式。表单布局（form-layout）、PDF\
  \ 布局（pdf-layout）和详情布局（details-layouts）部分不被使用。以下是计划布局的一个示例：\n\n在创建学习活动时应显示的所有字段都需要授予“读取”和“写入”权限。字段的定义和权限授予方式与目标和发展计划模板类似。能够读取发展计划中发展目标字段的角色，应对学习活动字段拥有相同的“读取”权限。否则，用户在查看发展计划时，将看不到学习活动的任何字段。您可以决定，经理可以向下属的发展计划添加发展目标，但只能读取学习活动字段。这意味着发展计划\
  \ XML 应为经理设置“写入”权限，而学习活动 XML 应设置“读取”权限。您需要仔细规划每个角色应能执行的操作以及应看到的内容，因为您必须正确配置模板 XML\
  \ 中的权限和基于角色的权限。\n\n## 在员工个人资料中显示发展目标门户的配置\n\n本章前面提到过发展模板 XML 中的一个开关，它允许发展目标以门户组件的形式显示在员工个人资料中。还需要在继任数据模型中进行额外配置，以添加“发展目标门户”背景元素。\n\
  \n登录 Provisioning 并转到“公司设置”。找到“继任管理”部分，单击“导入/导出数据模型”链接，如图 1-35 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig35_HTML.jpg](img/510611_1_En_1_Fig35_HTML.jpg)\n\
  \n**图 1-35** 继任管理访问入口\n\n在“导入/导出数据模型”屏幕上（如图 1-36 所示），下载数据模型以进行修改。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig36_HTML.jpg](img/510611_1_En_1_Fig36_HTML.jpg)\n\
  \n**图 1-36** 导入/导出数据模型\n\n添加背景元素 `sysScoreCardDevelopmentObjectivesPortlet`，如下代码片段所示：\n\
  \n```\nDevelopment Goals Portlet\nDevelopment Goals Portlet\n\nDevelopment Goal\n\
  Development Goal\n```\n\n同时，将背景元素门户组件添加到 `view-template for employeeScoreCard` 中，如下代码片段所示：\n\
  \n```\nView Template for Employee Scorecard\nThis view Template for Employee Scorecard\
  \ should have only 1 edit template\n\nEdit Template for Employee Scorecard\nEdit\
  \ Template for Employee Scorecard\n```\n\n完成更新后，保存并导入继任数据模型。\n\n> **注意：** 背景元素的名称是“发展目标门户”（Development\
  \ Objective Portlet），但在我们的示例中，我们在标签中使用了“Goal”来代替“Objective”。我们将使用其标准名称来引用背景元素门户组件，但在我们的实例中它将显示为“Development\
  \ Goals Portlet”（发展目标门户）。\n\n## 在员工个人资料中配置发展门户\n\n返回实例中，需要在员工个人资料中配置此门户组件。转到“配置员工个人资料”以添加发展目标门户。\n\
  \n找到该区块并将其拖到您希望其显示的章节，如图 1-37 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig37_HTML.jpg](img/510611_1_En_1_Fig37_HTML.jpg)\n\
  \n**图 1-37** 在员工个人资料中添加发展计划区块\n\n为子章节添加标签，并添加区块标题和描述，如图 1-38 所示。也可以创建本地化标签。\n\n\
  ![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig38_HTML.jpg](img/510611_1_En_1_Fig38_HTML.jpg)\n\
  \n**图 1-38** 标识发展计划模板\n\n添加区块后保存个人资料。需要授予基于角色的权限才能在员工个人资料中访问这些数据。在搜索栏中输入并选择“管理权限角色”。\n\
  \n对于每个应有权访问门户组件的角色，点击“权限”按钮，找到“用户权限”部分，并选择“员工数据”。在“背景”部分中授予对“发展目标门户”的“查看”访问权限，如图\
  \ 1-39 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig39_HTML.jpg](img/510611_1_En_1_Fig39_HTML.jpg)\n\
  \n**图 1-39** 访问发展目标门户的权限\n\n我们在本章前面了解过在开发计划 XML 中设置开关，如下所示：\n\n```\n<switch name=\"\
  developmentObjectivePortlet\" value=\"true\">\n```\n\n当此开关开启时，用户的所有发展目标将显示在员工个人资料中的发展目标门户内。如果未使用此开关，默认设置允许用户选择要在其个人资料门户中添加哪些发展目标。在这种情况下，还需要为此门户组件授予“编辑”权限。示例如图\
  \ 1-40 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig40_HTML.jpg](img/510611_1_En_1_Fig40_HTML.jpg)\n\
  \n**图 1-40**\n\n当我们以员工身份逐步完成发展计划时，我们将看到其具体工作方式。\n\n## 导入发展目标\n\n有一个发展目标导入工具，可用于批量上传员工发展目标。其工作方式与目标导入相同，但使用的是不同的屏幕和不同的模板。如果您已导入员工目标，则可能已授予管理员权限角色执行此任务的权限；该权限适用于两者。在管理员角色的基于角色的权限中，转到“管理员权限”部分。找到“管理目标”并添加“导入目标”。\n\
  \n可能存在您正从其他发展目标跟踪系统迁移到 SAP SuccessFactors 职业发展系统的情况。在这种情况下，您可能希望将其他系统中的发展目标复制到用户的新发展计划中。导入的另一个用途是为选定的用户分配部门级或公司级的发展目标。\n\
  \n要开始此过程，请在搜索栏中输入并选择“导入发展目标”，将显示导入屏幕，如图 1-41 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig41_HTML.jpg](img/510611_1_En_1_Fig41_HTML.jpg)\n\
  \n**图 1-41** 导入发展目标屏幕\n\n从可用模板列表中，选择用于您发展计划的发展计划模板，然后单击“生成 CSV 标头”。导入模板将包含您发展计划特有的字段。当您下载\
  \ CSV 标头文件时，`OBJ_PLAN_ID` 和 `OBJ_PLAN_NAME` 将包含您的发展计划名称和 ID。\n\n打开模板以查看其布局。示例如图\
  \ 1-42 所示。\n\n\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig42_HTML.jpg](img/510611_1_En_1_Fig42_HTML.jpg)\n\
  \n**图 1-42** 发展计划导入模板\n\n前四行不可修改，它们用于标识发展计划。第 5 行包含发展目标计划字段的标题。标题行定义了每个发展目标字段所需的值。如果存在您不填充的标准发展目标计划字段，则可以删除这些列。您需要为每个要导入的发展目标创建一行。\n\
  \n`^TYPE`（A 列）字段始终为必填项。每一行的 `^TYPE` 列都应为 `\"OBJECTIVE\"`。`ACTION`（B 列）字段始终为必填项。每一行的\
  \ `ACTION` 列都应为 `\"OBJECTIVE\"`。有效的操作类型为 `\"ADD\"`、`\"DELETE\"` 和 `\"UPDATE\"`。如需向员工的目标计划添加目标，请使用\
  \ `\"ADD\"`。创建发展目标时所需的任何字段都必须在文件中填写。\n\n## 导入文件字段说明\n\n有关发展目标计划字段的说明，请参考表 1-9。\n\
  \n**表 1-9** 发展计划导入字段\n\n| 字段 | 说明 | 值 |\n| --- | --- | --- |\n| `^TYPE` | 上传时使用的计划类型。\
  \ | `OBJECTIVE`。 |\n| `ACTION` | 对目标执行的操作。 | `ADD`、`DELETE` 或 `UPDATE`。 |\n| `ID`\
  \ | 导入目标时系统生成。 | 对于 `ADD` 操作，请留空。 |\n| `SUBID` | 不支持。 | 留空。 |\n| `GUID` | 更新或删除目标时用作参考的标识符。\
  \ | 可以是任何您想要的值，前提是每个目标的 `GUID` 都是唯一的。 |\n| `FILTER_USERNAME` | 您要为其添加目标的员工的用户名。可以通过输入多个用户名来批量分配目标。\
  \ | 可以使用分号分隔的多个用户名。若要分配给所有人：`ALL`。 |\n| `FILTER_CUSTOM01-15` | 用作筛选条件的自定义字段（数据模型“默认”模块内的自定义筛选器）。\
  \ | 如果不需要，可以删除这些列。 |\n| `FILTER_DEPT` | 根据用户名的部门进行筛选。 | 列出一个部门，该部门中的每个人都将获得该目标。\
  \ |\n| `FILTER_DIV` | 根据用户名的分部进行筛选。 | 列出一个分部，该分部中的每个人都将获得该目标。 |\n| `FILTER_JOBCODE`\
  \ | 不支持。 | 留空或删除该列。 |\n| `FILTER_LOC` | 根据用户名的工作地点进行筛选。 | 列出一个地点，该地点中的每个人都将获得该目标。\
  \ |\n| `OBJECTIVE_CATEGORY` | 来自目标模板的默认类别 ID。 | `Goals`。 |\n| `OBJECTIVE_PARENTID`\
  \ | 未使用。 | 留空。 |\n| `OBJECTIVE_PUBLIC` | 表示目标是否公开。 | 公开目标使用 `1` 或 `Y`，私有目标使用 `0`\
  \ 或 `N`。 |\n| `OBJECTIVE_name` | 发展目标的名称。 | 使用您希望在计划中看到的发展目标名称。 |\n| `OBJECTIVE_metric`\
  \ | 如果计划中使用，则为发展目标衡量标准。 | 如果在模板中定义为文本或文本域，则可以使用任何文本。 |\n| `OBJECTIVE_start` | 如果计划中使用，则为发展目标的开始日期。\
  \ | 如果填写，日期必须采用 `MM/DD/YYYY` 格式。 |\n| `OBJECTIVE_due` | 如果计划中使用，则为发展目标的截止日期。 | 如果填写，日期必须采用\
  \ `MM/DD/YYYY` 格式。 |\n| `OBJECTIVE_state` | 如果计划中使用，则为发展目标的状态。 | 如果状态是下拉列表，请使用该状态的枚举值。\
  \ |\n| `OBJECTIVE_competency` | 如果发展目标关联了能力项。 | 在 JPB 中，找到能力项以获取其 GUID；用逗号分隔列出每个能力项的\
  \ GUID。 |\n| `OBJECTIVE_purpose` | 如果计划中使用，则为发展目标的目的。 | 如果目的是下拉列表，请使用该状态的枚举值。 |\n\
  \n任何 `FILTER` 列都可用于根据列中输入的值批量分配目标。`FILTER_USERNAME`、`FILTER_MGR_ID`、`FILTER_DEPT`、`FILTER_DIV`\
  \ 和 `FILTER_LOC` 是默认列。用户名筛选器是唯一支持单行多条目（以分号分隔）的筛选器。用作筛选器的自定义字段必须在数据模型的 `<custom-filters>`\
  \ 下定义。如果您不希望使用这些筛选器中的任何一个来批量分配目标，则可以从文件中删除这些列。\n\n包含 `\"OBJECTIVE\"` 的字段标题与发展目标计划上的字段相对应。示例如图\
  \ 1-43 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig43_HTML.jpg](img/510611_1_En_1_Fig43_HTML.jpg)\n\
  \n**图 1-43** 发展目标导入标题\n\n如果您的发展计划包含能力项，并且希望导入包含能力项的发展目标，则需要在文件中引用该能力项。此引用是能力项的 `GUID`。\n\
  \n要查找能力项 GUID，请在搜索栏中输入并选择“管理职位档案内容”。然后选择“能力项”，您将看到与每个能力项关联的 `GUID`。示例如图 1-44 所示。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig44_HTML.jpg](img/510611_1_En_1_Fig44_HTML.jpg)\n\
  \n**图 1-44** 管理能力项职位档案内容\n\n对于具有多个能力项的发展目标，请在 `OBJECTIVE_competency` 字段中填入每个能力项\
  \ ID，并用逗号分隔。如图 1-45 所示，请确保单元格格式为文本，以便使用逗号分隔符。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig45_HTML.jpg](img/510611_1_En_1_Fig45_HTML.jpg)\n\
  \n**图 1-45** 导入文件中的能力项列\n\n使用 CSV 文件格式，并以 Unicode (UTF-8) 字符编码导入文件，如图 1-46 所示。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig46_HTML.jpg](img/510611_1_En_1_Fig46_HTML.jpg)\n\
  \n**图 1-46** 发展目标导入\n\n上传完成后，管理员将收到一封包含导入状态的电子邮件。示例如图 1-47 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig47_HTML.jpg](img/510611_1_En_1_Fig47_HTML.jpg)\n\
  \n**图 1-47** 发展目标导入状态邮件\n\n该文件将显示导入过程中检测到的任何错误。请更正文件并重新导入。\n\n导入成功后，用户的发展计划将包含新上传的发展目标及其关联的能力项，如图\
  \ 1-48 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig48_HTML.jpg](img/510611_1_En_1_Fig48_HTML.jpg)\n\
  \n**图 1-48** 通过导入添加的发展目标\n\n## 发展目标的更新或删除\n\n为了批量更新或删除用户发展计划中的任何现有目标，需要系统生成的目标 ID。使用发展计划模板创建一个临时报告，并将发展目标\
  \ ID 字段包含在输出中，如图 1-49 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig49_HTML.jpg](img/510611_1_En_1_Fig49_HTML.jpg)\n\
  \n**图 1-49** 临时创建中的发展目标 ID\n\n如图 1-50 所示，要更新任何现有目标，请在 `^TYPE` 列使用 `\"OBJECTIVE\"\
  `，在 `ACTION` 列使用 `\"UPDATE\"`。在 C 列使用来自临时报告的发展目标 ID。仅填充要更改的发展目标的相关字段。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig50_HTML.jpg](img/510611_1_En_1_Fig50_HTML.jpg)\n\
  \n**图 1-50** 发展目标更新字段\n\n\n\n要删除任何现有目标，请在`^TYPE`字段中使用`\"OBJECTIVE\"`，在`ACTION`字段中使用`\"\
  DELETE\"`，并在 C 列中输入目标 ID。其他字段留空。示例如图 1-51 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig51_HTML.jpg](img/510611_1_En_1_Fig51_HTML.jpg)\n\
  \n**图 1-51** 删除发展目标的字段\n\n## 导入带有学习活动的发展目标\n\n如前所述，要导入带有学习活动的发展目标，您需要在`Provisioning`中启用`Transcript`功能。在导入文件中，您可以添加、删除和更新自定义学习活动；但无法添加目录学习活动。\n\
  \n在为用户导入新的发展目标时，无法同时包含学习活动。相反，需要进行两次导入。首先，载入新的发展目标。添加发展目标后，获取其 GUID。然后，您就可以载入与该发展目标关联的学习活动了。下载文件的新表头模板。在这里，我们只需填充学习活动专属字段。此外，还需要标识发展目标的用户以及要添加学习活动的发展目标。对于每一行，将`^TYPE`设置为`\"\
  LEARNING\"`，并将`ACTION`设置为`\"ADD\"`。包括发展目标的 GUID、必需的学习字段以及其他学习活动字段。\n\n文件示例如图 1-52\
  \ 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig52_HTML.jpg](img/510611_1_En_1_Fig52_HTML.jpg)\n\
  \n**图 1-52** 包含学习活动的发展计划导入文件\n\n按照相同的发展目标流程操作。包含学习活动的更新后发展目标示例如图 1-53 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig53_HTML.jpg](img/510611_1_En_1_Fig53_HTML.jpg)\n\
  \n**图 1-53** 在导入文件中添加学习活动\n\n> **注意：** 要了解更多关于导入学习活动的信息，请参阅 SAP 说明 #2472229。\n\n\
  ## 从员工角度使用职业发展\n\n我们已经讨论了如何在`Provisioning`和实例中设置职业发展。我们回顾了基于角色的权限，并了解了如何批量导入发展目标、配置`Development\
  \ Goals Portlet`以及配置学习活动。\n\n现在，我们将演示一个员工使用`Development Plan`的场景。\n\n员工可以从如图 1-54\
  \ 所示的首页菜单列表中访问`Development`模块。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig54_HTML.jpg](img/510611_1_En_1_Fig54_HTML.jpg)\n\
  \n**图 1-54** 带有发展选项卡的首页菜单\n\n将显示`Development Plan`。示例如图 1-55 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig55_HTML.jpg](img/510611_1_En_1_Fig55_HTML.jpg)\n\
  \n**图 1-55** 空白的发展计划\n\n在添加任何目标之前，用户会看到一个空白的计划，其中包含一个介绍（如果已配置）以及计划顶部的一些选项。发展计划的界面风格与目标计划相同。模板配置将决定计划中可用的布局、权限和操作。有关更多详细信息，请参考第\
  \ 1 卷第 4 章。\n\n我们首先审查屏幕右上角部分可用的选项。用户可以添加新的发展目标，如图 1-56 所示。与目标计划不同，这里没有可供参考的目标库。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig56_HTML.jpg](img/510611_1_En_1_Fig56_HTML.jpg)\n\
  \n**图 1-56** 添加目标\n\n用户将能够打印该计划，如图 1-57 的“操作”菜单所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig57_HTML.jpg](img/510611_1_En_1_Fig57_HTML.jpg)\n\
  \n**图 1-57** 打印操作\n\n如图 1-58 所示，`Display Options`功能允许用户选择要在计划中显示的目标计划字段。可以隐藏某些字段，以使计划看起来更简洁。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig58_HTML.jpg](img/510611_1_En_1_Fig58_HTML.jpg)\n\
  \n**图 1-58** 发展计划显示选项\n\n用户可以添加发展目标，如图 1-59 所示。弹出窗口将显示模板中配置的所有字段。必须填写所有必填字段才能保存该目标。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig59_HTML.jpg](img/510611_1_En_1_Fig59_HTML.jpg)\n\
  \n**图 1-59** 向计划添加发展目标\n\n如果发展计划配置为允许向发展目标添加能力，则此选项也会出现。示例如图 1-60 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig60_HTML.jpg](img/510611_1_En_1_Fig60_HTML.jpg)\n\
  \n**图 1-60** 向发展目标添加能力\n\n根据默认的能力字段配置，用户可以选择多项能力附加到发展目标上。\n\n还有`\"Add Competencies\"\
  `选项，允许用户从能力库中添加更多能力，如图 1-61 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig61_HTML.jpg](img/510611_1_En_1_Fig61_HTML.jpg)\n\
  \n**图 1-61** 从能力库向发展目标添加能力\n\n如果已配置，用户将在该字段看到`\"Coaching Advisor\"`，如图 1-62 所示。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig62_HTML.jpg](img/510611_1_En_1_Fig62_HTML.jpg)\n\
  \n**图 1-62** 辅导顾问\n\n如图 1-63 所示，将出现一个弹出窗口，允许用户选择要查看的能力集。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig63_HTML.jpg](img/510611_1_En_1_Fig63_HTML.jpg)\n\
  \n**图 1-63** 为辅导顾问选择能力\n\n选择能力集后，会显示相应的能力。在此示例中，如图 1-64 所示，显示的是与用户工作角色关联的能力。\n\n\
  ![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig64_HTML.jpg](img/510611_1_En_1_Fig64_HTML.jpg)\n\
  \n**图 1-64** 工作角色能力\n\n然后，用户可以深入查看某个能力以了解辅导建议。示例如图 1-65 所示。在选择一个能力预览后，用户向下滚动以查看相应的辅导建议。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig65_HTML.jpg](img/510611_1_En_1_Fig65_HTML.jpg)\n\
  \n**图 1-65** 辅导建议\n\n用户可以通过点击`\"Place Text\"`按钮添加辅导建议，如图 1-66 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig66_HTML.jpg](img/510611_1_En_1_Fig66_HTML.jpg)\n\
  \n**图 1-66** 选择要添加到发展目标的文本\n\n系统将显示一条确认消息，表明该文本已添加到发展目标的字段中，如图 1-67 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig67_HTML.jpg](img/510611_1_En_1_Fig67_HTML.jpg)\n\
  \n**图 1-67** 确认消息\n\n\n\n随后，用户关闭弹出窗口，文本将显示在目标计划字段中，如图 1-68 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig68_HTML.jpg](img/510611_1_En_1_Fig68_HTML.jpg)\n\
  \n**图 1-68**  \n为发展目标添加辅导建议\n\n用户可以编辑添加到发展目标中的辅导建议措辞。更新后的发展目标如图 1-69 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig69_HTML.jpg](img/510611_1_En_1_Fig69_HTML.jpg)\n\
  \n**图 1-69**  \n添加辅导建议后的发展目标\n\n## 发展规划中的 CPM 成果\n\n如果发展目标与持续绩效管理（CPM）成果相关联，用户可引用发展规划来链接到某项活动或成果。如图\
  \ 1-70 所示，用户可以将发展目标关联到 CPM 活动和成果。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig70_HTML.jpg](img/510611_1_En_1_Fig70_HTML.jpg)\n\
  \n**图 1-70**  \n将发展目标关联到 CPM 活动或成果\n\n如果用户已将发展目标附加到 CPM 成果，则“CPM 成果”列将显示一个计数。示例如图\
  \ 1-71 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig71_HTML.jpg](img/510611_1_En_1_Fig71_HTML.jpg)\n\
  \n**图 1-71**  \n发展目标上的 CPM 成果详情\n\n点击“CPM 成果”列中的数字将显示成果详情，如图 1-72 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig72_HTML.jpg](img/510611_1_En_1_Fig72_HTML.jpg)\n\
  \n**图 1-72**  \nCPM 成果详情\n\n根据发展规划模板 XML 中配置的操作权限，用户可以编辑或删除目标、添加学习活动，或将目标添加到其个人资料中的“发展目标\
  \ Portlet”中。这些选项将显示在“操作”列下，如图 1-73 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig73_HTML.jpg](img/510611_1_En_1_Fig73_HTML.jpg)\n\
  \n**图 1-73**  \n发展目标的可用操作\n\n## 关联到发展目标的学习活动\n\n如果将学习活动配置为发展规划的一部分，用户将能够添加学习活动。示例如图\
  \ 1-74 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig74_HTML.jpg](img/510611_1_En_1_Fig74_HTML.jpg)\n\
  \n**图 1-74**  \n为发展目标添加学习活动\n\n如果将 LMS 目录配置为可在发展规划中供用户使用，则用户可以前往 LMS 目录查找课程。示例如图\
  \ 1-75 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig75_HTML.jpg](img/510611_1_En_1_Fig75_HTML.jpg)\n\
  \n**图 1-75**  \n在 LMS 目录中搜索课程\n\n用户可能可以选择向发展目标添加自定义学习活动，如图 1-76 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig76_HTML.jpg](img/510611_1_En_1_Fig76_HTML.jpg)\n\
  \n**图 1-76**  \n向发展目标添加学习活动\n\n自定义学习活动的布局基于学习活动模板 XML。一个发展目标可以添加多个学习活动。用户可以根据发展规划模板\
  \ XML 中配置的权限来编辑、查看或删除目标。用户可以通过“操作”或点击铅笔图标进行编辑来删除自定义学习活动。\n\n详情如图 1-77 所示。\n\n\n\n\
  ![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig77_HTML.jpg](img/510611_1_En_1_Fig77_HTML.jpg)\n\
  \n图 1-77\n删除学习活动\n\n## 档案中的发展目标\n\n根据`发展计划 Portlet`的配置，用户可以向其档案添加发展目标，否则系统会自动将其添加到该\
  \ Portlet 中。操作选项如图 1-78 所示。在以下示例中，用户可以选择一个要添加到 Portlet 中的发展目标。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig78_HTML.jpg](img/510611_1_En_1_Fig78_HTML.jpg)\n\
  \n图 1-78\n向发展计划 Portlet 添加发展目标\n\n如前所述，当在开发计划模板 XML 中添加了开关后，用户将无法选择在档案的`发展目标 Portlet`中显示哪些发展目标。添加到其计划中的所有发展目标都将自动添加到其档案的\
  \ Portlet 中。“在记分卡中添加发展目标”选项将不再显示为发展目标的可用操作。\n\n图 1-79 显示了出现在`员工档案`中的 Portlet 示例。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig79_HTML.jpg](img/510611_1_En_1_Fig79_HTML.jpg)\n\
  \n图 1-79\n发展目标 Portlet\n\n如果未设置开关，并且用户可以直接在此 Portlet 中添加发展目标，`发展目标 Portlet`不支持添加自定义学习活动或按能力进行搜索。\n\
  \n## 查看他人的发展计划\n\n如果发展计划模板 XML 为所有角色授予了目标计划字段的读取权限，则在基于角色的权限允许下，用户将能够查看他人的计划。当用户查看自己的发展计划时，他们可以执行姓名搜索来查找其他用户，以便查看其计划。\n\
  \n在此示例中，如图 1-80 所示，用户可以进入自己的发展计划，执行姓名搜索，并查看他人计划的内容。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig80_HTML.jpg](img/510611_1_En_1_Fig80_HTML.jpg)\n\
  \n图 1-80\n员工查看其他用户的发展计划\n\n## 从管理者角度使用职业发展\n\n管理者将能够通过姓名搜索访问其直接下属的目标计划，如图 1-81 所示。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig81_HTML.jpg](img/510611_1_En_1_Fig81_HTML.jpg)\n\
  \n图 1-81\n管理者搜索直接下属\n\n发展计划模板 XML 的权限决定了管理者能看到什么以及可以执行哪些操作。可以允许管理者创建、编辑和删除目标。权限可能只允许他们编辑某些字段，或者不允许他们添加学习活动。\n\
  \n如果管理者权限角色可以访问所有层级，那么上级管理者也将能够访问该目标计划。\n\n如果`HR 经理`角色已更新为允许其访问所支持的任何用户，那么他们将能够访问这些用户的计划。根据\
  \ XML 中的权限，`HR 经理`可能能够编辑、删除或添加发展目标，或者可能只有“读取”权限，并且对其可以查看的字段有限制。\n\n现在，我们已经回顾了发展目标计划的配置，并逐步了解了发展计划的工作原理。接下来，我们将简要介绍报告选项。\n\
  \n## 报告：标准报告\n\n发展目标报告可在“经典视图”下的“标准报告”中找到。选择“发展目标”，如图 1-82 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig82_HTML.jpg](img/510611_1_En_1_Fig82_HTML.jpg)\n\
  \n图 1-82\n经典视图中的发展目标列表\n\n在这里，您将找到唯一的标准发展计划相关报告。\n\n现在点击“目标”，如图 1-83 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig83_HTML.jpg](img/510611_1_En_1_Fig83_HTML.jpg)\n\
  \n图 1-83\n目标列表\n\n许多标准的`目标管理`报告可用于发展目标报告。在报告的筛选选项中，选择您想要报告的发展计划。\n\n使用`目标搜索`报告来报告学习活动。选择包含学习活动的发展目标计划，并确保您的导出选项包含活动级别数据。但是，当启用`成绩单`功能时，经典报告不支持报告学习活动。\n\
  \n## 报告：即席报告\n\n即席报告可以包含学习活动、能力以及发展目标计划数据。\n\n在创建即席报告时，使用`发展目标`域，如图 1-84 所示。\n\n\
  ![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig84_HTML.jpg](img/510611_1_En_1_Fig84_HTML.jpg)\n\
  \n图 1-84\n使用发展目标域创建即席报告\n\n如果为发展目标数据授予了即席创建权限，那么`HR 经理`或管理者可以为其目标群体创建或运行发展计划即席报告。\n\
  \n作为管理员，您可以创建即席报告，这些报告将对`HR 经理`和管理者可用，以便他们可以为其目标群体运行发展报告。在通过向导创建即席报告时，在`人员`选项卡中，选择“已登录用户”以及管理者应该有权访问的层级数。示例如图\
  \ 1-85 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig85_HTML.jpg](img/510611_1_En_1_Fig85_HTML.jpg)\n\
  \n图 1-85\n选择报告类型\n\n当管理者运行此报告时，结果将仅显示其团队中的员工。\n\n如图 1-86 所示，有许多字段可以用于报告。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig86_HTML.jpg](img/510611_1_En_1_Fig86_HTML.jpg)\n\
  \n图 1-86\n发展计划字段\n\n为管理者提供即席报告，使他们能够轻松查看哪些员工创建了发展目标，并跟踪目标的进展情况。\n\n> **注：** 要了解有关即席报告的更多信息，请参阅\
  \ SAP 说明 #2536445。\n\n## 发展计划的其他用途\n\n有许多接触点可以利用发展计划目标数据。我们已经看到可以添加到`员工档案`中的`发展计划\
  \ Portlet`，并了解了 CPM 成就如何与发展目标关联并显示在用户的发展计划上。我们将回顾其他一些集成领域。\n\n### 与绩效管理表单的集成\n\n\
  绩效表单可以配置为包含发展目标。包含后将在绩效表单上创建一个发展计划部分。发展目标不进行评级，但为了规划目的，将此部分纳入绩效表单可能会有所帮助。用户可以在其绩效表单上添加发展目标，该目标也将流入其发展计划。示例如图\
  \ 1-87 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig87_HTML.jpg](img/510611_1_En_1_Fig87_HTML.jpg)\n\
  \n图 1-87\n包含发展目标部分的绩效表单\n\n请回看第 1 卷第 7 章，以了解将发展目标纳入绩效评估模板所需的设置。\n\n\n  \n## 开发计划与\
  \ 360 度评估的集成\n\n`360 度评估表`可生成包含开发目标引用和链接的报告。在表单中启用此功能后，链接将使用默认的开发计划。该链接适用于`排名视图`和`摘要视图`，但`盲点`、`隐藏优势`和`差距分析视图`不支持此功能。更多信息请参阅第\
  \ 1 卷第[12](https://doi.org/10.1007/978-1-4842-6995-4_12)章。\n\n## 开发计划与校准的集成\n\n\
  在校准会议中，可以查看员工的开发计划。如图 1-88 所示的`列表视图`中，点击员工的“更多”图标即可显示可用选项。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig88_HTML.jpg](img/510611_1_En_1_Fig88_HTML.jpg)\n\
  \n**图 1-88**  \n在校准会议中链接到开发计划\n\n点击“发展”将弹出一个窗口，显示校准对象的开发计划。请参阅第 1 卷第[14](https://doi.org/10.1007/978-1-4842-6995-4_14)章了解如何启用此选项。\n\
  \n## 职业发展计划与继任管理的集成\n\n在`继任管理`模块中，可在`继任者`卡片中查看开发计划，如图 1-89 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig89_HTML.jpg](img/510611_1_En_1_Fig89_HTML.jpg)\n\
  \n**图 1-89**  \n从继任者卡片链接到开发计划\n\n有关`继任者`卡片配置的更多信息，请参阅第 6 章。\n\n## 与职业工作表中能力关联的开发目标\n\
  \n只要您的开发目标计划使用了能力，您就可以将开发目标添加到员工职业工作表的工作角色能力中，如图 1-90 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig90_HTML.jpg](img/510611_1_En_1_Fig90_HTML.jpg)\n\
  \n**图 1-90**  \n开发目标与职业工作表上的能力关联\n\n添加到工作表能力上的开发目标随后会作为开发目标出现在用户的计划中，并关联相应能力。您将在第\
  \ 2 章和第 3 章中了解更多关于此功能的信息。\n\n"
- '# 结论


  希望您喜欢我们关于开发计划创建的旅程。现在您应该知道如何在`配置`中激活`职业发展计划`，设置配置和管理开发计划的权限，创建基本的开发计划模板，以及直接编辑计划模板的`XML`。我们还了解了如何以经理和员工的身份使用开发计划，如何将能力与开发目标关联，以及如何创建自定义学习活动。我们看到了如何使用`LMS`目录来创建与开发目标关联的学习活动。我们还了解了开发计划如何与其他绩效管理领域（包括`持续绩效管理`、`校准`、`人员档案`和`继任管理`）集成。我们回顾了可用于开发计划报告的标准报告，并了解了如何为开发计划创建临时报告。在下一章中，我们将进入`职业发展计划`的另一项功能，该功能利用开发目标来帮助规划未来的角色。


  '
- "# 2. 配置职业工作表\n\n在上一章中，我们简要介绍了 SAP SuccessFactors 职业发展模块中的功能。当在`配置`中启用`完整版 CDP`时，即可使用`开发计划`、`职业工作表`、`职业路径`和导师指导功能。\n\
  \n在本章中，我们将首先了解什么是职业工作表及其相互依赖关系，然后重点介绍`职业工作表`的管理任务。我们将启用`职业工作表`，并为这一职业规划工具创建必要的配置和权限。我们将学习如何创建职业路径，并探索建议工作角色的设置。我们将审视为工作角色能力添加预期评级的流程。我们将了解如何创建`角色就绪评估`表单。我们将探讨工作角色能力与开发目标的结合使用，以及它们如何与职业工作表互动。我们还将学习评估员工未来角色就绪度所需的条件。最后，我们将简要介绍`职业探索器`。此新功能目前仅在`早期采用者关怀`（EAC）计划中可用。\n\
  \n## 什么是职业工作表？\n\n`职业工作表`是一种工具，通过查看工作角色、建议角色和职业路径，为用户提供职业发展机会的概览。该工具有助于员工主动规划并为未来角色做好准备。它是一个查看工作角色及其所需能力的载体。员工可以瞄准想要成长的工作角色，并集中精力为这些未来角色做准备。`职业工作表`易于实施和管理，可以提升员工的敬业度和保留率。\n\
  \n`职业工作表`高度依赖于已映射能力的工作角色。能力可以通过`职位档案构建器`或传统的`系列与角色`功能映射到工作角色。一个工作角色可能拥有多种能力，而对于`职业工作表`，每种能力都必须有一个预期评级。每种能力的预期评级指明了掌握该能力所需达到的分数。\n\
  \n职业工作表通过将员工已评级的能力与未来角色所需的能力进行对比，计算出员工对某个角色的就绪度。能力评级可能来自最近完成的`绩效管理`或`360 度评估`表单，也可能来自员工从工作表上启动的角色就绪表单。基于实际评级与预期评级的对比计算，就绪度仪表盘会显示员工具备担任未来角色能力的百分比。\n\
  \n工作表还会识别能力差距，突出显示员工需要改进的发展领域。基于这些差距，员工可以创建旨在掌握新角色所需能力的开发目标。\n\n图 2-1 展示了一个职业工作表示例。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig1_HTML.jpg](img/510611_1_En_2_Fig1_HTML.jpg)\n\
  \n**图 2-1**  \n职业工作表示例\n\n在职业工作表上，员工可以浏览工作角色、查看建议角色或查看职业路径。无论采用哪种方法，员工都能看到职位描述以及与该工作角色关联的能力。这让他们可以一窥工作职责和技能，从而判断这是否是他们想要争取的角色。\n\
  \n在接下来的篇幅中，我们将逐步介绍需要在`公司设置`中启用的选项。接下来，我们将为管理员角色设置基于角色的权限。我们还将学习如何创建职业路径、向`人员档案`添加`职业目标`模块、创建角色就绪表单，以及为能力添加预期评级。\n\
  \n## 配置设置\n\n为了使用`职业工作表`和`职业路径`，需要先在`配置`中启用一些设置。为了让`职业工作表`正常运行，我们首先需要检查一些`公司设置`方面的前提条件。\n\
  \n\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig2_HTML.jpg](img/510611_1_En_2_Fig2_HTML.jpg)\n\
  \n**图 2-2** 配置中的能力库\n\n1.  由于职业工作表依赖于映射到岗位角色的能力，因此必须建立一个能力库。您可以使用如图 2-2 所示的 SuccessFactors\
  \ 2.1 能力库，也可以创建自定义能力库。\n\n接下来，我们将进入公司设置，验证某些设置是否已启用。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig3_HTML.jpg](img/510611_1_En_2_Fig3_HTML.jpg)\n\
  \n**图 2-3** 公司设置中的职业与发展规划功能\n\n1.  发展计划设置应该已经启用。在公司设置中，找到“目标框架”部分进行验证。\n2.  在“职业与发展规划”下，“CDP\
  \ 完整版（发展计划）”和“发展计划 V12”应已启用。如果您在发展计划中使用了学习活动，则“成绩单”也应已启用。\n\n发展计划设置如图 2-3 所示。\n\n\
  1.  验证“启用附件管理器”、“启用通用对象”、“版本 12 UI 框架（革命性）”和“JDM v.2/技能管理”也已启用。\n2.  检查“员工目录”是否已启用。如果已启用，这可能会帮助您决定职业工作表模板\
  \ XML 中的一项设置，我们将在本章后面讨论该内容。\n\n## 需要启用的公司设置\n\n现在，我们准备在职业发展模块中启用职业工作表和职业路径。以下是公司设置中启用两者的路径：\n\
  \n*   目标框架 ➤ 我的目标选项卡\n*   目标框架 ➤ 职业与发展规划 ➤ 职业工作表 V12\n*   目标框架 ➤ 职业与发展规划 ➤ 职业工作表\n\
  *   目标框架 ➤ 职业与发展规划 ➤ 启用职业路径 V2\n*   目标框架 ➤ 职业与发展规划 ➤ 启用职业路径\n\n启用“职业工作表 V12”也将同时启用“职业工作表”。同样，启用“职业路径\
  \ V2”将同时启用“职业路径”。我们还需要在公司设置的目标框架部分找到并启用“我的目标选项卡”。\n\n如果您在实例中使用临时报告，则有一些有限的职业工作表报告功能。若要允许报告用户在职业工作表上针对的岗位角色，请前往“分析和仪表板选项卡与杂项报告”并启用以下选项：\n\
  \n*   附加的临时子域架构配置 ➤ 职业工作表目标角色\n*   在人员选择器中启用`包含从用户开始` ➤ 职业工作表目标角色\n\n一旦这些设置更新并保存后，退出公司设置。接下来，我们需要前往配置中的另一个区域下载职业工作表模板。\n\
  \n## 职业工作表 XML\n\n由于职业工作表模板在实例中不可用，我们需要下载模板 XML 以进行更新，例如选择要开启的功能、更改标签以及设置操作和字段权限。完成更新后，该文件将被重新导入配置中。\n\
  \n转到“管理计划模板”，如图 2-4 所示。这里可以找到目标和发展目标计划模板，最近在第一章中讨论过。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig4_HTML.jpg](img/510611_1_En_2_Fig4_HTML.jpg)\n\
  \n**图 2-4** 配置中的计划模板\n\n找到并点击“导入/更新/导出职业工作表模板”链接。在这里，您将找到入门级职业工作表模板 XML。\n\n如图 2-5\
  \ 所示，显示下载和上传职业工作表模板 XML 的屏幕。您需要导出模板 XML。您的 Web 浏览器会将文件下载到本地机器。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig5_HTML.jpg](img/510611_1_En_2_Fig5_HTML.jpg)\n\
  \n**图 2-5** 导出和导入职业工作表模板 XML 的屏幕\n\n虽然不太可能，但如果此处没有显示职业工作表模板，请前往包含入门级模板示例的 CDP 实施指南。该指南包含一个职业工作表模板\
  \ XML，您可以将其复制到 XML 编辑器中。然后，您可以更新文件并将 XML 导入配置。另一种获取入门级模板的方法是从销售演示系统的配置中导出职业工作表模板\
  \ XML，然后将其导入到您的环境配置中。\n\n现在模板已下载，让我们在 XML 编辑器中打开它，查看职业工作表的组件，并了解哪些选项可以修改。\n\n以下是可在职业工作表模板\
  \ XML 中更新的元素：\n\n*   删除字段（特别是 `gap_graph`）\n*   字段标签\n*   功能和字段权限\n*   评级量表 ID\n\
  *   用户可选择的目标角色数量限制\n*   开关\n\n在我们深入讨论之前，以下是使用职业工作表时需要注意的一些要点：\n\n*   只能有一个活动的职业工作表模板。\n\
  *   职业工作表模板上的字段 ID 不可修改。\n*   职业工作表模板 XML 中不能使用类别。\n*   无法在职业工作表模板 XML 中创建自定义字段。\n\
  *   职业工作表模板 XML 上不能授予“写入”权限。\n*   职业工作表中仅显示已完成表单的评级。\n*   发展目标可用于在职业工作表中为能力添加目标，并提供与某项能力相关的发展目标数量。\n\
  *   职业工作表只能链接到一个职业发展规划模板。\n*   职业工作表使用默认发展计划来列出与某项能力相关的发展目标。\n*   发展目标权限基于发展目标计划\
  \ XML 上的操作和角色权限。\n\n查看 XML 的第一个部分。`<obj-plan-template>` 标签是 XML 结构中的最高级别标签。它定义了一系列可以打开或关闭的选项。这与您在目标和发展计划模板\
  \ XML 中找到的标签相同，但有一个特定于工作表的属性可以修改。\n\n以下是一个示例代码片段：\n\n在该标签内，`cws-people-role` 属性默认设置为\
  \ `true`。此设置允许在职业工作表上显示一个指示器，显示拥有目标角色的员工数量。如果在公司设置中启用了员工目录，工作表中将有一个链接显示拥有该目标角色的员工姓名。\n\
  \n如果您不希望在工作表上显示岗位角色持有者的姓名，请将 `cws-people-role` 设置为 `false`。您仍将看到员工数量，但不会看到岗位角色持有者的姓名。\n\
  \n`<obj-plan-template>` 标签不应有其他属性更改。\n\n与目标和发展计划模板 XML 一样，该标签后面跟随一系列元素。职业工作表模板的模板\
  \ ID 必须在 5001–5099 范围内，通常为 5001。计划类型必须为 `CareerWorksheet`。您可能希望进行的唯一更改是计划开始日期 `<obj_plan_start>`\
  \ 和截止日期 `<obj_plan_due>`。\n\n以下是一个示例代码片段：\n\n```\nCareerWorksheet\n职业工作表\n\n5/23/19\
  \ 5:38 PM\n01/01/2019\n12/31/2021\n```\n\n\n\n由于开发计划通常持续数年，建议使用与开发目标计划相同的开始日期和截止日期。`Career\
  \ Worksheet` 模板 XML 中可以添加一些额外的标签。\n\n如果你为职位能力定义了行为标准，可以在职业工作表的计算中使用行为就绪评级。以下是需要使用的行为标签：\n\
  \n```\n<behavior-tag>\n```\n\n当行为就绪状态不参与计算且不在职业工作表中显示时，行为标签示例如下：\n\n```\n<behavior-tag-example>\n\
  ```\n\n该标签应跟在 ` <*text-replacement*>` 标签之后，并位于字段定义标签之前。\n\n**角色就绪计算的数据来源**\n\n职位的能力评级是职业工作表的核心驱动因素，用于衡量员工胜任下一个角色的准备程度。评级的数据源必须为职业工作表明确定义，才能计算目标角色的就绪情况。员工当前能力评级的默认来源是已完成的绩效评估表或\
