  ## 查看/写入字段权限


  “查看/写入”权限控制在创建或编辑发展目标时，角色可以查看和写入哪些字段。


  每个目标计划字段都需要分配权限。权限包括：


  - **无：**角色对该字段没有访问权限。

  - **读取：**角色可以读取该字段。

  - **写入：**角色可以读取和写入该字段。


  在发展计划模板 XML 中，使用 `"Read"` 和 `"Write"` 字段权限类型来标识哪些角色可以访问哪些发展计划内容。`"Read"` 和 `"Write"`
  字段权限定义了角色在创建或更新目标时是否可以查看或写入。字段权限按 XML 源码顺序进行扫描。识别发展计划中使用的字段，并确定哪些角色可以读取或写入这些字段。


