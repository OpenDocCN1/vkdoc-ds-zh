- "# 1. 发展计划\n\n职业发展规划是一个持续的过程，用于帮助个人评估其优势、劣势、技能、兴趣和优先事项，以规划其职业成长并为未来的机会做好准备。职业发展计划用于设定可行的目标，帮助个人确定其发展方向以及实现目标所需的步骤。它是员工用于记录在当前角色中成长和为未来角色做准备所需的短期和长期可行目标的蓝图。该计划可基于员工实现个人及职业成长所需的技能、能力、教育、培训或行为。计划可能包括实现这些目标所需的步骤或活动以及时间框架。设定个人和职业发展目标为员工提供了通往未来成功的路线图。\n\
  \nSAP SuccessFactors 在职业发展规划（CDP）模块中提供了一套工具，员工可用其管理个人和职业发展目标、进行职业规划、查看职业发展路径以及参与导师计划。\n\
  \n在本章中，我们将逐步介绍如何设置职业发展规划。我们首先在 Provisioning 中开启该模块并分配配置权限。然后，我们将演示如何使用在线编辑器创建和修改发展计划模板。我们将了解角色能力如何与发展目标及学习活动结合使用。接着，我们通过示例代码详细说明编辑由该在线编辑器生成的\
  \ XML 的细节。我们还将了解发展计划如何与绩效管理、校准、持续绩效管理、继任和职业工作表集成。最后，我们将以最终用户的身份端到端地体验发展计划流程。在本章之后，我们将深入探讨\
  \ CDP 的其他功能：职业工作表、职业发展路径和导师制。\n\n## 目标计划 vs. 发展计划\n\n在本章的学习过程中，我们会发现目标计划和发展计划具有相似的模板、权限和功能。在开始之前，我们将回顾这两种计划类型的共性与差异。最佳实践是仅维护一个目标计划模板和一个发展计划模板。\n\
  \n发展计划在许多方面与目标计划类似：\n\n- 结构相似，具有相同的外观和感受\n- 计划访问权限基于角色\n- 使用计划模板 XML 来标识权限角色可以查看和操作的内容\n\
  - 可链接到持续绩效管理（CPM）中的活动和成就\n- 可出现在绩效评估表中\n- 可配置为从其他目标计划复制目标\n\n发展计划在以下方面与目标计划不同：\n\
  \n- 无法访问目标库。\n- 发展目标可链接到能力。\n- 发展目标可链接到学习活动。\n- 发展目标可链接到职业工作表中的能力。\n- 发展计划是持续性的，不受年限限制。\n\
  - 不能级联或对齐发展目标。\n- 发展计划通常是私密的，仅员工及其经理层级可访问。\n\n## 发展计划的基本配置\n\n在本节中，我们将涵盖从头到尾配置基本发展计划所需的所有步骤。结果将是一个简单的计划，用户可访问该计划来创建和管理发展目标。正如第\
  \ 1 卷第 4 章中讨论的目标计划，这种类型的计划是在与真实客户进行首次迭代评审时的良好开端。\n\n我们将使用发展计划 V12，这是最新的 UI 版本，并利用了\
  \ Fiori 设计标准。并且，要使用当前版本的职业工作表（v12）和职业发展路径（v2），此最新版本是必需的。\n\n### Provisioning 配置前提条件\n\
  \n在配置发展目标计划之前，需要在 Provisioning 中执行一些初步步骤。\n\n\n\n### 启用职业发展计划\n\n我们将从编辑配置设置开始，使职业发展计划屏幕和权限在\
  \ SAP SuccessFactors 中可用。登录到配置界面，选择相应的公司 ID。然后进入公司设置进行更新。要使用职业发展计划模块及其功能，必须启用一些底层功能。\n\
  \n我们首先确认以下列出设置已启用：\n\n- 版本 12 用户界面框架 (Revolution)\n- 启用通用对象\n- 启用附件管理器\n- 基于角色的权限\n\
  - JDM v2.0/技能管理\n- SuccessFactors 2.1 能力库\n- LMS（可选）\n\n确认后，我们将启用相关功能，使职业发展计划模块可用。在公司设置的“目标框架”部分，找到“职业与发展计划”，如图\
  \ 1-1 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig1_HTML.jpg](img/510611_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n职业与发展计划权限\n\n我们建议启用 `CDP Full (Development Plan)` 以访问职业发展计划的完整版本，其中包括发展计划、职业工作表和职业路径。即使你不使用职业工作表和职业路径，`CDP\
  \ Full` 也允许进行发展计划自定义，并链接到 SAP SuccessFactors 学习模块。\n\n表 1-1 详细说明了目标框架中可用的职业与发展计划选项。\n\
  \n表 1-1\n\n职业与发展计划设置\n\n| 选项 | 说明 |\n| --- | --- |\n| `CDP Full (Development Plan)`\
  \ | 启用具有学习活动集成功能的开发目标 V11。 |\n| `Enable Development Plan V12` | 启用开发目标 V12，还必须启用\
  \ `CDP Full`。 |\n| `Career Worksheet` | 启用职业工作表 V11，还必须启用 `CDP Full`。 |\n| `Career\
  \ Worksheet V12` | 启用职业工作表 V12，还必须启用 `CDP Full`。 |\n| `Enable Career Path V2` |\
  \ 启用职业路径 V2，还必须启用 `Career Worksheet V12`。 |\n| `Enable Mentoring Program` | 启用导师计划。\
  \ |\n| `Transcript` | 仅在与 SAP SuccessFactors 学习模块集成时启用。 |\n| `Use default value\
  \ for required field validation` | 请勿使用。 |\n| `Enable Add Learning Activity Manually`\
  \ | 允许用户手动为开发目标添加学习活动；同时还需启用 `Transcript`。 |\n\n我们将在后续章节中介绍职业工作表、职业路径和导师计划的权限及功能。\n\
  \n### 启用学习活动\n\nSAP SuccessFactors 学习模块 (LMS) 可与 CDP 集成。可以配置发展计划，允许用户向开发目标添加学习活动，并跟踪为达成目标所进行的操作和培训。启用后，用户可以直接从\
  \ LMS 学习目录中添加学习活动。用户也可以手动向开发目标添加自定义学习活动。\n\n为了与学习模块集成，目标框架中“职业与发展计划”部分内的以下功能可以启用，如图\
  \ 1-2 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig2_HTML.jpg](img/510611_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\n用于 CDP 集成的 LMS 相关权限\n\n要允许向开发目标手动添加学习活动，请启用以下选项：\n\n- `Transcript`\n\
  - `Enable Add Learning Activity Manually`\n\n### 启用开发目标复制\n\n在目标框架下还有一个设置，如果你希望允许用户从其他发展计划复制开发目标，可以启用它。这与目标计划中的功能相同。为此，请启用\
  \ `TGM/CDP Goal Transfer Wizard`，如图 1-3 所示。由于发展计划可能跨越数年，此功能可能不太实用。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig3_HTML.jpg](img/510611_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\n从其他计划复制开发目标的选项\n\n### 启用开发目标的即席报表\n\n为了作为管理员或用户对职业发展数据进行即席报表，请在**公司设置**中启用以下选项：\n\
  \n- 分析与仪表板选项卡及杂项报表 ➤ 其他即席子域架构配置 ➤ 开发目标\n- 分析与仪表板选项卡及杂项报表 ➤ 在人员选择器中启用“从用户开始包含” ➤\
  \ 开发目标\n\n### 启用学习活动的即席报表\n\n如果你将开发目标链接到学习活动，并希望对学习活动数据进行即席报表，请启用以下选项：\n\n- 分析与仪表板选项卡及杂项报表\
  \ ➤ 其他即席子域架构配置 ➤ 学习活动\n- 分析与仪表板选项卡及杂项报表 ➤ 在人员选择器中启用“从用户开始包含” ➤ 学习活动\n\n### 配置更新摘要\n\
  \n以下是我们已启用的功能摘要。\n\n发展计划：\n\n- 目标框架 ➤ 职业与发展计划 ➤ `CDP Full (Development Plan)`\n\
  - 目标框架 ➤ 职业与发展计划 ➤ `Development Plan V12`\n\n链接到学习活动的开发目标（可选）：\n\n- 目标框架 ➤ 职业与发展计划\
  \ ➤ `Transcript`\n- 目标框架 ➤ 职业与发展计划 ➤ `Enable Add Learning Activity Manually`\n\n\
  从其他发展计划复制开发目标（可选）：\n\n- 目标框架 ➤ `TGM/CDP Goal Transfer Wizard`\n\n开发目标即席报表（可选）：\n\
  \n- 分析与仪表板选项卡及杂项报表 ➤ 其他即席子域架构配置 ➤ 开发目标\n- 分析与仪表板选项卡及杂项报表 ➤ 在人员选择器中启用“从用户开始包含” ➤\
  \ 开发目标\n\n学习活动即席报表（可选）：\n\n- 分析与仪表板选项卡及杂项报表 ➤ 其他即席子域架构配置 ➤ 学习活动\n- 分析与仪表板选项卡及杂项报表\
  \ ➤ 在人员选择器中启用“从用户开始包含” ➤ 学习活动\n\n保存新功能后，退出公司设置，返回配置主屏幕，然后注销。\n\n\n\n### 分配配置和管理职业发展计划的权限\n\
  \n现在，我们将进入实例，分配基于角色的权限，使您能够配置和管理职业发展计划模块。发展计划的权限设置方式与目标计划权限类似。有关如何分配权限的问题，请参阅第一卷第\
  \ 4 章中详细说明编辑权限角色步骤的内容。\n\n要分配管理员角色权限，请前往操作搜索栏，输入并选择`Manage Permission Roles`。找到您要修改的管理员角色，将其打开，然后单击`Permission...`：在左侧的“管理员权限”下，单击`Manage\
  \ Career Development`；然后勾选`Development Admin`旁边的复选框，如图 1-4 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig4_HTML.jpg](img/510611_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4：管理职业发展权限\n\n现在，管理员角色可以管理职业发展计划的功能。\n\n表 1-2 描述了可用的`Manage Career Development`权限。\n\
  \n**表 1-2：管理职业发展权限摘要**\n\n| 权限 | 描述 |\n| --- | --- |\n| `Development Admin` | 管理所有发展计划设置。\
  \ |\n| `Manage Career Path` | 定义和管理职业路径。 |\n| `Configure Career Path Node` | 定义职业路径内节点上显示的内容；仅适用于职业路径\
  \ V2。 |\n| `Manage Suggested Roles` | 配置建议角色设置。 |\n| `Manage Mentoring Programs`\
  \ | 管理辅导计划。 |\n| `Admin Career Development Plan Export Data` | 通过数据主体信息导出职业发展计划数据。\
  \ |\n\n此外，授予管理员权限，使其能够使用以下路径运行全公司范围的发展报告：\n\n- 用户权限 ➤ 报告权限 ➤ 创建报告 ➤ 发展目标\n- 用户权限\
  \ ➤ 报告权限 ➤ 运行报告 ➤ 发展目标\n\n如果使用学习活动并希望对其进行报告，请同时添加以下访问权限：\n\n- 用户权限 ➤ 报告权限 ➤ 创建报告\
  \ ➤ 学习活动\n- 用户权限 ➤ 报告权限 ➤ 运行报告 ➤ 学习活动\n\n如果计划使用标准发展计划或自定义磁贴/仪表板，则还需要这些权限。可以通过以下路径找到它们：\n\
  \n- 用户权限 ➤ 报告权限 ➤ 分析磁贴和仪表板\n\n### 发展目标管理的主要配置\n\n现在我们已经激活了职业发展计划模块，并且拥有所需屏幕的权限来进行配置，让我们开始吧！本节将引导您完成配置简单发展计划的基本步骤，并介绍修改主要模板和管理流程的屏幕。\n\
  \n#### 发展模板配置\n\n在这里，我们将了解如何创建和编辑发展模板。职业发展计划中的发展计划模板配置，大部分依赖于目标管理中所用的相同模板配置选项。任何差异都会注明。\n\
  \n发展模板通常被称为发展或职业发展计划。与每年创建的目标计划不同，发展计划可能跨越多年。建议在您的实例中使用一个发展计划。在使用职业工作表时，这一点尤其重要，因为它只能链接到单个职业发展计划模板。我们将在下一章详细介绍此功能。\n\
  \n在我们的示例中，我们将使用`Manage Templates`在线编辑器屏幕。发展计划模板的某些功能无法在在线编辑器中编辑，必须直接在发展计划模板的基础 XML\
  \ 中进行编辑，然后通过 Provisioning 上传到系统中。我们将在本章后面介绍此过程。首先，请按照以下步骤操作。\n\n在搜索栏中，输入并选择`Manage\
  \ Templates`。屏幕上将出现多个标签页，代表各种模板类型。单击`Development`标签页以查看任何发展模板，如图 1-5 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig5_HTML.jpg](img/510611_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5：发展模板的“管理模板”视图\n\n让我们来看看此屏幕上的功能。列标题与“目标计划”标签页中的相同。\n\n- **仅显示有效模板：** 勾选后，无效模板将不会显示在列表中。员工或绩效表单也将无法访问无效计划。\n\
  - **添加新模板：** 从 SuccessStore 下载模板，作为构建计划时的起点。\n- **默认模板：** 确定哪个计划是默认计划。这是用户访问“发展”时看到的发展计划。\n\
  - **排序顺序：** 对于有效计划，显示计划在用户下拉列表中的列出顺序。\n- **有效：** 可供使用。如果允许，用户将有权访问该计划。\n- **更新于：**\
  \ 模板上次修改的时间。\n- **日期范围：** 计划的时间框架。\n\n现在让我们创建一个模板。发展计划无法从头开始创建。它必须从 SuccessStore\
  \ 中的模板创建，或从现有发展计划复制：\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig6_HTML.jpg](img/510611_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6：从 SuccessStore 添加模板\n\n1.  单击`Add A New Template`。在弹出的窗口中，从 SuccessStore\
  \ 选择一个发展计划模板。这将是一个供您编辑的入门模板。选择一个计划，然后单击`Add to my Instance`，如图 1-6 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig7_HTML.jpg](img/510611_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7：命名新的发展计划模板\n\n2.  系统将提示您命名模板，如图 1-7 所示。为您的模板输入一个名称，例如`Career Development\
  \ Plan`，然后单击`Save`。\n\n命名并保存后，在线编辑器将出现，如图 1-8 所示，显示模板的预览页面。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig8_HTML.jpg](img/510611_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8：发展计划编辑器预览\n\n在开始编辑模板之前，让我们回顾一下其各个部分：\n\n- **预览：** 仅查看。提供计划向用户呈现方式的概览。字段的布局并非表单在屏幕上显示方式的\
  \ 100% 真实呈现。\n\n\n\n- **常规设置：** 用于编辑计划的顶部区域：计划名称、简介和计划日期。\n- **编辑类别：** 用于创建、编辑和删除发展目标类别。可以重新排序和重新命名。\n\
  - **编辑字段：** 用于创建、编辑和删除发展目标计划字段。\n\n现在，我们来逐步了解修改模板的步骤。请注意，此过程与编辑目标计划完全相同：\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig9_HTML.jpg](img/510611_1_En_1_Fig9_HTML.jpg)\n\
  \n**图 1-9** — 发展计划模板的常规设置\n\n1.  点击左侧面板上的“常规设置”。屏幕将更新为如图 1-9 所示的常规设置页面。首先，请确保你在屏幕顶部的“更改语言”下拉菜单中选择了默认语言。如果你正在执行全局部署，可以从下拉菜单中选择一种语言来提供所需的翻译。\n\
  \n    **注意**\n\n    我们建议始终使用在线编辑器每个页面上的默认语言来配置表单。这将自动为你系统中处于活动状态的其他语言填充值（如果你需要编辑可用语言，可以在“公司设置”下的“配置”中激活它们）。如果你仅使用美国英语\
  \ (`en_US`) 并填写所有美国英语的默认值，则根本无需更改语言。\n\n2.  根据需要，使用`名称`字段更改你的发展计划的标题。\n3.  在“给用户的说明”字段中输入你希望提供的任何说明。\n\
  \n    **注意**\n\n    我们发现一些客户喜欢提供指向技术帮助文档和政策文档的链接，以便为创建发展目标提供背景信息。\n\n4.  输入开始和结束日期。\n\
  \n    **注意**\n\n    发展目标与绩效目标不同，通常跨越多年，因此不要使用日历年或财年作为计划的开始和结束日期。\n\n5.  如果需要，请勾选“在发展目标计划上显示连续绩效管理成就”旁边的复选框。这将在发展目标计划中添加一列，显示与该目标相关的任何\
  \ CPM 成就。\n\n    **注意**\n\n    我们建议使用此功能，因为它有助于提醒用户他们的成就。你必须已实施连续绩效管理 (CPM) 才能使此功能生效。更多详细信息，请参阅第\
  \ 1 卷第 13 章。\n\n现在，我们将继续讲解模板的“编辑类别”部分：\n\n1.  点击“编辑类别”。这将展开该部分以显示你下载的模板附带的标准类别。与目标计划模板不同，这里只有一个标准类别。但是，你可以根据需要添加其他类别。\n\
  \    1.  要添加类别，请点击“添加新类别”，该类别将出现在列表中。\n2.  要编辑类别的名称，请点击该类别，并在右侧出现的字段中（在选择语言后）输入类别的新名称。\n\
  3.  要删除类别，请点击垃圾桶图标。\n\n    **注意**\n\n    我们不建议在最终用户开始使用表单后删除类别，因为这可能会损坏数据！\n\n接下来，我们将审查模板的“编辑字段”部分。\n\
  \n点击“编辑字段”。该区域将展开，显示你从 SuccessStore 下载的模板中包含的字段，如图 1-10 所示。你可以将鼠标悬停在一个字段上并点击垃圾桶图标来删除它。你可以拖放字段来更改它们出现在发展目标计划中的顺序。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig10_HTML.jpg](img/510611_1_En_1_Fig10_HTML.jpg)\n\
  \n**图 1-10** — 编辑字段\n\n点击现有字段进行编辑。编辑字段时，请编辑标签（请务必先选择你需要的语言）并指明该字段是否为必填项。如果你希望此字段显示在“人员资料”模块中，也请勾选相应的复选框。有关此模块的更多信息，请参阅第\
  \ 1 卷第 2 章；要参考标准字段和选项以及自定义字段和类型的表格，请参阅第 1 卷第 4 章。当你向计划添加新字段时，出现的唯一选项是能力、目的和自定义字段，如图\
  \ 1-11 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig11_HTML.jpg](img/510611_1_En_1_Fig11_HTML.jpg)\n\
  \n**图 1-11** — 向发展计划添加字段\n\n请参考表 1-3，了解可能添加到模板中的、特定于发展目标的其他字段。\n\n**表 1-3** — 要添加到计划中的发展字段\n\
  \n| 技术字段名 | 字段类型 | 描述 | 配置选项 |\n| --- | --- | --- | --- |\n| `competency` | 能力 |\
  \ 用于将发展目标与你能力库中的一个或多个能力相关联。只能关联在当前登录区域设置中已定义的能力。如果某个能力仅以英语定义，并且用户使用其他语言登录系统，则该能力无法用于关联。\
  \ | 标签, 必填字段, 在人员资料模块中显示 |\n| `purpose` | 枚举 | 下拉列表，列出“当前角色”、“未来角色”或“通用技能集”等选项。\
  \ | 标签, 必填字段, 在人员资料模块中显示 |\n\n要向计划添加其他字段，请点击“添加新字段”。向计划添加字段的示例如图 1-12 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig12_HTML.jpg](img/510611_1_En_1_Fig12_HTML.jpg)\n\
  \n**图 1-12** — 向发展目标计划添加字段\n\n在上面的示例中，除了自定义字段外，还可以添加一些标准字段。如果你计划允许用户将发展目标与能力关联起来，则需要一个能力库，并且必须将`competency`字段添加到计划中。能力可以识别和传达关于执行某项工作所期望的行为的信息。能力很重要，因为它们可以用于绩效管理、职业发展、薪酬、继任管理、360\
  \ 度调查、招聘和劳动力规划。能力被映射到职位角色，并且可以作为员工发展路径的一部分。\n\n这是可选的、添加到发展计划的字段。但是，如果你计划实施职业工作表，则能力库是必需的。我们建议你使用\
  \ SuccessFactors 2.1 能力库，因为它包含相关的导语、调优和行为。可以修改此库，或者你也可以创建自己的能力库进行导入。\n\n你可以添加的另一个标准字段是`目的`。它使用如图\
  \ 1-13 所示的列表。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig13_HTML.jpg](img/510611_1_En_1_Fig13_HTML.jpg)\n\
  \n**图 1-13** — 带有下拉选项的“目的”字段视图\n\n对于`目的`，你可以添加或删除下拉选项，更改排序顺序，重命名标签，或更改每个标签的文本和背景颜色。点击“添加新值”可以为该字段创建一个新值。\n\
  \n发展与目标计划类似，也可以使用自定义字段。最好在此处添加自定义字段，而不是直接将其添加到发展计划 XML 中。\n\n命名自定义字段、提供自定义字段 ID\
  \ 和标签、并指明字段类型后，保存你的更新。\n\n\n\n其余标准字段（同样可用于目标计划）在尝试添加新字段时可能不会显示。因此，这些字段需要添加到我们即将介绍的发展计划模板\
  \ XML 中。\n\n恭喜！你现在已经配置好了自己的发展计划！该模板可以使用多种可添加、移除和配置的字段来记录发展目标数据，以满足组织的需求。我们还向你展示了哪些字段可用于与胜任力及持续绩效管理进行集成。\n\
  \n#### 电子邮件通知\n\n第一卷第四章 4 中讨论的目标电子邮件通知同样适用于发展目标。这些通知可用于目标的创建、删除、修改以及目标评论，如图 1-14\
  \ 所示。请参考第一卷第四章 4 回顾目标计划通知描述列表及其启用流程。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig14_HTML.jpg](img/510611_1_En_1_Fig14_HTML.jpg)\n\
  \n图 1-14 “电子邮件通知模板” 界面\n\n可以控制哪些目标计划发送通知。这意味着你可以开启任意目标计划的通知，但仅针对特定目标计划发送。你可能希望当目标添加到用户的目标计划时发送通知，但发展目标添加到其发展计划时不发送。当某个通知启用后，点击其名称，你会在屏幕右侧看到通知详情。你将看到一个链接`Customize\
  \ Settings for Goal Plans`，如图 1-15 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig15_HTML.jpg](img/510611_1_En_1_Fig15_HTML.jpg)\n\
  \n图 1-15 定制目标计划设置\n\n点击该链接可查看该通知可用的所有活跃目标计划和发展计划。取消勾选计划以禁用其通知。任何仍处于勾选状态的计划都将生成一封电子邮件。示例如图\
  \ 1-16 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig16_HTML.jpg](img/510611_1_En_1_Fig16_HTML.jpg)\n\
  \n图 1-16 为电子邮件通知选择目标计划\n\n### 启用移动端职业发展规划\n\n发展计划可在移动应用（iOS 和 Android）上访问。与移动端目标计划类似，移动端发展目标计划可以被查看和编辑。也可以添加发展目标。\n\
  \n注意：由于移动应用本身较为简单，我们不会介绍如何使用该应用。你可以前往 Apple App Store 或 Android Market 搜索`SuccessFactors`下载该应用。下载完成后，你可以点击右上角的`Demo`浏览应用。如果你希望将应用与实例上的特定用户关联以使用真实数据，你需要完成屏幕上的注册流程。要查看支持和不支持的功能列表，请参考\
  \ SAP 说明 #2475032。\n\n要启用移动端功能，请遵循以下步骤：\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig17_HTML.jpg](img/510611_1_En_1_Fig17_HTML.jpg)\n\
  \n图 1-17 在移动端设置中激活职业发展规划\n\n1.  在搜索栏中输入并选择`Enable Mobile Features`。将显示`移动端设置`界面。\n\
  2.  点击左侧的`模块`。然后点击`职业发展规划`旁边的复选框，如图 1-17 所示。更改将立即生效。\n\n现在，我们已经创建了一个发展计划，并了解了如何启用电子邮件通知以及如何为发展目标开启移动端功能。\n\
  \n## 为最终用户分配发展计划权限\n\n在我们通过编辑计划模板 XML 进一步配置发展计划之前，我们可以先在测试实例中向最终用户（例如，仅一个测试用户）分配权限，以便我们能够看到\
  \ XML 配置的结果并根据需要进行故障排除。\n\n为最终用户设置基于角色的权限，其步骤与为管理员角色设置相同。最终用户权限与目标计划权限类似。你可以参考第一卷第四章\
  \ 4 回顾关于最终用户角色和目标角色的讨论。\n\n有两种权限类型控制对职业发展计划的访问：\n\n1.  访问`发展`模块中的`发展计划`标签页\n2. \
  \ 访问针对特定目标人群的发展计划模板\n\n我们现在将修改员工、经理和人力资源经理角色的基于角色的权限。我们将为`职业发展`设置权限，以确定每个角色可以访问哪些用户的计划。这些角色需要针对特定发展计划拥有`职业发展计划（CDP）访问权限`和`目标计划权限`。这样每个角色才能访问`职业发展`标签页并获得访问特定发展计划的权限。这些权限角色之间的区别在于这些角色上定义的授权人群和目标人群，这将决定他们可以看到谁的计划。我们还将为经理和人力资源经理角色指出额外的权限。\n\
  \n### 访问发展标签页\n\n在`管理权限角色`中，打开你想要编辑的角色。在设置的`用户权限`部分，点击弹出窗口左侧的`职业发展规划`，然后点击`职业发展计划（CDP）访问权限`旁边的复选框。这将授予该角色访问`发展`标签页的权限。该权限如图\
  \ 1-18 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig18_HTML.jpg](img/510611_1_En_1_Fig18_HTML.jpg)\n\
  \n图 1-18 访问发展标签页\n\n### 访问发展计划\n\n接下来，授予权限以便角色可以访问特定的发展计划。同样在`用户权限`下，点击左侧的`目标`。在这里，你需要授予对`目标计划权限`下的`职业发展计划`的访问权限，如图\
  \ 1-19 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig19_HTML.jpg](img/510611_1_En_1_Fig19_HTML.jpg)\n\
  \n图 1-19 职业发展计划访问权限\n\n如果用户拥有学习访问权限，则可以在发展目标中添加学习活动。这需要额外的一项目标计划权限以允许用户访问并查看和添加学习活动到发展目标中。该角色将需要访问`学习活动列表/详细信息视图`模板，如图\
  \ 1-20 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig20_HTML.jpg](img/510611_1_En_1_Fig20_HTML.jpg)\n\
  \n图 1-20 学习活动列表/详细信息视图权限\n\n如果该角色已经拥有 CPM 权限，并且你希望在发展计划上显示 CPM 成就，请在`目标`下添加`访问持续绩效管理数据`。发展计划、`学习活动列表/详细信息视图`模板以及\
  \ CPM 数据访问的权限如图 1-21 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig21_HTML.jpg](img/510611_1_En_1_Fig21_HTML.jpg)\n\
  \n图 1-21 发展计划和 CPM 访问权限\n\n\n\n### 基于角色的学习权限\n\n如果用户能够将学习活动添加到其发展计划中，他们将需要访问`Learning\
  \ Activity List/Detail View`模板 XML 中定义的学习活动内容。我们尚未讨论此模板，但需要为与职业发展权限相同的角色（员工、经理和\
  \ HR 经理角色）更新基于角色的权限。只有当用户在`Learning Activity List/Detail View`模板 XML 中定义了学习访问权限时，他们才能添加或查看与某个发展目标关联的学习活动。\n\
  \n### 经理和 HR 经理报告的角色权限\n\n为了允许经理和 HR 经理运行关于发展计划及相关学习活动数据的报告，权限角色需要增加以下内容：\n\n- \
  \  `用户权限 ➤ 报告权限 ➤ 创建报告 ➤ 发展目标`\n-   `用户权限 ➤ 报告权限 ➤ 运行报告 ➤ 发展目标`\n\n如果使用学习活动并希望针对其生成报告，请添加以下内容：\n\
  \n-   `用户权限 ➤ 报告权限 ➤ 创建报告 ➤ 学习活动`\n-   `用户权限 ➤ 报告权限 ➤ 运行报告 ➤ 学习活动`\n\n如果计划使用标准发展计划或自定义磁贴/仪表板，则这些权限也是必需的。它们可以通过以下路径找到：\n\
  \n-   `用户权限 ➤ 报告权限 ➤ 分析磁贴和仪表板`\n\n### 查看他人计划的角色权限\n\n需要将允许访问任何人计划的基于角色的权限，添加到用于员工搜索的权限角色中，该角色允许`组织架构导航权限`、`公司信息访问权限`和`用户搜索`，如图\
  \ 1-22 所示。我们将在本章下一节讨论在发展规划模板 XML 中定义的相应权限。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig22_HTML.jpg](img/510611_1_En_1_Fig22_HTML.jpg)\n\
  \n图 1-22 允许用户搜索的权限\n\n此权限授予“所有人”，目标人群为“所有人”，如图 1-23 所示。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig23_HTML.jpg](img/510611_1_En_1_Fig23_HTML.jpg)\n\
  \n图 1-23 姓名搜索的目标人群\n\n如果您添加对“发展”选项卡（`职业发展计划 (CDP) 访问权限`）和发展计划（`目标计划权限 ➤ 职业发展计划`）的访问权限，这将允许任何用户查看任何人的发展目标计划及其内容。\n\
  \n这些是员工、经理和 HR 经理角色所需的权限。区别在于目标人群。员工通常被授予“自己”的访问权限，这意味着他们只能查看和编辑自己的发展目标计划。经理通常可以访问其直接下属，您还可以选择经理希望向下访问多少个层级。HR\
  \ 经理角色则可以访问他们的 HR 报告。\n\n需要重申的是，发展目标计划权限必须指定一个目标人群。这意味着，您需要识别该角色有权访问的计划（目标计划权限），然后识别他们可以查看谁的计划（目标人群）。\n\
  \n表 1-4 标识了哪些用户被授予了查看目标人群的权限。\n\n表 1-4 角色与目标人群\n\n| 角色 | 授予权限的权限组或用户 | 目标人群 |\n\
  | --- | --- | --- |\n| 员工 | 员工 | 被授予用户（自己） |\n| 经理 | 经理 | 被授予用户的直接下属；指定级别并排除自己 |\n\
  | HR 经理 | HR 经理 | 被授予用户的 HR 报告；指定级别并排除自己 |\n\n## 需要 XML 配置的基本发展计划功能\n\n我们现在已经构建了一个基本的发展计划，并授予了员工、经理和\
  \ HR 经理权限角色的访问权限。现在我们可以查看发展规划模板 XML 配置。\n\n正如我们刚才所看到的，基于角色的权限定义了用户可以访问哪种类型的计划以及可以查看哪些用户的计划。正如我们接下来将要看到的，对发展计划内容和操作的访问受到发展规划模板\
  \ XML 中定义的权限的限制。\n\n模板权限标识了哪些角色可以执行某些任务，例如创建发展目标、删除发展目标和编辑发展目标。字段权限标识了一个角色可以查看或编辑哪些发展目标计划字段。对发展计划内容和操作的访问受到发展规划模板\
  \ XML 中定义的权限的限制。\n\n### 下载、编辑和上传 XML\n\n当您使用本章前面部分所示的在线工具创建发展计划模板时，会自动生成一个 XML。有些修改无法在在线工具中完成，因此我们需要编辑\
  \ XML。您可以导出职业发展计划模板 XML，以更新那些无法通过 UI 中的`管理模板`进行的字段，特别是与属性和权限相关的字段。您还可以添加实例中基本模板不可用的标准字段。这还需要为这些字段授予“读取”和“写入”权限，并将这些字段添加到计划布局中，以便它们能显示在计划上。\n\
  \n在我们进行编辑之前，我们需要从 Provisioning 下载发展计划模板 XML。计划模板位于`管理计划模板`下，如图 1-24 所示。在这里，您可以找到指向各种模板的链接。我们将处理发展计划模板。\n\
  \n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig24_HTML.jpg](img/510611_1_En_1_Fig24_HTML.jpg)\n\
  \n图 1-24 Provisioning 中的计划模板\n\n点击链接“导入/更新/导出发展计划模板”。在 图 1-25 中，您将看到一个可以下载和上传发展计划模板\
  \ XML 的界面。\n\n![../images/510611_1_En_1_Chapter/510611_1_En_1_Fig25_HTML.jpg](img/510611_1_En_1_Fig25_HTML.jpg)\n\
  \n图 1-25 发展计划模板界面\n\n在这里，您会看到您实例中的职业发展计划模板。找到您在实例中创建的发展计划模板。如下图所示，点击导出列下方的图标。您的网页浏览器会将文件下载到您的本地机器上。我们将进行任何必要的编辑，然后上传修改后的\
  \ XML。\n\n现在让我们查看一下 XML，以更好地理解其内容和运作方式。发展目标计划与目标计划类似，但存在以下差异：\n\n-   发展计划是持续进行的，不限于一年周期。\n\
  -   发展目标模板 ID 必须介于 2001 到 2999 之间。\n-   `obj-plan-type` 应为“Development”。\n-   发展目标可以与能力关联。\n\
  -   学习活动可以与发展目标关联，使用学习目录或自定义活动。\n-   您不能将目标库包含在发展计划中。\n-   您不能级联和对齐发展目标。\n\n###\
  \ 发展计划模板 XML\n\n发展计划模板使用了与目标计划模板相同的大部分模板配置选项。在本节中，我们简要介绍与目标计划 XML 中相同的部分。请参考第 1\
  \ 卷第 4 章，了解标准字段和选项以及自定义字段类型和配置选项。特别适用于发展计划的配置选项将详细说明。\n\n\n\n#### 模板属性更新\n\n`<*obj-plan-template*>`标签是\
  \ XML 结构中最高级别的标签。它定义了一系列可以开启、关闭或调整的选项，用于启用/禁用功能或进行调整。这些选项与目标计划 XML 中的选项相同。\n\n以下是一个示例代码片段：\n\
  \n```\n请参考第 4 卷第 4 章 4 中的表 4-4，其中详细说明了`<*obj-plan-template*>`属性。\n```\n\n有两个值得注意的属性涉及隐私：\n\
  \n1. `new-obj-share-status-public`：当为`true`时，所有目标默认为公开。\n2. `use-text-for-privacy`：当为`true`时，在计划图标的“可见性”列中显示文本（private,\
  \ public）；当为`false`时，使用图标（眼镜）来指示目标是否为私密。目标计划和发展计划中的“可见性”列可能包含图标或文本。\n\n表 1-5 包含部分发展计划模板\
  \ XML，其中某些功能已标注并附有简要说明。我们稍后将深入探讨。\n\n**表 1-5 对象元素说明**\n\n| 元素 | 说明 | 代码 |\n| ---\
  \ | --- | --- |\n| `obj-plan-id` | 发展目标计划的唯一数字标识符。取值范围必须在 2001-2999 之间。 | `<obj-plan-id>2001</obj-plan-id>`\
  \ |\n| `obj-plan-type` | 定义计划类型：目标计划、发展计划、学习活动或职业工作表。 | `<obj-plan-type>Development</obj-plan-type>`\
  \ |\n| `obj-plan-name` | 使用面向最终用户的在线工具设置的目标计划标题。第一行定义了默认值。您可以在其下方为实例中的每个活动区域设置名称。\
  \ | `<obj-plan-name>Career Development Plan</obj-plan-name>` |\n| `obj-plan-desc`\
  \ | 该描述仅对在 XML 或在线工具中配置发展计划的人员显示。当您在在线工具中保存或在 Provisioning 中上传 XML 时，`lastmodified`会自动更新。\
  \ | `<obj-plan-desc><![CDATA[ Career Development Plan]]></obj-plan-desc>` |\n| `obj-plan-lastmodified`\
  \ | 最后修改时间仅对在 XML 或在线工具中配置发展计划的人员显示。最后修改时间会在您于在线工具中保存或在 Provisioning 中上传 XML 时自动更新。\
