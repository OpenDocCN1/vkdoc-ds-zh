  \n图 2-9 职业工作表模板字段及其来源概览\n\n除了在 XML 中定义模板字段外，您还需要确定哪个（些）角色具有这些字段的可见性。`Write`权限在工作表中不受支持，因此您只需要定义`Read`权限。标准模板权限可能已经非常接近您的需求。只需根据您组织的特定权限进行任何修改即可。\n\
  \n以下是一些需要考虑的事项：\n\n\n\n# 职业工作表字段的基于角色的权限\n\n基于角色的职业工作表权限不适用于目标人群。如果用户有权访问职业工作表，则该用户将能够根据“用户搜索”权限搜索其他员工。这意味着用户在自己的职业工作表中可以通过名称搜索来访问其他员工的工作表。为防止这种情况，请在“职业工作表”模板\
  \ XML 中，仅向应能查看员工职业工作表的角色授予“读取”权限。\n\n“读取”权限只应授予那些应能查看任何员工职业工作表的角色，例如员工本人、经理和人力资源经理。\n\
  \n以下示例代码列出了应用于这些字段的权限：\n\n由于继任规划人员通常与他们提名的继任者没有任何关系，因此建议允许所有角色（`*`）对 `“readiness_meter”`\
  \ 字段具有可见性。如下所示为一个示例代码片段：\n\n如下面的示例代码片段所示，任何人都不应能写入任何职业工作表的字段：\n\n## 为目标职位角色能力添加发展目标\n\
  \n如果您允许用户为目标职位角色或当前职位角色能力添加发展目标，则 `“development_goal”` 字段必须包含在具有“读取”权限的字段定义中。发展计划也必须定义了能力字段。\n\
  \n在“职业工作表”模板 XML 中包含 `development_goal` 字段还会启用每个角色能力所显示的发展目标数量，如图 2-10 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig10_HTML.jpg](img/510611_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10：为能力添加发展目标\n\n加号图标允许员工为能力添加发展目标。员工可以创建一个与需要加强的能力相关联的发展目标。为此，发展计划模板必须包含具有创建目标能力权限的能力字段。在工作表上为能力添加的任何发展目标随后都会与该能力一起显示在发展计划上。\n\
  \n默认情况下，用户对发展目标的“读取”和“写入”权限是从发展计划模板配置中继承的。您必须确保所有可以查看用户职业工作表的角色，在发展计划 XML 中也具有发展目标字段的“读取”权限。没有此权限，角色将无法在职业工作表上看到发展目标。\n\
  \n也可以将发展目标链接到职业工作表上的行为，而不是使用能力。为此，必须将发展计划配置为在能力字段中使用行为。请参阅第 1 章了解更多信息。\n\n由于一个发展目标可以链接到多个能力，因此同一个发展目标在职业工作表中可能会被多次计算。并且同一个发展目标可以在多个职位角色中体现。\n\
  \n完成“职业工作表”模板 XML 更新后，请保存文件并在“配置”中的“管理计划模板”➤ “导入/更新/导出职业工作表模板”下导入该文件。\n\n## 配置“共享”权限和数据模型\n\
  \n我们讨论了“职业工作表”模板 XML 中的“共享”权限，该权限允许用户将目标角色标识为“人员配置文件”中的职业兴趣。为此，需要在“继任数据模型”中进行更新。我们需要在数据模型中添加\
  \ `“preferredNextMove”` 背景元素。返回“配置”以下载数据模型。\n\n在“继任管理”下，点击“导入/导出数据模型”链接，如图 2-11\
  \ 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig11_HTML.jpg](img/510611_1_En_2_Fig11_HTML.jpg)\n\
  \n图 2-11：配置公司设置中数据模型的位置\n\n下载数据模型文件，如图 2-12 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig12_HTML.jpg](img/510611_1_En_2_Fig12_HTML.jpg)\n\
  \n图 2-12：导入/导出数据模型界面\n\n在 XML 编辑器中打开该文件，查看 `“preferredNextMove”` 背景元素是否正在使用。如果它已存在于数据模型中，它可能包含几个不会从工作表填充到配置文件中的字段。\n\
  \n该背景元素的一个示例代码片段如下所示：\n\n```\n首选下一步行动\n首选下一步行动\n\n职位名称\n职位名称\n\n级别\n级别\n\n职能\n职能\n\
  \n时间框架\n时间框架\n\n备注\n备注\n```\n\n背景元素内需要定义一个“职位名称”数据字段。这是从职业工作表填充到“人员配置文件”中职业兴趣块的唯一字段。如果背景元素中包含其他字段，则在单击职业工作表上的复选框时，这些字段不会填充。这些字段在该块中将显示为空。额外的字段只有在用户在配置文件中添加时才会填充。但是，如果您允许用户更新配置文件中的该块，则可以在背景元素中包含额外的字段。就我们的目的而言，我们只使用职位名称字段。\n\
  \n无论哪种情况，都要确保职位名称是必填字段。如果此背景元素在数据模型中但未被使用，您可以删除任何其他数据字段，如代码片段示例所示。如果它不在数据模型中，您需要添加它，并且可以使用这个相同的版本。\n\
  \n该背景元素的一个示例代码片段如下所示：\n\n```\n首选下一步行动\n首选下一步行动\n\n职位名称\n职位名称\n```\n\n数据模型中还需要包含一个针对该背景元素的\
  \ `<element-template>`。一个示例代码元素如下所示：\n\n```\n首选下一步行动\n首选下一步行动\n职业目标.\n```\n\n如前所述，在讨论“职业工作表”模板\
  \ XML 中的操作权限时，必须至少为员工角色启用共享权限，以便将目标角色添加到其配置文件中。\n\n完成添加后，导入更新后的数据模型 XML。进入实例后，我们将审查此背景元素的基于角色的权限以及需要进行的“人员配置文件”更新。\n\
  \n## 总结\n\n我们现在已经在“配置”中启用了职业工作表和发展路径。我们已对“职业工作表”模板 XML 进行了更新，以定义功能、数据源、评分计算类型以及工作表中字段的操作权限。我们还更新了“继任数据模型”XML，以便在“人员配置文件”中显示目标角色。我们现在已准备好进入实例来设置基于角色的权限。\n\
  \n\n\n# 职业工作表和职业发展路径的基于角色的权限\n\n除了在`职业工作表`模板 XML 中设置的操作和读取权限外，还需要基于角色的权限，以授予用户访问职业发展模块中`职业工作表`选项卡以及职业工作表计划的权限。如果您决定使用职业发展路径、建议角色和角色就绪评估表单，这些功能同样需要基于角色的权限。我们的讨论将假设所有这些功能都会被使用，因为这样才能赋予`职业工作表`全部功能。\n\
  \n我们将从授予管理员配置和管理`职业工作表`各项功能的权限开始。在第 1 章中，我们讨论了负责管理所有职业发展相关功能的管理员角色。这可以是处理所有绩效管理事务的\
  \ HR 管理员角色，也可以是专门用于管理职业发展的管理员权限角色。您也可以考虑允许 HR 经理创建和管理职业发展路径。我们将在本章后面讨论 HR 经理角色的权限。\n\
  \n## 分配配置和管理职业工作表的权限\n\n前往`管理权限角色`，选择您要添加这些权限的管理员角色。在权限设置的`管理员权限`部分，找到`管理职业发展`，如图\
  \ 2-13 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig13_HTML.jpg](img/510611_1_En_2_Fig13_HTML.jpg)\n\
  \n**图 2-13** 管理职业发展权限\n\n根据上一章的讨论，`发展管理员`应该已经启用。现在我们正在添加`管理职业发展路径`、`配置职业发展路径节点`和`管理建议角色`的权限。\n\
  \n表 2-3 包含了`管理职业发展`权限。高亮显示的权限应添加到管理员角色中。\n\n**表 2-3** 管理职业发展权限\n\n| 权限 | 描述 |\n\
  |---|---|\n| `发展管理员` | 管理所有发展计划设置。 |\n| `管理职业发展路径` | 定义和管理职业发展路径。 |\n| `配置职业发展路径节点`\
  \ | 定义职业发展路径中节点显示的内容，仅适用于职业发展路径 V2。 |\n| `管理建议角色` | 配置建议角色设置。 |\n| `管理导师计划` | 管理导师计划。\
  \ |\n| `管理员职业发展计划数据导出` | 导出职业发展计划数据。 |\n\n我们需要添加在`职业发展计划`中的`用户权限`部分下找到的权限。图 2-14\
  \ 显示了此部分的权限。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig14_HTML.jpg](img/510611_1_En_2_Fig14_HTML.jpg)\n\
  \n**图 2-14** 职业发展计划权限\n\n管理员角色应该已经拥有`职业发展计划 (CDP) 访问权限`。现在我们将向该角色添加`职业工作表访问权限`和`职业工作表建议角色访问权限`。\n\
  \n表 2-4 突出显示了在`用户权限` ➤ `职业发展计划`内需要授予的额外权限。\n\n**表 2-4** 职业发展计划用户权限摘要\n\n| 权限 | 描述\
  \ |\n|---|---|\n| `导师计划访问权限` | 访问发展模块中的“导师”选项卡。 |\n| `职业发展计划 (CDP) 访问权限` | 访问发展模块。\
  \ |\n| `职业工作表访问权限` | 访问发展模块中的“职业工作表”选项卡。 |\n| `职业工作表建议角色访问权限` | 访问发展模块职业工作表中的“建议角色”。\
  \ |\n| `推荐继任者` | 允许访问继任组织图中的“推荐继任者”部分。 |\n\n如果管理员将要创建或运行关于职业工作表相关数据的临时报告，则需要创建和运行这些报告的权限。\n\
  \n前往位于`用户权限`部分的`报告权限`，并启用以下选项：\n\n- `创建报告` ➤ `职业工作表目标角色`\n- `运行报告` ➤ `职业工作表目标角色`\n\
  \n该角色还需要访问`CDP 仪表板`。同样在`报告权限`下，找到`分析磁贴和仪表板`，启用`CDP 仪表板`。\n\n图 2-15 显示了需要添加的报告访问权限。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig15_HTML.jpg](img/510611_1_En_2_Fig15_HTML.jpg)\n\
  \n**图 2-15** 创建和运行临时报告权限\n\n管理员还需要拥有创建和查看职业发展路径的权限。在`用户权限`部分下，前往`杂项权限`。滚动查找名为`职业发展路径`的权限，如图\
  \ 2-16 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig16_HTML.jpg](img/510611_1_En_2_Fig16_HTML.jpg)\n\
  \n**图 2-16** 用于查看和编辑职业发展路径的杂项权限\n\n对于`职业发展路径`，启用`查看`选项以设置可见性。启用`编辑`和`导入/导出操作`选项。\n\
  \n最后，添加`职业工作表`目标计划权限，如图 2-17 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig17_HTML.jpg](img/510611_1_En_2_Fig17_HTML.jpg)\n\
  \n**图 2-17** 职业工作表的权限目标\n\n在关于配置的讨论中，我们提到了添加一个目标角色以显示在人材画像的职业目标板块中的选项。我们在`职业工作表`模板\
  \ XML 中添加了`共享`权限。我们还向数据模型添加了`nextPreferredMove`背景字段。\n\n为了让管理员创建用于人材画像的职业目标板块，必须在权限角色中启用该背景字段。如图\
  \ 2-18 所示，前往位于`用户权限`部分的`员工数据`。向下滚动，在数据模型中找到背景字段`preferredNextMove`，并授予`编辑`权限。\n\n\
  ![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig18_HTML.jpg](img/510611_1_En_2_Fig18_HTML.jpg)\n\
  \n**图 2-18** 首选下一步行动背景字段的权限\n\n现在，我们已经授予了管理员权限角色访问权限，以管理`职业工作表`的各项功能。保存该权限角色。\n\n\
  ## 职业工作表设置\n\n现在，我们将逐步介绍管理员将为`职业工作表`启用的所有功能。\n\n### 更新人材画像\n\n如果您当前没有使用板块来表示职业目标，请前往`配置人材画像`来添加该板块，如图\
  \ 2-19 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig19_HTML.jpg](img/510611_1_En_2_Fig19_HTML.jpg)\n\
  \n**图 2-19** 配置人材画像 添加新板块\n\n找到一个您想放置该板块的区域。您可以将该板块添加到一个现有的、包含类似类型板块的区域中。通常，这是一个对员工、经理和\
  \ HR 经理可见的人才资料区域。在屏幕右侧的`自定义板块`下，选择`实时画像背景信息`，并将其拖拽到一个区域内的新板块中。\n\n为板块命名并添加描述。如图\
  \ 2-20 所示，该区域和板块被标记为`职业目标`。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig20_HTML.jpg](img/510611_1_En_2_Fig20_HTML.jpg)\n\
  \n**图 2-20** 添加并标记职业目标板块\n\n在描述部分下方，有一个背景字段下拉列表。选择背景字段`preferredNextMove`，如图 2-21\
  \ 所示。\n\n\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig21_HTML.jpg](img/510611_1_En_2_Fig21_HTML.jpg)\n\
  \n**图 2-21**  \n背景元素的选择\n\n保存区块，接下来我们将进行管理员在准备使用职业工作表之前需要执行的任务。\n\n## 角色能力预期评分\n\
  \n职业工作表的一个关键组成部分是岗位角色能力；它是职业工作表的支柱，因为就绪程度基于某个角色的能力。为了按预期使用职业工作表，所有岗位角色都需要已映射的能力。链接到岗位角色的每项能力还必须有一个预期评分。预期评分将与员工的实际能力评分进行对比，以此确定该员工对该角色的就绪程度。\n\
  \n使用`职位档案构建器 (JPB)`确保每个岗位角色都有能力项。我们还需要验证每个岗位角色能力是否都有预期评分。如果你未使用`JPB`，可以使用`族系与角色`。\n\
  \n管理员可以手动为岗位角色添加预期评分。为此，请前往`职位档案内容 -> 族系与角色 -> 能力`，如图 2-22 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig22_HTML.jpg](img/510611_1_En_2_Fig22_HTML.jpg)\n\
  \n**图 2-22**  \n使用职位档案构建器访问族系与角色\n\n前往`管理职位档案内容 -> 设置族系与角色`。\n\n进入`角色`选项卡，选择一个角色进行编辑，如图\
  \ 2-23 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig23_HTML.jpg](img/510611_1_En_2_Fig23_HTML.jpg)\n\
  \n**图 2-23**  \n管理职位档案内容中的角色视图\n\n选择一个角色，并进入该角色的`已映射能力`选项卡，如图 2-24 所示。如果需要，首先将能力映射到该岗位角色。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig24_HTML.jpg](img/510611_1_En_2_Fig24_HTML.jpg)\n\
  \n**图 2-24**  \n岗位角色的已映射能力\n\n我们需要关注`评分`列。点击某项能力的计算器图标。将弹出一个弹出窗口，如图 2-25 所示。\n\n\
  ![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig25_HTML.jpg](img/510611_1_En_2_Fig25_HTML.jpg)\n\
  \n**图 2-25**  \n预期评分计算器\n\n根据你在职业工作表模板`XML`和`角色就绪评估`模板中确定的评分标准，你将输入评分标准中的最低分数、最高分数，以及该能力的预期评分分数。预期分数应是对能力熟练度可接受的评分。你可能需要与组织内的薪酬或人才管理部门人员协商来确定这些评分。\n\
  \n输入三个分数后，`计算`按钮将变为可用，如图 2-26 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig26_HTML.jpg](img/510611_1_En_2_Fig26_HTML.jpg)\n\
  \n**图 2-26**  \n输入分数后计算按钮变为可用\n\n随后将显示计算出的预期评分百分比。用于计算此能力预期评分的系统硬编码公式为 `(x – 1)/(评分标准\
  \ – 1) = 预期评分百分比`，其中 `x` 是职业工作表中某项能力的预期评分。\n\n点击`应用`按钮，如图 2-27 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig27_HTML.jpg](img/510611_1_En_2_Fig27_HTML.jpg)\n\
  \n**图 2-27**  \n应用能力评分\n\n现在，该能力的计算评分字段已填充完成，如图 2-28 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig28_HTML.jpg](img/510611_1_En_2_Fig28_HTML.jpg)\n\
  \n**图 2-28**  \n带有评分百分比的能力项\n\n对映射到该角色的每项能力执行相同操作。你还可以为每项能力提供一个权重。完成后，点击`保存角色`按钮，如图\
  \ 2-29 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig29_HTML.jpg](img/510611_1_En_2_Fig29_HTML.jpg)\n\
  \n**图 2-29**  \n保存角色以使评分生效\n\n需要对每个岗位角色上的每项能力都执行此操作。为了简化流程，你可以使用导入功能批量更新岗位角色能力。\n\
  \n## 批量更新岗位角色能力\n\n假设你的岗位角色已有映射的能力，我们只需要为每个岗位角色上的每项能力添加权重（可选）和预期评分。这通过`角色-映射能力`模板完成。\n\
  \n在搜索栏中输入并选择`管理职位档案内容导入/导出`。我们将下载`角色-映射能力`模板，如图 2-30 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig30_HTML.jpg](img/510611_1_En_2_Fig30_HTML.jpg)\n\
  \n**图 2-30**  \n下载角色-映射能力文件\n\n当提示时，你希望模板包含现有数据，如图 2-31 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig31_HTML.jpg](img/510611_1_En_2_Fig31_HTML.jpg)\n\
  \n**图 2-31**  \n确认下载时包含数据\n\n将出现一条消息，指示你前往`监控作业`以检索下载的文件。该消息如图 2-32 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig32_HTML.jpg](img/510611_1_En_2_Fig32_HTML.jpg)\n\
  \n**图 2-32**  \n包含查找文件说明的弹出窗口\n\n在搜索栏中输入并选择`监控作业`以查看已运行的作业。示例如图 2-33 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig33_HTML.jpg](img/510611_1_En_2_Fig33_HTML.jpg)\n\
  \n**图 2-33**  \n已运行的作业\n\n使用屏幕底部的滚动条向右移动，以查看`下载状态`列，如图 2-34 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig34_HTML.jpg](img/510611_1_En_2_Fig34_HTML.jpg)\n\
  \n**图 2-34**  \n带有下载状态的监控作业视图\n\n点击`下载状态`，将提示保存或打开该文件。示例如图 2-35 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig35_HTML.jpg](img/510611_1_En_2_Fig35_HTML.jpg)\n\
  \n**图 2-35**  \n打开或保存文件的弹出屏幕\n\n这是我们需要更新的文件。打开后，你将看到有多个语言列；这些是不同语言的标签。图 2-36 显示了该文件的布局。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig36_HTML.jpg](img/510611_1_En_2_Fig36_HTML.jpg)\n\
  \n**图 2-36**  \n角色-映射能力文件\n\n为了使文件更易于管理，你可以删除实例中未使用的任何语言列。在图 2-37 所示的示例中，`默认值`和`US_\
  \ 英语`是仅保留的语言列。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig37_HTML.jpg](img/510611_1_En_2_Fig37_HTML.jpg)\n\
  \n**图 2-37**  \n删除无关语言列后的角色-映射能力文件\n\n为了给每个岗位角色能力添加预期评分百分比，我们将在以下列中添加值：\n\n*   `roleCompetencyMappings.rating.en_US`\n\
  *   `roleCompetencyMappings.rating.defaultValue`\n\n\n\n\n请使用以下计算公式来确定需要填入这些列中的预期评级百分比值：\
  \  \n`(x – 1)/(评级量表 – 1) = 预期评级百分比`，其中 `x` 是`职业工作表`中某项能力的预期评级。\n\n在计算角色准备度时不使用权重，但你可以添加权重以备将来使用。要针对每个职务角色为每项能力添加权重，你需要填入以下列：\n\
  \n- `roleCompetencyMappings.weight.en_US`\n- `roleCompetencyMappings.weight.defaultValue`\n\
  \n如果你使用任何其他语言，则需要为每种区域设置包含一列。\n\n你可以为某些能力添加权重，而不为其他能力添加。所有能力都需要提供预期评级百分比。你看到的数字是百分比，而不是基于前述计算得出的评级。示例文件如图\
  \ 2-38 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig38_HTML.jpg](img/510611_1_En_2_Fig38_HTML.jpg)\n\
  \n图 2-38：包含权重和评级的角色映射能力文件\n\n要导入模板，你需要包含以下列：\n\n- `externalCode`\n- `roleCompetencyMappings.competency.externalCode`\n\
  - `roleCompetencyMappings.weight.en_US`\n- `roleCompetencyMappings.weight.defaultValue`\n\
  - `roleCompetencyMappings.weight.en_DEBUG`\n- `roleCompetencyMappings.rating.en_US`\n\
  - `roleCompetencyMappings.rating.defaultValue`\n- `roleCompetencyMappings.rating.en_DEBUG`\n\
  - `roleCompetencyMappings.status`\n- `roleCompetencyMappings.externalCode`\n- `roleCompetencyMappings.subModule`\n\
  \n从`管理职务档案内容导入/导出`导入文件，如图 2-39 所示。首先，运行以进行验证；如果成功，则执行导入。务必在`文件编码`字段中选择“Unicode (UTF-8)”。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig39_HTML.jpg](img/510611_1_En_2_Fig39_HTML.jpg)\n\
  \n图 2-39：导入更新后的角色映射能力文件\n\n我们现在已经了解了这个文件以及需要添加的内容。但文件中并未包含职务角色名称和能力名称。这将使得确定你要为哪个职务角色/能力映射添加字段变得棘手。因此，我们将退一步，以便你可以创建一个文件作为参考，来识别你正在处理的角色和能力。返回`管理职务档案内容导入/导出`。我们将下载包含数据的`角色`模板，以获取角色映射能力文件中使用的职务角色名称和关联的外部代码。接下来，我们还需要下载包含数据的`能力`模板，以查看能力名称及其关联的外部代码。在更新`角色映射能力`文件时，你可以将这两个文件合并作为参考。更多详细信息，请参考第\
  \ 1 卷第 3 章。\n\n## 管理职业路径\n\n使用职业路径可以提供职务晋升的可视化表示，使员工能够了解哪些角色是通向下一职位的基础。一个职业路径由一组相似的工作组成，这些工作经过映射以显示从入门级到管理职位的晋升路径。\n\
  \n你可以设置多个职业路径。创建的职业路径适用于整个实例。例如，你可以创建特定于部门（如财务、销售和人力资源）的路径。并且你可以限制员工可以查看哪些职业路径。职业工作表可能包含指向职业路径的链接，以便员工可以查看各种路径，找到他们渴望的角色。他们可以在职业工作表中选择任何角色，以查看在该角色中取得成功所需的能力以及他们自身的准备程度。\n\
  \n如图 2-40 所示，工作表中有一个链接，可以查看任何目标角色的职业路径。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig40_HTML.jpg](img/510611_1_En_2_Fig40_HTML.jpg)\n\
  \n图 2-40：访问目标角色的职业路径\n\n该角色的职业路径将显示，目标角色会被突出显示，如图 2-41 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig41_HTML.jpg](img/510611_1_En_2_Fig41_HTML.jpg)\n\
  \n图 2-41：目标角色的职业路径\n\n管理员需要为职业工作表中引用的职务角色创建职业路径。\n\n管理员将在`发展`模块中拥有一个`职业路径`选项卡，如图\
  \ 2-42 所示。职业路径在此处进行管理。此选项卡仅对在其基于角色的权限中拥有`管理职业路径`权限的角色可见。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig42_HTML.jpg](img/510611_1_En_2_Fig42_HTML.jpg)\n\
  \n图 2-42：管理职业路径\n\n`管理职业路径`界面包含两个选项卡：`职业路径`和`职务角色`。访问`管理职业路径`的权限将授予对这两个选项卡的访问权，这两个选项卡不能单独授权。\n\
  \n`职业路径`选项卡用于配置职业路径节点，以及创建、编辑和删除职业路径。单击介绍文本下方的`配置职业路径节点`链接。在此处确定要在角色节点上显示的元素。该选项卡如图\
  \ 2-43 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig43_HTML.jpg](img/510611_1_En_2_Fig43_HTML.jpg)\n\
  \n图 2-43：配置职业路径节点\n\n使用此界面来决定职业路径内每个角色（节点）应显示哪些信息。图 2-44 标明了你可以选择的选项。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig44_HTML.jpg](img/510611_1_En_2_Fig44_HTML.jpg)\n\
  \n图 2-44：职业路径节点选项\n\n决定了节点要显示的元素后，你可以查看节点预览，它会根据你的选择显示节点的大致外观。图 2-45 使用了所有元素。\n\n\
  ![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig45_HTML.jpg](img/510611_1_En_2_Fig45_HTML.jpg)\n\
  \n图 2-45：职业路径节点预览\n\n所做的选择将反映在你创建的每条路径的职业节点上。保存选择并返回到`职业路径`界面。\n\n单击`创建新的职业路径`。将弹出一个弹出窗口，如图\
  \ 2-46 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig46_HTML.jpg](img/510611_1_En_2_Fig46_HTML.jpg)\n\
  \n图 2-46：创建职业路径\n\n你需要为你的职业路径起一个有意义的名称。`外部代码`和`名称`字段为必填项；`业务单元`、`部门`和`分部`为选填项。选填字段可用于限制员工对特定职业路径的访问权限。\n\
  \n图 2-47 显示了一个仅使用必填字段的职业路径示例。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig47_HTML.jpg](img/510611_1_En_2_Fig47_HTML.jpg)\n\
  \n图 2-47：使用必填字段创建职业路径\n\n保存后，将显示一个界面，你将在其中构建职业路径，如图 2-48 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig48_HTML.jpg](img/510611_1_En_2_Fig48_HTML.jpg)\n\
  \n图 2-48：构建职业路径\n\n单击屏幕中央的`选择一个角色`开始构建路径，如图 2-49 所示。将弹出一个窗口，显示你可以选择的角色。默认显示为列表视图，角色按系列/角色名称顺序排列。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig49_HTML.jpg](img/510611_1_En_2_Fig49_HTML.jpg)\n\
  \n图 2-49：为职业路径选择角色\n\n\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig49_HTML.jpg](img/510611_1_En_2_Fig49_HTML.jpg)\n\
  \n图 2-49：可添加到职业发展路径的角色\n\n您可以将角色视图切换为树状视图，如图 2-50 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig50_HTML.jpg](img/510611_1_En_2_Fig50_HTML.jpg)\n\
  \n图 2-50：职位的树状视图\n\n选择一个角色，它就会出现在职业发展路径屏幕上，如图 2-51 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig51_HTML.jpg](img/510611_1_En_2_Fig51_HTML.jpg)\n\
  \n图 2-51：向职业发展路径添加职位\n\n职业发展路径节点提供以下几种操作：\n\n-   添加领先角色，为当前角色添加一个前置角色。\n-   添加后继角色，为当前角色添加一个后置角色。\n\
  -   添加同级角色，在当前角色上方添加一个横向角色——每个节点最多可有两个横向角色。\n-   用新角色替换当前节点。删除一个节点后，您可以选择一个替换节点。\n\
  -   级联删除角色。移除当前角色及其所有后续角色。\n-   删除角色。移除一个角色，并将领先角色与后继角色相连接。\n\n节点将根据所选操作出现在路径中。在下面的图\
  \ 2-52 示例中，正在向路径添加一个后继角色。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig52_HTML.jpg](img/510611_1_En_2_Fig52_HTML.jpg)\n\
  \n图 2-52：添加后继角色\n\n图 2-53 展示了添加同级角色。这会将一个角色放置在路径中的同一级别上。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig53_HTML.jpg](img/510611_1_En_2_Fig53_HTML.jpg)\n\
  \n图 2-53：添加同级角色\n\n继续添加角色，直到您的路径创建完成。保存路径，如图 2-54 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig54_HTML.jpg](img/510611_1_En_2_Fig54_HTML.jpg)\n\
  \n图 2-54：保存新构建的职业发展路径\n\n返回职业发展路径页面，即可看到您新添加的职业发展路径已列出。您可以继续创建路径，也可以编辑和删除路径。要编辑路径，请点击路径名称。在这里，您可以修改路径或编辑基本信息，如图\
  \ 2-55 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig55_HTML.jpg](img/510611_1_En_2_Fig55_HTML.jpg)\n\
  \n图 2-55：编辑职业发展路径的基本信息\n\n点击“编辑基本信息”即可添加筛选器，如图 2-56 所示。您可以添加业务单位、部门，从而将职业发展路径的访问权限限制为仅属于这些部门的员工。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig56_HTML.jpg](img/510611_1_En_2_Fig56_HTML.jpg)\n\
  \n图 2-56：编辑职业发展路径\n\n返回职业发展路径主屏幕，您可以转到“职位”选项卡，如图 2-57 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig57_HTML.jpg](img/510611_1_En_2_Fig57_HTML.jpg)\n\
  \n图 2-57：职位选项卡\n\n此视图让您能够查看某个角色属于多少条职业发展路径。点击角色名称，相应的职业发展路径便会显示。您选中的角色将在路径中高亮显示，如图\
  \ 2-58 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig58_HTML.jpg](img/510611_1_En_2_Fig58_HTML.jpg)\n\
  \n图 2-58：职业发展路径中选中的角色\n\n在此屏幕上，您可以点击屏幕右下方的“编辑职业发展路径”按钮来编辑该路径。这将带您返回可编辑职业发展路径基本信息或路径本身的屏幕，如图\
  \ 2-59 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig59_HTML.jpg](img/510611_1_En_2_Fig59_HTML.jpg)\n\
  \n图 2-59：可编辑职业发展路径的屏幕\n\n您需要执行以上步骤来创建每一条职业发展路径。\n\n## 导入职业发展路径 V2\n\n如果您的组织规模非常大，需要构建大量职业发展路径，手动逐一创建将非常耗时。为避免此手动流程，可以导入职业发展路径。\n\
  \n我们将引用两个文件：\n\n-   **职业发展路径**：包含外部代码和特定于区域设置的翻译。\n-   **职业发展路径-职业发展路径详情**：包含与职位相关的职业发展路径外部代码。\n\
  \n在搜索栏中键入并选中“导入和导出数据”，然后选择“下载模板”作为要执行的操作。使用“选择通用对象”下拉列表，选择“职业发展路径”。然后下载模板，如图 2-60\
  \ 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig60_HTML.jpg](img/510611_1_En_2_Fig60_HTML.jpg)\n\
  \n图 2-60：下载职业发展路径\n\n这将生成一个压缩文件。\n\n打开压缩文件，您会看到两个与职业发展路径相关的文件，如图 2-61 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig61_HTML.jpg](img/510611_1_En_2_Fig61_HTML.jpg)\n\
  \n图 2-61：下载的职业发展路径文件\n\n如图 2-62 所示，职业发展路径模板包含与手动创建职业发展路径时相同的字段：外部代码、职业发展路径名称、业务单位、部门和分部。此外，还会包含针对您实例中启用的语言对应的职业发展路径名称的特定于区域设置的翻译列。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig62_HTML.jpg](img/510611_1_En_2_Fig62_HTML.jpg)\n\
  \n图 2-62：职业发展路径模板\n\n您可以删除实例中未使用语言的外部名称列，如图 2-63 所示。在此示例中，仅保留 `externalName` 列 `en_US`。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig63_HTML.jpg](img/510611_1_En_2_Fig63_HTML.jpg)\n\
  \n图 2-63：删除多余语言列后的职业发展路径模板\n\n构建职业发展路径文件时，您只需填写必填的“外部代码”和“名称”字段。每条路径还需要一个唯一的外部代码。您可以使用任何对您有意义的命名约定。\n\
  \n保存包含您正在创建的所有职业发展路径的文件。图 2-64 是创建三个新职业发展路径的示例。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig64_HTML.jpg](img/510611_1_En_2_Fig64_HTML.jpg)\n\
  \n图 2-64：包含路径名称的职业发展路径文件\n\n在搜索栏中键入并选中“导入和导出数据”，以导入新创建的职业发展路径文件。请确保使用 UTF-8 文件编码类型。首先验证文件以进行导入。转到“监控任务”查看结果。下载并打开“下载状态”列中的文件，如图\
  \ 2-65 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig65_HTML.jpg](img/510611_1_En_2_Fig65_HTML.jpg)\n\
  \n图 2-65：验证导入结果\n\n\n\n如果没有任何错误，职业发展路径文件即可准备导入。  \n在搜索栏中输入并选择“导入和导出数据”，然后导入职业发展路径文件。再次进入“监控作业”以检查导入状态，并确保导入成功，如图\
  \ 2-66 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig66_HTML.jpg](img/510611_1_En_2_Fig66_HTML.jpg)\n\
  \n**图 2-66**  \n职业发展路径导入结果\n\n如果成功，当您返回“发展”模块中的“职业发展路径”时，将看到新创建的职业发展路径。\n\n接下来，您需要为每条职业发展路径构建职业节点。您需要包含的每个工作角色的\
  \ GUID。可通过“管理职位档案内容导入/导出数据”并下载“角色”数据来查找角色 GUID，如图 2-67 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig67_HTML.jpg](img/510611_1_En_2_Fig67_HTML.jpg)\n\
  \n**图 2-67**  \n下载角色模板\n\n下载文件后，前往“监控作业”下载该文件。此文件将在构建职业发展路径详细信息文件时用作参考。在职业发展路径详细信息文件中需要用到的是外部角色\
  \ GUID 列，如图 2-68 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig68_HTML.jpg](img/510611_1_En_2_Fig68_HTML.jpg)\n\
  \n**图 2-68**  \n角色 GUID\n\n在构建职业发展路径详细信息文件时，您需要为路径中的每个角色准备一条记录。该记录将包括职业发展路径外部代码、要添加到路径中的工作角色的角色\
  \ GUID、路径中下一个角色的角色 GUID，以及所添加的角色是否为同级角色（`“TRUE”` 或 `“FALSE”`）。示例文件如图 2-69 所示。\n\n\
  ![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig69_HTML.jpg](img/510611_1_En_2_Fig69_HTML.jpg)\n\
  \n**图 2-69**  \n职业发展路径详细信息文件\n\n您需要参考角色文件中的角色 GUID 来规划职业发展路径，以识别每个角色及其导向的下一个角色。路径的构建将基于\
  \ `Career Path-Career Path Details`（职业发展路径-职业发展路径详细信息）文件的 `nextRole` 列中列出的角色 GUID，以及\
  \ `isPeerRole` 列的值。\n\n### 职业发展路径-职业发展路径详细信息文件布局\n\n该文件用于映射角色之间的“导向”和“被导向”关联。\n\n\
  该文件的各列说明如下：\n\n- **OPERATOR**（A 列）：对于新的职业发展路径，此行空白。其他值为 `Clear`、`Delimit` 和 `Delete`。\n\
  - **externalCode**（B 列）：包含职业发展路径名称。这是您在职业发展路径文件的 B 列中指定的名称。\n- **careerPathDetails.externalCode**（C\
  \ 列）：对于新的职业发展路径，您可以在此处分配一个唯一的外部代码。如果您要更新现有职业发展路径中的详细信息，则需要从职业发展路径详细信息文件的导出中找到该代码。\n\
  - **careerPathDetails.role.externalCode**（D 列）：应包含您要添加到路径中的角色的角色 GUID。\n- **nextRole.externalCode**（E\
  \ 列）：应包含路径中下一个角色的角色 GUID。\n- **careerPathDetails.isPeerRole**（F 列）：标识该角色是否为同级角色（`TRUE`\
  \ 或 `FALSE`）。\n\n在映射“导向”和“被导向”角色时，使用 `careerPathDetails.role.externalCode` 和 `careerPathDetails.nextRole.externalCode`\
  \ 来关联路径中的下一个角色。通过在 D 列中标识一个角色并在 E 列中标识下一个角色，系统将知道下一个角色是否已在路径中。如果是，您添加的角色是“导向”角色，而不是“被导向”角色。\
  \  \n在映射同级角色时，`careerPathDetails.role.externalCode` 和 `careerPathDetails.nextRole.externalCode`\
  \ 可能包含这两个角色中的任意一个，因为 `careerPathDetails.isPeerRole` = `“TRUE”` 定义了该映射是否为同级角色映射。\n\
  \n路径构建完成后，保存文件，并在“导入和导出数据”中使用通用对象类型 `“Career Path-Career Path Details”`（职业发展路径-职业发展路径详细信息）对其进行验证。在“监控作业”中检查结果后，如果验证成功，请返回“导入和导出数据”并导入该文件。导入完成后，您可以返回“发展”模块中的“职业发展路径”选项卡，职业发展路径即构建完成。\n\
  \n现在，您已创建了员工可以在其职业工作表中引用的职业发展路径。\n\n#### 建议角色\n\n职业工作表的另一个功能是让员工查看建议角色。工作表中有一个名为“建议角色”的选项卡，如图\
  \ 2-70 所示。员工将在此处看到基于管理员配置而为他们建议的角色。“建议角色”选项卡仅对员工可见，其经理或人力资源经理无法看到。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig70_HTML.jpg](img/510611_1_En_2_Fig70_HTML.jpg)\n\
  \n**图 2-70**  \n建议角色\n\n建议角色可以基于职业发展路径或一组定义的标准。建议角色可以是能力、目标角色、职业发展路径和同级所选角色的组合。建议角色基于管理员完成的配置。请前往**工具**\
  \ ➤ **管理建议角色**，如图 2-71 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig71_HTML.jpg](img/510611_1_En_2_Fig71_HTML.jpg)\n\
  \n**图 2-71**  \n配置建议角色\n\n基于此屏幕所选标准的算法将为用户创建建议角色，以便用户在其职业工作表上选择目标角色。  \n有一系列复选框用于标识建议角色所使用的标准。必须为每个启用的标准分配一个权重百分比。权重总和必须为\
  \ 100，且只能是 0 到 100 之间的整数。\n\n可选择的标准包括：\n\n- 职业发展路径中的接近度\n- 能力\n- 工作族\n- 空缺职位\n-\
  \ 团队内的受欢迎程度\n\n每个标准的描述和评分如 表 2-5 所示。\n\n**表 2-5**  \n建议角色标准与评分\n\n| 标准 | 描述 | 评分\
  \ |\n| --- | --- | --- |\n| 职业发展路径中的接近度* | 角色在职业发展路径中越接近，分配的分数越高。 | 对于职业发展路径中的每个角色，将接近度计算为\
  \ `1/(当前角色与路径中每个角色之间的角色数量)`。 |\n| 与目标角色关联的能力 | 基于使用职业工作表就绪度计算得出的匹配分数。与预期的能力评级进行比较。\
  \ | 使用职业工作表角色就绪度百分比。从百分比转换。例如，`70%` 的就绪度百分比将对应 `0.7` 的分数。 |\n| 工作族 | 如果该角色与用户角色属于同一工作族。\
  \ | `0` = 角色与用户角色属于不同工作族。`1` = 角色与用户角色属于同一工作族。 |\n| 空缺职位 | 仅适用于传统职位。 | `0` = 无空缺职位。`1`\
  \ = 有空缺职位。 |\n| 团队内的受欢迎程度 | 具有相同经理且选择了相同目标角色的员工。 | 分数基于以下计算：选择了相同目标角色的同级人数 / 同级总人数。\
  \ |\n\n\n\n截至撰写本文时，使用邻近因素存在一个限制。它仅适用于使用职位描述管理器（`JDM1.0`）的实例。针对职位档案构建器（`JPB`或`JDM2.0`）的代码增强发布日期尚未公布。使用所选因素，系统会为每个角色计算一个分数，然后进行加权。角色将按照分数从高到低的顺序显示在“建议角色”选项卡中。最多可显示\
  \ 60 个角色。\n\n在“建议角色”配置页面底部，有三个筛选选项：**能力**、**职务族**和**相关行业**。当用户查看其建议角色时，这些筛选器将可用，并允许他们筛选掉与其职业兴趣不符的角色。`相关行业`\
  \ 是一个筛选器，仅当您使用职位档案构建器并将“相关行业”作为一部分添加到职位档案模板中时才可用。\n\n## 角色就绪度评估表\n\n在深入了解角色就绪度评估表的机制之前，我们先讨论一下该表是什么以及它如何融入职业工作表。角色就绪度评估表由员工从职业工作表中启动，用于评估员工在所选未来角色所需能力方面的熟练程度。该表用于帮助员工规划其职业发展，并确定未来角色所需的发展领域。\n\
  \n角色就绪度评估模板是一个绩效管理模板，因此它使用评分量表和路线图。如果启用了职业工作表，则应在配置（Provisioning）中找到标准的角色就绪度评估模板。它可以在“表单模板管理”下找到。该模板不应使用总体绩效评分，并且只应包含针对职位角色能力的单独评分。\n\
  \n模板的能力部分如图 2-72 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig72_HTML.jpg](img/510611_1_En_2_Fig72_HTML.jpg)\n\
  \n*图 2-72：角色就绪度评估模板*\n\n检查模板的高级设置，确保未启用“仅为在 {日期} 至 {日期} 之间没有现有表单且结束日期为空的用户创建”，如图\
  \ 2-73 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig73_HTML.jpg](img/510611_1_En_2_Fig73_HTML.jpg)\n\
  \n*图 2-73：高级设置*\n\n该模板使用一个非常简单的路线图，仅包含员工和管理者角色。员工启动表单，对目标角色的能力进行自我评分。自我评分后，表单将路由给管理者，其主页上会出现一个“绩效待办事项”，管理者可以像访问其他绩效管理表单一样访问此表单。管理者将对表单上的每项能力进行评分。管理者的能力评分将用于与预期评分进行比较，以确定角色就绪度。然后表单返回给员工，由员工将其设置为“已完成”。路线图中的最后一步使员工能够知道他们随后可以在其职业工作表中检查角色就绪度。示例路线图见图\
  \ 2-74。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig74_HTML.jpg](img/510611_1_En_2_Fig74_HTML.jpg)\n\
  \n*图 2-74：角色就绪度评估模板的路线图*\n\n管理员还可以为职业工作表配置一个附加功能，接下来将对此进行讨论。\n\n## 为职业工作表创建指向“我的当前角色”的深层链接\n\
  \n可以将深层链接添加到用户主页上的“快速链接”磁贴中。\n\n要进行此设置，请在搜索中键入并选择“管理主页”，找到“快速链接”磁贴，如图 2-75 所示。\n\
  \n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig75_HTML.jpg](img/510611_1_En_2_Fig75_HTML.jpg)\n\
  \n*图 2-75：管理主页*\n\n点击“管理链接”以添加 URL，如图 2-76 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig76_HTML.jpg](img/510611_1_En_2_Fig76_HTML.jpg)\n\
  \n*图 2-76：管理链接*\n\n为标签提供一个名称，然后输入基础 URL，后跟 `sf/careerworksheet?currentrole=true`。要找到您的基础\
  \ URL，请查看登录页面的 URL。示例如下：\n\n`https://performancemanager4.successfactors.com/login#/companyEntry`\n\
  \n移除 `login#/companyEntry`，并添加 `/sf/careerworksheet?currentrole=true`，如下例所示：\n\n\
  `https://performancemanager4.successfactors.com/sf/careerworksheet?currentrole=true`\n\
  \n将该链接设为默认链接并保存。\n\n现在，新的深层链接将显示在主页的“快速链接”磁贴中。该链接会将员工引导至其职业工作表中的“我的当前角色”选项卡，如图 2-77\
  \ 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig77_HTML.jpg](img/510611_1_En_2_Fig77_HTML.jpg)\n\
  \n*图 2-77：主页上的快速链接磁贴*\n\n## 总结\n\n现在，我们已经回顾了配置中所需的职业工作表和职业路径设置。我们已经修改了职业工作表模板 XML。我们已经查看了管理员基于角色的权限。我们已经学习了如何创建职业路径以及如何配置建议角色。我们已经查看了职位档案构建器，以将预期评分映射到职位角色能力。我们讨论了角色就绪度评估表以及如何设置它。职业工作表现已准备就绪，可供使用。在下一章中，我们将设置基于用户角色的权限，并从用户的角度逐步了解职业工作表。现在，让我们来看一下职业工作表的集成。\n\
  \n## 职业工作表与继任组织图中的建议继任者集成\n\n职业工作表与继任管理模块集成。来自职业工作表的就绪度计算结果用于在 v12 继任组织图中显示十位潜在继任者，如图\
  \ 2-78 所示。\n\n![../images/510611_1_En_2_Chapter/510611_1_En_2_Fig78_HTML.jpg](img/510611_1_En_2_Fig78_HTML.jpg)\n\
  \n*图 2-78：建议继任者*\n\n继任者的就绪度基于目标职位的职位角色能力和潜在继任者的能力评分。为此，需要满足以下条件：\n\n-   职业工作表模板\
  \ XML 中的就绪度计算开关需要设置为“开”。\n-   必须使用 `JDM 2.0`。\n-   职业工作表模板 XML 中，所有角色 `“*”` 对 `readiness_meter`\
  \ 具有“读取”权限。\n-   定义了职位角色能力，并且用户与职位角色相关联。\n-   继任规划者的权限角色具有“建议继任者”权限。\n\n```\n如果用户对角色所需的任何能力没有能力评分，则他们不会列为可能的继任者。\n\
  ```\n\n#### 职业探索器\n\n`Career Explorer` 是一项新功能，它基于组织中与其相似人员的职业路径，向员工推荐职业发展机会。它使用基于\
  \ SAP Leonardo 机器学习技术的“人员连接”来检索和分析员工中心数据。`Career Explorer` 目前仅适用于早期采用者关怀 (EAC) 计划的成员。要申请，您至少必须使用\
  \ SAP SuccessFactors Employee Central 以及使用职务代码、职位分类和能力的职位档案构建器。您必须拥有继任管理和职业发展规划，并且至少有\
  \ 1000 条员工与职位角色配对记录。我们将在下一章简要介绍其功能。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n译文：\n\n\n# 结论\n\n`Career Worksheet` 已启用，`Career Worksheet` 模板 XML 已配置，并且管理 `Career\
  \ Worksheet` 功能的权限已授予。管理员已创建职业发展路径，确定了建议角色的标准，并配置了 `Role Readiness Assessment` 模板。\n\
  \n在下一章中，我们将设置员工、经理和 HR 经理角色访问 `Career Worksheet` 及其组件所需的基于角色的权限。然后，我们将逐步介绍员工及其经理在访问\
  \ `Career Worksheet` 时可使用的功能。\n\n# 使用 `Career Worksheet`\n\n在第 2 章中，我们启用并配置了 `Career\
  \ Worksheet`。我们授予了管理员权限，并学习了如何创建职业路径。我们了解了如何选择建议角色的设置。我们查看了为职位角色能力添加期望评级的流程，并查看了\
  \ `Role Readiness Assessment` 表单。现在，我们准备了解员工及其经理如何使用 `Career Worksheet`。\n\n我们将深入了解员工如何使用\
  \ `Career Worksheet` 来探索组织内的职位角色。我们还将看到职业路径如何为员工提供组织内职业角色晋升的概览。我们还将学习如何评估员工对未来角色的准备情况。\n\
  \n在本章中，我们将逐步介绍职业工作表中的选项卡。我们将了解在选择目标角色时，准备度计量表如何工作。我们将讨论每个选项卡中的组件，以及如何浏览职业路径、查看建议角色和启动\
  \ `Role Readiness Assessment` 表单。我们将查看员工、其经理及其 HR 经理可用的功能。我们还将简要介绍新的 `Career Explorer`。\n\
  \n以下是上一章中的一些要点提醒：\n\n*   `Career Worksheet` 依赖于职位角色及其职位角色定义、已映射的能力以及预期能力熟练度评级。\n\
  *   必须通过使用 `Job Profile Builder` 或通过传统的系列和角色将能力映射到职位角色。我们建议使用支持职位描述描述的 JDM v2.0。如果您未使用带有\
  \ MDF 职位提名的 EC（该提名在职位对象上具有职位代码），则必须在用户数据文件 (UDF) 中分配职位代码，这些代码将在您的角色/职位代码映射中使用。有关如何将职位代码映射到角色以及如何将能力分配给角色的更多信息，请参阅第\
  \ 1 卷第 3 章。您也可以将行为映射到能力。\n*   如果您希望用户将职业发展目标与目标职位角色的能力相关联，则发展目标计划必须包含一个能力字段。\n*\
  \   `Career Worksheet` 中使用的能力评级可能来自已完成的绩效或 360 评估表，或来自 `Role Readiness Assessment`\
  \ 表单。\n\n> **注意**\n> 有关升级到 `Job Profile Builder` 的信息，请参阅 SAP 说明 #2383059。有关升级到 `Career\
  \ Path` V2 的更多信息，请参阅 SAP 说明 #2485992。\n\n## 用户角色的基于角色的权限\n\n在开始之前，我们需要为员工、经理和 HR\
  \ 经理角色设置基于角色的权限。这些角色权限之间的任何差异都将被高亮显示。\n\n### `Career Worksheet` 权限\n\n授予基于角色的权限，以便角色可以访问“发展”下的\
  \ `Career Worksheet` 选项卡。\n\n在 `Career Development Planning` 中，员工、经理和 HR 经理角色的访问权限存在差异。员工角色将需要访问职业工作表和建议角色。建议角色仅对员工可访问；经理无法查看其直接下属的建议角色。即使有权限，经理和\
  \ HR 经理也无法访问建议角色。\n\n在搜索栏中键入并选择“管理权限角色”。让我们从员工角色开始。打开该角色，单击“权限”，并使用以下路径授予权限：\n\n\
  -   `用户权限` ➤ `职业发展计划` ➤ `职业工作表访问权限`\n-   `用户权限` ➤ `职业发展计划` ➤ `职业工作表建议角色访问权限`\n\n\
  权限如图 3-1 所示。确保已授予 `Career Development Plan` (CDP) 访问权限。这可提供从 `Home` 菜单访问 `Development`\
  \ 选项卡的权限。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig1_HTML.jpg](img/510611_1_En_3_Fig1_HTML.jpg)\n\
  \n**图 3-1** – 职业发展计划权限\n\n保存该角色。对于经理和 HR 经理角色，使用以下路径授予权限：\n\n-   `用户权限` ➤ `职业发展计划`\
  \ ➤ `职业工作表访问权限`\n\n在上一章中，我们学习了如何配置职业路径。如果 HR 经理角色将创建和管理职业路径，则需要额外的权限。HR 角色所需的基于角色的权限位于\
  \ `管理员权限` ➤ `管理职业发展` 中。如图 3-2 所示，授予“管理职业路径”的访问权限。配置职业路径节点是可选的。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig2_HTML.jpg](img/510611_1_En_3_Fig2_HTML.jpg)\n\
  \n**图 3-2** – 管理职业路径权限\n\n> **注意**\n> 仅当使用 `Career Path` V2 时，职业路径节点才可用。使用职业路径节点可为角色提供附加信息，例如职位代码、职位族、该角色中的员工数以及角色能力数。\n\
  \n### 职业工作表模板访问权限\n\n授予对 `Career Worksheet` 模板的权限，以便该角色可以访问职业工作表计划。权限由目标群体定义。由于员工角色可以访问“自己”，员工将只能看到自己的计划。当经理角色拥有模板权限时，他们可以查看其直接下属的职业工作计划。类似地，当\
  \ HR 经理角色拥有此访问权限时，目标群体将是 HR 经理所支持的所有员工。\n\n使用以下路径为员工、经理和 HR 经理角色授予权限：\n\n-   `用户权限`\
  \ ➤ `目标` ➤ `目标计划权限` ➤ `其他` ➤ `Career Worksheet`\n\n访问职业工作表计划的权限设置如图 3-3 所示。\n\n\
  ![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig3_HTML.jpg](img/510611_1_En_3_Fig3_HTML.jpg)\n\
  \n**图 3-3** – 用于职业工作表的目标计划权限\n\n这是对先前授予的 `Career Development Plan` 访问权限以及在发展计划中使用学习活动时的\
  \ `Learning Activity List/Detail View` 的补充。\n\n#### 职业路径权限\n\n所有角色都需要职业路径的访问权限。如果\
  \ HR 经理角色将创建职业路径，则权限会有所不同。\n\n对于员工和经理角色，在 `用户权限` 部分中，转到 `杂项权限` ➤ `职业路径` ➤ `查看可见性`。权限如图\
  \ 3-4 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig4_HTML.jpg](img/510611_1_En_3_Fig4_HTML.jpg)\n\
  \n**图 3-4** – 职业路径权限\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵守您的要求，对给定的英文文本进行翻译。\n\n\nHR 经理角色若需创建职业发展路径，则需要具备职业发展路径的“查看”和“编辑”权限。关于此权限的说明：拥有“查看”和“编辑”权限的角色将能访问所有职业发展路径。`字段级覆盖`选项用于选择在职业发展路径定义中显示或隐藏哪些基本信息元素。\n\
  \n覆盖字段如图 3-5 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig5_HTML.jpg](img/510611_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5 职业发展路径覆盖字段\n\n权限类型为“无访问权限”或“只读”，如图 3-6 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig6_HTML.jpg](img/510611_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6 覆盖权限\n\n当某个字段被选择为“*无访问权限*”时，该字段将被隐藏。如果选择“只读”，则该角色在创建或编辑职业发展路径时将无法使用此字段。\n\
  \n如果您希望限制用户对特定职业发展路径的访问，可以在权限角色的`编辑授权`部分进行设置，如图 3-7 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig7_HTML.jpg](img/510611_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7 限制访问\n\n在`编辑授权`内的步骤 3 中，“为其他对象指定目标群体”，如图 3-8 所示，向下滚动找到`Career Path`。\n\n\
  ![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig8_HTML.jpg](img/510611_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8 指定职业发展路径目标群体\n\n有一个选项可以将目标群体限制为选定的职业发展路径。在下拉菜单中选择限制条件。这些选项在下拉列表中可见，如图 3-9\
  \ 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig9_HTML.jpg](img/510611_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9 限制选项\n\n访问权限可以按外部编码、业务单元、部门或分部进行限制。这些与创建职业发展路径时看到的筛选条件相同，如图 3-10 所示。\n\n\
  ![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig10_HTML.jpg](img/510611_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10 用于限制的职业发展路径字段\n\n接下来，选择用于标识角色被限制访问的职业发展路径的条件和值，如图 3-11 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig11_HTML.jpg](img/510611_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11 用于限制的值\n\n## 角色就绪度的员工权限\n\n员工和经理角色需要在权限设置的`用户权限`部分下的`绩效`中具备`绩效管理访问权限`，如图\
  \ 3-12 所示。这将允许访问`角色就绪度评估`表单。很可能此权限已被授予。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig12_HTML.jpg](img/510611_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12 绩效管理访问权限\n\n员工角色还需要能够启动`角色就绪度评估`表单，因此在`通用用户权限`下授予`创建表单`的权限，并选择`角色就绪度评估`，如图\
  \ 3-13 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig13_HTML.jpg](img/510611_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13 创建角色就绪度评估表单的权限\n\n经理和 HR 经理角色不需要创建`角色就绪度评估`表单的权限，因为只有员工可以从他们的职业工作表中启动此表单。\n\
  \n## 经理和 HR 经理角色的报告权限\n\n如果经理和 HR 经理将要创建或运行关于`职业工作表`目标角色数据的即席报告，则需要创建和运行这些报告的权限。\n\
  \n对于这些角色，请转到`用户权限`部分中的`报告权限`，并启用以下项：\n\n-   `创建报告` ➤ `职业工作表目标角色`\n-   `运行报告` ➤ `职业工作表目标角色`\n\
  \n这些角色还需要访问`CDP 仪表板`。同样在`报告权限`下的`分析磁贴和仪表板`中，启用`CDP 仪表板`。这些权限将允许经理访问其直接下属的报告。HR 经理角色将能够访问其支持的所有员工。\n\
  \n基于角色的权限汇总于表 3-1。\n\n表 3-1 各角色所需权限\n\n| 权限/角色 | 员工角色 | 经理角色 | HR 经理角色 |\n| ---\
  \ | --- | --- | --- |\n| `职业发展规划 ➤ 职业工作表访问权限` | X | X | X |\n| `职业发展规划 ➤ 职业工作表建议角色访问权限`\
  \ | X | | |\n| `管理职业发展 ➤ 管理职业路径` | | | X 可选 |\n| `创建表单权限 ➤ 角色就绪度评估` | X | | |\n\
  | `绩效管理访问权限` | X | X | |\n| `杂项权限 ➤ 职业路径` | X | X | X |\n| `目标 ➤ 目标计划权限 ➤ 职业工作表`\
  \ | X | X | X |\n| `报告权限 ➤ 创建报告 ➤ 职业工作表目标角色` | | X | X |\n| `报告权限 ➤ 运行报告 ➤ 职业工作表目标角色`\
  \ | | X | X |\n| `报告权限 ➤ 分析磁贴和仪表板 ➤ CDP 仪表板` | | X | X |\n\n现在，我们已经为员工、经理和 HR 经理权限角色授予了`职业工作表`的访问权限。接下来，我们将了解`职业工作表`中的功能。\n\
  \n## 员工可用的职业工作表功能\n\n员工在`职业工作表`中可用的特性和功能包括：\n\n-   浏览工作角色\n-   查看建议的角色\n-   浏览角色时查看工作简介\n\
  -   添加目标角色\n-   查看目标角色所需的胜任力\n-   查看所有包含目标角色某项胜任力的角色\n-   启动`角色就绪度评估`表单\n-   查看目标角色的职业发展路径\n\
  -   查看当前角色的职业发展路径\n-   使目标角色在员工资料中可见\n-   为目标角色胜任力添加发展目标\n-   为当前角色胜任力添加发展目标\n-\
  \   查看目标角色中的员工姓名\n-   查看每个目标角色的就绪度指示器\n-   查看目标角色已满足的胜任力\n-   查看目标角色的差距分析\n\n##\
  \ 使用职业工作表\n\n现在我们已经了解了员工可以使用哪些功能，让我们开始吧！\n\n`职业工作表`包含在`职业发展`模块中。员工可以通过点击主页主菜单的下拉菜单并选择`发展`来访问`职业工作表`。默认视图是“发展计划”，如图\
  \ 3-14 所示。点击选项卡切换到“职业工作表”。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig14_HTML.jpg](img/510611_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14 从主页菜单查看发展模块\n\n`职业工作表`，如图 3-15 所示，由两个选项卡组成：`我的工作角色`和`建议的角色`。下图显示了`我的工作角色`选项卡的视图。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig15_HTML.jpg](img/510611_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15 员工首次查看职业工作表的视图\n\n\n\n# 我的工作角色\n\n我们将逐一浏览工作表中的每个选项卡。我们会查看每个选项卡中显示的内容及其工作方式。首先，我们来看一下`我的工作角色`选项卡。\n\
  \n`我的工作角色`包含两个子选项卡：`我正在考虑的工作角色`和`我的当前角色`。每个选项卡的标签都包含一个工作角色数量计数。\n\n`我正在考虑的工作角色`将显示员工选为目标角色的每个工作角色。这可以看作是潜在的未来角色。在员工选中目标角色之前，这里不会显示任何工作角色。在这种情况下，该选项卡会显示“您尚未添加任何角色”，如图\
  \ 3-15 所示。\n\n一旦选中了目标角色，员工将看到他们为胜任该角色所做的准备程度。准备程度基于对目标角色工作角色能力的掌握情况，并通过准备程度仪表盘显示。`准备程度仪表盘`会显示员工准备程度的具体百分比。\n\
  \n在我们查看此屏幕上的可用功能、如何浏览工作角色、查看建议角色或职业路径以及选择目标角色之前，让我们先切换到`我的当前角色`子选项卡。这将让我们有机会熟悉每个子选项卡中的一些组件。一旦我们了解了基础知识，我们将返回到`我正在考虑的工作角色`。\n\
  \n## 我的当前角色选项卡\n\n点击`我的当前角色`以查看与员工当前工作角色相关的信息。屏幕显示如图 3-16 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig16_HTML.jpg](img/510611_1_En_3_Fig16_HTML.jpg)\n\
  \n*图 3-16 我的当前角色选项卡*\n\n`我的当前角色`包含基于职位代码字段与员工关联的工作角色。当前的职位名称列在工作角色能力上方的方框中。提醒一下，一个职位代码只能映射到一个工作角色，但您可以有多个职位代码映射到同一个工作角色。工作角色具有已映射的能力及期望评级。我们将重点关注工作角色的这些期望评级。我们在前一章讨论了定义期望能力的方法。第\
  \ 1 卷，第 3 章描述了将职位代码映射到工作角色的过程，如有任何问题，您可以参考该章节。\n\n在此子选项卡中，您可以看到员工当前工作角色的工作角色能力以及任何相关的**发展目标**。如果员工已完成对工作角色能力进行评级的绩效评估，工作表将使用评估表中的能力评级，并显示与实际评级对比的期望能力评级。\n\
  \n如果这听起来还不清楚，我们稍后会讲到。我们通过先查看当前工作角色来为理解`我正在考虑的工作角色`选项卡奠定基础。\n\n此页面结构使得所有工作角色能力都会列出，并且将包括映射到该工作角色的任何**核心能力**。员工未达到或超过期望评级的能力将首先显示。这些能力将出现在标题“您需要改进\
  \ n 项能力”下，其中`n`是能力的数量，如图 3-17 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig17_HTML.jpg](img/510611_1_En_3_Fig17_HTML.jpg)\n\
  \n*图 3-17 能力未达标的当前角色*\n\n员工能力评级达到或超过期望评级的工作角色能力将显示在标题“您已达标 n 项能力”下，如图 3-18 所示。这些能力将紧随未达标的能力之后。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig18_HTML.jpg](img/510611_1_En_3_Fig18_HTML.jpg)\n\
  \n*图 3-18 实际评级达到或超过期望的工作角色能力视图*\n\n图 3-19 显示了某项能力的详细信息。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig19_HTML.jpg](img/510611_1_En_3_Fig19_HTML.jpg)\n\
  \n*图 3-19 能力详细信息*\n\n点击能力名称右侧的信息图标可查看能力详细信息。\n\n能力详细信息来自能力描述，如图 3-20 所示。可以通过路径`管理工作档案内容\
  \ -> 能力 -> 能力名称`找到。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig20_HTML.jpg](img/510611_1_En_3_Fig20_HTML.jpg)\n\
  \n*图 3-20 能力描述*\n\n回到`我的工作角色`，每个能力下方都有一个差距图。这是员工能力掌握程度与期望能力评级之间差距的可视化表示。该图表标识了员工对该能力的最后一次记录评级与期望评级之间的差异。它使用了`职业工作表`模板\
  \ XML 和提供评级的绩效模板中标识的评级量表。我们在前一章中查看了这两个模板，并指出必须使用相同的评级量表，差距图和准备程度仪表盘才能正常工作。\n\n将鼠标悬停在图表上可查看实际评级与期望评级的对比，如图\
  \ 3-21 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig21_HTML.jpg](img/510611_1_En_3_Fig21_HTML.jpg)\n\
  \n*图 3-21 带有评级的差距图*\n\n图表上看到的期望评级来自工作角色能力期望评级，如图 3-22 所示。请参阅前一章以了解期望能力评级的设置。\n\n\
  ![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig22_HTML.jpg](img/510611_1_En_3_Fig22_HTML.jpg)\n\
  \n*图 3-22 工作角色能力期望分数*\n\n每项员工评级达到或超过期望的能力，将显示绿线（上次评级）覆盖蓝线（期望评级），如图 3-23 所示。如前所述，这些能力会在所有未达标的能力之后显示。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig23_HTML.jpg](img/510611_1_En_3_Fig23_HTML.jpg)\n\
  \n*图 3-23 实际能力评级超过期望能力评级*\n\n实际评级的日期和来源显示在图表下方，如图 3-24 所示。在此示例中，于`09/14/20`完成的`2020\
  \ 年绩效评估征求反馈`表单是能力评级的来源。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig24_HTML.jpg](img/510611_1_En_3_Fig24_HTML.jpg)\n\
  \n*图 3-24 实际能力评级的日期和来源*\n\n提醒一下，系统会使用已完成的绩效表单中最新的评级。\n\n如果有任何与该能力相关的发展目标，它们将反映在差距图右侧的发展目标计数中。要查看发展目标的详细信息，请展开该能力，如图\
  \ 3-25 所示。在此，您可以编辑或删除该能力。此处所做的任何更改都将反映在员工的发展计划中。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig25_HTML.jpg](img/510611_1_En_3_Fig25_HTML.jpg)\n\
  \n*图 3-25 与工作角色能力相关的发展目标*\n\n点击加号，如图 3-26 所示，可为该能力添加发展目标。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig26_HTML.jpg](img/510611_1_En_3_Fig26_HTML.jpg)\n\
  \n\n\n### 3.26 能力项的发展目标计数\n\n添加目标将增加该能力项的发展目标计数，并且该目标会连同关联的能力项一同被添加至发展目标计划中，如图 3-27\
  \ 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig27_HTML.jpg](img/510611_1_En_3_Fig27_HTML.jpg)\n\
  \n### 3.27 为能力项添加发展目标\n\n现在，发展目标已与工作表上的能力项相关联，如图 3-28 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig28_HTML.jpg](img/510611_1_En_3_Fig28_HTML.jpg)\n\
  \n### 3.28 为职位角色能力项新增的发展目标\n\n该发展目标已添加至发展计划，并关联了相应的能力项，如图 3-29 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig29_HTML.jpg](img/510611_1_En_3_Fig29_HTML.jpg)\n\
  \n### 3.29 包含新发展目标与关联能力项的发展计划\n\n现在，我们应该已经熟悉差距图如何工作、衡量的是什么，以及“我的当前角色”中如何显示职位角色能力项。这与“我正在考虑的职位角色”选项卡使用的布局相同，但后者还包含一些我们接下来将要探索的附加功能。\n\
  \n## 我正在考虑的职位角色\n\n在员工选择未来角色之前，“`我正在考虑的职位角色`”子选项卡不会包含任何角色或能力项，如图 3-30 所示。如前所述，未来角色也称为目标角色，这两个术语可以互换使用。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig30_HTML.jpg](img/510611_1_En_3_Fig30_HTML.jpg)\n\
  \n### 3.30 未包含任何角色的“我正在考虑的职位角色”选项卡\n\n一旦选择了某个职位角色，它就会显示在此子选项卡中，并且与该角色关联的能力项也会包含在内。最初，员工可以通过两种方式选择目标角色：浏览职位角色或查看建议角色。选择角色后，还会通过目标角色的职业发展路径提供额外选项。我们将详细研究每种方法。\n\
  \n#### 浏览职位角色\n\n员工可以点击“`浏览职位角色...`”链接来查看所有职位角色，如图 3-31 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig31_HTML.jpg](img/510611_1_En_3_Fig31_HTML.jpg)\n\
  \n### 3.31 浏览职位角色\n\n将弹出一个窗口，按职务族显示所有职位角色。员工可以展开任意职务族以查看其下的角色。示例如图 3-32 所示。\n\n\
  ![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig32_HTML.jpg](img/510611_1_En_3_Fig32_HTML.jpg)\n\
  \n### 3.32 按职务族浏览职位角色\n\n点击某个职位角色的展开图标，可以查看职位描述。这基于该职位角色的职务简介。示例如图 3-33 所示。\n\n\
  ![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig33_HTML.jpg](img/510611_1_En_3_Fig33_HTML.jpg)\n\
  \n### 3.33 职务简介\n\n选择一个角色并点击“`添加角色`”。可以选择任意数量的角色作为目标角色。但是，可以在“`职业工作表 XML`”中设置一个属性来限制所选角色的数量。一旦达到限制，员工将无法选择更多角色，如图\
  \ 3-34 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig34_HTML.jpg](img/510611_1_En_3_Fig34_HTML.jpg)\n\
  \n### 3.34 已达到最大角色数量的提示消息\n\n请回顾前一章，了解如何在“`职业工作表 XML`”中设置此限制。\n\n“`我正在考虑的职位角色`”屏幕将显示新选择的角色，如图\
  \ 3-35 所示。\n\n\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig35_HTML.jpg](img/510611_1_En_3_Fig35_HTML.jpg)\n\
  \n**图 3-35** “我正在考虑的职位角色”子选项卡中的目标角色\n\n在此子选项卡中选择目标角色的另一种方法是使用`查看建议角色...`。\n\n####\
  \ 建议角色\n\n访问建议角色有两种方式。在“我正在考虑的职位角色”中，您可以点击`查看建议角色...`。另一种选择是点击`建议角色`选项卡。这两种选项均在图\
  \ 3-36 中高亮显示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig36_HTML.jpg](img/510611_1_En_3_Fig36_HTML.jpg)\n\
  \n**图 3-36** 查看建议角色的选项\n\n`建议角色`选项卡的权限并非基于角色。换句话说，您无法选择哪些被许可的角色可以查看此选项卡。但是，此选项卡仅在员工查看其职业工作表时可用。如果为经理或人力资源经理角色设置的基于角色的权限授予了对建议角色的访问权限，那么在查看员工的职业工作表时，这两种角色也不会看到此选项。\n\
  \n我们已在上一章中讨论过建议角色的配置。建议角色可以基于系统管理员创建的职业路径，或者基于一组标准的算法。\n\n图 3-37 显示了员工在其职业工作表的“建议角色”选项卡中可能看到的内容示例。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig37_HTML.jpg](img/510611_1_En_3_Fig37_HTML.jpg)\n\
  \n**图 3-37** 建议角色\n\n员工可以使用`能力`或`职务族`筛选器来缩小角色范围，如图 3-38 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig38_HTML.jpg](img/510611_1_En_3_Fig38_HTML.jpg)\n\
  \n**图 3-38** 建议角色筛选器\n\n员工可以根据这些建议角色的能力选择查看建议角色，如图 3-39 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig39_HTML.jpg](img/510611_1_En_3_Fig39_HTML.jpg)\n\
  \n**图 3-39** 基于建议角色能力进行筛选\n\n员工可以按建议角色的任何职务族进行筛选，如图 3-40 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig40_HTML.jpg](img/510611_1_En_3_Fig40_HTML.jpg)\n\
  \n**图 3-40** 按职务族查看建议职位角色\n\n`职务族`筛选器的示例如图 3-41 所示。根据所选筛选器，仅显示四个建议角色。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig41_HTML.jpg](img/510611_1_En_3_Fig41_HTML.jpg)\n\
  \n**图 3-41** 基于职务族筛选器的建议角色\n\n员工可能看不到任何建议角色。图 3-42 显示了一个示例。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig42_HTML.jpg](img/510611_1_En_3_Fig42_HTML.jpg)\n\
  \n**图 3-42** 无可用建议角色\n\n如果员工尚未选择任何目标角色，没有带有能力评分的已完成绩效表格，或者不符合任何建议角色的条件，则可能出现这种情况。通常，一旦员工选择一个角色并返回此页面，建议角色就会显示出来。\n\
  \n可以通过点击每个角色旁边的加号来选择任意或全部建议角色。将显示一条确认消息，如图 3-43 所示。此外，该角色的添加图标将变为非激活状态。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig43_HTML.jpg](img/510611_1_En_3_Fig43_HTML.jpg)\n\
  \n**图 3-43** 建议角色已添加消息\n\n目标角色现在显示在“我正在考虑的职位角色”子选项卡中，如图 3-44 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig44_HTML.jpg](img/510611_1_En_3_Fig44_HTML.jpg)\n\
  \n**图 3-44** “我正在考虑的职位角色”子选项卡中的目标角色\n\n该职位角色所需的能力也将一并列出。如果员工当前的职位角色包含任何相同的能力，则可能会显示差距图；如果员工有针对这些能力的发展目标，则发展目标及其计数也会列出。\n\
  \n您会注意到，准备度仪表显示了这些目标角色的准备度百分比。这是因为员工当前的职位角色包含一些与目标角色相同的能力。员工当前角色的能力评分被用来计算准备度百分比。您还会注意到，五个能力中只有两个有差距图。这是因为员工当前角色只拥有其中两种能力，并且有相应的评分。我们将在本章后面看到，使用“角色准备度评估”表单是一种填充其他能力的方法，因为这种方式会基于目标角色的能力对员工进行评分。\n\
  \n对于目标角色的每项能力，都会显示同样关联了该能力的角色数量，如图 3-45 所示。在“家族与角色”中映射到某项能力的所有职位角色都将作为具备该能力的角色包含在差距图部分。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig45_HTML.jpg](img/510611_1_En_3_Fig45_HTML.jpg)\n\
  \n**图 3-45** 共享该能力的其他角色\n\n点击链接可查看同样具备此项能力的目标角色名称。示例如图 3-46 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig46_HTML.jpg](img/510611_1_En_3_Fig46_HTML.jpg)\n\
  \n**图 3-46** 具备该能力的其他职位角色\n\n### 职业路径\n\n现在员工已选择了目标角色，还可以查看职业路径。员工可以查看目标角色的职业路径。示例如图\
  \ 3-47 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig47_HTML.jpg](img/510611_1_En_3_Fig47_HTML.jpg)\n\
  \n**图 3-47** 查看目标角色职业路径的选项\n\n职业路径将显示出来。示例如图 3-48 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig48_HTML.jpg](img/510611_1_En_3_Fig48_HTML.jpg)\n\
  \n**图 3-48** 目标角色的职业路径\n\n目标角色将带有星标，并以不同颜色（通常为蓝色）显示。\n\n如果员工当前的角色也在该职业路径中，它也会被加上星标。如果员工选择了多个目标角色，也可以在此页面查看这些角色的职业路径。点击`选择要查看的职业路径：`下拉列表，可查看其他目标角色的路径名称，如图\
  \ 3-49 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig49_HTML.jpg](img/510611_1_En_3_Fig49_HTML.jpg)\n\
  \n**图 3-49** 选择查看其他职业路径的选项\n\n点击职业路径中的任意角色，即可查看其职位简介，如图 3-50 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig50_HTML.jpg](img/510611_1_En_3_Fig50_HTML.jpg)\n\
  \n**图 3-50** 目标角色职位简介\n\n还可以从职业路径中添加另一个目标角色。点击某个角色的向下箭头，如图 3-51 所示。\n\n\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig51_HTML.jpg](img/510611_1_En_3_Fig51_HTML.jpg)\n\
  \n**图 3-51** 添加目标角色\n\n也可以从职业工作表中删除现有的目标角色。点击下拉图标可查看删除选项。示例如图 3-52 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig52_HTML.jpg](img/510611_1_En_3_Fig52_HTML.jpg)\n\
  \n**图 3-52** 取消选择目标角色\n\n此处所做的更改将反映在“我考虑的工作角色”子选项卡中。\n\n如果目标角色不属于某个职业路径，则不会有查看该职业路径的选项，如图\
  \ 3-53 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig53_HTML.jpg](img/510611_1_En_3_Fig53_HTML.jpg)\n\
  \n**图 3-53** 无可查看职业路径的目标角色\n\n既然已经选择了目标角色，我们来更详细地了解它们。\n\n## 目标角色功能\n\n每个目标角色都会有一个准备度指示器，包含三个图标：“角色详情”、“将此设为目标角色默认项”和“添加新的学习活动”。示例如图\
  \ 3-54 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig54_HTML.jpg](img/510611_1_En_3_Fig54_HTML.jpg)\n\
  \n**图 3-54** 准备度指示器图标\n\n#### 角色详情\n\n将鼠标悬停在任何目标角色的信息图标上，即可查看职务简介，如图 3-55 所示。\n\n\
  ![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig55_HTML.jpg](img/510611_1_En_3_Fig55_HTML.jpg)\n\
  \n**图 3-55** 目标角色职务简介\n\n#### 默认角色\n\n点击任意目标角色的星形图标可将其设为默认角色，如图 3-56 所示。当该目标角色成为默认目标角色时，星形图标将改变颜色。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig56_HTML.jpg](img/510611_1_En_3_Fig56_HTML.jpg)\n\
  \n**图 3-56** 点击星形图标将该角色设为默认目标角色\n\n#### 添加学习活动\n\n当启用`LMS`时，将显示“添加新的学习活动”图标，如图 3-57\
  \ 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig57_HTML.jpg](img/510611_1_En_3_Fig57_HTML.jpg)\n\
  \n**图 3-57** 添加新的学习活动图标\n\n如果`LMS`与`发展`模块集成，并且您允许用户为发展目标添加学习活动，则员工可以将学习活动分配至其`LMS\
  \ 待办事项列表`。\n\n如图 3-58 所示，员工可以在学习目录中查找活动，或通过能力搜索活动。请注意，当用户从`LMS`中完成的学习项目获得能力评等时，准备度指示器会相应更新。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig58_HTML.jpg](img/510611_1_En_3_Fig58_HTML.jpg)\n\
  \n**图 3-58** 启用 LMS 时的学习活动选项\n\n您可能已开启`LMS`，但未在`发展`模块中使用。在这种情况下，您会看到此图标，但它不会链接到任何内容。`职业工作表`模板`XML`中没有隐藏此图标的选项。\n\
  \n### 目标角色选项\n\n要从“我考虑的工作角色”子选项卡中删除目标角色，请点击目标角色右上角的“X”图标，如图 3-59 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig59_HTML.jpg](img/510611_1_En_3_Fig59_HTML.jpg)\n\
  \n**图 3-59** 删除目标角色\n\n这将从“我考虑的工作角色”子选项卡中移除该目标角色。\n\n## 准备度指示器\n\n如前文所述，映射到工作角色的能力是职业工作表上所列能力的唯一来源。员工对某个角色的准备度是通过将员工的已评能力与目标角色的预期能力评等进行对比来确定的。图表始终使用最新的能力评等，无论其来源如何。\n\
  \n`准备度指示器`会根据情况显示百分比、`0%` 或 `角色未就绪`。如果用户拥有包含目标角色任何能力的已完成绩效表单，则目标角色的`准备度指示器`将显示百分比。但如果员工针对目标角色的能力评等非常低，以至于将准备度计算为`0%`，则百分比可能为\
  \ `0%`。员工可能只具备目标角色所需的一项能力，因此准备度也会计算为`0%`。\n\n在图 3-60 所示的示例中，员工仅具备目标角色的一项能力，且评等低于预期评等。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig60_HTML.jpg](img/510611_1_En_3_Fig60_HTML.jpg)\n\
  \n**图 3-60** 目标角色准备度为 0%\n\n如果员工对目标角色中的任何能力均无评等，则准备度指示器将显示 `角色未就绪`，如图 3-61*所示*。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig61_HTML.jpg](img/510611_1_En_3_Fig61_HTML.jpg)\n\
  \n**图 3-61** 无匹配能力的目标角色\n\n## 员工档案中的职业目标\n\n员工可以将任意或所有目标角色添加到其 `人员档案` 的 `职业目标` 区块中。方法是点击目标角色上的复选框\
  \ `在动态档案中公开`，如图 3-62 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig62_HTML.jpg](img/510611_1_En_3_Fig62_HTML.jpg)\n\
  \n**图 3-62** 将目标角色添加到档案\n\n当员工查看其档案时，该角色将显示出来，如图 3-63 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig63_HTML.jpg](img/510611_1_En_3_Fig63_HTML.jpg)\n\
  \n**图 3-63** 档案中的目标角色\n\n根据权限设置，员工可以在其档案中查看目标角色或编辑目标。其他角色在查看员工档案时也可能被授予查看此区块的权限。\n\
  \n回到职业工作表的“我考虑的工作角色”子选项卡，员工可以看到目标角色中的员工人数，如图 3-64 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig64_HTML.jpg](img/510611_1_En_3_Fig64_HTML.jpg)\n\
  \n**图 3-64** 目标角色中的员工人数\n\n点击该数字可查看与该角色关联的员工姓名，如图 3-65 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig65_HTML.jpg](img/510611_1_En_3_Fig65_HTML.jpg)\n\
  \n**图 3-65** 担任该目标角色的员工姓名\n\n## 角色准备度评估\n\n除了根据员工现有角色当前已评定的能力来评估其转入目标角色的准备度外，还可以仅根据目标角色的能力进行评估。此方法使用\
  \ `角色准备度评估` 表单。员工突出显示一个目标角色，然后点击链接启动 `角色准备度评估` 表单。示例如图 3-66 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig66_HTML.jpg](img/510611_1_En_3_Fig66_HTML.jpg)\n\
  \n**图 3-66** 启动角色准备度评估\n\n\n\n# 发起“岗位胜任度评估”表的好处\n\n发起`岗位胜任度评估`表的好处在于，员工及其直属经理将根据目标岗位所需的能力标准来评估胜任程度，而非依赖当前的能力评级——后者可能并不适用于新岗位。此外，员工可能缺乏目标岗位所需的能力，因此胜任度计算结果可能产生偏差。\n\
  \n只有员工角色才能在职业工作表中发起`岗位胜任度评估`表。经理或人力资源经理无法发起该表，且代理功能不允许用户代表员工发起表单。\n\n使用`岗位胜任度评估`表时，每项能力的差距图评级基于经理的评级和预期能力评级。\n\
  \n在“我考虑的工作岗位”子标签页中，针对任何目标岗位都有一个“评估你的胜任度”链接。点击该链接可直接打开`岗位胜任度评估`表，跳过常规的表单创建步骤。该表已配置为自动填充目标岗位的能力项。示例如图\
  \ 3-67 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig67_HTML.jpg](img/510611_1_En_3_Fig67_HTML.jpg)\n\
  \n**图 3-67** 从职业工作表发起`岗位胜任度评估`表\n\n员工需对每个目标岗位的能力进行自我评分。填写完成后，表单将流转至其经理处进行评分。\n\n\
  经理将在其“绩效收件箱”中收到`岗位胜任度评估`表。经理需根据其对员工掌握每项能力程度的判断提供评分，如图 3-68 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig68_HTML.jpg](img/510611_1_En_3_Fig68_HTML.jpg)\n\
  \n**图 3-68** 经理对目标岗位能力进行评分\n\n表单将返回给员工，供其查看经理评分并设置表单为已完成状态。员工可通过其“绩效收件箱”或返回其职业工作表访问该表单。针对该目标岗位，将显示“岗位胜任度评估进行中”链接，如图\
  \ 3-69 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig69_HTML.jpg](img/510611_1_En_3_Fig69_HTML.jpg)\n\
  \n**图 3-69** 表单进行中\n\n点击该链接将引导员工进入表单并将其设置为已完成状态，如图 3-70 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig70_HTML.jpg](img/510611_1_En_3_Fig70_HTML.jpg)\n\
  \n**图 3-70** 设置为已完成的表单视图\n\n已完成的表单将出现在员工和经理的“绩效已完成”文件夹中。当员工返回工作表时，“胜任度仪表盘”将根据评分显示百分比，如图\
  \ 3-71 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig71_HTML.jpg](img/510611_1_En_3_Fig71_HTML.jpg)\n\
  \n**图 3-71** 评估完成后更新的`胜任度仪表盘`\n\n如果其他目标岗位包含刚评分的相同能力项，这些岗位的`胜任度仪表盘`现在可能显示不同百分比。请参考前一章节中的“岗位能力预期评级”部分，了解如何确定这一数值。\n\
  \n当目标岗位显示“评估你的胜任度”时，可以再次生成该表单。也可为任何其他目标岗位发起表单。重新发起并完成另一份`岗位胜任度评估`表后，将根据每个目标岗位的新评分重新计算胜任度仪表盘和差距图。还可以添加更多待考虑岗位，并针对这些新岗位运行表单。\n\
  \n用户可以根据需要多次重新发起该表单。他们可以对其选择的任何目标岗位重新运行评估。\n\n## 当前岗位的岗位胜任度评估\n\n员工也可以从“我的当前岗位”发起`岗位胜任度评估`表，如图\
  \ 3-72 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig72_HTML.jpg](img/510611_1_En_3_Fig72_HTML.jpg)\n\
  \n**图 3-72** 为当前岗位发起`岗位胜任度评估`\n\n这将使用当前岗位的能力项发起表单，如图 3-73 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig73_HTML.jpg](img/510611_1_En_3_Fig73_HTML.jpg)\n\
  \n**图 3-73** 当前岗位的`岗位胜任度评估`表\n\n该表单将经历与为目标岗位发起表单时相同的步骤。\n\n如图 3-74 所示，完成评估后，当前岗位将在每个差距图中显示更新的能力评分，并显示表单名称和表单完成日期。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig74_HTML.jpg](img/510611_1_En_3_Fig74_HTML.jpg)\n\
  \n**图 3-74** 基于`岗位胜任度评估`更新的差距图\n\n请注意，当前岗位没有`胜任度仪表盘`，但每个能力项都会有差距图。这对员工很有用，他们可以围绕这些能力项制定发展目标。\n\
  \n如果有任何目标岗位使用了这些相同的能力项，其`胜任度仪表盘`和差距图将在“我考虑的工作岗位”子标签页中更新。示例如图 3-75 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig75_HTML.jpg](img/510611_1_En_3_Fig75_HTML.jpg)\n\
  \n**图 3-75** 基于已完成的`岗位胜任度评估`更新的目标岗位差距图\n\n当前岗位已评分的能力项，以及表单名称和完成日期，也会反映在包含这些能力项的任何目标岗位中。需要留意的是：如果你未针对某个目标岗位运行`岗位胜任度评估`表，则该目标岗位的胜任度评级可能源于不同日期、不同来源的评分。\n\
  \n## 职业工作表中“我的当前岗位”的深层链接\n\n在 2020 年上半年版本发布之前，如果员工想查看职业工作表中的当前岗位，他们必须进入“发展”模块，打开“职业工作表”，并将“我的工作角色”子标签页从“我考虑的工作岗位”切换为“我的当前岗位”，如图\
  \ 3-76 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig76_HTML.jpg](img/510611_1_En_3_Fig76_HTML.jpg)\n\
  \n**图 3-76** 在`职业工作表`中查看当前岗位\n\n现在，员工可以从专用主页的“快速链接”磁贴直接进入“职业工作表”中的“我的当前岗位”子标签页，如图\
  \ 3-77 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig77_HTML.jpg](img/510611_1_En_3_Fig77_HTML.jpg)\n\
  \n**图 3-77** 主页上的“快速链接”\n\n\n\n用户会点击“快速链接”磁贴，查看所有可用链接，如图 3-78 所示，这将直接跳转到他们在“职业工作表”中的当前角色。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig79_HTML.jpg](img/510611_1_En_3_Fig79_HTML.jpg)\n\
  \n**图 3-79：** 链接到当前角色\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig78_HTML.jpg](img/510611_1_En_3_Fig78_HTML.jpg)\n\
  \n**图 3-78：** 快速链接到当前角色\n\n点击“我的当前角色职业工作表”链接会将员工直接带到他们的职业工作表，如图 3-79 所示。\n\n## 经理视角的职业工作表\n\
  \n现在我们已经了解了员工在职业工作表中可以执行的操作，让我们来看看经理的视角。\n根据职业工作表模板 XML 和基于角色的权限配置，经理和 HR 经理角色可以访问员工的职业工作表。\n\
  \n任一角色都需要进入他们自己的职业工作表，并进行姓名搜索来访问员工的计划。经理可以查看目标角色的职业路径、浏览角色，以及查看目标角色中的员工，如图 3-80\
  \ 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig80_HTML.jpg](img/510611_1_En_3_Fig80_HTML.jpg)\n\
  \n**图 3-80：** 经理视角的员工“我正在考虑的工作角色”子标签页\n\n经理还可以访问员工的“我的当前角色”子标签页，如图 3-81 所示。\n\n\
  ![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig81_HTML.jpg](img/510611_1_En_3_Fig81_HTML.jpg)\n\
  \n**图 3-81：** 经理视角的员工当前角色\n\n根据权限，经理将能够查看正在考虑的角色、当前角色，以及差距图表和准备就绪度量。他们还可以查看角色的职业路径、浏览工作角色，以及添加待考虑的工作。但是，经理看不到员工的“建议角色”标签页，也无法启动“角色准备就绪评估”表单。\n\
  \n经理和 HR 经理对员工职业工作表的访问可能包括以下内容：\n\n*   浏览工作角色。\n*   查看带有准备就绪度量和差距分析的目标角色。\n*   添加目标角色。\n\
  *   查看职业路径并添加角色。\n*   为目标角色或当前角色上的能力添加发展目标。\n\n经理和 HR 经理没有以下权限：\n\n*   查看“建议角色”标签页。\n\
  *   删除目标角色。\n*   查看建议角色。\n*   启动角色准备就绪评估（代表员工）。\n\n如果允许，HR 经理还可以创建职业路径。\n现在我们已经了解了员工、他们的经理和他们的\
  \ HR 经理在职业工作表中可以做什么。接下来，我们将简要介绍报告选项。\n\n## 职业工作表报告\n\n职业工作表的即席报告功能非常有限。目标角色是职业工作表中唯一可报告的部分。该报告可以显示员工在其职业工作表中选择的所有目标角色。但是，它也会显示当前角色，并且无法区分当前角色和目标角色。\n\
  \n### 即席报告\n\n要创建职业工作表目标角色的即席报告，报告类型为“表格”，如图 3-82 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig82_HTML.jpg](img/510611_1_En_3_Fig82_HTML.jpg)\n\
  \n**图 3-82：** 创建即席报告的报告类型\n\n要选择的域是“职业工作表目标角色”，如图 3-83 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig83_HTML.jpg](img/510611_1_En_3_Fig83_HTML.jpg)\n\
  \n**图 3-83：** 数据源\n\n向导会引导您完成创建报告的步骤。首先，命名报告，并选择要包含的人员。在“数据集”选项卡中，要选择的模板是“职业工作表”，如图\
  \ 3-84 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig84_HTML.jpg](img/510611_1_En_3_Fig84_HTML.jpg)\n\
  \n**图 3-84：** 要选择的模板\n\n从“列”选项卡中，选择要显示的字段，如图 3-85 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig85_HTML.jpg](img/510611_1_En_3_Fig85_HTML.jpg)\n\
  \n**图 3-85：** 报告的输出字段\n\n选择字段和任何筛选条件后，运行报告。该报告将显示员工的当前角色以及目标角色，如图 3-86 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig86_HTML.jpg](img/510611_1_En_3_Fig86_HTML.jpg)\n\
  \n**图 3-86：** 报告结果\n\n## 仪表板\n\n还有一个标准的 CDP 仪表板可以启用。它允许经理查看其团队中员工的目标角色以及每个角色的能力准备就绪情况。\n\
  \n可以从 SuccessStore 添加该仪表板。在搜索栏中输入并选择“管理仪表板”。如图 3-87 所示，点击“管理标准仪表板和 YouCalc 文件”。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig87_HTML.jpg](img/510611_1_En_3_Fig87_HTML.jpg)\n\
  \n**图 3-87：** 管理仪表板\n\n点击“从 SuccessStore 添加”，如图 3-88 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig88_HTML.jpg](img/510611_1_En_3_Fig88_HTML.jpg)\n\
  \n**图 3-88：** 在“管理仪表板”中添加标准 CDP 仪表板\n\n滚动列表，找到“CDP 仪表板”，然后点击“添加到实例”，如图 3-89 所示。\n\
  \n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig89_HTML.jpg](img/510611_1_En_3_Fig89_HTML.jpg)\n\
  \n**图 3-89：** 在“管理仪表板”中添加标准 CDP 仪表板\n\n正如本章开头基于角色的权限中提到的，请确保经理和 HR 角色有权访问此仪表板。在经理和\
  \ HR 经理角色的基于角色的权限中，添加“报告权限” ➤ “分析工具和仪表板” ➤ “其他” ➤ “CDP 仪表板”，如图 3-90 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig90_HTML.jpg](img/510611_1_En_3_Fig90_HTML.jpg)\n\
  \n**图 3-90：** 访问 CDP 仪表板的权限\n\n当仪表板由经理生成时，仪表板概览会显示目标角色计数，如图 3-91 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig91_HTML.jpg](img/510611_1_En_3_Fig91_HTML.jpg)\n\
  \n**图 3-91：** 仪表板上的目标角色计数\n\n经理可以深入查看任何角色，以了解每位员工的准备就绪情况，如图 3-92 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig92_HTML.jpg](img/510611_1_En_3_Fig92_HTML.jpg)\n\
  \n**图 3-92：** 目标角色的深入查看\n\n\n\n#### 职业探索器\n\n职业发展的一个新组件是`职业探索器`。它利用机器学习算法，根据用户“与我相似”的特征来推荐未来职位。`职业探索器`基于组织中与员工情况相似人群的职业路径来推荐职业机会。这使得员工能够发现传统职业路径之外可能的未来角色，并将这些角色设定为自身职业发展的目标。\n\
  \n员工可以查看曾担任其职位或具有相似技能、过往职位、教育背景的用户的职业路径，从而帮助自己确定下一步发展。这提供了有别于使用预定义职业路径决定下一角色的个性化指导。\n\
  \n`职业探索器`如图 3-93 所示。\n\n![../images/510611_1_En_3_Chapter/510611_1_En_3_Fig93_HTML.jpg](img/510611_1_En_3_Fig93_HTML.jpg)\n\
  \n**图 3-93** 职业探索器\n\n员工可使用`职业探索器`查看量身定制的未来职位以供考虑。每个角色都可以查看其能力、技能和其他职位简介详情。员工可以选择一个未来角色，该角色将添加到其职业工作表中。在工作表上，员工会看到目标角色所需具备的能力，这有助于他们识别能力差距和需要发展的领域。\n\
  \n需要说明的是，`职业探索器`仅在 2020 年上半年的早期采用者关怀（EAC）计划中可用。\n\n## 总结\n\n我们已为`职业工作表`授予用户权限。我们了解了员工如何根据\
  \ HR 管理员做出的配置决策来使用`职业工作表`的功能。员工可以利用此工具探索职业路径、查看未来可能期望获得的职位、发现达到这些职位所需技能和能力的差距，并通过发展目标战略性地规划如何弥补这些不足。我们还了解了经理和人力资源经理如何访问员工的职业工作表并针对其目标职位生成报告。我们简要了解了`职业探索器`及其如何与`职业工作表`集成。\n\
  \n# 4. 导师制\n\n导师制是帮助员工个人成长和职业发展的宝贵工具。导师制在提供指导、建议和榜样作用的有经验员工与初级员工之间建立了一种关系。导师可以分享自身职业见解，帮助受指导者设定发展目标、识别兴趣领域，并提供建立人际网络的机会。\n\
  \nSAP SuccessFactors 中的导师解决方案分为两部分。导师管理员将使用`管理导师计划`工具，在`发展`模块之外创建、维护和跟踪导师计划。管理员将创建导师计划、确定参与者、定义匹配导师和受指导者的标准、邀请用户参与、分配和重新分配匹配关系，以及更改计划状态。我们将详细讨论这些功能。该模块与`发展`模块协同工作，以支持员工的发展。\n\
  \n## 导师流程概述\n\n一旦管理员创建了导师计划，就会向选定的员工发送电子邮件邀请，邀请他们加入。邮件包含一个链接，该链接将受邀者引导至`职业发展`模块中一个名为`导师制`的新标签页。所有基于用户的导师任务都在此执行，包括注册导师计划、确定偏好以寻找最佳匹配、接受和拒绝请求，以及结束导师关系。我们将以导师和受指导者的身份体验导师计划的示例。\n\
  \n当计划建立且导师和受指导者匹配成功后，管理员可以更改导师关系、修改导师的可用性、跟踪和报告计划，以及关闭计划。\n\n加入时，导师和受指导者需要明确他们在导师关系中寻求什么。导师/受指导者匹配是通过识别偏好，然后为受指导者找到满足这些需求的导师来完成的。所创建计划类型决定了谁可以加入、如何进行匹配，以及是否需要批准参与。\n\
  \n电子邮件通知在导师计划中使用非常频繁。用户在计划期间可能会收到 24 种导师制通知。这些电子邮件会提示用户在`导师制`概览页面中采取行动。在本章末尾，我们将介绍这些邮件、它们的内容以及触发条件。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- Provisioning 中的导师设置\n- 基于角色的权限\n- 管理导师计划\n- 创建自定义导师计划\n-\
  \ 使用匹配计划\n- 作为参与者使用导师制\n- 电子邮件通知\n- 临时报告\n\n### Provisioning 设置\n\n让我们从使用导师制所需的\
  \ Provisioning 功能开始。\n\n如果您正在使用`职业发展`，这些功能应已在 Provisioning 中启用：\n\n- 元数据框架（MDF）\n\
  - 通用对象\n- 附件管理器\n- CDP 完整版（发展计划）\n- 基于角色的权限\n\n### 导师制设置\n\n要使用导师制，请在`公司设置`中，找到`目标框架`下的`职业与发展规划`部分，勾选`启用导师计划`旁边的复选框，如图\
  \ 4-1 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig1_HTML.jpg](img/510611_1_En_4_Fig1_HTML.jpg)\n\
  \n**图 4-1** 在公司设置中启用导师计划\n\n### 其他可启用选项\n\n根据您的组织情况，您还可以启用其他选项：\n\n- 如果您希望通过使用动态员工组来识别导师参与者，则应启用`动态组\
  \ V2（我的组）`。\n- `SAP Jam`可以与导师制集成以创建 SAP 组。如果您希望使用此功能，则必须在`公司设置`中也启用`SAP Jam 集成`。\n\
  - 对于`临时导师制报告`，请确保已启用“临时报告生成器”，然后启用：\n  - “其他临时子域架构配置”下的“导师计划”\n  - 在人员选择器中“启用从用户开始包含”下的“导师计划”\n\
  \n保存所做的更新。\n\n根据您在导师计划中选择使用的功能，在 Provisioning 中可能还需要执行其他任务。这些项涉及自定义程序和自定义选择列表。我们将在本章后面解释这两项。\n\
  \n一旦在 Provisioning 中启用导师制，就需要在用户界面中设置权限。\n\n\n\n### 基于角色的权限\n\n`Mentoring` 功能通过\
  \ API 调用为导师计划参与者填充数据。数据访问由基于角色的权限控制。管理员、所有者和计划参与者所需的权限将根据他们对计划所需的访问级别而有所不同。这些权限包括用于管理计划的管理员功能，以及允许访问计划的用户功能。此外，`Mentoring`\
  \ 功能使用了元数据框架（`MDF`），这要求所有角色都拥有基本的“读取”和“写入”权限。现在，我们将了解 `Mentoring` 功能所需的角色以及每个角色所需的权限。\n\
  \n## 导师计划管理员角色\n\n您可以决定为人才组中的某个个人创建一个新角色来管理导师计划。在这种情况下，请将该用户分配到一个与此权限角色关联的导师计划权限组。在非常大的组织中，您可能有多个导师计划管理员。您也可以决定将导师计划权限添加到一个现有的\
  \ HR 管理员角色中。\n\n## 导师计划参与者角色\n\n如果您组织中的所有成员都有资格参与导师计划，则可以将导师计划权限添加到员工角色中。如果只有组织的某些部门参与，则可以为这些用户创建一个权限组。然后将新的权限组分配到一个新的导师计划权限角色。\n\
  \n在搜索栏中键入并选择“管理权限角色”。选择要更新的角色。表 4-1 包含了导师计划管理员角色和导师计划用户角色所需的权限。导师和学员拥有相同的权限，因此这些权限不需要单独的权限角色。您可以将权限添加到一个现有的员工权限角色中。或者，正如刚才提到的，如果有一组特定的员工将使用导师计划，您可以确定这些用户来创建一个权限组，然后将他们分配给一个导师计划用户角色。\n\
  \n### 表 4-1 管理和参与导师计划所需的基于角色的权限\n\n| 用户权限部分 | 权限 | 管理员角色 | 导师/学员角色 |\n| --- | ---\
  \ | --- | --- |\n| **常规用户权限** | `公司信息访问 ➤ 用户搜索` | `X` | `X` |\n| | `社区访问` | `X`\
  \ | `X` |\n| **员工数据** | `姓氏, 名字 ➤ 查看` | `X` | `X` |\n| **职业发展计划** | `导师计划访问权限` |\
  \ `X` | `X` |\n| **报告权限** | `为导师计划创建/运行临时报告` |  | `X` |\n| **管理员权限部分** | | | |\n\
  | **元数据框架** | `访问非安全对象` | `X` | `X` |\n| **管理集成工具** | `允许管理员通过基本身份验证访问 OData API`\
  \ | `X` | |\n| **管理职业发展** | `管理导师计划` | `X` | |\n| **管理用户** | `管理员工动态组` | `X` (可选)\
  \ | |\n\n如前所述，`Mentoring` 功能包含与 SAP Jam 的集成。启用后，导师计划管理员可以在建立导师计划时创建 SAP Jam（社区）群组。这为参与者提供了一个额外的协作、培训和讨论平台。要利用此集成，请确保所有参与导师计划的用户都已启用了基于角色的\
  \ SAP Jam 访问权限。\n\n### 选择列表\n\n创建导师计划时，导师计划管理员会设计一个注册表单。注册表单包含一系列导师和学员必须回答的问题才能参与。这些问题用于确定他们在导师关系中寻求的偏好。根据回答和匹配规则，系统会推荐导师/学员配对。问题的答案可以是自由格式文本，也可以基于选择列表中的值。以下列出了可用于回答问题的标准选择列表：\n\
  \n*   能力\n*   部门\n*   事业部\n*   地点\n*   性别\n*   职位族\n*   职位角色\n*   职位代码\n*   职位级别\n\
  *   职位名称\n*   技能\n\n也可以创建自定义选择列表。无论哪种情况，标准选择列表和自定义选择列表都必须在数据模型中定义，并授予“读取”权限。\n\n\
  既然我们已经在 Provisioning 中启用了 `Mentoring` 功能，并设置了基于角色的管理员和导师计划用户权限，那么让我们进一步讨论可以创建的计划类型以及创建它们的步骤。\n\
  \n## 导师计划类型\n\n可以创建三种类型的导师计划：\n\n1.  **公开报名：** 这些计划对所有员工或特定群组开放。计划没有固定的日期，包括结束日期。用户可以注册为导师、学员或两者兼有。可以选择要求导师的参与必须由其经理或导师计划管理员批准。学员必须在注册时选择导师；但是，导师可以拒绝。\n\
  \n2.  **受监督：** 导师计划管理员选择参与计划的导师和学员。管理员必须根据预定义日期手动发送邀请。学员只能在导师注册期结束后才能注册。学员可以指出导师偏好，但不会通知导师批准或拒绝学员。一个匹配程序会为每位学员确定最佳匹配。管理员可以更改任何匹配，然后才会将匹配确认信息发送给导师和学员。\n\
  \n3.  **不受监督：** 不受监督的导师类型是基于邀请的。导师计划管理员选择参与计划的导师和学员，邀请系统会根据导师和学员的注册日期自动生成。管理员也可以手动触发邀请邮件。在注册期间，学员必须选择一位导师。导师会收到请求通知，并可以批准或拒绝该提议。管理员也可以分配或解除分配关系。\n\
  \n表 4-2 突出显示了不同计划类型的一些功能差异。本章稍后将详细讨论这些功能。\n\n### 表 4-2 每种计划类型可用的功能\n\n| 操作/计划类型\
  \ | 受监督 | 不受监督 | 公开报名 |\n| --- | --- | --- | --- |\n| 自动发送邀请 |  | `X` |  |\n| 使用匹配程序识别推荐匹配\
  \ | `X` |  |  |\n| 使用计划日期 | `X` | `X` |  |\n| 导师需批准参与 |  |  | `X` |\n| 计划需要邀请才能参与\
  \ | `X` | `X` |  |\n| 计划对任何有导师计划访问权限的人开放 |  |  | `X` |\n| 可以以学员、导师或两者身份加入计划 |  |\
  \  | `X` |\n| 学员可以选择导师 | `X` | `X` | `X` |\n| 当学员选择导师时，导师会收到一封电子邮件 |  | `X` | `X`\
  \ |\n| 管理员可以分配和重新分配任何匹配 | `X` | `X` | `X` |\n| 导师可以拒绝学员请求 |  | `X` | `X` |\n| 导师可以更改其可用性\
  \ | `X` | `X` | `X` |\n| 仅在单独的导师和学员注册期内注册 | `X` |  |  |\n\n\n\n#### 自定义项目\n\n到目前为止，我们已经了解了三种可用的标准导师计划类型。此外，还可以创建最多三种自定义计划类型。它们具有与标准计划相同的特性和功能，但使用自定义标签。自定义计划提供了灵活性，可以用您自己的标签替换计划中使用的所有导师相关术语。您可能希望将一个计划称为“辅导计划”而不是导师计划。通过创建自定义标签，自定义计划内的屏幕以及电子邮件通知都将使用您的标签。\n\
  \n系统级别的`文本替换`工具会用自定义值覆盖默认文本。在这里，所有导师相关的术语都可以替换为其他标签。这将影响所有标准导师计划的所有标签。计划级别的替换文本用于创建自定义导师计划，其标签仅针对这些计划。最多可以创建三个自定义计划，每个计划都有自己的标签。使用自定义标签创建文本替换包。我们很快就会介绍这个过程。\n\
  \n## 导师管理功能\n\n现在我们将学习如何创建、跟踪和更新导师计划。在搜索栏中输入并选择“管理导师计划”。导师计划概览屏幕将如图 4-2 所示显示。\n\n\
  ![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig2_HTML.jpg](img/510611_1_En_4_Fig2_HTML.jpg)\n\
  \n**图 4-2** 管理导师计划概览页面\n\n所有导师管理任务都在此执行。我们将回顾此页面上的功能以创建和管理导师计划，但首先让我们了解一些在创建任何计划之前可能设置的可选配置。\n\
  \n## 导师计划设置\n\n位于屏幕右上角，点击“设置”链接到导师计划配置。在此处完成的配置将应用于所有导师计划。可以定义两种类型的配置：自定义选择列表和文本替换。\n\
  \n图 4-3 显示了自定义选择列表配置的默认选项卡。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig3_HTML.jpg](img/510611_1_En_4_Fig3_HTML.jpg)\n\
  \n**图 4-3** 导师计划设置\n\n### 自定义选择列表\n\n除了标准选择列表外，管理员还可以在注册问题中使用自定义选择列表。当管理员在创建计划注册表单时选择问题类别时，此处标识的任何自定义选择列表都将可用。这样，在注册过程中回答偏好问题时，就可以使用自定义选择列表的值。\n\
  \n在`自定义选择列表配置`选项卡的下拉列表中，管理员可以标识在设计注册表单时要提供的任何额外选择列表。选择选择列表后，创建选择列表标签。图 4-4 显示了一个示例。这是在创建计划期间选择问题类别时将显示的选择列表名称。\n\
  \n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig4_HTML.jpg](img/510611_1_En_4_Fig4_HTML.jpg)\n\
  \n**图 4-4** 添加自定义选择列表\n\n选择列表标签可以本地化，如图 4-5 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig5_HTML.jpg](img/510611_1_En_4_Fig5_HTML.jpg)\n\
  \n**图 4-5** 本地化自定义选择列表名称\n\n所有用于问题的选择列表都将在设计注册表单时出现在问题类别选择中。在问题类别的下拉列表中，自定义选择列表将按字母顺序显示在标准选择列表之后。\n\
  \n### 自定义计划\n\n点击“设置”中的另一个选项卡。在此选项卡中，管理员将标识最多三个自定义计划的文本替换包。图 4-6 显示了一个示例。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig6_HTML.jpg](img/510611_1_En_4_Fig6_HTML.jpg)\n\
  \n**图 4-6** 用于标识自定义导师计划的文本替换配置选项卡\n\n如果您不打算使用任何自定义计划，则此选项卡中无需输入任何内容。您可以跳过以下详细介绍创建自定义语言包步骤的部分。如果您计划使用自定义计划，请在使用`文本替换配置`选项卡之前定义替换文本。\n\
  \n让我们回到配置中的公司设置。应启用语言包以及“启用管理语言工具”。需要为您使用的每种语言启用语言包。\n\n一旦启用了“管理语言”工具，“管理语言”将在公司设置中可用，如图\
  \ 4-7 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig7_HTML.jpg](img/510611_1_En_4_Fig7_HTML.jpg)\n\
  \n**图 4-7** 在配置中访问“管理语言”\n\n在“管理语言”中，下载默认活动语言的默认标签，如图 4-8 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig8_HTML.jpg](img/510611_1_En_4_Fig8_HTML.jpg)\n\
  \n**图 4-8** 下载标准默认标签\n\n该文件用作查找导师计划中使用的所有标签的参考。如果默认活动语言的自定义区域设置不存在，则创建一个。如果存在，您将向其中添加条目。无论哪种情况，请下载自定义标签文件。新创建的文件只包含一个标题行。我们将使用包含新自定义计划标签的新键来填充它。\n\
  \n使用记事本或任何 UTF-8 编辑器打开默认的`.csv`文件。\n\n按键（A 列）对文件进行排序，以查找所有以`DEVELOPMENT_MENT.`开头的键。这些将是所有与导师相关的标签，如图\
  \ 4-9 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig9_HTML.jpg](img/510611_1_En_4_Fig9_HTML.jpg)\n\
  \n**图 4-9** 默认标签文件中的导师相关标签\n\n我们需要为自定义导师计划类型创建带有自定义标签的自定义键。首先，将所有与导师相关的键从默认文件复制到空的自定义文件或现有的自定义文件中。自定义文件将只包含两列：键和语言。在创建文件时，我们将在\
  \ B 列中使用`en_US`。\n\n检查每个键的标签（B 列），找出任何包含导师相关单词或短语的标签。您可以删除自定义文件中不需要新标签的任何键。一种更费力的方法是进入实例，打开系统语言的调试版本，并查看每个导师屏幕以了解所使用的键和标签。记录所有需要自定义标签的键，并确保这些键将出现在您的自定义文本文件中。\n\
  \n对三个自定义计划的引用必须标识为`TYPEA`、`TYPEB`或`TYPEC`。例如，如果您正在创建一个辅导计划，此自定义计划的所有标签的键中应包含`TYPEA`。如果另一个导师计划是针对学习小组的，则该计划的所有标签的键中应包含`TYPEB`。其他新计划将使用`TYPEC`的标签。\n\
  \n对于您的第一个自定义计划，请使用`TYPEA`。现在，您的自定义文件上应该拥有所有需要新文本的键。您需要将`_TEXTREPLACEHEADING_TYPEA`附加到自定义文件中的每个键上。\n\
  \n\n\n如图 4-10 所示，A 列包含了所有常规的 `DEVELOPMENT_MENTORING` 键，并附带了替换文本键（`_TEXTREPLACEHEADING_TYPEA`）。这些键标识了将在您的第一个自定义程序（`TYPEA`）中使用的所有标签。\n\
  \n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig10_HTML.jpg](img/510611_1_En_4_Fig10_HTML.jpg)\n\
  \n**图 4-10** 用于创建自定义标签的示例文件\n\n对于替换某个单词或短语（例如 mentor、mentee 或 mentoring）的键，请在 B\
  \ 列中提供新的自定义标签。对于需要引用新单词的键，也请使用 `_TEXTREPLACEHEADING_TYPEA` 创建新的键。标签应引用这些新单词键。\n\n\
  在前图所示的文件中，辅导计划键（`DEVELOPMENT_Mentoring_program`）现在在文件上有一个自定义键，名为 `DEVELOPMENT__Mentoring_program_TEXTREPLACEHEADING_TYPEA`，其标签为“Coaching\
  \ Program”。任何引用“mentoring”计划的键都需要创建一个包含 `_TEXTREPLACEHEADING_TYPEA` 的新键名，并且标签需要引用\
  \ `DEVELOPMENT__Mentoring_program_TEXTREPLACEHEADING_TYPEA`，以便将“mentoring program”替换为“coaching\
  \ program”。\n\n文件构建完成后，上传自定义标签文件。要使自定义文本替换功能在其他系统语言中生效，请针对这些语言重复相同的过程。\n\n现在，辅导管理员可以返回实例，在“管理辅导计划”中进入“设置”，以选择要使用的文本替换包。如图\
  \ 4-11 所示，启用并命名所创建的每种类型。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig11_HTML.jpg](img/510611_1_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-11** 为自定义辅导计划确定要使用的自定义语言文本包\n\n在我们演示的示例中，只创建了一个自定义计划。请注意，替换包的键名与添加到自定义文件\
  \ `TEXTREPLACEHEADING_TYPEA` 中键的后缀名称相同。当创建任意标准类型的新计划时，管理员将选择“计划文本替换选项”，并指定要使用的替换包名称。当我们实际创建一个计划时，这一点会更清晰。\n\
  \n## 管理员计划概览页面\n\n更新计划设置后，返回计划概览页面。辅导计划按状态分组。计划将显示在概览页面的“未开始”、“进行中”和“已完成”部分。概览页面的示例如图\
  \ 4-12 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig12_HTML.jpg](img/510611_1_En_4_Fig12_HTML.jpg)\n\
  \n**图 4-12** 辅导计划概览\n\n计划状态描述如下：\n\n- **未开始：** 计划注册仍在进行中；仍需输入信息。\n- **进行中：** 计划已开始，对于开放式计划，它们保持开放直到手动关闭。受监督和不受监督的计划会运行至结束日期。在此阶段无法删除。管理员需要先将状态设置为\
  \ `Complete`。\n- **已完成：** 计划已达到结束日期，不再活跃。只有已完成的计划才能被删除。\n\n单击现有计划将显示“详细信息”选项卡，这是默认选项卡。根据计划类型和状态，还可能有“导师”、“学员”、“问题”和“匹配”选项卡。示例如图\
  \ 4-13 所示。\n\n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig13_HTML.jpg](img/510611_1_En_4_Fig13_HTML.jpg)\n\
  \n**图 4-13** 辅导计划中的选项卡\n\n现在我们已经浏览了概览页面并了解了设置，接下来让我们看看用于创建辅导计划的屏幕。\n\n### 创建新辅导计划\n\
  \n\n\n从概览页面，管理员需点击“创建新辅导计划”。如图 4-14 所示，弹窗将显示计划类型。管理员选择要创建的计划类型后，系统会依次显示一系列引导页面，用于定义计划的参数。根据计划类型的不同，详情页面中的字段和参与者页面会存在一些差异。选择类型后，管理员需点击“继续”按钮开始创建辅导计划。\n\
  \n![../images/510611_1_En_4_Chapter/510611_1_En_4_Fig14_HTML.jpg](img/510611_1_En_4_Fig14_HTML.jpg)\n\
  \n**图 4-14** 创建辅导计划时选择计划类型\n\n所选的计划类型决定了目标受众、是否发送邀请以及是否设置计划日期。你需要在“详细信息”选项卡中标识这些标签。\n\
  \n表 4-3 列出了管理员在创建辅导计划时会用到的页面。根据辅导计划类型的不同，这些页面会存在一些差异。\n\n**表 4-3** 计划页面\n\n| 计划创建页面\
  \ | 描述 | 受监督 | 非受监督 | 公开报名 |\n| --- | --- | --- | --- | --- |\n| 辅导计划详细信息 | 用于命名和定义计划及其设置，并在适用时设置日期。\
