  ## 监控执行器


  “`执行器`”标签页提供了关于 Spark 为应用创建的执行器的摘要信息。一眼就能看到每个执行执行应用任务的执行器的有用指标。


  一个示例如图 11-18 所示。


  ![A978-1-4842-0964-6_11_Fig18_HTML.jpg](img/A978-1-4842-0964-6_11_Fig18_HTML.jpg)


  图 11-18. 监控执行器


  对故障排查有用的一个列是“`存储内存`”列。它显示了为缓存数据保留的内存量以及已使用的内存量。如果可用内存少于你试图缓存的数据量，你将遇到性能问题。


  类似地，“`Shuffle 读取`”和“`Shuffle 写入`”列对于排查性能问题也很有用。Shuffle 读取和写入是开销很大的操作。如果这些值过高，你应该重构应用代码或调优
  Spark 以减少 Shuffle。


  另一个有用的列是“`日志`”列。它包含指向每个执行器生成的日志的超链接。如前所述，你不仅可以用它们来调试应用，还可以深入了解 Spark 内部机制。


