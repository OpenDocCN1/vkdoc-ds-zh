  \ RDD，包含顶点 ID 和顶点数据对。第二个参数是一个用户指定的函数，该函数接受一个三元组作为参数，该三元组包含顶点 ID、当前顶点属性以及输入 RDD 中同一顶点的可选属性。它会为每个顶点返回新属性。\n\
