  \ MLlib\" version=\"1.5.2\"/>\n        <Timestamp>2015-11-21T17:45:09</Timestamp>\n\
  \    </Header>\n    <DataDictionary numberOfFields=\"693\">\n        <DataField\
  \ name=\"field_0\" optype=\"continuous\" dataType=\"double\"/>\n        <DataField\
  \ name=\"field_1\" optype=\"continuous\" dataType=\"double\"/>\n        <DataField\
  \ name=\"field_2\" optype=\"continuous\" dataType=\"double\"/>\n        <DataField\
  \ name=\"field_3\" optype=\"continuous\" dataType=\"double\"/>\n        <DataField\
  \ name=\"field_4\" optype=\"continuous\" dataType=\"double\"/>\n        <DataField\
  \ name=\"field_5\" optype=\"continuous\" dataType=\"double\"/>\n        ...\n```\n\
  \n#### 聚类算法\n\nMLlib 中表示不同聚类算法的类列表包括 `KMeans`、`StreamingKMeans`、`GaussianMixture`、`LDA`\
  \ 和 `PowerIterationClustering`。MLlib 还提供了同名配套单例对象。\n\n下面简要介绍用于训练聚类模型的方法。\n\n#####\
  \ train\n\n`train` 方法由与聚类相关的单例对象提供。它接受一个 `Vector` 类型 `RDD` 和算法特定的超参数作为参数，并返回一个算法特定的聚类模型。\n\
  \n超参数参数和返回的模型类型取决于聚类算法。例如，`KMeans` 对象中 `train` 方法接受的超参数包括：聚类的数量、每次运行的最大迭代次数、并行运行的次数、初始化模式以及用于聚类初始化的随机种子值。它返回一个\
  \ `KMeansModel` 类的实例。\n\n以下示例代码使用 `KMeans` 对象来训练一个 `KMeansModel`。\n\n```\nimport\
  \ org.apache.spark.mllib.clustering.KMeans\nimport org.apache.spark.mllib.linalg.Vectors\n\
  \n// 加载数据\nval lines = sc.textFile(\"data/mllib/kmeans_data.txt\")\n// 将每个文本行转换为\
  \ Double 数组\nval arraysOfDoubles = lines.map{line => line.split(' ').map(_.toDouble)}\n\
  // 将解析后的数据转换为 RDD[Vector]\nval vectors = arraysOfDoubles.map{a => Vectors.dense(a)}.cache()\n\
  val numClusters = 2\nval numIterations = 20\n// 训练一个 KMeansModel\nval kMeansModel\
  \ = KMeans.train(vectors, numClusters, numIterations)\n```\n\n##### run\n\n`run`\
  \ 方法由与聚类相关的类提供。与 `train` 方法类似，它接受一个 `Vector` 类型的 `RDD` 作为参数，并返回一个算法特定的模型。例如，`PowerIterationClustering`\
  \ 类中的 `run` 方法返回一个 `PowerIterationClusteringModel` 类的实例。\n\n以下示例代码使用 `KMeans` 类的实例来训练一个\
  \ `KMeansModel`。\n\n```\nimport org.apache.spark.mllib.clustering.KMeans\nimport\
  \ org.apache.spark.mllib.linalg.Vectors\n\n// 加载数据\nval lines = sc.textFile(\"data/mllib/kmeans_data.txt\"\
  )\n// 将每个文本行转换为 Double 数组\nval arraysOfDoubles = lines.map{line => line.split('\
  \ ').map(_.toDouble)}\n// 将解析后的数据转换为 RDD[Vector]\nval vectors = arraysOfDoubles.map{a\
  \ => Vectors.dense(a)}.cache()\nval numClusters = 2\nval numIterations = 20\n//\
  \ 创建 KMeans 类的实例并设置超参数\nval kMeans = new KMeans().setMaxIterations(numIterations).setK(numClusters)\n\
  // 训练一个 KMeansModel\nval kMeansModel = kMeans.run(vectors)\n```\n\n\n\n#### 聚类模型\n\
  \n表示聚类模型的类包括 `KMeansModel`、`GaussianMixtureModel`、`PowerIterationClusteringModel`、`StreamingKMeansModel`\
  \ 和 `DistributedLDAModel`。这些类的实例由聚类算法相关对象的 `train` 方法和聚类算法相关类的 `run` 方法返回。\n\n接下来简要描述\
  \ `KMeansModel` 类中常用的方法。\n\n##### predict\n\n`predict` 方法返回给定观测值的聚类索引。它接收一个 `Vector`\
  \ 作为参数，并返回一个 `Int` 类型的值。\n\n以下示例代码使用之前训练好的 `KMeansModel` 来确定几个观测值的聚类索引。\n\n```\n\
  val obs1 = Vectors.dense(0.0, 0.0, 0.0)\nval obs2 = Vectors.dense(9.0, 9.0, 9.0)\n\
  val clusterIndex1 = kMeansModel.predict(obs1)\nclusterIndex1: Int = 1\nval clusterIndex2\
  \ = kMeansModel.predict(obs2)\nclusterIndex2: Int = 0\n```\n\n`predict` 方法的一个变体将观测值列表映射到其聚类索引。它接收一个\
  \ `Vector` 类型的 `RDD` 作为参数，并返回一个 `Int` 类型的 `RDD`。\n\n以下示例代码计算了我们之前用于训练 `KMeansModel`\
  \ 的所有训练数据的聚类索引。\n\n```\nval clusterIndicesRDD = kMeansModel.predict(vectors)\nval\
  \ clusterIndices = clusterIndicesRDD.collect()\nclusterIndices: Array[Int] = Array(1,\
  \ 1, 1, 0, 0, 0)\n```\n\n##### computeCost\n\n`computeCost` 方法返回观测值到其最近聚类中心的平方距离之和。它可用于评估\
  \ KMeans 模型。\n\n```\n// Compute Within Set Sum of Squared Errors\nval WSSSE = kMeansModel.computeCost(vectors)\n\
  WSSSE: Double = 0.11999999999994547\n```\n\n##### save\n\n`save` 方法将训练好的聚类模型持久化到磁盘。它接收一个\
  \ `SparkContext` 和路径作为参数，并将源模型保存到指定路径。之后可以使用 `load` 方法读取已保存的模型。\n\n```\nkMeansModel.save(sc,\
  \ \"models/kmean\")\n```\n\n##### load\n\n`load` 方法在伴生模型对象中定义。它从先前保存的模型生成一个模型实例。它接收一个\
  \ `SparkContext` 和已保存模型的路径作为参数，并返回一个聚类模型的实例。\n\n```\nimport org.apache.spark.mllib.clustering.KMeansModel\n\
  val savedKMeansModel = KMeansModel.load(sc, \"models/kmean\")\n```\n\n##### toPMML\n\
  \n`toPMML` 方法以 PMML 格式导出训练好的聚类模型。该方法的多个变体可用于将模型导出到字符串、`OutputStream`、本地文件或分布式文件系统。\n\
  \n```\nval kMeansModelPMML = kMeansModel.toPMML()\nkMeansModelPMML: String =\n\"\
  <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<PMML ExternalRef\"\
  > http://www.dmg.org/PMML-4_2 \">\n    <Header description=\"k-means clustering\"\
  >\n        <Application name=\"Apache Spark MLlib\" version=\"1.5.2\"/>\n      \
  \  <Timestamp>2015-11-22T08:14:43</Timestamp>\n    </Header>\n    <DataDictionary\
  \ numberOfFields=\"3\">\n        <DataField name=\"field_0\" optype=\"continuous\"\
  \ dataType=\"double\"/>\n        <DataField name=\"field_1\" optype=\"continuous\"\
  \ dataType=\"double\"/>\n        <DataField name=\"field_2\" optype=\"continuous\"\
  \ dataType=\"double\"/>\n    </DataDictionary>\n    <ClusteringModel modelName=\"\
  k-means\" functionName=\"clustering\" modelClass=\"centerBased\" numberOfClusters=\"\
  2\">\n        <MiningSchema>\n            <MiningField name=\"field_0\" usageType=\"\
  active\"/>\n            ...\n```\n\n#### 推荐算法\n\nMLlib 支持协同过滤，该技术从仅包含用户标识符、产品标识符和评分的数据集中学习描述用户和产品的潜在特征。在\
  \ MLlib 中，可以使用 ALS（交替最小二乘）算法开发基于协同过滤的推荐系统。MLlib 提供了一个名为 `ALS` 的类，它实现了交替最小二乘矩阵分解。它还提供了一个同名的伴生单例对象。\n\
  \nMLlib 同时支持显式评分和隐式反馈。当用户对产品进行明确评分时，会得到显式评分。例如，用户在 Netflix 上对电影和节目进行评分。类似地，用户在 iTunes、Spotify、Pandora\
  \ 和其他音乐服务上对歌曲进行评分。然而，有时没有显式评分，但可以根据用户活动确定隐式偏好。例如，用户购买产品传达了用户对该产品的隐式反馈。类似地，用户通过点击“喜欢”或“分享”按钮来提供对产品的隐式反馈。\n\
  \n接下来简要描述 `ALS` 对象提供的用于训练推荐模型的方法。\n\n##### train\n\n`ALS` 对象的 `train` 方法使用 `Rating`\
  \ 类型的 `RDD` 来训练或拟合一个 `MatrixFactorizationModel` 模型。它接收一个 `Rating` 类型的 `RDD` 和 ALS\
  \ 特定的超参数作为参数，并返回 `MatrixFactorizationModel` 类的一个实例。ALS 的超参数包括潜在特征数量、迭代次数、正则化因子、并行度级别和随机种子。后三个参数是可选的。\n\
  \n以下示例代码使用显式评分和 `ALS` 对象来训练一个 `推荐模型`。\n\n```\nimport org.apache.spark.mllib.recommendation.ALS\n\
  import org.apache.spark.mllib.recommendation.Rating\n\n// Create a RDD[String] from\
  \ a dataset\nval lines = sc.textFile(\"data/mllib/als/test.data\")\n\n// Transform\
  \ each text line into a Rating\nval ratings = lines.map {line =>\n             \
  \         val Array(user, item, rate) = line.split(',')\n                      Rating(user.toInt,\
  \ item.toInt, rate.toDouble)\n              }\n\nval rank = 10\nval numIterations\
  \ = 10\n\n// Train a MatrixFactorizationModel\nval mfModel = ALS.train(ratings,\
  \ rank, numIterations, 0.01)\n```\n\n##### trainImplicit\n\n当仅有用户对产品的隐式反馈可用时，可以使用\
  \ `trainImplicit` 方法。与 `train` 方法类似，它接收一个 `Rating` 类型的 `RDD` 和 ALS 特定的超参数作为参数，并返回\
  \ `MatrixFactorizationModel` 类的一个实例。\n\n以下代码片段使用隐式反馈和 `ALS` 对象来训练一个 `推荐模型`。\n\n\
  ```\nval rank = 10\nval numIterations = 10\nval alpha = 0.01\nval lambda = 0.01\n\
  \n// Train a MatrixFactorizationModel\nval mfModel = ALS.trainImplicit(feedback,\
  \ rank, numIterations, lambda, alpha)\n```\n\n#### 推荐模型\n\n推荐模型由 `MatrixFactorizationModel`\
  \ 类的一个实例表示。MLlib 还提供了一个同名的伴生对象。接下来简要描述常用的方法。\n\n##### predict\n\n`MatrixFactorizationModel`\
  \ 类中的 `predict` 方法返回给定用户和产品的评分。它接收一个用户 ID 和产品 ID（均为 `Int` 类型）作为参数，并返回一个评分（`Double`\
  \ 类型）。\n\n```\nval userId = 1\nval prodId = 1\nval predictedRating = mfModel.predict(userId,\
  \ prodId)\npredictedRating: Double = 4.997277769473439\n```\n\n`predict` 方法的一个变体接收一个由用户\
  \ ID 和产品 ID 对组成的 `RDD`，并返回一个 `Rating` 类型的 `RDD`。因此，它可用于预测单个用户-产品对的评分，或一系列用户-产品对的评分。\n\
  \n```\n// Create a RDD of user-product pairs\nval usersProducts = ratings.map {\
  \ case Rating(user, product, rate) => (user, product) }\n\n// Generate predictions\
  \ for all the user-product pairs\nval predictions = mfModel.predict(usersProducts)\n\
  \n// Check the first five predictions\nval firstFivePredictions = predictions.take(5)\n\
  firstFivePredictions: Array[org.apache.spark.mllib.recommendation.Rating] = Array(Rating(4,4,4.9959530008728334),\
  \ Rating(4,1,1.000928540744371), Rating(4,2,4.9959530008728334), Rating(4,3,1.000928540744371),\
  \ Rating(1,4,1.0006636186423625))\n```\n\n\n\n##### `recommendProducts`\n\n`recommendProducts`\
  \ 方法用于为指定用户推荐指定数量的产品。它接受用户 ID 和推荐产品数量作为参数，并返回一个 `Rating` 对象的数组。每个 `Rating` 对象包含给定的用户\
  \ ID、产品 ID 以及预测的评分。返回的数组按评分降序排列。高评分表示强推荐。\n\n```\nval userId = 1\nval numProducts\
  \ = 3\nval recommendedProducts = mfModel.recommendProducts(userId, numProducts)\n\
  // recommendedProducts: Array[org.apache.spark.mllib.recommendation.Rating] = Array(Rating(1,1,4.997277769473439),\
  \ Rating(1,3,4.997277769473439), Rating(1,4,1.0006636186423625))\n```\n\n##### `recommendProductsForUsers`\n\
  \n`recommendProductsForUsers` 方法用于为所有用户推荐指定数量的热门产品。它接受推荐产品数量作为参数，并返回一个包含用户及其对应的热门推荐产品的\
  \ RDD。\n\n```\nval numProducts = 2\nval recommendedProductsForAllUsers = mfModel.recommendProductsForUsers(numProducts)\n\
  val rpFor4Users = recommendedProductsForAllUsers.take(4)\n// rpFor4Users: Array[(Int,\
  \ Array[org.apache.spark.mllib.recommendation.Rating])] = Array((1,Array(Rating(1,1,4.997277769473439),\
  \ Rating(1,3,4.997277769473439))), (2,Array(Rating(2,1,4.997277769473439), Rating(2,3,4.997277769473439))),\
  \ (3,Array(Rating(3,4,4.9959530008728334), Rating(3,2,4.9959530008728334))), (4,Array(Rating(4,4,4.9959530008728334),\
  \ Rating(4,2,4.9959530008728334))))\n```\n\n##### `recommendUsers`\n\n`recommendUsers`\
  \ 方法用于为指定产品推荐指定数量的用户。该方法返回一个最可能对给定产品感兴趣的用户列表。它接受产品 ID 和推荐用户数量作为参数，并返回一个 `Rating`\
  \ 对象的数组。每个 `Rating` 对象包含用户 ID、给定的产品 ID 以及评分字段中的分数。数组按评分降序排列。\n\n```\nval productId\
  \ = 2\nval numUsers = 3\nval recommendedUsers = mfModel.recommendUsers(productId,\
  \ numUsers)\n// recommendedUsers: Array[org.apache.spark.mllib.recommendation.Rating]\
  \ = Array(Rating(4,2,4.9959530008728334), Rating(3,2,4.9959530008728334), Rating(1,2,1.0006636186423625))\n\
  ```\n\n##### `recommendUsersForProducts`\n\n`recommendUsersForProducts` 方法用于为所有产品推荐指定数量的用户。它接受推荐用户数量作为参数，并返回一个包含产品及其对应的热门推荐用户的\
  \ RDD。\n\n```\nval numUsers = 2\nval recommendedUsersForAllProducts = mfModel.recommendUsersForProducts(numUsers)\n\
  val ruFor4Products = recommendedUsersForAllProducts.take(4)\n// ruFor4Products:\
  \ Array[(Int, Array[org.apache.spark.mllib.recommendation.Rating])] = Array((1,Array(Rating(1,1,4.997277769473439),\
  \ Rating(2,1,4.997277769473439))), (2,Array(Rating(4,2,4.9959530008728334), Rating(3,2,4.9959530008728334))),\
  \ (3,Array(Rating(1,3,4.997277769473439), Rating(2,3,4.997277769473439))), (4,Array(Rating(4,4,4.9959530008728334),\
  \ Rating(3,4,4.9959530008728334))))\n```\n\n##### `save`\n\n`save` 方法用于将 `MatrixFactorizationModel`\
  \ 持久化到磁盘。它接受一个 `SparkContext` 和路径作为参数，并将源模型保存到指定路径。保存的模型稍后可以通过 `load` 方法读取。\n\n\
  ```\nmfModel.save(sc, \"models/mf-model\")\n```\n\n##### `load`\n\n`load` 方法定义在\
  \ `MatrixFactorizationModel` 对象中，可用于从文件中读取之前保存的模型。它接受一个 `SparkContext` 和保存模型的路径作为参数，并返回一个\
  \ `MatrixFactorizationModel` 类的实例。\n\n```\nimport org.apache.spark.mllib.recommendation.MatrixFactorizationModel\n\
  val savedMfModel = MatrixFactorizationModel.load(sc, \"models/mf-model\")\n```\n\
  \n### 模型评估\n\n如前所述，在将机器学习模型用于新数据之前对其进行评估是一个重要步骤。我们还讨论了一些常用于评估模型有效性的定量指标。幸运的是，我们不需要手动计算这些指标。\n\
  \nMLlib 预置了一些类，可以轻松评估模型。这些类位于 `org.apache.spark.mllib.evaluation` 包中。与模型评估相关的类列表包括：`BinaryClassificationMetrics`、`MulticlassMetrics`、`MultilabelMetrics`、`RankingMetrics`\
  \ 和 `RegressionMetrics`。\n\n#### 回归指标\n\n`RegressionMetrics` 类可用于评估由回归算法生成的模型。它提供计算均方误差、均方根误差、平均绝对误差、R2\
  \ 等指标的方法。\n\n以下示例演示了如何使用 `RegressionMetrics` 类的实例来评估通过回归算法训练的模型。\n\n```\nimport\
  \ org.apache.spark.mllib.linalg.Vectors\nimport org.apache.spark.mllib.regression.LabeledPoint\n\
  import org.apache.spark.mllib.regression.LinearRegressionWithSGD\nimport org.apache.spark.mllib.evaluation.RegressionMetrics\n\
  \n// 从文本文件创建一个 RDD\nval lines = sc.textFile(\"data/mllib/ridge-data/lpsa.data\"\
  )\n\n// 将原始数据集转换为 LabeledPoint 的 RDD\nval labeledPoints = lines.map { line =>\n\
  \  // 将每行拆分为标签和特征\n  val Array(rawLabel, rawFeatures) = line.split(',')\n  // 提取单个特征并将其转换为\
  \ Double 类型\n  val features = rawFeatures.split(' ').map(_.toDouble)\n  // 为每行输入创建一个\
  \ LabeledPoint\n  LabeledPoint(rawLabel.toDouble, Vectors.dense(features))\n}\n\n\
  // 缓存数据集\nlabeledPoints.cache\n\nval numIterations = 100\n\n// 训练模型\nval lrModel\
  \ = LinearRegressionWithSGD.train(labeledPoints, numIterations)\n\n// 创建实际标签和预测标签的\
  \ RDD\nval observedAndPredictedLabels = labeledPoints.map { observation =>\n  val\
  \ predictedLabel = lrModel.predict(observation.features)\n  (observation.label,\
  \ predictedLabel)\n}\n\n// 创建 RegressionMetrics 类的实例\nval regressionMetrics = new\
  \ RegressionMetrics(observedAndPredictedLabels)\n\n// 检查各种评估指标\nval mse = regressionMetrics.meanSquaredError\n\
  // mse: Double = 6.207597210613578\n\nval rmse = regressionMetrics.rootMeanSquaredError\n\
  // rmse: Double = 2.491505009148803\n\nval mae = regressionMetrics.meanAbsoluteError\n\
  // mae: Double = 2.3439822940073354\n```\n\n\n\n#### 二分类指标\n\n`BinaryClassificationMetrics`类可用于评估二分类器。它提供了计算接收者操作特征（ROC）曲线、ROC\
  \ 曲线下面积（AUC）以及其他指标的方法。\n\n以下示例演示如何使用`BinaryClassificationMetrics`类的实例来评估二分类器。\n\n\
  ```\nimport org.apache.spark.mllib.linalg.Vectors\nimport org.apache.spark.mllib.regression.LabeledPoint\n\
  import org.apache.spark.mllib.classification.SVMWithSGD\nimport org.apache.spark.mllib.util.MLUtils\n\
  import org.apache.spark.mllib.evaluation.BinaryClassificationMetrics\n\n// Load\
  \ binary labeled data from a file in LIBSVM format\nval labeledPoints = MLUtils.loadLibSVMFile(sc,\
  \ \"data/mllib/sample_libsvm_data.txt\")\n\n// Split data into training (80%) and\
  \ test (20%) set.\nval Array(trainingData, testData) = labeledPoints.randomSplit(Array(0.8,\
  \ 0.2))\n\n// Persist the training data in memory to speed up the training step\n\
  trainingData.cache()\n\nval numIterations = 100\n\n// Fit a SVM model on the training\
  \ dataset\nval svmModel = SVMWithSGD.train(trainingData, numIterations)\n\n// Clear\
  \ the prediction threshold so that the model returns probabilities\nsvmModel.clearThreshold\n\
  \n// get actual and predicted label for each observation in the test set\nval predictedAndActualLabels\
  \   = testData.map { observation =>\n  val predictedLabel = svmModel.predict(observation.features)\n\
  \  (predictedLabel, observation.label)\n}\n\n// Create an instance of the BinaryClassificationMetrics\
  \ class\nval metrics = new BinaryClassificationMetrics(predictedAndActualLabels)\n\
  \n// Get area under curve\nval auROC = metrics.areaUnderROC()\nauROC: Double = 1.0\n\
  ```\n\n#### 多类分类指标\n\n`MulticlassMetrics`类可用于评估多类或多名义分类器。在多类分类任务中，标签不是二元的。一个观测值可以取多个可能标签中的一个。例如，一个识别动物图像的模型就是多类分类器。一张图像可能具有“猫”、“狗”、“狮子”、“大象”或其他标签。\n\
  \n为了评估多名义分类器，`MulticlassMetrics`类提供了计算精确率、召回率、F 值以及其他指标的方法。\n\n我们将在本章后面展示一个使用`MulticlassMetrics`类的示例。\n\
  \n#### 多标签分类指标\n\n`MultilabelMetrics`类可用于评估多标签分类器。在多标签分类任务中，一个观测值可以有多个标签。多标签数据集与多类数据集之间的区别在于，在多标签分类任务中标签不是互斥的，而在多类分类任务中标签是互斥的。多类分类任务中的一个观测值只能取多个标签中的一个。\n\
  \n多标签分类器的一个例子是，一个将动物分类为不同类别（如哺乳动物、爬行动物、鱼类、鸟类、水生动物、陆生动物或两栖动物）的模型。一种动物可能属于两个类别；鲸鱼既是哺乳动物又是水生动物。\n\
  \n#### 推荐指标\n\n`RankingMetrics`类可用于评估推荐模型。它提供了量化推荐模型预测有效性的方法。\n\n`RankingMetrics`类支持的指标包括平均准确率均值（MAP）、归一化折损累计增益（NDCG）以及前\
  \ k 个结果的准确率（Precision at k）。您可以在 Kalervo Järvelin 和 Jaana Kekäläinen 发表的论文《\"IR\
  \ evaluation methods for retrieving highly relevant documents\"》中阅读这些指标的详细信息。\n\n\
  ### 一个 MLlib 应用示例\n\n在本节中，我们将使用 MLlib API 开发一个监督式机器学习应用。\n\n#### 数据集\n\n我们将使用位于[`https://archive.ics.uci.edu/ml/datasets/Iris`](https://archive.ics.uci.edu/ml/datasets/Iris)的鸢尾花（Iris）数据集。该数据集是机器学习中用于测试分类算法的广泛使用的数据集。\n\
  \nIris 数据集有 150 行或观测值。每行包含鸢尾花的萼片长度、萼片宽度、花瓣长度、花瓣宽度和物种。该数据集包含三种鸢尾花（Setosa、Virginica\
  \ 和 Versicolor）各 50 个样本。\n\n虽然 Iris 数据集很小，但您可以使用相同的代码来训练具有大型数据集的模型。MLlib 可以轻松扩展，可用于训练包含数十亿观测值的数据集模型。\n\
  \n#### 目标\n\n鸢尾花的物种可以根据其萼片和花瓣的长度和宽度来确定。不同的鸢尾花物种具有不同长度和宽度的花瓣和萼片。我们的目标是训练一个多名义分类器，该分类器能够根据给定的萼片长度、萼片宽度、花瓣长度和花瓣宽度预测鸢尾花的物种。\n\
  \n我们将使用鸢尾花的萼片长度、萼片宽度、花瓣长度和花瓣宽度作为特征。植物所属的物种是标签或类别。\n\n\n\n#### 代码\n\n让我们从终端启动 Spark\
  \ shell。Spark shell 可方便地以交互方式训练和使用分类器。\n\n```\npath/to/spark/bin/spark-shell --master\
  \ local[*]\n```\n\n接下来，我们从数据集中创建一个 RDD。\n\n```\nval lines = sc.textFile(\"/path/to/iris.data\"\
  )\n```\n\n机器学习算法需要对数据集进行多次遍历，因此我们将 RDD 缓存到内存中。\n\n```\nlines.persist()\n```\n为了移除数据集中的空行，我们对其进行过滤。\n\
  \n```\nval nonEmpty = lines.filter(_.nonEmpty)\n```\n\n接着，我们提取特征和标签。数据采用 CSV 格式，因此我们拆分每一行。\n\
  \n```\nval parsed = nonEmpty map {_.split(\",\")}\n```\n\nMLlib 算法对 `LabeledPoint`\
  \ 类型的 RDD 进行操作，所以我们需要将 `parsed` 转换为 `LabeledPoint` 的 RDD。你可能还记得，`LabeledPoint` 中的特征和标签字段都是\
  \ `Double` 类型。然而，输入数据集的特征和标签都以字符串形式存在。幸运的是，特征是存储为字符串的数值，因此将特征转换为 `Double` 值很简单。但是，标签是字母字符串，需要转换为数值标签。为了将物种名称转换为\
  \ `Double` 类型的值，我们将使用 `Map` 数据结构将物种名称映射到数字。我们找出数据集中物种列的唯一值，并为每个物种分配一个从 0 开始的索引。\n\
  \n```\nval distinctSpecies = parsed.map{a => a(4)}.distinct.collect\n```\n\n```\n\
  val textToNumeric = distinctSpecies.zipWithIndex.toMap\n```\n\n现在，我们准备从 `parsed`\
  \ 创建一个 `LabeledPoint` 的 RDD。\n\n```\nimport org.apache.spark.mllib.regression.LabeledPoint\n\
  ```\n\n```\nimport org.apache.spark.mllib.linalg.{Vector, Vectors}\n```\n\n```\n\
  val labeledPoints = parsed.map{a =>\n             LabeledPoint(textToNumeric(a(4)),\n\
  \               Vectors.dense(a(0).toDouble, a(1).toDouble, a(2).toDouble, a(3).toDouble))}\n\
  ```\n\n接下来，我们将数据集拆分为训练数据和测试数据。我们将使用 80% 的数据来训练模型，20% 的数据来测试模型。\n\n```\nval dataSplits\
  \ = labeledPoints.randomSplit(Array(0.8, 0.2))\n```\n\n```\nval trainingData = dataSplits(0)\n\
  ```\n\n```\nval testData = dataSplits(1)\n```\n\n现在我们准备训练模型。在此步骤中，您可以使用任何分类算法。我们将使用\
  \ `NaiveBayes` 算法。\n\n```\nimport org.apache.spark.mllib.classification.NaiveBayes\n\
  ```\n\n```\nval model = NaiveBayes.train(trainingData)\n```\n\n这里训练好的模型可用于对鸢尾花进行分类。给定鸢尾花的特征，它可以预测或说出其物种。\n\
  \n如您所见，训练模型很简单；只需调用您要使用的算法的 `train` 方法即可。困难的部分是获取数据并将其转换为机器学习算法可以使用的格式。对于这个示例以及大多数机器学习应用来说，情况都是如此。通常，数据科学家会将大量的时间和精力花费在数据整理或数据清洗活动上。\n\
  \n接下来，让我们在测试数据集上评估我们的模型。评估模型的第一步是让它预测测试数据集中每个观察值的标签。\n\n```\nval predictionsAndLabels\
  \ = testData.map{d => (model.predict(d.features), d.label)}\n```\n\n上述代码创建了一个包含实际标签和预测标签的\
  \ RDD。有了这些信息，我们可以计算各种模型评估指标。例如，我们可以通过将正确预测的数量除以测试数据集中的观察值数量来计算模型的准确率。或者，我们可以使用 `MulticlassMetrics`\
  \ 类来查找模型的精确率、召回率和 F 值。\n\n```\nimport org.apache.spark.mllib.evaluation.MulticlassMetrics\n\
  ```\n\n```\nval metrics = new MulticlassMetrics(predictionsAndLabels)\n```\n\n```\n\
  val recall = metrics.recall\n```\n\n```\nrecall: Double = 0.9117647058823529\n```\n\
  \n```\nval precision = metrics.precision\n```\n\n```\nprecision: Double = 0.9117647058823529\n\
  ```\n\n```\nval fMeasure = metrics.fMeasure\n```\n\n```\nfMeasure: Double = 0.9117647058823529\n\
  ```\n\n## Spark ML\n\nSpark ML 是另一个运行在 Spark 之上的机器学习库。相对于 MLlib 来说，它是一个较新的库。它从 Apache\
  \ Spark 1.2 版本开始可用。它也被称为 Spark 机器学习流水线 API。\n\n与 MLlib 相比，Spark ML 为创建机器学习工作流或流水线提供了更高级的抽象。它使用户能够快速组装和调优机器学习流水线。它可以轻松创建用于训练模型、使用交叉验证调优模型以及使用不同指标评估模型的流水线。\n\
  \nMLlib 库提供的许多类和单例对象，Spark ML 库也提供了。事实上，与机器学习算法和模型相关的类和对象在两个库中具有相同的名称。Spark ML 库提供的类和单例对象可以在\
  \ `org.apache.spark.ml` 包下找到。\n\n通常，机器学习任务包含以下步骤：\n\n读取数据。预处理或准备数据以进行处理。提取特征。拆分数据用于训练、验证和测试。使用训练数据集训练模型。使用交叉验证技术调优模型。在测试数据集上评估模型。部署模型。\n\
  \n每个步骤代表机器学习流水线中的一个阶段。Spark ML 为这些阶段提供了抽象。与 MLlib 相比，使用 Spark ML 更容易将上述步骤组装成机器学习流水线。\n\
  \nSpark ML 引入的关键抽象包括 `Transformer`、`Estimator`、`Pipeline`、`Parameter Grid`、`CrossValidator`\
  \ 和 `Evaluator`。我们将在本节中简要介绍这些抽象。下一节将展示具体的示例。它还展示了它们在机器学习应用中的使用方式。\n\n### ML 数据集\n\
  \nSpark ML 使用 `DataFrame` 作为主要的数据抽象。与 MLlib 不同，Spark ML 提供的机器学习算法和模型对 `DataFrame`\
  \ 进行操作。\n\n如第 7 章所述，`DataFrame` API 为表示结构化数据提供了比 RDD API 更高级的抽象。它支持灵活的 schema，允许不同数据类型的命名列。例如，一个\
  \ `DataFrame` 可以有存储原始数据、特征向量、实际标签和预测标签的不同列。此外，`DataFrame` API 支持多种数据源。\n\n与 RDD\
  \ API 相比，`DataFrame` API 也使数据预处理和特征提取或特征工程更容易。在模型能够拟合数据集之前，通常需要进行数据清洗和特征工程。这些活动构成了机器学习任务中的大部分工作。`DataFrame`\
  \ API 可以轻松地从现有列生成新列，并将其添加到源 `DataFrame` 中。\n\n### 转换器\n\n`Transformer` 从现有的 `DataFrame`\
  \ 生成一个新的 `DataFrame`。它实现了一个名为 `transform` 的方法，该方法接收一个 `DataFrame` 作为输入，并通过向输入的 `DataFrame`\
  \ 追加一个或多个新列来返回一个新的 `DataFrame`。`DataFrame` 是一种不可变的数据结构，因此转换器不会修改输入的 `DataFrame`。相反，它会返回一个新的\
  \ `DataFrame`，其中包含输入 `DataFrame` 中的列和新列。\n\nSpark ML 提供了两种类型的转换器：特征转换器和机器学习模型。\n\
  \n#### 特征转换器\n\n特征转换器通过对输入数据集中的一列应用转换来创建一个或多个新列，并返回一个包含追加的新列的新 `DataFrame`。例如，如果输入数据集包含一个存储句子的列，可以使用特征转换器将句子拆分为单词，并创建一个存储单词数组的新列。\n\
  \n\n\n### 模型\n\n模型代表一个机器学习模型。它接收一个`DataFrame`作为输入，并输出一个新的`DataFrame`，其中包含针对每个输入特征`Vector`的预测标签。输入数据集必须包含一个存储特征`Vector`的列。模型读取包含特征`Vector`的列，为每个特征`Vector`预测一个标签，并返回一个新的`DataFrame`，其中预测标签作为新列追加。\n\
  \n### 估计器\n\n`Estimator`在训练数据集上训练或拟合一个机器学习模型。它代表一个机器学习算法。它实现了一个名为`fit`的方法，该方法接收一个`DataFrame`作为参数，并返回一个机器学习模型。\n\
  \n`Estimator`的一个例子是`LinearRegression`类。它的`fit`方法返回一个`LinearRegressionModel`类的实例。\n\
  \n### 流水线\n\n`Pipeline`按照指定的顺序连接多个转换器和估计器，形成一个机器学习工作流。从概念上讲，它将机器学习工作流中的数据预处理、特征提取和模型训练步骤串联在一起。\n\
  \n`Pipeline`由一系列阶段组成，每个阶段要么是一个`Transformer`，要么是一个`Estimator`。它按照指定的顺序运行这些阶段。\n\n\
  `Pipeline`本身也是一个`Estimator`。它实现了一个`fit`方法，该方法接收一个`DataFrame`作为参数，并将其依次传递到流水线的各个阶段。输入的`DataFrame`在每个阶段都会被转换。`fit`方法返回一个`PipelineModel`，它是一个`Transformer`。\n\
  \n`Pipeline`的`fit`方法按照创建`Pipeline`时指定的顺序，依次调用每个`Transformer`的`transform`方法和每个`Estimator`的`fit`方法。每个`Transformer`接收一个`DataFrame`作为输入，并返回一个新的`DataFrame`，该`DataFrame`成为`Pipeline`中下一个阶段的输入。如果一个阶段是一个`Estimator`，则会调用其`fit`方法来训练一个模型。返回的模型（也是一个`Transformer`）用于转换上一阶段的输出，以产生下一阶段的输入。\n\
  \n### PipelineModel\n\n`PipelineModel`代表一个拟合好的流水线。它由`Pipeline`的`fit`方法生成。它具有与生成它的`Pipeline`相同的阶段，只是其中的`Estimator`被这些估计器训练出的模型所替代。换句话说，所有`Estimator`都被替换成了`Transformer`。\n\
  \n与`Pipeline`（它是一个`Estimator`）不同，`PipelineModel`是一个`Transformer`。它可以应用于数据集，为每个观测值生成预测。实际上，`PipelineModel`是一个`Transformer`序列。当使用`DataFrame`调用`PipelineModel`的`transform`方法时，它会依次调用每个`Transformer`的`transform`方法。每个`Transformer`的`transform`方法输出一个新的`DataFrame`，该`DataFrame`成为序列中下一个`Transformer`的输入。\n\
  \n### 评估器\n\n`Evaluator`评估模型的预测性能或有效性。它提供了一个名为`evaluate`的方法，该方法接收一个`DataFrame`作为输入，并返回一个标量指标。传递给`evaluate`方法的`DataFrame`必须包含名为`label`和`prediction`的列。\n\
  \n### 网格搜索\n\n机器学习模型的性能或质量取决于模型训练期间提供给机器学习算法的超参数。例如，使用逻辑回归算法训练的模型的效果取决于步长和梯度下降迭代次数。\n\
  \n遗憾的是，很难为训练最佳模型选择正确的超参数组合。寻找最佳超参数的技术之一是在超参数空间上进行网格搜索。在网格搜索中，使用来自超参数空间指定子集的每一种超参数组合来训练模型。\n\
  \n例如，考虑一个需要两个实值超参数`p1`和`p2`的训练算法。与其猜测`p1`和`p2`的最佳值，我们可以对`p1`值 0.01、0.1 和 1，以及`p2`值\
  \ 20、40 和 60 进行网格搜索。这会得到`p1`和`p2`的九种不同组合。使用每种`p1`和`p2`的组合训练并评估一个模型。选择能够训练出最佳评估指标模型的组合。\n\
  \n网格搜索代价高昂，但它是比猜测每个超参数的最优值更好的超参数调优方法。通常，这是找到一个性能良好模型的必要步骤。\n\n### CrossValidator\n\
  \n`CrossValidator`为机器学习任务寻找训练最佳模型的最佳超参数值组合。它需要一个`Estimator`、一个`Evaluator`和一个超参数网格。\n\
  \n`CrossValidator`使用 k 折交叉验证和网格搜索进行超参数和模型调优。它将训练数据集分成 k 折，其中 k 是由用户指定的数字。例如，如果 k\
  \ 是 10，那么一个`CrossValidator`将从输入数据集中生成 10 对训练和测试数据集。在每一对中，90%的数据保留用于训练，剩余 10%留出用于测试。\n\
  \n接下来，它从用户指定的不同超参数集合中生成所有超参数组合。对于每种组合，它使用`Estimator`用训练数据集训练一个模型，并使用`Evaluator`在测试数据集上评估生成的模型。它对所有\
  \ k 对训练和测试数据集重复此步骤，并计算每对指定评估指标的平均值。\n\n产生具有最佳平均评估指标模型的超参数被选为最佳超参数。最后，`CrossValidator`使用最佳超参数在整个数据集上训练一个模型。\n\
  \n请注意，使用`CrossValidator`可能非常昂贵，因为它会尝试指定参数网格中的每一种超参数组合。然而，这是一种选择最佳超参数值的成熟方法。在统计上，它比启发式的手动调节方法更好。\n\
  \n### 一个 Spark ML 应用示例\n\n在本节中，我们将使用 Spark ML API 开发一个监督式机器学习应用。\n\n#### 数据集\n\n\
  我们将使用来自[`https://archive.ics.uci.edu/ml/datasets/Sentiment+Labelled+Sentences`](https://archive.ics.uci.edu/ml/datasets/Sentiment+Labelled+Sentences)的情感标注句子数据集。该数据集是为\
  \ Dimitrios Kotzias、Misha Denil、Nando de Freitas 和 Padhraic Smyth 在 KDD 2015 上发表的论文《利用深层特征从群体标签到个体标签》创建的。如果您想尝试本节中展示的代码，请将此数据集下载到您的计算机。\n\
  \n该数据集包含来自三个网站（imdb.com、amazon.com 和 yelp.com）的评论样本。它包含从每个网站随机选择的 500 条正面评论和 500\
  \ 条负面评论。负面情感的评论标记为 0，正面评论标记为 1。评论与其标签之间用制表符分隔。\n\n为简单起见，我们将仅使用来自 imdb.com 的评论。这些评论位于`imdb_labelled.txt`文件中。\n\
  \n#### 目标\n\n我们的目标是训练一个预测模型，用于预测一个句子是正面情感还是负面情感。更具体地说，我们将使用`imdb_labelled.txt`文件中的数据集来训练和评估一个二元分类器。\n\
  \n\n\n#### 代码\n\n我们将使用 Spark Shell 交互式地开发一个机器学习工作流。首先，从终端启动 Spark Shell。\n\n`/path/to/spark/bin/spark-shell\
  \ --master local[*]`\n\n我们从已下载的数据集中创建一个 RDD。请确保为输入文件指定了计算机上的正确路径。\n\n`val lines\
  \ = sc.textFile(\"/path/to/imdb_labelled.txt\")`\n\n如前所述，机器学习算法会对数据集进行多次遍历，因此我们可以通过将输入数据集缓存在内存中来加快运行速度。\n\
  \n`lines.persist()`\n\n为了将数据实际存入内存，我们需要调用一个行动操作。\n\n`lines.count()`\n\n`res1: Long\
  \ = 1000`\n\n由于行动操作会触发计算（这需要从磁盘读取数据），因此上一步也有助于验证是否为 `SparkContext` 的 `textFile`\
  \ 方法提供了正确的文件路径。\n\n原始格式的数据不能直接用于机器学习算法，因此我们需要进行特征提取或特征工程。作为特征工程过程的第一步，我们将每条评论的文本和标签进行拆分。如前所述，评论文本和标签之间用制表符分隔。\n\
  \n`val columns = lines.map{_.split(\"\\\\t\")}`\n\n`columns: org.apache.spark.rdd.RDD[Array[String]]\
  \ = MapPartitionsRDD[2] at map at <console>:23`\n\n上述代码生成一个由 `String` 数组组成的 `RDD`。每个数组的第一个元素是一个句子，第二个元素是其标签。我们可以查看一个条目，如下所示。\n\
  \n`columns.first`\n\n`res2: Array[String] = Array(\"A very, very, very slow-moving,\
  \ aimless movie about a distressed, drifting young man.  \", 0)`\n\n与基于 RDD 的 MLlib\
  \ 不同，Spark ML 基于 DataFrame 进行操作。因此，我们创建一个 DataFrame。\n\n```\nimport sqlContext.implicits._\n\
  case class Review(text: String, label: Double)\nval reviews = columns.map{a => Review(a(0),a(1).toDouble)}.toDF()\n\
  ```\n\n`reviews: org.apache.spark.sql.DataFrame = [text: string, label: double]`\n\
  \n导入语句是隐式地将 RDD 转换为 DataFrame 所必需的。我们创建了 `Review` 样例类来定义数据集的模式。首先，我们从字符串数组的 RDD\
  \ 中创建一个 Reviews 的 RDD。然后，我们调用 `toDF` 方法，该方法会从一个 RDD 创建 DataFrame。\n\n接下来，作为正确性检查，我们验证一下模式，并找出正面和负面评论的数量。\n\
  \n```\nreviews.printSchema\n```\n\n```\nroot\n |-- text: string (nullable = true)\n\
  \ |-- label: double (nullable = false)\n```\n\n```\nreviews.groupBy(\"label\").count.show\n\
  ```\n\n```\n+-----+-----+\n|label|count|\n+-----+-----+\n|  1.0|  500|\n|  0.0|\
  \  500|\n+-----+-----+\n```\n\n为了评估训练模型的质量或性能，我们需要一个测试数据集。因此，我们将保留一部分数据集用于模型测试。\n\
  \n```\nval Array(trainingData, testData) = reviews.randomSplit(Array(0.8, 0.2))\n\
  trainingData.count\ntestData.count\n```\n\n数据尚未转换为机器学习算法可用的格式。我们需要为数据集中的每个句子创建一个特征向量。Spark\
  \ ML 提供了转换器来帮助完成此任务。\n\n```\nimport org.apache.spark.ml.feature.Tokenizer\nval tokenizer\
  \ = new Tokenizer()\n .setInputCol(\"text\")\n .setOutputCol(\"words\")\n```\n\n\
  请注意，如果你想将此代码片段复制并粘贴到 Spark Shell 中，则必须使用 `:paste` REPL 命令。\n\n`Tokenizer` 是一个转换器，它可以将输入字符串转换为小写，并使用空格作为分隔符将其拆分为单词。这里创建的\
  \ `tokenizer` 以 DataFrame 作为输入（该 DataFrame 应有一个名为 `\"text\"` 的列），并输出一个新的 DataFrame，该\
  \ DataFrame 将包含输入 DataFrame 中的所有列以及一个名为 `\"words\"` 的新列。对于 `\"text\"` 列中的每个句子，`\"\
  words\"` 列将其单词存储在一个数组中。\n\n我们可以检查 `tokenizer` 的 `transform` 方法将输出的 DataFrame 的模式，如下所示。\n\
  \n`val tokenizedData = tokenizer.transform(trainingData)`\n\n\n\n`tokenizedData:\
  \ org.apache.spark.sql.DataFrame = [text: string, label: double, words: array<string>]`\n\
  \n接下来，我们创建一个特征向量来表示一个句子。\n\n```\nimport org.apache.spark.ml.feature.HashingTF\n\n\
  val hashingTF = new HashingTF()\n  .setNumFeatures(1000)\n  .setInputCol(tokenizer.getOutputCol)\n\
  \  .setOutputCol(\"features\")\n```\n\n`HashingTF`是一个转换器，用于将单词序列转换为固定长度的特征向量。它通过哈希函数将一组词项映射到它们的词频。\n\
  \n上述代码首先创建了一个`HashingTF`类的实例。接着，它设定了特征数量、用于生成特征向量的输入 DataFrame 列名，以及将包含`HashingTF`生成的特征向量的新列名。\n\
  \n我们可以检查`hashingTF`的`transform`方法将输出的 DataFrame 的模式，如下所示。\n\n```\nval hashedData\
  \ = hashingTF.transform(tokenizedData)\n// hashedData: org.apache.spark.sql.DataFrame\
  \ = [text: string, label: double, words: array<string>, features: vector]\n```\n\
  \n现在，我们已经具备了将原始数据转换为机器学习算法可用的格式所需的转换器。`hashingTF`的`transform`方法生成的 DataFrame 将包含一个名为`\"\
  label\"`的列（用于存储每个标签，类型为`Double`），以及一个名为`\"features\"`的列（用于存储每个观测的特征，类型为`Vector`）。\n\
  \n接下来，我们需要一个估计器来在训练数据集上拟合模型。在这个例子中，我们将使用 Spark ML 库提供的`LogisticRegression`类。它位于`org.apache.spark.ml.classification`包下。\n\
  \n```\nimport org.apache.spark.ml.classification.LogisticRegression\n\nval lr =\
  \ new LogisticRegression()\n  .setMaxIter(10)\n  .setRegParam(0.01)\n```\n\n这段代码创建了一个`LogisticRegression`类的实例，并设置了最大迭代次数和正则化参数。这里我们试图猜测最大迭代次数和正则化参数的最佳值，它们是逻辑回归算法的超参数。稍后我们将展示如何找到这些参数的最优值。\n\
  \n现在，我们已经拥有了组装机器学习流水线所需的所有部件。\n\n```\nimport org.apache.spark.ml.Pipeline\n\nval\
  \ pipeline = new Pipeline()\n  .setStages(Array(tokenizer, hashingTF, lr))\n```\n\
  \n这段代码创建了一个包含三个阶段的`Pipeline`类实例。前两个阶段是转换器，第三个阶段是估计器。`pipeline`对象将首先使用指定的转换器将包含原始数据的\
  \ DataFrame 转换为包含特征向量的 DataFrame。最后，它将使用指定的估计器在训练数据集上训练或拟合模型。\n\n现在，我们准备训练模型。\n\n\
  ```\nval pipeLineModel = pipeline.fit(trainingData)\n```\n\n让我们评估生成的模型在训练数据集和测试数据集上的表现。为此，我们首先获取训练数据集和测试数据集中每个观测的预测结果。\n\
  \n```\nval testPredictions = pipeLineModel.transform(testData)\n// testPredictions:\
  \ org.apache.spark.sql.DataFrame = [text: string, label: double, words: array<string>,\
  \ features: vector, rawPrediction: vector, probability: vector, prediction: double]\n\
  \nval trainingPredictions = pipeLineModel.transform(trainingData)\n// trainingPredictions:\
  \ org.apache.spark.sql.DataFrame = [text: string, label: double, words: array<string>,\
  \ features: vector, rawPrediction: vector, probability: vector, prediction: double]\n\
  ```\n\n请注意，`pipeLineModel`对象的`transform`方法创建了一个包含三个额外列的 DataFrame：`rawPrediction`、`probability`和`prediction`。\n\
  \n我们将使用一个二元分类评估器来评估我们的模型。它需要两个输入列：`rawPrediction`和`label`。\n\n```\nimport org.apache.spark.ml.evaluation.BinaryClassificationEvaluator\n\
  \nval evaluator = new BinaryClassificationEvaluator()\n```\n\n现在，让我们以 ROC 曲线下面积作为指标来评估模型。\n\
  \n```\nimport org.apache.spark.ml.param.ParamMap\n\nval evaluatorParamMap = ParamMap(evaluator.metricName\
  \ -> \"areaUnderROC\")\n\nval aucTraining = evaluator.evaluate(trainingPredictions,\
  \ evaluatorParamMap)\n// aucTraining: Double = 0.9999758519725919\n\nval aucTest\
  \ = evaluator.evaluate(testPredictions, evaluatorParamMap)\n// aucTest: Double =\
  \ 0.6984384037015618\n```\n\n我们的模型在训练数据集上的 AUC 分数接近 1.0，在测试数据集上为 0.69。如前所述，分数越接近\
  \ 1.0 表示模型越完美，分数越接近 0.50 表示模型毫无价值。我们的模型在训练数据集上表现非常好，但在测试数据集上表现不佳。一个模型在其训练所用的数据集上总是表现良好。模型的真实性能体现在它对未见过的测试数据集的表现如何。这就是为什么我们要保留一部分数据集用于测试的原因。\n\
  \n提升模型性能的一种方法是调整其超参数。Spark ML 提供了一个`CrossValidator`类来帮助完成此任务。它需要一个参数网格，以便通过 k 折交叉验证进行网格搜索，从而找到最佳超参数。\n\
  \n让我们构建一个参数网格，用于`CrossValidator`类的实例。\n\n```\nimport org.apache.spark.ml.tuning.ParamGridBuilder\n\
  \nval paramGrid = new ParamGridBuilder()\n  .addGrid(hashingTF.numFeatures, Array(10000,\
  \ 100000))\n  .addGrid(lr.regParam, Array(0.01, 0.1, 1.0))\n  .addGrid(lr.maxIter,\
  \ Array(20, 30))\n  .build()\n\n// paramGrid: Array[org.apache.spark.ml.param.ParamMap]\
  \ =\n// Array({\n//   logreg_0427de6fa5fc-maxIter: 20,\n//   hashingTF_24e660c4963c-numFeatures:\
  \ 10000,\n//   logreg_0427de6fa5fc-regParam: 0.01\n// }, {\n//   logreg_0427de6fa5fc-maxIter:\
  \ 20,\n//   hashingTF_24e660c4963c-numFeatures: 100000,\n//   logreg_0427de6fa5fc-regParam:\
  \ 0.01\n// }, {\n//   logreg_0427de6fa5fc-maxIter: 20,\n//   hashingTF_24e660c4963c-numFeatures:\
  \ 10000,\n//   logreg_0427de6fa5fc-regParam: 0.1\n// },...\n```\n\n这段代码创建了一个参数网格，其中包含两个特征数量值、三个正则化参数值和两个最大迭代次数值。它可以用于在\
  \ 12 种不同的超参数值组合上进行网格搜索。您可以指定更多选项，但训练模型将花费更长时间，因为网格搜索是一种暴力方法，会尝试参数网格中的所有不同组合。如前所述，使用`CrossValidator`进行网格搜索可能会在\
  \ CPU 时间上开销很大。\n\n现在，我们拥有了调优机器学习流水线中转换器和估计器超参数所需的所有部件。\n\n```\nimport org.apache.spark.ml.tuning.CrossValidator\n\
  \nval crossValidator = new CrossValidator()\n  .setEstimator(pipeline)\n  .setEstimatorParamMaps(paramGrid)\n\
  \  .setNumFolds(10)\n  .setEvaluator(evaluator)\n\nval crossValidatorModel = crossValidator.fit(trainingData)\n\
  ```\n\n`CrossValidator`类中的`fit`方法返回一个`CrossValidatorModel`类的实例。与其他模型类类似，它可以用作一个\
  \ Transformer，为给定的特征向量预测标签。\n\n让我们评估这个模型在测试数据集上的性能。\n\n```\nval newPredictions =\
  \ crossValidatorModel.transform(testData)\n// newPredictions: org.apache.spark.sql.DataFrame\
  \ = [text: string, label: double, words: array<string>, features: vector, rawPrediction:\
  \ vector, probability: vector, prediction: double]\n\nval newAucTest = evaluator.evaluate(newPredictions,\
  \ evaluatorParamMap)\n// newAucTest: Double = 0.8182764603817234\n```\n\n如您所见，新模型的性能比之前的模型提升了\
  \ 11%。\n\n最后，让我们找到由`crossValidator`生成的最佳模型。\n\n```\nval bestModel = crossValidatorModel.bestModel\n\
  ```\n\n您可以使用这个模型来分类新的评论。\n\n\n\n## 摘要\n\n机器学习是构建回归、分类、聚类、异常检测和推荐系统的有效技术。它涉及在历史数据上训练或拟合模型，并使用训练好的模型对新数据进行预测。\n\
  \nSpark 提供了两个用于大规模机器学习的库：`MLlib` 和 `Spark ML`。这两个库都为机器学习任务提供了比核心 `RDD API` 更高级别的\
  \ API。在底层，两者都使用 Spark 核心 API。`MLlib` 是 Spark 附带的第一个机器学习库。`Spark ML` 从 Spark 1.2\
  \ 版本开始可用。\n\n`Spark ML` 为开发机器学习流水线或工作流提供了比 `MLlib` 更高级别的抽象。与 `MLlib` 相比，它使得构建机器学习流水线、使用\
  \ k 折交叉验证和网格搜索寻找最佳模型以及评估模型变得更加容易。\n\n"
- "# 9. 使用 Spark 进行图处理\n\n数据通常作为记录或行的集合进行存储和处理。它被表示为一个二维表格，数据被划分为行和列。然而，集合或表格并非表示数据的唯一方式。有时，图比集合能更好地表示数据。\n\
  \n图无处不在。它们遍布我们周围。例如，互联网是一个由互连的计算机、路由器和交换机组成的大型图。万维网是一个大型图。由超文本链接连接的网页构成了一个图。Facebook、LinkedIn\
  \ 和 Twitter 等网站上的社交网络就是图。诸如机场、火车站和公交车站等交通枢纽也可以用图来表示。\n\n对于面向图的数据，图提供了一种易于理解和直观的数据处理模型。此外，还有专门的图算法可用于处理面向图的数据。这些算法为不同的分析任务提供了高效的工具。\n\
  \n本章介绍 Spark 为高效处理大规模面向图的数据所提供的库。但首先，让我们介绍本章中使用的基本图相关术语。\n\n## 图简介\n\n图是一种由顶点和边组成的数据结构（见图\
  \ 9-1）。顶点是图中的一个节点。边连接图中的两个顶点。通常，顶点代表一个实体，边代表两个实体之间的关系。从概念上讲，图相当于顶点集合和边集合。\n\n![A978-1-4842-0964-6_9_Fig1_HTML.gif](img/A978-1-4842-0964-6_9_Fig1_HTML.gif)\n\
  \n图 9-1. 一个图\n\n图可以是有向的或无向的。\n\n### 无向图\n\n无向图是一种边没有方向或朝向的图（见图 9-2）。无向图中的边没有源顶点或目标顶点。\n\
  \n![A978-1-4842-0964-6_9_Fig2_HTML.gif](img/A978-1-4842-0964-6_9_Fig2_HTML.gif)\n\
  \n图 9-2. 一个无向图\n\n### 有向图\n\n有向图是一种边具有方向或朝向的图（见图 9-3）。有向图中的边有源顶点和目标顶点。\n\n![A978-1-4842-0964-6_9_Fig3_HTML.gif](img/A978-1-4842-0964-6_9_Fig3_HTML.gif)\n\
  \n图 9-3. 一个有向图\n\n### 有向多重图\n\n有向多重图是一种包含由两条或多条平行边连接的顶点对的有向图（见图 9-4）。有向多重图中的平行边是具有相同起始顶点和终止顶点的边。它们用于表示一对顶点之间的多重关系。\n\
  \n![A978-1-4842-0964-6_9_Fig4_HTML.gif](img/A978-1-4842-0964-6_9_Fig4_HTML.gif)\n\
  \n图 9-4. 一个有向多重图\n\n### 属性图\n\n属性图是一种有向多重图，其顶点和边都关联着数据（见图 9-5）。属性图中的每个顶点都有属性或特性。同样，每条边都有标签或属性。\n\
  \n![A978-1-4842-0964-6_9_Fig5_HTML.gif](img/A978-1-4842-0964-6_9_Fig5_HTML.gif)\n\
  \n图 9-5. 一个属性图\n\n属性图为处理面向图的数据提供了丰富的抽象。它是使用图进行数据建模的最流行形式。\n\n上图显示了一个属性图，表示一家公司中的两名员工及其关系。\n\
  \n属性图的另一个例子是表示 Twitter 上社交网络的图。用户具有姓名、年龄、性别和位置等属性。此外，用户可以关注其他用户，也可能有粉丝。在表示 Twitter\
  \ 上社交网络的图中，顶点代表用户，边代表“关注”关系。图 9-6 显示了一个简单的例子。\n\n![A978-1-4842-0964-6_9_Fig6_HTML.gif](img/A978-1-4842-0964-6_9_Fig6_HTML.gif)\n\
  \n图 9-6. 一个社交网络图\n\n现在你已经了解了基本的图相关术语。下一节将介绍 `GraphX`。\n\n## GraphX 简介\n\n`GraphX`\
  \ 是一个分布式图分析框架。它是一个扩展 Spark 以进行大规模图处理的 Spark 库。它提供了比 Spark 核心 API 更高级别的图分析抽象。\n\n\
  `GraphX` 既提供基本的图算子，也提供实现图算法的高级算子，例如 `PageRank`、强连通分量和三角形计数。它还提供了 Google `Pregel`\
  \ API 的实现。这些算子简化了图分析任务。\n\n`GraphX` 允许将同一数据作为分布式图或分布式集合进行操作。它提供了类似于 `RDD API` 的集合算子，以及类似于专用图分析库的图算子。因此，它将集合和图统一为一流的可组合对象。\n\
  \n使用 `GraphX` 的一个关键好处是它提供了一个用于完整图分析工作流或流水线的集成平台。图分析流水线通常包括以下步骤：\n\n1.  读取原始数据。\n\
  2.  预处理数据（例如，清洗数据）。\n3.  提取顶点和边以创建属性图。\n4.  切分子图。\n5.  运行图算法。\n6.  分析结果。\n7.  用图的另一个切片重复步骤\
  \ 5 和 6。\n\n其中一些步骤涉及数据计算，一些涉及图计算。原始数据可能位于 XML 文件、数据库表、CSV 文件或其他一些格式中。通常，数据不干净，因此首先进行预处理。之后，提取顶点和边以构建属性图。然后使用图分析库处理该图或其切片。这是一个图计算步骤。预处理数据以及提取顶点和边是数据计算步骤。同样，分析图算法生成的结果是一个数据计算步骤。因此，图分析流水线同时包含数据计算和图计算步骤。\n\
  \n由于 `GraphX` 与 Spark 集成，`GraphX` 用户可以访问 `GraphX` 和 Spark API，包括 `RDD` 和 `DataFrame`\
  \ API。`RDD` 和 `DataFrame` API 简化了数据计算步骤，而 `GraphX` API 简化了图分析步骤。因此，使用 `GraphX`，您可以在单个平台上实现完整的图分析流水线。\n\
  \n## GraphX API\n\n`GraphX API` 提供了用于表示面向图的数据的数据类型和用于图分析的算子。它允许您使用同一数据的图视图或集合视图。\n\
  \n在撰写本书时，`GraphX` 处于 alpha 阶段，正在快速开发中。API 在未来的版本中可能会发生变化。\n\n### 数据抽象\n\n`GraphX`\
  \ 为处理属性图提供的关键数据类型包括 `VertexRDD`、`Edge`、`EdgeRDD`、`EdgeTriplet` 和 `Graph`。\n\n\n\
  好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n---\n\n\n#### VertexRDD\n\
  \n`VertexRDD` 代表属性图中顶点的分布式集合。它提供了属性图中顶点的集合视图。`VertexRDD` 只为每个顶点存储一个条目。此外，它还对条目进行索引以实现快速连接。\n\
  \n每个顶点由一个键值对表示，其中键是唯一的 ID，值是与顶点关联的数据。键的数据类型是 `VertexId`，本质上是一个 64 位的 `Long`。值可以是任何类型。\n\
  \n`VertexRDD` 是一个泛型或参数化类；它需要一个类型参数。它被定义为 `VertexRDD[VD]`，其中类型参数 `VD` 指定了图中每个顶点关联的属性或特性的数据类型。例如，`VD`\
  \ 可以是 `Int`、`Long`、`Double`、`String` 或用户定义的类型。因此，图中的顶点可以由 `VertexRDD[String]`、`VertexRDD[Int]`\
  \ 或某种用户定义类型的 `VertexRDD` 来表示。\n\n#### Edge\n\n`Edge` 类抽象了属性图中的一条有向边。`Edge` 类的实例包含源顶点\
  \ ID、目标顶点 ID 和边属性。\n\n`Edge` 也是一个需要类型参数的泛型类。该类型参数指定了边属性的数据类型。例如，一条边的属性可以是 `Int`、`Long`、`Double`、`String`\
  \ 或用户定义的类型。\n\n#### EdgeRDD\n\n`EdgeRDD` 代表属性图中边的分布式集合。`EdgeRDD` 类根据边属性的数据类型进行参数化。\n\
  \n#### EdgeTriplet\n\n`EdgeTriplet` 类的实例表示一条边及其所连接的两个顶点的组合（见图 9-7）。它存储了一条边的属性以及它所连接的两个顶点的属性。它还包含一条边的源顶点和目标顶点的唯一标识符。\n\
  \n![A978-1-4842-0964-6_9_Fig7_HTML.gif](img/A978-1-4842-0964-6_9_Fig7_HTML.gif)\n\
  \n图 9-7.\n\n一个 EdgeTriplet\n\n`EdgeTriplet` 的集合表示了属性图的一种表格视图。\n\n#### EdgeContext\n\
  \n`EdgeContext` 类将 `EdgeTriplet` 与向边的源顶点和目标顶点发送消息的方法结合起来。\n\n#### Graph\n\n`Graph`\
  \ 是 GraphX 用于表示属性图的抽象；`Graph` 类的实例代表一个属性图。与 RDD 类似，它是不可变的、分布式的且容错的。GraphX 使用顶点分区启发式算法在集群中分区和分布图。如果一台机器发生故障，它会在另一台机器上重新创建分区。\n\
  \n`Graph` 类将属性图和集合统一为可组合的一等对象。一个属性图在概念上等价于一对类型化的 RDD，其中一个 RDD 是顶点的分区集合，另一个是边的分区集合。实际上，`Graph`\
  \ 类提供了将顶点和边作为 RDD 访问的途径。顶点或边的 RDD 可以像任何其他 RDD 一样进行操作。所有 RDD 方法都可用于转换或分析与顶点和边关联的数据。`Graph`\
  \ 类还提供了通过图视图来转换和分析顶点和边的方法。因此，`Graph` 类的实例既可以作为一对集合来处理，也可以作为一个图来处理。\n\n`Graph` 类不仅提供了修改顶点和边属性的方法，还提供了修改属性图结构的方法。由于\
  \ `Graph` 是一种不可变数据类型，任何修改属性或结构的运算符都会返回一个新的属性图。\n\n最重要的是，`Graph` 类提供了一组丰富的运算符来处理和分析属性图。它既提供了基本的图运算符，也提供了可用于实现自定义图算法的高级运算符。它还具有内置的方法来实现图算法，例如\
  \ PageRank、强连通分量和三角形计数。\n\n### 创建图\n\n`Graph` 类的实例可以通过多种方式创建。GraphX 库提供了一个名为 `Graph`\
  \ 的对象，该对象提供了从 RDD 构建图的工厂方法。例如，它提供了一个工厂方法，该方法从表示顶点和边的一对 RDD 创建 `Graph` 类的实例。它还提供了另一种方法，该方法从边的\
  \ RDD 创建图，并为边引用的顶点分配用户提供的默认值。\n\nGraphX 库还提供了一个名为 `GraphLoader` 的对象，其中包含一个名为 `edgeListFile`\
  \ 的方法。`edgeListFile` 方法从包含有向边列表的文件创建 `Graph` 类的实例。每行必须包含两个整数。默认情况下，第一个整数表示源顶点 ID，第二个整数表示目标顶点\
  \ ID。可以通过向 `edgeListFile` 方法传递一个布尔参数来反转默认方向。`edgeListFile` 方法会自动创建边引用的顶点。它将边和顶点的属性都设置为\
  \ 1。\n\n让我们创建一个属性图，表示类似于 Twitter 用户网络的社交网络。在这个属性图中，一个顶点代表一个用户，一条有向边代表“关注”关系。让我们保持图简单，以便于理解和操作。\n\
  \n您将要创建的属性图的视觉表示如图 9-8 所示。顶点中的数字代表顶点 ID。\n\n![A978-1-4842-0964-6_9_Fig8_HTML.gif](img/A978-1-4842-0964-6_9_Fig8_HTML.gif)\n\
  \n图 9-8.\n\n一个社交网络\n\n您可以使用 Spark-shell 交互式地探索 GraphX API。首先，启动 Spark-shell。\n\n\
  ```bash\n$/path/to/spark/bin/spark-shell\n```\n\n进入 Spark-shell 后，导入 GraphX 库。\n\
  \n```scala\nimport org.apache.spark.graphx._\n```\n\n接下来，创建一个 `case class` 来表示用户。每个用户将有两个属性或特性：`name`\
  \ 和 `age`。\n\n```scala\ncase class User(name: String, age: Int)\n```\n\n现在让我们创建一个\
  \ ID 和用户对的 RDD。\n\n```scala\nval users = List((1L, User(\"Alex\", 26)), (2L, User(\"\
  Bill\", 42)), (3L, User(\"Carol\", 18)),\n(4L, User(\"Dave\", 16)), (5L, User(\"\
  Eve\", 45)), (6L, User(\"Farell\", 30)),\n(7L, User(\"Garry\", 32)), (8L, User(\"\
  Harry\", 36)), (9L, User(\"Ivan\", 28)),\n(10L, User(\"Jill\", 48))\n)\nval usersRDD\
  \ = sc.parallelize(users)\n```\n\n前面的代码创建了一个键值对的 RDD，其中键是唯一标识符，值是用户属性。该键代表一个顶点 ID。\n\
  \n接下来，让我们创建一个用户之间连接的 RDD。一个连接可以用 `Edge` 样例类的一个实例来表示。一条边可以有任意数量的属性；但是，为简单起见，为每条边分配一个\
  \ `Int` 类型的单一属性。\n\n```scala\nval follows = List(Edge(1L, 2L, 1), Edge(2L, 3L, 1),\
  \ Edge(3L, 1L, 1), Edge(3L, 4L, 1),\nEdge(3L, 5L, 1), Edge(4L, 5L, 1), Edge(6L,\
  \ 5L, 1), Edge(7L, 6L, 1),\nEdge(6L, 8L, 1), Edge(7L, 8L, 1), Edge(7L, 9L, 1), Edge(9L,\
  \ 8L, 1),\nEdge(8L, 10L, 1), Edge(10L, 9L, 1), Edge(1L, 11L, 1)\n)\nval followsRDD\
  \ = sc.parallelize(follows)\n```\n\n在上面的代码片段中，`Edge` 的第一个参数是源顶点 ID。第二个参数是目标顶点 ID，最后一个参数是边属性。\n\
  \n请注意，有一条边连接了 ID 为 1 的顶点和 ID 为 11 的顶点。但是，ID 为 11 的顶点没有任何属性。GraphX 允许您通过创建一组默认属性来处理这种情况。它将把默认属性分配给那些没有被显式分配任何属性的顶点。\n\
  \n```scala\nval defaultUser = User(\"NA\", 0)\n```\n\n现在您拥有构建属性图所需的所有组件。\n\n```scala\n\
  val socialGraph = Graph(usersRDD, followsRDD, defaultUser)\nsocialGraph: org.apache.spark.graphx.Graph[User,Int]\
  \ = org.apache.spark.graphx.impl.GraphImpl@315576db\n```\n\n\n\n前面的代码片段中的`The Graph`对象会从顶点和边的\
  \ RDD 创建一个`Graph`类的实例。\n\n### Graph 属性\n\n本节简要介绍如何查找属性图的有用信息。\n\n你可以查找属性图中的边数或顶点数，如下所示。\n\
  \n```\nval numEdges = socialGraph.numEdges\n```\n\n```\nnumEdges: Long = 15\n```\n\
  \n```\nval numVertices = socialGraph.numVertices\n```\n\n```\nnumVertices: Long\
  \ = 11\n```\n\n查找属性图中顶点的度数也很容易。顶点的度数是指从该顶点出发或终止于该顶点的边的数量。\n\n```\nval inDegrees\
  \ = socialGraph.inDegrees\n```\n\n```\ninDegrees: org.apache.spark.graphx.VertexRDD[Int]\
  \ = VertexRDDImpl[19] at RDD at VertexRDD.scala:57\n```\n\n```\ninDegrees.collect\n\
  ```\n\n```\nres0: Array[(org.apache.spark.graphx.VertexId, Int)] = Array((4,1),\
  \ (8,3), (1,1), (9,2), (5,3), (6,1), (10,1), (2,1), (11,1), (3,1))\n```\n\n上述输出显示，ID\
  \ 为 4 的顶点有一条入边；ID 为 8 的顶点有三条入边，以此类推。\n\n```\nval outDegrees = socialGraph.outDegrees\n\
  ```\n\n```\noutDegrees: org.apache.spark.graphx.VertexRDD[Int] = VertexRDDImpl[23]\
  \ at RDD at VertexRDD.scala:57\n```\n\n```\noutDegrees.collect\n```\n\n```\nres1:\
  \ Array[(org.apache.spark.graphx.VertexId, Int)] = Array((4,1), (8,1), (1,2), (9,1),\
  \ (6,2), (10,1), (2,1), (3,3), (7,3))\n```\n\n上述输出显示，ID 为 4 的顶点有一条出边；ID 为 8 的顶点有一条出边，以此类推。\n\
  \n```\nval degrees = socialGraph.degrees\n```\n\n```\ndegrees: org.apache.spark.graphx.VertexRDD[Int]\
  \ = VertexRDDImpl[27] at RDD at VertexRDD.scala:57\n```\n\n```\ndegrees.collect\n\
  ```\n\n```\nres2: Array[(org.apache.spark.graphx.VertexId, Int)] = Array((4,2),\
  \ (8,4), (1,3), (9,3), (5,3), (6,3), (10,2), (2,2), (11,1), (3,4), (7,3))\n```\n\
  \n接下来的代码片段展示了如何获取属性图中顶点、边和三元组的集合视图。\n\n```\nval vertices = socialGraph.vertices\n\
  ```\n\n```\nvertices: org.apache.spark.graphx.VertexRDD[User] = VertexRDDImpl[11]\
  \ at RDD at VertexRDD.scala:57\n```\n\n```\nval edges = socialGraph.edges\n```\n\
  \n```\nedges: org.apache.spark.graphx.EdgeRDD[Int] = EdgeRDDImpl[13] at RDD at EdgeRDD.scala:40\n\
  ```\n\n```\nval triplets = socialGraph.triplets\n```\n\n```\ntriplets: org.apache.spark.rdd.RDD[org.apache.spark.graphx.EdgeTriplet[User,Int]]\
  \ = MapPartitionsRDD[32] at mapPartitions at GraphImpl.scala:51\n```\n\n```\ntriplets.take(3)\n\
  ```\n\n```\nres7: Array[org.apache.spark.graphx.EdgeTriplet[User,Int]] = Array(((1,User(Alex,26)),(2,User(Bill,42)),1),\
  \ ((2,User(Bill,42)),(3,User(Carol,18)),1), ((3,User(Carol,18)),(1,User(Alex,26)),1))\n\
  ```\n\n属性图中三元组的集合视图允许你将图处理为一个包含源顶点、目标顶点和边属性的表。示例如下。\n\n```\nval follows = triplets.map{\
  \ t => t.srcAttr.name + \" follows \" + t.dstAttr.name}\n```\n\n```\nfollows: org.apache.spark.rdd.RDD[String]\
  \ = MapPartitionsRDD[35] at map at <console>:40\n```\n\n```\nfollows.take(5)\n```\n\
  \n```\nres8: Array[String] = Array(Alex follows Bill, Bill follows Carol, Carol\
  \ follows Alex, Carol follows Dave, Carol follows Eve)\n```\n\n### Graph 运算符\n\n\
  本节简要介绍`Graph`类中的关键方法。这些方法也被称为运算符。`Graph`运算符可以分为以下几类：\n\n-   属性变换\n-   结构变换\n-  \
  \ 连接\n-   聚合\n-   图并行计算\n-   图算法\n\n#### 属性变换运算符\n\n属性变换运算符允许你更改图中边或顶点的属性。请记住，`Graph`是不可变的；一个变换运算符永远不会就地修改图。相反，它会返回一个具有修改后属性的新图。\n\
  \n##### mapVertices\n\n`mapVertices`方法对属性图中的每个顶点应用用户指定的变换。它是一个高阶方法，接受一个函数作为参数并返回一个新图。提供给`mapVertices`方法的函数接受一对顶点\
  \ ID 和顶点属性作为参数，并返回新的顶点属性。\n\n下一个示例展示了如何使用`mapVertices`方法增加你之前创建的社交图中每个用户的年龄。\n\n\
  ```\nval updatedAges = socialGraph.mapVertices( (vertexId, user) =>\n          \
  \          User(user.name, user.age + 1 ))\n```\n\n```\nupdatedAges: org.apache.spark.graphx.Graph[User,Int]\
  \ =\norg.apache.spark.graphx.impl.GraphImpl@1b8f47c6\n```\n\n```\nsocialGraph.vertices.take(5)\n\
  ```\n\n```\nres9: Array[(org.apache.spark.graphx.VertexId, User)] = Array((4,User(Dave,16)),\
  \ (8,User(Harry,36)), (1,User(Alex,26)), (9,User(Ivan,28)), (5,User(Eve,45)))\n\
  ```\n\n```\nupdatedAges.vertices.take(5)\n```\n\n```\nres10: Array[(org.apache.spark.graphx.VertexId,\
  \ User)] = Array((4,User(Dave,17)), (8,User(Harry,37)), (1,User(Alex,27)), (9,User(Ivan,29)),\
  \ (5,User(Eve,46)))\n```\n\n##### mapEdges\n\n`mapEdges`方法对属性图中的每条边应用用户指定的变换。与`mapVertices`方法类似，它是一个高阶方法，接受一个函数作为参数并返回一个新图。提供给`mapEdges`方法的函数接受边的属性作为参数，并返回新的边属性。\n\
  \n下一个示例将每条边的标签从整数修改为字符串。\n\n```\nval followsGraph = socialGraph.mapEdges( (n) =>\
  \ \"follows\")\n```\n\n```\nfollowsGraph: org.apache.spark.graphx.Graph[User,String]\
  \ =\norg.apache.spark.graphx.impl.GraphImpl@57be3dc2\n```\n\n```\nsocialGraph.edges.take(5)\n\
  ```\n\n```\nres11: Array[org.apache.spark.graphx.Edge[Int]] = Array(Edge(1,2,1),\
  \ Edge(2,3,1), Edge(3,1,1), Edge(3,4,1), Edge(3,5,1))\n```\n\n```\nfollowsGraph.edges.take(5)\n\
  ```\n\n```\nres12: Array[org.apache.spark.graphx.Edge[String]] = Array(Edge(1,2,follows),\
  \ Edge(2,3,follows), Edge(3,1,follows), Edge(3,4,follows), Edge(3,5,follows))\n\
  ```\n\n##### mapTriplets\n\n`mapTriplets`方法对属性图中的每个三元组应用用户指定的变换。它是一个高阶方法，接受一个函数作为参数并返回一个新图。\n\
  \n`mapTriplets`方法与`mapEdges`方法类似；两者都通过修改源图中每条边的属性来返回一个新图。但是，提供给`mapTriplets`方法的输入函数接受一个`EdgeTriplet`作为参数，而`mapEdges`方法的函数参数接受一个`Edge`作为参数。\n\
  \n示例社交图中的每条边都有一个整数属性，其值始终为 1。假设你希望根据源顶点和目标顶点更改边的标签。以下代码片段将年龄大于 30 的关注者的边标签更改为 2。\n\
  \n```\nval weightedGraph = socialGraph.mapTriplets{ t =>\n                     \
  \                          if (t.srcAttr.age >= 30)\n                          \
  \                       2\n                                               else\n\
  \                                                 1\n                          \
  \                 }\n```\n\n```\nweightedGraph: org.apache.spark.graphx.Graph[User,Int]\
  \ = org.apache.spark.graphx.impl.GraphImpl@15c484a1\n```\n\n```\nsocialGraph.edges.take(10)\n\
  ```\n\n```\nres15: Array[org.apache.spark.graphx.Edge[Int]] = Array(Edge(1,2,1),\
  \ Edge(2,3,1), Edge(3,1,1), Edge(3,4,1), Edge(3,5,1), Edge(4,5,1), Edge(6,5,1),\
  \ Edge(6,8,1), Edge(7,6,1), Edge(7,8,1))\n```\n\n```\nweightedGraph.edges.take(10)\n\
  ```\n\n```\nres16: Array[org.apache.spark.graphx.Edge[Int]] = Array(Edge(1,2,1),\
  \ Edge(2,3,2), Edge(3,1,1), Edge(3,4,1), Edge(3,5,1), Edge(4,5,1), Edge(6,5,2),\
  \ Edge(6,8,2), Edge(7,6,2), Edge(7,8,2))\n```\n\n#### 结构变换运算符\n\n此类别中的运算符返回一个与调用该运算符的图在结构上不同的图。从概念上讲，它们会改变图的结构或返回一个子图。但是，请记住，`Graph`是不可变的；这些运算符会创建一个新图。\n\
  \n\n\n##### `reverse`\n\n`reverse` 方法反转属性图中所有边的方向，并返回一个新的属性图。\n\n以下代码片段反转了示例社交图中的“追随”关系。\n\
  \n```\nval reverseGraph = socialGraph.reverse\n```\n\n```\nreverseGraph.triplets.map{\
  \ t => t.srcAttr.name + \" follows \" + t.dstAttr.name}.take(10)\n```\n\n```\nres21:\
  \ Array[String] = Array(Alex follows Carol, Bill follows Alex, Carol follows Bill,\
  \ Dave follows Carol, Eve follows Carol, Eve follows Dave, Eve follows Farell, Farell\
  \ follows Garry, Harry follows Farell, Harry follows Garry)\n```\n\n```\nsocialGraph.triplets.map{\
  \ t => t.srcAttr.name + \" follows \" + t.dstAttr.name}.take(10)\n```\n\n```\nres22:\
  \ Array[String] = Array(Alex follows Bill, Bill follows Carol, Carol follows Alex,\
  \ Carol follows Dave, Carol follows Eve, Dave follows Eve, Farell follows Eve, Farell\
  \ follows Harry, Garry follows Farell, Garry follows Harry)\n```\n\n##### `subgraph`\n\
  \n`subgraph` 方法对每个顶点和边应用用户指定的过滤器，并返回源图的一个子图。从概念上讲，它类似于 RDD 的 `filter` 方法。\n\n`subgraph`\
