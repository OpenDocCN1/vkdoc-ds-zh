  Spark 作业。




  ## 概述


  Spark 对外暴露了大量的监控指标，并且预先打包了基于 Web 的应用，可用于监控 Spark 独立集群和 Spark 应用程序。此外，它还支持第三方监控工具，例如
  Graphite、Ganglia 以及基于 JMX 的控制台。


  Spark 提供的监控功能既有助于排查问题，也有助于优化应用程序性能。监控 Web UI 可以帮助您发现配置问题和性能瓶颈。如果某个作业耗时过长，您可以使用 Web
  UI 进行分析和排查。同样，如果应用程序崩溃，监控 UI 可让您远程检查日志文件并诊断问题。

