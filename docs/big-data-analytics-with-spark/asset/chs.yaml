  ## 监控 Spark Streaming 应用


  如果你正在运行 Spark Streaming 应用，Web UI 会显示一个标签页用于可视化其执行过程。“`流`”标签页展示了对于排查 Spark Streaming
  应用有用的指标。


  一个示例如图 11-19 所示。


  ![A978-1-4842-0964-6_11_Fig19_HTML.jpg](img/A978-1-4842-0964-6_11_Fig19_HTML.jpg)


  图 11-19. 监控 Spark Streaming


  “`流`”标签页展示了一个信息丰富的页面，包含许多有用的指标。它显示了检测 Spark Streaming 应用性能问题的关键指标。


  你应特别关注的指标是数据流中微批次的平均调度延迟和平均处理时间。调度延迟是一个微批次等待前一个微批次完成的时间。平均调度延迟应几乎为零。这意味着微批次的平均处理时间应小于批处理间隔。如果平均处理时间小于批处理间隔，Spark
  Streaming 会在下一个微批次创建之前完成对当前微批次的处理。另一方面，如果平均处理时间大于批处理间隔，则会导致微批次积压。积压会随着时间的推移而增长，最终使应用变得不稳定。


  “`流`”标签页使得分析落后批次变得容易。显示处理时间的时间线图中的峰值代表处理时间的跳跃。如果你点击一个峰值，它将带你到“`已完成批次`”部分中相应的批次。在那里，你可以点击“`批次时间`”列中的链接，查看处理时间较长的批次的详细信息。


