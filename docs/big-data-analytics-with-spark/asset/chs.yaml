  \ Int)] = Array((4,18), (8,32), (1,18), (9,48), (5,30), (6,32), (10,36), (2,26),\
  \ (11,26), (3,42))\n```\n\n#### 图并行运算符\n\n图并行运算符允许您实现自定义的迭代图算法，用于处理大规模图数据。\n\n\n\
  \n##### pregel\n\n`pregel`方法实现了 Google Pregel 算法的一个变体。Pregel 是一种分布式计算模型，用于处理包含数十亿顶点和数万亿边的大规模图。它基于整体同步并行（BSP）算法。\n\
  \n在 Pregel 中，图计算由一系列迭代（也称为超步）组成。在一个超步中，用户定义的函数（也称为顶点程序）会在每个顶点上并行调用。顶点程序处理上一个超步中发送给该顶点的消息聚合，更新顶点及其出边的属性，并向其他顶点发送消息。在一个超步中发送的消息将在下一个超步中被处理。如果在某个超步中没有消息发送给某个顶点，则在下一个超步中不会对该顶点调用顶点程序。所有顶点程序都允许处理完上一个超步的消息后，框架才会运行算法的下一次迭代。这些迭代或超步会重复执行，直到没有消息在传输且所有顶点都处于非活跃状态。当一个顶点没有进一步的工作要做时，它会变为非活跃状态。当其他顶点发送消息给它时，它会重新变为活跃。\n\
  \nGraphX 的 Pregel 实现与标准实现略有不同。在每个超步中调用的顶点程序将`EdgeTriplet`作为参数之一。它可以访问`EdgeTriplet`中源顶点和目标顶点的属性，以及连接它们的边的属性。此外，GraphX\
  \ 只允许向相邻顶点发送消息。\n\n`pregel`方法接受两组参数并返回一个图。第一组包含三个参数：每个顶点将在第一个超步中接收的初始消息、最大迭代次数以及消息发送的方向。\n\
  \n第二组也包含三个参数：一个用户定义的顶点程序（将在超步期间在每个顶点上并行运行）、一个用户定义的用于计算发送给相邻顶点的可选消息的函数，以及一个用户定义的用于合并或组合上一个超步中发送给某顶点的消息的函数。\n\
  \n用户定义的顶点程序接受三个参数：顶点的 ID、其当前属性以及上一个超步中发送给它的所有消息的聚合。它返回顶点的新属性。在第一个超步或迭代中，所有顶点都会收到作为参数传递给`pregel`方法的初始消息。在后续迭代中，每个顶点会收到上一个超步或迭代中发送给它的所有消息的聚合。如果某个顶点没有收到消息，则不会对其调用顶点程序。\n\
  \n`pregel`方法在所有顶点上并行运行顶点程序之后，会在所有出边上调用用户定义的消息发送函数。消息发送函数计算发送给相邻顶点的可选消息。它接受一个`EdgeTriplet`作为参数，并返回目标顶点\
  \ ID 和消息对的迭代器。此函数仅在那些在上一个超步中收到消息的顶点的边上被调用。\n\n用户定义的消息合并函数接受一对消息作为参数，将它们合并，并返回一个与传入消息类型相同的单一消息。它必须是一个可交换且可结合的函数。\n\
  \n`pregel`方法会不断迭代，直到没有消息或达到用户指定的最大迭代次数。它会在计算结束时返回结果图。\n\n`pregel`算子对于递归计算顶点属性的图并行计算非常有用。在此类计算中，一个顶点的属性依赖于相邻顶点的属性，而这些相邻顶点的属性又依赖于它们的相邻顶点，依此类推。这些算法本质上是迭代的。每次迭代中的计算都依赖于前一次迭代的结果。顶点的属性会在每次迭代中重新计算，直到满足停止条件。\n\
  \n图并行计算的一个例子是 PageRank 算法，这是 Google 搜索引擎最初使用的算法。对 PageRank 算法的详细讨论超出了本书的范围，但由于下一个例子将使用`pregel`算子来实现\
  \ PageRank，这里会对其进行简要描述。\n\n文档的 PageRank 表示该文档的重要性。PageRank 值越高的文档比 PageRank 值低的页面更重要。一个文档的\
  \ PageRank 基于链接到它的文档的 PageRank。因此，它是一个迭代算法。除了 PageRank 之外，文档的出链数量也是计算该文档对其链接文档的\
  \ PageRank 贡献的一个因素。与具有相同 PageRank 但出链较少的页面相比，具有大量出链的文档对其所链接文档的 PageRank 贡献较小。\n\n\
  让我们使用`pregel`方法和 PageRank 算法来计算示例社交图中用户的影响力排名。用户的影响力排名基于其粉丝的影响力排名以及每个粉丝关注的人数。\n\n\
  以下示例使用了与前几个示例相同的社交图。要使用`pregel`算子，您需要对由`socialGraph`表示的社交图进行一些更改。目前，每条边都具有相同的属性。相反，我们需要根据顶点的出边数量为每条边分配一个权重。\n\
  \n```\nval outDegrees = socialGraph.outDegrees\n\noutDegrees: org.apache.spark.graphx.VertexRDD[Int]\
  \ = VertexRDDImpl[23] at RDD at VertexRDD.scala:57\n\nval outDegreesGraph = socialGraph.outerJoinVertices(outDegrees)\
  \ {\n                        (vId, vData, OptOutDegree) =>\n                   \
  \         OptOutDegree.getOrElse(0)\n                      }\n\noutDegreesGraph:\
  \ org.apache.spark.graphx.Graph[Int,Int] = org.apache.spark.graphx.impl.GraphImpl@75cffddf\n\
  \nval weightedEdgesGraph = outDegreesGraph.mapTriplets{EdgeTriplet =>\n        \
  \                                    1.0 / EdgeTriplet.srcAttr\n               \
  \                           }\n\nweightedEdgesGraph: org.apache.spark.graphx.Graph[Int,Double]\
  \ = org.apache.spark.graphx.impl.GraphImpl@95cd375\n```\n\n接下来，为每个用户分配一个初始影响力排名。\n\
  \n```\nval inputGraph = weightedEdgesGraph.mapVertices((id, vData) => 1.0)\n```\n\
  \n您将在`inputGraph`上调用`pregel`方法。但在执行此操作之前，让我们先初始化将传递给`pregel`方法的参数。\n\n以下代码片段展示了您将传递给`pregel`方法的第一组三个参数。\n\
  \n```\nval firstMessage = 0.0\nval iterations = 20\nval edgeDirection = EdgeDirection.Out\n\
  ```\n\n接下来，定义将作为参数传递给`pregel`方法的三个函数。\n\n```\nval updateVertex = (vId: Long, vData:\
  \ Double, msgSum: Double) => 0.15 + 0.85 * msgSum\n\nupdateVertex: (Long, Double,\
  \ Double) => Double = <function3>\n\nval sendMsg = (triplet: EdgeTriplet[Double,\
  \ Double]) =>\n                  Iterator((triplet.dstId, triplet.srcAttr * triplet.attr))\n\
  \nsendMsg: org.apache.spark.graphx.EdgeTriplet[Double,Double] => Iterator[(org.apache.spark.graphx.VertexId,\
  \ Double)] = <function1>\n\nval aggregateMsgs = (x: Double, y: Double ) => x + y\n\
  \naggregateMsgs: (Double, Double) => Double = <function2>\n```\n\n现在让我们调用`pregel`方法。\n\
  \n```\nval influenceGraph = inputGraph.pregel(firstMessage, iterations, edgeDirection)(updateVertex,\n\
  \                                        sendMsg, aggregateMsgs)\n\ninfluenceGraph:\
  \ org.apache.spark.graphx.Graph[Double,Double] = org.apache.spark.graphx.impl.GraphImpl@ad6a671\n\
  ```\n\n让我们通过打印每个用户的名称和影响力排名来检查计算的结果。\n\n```\nval userNames = socialGraph.mapVertices{(vId,\
  \ vData) => vData.name}.vertices\n\nval userNamesAndRanks = influenceGraph.outerJoinVertices(userNames)\
  \ {\n                            (vId, rank, optUserName) =>\n                 \
  \                       (optUserName.get, rank)\n                            }.vertices\n\
  \nuserNamesAndRanks.collect.foreach{ case(vId, vData) =>\n                     \
  \       println(vData._1 + \"’s influence rank: \" + vData._2)\n               \
  \           }\n```\n\n`Dave’s influence rank: 0.2546939612521768`  \n`Harry’s influence\
  \ rank: 0.9733813220346056`  \n`Alex’s influence rank: 0.2546939612521768`  \n`Ivan’s\
  \ influence rank: 0.9670543985781628`  \n`Eve’s influence rank: 0.47118379300959834`\
  \  \n`Farell’s influence rank: 0.1925`  \n`Jill’s influence rank: 0.9718993399637271`\
  \  \n`Bill’s influence rank: 0.25824491587871073`  \n`NA’s influence rank: 0.25824491587871073`\
  \  \n`Carol’s influence rank: 0.36950816084343974`  \n`Garry’s influence rank: 0.15`\n\
  \n\n\n## 图算法\n\n`aggregateMessages`和`pregel`算子是实现自定义图算法的强大工具。利用这些算子，只需几行代码就能实现复杂的图算法。然而，在某些情况下，甚至连这些都不需要。GraphX\
  \ 为一些常见图算法内置了实现。这些算法可以作为`Graph`类的方法调用。\n\n### pageRank\n\n`pageRank`方法实现了 PageRank\
  \ 算法的动态版本。它有两个参数。第一个参数是收敛阈值或容差。动态 PageRank 算法会一直运行，直到排名变化小于用户指定的容差。第二个参数是可选的，它指定了\
  \ PageRank 算法使用的随机重置概率。默认值为 0.15。`pageRank`方法返回一个图，其中顶点属性为 PageRank 值，边属性为归一化权重。\n\
  \n下面是一个示例。它对之前为演示`pregel`方法而创建的`inputGraph`运行动态 PageRank。\n\n```\nval dynamicRanksGraph\
  \ = inputGraph.pageRank(0.001)\n```\n\n```\ndynamicRanksGraph.vertices.collect\n\
  ```\n\n```\nres63: Array[(org.apache.spark.graphx.VertexId, Double)] = Array((4,0.2544208826877713),\
  \ (8,1.4102365771190497), (1,0.2544208826877713), (9,1.3372775106440455), (5,0.5517909837066515),\
  \ (6,0.1925), (10,1.3487010905511918), (2,0.2577788005094401), (11,0.2577788005094401),\
  \ (3,0.36854429183919274), (7,0.15))\n```\n\n```\ndynamicRanksGraph.edges.collect\n\
  ```\n\n```\nres64: Array[org.apache.spark.graphx.Edge[Double]] = Array(Edge(1,2,0.5),\
  \ Edge(2,3,1.0), Edge(3,1,0.3333333333333333), Edge(3,4,0.3333333333333333), Edge(3,5,0.3333333333333333),\
  \ Edge(4,5,1.0), Edge(6,5,0.5), Edge(6,8,0.5), Edge(7,6,0.3333333333333333), Edge(7,8,0.3333333333333333),\
  \ Edge(7,9,0.3333333333333333), Edge(1,11,0.5), Edge(8,10,1.0), Edge(9,8,1.0), Edge(10,9,1.0))\n\
  ```\n\n### staticPageRank\n\n`staticPageRank`方法实现了 PageRank 算法的静态版本。它有两个参数。第一个参数是迭代次数，第二个可选参数是随机重置概率。`staticPageRank`方法运行指定次数的迭代，并返回一个图，其中顶点属性为\
  \ PageRank 值，边属性为归一化权重。\n\n```\nval staticRanksGraph = inputGraph.staticPageRank(20)\n\
  ```\n\n```\nstaticRanksGraph.vertices.collect\n```\n\n```\nres66: Array[(org.apache.spark.graphx.VertexId,\
  \ Double)] = Array((4,0.2546939612521768), (8,1.3691322478088301), (1,0.2546939612521768),\
  \ (9,1.2938371623789482), (5,0.5529962930095983), (6,0.1925), (10,1.3063496503175922),\
  \ (2,0.25824491587871073), (11,0.25824491587871073), (3,0.36950816084343974), (7,0.15))\n\
  ```\n\n```\nstaticRanksGraph.edges.collect\n```\n\n```\nres67: Array[org.apache.spark.graphx.Edge[Double]]\
  \ = Array(Edge(1,2,0.5), Edge(2,3,1.0), Edge(3,1,0.3333333333333333), Edge(3,4,0.3333333333333333),\
  \ Edge(3,5,0.3333333333333333), Edge(4,5,1.0), Edge(6,5,0.5), Edge(6,8,0.5), Edge(7,6,0.3333333333333333),\
  \ Edge(7,8,0.3333333333333333), Edge(7,9,0.3333333333333333), Edge(1,11,0.5), Edge(8,10,1.0),\
  \ Edge(9,8,1.0), Edge(10,9,1.0))\n```\n\n### connectedComponents\n\n`connectedComponents`方法实现了连通分量算法，用于计算每个顶点所属的连通分量。它返回一个图，其中每个顶点的属性是其所在连通分量中编号最小的顶点的顶点\
  \ ID。\n\n```\nval connectedComponentsGraph = inputGraph.connectedComponents()\n\
  ```\n\n```\nconnectedComponentsGraph.vertices.collect\n```\n\n```\nres68: Array[(org.apache.spark.graphx.VertexId,\
  \ org.apache.spark.graphx.VertexId)] = Array((4,1), (8,1), (1,1), (9,1), (5,1),\
  \ (6,1), (10,1), (2,1), (11,1), (3,1), (7,1))\n```\n\n### stronglyConnectedComponents\n\
  \n图的强连通分量（SCC）是一个子图，包含的顶点在同一子图中彼此可达。在一个 SCC 中，通过沿着边指向的方向进行遍历，任意顶点都可以从其他任意顶点到达（参见图\
  \ 9-9）。\n\n![A978-1-4842-0964-6_9_Fig9_HTML.gif](img/A978-1-4842-0964-6_9_Fig9_HTML.gif)\n\
  \n图 9-9. 强连通分量\n\n`stronglyConnectedComponents`方法为每个顶点查找其所属的 SCC，并返回一个图，其中顶点的属性是其所在\
  \ SCC 中编号最小的顶点 ID。\n\n```\nval sccGraph = inputGraph.stronglyConnectedComponents(20)\n\
  ```\n\n```\nsccGraph.vertices.collect\n```\n\n```\nres69: Array[(org.apache.spark.graphx.VertexId,\
  \ org.apache.spark.graphx.VertexId)] = Array((4,4), (8,8), (1,1), (9,8), (5,5),\
  \ (6,6), (10,8), (2,1), (11,11), (3,1), (7,7))\n```\n\n### triangleCount\n\n`triangleCount`方法计算每个顶点所参与的三角形数量。如果一个顶点有两个邻居顶点，且这两个邻居顶点之间存在一条边，则该顶点构成三角形的一部分。`triangleCount`方法返回一个图，其中顶点的属性是包含该顶点的三角形数量。\n\
  \n```\nval triangleCountGraph = inputGraph.triangleCount()\n```\n\n```\ntriangleCountGraph.vertices.collect\n\
  ```\n\n```\nres70: Array[(org.apache.spark.graphx.VertexId, Int)] = Array((4,1),\
  \ (8,3), (1,1), (9,2), (5,1), (6,1), (10,1), (2,1), (11,0), (3,2), (7,2))\n```\n\
  \n## 小结\n\n有些时候，用图视图表示数据比用集合视图更合适。对于这类面向图的数据，图算法比操作数据集合视图的算法提供了更好的分析工具。\n\nGraphX\
  \ 是一个扩展 Spark 以实现分布式图分析的库。它运行在 Spark 之上，并为图处理任务提供了更高级的 API。它提供了表示属性图的抽象，并内置支持 PageRank、强连通分量和三角形计数等图算法。此外，它还提供了用于处理图的基本算子以及用于复杂图分析的\
  \ Pregel API 变体。\n\n"
- "# 10. 集群管理器\n\n集群管理器负责管理计算机集群。更具体地说，它管理集群节点上可用的 CPU、内存、存储、端口及其他资源。它汇集每个集群节点上的可用资源，并使不同的应用程序能够共享这些资源。因此，它将普通计算机集群转变为一台可供多个应用程序共享的虚拟超级计算机。\n\
  \n分布式计算框架使用嵌入式的或外部的集群管理器。例如，在 2.0 版本之前，Hadoop MapReduce 使用嵌入式的集群管理器。在 Hadoop 2.0\
  \ 中，集群管理器与计算引擎分离。它成为一个独立的组件，可以与包括 MapReduce、Spark 和 Tez 在内的任何计算引擎配对使用。\n\nSpark\
  \ 自带集群管理器，但也可以与其他几个开源集群管理器一起使用。本章介绍 Spark 支持的不同集群管理器。\n\n请注意，Spark 应用程序编程接口与集群管理器无关；Spark\
  \ 应用程序可以部署在任何 Spark 支持的集群管理器上，而无需修改任何代码。因此，Spark 应用程序是对集群管理器透明的。\n\nSpark 支持三种集群管理器：Apache\
  \ Mesos、Hadoop YARN 和独立集群管理器。它提供了一个可用于将 Spark 应用程序部署到任何受支持集群管理器上的脚本。\n\n## 独立集群管理器\n\
  \n独立集群管理器与 Spark 捆绑在一起。它提供了搭建 Spark 集群最简单的方法。\n\n\n### 架构\n\nStandalone 集群管理器由两个关键组件构成：`master`和`worker`（见图\
  \ 10-1）。`worker`进程管理集群节点上的计算资源。`master`进程汇集所有`worker`的计算资源，并将它们分配给应用程序。`master`进程可以运行在独立的服务器上，也可以与`worker`进程一同运行在某个工作节点上。\n\
  \n![A978-1-4842-0964-6_10_Fig1_HTML.gif](img/A978-1-4842-0964-6_10_Fig1_HTML.gif)\n\
  \n图 10-1. Standalone 架构\n\n使用 Standalone 集群管理器部署的 Spark 应用程序涉及以下关键实体：`driver program`、`executor`和`task`。`driver\
  \ program`是使用 Spark 库的应用程序，它提供数据处理逻辑。`executor`是运行在工作节点上的 JVM 进程，执行由`driver program`提交的数据处理作业。一个`executor`可以同时运行一个或多个`task`，并为数据缓存提供内存。\n\
  \n`driver program`通过`SparkContext`对象连接到集群，该对象是进入 Spark 库的入口点。`SparkContext`对象使用`master`来获取工作节点上的计算资源。接着，它在工作节点上启动`executor`，并将应用程序代码发送给`executor`。最后，它将数据处理作业拆分为多个`task`，并将它们发送给`executor`执行。\n\
  \n### 设置 Standalone 集群\n\n设置 Standalone 集群很简单：只需在每个集群节点上下载并解压 Spark 二进制文件。接着，启动`master`和`workers`。可以逐个手动启动`master`和`workers`，也可以使用\
  \ Spark 提供的脚本同时启动它们。\n\n#### 手动启动集群\n\n首先，在其中一台服务器上启动`master`进程，然后在每个集群节点上启动`worker`进程。\n\
  \n如下所示启动`master`进程：\n\n```\n$ /path/to/spark/sbin/start-master.sh\n```\n\n默认情况下，`master`进程在端口`7077`上监听非本地\
  \ IP 地址的连接。IP 地址和端口都是可配置的。\n\n接下来，在 Spark 集群的每个节点上启动一个`worker`。可以如下启动：\n\n```\n\
  $ /path/to/spark/sbin/start-slave.sh <master-URL>\n```\n\n`master-URL`的格式为`spark://HOST:PORT`，其中`HOST`是运行`master`进程的主机的主机名或\
  \ IP 地址，`PORT`是`master`监听的 TCP 端口。\n\n用于启动`master`和`workers`的脚本接受命令行参数。表 10-1 列出了常用参数。\n\
  \n表 10-1. Standalone `master`和`worker`的命令行选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `--h\
  \ HOST` | `master`或`worker`监听的主机名或 IP 地址。 |\n| `--p PORT` | `master`或`worker`监听的\
  \ TCP 端口。默认情况下，`master`监听端口`7077`，`worker`监听随机端口。 |\n| `--webui-port PORT` | 用于从浏览器监控`master`或`worker`的\
  \ TCP 端口。`master`默认端口为`8080`，`workers`默认端口为`8081`。 |\n| `--cores CORES` | `worker`应分配给\
  \ Spark 应用程序的 CPU 核心数。默认情况下，`worker`分配所有核心。 |\n| `--memory MEM` | `worker`应分配给 Spark\
  \ 应用程序的内存量。默认情况下，`worker`分配总系统内存减去 1GB。 |\n\n启动`master`和`worker`进程后，Spark 集群即可运行\
  \ Spark 应用程序。您可以通过浏览器连接到`master`的 webUI 端口（默认`8080`）来检查集群状态。第 11 章描述了 Spark 提供的基于\
  \ web 的监控界面。\n\n#### 手动停止集群\n\n可以使用 Spark 提供的脚本停止 Spark `worker`，如下所示：\n\n```\n\
  $ /path/to/spark/sbin/stop-slave.sh\n```\n\n您必须在每台工作机器上执行此操作。\n\n也可以使用 Spark 提供的脚本停止\
  \ Spark `master`：\n\n```\n$ /path/to/spark/sbin/stop-master.sh\n```\n\n#### 使用脚本启动集群\n\
  \n随着 Spark 集群中`worker`数量的增加，手动启动和停止`master`和`workers`变得繁琐。幸运的是，Spark 提供了脚本，可以一次性启动和停止`master`及所有`workers`。\n\
  \n要使用这些脚本，首先需要在`/path/to/spark/conf`目录下创建一个名为`slaves`的文件。该文件应列出所有`worker`的主机名或 IP\
  \ 地址，每行一个。\n\n此外，您需要启用从`master`机器到所有`worker`机器的基于私钥的 SSH 访问。在`master`上运行的启动脚本会通过\
  \ SSH 并行连接到所有`worker`。\n\n满足这些要求后，您可以在`master`节点上运行`start-all.sh`脚本来启动 Spark 集群，如下所示：\n\
  \n```\n$ /path/to/spark/sbin/start-all.sh\n```\n\n`start-all.sh`脚本使用默认配置启动`master`和`workers`。您可以通过在`/path/to/spark/conf`目录下的`spark-env.sh`文件中设置环境变量来指定自定义配置。Spark\
  \ 在`/path/to/spark/conf`目录中提供了一个模板文件`spark-env.sh.template`。该文件列出了所有配置变量及其描述。复制此文件，重命名为`spark-env.sh`，并根据您的需求进行自定义。您需要在`master`和所有`worker`节点上执行此操作。\n\
  \n#### 使用脚本停止集群\n\n您可以在`master`节点上运行`stop-all.sh`脚本停止集群，如下所示：\n\n```\n$ /path/to/spark/sbin/stop-all.sh\n\
  ```\n\n### 在 Standalone 集群上运行 Spark 应用程序\n\n可以使用`spark-submit`脚本将 Spark 应用程序部署到\
  \ Standalone 集群上。首先，为您的应用程序创建一个 JAR 文件。如果它依赖于其他外部库，请创建一个包含应用程序代码及其所有外部依赖项的“uber”JAR。\n\
  \n可以如下在集群上启动 Spark 应用程序：\n\n```\n$ /path/to/spark/bin/spark-submit --master <master-URL>\
  \ </path/to/app-jar> [app-arguments]\n```\n\n`spark-submit`脚本是可配置的；它接受许多命令行选项。您可以使用`help`选项了解所有可以传递给`spark-submit`的选项。\n\
  \n```\n$ /path/to/spark/bin/spark-submit --help\n```\n\nSpark 应用程序可以以两种模式部署到集群上：`client`模式和`cluster`模式。`spark-submit`脚本提供了一个命令行选项`--deploy-mode`，可用于在`client`模式或`cluster`模式下运行\
  \ Spark 应用程序。默认情况下，它以`client`模式运行。\n\n> **注意**：请记住，Spark 应用程序也称为`driver program`。本章中这两个术语可以互换使用。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，对给定的英文文本进行翻译。\n\n\n#### 客户端模式\n\n在客户端模式下，驱动程序运行在用于将\
  \ Spark 应用程序部署到 Spark 集群的客户端进程中。例如，如果您使用`spark-submit`脚本来部署 Spark 应用程序，那么该`spark-submit`脚本就是客户端。在这种情况下，驱动程序（本质上是您的\
  \ Spark 应用程序）与运行`spark-submit`脚本的进程在同一个进程中运行。\n\n在客户端模式下，驱动程序的标准输入和标准输出会连接到启动它的控制台。此外，它可以读取和写入启动它的机器上的本地文件。\n\
  \n仅当客户端机器与 Spark 集群位于同一网络时，才建议使用客户端部署模式。您可以使用主节点或同一网络上的另一台机器以客户端模式启动 Spark 应用程序。\n\
  \n如下所示，Spark 应用程序可以以客户端模式启动。\n\n```\n$ /path/to/spark/bin/spark-submit --deploy-mode\
  \ client \\\n                                  --master <master-URL> \\\n      \
  \                            </path/to/app-jar> [app-arguments]\n```\n\n如前所述，默认模式就是客户端模式，因此如果您想以客户端模式运行应用程序，则不一定需要指定`deploy-mode`。\n\
  \n#### 集群模式\n\n在集群模式下，驱动程序运行在 Spark 集群中的一个工作节点上。`spark-submit`脚本向主节点发送请求，以找到一个运行驱动程序的工作节点。然后，该驱动程序从其中一个工作进程中启动。\n\
  \n如果部署 Spark 应用程序的机器与 Spark 集群不在同一网络上，建议使用集群模式。这可以最大限度地减少驱动程序与执行器之间的网络延迟。此模式还允许您选择，如果驱动程序以非零退出代码终止，则自动重启该驱动程序。\n\
  \n请注意，当使用`spark-submit`脚本以集群模式部署应用程序时，该脚本在提交应用程序后会退出。此外，由于驱动程序运行在工作节点上，它无法访问部署它的机器的控制台。它需要将其输出存储在文件或数据库中。\n\
  \n如下所示，Spark 应用程序可以以集群模式启动。\n\n```\n$ /path/to/spark/bin/spark-submit --deploy-mode\
  \ cluster \\\n                                  --master <master-URL> \\\n     \
  \                             </path/to/app-jar> [app-arguments]\n```\n\n当应用程序以集群模式部署时，`spark-submit`脚本会打印一个提交\
  \ ID，该 ID 可用于检查驱动程序的状态或停止它。\n\n如下所示，可以检查以集群模式运行的驱动程序的状态。\n\n```\n$ /path/to/spark/bin/spark-submit\
  \ --status <submission-id>\n```\n\n如下所示，可以停止以集群模式运行的驱动程序。\n\n```\n$ /path/to/spark/bin/spark-submit\
  \ --kill <submission-id>\n```\n\n如果您希望在驱动程序以非零退出代码终止时自动重启，请使用`--supervise`标志，如下所示。\n\
  \n```\n$ /path/to/spark/bin/spark-submit --deploy-mode cluster --supervise \\\n\
  \                                  --master <master-URL> \\\n                  \
  \                </path/to/app-jar> [app-arguments]\n```\n\n## Apache Mesos\n\n\
  Apache Mesos 是一个开源集群管理器。从概念上讲，它可以被视为计算机集群的操作系统内核。它将集群中多台机器的计算资源汇集在一起，并允许这些资源在多样化的应用程序之间共享。\n\
  \nMesos 提供了 Java、C++ 和 Python 的 API，用于获取集群资源和跨集群调度任务。此外，它还提供了一个用于监控集群的 Web UI。\n\
  \nMesos 的主要优势之一是它允许不同的分布式计算框架动态共享集群资源。它允许 Spark 和非 Spark 应用程序同时在同一集群上运行。例如，Mesos\
  \ 可以在动态共享的节点池上运行 Spark、Hadoop、MPI、Kafka、Elastic Search、Storm 和其他应用程序。\n\n通过允许不同的计算框架动态共享集群，Mesos\
  \ 不仅能有效利用集群资源，还能防止昂贵的数据复制。使用不同框架编写的应用程序可以处理相同的数据，而无需将数据从一个集群复制到另一个集群。\n\nMesos 提供的功能远多于\
  \ Spark 独立集群管理器。它不仅允许不同的框架共享集群资源，还使得开发分布式计算框架变得更加容易。\n\n以下是 Mesos 的其他关键特性：\n\n-\
  \ 可扩展到 10,000 个节点\n- 容错的主节点和从节点\n- 多资源（CPU、内存、磁盘和端口）调度\n- 支持 Docker 容器\n- 任务间的原生隔离\n\
  \n### 架构\n\nMesos 集群管理器包含两个关键组件：主节点和从节点（参见图 10-2）。类似于独立集群中的工作节点，Mesos 从节点管理集群节点上的计算资源。Mesos\
  \ 主节点管理 Mesos 从节点，并汇集每个从节点管理的资源。\n\n![A978-1-4842-0964-6_10_Fig2_HTML.gif](img/A978-1-4842-0964-6_10_Fig2_HTML.gif)\n\
  \n图 10-2. Mesos 架构\n\n使用 Mesos 实现的框架或应用程序包含一个调度器和多个执行器。执行器在从节点上运行并执行应用程序任务。\n\n\
  为防止单点故障，Mesos 支持多个主节点。在任何给定时间，只有一个主节点处于活动状态，其他主节点处于待命模式。如果活动主节点发生故障，则会选举出新的主节点。Mesos\
  \ 使用 Zookeeper 处理主节点故障转移。\n\n当应用程序部署到 Mesos 集群时，应用程序的调度器组件连接到 Mesos 主节点，后者会提供一个资源邀约。资源邀约是从节点上计算资源（如\
  \ CPU 核心、内存、磁盘和端口）的列表。Mesos 主节点向应用程序提供的资源量是可配置的。\n\n调度器可以接受或拒绝 Mesos 主节点发送的邀约。如果它接受邀约，调度器会选择使用哪些提供的资源。接着，它将要在提供的资源上运行的应用程序任务发送给\
  \ Mesos 主节点。Mesos 主节点将这些任务转发给从节点，从节点为执行器分配适当的资源，执行器再运行应用程序任务。当任务完成并有新资源可用时，此过程会重复。\n\
  \n### 设置 Mesos 集群\n\nMesos 应安装在每个将用作 Mesos 主节点或从节点的节点上。下载和安装 Mesos 的说明请访问 [`mesos.apache.org/gettingstarted/`](http://mesos.apache.org/gettingstarted/)。\n\
  \n您可以运行带单个主节点的 Mesos。在这种情况下，您无需安装 Zookeeper。但是，建议安装 Zookeeper 以实现 Mesos 主节点故障转移。安装\
  \ Zookeeper 的说明请访问 [`zookeeper.apache.org/`](http://zookeeper.apache.org/)。\n\n\
  您可以通过在浏览器中连接到 Mesos 主节点的 5050 端口，来验证 Mesos 主节点和所有 Mesos 从节点是否正确设置。\n\n\n\n### 在\
  \ Mesos 集群上运行 Spark 应用\n\n在 Mesos 集群上部署 Spark 应用之前，必须完成以下步骤。\n\n确保所有 Mesos Slave\
  \ 节点都能访问 Spark 二进制文件。当 Mesos Slave 运行 Spark 任务时，需要访问 Spark 二进制文件来启动 Spark Executor。将\
  \ Spark 二进制文件放置在任何 Hadoop 可访问的 URI 或所有 Mesos Slave 节点的本地文件系统上。此外，在 `/path/to/spark/conf/spark-default.conf`\
  \ 文件中配置变量 `spark.mesos.executor.home`，使其指向该位置。默认情况下，`spark.mesos.executor.home`\
  \ 指向环境变量 `SPARK_HOME` 指定的目录位置。\n\n在 `/path/to/spark/conf/spark-env.sh` 文件中设置以下环境变量。\
  \  \n`MESOS_NATIVE_JAVA_LIBRARY=/path/to/libmesos.so`  \n`SPARK_EXECUTOR_URI=/path/to/spark-x.y.z.tar.gz`\n\
  \n在 `/path/to/spark/conf/spark-default.conf` 文件中设置以下变量。  \n`spark.executor.uri =\
  \ /path/to/spark-x.y.z.tar.gz`\n\n你可以使用 `spark-submit` 脚本在 Mesos 集群上启动一个 Spark 应用。\n\
  \n如下所示，可以在单主节点的 Mesos 集群上启动 Spark 应用。\n\n`$ /path/to/spark/bin/spark-submit --master\
  \ mesos://host:5050 </path/to/app-jar> [app-args]`\n\n注意，这里的 Master URL 指向 Mesos\
  \ 主节点。\n\n在多主节点的 Mesos 集群上，可以像下面这样启动 Spark 应用。\n\n```\n$ /path/to/spark/bin/spark-submit\
  \ \\\n    --master mesos://zk://host1:2181,host2:2181,host3:2181 \\\n    </path/to/app-jar>\
  \ [app-args]\n```\n\n在这种情况下，Master URL 指向 ZooKeeper 节点。\n\n#### 部署模式\n\nMesos 支持应用的客户端模式和集群模式部署。在客户端模式下，驱动程序在发起部署的机器上的客户端进程中运行。在集群模式下，它运行在其中一个\
  \ Mesos Slave 节点上。然而，在撰写本书时，Spark 不支持 Mesos 集群的集群模式。\n\n#### 运行模式\n\nSpark 应用可以在\
  \ Mesos 集群上以两种模式运行：细粒度模式和粗粒度模式。\n\n##### 细粒度模式\n\n在细粒度模式下，每个应用任务都作为独立的 Mesos 任务运行。这种模式支持不同应用之间动态共享集群资源。因此，它可以实现集群资源的高效利用。\n\
  \n然而，细粒度模式比粗粒度模式会产生更高的开销。它不适合迭代或交互式应用。\n\n默认情况下，Spark 应用在 Mesos 集群上以细粒度模式运行。\n\n\
  ##### 粗粒度模式\n\n在粗粒度模式下，对于每个 Spark 应用，Spark 在每个 Mesos Slave 上启动一个长期运行的任务。应用提交的作业被拆分为任务，在这些长期运行的任务内部执行。在此模式下，Spark\
  \ 会在应用的整个运行期间预留集群资源。\n\n粗粒度模式产生的开销较低，但可能导致集群资源利用效率低下。例如，如果你在 Mesos 集群上启动一个 Spark\
  \ shell，那么为该 Spark shell 预留的集群资源即使 Spark shell 处于空闲状态，也无法被任何其他应用使用。\n\n要启用粗粒度模式，请在\
  \ `/path/to/spark/conf/spark-default.conf` 文件中设置以下变量。\n\n`spark.mesos.coarse=true`\n\
  \n在粗粒度模式下，默认情况下，Spark 会将 Mesos 主节点提供给它的所有资源分配给一个应用。因此，你无法同时运行多个 Spark 应用。你可以通过限制\
  \ Spark 分配给应用的资源来改变这一默认行为。应用中 CPU 核心的最大数量可以在 `/path/to/spark/conf/spark-default.conf`\
  \ 文件中配置，如下所示。\n\n`spark.cores.max=N`\n\n将 `N` 替换为符合你需求的正确数字。\n\n## YARN\n\nYARN（Yet\
  \ Another Resource Negotiator，另一种资源协调器）也是一个通用的开源集群管理器。它从 Hadoop MapReduce 2.0 版本开始可用。事实上，Hadoop\
  \ MapReduce 2.0 版本被称为 YARN。\n\n第一代 Hadoop MapReduce 仅支持 MapReduce 计算引擎。它包含一个名为 JobTracker\
  \ 的组件，该组件提供集群管理、作业调度以及监控功能。集群管理器和计算引擎紧密耦合。\n\n在 Hadoop MapReduce 2.0 版本中，集群管理和作业调度/监控被拆分为独立的进程。YARN\
  \ 提供集群管理功能，而特定于应用的 ApplicationMaster 提供作业调度和监控功能。采用这种新架构后，YARN 不仅可以支持 MapReduce\
  \ 计算引擎，还可以支持其他计算引擎，如 Spark 和 Tez。\n\n### 架构\n\nYARN 集群管理器包含两个关键组件：ResourceManager\
  \ 和 NodeManager（见图 10-3）。ResourceManager 相当于 YARN 中的 Mesos 主节点。NodeManager 相当于 YARN\
  \ 中的 Mesos Slave 节点。\n\n![A978-1-4842-0964-6_10_Fig3_HTML.gif](img/A978-1-4842-0964-6_10_Fig3_HTML.gif)\n\
  \n图 10-3. YARN 架构\n\nNodeManager 管理单个节点上的可用资源，并将这些资源报告给 ResourceManager。ResourceManager\
  \ 管理集群中所有节点的可用资源。它汇集所有 NodeManager 报告的资源，并将它们分配给不同的应用。本质上，它是一个调度器，负责在应用之间调度可用的集群资源。\n\
  \n基于 YARN 的分布式计算框架包含三个关键组件：客户端应用、ApplicationMaster 和容器。\n\n客户端应用向 ResourceManager\
  \ 提交作业。例如，`spark-submit` 脚本就是一个客户端应用。\n\nApplicationMaster 通常由 Spark 或 MapReduce\
  \ 之类的库提供。它们为每个应用创建一个 ApplicationMaster。ApplicationMaster 拥有并在 YARN 集群上执行一个作业。ApplicationMaster\
  \ 与 ResourceManager 协商资源，并与 NodeManagers 协作，使用容器来执行作业。它还监控作业并跟踪其进度。ApplicationMaster\
  \ 运行在其中一台运行 NodeManager 的机器上。\n\n从概念上讲，容器代表单个节点上可供应用使用的一组资源。ApplicationMaster 与\
  \ ResourceManager 协商执行作业所需的容器。分配成功后，它会与 NodeManagers 协作，在集群节点上启动容器。NodeManager 管理在一台机器上运行的容器。\n\
  \nResourceManager 包含两个关键组件：ApplicationsManager 和 Scheduler。ApplicationsManager 接收来自客户端应用的作业，并分配第一个容器用于运行\
  \ ApplicationMaster。Scheduler 为 ApplicationMaster 分配集群资源以运行作业。它仅提供调度功能；不监控或跟踪应用状态。\n\
  \n使用 YARN 的一个好处是，Spark 和 MapReduce 应用可以共享同一个集群。如果你已有一个 Hadoop 集群，可以轻松地使用 YARN 在其上部署\
  \ Spark 应用。\n\n\n\n### 在 YARN 集群上运行 Spark 应用\n\nYARN 同时支持 Spark 应用的客户端模式与集群模式部署。在客户端模式下，驱动程序运行在部署\
  \ Spark 应用的客户端进程中。在此模式下，`ApplicationMaster` 仅用于向 `ResourceManager` 请求资源。在集群模式下，驱动程序运行在集群节点之一的\
  \ `ApplicationMaster` 进程中。\n\n要在 YARN 集群上运行 Spark 应用，必须在 `/path/to/spark/conf/spark-env.sh`\
  \ 文件中配置环境变量 `HADOOP_CONF_DIR` 或 `YARN_CONF_DIR`，使其指向包含客户端 Hadoop 配置文件的目录。\n\n`spark-submit`\
  \ 脚本也可用于在 YARN 集群上部署 Spark 应用。但在 YARN 集群上启动 Spark 应用时，master-URL 的值应为 `yarn-cluster`\
  \ 或 `yarn-client`。Spark 会从 Hadoop 配置文件中获取 `ResourceManager` 的地址。\n\nSpark 应用可以通过集群模式在\
  \ YARN 上启动，如下所示。\n\n```\n$ /path/to/spark/bin/spark-submit --class path.to.main.Class\
  \ \\\n   --master yarn-cluster </path/to/app-jar> [app-args]\n```\n\nSpark 应用也可以通过客户端模式启动，如下所示。\n\
  \n```\n$ /path/to/spark/bin/spark-submit --class path.to.main.Class \\\n   --master\
  \ yarn-client </path/to/app-jar> [app-args]\n```\n\n## 总结\n\n凭借其模块化架构，Spark 支持多种集群管理器。Spark\
  \ 应用可以部署在 Mesos、YARN 或独立（Standalone）集群上。\n\n独立集群管理器是 Spark 支持的三种集群管理器中最简单的一种。它易于安装和入门，但仅支持\
  \ Spark 应用，且功能有限。\n\nYARN 允许 Spark 应用与 Hadoop MapReduce 应用共享集群资源。如果你已有运行 MapReduce\
  \ 任务的现有 Hadoop 集群，可以使用 YARN 在同一集群上运行 Spark 作业。\n\nMesos 是本章介绍的三种集群管理器中通用性最强的。它被设计用于支持多种分布式计算应用，并允许集群资源的静态和动态共享。\n\
  \n"
- '# 11. 监控


  监控是应用管理的关键部分。在涉及更多活动组件的分布式计算中，监控扮演着更为重要的角色。组件出现故障或应用未以最佳性能运行的可能性较高。


  然而，在分布式环境中排查问题并优化应用性能是一项艰巨的任务。与传统调试工具无法调试分布式系统不同，与在单台机器上运行的应用不同，分布式系统无法使用传统调试工具进行调试。因此，对分布式系统的各个组件进行检测（instrumentation）至关重要，以便能够远程监控和分析这些组件。


  除了对分布式系统进行检测外，还需要一个用于收集和显示指标的监控应用。监控应用的作用类似于汽车仪表盘上的仪表组或飞机驾驶舱中的飞行仪表。它让你能够跟踪重要指标，并实时查看不同组件的状态。


  Spark 提供了强大的监控能力。Spark 的各个组件都经过了深入的检测。此外，它还预装了一个基于 Web 的监控应用，可用于监控独立集群管理器和 Spark
  应用。它还支持第三方监控工具，例如 Ganglia、Graphite 以及基于 JMX 的监控工具。


  本章将介绍 Spark 自带的基于 Web 的内置监控应用。


  ## 监控独立集群


  Spark 提供了一个基于 Web 的用户界面，用于监控 Spark 独立集群中的主节点（master）和工作节点（worker）。你可以通过浏览器连接到 Spark
  主节点或工作节点的监控端口来访问这个内置的监控用户界面。


  ### 监控 Spark 主节点


  Spark 主节点监控用户界面的默认 TCP 端口是 8080。监控端口是可配置的；如果端口 8080 不可用，你可以配置 Spark 主节点使用另一个端口。


  用于监控 Spark 主节点的 Web 用户界面示例如图 11-1 所示。


  ![A978-1-4842-0964-6_11_Fig1_HTML.jpg](img/A978-1-4842-0964-6_11_Fig1_HTML.jpg)


  图 11-1.


  用于监控 Spark 主节点的 Web 用户界面


  监控页面包含多个部分。顶部显示 Spark 版本和 Spark 主节点的 URL。这是工作节点需要用来连接到此主节点的 URL。


  下一部分显示集群的摘要信息。它显示了集群中的工作节点数量、所有工作节点上可用的和正在使用的核心数、所有工作节点上可用的和正在使用的内存总量、当前正在运行和已完成的应用数量，以及主节点的当前状态。


  摘要部分之后是 `Workers`（工作节点）部分，该部分提供主节点已知的所有工作节点的摘要信息。对于每个工作节点，本节显示其位置、当前状态、可用和正在使用的核心数，以及可用和正在使用的内存量。


  `Workers` 部分之后是 `Running Applications`（正在运行的应用）部分。它显示当前正在运行的应用的摘要信息。对于每个应用，本节显示其名称、当前状态、分配的资源、启动时间、所有者以及已运行的时间。


  请注意，一个应用在不同工作节点上可能被授予不同数量的核心。`Cores`（核心）列显示了分配给一个应用的不同工作节点上的核心总数。


  标题为 `Completed Applications`（已完成的应用）的部分显示了已不在集群上运行的 Spark 应用的信息。它的列与 `Running Applications`
  部分类似。状态列显示应用是正常结束还是因错误而停止。


  Spark 主节点的 Web 用户界面对于排查与集群相关的问题非常有用。例如，如果某个工作节点崩溃或未能正确启动，其状态将显示为 `DEAD`（已死亡）。同样，每个工作节点的核心和内存相关指标可以帮助你识别配置、资源分配以及使用相关问题。


  工作节点可用的核心和内存应与该工作节点的配置设置相匹配。如果不匹配，则表明配置变量未正确初始化，或者 Spark 正在使用另一个配置文件。


  工作节点上正在使用的核心和内存是识别和排查潜在性能问题的有用指标。理想情况下，所有工作节点上使用的核心和内存应该相同。如果一个工作节点显示使用了 100% 的可用核心和内存，而另一个工作节点仅显示使用了
  25% 的可用核心和内存，则表明集群资源分配不均。因此，应用可能无法以最佳性能运行。你可能需要停止所有应用并重新启动它们。


  核心和内存相关的指标也有助于确定集群资源是否可用于在 Spark 集群上启动新应用。如果内存或核心的总数与已使用数相同，则意味着 Spark 调度器无法为新应用分配核心或内存。例如，对于图
  11-1 所示的集群，所有可用的核心和内存都已分配给当前在集群上运行的应用。核心和内存的已使用数与总数（可用数）相同。只有在某个现有应用完成后，新应用的作业才能在此集群上执行。




  当您在集群上启动 Spark 应用程序时，请检查“正在运行的应用程序”部分下的应用程序状态。如果其状态为 WAITING，则表示 Spark 没有该应用程序所需的核数或内存。它将保持该状态，直到资源可用。您可以等待现有应用程序之一完成，增加分配给
  Spark 工作节点的资源，或者减少新应用程序请求的资源。


  “已完成的应用程序”部分对于识别性能问题和排查未正常完成的应用程序都很有用。“状态”列显示应用程序是正常完成还是失败。对于失败的应用程序，您可以查看日志以获取更多详细信息。“持续时间”列显示应用程序完成其作业所花费的时间。根据处理的数据量，不同应用程序的持续时间会有所不同。您可以通过持续时间来判断是否存在性能问题。


  Master 的监控页面同时也是工作节点和应用程序监控 UI 的门户。“工作节点”部分提供了指向每个工作节点监控 UI 的链接。类似地，“应用程序”部分提供了指向集群上部署的每个
  Spark 应用程序监控 UI 的链接。


  当您点击某个应用程序的应用程序 ID 时，会看到如图 11-2 所示的页面。它显示了有关应用程序及其执行器的摘要信息。


  ![A978-1-4842-0964-6_11_Fig2_HTML.jpg](img/A978-1-4842-0964-6_11_Fig2_HTML.jpg)


  图 11-2.


  用于监控执行器的 Web UI


  顶部区域显示应用程序名称、所有者、请求和分配的核数、分配给每个执行器的内存、启动时间和当前状态。


  “执行器摘要”部分提供了为应用程序启动的每个执行器的摘要。执行器执行应用程序任务。对于每个执行器，此部分显示其运行所在的工作节点、分配给它的资源、其当前状态以及指向其日志文件的链接。


  此页面提供了在每个工作节点上分配给应用程序的资源的快速概览。理想情况下，每个节点上分配的核数和内存应该相同。不均衡的资源分配可能会导致性能问题。


  此页面还允许您远程查看执行器日志。日志文件包含用于排查问题的有用信息。您也可以浏览日志文件，以更好地了解 Spark 的工作原理。


  Spark 执行器将所有日志（包括 DEBUG 和 INFO 日志）写入 `stderr` 文件。`stdout` 文件为空。如果任务失败或抛出异常，请检查 `stderr`
  文件来调试问题。您还可以使用日志文件来分析性能问题。


  ## 监控 Spark 工作节点


  与 Spark master 类似，Spark 工作节点可以从浏览器远程监控。访问工作节点监控 Web UI 的默认 TCP 端口是 8081。如果端口 8081
  不可用，您可以配置 Spark 工作节点使用其他端口。


  图 11-3 显示了用于监控 Spark 工作节点的 Web UI 示例。


  ![A978-1-4842-0964-6_11_Fig3_HTML.jpg](img/A978-1-4842-0964-6_11_Fig3_HTML.jpg)


  图 11-3.


  用于监控 Spark 工作节点的 Web UI


  工作节点监控 UI 显示了关于 Spark 工作节点以及在该节点上启动的执行器的摘要信息。


  页面顶部显示了 Spark 版本和工作节点的位置。接下来，它显示工作节点所连接的 master，以及工作节点上可用和已使用的资源。


  下一部分显示了当前在工作节点上运行的执行器。对于每个执行器，此部分显示其当前状态、分配的资源以及指向日志文件的链接。它还显示了所有者和启动执行器所对应的应用程序。


  最后一部分显示有关已完成的执行器的相同信息。唯一的区别是“状态”列显示了执行器是如何终止的。


  工作节点监控页面对于检查工作节点上的资源如何分配给不同的应用程序非常有用。根据您的需求，您可以在不同应用程序之间平均分配资源，或者为不同应用程序分配不同的数量。


  您还可以使用工作节点监控页面远程检查日志文件。这些日志文件与上一节讨论的日志文件相同。区别在于，工作节点监控页面允许您检查在工作节点上运行的不同执行器生成的日志文件，而执行器监控页面允许您检查在不同工作节点上运行的执行器生成的日志文件。


  ## 监控 Spark 应用程序


  Spark 支持多种用于监控 Spark 应用程序的工具。


  首先，它预装了一个基于 Web 的监控应用程序。从浏览器访问内置监控应用程序的默认 TCP 端口是 4040。如果在同一主机上启动了多个 Spark 应用程序，它们将从端口
  4040 开始绑定到后续的端口。


  其次，Spark 提供了一个 REST API，用于以编程方式访问监控指标。REST API 以 JSON 格式返回指标。这允许应用程序开发人员创建自定义监控应用程序，或将
  Spark 应用程序监控与其他应用程序监控集成。


  第三，可以将 Spark 配置为将应用程序指标发送给第三方监控工具，例如 Graphite、Ganglia 和基于 JMX 的控制台。Spark 使用 Metrics
  Java 库，因此 Spark 支持 Metrics 库所支持的任何监控工具。


  本节介绍内置的基于 Web 的监控应用程序或 UI。


  ### 监控应用程序启动的作业


  您可以使用驱动程序程序的监控 URL，从浏览器连接到 Spark 的应用程序监控 UI。请使用运行驱动程序程序的计算机的主机名或 IP 地址。默认端口是 4040。您也可以通过在
  Spark master 的监控 UI 中点击应用程序名称来访问应用程序监控 UI。


  应用程序监控 UI 由多个选项卡组成。它有单独的选项卡来监控与作业、阶段、任务、执行器和其他一些内容相关的指标。默认选项卡是“作业”选项卡。


  “作业”选项卡提供了应用程序启动的当前正在运行、已完成和失败的 Spark 作业的摘要。图 11-4 显示了一个示例。


  ![A978-1-4842-0964-6_11_Fig4_HTML.jpg](img/A978-1-4842-0964-6_11_Fig4_HTML.jpg)


  图 11-4.


  用于监控 Spark 应用程序的 Web UI


  页面顶部显示了应用程序的运行时间和调度模式。它还显示了活动、已完成和失败的作业总数。


  “活动作业”部分提供了活动作业的摘要。它显示了每个作业的总阶段数和任务数以及已完成的阶段数和任务数。此外，它还显示了每个作业的描述、启动时间和持续时间。


  “已完成作业”部分提供了已完成作业的摘要。它显示的信息与“活动作业”部分类似。


  最后一部分提供了失败作业的摘要。对于未完成的作业，它显示的信息与前两部分类似。


  “作业”选项卡对于检测性能问题很有用。“持续时间”列显示了每个作业所花费的时间。根据处理的数据量，您可以判断一个作业是否正在或已经花费了异常长的时间来完成。如果某个作业花费了异常长的时间，您可以深入分析有问题的阶段或任务。




  ### 监控作业中的阶段


  `Jobs`选项卡上的作业描述是超链接。点击作业描述，将进入一个页面，其中显示有关作业的更多详细信息。


  图 11-5 展示了一个用于查看作业详细信息的 Web UI 示例。


  ![A978-1-4842-0964-6_11_Fig5_HTML.jpg](img/A978-1-4842-0964-6_11_Fig5_HTML.jpg)


  图 11-5. 用于监控作业详情的 Web UI


  `Details`页面被分成多个部分。第一部分显示作业中处于活跃和待处理状态的阶段总数，以及作业的当前状态。


  `Active Stages`部分显示了当前正在运行的阶段的摘要。下一部分则显示了等待执行阶段的摘要信息。处于待处理状态的阶段依赖于一个或多个活跃阶段。


  不同列提供的信息有助于排查性能问题。例如，你可以检查`Duration`列来查找耗时异常长的阶段。`Tasks`列显示了一个阶段内的并行度。根据集群的大小，任务数量过多或过少都可能成为性能问题的根源。同样地，`Shuffle
  Read`和`Write`列提供的信息可用于优化应用程序性能。数据混洗会对应用程序性能产生负面影响，因此应尽量减少混洗读写量。


  你也可以在此页面终止一个作业。如果某个作业耗时过长并阻塞了其他作业，或者你想修改代码后重新运行一个长时间运行的作业，可以在此处将其终止。描述列提供了一个终止作业的链接。


  `Details`页面还包含一些链接，用于显示作业的事件时间线以及 Spark 为作业生成的 DAG 可视化表示。


