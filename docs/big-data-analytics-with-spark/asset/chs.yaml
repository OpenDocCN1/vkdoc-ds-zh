  这是排查性能问题最有用的页面之一。它是一个信息丰富的页面，包含大量有用信息。与之前讨论的其他监控页面相比，它提供了更细粒度的信息。


  花些时间熟悉此页面提供的信息，这将有助于你更好地理解作业在 Spark 集群上是如何执行的。


