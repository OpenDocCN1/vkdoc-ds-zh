  “`环境`”标签页对于验证配置和环境变量是否设置正确非常有用。查看它们可以帮助你识别潜在问题。例如，某些变量可以通过多种方式配置。你可以通过编程方式设置它们，将它们作为命令行参数传递，或者在配置文件中指定。Spark
  在此类情况下定义了优先级顺序。然而，如果你忘记了优先级顺序，最终可能以与你预期不同的配置运行 Spark 应用。


