  overturn_probability: 0.1
  alternative: 正文小节标题
  counter_evidence:
  - '''结语''通常作为全书或最后部分的一个独立小节，但在Markdown结构中，''## 结语''是二级标题，其前文4088行是第10章的内容。'
  - 如果全书只有10个主章节，那么'结语'可能被视为第10章的一部分，或者是一个独立的短章节。根据规则'前言、序言...统一划分为一章'，结语类似于前言/后记，通常独立成章。但因为它级别较低（##），且紧跟在第10章小结之后，也可能被视为第10章的尾声。
  - 然而，观察5092行前的4088行是'## 小结'，这是第10章的小结。5092行'## 结语'紧随其后，且内容涉及全书总结（'本书涵盖了...'），语义上更倾向于独立于第10章的‘结语’部分。在技术书籍中，结语往往独立。维持分章是合理的。
  keep_split: true
