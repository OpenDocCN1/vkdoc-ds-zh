    ## Chapter 3 Getting Started


    We can also check the properties of an image as follows:


    ***Listing 3-4.*** `prog04.py`


    ```

    from PIL import Image


    im = Image.open("/home/pi/DIP/Dataset/4.1.07.tiff")


    print(im.mode)

    print(im.format)

    print(im.size)

    print(im.info)

    print(im.getbands())

    ```


    It produces the following output:


    ```

    RGB

    TIFF

    (256, 256)

    {''compression'': ''raw'', ''dpi'': (1, 1), ''resolution'': (1, 1)}

    (''R'', ''G'', ''B'')

    ```


    Let’s look at the program line by line.


    The mode of an image defines the type and depth of its pixels. Here are the standard
    modes available in Pillow:


    * 1 (1-bit pixels, black and white, stored with one pixel per byte)

    * L (8-bit pixels, black and white)

    * P (8-bit pixels, mapped to any other mode using a color palette)

    * RGB (3x8-bit pixels, true color)

    * RGBA (4x8-bit pixels, true color with transparency mask)

    * CMYK (4x8-bit pixels, color separation)

    * YCbCr (3x8-bit pixels, color video format)


    The format of the image refers to the file format. Size refers to the resolution
    of the image in pixels. Info refers to the auxiliary information of the image.
    The function `getbands()` retrieves the bands of the colors in the image.


