    # Python 简介


    由于其简单且类似英语的语法，Python 非常容易学习。这是它被作为第一门编程语言教授给学习入门编程课程的高中生和大学生的主要原因。整整一代新的程序员正在将
    Python 作为他们的第一门编程语言来学习。


    ## 易于阅读


    与其他高级编程语言不同，Python 不会混淆代码并使其难以阅读。与其他编程语言编写的代码相比，Python 代码类似英语的结构使其更容易阅读。这使得它比
    C 和 C++ 等其他高级语言更容易理解和学习。


    ## 易于维护


    由于 Python 代码易于阅读、理解和学习，任何维护代码的人都能很快熟悉代码库。我可以从我个人维护和增强用 Bash 和 Python 2 编写的大型遗留代码库的经验来证明这一点。


    ## 开源


    Python 是一个开源项目，这意味着其源代码是免费提供的。您可以对其进行修改以满足您的需求，并在您的应用程序中使用原始代码和修改后的代码。


    ## 高级语言


    在编写 Python 程序时，您无需管理内存管理、CPU 时序和调度进程等底层细节。所有这些任务都由 Python 解释器管理。您可以直接使用易于理解的类似英语的语法编写代码。


    ## 可移植性


    Python 解释器已被移植到许多操作系统平台。Python 代码也是可移植的。如果您小心避免与系统相关的编码，所有 Python 程序都将在受支持的平台上运行，而无需进行太多更改。


    您可以在 GNU/Linux、Windows、Android、FreeBSD、Mac OS、iOS、Solaris、OS/2、Amiga、Palm OS、QNX、VMS、AROS、AS/400、BeOS、OS/390、z/OS、Psion、Acorn、PlayStation、Sharp
    Zaurus、RISC OS、VxWorks、Windows CE 和 PocketPC 上使用 Python。


    ## 解释型语言


    Python 是一种解释型语言。让我们看看这意味着什么。用 C、C++ 和 Java 等高级编程语言编写的程序首先会被编译。这意味着它们首先被转换成一种中间格式。当我们运行程序时，这个中间格式由链接器/加载器从辅助存储器（即硬盘）加载到内存（RAM）中。


    因此，C、C++ 和 Java 有单独的编译器和链接器/加载器。Python 则不是这样。Python 直接从源代码运行程序。您无需费心编译和链接到合适的库。这使得
    Python 程序真正可移植，因为您可以将程序从一台计算机复制到另一台计算机，只要目标计算机上安装了必要的库，程序就能正常运行。


    ## 面向对象


    Python 支持面向过程编程以及面向对象编程范式。


    所有面向对象的编程范式都在 Python 中实现。在面向对象的编程语言中，程序是围绕结合数据和相关功能的对象构建的。Python 是一种非常简单但功能强大的面向对象编程语言。


    ## 可扩展性


    Python 的一个特性是您可以从 Python 程序中调用 C 和 C++ 例程。如果您希望应用程序的核心功能运行得更快，您可以用 C/C++ 编写该部分并在
    Python 程序中调用它（C/C++ 程序通常比 Python 程序运行得更快）。


    ## 丰富的库


    Python 拥有一个预安装的庞大标准库。该标准库包含现代编程语言所需的所有基本功能。它提供了用于数据库、单元测试（我们将在本书后面探讨这一点）、正则表达式、多线程、网络编程、计算机图形学、图像处理、GUI
    等内容。

