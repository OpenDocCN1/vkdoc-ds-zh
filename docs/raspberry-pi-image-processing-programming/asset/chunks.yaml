- fmt: '# Chapter 1 Introduction to Single-Board Computers and Raspberry Pi


    `update_config=1`


    ```

    network={

    scan_ssid=1

    ssid="TP-Link_710E"

    psk="internet1"

    }

    ```


    Remember to change the `SSID` and `PSK` sections with the name and the password
    of your Wi-Fi.


    9) Now, safely disconnect the microSD card reader.


    ## Booting Up Raspberry Pi


    This is the easiest part. Following these steps:


    1) Remove the microSD card from the card reader and insert it into the microSD
    card slot of the RPi board.

    2) Make sure that the main power switch is in the OFF position at this point.
    Connect the RPi to the power supply.

    3) Switch on the power switch.


    We can see the lights on the RPi board blinking at this point. This means that
    the RPi is booting up. Wait for a couple of minutes for the boot process to complete.


    ## Accessing Raspberry Pi Remotely


    We have booted up the RPi board in headless mode. This means that we have not
    directly connected any I/O devices such as display, keyboard, or mouse to it.
    Let’s connect to it remotely. First, we must know its IP address.


    Since we enabled the SSH and provided it the settings of our Wi-Fi before booting
    up, it is connected to the Wi-Fi at the time of the booting process.


    There are many ways to find out the IP address. If you are a part of an organization
    (workplace, research lab, or university), check with your network/system administrator
    to find out the IP address of the RPi board.


    If it is your personal Wi-Fi, then on all the UNIX-like systems (Linux, BSD, macOS),
    you can run a command to find out the IP address. For Debian and derivatives (Ubuntu,
    Raspberry Pi OS, etc.), we can install the following command:


    ```

    sudo apt install nmap -y

    ```


    This utility (NMAP) scans the network. The command to find out all the IP addresses
    connected to the network is as follows:


    ```

    sudo nmap -sn 192.168.0.*

    ```


    Change the numbers to represent your own network. It produces the following output:


    ```

    Starting Nmap 7.80 ( https://nmap.org ) at 2022-02-01 11:26 IST

    Nmap scan report for 192.168.0.1

    Host is up (0.0025s latency).

    Nmap scan report for 192.168.0.100

    Host is up (0.0023s latency).

    Nmap scan report for 192.168.0.102

    Host is up (0.091s latency).

    Nmap done: 256 IP addresses (3 hosts up) scanned in

    2.72 seconds

    ```


    You can find the IP address of your own system with the commands `ipconfig` (Windows)
    or `ifconfig` (UNIX-like systems). From this list, we can eliminate all the known
    devices with known IP addresses. If there are too many devices attached to the
    home network, then turn off the Wi-Fi of all the unnecessary devices. In my case,
    the IP address of the RPi board is `192.168.0.100`.


    On a Windows computer, we can install the Zenmap utility, which is the graphical
    interface for the `nmap`. We can download and install it from [https://nmap.org/zenmap/](https://nmap.org/zenmap/).
    It is also available for UNIX-like systems.


    Install the utility and open it. It looks as shown in Figure [1-13](#index_split_000.html#p37).


    ***Figure 1-13.** Zenmap GUI*


    We can easily use it. Mention `192.168.0.*` in the **Target** text box. Mention
    the command that we used earlier (`nmap -sn 192.168.0.*`) in the **Command** text
    box. And then click the **Scan** button. It takes some time for the scan to finish.
    Sometimes the scan fails prematurely. In such cases, keep trying, and it will
    work after a couple of attempts. It is all open source and free, so we cannot
    complain. It produces the result shown in Figure [1-13](#index_split_000.html#p37)
    once finished. Sometimes, it also shows the names of the manufacturers of the
    connected devices beside their MAC addresses. This makes it easy to identify the
    RPi board.


    Once we have the IP address of the RPi board, we can log in remotely.'
