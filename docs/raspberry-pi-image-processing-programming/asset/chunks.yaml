    # 第六章


    # Python 科学计算生态系统简介


    在上一章中，我们学习了如何使用 Pillow 进行高级图像处理。Pillow 是图像处理操作的一个很好的起点。然而，它有其局限性。当涉及到实现复杂的图像处理操作（例如分割、形态学操作、高级滤波器和测量）时，Pillow
    就显得力不从心了。我们确实需要使用更好的库来进行高级图像处理。SciPy 生态系统为 Python 的所有科学用途奠定了基础。


    `SciPy`代表**科学计算 Python**。它广泛使用`NumPy`（数值计算 Python）和`matplotlib`分别进行数值运算和数据可视化。本章涵盖`NumPy`、`SciPy`和`matplotlib`的基础知识，并通过`NumPy`、`scipy.misc`和`matplotlib`探索入门级的编程示例。我们将在本章中探讨以下主题：


    - Python 科学计算生态系统

