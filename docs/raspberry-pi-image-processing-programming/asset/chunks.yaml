    # 引言


    所有代码示例均附有充分说明。


    本书首先对树莓派和 Python 编程进行了总体介绍，随后探讨了与图像处理领域相关的概念，接着深入讲解了 `Pillow` 和 `TKinter` 库。接下来的几章重点介绍科学计算的
    Python 生态系统，以及使用 `NumPy`、`SciPy` 和 `Matplotlib` 等库进行图像处理。最后一章讨论了如何使用 `OpenCV`
    对实时摄像头视频流进行图像处理操作。附录部分简要介绍了可用于生成示例图片的 `pgmagik` 库，同时还包含大量高效使用树莓派板的技巧与诀窍。


    最后要说的是，我们启动并完成这个项目正值一个非常动荡的时期（2022 年初），当时世界大部分地区正面临由导致新冠疫情的新型病毒变种所引发的又一波感染浪潮。我们身边的每个人仍在从疫情的影响中恢复。这本书给我带来了使命感。希望所有读者在阅读本书时，都能像我享受写作过程一样乐在其中。


    ## 第 1 章：单板计算机与树莓派简介


    让我们开启这段激动人心的旅程，探索借助树莓派进行数字图像处理的科学领域。首先，我们需要熟悉单板计算机和树莓派的基础知识。


    本章将讨论单板计算机的定义、历史及其设计理念。我们会将单板计算机与常规计算机进行比较，然后将重点转向史上最受欢迎、销量最高的单板计算机——树莓派。到本章结束时，我们将掌握足够的知识来独立搭建自己的树莓派。本章旨在帮助大家熟悉单板计算机的基本概念以及树莓派的搭建方法。


    ### 单板计算机


    单板计算机（以下简称 SBC）是围绕单个印刷电路板构建的、功能完整的计算机系统。一台 SBC 拥有微处理器、内存、输入/输出接口以及一个最低限度功能计算机所需的其他特性。与台式个人电脑不同，大多数
    SBC 没有用于外设功能或扩展的扩展插槽。由于所有组件——处理器、内存、GPU 等——都集成在一块印刷电路板（PCB）上，因此我们无法对 SBC 进行升级。


    少数 SBC 被设计为可插入背板以实现系统扩展。SBC 有众多类型、尺寸、形状、外形规格和功能集。得益于电子和半导体技术的进步，大多数 SBC 的价格都非常低廉。单台售价约
    50 美元，我们就拥有了一款适用于新应用开发、破解、调试、测试、硬件开发和自动化系统的开发工具。


    SBC 通常采用以下外形规格制造：


    - Pico-ITX

    - PXI

    - Qseven

    - VMEbus

    - VPX

    - VXI

    - AdvancedTCA

    - CompactPCI

    - 嵌入式紧凑型扩展 (ECX)

    - Mini-ITX

    - PC/104

    - PICMG


    ### 单板计算机与常规计算机的区别


    表 1-1 列出了单板计算机与常规计算机的区别。


    ***表 1-1.** 单板计算机与常规计算机的区别*


    | **单板计算机** | **常规计算机** |

    |---|---|

    | 非模块化 | 模块化 |

    | 组件无法升级或更换 | 组件可升级或更换 |

    | 片上系统 | 非片上系统 |

    | 外形小巧 | 外形较大 |

    | 可便携 | 大多数不可便携或半便携 |

    | 功耗更低 | 功耗更高 |

    | 比常规计算机便宜 | 比单板计算机昂贵 |


