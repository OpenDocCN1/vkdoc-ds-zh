    ## 运行 Python 程序与 Python 模式


    你已经为 Python 编程设置好了环境，那么让我们开始学习 Python 的一些基本概念。Python 有两种模式——交互模式和脚本模式。让我们详细了解一下这两种模式。


    ### 交互模式


    Python 的交互模式是一个命令行 shell。它为每个执行的语句提供即时输出。它还会将先前执行语句的输出存储在活动内存中。当 Python 解释器执行新语句时，在评估当前输出时会考虑整个先前执行的语句序列。我们必须在终端中输入命令
    `python3` 来将 Python 3 解释器调用到交互模式，如下所示：


    ```

    pi@raspberrypi:~ $ python3

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    [GCC 4.9.1] on linux

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    你可以直接在此交互模式下执行 Python 语句，就像从操作系统 shell/控制台运行命令一样，如下所示：


    ```

    >>>print (''Hello World!'')

    Hello World!

    >>>

    ```


    本书不会使用交互模式。但是请记住它，因为这是检查小段代码（五到十行）最快的方法。我们可以使用 `exit()` 语句退出交互模式，如下所示：


    ```

    >>> exit()

    pi@raspberrypi:~ $

    ```


    ### 脚本模式


    脚本模式是指 Python 脚本文件（`.py`）由 Python 解释器执行的模式。


    创建一个名为 `test.py` 的文件，并将 `print (''Hello World!'')` 语句添加到文件中。保存文件，并使用 Python 3
    解释器运行它，如下所示：


    ```

    pi@raspberrypi:~ $ python3 test.py

    Hello World!

    pi@raspberrypi:~ $

    ```


    在这个例子中，`python3` 是解释器，`test.py` 是文件名。如果 `test.py` 文件不在我们调用 `python3` 解释器的同一目录中，我们必须提供
    Python 文件的绝对路径。


    ## Python 的 IDE


    集成开发环境（IDE）是一个软件套件，包含了编写和测试程序所需的所有基本工具。一个典型的 IDE 包含编译器、调试器、代码编辑器和构建自动化工具。大多数编程语言都有各种
    IDE 来改善程序员的生活。Python 也有很多 IDE。让我们看看其中的几个。


    ### IDLE


    IDLE 代表集成开发环境（Integrated DeveLopment Environment）。我们需要在 Raspberry Pi OS 上安装它。IDLE3
    适用于 Python 3。它在 Python 初学者中很受欢迎。我们可以使用以下命令安装它：


    ```

    pip3 install idle

    ```


    我们可以使用以下命令启动 IDLE3：


    ```

    nohup idle &

    ```


