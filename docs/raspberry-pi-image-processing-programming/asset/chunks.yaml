- fmt: 'We can use a variety of SSH tools, such as the built-in `ssh` utility on UNIX-like
    operating systems, to remotely log in to the RPi board. Just run the following
    command in the terminal emulator of your operating system:


    ```

    ssh pi@192.168.0.100

    ```


    The `pi` is the username. It will prompt for the password. It is `raspberry`.


    This way, we can remotely log in to the RPi board and run commands.


    `PuTTY` and `Bitvise SSH` clients are a few popular ones on Windows.


    However, I find `MobaXterm` very handy for this. It has the options for remote
    terminal, file transfer, and X-11 forwarding. We do not have to install anything
    else if we have this tool. Install it from [https://mobaxterm.mobatek.net/](https://mobaxterm.mobatek.net/).
    Once installed, open it. The window looks as shown in Figure [1-14.](#index_split_000.html#p38)


    ***Figure 1-14.** MobaXterm*


    In this window, click on the `Start local terminal` button. It launches a local
    terminal window. There, we can run the following command to connect to the RPi
    board:


    ```

    ssh pi@192.168.0.100

    ```


    The `pi` is the username. It will prompt for the password. It is `raspberry`.


    This way, we can remotely log in to the RPi board and run commands.


    Now, it is time to brush up on the UNIX concepts and commands that we learned
    in school. We can run all the Linux/UNIX commands on this remote terminal. One
    of the best things about the `MobaXterm` is it has a built-in `XServer` program
    that is automatically launched when we launch this utility. We can see the symbol
    for that in the top-right corner of the window. UNIX-like systems allow us to
    access the GUI applications remotely with X-11 forwarding. In RPi, it is enabled
    by default. We just need an `XServer` utility at the other end (the computer from
    which we are connecting to the RPi, or any other UNIX-like system). As discussed
    already, we have it with the `MobaXterm`. Just run the following command in the
    terminal:


    ```

