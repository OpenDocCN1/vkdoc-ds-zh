    ## Conversion Between PIL Image Objects and NumPy ndarrays


    You can use the methods `np.asarray()` and `Image.fromarray()` to convert between
    PIL images and NumPy ndarrays, as shown in Listing [6-9](#index_split_000.html#p140).


