    ## Raspberry Pi Setup


    We have to set up Raspberry Pi before we can use it for exploration and adventure.
    As mentioned earlier, I am using a Raspberry Pi 4 Model B for this setup. Make
    sure that you use a model of RPi board that has built-in Wi-Fi. The setup process
    is almost the same for all models.


    We are going to use the Raspberry Pi board in headless mode. This means that we
    will not connect any keyboard, mouse, or display. We will just connect it to the
    Wi-Fi network and access it remotely. So, we are not going to need a lot of hardware
    for this. Apart from the RPi board itself, we will need the following things:


    **A computer** – We will need a computer with a Windows, macOS, Linux, UNIX, or
    BSD operating system. We need it for preparing the microSD card for the RPi board.


    **Wi-Fi connection with internet** – We need the internet to install the operating
    system on the microSD card. We will need it further to connect the RPi to the
    internet and install necessary software on the RPi.


    **microSD card** – We will need a microSD card. I usually recommend at least a
    32GB Class 10 microSD card for the best experience. If you wish to know more about
    the classes of microSD cards, please visit the following URL on the web: https://www.sdcard.org/developers/sd-standard-overview/speed-class/


    **microSD card reader** – We need this so that the computer can read from and
    write to the microSD card. We need to modify the contents of the microSD card
    for headless setup. There are many variations of microSD card reader. The following
    (Figure [1-4](#index_split_000.html#p26)) is an image of a universal card reader.


    ![](index-26_1.jpg)


    **Chapter 1 Introduction to Single-Board Computers and Raspberry Pi**


    ***Figure 1-4.** Universal card reader[3](#index_split_000.html#p26)*


    **A power supply** – We need a power supply to power the RPi board. RPi 4B uses
    a USB Type C power.'
