    # 社区领袖与志愿者，投身于多项社会事业。他曾因在教育、技能培训及就业领域通过社区服务提升弱势群体地位方面的领导力，在其大学（海得拉巴国际信息技术学院）及过往工作单位荣获多项奖项。


    ## 关于作者


    他还参与了许多行业-院校合作项目，并成功将前雇主与母校联结起来。在新冠疫情期间（本书撰写时疫情仍在持续），他参与并领导了多项倡议，为当地社区有需要的人们分发食物、衣物和药品等基本物资。他定期组织活动，为无家可归者提供衣物、基本物资和医疗护理。


    xii


    ![](img/index-12_1.jpg)


    ## 关于技术审校


    **伦廷·约瑟夫**是一位来自印度的作家、机器人专家及机器人领域企业家。他在喀拉拉邦科钦经营一家名为 Qbotics Labs 的机器人软件公司，在机器人领域拥有十年经验，主要专注于机器人操作系统、OpenCV
    和 PCL。


    他已撰写十本关于 ROS 的著作，包括：《使用 Python 学习机器人学》第一版和第二版；《精通 ROS 机器人编程》第一版和第二版；《ROS 机器人项目》第一版和第二版；《ROS
    编程：构建强大机器人》；以及《机器人操作系统（ROS）入门指南》第一版和第二版。


    他还担任《自动驾驶与高级驾驶辅助系统（ADAS）：应用、开发、法律问题及测试》一书的联合编辑。


    他在印度获得机器人学与自动化硕士学位，并曾在美国卡内基梅隆大学机器人研究所工作。他还是一位 TEDx 演讲者。


    xiii


    ## 致谢


    我要感谢我的朋友阿努拉达，她鼓励我将知识分享给世界。我要感谢我在 Apress 的长期导师塞莱斯廷和阿迪蒂，感谢他们让我有机会与读者分享知识和经验。我感谢马克·鲍尔斯和詹姆斯·马卡姆帮助我按照
    Apress 的标准完成本书的撰写。


    我欠技术审校伦廷·约瑟夫一份人情。我还要感谢戈文德拉朱鲁教授先生的家人——他的儿子斯里尼瓦斯和儿媳艾米——允许我将本书献给教授以作纪念，并分享教授的生平资料及照片用于出版。我也要感谢所有与
    Apress 相关的人员，他们在推动这个项目成真方面发挥了关键作用。


    xv


    ## 前言


    我想让这篇前言保持简短、简洁且精准。我从事图像处理领域已有相当长的时间。我在 15 多年前初次接触 Python。当我第一次使用树莓派进行图像处理时，我发现翻阅现有的印刷书籍、视频教程和在线教程有些繁琐，因为其中大多数缺乏为初学者提供循序渐进且全面的入门指南。那时我便决心写一本书，随后出版了本书的第一版。自第一版出版以来已近五年，它亟需大量更新。


    本书是我努力与累积经验的结晶——这包含了数千小时（不包括实际撰写本书的时间）投入在查阅技术文档、观看培训视频、借助不同工具编写代码、调试有缺陷的代码片段、在线上各类问答和技术论坛发帖提问与参与讨论，以及参考各种代码仓库寻找方向上的付出。我撰写本书这一版本的方式，旨在让初学者能轻松理解各个主题。本书包含数百个代码示例和图片（代码执行结果截图），以便读者理解每个概念。

