    window. The default Python interpreter for Geany is Python 2. We will need to
    change it to Python 3. To do that, go to **Build** ➤ **Set Build Commands**. The
    window shown in Figure 2-4 will appear.


    ![](index-59_1.jpg)


    **Figure 2-4.** Set Build Commands window


