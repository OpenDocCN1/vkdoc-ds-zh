    \n![图 2-4 修改配置](index-60_1.png)\n\n---\n\n## 第 2 章 Python 与数字图像处理入门\n\n### Thonny\
    \ IDE\n\n最新版 Raspberry Pi OS 也预装了 **Thonny IDE**。它默认使用 Python 3（且仅支持 Python 3，因此我们无需更改设置）。我们可以通过以下命令启动它：\n\
    \n```\nnohup thonny &\n```\n\n图 [2-5](#index_split_000.html#p60) 展示了 Thonny IDE\
    \ 的截图。\n\n***Figure 2-5.** Thonny IDE*\n\n---\n\n## 第 2 章 Python 与数字图像处理入门  \n\
    ### 数字图像处理简介\n\n为了开始学习数字图像处理（DIP），我们将简要回顾一些相关主题的基本概念。\n\n#### 信号处理\n\n任何携带信息的事物，当用数学方式表示时，被称为信号。从给定信号中提取有用且相关信息的过程或技术称为信号处理。执行此类任务的系统称为信号处理系统。\n\
    \n信号处理系统的最佳示例是人类大脑。它处理来自各种感官的多种类型的信号。人脑是一个生物信号处理系统。当系统由电子元件构成时，它被称为电子信号处理系统。信号处理是一门结合数学与电气工程的学科。\n\
    \n电子信号分为两种类型——模拟信号和数字信号。下表列出了这两种信号的区别。\n\n| **模拟信号** | **数字信号** |\n| :--- | :---\
    \ |\n| 连续信号 | 本质上是离散的 |\n| 用正弦波表示 | 用方波表示 |\n| 连续信号 | 离散信号 |\n| 因噪声而劣化 | 不受噪声影响\
    \ |\n| 不灵活 | 灵活，可执行多种操作 |\n| 消耗更少带宽 | 消耗大量带宽 |\n| 功耗高 | 功耗低于模拟 |\n| 在捕获、存储和传输中存在大量错误\
    \ | 错误较少，且有校验和与纠错算法可用 |\n\n---\n\n#### 图像处理\n\n图像是一种信号。因此，图像处理是信号处理的一种类型。图像处理系统是信号处理系统的一种。眼睛和大脑的组合是生物图像处理系统的一个例子。图像处理系统有两种类型——模拟和数字。\n\
    \n##### 模拟图像处理\n\n静态和运动胶片相机的时代代表了模拟时代。模拟图像的来源是胶片相机（静态和运动）、老式传真机和电传机。老式电视系统、CRT\
    \ 显示器和胶片放映机代表了模拟图像处理系统。模拟图像处理广泛涉及模拟电子系统、机械部件、光学器件和化学处理（用于显影和存储胶片）。\n\n##### 数字图像处理\n\
    \n随着数字计算机、存储系统、图像传感器和数码相机的出现，图像可以以数字格式捕获、存储和处理。使用数字计算机从图像（包括模拟和数字图像）中处理和检索信息称为数字图像处理。它广泛涉及数字传感器（数码相机）、数字计算机和数字存储设备。以下是数字图像处理系统的一些应用：\n\
    \n*   计算机化图像编辑、校正、增强、去噪等。\n*   医学图像处理与诊断辅助\n*   太空图像处理（处理来自哈勃望远镜和地面望远镜的图像）"
