    cap.set(cv.CAP_PROP_FRAME_WIDTH, 256)\ncap.set(cv.CAP_PROP_FRAME_HEIGHT, 144)\n\
    \nif not cap.isOpened():\n    print(\"Cannot open camera...\")\n    exit()\n\n\
    while True:\n    ret, frame = cap.read()\n\n    if not ret:\n        print(\"\
    Can't receive frame... \\nExiting ...\")\n        break\n\n    print(datetime.now())\n\
    \    print(frame.dtype)\n    print(frame.shape)\n    print(frame.ndim)\n    print(frame.size)\n\
    \n    b = frame[:, :, 0]\n    g = frame[:, :, 1]\n    r = frame[:, :, 2]\n\n \
    \   cv.imshow('Red', r)\n    cv.imshow('Green', g)\n    cv.imshow('Blue', b)\n\
    \n    if cv.waitKey(1) == 27:\n        break\n\ncap.release()\ncv.destroyAllWindows()\n\
    ```\n\nIn this code listing (`prog02.py`), we can see the properties of each frame\
    \ as well as all the channels, as shown in the output (Figure 10-2).\n\n**Figure\
    \ 10-2.** Separation of color channels"
