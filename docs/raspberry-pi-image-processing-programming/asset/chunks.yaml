    \ n, n), np.uint8)/(n*n*n)\n\ncap.set(cv.CAP_PROP_FRAME_WIDTH, 256)\ncap.set(cv.CAP_PROP_FRAME_HEIGHT,\
    \ 144)\n\nif not cap.isOpened():\n    print(\"Cannot open camera...\")\n    exit()\n\
    \nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        print(\"\
    Can't receive frame... \\nExiting ...\")\n        break\n    output = ndi.convolve(frame,\
    \ k, mode='nearest')\n    cv.imshow('Convolved Frame', output)\n    if cv.waitKey(1)\
    \ == 27:\n        break\n\ncap.release()\ncv.destroyAllWindows()\n```\n\nSince\
