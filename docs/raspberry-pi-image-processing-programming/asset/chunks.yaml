    他们决定为此需要一个主版本号变更，并且最终的版本将不向后兼容。Python 2.x 和 3.x 应该并行存在，以便程序员社区有足够的时间将他们的代码和第三方库从
    2.x 迁移到 3.x。在大多数情况下，Python 2.x 代码无法直接运行，因为 2.x 和 3.x 之间存在显著差异。


    ## Raspberry Pi OS 上的 Python 2 和 Python 3


    Raspberry Pi OS 是 Debian Linux 的一个衍生版本。Raspberry Pi OS 中预装了 Python 2 和 Python
    3 解释器。可以通过在终端中运行命令 `python` 来调用 Python 2 解释器。可以通过在终端中运行命令 `python3` 来调用 Python
    3 解释器。我们可以通过运行以下任一命令来检查 Python 3 解释器的版本：


