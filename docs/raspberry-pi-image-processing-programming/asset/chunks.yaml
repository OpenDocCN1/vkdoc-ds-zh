  trans: '

    单板计算机主要是片上系统（SoC）。片上系统是一种集成电路（IC），它将计算机的所有组件集成在单个芯片上。由于其低功耗和多用途特性，SoC 在移动电子设备中非常常见。SoC
    广泛应用于手机、单板计算机和嵌入式硬件中。一个 SoC 包含其运行所需的所有硬件和软件。


    # 第 1 章 单板计算机与树莓派简介


    ## SoC 与传统 CPU 比较


    使用 SoC 的最大优势在于其尺寸。如果我们使用传统 CPU，由于需要在板上布置大量独立的芯片和其他组件，很难制造出紧凑的计算机。然而，使用 SoC 时，我们可以将完整的专用计算系统放入智能手机和平板电脑中，同时仍有充足的空间容纳电池、天线以及其他远程通信和数据传输所需的附加组件。


    由于集成度极高且体积紧凑，SoC 的功耗远低于传统 CPU。对于移动和便携式系统而言，这是 SoC 的一大显著优势。此外，通过消除计算机主板上多余的集成电路来减少芯片数量，也进一步缩小了主板尺寸。


    ## 单板计算机的历史


    `Dyna-Micro` 是第一款真正的单板计算机。它基于 Intel `C8080A`处理器，并使用了 Intel 首款 EPROM `C1702A`。1976
    年，康涅狄格州德比市的 E&L Instruments 公司将其更名为`MMD-1`（`Mini-Micro Designer 1`）并推向市场。它作为微型计算机的典范而闻名。在计算机发展的早期，单板计算机非常流行，许多家用计算机实际上就是单板计算机。然而，随着个人电脑的兴起，单板计算机的受欢迎程度逐渐下降。自
    2010 年以来，由于生产成本降低，单板计算机再次受到欢迎。


    除了`MMD-1`之外，历史上还有其他一些著名的单板计算机：


    - `BBC Micro` 基于 MOS 技术开发的`6502A`处理器，运行频率为`2MHz`。

    - `Ferguson Big Board II` 是一款基于 Zilog `Z80`的计算机，运行频率为`4MHz`。

    - `Nascom` 是另一款基于 Zilog `Z80`的计算机。


    ## 流行的单板计算机系列


    根据制造商和设计者的不同，单板计算机被划分为系列、型号和代际。以下是几个流行的单板计算机系列：


    - 树莓派系列，由树莓派基金会出品

    - Banana Pi 和 Banana Pro

    - Intel Up Squared 套件

    - CubieBoard

    - BeagleBone


    ## 树莓派


    树莓派是一系列信用卡大小的单板计算机，由英国的树莓派基金会开发。树莓派基金会由埃本·厄普顿于 2009 年创立。开发树莓派的目的是通过提供低成本的计算平台，促进学校和发展中国家基础计算机科学的教学。


    树莓派基金会的树莓派于 2012 年发布。它获得了巨大成功，并在两年内售出了超过 200 万台。随后，树莓派基金会发布了树莓派的修订版本。他们还为树莓派推出了其他配件。


    更多关于树莓派基金会的信息，请访问其网站 [`www.raspberrypi.org`](https://www.raspberrypi.org)。


    树莓派当前生产型号及其他配件的产品页面，请访问 [`www.raspberrypi.org/products`](https://www.raspberrypi.org/products)。


    本书中的所有代码示例均在配备 `8GB` 内存的树莓派 4 Model B 上编写、执行和测试过。表 1-2 列出了树莓派 4 Model B 的规格。


    ***表 1-2.** 树莓派 4 Model B 规格*


    | **发布日期** | **2019 年 6 月** |

    | :--- | :--- |

    | 架构 | `armv8` |

    | SoC 博通 | `BCM2711` |

    | 中央处理器 | 四核 `Cortex-A72` (`ARM v8`) 64 位 SoC @ `1.5GHz` |

    | 图形处理器 | 博通 `VideoCore IV` |

    | 内存 | |

