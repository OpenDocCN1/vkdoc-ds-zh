    ## 用于数字图像处理的 Python 3


    Python 3 没有预装任何用于图像处理的库。`Python Imaging Library`（`PIL`）是在 Python 中进行图像处理时最受欢迎的、对初学者友好的图像处理库之一。该库提供广泛的文件格式支持和相当强大的图像处理能力。`核心图像库`旨在实现对存储于几种基本图像格式中的数据实现更快的访问。PIL
    的缺点是，在 2009 年发布最后一个稳定版本（1.1.7）以及 2011 年最后一次提交之后，就没有新的版本发布了。此外，PIL 不支持 Python 3。官方上，我们没有听说
    PIL 已经消亡。然而，有一个友好的分支（衍生）项目，它是 PIL 的非官方替代品和增强版。它与 Python 3 配合良好，被称为 `Pillow`。它基本上向后兼容
    PIL。你可以在其主页 [`python-pillow.org/`](https://python-pillow.org/) 上获取关于 Pillow 的更多信息。


    让我们开始学习 Pillow 的基础知识。我们可以通过在终端运行以下命令来安装 Pillow：


    ```bash

    sudo pip3 install pillow

