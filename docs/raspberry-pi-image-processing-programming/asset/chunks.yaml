    在本章中，我们开始了 Pillow 基础内容的学习。我们学习了如何加载和显示图像。我们还了解了一些图像属性，并学习了如何使用各种传感器捕获图像。在下一章中，我们将详细探索
    **Pillow** 中的 `Image`、`ImageChops` 和 `ImageOps` 模块。


