    **Noise and Gradients**


    Noise is the unwanted part in a signal. Depending on the type of signal, noise
    can take various forms. We know that an image is a signal. So, an image can have
    noise. Noise can be inadvertently added into an image


    at the time of capturing that image or transmission. We can generate (or simulate)
    noise as shown in Listing [4-11](#index_split_000.html#p98).


    ***Listing 4-11.*** prog10_3.py


    from PIL import Image


    im = Image.effect_noise((512, 512), 0.01)


    im.show()


    We can generate a linear gradient as demonstrated in Listin[g 4-12](#index_split_000.html#p98).


    ***Listing 4-12.*** prog10_4.py


    from PIL import Image


    im = Image.linear_gradient(''P'')


    im.show()


    We can generate a radial gradient as demonstrated in Listin[g 4-13.](#index_split_000.html#p98)


    ***Listing 4-13.*** prog10_5.py


