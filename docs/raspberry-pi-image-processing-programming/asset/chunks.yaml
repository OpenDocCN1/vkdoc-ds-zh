    \n# 第 9 章\n\n# 形态学、阈值分割与图像分割\n\n在上一章中，我们研究了图像滤波器背后的原理，以及用于图像增强的滤波器类型和实际应用。\n\n\
    本章我们将学习并演示图像处理中的重要概念，例如形态学、图像的形态学操作、阈值分割和图像分割。我们将学习并演示以下内容：\n\n*   距离变换\n*   形态学与形态学操作\n\
    *   阈值分割与图像分割\n\n## 距离变换\n\n距离变换是对二值图像执行的一种操作。二值图像包含背景元素（零值——黑色）和前景元素（白色）。距离变换将每个前景元素替换为到背景的最短距离值。`scipy.ndimage`\
    \ 提供了三种计算二值图像距离变换的方法。代码清单 9-1 中的代码演示了如何实际使用距离变换来生成测试图像。\n\n***代码清单 9-1.*** prog01.py\n\
    \n```\nimport scipy.ndimage as ndi\nimport matplotlib.pyplot as plt\nimport numpy\
    \ as np\n\nimg = np.zeros((32, 32))\nimg[8:-8, 8:-8] = 1\n\nprint(img)\n\ndist1\
    \ = ndi.distance_transform_bf(img)\ndist2 = ndi.distance_transform_cdt(img)\n\
    dist3 = ndi.distance_transform_edt(img)\n\noutput = [img, dist1, dist2, dist3]\n\
    titles = ['Original', 'Brute Force', 'Chamfer', 'Euclidean']\n\nfor i in range(4):\n\
    \    print(output[i])\n    plt.subplot(2, 2, i+1)\n    plt.imshow(output[i],\n\
    \    interpolation='nearest')\n    plt.title(titles[i])\n    plt.axis('off')\n\
    \    plt.show()\n```\n\n代码清单 9-1 所示的代码分别使用暴力算法、倒角距离算法和欧几里得方法计算距离变换。我们将在本章中使用距离变换来生成测试图像。输出结果如图\
    \ 9-1 所示。\n\n![](img/index-182_1.jpg)\n\n## 第 9 章 形态学、阈值分割与图像分割\n\n***图 9-1.**\
    \ 距离变换*\n"
- fmt: "# Morphology and Morphological Operations\n\nMorphology is the study of shapes\
    \ and forms. The morphological study of images deals with shapes rather than with\
    \ the values of the pixels. Morphological operations are usually performed on\
    \ binary images. Let’s take a look at a few concepts related to morphological\
    \ operations.\n\n## Structuring Element\n\nA structuring element is a matrix that’s\
    \ used to interact with a given binary image. It comes in various shapes, like\
    \ a ball, a ring, or a line. It can come in many shapes, like a 3 x 3 or a 7 x\
    \ 7 matrix. Larger structuring elements take more time for computation. A simple\
    \ structuring element can be defined as a unity matrix of odd sizes. `np.ones((3,\
    \ 3))` is an example of this.\n\n## Binary Morphological Operations\n\nLet’s briefly\
    \ look at various morphological operations. Dilation causes the expansion of the\
    \ shapes in an input image. Erosion causes shrinkage in the shape in an input\
    \ image. Opening is the dilation of erosion. Closing is the erosion of dilation.\n\
    \nIt is difficult to understand these concepts just by reading about them. Take\
    \ a look at the example in Listing 9-2, which demonstrates these concepts on a\
    \ binary image.\n\n***Listing 9-2.*** `prog02.py`\n\n```\nimport matplotlib.pyplot\
    \ as plt\nimport scipy.ndimage as ndi\nimport numpy as np\n\nimg = np.zeros((16,\
    \ 16))\nimg[4:-4, 4:-4] = 1\nprint(img)\n\nerosion = ndi.binary_erosion(img).astype(img.dtype)\n\
    dilation = ndi.binary_dilation(img).astype(img.dtype)\nopening = ndi.binary_opening(img).astype(img.dtype)\n\
    closing = ndi.binary_closing(img).astype(img.dtype)\n\noutput = [img, erosion,\
    \ dilation, opening, closing]\ntitles = ['Original', 'Erosion', 'Dilation', 'Opening',\
    \ 'Closing']\n\nfor i in range(5):\n    print(output[i])\n    plt.subplot(1, 5,\
    \ i+1)\n    plt.imshow(output[i], interpolation='nearest')\n    plt.title(titles[i])\n\
    \    plt.axis('off')\n\nplt.show()\n```\n\nThe code example in Listing 9-2 generates\
    \ a binary image and applies all the binary morphological operations to it. The\
    \ output is shown in Figure 9-2.\n\n***Figure 9-2.** Morphological operations\
    \ on a binary image*\n\nAnother important operation is `binary_fill_holes()`.\
    \ It is used to fill the gaps in the binary image, as shown in Listing 9-3.\n\n\
    ***Listing 9-3.*** `prog03.py`\n\n```\nimport matplotlib.pyplot as plt\nimport\
    \ scipy.ndimage as ndi\nimport numpy as np\n\nimg = np.ones((32, 32))\nx, y =\
    \ (32 * np.random.random((2, 20))).astype(np.int)\n\nimg[x, y] = 0\nnoise_removed\
    \ = ndi.binary_fill_holes(img).astype(int)\n\noutput = [img, noise_removed]\n\
    titles = ['Original', 'Noise Removed']\n\nfor i in range(2):\n    print(output[i])\n\
    \    plt.subplot(1, 2, i+1)\n    plt.imshow(output[i], interpolation='nearest')\n\
    \    plt.title(titles[i])\n    plt.axis('off')\n\nplt.show()\n```\n\nThe code\
    \ in Listing 9-3 generates a 32 x 32 square matrix image with all the values as\
    \ 1 (white value). Then it randomly sets a few pixels to 0 (the dark value). The\
    \ dark pixels can be considered holes in the image, which can then be removed\
    \ using `binary_fill_holes()`. The output is shown in Figure 9-3.\n\n***Figure\
    \ 9-3.** Noise removal with a morphological operation*\n\nEarlier, we discussed\
    \ binary structure. Let’s apply the morphological operations on an image using\
    \ a binary structure. Listing 9-4 demonstrates this.\n\n***Listing 9-4.*** `prog04.py`\n\
    \n```\nimport matplotlib.pyplot as plt\nimport scipy.ndimage as ndi\nimport numpy\
    \ as np\n\nimg = np.zeros((16, 16))\nimg[4:-4, 4:-4] = 1\n\nstruct = ndi.generate_binary_structure(2,\
    \ 1)\nprint(struct)\n\nerosion = ndi.binary_erosion(img, struct).astype(img.dtype)\n\
    dilation = ndi.binary_dilation(img, struct).astype(img.dtype)\nopening = ndi.binary_opening(img,\
    \ struct).astype(img.dtype)\nclosing = ndi.binary_closing(img, struct).astype(img.dtype)\n\
    ```"
