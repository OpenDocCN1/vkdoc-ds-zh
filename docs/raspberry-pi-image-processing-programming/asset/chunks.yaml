- fmt: 'SBCs are predominantly systems on chips (SoCs). A system on a chip (SoC) is
    an integrated circuit (IC) that has all the components of a computer on a single
    chip. SoCs are very common with mobile electronic devices because of their low
    power consumption and versatility. SoCs are widely used in mobile phones, SBCs,
    and embedded hardware. An SoC includes all the hardware and software needed for
    its operation.


    # Chapter 1 Introduction to Single-Board Computers and Raspberry Pi


    ## SoC versus Regular CPU


    The biggest advantage of using an SoC is its size. If we use a CPU, it’s very
    hard to make a compact computer because of the number of individual chips and
    other components that we need to arrange on a board. However, when using SoCs,
    we can place complete application-specific computing systems in smartphones and
    tablets, and still have plenty of space for batteries, the antenna, and other
    add-ons required for remote telephony and data communication.


    Due to the very high level of integration and the compact size, an SoC uses considerably
    less power than a regular CPU. This is a significant advantage of SoCs when it
    comes to mobile and portable systems. Also, reducing the number of chips by eliminating
    redundant ICs on a computer board results in a compact board size.


    ## History of SBCs


    `Dyna-Micro` was the first true SBC. It was based on the Intel `C8080A` and used
    Intel’s first EPROM, the `C1702A`. The `Dyna-Micro` was rebranded and marketed
    by E&L Instruments of Derby, Connecticut, in 1976 as the `MMD-1` (`Mini-Micro
    Designer 1`). It became famous as the leading example of a microcomputer. SBCs
    were very popular in the earlier days of computing, as many home computers were
    actually SBCs. However, with the rise of PCs, the popularity of SBCs declined.
    Since 2010, there has been a resurgence in the popularity of SBCs due to their
    lower production costs.


    Apart from the `MMD-1`, here are a few other popular historical SBCs:


    - The `BBC Micro` was built around an MOS technology `6502A` processor running
    at `2MHz`.

    - The `Ferguson Big Board II` was a Zilog `Z80`-based computer running at `4MHz`.

    - The `Nascom` was another Zilog `Z80`-based computer.


    ## Popular SBC Families


    Based on their manufacturers and designers, SBCs are grouped into families, models,
    and generations. Here are a few popular SBC families:


    - Raspberry Pi by the Raspberry Pi Foundation

    - Banana Pi and Banana Pro

    - Intel Up Squared Kits

    - CubieBoard

    - BeagleBone


    ## The Raspberry Pi


    The Raspberry Pi is a family of credit card–sized SBCs developed in the United
    Kingdom by the Raspberry Pi Foundation. The Raspberry Pi Foundation was formed
    by Eben Upton in 2009. The aim in developing the Raspberry Pi was to promote the
    teaching of basic computer science in schools and developing countries by providing
    a low-cost computing platform.


    Raspberry Pi Foundation’s Raspberry Pi was released in 2012. It was a massive
    hit and sold over two million units in two years. Subsequently, the Raspberry
    Pi Foundation released revised versions of the Raspberry Pi. They also released
    other accessories for the Pi.


    More information about the Raspberry Pi Foundation can be found on their website
    at [https://www.raspberrypi.org](https://www.raspberrypi.org).


    The product page for Raspberry Pi''s current production models and other accessories
    can be found at [https://www.raspberrypi.org/products](https://www.raspberrypi.org/products).


    I have written, executed, and tested all the code examples in this book on Raspberry
    Pi 4 Model B units with `8GB` RAM. Table [1-2](#index_split_000.html#p21) lists
    the specifications of the Raspberry Pi 4 Model B.


    ***Table 1-2.** Specifications of the Raspberry Pi 4 Model B*


    | **Release Date** | **June 2019** |

    | :--- | :--- |

    | architecture | `armv8` |

    | SoC broadcom | `BCM2711` |

    | Cpu | Quad core `Cortex-A72` (`ARM v8`) 64-bit SoC @ `1.5GHz` |

    | gpu | Broadcom `VideoCore IV` |

    | memory | |'
