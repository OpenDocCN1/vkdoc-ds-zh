    ## raspistill


    The command-line utility we use to capture images using the camera module is `raspistill`.
    We call it as follows:


    ```bash

    raspistill -o test.png

    ```


    `raspistill` does not write anything to the console or terminal, so we need to
    check the directory to see if `test.png` has been created or updated.


    This is how you capture images with various cameras and command-line utilities
    for use in exploring the world of DIP with Pi.


    ## Python 3 for Digital Image Processing


    Python 3 does not have any pre-installed libraries for image processing. The `Python
    Imaging Library` (`PIL`) is one of the most popular beginner-friendly image processing
    libraries used for image processing in Python. This library provides extensive
    file-format support and reasonably powerful image processing capabilities. The
    `core Image library` is designed for achieving faster access to data stored in
    a few basic image formats. The drawback with PIL is that after its last stable
    release (1.1.7) in 2009 and the last commit in 2011, there has not been a new
    release. Also, PIL does not support Python 3. Officially, we have not heard that
    PIL is dead. However, there is a friendly fork (derived) project that’s an unofficial
    replacement and enhancement for PIL. It works well with Python 3 and is called
    `Pillow`. It is mostly backward compatible with PIL. You can get more information
    about Pillow on its home page at [https://python-pillow.org/](https://python-pillow.org/).


    Let’s get started with the basics of Pillow. We can install Pillow by running
    the following command at the terminal:


    ```bash

    sudo pip3 install pillow

    ```


    **Chapter 3 Getting Started**


    This will install the Pillow library for Python 3. To check if it is installed
    properly, open Python 3 in interpreter mode and run the following sequence of
    commands. If Pillow is installed properly, these commands will display its version
    number.


    ```python

    Python 3.9.2 (default, Mar 12 2021, 04:06:34)

    [GCC 10.2.1 20210110] on linux

    Type "help", "copyright", "credits" or "license" for more information.

    >>> from PIL import Image

    >>> print(Image.__version__)

    8.1.2

    >>>

    ```


    ### Working with Images


    Let’s work with images now. Before we begin, we will have to install an image
    viewing utility called `xv` in order for the built-in function `show()` to work.
    The problem is that the `xv` utility is deprecated. So, you will use another utility
    called `xli` and point it to `xv` with a Linux command. Run the following commands:


    ```bash

    sudo apt-get install xli -y

    cd /usr/local/bin

    sudo ln -s /usr/bin/xli xv

    ```


    Save the program shown in Listing [3-1](#index_split_000.html#p77) as `prog01.py`
    in the directory `/home/pi/DIP/code/chapter03`.


    ***Listing 3-1.*** `prog01.py`


    ```python

    from PIL import Image

    im = Image.open("/home/pi/DIP/Dataset/4.1.07.tiff")

    im.show()

    ```


    ![index-78_1.jpg](index-78_1.jpg)


    **Chapter 3 Getting Started**


    Run this code with the following command:


    ```bash

    python3 prog01.py

    ```


    It will show the image in an `xli` window. This is the simplest Pillow program;
    it loads an image in a Python variable with the function call `open()` and displays
    it with the function call `show()`. In the first line, we are importing the `Image`
    module of Pillow. We will learn more about this module in the next chapter. The
    standard version of `show()` is not very efficient, because it saves the image
    to a temporary file and calls the `xv` utility to display the image. However,
    it is handy for the purposes of debugging.


    The output is as shown in Figure [3-7](#index_split_000.html#p78).


    ***Figure 3-7.** A simple demo[5](#index_split_000.html#p78)*


    Due to the limitation of the function `show()`, we will use Python’s built-in
    GUI module `Tkinter` to display images whenever needed. Listing [3-2](#index_split_000.html#p79)
    creates an empty window as shown in Figure [3-8](#index_split_000.html#p79).


    5 4.1.07, 4.1.08 Picture of jelly beans taken at USC. Free to use ([http://sipi.usc.edu/database/copyright.php](http://sipi.usc.edu/database/copyright.php))
    63


    ![index-79_1.jpg](index-79_1.jpg)


    **Chapter 3 Getting Started**


    ***Listing 3-2.*** `prog02.py`


    ```python

    import tkinter as tk

    root = tk.Tk()

    root.title("Test")

    root.mainloop()

    ```


    ***Figure 3-8.** An empty window*


    Let’s display an image using Tkinter, as shown in Listing [3-3](#index_split_000.html#p79).


    ***Listing 3-3.*** `prog03.py`


    ```python

    from PIL import Image, ImageTk

    import tkinter as tk

    im = Image.open("/home/pi/DIP/Dataset/4.1.07.tiff")

    root = tk.Tk()

    root.title("Test")

    photo = ImageTk.PhotoImage(im)

    l = tk.Label(root, image=photo)

    l.pack()

    l.photo = photo

    root.mainloop()

    ```


    ![index-80_1.jpg](index-80_1.jpg)


    **Chapter 3 Getting Started**


    This program uses Python’s built-in module for GUI, called `Tkinter`.'
