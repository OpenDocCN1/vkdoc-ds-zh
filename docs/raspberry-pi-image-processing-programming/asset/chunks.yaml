    ## About the Technical Reviewer


    **Lentin Joseph** is an author, roboticist, and robotics entrepreneur from India.
    He runs a robotics software company called Qbotics Labs in Kochi/Kerala. He has
    ten years of experience in the robotics domain, primarily in the Robot Operating
    System, OpenCV, and PCL.


    He has authored ten books on ROS, namely, *Learning Robotics Using Python*, first
    and second editions; *Mastering ROS for Robotics Programming*, first and second
    editions; *ROS Robotics Projects*, first and second editions; *ROS Programming:
    Building Powerful Robots*; and *Robot Operating System (ROS) for Absolute Beginners*
    first and second editions.


    He is also co-editor of the book *Autonomous Driving and Advanced Driver-Assistance
    Systems (ADAS): Applications, Development, Legal Issues, and Testing*.


    He obtained his masters in robotics and automation from India and has also worked
    at the Robotics Institute, Carnegie Mellon University, USA. He is also a TEDx
    speaker.


    xiii


    ## Acknowledgments


    I would like to thank my friend Anuradha for encouraging me to share my knowledge
    with the world. I would like to thank my longtime mentors from Apress, Celestin
    and Aditee, for giving me an opportunity to share my knowledge and experience
    with readers. I thank Mark Powers and James Markham for helping me to shape this
    book as per Apress standards.


    I am in debt to the technical reviewer, Lentin Joseph. I also thank Prof. Govindrajulu
    Sir’s family, Srinivas (son) and Amy (daughter-in-law), for allowing me to dedicate
    this book to his memory and sharing with us Govindrajulu Sir’s biographical information
    and his photograph for publication. I would also like to thank all the people
    associated with Apress who have been instrumental in bringing this project to
    reality.


    xv


    ## Introduction


    I want to keep this introduction short, concise, and precise. I have been working
    with the domain of image processing for quite a while now. I was introduced to
    Python more than 15 years ago. When I first worked with image processing using
    Raspberry Pi, I found it a bit tedious to comb through all the literature available
    as printed books, video tutorials, and online tutorials, as most lacked a step-by-step
    yet comprehensive guide for a beginner getting started. It was then that I resolved
    to write a book, and then I published the first edition of this book. It has been
    almost five years since the first edition was published and it needed a lot of
    updates.


    This book is the fruit of my efforts and cumulative experience of thousands of
    hours (apart from the ones spent writing the actual book) spent going through
    technical documentation, watching training videos, writing code with the help
    of different tools, debugging faulty code snippets, posting questions, and participating
    in discussions on various question-answer and technical forums online, and referring
    to various code repositories for directions. I have written this edition of the
    book in such a way that beginners will find it easy to understand the topics.
    This book has hundreds of code examples and images (of outputs of code execution
    and screenshots) so readers can understand each concept.'
