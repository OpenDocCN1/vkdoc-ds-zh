    That is the prime reason why it is taught as the first programming language to
    high school and university students who take introductory


    programming courses. An entire new generation of programmers is


    learning Python as their first programming language.


    **Easy to Read**


    Unlike other high-level programming languages, Python does not


    obfuscate the code and make it unreadable. The English-like structure of the Python
    code makes it easier to read compared to code written in other programming languages.
    This makes it easier to understand and easier to learn compared to other high-level
    languages like C and C++.


    **Easy to Maintain**


    As Python code is easy to read, easy to understand, and easy to learn, anyone
    maintaining the code becomes comfortable with the codebase


    very quickly. I can vouch for this from my personal experience maintaining and
    enhancing large legacy codebases that were written in a combination of Bash and
    Python 2.


    **Open Source**


    Python is an open source project, which means its source code is


    freely available. You can make changes to it to suit your needs and use the original
    and modified code in your applications.


    Chapter 2 IntroduCtIon to python and dIgItal Image proCessIng **High-Level Language**


    While writing Python programs, you do not have to manage the low-


    level details like memory management, CPU timings, and scheduling


    processes. All these tasks are managed by the Python interpreter. You can write
    the code directly in easy-to-understand English-like syntax.


    **Portable**


    The Python interpreter has been ported to many OS platforms. Python


    code is also portable. All the Python programs will work on the supported platform
    without requiring many changes if you are careful to avoid


    system-dependent coding.


    You can use Python on GNU/Linux, Windows, Android, FreeBSD, Mac


    OS, iOS, Solaris, OS/2, Amiga, Palm OS, QNX, VMS, AROS, AS/400, BeOS,


    OS/390, z/OS, Psion, Acorn, PlayStation, Sharp Zaurus, RISC OS, VxWorks, Windows
    CE, and PocketPC.


    **Interpreted**


    Python is an interpreted language. Let’s take a look at what that means.


    Programs written in high-level programming languages like C, C++, and


    Java are compiled first. This means that they are first converted into an intermediate
    format. When we run the program, this intermediate format is loaded from secondary
    storage (i.e., from the hard disk) to the memory (RAM) by the linker/loader.


    So, C, C++, and Java have a separate compiler and linker/loader. This


    is not the case with Python. Python runs the program directly from the source
    code. You do not have to bother compiling and linking to the proper libraries.
    This makes Python programs truly portable, as you can copy the program to one
    computer from another and the program runs fine as long as the necessary libraries
    are installed on the target computer.


    **Object Oriented**


    Python supports procedure-oriented programming as well as object-


    oriented programming paradigms.


    Chapter 2 IntroduCtIon to python and dIgItal Image proCessIng All the object-oriented
    programming paradigms are implemented in


    Python. In object-oriented programming languages, the program is built around
    objects that combine data and related functionality. Python is a very simple but
    powerful object-oriented programming language.


