    # Document Outline'
  trans: "\n在使用 Pi 之前，需要先启用 VNC。我们在第一章中已经了解了 `raspi-config` 工具。我们可以使用它（在命令行中）启用 VNC。在桌面环境中，我们也可以找到用于相同任务的\
    \ GUI 工具。点击左上角的树莓派图标。这是一个类似 Windows 的菜单。在 `Preferences`（首选项）部分，我们可以找到 `Raspberry\
    \ Pi Configuration`（树莓派配置）选项。\n\n点击该选项，它会打开一个新窗口。在那里，点击第三个选项卡，标签为 `Interfaces`（接口）。它会显示如下内容（图\
    \ A-9）。\n\n**图 A-9.** 接口\n\n在这里，请确保至少 `SSH` 和 `VNC` 选项已启用。\n\n为了我的开发和编程课程，我需要其他选项，所以我将它们全部启用了。\n\
    \n# 附录\n\n之后，从以下任意一个网址下载 VNC 查看器客户端：\n\n- [`www.realvnc.com/en/connect/download/viewer/`](https://www.realvnc.com/en/connect/download/viewer/)\n\
    - [`www.tightvnc.com/download.php`](https://www.tightvnc.com/download.php)\n-\
    \ [`sourceforge.net/projects/tigervnc/files/stable/1.12.0/`](https://sourceforge.net/projects/tigervnc/files/stable/1.12.0/)\n\
    \n`RealVNC` 是最流行的 VNC 客户端之一，也是我正在使用的客户端。\n\n我将解释其设置过程。如果您希望使用其他客户端，请查阅相关文档和教程。我们首先需要通过提供\
    \ IP 地址来配置连接，如下所示（图 A-10）。\n\n**图 A-10.** 配置远程连接\n\n我们还需要进行身份验证。我更喜欢保存密码，这样就不必在每次尝试连接时都输入了（图\
    \ A-11）。\n\n**图 A-11.** 输入并保存密码\n\n最后，如果您是第一次连接，它会显示一条警告消息。点击 `Always`（始终）按钮，它将启动远程桌面（图\
    \ A-12）。\n\n**图 A-12.** 使用 RealVNC 的树莓派 OS 远程桌面\n\n图 A-12 显示了一个打开了终端客户端的远程桌面。在顶部区域，我们可以看到\
    \ VNC 软件的选项。请探索它们以更好地理解。\n\n# 索引\n\n## A\n\n模拟图像处理, 47\n\n## B\n\n二值阈值处理, 182,\
