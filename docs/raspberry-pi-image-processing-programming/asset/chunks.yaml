- fmt: "```python\nimport matplotlib.pyplot as plt\n\nimg = misc.ascent()\n\nnoisy\
    \ = img + 0.8 * img.std() * np.random.random(img.shape)\n\noutput1 = ndi.median_filter(noisy,\
    \ 3)\n\noutput2 = ndi.median_filter(noisy, 7)\n\noutput3 = ndi.median_filter(noisy,\
    \ 9)\n\noutput = [noisy, output1, output2, output3]\n```\n\n![](index-171_1.jpg)\n\
    \n## Chapter 8 Filters\n\n```python\ntitles = ['Noisy', 'Size = 3', 'Size = 7',\
    \ 'Size = 9']\n\nfor i in range(4):\n    plt.subplot(2, 2, i+1)\n    plt.imshow(output[i],\
    \ cmap='gray')\n    plt.title(titles[i])\n    plt.axis('off')\n\nplt.show()\n\
    ```\n\nThe output is as shown in [Figure 8-10](#index_split_001.html#p171).\n\n\
    **Figure 8-10.** Median filter for noise reduction\n\nMinimum and maximum filters\
    \ can also be applied to a noisy image, as demonstrated in [Listing 8-13](#index_split_001.html#p171).\n\
    \n**Listing 8-13.** `prog12.py`\n\n```python\nimport scipy.misc as misc\nimport\
    \ scipy.ndimage as ndi\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n\
    img = misc.ascent()\n\noutput1 = ndi.minimum_filter1d(img, 9)\noutput2 = ndi.minimum_filter(img,\
    \ 9)\noutput3 = ndi.maximum_filter1d(img, 9)\noutput4 = ndi.maximum_filter(img,\
    \ 9)\n\noutput = [output1, output2, output3, output4]\ntitles = ['Minimum 1D',\
    \ 'Minimum', 'Maximum 1D', 'Maximum']\n\nfor i in range(4):\n    plt.subplot(2,\
    \ 2, i+1)\n    plt.imshow(output[i], cmap='gray')\n    plt.title(titles[i])\n\
    \    plt.axis('off')\n\nplt.show()\n```\n\nThe output is as shown in [Figure 8-11](#index_split_001.html#p173).\n\
    \n![](index-173_1.jpg)\n\n**Figure 8-11.** Minimum and maximum filters\n\n## High-Pass\
    \ Filters\n\n**High-pass filters** work in the exact opposite way to the low-pass\
    \ filters. They allow high-frequency signals to pass through them. They also use\
    \ kernels and convolutions. However, the kernel used for high-pass filters is\
    \ different than that used in low-pass filters. When we apply high-pass filters\
    \ to an image, it sharpens the image (which is opposite of blurring) and highlights\
    \ edges.\n\n[Listing 8-14](#index_split_001.html#p174) demonstrates the Prewitt\
    \ filter to detect edges in the test image.\n\n![](index-174_1.jpg)\n\n**Listing\
    \ 8-14.** `prog13.py`\n\n```python\nimport scipy.misc as misc\nimport scipy.ndimage\
    \ as ndi\nimport matplotlib.pyplot as plt\n\nimg = misc.ascent()\nfiltered = ndi.prewitt(img)\n\
    \noutput = [img, filtered]\ntitles = ['Original', 'Filtered']\n\nfor i in range(2):\n\
    \    plt.subplot(1, 2, i+1)\n    plt.imshow(output[i], cmap='gray')\n    plt.title(titles[i])\n\
    \    plt.axis('off')\n\nplt.show()\n```\n\nThe output is as shown in [Figure 8-12](#index_split_001.html#p174).\n\
    \n**Figure 8-12.** Prewitt filter\n\nWe can see the highlighted edges in [Figure\
    \ 8-12](#index_split_001.html#p174).\n\nWe can also apply Sobel filters to axes\
    \ separately and to the entire image. It will detect horizontal edges, vertical\
    \ edges, and edges on both the axes. [Listing 8-15](#index_split_001.html#p175)\
    \ generates a test image and applies Sobel filters.\n\n**Listing 8-15.** `prog14.py`\n\
    \n```python\nimport numpy as np\nimport scipy.ndimage as ndi\nimport matplotlib.pyplot\
    \ as plt\n\nimg = np.zeros((516, 516))\nimg[128:-128, 128:-128] = 1\nimg = ndi.gaussian_filter(img,\
    \ 8)\nrotated = ndi.rotate(img, -20)\nnoisy = rotated + 0.09 * np.random.random(rotated.shape)\n\
    \nsx = ndi.sobel(noisy, axis=0)\nsy = ndi.sobel(noisy, axis=1)\nsob = np.hypot(sx,\
    \ sy)\n\ntitles = ['Original', 'Rotated', 'Noisy',\n          'Sobel (X-axis)',\
    \ 'Sobel (Y-axis)', 'Sobel']\noutput = [img, rotated, noisy, sx, sy, sob]\n\n\
    for i in range(6):\n    plt.subplot(2, 3, i+1)\n    plt.imshow(output[i])\n  \
    \  plt.title(titles[i])\n    plt.axis('off')\n\nplt.show()\n```\n\nThe output\
