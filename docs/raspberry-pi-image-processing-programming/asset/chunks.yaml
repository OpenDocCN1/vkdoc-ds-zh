    Digital Image Processing**


    To get started with digital image processing (DIP), we will briefly review our
    understanding of a few basic concepts about related topics.


    **Signal Processing**


    Anything that carries any information, when represented mathematically, is called
    a signal. The process or technique used to extract useful and relevant information
    from a given signal is known as signal processing. The system that does this type
    of task is known as a signal processing system.


    The best example of a signal processing system is the human brain. It


    processes various types of signals from various senses. The human brain is a biological
    signal processing system. When the system is made up of electronic components,
    it is known as an electronic signal processing


    system. Signal processing is a discipline that combines mathematics and electrical
    engineering.


    There are two types of electronic signals—analog and digital. The


    following table lists the differences between these two types of signals.


    **Analog**


    **Digital**


    a continuous signal


    discrete in nature


    denoted by sinusoidal waves


    denoted by square waves


    a continuous signal


    a discrete signal


    deteriorated due to noise


    not affected by noise


    not flexible


    Flexible and can perform a variety of operations


    Consumes less bandwidth


    Consumes a lot of bandwidth


    draws a lot of power


    draws less power compared to analog


    Chapter 2 IntroduCtIon to python and dIgItal Image proCessIng **Analog**


    **Digital**


    there are lots of errors


    Fewer errors compared to analog signals,


    in capturing, storing, and


    and there are checksum and error correction


    transmitting analog signals


    algorithms available for digital signals.


    **Image Processing**


    An image is a signal. So, image processing is a type of signal processing.


    Image processing systems are types of signal processing systems. The


    combination of the eye and brain is an example of a biological image


    processing system. There are two types of image processing systems—


    analog and digital.


    **Analog Image Processing**


    The days of still and motion film cameras represent the analog era. The sources
    of analog images are film cameras (still and motion), older fax machines, and
    telex machines. Older television systems, CRT monitors,


    and film projectors represent analog image processing systems. Analog


    image processing involves extensively using analog electronic systems, mechanical
    parts, optics, and chemistry (to develop and store films).


    **Digital Image Processing**


    With the advent of digital computers, storage systems, image sensors, and digital
    cameras, images can be captured, stored, and processed in digital formats. Using
    digital computers to process and retrieve information


    from an image (analog and digital images both) is known as digital image processing.
    It involves extensive use of digital sensors (digital cameras), digital computers,
    and digital storage devices. Here are some applications of digital image processing
    systems:


    Chapter 2 IntroduCtIon to python and dIgItal Image proCessIng


    • Computerized image editing, correction,


    enhancement, denoising, etc.


    • Medical image processing and diagnostics assistance


    • Space image processing (processing images from


    Hubble and ground-based telescopes)'
