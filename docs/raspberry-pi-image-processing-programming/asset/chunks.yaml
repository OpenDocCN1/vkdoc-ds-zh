    In the previous chapter, we learned the functionality found in the `scipy.ndimage`\
    \ module of the SciPy library. We learned how to apply transformations such as\
    \ `shift` and `zoom` on an image. We also learned how to obtain statistical information\
    \ about an image. We saw how to compute and plot the histogram for an image.\n\
    \nIn Chapter [5](https://doi.org/10.1007/978-1-4842-8270-0_5), we studied image\
    \ filters using the Pillow library. In this chapter, we will study in detail the\
