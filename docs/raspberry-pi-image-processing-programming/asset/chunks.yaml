    ### Python 编程语言的简史


    Python 是在 20 世纪 80 年代末设计和构思的。其实施于 1989 年底由荷兰国家数学与计算机科学研究所（Centrum Wiskunde & Informatica）的吉多·范罗苏姆（Guido
    van Rossum）正式开始。Python 是 ABC 编程语言的继承者，而 ABC 本身又受到 SETL 编程语言的启发。1991 年 2 月，范罗苏姆在新闻组
    `alt.sources` 上公开发布了 Python 源代码。


    Python 这个名字的灵感来源于英国电视节目*蒙提·派森的飞行马戏团*，因为范罗苏姆是蒙提·派森的忠实粉丝。


    范罗苏姆是 Python 编程语言的主要作者。他引导 Python 的开发、增强和进一步演进，发挥了核心作用。直到 2018 年 7 月，他一直担任 Python
    的“终身仁慈独裁者”。目前，Python 的开发由一个五人指导委员会领导。


    Python 编程语言的核心哲学（Python 之禅）在 PEP-20（PEP 代表 Python 增强提案）中进行了解释，可在 [`www.python.org/dev/peps/pep-0020`](https://www.python.org/dev/peps/pep-0020)
    找到。


    它包含 20 条软件原则，其中 19 条已被记录在案。原则如下：


    - 优美胜于丑陋。

    - 明确胜于隐晦。

    - 简单胜于复杂。

    - 复杂胜于凌乱。

    - 扁平胜于嵌套。

    - 稀疏胜于稠密。

    - 可读性很重要。

    - 特殊情况不足以特殊到打破规则。

    - 实用性胜于纯粹性。

    - 错误永远不应悄悄忽略。

    - 除非明确沉默。

    - 面对歧义，拒绝猜测的诱惑。

    - 应该有一种——最好只有一种——显而易见的方法来做这件事。

    - 虽然那种方式一开始可能并不明显，除非你是荷兰人。

    - 现在行动胜于永远不行动。

    - 虽然永远不行动往往比立即行动更好。

    - 如果实现难以解释，那是个坏主意。

    - 如果实现容易解释，那可能是个好主意。

    - 命名空间是一个绝妙的主意——让我们多做一些吧！


    ### Python 的特性


