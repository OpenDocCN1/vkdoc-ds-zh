    ## 第 3 章 入门


    我们也可以按如下方式检查图像的属性：


    ***清单 3-4.*** `prog04.py`


    ```

    from PIL import Image


    im = Image.open("/home/pi/DIP/Dataset/4.1.07.tiff")


    print(im.mode)

    print(im.format)

    print(im.size)

    print(im.info)

    print(im.getbands())

    ```


    它会产生以下输出：


    ```

    RGB

    TIFF

    (256, 256)

    {''compression'': ''raw'', ''dpi'': (1, 1), ''resolution'': (1, 1)}

    (''R'', ''G'', ''B'')

    ```


    让我们逐行分析这个程序。


    图像的 **模式（mode）** 定义其像素的类型和深度。以下是 Pillow 中可用的标准模式：


    * 1（1 位像素，黑白，每个像素存储为一个字节）

    * L（8 位像素，黑白）

    * P（8 位像素，使用调色板映射到任何其他模式）

    * RGB（3x8 位像素，真彩色）

    * RGBA（4x8 位像素，带透明度的真彩色）

    * CMYK（4x8 位像素，分色）

    * YCbCr（3x8 位像素，色彩视频格式）


    图像的 **格式（format）** 指的是文件格式。**大小（size）** 指图像以像素为单位的分辨率。**信息（info）** 指图像的辅助信息。函数
    `getbands()` 用于获取图像中颜色的波段。


