    \    print(frame.shape)\n    print(frame.ndim)\n    print(frame.size)\n\n    b\
    \ = frame[:, :, 0]\n    g = frame[:, :, 1]\n    r = frame[:, :, 2]\n\n    cv.imshow('红色通道',\
    \ r)\n    cv.imshow('绿色通道', g)\n    cv.imshow('蓝色通道', b)\n\n    if cv.waitKey(1)\
    \ == 27:\n        break\n\ncap.release()\ncv.destroyAllWindows()\n```\n\n在此代码清单（`prog02.py`）中，我们不仅可以看到每帧的属性，还能看到所有颜色通道的信息，如图\
