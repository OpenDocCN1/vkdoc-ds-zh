    measurements. We studied the shift and zoom transformations and


    calculated the histogram of a grayscale image. We also calculated statistical
    information about the images.


    In the next chapter, we will study image kernels and filters, their types, and
    their applications in image enhancement in detail.


    **CHAPTER 8**


    **Filters**


    In the previous chapter, we learned the functionality found in the


    **scipy.ndimage** module of the SciPy library. We learned how to apply transformations
    such as **shift** and **zoom** on an image. We also learned how to obtain statistical
    information about an image. We saw how to compute and plot the histogram for an
    image.


    In Chapter [5](https://doi.org/10.1007/978-1-4842-8270-0_5), we studied image
    filters using the Pillow library. In this chapter, we will study in detail the
    theory behind those filters. We will also see the types of filters and kernels
    used in image processing, as well as the applications of those filters.


    The following are topics covered in this chapter:


    • Kernels


    • Low-pass filters


    • High-pass filters


    • Fourier filters


    By the end of this chapter, we will be comfortable with SciPy filters and their
    applications.


