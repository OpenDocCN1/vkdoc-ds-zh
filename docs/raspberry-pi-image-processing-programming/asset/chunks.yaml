    ## The Pi Camera Module


    The Raspberry Pi Foundation has designed dedicated camera modules for the Raspberry
    Pi. There are two versions, both of which come in normal and `NoIR` (`No Infrared`)
    varieties. The original versions are 5-megapixel camera modules. The new versions
    are 8-megapixel camera modules.


    Figure [3-4](#index_split_000.html#p73) shows an image of the camera module V2.


    ![index-73_1.jpg](index-73_1.jpg)


    **Chapter 3 Getting Started**


    ***Figure 3-4.** The Pi camera module V2[2](#index_split_000.html#p73)*


    This one is the normal camera module suitable for normal lighting conditions.


    Figure [3-5](#index_split_000.html#p74) shows the NoIR version, suitable for low
    lighting conditions. More details about them can be found at [https://www.raspberrypi.org/products/camera-module-v2](https://www.raspberrypi.org/products/camera-module-v2).
    The camera can be connected to any model of Raspberry Pi by a dedicated camera
    port, as shown in Figure [3-5](#index_split_000.html#p74).


    2 Image provided by the Raspberry Pi Foundation under a CC-by-SA 4.0 license [(https://creativecommons.org/licenses/by-sa/4.0/deed.en)](https://creativecommons.org/licenses/by-sa/4.0/deed.en)
    58


    ![index-74_1.jpg](index-74_1.jpg)


