    \ passing the name of the video file as the argument. We also have to make modifications\
    \ to the following line in the `while` loop block: `if cv.waitKey(1) == 27:`\n\
    \nThe argument we are passing while using the webcam is `1`. However, to show\
    \ the frames of the video file, we have to compute the value of this argument\
    \ we are passing to this function call. We first need to know the frame rate of\
    \ the video in terms of FPS and then divide `1000` by that rate.\n\nThen, we have\
    \ to pass the output of this computation as the argument to the function call\
    \ `cv.waitKey()`. Let us see a few examples with standard frame rates. Usually,\
    \ the cinematic frame rate is around 24 FPS (23.97, actually). So, `1000/24 =\
    \ 41.67`, which is almost equal to `42`. So, the function call for 24 FPS will\
    \ be `cv.waitKey(42)`. For 25 FPS, it is `cv.waitKey(40)`.\n\nFor 30 FPS, it is\
    \ `cv.waitKey(33)`, and so on. As an exercise, open a video file by making the\
    \ discussed modifications.\n\n## Converting the Colorspace of Image\n\nColorspace\
    \ is a mathematical representation of color models. A color model is a way to\
    \ represent the colors in a reproducible way. The OpenCV library reads an image\
    \ or a live webcam feed or a video in the BGR colorspace. We can convert an image\
    \ from BGR to any colorspace of our choice. We will frequently need to convert\
    \ the live webcam feed from BGR to grayscale throughout the chapter. Let's see\
    \ how to do that. Have a look at Listing 10-2.\n\n### Listing 10-2. prog01.py\n\
    \n```\nimport numpy as np\nimport cv2 as cv\n\ncap = cv.VideoCapture(0)\ncap.set(cv.CAP_PROP_FRAME_WIDTH,\
    \ 256)\ncap.set(cv.CAP_PROP_FRAME_HEIGHT, 144)\n\nif not cap.isOpened():\n   \
    \ print(\"Cannot open camera...\")\n    exit()\n\nwhile True:\n    ret, frame\
    \ = cap.read()\n\n    if not ret:\n        print(\"Can't receive frame... \\nExiting\
    \ ...\")\n        break\n\n    gray = cv.cvtColor(frame,\n                   \
    \    cv.COLOR_BGR2GRAY)\n\n    cv.imshow('frame', gray)\n\n    if cv.waitKey(1)\
    \ == 27:\n        break\n\ncap.release()\ncv.destroyAllWindows()\n```\n\nIn the\
    \ following line, we are converting the color frame into a greyscale frame:\n\n\
    ```\ngray = cv.cvtColor(frame,\n                   cv.COLOR_BGR2GRAY)\n```\n\n\
    The function `cvtColor()` is used to achieve the conversion between colorspaces.\
    \ We will also be using this function quite frequently throughout the chapter\
    \ as many image processing routines in SciPy need grayscale images as the input.\
    \ Run the program to see the output.\n\n## Separating Color Channels in Live Webcam\
    \ Stream\n\nWe can also separate the color channels in the live webcam stream\
    \ with the code in Listing 10-3.\n\n### Listing 10-3. prog02.py\n\n```\nimport\
