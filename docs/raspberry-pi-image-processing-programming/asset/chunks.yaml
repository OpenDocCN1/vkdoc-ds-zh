    ## Chapter 2: Introduction to Python and Digital Image Processing Using Raspberry
    Pi and Python for Digital Image Processing (DIP)


    Since DIP requires digital computers, we need to use a computer and an associated
    programming platform to implement digital image processing.


    Raspberry Pi fulfills all the requirements of a minimal power system required
    for DIP. The most appealing feature of Raspberry Pi is its low cost. Also, it
    can be interfaced with a variety of digital image sensors like webcams and the
    Pi camera module.


    We learned that Python is an easy-to-learn programming language that helps us
    focus on the task at hand rather than having to worry about syntax. It is also
    the most preferred programming platform for Raspberry Pi. Many third-party image
    processing and visualization libraries are available for Python. This makes Raspberry
    Pi and Python the most obvious choices for beginners to get started with DIP.


    ## Exercise


    Complete the following Exercise to better understand the Python 3 background.


    • Visit and explore the Python home page at [www.python.org](http://www.python.org).

    • Visit and explore the Python documentation page at [https://docs.python.org/3/](https://docs.python.org/3/).

    • Check for new features of the latest releases of Python at [https://docs.python.org/3/whatsnew/index.html](https://docs.python.org/3/whatsnew/index.html).


    ## Chapter 2: Introduction to Python and Digital Image Processing Summary


    In this chapter, we learned about the background, history, and features of Python.
    We also studied the important differences between Python 2.x and Python 3.x. We
    learned to use Python 3 in scripting and interpreter modes. We looked at a few
    popular IDEs for Python and configured Geany for Python 3 on the Pi. Finally,
    we learned about the field of digital image processing. In the next chapter, we
    will get started with a popular digital image processing library in Python called
    Pillow. We will also learn how to use the `Tkinter` library to show images.


    ## Chapter 3: Getting Started


    In the previous chapter, we learned about the philosophy of Python. We also learned
    why we should use Python 3, as well as several concepts related to digital image
    processing. This chapter will look at image processing programming using Python
    3 on the Raspberry Pi. We will learn how to connect a Raspberry Pi to various
    camera sensors in order to acquire images. We will be introduced to the Pillow
    and Tkinter libraries in Python 3. The following is a list of topics we will learn
    in this chapter:


    • Image sources

    • Using a webcam

    • The Pi camera module

    • Python 3 for digital image processing


    By the end of this chapter, we will be comfortable using the cameras, as well
    as the libraries `Pillow` and `Tkinter`.


    ## Image Sources


    To learn how to do digital image processing, we are going to need digital images.
    There are standard image datasets that are used all around the world; we will
    use a couple of free-to-use images from the following database: [http://sipi.usc.edu/database/](http://sipi.usc.edu/database/).


