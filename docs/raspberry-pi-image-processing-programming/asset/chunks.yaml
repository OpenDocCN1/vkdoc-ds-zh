- fmt: 'BIOS/UEFI (Basic Input/Output System / Unified Extensible Firmware Interface)
    is used to get the computer system started after it is turned on. It also manages
    data flow between the computer’s operating system and attached peripheral devices,
    such as the hard disk, video adapter, keyboard, mouse, and printer.


    Since the Raspberry Pi does not have a BIOS/UEFI, the various system configuration
    parameters that are normally stored and modified using the BIOS/UEFI are instead
    stored in a text file called `config.txt`.


    The Raspberry Pi `config.txt` file is on the boot partition of the Raspberry Pi.
    It is normally accessible as `/boot/config.txt` from Linux. However, from Windows
    and MacOS, it is seen as a file in the accessible part of the microSD card. The
    accessible part of the card, as we already know, is labeled `boot`.


    On a Raspberry Pi, you can edit this file with the following command:


    ```

    sudo nano /boot/config.txt

    ```


    **Note:** `nano` is a simple and easy-to-learn terminal-based text editor for
    Linux. Visit its home page at [https://www.nano-editor.org](https://www.nano-editor.org)
    to learn more about it. I find it easier to use than `vi` or `vim` editors.


    To learn more about `config.txt`, visit the page [http://elinux.org/RPiconfig](http://elinux.org/RPiconfig).
    A sample configuration can also be found at [http://elinux.org/R-Pi_configuration_file](http://elinux.org/R-Pi_configuration_file).


    ### Updating the RPi


    The Raspberry Pi must be connected to the internet in order to update it successfully.
    Let’s update the firmware and the Raspberry Pi OS.


    #### Updating the Firmware


    To update the firmware, run the command `sudo rpi-update`.


    #### Updating and Upgrading Raspberry Pi OS


    We will use `APT` for this. `APT` (Advanced Package Tool) is a program that handles
    the installation and removal of software on Debian and other Debian derivatives.
    `APT` simplifies the process of managing software on Debian systems by automating
    the fetching, configuration, and installation of software packages. We need an
    internet connection for this too.


    First, update the system’s package list by entering the following command in the
    terminal:


    ```

    sudo apt update

    ```


    This downloads the package lists from the respective remote repositories and updates
    them in the local computer so that information on the newest versions of packages
    and their dependencies is available for the installation and update. It should
    be run before running the install or upgrade commands.


    Next, upgrade all the installed packages to their latest versions using this command:


    ```

    sudo apt full-upgrade -y

    ```


    This fetches new versions of the packages on the local machine that are marked
    for upgrade. It also detects and installs any dependencies. It also removes obsolete
    packages.


    Doing this regularly will keep the Raspberry Pi OS up to date. After entering
    these commands, it will take a while to update the OS, because these commands
    fetch the data and the packages from remote repositories on the internet.


    **Note:** The command `apt help` will list all the options associated with the
    `apt` utility.


    ### Shutting Down and Restarting RPi


    We can shut down the RPi safely using either of the following commands:


    ```

    sudo shutdown -h

    sudo init 0

    ```


    We can reboot the RPi using either of the following commands:


    ```

    sudo reboot -h

    sudo init 6

    ```


    ### Summary


    In this chapter, we learned how to set up and access RPi in headless mode over
    Wi-Fi. We are comfortable with this part now.


    The next chapter will focus on the concepts involved with digital image processing.
    We will also write basic programs with Python 3.


    ---


    ## Chapter 2: Introduction to Python and Digital Image Processing


    In the last chapter, we explored the amazing world of single-board computers and
    Raspberry Pi. We booted up the Raspberry Pi, connected it to the internet, and
    updated the Raspberry Pi OS.


    In this chapter, we will get started with Python and the concepts of digital image
    processing (DIP). Let’s begin with an introduction to Python. I personally find
    Python amazing and have been enchanted by it. Python is a simple yet powerful
    programming language. When programmers use Python, it’s easy to focus on solving
    a given problem as they do not have to worry about the syntax. Python perfectly
    fits the philosophy of Raspberry Pi, which is programming for everyone. That’s
    why it’s the most preferred programming platform for Raspberry Pi and other computers.


    The following is a list of topics we will learn in this chapter:


    - History of Python

    - Features of Python

    - Python 3

    - IDEs for Python

    - Introduction to digital image processing


    By the end of this chapter, we will be comfortable with the concepts of digital
    image processing and Python 3 basics.


    ### A Brief History of the Python Programming Language


    Python was designed and conceived in the late 1980s. Its actual implementation
    was started in late 1989 by Guido van Rossum at Centrum Wiskunde & Informatica
    (National Research Institute for Mathematics and Computer Science) in the Netherlands.
    Python is a successor to the ABC programming language, which itself was inspired
    by the SETL programming language. In February of 1991, Van Rossum publicly published
    the Python source code to the newsgroup `alt.sources`.


    The name Python was inspired by the British television show *Monty Python’s Flying
    Circus* because Van Rossum was a big fan of Monty Python.


    Van Rossum is the principal author of the Python programming language. He played
    a central role in guiding the development, enhancement, and further evolution
    of Python. He held the title Benevolent Dictator for Life for Python till July
    2018. Currently, Python development is guided by a five-member steering council.


