    **Python 3 for Digital Image Processing**


    Python 3 does not have any pre-installed libraries for image processing.


    The **Python Imaging Library** (**PIL**) is one of the most popular beginner-friendly
    image processing libraries used for image processing in Python.


    This library provides extensive file-format support and reasonably


    powerful image processing capabilities. The **core Image library** is designed
    for achieving faster access to data stored in a few basic image formats. The drawback
    with PIL is that after its last stable release (1.1.7) in 2009 and the last commit
    in 2011, there has not been a new release. Also, PIL does not support Python 3.
    Officially, we have not heard that PIL is dead. However, there is a friendly fork
    (derived) project that’s an unofficial replacement and enhancement for PIL. It
    works well with Python 3 and is called **Pillow**. It is mostly backward compatible
    with PIL. You can get more information about Pillow on its home page at [https://python-pillow.org/](https://python-pillow.org/).


    Let’s get started with the basics of Pillow. We can install Pillow by


    running the following command at the terminal:


    sudo pip3 install pillow


