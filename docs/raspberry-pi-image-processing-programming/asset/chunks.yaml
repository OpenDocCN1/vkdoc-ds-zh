    ## 第 2 章：Python 与数字图像处理入门——使用树莓派和 Python 进行数字图像处理


    由于数字图像处理需要数字计算机，我们必须借助计算机以及相应的编程平台来实现。


    树莓派满足了数字图像处理对最小功耗系统的所有要求。它最吸引人的特点是成本低廉。此外，它还能与多种数字图像传感器（如网络摄像头和树莓派摄像头模块）进行连接。


    我们了解到，Python 是一种易于学习的编程语言，它帮助我们专注于手头的任务，而无需过多担心语法问题。它也是树莓派最受欢迎的编程平台。Python 拥有许多第三方图像处理和可视化库。这使得树莓派和
    Python 成为初学者入门数字图像处理最显而易见的选择。


    ## 练习题


    完成以下练习，以更好地理解 Python 3 的背景知识。


    • 访问并浏览 Python 主页 [www.python.org](http://www.python.org)。

    • 访问并浏览 Python 文档页面 [`docs.python.org/3/`](https://docs.python.org/3/)。

    • 在 [`docs.python.org/3/whatsnew/index.html`](https://docs.python.org/3/whatsnew/index.html)
    查看 Python 最新版本的新特性。


    ## 第 2 章：Python 与数字图像处理入门总结


    在本章中，我们了解了 Python 的背景、历史和特性。我们还学习了 Python 2.x 与 Python 3.x 之间的重要区别。我们学习了如何在脚本模式和解释器模式下使用
    Python 3。我们介绍了几款流行的 Python IDE，并在树莓派上配置了适用于 Python 3 的 Geany。最后，我们学习了数字图像处理领域的相关知识。在下一章中，我们将开始学习
    Python 中一个名为 Pillow 的流行数字图像处理库。我们还将学习如何使用 `Tkinter` 库来显示图像。


    ## 第 3 章：开始上手


    在上一章中，我们学习了 Python 的设计理念，也了解了为什么应该使用 Python 3，以及一些与数字图像处理相关的概念。本章我们将探讨如何在树莓派上使用
    Python 3 进行图像处理编程。我们将学习如何将树莓派连接到各种摄像头传感器以获取图像。我们将介绍 Python 3 中的 Pillow 和 Tkinter
    库。以下是本章将要学习的主题列表：


    • 图像来源

    • 使用网络摄像头

    • 树莓派摄像头模块

    • 用于数字图像处理的 Python 3


    在本章结束时，我们将能够熟练使用摄像头以及 `Pillow` 和 `Tkinter` 库。


