    ## Noise and Gradients


    Noise is the unwanted part in a signal. Depending on the type of signal, noise
    can take various forms. We know that an image is a signal. So, an image can have
    noise. Noise can be inadvertently added into an image at the time of capturing
    that image or transmission. We can generate (or simulate) noise as shown in Listing[4-11](#index_split_000.html#p98).


    ***Listing 4-11.*** `prog10_3.py`


    ```

    from PIL import Image

    im = Image.effect_noise((512, 512), 0.01)

    im.show()

    ```


    We can generate a linear gradient as demonstrated in Listing[4-12](#index_split_000.html#p98).


    ***Listing 4-12.*** `prog10_4.py`


    ```

    from PIL import Image

    im = Image.linear_gradient(''P'')

    im.show()

    ```


    We can generate a radial gradient as demonstrated in Listing[4-13.](#index_split_000.html#p98)


    ***Listing 4-13.*** `prog10_5.py`


    ```

    from PIL import Image

    im = Image.radial_gradient(''P'')

    im.show()

    ```


    Please run all these listings to see the code in action.


    **Chapter 4 Basic Operations On Images**


    ## ImageChops Module


    This module has routines for many basic arithmetic and logical operations that
    we can use on images. Let’s look at them quickly one by one.


    We can add two images together using the `add()` method.


    The following is sample code for adding images:


    `im3 = ImageChops.add(im1, im2)`


    The `add_module()` method adds two images without clipping the result:


    `im3 = ImageChops.add_modulo(im1, im2)`


    The `darker()` method compares two images, pixel by pixel, and returns the darker
    pixels:


    `im3 = ImageChops.darker(im1, im2)`


    The `difference()` method returns the difference of the absolute values of two
    images:


    `im3 = ImageChops.difference(im1, im2)`


    It uses the following mathematical formula for calculating the difference:


    `image3 = abs(image1 - image2)`


    We can invert an image as follows:


    `im2 = ImageChops.invert(im1)`


    Just like with `darker()`, you can use the `lighter()` method to return the set
    of lighter pixels:


    `im3 = ImageChops.lighter(im1, im2)`


    **Chapter 4 Basic Operations On Images**


    `logical_and()` and `logical_or()` are the logical operations to use on images.
    These are explained with the help of black-and-white images. The following are
    the example usages of these routines:


    ```

    im1 = Image.open("/home/pi/DIP/Dataset/ruler.512.tiff")

    im2 = Image.open("/home/pi/DIP/Dataset/ruler.512.tiff")

    im2 = im2.transpose(Image.ROTATE_90)

    im3 = ImageChops.logical_and(im1.convert("1"), im2.convert("1"))

    im3 = ImageChops.logical_or(im1.convert("1"), im2.convert("1"))

    ```


    These examples convert the grayscale images to black-and-white images first and
    then perform the logical operations on them. Figure[4-6](#index_split_000.html#p101)
    shows the output of logical operation AND.


