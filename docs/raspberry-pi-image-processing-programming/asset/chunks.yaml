    \ is surprisingly plain. We just increment the rotation angle with each frame,\
    \ and when it reaches 360 degrees, we start over. The following image (Figure\
    \ 10-3) shows a screenshot of one of the frames.\n\n***Figure 10-3.** Geometric\
