    在上一章中，我们开始使用 Pillow 进行图像处理。我们还使用了 **Tkinter** 来显示图像。在本章中，我们将学习可应用于图像的各种算术和逻辑运算。我们将探索使用
    Pillow 中的 `Image`、`ImageChops` 和 `ImageOps` 模块来实现这些操作。我们还将学习如何在 Tkinter 中使用滑块来动态改变程序输入。


