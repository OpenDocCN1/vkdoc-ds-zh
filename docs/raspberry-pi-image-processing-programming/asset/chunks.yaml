    ## Robust


    Python provides robustness by means of the ability to handle errors. The full
    stack trace of the encountered errors is available and makes the life of the programmer
    more bearable. The runtime errors are known as exceptions. The feature that handles
    these errors is known as an exception-handling mechanism.


    ## Rapid Prototyping


    Python is used as a rapid prototyping tool. As you learned earlier, Python has
    extensive libraries and is easy to learn, which has led many software architects
    to use it as a tool to rapidly prototype their ideas into working models.


    ## Memory Management


    In assembly language and in programming languages like C and C++, memory management
    is the responsibility of the programmer. This is in addition to the task at hand.
    This creates an unnecessary burden on the programmer. In Python, the Python interpreter
    takes care of the memory management. This helps the programmers steer clear of
    memory issues and focus on the task at hand.


    ## Powerful


    Python has everything in it that a modern programming language needs. It is used
    in applications such as computer visioning, supercomputing, drug discovery, scientific
    computing, simulation, and bioinformatics. Millions of programmers around the
    world use Python. Many big organizations like NASA, Google, SpaceX, and Cisco
    use Python for their applications and infrastructure.


    ## Community Support


    I find this to be the most appealing feature of Python. Recall that Python is
    open source. It also has a community of almost a million programmers throughout
    the world (probably more, as today high school kids are learning Python too).
    There are also plenty of forums on the internet to support programmers who encounter
    a roadblock. None of my queries related to Python have ever gone unanswered.


    ## Python 3


    Python 3 was released in 2008. The Python development team decided to do away
    with some of the redundant features of Python, simplify some more features, rectify
    some design flaws, and add a few much-needed features.


    It was decided that a major revision number was needed for this and that the resultant
    release would not be backward compatible. Python 2.x and 3.x were supposed to
    coexist in parallel so the programmer community would have enough time to migrate
    their code and third-party libraries from 2.x to 3.x. Python 2.x code cannot be
    run as-is in most cases, as there are significant differences between 2.x and
    3.x.


    ## Python 2 and Python 3 on Raspberry Pi OS


    Raspberry Pi OS is a derivative of Debian Linux. Python 2 and Python 3 interpreters
    are pre-installed in Raspberry Pi OS. The Python 2 interpreter can be invoked
    by running the command `python` in the terminal. The Python 3 interpreter can
    be invoked by running the command `python3` in the terminal. We can check the
    Python 3 interpreter version by running either of the following commands:


    ```

    python3 -V

    python --version

    ```


    You can check the location of the Python 3 binary by running the following command:


    ```

    which python3

    ```


    ## Running a Python Program and Python Modes


    You have set up your environment for Python programming, so let’s get started
    with the simple concepts of Python. Python has two modes—interactive mode and
    script mode. Let’s look at these modes in detail.


    ### Interactive Mode


    Python’s interactive mode is a command-line shell. It provides immediate output
    for every executed statement. It also stores the output of previously executed
    statements in the active memory. As new statements are executed by the Python
    interpreter, the entire sequence of previously executed statements is considered
    while evaluating the current output. We have to type the command `python3` in
    the terminal to invoke the Python 3 interpreter into interactive mode, as follows:


    ```

    pi@raspberrypi:~ $ python3

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    [GCC 4.9.1] on linux

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    You can execute Python statements directly in this interactive mode just like
    when you run commands from the OS shell/console, as follows:


    ```

    >>>print (''Hello World!'')

    Hello World!

    >>>

    ```


    We will not be using interactive mode in this book. However, keep it in mind,
    as it’s the quickest way to check small snippets of code (five to ten lines).
    We can quit interactive mode using the `exit()` statement, as follows:


    ```

    >>> exit()

    pi@raspberrypi:~ $

    ```


    ### Script Mode


    Script mode is where the Python script files (`.py`) are executed by the Python
    interpreter.


    Create a file called `test.py` and add the `print (''Hello World!'')` statement
    to the file. Save the file and run it with the Python 3 interpreter as follows:


    ```

    pi@raspberrypi:~ $ python3 test.py

    Hello World!

    pi@raspberrypi:~ $

    ```


    In this example, `python3` is the interpreter and `test.py` is the filename. In
    case the `test.py` file is not in the same directory where we are invoking the
    `python3` interpreter, we have to provide the absolute path of the Python file.


    ## IDEs for Python


    An integrated development environment (IDE) is a software suite that has all the
    basic tools needed to write and test programs. A typical IDE has a compiler, a
    debugger, a code editor, and a build automation tool. Most programming languages
    have various IDEs to make programmers’ lives better. Python too has many IDEs.
    Let’s look at a few of them.


    ### IDLE


    IDLE stands for Integrated DeveLopment Environment. We have to install it on Raspberry
    Pi OS. IDLE3 is for Python 3. It’s popular with Python beginners. We can install
    it with the following command:


    ```

    pip3 install idle

    ```


    We can launch IDLE3 using the following command:


    ```

    nohup idle &

    ```


    Figure 2-1 shows the IDLE3 code editor and an interactive prompt.


    ![](index-56_1.png)


    **Figure 2-1.** IDLE3 interactive prompt for Python 3 interpreter and a new code
    file


    We can go to **Options** ➤ **Configure IDLE** in the main menu. We can change
    the settings of the editor here (Figure 2-2).


    ![](index-57_1.jpg)


    **Figure 2-2.** IDLE3 configuration options


    ![](index-58_1.jpg)


    ### Geany


    Geany is a text editor that uses the GTK+ toolkit and has the basic features of
    an integrated development environment. It supports many file types and programming
    languages. It has some nice features. Check out [https://www.geany.org](https://www.geany.org)
    for more details. Figure 2-3 shows the Geany text editor window.


    **Figure 2-3.** Geany IDE


    Type `print("Hello World!")` in the code editor and save the file in the `/home/pi`
    directory as `test.py`. Click **Build** in the menu bar and then choose **Execute**.
    You can also use the **F5** keyboard shortcut to execute the program. The program
