    # CHAPTER 6


    # Introduction to the Scientific Python Ecosystem


    In the previous chapter, we studied advanced image processing with Pillow. Pillow
    is a nice starting point for image processing operations. However, it has its
    limitations. When it comes to implementing elaborate image processing operations,
    such as segmentation, morphological operations, advanced filters, and measurements,
    Pillow proves to be inadequate. We really need to use better libraries for advanced
    image processing. The SciPy ecosystem serves as a foundation for all the scientific
    uses of Python.


    `SciPy` stands for **Scientific Python**. It extensively uses `NumPy` (Numerical
    Python) and `matplotlib` for numeric operations and data visualization, respectively.
    This chapter covers the basics of `NumPy`, `SciPy`, and `matplotlib`. It also
    explores introductory-level programming examples using `NumPy`, `scipy.misc`,
    and `matplotlib`. We will explore the following topics in this chapter:


    - The Scientific Python ecosystem

    - `matplotlib`

    - Conversion between PIL image objects and `NumPy` `ndarrays`


    By the end of this chapter, we will be comfortable with the basics of the SciPy
    ecosystem.


    ## The Scientific Python Ecosystem


    The Scientific Python ecosystem is an open source and free collection of libraries
    for Python to be used in the scientific domain. It has modules for numerical operations
    (`NumPy`), scientific operations (`SciPy`), and data visualization (`matplotlib`).
    It is used extensively by scientific, mathematical, engineering, and analytics
    communities around the world.


    The ecosystem has the following core components:


    - `NumPy`

    - `SciPy`

    - `matplotlib`

    - `IPython`

    - `Pandas`

    - `Sympy`

    - `Nose`


    Many other libraries use the core modules in the ecosystem for additional algorithms
    and data structures. Examples include OpenCV and Scikit.


    Figure 6-1 aptly summarizes the role of the Scientific Python ecosystem in the
    world of scientific computing.


    **Figure 6-1.** Core components of the Scientific Python ecosystem


    The best way to install the components of the Scientific Python ecosystem on a
    Raspberry Pi is to use the `pip` utility.


    First, upgrade the Pi with the following command:


    ```

    sudo python3 -m pip install --upgrade pip

    ```


    Then, install the components of the Scientific Python ecosystem with the following
    command:


    ```

    pip3 install numpy scipy matplotlib ipython jupyter pandas sympy nose

    ```


    This installs all the required libraries.


