    # Chapter 1 Introduction to Single-Board Computers and Raspberry Pi


    ## Prepare the microSD Card


    Following are the steps to prepare the card:


    1. Insert the card into the card reader and connect it to the computer.

    2. Install the **Raspberry Pi Imager** software from [https://www.raspberrypi.com/software/](https://www.raspberrypi.com/software/).
    For Debian and derivatives, run the following command in the terminal emulator:


    ```

    sudo apt install rpi-imager

    ```


    3. Open the installed **Raspberry Pi Imager** program. It looks as shown in Figure
    1-5.


    ***Figure 1-5.** Raspberry Pi Imager*


    ![](index-28_1.png)


    4. Click on the **CHOOSE OS** button. It opens options as shown in Figure 1-6.


    ***Figure 1-6.** Choosing the OS*


    Choose the option **Raspberry Pi OS (other)** by clicking on it. It shows another
    list of options, as shown in Figure 1-7.


    ![](index-29_1.png)


    ***Figure 1-7.** Choosing the OS*


    Choose **Raspberry Pi OS (Legacy)**. It is a very well-maintained flavor of **Debian
    Buster** that supports command-line utilities for the Raspberry Pi camera.


    5. Now, click on the **CHOOSE STORAGE** button. It will show the microSD card
    connected to the computer, as shown in Figure 1-8.


    ![](index-30_1.jpg)


    ***Figure 1-8.** Choosing the storage*


    6. It will enable the **WRITE** button, as shown in Figure 1-9.


    ![](index-31_1.png)


    ***Figure 1-9.** Write button enabled*


    Click the **WRITE** button. It will show a warning message, as shown in Figure
    1-10.


    ![](index-32_1.png)


    ***Figure 1-10.** Warning message*


    Don’t worry about the message. Click the **YES** button. It starts downloading
    the files from the internet and writing them to the microSD card. A progress bar
    will appear, as shown in Figure 1-11.


    ![](index-33_1.jpg)


    ***Figure 1-11.** Progress bar*


    Once the entire process completes, it shows the following (Figure 1-12) message.


    ![](index-34_1.png)


    ***Figure 1-12.** Final message*


    Click the **CONTINUE** button. Disconnect the card reader and reconnect it again.


    7. Once we reconnect it, it will show in the filesystem as a drive labeled `boot`.
    The OS may automatically assign a letter to that. Create an empty file in the
    location `boot` and name it `ssh`. Don’t use any extension. This will enable remote
    login.


    8. Create another file and name it `wpa_supplicant.conf`. It is necessary to connect
    the RPi board to the Wi-Fi after booting up. Add the following contents to the
    file and save it:


    ```

    country=IN

    ctrl_interface=DIR=/var/run/wpa_supplicant

    GROUP=netdev

    ```'
