- fmt: '# Introduction


    All the code examples are adequately explained.


    The book begins with a general discussion of Raspberry Pi and Python programming.
    It is followed by a discussion of concepts related to the domain of image processing.
    Then, it explores the libraries `Pillow` and `TKinter`. The following few chapters
    focus on the scientific Python ecosystem and image processing with libraries such
    as `NumPy`, `SciPy`, and `Matplotlib`. The last chapter discusses how `OpenCV`
    can be used for applying image-processing routines on a live webcam feed. The
    appendix briefly discusses the `pgmagik` library, which can be used for generating
    sample images. It also has plenty of tips and tricks for using a Raspberry Pi
    board effectively.


    As a final note, we started and finished working on this project at a very turbulent
    time (early 2022) when much of the world was facing yet another wave of fresh
    infections brought by new variants of the virus causing the COVID pandemic. Everyone
    around us is still recovering from the impact of the pandemic. This book offered
    me a sense of purpose. I hope that all the readers enjoy reading this book as
    much as I enjoyed writing it.


    ## Chapter 1: Introduction to Single-Board Computers and Raspberry Pi


    Let’s start this exciting journey of exploring the scientific domain of digital
    image processing with Raspberry Pi. To begin, we must be comfortable with the
    basics of single-board computers (SBCs) and the Raspberry Pi.


    This chapter discusses the definition, history, and philosophy of SBCs. It compares
    SBCs to regular computers, then moves toward the most popular and bestselling
    SBC of all time, the Raspberry Pi. By the end of this chapter, we will have adequate
    knowledge to independently set up our own Raspberry Pi. This chapter aims to make
    us comfortable with the basic concepts of SBCs and Raspberry Pi setup.


    ### Single-Board Computers (SBCs)


    A single-board computer (referred to as an SBC from now on) is a fully functional
    computer system built around a single printed circuit board. An SBC has a microprocessor(s),
    memory, input/output, and other features required of a minimally functioning computer.
    Unlike with desktop personal computers (PC), most SBCs do not have expansion slots
    for peripheral functions or expansion. As all components—processor(s), RAM, GPU,
    etc.—are integrated on a single printed circuit board (PCB), we cannot upgrade
    an SBC.


    Few SBCs are made to plug into a backplane for system expansion. SBCs come in
    many varieties, sizes, shapes, form factors, and feature sets. Due to advances
    in electronics and semiconductor technologies, most SBC prices are very low. With
    a price of around $50 a piece, we have in our hands a development tool suitable
    for new applications, hacking, debugging, testing, hardware development, and automation
    systems.


    SBCs are usually manufactured with the following form factors:


    - Pico-ITX

    - PXI

    - Qseven

    - VMEbus

    - VPX

    - VXI

    - AdvancedTCA

    - CompactPCI

    - Embedded Compact Extended (ECX)

    - Mini-ITX

    - PC/104

    - PICMG


    ### Differences Between SBCs and Regular Computers


    Table [1-1](#index_split_000.html#p18) lists the differences between SBCs and
    regular computers.


    ***Table 1-1.** Differences Between SBCs and Regular Computers*


    | **Single-Board Computer** | **Regular Computer** |

    |---------------------------|----------------------|

    | not modular               | modular              |

    | Components cannot be upgraded or replaced | Components can be upgraded or replaced
    |

    | a system on chip          | not a system on chip |

    | has a small form factor   | has a large form factor |

    | Is portable               | Is mostly non-portable or semi-portable |

    | Consumes less power       | Consumes more power  |

    | Cheaper than a regular computer | Costs more than an SBC |


    ### System on Chips (SoCs)'
