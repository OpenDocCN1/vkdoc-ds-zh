- "# 视频处理\n\n在上一章中，我们学习了在图像处理领域使用形态学操作。我们还使用像 `NumPy`、`SciPy` 和 `matplotlib` 这样的库演示了所有这些操作。\n\
  \n到目前为止，贯穿本书，我们一直在讨论如何处理静态图像。我们知道获取静态图像的方法以及如何处理它们。本章专门致力于处理连续图像流，例如视频和实时网络摄像头视频流。我们还将介绍一个新库\
  \ `OpenCV`。我们将在本章中涵盖以下主题：\n\n- `OpenCV` 库简介\n- 转换图像的色彩空间\n- 在实时网络摄像头视频流中分离颜色通道\n\
  - 对实时网络摄像头视频流的更多操作\n\n到本章结束时，我们将非常熟悉使用 `SciPy` 和 `NumPy` 处理网络摄像头视频流和视频。\n\n## OpenCV\
  \ 库简介\n\n我们已经探索了在 `SciPy` 和 `NumPy` 库中发现的许多函数如何用于处理图像。现在我们将来审视另一个流行的图像处理库 `OpenCV`\
  \ 中非常有限的一部分。我们将使用它来读取实时网络摄像头视频流和视频文件。对于处理视频和实时网络摄像头视频流，我们仍将使用 `SciPy`。\n\n`OpenCV`\
  \ 代表开源计算机视觉。它是一个用于实时计算机视觉的库。它包含大量用于图像处理和视频处理的功能。它还包含许多计算机视觉算法的实现。它主要用 C++ 编写。它有针对\
  \ C++、Python、Java、MATLAB/OCTAVE 和 JavaScript 等语言的接口（API；应用程序编程接口）。我们可以在网页 [`opencv.org/`](https://opencv.org/)\
  \ 上进行探索。\n\n让我们开始在我们的树莓派上安装这个库，使用以下命令：\n\n```bash\npip install opencv-python\n```\n\
  \n对于后续的演示，我们将需要一个网络摄像头。\n\n\n\n我一直使用的是**罗技 C922 Pro**。这款摄像头价格不菲，大约需要 150 美元。不过，我会在多款应用中使用它。如果这款摄像头超出您的预算，您也可以使用较便宜的摄像头进行演示。大多数品牌\
  \ USB 摄像头都能与树莓派完美配合。您还可以在网页 [`elinux.org/RPi_USB_Webcams`](https://elinux.org/RPi_USB_Webcams)\
  \ 上查看与树莓派兼容的摄像头列表。开始使用时，将摄像头连接到树莓派的四个 USB 端口之一即可。\n\n现在，请查看下面的代码清单（清单 10-1）。\n\n\
  **清单 10-1.** `prog00.py`\n\n```python\nimport numpy as np\nimport cv2 as cv\n\n\
  cap = cv.VideoCapture(0)\ncap.set(cv.CAP_PROP_FRAME_WIDTH, 256)\ncap.set(cv.CAP_PROP_FRAME_HEIGHT,\
  \ 144)\n\nif not cap.isOpened():\n    print(\"Cannot open camera...\")\n    exit()\n\
  \nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        print(\"Can't\
  \ receive frame... \\nExiting ...\")\n        break\n    cv.imshow('frame', frame)\n\
  \    if cv.waitKey(1) == 27:\n        break\n\ncap.release()\ncv.destroyAllWindows()\n\
  ```\n\n运行该程序。摄像头内置的指示灯会亮起，并在显示器上显示如下输出窗口（图 10-1）。\n\n**图 10-1.** 实时摄像头画面的输出\n\n\
  那就是我！按下键盘上的 ESC 键可以停止程序。窗口（图 10-1）将关闭，摄像头上的指示灯也会熄灭。现在，我们来逐行理解程序。前两行代码中，我们导入了所需的库（包括\
  \ OpenCV），并为了方便创建了别名。接着，下面这行代码创建了一个与摄像头对应的对象：\n\n`cap = cv.VideoCapture(0)`\n\n\
  传递的参数是摄像头的索引。如果只连接了一个摄像头，则参数始终为 0。接下来的两行代码定义了摄像头工作的分辨率：\n\n`cap.set(cv.CAP_PROP_FRAME_WIDTH,\
  \ 256)`  \n`cap.set(cv.CAP_PROP_FRAME_HEIGHT, 144)`\n\n函数 `cap.set()` 用于设置连接到计算机的摄像头的属性。属性非常多。下面这个\
  \ ([stackoverflow.com](https://stackoverflow.com)) 的问题详细讨论了可以使用 OpenCV 设置的摄像头属性：\n\
  \n[`stackoverflow.com/questions/11420748/setting-camera-parameters-in-opencv-python`](https://stackoverflow.com/questions/11420748/setting-camera-parameters-in-opencv-python)\n\
  \n另外，我希望读者了解，在较低分辨率下，通过摄像头获取的视频流会更快、响应更及时。由于树莓派的处理能力有限，在较低分辨率下，我们会在输出窗口中获得更高的每秒帧数（FPS）。您可以在以下网络资源中获取所有标准分辨率的列表：\n\
  \n[`en.wikipedia.org/wiki/List_of_common_resolutions`](https://en.wikipedia.org/wiki/List_of_common_resolutions)\n\
  \n[`yusef.es/labs/resolutions.htm`](https://yusef.es/labs/resolutions.htm)\n\n如果无法访问摄像头，以下代码行将终止程序的执行：\n\
  \n```python\nif not cap.isOpened():\n    print(\"Cannot open camera...\")\n    exit()\n\
  ```\n\n只要我们没有在键盘上按下 ESC 键，`while` 循环块就会一直运行。\n\n```python\nwhile True:\n    ret,\
  \ frame = cap.read()\n```\n\n函数调用 `cap.read()` 会返回状态和帧。帧是一个 `numpy` `ndarray` 对象，包含了当前帧。我们可以像在之前章节中练习过的那样，使用\
  \ NumPy 和 SciPy 例程对其进行常规操作。\n\n如果摄像头帧读取操作的状态不成功，我们会按如下方式终止循环：\n\n```python\nif not\
  \ ret:\n    print(\"Can't receive frame... \\nExiting ...\")\n    break\n```\n\n\
  下面的例程调用会显示帧图像：\n\n`cv.imshow('frame', frame)`\n\n\n\n"
- "# 视频处理\n\n以下代码用于检测键盘上是否按下了 ESC 键：\n\n```\nif cv.waitKey(1) == 27:\n    break\n\
  ```\n\n以下代码通过销毁对象来释放摄像头：\n\n```\ncap.release()\n```\n\n以下代码用于销毁所有当前 OpenCV 窗口：\n\
  \n```\ncv.destroyAllWindows()\n```\n\n## 第 10 章 视频处理\n\n请将本程序视为本章后续所有程序的模板。我们可以修改该程序，实现视频文件的读取与显示。\n\
  \n我们需要修改与摄像头相关的代码，具体如下：\n\n```\ncap = cv.VideoCapture('test.mp4')\n```\n\n我们将视频文件的名称作为参数传入。同时，还需要修改\
  \ `while` 循环块中的以下代码：`if cv.waitKey(1) == 27:`\n\n使用摄像头时传入的参数是 `1`。然而，为了显示视频文件的帧，我们需要计算传递给此函数调用的参数值。首先需要了解视频的帧率（以\
  \ FPS 为单位），然后用 `1000` 除以该帧率。\n\n接着，将计算结果作为参数传递给函数调用 `cv.waitKey()`。我们来看几个标准帧率的示例。通常，电影帧率约为\
  \ 24 FPS（实际为 23.97）。因此，`1000/24 = 41.67`，约等于 `42`。所以，24 FPS 对应的函数调用为 `cv.waitKey(42)`。对于\
  \ 25 FPS，则为 `cv.waitKey(40)`。\n\n对于 30 FPS，对应的函数调用为 `cv.waitKey(33)`，以此类推。作为练习，请按照上述修改方法打开一个视频文件。\n\
  \n## 转换图像的色彩空间\n\n色彩空间是颜色模型的数学表示。颜色模型是一种以可重现方式表示色彩的方法。OpenCV 库读取的图像、实时摄像头画面或视频默认采用\
  \ BGR 色彩空间。我们可以将图像从 BGR 转换为我们所需的任意色彩空间。本章中，我们经常需要将实时摄像头画面从 BGR 转换为灰度图。下面介绍具体方法。请参阅清单\
  \ 10-2。\n\n### 清单 10-2. prog01.py\n\n```\nimport numpy as np\nimport cv2 as cv\n\
  \ncap = cv.VideoCapture(0)\ncap.set(cv.CAP_PROP_FRAME_WIDTH, 256)\ncap.set(cv.CAP_PROP_FRAME_HEIGHT,\
  \ 144)\n\nif not cap.isOpened():\n    print(\"无法打开摄像头...\")\n    exit()\n\nwhile\
  \ True:\n    ret, frame = cap.read()\n\n    if not ret:\n        print(\"无法接收帧...\
  \ \\n 正在退出...\")\n        break\n\n    gray = cv.cvtColor(frame,\n             \
  \          cv.COLOR_BGR2GRAY)\n\n    cv.imshow('frame', gray)\n\n    if cv.waitKey(1)\
  \ == 27:\n        break\n\ncap.release()\ncv.destroyAllWindows()\n```\n\n在以下代码中，我们将彩色帧转换为灰度帧：\n\
  \n```\ngray = cv.cvtColor(frame,\n                   cv.COLOR_BGR2GRAY)\n```\n\n\
  函数 `cvtColor()` 用于实现色彩空间之间的转换。本章中我们会频繁使用此函数，因为 SciPy 中的许多图像处理例程需要灰度图像作为输入。运行程序即可查看输出效果。\n\
