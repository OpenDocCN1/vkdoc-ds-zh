  \ Python 封装。您可以在其主页了解更多关于 `ImageMagik` 程序的信息：[`imagemagick.org/index.php`](https://imagemagick.org/index.php)。\n\
  \n让我们通过按顺序运行以下命令来安装所有内容：\n\n```\nsudo apt-get install imagemagick libgraphicsmagick++1-dev\
