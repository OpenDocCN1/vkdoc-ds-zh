  ## Raspberry Pi 设置


  在使用 Raspberry Pi 进行探索和冒险之前，必须先对其进行设置。如前所述，我在此次设置中使用的是一块 Raspberry Pi 4 Model B。请确保你使用的是带有内置
  Wi-Fi 功能的 RPi 板卡型号。所有型号的设置过程几乎相同。


  我们将以无头模式使用 Raspberry Pi 板卡。这意味着我们不会连接任何键盘、鼠标或显示器。我们只需将其连接到 Wi-Fi 网络，然后进行远程访问。因此，我们不需要很多硬件设备。除了
  RPi 板卡本身，我们还需要以下物品：


