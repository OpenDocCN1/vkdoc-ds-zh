  \n## 连接到以太网/有线网络\n\n大多数人会在组织（工作场所或学术机构）或家中使用 Pi 板。这些地方通常都有连接到互联网的有线局域网。我们可以使用 RJ45\
  \ 连接器将 Pi 连接到局域网。Pi 板具有用于有线网络的 RJ45 端口。几乎所有现代路由器都带有 DHCP（动态主机配置协议），一旦连接到有线网络，Pi\
  \ 就会自动分配一个 IP 地址。\n\n![](img/index-245_1.jpg)\n\n## 使用 VNC 进行远程桌面\n\n我们可以使用 VNC\
