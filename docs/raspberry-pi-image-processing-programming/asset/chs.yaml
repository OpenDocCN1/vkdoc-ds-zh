  我们可以使用`np.dstack()`方法（该方法用于合并所有通道）来重建原始图像，如清单 6-8 所示。


  **清单 6-8.** `prog08.py`


  ```

  import scipy.misc as misc

  import matplotlib.pyplot as plt

  import numpy as np


  img = misc.face()

  r = img[:, :, 0]

  g = img[:, :, 1]

  b = img[:, :, 2]


  output = np.dstack((r, g, b))

  plt.imshow(output)

  plt.axis(''off'')

  plt.title(''Combined'')

  plt.show()

  ```


