  \n### 颜色量化\n\n颜色量化是减少图像中不同颜色数量的过程。新图像在外观上应与原图相似。颜色量化有多种用途，例如当你想将图像存储在数字介质中时。现实生活中的图像拥有数百万种颜色。然而，以数字格式对它们进行编码并保留所有与颜色相关的信息会导致图像尺寸巨大。如果你限制图像中的颜色数量，那么存储颜色相关信息所需的空间就会更少。这就是量化的实际应用。`Image`\
  \ 模块有一个名为 `quantize()` 的方法，用于图像量化。\n\n清单 5-10 中的代码演示了 Pillow 中的图像量化。\n\n***清单 5-10.***\
  \ `prog15.py`\n\n```\nfrom PIL import Image, ImageTk\nimport tkinter as tk\n\ndef\
  \ show_value_1(num_of_col):\n    print('Number of colors: ', num_of_col)\n    img\
  \ = im1.quantize(int(num_of_col))\n    photo = ImageTk.PhotoImage(img)\n    l['image']\
  \ = photo\n    l.photo = photo\n\nroot = tk.Tk()\nroot.title('Color Quantization\
  \ Demo')\nim1 = Image.open(\"/home/pi/DIP/Dataset/4.1.07.tiff\")\nphoto = ImageTk.PhotoImage(im1)\n\
  l = tk.Label(root, image=photo)\nl.pack()\nl.photo = photo\n\nw1 = (tk.Scale(root,\
  \ label=\"Number of colors\", from_=4, to=16,\n               resolution=1, command=show_value_1,\
  \ orient=tk.\nHORIZONTAL))\nw1.pack()\nw1.set(256)\nroot.mainloop()\n```\n\n以下输出（图\
  \ 5-12）显示了一张量化后的图像。\n\n![](img/index-124_1.jpg)\n\n***图 5-12.** 量化后的图像*\n\n### 直方图与均衡化\n\
  \n你可能在学校里学习过统计学中的频数表。其实，直方图就是频数表的可视化形式。你可以计算任何以数字形式表示的数据集的直方图。\n\n`Image` 模块有一个名为\
  \ `histogram()` 的方法，用于计算图像的直方图。一张 RGB 图像有三个 8 位通道。这意味着它可以拥有惊人的 256 x 256 x 256 种颜色。绘制这样一个数据集的直方图会非常困难。因此，`histogram()`\
  \ 方法计算图像中单个通道的直方图。每个通道有 256 个不同的亮度级。直方图是一个针对通道每个亮度级的数值列表。\n\n每个通道的直方图列表中包含 256 个数字。假设\
  \ `红色` 通道的直方图数值为 (4, 8, 0, 19, …, 90)。这意味着有 4 个像素的红色亮度为 0，8 个像素的红色亮度为 1，没有像素的红色亮度为\
  \ 2，19 个像素的红色亮度为 3，依此类推，直到最后一个值，该值表示有 90 个像素的红色亮度为 255。\n\n当我们合并所有三个通道的直方图时，会得到一个包含\
  \ 768 个数字的列表。在本章中，我们只计算直方图，不会进行可视化显示。当我们学习高级图像处理库 `scipy.ndimage` 时，会学习如何分别表示每个通道的直方图。\n\
  \n清单 5-11 中的代码计算并存储了图像及其各个通道的直方图。\n\n***清单 5-11.*** `prog16.py`\n\n```\nfrom PIL\
  \ import Image\n\nim1 = Image.open(\"/home/pi/DIP/Dataset/4.1.07.tiff\")\nprint(len(im1.histogram()))\n\
  r, g, b = im1.split()\nprint(len(r.histogram()))\nprint(len(g.histogram()))\nprint(len(b.histogram()))\n\
  ```\n\n修改此程序，以直接打印图像和通道的直方图。\n\n灰度图像（L 模式图像）的直方图只有 256 个值，因为它只有一个通道。\n\n### 直方图均衡化\n\
  \n你可以调整直方图以增强图像对比度。这种技术称为直方图均衡化。`ImageOps.equalize()` 方法可以对图像的直方图进行均衡化。清单 5-12 展示了这一过程的一个示例。\n\
  \n***清单 5-12.*** `prog17.py`\n\n```\nfrom PIL import Image, ImageOps\n\nim1 = Image.open(\"\
  /home/pi/DIP/Dataset/4.1.07.tiff\")\nprint(im1.histogram())\nim2 = ImageOps.equalize(im1)\n\
  print(im2.histogram())\nim2.show()\n```\n\n\n\n"
