  \n## 总结\n\n在本章中，我们学习了用于生成测试图像的**距离变换**。然后学习了形态学以及如何对图像使用形态学操作。形态学操作分为两种——**二值形态学**和**灰度形态学**。我们还研究了阈值化，这是最简单的图像分割形式。\n\
  \n在下一章，我们将研究和演示视频处理。\n\n"
