  \n**图 5-3.** 使用 Tkinter 的高斯模糊\n\n我们可以看到`GaussianBlur()`已被应用在图像上。\n\n接下来要探索的滤镜是卷积滤镜。对于这个示例，我们需要理解核（kernel）的概念。核是用于图像处理操作的**方形矩阵**。我们主要使用核来进行滤波。核可以产生多种效果，包括模糊、平滑、降噪、锐化和边缘突出。\n\
