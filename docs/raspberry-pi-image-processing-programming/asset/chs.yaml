  \ 最小和最大滤波器\n\n## 高通滤波器\n\n**高通滤波器**的工作原理与低通滤波器完全相反。它们允许高频信号通过。它们也使用核和卷积。然而，高通滤波器使用的核与低通滤波器不同。当我们将高通滤波器应用于图像时，它会使图像锐化（与模糊相反），并突出边缘。\n\
  \n代码清单 8-14 演示了用于检测测试图像边缘的 Prewitt 滤波器。\n\n![](img/index-174_1.jpg)\n\n**代码清单 8-14.**\
  \ `prog13.py`\n\n```python\nimport scipy.misc as misc\nimport scipy.ndimage as ndi\n\
  import matplotlib.pyplot as plt\n\nimg = misc.ascent()\nfiltered = ndi.prewitt(img)\n\
  \noutput = [img, filtered]\ntitles = ['Original', 'Filtered']\n\nfor i in range(2):\n\
  \    plt.subplot(1, 2, i+1)\n    plt.imshow(output[i], cmap='gray')\n    plt.title(titles[i])\n\
  \    plt.axis('off')\n\nplt.show()\n```\n\n输出结果如图 8-12 所示。\n\n**图 8-12.** Prewitt\
  \ 滤波器\n\n我们可以在图 8-12 中看到被突出显示的边缘。\n\n我们还可以分别对单个轴以及整个图像应用 Sobel 滤波器。它将检测水平边缘、垂直边缘以及两个轴上的边缘。代码清单\
