  在最后一章中，我们探索了单板计算机和树莓派的奇妙世界。我们启动了树莓派，将其连接到互联网，并更新了树莓派操作系统。


  在本章中，我们将开始学习 Python 和数字图像处理（DIP）的概念。让我们从 Python 的介绍开始。我个人觉得 Python 很了不起，并且为之着迷。Python
  是一种简单而强大的编程语言。程序员使用 Python 时，很容易专注于解决给定的问题，因为他们不必担心语法。Python 完美契合了树莓派的理念，即为每个人提供编程。这就是为什么它成为树莓派和其他计算机最受欢迎的编程平台。


  以下是本章我们将学习的主题列表：


  - Python 的历史

  - Python 的特性

  - Python 3

  - Python 的集成开发环境（IDE）

