  到本章结束时，我们将熟悉数字图像处理和 Python 3 基础的概念。


  ### Python 编程语言的简史


  Python 是在 20 世纪 80 年代末设计和构思的。其实施于 1989 年底由荷兰国家数学与计算机科学研究所（Centrum Wiskunde & Informatica）的吉多·范罗苏姆（Guido
  van Rossum）正式开始。Python 是 ABC 编程语言的继承者，而 ABC 本身又受到 SETL 编程语言的启发。1991 年 2 月，范罗苏姆在新闻组
  `alt.sources` 上公开发布了 Python 源代码。


  Python 这个名字的灵感来源于英国电视节目*蒙提·派森的飞行马戏团*，因为范罗苏姆是蒙提·派森的忠实粉丝。


  范罗苏姆是 Python 编程语言的主要作者。他引导 Python 的开发、增强和进一步演进，发挥了核心作用。直到 2018 年 7 月，他一直担任 Python
  的“终身仁慈独裁者”。目前，Python 的开发由一个五人指导委员会领导。


  Python 编程语言的核心哲学（Python 之禅）在 PEP-20（PEP 代表 Python 增强提案）中进行了解释，可在 [`www.python.org/dev/peps/pep-0020`](https://www.python.org/dev/peps/pep-0020)
  找到。


  它包含 20 条软件原则，其中 19 条已被记录在案。原则如下：


  - 优美胜于丑陋。

  - 明确胜于隐晦。

  - 简单胜于复杂。

  - 复杂胜于凌乱。

  - 扁平胜于嵌套。

  - 稀疏胜于稠密。

  - 可读性很重要。

  - 特殊情况不足以特殊到打破规则。

  - 实用性胜于纯粹性。

  - 错误永远不应悄悄忽略。

  - 除非明确沉默。

  - 面对歧义，拒绝猜测的诱惑。

  - 应该有一种——最好只有一种——显而易见的方法来做这件事。

  - 虽然那种方式一开始可能并不明显，除非你是荷兰人。

  - 现在行动胜于永远不行动。

  - 虽然永远不行动往往比立即行动更好。

  - 如果实现难以解释，那是个坏主意。

  - 如果实现容易解释，那可能是个好主意。

  - 命名空间是一个绝妙的主意——让我们多做一些吧！


  ### Python 的特性


  以下是使 Python 在编程社区中广受欢迎和喜爱的特性。


  #### 简单


  Python 是一种采用极简主义方法的简单语言。阅读一个编写良好且优秀的 Python 程序会让你感觉像是在阅读英文文本。


  #### 易于学习




  '
- "# Python 简介\n\n由于其简单且类似英语的语法，Python 非常容易学习。这是它被作为第一门编程语言教授给学习入门编程课程的高中生和大学生的主要原因。整整一代新的程序员正在将\
  \ Python 作为他们的第一门编程语言来学习。\n\n## 易于阅读\n\n与其他高级编程语言不同，Python 不会混淆代码并使其难以阅读。与其他编程语言编写的代码相比，Python\
  \ 代码类似英语的结构使其更容易阅读。这使得它比 C 和 C++ 等其他高级语言更容易理解和学习。\n\n## 易于维护\n\n由于 Python 代码易于阅读、理解和学习，任何维护代码的人都能很快熟悉代码库。我可以从我个人维护和增强用\
  \ Bash 和 Python 2 编写的大型遗留代码库的经验来证明这一点。\n\n## 开源\n\nPython 是一个开源项目，这意味着其源代码是免费提供的。您可以对其进行修改以满足您的需求，并在您的应用程序中使用原始代码和修改后的代码。\n\
  \n## 高级语言\n\n在编写 Python 程序时，您无需管理内存管理、CPU 时序和调度进程等底层细节。所有这些任务都由 Python 解释器管理。您可以直接使用易于理解的类似英语的语法编写代码。\n\
  \n## 可移植性\n\nPython 解释器已被移植到许多操作系统平台。Python 代码也是可移植的。如果您小心避免与系统相关的编码，所有 Python 程序都将在受支持的平台上运行，而无需进行太多更改。\n\
  \n您可以在 GNU/Linux、Windows、Android、FreeBSD、Mac OS、iOS、Solaris、OS/2、Amiga、Palm OS、QNX、VMS、AROS、AS/400、BeOS、OS/390、z/OS、Psion、Acorn、PlayStation、Sharp\
  \ Zaurus、RISC OS、VxWorks、Windows CE 和 PocketPC 上使用 Python。\n\n## 解释型语言\n\nPython\
  \ 是一种解释型语言。让我们看看这意味着什么。用 C、C++ 和 Java 等高级编程语言编写的程序首先会被编译。这意味着它们首先被转换成一种中间格式。当我们运行程序时，这个中间格式由链接器/加载器从辅助存储器（即硬盘）加载到内存（RAM）中。\n\
  \n因此，C、C++ 和 Java 有单独的编译器和链接器/加载器。Python 则不是这样。Python 直接从源代码运行程序。您无需费心编译和链接到合适的库。这使得\
  \ Python 程序真正可移植，因为您可以将程序从一台计算机复制到另一台计算机，只要目标计算机上安装了必要的库，程序就能正常运行。\n\n## 面向对象\n\n\
  Python 支持面向过程编程以及面向对象编程范式。\n\n所有面向对象的编程范式都在 Python 中实现。在面向对象的编程语言中，程序是围绕结合数据和相关功能的对象构建的。Python\
  \ 是一种非常简单但功能强大的面向对象编程语言。\n\n## 可扩展性\n\nPython 的一个特性是您可以从 Python 程序中调用 C 和 C++ 例程。如果您希望应用程序的核心功能运行得更快，您可以用\
  \ C/C++ 编写该部分并在 Python 程序中调用它（C/C++ 程序通常比 Python 程序运行得更快）。\n\n## 丰富的库\n\nPython\
  \ 拥有一个预安装的庞大标准库。该标准库包含现代编程语言所需的所有基本功能。它提供了用于数据库、单元测试（我们将在本书后面探讨这一点）、正则表达式、多线程、网络编程、计算机图形学、图像处理、GUI\
  \ 等内容。\n\n\n\n其他实用工具。这是 Python“自带电池”理念的一部分。\n\n除了标准库之外，Python 还拥有数量庞大且不断增长的第三方库集合。这些库的列表可以在\
  \ Python 包索引上找到。\n\n## 健壮性\n\nPython 通过错误处理能力提供了健壮性。遇到错误时，会提供完整的堆栈跟踪信息，这能让程序员的工作更轻松。运行时错误被称为异常。处理这些错误的功能被称为异常处理机制。\n\
  \n## 快速原型开发\n\nPython 被用作快速原型开发工具。如你所知，Python 拥有丰富的库并且易于学习，这促使许多软件架构师将其用作工具，快速将他们的想法原型化为可运行的模型。\n\
  \n## 内存管理\n\n在汇编语言以及 C 和 C++ 等编程语言中，内存管理是程序员的责任。这除了手头的任务之外，还增加了额外的负担，给程序员带来了不必要的压力。而在\
  \ Python 中，Python 解释器负责内存管理。这有助于程序员避开内存问题，专注于手头的任务。\n\n## 功能强大\n\nPython 拥有现代编程语言所需的一切。它被应用于计算机视觉、超级计算、药物发现、科学计算、模拟和生物信息学等应用程序中。全球有数百万程序员使用\
  \ Python。许多大型组织，如 NASA、Google、SpaceX 和 Cisco，都在其应用程序和基础设施中使用 Python。\n\n## 社区支持\n\
  \n我发现这是 Python 最吸引人的特性。回想一下，Python 是开源的。它还有一个由全球近百万程序员组成的社区（可能更多，因为如今高中生也在学习 Python）。互联网上也有大量的论坛来支持遇到障碍的程序员。我所有与\
  \ Python 相关的问题都从未得不到解答。\n\n## Python 3\n\nPython 3 于 2008 年发布。Python 开发团队决定摒弃 Python\
  \ 中一些冗余的特性，简化更多功能，修正一些设计缺陷，并添加一些亟需的功能。\n\n他们决定为此需要一个主版本号变更，并且最终的版本将不向后兼容。Python\
  \ 2.x 和 3.x 应该并行存在，以便程序员社区有足够的时间将他们的代码和第三方库从 2.x 迁移到 3.x。在大多数情况下，Python 2.x 代码无法直接运行，因为\
  \ 2.x 和 3.x 之间存在显著差异。\n\n## Raspberry Pi OS 上的 Python 2 和 Python 3\n\nRaspberry\
  \ Pi OS 是 Debian Linux 的一个衍生版本。Raspberry Pi OS 中预装了 Python 2 和 Python 3 解释器。可以通过在终端中运行命令\
  \ `python` 来调用 Python 2 解释器。可以通过在终端中运行命令 `python3` 来调用 Python 3 解释器。我们可以通过运行以下任一命令来检查\
  \ Python 3 解释器的版本：\n\n```\npython3 -V\npython --version\n```\n\n你可以通过运行以下命令来检查 Python\
  \ 3 二进制文件的位置：\n\n```\nwhich python3\n```\n\n## 运行 Python 程序与 Python 模式\n\n你已经为 Python\
  \ 编程设置好了环境，那么让我们开始学习 Python 的一些基本概念。Python 有两种模式——交互模式和脚本模式。让我们详细了解一下这两种模式。\n\n\
  ### 交互模式\n\nPython 的交互模式是一个命令行 shell。它为每个执行的语句提供即时输出。它还会将先前执行语句的输出存储在活动内存中。当 Python\
  \ 解释器执行新语句时，在评估当前输出时会考虑整个先前执行的语句序列。我们必须在终端中输入命令 `python3` 来将 Python 3 解释器调用到交互模式，如下所示：\n\
  \n```\npi@raspberrypi:~ $ python3\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n\
  [GCC 4.9.1] on linux\nType \"help\", \"copyright\", \"credits\" or \"license\" for\
  \ more information.\n>>>\n```\n\n你可以直接在此交互模式下执行 Python 语句，就像从操作系统 shell/控制台运行命令一样，如下所示：\n\
  \n```\n>>>print ('Hello World!')\nHello World!\n>>>\n```\n\n本书不会使用交互模式。但是请记住它，因为这是检查小段代码（五到十行）最快的方法。我们可以使用\
  \ `exit()` 语句退出交互模式，如下所示：\n\n```\n>>> exit()\npi@raspberrypi:~ $\n```\n\n### 脚本模式\n\
  \n脚本模式是指 Python 脚本文件（`.py`）由 Python 解释器执行的模式。\n\n创建一个名为 `test.py` 的文件，并将 `print\
  \ ('Hello World!')` 语句添加到文件中。保存文件，并使用 Python 3 解释器运行它，如下所示：\n\n```\npi@raspberrypi:~\
  \ $ python3 test.py\nHello World!\npi@raspberrypi:~ $\n```\n\n在这个例子中，`python3` 是解释器，`test.py`\
  \ 是文件名。如果 `test.py` 文件不在我们调用 `python3` 解释器的同一目录中，我们必须提供 Python 文件的绝对路径。\n\n## Python\
  \ 的 IDE\n\n集成开发环境（IDE）是一个软件套件，包含了编写和测试程序所需的所有基本工具。一个典型的 IDE 包含编译器、调试器、代码编辑器和构建自动化工具。大多数编程语言都有各种\
  \ IDE 来改善程序员的生活。Python 也有很多 IDE。让我们看看其中的几个。\n\n### IDLE\n\nIDLE 代表集成开发环境（Integrated\
  \ DeveLopment Environment）。我们需要在 Raspberry Pi OS 上安装它。IDLE3 适用于 Python 3。它在 Python\
  \ 初学者中很受欢迎。我们可以使用以下命令安装它：\n\n```\npip3 install idle\n```\n\n我们可以使用以下命令启动 IDLE3：\n\
  \n```\nnohup idle &\n```\n\n图 2-1 显示了 IDLE3 代码编辑器和交互式提示符。\n\n![](img/index-56_1.png)\n\
  \n**图 2-1.** Python 3 解释器的 IDLE3 交互式提示符和一个新的代码文件\n\n我们可以转到主菜单中的 **Options** ➤ **Configure\
  \ IDLE**。我们可以在此处更改编辑器的设置（图 2-2）。\n\n![](img/index-57_1.jpg)\n\n**图 2-2.** IDLE3\
  \ 配置选项\n\n![](img/index-58_1.jpg)\n\n### Geany\n\nGeany 是一个使用 GTK+ 工具包的文本编辑器，具有集成开发环境的基本功能。它支持多种文件类型和编程语言。它有一些不错的功能。请访问\
  \ [`www.geany.org`](https://www.geany.org) 了解更多详情。图 2-3 显示了 Geany 文本编辑器窗口。\n\n**图\
  \ 2-3.** Geany IDE\n\n在代码编辑器中输入 `print(\"Hello World!\")`，并将文件保存为 `/home/pi` 目录下的\
  \ `test.py`。单击菜单栏中的 **Build**，然后选择 **Execute**。你也可以使用 **F5** 键盘快捷键来执行程序。程序将在终端窗口中执行。你需要按\
  \ **Enter** 键来关闭执行窗口。Geany 的默认 Python 解释器是 Python 2。我们需要将其更改为 Python 3。为此，请转到 **Build**\
  \ ➤ **Set Build Commands**。将会出现如图 2-4 所示的窗口。\n\n![](img/index-59_1.jpg)\n\n**图 2-4.**\
  \ Set Build Commands 窗口\n\n在 Set Build Commands 窗口中，在 Execute Commands 部分\n\n\n\n\
