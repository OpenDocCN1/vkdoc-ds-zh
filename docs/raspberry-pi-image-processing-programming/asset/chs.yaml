- '# 关于图像数据类型与 NumPy 的初步介绍


  在 Scientific Python 中，所有存储图像数据的变量都属于同一类型。这意味着图像的数据类型是`ndarray`，它来自`NumPy`。要开始学习科学图像处理以及一般的科学编程，我们必须了解`NumPy`是什么。


  `NumPy`官网（[www.numpy.org](http://www.numpy.org)）这样描述：*NumPy 是用于科学计算的基础包。它提供了以下特性：*

  *   *一个强大的多维数组对象*

  *   *用于数学计算的有用方法*

  *   *用于集成更快的 C/C++和 FORTRAN 代码的封装器和工具*


  要开始使用`SciPy`和`NumPy`进行图像处理，我们需要学习`NumPy`中**N 维**（或**多维**）数组对象的基础知识。


  `NumPy`的 N 维数组是一个同质（包含所有相同数据类型元素）的多维数组。它有多个维度，每个维度被称为一个轴。`NumPy`中 N 维数组对应的类是`numpy.ndarray`。这就是我们在“清单
  6-1”的输出中看到的内容。所有主流的图像处理库，如`Mahotas`、`OpenCV`、`scikit-image`和`scipy.ndimage`（我们将在本书中深入学习后者），都使用`numpy.ndarray`来表示图像。这些库都有`read()`、`open()`和`imread()`方法，用于从磁盘加载图像到`numpy.ndarray`对象。


  `NumPy`及其 N 维数组本身是非常宏大的主题，需要用大量的书籍才能完全解释清楚。因此，我们将在需要时学习它们的相关重要特性。现在，你需要了解一些重要的`ndarray`属性，这些属性将帮助你理解`ndarray`所表示的图像的重要特征。


  我们也可以检查图像的属性。请考虑“清单 6-2”中的代码。


  ***清单 6-2.*** `prog02.py`


  ```python

  from scipy import misc

  img = misc.face()

  print(img.dtype)

  print(img.shape)

  print(img.ndim)

  print(img.size)

  ```


  输出如下：


  ```

  uint8

  (768, 1024, 3)

  ```


  让我们看看这些输出分别意味着什么。

  `dtype`属性用于表示图像元素的数据类型。在这个例子中，它是`uint8`，表示一个无符号的 8 位整数，这意味着它可以有 256 个不同的值。

  `shape`表示图像的维度或尺寸。在这个例子中，它是一张彩色图像，分辨率为 1024 x 768，并且有三个颜色通道，分别对应红色、绿色和蓝色。每个像素的每个通道可以取
  256 个可能值中的一个。因此，组合起来可以为每个像素产生 256*256*256 种不同的颜色。你可以将彩色图像可视化为三个二维平面的排列。而灰度图像则是一个灰度值单平面。

  `ndim`表示图像的维数。彩色图像有三维，灰度图像有二维。

  `size`表示数组中元素的总数。它可以通过将各维度的值相乘来计算。在这个例子中，它是 768 * 1024 * 3 = 2359296。


  我们可以查看每个单独像素对应的 RGB 值，如清单 6-3 所示。


  ***清单 6-3.*** `prog03.py`


  ```python

  from scipy import misc

  img = misc.face()

  print(img[10, 10])

  ```


  “清单 6-3”中的代码访问了位于(10, 10)的像素值。输出是`[172 169 188]`。


  以上便是 NumPy 和图像处理的基础知识。在后续章节中，你会在需要的时候学到更多关于 NumPy 的知识。


