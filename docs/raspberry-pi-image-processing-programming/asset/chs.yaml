  我们可以使用`imshow()`将多个图像推送到绘图窗口的图像网格中，如“清单 6-6”所示。


  ***清单 6-6.*** `prog06.py`


  ```python

  import scipy.misc as misc

  import matplotlib.pyplot as plt

  img1 = misc.face()

  img2 = misc.ascent()

  titles = [''face'', ''ascent'']

  images = [img1, img2]

