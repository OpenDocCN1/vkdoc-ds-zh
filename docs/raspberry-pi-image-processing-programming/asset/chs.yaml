  \ 进一步探索此库。\n\n### 连接显示器\n\n到目前为止，我们一直以无头模式（使用 SSH 连接并通过 Wi-Fi 进行 X-11 转发）访问树莓派。我们也可以通过选择合适的连接器来连接视觉显示器（HDMI/VGA\
  \ 显示器）。如果选择使用树莓派 4B 的 HDMI，则需要一个 **micro-HDMI 转 HDMI** 适配器（可在在线市场查找）。如果选择使用 VGA\
  \ 显示器，则需要一个 **micro-HDMI 转 VGA** 适配器。在在线市场上，我们可以找到一种 **micro-HDMI 转 HDMI 和 VGA 组合适配器**，它能兼容这两种情况。\n\
  \n#### 使用 VGA 显示器\n\n\n\n另外，如果我们希望使用 VGA 显示器，则必须在首次启动前修改`/boot/config.txt`文件。此步骤仅适用于\
  \ VGA 显示器。如果您使用的是 HDMI 显示器，请跳过此部分。\n\n将 microSD 卡插入读卡器，并在 **Windows 资源管理器**（或您操作系统的文件浏览器）中浏览它。在\
  \ Windows 资源管理器中，它将显示为一个标记为 `boot` 的可移动介质驱动器。\n\n打开`config.txt`文件并进行以下修改：\n\n- 将`#disable_overscan=1`改为`disable_overscan=1`\n\
  - 将`#hdmi_force_hotplug=1`改为`hdmi_force_hotplug=1`\n- 将`#hdmi_group=1`改为`hdmi_group=2`\n\
  - 将`#hdmi_mode=1`改为`hdmi_mode=16`\n- 将`#hdmi_drive=2`改为`hdmi_drive=2`\n- 将`#config_hdmi_boost=4`改为`config_hdmi_boost=4`\n\
  \n完成这些修改后保存文件。现在，microSD 卡已准备好用于连接 VGA 显示器的 Pi。\n\n## 连接显示器后启动\n\n如前所述，我们可以将 Pi\
  \ 连接到我们选择的显示器并启动。首次启动后，我们会看到一个设置或配置向导，如图 A-1 所示。这仅是一次性过程，因此请继续。\n\n![](img/index-237_1.jpg)\n\
  \n**图 A-1.** 配置向导\n\n![](img/index-238_1.jpg)\n\n单击 **Next** 按钮，您将看到以下窗口（图 A-2）。\n\
  \n**图 A-2.** 区域设置\n\n![](img/index-239_1.jpg)\n\n为您的地区选择最合适的选项，然后单击 **Next**（您也可以通过单击\
  \ **Back** 返回之前的选项）。您将看到以下窗口（图 A-3）。\n\n**图 A-3.** 更改默认密码\n\n![](img/index-240_1.jpg)\n\
  \n更改默认密码。强烈建议这样做，因为任何入侵您 Wi-Fi 的人都可以使用默认密码远程登录您的 Pi 并造成严重破坏。按下 **Next** 按钮，它将显示以下窗口（图\
  \ A-4）。\n\n**图 A-4.** 设置屏幕\n\n![](img/index-241_1.jpg)\n\n如果任务栏（在屏幕顶部区域）不适合屏幕，请勾选该框，然后单击\
