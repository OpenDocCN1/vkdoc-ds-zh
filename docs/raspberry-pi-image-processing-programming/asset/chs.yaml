  \ VNC。在桌面环境中，我们也可以找到用于相同任务的 GUI 工具。点击左上角的树莓派图标。这是一个类似 Windows 的菜单。在 `Preferences`（首选项）部分，我们可以找到\
  \ `Raspberry Pi Configuration`（树莓派配置）选项。\n\n点击该选项，它会打开一个新窗口。在那里，点击第三个选项卡，标签为 `Interfaces`（接口）。它会显示如下内容（图\
