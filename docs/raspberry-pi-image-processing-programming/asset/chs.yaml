  \ 8-14.** 拉普拉斯算子、高斯梯度幅值和高斯拉普拉斯滤波器*\n\n## 傅里叶滤波器\n\n傅里叶滤波器在频域中工作。它们计算图像的傅里叶变换，操纵频率，最后计算逆傅里叶变换以生成最终输出。我们可以对图像应用各种傅里叶滤波器，如代码清单\
  \ 8-17 所示。\n\n***代码清单 8-17.*** prog16.py\n\n```\nimport scipy.ndimage as ndi\nimport\
  \ scipy.misc as misc\nimport matplotlib.pyplot as plt\nimport numpy as np\n\nimg\
  \ = misc.ascent()\nnoisy = img + 0.09 * img.std() * np.random.random(img.shape)\n\
  \nfe = ndi.fourier_ellipsoid(img, 1)\nfg = ndi.fourier_gaussian(img, 1)\nfs = ndi.fourier_shift(img,\
  \ 1)\nfu = ndi.fourier_uniform(img, 1)\n\ntitles = ['Original', 'Noisy',\n'Fourier\
  \ Ellipsoid', 'Fourier Gaussian',\n'Fourier Shift', 'Fourier Uniform']\n\noutput\
  \ = [img, noisy, fe, fg, fs, fu]\n\nfor i in range(6):\n    plt.subplot(2, 3, i+1)\n\
  \    plt.imshow(np.float64(output[i]), cmap='gray')\n    plt.title(titles[i])\n\
  \    plt.axis('off')\n    plt.show()\n```\n\n输出结果如图 8-15 所示。\n\n![](img/index-179_1.jpg)\n\
  \n***图 8-15.** 各种傅里叶滤波器*\n\n## 本章小结\n\n本章我们介绍了种类繁多的滤波器。我们了解了它们的类型，并探讨了其应用。图像滤波这一主题过于庞大，无法在一章内完全探讨。\n\
