  plt.axis(''off'')

  plt.title(titles[1])

  plt.show()

  ```


  我们之前已经在`imshow()`中使用了`subplot()`方法。`subplot()`方法的前两个参数指定了网格的维度，第三个参数指定了图像在网格中的位置。网格中图像的编号从左上角开始。左上角的位置是第一个位置，下一个位置是第二个，依此类推。结果显示在图
  6-4 中。


