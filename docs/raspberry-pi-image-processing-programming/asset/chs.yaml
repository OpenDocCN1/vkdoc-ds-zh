- "# 图像混合\n\n我们可以使用 `blend()` 方法混合两张图像。它接受三个参数——要混合的两张图像以及 `alpha` 的值。其混合所采用的数学公式如下：\n\
  \n`output = image1 * (1.0 - alpha) + image2 * alpha`\n\n现在，我们将编写一个程序，通过改变 `alpha`\
  \ 的值，让我们亲身感受混合效果。我们将使用 `Tkinter` 中的滑块部件。下面的列表 4-3 演示了这一过程。\n\n***列表 4-3.*** `prog03.py`\n\
  \n```\nfrom PIL import Image, ImageTk\nimport tkinter as tk\n\ndef show_value_1(alpha):\n\
  \    print('Alpha: ', alpha)\n    img = Image.blend(im1, im2, float(alpha))\n\n\
  \    photo = ImageTk.PhotoImage(img)\n    l['image'] = photo\n    l.photo = photo\n\
  \nroot = tk.Tk()\nroot.title('Blending Demo')\n\nim1 = Image.open(\"/home/pi/DIP/Dataset/4.1.07.tiff\"\
  )\nim2 = Image.open(\"/home/pi/DIP/Dataset/4.1.08.tiff\")\n\nphoto = ImageTk.PhotoImage(im1)\n\
  l = tk.Label(root, image=photo)\nl.pack()\nl.photo = photo\n\nw1 = (tk.Scale(root,\
  \ label=\"Alpha\", from_=0, to=1,\n               resolution=0.01, command=show_value_1,\
  \ orient=tk.HORIZONTAL))\nw1.pack()\n\nroot.mainloop()\n```\n\n列表 4-3 中的代码通过 `tk.Scale()`\
  \ 调用语句创建了一个滑块部件。该语句超过了 79 个字符，为了符合 PEP8 标准，我将其写成两行，每行均少于 79 个字符。传递给 `tk.Scale()`\
  \ 调用的参数如下：\n\n- `Tkinter` 窗口变量名\n- `label`：与滑块关联的标签\n- `from_` 和 `to`：数值范围\n- `resolution`：滑块的分辨率\n\
  - `command`：滑块值改变时执行的函数\n- `orient`：滑块的方向\n\n当你用鼠标指针移动滑块时，会调用自定义的 `show_value_1()`\
  \ 函数。我们会将滑块当前位置的值打印到控制台，用于调试。语句 `img = Image.blend(im1, im2, float(alpha))` 创建了一张混合后的图像。接下来的几行代码更新了\
