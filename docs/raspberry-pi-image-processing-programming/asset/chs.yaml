  \ 9-8 所示。\n\n***图 9-8.** 对距离变换进行膨胀和腐蚀*\n\n## 阈值与分割\n\n这是本书的最后一部分，涉及图像处理最重要的应用之一：分割。在阈值操作中，你根据阈值将灰度图像转换为二值（黑白）图像。强度值大于阈值的像素被赋值为白色，强度值低于阈值的像素被赋值为黑色。这被称为二值阈值，是阈值和分割最基本的形式。示例如清单\
  \ 9-9 所示。\n\n***清单 9-9.*** `prog09.py`\n\n```python\nimport matplotlib.pyplot as\
  \ plt\nimport scipy.misc as misc\nimg = misc.ascent()\nthresh = img > 127\noutput\
  \ = [img, thresh]\ntitles = ['Original', 'Thresholding']\nfor i in range(2):\n \
  \   plt.subplot(1, 2, i+1)\n    plt.imshow(output[i], cmap='gray')\n    plt.title(titles[i])\n\
  \    plt.axis('off')\nplt.show()\n```\n\n清单 9-9 中的代码将阈值设置为 127。在灰度中，像素值 127 对应于灰色。生成的阈值化图像如图\
  \ 9-9 所示。\n\n***图 9-9.** 二值阈值*\n\n阈值是图像分割最基本的形式。图像分割是指根据某些属性（如像素颜色、区域的连通性等）将图像划分为多个区域。通过对阈值化图像应用形态学操作，你可以获得更好的图像分割结果（参见清单\
  \ 9-10）。\n\n***清单 9-10.*** `prog10.py`\n\n```python\nimport matplotlib.pyplot as\
  \ plt\nimport scipy.misc as misc\nimport scipy.ndimage as ndi\nimport numpy as np\n\
  img = misc.ascent()\nthresh = img > 127\ndilated = ndi.binary_dilation(thresh, structure=np.ones((9,\
  \ 9))).astype(int)\neroded = ndi.binary_erosion(dilated, structure=np.ones((9, 9))).astype(int)\n\
  output = [img, thresh, dilated, eroded]\ntitles = ['Original', 'Thresholding', 'Dilated',\
  \ 'Eroded and Segmented']\nfor i in range(4):\n    plt.subplot(2, 2, i+1)\n    plt.imshow(output[i],\
  \ cmap='gray')\n    plt.title(titles[i])\n    plt.axis('off')\nplt.show()\n```\n\
  \n输出结果如图 9-10 所示。\n\n***图 9-10.** 阈值化和分割后的图像*\n\n顶帽变换提取图像中的小元素。我们可以计算白顶帽和黑顶帽，如清单\
