- '# Matplotlib


  到目前为止，我们一直使用`misc.imshow()`方法来显示图像。虽然这个方法对于简单的应用很有用，但它比较原始。对于科学应用，我们必须使用一个更高级的框架。`Matplotlib`就为此目的而生。它是一个用于
  Python 的 Matlab 风格的绘图和数据可视化库。我们已经安装了它。它是 Scientific Python 生态系统不可或缺的一部分。与 NumPy
  一样，`matplotlib`也是一个庞大的主题，需要专门的书籍来阐述。本书中的示例使用`matplotlib`中的`pyplot`模块来满足图像处理需求。“清单
  6-4”展示了一个简单的图像处理程序。


  ***清单 6-4.*** `prog04.py`


  ```python

  import scipy.misc as misc

  import matplotlib.pyplot as plt

  img = misc.face()

  plt.imshow(img)

  plt.show()

  ```


  “清单 6-4”中的代码导入了`pyplot`模块。`imshow()`方法将图像添加到绘图窗口中。`show()`方法用于显示绘图窗口。输出如图 6-2 所示。


