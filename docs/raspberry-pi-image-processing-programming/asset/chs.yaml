  卡。


  **可联网的 Wi-Fi 连接** – 我们需要联网来将操作系统安装到 microSD 卡上。后续还需要联网将 RPi 连接到互联网，并在其上安装必要的软件。


  **microSD 卡** – 我们需要一张 microSD 卡。为了获得最佳体验，我通常建议至少使用一张 32GB Class 10 的 microSD 卡。如果你想了解更多关于
