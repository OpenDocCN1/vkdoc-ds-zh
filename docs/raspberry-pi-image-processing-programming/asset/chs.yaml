  \n```\nimport numpy as np\nimport cv2 as cv\nimport scipy.ndimage as ndi\n\ndef\
  \ nothing(x):\n    pass\n\nWINDOW_NAME = \"Distance Transform\"\ncv.namedWindow(WINDOW_NAME)\n\
  cv.createTrackbar('Sigma', WINDOW_NAME, 1, 10, nothing)\ncap = cv.VideoCapture(0)\n\
  cap.set(cv.CAP_PROP_FRAME_WIDTH, 256)\ncap.set(cv.CAP_PROP_FRAME_HEIGHT, 144)\n\n\
  if not cap.isOpened():\n    print(\"Cannot open camera...\")\n    exit()\n\nwhile\
  \ True:\n    ret, frame = cap.read()\n    if not ret:\n        print(\"Can't receive\
  \ frame... \\nExiting ...\")\n        break\n    grey = cv.cvtColor(frame, cv.COLOR_BGR2GRAY)\n\
  \    n1 = cv.getTrackbarPos('Sigma', WINDOW_NAME)\n    output = ndi.grey_dilation(grey,\
  \ size=(7, 7), structure=np.ones((n1, n1)))\n    cv.imshow(WINDOW_NAME, output)\n\
  \    if cv.waitKey(1) == 27:\n        break\ncap.release()\ncv.destroyAllWindows()\n\
  ```\n\n![](img/index-229_1.jpg)\n\n此代码对实时网络摄像头流应用灰度膨胀，如图 10-8 所示。\n\n***图 10-8.**\
