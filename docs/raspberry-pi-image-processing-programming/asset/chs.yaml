  plt.subplot(2, 2, 3)

  plt.imshow(sp_filter_axis_1, cmap=''gray'')

  plt.title(''Spline Filter 1D along Y-Axis'')


  plt.subplot(2, 2, 4)

  plt.imshow(sp_filter, cmap=''gray'')

