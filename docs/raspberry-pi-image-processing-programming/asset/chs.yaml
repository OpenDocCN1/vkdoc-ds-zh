  \n***图 9-11.** 黑顶帽和白顶帽*\n\n我们还可以对结构进行迭代，如清单 9-12 所示。\n\n***清单 9-12.*** `prog12.py`\n\
  \n```python\nimport scipy.ndimage as ndi\nstruct = ndi.generate_binary_structure(2,\
