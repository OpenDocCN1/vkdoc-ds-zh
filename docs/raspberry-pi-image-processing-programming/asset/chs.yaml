- "# 形态学、阈值分割与图像分割\n\n在上一章中，我们研究了图像滤波器背后的原理，以及用于图像增强的滤波器类型和实际应用。\n\n本章我们将学习并演示图像处理中的重要概念，例如形态学、图像的形态学操作、阈值分割和图像分割。我们将学习并演示以下内容：\n\
  \n*   距离变换\n*   形态学与形态学操作\n*   阈值分割与图像分割\n\n## 距离变换\n\n距离变换是对二值图像执行的一种操作。二值图像包含背景元素（零值——黑色）和前景元素（白色）。距离变换将每个前景元素替换为到背景的最短距离值。`scipy.ndimage`\
  \ 提供了三种计算二值图像距离变换的方法。代码清单 9-1 中的代码演示了如何实际使用距离变换来生成测试图像。\n\n***代码清单 9-1.*** prog01.py\n\
  \n```\nimport scipy.ndimage as ndi\nimport matplotlib.pyplot as plt\nimport numpy\
  \ as np\n\nimg = np.zeros((32, 32))\nimg[8:-8, 8:-8] = 1\n\nprint(img)\n\ndist1\
  \ = ndi.distance_transform_bf(img)\ndist2 = ndi.distance_transform_cdt(img)\ndist3\
  \ = ndi.distance_transform_edt(img)\n\noutput = [img, dist1, dist2, dist3]\ntitles\
  \ = ['Original', 'Brute Force', 'Chamfer', 'Euclidean']\n\nfor i in range(4):\n\
  \    print(output[i])\n    plt.subplot(2, 2, i+1)\n    plt.imshow(output[i],\n \
  \   interpolation='nearest')\n    plt.title(titles[i])\n    plt.axis('off')\n  \
  \  plt.show()\n```\n\n代码清单 9-1 所示的代码分别使用暴力算法、倒角距离算法和欧几里得方法计算距离变换。我们将在本章中使用距离变换来生成测试图像。输出结果如图\
  \ 9-1 所示。\n\n![](img/index-182_1.jpg)\n\n## 第 9 章 形态学、阈值分割与图像分割\n\n***图 9-1.** 距离变换*\n\
  \n\n\n"
- "# 形态学与形态学操作\n\n形态学是研究形状与形式的学科。图像的形态学研究关注的是形状而非像素值。形态学操作通常在二值图像上执行。让我们了解几个与形态学操作相关的概念。\n\
  \n## 结构元素\n\n结构元素是一个矩阵，用于与给定的二值图像进行交互。它有不同的形状，例如球形、环形或线形。它也可以有多种尺寸，如 3×3 或 7×7 的矩阵。较大的结构元素需要更多计算时间。一个简单的结构元素可以定义为奇数大小的单位矩阵，例如\
  \ `np.ones((3, 3))`。\n\n## 二值形态学操作\n\n让我们简要了解各种形态学操作。膨胀会使输入图像中的形状扩大。腐蚀会使输入图像中的形状收缩。开运算是先腐蚀后膨胀。闭运算是先膨胀后腐蚀。\n\
  \n仅仅通过阅读很难理解这些概念。请查看清单 9-2 中的示例，该示例在二值图像上演示了这些概念。\n\n***清单 9-2.*** `prog02.py`\n\
  \n```\nimport matplotlib.pyplot as plt\nimport scipy.ndimage as ndi\nimport numpy\
  \ as np\n\nimg = np.zeros((16, 16))\nimg[4:-4, 4:-4] = 1\nprint(img)\n\nerosion\
  \ = ndi.binary_erosion(img).astype(img.dtype)\ndilation = ndi.binary_dilation(img).astype(img.dtype)\n\
  opening = ndi.binary_opening(img).astype(img.dtype)\nclosing = ndi.binary_closing(img).astype(img.dtype)\n\
  \noutput = [img, erosion, dilation, opening, closing]\ntitles = ['Original', 'Erosion',\
  \ 'Dilation', 'Opening', 'Closing']\n\nfor i in range(5):\n    print(output[i])\n\
  \    plt.subplot(1, 5, i+1)\n    plt.imshow(output[i], interpolation='nearest')\n\
  \    plt.title(titles[i])\n    plt.axis('off')\n\nplt.show()\n```\n\n清单 9-2 中的代码示例生成一个二值图像，并对其应用所有二值形态学操作。输出结果如图\
  \ 9-2 所示。\n\n***图 9-2.** 对二值图像进行形态学操作*\n\n另一个重要的操作是 `binary_fill_holes()`。它用于填充二值图像中的孔洞，如清单\
  \ 9-3 所示。\n\n***清单 9-3.*** `prog03.py`\n\n```\nimport matplotlib.pyplot as plt\n\
  import scipy.ndimage as ndi\nimport numpy as np\n\nimg = np.ones((32, 32))\nx, y\
  \ = (32 * np.random.random((2, 20))).astype(np.int)\n\nimg[x, y] = 0\nnoise_removed\
  \ = ndi.binary_fill_holes(img).astype(int)\n\noutput = [img, noise_removed]\ntitles\
  \ = ['Original', 'Noise Removed']\n\nfor i in range(2):\n    print(output[i])\n\
  \    plt.subplot(1, 2, i+1)\n    plt.imshow(output[i], interpolation='nearest')\n\
  \    plt.title(titles[i])\n    plt.axis('off')\n\nplt.show()\n```\n\n清单 9-3 中的代码生成一个\
  \ 32×32 的方阵图像，所有值均为 1（白色值）。然后随机将几个像素设置为 0（黑色值）。这些黑色像素可以视为图像中的孔洞，随后可通过 `binary_fill_holes()`\
