  ---\n\n## 第 2 章 Python 与数字图像处理入门  \n### 数字图像处理简介\n\n为了开始学习数字图像处理（DIP），我们将简要回顾一些相关主题的基本概念。\n\
  \n#### 信号处理\n\n任何携带信息的事物，当用数学方式表示时，被称为信号。从给定信号中提取有用且相关信息的过程或技术称为信号处理。执行此类任务的系统称为信号处理系统。\n\
  \n信号处理系统的最佳示例是人类大脑。它处理来自各种感官的多种类型的信号。人脑是一个生物信号处理系统。当系统由电子元件构成时，它被称为电子信号处理系统。信号处理是一门结合数学与电气工程的学科。\n\
  \n电子信号分为两种类型——模拟信号和数字信号。下表列出了这两种信号的区别。\n\n| **模拟信号** | **数字信号** |\n| :--- | :---\
  \ |\n| 连续信号 | 本质上是离散的 |\n| 用正弦波表示 | 用方波表示 |\n| 连续信号 | 离散信号 |\n| 因噪声而劣化 | 不受噪声影响\
  \ |\n| 不灵活 | 灵活，可执行多种操作 |\n| 消耗更少带宽 | 消耗大量带宽 |\n| 功耗高 | 功耗低于模拟 |\n| 在捕获、存储和传输中存在大量错误\
  \ | 错误较少，且有校验和与纠错算法可用 |\n\n---\n\n#### 图像处理\n\n图像是一种信号。因此，图像处理是信号处理的一种类型。图像处理系统是信号处理系统的一种。眼睛和大脑的组合是生物图像处理系统的一个例子。图像处理系统有两种类型——模拟和数字。\n\
  \n##### 模拟图像处理\n\n静态和运动胶片相机的时代代表了模拟时代。模拟图像的来源是胶片相机（静态和运动）、老式传真机和电传机。老式电视系统、CRT 显示器和胶片放映机代表了模拟图像处理系统。模拟图像处理广泛涉及模拟电子系统、机械部件、光学器件和化学处理（用于显影和存储胶片）。\n\
  \n##### 数字图像处理\n\n随着数字计算机、存储系统、图像传感器和数码相机的出现，图像可以以数字格式捕获、存储和处理。使用数字计算机从图像（包括模拟和数字图像）中处理和检索信息称为数字图像处理。它广泛涉及数字传感器（数码相机）、数字计算机和数字存储设备。以下是数字图像处理系统的一些应用：\n\
  \n*   计算机化图像编辑、校正、增强、去噪等。\n*   医学图像处理与诊断辅助\n*   太空图像处理（处理来自哈勃望远镜和地面望远镜的图像）\n\n\n\
  \n• 工业应用，如产品检测和分拣\n• 生物识别技术（指纹、人脸和虹膜识别）\n• 电影制作与视觉效果\n• 遥感技术（处理航空和卫星图像）\n\n以下科学学科与数字图像处理有显著重叠：\n\
  • 信号处理\n• 数字电子技术\n• 计算机/机器视觉\n• 生物视觉\n• 人工智能、模式识别和机器学习\n• 机器人学与机器人视觉\n\n## 第 2 章：Python\
  \ 与数字图像处理入门——使用树莓派和 Python 进行数字图像处理\n\n由于数字图像处理需要数字计算机，我们必须借助计算机以及相应的编程平台来实现。\n\n\
  树莓派满足了数字图像处理对最小功耗系统的所有要求。它最吸引人的特点是成本低廉。此外，它还能与多种数字图像传感器（如网络摄像头和树莓派摄像头模块）进行连接。\n\n\
  我们了解到，Python 是一种易于学习的编程语言，它帮助我们专注于手头的任务，而无需过多担心语法问题。它也是树莓派最受欢迎的编程平台。Python 拥有许多第三方图像处理和可视化库。这使得树莓派和\
  \ Python 成为初学者入门数字图像处理最显而易见的选择。\n\n## 练习题\n\n完成以下练习，以更好地理解 Python 3 的背景知识。\n\n•\
  \ 访问并浏览 Python 主页 [www.python.org](http://www.python.org)。\n• 访问并浏览 Python 文档页面\
  \ [`docs.python.org/3/`](https://docs.python.org/3/)。\n• 在 [`docs.python.org/3/whatsnew/index.html`](https://docs.python.org/3/whatsnew/index.html)\
  \ 查看 Python 最新版本的新特性。\n\n## 第 2 章：Python 与数字图像处理入门总结\n\n在本章中，我们了解了 Python 的背景、历史和特性。我们还学习了\
  \ Python 2.x 与 Python 3.x 之间的重要区别。我们学习了如何在脚本模式和解释器模式下使用 Python 3。我们介绍了几款流行的 Python\
  \ IDE，并在树莓派上配置了适用于 Python 3 的 Geany。最后，我们学习了数字图像处理领域的相关知识。在下一章中，我们将开始学习 Python 中一个名为\
  \ Pillow 的流行数字图像处理库。我们还将学习如何使用 `Tkinter` 库来显示图像。\n\n## 第 3 章：开始上手\n\n在上一章中，我们学习了\
  \ Python 的设计理念，也了解了为什么应该使用 Python 3，以及一些与数字图像处理相关的概念。本章我们将探讨如何在树莓派上使用 Python 3 进行图像处理编程。我们将学习如何将树莓派连接到各种摄像头传感器以获取图像。我们将介绍\
  \ Python 3 中的 Pillow 和 Tkinter 库。以下是本章将要学习的主题列表：\n\n• 图像来源\n• 使用网络摄像头\n• 树莓派摄像头模块\n\
  • 用于数字图像处理的 Python 3\n\n在本章结束时，我们将能够熟练使用摄像头以及 `Pillow` 和 `Tkinter` 库。\n\n## 图像来源\n\
  \n为了学习如何进行数字图像处理，我们需要数字图像。世界各地有一些标准的图像数据集可供使用；我们将使用来自以下数据库的几张免费图像：[`sipi.usc.edu/database/`](http://sipi.usc.edu/database/)。\n\
