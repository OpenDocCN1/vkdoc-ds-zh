  \ 发行版以及 BSD（如 FreeBSD）。\n\n## 第 10 章 视频处理\n\n图像处理与计算机视觉的世界非常广阔。如果我们将其比作海洋，那我们仍身处其海岸边缘。凭借基础知识，我们完全能够向更深水域探索，并更深入地理解计算机视觉。掌握了高级知识，我们就能为计算机视觉编写各种真实案例程序。\n\
  \n## 附录\n\n本节将探讨一些主题，帮助我们更高效地使用图像处理和树莓派单板计算机。虽然我在其他章节中未能为这些主题找到合适的位置，但我个人认为它们在学习过程中非常有用。本附录涵盖以下主题：\n\
