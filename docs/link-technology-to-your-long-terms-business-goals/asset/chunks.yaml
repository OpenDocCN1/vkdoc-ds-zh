  trans: "\n# 晋升与薪酬\n\n本节详细分析了员工评估体系可能呈现的形式。理想情况下，公司每位员工都将经历这一流程。\n\n晋升何时发生？以下是一个人可能获得晋升的三种情形：\n\
    \n![](img/521767_1_En_6_Fig1_HTML.png)\n\n一个文本框，标题为“我们将有三个类别”，每个类别分别对应类别 1、2、3。类别\
    \ 1 列出：个人贡献者、助理软件工程师、软件工程师。类别 2 列出：团队管理、助理技术主管、技术主管。类别 3 列出：领导层、高级技术主管、工程经理。\n\
    \n*图 6-1* 类别示例\n\n- **相同职位**：员工将继续担任相同职务。评估标准为：\n  - 绩效（基于评审流程）\n- **相同类别但不同职位**：员工获得不同职务，但仍属于同一类别。评估标准为：\n\
    \  - 绩效（基于评审流程）\n  - 职位变动增幅（+x%）\n- **跨类别**：员工有机会在不同类别中工作，职务和角色均发生变化。评估标准与图 6-1\
    \ 所示类似：\n  - 绩效（基于评审流程）\n  - 类别变更增幅（+x%）\n\n拥有这样的架构有助于员工向更高类别努力。同时，它也能确保那些倾向于做个人贡献者而非进入管理或领导角色的员工获得公平的晋升机会。晋升与薪酬的透明化，始终有助于构建健康的工作环境。\n\
    \n## 总结\n\n后疫情时代的工作体验一直在不断演变。只有通过建立适当的流程，以高效的方式与员工建立联系，才能实现有效的员工关系。我们必须确保给予员工及时的认可、晋升和评估。高效的员工对工作环境感到满意，这不仅是因为他们所做的工作，还因为他们感受到了关怀。这种关怀将通过我们建立的流程得以有效体现。而如果我们建立的流程对员工公开透明，这种关怀会成倍增加。\n\
    \n# 7. 仪式\n\n每个团队都有其特定的工作节奏，而通过建立仪式来维持这种节奏是可行的。仪式是有助于建立关系的周期性事件或活动。\n\n有些仪式是正式的活动，有助于跟踪多个项目的进展；有些则是非正式的聚会。每个仪式都应有一个议程，以确保其高效。在一个冲刺团队中，每日站会、冲刺规划和冲刺回顾对于保持团队节奏是强制性的。这些都是仪式。\n\
    \n## 每日站会\n\n每日站会不是一次状态汇报会议。在这次会议上，每位团队成员要讲三件事。\n\n- 他们过去一天做了什么\n- 他们接下来一天打算做什么\n\
    - 他们遇到了什么阻碍，是否需要他人帮助\n\n最后一点是站立会议的核心思想。它有助于解决团队成员可能遇到的任何困难。由于参加本次会议的是同一小组的同事，这有助于大家了解是否存在需要解决的依赖关系。\n\
    \n在我的初创公司，我们通常为组织内的所有团队举办多个站会。\n\n- 在同一个项目和冲刺中工作的团队，由项目经理担任 Scrum 主管\n- 在不同项目上工作的团队负责人，由高级负责人担任\
    \ Scrum 主管\n- 在多个项目上工作的工程负责人，会单独会面提出阻碍，由架构师或工程副总裁担任 Scrum 主管\n- 负责跨多个团队项目的特别小组，由业务团队的项目经理担任\
    \ Scrum 主管\n\n举办多个站会有助于确保每个团队既能独立运作，又能协作，因为每个团队的代表也参与更高级别的站会。\n\nScrum 主管确保会议举行，但由成员负责主持每日站会。Scrum\
    \ 主管教导团队成员将每日站会控制在 15 分钟的时间盒内。每日站会是 Scrum 团队的内部会议。如果有其他人出席，Scrum 主管要确保他们不会干扰会议。\n\
    \n## 回顾会议\n\n冲刺回顾会议是在每次冲刺结束时举行的周期性会议，用于讨论上一个冲刺周期中哪些做得好，以及下一个冲刺可以改进哪些方面。图 7-1 展示了一个冲刺回顾看板。\n\
    \n![](img/521767_1_En_7_Fig1_HTML.png)\n\n一幅素描画：一位女士站在梯子上，旁边是一块看板；一位男士坐在上面，面前放着一台笔记本电脑；另一位男士抱着一叠纸走过。看板上列出了做得好、需要改进以及待办事项。\n\
    \n*图 7-1* 一个典型的回顾看板\n\n运行冲刺回顾的方式有很多种。最常见的一种是使用“开始-停止-继续”方法。要求每位团队成员指出团队应该开始做的事情、应该停止做的事情以及应该继续做的事情。\n\
    \n以下是冲刺回顾中常见的问题：\n\n- 本次冲刺中哪些方面做得好？可以通过分析哪些做法不同以往、谁做出了贡献、如何贡献的，以及哪些技能、培训或知识起到了作用，来分析一次迭代的成功。\n\
    - 本次冲刺中哪里出了问题？重点不是惩罚团队或个人成员，而是审视那些未按计划进行的事情，以期在未来提高绩效。\n- 我们学到了什么？团队在冲刺中学到了什么，以便改进工作方式？\n\
    - 下一个冲刺应该如何进行？这将决定下一个冲刺需要采取的纠正措施，防止再次出现同样的错误，并使成功的做法成为可重复的成果。\n\n## 全员大会\n\n这个会议要尽可能具有互动性。使其具有互动性的最佳方式是在会议期间组织多次投票和调查。\n\
    \n- 始终从明确的议程和会议计划开始。\n- 开展投票活动，让大家通过猜测公司已实现的各项里程碑来参与。可以是猜测收入或利润的同比增长。\n- 安排多个有趣的会议活动，例如“结对分享”分组讨论室。\n\
    - 组织像虚拟密室逃脱这样的游戏，在参与者中营造最初的活跃氛围。\n- 允许员工提问。留出足够的时间倾听这些问题。当很多人知道还有其他人在倾听时，他们会提出重要的问题，而这些听众可能也有类似问题，却没有主动提问。\n\
    \n随着公司发展，全员大会非常有用，因为公司里的每个人都能同时获得相同的信息。全员大会可以让你的员工就公司目标和战略达成共识。将团队中的每个成员都想象成一个向量。全员大会有助于你引导他们朝着正确的方向前进。\n\
    \n谈谈公司的愿景和使命，强调你们的价值观，并审视公司在实现目标方面的表现。尤其是在事情变得令人应接不暇时，没有什么比谈论亮点并向帮助实现这些亮点的人大声喝彩更能提振士气的了。\n"
