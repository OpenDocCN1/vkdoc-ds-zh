- fmt: "# OKR Tools\n\nOver the past few years, OKR tools have started gaining prominence\
    \ as SaaS platforms. While startups with about 10 members can manage OKRs on spreadsheets,\
    \ the complexity of getting different teams aligned and reporting in a consumable\
    \ and real-time format is better managed by OKR platforms (e.g., `fitbots.com`).\
    \  \nBefore you select a platform to help you manage OKRs, look for some important\
    \ aspects:\n\n- Is the platform simple and intuitive for teams to adopt?\n- Can\
    \ you track objectives, key results, and milestones with initiatives?\n- Does\
    \ the tool foster a culture of conversations, feedback, and appreciation?\n- Can\
    \ teams collaborate either through the platform or by tagging each other for help\
    \ and support?\n- Do leadership reviews happen with high-quality alignment boards?\n\
    - Does the tool have reporting capabilities? For example, how many OKRs are associated\
    \ with an individual, or can you do a team OKR review with one click?\n\nSome\
    \ OKR tools are integrated with on-demand coaching to help your teams sustain\
    \ and manage OKRs. The tool that we used was `Fitbots`, available at `https://fitbots.com/`.\
    \ (Disclaimer: the content for the strategy chapters in this book was largely\
    \ contributed by the CEO of `Fitbots`.)\n\n## Check-in Meetings\n\nSustaining\
    \ OKRs requires check points at different levels.\n\n- **Team-level pod check-ins**:\
    \ Pods are a bunch of people identified from different teams who are driving specific\
    \ projects.\n- **Leadership level check-ins**: These include reviewing the teams\
    \ across multiple pods on progress of the objectives, to see if there are blockers\
    \ and to address them.\n- **Re-alignment**: This is a significant OKR ritual that\
    \ happens at the end of every quarter. Teams and leadership get together to discuss\
    \ their progress and learnings of the entire quarter to better strategize for\
    \ the next quarter.\n\nWhat really happens during check-in meetings, leadership\
    \ reviews, and end-of-quarter reviews? Figure 11-1, Figure 11-2, and Figure 11-3\
    \ explain the process in more detail.\n\n![](images/521767_1_En_11_Chapter/521767_1_En_11_Fig3_HTML.png)\n\
    \nA text box titled \"Retro Reboot.\" The questions are: Where did KRs go well?\
