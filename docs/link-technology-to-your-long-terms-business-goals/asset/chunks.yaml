    \ the flexibility to amend the plans at the end of a month. Figure [14-4](#521767_1_En_14_Chapter.xhtml#Fig4)\
    \ explains how a typical rolling plan works with multiple hops in between.\n\n\
    ![](images/521767_1_En_14_Chapter/521767_1_En_14_Fig4_HTML.png)\n\nIllustration\
    \ of a typical rolling wave plan. The plan extends for 6 months in which short\
    \ bi-weekly sprints move from one month to the next, which also includes monthly\
    \ cadence to check progress. And a bigger leap jumps from the start of the plan\
    \ to the end of the 6th month and includes high-level objectives to keep track\
    \ of.\n\n**Figure 14-4**  \n*A typical rolling wave plan*\n\nTo apply a rolling-wave\
    \ approach to your long-term project, you have to take the following steps:\n\n\
    1. Break down the components based on a two-month goal and set the remainder aside.\
    \ Make sure to plan the remainder in lesser detail.\n2. Plan the two-month goal\
    \ in detail and further break them into one-month goals.\n3. Take the first month’s\
    \ goal and further break the goals down into bimonthly sprint-based goals.\n4.\
    \ Start bimonthly sprints, and as the progress happens, revisit the monthly goal\
    \ and then augment the further goals to either add new requirements based on the\
    \ new understanding or remove the unnecessary requirements.\n5. Continue revising\
    \ your plan in this way throughout the project.\n\nDo not hold off on launches\
