    \ 978-1-4842-8208-3 [`doi.org/10.1007/978-1-4842-8208-3`](https://doi.org/10.1007/978-1-4842-8208-3)\
    \  \n© Praz 2022 本作品受版权保护。所有权利均由出版商独家许可，涉及全部或部分材料，特别是翻译、重印、重新使用插图、朗诵、广播、以缩微胶卷或任何其他物理形式复制，以及电子改编、计算机软件或现在已知或将来开发的类似或不同方法的信息存储与检索、传输。本出版物中使用的一般描述性名称、注册商标、商标、服务标志等，即使未作特别声明，也不意味着这些名称不受相关保护法律和法规的约束，因此可自由用于一般用途。出版商、作者和编辑可以假设本书中的建议和信息在出版之日是真实准确的。出版商或作者、编辑不对本材料中的任何错误或遗漏提供明示或暗示的保证。出版商对已出版地图和机构归属中的管辖权主张保持中立。\n\
    \n本 Apress 印记由注册公司 APress Media, LLC（斯普林格自然的一部分）出版。\n\n注册公司地址为：1 New York Plaza,\
    \ New York, NY 10004, U.S.A.\n\n# 关于作者\n\n# 第一部分 人\n\n# 1. 团队与分工\n\n当我告诉我当时所在公司的\
    \ CEO 我将创办自己的公司时，他对我说了这样一番话：“你招聘并培养过人，但从未解雇过任何人。不要急于创业，你需要学习人员管理，并理解如何建立和培养一个技术团队。”\n\
    \n我听取他的建议了吗？没有！如果我当时听从了建议，就不会在实际操作中获得学习团队管理艺术的速成课程。那样的话，这个过程将会持续更长时间。\n\n本章的出发点在于：人员管理并非可教授之物。我试图总结自己在人员管理方面的经验，以便当你经历类似情况时，能帮助你更好地应对。你需要通过亲身经验来学习，并且要牢记一点：同理心。就我而言，随着团队壮大，我在团队较小时建立的文化，会随着新成员的加入而传播开来。\n\
    \n## 为什么要划分团队？\n\n在更传统的旧式工作方式中，业务需求来自组织的多个部门，汇总到一个单一的技术团队。技术团队会列出这些需求，然后遵循冲刺流程逐一实现。那时的团队是整体式的，工作方式往往是顺序进行的。在\
    \ 2010 年左右敏捷方法论出现之前，为了解放团队使其能自主决策而无需等待层级审批，公司一直依赖层级审批。这不仅体现在技术领域，也贯穿于业务的每一个职能。在敏捷时代之前，当我们预期某个项目需要在一定天数内完成时，我们按照顺序方式工作，如图\
    \ 1-1 所示。\n\n![](img/521767_1_En_1_Fig1_HTML.png)\n\n按顺序执行工作的流程图，任务 1 完成后才进入任务\
    \ 2。\n\n**图 1-1** 任务的顺序执行\n\n这让我们陷入了孤岛。我们开始变得目光短浅，无法预见项目后期可能出现的障碍。更好的方法是并行开发。但如何实现并行开发呢？\n\
    \n你可以尽可能细化地将团队划分为原子化的部门。如果有一个大项目即将启动，就在项目开始前规划好该项目的模块。\n\n让我们看一个例子：一个允许用户创建自己的工作流并自动化一系列重复任务的网站。我们称这个网站为“超棒自动化平台”。图\
    \ 1-2 展示了该网站的登录后视图可能的样子。\n\n![](img/521767_1_En_1_Fig2_HTML.png)\n\n为公司工作流创建的“超棒自动化平台”网站页面概览。此窗口显示网站的登录后视图。\n\
    \n**图 1-2** “超棒自动化平台”网站线框图\n\n开始处理平台登录后视图的最佳方式是，首先识别出网站中互斥的区域（图 1-3），并将其划分为以下模块：\n\
    \n![](img/521767_1_En_1_Fig3_HTML.png)\n\n网站上显示的 6 个互斥区域分别是：个人资料、应用、工作流、集成、搜索和仪表盘。\n\
    \n**图 1-3** 识别可独立工作的互斥区域\n\n1. *个人资料*：包括登录/注销/注册。\n2. *应用*：此部分包含平台上可用于创建自动化的所有应用。\n\
    3. *工作流*：这是平台的核心，将是驱动其运行的“大脑”。\n4. *集成*：此处提供不同的第三方集成。\n5. *搜索*：一个快速易用的搜索栏。\n6.\
    \ *仪表盘*：此区域显示当前使用情况的图表和分析，并展示推荐的工作流。\n\n## 并行优于顺序工作\n\n根据上述网站模块的定义，我们可以提出一个团队结构，然后启动该项目，并并行开展工作（图\
    \ 1-4）。\n\n![](img/521767_1_En_1_Fig4_HTML.png)\n\n并行执行工作的示意图，涉及 3 个团队：用户个人资料团队、核心产品团队以及搜索与仪表盘团队。个人资料团队执行登录、注册和个性化设置等任务。核心团队负责应用、第三方集成、后端\
    \ API、前端工作流或应用。服务团队处理图表和分析。\n\n**图 1-4** 工作的并行执行\n\n这将确保工作开始时，团队能并行交付，而非顺序进行。并行开发能保障每个团队的自主权，使其交付价值并创新（图\
    \ 1-5）。\n\n![](img/521767_1_En_1_Fig5_HTML.png)\n\n一幅草图展示了 3 个团队，每个团队一人。团队 3 的人员在记笔记。其他人在拼接拼图碎片。它们之间用虚线连接，表示执行。团队\
    \ 2 和团队 3 之间由一条中间带圆圈的虚线曲线连接。团队 1 和团队 2 之间由一条扭曲的丝带形曲线连接。\n\n**图 1-5** 任务的并行开发\n\
    \n如你所见，以每个团队能够并行执行的方式创建组织或子组织的部门/分工至关重要。\n\n## 总结\n\n当团队拥有身份和目标时，他们才能蓬勃发展。为每个组建的团队创建并维护一个愿景至关重要。例如，一个\
    \ Scrum 团队可以由七到八人组成，包括开发人员、质量保证分析师和自动化工程师，并可能配备一个专职或共享的项目经理。如果不这样做，将导致项目失去焦点，并与公司目标脱节。愿景将是让团队独立运作、快速高效执行策略的关键。\n"
- fmt: '# 2. Hiring


    Hiring is hard. Hiring in tech is harder. Hiring good people in tech is even harder.
    Hiring good people in tech who actually stay on and contribute significantly to
    the product is much harder still. Hiring good people in tech who actually stay
    on, contribute significantly, and then help in hiring other good people, thereby
    building a network, is super hard.


    This chapter shows how I tried, failed, succeeded, experimented, and mixed and
    matched different approaches to build my tech team.


    ## Referrals


    You know a guy who knows a guy who knows another guy (Figure [2-1](#521767_1_En_2_Chapter.xhtml#Fig1)).
    Referrals work most of the time. But never hire someone based solely on a referral
    alone. In my startup, I always followed certain protocols. My referrals were interviewed
    by the architect, his referrals by me, and so on.


    ![](images/521767_1_En_2_Chapter/521767_1_En_2_Fig1_HTML.png)


    A stick figure of three people depicts referral hiring. The first person is known
    to the person in the middle who in turn knows the interviewer.


    Figure 2-1


    Referrals


    Regardless of who recommends someone for a job at your company, always give a
    coding test. How much experience they have doesn’t matter. People who have made
    significant contributions at their previous companies may not always work out.
    The environment and culture in the current setting matter significantly. Will
    the person be able to adapt to this is the question you should always ask, even
    after they have joined your company. If you decide to hire someone who you know
    isn’t right or isn’t going to be able to adapt to the new situation, the biggest
    loser will be you.


    That being said, I have indeed succeeded in hiring people based on a referral.
    When they were given much more responsibility than what they had before, they
    moved above and beyond and shined brighter than anybody else. Some people continue
    to surprise me.


    The bottom line is that there''s no right answer to referrals. Some referrals
    work; some don''t. The chances of someone working out or not working out are dependent
    on several factors, so ask yourself these questions before you judge a new hire
    as a success or a failure:


    - Have you let them become accustomed to their new environment?

    - Have you given them enough time to adjust?

    - Have you taken them to the middle of the ocean and then left them to swim to
    the bank, or have you held their hand all along? This shows how easily they can
    cope with adversity.

    - Are they agile enough to adapt?

    - Are they willing to go that extra mile to do what it takes?


    As I’ve said, I’ve both made mistakes and had successes when I’ve blindly trusted
    referrals. After several debates about this, I’ve realized blind trust isn’t bad,
    but it needs to be balanced. Your colleagues will help you balance this, which
    is why you need diverse characters on each team. They can advise you while making
    decisions on hiring a certain referral candidate or even give the right feedback
    to the person directly.


    ### HR Sourcing


    HR sourcing works pretty well when you are hiring continuously for open roles.
    It helps fill a lot of gaps that have been created because of your team growing
    and accepting a wider and more diverse array of requirements.


    I’ve seen it not work when we needed it urgently, mainly because people tend to
    make mistakes when they rush and end up interviewing a lot of candidates to fill
    a certain number of positions. It is best to work with HR over a period of time
    and help them grasp the role so the candidates can be filtered intelligently.


    ## Consultants


    Specialized roles like architects, where the requirements are clearly defined,
    work well when given to consultants. Using consultants is helpful when you know
    exactly the role you’re looking for. Unlike in referrals and HR sourcing, where
    there are a lot of unknowns (such as can we hire this person for a different role
    than the one we are looking for?), that question doesn’t arise here. We are clear
    with the consultants on what role we are looking for, and they have precisely
    that set of skills needed.


    The process can be streamlined by using effective hiring tools (e.g. `Hirect`,
    `Recruitee`, `Intervue` etc.). Also, you can give each team’s lead the responsibility
    and ownership to hire on their own, which gives the team a lot of independence.
    The job descriptions of each team may vary due to the nature of work, and giving
    the right amount of independence lets them hire great talent from a pool of consultants.


    ## Recruitment Drives


    Recruitment drives have been a revelation that I have personally taken advantage
    of. Especially during the covid-19 pandemic, hiring was difficult because people
    were adjusting to a fully remote culture. At my startup, we devised a plan to
    first come up with the additional workforce requirements for each team. Since
    we had an overview of the upcoming work that was going to happen, we extrapolated
    and came up with strategies to augment the resources. The people requirements
    were documented as shown in Figure [2-2](#521767_1_En_2_Chapter.xhtml#Fig2).


    ![](images/521767_1_En_2_Chapter/521767_1_En_2_Fig2_HTML.png)


    A sample plan on people requirements depicts various job roles like the user profile
    team, search and dashboard team, core product team, and quality assurance team
    making an overall total additional resource requirement of about 12 people altogether.


    Figure 2-2


    People requirements


    Once we had these requirements, it was time to extrapolate on how many candidates
    we expected to call for interviews. If we needed 12 resources, then Figure [2-3](#521767_1_En_2_Chapter.xhtml#Fig3)
    shows the number of people we had to shuffle through the hiring process.


    ![](images/521767_1_En_2_Chapter/521767_1_En_2_Fig3_HTML.png)


    The interview process has 5 stages from number of people applied for the job.
    120 candidates apply for the job, followed by a selection process in which only
    60 are selected. 30 pass the coding test, then 15 pass the interview stage 2,
    3, and 4 rounds. Lastly out of 120 only 12 people join the company.


    Figure 2-3


    Interview process


    Each time we did recruitment drives, we followed this structure, and it helped
    in understanding how many applications we could expect. The actual numbers can
    change from team to team, from company to company, and from process to process,
    but having these baseline numbers ready will help in augmenting resources and
    planning for the hiring drives.


    A hiring drive has these main steps:


    1. Sourcing

    2. Screening

    3. Assessing

    4. Onboarding


    Since I’ve covered the screening and assessment bits already in this chapter,
    let’s talk about sourcing.


    In my startup, I did not have any set way of doing this except to use social channels
    and organic communication. We created flyers that could be posted on `LinkedIn`.
    We sent out mailers to the colleges we studied at where the placement coordinators
    would then ask the final year students to apply.


    What I’ve seen in recruitment drives is that though you get fresh employees, you
    can upskill and mold them in a way that suits the needs of your company. They
    are able to adapt and learn faster than you might imagine. Oftentimes they are
    the ones who go on to become the future leaders you can rely on.


    ## Summary


    When I managed a team of 12 people at my startup, I would give them all the independence
    to do things the way they would want, and still processes were followed. Sprint
    planning, retrospection, and all the agile rituals were followed without me having
    to set up processes. That’s because the initial hiring was done carefully. What
    sets up the entire culture are those 10 initial people you hire. One mistake on
    those initial people, and there will be repercussions that are far reaching. The
    initial hires have to be handpicked. With that foundation of good people in place,
    the culture can be set up to ensure the next set of hiring will follow suit in
    terms of attitude.'
