  trans: '

    # 摘要


    建立流程在初期是困难的。要将流程推广到整个公司，需要说服、纪律、时间和精力。一旦这些流程建立起来，公司整体将拥有一个标准模板，从而在执行任务和项目时，比流程建立之前快得多。执行临时项目会给人一种公司快节奏的假象，但这实际上只是一次性的事情。一个具有韧性的公司总是遵循并尊重流程。一个志在长存百年的公司，会建立能够持续那么久的流程，并适应能够助其一臂之力的新时代流程和技术。


    # 14. 原型设计


    现代公司依靠快节奏的战略以及这些战略的成功执行而蓬勃发展。但这种速度不应以牺牲已建立的流程为代价。快速原型设计应该有其特定的执行方式。建立有助于开发和部署这些快速原型的内在结构非常重要。公司和员工的思维模式应与执行此类快节奏项目保持一致。这需要灵活性、勇气以及以数据驱动的方式快速推进的意愿。在执行原型项目时，每个数据点都至关重要。数据点使团队能够判断执行和战略是成功还是有缺陷。随后可以快速进行调整，使战略成为成熟的方案，从而实现快速原型设计。


    ## 创新项目


    一个企业要想保持竞争力，就需要创新，而且需要快速创新。这意味着它需要具备快速失败的能力，并找到比竞争对手更快解决问题的办法。为此，团队和流程必须具有敏捷性——比任何其他人都更敏捷。


    为了快速行动，公司已经采用了敏捷原则。在此过程中，运营团队经历了一场巨大的数字化转型之旅。新冠疫情以前所未有的速度加速了数字化进程。随着如此多的公司完全转向远程办公模式，世界已被永远改变。但敏捷本身并不能保证规模化；公司在转向数字化时需要意识到规模问题。


    审视敏捷团队的传统方式也随着时间的推移而演变。出现了诸如`squads`、`pods`、`cells`、`prides`和`tribes`等描述团队的新结构。甚至在组织内部还形成了`villages`和`guilds`。


    这些团队可能有自称传统经理和 Scrum 大师的领导者，也可能有诸如`shepherds`之类富有创意的名称。我们喜欢称他们为`mentors`。


    但无论这些新名称是什么，它们只是组织内部创建新结构的一种方式，这种结构有助于超快速地交付项目，同时还能处理规模问题。这些名称背后的核心思想是确保人们作为一个紧密的团队一起工作，完成手头的任务。这些小队的运作效率远高于传统团队。


    小队模式也被称为“Spotify 模式”，因为它最初是由音乐流媒体服务公司 Spotify 开发的。Spotify 开发了自己版本的 Scrum。图 14-1
    解释了 Spotify 的部落、小队和公会模型。请注意，一个小队可能来自同一个部落但跨越不同团队，而一个公会可能来自不同部落。


    ![](img/521767_1_En_14_Fig1_HTML.png)


    部落 1 和部落 2 由按 4 行 4 列排列的人员组成。每个部落的第一行分别表示章节 1 和章节 2。部落 1 的第一列和第三列表示小队 1 和小队 2。部落
    1 的最后一个人和部落 2 的最后一行属于公会 1。


    **图 14-1** Spotify 的部落、公会、章节和小队


    Spotify 使用 Scrum，但将`team`重新命名为`squad`，因为公司希望为团队成员创造一种主人翁意识。


    在我的创业公司，我们为自身的用途提出了小队模型的修改版本，并对典型的 Scrum 系统进行了改进。在我们的模型中，我们采用现有的 Scrum 模型，假设有两个业务组织分布着十个
    Scrum 团队。那么，如果有一个项目需要这些团队相互协调，我们就会让每个 Scrum 团队的负责人组成一个小队。一个典型的小队由每个 Scrum 团队的多位负责人、负责项目交付的项目经理、QA
    人员以及其他可能需要临时加入的成员组成。


    在小队成立后，我们确保这个小队在常规的 Scrum 会议之外另行会面，以确保项目顺利进行。如果小队遇到任何困难，他们会在各自的 Scrum 会议上与常规团队成员沟通，以澄清并排除障碍。


    图 14-2 展示了我们小队的样子。黑头火柴人代表团队负责人。请注意，Scrum 5 的负责人足以代表整个 Scrum 5 团队参与小队 2。


    ![](img/521767_1_En_14_Fig2_HTML.png)


    业务组织 1 和业务组织 2 由按 4 行 5 列排列的人员组成。从左到右，各列分别表示 Scrum 1、2、3、4、5、6、7、8、9 和 10。业务组织
    1 第四行的最后两人和业务组织 2 的第四行表示小队 1。业务组织 1 的最后一个人和业务组织 2 的第五行表示小队 2。


    **图 14-2** 为适应 Scrum 团队而改进的小队模型


    对于新的创新项目，快速响应市场需求并转型为数字化组织的需求，在我们这里推动了这些自治、自组织工作组的兴起，并带来了深远的好处。根据我的经验，小队模型是有效的。它带来了常规团队之外的协作，以及单个团队无法实现的效率。


    ## 快速周转


    将团队组织成具有特定目标导向的创新项目的小队，可以带来快速的周转。但代价是什么？有些正在进行的项目对日常业务的运作极其重要，这些项目不能被打扰，其成员也不能。因此，最好是创建与现有团队并行运作的研发团队。这些团队将拥有灵活性，并能够承担新的挑战。这个团队的成员可以从现有团队中那些总是乐于学习新事物的成员中挑选。


    研发团队需要有自己每日的节奏，以帮助自身解决可能遇到的任何新问题。通常，任何新项目首先会交给研发团队，以便他们能够快速制作原型，然后将其传递给特定的小队或
    Scrum 团队，如图 14-3 所示。


    ![](img/521767_1_En_14_Fig3_HTML.png)


    业务组织 1 和业务组织 2 由按 4 行 5 列排列的人员组成。从左到右，各列分别表示 Scrum 1、2、3、4、5、6、7、8、9 和 10。两者都有额外的
    5 名成员组成研发团队。


    **图 14-3** 为了提高效率，每个组织应拥有独立的研发团队


    要实现任何项目的快速周转，请执行以下操作：


    - 在项目开始时设定清晰的里程碑，以确保一切按计划进行。

    - 使用正确的技术。选择当前团队熟悉且精通的技术是绝对必要的。

    - 保持每日例会的节奏，以确保你不会落后于进度。

    '
- fmt: "# Long-Term Projects\n\nPlanning and managing a long-term project presents\
    \ special challenges. Long-term projects can range from months to a year or more.\
    \ It depends on the results of the work you do between now and then. Even if we\
