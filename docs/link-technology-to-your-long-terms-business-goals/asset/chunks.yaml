  raw: '## Long-Term Projects


    Planning and managing a long-term project presents special challenges. Long-term
    projects can range from months to a year or more. It depends on the results of
    the work you do between now and then. Even if we can accurately predict what we
    want as an outcome at the end of six months, it would be difficult to ensure that
    the situation would remain the same after five months.


    It is always better to plan in short bursts so there is always the flexibility
    to amend the plans at the end of a month. Figure [14-4](#521767_1_En_14_Chapter.xhtml#Fig4)
    explains how a typical rolling plan works with multiple hops in between.


    ![](images/521767_1_En_14_Chapter/521767_1_En_14_Fig4_HTML.png)


    Illustration of a typical rolling wave plan. The plan extends for 6 months in
    which short bi-weekly sprints move from one month to the next, which also includes
    monthly cadence to check progress. And a bigger leap jumps from the start of the
    plan to the end of the 6th month and includes high-level objectives to keep track
    of.


    Figure 14-4


    A typical rolling wave plan


    To apply a rolling-wave approach to your long-term project, you have to take the
    following steps:


    1.  Break down the components based on a two-month goal and set the remainder
    aside. Make sure to plan the remainder in lesser detail.


    2.  Plan the two-month goal in detail and further break them into one-month goals.


    3.  Take the first month’s goal and further break the goals down into bimonthly
    sprint-based goals.


    4.  Start bimonthly sprints, and as the progress happens, revisit the monthly
    goal and then augment the further goals to either add new requirements based on
    the new understanding or remove the unnecessary requirements.


    5.  Continue revising your plan in this way throughout the project.


    Do not hold off on launches related to long-term projects. If there are features
    that are meeting the minimum viable product (MVP), then it is good to test the
    product by launching it to a select set of users. The learning that is received
    by launching an MVP is going to add value to the full product launch that happens
    later.


    There are several approaches for go to market.


    *   *Soft launch*: Figure out the set of users to whom you can launch a new feature
    and enable it only for them. Also ensure that you have proper feedback mechanisms
    in place to record the feedback. This can be used as a critique of the existing
    set of features. Depending on the feedback, you might want to use the existing
    set of features or want to strip some of them off. Once the decision is done and
    agreed upon, you can then launch it for all users.


    *   *Dark launch*: In this launch, the user doesn’t know that they are being used
    to test something. No user feedback is actively received, but you can use analytics
    to understand the user behavior.


    *   *Hard launch*: Only if you have the infrastructure to handle a vast amount
    of users suddenly using a new feature, then go ahead with a hard launch.


    There are no winners and losers among these different types of launches. Depending
    on which type of launch suits the situation and the user base, using a specific
    approach is going to help.


    Also, note the following for new product launches:


    *   Do not waste time adding too many features. An MVP is good enough to understand
    the market; hence, launch it and then iterate on it.


    *   Innovation should not be frowned upon when launching new products, as a slight
    tweak can give you an edge over competition.


    *   The MVP should be light-weight and not too resource-consuming. Ensure that
    it does not burn a hole in your pocket. You want to quickly test the market needs
    and then try the most frugal means to build an MVP. Do not spend a lot on making
    the perfect product.


    *   Rushing in development helps in getting to market sooner. Keep making small
    mistakes fast so you can learn and improve the product faster. These mistakes
    when done early help you get invaluable learning that will help when the product
    matures over time.


    *   Iterations should be kept to one to two weeks. Keep cutting down on things
    that are going to take a longer time. Do not worry if your favorite feature did
    not make the cut in an MVP. There will always be time to add it after the product
    has been launched.


    ## Summary


    Launching a minimum viable product does not mean that it was a success. This will
    be discussed in more detail in Chapter [23](#521767_1_En_23_Chapter.xhtml) when
    we talk about how to identify and consider a certain MVP as a winner. But developing
    a fast MVP ensures a faster go-to market than the competitors. In a digital world
    where all businesses are scrutinized and every strategy is critiqued, Minimum
    viable product can let businesses test their product at a smaller scale, get the
    feedback quickly and then try to do it at scale. This will lead to better iteratively
    good products.


    # 15. Scaling Operations


    Executing projects in a fast-paced manner can have two consequences: either it
    succeeds if all the parameters were thought through and planned or it fails because
    there were misconceptions, mistakes in execution, and misunderstanding between
    the strategy and execution teams. When a project fails at scale, the consequences
    are compounded and are sometimes irreversible. So, treading between agility and
    scale is super-important, especially for growing companies. Larger companies can
    sometimes afford the risk of a big project failing, but that’s not the case for
    mid-market-sized companies.'
  trans: "\n# 长期项目\n\n规划和管理长期项目会带来特殊挑战。长期项目可能持续数月、一年甚至更久，其成果取决于你在此期间开展的工作。即便我们能准确预测六个月后想要达成的目标，也很难确保五个月后的情形与预期一致。\n\
    \n更好的做法是采用短周期规划，这样每月末都能灵活调整计划。图 14-4 展示了一种典型的滚动计划如何通过多个中间节点运作。\n\n![](img/521767_1_En_14_Fig4_HTML.png)\n\
    \n典型滚动波计划示意图。该计划周期为 6 个月，其中包含每两周一次的短周期冲刺，逐月推进；同时设有月度检查进度的节奏。更大的跨度则从计划起点跨越至第 6\
    \ 个月末，涵盖用于追踪的高层级目标。\n\n**图 14-4**  \n*一个典型的滚动波计划*\n\n要将滚动波方法应用于长期项目，你需要遵循以下步骤：\n\
    \n1. 根据两个月目标拆解组件，其余部分暂放一边。务必以较低详细度规划剩余部分。\n2. 详细规划两个月目标，并进一步分解为月度目标。\n3. 取第一个月目标，将其进一步分解为双周冲刺目标。\n\
    4. 启动双周冲刺，随着进度推进，重新审视月度目标，然后调整后续目标：基于新理解添加新需求，或删除不必要需求。\n5. 在整个项目中持续以这种方式修订计划。\n\
    \n不要推迟与长期项目相关的发布。如果某些功能已达到最小可行产品（`MVP`）的标准，则可以通过向特定用户群发布来测试产品。通过发布`MVP`获得的经验，将为后续全面产品发布增加价值。\n\
    \n市场进入策略有多种方式。\n\n- **软发布**：确定可向其发布新功能的用户群，并仅对这部分用户启用该功能。同时确保设置适当的反馈机制来记录反馈，这些反馈可作为现有功能集的评价依据。根据反馈，你可能决定保留或删除某些功能。决策达成一致后，即可向所有用户发布。\n\
    - **暗发布**：在此类发布中，用户并不知道自己正被用于测试。不会主动收集用户反馈，但可通过分析工具了解用户行为。\n- **硬发布**：仅在拥有足够基础设施，能够支撑海量用户突然使用新功能的情况下，才采用硬发布。\n\
    \n这些发布类型并无优劣之分。根据具体情境和用户群体选择最适合的方式，才能发挥效用。\n\n此外，针对新产品发布需注意以下几点：\n\n- 不要浪费时间添加过多功能。一个`MVP`足以帮助理解市场；因此先发布，再迭代。\n\
    - 发布新产品时不应排斥创新，因为微小的调整就能让你在竞争中占据优势。\n- `MVP`应保持轻量，避免消耗过多资源。确保它不会造成资金压力。你需要快速测试市场需求，并尝试用最节俭的方式构建`MVP`。不要为打造完美产品投入过多。\n\
    - 加快开发速度有助于更早进入市场。快速犯小错误，以便更快学习和改进产品。早期犯下的错误能为你带来宝贵的经验，当产品日渐成熟时这些经验将发挥重要作用。\n\
    - 迭代周期应控制在一到两周。持续删减耗时过长的内容。不必担心你钟爱的功能未能纳入`MVP`，产品发布后总有机会添加。\n\n# 总结\n\n发布最小可行产品并不意味着成功。我们将在第\
    \ 23 章详细讨论如何识别并认定某个`MVP`为成功案例。但快速开发`MVP`能确保比竞争对手更快进入市场。在这个所有商业行为都被审视、每种策略都受评判的数字世界中，最小可行产品能让企业以较小规模测试产品、快速获取反馈，然后尝试规模化推广。这将催生迭代优化后的优秀产品。\n\
    \n# 规模化运营\n\n以快节奏执行项目可能产生两种结果：要么成功——如果所有参数都已深思熟虑并规划妥当；要么失败——因为存在误解、执行失误，或战略团队与执行团队之间沟通偏差。当项目在规模化阶段失败时，后果会被放大，有时甚至不可挽回。因此，在敏捷性和规模之间保持平衡至关重要，尤其对于成长中的企业。大公司或许能承受大型项目失败的风险，但中型企业则无法如此从容。\n"
- fmt: '# Agility vs. Scale


    We should not look at agility and scale as competitors but as two sides of the
    same coin. If there are two people on a team and one person is “agile” while the
    other person is always speaking and working toward “scale,” that is a killer combination.
    Have them work together to build the best product in the shortest possible time.


    `Agile` teams are now becoming mainstream across different industries, and not
    keeping scale in mind while being agile will ensure that the project is going
    to fail in no time. Initially, the goal of agile when it was introduced in development
    was to be extremely flexible and aid in fast decision-making. It focused on colocated
    teams.


    When we look at the earliest processes like Division of Labor by Frederick Taylor
    and so on, we find they were focusing on the scale of operations rather than agility.
    Now it is time to merge the two approaches and come up with a hybrid model. People
    at scale can drive the same amount of operations that when replaced with machines
    is called agile. Not all things can start agile; the framework starts with people.
    Operations teams first have a lot of people to scale the business; once the processes
    set in, then tech comes in.


    We always thought that when we were building the business process tech team that
    the company would’ve done the same amount of business at the same scale even if
    we did not have the tech team. All the efficiency relied purely on people and
    people processes rather than on data and systems.


    Let’s begin to understand how we can merge agility and scale by first looking
    into the Agile Manifesto principles.


    - Agility values individuals and interactions over processes and tools.

    - A working self-explaining software is given more value than heaps of documented
    processes.

    - Working hand in hand with customers is opted for rather than dealing with contractual
    obligation talks.

    - Plans should be agile too, where you can quickly react to changes rather than
    following a set course of action.


    When we apply agile and lean strategies at a team level, then we are being strategically
    forward thinking as this is what will drive teams that are already at scale to
    function in an agile manner. Usually, when we think of scale, we often think it
    is a huge number of people and a large number of teams. But if we are being tactical
    enough, then with a lean team we can achieve scale.


    When we look at different ways of working (WoW), applying strategies that takes
    into consideration the current context and situation helps in arriving at the
    right solution. Application of strategies that is written in text books would
    not be prudent. It will help us achieve what is needed for the current project
    at the current time. This awareness of context while applying strategies will
    help in creating tailor-made strategies. It will fit the purpose of the situation
    and the project. If we do select a certain way of working at the beginning of
    the project, it doesn’t mean we will continue to stick to that. But it acts like
    a guiding light, and the rolling plans eventually will help us in adapting to
    the needs of the situation later. Usually, if the situation becomes complex later,
    then the strategy to change the way of working for that situation will be required.


    When selecting a context-aware strategy at the start of a project, there are certain
    parameters that we need to identify that will help in setting up the ways of working.


    - **How is the team structured?** Is the team composed of business analysts, UX
    designers, developers, QA people, or data scientists, or will it be composed more
    of sales, operations, and marketing people? Are these going to be sourced from
    outside, or are we going to pull in people from different pre-existing teams and
    form a new team? Will they all be colocated, will they be working from home, or
    is it going to be a hybrid model? Will they be in a large team all together, or
    will there be specific teams to deal with specific modules? These questions need
    to be answered, and the answers could vary depending on the situation you are
    in.


    - **Once that is done, how you will work together?** Which way of working best
    suits the situation? Agile? Traditional? Or a mix of both? Will you be able to
    come up with prospective goals, or will you be able to come up with a week-on-week
    goal-driven approach? Are there going to be roadblocks that you might face while
    choosing any of these approaches?


    - **What collaboration tools are you going to use?** For this, there are multiple
    options, and being in technology space, we would’ve used applications that help
    us collaborate. In our team, we used a tool called “Gather” that helped us collaborate
    when we moved to work from home model. When we used to work at the office, we
    could speak to the person who was next to us and ask them about any doubts we
    had. This happened across teams, and no one would hesitate to ask for help as
    each person would know the person next to them. But once we moved to remote work,
    this became hard, especially for junior members of the team who were hesitant
    to approach others for help. We used a tool called `Gather Town`; this website
    lets all the members of our team be in one virtual workspace, and each of us gets
    a virtual character. We can use this character to walk around and meet other people,
    get into a “bubble” with them, and speak to them privately as well. Other communication
    channels include traditional email, `Slack`, etc.


    The choices that we make at the start of the project will change over time as
    we learn, but the main point to note is that we will make some broad choices at
    first to get going.


    The choices we make are dependent on factors such as the following:


    - Team culture

    - Technical skills of the team

    - Nature of problem

    - Business constraints


    Let’s review these factors now.


    ## Team Culture


    Having agile teams requires people to collaborate effectively to achieve things.
    If traditional-culture people are put on an agile team, that will lead to two
    people speaking different languages. There would be no coherence or togetherness.
    The culture for a specific team will also vary depending on what the organization’s
    culture is. If the organization culture is traditional but specific teams within
    the organization are agile, that also spells trouble as there will be collaboration
    required between teams, and when each team cannot understand the other team’s
    `WoW`, it becomes difficult to deal with unknowns. People’s flexibility also plays
    a role in agile teams. Agile teams require people to be flexible and accommodating
    in their approach. Being rigid only increases the time frame to deliver and acts
    as a barrier between teams. In Figure [15-1](#521767_1_En_15_Chapter.xhtml#Fig1),
    it shows how people’s mental state can be affected by the increased scale of a
    product. If the product requires agility, the team will be flexible, and as the
    agility decreases, the team’s culture becomes rigid.


    ![](images/521767_1_En_15_Chapter/521767_1_En_15_Fig1_HTML.png)


    Vertical bars denote the following team cultures in increasing order. Flexible,
    Organized, Pseudo rigid, and rigid.


    *Figure 15-1* Explaining how the scale can affect people’s mentality'
