- fmt: '### Operations


    ![](images/521767_1_En_23_Chapter/521767_1_En_23_Fig3_HTML.png)


    Sketch of 3 people. One lady is standing on a ladder. A man is presenting with
    a writing pad. A man watches using a zoom lens from far away. Several icons for
    settings, clock, humans, a bulb, dollar signs, graphs, and data.


    Figure 23-3: Figure illustrating multiple cogs of the operations system of an
    organization.


    Operational processes cover everything in a business relating to its day-to-day
    running. The operations department enables other teams to do what they do best,
    while improving the overall functionality of the company behind the scenes. Its
    key responsibilities are process review, continuous improvement, and how the business
    creates and adapts its strategy.


    It’s vital that the operations department understands the BPM methodology, as
    they’re mostly responsible for any business process re-engineering that will go
    on. Without this, companies will struggle to analyze, monitor, and streamline
    processes.


    - **Partnerships**: Instigating and developing partnerships with other businesses
    in similar or complementing sectors can be a key way to grow your business. Ensure
    that you make the most of these connections by following a process designed to
    keep your partners and stakeholders in the loop and thinking of you first whenever
    a relevant opportunity arises.

    - **Policy review**: A process loses its worth as soon as it stops being reviewed
    and updated. Regular policy reviews not only mean that errors are reduced and
    that your business stays compliant but that you can actively look for places where
    improvements and efficiencies can be made. This is key to a successful business
    process improvement strategy.

    - **Procurement/tendering**: Every business needs tools or software to run on.
    Documenting how you manage procurement or a tendering process will mean that you
    take all factors into consideration to achieve the right outcome for your business.

    - **Strategy**: Your business strategy is the way you make decisions over what
    to do (and what not to do) and shapes the overall direction of the company. It’s
    important to understand your core business goals, to review your targets at regular
    intervals, and to have a clear process for setting and defining these targets.


    ### Sales and Marketing


    Often overlooked, the sales and marketing processes in your business are what
    will attract and persuade leads to become your customers. Once you’ve found strategies
    that work, it’s time for standardization. You want to make sure your activities
    are carried out the same way every time by following your processes.


    - **Competitor analysis**: Especially in a crowded industry, it’s key to keep
    an eye on your competitors. Having a process you can refer to that allows you
    to conduct a thorough competitor analysis will allow you to spot opportunities
    for differentiated positioning and offerings.

    - **Customer acquisition**: The ways in which you acquire customers will be unique
    to your business. The strategies may be common, but what makes your business successful
    is the knowledge and expertise you have built up in this process. Your team members
    should know exactly how you do digital marketing, how you do a sales call, or
    how you approach events. Having a documented customer acquisition process is essential.

    - **Publicity**: Whatever your industry, you will need to promote your company
    to potential customers. This could be through events, mentions in the press, or
    more traditional advertising. However you do it, putting together an optimized
    process will make sure that you don’t miss out on any opportunities. If you’re
    outsourcing any aspects of this, make sure you have a process in place to check
    in with the third party.

    - **Newsletter**: A common strategy to capture and nurture your leads before they
    purchase from you is to have a process for compiling a newsletter. Your newsletter
    should reflect your business and the image you want to send out. Don’t be afraid
    to add some information about what your company has been up to behind the scenes—people
    love the personal detail.

    - **Campaign**: Whether this is a digital advertising campaign or one centered
    around print materials, there are commonalities between each campaign you carry
    out. The aim or desired result needs to be decided up front, as well as criteria
    such as the budget and the audience. Having clear metrics that you can track is
    key to monitoring the success of your campaigns.

    - **Website**: A business website is the modern-day shop window. Ensuring it is
    kept up-to-date and that it accurately reflects your target audience is an ongoing
    job. You don’t want any bottlenecks where the entire content and sales teams are
    waiting for a single web developer to update everything! Make sure your process
    for updating your website avoids these potential problems.


    ## Summary


    Running a business and keeping all the plates spinning is by no means easy. But
    simply having a list of the 25 processes that every business needs is the first
    step in ensuring you’re on top of everything. The next step is to make these processes
    truly work for your business or public-sector organization by customizing them
    to suit your needs and circumstances.


    # 24. Are Processes Sacred?


    The ultimate goal for any business is to achieve maximum success. This applies
    whether you’re the sole owner of a dog-walking business, you run a small business,
    you lead a small or medium enterprise, or you work for a huge manufacturing business
    with many people sitting on the board.


    If you want to achieve success, several steps will have to be followed, specifically
    called *business processes*.


    In this chapter, we’ll look closely at the business process. You’ll learn about
    the different types, which are the most valuable, and why the business process
    is important. We’ll also share some business process examples so you can get a
    better idea of how they work.


    ## What Is a Business Process?


    A business process includes a combination of steps that are interlinked. Think
    of it as a checklist of best practices and methods on how to run your business.


    Each step will be assigned to a specific person, and the ultimate goal is to deliver
    a service or product to the customer.


    To be most effective, the task should be assigned to the person who is most capable.
    It’s possible for the steps to be repeated over and over again and actioned by
    several people in an optimized and standard way.'
