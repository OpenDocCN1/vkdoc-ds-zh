  trans: '

    # 后端技术


    当今世界，JavaScript 在拉近前端与后端的距离方面扮演着关键角色。如果公司同样在后端使用 JavaScript 技术栈，那么便无需再学习两种不同的技术栈。


    `Node.js` 是一个基于 Chrome V8 JavaScript 引擎的 JavaScript 运行时环境。它由 Ryan Dahl 于 2009
    年创建，是一个开源项目。`Node.js` 运行在 `V8`（它是对 Chrome V8 引擎的一个封装）之上。`V8` 是由 Google 开发的开源 JavaScript
    引擎，与浏览器无关。它是一个轻量级的异步系统，运行在单线程非阻塞架构上。`Node.js` 拥有一个非常庞大的社区，提供支持和辅助包（`NPM`）。`Node.js`
    包含一些 API/模块，可以帮助编写能够在 Web 浏览器之外运行的 JavaScript 代码。


    `Node.js` 是一个平台，允许你在服务器端使用 JavaScript 构建可扩展的网络应用程序。它具有以下特点：


    * *JavaScript 运行时*：在运行时执行 JavaScript 代码。

    * *服务器端*：在服务器上运行并执行 I/O 任务，帮助处理客户端请求。

    * *事件驱动*：执行流程由事件决定，例如按钮点击、鼠标悬停等。

    * *异步*：两个或更多事件可以同时发生，并且彼此之间不协调。


    ## 什么是 ExpressJS？


    `Express.js`，或简称为 Express，是一个基于 `Node.js` 的后端 Web 应用程序框架。它根据 MIT 许可证作为免费开源软件发布。它专为构建
    Web 应用程序和 API 而设计。


    `Express.js` 基于 `Node.js` 的中间件模块 `connect`，后者又使用了 `http` 模块。因此，任何基于 `connect`
    的中间件也可以与 `Express.js` 配合使用。


    ## 什么是 REST？


    REST 是“表征状态转移”的缩写。简单来说，它是一种应用程序编程接口（API），利用 HTTP 请求在 Web 上对数据进行 GET、PUT、POST 和
    DELETE 操作。任何基于 REST 的架构中使用的主要函数如下：


    * *GET*：提供对资源的只读访问

    * *PUT*：创建新资源

    * *DELETE*：移除资源

    * *POST*：更新现有资源或创建新资源


    # 数据库


    我们将研究两个数据库（MongoDB 和 Postgres SQL）的关键方面。总的来说，MongoDB 和 PostgreSQL 之间的主要区别在于它们的系统、架构和语法。MongoDB
    是一个文档数据库，而 Postgres 是一个关系型数据库管理系统。MongoDB 具有分布式架构，而 PostgreSQL 具有单体架构。MongoDB
    使用 BSON，而 Postgres 使用 SQL。


    ## MongoDB


    MongoDB 建立在分布式、可横向扩展的架构之上，并已发展成为一个全面的基于云的平台，用于管理和向应用程序交付数据。MongoDB 能够大规模处理事务性、操作性和分析性工作负载。如果你关心的是上市时间、开发人员生产力、支持
    DevOps 和敏捷方法论，以及构建无需复杂运维即可扩展的产品，那么 MongoDB 是理想之选。


    它具有以下特点：


    * 无模式数据库

    * 单个对象的结构定义良好

    * 数据以 JSON 文档形式存储

    * 支持索引


    ## Postgres SQL


    PostgreSQL 是一个坚如磐石、开源、企业级的 SQL 数据库，已持续扩展其能力长达 30 年之久。PostgreSQL 拥有你期望从关系型数据库中获得的一切，它依赖于纵向扩展架构。如果你关心的是兼容性、处理来自数百张表的数千个查询、利用现有的
    SQL 技能，以及将 SQL 推向极限，那么 PostgreSQL 将表现出色。


    它具有以下特点：


    * 它是一个传统的关系型数据库管理系统（RDBMS）。

    * 它是一个类似于 Oracle 或 MySQL 的 SQL 数据库。

    * Postgres 是免费的。


    对于已经对 JavaScript 有基本了解的人来说，MongoDB 的学习曲线较平缓；而对于在 SQL 数据库方面有丰富经验的人来说，适应 Postgres
    可能更容易。两者作为适用于各种行业的综合性数据库解决方案，其受欢迎程度都在增长。然而，公司在处理来自任一数据库的数据时面临的最大问题是所需的时间和复杂性。


    ## 总结


    你应该根据自身情况、团队成员以及他们的优势和劣势来选择技术栈的语言或框架。长期来看，你所选工具能否获得支持也同样重要。


    # 技术团队的关键流程与仪式


    软件工程这个名称对于编程而言并不恰当。软件工程只是纯粹的自动化，而编程是一门艺术。我们编写的任何代码都会不断演进。目标是首先让它运行起来，然后通过修改或重构来演进它。


    对我来说，驱动一个成功组织或个人的主要动力如下：


    * 沟通

    * 解决问题

    * 创新

    * 变更管理


    每个敏捷流程都应包含这些关键驱动因素。在讨论敏捷仪式之前，我们先来谈谈这些驱动因素的重要性。


    敏捷流程将每个项目分解成可由较小且分布的团队管理的若干块。


    ## 沟通


    项目的成功不仅在于我们遵循何种方法，例如敏捷、瀑布或螺旋模型。关键在于项目成员是否对目标达成共识。他们是否理解其他每个人在项目中的工作？如果不理解，那么项目注定失败。但在这些失败中，我们过去学到了如何演进这些方法以适应项目的需求。每一次这样的演进发生，组织的目标便得以实现，从而惠及更多人。


    所有这些与惠及更多人有什么关系呢？个体为个人目标而工作，并共同推动组织实现更大利益。无论我们是为服务公司还是产品公司工作，最终两家公司都会生产出被客户（无论是内部客户还是外部客户）使用的产品。我们的最终产品帮助这些客户，但团队在制作产品的过程中通常会遇到问题。这些问题可能从混乱到简单不等。


    ## 解决问题


    生活中或工作中的所有问题都会经历这些阶段：混乱、复杂、棘手和简单。驾驭这些阶段需要技能和风险管理。关键在于管理风险并避免不确定性。例如，假设我们正在构建一个新网站，并且有截止日期需要满足，但团队中没有可用的软件开发人员来执行此任务。解决这个问题的第一个想法可能是雇佣新的软件开发人员。但由于这很耗时，我们就会面临一个不确定性：任务可能无法按时完成。因此，为了避免这种情况，我们转而寻找能够快速且确定地完成此任务的顾问或自由职业者。

