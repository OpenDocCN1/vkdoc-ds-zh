    About the Author


    # Part IPeople


    # 1. Teams and Divisions


    When I told the CEO of the company I was working for that I would be starting
    my own company, this is what he told me: “You have hired and nurtured people,
    but you have never fired anyone. Don’t be hasty in starting up on your own, but
    you need to learn people management and understand how you can build and nurture
    a tech team.”


    Did I listen to his advice? No! Had I taken this advice, I would not have got
    a crash course in learning the art of team management by doing it. Would have
    happened over a longer period of time.


    I’m beginning this chapter with the premise that people management is not something
    that can be taught. I’ve tried to summarize my experiences of people management
    so when you are going through the same experiences, it might help you to tackle
    things in a better way. You need to learn it through firsthand experience. And
    you need to keep one thing in mind: empathy. In my case, as my team grew, the
    culture I set when the team was small spread to the new set of people as they
    were hired.


    ## Why Divide Teams?


    In older, more traditional ways of working, business requirements came in from
    multiple departments of the organization to a singular tech team. The tech team
    would make a list of these requirements and then follow sprint processes to implement
    them one by one. The teams at this time were monolithic, and teams tended to work
    sequentially. Before the agile methodology came in around 2010, to free up teams
    taking their own decisions without having to wait for the hierarchy to approve
    of it, the companies were waiting for hierarchy based approvals. This was true
    not just in tech, but in every other function of the business. Pre-agile times,
    when we expected that a certain project needed to be done in a certain number
    of days, we worked in a sequential manner, as shown in Figure [1-1](#521767_1_En_1_Chapter.xhtml#Fig1).


    ![](images/521767_1_En_1_Chapter/521767_1_En_1_Fig1_HTML.png)


    A flowchart for job execution in sequential order, in which task 1 is completed
    before task 2 is accomplished.


    Figure 1-1


    Sequential execution of tasks


    This put us in silos. We started becoming too short-sighted, and we couldn’t foresee
    roadblocks that might come at a later stage in the project. A better approach
    is to do parallel development. But how is parallel development possible?


    You can divide your teams into atomic divisions, as granularly as possible. If
    you have a big project coming up, start planning for modules for this project
    before it starts.


    Let’s look at an example of a website that lets the user create their own workflows
    and automate a bunch of repetitive tasks. We’ll call this website “Awesome automation
    platform.” Figure [1-2](#521767_1_En_1_Chapter.xhtml#Fig2) shows how the logged-in
    view of the website might look.


    ![](images/521767_1_En_1_Chapter/521767_1_En_1_Fig2_HTML.png)


    An overview of the website page of the Awesome automation platform created for
    the workflow of the company. This window displays the logged-in view of the website.


    Figure 1-2


    Wireframe of the “Awesome automation platform” website


    The best way to begin working on this post-logged-in view of the platform would
    be to first identify the mutually exclusive areas of the website (Figure [1-3](#521767_1_En_1_Chapter.xhtml#Fig3))
    and divide it into these modules:


    ![](images/521767_1_En_1_Chapter/521767_1_En_1_Fig3_HTML.png)


    The 6 mutually exclusive areas on the website shown here are profile, Apps, workflows,
    integrations, search, and dashboard.


    Figure 1-3


    Identifying mutually exclusive areas to work on


    1.  *Profile*: This includes login/logout/registration.


    2.  *Apps*: This section contains all the apps available for creating automations
    on the platform.


    3.  *Workflows*: This is the core of the platform and will be the brain fueling
    it.


    4.  *Integrations*: This is the place where different third-party integrations
    are available.


    5.  *Search*: This is an easy-to-use search bar, which is fast.


    6.  *Dashboard*: This area has graphs and analytics of current usage and also
    shows suggested workflows.


    ## Parallel Triumphs Over Sequential Work


    With the modules of the example website defined, we could come up with a team
    structure that can then kick off this project and parallelly take up the work
    (Figure [1-4](#521767_1_En_1_Chapter.xhtml#Fig4)).


    ![](images/521767_1_En_1_Chapter/521767_1_En_1_Fig4_HTML.png)


    An illustration of parallel execution of work involving 3 teams: user profile
    team, core product team and search and dashboard team. Profile team executes tasks
    like login, register, and customizations. The core team works on apps, third-party
    integrations, backend APIs, frontend workflow, or apps. The service team acts
    on graphics and analytics.


    Figure 1-4


    Parallel execution of work


    This will ensure that when the work begins, the teams will start delivering parallelly,
    instead of sequentially. Parallel development ensures autonomy for each team to
    deliver value and innovate (Figure [1-5](#521767_1_En_1_Chapter.xhtml#Fig5)).


    ![](images/521767_1_En_1_Chapter/521767_1_En_1_Fig5_HTML.png)


    A sketch has 3 teams, each with one person. The person in team 3 is taking notes.
    Others join pieces of a jigsaw puzzle. They are connected by dashed lines denoting
    execute. Teams 2 and 3 are joined by dashed curve with a circle in between. Teams
    1 and 2 are joined by a twisted ribbon-shaped curve.


    Figure 1-5


    Parallel development of tasks


    As you can see, it is important to create divisions/departments in the organization
    or the suborganization in a way that each team can execute parallely.


    ## Summary


    Teams thrive when they have an identity and a purpose. It is important to create
    and maintain a vision for each team that is formed. For example, a scrum team
    could consist of seven to eight people with developers, quality assurance analysts,
    and automation engineerers, with a possibility of a dedicated or a shared project
    manager. Not doing so will lead to losing the focus for the project and alignment
    with the company’s goals. The vision will be the key to let the team operate independently
    and execute strategies quickly and efficiently.'
