- fmt: "# Technology’s Role in Helping Business Needs\n\nTech team divisions should\
    \ be based on the business team’s needs. When a company is small and requires\
    \ fast-paced prototyping and go-to-market products, the team can be monolithic.\
    \ But as a company grows to become a mid-market-level company, the tech team needs\
    \ to undergo a shift. It needs to be split up to align with the business verticals.\
    \ And as mid-market-level companies become enterprises, a further split and macro-level\
    \ consolidation are needed. The goal is to stay attuned to processes and also\
    \ remain nimble at the same time. Tech leaders need to constantly work on the\
    \ challenges of balancing the two.\n\n## Tech Organization in Relation to Business\
    \ Units\n\nFigure [16-1](#521767_1_En_16_Chapter.xhtml#Fig1) represents a typical\
    \ organization structure around which a technical team is formed. At the start\
    \ of the organization there will likely be one business unit and one business\
    \ head, who will disseminate the information regarding new developments or new\
    \ initiatives to one technical head and a product head. When a company grows,\
    \ the number of business units (BUs) will grow, and for each BU there will be\
    \ a BU head who will work with an office of business analysts and program managers\
    \ who become the stakeholders.\n\nThe stakeholders then form a unit of their own\
    \ to understand the impact of the initiatives before passing on these initiatives\
    \ to the product owner teams. The impact analysis can follow multiple methods\
    \ or frameworks. Typically, the RICE (reach, impact, confidence, effort) framework\
    \ is followed. I’ll discuss more about this in Part V of this book.\n\nOnce the\
    \ stakeholders do the analysis and pass on the initiative document to the product\
    \ owners, the product owners then come up with their product requirement document\
    \ by assessing the different integrations that will be required to pull off the\
    \ initiative. If necessary, cross-team collaboration is done to assess impact\
    \ across teams.\n\nThen, these requirements are passed on to the tech team. The\
    \ tech structure within the tech team will be discussed in this chapter.\n\n![](images/521767_1_En_16_Chapter/521767_1_En_16_Fig1_HTML.png)\n\
    \nTwo offices of business unit 1 have 4 stakeholders. They analyze and pass on\
    \ the initiative document to product owners 1 and 2\\. They pass on to project\
    \ management teams 1 and 2 that collaborate. They pass on to Technical teams 1\
    \ and 2 that collaborate.\n\n**Figure 16-1** Business units in relation to tech\
    \ teams\n\n## Tech Team Structure\n\nFigure [16-2](#521767_1_En_16_Chapter.xhtml#Fig2)\
    \ explains how the tech team should be organized to execute each of the business\
    \ requirements.\n\n![](images/521767_1_En_16_Chapter/521767_1_En_16_Fig2_HTML.png)\n\
    \nA flowchart. The engineering manager and Architect collaborate. The manager\
    \ branches to Tech Lead 1, 2, and Quality lead 1\\. Tech lead 1 has software engineers\
    \ 1, 2, and 3\\. Tech lead 2 has software engineers 1 and 2\\. Quality lead 1\
    \ has quality assurance engineers 1 and 2.\n\n**Figure 16-2** Organization of\
    \ a tech team\n\nA tech team’s success will depend on how nimble the team is and\
    \ also how easily and autonomously the team able to execute the projects.\n\n\
    Sometimes, project managers help augment the coordination with stakeholders like\
    \ product managers, which reduces the burden on engineering managers. For simplicity’s\
    \ sake, we’re ignoring the project manager’s role here because we will get to\
    \ that in Part V.\n\n## Role of Engineering Managers and Architects\n\nThe responsibilities\
    \ of engineering managers and architects are interchangeable in many ways. Some\
    \ engineering managers might be 80 percent technical and 20 percent people managers,\
    \ while others are the other way around. Depending on how technical an engineering\
    \ manager is, they can either architect the systems themselves or get help from\
    \ an exclusive architect to architect the systems.\n\nThe responsibilities of\
    \ engineering managers and architects are as follows:\n\n*   Responsible for the\
    \ stability/growth/management of all the modules owned by the entire team\n* \
    \  Responsible for growth strategies\n*   Comes up with innovative ideas for scale\
    \ and maintenance\n*   Ensures the team follows all the coding standards/documentation\n\
    *   Leads the meetings of new business-impacting features that stakeholders come\
    \ up with\n*   Acts as the bridge between stakeholders and technical leads when\
    \ a feature’s deadline is being decided\n*   Responsible for setting up the team\
    \ structure/module structure\n\n## Role of Tech Leads\n\nThe following are the\
    \ responsibilities of the tech leads:\n\n*   Own multiple modules\n    *   Examples\
    \ of modules:\n        *   Profile management of a user\n        *   User creation\
    \ module\n        *   Upselling module\n*   Responsible for uptime/downtime\n\
    *   Responsible for speaking to DevOps and managing the infrastructure\n*   Responsible\
    \ for the security of the modules owned by the team\n*   Ensures smooth sprint\
    \ prioritization/planning/functioning\n*   Should step in when inter-team dependencies\
    \ arise\n*   Manages production escalations\n*   Responsible for approving the\
    \ appraisals of software engineers reporting to them\n\n## Responsibilities of\
    \ a Software Engineer\n\nThe following are the responsibilities of a software\
    \ engineer:\n\n*   Should be from a technical background\n*   Should be willing\
    \ to work on new technologies\n*   Should be coding language/coding technology\
    \ agnostic\n*   Should have proficiency in at least one coding language\n\n##\
    \ Responsibilities of a Quality Assurance Lead\n\nThe following are the responsibilities\
    \ of a quality assurance lead:\n\n*   Be involved in requirements gathering with\
    \ the business team\n*   Be involved in the technical discussion of the sprint\
    \ tasks with the team\n*   Estimate testing tasks along with team members\n* \
    \  Analyze requirements from a QA standpoint along with QA engineers and document\
    \ high-level scenarios\n*   Review test cases and provide feedback\n*   Perform\
    \ end-to-end testing with the respective team member for any feature going live\n\
    *   Review daily status from team members\n*   Track execution of test cases in\
    \ tools like `Zephyr`\n*   Prioritize the tasks based on go-live dates and assign\
    \ them to the team on a daily basis\n*   Help the team with data seeding for testing\n\
    *   Be involved in identifying and selecting test cases for automation from existing\
    \ test case documentation\n*   Review automation scripts implemented by team members\
    \ (`GitHub`)\n*   Review test case reports and automation script reports on a\
    \ daily basis\n*   Do one-on-ones with team members every month\n\n## Responsibilities\
    \ of a Quality Assurance Engineer\n\nThe following are the responsibilities of\
    \ a quality assurance engineer:\n\n*   Be involved in identifying and selecting\
    \ test cases for automation from existing test case documentation\n*   Apply the\
    \ designing and test automation strategy document\n*   Create an automation test\
    \ plan and get approval\n*   Configure a test environment for automation\n*  \
    \ Implement test scripts for the test cases to be automated\n*   Commit code changes\
    \ to `GitHub` and get them reviewed with leads\n*   Schedule the test scripts\
    \ in the CI/CD pipeline\n*   Generate reports of test scripts and analyze them\n\
    *   Help the team to write scripts and debug\n*   Be involved in a code review\n\
    *   Plan for improvising scripts on regular basis\n\n## Summary\n\nGetting the\
    \ technology teams set up is just one step toward execution. While the initial\
    \ projects and initiatives may go well, for sustaining the growth, it’s important\
    \ to follow the right processes. People and technology are the right ingredients\
    \ for success, and also following the right mix of teams and division of teams\
    \ and responsibilities help in this sustenance."
