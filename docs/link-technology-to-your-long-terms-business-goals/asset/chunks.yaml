    # 团队对齐与目标链接至长期战略


    在确定 OKR 之前，公司必须拥有战略。什么是战略？理解这个问题最简单的方式，就是看大卫如何击败歌利亚。大卫自然不是巨人歌利亚力量的对手，他需要一套战略来战胜他。如今，大卫与歌利亚的故事已成为弱小对抗强大的代名词。熟悉故事的人都知道，大卫是个牧羊少年，他拒绝穿戴盔甲；他仅有的武器，便是平日里用来驱赶羊群野兽的投石索。歌利亚则全副武装，手持刀剑和标枪。但大卫的战略很清晰：他不穿盔甲以减轻重量、保持敏捷，最终仅用一发投石索击中歌利亚未被盔甲保护的额头，便将其击倒。


    在我曾任职的一家公司，我们在 2020 年疫情令世界措手不及之后，立即采用了 OKR。那是一个前所未有的时代，没有任何现成剧本可供参考。一夜之间全面转向远程办公，要求各团队首先争分夺秒地打好基础。我们问自己许多问题：我们的网络连接足够稳定吗？技术团队需要高带宽来确保流畅的
    VPN 连接和远程基础设施。同时，安全始终是重中之重。当我们从两到四个办公地点突然变成成千上万个“居家办公”工作站时，如何确保数据完整性？那时，我们不再对技术团队进行微观管理、不再随意派发任务，而是帮助他们看清我们做这些事的目的是什么。例如，员工会提出这类问题：


    -   “为什么要自动化报告？”

    -   “为什么我们用 Kafka 来做队列管理？”

    -   “我们的数据迁移项目怎么样了？这些工作对业务产生了什么影响？”


    工程思维的核心是解决问题，然而我们常常发现，工程团队在稳定性、功能性、安全性、架构和代码审查方面做得很好，却忘记了要看到全局。


    让我以当时我团队的一个例子来说明。当时我们团队负责业务技术方面的工作。供应链团队和数字借贷团队是我们团队的两个关键利益相关者。这些团队确保组织对最终客户的承诺能够兑现。


    这一切发生在诸多复杂挑战的背景下，包括管理库存、履行订单、确保物流顺畅，以及确保信贷等支持性元素以有吸引力的方案提供给客户，使其能够负担产品。每个业务部门都有一套应用程序，需要一支庞大的工程师队伍来交付。


    正是在这里，我们看到了 OKR 的亮点。我们能否加强协作，减少临时性工作，并让工程团队看到其对业务的影响？


    最好的起步方式是先进行试点。我们引入了一个名为`Fitbots`的工具，它是一个集成了 OKR 的合作伙伴，提供 OKR 辅导和平台支持。辅导顾问首先向我们这些赞助人介绍了
    OKR 的概况。业务供应链负责人和我本人在将 OKR 框架介绍给我们的团队之前，必须先接受它。在我们心中确立了 OKR 的明确价值之后，我们挑选了一个由 15
    名成员组成的团队来开始推行 OKR。


    我们一起制定了第一组 OKR。


    试点团队接受了 OKR 基础知识的培训，并由 OKR 教练指导如何选择合适的 OKR。我们最初仅从工程团队中挑选人员来测试流程。


    接下来的一周，团队提出了他们的 OKR。这些 OKR 大多是从工程角度出发，缺少业务对齐的“味道”。我们的意图是让大家感受一下流程，而不是追求完美的 OKR（此外，世上本无完美的
    OKR）。


    ## 维持 OKR：设定每周节奏


    对于 OKR 实践者来说，你们都知道这意味着什么。OKR 大量借鉴了敏捷方法，它们需要一种节奏。每周为你的 OKR 检查会议投入 30 分钟，就能让你的 OKR
    推广取得成功。


    每周在同一天、同一时间，团队向彼此汇报他们在成果指标上的进展。在会议中，风险过大的 KR 开始浮出水面，同时，将我们这些赞助人标记出来，也促使我们肩负起尽早清除障碍的责任。


    凭借检查会议“周而复始”的特性，在 90 天后，我们得出结论：业务团队需要参与到 OKR 的重启过程中。这包括为接下来的 90 天重置（字面意义上的重置 OKR
    或优先级）。这次，我们以业务和技术团队组成的“小组”形式进行。


    随着团队不断实践检查会议，他们开始变得更高效，会议时间也可以从 30 分钟缩短到 15 分钟。


    ## 总结


    OKR 最大的好处，在于你能将日常工作与团队的战略目标联系起来。OKR 通过将目标与促成目标的关键结果相连接，已经实现了这一点。为了最大限度地发挥 OKR
    的作用，请更进一步：使用一个能将你的日常工作、常规项目与公司和业务目标相连接的 OKR 工具。


    # 确保战略的执行


    当你在战略规划会议上花更多时间创建针对所有业务问题的解决方案时，找到一个能帮助你执行这些战略的平台就变得至关重要。OKR 工具可以促进此类战略的顺利执行，因为通过定期检查和回顾过去的目标，团队和领导层的目标得到了一致对齐。

