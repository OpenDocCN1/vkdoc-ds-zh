  trans: "\n# 17. 技术栈\n\n本章介绍一种用于创建网站和应用程序的技术栈。这只是一个当前示例，因为大多数技术栈都在不断变化。在高速增长中，最重要的是你能以多快的速度更新技术栈，以跟上最新的技术趋势。本章将介绍当前正在使用的工具和技术。\n\
    \n## 前端栈\n\n选择一个不局限于前端或后端的技术栈非常重要。`JavaScript` 已被证明是一种能融合这两个世界的技术。只要开发者精通 `JavaScript`，我们就不再需要将他们视为前端或后端开发者了。\n\
    \n此外，`HTML`、`CSS` 和 `Bootstrap` 在前端扮演着关键角色。我们将简要介绍前端和后端技术，只是为了让您理解这些技术在创业时意味着什么，而了解您将构建的是网站还是应用程序则至关重要。\n\
    \n### 什么是 HTML？\n\n超文本标记语言（HTML）不是一种编程语言。它是一种*标记语言*，用于告诉网络浏览器如何构建您访问的网页。`HTML`\
    \ 由一系列元素组成，您可以使用这些元素来*包裹*、*封装*或*标记*不同部分的内容，使它们以特定方式显示或运作。\n\n#### HTML 中的“头部”或元数据（Metadata）是什么？\n\
    \n`HTML` 文档的头部是页面加载时*不*在网页浏览器中显示的部分。它包含诸如页面标题、到 `CSS` 的链接（如果您想用 `CSS` 设计 HTML\
    \ 内容的样式）、自定义网站图标链接以及元数据（关于 HTML 的数据，例如作者和描述文档的重要关键字）等信息。\n\n#### HTML 的元素有哪些？\n\
    \n使用 `HTML` 文本内容元素来组织位于开头的 `<body>` 和结束的 `</body>` 标签之间的内容块或区域。这些元素对于可访问性和 SEO\
    \ 很重要，它们标识了该内容的目的或结构。\n\n*   `<h1>`、`<h2>`、`<h3>`、`<h4>`、`<h5>`、`<h6>`：`HTML`\
    \ 的 `<h1>`–`<h6>` 元素代表六个级别的章节标题。`<h1>` 是最高级别，`<h6>` 是最低级别。\n*   `<div>`：`HTML`\
    \ 内容分区元素（`<div>`）是流式内容的通用容器。在使用 `CSS` 设置样式之前，它对内容或布局没有影响。\n*   `<p>`：`HTML` 的\
    \ `<p>` 元素代表一个段落。\n*   `<li>`：`HTML` 的 `<li>` 元素用于表示列表中的一项。\n*   `<ol>`：`HTML`\
    \ 的 `<ol>` 元素表示有序列表项——通常呈现为编号列表。\n*   `<ul>`：`HTML` 的 `<ul>` 元素表示无序列表项，通常呈现为带项目符号的列表。\n\
    \n### CSS 属性\n\n层叠样式表（CSS）是一种标准样式表语言，用于描述网页的呈现（即布局和格式）。\n\n*   在 CSS 出现之前，`HTML`\
    \ 文档的几乎所有呈现属性都包含在 `HTML` 标记中（特别是在 `HTML` 标签内）；所有字体颜色、背景样式、元素对齐、边框和大小都必须显式地在 `HTML`\
    \ 中描述。\n*   CSS 既可以作为单独的文件附加，也可以嵌入到 `HTML` 文档本身中。在 `HTML` 文档中包含 CSS 有三种方法。\n \
    \   *   *内联样式*：在 `HTML` 开始标签中使用 `style` 属性\n    *   *嵌入样式*：在文档 head 部分使用 `<style>`\
    \ 元素\n    *   *外部样式表*：使用 `<link>` 元素，指向一个外部的 `CSS` 文件\n\n#### 什么是盒模型？\n\n可以在网页上显示的每个元素都由一个或多个矩形框组成。CSS\
    \ *盒模型* 通常描述了这些矩形框在网页上的布局方式。这些框可以具有不同的属性，并且可以以不同的方式相互交互，但每个框都有一个内容区域和可选的周围内边距、边框和外边距区域。图\
    \ 17-1 展示了如何使用 CSS 盒模型居中内容。\n\n![](img/521767_1_En_17_Fig1_HTML.png)\n\n一个草图显示了\
    \ 3 个同心框和一个虚线框。从上到下，标签依次为上外边距、上边框、上内边距、左内边距、左边框、左外边距、右外边距、右边框、右内边距、下内边距、下边框和下外边距。\n\
    \n图 17-1\n\nCSS 中的盒模型\n\n### 什么是 Bootstrap？\n\n`Bootstrap` 可以轻松快速设计和自定义响应式移动优先的网站。它是世界上最流行的前端开源工具包，具有\
    \ `Sass` 变量和 mixins、响应式网格系统、大量预构建组件和强大的 `JavaScript` 插件。\n\n`Bootstrap` 的网格系统使用一系列容器、行和列来布局和对齐内容。它使用\
    \ flexbox 构建，并且完全响应式。图 17-2 是一个示例，深入展示了网格是如何组合在一起的。\n\n![](img/521767_1_En_17_Fig2_HTML.png)\n\
    \n排列成 7 行的框。第 1 行有 12 个列 1 的框。第 2 行有 4 个列 3 的框。第 3 行有 3 个列 4 的框。第 4 行有列 8 和 4\
    \ 个框。第 5 行有 2 个列 2 的框，1 个列 4 的框和 2 个列 2 的框。第 6 行有 2 个列 6 的框。第 7 行有 1 个列 12 的框。\n\
    \n图 17-2\n\nBootstrap 中的列结构\n\n#### 为什么要使用 Bootstrap？\n\n`Bootstrap` 是用于创建布局的最流行的框架，`Bootstrap`\
    \ 的响应式 CSS 可以自动适应手机、平板电脑和台式机。它易于设置，并且可以在不到一小时内创建一个可用的布局。\n\n它为大多数 `HTML` 元素提供了基础样式，例如：\n\
    \n*   排版\n*   代码\n*   表格\n*   表单\n*   按钮\n*   图片\n*   图标\n\n它还拥有广泛的组件列表，例如：\n\n\
    *   下拉菜单\n*   按钮组\n*   导航栏\n*   面包屑导航\n*   标签和徽章\n*   警告框\n*   进度条\n*   以及许多其他组件\n\
    \n它附带了捆绑的 `JavaScript` 插件，例如：\n\n*   滑块\n*   标签页\n*   手风琴\n\n### 为什么要使用 JavaScript？\n\
    \n您可以使用 `JavaScript` 构建交互式网页、桌面应用程序、Web 应用程序和移动应用程序。您可以在浏览器或 `Node` 中运行 `JavaScript`。\n\
    \n### 什么是 React.js？\n\n`React.js` 是由 Facebook 创建的一个 `JavaScript` 库，用于构建基于组件并可动态更新的用户界面，其更新取决于应用程序的状态。\n\
    \n#### ECMAScript\n\n`ECMAScript` 是由 Ecma 国际标准化的一种语言。`JavaScript` 仅仅是标准化语言 `ECMAScript`\
    \ 的一种实现。`ECMAScript 5`（ES5）于 2009 年标准化，大多数现代浏览器都能处理它。`ECMAScript 6`（ES6）则是在较近的\
    \ 2015 年标准化的。因此，浏览器尚未完全跟上以处理它。\n\n要使用 `React` 编写代码，您需要 `ES6` 的最新特性。\n\n`Babel`\
    \ 是一个 `JavaScript` 预处理器。简而言之，`Babel` 将 `ES6` 代码转换为 `ES5`，以便浏览器能够处理它。\n\n使用 `React`，您可以通过为应用程序中的每个状态（如主页、登录页面等）创建视图，并根据状态动态切换视图的显示和隐藏，来创建单页应用程序。\n\
    \n由于应用程序在开始时只需要加载一个页面，因此在 `React` Web 应用程序中导航不同的视图非常快速，并且无需加载页面。\n"
- fmt: '# Backend Technology


    JavaScript in today’s world plays a key role in bringing the front-end/backend
    divide closer. Having to learn two different stacks is no longer a need if the
    company is using the JavaScript stack for the backend as well.


    `Node.js` is a JavaScript runtime built on Chrome’s V8 JavaScript engine. It was
    created by Ryan Dahl in 2009 and is an open source project. `Node.js` runs on
    `V8` (which is a wrapper around Chrome’s V8 engine). `V8` is an open source JavaScript
    engine developed by Google, which is browser independent. It’s a lightweight,
    asynchronous system and runs on a single-threaded nonblocking architecture. `Node.js`
    has a very large community that offers support and helper packages (`NPM`). `Node.js`
    contains APIs/modules that help to write JavaScript code that can run outside
    of a web browser.


    `Node.js` is a platform that allows you to build scalable network applications
    using JavaScript on the server side. It has the following characteristics:


    * *JavaScript runtime*: This executes the JavaScript code at runtime.

    * *Server side*: This runs and performs I/O tasks on a server that help process
    the client requests.

    * *Event Driven*: The flow of the execution is determined by events, e.g., button
    click, mouse hover, etc.

    * *Asynchronous*: Two or more events can occur simultaneously and are not coordinated
    with each other.


    ## What Is ExpressJS?


    `Express.js`, or simply Express, is a back-end web application framework for `Node.js`.
    It was released as free and open source software under the MIT License. It is
    designed for building web applications and APIs.


    `Express.js` is based on the `Node.js` middleware module called `connect`, which
    in turn uses the `http` module. So, any middleware that is based on `connect`
    will also work with `Express.js`.


    ## What Is REST?


    REST stands for REpresentational State Transfer. In simpler terms, it is an application
    program interface (API) that makes use of the HTTP requests to GET, PUT, POST,
    and DELETE the data over the Web. The main functions used in any REST-based architecture
    are as follows:


    * *GET*: Provides read-only access to a resource

    * *PUT*: Creates a new resource

    * *DELETE*: Removes a resource

    * *POST*: Updates an existing resource or creates a new resource


    # Databases


    We will look at the key aspects of two databases, MongoDB and Postgres SQL. In
    summary, the main differences between MongoDB and PostgreSQL have to do with their
    systems, architecture, and syntax. MongoDB is a document database, while Postgres
    is a relational database management system. MongoDB has a distributed architecture,
    while PostgreSQL has a monolithic architecture. MongoDB uses BSON, while Postgres
    uses SQL.


    ## MongoDB


    MongoDB is built on a distributed, scale-out architecture and has become a comprehensive
    cloud-based platform for managing and delivering data to applications. MongoDB
    handles transactional, operational, and analytical workloads at scale. If your
    concerns are time to market, developer productivity, supporting DevOps and agile
    methodologies, and building stuff that scales without operational gymnastics,
    MongoDB is the way to go.


    It has the following characteristics:


    * Schemaless database

    * Structure of a single object is well defined

    * Data stored as JSON document

    * Indexing supports


    ## Postgres SQL


    PostgreSQL is a rock-solid, open source, enterprise-grade SQL database that has
    been expanding its capabilities for 30 years. Everything you would ever want from
    a relational database is present in PostgreSQL, which relies on a scale-up architecture.
    If your concerns are compatibility, serving up thousands of queries from hundreds
    of tables, taking advantage of existing SQL skills, and pushing SQL to the limit,
    PostgreSQL will do an awesome job.


    It has the following characteristics:


    * It is a traditional relational database management system (RDBMS).

    * It is a SQL database like Oracle or MySQL.

    * Postgres is free.


    For those who already have a rudimentary understanding of JavaScript, MongoDB
    has a shorter learning curve, whereas those who have a lot of experience in SQL
    databases may find it easier to adjust to Postgres. Both are growing in popularity
    as comprehensive database solutions for a variety of industries. However, the
    biggest issues that companies have while processing data from either database
    are the time and complexity involved.


    ## Summary


    You should choose the language or framework for your tech stack according to your
    situation, the people involved, and their strengths and weaknesses. The ability
    to get support for the tools you choose in the long term is also important.


    # Key Processes and Rituals of Technology Teams


    Software engineering is the wrong name for programming. Software engineering is
    plain automating, whereas programming is an art. Whatever we code evolves. The
    goal is to first make it work and then evolve it by changing it or refactoring
    it.


    For me, the main driving forces behind a successful organization or an individual
    are the following:


    * Communication

    * Problem solving

    * Innovation

    * Change management


    Each agile process should include these key drivers. We’ll discuss the importance
    of these drivers before we get into the agile rituals.


    Agile processes break each project into chunks that are manageable by smaller
    and distributed teams.


    ## Communication


    The success of a project is not only about what methods we follow, such as agile
    or waterfall or spiral. It’s all about whether the members working on the project
    are on the same page. Do they understand what every other person is doing with
    regard to the project? If not, then the project is bound to fail. But in these
    failures we’ve learnt in the past to evolve these methods and suit to the need
    of the project. Each time this evolution happens, the organization’s objectives
    are met thereby driving greater good.


    What does all this have to do with greater good? Individuals work for their personal
    goals and collectively drive the organization for the greater good. Whether we
    work for a service company or a product company, in the end both companies produce
    products that are used by customers, be it internal or external customers. Our
    end products help these customers, but teams usually face problems while making
    the product. And these problems can range from chaotic to simple ones.


    ## Problem Solving


    All problems in life or at work go through these phases such as chaotic, complex,
    complicated, and simple. Navigating through these phases needs skill and risk
    management. The key is to manage the risks and avoid the uncertainties. For example,
    lets say that we are building a new website and we have a deadline to meet but
    there is no software developers available within the team to do this. The first
    thought that would come to us to solve this problem would be to hire new software
    developers. But because that is time consuming, we run into an uncertainty that
    it will not be done. So to avoid it, we then look up consultants or freelancers
    who can do this quickly and surely.'
