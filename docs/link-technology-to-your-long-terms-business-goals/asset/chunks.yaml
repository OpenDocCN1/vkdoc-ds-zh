- fmt: '# SLA for Bug Reports


    A service level agreement (SLA) is an agreement between two different companies,
    a company and a consultant, and also within the company, such as between two departments.
    In this context, the SLA would encompass the obligation of the security team to
    respond to bug reports about the company’s infrastructure coming in through any
    of the channels, be it emails, social media, phone, etc. The following walks you
    through the bug report process:


    1. Reply to email once a day for all the emails received. (Have a threshold of
    less than 20 unread emails in a day for the bugs received. If the number of emails
    is more than 20 for 3 days continuously then that is a cause for concern. It means
    we have reached the threshold and we have to act on the bug report emails diligently
    by figuring out if there is a systemwide breach that is causing it. The threshold
    can be different for companies of different sizes.)


    2. A designated person on the cloud-native security team (CNST) should create
    a finding on the internal security management system with all the information
    mentioned after receiving the email and forwarded it to the security vendor or
    an internal security specialist.


    3. If there’s a security vendor, then the vendor or specialist will verify whether
    a bug is valid within the next working day of the finding being raised.


    4. If valid, the CNST-designated person raises a bug/issue with the development
    team with the priority and severity as indicated by the specialist within four
    to eight hours of validation. The timeframe changes from company to company. But
    a highly severe bug has the potential to create a bad reputation for the business,
    so the sooner they are addressed, the better it is for the business.


    5. If invalid, an apt response should be sent to the bug reporter as provided
    by the specialist. Use a standard template.


    6. Once the bug is fixed, the development teams provide an update on the bug depending
    upon its severity.


    ## Security Audits


    An IT security audit is a comprehensive assessment of an organization’s security
    posture and IT infrastructure. Conducting an IT security audit helps organizations
    find and assess the vulnerabilities existing within their IT networks, connected
    devices, and applications. It gives you the opportunity to fix security loopholes
    and achieve compliance.


    This includes things such as vulnerability scans to find security loopholes in
    the IT systems or penetration tests to gain unauthorized access to the systems,
    applications, and networks. Finally, the penetration testing reports generated
    after performing all the necessary procedures are then submitted to the organization
    for further analysis and action. An IT security audit also comprises the physical
    part, in which the auditor verifies physical hardware access for security and
    other administrative issues. However, this section covers only the nonphysical
    part of an IT security audit.


    ### Benefits of IT Security Audit


    An IT security audit reveals the underlying vulnerabilities and security risks
    in an organization’s IT assets. Identifying risks, however, has a positive rippling
    effect on the organization’s overall security. How? The following are the answers:


    - Weighs your current security structure and protocols and helps you define a
    standard for your organization with the audit results

    - Mitigates hacker risks by discovering potential hacker entry points and security
    flaws well in advance

    - Verifies how compliant your IT infrastructure is with top regulatory bodies
    and helps you achieve compliance

    - Finds lag in your organization’s security training and awareness and helps you
    make informed decisions toward its betterment


    ### Requested Evidences and Correlation


    The auditors will request evidence related to security, infrastructure, and business
    continuity. Generally, depending on the type of audit, the audit period can last
    between a week to a month. Types of audit could be IT general security audit,
    International Organization for Standardization (ISO) and so on.


    ### Key Documents and Evidence That Will Be Requested


    The following are key documents you will need to provide to auditors:


    - HR-related documents that include candidates who joined, were terminated, and
    exited the organization during the audit period

    - Asset inventory

    - All the policy-related documents

    - AV-related evidence, backup, and CloudWatch alerts

    - Vulnerability Assessment and Penetration Testing (VAPT) reports

    - Access control of the database and production environment

    - Firewall and config review evidence


    ## Summary


    When properly implemented, robust data security strategies will protect an organization’s
    information assets against cybercriminal activities, but they also guard against
    insider threats and human error, which remain among the leading causes of data
    breaches today. Data security involves deploying tools and technologies that enhance
    the organization’s visibility into where its critical data resides and how it
    is used. Ideally, these tools should be able to apply protections such as encryption,
    data masking, and redaction of sensitive files, and should automate reporting
    to streamline audits and adhere to regulatory requirements.


    # 21. Why Do Businesses Fail?


    Typical reasons for business failures through history are wars, recessions, high
    taxation, high interest rates, excessive regulations, poor management decisions,
    insufficient marketing, inability to compete with other similar businesses, or
    a lack of interest from the public in the business’s offerings.


    But there could be reasons intrinsic to the business itself that lead to business
    failures. In this chapter, we will look at process-related issues that can lead
    to business failure and how to avoid them by building robust processes that are
    self-healing and self-correcting to help businesses thrive.'
