- fmt: '### Setting Objectives


    The first step in the process of management by exception is to set realistic targets
    to use as a benchmark. Key areas might include sales, production, and expenses.
    Unfortunately, you can’t just say “I want to sell a million dollars’ worth of
    product this month.” If you run a small business, the goal could be unreachable.
    If the business is large, you could be underestimating its potential.


    Businesses usually look at records to determine the correct norms. If you want
    to build in a small percentage of growth, go ahead, but be realistic. Budgets
    present a great starting point. After all, if you have set limits on costs and
    targets for turnover and profits, you can use them to monitor progress.


    But you don’t want to react too late. Even a month of deviations could cost you
    dearly if you pick up the deviation only at the month’s end. Consider splitting
    up targets and monitoring into smaller chunks that will allow management to be
    responsive.


    Now that you have targets, you can start defining what constitutes a deviation.
    For example, 0.1 percent more or less than your target shouldn’t be a trainwreck,
    so what constitutes a deviation that calls for management action?


    In complex businesses, statistical control charts are drawn up to determine the
    effect of deviations, but if your business is a relatively simple one, commonsense
    and a bit of number crunching should give you the answers.


    ### Assessing Performance


    Before you can assess performance, you need accurate, real-time performance records.
    What data will you collect? How will you collect it? How often will you assess
    it? The first two of these questions depend on you and your business, but the
    final one has a general answer: the more frequently you can assess performance
    data, the faster you’ll pick up deviations, investigate them, and address them.


    Since gathering a great deal of data manually can take even more time than management
    by exception is meant to save, automated record keeping and analysis is best.
    Thus, software that monitors, reports on, and analyzes workflows, as well as accounting
    software that produces financial analytics, are examples of software that you
    will find useful.


    ### Analyzing Your Deviations


    You will seldom get results that match your targets down to the last detail. However,
    there’s no point in investigating insignificant deviations, so the analysis is
    based on significance. When analyzing your reports, you will reach one of two
    conclusions.


    - *There was no significant deviation*: In that case, there’s no need for further
    action.

    - *One or more deviations are significant*: If you reach this conclusion, it’s
    time to take action. If the data is analyzed by an employee or a junior manager,
    they must know who will take the required action and what to report to their superiors.


    If you are handling a deviation, the first step is to see why it happened. It
    could simply be a mistake in the data. Alternatively, there could be a very good
    reason for the deviation. For instance, if you’re selling ice cream, a chilly
    day will cause your sales to plummet. Deviations can also be a good thing. Perhaps
    your staff is trying a more efficient process, or there has been a significant
    saving on an expected cost.


    ### Resolving Exceptions


    Now that you know what performance criteria have not been met or have been exceeded
    and why it happened, it’s up to you as a manager to decide what corrective action
    to take. In addition, you need to decide whether the exception is likely to recur
    and whether it impacts other targets. The changeable nature of the business environment,
    both internal and external, means that you will need to keep revisiting and revising
    your benchmarks.


    Let’s say business expenses have risen by 3 percent. Do you need to revise your
    sales targets? Would it be realistic to do so? Are there areas where you could
    be saving costs to mitigate the effects of increased prices? How will these changes
    affect your benchmarks?


    Advantages of management by expectation lead to the following:


    - *Best use of management time*: The most obvious advantage of management by exception
    is the way it impacts how managers use their time. Why monitor, analyze, and micromanage
    things that are going smoothly? When things are going well, employees can make
    their own decisions, leaving managers free to focus on decision-making that’s
    related to problem areas.

    - *Rapid response*: If your monitoring systems are responsive and up-to-date,
    management by exception spots any problems in good time. If automated systems
    alert you to problems immediately, all the better. Then there isn’t time for the
    deviation to have a compounded effect.

    - *Motivates staff to perform*: Most people like being able to get on with their
    work with minimal management intervention. It allows them to make decisions, try
    new things that produce better outcomes, and “own” their task areas.


    ## Summary


    Exceptions are OK if they do not lead to irreversible consequences that could
    be bad for the business. When the server goes down, we scramble to get it up and
    running, and we sometimes take exceptional routes to avoid long downtimes. But
    making exception as a means to drive all requirements in a business should be
    avoided. As the business grows, making well planned and objective driven decisions
    becomes more important than hasty exceptional decisions for quick turnarounds.


    # 23. Processes as a Speed Booster, Not a Speed Breaker


    Optimizing your processes is key to achieving your business goals, and that’s
    where business process management comes in.


    ## What Is Business Process Management?


    ![](images/521767_1_En_23_Chapter/521767_1_En_23_Fig1_HTML.png)


    A sketch of 4 people. The first writes over a a graph in a presentation and the
    next watches it. Two other people are discussing over connected dots. One of them
    holds a writing pad.


    **Figure 23-1** Figure illustrating various parts of Business process management


    Business process management (BPM) is a discipline, or practice, through which
    companies can improve their processes. Rather than taking things for granted,
    you analyze, measure, and monitor current processes. From there, optimization
    starts. This could be through streamlining existing processes, outsourcing certain
    business activities, or automating repetitive subprocesses.


    ### How Can Process Mapping Help?


    Without efficient processes you become inefficient, ordinary, and uncompetitive.
    With effective processes, you can replicate your successes over and over again.
    Process mapping is often done through flowcharts, and it details every step from
    start to completion. It’s a great way to spot bottlenecks or other problems in
    existing processes, as well as set up new processes. But to make a start with
    process mapping, you need to understand what processes your business already has
    and what it needs.


    ## Areas for Process Improvement


    There are a number of core processes that every business needs, and each one can
    be honed to make you the best in your field. We’ve compiled a list for you so
    that you can compare your current operating procedures against ours in the following
    sections and see where you may need to redesign, streamline, and optimize your
    own. In addition, there are sample template processes for the majority of the
    list. This can help with standardization and makes process mapping much quicker.
    These processes have been designed to provide a starting point from which you
    can tailor them to suit your business.'
