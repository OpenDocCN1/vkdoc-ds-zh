- fmt: '### Customer Success


    The following section explains how we can ensure customer is satisfied with the
    product or services offered by our business. The 3 key points that defines the
    customer’s success metrics are Customer onboarding, Account management and Offboarding.


    - **Customer onboarding**: Create the best impression with your new customer with
    a solid onboarding process. Set expectations and demonstrate that they made the
    right decision in engaging your company. Have a clear set of activities in mind—that
    could be an introductory phone call with a follow-up email, for instance—and ensure
    all your team members know what’s expected of them. We’d argue that this is in
    the top three of processes that every business needs.

    - **Account management**: This process defines how you communicate with your customers
    on an ongoing basis. Arranging regular checkpoints allows you to investigate opportunities
    for upselling or extending the service you provide. Your information technology
    should be set up to help here, providing you with up-to-date customer information
    to personalize your outreach.

    - **Customer offboarding**: Although unwelcome, you can ensure your customer receives
    the best experience when you stop working with them. The smoothness with which
    this happens can make the difference between a future referral and making your
    company one to avoid. Again, make sure your information systems are up-to-date
    so you can personalize this—and gather relevant information to decrease the chances
    of it with future customers.


    ### Finance


    ![](images/521767_1_En_23_Chapter/521767_1_En_23_Fig2_HTML.png)


    Sketch of two men shaking hands with a dollar symbol in the background. There
    is a writing pad with a checklist, graphs, and dollar signs on the side.


    **Figure 23-2** Figure illustrating a Financial deal


    Finance processes are the backbone of every company. Aside from enabling you to
    keep the rest of your business running, they are required to comply with the regulations
    in your country. Businesses have to complete tax declarations and file end-of-year
    accounts, and comprehensive processes for these activities means that you reduce
    the risk of noncompliance.


    - **Budgets**: How you calculate and monitor your company’s budget is of the utmost
    importance. A process to ensure that expenditure is kept in line and that the
    budget is being tracked over the financial year will reassure you that your business
    is operating within its means.

    - **End-of-year accounts and annual returns**: This process describes how to compile
    the end-of-financial year accounts and annual returns. Although the exact procedure
    will vary from country to country, a robust process will ensure that information
    is submitted accurately and on time.

    - **Payroll**: Setting up a process for running the payroll, whether it’s monthly,
    twice a week, or even weekly will mean that nothing is forgotten. Ensure that
    all relevant additions and deductions are made and that any unique circumstances
    are taken into account.

    - **Taxation**: This process relates to the country’s taxation laws. Businesses
    benefit from reductions in tax, so a process for preparing and submitting paperwork
    will mean you recoup the money owed to you.


    ### Human Resources


    Your business wouldn’t be able to run without its most important asset: its employees.
    Keeping your staff safe and happy should be one of your company’s top priorities.
    It’s not just about improving their workflows; it’s about the experience in the
    company as a whole. That’s why it’s no surprise that this section includes the
    largest number of processes every business needs. Note that although the following
    templates are largely tailored to UK employment law, the principles will apply
    more widely.


    - **Disciplinary and grievance**: There are four main processes relating to the
    disciplinary and grievance procedures: responding to a formal grievance, disciplinary
    investigation, disciplinary hearing, and disciplinary appeal. There are multiple
    decision points in these processes, and it’s important to have clear expectations
    at every point. Although these processes are (ideally) likely to be used infrequently,
    it’s important that you comply with the employment law when they are needed. Any
    business process modeling you do needs to take this into account.

    - **Employee leave**: As well as a clear process for how employees request holidays
    and notify employers of the need for sick leave, there is also parental leave
    to consider. Having processes in place for when employees request maternity or
    paternity leave will help manage the transition period. State-of-the-art software
    can make this easier—for instance, by automatically checking requested dates against
    a global calendar and informing HR of how many staff members are away.

    - **Employee onboarding**: Businesses often underestimate how important their
    employee onboarding process is to the retention and ongoing success of their staff.
    A comprehensive onboarding process will reassure employees they’ve joined a company
    that cares about supporting its staff.

    - **Employee offboarding**: Similar to how a customer offboarding process can
    encourage positive reviews and referrals, a smooth employee offboarding process
    will make sure nothing is forgotten and will leave your former team members with
    a good impression of your company.

    - **Flexible working request**: A request from an employee for regular flexible
    or remote working is a right for certain employees. Human resources are responsible
    for handling their requests in the correct way. This may be an ongoing process,
    as you may make it reliant on fulfilling certain metrics, so it’s important not
    to treat this as a one-off event.

    - **Performance and appraisal**: Transparent processes for performance reviews
    and appraisals help your employees understand what they need to be successful
    in their role. Letting them know what metrics are being monitored and what their
    managers are documenting can help them respond appropriately. In addition, effective
    processes should clarify what constitutes performance that needs to be improved
    upon.

    - **Recruitment**: Recruitment is the main HR process that interacts with people
    who are not yet employed members of staff. As such, it’s even more important to
    have a process that ensures fairness and transparency when it comes to decision-making.
    If candidates are aware of the process up front, they will be more likely to have
    a positive experience with your recruitment team.

    - **Redundancy**: While every business hopes to never have to use a redundancy
    process, if it is needed, it’s one that has strict rules around how it is enacted.
    Depending on the employment law in the country in which you operate, redundancies
    may be subject to a number of reviews and may involve external parties to help
    ensure it is compliant.'
