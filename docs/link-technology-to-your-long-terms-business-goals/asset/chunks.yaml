    Figure 11-2


    Biweekly leadership meeting questions


    ![](images/521767_1_En_11_Chapter/521767_1_En_11_Fig1_HTML.png)


    Some weekly POD check-in questions enclosed in a box include where are we with
    each team''s OKR?, Which initiatives impact the OKRs the most? What must be done
