- fmt: "# Defining OKRs\n\nThe following steps show how you can change the thought\
    \ process of the team to start using OKRs:\n\n1. Every OKR rollout must have a\
    \ sponsor. The sponsor is usually the CEO or the head of the function, depending\
    \ upon at which level you introduce OKRs. Some organizations like to do full-scale\
    \ organization-wide rollouts, with the rest of the OKRs for select business groups\
    \ or functions. The sponsor must make OKRs a conversation in leadership meetings,\
    \ townhalls, and reviews. The sponsor must participate in setting the OKRs as\
    \ they are the most important growth metrics.\n\n2. Using OKRs is about bringing\
    \ in consistency. Teams that are using OKRs must understand what they are, how\
    \ OKRs are different from individual performance practices, and how the team writes\
    \ and tracks OKRs. Teaching the fundamentals of OKRs can be done by internal coaches\
    \ or external OKR coaches who are certified and trained on how to enable teams.\n\
    \n3. The sponsor and their team must be involved in setting the North Star OKRs\
    \ for the rest of the teams to align with. If departments are using OKRs, then\
    \ the department heads, leaders, and next-level team leads set the North Star\
    \ OKRs. Remember in OKRs, less is always more. So, define no more than three objectives\
    \ and three to five key results each.\n\n4. The cross-functional team members\
    \ come together to move the needle on the North Star metrics.\n\nThese four steps\
    \ will enable teams to collaborate effectively to achieve the objectives of the\
    \ organization.\n\nFor example, let’s say your North Star metric is to reduce\
    \ dropout rates of a prospect exploring your website. Why? The intent, of course,\
    \ is to have as many prospects as possible to select a plan and click Get Started\
    \ or to contact your sales teams to start the onboarding process. We all know\
    \ how important this is for revenue generation.\n\nBut the business team can’t\
    \ do this alone; it needs to collaborate with the technology team. Let’s give\
    \ this cross-functional team a fancy name: the growth warriors.\n\n## Growth Warriors\n\
    \nThe growth warriors have representation from the sales, marketing, product,\
    \ and engineering departments. They need to solve a focused problem, which is\
    \ “How do you reduce dropout rates from 70 percent to 40 percent in the next 90\
    \ days?”\n\nThe growth warriors start by listing the existing challenges, which\
    \ come in the way of achieving OKRs. Here are some examples:\n\n- “We have no\
    \ clear way of knowing who is visiting our website.”\n- “The content or its placement\
    \ is not engaging enough.”\n- “We are not tracking the response time to those\
    \ who place queries in the chat window.”\n- “We do not have enough bandwidth,\
    \ and there seems to be just too many requests coming to the tech teams.”\n\n\
    The warriors set their objective statement after much deliberation:\n\n*Deliver\
    \ a kick-ass experience to prospects on our website to reduce dropout rates.*\n\
    \nThe clear business value is to reduce dropout rates. The next step then is how\
    \ to measure this. That’s where the following four key results (KRs) come in.\
    \ They are the metrics that help determine if the inspirational objective has\
    \ been met.\n\n- *KR 1*: Reduce response rates to prospect queries from two days\
    \ to ten minutes.\n- *KR 2*: Increase the average time spent on the website from\
    \ one minute to three minutes.\n- *KR 3*: Reduce page load time from three seconds\
    \ to one second.\n- *KR 4*: Reduce dropout rates from 70 percent to 40 percent.\n\
    \nEach team is aligned as an owner to a specific KR and starts their work. No\
    \ matter what the team does, the goal is to ensure customer satisfaction by working\
    \ on these four KRs. Each team member focusing on their objective through the\
    \ KR will ensure that the objectives are driven in a customer-centric manner.\n\
    \n## OKR Grooming\n\nIf you ask a Google employee, or Googler, about OKRs, you\
    \ will often get the response that “it’s how we do business here.” That’s how\
    \ ingrained it is in Google’s culture.\n\nOKRs require conditioning teams to accept\
    \ managing by outcomes rather than managing by activities. Oh sure, activities\
    \ are important, but ticking off feature builds, calling prospects, and meeting\
    \ a partner will not move the business forward. These are the inputs, but the\
    \ goal is to move on the outcome metrics. This is similar to growth warriors measuring\
    \ reduction in turnaround time or making a prospect stay longer in their digital\
    \ store.\n\nTeams need to understand that OKRs require selecting the right metric\
    \ and not the easy-to-achieve metric. This mindset requires one to stretch their\
    \ abilities.\n\nOKRs require a cross-functional collaborative mindset. The teams\
    \ write the OKRs together and not in isolation or water-tight departmentalized\
    \ structures, which plague many companies even today.\n\nGrooming is also for\
    \ leadership team members. The command-and-control style of management is a deal-breaker\
    \ in introducing OKRs. Here you are asking our teams to select metrics that can\
    \ impact the business. The directive style should be replaced by a coach-led exploratory\
    \ style, which encourages teams to select OKRs and experiment.\n\nUltimately,\
    \ what you expect out of OKRs as an exercise each quarter is the outcome. The\
