    \ 11-2**  \n双周领导层会议问题\n\n![](img/521767_1_En_11_Fig1_HTML.png)\n\n一个方框内包含的某些每周小组签到问题包括：我们每个团队的\
    \ OKR 进展如何？哪些举措对 OKR 影响最大？为了推进 OKR，下周必须完成什么？是否存在任何障碍或有风险的 KR？实现 OKR 的信心水平如何？处于正常还是偏离轨道状态？\n\
    \n**图 11-1**  \n每周小组签到问题\n\n## 总结\n\nOKR 平台有助于简化跨团队对齐的复杂性，并向相关利益相关者实时提供项目/目标状态更新。小组和领导层的每周签到可以帮助员工了解整体进度，并找出在实现公司业务目标过程中的任何差距/障碍。\n\
    \n# 作为持续流程的 OKR\n\n一旦您的组织采用了 OKR 框架，为了组织的成长，在特定时间范围内完成 OKR 就变得至关重要。由于 OKR 流程涉及众多利益相关者，因此推动该流程跨不同团队运行的任务由\
    \ OKR *推动者* 负责。OKR 不仅仅是设定目标，它们更关乎 *拓展性目标* 的设定。通过发掘隐藏的优势并带来新的机遇，拓展性目标为承诺、努力和表现水平提供了新的维度。\n\
    \n## 推动者\n\n当团队采用 OKR 后，它就不再仅仅是一个框架，而是更深入地融入“我们作为团队或企业如何运作”之中。事实上，它成为了组织文化的一部分。这就是\
    \ OKR 推动者发挥作用的地方。推动者可以是负责监督整个 OKR 部署的内部 OKR 推动者，也可以是负责确保团队或小组 OKR 按计划进行的团队推动者/观察员。\n\
    \n在为您团队选择推动者之前，以下是应具备的一些特质：\n\n-   推动者必须对 OKR 充满热情。\n-   推动者应该对产品有深入的了解，并进行额外阅读，以确保他们能及时了解当前可以帮助他们改进所负责产品的技术和栈。\n\
    -   推动者应负责团队新成员的入职，并确保他们接受 OKR 基础培训。\n-   推动者主持所有 OKR 团队会议，通过提出有力的问题来确保团队方向正确。\n\
    -   推动者很像教练，他们会询问团队的 OKR 是否足够有挑战性，以及如果存在任何障碍，是否应该解决。\n-   推动者在领导层会议和进度报告中代表他们的团队。\n\
    \n理想情况下，团队中的推动者不是资历最深的成员/经理，而是一位潜力巨大、热情高涨的未来领导者。\n\n## 拓展性目标\n\n你的 OKR 是否真的具有挑战性？这是我们经常问自己和团队的问题。看待\
    \ OKR 的方式是，它们不是那种 *恰到好处* 的目标。记住那个想要吃掉“刚刚好”的粥的卷发小女孩 *金发姑娘* 的故事。OKR 讲的不是“刚刚好”的目标；它们关乎那些具有挑战性和雄心壮志的目标。\n\
    \n在选择 OKR 时，问问自己这些问题：这是我们能做的最好程度吗？这真的能推动业务发展吗？如果我们不实行 OKR，我们还会做这件事吗？\n\n用 OKR\
    \ 的术语来说，*拓展性目标* 是指在经过计算后追求 10 倍机遇的高投入、高风险的目标准。正如《这就是 OKR》一书中所写，“保守的目标设定会扼杀创新。而创新就像氧气：没有它，你就无法取胜。”\n\
    \n在 21 世纪初，谷歌曾通过使用 `Gmail` 来克服电子邮件数据存储限制，从而运用了拓展性目标。然而，拓展性目标并不总是关于无限的电子邮件数据存储。它们也可能是关于将普通工作提升到非凡水平。为了改进，团队必须重新思考问题并提出更困难的问题。任何低于此标准的事情都无法提供足够的竞争优势。\n\
    \n如果实施得当，拓展性目标可以激发团队的巅峰表现，并鼓励承担经过计算的风险，而非抑制它们。通过发掘有时是隐藏的优势，拓展性目标可以激发新的承诺、努力和表现水平。发掘这些优势会带来新的机遇。\n\
    \n## 总结\n\n角色和目标是成功推动 OKR 流程的先决条件。目标需要“拉伸”到能够发掘团队新水平的承诺和表现的程度，从而带来更多创新和机遇。一旦目标确定，就需要确定合适的团队来跨团队推动\
    \ OKR。OKR 推动者有助于完成向团队宣讲团队和公司目标的任务，并确保团队方向正确。\n\n# 运营\n"
- fmt: "# 13. People and Processes\n\nMany companies start out with chaotic, unstructured\
    \ execution but then move to a smooth process-driven execution. In between the\
    \ two ends is when you see the processes evolving. This evolution is driven by\
    \ the people within. To introduce processes, there have to be people who have\
    \ experienced the benefits of these processes before. These people will then take\
    \ the others along the long and arduous journey of setting up each process. Oftentimes\
    \ new processes will meet resistance, but in the end the processes will prevail.\n\
    \nThe “Project management” processes for technology-driven companies need acceptance\
    \ from all the employees of the company. The management, the mid-level managers,\
    \ the operations team, the sales team, the marketing team, and the product team\
    \ have to adhere to and respect these processes. In this chapter, we talk about\
    \ the requirements and prioritization processes.\n\n## Requirements\n\nThe Johari\
    \ window is a technique that helps people better understand their relationship\
    \ with themselves and others (Figure [13-1](#521767_1_En_13_Chapter.xhtml#Fig1)).\
    \ It was created by psychologists Joseph Luft (1916–2014) and Harrington Ingham\
    \ (1916–1995) in 1955 and is used primarily in self-help groups and corporate\
    \ settings as a heuristic exercise.\n\n![](images/521767_1_En_13_Chapter/521767_1_En_13_Fig1_HTML.png)\n\
    \nA 2 by 2 matrix. The first row is titled Not Known to Self, the second row is\
    \ titled Not known to Others. The first column is titled Known to Self, and the\
    \ second column is titled Not Known to Self. From left to right, and top to bottom\
    \ the cells are Arena, Blind Spot, Facade, and Unknown.\n\nFigure 13-1\n\nJohari\
    \ window\n\nJohari window explains why effective requirement gathering can tackle\
    \ the blind spots about the product we are developing.\n\nIf you take a close\
    \ look at the Johari window, you’ll see these four areas (Arena is known to everyone,\
    \ so there’s no discussion needed on that):\n\n*   *Arena*: These are traits that\
    \ both the requirement giver and the requirement executor know well about.\n*\
    \   *Blind spot*: These represent what a requirement giver perceive but the requirement\
    \ executor does not.\n*   *Facade*: These are things the requirement giver are\
    \ either unaware of, or that are untrue but for the requirement executor is aware\
    \ of.\n*   *Unknown*: They represent behaviors or motives that no one participating\
    \ recognizes—either because they do not apply or because of collective ignorance\
    \ of these traits.\n\nThese areas need discussing, debating, and understanding\
    \ before approaching any project. The blind spot, facade and unknowns constitute\
    \ 75 percent of the project’s understanding. That means only 25 percent of the\
    \ product’s features are known to both the requirement giver and the requirement\
    \ executor.\n\nRequirements prioritization allows business teams to become independent\
    \ of envisioning requirements without having to seek time for meeting about each\
    \ requirements separately. Prioritization allows for enlisting and discussing\
    \ the business priorities of each requirements.\n\n*   Business teams can propose\
    \ and get newer features released in less time as communication will be more structured\
    \ and documented.\n*   Business teams can understand different priorities of other\
    \ business teams and help reprioritize the tasks that need immediate attention.\n\
    *   Requirement prioritization meeting will ensure no communication is lost in\
    \ mails/groups/channels as all prioritized requirements can be seen in the requirement\
    \ prioritization meetings and these can be discussed and understood in one meeting.\n\
    \nMost of the requirements at the time of writing by the stakeholders are in raw\
    \ format and focuses on the outcome of the requirement itself than discussing\
    \ the overall company metrics that these requirements drive. Requirements written\
    \ in raw format asks from the people who are executing these requirements to understand\
    \ the metrics that would be driven because of executing the requirements.\n\n\
    As shown in Table [13-1](#521767_1_En_13_Chapter.xhtml#Tab1), a requirements document\
    \ is owned by a stakeholder who documents the need for a certain feature or a\
    \ product and details of the plan of execution. Each requirements document should\
    \ have multiple actors who will play their part, as explained in Table [13-1](#521767_1_En_13_Chapter.xhtml#Tab1).\n\
    \nTable 13-1\n\nMetadata in a Typical Requirement Document\n\n| Target release\
    \ | 01-02-1975 |\n| --- | --- |\n| Epic | Driving customer visits |\n| Document\
    \ status | Draft |\n| Document owner | Business analyst 1 |\n| Designer | Designer\
    \ 1 |\n| Tech lead | Lead 1 |\n| Technical writers | Business analyst 1, Product\
    \ manager 1 |\n| QA | Quality assurance specialist 1 |\n| Objective | To change\
    \ the color of a banner that will drive the increase in installs by x% |\n\nA\
    \ requirements document also needs to encompass the following elements:\n\n* \
    \  Clearly written objective with metrics that the requirement intends to drive\n\
    *   Success metrics that drive the objective\n*   Assumptions that the stakeholders\
    \ have made\n*   Milestones\n*   Requirements broken into smaller chunks\n*  \
    \ Open questions that the stakeholders might have that they bring to the prioritization\
    \ discussion\n*   Anything out of scope of the requirements\n*   Stretch goals\
    \ of the requirements as a bonus\n*   User interaction and design\n\nGenerally,\
    \ when writing requirements, we tend to go with one sentence such as “Change the\
    \ color of the banner from green to red to make more people notice it.”\n\nBy\
    \ quoting a not well written requirement, the below paragraph is trying to correct\
    \ it. Here is how we could do write a requirements document from this requirement:\n\
    \n*   *Out of scope of the requirements*: This is supposed to be done only on\
    \ one of the identified pages and not on all pages.\n*   *Stretch goals of the\
    \ requirements as a bonus*: Have an easy way to turn on/off the experiment without\
    \ having to make code changes in production.\n*   *User interaction and design*:\
    \ Use a wireframe of the web page.\n*   *Open questions*:\n    1.  Will the color\
    \ be considered as an error? How do we get user feedback?\n    2.  How can we\
    \ get analytics for this while the experiment is running?\n*   *Objective*: To\
    \ increase the number of clicks on the banner by 5 percent by changing the color\
    \ from green to red.\n*   *Success metrics*: Increase daily paid users by 2.5\
    \ percent.\n*   *Assumptions*: Red is more striking; hence, people are more likely\
    \ to click it.\n*   *Milestones*: First run this as an A/B experiment on 5 percent\
    \ of the users, and once it is successful, then turn it on for 100 percent of\
    \ the users. Hence, there are two milestones to this project: the experiment phase\
    \ and the launch phase.\n*   *Requirements*:\n    1.  Change the color of the\
    \ banner from green to red and launch it as an experiment for 5 percent of the\
    \ users and share the result.\n    2.  Measure the results of the experiment on\
    \ two criteria. Did the test version of the experiment increase the number of\
    \ clicks by 5 percent and increase the number of paid users on a daily basis by\
    \ 2.5 percent?\n    3.  Based on the results of the previous point (b), go ahead\
    \ and launch it for 100 percent of the users. If the previous point (b) is not\
    \ statistically significant, then shelve the experiment.\n\nIf you read through\
    \ the previous requirements, there is no ambiguity about any of the requirements\
    \ written. The requirements cover all aspects and allow the team to implement\
    \ the requirement with no further questions. The requirements are clear, and when\
    \ the team implementing them comes across something they are not sure of, they\
    \ will then add it to the comments and ask questions during the prioritization\
    \ meeting.\n\nOver-communicating when it comes to requirements documentation is\
    \ better than under-communicating and letting the team figure things out on their\
    \ own.\n\nThere are several tools that can help in gathering and documenting the\
    \ requirements process easily, which we will discuss in the next section."
