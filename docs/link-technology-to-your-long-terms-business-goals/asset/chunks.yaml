    # Summary


    Achieving rhythm is not easy, especially if a team is used to not following these
    rituals. You should start the rituals as soon as a sprint team is formed. Eventually,
    when the team falls into a rhythm, the rituals can happen less frequently. Rituals
    help to keep the communication flowing. Every team member should communicate at
    least once during each ritual either through taking turns or through voting, thus
    making the whole process democratic. This will instill confidence and a sense
    of belonging to the team. The intangible benefits are long-term and impact the
    team’s culture greatly.


    # Part II Strategy


    # 8. Objectives and Key Results


    *Objectives and key results* is a corporate planning/strategy execution framework
    being rapidly adopted by companies worldwide to drive business velocity.


    The word *strategy* can be difficult to understand, especially when it comes to
    front-line teams or early-career team members. More often than not, a company’s
    strategy is defined by a leadership team. At the end of endless hours of debate
    and PowerPoint presentations, the leadership team understands the strategy, but
    lower-level teams might have little or no understanding of how their roles are
    impacting the organization.


    Bridging this gap of mission to metrics is where objectives and key results (OKRs)
    come in, helping teams (not only leadership or managers, but our front-line teams)
    to focus on the outcomes that matter most to business.


    In this chapter, we’ll quickly review the basics of OKRs in the workplace and
    why they are needed.


    ## What Are OKRs?


    You can think of OKRs as spear fishing as opposed to casting nets. When OKRs are
    practiced, teams are focused on a few outcome metrics that will move the needle
    in the organization, rather than the many “business as usual” ones (see Figure
    [8-1](#521767_1_En_8_Chapter.xhtml#Fig1)). As opposed to practices in the past,
    OKRs are written in teams, especially cross-functional teams (consider technology
    teams and business teams writing OKRs together!).


    ![](images/521767_1_En_8_Chapter/521767_1_En_8_Fig1_HTML.png)


    The acronym OKR which is a goal-setting methodology stands for objectives and
    key results and is mapped to five concepts: objectives, key outcomes, target,
    focus, and quarter.


    **Figure 8-1** OKR key parameters


    More often than not, in traditional practices of managing company performance,
    very little thought was given to setting goals. The methods were ad hoc and push-based
    and sometimes even templatized. In the past, teams would copy and paste OKRs that
    were irrelevant and look at them after the fact as a check box during an annual
    performance review.


    OKRs should not be just an individual review. As an organization and team performance
    framework, OKR inspires teams to set aspirational goals that impact the business
    the most. OKRs are also about driving consistency; when you start writing OKRs,
    it’s important to detail them at length and write high-quality ones.


    - *Objectives*: Objectives are the qualitative statements; interestingly, they
    have words and no numbers (much unlike what you might have learned in the past).
    Objective statements must have business value and need to answer the question
    “What exactly are we trying to achieve in the next 90 days?”

    - *Key results*: Key results are the high-velocity metrics. These are *not* the
    “business as usual” activities, but outcomes that will effect change. You can
    think about key results much like a GPS, moving you from point A to point B. So,
    when you frame key results, they must have the metric you want to measure to improve
    from A to B to X to Y.

    - *Activities*: OKRs makes a clear distinction between outcomes and activities.
    Activities are the to dos, sometimes the mundane ones. Most of them are needed,
    but may not add value to business. When you think about activities linked to OKRs,
    they are experiments in which teams are trying to move the needle on outcome metrics.


    ## Why OKRs?


    What’s making thousands of startups, scaleups, and enterprises adopt OKRs? It
    seems like practically the whole world has gone hybrid post COVID-19. With distributed
    teams and the need for virtual collaboration, it becomes exceedingly difficult
    to manage the overwhelming set of tasks being thrown at us.


    With scale comes the need to hire new members, and giving them a sense of connection
    to the company purpose is not effective just through a townhall meeting or a leadership
    speech. The company’s purpose must connect the dots between what the employee
    does and the outcomes.


    In addition, CEOs are adopting OKRs due to business model pivots that they were
    forced to make, especially when consumer or customer behaviors have undergone
    a significant shift.


    Many others are looking at OKRs to drive accountability and ownership. Some look
    at OKRs to bring back agility and innovation, which are required for companies
    to stay relevant.


    Finally, organizations want to bring the intimacy back, be it with people or customers,
    and are using OKRs to bring in much required clarity on the “how.”


    The reality is with business model disruptions and CXOs under pressure to deliver,
    OKRs are bridging the gap between strategy and execution.


    # Summary


    OKR was pioneered by John Doerr, and this framework pairs the objectives you want
    to achieve with the key results you’ll use to measure progress. Goals then end
    up being tied to the day-to-day work. The knowledge of concepts stated in this
    chapter will be enough to get you starting using OKRs.


    # 9. Setting Up OKRs


    Before you introduce OKRs into your business, it’s important to understand how
    to induce change into how the team functions as a whole. OKR thinking requires
    a change to be organic and should then percolate up to everyone working with you.
    Once the thought becomes an inherent process, writing and executing OKRs becomes
    easy. As a result, achieving business goals will become process driven rather
    than being rote.'
