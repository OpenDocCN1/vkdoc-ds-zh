- fmt: '# Technical Skills of the Team


    The people on a team must have the skills (or gain them) that befit the role they
    play on that team. For example, developers on an agile software team may need
    to have test-driven-development (`TDD`) skills, people-oriented collaboration/communication
    skills, continuous integration (`CI`) skills, model storming skills, team-based
    planning skills, and so on. Developers on serial/traditional teams may be more
    focused on programming skills for a specific technology platform. Figure [15-2](#521767_1_En_15_Chapter.xhtml#Fig2)
    depicts how the careers of software engineers within the teams can progress as
    they see the product moving from a prototype to a scalable one.


    ![](images/521767_1_En_15_Chapter/521767_1_En_15_Fig2_HTML.png)


    Vertical bars denote the following technical skills of the team in increasing
    order. From left to right, fresh graduates, associate software engineers, technical
    leads, and architects.


    Figure 15-2


    The upward arrow indicates the career progression.


    ## Nature of the Problem


    Although some people want to believe that certain types of problems can be solved
    in only one manner, that doesn’t seem to be the case in practice. For example,
    it’s possible to take an agile or a traditional approach to data warehousing projects,
    to marketing projects, and to procuring services from an external partner. Our
    experience is that the real issue is how decomposable the potential solution is.
    For example, it’s possible to decompose a data warehouse into many small releases
    if you choose. The same thing can be said of the development and execution of
    a marketing campaign. But, it isn’t easy to decompose an airplane into several
    working parts. Either the airplane is complete or it isn’t. Yes, it’s still possible
    to apply agile techniques to the building of the airplane, and very likely to
    its design as well, but the airplane team will never be as agile as a software
    development team due to the physical and regulatory constraints that they face.


    Figure [15-3](#521767_1_En_15_Chapter.xhtml#Fig3) depicts how a problem is solved
    through a product by first prototyping it and then doing a complete launch over
    time.


    ![](images/521767_1_En_15_Chapter/521767_1_En_15_Fig3_HTML.png)


    Vertical bars denote the following project types in increasing order. From left
    to right, proof of concept, minimum viable product, soft launch, and hard launch.


    Figure 15-3


    The progress of product and different launches


    ## Business Constraints


    The way that the business constrains the endeavor, such as insisting on a certain
    (always aggressive) delivery date, an approach to managing the budget (often a
    fixed price/bid), and how available businesspeople will be throughout the project
    certainly all have an effect on the process you adopt and the type of people you
    include on the team. It may even influence what tools you use, particularly those
    for communication and collaboration.


    Figure [15-4](#521767_1_En_15_Chapter.xhtml#Fig4) shows how teams start with limited
    resources and then finally move toward all the wings of the company cooperating
    with each other to launch flagship projects.


    ![](images/521767_1_En_15_Chapter/521767_1_En_15_Fig4_HTML.png)


    Vertical bars denote the following business constraints in increasing order. From
    left to right, use limited resources, from existing teams, consultants only, and
    full team involvement.


    Figure 15-4


    Typical path for product launches


    ## Alerts and Flags


    While scaling operations, there is always a chance of things going downhill, mainly
    due to the unknowns that were not taken care of when the teams were super-agile.
    This means that the ops currently running could be at the risk of scaling down
    suddenly. To subvert these, we need flags and alerts put into place from a technology-driven
    perspective that helps teams to pre-empt any adversities.


    The possible adversities could be as follows:


    - Security incident

    - Data loss

    - Breakdown of systems due to scale


    Alerts and flags should be thought through before the application or the system
    that the teams use is completely built and deployed. Alerts can simply be a notification
    sent over different channels such as the following:


    - Communication channels like Slack

    - Emails

    - SMS messages to select people


    ## Tech-Driven Operations at Scale


    A clear playbook is emerging for how to integrate and capitalize on advanced technologies—across
    an entire company and in any industry.


    How does your company use advanced technologies to create value? This has become
    the defining business challenge of our time. If you ignore it or get it wrong,
    then anything from your job to your entire organization could become vulnerable
    to rivals who get it right. The new technologies come with many labels—digital,
    analytics, automation, the Internet of Things, industrial Internet, Industry 4.0,
    machine learning, artificial intelligence (`AI`), and so on. Technologies that
    help scale business support the creation of all new, digitally enabled business
    models, while holding out the vital promise of improving customer experiences
    and boosting the productivity of legacy operations. Advanced technologies are
    essential to modern enterprises, and it’s fair to say that every large company
    is working with them to some extent.


    - Develop technology road maps that strategically focus investments needed to
    reinvent their legacy businesses and create new digital ones.

    - Train managers to recognize new opportunities and build in-house capabilities
    to deliver technologies.

    - Establish a modern technology environment to support rapid development of new
    solutions.

    - Overhaul data strategy and governance to ensure data are reliable, accessible,
    and continuously enriched to make them more valuable.

    - Focus relentlessly on capturing the strategic value from technology by driving
    rapid changes in the operating model.


    The need for a large number of technology solutions and the last-mile challenge
    may be familiar hurdles to readers who lived through the lean revolution some
    25 years ago. Capturing value from lean initiatives involved driving each process
    change all the way through the operating model of the business. No single lean
    project could generate a major performance improvement, but a rich portfolio of
    lean projects could.


    To make the transformation manageable, companies implemented lean projects in
    waves, tackling processes or units of roughly 200 people at a time. They first
    developed a vision for how each process or unit would be transformed. Then they
    built benches of lean experts (often called `black belts`) to manage change and
    ensure the new operating practices were adopted. Even though lean methods were
    never proprietary, companies such as Toyota used them to ceaselessly pursue small
    performance improvements and thereby build and protect an advantage over their
    competitors.


    An essential component of achieving scale in a technology-enabled transformation
    is having sufficient in-house technology expertise and talent. One proven model
    for building a technology bench is the `technology factory`. Such a factory is
    wholly at the service of the business and governed by the business. It provides
    the sort of work setting that is necessary to attract technology talent and achieve
    high-velocity development.


    ## Summary


    The question that arises is when to augment operations with technology. Some companies
    realize it late, and the cost of maintaining operations through people will have
    shot up to an extent where any more scale would just become untenable. Other companies
    go with a technology-first approach. Neither of them is a sure-shot success. The
    timing has to be according to the situations and market conditions. While technology
    can surely enable the operations, not having a suitable product and investing
    in technology can lead to downfall.


    # Part IV Technology'
