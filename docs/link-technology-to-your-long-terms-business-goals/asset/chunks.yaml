- fmt: '# Solving Process Problems


    There are different frameworks that try to solve process problems using innovative
    trackers. Having a clear-cut project management framework can help reduce these
    failures.


    Every initiative needs to have roles that within either the RACI or DACI model
    defined.


    ## RACI


    ![](images/521767_1_En_21_Chapter/521767_1_En_21_Fig1_HTML.png)


    A sketch of a man holding cards with R below and A on top. A lady is standing
    over a card with C and holding a card with I. Two setting icons are at the top
    left and bottom right.


    **Figure 21-1** RACI model


    The RACI model asks the question, who is responsible for completing certain tasks?


    A RACI matrix is the simplest, most effective means for defining and documenting
    project roles and responsibilities. Knowing exactly who is responsible, who is
    accountable, who needs to be consulted, and who must be kept informed at every
    step will significantly improve your chances of project success.


    RACI stands for the following:


    - **Responsible**: Who is responsible for participating in completing an action?

    - **Accountable**: Who is accountable for making sure an action is complete?

    - **Consulted**: Who is consulted during the process of completing an action?

    - **Informed**: Who is informed about the state of an action?


    ## DACI


    ![](images/521767_1_En_21_Chapter/521767_1_En_21_Fig2_HTML.png)


    Sketches of several hands holding sticky notes, pencil, pen, duster, lens, over
    a board. Another hand points over a section. It lists work done yesterday, works
    to be done today, and any blockages.


    **Figure 21-2** DACI model


    The DACI model asks the question, who decides on a course of action for a particular
    task or function?


    The DACI decision-making framework improves a team’s effectiveness and velocity
    on projects by assigning team members specific roles and responsibilities when
    it comes to group decisions.


    DACI stands for the following:


    - **Driver**: The person who drives the decision

    - **Approver**: The person who makes the decision

    - **Contributors**: The people or teams whose work or knowledge aids in the project

    - **Informed**: The people whose work might be affected by these decisions and
    who therefore need to be kept in the loop


    ## Don’t Do Ad Hoc


    Always have multiple pods or squads running sprints, as explained in Chapter [4](#521767_1_En_4_Chapter.xhtml).
    They help in keeping the project running even if a small part of it fails. For
    this to happen, always have rituals and processes that help keep tabs on the progress.


    Businesses fail because the rituals necessary to run the processes are not being
    followed. We have covered all the rituals in detail in Chapter [1](#521767_1_En_1_Chapter.xhtml)
    for the company in general and Chapter [18](#521767_1_En_18_Chapter.xhtml) for
    the Tech team specifically. Here we will be discussing on what rituals if followed
    properly will prevent the business from failing.


    ### Requirements Gathering


    All the requirements that come from the stakeholders will be segregated and assigned
    to specific teams based on their responsibilities. These are then collated in
    the backlog section under each team’s project management tool. Based on the priority,
    these tasks are then categorized and assigned to the development teams. This basic
    ritual is a must to help companies drive the culture of fostering prioritization
    of all key tasks without with the objectives of the company will not be met.


    ### Epics, User Stories, and Tasks


    All the requests (new features, change requests, and migration requests for new
    technology) from stakeholders are captured via a form or software and taken to
    a logical end through a sprint process.


    - **Epic**: A larger story that drives a new flagship feature or a product

    - **User story**: The breakdown of a larger story into smaller stories

    - **Tasks/subtasks**: The breakdown of larger stories into smaller chunks


    Not creating Epics, user stories and tasks in an organized and repetitive way
    leads to failures at a project level initially and at a business level when the
    problem compounds and becomes an all-pervasive norm.


    ## Follow Sprints


    For smaller teams, it is imperative that all the issues in the backlog are prioritized
    and put into action. This will happen through different phases in the scrum model.
    Figure [21-3](#521767_1_En_21_Chapter.xhtml#Fig3) shows how the events happen
    in the agile methodology.


    - **Sprint timelines**: 2 weeks

    - **Tasks prioritization**: Alternate Friday

    - **New sprint**: Every alternate Tuesday

    - **Sprint ends**: Every alternate Monday


    Figure [21-3](#521767_1_En_21_Chapter.xhtml#Fig3) depicts a typical sprint framework
    that can be used to deliver larger epics or projects.


    ![](images/521767_1_En_21_Chapter/521767_1_En_21_Fig3_HTML.jpg)


    A flowchart. Step 1. Sprint planning. To craft a Sprint goal and a plan to achieve
    it. 2. Daily scrum. To review the team''s progress and adjust the goal. 3. Sprint
    Review of the work completed with stakeholders. 4. Sprint Retrospective. To review
    the product development process and identify areas for continuous improvements.


    **Figure 21-3** Sprint process


    The following steps detail the sprint process:


    1. All the issues in the backlog are prioritized by the respective development
    teams. The issues are then added to the `Create Sprint` task in sprint planning,
    and the sprint is activated to track the progress.

    2. Once the sprint is activated, the daily scrum is initiated to review the team’s
    progress on the sprint goals. Figure [21-4](#521767_1_En_21_Chapter.xhtml#Fig4)
    shows how the review happens in a daily scrum.

    3. The sprint review is done at the time of prioritization to review the work
    completed in the sprint with the stakeholders and discuss the tasks for the upcoming
    sprints.

    4. Once the sprint is closed, the team meets to review the last sprint and identify
    areas for improvement called *retrospection*.


    ### Daily Scrum


    As described in the scrum guide (`https://scrumguides.org/`), the purpose of the
    daily scrum is to inspect progress toward the sprint goal and adapt the sprint
    backlog as necessary, adjusting the upcoming planned work. The daily scrum is
    a 15-minute event for the developers of the scrum team. To reduce complexity,
    it is held at the same time and place every working day of the sprint. If the
    product owner or scrum master is actively working on items in the sprint backlog,
    they participate as developers. The developers can select whatever structure and
    techniques they want, as long as their daily scrum focuses on progress toward
    the sprint goal and produces an actionable plan for the next day of work. This
    creates focus and improves self-management. Daily scrums improve communications,
    identify impediments, promote quick decision-making, and consequently eliminate
    the need for other meetings. The daily scrum is not the only time developers are
    allowed to adjust their plan. They often meet throughout the day for more detailed
    discussions about adapting or re-planning the rest of the sprint’s work.


    Figure [21-4](#521767_1_En_21_Chapter.xhtml#Fig4) depicts what needs to be spoken
    by everyone who is part of the scrum meeting on a daily basis.


    ![](images/521767_1_En_21_Chapter/521767_1_En_21_Fig4_HTML.jpg)


    A flowchart. The daily scrum is branched into work done yesterday, work to be
    done today, and any blockages.


    **Figure 21-4** Daily scrum questions to be answered


    If these processes are overlooked, then the problems across the company creep
    in and cascade to all areas. These problems lead to the following:


    - Lack of clarity

    - Miscommunication

    - Ineffective change management

    - Lack of innovation because of repetitive tasks and initiatives'
  raw: '## Solving Process Problems


    There are different frameworks that try to solve process problems using innovative
    trackers. Having a clear-cut project management framework can help reduce these
    failures.


    Every initiative needs to have roles that within either the RACI or DACI model
    defined.


    ### RACI


    ![](images/521767_1_En_21_Chapter/521767_1_En_21_Fig1_HTML.png)


    A sketch of a man holding cards with R below and A on top. A lady is standing
    over a card with C and holding a card with I. Two setting icons are at the top
    left and bottom right.


    Figure 21-1


    RACI model


    The RACI model asks the question, who is responsible for completing certain tasks?


    A RACI matrix is the simplest, most effective means for defining and documenting
    project roles and responsibilities. Knowing exactly who is responsible, who is
    accountable, who needs to be consulted, and who must be kept informed at every
    step will significantly improve your chances of project success.


    RACI stands for the following:


    *   *Responsible*: Who is responsible for participating in completing an action?


    *   *Accountable*: Who is accountable for making sure an action is complete?


    *   *Consulted*: Who is consulted during the process of completing an action?


    *   *Informed*: Who is informed about the state of an action?


    ### DACI


    ![](images/521767_1_En_21_Chapter/521767_1_En_21_Fig2_HTML.png)


    Sketches of several hands holding sticky notes, pencil, pen, duster, lens, over
    a board. Another hand points over a section. It lists work done yesterday, works
    to be done today, and any blockages.


    Figure 21-2


    DACI model


    The DACI model asks the question, who decides on a course of action for a particular
    task or function?


    The DACI decision-making framework improves a team’s effectiveness and velocity
    on projects by assigning team members specific roles and responsibilities when
    it comes to group decisions.


    DACI stands for the following:


    *   *Driver*: The person who drives the decision


    *   *Approver*: The person who makes the decision


    *   *Contributors*: The people or teams whose work or knowledge aids in the project


    *   *Informed*: The people whose work might be affected by these decisions and
    who therefore need to be kept in the loop


    ## Don’t Do Ad Hoc


    Always have multiple pods or squads running sprints, as explained in Chapter [4](#521767_1_En_4_Chapter.xhtml).
    They help in keeping the project running even if a small part of it fails. For
    this to happen, always have rituals and processes that help keep tabs on the progress.


    Businesses fail because the rituals necessary to run the processes are not being
    followed. We have covered all the rituals in detail in Chapter [1](#521767_1_En_1_Chapter.xhtml)
    for the company in general and Chapter [18](#521767_1_En_18_Chapter.xhtml) for
    the Tech team specifically. Here we will be discussing on what rituals if followed
    properly will prevent the business from failing.


    ### Requirements Gathering


    All the requirements that come from the stakeholders will be segregated and assigned
    to specific teams based on their responsibilities. These are then collated in
    the backlog section under each team’s project management tool. Based on the priority,
    these tasks are then categorized and assigned to the development teams. This basic
    ritual is a must to help companies drive the culture of fostering prioritization
    of all key tasks without with the objectives of the company will not be met.


    ### Epics, User Stories, and Tasks


    All the requests (new features, change requests, and migration requests for new
    technology) from stakeholders are captured via a form or software and taken to
    a logical end through a sprint process.


    *   *Epic*: A larger story that drives a new flagship feature or a product


    *   *User story*: The breakdown of a larger story into smaller stories


    *   *Tasks/subtasks*: The breakdown of larger stories into smaller chunks


    Not creating Epics, user stories and tasks in an organized and repetitive way
    leads to failures at a project level initially and at a business level when the
    problem compounds and becomes an all-pervasive norm.


    ## Follow Sprints


    For smaller teams, it is imperative that all the issues in the backlog are prioritized
    and put into action. This will happen through different phases in the scrum model.
    Figure [21-3](#521767_1_En_21_Chapter.xhtml#Fig3) shows how the events happen
    in the agile methodology.


    *   *Sprint timelines*: 2 weeks


    *   *Tasks prioritization*: Alternate Friday


    *   *New sprint*: Every alternate Tuesday


    *   *Sprint ends*: Every alternate Monday


    Figure [21-3](#521767_1_En_21_Chapter.xhtml#Fig3) depicts a typical sprint framework
    that can be used to deliver larger epics or projects.


    ![](images/521767_1_En_21_Chapter/521767_1_En_21_Fig3_HTML.jpg)


    A flowchart. Step 1\. Sprint planning. To craft a Sprint goal and a plan to achieve
    it. 2\. Daily scrum. To review the team''s progress and adjust the goal. 3\. Sprint
    Review of the work completed with stakeholders. 4\. Sprint Retrospective. To review
    the product development process and identify areas for continuous improvements.


    Figure 21-3


    Sprint process


    The following steps detail the sprint process:


    1.  All the issues in the backlog are prioritized by the respective development
    teams. The issues are then added to the “Create Sprint” task in sprint planning,
    and the sprint is activated to track the progress.


    2.  Once the sprint is activated, the daily scrum is initiated to review the team’s
    progress on the sprint goals. Figure [21-4](#521767_1_En_21_Chapter.xhtml#Fig4)
    shows how the review happens in a daily scrum.


    3.  The sprint review is done at the time of prioritization to review the work
    completed in the sprint with the stakeholders and discuss the tasks for the upcoming
    sprints.


    4.  Once the sprint is closed, the team meets to review the last sprint and identify
    areas for improvement called *retrospection*.


    ### Daily Scrum


    As described in the scrum guide ([`https://scrumguides.org/`](https://scrumguides.org/)),
    the purpose of the daily scrum is to inspect progress toward the sprint goal and
    adapt the sprint backlog as necessary, adjusting the upcoming planned work. The
    daily scrum is a 15-minute event for the developers of the scrum team. To reduce
    complexity, it is held at the same time and place every working day of the sprint.
    If the product owner or scrum master is actively working on items in the sprint
    backlog, they participate as developers. The developers can select whatever structure
    and techniques they want, as long as their daily scrum focuses on progress toward
    the sprint goal and produces an actionable plan for the next day of work. This
    creates focus and improves self-management. Daily scrums improve communications,
    identify impediments, promote quick decision-making, and consequently eliminate
    the need for other meetings. The daily scrum is not the only time developers are
    allowed to adjust their plan. They often meet throughout the day for more detailed
    discussions about adapting or re-planning the rest of the sprint’s work.


    Figure [21-4](#521767_1_En_21_Chapter.xhtml#Fig4) depicts what needs to be spoken
    by everyone who is part of the scrum meeting on a daily basis.


    ![](images/521767_1_En_21_Chapter/521767_1_En_21_Fig4_HTML.jpg)


    A flowchart. The daily scrum is branched into work done yesterday, work to be
    done today, and any blockages.


    Figure 21-4


    Daily scrum questions to be answered


    If these processes are overlooked, then the problems across the company creep
    in and cascade to all areas. These problems lead to the following:


    *   Lack of clarity


    *   Miscommunication


    *   Ineffective change management


    *   Lack of innovation because of repetitive tasks and initiatives'
  trans: '

    # 解决流程问题


    有多种框架试图通过创新的追踪器来解决流程问题。一个清晰的项目管理框架有助于减少这些失败。


    每项计划都需要在 RACI 或 DACI 模型中定义相应角色。


    ## RACI


    ![](img/521767_1_En_21_Fig1_HTML.png)


    一幅草图：一名男子手持卡片，卡片下方标有 R，上方标有 A。一名女子站在标有 C 的卡片旁，并手持标有 I 的卡片。左上角和右下角有两个设置图标。


    **图 21-1** RACI 模型


    RACI 模型提出的问题是：谁负责完成特定任务？


    RACI 矩阵是定义和记录项目角色与职责最简单、最有效的方法。确切知道每一步谁负责（Responsible）、谁问责（Accountable）、需要咨询谁（Consulted）、以及必须告知谁（Informed），将显著提高项目成功的几率。


    RACI 代表以下含义：


    - **负责者（Responsible）**：谁负责参与完成某项行动？

    - **问责者（Accountable）**：谁负责确保某项行动完成？

    - **咨询者（Consulted）**：在完成某项行动的过程中，需要咨询谁的意见？

    - **告知者（Informed）**：谁需要被告知某项行动的进展状态？


    ## DACI


    ![](img/521767_1_En_21_Fig2_HTML.png)


    几只手拿着便利贴、铅笔、钢笔、掸子、放大镜，在一块板子上方比划。另一只手则指向一个区域。板子上列出了昨天完成的工作、今天要完成的工作以及任何阻碍。


    **图 21-2** DACI 模型


    DACI 模型提出的问题是：谁来决定特定任务或功能的行动方案？


    DACI 决策框架通过在团队决策时为成员分配特定角色与职责，提升了团队在项目中的效能与速度。


    DACI 代表以下含义：


    - **推动者（Driver）**：推动决策的人

    - **审批者（Approver）**：做出决策的人

    - **贡献者（Contributors）**：其工作或知识为项目提供帮助的个人或团队

    - **告知者（Informed）**：其工作可能受这些决策影响，因此需要了解情况的人


    ## 切勿临时应付


    始终让多个小组（pods）或小队（squads）运行冲刺（sprints），正如第 4 章所述。这有助于即使项目一小部分失败，整个项目仍能继续运行。为此，必须始终有例会和流程来跟踪进展。


    企业之所以失败，是因为维持流程运作所必需的例会未被遵守。我们在第 1 章已详述了公司一般性的所有例会，在第 18 章则专门为技术团队进行了说明。这里我们将讨论，如果正确执行哪些例会，可以防止企业失败。


    ### 需求收集


    所有来自利益相关者的需求将被分类，并根据职责分配到特定团队。这些需求随后会在每个团队的项目管理工具中，归集到待办事项列表（backlog）部分。根据优先级，这些任务会被分类并分配给开发团队。这一基本例会是帮助企业培养对所有关键任务进行优先级排序文化的必要条件，否则公司目标将无法实现。


    ### 史诗、用户故事与任务


    所有来自利益相关者的请求（新功能、变更请求以及新技术的迁移请求）都通过表单或软件进行记录，并通过冲刺流程推进到逻辑终点。


    - **史诗（Epic）**：驱动新旗舰功能或产品的一个较大故事。

    - **用户故事（User story）**：将较大故事分解为较小的故事。

    - **任务/子任务（Tasks/subtasks）**：将较大故事分解为更小的模块。


    如果不能以有条理且可重复的方式创建史诗、用户故事和任务，最初会导致项目层面的失败，而当问题累积并成为普遍常态时，则会导致业务层面的失败。


    ## 遵循冲刺


    对于较小的团队，必须优先处理待办事项列表中的所有问题并将其付诸行动。这将通过 Scrum 模型中的不同阶段来实现。图 21-3 展示了敏捷方法论中事件是如何发生的。


    - **冲刺时间线**：2 周

    - **任务优先级排序**：交替的周五

    - **新冲刺开始**：每隔一个周二

    - **冲刺结束**：每隔一个周一


    图 21-3 描述了一个可用于交付较大史诗或项目的典型冲刺框架。


    ![](img/521767_1_En_21_Fig3_HTML.jpg)


    流程图。步骤 1：冲刺规划。制定冲刺目标及实现该目标的计划。2：每日站会。检视团队进展并调整目标。3：冲刺评审。与利益相关者一起评审已完成的工作。4：冲刺回顾。检视产品开发流程，识别持续改进的领域。


    **图 21-3** 冲刺流程


    以下步骤详述了冲刺过程：


    1.  待办事项列表中的所有问题由各自的开发团队进行优先级排序。这些问题随后被添加到冲刺规划中的“创建冲刺（`Create Sprint`）”任务中，并启动冲刺以跟踪进度。

    2.  冲刺启动后，每日站会随即开始，以检视团队在冲刺目标上的进展。图 21-4 展示了每日站会中的检视方式。

    3.  在优先级排序时进行冲刺评审，与利益相关者一起评审本冲刺中已完成的工作，并讨论即将开始的冲刺任务。

    4.  冲刺结束后，团队开会回顾上一个冲刺，并识别改进领域，这被称为*回顾*。


    ### 每日站会


    正如 Scrum 指南（`https://scrumguides.org/`）所述，每日站会的目的是检查朝向冲刺目标的进展，并根据需要调整冲刺待办事项列表，调整接下来的计划工作。每日站会是
    Scrum 团队开发人员的一项 15 分钟事件。为降低复杂性，它在冲刺的每个工作日于同一时间和同一地点举行。如果产品负责人或 Scrum Master 正在积极处理冲刺待办事项列表中的条目，他们将作为开发人员参与。开发人员可以选择他们想要的任何结构和技巧，只要他们的每日站会聚焦于朝向冲刺目标的进展，并为第二天的工作制定可行的计划。这创造了专注力并改进了自我管理。每日站会改善了沟通，识别了阻碍，促进了快速决策，从而消除了对其他会议的需求。每日站会并不是开发人员唯一可以调整计划的时间。他们经常在一天中会面，以进行关于调整或重新规划剩余冲刺工作的更详细讨论。


    图 21-4 描绘了每日参加 Scrum 会议的每个人需要汇报的内容。


    ![](img/521767_1_En_21_Fig4_HTML.jpg)


    流程图。每日站会分为：昨天完成的工作，今天要完成的工作，以及任何阻碍。


    **图 21-4** 每日站会中需要回答的问题


    如果这些流程被忽视，那么整个公司的问题就会悄然出现并波及所有领域。这些问题会导致：


    - 缺乏清晰度

    - 沟通不畅

    - 变更管理失效

    - 由于重复的任务和计划而缺乏创新

    '
- fmt: '# Summary


    There’s no one-size-fits-all answer to the question of why businesses fail. Just
    not following sprint processes doesn’t guarantee a business failure. If all the
    other fundamentals of the business are solid and the sprint processes and all
    other rituals are followed, the business will surely succeed is a way of saying;
    it will not fail.


    # 22. Exceptions to Processes: Good or Bad?


    Exceptions are required to function in any field and not just in technology. The
    moon mission in 1969 had multiple exceptions. How did the people overcome these
    exceptions and still manage a mission as big as that? What we have to learn from
    this and how we navigate scenarios when exceptions occur are some of the questions
    that are covered in this chapter. Generally, the exceptional cases are handled
    first in any project, and then we go to the easy use cases. This will give us
    the confidence that we can tackle anything.


    ## Exceptions in the Moon Landing


    ![](images/521767_1_En_22_Chapter/521767_1_En_22_Fig1_HTML.png)


    A sketch of 2 astronauts sitting over satellites from Earth to the Moon. The satellite
    adjacent to the moon is labeled with Reboot. The one next to it is labeled 1202
    error. Another satellite is landed on the moon with a flag.


    Figure 22-1


    Figure depicting the error astronauts faced while landing on the Moon


    The lunar module that was being piloted to the moon surface in 1969 began to report
    errors when the craft was just seven-and-a-half minutes away from landing.


    Two obscure error codes were involved, each consisting of four digits, and indicated
    there was an issue or problem occurring in the spacecraft. During the design of
    the system for the lunar lander, the developers had come up with a slew of error
    codes that could be displayed if the computer detected something amiss on the
    craft.


    When the astronauts did countless simulated landings, not all of the possible
    error codes were tested, and thus there were some error codes that the astronauts
    had never seen.


    “It’s a `1202` error.”


    Within mission control, there were blank stares as by and large no one knew what
    `1202` was about.


    But the programmers had anticipated this error might someday occur and so had
    established a system-internal aspect that would automatically do a fast reboot
    and then a memory restore to try to get the computer working again. In theory,
    the computer was going to be able to resolve the error, without needing any human
    intervention.


    ## What Can Driverless Cars Learn from the First Moon Landing?


    Today, driverless cars can learn from the first moon landing. You need to anticipate
    and code for wayward sensors. You cannot assume that the sensors on a driverless
    car will be working flawlessly. Besides the obvious aspect that the sensor might
    get blinded by dirt or debris, there is also the chance that the sensor could
    go awry due to some internal bug or issue. Make sure to code for this possibility
    and have some provision for what to do once the matter arises.


    Do not ignore edge cases. The focus for most driverless car efforts right now
    is on driving during normal, everyday conditions, and not dealing with unusual
    or infrequent kinds of driving situations (so-called “edge” aspects). This belies
    the true aspects of driving, which can include foul weather, bad roadways, and
    the like. Autonomous cars that are being tried on our public streets need to be
    ready to handle edge or corner cases.


    From a software perspective, the same kinds of issues can occur, including hidden
    bugs or suddenly appearing faults, that could have happened back in 1969. Let’s
    make sure that we learn the lessons of the past and be extremely mindful when
    designing, coding, testing, and fielding autonomous cars.


    ## Not All Stories End Well


    On July 22, 1962, an Atlas rocket launched successfully with NASA’s Mariner 1
    spacecraft encapsulated in its fairing. NASA had hoped to be the first to successfully
    fly by Venus and counter the Soviet Union’s lead in the space race. Less than
    five minutes into the flight, it was clear Mariner 1 wouldn’t even reach Earth’s
    orbit. A range safety officer tracking the rocket’s flight detected an unexpected
    yaw-lift (northeast) maneuver, meaning its guidance system had faltered. The rocket
    was unable to steer itself as intended and was heading toward a crash, either
    in the North Atlantic shipping lanes or, worse, in an inhabited area. The officer
    had no choice but to order the destructive abort. The rocket along with Mariner
    1 exploded, and $80 million dollars ($720 million in 2021) was lost.


    It turned out that a programmer had left a hyphen out of an equation while entering
    its hand-transcribed code into the rocket’s computer. This fed false information
    to the guidance system, and ultimately all that was left was debris. The human
    error was fixed for Mariner 2, which launched shortly after and conducted the
    first successful flyby of Venus.


    These exceptions occurred because of human error or not understanding or comprehending
    the systems. In the case of the space missions, sometimes we have to rush the
    release, because there’s pressure from the press, from other countries, or from
    politicians. These exceptions nevertheless cause problems.


    Why are we looking at space missions while looking at exceptions? It’s because
    the scale of them is easy to comprehend.


    When a space mission fails because of a missing semicolon, it gets noticed, but
    when a similar mistake happens in a company that is now launching a new website
    and the site goes down, the scale isn’t as huge as that of a space mission but
    impacts the business in the same catastrophic manner.


    ## Why Do Businesses Seek Exceptions?


    Why do different wings of the business, knowing very well that exceptions are
    bad, ask for exceptions? The reasons are as follows:


    - There’s a promise made for publicity without consulting the tech team about
    whether a certain website can be ready by that time


    - A promise to the investor


    - A primetime slot on TV that will lead to publicity


    - Misunderstanding of the underlying technology and thinking that a complicated
    module is easy to replicate into a new version and can be launched without much
    testing so bargaining for getting it done in a lesser time


    All these exceptions lead to disasters if not managed well. Some of these are
    genuine cases where there is good ground that can be captured, especially because
    of quick publicity. So in these cases, the processes followed can be exempted,
    and the teams that are following these processes must ensure that there are means
    to manage the exceptions well.


    ## Management by Exception


    Management by exception consists of four steps:


    1. Setting the objectives and defining what the norm should be


    2. Assessing performance to see whether the performance is on track


    3. Analyzing work or records to determine where performance deviates from objectives


    4. Investigating and solving the exceptions to the norm'
  raw: '## Summary


    There’s no one-size-fits-all answer to the question of why businesses fail. Just
    not following sprint processes doesn’t guarantee a business failure. If all the
    other fundamentals of the business are solid and the sprint processes and all
    other rituals are followed, the business will surely succeed is a way of saying;
    it will not fail.


    # 22. Exceptions to Processes: Good or Bad?


    Exceptions are required to function in any field and not just in technology. The
    moon mission in 1969 had multiple exceptions. How did the people overcome these
    exceptions and still manage a mission as big as that? What we have to learn from
    this and how we navigate scenarios when exceptions occur are some of the questions
    that are covered in this chapter. Generally, the exceptional cases are handled
    first in any project, and then we go to the easy use cases. This will give us
    the confidence that we can tackle anything.


    ## Exceptions in the Moon Landing


    ![](images/521767_1_En_22_Chapter/521767_1_En_22_Fig1_HTML.png)


    A sketch of 2 astronauts sitting over satellites from Earth to the Moon. The satellite
    adjacent to the moon is labeled with Reboot. The one next to it is labeled 1202
    error. Another satellite is landed on the moon with a flag.


    Figure 22-1


    Figure depicting the error astronauts faced while landing on the Moon


    The lunar module that was being piloted to the moon surface in 1969 began to report
    errors when the craft was just seven-and-a-half minutes away from landing.


    Two obscure error codes were involved, each consisting of four digits, and indicated
    there was an issue or problem occurring in the spacecraft. During the design of
    the system for the lunar lander, the developers had come up with a slew of error
    codes that could be displayed if the computer detected something amiss on the
    craft.


    When the astronauts did countless simulated landings, not all of the possible
    error codes were tested, and thus there were some error codes that the astronauts
    had never seen.


    “It’s a 1202 error.”


    Within mission control, there were blank stares as by and large no one knew what
    1202 was about.


    But the programmers had anticipated this error might someday occur and so had
    established a system-internal aspect that would automatically do a fast reboot
    and then a memory restore to try to get the computer working again. In theory,
    the computer was going to be able to resolve the error, without needing any human
    intervention.


    ## What Can Driverless Cars Learn from the First Moon Landing?


    Today, driverless cars can learn from the first moon landing. You need to anticipate
    and code for wayward sensors. You cannot assume that the sensors on a driverless
    car will be working flawlessly. Besides the obvious aspect that the sensor might
    get blinded by dirt or debris, there is also the chance that the sensor could
    go awry due to some internal bug or issue. Make sure to code for this possibility
    and have some provision for what to do once the matter arises.


    Do not ignore edge cases. The focus for most driverless car efforts right now
    is on driving during normal, everyday conditions, and not dealing with unusual
    or infrequent kinds of driving situations (so-called “edge” aspects). This belies
    the true aspects of driving, which can include foul weather, bad roadways, and
    the like. Autonomous cars that are being tried on our public streets need to be
    ready to handle edge or corner cases.


    From a software perspective, the same kinds of issues can occur, including hidden
    bugs or suddenly appearing faults, that could have happened back in 1969\. Let’s
    make sure that we learn the lessons of the past and be extremely mindful when
    designing, coding, testing, and fielding autonomous cars.


    ## Not All Stories End Well


    On July 22, 1962, an Atlas rocket launched successfully with NASA’s Mariner 1
    spacecraft encapsulated in its fairing. NASA had hoped to be the first to successfully
    fly by Venus and counter the Soviet Union’s lead in the space race. Less than
    five minutes into the flight, it was clear Mariner 1 wouldn’t even reach Earth’s
    orbit. A range safety officer tracking the rocket’s flight detected an unexpected
    yaw-lift (northeast) maneuver, meaning its guidance system had faltered. The rocket
    was unable to steer itself as intended and was heading toward a crash, either
    in the North Atlantic shipping lanes or, worse, in an inhabited area. The officer
    had no choice but to order the destructive abort. The rocket along with Mariner
    1 exploded, and $80 million dollars ($720 million in 2021) was lost.


    It turned out that a programmer had left a hyphen out of an equation while entering
    its hand-transcribed code into the rocket’s computer. This fed false information
    to the guidance system, and ultimately all that was left was debris. The human
    error was fixed for Mariner 2, which launched shortly after and conducted the
    first successful flyby of Venus.


    These exceptions occurred because of human error or not understanding or comprehending
    the systems. In the case of the space missions, sometimes we have to rush the
    release, because there’s pressure from the press, from other countries, or from
    politicians. These exceptions nevertheless cause problems.


    Why are we looking at space missions while looking at exceptions? It’s because
    the scale of them is easy to comprehend.


    When a space mission fails because of a missing semicolon, it gets noticed, but
    when a similar mistake happens in a company that is now launching a new website
    and the site goes down, the scale isn’t as huge as that of a space mission but
    impacts the business in the same catastrophic manner.


    ## Why Do Businesses Seek Exceptions?


    Why do different wings of the business, knowing very well that exceptions are
    bad, ask for exceptions? The reasons are as follows:


    *   There’s a promise made for publicity without consulting the tech team about
    whether a certain website can be ready by that time


    *   A promise to the investor


    *   A primetime slot on TV that will lead to publicity


    *   Misunderstanding of the underlying technology and thinking that a complicated
    module is easy to replicate into a new version and can be launched without much
    testing so bargaining for getting it done in a lesser time


    All these exceptions lead to disasters if not managed well. Some of these are
    genuine cases where there is good ground that can be captured, especially because
    of quick publicity. So in these cases, the processes followed can be exempted,
    and the teams that are following these processes must ensure that there are means
    to manage the exceptions well.


    ## Management by Exception


    Management by exception consists of four steps:


    1.  Setting the objectives and defining what the norm should be


    2.  Assessing performance to see whether the performance is on track


    3.  Analyzing work or records to determine where performance deviates from objectives


    4.  Investigating and solving the exceptions to the norm'
