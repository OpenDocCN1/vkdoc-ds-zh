  trans: '

    # 2. 招聘


    招聘很难。技术招聘难上加难。在技术领域招聘优秀人才更是难如登天。而招聘那些真正能留下并为核心产品做出重大贡献的优秀技术人才，则难上百倍。至于招聘那些不仅能留下、做出重大贡献，还能帮助招聘其他优秀人才、从而建立起人才网络的精英，简直是难到极致。


    本章将展示我如何尝试、失败、成功、试验，并混合搭配不同方法来打造我的技术团队。


    ## 内部推荐


    你认识一个人，他认识另一个人，而这个人又认识另一个人（图 2-1）。内部推荐在大多数情况下都有效。但切勿仅凭推荐就录用某人。在我的初创公司，我始终坚持一定流程：我的推荐人由架构师面试，架构师的推荐人由我面试，以此类推。


    ![](img/521767_1_En_2_Fig1_HTML.png)


    一张三个火柴人的图，描绘了内部推荐招聘。第一个人认识中间的人，中间的人又认识面试官。


    图 2-1


    内部推荐


    无论谁向你的公司推荐职位候选人，始终要进行编程测试。他们有多少经验并不重要。那些在以前公司做出过重大贡献的人，也未必总能胜任。当前环境的文化至关重要。这个人能否适应新环境？这是你在他入职后也必须始终追问的问题。如果你决定录用一个明知不合适或无法适应新环境的人，最大的输家将是你自己。


    话说回来，我确实也成功通过内部推荐招到了人才。当他们被赋予比以往更重的责任时，他们超越预期，比任何人都更加耀眼。有些人总能给我惊喜。


    归根结底，内部推荐没有标准答案。有些推荐奏效，有些则不然。一个人能否成功取决于多个因素，因此在你评判新员工是成功还是失败之前，先问自己这些问题：


    -   你是否让他们适应了新环境？

    -   你是否给了他们足够的调整时间？

    -   你是直接把他们抛入深海任其自生自灭，还是全程手把手指导？这能看出他们应对逆境的能力。

    -   他们是否足够灵活，能够适应？

    -   他们是否愿意付出额外努力来完成工作？


    正如我所说，盲目信任内部推荐时，我既犯过错误，也取得过成功。经过多次讨论，我意识到盲目信任本身并非坏事，但需要平衡。你的同事会帮助你找到这种平衡，这就是为什么每个团队都需要多元化的成员。在决定录用某位推荐候选人时，他们可以为你提供建议，甚至直接向候选人本人给出恰当的反馈。


    ### 人力资源寻源


    当你持续为开放职位招聘时，人力资源寻源非常有效。它能填补因团队扩张和接受更广泛、更多样化需求而产生的许多缺口。


    我发现当急需用人时这种方法往往失灵，主要是因为人们匆忙时容易出错，最终为了填补特定数量的职位而面试了大量候选人。最好是与 HR 部门长期合作，帮助他们理解职位要求，从而能明智地筛选候选人。


    ## 顾问


    对于架构师这类角色定义明确的专业职位，交给顾问来处理效果很好。当你清楚知道自己需要什么角色时，使用顾问很有帮助。与内部推荐和 HR 寻源中存在大量不确定因素（比如：我们能否录用这个人担任与招聘职位不同的角色？）不同，这里不存在这个问题。我们向顾问清晰说明所需角色，而他们恰好拥有所需的技能集。


    通过使用高效的招聘工具（例如`Hirect`、`Recruitee`、`Intervue`等），可以优化招聘流程。此外，你可以让每个团队的负责人自主承担招聘责任和所有权，这能赋予团队极大的独立性。由于工作性质不同，每个团队的工作描述可能有所差异，而给予适当的自主权，让他们能从顾问人才库中招聘到优秀人才。


    ## 招聘活动


    招聘活动是我个人亲身实践并深有体会的一种方式。尤其是在新冠疫情期间，招聘变得困难，因为人们正在适应完全远程的工作文化。在我的初创公司，我们制定了一个计划：首先梳理每个团队额外的人力需求。由于我们对即将开展的工作有全局把握，我们进行了推断并制定了增补资源的策略。人员需求如图
    2-2 所示进行记录。


    ![](img/521767_1_En_2_Fig2_HTML.png)


    一份关于人员需求的示例计划，展示了各种职位角色，如用户资料团队、搜索与面板团队、核心产品团队和 QA 团队，总计额外资源需求约 12 人。


    图 2-2


    人员需求


    一旦明确了这些需求，就该推断我们预计邀请多少候选人参加面试了。如果需要 12 名资源，那么图 2-3 显示了我们必须经过招聘流程筛选的人数。


    ![](img/521767_1_En_2_Fig3_HTML.png)


    面试流程从应聘人数开始，分为 5 个阶段：120 名候选人应聘，经过选拔后仅 60 人入选；30 人通过编程测试，然后 15 人通过第 2、3、4 轮面试；最后，120
    人中只有 12 人加入公司。


    图 2-3


    面试流程


    每次进行招聘活动时，我们都遵循这一结构，这有助于了解我们预计会收到多少份申请。实际数字可能因团队、公司、流程而异，但准备好这些基准数字，将有助于增补资源和规划招聘活动。


    招聘活动包含以下主要步骤：


    1.  寻源

    2.  筛选

    3.  评估

    4.  入职


    由于本章已涵盖筛选和评估部分，我们来谈谈寻源。


    在我的初创公司，除了使用社交渠道和自发传播外，我并没有固定的方法。我们制作了可以在`LinkedIn`上发布的宣传页。我们向母校发送邮件，由就业协调员邀请应届毕业生申请。


    我在招聘活动中发现，尽管你招到的是新人，但你可以提升他们的技能，并按照公司需求进行塑形。他们的适应能力和学习速度远超你的想象。往往正是这些人，最终会成为你可以信赖的未来领导者。


    ## 总结


    当初我在初创公司管理一个 12 人的团队时，我给予他们充分的自主权，让他们按自己的方式行事，但流程依然得以遵循。无需我刻意制定流程，冲刺规划、回顾会议以及所有敏捷仪式都得以执行。这是因为最初的招聘是经过谨慎把关的。塑造整个公司文化的，正是你最初招聘的那
    10 个人。如果最初的人选出现失误，其影响将极为深远。最初的员工必须精挑细选。有了优秀人才作为根基，就可以奠定文化基础，确保后续招聘在态度上能效仿前人。

    '
- fmt: '# 3. Upskilling


    There are two sets of people who need upskilling and training.


    - Fresh graduates joining the team

    - Existing members of the team who need upskilling


    The employees who are continually learning are the ones who will make a mark.
    They are the ones who go on to do wonderful things. They are the ones who inspire
    others to learn.


    Learning should be a continuous process. If each day we are unable to do and learn
    something new, then we are exactly the same person as we were the previous day.
    Humanity has progressed only because humans set out to learn and experience new
    things and because they are brave enough to embark upon new and unknown journeys.
    Nothing comes out of mundane, repetitive things. Hence, upskilling should be part
    of an effective tech-driven plan in any company.


    ## Training Plan


    Team members do not always start out having equal amounts of know-how, both technically
    and functionally. There might be one person, probably the lead of the project,
    who understands most of the processes, and then there are usually a mix of technical
    experts and functional experts. A typical team starting out on a new project might
    look like Figure [3-1](#521767_1_En_3_Chapter.xhtml#Fig1).


    ![](images/521767_1_En_3_Chapter/521767_1_En_3_Fig1_HTML.jpg)


    4 stick diagrams of people. 1. A business analyst who understands the non-technical
    details. 2. A process specialist who has run operations all his life. 3. A technical
    architect who has built several systems. 4. A developer who is fresh out of college.


    Figure 3-1 Team working on a new project


    Let’s consider this representation for a new app that the team is planning to
    develop. Now, let’s say there are several such projects that are happening in
    parallel in the company, so how do we ensure that the developer who is fresh out
    of college is able to understand what the business analyst, process specialist,
    and technical architect is saying?


    It happens only with an effective training plan.


    - Day 1: Intro

    - Day 2: IT & HTML

    - Day 3: Bootstrap & Programming

    - Day 4: Javascript

    - Day 5: Frontend technologies

    - Day 6 & Day 7: Backend technologies

    - Day 8 & Day 9: Database technologies

    - Day 10: Developer operations

    - Day 11: Github/ code commit software

    - Day 12: Full Stack Development

    - Day 13: Agile & Testing

    - Day 13 - 16: Project Planning & Development


    Ensure that every fresh graduate is taken through a full-fledged training at the
    end of which there is a real-work like project. This gives them confidence and
    then takes them through real tasks that they generally go through in an actual
    project.


    ## On-the-Job Training


    If the same people who hired the candidates prepare the training material for
    on the job training, it makes it easy for the people joining to learn effectively
    because the training plan will suit the aptitude of the people who have been hired.
    The training plan preparation will differ from company to company and from project
    to project, but a typical one looks like the plan in Figure [3-2](#521767_1_En_3_Chapter.xhtml#Fig2).


    ![](images/521767_1_En_3_Chapter/521767_1_En_3_Fig2_HTML.png)


    A usual tech training plan includes an overview of the business, an introduction
    to teams, soft skills workshop, and various backend, frontend, and database technologies.
    Information on securiy awareness, project management, team structure, etiquette,
    `node`, `HTML`, `MongoDB`, `SQL`, and `OWASP`, as well as a demonstration of the
    entire strategy.


    Figure 3-2 A typical tech training plan


    On-the-job training has two approaches. Let’s assume that the task to be achieved
    is to cross an ocean; the training plan could be either one of these:


    - Swim along with the trainee until halfway across the ocean. Let the trainee
    go the remaining distance on their own.

    - Swim along with the trainee halfway across the ocean and let them go the remaining
    distance on their own, but assure them that you are there to support them and
    to carry them if they get tired while swimming.


    I’ve failed with the first approach before and now use the second approach. But
    at times, such as when you really need to test a person’s true capabilities, the
    first approach can come in handy. Still, do not use the first approach in mission-critical
    projects; instead, use it in projects where you or anyone else has the ability
    to rescue the project midway in case something goes wrong.


    If you have had an unpleasant experience in the past training employees, you might
    be hesitant to spend the time coaching them. For example, there have been multiple
    instances when I have trained someone for many months, but they ended up quitting
    eventually due to various reasons not in my control. These things hurt, especially
    when the projects that you trained them for now fall on you again. It can set
    you back by months, and you have to go through the process of hiring and training
    yet again.


    ## Summary


    You will always have adversities in a team. Someone will leave, for example. There
    is really no way to avoid this, so it is always good to be prepared. You can train
    more people for a position if you have the chance to, rather than just one person.
    Be open to communication and catch early warnings or signs that will tell you
    what is about to happen.


    # 4. People Management


    People management is defined as a set of practices that encompass the end-to-end
    processes of talent acquisition, talent optimization, and talent retention while
    providing continued support for the business and guidance for the employees of
    an organization. People management needs patience and has to be done with positivity
    and heart. There is no single formula to effective people management, but there
    are frameworks and tools that can help us in creating a good environment for the
    people working with us.


    Effective people management is not just be conducive within the team but also
    outside of the team, and if done right, it can be pervasive and can affect the
    entire company in a positive manner.


    We need to help our co-workers find their rhythm, which will help them be at their
    productive best. This is different for different people. This can’t be done by
    you as a leader alone; hence, there should be certain processes set up that can
    help you in achieving effective people management.'
  raw: '# 3. Upskilling


    There are two sets of people who need upskilling and training.


    *   Fresh graduates joining the team


    *   Existing members of the team who need upskilling


    The employees who are continually learning are the ones who will make a mark.
    They are the ones who go on to do wonderful things. They are the ones who inspire
    others to learn.


    Learning should be a continuous process. If each day we are unable to do and learn
    something new, then we are exactly the same person as we were the previous day.
    Humanity has progressed only because humans set out to learn and experience new
    things and because they are brave enough to embark upon new and unknown journeys.
    Nothing comes out of mundane, repetitive things. Hence, upskilling should be part
    of an effective tech-driven plan in any company.


    ## Training Plan


    Team members do not always start out having equal amounts of know-how, both technically
    and functionally. There might be one person, probably the lead of the project,
    who understands most of the processes, and then there are usually a mix of technical
    experts and functional experts. A typical team starting out on a new project might
    look like Figure [3-1](#521767_1_En_3_Chapter.xhtml#Fig1).


    ![](images/521767_1_En_3_Chapter/521767_1_En_3_Fig1_HTML.jpg)


    4 stick diagrams of people. 1\. A business analyst who understands the non-technical
    details. 2\. A process specialist who has run operations all his life. 3\. A technical
    architect who has built several systems. 4. A developer who is fresh out of college.


    Figure 3-1


    Team working on a new project


    Let’s consider this representation for a new app that the team is planning to
    develop. Now, let’s say there are several such projects that are happening in
    parallel in the company, so how do we ensure that the developer who is fresh out
    of college is able to understand what the business analyst, process specialist,
    and technical architect is saying?


    It happens only with an effective training plan.


    Day 1: Intro


    Day 2: IT & HTML


    Day 3: Bootstrap & Programming


    Day 4: Javascript


    Day 5: Frontend technologies


    Day 6 & Day 7: Backend technologies


    Day 8 & Day 9: Database technologies


    Day 10: Developer operations


    Day 11: Github/ code commit software


    Day 12: Full Stack Development


    Day 13: Agile & Testing


    Day 13 - 16: Project Planning & Development


    Ensure that every fresh graduate is taken through a full-fledged training at the
    end of which there is a real-work like project. This gives them confidence and
    then takes them through real tasks that they generally go through in an actual
    project.


    ## On-the-Job Training


    If the same people who hired the candidates prepare the training material for
    on the job training, it makes it easy for the people joining to learn effectively
    because the training plan will suit the aptitude of the people who have been hired.
    The training plan preparation will differ from company to company and from project
    to project, but a typical one looks like the plan in Figure [3-2](#521767_1_En_3_Chapter.xhtml#Fig2).


    ![](images/521767_1_En_3_Chapter/521767_1_En_3_Fig2_HTML.png)


    A usual tech training plan includes an overview of the business, an introduction
    to teams, soft skills workshop, and various backend, frontend, and database technologies.
    Information on securiy awareness, project management, team structure, etiquette,
    node, HTML, MongoDB, SQL, and OWASP, as well as a demonstration of the entire
    strategy.


    Figure 3-2


    A typical tech training plan


    On-the-job training has two approaches. Let’s assume that the task to be achieved
    is to cross an ocean; the training plan could be either one of these:


    *   Swim along with the trainee until halfway across the ocean. Let the trainee
    go the remaining distance on their own.


    *   Swim along with the trainee halfway across the ocean and let them go the remaining
    distance on their own, but assure them that you are there to support them and
    to carry them if they get tired while swimming.


    I’ve failed with the first approach before and now use the second approach. But
    at times, such as when you really need to test a person’s true capabilities, the
    first approach can come in handy. Still, do not use the first approach in mission-critical
    projects; instead, use it in projects where you or anyone else has the ability
    to rescue the project midway in case something goes wrong.


    If you have had an unpleasant experience in the past training employees, you might
    be hesitant to spend the time coaching them. For example, there have been multiple
    instances when I have trained someone for many months, but they ended up quitting
    eventually due to various reasons not in my control. These things hurt, especially
    when the projects that you trained them for now fall on you again. It can set
    you back by months, and you have to go through the process of hiring and training
    yet again.


    ## Summary


    You will always have adversities in a team. Someone will leave, for example. There
    is really no way to avoid this, so it is always good to be prepared. You can train
    more people for a position if you have the chance to, rather than just one person.
    Be open to communication and catch early warnings or signs that will tell you
    what is about to happen.


    # 4. People Management


    People management is defined as a set of practices that encompass the end-to-end
    processes of talent acquisition, talent optimization, and talent retention while
    providing continued support for the business and guidance for the employees of
    an organization. People management needs patience and has to be done with positivity
    and heart. There is no single formula to effective people management, but there
    are frameworks and tools that can help us in creating a good environment for the
    people working with us.


    Effective people management is not just be conducive within the team but also
    outside of the team, and if done right, it can be pervasive and can affect the
    entire company in a positive manner.


    We need to help our co-workers find their rhythm, which will help them be at their
    productive best. This is different for different people. This can’t be done by
    you as a leader alone; hence, there should be certain processes set up that can
    help you in achieving effective people management.'
  trans: '

    # 3. 技能提升


    有两类人群需要进行技能提升和培训。


    -   刚加入团队的应届毕业生

    -   团队中需要提升技能的现有成员


    那些持续学习的员工才能脱颖而出。他们往往能做出卓越成就，并激励他人共同学习。


    学习应当是一个持续的过程。如果每天无法学习新事物、掌握新技能，那么我们就与昨日毫无二致。人类之所以能进步，正是因为人类勇于学习、体验新事物，并且敢于踏上未知的旅程。平淡重复的事情无法带来任何突破。因此，技能提升应当成为任何公司有效的技术驱动计划的一部分。


    ## 培训计划


    团队成员最初在技术和功能方面的知识储备并不总是相等的。可能只有一个人（通常是项目负责人）了解大部分流程，而团队中往往既有技术专家，也有功能专家。一个典型的新项目初创团队可能如图
    3-1 所示。


    ![](img/521767_1_En_3_Fig1_HTML.jpg)


    四个小人简笔画。1. 一位理解非技术细节的业务分析师。2. 一位一生从事运营的流程专家。3. 一位构建过多个系统的技术架构师。4. 一位刚毕业的开发者。


    图 3-1 新项目团队工作图


    假设这个团队正计划开发一个新的应用。现在，假如公司内部同时有多个类似项目并行开展，我们该如何确保那位刚毕业的开发者能够理解业务分析师、流程专家和技术架构师所说的话呢？


    这只能通过有效的培训计划来实现。


    -   第 1 天：简介

    -   第 2 天：IT 与 HTML

    -   第 3 天：Bootstrap 与编程

    -   第 4 天：Javascript

    -   第 5 天：前端技术

    -   第 6 天和第 7 天：后端技术

    -   第 8 天和第 9 天：数据库技术

    -   第 10 天：开发运维

    -   第 11 天：Github/代码提交软件

    -   第 12 天：全栈开发

    -   第 13 天：敏捷与测试

    -   第 13-16 天：项目规划与开发


    确保每一位应届毕业生都参加一次完整的培训，并且培训结束时有一个类似真实工作的项目。这能给他们带来信心，然后引导他们完成在实际项目中通常会遇到的实际任务。


    ## 在职培训


    如果当初招聘候选人的同一批人来准备在职培训的教材，那么新员工就能更容易地进行有效学习，因为培训计划会契合已招聘人员的资质。培训计划的准备会因公司和项目而异，但一个典型的计划如图
    3-2 所示。


    ![](img/521767_1_En_3_Fig2_HTML.png)


    一个典型的技术培训计划包括业务概述、团队介绍、软技能研讨会，以及各种后端、前端和数据库技术。还包括安全意识、项目管理、团队结构、礼仪、`node`、`HTML`、`MongoDB`、`SQL`
    和 `OWASP` 的信息，以及整个策略的演示。


    图 3-2 一个典型的技术培训计划


    在职培训有两种方法。假设要完成的任务是横跨大洋；培训计划可以是以下两种之一：


    -   陪学员游到一半路程，让学员自己游完剩下的距离。

    -   陪学员游到一半路程，让学员自己游完剩下的距离，但向他们保证你会在那里支持他们，如果他们游累了，你会带着他们游。


    我曾经采用第一种方法，但失败了，现在改用第二种方法。但有时，比如当你确实需要测试一个人的真实能力时，第一种方法可能会派上用场。不过，不要在关键任务项目中使用第一种方法；相反，可以在那些你或其他人有能力在项目中途出现问题时挽救的项目中使用它。


    如果你过去有过不愉快的培训员工经历，你可能会犹豫是否要花时间指导他们。例如，我曾多次培训某人好几个月，但最终他们却因各种我无法控制的原因而辞职了。这些事情令人沮丧，尤其是当你为他们培训过的项目又重新落到了你头上时。这可能会让你倒退好几个月，你不得不再次经历招聘和培训的过程。


    ## 总结


    团队中总会遇到各种困难。例如，会有人离开。这确实无法避免，所以时刻做好准备总归是好的。如果可能的话，你可以为一个职位培训更多人，而不仅仅是培训一个人。保持开放的沟通渠道，捕捉那些能预示即将发生之事的早期警告或迹象。


    # 4. 人员管理


    人员管理被定义为一套实践，涵盖人才招聘、人才优化和人才保留的端到端流程，同时为业务提供持续支持，并为组织员工提供指导。人员管理需要耐心，并且必须以积极的态度和真诚的心来进行。有效的人员管理没有单一的公式，但有一些框架和工具可以帮助我们为与我们共事的人创造一个良好的环境。


    有效的人员管理不仅要在团队内部营造良好氛围，也要惠及团队之外；如果做得好，它能够产生广泛影响，并以积极的方式影响整个公司。


    我们需要帮助同事找到他们的节奏，这将有助于他们发挥最佳工作效率。这对于不同的人来说是不同的。仅凭你作为领导者一人之力无法完成；因此，应该建立一些流程来帮助你实现有效的人员管理。

    '
- fmt: '# One-on-One Meetings


    ![](images/521767_1_En_4_Chapter/521767_1_En_4_Fig1_HTML.png)


    A sketch of 2 people having a conversation over a table and having coffee. The
    first person has a laptop. The second person has a mobile and a notepad placed
    over the table.


    **Figure 4-1** One-on-one meetings


    When we are tired, there are activities that we do to help us replenish our energy
    and drive. But sometimes, no matter what activity we do, we cannot replenish.
    This is what we call *burnout*. When employees face burnout, resentment sets in.
    This can happen to the best of us. It could be because of continuous hours of
    work or due to a bad day at work.


    `One-on-one` meetings are an effective tool to understand the current state of
    co-workers and stay on top of burnout. They can help people find get their rhythm
    back when it is lost. We can’t have everything we want, but during `one-on-ones`
    we can ask for what matters to us the most.


    `One-on-one` meetings are best done in a recurring manner rather than just once.
    Specifically, it is good to have a monthly `one-on-one` meeting with your immediate
    reportees and to coach your immediate reportees to do the same with their employees.
    There are a few things to keep in mind to have effective `one-on-one` meetings:


    - Schedule the meeting.

    - Set expectations of the meeting.

    - Never be late to a `one-on-one` meeting.


    During `one-on-one` meetings, always remember to ask about morale and then try
    to understand the employee’s current state of mind. It is also important to set
    expectations of excellence. Setting expectations helps to boost morale. Never
    shy away from recognizing the wins, however small they might be. Finally, taking
    notes helps you to come back to the next `one-on-one` meeting with a lot more
    clarity. End the meeting with the following:


    - Make a list of action items.

    - Make sure to give coaching notes.

    - Set up a follow-up meeting.


    To make `one-on-one` meetings more effective, it is important to ask a few open-ended
    questions. These are questions that can open the team members’ mind and let them
    speak freely. The manager should be listening intently, noting everything that
    the team member is saying.


    Imagine asking someone “If you were to design your own work, how would that look?”
    Such an open-ended question can allow people to imagine freely and share what
    they feel. Obviously, this situation is not reached in the very first meeting.
    People take time to open up. This is where the managers can make the other person
    comfortable by answering their own questions, allowing the other person to ask
    them anything, or maybe even repeating their own questions back to them.


    # Reviews and Performance Management


    Why do we need a performance measurement process? “If we don’t know where we are
    going, any road will take us there.”


    We work and live in a performance-oriented environment. However, while the expectations
    of performance are plenty, opportunities to objectively measure the performance
    are limited. A process will enable managers and individuals to measure their respective
    individual and team performance and course correct on a real-time basis. The high-level
    objectives of this process could be to do the following:


    - Bring clarity and objectivity to performance measurement.

    - Create a cycle of regular feedback for individuals.

    - Create an opportunity for an individual to assess the strength and improvement
    areas for themselves.

    - Make rewards and recognition an objective exercise.


    What are the different roles in this process?


    ## Individual


    The individual is the person whose performance is being measured. Your responsibilities
    include the following:


    - Follow the timelines of the process diligently.

    - Be ready for monthly check-ins with your managers.

    - Update your performance measurement sheets with relevant tasks.

    - Ask your manager for a monthly check-in and a timely quarterly review.

    - Be open in your approach and seek feedback to improve your work.


    ## Reporting Manager


    The reporting manager is the boss of the individual whose performance is being
    measured. Your responsibilities include the following:


    - Follow the timelines of the process diligently.

    - Schedule and execute monthly check-ins and quarterly reviews with your team
    members diligently.

    - Provide full clarity on performance ratings for your team members.

    - Highlight the strength and development areas for your team members.

    - Prepare for your meetings in advance. Fill in your feedback in the respective
    sheets for your team members.


    ## Team’s Performance Measurement Officer


    This is the designated person on the individual’s team who is responsible for
    carrying out the process seamlessly.


    - Help individuals and managers to follow the set timelines. Make sure the teams
    and managers follow the timelines.

    - Help them understand the process or the performance measurement sheets.

    - Answer their questions and clear their doubts.

    - Prepare the quarterly performance report for the senior members of the team.


    # Structures


    One of the core principles of putting in place a successful team is putting in
    place proper structures. These structures are not to bind people in shackles but
    rather to give them guiding principles so they can work effectively utilizing
    their strengths while improving on their weaknesses.


    To enable this, teams need to have the right set of people managers who can enable
    individual contributors to work effectively.


    In essence, the manager’s job is that their team gets the right information on
    time, gets the right resources on time, removes distractions and obstacles, and
    provides full clarity on objectives and expectations. In some cases, managers
    are doers too, but the more that the manager starts to do, the more the team becomes
    ineffective and dependent on the manager. This is where it typically leads into
    micromanagement territory.


    Hence, the right structure for the team can be thought of as pods working on assignments
    and engagements where each pod has a relevance of its own and a purpose of its
    own. Obviously, this relevance and purpose should be aligned with the larger relevance
    and purpose of the team or the company. More about this will be discussed in Chapter
    [18](#521767_1_En_18_Chapter.xhtml), Scrum team.


    To achieve this structure, managers need to be very clear about what their role
    is on the team. Horizontal leaders who manage multiple verticals help the vertical
    managers to create the right structures with the right managers to manage the
    pods. They create the right structures with the right managers to manage these
    pods, giving the managers with the right tools and freedom to work in their large
    or small pods.


    Once the managers learn the skill of managing multiple pods, they can groom others
    around and below them to do the same. As the team grows, the culture of creating
    these pods and enabling managers to manage the pods takes hold.


    Then, the formula just needs to be replicated again and again.


    Structures are often confused with hierarchies and control mechanisms. On the
    contrary, structures are flexible constructs that connect people together and
    keep them in sync for a common function.


    For these structures to work in the right spirit, the leaders must practice open
    and excessive communication, both in oral and written form.


    # Summary


    Meetings, reviews, and structures go hand in hand with processes. Processes span
    both tech and nontech aspects. A tech process ensures that the technical side
    of the company is taken care of, while the nontech processes like meetings and
    reviews ensure that the people side of things is well-managed. Either of them
    taking a backseat will lead to weak structures.'
