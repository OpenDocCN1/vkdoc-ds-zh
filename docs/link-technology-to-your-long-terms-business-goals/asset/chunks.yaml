- fmt: "# Promotions and Remuneration\n\nThis section is a detailed analysis of how\
    \ an employee appraisal system could look. Ideally, everyone at the company will\
    \ go through this process.\n\nWhen does a promotion happen? Here are the three\
    \ scenarios of how a person can expect a promotion:\n\n![](images/521767_1_En_6_Chapter/521767_1_En_6_Fig1_HTML.png)\n\
    \nA text box titled we will have 3 categories where each one falls into categories\
    \ 1, 2, and 3. Category 1 lists individual contributor, associate software engineer,\
    \ and software engineer. Category 2 lists team management, associate tech lead,\
    \ and tech lead. Category 3 lists leadership, senior tech lead, and engineering\
    \ manager.\n\n*Figure 6-1* Sample categories\n\n- **Same designation**: The employee\
    \ will continue to work in the same role. The criteria for the appraisal would\
    \ be:\n  - Performance (based on review process)\n- **Same category but different\
    \ designation**: The employee gets a different designation but continues to be\
    \ in the same category. The criteria for the appraisal would be:\n  - Performance\
    \ (based on review process)\n  - Designation change increment % (+x%)\n- **Across\
    \ category**: The employee gets an opportunity to work in a different category,\
    \ and there is a change in designation and role as well. The criteria for the\
    \ appraisal would be similar to what is depicted in Figure [6-1](#521767_1_En_6_Chapter.xhtml#Fig1):\n\
    \  - Performance (based on review process)\n  - Category shift increment % (+x%)\n\
    \nHaving such a structure helps people strive toward the higher categories. It\
    \ also ensures fair promotions to those who prefer to stay as an individual contributor\
    \ rather than wanting to get into a management or leadership role. Transparency\
    \ with promotions and remuneration always helps in building a healthy workplace\
    \ environment.\n\n## Summary\n\nThe workplace experience in the post-COVID world\
    \ has been ever evolving. Effective employee relationships can be achieved only\
    \ if we connect with the employees in a productive manner by setting up the right\
    \ processes. We need to ensure that timely recognition, promotions, appraisals\
    \ are given. Productive employees are happy about the work-environment created\
    \ not just because of the work that they are doing, but also because they are\
    \ being cared for. This care will prove to be effective by the processes we set\
    \ up. And the care gets multiplied if the processes we setup is transparent to\
    \ the employees.\n\n# 7. Rituals\n\nEvery team works at a certain rhythm, and\
    \ maintaining that rhythm is possible by setting up rituals. Rituals are recurring\
    \ events or activities that help build relationships.\n\nSome rituals are formal\
    \ events that help keep track of multiple projects, while some are informal gatherings.\
    \ Each ritual should have an agenda to make it productive. In a sprint team, the\
    \ daily scrum, sprint planning, and sprint retrospection are mandatory to keep\
    \ the rhythm of the team going. These are rituals.\n\n## Daily Scrum\n\nThe daily\
    \ scrum is not a status meeting. In this meeting, each team member speaks about\
    \ three things.\n\n- What they have done in the past day\n- What they are going\
    \ to do in the next day\n- What they are stuck on and whether they need someone’s\
    \ help\n\nThe last point is the main idea behind scrum meetings. It helps unblock\
    \ any adversities that a teammate could be facing. Because this meeting is attended\
    \ by peers from the same group, it helps everyone understand if there are dependencies\
    \ that need to be addressed.\n\nAt my startup, we generally have multiple scrum\
    \ meets running for all the teams within the organization.\n\n- Teams working\
    \ on the same project and sprint where the scrum master is a project manager\n\
    - Team leads working on different projects where the scrum master is a senior\
    \ lead\n- Engineering leads working on multiple projects who meet up separately\
    \ to call out blockers where the scrum master is either an architect or a VP of\
    \ engineering\n- Special squads that are working on a project spanning multiple\
    \ teams where the scrum master is a program manager from the business team\n\n\
    Having multiple scrum meetings helps ensure that each team operates independently\
    \ and also collaboratively as each team’s representative is also part of the higher-level\
    \ scrum meetings.\n\nThe scrum master ensures that the meeting happens, but the\
    \ members are responsible for conducting the daily scrum. The scrum master teaches\
    \ the team members to keep the daily scrum within the 15-minute timebox. The daily\
    \ scrum is an internal meeting for the scrum team. If others are present, the\
    \ scrum master ensures that they do not disrupt the meeting.\n\n## Retrospective\n\
    \nThe sprint retrospective is a recurring meeting held at the end of a sprint\
    \ used to discuss what went well during the previous sprint cycle and what can\
    \ be improved for the next sprint. Figure [7-1](#521767_1_En_7_Chapter.xhtml#Fig1)\
    \ shows a sprint retrospective board.\n\n![](images/521767_1_En_7_Chapter/521767_1_En_7_Fig1_HTML.png)\n\
    \nA sketch of a woman standing on a ladder beside a board and a man sitting over\
    \ it with a laptop. Another man is walking with a pile of papers. The board lists\
    \ what went well, what needs improvement, and action items.\n\n*Figure 7-1* A\
    \ typical retrospective board\n\nThere are many ways to run a sprint retrospective.\
    \ One of the most common is to use a start-stop-continue approach. Each team member\
    \ is asked to identify the things the team should start doing, the things they\
    \ should stop doing, and the things they should continue doing.\n\nThese are questions\
    \ commonly asked in a sprint retrospective:\n\n- What went well in the sprint?\
    \ Success in an iteration can be analyzed by looking at what was done differently\
    \ to achieve it; who contributed to it and how; and what skills, training, or\
    \ knowledge made a difference.\n- What went wrong in the sprint? The point is\
    \ not to penalize the team or individual members but look at things that didn’t\
    \ go according to plan, with a view of improving performance in the future.\n\
    - What did we learn? What did the team learn in the sprint so that they can improve\
    \ their way of working?\n- How should the next sprint play out? This will determine\
    \ corrective actions to take in the next sprint, preventing the same mistakes\
    \ from occurring and making successful actions a repeatable outcome.\n\n## All-Hands\
    \ Meeting\n\nThis meeting has to be as interactive as possible. The best way to\
    \ make it interactive is by organizing multiple polls and surveys during the meeting.\n\
    \n- Always start with a set agenda and a plan about how the meeting will go.\n\
    - Conduct polls that will help people participate by guessing on the various milestones\
    \ that the organization has achieved. It could be guessing on the Year-on-year\
    \ growth in terms of revenues or profits.\n- Have multiple fun activities planned\
    \ for the meeting like “Pair and Share” breakout rooms.\n- Organize games like\
    \ virtual escape rooms to set the initial buzz among the participants.\n- Let\
    \ employees ask questions. Have enough time to listen to these questions. Many\
    \ people ask important questions when they know that there are other people who\
    \ are listening who might have similar questions but aren’t asking them.\n\nAll-hands\
    \ meetings are useful as a company grows because everyone in the company gets\
    \ the same information at the same time. All-hands meetings allow you to get your\
    \ employees aligned on the company goals and strategy. Think of every member of\
    \ your team as a vector. An all-hands meeting helps you point them in the right\
    \ direction.\n\nTalk about your company vision and mission, emphasize your values,\
    \ and review how your company is doing in terms of achieving your goals. Especially\
    \ when things get overwhelming, nothing boosts morale like talking about the highlights\
    \ and giving a shout-out to the people who helped to achieve them."
