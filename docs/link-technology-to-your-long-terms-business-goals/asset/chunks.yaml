  trans: '

    # 工具


    业务团队有多种工具可用于整合需求。你可以根据当前组织所处的实际情况，选择其中一种合适的工具。


    我曾在大型企业环境中使用过 `Confluence` 作为工具。但也用过许多其他工具，比如 `Trello`、`Asana`、`Notion`，这些工具对小型团队来说更为轻量。每种工具都有其自身的优缺点。你需要根据团队的规模和项目的复杂度来精准选择工具。毕竟，工具的好坏取决于使用它们的人。


    选择工具后的流程如下：


    1.  在工具中编写需求。

    2.  所有后续跟进工作都在工具中完成。邮件跟进将转为工具内进行。

    3.  每两周召开一次冲刺前会议。为每个团队选定具体日期。这意味着无需与开发人员和其他利益相关者安排多次会议；只需一次会议来讨论并确定优先级。

    4.  工程负责人将在指定日期前审阅编写好的文档，并提出任何修改建议，这些修改建议将在优先级讨论会议前冻结。


    # 优先级排序


    优先级排序的主要目的是让利益相关者整理出一份按顺序排列的任务清单，供实施团队参考。组织中的每个职能部门通过派遣代表来陈述理由。然后，在优先级排序会议上，该代表有机会与其他团队的代表就此任务的优先级及其原因进行辩论。这是传统的优先级排序方式。


    但近期开发出的方法使得确定任务的优先级变得更加容易。你可以使用`RICE`评分来进行优先级排序。


    `RICE`是我们用来评估每个项目创意的四个因素的英文首字母缩写。


    -   `覆盖度 (Reach)`

    -   `影响力 (Impact)`

    -   `信心指数 (Confidence)`

    -   `工作量 (Effort)`


    以下是每个因素的详细含义：


    -   `覆盖度 (Reach)`：覆盖度是指该功能可能影响的客户数量。这是相对于时间来衡量的。可能是一个季度内影响的“x”名客户，也可能是一个月内影响的交易笔数，等等。需要使用数字来量化项目的潜在影响，以得出覆盖度。

    -   `影响力 (Impact)`：这个因素无法精确衡量，但有一些模型，例如“正负效应模型”可以辅助我们。当我们说某个功能非常出色，将极大地影响客户体验时，我们可以将其评级为
    3。对于影响力较低的功能，可以设为 0.5，以此类推。

    -   `信心指数 (Confidence)`：这是利益相关者对这项功能需求能够被完成所抱有的信心。一个“登月”般宏大的功能，其信心指数可能低于 50%。一个微小的调整，比如横幅的颜色更改，信心指数可能是
    100%。但要得出一个好的`RICE`评分，诚实地评估信心指数是必要的。

    -   `工作量 (Effort)`：实施所请求功能所需的时间即为工作量评分。时间以“人月”为单位计算。如果一个任务可以由一个人在半个月内完成，那么工作量就是
    0.5。


    图 13-2 描述了计算`RICE`评分的公式。如果你将多个需求排成一列，并为每个需求添加一个`RICE`评分，最终结果将帮助你对你所提出的需求进行优先级排序。


    ![图 13-2](img/521767_1_En_13_Fig2_HTML.png)


    一个数学公式形式的表达式。`覆盖度 (Reach)`乘以`影响力 (Impact)`乘以`信心指数 (Confidence)`，整体除以`工作量 (Effort)`等于`RICE`评分。


    **图 13-2** RICE 计算器


    得出的评分衡量了“所投入时间带来的总影响力”，我们需要最大化这个值。你可以使用我设置好的电子表格来自动计算 `RICE` 评分：[`bit.ly/rice-calculator`](https://bit.ly/rice-calculator)。


    # 评审


    评审会议是利益相关者通过查看演示来评估冲刺阶段开发完成的任务的会议；该会议由 Scrum Master 与开发团队共同主持。这个演示可以是一个面向用户的完整演示，也可以是一个可模拟的演示，目的是确保会议简短且切中要点。


    图 13-3 解释了一个典型的冲刺评审会议如何进行，以及在评审会议上需要回答哪些问题。每个人都有发言权，并且必须回答图 13-3 中的三个问题。完成后，团队成员对答案进行投票。获得一定数量投票的答案会被共享，并由管理层采取行动。


    ![图 13-3](img/521767_1_En_13_Fig3_HTML.jpg)


    一次冲刺评审会议，用于产品演示，时长 1 到 2 小时，会上简要讨论诸如“完成了什么？”、“什么没完成？”以及“什么需要加入待办事项清单？”等问题。该会议应邀请产品负责人、Scrum
    Master、利益相关者和开发人员参加。网站包含复选框、切换开关、单选按钮和滑块。


    **图 13-3** 一次典型的冲刺评审会议


    在冲刺过程中，如果存在准备就绪的任务，可能还会安排其他临时的评审会议。例如，如果某些成员来自多个团队，他们可能会几乎每天都审查演示，并且比典型的冲刺团队更频繁地进行评审。


    但定期的评审可能会对项目构成威胁。原因在于，如果需求没有以客观的方式连同范围内的和范围外的部分一起良好地记录下来，那么评审会议总是有可能偏离正轨，去讨论为什么某个特定功能在当前时间点是绝对必要的。


    这时，Scrum Master 的角色就显得至关重要，他需要提请会议注意，当前的会议目标正在因讨论范围外的话题而偏离。因此，选择合适的 Scrum Master
    是必要的。这个人应该代表产品发言，而不是代表利益相关者或项目实施团队中的任何一方。


    在演示会议上，Scrum Master 会要求利益相关者批准当前状态下的产品，以判断其是否适合发布，以及是否达到了当前的“完成定义”。如果利益相关者认为某些功能应该剔除或不必要地添加，这些都应该被明确指出。因此，会议是透明的，它让双方都能就产品是否被视为就绪给出坦诚的反馈。会议的目标是进行透明地评审，并确定冲刺中所实施工作的状态。会议试图从产品角度审视四个方面。


    -   完成了什么？

    -   什么未完成，原因是什么？

    -   自项目开始以来新增的工作，以及目前的情况

    -   从冲刺中移出的工作及其原因


    会议结束后，会得出一个修订后的产品待办事项列表，这将成为实施团队在下一个冲刺中将要处理的条目集。如果在产品演示过程中发现了新的需求集，这些需求也会被加入到待办事项列表中。


    冲刺评审旨在展示整个团队（设计师、开发人员和产品负责人）的辛勤工作成果。

    '
- fmt: '# Summary


    Setting up processes is hard at first. It will take convincing, discipline, time,
    and effort to propagate the processes to the entire company. Once these processes
    are set up, the company overall will have a set template to execute tasks and
    projects much faster than what it had before these processes were set up. Executing
    ad hoc projects gives the illusion of a fast-paced company, but it truly is a
    one-off thing. A resilient company always follows and respects processes. A company
    that is here to last for hundreds of years sets up processes that can last for
    that long and adapts to newer-age processes and technologies that can help aid
    it.


    # 14. Prototyping


    Modern companies thrive on fast-paced strategies and the successful execution
    of these strategies. But this speed should not come at the expense of processes
    that have been put in place. There should be a certain way that rapid prototyping
    is done and executed. Setting up inherent structures that will help to develop
    and deploy these fast prototypes is important. The mindset of the company and
    the people should be aligned to executing such fast-paced projects. This requires
    agility, grit, and will to drive quickly and with a data-driven approach. Each
    data point when executing prototype projects is important. Datapoints enable the
    team to then decide whether the execution and strategy were good or flawed. Quick
    changes can then be done to make the strategy a full fledged one thereby enabling
    fast paced prototyping.


    ## Innovative Projects


    A business, if it is to stay competitive, needs to innovate, and it needs to innovate
    quickly. This means it needs an ability to fail fast and come up with ways to
    nail the solution quicker than the competition. For this, teams and processes
    have to be agile—more agile than anybody else.


    To move quickly, companies have adopted agile principles. Along the way, operations
    teams have undergone a huge digital transformation journey. The COVID-19 pandemic
    has accelerated the adoption to digital like never before. With so many companies
    moving completely into a remote mode, the world has been forever changed. But
    agility does not ensure scale on its own; a company needs to be cognizant of scale
    while moving to digital.


    The traditional way of looking at agile teams also has evolved over time. There
    are new structures called `squads`, `pods`, `cells`, `prides`, and `tribes` to
    describe teams. There are even `villages` and `guilds` that have formed within
    the organizations.


    These teams may have leaders who call themselves traditional managers and scrum
    masters, or they may have creative names like `shepherds`. We like to call them
    as `mentors`.


    But whatever these new names might be, they are just a new way of creating structures
    within organizations that can help in the super-fast delivery of projects that
    can also handle scale. The core idea behind these names is to ensure that people
    work together as a tight-knit group to get the task at hand done. The efficiency
    with which these squads can operate is much higher than the traditional teams.


    The squad model is also called the "Spotify model" as it was first developed by
    Spotify, the music streaming service. Spotify developed its own version of the
    scrum. Figure [14-1](#521767_1_En_14_Chapter.xhtml#Fig1) explains the Spotify
    tribes, squads and guild model. Observe that a squad can be people from the same
    tribe but span different teams, while a guild can be from across tribes.


    ![](images/521767_1_En_14_Chapter/521767_1_En_14_Fig1_HTML.png)


    Tribes 1 and 2 consist of people arranged in 4 rows and 4 columns. The first row
    in each denotes chapters 1 and 2, respectively. The first and third columns in
    tribe 1 denote squads 1 and 2\. The last person in tribe 1 and the last row of
    tribe 2 belong to Guild 1.


    **Figure 14-1** Spotify tribes, guilds, chapters, and squads


    Spotify uses Scrum, but it renamed `team` to `squad` because the company wanted
    to create a level of ownership for team members.


    At my startup, we came up with a modified version of the squad model for our own
    use and improved upon a typical scrum system. In our model, we went with the existing
    scrum model, where let''s say there are ten scrum teams spread across two business
    organizations. Then if there is a project that requires each of these teams to
    coordinate with each other, we get the leads of each of these scrum teams to form
    a squad. A typical squad consists of multiple leads from each scrum team, the
    program manager who is responsible for the delivery of the project, the QA people,
    and other members who might be needed on an ad hoc basis.


    After forming the squad, we ensure that this squad meets outside of their regular
    scrum meetings, just to ensure a smooth project. And if there are any adversities
    that this squad faces, they then approach their regular teams during their own
    scrum meetings to clarify and unblock the hindrances.


    Figure [14-2](#521767_1_En_14_Chapter.xhtml#Fig2) shows how our squads looked.
    The black-headed stick figures are the team leaders. Observe that the leader of
    Scrum 5 is enough to represent the entire Scrum 5 team in Squad 2.


    ![](images/521767_1_En_14_Chapter/521767_1_En_14_Fig2_HTML.png)


    Biz org 1 and Biz org 2 consist of people arranged in 4 rows and 5 columns. From
    left to right, the columns denote Scrum 1, 2, 3, 4, 5, 6, 7, 8, 9, and 10, respectively.
    The last 2 persons in the fourth row in biz org 1 and the fourth row in biz org
    2 denote squad 1\. The last person in biz org 1 and the fifth row in biz org 2
    denote squad 2.


    **Figure 14-2** Improvised squad model to fit into scrum teams


    For new and innovative projects, the need to react quickly to market demands and
    to transform into a digital organization drove the rise of these autonomous, self-organizing
    workgroups in our case and has yielded benefits that are far-reaching. From my
    experience, the squad model works. It results in collaboration outside of regular
    teams and efficiency that a singular team cannot achieve.


    ## Quick Turnarounds


    Organizing the teams into squads with specific goal-focused innovative projects
    leads to quick turnarounds. But with what cost? There are ongoing projects that
    are immensely important for the day-to-day business to function, and these projects
    cannot be disturbed, nor can their members. Hence, it is always better to create
    R&D teams that are functioning parallelly with the teams that already exist. These
    teams will have the flexibility and the ability to take on new challenges. Choosing
    members of this team can be done from the existing team members who are always
    ready to learn new things.


    R&D teams need to have their own daily cadence to help themselves unblock any
    new problems they might face. Typically any new project first goes to the R&D
    team so they can quickly prototype it and then pass it onto the specific squads
    or to the scrum teams, as shown in Figure [14-3](#521767_1_En_14_Chapter.xhtml#Fig3).


    ![](images/521767_1_En_14_Chapter/521767_1_En_14_Fig3_HTML.png)


    Biz org 1 and Biz org 2 consist of people arranged in 4 rows and 5 columns. From
    left to right, the columns denote Scrum 1, 2, 3, 4, 5, 6, 7, 8, 9, and 10, respectively.
    Both have additional 5 members comprising the R and D team.


    **Figure 14-3** R&D teams should be independent for each organization for efficiency


    To achieve quick turnarounds for any project, do the following:


    - Set clear milestones at the beginning of the project to keep everything on track.

    - Use the right technology. It is absolutely necessary to choose tech that the
    current team knows and is well versed with.

    - Have a daily cadence to ensure you don''t get behind schedule.'
