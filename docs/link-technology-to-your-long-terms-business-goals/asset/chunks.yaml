    confidence level for achieving the OKRs? ON or OFF track.


    Figure 11-1


    Weekly POD check-in questions


    ## Summary


    OKR platforms help to simplify the complexity of cross-team alignments and provide
    project/objective updates in real time to the concerned stakeholders. Weekly check-ins
    by the pod and leadership team can help employees understand the overall progress
    and figure out any gaps/blockers in the fulfillment of the company’s business
    objectives.


    # 12. OKR as a Continuous Process


    Once your organization adopts the OKR framework, it becomes imperative to fulfill
    the OKRs by a certain time frame for the organization to grow. Since the OKR process
    involves many stakeholders, this task of driving the process across the different
    teams is done by OKR *champions*. OKRs are not just goal setting; they are more
    about “stretch goal” setting. Stretch goals provide a new dimension to the level
    of commitment, effort, and performance by uncovering hidden strengths, giving
    rise to new opportunities.


    ## Champions


    As teams adopt OKRs, it ceases to be a framework and becomes more ingrained in
    “how we function as a team or business.” In fact, it becomes part of the organizational
    culture. This is where the role of OKR champions comes in. Champions can be internal
    OKR champions overseeing the entire OKR rollout or team champions/scouts who are
    responsible for ensuring the team or pod OKRs are on track.


    Before you select a champion for your team, here are some traits:


    *   The champion must be enthused about OKRs.


    *   The champion should be knowledgeable about the products and do extra reading
    to ensure they are up to speed about the current technology and stack that can
    help them in improving the product they are working on.


    *   The champion should onboard new members into the team and ensure they undergo
    an OKR basics training.


    *   The champion chairs all the OKR team meetings, asking powerful questions to
    keep the team on course.


    *   The champion is much like the coach, who asks the team whether the OKRs are
    stretched enough and, if any blockers persist, whether they be resolved.


    *   The champion represents their team in leadership meetings and for progress
    reports.


    Ideally, the champion on a team is not the senior-most member/manager but a high-potential
    enthusiastic future leader.


    ## Stretch Goals


    Is your OKR really stretched? This is often a question we ask ourselves and our
    teams. The way to look at OKRs is that they are not the Goldilocks ones. Remember,
    Goldilocks the little girl with the curls who wanted to eat the porridge that
    was “just right.” OKRs are not about the “just right” goals; they are about the
    stretched and aspirational ones.


    While selecting your OKRs, ask yourself these questions: Is this the best we can
    do? Would this really move the business needle? If we didn’t practice OKRs, would
    we still be doing this?


    In OKR lingo, a *stretch goal* is the high-effort, high-risk goal in the calculated
    pursuit of 10x opportunities. As Measure What Matters writes, “Conservative goal
    setting stymies innovation. And innovation is like oxygen: You cannot win without
    it.”


    Stretch goals were used by Google to overcome email data storage limitations with
    Gmail in the early 2000s. However, stretch goals don’t always have to be about
    unlimited email data storage. They can also be about ordinary work taken to extraordinary
    levels. To improve, a team must rethink problems and ask harder questions. Anything
    less doesn’t provide enough competitive advantage.


    When implemented correctly, stretch goals work to stimulate peak performance on
    teams and encourage taking calculated risks rather than stifling them. Stretch
    goals can inspire a new level of commitment, effort, and performance by uncovering
    sometimes hidden strengths. Uncovering these strengths reveals new opportunities.


    ## Summary


    Roles and goals are prerequisites in the process of driving successful OKRs.


    Goals need to be “stretched” to the extent that they uncover new levels of commitment
    and performance among the teams, leading to more innovations and opportunities.
    Once goals are defined, identifying the right set of people to drive OKRs across
    teams becomes necessary. OKR champions help to achieve the job of educating the
    teams about the team’s and company’s objectives and ensure that the team is on
    track.


