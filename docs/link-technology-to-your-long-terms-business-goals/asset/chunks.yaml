  trans: "\n# OKR 工具\n\n过去几年中，OKR 工具作为 SaaS 平台的重要性日益凸显。虽然大约有 10 名成员的初创公司可以通过电子表格来管理\
    \ OKR，但在使不同团队保持一致，并以易于理解和实时响应的格式进行汇报方面，其复杂性更适合由 OKR 平台（例如 `fitbots.com`）来管理。\n\
    在选择帮助您管理 OKR 的平台之前，请先考量以下几个重要方面：\n\n- 该平台是否简单直观，易于团队采用？\n- 您能否追踪目标、关键结果以及包含各项举措的里程碑？\n\
    - 该工具是否能够培育一种鼓励对话、反馈和赞赏的文化？\n- 团队能否通过该平台或通过互相标记寻求帮助和支持来进行协作？\n- 领导层审阅能否在高质量的对齐看板上进行？\n\
    - 该工具是否具备报告功能？例如，可以查看与某个人关联了多少个 OKR，或者能否一键完成团队 OKR 审阅？\n\n有些 OKR 工具集成了按需辅导功能，以帮助您的团队持续实践和管理\
    \ OKR。我们使用的工具是 `Fitbots`，可通过 `https://fitbots.com/` 获取。（免责声明：本书战略章节的内容主要由 `Fitbots`\
    \ 的 CEO 贡献。）\n\n## 签到会议\n\n维持 OKR 的运转需要在不同层级设置检查点。\n\n- **团队级小组签到**：小组是从不同团队中抽调出来，共同推动特定项目的一群人。\n\
    - **领导层签到**：包括审阅多个跨小组团队的目标准确进度，以查看是否存在障碍并加以解决。\n- **重新对齐**：这是每个季度末举行的重要 OKR 仪式。团队和领导层聚在一起，讨论整个季度的进展和所学到的经验教训，以便为下个季度制定更好的战略。\n\
    \n在签到会议、领导层审阅和季度末审阅中，实际会发生什么？图 11-1、图 11-2 和图 11-3 更详细地说明了这一过程。\n\n![](img/521767_1_En_11_Fig3_HTML.png)\n\
    \n一个标题为“复盘重启”的文本框。问题包括：哪些 KR 进展顺利？你为什么得到了这个结果？哪些 KR 进展不顺利，原因是什么？你从这些结果中学到了什么？在接下来的章节中，你会采取什么不同的做法？\n\
    \n**图 11-3**  \n九十天复盘重启问题\n\n![](img/521767_1_En_11_Fig2_HTML.png)\n\n一个示例性的双周领导层会议问卷包括：我们的各个公司\
