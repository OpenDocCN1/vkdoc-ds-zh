  trans: "\n# 13. 人与流程\n\n许多公司起步时执行方式混乱、缺乏结构，但随后会转向顺畅的流程驱动型执行。在这两个极端的中间地带，你会看到流程在逐步演化。这种演化是由内部人员推动的。要引入流程，必须有此前体验过这些流程益处的人。这些人随后会带领其他人踏上设置每个流程的漫长而艰巨的旅程。新流程常常会遇到阻力，但最终流程会占据上风。\n\
    \n技术驱动型公司的“项目管理”流程需要公司全体员工的认可。管理层、中层经理、运营团队、销售团队、市场营销团队和产品团队都必须遵守并尊重这些流程。在本章中，我们将讨论需求与优先级排序流程。\n\
    \n## 需求\n\n约哈里窗口是一种帮助人们更好地理解自己与自身及他人关系的技巧（图 13-1）。它由心理学家约瑟夫·勒夫特（1916–2014）和哈林顿·英格拉姆（1916–1995）于\
    \ 1955 年创立，主要作为启发式练习应用于自助团体和企业环境中。\n\n![](img/521767_1_En_13_Fig1_HTML.png)\n\n\
    一个 2x2 矩阵。第一行标题为“自己不知道”，第二行标题为“他人不知道”。第一列标题为“自己知道”，第二列标题为“自己不知道”。从左到右，从上到下，单元格依次为：公开区、盲点区、隐藏区、未知区。\n\
    \n图 13-1\n\n约哈里窗口\n\n约哈里窗口解释了为什么有效的需求收集能够解决我们正在开发产品的盲点。\n\n如果你仔细观察约哈里窗口，你会看到这四个区域（公开区是众所周知的，因此无需讨论）：\n\
    \n*   *公开区*：这些是需求提出者和需求执行者都熟知的特性。\n*   *盲点区*：这些代表了需求提出者感知到，但需求执行者未感知到的内容。\n* \
    \  *隐藏区*：这些是需求提出者要么未意识到，要么不真实，但需求执行者却知道的事情。\n*   *未知区*：它们代表了所有参与者都未认识到的行为或动机——要么是因为它们不适用，要么是因为对这些特性的集体无知。\n\
    \n在着手任何项目之前，这些区域都需要进行讨论、辩论和理解。盲点区、隐藏区和未知区构成了项目理解的 75%。这意味着只有 25%的产品特性是需求提出者和需求执行者都清楚的。\n\
    \n需求优先级排序使得业务团队无需为每条需求单独寻求开会时间，就能独立构想需求。优先级排序允许对每条需求的业务优先级进行列举和讨论。\n\n*   业务团队可以提出并发布新功能，用时更少，因为沟通将更加结构化和文档化。\n\
    *   业务团队可以理解其他业务团队的不同优先级，并帮助重新排列需要立即关注的任务的优先级。\n*   需求优先级排序会议将确保在邮件/群组/频道中不会丢失任何沟通信息，因为所有排好优先级的需求都可以在需求优先级排序会议上看到，并且可以在一次会议中进行讨论和理解。\n\
    \n在撰写本文时，大多数利益相关者提出的需求都是原始格式的，侧重于需求本身的结果，而非讨论这些需求所驱动的整体公司指标。以原始格式编写的需求要求执行这些需求的人员理解执行这些需求所带来的指标。\n\
    \n如表 13-1 所示，需求文档由一位利益相关者负责，他记录了某个特定功能或产品的需求，以及执行计划的细节。每份需求文档应包含多个参与者，各自发挥作用，如表\
    \ 13-1 所述。\n\n表 13-1\n\n典型需求文档中的元数据\n\n| 目标发布版本 | 1975-02-01 |\n| --- | --- |\n\
    | 史诗 | 驱动客户访问量 |\n| 文档状态 | 草稿 |\n| 文档负责人 | 业务分析师 1 |\n| 设计师 | 设计师 1 |\n| 技术负责人\
    \ | 负责人 1 |\n| 技术文档工程师 | 业务分析师 1，产品经理 1 |\n| 质量保证 | 质量保证专员 1 |\n| 目标 | 更改横幅颜色，以推动安装量增加\
    \ x% |\n\n需求文档还需要包含以下要素：\n\n*   明确撰写的目标，并附带该需求旨在驱动的指标\n*   驱动目标的成功指标\n*   利益相关者所做的假设\n\
    *   里程碑\n*   分解为更小单元的需求\n*   利益相关者可能提出的、并带到优先级排序讨论中来的开放性问题\n*   需求范围之外的任何内容\n\
    *   作为额外奖励的需求延伸目标\n*   用户交互与设计\n\n通常，在编写需求时，我们倾向于只用一句话，例如“将横幅颜色从绿色改为红色，以便让更多人注意到它。”\n\
    \n通过引用一个写得不好的需求，下面的段落试图对其进行纠正。下面是我们如何根据这个需求来编写需求文档的方法：\n\n*   *需求范围之外的内容*：这仅应在已确定的其中一个页面上执行，而非所有页面。\n\
    *   *作为额外奖励的需求延伸目标*：有一种简单的方法可以开启/关闭实验，而无需在生产环境中进行代码更改。\n*   *用户交互与设计*：使用网页的线框图。\n\
    *   *开放性问题*：\n    1.  这种颜色会被视为错误提示吗？我们如何获取用户反馈？\n    2.  在实验进行期间，我们如何为此收集分析数据？\n\
    *   *目标*：通过将颜色从绿色改为红色，将横幅的点击次数增加 5%。\n*   *成功指标*：将每日付费用户增加 2.5%。\n*   *假设*：红色更醒目；因此，人们更有可能点击它。\n\
    *   *里程碑*：首先在 5%的用户身上将此作为 A/B 测试运行，一旦成功，再对 100%的用户启用。因此，这个项目有两个里程碑：实验阶段和发布阶段。\n\
    *   *需求*：\n    1.  将横幅颜色从绿色改为红色，并将其作为实验面向 5%的用户发布，并分享结果。\n    2.  根据两个标准衡量实验结果。实验的测试版本是否将点击次数增加了\
    \ 5%，并将每日付费用户数量增加了 2.5%？\n    3.  基于前一点（b）的结果，继续将其实施至 100%的用户。如果前一点（b）在统计上不显著，则搁置该实验。\n\
    \n如果你通读以上需求，会发现其中没有任何模棱两可的地方。这些需求涵盖了所有方面，使团队能够无需更多疑问即可实施需求。需求是清晰的，当实施它们的团队遇到不确定的事情时，他们会将其添加到评论中，并在优先级排序会议上提问。\n\
    \n在需求文档方面，过度沟通总比沟通不足、任由团队自行摸索要好。\n\n有多种工具可以帮助轻松收集和记录需求流程，我们将在下一节中讨论。\n"
- fmt: '# Tools


    There are multiple tools for consolidating requirements by business teams. You
    can choose one depending on what is suitable for the current situation your organization
    is in.


    I have used `Confluence` as a tool in a large setting. But I’ve used many other
    tools like `Trello`, `Asana`, `Notion` which are lightweight for smaller teams.
    Each tool has its own advantages and disadvantages. You’ll want to zero in on
    a tool based on the size of the team and the complexity of the project. After
    all, the tools are only as good as the people using them.


    The process after choosing a tool is as follows:


    1. Requirements are written in the tool.

    2. Every follow-up will be done in the tool. Email follow-ups will change to the
    tool.

    3. Have pre-sprint meetings biweekly. Select a specific day for each team. This
    means that there is no need to schedule multiple meetings with developers and
    other stakeholders; there is just one meeting to discuss and agree priorities.

    4. Engineering leads will review the documents written before the designated day
    and propose any edits that will be frozen before the prioritization meeting.


    # Prioritization


    The main purpose of prioritizing tasks is for the stakeholders to come up with
    an ordered list of tickets for consideration by the implementing team. Each function
    in the organization makes a case by sending their representative. The representative
    then gets an opportunity during the prioritization meeting to argue about their
    ticket’s priority and why with the representatives of the other teams. This is
    the traditional way of prioritization.


    But recently developed methods have made deciding upon the priority of tasks easier.
    You can use a `RICE` score for prioritization.


    `RICE` is an acronym for the four factors we use to evaluate each project idea.


    - `Reach`

    - `Impact`

    - `Confidence`

    - `Effort`


    Here’s what each one means in detail:


    - `Reach`: Reach is the number of customers the feature might be impacting. This
    is valued against time. It could be “x” number of customers impacted in a quarter,
    it could be the number of transactions impacted in a month, and so on. The possible
    impact of the project needs to be quantified with numbers to come up with reach.

    - `Impact`: This is not accurately measurable, but there are models such as “Positive
    and negative effect model” that can help us. When we say a feature is a killer
    that will massively impact the customer experience, then we can rate it as a 3.
    For something that is a low impact, it could be 0.5, and so on.

    - `Confidence`: This is the confidence the stakeholder has that this feature request
    will get done. A feature that is shooting for the moon feature will be less than
    50 percent. A small tweak like a color change of the banner would be 100 percent.
    But being honest with the confidence score is necessary to come up with a good
    `RICE` score.

    - `Effort`: The time taken to implement the feature that is requested is the effort
    score. The time is calculated in person-months. It would be 0.5 if the task can
    be accomplished by one person in half a month’s time.


    Figure [13-2](#521767_1_En_13_Chapter.xhtml#Fig2) describes the formula with which
    a `RICE` score is calculated. If you line up multiple requirements and then add
    a `RICE` score against each requirement, the end result will help you prioritize
    the requirements you have come up with.


    ![Figure 13-2](images/521767_1_En_13_Chapter/521767_1_En_13_Fig2_HTML.png)


    An expression in the form of a mathematical equation. `Reach` times `Impact` times
    `Confidence` completely over `Effort` equals `RICE` Score.


    **Figure 13-2** RICE calculator


    The resulting score measures “total impact for time worked,” and we need to maximize
    this. You can use a spreadsheet that I have set up to calculate the `RICE` score
    automatically: [https://bit.ly/rice-calculator](https://bit.ly/rice-calculator).


    # Reviews


    The review meeting is one where the stakeholders will review the sprint-developed
    tasks by looking at the demo; the meeting is led by the scrum master along with
    the development team. This demo could be a full-fledged user-facing demo or one
    that can be simulated to ensure that the meeting is short and to the point.


    Figure [13-3](#521767_1_En_13_Chapter.xhtml#Fig3) explains how a typical sprint
    review meeting happens as well as the questions that need to be answered in a
    review meeting. Each person has a say in it and has to answer the three questions
    in Figure [13-3](#521767_1_En_13_Chapter.xhtml#Fig3). Once done, the team members
    vote on the answers. The answers that get a certain set of votes are then shared
    across and acted upon by management.


    ![Figure 13-3](images/521767_1_En_13_Chapter/521767_1_En_13_Fig3_HTML.jpg)


    A sprint review meeting, takes place for the product demo for 1 to 2 hours, and
    questions like what was done? what wasn''t done? and what goes into the backlog?
    are discussed briefly. The meeting should involve the product owner, scrum master,
    stakeholders, and developers. The website has checkboxes, toggle switches, radio
    buttons, and sliders.


    **Figure 13-3** A typical sprint review meeting


    There could be other ad hoc review meetings that can be scheduled between the
    sprint process in the case of go-live ready tasks. For example, if there are certain
    people who are from multiple teams, then they could be looking at the demo almost
    on a daily basis and reviewing it more often than a typical sprint team.


    But regular reviews can pose a threat to projects. The reason is that if the requirements
    are not well documented along with the in-scope and out-of-scope parts in an objective
    way, there is always a possibility that the review meeting can go astray into
    discussions about why a certain feature is absolutely necessary at this point
    in time.


    This is where the role of the scrum master becomes extremely crucial to bring
    to notice that the objective of the meeting is being deviated by discussing out-of-scope
    topics. Hence, choosing the right scrum master is necessary. It should be someone
    who speaks on behalf of the product, and not on behalf of either of the two teams,
    in other words, stakeholders or the people implementing the project.


    During the demo meeting, the scrum master will ask the stakeholders to approve
    of the product in the current state to see whether it is fit to be shipped and
    if it meets the definition of done at this point. If at any point the stakeholders
    feel that there are features that should be stripped off or added unnecessarily,
    these are called out. Hence, the meeting is transparent in that it lets both parties
    give open feedback about whether the product is considered ready. The goal of
    the meeting is to review transparently and determine the status of the work implemented
    in the sprint. There are four things that the meeting tries to look at from a
    product perspective.


    - What has been done?

    - What has not been done, and why?

    - Work that has been added since the project started and now

    - The work removed from the sprint and the reasons for that


    After the meeting ends, a revised product backlog is arrived at, and this becomes
    the set of items that would be picked up by the implementation team for the next
    sprint. If a new set of requirements was figured out while the product was being
    demoed, then that goes into the backlog as well.


    A sprint review is about demonstrating the hard work of the entire team: designers,
    developers, and the product owner.'
