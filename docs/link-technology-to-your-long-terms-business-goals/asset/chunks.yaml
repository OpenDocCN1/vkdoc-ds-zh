- fmt: '# 5\. Rewards and Recognition


    The key to maintaining good relations with people in a professional environment
    is to praise the extra efforts that people are putting in. This will encourage
    their growth and in turn impact the team’s development. This also means that the
    company matures because of the support provided by people who are encouraged to
    learn and grow. Recognizing employees in a consistent manner will go a long way
    to improving and sustaining good relations with employees. This chapter explains
    how to do it and cultivate it as a habit for the entire team.


    ## Quarterly Rewards


    At my startup, we initially did not have a quarterly awards meeting. We would
    instead have an all-hands meet during which we would recognize the best performers
    on a more ad hoc basis. Not having a set criteria could lead to two things:


    *   The rewards being biased

    *   The rewards not being taken seriously as only recently high-performing candidates
    could be chosen instead of more consistent ones


    This led us to come up with a quarterly rewards ceremony. Initially we combined
    all the teams and gave out rewards in the following categories:


    *   Performer of the quarter

    *   Rookie performer of the quarter (for fresh grads)

    *   Star performer of the quarter

    *   Lead of the quarter


    After a while, we realized it was apt to add more categories and be more specific
    when offering rewards as people then strive to win in a particular category of
    the award. Hence, we came up with the following categories:


    *   Mentor of the quarter

    *   Rookie performer of the quarter (for fresh grads)

    *   Code ninja of the quarter

    *   Code reviewer of the quarter

    *   Best lead, on-time delivery

    *   Best lead, customer centricity

    *   Automation roller


    Being specific helps to recognize and reward core competencies. This also removes
    any ambiguity about why a certain person deserved a recognition. We also ensure
    that there is a special recognition given to people who mentor new employees and
    people who seek help. These are the people who make the team tick. Hence, our
    emphasis has always been on team mentors rather than on team managers. Especially
    in tech, the management of people is 5 to 10 percent of the job, while mentoring
    them is 90 to 95 percent of the work when you are a lead.


    Choosing who gets an award could be based on a poll that also gives more weight
    to the vote given by the lead or the senior members of the team. Once the rewards
    are given, it is necessary to give a certificate; Figure [5-1](#521767_1_En_5_Chapter.xhtml#Fig1)
    shows an example.


    ![](images/521767_1_En_5_Chapter/521767_1_En_5_Fig1_HTML.png)


    A sample acknowledgment certificate with the organization''s logo, the best lead
    for customer-centricity, and the person''s name should be included in the same.


    **Figure 5-1** Sample certificate


    These certificates can vary from company to company or from team to team, but
    the basic elements remain the same. You can use an online tool to create them
    based on the company’s theme or have an internal design team to quickly make you
    a template.


    ## Ad Hoc Rewards and Recognition


    When we are working with tech tools that help us communicate and collaborate,
    it is easy to find integration tools that will help in giving on-the-spot awards.
    We use a tool that is integrated with Slack that allows us to give a “Pat on the
    back” or kudos to people. Such features help co-workers recognize those who are
    helping them out when they are in need.


    It is important to then post the results of the people who have received the highest
    number of “Pats on the back,” as well as those who have given the highest number
    of “Pats on the back.” These “Pats on the back” can be replaced by any other cool
    name as well. But having this ad hoc recognition empowers co-workers and encourages
    them to praise co-workers.


    You can then consolidate the rewards given on a monthly basis on a leaderboard,
    which can inspire people to work toward an award. Figure [5-2](#521767_1_En_5_Chapter.xhtml#Fig2)
    shows a sample leaderboard.


    ![](images/521767_1_En_5_Chapter/521767_1_En_5_Fig2_HTML.png)


    Employee motivation can be increased by using a sample recognition leaderboard
    as displayed with the catchphrase pats on the back.


    **Figure 5-2** Sample leaderboard of “Pats on the back” or kudos


    ## Summary


    My company has sustained an awards ceremony over multiple quarters. The positive
    effect has impacted not just our own team but other teams as well. Employees look
    at these awards as something they want to earn because they see individuals posting
    their certificates on various social media platforms. The individuals on the team
    who win the award are then seen as someone who has gone above and beyond.


    # 6\. People Processes


    For techies like me, coding and managing technology tools is the easiest part
    of work. People management for me happens through a lot of mistakes and learning.
    The one thing that separates techies from pure-people managers is the on-the-ground
    reality. At the end of the day, only techie managers can measure the productivity
    of their employees, while improving employee wellness can be done through processes.


    ## Manager-Reportee Employee Relations


    Always use a data-driven approach while dealing with employee relations. Opt for
    tools that will help get anonymous feedback from employees on a timely basis.
    Also make it transparent to the employees that the feedback is anonymous. Creating
    the right employee experience is difficult. It is even harder in remote and hybrid
    work settings. Moreover, annual engagement surveys look at the past year and leave
    unanswered questions. By the time managers can react to the feedback, the data
    is already stale.


    Leverage the help of employee experience tools or platforms that can help drive
    cultural change in a positive way. Agnya is an employee experience platform that
    makes it fun for employees to give actionable feedback that managers can implement.
    Such tools can help you achieve the following:


    *   Enable your employees to be lifelong learners by challenging them

    *   Develop your managers into highly capable people leaders

    *   Align your workforce toward the shared organizational values

    *   Drive meaningful employee experiences through personalized interventions backed
    by data and insights


    In times of remote work, you need to appreciate employees across teams and departments.
    This builds positive value and helps improve productivity. You need to ensure
    the following:


    *   Appreciate your teams by introducing fun into every day

    *   Appreciate small and big actions alike

    *   Reinforce your own values through peer recognition

    *   Design and execute reward and recognition strategies to drive essential behaviors
    and outcomes


    To ensure you collect timely and actionable feedback that is anonymous, you can
    deploy tools and collect continuous feedback. Specifically, you can do the following:


    *   Remove friction points that cause employees to stop giving feedback

    *   Collect employee feedback in the form of their natural experiences rather
    than a scale of 1–5

    *   Enable feedback collection on platforms your teams use such as Slack, MS Teams,
    Google, or email

    *   Make the entire organization part of the change process'
