- fmt: '### Winner: Extract, Transform, and Load


    Figure [19-3](#521767_1_En_19_Chapter.xhtml#Fig3) depicts what an extract, transform,
    and load (ETL) model looks like. This removes the dependency on synchronous API
    calls and load on database.


    ![](images/521767_1_En_19_Chapter/521767_1_En_19_Fig3_HTML.png)


    `User profile service` inputs to `user profile database`. The output is the `Scheduled
    ETL` process. `Transactions service` inputs to `transaction database` along with
    `Scheduled ETL`.


    **Figure 19-3** ETL model


    ETL entails synchronizing data via background processes on a predefined schedule.
    This data can be pushed or pulled. Only backend ETL processes need database access.
    It is asynchronous, meaning services can execute without waiting for a "callback."


    This integration pattern also hides implementation details nicely. It provides
    reasonable decoupling because the services are not dependent upon one another''s
    uptimes. Live users don''t get affected by the uptimes or the processing time.


    The ETL processes have to change with the source and destination databases. With
    ETL integrations, data consistency depends on the schedule and duration. Figuring
    out the change delta could get too complicated. In these situations, the teams
    fall back on pushing the entire dataset out. That makes processes very long-running,
    significantly undermining their usefulness.


    Reporting services are a natural fit for this type of integration. These processes
    have their place but usually get very involved with time. They should be used
    only when the stale data is acceptable in the system.


    ### Summary


    All companies, big or small, rely on data to understand their potential. A small
    shop owner goes through the profits made on a daily basis and then understands
    when it is the off-season. They then use the data to make relevant decisions.
    Similarly, bigger companies have to invest in good data-driven architecture to
    make sense of their data. Both real-time and past data analytics are important
    aspects for understanding the company''s fortunes or misfortunes.


    ## Part V Processes


    # 20. Data Security


    In the current world, we have moved toward cloud and cloud-native architectures,
    both for the platform and the infrastructure. Therefore, data security, as well
    as continuous application security, will focus on cloud-native security. The security
    must be built into the assets that you are working to secure. Integrated security
    also enables your workload to be mobile, from the cloud.


    ### Business Challenges


    The recent digital transformation in industry has profoundly altered every aspect
    of how today''s businesses operate and compete. The sheer volume of data that
    enterprises create, manipulate, and store is growing, which drives a greater need
    for data governance. In addition, computing environments are more complex than
    they once were, routinely spanning the public cloud, the enterprise data center,
    and numerous edge devices ranging from Internet of Things (IoT) sensors to robots
    and remote servers. This complexity creates an expanded attack surface that''s
    more challenging to monitor and secure.


    At the same time, consumer awareness of the importance of data privacy is on the
    rise. Fueled by increasing public demand for data protection initiatives, multiple
    new privacy regulations have recently been enacted, including Europe''s General
    Data Protection Regulation (GDPR). These rules join longstanding data security
    provisions like the Health Insurance Portability and Accountability Act (HIPAA),
    protecting electronic health records, and the Sarbanes-Oxley (SOX) Act, protecting
    shareholders in public companies from accounting errors and financial fraud. With
    maximum fines in the millions of dollars, every enterprise has a strong financial
    incentive to ensure it maintains compliance.


    The business value of data has never been greater than it is today. The loss of
    trade secrets or intellectual property (IP) can impact future innovations and
    profitability. So, trustworthiness is increasingly important to consumers, with
    a full 75 percent reporting that they will not purchase from companies they don''t
    trust to protect their data.


    ### Data Security Strategies


    A comprehensive data security strategy incorporates people, processes, and technologies.
    Establishing appropriate controls and policies is as much a question of organizational
    culture as it is of deploying the right tool set. This means making information
    security a priority across all areas of the enterprise.


    #### Physical Security of Servers and User Devices


    Regardless of whether your data is stored on-premises, in a corporate data center,
    or in the public cloud, you need to ensure that facilities are secured against
    intruders and have adequate fire suppression measures and climate controls in
    place. A cloud provider will assume responsibility for these protective measures
    on your behalf.


    #### Access Management and Controls


    The principle of "least-privilege access" should be followed throughout your entire
    IT environment. This means granting database, network, and administrative account
    access to as few people as possible and only those who absolutely need it to get
    their jobs done.


    #### Application Security and Patching


    All software should be updated to the latest version as soon as possible after
    patches or new versions are released.


    #### Backups


    Maintaining usable, thoroughly tested backup copies of all critical data is a
    core component of any robust data security strategy. In addition, all backups
    should be subject to the same physical and logical security controls that govern
    access to the primary databases and core systems.


    #### Employee Education


    Training employees in the importance of good security practices and password hygiene
    and teaching them to recognize social engineering attacks can transform them into
    "human firewalls" that can play a critical role in safeguarding your data.


    #### Network and Endpoint Security Monitoring and Controls


    Implementing a comprehensive suite of threat management, detection, and response
    tools and platforms across your on-premises environment and cloud platforms can
    mitigate risks and reduce the probability of a breach.


    ### Security Plan


    Infrastructure security means securing the cloud infrastructure of a company that
    has cloud assets on services like `Google Gsuite`, `Amazon Web Services` etc.
    It encapsulates providing visibility across cloud accounts scattered across the
    cloud infrastructure. It also sets up the process for ownership of data security,
    alerts, and automated remediation.


    - **Visibility in cloud accounts**: Cloud visibility is the ability to have a
    detailed view of all activity in your cloud by which you can identify security
    threats and inefficient performance.

    - **Data security**: The plan includes who is responsible for data security and
    incident response preparations.

    - **Security process**: You should have a detailed process for the three important
    role players of security, i.e., people, process (static), and technology.

    - **Managed detection and response**: The detection and response should be documented,
    and drills should be done to ensure that the team is ready to enact an immediate
    and efficient response to threats when they happen.


    ### Roles and Responsibilities of a Security Team


    The following are the responsibilities of a security team:


    - Help maintain security awareness programs and ensure that engineers stay informed
    annually of the top security risks and best practices

    - Create security policy, standards, procedures, and guidelines for engineering
    to consume

    - Perform security reviews of products and services

    - Measure and grow security maturity across your engineering teams

    - Triage security issues and provide recommended fixes

    - Facilitate independent security assessments and penetration tests

    - Evaluate new tools, processes, and frameworks; drive adoption of the best ones

    - Provide infrastructure and application security'
