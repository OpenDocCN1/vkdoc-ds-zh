- fmt: '# Innovation


    Innovation can be driven at any level in the organization. At a software developer
    level - improving the runtime of the code from 1 second to 100 millisecond is
    something that can be done by adding extra efforts and thinking innovatively about
    the runtime. At a product management level - understanding the key customer pain
    points by collating all the customer service calls received by the team and addressing
    them through right product intervention is an innovation that will yield long
    term results. Fostering innovation at an individual level will lead to teams thinking
    innovatively for a product’s improvement thereby leading to the business growth.


    So, while failing, we need to make sure that we fail as many times as possible
    and fail fast so we have enough time to fail again, in a different way.


    The factors driving any organization or an individual are not the traditional
    triangle of championing constraints and quality and value; instead, the triangle
    is a prism. Adding an additional dimension of innovation to the standard triangle
    completes the prism, as shown in Figure [18-1](#521767_1_En_18_Chapter.xhtml#Fig1).


    ![](images/521767_1_En_18_Chapter/521767_1_En_18_Fig1_HTML.jpg)


    Illustration of innovation technology teams. A two-dimensional triangle with value,
    constraints, and quality on each vertex is marked as the wrong representation.
    A three-dimensional pyramid with value, constraints, quality, and innovation marked
    on each vertex is mentioned as the correct representation.


    Figure 18-1


    Innovation as another facet to an organization’s drive


    Once your team has formed, is innovating, and is comfortable, the team tends to
    relax. Then suddenly, there is change.


    # Change Management


    Change management is something that all companies need to have a process for.
    Figure [18-2](#521767_1_En_18_Chapter.xhtml#Fig2) shows the typical emotional
    responses to change, or something bad that happens to us.


    ![](images/521767_1_En_18_Chapter/521767_1_En_18_Fig2_HTML.jpg)


    A graph with a wave. Y-axis denotes emotional response with the positive Y-axis
    denoting active and the negative axis denoting passive. The x-axis denotes time.
    From left to right, the peaks and troughs denote stability, immobilization, denial,
    anger, bargaining, depression, testing, and acceptance.


    Figure 18-2


    Various stages of change


    The stages are as follows:


    1. *Shock*: This is initial paralysis at hearing the bad news.

    2. *Denial*: This is trying to avoid the inevitable.

    3. *Anger*: This is a frustrated outpouring of bottled-up emotion.

    4. *Bargaining*: This is seeking in vain for a way out.

    5. *Depression*: This is the final realization of the inevitable.

    6. *Testing*: This is seeking realistic solutions.

    7. *Acceptance*: Finally, this is finding the way forward.


    The time spent on each point on the curve can vary. If it’s us who are stuck in
    one of the points of the sine curve, adapting to changes has to be quick; if not
    then we end up in a loop which makes it hard for us to come out. If we can sail
    through the curve as fast as we can, we are safe.


    Changes in any person/organization take time to settle in, but we should not resist
    change. Change offers us opportunities to learn new things always. We need to
    accept change; adaptability is the key.


    Now that we have established why each of these factors is important, let’s understand
    what drives the agile process in an organization.


    # Scrum for Tech Team


    Scrum is an agile development method that concentrates specifically on how to
    manage tasks within a team-based development environment.


    ## What is Scrum from a Tech Team’s Angle


    The following are characteristics of scrum:


    * Each iteration of scrum is a sprint.

    * A product backlog is a list where all details are entered to get the end product.

    * During each sprint, the top user stories of a product backlog are selected and
    turned into a sprint backlog.

    * The team works on the defined sprint backlog.

    * The team checks on the daily work.

    * At the end of the sprint, the team delivers the product functionality.


    Figure [18-3](#521767_1_En_18_Chapter.xhtml#Fig3) explains the scrum process and
    various stages of a scrum.


    ![](images/521767_1_En_18_Chapter/521767_1_En_18_Fig3_HTML.png)


    A ribbon-shaped diagram for agile scrum cycle. Anti-clockwise from the bottom,
    the steps are requirements, design, develop, test, deploy, and review.


    Figure 18-3


    An agile scrum cycle


    ## Scrum Master


    A scrum master is a team leader. They extend their services to the product manager
    and development team. The following sections list the scrum master’s responsibilities.


    ### Scrum Master Responsibilities and Services to the Product Owner


    The following are the responsibilities to the product owner:


    * The scrum master helps the product owner manage the product backlog effectively
    and devise the techniques to do so.

    * They help the product owner to communicate the clear product needs to the development
    team.

    * They ensure that the product owner understands how to manage the product backlog
    and maximize the value.

    * They facilitate scrum events.


    ### Scrum Master Responsibilities Toward the Development Team


    The following are the responsibilities to the development team:


    * The scrum master mentors and coaches the team to follow the scrum rules.

    * They help to remove roadblocks and impediments to aid in the team’s progress.

    * They help the team to deliver high-value results and maintain team dynamics.

    * They facilitate scrum events and scheduling scrum meetings.

    * They coach the team to adopt the scrum framework, especially if the team is
    new to scrum rules.

    * Also, a scrum master plans for scrum implementation in the organizations and
    helps people who are stepping into an agile environment or adopting scrum.


    ### Product Owner


    The product owner creates the product backlog, prioritizes the backlog, and is
    responsible for delivering the functionality at each iteration.


    ### Scrum Team


    The team manages its own work and organizes the work to complete the sprint or
    cycle.


    ### Communication Cadence


    Ideally we should have a workflow where regular emails are sent to stakeholders.
    Here is what I recommend:


    * *Day 1*: Email with details on the sprint

    * *Day 5*: Email to stakeholders on update, progress, and issues and any actions
    that need to be taken

    * *Day 10*: Email with what was released, release notes, what was pushed, and
    why, with a calendar block for the retrospective


    ### Escalation Process


    Escalations about a service delivery promised by a businesses require a Standard
    Operating Procedure (SOP) to be followed. The following paragraph is a typical
    SOP for a technical service delivery failure related escalation.


    This is the escalation process:


    1. The sprint owner is the go-to person for feature prioritization.

    2. The engineering or design lead or any other lead is the first point of contact.
    The request will then go to their manager.

    3. If things still need to be looked into, the manager’s manager will be involved.

    4. Finally, the functional head will be brought in. The more number of times issues
    occur, the more you need to improve your process.


    ### Overall Review Process


    Every quarter there should be a retrospective on all sprints. They should be evaluated
    on these parameters:


    * Frequency of features that were moved

    * Frequency of escalations that were raised

    * Frequency of missed timelines and/or scope

    * Frequency of inadequate documentation

    * Frequency of lack of adherence to process and communication

    * Key project metrics quarter over quarter'
