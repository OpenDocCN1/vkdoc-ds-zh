    Over the past few years, OKR tools have started gaining prominence as SaaS platforms.
    While startups with about 10 members can manage OKRs on spreadsheets, the complexity
    of getting different teams aligned and reporting in a consumable and real-time
    format is better managed by OKR platforms (e.g. fitbots.com).


    Before you select a platform to help you manage OKRs, look for some important
    aspects:


    *   Is the platform simple and intuitive for teams to adopt?


    *   Can you track objectives, key results, and milestones with initiatives?


    *   Does the tool foster a culture of conversations, feedback, and appreciation?


    *   Can teams collaborate either through the platform or by tagging each other
    for help and support?


    *   Do leadership reviews happen with high-quality alignment boards?


    *   Does the tool have reporting capabilities? For example, how many OKRs are
    associated with an individual, or can you do a team OKR review with one click?


    Some OKR tools that are integrated with on-demand coaching to help your teams
    sustain and manage OKRs. The tool that we used was Fitbots, available at [`https://fitbots.com/`](https://fitbots.com/).
    (Disclaimer: the content for the strategy chapters in this book was largely contributed
    by the CEO of Fitbots.)


    ### Check-in Meetings


    Sustaining OKRs requires check points at different levels.


    *   *Team-level pod check-ins*: Pods are a bunch of people identified from different
    teams who are driving specific projects.


    *   *Leadership level check-ins*: These include reviewing the teams across multiple
    pods on progress of the objectives. To see if there are blockers and to address
    them.


    *   *Re-alignment*: This is a significant OKR ritual that happens at the end of
    every quarter. Teams and leadership get together to discuss their progress and
    learnings of the entire quarter to better strategize for the next quarter.


    What really happens during check-in meetings, leadership reviews, and end-of-quarter
    reviews? Figure [11-1](#521767_1_En_11_Chapter.xhtml#Fig1), Figure [11-2](#521767_1_En_11_Chapter.xhtml#Fig2),
    and Figure [11-3](#521767_1_En_11_Chapter.xhtml#Fig3) explain the process in more
    detail.


    ![](images/521767_1_En_11_Chapter/521767_1_En_11_Fig3_HTML.png)


    A text box titled Retro Reboot. The questions are where K R''s went well. Why
    did you get the result you did. Which K R''s did not go well and why. What have
    you learned from the results? What would you do differently in the next chapter?


    Figure 11-3


    Ninety-day retro reboot questions


    ![](images/521767_1_En_11_Chapter/521767_1_En_11_Fig2_HTML.png)


    A sample biweekly leadership meeting questionnaire includes where are we with
    each company''s OKRs? How likely is it that the OKRs will be met by the end of
    the quarter? Are there any additional resources needed? Charges will be made in
