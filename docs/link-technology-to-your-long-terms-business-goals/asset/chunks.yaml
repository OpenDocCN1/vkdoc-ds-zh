    more difficult to change and expensive to scale. Defining the data ownership and
    updating the schema can become a messy process—every change requires re-compiling
    and deploying all of the services. It pushes toward highly orchestrated, big-bang-style
    deployments. This type of integration can create significant obstacles in maintaining
    the autonomy of microservices.


    Under the needs of high scale, the only option is to throw more hardware at the
    database, and even then it becomes difficult to avoid deadlocks in the database
    and row-level contentions.


    #### Synchronous API Calls


    Figure [19-2](#521767_1_En_19_Chapter.xhtml#Fig2) explains how communication between
    different microservices can happen through synchronous API calls. It gives a way
    to speak to each of these services.


    ![](images/521767_1_En_19_Chapter/521767_1_En_19_Fig2_HTML.png)


    Transactions service inputs to transaction database and user profile A P I. A
    P I inputs to user profile database along with user profile service.


    Figure 19-2


    API way of managing microservices


    In this integration pattern, the services communicate synchronously through an
    API. All the access to each other’s data is coordinated through an API in a request-response
    fashion, and the service waits for data from the API to perform its action. In
    the previous example, if the transaction service needs to read the user profile
    data, it calls the user profile API and gets what it needs.


    This provides a decent abstraction over a direct database call and offers excellent
    flexibility in terms of technical choices. This provides the benefit of hiding
    many implementation details: the abstraction gives us the freedom to change technologies
    without affecting our clients. For example, the user profile service could use
    Java and MySQL, while the transaction service could use SQL Server and .NET, and
    they can still easily speak to each other through the API.


    However, this is not much different than the direct database integration pattern.
    Adding another network hop on top of a database call can also inhibit scale: by
    increasing the workload, performance decreases—it is significantly at odds with
    most distributed systems fallacies. This integration pattern also makes transaction
    management difficult and inhibits autonomy, as services depend on one another’s
    uptimes. In microservices, if you have to read data synchronously outside of your
    system boundary, that is a service-oriented architecture smell.'
