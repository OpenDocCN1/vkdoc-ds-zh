  trans: '

    # 创新


    创新可以发生在组织中的任何层级。在软件开发人员层面，通过额外投入并创新性地思考运行时间，将代码运行时间从 1 秒缩短到 100 毫秒就是一种创新。在产品管理层面，通过整理团队收到的所有客户服务电话，并通过正确的产品干预来解决关键客户痛点，这是一种能带来长期成果的创新。在个人层面培养创新精神，将促使团队为产品改进进行创新思考，从而推动业务增长。


    因此，在失败时，我们需要确保尽可能多地失败，并且快速失败，这样我们才有足够的时间以不同的方式再次失败。


    推动任何组织或个人的因素并非传统的“约束、质量和价值”三角模型；相反，这个三角形是一个棱镜。在标准三角形的基础上增加一个创新的维度，就构成了完整的棱镜，如图
    18-1 所示。


    ![](img/521767_1_En_18_Fig1_HTML.jpg)


    创新技术团队的说明图。一个二维三角形，三个顶点分别标注为价值、约束和质量，标记为错误表示。一个三维棱锥，四个顶点分别标注为价值、约束、质量和创新，标记为正确表示。


    图 18-1


    创新作为组织驱动力的另一个方面


    一旦你的团队组建完成、开始创新并感到舒适，团队往往会松懈下来。然后，突然之间，变化就来了。


    # 变更管理


    所有公司都需要为变更管理制定一套流程。图 18-2 展示了面对变化或发生在我们身上的坏事时，典型的情绪反应。


    ![](img/521767_1_En_18_Fig2_HTML.jpg)


    一个波浪形的图表。Y 轴表示情绪反应，正 Y 轴表示主动，负 Y 轴表示被动。X 轴表示时间。从左到右，波峰和波谷分别代表稳定、麻木、否认、愤怒、讨价还价、沮丧、接受事实和接纳。


    图 18-2


    变革的不同阶段


    各个阶段如下：


    1. *震惊*：这是听到坏消息时的初始麻木状态。

    2. *否认*：试图逃避不可避免的事实。

    3. *愤怒*：压抑情绪的沮丧爆发。

    4. *讨价还价*：徒劳地寻找出路。

    5. *沮丧*：最终意识到事情不可避免。

    6. *接受事实*：寻找现实的解决方案。

    7. *接纳*：最终，找到了前进的道路。


    在曲线每个点上停留的时间可能不同。如果我们自己被困在正弦曲线的某个点上，就必须快速适应变化；否则，我们会陷入一个难以摆脱的循环。如果我们能尽快渡过这条曲线，我们就安全了。


    任何个人/组织的改变都需要时间来适应，但我们不应抗拒改变。改变总是为我们提供学习新事物的机会。我们需要接受改变；适应性是关键。


    既然我们已经确立了这些因素各自的重要性，那么接下来让我们了解是什么推动了组织中的敏捷流程。


    # 面向技术团队的 Scrum


    Scrum 是一种敏捷开发方法，特别关注如何在基于团队的开发生成环境中管理任务。


    ## 从技术团队角度看什么是 Scrum


    以下是 Scrum 的特点：


    * Scrum 的每次迭代都是一个冲刺（Sprint）。

    * 产品待办事项列表（Product Backlog）是一个记录了获取最终产品所需所有细节的列表。

    * 在每个冲刺期间，会选择产品待办事项列表中优先级最高的用户故事，并将其转化为冲刺待办事项列表（Sprint Backlog）。

    * 团队按照确定的冲刺待办事项列表进行工作。

    * 团队检查日常工作。

    * 在冲刺结束时，团队交付产品功能。


    图 18-3 说明了 Scrum 流程及其各个阶段。


    ![](img/521767_1_En_18_Fig3_HTML.png)


    敏捷 Scrum 循环的丝带形状示意图。从底部开始逆时针，步骤分别是需求、设计、开发、测试、部署和评审。


    图 18-3


    一个敏捷 Scrum 循环


    ## Scrum Master


    Scrum Master 是团队领导者。他们为产品经理和开发团队提供服务。以下部分列出了 Scrum Master 的职责。


    ### Scrum Master 对产品负责人的职责与服务


    以下是对产品负责人的职责：


    * Scrum Master 帮助产品负责人有效地管理产品待办事项列表，并设计相应的技巧。

    * 他们帮助产品负责人向开发团队清晰地传达产品需求。

    * 他们确保产品负责人理解如何管理产品待办事项列表并最大化其价值。

    * 他们负责促进行动事件。


    ### Scrum Master 对开发团队的职责


    以下是对开发团队的职责：


    * Scrum Master 指导和辅导团队遵循 Scrum 规则。

    * 他们帮助消除障碍和阻碍，以促进团队的进展。

    * 他们帮助团队交付高价值的成果并维持团队活力。

    * 他们负责促进行动事件并安排行动会议。

    * 他们辅导团队采用行动框架，特别是当团队初次接触行动规则时。

    * 此外，Scrum Master 还负责规划在组织中实施行动，并帮助那些正在进入敏捷环境或采用行动的人们。


    ### 产品负责人


    产品负责人创建产品待办事项列表，对列表进行优先级排序，并负责在每次迭代中交付功能。


    ### Scrum 团队


    团队管理自己的工作，并组织工作以完成冲刺或周期。


    ### 沟通节奏


    理想情况下，我们应该有一个定期向利益相关者发送电子邮件的工作流程。以下是我的建议：


    * *第 1 天*：发送包含冲刺细节的邮件

    * *第 5 天*：向利益相关者发送关于更新、进展、问题以及需要采取的任何行动的邮件

    * *第 10 天*：发送关于发布内容、发布说明、推送内容及原因的邮件，并预留一个用于回顾会议的日历时间块


    ### 升级流程


    对于企业承诺的服务交付出现的升级问题，需要遵循标准操作规程（SOP）。以下段落是技术性服务交付失败相关升级的典型 SOP。


    这是升级流程：


    1. 冲刺负责人是处理功能优先级问题的主要联系人。

    2. 工程或设计主管或其他任何主管是第一联系点。请求随后会提交给他们的经理。

    3. 如果问题仍需调查，则会涉及经理的上级经理。

    4. 最后，将引入职能主管。问题发生的次数越多，你就越需要改进你的流程。


    ### 总体回顾流程


    每个季度应该对所有冲刺进行一次回顾。应基于以下参数进行评估：


    * 功能被移出的频率

    * 升级问题被提出的频率

    * 错过时间线和/或范围的频率

    * 文档不充分的频率

    * 未遵守流程和沟通的频率

    * 环比的关键项目指标

    '
- fmt: '## Summary


    The technology team thrives when processes are adhered to. Rituals of the tech
    team in an agile environment and more so in the current remote work environment
    has shifted more towards individual’s growth and team’s efficiency while still
    caring about the actual business goals at hand. Changes in the organization, the
    management of these changes, innovation driving people individually and also teams
    at large and how to leverage that has become the key focus of processes now. Agile
    team’s Scrum process and the rituals around it is what is driving the teams to
    work towards their team goals while collectively driving the objectives of the
    company.


    # 19. Business Analytics and Its Importance in Scaling and Execution


    Business analytics, or business intelligence technology, refers to any piece of
    software or processes used by marketers, sales, product teams, and customer success
    teams to perform insights and growth activities. These applications do the following:


    - Help marketers plan and execute marketing campaigns, collect and analyze the
    results of those campaigns, measure and track marketing performance, and apply
    the insights to future campaigns. All of this happens at scale, in a multitouchpoint,
    omnichannel, primarily digital environment.

    - Help sales to better understand their customers and prospects so they can build
    better processes and reduce time to close their sales, align leads to relevant
    sales folks, add revenue intelligence and sign later deals, etc.

    - Empower product teams to better understand user cohorts that support various
    goals around monetization and product adoption so they can continuously build
    better customer experiences.

    - Allow customer success teams to improve Net Promoter Score (`NPS`) and play
    a bigger role in upsell and cross-sell opportunities so they can be a growth function
    and support business objectives such as Net Revenue Retention (`NRR`).


    ## Strategy


    This section highlights the strategy to implement Business analytics at scale
    within an organization. How to get the departments aligned to the common objective
    of assimilating all the data at one place so that meaningful insights/analytics
    can be driven out of it is explained in detail in the following paragraphs.


    ### Determine Business Objectives


    Designing a data warehouse is a business-wide journey. Data warehouses touch all
    areas of your business, so every department needs to be on board with the design.
    Since a warehouse is only as powerful as the data contained within it, aligning
    department needs and goals with the overall project is critical to your success.


    Without data across sales and marketing, overall query results are going to be
    missing some critical components. Knowing which leads are valuable is tied to
    marketing data.


    Every department needs to understand the purpose of the data warehouse, how it
    will benefit them, and what kinds of results they can expect from the warehousing
    solution.


    This requirements gathering stage should focus on the following objectives:


    - Aligning department goals with the overall project

    - Determining the scope of the project in relation to business objectives

    - Discovering your future needs and current needs by diving deep into your data
    (finding out what data will be useful for analysis) and your current tech stack


    ### Collect and Analyze Information


    Often, analysts, supervisors, administrative assistants, and others create analytical
    and summary reports. These reports can be simple correlations of existing reports,
    or they can include information that people overlook, with the existing software
    or information stored in spreadsheets and memos. Such overlooked information can
    include logs of telephone calls someone keeps by hand, a small desktop database
    that tracks shipping dates, or a daily report a supervisor emails to a manager.
    A big challenge for data warehouse designers is finding ways to collect this information.
    People often write off this type of serendipitous information as unimportant or
    inaccurate. Another part of this collection and analysis phase is understanding
    how people gather and process the information. A data warehouse can automate many
    reporting tasks, but you can’t automate what you haven’t identified and don’t
    understand. The process requires extensive interaction with the individuals involved.
    Listen carefully and repeat back what you think you heard. You need to clearly
    understand the process and its reason for existence. Then you’re ready to begin
    designing the warehouse.


    ### Identify Core Business Processes


    By this point, you must have a clear idea of what business processes you need
    to correlate. Identify the key performance indicators, such as unit sales, units
    produced, and gross revenue. Now identify the entities that relate to create the
    key performance indicators. The data warehouse is a collection of interrelated
    data structures. Each structure stores key performance indicators for a specific
    business process and correlates those indicators to the factors that generated
    them. To design a structure to track a business process, identify the entities
    that work together to create the key performance indicator. Each key performance
    indicator is related to the entities that generated it.


    ### Construct a Conceptual Data Model


    After identifying the business processes, create a conceptual model of the data.
    Determine the subjects that will be expressed as fact tables and the dimensions
    that will relate to the facts. Clearly identify the key performance indicators
    for each business process, and decide the format to store the facts in. Because
    the facts will ultimately be aggregated together to form Online Analytical Processing
    (`OLAP`) cubes, the data needs to be in a consistent unit of measure. Each row
    in the fact table is generated by the interaction of specific entities. To add
    a fact, populate all the dimensions and correlate their activities. Many data
    systems, particularly older legacy data systems, have incomplete data. Correct
    this deficiency before you can use the facts in the warehouse. After making the
    corrections, construct the dimension and fact tables. The fact table’s primary
    key is a composite key made from a foreign key of each of the dimension tables.


    #### Locate Data Sources and Plan Data Transformations


    Identify where the critical information is and how to move it into the data warehouse
    structure. Move the data into a consolidated, consistent data structure. A difficult
    task is correlating information between the in-house customer relationship management
    (`CRM`) software and the time-reporting databases. Transform the data as you move
    it from one data structure to another. Some transformations are simple mappings
    to database columns with different names. Base the decision mainly on cost, including
    the cost of training or hiring people to use the tools and the cost of maintaining
    the tools. Also plan when data movement will occur. While the system is accessing
    the data sources, the performance of those databases will decline precipitously.
    Schedule the data extraction to minimize its impact on system users (e.g., over
    a weekend).'
