  trans: "\n# 技术在满足业务需求中的作用\n\n技术团队的划分应基于业务团队的需求。当公司规模较小，需要快速原型开发和产品上市时，团队可以保持整体化。但随着公司成长为中型市场公司，技术团队需要经历转型，按照业务垂直领域进行拆分。而当中型市场公司发展为企业级时，则需要进一步拆分并在宏观层面进行整合。目标是在保持流程协调的同时，亦能保持敏捷性。技术领导者需要不断应对平衡这两者的挑战。\n\
    \n## 与业务单元相关的技术组织\n\n图 16-1 展示了一个典型的技术团队组织结构。组织成立之初，可能只有一个业务单元和一位业务负责人，他会将新开发或新计划的信息传达给一位技术负责人和一位产品负责人。当公司发展壮大后，业务单元（BU）的数量会增加，每个业务单元都会有一位业务单元负责人，他将与业务分析师和项目经组成的管理办公室合作，这些人成为利益相关者。\n\
    \n这些利益相关者随后会组成一个自己的单元，在将这些计划传递给产品负责人团队之前，先评估这些计划的影响。影响分析可以遵循多种方法或框架。通常采用的是 RICE（触达、影响、信心、努力）框架。我将在本书的第五部分对此进行更多讨论。\n\
    \n利益相关者完成分析并将计划文件传递给产品负责人后，产品负责人会通过评估完成该计划所需的不同集成点，来制定他们的产品需求文档。如有必要，会进行跨团队协作以评估对整个团队的影响。\n\
    \n然后，这些需求被传递给技术团队。技术团队内部的技术结构将在本章中进行讨论。\n\n![](img/521767_1_En_16_Fig1_HTML.png)\n\
    \n业务单元 1 的两个办公室共有 4 位利益相关者。他们进行分析并将计划文件传递给产品负责人 1 和 2。产品负责人将其传递给项目管理团队 1 和 2，这两个团队进行协作。然后他们再传递给技术团队\
    \ 1 和 2，这两个团队进行协作。\n\n**图 16-1** 业务单元与技术团队的关系\n\n## 技术团队结构\n\n图 16-2 说明了如何组织技术团队来执行每个业务需求。\n\
    \n![](img/521767_1_En_16_Fig2_HTML.png)\n\n一个流程图。工程经理和架构师进行协作。经理分出技术主管 1、2 和质量主管\
    \ 1。技术主管 1 下辖软件工程师 1、2 和 3。技术主管 2 下辖软件工程师 1 和 2。质量主管 1 下辖质量保证工程师 1 和 2。\n\n**图\
    \ 16-2** 技术团队的组织结构\n\n一个技术团队的成功取决于其敏捷性，以及团队能够多轻松、多自主地执行项目。\n\n有时，项目经理会协助加强与产品经理等利益相关者的协调，这减轻了工程经理的负担。为简化起见，此处我们忽略项目经理的角色，因为将在第五部分中详细讨论。\n\
    \n## 工程经理与架构师的职责\n\n工程经理和架构师的职责在很多方面是可以互换的。有些工程经理可能是 80%的技术工作加 20%的人员管理，而另一些则相反。根据工程经理的技术能力，他们可以自己设计系统架构，或者从专门的架构师那里获得帮助来设计系统架构。\n\
    \n工程经理和架构师的职责如下：\n\n*   负责整个团队所拥有所有模块的稳定性、增长和管理。\n*   负责增长策略。\n*   提出关于扩展和维护的创新想法。\n\
    *   确保团队遵循所有编码标准和文档规范。\n*   主持由利益相关者提出的、影响业务的新功能的相关会议。\n*   在决定功能截止日期时，充当利益相关者与技术主管之间的桥梁。\n\
    *   负责建立团队结构/模块结构。\n\n## 技术主管的职责\n\n以下是技术主管的职责：\n\n*   负责多个模块\n    *   模块示例：\n\
    \        *   用户档案管理\n        *   用户创建模块\n        *   追加销售模块\n*   负责正常运行时间/停机时间。\n\
    *   负责与运维团队沟通并管理基础设施。\n*   负责团队所拥有模块的安全性。\n*   确保冲刺（Sprint）的优先级排序、规划和执行顺利进行。\n\
    *   当出现跨团队依赖时，应介入协调。\n*   管理线上事故升级处理。\n*   负责审批向其汇报的软件工程师的绩效评估。\n\n## 软件工程师的职责\n\
    \n以下是软件工程师的职责：\n\n*   应具备技术背景。\n*   应愿意学习新技术。\n*   应不局限于特定的编码语言或技术。\n*   应至少精通一门编程语言。\n\
    \n## 质量保证主管的职责\n\n以下是质量保证主管的职责：\n\n*   参与业务团队的需求收集工作。\n*   参与团队关于冲刺任务的技术讨论。\n\
    *   与团队成员一起评估测试任务。\n*   与质量保证工程师一起从质量保证的角度分析需求，并记录高级场景。\n*   评审测试用例并提供反馈。\n* \
    \  与相应团队成员一起对即将上线的任何功能进行端到端测试。\n*   审查团队成员的每日状态报告。\n*   在 `Zephyr` 等工具中跟踪测试用例的执行情况。\n\
    *   根据上线日期确定任务优先级，并每日分配给团队。\n*   帮助团队准备测试所需的数据。\n*   参与从现有测试用例文档中识别和选择用于自动化的测试用例。\n\
    *   评审团队成员实现的自动化脚本（`GitHub`）。\n*   每日审查测试用例报告和自动化脚本报告。\n*   每月与团队成员进行一对一沟通。\n\n\
    ## 质量保证工程师的职责\n\n以下是质量保证工程师的职责：\n\n*   参与从现有测试用例文档中识别和选择用于自动化的测试用例。\n*   应用设计和测试自动化策略文档。\n\
    *   创建自动化测试计划并获得批准。\n*   配置用于自动化的测试环境。\n*   为需要自动化的测试用例编写测试脚本。\n*   将代码更改提交到 `GitHub`\
    \ 并请主管评审。\n*   在 CI/CD 流水线中调度测试脚本。\n*   生成测试脚本报告并进行分析。\n*   帮助团队编写脚本和进行调试。\n*\
    \   参与代码评审。\n*   定期规划脚本的改进。\n\n## 总结\n\n搭建好技术团队只是执行的第一步。虽然初始项目和计划可能进展顺利，但为了维持增长，遵循正确的流程至关重要。人才和技术是成功的必要因素，同时，坚持正确的团队组合、团队划分和职责分配也有助于实现这种持续的成长。\n"
- fmt: "# 17. Technology Stack\n\nThis chapter covers one technology stack to create\
    \ websites and apps. This is just a current example, because most technology stacks\
    \ are constantly changing. What matters most in high-velocity growth is how fast\
    \ you can update your technology stack to stay in tune with the latest tech trends.\
    \ This chapter covers the current tools and technologies in use.\n\n## Front-End\
    \ Stack\n\nIt’s important to choose a stack that is agnostic of whether it’s exclusively\
    \ for the front end or backend. `JavaScript` has proven to be one technology that\
    \ has brought together both of these worlds. We no longer have to look at developers\
    \ as front-end or backend developers as long as they are well versed in `JavaScript`.\n\
    \nAdditionally, `HTML`, `CSS`, and `Bootstrap` play key roles in the frontend.\
    \ We cover both Front end and backend end technologies in brief just to give you\
    \ an understanding of what these technologies mean while starting up a business,\
    \ then it is important to know if you’ll be building a website or an app.\n\n\
    ### What Is HTML?\n\nHypertext Markup Language (HTML) is not a programming language.\
    \ It is a *markup language* that tells web browsers how to structure the web pages\
    \ you visit. `HTML` consists of a series of elements, which you use to enclose,\
    \ wrap, or *mark up* different parts of content to make them appear or act in\
    \ a certain way.\n\n#### What’s in the “Head” or Metadata in HTML?\n\nThe head\
    \ of an `HTML` document is the part that *is not* displayed in the web browser\
    \ when the page is loaded. It contains information such as the page title, links\
    \ to `CSS` (if you want to style your HTML content with `CSS`), links to custom\
    \ favicons, and metadata (data about the HTML, such as who wrote it, and important\
    \ keywords that describe the document).\n\n#### What Are the Elements of HTML?\n\
    \nUse `HTML` text content elements to organize blocks or sections of content placed\
    \ between the opening `<body>` and closing `</body>` tags. Important for accessibility\
    \ and SEO, these elements identify the purpose or structure of that content.\n\
    \n*   `<h1>`, `<h2>`, `<h3>`, `<h4>`, `<h5>`, `<h6>`: The `HTML` `<h1>`–`<h6>`\
    \ elements represent six levels of section headings. `<h1>` is the highest section\
    \ level, and `<h6>` is the lowest.\n*   `<div>`: The `HTML` content division element\
    \ (`<div>`) is the generic container for flow content. It has no effect on the\
    \ content or layout until styled using `CSS`.\n*   `<p>`: The `HTML` `<p>` element\
    \ represents a paragraph.\n*   `<li>`: The `HTML` `<li>` element is used to represent\
    \ an item in a list.\n*   `<ol>`: The `HTML` `<ol>` element represents an ordered\
    \ list of items—typically rendered as a numbered list.\n*   `<ul>`: The `HTML`\
    \ `<ul>` element represents an unordered list of items, typically rendered as\
    \ a bulleted list.\n\n### CSS Properties\n\nCascading Style Sheets (CSS) is a\
    \ standard style sheet language used for describing the presentation (i.e., the\
    \ layout and formatting) of the web pages.\n\n*   Prior to CSS, nearly all the\
    \ presentational attributes of `HTML` documents were contained within the `HTML`\
    \ markup (specifically inside the `HTML` tags); all the font colors, background\
    \ styles, element alignments, borders, and sizes had to be explicitly described\
    \ within the `HTML`.\n*   CSS can be either attached as a separate document or\
    \ embedded in the `HTML` document itself. There are three methods of including\
    \ CSS in an `HTML` document.\n    *   *Inline styles*: Using the `style` attribute\
    \ in the `HTML` start tag\n    *   *Embedded styles*: Using the `<style>` element\
    \ in the head section of a document\n    *   *External style sheets*: Using the\
    \ `<link>` element, pointing to an external `CSS` file\n\n#### What Is the Box\
    \ Model?\n\nEvery element that can be displayed on a web page consists of one\
    \ or more rectangular boxes. The CSS *box model* typically describes how these\
    \ rectangular boxes are laid out on a web page. These boxes can have different\
    \ properties and can interact with each other in different ways, but every box\
    \ has a content area and optional surrounding padding, border, and margin areas.\
    \ Figure [17-1](#521767_1_En_17_Chapter.xhtml#Fig1) shows how content in the center\
    \ can be aligned using the CSS box model.\n\n![](images/521767_1_En_17_Chapter/521767_1_En_17_Fig1_HTML.png)\n\
    \nA sketch has 3 concentric boxes and a dashed box. From top to bottom, the labels\
    \ are margin-top, border-top, padding-top, padding-left, border-left, margin-left,\
    \ margin-right, border-right, padding-right, padding-bottom, border-bottom, and\
    \ margin-bottom.\n\nFigure 17-1\n\nBox model in CSS\n\n### What Is Bootstrap?\n\
    \n`Bootstrap` makes it easy to quickly design and customize responsive mobile-first\
    \ sites. It is the world’s most popular front-end open source toolkit, featuring\
    \ `Sass` variables and mixins, a responsive grid system, extensive prebuilt components,\
    \ and powerful `JavaScript` plugins.\n\n`Bootstrap`’s grid system uses a series\
    \ of containers, rows, and columns to lay out and align content. It’s built with\
    \ flexbox and is fully responsive. Figure [17-2](#521767_1_En_17_Chapter.xhtml#Fig2)\
    \ is an example and an in-depth look at how the grid comes together.\n\n![](images/521767_1_En_17_Chapter/521767_1_En_17_Fig2_HTML.png)\n\
    \nBoxes arranged in 7 rows. 12 boxes of column 1 in row 1. 4 boxes of column 3\
    \ in row 2. 3 boxes of column 4 in row 3. Column 8 and 4 boxes in row 4. 2 boxes\
    \ of column 2, one column 4, and 2 boxes of column 2 in row 5. 2 boxes of column\
    \ 6 in row 6. One column 12 in row 7.\n\nFigure 17-2\n\nColumn structure in Bootstrap\n\
    \n#### Why Use Bootstrap?\n\n`Bootstrap` is the most popular framework for creating\
    \ layouts, and `Bootstrap`’s responsive CSS adjusts to phones, tablets, and desktops.\
    \ It is easy to set up and create a working layout in less than an hour.\n\nIt\
    \ has base styling for most `HTML` elements, such as the following:\n\n*   Typography\n\
    *   Code\n*   Tables\n*   Forms\n*   Buttons\n*   Images\n*   Icons\n\nIt also\
    \ has an extensive list of components such as the following:\n\n*   Drop-downs\n\
    *   Button groups\n*   Navigation bars\n*   Breadcrumbs\n*   Labels and badges\n\
    *   Alerts\n*   Progress bars\n*   And many others\n\nIt comes with bundled `JavaScript`\
    \ plugins such as the following:\n\n*   Sliders\n*   Tabs\n*   Accordions\n\n\
    ### Why Use JavaScript?\n\nYou can use `JavaScript` to build interactive web pages,\
    \ desktop applications, web applications, and mobile apps. You can run `JavaScript`\
    \ in a browser or in `Node`.\n\n### What Is React.js?\n\n`React.js` is a `JavaScript`\
    \ library created by Facebook for building user interfaces that are component-based\
    \ and that can be dynamically updated depending on the state of an application.\n\
    \n#### ECMAScript\n\n`ECMAScript` is a language standardized by ECMA International.\
    \ `JavaScript` is merely an implementation of the standardized `ECMAScript` language.\
    \ `ECMAScript 5` (ES5) was standardized in 2009, and most contemporary browsers\
    \ can process it. `ECMAScript 6` (ES6) was standardized more recently in 2015.\
    \ Therefore, browsers have not yet caught up yet to process it.\n\nTo write code\
    \ in `React`, you want the latest features of `ES6`.\n\n`Babel` is a `JavaScript`\
    \ preprocessor. In short, `Babel` takes `ES6` code and converts it to `ES5` so\
    \ the browser can process it.\n\nWith `React`, you can create single-page applications\
    \ by creating views for each state in your application (home page, login page,\
    \ etc.) and dynamically toggle on and off the views depending on the state.\n\n\
    Because an application has to load only a single page at the beginning, navigating\
    \ through different views in a `React` web application is really fast and requires\
    \ no page loading."
