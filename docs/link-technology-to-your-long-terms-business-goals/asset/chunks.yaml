  trans: '

    ## 摘要


    当流程得到遵守时，技术团队才能蓬勃发展。在敏捷环境中，尤其在当前的远程工作环境下，技术团队的常规仪式已更多地转向个人成长和团队效率，同时仍关注眼前的实际业务目标。组织变革、对这些变革的管理、驱动个人乃至整个团队的创新，以及如何利用这些创新，现已成为流程的关键焦点。敏捷团队的
    Scrum 流程及其相关仪式，正驱动着团队在共同推动公司目标的同时，朝着各自的团队目标努力。


    # 19. 业务分析及其在规模化与执行中的重要性


    业务分析（或称商业智能技术）是指营销人员、销售团队、产品团队和客户成功团队用于执行洞察与增长活动的任何软件或流程。这些应用程序具有以下功能：


    -   帮助营销人员规划和执行营销活动，收集并分析这些活动的结果，衡量和跟踪营销绩效，并将洞察应用于未来的活动中。这一切都在多触点、全渠道、以数字环境为主的规模化场景中发生。

    -   帮助销售团队更好地了解客户和潜在客户，以便他们能够构建更优流程、缩短销售周期、将潜在客户匹配给相应的销售人员、增加收入智能并促成后续交易等。

    -   赋能产品团队，使其更好地理解支持产品变现和采用等不同目标的用户群体，从而持续打造更佳的客户体验。

    -   允许客户成功团队提升净推荐值（`NPS`），并在追加销售和交叉销售机会中发挥更大作用，使其成为一个增长职能，支持净收入留存率（`NRR`）等业务目标。


    ## 策略


    本节重点介绍在组织内规模化实施业务分析的策略。如何使各部门协同一致，共同实现将所有数据整合至一处，以便从中提取有价值的洞察与分析，将在以下段落中详细阐述。


    ### 确定业务目标


    设计数据仓库是一项涉及整个企业的旅程。数据仓库触及业务的方方面面，因此每个部门都需要参与设计。由于数据仓库的强大程度取决于其所包含的数据，因此将部门需求与目标同整个项目保持一致，对您的成功至关重要。


    如果缺少销售和营销数据，整体查询结果将缺失一些关键组成部分。了解哪些潜在客户有价值，与营销数据息息相关。


    每个部门都需要理解数据仓库的目的、它将如何惠及自身，以及他们可以从数据仓库解决方案中获得何种结果。


    这一需求收集阶段应聚焦于以下目标：


    -   使部门目标与整个项目保持一致

    -   根据业务目标确定项目范围

    -   通过深入挖掘数据（找出哪些数据对分析有用）和您当前的技术栈，发现未来的需求和当前的需求


    ### 收集并分析信息


    分析师、主管、行政助理等人员经常会创建分析报告和汇总报告。这些报告可以是现有报告的简单关联，也可以包含人们使用现有软件或存储在电子表格和备忘录中的信息时所忽略的内容。这类被忽略的信息可能包括：某人手动记录的电话日志、一个用于追踪发货日期的小型桌面数据库，或主管通过电子邮件发给经理的每日报告。数据仓库设计师面临的一个巨大挑战是如何找到收集这些信息的方法。人们常常认为这种偶然发现的信息不重要或不准确。此收集和分析阶段的另一部分是理解人们如何收集和处理信息。数据仓库可以自动化许多报告任务，但您无法自动化那些尚未识别和理解的任务。该过程需要与相关人员进行广泛互动。仔细倾听，并复述您所听到的内容。您需要清晰地理解该流程及其存在的理由。然后，您就可以开始设计数据仓库了。


    ### 确定核心业务流程


    至此，您必须对需要关联哪些业务流程有一个清晰的认识。确定关键绩效指标，例如单位销售额、生产单位和总收入。然后，识别出与创建这些关键绩效指标相关的实体。数据仓库是相互关联的数据结构的集合。每个结构都为特定业务流程存储关键绩效指标，并将这些指标与生成它们的因素相关联。为了设计一个追踪业务流程的结构，需要识别哪些实体共同作用以生成该关键绩效指标。每个关键绩效指标都与生成它的实体相关联。


    ### 构建概念数据模型


    确定业务流程后，创建一个数据的概念模型。确定哪些主题将表示为事实表，以及哪些维度将关联到这些事实。清晰地识别每个业务流程的关键绩效指标，并决定存储事实的格式。由于这些事实最终将被聚合在一起形成联机分析处理（`OLAP`）多维数据集，因此数据需要采用一致的计量单位。事实表中的每一行都由特定实体的交互生成。要添加一个事实，需要填充所有维度并关联它们的活动。许多数据系统，尤其是较旧的遗留数据系统，其数据不完整。在将事实用于数据仓库之前，需要纠正这一缺陷。完成更正后，构建维表和事实表。事实表的主键是由每个维度表的外键组成的复合键。


    #### 定位数据源并规划数据转换


    识别关键信息的所在位置，以及如何将其移动到数据仓库结构中。将数据移入一个统一、一致的数据结构中。一个艰巨的任务是关联内部客户关系管理（`CRM`）软件和时间报告数据库之间的信息。在将数据从一个数据结构移动到另一个数据结构时，需要进行转换。某些转换只是简单地映射到名称不同的数据库列。决策主要基于成本，包括培训或雇佣人员使用工具的成本，以及维护工具的成本。同时，还需规划数据移动的时间。当系统访问数据源时，这些数据库的性能将急剧下降。应安排数据提取时间，以尽量减少对系统用户的影响（例如，安排在周末）。'
- fmt: "### Implement the MVP Plan and Deploy in Production\n\nThe plan provides a\
    \ viable basis for estimating work and scheduling the project. The scope of data\
    \ warehouse projects is large, so phased delivery schedules are important for\
    \ keeping the project on track. An effective strategy is to plan the entire warehouse\
    \ and then implement part of it as a data mart to demonstrate what the system\
    \ is capable of doing. As you complete the parts, they fit together like pieces\
    \ of a jigsaw puzzle. Each new set of data structures adds to the capabilities\
    \ of the previous structures, bringing value to the system. Data warehouse systems\
    \ provide decision-makers with consolidated, consistent historical data about\
    \ their organization’s activities. With careful planning, the system can provide\
    \ vital information on how factors interrelate to help or harm the organization.\
    \ A solid plan can contain costs and makes this powerful tool a reality.\n\n###\
    \ Benefits\n\nThe key benefits of data aggregation and data analytics being driven\
    \ through a centralized system is that it gives teams independence to perform\
    \ their core tasks while the analytics is automated. Before such an automated\
    \ process comes into being, teams would first have to strategize how the data\
    \ will be collected and stored before each project begins. And once the project\
    \ ends, they will have to then collate the data and analyze it from the purview\
    \ of whether it made an impact or not. If a data pipeline and a centralized system\
    \ exists, then they can see and analyze the data in real time.\n\n#### Independence\n\
    \nProduct, sales, and marketing are independent as much as possible. Regular repetitive\
    \ tasks can be run by the querying team so the BI team can work on complex problems\
    \ around data modeling and machine learning.\n\n#### Upskilling\n\nThere should\
    \ be regular trainings that will help team learn the data analysis tools as most\
    \ of these tools are easy to use with online manuals. For example, `Tableau` online\
    \ is simple to learn and use it for data analysis. Arranging regular workshops\
    \ will help free up bandwidth of the data engineering and data analytics team\
    \ to focus on their core skills while the business teams can derive the necessary\
    \ insights on their own.\n\n#### Cross-Functional Collaboration\n\nThe ability\
    \ to integrate data across diverse tools helps everyone collaborate on decision-making\
    \ and the problem at hand rather than just questioning the reliability of the\
    \ data. This helps in conflict reduction and fosters a solid team environment.\n\
    \n#### Data Democratization\n\nThere should be a practice to empower teams with\
    \ access to data, insights, and actionable best practices so everyone can be better\
    \ at their jobs.\n\n### Tactics and Phases\n\nTo operationalize the project, it\
    \ can be broken down into three phases. These phases will be aligned with the\
    \ objectives and key results of the company:\n\n*   Build a marketing technology\
    \ stack that involves stitching together all the marketing platforms to one system.\n\
    *   Build the data stack and implement best practices.\n*   Integrate the sales\
    \ tech stack with martech and leverage combined insights.\n*   Leverage the martech\
    \ stack to improve product insights.\n\n### The Data Stack Architecture\n\nThe\
    \ data stack architecture covers how the data initiated at source systems can\
    \ be ingested into a centralized system for analysis. The centralized stores are\
    \ then used for analyzing and deriving insights from. The stack is a pipeline\
    \ that takes the data from the source till the end. It could differ from organization\
    \ to organization depending on what applications are being used. Typically source\
    \ systems are advertising platforms, customer relationship management systems\
    \ and destination platforms are central warehousing databases like `MongoDB`,\
    \ `Redshift`, etc.\n\n#### Data Flow\n\nThere are different tools that help in\
    \ achieving the flow of data from source to destination. The following tools in\
    \ that order starts from source systems and then moves on to the visualization\
    \ tools that eventually helps businesses analyze the data:\n\n*   **Ingest tools**:\
    \ Tools to centralize data from different sources into a data store (`Appsflyer`,\
    \ `CRM`, etc.).\n*   **Stores**: Data lakes and data warehouses, although nowadays\
    \ the popular notion of a lake house is emerging (`Google Cloud Storage`, `Amazon\
    \ Web Services`, etc.).\n*   **Transform tools**: Tools to help clean, aggregate,\
    \ and denormalize the data for analysis. We also include building features for\
    \ machine learning and the model building of ML in the transform category (`Google\
    \ Big Query`).\n*   **Visualization tools**: Tools to visualize cleaned or aggregated\
    \ data to generate insights (`Tableau`).\n*   **Publish/serve tools**: Tools to\
    \ publish the reports, aggregates, or models so that applications can use them\
    \ (`Confluence`).\n\n#### Metadata Layer\n\nMetadata includes the structure of\
    \ data, configurations of the pipelines that created the data, relationships between\
    \ different data, and other properties (freshness, who has access, etc.). The\
    \ metadata layer consists of several aspects of the data and the data flow that\
    \ are used and generated by the running systems.\n\nThe metadata layer can be\
    \ composed of the following:\n\n*   **Schema/lineage**: This includes the core\
    \ metadata of any data system. At the simplest level, the schema consists of the\
    \ table and column definitions. There can also be relationships between tables\
    \ like foreign keys. Lineage is a way to capture how different data is related\
    \ to each other and understand how one piece of data is generated.\n*   **Statistics**:\
    \ This is runtime metadata. These are metrics about different data and data flows,\
    \ such as different table sizes, the time it takes to compute an answer, the time\
    \ it takes to ship data from one system to another, etc. These stats can optimize\
    \ data flow, understand bottlenecks in the system, understand how the data volumes\
    \ change over time, and more. One of the key statistics collected is data quality\
    \ metrics, which provide information about whether analyses are being performed\
    \ on complete and accurate data.\n*   **Orchestration**: This is the most critical\
    \ part of the metadata layer. It is critically important and should be included\
    \ in the metadata layer because orchestration must be metadata-driven. Instead\
    \ of just collecting and showing metadata, metadata’s insights become critical\
    \ for the data flow itself. This has six main advantages.\n    *   **Metadata\
    \ is always clean**: If metadata is broken, the system is broken, and someone\
    \ must fix it.\n    *   **Observability/auditability out of the box**: There is\
    \ no need for special instrumentation because metadata is always up-to-date.\n\
    \    *   **Quality checks**: Data quality checks can be incorporated directly\
    \ into the orchestration without additional integrations.\n    *   **Easy debuggability**:\
    \ Lineage and stats drive data flow and so are automatically captured. This makes\
    \ it easy to debug problems in the data flow with a single pane of glass that\
    \ shows the metadata in an easy-to-consume manner.\n    *   **Avoid repetition**:\
    \ Mundane operations like reprocessing or doing full refreshes (historical syncs)\
    \ that should propagate through the entire data flow become a lot easier to manage.\n\
    \    *   **Tools**: Authoring tools can access both the static and dynamic metadata\
    \ to help data teams figure out how to make changes to their business logic without\
    \ breaking data pipelines.\n*   **Access control**: With metadata being clean,\
    \ one can specify who can access what schemas and tables at a granular level.\
    \ Both role-based and policy-based access controls rely on the schema/lineage\
    \ to provide flexibility.\n*   **Auditing**: Keep track of what changes occurred\
    \ to any of the data or data flows. If orchestration is metadata-driven, the orchestration\
    \ log provides an automated way of auditing those changes. Logging from access\
    \ control will provide an audit of who performed what operation on the system.\n\
    *   **Observability**: Use metadata to observe how the data is flowing through\
    \ different systems."
  raw: "#### Implement the MVP Plan and Deploy in Production\n\nThe plan provides\
    \ a viable basis for estimating work and scheduling the project. The scope of\
    \ data warehouse projects is large, so phased delivery schedules are important\
    \ for keeping the project on track. An effective strategy is to plan the entire\
    \ warehouse and then implement part of it as a data mart to demonstrate what the\
    \ system is capable of doing. As you complete the parts, they fit together like\
    \ pieces of a jigsaw puzzle. Each new set of data structures adds to the capabilities\
    \ of the previous structures, bringing value to the system. Data warehouse systems\
    \ provide decision-makers with consolidated, consistent historical data about\
    \ their organization’s activities. With careful planning, the system can provide\
    \ vital information on how factors interrelate to help or harm the organization.\
    \ A solid plan can contain costs and makes this powerful tool a reality.\n\n##\
    \ Benefits\n\nThe key benefits of data aggregation and data analytics being driven\
    \ through a centralized system is that it gives teams independence to perform\
    \ their core tasks while the analytics is automated. Before such an automated\
    \ process comes into being, teams would first have to strategize how the data\
    \ will be collected and stored before each project begins. And once the project\
    \ ends, they will have to then collate the data and analyze it from the purview\
    \ of whether it made and impact or not. If a data pipeline and a centralized system\
    \ exists, then they can see and analyze the data in real time.\n\n### Independence\n\
    \nProduct, sales, and marketing are independent as much as possible. Regular repetitive\
    \ tasks can be run by the querying team so the BI team can work on complex problems\
    \ around data modeling and machine learning.\n\n### Upskilling\n\nThere should\
    \ be regular trainings that will help team learn the data analysis tools as most\
    \ of these tools are easy to use with online manuals. For example Tableau online\
    \ is simple to learn and use it for data analysis. Arranging regular workshops\
    \ will help free up bandwidth of the data engineering and data analytics team\
    \ to focus on their core skills while the business teams can derive the necessary\
    \ insights on their own.\n\n### Cross-Functional Collaboration\n\nThe ability\
    \ to integrate data across diverse tools helps everyone collaborate on decision-making\
    \ and the problem at hand rather than just questioning the reliability of the\
    \ data. This helps in conflict reduction and fosters a solid team environment.\n\
    \n### Data Democratization\n\nThere should be a practice to empower teams with\
    \ access to data, insights, and actionable best practices so everyone can be better\
    \ at their jobs.\n\n## Tactics and Phases\n\nTo operationalize the project, it\
    \ can be broken down into three phases. These phases will be aligned with the\
    \ objectives and key results of the company:\n\n*   Build a marketing technology\
    \ stack that involves stitching together all the marketing platforms to one system.\n\
    \n*   Build the data stack and implement best practices.\n\n*   Integrate the\
    \ sales tech stack with martech and leverage combined insights.\n\n*   Leverage\
    \ the martech stack to improve product insights.\n\n## The Data Stack Architecture\n\
    \nThe data stack architecture covers how the data initiated at source systems\
    \ can be ingested into a centralized system for analysis. The centralized stores\
    \ are then used for analyzing and deriving insights from. The stack is a pipeline\
    \ that takes the data from the source till the end. It could differ from organization\
    \ to organization depending on what applications are being used. Typically source\
    \ systems are advertising platforms, customer relationship management systems\
    \ and destination platforms are central warehousing databases like MongoDB, Redshift\
    \ etc.\n\n### Data Flow\n\nThere are different tools that help in achieving the\
    \ flow of data from source to destination. The following tools in that order starts\
    \ from source systems and then moves on to the visualization tools that eventually\
    \ helps businesses analyze the data:\n\n*   *Ingest tools*: Tools to centralize\
    \ data from different sources into a data store (Appsflyer, CRM, etc.).\n\n* \
    \  *Stores*: Data lakes and data warehouses, although nowadays the popular notion\
    \ of a lake house is emerging (Google Cloud Storage, Amazon Web Services, etc.).\n\
    \n*   *Transform tools*: Tools to help clean, aggregate, and denormalize the data\
    \ for analysis. We also include building features for machine learning and the\
    \ model building of ML in the transform category (Google Big Query).\n\n*   *Visualization\
    \ tools*: Tools to visualize cleaned or aggregated data to generate insights (Tableau).\n\
    \n*   *Publish/serve tools*: Tools to publish the reports, aggregates, or models\
    \ so that applications can use them (Confluence).\n\n### Metadata Layer\n\nMetadata\
    \ includes the structure of data, configurations of the pipelines that created\
    \ the data, relationships between different data, and other properties (freshness,\
    \ who has access, etc.). The metadata layer consists of several aspects of the\
    \ data and the data flow that are used and generated by the running systems.\n\
    \nThe metadata layer can be composed of the following:\n\n*   *Schema/lineage*:\
    \ This includes the core metadata of any data system. At the simplest level, the\
    \ schema consists of the table and column definitions. There can also be relationships\
    \ between tables like foreign keys. Lineage is a way to capture how different\
    \ data is related to each other and understand how one piece of data is generated.\n\
    \n*   *Statistics*: This is runtime metadata. These are metrics about different\
    \ data and data flows, such as different table sizes, the time it takes to compute\
    \ an answer, the time it takes to ship data from one system to another, etc. These\
    \ stats can optimize data flow, understand bottlenecks in the system, understand\
    \ how the data volumes change over time, and more. One of the key statistics collected\
    \ is data quality metrics, which provide information about whether analyses are\
    \ being performed on complete and accurate data.\n\n*   *Orchestration*: This\
    \ is the most critical part of the metadata layer. It is critically important\
    \ and should be included in the metadata layer because orchestration must be metadata-driven.\
    \ Instead of just collecting and showing metadata, metadata’s insights become\
    \ critical for the data flow itself. This has six main advantages.\n    *   *Metadata\
    \ is always clean*: If metadata is broken, the system is broken, and someone must\
    \ fix it.\n\n    *   *Observability/auditability out of the box*: There is no\
    \ need for special instrumentation because metadata is always up-to-date.\n\n\
    \    *   *Quality checks*: Data quality checks can be incorporated directly into\
    \ the orchestration without additional integrations.\n\n    *   *Easy debuggability*:\
    \ Lineage and stats drive data flow and so are automatically captured. This makes\
    \ it easy to debug problems in the data flow with a single pane of glass that\
    \ shows the metadata in an easy-to-consume manner.\n\n    *   *Avoid repetition*:\
    \ Mundane operations like reprocessing or doing full refreshes (historical syncs)\
    \ that should propagate through the entire data flow become a lot easier to manage.\n\
    \n    *   *Tools*: Authoring tools can access both the static and dynamic metadata\
    \ to help data teams figure out how to make changes to their business logic without\
    \ breaking data pipelines.\n\n*   *Access control*: With metadata being clean,\
    \ one can specify who can access what schemas and tables at a granular level.\
    \ Both role-based and policy-based access controls rely on the schema/lineage\
    \ to provide flexibility.\n\n*   *Auditing*: Keep track of what changes occurred\
    \ to any of the data or data flows. If orchestration is metadata-driven, the orchestration\
    \ log provides an automated way of auditing those changes. Logging from access\
    \ control will provide an audit of who performed what operation on the system.\n\
    \n*   *Observability*: Use metadata to observe how the data is flowing through\
    \ different systems."
  trans: "\n### 实施 MVP 计划并部署到生产环境\n\n该计划为评估工作量和安排项目进度提供了可行依据。数据仓库项目范围庞大，因此分阶段交付对于保持项目按计划进行至关重要。一个有效的策略是先规划整个仓库，然后将其一部分作为数据集市实施，以展示系统的能力。当各部分完成时，它们会像拼图碎片一样拼接在一起。每一组新的数据结构都会为之前的结构增添能力，从而为系统带来价值。数据仓库系统为决策者提供关于其组织活动的、经过整合且一致的历史数据。通过周密的规划，该系统可以提供关于各因素如何相互关联以帮助或损害组织的重要信息。一个坚实的计划可以控制成本，并使这一强大工具成为现实。\n\
    \n### 主要优势\n\n通过集中式系统驱动的数据聚合和数据分析，其关键优势在于它赋予了团队自主执行核心任务的能力，同时分析工作实现自动化。在这种自动化流程出现之前，团队必须在每个项目开始前首先制定数据收集和存储的策略。而一旦项目结束，他们又必须整理数据，并从其是否产生影响力的角度进行分析。如果存在数据管道和集中式系统，他们就能实时查看和分析数据。\n\
    \n#### 独立性\n\n产品、销售和市场团队尽可能保持独立。常规重复性任务可由查询团队执行，这样商业智能团队就可以专注于处理数据建模和机器学习等复杂问题。\n\
    \n#### 技能提升\n\n应定期进行培训，帮助团队学习数据分析工具，因为大多数此类工具都带有在线手册，易于使用。例如，`Tableau`在线学习版本简单易学，可用于数据分析。安排定期研讨会将有助于解放数据工程和数据分析团队的带宽，使其专注于核心技能，而业务团队则可以自行获取必要的洞察。\n\
    \n#### 跨职能协作\n\n跨不同工具整合数据的能力有助于每个人协作进行决策并解决当前问题，而不是仅仅质疑数据的可靠性。这有助于减少冲突，并培养坚实的团队环境。\n\
    \n#### 数据民主化\n\n应形成一种实践，赋能团队，使其能够访问数据、洞察和可操作的最佳实践，从而让每个人都能更好地完成自己的工作。\n\n### 策略与阶段\n\
    \n为使项目可操作化，可以将其分解为三个阶段。这些阶段将与公司的目标和关键结果保持一致：\n\n*   构建营销技术栈，涉及将所有营销平台整合到一个系统中。\n\
    *   构建数据栈并实施最佳实践。\n*   将销售技术栈与营销技术栈集成，并利用整合后的洞察。\n*   利用营销技术栈来改进产品洞察。\n\n### 数据栈架构\n\
    \n数据栈架构涵盖了如何将从源系统发起的数据摄取到集中式系统中进行分析。集中式存储随后用于分析和提取洞察。数据栈是一个管道，将数据从源头一直传递到终点。根据所使用的应用程序不同，不同组织的架构可能有所不同。通常，源系统是广告平台、客户关系管理系统，而目标平台是像`MongoDB`、`Redshift`等中央数据仓库数据库。\n\
    \n#### 数据流\n\n有多种工具可以帮助实现数据从源头到目的地的流动。按顺序排列，以下工具从源系统开始，到最终帮助业务分析数据的可视化工具：\n\n\
    *   **摄取工具**：将来自不同来源的数据集中到数据存储中的工具（例如`Appsflyer`、`CRM`等）。\n*   **存储**：数据湖和数据仓库。不过，如今湖仓一体的概念正日益流行（例如`Google\
    \ Cloud Storage`、`Amazon Web Services`等）。\n*   **转换工具**：用于清洗、聚合和反规范化数据以便分析的工具。我们还将为机器学习构建特征以及机器学习模型构建纳入转换工具类别（例如`Google\
    \ Big Query`）。\n*   **可视化工具**：将清洗或聚合后的数据可视化以生成洞察的工具（例如`Tableau`）。\n*   **发布/服务工具**：用于发布报告、聚合数据或模型，以便应用程序使用的工具（例如`Confluence`）。\n\
    \n#### 元数据层\n\n元数据包括数据结构、创建数据的管道配置、不同数据之间的关系以及其他属性（如新鲜度、谁有访问权限等）。元数据层由运行系统使用和生成的数据及数据流的若干方面组成。\n\
    \n元数据层可以包含以下内容：\n\n*   **模式/血缘关系**：这包括任何数据系统的核心元数据。在最简单的层面上，模式由表和列定义组成。还可以存在表之间的关系，例如外键。血缘关系是一种捕捉不同数据之间如何关联以及理解一条数据是如何生成的方法。\n\
    *   **统计信息**：这是运行时元数据。这些是关于不同数据及数据流的指标，例如不同的表大小、计算答案所需的时间、将数据从一个系统传输到另一个系统所需的时间等。这些统计信息可以优化数据流，了解系统中的瓶颈，了解数据量随时间的变化情况等。收集的关键统计信息之一是数据质量指标，它提供关于分析是否基于完整且准确的数据进行的信息。\n\
    *   **编排**：这是元数据层中最关键的部分。它至关重要，并且应该包含在元数据层中，因为编排必须是元数据驱动的。元数据不仅仅是收集和展示，其洞察力对数据流本身也变得至关重要。这有六个主要优势：\n\
    \    *   **元数据始终是干净的**：如果元数据出错，系统就会出错，必须有人修复它。\n    *   **开箱即用的可观察性/可审计性**：无需特殊的工具埋点，因为元数据始终是最新的。\n\
    \    *   **质量检查**：数据质量检查可以直接整合到编排中，无需额外集成。\n    *   **易于调试**：血缘关系和统计信息驱动数据流，因此会被自动捕获。这使得通过单一视图以易于消费的方式展示元数据，从而轻松调试数据流中的问题变得容易。\n\
    \    *   **避免重复**：诸如重新处理或执行全量刷新（历史同步）等需要在整个数据流中传播的常规操作，管理起来会容易得多。\n    *   **工具**：编写工具可以访问静态和动态元数据，帮助数据团队找出如何更改其业务逻辑而不破坏数据管道的方法。\n\
    *   **访问控制**：由于元数据是干净的，人们可以在细粒度级别上指定谁可以访问哪些模式和表。基于角色的访问控制和基于策略的访问控制都依赖于模式/血缘关系来提供灵活性。\n\
    *   **审计**：跟踪任何数据或数据流发生了哪些变化。如果编排是元数据驱动的，编排日志提供了一种自动审计这些变化的方式。访问控制的日志将提供关于谁在系统上执行了何种操作的审计记录。\n\
    *   **可观察性**：使用元数据来观察数据如何流经不同的系统。\n"
- fmt: '# The Hero of the Story: Microservices


    The microservices architecture is a cloud-native architectural approach in which
    a single application is composed of many loosely coupled and independently deployable
    smaller components, or services. These services typically have the following characteristics:


    - Have their own technology stack, inclusive of the database and data management
    model

    - Communicate with one another over a combination of APIs, event streaming, and
    message brokers

    - Are organized by business capability, with the line separating services often
    referred to as a *bounded context*


    While much of the discussion about microservices has revolved around architectural
    definitions and characteristics, their value can be more commonly understood through
    fairly simple business and organizational benefits:


    - Code can be updated more easily. New features or functionality can be added
    without touching the entire application.

    - Teams can use different stacks and different programming languages for different
    components.

    - Components can be scaled independently of one another, reducing the waste and
    cost associated with having to scale entire applications because a single feature
    might be facing too much load.


    Microservices might also be understood by what they are *not*. The two comparisons
    drawn most frequently with microservices architecture are monolithic architecture
    and service-oriented architecture (`SOA`).


    The difference between microservices and monolithic architecture is that microservices
    compose a single application from many smaller, loosely coupled services as opposed
    to the monolithic approach of a large, tightly coupled application.


    ## Benefits of Microservices


    The following are the benefits of microservices.


    ### Precise Scaling


    With microservices, individual services can be individually deployed, but they
    can be individually scaled, as well. The resulting benefit is obvious: done correctly,
    microservices require less infrastructure than monolithic applications because
    they enable precise scaling of only the components that require it, instead of
    the entire application in the case of monolithic applications.


    ### Experimentation and Lower Risk


    In a microservices model, components are deployed independently and communicate
    over some combination of `REST`, event streaming, and message brokers—so it’s
    possible for the stack of every individual service to be optimized for that service.
    Technology changes all the time, and an application composed of multiple, smaller
    services is much easier and less expensive to evolve with more desirable technology
    as it becomes available.


    ### Independently Deployable


    Perhaps the single most important characteristic of microservices is that because
    the services are smaller and independently deployable, it no longer requires an
    act of Congress to change a line of code or add a new feature in an application.


    ## Microservices Architecture Options


    Here are your options for architecture.


    ### Database Integration


    In this pattern, two or more services read and write data out of one central data
    store. All of the services go to this central data store. This can be illustrated
    using the banking application example from our previous post, which takes login,
    user profile, transactions, notifications, credit score, and spending reports
    as separate services defined by the business functionalities. Figure [19-1](#521767_1_En_19_Chapter.xhtml#Fig1)
    depicts how database integration can be utilized for different types of microservices.


    ![](images/521767_1_En_19_Chapter/521767_1_En_19_Fig1_HTML.png)


    A central database inputs from login service, transactions service, and user profile
    service. Login service from the database inputs to another database. Other inputs
    are User profile service, transactions service, spending reports service, notifications
    service, and credit score service.


    **Figure 19-1** Database with different microservices


    One of the significant advantages of database integration is simplicity. The transaction
    management is more straightforward as compared to other patterns. This is perhaps
    the most widely used pattern of integration—but also the most abused.


    This pattern couples services together undesirably, making the microservices architecture
    more difficult to change and expensive to scale. Defining the data ownership and
    updating the schema can become a messy process—every change requires re-compiling
    and deploying all of the services. It pushes toward highly orchestrated, big-bang-style
    deployments. This type of integration can create significant obstacles in maintaining
    the autonomy of microservices.


    Under the needs of high scale, the only option is to throw more hardware at the
    database, and even then it becomes difficult to avoid deadlocks in the database
    and row-level contentions.


    ### Synchronous API Calls


    Figure [19-2](#521767_1_En_19_Chapter.xhtml#Fig2) explains how communication between
    different microservices can happen through synchronous API calls. It gives a way
    to speak to each of these services.


    ![](images/521767_1_En_19_Chapter/521767_1_En_19_Fig2_HTML.png)


    Transactions service inputs to transaction database and user profile API. API
    inputs to user profile database along with user profile service.


    **Figure 19-2** API way of managing microservices


    In this integration pattern, the services communicate synchronously through an
    API. All the access to each other’s data is coordinated through an API in a request-response
    fashion, and the service waits for data from the API to perform its action. In
    the previous example, if the transaction service needs to read the user profile
    data, it calls the user profile API and gets what it needs.


    This provides a decent abstraction over a direct database call and offers excellent
    flexibility in terms of technical choices. This provides the benefit of hiding
    many implementation details: the abstraction gives us the freedom to change technologies
    without affecting our clients. For example, the user profile service could use
    Java and MySQL, while the transaction service could use SQL Server and .NET, and
    they can still easily speak to each other through the API.


    However, this is not much different than the direct database integration pattern.
    Adding another network hop on top of a database call can also inhibit scale: by
    increasing the workload, performance decreases—it is significantly at odds with
    most distributed systems fallacies. This integration pattern also makes transaction
    management difficult and inhibits autonomy, as services depend on one another’s
    uptimes. In microservices, if you have to read data synchronously outside of your
    system boundary, that is a service-oriented architecture smell.'
