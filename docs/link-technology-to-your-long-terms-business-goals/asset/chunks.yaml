  raw: '## Defining OKRs


    The following steps show how you can change the thought process of the team to
    start using OKRs:


    1.  Every OKR rollout must have a sponsor. The sponsor is usually the CEO or the
    head of the function, depending upon at which level you introduce OKRs. Some organizations
    like to do full-scale organization-wide rollouts, with the rest of the OKRs for
    select business groups or functions. The sponsor must make OKRs a conversation
    in leadership meetings, townhalls, and reviews. The sponsor must participate in
    setting the OKRs as they are the most important growth metrics.


    2.  Using OKRs is about bringing in consistency. Teams that are using OKRs must
    understand what they are, how OKRs are different from individual performance practices,
    and how the team writes and tracks OKRs. Teaching the fundamentals of OKRs can
    be done by internal coaches or external OKR coaches who are certified and trained
    on how to enable teams.


    3.  The sponsor and their team must be involved in setting the North Star OKRs
    for the rest of the teams to align with. If departments are using OKRs, then the
    department heads, leaders, and next-level team leads set the North Star OKRs.
    Remember in OKRs, less is always more. So, define no more than three objectives
    and three to five key results each.


    4.  The cross-functional team members come together to move the needle on the
    North Star metrics.


    These four steps will enable teams to collaborate effectively to achieve the objectives
    of the organization.


    For example, let’s say your North Star metric is to reduce dropout rates of a
    prospect exploring your website. Why? The intent, of course, is to have as many
    prospects as possible to select a plan and click Get Started or to contact your
    sales teams to start the onboarding process. We all know how important this is
    for revenue generation.


    But the business team can’t do this alone; it needs to collaborate with the technology
    team. Let’s give this cross-functional team a fancy name: the growth warriors.


    ### Growth Warriors


    The growth warriors have representation from the sales, marketing, product, and
    engineering departments. They need to solve a focused problem, which is “How do
    you reduce dropout rates from 70 percent to 40 percent in the next 90 days?”


    The growth warriors start by listing the existing challenges, which come in the
    way of achieving OKRs. Here are some examples:


    *   “We have no clear way of knowing who is visiting our website.”


    *   “The content or its placement is not engaging enough.”


    *   “We are not tracking the response time to those who place queries in the chat
    window.”


    *   “We do not have enough bandwidth, and there seems to be just too many requests
    coming to the tech teams.”


    The warriors set their objective statement after much deliberation:


    *Deliver a kick-ass experience to prospects on our website to reduce dropout rates.*


    The clear business value is to reduce dropout rates. The next step then is how
    to measure this. That’s where the following four key results (KRs) come in. They
    are the metrics that help determine if the inspirational objective has been met.


    *   *KR 1*: Reduce response rates to prospect queries from two days to ten minutes.


    *   *KR 2*: Increase the average time spent on the website from one minute to
    three minutes.


    *   *KR 3*: Reduce page load time from three seconds to one second.


    *   *KR 4*: Reduce dropout rates from 70 percent to 40 percent.


    Each team is aligned as an owner to a specific KR and starts their work. No matter
    what the team does, the goal is to ensure customer satisfaction by working on
    these four KRs. Each team member focusing on their objective through the KR will
    ensure that the objectives are driven in a customer-centric manner.


    ## OKR Grooming


    If you ask a Google employee, or Googler, about OKRs, you will often get the response
    that “it’s how we do business here.” That’s how ingrained it is in Google’s culture.


    OKRs require conditioning teams to accept managing by outcomes rather than managing
    by activities. Oh sure, activities are important, but ticking off feature builds,
    calling prospects, and meeting a partner will not move the business forward. These
    are the inputs, but the goal is to move on the outcome metrics. This is similar
    to growth warriors measuring reduction in turnaround time or making a prospect
    stay longer in their digital store.


    Teams need to understand that OKRs require selecting the right metric and not
    the easy-to-achieve metric. This mindset requires one to stretch their abilities.


    OKRs require a cross-functional collaborative mindset. The teams write the OKRs
    together and not in isolation or water-tight departmentalized structures, which
    plague many companies even today.


    Grooming is also for leadership team members. The command-and-control style of
    management is a deal-breaker in introducing OKRs. Here you are asking our teams
    to select metrics that can impact the business. The directive style should be
    replaced by a coach-led exploratory style, which encourages teams to select OKRs
    and experiment.


    Ultimately, what you expect out of OKRs as an exercise each quarter is the outcome.
    The OKR framework as an outcome-based tool will help drive a team’s actions every
    day (Figure [9-1](#521767_1_En_9_Chapter.xhtml#Fig1)).


    ![](images/521767_1_En_9_Chapter/521767_1_En_9_Fig1_HTML.png)


    A framework for OKR is an outcome-based tool that has four primary ideas: objectives
    to define a quarter, key results to reach the goal in 90 days, barriers to overcome
    numerous distractions, and finally, actions to motivate for everyday activities.


    Figure 9-1


    OKR as an outcome-based tool


    ## Summary


    Because of how flexible the OKR framework is, you can write OKRs in a variety
    of ways. Like any goal, OKRs should be verifiable and measurable. You should think
    of OKRs as the pillar of your strategy for the next period of time. However, to
    set good OKRs, you also need to connect them to your day-to-day work.


    # 10. Linking OKRs to Strategy


    Team alignment is probably the secret sauce to having a successful OKR rollout.
    While this seems easy, imagine aligning teams at scale when you 5,000 employees
    or an enterprise where you have a hundred thousand or more! The very reason why
    OKRs are used is to align teams better.


    Teams cannot set OKRs without linking them to organizational strategy.'
  trans: '

    # 定义 OKR


    以下步骤展示了如何转变团队的思维模式，开始使用 OKR：


    1.  每次 OKR 推行都必须有一位发起人。发起人通常是 CEO 或部门负责人，具体取决于你在哪个层级引入 OKR。有些组织喜欢在全公司范围内进行大规模推行，而其余
    OKR 则针对特定业务群或职能部门。发起人必须将 OKR 置于领导层会议、全员大会和复盘讨论中。发起人必须参与设定 OKR，因为它们是*最重要的增长指标*。


    2.  使用 OKR 关乎建立一致性。使用 OKR 的团队必须理解它们是什么、OKR 与个人绩效评估有何不同，以及团队如何撰写和追踪 OKR。教授 OKR
    基础知识可以由内部教练或经过认证、受过赋能团队培训的外部 OKR 教练来完成。


    3.  发起人及其团队必须参与设定“北极星”OKR，以便其他团队与之对齐。如果部门在使用 OKR，则由部门主管、领导者和下一级团队负责人设定“北极星”OKR。请记住，在
    OKR 中，少即是多。因此，每个团队定义的目标不超过三个，每个目标的关键结果不超过三到五个。


    4.  跨职能团队成员共同协作，以推动“北极星”指标的达成。


    这四个步骤将使团队能够有效协作，从而实现组织目标。


    例如，假设你的“北极星”指标是降低浏览你网站潜在客户的流失率。为什么？目的当然是为了让尽可能多的潜在客户选择一个套餐并点击“开始使用”，或联系你的销售团队以启动入门流程。我们都知道这对创收有多么重要。


    但业务团队无法独自完成这项工作；它需要与技术团队协作。让我们给这个跨职能团队起个炫酷的名字：增长尖兵。


    ## 增长尖兵


    增长尖兵由来自销售、市场营销、产品和工程部门的代表组成。他们需要解决一个核心问题，即“如何在接下来的 90 天内将流失率从 70% 降低到 40%？”


    增长尖兵首先列举现存挑战，这些挑战阻碍了 OKR 的达成。以下是几个例子：


    -   “我们无法清晰知晓谁在访问我们的网站。”

    -   “内容或其布局吸引力不足。”

    -   “我们没有追踪那些在聊天窗口提出询问的响应时间。”

    -   “我们带宽不足，而且技术团队接到的请求似乎过多。”


    经过深思熟虑，增长尖兵们设定了他们的目标陈述：


    *为网站访客提供极致体验，以降低流失率。*


    明确的商业价值是降低流失率。下一步是衡量标准。这就引出了以下四个关键结果。它们是帮助判断这个鼓舞人心的目标是否达成的指标。


    -   *关键结果 1*：将对潜在客户询问的响应时间从两天缩短到十分钟。

    -   *关键结果 2*：将用户在网站上的平均停留时间从一分钟增加到三分钟。

    -   *关键结果 3*：将页面加载时间从三秒减少到一秒。

    -   *关键结果 4*：将流失率从 70% 降低到 40%。


    每个团队作为特定关键结果的责任人，开始各自的工作。无论团队做什么，目标都是通过围绕这四个关键结果开展工作来确保客户满意度。每个团队成员通过关键结果聚焦于自己的目标，这将确保目标的达成是以客户为中心来驱动的。


    ## OKR 打磨


    如果你问一位谷歌员工关于 OKR 的问题，你通常会得到这样的回答：“这就是我们在这里开展业务的方式。”由此可见 OKR 在谷歌文化中根深蒂固的程度。


    OKR 要求训练团队接受以成果为导向的管理，而非以活动为中心的管理。当然，活动很重要，但勾选功能构建、致电潜在客户、会面合作伙伴并不会推动业务向前发展。这些都是投入，而目标是推动成果指标的进展。这类似于增长尖兵衡量周转时间的缩短，或让潜在客户在他们的数字商铺中停留更久。


    团队需要理解，OKR 要求选择*正确*的指标，而非*容易达成*的指标。这种思维方式要求人们拓展自己的能力。


    OKR 需要一种跨职能协作的思维模式。团队共同撰写 OKR，而不是孤立地撰写，或陷入至今仍困扰许多公司的、职能权责划分过于僵化的组织结构。


    打磨也适用于领导团队成员。命令与控制式的管理风格是引入 OKR 的绊脚石。在这里，你要求团队选择能够影响业务的指标。命令式风格应该被教练式的探索性风格所取代，这种风格鼓励团队选择
    OKR 并尝试。


    最终，你期望每个季度从 OKR 实践中得到的是成果。作为基于成果的工具，OKR 框架将有助于驱动团队每日行动（图 9-1）。


    ![](img/521767_1_En_9_Fig1_HTML.png)


    OKR 框架是一种基于成果的工具，包含四个核心思想：定义季度目标，在 90 天内达成目标的关键结果，克服众多干扰的障碍，以及激励日常行动的执行措施。


    **图 9-1**

    OKR 作为基于成果的工具


    ## 总结


    由于 OKR 框架的灵活性，你可以用多种方式撰写 OKR。像任何目标一样，OKR 应该是可验证且可衡量的。你应该将 OKR 视为未来一段时间内战略的支柱。然而，要设定好的
    OKR，你还需要将它们与日常工作联系起来。


    # 10. 将 OKR 与战略联系起来


    团队对齐很可能是成功推行 OKR 的秘诀。虽然这看起来简单，但想象一下，当你有 5000 名员工，或者在一家拥有十万甚至更多员工的企业中，要在如此大规模下对齐团队！这正是使用
    OKR 的根本原因——为了更好地对齐团队。


    团队在设定 OKR 时，不能脱离组织战略。

    '
- fmt: '# Team Alignment and Linking Objectives to Long-Term Strategy


    Before you decide on your OKRs, your company must have a strategy. What is strategy?
    The easiest way to think about this is how David defeated Goliath. David of course
    was no match for the strength of the giant and needed to have a strategy to defeat
    him. The David and Goliath story today is a metaphor for the competition being
    bigger and stronger. For those who know the story, David was a shepherd boy who
    refused to wear an armor; instead, all he had was his sling that he used to ward
    away wild animals from his sheep. Goliath was completely armored and had his sword
    and javelins. But David’s strategy was clear: he wore no armor to reduce the weight
    and keep himself swift, and he took down Goliath with just one slingshot between
    the forehead, which was not armored.


    At a company I worked at, we adopted OKRs in 2020 right after the pandemic took
    the world by surprise. It was an unprecedented time with no playbook. Going remote
    forever overnight required teams to first scramble to set up the basics correctly.
    We asked ourselves many questions. Do we have high Internet connectivity? Technology
    teams need high bandwidth for seamless VPN connectivity and remote infrastructure.
    Also, security is always on top of mind. How do we ensure data integrity when
    we went from two to four office locations to thousands of “work-from-home” office
    stations? This was the time to move away from micromanaging and throwing things
    at the tech team to help them see the purpose of why we are doing what we do.
    For instance, employees asked these types of questions:


    - “Why are reports being automated?”

    - “Why are we using Kafka for queue management?”

    - “What happened to our data migration project, and how did those efforts impact
    business?”


    The engineering mindset is about solving a problem, yet very often we find that
    engineering teams do their jobs well with regard to stability, functionality,
    security, architecture, and code reviews but forget to see the big picture.


    Let’s take an example of my team at that point in time that was looking at the
    business technology side of things. The supply chain and digital lending team
    were the two key stakeholders for our team. These teams ensure that the promise
    made by the organization to the end customer is delivered on.


    This is against a backdrop of a string of complexities, including managing inventory,
    fulfilling orders, ensuring the logistics are seamless, and ensuring that supportive
    elements like credit are available at attractive packages for customers to afford
    the product. Each business has a suite of applications that requires an army of
    engineers to deliver.


    That’s where we saw a bright spot for OKRs. Could we strengthen the collaboration,
    reduce ad hoc work, and give engineering teams the line of sight on business impact?


    The best way to get started was through a pilot. We onboarded a tool called `Fitbots`,
    an integrated OKR partner, with OKR coaching and platform support. The coaches
    first came in to deliver an overview on OKRs to us as the sponsors. The head of
    the business supply chain and myself had to accept the OKR framework before introducing
    it to our teams. With the clear value established in our minds, we selected a
    15-member team to get into OKRs.


    Together we wrote our first set of OKRs.


    The pilot teams were trained with an OKR basics session and coached by OKR coaches
    on how to select the right OKRs. We initially selected just folks from the engineering
    teams to test the process.


    Over the next week, the teams came up with their OKRs. These were mostly from
    an engineering lens and were missing the flavor of business alignment. The intent
    was to get a feel of the process, rather than getting the OKRs perfect (also there
    is no such thing as a perfect OKR).


    ## Sustaining OKRs: Setting a Weekly Cadence


    For OKR practitioners, you know what this is all about. OKRs borrow heavily from
    agile, and they need a cadence. Dedicating 30 minutes per week for your OKR check-in
    meetings can make your OKR rollouts successful.


    Each week, on the same day at the same time, the teams reported their progress
    to each other on their outcome metrics. During this meeting, KRs at risk started
    surfacing, and tagging us as sponsors also made us accountable to remove barriers
    earlier than later.


    With the rinse and repeat nature of check-in meetings, at the end of 90 days,
    we came to the conclusion that business teams needed to be involved in the OKR
    reboot process. This involves resetting (literally resetting OKRs or priorities)
    for the next 90 days. This time it was as pods with business and tech teams.


    As teams practice check-in meetings, they start getting more efficient, and the
    meeting time can be reduced from 30 minutes to 15 minutes.


    ## Summary


    The biggest benefit of OKRs comes when you can connect your daily work to your
    team’s strategic objectives. OKRs already begin to do that by connecting the objective
    to the key results that contribute to it. To get the most out of OKRs, take that
    benefit a step further: use an OKR tool that connects your daily work and regular
    projects to your company and business goals.


    # Ensuring Execution of Strategy


    While you spend more time in strategy planning meetings creating solutions for
    all the business problems, it becomes really important to find a platform that
    can help you execute those strategies. OKR tools can facilitate smooth execution
    of such strategies because team and leadership objectives are aligned through
    regular check-ins and retro reviews of the past objectives.'
