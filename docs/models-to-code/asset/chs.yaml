  ### 局限性


  我们此处展示的采样值方式仅适用于相对较低的频率，大约在几百赫兹的量级。采样点的时序由软件控制，这必然会在时序精度中引入抖动。由于我们使用延迟信号，且延迟时间分辨率为
  1 毫秒，因此可采样的最高频率为 1,000 赫兹。


  在更广泛的数据采集领域，这属于低数据速率，因此不应不加区分地应用我们这个简单的示例。当然，有可能做得更好，但这意味着要将更多工作转移到硬件中。我们对底层硬件的看法将与之前展示的不同。每种硬件配置都需要一定的软件控制，而这些控制可以使用此处展示的技术进行建模和实现。所不同的是软件模型所控制的底层硬件现实。而`SIO`域呈现的服务接口则保持不变。


  ## 数值阈值


  通常，我们关心的不是某个点的数值本身，而是该数值与某个阈值的比较结果。在润滑领域中，我们看到该域需要监测润滑压力，以确保其在有效的压力范围内。为了支持这种委派的能力，`SIO`域实现了数值阈值概念，并提供了一种将数值与定义的限制进行比较的方法。


  图 7-8 展示了一个数值阈值的示例。随着点值随时间被采样，该值可能会上升到指定的阈值限制以上。发生这种情况时，该值被视为超出范围。它将保持超出范围，直到它下降到阈值限制以下，此时它被视为处于范围内。


  ![A421575_1_En_7_Fig8_HTML.gif](img/A421575_1_En_7_Fig8_HTML.gif)


  图 7-8. 数值上的阈值限制


  此图展示了“超出范围”状态的上升沿检测。如果反转数值比较，就得到了互补形式的下降沿检测，即当点值下降到阈值限制以下时，检测到该点被视为超出范围。通过定义两个阈值限制，一个用于上升沿比较，一个用于下降沿比较，就可以监测一个数值，以确定它是否处于上限和下限之间。


  在判断数值是否超过阈值时，我们希望防止在阈值限制附近发生振荡，从而反复触发“超出范围”状态并紧接着进入“范围内”状态。我们使用一个简单的计数滤波器来为检测提供滞回特性。如果我们延迟对数值超出范围或处于范围内的判定，直到我们观察到连续多次超过或低于阈值限制的偏离，就可以防止数值的微小波动导致虚假的“超出范围”检测。如果我们希望在数值每次超过其阈值时都能看到，可以将限制次数设置为
  1。当然，还有许多其他可能的方法来为阈值判定增加滞回特性，但简单的计数方案既有效，在转换为代码时计算效率也高。


  图 7-9 是一个捕获了这些想法的类图。


  ![A421575_1_En_7_Fig9_HTML.gif](img/A421575_1_En_7_Fig9_HTML.gif)


  图 7-9. 范围限制的类图


  每个输入点都可以指定多个`点阈值`。在我们的示例中，我们使用三个`点阈值`来监测喷射器的润滑压力，以了解润滑压力是否足够、是否存在过大的泄压压力，或是否超过了最大允许压力。一个`范围限制`是将一个`点阈值`应用于一个`连续输入点`的值的实例。我们可以定义一个`点阈值`并将其应用于多个输入点，但对于每个这样的应用，我们需要一个单独的`范围限制`实例。检测阈值偏离所需的计算在`范围限制`类的状态模型中指定。


  ![A421575_1_En_7_Fig10_HTML.gif](img/A421575_1_En_7_Fig10_HTML.gif)


  图 7-10. 范围限制状态模型


  我们在此不展示该状态模型的完整 pycca 实现，因为它遵循您已见过的相同模式。但是，我们确实展示了`正在检查超出范围`状态的状态定义：


  - ❶ Pycca 定义了一个名为 `rcvd_evt` 的指针来访问事件参数。变量名和参数访问技术是一个不幸的选择，将在未来的版本中改进。


  ```

  state CHECKING_OUT_OF_RANGE(

  sio_Point_Value pointValue) {

  ClassRefVar(Point_Threshold, pt) = self->R7_PT ;

  bool outRange = pt->Direction == Rising ?

  rcvd_evt->pointValue > pt->Limit :

  rcvd_evt->pointValue Limit ;        // ❶

  if (outRange) {

  if (++self->Over_count >= pt->Over_limit) {

  PYCCA_generateToSelf(Out_of_range) ;

  }

  } else {

  self->Over_count = 0 ;

  }

  }

  ```


  ## 初始实例填充


  在本节中，我们展示信号 I/O 域初始实例填充的一部分。此填充对应于第 6 章中填充的润滑域的需求。我们不展示填充中的全部数值集合，仅展示与转换信号和检测数值阈值限制相关的部分。完整的填充内容可在在线资料中找到。


  为支持润滑域填充的需求，需要十一个 I/O 点：三个用于机械锁定装置，两个用于储液罐液位，三个用于喷射器压力，三个用于喷射器电磁阀。我们在此重点关注与喷射器压力关联的三个
  I/O 点，因为它们必须被采样并与阈值限制进行比较。


  喷射器压力由一个`连续输入点`表示，其值代表每个喷射器处的润滑压力。每个喷射器都有一个压力传感器，用于采样并转换为`连续输入点`的值。


  | ID | 数值 | 分组 |

  | --- | --- | --- |

  | `inj1_pres` | 0 | `inj1_cg` |

  | `inj2_pres` | 0 | `inj2_cg` |

  | `inj3_pres` | 0 | `inj3_cg` |


  用于喷射器压力的 I/O 点被组织成三个`转换分组`，每个分组仅包含一个点。


  | ID | 等待转换器 | 周期 | 转换器 |

  | --- | --- | --- | --- |

  | `inj1_cg` | false | 500 | `cvt1` |

  | `inj2_cg` | false | 500 | `cvt1` |

  | `inj3_cg` | false | 500 | `cvt1` |


  我们假设只有一个`信号转换器`连接到系统，并且所有喷射器压力传感器都连接到它。


  | ID | 转换器可用 |

  | --- | --- |

  | `cvt1` | true |


  润滑域假定信号 I/O 将对喷射器压力值执行阈值比较。必须确定三个阈值：高于泄压压力、高于注射压力、以及高于最大压力。从润滑域的填充内容中，我们知道存在两种喷射器模型。我们的压力阈值是基于不同的喷射器设计选择的。


