  `Injector.Pressure` 值时，它必须是最新的，并反映真实世界中喷油器上观察到的实际润滑剂压力。从桥接角度来看，我们必须确保 `Injector.Pressure`
  值与其对应的 `Continuous Input Point.Value` 属性值相同。从实现角度来看，有多种方法可以实现这一目标，每种方法都有不同的性能权衡。


  ### 喷油器压力警报


  最后一个例子稍微复杂一些，但我们将使用相同的过程。我们标记 Lubrication 域的元素，然后找出如何将它们映射到 SIO 的相应元素上。


  在监控喷油器压力期间，Lubrication 域期望 SIO 在出现以下四种情况之一时通知 `Injector`：


  1.  压力高于喷射润滑剂所需的最小值。

  2.  压力低于喷射润滑剂所需的最小值。

  3.  压力高于泄压时允许的最小值（即当未喷射润滑剂时）。

  4.  压力高于允许的最大值。


  `Injectors` 由其关联的 `Injector Designs` 来表征。`Injector Design` 的三个属性可以标记为阈值属性。这些标记表明了
  Lubrication 域的意图，即这些属性被用作喷油器压力所需压力警报的一部分。我们的任务是将此标记实现为 SIO 的元素。`Max delivery pressure`、`Max
  system pressure` 和 `Max dissipation pressure` 必须对应 `Point Threshold` 的实例，这些实例的 `Limit`
  值等于 `Injector Design` 的属性值。图 8-13 展示了这种对应关系。


  ![A421575_1_En_8_Fig13_HTML.jpg](img/A421575_1_En_8_Fig13_HTML.jpg)


