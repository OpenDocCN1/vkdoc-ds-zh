- '# 2. 一个简单的可执行模型


  本章描述构成示例应用可执行模型的主要元素。该应用特意做得非常小，以便我们可以展示如何将整个模型翻译成可运行的代码，且不留任何神秘空白。之后我们将运用同样的原理来构建更大、更复杂的应用。


  本章也旨在解释我们对 UML 图形符号的理解。我们使用 UML 图形符号来表示模型，但 `xUML` 在应用于该符号的语义上有很大差异。我们想确保你理解我们赋予这些图形符号的含义。


  在阅读本章时，参考附录 A 可能会有所帮助，该附录总结了关键的 `xUML` 符号和语义。




  ## 空中交通管制员应用


  空中交通管制应用负责管理管制中心内的空中交通管制员（ATC）。该系统确保所有本地空中交通得到指挥，同时管制员能够进行适当休息。图 2-1 展示了他们的工作环境。


  ![A421575_1_En_2_Fig1_HTML.jpg](img/A421575_1_En_2_Fig1_HTML.jpg)


  图 2-1. 空中交通管制中心


  该应用必须实现以下功能：


  - 将空中交通管制员（ATC）登录到值班站

  - 记录值班站所管辖的区域

  - 验证某个管制区域始终处于值班站的管辖之下

  - 记录管制区域交接给另一个值班站

  - 将管制员（ATC）登出值班站

  - 防止管制员连续工作超过 2 小时 15 分钟


  显然，仅凭这些描述来构建应用是不完整且不充分的，但这只是一个开始。有些人会建议进一步调研，并在需求文档中确定所有细节；而另一些更偏向敏捷方法的人则推荐通过编写可执行代码来探索应用，即使当前并未完全理解需求。我们取两者之长，构建一个详细的可执行模型，用于更深入地对应用进行调研。我们可以利用该模型进行评估、运行和测试。当对结果满意后，再将其直接转换为代码。


  我们将模型构建为三个相互关联的方面，如图 2-2 所示。


  ![A421575_1_En_2_Fig2_HTML.jpg](img/A421575_1_En_2_Fig2_HTML.jpg)


  图 2-2. 建模语言的三个层面


  第一个层面是**类模型**，它声明了系统中的概念实体。我们使用 UML 类图表示法的有限子集来表示该模型。类模型定义了类、类的属性以及类之间的关联。


  第二个层面由**状态模型**组成，它描述了某个类随时间变化的行为。同样，我们使用 UML 状态机图表示法的子集来表示该模型。每个类都有一个状态模型。每个类实例都拥有该状态模型的一个副本，即一个状态机。每个状态机（因此每个实例）对其当前状态都有独立的定义。模型中的大部分动态行为都发生在状态机的上下文中。


  第三个层面是**动作**。动作提供了计算和其他算法处理的细节。根据动作的表示方式不同，它们可能看起来像代码。但实际上，动作是对模型层面元素进行的模型层面计算的规格说明，这才是更好的理解方式。


  这三个层面各自代表了系统的一个视角。它们组合成一个连贯的整体，代表了你的应用所提出的逻辑问题的解决方案。这些集成的层面定义了一个完整、可执行的领域，该领域可以转换为代码。领域是一个连贯的主题事务，拥有其自身的一套策略和规则。通常，应用由多个领域组成，这些领域相互交互以满足整套应用需求。关于领域，还有许多内容需要阐述，我们将在第
  6 章中详细讨论。目前，只需了解建模后的领域是所有三个层面可独立执行和可测试的组合体即可。


  模型构建的顺序至关重要：


  - 首先构建**类模型**，用于捕获定义、数据、规则和约束

  - 然后构建**状态模型**，用于捕获模式、控制间隔和同步

  - 最后构建**动作**，用于捕获信号、数据处理和计算


  每一步都为下一步奠定基础并设定约束框架。例如，轮班在某个特定时间结束这一事实（包含在类模型中），比确定该时间的具体方式（包含在状态模型和动作中）更为根本。因此，我们首先确定最不易发生变化的元素，稍后再定义和添加变化性更强的元素。这种方法建立了一个稳定的底层结构用于构建，并减少了每当发生变更时所需的整体重构工作。


  重要的是要认识到，可执行性依赖于这三个层面。你必须知道如何进行计算（动作）、何时进行计算（状态模型），以及用于计算的确切数据（类模型）。


  ### 步骤 1：类模型


  图 2-3 展示了航空交通管制系统的类模型。该模型已被注释，以便我们指明对图形符号的解释。




  '
- '# 排版后的内容


  - ❶ 每个方框代表一个类。类是对一组具有共同行为、共同特征且遵循相同规则和策略的物理或假设事物（例如本例中的控制区）的抽象。类的每个实例被称为对象或实例。我们将互换使用这两个术语。第二个分区包含一个属性列表，这些属性定义了每个实例所需的数据。每个控制区都由名称、流量大小和当前控制器来描述。

  - ❷ 标识属性由标记 `{I}` 指示。类的标识属性集构成了它的标识符，它约束实例，使得没有两个实例的标识属性值相同。这也将类的实例约束为一个集合。在这种情况下，任何两个控制区都不能拥有相同的名称。标识符通常是很有用的应用程序数据（例如控制区的名称），但有时它完全是人为生成的。在模型被转换时，标识符可能会被转换或替换为更适合实现的内容。只要满足标识约束，转换就可以以任何方式自由地变换标识符。

  - ❸ 描述属性具有数据类型，显示在名称和冒号之后。我们以应用术语捕获类型（例如，0 到 200 之间的整数架飞机数量）。在我们定义了作用于该属性的所有操作之后，我们可以决定如何在程序中表示该类型。

  - ❹ 引用属性由标记 `{R}` 指示。这告诉我们该属性引用了另一个实例——在本例中，是指挥该控制区的控制器。所谓引用，是指实例中该属性的值等于另一个实例中某个属性的值。`控制区.控制器`
  属性告诉我们哪个控制器正在监控控制区的特定实例。然而，领域规则坚持要求控制器必须处于值班状态。因此，`控制区.控制器` 引用属性的值被约束为必须与某个实例的 `值班控制器.ID`
  的值相匹配。在实现时，这可以通过多种方式实现，例如数据库中的外键约束，或者仅仅是对指针值的检查。

  - ❺ 两个方框之间的这条线，标记为 R2，是一种关联关系。它代表了现实世界中值班控制器与控制区实体之间存在的关联。每个关联都有一个唯一的编号——在本例中是 2。按照惯例，我们在图形上将其标记为
  R，后跟其编号；例如，R2。需要唯一编号是因为同一对类之间可能存在多个关联（例如，一个人既可以驾驶一辆车，也可以拥有其他车辆）。

  - ❻ 这些是关联短语。这些动词短语是文本注释，告诉我们关于该关系的重要语义信息，并为如何描述现实世界中的关联提供助记。我们可以说，值班控制器正在控制区内指挥交通。同样，该关系还有一个被动语态版本，说明控制区拥有由值班控制器指挥的交通。这些短语的构造使其可以双向解读，构成一个“主语—动词短语—宾语”的句子，而给定方向的动词短语被放置在图中更靠近充当宾语角色的类的一侧。

  - 您可能更熟悉使用角色名称的 UML 风格。我们从大量实践中发现，动词短语风格几乎总是更精确且更具表现力。此外，直接说“正在...内指挥交通”比费心为控制区构思一个角色要容易得多。我们还发现，通过考虑动词短语来建立正确的多重性和条件性要容易得多。事实上，仔细地用精确的动词短语命名关联两侧的做法，经常能揭示出源需求中的矛盾、歧义和不完整之处。

  - ❼ 我们总是通过为关联的每一方定义其多重性和条件性来进一步约束关联。多重性指定了是否可以有多个实例参与该关联。条件性指定了某个实例是否必须参与该关联。这两个概念被组合成一个图形符号，例如，在控制区一侧的
  R2 的“0..*”表示，一个值班控制器正在指挥零个或多个控制区内的交通。关联的多重性和条件性的目的是约束一个类的实例集合的成员资格。

  - ❽ 这表示一种泛化关系。箭头指向超类，超类是其所有子类的泛化。在本例中，空中交通管制员可以是下班管制员或值班管制员，但不能同时是两者。一个具体的管制员（例如
  Ianto），他将同时是空中交通管制员和值班管制员。因此，他由以下属性描述：ID、姓名、评级、登录时间和当前控制的执勤岗位。我们对泛化的 xUML 解释比传统
  UML 的限制严格得多。我们将泛化视为一个集合划分，并且超类实例是所有子类实例的无交并集。UML 将其标记为 `{disjoint, complete}`。由于我们只有这一种具体的解释，因此我们在此省略了注释。此外，我们并不在泛化上暗示任何继承的概念。我们将超类和子类实例分开处理。我们将泛化关系解释为：在子类实例与超类实例之间存在一条无条件的、单一的关联，并且在超类实例与来自泛化的所有子类中的一个子类实例之间也存在一条无条件的、单一的关联。

  - ❾ 这种情况不常见，但一个类不通过任何关联与其他类连接是完全合法的。在这种情况下，班次规范只有一个实例，它定义了几个适用于所有空中交通管制员的时长。因为只有一个实例，无需进行任何关系遍历即可轻松选择它。（如果不同的空中交通管制员组受不同的休息时段约束，这种情况就会改变。）


  ![A421575_1_En_2_Fig3_HTML.gif](img/A421575_1_En_2_Fig3_HTML.gif)


  **图 2-3. 带注释的类图**


  关于类模型还有很多可以讨论的内容，并且已有整本专著论述它们，例如 Stephen Mellor 和 Marc Balcer 合著的 *Executable UML:
  A Foundation for Model-Driven Architecture*（Addison-Wesley Professional，2002 年）以及
  Chris Raistrick 等人合著的 *Model Driven Architecture with Executable UML*（Cambridge
  University Press，2004 年）。此外，关于如何构建类模型也有很多可以讨论的内容，同样有整本书专门论述这一主题。例如，Leon Starr 所著的
  *Executable UML: How to Build Class Models*（Prentice Hall，2001 年）。我们建议您阅读这些书籍，因为在转换之前必须构建一个完整的模型，而转换一个糟糕的模型只会产生同样糟糕的实现。




  #### 解释


  类模型通过少量、定义明确的元素就能揭示应用程序的诸多信息。它提供了一套精确且无歧义的词汇，用以解释和探讨问题。当我们谈及一个`控制区`时，指的就是模型上声明的那个确切的`控制区`，由其属性所定义，而非其他。正是这种“蛋头先生”式的严谨措辞，才保证了针对问题逻辑进行有意义讨论所需的精确性。


  例如，一名`值班管制员`需要一个`ID`、一个登录时间以及一个要工作的`执勤岗位`；而一名`下班管制员`则必须有`ID`和上一班次结束的日期。对`值班`和`下班管制员`的声明使我们能够区分二者，防止`下班管制员`登录，并确保`下班管制员`获得休息。当然，这是显而易见的。但如果我们仅仅定义了一个不带子类的`空管员`，这一点就并不明显了。这样的模型可能会允许`下班管制员`在`控制区`内指挥交通，即便在现实世界中这是被禁止的。


  属性的放置限制了我们对类含义的理解，因为每个属性都必须统一应用于该类的所有实例。例如，属性`执勤岗位.容量`对每个`执勤岗位`所能容纳的最大飞机数量进行了限制；而属性`控制区.容量`则会对`控制区`所能控制的飞机最大数量进行限制，从而限制了每个`控制区`内飞机数量的总和，而非所有飞机数量。当然，这是一个细节。但代码是细致的，并且针对这两种解释的代码是完全不同的。


  我们还需要确保理解每个属性的精确含义。例如，`控制区.流量`究竟是什么意思？是指当前区域内的飞机数量？最大值？还是其他完全不同含义？我们必须在生成代码之前确定这些含义，否则生成的代码将会有误。为了捕获这些信息，我们还必须为每个类、每个属性和每个关联编写描述。


  关联施加了在系统运行期间持续有效的约束。例如，`R2`关系中`控制区`侧的多重性“0..*”告诉我们，`值班管制员`是先登录，然后接管`控制区`，而不是在接管第一个`控制区`后被隐式登录。这也意味着管制员在退出登录前必须移交其`控制区`。多重性约束了关联事物的可能行为，从而更精确地限定了它们的含义。


  这些陈述——类的定义、属性的放置以及多重性施加的约束——都必须与现实世界进行验证。如果一名管制员只有在控制至少一个`控制区`时才被视为在岗，那么模型就是错误的，应该予以修改。是这样吗？我们必须查明。我们必须系统地质疑并评估模型中每个元素所蕴含的意义。例如，属性`下班管制员.上一班次结束`强制执行了充分的休息时间。什么休息时间？这在前面的需求列表中并未提及！（它本应包含：要求至少
  15 分钟的最短休息时间。）诸如此类。


  这些规则适用于系统运行期间，而非初始化期间。系统刚建立时，可能没有`执勤岗位`、管制员或区域，但将某些类视为已有预先存在的实例是有用的。管制员来来去去，但`执勤岗位`可以被视为在系统运行之前就已存在。表
  2-1 显示了系统启动时已存在的`执勤岗位`实例。


  **表 2-1. 执勤岗位实例**


  | 编号 | 位置   | 容量 |

  |------|--------|------|

  | DS1  | 前端   | 20   |

  | DS3  | 中心   | 30   |

  | DS2  | 前端   | 20   |


  类似地，表 2-2 显示了`控制区`的预先存在实例。


  **表 2-2. 控制区实例**


  | 名称    | 流量 | 管制员 |

  |---------|------|--------|

  | SJC18C  | 30   | ATC53  |

