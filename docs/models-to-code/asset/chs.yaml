  ### 更新压力


  桥接并不局限于操作。如果我们观察 `Injector` 类，会发现它有一个特殊属性 `Pressure`。其特殊性在于，Lubrication 领域假定可以读取该属性，从而获得实际物理
  `Injector` 的当前润滑剂压力。这意味着 SIO 被赋予了保持压力值更新的责任。在图 8-11 中，我们将其标记为传感器属性。在像 Lubrication
  这样的领域中，许多类似的属性常常分散在各处。SIO 的传感器概念是通过连续输入点实现的。对于 Lubrication 中的每个压力值，SIO 中都有一个对应的
  `Continuous Input Point` 实例。在原始设备值被转换并缩放为有意义的压力值后，当 `Injector` 读取其压力时，必须通过某种方式使其可用。我们将在本章稍后讨论具体方式，但目前只需知道属性值是被映射在一起的即可。


