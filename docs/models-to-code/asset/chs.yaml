  \n当`Fire`事件被发送到一个专门化为`Passive Launch Torpedo`实例的`Loaded Torpedo`实例时，该事件被传递到`Passive\
  \ Launch Torpedo`状态模型中的子类实例。这将导致转换到`EXPELLING`状态，鱼雷被推出其管。\n\n当接收到`Cleared tube`事件（也是多态的）时，我们知道鱼雷已在潜艇外部。它转换到`Migrating\
  \ to Fired`状态，在该状态中它与`Tube`解除关联，并成为`Fired Torpedo`的一个实例。\n\n如果在`LOADED`状态中发生`Recall`事件，则会为鱼雷放置一个软件锁，使其忽略任何后续的`Fire`事件。否则，该事件在`EXPELLING`状态中被忽略，因为此时鱼雷已半出管，实在难以召回！不用担心，图\
  \ 9-8 展示了在`Fired Torpedo`状态模型中可采取的操作。\n\n![A421575_1_En_9_Fig8_HTML.gif](img/A421575_1_En_9_Fig8_HTML.gif)\n\
  \n图 9-8. `Fired Torpedo`状态模型\n\n所以现在我们有一枚鱼雷已经离开潜艇，前往某个目标。此时，`Recall`事件将阻止鱼雷被武装。在与潜艇保持安全距离后，将检测到`Arming\
  \ distance`事件。\n\n然而，存在一个危险：在`Passive Launch Torpedo`或`Active Launch Torpedo`的`EXPELLING`或`ESCAPING\
  \ TUBE`状态中，`Recall`事件可能被忽略。一旦被忽略，事件就永远丢失了。这就是为什么在`Torpedo`类上定义了一个名为`Recall()`的类方法。要召回一枚鱼雷，需调用此方法。它做两件事。首先，它将`Torpedo.Recalled`属性设置为`true`。其次，它会触发指向自身的`Recall`多态事件，该事件随后被适当委托。这意味着即使事件可能被丢弃，活动的召回状态也会记录在属性值中，该值可以在后续状态中被检查并清除。\n\
  \n在`Arming`状态中，在武装鱼雷之前会查询`Torpedo.Recalled`的值，以防`Recall`事件在更早的状态中发生，而当时未能采取有效行动。\n\
  \n`Active Launch Torpedo`子类的状态模型与`Passive Launch Torpedo`的相似，但`ESCAPING TUBE`状态除外。如图\
  \ 9-9 所示。\n\n![A421575_1_En_9_Fig9_HTML.gif](img/A421575_1_En_9_Fig9_HTML.gif)\n\
  \n图 9-9. `Active Torpedo`状态模型\n\n这里需要注意的重要一点是，多态事件`Recall`、`Fire`和`Cleared tube`都在子类的状态模型中处理。我们重申，多态事件在被最终消费时并没有什么特别之处。我们只将以下任务委托给模型执行域：从超类实例导航到子类实例的泛化关系，以及将事件映射到接收实例的事件集。事件被接收后，其行为与任何其他事件相同（它会导致转换、被忽略或产生错误情况）。将运行时调度委托给模型执行域，允许我们向超类实例发送多态事件，而无需知道哪个相应的子类已被实例化。正如这个例子所示，多态事件与迁移子类相结合，可以仅通过单个类的状态模型来指定复杂的多模态行为。\n\
  \n\n\n## 使用 Pycca 翻译多态事件\n\n在本节中，我们将展示如何使用 `pycca` 翻译鱼雷发射模型。与以往一样，我们仅展示那些涉及你尚未见过的构造的翻译部分，并建议你参考在线资料中提供的完整示例。\n\
  \n首先，我们必须指定哪些事件是多态的。有两个类定义并委托了多态事件：`Torpedo` 和 `Loaded Torpedo`：\n\n* ❶ `polymorphic\
  \ event` 语句引入了可能发送给 `Torpedo` 类的多态事件名称。请注意，我们在前面的代码中使用了星号（`*`）作为类图上的非正式标注，以说明多态事件如何跨泛化进行映射。`Pycca`\
  \ 并不使用这种标注。消费状态模型中的事件只需要与声明为多态的事件名称相同即可。\n* ❷ 在这里，我们声明 `R1` 使用指针引用（`reference`）来实现泛化。这个选择是任意的，我们在此使用\
  \ `reference` 实现来演示其用法。如果我们像其他模型那样使用 `union` 风格来实现，多态事件的工作原理也是一样的。\n* ❸ 实例操作展示了如何发送多态事件（不带事件参数）。请注意，你必须使用特定的宏\
  \ `PYCCA_generatePolymorphic()` 来发送多态事件。\n* ❹ 由于鱼雷的数量是可变的，我们将种群声明为 `dynamic`（动态），并为\
  \ 20 个实例分配足够的空间。请记住，所有存储都在编译时分配，这里我们表示系统中最多有 20 枚鱼雷。另外请注意，由于我们在此案例中使用了 `reference`\
  \ 实现，存储空间会为每个 `Torpedo` 子类进行分配。在泛化的 `reference` 实现中，子类实例与超类实例是分开存储的。\n\n```\nclass\
  \ Torpedo\nattribute (Torpedo_ID ID)\nattribute (bool Recalled) default {false}\n\
  reference R5 -> Torpedo_Spec\npolymorphic event                                \
  \                # ❶\nRecall\nend\nsubtype R1 reference                        \
  \                     # ❷\nStored_Torpedo\nLoaded_Torpedo\nFired_Torpedo\nend\n\
  instance operation\nRecall()\n{\nself->Recalled = true ;\nPYCCA_generatePolymorphic(Recall,\
  \ Torpedo, self, self) ;    // ❸\n}\npopulation dynamic                        \
  \                       # ❹\nslots 20\nend\n```\n\n定义多态事件的第二个类是 `Loaded Torpedo`\
  \ 类：\n\n* ❶ 作为使用 `reference` 实现的泛化中的子类，我们需要一个指向其相关超类实例的引用，因为我们需要沿着 `R1` 从子类导航到超类。这个反向引用仅在必须从子类导航到超类时才需要。在本例中，我们需要执行此导航。如果\
  \ `Loaded Torpedo` 的活动从不沿 `R1` 导航到 `Torpedo`，则可以省略此引用。\n* ❷ 引入了两个新的多态事件。它们跨 `Loaded\
  \ Torpedo` 参与的所有泛化（在本例中仅是 `R2`）都是多态的。这意味着 `Fire` 和 `Cleared_tube` 必须由 `Passive Launch\
  \ Torpedo` 和 `Active Launch Torpedo` 的状态模型处理。\n* ❸ `Loaded Torpedo` 的实例也是动态的。我们只为八个\
  \ `Loaded Torpedo` 实例分配了空间。假设我们的潜艇有八个鱼雷发射管，四个在前，四个在后，那么潜艇上任何时候最多只能装填八枚鱼雷。由于在任何给定时间点，有些鱼雷被储存，有些已被发射，因此这里分配的存储空间不必与\
  \ `Torpedo` 类实例的相同。\n\n```\nclass Loaded_Torpedo\nreference R1 -> Torpedo     #\
  \ ❶\nreference R4 -> Tube\npolymorphic event           # ❷\nFire\nCleared_tube\n\
  end\nsubtype R2 reference\nPassive_Launch_Torpedo\nActive_Launch_Torpedo\nend\n\
  population dynamic          # ❸\nslots 8\nend\n```\n\n我们展示了在 `pycca` 中实现的 `Stored\
  \ Torpedo` 状态模型。我们省略了状态活动的 C 代码，以便专注于状态模型本身的结构：\n\n* ❶ `Stored Torpedo` 实例是通过 `Assigned`\
  \ 事件异步创建的（通过一个创建事件）。句点字符表示从初始伪状态开始的转换。\n* ❷, ❸ `Recall` 事件与其他事件一样出现。`Pycca` 会识别出\
  \ `Stored Torpedo` 是 `Torpedo` 沿 `R1` 的子类，并且 `Recall` 被定义为沿 `R1` 的多态事件。因此，当 `Recall`\
  \ 作为多态事件发送给 `Torpedo` 时，它会被当作一个普通事件分发给 `Stored Torpedo`。多态事件分发的具体机制将在另一节中讨论。\n*\
  \ ❹, ❺ `Removing` 和 `Migrating` 到 `Loaded` 这两个状态在状态模型中均被显示为终态。当 `Stored Torpedo`\
  \ 被召回时，它从系统中移除，不再存在。当 `Stored Torpedo` 被装填时，我们会创建一个新的 `Loaded Torpedo` 实例，因此必须删除\
  \ `Stored Torpedo` 的实例以维护 `R1` 泛化约束。\n\n```\nclass Stored_Torpedo\nreference R1\
  \ -> Torpedo\nreference R3 -> Storage_Rack\nmachine\nstate Installing_in_Rack(uint8_t\
  \ rack) {\n// 状态活动的 C 代码。\n}\ntransition . - Assigned -> Installing_in_Rack    \
  \           # ❶\ntransition Installing_in_Rack - Installed -> STORED\nstate STORED()\
  \ {\n// 状态活动的 C 代码。\n}\ntransition STORED - Load -> Migrating_to_Loaded\ntransition\
  \ STORED - Recall -> Cancel_maintenance_interval   # ❷\ntransition STORED - Request_maintenance_check\
  \ -> MAINTENANCE\nstate MAINTENANCE() {\n// 状态活动的 C 代码。\n}\ntransition MAINTENANCE\
  \ - Checks_out_ok -> STORED\ntransition MAINTENANCE - Failed_maintenance -> Removing\n\
  transition MAINTENANCE - Recall -> Removing                 # ❸\nstate Removing()\
  \ {\n// 状态活动的 C 代码。\n}\nfinal state Removing                                   \
  \     # ❹\nstate Migrating_to_Loaded(Tube_number Number) {\n// 状态活动的 C 代码。\n}\n\
  final state Migrating_to_Loaded                             # ❺\nstate Cancel_maintenance_interval()\
  \ {\n// 状态活动的 C 代码。\n}\ntransition Cancel_maintenance_interval - Maintenance_canceled\
  \ -> Removing\nend\npopulation dynamic\nslots 20\nend\n```\n\n最后，我们展示 `Stored Torpedo`\
  \ 的 `Migrating` 到 `Loaded` 状态的状态活动。此示例展示了如何在 `pycca` 中实现从 `Stored Torpedo` 到 `Loaded\
  \ Torpedo` 的子类迁移。让我们先回顾一下该状态活动的动作语言：\n\n```\n!& /R3/Storage Rack // 解除机架链接\nswitch\
  \ (/R1/R5/Torpedo Spec.Launch type)\n.Passive : torp .= migrate to Passive Launch\
  \ Torpedo\n.Active : torp .= migrate to Active Launch Torpedo\n// 链接发射管\ntorp/R2/Loaded\
  \ Torpedo &R4 Tube( Number: in.Tube )\n```\n\n由于我们选择使用 `reference` 泛化来实现 `R1` 和\
  \ `R2`，我们需要显式地管理实例的创建和删除。迁移意味着新子类的实例被创建并与超类建立关联，而旧子类的实例被删除。如果我们选择使用 `union` 机制来实现泛化，这个处理过程将会不同。因为通过\
  \ `union` 实现，子类存储包含在超类存储中，迁移仅在原地修改内容，无需创建和删除实例。这两种泛化实现机制各有其用途和权衡。\n\n\n\n*   **❶**\
  \ 通过 `R1` 关联超类和子类是一个两步操作。首先，我们将 `Torpedo` 超类中的指针更新到新创建的子类实例，包括超类所指向的子类类型（`Loaded\
  \ Torpedo`）。其次，我们必须建立从子类到 `Torpedo` 超类的引用。\n*   **❷** `Torpedo Spec` 的 `Launch`\
  \ 类型属性决定了我们必须为 `R2` 创建哪个子类。\n*   **❸** 同样的过程用于通过 `R2` 关联超类和子类实例。\n\n```\nstate Migrating_to_Loaded(Tube_number\
  \ Number) {\n// 因为这是一个最终状态，Stored Torpedo 实例在本活动结束时会被自动删除，\n// 并且由于 Storage Rack\
  \ 中没有指向 Stored Torpedo 的引用，\n// 我们无需处理 R3 关联。\n// 获取超类实例的引用。\nClassRefVar(Torpedo,\
  \ torp) = self->R1 ;\n// 创建一个 Loaded Torpedo 实例\nClassRefVar(Loaded_Torpedo, ltorp)\
  \ = PYCCA_newInstance(Loaded_Torpedo) ;\n// 通过 R1 将 Loaded Torpedo 关联到 Torpedo。\n\
  PYCCA_relateSubtypeByRef(torp, Torpedo, R1, ltorp, Loaded_Torpedo) ;   // ❶\nltorp->R1\
  \ = torp ;\n// 将 Loaded Torpedo 关联到 Tube。\nltorp->R4 = PYCCA_refOfId(Tube, rcvd_evt->Number)\
  \ ;\n// 现在处理 R2\nswitch (torp->R5->Launch_type) {                              \
  \         // ❷\ncase Active: {\n// 对于主动发射鱼雷，创建一个新实例。\nClassRefVar(Active_Launch_Torpedo,\
  \ altorp) =\nPYCCA_newInstance(Active_Launch_Torpedo) ;\n// 通过 R2 关联 Active Launch\
  \ Torpedo。\nPYCCA_relateSubtypeByRef(ltorp, Loaded_Torpedo, R2, altorp,\nActive_Launch_Torpedo)\
  \ ;                               // ❸\naltorp->R2 = ltorp ;\n}\nbreak ;\ncase Passive:\
  \ {\n// 对于被动发射鱼雷，创建一个新实例。\nClassRefVar(Passive_Launch_Torpedo, pltorp) =\nPYCCA_newInstance(Passive_Launch_Torpedo)\
  \ ;\n// 通过 R2 关联 Passive Launch Torpedo。\nPYCCA_relateSubtypeByRef(ltorp, Loaded_Torpedo,\
  \ R2, pltorp,\nPassive_Launch_Torpedo) ;\npltorp->R2 = ltorp ;\n}\nbreak ;\n}\n\
  }\n```\n\n## 多态事件如何发出信号\n\n在第 5 章中，我们展示了普通事件是如何发出信号并分发的。发出信号需要获取一个事件控制块（ECB），用适当的数据填充它，并将\
  \ ECB 发布到事件队列中。发出多态事件信号需要相同的基本操作集。\n\nPycca 提供了一个宏来与运行时代码交互。例如，将 `Fire` 事件发送给 `Loaded\
  \ Torpedo` 可能出现在一个状态活动中，如下所示：\n\n```\nPYCCA_generatePolymorphic(Fire, Loaded_Torpedo,\
  \ ltorp, self) ;\n```\n\n这会将 `Fire` 多态事件信号发送给 `Loaded Torpedo` 类的 `ltorp` 实例。\n\n\
  如果多态事件带有参数，你需要获取 ECB，填充参数，然后以与普通事件相同的方式发布事件。唯一的区别是，存在一个宏可以获取已被标记为多态的 ECB。对于某个假设的、带有名为\
  \ `When` 参数的事件 `Reload`，发出信号可能如下所示：\n\n```\nMechEcb polyecb = PYCCA_newPolymorphicEvent(Reload,\
  \ Torpedo, torp, self) ;\nPYCCA_eventParam(polyecb, Torpedo, When) = 20 ;\nPYCCA_postEvent(polyecb)\
  \ ;\n```\n\nPycca 将多态事件编号编码为从零开始的连续整数。这种数字编码与普通事件使用的编码不同。一些类会同时拥有一组普通事件和一组多态事件。为了区分不同的事件集，定义了一个枚举，并且每个\
  \ ECB 都携带该枚举的一个值，以指示分发每个不同事件类型所需执行的操作：\n\n```\ntypedef enum {\nNormalEvent,\nPolymorphicEvent,\n\
  CreationEvent\n} MechEventType ;\n```\n\n## 多态事件如何分发\n\n在第 5 章中，你看到了一个普通的、非多态的事件是如何发出信号并随后被分发的。为了发出信号，需要填写一个\
  \ ECB 并将其加入队列。普通事件的分发使用 ECB 和接收实例类的对象分发块来计算到新状态的转换，并调用相关的活动。类似地，分发多态事件需要来自 ECB 的数据与来自多态分发块（PDB）的数据相结合。\n\
  \n此外，多态事件的分发涉及从超类实例导航泛化关系以找到相关的子类实例。回顾一下，pycca 使用两种策略来存储泛化关系信息：\n\n*   存储为引用的泛化在超类实例结构中包含一个指向子类的指针。由于每个子类都有不同的数据类型，超类指针的类型被定义为\
  \ `MechInstance`（作为一个指向通用实例的指针）。\n*   存储为联合体的泛化在超类实例结构中包含该泛化所有子类数据结构的联合体。\n\n这种差异影响了计算相关子类实例引用的方式。使用一个枚举来区分这两种情况：\n\
  \n```\ntypedef enum {\nPolyReference,\nPolyUnion\n} PolyStorageType ;\n```\n\n无论泛化以何种方式存储，pycca\
  \ 都会在超类结构中定义一个成员，该成员编码了超类实例当前关联的子类的类型。Pycca 将此编码生成为从零开始的连续整数，我们将其用作数组索引。\n\n从事件队列中移除事件后，ECB\
  \ 的 `eventType` 成员决定了待分发的事件是否为多态。如果是，我们可以通过 ECB 的 `targetInst` 成员找到多态分发块，该成员指向接收多态事件的实例。与所有具有动态行为的实例一样，其\
  \ `instClass` 成员保存了一个指向其类信息的指针值。对于定义了多态事件的类，其类信息包含一个非 `NULL` 的 `pdb` 成员值，该成员指向一个多态分发块：\n\
  \n| `eventCount` | 为该类定义或委托给该类并在子类中处理的多态事件数量。 |\n| `hierCount` | 该类参与的泛化层次结构数量。该值通常为\
  \ 1，但复合泛化中的超类将具有大于 1 的 `hierCount`。 |\n| `hierarchy` | 指向层次结构分发块数组的指针。该数组有 `hierCount`\
  \ 个元素。 |\n\n```\ntypedef struct polydispatchblock {\nDispatchCount eventCount ;\n\
  DispatchCount hierCount ;\nHierarchyDispatch hierarchy ;\n} const *PolyDispatchBlock\
  \ ;\n```\n\n如果超类参与了一个复合泛化，则 `hierarchy` 数组中会有多个元素。多态事件会沿着超类参与的每个泛化关系向下分发，因此分发代码会遍历\
  \ `hierarchy` 数组。通常，只有一个泛化关系。\n\n分发一个多态事件需要两个操作。首先，我们必须从超类导航到子类的泛化关系。其次，我们需要将多态事件映射到子类的事件集上。层次结构分发块提供了这两个操作所需的信息：\n\
  \n\n\n| `refStorage` | 记录泛化关系是以引用形式还是联合形式存储。 |\n| `subCodeOffset` | 保存从实例结构体起始位置到存储当前相关子类类型编码处的字节偏移量。（该编码是第\
  \ 5 章所述的 `SubtypeCode` 类型的结构体元素。） |\n| `subInstOffset` | 保存从实例结构体起始位置到指向子类实例的指针位置，或到子类结构体联合体位置的字节偏移量。\
  \ |\n| `subtypeCount` | 保存该泛化关系存在的不同子类数量。此值用于运行时检查。 |\n| `eventMap` | 指向层次结构的多态事件映射的指针。该映射按行索引（子类型码）和列索引（多态事件编号）排列。映射数组中的每个条目均为以下类型。\
  \ |\n\n```\ntypedef struct hierarchydispatch {\n    PolyStorageType refStorage ;\n\
  \    AttributeOffset subCodeOffset ;\n    AttributeOffset subInstOffset ;\n    DispatchCount\
  \ subtypeCount ;\n    struct polyeventmap const *eventMap ;\n} const *HierarchyDispatch\
  \ ;\n```\n\n```\ntypedef struct polyeventmap {\n    EventCode event ;\n    MechEventType\
  \ eventType ;\n} const *PolyEventMap ;\n```\n\n要计算对子类实例的引用，需要将 `subInstOffset` 成员的值加到超类实例指针的起始地址上。根据\
  \ `refStorage` 成员的值，得到的地址要么是指向子类实例的指针（联合存储），要么是指向一个成员的指针，而该成员本身又是指向该实例的指针（引用存储）。\n\
  \n子类的类型通过使用 `subCodeOffset` 计算超类中存储编码后子类类型的位置来确定。利用子类码值和多态事件编号，我们可以索引到 `eventMap`\
  \ 中。为了使所有类的事件映射数据类型保持一致，我们将其存储为一维数组，然后通过将子类型码作为行号、多态事件编号作为列号来计算索引。这与我们之前从转换表调度普通事件时采用的策略相同。\n\
  \n事件映射由 `event` 和 `eventType` 组成。由于多态事件可以在重复的特化层次结构中向下传递多个层级，多态事件可能映射到另一个多态事件，因此我们需要知道事件类型。给定事件类型、事件编号和子类实例指针，我们可以递归地调度事件。图\
  \ 9-10 显示了调度多态事件所涉及的数据。\n\n![A421575_1_En_9_Fig10_HTML.gif](img/A421575_1_En_9_Fig10_HTML.gif)\n\
  \n图 9-10. 调度多态事件所使用的数据\n\n图 9-11 说明了一个场景：向已装填鱼雷实例发出多态 Fire 事件。\n\n![A421575_1_En_9_Fig11_HTML.gif](img/A421575_1_En_9_Fig11_HTML.gif)\n\
  \n图 9-11. 发出 Fire 多态事件\n\n一个 ECB 已被填写完毕并加入队列。唯一能将其与任何普通事件 ECB 区分开来的元素是 `eventType`\
  \ 字段被填写为 `PolyEvent`。一旦出队准备调度，就必须找到多态调度块。图 9-12 说明了如何定位 PDB。\n\n![A421575_1_En_9_Fig12_HTML.jpg](img/A421575_1_En_9_Fig12_HTML.jpg)\n\
  \n图 9-12. 定位 PDB\n\n最后，图 9-13 展示了如何索引多态事件映射以确定要发送哪个普通事件。\n\n![A421575_1_En_9_Fig13_HTML.gif](img/A421575_1_En_9_Fig13_HTML.gif)\n\
  \n图 9-13. 索引事件映射\n\n回到我们的鱼雷发射示例，以下是 `pycca` 生成的、用于支持 Torpedo 和 Loaded Torpedo 类多态事件调度的代码：\n\
  \n*   ❶ 这是一个多态事件映射到另一个多态事件的案例。在本例中，是来自 R1 的 Recall 事件沿着 R2 泛化关系向下传播。它映射到 Loaded\
  \ Torpedo 上的一个多态事件，并且映射到 Stored 和 Fired Torpedo 两个子类上的一个普通事件。\n*   ❷ 事件映射（`Torpedo_R1_pem`）中的元素数量始终等于\
  \ PDB（`Torpedo_pdb`）中的 `subtypeCount` 值乘以 `eventCount` 值。\n*   ❸ 此处 PDB 作为类信息的一部分出现。注意，Torpedo\
  \ 和 Loaded Torpedo 都不响应普通事件，因此 `pycca` 将它们的 `odb` 成员设置为 `NULL`。\n\n```\n/*\n* 类\
  \ \"Torpedo\" 的 PDB\n*/\nstatic struct polyeventmap const Torpedo_R1_pem[] = {\n\
  \    {.event = 6, .eventType = NormalEvent},\n    {.event = 2, .eventType = PolymorphicEvent},\
  \             // ❶\n    {.event = 6, .eventType = NormalEvent}\n} ;\nstatic struct\
  \ hierarchydispatch const Torpedo_hdb[] = {\n    {.refStorage = PolyReference,\n\
  \     .subCodeOffset = offsetof(struct Torpedo, R1__code),\n     .subInstOffset\
  \ = offsetof(struct Torpedo, R1),\n     .subtypeCount = 3,                     \
  \                  // ❷\n     .eventMap = Torpedo_R1_pem}\n} ;\nstatic struct polydispatchblock\
  \ const Torpedo_pdb = {\n    .eventCount = 1,\n    .hierCount = 1,\n    .hierarchy\
  \ = Torpedo_hdb\n} ;\n/*\n* 类 \"Loaded_Torpedo\" 的 PDB\n*/\nstatic struct polyeventmap\
  \ const Loaded_Torpedo_R2_pem[] = {\n    {.event = 0, .eventType = NormalEvent},\n\
  \    {.event = 1, .eventType = NormalEvent},\n    {.event = 2, .eventType = NormalEvent},\n\
  \    {.event = 0, .eventType = NormalEvent},\n    {.event = 1, .eventType = NormalEvent},\n\
  \    {.event = 2, .eventType = NormalEvent}\n} ;\nstatic struct hierarchydispatch\
  \ const Loaded_Torpedo_hdb[] = {\n    {.refStorage = PolyReference,\n     .subCodeOffset\
  \ = offsetof(struct Loaded_Torpedo, R2__code),\n     .subInstOffset = offsetof(struct\
  \ Loaded_Torpedo, R2),\n     .subtypeCount = 2,\n     .eventMap = Loaded_Torpedo_R2_pem}\n\
  } ;\nstatic struct polydispatchblock const Loaded_Torpedo_pdb = {\n    .eventCount\
  \ = 3,\n    .hierCount = 1,\n    .hierarchy = Loaded_Torpedo_hdb\n} ;\n/*\n* 类 \"\
  Torpedo\" 的类结构\n*/\nstatic struct mechclass const Torpedo_class = {\n    .iab =\
  \ &Torpedo_iab,\n    .odb = NULL,\n    .pdb = &Torpedo_pdb                     \
  \                // ❸\n} ;\n/*\n* 类 \"Loaded_Torpedo\" 的类结构\n*/\nstatic struct mechclass\
  \ const Loaded_Torpedo_class = {\n    .iab = &Loaded_Torpedo_iab,\n    .odb = NULL,\n\
  \    .pdb = &Loaded_Torpedo_pdb\n} ;\n```\n\n为了贯彻我们揭示翻译后应用程序运行所有细节的主题，我们展示了执行多态事件调度的代码。此时，ECB\
  \ 已从事件队列中移除，并且已确定必须调度一个多态事件：\n\n*   ❶ 这段地址算术计算了实例结构体中用于存储当前相关子类编码值的成员的位置，并获取该位置的值。例如，如果我们正在向一个\
  \ Torpedo 实例调度多态事件，此表达式将计算 `R1__code` 成员的地址，并从该位置获取值。\n*   ❷ 此表达式索引到多态事件映射中。由于映射存储为一维数组，我们必须自行进行行/列索引。`eventCount`\
  \ 告诉我们一行中元素的数量。Pycca 确保多态事件映射中的元素以正确的顺序存储，因此此索引表达式能获取到正确的事件映射。\n\n\n```c\nstatic\
  \ void\ndispatchPolyEvent(\nMechEcb ecb)\n{\nPolyDispatchBlock pdb = ecb->instOrClass.targetInst->instClass->pdb\
  \ ;\nassert(pdb != NULL) ;\nassert(ecb->eventNumber eventCount) ;\nassert(pdb->hierCount\
  \ > 0) ;\n/*\n* 每个从超类型出发的泛化层次结构，都会沿该层次向下生成一个事件，传递至其中一个子类型。\n*/\nHierarchyDispatch\
  \ hd = pdb->hierarchy ;\nfor (unsigned hnum = 0 ; hnum hierCount ; ++hnum) {\n/*\n\
  * 最常见的情况是沿单一层次结构进行分发。无论如何，我们可以在最后一次分发的事件上就地修改输入的 ECB。\n*/\nMechEcb newEcb ;\nif\
  \ (hnum == pdb->hierCount - 1) {\nnewEcb = ecb ;\n} else {\nnewEcb = mechEventAlloc()\
  \ ;\n/*\n* 设置源为原始发送者。\n*/\nnewEcb->srcInst = ecb->srcInst ;\n/*\n* 复制事件参数。\n*/\n\
  newEcb->eventParameters = ecb->eventParameters ;\n}\nSubtypeCode type = *(SubtypeCode\
  \ *)\n((char *)ecb->instOrClass.targetInst + hd->subCodeOffset) ; // ❶\nassert(type\
  \ subtypeCount) ;\nPolyEventMap pem = hd->eventMap +\n(type * pdb->eventCount +\
  \ ecb->eventNumber) ;               // ❷\n#           ifdef MECH_SM_TRACE\n/*\n\
  * 跟踪状态转换。\n*/\ntracePolyEvent(ecb->eventNumber, ecb->srcInst,\necb->instOrClass.targetInst,\
  \ type, hnum,\npem->event, pem->eventType) ;\n#           endif /* MECH_SM_TRACE\
  \ */\nnewEcb->eventNumber = pem->event ;\nnewEcb->eventType = pem->eventType ;\n\
  void *subTypeRef = (char *)ecb->instOrClass.targetInst + hd->subInstOffset ;\nnewEcb->instOrClass.targetInst\
  \ = hd->refStorage == PolyReference ?\n/*\n* 当泛化通过指针实现时，我们需要额外一级间接寻址来获取子类型的地址。\n\
  */\n*(MechInstance *)subTypeRef :\n/*\n* 当泛化通过联合体实现时，我们只需指向子类型的地址，因为它包含在超类型中。\n\
  */\n(MechInstance)subTypeRef ;\nif (newEcb->eventType == NormalEvent) {\nnewEcb->alloc\
  \ = newEcb->instOrClass.targetInst->alloc ;\nassert(newEcb->alloc != 0) ;\n}\nmechDispatch(newEcb)\
  \ ;\n++hd ;\n}\n}\n```\n\n再提炼其本质，用于分发多态事件的代码实际上是相当简短的。其大部分“智能”都来源于由 `pycca` 提供的数据结构的值。\n\
  \n### 总结\n\n本章展示了如何在模型层面规定并实现多态。可以在泛化关系中的超类上定义多态事件。在运行时，发送给超类实例的多态事件会沿泛化层次被分发到子类的状态机中。我们展示了如何向\
  \ `pycca` 规定多态事件，`pycca` 生成了哪些数据来支持多态事件分发，以及 ST/MX 域具体如何执行这种事件分发。\n\n所有 xUML 泛化都代表集合划分，而非继承。对于每个超类，恰好存在一个子类实例，并且该实例恰好属于一个子类。\n\
  \n泛化可以相互连接，形成以下几种形式：\n\n* **重复特化**：一个泛化的子类同时是另一个泛化的超类。\n* **多重泛化**：单个子类参与多个泛化，每个泛化都有一个超类与之对应。\n\
  * **复合泛化**：单个类在多个泛化中扮演超类的角色。\n\n重要的是，多态事件在每种形式中都能得到合理分发。\n\n超类可以委托事件，使得事件由每个子类处理，而不是由超类上的状态模型处理。子类随后可以处理事件，或者，如果它本身也是另一个泛化的超类，则可以进一步委托事件。每个被委托的事件必须在当前层级或更深的特化层级上由子类处理。接收到的事件总是在某个类中处理。\n\
  \n每个多态事件都在超类上定义，并在 `pycca` 模型脚本中指定。委托给子类的事件可以被该子类使用，就像使用模型脚本中该子类状态机部分的任何其他事件一样。\n\
  \n`pycca` 提供了不同的宏来支持带参数和不带参数的多态事件信号的发送。\n\n多态事件的分发处理方式不同，具体取决于泛化是使用联合体模式还是引用代码模式实现的。用于普通事件的事件控制块也用于分发多态事件。关键区别在于，需要引用一个额外的多态分发块来导航泛化的分发层次结构，并识别要处理的相应子类事件。\n\
  \n"
- "# 10. Pycca 及其他平台\n\n在本章中，我们讨论 `pycca` 程序本身的设计与实现。`Pycca` 被设计为一个语言处理器，它读取 DSL 语句来填充平台模型，并通过使用一个模板系统来查询已填充的平台模型以生成代码。它使用\
  \ Tcl 语言实现。\n\n我们还将在一个代表性的微控制器平台上展示 ALS 系统的一些尺寸和执行速度测量结果，以表明产生的内存使用和执行速度适合我们的目标平台。\n\
  \n作为本章的结尾，我们将简要概述一个目标平台，该平台使用 Berkeley DB（一种键/值数据存储引擎）来存储领域数据，而不是将所有数据保存在内存中。\n\n\
  ## Pycca 程序的设计\n\n在我们的翻译方法中，还有一个领域尚未讨论。我们已经展示了 `pycca` 的输入和输出，但尚未将 `pycca` 本身作为程序来讨论。限于篇幅，无法完整描述\
  \ `pycca` 的实现。`pycca` 的源代码和文档可以从本书网站免费获取。在本节中，我们将讨论 `pycca` 程序本身设计与实现的几个方面。\n\n\
  `Pycca` 包含三个主要设计元素：\n\n* **平台模型**\n* **领域特定语言处理**\n* **模板驱动的代码生成**\n\n\n### 平台模型\n\
  \n`pycca` 操作背后存在一个模型，这应该不足为奇。在接下来的讨论中，我们对两个抽象层级的事物使用相同的名称。让我们定义一些术语以保持清晰。当我们谈到**可执行模型**时，指的是要被转换的逻辑模型。当我们谈到**平台模型**时，指的是我们要转换到的实现技术平台模型。\n\
  \n`pycca` 的平台模型是针对目标实现技术特化的。这并非建模本身的通用模型（即元模型）。`pycca` 平台模型不设定如何创建可执行模型的规则。相反，它规定了我们的\
  \ C 语言实现将如何形成的规则。平台模型反映了我们为 `pycca` 生成的具体实现所做的技术选择。如果针对不同的平台，或者对我们平台上的实现细节做出不同的选择，都会在平台模型的差异中得到体现。\n\
  \n图 10-1 展示了 `pycca` 平台模型的一个片段。\n\n![A421575_1_En_10_Fig1_HTML.gif](img/A421575_1_En_10_Fig1_HTML.gif)\n\
  \n**图 10-1.** `pycca` 平台模型片段\n\n注意其中有名为 `Domain` 和 `Class` 的类。这些类对可执行模型中的 `Domain`\
  \ 或 `Class` 的实现对应物进行建模。\n\n平台模型规定，`Classes` 包含 `Data Elements`，并且一个类可以完全不包含 `Data\
  \ Elements`（R3）。`Data Elements` 恰好属于一个类，因此 `Classes` 之间不共享 `Data Elements`。所有 `Data\
  \ Elements` 都是三种类型之一（R4）：`Attributes`、`ClassRefs` 或 `SubtypeRefs`。此外，类引用是四种类型之一（R21）。\n\
  \n对于我们的目标，我们决定所有类实例都将保存在内存中，并存储在 C 结构体数组中。类结构的成员要么是属性、对类的（某种形式的）引用，要么是对泛化关系中子类的引用。平台模型中的类用于对由\
  \ `pycca` 生成的实现结构成员进行建模。对于 `pycca`，平台模型中的 `Class` 类与为实现而生成的 C 结构体有直接对应关系。\n\n例如，考虑来自我们的空中交通管制模型的\
  \ `Duty_Station` 类定义：\n\n```\nclass Duty_Station\nattribute (Station_Number Number)\n\
  attribute (Name_t Location)\nattribute (Aircraft_Maximum Capacity)\nreference R3\
  \ -> On_Duty_Controller\nend\n```\n\n`R3` 引用是对 `On_Duty_Controller` 类实例的单一引用。将创建一个\
  \ `SingClassRef` 实例（及其所有相关的超类实例），以对应 `Duty_Station` 类定义中的 `reference` 语句。当 `pycca`\
  \ 生成代码时，它会以两种方式使用此信息。当声明 `Duty_Station` 结构体时，它包含一个成员 `struct On_Duty_Control *R3`。这在以下\
  \ `pycca` 生成的结构体定义中显示：\n\n```\n/*\n* Duty_Station 结构体定义\n*/\nstruct Duty_Station\
  \ {\nstruct mechinstance common_ ; // 必须放在第一位！\nStation_Number Number ;\nName_T\
  \ Location ;\nAircraft_Maximum Capacity ;\nstruct On_Duty_Controller *R3 ;\n} ;\n\
  ```\n\n在创建初始实例群体的初始化器时，`R3` 成员被设置为 `On_Duty_Controller` 数组成员的地址或 `NULL`，具体取决于所请求的群体。这在我们的示例的初始实例群体中显示：\n\
  \n```\n/*\n* \"Duty_Station\" 的初始实例存储\n*/\nstatic struct Duty_Station Duty_Station_storage[3]\
  \ = {\n{.common_ = {1, 0, &Duty_Station_class}, \"S1\", \"Front\", 20, .R3 = NULL},\n\
  {.common_ = {2, 0, &Duty_Station_class}, \"S2\", \"Center\", 30, .R3 = NULL},\n\
  {.common_ = {3, 0, &Duty_Station_class}, \"S3\", \"Front\", 45, .R3 = NULL}\n} ;\n\
  ```\n\n请注意，平台模型中的许多类都有 `File` 和 `Line` 属性。这些属性记录了定义实体的输入文件名以及文件内的行号。此信息有助于生成错误消息，以及在生成的代码文件中插入\
  \ `#line` 指令。\n\n`pycca` 平台模型有 35 个类。它们涵盖了 DSL 语言语句中指定的信息类型，例如类、属性、状态转换和初始实例。`pycca`\
  \ 平台模型构成了程序其余部分组织方式以及代码生成所需处理方式的基础。\n\n### 领域特定语言处理\n\n为计算机语言生成解析器是一个已被充分理解的问题。`Pycca`\
  \ 遵循定义语法并使用解析器生成器创建 `pycca` DSL 解释器的常见模式。当输入被扫描和识别时，代码在语法元素归约时被执行。当 DSL 语句被识别时执行的代码会创建平台模型类的实例。语言语句中的数据对应于平台模型类实例中的属性。你可以将\
  \ `pycca` DSL 视为平台模型群体的一种文本形式且更方便的表示。直接填充平台模型也可以达到同样的效果，但使用 DSL 提供了以更人性化的方式组织平台模型群体的机会。\n\
  \n与其他计算机语言一样，可以编写语法正确但毫无意义的 `pycca` DSL 语句。因此，`pycca` 在解析输入文件并填充平台模型后，会执行一组语义检查。某些语义由平台模型上的约束强制执行，例如平台模型关系所隐含的那些约束。其他语义则需要执行代码。\n\
  \n例如，如果状态模型中的某个状态被标记为最终状态，则不允许从该状态出发的出站转换。因为转换到最终状态的实例在其状态活动执行完毕后会被删除，所以它不可能响应其他事件。`Pycca`\
  \ 也不允许孤立状态（既没有出站也没有入站转换的状态）。这样的语义检查共有 20 个。\n\n### 模板驱动的代码生成\n\n`pycca` 的代码生成器是使用模板扩展设计的。这是一种从生成会计报告到生成网页的通用惯用做法。`Pycca`\
  \ 使用它的方式与任何模板系统非常相似。文本从模板传递到输出。命令嵌入在模板中，当模板扩展器识别出命令时，它会执行该命令，并将从嵌入命令返回的结果放入输出中。`pycca`\
  \ 使用的模板包含嵌入命令，这些命令查询平台模型以找到代码生成过程中该点所需的信息，然后将这些信息格式化为有效的 C 语言语句。从概念上讲，`pycca` 所做的事情与银行程序查询数据库并打印账户对账单所做的事情几乎没有区别。`pycca`\
  \ 的目标是为 C 编译器生成输出，而不是为银行客户生成输出。\n\n使用模板使我们能够对生成的输出进行排序，以适应 C 编译器的要求。生成的头文件和代码文件有各自的模板。这些模板经过设计和排序，使得嵌入的扩展命令将其输出放置在输出中的适当位置。C\
  \ 语言需要大量的类型注解，并坚持符号名称在其定义之前（或有时同时）被声明。声明和定义是 C 语言中的关键概念，并且通常声明必须先于定义。例如，状态活动函数的前向声明被放置在使用这些函数名称的数据结构定义之前。然后，这些内容又被放置在状态活动函数代码的定义之前。\n\
  \n\n\n### Pycca 实现\n\nPycca 使用 Tcl 语言实现。Tcl 是一种通常用作脚本语言的动态语言。选择脚本语言来实现 pycca 可能看起来不寻常，但\
  \ Tcl 具有许多理想的特性：\n\n- Tcl 是一种成熟、稳定的语言，已经积极开发了 20 多年。\n- Tcl 是平台无关的，可在 Linux（及其他\
  \ UNIX 衍生系统）、macOS 和 Windows 上运行。\n- Tcl 程序可以作为单文件可执行文件分发，无需外部依赖或复杂的安装要求。\n- Tcl\
  \ 是可扩展的，并支持一个庞大的标准过程库。\n\n在实践中，用于实现 pycca 这类程序的语言选择，应基于可用性和便利性。它应该是一种实现者熟悉的语言，并且能够便利地支持上一节中设计思想的实现。这里我们讨论如何使用\
  \ Tcl 来实现 pycca 的设计。\n\nPycca 的平台模型是一个规范化的关系模式，我们所有的示例模型都是如此。Pycca 使用 TclRAL（关系代数库）包来实现平台模型上的操作。TclRAL\
  \ 包实现了关系代数，其中操作符是 Tcl 命令，而值和变量直接集成到 Tcl 语言中。你可以将平台模型的 TclRAL 实现视为一个内存数据库，它使用普通的\
  \ Tcl 语言命令来查询和操作平台模型数据。它的设计明确旨在支持我们建模方法的完整性约束。TclRAL 完全集成到 Tcl 值系统中。在 TclRAL 中不存在“阻抗不匹配”的问题，因为你不必使用不同的语言来查询和操作数据，然后再将查询结果传回实现语言以进行进一步处理。将这种方法与\
  \ SQL 进行对比，后者要求你处理实现语言和查询语言之间不可避免的边界。\n\n秉承著名的 `lex` 和 `yacc` 程序的传统，Tcl 拥有 `fickle`\
  \ 和 `taccle` 来执行生成词法分析器和语法分析器的相同功能。在这种情况下，生成的分析器和语法分析器以 Tcl 代码的形式交付，而不是 C 代码。\n\n\
  标准的 Tcl 库包含执行模板扩展的过程，这些过程用于生成头文件和代码文件。模板包含直接传递给输出的普通文本以及嵌入其中的 Tcl 命令。嵌入的命令被执行，其输出被写入生成的文件中。嵌入的命令被实现为对平台模型的\
  \ TclRAL 查询，并将结果适当地格式化为 C 语言语句。\n\nPycca 程序由大约 5,000 行 Tcl 代码、语法规范和词法分析器规范组成，不包括注释或空行。我们不喜欢使用代码行数作为软件度量标准，这里仅提供对\
  \ pycca 程序大小的粗略、相对指示。因此，pycca 并不是一个大型程序，但这很大程度上归功于使用了 Tcl，以及 Tcl 作为一种语言，能够用更少的代码行进行表达。如果它用\
  \ C 编写，pycca 的规模可能会大几倍。\n\n### Pycca 性能\n\n不仅需要将模型翻译成可运行的代码，而且最终实现的质量也必须满足项目的需求。如果不能满足性能要求，那么生成有洞察力的模型并将其忠实地翻译成代码就意义不大。\n\
  \n我们的目标平台是基于微控制器的系统。这类系统的主要挑战在于可用的计算资源有限。内存和处理器速度通常都非常小。在本节中，我们将展示 ALS 系统翻译的一些性能数据。\n\
  \n#### 目标硬件平台\n\n许多市售平台都能满足我们的需求。我们选择了 Silicon Labs 的 Giant Gecko。此微控制器有一个名为 `EFM32GG-STK3700`\
  \ 的入门套件。\n\n该入门套件上的微控制器是 `EFM32GG990F1024`。该计算机是一款基于 ARM Cortex-M3 的 SoC，具有 1 MiByte\
  \ 闪存和 128 KiByte RAM。该 SoC 支持超低功耗睡眠模式，从闪存执行代码时功耗约为 219 μA/MHz。尽管能够以 48 MHz 的时钟频率运行，但在这些测量中，微控制器的时钟频率设置为\
  \ 7 MHz。这些规格将 Giant Gecko 置于我们目标微控制器类别中性能较强的一端。\n\n#### 目标软件平台\n\n本示例的代码是使用 Silicon\
  \ Labs Simplicity Studio 开发环境构建的。我们包含了供应商提供的硬件访问库中的代码，以及构建完整应用程序所需的启动代码和其他小段代码。\n\
  \n该应用程序是使用 GNU 编译器套件构建的：\n\n```\narm-none-eabi-gcc (GNU Tools for ARM Embedded Processors)\
  \ 5.4.1 20160919 (release)\n[ARM/embedded-5- branch revision 240496]\n```\n\n应用程序编译时定义了预处理符号\
  \ `NDEBUG`、`MECH_NINCL_STDIO` 和 `RELEASE`，以移除所有断言和对 C 标准 I/O 函数（例如 `printf`）的使用。优化配置为使用\
  \ `-Os` 设置以实现最小体积。目标文件中未使用的数据和函数在最终可执行文件中被丢弃。这种构建设置的组合产生了体积最小的可执行文件。为调试和检测而构建时，可执行文件的体积通常是发布版本的两倍。\n\
  \n\n\n### ALS 代码大小\n\n以下测量结果针对第 6 章至第 8 章中所示的 ALS 应用示例。该示例包含两个域以及它们之间的桥接代码。润滑（Lubrication）域包含了指向\
  \ UI 和警报（Alarms）域的外部实体引用，这些引用已被存根化。同样，SIO 域包含了用于访问设备硬件的外部实体引用，这些引用也已被存根化。\n\n表 10-1\
  \ 显示了集成润滑/SIO 应用的总内存使用量（以字节为单位）。\n\n**表 10-1. ALS 应用代码大小（字节）**\n\n| 文件 | 代码与常量 |\
  \ 已初始化数据 | 未初始化数据 | 总计 |\n| --- | --- | --- | --- | --- |\n| `lube_sio.axf` | 12,064\
  \ | 1,784 | 756 | 14,606 |\n\n应用的总内存使用量轻松适配我们的目标硬件，并且也同样适配此类中的许多其他目标硬件平台。\n\n我们可以通过检查各个域和桥接代码的大小来细分内存使用情况，如表\
  \ 10-2 所示。\n\n**表 10-2. ALS 域代码大小（字节）**\n\n| 文件 | 代码与常量 | 已初始化数据 | 未初始化数据 | 总计 |\n\
  | --- | --- | --- | --- | --- |\n| `lube.o` | 2,663 | 476 | 0 | 3,139 |\n| `sio.o`\
  \ | 2,070 | 776 | 0 | 2,846 |\n| `lube_sio_bridge.o` | 471 | 0 | 0 | 471 |\n| 总计\
  \ | 5,204 | 1,252 | 0 | 6,456 |\n\n在总内存使用量中，不到一半用于域和桥接代码。我们应当注意，此应用的初始实例数量非常小，这反映在已初始化数据的大小上。增加初始实例的数量只会增加已初始化数据的使用量。无论初始实例数量大小如何，代码与常量的内存使用量都将保持不变，因为该内存使用量已经包含了域的所有代码和\
  \ pycca 生成的信息。还要注意，已初始化数据还会在 RAM 中分配相同大小的空间，而这并未显示在这些总计中。在复位时，已初始化数据会由编译器提供的启动代码从闪存复制到\
  \ RAM。由于闪存技术不允许像 RAM 那样直接更新，因此 RAM 副本允许在程序运行期间更新类实例的值。这种为已初始化数据分配双倍空间（闪存中的一份和 RAM\
  \ 中相同大小的另一份）的需要，是微控制器 SOC 设计中闪存和 RAM 分开这一典型特征的直接结果。\n\n有必要考察一下 ST/MX 域对总体内存使用量的贡献。这一点很重要，因为运行\
  \ pycca 生成的应用程序必须要有模型执行（Model Execution）域，它代表了一种必须分摊到整个应用中的固定成本。参见表 10-3。\n\n**表\
  \ 10-3. 模型执行域代码大小（字节）**\n\n| 文件 | 代码与常量 | 已初始化数据 | 未初始化数据 | 总计 |\n| --- | --- |\
  \ --- | --- | --- |\n| `mechs.o` | 2,032 | 12 | 720 | 2,764 |\n| `pycca_portal.o`\
  \ | 990 | 0 | 0 | 990 |\n| `platform.o` | 471 | 1 | 0 | 472 |\n| 总计 | 3,521 | 13\
  \ | 720 | 4,226 |\n\n`mechs.o` 文件包含了 MX 域中所有与目标无关的代码。这包括事件队列和事件信号/分发代码等。`pycca_portal.o`\
  \ 文件由桥接中使用的门户函数组成。最后，`platform.o` 文件包含了 MX 域所需的平台特定代码。这包括控制用于延迟事件的定时资源、处理低功耗模式睡眠和唤醒的代码，以及与同步队列接口的代码。未初始化数据被分配给事件队列、事件控制块以及\
  \ ST/MX 实现的其他内部资源。这些资源可以根据需要进行扩展或收缩，此总计代表了默认配置（10 个事件控制块，16 字节参数数据空间，以及 10 个同步队列槽位）。\n\
  \n与许多针对微控制器的 RTOS 实现相比，ST/MX 域的内存使用情况堪称优异。然而，这种比较并不直接。RTOS 将包含 ST/MX 所不具备的多任务处理、任务间同步和互斥功能。ST/MX\
  \ 是单线程的，严格采用事件驱动且运行至完成的执行方式，不需要任务调度服务，也不支持运行它们所需的同步操作和互斥机制。相反，ST/MX 可以向状态机发送事件信号并分发事件，这是\
  \ RTOS 所不具备的功能。\n\n剩余内存使用量的大约 25% 来自启动代码、标准 C 库、编译器库、硬件访问库、外部实体存根，以及使应用程序能够运行所需的其他“胶水”代码。虽然这占总内存使用量的很大一部分，但它代表了应用程序的固定成本。\n\
  \n### 执行速度\n\n我们仅提供一个执行速度测量结果，如表 10-4 所示。发送事件信号和分发事件是 ST/MX 域中的一个常见操作。这里我们测量了发送信号并分发一个自指向事件所需的\
  \ CPU 周期数。这包括分配 ECB、填充 ECB、将其添加到事件队列、返回主循环以判断是否有其他事件需要分发、从事件队列中移除 ECB、计算状态转换以及进入状态活动所需的时间。方便的是，ARM\
  \ Cortex-M3 内置了一个用于此目的的周期计数器。\n\n**表 10-4. 事件信号发送与分发时序**\n\n| 周期数 | 7 MHz 下的时间 |\
  \ 7 MHz 下的操作数/秒 |\n| --- | --- | --- |\n| 4,696 | 67 μs | 1,491 |\n\n完成信号发送/分发操作需要\
  \ 4696 个周期。在 7 MHz 时钟频率下，这意味着大约需要 67 微秒，或者换句话说，每秒大约可以执行 1491 次此类操作。与运行在 2–3 GHz\
  \ 频率且拥有大型指令和数据缓存的现代桌面及服务器级计算机的能力相比，这些数字显得有些相形见绌。我们必须注意，不要在如此悬殊的计算技术之间进行外推比较。\n\n\
  ### 性能讨论\n\n在此领域进行性能比较是困难的。我们没有用于测试 MX 域实现的基准测试。直接比较几乎不可能，因为为应用程序在建模和非建模实现中提供相同的功能成本过高。\n\
  \n本文提供的测量结果证明，pycca 翻译后的域的性能确实能够匹配许多基于微控制器的系统所提供的计算能力。我们很好地控制在内存目标范围内，并且事件信号发送的实现具有合理的周期计数。在众多系统上的经验表明，根据目标平台仔细调整翻译方案和模型执行域，可以使翻译后的模型满足项目的性能目标。\n\
  \n\n\n### 提供特定于实现的代码\n\n在建模应用逻辑时，问题规模是我们不考虑的实现方面之一。一个类只有几个实例还是数百万个实例，并不会改变应用逻辑的基本原理。如果需要根据某个属性的值来查找类实例，无论实例数量是几个还是很多，都不会影响我们必须找到所需实例这一事实。\n\
  \n但在考虑实现此类查找时，规模就变得至关重要。当某个类的实例数量增长到足够大，并且我们需要查找特定实例的频率增加时，`pycca` 宏提供的简单顺序查找可能会成为性能瓶颈。\n\
  \n回顾第 4 章中的 `Air_Traffic_Controller` 类：\n\n```\nclass Air_Traffic_Controller\nattribute\
  \ (Employee_ID ID)\nattribute (Name_T Name)\nattribute (Experience_Level Rating)\n\
  # ...\n# 空中交通管制员类的其他部分\nend\n```\n\n我们可以使用 `pycca` 宏来查找与给定 ID 匹配的 `Air_Traffic_Controller`\
  \ 实例：\n\n```\nClassRefVar(Air_Traffic_Controller, atc) ;\nPYCCA_selectOneInstWhere(atc,\
  \ Air_Traffic_Controller, strcmp(atc->ID, \"ATC-137\") == 0) ;\nif (atc >= EndStorage(Air_Traffic_Controller))\
  \ {\n// 未找到\n} else {\n// 已找到\n}\n```\n\n这段代码会对 `Air_Traffic_Controller` 的所有实例执行简单的顺序遍历，并比较\
  \ `ID` 属性的值以寻找匹配项。这种方法很简单，已经提供，并且对于少量实例来说运行良好。随着 `Air_Traffic_Controller` 实例数量的增加，我们将需要更优的解决方案。\n\
  \n例如，我们可以使用二分查找来减少比较次数。二分查找要求被查找的项按特定顺序排列。然而，Pycca 在内存中按定义顺序组织初始实例群体。要将顺序查找转换为二分查找，我们需要按\
  \ `ID` 属性的升序排列 `Air_Traffic_Controller` 的初始实例。假设我们的初始实例群体如下：\n\n```\ntable\nAir_Traffic_Controller\
  \ (Employee_ID ID) (Name_T Name) (Experience_Level Rating) R1\n@atc51  {\"ATC-51\"\
  } {\"Ianto\"}    {\"C\"}       -> On_Duty_Controller.atc51\n@atc53  {\"ATC-53\"\
  } {\"Toshiko\"}  {\"A\"}       -> On_Duty_Controller.atc53\n@atc67  {\"ATC-67\"\
  } {\"Gwen\"}     {\"B\"}       -> On_Duty_Controller.atc67\n@atc77  {\"ATC-77\"\
  } {\"John\"}     {\"B\"}       -> Off_Duty_Controller.atc77\n@atc87  {\"ATC-87\"\
  } {\"Fred\"}     {\"B\"}       -> Off_Duty_Controller.atc87\n# ...\n# 按 ID 属性升序排列的其他许多管制员\n\
  # ...\nend\n```\n\n通过定义一个 `class operation`，我们可以添加自己的代码来应用二分查找，以找到匹配的 `Air_Traffic_Controller`。标准库的\
  \ `bsearch()` 函数需要以下参数：\n\n*   指向搜索键的指针\n*   指向待搜索项数组起始位置的指针\n*   数组中的项数\n*   每个数组项的大小\n\
  *   一个返回整数的比较两个项的函数\n\n我们将 `class operation` 定义为 `Air_Traffic_Controller` 类的一部分：\n\
  \n*   ❶ `BeginStorage` 宏解析为给定类的存储数组的地址。\n*   ❷ Pycca 会发出一个宏定义，用于表示类的实例数量。\n*   ❸\
  \ 我们必须为 `bsearch` 提供一个比较函数。\n*   ❹ 将比较函数放在 `implementation prolog` 中，确保其定义出现在 `class\
  \ operation` 中使用它之前。\n\n```\nclass Air_Traffic_Controller\n# ... 空中交通管制员类的其他部分\n\
  class operation findByEmployeeID(char const *eid) :\n(struct Air_Traffic_Controller\
  \ *) {\nstruct Air_Traffic_Controller key = {\n.ID = eid\n} ;\nreturn (struct Air_Traffic_Controller\
  \ *)bsearch(&key,\nBeginStorage(Air_Traffic_Controller),       // ❶\nATCTRL_AIR_TRAFFIC_CONTROLLER_INST_COUNT,\
  \   // ❷\nsizeof(struct Air_Traffic_Controller),\natc_compare_ids) ;           \
  \               // ❸\n}\nend\nimplementation prolog {                          \
  \           // ❹\n#include \n#include \nstatic int\natc_compare_ids(void const *m1,\
  \ void const *m2)\n{\nstruct Air_Traffic_Controller const *atc1 = m1 ;\nstruct Air_Traffic_Controller\
  \ const *atc2 = m2 ;\nreturn strcmp(atc1->ID, atc2->ID) ;\n}\n}\n```\n\n现在，我们可以通过以下代码定位到\
  \ `Air_Traffic_Controller` 实例 `ATC-137` 的引用：\n\n```\nClassRefVar(Air_Traffic_Controller,\
  \ atc) ;\natc = ClassOp(Air_Traffic_Controller, findByEmployeeID)(\"ATC-137\") ;\n\
  if (atc == NULL) {\n// 未找到\n} else {\n// 已找到\n}\n```\n\n当然，还有其他实现此查找的方式。例如，我们可以仅对静态实例群体使用\
  \ `bsearch`。对于动态变化的 `Air_Traffic_Controller` 实例群体，我们可能会选择维护一个哈希表。这样，创建或删除 `Air_Traffic_Controller`\
  \ 实例的活动代码也会同时从哈希表中添加或移除实例引用，哈希表将以 `ID` 属性值作为键。你可以将实例创建和哈希表添加操作整合到一个 `class operation`\
  \ 中，实例删除和哈希表移除操作也类似处理。\n\n我们在此要强调的是，实现可以针对问题规模进行定制。最重要的是，具体的实现机制不会影响模型逻辑。如果模型逻辑要求找到特定的\
  \ `Air_Traffic_Controller`，那么翻译过程必须为查找选择合适的实现方式，而这一选择至少部分基于需要查找的实例数量。查找是计算机科学中一个研究深入的问题，我们可以借鉴其成果。\n\
  \n\n\n### 考虑其他平台\n\n在本书中，我们始终专注于一个特定的目标平台。这种对单一平台的关注有助于在不展示如何使用其他实现机制达到相同效果的情况下，演示翻译中的概念。在本节中，我们将拓宽讨论范围，考虑另一个翻译目标。篇幅所限，无法对可能用于满足系统需求的诸多实现技术可能性进行详细讨论。为了限定讨论范围，我们仅更改数据管理方式的平台要求。我们保持编程语言为`C`，执行方式为单线程。许多针对微控制器目标平台的概念可以沿用，因此我们重点探讨数据管理可能如何变化。\n\
  \n数据如何保存和管理是决定`MX`领域特性的关键因素之一。在微控制器目标平台中，我们决定所有领域数据都保存在主存储器中，由处理器直接寻址。在此，我们更改这一要求，并坚持使我们的替代`MX`领域将数据保存在辅助存储器中。许多类别的应用要么数据量过大无法全部存放在主存储器中，要么有其他需求需要将领域数据持久化到非易失性辅助存储器中。\n\
  \n在本节中，我们将概述一个将领域数据保存在辅助存储器中的`MX`领域可能是什么样的。我们不会在此讨论中展示一个完整的`MX`领域。相反，我们将通过一系列示例，展示如何使用持久化数据存储机制来实现模型级数据概念。同样，我们必须明确目标平台所支持的特性：\n\
  \n*   实现语言为`C`。\n*   领域数据使用`Berkeley DB`进行管理。\n*   执行方式为单线程。\n*   目标硬件平台为台式机或服务器级别的处理器。\n\
  *   我们假设一个`POSIX`操作系统环境，拥有`GiB`级的主存储器，以及至少为主存储器大小 10 倍的辅助磁盘存储空间。\n\n我们一直在讨论的微控制器目标平台与这个新平台之间的主要区别在于，使用`Berkeley\
  \ DB`来管理领域数据，以及假设运行在功能更强大的计算机上，并配备完整的操作系统。我们特意保持了实现语言和单线程执行方式与微控制器目标平台相同，以避免引入其他因素。\n\
  \n`Berkeley DB`是一个通用的嵌入式数据库引擎。`Berkeley DB`的核心概念是持久化键/值数据存储，其中键和值是任意的字节数组数据。该库成熟、支持良好，并提供了远超本示例用途的功能。有关`Berkeley\
  \ DB`的完整信息，请访问[`http://www.oracle.com/technetwork/database/database-technologies/berkeleydb/overview/index.html`](http://www.oracle.com/technetwork/database/database-technologies/berkeleydb/overview/index.html)。\n\
  \n### 将领域数据映射到 Berkeley DB\n\n我们的首要任务是将模型执行数据概念映射到`Berkeley DB`的实现机制。图 10-2 展示了模型数据管理概念如何映射到`Berkeley\
  \ DB`的功能，以及`Berkeley DB`如何使用文件系统进行持久化存储。\n\n![A421575_1_En_10_Fig2_HTML.gif](img/A421575_1_En_10_Fig2_HTML.gif)\n\
