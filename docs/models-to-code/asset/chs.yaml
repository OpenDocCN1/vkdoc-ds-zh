- "# 4. 翻译空中交通管制模型\n\n在上一章中，我们简要介绍了翻译`xUML`模型过程中做出的关键决策。现在，我们要为第 2 章中介绍的 ATC 示例着手制定这些决策。我们准备了一个`pycca`模型脚本，并检查生成的\
  \ C 代码。本章的主题侧重于实现，我们假设你熟悉 C 语言。由于篇幅所限，我们无法在此展示所有代码，但如果你有兴趣查看整个 ATC 项目（包括所有代码），欢迎从[`www.modelstocode.com`](http://www.modelstocode.com)下载。\n\
  \n我们按照类、状态和动作的顺序来翻译`xUML`的三个层面。翻译类模型指定了代码操作所依据的实体。翻译状态模型确定了代码的执行顺序和同步机制，并建立了执行大多数动作所需的结构。翻译动作则实现了算法处理。通过翻译所有三个模型层面，我们就能得到一个完整的可运行程序。\n\
  \n## Pycca 语法概述\n\n`Pycca`读取一个或多个模型源文件，并生成一对 C 头文件和源文件。直接写在模型文件中的 C 代码将被重新排列，并与`pycca`生成的额外\
  \ C 代码混合在一起。`Pycca`具有以下语法约定：\n\n- 注释：注释以井号字符（`#`）开头，并持续到行尾。\n- 符号名称：符号名称遵循 C 标识符的语法。名称必须以字母开头，后跟任意数量的字母、十进制数字或下划线（`_`）字符。模型可能在类名或属性名中使用空格，这些空格在翻译过程中必须被消除或替换，因为名称将直接用作\
  \ C 标识符。\n- C 代码：任何用花括号（`{}`）括起来的内容都会直接传递给 C 编译器。\n- 变量声明：任何用圆括号（`()`）括起来的内容都被视为\
  \ C 变量声明的逗号分隔列表（可能为空）。\n\n## Pycca 文件的结构\n\n`pycca`文件中最大的组织单元是一个域。ATC 示例围绕单个应用程序域展开，尽管你可能已经注意到一些与外部域协调的动作。在第\
  \ 6 章中，我们将探讨一个多域示例，但对于这个`pycca`文件，我们将只保留一个域。\n\n域定义是累积性的。如果在后续输入中遇到相同的域名，则后面定义中的任何内容都将被合并到现有域中。域的定义如下：\n\
  \n```\ndomain atctrl\n### 模型语句（数据类型、类等）\nend\ndomain atctrl\n### 额外的 atctrl 模型语句\n\
  ### 例如，初始实例填充。\n### 域语句也可以放在单独的文件中。\nend\n```\n\n在翻译空中交通控制器模型的过程中，我们将根据需要介绍构成域内容的模型语句。作为参考，所有可能的模型语句都可以在线材料中找到。你无需担心域部分中模型语句的顺序。`Pycca`在尝试生成任何输出之前，会解析其所有输入。它会调整生成输出的顺序以满足\
  \ C 编译器的需求。\n\n`Pycca`假定存在实现数据管理和状态模型所需事件处理的运行时函数。我们将在第 5 章中讨论运行时库。目前，只需知道一小段代码通过生成信号并调度相应事件来管理执行，从而触发转换并调用状态活动，这就足够了。你可以使用`pycca`提供的预处理宏，作为一种便捷的方式，为这些活动与运行时代码进行交互。\n\
  \n## 翻译类模型\n\n我们首先翻译模型中与数据处理相关的部分。我们指定数据类型，然后是类定义，最后是初始实例填充。\n\n\n\n### 数据类型\n\n\
  以下是领域的数据类型实现。数据类型分为接口类别和实现类别。接口类别指那些为了交互目的必须在领域外部可见的类型，它们被放入可供其他代码包含的头文件中。实现类别则包含领域内所有其他数据类型。通常，大多数数据类型都属于实现类别。如果有助于理解，你可以将这两种类别分别视为领域的公共和私有部分。\n\
  \n*   ❶ 在此 `pycca` 源码中，我们展示了外层的 `domain` / `end` 语句。在本章后续部分，我们假设所有领域组件定义都包含在外层的\
  \ `domain` 语句中，因此不再赘述这些容器语句。\n*   ❷ 本节定义了作为领域外部接口所需的部分声明。这里我们包含了描述与其他领域交换参数的 `typedef`\
  \ 语句。对于 `atctrl` 领域，存在用于报告错误和警告情况（通常发送给用户界面领域）的外部调用，这些调用中包含员工标识符的值。因此，我们必须让该值的数据类型对接口可见。接口序言代码被放置在生成的\
  \ C 头文件的顶部。任何额外需要的包含文件或其他声明都可以作为 `interface prolog` 的一部分包含进来。\n*   ❸ 我们谨慎地将不可变值声明为\
  \ `const`。对于嵌入式系统，我们可以引导链接器将常量放置在非易失性存储器（例如闪存）中，这种存储器的容量通常远大于 RAM。在 C 语言中，字符串字面量是常量，我们当然不希望有一段代码更改员工姓名中的某个字符。\n\
  *   ❹ 本节定义了领域内部使用的声明，因此对外部不可见。`implementation prolog` 文本被放置在生成的 C 头文件的顶部。此部分也可用于包含可能作为领域处理过程一部分使用的外部库的声明（例如，标准\
  \ C 库、数学库或来自遗留系统的核心算法）。\n*   ❺ 我们将这些类型命名为 `Name_T` 和 `Date_T`，与模型名称不同，这是因为 `pycca`\
  \ 存在一个限制，即不允许属性和类型拥有相同的名称。\n\n```\ndomain atctrl                               \
  \       ❶\n# ....\n#  其他 领域 组件\n# ....\ninterface prolog {                     \
  \        ❷\ntypedef char const *Employee_ID ;          ❸\ntypedef char const *Station_Number\
  \ ;\ntypedef char const *Czone_Name ;\n}\nimplementation prolog {              \
  \          ❹\ntypedef char const *Name_T  ;              ❺\ntypedef time_t Date_T\
  \ ;\ntypedef unsigned Aircraft_Quantity ;\ntypedef unsigned Aircraft_Maximum ;\n\
  typedef unsigned Duration ;\ntypedef char const *Experience_Level ;\n#include  \n\
  #include \n#include \n#include \"atctrl.h\"\n}\n# ....\n#  其他 领域 组件\n# ....\nend\n\
  ```\n\n### 类定义\n\n`Pycca` 会将模型文件中的每个类定义转换为一个 C 结构体定义。在接下来的章节中，我们将展示第 2 章空中交通管制员模型中部分模型类的\
  \ `pycca` 类定义。请在阅读时参考第 2 章中的模型类。\n\n#### 值班工作站\n\n我们从一个简单的类 —— 值班工作站开始。图 4-1 展示了类模型图形与\
  \ `pycca` 源码之间的对应关系。在 `pycca` 源码中，我们严格遵循模型中使用的属性和关系名称。随意更改名称并打乱模型与代码之间的对应关系毫无益处！\n\
  \n*   ❶ 我们保留了 `Number` 标识属性，因为它的值会在一个活动中用到。\n*   ❷ `Duty_Station` 参与了一个简单关系 `R3`。从\
  \ `Duty_Station` 到 `On_Duty_Controller` 遍历的 `R3` 关系的重数最多引用 `On_Duty_Controller`\
  \ 的一个实例（UML 表示法中的 `0..1`）。使用 `->` 的 `reference` 语句指明了这种重数。重数表达式中的零表示条件性，意味着在任意给定时刻可能没有关联的实例。这个思想通过让\
  \ `R3` 成员取 `NULL` 值来实现。\n\n![A421575_1_En_4_Fig1_HTML.gif](img/A421575_1_En_4_Fig1_HTML.gif)\n\
  \n**图 4-1.** 指定值班工作站类\n\n模型中将属性显示为名称后跟数据类型，而在模型源文件中，我们遵循 C 语法，即数据类型在前，属性名在后。任何括号内的内容都必须遵循\
  \ C 变量声明语法，因为它将直接传递给 C 编译器。\n\n`Pycca` 会将每个类语句转换为一个 C 结构体定义。图 4-2 展示了值班工作站类的模型图形与\
  \ `pycca` 生成的 C 结构体之间的对应关系。\n\n*   ❶ 注意，类名直接用作结构体名称，因此你必须选择有效的 C 标识符作为类名。\n*   ❷\
  \ `Pycca` 插入此成员供运行时在管理类的数据和状态处理时使用。不需要这些运行时功能的类将不会获得此结构体成员。该结构体成员的用法将在第 5 章中详细描述。\n\
  *   ❸ 单数形式的 `reference` 语句被转换为指向结构体的指针。\n\n![A421575_1_En_4_Fig2_HTML.gif](img/A421575_1_En_4_Fig2_HTML.gif)\n\
  \n**图 4-2.** 为值班工作站类生成的 C 代码\n\n该结构体定义与 `pycca` 语句存在直接的对应关系。类的属性成为结构体成员。简单关系则实现为指向相关结构体类型对象的指针。\n\
  \n\n\n#### 空中交通管制员\n\n对于`Air Traffic Controller`类，我们遵循与`Duty Station`类相同的属性原则。该类的额外考量在于`R1`泛化。图\
  \ 4-3 展示了将模型图形编码为 pycca 语句的过程。\n\n* ❶ 此语句将`R1`声明为一个泛化，其子类将作为联合体成员保存在`Air_Traffic_Controller`结构中。我们选择`union`实现，因为它最适合简单场景。\n\
  * ❷ 尚未定义子类也没关系，Pycca 对定义的顺序没有强制要求。\n\n![A421575_1_En_4_Fig3_HTML.gif](img/A421575_1_En_4_Fig3_HTML.gif)\n\
  \n图 4-3. 使用联合体指定超类\n\n与`Duty Station`类类似，pycca 为`Air Traffic Controller`类生成了一个 C\
  \ 结构定义：\n\n* ❶ 此声明中新增的结构体成员是`R1__code`和`R1`。`R1__code`成员保存一个小整数，用于编码当前与超类实例关联的`union`元素，pycca\
  \ 会为这些编码值提供预处理器定义。`R1`结构体成员是一个联合体，包含了参与`R1`泛化的所有子类。\n\n```\nstruct Air_Traffic_Controller\
  \ {\nstruct mechinstance common_ ;\nEmployee_ID ID ;\nName_T Name ;\nExperience_level\
  \ Rating ;\nSubtypeCode R1__code ; ❶\nunion {\nstruct Off_Duty_Controller R1_Off_Duty_Controller\
  \ ;\nstruct On_Duty_Controller R1_On_Duty_Controller ;\n} R1 ;\n} ;\n```\n\n从模型执行的角度来看，当从`Air\
  \ Traffic Controller`类导航至其某个子类时，我们必须能够判断跨`R1`的遍历是否返回空结果。因此，如果我们有一个`Air Traffic Controller`的实例，并跨`R1`导航至`Off\
  \ Duty Controller`类，那么该`Air Traffic Controller`实例可能当前并未与某个`Off Duty Controller`类实例关联（即，它当前关联的是某个`On\
  \ Duty Controller`实例）。导航操作将返回空集，我们必须能够判断这一点。\n\n从实现的角度来看，我们需要知道如何解释`R1`结构体成员。通过测试`R1__code`的值，我们可以确定联合体中当前正在使用的是哪个元素。通过将子类放在`R1`联合体成员中，就无需为`R1`泛化分配额外的存储空间。我们可以通过适当的指针算术来遍历`R1`。Pycca\
  \ 提供了宏来完成繁重的工作，并有助于防止常见错误。不必担心 pycca 在此上下文中使用了关键字`subtype`。\n\n#### 值班管制员\n\n数据转换的最后一个示例是`On\
  \ Duty Controller`类。该类的一个关键决策是如何存储`R2`关联的信息。通过考虑领域动作，我们发现`R2`将一个`On Duty Controller`实例与多个`Control\
  \ Zone`实例关联起来，并且该关联本质上是动态的。动作会将`On Duty Controller`实例与任意数量的`Control Zone`实例进行链接和取消链接。我们需要一个关系存储的数据结构，以支持`R2`的多重性和动态性。Pycca\
  \ 提供了一种合适的链表机制。这对于`R2`是有效的，但通常（尤其是在嵌入式系统中），关联在应用程序运行期间是静态的。因此，pycca 还提供了一种适用于静态关联的引用值存储方式。图\
  \ 4-4 展示了`On Duty Controller`类的指定方式。\n\n* ❶ 由于我们选择将子类作为联合体组合到超类中，因此弃用了`ID`属性。实现`R1`关系并不需要它，并且如果需要，它的值可以从超类获取。`Time_logged_in`的默认值为零，因为我们使用的是\
  \ POSIX 时间表示，零用于指示未知的登录时间。\n* ❷ `->>l`（小写字母`l`）表示法告诉 pycca 使用链表来存储`Control Zone`方向的`R2`关联的实例引用。这是第\
  \ 3 章中提到的用于存储实例引用以实现关联的链接类型之一。\n* ❸ `->`表示法告诉 pycca，`R3`的存储将是指向`Duty_Station`类的单个实例引用。\n\
  \n![A421575_1_En_4_Fig4_HTML.gif](img/A421575_1_En_4_Fig4_HTML.gif)\n\n图 4-4. 指定`On\
  \ Duty Controller`类\n\nPycca 生成以下代码：\n\n* ❶ Pycca 将提供必要的数据结构和代码来处理链表。\n* ❷ 关系`R3`的存储仅仅是一个指向`struct\
  \ Duty_Station`的指针。由于从`On Duty Controller`到`Duty Station`的`R3`关系多重性为一，因此`R3`成员的值在任何时候都不应为`NULL`。`R2`成员是链表的头，我们可以将一组`Control_Zone`链接到该链表上。\n\
  \n```\nstruct On_Duty_Controller {\nDate_T Time_logged_in ;\nrlink_t R2  ;     \
  \            ❶\nstruct Duty_Station *R3 ;     ❷\n} ;\n```\n\n其他建模的类遵循类似的模式，因此我们不再在此复述。该模型的完整\
  \ pycca 源代码（以[文学编程](http://www.literateprogramming.com/)的形式）可在本书的[网站](http://www.modelstocode.com/)上找到。\n\
  \n\n\n## 初始实例填充\n\n类模型完全转换后，还需要完成一件事才能使用：初始实例填充。这是一组在系统初始化时存在的实例。`Pycca` 可以将初始填充作为已初始化的变量存入内存，因此初始化期间无需编写创建实例的代码。这在实例填充通常是静态的嵌入式系统中尤为重要。对于动态填充，实例可以在运行时之前和期间创建。\n\
  \n在第 2 章中，以表格形式展示了空中交通管制领域的示例实例。`Pycca` 支持一种用于指定初始实例填充的表格语法。（此外还有一种更便于指定单个实例的语法。）以下\
  \ `pycca` 代码为我们示例指定了初始实例填充：\n\n* ❶ 对于关系存储，我们处理的是指针。通过为实例命名（使用 `@<name>` 语法），可以在关系初始化器中引用这些实例。`Pycca`\
  \ 会跟踪命名实例在已分配的存储数组中的位置，并生成正确的地址表达式。在为泛化关系指定子类实例时，还需要使用所示的点号表示法给出子类名称。\n* ❷ 对于单数关系路径，`->`\
  \ 表示法指示要关联的实例名称。\n* ❸ `Pycca` 将某个类的所有实例存储在一个 C 数组中。描述性属性（例如 `Location`）被赋值给数组元素初始化器中相应的结构体成员。这些值用花括号（`{}`）指定，因为\
  \ `pycca` 会将花括号内的内容直接传递给 C 编译器。这意味着我们可以使用任何有效的 C 常量表达式作为属性初始化器。\n\n```\ntable Air_Traffic_Controller\n\
  (Employee_ID ID) (Name_T Name) (Experience_Level Rating) R1\n@atc53  {\"53\"} ❶\
  \        {\"Toshiko\"}   {\"A\"}    -> On_Duty_Controller.atc53 ❶\n@atc67  {\"67\"\
  }           {\"Gwen\"}      {\"B\"}    -> On_Duty_Controller.atc67\n@atc51  {\"\
  51\"}           {\"Ianto\"}     {\"C\"}    -> On_Duty_Controller.atc51\nend\ntable\
  \ On_Duty_Controller\nR2               R3\n@atc53      ->> sfo end      -> s2 ❷\n\
  @atc67      ->> oak end      -> s1\n@atc51      ->> sjc end      -> s3\nend\ntable\
  \ Control_Zone\n(Czone_Name Name)    (Aircraft_Quantity  Traffic)      R2\n@sfo\
  \    {\"SFO37B\"}           {27}                              ->  atc53\n@oak  \
  \  {\"OAK21C\"}           {18}                              ->  atc67\n@sjc    {\"\
  SJC18C\"}           {9}                               ->  atc51\nend\ntable Duty_Station\n\
  (Station_Number  Number)  (Name_T  Location)  (Aircraft_Maximum  Capacity)\n@s1\
  \  {\"S1\"} ❸                 {\"Front\"}           {20}\n@s2  {\"S2\"}        \
  \            {\"Center\"}          {30}\n@s3  {\"S3\"}                    {\"Front\"\
  }           {45}\nend\n```\n\n`Pycca` 将初始实例填充转换为带有初始化器值的结构体数组。每个类都有一个单独的数组作为其内存池。以下是为初始实例生成的\
  \ C 变量和初始化器：\n\n* ❶ 回想一下，`Air_Traffic_Controller` 类是一个包含 `R1` 子类的联合体，因此没有为子类分配单独的存储空间。子类属性的值直接包含在超类的初始化器中。\n\
  * ❷ `common_` 成员保存了一个分配编号、当前状态以及指向类不变数据的指针。这是运行时代码管理实例所需的数据。在第 5 章中，我们将从运行时代码的角度讨论实例，并详细介绍该结构体成员的实际用途。\n\
  * ❸ `Control_Zone` 类没有状态模型，而且其所有实例都属于初始实例填充。因此，其类结构体中没有 `common_` 成员，因为运行时无需以任何方式管理这些实例。\n\
  \n```\n/*\n初始实例存储，\"Air_Traffic_Controller\"\n*/\nstatic  struct  Air_Traffic_Controller\
  \  Air_Traffic_Controller_storage[3]  =   {   ❶\n{❷.common_ = {1, 0, &Air_Traffic_Controller_class},\
  \ \"53\", \"Toshiko\", \"A\", .R1   code = ,\n1, .R1 = {.R1_On_Duty_Controller =\
  \ {0, .R2 = {.next = &Control_Zone_storage[0].\nR2__links, .prev  =  &Control_Zone_storage[0].R2__links},\
  \ .R3  = &Duty_Station_storage\n[1]}}},\n{.common_ = {2, 0, &Air_Traffic_Controller_class},\
  \ \"67\", \"Gwen\", \"B\", .R1__code = 1, .\nR1 = {.R1_On_Duty_Controller = {0,\
  \ .R2 = {.next = &Control_Zone_storage[1].R2__links\n, .prev = &Control_Zone_storage[1].R2__links},\
  \ .R3 = &Duty_Station_storage[0]}}},\n{.common_ = {3, 0, &Air_Traffic_Controller_class},\
  \ \"51\", \"Ianto\", \"C\", .R1__code = 1, .\nR1 = {.R1_On_Duty_Controller = {0,\
  \ .R2 = {.next = &Control_Zone_storage[2].R2__links\n, .prev = &Control_Zone_storage[2].R2__links},\
  \ .R3 = &Duty_Station_storage[2]}}}\n} ;\n/*\n*初始实例存储，\"Control_Zone\"\n*/\nstatic\
  \ struct Control_Zone Control_Zone_storage[3] = { ❸\n{\"SFO37B\", 27, .R2 = &Air_Traffic_Controller_storage[0].R1.R1_On_Duty_Controller,\
  \ .\nR2__links = {.next = &Air_Traffic_Controller_storage[0].R1.R1_On_Duty_Controller.R2,\n\
  .prev = &Air_Traffic_Controller_storage[0].R1.R1_On_Duty_Controller.R2, }},\n{\"\
  OAK21C\", 18, .R2 = &Air_Traffic_Controller_storage[1].R1.R1_On_Duty_Controller,\
  \ .\nR2__links = {.next = &Air_Traffic_Controller_storage[1].R1.R1_On_Duty_Controller.R2,\n\
  .prev = &Air_Traffic_Controller_storage[1].R1.R1_On_Duty_Controller.R2, }},\n{\"\
  SJC18C\", 9, .R2 = &Air_Traffic_Controller_storage[2].R1.R1_On_Duty_Controller,\
  \ .\nR2__links = {.next = &Air_Traffic_Controller_storage[2].R1.R1_On_Duty_Controller.R2,\n\
  .prev = &Air_Traffic_Controller_storage[1].R1.R1_On_Duty_Controller.R2, }}\n} ;\n\
  /*\n*  初始实例存储，\"Duty_Station\"\n*/\nstatic struct Duty_Station Duty_Station_storage[3]\
  \ = {\n{.common_ = {1, 0, &Duty_Station_class}, \"S1\", \"Front\", 20, .R3 = NULL},\n\
  {.common_ = {2, 0, &Duty_Station_class}, \"S2\", \"Center\", 30, .R3 = NULL},\n\
  {.common_ = {3, 0, &Duty_Station_class}, \"S3\", \"Front\", 45, .R3 = NULL}\n} ;\n\
  ```\n\n回想一下，`R2` 被实现为一个以 `Air_Traffic_Controller` 实例为起点的链表。`Pycca` 会正确初始化 `Air_Traffic_Controller`\
  \ 和 `Control_Zone` 存储数组中的链接指针。初始化器中的指针值是指向存储数组元素及其结构体成员的常量表达式。`Pycca` 将实例分配到存储数组，因此可以指定这些地址计算。请注意，这些表达式在链接器放置了存储数组的基地址后，会在链接时绑定到一个内存地址。\n\
  \n## 翻译状态模型\n\n翻译的第二个方面是指定状态模型。所有包含状态模型的类都会在 `pycca` 中有一个对应的机器定义。状态模型同时指定了转换以及在进入某个状态时执行的\
  \ C 代码。某个状态的 C 代码被直接放置在类的状态模型定义中。我们暂时省略 C 代码，以便更好地展示状态模型的转换部分。在下一节“翻译动作”中，我们将引入\
  \ C 代码。我们在状态定义中将动作语言作为 C 注释包含在内。在将其翻译为 C 代码时，将动作语言放在附近尤为方便。\n\n\n\n### 岗位状态模型\n\n\
  我们建议您阅读时对照第 2 章的图 2-6 中的岗位状态模型，以便直观地理解模型元素与 `pycca` 语句之间的对应关系。\n\n该状态模型通过一个 `machine`\
  \ 语句进行编码：\n\n- ❶ 类的状态模型完全在 `machine` 语句内定义。\n- ❷ 此处我们定义一个状态。该语句指定了状态名称以及通过传入转换传递的任何参数。根据摩尔状态模型形式化规范，一个状态的所有传入转换必须提供相同的参数集。事实上，岗位状态模型在其任何转换上都没有定义参数。\n\
  - ❸ `transition` 语句定义了状态模型转换（即，当此类的实例接收到事件时会发生什么）。转换由起始状态、接收的事件以及作为转换目标的新状态共同定义。事件无需单独定义，事件名称是从\
  \ `transition` 语句中收集而来的。\n- ❹ 状态活动最终将是 C 代码，不是自动生成的，而是直接手写在模型源文件中。不必惊慌；`pycca` 提供了一组\
  \ C 宏，您可以用它们替代大部分模型动作。我们将在后面详细讨论这些内容。目前，我们只是将建模的动作语言作为注释复制进来。即使之后用 C 代码替换了它们，最好也保留原始动作语言作为注释。\n\
  \n```\nclass Duty_Station\n# ... 岗位定义的其他部分，属性等\nMachine                        \
  \                                   ❶\nstate AVAILABLE()                       \
  \                      ❷\n{\n// empty\n}\ntransition AVAILABLE - In_use -> IN_USE\
  \                       ❸\nstate IN_USE()\n{\n//+ Max shift exceeded  ->  me  after\
  \ Shift               ❹\n//+     Specification().Max shift // 选择单例\n}\ntransition\
  \ IN_USE - Max_shift_exceeded -> MAX_SHIFT_EXCEEDED\ntransition IN_USE - User_leaving\
  \ -> Canceling_Shift_Timeout\nstate MAX_SHIFT_EXCEEDED()\n{\n//+ UI.Break required(\
  \ Station: Number )\n}\ntransition MAX_SHIFT_EXCEEDED - User_leaving -> AVAILABLE\n\
  state Canceling_Shift_Timeout()\n{\n//+ cancel Max shift exceeded -> me\n//+ Available\
  \ -> me\n}\ntransition Canceling_Shift_Timeout - Available -> AVAILABLE\nend\n```\n\
  \n`pycca` 源代码是状态模型图形的直接转写。指定状态的语法类似于带有参数（来自触发事件，本例中无参数）和要执行的代码（活动）的函数定义。\n\n`state`\
  \ 和 `transition` 语句没有特定的顺序要求。此处我们将传出转换紧跟在它们所属的状态下方。另一种便捷的组织方式是将所有转换语句放在一起，以强调其与状态模型转换矩阵的对应关系。\n\
  \n一组数据结构为给定类编码了所有状态行为。运行时代码使用这些数据结构将事件分派到状态机。`pycca` 的一个重要功能是生成运行时事件分派代码所使用的数据结构。`pycca`\
  \ 将状态模型规约转换为一组已初始化的变量，这些变量的值描述了如何分派事件以及在转换发生时执行什么处理。分派代码使用状态模型的表格化编码。对于类的所有实例，事件分派的行为都是相同的。确定转换和执行状态活动的算法对于所有类也是相同的。\n\
  \n以下清单显示了由 `pycca` 为岗位状态模型生成的数据结构。这些数据是分派块、转换表和动作表的已初始化变量。在第 5 章中，我们将展示这些数据的结构以及运行时代码如何利用它们来实现状态转换。如果以下内容目前看起来不太容易理解，不必过于担心。当您阅读完第\
  \ 5 章，对运行时环境中状态转换的管理和事件分派有了更好的理解后，一切应该会显得更加合理。\n\n- ❶ 在下一节中，您将了解活动函数是如何定义的。此处，状态模型的所有活动函数都被收集到一个数组中，以便在进入给定状态时可以定位到相应的函数。\n\
  - ❷ `CH` 表示不可能发生。任何导致 `CH` 转换的事件都会引发系统错误。\n- ❸ 对象分派块是运行时代码用于实现事件传递的信息集合。这将在第 5 章中进一步解释。\n\
  \n```\nstatic  PtrActionFunction  const  Duty_Station_acttbl[]  =  {\nDuty_Station_AVAILABLE,\
  \                                        ❶\nDuty_Station_IN_USE,\nDuty_Station_MAX_SHIFT_EXCEEDED,\n\
  Duty_Station_Canceling_Shift_Timeout,\n} ;\nstatic StateCode  const  Duty_Station_transtbl[]\
  \  =  {\nMECH_STATECODE_CH, // AVAILABLE - Available -> CH              ❷\n1, //\
  \ AVAILABLE - In_use -> IN_USE\nMECH_STATECODE_CH, // AVAILABLE - Max_shift_exceeded\
  \ -> CH\nMECH_STATECODE_CH, // AVAILABLE - User_leaving -> CH\nMECH_STATECODE_CH,\
  \ // IN_USE - Available -> CH\nMECH_STATECODE_CH, // IN_USE - In_use -> CH\n2, //\
  \ IN_USE - Max_shift_exceeded -> MAX_SHIFT_EXCEEDED\n3, // IN_USE - User_leaving\
  \ -> Canceling_Shift_Timeout\nMECH_STATECODE_CH, // MAX_SHIFT_EXCEEDED - Available\
  \ -> CH\nMECH_STATECODE_CH, // MAX_SHIFT_EXCEEDED - In_use -> CH\nMECH_STATECODE_CH,\
  \ // MAX_SHIFT_EXCEEDED - Max_shift_exceeded -> CH\n0, // MAX_SHIFT_EXCEEDED - User_leaving\
  \ -> AVAILABLE\n0, // Canceling_Shift_Timeout - Available -> AVAILABLE\nMECH_STATECODE_CH,\
  \ // Canceling_Shift_Timeout - In_use -> CH\nMECH_STATECODE_CH, // Canceling_Shift_Timeout\
  \ - Max_shift_exceeded -> CH\nMECH_STATECODE_CH, // Canceling_Shift_Timeout - User_leaving\
  \ -> CH\n} ;\nstatic struct objectdispatchblock const Duty_Station_odb =  {    \
  \  ❸\n.stateCount = 4,\n.eventCount  =  4,\n.transitionTable    =    Duty_Station_transtbl,\n\
  .actionTable   =   Duty_Station_acttbl,\n.finalStates  =  NULL\n} ;\n```\n\n\n\n\
  ### 空中交通管制员状态模型\n\n`Air_Traffic_Controller` 类的状态模型稍长，但遵循与之前展示的 `Duty_Station` 类相同的模式：\n\
  \n```\nclass  Air_Traffic_Controller\n# ... Air_Traffic_Controller 定义、属性等其他部分\n\
  machine\nstate OFF_DUTY ()\n{\n// 空\n}\ntransition OFF_DUTY - Ready_for_duty ->\
  \ Verifying_Adequate_Break\nstate Verifying_Adequate_Break(Station_Number Station)\n\
  {\n//+ the shift spec .= Shift Specification() // 选择单例\n//+ if ( _now - self.Last\
  \ shift ended  me\n//+ else\n//+     Cannot  go  on  duty  ->  me\n}\ntransition\
  \ Verifying_Adequate_Break - Log_in -> Logging_In\ntransition Verifying_Adequate_Break\
  \ - Cannot_go_on_duty -> OFF_DUTY\nstate Logging_In(Station_Number Station)\n{\n\
  //+ 迁移至 On Duty Controller\n//+ my station = Duty Station( ID: in.Station )\n//+\
  \ link /R3/my station\n//+ Time logged in = now()\n//+ Logged in -> me\n//+ In use\
  \ -> my station\n}\ntransition Logging_In - Logged_in -> ON_DUTY\nstate ON_DUTY()\n\
  {\n// 空\n}\ntransition ON_DUTY - Ready_for_a_break -> Verifying_Full_Handoff\ntransition\
  \ ON_DUTY - Handoff -> Handing_off_Control_Zone\nstate  Handing_off_Control_Zone(\n\
  Czone_Name zone,\nEmployee_ID  controller)\n{\n//+ hoff zone .= /R2/Control Zone(\
  \ Name: in.Zone )\n//+ if in.Controller == ID\n//+     UI.Cannot handoff to self(\
  \ Controller: in.Controller )\n//+ else {\n//+     new controller .= On Duty Controller(\
  \ ID: in.Controller )\n//+     swap hoff zone/R2/On Duty Controller with new controller\n\
  //+         !new missing: UI.Unknown controller( Controller: in.Controller)\n//+\
  \         !old missing: UI.Zone not handled by( Controller: ID)\n//+ } // 交换控制器并检查错误\n\
  //+ Handoff complete -> me\n}\ntransition Handing_off_Control_Zone - Handoff_complete\
  \ -> ON_DUTY\nstate Logging_Out()\n{\n//+ User leaving -> /R3/Duty Station\n//+\
  \ 迁移至 Off Duty Controller\n//+ Last shift ended = _now.HMS\n//+ Off duty -> me\n\
  }\ntransition Logging_Out - Off_duty -> OFF_DUTY\nstate Verifying_Full_Handoff()\n\
  {\n//+ if /R1/On Duty Controller/R2/Control Zone{\n//+     Must handoff zones ->\
  \ me\n//+     UI.Control Zones Active( ATC: ID )\n//+ } else\n//+     Log out ->\
  \ me\n}\ntransition Verifying_Full_Handoff - Log_out -> Logging_Out\ntransition\
  \ Verifying_Full_Handoff - Must_hand_off_zones -> ON_DUTY\nend\nend\n```\n\n我们不展示生成的输出，因为它遵循您已见过的相同模式。\n\
  \n## 翻译动作\n\n本节中，我们将翻译与状态活动中的动作相关的处理过程。Pycca 将每个状态活动转换为一个 C 函数，并安排该函数被包含在生成的用于运行时调度机制的数据结构中。\n\
  \n状态活动几乎总是导致更新实例属性和/或发出事件信号。数据访问通过普通的 C 机制实现，即通过指针访问结构体成员。Pycca 会为您提供的状态活动 C 代码增加必要的声明，这些声明用于访问一个\
  \ `self` (me) 变量和一个用于访问事件参数的 `rcvd_evt` 变量。\n\n### 空中交通管制员状态活动\n\n我们从 Air Traffic\
  \ Controller 类开始，仅展示选定的状态活动。日志记录中的状态活动如下列代码所示。我们将该状态的动作语言以注释形式包含在内，并在其间穿插了实现相应动作的\
  \ C 代码：\n\n- ❶ Pycca 提供了一个宏，用于执行基于联合类型的子类迁移。这隐藏了内部实例结构体成员。\n- ❷ `ClassRefVar` 宏声明了一个局部变量，该变量是对某个实例的引用。在此例中，`my_station`\
  \ 是一个引用 `Duty_Station` 实例的变量。\n- ❸ 查找 `Duty_Station` 是通过对 `Duty_Station` 的存储数组进行线性搜索来完成的。Pycca\
  \ 提供了一个便捷的宏来执行此迭代。如果 `Duty_Station` 的实例数量很大，您可以选择其他搜索技术。请注意，`Station` 事件参数是通过 pycca\
  \ 自动生成的隐式 `rcvd_evt` 变量获取的。\n- ❹ 因为 `R3` 关联存在于 On Duty Controller 和 Duty Station\
  \ 之间，我们必须首先遍历 `R1`。`R1` 实现为联合类型，该宏执行所需的指针运算。\n- ❺ 参与 `R3` 关联的每个类都保存着对应实例的引用，因此建立链接涉及设置这两个指针的值。\n\
  - ❻ 处理时间是与平台相关的，pycca 不提供任何时间函数。这里我们假设使用的是 POSIX 环境。\n- ❼ 这里，生成了一个指向 `self` 的信号。请注意，`Logged_in`\
  \ 与状态模型定义中使用的名称相同。\n- ❽ 信号生成的一般形式指定了信号、目标实例的类、目标实例本身以及信号的来源实例。\n\n```\nclass  Air_Traffic_Controller\n\
  # ... Air_Traffic_Controller 定义、属性等其他部分\nmachine\n# ... 状态模型定义的其他部分\nstate Logging_In(Station_Number\
  \ Station)\n{\n//+ 迁移至 On Duty Controller\nPYCCA_migrateSubtype(self,  Air_Traffic_Controller,\
  \  R1,\nOn_Duty_Controller) ;                                                  ❶\n\
  //+ my_station  =  Duty  Station(  ID:  in.Station  )\nClassRefVar(Duty_Station,\
  \ my_station) ;                                       ❷\nPYCCA_selectOneStaticInstWhere(my_station,\
  \  Duty_Station,                    strcmp(my_station->Number, rcvd_evt->Station)\
  \ == 0) ;                 ❸\nassert(my_station != EndStorage(Duty_Station)) ;\n\
  //+ & /R3/my  station\nClassRefVar(On_Duty_Controller, ondc) =\nPYCCA_unionSubtype(self,\
  \ R1, On_Duty_Controller) ;                    ❹\nondc->R3 = my_station ;      \
  \                                                 ❺\nmy_station->R3 = ondc ;\n//+\
  \ Time logged in = now()\nondc->Time_logged_in = time(NULL) ;                  \
  \                         ❻\n//+ Logged in -> me\nPYCCA_generateToSelf(Logged_in)\
  \ ;                                             ❼\n//+ In use -> my station\nPYCCA_generate(In_use,\
  \ Duty_Station, my_station, self) ;                      ❽\n}\n# ... 状态模型定义的其他部分\n\
  end\nend\n```\n\nPycca 将状态动作转换为一个 C 函数，如下所示：\n\n- ❶ 预处理器 `#define` 语句用于跟踪当前状态。其他预处理器宏会用到当前状态。\n\
  - ❷ Pycca 安排了 `self` 和 `rcvd_evt` 的声明。\n\n\n\n```c\nstatic void Air_Traffic_Controller_Logging_In(void\
  \ *const s_, void *const p_)\n{\n#define THISSTATE__ Logging_In\nstruct Air_Traffic_Controller\
  \ *const self =  (struct Air_Traffic_Controller *)s_ ;\nstruct Air_Traffic_Controller_Logging_In_rcvd_evt\
  \ {\nStation_Number Station ;\n} const *const rcvd_evt = (struct Air_Traffic_Controller_Logging_In_rcvd_evt\
  \ const *)p_ ;\n//+ migrate to On Duty Controller on R1\nPYCCA_migrateSubtype(self,\
  \ Air_Traffic_Controller, R1, On_Duty_Controller) ;\n//+ my_station = Duty Station(\
  \ ID: in.Station )\nClassRefVar(Duty_Station, my_station) ;\nPYCCA_selectOneStaticInstWhere(my_station,\
  \  Duty_Station,\nstrcmp(my_station->Number, rcvd_evt->Station) == 0) ;\nassert(my_station\
  \ != EndStorage(Duty_Station)) ;\n//+ & self.R3.my_station    // link station\n\
  ClassRefVar(On_Duty_Controller, ondc) = PYCCA_unionSubtype(self, R1, On_Duty_Controller)\
  \ ;\nondc->R3 = my_station ;\nmy_station->R3 = ondc ;\n//+ Time logged in = _now.HMS\n\
  ondc->Time_logged_in = time(NULL) ;\n//+ Logged in -> me\nPYCCA_generateToSelf(Logged_in)\
  \  ;\n//+ In use -> my station\nPYCCA_generate(In_use, Duty_Station, my_station,\
  \ self) ;\n#undef THISSTATE__\n}\n```\n\n除了 `self` 和 `rcvd_evt` 的声明外，PYCCA 只是将状态动作转换为一个文件静态作用域的函数，并传递了状态模型定义中指定的\
  \ C 代码。函数名称前附加了类名，以使其在文件中唯一。\n\n我们再展示一个翻译状态活动的示例。以下是 `Air_Traffic_Controller` 类\
  \ `Logging_Out` 状态的 PYCCA 源代码：\n\n- ❶ 该步从 `Air_Traffic_Controller` 遍历 `R1` 到 `On_Duty_Controller`。断言检查\
  \ ATC 的实例是否确实与 `On_Duty_Controller` 的一个实例相关联。如果不是，则说明出现了严重错误。\n- ❷ 从 `On_Duty_Controller`\
  \ 的一个实例遍历 `R3` 到 `Duty_Station` 的一个实例，仅仅是获取一个指针的问题。从 `On_Duty_Controller` 到 `Duty_Station`\
  \ 的关系是无条件的；因此，必须在 `Duty_Station.R3` 中存储一个有效的指针值。断言用于检查数据完整性。\n- ❸ 因为每个类都包含对另一个类的引用，维护关系存储意味着要更新两个指针。\n\
  - ❹ 因为我们已经迁移了子类，所以必须获取对新子类的引用。\n\n```\nclass  Air_Traffic_Controller\n# ... Air_Traffic_Controller\
  \ 定义的其他部分，属性等\nmachine\n# ... 状态模型定义的其他部分\nstate Logging_Out()\n{\n//+ User  leaving\
  \  ->  /R3/Duty  Station\nassert(self->SubCodeMember(R1 ==\nSubCodeValue(Air_Traffic_Controller,\
  \  R1,On_Duty_Controller)) ;\nClassRefVar(On_Duty_Controller, ondc) =\nPYCCA_unionSubtype(self,\
  \ R1, On_Duty_Controller) ;            ❶\nClassRefVar(Duty_Station, ds) = ondc->R3\
  \ ;                            ❷\nassert(ds != NULL) ;\nPYCCA_generate(User_leaving,\
  \ Duty_Station, ds, self) ;\n//+ migrate to Off Duty Controller\nondc->R3 = NULL\
  \ ;                                                     ❸\nds->R3 = NULL ;\nPYCCA_migrateSubtype(self,\
  \  Air_Traffic_Controller,  R1,\nOff_Duty_Controller) ;\nassert(self->SubCodeMember(R1)\
  \  ==\nSubCodeValue(Air_Traffic_Controller,  R1,\nOff_Duty_Controller)) ;\n//+ Last\
  \ shift ended = _now.HMS ClassRefVar(Off_Duty_Controller, offdc) =\nPYCCA_unionSubtype(self,\
  \ R1, Off_Duty_Controller) ;            ❹\noffdc->Last_shift_ended = time(NULL)\
  \ ;\n//+ Off duty -> me\nPYCCA_generateToSelf(Off_duty) ;\n}\n# ... 状态模型定义的其他部分\n\
  end\nend\n```\n\n生成的 C 代码如下：\n\n- ❶ 此动作没有定义 `rcvd_evt`，因为没有事件参数。\n\n```c\nstatic\
  \ void Air_Traffic_Controller_Logging_Out(void *const s_, void *const p_)\n{\n#define\
  \ THISSTATE__ Logging_Out\nstruct Air_Traffic_Controller *const self =  (struct\
  \ Air_Traffic_Controller *)s_ ;    ❶\n//+ User leaving -> /R3/Duty Station\nassert(self->SubCodeMember(R1)\
  \ == SubCodeValue(Air_Traffic_Controller,  R1,\nOn_Duty_Controller)) ;\nClassRefVar(On_Duty_Controller,\
  \ ondc) =\nPYCCA_unionSubtype(self, R1, On_Duty_Controller) ;\nClassRefVar(Duty_Station,\
  \ ds) = ondc->R3 ;\nassert(ds != NULL) ;\nPYCCA_generate(User_leaving, Duty_Station,\
  \ ds, self) ;\n//+ migrate self to Off Duty Controller on R1\nondc->R3 = NULL ;\n\
  ds->R3 = NULL ;\nPYCCA_migrateSubtype(self,  Air_Traffic_Controller,  R1,\nOff_Duty_Controller)\
  \ ;\n//+ Last_shift_ended = _now.HMS\nClassRefVar(Off_Duty_Controller, offdc) =\n\
  PYCCA_unionSubtype(self, R1, Off_Duty_Controller) ;\noffdc->Last_shift_ended = time(NULL)\
  \ ;\n//+ Off duty -> me\nPYCCA_generateToSelf(Off_duty) ;\n#undef THISSTATE__\n\
  }\n```\n\nC 输出符合预期。动作被转换为一个函数，C 代码被原样传递。\n\n### 总结\n\n第 2 章的空管模型在此处通过应用第 3 章讨论的原则进行了翻译。该模型使用\
  \ PYCCA 语句编写在一个文本文件中，其中混编了状态活动的 C 代码，并遵循 C 语言的命名规则。然后将此文件通过 PYCCA 处理器处理，该处理器从 PYCCA\
  \ 语句生成额外的 C 代码，同时以编译器可接受的形式和顺序传递混编的 C 代码。为完成翻译，生成的 C 头文件和源文件对随后由 C 编译器处理。将该领域的对象文件与运行时库链接，即可生成一个完整的可执行程序。\n\
  \n模型的所有三个方面均在 PYCCA 脚本语言中指定，以创建一个完整的模型源文件。首先，指定了类模型。这包括一组数据类型定义，分为外部交互所需的部分和域私有部分。接着是一组\
  \ `class` 语句。每个 `class` 语句定义了建模的类名、其属性、其关系以及一个可选的状态模型。此时，基于静态与动态实例数量以及关系导航所需的路径，做出了一些设计决策。在此过程中，类模型中的一些标识符属性和引用属性不再需要，因此被删除。尽管如此，它们的基本逻辑意图仍然存在。例如，一个引用属性可能已被一个指针所替代。\n\
  \n对于每个包含状态模型的类，一个 `machine` 语句被嵌入到 `class` 语句中，以指定状态、转换、事件和活动。每个活动最初被填入一个注释，其中包含从对应状态复制过来的动作语言。\n\
  \n然后，通过在每个状态中插入 C 代码来完成模型的最后一个方面——动作。在许多情况下，C 代码由 PYCCA 提供的 C 预处理器宏组成，这些宏实现了通用模型动作，例如信号生成、实例选择和关系导航。此外，用户编写的\
  \ C 代码用于控制流、表达式计算以及其他算法处理。\n\n\n\n"
- '# 5. 模型执行域


  至此，我们对翻译运行时组件的操作一直略过不谈。我们描述了它的一些功能，但并未说明它是如何实现这些功能的。现在不再如此！本章中，我们将解释用于管理模型执行的代码如何工作，以及它在生成运行程序中所扮演的重要角色。


  我们的重点仍然是让空中交通管制模型运行起来，因此本章将讨论我们目标平台的模型执行。拥有了控制模型数据和执行顺序的手段后，我们便能够运行从翻译中派生的代码。我们不会在本章解释所有运行时操作，只讲解运行示例所需的那些部分。在第九章中，我们将补充其余细节。


  这里的重要见解是，所有关于执行如何排序和管理的决策都被整合到了一个地方。事实上，模型执行的数据、规则和策略形成了一个独立的主题领域，完全独立于任何特定的应用程序或服务。这个主题领域实际上和其他任何领域一样，都是一个领域。我们称之为“模型执行域”，简称为
  `MX` 域。这个领域历史上曾被称作软件架构，但我们将避免不加限定地使用该术语，因为更广泛的计算机界也用它来模糊地描述软件系统设计元素的整体构成。


  我们首先概述模型执行域在通过翻译构建运行程序中所起的作用。我们想告诉您它如何融入翻译的更大体系中。但很快，我们将深入探讨示例目标平台的具体细节。在第十章中，我们将讨论其他可能的平台以及进入模型执行域的一些通用考量。


  ## 模型执行域的角色


  模型执行域（`MX` 域）构成了模型执行的逻辑平台。正如处理器指令集是编程语言编译器的目标一样，`MX` 域的构建模块是模型翻译的目标。每个建模系统都需要一个
  `MX` 域，因为它提供了运行模型执行规则的机制。


  处理器指令集由诸如 `ADD` 和 `MOV` 之类的操作组成。`MX` 域的构建模块涉及模型执行元素的实现，例如事件控制块、转换表和动作表，这些都在本章中介绍。模型翻译的过程将类、关系和状态等模型元素映射到
  `MX` 构建模块上。


  一些 `MX` 功能由实现语言直接提供。例如，调用函数以及直接或间接访问数据是 `C` 语言程序中的常见操作。当活动被翻译时，这些 `C` 语言特性被直接使用。其他模型执行规则则不由实现语言直接支持。例如，没有
  `C` 语言语句能够发送事件并将该事件分派给一个实例。为了弥补这一差距，`MX` 域提供了用于事件发送和分派的 `C` 函数。翻译过程将发送事件的状态动作映射为对这些
  `MX` 提供的 `C` 函数的调用，以实现 xUML 事件发送行为。


  尽管 `MX` 域的主题领域不同于它所运行的建模应用和服务领域，但它受到这些领域所施加的计算需求的强烈影响。模型执行的规则是明确定义的（例如，在之前引用的《可执行
  UML：模型驱动架构的基础》一书中），但实现它们的计算策略和技术可能差异巨大。规模、速度和并行性都是建模领域可能对其实现提出的性能要求。内存的可用性及其使用方式也是重要的考量因素。没有一个通用的
  `MX` 域能够以最优方式满足所有应用需求。这并不奇怪，因为没有通用的处理器或通用的编程语言能够覆盖所有计算场景。关于将何种计算技术应用于特定问题的决策涉及许多工程权衡，这些权衡常常是相互矛盾的。为了在成本、能力和效率之间取得最佳平衡，`MX`
  域需要提供与建模领域需求最匹配的计算技术。


  同样，也没有必要为每个软件项目都构建一个独立的 `MX` 域！一个设计良好、可配置的 `MX` 域可以适应一大类应用和平台的需求。这应该不足为奇，因为我们都已经习惯于使用针对有限范围应用和平台进行优化的组件，例如用户界面工具包、数学库或数据库引擎。没有人会认真建议每开发一个软件项目就必须重新设计这样一个组件。同理，我们可以仔细定制设计到
  `MX` 域中的灵活性，使其能在一类平台上高效运行，并支持广泛的应用。在第十章中，我们将展示如何为不同的平台构建一个 `MX` 域。


  在本章中，我们讨论一个名为“单线程模型执行”（简称为 `ST/MX`）的特定 `MX` 域实现。它旨在针对我们正在考虑的那种基于微控制器的裸机嵌入式系统。




  ## ST/MX 概述


  要翻译模型，我们必须指定环境的总体特征以及最终程序运行的计算机技术类型。如先前所述，我们选择基于微控制器的嵌入式系统作为目标。这一决定对何为可接受的解决方案施加了约束，并限制了可在目标上部署的应用类型。`ST/MX`
  的设计旨在处理基于微控制器的系统最重要的几项约束：


  *   **有限的内存**：微控制器的内存很小，通常分为 RAM 和只读（例如，闪存）类型。存在单一物理内存空间，且没有基于硬件的内存地址转换。

  *   **有限的执行周期**：微控制器速度有限，且常常部署在电池供电的应用中，在这些应用中，处理器执行是功耗较高的活动之一。

  *   **中断**：所有现代计算机都有中断，允许外部外设指示重要事件。`ST/MX` 必须以一致的方式支持模型操作和中断服务执行。

  *   **及时响应**：嵌入式系统通常对其外部环境的刺激做出反应，并产生回馈到该环境的响应。通常，产生响应存在时间约束。`ST/MX` 致力于最小化执行延迟以满足实时约束。


  为了让您很好地了解 `ST/MX` 的工作方式，本章将讨论范围限定在模型行为排序的管理方式上。我们将重点关注信号的发出方式以及状态机事件如何分派到适当的实例。然后，我们将演示这与我们示例
  ATC 模型执行的关系。


  `ST/MX` 的特殊之处在于，模型元素的实际行为完全由提供的数据值驱动。如空中交通管制员示例所示，`pycca` 的一个主要作用是生成数据值以驱动 `ST/MX`。`ST/MX`
  本身对空中交通管制员或任何其他模型元素的特定行为一无所知。这不足为奇。真正的计算机对其计算内容的意义一无所知，并且严格按照提供给它们的程序运行。


  `ST/MX` 作为普通的 C 库实现。与任何其他库一样，它有一个由函数、参数和数据结构组成的接口。然而，与典型的 C 库不同，其大部分公共接口由预处理器宏组成。这些宏隐藏了底层的低级函数，并简化了动作语言的翻译过程。因此，我们将以通用术语讨论其处理过程和算法。我们不提供完整的调用接口，因为当使用
  `pycca` 翻译时，底层的 `ST/MX` 函数接口仅在 `pycca` 提供的宏中被引用。对于希望查看代码细节和设计原理的读者，可以在本书网站上找到对 `ST/MX`
  域的完整描述，包括实现它的 C 代码。


  ### 类实例的 ST/MX 视图


  `ST/MX` 不关心单个实例的含义。它只需要能够灵活地访问它们，以执行诸如创建、删除、定位转换表、分派事件等活动。这些活动都不需要了解特定的属性值。因此，实例被视为相对不透明的用户数据块。`ST/MX`
  感兴趣的是关于实例的通用数据，例如其类（以查找转换表）、其在内存中的位置、当前状态以及其他管理信息。


  类实例以 C 结构体数组的形式存储。为了管理实例，`ST/MX` 使用以下结构体将关于实例的通用数据作为类结构体声明的第一个成员：


  ```c

  typedef struct mechinstance {

  AllocCount alloc ;

  StateCode currentState ;

  struct mechclass const *instClass ;

  } *MechInstance ;

  ```


  此源代码片段中定义的 `MechInstance` 指针类型稍后将会用到。这里，我们关注的是将 `mechinstance` 结构体作为生成的 `pycca`
  类示例的第一个成员。图 5-1 显示了空中交通管制员的类特定结构体。请记住，空中交通管制员类将建模的父类和子类合并到一个联合体中。


  ![A421575_1_En_5_Fig1_HTML.gif](img/A421575_1_En_5_Fig1_HTML.gif)


  图 5-1. 实例数据结构


  将 `mechinstance` 结构体作为每个类结构体声明的第一个成员，使得指向任意类的任意实例的指针可以被视为指向通用实例的指针。这种技术在使用 C 进行更面向对象的编程风格时很常见，尽管它看起来可能类型不安全。我们之前在
  `pycca` 生成的代码中见过这种结构。实例结构定义了适用于所有实例的通用元素，并将类实例链接回描述其行为的数据。


  `alloc` 成员的非零值决定了特定实例当前是否正在使用。每次分配实例存储时都会更改 `alloc` 成员的值，以便我们能够确定在“创建-销毁-创建”序列后它是否正在被重用。`currentState`
  成员保存一个小的整数值，表示实例当前所处的状态。`instClass` 成员是一个指向适用于该类所有实例的数据的指针。


  图 5-2 显示了一个具有一些示例数据值的空中交通管制员的样子。


  ![A421575_1_En_5_Fig2_HTML.gif](img/A421575_1_En_5_Fig2_HTML.gif)


  图 5-2. 内存中的动态实例


  `ST/MX` 提供了所有必要的函数来管理动态实例的创建和删除。我们将推迟解释实例内存的管理方式。目前，您只需要知道 `ST/MX` 将实例视为一个 `struct
  mechinstance`，并忽略类特定属性。类特定的代码会忽略 `struct mechinstance` 结构。当然，这是 C 语言，语言本身不会对结构体成员的访问施加任何限制。




  ## 管理执行


  `ST/MX` 专为基于裸机微控制器的系统设计。其执行能力与硬件直接提供的功能相匹配，即：


  - 单个处理核心提供单一线程执行。

  - 中断可以抢占单个线程的执行，并将执行流引导至服务于该中断的代码。中断服务完成后，被抢占的线程将恢复运行。


  在第 2 章中，我们讨论了“运行至完成”的概念。模型执行规则要求每个活动完成后，其他活动才能运行。`ST/MX` 通过延迟事件的投递，直到没有状态活动在执行，来处理“运行至完成”机制。其实现机制简单：将信号事件加入队列，然后从队列中分派它们。


  `ST/MX` 提供了 C 语言的 `main` 函数，用于组织执行流程，如图 5-3 所示。


  ![A421575_1_En_5_Fig3_HTML.gif](img/A421575_1_En_5_Fig3_HTML.gif)


  **图 5-3. 主循环活动图**


  初始化之后，执行进入一个无限循环，处理同步队列和事件队列。同步队列是一个由中断服务程序提交的函数执行请求队列。事件队列是一个由领域活动信号发出的事件队列。本章剩下的大部分内容将专门讨论事件队列的运作方式。流程图显示，同步函数一次执行一个，直到同步队列为空。当没有更多同步函数时，从事件队列中取出一个事件并进行分派。中断是使能的，并且在同步函数或状态活动执行期间可以被服务。如果没有要执行的同步函数或要分派的事件，则执行进入等待状态。执行会一直等待，直到产生一个中断，中断处理完成后，等待状态结束，控制流返回到主循环的顶部。这种可由中断抢占的单线程执行提供了经典的前台与后台处理概念。


  `ST/MX` 不支持实时操作系统（RTOS）中的处理器上下文或任务概念。没有信号量、消息队列或对多个执行线程的控制。同步函数和状态活动总是在下一个计算被考虑之前执行完成。除了与访问同步队列相关的少量临界区外，中断始终处于激活状态。


  你可能会认为 `ST/MX` 的执行方案不太适合长时间的计算任务。如果是这样，你的想法是正确的。当一个状态活动长时间陷入计算密集型任务时，系统的其余部分将无法响应，因为所有任务都必须等待对系统中单个处理器的访问，并且除了中断服务外，没有对状态活动的抢占。中断服务只能在没有状态活动运行时（以及根据需要对中断硬件进行服务时）将待执行的代码请求排入队列，并且明确不允许访问事件队列。


  如果执行管理的这一特性无法满足建模领域的计算需求，那么 `ST/MX` 可能就不是该应用的合适计算技术，你需要一个以不同方式共享处理器或在多核处理器上运行的 MX
  领域。话虽如此，许多部署在裸机微控制器上的应用本质上都是反应式的：它们通过中断检测来自环境的刺激，并生成即时响应，通常是控制现实世界的某些方面。对于这类应用，像
  `ST/MX` 这样的单线程执行领域工作得非常好。它们能高效利用计算机资源，因为其能力与微控制器硬件直接提供的功能紧密对齐。


  ### 事件控制块


  当活动信号发出事件时，这些事件由一个事件控制块（ECB）表示。你可以将其视为一个必须为每个生成的信号填写的表单。以下是 ECB 的数据结构：


  - `next` 和 `prev` 成员是指向双向链表节点的指针。一个 ECB 会排入由 `ST/MX` 管理的三个列表之一。

  - `referenceCount` ECB 采用引用计数，该计数保存在 `referenceCount` 成员中。对 ECB 进行引用计数是 `ST/MX`
  的一个高级特性，用于某些周期性信号场景。我们的示例中不使用引用计数。

  - `eventNumber` 是一个编码事件编号的小整数。事件编号是从零开始的连续整数。

  - `alloc` 是一个小整数，用于确保事件不会被分派给一个不再存在的实例。本章稍后会讨论这一点。

  - `eventType` 编码了事件的类型。目前，假设这是一个试图触发状态转换的事件。其他事件类型，即创建（creation）和多态（polymorphic），将在第
  9 章讨论。

  - `instOrClass`，对于转换事件，持有一个 `targetInst`，指向将要接收该事件的实例。

  - `srcInst` 是一个指向信号发出该事件的实例的指针。

  - `delay` 用于延迟信号（正如我们本章后面所讨论的）。

  - `eventParameters` 包含事件指定的任何参数的值。


  ```

  typedef struct mechecb {

  struct mechecb *next ;

  struct mechecb *prev ;

  RefCount referenceCount ;

  EventCode eventNumber ;

  AllocCount alloc ;

  MechEventType eventType ;

  union  {

  MechInstance targetInst ;

  MechClass targetClass ;

  } instOrClass ;

  MechInstance srcInst ;

  MechDelayTimedelay;

  EventParamType eventParameters ;

  } *MechEcb ;

  ```


  一个 ECB 会被排入由 `ST/MX` 管理的三个列表之一：


  - **空闲队列**：是一个空闲 ECB 的列表，可用于信号事件。不使用的 ECB 作为有限资源在此排队等待。

  - **即时事件队列**：是一个已填写完毕、等待即时分派的 ECB 列表。

  - **延迟事件队列**：是一个已填写完毕、将在未来指定时间投递的 ECB 列表。这些代表延迟信号。


  ### 信号事件


  信号事件的动作被转换为以下过程：


  1.  获取一个空闲的 ECB。

  2.  用所需信息填写 ECB。

  3.  将 ECB 排入适当的事件队列（即时或延迟）。


  这些步骤在图 5-4 中进行了演示。


  ![A421575_1_En_5_Fig4_HTML.jpg](img/A421575_1_En_5_Fig4_HTML.jpg)


  **图 5-4. 信号事件**


  `eventNumber` 成员保存一个从零开始的连续整数，用于编码事件。事件编码基于每个 pycca 类，因此每个 pycca 类都有自己的一组事件，并且每组事件都从零开始连续编码。这种编码选择意味着事件编号可用作数组的索引，并且
  pycca 生成编号以确保正确的索引。


  `srcInst` 是一个指向信号发出该事件的实例的指针。如果事件在实例上下文之外被信号发出（例如，由领域函数或基于类的操作），则 `srcInst` 设置为
  `NULL`。


  事件的任何参数都放在 ECB 末尾的参数块中。参数按值传递。通常，只有少量数据作为事件参数传递。传递数据的引用会带来管理分配给参数值的内存的额外负担。`ST/MX`
  不提供任何设施来管理通过引用传递的事件参数数据。




  #### 捕获飞行中事件错误


  ECB 的 `alloc` 成员值得特别说明。ST/MX 必须能够检测到事件被分派给一个已不存在的实例的情况。例如，一个事件可能已向某个实例发出信号，但该实例在事件送达前被销毁。更糟的是，一个新实例有可能在事件送达前，被创建在已销毁实例的同一内存位置！这被称为“飞行中事件错误”，是
  ST/MX 诊断的少数运行时错误之一。它被视为一种分析错误，因为建模者有责任确保正确的同步，使得在针对某实例的任何事件仍在飞行中时，该实例不会被删除。


  由于将事件送达给不存在的实例或错误实例的后果非常严重，ST/MX 采取了措施来防止这种情况。为了诊断该错误，当事件发出信号时，其 `alloc` 成员值会被设置为与目标实例的
  `alloc` 成员相同的值。当事件送达时，这两个值必须仍然一致。因为每次分配实例时，它都会为 `alloc` 成员获得一个新值，而空闲实例的 `alloc`
  成员值为 0，所以可以检测到实例在拥有飞行中事件时被销毁的情况。出于分派事件的目的，`alloc` 成员补充了仅由其内存地址提供的目标实例标识。


  在填充 ECB 成员的值后，ECB 会被排入分派队列。状态机规则要求，实例发向自身的事件，优先于从其他实例发出信号的事件进行分派。因此，自指事件被放置在事件队列的前端，而非自指事件则排入队列尾部。


  #### 延迟信号


  ST/MX 支持延迟信号的概念。延迟信号是一种请求，要求事件不早于所请求的延迟时间被分派。延迟时间以毫秒为单位指定，延迟时间可以为零（这将导致事件被立即投递到即将发生的事件队列）。延迟事件在等待送达期间，会被投递到一个独立的延迟事件队列中。在可执行
  UML 中，对于任何一对发送/接收实例（它们可以相同——即延迟事件可以是自指的），给定事件编号的未决延迟事件只能有一个。这将相同的未决延迟事件数量限制为一个。ST/MX
  将任何投递重复延迟事件的尝试，解释为取消第一个延迟事件并以新时间投递新延迟事件的请求。这是实践中最为便捷的解释方式。


  ECB 的 `delay` 成员用于实现延迟分派。当被插入到延迟事件队列时，`delay` 成员存储的是事件之间的时间差，而不是实际请求的时间延迟。在插入过程中，ECB
  的 `delay` 成员被设置为该插入事件所需的总时间，超出队列中先前事件累计时间的额外部分。这导致延迟事件队列按时间差的递增顺序排列。


  延迟事件分派使用单个定时器，该定时器在延迟事件队列头部的任何 ECB 所指示的时间到期。当这个时间到期时，该 ECB 会被转移到即将发生事件队列的尾部，然后定时器会根据当前延迟事件队列头部
  ECB 所指示的时间进行重置。即使是自指的延迟事件，也会被放置在即将发生事件队列的尾部。这种 ST/MX 机制体现了这样一种思想：延迟事件仅仅是请求一个普通事件在稍后时间送达，即使该请求来自将接收该事件的同一个实例。


  图 5-5 展示了一个示例。


  ![A421575_1_En_5_Fig5_HTML.jpg](img/A421575_1_En_5_Fig5_HTML.jpg)


  图 5-5. 处理一个延迟事件


  在上述示例中，当前定时器设置为 15 分钟。延迟事件队列中每个 ECB 的时间差值都是相对于下一个最早送达时间的，因此队列头部的值始终为零。当定时器倒计时归零时，延迟事件队列头部的
  ECB 会被转移到即将发生事件队列的尾部，此时它代表一个等待被分派的普通事件。


  然后，定时器会加载下一个条目（本例中为 25 分钟）的延迟值，并重新开始倒计时。因此，观察该图，您可以看到第二个 ECB 将在 15 分钟 + 25 分钟 =
  40 分钟后送达。第三个 ECB 在 40 分钟 + 1 小时 50 分钟 = 2 小时 30 分钟后分派，这与该 ECB 请求的送达延迟完全吻合。


  边界条件以及启动和停止定时资源的必要性，使得实现逻辑比此描述更为复杂。队列的排序意味着，插入到延迟事件队列需要搜索以找到合适的位置，同时要考虑队列中已存在条目相关的累计时间。这种设计在插入时进行计算，以换取延迟时间到期时更简单的操作。请注意，没有周期性的唤醒来扫描延迟队列。在电池供电环境中，唤醒以确定没有要执行的操作是不可取的。


  为了实现延迟信号，ST/MX 必须能够访问一个定时资源。这必然是特定于系统的，通常意味着微控制器的某个定时器外设专门用于运行延迟事件队列。必须小心谨慎，以确保即使微控制器在等待时处于停机或低功耗模式，定时器也能继续运行。因此，ST/MX
  将底层定时器操作委托给一组可根据微控制器定时器外设的具体情况进行适配的函数。


  延迟信号可以被取消。ST/MX 保证取消一个延迟信号后，该信号将不会被送达。这意味着取消延迟信号会将其从延迟事件队列中移除，或者如果它已经到期，则从即将发生事件队列中移除。取消一个尚未发出信号或已经送达的延迟事件并不是错误（也就是说，在取消操作期间未能找到请求的延迟事件并非错误）。


  最后，ST/MX 支持查询延迟事件的剩余时间。此持续时间可用于调整延迟时间。




  #### 事件分发


  既然你已经了解了即时事件或延迟事件在触发时是如何排队的，接下来我们可以探讨这些事件随后是如何被分发的。图 5-3 展示了在主循环中事件分发的发生时机。图 5-6
  则说明了我们需要导航哪些数据结构，才能获取支持事件分发所需的一切要素。


  ![A421575_1_En_5_Fig6_HTML.jpg](img/A421575_1_En_5_Fig6_HTML.jpg)


  图 5-6. 定位转换表和动作表


  事件分发从移除紧迫事件队列（之后我们简称为事件队列）头部的 ECB 开始。我们通过 ECB 的 `targetInst` 成员，找到将要接收该事件的实例。每个实例在其结构体中都有一个
  `currentState` 成员，以及一个指向其类数据（`instClass`）的指针。类结构体包含了适用于该类所有实例的数据。对于事件分发而言，我们关注的是对象分发块（ODB）。ODB
  是 `pycca` 为某个类生成的数据的一部分。你在第 4 章中，当我们展示 `pycca` 翻译状态模型的输出时，已经见过这些数据了。从 ODB 中，我们可以获取转换表（一个状态与事件的矩阵）和动作表（一个由状态编号索引的函数指针数组）。在确定了转换的目标状态后，就会从动作表中获取一个指向待执行代码的指针。一个对象分发块的
  C 语言定义如下：


  ```

  typedef struct objectdispatchblock {

  DispatchCount stateCount ;

  DispatchCount eventCount ;

  StateCode const *transitionTable ;

  PtrActionFunction const *actionTable ;

  bool const *finalStates ;

  } const *ObjectDispatchBlock ;

  ```


  `transitionTable` 是一个 `stateCount` 乘 `eventCount` 的矩阵，存储在一个由 `StateCode` 类型值组成的一维数组中。通过使用实例的
  `currentState` 值和来自被分发事件的 ECB 中的 `eventNumber`，对 `transitionTable` 进行索引，可以得到新的状态值。


  然后，这个新状态被用作 `actionTable` 数组的索引，以找到一个指向动作函数（更符合 UML 的术语是活动函数，因为它会导致状态活动的所有动作，但为了最大程度减少混淆，我们沿用代码中使用的术语）的指针。`actionTable`
  成员是一个指针，指向一个包含 `stateCount` 个指向动作函数的指针的数组，这些动作函数的签名如下：


  ```

  typedef void ActionFunction(void *const inst, void *const params) ;

  typedef ActionFunction *PtrActionFunction ;

  ```


  图 5-7 说明了这个索引过程。


  ![A421575_1_En_5_Fig7_HTML.gif](img/A421575_1_En_5_Fig7_HTML.gif)


  图 5-7. 处理分发的某个事件


  执行动作函数时，会传入 `targetInst` 的值和一个指向 ECB 成员 `eventParameters` 的指针。动作函数的参数类型被声明为 `void`
  指针，这样动作表的数据类型就可以对所有类保持一致。`Pycca` 会在状态活动的开头添加代码，将这些指针值重新转换为实例及其参数的正确类型。


  从动作函数返回后，需要查阅 `finalStates` 数组。`finalStates` 成员是一个指向大小为 `stateCount` 的数组的指针，如果该指针不为
  `NULL`，则它包含一个布尔指示，表明实例的新状态是否为终态。如果实例进入终态，那么在调用动作函数后，该实例会被自动删除。


  还存在另外两种转换可能性：新状态可以是“忽略”或“不可能发生”。当新状态是“忽略”时，不会发生任何转换，事件被简单地丢弃。“不可能发生”的转换则是一个错误。这种转换在逻辑上被认为是不可能的，如果它在运行时发生，则会导致一种可以被认为是紧急情况的状态。


  图 5-8 概述了处理事件所需的所有关键数据片段是如何关联的，以及如何利用当前状态和事件来找到转换并执行其活动。


  ![A421575_1_En_5_Fig8_HTML.gif](img/A421575_1_En_5_Fig8_HTML.gif)


  图 5-8. 事件分发过程中使用的数据


  为了将这些图联系起来，并且本着消除神秘空白的精神，我们给出了 ST/MX 中用于分发事件的 C 语言代码。在这一阶段，ECB 已从事件队列中被移除。以下代码计算新状态、调用转换对应的状态活动，并处理所有分发规则：


  * ❶ 这里，我们通过索引转换矩阵，根据当前状态和事件计算出新状态。转换矩阵以一个由状态码组成的一维数组形式存储。这样做是必要的，这样无论为类状态模型定义了多少个状态和事件，所有类都可以拥有相同数据类型的转换矩阵。因为转换矩阵是以一维数组形式存储的，我们必须进行索引计算，将转换矩阵分割成一个按状态和事件访问的二维矩阵（也就是说，我们必须根据状态模型中的事件数量来缩放“行”访问）。`Pycca`
  确保转换矩阵的单元格按此方式排序。

  * ❷ 调用与新状态关联的状态活动函数。我们允许空状态活动拥有一个 `NULL` 函数指针，以避免调用/返回的开销。


  ```

  static void

  dispatchNormalEvent( MechEcb ecb)

  {

  MechInstance target = ecb->instOrClass.targetInst ;

  ObjectDispatchBlock db = target->instClass->odb ;

  // 检查当前状态或事件编号是否损坏。

  assert(db->stateCount > target->currentState) ;

  assert(db->eventCount > ecb->eventNumber)

  // 检查 "事件正在处理中" 错误。当一个实例在事件队列中仍有未处理的事件时被删除，

  // 会发生此错误。对于本架构，此类情况被视为运行时检测到的分析错误。

  if (target->alloc != ecb->alloc) {

  mechFatalError(mechEventInFlight, ecb->srcInst, target, ecb->eventNumber) ;

  }

  // 从转换表中获取新状态。

  StateCode  newState  =  *(db->transitionTable +                            ❶

  target->currentState * db->eventCount + ecb->eventNumber) ;

  #        ifdef MECH_SM_TRACE

  // 追踪转换过程。

  traceNormalEvent(ecb->eventNumber, ecb->srcInst,

  ecb->instOrClass.targetInst, target->currentState, newState) ;

  #        endif

  // 检查是否为不可能发生的转换。

  if (newState == MECH_STATECODE_CH) {

  mechFatalError(mechCantHappen, target, target->currentState, ecb->eventNumber) ;

  } else if (newState != MECH_STATECODE_IG) {

  // 检查转换矩阵是否损坏。

  assert(newState stateCount) ;

  // 在执行状态动作之前，更新当前状态以反映转换结果。

  target->currentState = newState ;

  // 如果存在状态动作，则调用它。

  PtrActionFunction action = db->actionTable[newState] ;

  if (action) {

  action(target, &ecb->eventParameters) ;                           ❷

  }

  // 检查是否进入了终态。如果是，则删除该实例。

  if (db->finalStates && db->finalStates[newState]) {

  mechInstDestroy(target) ;

  }

  }

  // 将 ECB 返回到池中。

  mechEventDelete(ecb) ;

  }

  ```


  这段简短的代码完成了 ST/MX 中绝大部分的执行序列化工作，并且除了主循环代码之外，它是 ST/MX 中执行频率最高的代码。




  ### 追踪执行


  状态模型图在展示实例生命周期可能的发展路径以及该过程中发生的处理方面表现出色。当领域运行时，实例会根据发送给该特定实例状态机的一系列信号进行转换。因此，查看实例所做转换的时间顺序是很有洞见的。


  `ST/MX` 可以为你追踪事件分发。由于追踪会影响程序的执行速度和代码大小，它可以在测试阶段有条件地编译进来，并在交付的版本中移除。以下是针对我们曾在第 2
  章讨论的空中交通管制模型的执行场景的事件分发文本日志。该日志是在翻译后领域的实际运行期间生成的：


  ```

  2016/06/09 11:17:12.112: (nil) - Ready_for_duty -> Air_Traffic_Controller.atc53:  ←,

  OFF_DUTY -> Verifying_Adequate_Break

  2016/06/09 11:17:12.113: Air_Traffic_Controller.atc53 - Log_in ->   ←,

  Air_Traffic_Controller.atc53: Verifying_Adequate_Break -> Logging_In

  2016/06/09 11:17:12.113: Air_Traffic_Controller.atc53 - Logged_in -> ←,

  Air_Traffic_Controller.atc53: Logging_In -> ON_DUTY

  2016/06/09 11:17:12.113: Air_Traffic_Controller.atc53 - In_use -> Duty_Station.s3:
  ←,

  AVAILABLE -> IN_USE

  ```


  在此日志中，共分发了四个事件。每个分发都有时间戳。追踪内容包括发出事件的实例、事件名称以及接收事件的实例。如果事件是在实例上下文外部发出的，则事件源记为 (`nil`)。在此场景中，是通过从领域外部（而非任何实例内部）发送
  `Ready_for_duty` 信号来启动的。否则，实例通过其类名以及作为初始实例种群一部分赋予该实例的名称来标识。追踪的最后两个字段显示了从收到事件时的当前状态到转换后新状态的过渡。


  日志中的转换展示了与第 2 章描述的相同序列。`Ready_for_duty` 事件导致了离线管制员 `atc53` 的一系列转换：实例从 `OFF_DUTY`
  状态，经 `Verifying_Adequate_Break`、`Logging_in`，最终到达 `ON_DUTY` 状态。最后一条日志条目显示了 `Duty_Station`
  转换到 `IN_USE` 状态。


  追踪执行有助于理解领域如何运行，并支持记录测试结果。由于状态模型是一个有向图，因此有可能计算出一组事件序列，确保每个状态活动至少被执行一次（这与状态模型图的生成树有关）。确定这样一组事件序列可以在不了解活动计算内容的情况下完成。状态模型中存在的结构有助于确定满足项目质量目标所需的最小测试用例集。转换追踪可以为测试用例的实际执行提供客观证据。


  ##### 在 POSIX 环境中运行


  `ST/MX` 执行域可在三个平台上运行（并可适配到其他微控制器平台）：


  *   ARM Cortex-M3

  *   TI MSP-430

  *   POSIX（可移植操作系统接口）


  针对基于微控制器的系统并提供 POSIX 版本的运行时代码，这看起来可能有些不同寻常。虽然你可以使用 `pycca` 构建 POSIX 应用程序，但 `ST/MX`
  的 POSIX 版本的主要目的是支持跨平台开发。在为微控制器进行开发时，这种开发方式至关重要。在此，模型在桌面计算机上的模拟模型执行环境中进行翻译和运行。在模型得到充分验证后，可以将它们编译、集成，并在目标平台上进行进一步测试。


  微控制器不具备支持编译器和其他构建环境元素的能力。因此，开发人员面临的情况是在桌面系统上构建，然后将代码下载到嵌入式平台。微控制器通常确实有调试设施，并且大多数微控制器开发环境都支持某种形式的源代码级调试。


  然而，通常很少有文件 I/O 或任何大容量的持久存储。通常，你只能满足于简单的 `printf()` 风格调试。存在一个两难问题：应该投入多少精力来改进目标环境，以及这些精力是否更好地用于在模拟中运行代码。当应用程序控制着物理实体，并且遇到断点就突然停止是不切实际或不安全的时候，这个问题尤其突出。例如，一个移动的机械臂涉及必须考虑动量的实际物理过程。仅仅在断点处停止处理器可能会造成物理损伤。在这种情况下，通过检查执行追踪数据进行调试通常是唯一实用的解决方案。


  对于已正确桥接到任何系统特定功能（例如，硬件外设）的领域，针对 POSIX 版本的运行时进行编译和链接将生成一个可执行文件，该文件可以在大多数类 Unix（例如
  Linux）、macOS 或 Windows（在 Cygwin 系统下）中运行。由于这些开发系统拥有大量的存储和 I/O 能力，因此可以构建测试夹具或测试平台，在目标环境之外对领域代码进行测试。例如，可以要求编译器跟踪代码覆盖率，并测量单元测试的覆盖率。当有地方存储状态机追踪信息时，处理它们也会容易得多。追踪状态模型的转换是衡量程序状态空间被测试覆盖程度的一种便捷方法。可以通过检查模型的状态图来获得驱动状态模型转换的测试集。在
  POSIX 环境中运行的能力也为使用可用的持续集成和回归测试工具提供了可能性。为了在模拟下运行，需要模拟或仿真应用程序中那些系统特定的部分。这可能是一项艰巨的任务，尤其是当与真实世界的交互是应用程序执行的主要驱动力时。项目团队必须评估成本与收益。


  当然，并非所有测试都能在模拟环境中运行。在模拟中运行对于测试、记录程序逻辑以及使用特定测试集驱动其执行路径非常方便。仍然需要在目标微控制器上进行集成并执行额外的测试。在模拟中运行将初始测试分为逻辑测试和目标集成测试，并将逻辑测试置于一个更容易获取和记录结果的环境中。




  ## 错误处理


  我们还粗略地介绍了处理错误的方式。`ST/MX` 域负责设定系统中处理错误的策略。`ST/MX` 通过将其检测到的所有错误都指定为致命错误，从而最大限度地减少了重复性的错误处理。因此，`ST/MX`
  检测到的所有错误都会触发异常终止条件，从而阻止进一步执行。没有提供任何接口来向模型指示 `ST/MX` 操作的成功或失败。这对建模人员来说是有益的，因为模型可以发送事件或创建实例，而无需检查错误返回值或处理潜在的异常。模型只是简单地假设执行管理是完美的。任何出现的问题都由
  `ST/MX` 负责处理。


  `ST/MX` 域会诊断两种类型的错误：


  - 源自 `ST/MX` 内部执行的错误

  - 在运行时发现的、表明模型分析存在错误的错误


  `ST/MX` 使用多种内部数据结构——例如，事件控制块——每种都有固定的数量。类似于类实例，内部数据结构也在编译时确定大小的数组中分配。这遵循了 `ST/MX`
  不执行动态内存分配的设计目标。耗尽内部资源会导致致命错误。当类实例存储数组中没有空闲槽位时，请求分配一个类实例同样会导致致命错误。


  在运行时发现的分析错误要么是状态机转换错误，要么是事件传输中的错误。这些错误也是致命错误。


  `ST/MX` 提供了一种方法来提供您自己的致命系统错误处理程序。这对于日志记录目的以及其他类型的外部通知非常有用。默认情况下，`ST/MX` 在发生致命错误时会执行标准
  C 库函数 `abort()`。在嵌入式系统中，这通常会导致系统复位，微控制器重新开始执行。尽管这种方法看起来可能很严厉，但对于大多数嵌入式系统来说，几乎没有其他实用的补救措施。即使一个状态活动在试图发送事件时知道没有可用的
  ECB，它又能有什么实际的恢复措施呢？仅仅忽略信号无法发送或状态转换在逻辑上不可能这一事实，然后乐观地继续运行并指望情况好转，是不现实的。这意味着必须仔细地确定所需数据结构资源的大小。在运行时检测到的分析错误只能通过全面的测试用例来清除。记录致命错误的原因有助于诊断问题，但当系统部署在实际环境中，并且
  `ST/MX` 确定发生了严重错误时，除了重启并重试之外，几乎没有什么可以做的了。


  严重的软件错误可能还需要在系统整体的上下文中进行处理。安全关键系统，例如医疗设备，通常有专用的硬件，可以接管软件功能的至少一部分。大多数嵌入式系统都有一个或多个看门狗定时器，必须定期复位，以此作为软件正常运行的检查。未能及时复位看门狗可能会通过硬件或其他后备策略触发处理器复位。有些系统甚至有专用的硬件来捕获“运行-复位-运行-复位”序列，这些序列发生得过于频繁，表明软件中存在无限复位循环的情况。`ST/MX`
  只提供了在软件执行达到无法继续的状态时知晓该状态的方法。在更大的系统上下文中如何处理这种状态，必须基于全面的风险分析来决定。


  ### 总结


  在本章中，我们描述了 `ST/MX` 域（即 `pycca` 翻译的运行时组件）的内部工作机制。它是生成可运行程序所需的翻译的最后一个方面。


  `ST/MX` 管理系统所有的类数据和执行顺序。`ST/MX` 完全是数据驱动的，本章的重点在于描述 `pycca` 生成的数据结构如何被 `ST/MX` 中的算法所使用。`ST/MX`
  对实例数据有一个统一的视图，允许它对任何类的实例执行操作。


  执行的管理主要通过将事件排队等待调度来实现。排队设计支持模型执行规则所需的“运行至完成”语义。队列中的事件由事件控制块表示。事件调度也可能被延迟，以支持模型活动在未来的某个时间启动执行的需求。


  实例状态机的转换是使用转换表来计算的。转换表按当前状态编号和事件编号进行索引，索引单元格包含要转换到的新状态。状态的活动是一个函数，指向该函数的指针被放置在动作表中，动作表是一个按状态编号索引的数组。


  文中还给出了事件调度的 C 代码，精确地展示了状态转换是如何计算的。`ST/MX` 支持生成事件调度的时间顺序跟踪日志。我们运行了第 `2` 章中的执行场景，并通过实际执行，从生成的跟踪日志中验证了我们从状态模型图中推导出的转换。


  `ST/MX` 实现了系统的错误处理策略，并且由 `ST/MX` 检测到的所有错误都是不可恢复的，被视为致命的系统错误。




