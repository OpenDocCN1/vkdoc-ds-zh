- "# 11. 翻译领域面面观\n\n在本书中，我们通过一系列示例展示了如何将可执行模型无损地翻译为可运行程序。我们的翻译技术是从模型获取代码的一种方法。我们既不宣称它是翻译模型的唯一途径，也不宣称它是最佳翻译方式。我们所呈现的技术，与所有软件工程流程一样，既有优势也有缺陷。但我们通过翻译可执行模型，成功生成了满足目标平台约束的可运行代码，这实现了我们的目标。我们认为这很重要，因为引用《敏捷宣言》¹中的一段话：\n\
  \n> 我们逐渐体会到：个体和互动高于流程和工具，可工作的软件高于详尽的文档。\n\n根据我们的经验，那些号称全面的工具并不全面，也无法替代个人的工程技能。而且，无论可执行模型多么深刻地捕捉了领域逻辑，建模都是软件开发中必要但不充分的步骤。我们确实重视工具、开发流程和文档完善的模型，但本着《敏捷宣言》的价值观，我们首要追求的是由技能娴熟的个体开发出的高质量、可工作的软件。\n\
  \n在本章中，我们将从更广阔的视角审视模型翻译，并探讨在一般情况下如何实现这一过程。我们首先介绍一个参考翻译工作流。借助这个参考工作流，我们讨论翻译路径中遇到的一些困难。然后展示`pycca`与参考工作流的对比。最后，讨论我们的翻译方法如何应用于其他目标平台。\n\
  \n## xUML 翻译的参考工作流\n\n图 11-1 概览了将 xUML 模型翻译为代码所需的任务和工件。该图旨在说明任何 xUML 翻译系统中都必须以某种形式存在的所有关键要素。我们所描述的`pycca`方法是朝这个理想化工作流迈出的一步。在本章后面，我们将展示`pycca`方法如何融入这个更广阔的背景。\n\
  \n![A421575_1_En_11_Fig1_HTML.jpg](img/A421575_1_En_11_Fig1_HTML.jpg)\n\n图 11-1.\
  \ 参考翻译工作流\n\n图表顶部被划分为平台无关区域和平台特定区域。在平台无关区域内从左到右，我们有一系列建模任务，对于系统的给定迭代，这些任务按指示顺序完成。我们并非暗示只有一次迭代。我们倡导用敏捷方法进行系统开发，但也仔细区分技术流程和项目管理流程。每次通过平台无关区域的迭代都会交付一个内部一致、完全可执行的建模版本系统。每次迭代的频率和内容、项目团队成员如何分配到任务、以及如何使用每次迭代的结果来征求反馈和附加需求，这些都是项目管理流程的一部分。这些是任何实际项目的重要方面，但每个项目都必须自行规划。这里的讨论严格侧重于工作流的技术层面。\n\
  \n跳到平台特定区域的最右侧，是需要手动编写、从第三方获取、先前已存在或从非 xUML 模型生成的代码。在需求已知的范围内，非 xUML 代码可以与 xUML\
  \ 建模轨道并行开发。\n\n当领域模型的一个一致片段完成后，必须执行剩余的`Mark`任务。在此，出于代码生成期间性能原因的考虑，那些值得特别关注的建模组件会被标注。例如，你可以指明哪些类具有大型或小型实例群，以便生成合适的代码——假设目标平台模型提供了区分这些情况的功能。\n\
  \n以上涵盖了图表的顶部。现在让我们向下移动。随着模型的创建和编辑，它们被存储在模型仓库中。这个仓库是 xUML 元模型的一种实现。因此，领域模型和所有已填充的实例本身构成了元模型的实例群。\n\
  \n模型标记也可以存储在仓库中。这不会损害模型的平台无关性，因为标记作为与模型交叉引用的注释被存储。因此，模型仓库将允许多组标记（可能针对不同平台）与同一领域模型关联。\n\
  \n平台模型定义了 xUML 模型元素被打包和重组以在目标平台上高效执行的方式。它由一个程序填充，该程序将 xUML 模型元素转换为平台模型的相应元素。平台模型、其填充/转换程序以及编译后的\
  \ MX 运行时构成了针对特定平台类别的核心\"模型到代码\"解决方案。\n\n现在，平台模型已经根据从模型仓库中提取的标记化 xUML 模型完成了填充。从这里，可以生成目标编程语言的代码。然后，这段代码与\
  \ non-xUML 代码一起编译，生成一组目标文件。这些目标文件与 MX 运行时链接在一起，生成一个完整的系统可执行文件。\n\n你可能还记得，MX 运行时是知道如何分发事件、进行状态转换、导航关系以及执行\
  \ xUML 模型的那段代码。\n\n总结一下，要启用代码生成，必须提供以下组件：\n\n* 一个平台模型\n* 一个从 xUML 模型填充平台模型的程序\n\
  * 一个根据平台模型实例群以目标编程语言生成代码的程序\n* 一个模型执行运行时模块\n\n\n\n## 关键挑战\n\n参考工作流描绘了一幅理想化的图景，展示了构建模型并从中生成代码所需的主要元素。它仅仅部分反映了当今基于模型的系统实际构建方式。不幸的是，许多组织被基于模型的软件工程（MBSE）的理想所裹挟，投入昂贵且可能具有约束性的模型开发工作流。由于缺乏先前经验，项目团队会直接购买模型绘制工具并开始画图，因为模型图是工作流的关键产物。然而，建模的核心在于用逻辑解决问题，而图仅仅是捕捉问题解决方案的一种形式，它能直接为生成软件解决方案做出贡献。在项目后期，理论与实践往往会在令人失望的昂贵代价中相撞。结果便是，通过采用第\
  \ 1 章讨论的某种方法（即渐进式或突变式）来填补图与代码之间的鸿沟，而这两种方法都无法从建模中获得太多益处。\n\n经验不足的项目团队应寻求培训支持，以带领团队掌握这种本质上不同的软件构建方式。然而，很难说服那些已使用传统技术成功构建软件的项目团队，让他们相信建模与转换需要他们可能尚未掌握的技能和思维过程，并且在建模工具中操作图并不能赋予他们这些技能。在本节中，我们将为您指出一些此类棘手的现实问题。在审视转换工作流的每个阶段时，我们会指出我们在多年基于模型的开发中遇到的常见困难与挑战。\n\
  \n我们并非暗示，仅仅因为实践中存在困难，建模与转换就是一种不成熟或不可行的开发方法。许多项目团队通过使用建模与转换，成功构建了高质量系统。我们完全可以轻易列举出传统软件开发技术中更长的一系列问题。我们故意没有这样做，因为互联网站点上记录的关于真实程序中的可怕问题比我们能在此详述的更为全面，而且指出其他方法中的问题并不能解决我们当前面临的关切。软件开发方法与其他复杂的人类活动一样，也会受到短暂技术潮流的影响。我们不会沉迷于那种试图让您相信一切一帆风顺的盲目乐观主义。我们并不认为存在能杀死软件狼人的银弹。（参见小弗雷德里克·P·布鲁克斯的论文《没有银弹——软件工程中的本质与意外》及《银弹再探》。）建模与转换代表了在与这一猛兽搏斗过程中取得的切实、实际的进步。但预警即是武装，我们希望我们对当前建模与转换实践中的担忧与挫败感，能帮助一些项目团队免于陷入自身的失望。\n\
  \n### 识别领域\n\n开发软件系统的第一步是识别所有必需的领域。出于转换的目的，我们关注哪些领域被建模，哪些领域以代码形式提供。以代码形式提供的领域可以是手工编写的、从第三方获取的、作为遗留代码或现有库存在的，或是用非\
  \ xUML 语言从模型生成的。最终，会生成一个称为领域图的图表，它列出了所有领域及其依赖关系。\n\n这一步的关键挑战在于正确划分领域。这不是一个可以靠工具解决的问题。你需要经验、技能以及思考问题的正确方法。\n\
  \n在划分大型系统时，很容易依赖熟悉平台技术（如库、任务和硬件边界）这根“拐杖”。这些边界实在太具体了！但经验丰富的开发者知道技术总是在变化，具体性与脆弱性往往相伴而生。“别担心，硬件设计已经冻结了……”没错。更重要的是，基于特定平台的分割会产生特定平台的模型，这违背了建模的许多初衷。\n\
  \n即使成功忽略了平台边界，将系统按功能类别而非主题类别划分也是很常见的。这种错误使得开发稳固的类模型变得困难，而类模型正是每个领域的基础。至于那些与管理或政治相关的非工程性边界，我们甚至不必提及。\n\
  \n以下是一些可能有帮助的指导原则。对于任何候选的领域图，请考虑这两个问题：\n\n1. 如果平台技术发生变化，领域图会在任何方面改变吗？它不应该改变。例如，如果你有两个\
  \ CPU 而不是一个，会怎样？如果你使用了任务和线程，会怎样？如果你在分布式平台上运行系统，会怎样？\n2. 是否存在任何类必须同时存在于一个或多个领域中？不应该存在。一个主题由一组类及其关系构成的词汇来定义。这种基于类而非基于功能的划分要求每个类只存在于一个领域中。在\
  \ ALS 中，喷射器压力“存在于”SIO 和 Lubrication 两个领域中；然而，它在每个领域中的含义完全不同。在 SIO 中，压力并没有什么特殊之处；它只是来自输入点、需要缩放和转换的数据。但在\
  \ Lubrication 领域，压力就是真正的压力，而采集和转换的技术在这里并不重要。同样，Injector 类只存在于 Lubrication 领域。例如，如果我们把\
  \ Lubrication 领域划分为正常喷射功能和诊断喷射功能，那么每个功能都需要共享 Injector 类。\n\n回顾第 6 章中的 ALS 领域图。它完全是平台无关的。你可以像我们用`pycca`所做的那样，将所有领域放在一个任务中，或者将它们分散到多个处理器或线程中。软件部署到的硬件对领域图本身没有影响。请注意，领域是由它们所*知道*的内容来定义的，而不是由它们所*做*的事情来定义的。Lubrication\
  \ 领域了解润滑设备以及润滑的工作原理。它对报警的系统处理一无所知，对信号处理一无所知，对用户界面技术也一无所知。Lubrication 领域中的所有功能都源于它对设备必须如何被润滑的了解。SIO\
  \ 领域了解信号和执行器，但不对信号中的数据或对外部世界的控制赋予任何特定含义。\n\n最终，测试领域图的最佳方法是，在每个建模领域内部构建一定比例的类模型，作为验证练习。在此过程中，通常需要重新思考划分方式，并最终重构领域图。例如，如果您在第一轮中没有将信号\
  \ I/O 识别为一个领域，您可能会发现润滑的状态模型变得过于复杂，需要不断轮询新数据。每个具有传感器驱动属性的物理设备都需要复制相同的轮询或事件响应模式。当您在某个领域内的多个状态机中看到相同的千篇一律的模式时，这通常是一个信号，表明缺少某个服务领域，或者需要进行某种领域重构。\n\
  \n通常情况下，编码领域或非 xUML 领域作为领域来说并不完整，需要某种包装器，该包装器可能被建模也可能不被建模。因此，在这些领域中可能需要进行额外的建模，并且这些领域必须与提供的代码进行接口。\n\
  \n\n\n## 构建并记录模型\n\n对于在 xUML 中建模的每个领域，一位或多位分析师会与领域专家合作，对该领域相关的任何主题进行建模。图 11-2 阐释了这一概念。\n\
  \n![A421575_1_En_11_Fig2_HTML.jpg](img/A421575_1_En_11_Fig2_HTML.jpg)\n\n图 11-2.\n\
  \n合适的人才是成功建模的关键。\n\n此阶段面临的挑战之多，足以写成一整本书——《可执行 UML：如何构建类模型》，作者 Leon Starr (Prentice-Hall,\
  \ 2001)——但以下是其中最重要的几点：\n\n* 让合适的人才协同工作。\n* 高效地输入和编辑模型。\n* 有效地记录分析与模型。\n\n### 使用合适的建模人才\n\
  \n构建模型需要三种不同的人才：分析能力、建模能力和领域专业知识。这三种能力很少能集中在同一个人身上并达到足够高的水平，因此通常需要组建团队来协作完成。大多数项目犯的第一个错误就是随便抓来一群程序员，只是因为这些人碰巧有空，就把他们分配到建模工作中。这是一个错误，因为大多数程序员缺乏构建模型所需的适当技能、知识或意愿。\n\
  \n分析能力是指能够就某个主题提出问题，并能够书写、绘制或以其他方式描述该主题。这需要良好的沟通技巧。分析师总是试图分解问题，并找出那些几乎从不发生，但一旦发生就必须正确处理的有趣案例。分析师必须具备扎实的沟通和演示技巧，以获取专家的反馈。最重要的是，分析师必须摒弃对某个主题的成见，并习惯性地暴露自己对某个话题的无知，以便从领域专家那里获取精妙的细节。这些并不是程序员通常培养的技能。程序员喜欢带着现成的模式和库来到工作现场，随时准备编写代码。\n\
  \n建模能力是指能够将分析结果以客观、可验证的方式形式化。这需要具备将平台无关的构建块（如类、关系、状态等）组合在一起的技能。这听起来有点像编程，但有一个关键区别。程序员总是在想方设法巧妙地封装事物，使其高效运行；而建模者通常是在拆解思想，以揭示关键且细微的差异。建模者关注效率，其含义是：一个思想应尽可能简单、尽可能清晰地表达，同时又能处理分析过程中发现的所有细微情况。程序员常常为程序中元素越少越好而感到自豪，一路上都在进行封装和隐藏；而分析师则为拆解和暴露复杂性而感到自豪。那个揭示了被忽视情况的额外类、属性或关系，是分析师的骄傲之源。\n\
  \n最后，领域专家不需要了解任何建模知识。他们只需要精通自己的领域，并且有意愿和时间向分析师/建模者解释清楚。当然，如果他们能读懂模型以确认自己的理解是否正确，那也不无裨益。\n\
  \n在实际项目中，这三种技能会以重叠组合的方式分布在不同的个体身上。关键是让这三种技能集都足够充分地汇聚在一起，以确保模型构建正确。将一位优秀分析师与一位优秀建模者配对，并让他们能够接触到至少一位领域专家，通常会取得最佳效果。\n\
  \n### 高效地输入和编辑模型\n\n在模型开发过程中，理想的做法是将它们输入到图形编辑器中。编辑器将非图形化的模型信息存储在存储库中。为了使模型信息能够以有用的方式提供给下游工具（例如代码生成工具），存储库的设计应基于\
  \ `xUML` 元模型。\n\n那么，画框框和箭头能有多难呢？根据目前市面上的模型编辑工具来看，结果出人意料地困难且痛苦。要想理解我们的意思，不妨将输入和编辑图形模型的任务与你最喜欢的编辑器里编写代码的任务比较一下。如今的程序员对代码编辑器期望很高。自动补全、重构、展开/折叠、搜索/替换、文档查找、语法检查、关键字高亮和可视化差异等功能，使程序员能够在一个庞大而复杂的代码库中敏捷地操作。程序员所体验的生产力，与使用图形编辑器的建模者完全不在一个量级上。\n\
  \n比如，比较一下文本布局和图形布局。程序员可以毫不费力地进行缩进、闭合花括号、展开和折叠函数块；而建模者却只能笨拙地拖动矩形和箭头，努力点击连接点，并将文本标签向左或向右移动几个像素。光是看着一个大模型被重新排列，你就会得腕管综合征。\n\
  \n公平地说，一些图形编辑器减轻了部分调整像素的苦差事，并执行了不同程度的自动布局。不幸的是，几何算法仍然相当简单，导致布局笨拙。这听起来可能像是在吹毛求疵，但几何布局对有经验的建模者来说，其重要性丝毫不亚于文本布局对程序员的重要性。想象一下，如果程序员面对一个缩进和换行规则怪异、左右括号随意散落的编辑器，该是何等愤怒。有经验的程序员非常注重代码的组织方式。有经验的建模者也不例外。\n\
  \n与翻译更相关的是非图形化模型数据的存储。许多工具将这些信息存储在使用某种交换格式的文件中，或者存储在数据库中，或者两者兼有。我们关心的是数据的组织方式。理想情况下，数据库的组织结构或文件格式的定义应该直接源自对可执行语言（元模型）的建模。我们使用的语言是\
  \ `xUML`。大多数模型编辑器使用的是 `UML` 标准，它带来了许多我们并不需要的东西。有一个用于模型交换的标准叫做 `XMI`。但同样，它的目的是支持完整的\
  \ `UML` 标准，因此充满了大量我们不需要的内容。我们更倾向于将模型级数据置于一种我们可以直接操作的常用实现形式中，例如关系数据库的实例集。我们真正需要的是一个使用\
  \ `xUML` 元模型作为模型存储基础的工具。\n\n与此同时，建模者该怎么办呢？这完全取决于你是采用类似 `pycca` 的方法，还是使用一个全面的绘图工具/翻译环境。在\
  \ `pycca` 的情况下，你无论如何都要手动编码你的翻译决策。这里你需要一个模型编辑器，它能让你很好地指定 `xUML` 元素，比如关联上的动词短语、标识符和引用属性标签。你需要的是一个不会过于自作聪明、也不会阻止你按自己期望的方式来绘制模型的工具。`Umlet`、`OmniGraffle`、`Visio`\
  \ 和 `DrawExpress` 是一些可选方案。这些工具都不存储任何模型语义，但如果你要手动转为文本，这也没关系。另一方面，如果你使用的是像 `BridgePoint`\
  \ 这样的工具，你就别无选择了。你必须忍受它自带的模型编辑器，无论它有多么缺陷和瑕疵。\n\n\n\n### 为模型编写有用的文档\n\n模型本身不会自述文档（代码也一样，尽管有些程序员声称并非如此）。它们确实以排除了实现方面的形式化方式暴露了应用逻辑。但这些逻辑背后的推理是什么？为什么这个类或属性是必要的？为什么关系`R3`在多端是无条件的？这些“为什么”需要被清晰地解答。\n\
  \n要使模型有用，它必须得到充分文档化。事实上，我们更进一步认为，好的模型描述比模型图形更重要。只有在描述中，才能解释模型的抽象基础。模型图形以信息密集的形式呈现模型，但这是通过使用类名、属性名和关系短语等助记符来实现的。模型中的名称使用常见的自然语言词汇，需要额外的解释才能赋予它们为构建模型主题精确词汇所需的含义。助记符的精确含义仅包含在描述中，这些描述需要文本和非正式图表。如果没有模型术语的精确含义，模型阅读者只会根据他们对模型图中使用的自然语言词汇的理解，将自己的概念套用到模型上。由于自然语言对精确含义非常依赖于上下文，混淆通常是最终结果。\n\
  \n有用的文档远不止于简短的文本描述。它还包括大量分析笔记、白板讨论的记录、非正式（非模型）草图、数学公式以及构建模型过程中开发的其他支持性技术笔记。没有真实世界的上下文，模型会迅速丧失其价值。如果没有包含、集成和维护充分的文档，那么一开始去建模就没什么意义了。\n\
  \n不幸的是，图形化模型编辑器倾向于为各种模型元素附加类似表单填写方式的插槽。这乍听起来很合理。但在实践中，这会导致模型文档质量降低。建模者往往会机械地填写这些插槽，而不考虑整体大局。项目开发规则常常强化这种倾向，要求像填宾果卡一样填满每个插槽，结果对内容漠不关心。描述往往只是复述图上已经显而易见的内容。根据我们的经验，非正式的非模型图表是优秀模型描述的关键要素。但大多数工具只支持或只接受文本。最后，人们很容易只看图表而忽略其背后的文档，或者删除模型元素时无意中丢弃大量描述文字。诚然，编写好的模型文档是项艰苦的工作，但它是长期知识库的基础；它是宝贵知识产权，对于培训项目团队成员至关重要，也是未来维护的基础。\n\
  \n思考一下实践中出现的两种处理代码文档的截然不同的方法是有帮助的。在一种方法中，文档以风格化的注释形式直接放入源代码文件中，并使用软件工具来提取和格式化文档。由唐纳德·克努斯引入的文学化编程概念则持相反观点。在文学化编程中，源代码被放入文档中，并使用软件工具从文档中提取和重组代码。这两种技术都可以用来生成良好的文档。我们更倾向于文学化编程方法，因为它为呈现顺序以及包含支持材料提供了更大的灵活性。本书补充材料中提供的详细示例就是文学化程序。\n\
  \n我们使用主要面向生成高质量文档的工具来开发我们的模型，并将模型图形作为该描述中的另一张图表导入。我们并非想暗示我们认为模型图形无用。它非常有用，但只有与模型描述中详细阐述的背景和抽象相结合时才能发挥作用。\n\
  \n\n\n## 指定领域映射\n\n在 `xUML` 中，领域图上两个领域之间的依赖关系被称为桥梁。箭头尾部的领域充当客户端角色，箭头指向的领域则充当服务角色。箭头的方向仅表示一个领域的存在是为了满足另一个领域的需求。例如，在第\
  \ 6 章的 ALS 领域图中，**润滑**领域需要某种与物理世界交互的方式，而这一需求由 **SIO** 领域来满足。\n\n领域图并未说明桥梁上交换哪些数据和交互。此外，一个领域的模型在设计时无需知晓其他领域的任何特定模型结构。这种领域级封装的概念是\
  \ `xUML` 中一个关键的组织原则。尽管如此，一个领域的某些模型元素会在每个连接的桥梁上拥有对应的元素。这些元素必须以某种方式映射在一起，同时避免任何一个领域内部因了解其他领域的模型内容而变得混乱。\n\
  \n我们演示的桥接技术基于显式调用外部实体上的操作。回顾第 6 章中的**润滑**领域，当一个`注射器`开始施加润滑剂时，它会显式调用 **SIO** 外部实体的`注入`操作。`开始注射`状态的活动清楚地表明，在模型执行的精确节点上，它将物理注射过程委托了出去。\n\
  \n在某些情况下，在模型动作语言中散布外部实体调用会削弱模型的意图，并阻碍其复用潜力。考虑第 6 章中的`储液罐`状态模型。每个状态活动都显式调用了`警报`外部实体，以反映`储液罐`的状态。这些动作的意图是标记`储液罐`的状态，并在关键边界条件（即当情况为`正常`或`储液罐`为`空`时）向领域内的其他实例发出信号。ALS\
  \ 系统需要在`储液罐`生命周期的这些关键节点发出警报，但`警报`实体的调用具有侵入性，且与`储液罐`类的本质无关。此外，什么情况值得触发警报也容易受到大量需求变更的影响。项目往往从“一切皆报警”的概念开始，最终却发现海量的信息无法转化为实际行动。\n\
  \n我们希望能在状态活动的动作语言之外，指定如何通知`警报`实体。我们想要表达的是：在`储液罐`类的`低`状态活动执行完毕后，应在`警报`实体上调用`设置润滑液位低`操作。`低`状态活动的动作语言将不再包含对`设置润滑液位低`的显式调用，翻译机制会根据我们的规范来安排对`警报`的调用。\n\
  \n这种类型的桥接安排称为**隐式桥接**。其理念与面向方面编程（AOP）的概念有很多共同之处。AOP 有一套完整的术语来描述这种方法，此处不予讨论。\n\n\
  隐式桥接旨在通过至少移除部分显式的外部实体交互，来降低领域之间的耦合度。通过在指定外部实体操作调用位置时提供一个间接层，**润滑**领域的复用潜力得以增强，因为对`警报`领域的依赖不再被显式编码在领域动作中。对`警报`操作的调用也可以应用于其他在构建时并未考虑任何警报概念的领域。\n\
  \n我们认为定义领域间显式或隐式桥梁的过程是相同的。标记、映射和填充桥梁仍然是必要的。不同之处在于，隐式桥接使用状态活动动作语言之外的手段来指定何时调用桥梁操作。指定桥梁操作的隐式方式也是相对于通用（元模型）实体来完成的。在此例中，我们指定了相对于状态转换的`警报`交互。其他模型级元素也是候选对象，例如创建或删除类实例，或发送信号事件。\n\
  \n遗憾的是，我们尚未看到有实质性的工具支持桥梁的映射和填充。显式桥梁操作是存在的，但我们未发现任何对隐式桥接的支持。这对模型翻译过程来说是一个尚未克服的重大复杂性。我们在第\
  \ 8 章中演示过，尽管缺乏完整的理论，但仅使用电子表格应用程序，仍有条不紊地处理桥接方法是可能的。\n\n\n\n## 填充模型实例\n\n在开发模型时，用真实实例来记录场景是很常见的做法。例如，第\
  \ 2 章中介绍的空中交通管制员示意图，或第 6 章中展示的润滑配置图，都是非常典型的例子。\n\n一旦模型的某次迭代完成，为其构建初始实例集就很有帮助。实际上，你通常会为不同的场景创建多个实例集。在\
  \ ALS 示例中，你可以先创建一两个用于测试的实例集，然后再创建两三个用于预期的真实 ALS 配置。通过精心选择影响活动执行路径的属性数据值，可以构建出能强制追踪到更广泛执行路径的测试实例集，这比直接用于部署的实例集效果更好。\n\
  \n工具往往侧重于模型的开发，而将实例集视为事后补充。很少有工具能提供完善的功能来指定初始实例集。我们再次建议：将实例集放在电子表格中。我们之前展示的示例只有少量初始实例。当初始实例数量很少时，几乎任何处理策略都能奏效。然而，随着数量的增长，管理这些实例集就变得越来越困难。\n\
  \n我们认为，初始实例集应完全由模型类的属性值来定义。在我们的示例中，所有模型级别的初始实例集描述都是通过将类视为一个表格，并将实例指定为值行的形式来完成的。相比之下，我们不喜欢那种需要通过编写动作语言来显式创建类实例并赋值的方式。这种方法不仅繁琐且容易出错，扩展性也不好。更糟的是，由于许多属性被赋予相同的值，很容易让人忍不住使用动作语言变量来保存重复的值。这些变量的值在运行时会发生改变，与显式的属性值不同，它们很难通过简单的检查进行验证。\n\
  \n动作语言方式的另一个问题是，它排除了非建模人员提供初始化数据的可能性。设想一个电力公用事业控制系统，它需要大量数据来描述输电线路、变电站、变压器以及其他配电设备。控制系统将利用输电规范数据所隐含的连接关系来路由和管理电力分配。负责更新和管理配电网拓扑结构的公用事业工作人员，也是获取正确实例集数值的主要来源。在这种规模下，数据库管理系统至关重要，因此翻译工具要么直接读取数据库中的初始实例集数据，要么至少提供一个接口，使得数据库的查询结果可以作为领域模型的初始实例集。\n\
  \n对于中等规模的实例集，设计一种领域特定语言（DSL）有助于解决实例管理问题。在 SIO 领域示例中，初始实例集包含了各类的 50 个实例，用于指定 11 个\
  \ I/O 点的属性。直接指定这些属性值并不是一项繁重的任务，因为实例集很小。\n\n但想象一个包含 100 个 I/O 点的场景（即使对于基于微控制器的系统来说，这个数字也不算过大）。为大约\
  \ 500 个类实例的所有属性指定数值，现在就成了一项艰巨的任务。为了减少直接填充类实例所需的专业知识量，我们可以构建一个类似如下的 DSL：\n\n```\n\
  population SIO test_population_1 {\nContinuous_Input_Point inj1_pressure {\ngroup\
  \ pressure_group\nthresholds {\nmax_pressure\ninh4_pressure\n}\nscale ihn4_scaling\n\
  }\nConversion_Group  pressure_group {\nperiod 500 ms\nconverter main_converter\n\
  }\nPoint_Threshold max_pressure {\ndirection rising\nlimit 20 MPa\nsuccessive_over\
  \ 2\nsuccessive_under 3\n}\nPoint_Scale ihn4_scaling {\nmultiply 100\ndivide 27\n\
  intercept 100\n}\n# ... 以及其他类似风格的声明\n}\n```\n\n这类语言本质上应该是声明式的，并且要尽量减少指定属性值时所需了解的类模型知识。在这个例子中，通过关注叶子子类的属性，隐藏了模型中存在多个泛化关系的事实。与动作语言不同，这里没有执行顺序。不使用变量，语言处理的输出直接作为翻译机制的输入。这种实例集语言通常更适合于可重用性较高的服务领域，而不太适合那些主题与特定应用紧密相关的领域。我们推荐“三次法则”：当某个领域被第三次复用时，停下来，投入一些精力让这次复用更高效。\n\
  \n尽管构建 DSL 并非一项浩大的工程，但项目团队必须判断这项投入是否值得。有许多工具可以用来构建像这样的小型语言处理器。DSL 程序可以定义语法，然后利用成熟的词法和语法生成器技术来构成处理的核心。或者，也可以使用\
  \ Tcl 或 Python 等动态脚本语言来构建 DSL（有时称为内部 DSL），然后直接使用脚本语言本身的解析器来解析该 DSL。在软件领域，使用基于语言的方法来解决应用配置问题有着悠久的传统，现有技术完全可以用于指定初始实例集。\n\
  \n\n\n## 填充领域映射\n\n构成桥接实现基础的领域间映射关系的填充，可以在转换时（从模型生成代码时）、运行时或两者混合的方式进行。\n\n如果映射中涉及的模型元素在系统运行期间保持不变，则这些映射的填充在转换前就已指定。当初始实例群体确定后，即可填充映射表。第\
  \ 8 章中润滑领域与 SIO 领域之间的桥接映射就属于这种情况。例如，`Inject`和`Stop injecting`外部实体操作映射到 SIO 的`Write\
  \ Point`领域操作，这些 I/O 点被定义为初始实例群体的一部分，并且在系统运行期间保持不变。\n\n如果领域映射的模型元素在系统运行期间被创建或删除，则无法在转换前填充领域映射。此时，桥接代码将在运行时填充映射。桥接将包含一些操作，用于将客户端领域中模型元素的创建和删除映射到服务领域中的对应元素，并记录该映射以供后续使用。虽然映射表的标题仍然描述了需要收集和维护的信息，但无法在转换前指定表的值。桥接代码的实现通常更复杂，因为它必须知道模型元素创建和删除发生的时间，并使用更复杂的数据结构来处理半表本身的动态特性。\n\
  \n混合映射也可能出现。在这种情况下，部分映射填充在转换时已知，其余部分在运行时发生。这时，桥接代码的模式遵循动态情况，但可能从一个非空的半表群体开始，并在系统运行时进行扩充。\n\
  \n再次强调，我们在现有工具中未发现对此活动的实质性支持，因此建议使用电子表格作为一种简便易行的方法来输入和显示所需的映射数据。第 8 章的示例映射表可作为指南。对于较大的映射，基于电子表格理念的专用数据库应用程序也能良好运行。\n\
  \n填充领域映射时，需要管理三个数据集：\n\n- 来自客户端领域的模型元素群体\n- 来自服务领域的模型元素群体\n- 两个模型元素群体之间的映射\n\n涉及这么多要素，挑战在于你可能会发现事物并不完全匹配。向映射表中填充数据值是对群体和领域映射是否正确的最终检验。如果需要进行修订，无需惊讶。例如，你可能会发现客户端领域中的某个实例在服务领域中没有对应实例，因此必须调整服务领域的初始实例群体。你还可能发现，无法从客户端领域映射的元素中确定服务领域中实例的标识方式，从而可能需要调整领域映射本身。为了避免过多的意外，建议客户端和服务领域的建模者定期沟通。这种持续的沟通对于确保客户端领域赋予服务领域的假设和依赖关系得到充分考虑至关重要。随着模型的推进，对话可以扩展到确保存在适当的领域映射来实现所有依赖关系。\n\
  \n### 标记\n\n在转换之前，完整的平台无关模型迭代会使用平台特定特性进行标记。为了便于说明，可以想象标记过程是在模型上方覆盖一张透明薄片，并配备一盒装有不同颜色的标记笔。可用的特定颜色和标记笔数量取决于平台模型提供的特性。例如，某个平台模型可能希望你根据任何给定类的实例数量上限是\
  \ 1、10 还是 100 万来区分实例群体，以便选择合适的存储和访问机制。使用该平台模型提供的`max population`标记笔，你据此对类进行标记。但请注意，你并非直接标记类本身，因此才覆盖了透明薄片。这样，模型仍然保持平台无关。只有覆盖的薄片才带有标记。由于标记本身可以抽象为注解，因此可以存储在元模型中。事实上，同一组模型可以为每个潜在的目标平台进行不同的标记。只需更换标记薄片即可。\n\
  \n标记有两个关键挑战。必须有足够类型的标记可用，以便为转换调整模型。还必须有一种方法在不将其永久嵌入模型本身的情况下指定它们。\n\n现实中，我们并不使用标记笔或透明薄片，尽管在某些模型编辑环境中，它们作为一种用户界面设计隐喻可能仍然不错。实际上，可能只有一个文本文件，为每种标记类型提供一个关键字，并列出受影响的模型元素列表。在\
  \ pycca 方法中，标记特性被混入用于指定设计的 DSL 中。虽然对特定模型的标记会被解释以创建平台特定的实现，但它们只是一种可以存储在元模型中的特定类型的注解。\n\
  \n需要注意确保标记引用模型元素，但永远不会永久混入模型本身。这与从模型生成代码的细化风格形成鲜明对比，后者在细化过程中将实现工件不加区分地混入模型。这种风格在交付系统的过程中不必要地破坏了平台无关性。\n\
  \n\n\n## xUML 元模型\n\n现在我们向下移动，越过平台无关部分，来审视 xUML 元模型。元模型不过是一个普通模型，其描述的主题恰好是建模语言本身。我们的空中交通管制领域模型包含了诸如\
  \ `Duty Station`（值班站）、`Air Traffic Controller`（空中交通管制员）和 `Control Zone`（管制区）等类，而一个\
  \ xUML 模型则会包含诸如 `Class`（类）、`Association`（关联）、`Attribute`（属性）、`State`（状态）等类。\n\n\
  元模型充当了其所建模语言的形式化定义。因此，xUML 元模型将作为 xUML 语言的最终定义。*《可执行 UML：模型驱动架构的基础》* 对 xUML 进行了出色的非正式描述，它应作为\
  \ xUML 元模型的关键输入。与任何主题一样，建模语言非正式描述中的任何歧义、不一致或不完整之处，都应通过完成的元模型来解决。\n\n纯粹出于趣味，我们假设存在这样一个\
  \ xUML 模型。以下是你使用它的方法。\n\n想象一下，你基于这样一个元模型构建了一个数据库模式。假设该数据库完美地实施了元模型中定义的所有约束。现在，假设你已经构建了一个应用模型，比如说空中交通管制应用。你应该能够将你的应用模型填充到元模型数据库中。例如，你将创建\
  \ `Class` 的实例：`Air Traffic Controller`、`Control Zone`、`Duty Station` 等等。然后，继续创建\
  \ `State`、`Transition`、`Attribute` 等实例，直到你的整个 ATC 领域在元模型中被实例化。\n\n如果你发现无法在不触发错误的情况下填充元模型数据库，你就会知道你的模型是不正确的。（这里我们假设了一个完美的元模型数据库实现）。例如，xUML\
  \ 要求每个从某个状态出发的转换都必须有不同的*事件规范*。因此，如果你已经为从状态 X 出发、由事件 A 触发的转换插入了一个条目，然后你尝试定义另一个从 X\
  \ 出发、由相同事件 A 触发的转换，你应该会收到一个错误，并且编辑操作应该会失败。\n\n这意味着，如果一个模型被成功录入到 xUML 元模型数据库中，那么它在语言上是正确的。该模型可能存在运行时问题或不完整，但至少它没有违反任何建模语言规则。因此，对于一套应用\
  \ xUML 模型而言，元模型所扮演的角色与编程语言文法相同，而元模型模式填充器则扮演着解析器的角色。\n\n因为元模型还应捕获实例和实例值信息，所以你不仅应该能够录入你的模型，还应该能够录入模型的实例化数据。以\
  \ ATC 模型为例，你可以为同一个领域模型录入一个实例化数据集（或者，实际上是多个实例化数据集）。\n\n你还可以使用元模型来设计一种 DSL，用于将模型及其实例化数据存储在文本文件中。例如，每个元模型元素都可能对应一个\
  \ DSL 语句。\n\n因此，该模型作为建模语言的形式化定义，可用作设计任何模型仓库或模型文件格式的参考。这也意味着，任何下游的翻译或模型处理工具都应该能够处理所有可以插入到元模型数据库中的结构。\n\
  \n现在来说说不好的消息。目前（据我们所知）还没有一个完整的 xUML 元模型存在。好的一面是，已经有许多部分的元模型，我们预计一个完整的元模型应该会在不久的将来面世。缺乏一个完整且被公认的\
  \ xUML 元模型并没有阻止我们拥有翻译工具。但如果能解决这个问题，那当然很好。\n\n过去，已经建立了一些针对特定工具的元模型。例如，一个名为 BridgePoint\
  \ 的开源 xUML 工具就是围绕一个 xUML 元模型构建的。不幸的是，它已经在 *《可执行 UML》* 所描述的 xUML 基础上进行了修改，以支持各种特定工具的功能。它被称为\
  \ xtUML。另一个基于工具的元模型称为 iUML，它与 xUML 定义也存在相当大的差异。\n\n我们的努力成果被命名为 miUML。这个元模型的意图是开源且尽可能独立于工具，重点关注可执行\
  \ UML 及其起源的 Shlaer-Mellor 方法学。它还致力于建立在坚实的关系理论基础之上，并拥有一个用于属性的正交类型系统。它已经部分地通过关系数据库模式和在\
  \ Postgres 中的编辑功能实现了。此外，这些模型都经过了详尽的文档化，供你阅读参考。你可以从 [`www.executableuml.org`](http://www.executableuml.org)\
  \ 下载它。在撰写本文时，该模型在多态性和数据类型方面还不完整。但是，它对标识符和引用属性有强大的约束。\n\nOMG 的 UML 标准发布了一个 UML 元模型。由于以下原因，它在\
  \ xUML 的背景下用处不大。xUML 使用了 UML 表示法的一个子集。xUML 建立在关系基础上，并对标识符和引用属性的使用有特殊规则。xUML 拥有内置的可执行语义，而更大的\
  \ UML 则缺乏这一点。UML 确实定义了一个名为基础 UML（fUML）的框架，用于定义可执行的 UML。目前，尚未尝试为 xUML 开发 fUML 定义。这或许可能实现，但尚不清楚是否值得付出努力。\n\
  \n除了拥有一个共识的元模型外，拥有共识的元模型实现表示也同样重要。为了实现工具无关性并支持更模块化的方法，需要存在具体且易于访问的实现基础设施，用于填充和查询元模型。我们之前提到过的一种方法是使用关系数据库管理系统。这些系统通常使用\
  \ SQL 进行查询，从而允许进行临时的即席查询，这对于有效利用元模型结构是必要的。不幸的是，SQL 存在许多供应商特定的方言，根据底层数据库系统的不同，我们面临着必须支持多种表示方式的局面。也可以使用其他交换表示形式，例如\
  \ XML 或 JSON。关键点在于，该表示必须完全覆盖元模型的所有方面，并提供一个方便的起点，使得建模工具的实现可以访问元模型的实例化数据。\n\n\n\n\
  ## xUML 语言\n\n在探讨挑战这个话题时，我们需要讨论几个围绕建模语言本身的问题。\n\n我们选择 xUML 有几个原因。主要原因在于它被设计用于支持在尽可能广泛的平台上进行模型转换：从云分布式平台到紧密嵌入式平台，无所不包。这意味着用\
  \ xUML 构建的模型可以被广泛复用。该语言的数据和执行规则基于关系数据理论、有限状态自动机和数据流执行，而非面向对象的基础。它并不预设目标编程语言必须面向对象，尽管也绝无任何阻止或妨碍此类实现的意图。该语言的设计力求精简。它没有大量复杂的规则和模型元素，而是只提供少量可战略性组合的构建块，以应对现实世界中相当复杂的场景。这在很大程度上同样是其数学基础带来的结果。这种特性有双重好处。从分析角度来看，语言简洁意味着建模工件会退居幕后，将重点放在被建模的主题领域上。如果建模符号本身因其自身的复杂性而干扰思考，就很难发现应用逻辑中的细微缺陷。从执行和转换角度来看，运行模型和生成代码也更容易，因为需要实现的元素和规则很少。此外，更容易设计出能够保证模型执行规则在各种具有挑战性的平台上正常工作的模型执行平台。\n\
  \n但如果你是从面向对象编程的角度切入，正如大多数更广泛的 UML 实践那样，你会发现 xUML 的某些方面有点陌生。例如，没有隐藏的标识符和对象链接。数据只是以一种强制执行实例间连接性的方式进行组织。\n\
  \n并且，它不依赖像对象管理组（OMG）的对象约束语言（OCL）这样的独立语言来表达约束，而是将约束直接构建到类和关系数据中。通过将半导体`晶圆`上的一个`芯片`的标识符声明为`网格位置{I}\
  \ + 晶圆{I, R}`，我们实际上已经声明了不能在同一个`晶圆`上同一个网格位置存在两个`芯片`。标识符和引用属性可以以多种方式组合，形成一组声明式模型约束，而无需生成额外的“检查约束”代码。这些内置机制涵盖了大部分约束情况，少数例外情况可通过轻量级注释处理。实际上，我们认为\
  \ OCL 是面向对象编程语言缺乏内在约束的产物，它通过在谓词逻辑上构建语法包装来填补这一空白。遗憾的是，如此多的 OCL 使用示例都基于糟糕的模型，这反而凸显了我们需要更好的建模来捕获问题逻辑，而非仅仅依赖显式约束。\n\
  \n不幸的是，目前还没有官方且广泛接受的标准来定义 xUML。我们最好的参考是一个非正式标准，由多份白皮书和《可执行 UML 书》组成，这些白皮书描述了 xUML\
  \ 的前身——Shlaer-Mellor 方法。这对分析人员/建模者来说是一个很好的指南，但在构建模型执行平台和转换工具方面，它留下了一定的解释空间。当然，这正是前面提到的元模型填补空白的地方。\n\
  \n幸运的是，这种建模语言足够简单，以至于在 Shlaer-Mellor、xUML 社群中，对于其大部分类和状态建模特性已达成普遍共识。然而，在如何对活动进行建模方面，存在一些差异。\n\
  \n### 动作语言\n\n指定算法计算的方式是转换工作流中更具挑战性的领域之一。动作语言的语法和语义涉及许多权衡。因为编写动作语言表面上看起来像是编写程序代码，而且作为程序员，我们对如何最好地编写程序代码有明确的看法，所以动作语言语法很容易受到程序员个人偏好的极端影响。\n\
  \n但我们不认为编写动作语言是通常意义上的编码。编码旨在让计算机以特定方式运行以达到预期结果。相比之下，动作语言旨在指定领域模型的算法处理过程，而不考虑实现技术方面的因素。模型活动所做的大部分工作都直接与模型级概念相关，例如信号事件、导航关系和更新属性。因此，我们不认为它是程序代码的更高层次的抽象版本，而是对模型执行规则形式体系所提供操作的一种详细规范。显然，动作语言必须能够转换为程序代码。但我们认为这种转换是由映射函数指导的、非连续的操作，而不是一个逐渐将动作语言语句细化到某种更低层次抽象的过程。\n\
  \n换句话说，先用自然语言编写模糊的动作，然后插入越来越多的类似代码的片段来将其收紧，以此作为接近实现的手段——这种概念与我们的方法背道而驰。就像牙菌斑会腐蚀你的牙齿一样确定无疑，细化过程会侵蚀领域模型的平台独立性，直到它既不是一个好模型，也不是一个好的实现。相反，我们的目标是将模型级操作映射到目标编程语言（无论是面向对象、函数式、脚本语言还是其他语言）的任何适当的结构和惯用法上。\n\
  \n已经有几种与 xUML 一致的动作语言被定义出来，但由于算法表达方式的多样性，我们在语法上几乎看不到趋同。例如，BridgePoint (xtUML) 对象动作语言\
  \ (OAL) 和 iUML 的动作规范语言 (ASL) 的语义与我们的方法紧密匹配，并且已有可工作的实现。其他动作语言也被提出过，例如 Shlaer-Mellor\
  \ 动作语言 (Small) 和 Starr 的简洁关系动作语言 (Scrall)。参见 [`www.executableuml.org`](http://www.executableuml.org)\
  \ 以获取与 xUML 兼容的动作语言的链接，但这些语言尚未有可用于生产的转换器。\n\n在更广泛的层面上，Alf（基础 UML 动作语言）已被确立为通用 UML\
  \ 标准。我们认为 Alf 不适合我们的方法，因为它涵盖了传统的 UML 语义，并承载了 UML 所基于的面向对象编程语言结构的负担。例如，我们认为 Alf 中用于命名空间、公有/私有声明、集合数据类型、继承等的结构是实现概念。在我们的平台无关语境中，这些结构对于指定应用逻辑的模型级处理来说，带来的更多是混乱而非清晰。\n\
  \n\n\n### 动作语言的理想特性\n\n要真正实现平台无关性，模型不应指定特定的计算顺序，除非该顺序必须在每个潜在目标平台上强制执行。以下是一个任意计算顺序的示例：\n\
  \n```\ny = scale(x)\nz = filter(i1, i2, ... in)\nresult = y + z\n```\n\n根据具体实现，动作\
  \ 1 和动作 2 的顺序可以互换或并行执行。而动作 3 必须等待动作 1 和动作 2 都完成后才能执行。如果上面书写的动作顺序意在表明某种必须的计算顺序，那么该模型就会不必要地限制实现方式的选择。这违背了“模型只需指定所有潜在平台上必须满足的要求”这一原则。违背这一原则，会降低模型的可信度。“模型中还有哪些内容是我可以忽略的？”实现者现在就会开始这么想！\n\
  \n请参考图 11-3。\n\n![A421575_1_En_11_Fig3_HTML.gif](img/A421575_1_En_11_Fig3_HTML.gif)\n\
  \n图 11-3. 数据流表示中不存在任意顺序\n\n每个动作都用一个圆圈表示，我们认为每个动作在其所有输入都可用时即可执行。因此，动作 3 必须等待动作 1\
  \ 和动作 2 都产生输出后才能执行。这种数据流视图下的计算方式消除了任意顺序的表述。正因如此，数据流是我们看待`xUML`中算法处理的基本视角。\n\n遗憾的是，文本表示形式比数据流的图形表示形式更易于快速编辑。在第\
  \ 2 章中，我们展示了空中交通管制模型中“登录”活动的数据流图。由于处理数据流图形和规范数据流过程存在困难，我们所知的所有转换方案都使用基于文本的语言来指定活动。\n\
  \n使用基于文本的动作语言并不妨碍该语言具备数据流语义。早期的动作语言尝试，例如`Small`，采用了类似 UNIX 管道的语法来表示数据流。`Small`中的简单动作如下所示：\n\
  \n```\nx | scale > ∼y\nInput(all).i | filter > ∼z\n(∼y, ∼z) | sum\n```\n\n随后可以通过处理这些文本来生成数据流表示，作为代码生成过程的输入。\n\
  \n事实上，如果理解到数据流分析会确定实现的执行顺序，那么最初采用步骤 1-3 的逐步文本表述方式也是可以接受的。关键在于，在进行转换之前，需要有足够的信息来构建一个中间的数据流表示。\n\
  \n遗憾的是，构建一个能够真正利用这种细粒度并发的`MX`域并非易事。编写能够处理并发、并将其映射到可用处理器上以实现并行执行而不造成混乱的代码是一个难题。随着编程语言对这类细粒度并行性的支持逐渐成熟（例如[Go](http://www.go-lang.org/)），我们希望模型执行中固有的并发性能够更好地被利用，转化为实际的并行执行。\n\
  \n面向对象以及其他常见的编程习惯会在动作语言语法中引入更多实现上的偏见。大多数动作语言都模仿编程语言设计，并且从未完全摆脱其根源。由于静态类型、通常是面向对象的语言是最常见的转换目标，大多数动作语言在其设计中都带有这些编程语言的明显痕迹。例如，使用对象在内存中的地址作为实现生成的标识符就很常见。实例引用本质上就是一种经过伪装的指针，遗憾的是，这会促使建模者按照这些术语来思考。\n\
  \n将实例引用集合与单个实例引用进行不必要的区分，就好像集合无法包含单个成员一样。我们怀疑，这种差异更多与大多数编程语言在语言提供的简单变量中保存单个指针值的便利性有关，而保存指针集合则需要成本更高的实现结构。转换机制本身，根据实例选择的性质，就能知道结果可能包含多个实例。因此，转换机制应负责选择最优机制来保存结果，而不是将这一决策强加给建模者。在某些情况下，实例选择的结果必须限制为少于完整的选择集——例如，从一组相同的实例中选择任意一个实例，或者根据排序条件将选择结果限制为特定数量。但这些操作限制了所选集合的基数，其结果仍然是一个集合。限制操作并不指定存储结果的特定方式。\n\
  \n动作语言需要对类实例进行过度的显式迭代，这证明了命令式编程语言构造的残留影响。在`xUML`中，一个类的实例构成一个集合，因此“一次操作一整个集合”将是显式迭代的理想替代方案。例如，要对商店中的商品进行百分比折扣，我们更倾向于这样表述：\n\
  \n```\nItem().Price *= percentDiscount // (). 选择所有实例\n```\n\n而不是更常见的写法：\n\n```\n\
  items := select all instances of Item\nforeach i in items {\n    i.Price := i.Price\
  \ * percentDiscount\n}\n```\n\n或者更糟的写法：\n\n```\nitems := select all instances of\
  \ Item\nfor count ranging 1..items.count() {          // 假设索引从 1 开始\n    item[count].Price\
  \ = item[count].Price * percentDiscount\n}\n```\n\n模型级别的动作可以应用于集合。考虑针对某种型号的鱼雷发送召回信号。同样，我们希望这样表述：\n\
  \n```\n// 向每个具有给定设计规格的鱼雷发送召回事件\nRecall -> Torpedo( Spec:specToRecall )\n```\n\n\
  相比之下，如下写法：\n\n```\ntorpsToRecall := select many from Torpedo where (Spec == specToRecall)\n\
  foreach torp in torpsToRecall {\n    signal Recall to torp\n}\n```\n\n允许在创建实例时不为其每个属性设置值，是另一种实现思路侵入动作语言的例子。允许属性在创建时不被赋值，源于这样一种假设：实例是从内存池或堆中分配的一块内存区域。这是一种不可靠的安排，因为活动中不同的执行路径可能会导致一个或多个属性未被初始化，从而包含实例内存中可能已有的随机位模式。动作语言不应假设实例数据存储在内存中。`MX`域可以选择任何满足目标应用程序类需求的数据管理方法，例如关系数据库管理系统（RDMS）、键值对数据库、平面文件，甚至是\
  \ EEPROM。\n\n要保持动作语言的可执行性，同时又不带入任何实现假设或偏见，唯一的方法就是将其建立在数学基础之上。[关系代数](https://en.wikipedia.org/wiki/Relational_algebra)是数学的一个分支，它扩展自集合论、函数和谓词逻辑，可以作为动作语言操作的基础。\n\
  \n\n\n## 行为语言设计考量\n\n我们不建议将行为编写为纯粹的关系代数或谓词逻辑表达式。相反，行为语言中对类实例的操作应可从关系代数推导得出，并提供能够清晰表达模型级执行概念的操作。在此基础上，翻译机制可以将这些操作转换为与\
  \ MX 领域提供的数据管理服务集成的编程结构。一个精简且正交的行为语言操作基础，可以更轻松地实现对各种其他数据管理技术的转换。\n\n应用程序模型需要一种方式来表达和处理现实世界的数据，例如压力、温度、视频图像、地理坐标、股票价格等。但大多数行为语言除了基本的、受支持的系统类型或与类结构匹配的类型外，并不承认其他值类型。这排除了可能由两个类的联接组成的值。例如，如果我们希望获得鱼雷发射类型的报告，大多数行为语言会迫使我们采用笨拙的结构，例如：\n\
  \n```\ntorps := select all instances of Torpedo\nforeach thisTorp in torps {\n \
  \   itsSpec := select Torpedo Spec related to torp across R5\n    UI.REPORT(torpedo\
  \ : thisTorp.Torpedo ID, type: itsSpec.Launch Type)\n}\n```\n\n我们必须通过导航关联来计算联接，而不是这样：\n\
  \n```\nUI.REPORT( Torpedo().(ID, /R5/Torpedo Spec.Launch Type) )\n// 联接是隐含的\n```\n\
  \n或者这样：\n\n```\nUI.REPORT( Torpedo join R5 Torpedo Spec.(ID, Launch Type) )\n```\n\
  \n事实上，关系理论允许一个值具有任意复杂度的类型。对于任何给定的数据结构，建模者必须决定暴露该结构是有助于领域分析还是会分散注意力。\n\n例如，考虑一个追踪地理边界的领域。当然，会需要某种二维的\
  \ `Point` 类型。你需要将 `Point` 作为类的属性来存储。`Point` 是二维向量的表示。二维向量的代数运算是众所周知的，领域活动需要能够进行点的加法、点与标量值的乘法以及确定两点之间的距离。行为语言应该支持\
  \ `Point` 数据类型及其代数运算。用户定义类型的代数运算应完全集成到行为语言语法中。\n\n用户数据类型的任何内部组件的封装都至关重要。即使我们需要获取一个\
  \ `Point` 的组件值，我们也不应该知道这些组件在内部是如何表示的。我们可能会选择用笛卡尔坐标来保存这个二维点。然而，如果应用程序中具有显著的圆对称性，那么使用极坐标将是实现\
  \ `Point` 操作的更好选择。这两种表示是等价的，并且可以相互转换。\n\n我们需要能够在行为语言之外定义用户类型将如何实现。我们不希望被迫将 `Point`\
  \ 类型属性定义为两个标量数值属性，并且必须向模型暴露对这两个属性进行操作的细节。这对于分析一个以地理边界为主题领域的分析毫无帮助。我们也不认为数据类型操作应定义为外部实体操作。仅仅为了完成抽象数据类型操作而将外部实体调用散布到领域活动中，会因行为语言的混乱而加剧用户定义数据类型支持的缺乏。\n\
  \n此外，我们可能根本不想在 `Point` 类型上实现代数运算。我们宁愿调用一个比我们用行为语言编写的代码更好、测试更充分的现有库。当考虑更大的代数结构（例如矩阵代数）时，用户定义数据类型支持的缺乏会变得更加棘手，而处理三维图形的领域则需要这些代数结构。\n\
  \n## 翻译考量\n\n回顾翻译工作流程，我们从元模型向下逐层工作并生成代码。参考翻译工作流程将模型代码的生成描述为一个两步过程。首先，填充后的元模型被转换为填充后的平台模型。其次，填充后的平台模型被转换为模型代码。从填充后的元模型生成模型代码可以通过单步完成，许多翻译方案也是以这种方式运作的。我们更倾向于采用两步转换，因为它提供了额外的灵活性。暴露一个独立的平台模型还允许密切检查该模型对应用程序平台需求的契合程度：\n\
  \n-   平台模型最依赖于应用程序的类别，以及这些应用程序对运行它们所依赖的计算技术提出的要求。我们希望看到平台模型的发展，这些模型能够考虑不同的机制来管理领域数据、执行并发性，以及模型执行规则如何由适用于特定应用程序类别的实现技术来实现的其他关键方面。\n\
  -   代码生成最依赖于所选的实现语言和 MX 领域运行时函数的接口细节。\n\n我们的推测是，将模型代码生成分离为两个步骤将有助于模块化方法，并且更容易支持模型执行规则的不同实现机制以及更多种类的实现语言。我们没有直接证据支持这一推测。然而，对于传统的计算机语言编译器，根据机器描述自动生成代码生成器是一种成熟的技术。通过与语言编译器类比，我们认为这样的想法可能适用于基于平台模型特征的描述来自动生成从平台模型填充到实现语言代码的转换。我们认为，将元模型填充到平台模型填充的转换与从平台模型填充生成模型代码分离为一个独立的阶段，将为尝试这种方法提供灵活性。这显然是一个需要进一步研究的课题。\n\
  \n不幸的是，在整个工作流程中增加步骤会增加模型与可执行代码之间进行追溯的难度。当建模并翻译后的程序在执行中出现问题时，向上穿越转换的各个层次进行回溯可能会非常费力。通常，如果没有额外信息，从代码到模型的转换是不可逆的。传统的语言编译器通过记录关于生成代码如何与程序源文件和符号相关联的调试信息来实现这一功能。这种向后追溯的能力是可取的，但无论是在翻译处理过程中记录信息，还是拥有一个程序来解释这些信息，都难以实现。\n\
  \n即使是成熟的技术有时也会失效。例如，C 语言支持在源代码中添加 `#line` 指令，以指示该代码源自不同于正在编译的文件。Pycca 支持添加这些指令，以便错误消息和源码调试可以引用最终的\
  \ pycca 源文件（称之为 `sio.pycca`），而不是生成的 C 文件。但有时源码级调试器，特别是用于微控制器的调试器，不承认 C 源代码可能包含在一个不以\
  \ `.c` 后缀结尾的文件中。\n\n\n\n将执行追踪嵌入生成的代码可以在某些情况下有所帮助。这对于追踪状态机调度信息尤其有用。追踪其他方面（例如方法调用）有时也是可行的。不幸的是，在运行时输出追踪信息会侵入式地影响程序的执行速度和体积。如果为了部署而移除追踪（通常情况下必须这么做），那么我们仍然面临如何处理部署后出现的执行错误追踪问题。虽然这个问题可以通过特定的工具链解决，但我们并未看到更通用的解决方案。\n\
  \n## Pycca 工作流\n\n刚才描述的参考工作流代表了理想情况。相比之下，图 11-4 所示的 pycca 翻译工作流则不那么理想，但它是一个可行的解决方案，能为特定类别的平台和应用程序生成真实代码。该软件是开源的，你现在就可以下载并使用它。实际上，我们预计你需要花点时间阅读在线文档、配置环境、研究在线示例并进行一些实验。所以，你也许明天就能用上它。但你所需的一切，实际上现在都已具备。\n\
  \n![A421575_1_En_11_Fig4_HTML.jpg](img/A421575_1_En_11_Fig4_HTML.jpg)\n\n图 11-4.\
  \ 使用 pycca 的翻译工作流\n\npycca 的翻译始于一个或多个已完成且具有完全指定领域桥接的领域模型。这至少包括模型的全部三个方面：\n\n*  \
  \ 领域数据的类模型，包括类、属性、关系和数据类型的完整描述。\n*   一个初始实例填充。\n*   所有活动类的状态模型，以图表和表两种形式表示。\n* \
  \  所有领域活动的动作语言，包括状态活动、任何类方法或领域操作。你可以使用伪代码，但它必须涵盖所有模型级动作，并完全指定所有算法计算。\n*   如果领域定义了任何外部实体，则还必须提供桥接标记和映射。\n\
  \n对于参考工作流，我们假设转换是以编程方式进行的。转换程序将从元模型填充中提取必要信息。举个例子，考虑关于如何实现关联导航必须做出的决策。关联的多重性直接从其定义中确定。通过解析活动的动作语言并遍历抽象语法树（AST），我们可以检查对关联执行的操作。这将告诉我们，在运行时，关联的实例是否被创建或销毁。类似地，分析领域活动的\
  \ AST 可以确定关联是否在双向进行导航。这些信息可以被记录下来，并用于做出关于如何组织类数据以支持关联导航的编程决策。\n\n### 翻译中的人力角色\n\n\
  对于 pycca 工作流，需要人工干预。模型工件可以以任何格式或媒介存在，因为它们都将被手动处理。例如，状态表和实例填充可以输入到电子表格中。类模型可以用你喜欢的任何工具绘制。\n\
  \n人类翻译员必须执行三项任务：\n\n*   分析模型，决定如何将模型级构造映射到 pycca 提供的实现构造上。映射模型级构造所涉及的决定在第 3 章中已讨论。Pycca\
  \ 提供了一组关于如何实现模型级构造的选择。例如，关联链接的配置基于多重性、关联的动态特性以及关联是否在特定方向上被导航。只需要为动作语言实际导航的那些路径包含支持关系导航的引用。通常，两个方向都不需要。某些属性将被省略。例如，仅用于标识目的且未被动作语言引用的属性，无需包含在实现类中，因为\
  \ `pycca` 的模型执行域使用特定于平台的标识符（内存中类实例的地址）。所有这些信息都可以通过阅读动作语言并为每个被读取或更新的属性在模型图表上做标注，同时记录每个关系的导航方向来获取。\n\
  *   将模型结构转录到 pycca DSL 中。在第 4 章中，我们展示了空中交通管制模型的翻译。模型的三个方面在 pycca DSL 中都有对应关系。状态模型在\
  \ pycca 中有最直接的表示，并且与状态转换矩阵中包含的信息高度对应。由于第一步中做出的翻译决定，pycca 类定义将与类模型上的类定义有所不同。在这里，你需要思考的是：何种\
  \ C 语言结构实现了建模类的模型级意图。在这三个方面中，状态活动需要最多的转换工作。有必要使用提供的 pycca 宏来执行模型级动作，从而将动作语言的语义公式化为\
  \ C 代码。动作语言到 C 的转换通常分为两类：模型级操作以及流程控制或计算。如果要转换模型级动作（例如信号事件，或选择与实例 y 相关的实例 x），请使用提供的宏。表达式求值和流程控制直接在\
  \ C 代码中表示。\n*   编写桥接代码。在第 8 章中，我们演示了如何进行桥接。完成领域映射后，必须编写数据结构和代码来实现领域映射的意图。在简单情况下，可以使用一个数组将一个域中的标识符映射到另一个域，以及一小段代码将控制权传递给目标域。Pycca\
  \ 提供了一个进入域的入口，可用于从域外部执行简单的模型级操作。通常，参与桥接的域会提供域操作来协助桥接过程。\n\n请注意，参考工作流中的标记任务缺失了。实际上，它被整合到了\
  \ pycca 脚本编写任务中。并没有独立的标记过程。在编写脚本时，人类翻译员会根据动作语言做出实现选择。\n\n\n\n我们的经验表明，由非领域分析者进行翻译，能使翻译成果显著提升。我们发现即使在更自动化的翻译方案中也是如此。这使项目团队能够实现专业化分工，让更擅长应用分析并对此更感兴趣的人员，与更擅长实现技术并对此更感兴趣的人员各司其职。如前所述，极少有人能同时在两种技能上达到精通。\n\
  \n即便同一个人承担多个角色，明确区分各个角色也能为每个角色涉及的思维过程划定界限。在这种情况下，“在框框内思考”的准则是一种非常宝贵的技能。将领域模型进行翻译的过程，是熟悉领域逻辑的理想方式，这是仅靠阅读分析材料无法达成的。采用结对编程的项目团队会发现，让领域分析师与领域翻译者结对工作，能够产出更高质量的成果，并使两位成员都对模型及其实现有更深刻的理解。\n\
  \n在生成的源代码上运行 `pycca`，会执行工作流程中所示的两个转换：填充平台模型，并根据填充后的平台模型生成代码。我们在前一章讨论了 `pycca` 平台模型，并简要概述了\
  \ `pycca` 所执行的处理。`pycca` 的处理会生成 C 代码文件，这些文件随后可与桥接代码以及 ST/MX 领域代码集成，从而生成一个可运行的程序。\n\
  \n## Pycca 与大型工具方法之比较\n\n`pycca` 方法面向的是完整开发工作流程中的实现环节。这种定位最重要的原因，是为了能够获得实现所需的特性。尽管我们认为建模和翻译很有价值，但那些无法达到预期实现特性的建模与翻译程序，是无法作为真正的产品见到日光的。那些看不到清晰路径、无法实现所有非功能性需求的项目团队，往往不愿意采用建模/翻译的开发方法。\n\
  \n在更广泛的计算机世界中，存在着大量的实现技术。从操作系统到数据库管理系统，再到编程语言和 Web 框架，程序员们已经编写了许多有用的实现组件。作为程序员，我们乐于发现那些通用且可复用的处理过程，它们可以以单一代码体的形式实现，同时满足更广泛的需求。为了获得所需的实现特性并真正从建模中受益，我们希望在翻译模型时能够更好地利用现有的实现组件。\n\
  \n期望工具供应商提供能够使用各种实现技术的翻译机制是不现实的，尤其是当项目的技术选择必须非常具体，以满足更广泛的公司或团队需求时。仅凭商业考量，工具供应商就试图使其产品吸引尽可能广泛的客户群。这种驱动力趋向于追求“最低共同标准”，因为这能带来最大的潜在市场。由于平台技术发展迅速，且每种技术所面对的市场有限，工具通常远远落后于实现概念和技术的领先水平。\n\
  \n项目团队自身也有许多约束需要解决。目标编程语言的支持就是一个例子。工具供应商通常支持 C、C++（甚至一口气说成 C/C++，仿佛它们是同一种语言），或许还有\
  \ Java 或 Ada。可用的编程语言数量多得令人眼花缭乱，而且新的语言还在不断涌现。项目可能有充分的理由使用特定的实现语言。这些理由可能基于遗留系统集成、目标平台限制，或者开发人员的知识储备与便利性。例如，Python\
  \ 是一种流行的语言，并已用于实现一些相当大型的系统，但我们不知道有任何工具供应商将其作为目标。\n\n另一个例子是数据库管理系统的使用。使用它们可能有充分的理由，因为中央数据存储可以成为更大系统中其他程序的一个强大集成点，也可以用于满足未来需求可能需要的临时查询。但我们也不知道在这方面有实质性的工具供应商支持。\n\
  \n我们相信，我们描述为逻辑与实现技术分离的建模与翻译之间的分离，是一个基本概念，它应允许我们选择最符合当前工程需求的实现技术，同时仍能获得建模带来的所有好处。\n\
  \n我们方法的主要焦点是创建专门针对项目团队预期生成的应用程序类别实现需求而量身定制的平台模型和 MX 领域。该方法从实现端开始，逆向工作以集成分析和建模工具，试图解决整体工作流程。我们获得了模型执行规则所提供的所有结构优势，并且我们确信可执行模型是可翻译的。然而，与前端分析捕获工具的集成还有所欠缺。其权衡之处在于，让人类来扮演这个角色。\n\
  \n可以设想，当使用诸如 `pycca` 这样的翻译方案时，是可以实现与前端工具集成的。许多工具供应商提供可配置的代码生成器，这些生成器有可能经过修改，以生成\
  \ `pycca` 源代码而非编程语言源代码。\n\n\n\n### 人类在代码生成中的角色\n\n我们认为在软件开发过程中使用人类担任特定角色并非不寻常的情况。毕竟，项目团队在开发成千上万行（甚至几十万行）的大型系统时，往往只借助文本编辑器和编译器以及少数辅助工具，也许是在集成开发环境工具中。我们对这种矛盾的态度感到困惑：采用传统的、几乎没有任何工具的临时设计技术来承担大型软件项目是可以接受的，但使用模型和翻译却不知为何需要广泛而复杂的软件工具。我们怀疑，项目团队通常并不清楚翻译究竟是如何实现的，因此别无选择，只能假设这些空白是由软件工具来填补的。\n\
  \n我们在本书中已经证明，要获得模型/翻译开发方法的好处，并不需要大型、复杂的工具。我们并非反对工具供应商。他们提供着至关重要的角色和服务。工具供应商提供的目标平台非常适合许多项目。然而，许多组织承担不起复杂工具的资本成本、与工具相关的学习成本，以及维持复杂工具运行所需的管理成本。同时，我们对现有工具的单一结构感到失望，更倾向于一种更加模块化的解决方案。我们对那些按性能特征细分应用类别的建模工具感到不安。例如，一些建模工具声称可用于生成“实时”模型。但模型本身并不是实时的。不清楚这类工具如何为诸如系统必须在固定时间限制内响应或确定性响应时序等非功能性需求提供更多支持。同样令人沮丧的是，当前“实时”一词的用法在许多语境中已经退化为“速度快到人类不会感到恼火”。实时响应的问题必须通过\
  \ MX 领域的实现策略来解决，而我们认为这没有模型层面的影响。\n\n### 总结\n\n参考工作流描述了以某种形式构建和翻译 xUML 模型所必需的基本任务和工作产物。任何特定的翻译方法（包括\
  \ pycca）都可以相对于此工作流进行背景化描述。\n\n参考工作流描述了以下步骤：构建和存储 xUML 模型、填充模型、标记模型、集成建模域和非建模域、将模型翻译为平台特定模型、生成与模型执行运行时组件兼容的代码以及传递手写代码，最后将所有这些编译并链接成一个完整的系统。\n\
  \n我们还讨论了与这些任务相关的挑战和工具支持。\n\nxUML 建模语言可以用元模型进行正式描述。这是用 xUML 自身定义的语言模型。该元模型也用作存储 xUML\
  \ 模型的数据库模式设计。目前，大多数现有的元模型往往是特定于工具的表示形式。正在进行的开源工作旨在定义一个独立于工具的 xUML 元模型。（不过，正如 pycca\
  \ 方法所展示的，没有它也能应付。）\n\n在参考工作流的背景下介绍了 pycca 工作流。值得注意的区别是，使用简单的绘图工具和电子表格来捕获模型，而不是使用单一的大型工具。包括标记在内的设计细节，是在创建`pycca`脚本的过程中进行的。然后，在代码生成之前，该脚本用于填充一个独特的平台模型。虽然与使用单一工具相比，需要更多的人工干预，但定制代码的机会也更多。尽管如此，源模型始终会向前推进，并且在翻译过程中永远不会被更改，这正是参考工作流中的情况。\n\
  \n脚注 1\n\n作者之一斯蒂芬·梅勒是《敏捷宣言》的原始签署人。\n\n"
- "# 附录 A：xUML 总结\n\n以下是本书中使用的可执行 UML 关键特性的快速参考。撰写本文时，最完整的描述可在《可执行 UML：模型驱动架构的基础》一书中找到（Stephen\
  \ J. Mellor 和 Marc J. Balcer 著，AddisonWesley Professional, 2002 年）。也可在本书封底的“联系我们”页面提到的网站上找到相关资源。\n\
  \n### xUML\n\n| xUML 是 UML 表示法的一个子集，具有独立于平台的执行语义。 |   |\n|   | xUML 支持面向对象/数据的分析，但不假设任何类型的面向对象实现。\
  \ |\n| 所有模型元素在独立于平台的上下文中都是可执行的。 |   |\n|   | 这意味着你不需要任何额外的（例如，插入某处的代码）东西来运行模型。 |\n\
  | 如果你有一个执行模型规则的工具，你可以在计算机上测试模型。否则，你必须手动应用这些规则。无论哪种方式，执行规则都是相同的。它们绝不是可自由解释的！ |  \
  \ |\n\n![A421575_1_En_BookBackmatter_Figa_HTML.gif](img/A421575_1_En_BookBackmatter_Figa_HTML.gif)\n\
  \n## 域\n\n域是一个主题领域，代表现实或抽象世界的规则和词汇。\n\n![A421575_1_En_BookBackmatter_Figb_HTML.gif](img/A421575_1_En_BookBackmatter_Figb_HTML.gif)\n\
  \n### 桥接\n\n桥接是两个域之间的关系：一个域需要另一个域提供它自身无法实现的能力。\n\n需要该能力的域扮演客户端的角色。提供所需能力的域扮演服务端的角色。\n\
  \n![A421575_1_En_BookBackmatter_Figd_HTML.gif](img/A421575_1_En_BookBackmatter_Figd_HTML.gif)\n\
  \n![A421575_1_En_BookBackmatter_Figc_HTML.gif](img/A421575_1_En_BookBackmatter_Figc_HTML.gif)\n\
  \n## 域图\n\n构建整个软件系统所需的一组域及其连接桥接，显示在域图上。\n\n![A421575_1_En_BookBackmatter_Fige_HTML.gif](img/A421575_1_En_BookBackmatter_Fige_HTML.gif)\n\
  \n一个域可以用 xUML 建模、部分地用 xUML 建模、用另一种语言建模、手写代码、在现有的遗留软件中创建，或从第三方获取。\n\n请记住，任何域都可以跨多个处理器/线程/任务边界拆分，或者多个域可以放在同一个实现单元中。\n\
  \n域图是独立于平台的，因此平台及其他特定技术的边界不会显示在域图上。\n\n![A421575_1_En_BookBackmatter_Figf_HTML.gif](img/A421575_1_En_BookBackmatter_Figf_HTML.gif)\n\
  \n### 类\n\n类是一组实例的定义，使得该集合中的所有成员：\n\n![A421575_1_En_BookBackmatter_Figg_HTML.gif](img/A421575_1_En_BookBackmatter_Figg_HTML.gif)\n\
  \n- 具有相同的特征\n- 具有相同的行为\n- 受相同的规则和策略约束\n\n### 属性\n\n属性是已被抽象为类的某个事物的特征。根据类定义，每个实例在任何时候都必须为其每个属性具有有意义的值。\n\
  \n*在任何时候*：其含义和用法在相关的属性描述中说明。\n\n可以分配给属性的值受数据类型约束。\n\n![A421575_1_En_BookBackmatter_Figh_HTML.gif](img/A421575_1_En_BookBackmatter_Figh_HTML.gif)\n\
  \n\n\n### 数据类型\n\n数据类型是对可赋予属性的现实世界值以及可应用于这些值的操作的约束。\n\n**示例：**\n\n- **压力，MPa 计数**\n\
  \  - `Count` 可定义为整数 `[0..maxint]`。\n  - 尽管它基于整数，但唯一支持的操作是 `increment`、`decrement`\
  \ 和 `reset`。\n- **飞机尾号**\n  - 这不被定义为 `string`，因为许多字符串是非法的。可以定义一个正则表达式来描述合法的尾号名称。\n\
  \  - 同时，大多数字符串操作也不允许用于此类值。\n- **点**\n  - 可以定义一个二维点类型，其操作可以生成笛卡尔坐标或极坐标点，从而封装内部表示。\n\
  \    ```\n    r, theta = Track.Origin.Polar\n    x, y = Track.Origin.Cartesian\n\
  \    ```\n- 类型（类型理论）的定义与用于定义类和关联结构及行为的关系理论是正交的。\n\n### 标识符\n\n标识符是对同一类的一个或多个属性集合的约束，使得该类的任意两个实例不能共享相同的值。\n\
  \n| 现实世界标识符 | 虚构标识符 |\n| --- | --- |\n| 标识符可以是现实世界中的标识符，例如 `Tail Number`。现实世界的机构建立此约束。\
  \ | 或者，它也可以是为保证唯一性而虚构的任意值。在这种情况下，由建模者建立约束。 |\n| 将现实世界的约束形式化。 | 与引用属性结合使用时，它有助于形式化关系和其他约束。\
  \ |\n\n**符号**\n\n每个类的标识符从 1 开始编号。标识符的每个属性组件都标记有 `{I}` 或 `{In}`，其中 `{I}` 表示 ID 1，`{In}`\
  \ 表示参与的 ID 编号。一个标识符属性可以参与其所属类的一个或多个标识符。\n\n![A421575_1_En_BookBackmatter_Figi_HTML.gif](img/A421575_1_En_BookBackmatter_Figi_HTML.gif)\n\
  \n更广泛的 UML 社区鼓励隐含假设存在一个架构提供的句柄来管理实例之间的链接。在 xUML 中，我们依赖于每个类上至少有一个显式标识符。这确保了我们有了一致的关系引用系统，并且它为我们提供了表达关系限制约束的强大工具。\n\
  \n### 关联\n\n关联是实例之间系统性维持的一种关系。\n\n![A421575_1_En_BookBackmatter_Figj_HTML.gif](img/A421575_1_En_BookBackmatter_Figj_HTML.gif)\n\
  \n### 关联类\n\n关联类将另外两个类之间的关联形式化。\n\n![A421575_1_En_BookBackmatter_Figk_HTML.gif](img/A421575_1_En_BookBackmatter_Figk_HTML.gif)\n\
  \n对于多对多以及任何条件对条件或多对 0..1 的关联，始终使用关联类，以确保引用属性始终具有非空值。\n\n## 泛化/特化\n\n一组实例可能共享属性和规则，同时又有例外情况。为了处理这种情况，由类建立的集合定义被划分为互斥的子集。\n\
  \n在任何时候：\n\n- 一个空中交通管制员（ATC）不能同时处于“值班”或“下班”状态之外。\n- 一个“值班”或“下班”的管制员必然是 ATC。\n\n\
  ![A421575_1_En_BookBackmatter_Figl_HTML.gif](img/A421575_1_En_BookBackmatter_Figl_HTML.gif)\n\
  \n每个现实世界对象同时属于超类和子类集合。因此，在泛化中，一个对象 = 两个相连的实例。\n\n在这种情况下，使用泛化来建立互斥（XOR）约束。\n\n##\
  \ 其他活动类型\n\n在 xUML 中，活动主要是状态活动。但它们也被编写在类方法、外部实体操作和域操作中。\n\n**类方法**\n\n将活动放在类方法中而非状态中有几个原因。例如，某个活动可能从多个状态触发。或者，某个类可能没有状态模型，但仍需进行无状态处理。\n\
  \n![A421575_1_En_BookBackmatter_Fign_HTML.gif](img/A421575_1_En_BookBackmatter_Fign_HTML.gif)\n\
  \n![A421575_1_En_BookBackmatter_Figm_HTML.gif](img/A421575_1_En_BookBackmatter_Figm_HTML.gif)\n\
  \n模型仅指出，当访问派生属性时，它会根据平台无关的公式提供正确的值。而值更新的时间和频率则是平台相关的，因此不在模型中体现。\n\n**域操作**\n\n-\
  \ 域操作为外部域提供了一个运行时、模型级别的 API。这些活动应仅用于验证传入数据、定位相关模型元素，然后发出适当的事件或调用类方法。\n- 限制：不能引用\
  \ `self` 属性，因为没有这样的属性。\n\n通过 UI 域的桥接调用的润滑（Lubrication）域中的域操作\n\n![A421575_1_En_BookBackmatter_Figo_HTML.gif](img/A421575_1_En_BookBackmatter_Figo_HTML.gif)\n\
  \n## 状态模型（实例生命周期）\n\n根据定义，一个类的所有实例共享相同的行为。这种行为遵循一个共同的、可以用状态模型形式化的生命周期。（状态模型在软件中还有许多其他用途，但在\
  \ xUML 中，我们专门使用它们来捕获实例生命周期。）\n\n**状态机行为**\n\n- 一个实例停留在其状态机的某个状态中，等待事件发生。\n- 当发生一个或多个事件时，将根据事件同步规则消费其中一个事件。\n\
  - 被消费的事件会导致以下三种响应之一：\n  - **遵循转换**（如状态模型图所示）：实例跟随转换，并立即开始在目标状态（可以是同一个状态）执行活动。\n\
  \  - **忽略该事件**：事件被消费后不再存在。\n  - **不可能发生**：该事件是未预料到的，并构成模型中不可恢复的错误。模型执行域负责在模型外部处理该错误。\n\
  \n## 平台无关的同步规则\n\n### 事件\n\n事件生成后，会在某个时间点提供给目标实例或外部实体。\n\n事件永远不会丢失：每个事件都将被送达其所指向的实例或外部实体。\n\
  \n事件被实例消费后，便不再存在。\n\n一个给定的实例可能有多个待处理的事件。\n\n- （例如，当实例正在执行活动时，事件可能到达该实例。或者，多个事件可能只是同时到达。）\n\
  \n如果某个实例有待处理的、由不同发送者生成的事件，则无法确定哪个事件会被首先消费。\n\n发往自身的事件总是由发送它的实例在其消费任何其他事件之前消费。\n\n\
  如果一个实例向目标实例生成了多个事件，这些事件将按生成的顺序被接收。\n\n### 活动\n\n活动执行需要时间，也可能不需要时间（实际持续时间取决于平台）。\n\
  \n一旦启动，实例的状态活动必须完成，然后同一实例才能接受下一个信号。\n\n在 xUML 中，活动总是运行至完成。因此，如果你需要在模型级别中断行为的能力，请将其分解为分布在多个状态模型上的多个活动。\n\
  \n任何给定实例的任一时刻只能有一个状态活动在执行，因为一个实例一次只处于一个状态。\n\n一个活动中的多个动作可以并发执行。不同实例中的活动可以并发执行。\n\
  \n当一个活动完成时，它必须使系统保持一致状态。\n\n\n\n## 状态模型（分配器）\n\n一个`分配器`是一种特殊的状态模型，用于管理竞争性关联。它遵循所有同步规则，但本身没有实例。取而代之的是，一个令牌会在各个状态之间移动。\n\
  \n当实例之间的竞争使得关联两端的实例无法避免链接到同一个实例时，我们就需要用到分配器。\n\n### 单一分配器\n\n![A421575_1_En_BookBackmatter_Figp_HTML.gif](img/A421575_1_En_BookBackmatter_Figp_HTML.gif)\n\
  \n### 多重分配器\n\n现在让我们扩大范围，考虑一个商店中的多个部门。在这种情况下，每个部门内的顾客和员工之间存在局部竞争。这就需要使用多重分配器。\n\n\
  ![A421575_1_En_BookBackmatter_Figq_HTML.gif](img/A421575_1_En_BookBackmatter_Figq_HTML.gif)\n\
  \n重要的概念是：1）在异步世界中，需要一个单一的控制点来解决竞争；2）`xUML`同步规则使得指定一个与平台无关的解决方案成为可能。这个解决方案不会被当作“实现细节”而搁置。\n\
  \n### 多态事件\n\n多态事件是在一个超类上声明的。该超类并不定义对该事件的响应，甚至根本不需要拥有状态模型。\n\n该事件通过源自该超类的每个特化分支进行委托。\n\
  \n在每个特化层级中遇到的每个子类，必须在其自身的状态模型中进一步委托该事件，或对该事件做出响应。\n\n在单一或重复的特化（相同方向）中，必须有且仅有一个状态机对事件的任何运行时实例做出响应。\n\
  \n![A421575_1_En_BookBackmatter_Figr_HTML.gif](img/A421575_1_En_BookBackmatter_Figr_HTML.gif)\n\
  \n如果存在多个特化（不同方向），则该事件由每个特化方向中的一个状态机实例接收。\n\n![A421575_1_En_BookBackmatter_Figs_HTML.gif](img/A421575_1_En_BookBackmatter_Figs_HTML.gif)\n\
  \n### 外部实体\n\n外部实体充当与外部域进行运行时通信的代理。它的命名可以与域名称一致，也可以代表由该域处理的一个大规模或抽象实体。（应注意避免在另一个可能变动的域中命名特定的模型或代码元素。）\n\
  \n外部实体操作由域内部的同步或异步调用触发。该活动通常会调用由另一个域提供的域操作。\n\n![A421575_1_En_BookBackmatter_Figt_HTML.gif](img/A421575_1_En_BookBackmatter_Figt_HTML.gif)\n\
  \n"
- "# 附录 B：Scrall 概述\n\n`Scrall`（Starr 的精炼关系型动作语言）是我们在本书中用于指定模型动作的伪动作语言。你可以在[`www.executableuml.com`](http://www.executableuml.com)找到该语言最完整和最新的描述。现在，我们仅介绍本书中使用的该语言的各个方面，以便为文本中的叙述性解释提供更多上下文。\n\
  \n## 原则\n\n与 `xUML` 的类模型和状态模型方面一样，动作语言必须是可执行的且与平台无关。`Scrall` 被设计为与 `xUML` 执行语义保持一致。同时，它也力求易于读写。\n\
  \n#### 名称\n\n`Scrall` 被设计为可读性强，同时避免不必要的冗长，将繁重的工作委托给解析器和高级编辑工具。模型元素、变量和值的名称可以包含空格，但必须注意不要将关键词嵌入到以空格分隔的名称中。为了最大限度地提高空格的舒适使用度，我们尽力定义了尽可能少的关键词。因此，像\
  \ `the shift spec` 这样的变量名是完全合法的。这种方法与那些试图通过引入冗长的关键词短语来提高可读性的语言设计不同。\n\n## 变量类型\n\
  \n变量有三种类型：实例集变量、标量变量和关系变量。本书中只使用前两种，因此我们在本附录中仅对关系变量进行简要描述。\n\n### 实例集变量\n\n实例集变量的类型是本地域中的一个类，它指向该类的零个、一个或多个实例。\n\
  \n### 关系变量\n\n关系是由一组属性/数据类型对与一组元组交叉构成，每个元组为每个属性提供一个值。可以有零个、一个或多个元组被赋值，以及零个、一个或多个属性/数据类型对。关系变量持有一个可以可视化为表的关系（即使关系实际上并不是一个表）。元组是关系的一个简单特例，因此不需要额外的元组变量类型。以下是对这样一个变量赋值的例子：\n\
  \n```\nacdata #= /R8/Aircraft.(ID, Altitude, Airspeed)\n```\n\n这里，`acdata` 关系变量持有一个关系，其属性:数据类型对为\
  \ `ID`: `Tail Number`，`Altitude`:`MSL Altitude`，和 `Airspeed`:`K`，并且有一个元组为 `Aircraft`\
  \ 的每个实例提供一组相应的值。同样，可以很容易地将其可视化为一个表，表头是属性，每一行代表 `Aircraft` 的一个实例。`#=` 赋值运算符隐式地将 `acdata`\
  \ 类型化为关系变量。\n\n### 标量变量\n\n在我们上下文中的术语“标量”意味着“非关系”。标量变量持有一个属于由数据类型定义的集合的单一值。数据类型的定义与类中实例数据的关系组织是正交的。系统提供的标量数据类型示例有\
  \ `integer`、`real`、`rational` 和 `string`。按照惯例，系统类型使用小写名称。用户自定义类型的一个例子可能是 `GPS Coordinate`。按照惯例，用户类型的所有首字母大写——例如，`Compass\
  \ Heading`。\n\n### 数据类型\n\n数据类型定义了一组标量值以及可以在该集合的成员上执行的操作。系统提供的数据类型通常是 `boolean`、`integer`、`real`\
  \ 和 `string`。用户自定义类型如 `GPS Coordinate`、`Pressure` 或 `License Number` 可以基于这些类型的限制、扩展和结构组合来构建。\n\
  \n可以使用中缀、前缀和后缀运算符，以及使用 `.` 符号访问的名称来执行操作。例如，`Count` 数据类型可以定义为取值范围在 `[0..maxint]`\
  \ 内的整数，支持的操作包括 `incr`、`decr` 和 `reset`。\n\n`++cars passed` 或 `cars passed.incr`\
  \ 都可能调用为 `Count` 类型定义的增量操作。`cars passed.reset` 可以将值设置为零。\n\n`current latitude =\
  \ position.latitude` 调用了 `GPS position` 类型上的纬度访问器。\n\n## 系统变量\n\n系统提供的变量以下划线为前缀。例如，`_now`\
  \ 为任何 `xUML` 域中的模型提供当前时间。为了让模型能够在尽可能多的 `MX` 域上运行，系统变量很少。\n\n```\nTime logged in\
  \ = _now.HMS\n```\n\n这里，`_now` 系统变量调用了系统定义的 `HMS` 运算符，该运算符返回以小时、分钟和秒表示的时间。该赋值隐式地将左侧的变量类型化为标量变量。\n\
  \n## 无字面量\n\n动作中不能指定字面量值。其思想是将数据的编码从动作语言中剔除，并将其归入它通常所属的地方，即类模型中的实例数据。提供了允许访问特殊值（如\
  \ pi、零等）的机制。但在所有情况下，这些都是在动作语言本身之外定义的命名值。例如，可以在类图上使用标准 UML 表示法指定默认的初始值。双下划线引用在状态模型之外某处定义的命名值，如\
  \ `__pi`、`__0`。请注意，对于前面描述的、类型化为 `Count` 的变量，可以通过调用 reset 操作将其设置为零。\n\n\n\n## 布尔值\n\
  \n使用 `set` 和 `unset` 操作代替对字面量 `true` 和 `false` 的显式赋值。\n\n示例：\n\n*   `Injecting.set`\
  \ ⇒ 设置为 true\n*   `Injecting.unset` ⇒ 设置为 false\n*   `if not Injecting ...` ⇒ 测试状态\n\
  \n## 枚举值\n\n虽然禁止使用字面量，但可以定义枚举数据类型值。一个 `Fluid State` 数据类型可能枚举出 `low`、`very low`、`empty`\
  \ 和 `normal` 等值。要引用一个枚举值，在其前面加上 `.`。\n\n```\nLevel = .very low\n```\n\n如果左侧是一个属性，它已具有类型，在本例中可能为\
  \ `Fluid State`。如果是标量变量，则可能需要使用 `::` 类型声明运算符显式指定其类型。\n\n```\nlevel var::Fluid State\
  \ = .full\n```\n\n枚举值中允许包含空格。\n\n## 赋值运算符\n\n变量在赋值运算符左侧首次出现时会被隐式地确定类型。也可以使用 `::`\
  \ 运算符显式地对它们进行类型化，虽然这通常不是必需的。\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `.=` | 赋值零个或一个实例。如果找到多个实例，则会产生错误。通常与一组标识符值一起使用以选择一个实例。\
  \ |\n| `..=` | 将零个、一个或多个实例赋值给一个实例集变量。 |\n| `.=.` | 从一组实例中任意赋值一个单一的实例，如果未找到则赋值无实例。\
  \ |\n| `=` | 赋一个标量值。 |\n| `#=` | 赋一个关系。 |\n\n### 实例选择\n\n要选择一个实例，请指定一个类名，后面可选地跟圆括号内的选择条件。\n\
  \n### 无条件选择\n\n选择类的单例实例时不需要条件。\n\n```\nthe shift spec .= Shift Specification\n```\n\
  \n上述语句选择了 `Shift Specification` 类的单一实例。因为没有提供条件，并且在一个单例类中只有一个实例，因此该实例被选中。如果未找到任何实例，则会发生错误。\n\
  \n或者，可以选择一个类的所有实例：\n\n```\nall aircraft ..=Aircraft\n```\n\n因为没有指定条件，实例集变量 `all\
  \ aircraft` 将包含对 `Aircraft` 所有实例的引用。如果当前不存在 `Aircraft` 的实例，则该变量将引用零个实例。\n\n### 条件选择\n\
  \n支持常用的比较运算符（`>`、`>=` 等）。`:` 符号代表 `==`，因为在最常见的情况下，您希望匹配一个值，例如选择具有匹配 ID 的实例。从概念上讲，您是在寻找一个匹配项，因此使用一个符号。将其理解为\
  \ **matches**。\n\n例如：\n\n```\nmy station .= Duty Station( Number: in.Station )\n\
  ```\n\n这选择了 `Duty Station` 类中其 `Duty Station.Number` 与输入参数值匹配的单一实例。\n\n布尔运算符如 `and`、`not`\
  \ 和 `or` 可以混用。为方便起见，`,` 分隔符被解释为 `and` 运算符。`:` 和 `.` 运算符的组合使得可以基于一组匹配值轻松选择单个实例，而无需使用一连串的\
  \ `and` 和 `==` 符号。\n\n```\nlanding runway .= Runway( Airport: in.airport code, Runway\
  \ ID: in.runway )\n```\n\n这选择了 `Runway` 类中与两个值匹配的实例。假设这两个值组合起来对于 `Runway` 类是唯一的。如果找到多个实例，则会发生错误。\n\
  \n```\nhigh fast aircraft ..= Aircraft( Altitude > high alt and Airspeed > high\
  \ speed )\n```\n\n这将选择所有高于特定高度且速度快于特定速度的飞行器。\n\n## 关系导航\n\n`/` 符号表示跨类模型关系的跳转。最左边的\
  \ `/` 表示以本地实例为起点的关系路径表达式的开始。\n\n```\nhoff zone .= /R2/Control Zone( Name: in.Zone\
  \ )\n```\n\n右侧的路径表达式从本地实例开始，跨过 `R2` 关系，到达 `Control Zone` 类中的所有相关实例。选择条件将集合缩小到其 `Name`\
  \ 属性与 `in.Zone` 值匹配的单个实例。假设 `Name` 属性是 `Control Zone` 的标识符，则应将零个或一个实例赋值给左侧。\n\n\
  关系名称（R1、R2 等）、动词短语和类名可以出现在跳转分隔符之间，以定义明确的选取路径。\n\n## 信号发送\n\n要发送信号，请使用以下表达式：\n\n\
  ```\n(params) [after ] -> instance set\n```\n\n例如：\n\n```\nLow injection pressure\
  \ -> /R3/Reservoir\n```\n\n这里一个事件被发送给链接的实例。如果目标实例集中有多个实例，则每个实例都将接收到一个单独的事件。\n\n\
  一个实例可以通过使用 `me` 关键字向自身发送事件。该关键字代表本地状态机。\n\n```\nInjection canceled -> me\n```\n\n\
  赋值器状态模型不引用任何本地实例，但因为 `me` 关键字引用的是本地状态机，因此也可以在那里用于自定向事件。\n\n可以指定一个延迟，如下所示：\n\n```\n\
  Good injection -> me after /R4/Injector Design.Good injection duration\n```\n\n\
  这里 `Good injection` 事件在 `Injector Design` 中指定的持续时间之后发送。沿 `R4` 的关系可能是一对一的。如果路径表达式没有恰好选择一个实例，则会发生错误。\n\
  \n## 链接/解除链接\n\n关联运算符是 link `&`、unlink `!&` 和 swap。\n\n格式如下：\n\n```\n[] & /\n```\n\
  \n可选的左侧实例集中的每个实例都与右侧集沿路径引用的每个实例进行链接。如果未指定左侧的实例集，则默认为本地实例。\n\n```\n& /R3/my station\n\
  ```\n\n这将本地实例链接到变量沿 `R3` 引用的每个实例。\n\n如果关联由一个关联类形式化，则将为每个链接创建一个关联类的实例。所需的引用属性将被设置为适当值以引用每个参与的类实例。任何其他属性都将设置为其默认初始值。\n\
  \n另一种链接方式是设置关联上的一组引用属性的值，以匹配关联另一侧的相应标识符属性的值。通常，使用 link 操作更安全。\n\nunlink 运算符是 `!&`，使用的格式与\
  \ link 操作相同：\n\n```\n!& /R5/takeoff runway\n```\n\n这将本地实例从变量 `takeoff runway` 沿\
  \ `R5` 引用的所有实例中解除链接。\n\n另一种解除链接的方法是直接删除持有引用另一侧关联的引用属性的实例。\n\n在一对一关联中，重要的是不要让关联处于未连接状态。为避免这种情况，请使用\
  \ `swap` 运算符代替一对 link 和 unlink 操作：\n\n```\nswap // with  [on ]\n!new missing: \n\
  !old missing: \nswap /R2/hoff zone with new controller    [handed  off]\n!new missing:\
  \ UI.Unknown controller( Controller: in.Controller)\n!old missing: UI.Zone not handled\
  \ by( Controller: ID)\n!handed off {\n// further actions assuming handoff succeeded\n\
  }\n```\n\nswap 操作下的错误条件将在接下来解释。\n\n\n\n## 错误处理\n\n某些操作可能触发无法恢复的错误。每个此类错误都会设置一个命名守护。这些名称是操作为其预定义的。如果该错误实际上是可恢复的，建模者可以指定内部响应，并使用`[]`守护设置括号来设置可选的用户定义守护，以调节下游处理。\n\
  \n在`swap`操作示例中，为操作预定义了两个守护：`new missing`和`old missing`。在`swap`操作右侧设置了一个用户定义守护，如果发生任何错误，该守护将被禁用。为两个可能的错误各指定了一个单一操作，使它们都可恢复。如果两个错误均未发生，则`handed\
  \ off`守护不会被禁用，并且可以指定与该守护关联的操作块。\n\n```\nmy station .= Duty Station( Number: in.Station\
  \ ) [station OK]\n!empty: UI.No such station( Number: in.Station )\n!station OK\
  \ {\n// 假设已选择站点的操作\n}\n```\n\n这里的`.=`赋值操作预定义了两个错误：`empty`和`many`。如果两者都被忽略，它们就是不可恢复的。通过插入`!empty`子句，建模者表明空情况是可以接受的，并且存在一个响应。请注意，在之前的单例选择示例中，该错误应该是不可恢复的。如果发生`empty`错误，`station\
  \ OK`守护会被禁用，并且可用于启用进一步处理。\n\n如果有多个操作要执行，可以将它们括在括号内形成一个操作块。否则，错误名称后跟一个`:`。\n\n###\
  \ 子类迁移\n\n`migrate`操作删除一个子类中的本地实例，在另一个子类中创建它，并将新的子类实例关联到其父超类：\n\n```\nmigrate []\
  \ to\n```\n\n集合中的所有实例都会被迁移到目标子类。如果省略实例集合，则仅迁移本地实例：\n\n```\nmigrate to On Duty Controller\n\
  ```\n\n如果本地实例是`Off Duty Controller`，它将被迁移到`On Duty Controller`子类。\n\n这是一个便捷操作，它替代了原本需要的相应创建和删除操作，并确保正确进行迁移，而不会破坏模型的完整性，例如留下一个非法的孤立子类实例。\n\
  \n## 与外部域的交互\n\n除了对系统提供的下划线变量的特殊访问外，还有两种方式可以在运行时与其他域进行交互。\n\n### 异步：向外部实体发送信号\n\n\
  这里会向一个外部实体发送信号，然后该实体负责以某种形式将该信号调解到另一个域。与常规事件不同，异步信号不指向外部域中的任何特定实例。它只是将信号发送到外部实体。\n\
  \n```\nStart monitoring => SIO\n=>\n```\n\n当你想要向外部域发出活动信号并期望在未来某个不确定的时间点得到异步响应时，可以使用此方法。\n\
  \n这里警告信号被发送到作为代理的外部实体 UI，推测是用于 UI 域。\n\n### 同步：在外部实体上调用操作\n\n这里是与外部域进行即时且完整的交互。可能会返回值，也可能不会，但不会触发进一步的外部活动。\n\
  \n```\nUI.Warning( MSG Control Zones Active, ID )\n.\n```\n\n## 自我引用\n\n当向自身发送信号时，`me`关键字指的是当前状态机实例。在实例生命周期状态活动中，这对应于本地实例的状态机。在分配者状态活动中，没有类实例，因此`me`指的是分配者状态机实例。\n\
  \n## 向分配者状态机发送事件\n\n分配者状态机附加于一个竞争性关联——即具有约束多重性（一侧或两侧为 1）的关联，其中两侧的实例同时尝试相互链接。\n\n\
  在这种情况下，该关联绑定到一个或多个解决竞争的状态机。这称为单一分配者关联。如果一侧的所有实例都可以链接到另一侧的所有实例，则一个单一分配者就足够了。但如果关联一侧的实例可能只能链接到另一侧的一个子集，则需要为每个子集提供一个单独的分配者状态机。这称为多重分配者关联。\n\
  \n向分配者状态机发送事件的格式取决于目标竞争性关联是单一分配者还是多重分配者。\n\n对于单一分配者，执行以下操作：\n\n```\n-> /assigner\n\
  Customer waiting -> /R2/assigner\n```\n\n对于多重分配者：\n\n```\n-> ()\nGroup ready ->\
  \ /R6/assigner(/R5/Signal Converter)\n```\n\n分区实例是通过某种关联，将参与竞争性关联的一个类分割成子集的实例。\n\
  \n在这两种情况下，事件都是发送给单个分配者状态机，而不是任何实例生命周期状态机。\n\n### 类方法\n\n通过在实例集变量上使用点符号来调用类方法。如果集合包含多个实例，则每个实例的本地方法都会被调用。\n\
  \n```\nallAircraft ..= Aircraft // 选择所有飞机\nallAircraft.verifyPosition() // 并发应用于每个实例\n\
  Aircraft.verifyPosition() // 执行相同操作，无需实例集变量\n```\n\n活动的输入参数可作为`in.<parameter name>`使用。\n\
  \n当为类方法调用或任何其他需要参数列表的操作指定参数列表时，格式如下：\n\n```\n( : value, ... )\n```\n\n有一些简化表达的快捷方式。如果参数名称和提供值的变量名称相同，则可以省略参数名称。\n\
  \n## 更多命令\n\n本附录仅涵盖了理解本书示例所需的 Scrall 子集。更完整（且不断更新）的规范可在[`www.executableuml.org`](http://www.executableuml.org)在线获取。\n\
  \n"
- "# 附录 C：Pycca 语言概述\n\n本附录总结了 pycca 领域专用语言以及用于翻译状态活动的最重要的 C 预处理器宏。完整文档可在本书网站[`www.modelstocode.com`](http://www.modelstocode.com)找到。\n\
  \n## 调用\n\n```\npycca ?OPTIONS? FILE ?FILE FILE ...?\n```\n\npycca 程序将域的描述翻译成适用于\
  \ ST/MX 模型执行域的 C 代码。pycca 翻译的语言是一种简单的配置语言，允许指定域、类、状态机和其他模型元素。任何相关的处理都在普通的 C 代码中指定。\n\
  \nPycca 根据其输入生成两个文件。一个文件是生成的 C 代码，通过在第一个输入文件的基本名称后附加`.c`后缀来命名。另一个文件是生成的具有`.h`后缀的头文件。在调用中可以给出多个输入文件。后续文件的处理方式如同所有文件已连接在一起。通常，第二个及后续的文件包含域填充信息，这样可以在不修改包含结构方面翻译的文件的情况下，以不同方式填充域。\n\
  \n### 选项\n\n#### -help 或 -?\n\n打印帮助信息。\n\n#### -version\n\n打印 pycca 的版本号和许可证，然后退出。\n\
  \n#### -noline\n\n不要在生成的引用 pycca 源文件的文件中输出`#line`指令。通常，生成的 C 代码中也包含行指令，这样编译器错误消息会引用\
  \ pycca 源文件而非生成的代码。然而，某些调试器会被这些指令混淆。\n\n\n\n`-output filename`\n\n将结果输出到`filename`。此选项允许对输出文件名进行更精细的控制。默认情况下，`pycca`通过将第一个`FILE`参数中的任何后缀替换为`.c`和`.h`来从源名称派生输出文件名。如果`filename`是一个目录，输出文件名将照常构建，只是`filename`作为路径的前导部分。否则，`filename`将用作构建输出文件名的基名，通过替换`filename`可能具有的任何后缀为`.c`和`.h`。\n\
  \n`-instrument pattern`\n\n为所有匹配`pattern`的类插入插桩代码。要检测所有内容，请将`pattern`指定为星号（`*`）。`pattern`是一个简单的通配符类型字符串匹配表达式列表。任何名称与给定模式匹配的类中的函数，都会在函数开头插入旨在帮助跟踪代码执行的插桩代码。请注意，`pattern`被解释为以空白分隔的元素列表，并且模式中的任何通配符规范通常都需要引号来防止被调用命令\
  \ shell 解释。\n\n`-noC99`\n\n默认情况下，`pycca`生成的代码适用于符合 C99 标准的 C 编译器。提供此选项会移除生成代码中的任何\
  \ C99 结构。这是为了兼容旧编译器。但请注意，`pycca`不会检查任何透传的代码，并且这些代码很可能包含特定“C”编译器不接受的构造。\n\n`-dataportal`\n\
  \n在生成的代码文件中插入一组数据结构和编码，允许从域外部调用某些模型级操作。该数据与门户代码一起使用，以支持桥接到域中。\n\n`-portalcode`\n\
  \n在当前目录下创建`pycca_portal.h`和`pycca_portal.c`文件。`Pycca`在创建文件后成功退出。这两个文件是与使用`-dataportal`选项生成的数据结构一起使用的\
  \ C 代码。\n\n## 词法约定\n\nPycca 使用一些词法约定来区分用于 C 代码结构的语言结构。\n\n#### 注释\n\n以井号字符（`#`）开头，并持续到行尾。\n\
  \n#### 空白\n\n通常被忽略，并且没有结构依赖于任何特定的空白排列。\n\n#### C 变量\n\n出现在匹配括号`(…)`之间的任何文本都被视为一个由逗号分隔的\
  \ C 变量或参数声明列表。参数列表和属性声明的 C 声明会被解析。由于`typedef`类型别名的固有歧义以及某些涉及常量表达式的 C 声明的复杂性，`pycca`可能会错误解析该声明。这些问题通常可以通过在实现序言部分包含适当的`typedef`来解决。\n\
  \n#### C 代码\n\n出现在匹配花括号`{…}`之间的任何文本都被视为 C 代码序列，并且除此之外不再进行解释。匹配闭合花括号的确定考虑了 C 语言的语法。请注意，C\
  \ 代码中的注释必须遵循 C 语言注释约定，因为任何代码都会透传给 C 编译器。\n\n#### 名称\n\n一个由字母后跟任意数量的字母、十进制数字或下划线字符组成的序列，且该序列不是关键字。这与\
  \ C 标识符使用的约定相同。\n\n#### 数字\n\n一个十进制数字序列。\n\n#### 关键字\n\n表 [A-1] 中的标记是关键字，不能在需要任意名称的地方使用。\n\
  \n表 A-1. Pycca 关键字\n\n| `attribute` | `class` | `constant` | `constructor` |\n|\
  \ `default` | `destructor` | `domain` | `dynamic` |\n| `end` | `epilog` | `event`\
  \ | `external` |\n| `final` | `implementation` | `initial` | `instance` |\n| `interface`\
  \ | `machine` | `operation` | `polymorphic` |\n| `population` | `prolog` | `reference`\
  \ | `set` |\n| `slots` | `state` | `static` | `subtype` |\n\n#### 其他标记\n\n表 [A-2]\
  \ 中的字符串也是词法标记。\n\n表 A-2. 其他 Pycca 标记\n\n| `->>` |\n| `->>c` |\n| `->>n` |\n| `->>l`\
  \ |\n| `-ddd>>` ，其中`ddd`是一个十进制数字序列 |\n| `->` |\n\n## 域定义\n\npycca 语言允许定义域。域由一组组件组成，例如类和操作。在本节中，我们将展示定义域的语法。\n\
  \n### `domain`\n\n域定义以`domain`关键字开头，后跟域名，并在匹配的`end`关键字处结束。\n\n```\ndomain lube\n\
  # Put your domain definition here\nend\n```\n\n本节中的其余语句可以出现在域定义内部。为简洁起见，我们假设这些语句包含在`domain`语句中。\n\
  \n### `class`\n\n`class`是数据和行为的模板。类名必须是有效的 C 标识符。类定义以`class`关键字开头，并在匹配的`end`关键字处结束。有关定义类属性的语句，请参阅类定义部分。\n\
  \n```\nclass Air_Traffic_Controller\n# statements defining the Air Traffic Controller\
  \ class\nend\n```\n\n### `domain operation`\n\n域的编程接口由一组域操作组成。域操作被转换为普通的 C 函数。它们的作用域是外部的，并且它们的原型被插入到生成的头文件中。如果域操作返回一个值，则类型通过接口后跟一个冒号（`:`）和变量类型来指定。如果未指定返回类型，则该函数被类型化为`void`。为了帮助管理全局命名空间，域名和下划线会被添加到为域操作生成的\
  \ C 函数之前。\n\n```\ndomain operation\nInjector_max_pressure(\nInstId_t injId)\n{\n\
  PYCCA_checkId(Injector, injId) ;\nClassRefVar(Injector, inj) = PYCCA_refOfId(Injector,\
  \ injId) ;\nif (IsInstInUse(inj)) {\nInstOp(Injector, Max_system_pressure)(inj)\
  \ ;\n}\n}\n```\n\n### `external operation`\n\n与域操作互补的是外部操作。它们的定义类似于域操作。外部操作定义了域的外部函数依赖关系。\n\
  \n```\nexternal operation\nSIO_Inject(InstId_t injectorId)\n{\n// any code here\
  \ is not passed through\n}\n```\n\n域期望这些函数从其他地方提供。前面的示例将以下外部声明放入生成的头文件中（假设该操作在`lube`域中定义）。\n\
  \n```\nextern int eop_lube_SIO_Inject(InstId_t injectorId) ;\n```\n\n### `interface\
  \ prolog`, `implementation prolog`, `interface epilog`, `implementation epilog`\n\
  \n额外的代码可以放置在生成文件的开始（`prolog`）或结束（`epilog`）处。`interface prolog`语句将代码放置在生成的头文件的开头附近，而`implementation\
  \ prolog`将代码放置在生成的代码文件的开头附近。将`prolog`替换为`epilog`会导致代码包含在各自生成文件的末尾。可以有多个`prolog`或`epilog`语句，并且所有此类语句中的内容会被累积起来，放置在生成文件的适当位置。\n\
  \n```\ninterface prolog {\n#include \"pycca_portal.h\"\n#include \n// Any additional\
  \ interface includes, etc.\ntypedef uint32_t Count ;\n}\nimplementation prolog {\n\
  struct Point {\nint x ;\nint y ;\n} ;\nstatic int multPoint(int a, Point *p) ;\n\
  }\ninterface epilog {\n#define POINT_DEFINED 1\n}\nimplementation epilog {\nstatic\
  \ int multPoint(\nint a,\nPoint *p)\n{\n// implementation of multPoint\np->x *=\
  \ a ;\np->y *= a ;\n}\n}\nend\n```\n\n\n\n### instance\n\n`instance` 语句用于定义初始类实例。实例以\
  \ `class@name` 的形式指定名称。所有没有定义默认值的属性都必须指定值。对于已定义默认值的属性，如果在实例定义中未提及，则使用该默认值；否则，默认值会被实例定义中给定的任何值覆盖。\n\
  \n```\ninstance\nInjector_Design@ihn4\n(Model_Name Model)                  {\"IHN4\"\
  }\n(MPa Min_delivery_pressure)         {19}\n(MPa Max_system_pressure)         \
  \  {35}\n(MPa Max_dissipation_pressure)      {32}\n(Seconds Delivery_window)   \
  \        {90}\n(Seconds Good_injection_duration)   {9}\nend\n```\n\n### table\n\n\
  当某个特定类有大量实例时，`instance` 语句使用起来可能很繁琐，并且会掩盖这些实例作为整体的性质。在这种情况下，`table` 命令允许以表格形式定义多个实例。属性的默认值可以用连字符（`-`）指定。\n\
  \n```\ntable\nLubrication_Schedule\n(Name_t Name)\n(Duration Wait_interval)\n(Duration\
  \ Monitor_interval)\n(Count Max_low_lube_cycles)\n(bool Default_continuous_operation)\n\
  (Count Default_max_cycles)\n@gearbox    {\"Gearbox\"}     {210}   {45}   {8}   \
  \ {true}   {5000}\n@generator  {\"Generator\"}   {120}   {25}   {10}   {true}  \
  \ {10000}\n@shaft      {\"Shaft\"}       {90}    {30}   {10}   {true}   {10000}\n\
  @test2      {\"Test2\"}       {20}    {15}   {1}    {false}  {200}\nend\n```\n\n\
  ## Class Definition\n\n本节描述用于定义类属性的 `pycca` 语句。类定义包含在成对的 `class` 和 `end` 语句中。为简洁起见，从本节往后我们将省略外围的\
  \ `class` 和 `end` 语句。\n\n### attribute\n\n属性的声明方式与 C 语言中的结构体成员相同，但没有任何标点符号。遵循词法约定，C\
  \ 声明放在括号内。还可以指定实例的默认值。默认值仅在定义类的初始实例且未指定值时使用。默认值仅在指定初始实例集时使用。对于动态创建的实例，所有属性值都由运行时代码设置。默认值必须求值为有效的\
  \ C 编译时常量表达式（因为它将被用作初始化器）。由于默认值规范会传递给编译器，它们必须用花括号（`{}`）括起来。\n\n```\nattribute (Model_Name\
  \ Model)\nattribute (MPa Min_delivery_pressure)\nattribute (MPa Max_system_pressure)\n\
  attribute (MPa Max_dissipation_pressure)\nattribute (Seconds Delivery_window) default\
  \ {30}\nattribute (Seconds Good_injection_duration)\n```\n\n### reference\n\n`reference`\
  \ 是一种特殊的属性，它被转换为指向特定类结构的指针。引用有一个名称，通常与其实现的关系同名（如果该关系是自反的，可能会附加一个注解）。属性的类型无需指定，因为它可以被推断为指向与该类名匹配的结构的指针。\n\
  \n### subtype\n\n`subtype` 语句用于声明在类结构中保存泛化关系信息所需的数据结构。泛化关系可以作为引用泛化或联合泛化来实现。\n\n\
  #### Reference Generalization\n\n一个类通过使用 `subtype ... reference` 语句为通过引用实现的泛化关系定义存储空间。该语句给出一个应被视为子类型的类列表。\n\
  \n```\nsubtype R1 reference\nOff_Duty_Controller\nOn_Duty_Controller\nend\n```\n\
  \n#### Union Generalizations\n\n在简单情况下（通常只有单层深度的泛化层次结构），将超类的子类作为 `union` 数据类型直接保存在超类实例的存储空间中通常更方便。\n\
  \n```\nsubtype R1 union\nOff_Duty_Controller\nOn_Duty_Controller\nend\n```\n\n###\
  \ machine\n\n`machine` 语句用于为一个类定义状态模型，以捕获其生命周期行为。在 `machine` 语句内用于定义状态模型的语句在“状态模型定义”部分中给出。\n\
  \n```\nmachine\n# statements to define a state model for the enclosing class\nend\n\
  ```\n\n### population\n\n`population` 语句定义类实例群体的存储特性。类群体可以声明为 `dynamic`、`static`\
  \ 或 `constant`。如果没有 `population` 子句，则假定为 `population static`。如果实例在运行时创建和删除，则类群体是\
  \ `dynamic`。不在运行时创建和删除的类群体称为 `static`。这意味着实例的数量在域运行期间不会改变。`static` 的一个特例是 `constant`\
  \ 类群体。`constant` 群体既是静态的，又是只读的（其属性不会更新）。\n\n```\npopulation dynamic\n```\n\n###\
  \ slots\n\n`slots` 语句定义除初始实例占用的槽位之外分配的类实例存储槽位数。额外的槽位只能为动态的类群体定义。\n\n```\npopulation\
  \ dynamic\nslots 5\n```\n\n### class operation\n\n一个类可以通过使用 `class operation` 语句定义基于类的操作。类操作并非源自模型元素，而是为将公共代码分解到单个函数中而提供的实现构造。\n\
  \n```\nclass operation\nfindByName(\nchar const *name) : (struct Lubrication_Schedule\
  \ *) {\nThisClassRefVar(ls) ;\nPYCCA_selectOneStaticInstOfThisClassWhere(ls, strcmp(ls->Name,\
  \ name) == 0)\nreturn ls == ThisClassEndStorage ? NULL : ls ;\n}\n```\n\n### instance\
  \ operation\n\n`instance operation` 语句用于翻译基于实例的操作。实例操作有一个隐式的第一个参数，该参数是指向要执行操作的实例的指针。无需声明\
  \ `self` 变量，因为 `pycca` 会插入它。然而，由于这是 C 语言，在调用实例操作时，需要为隐含的 `self` 参数提供一个值。\n\n```\n\
  instance operation Max_system_pressure() {\nExternalOp(ALARM_Set_pressure_error)(PYCCA_idOfSelf)\
  \    ;\nClassRefVar(Autocycle_Session, acs) = self->R2 ;\nInstOp(Autocycle_Session,\
  \ Deactivate)(acs) ;\n}\n```\n\n### polymorphic event\n\n`polymorphic event` 语句声明一个或多个事件为多态的。多态事件只能为超类声明。\n\
  \n```\npolymorphic event\ne1\ne2\nend\n```\n\n### constructor\n\n`constructor` 语句为一个类定义构造函数。当该类的任何实例在运行时创建时，该函数仅使用隐式的\
  \ `self` 参数被调用。如果任何包含构造函数的类也指定了初始实例群体，`pycca` 将生成一个名为 `<domain name>_Ctor` 的函数，其中\
  \ `<domain name>` 被替换为域名。此函数将为所有定义了初始实例集并且也定义了构造函数的类的所有初始实例调用构造函数。用户需要在应用程序初始化阶段（例如，在初始化时调用的域操作中）调用此函数。\n\
  \n```\nattribute (int count)\nconstructor {\nself->count = 0 ;\n}\n```\n\n### destructor\n\
  \n`destructor` 语句为一个类定义析构函数。当该类的任何实例在运行时被销毁时，该函数仅使用隐式的 `self` 参数被调用。\n\n```\nattribute\
  \ (int count)\ndestructor {\nreportCount(self->count) ;\n}\n```\n\n\n\n## 状态模型定义\n\
  \n本节中的语句用于为类定义状态模型。状态模型定义语句必须包含在成对的 `machine` 和 `end` 语句中。为简洁起见，我们省略了外层的 `machine`\
  \ 和 `end` 语句。\n\n### `state`\n\n`state` 语句用于在状态模型中定义一个状态。一个状态具有名称，并且可能包含参数，这些参数作为导致进入该状态的事件的一部分传递给它。这些参数（如果有）列在状态名称后的括号中。一个状态关联一段\
  \ C 代码，该代码在进入该状态时执行。提供了一组预处理器宏，以方便与 ST/MX 运行时交互。这些宏在“活动宏”部分中讨论。\n\n```\nstate BUILDING_PRESSURE()\n\
  {\nif (self->Pressure > self->R4->Min_delivery_pressure) {\nPYCCA_generateToSelf(Above_inject_pressure)\
  \ ;\n}\n}\n```\n\n### `transition`\n\n`transition` 语句用于指定状态模型的转换行为。该语句列出了当前状态、事件和新状态。请注意，没有单独指定的事件列表。事件名称在其出现在\
  \ `transition` 语句中时被定义。由句点字符 (`.`) 组成的状态名称为伪初始状态，并将转换中的事件定义为创建事件。\n\n```\ntransition\
  \ BUILDING_PRESSURE - Above_inject_pressure -> INJECTING_AT_PRESSURE\n```\n\n###\
  \ `default transition`\n\n`default transition` 语句定义了任何未在 `transition` 语句中明确提及的转换的行为。默认转换可以是\
  \ `IG`，表示忽略该事件；或者 `CH`，表示该事件会导致错误条件。如果在状态模型定义中没有给出 `default transition` 语句，则假定为\
  \ `CH`。\n\n```\ndefault transition IG     # 忽略意外事件\n```\n\n### `initial state`\n\
  \n`initial state` 语句定义状态机的默认初始状态。如果在状态模型定义中没有给出 `initial state` 语句，则第一个定义的状态被视为默认初始状态。\n\
  \n```\ninitial state SLEEPING\n```\n\n### `final state`\n\n`final state` 语句定义一个状态，在该状态的活跃期执行完毕后，类的实例将被运行时自动删除。\n\
  \n```\nfinal state perish\n```\n\n## 活动宏\n\n本节总结了最常用的预处理器宏。此列表并不详尽，完整列表可在在线资料中找到。我们根据接口描述所操作模型元素将其分为几组。\n\
  \n### `ClassRefVar(c, v)`\n\n声明一个适合保存类实例引用的变量。\n\n| `c` | 实例所引用的类的名称。 |\n| `v` |\
  \ C 变量的名称。 |\n\n### `ClassConstRefVar(c, v)`\n\n声明一个适合保存对类实例引用的变量，该实例的实例数量是恒定的。\n\
  \n| `c` | 实例所引用的类的名称。 |\n| `v` | C 变量的名称。 |\n\n### `ClassRefSetVar(c, v)`\n\n声明一个适合引用一组类实例的变量。\n\
  \n| `c` | 实例集所引用的类的名称。 |\n| `v` | `C` 变量的名称。 |\n\n### `ClassConstRefSetVar(c, v)`\n\
  \n声明一个适合引用一组类实例的变量，该组实例的实例数量是恒定的。\n\n| `c` | 实例集所引用的类的名称。 |\n| `v` | 一个 C 变量的名称。\
  \ |\n\n### 事件\n\n发送事件是状态活动中的常见操作。\n\n#### 无参数事件\n\n对于事件不携带额外参数的常见情况，提供了多个宏来处理这三种事件类型。\n\
  \n###### `PYCCA_generate(e, c, i, s)`\n\n向一个实例发送事件信号。\n\n| `e` | 要发送的事件的名称。 |\n\
  | `c` | 接收事件的实例所属的类的名称。 |\n| `i` | 指向要接收事件的实例的指针。 |\n| `s` | 指向发送信号事件的实例的指针。如果事件源自实例上下文之外，则该值可以为\
  \ `NULL`。 |\n\n###### `PYCCA_generateToSelf(e)`\n\n向自身发送事件信号。\n\n| `e` | 要生成的事件的名称。\
  \ |\n\n###### `PYCCA_generatePolymorphic(e, c, i, s)`\n\n发送一个多态事件。\n\n| `e` | 要发送的多态事件的名称。\
  \ |\n| `c` | 接收事件的实例所属的类的名称。 |\n| `i` | 指向要接收事件的实例的指针。 |\n| `s` | 指向发送信号事件的实例的指针。如果事件源自实例上下文之外，则该值可以为\
  \ `NULL`。 |\n\n###### `PYCCA_generateCreation(e, c, s)`\n\n发送一个创建事件。\n\n| `e` |\
  \ 要发送的创建事件的名称。 |\n| `c` | 接收事件的实例所属的类的名称。 |\n| `s` | 指向发送事件的实例的指针。如果事件源自实例上下文之外，则该值可以为\
  \ `NULL`。 |\n\n###### `PYCCA_generateDelayed(e, c, i, s, d)`\n\n发送一个延迟事件。\n\n| `e`\
  \ | 要发送的事件的名称。 |\n| `c` | 接收事件的实例所属的类的名称。 |\n| `i` | 指向要接收事件的实例的指针。 |\n| `s` | 指向发送信号事件的实例的指针。如果事件源自实例上下文之外，则该值可以为\
  \ `NULL`。 |\n| `d` | 延迟时间，以毫秒为单位。 |\n\n###### `PYCCA_generateDelayedToSelf(e, d)`\n\
  \n向 `self` 发送一个延迟事件。\n\n| `e` | 要生成的事件的名称。 |\n| `d` | 延迟时间，以毫秒为单位。 |\n\n#### 带参数事件\n\
  \n因为事件可以携带补充数据，所以发送此类事件是一个三步过程：\n\n1. 获取一个事件控制块 (ECB)。对于三种事件类型，使用不同的宏来获取 `ecb`。\n\
  2. 填充事件数据。\n3. 将事件投递到适当的事件队列。\n\n例如，假设 `dog` 是类 `Dog` 的一个实例，并且 `Bark` 事件带有一个参数 `howLoud`。那么以下代码将向\
  \ `Dog` 的实例 `dog` 发送 `Bark` 事件。\n\n```\nMechEcb bark = PYCCA_newEvent(Bark, Dog,\
  \ dog, self) ;\nPYCCA_eventParam(bark, Dog, Bark, howLoud) = 20 ;\nPYCCA_postEvent(bark)\
  \ ;\n```\n\n###### `PYCCA_newEvent(e, c, i, s)`\n\n为普通事件返回一个 `MechEcb`。\n\n| `e`\
  \ | 要发送的事件的名称。 |\n| `c` | 接收事件的实例所属的类的名称。 |\n| `i` | 指向要接收事件的实例的指针。 |\n| `s` | 指向正在发送事件的实例的指针。如果事件源自实例上下文之外，则该值可以为\
  \ `NULL`。 |\n\n###### `PYCCA_newEventToSelf(e)`\n\n为普通事件返回一个 `MechEcb`，其中目标实例和发送信号事件的实例都是\
  \ `self`。\n\n| `e` | 要发送的事件的名称。 |\n\n###### `PYCCA_newPolymorphicEvent(e, c, i,\
  \ s)`\n\n为多态事件返回一个 `MechEcb`。\n\n| `e` | 要发送的事件的名称。 |\n| `c` | 接收事件的实例所属的类的名称。 |\n\
  | `i` | 指向要接收事件的实例的指针。 |\n| `s` | 指向发送信号事件的实例的指针。如果事件源自实例上下文之外，则该值可以为 `NULL`。 |\n\
  \n###### `PYCCA_newCreationEvent(e, c, s)`\n\n为创建事件返回一个 `MechEcb`。\n\n| `e` | 要发送的事件的名称。\
  \ |\n| `c` | 要从中创建实例的类的名称。 |\n| `s` | 指向正在发送事件的实例的指针。如果事件源自实例上下文之外，则该值可以为 `NULL`。\
  \ |\n\n###### `PYCCA_eventParam(ecb, c, e, p)`\n\n检索事件参数的值。\n\n| `ecb` | 指向事件控制块的指针。\
  \ |\n| `c` | 接收事件的实例所属的类的名称。 |\n| `e` | 要生成的事件的名称。 |\n| `p` | 事件参数的名称。 |\n\n######\
  \ `PYCCA_postEvent(ecb)`\n\n将 `ecb` 放置在非自定向的事件队列上。\n\n| `ecb` | 指向事件控制块的指针。 |\n\n\
  \n\n###### `PYCCA_postSelfEvent(ecb)`\n\n将 `ecb` 放置到自定向事件队列上。注意，创建事件不应被投递到自定向事件队列。\n\
  \n| `ecb` | 指向事件控制块的指针。 |\n\n###### `PYCCA_postDelayedEvent(ecb, d)`\n\n投递一个延迟信号。\n\
  \n| `ecb` | 指向事件控制块的指针。 |\n| `d` | 以毫秒为单位的延迟时间。 |\n\n#### 延迟信号操作\n\n延迟信号支持取消以及获取剩余延迟时间。\n\
  \n###### `PYCCA_cancelDelayed(e, c, i, s)`\n\n取消一个延迟信号。\n\n| `e` | 要取消的事件的名称。 |\n\
  | `c` | 接收事件的实例所属类的名称。 |\n| `i` | 指向将要接收事件的实例的指针。 |\n| `s` | 指向发送该事件的实例的指针。如果事件源自实例上下文之外，此值可为\
  \ `NULL`。 |\n\n###### `PYCCA_cancelDelayedToSelf(e)`\n\n取消一个发送给 `self` 的延迟事件。\n\n\
  | `e` | 要取消的事件的名称。 |\n\n###### `PYCCA_remainDelayed(e, c, i, s)`\n\n获取延迟信号的剩余时间。\n\
  \n| `e` | 要查询的事件的名称。 |\n| `c` | 接收事件的实例所属类的名称。 |\n| `i` | 指向将要接收事件的实例的指针。 |\n| `s`\
  \ | 指向发送该事件的实例的指针。如果事件源自实例上下文之外，此值可为 `NULL`。 |\n\n###### `PYCCA_remainDelayedToSelf(e)`\n\
  \n获取一个自定向延迟信号的剩余时间。\n\n| `e` | 要查询的事件的名称。 |\n\n### 实例的创建与删除\n\n类的实例可以在运行时创建和销毁。这些宏有助于对接实例管理机制。\n\
  \n#### `PYCCA_newInstance(c)`\n\n在默认初始状态下创建一个类的实例。\n\n| `c` | 要创建的实例所属类的名称。 |\n\n\
  #### `PYCCA_destroyInstance(i)`\n\n销毁一个类的实例。\n\n| `i` | 指向要删除的实例的指针。 |\n\n### 实例选择\n\
  \nPycca 提供了用于遍历实例并根据特定条件选择实例的宏。\n\n#### `PYCCA_selectOneInstWhere(i, c, expr)`\n\
  \n此宏展开为对名为 `c` 的类进行线性搜索，以查找第一个使 `expr` 为真的实例。展开后的代码会搜索 `c` 的存储池，停在第一个正在使用且满足 `expr`\
  \ 的实例处。`Expr` 应包含以 `i->a` 形式对 `c` 的属性的访问。`i` 变量的值会被修改，在循环结束时，它要么指向 `c` 中 `expr`\
  \ 求值为非零的第一个实例，要么指向该类存储池的末尾（由 `EndStorage(c)` 宏给出，即如果 `i >= EndStorage(c)`，则搜索失败）。注意，此宏会测试实例当前是否已分配，因此仅对动态分配或具有状态机的类有用。\n\
  \n| `i` | 一个变量的名称，该变量是指向 `c` 类实例的指针。 |\n| `c` | 与 `i` 对应的实例所属类的名称。 |\n| `expr` |\
  \ 一个将被解释为布尔值的 C 表达式。 |\n\n#### `PYCCA_forAllInst(i, c)`\n\n此宏是一个便捷宏，用于设置一个遍历某类所有实例的循环。该宏后面应跟一个语句（可以是复合语句并用花括号\
  \ (`{}`) 括起来）。在该语句中，`i` 将依次取类 `c` 所定义的每个实例的值。\n\n| `i` | 一个变量的名称，该变量是指向 `c` 类实例的指针。\
  \ |\n| `c` | 与 `i` 对应的实例所属类的名称。 |\n\n```\nClassRefVar(Autocycle_Session, acs) ;\n\
  PYCCA_forAllInst(acs, Autocycle_Session) {\nif (IsInstInUse(acs)) {\nPYCCA_generate(Created,\
  \ Autocycle_Session, acs, NULL) ;\n}\n}\n```\n\n#### `PYCCA_forAllRelated(v, i,\
  \ r)`\n\n此宏是一个便捷宏，用于设置一个循环，遍历与某类相关的实例。此宏假定这些相关实例是使用 `->>c` 语法声明的（相关实例属于计数类型）。该宏后面应跟一个语句（可以是复合语句并用花括号\
  \ (`{}`) 括起来）。在该宏中，`v` 应声明为 `ClassRefSetVar` 或 `ClassRefConstSetVar`。然后 `v` 会在相关实例的集合上进行迭代。\n\
  \n| `v` | 引用集变量的名称。 |\n| `i` | 实例引用变量的名称。 |\n| `r` | 迭代所跨越的关系的名称。 |\n\n```\nClassRefConstSetVar(Injector,\
  \ myinjs) ;\nPYCCA_forAllRelated(myinjs, self, R5) {\nClassRefVar(Injector, inj)\
  \ = *myinjs ;\nClassRefVar(Autocycle_Session, acs) = inj->R2 ;\nInstOp(Autocycle_Session,\
  \ Deactivate)(acs) ;\n}\n}\n```\n\n#### `PYCCA_forAllRelatedTerm(v, i, r)`\n\n此宏与\
  \ `PYCCA_forAllRelated()` 相同，区别在于该关系必须使用 `->>n` 语法声明（关系存储由一个以 `NULL` 结尾的实例指针数组组成）。\n\
  \n| `v` | 引用集变量的名称。 |\n| `i` | 实例引用变量的名称。 |\n| `r` | 迭代所跨越的关系的名称。 |\n\n#### `PYCCA_forAllLinkedInst(o,\
  \ r, l)`\n\n遍历使用链表实现的一对多关系中的实例。此宏与 `PYCCA_forAllRelated` 类似，区别在于该关系必须使用 `->>l` 语法声明（关系存储通过链表实现）。此宏展开为一个循环结构，在该结构中，所有通过关系\
  \ `r` 与 `o` 相关的实例都会被访问。链接变量 `l` 被依次赋值为与 `o` 相关（处于多端）的链接的值。链接变量 `l` 的值不是指向实例的指针。必须使用此处描述的\
  \ `PYCCA_linkToInstRef()` 宏来恢复实例指针。\n\n| `o` | 指向一端实例的指针。 |\n| `r` | 关系的名称。 |\n\
  | `l` | 类型为 `rlink_t *` 的变量的名称。 |\n\n```\nrlink_t *czlink ;\nPYCCA_forAllLinkedInst(ondc,\
  \ R2, czlink) {\nClassRefVar(Control_Zone, found) =\nPYCCA_linkToInstRef(czlink,\
  \ Control_Zone, R2) ;\nif (strcmp(rcvd_evt->zone, found->Name) == 0) {\nhoff_zone\
  \ = found ;\nbreak ;\n}\n}\n```\n\n#### `PYCCA_linkToInstRef(l, c, r)`\n\n此宏将类型为\
  \ `rlink_t *` 的链接指针（该链接是关系 `r` 中的一个链表节点）转换为指向类 `c` 实例的指针。\n\n| `l` | 类型为 `rlink_t\
  \ *` 的变量的名称。 |\n| `c` | `l` 所指关系多端类的名称。 |\n| `r` | 关系的名称。 |\n\n### 实例标识符\n\n在调用外部操作时，使用一种方法来识别域外特定类的实例是很有用的。实例的指针值不适合此目的，但实例在其存储池中的数组索引是令人满意的。此组中的宏提供了一种方法，可以为实例生成一个可用作域外标识符的小整数，或者将实例标识符转换为指向该实例的指针引用。\n\
  \n#### `PYCCA_idOfSelf`\n\n为 `self` 引用生成一个整数标识符。\n\n```\nExternalOp(ALARM_Clear_lube_level_very_low)(PYCCA_idOfSelf)\
  \ ;\n```\n\n#### `PYCCA_idOfRef(c, r)`\n\n为类 `c` 的引用 `r` 生成一个整数标识符。\n\n| `c` | 类的名称。\
  \ |\n| `r` | 类 `c` 成员的引用值。 |\n\n#### `PYCCA_refOfId(c, i)`\n\n返回一个对类 `c` 实例的实例引用，该实例由整数标识符\
  \ `i` 标识。\n\n| `c` | 类的名称。 |\n| `i` | 该类实例的整数标识符。 |\n\n\n\n### `PYCCA_checkId(c,\
  \ i)`\n\n生成对 `assert()` 宏的调用，以测试标识符 `i` 对于类 `c` 是否有效。当某个领域操作接受一个代表实例的整数标识符并希望断言其有效性时，此宏非常有用。\n\
  \n| `c` | 类的名称。 |\n| --- | --- |\n| `i` | 该类实例的整数标识符。 |\n\n```\nPYCCA_checkId(Autocycle_Session,\
  \ sessionId) ;\nClassRefVar(Autocycle_Session, session) =\nPYCCA_refOfId(Autocycle_Session,\
  \ sessionId) ;\nif (IsInstInUse(session)) {\nInstOp(Autocycle_Session, Suspend)(session)\
  \ ;\n}\n```\n\n### 导航泛化关系\n\n当泛化关系实现为 `union` 数据类型时，子类型的实例不使用指针来导航到超类型。相反，只需对 `self`\
  \ 指针进行向上转型即可获得指向超类型的指针。\n\n#### `PYCCA_unionSupertype(sub, supc, r)`\n\n导航到包含在联合体中的实例的超类型。\n\
  \n| `sub` | 指向子类型实例的指针。通常是 `self`。 |\n| --- | --- |\n| `supc` | 超类型类的名称。 |\n| `r`\
  \ | 关系的名称。 |\n\n**警告**\n\n在此上下文中向上转型与在任何其他上下文中向上转型同样危险且容易出错。如果 `sub` 不是类 `supc`\
  \ 的子类型，此宏将静默地产生错误结果，因为它涉及编译器无法检查的显式转换。\n\n通过获取生成的联合体结构中子类型成员的地址来实现对子类型的导航。此宏隐藏了子类型成员的命名约定。\n\
  \n#### `PYCCA_unionSubtype(sup, r, subc)`\n\n导航到包含在联合体中的子类型实例。\n\n| `sup` | 指向超类型实例的指针。通常是\
  \ `self`。 |\n| --- | --- |\n| `r` | 关系的名称。 |\n| `subc` | 子类型类的名称。 |\n\n```\nClassRefVar(On_Duty_Controller,\
  \ new_ondc) =\nPYCCA_unionSubtype(new_controller, R1, On_Duty_Controller) ;\n```\n\
  \n#### `PYCCA_isSubtypeRelated(sup, supc, r, subc)`\n\n确定一个超类型实例当前是否与给定子类型的某个实例相关。如果\
  \ `sup` 与子类型类 `subc` 的某个实例通过关系 `r` 相关联，则返回 `true`。\n\n| `sup` | 指向超类型实例的指针。通常是 `self`。\
  \ |\n| --- | --- |\n| `supc` | 超类型类的名称。 |\n| `r` | 关系的名称。 |\n| `subc` | 子类型类的名称。\
  \ |\n\n#### `PYCCA_migrateSubtype(i, supc, r, subc)`\n\n更改超类型实例的子类型。对于泛化关系，超类型维护一个编码值，指示其当前关联的子类型。此宏更改该编码值。\n\
  \n| `i` | 指向超类型的实例指针。 |\n| --- | --- |\n| `supc` | 超类型类的名称。 |\n| `r` | 泛化关系的名称。\
  \ |\n| `subc` | 子类型类的名称。 |\n\n```\nPYCCA_migrateSubtype(self, Air_Traffic_Controller,\
  \ R1, Off_Duty_Controller) ;\n```\n\n#### `PYCCA_initUnionInstance(sup, r, subc)`\n\
  \n将包含在基于联合体的超类型中的子类型实例初始化为其默认初始状态。当联合体内的子类型发生迁移时，如果该子类型具有状态模型，则需要将体系结构结构初始化为新子类型的结构。此宏实现此目的。请注意，此宏不会运行子类型的任何构造函数。对于具有构造函数的子类型，需要显式调用。\n\
  \n| `sup` | 指向超类型实例的指针。通常是 `self`。 |\n| --- | --- |\n| `r` | 关系的名称。 |\n| `subc`\
  \ | 子类型类的名称。 |\n\n#### `PYCCA_relateSubtypeByRef(s, supc, r, t, subc)`\n\n将超类型实例与子类型实例关联起来（当关系通过引用存储时）。\n\
  \n| `s` | 指向超类型实例的指针。通常是 `self`。 |\n| --- | --- |\n| `supc` | 超类型类的名称。 |\n| `r`\
  \ | 关系的名称。 |\n| `t` | 指向目标子类实例的指针。 |\n| `subc` | 子类型类的名称。 |\n\n## 书籍\n\n- Stephen\
  \ J. Mellor 和 Marc J. Balcer，*可执行 UML：模型驱动架构的基础*，Addison-Wesley (2002)，ISBN 0-201-74804-5。\n\
  - Chris Raistrick 等，*使用可执行 UML 的模型驱动架构*，Cambridge University Press (2004)，ISBN 0-521-53771-1。\n\
  - Leon Starr，*可执行 UML：如何构建类模型*，Prentice Hall (2001)，ISBN 0-13-067479-6。注意：本版已绝版，但覆盖所有模型方面的新扩展版计划于\
  \ 2018 年出版，出版商待定。\n- Sally Shlaer 和 Stephen J. Mellor，*面向对象系统分析：在数据中为世界建模*，Prentice\
  \ Hall (1988)，ISBN 0-13-629023-X。\n- Sally Shlaer 和 Stephen J. Mellor，*对象生命周期：在状态中为世界建模*，Prentice\
  \ Hall (1991)，ISBN 0-13-629940-7。\n- Lex de Hann 和 Toon Koppelaars，*数据库专业人员应用数学*，Apress\
  \ (2011)，ISBN 1-43024-248-1。\n- Fredrick P. Brooks，*人月神话（周年纪念版，新增四章）*，Addison-Wesley\
  \ (1995)。\n- *ACM 编程语言与系统通讯* 1, 3 (1992 年 9 月)，213–226。\n\n## 论文\n\n- E.F. Moore，“论序贯机器的思想实验”，*自动机研究*，普林斯顿大学出版社，普林斯顿，新泽西州\
  \ (1956 年)，第 129–153 页。\n- George H. Mealy，“一种综合时序电路的方法”，*贝尔系统技术杂志* (1955 年)，第 1045–1079\
  \ 页。\n- Christopher W. Fraser、David R. Hanson 和 Todd A. Proebsting，“设计一个简单高效的代码生成器生成器”，*ACM\
  \ 编程语言与系统通讯* 1, 3 (1992 年 9 月)，213-226。\n- [`http://faculty.salisbury.edu/~xswang/Research/Papers/SERelated/no-silver-bullet.pdf`](http://faculty.salisbury.edu/%7Exswang/Research/Papers/SERelated/no-silver-bullet.pdf)\n\
  \n## 文章\n\n- Leon Starr，“[如何构建清晰的 UML 类模型](http://www.modelint.com/how-to-build-articulate-uml-class-models)\
  \ 并从 UML 中获得真正收益”(2008) 最初发表于 [`www.uml.org/news.htm`](http://www.uml.org/news.htm)。也可查阅\
  \ [`www.modelint.com/mbse`](http://www.modelint.com/mbse) 和 [`www.executableuml.org`](http://www.executableuml.org)。\n\
  - Leon Starr，“[可执行 UML 中的时间与同步](http://www.modelint.com/time-and-synchronization-in-executable-uml)”(2008)\
  \ 论文和视频可在 [`www.modelint.com/mbse`](http://www.modelint.com/mbse) 和 [`www.executableuml.org`](http://www.executableuml.org)\
  \ 获取。\n\n## 在线资源与作者联系方式\n\n![A421575_1_En_BookBackmatter_Figu_HTML.gif](img/A421575_1_En_BookBackmatter_Figu_HTML.gif)\n\
