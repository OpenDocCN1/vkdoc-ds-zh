  \ DB 会这样安排：每当一条记录被插入客户数据库时，一条对应的记录就会被插入客户电子邮件索引。通过电子邮件地址查找客户，涉及从客户电子邮件索引中获取与电子邮件地址匹配的记录，然后使用该记录的值部分作为键来查找客户数据库中的记录。\n\
