  ## 确保引用完整性


  确保引用完整性是我们考虑的最后一个概念。在我们微控制器目标的 ST/MX 中，没有提供在运行时检查实例之间引用完整性的机制。MX 领域假设模型已经正确处理了这一点，并且转换过程不提供额外的保证。这是这类目标常见的权衡。强制实施引用完整性所需的代码和数据量相当大，而部署在此类目标上的应用程序的动态活动量却很小，因此通常的权衡是通过细致的模型审查、模拟和测试来验证引用完整性，而非在运行时验证。


  然而，在这个特定的 MX 领域中，我们可以做得更好。Berkeley DB 支持外键索引的概念。在这种安排下，引用属性可以作为辅助索引中的键，然后用于限制记录的添加，除非该记录的键存在于关联的数据库中。这使得我们能够在领域执行时强制实施一种有限形式的引用完整性检查。


  回到我们的`Injector`/`Machinery`示例，我们希望确保添加到 Injector 数据库的任何记录，其`Injector.Machinery`的值都与
  Machinery 数据库中`Machinery.ID`的值匹配。我们已经构建了 R5 索引，因此可以将其用作外键索引，发挥另一重作用。如图 10-8 所示。


  ![A421575_1_En_10_Fig8_HTML.gif](img/A421575_1_En_10_Fig8_HTML.gif)


  **图 10-8.** 用于引用完整性的外键索引


  每次向 Injector 数据库添加一条记录时，Berkeley DB 都会向 R5 索引添加一条记录，就像添加任何辅助索引一样。由于 R5 索引也作为外键索引与
  Machinery 数据库关联，因此只有当其键值与 Machinery 数据库中的某个现有键值匹配时，才会添加该记录。如果在向 R5 索引添加记录时没有匹配项，则插入失败，并且该记录也不会被添加到
  Injector 数据库。此行为确保了所有 Injector 记录引用的 Machinery 记录都是存在的。对于删除的记录，也会采取相应的操作。


  现在，我们可以将 R5 索引作为外键索引关联到 Machinery 数据库：


  ```

  dbres = machdb->associate_foreign(machdb, R5db, NULL, DB_FOREIGN_ABORT) ;

  if (dbres != 0) {

  handle_error(dbres, "Failed to associate R5 index as foreign key") ;

  }

  ```


  在本节中，我们仅对如何在 MX 领域中将 Berkeley DB 用作数据管理组件进行了最简要的概述。显然，要基于这些想法完全开发出一个 MX 领域，还有许多工作要做。所示的代码示例是特定于`Injector`/`Machinery`示例的。在实际的
  MX 领域中，代码操作将被泛化以处理领域中的所有类。为了了解泛化数据管理所需的数据，我们将考虑一个处理此处所述想法的平台模型片段。




  ### 平台模型差异


  我们通过 Berkeley DB 管理类数据的方式与将所有数据保存在主内存中的方式大相径庭。对于 ST/MX，我们舍弃标识符，转而使用指针来存储关系导航所需的信息。ST/MX
  的平台模型反映了这些选择，其类直接与指向类实例的引用相关联。这在第 9 章的平台模型片段中已有展示。


  在 Berkeley DB 的示例中，我们决定使用标识符和引用属性来创建键/值数据库、二级索引和外键索引。这种用法恰好映射到了 Berkeley DB 提供的功能上。我们不认为这是巧合。标识符和引用属性的概念是数据关系模型的基础，该模型已有大量研究和数学基础，并在许多场景中被证明是卓有成效的。Berkeley
  DB 只是另一个例证。这个例子之所以更有趣，是因为它应用于键/值存储机制的情境中。这两种情况的平台模型差异显著。图 10-9 展示了一个可与使用 Berkeley
  DB 管理数据的 MX 领域结合使用的平台模型片段。


  ![A421575_1_En_10_Fig9_HTML.gif](img/A421575_1_En_10_Fig9_HTML.gif)


  图 10-9.


  类标识符和引用的平台模型


  我们再次重申，尽管类名如此，但此模型中的类对应的是特定于平台的实体。因此，此模型中的 `Class` 类是模型级 `Class` 的特定于平台的对应物。


  R4 关联要求每个 `Class` 至少有一个 `Identifier`。标识符由一个或多个 `Attributes`（R5）组成。一个 `Attribute`
  可以是多个 `Identifier`（甚至不隶属任何 `Identifier`）的一部分。这并非不寻常的情况，尽管在此示例中并未出现。以 Injector/Machinery
  示例为例，表 10-5、10-6 和 10-7 展示了这些平台模型类的填充，分别建立了类、标识符和属性。请注意，我们仅展示了示例片段的填充。对于整个领域，其他类还会有许多其他表行。


