  \  struct pycca_class_portal const *classes = portal->classes + class ;     // ❶\n\
  \        if (inst numInsts) {\n            MechInstance instRef = (MechInstance)((char\
  \ *)classes->storage +                      classes->instSize * inst + classes->instOffset)\
  \ ;          // ❷\n            if (attr numAttrs) {\n                struct pycca_attr_portal\
  \ const *attrs = classes->attrs + attr ;  // ❸\n                if (classes->hasCommon\
  \ == false || instRef->alloc != 0) {        // ❹\n                    if (!classes->isConst)\
  \ {                                     // ❺\n                        void *dst\
  \ = (void *)((char *)instRef + attrs->offset) ;\n                        result\
  \ = size size ? size : attrs->size ;       // ❻\n                        memcpy(dst,\
  \ src, result) ;\n                    } else {\n                        result =\
  \ PYCCA_PORTAL_NO_UPDATE ;\n                    }\n                } else {\n  \
  \                  result = PYCCA_PORTAL_UNALLOC ;\n                }\n        \
