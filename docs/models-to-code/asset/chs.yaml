  \ DB`函数在`MX`领域中可能如何出现，以及如何用`C`代码实现模型数据管理到`Berkeley DB`的映射。我们不期望您成为`Berkeley DB`专家并识别每个库调用。相反，您可以大致了解数据管理是如何编码的，而数据库库调用的文档对于那些希望深入研究的人来说是现成的。您还可以很好地感受到在`ST/MX`中将所有内容保存在内存中的数据管理，与使用键/值对存储机制相比，有多么不同。\n\
