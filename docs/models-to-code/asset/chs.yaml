  ### 总结


  在本章中，我们针对 SIO 领域展示了一个模型和转换方法。该领域通过传感数值和控制执行器来处理与外部世界的交互。我们重点关注了润滑领域委托给 SIO 领域的两个具体能力：


  *   对传感器数值进行采样

  *   将采样数值与阈值进行比较


  对于数值采样，我们的模型包含一个分配器状态模型，用于管理电子设计中物理布局固有的竞争问题。


  对于数值阈值，我们了解了一个附加到关联类上的状态模型如何提供对同一输入点应用多个阈值限制的追踪手段。


  在这两种情况下，我们都看到了应用于从外部世界收集和评估数据的规则与策略。从 SIO 领域的角度来看，数据的数值和含义并不重要。从润滑领域的角度来看，它需要当前最新的数据值，而电子设计如何影响数据获取的规则并不重要。这种关注点分离使我们能够专注于为两个领域开发一套一致的抽象，并有可能在其他具有类似与外部世界交互需求的应用程序中重用
  SIO 领域。


