  SIO 域提供了将 `Continuous Input Points` 的值与 `Point Threshold` 提供的限制进行比较的能力，并确定一个点值相对于
  `Point Threshold` 是处于范围内还是范围外。此比较操作由 `Range Limitation` 类的生命周期捕获。由 `Range Limitation`
  类中介的 `Continuous Input Points` 和 `Point Thresholds` 之间的关联，允许将一个点与多个阈值进行比较，也允许将一个阈值应用于多个点。因此，要配置
  SIO 域以监控压力警报，意味着我们必须仔细填充 `Point Threshold` 和 `Range Limitation` 实例，以匹配 `Injectors`
  的期望。在更新 `Injector.Pressure` 值时，我们已经看到在 SIO 中填充了三个对应于喷油器压力的 `Continuous Input Points`。这些点的值与限制进行比较，以决定是否存在压力警报。图
