  ## 讨论


  有许多指定算法计算的好方法。图 2-7 展示了“登录”活动的数据流表示。


  ![A421575_1_En_2_Fig7_HTML.gif](img/A421575_1_En_2_Fig7_HTML.gif)


  图 2-7. 数据流对一项活动进行建模


  图中的每个椭圆代表一个动作。当一个动作的所有输入都可用时，该动作便可以执行。来自无源箭头和类数据存储（平行线）的数据在进入状态时可用。虚线箭头不提供数据，但会传递一个控制令牌，以表示源动作完成。`Migrate`、`Logged
  In Signal` 和 `Select` 动作可以在进入状态后立即执行。`Write` 和 `Link` 动作必须等待 `Migrate` 完成。最后，`In
  Use Signal` 动作可以执行。


  数据流表示法仅在问题空间必需时才指定顺序。因此，它凸显了在实现中进行并发处理的机会。不足之处在于，数据流图可能难以绘制和编辑，并且当你试图理解其顺序时，可能会让你感到头疼。


  基于文本的动作语言在阅读、编写和编辑方面要容易得多，也更为熟悉。你可以依靠你最喜欢的文本编辑器的熟悉度和强大功能来完成任务。一些文本动作语言并不试图消除任意的顺序。另一些则通过使用文本符号而非图形符号来模拟数据流的并发性。在本书中，我们使用
  `Scrall` 作为一种伪动作语言，因为它像文本一样易于编辑，并且可以映射到数据流表示，以便进行下游翻译。其主要元素在附录 B 中进行了总结。


  一个状态活动中固有的并发性有多少能够以并行执行的方式实现，取决于翻译机制和目标平台。我们针对的平台只有一个单处理器核心，因此无法实现真正的并行执行。能力更强的目标平台允许翻译机制安排模型中的并发性如何以并行执行的方式实现。


  为什么不直接用 `C` 语言编写动作呢？这类建模的全部意义在于，以独立于实现的方式捕捉问题的逻辑。我们希望用非 `C` 概念来指定动作，例如对象状态机通信、通过复合关系进行数据访问以及实例集操作。通过将所有模型方面（类、状态和动作）保持在相同的抽象级别上，我们获得了一套一致且统一的规则，并在翻译过程中增加了选择更广泛高效实现的机会。这也使得建模更加容易，因为我们可以专注于处理逻辑，而无需考虑编程语言语法和语义的所有细节。


  ### 执行模型


  现在，我们示例应用程序的所有三个方面都已建模，我们可以将它们作为一个整体来执行，以验证其行为是否正确。这可以在编写或生成任何代码之前（并且应该）完成。执行规则的完整描述可以在本章前面提到的可执行
  UML 书籍中找到。这些规则也在附录 A 中进行了总结。在这里，我们只想通过一个简单的场景演练，让你对模型如何执行有所了解。


  对于这个场景，我们将尝试通过登录到一个可用的`值班站`来激活一个`待机管制员`。假设 `ATC53` 处于`待机`状态，并且要选择的`值班站` `DS3` 正在`可用`状态中等待。一个
  `Ready for Duty( DS3 )` 事件将被发送给 `ATC53` 以启动整个过程。`DS3` 值作为期望的`值班站`编号被传入。`值班站`的选择发生在我们的系统之外，我们的模型只是被告知
  `ATC53` 正在尝试使用 `DS3`。然而，我们的模型必须确保在允许此事发生之前满足某些条件。


  收到该事件后，`ATC53` 进行转换，进入`验证休息是否充足`状态，并在进入该状态时执行活动。`验证休息是否充足`活动会检查是否已休息了足够长的时间。假设已经休息充足，`ATC53`
  会向自身发送一个 `Log in( DS3 )` 事件信号。完成该活动后，`ATC53` 接着接收同一个 `Log in` 事件，将其匹配到一个迁出转换，并进入`登录中`状态。


  `ATC53` 执行`登录中`活动，该活动导致其从下班状态迁移到上班状态（删除下班子类实例，并创建一个引用同一超类实例的上班子类实例），将新的 `ATC53`
  上班子类实例链接到 `DS3`，并记录当前时间以及发送信号——这次是两个事件：`ATC53` 向自身发送一个 `Logged in` 事件信号，并向 `DS3`
  发送一个 `In use` 事件。信号的发送没有特定顺序，这一点只有从 DFD 中才能明显看出。


  现在我们有待处理两个事件，每个事件都将被消费，同样没有要求的顺序。当 `Logged in` 事件被 `ATC53` 处理时，它会转换到`值班中`状态。当 `DS3`
  消费 `In Use` 事件时，它会转换到`使用中`状态，并向自身发送一个延迟的 `Max shift exceeded` 事件，延迟时间由单例`班次规格`实例中指示的`最长班次`时长决定。本质上，设置了一个超时，以便如果值班的空中交通管制员没有休息，该延迟事件就会被触发，并在`超时班次`状态中触发警告。


  至此，场景完成。`ATC53` 已成功登录到值班站 `DS3`。请注意，状态模型和动作为非特定实例指定了行为，这些行为在运行时由各个实例消费事件并从一种状态遍历到另一种状态来解释。


  我们的场景巧妙地回避了这样一种可能性：一个实例在给定状态下消费一个事件，而该状态没有指定任何转换。这种情况通过构建状态表来解决，每个状态模型都需要一个状态表。状态表显示了如果出现意外事件，或者如果预期事件在实例准备好或未准备好时到达，实例将如何反应。第
  3 章将详细讨论状态表。


  ### 标准动作语言


  我们在第 1 章中区分了细化方法和翻译方法。在 UML 出现时，细化方法占主导地位——没有人认为需要动作语言。但少数人坚持了下来，几年后，UML 终于有了一种动作语言，即基础
  UML 的动作语言，或称 `Alf`。其规范可以在对象管理组织网站（[`www.omg.org`](http://www.omg.org)）上找到。


  该规范长达 439 页——比本书还要长。我们无意教你该语言的细节，或任何其他语言的细节。相反，我们希望利用动作语言的概念来展示翻译是如何工作的。因此，我们使用了一种自创的非正式语言，希望你能以最小的努力直观地理解它。我们在附录
  B 中描述了这种语言。


  使用非正式语言来执行充其量只能说是非常奇特。但另一种选择是教你另一种语言，而这并非本书的目的。此外，我们希望揭示从模型到代码所需的步骤。因此，我们在后续章节中正式化了这些动作。看起来我们好像写了两次代码。其实并非如此。我们只是在绕过形式化语言的细节。




  ## 摘要


  我们以一个模糊且不完整的需求集为起点，引入了一个简单的应用程序，并将其转化为一组具体且可执行的模型。这些模型可通过一套精简的执行规则来运行，而这些规则使得我们能够像单步执行运行代码一样，逐步推演和测试应用程序场景。执行规则和语义被组织为三个层面：一个单一的类模型、每个类的状态模型，以及每个状态中分别对应已建模数据、已建模控制和已建模计算的、有意义的行为与动作。模型按此顺序构建，以最大限度地减少重构。


  我们尚未在模型中包含任何实现概念。我们通过发送信号来协调状态机，但并未说明这些信号是如何发送的；我们提到了类实例之间存在关联，但同样未说明这些关联是如何实现的。正如我们在第
  1 章所述，排除并非意味着删除该细节，也不是对其进行弃用。实现至关重要，这正是本书的主题。


  从此以后，我们的焦点将转向转换。我们将把这些模型元素，以及由建模语言定义的执行行为，映射到一个特定平台的 C 代码包中，该代码包将在目标平台支持的计算设备上运行。当我们专注于代码生成时，我们不会质疑应用程序需求，也不会试图扩展或修改应用范围。相反，我们假设建模者清楚自己在做什么，将模型原样编码，使其在可测试的环境中运行，然后转向下一个应用程序。如果模型没有覆盖需求，那么代码同样不会覆盖需求！


