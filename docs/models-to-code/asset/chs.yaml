  \ portal 函数的例子：`pycca_update_attr`。所有 portal 函数都返回一个 `int` 值。返回值小于零表示错误，返回值大于或等于零表示成功。`pycca_update_attr`\
  \ 函数更新给定类的给定实例中的属性值。此处，成功的返回值表示复制到属性中的字节数：\n\n* ❶ 索引到类描述符。\n* ❷ 计算指向类实例的指针。\n* ❸\
