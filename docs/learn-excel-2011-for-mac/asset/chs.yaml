  \ 7–9）。\n\n**注意：** 你也可以通过功能区打开“设置坐标轴格式”对话框。单击“格式”选项卡，转到“当前所选内容”框，打开下拉菜单并单击“垂直（值）轴”。然后点击下方的“设置所选内容格式”按钮。你也可以单击垂直轴并选择菜单栏中的“设置坐标轴格式”，或按`Cmd+1`组合键。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-243_1.png)\n\
  \n**第 7 章：创建清晰且具有说服力的图表**\n\n**241**\n\n**图 7–9.** *你可以设置坐标轴格式，以控制其值、主要刻度单位和次要刻度单位，以及图表是否显示单位（例如千）。当你在“设置坐标轴格式”对话框的“坐标轴选项”中操作时，Excel\
  \ 会应用更改。*\n\n**2.** 使用“值轴刻度”区域中的控件设置轴上的值：\n\n- **最小值：** 如果希望`Excel`自动设置轴上的最小值，请选中“最小值”复选框。若要自行设置，请单击文本框并键入数值，`Excel`会自动为你清除复选框。\n\
  \n- **最大值：** 如果希望`Excel`自动设置轴上显示的最大值，请选中“最大值”复选框。若要自行设置，请单击文本框并键入数值，`Excel`会自动为你清除复选框。\n\
  \n- **主要刻度单位：** 如果希望`Excel`决定轴上主要刻度单位之间的间隔，请选中“主要刻度单位”复选框。若要自行设置，请单击文本框并键入数值，`Excel`会自动为你清除复选框。根据图表的大小，你通常希望在设定的最小值与最大值之间包含五到十个主要刻度单位。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**242**\n\n**第 7 章：创建清晰且具有说服力的图表**\n\
  \n- **次要刻度单位：** 如果希望`Excel`决定轴上次要刻度单位之间的间隔，请选中“次要刻度单位”复选框。若要自行设置，请单击文本框并键入数值，`Excel`会自动为你清除复选框。根据图表显示的内容，每个主要刻度单位下通常需要四到十个次要刻度单位。\n\
  \n**3.** 在“刻度”窗格的中间部分，选择是否显示图表使用的单位。例如，在“显示单位”下拉菜单中，选择“百”、“千”或“百万”等项。如果选择显示单位，请确保选中“在图表上显示显示单位标签”复选框，这样`Excel`将显示一个标签来指明单位。如果不想显示单位，请在“显示单位”下拉菜单中选择“无”。\n\
  \n**4.** 在“刻度”窗格的下半部分，根据需要选择选项：\n\n- **对数刻度：** 如果图表需要使用对数刻度而非算术刻度，请选中“对数刻度”复选框，然后在“底数”框中输入对数的底数。例如，输入`10`表示刻度将按等间距使用值`1`、`10`、`100`、`1000`、`10000`等。\n\
  \n- **数值反转：** 对于某些图表，将数值按倒序排列（例如，最小值在上方而非最大值）会很有帮助。当需要此设置时，请选中此复选框。\n\n- **横坐标轴交叉于最小值：**\
  \ 如果希望图表的基底在最小值处（而非零值处）与垂直轴交叉，请选中此复选框。\n\n- **显示单位：** 如果你希望图表显示单位（百、千、百万等），请在此下拉菜单中选择单位。`Excel`会相应地缩减显示的数值；例如，`1000000`将显示为`1`，并在刻度旁边显示“百万”。这有助于使坐标轴更易于阅读。\n\
  \n**5.** 在左窗格中，单击“刻度线”项以显示“刻度线”窗格（见图 7–10），然后设置刻度线的位置：\n\n- **主要刻度线类型：** 在此框中，选择“内部”单选按钮可使主要刻度线显示在图表内部，选择“外部”单选按钮使其显示在外部（坐标轴一侧），或选择“交叉”单选按钮使其显示在两侧。如果不想要主要刻度线，请选择“无”单选按钮。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-245_1.png)\n\
  \n**第 7 章：创建清晰且具有说服力的图表**\n\n**243**\n\n**图 7–10.** *使用“设置坐标轴格式”对话框“刻度线”窗格中的控件来控制坐标轴上刻度线的显示方式。*\n\
  \n- **次要刻度线类型：** 在此框中，选择“内部”单选按钮可使次要刻度线显示在图表内部，选择“外部”单选按钮使其显示在外部（坐标轴一侧），或选择“交叉”单选按钮使其显示在两侧。如果不想要次要刻度线，请选择“无”单选按钮。\n\
  \n- **坐标轴标签：** 在此框中，选择“轴旁”单选按钮可使标签显示在坐标轴旁边。选择“高”单选按钮可使标签显示在图表的高侧，选择“低”单选按钮可使标签显示在低侧。选择“无”单选按钮可隐藏标签。\n\
  \n**6.** 对坐标轴设置满意后，单击“关闭”按钮关闭“设置坐标轴格式”对话框。\n\n##### 向图表添加图例\n\n许多图表受益于添加图例，以汇总不同数据系列使用的颜色。可以通过选择图表，依次选择“图表布局”→“标签”→“图例”，然后选择所需的放置位置：图例在右侧显示、图例在顶部显示、图例在左侧显示、图例在底部显示、靠右覆盖图例或靠左覆盖图例来添加图例。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**244**\n\n**第 7 章：创建清晰且具有说服力的图表**\n\
  \n每个非“覆盖”项都会缩小图表区域以为图例腾出空间。两个“覆盖”项则将图例放置在图表上而不减小图表尺寸，因此它们非常适合保持图表尽可能大。\n\n无论你使用哪种图例放置方式，都可以根据需要将其拖到更合适的位置。你也可以通过单击图例然后拖动其周围显示的手柄来调整图例的大小。\n\
  \n如果需要从图表中删除图例，可以单击图例然后按`Delete`键，或者依次选择“图表布局”→“标签”→“图例”→“无”。\n\n##### 从与图表数据分离的区域添加坐标轴标签\n\
  \n根据包含源数据的工作表布局方式，你可能需要添加与图表数据位于不同单元格中的坐标轴标签。为此，请执行以下步骤：\n\n**1.** 单击图表将其选中。\n\n\
  **2.** 从功能区选择“图表工具”→“设计”下的“选择数据”，以显示“选择数据源”对话框。\n\n**3.** 单击“水平（分类）轴标签”文本框右侧的“折叠对话框”按钮以折叠对话框。\n\
  \n**4.** 在工作表中拖动以选择包含坐标轴标签的单元格。`Excel`会将这些标签填入“水平（分类）轴标签”文本框中。\n\n**5.** 再次单击“折叠对话框”按钮以恢复“选择数据源”对话框。\n\
  \n**6.** 单击“确定”按钮关闭“选择数据源”对话框。`Excel`会将标签应用到坐标轴上。\n\n##### 向图表添加数据标签\n\n\n\n如果观众需要查看数据点的精确值，而不仅仅是了解其大致数值，请向图表添加数据标签。为此，请单击图表，然后选择“图表布局”→“标签”→“数据标签”→“值”。`Data\
  \ Labels`弹出菜单会根据图表类型提供不同的选项。例如，对于饼图，您可以选择`系列名称`项、`类别名称`项、`百分比`项或`类别名称和百分比`项。\n\n\
  [www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 7 章：创建清晰且有说服力的图表**\n\n**245**\n\
  \n**警告：** 请谨慎使用数据标签。只有部分图表能从数据标签中受益——其他图表可能会变得过于杂乱，或者细节可能会分散观众对图表整体重点的注意力。\n\n向图表添加数据标签时，Excel\
  \ 会为每个数据标记显示一个数据标签。如果只想显示部分数据标签，请删除不需要的标签。要删除一个数据标签，请单击它一次以选中所有数据标签，然后再次单击它以仅选中该标签。然后按`Delete`键，或按住`Ctrl`键单击（或右键单击）所选内容，然后点击上下文菜单中的“删除”。\n\
  \n**选择要显示的网格线**\n\n在许多类型的图表上，您可以选择是否显示水平网格线和垂直网格线，以帮助观众判断数据点之间的关系以及与坐标轴的关系。\n\n\
  要控制显示的网格线，请执行以下步骤：\n\n**1.** 选择图表。\n\n**2.** 选择“图表布局”→“坐标轴”→“网格线”，然后点击“水平网格线”、“垂直网格线”或“深度网格线”以显示相应的子菜单。\n\
  \n**3.** 点击要显示的网格线类型的菜单项：\n\n*无网格线。* 点击此项可取消网格线的显示。\n\n*主要网格线。* 点击此项仅显示数据系列中主要刻度的网格线。例如，如果您的数据范围是\
  \ 0-25，主要网格线通常出现在 5、10、15、20 和 25 处。\n\n**提示：** 当观众需要清晰地看到每个值的位置时，请使用数据标签或主要和次要网格线。如果使用次要网格线（无论是否带有主要网格线）使图表显得杂乱，请仅使用主要网格线。通常，最好不要同时使用水平次要网格线和垂直次要网格线，因为这往往会使图表看起来混乱——但有时您的图表可能需要它们。\n\
  \n*次要网格线。* 点击此项可显示数据系列中次要刻度的网格线。例如，如果您的数据范围是 0-25，次要网格线通常出现在每个整数处——1、2、3，依此类推直至\
  \ 25。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-248_1.png)\n\
  \n**246**\n\n**第 7 章：创建清晰且有说服力的图表**\n\n*主要和次要网格线。* 点击此项可同时显示主要网格线和次要网格线。主要网格线的颜色比次要网格线深，以便您看出区别。如图\
  \ 7-11 所示，同时拥有主要和次要网格线通常比仅拥有次要网格线更清晰。\n\n**图 7-11.** *同时使用主要和次要网格线（左图）通常比仅使用次要网格线（右图）使图表更易于阅读。*\n\
  \n**4.** 针对图表所需的每组网格线重复步骤 2 和 3。\n\n**注意：** 要更改网格线显示的值，请格式化坐标轴，如本章前面“更改坐标轴的刻度或编号”部分所述。\n\
  \n**设置图表背景墙和基底格式**\n\n某些图表使用纯色背景看起来效果不错，但对于三维图表，您可能希望装饰图表背景墙（图表后面和侧面的区域）和图表基底（图表底部的区域）。您可以为背景墙、基底或两者添加纯色、渐变、图片或纹理。图\
  \ 7-12 显示了一个使用图片作为背景墙的图表。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n\
  ![](img/index-249_1.png)\n\n**第 7 章：创建清晰且有说服力的图表**\n\n**247**\n\n\n\n### **图 7–12.**\
  \ *你可以通过向图表背景墙应用图片来赋予图表主题外观。*\n\n**提示：** 通常，图表背景墙和基底是应用自定义填充（例如图片）效果最佳的元素。但你也可以对许多其他图表元素应用自定义填充。操作方法是：显示该元素的格式对话框，在左窗格中点击`填充`类别，然后进行选择。\n\
  \n若要格式化图表背景墙或图表基底，请按照以下步骤操作：\n\n**1.** 点击图表以将其选中。\n\n**2.** 选择`图表布局` > `当前所选内容`\
  \ > `图表元素`，然后点击要格式化的项：`背景墙`、`基底`、`侧墙`或`墙壁`（用于同时格式化背景墙和侧墙）。\n\n**3.** 点击`当前所选内容`组中的`设置所选内容格式`按钮，以显示所选项目的格式对话框。图\
  \ 7–13 显示了`设置墙壁格式`对话框，其中包含用于插入图片填充的控件。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-250_1.png)\n\n**248** **第 7 章：创建清晰且有说服力的图表**\n\n### **图 7–13.**\
  \ *使用格式对话框中的“填充”窗格将图片填充应用于图表背景墙或基底等对象。*\n\n**4.** 确保左窗格中已选中`填充`项。\n\n**5.** 在`填充`窗格中，设置你想要的填充方式：\n\
  \n*   **无填充。** 点击`纯色`选项卡以显示其内容。打开`颜色`弹出菜单，若希望该项透明，则选择`无填充`项。\n\n*   **纯色填充。** 点击`纯色`选项卡以显示其内容。打开`颜色`弹出菜单，然后点击你想要的颜色。若想使用默认颜色，则选择`自动`项。拖动`透明度`滑块，或在文本框中输入数值，以选择填充的透明度。\n\
  \n*   **渐变填充。** 点击`渐变`选项卡以显示其内容。打开`样式`弹出菜单，然后选择你想要的渐变样式：`无`、`线性`、`径向`、`矩形`或`路径`。如果适用，使用`角度`旋钮和`方向`弹出菜单设置渐变的角度和方向。然后，在`渐变`选项卡的`颜色`和`透明度`区域中，选择渐变色、颜色和透明度。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 7 章：创建清晰且有说服力的图表** **249**\n\
  \n*   **图片或纹理填充。** 点击`图片或纹理`选项卡以显示其内容。要使用图片，请点击`选择图片`按钮，在`选择图片`对话框中点击图片，然后点击`插入`按钮。要使用纹理，请从`纹理`弹出调色板中选择它。通过拖动`透明度`滑块或在文本框中输入百分比来设置透明度。然后，若想拉伸图片或纹理以填充空间，选择`拉伸`选项按钮；若想平铺图片或纹理以在不扭曲的情况下占据空间，选择`堆叠`选项按钮；或者选择`与\
  \ N 单位/图片堆叠并缩放`选项按钮，以按你在文本框中输入的单位数平铺图片。\n\n*   **图案填充。** 点击`图案`选项卡以显示其内容。在`图案`框中，点击你想要的图案。然后在`前景色`弹出菜单中选择前景色，在`背景色`弹出菜单中选择背景色。\n\
  \n**6.** 点击`关闭`按钮以关闭格式对话框。\n\n### **格式化单个图表元素**\n\n你可以通过选中元素并使用其格式对话框来格式化图表中的任何单个元素——例如，图例、网格线或数据标签。此对话框包含其所影响元素的名称：`设置数据标签格式`对话框、`设置绘图区格式`对话框等。\n\
  \n你可以通过以下任一方式显示格式对话框：\n\n*   按住 `Ctrl` 键点击或右键点击元素，然后点击上下文菜单中的`设置格式`项。这通常是打开格式对话框的最简单方法。\n\
  \n*   在`图表元素`弹出菜单中选择元素，然后点击`设置所选内容格式`按钮。如果难以按住 `Ctrl` 键点击或右键点击\n\n\n\n如果图表中的元素难以选取（例如图表过于拥挤），可以选择\
  \  \n`图表布局` `当前所选内容` `图表元素` 或 `设置当前所选内容格式`，然后在下拉菜单中点击所需元素。接着可点击`设置所选内容格式`按钮（同样位于`当前所选内容`组中），打开该元素的`格式`对话框。\n\
  \n`格式`对话框的内容会因所选对象的不同而变化，但大多数对象都包含以下类别：\n\n**填充。** 你可以用纯色、颜色渐变、图片或纹理填充形状。关于创建填充的详细说明，请参阅本章前面的“设置图表墙和图表基底格式”一节。\n\
  \n**线条。** 你可以为形状添加彩色边框、渐变边框，或设置为无线条。此外还可以选择不同的边框样式、调整边框宽度以及选择合适的线条类型。\n\n**阴影。**\
  \ 你可以为形状添加阴影，设置其颜色，并调整透明度、宽度及其他属性。\n\n**发光和柔化边缘。** 通过为对象添加发光效果、选择与对象周围环境形成对比的颜色，并设定发光范围，可使对象更加突出。你也可以为形状应用柔化边缘效果。\n\
  \n**三维格式。** 你可以为形状的不同部分应用三维格式——例如，为形状的顶部和底部设置不同的棱台效果。\n\n**三维旋转。** 你可以为对象应用三维旋转效果。\n\
  \n**字体。** 对于包含文字的对象，你可以控制文字的显示方式。\n\n**提示：** 如果图表元素包含文字，你也可以通过功能区`开始`选项卡上的控件或键盘快捷键进行格式设置。例如，要为数据标签加粗，可点击数据标签，然后选择`开始`\
  \ `字体` `加粗`（或按`Ctrl+B`）。这通常比使用该元素的`格式`对话框中的`字体`窗格更简便。\n\n##### 将图表的格式复制到另一图表\n\n\
  当你设置好一个图表的全部格式后，可以通过`复制`和`粘贴`将该格式应用到另一个图表。请按以下步骤操作：\n\n1. 点击已设置格式的图表，选中其图表区。\n2.\
  \ 右键单击图表边框，然后在上下文菜单中点击`复制`，将图表及其格式复制到剪贴板。\n3. 转到包含目标图（需要粘贴格式的图表）的工作表。\n4. 选择`开始`\
  \ `剪贴板` `粘贴` `选择性粘贴`，显示如图 7–14 所示的`选择性粘贴`对话框。\n5. 选中`格式`选项按钮。\n6. 点击`确定`按钮关闭`选择性粘贴`对话框。Excel\
  \ 会将格式应用到图表。\n\n##### 通过创建自定义图表类型来重复使用自己的设计\n\n如果你想能够重复使用自己创建的图表设计，可以将其保存为自定义图表类型。请按以下步骤操作：\n\
  \n1. 在图表工作表或工作表中选中已设置格式的图表。\n2. 从功能区选择`图表` `更改图表类型` `其他` `另存为模板`，或从菜单栏选择`图表` `另存为模板`，打开`保存图表模板`对话框。这是一个标准的`另存为`对话框。\n\
