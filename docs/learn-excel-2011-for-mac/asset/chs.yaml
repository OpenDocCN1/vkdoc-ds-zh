- '# 第七章：创建清晰且有说服力的图表


  **注意：** 如果你已有样本数据并准备将其制成图表，请选中数据，然后依次选择`图表` `插入图表` `柱形图`，接着在`柱形图`面板中单击图表类型。这样便会快速生成一个柱形图，你可以一边阅读本章中有关图表组件的讲解，一边用它进行实践。如果想制作本章多数示例所使用的降雨数据图表，请访问
  Apress 网站（`www.apress.com`），找到本书的支持页面，下载名为`35217 chart.xlsx`的工作簿。


  以下各节将讨论图表的各个组成部分。


  **图 7–3.** *此柱形图包含了 Excel 图表的大多数典型元素。图表区是图表所占据的整个区域，绘图区则是绘制数据系列的区域。*


  ###### 图表区与绘图区


  *图表区*是图表所占据的整个区域。如果图表有白色背景，查看图表区范围最简单的方法是单击图表，使 Excel 在图表周围显示一个边框。


  *绘图区*是图表中包含绘制数据的区域——换句话说，即图表区的主要部分，不包括图表标题、坐标轴标题和图例（若显示在绘图区外部）所占据的区域。


  ###### 图表坐标轴


  大多数图表都包含一个、两个或三个坐标轴：


  - **水平坐标轴。** 该轴用于排列数据类别——例如样本图表中的气象站。此坐标轴也称为*类别轴*或*x 轴*。

  - **垂直坐标轴。** 该轴用于排列数据系列。此坐标轴也称为*y 轴*。

  - **深度坐标轴。** 在三维图表中，该轴提供第三维度。此坐标轴也称为*z 轴*。


  每个坐标轴都有刻度线，用于标示数值在轴上的位置。


  ###### 类别与数据系列


  *类别*是显示在水平坐标轴上的数据细分项。例如，在样本图表中，每个气象站就是一个类别。


  *数据系列*是用于创建图表的数据集。例如，在样本图表中，数据系列包含降雨量测量值。


  ###### 图表标题与坐标轴标题


  *图表标题*是标识图表整体的文本。通常，你将图表标题放在图表顶部，以便读者能立即看到，但如有需要，也可将其置于别处。例如，你可以将图表标题放在图表区的空白处，以便放大图表本身。


  *水平坐标轴标题*是解释水平坐标轴显示内容的文本；例如，样本图表中的气象站。


  *垂直坐标轴标题*是解释垂直坐标轴显示内容的文本；例如，样本图表中的降雨量。


  三维图表还可以有*深度坐标轴标题*，用于解释深度坐标轴显示的内容。


  **注意：** 图表标题和坐标轴标题是可选项，因此你只需包含图表所需的标题。通常情况下，清晰的图表标题和坐标轴标题有助于查看图表的人理解内容。但也不必为图表添加任何可能使之复杂的元素。请记住这句格言：“若有疑虑，宁可省略。”


  ###### 数据标记、网格线与数据标签


  *数据标记*是图表中显示每个数据点位置的点。每个系列通常包含多个数据标记。根据图表类型的不同，数据标记可能显示为独立的点，也可能相互连接。


  为了便于查看数据标记与坐标轴之间的关系，你可以向图表添加*网格线*——即从数据标记延伸出的横向或纵向线条。




