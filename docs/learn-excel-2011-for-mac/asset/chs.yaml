  \n#### 使用单变量求解\n\n在进行规划或预测时，你通常需要从目标结果反向推导出所需的数据。例如，在规划下一个财务年度时，你可能需要找出需要将小部件的销售价格提高多少，才能每年多赚\
  \ 30,000 美元。\n\n要计算出这个结果，你可以尝试逐步提高小部件的单价，直到收入数字高出 30,000 美元。但使用 Excel 的 `单变量求解`\
  \ 功能，从收入数字反向自动推导出所需的价格，可以节省时间和精力。\n\n要使用 `单变量求解` 推导数值，请遵循以下步骤：\n\n**1.** 打开包含数据的工作簿，并导航到包含计算过程的工作表。\n\
  \n**2.** 激活包含公式的单元格。\n\n**3.** 在菜单栏中选择 `工具` -> `单变量求解`，以显示 `单变量求解` 对话框（如图 11-16\
  \ 所示，已选定设置）。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-343_1.png)\n\
  \n![](img/index-343_2.png)\n\n**第 11 章：使用模拟分析、单变量求解和规划求解解决业务问题**  \n**图 11-16.**\
  \ *使用“单变量求解”对话框，从期望结果反向推导到所需的数值。*\n\n**4.** 确保 `设置单元格` 文本框包含正确的单元格。（如果你在第 2 步中已选中该单元格，则会自动包含。）如有必要，可通过键入正确的引用，或双击\
  \ `设置单元格` 文本框的当前内容（以选中它）然后点击工作表中的正确单元格来更改单元格。（你也可以单击 `折叠对话框` 按钮来折叠 `单变量求解` 对话框，但对话框本身已经很小，通常直接在工作表上操作会更方便。）\n\
  \n**5.** 在 `目标值` 文本框中，键入你想要达到的数值。\n\n**6.** 在 `可变单元格` 文本框中，输入你想要改变数值的单元格——在这个例子中，就是包含小部件价格的单元格。同样，你可以直接键入单元格引用，或直接点击工作表中的单元格。\n\
  \n**7.** 单击 `确定` 按钮。`单变量求解` 会计算出结果，并将其输入到工作表中，然后显示 `单变量求解状态` 对话框（见图 11-17）。\n\n\
  **图 11-17.** *当 Excel 显示“单变量求解状态”对话框时，请查看工作表中目标单元格的数值。如果你想保留该数值，请单击“确定”按钮。如果你想恢复为之前的数值，请单击“取消”按钮。*\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**注意：**  \n如果计算过程比较简单，`单变量求解`\
  \ 会很快找到结果。但如果计算过程较为复杂，`单变量求解` 可能会花费一些时间。如果发生这种情况，你可以单击 `暂停` 按钮来暂停计算，以查看 `单变量求解`\
  \ 当前正在尝试的数值。如果你想追踪 `单变量求解` 正在尝试的各个数值，请单击 `单步执行` 按钮来显示下一个数值，同时保持计算暂停；根据需要继续单击 `单步执行`\
  \ 按钮以查看后续数值。当你希望 `单变量求解` 以全速继续计算时，请单击 `继续` 按钮。\n\n\n\n### 8. 查看目标单元格中的值。若想保留该值，请点击`OK`按钮；若想恢复为之前的值，请点击`Cancel`按钮。\n\
  \n#### 用规划求解解决多变量问题\n\n如果你觉得“`Goal Seek`”功能很实用，但需要更强大的功能，那么你会想要下载并使用 Excel for Mac\
