  **9**


  **章**


  **使用图片、SmartArt 等插图您的工作表**


  为了给工作簿增加视觉趣味，您可以向其中添加图形、形状、SmartArt 图表和艺术字项目。图形是指 Excel 可以导入的各种格式的图片和图像，而形状是指 Excel
  的内置形状，包括从简单的箭头和规则形状（如圆形、方形和三角形）到您即时创建的复杂形状等各种图形。SmartArt 包含一系列图形，如组织结构图和流程图，而艺术字则是您根据偏好设计创建的图形文字。


  本章向您展示如何插入剪贴画和其他图片，如何插入形状并设置其格式，以及如何将图形对象定位到所需位置。您将学习如何使图片达到您想要的外观，如何将图形对象放置在任何需要的位置，以及如何通过添加
  SmartArt 图表和艺术字项目来插图您的工作簿。除此之外，我还将向您展示如何相对于单元格定位图形项目，以及如何排列图形对象以控制哪些对象可见。




  在开始之前，有一件至关重要的事情你需要了解：尽管工作表看起来是平面的，但它实际上由多个独立的层组成。在向图层添加对象之前，该图层是透明的，因此你可以透过图层看到其下方的任何内容。一个图层包含工作表的单元格；其他图层则包含图形对象。拥有这些多层结构，你可以将图形对象放置在单元格的前方或后方。你还可以将一个图形对象放置在另一个图形对象的前面；例如，将一张图像叠加在另一张图像之上。


  [www.it-ebooks.info](http://www.it-ebooks.info/)


