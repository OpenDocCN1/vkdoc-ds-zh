  ##### 通过应用主题设置工作簿的整体外观


  若要控制工作簿的整体外观，请为其应用合适的主题：选择“开始”>“主题”>“主题”，然后在“主题”面板中单击所需的主题。


  该主题会为工作簿应用一组颜色和一对字体。应用主题后，你可以通过使用功能区“开始”选项卡上“主题”组中的“颜色”弹出菜单或“字体”弹出菜单来更改颜色或字体。


  ##### 选择如何对齐单元格内容


  你可以通过使用功能区“开始”选项卡上“对齐方式”组中的按钮，或“设置单元格格式”对话框的“对齐”选项卡（见图 4-10）中的控件，快速对齐单元格内容：


  - **水平对齐。** 你可以将文本左对齐、居中、右对齐或两端对齐；应用“常规”对齐方式（这取决于数据类型，文本靠左，数字靠右）；选择“跨列居中”以跨多列居中文本；或选择“分散对齐（缩进）”以在单元格内分散文本（增加字间距）。


  **注释：** “填充”水平对齐方式会用你指定的字符填满单元格。


  **图 4-10。** *“设置单元格格式”对话框的“对齐”选项卡允许你在需要时将文本旋转到精确角度。*


  [www.it-ebooks.info](http://www.it-ebooks.info/)


  **134**


  **第 4 章：快速高效地设置工作表格式**


  - **垂直对齐。** 你可以将文本顶端对齐、垂直居中、底端对齐或两端对齐。你还可以选择“分散对齐”以垂直分散文本，这在旋转文本使其垂直排列时非常有用。


  - **旋转文本。** 使用“设置单元格格式”对话框“对齐”选项卡上的“方向”框，或“对齐方式”组中的“方向”弹出菜单。


  - **缩进。** 你可以根据需要对文本进行缩进。


  - **自动换行。** 你可以对文本进行自动换行，使较长的条目在单元格中显示为多行，而不是在下一个单元格内容开始处消失。当自动换行文本时，Excel 会自动增加行高以适应换行后的文本。（如果你设置了小于显示所有换行文本所需高度的特定行高，则单元格中只会显示能容纳下的文本。）


  - **缩小字体填充。** 在“设置单元格格式”对话框的“对齐”选项卡中选中此复选框，可缩小文本以使其适应单元格。当文本仅比单元格稍大时，缩小效果良好。如果文本过大，缩小后的文本会变得太小而无法阅读。


  - **合并单元格。** 使用“对齐方式”组中的“合并后居中”弹出菜单，可将选中的多个单元格合并为一个单元格。你也可以在合并后的单元格中将条目居中。在“设置单元格格式”对话框中，你可以通过选中“对齐”选项卡上的“合并单元格”复选框来合并单元格。


