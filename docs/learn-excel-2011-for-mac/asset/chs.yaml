  ##### 录制示例宏


  上一节描述了录制宏的一般步骤。本节将逐步演示如何录制一个简短的宏，我们将在本章后面的`Visual Basic 编辑器`中打开并编辑该宏。


  这个宏只是将活动工作表复制到一个存档工作簿中，以便你有一份工作表的参考副本。要复制工作表，宏需要执行五个操作：


  - 打开存档工作簿。

  - 激活前一个工作簿。

  - 将工作表复制到存档工作簿。

  - 保存存档工作簿。

  - 关闭存档工作簿。


  要录制示例宏，请遵循以下步骤：


  **1.** 创建一个名为`Archive.xlsx`的工作簿，然后将其关闭。例如：


  **a.** 按`Cmd+N`创建一个新的空白工作簿。

  **b.** 按`Cmd+S`显示`另存为`对话框。

  **c.** 选择要保存工作簿的文件夹。

  **d.** 输入名称`Archive`。

  **e.** 点击`保存`按钮。

  **f.**




  按`Cmd+W`关闭工作簿。


  **2.** 打开一个包含要复制到归档工作簿的工作表的工作簿，并使该工作表处于活动状态。


  **3.** 从功能区中选择“开发工具”>“Visual Basic”>“录制”，或从菜单栏中选择“工具”>“宏”>“录制新宏”，以显示“录制宏”对话框。


  **4.** 在“宏名称”文本框中，输入名称`Copy_Active_Worksheet_to_Archive_Workbook`。


  **5.** 点击“快捷键”文本框，然后按`Shift+C`输入大写字母`C`，这将为宏创建键盘快捷键`Cmd+Option+Shift+C`。


  **6.** 在“保存宏到”弹出菜单中，选择“个人宏工作簿”。


  **7.** 在“说明”文本框中，为宏输入说明：**复制活动工作表到 Archive.xlsx 工作簿。**


