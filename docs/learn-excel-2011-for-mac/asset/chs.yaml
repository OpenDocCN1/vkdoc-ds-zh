  \ 11-6.** *在双变量模拟运算表中，你将一组输入值输入到一列中（此处为 D 列），另一组输入值输入到一行中（此处为第 5 行）。公式位于列和行相交的单元格中（此处为单元格\
  \ D5）。*\n\n**注意：** 当你不再需要模拟运算表时，请选中该表，然后按**Delete**键，或选择**开始** > **编辑** > **清除**\
  \ > **全部清除**。\n\n#### 在工作表中检查不同方案\n\n通常，当你构建了一个工作表后，你会想要尝试其中的不同数据。例如，如果你在制定预算，可能需要调整不同部门的不同数字以达到你所需的总体平衡。\n\
  \n你可以通过直接更改工作表中的值来尝试不同的数据。\n\n\n\n工作表——但之后你可能需要恢复原始数值。另一种方法是创建多个工作表（或工作簿）副本，然后修改副本中的值，保留原始数据不变。这种方法虽然可行，但如果之后需要修改原始工作表（例如，添加另一列数据），修改过程会很快变得混乱不堪。\n\
  \n与其用这些笨拙的方式操作，不如使用 Excel 的方案功能。*方案*是一种向一组单元格输入不同值而不改变底层数值的方法。你可以根据需要从一个方案切换到另一个方案，也可以将同一工作表不同版本的方案合并到单个工作表中。\n\
  \n##### 为方案创建工作表\n\n首先，创建工作簿和工作表，用于后续的方案操作。如果已有包含数据的工作簿，直接将其打开即可。像往常一样在工作表中设置数据和公式。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-333_1.png)\n\
  \n**第 11 章：使用假设分析、单变量求解和规划求解解决业务问题** **333**\n\n**提示：** 为了便于设置和调整方案，请为方案中要更改的每个单元格定义一个名称。单击该单元格，选择`插入`\
  \ `名称` `定义`，弹出`定义名称`对话框，然后按照第 3 章“为单元格或区域分配名称”一节所述的方法操作。例如，在`在当前工作簿中的名称`文本框中输入名称，然后点击`添加`按钮添加名称并保持对话框打开，以便您可以单击另一个单元格并为其定义名称。\n\
  \n图 11-7 展示了本节用作示例的样本工作表。该工作表汇总了来自一个规模适中的租赁物业投资组合的财务回报。\n\n**图 11-7.** *要开始使用方案，请创建一个包含现有数据和所需公式的工作表。*\n\
  \n工作表中显示的内容如下：\n\n`物业地址`列显示每处物业的地址。\n\n`月租金`列显示每处物业的月租金。单元格`B10`包含一个`SUM()`公式，用于计算总租金。此处的每个单元格都有名称以便识别——例如`Rent_Lincoln`、`Rent_Pacific_A`等。\n\
  \n`运营成本`列显示每处物业的月度运营成本，包括所有按揭成本和其他财务负担。单元格`C10`使用`SUM()`公式计算总运营成本。此列中的数字已四舍五入。每个单元格都有名称：`Costs_Lincoln`、`Costs_Pacific_A`等。同样，这样做是为了能够轻松清晰地引用这些单元格。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-334_1.png)\n\
  \n**334** **第 11 章：使用假设分析、单变量求解和规划求解解决业务问题**\n\n`物业利润`列显示每处租赁单元在从租金中扣除运营成本后的利润（例如，单元格`D5`包含公式`=B5-C5`）。此列中的数字已四舍五入；这就是为什么单元格`D5`看似包含数学错误但实际上正确的缘故。单元格`D10`使用`SUM()`公式返回总利润。\n\
  \n`物业盈利能力`列以百分比形式显示物业的盈利能力。为了计算盈利能力数值，我们将`物业利润`值除以`月租金`值——例如，单元格`E5`包含公式`=D5/B5`。在该列底部，单元格`E10`使用`AVERAGE()`公式显示各物业的平均盈利能力。\n\
  \n`财务贡献`列以百分比形式显示每处物业对总利润的贡献。为了计算贡献数值，我们将每处物业的利润除以单元格`D10`中的总利润。例如，单元格`F9`包含公式`=D9/D$10`，使用混合引用确保复制公式时行号保持绝对引用。单元格`F10`包含一个`SUM()`公式，用于汇总各百分比，从而显示它们总计为\
  \ 100%。\n\n\n\n"
- '# 市场不景气，总利润太低。因此，我们将通过假设分析来看如何通过提高租金和削减成本来改善状况。


  ##### 打开方案管理器对话框


  当您准备好开始使用方案时，从功能区中选择 `Data Analysis > What-If > Scenario Manager`，或从菜单栏中选择 `Tools
