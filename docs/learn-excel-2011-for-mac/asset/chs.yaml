  Excel 求值运算符的默认顺序，以及如何在必要时更改顺序。掌握了这些知识，你就能构建复杂的公式——但你可能更想走捷径，将它们一步步构建出来，这样就能轻松发现并解决问题。


  在本章末尾，我将向你介绍公式中常见的问题，并讲解如何排除这些故障。


  #### 理解公式与函数的区别


  在 Excel 中，你可以通过两种主要方式进行计算，两者均以等号开头：


  *   **使用函数**。*函数*是一种预设的计算方式，用于执行标准计算。例如，当你需要将多个数值相加时，可以使用 `SUM()` 函数——例如 `=SUM(1,2,3,4,5,6)`，它比
  `=1+2+3+4+5+6` 更简洁，但效果相同。


  *   **使用公式**。*公式*是一种自定义计算，当你发现 Excel 的现有函数无法满足需求时创建。*公式*这个词听起来可能有些吓人，但公式也可以很简单；例如，要从
  100 中减去 50，你可以在单元格中输入 `=100-50`（等号告诉 Excel 你正在开始一个公式）。公式也可能更复杂。例如，假设你需要将 `A1:A6`
  区域中单元格的内容相加，然后除以 `B1` 单元格的内容。Excel 没有内置的函数来完成此操作，因为它不是标准计算。因此，你可以创建这样一个公式：`=SUM(A1:A6)/B1`。（在此示例中，`/`
  是键盘上对应 ÷ 符号的键。）


  我将在本章中介绍如何使用公式，并在下一章介绍如何使用函数。但在开始讨论公式之前，我们先来回顾一下在公式和函数中引用单元格和区域的方法。


  #### 在公式和函数中引用单元格和区域


  要使你的公式和函数正常工作，你需要正确引用所需的单元格和区域。本节将确保你了解如何引用单元格和区域，无论它们与公式位于同一工作表，还是位于不同的工作表。你甚至可以引用另一个工作簿中的单元格和区域——只要该工作簿在你
  Mac 文件系统中的位置保持不变。


  ##### 引用单个单元格


  要引用同一工作表中的单元格，只需使用其列字母和行号即可。例如，使用 `=A10` 来引用单元格 `A10`。


  要引用不同工作表中的单元格，请输入工作表名称，后跟感叹号和单元格引用。例如，使用 `=Supplies!A10` 来引用名为 `Supplies` 的工作表中的单元格
  `A10`。设置此类引用的最简单方法如下：


  1.  开始创建公式。例如，在单元格中输入 `=`。


  2.  单击包含你要引用单元格的工作表标签。


  3.  点击该单元格。


  4.  单击公式栏上的“输入”按钮以输入引用。Excel 会将你返回到你正在创建公式的工作表。


  > **注意：** 在步骤 4 中，除了单击公式栏上的“输入”按钮外，你也可以按 Return 键来输入单元格引用。此时，Excel 会将活动单元格移动到公式所在单元格下方的工作表位置。然后你需要在执行步骤
  5 之前按向上箭头键。


  5.  按 `Ctrl+U` 继续编辑该单元格。或者，点击公式栏，然后在那里继续编辑。


  6.  像往常一样完成公式的创建。


  > **注意：** 如果工作表名称包含空格，则必须将名称放在单引号内；例如，应使用 `=''Sales Results''!A10` 而非 `=Sales Results!A10`。如果你觉得保持一致更容易，也可以在名称不含空格的工作表上使用单引号。如果在需要时省略了单引号，Excel
  会显示错误消息。


  要引用另一个工作簿中的单元格，请输入工作簿的路径，然后是方括号中的文件名，接着是工作表名称，最后是单元格引用。例如，引用 `=''Shared:Spreads:[Results.xlsx]Sales!''AB12`
  指的是 `Shared:Spreads` 文件夹中 `Results.xlsx` 工作簿的 `Sales` 工作表中的单元格 `AB12`。


  除非你碰巧知道路径、文件名、工作表名称和单元格，否则通常最简单的方法是使用鼠标设置引用。请按照以下步骤操作：


  1.  打开你要引用的工作簿。


  2.  在将要包含引用的工作簿中，开始创建公式。例如，在单元格中输入 `=`。


  3.  切换到另一个工作簿。如果你能看到另一个工作簿，请点击它。如果看不到，请打开菜单栏上的“窗口”菜单，然后点击相应的窗口。


  4.  导航到包含该单元格的工作表，然后点击该单元格。


  5.  切换回你正在创建引用的工作簿，然后完成公式。


  当你创建对另一个工作簿中单元格的引用时，Excel 会保持引用单元格的值更新。如果你移动或删除了另一个工作簿，Excel 会显示一个对话框，警告你无法找到该工作簿，并询问你是否要手动定位它。


  ##### 引用区域


  要引用由一块单元格组成的区域，请给出第一个单元格和最后一个单元格的地址，并用冒号分隔。例如，要引用从单元格 `P10` 到单元格 `Q12` 的区域，请使用 `=P10:Q12`。


  要引用由单独单元格组成的区域，请给出每个单元格的地址，并用逗号分隔地址。例如，要引用单元格 `J14`、单元格 `K18` 和单元格 `Z20`，请使用 `=J14,K18,Z20`。


  要引用不同工作表或不同工作簿中的区域，请使用上一节中介绍的技术。例如，如果需要引用名为 `Stock Listing` 的工作表中的 `P10` 到 `Q12`
  区域，请使用 `=''Stock Listing''!P10:Q12`。


  ##### 使某一行或列引用另一行或列


  有时你可能需要使某一行或列的内容引用另一行或列。例如，假设你需要使第 25 行中的每个单元格引用第 4 行中的相应单元格，以便单元格 `A25` 引用单元格 `A4`，单元格
  `B25` 引用单元格 `B4`，依此类推。


  为此，请点击第 25 行的行标题以选择该行。然后输入 `=4:4` 以创建对第 4 行的引用，并按 `Cmd+Return` 将其输入到选定区域的所有单元格中。


  同样，你可以通过输入其字母标识、一个冒号、然后再输入该字母标识来引用整列；例如，`E:E`。


  ##### 理解绝对引用、相对引用和混合引用


  使用单元格地址或区域地址相当直接，但当你开始使用公式时，会出现一个复杂情况。当你复制公式并粘贴时，你需要告诉 Excel，粘贴的公式是应该引用它最初引用的单元格，还是引用与公式当前位置相对位置相同的单元格，或者是两者的混合。（如果你通过拖放或剪切和粘贴将公式移动到另一个单元格，Excel
  会保持公式不变。）


  为了明确引用，Excel 使用三种类型的引用：




  *绝对引用*。无论复制到何处，始终指向同一个单元格的引用。Excel 使用美元符号（`$`）表示引用的每个部分是绝对的。例如，`$B$3`是对单元格`B3`的绝对引用。


  *相对引用*。根据相对于包含该引用的单元格的位置来引用单元格的引用。例如，如果你选中单元格`A3`并输入`=B5`，则该引用意味着“向右一列、向下两行的单元格”。因此，如果你将公式复制到单元格`C4`，Excel
  会将单元格引用更改为单元格`D6`，即从单元格`C4`向右一列、向下两行。要表示相对引用，Excel 使用不带任何美元符号的普通引用；例如，`B5`。


