  ![](img/index-421_1.png)\n\n**425**\n\n**第 14 章：使用宏和 VBA 自动执行任务**\n\n现在打开\"宏\"对话框，点击宏，然后点击`编辑`按钮。Excel\
  \ 将在 Visual Basic 编辑器中打开宏进行编辑。\n\n##### 认识 Visual Basic 编辑器的界面\n\n图 14-10 展示了 Visual\
  \ Basic 编辑器窗口，并标注了其主要组件。\n\n**图 14-10.** *Visual Basic 编辑器由三个主要窗口组成——工程资源管理器、属性窗口和代码窗口（用于创建和编辑\
  \ VBA 代码）。*\n\n以下是您在图 14-10 中看到的 Visual Basic 编辑器的六个主要组件：\n\n- **工程资源管理器。** 此窗口显示每个打开项目的可折叠树——每个常规工作簿、每个加载项（例如图\
