  \ 键在工作表中输入函数。\n\n如果您已完成使用函数生成器，请通过单击其“关闭”按钮（其标题栏左端的按钮）、从菜单栏选择“查看”>“公式生成器”，或单击标准工具栏上的“工具箱”按钮来关闭它。\n\
  \n**使用“插入”弹出菜单插入函数**\n\n当您知道要插入哪个函数时，最简单的插入方法（除非它是“自动求和”弹出菜单上的五个函数之一）是使用“插入”弹出菜单。“插入”弹出菜单帮助您按类别选择函数，并将其直接插入单元格。\n\
  \n要使用“插入”弹出菜单插入函数，请按照以下步骤操作：\n\n**1.** 选择要输入函数的单元格。\n\n**2.** 选择“公式”>“函数”>“插入”以显示“插入”弹出菜单。\n\
  \n此弹出菜单将函数分为十个类别：数据库、日期和时间、工程、财务、信息、逻辑、查找与引用、数学与三角函数、统计和文本。这些类别与公式生成器中显示的类别相似，如本章前面所述。每个类别都有一个子菜单。\n\
  \n**3.** 单击要插入的函数类别。Excel 会显示一个包含这些函数的子菜单。图 6–6 显示了打开的“日期和时间”子菜单。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-196_1.png)\n\n**第 6 章：使用 Excel 的内置函数**\n\n**193**\n\n**图 6–6。**\
  \ *当您希望按类别插入函数时，请使用“Ribbon”上“公式”选项卡的“函数”组中的“插入”弹出菜单。*\n\n**4.** 单击要插入的函数。Excel 会将其插入到单元格中。\n\
  \n**5.** 照常输入函数的参数。\n\n\n\n**提示：** 如果需要帮助提供函数的参数，请单击编辑栏上的 `fx` 按钮，或从功能区选择 `公式 >\
  \ 函数 > 公式生成器` 以显示公式生成器。公式生成器会显示刚插入函数的详细信息。\n\n**6.** 按 `Return` 键或单击编辑栏上的“输入”按钮，将公式输入到单元格中。\n\
  \n##### 通过在工作表中键入函数来插入函数\n\n你也可以通过直接在单元格中键入函数来将其输入工作表。当你熟悉所需函数并知道其参数时，可能更倾向于使用这种方法。请遵循以下一般步骤：\n\
  \n**1.** 单击单元格将其选中。\n\n**2.** 键入 `=` 告诉 Excel 你正在创建公式。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-197_1.png)\n\n**194**\n\n**第 6 章：使用 Excel 的内置函数**\n\n**3.** 开始键入函数名称。Excel\
  \ 会显示匹配的函数列表（参见图 6-7）。\n\n**图 6-7.** *当你开始在单元格中键入函数名称时，Excel 会列出匹配的函数。单击要插入的函数，或按下箭头键（必要时按上箭头键）选择函数，然后按*\
  \ `Return`*。*\n\n**注意：** 你也可以继续键入，直到输入足够字符以唯一标识函数——或者如果愿意，也可以直接键入完整的函数名称。\n\n**4.**\
  \ 要输入函数，请双击它，或通过按向下箭头或向上箭头将高亮移动到该函数，然后按 `Return`。\n\n**5.** 指定函数的参数。你可以键入一个值或引用，也可以使用鼠标选择单元格或区域。\n\
  \n**注意：** 在单元格中输入函数后，可以通过双击该单元格，或使单元格处于活动状态并按 `Ctrl+U` 来打开函数进行编辑。你可以直接在单元格中或编辑栏中编辑函数。\n\
  \n##### 将一个函数嵌套在另一个函数内部\n\n刚开始使用函数时，你可能只会在单元格中使用单个函数。但随着对函数的使用经验逐渐丰富，你会发现有时需要使用多个函数来执行所需的计算。\n\
  \n当需要同时使用两个或更多函数时，你可以将一个函数嵌套在另一个函数内部。例如，如果需要返回当前小时数，可以将 `NOW()` 函数（返回当前日期和时间）嵌套在\
  \ `HOUR()` 函数（以 24 小时格式返回给定时间的小时数；如果需要以 AM/PM 格式显示小时，请更改单元格格式）中：\n\n```\n=HOUR(NOW())\n\
  ```\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 6 章：使用 Excel 的内置函数**\n\
  \n**195**\n\n与公式类似，如果需要，你可以将函数嵌套很多层。这是一个三层嵌套的示例：\n\n```\n=INT(AVERAGE(ROUND(SUM(C1:C6),2),ROUND(SUM(D1:D6),2)))\n\
  ```\n\n具体运算过程如下：\n\n- `SUM(C1:C6)`：此 `SUM` 函数将范围 `C1:C6` 中的值相加。类似地，`SUM(D1:D6)`\
  \ 将范围 `D1:D6` 中的值相加。\n- `ROUND(SUM(C1:C6),2)`：此 `ROUND` 函数将 `SUM(C1:C6)` 公式的结果四舍五入到两位小数。类似地，`ROUND(SUM(D1:D6),2)`\
  \ 将 `SUM(D1:D6)` 公式的结果四舍五入到两位小数。\n- `AVERAGE`：此函数返回两个 `ROUND` 函数返回结果的平均值。\n- `INT`：此函数返回\
  \ `AVERAGE` 函数结果的整数部分。\n\n**提示：** 嵌套函数可以使电子表格更紧凑，并给同事留下深刻印象。但在确定使用哪些函数时，你可能发现将每个函数放在单独的单元格中更容易，这样可以看到每个函数返回的结果——也许还可以添加注释说明每个步骤的作用。一旦各函数在单独单元格中正常工作，再在单个单元格中创建嵌套版本，并确保其给出与逐步版本相同的结果。同样，你可能希望添加注释解释嵌套公式的工作原理。\n\
  \n#### 了解 Excel 的内置函数\n\n\n\n"
- "# 本节内容\n\n在本节中，我将向你介绍 Excel 的十大内置函数类别：`数据库`、`日期与时间`、`工程`、`财务`、`逻辑`、`信息`、`查找与引用`、`数学与三角函数`、`统计`以及`文本`。我们将关注最常用的函数，并通过示例说明其应用场景。\n\
  \n##### 数据库函数\n\nExcel 包含 12 个数据库函数，用于在工作表表格中查找符合指定条件的值。（*表格*是在工作表中创建的平面数据库；第 10\
  \ 章会讲解如何创建表格，并给出使用数据库函数的示例。）\n\n表 6–1 说明了这些数据库函数。\n\n**表 6–1.** *Excel 的数据库函数*\n\
  \n| 数据库函数 | 返回结果 |\n| --- | --- |\n| `DAVERAGE` | 返回列中符合指定条件的值的平均值。 |\n| `DCOUNT`\
  \ | 返回数据库字段中符合指定条件的单元格计数。 |\n| `DCOUNTA` | 返回数据库字段中符合指定条件的非空单元格计数。 |\n| `DGET` |\
  \ 返回与指定字段条件匹配的数据库记录。 |\n| `DMAX` | 返回数据库字段中符合指定条件的最大值。 |\n| `DMIN` | 返回数据库字段中符合指定条件的最小值。\
  \ |\n| `DPRODUCT` | 返回符合指定条件的记录值的乘积结果。 |\n| `DSTDEV` | 基于样本的选定数据库条目的标准偏差。 |\n| `DSTDEVP`\
  \ | 基于全体选定数据库条目的标准偏差。 |\n| `DSUM` | 返回符合指定条件的字段值的总和。 |\n| `DVAR` | 基于样本的数据库条目的方差。\
  \ |\n| `DVARP` | 基于全体数据库条目的方差。 |\n\n##### 日期与时间函数\n\n表 6–2 解释了 Excel 的日期与时间函数，这些函数在许多工作表中都很有用。\n\
  \n**表 6–2.** *Excel 的日期与时间函数*\n\n| 日期与时间函数 | 返回结果 |\n| --- | --- |\n| `DATE` | 返回指定日期的序列号。例如，`=DATE(2011,11,18)`\
  \ 返回 40865，即 2011 年 11 月 18 日的序列日期。除非将单元格格式设置为`常规`，否则 Excel 会以日期格式显示此值。 |\n| `TIME`\
  \ | 返回指定时间的序列号。例如，`=TIME(11,59,59)` 返回 0.499988426，即 上午 11:59:59 的序列号。除非将单元格格式设置为`常规`，否则\
  \ Excel 会以时间格式显示此值。 |\n| `DATEVALUE` | 返回以文本格式指定的日期的序列号。例如，`=DATEVALUE(\"2011 年\
  \ 12 月 12 日\")` 返回 40889，即 2011 年 12 月 12 日的序列日期。 |\n| `TIMEVALUE` | 返回以文本格式指定的时间的序列号。例如，`=TIMEVALUE(\"\
  下午 3:25:00\")` 返回 0.502372685，即 下午 3:25 的序列号。 |\n| `DAY` | 返回介于 1 到 31 之间的序列号，代表指定序列日期所在的月份中的第几天。例如，`=DAY(40789)`\
  \ 返回 3，表示该日期是该月的第三天。 |\n| `MONTH` | 返回介于 1 到 12 之间的序列号，代表指定序列日期所在的月份。例如，`=MONTH(40789)`\
  \ 返回 9，表示该日期在九月。 |\n| `YEAR` | 返回指定序列日期的四位数字年份。例如，`=YEAR(40789)` 返回 2011，表示该日期在\
  \ 2011 年。 |\n| `YEARFRAC` | 返回一个数字，表示指定开始日期与结束日期之间的年数。例如，`=YEARFRAC(DATE(2011,1,1),DATE(2012,3,1))`\
  \ 返回 1.166666667，即 2011 年 1 月 1 日到 2012 年 3 月 1 日之间的年数。 |\n| `DAYS360` | 返回一个数字，表示指定开始日期与结束日期之间的天数，假设一年有\
  \ 360 天（这是一种会计技巧，并非直接否定传统计时法）。例如，`=DAYS360(DATE(2011,1,1),DATE(2012,3,1))` |\n\n\
  \n\n## 排版后\n\n返回 `420`，这是基于 360 天的一年计算方式下，2011 年 1 月 1 日至 2012 年 3 月 1 日之间的天数。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n### 第 6 章：使用 Excel 的内置函数\n\
  \n### 日期和时间\n\n| 函数 | 返回结果 |\n|---|---|\n| `HOUR` | 一个介于 0 到 23 之间的序列号，表示给定时间的小时数。例如，`=HOUR(0.25)`\
  \ 返回 6，代表早上 6 点，因为一天 24 小时的四分之一是 6 小时。 |\n| `MINUTE` | 一个介于 0 到 59 之间的序列号，表示给定时间的分钟数。例如，`=MINUTE(0.55)`\
  \ 返回 12，代表下午 1:12 的分钟数，此时刻是一天时间进度到 55% 的时刻。 |\n| `SECOND` | 一个介于 0 到 59 之间的序列号，表示给定时间的秒数。例如，`=SECOND(0.61)`\
  \ 返回 24，代表下午 2:38.24 的秒数，此时刻是一天时间进度到 61% 的时刻。 |\n| `TODAY` | 以日期格式返回当前日期。例如，在 2011\
  \ 年 6 月 12 日，`=TODAY()` 返回 6/12/2011。 |\n| `NOW` | 以日期和时间格式返回当前日期和时间。例如，`=NOW()`\
  \ 返回类似 6/2/2011 03:15 的日期和时间。 |\n| `WEEKNUM` | 一个介于 1 到 52 之间的序列号，指示指定日期在当年中是第几周。例如，`=WEEKNUM(40789)`\
  \ 返回 36，表示该日期位于当年第 36 周。 |\n| `WEEKDAY` | 一个介于 1（星期日）到 7（星期六）之间的序列号，指示指定日期是星期几。例如，`=WEEKDAY(40789)`\
  \ 返回 7，表示该日是星期六。 |\n| `WORKDAY` | 返回一个序列号，给出在指定起始日期之前或之后指定工作天数（包含指定的节假日数量）的日期。例如，`=WORKDAY(DATE(2011,6,12),40,2)`\
  \ 返回 40760，即 2011 年 8 月 5 日的序列号，这是假设有两个节假日的情况下，2011 年 6 月 12 日后第 40 个工作日。 |\n| `NETWORKDAYS`\
  \ | 返回一个数字，给出指定起始日期和指定结束日期之间的净工作日数（减去指定的节假日数量）。例如，`=NETWORKDAYS(DATE(2011,6,12),DATE(2011,10,20),2)`\
  \ 返回 94，这是 2011 年 6 月 12 日至 2011 年 10 月 20 日之间的净工作日数，假设在此期间有两个节假日。 |\n| `EDATE`\
  \ | 返回一个序列号，给出在给定起始日期之前或之后指定月份数的日期。例如，`=EDATE(40789,4)` 返回 40911，即序列日期 40789 之后四个月的序列日期。\
  \ |\n| `EOMONTH` | 返回一个序列号，给出在给定起始日期之前或之后指定月份数的那个月份的最后一天。例如，`=EOMONTH(DATE(2011,7,14),6)`\
  \ 返回 40939，即 2012 年 1 月 31 日的序列号，这是 2011 年 7 月 14 日之后六个月的那个月份的最后一天。 |\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n### 第 6 章：使用 Excel 的内置函数\n\n##### 工程函数\n\n表 6-3 解释了 Excel 的工程函数，其范围从计算贝塞尔函数到将数字与二进制、八进制和十六进制进行相互转换。\n\
  \n**表 6-3.** *Excel 的工程函数*\n\n| 函数 | 返回结果 |\n|---|---|\n| `BESSELI` | 修正的贝塞尔函数 In(\
  \ *x*)，即围道积分。例如，`=BESSELI(1.8,1)` 返回 1.31716723。 |\n| `BESSELJ` | 贝塞尔函数 Jn( *x*)，也称为柱谐函数。例如，`=BESSELJ(1.5,2)`\
  \ 返回 0.232087679。 |\n| `BESSELK` | 修正的贝塞尔函数 Kn( *x*)，也称为巴塞特函数或麦克唐纳函数。例如，`=BESSELK(1.8,3)`\
  \ 返回 0.95783635。 |\n| `BESSELY` | 贝塞尔函数 Yn( *x*)，也称为诺伊曼函数或韦伯函数。例如，`=BESSELY(3.5,1)`\
  \ 返回 0.410188417。 |\n| `BIN2DEC` | 指定二进制数的十进制等效值。例如，`=BIN2DEC(1001101)` 返回 77。二进制数最多可包含\
  \ 10 个字符；更长的数字会导致 `#NUM!` 错误。 |\n| `BIN2HEX` | 指定二进制数的十六进制等效值，可选择指定要使用的字符数。例如， |\n\
  \n\n\n`=BIN2HEX(111011111)` 返回 1DF，而 `=BIN2HEX(111011111,4)` 返回 01DF。二进制数最多可包含 10\
  \ 个字符；超过此长度的数字会导致 `#NUM!` 错误。\n\n## BIN2OCT\n\n指定二进制（基数为 2）数的八进制（基数为 8）等效值，可选择指定返回的字符数。例如，`=BIN2OCT(1011,4)`\
  \ 返回 0013。\n\n## COMPLEX\n\n由实部和虚部系数生成的复数。例如，`=COMPLEX(4,5)` 返回 4+5i。\n\n## CONVERT\n\
  \n将指定源测量系统中的值转换为指定目标测量系统中的等效值。您可以转换重量和质量、距离、压强、力、能量、功率、磁力、温度、液体和公制测量单位；详细信息请参阅帮助文件。例如，`=CONVERT(200,\"\
  kg\",\"lbm\")` 将 200 公斤转换为其以磅为单位的等效重量（440.9245244）。\n\n## DEC2BIN\n\n指定十进制（基数为 10）数的二进制（基数为\
  \ 2）等效值，可选择指定返回的字符数。例如，`=DEC2BIN(100)` 返回 1100100，而 `=DEC2BIN(100,10)` 返回 0001100100。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**200**\n\n**第 6 章：使用 Excel\
  \ 的内置函数**\n\n**工程**\n\n**返回值**\n\n**函数**\n\n## DEC2HEX\n\n指定十进制（基数为 10）数的十六进制（基数为\
  \ 16）等效值，可选择指定返回的字符数。例如，`=DEC2HEX(-90)` 返回 FFFFFFA6。\n\n## DEC2OCT\n\n指定十进制（基数为\
  \ 10）数的八进制（基数为 8）等效值，可选择指定返回的字符数。例如，`=DEC2OCT(100,6)` 返回 000144。\n\n## DELTA\n\n\
  如果两个数相等，则返回 1；如果不相等，则返回 0。例如，`=DELTA(B1,B2)` 如果单元格 B1 和 B2 中的值相等，则返回 1；否则返回 0。\n\
  \n## ERF\n\n在指定的下限和指定上限之间积分的误差函数。如果省略上限，则返回零与指定下限之间的误差函数值。例如，`=ERF(0.5,2)` 返回 0.474822387，这是在\
  \ 0.5 和 2 之间积分的误差函数值。\n\n## ERFC\n\n在指定的下限和正无穷之间积分的互补误差函数。例如，`=ERFC(2)` 返回 0.004677735。\n\
  \n## GESTEP\n\n如果指定数字大于或等于指定阈值，则返回 1；否则返回 0。例如，`=GESTEP(5,D1)` 如果 5 大于或等于单元格 D1\
  \ 中的值，则返回 1；否则返回 0。\n\n## HEX2BIN\n\n指定十六进制（基数为 16）数的二进制（基数为 2）等效值，可选择指定返回的字符数。例如，`=HEX2DEC(\"\
