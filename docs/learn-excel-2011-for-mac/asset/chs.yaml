  \ 429\n\nIV\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n### 引言\n\n你是否需要顺利、自信且尽可能快速地用\
  \ Excel 完成工作？\n\n如果是这样，你选对了书。\n\n#### 本书的读者对象？\n\n本书旨在帮助初中级用户快速掌握 Mac 版 Excel 2011，并立即高效投入使用。\n\
  \n无论你是在工作还是在家中，需要学习使用 Excel 完成日常任务，本书专注的方法和详尽的建议都将使你受益匪浅。你可以从头开始，按章节顺序阅读，也可以利用目录或索引直接跳转到你需要的主题。\n\
  \n#### 本书涵盖哪些内容？\n\n本书包含三个部分，涵盖了有效使用 Excel 2011 所需掌握的全部知识。\n\n##### 第一部分：“熟练使用 Excel：Mac\
  \ 版”，确保你掌握 Excel 的核心操作：\n\n- **第 1 章“掌握 Excel：Mac 版界面的秘诀”，** 教你四种主要控制 Excel 方式的来龙去脉：功能区、工具栏、菜单和键盘快捷键。你将掌握如何在工作表和\
  \ workbook 中导航；学习在工作簿中快速输入文本的方法；并利用拆分、冻结和自定义视图来精确显示所需内容。\n\n- **第 2 章“按你的工作方式配置\
  \ Excel：Mac 版”，** 演示如何通过设置最重要的偏好设置以及自定义键盘快捷键、工具栏、菜单、菜单栏和功能区，让 Excel 按你的方式工作。你还将学习如何在启动\
  \ Excel 时自动打开工作簿，以及如何将多个打开的工作簿布局保存为一个可即时恢复的工作区。\n\nXVI\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n### 引言\n\n- **第 3 章“创建高效的工作簿和模板”，** 讲解如何创建能够快速有效输入、编辑和操作数据的工作簿。你将了解应保存为哪种文件格式、如何添加属性信息以便在搜索时识别工作簿，以及如何充分利用模板——包括创建自己的模板。此外，你还将学习如何组织工作表、有效布局数据、定义命名范围以简化导航，以及创建可折叠的工作表。\n\
  \n- **第 4 章“快速高效地格式化工作表”，** 展示如何利用 Excel 提供的各种工具快速高效地格式化工作表。我们从格式化行和列开始——涵盖从更改列宽和行高到插入及\n\
  \n\n\n删除行和列，以及隐藏敏感数据。接着，我们讨论如何应用简单的格式、如何使用条件格式快速标记需要关注的值，以及如何使用数据验证来检查无效条目。最后，我们介绍如何通过使用表格格式或\
  \ Excel 的样式来节省时间，以及如何为工作表添加页眉和页脚。\n\n第二部分“执行计算与呈现数据”将帮助您掌握公式、函数、图表以及图片和迷你图等图形元素：\n\
  \n-   **第 5 章“使用公式执行自定义计算”** 确保您了解公式和函数是什么，以及两者之间的区别。然后，本章将教您如何使用 Excel 的计算运算符创建自己的公式，从使用单个计算运算符的简单公式开始，逐步过渡到使用多个计算运算符的更复杂公式。您还将学习如何覆盖\
  \ Excel 评估运算符的默认顺序，以及如何排查公式中常见的错误。\n-   **第 6 章“使用 Excel 的内置函数”** 解释了如何利用 Excel\
  \ 提供的各种工具在工作表中插入函数、找到所需函数，并将函数指向计算所需的数据。本章的第二部分回顾了 Excel 中不同类型的函数，例如数据库函数、逻辑函数以及数学和三角函数，并给出了如何使用常用函数的示例。\n\
  -   **第 7 章“创建清晰且有说服力的图表”** 教您如何使用 Excel 种类繁多的图表清晰且有说服力地呈现数据。您将学习在工作表中放置图表的不同方法、图表的组成部分以及可以使用的图表类型。然后，我们将深入探讨如何根据数据创建图表，按照您想要的布局进行设计，并赋予其所需的外观。我们还将讨论重用自定义图表的方法，以及在\
  \ Word 文档或 PowerPoint 演示文稿中使用 Excel 图表的方法。\n-   **第 8 章“使用数据条、色阶、图标集和迷你图”** 向您展示如何使用这四种单单元格图形元素为工作表增添视觉吸引力。您将快速掌握使用数据条比较单元格区域中的值、添加色阶以调整单元格的背景颜色从而提供其数值的视觉参考，以及使用图标集提供快速的性能视觉参考。您还将学习使用迷你图创建单单元格图表。\n\
  -   **第 9 章“使用图片、SmartArt 等美化工作表”** 解释了如何通过添加图形、形状、SmartArt 图表和艺术字项目来增加工作簿的视觉趣味。您将学习如何让图片呈现您想要的效果，如何将图形对象放置在任何需要的位置，如何将图形项相对于单元格进行定位，以及如何排列图形对象以控制哪些对象可见。\n\
  \n第三部分“分析数据以及共享和自动化工作簿”展示了如何分析、操作和共享您创建的工作簿：\n\n-   **第 10 章“使用表格创建数据库”** 涵盖了如何使用\
  \ Excel 的表格创建数据库来存储信息、排序以及筛选以找到所需的记录。您还将学习如何将 Excel 的数据库函数与表格结合使用。\n-   **第 11 章“使用模拟分析、单变量求解和规划求解解决业务问题”**\
  \ 教您如何使用四个强大的工具来分析数据。您将学习如何使用数据表评估一个或两个变量对计算的影响，以及如何使用方案来试验不同的值集而无需更改核心数据。您还将学习使用`Goal\
  \ Seek`（单变量求解）解决单变量问题，以及使用`Solver`（规划求解）解决多变量问题。\n-   **第 12 章“使用数据透视表分析数据”** 解释了什么是数据透视表，以及如何使用它们来检查工作表中的数据并发现其中隐藏的秘密。您将学习如何使用\
  \ Excel 的自动化工具或手动将字段放置在需要的位置来创建数据透视表，如何在创建后更改数据透视表，以及如何对其包含的数据进行排序和筛选。\n-   **第\
