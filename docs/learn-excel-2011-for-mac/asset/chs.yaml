  以下是格式化迷你图的主要操作：


  -   **更改一组迷你图的源数据。** 单击该组迷你图中的一个单元格，然后从功能区选择`迷你图 数据 编辑`（单击`编辑`按钮的主要部分）。Excel 将显示`编辑迷你图`对话框，该对话框具有与`插入迷你图`对话框相同的控件。


