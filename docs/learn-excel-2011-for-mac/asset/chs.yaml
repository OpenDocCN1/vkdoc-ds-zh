  \n指定复数的余弦值。例如，`=IMCOS(A22)` 返回单元格 A22 中值的余弦值。\n\n## IMDIV\n\n指定两个复数的商。例如，`=IMDIV(\"\
  10+25i\",\"-240+280i\")` 计算给定两个数的商。\n\n## IMEXP\n\n指定复数的指数值。例如，`=IMEXP(\"2+i\")`\
