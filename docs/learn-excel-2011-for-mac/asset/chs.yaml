  \ 此类别包含数学函数，例如用于返回平方根的 `SQRT()` 函数。\n\n\n\n根，以及三角函数，例如用于计算余弦的`COS()`函数。\n\n**统计类**。此类别包含用于执行统计计算的函数，例如基于总体或样本计算标准差。\n\
