  \ 将来自外部数据源的值保存到工作簿中，请选中此复选框。这通常是一个好主意，但如果您从外部源导入大量数据，则可能需要清除此复选框，因为在 Excel 中保存数据可能会花费很长时间或导致工作簿过大。\n\
