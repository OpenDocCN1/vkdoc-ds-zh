  \n**第 11 章：使用假设分析、单变量求解和规划求解解决业务问题** **331**\n\n4. 单击**确定**按钮关闭“模拟运算表”对话框。Excel\
  \ 会在每个包含输入值的单元格旁边的单元格中输入数组公式`{=TABLE(,A5)}`。\n\n5. 对结果单元格应用货币数字格式，以便结果显示为美元金额。\n\
  \n图 11-5 显示了带有结果的模拟运算表。\n\n**图 11-5.** *创建模拟运算表后，结果会显示在输入值旁边。*\n\n##### 创建双变量模拟运算表\n\
  \n当你需要分析计算中使用的两个信息发生变化时会发生什么，请创建一个双变量模拟运算表。例如，在使用`FV()`函数计算投资时，你可能不仅需要考虑不同的分期月份数，还需要考虑不同的付款额。\n\
  \n要创建一个双变量模拟运算表，你需要将一组输入数据放在表格左侧的一列中，并将另一组输入数据放在表格上方的一行中。例如，图 11-6 显示了一个使用`FV()`函数计算投资未来价值的双变量模拟运算表：\n\
  \n- 区域`D6:D11`包含分期数参数（48、60、72、84、96 或 108 个月）的输入值。\n- 区域`E5:I5`包含付款额参数（-$500.00、$550.00、–$600.00、-$650.00\
  \ 或-$700.00）的输入值。这些单元格已应用货币数字格式。\n- 单元格`A7`是行引用单元格，单元格`A9`是列引用单元格。当你通过从功能区中选择**数据**\
  \ > **分析** > **模拟分析** > **模拟运算表**，或从菜单栏中选择**数据** > **模拟运算表**来创建模拟运算表时，你需要在“模拟运算表”对话框中同时指定行引用单元格和列引用单元格。\n\
  - 单元格`D5`包含模拟运算表的公式：`=FV(B1,A9,A7)`。\n- 每个结果单元格都包含公式`{=TABLE(A7,A9)}`。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
