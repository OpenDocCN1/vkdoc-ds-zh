  *混合引用*。引用中列或行是绝对的，而另一部分是相对的。例如，`$B4`对于列（`B`）是绝对的，对于行（`4`）是相对的；而`B$4`对于列是相对的，对于行是绝对的。当你复制并粘贴混合引用时，绝对部分保持不变，但相对部分会改变以反映新位置。


  如果你正在输入引用，可以在引用中输入`$`符号使其成为绝对引用或混合引用。如果你通过选择单元格来输入引用，请在你正在编辑的单元格或编辑栏中单击引用，然后从功能区中选择**公式**
  > **函数** > **切换引用**。重复单击**切换引用**按钮，可在引用的绝对、相对、列绝对和行绝对版本之间循环切换。如果公式引用了多个单元格，你需要分别更改每个单元格的引用——无法一次性全部更改。


  ##### 引用命名单元格和区域


  为了使引用更易于输入和识别，你可以为任何单元格或区域指定名称，如第 3 章“使用命名区域标识部分”一节所述。然后，你可以按名称引用该单元格或区域，即使它位于你已忘记名称的其他工作表上。


  #### 理解公式的组成部分


  当需要在单元格中执行自定义计算时，请使用公式而非函数。你只需使用适当的计算运算符（例如，加法的`+`号和减法的`–`号）输入一个简单的公式即可。在本节中，你将了解计算运算符，尝试在工作表中使用它们，并学习
  Excel 应用它们的顺序——以及如何更改该顺序。


