  ## 本章小结


  在本章中，你学习了如何从数据中创建强大且具有说服力的图表。你了解了图表的各个组成部分叫什么、如何创建图表，以及如何将图表放置在工作表上或独立的图表工作表中。你还可以让
  Excel 显示你需要的图表组件，并按需设置其格式。


  为了节省时间和精力，你还学会了通过将自定义图表格式粘贴到现有图表上，或据此创建自定义图表模板来重复使用这些格式。


  现在，你还了解了在 Word 文档或 PowerPoint 演示文稿中使用 Excel 图表的不同方式；你知道在哪种情况下哪种方式效果最佳；你也知道了如何插入、格式化和编辑图表。


  在下一章中，我将向你展示如何使用数据条、色阶、图标集和迷你图来增强工作表的效果。准备好后，请翻到下一页开始学习。


