  -   **向迷你图添加标记。** 在功能区`迷你图`选项卡上的`标记`组中，根据需要选中`高点`复选框、`低点`复选框、`负值`复选框、`首个`复选框或`最后一个`复选框——或者选中`全部`复选框以选中所有其他复选框。要更改标记颜色，请选择`迷你图
  格式 > 标记`，然后在`标记`对话框中进行操作（见图 8-16）。


