  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 14 章：使用宏和 VBA 自动执行任务**\n\
  \n**426**\n\n- **属性窗口。** 此窗口显示当前所选对象的属性。在图 14-10 中，该对象是名为`Module3`的代码模块，它只有一个属性——`Name`属性。您可以通过选中`(名称)`框右侧的内容并输入新名称来更改代码模块的名称。\n\
  \n- **代码窗口。** 此窗口显示所选代码模块或附加到用户窗体（您创建的自定义对话框）的代码表的代码。必要时，您可以同时打开多个代码窗口。\n\n- **标准工具栏。**\
  \ 此工具栏包含用于标准操作的命令，例如切换到 Excel、保存工作以及剪切、复制和粘贴。\n\n**注意：** 如果 Visual Basic 编辑器的任何工具栏不可见，请从菜单栏选择\"\
  视图\"→\"工具栏\"，然后在\"工具栏\"子菜单中点击该工具栏的名称。\n\n- **编辑工具栏。** 此工具栏包含用于编辑代码的命令——例如，设置断点（代码自动停止运行的点，以便您可以一次执行一个命令并观察效果）。\n\
  \n- **调试工具栏。** 此工具栏包含用于调试代码的命令——逐步执行代码、消除错误或以其他方式改进代码。\n\n\n\n##### 检查示例宏\n\n现在来看示例宏的代码。它看起来应该与以下代码类似，其中的文件路径和工作表名称可能略有不同：\n\
  \n```\nSub Copy_Active_Worksheet_to_Archive_Workbook()\n'\n' Copy_Active_Worksheet_to_Archive_Workbook\
  \ Macro\n' 将活动工作表复制到 Archive.xlsx 工作簿。\n'\n' 快捷键：Option+Cmd+Shift+C\n'\nWorkbooks.Open\
  \ Filename:= _\n\"Macintosh HD:Users:guy:Documents:Ongoing:Learn Excel 2011:Examples:Archive.xlsx\"\
  \nActiveWindow.ActivatePrevious\nSheets(\"Sheet1\").Select\nSheets(\"Sheet1\").Copy\
  \ After:=Workbooks(\"Archive.xlsx\").Sheets(255)\nActiveWorkbook.Save\nActiveWindow.Close\n\
  End Sub\n```\n\n以下是快速解析：\n\n宏以`Sub`关键字开头，表示它是一个子程序或子过程（即宏），后面跟着宏的名称和一对空括号。\n\n接下来的六行是注释行。注释以直单引号（`'`）开头，是为人类阅读者而非计算机提供的文本。第一、第四和第六行注释是空行，作为分隔符，使代码更易于阅读。第二行给出了宏的名称；第三行给出了描述；第五行给出了快捷键。这些信息有助于你识别宏及其功能。\n\
  \n语句`Workbooks.Open Filename:=`打开工作簿，其路径和文件名包含在双引号内的字符串中。从技术上讲，该语句使用`Open`方法（一种命令）将工作簿添加到`Workbooks`集合中的`Workbook`对象中。\n\
  \n**注意：** 你可以通过在断行末尾添加一个空格后跟下划线的方式，将单条代码语句拆分为多行。你可以在`Workbooks.Open`语句中看到这样的示例。\n\
  \n`ActiveWindow.ActivatePrevious`语句告诉 VBA 从当前活动窗口中激活上一个窗口。\n\n`Sheets(\"Sheet1\"\
  ).Select`语句使用`Sheets`集合的`Select`命令来选择你指定的工作表。`Sheets`集合包含代表工作表的`Sheet`对象。\n\n`Sheets(\"\
  Sheet1\").Copy`语句使用`Sheets`集合的`Copy`命令来复制按名称指定的工作表。`After:=`参数告诉 VBA 将复制的工作表放置在何处——在本例中，是放置在存档工作簿的\
  \ Sheet 255 之后。\n\n`ActiveWorkbook.Save`语句使用`ActiveWorkbook`对象的`Save`方法来保存活动工作簿。\n\
  \n同样，`ActiveWorkbook.Close`语句使用`ActiveWorkbook`对象的`Close`方法来关闭活动工作簿。\n\n宏以`End Sub`行结束。\n\
  \n##### 编辑示例宏\n\n查看代码及其解释后，你可能会发现我们需要解决两个问题：\n\n- 宏通过名称指定要复制的工作表——`Sheet1`。我们需要复制的是活动工作表。\n\
  - 宏通过编号指定复制后放置的位置——`255`。我们需要将其放置在最后一个工作表之后，无论其编号是多少。\n\n要解决第一个问题，请选中`Sheets(\"\
  Sheet1\")`，然后键入`activesheet`进行覆盖。按上箭头键移动到上一条语句，你会看到 Visual Basic 编辑器将大小写自动更正为`ActiveSheet`。在你输入代码时，Visual\
  \ Basic 编辑器会进行检查，从而帮助你在创建代码时捕获错误，而不是等到运行代码时才发现问题。\n\n要解决第二个问题，请选中`Sheets(255)`中的`255`，然后键入以下内容：\n\
  \n```\nWorkbooks(\"Archive.xlsx\").Sheets.Count\n```\n\n你修改后的语句应如下所示：\n\n```\nActiveSheet.Copy\
  \ After:=Workbooks(\"Archive.xlsx\").Sheets(Workbooks(\"Archive.xlsx\").Sheets.Count)\n\
  ```\n\n现在这段代码的含义是“将活动工作表复制到工作簿`Archive.xlsx`中，并将其放置在现有工作表的最后一张之后。”\n\n##### 测试宏\n\
  \n\n\n现在通过单步执行宏来测试它——一次执行一条语句。\n\n点击包含要复制的工作表的工作簿，然后反复按 `Cmd+Shift+I` 单步执行宏。您将看到\
  \ Visual Basic 编辑器在执行代码时依次高亮每一行，并看到 Excel 窗口打开、切换和关闭。\n\n##### 保存更改\n\n保存您对宏所做的更改。您可以在\
  \ Visual Basic 编辑器中按 `Cmd+S`（与大多数 Mac 应用程序一样），或单击标准工具栏上的“保存”按钮。\n\n##### 从 Visual\
  \ Basic 编辑器返回 Excel\n\n要从 Visual Basic 编辑器返回 Excel，请在活动 Visual Basic 编辑器的情况下，从菜单栏中选择“Excel\
  \ 关闭并返回 Microsoft Excel”。或者按 `Cmd+Q`。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n## 第 14 章：使用宏和 VBA 自动化任务\n\n#### 隐藏个人宏工作簿\n\n完成宏的编辑后，再次将个人宏工作簿从视图中隐藏。在个人宏工作簿处于活动状态时，从菜单栏中选择“窗口”>“隐藏”。\n\
  \n## 总结\n\n在本章中，您学习了如何使用宏录制器录制宏来自动执行重复性任务。您现在知道如何通过几种便捷的方式运行宏，以及如何在 Visual Basic\
  \ 编辑器中打开宏以进行编辑。您还了解了在 Excel 中自动化任务时除 VBA 之外的其他方法。\n\n这本书到此结束——除了索引部分，您可能已经看过了。希望您觉得本书有用，并且现在能够自信且高效地处理\
