  ## 第二部分：执行计算与呈现数据


  在本书的这一部分中，您将快速掌握公式、函数、图表以及图片和迷你图等图形元素。


  在第 5 章中，我们讨论了什么是公式和函数，以及两者之间的区别。然后，本章将教您如何使用 Excel 的计算运算符创建自己的公式，从每个使用单个计算运算符的简单公式开始，然后过渡到使用多个计算运算符的更复杂公式。您还将学习如何覆盖
  Excel 默认的运算符求值顺序，以及如何解决公式中常见的常见问题。


  在第 6 章中，您将学习如何使用 Excel 提供的各种工具在工作表中插入函数、找到所需的函数，并将函数指向计算所需的数据。本章的第二部分解释了 Excel 不同类别的函数，例如数据库函数、逻辑函数以及数学和三角函数，并给出了如何使用常用函数的示例。


  在第 7 章中，我们介绍了如何使用 Excel 种类丰富的图表来清晰且有说服力地呈现数据。您将了解在工作表中放置图表的不同方式、图表的组成部分以及可以使用的图表类型。然后，我们将深入探讨如何根据数据创建图表、按您想要的方式布局，并赋予其所需的外观。我们还将研究如何重复使用您创建的自定义图表，以及如何在
  Word 文档或 PowerPoint 演示文稿中使用 Excel 图表。


