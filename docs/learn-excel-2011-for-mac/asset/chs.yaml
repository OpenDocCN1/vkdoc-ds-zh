  \n**346 第 11 章：使用模拟分析、单变量求解和规划求解解决业务问题**\n\n**图 11–19.** *在“规划求解参数”对话框中，为你希望规划求解解决的问题设置参数。*\n\
  \n### 4. 确保`设置目标`框中显示的是你要分析的单元格。（此框会显示你在步骤 2 中选择的单元格。）如果单元格错误，请点击`设置目标`框，然后点击正确的单元格。\n\
  \n如果你想将“规划求解参数”对话框暂时折叠起来，可以点击`设置目标`框右侧的`折叠对话框`按钮。\n\n你也可以在`设置目标`框中直接键入单元格引用或单元格名称。\n\
  \n### 5. 在`到`区域中，选择`最大值`选项按钮、`最小值`选项按钮或`值为`选项按钮。如果你选择了`值为`选项按钮，请在其右侧的框中键入该值。\n\n\
  ### 6. 在`通过更改可变单元格`框中，输入你希望规划求解更改的单元格的引用或名称。你可以点击工作表中的单元格（可以折叠“规划求解参数”对话框，也可以不折叠直接在表格中操作），或者直接键入引用或名称。\n\
  \n### 7. 如果你想约束规划求解对单元格值的处理方式，请使用`遵守约束`列表框右侧的控件进行操作：\n\n#### a. 点击`添加`按钮以显示“添加约束”对话框（参见图\
  \ 11–20）。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-347_1.png)\n\
  \n**347 第 11 章：使用模拟分析、单变量求解和规划求解解决业务问题**\n\n**图 11–20.** *使用“添加约束”对话框为计算设置所需的任何约束条件。*\n\
  \n#### b. 在`单元格引用`框中输入单元格引用或名称。\n\n#### c. 在中间的下拉菜单中选择比较关系。\n\n#### d. 在`约束值`框中输入约束条件。你可以输入一个值，或者输入你将输入该值的单元格的引用或名称。\n\
  \n#### e. 如果你想添加另一个约束条件，请点击`添加`按钮。否则，点击`确定`按钮关闭“添加约束”对话框。你添加的约束条件会出现在`遵守约束`列表框中。\n\
  \n### 8. 如果你希望规划求解仅对未约束的变量使用非负值（正值或零），请选中`使无约束变量为非负数`复选框。\n\n### 9. 在`选择求解方法`下拉菜单中，根据需要选择`GRG\
  \ 非线性`、`单纯线性规划`或`演化`。如果你不熟悉不同的求解方法，请从`GRG 非线性`开始尝试。\n\n**注意：** 规划求解使用单纯形法求解线性问题（其中两个相关量之间的变化是直接成比例的），并使用广义简约梯度\
  \ (GRG) 非线性法求解非线性问题（其中相关量之间的变化不是直接成比例的）。演化方法则使用遗传算法。\n\n### 10. 如果你需要控制规划求解执行计算的方式，请点击`选项`按钮，然后在“选项”对话框的三个选项卡上选择相关选项（如图\
  \ 11–21 所示）。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-348_1.png)\n\
  \n![](img/index-348_2.png)\n\n![](img/index-348_3.png)\n\n![](img/index-348_4.png)\n\
  \n**348 第 11 章：使用模拟分析、单变量求解和规划求解解决业务问题**\n\n**图 11–21.** *你可以在规划求解的“选项”对话框的三个选项卡中选择高级选项。*\n\
  \n### 11. 点击`求解`按钮，让规划求解开始分析问题。如果规划求解找到了解决方案，它会显示“规划求解结果”对话框，并显示消息“规划求解找到一个解”（参见图\
  \ 11–22）。\n\n**图 11–22.** *在“规划求解结果”对话框中，你可以选择是保留规划求解的解决方案还是恢复原始值。*\n\n**注意：** 如果规划求解找不到问题的解决方案，请选中“规划求解结果”对话框中的`返回规划求解参数对话框`复选框，然后点击`确定`按钮。在“规划求解参数”对话框中更改参数，然后再次尝试求解问题。\n\
  \n### 12. 如果你希望保留规划求解找到的解决方案，请选择`保留规划求解的解`选项按钮。否则，请选择`还原初值`选项按钮。\n\n### 13. 点击`确定`按钮关闭“规划求解结果”对话框。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**349 第 11 章：使用模拟分析、单变量求解和规划求解解决业务问题**\n\
  \n## 本章小结\n\n在本章中，你学习了如何使用模拟运算表来评估一个或两个变量对计算结果的影响，如何使用方案来试验不同的数据，以及如何使用单变量求解解决简单问题。你还学习了如何下载、安装和使用规划求解来解决更复杂的问题。\n\
  \n在下一章中，我将向你展示如何使用 Excel 强大的数据透视表功能。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**351**\n\n## 第 12 章\n\n"
- "# 使用数据透视表分析数据\n\n在本章中，我们将探讨如何使用数据透视表来分析工作表中的数据并从中得出结论。数据透视表非常适合向数据提问，以及从不同角度查看数据，而无需在单独的工作表中多次输入数据。\n\
  \n我们首先来了解一下什么是数据透视表以及你能用它做什么。之后，我将向你展示如何创建数据透视表，既可以使用 Excel 的自动化工具（该工具可以为数据透视表提供一个快速起点），也可以手动将字段放置在数据透视表框架上（这可以让你完全掌控一切）。\n\
  \n\n\n构建数据透视表后，您通常需要对其进行调整，以显示不同的数据或以不同的方式显示相同的数据。我将通过几个示例，向您展示构建数据透视表后可以轻松进行的几种调整类型。\n\
  \n当数据透视表按您所需的方式排列好后，您可以设置其格式并选择选项来控制其显示效果。您还可以对数据透视表中的数据进行排序和筛选，以仅显示您需要的信息。\n\n\
  #### 理解数据透视表是什么以及能做什么\n\n数据透视表是一种特殊的报表，它会将数据表中的字段和记录重新排列成不同的次序，以便您检查它们之间的关系。您*透视*（即旋转）数据透视表中的列，以不同的方式对数据进行汇总显示。\n\
  \n例如，请看图 12–1 所示的工作表。该工作表包含一个数据表，用于跟踪一家拥有四条产品线（硬件、软件、服务和耗材）的公司的销售额。该表使用以下列：\n\n\
  - `Sale`。用于标识每笔销售的唯一序列号。\n- `Year`、`Month` 和 `Day`。销售发生的年、月、日。将这些项目放在单独的列中，可以更轻松地按时间进行筛选——例如，比较不同月份的销售额，或查看某位销售人员在\
  \ 1 月份销售了哪些产品。\n- `Salesperson`。执行销售的销售代表姓名。\n- `Line`。所售产品的产品线。\n- `Product`。所售产品的名称。\n\
  - `Quantity`。所售产品的数量。\n- `Price`。所售产品的单价。\n- `Total Price`。所售产品的总价（`Quantity` 乘以\
  \ `Price`）。\n- `Customer`。购买产品的公司或组织名称。\n\n这一切都很直观，您可以使用数据输入表单向数据表添加数据或编辑现有记录。您也可以轻松查看销售总额（例如，通过汇总\
  \ `Total Price` 列中的数字）。但当您需要深入挖掘细节时，就需要不同的工具了。\n\n这就是数据透视表的用武之地。通过从此类数据表创建数据透视表，您可以快速找到诸如以下问题的答案：\n\
  \n- 您最畅销的产品线是哪个？最畅销的产品又是哪个？\n- 今年的销售额与去年相比如何？\n- 您三月份的销售明星是谁？是否有另一位销售人员需要一些鼓励——或者一张解雇通知书？\n\
  - 哪些是您的关键客户？其中哪些客户需要更多的一对一关注，才能将销售额提升到去年的水平？\n\n在接下来的章节中，我们将使用数据表中的数据创建一个数据透视表，然后对其进行操作以查看其显示结果。\n\
  \n**注意：** 如果您想完成本章中的示例，您需要一个与屏幕截图中类似的数据库表。您可以自己创建一个，或者（更简单的方法）从 Apress 网站（[www.apress.com](http://www.apress.com)）上本书的页面下载示例工作簿。\n\
  \n#### 创建和布局数据透视表\n\n您可以从数据库表或数据区域创建数据透视表。如果已有一个像示例中那样的数据库表，您可以从它创建数据透视表。否则，请创建您将使用的数据库表，或者像往常一样在工作表中输入数据而不创建数据库表。\n\
  \n数据准备就绪后，您可以自动或手动创建数据透视表。哪种方法效果最佳取决于您的数据以及您想要用它做什么，但通常可以通过自动创建数据透视表然后根据需要进行调整来节省时间。如果自动创建的数据透视表不符合您的需求，您也可以从头开始手动创建数据透视表。\n\
  \n##### 自动创建数据透视表\n\n要自动创建数据透视表，请按照以下步骤操作：\n\n1. 打开工作簿，并显示包含数据透视表要使用的表或数据的工作表。\n\
  2. 单击要用于数据透视表的表。如果您使用的是区域而不是命名表，请选择该区域。\n3. 在功能区的“`数据分析`”菜单中选择“`数据透视表`”，并单击“`数据透视表`”按钮的主要部分。您也可以单击“`数据透视表`”弹出按钮，然后在弹出菜单中单击“`创建自动数据透视表`”，但这并无优势。Excel\
  \ 随后将执行以下操作：\n   - 在新工作表中插入一个自动数据透视表\n   - 给新工作表一个默认名称，例如 `Sheet5`\n   - 显示“`数据透视表生成器`”窗口\n\
  \   - 将“`数据透视表`”选项卡添加到功能区并显示它\n   - 在您首次创建数据透视表时显示一些关于数据透视表的信息\n\n图 12–2 显示了从示例数据表生成的自动数据透视表，并且“`数据透视表生成器`”窗口位于工作表前面。\n\
  \n自动创建数据透视表后，您通常需要对其进行调整。这是因为 Excel 很少能准确猜测出您需要将哪些信息放在哪里。\n\n要调整数据透视表，请使用您将在下一节中学到的技巧，该部分将向您展示如何从头开始构建数据透视表。\n\
  \n##### 手动创建数据透视表\n\n如果自动创建数据透视表没有给出有用的结果，或者您更倾向于手动操作，您可以使用“`数据透视表生成器`”手动构建数据透视表。\n\
  \n要手动创建数据透视表，请按照以下步骤操作：\n\n1. 打开工作簿，并显示包含数据透视表要使用的表或数据的工作表。\n2. 单击要用于数据透视表的表。如果您使用的是区域而不是命名表，请选择该区域。\n\
  3. 在功能区的“`数据分析`”菜单中选择“`数据透视表`”>“`创建手动数据透视表`”，或在菜单栏中选择“`数据`”>“`数据透视表`”，以显示“`创建数据透视表`”对话框（参见图\
  \ 12–3）。如果您使用的是命名表，还可以在功能区中选择“`表格工具`”>“`用数据透视表汇总`”；如果您使用的是区域，则此命令不可用。\n4. 在“`创建数据透视表`”对话框顶部的“`选择要分析的数据`”区域中，选择“`使用此工作簿中的表或区域`”选项按钮。\n\
  \n\n\n**注意：**除了可以通过工作表中的数据创建数据透视表之外，您还可以从外部数据源（如 FileMaker 数据库或 Access 数据库）创建数据透视表。为此，请在`创建数据透视表`对话框的`选择要分析的数据`区域中，选中`使用外部数据源`选项按钮，单击`获取数据`按钮，然后选择数据源。但在执行此操作之前，您必须安装开放数据库连接\
  \ (ODBC) 驱动程序，以使 Excel 能够连接到该数据源，具体方法详见第 10 章。\n\n5. 确保`位置`文本框中显示的是您要使用的表格或区域。如果您在第\
  \ 2 步中已点击表格或选定了区域，那么一切就绪。如果没有，请键入表格名称，或在工作表中点击并拖动以选定区域（如有必要，可先点击`折叠对话框`按钮，将`创建数据透视表`对话框移开）。\n\
  \n6. 在`创建数据透视表`对话框的`选择放置数据透视表的位置`区域中，选择合适的选项按钮：\n\n    - **新工作表。** 如果您希望将数据透视表放置在新工作表中，请选中此选项按钮。这通常最为清晰，因为它为数据透视表提供了充足的空间。\n\
  \    - **现有工作表。** 如果您希望将数据透视表放置在现有工作表中，请选中此选项按钮。点击`位置`文本框，点击工作表的标签，然后在工作表中点击并拖动以输入位置。\n\
  \n7. 点击`确定`按钮关闭`创建数据透视表`对话框。Excel 会在您选择的新工作表或现有工作表中放置一个数据透视表框架，并显示`数据透视表生成器`窗口。图\
  \ 12–4 显示了一个名为`Sheet4`的新工作表上的数据透视表框架。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-356_1.png)\n\n**第 12 章：使用数据透视表分析数据**\n\n**357**\n\n**图 12–4.** *当您手动插入数据透视表时，Excel\
  \ 会创建一个空的框架，您可以在该框架上按照需要的方式布置数据透视表。*\n\n现在您已经插入了数据透视表的框架，接下来可以从`数据透视表生成器`窗口的`字段名称列表框`中向其添加字段。\n\
  \n#### 理解数据透视表框架与数据透视表生成器窗口的工作原理\n\n花点时间查看一下数据透视表框架和`数据透视表生成器`窗口。您需要使用`数据透视表生成器`窗口在数据透视表框架上排列字段。\n\
  \n以下是您需要了解的基本要点：\n\n- **字段名称列表框。** `数据透视表生成器`窗口中的此列表框包含您所选数据表格或区域中 Excel 找到的每个字段的一个条目。列表中的每个项目都有一个复选框，您可以选中它以将该字段添加到数据透视表中。数据透视表框架没有与`字段名称列表框`匹配的区域，因为当您使用这些字段时，它们会进入数据透视表的各个区域。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**358**\n\n**第 12 章：使用数据透视表分析数据**\n\
  \n**注意：** Excel 会自动解析`字段名称列表框`中的字段，并决定它们属于数据透视表的哪个部分。考虑到 Excel 除了能识别日期、货币和文本等项目外，并不了解您的数据表格或区域的具体内容，它在这一点上做得相当智能。但您通常需要将一个字段从`数据透视表生成器`窗口的一个区域拖动到另一个区域，以将其移动到数据透视表的另一部分。\n\
  \n- **报表筛选。** 数据透视表顶部的这个区域充当整个数据透视表的筛选器，将表格的其余部分缩小到仅显示与您的筛选条件匹配的数据。例如，如果您通过将`销售人员`字段拖到`数据透视表生成器`窗口中的`报表筛选`框，将其放入`报表筛选`区域，您将获得一个销售人员下拉菜单，您可以从中选择要显示谁的数据。正如您在本章后面将看到的，您可以按一个、两个或更多字段进行筛选。\n\
  \n- **行区域。** 数据透视表左侧的这个区域用于显示行...\n\n\n\n"
- "# 数据透视表布局与字段分配\n\n`headings`（行区域）。您可以通过将相应字段拖放到`PivotTable Builder`窗口中的`Row Labels`框来指定这些行标题。\n\
  \n*列区域。* 数据透视表顶部的这个区域显示列标题。您可以通过将相应字段拖放到`PivotTable Builder`窗口中的`Column Labels`框来选择这些列标题。\n\
  \n*值区域。* 数据透视表正文中的这个区域（在大多数情况下是数据透视表的主要部分）包含值。您可以通过将相应字段拖放到`PivotTable Builder`窗口中的`Values`框来指定这些值。\n\
  \n如果觉得难以理解，别担心。您马上就会明白数据透视表是如何工作的。\n\n##### 向数据透视表框架添加字段\n\n要创建数据透视表，您需要将字段拖放到`PivotTable\
  \ Builder`窗口中的`Report Filter`框、`Row Labels`框、`Column Labels`框和`Values`框中，从而向数据透视表框架添加字段。\n\
  \n**注意：** 您也可以通过选中`Field name`列表框中的复选框来添加字段。当您选中一个字段时，Excel 会根据其内容自动放置它。\n\n由于 Excel\
  \ 不知道您的数据代表什么以及您想要展示什么，它通常会将字段放在错误的位置。因此，最好的做法通常是手动拖放字段。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-358_1.png)\n\n**第 12 章：使用数据透视表分析数据**\n\n**359**\n\n需要将哪些字段拖放到何处，取决于您的数据源以及您想要展示的内容。以下是在数据源中使用字段的逐步演示。如果您使用的是示例数据源，结果应类似；如果您的数据源不同，结果会有所不同，但数据透视表的工作方式基本相同。\n\
  \n在`PivotTable Builder`窗口的`Field name`列表框中，单击`Year`字段并将其拖放到`Report Filter`框中。Excel\
  \ 会选中`Year`复选框，在单元格 A1 中输入`Year`，并为单元格 B1 中的年份选择创建一个弹出菜单（参见图 12-5）。\n\n**图 12–5.**\
  \ *将 Year 按钮从 PivotTable Builder 窗口的 Field name 框拖放到 Report Filter 框中，以创建此处单元格 B1\
