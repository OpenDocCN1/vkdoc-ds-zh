  \n**215**\n\n| **数学与三角函数** | **返回结果** |\n| --- | --- |\n| `QUOTIENT` | 商，即除法运算的整数部分。例如，`=QUOTIENT(25,3)`\
  \ 返回 8。 |\n| `RADIANS` | 将指定角度数转换为弧度数。 |\n| `RAND` | 介于 0 和 1 之间（包含边界）的随机数。每次计算时该数字都会改变。\
  \ |\n\n\n\n`RANDBETWEEN`  \n一个介于指定下界值和上界值之间的随机数。例如，`=RANDBETWEEN(1,10)` 返回一个介于 1\
  \ 到 10（包含）之间的随机数。每次重新计算工作表时，该数字都会发生变化。（从技术上讲，该数字是伪随机数而非真随机数；出于某些目的，这种区别很重要。）\n\n\
  `ROMAN`  \n将指定的阿拉伯数字转换为罗马数字。例如，`=ROMAN(2011)` 返回 `MMXI`。\n\n`ROUND`  \n将指定数字四舍五入到指定的小数位数。例如，`=ROUND(3.33333,2)`\
  \ 返回 `3.33`。\n\n`ROUNDDOWN`  \n将指定数字向下舍入到指定的小数位数。例如，`=ROUNDDOWN(18.57321,2)` 返回\
  \ `18.57`。\n\n`ROUNDUP`  \n将指定数字向上舍入到指定的小数位数。例如，`=ROUNDUP(18.57321,2)` 返回 `18.58`。\n\
  \n`SERIESSUM`  \n幂级数之和。\n\n`SIGN`  \n如果指定数字为正数则返回 1，为零则返回 0，为负数则返回 -1。\n\n`SIN`\
  \  \n指定角度的正弦值。\n\n`SINH`  \n指定数字的双曲正弦值。\n\n`SQRT`  \n指定数字的平方根。\n\n`SQRTPI`  \n指定数字乘以\
  \ Pi 后的平方根。\n\n`SUBTOTAL`  \n数据库中指定区域的小计。\n\n`SUM`  \n指定数字之和。例如，`=SUM(1,2,3)` 返回\
  \ 6。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 6 章：使用 Excel 的内置函数**\n\
