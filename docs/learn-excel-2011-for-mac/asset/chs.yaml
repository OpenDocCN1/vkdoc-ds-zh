  **图 1-10.** *Excel 应用程序窗口和工作簿的主要元素*


  *公式栏。* 这是功能区下方的栏。此区域显示活动单元格中的数据或公式，并为你提供一个方便的位置来输入和编辑数据。


  *引用区域。* 此区域出现在公式栏的左端。它显示活动单元格的地址（例如，`A1`）或你为方便引用而给该单元格指定的名称。


  *行标题。* 这些是屏幕左侧标识每一行的数字。第一行是 1，第二行是 2，依此类推，直到最后一行 1048576。


  *列标题。* 这些是工作表网格顶部标识列的字母。第一列是 A，第二列是 B，依此类推，直到 Z。Excel 接着使用两个字母：AA 到 AZ，BA 到 BZ，依此类推直到
  ZZ。之后，Excel 使用三个字母：AAA、AAB，依此类推直到最后一列 XFD。


  [www.it-ebooks.info](http://www.it-ebooks.info/)


  **第 1 章：学习 Excel:Mac 界面的秘诀**


  **17**


  *单元格。* 这些是由行和列交叉形成的方框。每个单元格由其列字母和行号标识。例如，A 列的第一个单元格是单元格 A1，B 列的第二个单元格是单元格 B2。工作表中的最后一个单元格是
  XFD1048576。


  *活动单元格。* 这是你正在工作的单元格——接收键盘输入的单元格。Excel 会在活动单元格周围显示一个蓝色矩形。


  *全选按钮。* 单击行标题和列标题相交处的这个按钮以选择工作表中的所有单元格。


  *工作表标签。* 每个工作表在底部都有一个显示其名称的标签。要显示一个工作表，你可以在工作表标签区域中单击该工作表的标签。


  *滚动按钮。* 单击这些按钮可以滚动工作表标签，以便你看到需要的标签。单击最左边的按钮可以一直滚回到第一个标签，或单击最右边的按钮滚动到最后一个标签。单击中间的两个按钮可以向后或向前滚动一个标签。


  *视图按钮。* 单击这些按钮可以在普通视图和页面布局视图之间切换。你将在本章后面学习如何使用这些视图。


  *拆分框。* 当你需要将工作表窗口拆分为两个或四个区域时，使用这些框。你将在本章后面的“拆分窗口以查看工作表的独立部分”一节中学习如何操作。


  *当前公式读数。* 该读数显示应用于当前单元格或区域的六种常见公式——`AVERAGE`、`COUNT`、`COUNTNUMS`、`MIN`、`MAX` 或 `SUM`——中的任一种结果。你可以单击该读数来切换公式，或选择
  `None` 项以不显示任何公式结果。例如，如果你选择单元格 `B1:B4` 并选择 `SUM` 公式，你将看到这些单元格中数值产生的总和。


  ##### 在工作表之间导航


  每个工作簿由一个或多个工作表或其他类型的表（如图表工作表或宏表）组成。你可以根据需要使用任意多个工作表，以便在单个工作簿文件中方便地分隔数据。例如，你可以为单个工作簿文件中的每个部门设置一个单独的预算规划工作表，而不是为每个部门创建一个独立的工作簿。


