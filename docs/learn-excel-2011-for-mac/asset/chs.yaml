  \ 的内置函数**\n\n**6.** 当您找到要插入的函数后，双击它。公式生成器会显示该函数的“参数”窗格，如右侧的图 6–5 所示（已输入一个参数）。\n\n\
  **7.** 单击第一个参数的框，然后输入数据。您可以键入一个值或区域名称，键入单元格引用或区域，或使用鼠标在工作表（或另一个工作表或工作簿）中选择一个单元格引用或区域。\n\
