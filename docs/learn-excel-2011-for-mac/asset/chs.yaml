  \ > `退出 Excel`。\n\n**注意：** `Excel`会自动将数据保存在嵌入的工作簿中，因此你在`Excel`窗口中工作时无需另行保存。\n\n\
  **7.** 使用功能区上`图表`选项卡和`图表布局`选项卡中的控件，按你希望的方式设置图表格式。图 7–17 展示了一个正在格式化的图表所在的`PowerPoint`幻灯片。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-259_1.png)\n\
