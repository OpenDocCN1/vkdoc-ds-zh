  ## 本章小结


  在本章中，您学习了如何将 Excel 中最有用的几种格式类型应用到工作表中。您了解了如何操作工作表的行和列以适应数据，如何格式化单元格和区域，以及如何通过使用条件格式和数据验证来节省时间并避免担忧。


  您还了解了如何使用表格格式和样式进行快速格式化，并学会了如何为工作表添加页眉和页脚，以便轻松识别工作表及其内容。


  这是本书第一部分的结尾。在第二部分中，我将向您展示如何执行计算并呈现数据。


