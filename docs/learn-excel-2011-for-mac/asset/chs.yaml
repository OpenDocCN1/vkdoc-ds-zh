- "# 第 11 章：使用假设分析、单变量求解和规划求解解决业务问题\n\n#### 使用模拟运算表评估变量的影响\n\n`模拟运算表`是一种工具，可用于计算一个或两个变量如何改变计算结果。当你想要查看工作表中的结果范围，而不是一次查看单个结果时，可以使用模拟运算表。\n\
  \n##### 创建单变量模拟运算表\n\n当你只需要查看一个变量如何改变计算结果时，可以快速创建一个模拟运算表。将输入值（即你想要测试的值）放在一行或一列中，然后告诉\
  \ Excel 在哪里找到它们。\n\n创建模拟运算表起初看起来可能有些奇怪，但你会很快掌握窍门。试试这个使用一个变量创建模拟运算表的示例。\n\n首先，创建一个新的工作表，并设置如图\
  \ 11-1 所示的简单`=FV()`公式，用于计算一项投资的未来价值。该投资年利率为 10%，期限为 12 个月，实际分期数为 60 个月，每月从你的工资中扣除\
  \ 600 美元。\n\n请按照以下步骤操作：\n\n1. 在以下单元格中输入数据标签：\n\n   `A1`. 利率\n\n   `A2`. 月份数\n\n\
  \   `A3`. 付款额\n\n   `A4`. 未来价值\n\n**图 11-1.** *模拟运算表的示例计算使用`FV()`函数来计算每月投资 600 美元的未来价值。*\n\
  \n2. 在单元格`B1`中输入公式`=10%/12`。对此单元格应用百分比数字格式，并使其显示两位小数，以便你看到 0.83%，而不是 Excel 通常显示的\
  \ 1%（这会使计算在视觉上产生混淆）。\n\n3. 在单元格`B2`中输入值`60`。\n\n4. 在单元格`B3`中输入值`-600`。应用货币数字格式以使其含义在视觉上清晰明了。\n\
  \n5. 在单元格`B4`中输入`FV`函数：`=FV(B1,B2,B3)`。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-329_1.png)\n\n**第 11 章：使用假设分析、单变量求解和规划求解解决业务问题** **329**\n\n到目前为止，一切顺利。现在设置模拟运算表的输入值。请按照以下步骤操作：\n\
  \n1. 在单元格`A6`中输入标签`月份数`。\n\n2. 在单元格`A7:A10`中输入模拟运算表的值：\n\n   `A7`. 48\n\n   `A8`.\
  \ 60\n\n   `A9`. 72\n\n   `A10`. 84\n\n**提示：** 对于这个小型模拟运算表，直接键入输入值很容易，但如果你想扩展序列，可以尝试在单元格`A7`中输入\
  \ 48，在单元格`A8`中输入 60，选中这些单元格，然后拖动自动填充柄来填充其余单元格。\n\n你的工作表现在应该看起来像图 11-2 中的那样。\n\n\
  **图 11-2.** *在单元格`A7:A10`中输入模拟运算表的输入值。*\n\n现在你可以输入使用模拟运算表的公式了。为了让模拟运算表正常工作，你需要将公式放在\
  \ Excel 期望找到它的单元格中：\n\n- **列方向的模拟运算表：** 将公式输入在第一个输入值上方的一行，且位于其右侧的下一列中。在示例中，这是单元格`B6`。\n\
  - **行方向的模拟运算表：** 将公式输入在第一个输入值左侧的一列，且位于其下方的下一行中。\n\n在这种情况下，我们正在创建一个列方向的模拟运算表，因此我们需要在单元格`B6`中输入公式。如图\
  \ 11-3 所示，输入公式`=FV(B1,A5,B3)`——换句话说，它与单元格`B4`中的公式相同，但使用单元格`A5`而不是单元格`B2`来提供月份数。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-330_1.png)\n\
  \n![](img/index-330_2.png)\n\n**330** **第 11 章：使用假设分析、单变量求解和规划求解解决业务问题**\n\n**图\
  \ 11-3.** *在输入值的右上方单元格中输入公式。*\n\n**注意：** 当你为模拟运算表输入公式时，Excel 通常会显示一个明显错误的值或一个错误值。在此示例中，公式单元格显示结果$0.00，因为单元格`A5`是空白，因此为月份数参数提供了零值。在其他公式中，零值会产生错误值。这不是问题，稍后你会看到。\n\
  \n现在你可以设置模拟运算表了。请按照以下步骤操作：\n\n1. 选择包含输入值和公式的单元格区域。在此示例中，选择区域`A6:B10`。\n\n2. 从功能区中选择**数据**\
  \ > **分析** > **模拟分析** > **模拟运算表**，或者从菜单栏中选择**数据** > **模拟运算表**，以显示“模拟运算表”对话框（见图 11-4）。\n\
  \n**图 11-4.** *在“模拟运算表”对话框中，为你正在创建的模拟运算表输入行引用单元格或列引用单元格。*\n\n3. 单击**列引用单元格**框，然后点击你用作输入值的单元格——在本例中，是单元格`A5`。Excel\
  \ 会输入绝对引用`$A$5`。\n\n**注意：** 当你创建行方向的模拟运算表时，请单击“模拟运算表”对话框中的**行引用单元格**框，然后点击你用于输入值的单元格。\n\
