  \n**5.** 从剪贴板粘贴图表。例如，点击标准工具栏上的`粘贴`按钮，或按`Cmd+V`。\n\n**6.** 点击图表右下角的`粘贴选项`按钮，然后在`粘贴选项`弹出菜单的上方组中点击相应的选项按钮（见图\
  \ 7–18）：\n\n- **图表（链接到 Excel 数据）。** 选择此选项按钮可将图表链接回其来源的`Excel`工作簿。\n\n**图 7–18.**\
