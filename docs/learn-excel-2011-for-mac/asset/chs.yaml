  ## 千位分隔符


  **千位分隔符**：`$#,###,###` 显示美元符号、七个有效数字和千位分隔符，并将数字缩小 1000 倍。


  **按 1000 缩放**：`#.##,,, " million"` 显示欧元符号、小数点前一位有效数字和小数点后两位，数字缩小一百万倍，并在后面显示单词 `million`（带一个空格）。例如，如果输入
