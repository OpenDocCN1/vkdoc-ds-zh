  \n我们将首先介绍图表的基本知识，例如将图表放置在工作簿中的不同方式、图表的组成要素以及您可以创建的图表类型。然后，本章的大部分内容将详细探讨如何根据您的数据创建图表，按照您的需求进行布局，并赋予其所需的视觉效果——从显示或隐藏组件到格式化组件以增强影响力。\n\
