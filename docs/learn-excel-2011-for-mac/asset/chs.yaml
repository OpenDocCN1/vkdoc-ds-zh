  AF00\")` 返回 127400。\n\n## IMABS\n\n复数的模（绝对值）。例如，`=IMABS(\"6+2i\")` 返回 6.708203932。\n\
  \n## IMAGINARY\n\n复数的虚部系数。例如，`=IMAGINARY(\"8+3i\")` 返回 3。\n\n## IMARGUMENT\n\n指定复数的\
  \ θ 参数（以弧度表示的角度）。例如，`=IMARGUMENT(\"4+5i\")` 返回 0.896055385。\n\n## IMCONJUGATE\n\n\
  指定复数的共轭复数。例如，`=IMCONJUGATE(\"4+5i\")` 返回 4-5i。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
