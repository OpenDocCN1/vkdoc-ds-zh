- '# 通过自动备份保护工作簿



  '
- "# 密码\n\n对于任何包含珍贵数据、不容有失的工作簿，最好设置 Excel 创建自动备份。\n\n**提示：** 设置 Excel 创建自动备份是一项很好的安全措施，但你仍应将重要工作簿备份到\
  \ Mac 之外的介质上，以防 Mac 硬盘崩溃。例如，将工作簿副本保存到 U 盘或在线存储服务（如 Apple 的 MobileMe 服务）。\n\n同样，你可能需要用密码保护重要或机密的工作簿。\n\
  \nExcel 允许你使用两种不同类型的密码：\n\n- **打开密码。** 任何想要打开该工作簿的人都必须提供此密码。没有正确的密码，Excel 将不会打开该工作簿。当你希望确保只有授权人员才能打开工作簿时，请使用打开密码。\n\
  - **修改密码。** 任何想要打开工作簿原始副本的人都必须提供此密码。没有正确的密码，Excel 允许你打开工作簿的副本，但无法打开原始文件。当你需要保护特定工作簿免遭修改，但又希望允许自由访问工作簿中的信息时，请使用修改密码。\n\
  \n设置这些安全措施的最佳时机是在首次保存工作簿时。\n\n请按照以下步骤操作：\n\n1. 在 `另存为` 对话框中，单击 `选项` 按钮以显示 `保存选项`\
  \ 对话框（见图 3-2）。\n\n   [www.it-ebooks.info](http://www.it-ebooks.info/)\n\n   ![](img/index-93_1.png)\n\
  \n   **第 3 章：创建高效工作簿和模板**\n\n   **图 3-2.** *在* `保存选项` *对话框中，可以应用打开密码、修改密码或两者。还可以设置\
  \ Excel 自动备份工作簿，或建议他人以只读方式打开。*\n\n2. 如果希望 Excel 在每次保存时自动创建此工作簿的备份，请选中 `始终创建备份` 复选框。\n\
  \n   **注意：** Excel 创建自动备份的方法是将现有已保存的工作簿版本重命名为“Backup of”加上原始文件名（例如“Backup of Office\
  \ Performance.xlsx”），然后将当前版本的工作簿保存为一个新文件。这意味着备份的是工作簿的上一个保存版本，而非最新版本，但只要频繁保存，你几乎可以恢复所有工作成果。\n\
  \n   Excel 会将备份文件保存在与原始文件相同的文件夹中。\n\n3. 要应用打开密码，请在 `打开密码` 文本框中输入密码。\n4. 要应用修改密码，请在\
  \ `修改密码` 文本框中输入密码。\n5. 如果你想建议他人以只读状态打开工作簿，使其无法保存更改，请选中 `建议只读` 复选框。\n\n   **警告：**\
  \ 请避免使用 `建议只读` 功能。除非你的同事格外配合，否则它无法阻止他们编辑工作簿。要想强制他们以只读方式打开工作簿，请为工作簿设置修改密码，并且不要与同事共享。\n\
  \n6. 单击 `确定` 按钮。如果你设置了任一类型的密码，Excel 会显示 `确认密码` 对话框（见图 3-3），提示你再次输入密码（以确保输入正确）。输入密码，然后单击\
  \ `确定` 按钮。\n\n   [www.it-ebooks.info](http://www.it-ebooks.info/)\n\n   ![](img/index-94_1.png)\n\
  \n   ![](img/index-94_2.png)\n\n   ![](img/index-94_3.png)\n\n   **第 3 章：创建高效工作簿和模板**\n\
  \n   **图 3-3.** *在* `确认密码` *对话框中再次输入密码。如果你同时设置了打开密码和修改密码，* `确认密码` *对话框会打开两次——第一次用于打开密码（此处称为“继续密码”），第二次用于修改密码。*\n\
  \n7. 当 Excel 返回 `另存为` 对话框后，像往常一样完成工作簿的保存。\n\n当你打开一个受密码保护的工作簿时，Excel 会显示 `密码` 对话框。\n\
  \n\n\n对话框。图 3-4 左侧屏幕显示了\"打开密码\"的\"密码\"对话框；要么提供密码，要么无法打开工作簿。图 3-4 右侧屏幕显示了\"修改权限密码\"\
  的\"密码\"对话框；这里，你可以提供密码并单击\"确定\"按钮以打开工作簿进行编辑，或者不提供密码直接单击\"只读\"按钮以打开工作簿，但无法保存对其所做的更改。\n\
  \n**图 3-4.** *当你尝试打开一个受\"打开密码\"保护的工作簿时，\"密码\"对话框会要求输入密码（左图）。如果工作簿设置了\"修改权限密码\"，\"\
  密码\"对话框会包含\"只读\"按钮（右图），允许你在不提供密码的情况下打开工作簿。*\n\n要从工作簿中删除密码，请执行以下步骤：\n\n1.  打开工作簿，当`Excel`要求时提供密码。\n\
  2.  选择\"文件\" -> \"另存为\"以显示\"另存为\"对话框。\n3.  单击\"选项\"按钮以显示\"保存选项\"对话框。\n4.  根据需要，删除\"\
  打开权限密码\"文本框或\"修改权限密码\"文本框中的密码。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-95_1.png)\n\n**第 90 页**\n\n**第 3 章：创建有效的工作簿和模板**\n\n5.  单击\"确定\"\
  按钮关闭\"保存选项\"对话框。`Excel`会返回\"另存为\"对话框。\n6.  单击\"保存\"按钮，使用原始名称和位置保存工作簿。\n\n`Excel`会显示一个对话框，确认你要覆盖该文件。\n\
  \n7.  单击\"替换\"按钮。`Excel`会保存没有密码的工作簿。\n\n**输入工作簿属性**\n\n如果你在\"常规\"偏好设置窗格中选中了\"提示输入工作簿属性\"\
  复选框，则当你首次保存工作簿时，`Excel`会自动显示\"属性\"对话框。如图 3-5 所示，\"属性\"对话框包含五个选项卡：\"常规\"、\"摘要\"、\"\
  统计\"、\"内容\"和\"自定义\"。你只能在\"摘要\"选项卡和\"自定义\"选项卡中输入数据，因此首先单击\"摘要\"选项卡将其置于前端。\n\n**图\
  \ 3-5.** *在\"属性\"对话框的\"摘要\"选项卡的字段中输入工作簿的详细信息。*\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**第 3 章：创建有效的工作簿和模板**\n\n**第 91 页**\n\n**注意：** \"属性\"对话框的\"常规\"选项卡包含文件名称、类型（例如，`Microsoft\
  \ Excel`工作簿）、位置（包含工作簿的文件夹）、创建日期（首次保存工作簿的日期）和上次修改日期（上次保存工作簿的日期）的只读信息。`Excel`在你首次保存工作簿之前不会编译这些信息，因此当你在首次保存文件时`Excel`自动显示\"\
  属性\"对话框，这些字段将是空白的。\"常规\"选项卡还包含一个\"只读\"复选框和一个\"隐藏\"复选框。\"统计\"选项卡包含文件创建时间、上次修改时间、上次打印时间、上次保存文件的用户名、修订号以及总编辑时间的只读信息。\n\
  \n\"内容\"选项卡包含文档的工作表、图表工作表、宏工作表以及对话框工作表的列表。\n\n**在\"摘要\"选项卡上输入标准属性**\n\n在\"摘要\"选项卡的字段中输入相关详细信息——工作簿的标题和主题、你的姓名、经理的姓名等。`Excel`会将你的用户名填入\"\
  作者\"框中，但其他字段需要你自己填写。即使`Excel`正确地输入了你的姓名（而不是像\"授权用户\"这样的内容，这可能被设置为你的用户名），你可能也希望更改\"\
  作者\"字段以包含同事或业务团队——或者将责任推给你的经理。\n\n**注意：** 在\"超链接基础\"框中，你可以输入构成工作簿中超链接基础的`URL`。例如，如果所有`URL`都以`http://www.surrealmacs.com`开头，请输入该地址`http://www.surrealmacs.com`。\n\
  \n\n\n"
- "# 超链接基础框中的 URL\n\n随后，你只需在工作表中输入每个 URL 的剩余部分。（对于不使用超链接基础的 URL，在工作表中输入完整的 URL。）如果你希望\
  \ Excel 在工作簿中包含预览，请选中`使用此文档保存预览图片`复选框。保存预览可以让工作簿在“快速查看”中更易识别，而且只会让工作簿文件略微变大，因此通常是个好主意。\n\
  \n**提示：** 你可以使用“聚焦”搜索，通过`标题`、`主题`、`作者`、`关键词`和`批注`字段进行查找——因此，你可能希望在工作簿中填写这些字段。\n\n\
  ## 在“自定义”选项卡上输入额外数据\n\n“摘要”选项卡上的字段足以存储基本的元数据，但如果你需要严格管理工作簿，则希望在其中存储更多属性信息。为此，请点击`自定义`选项卡以将其显示出来（参见图\
  \ 3–6）。在此你将看到一系列内置属性，包括`客户`、`部门`、`完成日期`和`项目`。你也可以创建自己的属性。\n\n**图 3–6.** *在“属性”对话框的“自定义”选项卡上，你可以为多种内置属性输入数据，或创建你自己的额外属性。你还可以将属性链接到工作簿中的内容。*\n\
  \n若要创建自定义属性，请在`名称`文本框中输入其名称。你也可以将工作簿中命名区域第一个单元格的内容分配给一个属性。这一功能使你能够自动将特定单元格的内容存储到属性中，从而使其与其他属性信息一起被建立索引。\n\
  \n若要添加属性信息，请遵循以下步骤：\n\n1.  **选择属性：**\n    -   如果属性是内置的，请在`名称`列表框中点击其名称。\n    - \
  \  若要创建自定义属性，请在`名称`框中输入一个新名称。\n\n2.  **在“类型”弹出菜单列表中**，为属性选择适当的类型：`文本`、`日期`、`数字`或`是或否`。如果你正在将属性链接到工作簿中的某个区域，则此选择不相关。\n\
  \n3.  **视情况输入属性数据：**\n    -   *文本、日期或数字值。* 在`值`文本框中输入该值。\n    -   *是或否。* 选择`是`选项按钮或`否`选项按钮。\n\
  \    -   *工作表中命名区域包含的信息。* 选中`链接到内容`复选框。Excel 会显示一个`源`弹出菜单，其中包含工作簿中的命名区域。从此列表中选择区域。\n\
  \n4.  **点击`添加`按钮。** Excel 会将属性和数据添加到`属性`列表框中。\n\n若要删除某个字段，请在`属性`列表框中将其选中，然后点击`删除`按钮。\n\
  \n##### 使用属性查找工作簿\n\n当你在工作簿中输入了属性后，你可以使用属性信息在使用“聚焦”搜索时更轻松地识别工作簿。当你有很多工作簿并且需要快速找到正确的那一个时，这非常有用。\n\
  \n若要使用“聚焦”中的属性信息进行搜索，请遵循以下步骤：\n\n1.  `Ctrl+单击`或右键点击程序坞上的`访达`图标，然后在上下文菜单中点击`新建访达窗口`，以打开一个新的访达窗口。如果你没有打开任何其他访达窗口，也可以直接点击程序坞上的`访达`图标来打开一个新窗口。\n\
  \n2.  导航至你想开始搜索的文件夹。例如，如果你将所有工作簿都存放在同一个文件夹中，则选择该文件夹，而不是搜索整个 Mac 及其连接的驱动器。\n\n3.\
  \  选择`文件` > `查找`或按`Cmd+F`切换到搜索模式。\n\n4.  在窗口顶部的搜索栏中，点击你在步骤 2 中选择的文件夹。\n\n5.  点击搜索栏右端的`+`按钮，显示一行用于设置搜索的控件。图\
  \ 3–7 显示了一个带有搜索条件的搜索窗口……\n\n\n\n进行中。\n\n**图 3–7.** *将属性信息添加到工作簿后，您可以使用其属性来定位工作簿。*\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-99_1.png)\n\n\
  **94**\n\n**第 3 章：创建高效的工作簿和模板**\n\n6. 在搜索控件所在行，打开`任意`弹出菜单，然后点击`其他`。\n\n7. 在弹出菜单中选择`其他`后，在\
  \ Finder 显示的文本框中输入`Microsoft Excel 工作簿`。\n\n8. 点击第一行搜索控件末尾的`+`按钮，以显示另一行。\n\n9. 打开左侧弹出菜单，然后点击`其他`以显示`选择搜索属性`对话框（参见图\
  \ 3–8）。\n\n**图 3–8.** *在`选择搜索属性`对话框中，点击您要搜索的属性。如果您希望该属性在搜索中更易于使用，请选中`在菜单中`复选框。*\n\
  \n10. 点击您要用于搜索的属性（即，特性）。\n\n使用`标题`、`主题`、`作者`、`关键词`或`备注`属性通常是查找已设置属性的 Excel 工作簿的最佳方式。\n\
  \n**提示：** 如果您需要频繁地按某个特定属性进行搜索，请在该属性所在行选中`在菜单中`复选框，以便 Mac OS X 将该属性包含在弹出菜单中。这样，您就无需打开`选择搜索属性`对话框来访问该属性了。\n\
  \n11. 点击`确定`按钮关闭`选择搜索属性`对话框。您选择的属性将出现在弹出菜单中。\n\n12. 使用该行上的其余控件来指定比较条件。例如，使用`标题 包含\
  \ budget`来搜索其`标题`属性包含单词`budget`的工作簿。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**第 3 章：创建高效的工作簿和模板**\n\n**95**\n\n13. 添加所需的任何其他搜索条件。例如，您可能只想查找过去两周内修改过的工作簿，或者其`作者`属性包含您上司名字的工作簿。\n\
  \n每完成一个条件，Finder 窗口就会显示匹配工作簿的列表。一旦找到您想要的工作簿，您可以通过双击将其打开。或者，如果您需要在不打开的情况下快速查看其内容，请按`空格键`或点击工具栏上的`快速查看`按钮。\n\
  \n**提示：** 当您创建了这样的搜索后，可以点击搜索窗口右上角的`存储`按钮，将其保存为智能文件夹。*智能文件夹*是 Mac OS X 对已保存搜索的称呼。在打开的`存储为`对话框中，为智能文件夹键入名称，并选择存储该文件夹的位置；除非有更好的位置，否则默认的`已存储的搜索`文件夹就很合适。如果您希望将智能文件夹添加到边栏中的`搜索范围`列表中以便随时访问，请选中`添加到边栏`复选框。\n\
  \n**保存工作簿以供旧版 Excel 使用**\n\n多年来，微软为 Excel 添加了许多功能，并多次更改了其文件格式。因此，出现了两个问题：\n\n- 旧版\
  \ Excel 可能无法打开您在 Excel 2011 中创建的工作簿。如果旧版能够打开该工作簿，也可能无法正确显示。\n- 旧版 Excel 无法支持后续版本中添加的功能。例如，微软在\
  \ Excel 2011 中添加了迷你图（单元格内图表）；早期版本（如 Excel 2008 和 Excel 2004）则没有迷你图。\n\n与旧版 Excel\
  \ 共享工作簿的首要条件是选择合适的文件格式：\n\n- **Excel 工作簿格式。** 使用此格式与 Excel 2011、Mac 版 Excel 2008、Windows\
  \ 版 Excel 2010 或 Windows 版 Excel 2007 共享。只要计算机安装了能够读取此文件格式（微软在 Excel 2007 中引入）的筛选器，也可以与\
  \ Mac 版 Excel 2004 或 Windows 版 Excel 2003 共享。此格式使用`.xlsx`文件扩展名。\n\n\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n## 第 3 章：创建高效的工作簿和模板\n\n**注意：** 你可以从 Microsoft 网站（[www.microsoft.com/downloads/](http://www.microsoft.com/downloads/)）免费下载这些筛选器。对于\
  \ Windows，请查找 `Microsoft Office Compatibility Pack for Word, Excel, and PowerPoint\
  \ File Formats` 的下载。对于 Mac，请查找 `Open XML File Format Converter for Mac` 的下载。\n\n\
  - `Excel 97–2004 Workbook 格式`。此格式用于与 `Excel 2004 for Mac`、`Excel 2003 for Windows`\
  \ 或更旧版本的 `Excel` 共享。此格式使用 `.xls` 文件扩展名，也适用于与其他电子表格应用程序共享。\n\n要将工作簿文件保存为与当前格式不同的格式，请按以下步骤操作：\n\
  \n1. 从菜单栏中选择 `File > Save As`，或按下 `Cmd+Option+S` 以显示 `Save As` 对话框。\n2. 在 `Format`\
  \ 弹出菜单中，选择你希望使用的格式。\n3. （可选）在 `Save As` 文本框中更改文件名，或选择不同的文件夹。由于 `Excel Workbook`\
  \ 格式和 `Excel 97–2004 Workbook` 格式使用不同的文件扩展名，你通常无需更改名称——但拥有两个名称几乎相同的工作簿可能会造成混淆。\n\
  4. 点击 `Save` 按钮。`Excel` 会关闭 `Save As` 对话框并保存工作簿。\n\n第二个要点是确保保存的文件尽可能与早期版本的 `Excel`\
  \ 兼容。为了帮助你识别潜在问题并（如果需要的话）排除它们，`Excel` 的工具箱中包含了 `Compatibility Report` 面板。你可以这样使用它：\n\
  \n1. 打开工作簿（如果尚未打开）。\n2. 选择 `View > Compatibility Report`，打开工具箱，并将 `Compatibility\
  \ Report` 面板置于前端。\n3. 打开 `Check compatibility with` 弹出菜单，然后点击你希望确保工作簿兼容的应用程序版本。`Results`\
  \ 框中会显示一系列可能存在的问题（参见图 3–9）。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-102_1.png)\n\n**图 3–9.** *在 `Compatibility Report` 面板中，选择用于检查工作簿兼容性的\
  \ `Excel` 版本。然后你可以选择修复哪些问题以及忽略哪些问题。*\n\n4. 要查看某个问题的详细信息，请在 `Results` 框中点击它。`Explanation`\
  \ 框会显示该问题的描述。\n5. 要修复某个问题，请在 `Results` 框中点击它。如果 `Fix` 按钮可用，请点击它来修复此问题的当前实例。要修复所有实例，请点击\
  \ `Fix` 下拉按钮，然后点击菜单中的 `Fix All`。\n6. 要忽略某个问题，请在 `Results` 框中点击它，然后点击 `Ignore` 按钮。要忽略所有实例，请点击\
  \ `Ignore` 下拉按钮，然后点击菜单中的 `Ignore All`。要指示应用程序不再用此问题打扰你，请点击 `Ignore` 下拉按钮，然后点击菜单中的\
  \ `Don’t Show Again`。\n\n#### 组织工作簿中的工作表\n\n当你创建一个空白工作簿时，`Excel` 会为其分配在 `General`\
  \ 偏好设置面板的 `Sheets in new workbook` 框中设置的工作表数量——默认情况下，是一个单独的工作表。如果你需要更多工作表，可以轻松插入它们。并且你可以删除任何不再需要的工作表。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n`Excel` 最初会为每个工作表指定一个默认名称——`Sheet1`、`Sheet2`，以此类推。通常，你会希望给工作表起一些描述性名称，以便轻松识别它们。你可能还需要以不同的顺序重新排列工作表。\n\
  \n##### 插入新工作表\n\n要插入一个新工作表，请执行以下任一操作：\n\n- *在最后一个现有工作表之后插入一个新工作表。* 点击最后一个工作表标签后出现在标签栏上的\
  \ `Insert Sheet` 按钮。\n\n\n"
- "# 插入、命名和管理工作表\n\n##### 插入新工作表\n\n`Ctrl+单击`或右键单击现有工作表，然后在上下文菜单中单击`插入工作表`。\n\n**提示：**\
  \ Excel 在活动工作表后插入新工作表的默认键盘快捷键是 `Shift+F11`。只有当 Mac OS X 未将 `F11` 用于其他目的（例如 Exposé\
  \ 中的“显示桌面”功能）时，此快捷键才有效。如果 Mac OS X 已在使用 `F11`，则需要使用第 2 章“创建自定义键盘快捷键”一节中介绍的方法，将`插入工作表`命令映射到其他快捷键。或者，你也可以更改使用\
  \ `F11` 的 Mac OS X 功能。\n\n##### 命名工作表\n\n为了让工作表更易于识别，请为其指定一个描述性名称。双击工作表的标签以选中默认名称，输入所需名称，然后按`Return`键应用该名称。名称最多可使用\
  \ 31 个字符——足以容纳几个单词。\n\n##### 更改工作表的标签颜色\n\n如果你想让工作表的标签更醒目，可以`Ctrl+单击`或右键单击该标签，单击`标签颜色`以显示`标签颜色`窗口，然后单击标签的颜色。单击`关闭`按钮（标题栏左端的按钮）关闭`标签颜色`窗口。\n\
  \n**注意：** 如果复制工作表，副本将获得与原工作表相同的标签颜色——因此你可能需要更改颜色以使副本更容易区分。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-104_1.png)\n\n**第 3 章：创建有效的工作簿和模板**  \n**99**\n\n##### 删除工作表\n\n\
  要删除工作表，请`Ctrl+单击`或右键单击其标签，然后在上下文菜单中单击`删除`。Excel 将显示一个对话框（见图 3-10）以再次确认你已准备好将其删除；单击`删除`按钮继续。\n\
  \n**图 3-10.** *单击“确定”按钮以确认要删除该工作表。*\n\n##### 重新排列工作簿中的工作表\n\n要使工作簿中的工作表按你需要的顺序排列，你可以重新排列它们。移动工作表的快捷方式是单击其标签，将其向左或向右拖动，直到\
  \ Excel 在你想要放置的位置的工作表之间显示一个向下箭头，然后释放鼠标。\n\n**提示：** 要移动两个或多个工作表，请先选择它们。要选择相邻显示的一系列工作表，请单击第一个工作表的标签，然后`Shift+单击`该系列另一端的工作表标签。要选择不相邻的工作表，请单击第一个工作表的标签，然后依次`Cmd+单击`其他每个工作表的标签。\n\
  \n拖动工作表标签对于短距离移动很方便，但当需要将工作表移动更远距离时，请改用`移动或复制`对话框。你还可以使用`移动或复制`对话框将工作表移动或复制到不同的工作簿。请按照以下步骤操作：\n\
  \n**1.** 如果要将工作表移动或复制到其他工作簿，请打开该工作簿。\n\n**2.** 在源工作簿中，`Ctrl+单击`或右键单击工作表标签以显示上下文菜单。要移动多个工作表，请先选中它们，然后`Ctrl+单击`或右键单击其中一个选中的标签。\n\
  \n**3.** 在上下文菜单中，单击`移动或复制`项目以显示`移动或复制`对话框（见图 3-11）。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-105_1.png)\n\n**100**  \n**第 3 章：创建有效的工作簿和模板**\n\n**图 3-11.** *使用“移动或复制”对话框，将单个或多个工作表移动到在单个工作簿内拖动不便的更远位置，或者将工作表移动或复制到另一个打开的工作簿。*\n\
  \n**4.** 在`工作簿`弹出菜单中，确保选中当前工作簿，除非你要将工作表移动到另一个工作簿——这种情况下，请选择该工作簿。\n\n**5.** 在`工作表之前`列表框中，单击你想要放置所移动工作表之前的那张工作表。如果想将工作表放在工作簿的末尾，请选择`(移至最后)`项。\n\
  \n**6.** 如果要复制工作表到目标位置而非移动，请选中`建立副本`复选框。当目标位置是另一个工作簿时，复制最为有用，但你也可以在同一工作簿内复制。\n\n\
  **7.** 单击`确定`按钮关闭对话框。Excel 会将工作表移动或复制到你选择的目标位置。\n\n#### 工作表布局的四条简单规则\n\nExcel 为你布局工作表提供了极大的灵活性。每个工作表包含超过\
  \ 160 亿个单元格，并且你可以在一个工作簿中放置几乎任意数量的工作表。\n\n**注意：** 如果你在一个工作簿中塞入大量工作表并为其填充全部数据，你可能会发现\
  \ Excel 拖慢了你的 Mac。如果出现这种情况，请将一些工作表移到另一个工作簿以提高性能。\n\n以下是布局工作表时应遵循的四条规则，以使它们尽可能易于使用。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 3 章：创建有效的工作簿和模板**  \n\
  **101**\n\n**将不同主题放在不同工作表上。** 鉴于 Excel 的工作表可以包含大量信息，你可能倾向于将所有数据放在一个工作表中。但通常最好是将数据拆分，将不同的主题放在不同的工作表中。\n\
  \n**提示：** 为工作表标签赋予描述性标签，以便轻松选择所需的工作表。如果工作簿中的工作表太多，导致使用工作表标签导航不便，可以在前面创建一个摘要工作表，其中包含其他工作表及其内容的列表——以及可直接单击跳转到每个工作表的超链接。\n\
  \n**按列划分数据。** 布局数据时，应确保任何给定列中的单元格包含相同类型的数据。这样做可以让你按行对区域进行排序和筛选。\n\n**将重要数据放在区域上方而不是旁边。**\
  \ 当需要包含注释或其他解释性数据时，请将这些数据放在其相关区域的上方。不要将数据放在区域的左侧或右侧，因为如果你筛选区域仅显示某些值，Excel 可能会隐藏这些数据。\n\
  \n**将数据区域相互分隔开。** 如果在同一工作表中包含几种不同类型的数据，请将每种类型放在一个单独的区域中，并在各区域之间留出一个或多个空白列以及一个或多个空白行。这种额外的空间有助于\
  \ Excel 和你更容易地分别识别和选择各个区域。\n\n#### 同时在多个工作表上输入数据\n\n有时，同时在多个工作表上输入数据可以节省时间。例如，如果某个工作簿需要为每个月的销售额创建一个单独的工作表，你可能需要创建\
  \ 12 个结构相似的工作表。\n\n输入数据，请按以下步骤操作：\n\n**1.** 选择每个要接收数据的工作表的标签。例如，单击第一个标签，然后`Shift+单击`最后一个标签。选中的标签显示为白色而非灰色，如图\
  \ 3-12 所示。Excel 会在标题栏中工作簿名称后显示`[工作组]`作为提醒。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-107_1.png)\n\n**102**  \n**第 3 章：创建有效的工作簿和模板**\n\n**图 3-12.** *要同时在多个工作表上输入数据，请选择每个工作表的标签，以便\
  \ Excel 在标题栏中添加 [工作组]。然后，你可以像往常一样在显示的工作表中输入数据。*\n\n**2.** 现在，你可以在显示的工作表的单元格中输入数据。Excel\
  \ 会将相同的数据输入到其他每个选中的工作表中。\n\n**3.** 完成工作组操作后，单击一个未选中的标签以取消分组。\n\n#### 使用命名区域标识部分\n\
  \n在设置工作簿中的公式时，你通常需要引用\n\n\n\n"
- "# 排版后的文档\n\n特定单元格和区域。你可以始终使用地址引用单元格和区域，但这可能难以记忆——尤其是当你通过添加单元格、行或列来更改其位置时。\n\n为了使引用更易于输入和识别，你可以为任何单元格或区域指定一个名称。之后，你可以通过该名称引用该单元格或区域。Excel\
  \ 会跟踪每个名称的当前位置，因此即使你添加或删除单元格（或行或列），你也可以使用该名称，而无需担心其确切位置。\n\n你还可以使用已命名区域来轻松导航工作表：要转到已命名区域，请打开引用区域中的弹出菜单，然后点击该区域的名称。\n\
  \n##### 为单元格或区域指定名称\n\n你可以快速使用引用区域或更正式地使用“定义名称”对话框为单元格或区域指定名称。使用“定义名称”对话框的优势在于，你也可以从此处管理现有的区域名称。\n\
  \n以下是创建名称的规则：\n\n- 名称必须以字母或下划线开头。\n- 名称只能包含字母、数字和下划线。不能包含空格或符号。\n- 名称在工作簿中必须是唯一的。\n\
  \n##### 快速为单元格或区域指定名称\n\n要使用引用区域快速为单元格或区域指定名称，请执行以下步骤：\n\n1. 选择要命名的单元格或区域。\n2. 点击引用区域。Excel\
  \ 会选择其当前内容，即活动单元格的引用（例如，`B5`）。\n3. 键入单元格或区域的名称，然后按 `Return` 键应用它。\n\n**注意**：如果你在引用区域中键入现有名称，Excel\
  \ 会在你按 `Return` 键时选择该单元格或区域——就像你打开引用区域中的弹出菜单并点击了该名称一样。\n\n##### 使用“定义名称”对话框为单元格或区域指定名称\n\
  \n要使用“定义名称”对话框为单元格或区域指定名称，请执行以下步骤：\n\n1. 选择要命名的单元格或区域。\n2. 从菜单栏选择“插入” > “名称” > “定义”，以显示“定义名称”对话框（如图\
  \ 3–13 所示，已包含设置选择）。\n3. 在“名称”文本框中，键入你要分配给单元格或区域的名称，以便于引用。\n4. 确保“引用位置”框显示正确的单元格或区域。如果不是，请点击“折叠对话框”按钮，在工作表中选择正确的单元格或区域，然后再次点击“折叠对话框”按钮以恢复对话框。\n\
  5. 如果只想创建这一个名称，请点击“确定”按钮将名称应用于区域并关闭“定义名称”对话框。如果你想在关闭“定义名称”对话框之前创建更多名称，请点击“添加”按钮。\n\
  \n##### 自动创建区域名称\n\n如果你的工作表在某个区域的第一列或最后一列，或第一行或最后一行包含标题，你可以让 Excel 自动为你创建区域名称。此功能可以节省你的时间和精力。\n\
  \n当 Excel 创建已命名区域时，它会将你选择的区域分成大小相等的部分。例如，如果你使用图 3–14 所示的选择区域（`A1:F5`）的顶行创建已命名区域，Excel\
  \ 会为单元格 `B2:B5` 创建一个名为 `Stockton` 的区域，为单元格 `C2:C5` 创建一个名为 `Modesto` 的区域，依此类推。Excel\
  \ 会将标题中不允许出现在名称中的空格、标点、符号和其他字符替换为下划线——例如，标题 `City of Industry` 会生成名称 `City_of_Industry`。\n\
  \n\n**图 3–14.** *利用所选区域中的标题创建命名区域，会生成名称为 `Stockton`（对应区域 `B2:B5`）、`Modesto`（对应区域\
  \ `C2:C5`）以及 `City_of_Industry`（对应区域 `F2:F5`）的命名区域。*\n\n要自动创建名称，请按照以下步骤操作：\n\n**1.**\
  \ 在工作表中输入标题。\n\n**注意：** 为了创建名称，每个标题必须以字母开头，而不是数字。因此，如果你需要为包含（例如）年份的单元格创建名称，则需要在数字前添加一个或多个字母——例如使用\
  \ `Year 2011` 而不是单纯的 `2011`。\n\n**2.** 选择包含标题的区域。标题必须位于所选区域的顶行、底行、最左列或最右列。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-110_1.png)\n\n**第 3 章：创建高效的工作簿和模板**\n\n**105**\n\n**注意：** 选择用于创建标签的区域时，你必须选择多行（如果标题在行中）或多列（如果标题在列中）。\n\
  \n否则，Excel 会显示 `“所选区域无效”` 对话框。如果出现这种情况，请单击 `“确定”` 按钮并更改你的选择。\n\n**3.** 选择 `“插入”`\
  \ > `“名称”` > `“创建”` 以显示 `“创建名称”` 对话框（参见图 3–15）。\n\n**图 3–15.** *在 `“创建名称”` 对话框中，为你想要转换为区域名称的每个包含标题的行和列选中相应的复选框。*\n\
  \n**4.** 在 `“创建名称位于”` 框中，根据需要选中 `“顶行”` 复选框、`“最左列”` 复选框、`“底行”` 复选框和 `“最右列”` 复选框。\n\
  \n**5.** 单击 `“确定”` 按钮。Excel 会关闭 `“创建名称”` 对话框并创建名称。\n\nExcel 不会显示对话框或以其他方式确认它已创建名称。如果你想检查名称是否存在，请打开\
  \ `“引用”` 区域上的弹出菜单，你会看到它们按字母顺序排列。\n\n##### 在公式中使用区域名称\n\n命名区域后，你可以在公式中使用该名称，而不是单元格引用或区域引用。命名区域可以极大地节省时间，因为名称比单元格引用或区域引用更容易记忆和输入。\n\
  \n例如，如果你给某个单元格命名为 `Interest_Rate`，你可以像这样在公式中使用它：\n\n```\n=B1*Interest_Rate\n```\n\
  \n当你的区域名称像这样直截了当时，你可能只想直接输入它们。\n\n在其他时候，你可能会发现像这样粘贴名称会更方便：\n\n**1.** 将活动单元格移动到你想放置公式的位置。\n\
  \n**2.** 像往常一样开始输入公式。例如，输入 `=`。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-111_1.png)\n\n**106**\n\n**第 3 章：创建高效的工作簿和模板**\n\n**3.** 当你输入到公式中需要该名称的部分时，选择\
  \ `“插入”` > `“名称”` > `“粘贴”` 以显示 `“粘贴名称”` 对话框（参见图 3–16）。\n\n**图 3–16.** *使用 `“粘贴名称”`\
  \ 对话框将区域名称粘贴到公式中。你也可以粘贴所有区域名称及其位置的完整列表以供参考。*\n\n**4.** 在 `“粘贴名称”` 列表框中，单击你想要粘贴的区域名称。\n\
  \n**5.** 单击 `“确定”` 按钮。Excel 会关闭 `“粘贴名称”` 对话框并粘贴该名称。\n\n**提示：** 如果你想创建工作表中所有区域名称及其位置的列表，请将活动单元格定位到你想让列表开始的位置，选择\
  \ `“插入”` > `“名称”` > `“粘贴”` 以显示 `“粘贴名称”` 对话框，然后单击 `“粘贴列表”` 按钮。\n\n##### 删除区域名称\n\n\
  要删除区域名称，请按照以下步骤操作：\n\n**1.** 从菜单栏中选择 `“插入”` > `“名称”` > `“定义”` 以显示 `“定义名称”` 对话框。\n\
  \n**2.** 在 `“工作簿中的名称”` 列表框中单击区域名称。\n\n**3.** 单击 `“删除”` 按钮。\n\n**4.** 根据需要删除其他区域名称，然后单击\
  \ `“关闭”` 按钮关闭 `“定义名称”` 对话框。\n\n##### 更改名称引用的单元格或区域\n\n如果你需要更改名称引用的单元格或区域，请按照以下步骤操作：\n\
  \n**1.** 从菜单栏中选择 `“插入”` > `“名称”` > `“定义”` 以显示 `“定义名称”` 对话框。\n\n\n**2.** 单击`工作簿中的名称`列表框中的现有名称。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-112_1.png)\n\
  \n## 第 3 章：创建高效工作簿和模板\n\n**107**\n\n**3.** 在`引用位置`框中三击以选中当前引用。\n\n**4.** 在工作表中，单击单元格或选择新区域。（如果需要缩小`定义名称`对话框，可以先单击`折叠对话框`按钮，但通常直接操作更简便。）\n\
  \n**5.** 若要进行更改并关闭`定义名称`对话框，请单击`确定`按钮。若要进行更改但保持`定义名称`对话框打开，请单击`添加`按钮。\n\n#### 通过分级显示创建可折叠工作表\n\
  \n包含许多列或行数据的工作表，即使你按照第 1 章学到的方法冻结了屏幕上的标题，也难以导航。为了让导航更便捷，你可以使用 Excel 的分级显示功能创建一个可折叠的工作表，然后只展开任何特定时刻需要查看的部分。图\
  \ 3-17 显示了一个包含分级显示的工作表，其中某些行和列已展开，其他行和列已折叠。\n\n**图 3-17.** *利用 Excel 的分级显示功能，可以创建可折叠和展开的工作表，只显示所需部分。*\n\
  \n分级显示功能最适用于数据按结构或层次排列的工作表。你可以为行创建最多八个层级，为列创建最多八个层级，从而精细控制分级显示。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**108**\n\n## 第 3 章：创建高效工作簿和模板\n\n你可以让 Excel 根据在使用公式布局的工作表中检测到的结构自动创建分级显示。这通常是最好的起点。如果发现自动分级显示不符合需求，你也可以手动创建分级显示，将层级精确放在所需位置。\n\
  \n##### 让 Excel 自动创建分级显示\n\n要让 Excel 自动创建分级显示，必须将工作表的结构用公式设置好。Excel 会利用这些公式来确定分级显示的层次，因此如果没有公式，分级显示就无法工作。你无需输入所有行和列的数据——只需输入包含公式的行和列，以及公式所引用的足够的数据行和列即可。\n\
  \n图 3-18 左侧的屏幕显示了一个用公式构建结构的工作表开头部分，这些公式将生成分级显示。以下是你能看到的内容：\n\n- 最左侧的列（A 列）包含一个庞大而邪恶的组织（我们姑且隐去其名）的部门、州和城市办事处。你可以看到西部部门（包含加利福尼亚、俄勒冈、华盛顿、爱达荷、内华达、犹他和亚利桑那州）和中部部门（包括新墨西哥、蒙大拿、科罗拉多以及一些看不到的州）。\n\
  - 每个州仅包含几个办事处以构建正确的结构。结构就绪后，你可以添加额外所需的行。\n- 每个州的行都包含一个`SUM()`公式，用于汇总各城市办事处的结果。例如，加利福尼亚州的行在单元格`B3`中包含公式`=SUM(B4:B5)`，汇总了贝克尔斯菲尔德和奇科两地的丰富收益。\n\
  - 每个部门的行都包含一个`SUM()`公式，用于汇总该部门各州的结果。例如，西部部门的行在单元格`B2`中包含公式`=SUM(B3,B6,B9,B12,B15,B18,B22)`，汇总了加利福尼亚州、俄勒冈州等地的结果。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-114_1.png)\n\
  \n![](img/index-114_2.png)\n\n**109**\n\n## 第 3 章：创建高效工作簿和模板\n\n**图 3-18.** *通过设置包含公式层次结构的工作表（左图），你可以利用\
  \ Excel 的自动分级显示功能，基于这些公式创建分级显示（右图）。*\n\n当公式就位后，从功能区选择`数据`→`分组和分级显示`→`自动建立分级显示`，或从菜单栏选择`数据`→`分组和分级显示`→`自动建立分级显示`，即可自动创建分级显示。图\
  \ 3-18 右侧的屏幕显示了同一数据范围被转换为包含三个层级的分级显示。你可以单击左侧分级显示栏中的`–`号来折叠某个部分，并单击替换`–`号的`+`号再次展开该部分。\n\
  \n如果分级显示结果符合预期，你可以输入剩余公式和数据。在许多情况下，你可以使用`自动填充`功能（在第 1 章中讨论过）基于现有公式自动插入行或列中的公式。\n\
  \n如果自动分级显示不适合你，请尝试更改自动分级显示的设置，如下所述。或者，通过从功能区选择`数据`→`分组和分级显示`→`取消组合`→`清除分级显示`，或从菜单栏选择`数据`→`分组和分级显示`→`清除分级显示`来清除分级显示。然后，你可以手动创建分级显示，详见下一节。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-115_1.png)\n\
  \n**110**\n\n## 第 3 章：创建高效工作簿和模板\n\n##### 更改分级显示设置\n\n要更改 Excel 用于分级显示的设置，请按以下步骤操作：\n\
  \n**1.** 选择数据范围：\n\n- 要更改现有分级显示，请单击分级显示中的任意单元格。\n- 要创建新分级显示，请选择数据范围。\n\n**2.** 从菜单栏选择`数据`→`分组和分级显示`→`设置`，以显示`设置`对话框（见图\
  \ 3-19）。\n\n**图 3-19.** *使用“设置”对话框控制 Excel 从工作表中创建自动分级显示的方式。*\n\n**3.** 在`方向`框中，如果汇总行位于明细行下方，请选中`明细数据的下方`复选框。如果工作表使用了位于被汇总列右侧的汇总列，请选中`明细数据的右侧`复选框。\n\
  \n**4.** 如果希望 Excel 自动将样式应用于分级显示以区分不同层级，请选中`自动设置样式`复选框。Excel 会将`RowLevel_1`样式应用于第一级行，`RowLevel_2`样式应用于第二级行，依此类推。对于列，Excel\
  \ 使用名为`ColLevel_1`、`ColLevel_2`等的样式。\n\n**5.** 单击命令按钮关闭`设置`对话框并执行所需操作：\n\n- *创建。*\
  \ 单击此按钮创建新的分级显示。\n- *应用样式。* 单击此按钮将样式应用于现有分级显示。你需要先选中`自动设置样式`复选框。\n- *确定。* 单击此按钮将你所选的`方向`设置应用于现有分级显示。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-116_1.png)\n\
  \n![](img/index-116_2.png)\n\n**111**\n\n## 第 3 章：创建高效工作簿和模板\n\n##### 手动创建分级显示\n\
  \n很多时候，将工作表结构完整构建好以便 Excel 自动进行分级显示并不方便。在这些情况下，可以使用`组合`命令手动创建分级显示。你也可以使用`组合`命令（及其对应的`取消组合`命令）来调整\
  \ Excel 已为你创建的分级显示。\n\n###### 对行或列进行分组\n\n要对行或列进行分组，请按以下步骤操作：\n\n**1.** 选择要分组的行或列中的单元格。例如：\n\
  \n- 要将第 4 行和第 5 行分组到第 3 行下，请选择第 4 行和第 5 行中的单元格。\n- 要将 B 列、C 列和 D 列分组到 E 列下，请选择 B\
  \ 列、C 列和 D 列中的单元格。\n\n**提示：** 你可以通过选择整行或整列（而非仅其中的单元格）来加速对行或列进行分组或取消分组的过程。这样做时，Excel\
  \ 不会显示`组合`对话框或`取消组合`对话框，因为它能根据选择判断你希望对行还是列进行分组或取消分组。\n\n\n\n2. 从功能区选择**数据组与大纲组**（点击组按钮的主体部分，而非弹出按钮），或从菜单栏选择**数据组与大纲组**，以显示**分组**对话框（如图\
  \ 3–20 左图所示）。\n\n**图 3–20.** *在分组对话框（左图）或取消分组对话框（右图）中，根据需要选中`行`选项按钮或`列`选项按钮。*\n\n\
  3. 如果要按行分组，请选中`行`选项按钮。如果要按列分组，请选中`列`选项按钮。\n\n4. 单击`确定`按钮关闭**分组**对话框。`Excel`会应用分组。\n\
  \n根据需要重复此过程以创建更多组。例如，在我之前展示的工作表中，你首先应将城市分组到其所属的州下，然后将州分组到其所属的区域下。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-117_1.png)\n\n**112**\n\n**第 3 章：创建高效的工作簿和模板**\n\n##### 取消行或列的分组\n\
  \n要取消行或列的分组，请按以下步骤操作：\n\n1. 选中要取消分组的范围。\n\n2. 从功能区选择**数据组与大纲组 取消分组**（点击取消分组按钮的主体部分，而非弹出按钮），或从菜单栏选择**数据组与大纲组\
  \ 取消分组**，以显示**取消分组**对话框（如图 3–20 右图所示）。\n\n3. 根据需要选中`行`选项按钮或`列`选项按钮。\n\n4. 单击`确定`按钮关闭**取消分组**对话框并移除分组。\n\
  \n##### 展开和折叠大纲\n\n创建大纲后，你可以展开或折叠它，以便仅显示所需内容。\n\n点击要查看的列级别的**列级别**按钮。例如，点击**列级别\
  \ 2**按钮以显示所有第二级列。\n\n点击要查看的行级别的**行级别**按钮。例如，点击**行级别 3**按钮以显示所有第三级行。\n\n点击`+`按钮展开已折叠的行或列部分，或点击`–`按钮折叠已展开的部分。\n\
  \n##### 添加或删除行或列后更新大纲\n\n在工作表大纲区域内添加或删除行或列后，你需要更新大纲。请按以下步骤操作：\n\n1. 将活动单元格放置在大纲区域内的任意位置。\n\
  \n2. 从功能区选择**数据组与大纲组 组 自动建立分级显示**，或从菜单栏选择**数据组与大纲组 自动建立分级显示**。`Excel`会显示如图 3–21\
  \ 所示的无标题对话框。\n\n**图 3–21.** *单击此对话框中的`确定`按钮，以使用你所添加或删除的行或列的详细信息来更新大纲。*\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**第 3 章：创建高效的工作簿和模板**\n\n**113**\n\n3. 单击`确定`按钮。`Excel`会更新大纲。\n\n##### 移除大纲\n\n\
  要从工作表中移除大纲，请选择**数据组与大纲组 取消分组 清除分级显示**。\n\n#### 充分利用模板\n\n如你所知，你在`Excel`中创建的每个工作簿都基于一个模板。如果你创建一个空白工作簿，`Excel`会使用一个骨架工作簿模板，该模板给予你完全的自由度，但不会为你节省任何时间。相比之下，如果你使用一个附带完整内容和格式的模板，你可能只需填写少量信息即可生成一个完整的工作簿。\n\
  \n正如你在本章前面所见，`Excel`带有多种多样的模板，并且你可以通过打开**Excel 工作簿库**对话框中的**在线模板**类别，在网络上访问更多模板。但要最大程度地节省时间，你几乎肯定需要创建自己的模板，无论是从零开始创建，还是通过自定义现有模板。\n\
  \n为充分利用模板，请遵循以下建议：\n\n**仔细评估你的需求。** 检查你和同事最常创建的工作簿——销售分析、项目规划、预算、发票、考勤表或其他任何类型。弄清楚哪些是\n\
  \n\n\n在这些工作簿中，您和同事可以使用模板更快速、更轻松地创建。\n\n**将模板基于现有工作簿或模板。** 如果您有现有工作簿，其中包含模板所需的大部分（甚至部分）信息，请打开该工作簿的副本，然后将其另存为模板。（您将在本节后面学习这两个操作。）通过从其他现有工作簿或模板中复制并粘贴项目到新模板中，您可以节省更多时间和精力。\n\
  \n**使模板尽可能完整。** 需求会有所不同，但通常需要执行以下操作：\n- 插入基于模板的大多数工作簿所需的工作表数量。\n- 为工作表命名。如果这有助于快速识别关键选项卡，则对工作表选项卡进行着色。\n\
  - 使用标准文本和公式设置每个工作表。\n- 使用验证格式化单元格，以确保用户输入合适的值。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**114**\n\n**第 3 章：创建高效的工作簿和模板**\n\n- 应用条件格式使极值突出显示。\n- 向单元格添加批注，说明哪些信息是必需的，哪些是可选的。\n\
  \n**使用宏自动执行模板。** 为了帮助用户快速准确地输入和操作数据，您可能需要向模板添加宏。有关创建和使用宏的信息，请参见第 14 章。\n\n**基于现有工作簿创建模板**\n\
  \n要根据现有工作簿创建模板，请执行以下步骤：\n\n1.  如果 Excel 尚未运行，请打开它。\n2.  单击标准工具栏上的“打开”按钮（或按 `Cmd+O`）以显示“打开：Microsoft\
  \ Excel”对话框。\n3.  导航到包含现有工作簿的文件夹，然后单击该工作簿。\n4.  单击“打开”弹出菜单，然后选择“副本”，而不是默认选择“原始”。\n\
  \n**注意：** 打开现有工作簿的副本有助于避免在忘记使用“另存为”命令以不同名称保存时意外覆盖它。使用“另存为”命令几乎不能再简单了——但在执行该命令之前，您也很容易分心。\n\
  \n5.  单击“打开”按钮以打开该工作簿的副本。\n    您现在可以按照下一节所述保存模板。\n\n**保存模板**\n\n要保存模板，请照常使用“保存”命令，但您需要选择最适合您需求的模板格式，并选择正确的文件夹来保存模板。\n\
  \n要将活动工作簿另存为模板，请执行以下步骤：\n\n1.  选择“文件”>“保存”或按 `Cmd+S` 以显示“另存为”对话框。\n2.  打开“格式”弹出菜单，然后选择“Excel\
  \ 模板 (.xltx)”。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 3 章：创建高效的工作簿和模板**\n\
  \n**115**\n\n**注意：** 如果需要在模板中存储宏，请选择“Excel 启用宏的模板 (.xltm)”。如果使用 Excel 2004（Mac）或\
  \ Excel 2003（Windows）及更早版本的同事需要使用该模板，请在“格式”弹出菜单中选择“Excel 97–2004 (.xlt)”；此模板格式在必要时可以包含宏。\n\
  \n3.  选择存储模板的文件夹：\n    -   当您在“格式”弹出菜单中选择一种模板格式时，Excel 会自动将文件夹更改为您的“我的模板”文件夹。\n\
  \    -   如果您打算与同事共享模板，您可能希望将其存储在网络上的文件夹中。\n4.  单击“保存”按钮。\n\n**注意：** 要基于存储在 Excel\
  \ 检查的模板文件夹之外的其他文件夹中的模板创建工作簿，请显示“打开”对话框并导航到该文件夹。单击该模板，在“打开”弹出菜单中选择“副本”，然后单击“打开”按钮。然后您可以使用“保存”命令保存新的工作簿。\n\
  \n**总结**\n\n在本章中，您学习了如何创建可以流畅高效地工作的工作簿和模板。您现在知道如何基于模板创建工作簿，如何选择保存它们的最佳文件格式，以及如何添加属性信息以使工作簿更易于识别。您还可以创建自己的模板——如有需要，可基于现有工作簿或模板创建。\n\
  \n我们还研究了如何组织工作簿中的工作表，如何逻辑地布局数据，以及如何同时在多个工作表上快速输入数据。您了解了如何通过创建命名范围来快速识别工作表的各个部分，以及如何通过创建大纲使大型工作表易于管理。\n\
  \n在下一章中，我将向您展示如何快速有效地格式化工作簿。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**117**\n\n**第 4 章**\n\n**快速高效地格式化**\n\n**工作表**\n\n要使工作表显示所需信息并以易于理解的方式呈现，您需要对其进行格式化。本章介绍如何使用\
  \ Excel 提供的各种工具快速有效地格式化工作表。\n\n首先必须格式化工作表的行和列。您可能需要插入或删除行、列或单元格块；经常需要隐藏某些行或列以将其移开或使其免受窥视；并且几乎肯定需要更改某些列宽和行高。我们将首先介绍这些内容。\n\
  \n之后，我将向您展示如何格式化单元格和区域，如何应用条件格式以快速标记需要关注的值，以及如何使用数据验证来检查无效条目。\n\n在本章末尾，我们将了解如何使用表格格式或\
  \ Excel 样式快速格式化工作表，以及如何向工作表添加页眉和页脚，以便轻松识别它们及其内容。\n\n**处理行和列**\n\n在本节中，您将学习如何插入和删除行、列和单元格；更改列宽和行高；以及在不需要查看行或列时隐藏它们。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**118**\n\n**第 4 章：快速高效地格式化工作表**\n\
  \n**插入和删除行、列和单元格**\n\n在布置工作表时，您通常需要插入或删除整个列或行。有时您可能还需要删除一个单元格块，而无需删除整个列或行。\n\n**插入列和行**\n\
  \n插入列或行最简单的方法是按住 `Ctrl` 键单击或右键单击要在其前插入新列的现有列或行的标题，然后在上下文菜单中单击“插入”。\n\n要插入多列或多行，请先选择相同数量的列或行。例如，要在\
  \ F 列之前插入三列，请拖动以选择 F、G 和 H 列的标题；然后按住 `Ctrl` 键单击或右键单击所选标题中的任意位置，并在上下文菜单中单击“插入”。\n\
  \n您也可以通过选择要在其前添加新列的列中的单元格，然后执行以下任一命令来插入列：\n- **功能区：** 选择“开始”>“单元格”>“插入”>“插入工作表列”。\n\
  - **菜单栏：** 选择“插入”>“列”。\n\n**注意：** 如果 Excel 窗口宽度不足以使“插入”按钮、“删除”按钮和“格式”按钮出现在“单元格”组中，则会显示一个“操作”弹出按钮。单击此按钮可显示一个弹出菜单，其中包含“插入”子菜单、“删除”子菜单和“格式”子菜单。单击相应的菜单，然后从中做出选择。\n\
  \n类似地，您可以通过选择要在其前添加新行的行中的单元格，然后执行以下任一命令来插入行：\n- **功能区：** 选择“开始”>“单元格”>“插入”>“插入工作表行”。\n\
  - **菜单栏：** 选择“插入”>“行”。\n\n如前所述，如果要插入多列或多行，请先选择相应数量的列或行中的单元格。\n\n\n\n**注意：** 功能区\
  \ `开始` 选项卡上 `单元格` 组中 `插入` 按钮的具体插入内容取决于您所选定的对象。选择一列或多列可使 `插入` 按钮插入列；选择一行或多行可使 `插入`\
  \ 按钮插入行；或者选择一个或多个单元格可使 `插入` 按钮插入单元格。如果您尚未选择合适的项目，请单击 `插入` 弹出按钮（而非主 `插入` 按钮），然后从弹出菜单中选择所需项目。\n\
  \n### 第 4 章：快速高效地设置工作表格式\n\n### 插入部分单元格\n\n若要仅插入部分单元格，请遵循以下步骤：\n\n1. 选择要在其之前插入单元格的区域。\n\
  2. 选择 `开始` > `单元格` > `插入` > `插入单元格` 以显示 `插入` 对话框（见图 4–1）。\n\n**图 4–1.** *插入单元格块时，点击\
  \ `插入` 对话框中的 `活动单元格右移` 或 `活动单元格下移` 选项按钮，告知 Excel 现有单元格的移动方向。*\n\n3. 选择 `活动单元格右移`\
  \ 选项按钮将现有单元格向右移动。选择 `活动单元格下移` 选项按钮将现有单元格在工作表中向下移动。您也可以选择 `整行` 选项按钮来插入整行，或选择 `整列`\
  \ 选项按钮来插入整列，但通常使用前述方法插入行或列更为简便。\n4. 点击 `确定` 按钮关闭 `插入` 对话框。Excel 将插入单元格。\n\n### 删除列或行\n\
  \n删除列或行最简单的方法是按住 `Ctrl` 键单击或右键单击其列标或行号，然后在上下文菜单中点击 `删除`。或者，您也可以选中行或列，然后从菜单栏中选择 `编辑`\
  \ > `删除`，或从功能区选择 `开始` > `单元格` > `删除`（点击 `删除` 按钮的主体部分）。\n\n您无需选中整列或整行，只需点击其中的一个单元格，选择\
  \ `开始` > `单元格` > `删除`（点击 `删除` 弹出按钮），然后根据需求点击 `删除列` 或 `删除行`。通常，先选中行或列会更方便。\n\n#####\
  \ 删除部分单元格\n\n若要仅删除部分单元格，请选中它们，然后选择 `开始` > `单元格` > `删除` > `删除单元格`。在 Excel 显示的 `删除`\
  \ 对话框（见图 4–2）中，根据需要选择 `活动单元格左移` 或 `活动单元格上移` 选项按钮，然后点击 `确定` 按钮。\n\n**图 4–2.** *删除单元格块时，点击\
  \ `删除` 对话框中的 `活动单元格左移` 或 `活动单元格上移` 选项按钮，告知 Excel 如何填补工作表中的空缺。*\n\n**注意：** 在 `删除`\
  \ 对话框中，您可以选择 `整行` 选项按钮以删除所选单元格所在的行，或选择 `整列` 选项按钮以删除所在的列。当您意识到需要删除整行或整列，而不仅仅是单元格块时，此功能非常有用。否则，您无需打开\
  \ `删除` 对话框即可删除行或列。\n\n##### 设置行高\n\nExcel 通常会根据行中最高的字符或对象自动设置行高。例如，如果您在单元格中输入内容，选中该单元格，然后在\
  \ `开始` 选项卡的 `字体` 组中多次点击 `增大字号` 按钮，Excel 会自动增加行高，以便为最高的字符留出足够空间。\n\n如果 Excel 未能自动设置行高，请选择\
  \ `开始` > `单元格` > `格式` > `自动调整行高` 以强制执行自动匹配。\n\n对于许多工作表来说，自动行高效果不错，但有时您可能需要手动设置行高。请使用以下任一方法：\n\
  \n- *拖动行号的下边框。* 将鼠标指针移至行号的下边框，待指针变为上下双向箭头后，点击并拖动边框。\n\n\n\n- `up`（使行变浅）或 `down`（使行变深）。\n\
  \n- **使用“行高”对话框。** `Ctrl+click` 或右键单击行标题，然后在上下文菜单中单击“行高”，以显示“行高”对话框（见图 4-3）。键入所需的行高，然后单击“确定”按钮。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-125_1.png)\n\
  \n## 第 4 章：快速高效地格式化工作表\n\n**121**\n\n**图 4-3.** *当需要精确设置行高时，请使用“行高”对话框。*\n\n**注意：**\
  \ 你也可以通过从功能区选择“开始” → “单元格” → “格式” → “行高”，或从菜单栏选择“格式” → “行” → “行高”，来显示“行高”对话框。\n\n\
  ##### 设置列宽\n\n与行高不同，当你向工作表中输入数据时，Excel 不会自动调整列宽。这是因为许多工作表需要单元格中有较长的条目，因此自动调整会妨碍工作。\n\
  \n你可以通过以下任一方式快速设置列宽：\n\n- **自动调整列宽。** 双击列标题的右边框。Excel 会自动更改列的宽度，使其足以容纳该列中最宽的条目。\n\
  \n- **自动调整多列宽度。** 选择所有你要调整的列中的单元格，然后双击任意一个选定列标题的右边框。Excel 会自动调整每列的宽度以适合其内容。你也可以选择这些单元格，然后从功能区选择“开始”\
  \ → “单元格” → “格式” → “自动调整列宽”，或从菜单栏选择“格式” → “列” → “自动调整列宽”。\n\n**提示：** 自动调整列宽通常是调整工作表列宽的最佳方法。但如果某些单元格的内容过长，导致自动调整会产生巨大的列宽，请手动设置列宽并隐藏最长内容的部分。你也可以在单元格内自动换行，使其占用所需的多行；稍后将在本章的“设置对齐方式”部分学习如何操作。\n\
  \n- **手动调整列宽。** 将列标题的右边框拖到所需宽度。\n\n- **精确调整列宽。** `Ctrl+click` 或右键单击列标题，然后在上下文菜单中单击“列宽”，以显示“列宽”对话框（见图\
  \ 4-4）。键入单元格宽度，然后单击“确定”按钮。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-126_1.png)\n\n**122**\n\n## 第 4 章：快速高效地格式化工作表\n\n**图 4-4.** *当需要精确设置列宽时，请使用“列宽”对话框。*\n\
  \n- **将多个列精确调整为相同宽度。** 通过拖动列标题或选择每列中的单元格来选中这些列。`Ctrl+click` 或右键单击选定的列标题，然后在上下文菜单中单击“列宽”，以显示“列宽”对话框。键入列宽，然后单击“确定”按钮。\n\
  \n##### 隐藏行和列\n\n有时，隐藏特定的列和行，使其在工作表中不可见，会很有帮助。你可能想这样做，以防止敏感数据显示出来，或者只是为了让你实际使用的部分工作表能一次性完整显示在屏幕上。\n\
  \n要隐藏某列或某行，请 `Ctrl+click` 或右键单击其列标题或行标题，然后在上下文菜单中单击“隐藏”。你也可以单击行或列中的一个单元格，然后从功能区选择“开始”\
  \ → “单元格” → “格式” → “隐藏行”或“隐藏列”，或从菜单栏选择“格式” → “行” → “隐藏”或“格式” → “列” → “隐藏”。\n\n**提示：**\
  \ 要快速隐藏活动行或选定的行，请按 `Ctrl+9`。要隐藏活动列或选定的列，请按 `Ctrl+0`。\n\n要取消隐藏某行或某列，请选中其上下方的行或左右两侧的列。然后\
  \ `Ctrl+click` 或右键单击选定的行标题或列标题，并在上下文菜单中单击“取消隐藏”。\n\n**注意：** 你也可以通过从功能区选择“开始” → “单元格”\
  \ → “格式” → “取消隐藏行”或“取消隐藏列”，或从菜单栏选择“格式” → “行” → “取消隐藏”或“格式” → “列” → “取消隐藏”，来隐藏和取消隐藏项目。\n\
  \n#### 格式化单元格和区域\n\n在 Excel 中，你可以以多种方式格式化单元格——从选择如何显示边框和背景，到控制 Excel 如何表示你在单元格中输入的文本。本节将向你展示最实用的格式化类型及其应用方法。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-127_1.png)\n\
  \n## 第 4 章：快速高效地格式化工作表\n\n**123**\n\n每个单元格都应用了基本格式——使用的字体和字号，以及通常的“常规”数字格式（稍后会介绍）。因此，当你创建新工作簿并开始输入数据时，Excel\
  \ 会以正常大小的字体显示数据。\n\n**提示：** 要控制新工作簿使用的字体和字号，请选择“Excel” → “偏好设置”或按 `Cmd+,`（Cmd 键和逗号键）。在“Excel\
  \ 偏好设置”对话框的“创作”区域中单击“常规”图标，以显示“常规”面板。打开“标准字体”菜单，然后单击你想要的字体；列表顶部的“正文字体”选项会为你提供工作簿模板中设置的正文字体；如果你更改此字体，则会更改除“标题”样式（使用“标题字体”）之外的所有样式中使用的字体。然后，在“字号”弹出菜单中选择字号。单击“确定”按钮关闭“Excel\
  \ 偏好设置”对话框。\n\n##### 了解应用格式化的三种主要工具\n\nExcel 提供了三种主要工具来对单元格和区域应用格式：\n\n- **“格式”工具栏。**\
  \ 如果你显示此工具栏（从菜单栏选择“视图” → “工具栏” → “格式”），可以快速应用一些最常用的格式。图 4-5 显示了带有标签控件的“格式”工具栏（以浮动形式显示，以便更容易查看）。\n\
  \n**注意：** 功能区的“开始”选项卡也提供了你在“格式”工具栏上找到的格式化命令，因此你可以使用更方便的那个。\n\n**图 4-5.** *“格式”工具栏通常是应用常用格式的最简单方法。*\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-128_1.png)\n\
  \n**124**\n\n## 第 4 章：快速高效地格式化工作表\n\n- **功能区的“开始”选项卡。** “字体”组提供了广泛使用的字体格式；“对齐”组提供了水平与垂直对齐、方向、缩进、自动换行和合并；“数字”组则为你提供了一种快速应用基本数字格式的方法。图\
  \ 4-6 显示了带有标签控件的“字体”组。图 4-7 显示了带有标签控件的“对齐”组和“数字”组。\n\n**图 4-6.** *你可以从功能区“开始”选项卡上的“字体”组中快速应用基本的字体格式、边框和填充。*\n\
  \n**注意：** “增大字号”按钮、“减小字号”按钮和“边框”弹出菜单仅当 Excel 窗口足够宽以容纳它们时，才会出现在功能区“开始”选项卡上的“字体”组中。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-129_1.png)\n\
  \n## 第 4 章：快速高效地格式化工作表\n\n**125**\n\n**图 4-7.** *从功能区“开始”选项卡上的“对齐”组中，你可以设置水平和垂直对齐、方向以及自动换行。从“数字”组中，你可以应用数字格式。*\n\
  \n- **“设置单元格格式”对话框。** 当你需要应用“标准”工具栏或功能区“开始”选项卡上未出现的格式化类型时，请打开“设置单元格格式”对话框，并操作其六个选项卡（本章稍后会介绍）。显示“设置单元格格式”对话框的最简单方法是\
  \ `Ctrl+click` 或右键单击某个单元格或选定区域，然后在上下文菜单中单击“设置单元格格式”。你也可以通过按 `Cmd+1` 或从菜单栏选择“格式”\
  \ → “单元格”来打开“设置单元格格式”对话框。\n\n##### 通过应用数字格式控制数据的外观\n\n\n\n当你在单元格中输入数字时，Excel 会根据应用于该单元格的数字格式进行显示。例如，如果你在格式为“常规”的单元格中输入\
  \ `39250`，Excel 会将其显示为 39250。如果该单元格采用“货币”格式，Excel 会显示类似 $39,250.00 这样的值（具体取决于格式的细节）。如果该单元格采用“日期”格式，Excel\
  \ 会显示类似“2011 年 6 月 18 日”这样的日期（同样取决于格式的细节）。无论哪种情况，单元格中存储的数字保持不变——因此，如果你将单元格的格式更改为不同类型，Excel\
  \ 显示数据的方式也会随之改变。\n\n表 4-1 解释了 Excel 的数字格式，并说明了应用这些格式的键盘快捷键。你还可以通过使用标准工具栏上的按钮、功能区“开始”选项卡“数字”组中的“数字格式”下拉菜单和按钮，以及“设置单元格格式”对话框的“数字”选项卡（参见图\
  \ 4-8）来应用数字格式。\n\n**图 4-8.**  当你需要访问完整的数字格式选项时，请使用“设置单元格格式”对话框的“数字”选项卡。\n\n**表 4-1.**\
  \ Excel 的数字格式\n\n| 数字格式 | 键盘快捷键 | 说明 | 示例 |\n| :--- | :--- | :--- | :--- |\n| 常规\
  \ | `Ctrl+Shift+~` (波浪号) | Excel 对新工作表中所有单元格的默认格式。无特定格式，但每个单元格最多显示 11 位数字，且不使用千位分隔符。对于超过\
  \ 11 位的任何输入，“常规”格式会使用科学记数法（参见本表后面的“科学记数”条目）。 | `1234567` |\n| 数值 | `Ctrl+Shift+!`\
  \ | 显示您选择的小数位数。您可以选择是否使用千位分隔符以及如何显示负数。 | `1000`, `1,000`, `1,000.00` |\n| 货币 | `Ctrl+Shift+$`\
  \ | 显示您选择的小数位数，并使用千位分隔符。您可以选择显示哪种货币符号（例如 $）以及如何显示负数。 | `$2,345.67`, `–$2,345.67`\
  \ |\n| 会计专用 | — | 显示您选择的小数位数，并使用千位分隔符。您可以选择使用哪种货币符号。符号在单元格的左边缘对齐。负数用括号括起来显示。 | `$\
  \ 1,000,000`, `$ (99.999.00)` |\n| 日期 | `Ctrl+Shift+#` | 显示多种日期格式中的任何一种。 | `6/24/2011`,\
  \ `2011 年 6 月 24 日星期四` |\n| 时间 | `Ctrl+Shift+@` | 显示多种时间格式中的任何一种。 | `11:59:59 PM`,\
  \ `23:59:59` |\n| 百分比 | `Ctrl+Shift+%` | 显示百分号以及您选择的小数位数。 | `78.79%`, `200%` |\n\
  | 分数 | — | 将数字显示为分数。分数在视觉上容易造成混淆，因此仅在必要时使用——例如，用于投注图表。 | `1/2`, `1 1/4` |\n| 科学记数\
