- "# Calc\n\nCalc（最新版本可处理 Excel 工作簿格式）。\n\n## 配置兼容性检查\n\n当您在“兼容性”偏好设置窗格中时，请确保选中窗格顶部的“检查文档的兼容性”复选框。此设置可确保当您将工作簿保存为\
  \ Excel 97–2003 或其他功能少于 Excel 工作簿格式的格式时，Excel 会警告您可能无法在该格式中正常显示的信息。\n\n**注意：** 在“兼容性”偏好设置窗格顶部的“兼容性报告”区域中，您可以单击“重置忽略的问题”按钮，以重置您在执行兼容性检查时忽略的任何兼容性问题的警告。如果您希望强制\
  \ Excel 重新检查工作簿所有方面的兼容性，可以单击“重置所有问题”按钮。\n\n##### 设置自动恢复以安全地保留工作簿备份\n\n接下来，决定是否保留工作簿的自动恢复文件。自动恢复是一个安全网，每几分钟自动保存每个打开的工作簿副本，以防\
  \ Excel 或您的 Mac 崩溃并丢失您所做的更改。发生此类崩溃后，当 Excel 自动重启或您手动重启时，它会为您打开最新的自动恢复文件，以便您选择要保留的版本。如果您保存工作簿后正常退出\
  \ Excel（例如，选择“Excel”>“退出”），Excel 会删除已保存的自动恢复文件。\n\n**警告：** 切勿依赖自动恢复作为防止灾难的保护。当自动恢复正常工作时，它可以拯救您，但有时它并不能保存所有内容，尤其是在\
  \ Excel 或您的 Mac 在自动恢复保存即将进行前不久崩溃时。因此，您应在处理工作簿时经常保存它们，并且仅在灾难发生时使用自动恢复。您可以通过按 `Cmd+S`、单击标准工具栏上的“保存”按钮或从菜单栏中选择“文件”>“保存”来随时保存工作簿。\n\
  \n要选择自动恢复设置，请按照以下步骤操作：\n\n1.  显示“保存”偏好设置窗格。\n2.  选中或清除“保存自动恢复信息，时间间隔”复选框。\n3.  如果选中了该复选框，请在文本框中输入分钟数。\n\
  \n您可以将间隔设置为 1 分钟到 120 分钟之间的任何值。大约 3 分钟的间隔通常效果很好，因为它足够频繁地保存信息以避免灾难，但不会因持续保存而过度中断您的工作。\n\
  \n如果您编辑包含许多工作表和大量数据的工作簿，保存自动恢复文件可能需要足够长的时间来中断您的工作。在这种情况下，要么增加自动恢复间隔以减少中断频率，要么关闭自动恢复并在方便时手动保存工作簿。\n\
  \n##### 让 Excel 提示您输入工作簿属性\n\n在您保存的每个工作簿中，您可以存储额外的信息，以帮助您自己和您的同事识别工作簿、其用途和状态。Excel\
  \ 提供了称为属性的槽来包含此类信息。\n\nExcel 会为您填写一些属性——例如，它在“作者”属性中输入您的用户名，在“创建”属性中填入您首次保存工作簿的时间，并在您每次保存文档时更新“修改”属性。但是，其余属性的填写取决于您。开始填写属性的最佳时间是您首次保存工作簿时。\n\
  \n要让 Excel 在您首次保存工作簿时自动显示“属性”对话框，请选中“常规”偏好设置窗格顶部的“提示输入工作簿属性”复选框。\n\n**注意：** 您可以通过选择“文件”>“属性”随时打开“属性”对话框。我们将在第\
  \ 3 章中介绍“属性”对话框。\n\n#### 创建自定义键盘快捷键\n\n当您发现需要从键盘运行的命令没有预定义的键盘快捷键时，您可以创建自定义键盘快捷键。您也可以创建一个来替换或补充现有的键盘快捷键，或者运行您创建的宏（第\
  \ 14 章介绍了创建宏）。\n\n要创建自定义键盘快捷键，请按照以下步骤操作：\n\n1.  选择“工具”>“自定义键盘”以显示“自定义键盘”对话框（如图 2-6\
  \ 所示，其中已选择用于创建快捷键的设置）。\n2.  在“类别”列表框中，单击您要为其创建键盘快捷键的命令的类别。\n\n    顶部的“所有命令”项目按字母顺序为您提供对所有命令的访问。当您寻找一个不在菜单上的命令（或您忘记了其菜单的命令）时，请使用此类别。\n\
  \n    单击常规菜单项之一——“文件”菜单、“编辑”菜单、“视图”菜单等——以显示该菜单上的项目以及相关但未出现在菜单上的命令。\n\n    单击“图表”类别以显示图表命令。\n\
  \n    **提示：** 如果您发现经常使用相同的图表命令，请使用“自定义键盘”对话框中的“图表”类别为它们创建键盘快捷键。这样，您就可以从键盘快速发出基本命令，而无需使用功能区。\n\
  \n3.  在“命令”列表框中，单击您要为其创建键盘快捷键的命令。Excel 会显示有关该命令的信息：\n\n    -   *当前键盘快捷键*。“当前快捷键”列表框显示当前分配给该命令的任何键盘快捷键（某些命令有多个快捷键）。如果此命令有任何快捷键，请检查您是否知道它们，并决定是否需要创建另一个。\n\
  \    -   *描述*。此区域显示命令的描述。阅读它以确保您选择了预期的命令。有些命令名称很清晰，但其他的可能会令人困惑（如有疑问，请关闭“自定义键盘”对话框，然后从功能区或菜单中尝试该命令，以确保它执行您认为的功能）。\n\
  \n4.  单击“请按新快捷键”文本框。\n5.  按下您要分配的键盘快捷键：\n\n    您可以创建以 `Cmd` 和 `Ctrl` 键开头的键盘快捷键：`Cmd`、`Cmd+Option`、`Cmd+Ctrl`、`Cmd+Option+Shift`、`Cmd+Option+Ctrl`、`Cmd+Option+Ctrl+Shift`、`Cmd+Ctrl+Shift`、`Ctrl`、`Ctrl+Option`、`Ctrl+Shift`、`Ctrl+Option+Shift`\
  \ 都是可能的。\n\n    您几乎可以使用键盘上的任何键——字母、数字、功能键等。\n\n6.  检查“当前分配对象”读数，以查看该键盘快捷键是否已在使用。如果是，如果您不想覆盖它，请按另一个键盘快捷键。\n\
  7.  单击“分配”按钮。Excel 将该键盘快捷键分配给命令。\n8.  完成分配键盘快捷键后，单击“关闭”按钮关闭“自定义键盘”对话框。\n\n#### 使用您需要的命令自定义工具栏\n\
  \n要使工具栏按您喜欢的方式工作，您可以自定义它们。您可以更改标准工具栏和格式工具栏上显示的按钮，或者创建自己的自定义工具栏，并只为其提供所需的按钮。\n\n\n\
  \n**注意：** 你也可以自定义菜单和菜单栏，本章稍后会介绍。例如，你可以向菜单添加额外命令、删除不用的命令，或创建自己的自定义菜单。自定义菜单和菜单栏时，使用的方法与工具栏相同，因为从技术上讲，菜单栏与工具栏属于同一类对象（即“命令栏”），尽管其外观和操作方式有所不同。\n\
  \n##### 准备工作：自定义工具栏\n\n要准备自定义工具栏，请打开“自定义工具栏和菜单”对话框，并显示要自定义的工具栏。请按以下步骤操作：\n\n1. \
  \ 打开 Excel，如果 Excel 已在运行，则将其激活。\n\n2.  右键点击“标准”工具栏或“格式”工具栏，然后在上下文菜单中点击“自定义工具栏和菜单”项以显示该对话框。你也可以选择“视图”>“工具栏”>“自定义工具栏和菜单”。\n\
  \n3.  如果“工具栏和菜单”选项卡不在最前面，请点击它使其显示在最前面。图 2-7 显示了“自定义工具栏和菜单”对话框，其中“工具栏和菜单”选项卡位于最前面。“格式”工具栏处于取消停靠状态，显示在对话框上方。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-75_1.png)\n\n\
  **第 2 章：配置 Excel:Mac 以适应你的工作方式**  \n**69**\n\n**图 2-7**。在“自定义工具栏和菜单”对话框的“工具栏和菜单”选项卡上，选中每个要显示以便自定义的工具栏或菜单对应的“显示”复选框。此处对话框上方的工具栏是已从窗口取消停靠的“格式”工具栏。\n\
  \n4.  在“显示”列中，选中每个要自定义的工具栏或菜单栏对应的复选框。例如，如果要自定义“格式”工具栏，请选中“格式”行中的“显示”复选框，使“格式”工具栏显示出来。\n\
  \n5.  在“停靠”列中，如果希望停靠工具栏，请选中“停靠”复选框；如果希望工具栏浮动，则清除此复选框。“停靠”复选框仅出现在“标准”工具栏和“格式”工具栏中，不会出现在你创建的自定义工具栏中。但由于“标准”工具栏的“停靠”复选框处于选中且不可用状态，因此“格式”工具栏是唯一可以使用此设置的工具栏。\n\
  \n现在，你可以按照后续章节中的讨论创建新工具栏或自定义工具栏了。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-76_1.png)\n\n**70**  \n**第 2 章：配置 Excel:Mac 以适应你的工作方式**\n\n#####\
  \ 创建新工具栏\n\n要创建新工具栏，请点击“自定义工具栏和菜单”对话框的“工具栏和菜单”选项卡中的“新建”按钮。在打开的“添加工具栏”对话框中，键入你希望为工具栏指定的名称，然后点击“确定”按钮。\n\
  \n新工具栏会显示为一个小的浮动窗口（其尺寸较小，因为其中尚未包含任何按钮或其他控件）。然后，你可以按照下一节所述，向新工具栏添加命令。\n\n##### 查找要添加到工具栏或菜单的命令\n\
  \n要查找要添加到工具栏或菜单的命令，请按以下步骤操作：\n\n1.  点击“自定义工具栏和菜单”对话框的“命令”选项卡以显示其内容（参见图 2-8）。\n\n\
  **图 2-8**。在“自定义工具栏和菜单”对话框的“命令”选项卡上，点击包含要添加到工具栏或菜单的命令的类别。\n\n2.  在“类别”列表框中，点击你需要的命令类别。例如，点击“文件”类别以查看与应用程序“文件”菜单关联的命令。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**71**  \n**第 2 章：配置 Excel:Mac\
  \ 以适应你的工作方式**\n\n**注意：** 每个类别包含的命令比相应菜单中显示的命令更多。例如，如果在“类别”列表框中点击“文件”类别，你不仅会看到“文件”菜单上实际显示的命令，还会看到那些未显示但执行与文件相关操作的命令。\n\
  \n3.  在“命令”框中，找到要添加到工具栏或菜单的命令。\n\n现在，你可以按照后续章节所述，将命令添加到工具栏了。\n\n##### 向工具栏添加项目\n\
  \n要向工具栏添加命令，请将命令从“自定义工具栏和菜单”对话框的“命令”选项卡上的“命令”列表框拖动到工具栏。Excel 会显示一条浅蓝色线条，指示按钮将出现的位置。如果工具栏是水平放置的，蓝色线条是垂直的；如果工具栏是垂直放置的，蓝色线条是水平的。\n\
  \n##### 从工具栏移除项目\n\n要从工具栏移除项目，请将该项目拖离工具栏，拖到窗口的文档区域或“自定义工具栏和菜单”对话框上方。该项目会从工具栏上消失。\n\
  \n##### 重新定位工具栏上的项目\n\n要重新定位工具栏上的项目，请将其从当前位置拖拽到希望其出现的位置。如果需要，你也可以将一个项目从一个工具栏拖拽到另一个工具栏。例如，你可以将一个按钮从“标准”工具栏拖拽到“格式”工具栏，将其从一个移动到另一个，或者将其拖拽到你创建的自定义工具栏上。\n\
  \n##### 更改工具栏按钮的外观\n\n当你向工具栏添加按钮时，Excel 会使用该项目的常规图标、文本或两者兼用。为了使按钮更易于识别，你可以更改图标和文本。请按以下步骤操作：\n\
  \n1.  按住 Ctrl 键并点击或右键点击工具栏按钮，然后在上下文菜单中点击“属性”。Excel 会显示“命令属性”对话框（参见图 2-9）。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-78_1.png)\n\n**72**  \n**第 2 章：配置 Excel:Mac 以适应你的工作方式**\n\n**图 2-9**。当你想更改工具栏按钮显示的图标、文本或两者时，请使用“命令属性”对话框。“名称”框左侧的图标显示了该命令的当前图标（如果有的话）。\n\
  \n2.  在“名称”文本框中，键入你希望为工具栏按钮显示的名称。\n\n**注意：** 某些命令的“名称”文本框中会显示一个 & 符（`&`）——例如，在图\
  \ 2-9 中，“保护工作表”命令显示为“`&Protect Sheet`”。该字符在 Windows 中用于控制用作命令访问键的字母——例如，当你按下 `Alt+F`\
  \ 显示“文件”菜单时，`F` 就是访问键。& 符在 Mac 上不起作用，因此你在键入的名称中无需包含它。命令名称末尾的省略号（`…`）表示该命令会显示一个对话框，就像菜单上一样。\n\
  \n3.  在“视图”弹出菜单中，选择你希望工具栏按钮或菜单项显示的方式：\n\n-   **默认样式。** 选择此项可使工具栏按钮使用你为工具栏设置的默认样式显示。（如果你选择显示图标和文本，按钮会显示为带文本的图标；如果你选择仅显示图标，则只显示图标。）如果命令有关联图标，菜单项会显示为带文本和图标。\n\
  \n-   **仅文本（始终）。** 选择此项可使工具栏按钮或菜单项显示为不带图标的文本。\n\n-   **仅文本（在菜单中）。** 选择此项可使菜单项仅显示为文本。\n\
  \n-   **图像和文本。** 选择此项可使工具栏按钮或菜单项显示为带文本的图标。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**73**  \n**第 2 章：配置 Excel:Mac 以适应你的工作方式**\n\n4.  如果你想更改图标，请点击“名称”框左侧的箭头按钮，然后在弹出菜单中点击你想要的图标。\n\
  \n\n**提示：** 如果你想使用另一个工具栏按钮或菜单项中的图标，请点击`取消`按钮关闭`命令属性`对话框。`Ctrl+单击`或右键单击带图标的项目，然后从上下文菜单中点击`属性`，打开该命令的`命令属性`对话框。点击`名称`框左侧的箭头按钮，然后在弹出菜单中点击`复制按钮图像`。点击`取消`按钮关闭`命令属性`对话框。\n\
  \n现在，打开另一个项目的`命令属性`对话框，点击`名称`框左侧的箭头按钮，然后在弹出菜单中点击`粘贴按钮图像`。这段描述略显啰嗦，但一旦你知道怎么做，就能在几秒内完成操作。\n\
  \n**5. ** 如果要在项目前添加分隔线，请选中`开始一个组`复选框。当你想要将不同的项目组放在菜单或工具栏的不同区域时，这非常有用。\n\n**6. **\
  \ 点击`确定`按钮关闭`命令属性`对话框。\n\n##### 将内置菜单添加到工具栏\n\n一项非常实用的自定义操作是将一个或多个内置菜单添加到工具栏。如果你喜欢通过菜单来下达命令，但觉得将鼠标一路向上移动到菜单栏浪费时间——例如，在使用大显示器或多显示器设置时——你会发现这个功能很方便。\n\
  \n要将内置菜单添加到工具栏，请按以下步骤操作：\n\n**1. ** 在`自定义工具栏和菜单`对话框的`命令`选项卡中，向下滚动到`类别`列表框的底部。\n\n\
  **2. ** 点击`内置菜单`项目，以在`命令`框中显示菜单列表。\n\n**3. ** 将菜单拖到工具栏上，并放置在你希望它出现的位置。\n\n#### 自定义菜单和菜单栏\n\
  \nRibbon 是 Excel 2011 一个简洁的新增功能，但你会发现菜单仍然是下达许多命令最便捷的方式。如果是这样，你可能希望自定义菜单，将最常用的命令放在触手可及之处，添加你觉得有用的专用命令，并删除你很少或从不使用的命令。\n\
  \n要自定义菜单和菜单栏，请打开`自定义工具栏和菜单`对话框，并按如下方法为标准菜单栏显示工具栏：\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**第 2 章：配置 Excel:Mac 以适应你的工作方式**\n\n**1. ** 右键点击`标准`工具栏或`格式`工具栏，然后在上下文菜单中点击`自定义工具栏和菜单`项目，以显示`自定义工具栏和菜单`对话框。你也可以选择`视图`\
  \ > `工具栏` > `自定义工具栏和菜单`。\n\n**2. ** 如果`工具栏和菜单`选项卡不在最前面，请点击它将其前置。\n\n**3. ** 选中`工作表菜单栏`复选框（如果尚未选中）。Excel\
  \ 会在屏幕上显示标准菜单栏的工具栏（即处理工作表而非图表时看到的工具栏）。\n\n现在，你可以按照下文的说明向菜单或菜单栏添加命令。\n\n##### 自定义菜单\n\
  \n要自定义菜单，请在`自定义工具栏和菜单`对话框打开且`工作表菜单栏`工具栏显示的情况下，按以下步骤操作：\n\n**1. ** 点击`命令`选项卡，将其前置到`自定义工具栏和菜单`对话框的最前面。\n\
  \n**2. ** 使用本章前面介绍的技术，找到你想要添加到菜单的命令。\n\n**3. ** 点击该命令，然后将其拖到`工作表菜单栏`工具栏上对应的菜单中。Excel\
  \ 会显示该菜单。\n\n**4. ** 在按住鼠标按钮的同时，将命令拖到菜单上你希望其出现的位置。图 2‑10 显示了将一个命令拖到菜单上的示例。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n![](img/index-81_1.png)\n\n**第 2 章：配置 Excel:Mac 以适应你的工作方式**\n\n**图 2–10.** *要向菜单添加命令，请将该命令拖到代表菜单栏的工具栏上，然后将其拖到菜单上你希望的位置。*\n\
  \n\n**5.** 当你拖放该命令时，它会出现在菜单上。随后你可以通过按住`Ctrl`键并单击或右键单击该命令，然后在“命令属性”对话框中进行操作来定制菜单项，具体方法与本章前面讨论的定制工具栏相同。\n\
  \n**定制菜单栏**\n\n要定制菜单栏，请打开“自定义工具栏和菜单”对话框，并显示“工作表菜单栏”工具栏。然后你可以通过以下方式定制菜单栏：\n\n*  \
  \ **添加新菜单**。操作步骤如下：\n    *   在“类别”列表框的底部向下滚动，并单击“新菜单”项。“命令”列表框中会显示一个单项：“新菜单”。\n\
  \    *   在“命令”列表框中，单击“新菜单”项，然后将其拖放到菜单栏上。当`Excel`在你希望放置新菜单位置的菜单之间显示一条垂直蓝线时，松开鼠标按钮。`Excel`会在菜单栏上添加一个名为“新菜单”的新菜单。\n\
  \n        **注意：** 如果你想将新菜单作为现有菜单上的子菜单添加，请将“新菜单”项拖到该现有菜单上。在按住鼠标按钮的同时，等待菜单打开，然后将其拖到所需位置，再松开鼠标按钮。\n\
  \n    *   按住`Ctrl`键并单击或右键单击“新菜单”项，然后单击“命令属性”以显示“命令属性”对话框。\n    *   在“名称”框中，为新菜单键入一个名称。\n\
  \    *   如果你希望在菜单名称前放置一条垂直分隔线，请选中“开始一个分组”复选框。分隔线在菜单栏上的作用通常不如在工具栏上明显，但你可能会喜欢这种外观。\n\
  \    *   单击“确定”按钮关闭“命令属性”对话框。\n    *   按照上一节所述的方法，将命令添加到新菜单。图 2-11 显示了一个已就位的自定义菜单，并正在添加一条新命令。\n\
  \n**图 2–11.** *添加新菜单并命名后，从“自定义工具栏和菜单”对话框中将命令拖放到该菜单上。*\n\n*   **更改现有菜单**。按住`Ctrl`键并单击或右键单击“工作表菜单栏”工具栏上的菜单，然后单击“命令属性”以显示“命令属性”对话框。然后你可以更改菜单的名称，或选中“开始一个分组”复选框以在菜单前添加一条分隔线。单击“确定”按钮。\n\
  \n*   **删除现有菜单**。按住`Ctrl`键并单击或右键单击“工作表菜单栏”工具栏上的菜单，然后在弹出菜单上单击“删除命令”。\n\n*   **移动现有菜单**。单击“工作表菜单栏”工具栏上的菜单，然后将菜单拖到你希望它出现的位置。\n\
  \n*   完成菜单和菜单栏的定制后，单击“确定”按钮关闭“自定义工具栏和菜单”对话框。你的更改随后会出现在`Excel`的主菜单栏中。\n\n**注意：**\
  \ “工作簿菜单栏”工具栏代表标准的`Excel`菜单栏，它在你处理除图表之外的任何内容时显示。当选中一个图表或图表元素时，`Excel`会显示图表菜单栏。要定制图表菜单栏，请在“自定义工具栏和菜单”对话框的“工具栏和菜单”选项卡上选中“图表菜单栏”复选框，然后操作出现的命令栏。\n\
  \n**关闭或定制功能区**\n\n正如你在第 1 章中学到的，你也可以定制功能区——与你可以对工具栏和菜单栏进行彻底更改相比，仅能进行少量更改——但这仍然足以有所帮助。你可以控制功能区的外观和行为，并且可以选择显示哪些选项卡及其顺序。\n\
  \n你也可以完全关闭功能区。我们从这一主题开始。\n\n**注意：** 在使用本书作为参考时，你可能会发现让功能区保持显示并显示其所有标准选项卡是最容易的。如果你隐藏或定制了功能区，找到所需的命令将更加困难。\n\
  \n**关闭功能区使其不显示**\n\n\n\n"
- "# 折叠功能区\n\n折叠功能区可以为你腾出更多屏幕空间，但你或许想尝试完全关闭功能区，看看能否不用它。若要操作，请按以下步骤进行：\n\n1. 单击功能区右端的**设置功能区首选项或标签页顺序**按钮（齿轮按钮），然后单击**功能区首选项**。Excel\
  \ 将显示功能区首选项窗格（见图 2–12）。\n\n   [www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n   ![](img/index-84_1.png)\n\n   **第 2 章：配置 Excel:Mac 以符合你的工作方式**\n\n   **图 2–12.**\
  \ *在功能区首选项窗格中，你可以完全关闭功能区、隐藏功能区组名称，或自定义始终显示在功能区中的标签页。*\n\n2. 在**通用**区域中，取消选中**启用功能区**复选框。\n\
  \n3. 单击**确定**按钮关闭**Excel 偏好设置**对话框。\n\n**注意：** 当你想再次启用功能区时，请选择**Excel 偏好设置**或按 `Cmd+,`（Cmd\
  \ 和逗号键）以显示**Excel 偏好设置**对话框，然后单击**共享与隐私**类别中的**功能区**图标。接着选中**启用功能区**复选框，再单击**确定**按钮。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n![](img/index-85_1.png)\n\n\
  **第 2 章：配置 Excel:Mac 以符合你的工作方式**\n\n#### 自定义功能区\n\n你可以通过选择要显示的标签页及其显示顺序来自定义功能区。你无法移除“开始”标签页或更改其位置，但可以隐藏或移动其他任何标签页。\n\
  \n##### 快速自定义功能区\n\n快速自定义功能区的方法是：单击功能区右端的**设置功能区首选项或标签页顺序**按钮（齿轮按钮），然后在弹出菜单中单击**自定义功能区标签页顺序**。除“开始”标签页外，Excel\
  \ 会在每个标签页上显示一个 × 按钮和一个手柄（三条竖线）（见图 2–13）。\n\n**图 2–13.** *你可以通过将功能区标签页拖拽到偏好的顺序，或移除不需要的标签页来自定义功能区。完成后单击**完成**按钮。*\n\
  \n接着你可以单击某个标签页并将其拖拽到所需位置，或单击标签页的 × 按钮将其移除。自定义完成后，单击**完成**按钮。如果操作失误，单击**重置**按钮即可将标签页恢复为默认设置。\n\
  \n##### 使用功能区首选项窗格自定义功能区\n\n自定义功能区的另一种方法是使用功能区首选项窗格。当你希望控制 Excel 在打开工作簿时是否自动展开功能区、想要隐藏功能区组名称，或想重新显示已隐藏的标签页（无需重置整个功能区）时，请使用此方法。\n\
  \n若要使用功能区首选项窗格自定义功能区，请按以下步骤操作：\n\n1. 单击功能区右端的**设置功能区首选项或标签页顺序**按钮（齿轮按钮），然后单击**功能区首选项**。Excel\
  \ 将显示功能区首选项窗格（如图 2–12 所示，见本章前面部分）。\n\n2. 在顶部的**通用**区域中，如果你不希望 Excel 在打开每个工作簿时自动展开功能区，请取消选中**打开工作簿时展开功能区**复选框。有些人觉得此自动展开功能很实用，而另一些人则不这么认为。\n\
  \n   [www.it-ebooks.info](http://www.it-ebooks.info/)\n\n3. 同样在**通用**区域中，如果你希望阻止显示组名称，请选中**隐藏组标题**复选框。隐藏组标题会使功能区略浅一些，因此如果空间紧张，不妨尝试一下。但这会使你更难遵循本书的说明，因为书中指令包含了功能区中的组信息。\n\
  \n4. 在**外观**弹出菜单中，如果你希望将功能区标签页设为灰色而非默认的 Excel 绿色，请选择**石墨色**。\n\n5. 在**“显示或隐藏标签页，或将其拖拽至偏好的顺序”**列表框中，按你需要的方式设置标签页。\n\
  \n\n\n清除您不想显示的任何选项卡的复选框。\n\n将选项卡拖拽至您希望的顺序。\n\n**6.** 点击“确定”按钮关闭“Excel 偏好设置”对话框。\n\
  \n**注意：** 在“显示或隐藏选项卡，或将其拖拽至您偏好的顺序”列表框底部，您可以找到“开发工具”选项卡。此选项卡包含用于处理 Visual Basic for\
  \ Applications（VBA，Office 应用程序内置的编程语言）、运行加载项以及构建带有复选框、列表框和命令按钮等控件的表单的控件。\n\n**随\
  \ Excel 自动打开一个或多个工作簿**\n\n如果您愿意，可以让 Excel 在启动应用程序时自动打开一个或多个工作簿。当您通常需要在每次使用 Excel\
  \ 时处理相同的工作簿时，这非常方便。\n\n要让 Excel 自动打开一个或多个工作簿，请创建一个仅包含这些工作簿的文件夹。然后转到“常规”偏好设置面板，点击“启动时打开所有文件”框右侧的“选择”按钮，在“选择文件夹:\
  \ Microsoft Excel”对话框中选择该文件夹，然后点击“选择”按钮。\n\n**提示：** 如果您希望在登录时自动启动 Excel，请按住 `Ctrl`\
  \ 键并点击或右键点击 Dock 上的 Excel 图标。点击或高亮“选项”以显示“选项”子菜单，然后点击“登录时打开”项，在其旁边放置一个复选标记。\n\n\
  您也可以通过将工作簿放入 `Applications/Microsoft Office 2011/Office/Startup/Excel/` 文件夹，使其在启动时打开。但这会影响您\
  \ Mac 上 Excel 的所有用户，而不仅仅是创建工作簿的用户。此功能偶尔有用，但通常每个用户都希望能够自行选择在启动时要打开哪些工作簿（如果有的话）。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 2 章：配置 Excel:Mac 以适应您的工作方式**\n\
  \n**81**\n\n**将打开的工作簿布局保存为工作区**\n\n如果您需要同时处理多个工作簿，可以利用 Excel 的工作区功能。*工作区*是一种保存打开工作簿布局的方式，以便下次能以相同方式打开它们。\n\
  \n要保存工作区，请按照以下步骤操作：\n\n**1.** 打开工作簿并按您希望的方式排列它们。\n\n**2.** 选择“文件”>“保存布局”以显示“保存:\
  \ Microsoft Excel”对话框。\n\n**3.** 为工作区输入一个名称。\n\n**4.** 点击“保存”按钮。\n\n要使用已保存的工作区，请像打开任何其他文件一样打开它：通常，打开工作区最快的途径是从“Excel\
  \ 工作簿库”对话框的“最近的工作簿”列表或“文件”>“最近的文件”子菜单中打开。\n\n**提示：** 您可以将工作区布局文件保存在 Excel 启动文件夹中，以自动打开工作区中的所有工作簿，并按您保存的布局排列它们。\n\
  \n如果您最近未使用该工作区，请点击“打开”按钮（或按 `Cmd+O` 或从菜单栏选择“文件”>“打开”），然后使用“打开”对话框打开工作区。\n\n您也可以在\
  \ Finder 中双击工作区文件以打开工作区，如果 Excel 尚未运行，则会启动它。例如，您可以将经常使用的工作区放在 Dock 上，以便于访问。\n\n\
  **总结**\n\n在本章中，您学习了如何通过设置基本偏好设置（包括“常规”偏好设置、“视图”偏好设置、“编辑”偏好设置、“保存”偏好设置和“兼容性”偏好设置）来配置\
  \ Excel:Mac 以适应您的工作方式。您现在还知道如何自定义键盘快捷键、菜单、菜单栏和工具栏；如何更改功能区的外观和工作方式；以及如何在启动 Excel\
  \ 时自动打开工作簿，或将多个工作簿恢复到您偏好的布局。\n\n将 Excel 设置成您想要的样子后，您就可以卷起袖子开始工作了。我们将在下一章从如何创建有效的工作簿和模板开始。当您准备好开始时，请翻页。\n\
  \n\n\n"
- "# 创建高效的工作簿与模板\n\n在本章中，我将向你展示如何创建工作簿，以便快速有效地输入、编辑和处理数据。你将学习如何保存工作簿、何时使用何种文件格式，以及如何添加属性信息，以便在搜索时快速识别工作簿。\n\
  \n你可能需要从零开始创建某些工作簿，但通过基于模板创建其他工作簿，可以节省时间和精力。Excel 自带多种模板，你也可以从 Office 网站下载其他模板；但为了最大程度节省时间，你很可能希望创建自己的模板，本章末尾将对此进行讨论。\n\
  \n在了解如何创建和保存工作簿后，你将学习如何组织工作簿中的工作表、如何高效布局数据，以及如何同时在多个工作表中快速输入数据。接着，我们将转向创建命名范围以轻松识别工作表的各个部分，并利用\
  \ Excel 的大纲功能创建可折叠的工作表。\n\n#### 从零开始或基于模板创建工作簿\n\n启动 Excel 时，它会自动显示\"Excel 工作簿库\"\
  对话框（见图 3–1），以便你创建新工作簿或打开最近使用过的工作簿。在本节中，我们将探讨如何从零开始或基于模板创建新工作簿；如何以合适的格式保存工作簿；以及如何在属性中输入信息以便更轻松地识别工作簿。\n\
  \n**注意：** 如果你不希望启动 Excel 时打开\"Excel 工作簿库\"对话框，请选中该对话框底部的\"打开 Excel 时不再显示\"复选框，然后点击\"\
  取消\"按钮。如需在启动时重新显示\"Excel 工作簿库\"对话框，请选择\"Excel 偏好设置\"或按下`Cmd+,`（`Cmd`键和逗号键）以显示\"\
  Excel 偏好设置\"对话框。在\"创作\"区域，点击\"通用\"图标以显示通用面板。选中\"应用程序打开时显示 Excel 工作簿库\"复选框，然后点击\"\
  确定\"按钮。\n\n**图 3–1.** *在 Excel 工作簿库中，你可以创建空白工作簿、基于 Mac 上模板的工作簿或基于在线模板的工作簿。你也可以打开最近使用过的工作簿。*\n\
  \n##### 创建新的空白工作簿\n\n当你需要不含任何内容或格式的新工作簿时，可通过以下方式之一创建：\n\n- **Excel 工作簿库：** 点击\"\
  Excel 工作簿\"项，然后点击\"选取\"按钮。\n- **键盘：** 按下`Cmd+N`。\n- **菜单栏：** 选择\"文件\"→\"新建工作簿\"\
  。\n\n##### 基于模板创建新工作簿\n\n要基于模板创建新工作簿，请使用\"Excel 工作簿库\"对话框（见图 3–1）。默认情况下，该对话框在启动\
  \ Excel 时打开，但你也可以随时通过菜单栏选择\"文件\"→\"从模板新建\"或按下`Cmd+Shift+P`来显示它。\n\n在此对话框中，你可以选择所需模板：\n\
  \n- **Mac 上的模板：** 要基于存储在 Mac 上的模板创建新工作簿，请按以下步骤操作：\n  1. 在左侧窗格的模板列表中点击相应类别——如果你想查看所有模板，请点击\"\
  全部\"类别。\n  2. 在中间窗格中，点击你想要的模板。右侧窗格会显示预览。如果工作簿包含多个工作表，你可以通过点击右侧窗格中的\"上一个 (<)\"按钮和\"\
  下一个 (>)\"按钮来预览它们。如需更快速但更小的预览，请将鼠标悬停在中间窗格的模板图像上。\n\n**注意：** 模板列表中显示的第一个\"Excel 工作簿\"\
  项用于生成空白工作簿。\n\n3. 点击\"选取\"按钮以基于该模板创建工作簿。\n\n\n\n"
- '# 在线模板


  若要基于 Microsoft `Office.com` 网站上的模板创建工作簿，请按以下步骤操作：


  **1.** 在左侧窗格中，点击 `Online Templates` 项左侧的展开三角形以展开它。


  **2.** 单击你想要的模板类别——例如 `Budgets`。中间窗格将显示可用的模板。


  **3.** 在中间窗格中，单击你想要的模板。右侧窗格会显示该模板的详细信息。


  **4.** 点击 `Choose` 按钮以下载模板并基于它创建工作簿。


  ##### 基于现有工作簿创建新工作簿


  如果设置得当，模板可以节省大量时间，但创建新工作簿的最简单方法通常是基于现有工作簿。为此，请按以下步骤操作：


  **1.** 选择 `File > Open` 以显示 `Open: Microsoft Excel` 对话框。


  **2.** 导航到现有工作簿，然后单击它。


  **3.** 点击 `Open` 弹出菜单，然后单击 `Copy`。


  **4.** 点击 `Open` 按钮。Excel 将关闭对话框并打开一个包含与现有工作簿相同内容的新工作簿。


  **5.** 选择 `File > Save` 以显示 `Save As` 对话框，然后像创建新工作簿时一样，将工作簿保存为你指定的名称。


  **说明：** 如果在 `Open: Microsoft Excel` 对话框的 `Open` 弹出菜单中未选择 `Copy`，则将打开原始工作簿。之后你可以使用
  `File > Save As` 命令将其保存为其他名称或存放到其他文件夹——但很容易因分心而忘记使用 `Save As`，从而错误地将更改保存到原始文件。


  ##### 保存工作簿


  若要首次保存工作簿，请通过任一常用方式给出 `Save` 命令——单击标准工具栏上的 `Save` 按钮、从菜单栏选择 `File > Save`，或按 `Cmd+S`。在
  `Save As` 对话框中，选择用于保存工作簿的文件夹，输入工作簿名称，然后单击 `Save` 按钮。


  保存工作簿时，Excel 会选择“兼容性偏好设置”窗格中设置的文件类型。如果你已选择了所需的格式（如第 2 章“选择保存工作簿的默认格式”部分所述），则一切准备就绪。如果你尚未选择其他格式，Excel
  将使用名为 `Excel Workbook` 的格式。该格式适用于 Excel 的四个最新版本——Excel 2011 和 Excel 2008 for Mac，以及
  Excel 2010 和 Excel 2007 for Windows——但可能会在更早的版本中引发问题。


  **提示：** 如果开始录制或编写宏以自动执行 Excel 中的工作，则需要使用可以包含宏的工作簿格式，因为 `Excel Workbook` 格式无法包含宏。如果工作簿用于
  Excel 2011、Excel 2010 for Windows 或 Excel 2007 for Windows，请使用 `Excel Macro-Enabled
  Workbook` 格式；如果工作簿用于 Excel 2004、Excel 2003 或更早版本，请使用 `Excel 97–2004` 格式。Excel 2008
  for Mac 无法运行宏。


  如果需要将工作簿保存为与默认格式不同的格式，请打开 `Format` 弹出菜单并单击要使用的格式。例如，如果您将与使用 Excel 2004 for Mac 或
  Excel 2003 for Windows 的用户共享工作簿，请选择 `Excel 97–2004 Workbook` 格式。


  **说明：** 最新的 Excel 文件格式（简称为 `Excel Workbook`）在技术上优于早期文件格式（`Excel 97–2004 Workbook`
  或 `Excel 97–2003 Workbook`）。使用 `Excel Workbook` 格式，你可以创建包含更多工作表的工作簿，且每个工作表可以拥有更多行和列。这种文件格式对数据损坏的抵抗能力也更强。但对于大多数商业用户和家庭用户创建的普通尺寸电子表格而言，早期文件格式也同样适用。


