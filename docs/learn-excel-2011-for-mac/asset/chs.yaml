  \ 的内置函数**\n\n**统计函数**\n\nExcel 包含许多统计函数，用于执行以下统计计算：\n\n- **偏差**：这些函数包括 `AVEDEV`、`STDEVA`、`STDEV`\
  \ 和 `STDEVP`。\n- **分布**：这些函数包括 `BETADIST`、`CHIDIST`、`BINOMDIST`、`EXPONDIST`、`KURT`、`POISSON`\
  \ 和 `WEIBULL`。\n- **变换**：这些函数包括 `FISHER` 和 `FISHERINV`。\n\n*许多统计函数过于专业，此处不再一一详述。表\
  \ 6–9 列出了用于更广泛的商务和研究目的的统计函数。如果您从事统计工作，请浏览公式构建器列表中的“统计”部分，查找您需要的其他函数。*\n\n**表 6–9.**\
  \ *Excel 最常用的统计函数*\n\n**统计函数** | **返回结果**\n---|---\n`AVERAGE` | 指定数值、单元格、区域或数组的平均值。例如，`=AVERAGE(1,2,3)`\
  \ 返回 2，`=AVERAGE(B1:B6)` 返回区域 B1:B6 的平均值。\n`MEDIAN` | 指定数字或单元格中的中位数（给定集合中间的数字）。例如，`=MEDIAN(1,2,2,3,4,4,6)`\
  \ 返回 3。\n`MODE` | 众数，即指定数值或单元格区域中出现频率最高的值。例如，`=MODE(1,1,2,2,2,3,3,4,18)` 返回 2。\n\
  `COUNT` | 指定区域中包含数字或在其参数列表中包含数字的单元格数量。例如，`=COUNT(C1:C8)` 返回范围 C1:C8 中包含数字或包含数值的单元格数量。\n\
  `COUNTBLANK` | 指定区域中空单元格的数量。例如，\n\n\n\n`=COUNTBLANK(C1:C8)` 返回区域 `C1:C8` 中空白单元格的数量。\n\
  \n**COUNTIF**\n\n返回指定区域中满足设定条件的单元格数量。例如，`=COUNTIF(C1:C10,\">2\")` 用于统计区域 `C1:C10`\
  \ 中数值大于 2 的单元格数量。\n\n**MAX**\n\n返回指定区域中的最大值。例如，`=MAX(C1:C6)` 返回区域 `C1:C6` 中的最大值。\n\
  \n**MIN**\n\n返回指定区域中的最小值。例如，`=MIN(C1:C6)` 返回区域 `C1:C6` 中的最小值。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**218**\n**第 6 章：使用 Excel 内置函数**\n\n**文本函数**\n\n当需要在工作表中处理文本时，请使用表 6-10 中解释的文本函数。例如，你可能需要仅返回文本字符串中的特定部分、在另一个字符串中查找某个字符串，或者更改文本的大小写。\n\
  \n**表 6-10.** *Excel 的文本函数*\n\n| **文本函数** | **返回结果** |\n| :--- | :--- |\n| BAHTTEXT\
  \ | 将数字转换为泰语文本并追加*泰铢*后缀。 |\n| CHAR | 返回指定字符代码所代表的字符。例如，`=CHAR(66)` 返回字母 B。通常情况下，直接输入所需字母即可，但在处理使用不同字符集创建的工作簿时，此函数会很有用。\
  \ |\n| CLEAN | 删除指定文本字符串中的所有非打印字符。例如，`=CLEAN(A1)` 会剔除单元格 A1 中文本字符串的所有非打印字符。在导入其他电子表格格式创建的文件时，此函数有时会派上用场。\
  \ |\n| CODE | 返回指定字符串中第一个字符的字符代码。例如，`=CODE(\"$\")` 返回 36，即美元符号的字符代码。 |\n| CONCATENATE\
  \ | 返回由指定文本字符串连接而成的文本字符串。例如，`=CONCATENATE(\"San Francisco \",\"Depot\")` 返回文本字符串“San\
  \ Francisco Depot。”请注意，必须包含所需的任何空格——否则 Excel 会将文本直接拼接在一起。除了使用此函数，你也可以直接使用连接运算符（&\
  \ 符号）。 |\n| DOLLAR | 将指定数字转换为货币格式的文本。例如，`=DOLLAR(9)` 返回 $9.00。 |\n| EXACT | 如果两个文本字符串完全相同（包括字符及大小写），则返回\
  \ TRUE；否则返回 FALSE。例如，`=EXACT(\"Oakland\",\"OAKLAND\")` 返回 FALSE，因为两个字符串的大小写不同。 |\n\
  | FIND | 返回一个文本字符串在另一个文本字符串中的起始位置。此函数区分大小写。例如，`=FIND(\"juve\",\"Bovine Rejuvenation\
  \ Ointment\")` 返回 10，因为字母 *j* 是第 10 个字符（包含空格）。 |\n| FIXED | 将指定数字舍入到指定小数位数，并可选择是否包含逗号。例如，`=FIXED(\"\
  10.8726\",2)` 返回 10.87。 |\n| LEFT | 返回文本字符串开头指定数量的字符。例如，`=LEFT(\"Product Ratings\"\
  ,7)` 返回“Product。” |\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 6\
  \ 章：使用 Excel 内置函数**\n**219**\n\n| **文本函数** | **返回结果** |\n| :--- | :--- |\n| LEN\
  \ | 返回指定文本字符串中的字符数（包括空格）。例如，`=LEN(\"Product Ratings\")` 返回 15。 |\n| LOWER | 将文本字符串转换为小写。例如，`=LOWER(\"\
  OAKLAND WAREHOUSE\")` 返回“oakland warehouse。” |\n| MID | 从指定文本字符串的给定起始位置之后，返回指定数量的字符。例如，`=MID(\"\
  Human Heart-Rate Monitor\",7,10)` 返回“Heart-Rate。” |\n| PROPER | 将文本字符串转换为“首字母大写”（每个单词的首字母大写，其余字母小写）。例如，`=PROPER(\"\
  OAKLAND WAREHOUSE\")` 返回“Oakland Warehouse。” |\n| REPLACE | 在指定位置用给定的替换字符串替换原文本字符串中的内容。例如，`=REPLACE(\"\
  Human Heart-Rate Monitor\",7,10,\"Pulse\")` 返回“Human Pulse Monitor。” |\n| REPT |\
  \ 将指定文本字符串重复指定次数。例如，`=REPT(\"IMPROVED! \",4)` 返回“IMPROVED! IMPROVED! IMPROVED! IMPROVED!”\
  \ |\n| RIGHT | |\n\n\n\n从指定文本字符串末尾开始计数的指定字符数。例如，`=RIGHT(\"Product Ratings\",7)`\
  \ 返回“Ratings”。\n\n`SEARCH`\n\n指定字符在指定字符串中的位置。例如，`=SEARCH(\"P\",\"Human Pulse Monitor\"\
  )` 返回 7，即字母 `P` 在字符串“Human Pulse Monitor”中的位置。\n\n`SUBSTITUTE`\n\n将指定文本字符串中的指定旧文本替换为指定新文本。例如，`=SUBSTITUTE(\"\
  Make the Most of Excel 2008\",\"Excel 2008\",\"Excel 2011\")` 将文本字符串“Make the Most\
  \ of Excel 2008”中的“Excel 2008”替换为“Excel 2011”。\n\n`T`\n\n返回文本值的文本字符串，或返回非文本值的双引号（空字符串）。例如，`=T(A19)`\
  \ 返回单元格 `A19` 内容的文本字符串或空字符串。通常您不需要使用 `T` 函数，因为 Excel 会自动根据需要将值转换为文本。\n\n`TEXT`\n\
  \n将指定值按所选格式转换后得到的文本字符串。例如，`=\"Results for \" &TEXT(\"4 August 2011\",\"mmmm yyyy\"\
  )` 返回“Results for August 2011”，这是因为函数中指定的格式所致。\n\n`TRIM`\n\n删除指定文本字符串开头和末尾的空格，并删除单词之间多余的空格，仅保留单词之间的一个空格。例如，`=TRIM(\"\
  \ 4512 Christy Blvd. \")` 会去除多余空格，返回“4512 Christy Blvd.”\n\n`UPPER`\n\n将文本字符串转换为大写。例如，`=UPPER(\"\
  don’t walk\")` 返回“DON'T WALK”。\n\n`VALUE`\n\n指定文本字符串中包含的值。例如，`=VALUE(\"5\")` 返回\
  \ 5。通常，您很少需要使用此函数，因为 Excel 会自动根据需要转换值。\n\n#### 根据需求选择正确的计算首选项\n\n如果您创建了复杂的工作表，可能需要更改\
  \ Excel 使用的计算设置——例如，从自动重算切换到手动重算，限制 Excel 执行的迭代次数，或将值从完全精度改为单元格中实际显示的小数位数。\n\n要更改计算设置，请按如下方式打开“计算”首选项窗格（见图\
  \ 6-8）：\n\n1. 选择 `Excel 偏好设置` 或按 `Cmd+,`（`Cmd` 键和逗号键）以显示“Excel 偏好设置”对话框。\n2. 在“公式与列表”区域中，单击\
  \ `计算` 图标。\n\n**警告：** 在“计算”首选项窗格中，“计算工作表”选项和“迭代”选项将影响您的所有工作簿，而不仅仅是活动工作簿。“工作簿选项”仅影响活动工作簿。\n\
  \n![图 6-8](img/index-224_1.png)\n\n**图 6-8.** *在“Excel 偏好设置”对话框的“计算”首选项窗格中，您可以选择何时计算工作表、限制迭代次数以及更改特定于工作簿的选项。*\n\
  \n##### 选择何时计算公式\n\n在 `计算工作表` 框中，首先通过选择相应的选项按钮来决定如何重新计算工作表：\n\n- **自动。** 选择此选项按钮，每当您更改值时，Excel\
  \ 都会重新计算所有依赖公式。这是默认设置，可确保工作表始终是最新的。除非您的工作表非常复杂且重新计算变得缓慢，否则请使用此设置。\n- **除模拟运算表外，自动重算。**\
  \ 选择此选项按钮，每次更改值时，除模拟运算表中的单元格外，所有依赖单元格都会重新计算。当模拟运算表自动重算变得过于缓慢时，请使用此设置。之后，您可以根据需要手动重新计算模拟运算表。\n\
  \n\n\n*手动。* 选择此选项按钮可彻底关闭自动重新计算。对于大型复杂的工作表（自动重算变得缓慢以至于影响操作时），请使用此设置。如果选择了`手动`选项按钮，请选中`保存工作簿前始终重新计算`复选框，这样\
  \ Excel 会在保存时重新计算每个工作簿。这样做的好处是确保保存的工作簿版本显示正确的值，下次打开工作簿时这一点尤为重要。缺点是保存工作簿所需时间会大大增加。\n\
  \n您可以通过单击“计算”偏好设置面板中“计算工作表”框内的`立即计算`按钮来强制重新计算整个工作簿，或单击`计算工作表`按钮强制重新计算当前工作表。但通常情况下，您会发现通过以下方式重新计算更为便捷：从功能区选择`公式`\
  \ > `计算` > `全部重新计算`（或按`Cmd+=`），或选择`公式` > `计算` > `重新计算工作表`。\n\n**提示：** 您可以通过从功能区选择`公式`\
  \ > `计算` > `手动计算`或`公式` > `计算` > `自动计算`，快速在自动重算和手动重算之间切换。若要从功能区打开“计算”偏好设置面板，请选择`公式`\
  \ > `计算` > `计算选项`。\n\n##### 控制计算迭代\n\n当 Excel 遇到循环引用时，它会在执行 100 次计算迭代后自动停止，或者当所有数值的变化小于\
  \ 0.001 时停止。这些设置适用于一般用途——尤其是当您的工作表不需要循环引用时（许多工作表都是如此）。如果您的工作表确实需要循环引用，可以通过调整“计算”偏好设置面板中“迭代”框内的设置来控制计算迭代。选中`限制迭代`复选框，然后根据需要调整`最大迭代次数`文本框和`最大误差`文本框中的值。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 6 章：使用 Excel 内置函数**\n\n\
  **223**\n\n##### 选择工作簿选项\n\n在“计算”偏好设置面板的“工作簿选项”框中，您可以选择三项仅影响当前工作簿的设置：\n\n*以显示精度为准。*\
  \ 如果您希望 Excel 更改工作簿单元格中的数值以匹配单元格中显示的值，请选中此复选框。Excel 使用 15 位数字存储数值，这称为完整精度。您可以设置单元格格式，使其仅显示所需的小数位数。例如，您可能需要查看具有两位小数的货币金额（如\
  \ `$110.28`），尽管 Excel 存储的数字还有更多位数（如 `110.2769821`）。如果选中`以显示精度为准`复选框，Excel 会将底层数值更改为与显示值一致——例如，将\
  \ `110.2769821` 更改为 `110.28`。\n\n**警告：** 仅当您非常确定需要更改值时，才选中`以显示精度为准`复选框——例如，当您执行需要将数值四舍五入或截断，然后使用该舍入或截断值而非底层数值的财务操作时。通常情况下，即使您将单元格格式设置为仅显示少量小数位（或不显示），也应保留底层精确值。\n\
