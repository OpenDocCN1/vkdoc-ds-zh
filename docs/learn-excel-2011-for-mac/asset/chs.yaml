- '# 设置创建工作簿和保存工作簿的偏好


  在 Excel 中，有一项操作几乎是必然会遇到的，那就是创建工作簿并保存。因此，花一两分钟时间，将 Excel 设置为按照你偏好的文件夹和工作簿格式来创建工作簿（并包含合适数量的工作表），是很值得的。你还需要选择保存工作簿的位置，以及决定是否在工作时保留自动备份。你也可以让
  Excel 提示你输入工作簿的属性信息，以便更轻松地识别它们。


  ##### 创建工作簿时指定所需的工作表数量


  当你创建一个新的工作簿时，Excel 默认只提供一个工作表。你可以通过点击`插入工作表`按钮来添加任意多个您需要的工作表，但如果你通常需要在每个工作簿中使用多个工作表，你可以让
  Excel 自动为你添加。


  要控制 Excel 为每个工作簿提供的工作表数量，请在`通用`偏好设置窗格中的`新工作簿包含的工作表数`框中设置该数字。


  ##### 选择用于打开和保存工作簿的默认文件夹


  接下来，设置保存工作簿的默认文件夹。这是 Excel 每次打开`打开`对话框时显示，以及在一次 Excel 会话中首次打开`另存为`对话框时显示的文件夹。（之后，如果你已经保存过一个工作簿，`另存为`对话框会显示该工作簿所在的文件夹。）


  要设置默认文件夹，请转到`通用`偏好设置窗格，点击`首选文件位置`框右侧的`选择`按钮。在打开的`选择一个文件夹：Microsoft Excel`对话框中，点击所需的文件夹，然后点击`选择`按钮。该文件夹名称便会出现在`首选文件位置`框中。


  ##### 选择保存工作簿的默认格式


  接下来，确保 Excel 已设置为以你偏好的格式保存工作簿。为此，请转到`兼容性`偏好设置窗格（参见图 2–5），打开`以此格式保存文件`弹出菜单，然后点击所需的格式。


  **图 2–5.** 在`兼容性`窗格中，选中`检查文档兼容性`复选框，以确保 Excel 在出现兼容性问题时向你发出警报。在`以此格式保存文件`弹出菜单中，选择你保存工作簿的默认格式。


  Excel 通常提供超过二十种格式，但你可能会将以下四种格式之一作为标准格式：


  - **`Excel 工作簿`**。这是 Excel 的默认格式。如果你将是这些工作簿的唯一使用者，或者你的同事使用的是 Office 2011、Office
  2008 for Mac、Office 2010 for Windows 或 Office 2007 for Windows，则使用此格式。使用 Office
  2004 for Mac 或 Office 2003 for Windows 的用户需要安装筛选器（文件转换器）才能打开这些工作簿。


  - **`Excel 启用宏的工作簿`**。如果你需要在工作簿中包含宏以执行自定义操作，请使用此格式。同样，你的同事需要拥有 Office 2011、Office
  2008、Office 2010、Office 2007，或者安装了筛选器的 Office 2004 或 Office 2003 才能打开这些工作簿。


  > **注意：** Office 2008 for Mac 不包含 VBA。因此，虽然你可以在`Excel 启用宏的工作簿`文件中包含宏，但 Excel 2008
  用户将无法运行它们。


  - **`Excel 二进制工作簿`**。如果你创建的是大型复杂工作簿并且需要提升性能，请使用此格式。同样，你的同事需要拥有 Office 2011、Office
  2008、Office 2010、Office 2007，或者安装了筛选器的 Office 2004 或 Office 2003 才能处理这些工作簿。


  - **`Excel 97–2003 工作簿`**。如果你的同事使用的是 Office 2004 for Mac、Office 2003 for Windows
  或更早版本的 Office，请使用此格式。你还可以使用此格式以获得与其他电子表格应用程序（例如较旧版本的 OpenOffice.org）更好的兼容性。




