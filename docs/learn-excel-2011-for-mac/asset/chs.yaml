  **276**


  **第 9 章：使用图片、SmartArt 等工具美化工作表**


  #### 插入剪贴画


  当你需要在工作簿中快速添加插图时，可以插入剪贴画。Office 提供了一套虽不算庞大但颇为实用的剪贴画，可供你在工作簿中使用。


  你也可以从微软网站的 Office 页面下载其他剪贴画。


  Excel 提供了两种插入剪贴画的工具：


  -   **剪贴画浏览器。** `剪贴画浏览器`是显示在`媒体浏览器`中的一个窗格。它展示了多种剪贴画。

  -   **剪贴画库应用程序。** `剪贴画库`是一个独立的应用程序，你可以用它来管理剪贴画并将其插入工作簿。


  `剪贴画库`提供的剪贴画选择比`剪贴画浏览器`窗格更丰富，但部分项目是相同的。`剪贴画库`还拥有更多功能来帮助你查找图片。


  我们先从`剪贴画浏览器`开始。


  ##### 使用剪贴画浏览器插入剪贴画


  当你需要剪贴画时，首先查看`剪贴画浏览器`中是否包含合适的图片。要打开`剪贴画浏览器`并插入项目，请按以下步骤操作：


  1.  从菜单栏选择`插入` > `剪贴画` > `剪贴画浏览器`，在`媒体浏览器`窗口中显示`剪贴画浏览器`窗格。图 9–1 展示了`剪贴画浏览器`窗格。


  **图 9–1.** *使用`媒体浏览器`中的`剪贴画浏览器`窗格在工作簿中插入剪贴画。你可以拖动右下角的调整大小手柄来调整`媒体浏览器`的大小。*


