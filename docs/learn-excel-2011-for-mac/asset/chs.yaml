  8+10i\")` 返回 `1.10742192402385+0.389151908999031i`。\n\n`IMLOG2`\n\n指定复数的以 2 为底的对数。例如，`=IMLOG2(\"\
  8+10i\")` 返回 `3.67877600230904+1.29273465968293i`。\n\n`IMPOWER`\n\n指定复数的指定次幂。例如，`=IMPOWER(\"\
  4+2i\",3)` 返回 `16+88i`。\n\n`IMPRODUCT`\n\n指定复数之积。例如，`=IMPRODUCT(\"3+4i\",\"2+3i\"\
  )` 返回 `-6+17i`。\n\n`IMREAL`\n\n指定复数的实部系数。例如，`=IMREAL(\"3+4i\")` 返回 `3`。\n\n`IMSIN`\n\
  \n指定复数的正弦值。例如，`=IMSIN(\"3+4i\")` 返回 `3.85373803791938-27.0168132580039i`。\n\n`IMSQRT`\n\
  \n指定复数的平方根。例如，`=IMSQRT(\"3+4i\")` 返回 `2+i`。\n\n`IMSUB`\n\n两个指定复数的差。例如，`=IMSUB(\"\
  3+4i\",\"4+5i\")` 返回 `-1-i`。\n\n`IMSUM`\n\n指定复数之和。例如，`=IMSUM(\"3+4i\",\"4+5i\")`\
  \ 返回 `7+9i`。\n\n`OCT2BIN`\n\n指定八进制数的二进制（以 2 为底）等效值，并可选择指定结果位数。例如，`=OCT2BIN(45,8)`\
  \ 返回 `00100101`。\n\n`OCT2DEC`\n\n指定八进制数的十进制（以 10 为底）等效值。例如，`=OCT2DEC(45)` 返回 `37`。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**202**\n\n**第 6 章：使用 Excel\
  \ 的内置函数**\n\n##### 工程函数\n\n**函数** | **返回内容**\n---|---\n`OCT2HEX` | 指定八进制数的十六进制（以\
  \ 16 为底）等效值。例如，`=OCT2HEX(45,8)` 返回 `00000025`。\n\n##### 财务函数\n\n表 6-4 向您介绍 Excel\
  \ 的财务函数，这些函数涵盖了大多数常见的财务计算以及各种更专业的计算。\n\n**表 6-4.** *Excel 的财务函数*\n\n**函数** | **返回内容**\n\
  ---|---\n`ACCRINT` | 定期支付利息的证券的应计利息。例如，`=ACCRINT(DATE(2010,8,1),DATE(2010,9,1),DATE(2010,8,15),10%,5000,4)`\
  \ 计算一张发行日为 2010 年 8 月 1 日、首次付息日为 2010 年 9 月 1 日、结算日为 2010 年 8 月 15 日、利率为 10%（我知道，做做梦吧）、面值为\
  \ $5000、每年付息四次（即每季度付息一次）的证券的应计利息。\n`ACCRINTM` | 到期一次性支付利息（而非定期支付）的证券的应计利息。例如，`=ACCRINTM(DATE(2011,1,15),DATE(2012,2,15),10%,10000)`\
  \ 计算一张发行日为 2011 年 1 月 15 日、到期日为 2012 年 2 月 15 日、利率为 10%、面值为 $10,000 的证券的应计利息。\n\
  `AMORDEGRC` | 每个会计期间资产的按比例线性折旧（法语会计系统）。例如，`=AMORDEGRC(5000,DATE(2010,12,3),DATE(2011,3,30),2000,2,12.5%)`\
  \ 计算于 2010 年 12 月 3 日以 $5000 购入的资产、首期结束日为 2011 年 3 月 30 日、残值 $2000、两个期间、折旧率 12.5%\
  \ 情况下的按比例线性折旧。\n`AMORLINC` | 每个会计期间资产的按比例线性折旧（法语会计系统）。例如，`=AMORLINC(4000,DATE(2010,12,3),DATE(2011,6,30),1500,1,18%)`\
  \ 计算于 2010 年 12 月 3 日以 $4000 购入的资产、首期（也是唯一一期）结束日为 2011 年 6 月 30 日、残值 $1500、折旧率 18%\
  \ 情况下的按比例线性折旧。\n`COUPDAYBS` | 从付息期开始到结算日的天数。例如，`=COUPDAYBS(DATE(2011,2,19),DATE(2013,2,19),4)`\
  \ 返回一张结算日为 2011 年 2 月 19 日、到期日为 2013 年 2 月 19 日、按季度付息的债券对应的天数。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**第 6 章：使用 Excel 的内置函数**\n\n**203**\n\n**函数** | **返回内容**\n\n\n\n### 函数\n\n**COUPDAYS**\
  \  \n包含结算日的付息期天数。例如，`=COUPDAYS(DATE(2011,3,1),DATE(2011,12,1),2)` 返回债券从付息期开始日到结算日的天数，该债券的结算日为\
  \ 2011 年 3 月 1 日，到期日为 2011 年 12 月 1 日，付息方式为半年付息。\n\n**COUPDAYSNC**  \n从结算日到下一个付息日的天数。例如，`=COUPDAYSNC(DATE(2011,7,4),DATE(2012,4,8),2)`\
  \ 计算债券的天数，该债券的结算日为 2011 年 7 月 4 日，到期日为 2012 年 4 月 8 日，付息方式为半年付息。\n\n**COUPNCD**\
  \  \n结算日之后的下一个付息日。例如，`=COUPNCD(DATE(2011,11,12), DATE(2012,12,13),4)` 返回债券在结算日（2011\
  \ 年 11 月 12 日）之后的下一个付息日，该债券的到期日为 2012 年 12 月 13 日，付息方式为季度付息。\n\n**COUPNUM**  \n\
  在结算日与到期日之间应付的付息次数。例如，`=COUPNUM(DATE(2011,1,5),DATE(2013,5,8),2)` 返回债券在结算日（2011 年\
  \ 1 月 5 日）与到期日（2013 年 5 月 8 日）之间应付的付息次数，该债券的付息方式为半年付息。\n\n**COUPPCD**  \n结算日之前的上一个付息日。例如，`=COUPPCD(DATE(2011,1,8),DATE(2014,1,8),4)`\
  \ 返回债券在结算日（2011 年 1 月 8 日）之前的上一付息日，该债券的到期日为 2014 年 1 月 8 日，付息方式为季度付息。\n\n**CUMIPMT**\
  \  \n在两个指定期间内累计支付的利息。例如，`=CUMIPMT(1%,60,10000,1,12,1)` 计算月利率为 1%（年利率为 12%），分 60\
  \ 期（五年）偿还，本金为 10,000 美元的贷款，在第 1 至第 12 期（第一年）内累计支付的利息。该计算假设还款发生在月初（最后一个参数为 1），而非月末（若为月末则用\
  \ 0 表示）。\n\n**CUMPRINC**  \n在两个指定期间内偿还的贷款累计本金。例如，`=CUMPRINC(0.5%,24,1500,1,6,0)`\
  \ 计算一笔 1500 美元的贷款，在 24 个月期限的前 6 个月内累计偿还的本金。该贷款月利率为 0.5%，还款发生在月末（最后一个参数为 0），而非月初（若为月初则用\
  \ 1 表示）。\n\n**DB**  \n采用固定余额递减法计算的折旧值。例如，`=DB(1000,250,6,2)` 计算一项资产的第二年折旧，该资产原值为\
  \ 1000 美元，残值为 250 美元，折旧年限为六年。\n\n---\n\n##### 财务函数\n\n**返回值** | **函数**\n--- | ---\n\
  **DDB** | 采用双倍余额递减法或其他方法计算的折旧值。例如，`=DDB(2000,500,8,4,2)` 计算一项资产的第四年折旧，该资产原值为 2000\
  \ 美元，残值为 500 美元，折旧年限为八年，采用双倍余额递减法（由末尾参数 2 表示）。\n**DISC** | 证券的贴现率。例如，`=DISC(DATE(2011,1,11),DATE(2012,2,20),96.5,100,3)`\
  \ 计算一种证券的贴现率，该证券的结算日为 2011 年 1 月 11 日，到期日为 2012 年 1 月 20 日，价格为每 100 美元面值 96.50 美元，赎回价格为每\
  \ 100 美元面值 100 美元，使用实际/365 天计数基准。\n**DOLLARDE** | 将分数表示的美元价格转换为十进制表示的美元价格。例如，`=DOLLARDE(1.08,32)`\
  \ 将 1 美元又 8/32 的价格转换为十进制表示，结果为 1.25。\n**DOLLARFR** | 将十进制表示的美元价格转换为分数表示的美元价格。例如，`=DOLLARFR(1.25,32)`\
  \ 将 1.25 美元转换为以 32 为分母的分数表示，结果为 1.08。\n**DURATION** | 定期支付利息的证券的年化久期。\n\n\n\n`=DURATION(DATE(2011,1,20),DATE(2012,6,12),7%,10%,2)`\
  \ 计算一只证券的年化久期，该证券的结算日为 2011 年 1 月 20 日，到期日为 2011 年 6 月 12 日，年票息率为 7%，年收益率为 10%。\n\
  \n### EFFECT\n有效年利率。例如，`=EFFECT(6%,4)` 计算的是 6%利率、每年复利 4 次的有效年利率。\n\n### FV\n一项投资的未来值。例如，`=FV(8%/12,60,-500)`\
  \ 计算的是每月投入 500 美元、持续 60 个月、年利率 8%（按月计息）的投资未来值。\n\n### FVSCHEDULE\n应用复利后的投资未来值。例如，`=FVSCHEDULE(100,{0.09,0.1,0.11,0.12})`\
  \ 计算的是 100 美元投资，第一年利率 9%、第二年 10%、第三年 11%、第四年 12%的未来值。\n\n### INTRATE\n完全归属证券的利率。例如，`=INTRATE(DATE(2011,1,20),DATE(2012,6,15),10000,11000)`\
  \ 返回的是面值 10000 美元、结算日 2011 年 1 月 20 日、到期日 2012 年 6 月 15 日、赎回价 11000 美元的证券利率。\n\n\
  [www.it-ebooks.info](http://www.it-ebooks.info/)\n\n**第 6 章：使用 Excel 内置函数**\n\n\
  **205**\n\n**财务函数**\n\n| **函数** | **返回内容**                               |\n|--------------|-----------------------------------------------|\n\
  | IPMT         | 投资在指定期间的利息支付额。例如，`=IPMT(4%/12,1,24,-1000)` 计算的是 24 个月期、价值 1000\
  \ 美元、年利率 4%（按月计息）的投资在第一个月的利息支付额。 |\n| IRR          | 现金流的内部收益率。例如，`=IRR({-50000,10000,12000,19000,28000})`\
  \ 计算的是初始投入 50000 美元，第一年收入 10000 美元，第二年 12000 美元，第三年 19000 美元，第四年 28000 美元项目的内部收益率。\
  \ |\n| ISPMT        | 投资在指定期间的已付利息。例如，`=ISPMT(7%/12,6,5*12,5000)` 计算的是五年期（5*12 个月）、本金\
  \ 5000 美元、年利率 7%（按月计息）的投资在第六个月的利息支付。 |\n| MDURATION    | 假设面值为 100 美元的证券的麦考利修正久期。例如，`=MDURATION(DATE(2011,2,18),\
  \ DATE(2014,2,28),7%,9%,2)` 计算的是结算日为 2011 年 2 月 18 日、到期日为 2014 年 2 月 28 日、年票息率 7%、年收益率\
  \ 9%、半年付息一次的证券的麦考利修正久期。 |\n| MIRR         | 现金流的修正内部收益率。例如，`=MIRR({-50000,10000,12000,19000,28000},3.5%,9%)`\
  \ 计算的是购入成本 50000 美元，第一年收入 10000 美元，第二年 12000 美元，第三年 19000 美元，第四年 28000 美元的业务的修正内部收益率。资金年借款利率为\
  \ 3.5%，现金流再投资收益率为 9%。 |\n| NOMINAL      | 年名义利率。例如，`=NOMINAL(4.6%,4)` 计算的是有效年利率为\
  \ 4.6%、每年复利 4 次时的年名义利率。 |\n| NPER         | 使用等额付款和固定利率的投资期数。例如，`=NPER(6.5%/12,-250,5000)`\
  \ 计算的是在年利率 6.5%（按月计息）条件下，每月偿还 250 美元还清 5000 美元贷款所需的期数。 |\n| NPV          | 一项投资的净现值。例如，`=NPV(8%/12,{500,750,1000})`\
  \ 计算的是第一期收入 500 美元、第二期 750 美元、第三期 1000 美元，使用年贴现率 8%（按月计息）的投资的净现值。 |\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**206**\n\n**第 6 章：使用 Excel 内置函数**\n\n**财务函数**\n\n| **函数** | **返回内容**        \
  \               |\n|--------------|-----------------------------------------------|\n\
  | ODDFPRICE    |                                               |\n\n\n\n##### 财务函数\n\
  \n## ODDFPRICE\n\n首期不完整的证券每 100 元面值的价格。例如，`=ODDFPRICE(DATE(2009,11,9),DATE(2016,4,1),DATE(2009,9,1),DATE(2010,2,1),0.08,0.065,100,2)`\
  \ 计算一只结算日为 2009 年 11 月 9 日、到期日为 2016 年 4 月 1 日、发行日为 2009 年 9 月 1 日、首次付息日为 2010 年\
  \ 2 月 1 日的证券，每 100 元面值的价格。该证券的利率为 8%，年收益率为 0.065，赎回值为每 100 元面值 100 元，每年付息 2 次。\n\
  \n## ODDFYIELD\n\n首期不完整的证券的收益率。例如，`=ODDFYIELD(DATE(2010,10,1),DATE(2021,3,1),DATE(2010,9,15),DATE(2011,3,1),6%,86,100,2,0)`\
  \ 计算一只结算日为 2010 年 10 月 1 日、到期日为 2021 年 3 月 1 日、发行日为 2010 年 9 月 15 日、首次付息日为 2011\
  \ 年 3 月 1 日的证券的收益率。该证券的利率为 6%，价格为 86 美元，赎回值为 100 美元。付息方式为每半年一次，计算基于美国 30/360 天计数基准。\n\
  \n## ODDLPRICE\n\n末期不完整的证券每 100 元面值的价格。例如，`=ODDLPRICE(DATE(2011,6,6),DATE(2012,8,4),DATE(2011,5,16),7%,7.25%,100,4,0)`\
  \ 计算一只结算日为 2011 年 6 月 6 日、到期日为 2012 年 8 月 4 日、最后一次付息日为 2011 年 5 月 16 日的证券，每 100\
  \ 元面值的价格。该证券的利率为 7%，年收益率为 7.25%，赎回值为 100 美元。付息频率为每季度一次，按 30/360 基准计算。\n\n## ODDLYIELD\n\
  \n末期不完整的证券的收益率。例如，`=ODDLYIELD(DATE(2011,7,11),DATE(2012,11,11),DATE(2011,5,4),4.25%,97.5,100,2)`\
  \ 计算一只结算日为 2011 年 7 月 11 日、到期日为 2011 年 11 月 11 日、最后一次付息日为 2011 年 5 月 4 日的证券的收益率。该证券的利率为\
  \ 4.25%，价格为 97.50 美元，赎回值为 100 美元，每年付息两次。\n\n## PMT\n\n基于固定利率及等额分期付款方式的贷款的每期付款额。例如，`=PMT(8%/12,36,-5000)`\
  \ 计算在 36 个月内以 8%的年利率每月分期偿还 5000 美元贷款所需的月还款额。\n\n## PPMT\n\n基于固定利率及等额分期付款方式，投资在某一给定期间内的本金偿还额。例如，`=PPMT(7.5%/12,1,24,-2000)`\
  \ 计算在 24 个月的计划中，以 7.5%年利率运行的 2000 美元投资第一个月的本金偿还额。\n\n## PRICE\n\n定期付息证券每 100 元面值的价格。例如，`=PRICE(DATE(2011,3,4),DATE(2012,6,5),6.5%,7.4%,100,4)`\
  \ 计算一只结算日为 2011 年 3 月 4 日、到期日为 2012 年 6 月 5 日的证券，每 100 元面值的价格。该证券的利率为 6.5%，收益率为\
  \ 7.4%，赎回值为 100 美元，付息频率为每季度一次。\n\n## PRICEDISC\n\n折价证券每 100 元面值的价格。例如，`=PRICEDISC(DATE(2011,8,4),DATE(2012,9,17),5%,100)`\
  \ 计算一只结算日为 2011 年 8 月 4 日、到期日为 2012 年 9 月 17 日的证券，每 100 元面值的价格。该证券的贴现率为 5%，赎回值为\
  \ 100 美元。\n\n## PRICEMAT\n\n到期付息证券每 100 元面值的价格。例如，`=PRICEMAT(DATE(2011,8,14),DATE(2013,5,5),DATE(2011,6,15),8.5%,8%)`\
  \ 计算一只结算日为 2011 年 8 月 14 日、到期日为 2013 年 5 月 5 日、发行日为 2011 年 6 月 15 日的证券，每 100 元面值的价格。该证券的利率为\
  \ 8.5%，年收益率为 8%。\n\n## PV\n\n投资的现值——即一系列未来付款当前所值的金额。\n\n\n\n`=PV(10%/12,36,-250)`\
  \ 计算的是在年利率 10%的条件下，每月支付 250 美元、共 36 个月的年金现值。\n\n### RATE\n投资的每期利率。例如，`=RATE(60,-380,14000)`\
  \ 计算的是每月支付 380 美元、共 60 个月，初始投资额为 14000 美元的月利率。\n\n### RECEIVED\n全额投资证券的到期价值。例如，`=RECEIVED(DATE(2011,7,17),DATE(2013,8,4),10000,4%)`\
  \ 计算的是交割日为 2011 年 7 月 17 日、到期日为 2013 年 8 月 4 日、面值 10000 美元、贴现率 4%的证券到期价值。\n\n###\
  \ SLN\n资产在一个周期内的直线折旧额。例如，`=SLN(3000,300,3)` 计算的是购买成本为 3000 美元、3 年后残值为 300 美元的资产每期折旧额。（没错，这是一台高端电脑。）\n\
  \n### SYD\n资产在指定周期内的年数总和法折旧额。例如，`=SYD(3000,300,3,1)` 显示的是上述价值 3000 美元的电脑（3 年后残值\
  \ 300 美元）在第一年的折旧金额。\n\n### TBILLEQ\n显示国库券债券等价收益率的百分比。例如，`=TBILLEQ(DATE(2011,12,1),DATE(2012,8,1),8.2%)`\
  \ 计算的是交割日为 2011 年 12 月 1 日、到期日为 2012 年 8 月 1 日、贴现率为 8.2%的国库券的债券等价收益率。到期日必须在交割日后一年以内（含一年）。\n\
  \n### TBILLPRICE\n每 100 美元面值的国库券价格。例如，`=TBILLPRICE(DATE(2011,9,10),DATE(2012,7,12),7.2%)`\
  \ 计算的是交割日为 2011 年 9 月 10 日、到期日为 2012 年 7 月 12 日、贴现率为 7.2%的国库券每 100 美元面值的价格。到期日必须在交割日后一年以内（含一年）。\n\
  \n### TBILLYIELD\n显示国库券收益率的百分比。例如，`=TBILLYIELD(DATE(2011,8,20),DATE(2012,8,19),94.25)`\
  \ 计算的是交割日为 2011 年 8 月 20 日、到期日为 2012 年 8 月 19 日、每 100 美元面值价格为 94.25 美元的国库券的收益率。\n\
  \n### VDB\n使用双倍余额递减法或可变余额递减法计算的资产折旧额。例如，`=VDB(8000,2000,10,2,3,3)` 计算的是初始成本为 8000\
  \ 美元、10 年后残值为 2000 美元的资产，在资产寿命的第 2 年至第 3 年期间、使用折旧因子为 3 时的折旧额。\n\n### XIRR\n针对具有非定期日期（而非固定日期）的现金流量表计算的内部收益率\
  \ (IRR)。例如，`=XIRR(E43:E46,F43:F46)` 计算的是范围 `E43:E46` 内的现金流量与范围 `F43:F46` 内对应日期的内部收益率。\n\
  \n### XNPV\n使用可变时间表（或定期时间表——但对于定期现金流，通常 NPV 是更优选择）的现金流量的净现值 (NPV)。例如，`=XNPV(10%,{1000,900},F43:F44)`\
  \ 计算的是现金流量 1000 美元和 900 美元及其在范围 `F43:F44` 中的对应日期，使用 10%贴现率的净现值。\n\n### YIELD\n具有定期利息支付的证券（如债券）的收益率。例如，`=YIELD(DATE(2011,8,10),DATE(2014,7,12),7.25%,94.75,100,4)`\
  \ 计算的是交割日为 2011 年 8 月 10 日、到期日为 2014 年 7 月 12 日、利率为 7.25%的证券的收益率。该证券价格为 94.75 美元，赎回价值为\
  \ 100 美元，付息频率为每季度一次。\n\n### YIELDDISC\n贴现证券的年收益率。例如，`=YIELDDISC(DATE(2011,3,15),DATE(2012,9,14),94.5,100)`\
  \ 计算的是交割日为 2011 年 3 月 15 日、到期日为 2012 年 9 月 14 日、价格为 94.50 美元、赎回价值为 100 美元的证券的年收益率。\n\
  \n### YIELDMAT\n\n\n\n到期付息证券的年收益率。例如，\n\n`=YIELDMAT(DATE(2011,5,10),DATE(2013,4,30),DATE(2011,3,31),8%,93.2)`\n\
  \n计算结算日为 2011 年 5 月 10 日、到期日为 2013 年 4 月 30 日、发行日为 2011 年 3 月 31 日、利率为 8%、每 100\
  \ 美元面值价格为 93.2 美元的证券的年收益率。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n### 第 6 章：使用 Excel 的内置函数\n\n**209**\n\n**注意：** 对于证券或投资，*发行日期*是卖方提供该工具的日期。*结算日期*是买方购买该金融工具息票的日期。*到期日期*是该工具到期且息票失效的日期。\n\
  \n##### 逻辑函数\n\n当您需要评估逻辑条件时，请使用 Excel 的逻辑函数，表 6-5 对其进行了说明。对于许多工作表，在使用逻辑函数确定情况后，您可能希望使用其他函数让\
  \ Excel 执行相应操作。\n\n**表 6-5.** *Excel 的逻辑函数*\n\n| 逻辑函数 | 返回值 |\n| :--- | :--- |\n\
  | AND | 如果所有指定的参数均为 TRUE，则返回 TRUE；否则返回 FALSE。例如，如果单元格 C1 包含文本\"Minneapolis\"且 D1\
  \ 包含值 2012，则 `=AND(C1=\"Minneapolis\",D1=2012)` 返回 TRUE。 |\n| FALSE | 返回 FALSE。您可以使用此函数生成\
  \ FALSE 值，例如用于测试。只需在需要提供 FALSE 值的单元格中输入 `=FALSE()`。 |\n| IF | 如果条件为 TRUE，则返回指定的第一个值；如果条件为\
  \ FALSE，则返回指定的第二个值。例如，`=IF(HOUR(NOW())<12,\"AM\",\"PM\")` 如果当前小时数小于 12，则显示\"AM\"\
  ，否则显示\"PM\"。 |\n| IFERROR | 如果表达式导致错误，则返回指定的错误值；否则返回表达式本身。例如，如果单元格 E4 包含错误，则 `=IFERROR(E4,\"\
  Enter a value in cell E3.\")` 会显示消息\"Enter a value in cell E3\"。 |\n| NOT | 从 TRUE\
  \ 值返回 FALSE，或从 FALSE 值返回 TRUE。例如，`=NOT(TRUE)` 返回 FALSE。 |\n| OR | 如果任何指定条件为 TRUE，则返回\
  \ TRUE；如果所有条件均为 FALSE，则返回 FALSE。例如，如果三个城市名称之一出现在单元格 F6 中，则 `=OR(F6=\"Minneapolis\"\
  ,F6=\"Little Rock\",F6=\"Sioux Falls\")` 返回 TRUE；否则返回 FALSE。 |\n| TRUE | 返回 TRUE。您可以使用此函数生成\
  \ TRUE 值，例如用于测试。只需在需要提供 TRUE 值的单元格中输入 `=TRUE()`。 |\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n**210**\n\n### 第 6 章：使用 Excel 的内置函数\n\n##### 信息函数\n\n当您需要返回有关特定单元格或区域的内容或格式的信息时，请使用表\
  \ 6-6 中说明的信息函数。\n\n**表 6-6.** *Excel 的信息函数*\n\n| 信息函数 | 返回值 |\n| :--- | :--- |\n\
  | CELL | 返回您指定区域中第一个单元格的内容、位置或格式的详细信息。您可以返回各种信息。例如，`=CELL(\"address\",Tax_Rate)`\
  \ 返回定义了名称 Tax_Rate 的单元格的地址。 |\n| ERROR.TYPE | 返回一个数字，表示单元格中包含的错误类型：1 代表 #NULL!，2\
  \ 代表 #DIV/0!，3 代表 #VALUE!，4 代表 #REF!，5 代表 #NAME?，6 代表 #NUM!，7 代表 #N/A。例如，如果单元格 F3\
  \ 包含除零错误，则 `=IF(ERROR.TYPE(F3)=2,\"Enter a number other than zero in cell F2.\"\
  )` 会在单元格 F3 中显示一条消息。 |\n| INFO | 返回有关 Excel、操作系统或计算机的信息。例如，如果 Excel 在 Mac 上运行，则\
  \ `=INFO(\"system\")` 返回\"mac\"；如果在 PC 上运行，则返回\"pcdos\"。`=INFO(\"release\")` 返回\
  \ Excel 的版本——例如，Excel 2011 返回 14.0。 |\n| ISBLANK | 如果单元格为空，则返回 TRUE；如果包含内容，则返回 FALSE。例如，如果单元格\
  \ A24 为空，则 `=ISBLANK(A24)` 返回 TRUE。 |\n| ISERR | 如果单元格包含除 #N/A 之外的任何错误，则返回 TRUE；否则返回\
  \ FALSE。例如，如果单元格 B3 包含除 #N/A 之外的任何错误，则 `=ISERR(B3)` 返回 TRUE。 |\n| ISERROR | |\n\n\
  \n\n##### 信息函数\n\n**函数** | **返回值说明**\n--- | ---\n`ISERROR` | 如果单元格包含任何错误（包括 `#N/A`），则返回\
  \ `TRUE`；否则返回 `FALSE`。例如，如果单元格 `B3` 包含任何错误，`ISERROR(B3)` 会返回 `TRUE`。\n`ISEVEN` |\
  \ 如果单元格包含偶数（忽略小数位数），则返回 `TRUE`；否则返回 `FALSE`。例如，`=ISEVEN(4.7)` 会返回 `TRUE`。\n`ISLOGICAL`\
  \ | 如果单元格包含逻辑值，则返回 `TRUE`；否则返回 `FALSE`。例如，如果单元格 `B10` 包含值 `TRUE` 或 `FALSE`，`=ISLOGICAL(B10)`\
  \ 会返回 `TRUE`。\n`ISNA` | 如果单元格包含 `#N/A`，则返回 `TRUE`；否则返回 `FALSE`。例如，如果单元格 `C8` 包含\
  \ `#N/A`，`=ISNA(C8)` 会返回 `TRUE`。\n`ISNONTEXT` | 如果单元格为空或包含除文本之外的任何内容，则返回 `TRUE`；如果单元格包含文本，则返回\
  \ `FALSE`。例如，如果单元格 `B1` 包含文本，`=ISNONTEXT(B1)` 会返回 `FALSE`。\n`ISNUMBER` | 如果单元格包含数字，则返回\
  \ `TRUE`；否则返回 `FALSE`。例如，如果单元格 `B1` 包含数字，`=ISNUMBER(B1)` 会返回 `TRUE`。\n`ISODD` |\
  \ 如果单元格包含奇数，则返回 `TRUE`；否则返回 `FALSE`。例如，如果单元格 `A14` 包含奇数，`=ISODD(A14)` 会返回 `TRUE`。\n\
  `ISREF` | 如果值是对单元格、区域或已定义名称的有效引用，则返回 `TRUE`；否则返回 `FALSE`。例如，如果工作簿包含一个名为 `Gross_Income`\
  \ 的区域，`=ISREF(\"Gross_Income\")` 会返回 `TRUE`。\n`ISTEXT` | 如果单元格包含文本，则返回 `TRUE`；否则返回\
  \ `FALSE`。例如，如果单元格 `A1` 包含文本，`ISTEXT(A1)` 会返回 `TRUE`。\n`N` | 根据指定值转换得到的数字。具体而言，数字返回其本身；日期返回对应的序列号；`TRUE`\
  \ 返回 `1`，`FALSE` 返回 `0`；错误值返回其错误值（详见本表前面 `ERROR.TYPE` 条目中的说明）；其他所有情况均返回 `0`。由于 Excel\
  \ 会自动转换值，因此你很少需要使用此函数；Excel 提供它主要是为了与其他电子表格应用程序兼容。\n`NA` | `#N/A`。你可以使用此函数在单元格中故意输入错误值。例如，在单元格\
  \ `A1` 中输入 `=NA()` 会使其显示错误值 `#N/A`。\n`TYPE` | 一个数字，表示单元格包含的数据类型：`1` 代表数字，`2` 代表文本，`4`\
  \ 代表逻辑值，`16` 代表错误值，`64` 代表数组。例如，如果单元格 `B2` 包含文本，`=TYPE(B2)` 会返回 `2`。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n### 第 6 章：使用 Excel 的内置函数\n\n##### 查找与引用函数\n\n为了从列表和表格（平面文件数据库）中返回信息，Excel 提供了表\
  \ 6-7 中说明的查找与引用函数。\n\n**表 6-7.** *Excel 的查找与引用函数*\n\n**查找与引用函数** | **返回值说明**\n---\
  \ | ---\n`ADDRESS` | 由行号和列号表示的单元格引用。\n`AREAS` | 引用中包含的不同区域数量。一个区域可以是单个单元格，也可以是连续的单元格区域（而非不连续的单元格区域）。\n\
  `CHOOSE` | 根据索引编号从一组值中指定的值。\n`COLUMN` | 所提供引用的列号。\n`COLUMNS` | 引用或数组中的列数。\n`GETPIVOTDATA`\
  \ | 数据透视表中的数据。\n`HLOOKUP` | 数据表中指定行的值。水平查找会匹配表顶行的字段，然后返回同一列中更靠下指定行的值。\n`HYPERLINK`\
  \ | 包含一个超链接。\n`INDEX` | 表格中的某个值，或对某个值的引用。\n`INDIRECT` | 由单元格中文本字符串指定的引用。你可以使用 `INDIRECT`\
  \ 更改单元格中的引用，而无需更改公式。\n`LOOKUP` | 来自单列、单行区域或数组中的值。\n`MATCH` | 数组中匹配项的位置（而非该项的内容）。\n\
  `OFFSET` | 相对于指定单元格或区域偏移指定行数和列数后的区域引用。\n`ROW` | 指定引用的行号。\n`ROWS` | 指定引用或数组中的行数。\n\
  `TRANSPOSE` |\n\n\n\n从垂直范围转置为水平范围（或反之）的单元格。必须将 `TRANSPOSE` 用作数组公式。\n\n`VLOOKUP`\
  \  \n数据表中指定列的值。垂直查找将匹配表第一列中的字段，然后返回同一行中更远的指定列的值。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n### 第 6 章：使用 Excel 的内置函数\n\n**213**\n\n##### 数学与三角函数\n\n表 6–8 解释了 Excel 提供的数学与三角函数，仅对不太直观的函数给出了示例。\n\
