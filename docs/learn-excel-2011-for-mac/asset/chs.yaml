  \ 2011 或 Excel 2010 (Windows) 开发工作表，请使用这些版本支持的较新函数——例如，使用新的`POISSON.DIST()`函数而不是旧的`POISSON()`函数。\n\
  \n**5.** 要了解有关某个函数的更多信息，请单击它。公式生成器会在窗口底部显示其详细信息，如左侧的图 6–5 所示。\n\n在这里，您可以单击“此功能的更多帮助”链接，打开一个帮助窗口，其中显示有关该函数及其参数的详细信息。\n\
  \n**图 6–5。** *使用公式生成器底部的“说明”区域来识别您需要的函数（左侧）。*\n\n*当您双击该函数以插入它时，公式生成器会显示“参数”窗格（右侧）。*\n\
