  ##### 更改活动单元格


  在 Excel 中，你通常一次只在一个单元格中工作。该单元格被称为*活动单元格*，它接收来自键盘的输入。


  你可以使用鼠标或键盘轻松移动活动单元格：


  *鼠标。* 单击你想要激活的单元格。


  *键盘。* 按箭头键一次将活动单元格向上或向下移动一行，或向左或向右移动一列。你还可以使用表 1-1 中显示的键盘快捷键来将活动单元格移动得更远。


  **提示：** 如果你的 Mac 键盘没有 `Home` 键、`End` 键、`Page Up` 键和 `Page Down` 键，你将需要使用功能键快捷键。按
  `Fn+left arrow` 作为 `Home`，`Fn+right arrow` 作为 `End`，`Fn+up arrow` 作为 `PageUp`，`Fn+down
  arrow` 作为 `PageDown`。根据需要使用这些键配合表 1-1 中的键盘快捷键——例如，按 `Cmd+Fn+left arrow` 移动到活动工作表中的第一个单元格。


