  \ 10008 | 0 |\n| 9 | Sagar | 82910 | 10009 | 0 |\n| 10 | Arjun | 92901 | 10010 |\
  \ 0 |\n| 11 | Tarun | 489503 | 10098 | 0 |\n\n### 商业 ETL 工具\n\n虽然大多数第三方商业 ETL 工具的基本原理仍如上所述，但具体实现可能有所不同。例如，`Informatica\
  \ PowerCenter` 将元数据存储在 Oracle 数据库仓库中，而 `Talend` 则生成 Java 代码来执行任务。另一方面，`Pentaho`\
  \ 提供了一个用户友好的界面。\n\n由于数据湖是一个新的机遇，数据集成软件供应商已经开始用以 Hadoop 为核心的能力来补充他们的 ETL 产品。现代 ETL\
  \ 工具更加灵活、与平台无关，并且能够通过可重用的代码生成实现优化的数据提取，等等。\n\n2017 年 Gartner 魔力象限（图 2-8）比较了数据集成工具，并将\
  \ Informatica 定位为领导者。\n\n![A454145_1_En_2_Fig8_HTML.jpg](img/A454145_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8：Gartner 商业数据集成产品魔力象限。[`https://www.informatica.com/in/data-integration-magic-quadrant.html`](https://www.informatica.com/in/data-integration-magic-quadrant.html)\n\
  \n\n\n## 实时数据摄取\n\n就数据完整性检查而言，批量数据摄取技术是万无一失的。然而，由于存在延迟，它无法描绘业务的实时状况。为了提高分析框架的业务就绪性，在业务交易发生时立即进行处理是明智之举。在（准）实时处理中，变更可以以极低的延迟或实时方式被捕获。基于日志的实时处理操作被称为变更数据捕获。\n\
  \n`Change data capture`（变更数据捕获）指的是通过日志挖掘过程，仅从数据源事务日志中捕获已变更的数据（插入、更新、删除）。实时或微批处理`CDC`通过扫描数据库日志来检测发生时的变更事件。由于对企业资源的访问需求极低，`CDC`不会对源表产生任何负载；从而最大限度地减少延迟，并确保源系统和目标系统之间的一致性。\n\
  \n那么，为何要使用`CDC`？正如我们在上一节中讨论的，传统的 ETL 工具使用`SQL`来提取和批量处理增量数据。由于源数据库体量的持续增长及其并发工作负载，查询性能可能会受到影响。此外，查询本身也会在源系统上产生一部分工作负载。\n\
  \n图 2-9 展示了源系统和目标系统之间的变更数据捕获工作流。\n\n![A454145_1_En_2_Fig9_HTML.jpg](img/A454145_1_En_2_Fig9_HTML.jpg)\n\
  \n图 2-9\n\n变更数据捕获工作流\n\n作为商业智能和数据合规计划的一部分，`CDC`通过提供主数据管理能力并支持更快速的数据质量检查，有助于符合“数据即服务”原则。\n\
  \n总结要点，`CDC`摄取管道有助于：\n\n*   消除在源系统上运行`SQL`查询的需求。对事务性源系统不产生任何负载开销。\n*   实现源和目标之间的准实时复制\n\
  *   日志挖掘有助于捕获诸如截断操作等细粒度数据操作\n\n### CDC 设计考量\n\n为了设计`CDC`摄取管道，必须为源数据库启用日志记录功能。所有关系型数据库都通过将变更持久化到日志中来遵循前滚方法。每个事件都会在日志中持久化记录一个变更\
  \ ID（或系统变更号），并且永远不会被清除。Oracle 数据库允许在表级别启用补充日志记录。类似地，SQL Server 允许在数据库级别启用日志记录。如果不进行日志记录，就无法挖掘事务日志来捕获变更。\n\
  \n源数据库中的表必须具有用于复制的主键。这有助于捕获作业在已变更的数据集中建立记录的唯一性。源端主键确保变更被应用到目标端的正确记录上。如果源表没有定义主键，`CDC`作业可以指定一个复合主键来唯一标识变更表中的记录。\n\
  \n基于唯一约束来建立唯一性将是一个糟糕的设计，因为它允许列中存在多个`NULL`值。在应用阶段，具有空标识的变更记录将无法在目标端匹配到对应的空记录。\n\n\
  **基于触发器的 CDC** – 设置变更数据捕获的另一种方法是通过表级触发器。触发器有助于在单独的表中同步捕获行级变更，然后这些变更会被复制到目标端。可以捕获整条记录，也可以仅捕获变更的属性以及主键。这种方法的缺点是，在原始事务被视为完成之前，会引入额外一个事务的开销。\n\
  \n这种方法通常适用于两种场景：\n\n*   源数据库未启用日志记录\n*   由于事务日志采用二进制格式，读取它们是一项繁琐的任务\n*   由于软件限制或保留时间过短，无法扫描事务日志\n\
  \n那么，是否应该总是优先选择`CDC`而非批量摄取呢？并非如此。只有在业务有需求时，才应设置实时集成或`CDC`。这是一个需要基于多种因素（如业务的服务级别协议、变更量大小以及目标系统的就绪状态）来综合考虑的功能。\n\
  \n### CDC 管道示例：Databus，LinkedIn 的开源解决方案\n\n`Databus`是一个实时的变更数据捕获系统，由 LinkedIn 于\
  \ 2006 年开发。2013 年，LinkedIn 发布了`Databus`的开源版本。自开发以来，`Databus`一直是 LinkedIn 数据处理框架的重要组成部分。`Databus`提供实时数据复制机制，能够处理高吞吐量和毫秒级延迟。`Databus`的源代码可在其\
  \ Git 仓库中获取，地址为[`https://github.com/linkedin/databus`](https://github.com/linkedin/databus)。\n\
  \n`Databus`是一个源无关的框架，可以无缝扩展到多个消费者，同时事务性源端保持正常运行。其源代码包含了针对不同关系型源（如 Oracle 和 MySQL）的适配器。图\
  \ 2-10 展示了`Databus`的工作组件。\n\n![A454145_1_En_2_Fig10_HTML.jpg](img/A454145_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10\n\n`Databus`组件图。来源：[`https://engineering.linkedin.com/data-replication/open-sourcing-databus-linkedins-low-latency-change-data-capture-system`](https://engineering.linkedin.com/data-replication/open-sourcing-databus-linkedins-low-latency-change-data-capture-system)\n\
  \n`Databus`由三个最重要的部分组成——中继器、引导程序和客户端库。宏观来看，以下列表概述了`Databus`工作流的步骤。\n\n*   中继器负责从源端拉取最近已提交的事务\n\
  \    *   中继器通过 tungsten replicator 实现\n*   中继器以压缩格式将变更存储在日志或缓存中\n*   消费者从中继器拉取变更\n\
  *   引导程序组件 – 临时实例上数据源的快照。它与中继器捕获的变更保持一致。（参见图 2-11）\n    *   如果某个消费者落后并且无法在中继器中找到变更，引导程序组件会将变更转换并打包发送给该消费者\n\
  \    *   一个新增的消费者可以在客户端库的帮助下，应用引导程序组件中截止到某个时间点的所有变更。然后客户端库会将该消费者指向中继器，以继续拉取最新的变更\n\
  \n    ![A454145_1_En_2_Fig11_HTML.png](img/A454145_1_En_2_Fig11_HTML.png)\n\n  \
  \  图 2-11\n\n    `Databus`中的引导程序组件\n\n图 2-12 分项列出了 LinkedIn `Databus`解决方案的优势。\n\n\
  ![A454145_1_En_2_Fig12_HTML.png](img/A454145_1_En_2_Fig12_HTML.png)\n\n图 2-12\n\n\
  LinkedIn `Databus`的差异化特性\n\n## Apache Sqoop\n\n`Sqoop`或“SQL 到 Hadoop”一直是解决 Hadoop\
  \ 数据整合需求的顶级 Apache 项目之一。它是 HDFS 层的一个原生组件，支持 Hadoop 分布式文件系统之间双向的“批量”数据流。用户不仅可以实现关系型数据库和\
  \ Hadoop 之间的数据自动传输，反向操作还能使企业数据仓库通过来自数据湖的 MapReduce 结果数据来增强其消费层。\n\nApache `Sqoop`有两个版本——`sqoop\
  \ 1`和`sqoop 2`。\n\n\n\n### Sqoop 1\n\n`Sqoop`的第一个版本于 2009 年问世。2011 年 8 月，该项目移至 Apache\
  \ 旗下，并迅速成为最受欢迎的数据摄取工具之一。  \n连接器是`Sqoop 1`运行的核心驱动力。基于 JDBC 的不同源系统连接器负责获取源对象的元数据和进行数据传输。下面列出`Sqoop`的主要特点：\n\
  \n- 基于 Java 的实用工具（`Sqoop2`中提供 Web 界面），可从`MapReduce`引擎生成 Map 作业，将数据存储到`HDFS`中\n-\
  \ 支持全量提取和增量导入模式\n- 在`HDFS`集群上运行，并可填充`Hive`、`HBase`中的表\n- 可在`NoSQL`和`HDFS`之间建立数据集成层\n\
  - 可与`Oozie`集成，用于调度导入/导出任务\n- 支持与多种关系型数据库的连接器，例如`Oracle`、`SQL Server`、`MySQL`\n\n\
  ### Sqoop 2\n\n`Sqoop2`是`Sqoop`的后续版本，主要关注优化数据传输、简化扩展框架的使用以及确保安全性。`Sqoop2`采用客户端-服务器架构（基于服务的模型），其中服务器作为两个关键组件（连接器和作业）的主机。\n\
  \n`Sqoop2`的特性如下：\n\n- `Sqoop 2`可以作为任意系统之间的通用数据传输服务。\n- `Sqoop 2`附带 Web 界面，交互性更好。命令行工具仍然有效。`Sqoop\
  \ 2` Web 界面使用运行在`Sqoop`服务器上的 REST 服务。这有助于轻松与`Oozie`和其他框架集成。\n- `Sqoop 2`在数据传输活动中同时使用\
  \ Mapper 和 Reducer 作业。Mapper 作业提取数据，而 Reducer 操作转换数据并将其加载到目标中。\n- 连接器将在`Sqoop 2`服务器上设置，这需要提供源和目标系统的连接详情。对连接对象基于角色的访问可以降低对源和目标系统进行未授权访问的风险。\n\
  - 元数据仓库存储连接和作业。连接器在`Sqoop`服务器上注册元数据，以允许连接到源并创建作业。\n- 连接器包括分区 API（创建分片并启用并行）、提取 API（Mapper）和加载\
  \ API（Reducer）\n\n图 2-13 从`Sqoop`处理层的组件角度区分了`Sqoop1`和`Sqoop2`。\n\n![A454145_1_En_2_Fig13_HTML.png](img/A454145_1_En_2_Fig13_HTML.png)\n\
  \n图 2-13  \n`Sqoop 1` 与 `Sqoop2`\n\n### Sqoop 是如何工作的？\n\n`Sqoop`采用一种相当简单的方法从关系型数据库中提取数据。简而言之，它会构建一个在源端运行的\
  \ SQL 查询来捕获源数据，随后这些数据被摄取到 Hadoop 中。让我们看看`Sqoop`的内部机制。\n\n`Sqoop`利用 Hadoop 中`MapReduce`处理层的\
  \ Mapper 作业，将数据提取并摄取到`HDFS`中。默认情况下，一个`Sqoop`作业有四个 Mapper；不过这个数量是可配置的。每个 Mapper 都会收到一个从源系统提取数据的查询。Mapper\
  \ 的查询是根据拆分规则构建的。根据拆分规则，`--split-by`列的值必须均匀分配给每个 Mapper。这意味着`--split-by`列应该是一个主键。主键的整个范围会被均等切分给各个\
  \ Mapper。一旦 Mapper 作业捕获到源数据，它要么被转储到`HDFS`存储中，要么被加载到 Hive 表中。\n\n图 2-14 演示了主键拆分机制。\n\
  \n![A454145_1_En_2_Fig14_HTML.png](img/A454145_1_En_2_Fig14_HTML.png)\n\n图 2-14\
  \  \n`Sqoop` 拆分机制\n\n### Sqoop 设计考虑因素\n\n以下是能帮助有效设计`Sqoop`任务的关键因素。\n\n1.  在`--num-mappers\
  \ [n]`参数中指定 Mapper 的数量  \n2.  Mapper 的数量  \n    1.  注意，Mapper 在 Hadoop 内是并行运行的，就像并行查询一样\
  \  \n    2.  Mapper 数量过多可能会增加源数据库的负载。应根据表的大小和源数据库的工作负载来做决策  \n    3.  取决于：  \n \
  \       - 源数据库处理并发查询的能力  \n        - 因表、拆分配置和运行时间而异  \n3.  如果源表无法按列进行拆分，请使用`--autoreset-to-one-mapper`参数，通过单个\
  \ Mapper 执行非拆分的全量提取  \n4.  如果源表的所有列都是字符类型，无论是否有定义主键，我们可以采用以下方法：  \n    - 添加代理键作为主键并用于拆分\
  \  \n    - 创建手动数据分区，并为每个分区运行一个 Mapper 的多个`Sqoop`作业。这可能导致数据倾斜，并且作业的运行时长会因每个分片的数据量而参差不齐\
  \  \n    - 如果字符型键列满足以下条件，则可照常将其用作`--split-by`列：  \n      - 具有唯一值（或分区键，如位置、性别）  \n\
  \      - 具有可以隐式类型转换为整数的值  \n5.  稀疏的`--split-by`列  \n    1.  使用`--boundary-query`来创建分片\
  \  \n    2.  其工作原理类似于从另一个查找表中检索分片大小  \n    3.  对于文本属性，设置：  \n\n    ```\n    -Dorg.apache.sqoop.splitter.allow_text_splitter=true\n\
  \    ```\n\n6.  导出数据子集  \n    1.  如果只需要源表中的部分列，请在`--columns`参数中指定列列表。  \n      \
  \  - 例如，`--columns \"orderId, product, sales\"`  \n    2.  如果只需要“sqooped”有限的行数，请使用`--where`子句并附上谓词条件。\
  \  \n        - 例如，`--where \"sales > 1000\"`  \n    3.  如果需要导入结构化查询的结果，请使用`--query`子句。\
  \  \n        - 例如，`--query 'select orderId, product, sales from orders where sales>1000'`\
  \  \n7.  推荐使用`--hive-import`将数据暂存到 Hive 表中  \n    1.  如果表已存在，数据会被追加。可以使用`--hive-overwrite`参数覆盖数据，表示对表进行全量刷新\
  \  \n    2.  如果表不存在，则会连同数据一起创建  \n    3.  使用`--hive-partition-key`和`--hive-partition-value`属性，根据导入数据中的某个列键创建分区\
  \  \n    4.  默认情况下，数据加载是追加性质的。数据加载方式也可以通过增量方式进行...  \n    5.  分隔符可以通过以下任一方式处理： \
  \ \n        - 指定`--hive-drop-import-delims`在导入过程中删除分隔符  \n        - 指定`--hive-delims-replacement`用替代字符替换分隔符\
  \  \n8.  连接性 – 确保从`Sqoop`节点到源数据库的连接  \n    1.  在源端创建并维护一个具有所需访问权限的专用用户  \n9.  始终使用`[schema].[table\
  \ name]`的格式为表名加上模式名前缀  \n    1.  以大写形式提供表名  \n10. 连接器 – 通用（JDBC）和直接（特定于源）  \n  \
  \  1.  直接连接器性能更好  \n    2.  对于`MySQL`、`PostgreSQL`和`Oracle`，使用`--direct`模式参数  \n\
  11. 在导出期间使用`--batch`参数来批量插入语句  \n    1.  使用 JDBC 批量 API  \n    2.  数据库的原生属性（如锁定、查询大小）同样适用\
  \  \n    3.  `Sqoop.export.records.per.statement (10)` – 将多行数据合并到一条 INSERT 语句中 \
  \ \n    4.  `Sqoop.export.statements.per.transaction (10)` – 每个事务中的插入数量  \n12. 保护`Sqoop`作业的方法\
  \  \n    1.  为确保安全的数据传输，请使用`useSSL=true`和`requireSSL`标志  \n    2.  启用 Kerberos 认证\
  \  \n13. 你甚至可以创建一个`Sqoop Spark`作业来提升`Sqoop`作业的性能  \n    1.  随着分片数量的增加，`MapReduce`引擎可能会变慢\
  \  \n    2.  连接器无需更改。支持可插拔的处理引擎  \n    3.  Spark 作业执行：  \n        - 数据分片被转换为弹性分布式数据集（RDD）\
  \  \n        - Extract API 读取记录，而 Load API 写入数据\n\n\n\n## 原生数据摄取工具\n\n自从 Hadoop\
  \ 生态系统进入成熟阶段以来，该技术栈为实施者和从业者提供了极大的灵活性。大数据生态系统本身由多个可插拔组件组成，这反过来又为探索和发现开辟了广阔的空间。数据摄取模式已从紧密耦合的实用工具演变为标准和通用的框架。\n\
  \n许多计划向数据湖迁移的数据库软件供应商，都开发了自有的实用工具来促进其自身数据向 Hadoop 的传输。这些原生工具与通用工具的区别在于，它们在数据放置策略方面拥有深厚的专业知识，并且能够充分利用数据库架构的优势。在本节中，我们将介绍\
  \ Oracle 数据库和 Greenplum 提供的用于将数据加载到 HDFS 中的实用工具。\n\n### Oracle `copyToBDA`\n\n“复制到\
  \ BDA”实用工具通过将 Oracle 数据库表的数据以 Data Pump 格式导出并复制到 HDFS 中来帮助将其加载到 Hadoop。该工具执行将数据完全提取并加载到\
  \ Hadoop 的操作。如果源端数据发生变化，则必须重新运行该工具以刷新数据泵文件。一旦数据泵文件在 Hadoop 中可用，就可以通过 Hive 查询访问数据。\n\
  \n请注意，该工具适用于由 Oracle Exadata 和 Oracle Big Data Appliance 组成的 Oracle 大数据堆栈，最好通过 Infiniband\
  \ 网络连接。它根据 Oracle Big Data SQL 进行许可。\n\n在底层，该工具使用 `ORACLE_DATAPUMP` 访问驱动和 Exadata\
  \ 上的 Hadoop 客户端来传输数据。图 2-15 展示了 `CopyToBDA` 实用工具的工作流程。\n\n![A454145_1_En_2_Fig15_HTML.png](img/A454145_1_En_2_Fig15_HTML.png)\n\
  \n图 2-15\n\n`CopyToBDA` 实用工具工作流程\n\n附加说明 –\n\n1. “复制到 BDA”工具适用于数据变化频率不高的静态表。原因在于它不允许源数据和目标之间进行持续刷新。\n\
  2. 如果表很大，数据可以导出到多个 `.dmp` 文件中。\n3. 为了让 Hive 外部表访问导出文件并准备结果集，需要指定适当的 SerDe、InputFormat\
  \ 和 OutputFormat。\n    1. `SERDE 'oracle.Hadoop.hive.datapump.DPSerDe'`\n    2.\
  \ `INPUTFORMAT 'oracle.Hadoop.hive.datapump.DPInputFormat'`\n    3. `OUTPUTFORMAT\
  \ 'org.apache.Hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat'`\n\n### Greenplum\
  \ `gphdfs` 实用工具\n\nGreenplum 提供了 `gphdfs` 协议，用于在 Greenplum 和 Hadoop 集群之间进行批量数据传输操作。当\
  \ Greenplum 作为源端时，该工具已成为数据移动的事实标准机制，因为它充分利用了数据库的 MPP（大规模并行处理）能力。在目标端，它可以与多种 Hadoop\
  \ 发行版配合使用，例如 Cloudera、Hortonworks、MapR、Pivotal HD 和 Greenplum HD。\n\n`gphdfs` 工具必须安装在\
  \ Greenplum 集群的所有段节点上。在数据传输操作期间，所有段节点并发地将本地数据分片副本推送到 Hadoop 集群。Greenplum 集群中的段节点数量决定了数据传输的并行度。数据在段上的分布情况对于确定段级进程的工作量起着关键作用。如果表在集群上分布不均匀，`gphdfs`\
  \ 进程将具有不规则的切片大小，这将影响数据摄取过程的性能。\n\n该工具必须安装在每个段节点上。安装步骤如下：\n\n1. 使用以下命令创建仓库文件\n\n\
  \    ```\n    wget -nv http://public-repo-1.hortonworks.com/HDP/centos7/2.x/updates/2.6.1.0/hdp.repo\n\
  \    ```\n\n2. 使用 YUM 安装库\n\n    ```\n    yum install Hadoop Hadoop-hdfs Hadoop-libhdfs\
  \ Hadoop-yarn Hadoop-mapreduce Hadoop-client openssl -y\n    ```\n\n3. 设置 Hadoop\
  \ 配置参数\n    1. `gpconfig -c gp_Hadoop_home -v \" '/usr/hdp/2.6.1.0-129'\"`\n   \
  \ 2. `gpconfig -c gp_Hadoop_target_version -v \"'hdp2'\"`\n    3. 设置 Java 主目录和 Hadoop\
  \ 主目录\n\n图 2-16 展示了 `gphdfs` 实用工具的示意图。\n\n![A454145_1_En_2_Fig16_HTML.png](img/A454145_1_En_2_Fig16_HTML.png)\n\
  \n图 2-16\n\n`GPHDFS` 工具的工作原理\n\n#### 设计考量\n\n1. **JVM 和 `gphdfs`** – `gphdfs` 协议在每个段主机上使用\
  \ JVM 来访问 HDFS 并写入数据。当在段主机上创建可写外部表并通过 `gphdfs` 访问时，每个段实例会使用 1GB 内存初始化 JVM 进程。如果同时读写多个表时工作负载很高，则可能出现\
  \ JVM 堆内存问题。您可以将 `$GPHOME/lib/Hadoop/Hadoop_env.sh` 中 `GP_JAVA_OPT` 参数的值从 1GB 降低到\
  \ 500MB。\n2. **Kerberos 和 `gphdfs`** – `gphdfs` 协议支持针对 Hadoop 集群的 Kerberos 认证。Kerberos\
  \ 认证详情需要更新到以下文件中 –\n    * `Yarn-site.xml`\n    * `Core-site.xml`\n    * `Hdfs-site.xml`\n\
  \   另外，`/etc/krb5.conf` 必须存在于 Greenplum 集群中。如果在访问 HDFS 时遇到 GSSAPI 错误，请在 Greenplum\
  \ 节点上安装 Java 加密扩展（JCE）（位于 `$JAVA_HOME/jre/lib/security`）。\n3. **通过 ETL 触发 `gphdfs`**\
  \ – `gphdfs` 工具可以嵌入到 Python 脚本中，并通过标准的摄取工具（如 Informatica、Talend、Appworx 等）触发。\n\
  4. 可写外部表的 `LOCATION` 参数必须包含 Hadoop 集群名称或 HDFS 名称节点的主机名和端口详情。\n5. **压缩支持** – 在可写外部表中使用\
  \ `compress` 和 `compression_type` 参数，以压缩格式将数据加载到 HDFS 中。\n6. 可以使用 Python 或任何其他脚本语言构建自定义加载框架来加载表组（按模式或类别批量加载表）。\n\
  \n### 使用 `gpfdist` 从 Greenplum 传输数据到 HDFS\n\n除了 `gphdfs`，还可以使用 Greenplum 实用工具 `gpfdist`\
  \ 将数据从 Greenplum 传输到 HDFS。\n\n`gpfdist` 实用工具在 Greenplum 数据库中提供并行文件操作。它可以用于通过边缘节点将数据从\
  \ Greenplum 段节点移动到 Hadoop 集群。您可以使用以下脚本在 Greenplum 中创建一个可写外部表。\n\n```\nCREATE WRITABLE\
  \ EXTERNAL TABLE schemaname.tablename_ext\n(LIKE schemaname.tablename)\nLOCATION\
  \ ('gpfdist://<host>:<port>/<filepath>')\nFORMAT 'TEXT' (DELIMITER E'\\x01' NULL\
  \ '')\n```\n\n一旦表数据导出到边缘节点，就需要将其推送到 Hadoop 集群。有两种方法可以将此文件复制到 Hadoop 集群：\n\n1. 使用\
  \ Hadoop `put` 命令将文件复制到 HDFS\n2. 使用安全复制（`scp`）将文件复制到 Hadoop 名称节点\n\n## 将非结构化数据摄取到\
  \ Hadoop\n\n由[机器学习](https://en.wikipedia.org/wiki/Machine_learning#Machine%20learning)文本分析引发的技术和分析进步促使许多企业研究应用（场景），从而推动了情感分析、语音挖掘和预测分析等领域的发展。21\
  \ 世纪 00 年代末大数据（Big Data）的出现，使得人们对非结构化数据分析在自然语言处理和图像或视频分析等当代领域中的应用兴趣大增。\n\n非结构化数据是指没有预定义数据模型或未按预定义方式组织的信息。非结构化信息通常以[文本](https://en.wikipedia.org/wiki/Plain_text#Plain%20text)为主，但也可能包含日期、数字和事实等数据。这会导致不规则性和歧义性，使得与存储在数据库字段化形式中或文档中注释的数据相比，使用传统程序难以理解。\n\
  \n\n\n### Apache Flume\n\n`Apache Flume` 是一个分布式系统，用于从不同的源系统捕获大量日志数据并将其加载到数据湖中。传统上通过网络将数据集从一个系统安全复制到另一个系统的解决方案，仅在数据集相对较小、易于获取和立即可用时才有效。考虑到近乎实时的复制、批量加载以及数据量所带来的挑战，对一款健壮、灵活且可扩展工具的需求不容忽视。`Flume`\
  \ 恰好符合要求，它是一个可靠的系统，能够将流式事件从不同的源传输到 `HDFS`。\n\n`Flume` 起源于 2011 年的 Cloudera 公司，并作为\
  \ Hadoop 技术栈的原生组件进行打包。它用于收集和聚合作为事件的流式数据。该框架基于分布式管道架构构建，包含一个 `Flume 代理`（或多个独立的联邦代理），该代理由一个连接数据源和数据汇的通道组成。`Flume`\
  \ 保证的是，通过实现代理之间的事务性交换以及通道的可配置数据持久性特性，来提供端到端的可靠性。`Flume` 的拓扑结构可以灵活调整，以优化事件量和负载均衡。\n\
  \n图 2-17 展示了一个通过 `Flume` 从数据源到通道再到数据汇的简单数据流模型。`Flume 代理` 本质上是在一台机器上运行的 JVM 守护进程。\n\
  \n![A454145_1_En_2_Fig17_HTML.png](img/A454145_1_En_2_Fig17_HTML.png)\n\n图 2-17\n\
  \nApache Flume 架构\n\n组件 –\n\n*   一个 `Flume 事件` 是一个字节大小的数据对象，带有可选的头部信息（作为独特信息的键值对），通过代理进行传输。\n\
  *   `数据源` 是一个可扩展的组件，它从数据源接收数据并将其写入通道。它可以选择性地拥有一个拦截器，通过标记、过滤或修改来更改事件。推送到通道的事件是 `PUT`\
  \ 事务。\n*   `通道` 根据其配置，将接收到的 `Flume` 事件持久化地排队。它有助于持久化事件并控制数据负载的波动。\n*   `数据汇` 从通道拉取数据并将其推送到目标数据存储（可能是\
  \ `HDFS` 或另一个 `Flume` 代理）。由 `数据汇` 从通道拉取的事件是 `TAKE` 事务。\n\n从数据源到数据汇的数据流通过事务进行，这消除了管道中数据丢失的风险。`Flume`\
  \ 最适用于以稳定速率生成数据流的源。源数据可以是同步的，例如 `Avro`、`Thrift`、spooldir 目录、`HTTP`、Java 消息服务，或者是异步的，例如\
  \ `SYSLOGTCP`、`SYSLOGUDP`、`NETCAT` 或 `EXEC`。对于同步源，客户端可以处理故障；而对于异步源，则无法处理。类似地，数据汇可以是\
  \ `HDFS`、`HBase`（同步和异步）、`Hive`、日志记录器、`Avro`、`Thrift`、文件滚动、`morphlineSolr`、`ElasticSearch`、`Kafka`、`Kite`\
  \ 以及更多的 `Flume` 代理。\n\n### 用于事件汇聚流的分层架构\n\n可以建立一个包含多个代理的分层框架，以实现事件汇聚流到多个数据汇。采用分层方法可能有多种动机。主要动机是优化数据量分布，并使数据汇免受不均匀数据负载的影响。其他原因可能包括减轻源长时间持有大量事件的负担。\n\
  \n在最外层（第一层）中，松散耦合的独立 `Flume` 代理持有来自数据源的事件流。在后续层中，数据汇总合从前一层数据汇接收到的事件流。这种汇总和聚合过程一直持续到最后一层，然后最内层的数据汇将事件路由到\
  \ `HDFS`。代理数量在最外层最多，而事件量在最内层最大。\n\n图 2-18 展示了三个层级，每层包含多个 `Flume` 代理，这些代理从多个 Web\
  \ 源读取事件流并将数据传输到 `HDFS` 集群。每个数据汇将事件流推送到下一层代理的数据源。第一层的数据源进入第二层，第二层的数据源进入第三层。这展示了汇聚的场景。\n\
  \n![A454145_1_En_2_Fig18_HTML.png](img/A454145_1_En_2_Fig18_HTML.png)\n\n图 2-18\n\
  \nApache Flume 分层模型\n\n分层架构实现了负载均衡，并在收集器、存储器和聚合器代理之间建立了一个清晰的层级。\n\n\n\n### 特性与设计考量\n\
  \n1.  **通道类型** – Flume 内置了三种通道，分别是：`MEMORY`、`JDBC` 和 `FILE`。\n    1.  `MEMORY` –\
  \ 事件从来源读取到内存中。由于是基于内存的操作，事件摄取速度非常快。相反，由于捕获的更改本质上是易失性的，因此代理崩溃或硬件问题等事件可能导致数据丢失。业务关键型事件并非好的选择，但低类别日志可以设置为内存通道。\n\
  \        1.  你可以使用 `agent.channels.c1.capacity` 设置事件容量。同时也应根据容量增加 Java 堆空间。\n  \
  \      2.  使用 `keep-alive` 来确定将事件写入通道的进程的等待时间。\n        3.  较低的写入和读取事务延迟，但对于大型事件来说并非经济高效的解决方案。\n\
  \    2.  `FILE` – 事件从来源读取并写入文件系统上的文件。虽然速度较慢，但它被认为是三种通道中持久且可靠的选择，因为它使用了预写日志机制以及存储目录来跟踪通道中的事件。设置通道的\
  \ `checkpointDir` 和 `dataDirs` 属性以设置存储事件的目录。\n    3.  `JDBC` – 事件被读取并存储在 Derby 数据库中。也支持\
  \ ACID 特性，但由于性能问题，采用率并不高。\n    4.  Kafka 通道 – 事件存储在集群的 Kafka 主题中。这是近期可以适配到多种场景的集成方式之一：\n\
  \        1.  存在 Flume 源和接收器 – 事件写入 Kafka 主题\n        2.  存在 Flume 源 – 事件被捕获到 Kafka\
  \ 主题中。与其他应用的集成由用例驱动。\n        3.  存在 Flume 接收器 – 当 Kafka 从源系统捕获事件时，接收器有助于将事件传输到\
  \ HDFS、HBase 或 Solr。\n2.  **通道容量和事务容量** – 通道容量是通道中事件的最大数量。事务容量是单次事务中传递给接收器的最大事件数。为通道设置\
  \ `capacity` 和 `transactionCapacity` 属性。\n    1.  通道容量必须足够大以排队许多事件。这取决于事件大小、内存或磁盘大小。\n\
  \    2.  对于 `MEMORY` 通道，通道容量受 RAM 大小限制。\n    3.  对于 `FILE` 通道，通道容量受磁盘大小限制。\n   \
  \ 4.  事务容量取决于为接收器配置的批处理大小。\n3.  **事件批处理大小** – 事务容量或批处理大小是单次事务中可批处理的最大事件数。它在源和接收器级别设置。\n\
  \    1.  在源端设置 – 写入通道的批处理中的事件数量\n    2.  在接收端设置 – 接收器在刷新前单次事务中捕获的事件数量\n    3.  批处理大小\
  \ `<<channel>>.batchSize` 必须小于或等于通道事务容量，以便进行适当的资源管理。\n    4.  接收端的批处理大小越大，通道清空空间以容纳更多事件的速度就越快。对于文件通道，对于大容量批次，刷新后的操作可能比较耗时。\n\
  \    5.  最佳实践是设置能够产生最佳性能的事务容量。没有固定公式，需要逐步尝试。\n    6.  如果某个批次在中途失败，整个批次将重放；这可能导致目标端出现重复数据。\n\
  4.  **通道选择器（复制器/多路复用器）** – Flume 中的事件可以复制到所有通道，也可以根据条件复制到选定通道。例如，如果一个事件需要被 HDFS、Kafka、HBase\
  \ 和 Spark 消费，则可以将通道标记为复制器。复制是默认的通道选择器类型。如果一个事件需要根据规则或上下文路由到不同的通道，则可以将选定的通道标记为多路复用器。选择器在事件流到达通道之前生效。\n\
  \n```\nagent.sources.example.selector.type = multiplexing\nagent.sources.example.selector.mapping.healthy\
  \ = mychannel\nagent.sources.example.selector.mapping.sick = yourchannel\nagent.sources.example.selector.default\
  \ = mychannel\nagent.sources.example.selector.header = someHeader\n```\n\n如果复制器和多路复用器无法满足需求，也可以开发自定义的复制策略。\n\
  5.  **通道配置** – 如果在拓扑结构中通道配置不足，将在事件负载（每个代理的事件负载）和资源利用率方面造成事件流瓶颈。\n6.  在多跳流或分层架构中，请注意事件在到达目标端之前所经过的跳数。请注意，代理内的通道在特定时间充当事件缓冲区。如果跳数很多，任何一个代理出现故障，其影响可能会级联到源端。\n\
  7.  Flume 遵循可扩展框架。自定义 Flume 组件需要将其 jar 包添加到 `flume-env.sh` 文件中的 `FLUME_CLASSPATH`\
  \ 里。另一种方式是通过 `$FLUME_HOME` 路径下的 `plugins.d` 目录。如果插件遵循定义的格式，`flume-ng` 进程将从 `plugins.d`\
  \ 目录中读取兼容的插件。\n8.  Flume 拓扑结构高度依赖于用例。对于均匀生成数据的时间序列，Flume 可以发挥出色的作用。如果源数据管道出现问题，Flume\
  \ 不是一个好的选择，因为它可能潜在地破坏 Flume 拓扑结构并导致长时间中断。不建议频繁更改 Flume 拓扑配置。\n9.  由于全球分布，时区已成为数据摄取策略中不可或缺的一部分。所有时间和计划都必须归一化为单一的标准格式时区\
  \ UTC。\n\n## 结论\n\n在本章中，我们讨论了将数据接入 Hadoop 数据湖的不同方法。本章从摄取框架的原则开始，并快速回顾了基本的 ETL 和\
  \ ELT 概念。我们讨论了批量摄取概念及其设计考量。在实时处理方面，我们探讨了变更数据捕获的工作原理及其在真实场景中的关键驱动因素。本章的两个关键要点是 Apache\
  \ 基金会的两个产品：Sqoop 和 Flume。两者在将结构化和非结构化数据集成到数据湖生态系统方面都已被证明非常有用。\n\n在下一章中，我们将介绍数据流策略，主要关注\
  \ Kafka。\n\n\n\n"
- "# 3\\. 使用变更数据捕获技术采集流式数据\n\n> “如果你愿意倾听，数据会对你说话” — 吉姆·伯格森，Bridgz Marketing Group\
  \ 总裁兼首席执行官\n\n在设计数据湖时，如果不考虑数据源中数据流动的速度，那将是徒劳的。从实时性或“新鲜度”的角度来看，流式数据源正变得日益关键。物联网与移动趋势已如同人权一般普遍存在的时代，需要一个不仅能匹配数据流动速度，还能将其付诸行动的系统。数据湖的受益者和分析消费者面临着摄取持续不断数据流的艰巨任务。\n\
  \n挑战来临，克服挑战的技术也随之出现。随着数据及其产生源的复杂性稳步增长，数据工程领域已发展到能够成功摄取数据流的水平。如前所述，大数据生态系统具有高度灵活性，且解决方案趋势也在持续演进中。本章将揭示使用\
  \ `Kafka` 进行变更、数据捕获和事件流处理的原理。我们将努力理解在将数据摄取到数据湖时，变更数据捕获方法的各类范畴。在本章后半部分，我们将学习如何使用\
  \ `Kafka` 发布事件。从更宏观的层面看，本章结构如下：\n\n*   变更数据捕获\n    *   是什么与为什么？\n    *   策略与权衡\n\
  \    *   保留与重放\n*   CDC 工具\n    *   操作与挑战\n*   下游传播\n    *   变更数据的集中化\n    *   分析：集中式数据存储\n\
  \    *   元数据：关于数据的数据\n    *   数据格式\n    *   消费与检查点\n    *   合并与整合\n    *   数据质量与挑战\n\
  \    *   发布到 Kafka\n\n## 变更数据捕获概念\n\n变更数据捕获（缩写为 CDC）是任何公司整体数据管理和整合策略中的关键流程。变更数据捕获的一个简单定义是：从其宿主数据存储中提取某条数据已提交的状态变更。数据存储可以是传统的企业级数据库，如\
  \ `Oracle`、`MySql`，或者是 NoSQL 存储，如 `Mongodb` 或 `Cassandra`。实际上，任何专有格式，哪怕是原始的管道分隔数据存储，都可能成为变更数据捕获的事实数据源。在此语境下，“已提交”一词非常重要，因为它（或其缺失）可能导致数据不一致，例如，在最终状态转换（具体指回滚）之前捕获变更数据，会导致源系统与下游应用程序之间的数据不匹配。\n\
  \n大多数情况下，系统收集到的输入记录或数据字节，仅通过为该数据服务读取流量，并不能实现其存在的承诺。它需要流向其他下游系统，以实现更宏观的大局目标。事实上，即使某条数据存在的唯一目的是服务于查询原始数据存储的读取客户端，出于验证、追踪或合规目的，仍然可能对其存在有效的变更数据捕获需求。\n\
  \n## 数据捕获策略\n\n捕获数据存储中数据变更的方式有多种。最佳方法取决于各种参数，例如数据的性质和输入数据的流动速率。捕获策略可能跨越多个阶段，包括同步数据捕获以及从同步捕获中聚合捕获数据。\n\
  \n最优策略还取决于驱动数据捕获本身的需求，这些需求可归结为以下几个问题：\n\n*   捕获变更数据的目的/目标是什么？\n*   是为了追踪/合规，还是为了聚合/分析报告？对于消费此数据捕获的目标系统，数据可用性的\
  \ SLA 是什么？\n\n上述所有因素对于确定捕获数据并将其传播到数据流流程/管道下一步的策略都至关重要。\n\n以下是一些有助于制定变更数据捕获策略的属性。\n\
  \n1.  输入数据的性质\n    *   数据类型 - 整数、浮点数、字符串、二进制等\n    *   大小 - 平均记录大小、平均字段大小\n    *\
  \   变更性质 - 插入、更新、删除的百分比\n    *   变更速率 - 每种变更类型（插入、更新等）发生的频率以下是上述属性可能影响的几个示例。\n \
  \   *   像字符串这样的自由文本数据类型可能会打翻大小和容量的估算，因为它们可能容纳范围极广的数据大小。对于像 `CLOB` 这样的大型文本数据类型，这变得更加不可预测。因此，在大小范围变化极大的数据上采用同步捕获策略（例如触发器），最终可能会使写入客户端的延迟数据偏离预期。\n\
  \    *   类似的大小问题也可能基于行大小而出现。一些下游系统（如 `Kafka`）可能有消息大小限制；这可能会根据我们处理此场景的方式而改变我们的数据捕获策略。\n\
  \    *   在我们捕获“前”和“后”映像的情况下，更新、插入和删除可能导致消息大小差异巨大。\n2.  CDC 的驱动因素\n    *   目的 - 追踪/合规、批量聚合、分析等\n\
  \    *   SLA - （近）实时、小时内、天内等\n    *   以下是上述属性如何驱动 CDC 决策的几个示例。\n        1.  与数据聚合等目的相比，追踪/合规系统通常需要记录的信息较少。因此，由于涉及较低的数据处理延迟，同步捕获可能是一种可行的策略。\n\
  \        2.  SLA 显然是一个关键驱动因素，因为它决定了数据捕获应多接近实际的数据提交时间。\n\n## 保留与重放\n\n提取数据的保留通常在\
  \ CDC 管道中具有很大价值。其主要目的是在发生故障和延迟时便于重用提取的数据，从而避免代价高昂（从资源和时间角度看）的数据重新提取。\n\n由于数据提取的成本通常很高，因此会利用数据保留。根据数据提取的模式（同步或异步），源系统会因使用大量资源来提取数据而产生额外的“成本”。一旦发生任何故障，重做整个流程将是昂贵或不可行的。\n\
  \n数据保留允许数据重放，即，为下游流程重用提取的数据。不同的下游流程可以通过建立基本的检查点机制，从过去的不同时间点进行重放。这里的检查点，指的是保存某个消费者已经成功消费数据的进度点。\n\
  \n\n\n### 保留期限\n\n保留期限应根据 ETL 管道的需求来确定。通常，会有诸多影响因素，但一旦所有依赖项得到解决，确定保留时长应该会变得直接明了。\n\
  \n例如，在简单的 ETL 流程中，数据从源数据库中通过异步查询提取，并以分隔符格式保存在文件中。随后，下游进程每小时会消费这些文件，并将数据合并到 `hadoop`\
  \ 中。在此简单的用例中，决定数据保留的关键因素包括：\n\n1.  源数据量/事务速率\n2.  源数据提取频率\n3.  数据量的自然/预期增长\n4. \
  \ `Hadoop` 合并频率\n5.  存储成本与数据提取成本的分析\n\n还可能存在其他因素，例如运行数据提取进程的主机容量，但为简单起见，我们假设其他因素都易于处理。\n\
  \n因素 #1 和 #2 的影响是直接的。这些数字决定了每次运行提取进程时，由于数据提取将产生多少数据。这将帮助我们预估满足数据需求所需的存储空间。\n\n因素\
  \ #3 对于确定未来增长的存储需求至关重要。例如，如果公司将在未来几个月推出可能大幅增加数据和事务量的新功能，那么显然需要将此纳入保留规划中。此外，也应始终为数据量的意外峰值或增长预留一些缓冲空间。\n\
  \n因素 #4 很重要，因为它规定了提取流程对下游流程实际有用所需的最小保留期限。例如，如果 `Hadoop` 合并进程每日运行，而变更数据提取每小时发生，那么\
  \ CDC 提取的数据至少需要存储一天，以便 `Hadoop` 合并进程能够无数据间隙地消费。此外，这还能预估，如果合并失败，下游进程可能发起的重播请求量。\n\
  \n因素 #5 用于判断是否需要在长期存储大量数据与按需重新提取数据（用于故障和重播场景）之间进行权衡。大多数情况下，与从源系统重新提取数据相比，对已提取数据进行额外保留是更好的选择。\n\
  \n此方法可扩展到任何数据流管道。还可能存在其他与特定用例相关的因素，例如主机容量和网络带宽。在确定数据保留策略时，需要酌情考虑这些因素。\n\n## CDC\
  \ 的类型\n\n让我们看看变更数据捕获的不同模式：增量式、批量式和混合式。\n\n### 增量式\n\n此模式在提交时或接近提交时捕获变更。其主要目的是在变更发生时提取数据，以便使捕获负载变得可控。增量模式可以是同步或异步的。\n\
  \n同步捕获在源端发生数据变更时立即捕获。虽然此方法具有最低的捕获负载和延迟时间的优势，但它可能会增加将数据持久化到源数据存储的应用程序或系统的延迟。对于这种方法是可行的，写入源数据存储的客户端必须接受捕获时间带来的额外延迟。客户端遭受的额外延迟也会随着输入数据量和提交块大小而变化。要使此方法成功并随时间推移保持可扩展性，必须考虑所有这些因素。\n\
  \n异步捕获是在源数据库提交变更后，从事务日志中捕获变更。由于是在事务提交后从日志中读取变更，因此对事务本身没有影响。必须启用适当级别的补充日志记录才能实现异步捕获。\n\
  \n### 批量式\n\n批量式捕获按时间跨度分块提取数据，例如每小时提取一次数据。这种批量提取可以直接在源数据存储上进行，也可以对通过同步捕获提取的数据进行聚合/ETL\
  \ 准备。\n\n如果批量提取直接在源数据存储上进行，那么运行提取进程时会给源端带来额外的数据提取负载。此策略对源数据存储的影响取决于数据存储及其相关硬件上的资源使用水平。高影响也会间接转化为对客户端延迟的影响。\n\
  \n### 混合式\n\n您可以结合使用增量式和批量式策略来进行变更数据捕获。您可以采用包含增量和批量变更捕获的多层 CDC 架构。虽然这种方法会带来数据存储客户端延迟增加的不利影响，但它也拥有前述增量数据捕获的优点。此外，这种方法还可能优化传播到下游或中间集中式系统的变更数据。\n\
  \n例如，如果您的增量捕获是同步的，并提取对某个数据库记录的所有变更，这可能会导致大量变更数据供下游系统消费，原因是一条给定记录可能存在众多版本。这将导致多个下游目的地中的数据占用空间增加。\n\
  \n虽然通常数据多是好事，但如果您的下游只关心合并所有变更并维护源系统的整合副本，这也可能导致数据过载。在这种用例中，如果服务水平协议（SLA）的增幅是可接受的，第二层批量捕获可以在给定时间周期内（例如每小时）进行整合和去重，并将其传播到下一个下游层。\n\
  \n总的来说，变更数据捕获方法需要考虑数据管道内部及周边的各种参数。此处的决策需要权衡利弊，以得出最优策略。让我们探讨一下我们讨论过的 CDC 策略中的一些关键权衡因素。\n\
  \n\n\n## CDC – 权衡取舍\n\n如同所有理论原则一样，在实际实施过程中总是需要权衡各种因素。最佳选择可能并非理想方案；但它是最有利且最符合期望的方案，因而得以通行。在之前关于制定良好变更数据捕获流程的策略和方法的总体讨论中，我们曾略微提及一些权衡点。现在让我们详细审视这些方面。\n\
  \n同步增量捕获提供了最快且最接近原始状态的方式来提取系统变更。在这里，“接近原始状态”意味着数据损坏的可能性极小或为零，因为我们在持久化过程本身中提取变更。其代价是延迟；数据写入进程会在延迟方面受到影响。通过使增量提取略微延迟或异步化，可以在一定程度上缓解这一问题。也就是说，我们仍然在持久化后很短的时间内（几秒或几分钟）增量提取数据，但这与原写入进程隔离。然而，要做到这一点，我们需要一个能获取原始事务细节的场所。\n\
  \n对于 Oracle 和 MySQL 这类关系型数据库，重做日志和二进制日志分别记录了数据库事务活动的运行轨迹。理论上，变更捕获进程可以从这些日志中异步提取数据，且对在线数据库的影响极小或无影响。当然，在某些情况下，日志格式可能是专有的，从日志中提取数据可能需要额外的工具。我们将在后续章节中详细讨论这些工具。但这种异步方法是一种良好的权衡，因为它既能提供接近源数据持久化时间的提取能力，又不会显著影响源数据存储的性能。\n\
  \n这种权衡也可以是混合型的：将同步提取限制在最低必要数据量范围内，即只提取原始、简单的数据，随后再通过异步处理来满足完整的数据捕获需求。\n\n例如，如果数据捕获需求是发送跨三个客户相关表的数据记录在特定时间点的表示，我们可以同步提取单条记录（例如通过触发器），然后异步地连接这些记录，向数据捕获进程提供完整的反规范化记录版本。对于批量捕获，运行批量处理的频率会显著影响其效率。\n\
  \n举个例子：在 1 小时的捕获间隔内需要处理的数据量，80% 的时间可能是可控的；但如果剩余的 20% 时间里数据量依然过大，就可能严重影响整个 ETL 管道的可靠性。如果这\
  \ 20% 的极端情况导致通过 CDC 管道提供数据时出现显著延迟，那么提高数据捕获频率（例如，改为每 30 分钟一次）可能会使 CDC 管道运行得更加平稳。\n\
  \n## CDC 工具\n\n变更数据可以通过现成的工具提取，也可以基于简单的查询进行提取。这些查询可以是 SQL 形式，也可以是基于源数据库类型的 API 调用。按照所需的频率，定期对\
  \ `delta` 列（一个追踪变更的时间戳列）运行查询，以提取数据并将其写入能供给下游进程的位置（如共享存储，例如 `netapp`、`filer`、另一个数据存储系统等）。查询频率需要根据其他因素设定，例如所需的服务等级协议、源数据库的负载、增量数据的峰值容量。\n\
  \n目前有多种免费和许可的工具可用于从 RDBMS 和 NoSQL 数据库进行增量数据提取。以下是一些常用的工具。\n\n-   数据库触发器可为 Oracle\
  \ 或 MySQL 这类关系型数据库提供良好的数据提取机制。然而，正如我们之前讨论的，触发器是同步的，可能导致数据写入操作的延迟增加。通常，由于触发器会对源数据库的性能产生影响，触发器内部的逻辑应保持非常轻量。如有需要，可以在通过触发器提取的数据之上，应用额外的异步数据提取层，以在\
  \ ETL 管道内完成进一步的数据聚合需求。\n-   适用于 Oracle 和 MySQL 的 Oracle GoldenGate 适配器（大数据和 Java\
  \ 适配器）。然而，这些工具除了需要 Oracle GoldenGate 许可证外，还需要额外的许可。\n-   开源工具，如 Open Replicator、Tungsten\
  \ Replicator（用于 MySQL）。\n-   适用于 Couchbase 的视图。\n\n### 挑战\n\nCDC 系统的关键挑战在于为其适应当前和未来需求进行合理扩展。扩展策略取决于当前数据量、预期增长以及数据保留策略。正如我们在数据保留部分所讨论的，这些因素可能因不同用例而异。未能进行适当扩展和扩展规划，将导致系统产生巨大的运维开销，以及投入大量新工程来改造系统以适应新状况。\n\
  \n运维便捷性是另一个在开发阶段通常被忽视的关键因素。一个日常运维负担沉重且可用性低的系统，实际上等同于一个无功能的系统。\n\n### 下游传播\n\n从源数据存储捕获的数据，需要根据整个\
  \ ETL（提取、转换、加载）流程的目标，流向不同的目的地。\n\n例如，如果目标是将来自多个源数据存储的所有数据集中到一个类似 Hadoop 的批量数据存储中，那么你需要制定一个策略，在源端捕获（增量或批量）数据并将其导向\
  \ Hadoop。根据 Hadoop 上所需数据的精细程度，在这个端到端的数据管道中可能存在多个中间阶段。\n\n此外，可能还有其他下游消费者需要相同的数据。在这种情况下，最佳方法是利用已捕获的数据服务于所有下游消费者，而无需为不同的目标数据流设置多个捕获进程。接下来，我们通过一个简单实用的用例来进一步探讨这个场景。\n\
  \n### 用例\n\n公司 A 是一家消费类网络公司，它将来自面向用户应用程序的在线数据存储在 MySQL 数据库中。\n\n#### 下游 #1\n\n源\
  \ MySQL 数据需要流入 Hadoop，在那里与来自在线用户活动追踪公司的第三方数据进行合并。\n\n#### 下游 #2\n\n在线应用程序需要展示来自\
  \ MySQL 数据库的用户数据。出于扩展目的，应用程序使用缓存层来加速数据访问。因此，来自 MySQL 数据库的数据也需要流向这些应用程序缓存。\n\n假设存在一个数据捕获进程，它通过每小时在源数据库上运行查询来执行批量提取。这些查询是在在线数据库的只读从库上运行的。\n\
  \n假设条件——Hadoop 中的数据精细度与 MySQL 数据库中的记录级别一致，即源数据库中的记录需要按原样传播到 Hadoop。缓存中的数据精细度也是记录级别。\n\
  \n现在，如果整个 ETL 策略是提取数据、分块处理，然后转储到目标环境 Hadoop（或缓存）中。那么我们将需要两条管道来提取、处理并将数据加载到目的地。\n\
  \n但是，由于我们至少在其中一个数据流中保留了源数据的原始精细度，那么提取出的这份数据显然可以在两条管道中重复使用。要做到这一点，我们可以只提取一次数据，然后重复利用已捕获的数据，将其导向多个下游目的地。换句话说，建立一个通过变更数据捕获获得数据的中央存储库，将节省大量时间和资源，并极大地惠及我们的\
  \ ETL 策略。\n\n\n\n#### 变更数据的集中化\n\n数据集中化使得源数据能够实现一对多的消费模式。它避免了数据流的重复，并便于下游系统轻松消费数据，例如发布-订阅模型。此外，对于变动缓慢的外部数据，集中化可以充当“暂存”层，该层保存所有变更，从而无需费力在变更中进行搜索。这一层带来的好处远远超过其运营开销。图\
  \ 3-1 展示了如何通过从源数据系统进行单次捕获来服务多个消费者。\n\n此外，即使下游目标需要不同粒度的数据，以所需最低粒度维护的集中式存储也能为全部或部分下游提供数据。例如，一个具有记录级粒度的集中式数据存储，既可以为一个完全聚合数据的下游数据存储提供数据，也可以为一个月度汇总下游数据存储提供数据，该月度汇总存储会将同一数据的月度汇总与其他来源的数据结合起来。\n\
  \n集中式数据存储还提供许多其他优势，如下所示：\n\n-   相比于多个独立的 ETL 管道，由于数据扇出的位置更少，因此可管理性更好。\n-   通过检查点和水位线对下游消费者进行控制。\n\
  -   具备重放能力，无需重新从源端提取数据；如果 CDC 运行在在线系统上，这也意味着对在线系统的影响更小。\n\n![A454145_1_En_3_Fig1_HTML.png](img/A454145_1_En_3_Fig1_HTML.png)\n\
  \n*图 3-1*\n*集中式数据中心有助于通过单次捕获服务多个消费者*\n\n#### 分析集中式数据存储\n\n对于低事务量的用例，集中式存储可以是平面文件的聚合。从源数据存储中提取的数据可以转储到平面文件中，这些文件可以保留一段时间，以满足管道对多个消费者进行消费和重放的需求。\n\
  \n对于需要更好组织、查询能力和消费者检查点设置的稍微复杂的用例，集中式存储可以是一个更大的数据存储库，其模型仿照某个源数据存储构建。\n\n例如，如果你正在为不涉及高数据量（每天最多几\
  \ GB 增量数据）的 MySQL 源数据库构建 ETL 管道，你可以将来自各个源的所有增量数据持久化到一个中央 MySQL 数据库中。你可以对每个源数据库运行增量\
  \ SQL，并将输出导入一个中心数据库。多个消费者可以通过基于这些数据构建的检查点或水位线机制来消费数据。此中央数据存储库中的数据保留将由所有消费者中所需的最长保留期驱动。\n\
  \n对于高数据量和极高数据量的场景，更具可扩展性和分布式的集中式数据存储是首选方案。可以利用发布-订阅消费机制来促进多个客户端的数据消费。可以使用 `Kafka`\
  \ 以及其他队列系统（如 `RabbitMQ` 和 `ActiveMQ`）来实现这一点。其中一些系统提供了集中数据的分布式存储、针对多个消费者的高效检查点设置以及并行消费能力。\n\
  \n#### 元数据：关于数据的数据\n\n为了使任何数据管道卓有成效，其中流动的实际数据应伴随定义该数据的元数据。元数据是有效数据治理的关键。在此上下文中，元数据是定义数据结构和属性的数据。这可能意味着数据类型、数据隐私属性、精度和小数位数。通常，数据质量与提供的元数据数量和深度成正比。没有元数据，消费者将不得不依赖其他来源和机制。\n\
  \n从合规性和安全性的角度来看，元数据管理也扮演着关键角色。《通用数据保护条例》旨在加强对全球范围内（拥有欧盟公民的）公司对个人数据的控制，以加强数据保护。图\
  \ 3-2 展示了元数据有助于遵守治理准则的领域。\n\n![A454145_1_En_3_Fig2_HTML.png](img/A454145_1_En_3_Fig2_HTML.png)\n\
  \n*图 3-2*\n*元数据管理在数据监管中扮演关键角色*\n\n元数据相对于数据本身可以是同步的或异步的。在异步交付的情况下，应注意在源数据可用时尽可能及时地提供元数据；否则可能会破坏某些下游系统。但异步模式避免了元数据与数据的紧耦合，特别是在数据提取时元数据不可用、必须单独获取的情况下。\n\
  \n当使用 CDC 工具进行数据提取时，如果该工具在数据提取时未提供完整的元数据，则需要一个单独的进程从源系统中提取元数据。\n\n元数据提取的性质（同步或非同步）应根据元数据的关键性来决定。如果下游系统能够容忍元数据可用性偶尔出现的延迟（至少部分延迟），那么异步模式将是更好的选择，因为它减少了依赖性，从而降低了整体失败的可能性。但是，需要为元数据的可用性定义明确的\
  \ SLA。可扩展性和高可用性的一般要求同样适用于元数据。即使只有一个下游消费者因为数据和元数据不同时可用而失败，整个数据管道也会变得不可用。\n\n让我们来看看通常需要与数据一起提供的一些元数据特性。\n\
  \n#### 数据结构\n\n数据类型精度（特别是对于数值类型，例如日期）是消费者保持数据保真度的关键要求。例如，数值数据类型的小数位数和精度信息在财务汇总和数据计算中非常重要。\n\
  \n#### 隐私/敏感信息\n\n许多存储成员数据的数据存储都会有一些敏感字段，这些字段在暴露给少数下游系统时需要被屏蔽/清洗，例如 SSN、信用卡和收入信息。这些字段应使用所需的元数据进行标记，以便进行适当的后续处理。\n\
  \n#### 特殊字段\n\n另一个常见用例是与上下文相关的字段，这些字段在一组消费者中共同使用。\n\n例如，最后修改时间戳是一个常用值，用于下游系统中的增量数据消费和合并。在这些情况下，元数据应标识具有此值的属性。另一个例子是标识记录是否处于活动状态的属性。\n\
  \n#### 数据格式\n\n只有当数据管道包含数据以及消费者可以用来理解数据的相关元数据时，它才具有实际意义。\n\n正如我们之前讨论的，在管道内随数据一起传播元数据有多种不同方式。无论我们选择哪种方式，都会带来一个新的数据大小问题：将元数据信息与数据捆绑的实际操作。元数据越多，记录的整体数据集大小就越大，吞吐量就越慢（在其他条件相同的情况下）。\n\
  \n这就是我们选择的数据格式变得至关重要的地方。一如既往，过程中存在权衡，实用性必须驱动选择的决策。让我们来看一些实际的选择。\n\n\n\n#### 分隔格式\n\
  \n分隔格式非常常见：以逗号/空格分隔，或采用自定义序列分隔的文本。这种选择在数据大小方面非常简单高效；相比实际数据大小，存储开销极低（仅需分隔符的额外空间）。然而，分隔格式仅输出数据，元数据需通过另一条管道流转。\n\
  \n数据与元数据隔离且无依赖性的优势，在以下场景中可能转化为劣势：\n\n1. 下游消费者需要元数据才能理解数据含义。\n   - 此时，消费者将阻塞直至元数据抵达。\n\
  \   - 但如果元数据相对静态，消费者可在本地缓存元数据并用于处理数据。即使元数据变更，处理过程仍可能存在延迟；但如果变更频率极低，为获得紧凑且高吞吐的分隔数据，这或许是可接受的权衡。\n\
  2. 元数据频繁变更。\n   - 当元数据频繁变更时，消费者必须频繁从其他存储元数据的位置查找元数据。这将增加管道延迟与潜在故障点。\n\n#### Avro\
  \ 文件格式\n\n`Avro` 是一种非常常见的格式，它将元数据嵌入数据本身。这实现了同步的元数据传播与验证。当为数据定义 `Avro` 模式后，运行时将根据模式对流入的数据进行验证。\n\
  \n例如，若某字段定义为数字类型，运行时任何尝试向该字段编码字符串的操作都将被拒绝。这种严格的数据类型与结构验证，在数据标准化方面意义重大，并为存在多个消费者的管道提供了高度可靠性。缺乏验证可能导致因类型不匹配及数据源与下游目标管理团队沟通不当而频繁出现故障。\n\
  \n`Avro` 编码存储格式也相当紧凑，尤其是采用二进制编码时。`Avro` 同样支持 JSON 编码。\n\n虽然 `Avro` 是高效的编码格式，但同步编码多少元数据仍需根据实际情况进行权衡。例如，数据类型信息是定义\
  \ `Avro` 结构和验证过程所必需的。但额外的元数据（如敏感性信息）必须显式提供。这类额外元数据的传播模式（同步或异步）仍需根据实际考量决定。\n\n####\
  \ 消费与检查点机制\n\n一旦建立集中式数据存储以托管来自源数据存储的数据，就需要定义完善的流程来支持多个消费者。\n\n##### 简单检查点机制\n\n\
  一种简单的组织机制是维护一个包含消费者及其当前检查点信息的表格。检查点本身可以是一个时间戳值，表示给定消费者已提取的最后一条记录的时间戳；也可以是表示上次消费点的递增值。像\
  \ Oracle 这样的数据库提供了可用于下游检查点的数字。其他数据存储也可在提取（CDC）过程中生成类似数字。\n\n##### 并行化\n\n当消费者需要并行处理时，消费与检查点流程将变得复杂。例如，若一个消费者可并行运行多个消费线程来消费同一数据，检查点的管理将变得困难得多。\n\
  \n许多发布-订阅模型存储（如 `Kafka`）支持跨分布式节点的并行消费。它们拥有高效的方式处理跨多节点的数据扩展，并同时支持多个消费者和检查点管理。\n\n\
  ### 合并与整合\n\n当来自不同数据源的数据进入中央枢纽或存储库后，数据管道的下一步是构建子管道，将这些数据与目标数据存储进行整合。\n\n整合的具体方式取决于输入数据的性质及目标数据集/存储的期望状态。例如，若数据通过增量转储方式传入，且要求维护整个数据集整合后的时间点版本，则需将增量输入数据集与目标数据集合并，以达到目标处的数据期望状态。\n\
  \n若每次输入数据集都是全量数据集（即每次接收源数据的完整转储），则可以每次删除并替换目标数据集。若希望保留旧版本，可将目标移至不同位置或数据存储。这种方法通常适用于中小规模数据集，因为生成大型源数据的完整转储需要大量资源；此外，处理延迟可能导致数据积压至不切实际的处理量级。图\
  \ 3-3 描绘了从集中式数据枢纽到消费者进程的合并与整合流程。\n\n![A454145_1_En_3_Fig3_HTML.jpg](img/A454145_1_En_3_Fig3_HTML.jpg)\n\
  \n*图 3-3 合并与整合工作流程*\n\n\n\n## 合并与整合的设计考量\n\n合并与整合是构建目标数据集或数据存储的关键阶段，这些数据集或存储进而可为各种终端客户用例提供服务。这些用例可以用于实时分析或批量处理。通常情况下，此目标数据集会成为对终端用户或内部客户具有重要价值的关键报告的数据来源。\n\
  \n例如，目标 Hadoop 数据存储可以为网站的内部业务分析或用户分析提供服务。整合过程中的任何错误都会对使用此数据的用例产生连锁影响。因此，确保整合过程的健壮性和可扩展性至关重要。接下来，我们列出一些关键的设计考量。\n\
  \n1. **整合/合并逻辑的简洁性** - 这一点对于确保目标数据集的可靠性以及在出现问题时易于调试大有裨益。这里的简洁意味着降低数据损坏或丢失的风险，并拥有一套清晰简单的数据整合规则。例如，如果你需要在数据合并中解决冲突，请确保冲突解决过程简单明了（例如采用\"\
  最后写入者获胜\"策略，即时间戳最新的记录获胜）。尽可能避免提供过多的选项。\n\n2. **应用/合并过程的可重复性** – 数据管道中的环节可能因各种原因时不时发生故障。应用过程应允许数据重放，即对相同数据（全部或部分已应用数据）多次运行应用过程不应导致目标端的数据损坏或丢失。此功能还支持在数据管道内隔离任务。应用过程应能够独立于其他上游过程运行。\n\
  \n3. **目标数据的可管理性** – 在许多企业中，数据通常从事务性数据存储流向批量数据存储。这是因为目标数据存储旨在服务于对来自不同来源的数据进行分析和批量聚合的目的。目标/目的数据存储的大小通常远大于任何单个源数据存储。更重要的是，目标数据存储允许对大量数据进行批量操作。\n\
  \n大多数批量操作都能从底层数据的并行处理中受益良多。如果底层数据本身具有内在的并行性，这一因素将显著优化数据处理。对数据集进行适当的分区可以在目标数据的批量处理中带来可观的性能提升。分区应基于参与批量操作的属性来进行。\n\
  \n例如，如果在庞大的社交网络评论数据集上存在一个\"每个用户的评论数\"的分析查询用例，按用户 ID 范围对数据集进行分区将允许对底层聚合计算进行并行处理。\n\
  \n### 数据质量\n\n在数据管道中流动的数据质量与管道的功能同等重要。如果管道中流动的数据不是源数据集的有效表示，那么管道就无法实现任何实际目的。在管道的不同阶段加入数据质量检查非常重要。这些检查应验证管道每个阶段数据的正确性。管道不同部分的检查之间应有明确的隔离。这些检查包括行数、结构和数据类型验证。\n\
  \n例如，数据提取后，应根据源数据存储验证数据质量；同样，集中式数据存储中的数据应根据整合/合并输出来验证。如果管道中存在其他中间阶段，则应加入类似的质量检查，以比较每个阶段的输入和输出。当发生数据损坏时，这种界定可以清晰且实际地调试数据质量问题。\n\
  \n沿管道的持续质量检查可提供最大的可靠性。这里的持续检查，是指数据在管道中流动时进行的数据质量检查。由于同一记录可能存在多个版本，持续检查可以对所有或大部分记录版本进行严格的质量验证，从而最大限度地减少随机出现、无规律可循的问题。但如果数据量过大导致持续验证不切实际，则可以批量方式进行质量检查。可以选择特定时间间隔内（给定记录的最新版本）的数据输出，并与上一阶段的批量数据输入进行比较，以验证正确性。\n\
  \n例如，可以将提取阶段在下午 1 点到 3 点之间输出的记录数据，与同一时间间隔内来自源数据存储的输入数据进行比较。可以使用指定此时间戳的属性/字段（例如最后修改时间戳）来提取所需的记录。也可以在全数据集中进行数据采样，以减少比较量。此样本可以基于某个列域值或时间戳的范围。\n\
  \n### 挑战\n\n任何组织内数据管道的复杂性都无法基于一组固定因素以通用方式确定。不同的参数对端到端数据管道的设计和实现产生着不同类型的影响。\n\n###\
  \ 设计层面\n\n在许多数据环境中，诸如事务量和数据大小等因素通常会产生相似的影响，即都会增加复杂性。然而，诸如数据隐私、敏感度等因素在不同公司之间有所不同，并且随数据类型而变化，即使事务量和数据大小可控，也可能使设计变得复杂。\n\
  \n例如，处理包含社保号等个人信息或信用卡等敏感数据，需要实施更多的检查和安防措施。这可能导致从源端到目标端的数据管道中出现更多阶段和访问限制。在某些情况下，例如\
  \ `CLOBs`、图像和 NoSQL 文档，数据可能具有低到中等的事务量，但数据量非常大。\n\n虽然总数据量大小在提取和其他过程中可能是可控的，但下游存储可能对大型记录存在限制或性能下降。例如，Kafka\
  \ 通常针对兆字节级别的消息大小进行了优化；处理大型消息时性能通常会下降。大消息会降低代理的速度，因为它们会给代理带来内存压力。类似地，在集中式存储库是使用某种数据库（如\
  \ MySQL）的自定义中心的情况下，处理非常大消息的查询性能可能会下降。\n\n\n\n#### 运维方面\n\n对数据管道的每一个部分进行全面的监控和测量至关重要。如果无法清晰洞察其运维状况，那么维护和运行一个数据管道几乎是不可能的。我们将在单独章节中深入探讨数据传播与整合的运维细节；但以下列出的，是任何数据管道要实现实用价值都必须应对的典型挑战。\n\
  \n1. **可靠的监控** – 数据管道的每个组件都需要具备监控能力。如果只对整个管道进行高层级监控，而没有对子组件级别的细粒度健康检查，就无法构建一个健壮且可靠的数据管道。子组件级别的监控是必要的，这样才能有效地调试和解决问题，尤其是在数据管道复杂或涉及多个阶段时。监控应嵌入到每个组件进程、每个程序、作业、`SQL`等所有需要运行以支持功能数据管道的环节中。只有主动监控和关注，才能修复问题。响应延迟会复杂化故障恢复过程和恢复时间。此外，对功能及支撑流程的各个方面进行主动监控，还能实现故障的主动检测和预防。例如，检测到数据提取主机上持续增加的负载模式，可以通过主动采取措施来缓解或从问题中恢复，从而防止整个系统崩溃。\n\
  \n2. **指标** – 指标使我们能够持续洞察系统的运行状况。数据管道内某个组成进程可能正在运行，没有失败，但并未真正达成预期目标。如果没有合适的指标，就无法高效管理数据流，也无法向消费者保证管道的高可用性。过晚发现的功能丧失，对消费者和恢复过程都可能造成巨大的损害。指标使我们能够持续跟踪各个方面的运行情况，并将其与基线指标进行比较。基线指标是任何系统预期的标准状态数值。例如，如果公司用户数据库上层的`ETL`系统预计在周一早上每秒提取约\
  \ 500 笔交易，那么对于这个数据库`ETL`的指标而言，周一早上的这个数值就是基线。任何显著偏差都可以被追踪并采取相应措施。有时，即使偏差在功能影响上不是负面的，也可能导致对基线本身的进一步修正，这可能是由于流量、功能或其他因素的变化所致。指标还能量化外部因素对核心系统的影响。例如，交易量指标的百分比变化可以量化公司网站上新功能推出或应用程序流程中其他变化所造成的影响。这种衡量方式使我们能清晰洞察影响，便于进行合理的规划。它还提供了灵活性，可以根据不同系统指标所受的影响，缓慢且渐进地推广变更和新功能。\n\
  \n不同的环境可能面临不同的挑战，但通过考虑特定环境的关键因素（如数据类型、数据大小等）来设计数据管道，对于确保管道功能正常并能良好扩展至关重要。另一个重要的挑战是，要确保通过监控和指标提供运维可见性，且这种可见性要具备适当的细粒度，并覆盖系统的各个独立组件。\n\
  \n## 发布到 Kafka\n\n正如我们之前讨论的，有多种方法可以实现管道中源数据提取部分的集中化和整合。这有助于促进源数据在下游数据流中的高效重用和分发，并避免数据收集和聚合过程中的冗余。集中式数据存储模型有几种选择，从简单的中心数据存储（如平面文件、数据库）到高度分布式且可扩展的数据存储，后者能提供可扩展性并支持多个消费者并行处理。\n\
  \nApache Kafka 是高吞吐量用例下作为中央数据存储的绝佳选择，并能为下游消费提供流式数据。以下摘自 Kafka 官方网站的详细信息描述了 Kafka\
  \ 的关键能力和特性。Apache Kafka 是一个分布式流处理平台。这到底是什么意思？Kafka 擅长做什么？\n\n我们认为流处理平台具有三个关键能力——\n\
  \n1.  它允许你发布和订阅记录流。在这方面，它类似于消息队列或企业级消息系统。\n2.  它允许你以容错的方式存储记录流。\n3.  它允许你在记录发生时对其进行处理。\n\
  \n它被用于两大类的应用——\n\n1.  构建实时流式数据管道，在系统或应用之间可靠地传输数据。\n2.  构建转换数据流或对数据流做出响应的实时流式应用。\n\
  \n为了理解 Kafka 如何做到这些，让我们深入探讨，从底层向上探索 Kafka 的能力。\n\n1.  Kafka 作为一个集群运行在一台或多台服务器上。\n\
  2.  Kafka 集群将记录流存储在称为主题的类别中。\n\n每条记录包含一个键、一个值和一个时间戳。Kafka 有四个核心 API——\n\n1.  `Producer`\
  \ API 允许应用向一个或多个 Kafka 主题发布记录流。\n2.  `Consumer` API 允许应用订阅一个或多个主题，并处理发布到这些主题的记录流。\n\
  3.  `Streams` API 允许应用充当流处理器，从一个或多个主题消费输入流，并产生输出流到一个或多个输出主题，从而有效地将输入流转换为输出流。\n4.\
  \  `Connector` API 允许构建和运行可重用的生产者或消费者，将 Kafka 主题连接到现有的应用或数据系统。例如，一个连接到关系数据库的连接器可能会捕获对表的每一次更改。\n\
  \n在 Kafka 中，客户端和服务器之间的通信是通过一个简单、高性能、与语言无关的 `TCP` 协议完成的。该协议有版本控制，并与旧版本保持向后兼容。Kafka\
  \ 客户端支持多种语言。关于主题结构、分区、Kafka 内部消息的更多细节，请参考官方文档或互联网上丰富的资料。\n\n让我们聚焦于在数据管道内利用 Kafka\
  \ 作为集中式数据存储的实际方面。\n\n通常，数据可以以任何格式发布到 Kafka。数据可以通过 Kafka 生产者以分隔格式甚至非结构化格式推送到 Kafka。但是，推送数据的结构/格式对于促进下游消费者可靠地消费数据至关重要。通过以标准化格式发布数据来最小化数据生产者和消费者之间的隔离非常重要。如果格式是如\
  \ Avro 这样的自描述格式，那将极大地简化数据消费者的工作，因为他们可以使用预定义的模式，连同其元数据一起消费数据。使用模式编码的数据保证符合模式定义中定义的数据类型和约束。\n\
  \n\n\n## 模式与数据\n\n正如我们之前讨论的，使用定义模式的关键优势之一是能够对数据强制执行模式和约束验证。让我们以使用 Avro 模式将数据发布到\
  \ Kafka 为例。\n\n从数据源提取的数据经过处理并编码为 Avro 格式。Avro 序列化的记录作为事件发布到 Kafka，可供下游消费者消费。发布事件的粒度取决于具体的用例。这意味着：相同的数据源可以以相同的记录粒度写入，也可以根据需求在某种程度的聚合后写入。具有不同聚合级别的相同数据也可以写入不同的\
  \ Kafka 主题。\n\n数据被写入消费者可以订阅的 Kafka 主题。Kafka 还允许在数据主题上实施 ACL，从而实现访问安全。\n\n### 示例模式\n\
  \n为了更好的可扩展性，数据应使用通用模式写入 Kafka。如果需求是将数据从源 MySQL 数据库发布到 Kafka，作为数据管道的一部分，那么我们假设所需的粒度是源记录级别。\n\
  \n如果源 MySQL 数据库有 1,000 张表，那么在发布到 Kafka 之前用于编码数据的 Avro 模式对于这 1,000 张表将是不同的，因为表结构不同。显然，随着数据源/表数量的增加，这可能会变得复杂。\n\
  \n解决这个问题的一个有效方法是使用通用模式，如下所示：\n\n```\n{\n\"type\" : \"record\",\n\"name\" : \"generic_payload\"\
  ,\n\"namespace\" : \"test.Kafka_producer\",\n\"fields\" : [ {\n\"name\" : \"table_name\"\
  ,\n\"type\" : \"string\"\n}, {\n\"name\" : \"schema_id\",\n\"type\" : \"long\"\n\
  }, {\n\"name\" : \"payload\",\n\"type\" : \"bytes\"\n} ]\n```\n\n上面的模式使用通用格式为所有表发布数据。`payload`\
  \ 字段存储实际的负载数据，对于不同的表，该数据会有所不同。对于由 `schema_id` 字段指定的负载模式将被使用。此模式对于不同的表是不同的。下游消费者可以引用模式\
  \ ID 值，并使用它来反序列化负载数据。\n\n当然，此流程还需要一个地方供消费者获取与 `schema_id` 字段值对应的实际模式。需要一个中央存储库供消费者获取不同模式\
  \ ID 对应的模式。我们将在后续章节中详细介绍此模式存储库。\n\n通常，相同的通用负载可以用于为表 `t1` 发布带有模式 `s1` 的 `payload1`，以及为表\
  \ `t2` 发布带有模式 `s2` 的 `payload2`。这也允许给定表的模式演化，例如表 `t1` 的模式 `s1` 可以更改为 `s1_new`。由于\
  \ ID 本身包含在负载中，下游消费者可以使用新 ID 来获取新模式。\n\n### 模式存储库\n\n正如我们之前讨论的，需要一个中央模式存储库来使通用负载和消费流程无缝协作。该存储库可以是一个简单的表和/或\
  \ API，所有消费者都可以访问它。与数据集对应的 Avro 模式将使用一个 ID（可以是模式本身的简单哈希）发布到模式存储库。这个 ID 将被嵌入到数据中（来自提供的示例模式中的\
  \ `schema_id` 字段值）。\n\n作为将数据发布到 Kafka 的一部分，Kafka 生产者有责任使此模式存储库保持最新的模式信息。来自新数据源的新模式以及现有源的演化都需要在数据发布到\
  \ Kafka 之前持久化到模式存储库，以便消费者可以继续无缝消费数据。当然，如果新模式向后兼容，即使新模式尚未就绪，消费者也可以继续访问数据。通常，使给定数据集的新版本\
  \ Avro 模式向后兼容是一种很好的做法。\n\n![A454145_1_En_3_Fig4_HTML.jpg](img/A454145_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\n从源数据到数据处理器（通过 Avro 序列化）的流程\n\n### 多个主题与分区\n\n发布到 Kafka 的数据从提供并行消费能力的\
  \ Kafka 主题中被消费。从技术上讲，这意味着你可以将所有数据发布到一个主题，并让所有消费者都从该主题读取数据。\n\n但是，这种方法存在实际的限制和考虑因素。例如，来自\
  \ 100 张表的数据被发布到单个 Kafka 主题。某个特定消费者只需要这 100 张表中的一张表的数据。该消费者可能需要处理对应于 100 张表的大量数据，才能找到其感兴趣的数据。这可能会给消费者引入不必要的延迟。\n\
  \n通过将那张特定的表写入另一个不同的主题，可以使此管道高效得多。这将为上述消费者实现更快的处理和消费。通常，这种将所需数据组织在不同主题中的方法，将极大地有助于最小化消费者的延迟。这并不总是意味着每张表都写入一个不同的主题；但发布策略需要进行优化，以最小化消费延迟，避免任何消费者处理并跳过大量数据。\n\
  \n类似地，在并行消费方面，可以利用 Kafka 主题内的分区来进一步推进这种优化策略。写入主题的数据可以按特定字段进行分区。例如，源表中的数据包含不同客户的多租户数据；每个客户由一个客户\
  \ ID 标识。在这种情况下，接收此表数据的 Kafka 主题可以按客户 ID 进行分区，以便不同的客户可以高效地并行处理。通过在源数据集中智能地按适当字段对数据进行分区，可以实现类似的优化。\n\
  \n### 规模与扩展\n\n通常，Kafka 由于其固有的分布式特性，可以很好地扩展以应对繁重的工作负载。但是，当数据事件的平均大小增加时，性能可能开始下降。具体来说，如果存在消息大小较大（>\
  \ 1MB）的事件，它们可能会对整个主题的消费产生不利影响。\n\n有一些设置可以调整以允许较大的消息大小；但与许多其他参数一样，这些设置也伴随着权衡。在最坏的情况下，一个非常大的消息可能会降低整个\
  \ Kafka 主题的性能。\n\n对于消息大小较大的用例，需要采用实用的解决方案。解决此事件大小问题的方法之一是将大消息分割成多个小消息，并在消费时重新组装。你可以开发自己的自定义\
  \ Kafka 客户端（消费者和生产者组合），以满足你的需求，处理分割和重新集成。只有少数开源 Kafka 客户端提供这种分区能力。\n\n\n\n#### 工具\n\
  \n将数据发布到 Kafka 最便捷的方式是，针对所使用的 Kafka 版本，自行实现并维护利用 Kafka 客户端的发布代码。每个 Kafka 版本都有相应的\
  \ Kafka 客户端可用。那些积极投资于 Kafka 基础设施并为开源社区做出贡献的公司，会发布其定制的 Kafka 版本和客户端。尽管这种方法要求所有者实现并维护代码和基础设施来管理向\
  \ Kafka 发布数据，但在 schema 和数据管理方面，它提供了最大的灵活性，并且可能具有最佳的性能。\n\n有许多现成的工具可以接入源数据存储，并将数据发布到\
  \ Kafka。这些工具允许指定 Kafka 设置参数，并将数据直接发布到 Kafka 主题。\n\n然而，它们在 schema 管理、主题和分区管理方面存在局限性。数据管道将不得不围绕这些有限的功能进行适配，以便将数据流调整到这些工具内可用的选项。\n\
  \n例如，Oracle GoldenGate 提供了一个大数据适配器插件，可以将来自 Oracle 和 MySQL 表的数据直接发布到 Kafka。此插件提供发布到单个主题以及每个表一个主题的能力。它还提供了一个包含负载的通用\
  \ schema（类似于上面讨论的），以及将 schema 变更发布到一个 schema 主题的能力。\n\n像这样的工具能够提供即时且便捷地发布源数据的能力。但在灵活地将数据分布到多个主题和分区方面，存在明显的局限性和权衡。此外，目前的通用负载非常僵化，缺乏灵活性，无法根据需要添加更具描述性的字段，例如事件标识时间戳。\n\
  \n其他数据存储也存在类似的工具。但它们几乎总是在功能和设计上存在局限性。如果它们提供的功能足够好，最佳方法就是利用这些工具来简化数据管道。\n\n## 结论\n\
  \n本章讨论了使用 Kafka 进行变更数据捕获和事件流机制的原理。在本章中，我们始终坚持一个事实：基础原理和策略远比执行更为关键。如果我们充分理解数据源，并清楚变更如何进一步流向消费者，我们就可以规划出一个高效且稳定的实现方案。\n\
  \n在下一章中，我们将开始探讨数据湖中的数据处理策略。这对于具有数据库开发背景的读者来说将非常有趣。读者将理解如何使用 Hive、Pig 和 Spark 在数据湖中处理数据的方法。\n\
  \n"
- "# 4. 数据湖中的数据处理策略\n\n> 在拓荒时代，人们用牛来拉重物，当一头牛拉不动一根圆木时，他们不会试图去养一头更大的牛。我们不应该试图制造更大的计算机，而应该制造更多的计算机系统——格雷斯·霍珀，美国计算机科学家\n\
  \n数据分析的趋势具有颠覆性。说在数据分析从业者群体中，存在着关于数据处理的精益思想流派，以及提取对业务有意义的洞察的流派，这是一种轻描淡写的说法。随着对数据需求的急剧增长，数据管理实践已经成倍增加；这反过来又强化了行业中的高级分析专业知识和数据管理策略。制定数据策略背后的思考过程是由用例驱动的，并辅以技术能力、学习动力，以及最重要的是，挑选关键发现并将其放大为可操作的洞察以吸引客户和推动业务的能力。数据分析实践取得成功的秘诀在于维持一个“序言”，该序言设想了与业务用例一致的最终目标；无论是短期还是长期。在之前的章节中，我们讨论了数据分析的支柱，即数据工程、数据发现、数据科学和数据可视化。数据工程提供了一个相对更大的领域，涵盖了数据摄取原则、处理技术以及开发。\n\
  \n数据工程的方法涵盖了数据摄取和数据处理。自从谷歌发表了关于分布式框架的白皮书以来，通过一系列耀眼的创新，数据分析的范畴已经达到了一定的成熟度。这些创新贯穿了不同的层面，如数据摄取、处理、工程方法和数据表示。在最后两章中，我们解决了将数据引入数据湖的挑战。本章的重点是理解如何访问数据湖中的数据。我们将从经典的并行计算框架开始，涵盖关键主题，包括使用\
  \ Hive 在数据湖中进行数据仓库建设、使用 Pig 进行数据操作，以及现代处理框架，即 Spark。\n\n## MapReduce 处理框架\n\n2004\
  \ 年，谷歌工程师杰弗里·迪恩和桑杰·格玛瓦特发表了一篇关于分布式处理框架的白皮书¹。该白皮书阐述了一个在操作上分布式的框架，旨在处理海量数据。以下是他们的原话：\n\
  \n> “我们的抽象概念受到 Lisp 和许多其他函数式语言中存在的 map 和 reduce 原语的启发。我们意识到，我们的大多数计算都涉及对输入中的每个逻辑“记录”应用\
  \ map 操作，以计算一组中间键/值对，然后对所有共享相同键的值应用 reduce 操作，以便适当地合并派生数据。”\n\n简而言之，MapReduce 是一个用于大规模数据集的并行处理框架。让我们先粗略地看一下这个编程模型。在专用的处理范式中，数据计算层是静态的。在处理过程中，数据从存储层移动到处理层。另一方面，在分布式处理框架中，计算逻辑被下推到存储层。这意味着一个处理单元被实例化，并且每个“处理”实例都下放到数据所在的节点上。这种方法从稳定性到优化角度都带来了巨大的好处。程序单元的一个实例在\
  \ Java 容器（JVM）内的数据节点上本地运行。它消耗驻留在本地磁盘上的一部分数据。由于处理过程在多个节点上并行运行，负载分散到整个集群；从而极大地提高了性能。此外，与过去不同，网络永远不会成为瓶颈，因为没有数据移动。\n\
  \n\n\n### 动机：为什么需要 MapReduce？\n\n> “MapReduce 的美妙之处在于任何程序员都能理解它，而其力量则源于能够通过那个简单接口调动数千台计算机。”——著名计算机科学家大卫·帕特森。\n\
  \n为什么我们需要一个分布式处理框架？其动机与该范式本身一样鲜明而简单。在标准的面向过程的架构中，两个系统通过消息（消息处理接口）进行交互。在分布式环境中，每个节点通过\
  \ `SEND` 和 `RECEIVE` 消息进行交互。消息一旦发出，另一个节点必须接收并回传确认位。网络相关的通信不仅会增加延迟，而且集群节点间通信的任何丢失都会影响集群的健康状况。在处理海量数据时，网络确实会成为瓶颈。考虑以下场景：当一个算法处理大量数据，或者你需要对\
  \ PB 级和 TB 级的数据进行排序时。\n\n为了防止网络拥塞，可以将处理过程下推到商用集群的节点上。利用节点上的数据子集，处理操作会生成中间输出文件。reducer\
  \ 操作对这些中间输出文件进行处理，以聚合或合并最终输出。“下推”操作是指将进程实例分配给数据节点，并将值映射到键的步骤，而值的聚合则是对多个中间输出进行 reducer\
  \ 操作以生成最终输出。因此，包含 map 和 reduce 任务的操作被称为 MapReduce。\n\n在 Hadoop 0.20 版本中可用的 MapReduce\
  \ 风格被认为是 MapReduce 的第一版。在 Hadoop 0.23 中，MapReduce 框架引入了一个名为 YARN（另一种资源协调器）的资源管理组件。我们将在复习完\
  \ MapReduce V1 的概念之后介绍 YARN。\n\n### MapReduce V1 复习与设计考量\n\n图 4-1 展示了经典 MapReduce\
  \ 操作中涉及的组件。\n\n![A454145_1_En_4_Fig1_HTML.jpg](img/A454145_1_En_4_Fig1_HTML.jpg)\n\
  \n*图 4-1 一个经典的 MapReduce 操作*\n\n作为快速复习，让我们聚焦于 MapReduce 框架的关键要点——\n\n1.  两个主要阶段：map\
  \ 和 reduce。两个阶段的输入和输出数据格式均为键值对。\n    1.  从数据访问和可用性角度来看，基于键值的数据分布至关重要。\n    2.  Key\
  \ 和 Value 是 Java 对象。\n        1.  Value 实现 `Writable` 接口。\n            1.  `Writable`\
  \ 使得序列化快速且简单。\n            2.  例如 `IntWritable`、`LongWritable`、`FloatWritable`、`DoubleWritable`、`Text`。\n\
  \        2.  Key 实现 `WritableComparable` 接口。\n            1.  可以对 `WritableComparable`\
  \ 进行比较以确定顺序。\n2.  Mapper 任务在所需数据块所在的节点上并发运行。这避免了通过网络传输数据，并带来了并行处理的优势。Mapper 任务在节点本地或指定位置生成中间输出文件。\n\
  \    1.  Map 是一个无状态操作。\n    2.  继承 `Mapper` 基类。`LongWritable` 和 `Text` 是输入键值类型。`Text`\
  \ 和 `IntWritable` 是输出键值类型。Key 是 `WritableComparable`，而 Value 是 `Writable`。\n\n```\n\
  \        public class SampleMap extends Mapper\n```\n\n3.  可以创建 Map 方法进行实际实现。\n\
  3.  Mapper 类——\n    1.  根据 mapper 类的逻辑，将输入键值对转换为中间键值对。\n    2.  输入和输出文件格式在类型和数量上可能不同。\n\
  \    3.  每个由 `InputFormat` 生成的输入分片对应一个 map 任务。`InputFormat` 在驱动代码中指定，其中包含——\n  \
  \      1.  HDFS 上的输入数据位置。\n        2.  如何创建输入分片。\n        3.  创建 `RecordReader`，在\
  \ mapper 使用数据之前将其解析为键值对。\n        4.  `TextInputFormat` 会创建 `LineRecordReader` 对象。\n\
  \        5.  其他标准输入格式——\n            1.  `FileInputFormat` —— 所有基于文件的 InputFormat\
  \ 的抽象基类。\n            2.  `KeyValueTextInputFormat` —— 以 '\\n' 结尾的行被视为 [键值] 对（制表符分隔）。\n\
  \            3.  `SequenceFileInputFormat` —— [键值] 对二进制文件。\n            4.  `SequenceFileAsTextInputFormat`\
  \ —— 将 [键值] 映射为 `key.toString()` 和 `value.toString()`。\n4.  只有当所有 mapper 任务都完成后，reducer\
  \ 任务才会在节点上并行启动。\n    1.  可以通过使用上下文方法写入输出键值对，将 Mapper 的输出存储在 HDFS 中。\n5.  Reducer\
  \ 操作内部使用中间阶段（如 combiner 以及排序和 shuffle）来优化功能。\n    1.  单个 reducer 或多个 reducer。\n\
  \    2.  继承 `Reducer` 类并重写 Reduce 函数。注意输入和输出键值对参数。Key 是 `WritableComparable`，而 Value\
  \ 是 `Writable`。\n\n```\n        public static class Reduce extends Reducer\n```\n\
  \n\n\n### 6. Reducer 类\n1.  Shuffle 和 Sort 阶段在 Mapper 阶段结束后开始，并在为 Reduce 操作获取输入时进行。\n\
  \    - **Shuffle（洗牌）** – 将单个机器上与某个键关联的所有值进行整理\n    - **Sort（排序）** – 对输入的键应用归并排序\n\
  2.  Reducer 对与每个键关联的所有值调用（顺序的）聚合函数。与键关联的 Reducer 输出，通过上下文对象写入`RecordWriter`。\n3.\
  \  并行性是通过对多个键进行并发的 Reducer 操作来实现的。\n\n### 7. Map 和 Reduce 类\nMap 和 Reduce 类必须打包成一个作业才能提交给`JobTracker`。\n\
  \n### 8. JobTracker 和 TaskTracker\n1.  `JobTracker`是主守护进程，负责分配 Mapper 并跟踪任务执行进度。\n\
  2.  `TaskTracker`是从守护进程，运行在数据节点上，负责启动 JVM 来执行 Mapper/Reducer 操作。\n\n### 9. MapReduce\
  \ 流程架构（图 4-2）\n![A454145_1_En_4_Fig2_HTML.png](img/A454145_1_En_4_Fig2_HTML.png)\n\
  图 4-2：MapReduce 面向流程的架构\n\n### 10. SETUP 和 CLEANUP 方法\n1.  `SETUP`方法用于执行 Mapper\
  \ 前操作，如初始化数据结构、读取外部数据、设置自定义参数或状态检查。它首次在 map 方法执行前运行。\n2.  `CLEANUP`方法用于在作业操作结束后执行特定操作。\n\
  \n### 11. 仅 Map 操作\n1.  数据采样、ETL 或图像处理只需要 Mapper 阶段。\n2.  将 Reducer 数量设置为 0。\n3.\
  \  `Job.setNumReduceTasks(10)`\n4.  使用`job.setOutputKeyClass`和`job.setOutputValueClass`替代`job.setOutputKeyClass`和`job.setMapOutputValueClass`。\n\
  5.  因此，`context.write`会将输出的键值对写入 HDFS，而不是数据节点。\n\n### 12. Reducer 的数量\n1.  默认使用单个\
  \ Reducer。\n2.  如果最终输出中的所有键都需要排序，则仅使用单个 Reducer。\n3.  在以下情况下，单个 Reducer 可能成为瓶颈：\n\
  \    - Mapper 输出有多个键。\n    - 待处理的数据量巨大。\n    - 对 Mapper 的键进行分区是一种良好的实践。\n\n### 13.\
  \ 压缩\n通过在 Map 和 Reduce 阶段后压缩输出，压缩可以提高性能。\n1.  将`mapred.output.compress`设置为`TRUE`以在作业输出级别启用压缩。\n\
  2.  将`mapred.comperss.map.output`设置为`TRUE`以启用 Mapper 输出的压缩。\n3.  支持的压缩编解码器 – Java\
  \ zlib、LZO、bzip2。\n\n### 14. 推测执行\n如果一个任务运行缓慢，Hadoop 会尝试运行它的多个实例。哪个任务先完成就视为成功，其余所有实例都会被暂停。要在\
  \ Map 和 Reduce 阶段启用推测执行，请设置以下两个参数：\n- `Mapred.map.speculative.execution = true`\n\
  - `Mapred.reduce.speculative.execution = true`\n\n### 15. 局限性\n1.  **可扩展性受限** –\
  \ `JobTracker`运行在单个数据节点上，负责执行资源管理、任务调度和监控等任务。\n2.  `JobTracker`暴露了单点故障。如果`JobTracker`失败，所有\
  \ Mapper 操作都会中止。\n3.  **资源管理次优** – 对于`TaskTracker`，Mapper 和 Reducer 进程的数量是预先固定好的，无法灵活利用。即使有未使用的\
  \ Reducer 槽位可用，`TaskTracker`也无法添加超过上限的 Mapper。\n\n### 16. 遵循 MapReduce 思路的其他框架\n\
  1.  **Microsoft Dryad** – 基于有向图的处理，程序作为顶点，通道作为边。多个程序通过单向通道连接。\n2.  **Yahoo! S4**\
  \ – 它是一个通用的分布式流式计算平台，用于处理无界数据流。\n3.  **Google Pregel**\n4.  **Twitter Storm**\n\n\
  ---\n\n## 另一种资源协调者 – YARN\n\nMapReduce 2.0 (MR2) 或 YARN 是在 Hadoop-0.23 中引入的，旨在通过解决\
  \ MapReduce V1 (MR1) 的复杂问题来对其进行改造。在经典的 MapReduce 框架中，集群利用率、资源管理和作业监控等关键因素被重新分配以达到最佳水平。与\
  \ MR1 不同，集群必须被视为一个资源网格，其中资源可以根据需要分配或释放。\n\n在 MR2 中，通过维护一个用于资源管理和作业调度的中央主体来组织资源分配和作业操作。图\
  \ 4-3 列出了使用 YARN 的好处。\n\n![A454145_1_En_4_Fig3_HTML.png](img/A454145_1_En_4_Fig3_HTML.png)\n\
  图 4-3：YARN 的好处\n\n为了实现有效的资源管理，YARN 架构采用两个组件 – 全局资源管理器 (RM) 和应用管理器 (AM)。全局资源管理器是一个中央主体，主要负责控制\
  \ Hadoop 集群中的资源利用率。应用管理器负责处理正在数据节点上执行的应用的任务操作。它由全局资源管理器 (RM) 启动，为任务监督资源，并与节点管理器通信以调度、执行和监控任务。\n\
  \nYARN 通过检查`applicationMaster`的状态来确保任务执行的可用性。如有必要，`ApplicationMaster`可以从其上次执行的状态重新启动。`Zookeeper`有助于实现从主`ResourceManager`到备用`RM`的故障转移机制。\n\
  \n### YARN 概念\n\nYARN 的工作方式是每个 MapReduce 操作都会实例化成一个 YARN 应用。让我们快速回顾一下 YARN 的关键概念：\n\
  \n1.  **全局 ResourceManager** – 负责集群级别的端到端资源管理。\n    - 将其当前状态属性转储到 Zookeeper 中以实现高可用性。\n\
  \n2.  **两个主要组件**：\n    - **调度器 (Scheduler)** – 为应用分配资源。它接收并整理来自`ApplicationMaster`的所有请求，并根据优先级和容量进一步分配资源。\n\
  \    - **应用管理器 (ApplicationsManager)** – 通过`ApplicationMaster`管理作业操作。它确保作业处于活跃状态、经过优化，并且\
  \ AM 具有平稳的生命周期。\n\n3.  **NodeManager** – 在每个从节点上运行的代理，负责启动应用容器、与`Scheduler`协调调度任务以及资源监控。`NodeManager`和`ResourceManager`的联合行动构成了一个稳定的数据处理框架。\n\
  \n4.  **Application Master** – 根据`ApplicationManager`的指示与`NodeManager`合作，为容器分配任务。它可以针对每个应用进行自定义开发以满足需求，并根据定义的\
  \ SLA 协调作业操作。\n\n5.  **Container** – 容器是一个 JVM，充当应用任务执行的“家园”。在 MapReduce-1 中，`JobTracker`会为\
  \ Mapper 和 Reducer 分配槽位；这些槽位是固定的，无法确保最佳的资源利用率。容器通过在任务执行过程中进行交换，并支持基于内存和计算能力等参数进行分配，取代了固定槽位的方法。`ContainerLaunchContext`表示一个对象，其中包含启动容器所需的资源以及要执行的命令。\n\
  \n![A454145_1_En_4_Fig4_HTML.png](img/A454145_1_En_4_Fig4_HTML.png)\n图 4-4\n\n\n\
  \n## YARN 的子组件级设计\n\nYARN 应用程序的执行遵循以下步骤：\n\n1.  客户端向资源管理器（`RM`）提交应用程序。\n2.  `ApplicationManager`\
  \ 守护进程启动并向 `RM` 注册。它估算应用程序所需的资源。\n3.  `RM` 与节点管理器（`NM`）协调，在其中一个节点上启动 `ApplicationMaster`（`AM`）。\n\
  4.  `AM` 从 `NameNode` 收集请求详情，并向 `RM` 提交资源请求以执行任务。\n5.  `RM` 将来自 `AM` 的请求放入队列，直到工作节点上的资源被释放。\n\
  6.  `AM` 从 `RM` 接收容器，以在特定主机（从节点）上执行应用程序任务。\n7.  `AM` 与 `NodeManager` 协调，将任务分配给容器。`NodeManager`\
  \ 协助进行任务调度和资源监控。\n8.  成功执行后，`AM` 向全局资源管理器确认作业状态。\n\n### 资源模型与资源协商要点\n\n1.  每个节点可以启动多个大小为\
  \ 512M 或 1G 的容器。\n2.  每个应用程序的 `ApplicationMaster` 根据资源需求请求容器，并受限于应用程序的容量上限。\n3.\
  \  在其协议中，`ApplicationMaster` 指定主机名、资源需求、容器和优先级。\n4.  在 MR2 中，集群资源不会被划分为映射器或归约器槽位。\n\
  5.  `RM` 的调度器持续关注集群资源利用率，并通过检查应用程序、用户或队列的限制指标来防止资源过度分配。\n6.  资源监控 – `NodeManager`\
  \ 将资源使用指标发送给 `RM 调度器`。\n\n### YARN 实现要点\n\n1.  启动一个 `YarnClient` 类型的 YARN 客户端：\n\
  \    -   `YarnClient.createYarnClient();`\n2.  创建一个 `YarnClientApplication` 类型的应用程序：\n\
  \    -   `testYarnClient.createApplication()`\n3.  设置应用程序上下文：\n    -   `testYarnClientApp.getApplicationSubmissionContext`\n\
  4.  使用 `Resource` 对象设置应用程序上下文的资源需求：\n    -   `Resource.newInstance(memory, cores);`\n\
  5.  启动一个 `ContainerLaunchContext` 对象的容器：\n    -   `ContainerLaunchContext.newInstance(localResource,\
  \ environment, byteBuffer Tokens, application acls)`\n    -   `applicationContext.setAMContainer([ContainerLaunchContext])`\n\
  6.  设置 `Priority` 对象的应用程序优先级：\n    -   `Priority.newInstance(priority)`\n    - \
  \  `applicationContext.setPriority([Priority])`\n7.  提交应用程序：\n    -   `testYarnClient.submitApplication(testAppContext)`\n\
  \n### YARN Web UI\n\nYARN Web UI 提供了比 Hue 更详细的任务执行视图。它运行在 `ResourceManager` 主机上，该主机也是其在\
  \ UI 上的入口点。请注意，无法从 UI 控制任何 YARN 执行。\n\n### YARN 作业历史\n\nYARN 不追踪作业历史。Spark 和 MapReduce\
  \ 提供了作业历史服务器，用于归档作业详情（元数据和指标），并且可以通过 Hue 或其自己的 UI 进行访问。\n\n## Hive\n\n人们普遍认为 Hadoop\
  \ 平台已经很好地解决了数据量的挑战；无论是存储容量还是数据处理能力。自非传统数据源出现以来，数据的表现形式发生了根本性变化。以数据为中心的挑战不仅仅是数据量和速度，处理和操作处理增加了所谓“数据挑战”的复杂性。\n\
  \n大多数数据处理层都是用低级语言编写的。越来越多的学派指出，数据处理层的主要实现者和执行者是数据开发和数据分析专业人员，他们可能不熟悉 Java 或其他低级语言。数据库专业人员对结构化数据处理语言感到得心应手。这种需求催生了查询语言的概念化，这些语言可以改造\
  \ Hadoop 处理层，并在 MapReduce 之上提供一个抽象层。\n\nHive 项目由 Facebook 于 2007 年启动。它为在 Hadoop\
  \ 上执行数据仓库的非 Java 从业者提供了一种解决方案。Hive 使用一种类似 SQL 的声明式查询语言 `HiveQL` 与 Hadoop 集群通信。它与\
  \ SQL 语义的高度相似性是其被数据分析社区广泛采用的主要原因。\n\nHive 是为数据专业人员提供可扩展性和易用性而创建的。Hive 查询的性能可能比预期的慢得多，因为低延迟从来不是\
  \ Hive 的目标之一。它不是为在线事务处理而设计的。然而，通过诸如 Tez 和 Long Live and Process（`LLAP`）等最新工作，可以针对低延迟需求优化\
  \ Hive 的性能。我们将在本章后面讨论这些主题。\n\n![A454145_1_En_4_Fig5_HTML.jpg](img/A454145_1_En_4_Fig5_HTML.jpg)\n\
  \n**图 4-5** – Hive 以数据为中心的能力与关键数据仓库目标保持一致\n\n### Hive – 快速回顾\n\n在本节中，我们将快速回顾 Hive\
  \ 的架构、能力和概念。由于 Hive 在 MapReduce 之上形成了一个抽象层，所有 `HiveQL` 语句都被转换为 MapReduce 作业，然后在\
  \ Hadoop 集群上执行。\n\n标准查询的基本结构表明，它必须使用结构化格式的数据源，而不是平面文件。Hive 能够为各种数据格式提供结构，即对非结构化数据集进行“读取时定义模式”。这是通过\
  \ Hive 元存储实现的，它充当包含表定义的目录。\n\n#### Hive 组件\n\n以下是通过 Hive 执行查询所涉及的组件列表。\n\n1.  **交互式\
  \ shell** – 发起查询的环境。\n2.  **Hive 驱动** – 接收查询请求，负责查询操作，例如创建会话处理器并将查询传递给编译器。\n3. \
  \ **编译器** – 解析查询，在元存储中查找对象验证，并生成优化的执行计划。\n    -   由解析器、语义分析器、逻辑计划生成器和查询计划生成器组成：\n\
  \        -   语义分析器通过访问元存储获取表定义和列属性，对查询进行完整性检查。\n        -   计划生成器负责将执行计划转换为 MapReduce\
  \ 任务。\n    -   优化包括对不同查询块进行性能分析并实现计划转换。例如，元存储查找可以揭示表的分区策略，查询谓词可以确定是否可以修剪分区。类似地，隐式数据类型转换也在编译级别得到处理。\n\
  \    -   执行计划是一个有向无环图（`DAG`），其中包含查询执行所涉及的操作阶段。\n4.  **执行引擎** – 获取数据并准备查询结果集的物理操作。\n\
  5.  **Hive 元存储** – 它是 Hive 操作的核心。它构建了一个数据抽象层，并能够将数据可变性提炼为定义的形状和结构，即模式和表定义。\n   \
  \ -    `HiveServer` 或 `HiveServer2` 为外部应用程序提供通过 `JDBC`/`ODBC` 连接的 Thrift 接口。\n\n\
  图 4-6 中的架构图展示了 Hive 不同组件之间的连接。\n\n![A454145_1_En_4_Fig6_HTML.jpg](img/A454145_1_En_4_Fig6_HTML.jpg)\n\
  \n**图 4-6** – Hive 架构\n\n\n\n#### Hive Metastore（又称 HCatalog）\n\nHive Metastore\
  \ 是 Hive 查询系统的中央模式存储库，用于存储 Hive 数据模型（表、分区和桶）的元数据、序列化器和反序列化器，以及 HDFS 文件位置信息（图 4-7）。关系型数据库存储作为\
  \ Hive Metastore 的后端。其后端部分由名为 Data Nucleus 的对象关系映射解决方案实现。Hive Metastore 可以与 Derby、MySQL、SQL\
  \ Server、Oracle 和 Postgres 等关系型数据库打包使用。关系数据范式提升了可靠性，并带来了查询元数据的能力。\n\nMetastore 与\
  \ Hive 服务或高级查询处理系统紧密耦合。一旦在 Hive Shell 中创建表，其定义会立即存储在 Hive Metastore 中。通过这种方式，Hive\
  \ 服务确保了数据与 Metastore 之间的同步。另一方面，像 Pig 和 Spark 这样的其他处理框架可以利用 Hive Metastore，并复用预定义的模式定义和数据模型。\n\
  \nHive Metastore 为 Hive 服务和外部客户端公开了一个 Metastore API 服务。Hive 服务使用 Metastore 服务在 Metastore\
  \ 中存储表和分区元数据。外部客户端在执行查询期间调用 Metastore 服务来访问 Metastore，以获取表或分区信息。\n\nHive Metastore\
  \ 可以在以下三种模式下运行：\n\n1.  **嵌入式 Metastore** – Hive、Metastore API 和数据库服务这三个服务都运行在单个\
  \ JVM 容器内。它使用 Derby 作为默认数据库。一次只能打开一个 Hive 会话。\n2.  **远程 Metastore** – Hive、Metastore\
  \ API 和数据库服务这三个服务运行在独立的容器中。外部客户端可以通过 Thrift 服务连接到 Metastore。要设置远程 Metastore，必须在\
  \ Hive 服务级别配置 Metastore URI（设置 `hive.metastore.uris = thrift://host:port`）。\n3.\
  \  **本地 Metastore** – Hive 和 Metastore API 服务运行在单个 JVM 内。其底层数据库是运行在独立 JVM 中的 MySQL。多个\
  \ Metastore API 请求可以使用 JDBC 或 ODBC 驱动程序库连接到数据库。请注意：\n\n    ![A454145_1_En_4_Fig7_HTML.jpg](img/A454145_1_En_4_Fig7_HTML.jpg)\n\
  \n    图 4-7 Hive Metastore 提供的服务不仅限于表元数据\n\n    1.  驱动程序库在 Hive 的类路径中可用。\n    2.\
  \  `javax.jdo.option.ConnectionDriverName` 设置为 `com.mysql.jdbc.Driver`\n\n#### Hive\
  \ – 设计考量\n\nHive 遵循其支持数据仓库的原则并模仿 SQL 语义，因此在临时报表、日志处理、文本挖掘、预测建模、商业智能和分析领域得到了广泛应用。在企业数据湖中，Hive\
  \ 占据着关键位置，因为数据分析师和数据科学家（最终成为数据的主要消费者）非常喜欢用 SQL 来处理数据。从预定义应用程序的角度来看，MapReduce 表现良好，但在\
  \ Java 中进行以数据为中心的临时性工作可能会非常棘手。在我们深入探讨影响 Hive 设计和开发的要点之前，先来理解 Hive 中分区、分桶和反规范化这类操作的相关性。\n\
  \n1.  **分区** – 分区采用分治机制，通过在数据处理过程中显著减少 I/O 量来发挥作用。在传统数据仓库环境中，处理性能成为数据建模和索引、统计等调优实践的函数。Hadoop\
  \ 没有索引的位置，这有助于优化数据摄取管道。然而，这也意味着即使需求仅仅是少量的数据，每个查询都必须扫描和读取整个数据集。随着数据集的不断增长，全表扫描可能会对查询性能产生负面影响。在这种情况下，分区可以通过减少处理范围并为其他以数据为中心的操作留出空间，发挥关键作用。在\
  \ Hadoop 集群中，分区或子分区将以目录的形式存在于表目录内。如果查询包含使用分区键列的谓词，分区裁剪的可能性会更大。在选择分区键时请牢记这一点，以避免\
  \ Hadoop 中产生小文件处理问题。\n2.  **分桶** – 与分区类似，分桶是处理大数据集的另一种方式，通过将大数据集切片成均匀大小的子集来实现。如果你听说过并使用过哈希分区，那么分桶是一个非常相似的概念。分桶不仅有助于均匀分布数据，还有助于连接多个表。如果表基于分桶键参与连接，那么分桶连接会以更简单、更优化的方式进行。如果被连接的桶的大小较小，那么在\
  \ Mapper 阶段进行 Map 端连接的可能性就会增加。Reducer 连接资源消耗大，通常应避免使用。\n3.  再次强调，要密切关注生成的文件，确保分桶文件不会变得太小，以免导致集群资源流失。最佳桶大小应为\
  \ HDFS 块大小的倍数或 2 的指数。\n4.  **反规范化** – 这是一种产生扁平化数据结构的技术，该结构包含数据处理所需的最大信息。在 Hadoop\
  \ 中，查询连接是最耗费资源的操作，其中 Reducer 连接是最麻烦的。如果数据集可以在经过整理的数据层中进行建模、反规范化并定期刷新，那么它就有可能避免昂贵的连接操作。分区和分桶有助于将大数据集切片以支持并行操作，而反规范化则有助于避免数据湖中昂贵的查询连接。反规范化可以简单到联合投影多个表的列，或者在表级别进行聚合和创建派生列。\n\
  \n以下是实际 Hive 在设计和发展空间方面的关键要点。\n\n1.  Hive 接口选项有：\n    1.  命令行\n        1.  Hive\
  \ Shell\n        2.  Beeline Shell\n    2.  Web UI\n        1.  Ambari\n       \
  \ 2.  Hue\n2.  Hive 数据模型 – Hive 数据模型由数据库、表、分区和桶组成\n\n![A454145_1_En_4_Fig8_HTML.jpg](img/A454145_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n\n\n## Hive 数据模型\n\n## 3. 文件处理最佳实践\n支持 `parquet`、`text`、`Avro`、`RCfile`\
  \ 和 `sequenceFile` 文件格式。\n\n#### 数据接入\n- 推荐使用 `Avro` 格式\n  - 也可使用 `JSON` 格式，但需要专门的\
  \ SerDe 处理器\n\n#### 数据暂存\n- 列式数据处理使用 `parquet` 格式\n  - 行式数据处理使用 `sequenceFile` 或\
  \ `RCfile` 格式\n\n#### 数据发布\n- 配合 `Hive` 或 `Impala` 使用时，使用 `parquet` 格式以获得更佳性能\n\n\
  ## 4. 数据类型\n对于可映射为 `Java` 原生类型的列，请使用原生数据类型。不支持大型对象数据类型（`BLOB` 和 `CLOB`）。\n- 支持复杂数据类型，如\
  \ `maps`、`arrays` 和 `structs`\n\n## 5. 视图和子查询\n`Hive` 支持视图，但不支持子查询。\n\n## 6. 分析函数\n\
  `Hive` 支持聚合函数以及窗口分析函数。\n\n## 7. Hive 对 DML 的支持\n- 支持 `insert`、`update` 和 `delete`\
  \ 操作\n- 需在 `Hive` 配置文件中设置以下参数并重启服务器\n  ```\n  set hive.support.concurrency=true;\n\
  \  set hive.enforce.bucketing=true;\n  set hive.exec.dynamic.partition.mode=nonstrict;\n\
  \  set hive.txn.manager=org.apache.hadoop.hive.ql.lockmgr.DbTxnManager;\n  set hive.compactor.initiator.on=true;\n\
  \  set hive.compactor.worker.threads=2;\n  ```\n- 只有事务表才支持更新。创建表时必须附加额外的存储子句：`TBLPROPERTIES('transactional'='true');`\n\
  \n## 8. SORT BY, ORDER BY, DISTRIBUTED BY, CLUSTER BY\n- 如果存在多个 reducer，`SORT` 将对每个\
  \ reducer 中的数据进行排序。这无法保证最终结果集是排序的。\n- `ORDER BY` 使用单个 reducer 来确保最终结果集是有序的。\n- `DISTRIBUTE\
  \ BY` 根据键列将行分布在各个 reducer 之间。但这与聚类或排序操作无关。它在 reducer 之间分配数据时很有用。具有相似模式的所有行将被分配到同一个\
  \ reducer。\n  - `DISTRIBUTED` 与 `SORT` 结合使用将在每个 reducer 内对行进行排序（即 cluster by）。\n\
  \  - `DISTRIBUTED` 与 `ORDER` 结合使用将对最终输出进行排序。\n- `DISTRIBUTED` 与 `SORT BY` 结合使用构成了对单个键列的\
  \ `CLUSTER BY` 操作。所有具有相同聚类键的行将被分配到同一个 reducer。如果分布键和排序键不同，则需要显式分组或使用 `DISTRIBUTED`\
  \ + `ORDER` 子句。\n\n## 9. 批处理\n为了将多行数据批量处理，请将配置参数 `hive.vectorized.execution.enabled`\
  \ 设置为 true。\n\n## 10. Hive 分区\n分区技术能够根据分区键列将大量数据分割成小块。\n- 支持 `hive 管理表` 和外部表的水平分区\n\
  - 分区作为表文件夹内的子目录存储。\n- 分区键应选择一个基数可控的列。如果列的基数非常高（例如时间戳），会在系统中创建过多目录，可能导致数据碎片问题。\n\
  - 分区有助于数据组织，并在输入路径级别优化数据遍历。在谓词中使用分区键的查询得益于分区剪枝，可以极大地优化查询性能。\n  - 未使用分区键的查询将进行全表扫描。\n\
  - 分区键列不应在表列规范中指定。不过，在描述对象时，它会被显示出来。\n\n```sql\nCREATE TABLE dataLake_sor\n(\nsorId\
  \   INT\n,sorName STRING\n)\nPARTITIONED BY (userId STRING)\nROW FORMAT DELIMITED\n\
  FIELDS TERMINATED BY '\\t'\n```\n\n- 静态分区表示分区键列的值在加载前是已知的并用于加载。\n- 动态分区有助于将数据从非分区表迁移到分区表。无需为分区键列的每个不同值单独运行加载，可以直接使用列名。\n\
  - 动态分区插入 – 如果源表中已存在分区键列，则在插入时可以跳过显式的分区值。\n  - 对于分区键的每一个不同值，系统会自动在 RDS 表中添加一个分区。\n\
  - 以下参数控制动态分区插入功能：\n  - `hive.exec.max.dynamic.partitions.pernode` (默认值 100) - 任何给定的\
  \ Mapper 或 Reducer 可以创建的最大动态分区数\n  - `hive.exec.max.dynamic.partitions` (默认值 1000)\
  \ - 单个 `HiveQL` 语句可以创建的动态分区总数\n  - `hive.exec.max.created.files` (默认值 100000) -\
  \ Mapper 和 Reducer 创建的最大文件总数\n\n## 11. Hive 分桶或聚类\n这是一种优化技术，用于将表数据均匀分布在多个桶中，并控制宽数据扫描。分桶操作由一系列\
  \ `MapReduce` 作业执行。\n- 必须基于一个基数较高且能保证数据均匀分布的列来创建桶。\n- 桶作为表文件夹内的子目录被创建和存储。数据根据桶键列的哈希值分配到桶中。\n\
  - 分桶有助于逻辑数据组织，并能优化在谓词或连接中使用聚类键列的查询。\n- 在向分桶表插入数据之前，设置以下两个参数：\n  - `SET mapred.reduce.tasks\
  \ =`\n  - `Set hive.enforce.bucketing=true`\n- `SET hive.optimize.bucketmapjoin=true`\
  \ 将指示 `Hive` 在 map 阶段连接时利用桶级别的连接\n\n## 12. Hive 分区和分桶联合使用\n可以在分区内创建桶以优化数据存储，从而优化分区内的数据扫描。\n\
  - 例如，下表将按 `YEAR` 创建分区，在每个分区内，将有 25 个包含其人口详细信息的区域桶。\n\n```sql\nCREATE TABLE city_population_store\n\
  (\narea STRING,\nrecord_date STRING,\nlast_count INT,\ncurrent_count INT\n)\nPARTITIONED\
  \ BY (year STRING)\nCLUSTERED BY (area) INTO 200 BUCKETS;\n```\n\n- 再次强调，分区必须在低基数列上进行。\n\
  - 如果聚类键列基数较低（小于指定的桶数），则可能出现某些桶未被使用（即无数据）的情况。\n\n## 13. TABLESAMPLE\n`TABLESAMPLE`\
  \ 可用于选取部分数据作为查询处理的样本。\n\n#### 块采样\n可以将样本指定为总行数的百分比或有限的行数。例如，在下面的查询中，`abcTelecom_logs`\
  \ 表 5% 或更多的输入数据将被用于查询处理。\n\n```sql\nSELECT *\nFROM abcTelecom_logs\nTABLESAMPLE\
  \ (5 percent)\n```\n\n也可以将样本指定为 1000 行或 100M。\n\n#### 桶采样\n可以在指定的列上或随机创建桶来准备查询用的样本数据。请注意，即使对于非聚簇表，此查询也可以运行，但效率不高。\n\
  \n```sql\nSELECT *\nFROM abcTelecom_logs\nTABLESAMPLE (BUCKET 5 OUT OF 50 ON city)\n\
  ```\n\n如果 `abcTelecom_logs` 是在 `CITY` 列上聚簇的，那么桶采样的效率会更高。\n\n\n\n### Hive LLAP\n\n\
  在企业的数据湖生态系统中，`Tableau`、`Qlikview` 或 `SiSense` 等数据可视化工具会连接到 Hadoop 数据湖，用户可以从不同维度对数据集进行切片和切块，以实时获取洞察。查询性能会严重影响实时体验和决策能力。众所周知，`Hive`\
  \ 在 MapReduce 处理层之上形成了一个抽象层。它无法提供关系型数据库 SQL 所能承诺的性能水平。一种最新的提升性能的趋势是将缓存技术与磁盘操作结合起来。简而言之，这就是\
  \ `Hive LLAP` 的核心所在。`LLAP` 代表“长生命周期处理”（Live Long and Process）。\n\n`LLAP` 加入 `Hive\
  \ 2.0`，旨在借助 `Tez` 保证 `Hive` 的查询性能，同时不牺牲 `Hive` 的原生特性。请记住，它并不会取代 `Hive` 现有的执行模型，而是对其进行补充，以满足更快数据处理的需求。在结构上，它由一个守护进程和一个基于\
  \ DAG（有向无环图）的框架组成，并由 `Tez` 执行引擎进行协调。\n\n`LLAP` 守护进程在标准 Hadoop 集群的 `YARN` 上运行。它包含两个组件，即查询执行器和内存缓存。查询执行器控制查询执行的一些关键阶段，例如查询处理、查询片段执行、预取、访问控制、元数据和结果缓存。那些按优先级排队等待执行的片段会被限制为队列片段。\n\
  \n`Tez` 和 `Hive` 客户端通过确定哪个查询需要推送到 `LLAP` 守护进程执行来协调 `LLAP` 的参与。\n\n`Hive` 负责处理查询片段（如\
  \ HDFS 位置和元数据）。显然，`YARN` 仍然是 `LLAP` 守护进程资源的看护者。查询片段无非是查询处理所需的位信息，例如运算符、元数据、表达式、主数据类型以及输入输出通道。所提到的运算符包括连接（join）、SQL\
  \ 子句和扫描方法。表达式可以是各种类型的函数（SQL、标量、数值）。\n\n那么，哪些查询可以在 `LLAP` 中运行？在 `LLAP` 中运行查询的决策可以在\
  \ `Hive` 客户端中配置为全部、无或混合模式。在自动模式下，初步判断标准是数据源（`HDFS`）、文件格式（`ORC`）和数据大小。小型查询可以直接由守护进程处理。然而，对于大型查询，`YARN`\
  \ 会像往常一样接管，并通过正常的查询处理阶段进行驱动。\n\n![A454145_1_En_4_Fig9_HTML.jpg](img/A454145_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\nHive LLAP 架构\n\n设计考虑因素如下：\n\n1.  `Hive LLAP` 仅能通过 `Tez` 执行引擎使用。\n2. \
  \ 通过 API，守护进程可扩展至所有此类处理框架（`Spark` 和 `Pig`），这些框架更倾向于基于关系视图处理数据，而非基于文件处理。\n3.  目前，只有\
  \ `ORC` 数据符合缓存条件。所有其他文件格式仍然可以在 `LLAP` 守护进程中处理，但不能被缓存。\n4.  缓存淘汰策略 – 针对不同类型的工作负载，可配置不同的淘汰策略。\n\
  5.  默认情况下，低延迟查询优先于重量级和复杂的查询。除非指定了优先级，否则查询会在队列中等待。\n6.  `LLAP` 守护进程故障 - 由于 `LLAP`\
  \ 守护进程并非主要执行器，因此 `Tez AM` 可以在集群的其他数据节点上处理查询片段。\n7.  `LLAP` 守护进程可以通过执行较大查询的微小部分，为查询在集群层面的处理做出贡献。然后，结果可以传递给主\
  \ `Hive` 查询，或进一步传递给某个任务。\n8.  安全性 – 细粒度的访问安全性最高可达列级别。\n\n## Apache Pig\n\n与 `Hive`\
  \ 类似，`Pig` 为 Hadoop 上的数据处理提供了一个抽象层。它通过提供一个脚本层，翻译成在 HDFS 集群上执行的指令，从而为用低级语言编写 MapReduce\
  \ 程序提供了一种替代方案。`Pig` 通过将数千行代码减少到屈指可数的指令，简化了 MapReduce 层。\n\n`Pig` 使用高级语言 `Pig Latin`\
  \ 来设计数据转换和流程表达式。语言解释器负责将 `Pig Latin` 指令转换为 MapReduce 或 `Spark` 作业，并将其提交执行。`Pig`\
  \ 引擎包含一个解析器、优化器和分布式查询执行器。`Pig` 中的程序采用一种类似以数据为中心的方法，因为每条指令都与数据流相关。\n\n![A454145_1_En_4_Fig10_HTML.jpg](img/A454145_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n`Pig` 的能力\n\n`Pig` 消除了将计算分解为 map 阶段和 reduce 阶段的挑战。如果一个问题的解决可以表述为一系列任务或一个使用标准运算符和子句（如过滤器、连接和聚合）的\
  \ DAG，那么 `Pig` 因其固有的快速开发周期优势而脱颖而出。\n\n尽管是过程性的，`Pig` 使用类似 SQL 的声明式结构来开发用于数据处理的脚本。它可能不如\
  \ `Spark` 或 `Hive` 那样优化，但考虑到学习曲线平缓、开发快速等因素，因其低开发成本、灵活的数据模型和快速的结果产出而备受青睐。\n\n\n\n\
  ### Pig 执行架构\n\n下图展示了 Pig 处理过程的执行架构（图 4-11）。\n\n![A454145_1_En_4_Fig11_HTML.png](img/A454145_1_En_4_Fig11_HTML.png)\n\
  \n图 4-11\n\nPig 执行流程\n\n从上述架构图可知：\n\n1. **逻辑计划** – 这是脚本中按顺序排列的任务链的临时表示。Pig 使用 `ANTLR`\
  \ 解析器（另一种语言识别工具）对脚本进行语义和健全性检查，随后生成一个`抽象语法树`（`AST`）。一旦 `AST` 被转换为逻辑计划，就会实施某些优化机会，例如列剪枝和过程下推。\n\
  2. **物理计划** – 逻辑计划被转换为多个物理计划，表明每个逻辑运算符的物理计算分支。例如，`JOIN` 被分解为 `LOCAL REARRANGE` 和\
  \ `GLOBAL REARRANGE` 以及 `PACKAGE`。\n3. **MR 计划** – 物理计划被转换为带有阶段识别和数据输入输出的 `MapReduce`\
  \ 作业。物理计算步骤在 map、combiner 和 reduce 阶段中分支出来。在此阶段，还会从优化角度检查 MR 作业。例如，可以合并 mapper 以减少数据传输，或修改\
  \ reducer 的数量。一旦冻结，MR 作业就会提交到 Hadoop 集群执行。\n\nPig 提供了 `EXPLAIN` 运算符来生成脚本的详细执行计划。\n\
  \n### 关键概念与设计考量\n\n1. **Pig 数据模型** – 包括原子、元组、包和映射。\n   1. 原子是基本数据类型的标量值，例如 `INT`、`FLOAT`、`LONG`、`DOUBLE`\
  \ 或 `CHARARRAY`。\n   2. 元组类似于关系数据世界中的行。它是用圆括号括起来的一系列属性。\n   3. 包表示一组元组，类似于关系数据世界中的表。\n\
  \   4. 映射表示一种键值对的灵活模式数据结构。\n2. **输入数据流模型** – 将数据导入脚本时无需模式。只要 Pig 执行引擎能够识别数据流中的元组，就无需展平\
  \ HDFS 文件。\n3. 尽管 Pig 在运行时不需要模式，但在数据缓冲和处理过程中，类型转换可能至关重要。Pig 可能会根据处理逻辑的性质预测原子或元组属性的数据类型。\n\
  4. **可扩展性** – Pig 支持用户自定义函数，这些函数专为专门的数据处理而设计。\n5. Pig 可以安装在连接到大数据湖的边缘节点上。由于 Pig\
  \ 核心基于 Java 构建，因此 Java 成为运行 Pig 的主要先决条件。\n   1. 如果 Pig 使用 `UDF`，则主机上必须具有本机编译器。例如，基于\
  \ Python 或 JavaScript 的 `UDF` 必须安装 Python 和 Java 脚本组件。\n   2. 为了测试集成和构建自动化，必须安装相应的组件，例如\
  \ `Ant`、`Chef` 或 `Junit`。\n6. **Pig 运行模式**\n   1. **本地模式** – 连接到本地文件系统，开发者可以在其中试用脚本、调试和测试功能。本地模式下无法实现并行性。\n\
  \   ```\n   $ pig -x local\n   ```\n   2. **MapReduce 模式** – 连接到数据湖的 Hadoop 集群。Pig\
  \ 脚本可以部署并在大规模数据上运行。请注意，只有查询执行可以在集群节点上并行化。查询的健全性和语义操作仍在本地进行。\n   ```\n   $ pig -x\
  \ MapReduce\n   ```\n7. **STORE 与 DUMP** – Pig 在脚本执行期间采用惰性执行方法。除非脚本中遇到输出操作，否则引擎会将所有语句保留在内存的流水线中。输出操作可以是诊断运算符\
  \ – `STORE`、`DUMP`、`ILLUSTRATE`、`EXPLAIN` 或 `DESCRIBE`，它们表示创建物理和逻辑执行计划以启动 Pig Latin\
  \ 代码执行。包扫描指令可能导致数据溢出到磁盘。\n   1. 如果脚本结果需要写入 HDFS，请使用 `STORE`。\n   2. 如果脚本输出只需显示在命令行上，请使用\
  \ `DUMP`。\n   3. 出于调试和快速测试的目的，开发者还可以使用 `ILLUSTRATE`，它应用采样算法来创建小型测试数据，应用转换，并实现性能。\n\
  8. **PARALLEL** – 通过在 `PARALLEL` 子句中指定 reducer 数量，来操控 `ORDER`、`DISTINCT`、`JOIN`、`GROUP`、`COGROUP`\
  \ 和 `CROSS` 等子句的 reduce 阶段。Reducer 数量也可以通过包含以下命令在脚本级别设置：\n   ```\n   SET default_parallel\
  \ [reducer_count]\n   ```\n   请注意，语句级别的并行设置将覆盖脚本级别的配置。对于 map 阶段，并行性取决于输入数据的分片数量。如果无法显式地向脚本添加\
  \ reducer，可以修改以下两个参数来调整 reduce 操作。\n   1. `pig.exec.reducers.bytes.per.reducer`\
  \ – 每个 reducer 的输入字节数。默认设置为 1G。对于大型数据集，根据操作不同，可以增加到 1G 以上。\n   2. `pig.exec.reducers.max`\
  \ – reducer 的最大数量。默认值为 999。\n9. **SAMPLE** – `SAMPLE` 运算符允许脚本操作数据子集，这在数据概况分析工作中非常有用。Pig\
  \ Latin 脚本可以包含执行数据质量检查和构建数据概况的逻辑。\n10. Pig 可用于将数据流加载到 Hadoop 中。其优势在于能够通过增加 Hadoop\
  \ 集群中的节点数来扩展规模。\n\n## Apache Spark\n\nSpark 是一个调度、监控和分发引擎，提供了类似 `MapReduce` 的下一代处理框架。它已逐渐开始取代经典的\
  \ `MapReduce` 模型，并已成为大数据领域的事实标准。Spark 于 2011 年 1 月诞生于加州大学伯克利分校的 AMPlab 项目。伯克利 AmpLab\
  \ Shark 的开发主管 Reynold Xin 这样评价 Spark：“Spark……可以说是大数据分析工具中的瑞士军刀。”\n\n\n\n### 为何选择\
  \ Spark？\n\nMapReduce 框架一直是处理海量数据的分布式计算中值得信赖的实现者。它通过一系列在集群上分布执行并与分布式存储平台协同运作的 mapper\
  \ 和 reducer 阶段，帮助解决了复杂问题。其主要处理的是磁盘上的大型数据集，这无疑非常适合批处理，但对于低延迟模型则表现不佳。MapReduce 处理的一个关键特性是能够在集群上存储中间数据集和最终数据集。在整个转换过程中，MapReduce\
  \ 会执行大量的磁盘读写（I/O）操作。这可能是一项开销昂贵的操作，因为它既会引发数据集在磁盘 I/O 中的复制，也会产生网络 I/O，并且每个任务会启动一个新的\
  \ JVM，这需要时间来加载 JAR 包和解析 XML 配置。为某个问题构建 MapReduce 框架的开发人员需要手动编写代码，考虑到任务的复杂性，这可能变成一项繁琐的工作。Apache\
  \ Spark 通过引入一种结合了批处理、流处理和交互式计算的完全不同的处理模型，克服了这些问题。\n\nSpark 是一个开源框架，最初由马泰·扎哈里亚于 2009\
  \ 年在加州大学伯克利分校的 AMPLab 创立，并于 2010 年开源。2013 年，该项目被捐赠给 Apache 软件基金会。它可用于处理部署在本地或云环境的数据湖中的海量数据。它为开发者提供了一个围绕集中式数据结构工作的应用程序框架。请记住，Spark\
  \ 旨在提升计算速度，同时也涵盖了广泛的工作负载，例如批处理、交互式、迭代式和流处理。\n\nSpark 的处理方法在很大程度上受到了微软关于并行与分布式执行的\
  \ Dryad 论文 ² 的影响。它引入了一种内存缓存抽象，使其非常适合多个操作尝试访问同一输入数据的工作负载。用户可以将数据集缓存在内存中，从而克服磁盘 I/O\
  \ 开销。Spark 在每个节点上维护一个执行器 JVM，因此启动一个任务（无论 MapReduce 操作如何）归结为向其发起远程过程调用（RPC）并将一个可运行对象传递给线程池。\n\
  \n在 Spark 2.0 问世之前，Spark 的主要编程接口是弹性分布式数据集（RDD）。在 Spark 2.0 之后，它被 Dataset 所取代，Dataset\
  \ 像 RDD 一样是强类型的，但在引擎内部具有更高的优化。Spark 提供了 Python 或 Scala 的交互式 shell，这有助于以简单的方式学习 Spark\
  \ API 的各种功能。\n\nSpark 核心及其成员库构成了 Spark 技术栈的构建块。这些库经过优化，可满足数据管理的各个阶段。对于数据集成，Spark\
  \ Streaming 正合适。对于数据科学需求，有 MLlib 和 SparkR 可用。对于图形处理，GraphX 是该技术栈的一部分。对于数据工程，数据分析师可以使用\
  \ SparkSQL。Spark 核心充当该技术栈的大脑。图 4-12 展示了 Spark 核心引擎的构成。\n\n![A454145_1_En_4_Fig12_HTML.png](img/A454145_1_En_4_Fig12_HTML.png)\n\
  \n图 4-12  \nSpark 技术栈\n\n### 弹性分布式数据集（RDD）\n\nRDD 是分布在集群中的不可变集合，通过数据转换创建，并且可以在并行操作中进行缓存。弹性分布式数据集具有容错性，因为它们采用图结构组织，这使得在节点故障期间重新计算受损分区变得更加容易。让我们看看\
  \ RDD 的关键特性：\n\n1.  **惰性求值** – 在触发动作之前，RDD 中的数据不会被填充。\n2.  **容错性** – RDD 保存谱系信息，有助于重建丢失的分区。\n\
  3.  **内存驻留与可缓存** – RDD 作为一种受内存保留时间和容量限制的内存结构存在。这些数据集会保持缓存状态，直到刷新到磁盘以实现持久性。\n4. \
  \ **不可变或只读** – RDD 只能转换为新的 RDD，这确保了数据集的一致性。\n5.  **并行、分区与类型化** – RDD 可以在逻辑上分区并分布在集群上，从而可以进行并行处理。记录也是类型化的。\n\
  6.  **非常重要的一点**是，RDD 只能由一个 `SparkContext` 拥有。它们不能在多个 `SparkContext` 之间共享。\n7.  RDD\
  \ 可以通过使用 `persist()` 或 `cache()` 方法在不同的存储级别（如磁盘或内存）变得持久。一个节点可以持久化其计算出的内存数据集分区，以供后续操作使用。这极大地提升了未来对该数据集操作的性能。\n\
  \nRDD 可以通过两种方式创建：\n\n1.  **并行化一个集合** – 通过在驱动程序中对现有集合调用 `SparkContext` 的 `parallelize`\
  \ 方法来创建并行化集合。这里的 `parallelize` 方法中，第二个参数表示内存中 RDD 分区的数量。\n    ```\n    val data\
  \  = Array(1, 2, 3, 4, 5)\n    val distData = sc.parallelize(data, 4)\n    ```\n\
  \n2.  **从外部存储创建** – Spark 可以从 Hadoop 支持的任何存储源（包括本地文件系统、HDFS、Cassandra、HBase、[Amazon\
  \ S3](http://wiki.apache.org/hadoop/AmazonS3) 等）创建分布式数据集。它支持 Hadoop `InputFormat`\
  \ 指定的文件，例如文本文件、[SequenceFiles](http://hadoop.apache.org/common/docs/current/api/org/apache/hadoop/mapred/SequenceFileInputFormat.html)。例如，下面的代码片段使用\
  \ `SparkContext` 的 `textFile` 方法创建了一个 RDD。\n    ```\n    val distFile = sc.textFile(“data.txt”)\n\
  \    distFile: org.apache.spark.rdd.RDD[String] = data.txt MapPartitionsRDD[10]\
  \ at textFile at :26\n    ```\n\nRDD 可以执行动作或转换。转换会从现有的 RDD 创建一个全新的数据集，而对数据集的动作用于运行计算逻辑并返回一个值。RDD\
  \ 上的 `map` 函数是一种转换，因为它处理数据集的每个元素以返回一个新的 RDD，而 `reduce` 则是一个动作，它对 RDD 元素进行聚合。类似地，`filter`、`sample`、`union`、`join`、`cache`、`groupByKey`\
  \ 或 `reduceByKey` 等操作会将一个 RDD 转换为新的 RDD。`reducer`、`collect`、`count` 或 `save` 是将结果返回给驱动程序的动作。RDD\
  \ 转换始终是惰性求值的，只有在执行动作时才会被触发。\n\n\n\n### RDD 运行时组件\n\nSpark 应用程序可以以分布式模式运行。资源管理可以由\
  \ Spark 集群管理器或 YARN 完成。然而，将其与对 Hadoop 集群上的数据本地性有更好认知的 YARN 集成总是更好的选择。Apache Mesos\
  \ 也可以执行基于推送的资源管理，但 Spark 可以接受或拒绝 Mesos 提供的资源。\n\n在运行时，Spark 会调度驱动器和 Worker 来完成一项任务。驱动器在\
  \ RDD 上定义并调用动作，而 Worker 则负责存储 RDD 分区并执行转换。图 4-13 展示了提交 Spark 作业时驱动器和执行器的参与情况。让我们来看看此事件过程中的一系列流程。\n\
  \n![A454145_1_En_4_Fig13_HTML.jpg](img/A454145_1_En_4_Fig13_HTML.jpg)\n\n图 4-13：Spark\
  \ 驱动器到执行器的通信\n\n一旦将 Spark 应用程序提交到集群：\n\n1.  Spark 驱动器被启动，并承担应用程序执行的端到端责任。它是一个 JVM\
  \ 进程，充当主节点来托管应用程序的 `SparkContext`。它负责将应用程序分解为任务，并在执行器可用时将其调度到执行器上运行。如果驱动器挂掉，或者进程因某种原因而终止，执行器也会随之关闭。\n\
  \    1.  `SparkContext` 是 Spark 应用程序主节点，负责设置内部服务并建立与 Spark 执行环境的连接。\n    2.  它用于创建\
  \ RDD、累加器、广播变量，访问 Spark 服务，以及运行任务。\n    3.  RDD 驻留在 `SparkContext` 的逻辑边界内，并通过其在\
  \ `SparkContext` 中的唯一 ID 进行区分。\n2.  Spark 驱动器调用应用程序的 `main()` 方法。\n3.  驱动器与集群管理器协调资源或执行器，以便在\
  \ Worker 节点上运行任务。\n4.  集群管理器启动执行器，执行器通过 ID 和主机进行标识。执行器是在 Spark 计算节点上的 JVM 进程中运行的\
  \ Worker 从节点，并串行执行驱动器分配给它们的任务。\n    1.  执行器向驱动器注册自己，以建立通信并接收要执行的任务。\n    2.  执行器向驱动器发送心跳信号以及任务指标。\n\
  5.  Spark 驱动器执行应用程序并将任务分配给执行器。\n6.  执行器处理已分配的任务并保存结果。\n7.  在 `main()` 方法完成或 Spark\
  \ 驱动器运行 `SparkContext.stop()` 之后，执行器被终止。随后，资源被释放回集群管理器。\n\n### RDD 组成\n\nRDD 接口包含：\n\
  \n1.  分区集 – 维护针对给定 RDD 在数据集上创建的分片数量。\n2.  依赖关系列表 – 维护给定 RDD 与父 RDD 之间的依赖关系。\n  \
  \  1.  依赖关系可以是窄依赖或宽依赖。父 RDD 中的每个分区最多被一个子 RDD 使用的依赖关系称为窄依赖。如果多个子 RDD 依赖于单个父分区，则该依赖关系为宽依赖。\n\
  \    2.  宽依赖可能需要在节点间进行数据混洗，而窄依赖则遵循管道化执行。\n3.  `GetPartitions` – 计算给定 RDD 上的分区数量。\n\
  4.  数据本地性 – 为了避免大量的数据混洗，它会在首选位置创建结果数据集。\n5.  可选的用于创建键值对 RDD 的分区信息，以便轻松访问特定数据。\n\n\
  ### 数据集和数据框\n\nSpark 1.6 中新增了一个接口，它提供了 RDD（强类型和使用强大的 lambda 函数的能力）和 Spark SQL 的优化执行引擎的优势。数据集可以通过\
  \ JVM 对象构建，然后使用 Spark 动作（`map`、`flatMap`、`filter` 等）进行操作。目前 Java 和 Scala 支持数据集，而\
  \ Python 尚不支持，但由于其动态特性，它已经提供了 Dataset API 的许多好处。\n\n数据框是一个结构化为命名列的数据集。它是一个增强功能，旨在为结构化数据、文件、Hive\
  \ 中的表、外部数据库或现有 RDD 提供类似于关系数据库中表的感觉，但在底层具有更丰富的优化能力。数据框在 Scala、Java、Python 和 R 中可用，并具有不同类型的表示形式。\n\
  \n让我们运行一个小型演示，在 Spark 中创建数据框并执行基本功能：\n\n1.  **创建 Spark 会话** – 以便轻松获取所有功能。\n\n  \
  \  ```scala\n    import org.apache.spark.sql.SparkSession\n    val spark = SparkSession\n\
  \    .builder()\n    .appName(\"Spark SQL basic example\")\n    .config(\"spark.some.config.option\"\
  , \"some-value\")\n    .getOrCreate()\n    // 用于隐式转换，例如将 RDD 转换为 DataFrames\n  \
  \  import spark.implicits._\n    ```\n\n2.  在 Spark 会话中，从文件、现有 RDD、Hive 表等创建一个 DF。\n\
  \n    ```scala\n    val df = spark.read.json(\"examples/src/main/resources/people.json\"\
  )\n    // 将 DataFrame 的内容显示到标准输出\n    df.show()\n    // +----+-------+\n    // |\
  \ age|   name|\n    // +----+-------+\n    // |null|  James|\n    ```\n\n3.  数据框操作\n\
  \    1.  打印数据框的 Schema\n\n        ```scala\n        // 以树形格式打印 schema\n        df.printSchema()\n\
  \        // root\n        // |-- age: long (nullable = true)\n        // |-- name:\
  \ string (nullable = true)\n        ```\n\n    2.  选择特定列\n\n        ```scala\n \
  \       // 只选择 \"name\" 列\n        df.select(\"name\").show()\n        // +-------+\n\
  \        // |   name|\n        // +-------+\n        // |  James|\n        // |\
  \    Ben|\n        ```\n\n    3.  选择所有列，并将 age 列增加 1。\n\n        ```scala\n    \
  \    // 选择所有人，但将 age 增加 1\n        df.select($\"name\", $\"age\" + 1).show()\n \
  \       // +-------+---------+\n        // |   name|(age + 1)|\n        // +-------+---------+\n\
  \        // |  James|       22|\n        // |    Ben|       31|\n        ```\n\n\
  \    4.  使用 `age > 25` 过滤数据框。\n\n        ```scala\n        // 选择年龄大于 21 的人\n   \
  \     df.filter($\"age\" > 21).show()\n        // +---+----+--+\n        // |age|\
  \   name|\n        // +---+----+--+\n        // | 31|    Ben|\n        // +---+----+--+\n\
  \        ```\n\n    5.  按年龄统计人数。\n\n        ```scala\n        // 按年龄统计人数\n     \
  \   df.groupBy(\"age\").count().show()\n        // +----+-----+\n        // | age|count|\n\
  \        // +----+-----+\n        // |  22|    1|\n        // |  31|    1|\n   \
  \     // +----+-----+\n        ```\n\n4.  **加载 Hive 表**\n\n    ```scala\n    val\
  \ table1 = spark.sql(\"[db_name].[table_name]\")\n    table1: org.apache.spark.sql.DataFrame\
  \ = [col1: datatype, col2: datatype... 71 more fields]\n    ```\n\n5.  **运行 SQL\
  \ 查询**\n\n    ```scala\n    // 将 DataFrame 注册为 SQL 临时视图\n    df.createOrReplaceTempView(\"\
  people\")\n    val sqlDF = spark.sql(\"SELECT * FROM people\")\n    sqlDF.show()\n\
  \    // +----+-------+\n    // | age|   name|\n    // +----+-------+\n    // | \
  \ 21|  James|\n    // |  31|    Ben|\n    // +----+-------+\n    ```\n\n#### 分桶、排序和分区\n\
  \n在基于文件的数据源中，也可以对输出进行分桶、排序或分区。\n\n```scala\npeopleDF.write.bucketBy(42, \"name\"\
  ).sortBy(\"age\").saveAsTable(\"people_bucketed\")\nusersDF.write.partitionBy(\"\
  favorite_color\").format(\"parquet\").save(\"namesPartByColor.parquet\")\n```\n\n\
  \n\n### Spark 应用程序的部署模式\n\nSpark 应用程序有多种部署选项。它可以以本地模式、独立模式或集群模式提交。该模式必须在 `SparkContext`\
  \ 的 `master` 参数中指定。\n\n1.  **本地模式** – 在本地模式下，所有与 Spark 作业相关的任务都在同一个 JVM 中运行。\n \
  \   - `local` 仅使用 1 个线程。\n    - `local[n]` 使用 n 个线程。\n    - `local[*]` 使用的线程数等于\
  \ Java 虚拟机可用的处理器数量。例如：\n\n        ```\n        # 在本地使用 8 个核心运行应用\n        ./bin/spark-submit\
  \ --class org.apache.spark.examples.SparkPi –-master local[8] /path/to/examples.jar\n\
  \        ```\n\n2.  **独立模式** – 在独立集群模式下，Spark 根据核心分配资源。默认情况下，Spark 应用程序会尝试消耗集群中的所有核心。独立集群模式受到一个约束，即每个工作节点上每个应用程序只能分配一个执行器。在此模式下，用户可以为工作节点和\
  \ Spark 主节点定义容器，以在您的机器上运行。\n\n    ```\n    # 在客户端部署模式下运行于 Spark 独立集群\n    ./bin/spark-submit\
  \ --class org.apache.spark.examples.SparkPi --master spark://207.184.161.138:7077\
  \ --executor-memory 20G --total-executor-cores 100 /path/to/examples.jar\n    #\
  \ 在带有监管的集群部署模式下运行于 Spark 独立集群\n    ./bin/spark-submit --class org.apache.spark.examples.SparkPi\
  \ --master spark://207.184.161.138:7077 --deploy-mode cluster --supervise --executor-memory\
  \ 20G --total-executor-cores 100 /path/to/examples.jar\n    ```\n\n3.  **集群模式**\
  \ – 在 YARN 上的 Spark 应用程序可以以集群模式或客户端模式启动。在集群模式下，Spark 驱动器成为应用程序主节点的一部分，完全由 YARN 管理。在客户端模式下，Spark\
  \ 驱动器作为客户端进程运行，与应用程序主节点协调，为 Spark 应用程序管理资源。\n\n    ```\n    # 运行于 YARN 集群\n    ./bin/spark-submit\
  \ --class org.apache.spark.examples.SparkPi --master yarn --deploy-mode cluster\
  \ # 对于客户端模式可替换为 client  --executor-memory 20G --num-executors 50 /path/to/examples.jar\n\
  \    ```\n\nSpark 应用程序也可以使用 Mesos 部署，但由于其能够提供 Spark 驱动器选择资源的能力，它已被限制为一种基于推送的资源分配机制。对于\
  \ Mesos，`master` 参数将为 `mesos://host:port`。\n\n#### 设计考量\n\n以下是在 Hadoop 集群上部署 Spark\
  \ 应用程序的关键设计考量。\n\n1.  在 Spark 中，过度分配核心是一种避免在分配任务时因上下文切换而消耗时间的有效方法。JVM 内部有线程会执行 shuffle\
  \ 和 GC 操作，这些操作会使用分配给应用程序的相同核心。\n2.  如果资源管理器崩溃，应用程序不会受到影响，除非任何正在运行的容器崩溃，或者在动态分配的情况下，它尝试与资源管理器协商资源。\n\
  3.  资源管理器有一个调度器，其中包含有关在集群上运行的每个应用程序的信息。它知道哪个节点被分配为相应应用程序的应用程序主节点。如果某个应用程序主节点崩溃，资源管理器将通过轮询调度将其分配给另一个节点管理器。\n\
  4.  对于大型集群，如果应用程序在较少的执行器上启动，数据本地性就会发挥作用。\n5.  在集群环境上以客户端模式运行有一个缺点。如果远程客户端与网络断开连接，应用程序将终止。这成为了一个单点故障。\n\
  6.  以集群模式运行可以最小化驱动器与执行器之间的网络延迟，并且由于“驱动器”和“Spark 基础设施”位于同一基础设施中，它们之间网络断连的可能性会降低。这也降低了作业失败的可能性。\n\
  7.  如果执行器崩溃或丢失，那么 Spark 的 `DAGScheduler` 及其更低级别的集群管理器实现（Standalone、YARN 或 Mesos）将注意到任务失败，并负责在整体执行的阶段中重新调度该任务。\n\
  \n### Spark 中 RDD 的缓存与持久化\n\n在每次动作调用后重新计算 RDD 会因资源和时间消耗而影响程序性能。为改进此过程，Spark 提出了两种优化技术：Cache\
  \ 和 Persist。这两种方法的目的都是将数据集临时存储到内存/磁盘中，并在多阶段应用程序的多次计算中迭代重用结果。它提供了多种存储和复制数据的方式。以下是应考虑启用缓存的使用场景：\n\
  \n1.  在独立 Spark 应用程序中\n2.  在机器学习应用程序中\n3.  在资源受限环境中进行昂贵的 RDD 计算时，如果任何执行器发生故障，缓存有助于降低恢复成本。\n\
  \nRDD Cache 用于加速多次访问同一 RDD 的应用程序。使用 cache 时，您只能使用默认存储级别 `MEMORY_ONLY`。\n\nRDD Persist\
  \ 提供了多种将数据集存储在内存或磁盘上的选项。cache 和 persist 之间的区别纯粹是语法上的。`persist` 方法根据相应的存储级别进行存储，包括：\n\
  \n- `MEMORY_ONLY`（默认级别） – 将数据作为反序列化对象存储。如果内存不足，某些数据分区可能不会被缓存；未缓存的数据将在下次需要时重新计算。\n\
  - `MEMORY_AND_DISK` – RDD 作为反序列化数据对象存储。如果 RDD 无法完全放入内存集群，则剩余部分将存储在磁盘上。\n- `MEMORY_ONLY_SER`\
  \ – RDD 作为序列化的 Java 对象存储在内存中。序列化对象意味着每个分区一个字节数组。这更节省空间，从而节省内存。\n- `MEMORY_AND_DISK_SER`\
  \ – 类似于 `MEMORY_ONLY_SER`，但会将剩余部分保存在磁盘上。\n- `DISK_ONLY` – 仅将 RDD 分区存储在磁盘上。\n- `MEMORY_ONLY_2`、`MEMORY_AND_DISK_2`\
  \ – 这两个级别的工作方式与前两个相同，但这两个级别会在集群节点上复制每个分区。\n\nSpark 会隐式监控每个节点的缓存使用情况，并基于最近最少使用原则清除旧数据。可以使用\
  \ `RDD.unpersist()` 方法手动移除 RDD。\n\n### RDD 共享变量\n\n如果 Spark 操作需要在集群上执行一个函数，则会创建函数变量的独立副本并在每台机器上复制。对这些变量的任何更改都不会传播回\
  \ Spark 驱动器。为克服这种情况，Spark 提供了两类共享变量，即广播变量和累加器。\n\n1.  **广播变量** – 广播变量不会创建函数变量的副本，而是在每个工作节点上缓存一个只读副本。当不同节点上的任务所需的公共数据可以在阶段之间共享时，广播就成为一种急需的操作。高效的广播算法有助于优化节点间通信。\n\
  2.  **累加器** – 累加器是关联或交换操作结果产生的变量。Spark 支持命名或未命名的数值类型累加器。\n\n\n\n## Hadoop 上的 SQL\n\
  \n假设您刚刚将关系型数据仓库迁移到了 Hadoop 平台。那些习惯于使用 SQL 查询的业务用户，现在发现执行日常数据检查变得困难重重。另一种情况是，数据分析师希望运行即席查询以进行交互式分析，却因从\
  \ SQL 思维向开发思维过渡的曲线而感到束手束脚。那么，解决方案是什么呢？\n\n在本章中，我们学习了 Hive 背后的动机、其采用历程以及从传统 MapReduce\
  \ 的转型，但经典数据库社区依然强大的事实不容小觑。访问数据湖中的数据时存在两个挑战：语言和数据规模。交互式数据探索需要一门“语言”，而处理 PB 级数据集的能力则至关重要。\n\
  \n![A454145_1_En_4_Fig14_HTML.jpg](img/A454145_1_En_4_Fig14_HTML.jpg)\n\n图 4-14\n\
  \n数据湖中的 SQL on Hadoop 布局\n\nSQL on Hadoop 提供了一个平台，使数据库社区无需深入了解 MapReduce 和集群计算即可在\
  \ Hadoop 中操作数据。它绝非以“低成本”为借口取代数据仓库，或模仿数据库处理引擎；相反，它在 HDFS 和 YARN 之上提供了一层抽象，以赋能数据分析师。下图展示了\
  \ SQL on Hadoop 的使用模式。根据使用模式的不同，平台及其使用的架构准则也会有所差异。\n\n![A454145_1_En_4_Fig15_HTML.png](img/A454145_1_En_4_Fig15_HTML.png)\n\
  \n图 4-15\n\nSQL on Hadoop 框架的操作模式\n\nSQL on Hadoop 的关键在于负责解析查询并处理数据提取的引擎。一个理想的 SQL\
  \ on Hadoop 引擎应当是分布式的，并且必须具备无缝扩展的能力。同时，数据进出数据湖的移动应尽可能少，并且必须克服延迟和并发瓶颈。与典型的 MapReduce\
  \ 操作不同，它应在最大化并发的同时减少延迟。\n\nHadoop 框架上 SQL 的另一个重要特性是可扩展性，即查询其他数据源的能力。交互式查询可能需要来自其他源的数据以生成报告或填充仪表盘。这可以通过查询联合或特许经营来实现，也可以通过拉取代理将数据暂存到集中存储库来实现。\n\
  \n接下来几节，我们将讨论如何在数据湖生态系统中定位 Presto、Oracle Big Data SQL 或 Cloudera Impala。\n\n###\
  \ Presto\n\nPresto 是一个分布式查询引擎，由 Facebook 于 2012 年创建，旨在对超大规模数据集实现更快、可扩展的查询。它使用 Java\
  \ 开发，支持 ANSI SQL 语义，包括复杂连接、聚合和分析函数。Presto 的设计目标是为了满足低延迟数据分析和数据仓库的需求。\n\nPresto 引擎是如何工作的？与\
  \ Hive 不同，Presto 不使用 MapReduce 来执行查询。它实现了一个标准的 MPP 查询处理引擎，包含协调器、发现服务、工作节点和连接器插件。顾名思义，发现服务充当引擎协调器，在启动时接收来自参与节点（或服务器）的通知。Presto\
  \ 协调器负责语句解析、计划生成和管理工作节点。客户端通过 REST API 向协调器提交 SQL 语句，协调器与连接器插件协作，获取表元数据和分片详细信息以构建查询计划。查询计划生成后，协调器将其分解为一系列阶段，并进一步分解为任务，然后将任务分发到各个工作节点。工作节点与连接器插件协作，在内存中执行任务。它们从连接器插件获取数据分片，并根据操作并行运行驱动器进行处理。一旦完成，任务输出将被交替传输到另一个工作节点。工作节点遵循流水线聚合，即每个工作节点执行聚合，并将任务输出传输到下一个工作节点。当聚合数据到达最后一个工作节点时，它通过协调器将结果返回给客户端。\n\
  \n连接器只不过是访问数据存储中元信息和数据的驱动程序。Presto 不仅可以访问 HDFS 中的数据，还可以访问其他异构数据源。Presto 提供了针对 Hive、Cassandra、Postgres\
  \ 以及更多数据存储的连接器。每个连接器都可以访问其元数据。例如，Hive 连接器可以访问 Hive 元存储。MySQL 连接器将访问其自己的目录信息。图 4-16\
  \ 展示了从客户端提交到结果集返回的查询执行流程。\n\n![A454145_1_En_4_Fig16_HTML.jpg](img/A454145_1_En_4_Fig16_HTML.jpg)\n\
  \n图 4-16\n\nPresto 查询执行架构\n\n#### Presto 语句执行模型\n\n图 4-17 展示了 SQL 语句执行过程中遵循的步骤。\n\
  \n![A454145_1_En_4_Fig17_HTML.jpg](img/A454145_1_En_4_Fig17_HTML.jpg)\n\n图 4-17\n\
  \nPresto 语句执行步骤\n\n考虑一个场景：来自 Hive 的 SALES 数据集需要与 MySQL 中的 PRODUCTS 数据集进行连接。让我们检查一下目录条目是如何呈现的——\n\
  \n```\n$ cat etc/catalog/mysql.properties\nconnector.name=mysql\nconnection-url=jdbc:mysql://localhost:3306\n\
  connection-user=root\nconnection-password=*****\n$ cat etc/catalog/hive.properties\n\
  connector.name=hadoop2\nhive.metastore.uri=thrift://localhost:8180\n```\n\n下面的 Presto\
  \ 查询连接了两个数据集，以统计每个产品的销售额。此查询不言自明，遵循 ANSI SQL 编码实践。\n\n```\nSELECT\np.prod_code\n\
  ,COUNT(*) AS num_sales\nFROM hive.sales.sales_ds s\nJOIN mysql.products.prod_desc\
  \ p\nON s.prodid = u.prodid\nGROUP BY p.prod_code\n```\n\n\n\n#### Presto – 设计考量\n\
  \n1.  Presto 并非数据库，但通过流水线执行模型为数据处理提供 SQL 能力。\n2.  SQL 语句会被转换为并行运行的查询、阶段、任务和分片。\n\
  \    1.  查询计划会被动态编译为优化的 m 代码。\n3.  性能管理\n    1.  Presto 使用直接内存管理。\n    2.  分配给工作节点的内存必须根据该节点上运行的工作负载而定。如果你运行相对复杂的查询，集群可能会报告延迟问题。\n\
  \    3.  Presto 在整个查询执行过程中会执行多次内存操作，并依赖网络进行数据传输。它不负责隐式容错。\n    4.  使用 ANSI SQL 最佳实践进行查询调优\n\
  \        1.  CTAS 命令比 `SELECT *` 执行速度更快。\n        2.  为优化连接，需通过减小被连接数据集的大小来缩减数据表面积。注意，Presto\
  \ 默认执行广播连接，这意味着事实表可以分布式处理，而维度表则会复制到工作节点进行处理。\n        3.  内联视图可放在 `WITH` 子句的子查询中。\n\
  \        4.  单节点操作可能非常消耗内存，例如 `DISTINCT` 计数、排序以及使用 `UNION` 拼接数据，应尽量避免。可使用 `APPROX_DISTINCT`\
  \ 替代 `DISTINCT`。\n        5.  多个 `LIKE` 可替换为 `REGEXP_LIKE`。\n        6.  查询中超过 1000\
  \ 个 `AND`/`OR` 可能会导致编译器异常。\n4.  在创建目录属性时，需确保连接器与 Hadoop 版本之间的兼容性。例如，Hive 连接器应能访问\
  \ Hive 元存储，并能从集群中获取表的数据分片。\n5.  目录（Catalog）– Presto 中的查询是针对已注册的目录之一运行的。必须通过在 `/etc/catalog/`\
  \ 目录下创建目录属性文件来注册数据源目录。连接器可使用 `connector.name` 参数挂载，该参数指示目录管理器将使用此目录创建一个连接器。\n  \
  \  1.  创建多个相同数据源类型但不同配置的目录。例如，两个 Hive 集群目录将具有相同的 `connector.name`（即 Hive），但配置不同。\n\
  \    ```\n    connector.name=hive-cdh4\n    hive.metastore.uri=thrift://[master]:10000\n\
  \    connector.name=hive-hadoop1\n    hive.metastore.uri=thrift://[master]:10020\n\
  \    ```\n6.  监控（Monitoring）– Presto 提供了一个交互式 Web 界面 Presto-Admin，用于查询的管理和监控。\n\
  \    1.  检查所有 Presto 节点的状态\n    ```\n    presto-admin server status\n    ```\n \
  \   2.  Presto 客户端 – Airbnb 设计了一个查询执行工具 Airpal，用于轻松编写查询和浏览对象。\n    3.  Prsto 页面\
  \ [`https://prestodb.io/resources.html`](https://prestodb.io/resources.html) 汇集了关于管理工具、客户端、驱动程序、插件和库的所有信息。它由\
  \ Facebook 维护。\n    4.  为保障不间断运行，可部署一个定期监控脚本，以便在检测到配置问题时主动采取行动，并发送告警和通知。\n7.  配置属性\n\
  \    1.  集群\n        1.  `task.info-refresh-max-wait` – 优化协调器工作负载\n        2.  `task.max-worker-threads`\
  \ – 将进程拆分并分配给工作节点\n        3.  `distributed-joins-enabled` – 启用分布式哈希连接\n       \
  \ 4.  `query.max-memory` 和 `query.max-memory-per-node` – 引擎和节点级别的分布式内存最大分配量\n  \
  \      5.  `discovery-server.enabled` 和 `discovery.uri` – 发现服务 URI 规范。\n    2. \
  \ 协调器\n        1.  `query.initial-hash-partitions` – 聚合操作的最大哈希桶数\n        2.  `node-scheduler.min-candidates`\
  \ – 运行一个阶段的最大并行工作节点数\n        3.  `node-scheduler.include-coordinator` – 协调器是否应运行任务？\n\
  \        4.  `query.schedule-split-batch-size` – 阶段到任务的分片大小\n    3.  工作节点\n    \
  \    1.  `task.cpu-timer-enabled` – 详细的统计信息收集\n        2.  `task.max-memory` – 对\
  \ CPU 密集型操作（如连接和排序）的内存限制。\n        3.  `task.shard.max-threads` – 运行活动分片的工作线程数。建议设为\
  \ (4*CPU 核心数)。\n    4.  性能\n        1.  `hive.empty-bucketed-partitions.enabled=true`\n\
  \        2.  `hive.bucket-execution=true`\n        3.  `hive.assume-canonical-partition-keys=true`\n\
  \        4.  `hive.multi-file-bucketing.enabled=true`\n        5.  `hive.immutable-partitions=true`\n\
  8.  从 Hive 迁移到 Presto\n    1.  注意 HiveSQL 与 ANSI SQL 之间的差异\n    2.  使用数组、带引号的标识符和\
  \ SQL 运算符时，遵循 ANSI SQL 指南。例如，\n        1.  在 Presto 中使用 `UNNEST` 展开数组，而不是 Hive 中的\
  \ `LATERAL VIEW`\n        2.  `'2APR2014'` 在 Presto 中无效，但 `\"2APR2014\"` 是有效的\n\
  \    3.  进行故障排查时，关注查询谓词中运算符的使用。例如，`[column = NULL]` 与 `[column is NULL]` 是不同的\n\
  \    4.  `VALUES` 子句在测试 Presto 查询时可能非常有效。它有助于准备用于测试的样本数据集\n\n\n\n### Oracle Big\
  \ Data SQL\n\n`Oracle Big Data SQL` 是 Oracle 提供的一种 Hadoop 上的 SQL 解决方案，允许从 Oracle\
  \ 数据库对 Hadoop、Hive、Oracle NoSQL 和 HBase 发起查询。简而言之，它将非关系型数据纳入 Oracle 系统目录的统一管理之下。因此，Hive\
  \ 表访问可以受益于 Oracle 数据库的大部分智能特性，如查询卸载、Hadoop 上的智能扫描、网络资源管理、数据编辑以及其他 Oracle 高级安全功能，且不损失任何性能。现有的\
  \ Oracle 高级分析和安全用户可以通过启用`Big Data SQL`来扩展其数据覆盖范围，他们所有正在运行的模型将开始考虑来自 Hadoop 数据湖的数据。\n\
  \n图 4-18 展示了 Oracle Big Data SQL 产品的优势。\n\n![A454145_1_En_4_Fig18_HTML.png](img/A454145_1_En_4_Fig18_HTML.png)\n\
  \n图 4-18 Oracle Big Data SQL 优势\n\nOracle Big Data SQL 是如何工作的？嗯，与传统的数据联邦技术相反，Oracle\
  \ Big Data SQL 采用查询特许经营方法，在关系型和 Hadoop 数据源之间实现统一处理。查询特许经营推动基于驱动程序的查询执行，而不是将子查询分派到不同的数据系统由其各自的本地处理引擎来处理。驱动程序或代理是不同系统（Hadoop\
  \ 数据节点）上的计算代理，它们协助执行`Big Data SQL`中的任务。这种特许经营模型实现的是统一的资源管理和有效的查询规划，因为 Oracle 优化器能够理解跨多个系统的数据位置和结构。代理或`Oracle\
  \ Big Data SQL`单元通过智能扫描和存储索引来优化查询执行。\n\n`Big Data SQL`遵循外部表机制，通过 Hive 元存储访问表元数据。随后，它还使用底层的\
  \ Hadoop API 从 HDFS 访问数据。在 Oracle 数据库中创建外部表时，必须指定驱动程序，也称为存储处理程序。要访问 Hadoop 集群，Oracle\
  \ 提供了两种访问驱动程序：\n\n1.  `ORACLE_HIVE` – 允许使用 Hive 元数据信息创建 Oracle 外部表。如果 Hive 表定义在\
  \ HBase 存储上，它还可以访问 HBase。\n2.  `ORACLE_HDFS` – 允许使用 HDFS 文件系统在 Oracle 中创建外部表，而无需显式创建\
  \ Hive 表。该访问驱动程序隐式模仿 Hive 语法，并为来自文件系统的数据分配模式结构。\n\n下面的`CREATE TABLE`脚本为 Hive 表`social_cmt_hv`创建了一个外部表。\n\
  \n```sql\nCREATE TABLE ratings_db_table (\ncol0 VARCHAR2(4000),\ncol1 VARCHAR2(4000),\n\
  col2 VARCHAR2(4000)\n)\nORGANIZATION EXTERNAL\n(TYPE ORACLE_HIVE DEFAULT DIRECTORY\
  \ DEFAULT_DIR\nACCESS PARAMETERS\n(\ncom.oracle.bigdata.cluster=hadoop\ncom.oracle.bigdata.tablename=default.social_cmt_hv\n\
  )\n) PARALLEL 2 REJECT LIMIT UNLIMITED\n```\n\n`ACCESS_PARAMETERS`子句可用于指定替换操作，以取代其默认行为。例如，\n\
  \n- 如果 Oracle 和 Hive 中的表名不同，请在`com.oracle.bigdata.tablename`中指定 Hive 表名。\n- 如果列名不同，请在`com.oracle.bigdata.colmap`中指定列映射。\n\
  \n#### 设计注意事项\n\n1.  Oracle 数据字典`[USER] DBA_HIVE_TABLES`包含 Hive 表元数据详细信息。\n2.  Oracle\
  \ Big Data SQL 是一个单独许可的产品，兼容 Oracle 数据库版本 12.1.0.2.0 及更高版本。\n3.  Oracle SQL Developer\
  \ 4.0.3 具备连接到 Hive 元存储的能力。\n4.  可以卸载到 Hadoop 的函数可以从`v$sqlfn_metadata`字典中查询。\n5.\
  \  你可以使用`dbms_hadoop.create_extddl_for_hive`子程序生成用于在 Oracle 数据库中访问 Hive 表的外部表的 DDL。\n\
  6.  Big Data SQL 3.0 及更高版本可以安装在配备 Cloudera CDH 5.5 或 Hortonworks HDP 2.3 发行版的 Hadoop\
  \ 的普通硬件上。\n    - 无法利用工程系统中因 InfiniBand 网络结构带来的网络优化。\n7.  智能扫描 – 使用 Hive 或 HDFS 访问驱动程序的\
  \ Oracle 外部表的全扫描，通过运行在 Hadoop 数据节点上的`BigData SQL`单元的智能扫描功能进行优化。智能扫描是 Oracle 工程系统的一项功能，通过将处理下推到存储层来优化查询执行。\n\
  8.  存储索引 – Oracle `Big Data SQL`单元为 HDFS 上的数据分布维护存储索引。存储索引有助于消除对那些不包含所需数据块的磁盘扇区的扫描。智能扫描和存储索引在查询优化方面相辅相成。为了有效利用存储索引，请使用频繁使用的列对查询进行排序。使用等式（`=`）、非等式（`<`、`>`、`<>`）、空值（`IS\
  \ NULL`、`IS NOT NULL`）或小于/大于（`<=`、`>=`）运算符的查询可以从存储索引中受益。\n9.  针对 ORC 和 Parquet 文件格式的查询，还能进一步受益于文件结构内的条带索引。\n\
  10. Oracle 数据库 12c 开发了存储和解析 JSON 数据的原生能力。使用`Oracle Big Data SQL`，可以下推`CLOB`处理。\n\
  \n## 结论\n\n数据处理在最近经历了多次创新。诸如 Spark、Presto 和 Hadoop 上的 SQL 技术等现代尖端框架，减轻了从关系型领域过渡到非结构化空间的数据从业者的工作负担。这些新技术中常见的共通点是可扩展性和完整性。\n\
  \n本章试图讨论数据湖中的数据处理技术。你们中的许多人可能正在使用这些平台，但理解设计考虑因素和关键影响要素是成功实施的关键。在本书的范围内，我们讨论了经典的\
  \ MapReduce、Hive、Pig、Spark 和 Presto。然而，可能还有其他多种框架和设计，如 Cloudera Impala 或开源产品，它们服务于类似的目的。\n\
  \n在下一章中，我们将介绍数据治理及其关键责任之一：数据保留和归档策略。\n\n脚注 1 Dean, Jeffrey; Ghemawat, Sanjay; MapReduce:\
  \ Simplified Data Processing on Large Clusters, [`https://static.googleusercontent.com/media/research.google.com/en//archive/MapReduce-osdi04.pdf`](https://static.googleusercontent.com/media/research.google.com/en//archive/MapReduce-osdi04.pdf)\n\
  \n2 Dryad: Distributed Data-Parallel Programs from Sequential Building Blocks [`https://www.microsoft.com/en-us/research/wp-content/uploads/2007/03/eurosys07.pdf`](https://www.microsoft.com/en-us/research/wp-content/uploads/2007/03/eurosys07.pdf)\n\
  \n\n\n"
- "# 5. 数据湖中的数据归档策略\n\n> “数据就像垃圾。你最好在收集它之前就知道要拿它做什么。” ——美国作家、企业家马克·吐温\n\n数据湖成熟度呈线性增长的趋势，推动了数据分析从描述性向预测性、进而向指导性的演进。那些能带来丰厚商业成果的策略，很大程度上依赖于提供高质量和相关性数据的数据计划。企业数据湖作为现代认知数据分析的支柱，依靠一个负责在其转换和消费阶段管理其生命周期的机制。你多久会看到分析师质疑数据模型的数据充足性？安全分析师又多久会为数据湖应用标记风险区域，以衡量其脆弱性？这正是数据治理的用武之地——它是组织整体数据战略的关键支柱。\n\
  \n在本章中，我们将重点关注数据治理的一项成果，即数据归档策略。我们将理解为什么数据归档对企业及数据湖生态系统至关重要。随后，我们将探讨可能推动组织内数据生命周期管理策略的设计考量。\n\
  \n## 数据治理的行为\n\n数据治理是一个“委员会”，它知晓业务成果的使命与愿景，并受托负责协调企业数据计划与这些成果保持一致。数据治理掌管数据湖的整个范畴，并在组织内制定愿景、策略和框架。根据\
  \ 2016 年福布斯研究¹，78%的领先商业智能高管认识到治理在商业智能中的重要性，而 65%的高管承认治理提供了赋能终端用户发现新洞察的有用手段。Qlik\
  \ 公司全球行业解决方案副总裁 Mike Saliter 认识到了治理委员会的重要性，并解释：\n\n> 治理需要一种非常精妙的平衡——既要治理到确保一致性的程度，又要保持灵活性。没有完美的公式，但在组织文化中找到合适的治理水平，是充分利用商业智能机会的关键组成部分。\n\
  \n该委员会由首席数据官（CDO）领导，吸纳数据团队的关键利益相关者，组成一个数据领导公会。数据领导公会负责决策以下事项：\n\n1. 简化整个组织的数据方法——为数据工程、数据摄取和数据可视化制定最佳实践、模型和流程。\n\
  2. 数据隐私与合规性——验证数据源是否合规。\n3. 数据清单实践\n   1. 数据采集与业务交付成果关联——采购新的数据源，将数据湖转化为数据资产。建议将策展层作为信息库，为业务分析团队保存准备好的数据。\n\
  \   2. 数据保留——制定评估策略，以决定从数据湖中保留或剔除数据系统。\n   3. 数据安全——在数据和平台周围实施安全防护，以降低与公司及公共网络中数据相关的风险。\n\
  \      1. 数据脱敏\n      2. 用户认证与授权\n4. 基础设施规划\n   1. 存储——实施信息生命周期管理（ILM）策略以归档数据。\n\
  \   2. 容量规划——根据用户群和业务预测，规划基础设施以确保业务连续性。\n\n图 5-1 展示了一个典型的数据治理委员会组织结构。\n\n![A454145_1_En_5_Fig1_HTML.png](img/A454145_1_En_5_Fig1_HTML.png)\n\
  \n图 5-1\n数据治理组织结构\n\n### 数据湖 vs. 数据沼泽\n\n数据湖遵循一种有序的方式来引入数据。它采用“一劳永逸”的方法来制定数据摄取策略、数据组织和架构。数据治理委员会会不时审查数据模式和实践，确保数据湖遵循安全、稳定和可持续的方法。采用系统性方法将所有复杂性（数据源、类型、转换）纳入一个通用层，对于成功的数据湖运营至关重要。\n\
  \n另一方面，数据沼泽则展现了数据湖的阴暗面。处于混乱状态的数据湖不过是变成了一个数据沼泽。它缺乏稳定的数据治理实践，缺乏元数据管理，并且在摄取框架上表现薄弱。对源数据进行不受控制且无法追踪的访问，可能会产生数据的重复副本，并对存储系统造成压力。\n\
  \n图 5-2 展示了数据湖与数据沼泽之间的关键区别。\n\n![A454145_1_En_5_Fig2_HTML.png](img/A454145_1_En_5_Fig2_HTML.png)\n\
  \n图 5-2\n数据湖与数据沼泽的对比\n\n为防止出现数据沼泽的情况，企业可以采纳以下列出的最佳实践。\n\n1. 倡导数据治理——数据治理确保对所有驻留数据拥有适当的监管，并将数据计划与可见的业务成果挂钩。它负责安全方面，并参与数据湖的容量规划。\n\
  2. 构建并维护元数据——应鼓励元数据管理，以简化数据访问并支持高质量的数据搜索。\n3. 优先考虑 DevOps 章程——DevOps 保持摄取管道的完整性，并在通用框架下屏蔽数据的复杂性。\n\
  \n\n\n## 数据归档简介\n\n数据归档是指以较低成本保留不常使用数据的技术。对于海量数据集，需要大规模存储。为了实现高效的数据访问，则需要智能存储。更快、更智能的存储系统可能会增加运营支出，从而提升总体拥有成本。数据委员会持续关注数据的相关性，并为分析模型设定时间线，以实现数据的时效性可见。数据湖本身原则上可作为数据归档平台，但需要避免“沼泽化”的情况。并非所有数据都具有同等相关性，数据会随时间和年限而变得沉寂。\n\
  \n数据的相关性和质量是推动数据归档策略的强烈动因。数据源和数据质量会随时间和年限而演变。一个 10 年前的数据集可能质量欠佳，当输入基于学习的分析模型时，可能毫无价值。请记住，快速便捷的数据访问是数据湖宣传亮点之一。尽管如此，出于监管和合规原因，沉寂的数据集仍可能保留在数据湖中，但需采用经济高效的存储方式。根据数据的年限和相关性来管理数据湖生命周期的能力，是区分一个成本高昂的数据湖与一个“精准”经济的数据湖的关键所在。\n\
  \n随着数据以 TB 和 PB 的规模增长并存储于一级存储系统，它可能会因拖慢数据访问速度而影响主要应用程序。显然，底层存储系统会因这种数据增长而面临成本和空间压力。此外，诸如备份、恢复、分析或克隆等数据操作，也会因数据体量庞大而运行时间更长。此类场景会直接影响\
  \ IT 预算，并降低投资回报率。数据归档实践有助于为新数据腾出空间。归档策略不仅能优化主存储系统的负载，还可能带来性能提升。性能优化是通过减少数据湖中活跃数据卷的表面积来实现的，而非通过部署任何调优技术。图\
  \ 5-3 展示了数据归档优势的宣传图。\n\n![A454145_1_En_5_Fig3_HTML.jpg](img/A454145_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n数据归档策略的优势\n\n基于云的存储对企业来说可能是一个巨大的福音。公有云供应商宣称能以相当低的费率提供弹性存储服务。尽管这因情况而异，但云存储和归档服务能确保在可负担的资本下获得更好的回报，因为其运营支出更低（无需现场空间，且运营最小化）。让我们快速浏览一下架构师在定位云归档策略之前必须考虑的若干因素——\n\
  \n1.  恢复周转时间 — 云服务模型必须支持快速数据恢复。恢复方法必须简单且具有交互性。\n2.  数据生命周期集成管理 — 归档服务必须能够与其他云存储类别集成。可以定义统一的生命周期策略，使用主存储和归档存储类别来实现存储分层。\n\
  3.  DLM 合规与法规 — 归档服务必须符合 DLM 的考量，如数据感知、数据搜索和成本优化。\n4.  安全性 — 这是云与本地部署争论的关键参数之一。安全性在很大程度上取决于数据治理委员会对数据机密性和合规性的定义。然而，云服务供应商必须支持数据加密、访问管理和身份验证等安全技术。\n\
  \n## 数据生命周期管理\n\n数据生命周期管理是指能够根据数据的年限和业务相关性对数据进行分类，并定义策略以在存储层级间移动数据的能力。推动有效数据生命周期管理的因素包括：\n\
  \n1.  数据感知 — 深入了解业务服务级别协议和数据模型意识非常重要。它有助于确定数据是什么，而不是数据位于何处。数据感知有助于了解数据的合法性和敏感性。\n\
  2.  数据保留、转换和过期策略 — 可以通过生命周期规则定义来实现存储和压缩分层。这些规则可以定义老化策略，当触发时，会执行相应的操作，如数据移动或删除。图\
  \ 5-4 展示了数据湖中数据的生命周期。\n\n    ![A454145_1_En_5_Fig4_HTML.png](img/A454145_1_En_5_Fig4_HTML.png)\n\
  \n    图 5-4\n\n    数据湖中的数据生命周期管理流程\n3.  熟悉数据源以进行业务相关分类 — 除非了解数据的意义，否则无法确定数据归档的影响。例如，超过两年的零售交易数据可以归档，但零售合同商的数据永远不能归档。\n\
  \    1.  为数据湖中的所有对象设置硬性时间线并非良策。这可能对数据的业务相关性产生不利影响。例如，在硬性时间线之前创建的客户档案，在数据湖中可能不再可见，因而也无法被实施消费者分析的模型所使用。\n\
  \    2.  根据业务依赖关系归档数据 — 在审阅所有依赖关系后归档数据是可行的做法。规定日期之前的客户交易可以归档。然而，客户数据仍将保持活跃并对系统可见。\n\
  4.  数据访问频率 — 有助于定义数据的老化规则。\n5.  有效的治理与合规 — 数据治理全面了解数据及其存储类别。\n\n### DLM 策略操作\n\n\
  可以定义 DLM 策略，使其根据业务需求和数据相关性来执行操作。数据归档可以是在线的，也可以是离线的。数据可以被迁移到连接的低成本存储，也可以被清除到与活跃数据湖断开的存储中。虽然大多数企业倾向于在线数据归档，但离线归档在两种情况下会发挥作用：\n\
  \n1.  源系统退役或被停用，其在数据湖中的数据足迹需要归档。\n2.  源系统通过数字化举措进行转型，遗留的原始数据集需要归档。\n\n对于在线数据归档，DLM\
  \ 策略可以实现存储分层和压缩分层。存储层级指的是存储具有特定分类并遵循 DLM 策略的数据的存储桶。不同的存储层级可能具有不同的底层存储及相关属性，如压缩模式和磁盘速度。\n\
  \n\n\n### DLM 策略\n\n数据生命周期管理应当是一种逐步定义归档策略的方法，而非一次性的即时操作。以下是设计策略时需要遵循的步骤：\n\n1. \
  \ **数据优先级划分** – 数据的选择与分类应是 DLM 策略的首要步骤。数据可根据其业务关键性以及与其他实体的依赖关系进行分区。类别和参数完全取决于数据委员会的规定。不过，一个标准的数据目录可以通过将数据分类到以下类别来构建：\n\
  \    1.  **主数据** – 具有高度且一致业务重要性的数据需要保留，除非数据治理部门批准归档。主数据可以是敏感信息，例如个人身份信息（PII）数据（社保号、客户、员工、患者）或公司内部数据（产品、供应商、供货商、交易和协议）。对于医疗行业，HIPAA\
  \ 隐私规则规定了患者记录必须保留的年数。银行业则综合多个参数，如最后交易日期和余额，来将账户划分为休眠账户。\n    2.  **事务数据** – 可以毫无问题地进行归档的数据。可以定义策略，在日事务数据达到一定期限后进行归档。\n\
  \        1.  超过两年的机器或传感器生成数据\n        2.  超过 30 个月的位置数据\n        3.  超过五年的银行交易数据\n\
  \        4.  超过一年的教育数据\n    3.  **社交数据** – 社交数据的归档频率可以高于其他类别，因为大多数消费社交数据的分析模型是通过持续和渐进式学习来获取洞察的。随着这些模型逐渐成熟，它们会用自身的见解去“浸润”原始数据流，从而丰富数据。因此，来自社交媒体的数据更容易快速变得不活跃。每月将\
  \ Web 日志移到二级存储的归档策略可能足以满足存储需求。\n2.  **按分类的数据期限** – 对于每种数据分类，期限参数可能因数据相关性或政府规定而异。为每种分类设定时间维度将在归档策略与数据分类之间建立联系。\n\
  3.  **定义归档策略** – 可以在存储层级为每个数据源声明归档策略。每个策略都包含名称、规则和操作。策略可以隐式触发或手动触发。\n\n    ![A454145_1_En_5_Fig5_HTML.jpg](img/A454145_1_En_5_Fig5_HTML.jpg)\n\
  \n    图 5-5\n\n    数据归档策略基础\n\n### DLM 设计考量\n\n让我们看看在实施全面的数据归档策略时可能具有战术意义的关键设计考量（图\
  \ 5-5）。\n\n1.  **将数据备份用作数据归档** – 避免将数据备份用作数据归档。关于定期数据备份是否可被视为归档，一直存在长期争论。然而，实际情况是，备份和归档是两个不同的领域。备份就像是数据丢失时的填充物，而归档是数据的查找工具。\n\
  \    1.  备份用于系统恢复、克隆或灾难恢复。而归档则以性能为代价实现数据发现。\n    2.  数据备份与活跃数据是断开的，而归档与数据湖紧密相连。\n\
  \    3.  例如，如果客户需要超过一个季度的银行交易记录，银行会从归档中提取。如果缺少归档而必须从备份中提取，则必须先还原所有备份，然后才能访问所需数据。\n\
  2.  **归档性能** – 从归档中访问数据可能会带来次优性能，因为数据必须从二级存储中提取。\n    1.  在 DLM 策略中将数据分类映射到存储层级时，这是一个关键因素。对于归档，性能取决于二级存储的磁盘速度、网络带宽和压缩模式。\n\
  \    2.  如果归档采用压缩格式，则会在访问前增加解压步骤，从而进一步降低性能。\n3.  **归档非结构化数据** – 对于非结构化数据，可以建立一个由二级存储系统组成的归档\
  \ Hadoop 集群。其存储范式与主 Hadoop 集群相同。有多家商业供应商提供将非结构化数据归档到文件系统的产品。\n4.  **发现数据依赖关系** –\
  \ 在实施归档计划之前，必须充分理解不同数据类型之间的关系。我们在 DLM 部分看到了客户档案的例子。下面还列出了一些其他情况。\n    1.  主业务实体绝不应被归档，除非该实体已退役或停用。\n\
  \    2.  避免固定时间线的归档 – “所有 2000 年之前的数据都将被归档” – 此规则将使 2000 年之前输入的所有主数据失效。这是期望的结果吗？数据治理部门需要做出决策。\n\
  \    3.  通话数据可以在 15 年后归档。\n5.  **Hadoop 归档（HAR）** – 一种基于 MapReduce 的工具，用于将 HDFS\
  \ 集群上的多个小文件归档为一个不可变文件。它旨在解决 Hadoop 中的小文件问题。\n    1.  `hadoop archive –archiveName\
  \ dummy.har /input/location /output/location`\n6.  **基于云的归档** – 公有云供应商以可承受的价格提供归档存储服务。基于云的存储不仅可作为磁带机制的替代方案，还提供了更好的可用性、企业级安全性、易于管理性和合规性。\n\
  \    1.  **持久性** – 本地归档提供完全的控制权，但可能给企业带来成本压力。此外，归档的持久性、可用性和安全性是需要解决的一些紧迫问题。\n  \
  \  2.  **安全性** – 尽管在“云”安全这类话题上难以让所有人达成共识，但了解云供应商如何应对安全问题或许是有益的。云供应商声称数据一到达就进行加密。考虑到云公司拥有的技能水平和其遵守的合规标准，他们为客户保管了加密密钥。然而，在将数据推送到云之前自行加密一次也不失为一个好主意；这样，客户可以完全掌控其中一层的加密。\n\
  \    3.  可用于归档遗留数据或非结构化数据。\n    4.  提供归档服务的商业供应商\n        1.  Amazon Simple Storage\
  \ Service 和 AWS Glacier\n        2.  Microsoft Azure Archival Storage\n        3.\
  \  Oracle Cloud Infrastructure Archive Storage Classic\n7.  **分层级别** – 将数据分布到冷、温、热数据桶中\n\
  \    1.  **热数据** 指驻留在主存储上的最活跃数据。所有数据驱动的操作和分析模型从数据湖中访问热数据。\n    2.  **温数据** 是偶尔被选中但从未真正参与事务的不活跃数据。\n\
  \    3.  **冷数据** 仅出于监管和合规目的而存在。它不参与数据访问或事务活动。\n8.  **检索方法** – 对于本地和基于云的归档，确保了解在需要时如何检索归档数据。\n\
  \n\n\n### Amazon S3 和 Glacier 存储类\n\nAmazon 提供了高持久性的对象存储容器 S3，适用于多种场景。它提供了用于监控和生命周期控制的数据管理控制台、通过版本控制和复制实现的数据保护、事件和警报通知以及安全控制。由于本书的范围和目的所限，我们不会深入探讨\
  \ Amazon S3 服务。相反，我们将重点介绍 Amazon S3 的存储类。\n\nAmazon 提供一种名为 AWS Glacier 的低成本归档存储服务。它用于对不常访问但因合规性而需要保留的数据进行深度归档。如果您在寻找长期备份解决方案，Glacier\
  \ 可能非常适合您的需求。Amazon Glacier 提供了三种数据访问方法，即：加急、标准 和 批量服务。根据数据访问需求，可以选择合适的检索模式（图 5-6）。\n\
  \n![A454145_1_En_5_Fig6_HTML.jpg](img/A454145_1_En_5_Fig6_HTML.jpg)\n\n*图 5-6：AWS\
  \ 数据检索策略*\n\n从安全角度来看，Glacier 中的所有数据都是加密的。此外，可以通过 AWS IAM 服务配置访问控制。\n\nAmazon S3\
  \ 的生命周期特性如下所示。\n\n1. **分层数据管理** – Amazon S3 存储类可以是 S3-Standard、S3-Standard-IA 或\
  \ S3-Glacier。\n    1. `S3 Standard` – 这是用于通用数据存储的主要对象级存储类。它服务于通常需要低延迟和高吞吐量的数据访问请求。所有热数据和活跃数据都驻留在此存储类中。\n\
  \    2. `S3 Standard – 不频繁访问` – 此对象级存储类用于温数据或不常使用的数据。使用 Standard-IA 存储类可以快速提供低延迟和可管理吞吐量的数据访问请求。最短存储期限为\
  \ 30 天。\n    3. `Glacier` – 此对象级存储类用于归档为合规和监管目的而保留的冷数据。最短存储期限为 90 天。\n2. **生命周期规则**\
  \ – 数据生命周期策略可以被定义为规则，以便对数据老化采取适当的操作。数据年龄定义为天数或固定日期。操作的性质可以是：\n    1. **转换** – 允许数据从\
  \ S3 移动到不频繁访问层，然后移动到 Glacier。这意味着对象存储类从 S3 转换为 `STANDARD-IA` 或 `GLACIER`。\n    2.\
  \ **过期** – 允许根据日期或年龄删除 S3 存储中的数据。由于 AWS 采用排队方式异步删除对象，因此过期日期和实际过期之间可能存在延迟。\n\n应该选择云归档服务的原因在于，云的总体拥有成本远低于本地部署。与磁带库、驱动器、介质或专用框架等传统归档方法相比，AWS\
  \ Glacier 以更低的成本实现了智能归档。另一个主要考虑因素是持久性。AWS 保证 99.9% 的数据持久性，并在故障期间进行定期固定性检查和自动恢复。\n\
  \n### 设计考虑\n\n作为云架构师，在企业数据湖中执行数据归档策略之前，必须牢记以下几点：\n\n1. 存储类只能向前移动。例如，`STANDARD` 类中的对象只能转换为\
  \ `STANDARD-IA` 或进一步的 `GLACIER`。`STANDARD-IA` 中的对象不能重新设置回 `STANDARD`。在这种情况下，只能从\
  \ Glacier 归档中恢复归档数据。\n2. 年龄小于 30 天的对象不能转换为 `STANDARD-IA`。\n3. 大小小于 128KB 的对象不能转换为\
  \ `STANDARD-IA`。\n4. 根据生命周期操作，定价可能有所不同。\n    1. 如果您在 30 天内从 `STANDARD-IA` 存储类删除对象，您可能需要支付提前删除费用。\n\
  \    2. Amazon Glacier 中的每次归档和检索请求都是收费的。\n5. 加密对象在整个转换过程中将保持加密状态。\n6. 从 Glacier\
  \ 归档恢复是一个耗时的过程。\n\n图 5-7 展示了 Amazon AWS 存储类组合。\n\n![A454145_1_En_5_Fig7_HTML.png](img/A454145_1_En_5_Fig7_HTML.png)\n\
  \n*图 5-7：Amazon AWS 存储类组合*\n\n### DLM 案例研究 – 使用 Amazon 进行归档\n\n一家图像处理公司 IPC 在 AWS\
  \ 上搭建了其企业数据湖。虽然传统数据存储包含 10 年数据，但数据委员会已规定数据湖需保存 3 年的图像和操作数据。就数据归档而言，可能存在两种可能的情景：\n\
  \n1. 可以通过老化策略触发数据归档。\n2. 可以直接上传数据进行归档。\n\n在使用 AWS 的典型 DLM 框架中，Amazon Glacier 在归档策略中充当汇聚点。在上述两种情景中，数据归档都可以存储在\
  \ AWS Glacier 上。在第一种情景中，Amazon AWS 允许与 S3 存储进行生命周期集成。可以在 AWS 管理控制台中定义和配置生命周期规则，以将对象数据从\
  \ S3 移动到不频繁访问存储层，然后移动到 Glacier。图 5-8 展示了数据生命周期管理中的存储分层，从在 S3 中创建数据到根据规则在 Glacier\
  \ 中进行数据归档。所有生命周期规则都根据其触发器设置进行检查。如果满足条件，数据会逐步从一个层移动到另一个层。\n\n![A454145_1_En_5_Fig8_HTML.jpg](img/A454145_1_En_5_Fig8_HTML.jpg)\n\
  \n*图 5-8：数据生命周期管理中的存储类层级支持*\n\n对于第二种情景，可以通过直接上传技术将遗留数据直接上传到 AWS Glacier。主要有三种方法可以将数据批量上传到\
  \ Glacier：\n\n1. 通过安全隧道经公共互联网传输数据。\n2. AWS Direct Connect，用于站点和 AWS 之间的专用网络带宽。\n\
  3. AWS Snowball Edge – AWS Snowball-edge 是一款具有本地计算和存储能力的高扩展性设备，用于物理传输数据进出 AWS。Snowball\
  \ 配备了相当于 Amazon EC2（`m4.4xlarge`）的计算和存储能力，可用于云迁移、灾难恢复、数据中心下线和数据繁衍。\n\n是否应始终通过生命周期规则来实践\
  \ DLM？这个过程是否可以手动执行？那么，S3 生命周期管理的 Amazon Glacier 带来的好处在于，索引条目保留在 S3 上，而只有对象数据从 S3\
  \ 移动到 Glacier。对象元数据保留在 S3 存储中，这意味着可以通过用户定义的名称引用对象。可以使用 S3 API（而非 Glacier API）检索对象。\n\
  \n\n\n## 结论\n\n企业正面临着持续存储海量数据的压力。管理这种数据增长对企业来说可能是一项真正的挑战。市场上存在多种商业归档解决方案，它们声称能为组织提供万无一失的归档服务，但区分成功与失败数据归档的关键在于对数据的理解。归档产品或许能迅速带来某些显著成果，但因数据归档策略缺陷引发的问题可能会在未来浮现。数据归档框架的核心在于研究数据依赖关系、优先级排序以及与业务服务等级协议（SLA）的认知。一套高效的数据归档策略有助于优化\
  \ IT 投资、提升数据访问性能，并增加投资回报。\n\n在下一章中，我们将把重点转向数据治理的另一个关键组成部分，即安全性。我们将聚焦于数据湖安全原则以及架构师的考量因素。\n\
  \n脚注 1\n\n[`https://www.forbes.com/sites/forbespr/2016/10/24/strong-data-governance-enables-business-intelligence-success-says-new-forbes-insights-study/#6832a44f582d`](https://www.forbes.com/sites/forbespr/2016/10/24/strong-data-governance-enables-business-intelligence-success-says-new-forbes-insights-study/#6832a44f582d)\n\
  \n"
- "# 6. 数据湖中的数据安全\n\n> “数据像酒一样成熟，应用程序则像鱼一样。”——詹姆斯·戈弗诺，RedMonk 首席分析师兼创始人\n\n伴随数据的巨大体量和极高价值而来的是，保护数据免受外部入侵、降低意外攻击风险的责任。每年，全球都会目睹大量网络盗窃、安全漏洞和数字攻击的案例。根据\
  \ Gartner 在 2017 年第一季度的报告¹，2017 年全球安全支出估计为 900 亿美元，比 2016 年增长了 7.6%。Forrester 的一位研究员很好地总结了建立稳健安全框架的必要性，他解释道²：\n\
  \n> 基于边界的安全方法已经过时。安全和隐私专业人员必须采取以数据为中心的方法，确保安全与数据本身同行——不仅是为了保护数据免受网络犯罪分子的攻击，还要确保隐私政策持续有效。\n\
  \n在过去几年中，安全性在组织信息战略中的地位得到了加强。数据领域的主要市场参与者都认同，威胁诊断比威胁缓解更具相关性。为了防止脆弱区域被利用，组织采用了数据加密和编辑策略、主动监控以及细粒度访问控制等技术。图\
  \ 6-1 展示了在为企业确定稳定安全策略方面起关键作用的因素。\n\n![A454145_1_En_6_Fig1_HTML.jpg](img/A454145_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n在确定稳定安全策略方面起关键作用的因素\n\n本章将深入探讨 Hadoop 数据湖的安全方面。首先介绍标准系统架构，让读者熟悉网络安全、防火墙和\
  \ Hadoop 集群的组件。\n\n## 系统架构\n\n在前面的章节中，我们已经了解到 Hadoop 提供分布式存储和分布式处理范式来处理大型数据集。在处理大型集群时，我们必须牢记的领域包括操作环境、其操作模式以及网络带宽。有多个因素影响\
  \ Hadoop 操作环境的选择。由于网络和服务器技术的快速发展，Hadoop 可以存在于几种不同的环境中。\n\n1.  内部部署 – Hadoop 可以在企业拥有和控制的数-据中心进行设置。它们由一组物理机（裸机）搭建而成。\n\
  2.  托管 – 托管设置是内部部署的一种变体，包含物理服务器，但不由组织拥有或运营。这些服务器从外部供应商处租赁，由该供应商负责配置、运营和维护。\n3. \
  \ 云服务模型 – 这可谓是当下的热门话题。多家科技巨头已经开始提供供公众使用的虚拟化服务器，作为“云”服务。可以利用虚拟化基础设施来运行各种系统，大到数据中心，小到一个简单的应用程序。作为云客户，公司只需为他们订阅和使用的服务付费，就像在餐厅享用自助餐或点菜午餐一样。\n\
  \n### 网络安全\n\n网络分段将集群环境与更大的网络在物理和逻辑上隔离开来。物理网络分段是分离物理设备，如网络交换机、路由器、VLAN 和防火墙，而逻辑网络分段则可以通过使用独立的互联网协议（IP）地址来实现。\n\
  \n![A454145_1_En_6_Fig3_HTML.jpg](img/A454145_1_En_6_Fig3_HTML.jpg)\n\n图 6-3\n\n\
  使用 IP 子网的逻辑分离\n\n![A454145_1_En_6_Fig2_HTML.jpg](img/A454145_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n使用路由器的物理分段\n\n网络防火墙保护内部网络免受来自外部代理的未授权和恶意访问。它可以配置为限制内部用户对外部的访问。防火墙持续监控所有入站和出站流量。它可能会限制特定应用程序访问网络、阻止\
  \ URL 加载，以及阻止通过某些网络端口的流量。\n\n可能存在一种网络防火墙，它会阻止所有流量，只允许一个（或少数几个）被明确启用的访问。这种做法有助于保护网络免受恶意威胁。防火墙基于传入的\
  \ IP 地址、端口和协议进行分析，从而保护内部网络。\n\n入侵检测与防御是监控网络中发生的事件，并分析这些事件以寻找可能的安全事件、违规行为或对安全策略构成迫在眉睫威胁的迹象的过程。另一方面，防御是检测入侵并阻止此类事件的过程。这些安全措施以入侵检测系统（IDS）和入侵防御系统（IPS）的形式提供，它们成为网络的一部分，用于检测和阻止潜在的安全事件。可以捕获、分析\
  \ IDS 日志并将其发送到监控系统以发出警报。入侵检测可以是基于签名的，也可以是基于异常的。入侵防御系统则监控并试图阻止入侵。\n\n![A454145_1_En_6_Fig4_HTML.jpg](img/A454145_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n使用 IPS 和 IDS 流程的被动监控与主动监控对比\n\n### 集群内的 Hadoop 角色\n\n可以根据集群中各节点组扮演的角色及其提供的服务，将安全策略应用于这些节点组。在一个典型的\
  \ Hadoop 集群中，各个组可以包括 Master 节点、Worker 节点、管理节点和边缘节点。\n\n#### Master 节点组\n\n该组包含所有托管主服务的节点，例如\
  \ `Namenode`、`Standby name node`（备用名称节点）、`Resource Manager`（资源管理器）、`Hive Server`（Hive\
  \ 服务器）和 `zookeeper`。这些服务应能访问其他服务，同时，由于它们属于重要服务，这些节点上的安全性应很高。\n\n![A454145_1_En_6_Fig5_HTML.jpg](img/A454145_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5\n\nHadoop 存储和处理框架\n\n不应允许普通用户/程序访问这些节点，因为这可能导致意外漏洞以及诸如机密数据访问和服务中断等情况。\n\n\
  \n\n【工作节点组】\n\n该组包含所有托管工作服务的节点，例如`Data Node`服务、`Node Managers`和`Task Trackers`。工作节点需要与各自的主节点进行网络层面的通信，因为它们通过`RPC`和`TCP\
  \ IP`进行交互。与主节点一样，工作节点也需要高度安全。只有管理员才应被允许访问这些节点。\n\n【管理节点】\n\n管理节点通过提供配置管理、监控和告警功能，促进集群的无缝运行。这些节点通常包含用于构建整个集群的初始仓库。它们可以是`hive\
  \ metastore`、`oozie`或`Ambari server`。\n\n`Apache Ambari`是`Hortonworks`发行版的管理软件。安装了`Ambari`的服务器就是一个管理节点。它需要一个后端数据库，而该数据库本身也将是一个管理节点。由于这些节点上的安全漏洞可能导致整个集群的干扰，因此需要仔细的访问管理。\n\
  \n【边缘节点】\n\n边缘节点托管用户与之交互的各种客户端，例如`Hive/Spark Clients`、`Gateways`、`Sqoop`、`Oozie\
  \ clients`以及`Hue/Ambari views`。可以根据其集群使用情况对用户进行分类。\n\n【数据安全层】\n\n对于大型企业系统，实施跨越数据湖生态系统不同层级的数据安全解决方案非常困难。一个系统可能提供多个入口点，如存储、网络和用户群体。因此，遵循分层方法来保护所有可能暴露漏洞的点是一个良好的实践。\n\
  \n让我们回顾数据移动的阶段，了解如何防止不安全点受到攻击。\n\n1. 数据通过网络进入数据湖 – 网络安全层通过在允许用户访问 Hadoop 数据湖之前对其进行身份验证，来防止恶意攻击。\n\
  2. 存储 – 存储在数据湖中的数据具有巨大的商业价值，为了确保这些数据的安全，强加密层是一个值得推荐的解决方案。我们可以采用`Transparent Data\
  \ Encryption (TDE)`、`Ranger KMS`以及许多其他保证存储级加密的方案。\n3. 当前正在访问的数据 – 从数据湖中选取的数据应在数据湖内安全传输。`Ranger`在细粒度数据级别提供了广泛的安全功能，可用于为`hive`实现动态列掩码或行过滤。\n\
  \n## 用于操作系统安全的主机防火墙\n\n主机防火墙可以是 Linux 内核中的`iptables`（也称为数据包过滤器），也可以是一组拦截网络流量的程序。代理服务器代表特定的网络应用程序从一个网络到另一个网络建立连接。代理通常比数据包过滤器慢。\n\
  \n可以配置`IPTables`策略来拦截 Hadoop 集群流量。一个典型的 Hadoop 集群会为不同的服务开放一些通用端口。可以配置`Iptables`规则，通过`IPs`和这些端口来限制流量。可以根据需求收紧或放宽这些规则。例如，\n\
  \n```\niptables -A hdfs -p tcp -s 0.0.0.0/0 --dport 50070- -j ACCEPT\n```\n\n上述命令将允许所有服务器（`0.0.0.0`）连接到该节点，因为它没有限制传入的\
  \ IP 地址。但下面的命令则更为严格，它只允许 IP 地址为`10.230.224.18`的服务器进行连接。\n\n```\niptables -A hdfs\
  \ -p tcp -s 10.230.224.18/32 --dport 50070- -j ACCEPT\n```\n\n在所有发往集群的通信都通过边缘节点进行的设置中，上述命令将非常有用。必须将边缘节点的\
  \ IP 地址添加到`iptables`策略中。\n\n## 传输中的数据\n\n传输中的数据因其能够驱动可操作情报而具有首要的重要性。然而，必须清楚一个事实：数据在通信传输期间是最脆弱的。这是数据离开网络并通过未知网络组件进行路由的时期，使其容易受到各种形式的攻击，因此必须保护传输中的数据。\n\
  \n已经发布的研究旨在解决这个问题，其核心思想围绕着创建加密通道。`OSI`堆栈有多个层可以创建此通道，但最流行的是基于开放系统互连（`OSI`）堆栈的传输层构建的。加密传输层具有跨应用程序重用加密的优势。\n\
  \n### 通信问题\n\n典型的通信可以由图 6-6 所示的场景来展示。\n\n![A454145_1_En_6_Fig6_HTML.png](img/A454145_1_En_6_Fig6_HTML.png)\n\
  \n*图 6-6 对 A 和 B 之间通信信道的安全攻击*\n\n发送者`A`想要安全地向接收者`B`发送数据。我们不希望攻击者`C`破解或篡改`A`和`B`之间的通信。这可以通过加密`A`和`B`之间的数据来实现，这样`C`就无法理解，因此也无法篡改数据。除了保密性之外，`A`和`B`在通信前还需要相互认证，因为攻击者`C`伪装成`A`或`B`都可能危及系统安全。\n\
  \n因此，对于安全通信，有三个主要问题需要解决。\n\n1. **身份验证** - 证明你是你声称的那个人\n2. **保密性** – 确保只有经过身份验证的预期用户才能读取数据\n\
  3. **完整性** – 确保数据未被篡改\n\n如何解决这些问题？嗯，这三个问题目前都由一类称为非对称密钥算法的算法来确保。这类算法也通常被称为公钥/私钥密码学。\n\
  \n用公钥加密的消息只能用私钥解密，反之亦然。私钥作为秘密保存，公钥则向公众开放。这解决了以下问题：\n\n1. **身份验证**，通过数字签名完成。在这种情况下，发送者使用其私钥对消息进行签名。任何拥有发送者公钥的人都可以解密该消息，如果解密成功，则可以确信只有拥有私钥的人才能加密该数据。\n\
  2. **完整性**由加密来保证。消息成为加密算法的输入，因此只有预期消息相同时，解密才能成功。\n3. **保密性**通过使用某人的公钥对消息签名来维护。因此，只有拥有秘密私钥的人才能解密该消息。\n\
  \n行业中常用的两种算法是`RSA`和椭圆曲线密码学。两者都基于公钥/私钥加密。密钥本身存储在称为证书的文件中。最常见的是`X.509`证书，其中包含公钥。\n\
  \n为了对数据进行数字签名，使用了哈希函数。哈希函数具有以下特性。\n\n当应用于消息时，结果消息极难破解，并且不会给出关于消息的线索，因此不可能逆向推导。其次，它们具有较低的碰撞因素，即使用相同哈希函数的两个不同消息会返回不同的结果。常用的哈希函数有`MD5`、`SHA1`和`SHA2`。\n\
  \n其过程是这样的：发送者创建消息哈希，并用私钥进行加密。接收者收到消息后，使用哈希函数生成公钥，并解密接收到的消息。如果两个消息匹配，那么它只能由相同的哈希函数生成，并且只有拥有私钥的人才能加密该消息，因此身份验证和完整性得以维护。\n\
  \n公钥的有效性由一个称为证书颁发机构（`CA`）的中央权威机构来保证。公钥基础设施（`PKI`）维护证书的有效性和生命周期。\n\n\n\n非对称密码学的缺点在于处理大量数据时开销较大。当前可用的公共基础设施能高效加密约\
  \ 100KB 的数据，远低于当前市场的需求。为解决这一问题，存在一类称为对称密钥算法的独立算法，其使用同一密钥对数据进行加密和解密。它们比非对称密钥算法快得多。这些算法的常见示例包括`AES`（64\
  \ 位和 128 位）、`Blowfish`、`DES`（内部机制、三重 DES）、`Serpent`和`Twofish`。这些方法的问题在于需要将同一密钥分发给双方，这对于两个未知方来说是非常困难的任务。这通过一种称为`Diffie-Hellman`的交换协议得以规范化。\n\
  \n总体思路是结合使用这两类算法以发挥各自优势。我们通常使用非对称密钥算法进行身份验证以及将对称密钥传递给双方。然后，使用彼此之间传递的对称密钥对大量消息进行加密。\n\
  \n该策略在传输层通过`TLS`和`IPSec`等协议实现。`TLS`是旧方法`SSL`的继承者。这些策略在保护传输中数据的安全方面发挥着重要作用。\n\n##\
  \ 静态数据\n\n静态数据指的是物理存储在数据存储、仓库、归档、在线或离线备份或任何其他设备中的数据。它可能处于活跃操作状态，也可能不处于活跃操作状态，但可用于获取历史洞察。`LUKS`（Linux\
  \ 统一密钥设置）可用于加密磁盘上的静态数据。它指定了一种平台无关的标准磁盘格式，通过标准化提供了兼容性。`LUKS`的参考实现在 Linux 上运行，基于增强版的`cryptsetup`，并使用`dm-crypt`作为磁盘加密后端。`Dm-crypt`是一个透明的磁盘加密子系统，使用\
  \ Linux 内核加密 API 中的加密程序。这包括最常用的加密算法，如`AES`，以及哈希函数，如`SHA-256`。\n\n我们需要加密磁盘上的静态数据，以防止对设备的物理攻击或离线攻击。磁盘可能位于远程位置，这使我们有必要预期并防止诸如外部组织盗窃磁盘等攻击。在`LUKS`加密的磁盘被盗的情况下，攻击者将无法在没有有效密码的情况下挂载该设备。通过`cryptsetup`挂载设备也需要密码。由于`LUKS`坚持使用强密码，并使用盐值来提高低熵密码的安全性，因此消除了其他密钥管理系统面临的大多数攻击。`LUKS`还支持一个磁盘最多拥有\
  \ 8 个密码（图 6-7）。\n\n![A454145_1_En_6_Fig7_HTML.png](img/A454145_1_En_6_Fig7_HTML.png)\n\
  \n**图 6-7** LUKS 的磁盘布局\n\n从上图来看，`KM`代表[密钥材料]，而大量数据是用户数据。\n\n### 在 LUKS 中生成和验证密钥的流程\n\
  \n用户提供密码。此密码后附一个盐值。基于密码的密钥派生函数（`PBKDF`）根据此值生成一个密钥。借助加密的主密钥，它被转换为实际的主密钥（`MK`）。\n\n\
  为了验证密钥，我们将主密钥和盐值提供给`PBKDF2`函数，并与主密钥摘要值进行比较，如图 6-8 所示。\n\n![A454145_1_En_6_Fig8_HTML.jpg](img/A454145_1_En_6_Fig8_HTML.jpg)\n\
  \n**图 6-8** LUKS 中的密钥生成与验证\n\n### 用户访问流程\n\n在通过`cryptsetup`成功认证后，用户通过挂载点与物理磁盘的映射器进行交互（图\
  \ 6-9）。\n\n![A454145_1_En_6_Fig9_HTML.png](img/A454145_1_En_6_Fig9_HTML.png)\n\n\
  **图 6-9** 通过`cryptsetup`的用户访问流程\n\n下面，我们使用 B 树文件系统（`btrfs`）来测量`LUKS`加密前后的读写性能。以下步骤提供了安装`btrfs`、创建挂载点以及检查读写性能的信息。\n\
  \n**步骤 1 - 安装 btrfs**\n\n```\n$ yum install btrfs-progs\n```\n\n**步骤 2 - 在磁盘上创建\
  \ btrfs 文件系统**\n\n```\n$ mkfs.btrfs /dev/sda1\n```\n\n**步骤 3 - 出于测试目的，我们将其挂载到 /mnt**\n\
  \n```\n$ mount /dev/sda1 /mnt\n$ chmod 777 /mnt\n```\n\n**步骤 4 - 检查写入速度（文件大小：948MB，分配给文件系统的总大小为\
  \ 1GB，因此无法尝试更大的文件）**\n\n```\n$ dd if=/dev/sdf/test1 of=/mnt/dd-test1 bs=1M conv=fsync\n\
  Result -  72MB/s\n```\n\n再次运行相同的命令：\n\n```\nResult -  69MB/s\n```\n\n**步骤 5 - 检查读取速度（文件大小：948MB）**\n\
  \n```\n$ dd if=/mnt/dd-test1 of=/dev/null bs=1M\nResult -  79.6MB/s\n```\n\n再次运行相同的命令：\n\
  \n```\nResult: 3.3GB/s\nReason: Data is cached.\n```\n\n要使用`LUKS`，请执行以下步骤：\n\n**步骤\
  \ 1 - 卸载文件系统**\n\n```\n$ umount /dev/sda1\n```\n\n**使用 LUKS 加密磁盘的步骤：**\n\n1.  在机器上安装`cryptsetup`\n\
  \n    ```\n    $ yum install cryptsetup-luks\n    ```\n\n2.  上述命令将安装`cryptsetup`——这是我们将用来使用`LUKS`加密磁盘的前端工具。\n\
  \n**在磁盘 /dev/sda1 上设置 LUKS：**\n\n1.  格式化磁盘，请事先做好必要备份。\n\n    ```\n    $ sudo cryptsetup\
  \ luksFormat /dev/sda\n    ```\n\n2.  首次设置`luks`加密时，我们使用`luksOpen`命令，如下所示。此命令的输出是提示用户输入密码。该密钥将位于密钥槽\
  \ 0 中。\n\n    ```\n    $ sudo cryptsetup luksOpen /dev/sda1 crypt\n    ```\n\n3.\
  \  然后，我们使用带有指定文件系统的`mkfs`命令——由于我们在`/dev/sda1`上部署了`btrfs`（B 树文件系统），我们使用`mkfs.btrfs`创建文件系统映射，如下所示：（`dev/mapping`是存储文件系统逻辑映射的目录）\n\
  \n    ```\n    $ sudo mkfs.btrfs /dev/mapper/crypt\n    ```\n\n4.  我们现在如下从映射器挂载文件系统：\n\
  \n    ```\n    $ sudo mount /dev/mapper/crypt /mnt\n    ```\n\n5.  我们使用`chmod`向目录添加必要的权限：\n\
  \n    ```\n    $ sudo chmod 777 /mnt\n    ```\n\n**LUKS 加密后：**\n\n1.  在用`Luks`加密磁盘`/dev/sda1`后，检查`luksDump`以查看活跃的密钥槽和密文。\n\
  \n    ```\n    $ cryptsetup luksDump /dev/sda1\n    ```\n\n2.  `luksDump`的输出见图 6-10。\n\
  \n    ![A454145_1_En_6_Fig10_HTML.jpg](img/A454145_1_En_6_Fig10_HTML.jpg)\n\n  \
  \  **图 6-10** LUKS dump 输出\n\n3.  由于`sda1`已加密，无法直接挂载，`$ mount /dev/sda1 /mnt`会报错：“`unknown\
  \ filesystem type:crypto-LUKS`”\n\n4.  我们必须使用`cryptsetup`打开`/dev/sda1`，这需要之前提供的密码\
  \ `$ cryptsetup open /dev/sda1 crypt` – 此命令请求输入密码，输入错误密码会再次提示，正确密码则允许通过我们命名为`crypt`的逻辑映射来访问设备。\n\
  \n5.  通过逻辑卷`/dev/mappercrypt`挂载`/dev/sda1`\n\n    ```\n    $ mount /dev/mapper/crypt\
  \ /mnt\n    ```\n\n6.  您现在可以通过挂载点`/mnt`访问`sda1`上的文件。\n\n    ![A454145_1_En_6_Fig11_HTML.jpg](img/A454145_1_En_6_Fig11_HTML.jpg)\n\
  \n    **图 6-11** 使用`cryptsetup`访问设备\n\n### 使用 LUKS 的性能\n\n以下命令可以给出`LUKS`实现的读写速度。请注意，这些数字是系统相关的，在您的系统上可能显示不同的值。\n\
  \n**检查写入速度：**\n\n```\n$ dd if=/dev/sdf/test1 of=/mnt/dd-test1 bs=1M conv=fsync\n\
  Result -  71MB/s\n```\n\n**检查读取速度：**\n\n```\n$ dd if=/mnt/dd-test1 of=/dev/null\
  \ bs=1M\nResult -  91MB/s\n```\n\n\n\n### 使用 LUKS 设置多个密码短语\n\n要添加新密钥，请使用以下命令。该命令需要现有密码短语之一来授权设置新的密码短语。\n\
  \n1. `$ cryptsetup luksAddKey /dev/sda1` 会提示输入现有密码短语，然后允许我们设置一个新密码短语。这将使密钥槽 1 变为活动状态。再次运行\
  \ `luksDump` 命令以检查活动的密钥槽。\n2. 我们最多可以为单个设备设置 8 个密码短语。³\n\n## Kerberos\n\nKerberos\
  \ 是一种计算机网络认证协议，它基于票据工作，允许节点在非安全网络上以安全的方式相互证明身份。简单来说，它采用强身份验证方法来建立用户身份，从而允许安全访问数据湖。\n\
  \n部署 Kerberos 安全框架的用户、设备和服务只需信任密钥分发中心（`KDC`）。`KDC` 作为一个单一进程运行，提供两种服务，即认证服务和票据授予服务。`KDC`\
  \ 票据支持相互认证，允许节点安全地相互证明身份。\n\nKerberos 的名字来源于希腊神话中的角色刻耳柏洛斯（Kerberos），即冥界的三头看门犬。它最初是为客户端-服务器模型设计的，旨在为用户和服务器提供相互身份验证以进行身份确认。Kerberos\
  \ 最初由麻省理工学院（`MIT`）的雅典娜计划（Project Athena）开发。\n\n### Kerberos 协议概述\n\n1. Kerberos\
  \ 中的身份称为主体（principals）。每个参与 Kerberos 认证协议的用户和服务都需要一个主体来唯一标识自己。\n2. 主体分为两类。\n   \
  \ 1. 用户主体 - 用户主体与操作系统中的用户名和账户相关联。\n    2. 服务主体 - 服务主体代表用户需要访问的服务，例如特定的服务器或数据库。\n\
  3. Kerberos 领域 - Kerberos 领域是一个认证管理域。所有主体都分配到一个领域。\n4. 密钥分发中心（`KDC`） - `KDC` 包含三个组件。\n\
  \    1. Kerberos 数据库 - 它存储所有关于主体及其所属领域的信息，以及其他相关信息。\n        1. 数据库中的 Kerberos 主体按以下命名约定存储：\n\
  \            1. `greg@TEST.COM` - 一个用户主体，明确标识了领域 `TEST.COM` 中的用户 Greg。领域名称始终大写。\n\
  \            2. `Julie/admin@TEST.COM` - 用户主体的另一种表示方式。这里指的是领域 `TEST.COM` 中的管理员 Julie。“/”（斜杠）分隔了短名称和\
  \ admin。\n            3. `hdfs/node02.test.com@TEST.COM` - 这是来自 `TEST.COM` 领域中主机\
  \ `node02.test.com` 上的 `HDFS` 服务的服务主体示例。\n    2. 认证服务 - 认证服务，也称为票据授予票据（`TGT`），是由\
  \ Kerberos 认证模型中的服务器签发的一小块加密数据，用于启动认证过程。当客户端收到认证票据后，它会将该票据连同自己的身份信息一起发送回 `KDC` 服务器。`KDC`\
  \ 服务器会生成一个服务票据和一个会话密钥（其中包含一种密码形式），从而完成该会话的授权过程。\n    3. 票据授予服务（`TGS`） - `TGS` 负责验证票据授予票据并授予服务票据。服务票据使经过认证的主体能够使用应用服务器提供的、由服务主体标识的服务。\n\
  \n### Kerberos 组件\n\n在讨论流程之前，让我们先了解一下 Kerberos 的组件。\n\n1. `TGT`：票据授予票据或获取票据的票据（`TGT`）是一个小型加密标识文件，具有有限的有效期。认证后，此文件会被授予用户，以便为所需服务建立安全的客户端-服务器会话。\n\
  2. Kerberos 主体 - 主体是集群中任何服务、节点或用户的身份标识。\n3. Kerberos 领域 - 领域一词表示一个认证管理域，它定义了一组受同一主\
  \ `KDC`（密钥分发中心/Kerberos 域控制器）服务器管理的系统。`KDC` 服务器运行两个功能服务。\n    1. `AS` - 认证服务 – 认证\
  \ Kerberos 主体\n    2. `TGS`：票据授予服务 - 授予对特定服务的访问权限\n\n### Kerberos 流程\n\n用户 Greg\
  \ 正试图通过一个服务连接到特定节点（`node02`）上的域 `test.com`。让我们了解 Kerberos 在允许 Greg 访问所需域之前如何对其进行认证。\n\
  \n让我们从示例中明确识别 Kerberos 组件。\n\n* Kerberos 领域是域，即 `TEST.COM`。\n* 拥有 Kerberos 用户主体\
  \ `greg@TEST.COM` 的系统`用户`，即 Greg\n* 集群内将托管在节点 `node02.test.com` 上的一个服务，由 `testservice/node02.test.com@TEST.COM`\
  \ 标识\n\nKerberos 领域 `TEST.COM` 的 `KDC` 服务器 - `kdc.test.com`\n\n1. Greg 需要获取一个 `TGT`。为此，他向\
  \ `kdc.test.com` 的 `AS` 发起请求，表明自己是主体 `greg@TEST.COM`。\n2. 认证服务响应，提供一个用 Greg 的密钥加密的\
  \ `TGT`。\n3. 收到加密消息后，系统提示 Greg 为主体 `greg@TEST.COM` 输入正确的密码以解密该消息。\n4. 成功解密包含 `TGT`\
  \ 的消息后，Greg 现在向 `kdc.test.com` 的 `TGS` 请求一个服务授予票据，用于领域（`TEST.COM`）内标识为 `hdfs/node02.test.com@TEST.COM`\
  \ 的服务，并在请求中出示 `TGT`。\n5. `TGS` 验证 `TGT` 并向 Greg 提供一个用 `hdfs/node02.test.com@TEST.COM`\
  \ 主体密钥加密的服务票据。\n6. Greg 现在将服务票据出示给托管该服务的服务器，服务器使用 `hdfs/node02.test.com@TEST.COM`\
  \ 密钥解密并验证该票据。因此，在成功认证后，服务器通过建立客户端-服务器会话，允许客户端（Greg）访问并使用该服务。\n\n大型组织的 Kerberos 领域\
  \ - 虽然单个领域对组织来说运行良好，但对于某些大型企业而言，这通常不现实。随着时间的推移，大型组织最终会设置多个领域，只是为了简化并隔离组织的不同部分。默认情况下，`KDC`\
  \ 知道自己的领域、主体和数据库。如果来自一个领域的用户想要使用由另一个领域控制的服务，则这两个领域之间需要建立 Kerberos 信任关系。假设一个`财务`部门的专业人员和一个`人力资源`部门的专业人员需要相互沟通，那么他们需要信任彼此领域的信息。\n\
  \n所以基本上，存在两种信任关系：单向信任和双向信任。假设财务领域需要访问人力资源领域。这种情况需要单向信任。要建立双向信任（即完全信任），主体需要同时存在于两个领域上。例如\
  \ - 要使 `HR.TEST.COM` 领域与 `FINANCE.TEST.COM` 领域建立完全信任，需要同时存在主体 `krbtgt/FINANCE.TEST.COM@HR.TEST.COM`\
  \ 和 `kbrtgt/HR.TEST.COM@FINANCE.TEST.COM`。\n\n\n\n### Kerberos 命令\n\n以下是 Kerberos\
  \ 管理命令的列表。\n\n1.  `KINIT` – `kinit` 用于获取并缓存主体的初始票据授予票据。\n2.  使用 keytab 文件的 `kinit`\
  \ – keytab 是一个包含 Kerberos 主体与加密密钥（由 Kerberos 密码派生而来）配对的文件。你可以使用 keytab 文件通过 Kerberos\
  \ 向各种远程系统进行认证，而无需输入密码。但是，当你更改 Kerberos 密码时，需要重新创建所有 keytab 文件。Keytab 文件通常用于让脚本能够自动通过\
  \ Kerberos 进行认证，无需人工交互或访问存储在纯文本文件中的密码。然后，脚本可以使用获取到的凭据来访问存储在远程系统上的文件。\n3.  `KLIST`\
  \ – `klist` 用于列出凭据缓存中持有的 Kerberos 主体和 Kerberos 票据，或 keytab 文件中持有的密钥。\n4.  `KDESTROY`\
  \ – `kdestroy` 实用程序通过覆盖并删除包含用户活动 Kerberos 授权票据的凭据缓存来销毁这些票据。如果未指定凭据缓存，则销毁默认的凭据缓存。\n\
  \n### Kerberos 主体到用户名的映射\n\nKerberos 使用两部分主体（`greg@TEST.COM`）或三部分主体（`hdfs/node02.test.com@TEST.COM`），其中包含短名称、领域以及可选的实例名称或主机名。为了简化用户名的使用，Hadoop\
  \ 通过在 `krb5.conf` 文件中使用 `auth_to_local` 设置，将 Kerberos 主体名称映射到本地用户名，或者可以在 `core-site.xml`\
  \ 的 `Hadoop.security.auth_to_local` 参数中配置 Hadoop 特定的规则。\n\n映射由一组规则组成，这些规则会按照在 `Hadoop.security.auth_to_local`\
  \ 属性中列出的顺序进行评估。第一个与主体名称匹配的规则将用于将该主体名称映射到短名称。列表中稍后与该主体名称匹配的任何后续规则都将被忽略。你可以在 `Hadoop.security.auth_to_local`\
  \ 属性中按如下方式指定映射规则：\n\n```\nHadoop.security.auth_to_local\n\nRULE:[]()\nRULE:[]()\n\
  DEFAULT\n```\n\n### Hadoop 用户到组的映射\n\n用户的组由组映射服务提供程序确定。Hadoop 支持多种组映射机制，通过 `Hadoop.security.group.mapping`\
  \ 属性进行配置。这意味着只有映射被调用的服务器上配置的组才对 Hadoop 可见。在实践中，确保 Hadoop 集群中所有服务器对将访问集群的用户和组具有一致的视图非常重要。\n\
  \n```\nHadoop.security.group.mapping\norg.apache.Hadoop.security.LdapGroupsMapping\n\
  ```\n\n### 使用 LDAP 的用户到组映射\n\n对于组仅可从 LDAP 或 Active Directory 服务器获取，而非集群节点获取的环境。Hadoop\
  \ 提供了 `LdapGroupsMapping` 实现。可以通过在 NameNode、JobTracker 或 ResourceManager 上的 `core-site.xml`\
  \ 中设置参数来配置此方法。\n\n此提供程序支持使用 JNDI API 进行简单密码认证的 LDAP。必须设置参数 `Hadoop.security.group.mapping.ldap.url`。该参数指用于解析用户组的\
  \ LDAP 服务器的 URL。\n\n`Hadoop.security.group.mapping.ldap.base` 配置 LDAP 连接的搜索基点。这是一个可分辨名称，通常会是\
  \ LDAP 目录的根。对于给定的用户名，首先查找该用户，然后查找该用户结果所属的组。如果目录设置具有不同的用户和组搜索基点，请使用参数 `Hadoop.security.group.mapping.ldap.userbase`\
  \ 和 `Hadoop.security.group.mapping.ldap.groupbase` 配置。\n\n如果 LDAP 服务器不支持匿名绑定，请在\
  \ `Hadoop.security.group.mapping.ldap.bind.user` 参数中设置要绑定的用户的可分辨名称。包含绑定用户密码的文件路径在\
  \ `Hadoop.security.group.mapping.ldap.bind.password.file` 中指定。此文件应仅由运行守护进程的 Unix\
  \ 用户可读。\n\n在搜索和等待结果时可以设置最大时间限制。如果希望无限等待，请将 `Hadoop.security.group.mapping.ldap.directory.search.timeout`\
  \ 设置为 0。默认值为 10,000 毫秒（10 秒）。这是每次 LDAP 查询的限制。如果 `Hadoop.security.group.mapping.ldap.search.group.hierarchy.levels`\
  \ 设置为正值，则总延迟将受限于 `max(递归深度, Hadoop.security.group.mapping.ldap.search.group.hierarchy.levels)\
  \ * Hadoop.security.group.mapping.ldap.directory.search.timeout`。\n\n`Hadoop.security.group.mapping.ldap.base`\
  \ 配置了在解析组时向上遍历组层次结构的深度。默认情况下，限制为 0，即用户必须是 LDAP 中的显式成员，才能被视为组的成员。否则，它将向上遍历组层次结构 `Hadoop.security.group.mapping.ldap.search.group.hierarchy.levels`\
  \ 层。\n\n```\nHadoop.security.group.mapping.provider.ad4usersX.ldap.url\nldap://ad-host-for-users-X:389\n\
  \n名为 'ad4usersX' 的提供程序的 ldap url。注意此属性来自\n'Hadoop.security.group.mapping.ldap.url'。\n\
  \nHadoop.security.group.mapping.provider.ad4usersY.ldap.url\nldap://ad-host-for-users-Y:389\n\
  \n名为 'ad4usersY' 的提供程序的 ldap url。注意此属性来自\n'Hadoop.security.group.mapping.ldap.url'。\n\
  ```\n\n### Hadoop 用户\n\n在 Hadoop 环境中，集群的所有 Hadoop 用户必须预配到集群的所有服务器上。这些用户可以在本地的 `/etc/passwd`\
  \ 密码文件中存在，或者更常见的是，通过让服务器访问基于网络的目录服务（如 open-LDAP 或 Active Directory）来预配。\n\n### 认证\n\
  \n如果 Hadoop 使用其所有默认配置进行配置，则 Hadoop 不会对用户进行任何身份认证。认识到这一点非常重要，因为它可能在企业数据中心产生严重影响。\n\
  \n假设 Greg 用户有权访问 Hadoop 集群。到目前为止，尚未对 Hadoop 集群施加任何安全要求。用户可以在无需任何身份认证的情况下进行交互。尽管\
  \ Greg 既不是超级用户，也没有 hdfs 用户密码，但他可以访问配置为访问集群的客户端机器。他不负责任地发出了两个命令：\n\n```\nsudo useradd\
  \ hdfs\nsudo -u hdfs Hadoop fs -rmr /\n```\n\n不言而喻，集群已经离线并删除了所有内容。那么，刚刚发生了什么？在一个不安全的集群中，默认情况下，NameNode\
  \ 或 JobTracker 不需要任何形式的身份认证。这意味着你可以执行所有属于 hdfs 和 mapred 用户权限范围内的操作。\n\n在分布式系统中，确保用户的每个请求都通过用户身份进行验证至关重要。我们需要对每次交互进行身份认证。例如，在\
  \ MapReduce 作业中，认证发生在客户端和 NameNode 之间，以及客户端和 Job Tracker 之间。为了提交作业，JobTracker 会创建多个任务，这些任务由集群中的每个\
  \ TaskTracker 启动。每个 TaskTracker 必须与 NameNode 通信才能打开组成其输入分片的文件。为了让 NameNode 强制执行文件系统权限，每个任务都应针对\
  \ NameNode 进行认证。Hadoop 采用基于令牌的身份认证方法来白名单化客户端，并允许其在集群上执行操作。\n\nHadoop 通过分发身份认证令牌来解决此问题，这些令牌可以分发给每个任务，但仅限于特定服务。让我们看看这些委托令牌是如何工作的——\n\
  \n\n\n### HDFS 身份验证与委托令牌\n\n1. 客户端发起一个`RPC`请求，通过`Kerberos`票据来申请一个委托令牌进行身份验证。\n2.\
  \ `NameNode`接收请求并响应一个委托令牌。\n3. 身份验证完成后，客户端被允许使用该委托令牌发起操作进行身份验证。\n4. 令牌验证通过后，`NameNode`执行客户端发出的命令。\n\
  \n### HDFS 授权\n\n**授权** 是一种定义你可以访问什么、不可以访问什么的方法。请记住，身份验证提供了一种证明身份的技术，而授权是身份验证之后的活动，用于证明你在`Hadoop`集群中的访问权限。在`HDFS`中，授权是通过文件权限来实现的。\n\
  \n如果你在某个目录下运行`ls -l`，你会得到如下列表：\n\n```\n[etl@ip-etl]$ Hadoop fs -ls /apps/hive/warehouse/db/\n\
  Found 3 items\ndrwxrwxrwx    -etl   hdfs   0 2018-02-22 10:13 /apps/hive/warehouse/db/employees\n\
  drwxrwxrwx    -etl   hdfs   0 2018-02-22 10:13 /apps/hive/warehouse/db/departments\n\
  drwxrwxrwx    -etl   hdfs   0 2018-02-22 10:13 /apps/hive/warehouse/db/locations\n\
  [etl@ip-etl]$ Hadoop fs -ls /apps/hive/warehouse/db/employees\nFound 1 items\n-rwxrwxrwx\
  \   3 hive hdfs 21839221 2018-02-25 13:40 /apps/hive/warehouse/db/employees/000000_0\n\
  ```\n\n客户端如何授权访问位于数据节点上的一个块？这是通过块访问令牌机制完成的。一个标准的授权过程遵循以下步骤：\n\n1. 经过身份验证的客户端发起一个读取请求。\n\
  2. `NameNode`从元信息内存结构中收集关于数据块、数据节点以及最近的数据节点的信息。\n3. `NameNode`将块地址信息连同块访问令牌一起发送给客户端。\n\
  4. 客户端根据从`NameNode`收到的信息选择最近的数据节点。\n5. 客户端使用块访问令牌向最近的数据节点请求该块。\n6. 收到请求的数据节点验证所请求块的认证信息。\n\
  7. 根据块访问令牌和`NameNode`共享的密钥创建令牌验证器。密钥是`NameNode`和数据节点之间的身份验证令牌。它会定期更新，并通过心跳通信通道由`NameNode`共享。该密钥对客户端请求的块访问令牌进行加密。\n\
  8. 比较创建的令牌验证器和接收到的令牌验证器。如果匹配，则将请求的数据块发送给客户端。\n\n### HDFS 权限模型\n\n`Hadoop`分布式文件系统（`HDFS`）为文件和目录实现了一个权限模型，该模型在很大程度上沿用了`POSIX`模型。每个文件和目录都与一个所有者和一个组相关联。文件或目录对作为所有者的用户、属于该组的其他用户以及所有其他用户分别具有不同的权限。对于文件，需要`r`权限才能读取文件，需要`w`权限才能写入或追加到文件。对于目录，需要`r`权限才能列出目录内容，需要`w`权限才能创建或删除文件或目录，需要`x`权限才能访问目录的子项。\n\
  \n与`POSIX`模型相比，文件没有`setuid`或`setgid`位，因为没有可执行文件的概念。对于目录，作为简化，也没有`setuid`或`setgid`位。可以在目录上设置粘滞位，以防止除超级用户、目录所有者或文件所有者之外的任何人删除或移动目录中的文件。为文件设置粘滞位没有效果。文件和目录的权限统称为其模式。通常，将使用`Unix`表示和显示模式的惯例，包括在此描述中使用八进制数。当创建文件或目录时，其所有者是客户端进程的用户标识，其组是父目录的组。\n\
  \n### HDFS ACL\n\n随着`Hadoop 2.4`的发布，我们现在可以使用扩展`ACL`。这些`ACL`的工作方式与任何`Unix`操作系统中的`ACL`非常相似。`ACL`对于实现不同于用户和组自然组织层次结构的权限要求非常有用。`ACL`提供了一种为特定的已命名用户或已命名组（而不仅仅是文件的所有者和文件所属组）设置不同权限的方法。\n\
  \n默认情况下，对`ACL`的支持是禁用的，`NameNode`不允许创建`ACL`。要启用对`ACL`的支持，请在`NameNode`配置中将`dfs.namenode.acls.enabled`设置为`true`。\n\
  \n### 使用 Apache Ranger 进行 HDFS 授权\n\n`Apache Ranger`提供了一个用户同步工具，用于从`Unix`或`LDAP`或`Active\
  \ Directory`拉取用户和组。用户或组信息存储在`Ranger`门户中，并用于策略定义。\n\n`HDFS`是任何`Hadoop`部署的核心部分，为了确保`Hadoop`平台中的数据受到保护，安全性需要内置于`HDFS`层中。`HDFS`使用`Kerberos`身份验证进行保护，并使用`POSIX`风格的权限/`HDFS\
  \ ACL`或`Apache Ranger`进行授权。\n\n`Apache Ranger`是一个针对`Hadoop`的集中式安全管理解决方案，使管理员能够为`HDFS`和其他`Hadoop`平台组件创建并强制执行安全策略。`Apache\
  \ Ranger`为`HDFS`提供了一个联邦授权模型。用于`HDFS`的`Ranger`插件会检查`Ranger`策略，如果策略存在，则授予用户访问权限。如果`Ranger`中不存在策略，则`Ranger`将默认使用`HDFS`中的原生权限模型（`POSIX`或`HDFS\
  \ ACL`）。此联邦模型适用于`HDFS`和`Yarn`服务。\n\n![A454145_1_En_6_Fig12_HTML.jpg](img/A454145_1_En_6_Fig12_HTML.jpg)\n\
  \n图 6-12 `Apache Ranger`的联邦授权模型\n\n对于其他服务（如`Hive`或`HBase`），`Ranger`作为唯一的授权器运行，这意味着只有`Ranger`策略生效。回退模型的选项通过`Ambari\
  \ ➤ Ranger ➤ HDFS config ➤ Advanced ranger-hdfs-security`中的属性进行配置。\n\n#### Ranger\
  \ 的功能\n\n`Apache Ranger`提供了一个集中式安全框架，用于管理跨`HDFS`、`Hive`、`HBase`、`Storm`、`Knox`、`Solr`、`Kafka`、`Nifi`和`Yarn`的细粒度访问控制。通过`Apache\
  \ Ranger`控制台，安全管理员可以轻松管理对文件、文件夹、数据库、表或列的访问策略。这些策略可以为单个用户或组设置，并在`Hadoop`堆栈中一致地强制执行。\n\
  \n`Ranger`密钥管理服务（`Ranger KMS`）为`HDFS`的“静态数据”加密提供了一个可扩展的加密密钥管理服务。`Ranger KMS`基于最初由`Apache`社区开发的`Hadoop\
  \ KMS`，并通过允许系统管理员将密钥存储在安全数据库中来扩展原生`Hadoop KMS`的功能。\n\n`Ranger`还通过一个集中审计位置为安全管理员提供对其`Hadoop`环境的深度可见性，该审计位置实时跟踪所有访问请求，并支持包括`HDFS`和`Solr`在内的多个目标源。\n\
  \n![A454145_1_En_6_Fig13_HTML.jpg](img/A454145_1_En_6_Fig13_HTML.jpg)\n\n图 6-13\
  \ 针对`Hadoop`堆栈的`Ranger`设置\n\n*   **`Ranger Admin`** – `Ranger`管理门户为安全管理提供了一个交互式界面。安全管理员可以通过门户创建或修改策略。它有一个审计服务器，负责收集并将来自插件的审计数据发送到`HDFS`数据库。\n\
  *   **`Ranger Plugin`** – `Ranger`插件是基于`Java`的程序，嵌入在每个组件进程中。图 6-13 显示了嵌入在`Hive Server2`、`YARN`、`Kafka`或`Presto`中的各个`Ranger`插件。插件从中央服务器拉取策略并将其存储在本地。在用户请求事件发生时，插件会拦截该请求，以便针对策略定义进行评估。它还负责将数据发送到审计服务器。\n\
  *   **用户组同步** – `Ranger`通过从`LDAP`或`Active Directory`拉取用户和组并将其存储在`Ranger`中来帮助进行用户同步。\n\
  \n\n\n## 结论\n\n本章以非传统的方式探讨了数据湖安全问题。之所以说非传统，是因为它没有深入探讨`hive`中的数据脱敏层或密码保护，而是着重于培养安全意识以及为数据湖构建安全框架时的设计思路。我们讨论了数据在传输中和静态时的安全方面。展示`Kerberos`安全框架的用例将帮助读者理解`Kerberos`如何在没有任何网络泄露风险的情况下，为客户端、主机和服务建立身份标识。不仅如此，它还可以扩展并与`LDAP`和`active\
  \ directory`等其他身份管理工具集成。\n\n下一章，我们将介绍数据湖的高可用性。不仅涉及 Hadoop 组件的高可用性，我们还将探讨如何在主备和双活配置下设置多站点数据站点。\n\
  \n脚注 1  \nGartner 新闻稿，2017 年 3 月 14 日 - [`https://www.gartner.com/newsroom/id/3638017`](https://www.gartner.com/newsroom/id/3638017)\n\
  \n2  \n[`https://www.forbes.com/sites/gilpress/2017/10/17/top-10-hot-data-security-and-privacy-technologies/`](https://www.forbes.com/sites/gilpress/2017/10/17/top-10-hot-data-security-and-privacy-technologies/)\n\
  \n3  \n[`https://wiki.archlinux.org/index.php/Dmcrypt/Device_encryption#Cryptsetup_passphrases_and_keys`](https://wiki.archlinux.org/index.php/Dmcrypt/Device_encryption#Cryptsetup_passphrases_and_keys)\n\
  \n"
- "# 7. 确保数据湖的高可用性\n\n> “当人类判断力与大数据交汇时，就会发生一些有趣的事情。” ——纳特·西尔弗，FiveThirtyEight 创始人兼主编\n\
  \n数据分析的力量如此强大，以至于企业几乎完全依赖每日的信息点滴来发掘和推动新的商业机会。数据积累、实时处理和数据提炼的艺术与实践，帮助企业以最凝练的信息形式获得洞见。它使企业能与市场信息保持同步，理解行业趋势并快速行动。由于日常运营对数据的高度依赖，组织对数据湖的支持功能给予了最高程度的关注。数据湖支持功能包括数据质量、治理、架构和管理。数据湖的管理方面之一便是可用性和灾难恢复。\n\
  \n为什么数据湖的可用性对业务至关重要？想象一个重型零件生产单元，其装配线依赖于数据，而这些数据来自企业资源规划、数据仓库、客户服务以及一些统计模型的分析结果。如果消费层的数据陈旧或不可用，可能会直接对业务产生影响。同样，如果零售分析深入运行，基于消费者行为的学习模型向潜在买家发放优惠券，那么一旦数据湖不可用，这一切都将失败。在另一个特定的数据驱动预测案例中，气象预报员需要定期或提前获取地震更新信息，以便迅速行动、确保安全、最小化资本损失并提前制定补救措施。数据湖必须保持可用，以确保日常分析洞察的连续性。\n\
  \n灾难恢复是与数据湖生态系统高可用性相关的另一个术语。随着“数据湖”在本质上变得更具业务关键性，在数据量、多倍数据摄入和输出方面不断增长，并以持续流的形式运行，传统的灾难恢复策略已不再适用于企业。事实上，组织正在实施一种能够为故障事件期间的停机做好准备的数据湖灾难恢复计划。\n\
  \n本章将转向数据治理的一个关键方面，即数据可用性。我们将讨论 Hadoop 集群的高可用性模式，以及停机期间的风险缓解策略。我们将在数据湖的背景下介绍灾难恢复策略。\n\
  \n## 通过 HDFS 联合扩展 Hadoop\n\n数据扩展是处理海量数据集的组织所面临的一个关键问题。可扩展的数据湖能针对指数级增长和快速变化的数据集构建强大的免疫力。如果你听到用户抱怨因磁盘使用率高或内存不足导致的服务中断或性能缓慢，你必须准备好数据扩展的工具包。我们假设读者已经了解数据扩展的纵向扩展和横向扩展方法。\n\
  \n在深入探讨 Hadoop 高可用性的细节之前，让我们先了解一下 Hadoop 如何在关键业务环境中维持和提升可扩展性。到目前为止，Hadoop 1 展现了一个次优的框架，其可用性和可扩展性受限。以下是\
  \ Hadoop 1 架构的一些主要挑战。\n\n1.  单点`NameNode`导致的可用性限制 – 单点`NameNode`带来了单点故障的风险。如果它发生故障，Hadoop\
  \ 集群将陷入停机，直到`NameNode`被重新启动。\n2.  可扩展性 – Hadoop 的`DataNodes`具有良好的可扩展性，数据可以根据块大小和复制因子跨越多个数据节点。然而，它只能有一个命名空间。`NameNode`在内存中保存命名空间卷，而这对数据节点是不透明的。为了容纳更大的命名空间卷，`NameNode`只能进行纵向扩展。有限可扩展性的影响如下所列。\n\
  \    1.  容纳大容量和长周期命名空间卷的能力受限于`NameNode`的计算能力。\n    2.  所有数据访问请求都由单个`NameNode`处理。因此，`NameNode`和系统的性能取决于它的吞吐量。\n\
  \n`NameNode`充当了 Hadoop 文件系统的大脑。它管理着一个命名空间卷，该卷在命名空间和物理存储层之上提供了一个抽象层。关键点包括：\n\n* \
  \  命名空间保存了 Hadoop 文件系统的元数据、目录和块信息。\n*   块池是块管理层，通过它`NameNode`执行关键的块操作，如创建、更新、删除、副本不足、副本过剩和块报告。\n\
  \    *   块池既不存储数据块，数据块物理存储在数据节点中。数据节点会定期向`NameNode`发送心跳。\n\nHadoop 2 通过引入两项更改解决了上述挑战。首先，提供了一个备用`NameNode`，以便在活动`NameNode`发生故障时能够幸存下来。活动`NameNode`维护的`editLogs`会被复制到备用`NameNode`，并且在停机时，备用`NameNode`将承担主`NameNode`的角色。\n\
  \n其次，Hadoop 2 引入了多个`NameNodes`的联合架构，让它们共享命名空间卷。每个`NameNode`管理命名空间卷的一部分，并且与其他并行的`NameNodes`相隔离。`HDFS`或`NameNode`联合带来了水平扩展的能力，并缓解了`NameNode`级别的内存限制。命名空间卷包含一个命名空间和与该命名空间相关的块池。\n\
  \n图 7-1 展示了`NameNode`联合的设置。\n\n![A454145_1_En_7_Fig1_HTML.jpg](img/A454145_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n\n`HDFS`联合架构\n\n关键要点和设计考量：\n\n\n\n## NameNode 联合与高可用性\n\n1. NameNode 联合不会影响\
  \ Hadoop 的工作架构。每个活跃的 NameNode 都有其对应的备用 NameNode。\n2. 如果活跃的 NameNode 宕机，备用 NameNode\
  \ 将接管并管理各自的命名空间卷。\n3. 如果活跃和备用的 NameNode 都发生故障，则仅由该 NameNode 管理的块池将无法访问。\n4. 配置\n\
  \   1. 在`dfs.nameservices`参数中指定以逗号分隔的 NameNode。这应在初始配置或向集群添加 NameNode 时完成。\n   2.\
  \ 对 NameNode、Secondary NameNode 和备份节点的配置必须以命名空间服务 ID 作为后缀。例如，如果 `NS0214` 是一个命名空间服务\
  \ ID：\n      1. `dfs.namenode.rpc-address.NS0214`\n      2. `dfs.namenode.servicerpc-address.NS0214`\n\
  \      3. `dfs.namenode.http-address.NS0214`\n      4. `dfs.namenode.https-address.NS0214`\n\
  \      5. `dfs.namenode.keytab.file.NS0214`\n      6. `dfs.namenode.name.dir.NS0214`\n\
  \      7. `dfs.namenode.edits.dir.NS0214`\n      8. `dfs.namenode.checkpoint.dir.NS0214`\n\
  \      9. `dfs.namenode.checkpoint.edits.dir.NS0214`\n   3. 向集群添加新的 NameNode 时：\n\
  \      1. 添加命名空间服务参数并修改配置文件。\n      2. 启动主节点和辅助节点。\n      3. 刷新数据节点以识别新的 NameNode。\n\
  \n```\n$HADOOP_PREFIX/bin/hdfs dfsadmin -refreshNameNodes :\n```\n\n## Hadoop 组件的高可用性\n\
  \n在之前的章节中，我们已经讨论了 Hadoop 的存储和处理架构。从存储角度来看，NameNode 是所有读取和写入请求的守门人。同样，从处理角度来看，Hadoop\
  \ 提供了多个入口点，以便根据技能知识、数据处理专长以及将数据活动与服务级别协议对齐的能力来启用数据处理。本节将重点介绍 Hadoop 不同组件的高可用性配置。\n\
  \n### Hive Metastore\n\nHive Metastore 是一个存储库，包含在 Hive 中创建的所有表的元数据。在从 Hadoop 集群读取数据时，它用于将数据整合为特定格式（或模式）。其他处理框架，如\
  \ Spark、Cloudera Impala 和 Oracle Big Data SQL，也可以利用 Hive Metastore 来获取模式。因此，确保 Metastore\
  \ 服务对其消费者可用变得至关重要。\n\n备用 Metastore – 可以在主机上配置 Hive，在这些主机上应进行 Metastore 复制。所有主机都可以作为列表指定在\
  \ `/etc/hive/conf.server/hive-site.xml` 配置文件中的 `hive.metastore.uris` 属性中。\n\n```\n\
  hive.metastore.uris\nthrift://hims1.domain.com,thrift://hims2.domain.com\n用于 Hive\
  \ Metastore 复制的 URI\n```\n\n默认情况下，Hive Metastore 客户端将列表中的第一个服务器视为运行 Metastore 服务的主机。如果主机不可用，客户端会随机选择一个服务器来运行\
  \ Metastore。请注意，Metastore 的关系数据库也应启用高可用性。可以采用类似的方法来设置 WebHcatServer 和 HiveServer2\
  \ 的高可用性。\n\n在需要主机身份验证的安全集群中，可以通过将所有运行 Metastore 服务的节点上的 `hive.cluster.delegation.token.store.class`\
  \ 配置为 `org.apache.hadoop.hive.thrift.DBTokenStore` 来启用 Hive Token 存储。此设置可以通过 Ambari（如果已配置）或\
  \ `hive-site.xml` 进行。\n\n### HiveServer2 与 Zookeeper 集成\n\n在与 Zookeeper 集成后，HiveServer2\
  \ 实例可以实现高可用性。多个 HiveServer2 实例向 Zookeeper 注册。Zookeeper 会应客户端请求返回一个随机选择的实例。这不仅保证了高可用性，还能确保适当的负载均衡。\n\
  \n通过 Zookeeper 处理的 Hive 查询遵循以下步骤：\n\n1. Hive 客户端发出一个 Hive 查询。\n2. Hive 客户端连接到 Zookeeper\
  \ 以获取 HiveServer2 详细信息。\n\n   ```\n   jdbc:hive2://;serviceDiscoveryMode=zooKeeper;zooKeeperNamespace=\n\
  \   ```\n\n3. Zookeeper 在随机选择后返回 HiveServer2 的主机和端口。\n4. 客户端连接到该主机和端口。\n5. 常规查询处理步骤。\n\
  \n\n\n## 为 Kerberos 配置高可用性\n\n所使用的密钥分发中心 (KDC) 可以设置为主从模式，以满足 Kerberos 的高可用性 (HA)\
  \ 要求。请按照以下步骤设置 Kerberos 密钥分发中心 (KDC) 的高可用性。\n\n1.  选择一个从节点作为从 KDC，并安装 `krb5-server`、`krb5-libs`、`krb5-workstation`\n\
  \n```\nsudo yum install -y krb5-server\nsudo yum install -y krb5-libs\nsudo yum\
  \ install -y krb5-workstation\n```\n\n2.  在主 KDC 上备份 `krb5.conf`，并在从 KDC 节点上创建其副本\n\
  3.  在从 KDC 节点上备份 `kdc.conf`\n4.  如下所示，在主和从 KDC 节点上编辑 `kdc.conf`\n\n```\nsudo vi\
  \ /var/kerberos/krb5kdc/kdc.conf\n[kdcdefaults]\nkdc_ports = 88\nkdc_tcp_ports =\
  \ 88\n[realms]\nDLSEC-SAMPLE.DOMAIN.COM = {\n#master_key_type = aes256-cts\nacl_file\
  \ = /var/kerberos/krb5kdc/kadm5.acl\ndict_file = /usr/share/dict/words\nadmin_keytab\
  \ = /var/kerberos/krb5kdc/kadm5.keytab\nsupported_enctypes = aes256-cts:normal aes128-cts:normal\
  \ des3-hmac-sha1:normal arcfour-hmac:normal des-hmac-sha1:normal des-cbc-md5:normal\
  \ des-cbc-crc:normal\n}\nsudo chmod 655 /var/kerberos/krb5kdc/kdc.conf\n```\n\n\
  5.  在主和从 KDC 节点上更新 `kadm5.acl`\n\n```\nvi /var/kerberos/krb5kdc/kadm5.acl\n*/admin@DLSEC-SAMPLE.DOMAIN.COM\
  \ *\nsudo cp /var/kerberos/krb5kdc/kadm5.acl /tmp/\nsudo chmod 777 /tmp/kadm5.acl\n\
  scp /tmp/kadm5.acl hdp@10.256.39.70:/tmp\nscp /tmp/kadm5.acl hdp@10.256.13.2:/tmp\n\
  sudo cp /tmp/kadm5.acl /var/kerberos/krb5kdc/kadm5.acl\nsudo chmod 655 /var/kerberos/krb5kdc/kadm5.acl\n\
  ```\n\n6.  在 Kerberos 主节点和从节点上更新文件 `/var/kerberos/krb5kdc/kpropd.acl`\n\n```\nsudo\
  \ vi /var/kerberos/krb5kdc/kpropd.acl\nhost/ip-10-256-38-70.ec2.internal@DLSEC-SAMPLE.DOMAIN.COM\n\
  host/ip-10-256-13-2.ec2.internal@DLSEC-SAMPLE.DOMAIN.COM\nsudo chmod 655 /var/kerberos/krb5kdc/kpropd.acl\n\
  ```\n\n7.  在 Kerberos 上安装 `xinetd`，并在主和从 KDC 节点上初始化 Kerberos 内部数据库\n\n```\nsudo\
  \ yum install -y xinetd\nsudo kdb5_util create –s\nKDC Database MAster Key: xxxxxx\n\
  ```\n\n8.  创建一个管理员主体来管理 Kerberos 领域\n\n```\nsudo kadmin.local -q \"addprinc kdcadmin/admin\"\
  \nPrincipal password: xxxxxxx\n```\n\n9.  在主 KDC 上为从 KDC 创建主机密钥表\n\n```\nkadmin.local\n\
  addprinc -randkey host/ip-10-256-38-70.ec2.internal\naddprinc -randkey host/ip-10-256-13-2.ec2.internal\n\
  ```\n\n10. 提取从 KDC 的主机密钥并更新主机密钥表文件 `/etc/krb5.keytab.slave`。复制到从 KDC。\n\n```\n-------在主\
  \ KDC 上--------\nktadd –k /etc/krb5.keytab host/ip-10-256-38-70.ec2.internal\nktadd\
  \ –k /etc/krb5.keytab host/ip-10-256-13-2.ec2.internal\nsudo chmod 644 /etc/krb5.keytab\n\
  -------在从 KDC 上--------\nscp /etc/krb5.keytab hdp@10.256.13.2:/tmp\nsudo cp /tmp/krb5.keytab\
  \ /etc/krb5.keytab\nsudo chmod 644 /etc/krb5.keytab\n```\n\n11. 在两个 KDC 主机上更新 `/etc/services`\n\
  \n```\nsudo vi /etc/services\nkrb_prop 754/tcp # Kerberos slave propagation\n```\n\
  \n12. 在两个 KDC 节点的 `/etc/xinetd.d/krb5_prop` 中配置 `kpropd`\n\n```\nsudo vi /etc/xinetd.d/krb5_prop\n\
  service krb_prop\n{\ndisable = no\nsocket_type = stream\nprotocol = tcp\nuser =\
  \ root\nwait = no\nserver = /usr/sbin/kpropd\nport = 754\n}\n```\n\n13. 在主 KDC 上启动\
  \ KDC 和 kadmin 进程\n\n```\nsudo systemctl enable krb5kdc\nsudo systemctl start krb5kdc\n\
  sudo systemctl status krb5kdc\nsudo systemctl enable kadmin\nsudo systemctl start\
  \ kadmin\nsudo systemctl status kadmin\n```\n\n14. 在两个 KDC 主机上将 `xinetd` 运行为持久化服务\n\
  \n```\nsudo systemctl enable xinetd.service\nsudo systemctl start xinetd.service\n\
  sudo systemctl status xinetd.service\n```\n\n15. 将 KDC 数据库复制到从 KDC 节点并启动从 KDC\n\n\
  ```\nsudo kdb5_util dump /var/kerberos/krb5kdc/slave_datatrans\nsudo kprop -f /var/kerberos/krb5kdc/slave_datatrans\
  \ ip-10-256-13-2.ec2.internal\nsudo systemctl enable krb5kdc\nsudo systemctl start\
  \ krb5kdc\nsudo systemctl status krb5kdc\n```\n\n16. 设置一个 cron 任务，将更新从主 KDC 节点传播到从\
  \ KDC\n\n## NameNode 高可用性\n\n在 Hadoop 1 之前，Hadoop 集群是通过单个 NameNode 进行控制的。如果 NameNode\
  \ 因机器故障、进程损坏甚至计划内维护而不可用，整个集群将遭受停机。使用 Hadoop 2，NameNode 可以复制到一个热备用的 NameNode。备用 NameNode\
  \ 保持被动状态，直到主动 NameNode 宕机。在发生故障时，该架构支持手动和自动故障转移至备用 NameNode。\n\n### 架构\n\n在 Hadoop\
  \ 集群中，主动和备用 NameNode 位于两个不同的物理主机上；其中一个主动地服务数据块请求，而另一个则处于备用模式。备用 NameNode 始终保持与主动\
  \ NameNode 状态的同步。这种同步是如何发生的呢？让我们来看看。\n\n主动 NameNode 将所有对其命名空间所做的系统更改（文件创建/更新/删除）记录在\
  \ `editLogs` 中。编辑日志包含自上次清理到 `fsimage` 之后的增量系统更改。这些编辑内容被同步写入到一个单独的节点集群，称为日志节点。日志节点是用于存储编辑内容的分布式节点集。编辑内容会在日志节点集群中进行复制。备用节点扫描来自日志节点上任何编辑副本的新更改，并将其应用到其命名空间。这实现了主动和备用命名空间之间的同步。在一个集群中，至少三个轻量级节点可以被指定为日志节点。\n\
  \n除了命名空间之外，高可用性架构的另一个关键方面是数据节点上的数据块坐标。数据节点是为主动和备用节点配置的。数据节点向两个节点都发送心跳，并同时向两者发送块信息。这使得备用节点能够感知数据，并有助于其在快速故障转移期间承担主角色。图\
  \ 7-2 所示的架构图供参考。\n\n![A454145_1_En_7_Fig2_HTML.jpg](img/A454145_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n\nNameNode 高可用性架构\n\n请记住，NameNode 的主动-主动配置是不可能的，因为这可能导致脑裂情况。日志节点一次只允许一个写入进程。如果\
  \ NameNode 和日志不同步，可能会对数据精度和可用性造成巨大风险。\n\n以下是 `hdfs-site.xml`中用于 NameNode 高可用性的示例配置。\n\
  \n```\n---------新命名服务的逻辑名称---------\n\ndfs.nameservices\ndl_clustr\n\n---------在每个命名服务中配置\
  \ NameNode 标识符列表---------\n\ndfs.ha.namenodes.dl_clustr\nnn_active,nn_stby\n\n---------每个\
  \ NameNode 的 RPC 地址---------\n\ndfs.namenode.rpc-address.dl_clustr.nn_active\ndlmc1.machine.com:8020\n\
  \ndfs.namenode.rpc-address.dl_clustr.nn_stby\ndlmc2.machine.com:8020\n\n---------每个\
  \ NameNode 的 HTTP 地址---------\n\ndfs.namenode.http-address.dl_clustr.nn_active\n\
  dlmc1.machine.com:50070\n\ndfs.namenode.http-address.dl_clustr.nn_stby\ndlmc2.machine.com:50070\n\
  \n---------编辑内容将被写入和由 NameNode 读取的 JN URI-----\n\ndfs.namenode.shared.edits.dir\n\
  qjournal://jnode1.machine.com:8485;jnode2.machine.com:8485;\njnode3.machine.com:8485/dl_clustr\n\
  \n---------编辑内容可以持久化的 JN 本地目录---------\n\ndfs.journalnode.edits.dir\n/dfs/journal/localdata\n\
  \n---------用于 ping 主动 NameNode 的 Java 类---------\n\ndfs.client.failover.proxy.provider.dl_clustr\n\
  org.apache.Hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider\n\n---------使用\
  \ shell 方法的 HA 隔离配置---------\n\ndfs.ha.fencing.methods\nshell(/path/to/my/script.sh\
  \ arg1 arg2 ...)\n```\n\n\n\n#### 设计考量\n\n以下是规划 Hadoop NameNode 高可用性时至关重要的因素。\n\n\
  1.  通常，建议维护奇数个 JournalNode 来抵御最大数量的故障。\n2.  目前，只能配置两个节点来实现高可用性。在配置的两个 NameNode 中，首先启动的那个被视为\
  \ Active 节点。\n3.  HA 配置指南\n   - 所有命名服务都应添加到 `dfs.nameservices` 中。此列表应包含用于 NameNode\
  \ 联合的所有命名服务。\n   - 对于 `dfs.ha.namenodes.[nameservice ID]` 中的每个命名服务，最多应添加两个与该命名服务关联的\
  \ NameNode。\n   - 在 `dfs.namenode.shared.edits.dir` 中添加一组 JournalNode，用于存储共享的编辑日志。\n\
  \   - 如果未使用自定义类来确定 Active NameNode，请将 `dfs.client.failover.proxy.provider.[nameservice\
  \ ID]` 设置为 `org.apache.Hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider`。\n\
  \   - Quorum Journal Manager 可防止多个 NameNode 同时向 JournalNode 写入编辑日志。\n4.  Fencing（隔离）Active\
  \ NameNode 通过限制两个 NameNode 同时向 JournalNode 写入编辑日志来防止脑裂情况。即使在使用 Quorum Journal Manager\
  \ (QJM) 时，对 NameNode 进行 Fencing 也是一个良好的实践。在故障切换期间，Fencing 可确保正在关闭的 NameNode 在完全关闭前不会处理任何读取请求。Hadoop\
  \ 提供了两种可配置的 Fencing 方法：shell 和 sshfence。\n   - 可以在 `org.apache.Hadoop.ha.NodeFencer`\
  \ 中指定自定义的 Fencing 逻辑。\n   - shell 允许用户运行一个 shell 命令来代替常规的 NameNode 操作。该 shell 命令可能不涉及业务逻辑，但会代理\
  \ NameNode 的数据节点请求。\n     - 可以使用 `ssh.connect-timeout` 配置连接超时。连接超时表示 Fencing 失败。\n\
  \   - sshfence 允许通过 SSH 连接到目标节点，并使用 fuser 命令终止 NameNode 进程。目标节点的密码密钥必须由 hdfs 用户拥有，并且应位于\
  \ `dfs.ha.fencing.ssh.private-key-files` 中。\n   - Fencing 操作的结果必须是成功；否则，可能无法切换到\
  \ Standby 节点。\n5. 手动故障切换 – 在候选（目标）NameNode 上执行\n   ```\n   hdfs haadmin /\n   -failover\
  \ /\n   --forcefence /\n   --forceactive\n   ```\n6. 自动故障切换配置 – 通过 Zookeeper 集群和\
  \ ZKFailoverController (ZKFC) 进程完成。\n   - Apache Zookeeper 是 Hadoop 集群中的一项高可用性服务，用于监控集群组件是否发生故障。自动故障切换机制需要检测\
  \ Active NameNode 故障事件并选举下一个 Active 节点。Zookeeper 服务与所有 NameNode 保持实时会话。当 Active\
  \ NameNode 发生故障导致会话过期时，Zookeeper 会触发故障切换通知。同时，后续的目标节点会在 Zookeeper 上获取一个独占锁，以表明其将成为下一个主\
  \ NameNode。\n   - ZKFC 是一个 Zookeeper 客户端，负责通过 Ping 和管理与 Active NameNode 的会话来监控 NameNode\
  \ 的健康状况。在 Active NameNode 选举期间，ZKFC 帮助健康的 NameNode 获取锁。\n   ```\n   ---------命名服务的自动故障切换配置-------\n\
  \n   dfs.ha.automatic-failover.enabled.[NameService_ID]\n           true\n\n   ---------运行\
  \ Zookeeper 服务的主机列表---------\n\n   ha.zookeeper.quorum\n           zookee1.machine.com:2181,zookee2.machine.com:2181\n\
  \   ```\n   - Zookeeper 安全 – 在 `core-site.xml` 中设置 Zookeeper 身份验证和 ACL 以控制 Zookeeper\
  \ 访问。\n   - 也可以使用以下命令查询 NameNode 的 HA 状态\n   ```\n   hdfs haadmin -getServiceState\n\
  \   ```\n\n![A454145_1_En_7_Fig3_HTML.jpg](img/A454145_1_En_7_Fig3_HTML.jpg)\n\n\
  图 7-3\n\n将 NameNode HA 服务与 Zookeeper 集成，以实现持续监控和主动告警。\n\n### 数据中心灾难恢复策略\n\n到目前为止，我们关注的是\
  \ Hadoop 组件的高可用性。实际上，在企业级大数据湖中，我们需要防止丢失的是数据和分析模型。数据湖可能会在逻辑错误或硬件故障事件中丢失数据。逻辑错误属于开发人员和分析师的职责范围，而硬件故障可以进一步按风险和成本进行分类。由于成本起着决定作用，由系统崩溃、介质故障或节点故障等引起的事件虽然风险高，但成本影响低。因此，可以通过在平台层面处理故障情况来预防。然而，在某些情况下，整个数据湖可能由于硬件故障、大规模断电、网络故障或站点因民用环境关闭而变得无法访问。灾难恢复的目标正是这些情况，即一个数据中心能够在允许的服务中断阈值内接管主数据中心。\n\
  \n对于数据管理专业人员来说，灾难预防和恢复并不是一个新术语。虽然目标保持不变，但灾难预防策略确实会根据服务水平协议和平台架构而变化。在本节中，我们将讨论与 Hadoop\
  \ 数据湖相关的灾难预防和恢复策略。\n\n为什么要复制数据湖？建立数据湖需要在成本、规划、定义技术设计和架构以及简化日常运营方面付出巨大努力。搭建另一个基础设施将大幅增加资本投资和运营开销。因此，在进入规划阶段之前，必须有一个强有力的用例和清晰的目标来支持建立副本。有两个参数可以证明复制工作的合理性：可用性和可恢复性。通过拥有冗余或额外的资源来容忍故障或中断，而不会（或可接受地）对业务造成任何损失，可以实现可用性。可恢复性可以通过一个备用的备用站点来实现，该站点保持故障时的数据状态，并且可以快速恢复。高可用性可以通过规划站点各组件的高可用性来实现。当整个站点需要故障转移到其备用站点时，可恢复性解决了更重大的问题。因此，可用性是可恢复性的一个子集。主备站点可能是实现可恢复性和可用性的最佳方法。双活设置通过向业务用户提供活动副本来达到理想状态，同时两者互为备用。\n\
  \n随着云服务模式如今在 IT 领域相当普遍，大多数云供应商都承诺云托管应用程序具有高可用性（高达约 99.999%）。可恢复性可能因应用程序的性质和服务水平协议而异。例如，“客户反馈”应用程序可以容忍几个小时的停机，但“销售”应用程序则不能。关键业务应用程序需要立即恢复到其备用站点，以防止业务中断。\n\
  \n尽管投资成本成为主要考虑因素，但在论证备用站点提案的合理性时，组织必须对这两个因素进行量化评估。拥有全球业务和地区治理法律的公司，被迫拥有活动副本来实现不间断的分析。在类似情况下，位于自然灾害频发地区的数据中心，可能正在寻找用于恢复目的的冷备站点。\n\
  \n\n\n### 灾难恢复要素\n\n从宏观层面看，灾难恢复策略涉及备用站点和切换策略。灾难恢复的备份性质略有不同，因其目标是从严重事件中恢复。接下来，我们列出制定高效灾难恢复策略时需要考虑的因素。\n\
  \n1. **了解数据源与数据意识** – 在建立灾难恢复站点时，始终建议先了解数据湖的构成要素。记录系统的关键性如何？源系统位于何处？如果数据镜像层丢失会有什么影响？\n\
  2. **复制与镜像** – 备份模式是从灾难恢复站点进行恢复操作的关键参数。镜像恢复速度比备份副本更快。\n3. **备份频率** – 数据变更频率和服务等级协议决定了数据流入灾难恢复站点的频率。\n\
  \n### 灾难恢复方法\n\n接下来，我们开始探讨灾难恢复策略的构建模块。结合上述考量，可以初步考虑两种可行方法。\n\n1. **双路注入或 T 形复制**\
  \ – 在此方法下，所有不同的源系统遵循类似 T 形的双向注入管道，将数据同时推入生产数据湖和备用（或副本）数据湖。注入管道在数据源与主数据湖之间可能相同，也可能不同。虽然它可以复用于向备用站点发送数据，但在将其用于备用目的之前，需要考量可扩展性、成本和性能等参数。不过，现代商业工具提供了灵活性，能以不同频率实现双向复制。图\
  \ 7-4 所示的模型在架构师社区中引发的争议多于其带来的好处。然而，在典型的“数据即资产”世界中，仅注入镜像层是合理的。消费层可以并行构建，也可以在需要时通过运行业务模型来消费镜像层数据并产生分析洞察。\n\
  \n   ![A454145_1_En_7_Fig4_HTML.jpg](img/A454145_1_En_7_Fig4_HTML.jpg)\n\n   **图\
  \ 7-4** 用于将数据注入生产集群和副本集群的 T 形注入方法\n\n   并行数据注入方法存在不少挑战。\n   1. 并行数据注入管道会大幅增加资源消耗。注入框架的配置（如带宽、网络资源）需要重新评估，并且很可能需要扩展。在实现模型中，负载均衡器将是理想的选择。\n\
  \   2. 在主备模式中，主站点被认为是关键的。如果并行写入以异步模式运行，保持备用站点与主站点同步将增加运维开销。备用站点与主站点发生偏离的可能性很高。\n\
  \   3. 只有源数据可以并行注入两个站点，处理后的数据（中间层或消费层）则无法做到。数据处理模型可以在备用站点上运行，但数据一致性无法保证。如果业务用户同意将只读备用站点用于临时性工作，数据运维团队必须实施定期的检查与平衡机制，以确保数据状态的合理性。\n\
  \n2. **数据中心复制或拷贝** – 这是在企业数据湖的灾难预防措施规划中，最常用且实践最广泛的方法。使用此技术，源系统的数据仅注入主数据湖。然后，数据从主数据湖复制到其灾难恢复站点，如图\
  \ 7-5 所示。\n\n   ![A454145_1_En_7_Fig5_HTML.png](img/A454145_1_En_7_Fig5_HTML.png)\n\
  \n   **图 7-5** 用于将数据从生产环境复制到副本的拷贝方法\n\n   这种方法提供了将镜像层以及消费层复制到备用站点的灵活性。发生灾难时，备用站点可以快速承担主数据湖的角色，而不会造成长时间的停机中断。此外，由于无需在副本集群上运行处理任务，它可以用于临时性分析和可视化。与前一种方法相比，它所需资源更少，因此源到镜像的注入框架保持不变。但同时，这也增加了主数据湖向备用站点复制数据的压力。\n\
  \n在规划将大量数据从生产数据湖复制到其副本站点时，请考虑以下几点。\n\n![A454145_1_En_7_Fig6_HTML.png](img/A454145_1_En_7_Fig6_HTML.png)\n\
  \n**图 7-6** 将大量数据从生产集群复制到副本集群时的关键考量\n\n\n\n## 数据复制策略\n\n实现高可用性的双路径方法是一种直截了当的方式。我们将重点关注第二种方法，该方法需要在活动数据湖及其备用站点之间开发新的数据摄取框架。影响摄取管道的因素几乎相同——数据量、频率、对数据湖的影响、资源管理，以及批量摄取与变更数据捕获。在本节中，我们将详细介绍可在生产数据湖站点上实践的数据复制策略。这些技术也是许多商业和开源复制工具的基础。\n\
  \n1.  `DistCp` – `DistCp`（分布式复制）是在同一数据中心或远程数据中心内，针对 Hadoop 文件系统最常用的复制解决方案之一。底层而言，它利用\
  \ MapReduce 进行数据分发和恢复。它将在命名空间下的目录和文件列表转换为 Map 任务，然后由 `taskTrackers`（任务跟踪器）将这些任务复制到目标命名空间。尽管此工具的使用非常简单，但这种方法存在一些明显的局限性。作为\
  \ MapReduce 操作，该工具可能会消耗一些 Map 槽位，从而影响数据湖中的业务操作。此外，由于源站点上的每个数据节点都必须具有目标站点的写入权限，因此两个集群之间的通信模式是\
  \ `SN*TN` [`SN` 是源数据节点数量，`TN` 是目标数据节点数量]。如果数据节点之间没有建立一对一的通信通道，从源到目标的数据复制可能会受到影响。使用\
  \ `distcp` 的另一个关键考虑因素是源和目标集群的 Hadoop 版本。对于 `hdfs://` 连接协议，源和目标版本必须相同。要启用源和目标站点之间不受版本限制的传输，可通过使用\
  \ `wedhdfs://` 协议并启用基于 HTTP 的数据传输。另一种启用基于 HTTP 传输的方法是使用 `httpfs://` 协议，该协议使用 `HTTPfs`\
  \ 代理守护进程进行集群通信。但请记住，`webhdfs://` 和 `httpfs://` 都需要手动配置，并且比原生 `hdfs://` 连接相对慢一些。\n\
  \n2.  `HDFS Snapshots` – 快照代表了数据湖在某个时间点的状态。HDFS 快照可以构建数据湖的原始镜像。此外，它们还可以用于在意外数据丢失时拼接数据。\n\
  \n3.  `Hive Metastore Replication` – 通过在 `hdfs-site.xml` 文件中进行简单配置，Hive 支持将 Metastore\
  \ 复制到其他集群。虽然可以实现自定义的复制框架，但默认情况下，系统使用 `org.apache.hive.hcatalog.api.repl.exim.EximReplicationTaskFactory`\
  \ 实现来执行数据捕获、移动和摄取命令。\n\n4.  `Kafka Mirror Maker` – 这是一个 Apache Kafka 服务，它充当活动 Kafka\
  \ 集群中的消费者和备用 Kafka 集群中的生产者。\n\n随着全球业务足迹变得越来越普遍，企业需要为分布在全球的团队提供数据可用性。为此，他们需要一个强大的数据复制解决方案，该方案能够覆盖地理位置不同的站点，并具备近乎实时地处理海量数据集的能力（当然，实时处理将备受欢迎！）。\n\
  \n鉴于 Hive 在数据湖世界中扮演着数据仓库的角色，在两个区域数据湖之间建立变更集成非常合理。变更集成层完成两项任务。首先，它捕获变更并将其发送到备用站点。其次，它指示或模拟内置的写入器进程，以确保及时合并变更。借助稳定的集成层，我们可以启用双向复制并建立多站点数据湖。集成层的实现界定了数据湖的可用性与可恢复性参数。让我们深入了解建立高可用性站点的主动-被动和主动-主动模式的设计考量。\n\
  \n### 主动-被动数据中心复制\n\n在主动-被动设置中，备用数据湖站点保持被动状态，直到主站点发生灾难。在灾难期间，主站点发生故障，备用站点承担起活动站点的角色。一旦原先的活动站点恢复运行，它便以备用模式运行。\n\
  \n由于变更必须单向流动，因此可以通过 `DISTCP` 进行定期同步来实现复制。自定义集成层也有助于将变更分批处理并推送到辅助站点。\n\n主动-被动方法看起来更像是为了将来的可恢复性而备份站点，而非为了可用性。它是主站点的只读副本，由于定期同步，可能会变得不一致。因此，追赶数据延迟并跟上主站点的步伐会变成一种运维负担。\n\
  \n### 主动-主动数据中心复制\n\n不久之前，多站点实时数据湖还是一个未经探索的概念，但过去几年间，用户期望、受众规模和服务协议的急剧增长推动了事情的发展。随着数据民主化成为一种趋势，以及“公民”数据科学家从博客和书籍中涌现出来，多站点“实时”数据湖开始进入实践阶段。\n\
  \n主动-主动复制允许您从任何一个区域站点摄取数据。新数据将被复制到网络中的所有其他站点。尽管这对数据治理提出了极大的挑战，但您可以随时随地摄取和分析数据。它实现了站点内资源的最大化利用，带来了数据一致性，提供了灾难覆盖，分担了工作负载，并在一个民主化平台上为区域性用户划定了界限。\n\
  \n区域性站点间主动-主动复制的高级架构图如图 7-7 所示。请注意“变更协调引擎”组件。它是一个分布式协调引擎，负责向所有数据湖站点发出变更。变更本质上就是来自客户端的任何写入请求。变更协调引擎有两个作用：\n\
  \n1.  在数据中心之间同步复制元数据\n2.  维护事务顺序并异步复制数据\n\n![A454145_1_En_7_Fig7_HTML.jpg](img/A454145_1_En_7_Fig7_HTML.jpg)\n\
  \n图 7-7 使用分布式协调引擎在数据湖站点之间进行主动-主动复制\n\n图 7-7 中描绘的理想化架构由 WANDisco Fusion 实现。在接下来的几节中，我们将重点介绍该产品的主动-主动复制能力。\n\
  \n#### WANDisco Fusion\n\nWANDisco Fusion 提供了跨数据中心的主动-主动复制技术。它维护了一个虚拟的服务器系统，横跨多个数据湖站点，并且能够在广泛分布的环境中达到局域网（LAN）级别的性能。其代理服务器架构会复制选定\
  \ HDFS 文件夹的每一个变更。\n\nWANDisco 以块和子块为增量复制数据，无需等待文件完全写入并关闭后才开始复制。在底层，它使用了一个高度高效且容错的协调引擎，在分布式环境中实现有序的事务管理。它采用一种基于仲裁的可配置方法来冻结事务的顺序。仲裁是协调集群中参与节点的一个子集。\n\
  \n分布式协调是一种去中心化的引擎，用于管理所有站点的事务处理。专用的中央协调器也可以满足需求，但存在单点故障的风险，并且有时会成为可扩展性的瓶颈。让我们简要了解一下分布式协调算法。\n\
  \n\n\n#### 分布式协调\n\n分布式协调引擎是 Paxos 共识算法的一种实现。¹ 在 Paxos 算法下，²\n\n> 分布式系统中的每个节点都安装了一个复制状态机。这些复制状态机作为对等节点，提供一种协作式的事务管理方法，确保在每个节点上事务顺序一致。\n\
  \n分布式协调引擎在分布式集群的节点上安装了一个代理，这些代理构成了一个虚拟命名空间。虽然融合节点的虚拟空间在事件层面上是一致的，但代理或节点可以扮演提议者、学习者或接受者的角色。你可以将这些角色理解为对活动事务达成共识过程中的不同阶段。提议者阶段标志着从虚拟命名空间中选举出一个节点。广播阶段则向集群中的其他融合节点提交“事务”提案以寻求共识。在接受阶段，法定数量的节点接受由提议者发出的提案；从而达成共识并确立全局事件的顺序。一旦达成共识，提议者便向所有融合节点广播提交消息，以指示“继续执行”该事务。请记住，只有集群写入操作由该引擎协调，而读取操作则不是。融合节点角色的流程和功能如图\
  \ 7-8 所示。\n\n![A454145_1_En_7_Fig8_HTML.jpg](img/A454145_1_En_7_Fig8_HTML.jpg)\n\
  \n图 7-8\n分布式协调引擎的角色和阶段\n\n#### 设计考量\n\n以下是有助于更好理解复制机制的关键特征和因素。\n\n1.  现有 Hadoop\
  \ 组件的工作模式无需更改。`NameNode`、`DataNode` 和 `MapReduce` 继续照常运行。\n2.  Fusion 使用 Hadoop\
  \ 间通信服务与 Isilon、Hadoop、MapR 和 Amazon S3 等存储系统交互。它还支持异构存储区域，这些区域可能执行用于数据生命周期管理的存储分层策略。\n\
  3.  性能和容错能力通过基于法定人数的协议这一概念来实现。\n4.  一致性模型\n    1.  Fusion 节点协调以保持确定性更新的顺序。\n   \
  \ 2.  提案生命周期在全局协议序列上执行。由于协议消耗速率的不同，设置为复制的文件夹状态可能会有所不同。然而，在特定的全局序列号下，所有被 Fusion 复制的文件夹都拥有相同的状态。\n\
  \    3.  提议者的选举——一个节点以其已知的最后一个序列号更高的序列号发出一个新提案。在提案广播后，如果法定人数的节点回复确认该提案序列号的值较高，那么该发出节点就被选举为领导者。一旦一个提案的领导者被选出，那些争相或假装成为协调者的节点必须等待其共识解决后才能继续。\n\
  \    4.  如果有多个节点假装是同一提案的协调者，该算法会通过排序来限制它们对值的选择。\n5.  WANDisco Fusion 支持跨数据湖站点选择性地复制数据——可以配置复杂的复制用例，例如区域数据治理法规、数据限制等。\n\
  \n图 7-9 概述了从分布式协调引擎本地实例到共识状态的事务提案流程。\n\n![A454145_1_En_7_Fig9_HTML.jpg](img/A454145_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9\n通过协调引擎基于法定人数的方法达成共识\n\n## 结论\n\n企业数据湖不亚于一片信息之海。拥有资产的同时也带来了责任和挑战。可用性和可扩展性是数据湖策略中两个最重要的任务级考虑因素。在本章中，我们讨论了\
  \ Hadoop 如何通过 `NameNode` 联邦原生地处理可扩展性，并与其他节点分担负载。从高可用性的角度来看，Hadoop 没有明确定义的策略，但作为用户，可以为业务连续性和灾难预防制定指导方针。\n\
  \n下一章将讨论如何在数据湖中取得运营成功。一个成熟的数据湖需要一个主体，它不仅要监控数据湖的健康状况并发送通知，还要充当平台升级、数据湖可扩展性、文档及部署的守护者。\n\
  \n脚注 1\n\nPaxos 算法由 Leslie Lamport 设计，旨在提供一个容错且去中心化的框架，以实现主动-主动复制。\n\n 2\n\n参考 -\
  \ [`https://www.wandisco.com/assets/blt1d792cb4d9252692/WANdisco_DConE_White_Paper.pdf`](https://www.wandisco.com/assets/blt1d792cb4d9252692/WANdisco_DConE_White_Paper.pdf)\n\
  \n\n\n"
- "# 8. 管理数据湖运维\n\n> “没有大数据分析，企业就如同又聋又瞎，在网络上漫无目的地游荡，好比鹿群上了高速公路。” —— 杰弗里·摩尔，《跨越鸿沟》作者\n\
  \n至此，读者应该对现实世界中的数据分析以及数据湖如何满足数据分析的需求有了相当的理解。所有组织的数据资产汇聚于一体，将复杂的数据集概念化，形成一个功能完备的数据湖。理解如何致力于构建一个健康、稳定且安全的数据湖至关重要。组织应如何应对安全、稳定性和可用性方面的挑战，以确保数据湖保持在线并遵守合规指南？\n\
  \n正如人们所说，创建容易，维护难。管理一个生产集群可能会变得极其复杂。对平台缺乏理解、不了解应用程序服务等级协议（SLA）以及缺乏有效的监控框架，都会导致数据湖运维变得不透明。一旦数据湖生态系统稳定并投入运营，满足其下所列的迫切需求就变得至关重要。请记住，这些需求最终会形成运维台的关键流程。该清单汇总了标准的运维检查项，同时，数据管理与运维部门之间的常规工作交接中，也可能约定更细致、更精确的任务。\n\
  \n1. 数据湖平台的守门人 – 运维团队始终是生产环境的所有者。与内部 IT 团队、数据治理委员会和数据湖开发团队保持联络，以了解数据湖的目标及其主要利益相关者。\n\
  2. 支持数据湖的可用性，符合下游消费者定义的 SLA – 引入主动监控和告警层，持续检查平台可用性。\n3. 提供运维情报并发布指标，以突出风险领域 – 建立定期机制，对平台和业务应用进行事件分析和健康检查。发布关键指标，突出显示可用性数据、问题趋势和应用就绪度评分卡。\n\
  4. 通过定期沟通实现集成支持 – 沟通是快速解决问题、实现快速响应的关键。随着时间的推移，它能磨练出迅速感知风险并在补救行动中展现敏捷应对的能力。连接开发团队和利益相关者，以获取他们的反馈和任何问题。\n\
  5. 保持敏捷，培养“持续集成”文化，并简化部署流程 – 鼓励持续集成、持续交付和持续部署原则，以简化交付管道。\n\n本章将重点关注监控架构的原则，这些原则将使管理员能够在数据湖生态系统中孕育卓越运维。它将让他们深入了解如何优化数据湖的强大功能，使其更加健壮，以增强透明度和问责制。在本章的范围内，不会深入探讨\
  \ Hadoop 的运维结构。\n\n## 监控架构\n\n数据湖运维团队经常面临应用用户提出的问题，如图 8-1 所示。\n\n![A454145_1_En_8_Fig1_HTML.jpg](img/A454145_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n数据湖运维中常遇到的问题\n\n一个好的监控架构不仅赋予管理员集群监控能力，还能对应用程序进行性能度量。基本的集群监控只告诉你什么失败了，却不能回答为什么失败。\n\
  \n### Hadoop 指标架构\n\n对于任何系统，跟踪日志、审计日志或任何统计信息对于了解系统的健康状况和行为都至关重要。这种揭示系统状态的统计信息数据被称为指标。指标由运行在系统组件上的守护进程生成，可用于监控组件的健康状况、调优和故障排除。在\
  \ Hadoop 中，默认会生成大量指标。然而，对于额外的指标，可以在特定组件上安装独立的代理。\n\n在基于 Hadoop 的数据湖生态系统中，指标被分组到特定的上下文（contexts）下。指标是上下文中行级别的信息。一个上下文可以配置一个插件，该插件作用于\
  \ Hadoop 的某个特定组件，从而生成该上下文下分组的全部指标。每个指标都带有主机名标签，以便与其余指标区分。让我们看看 Hadoop 指标架构中可用的关键上下文。¹\n\
  \n1. `jvm` – 它分组由 Java 进程发布的指标，揭示有关已使用和已提交的内存、线程详情以及进程跟踪日志的信息。\n2. `rpc` – `rpc`上下文下的指标在远程过程调用与主机握手期间生成。可能与身份验证、数据传输量、`RetryCache`和开放连接有关。另一个相关的上下文`rpcdetailed`会为`rpc`方法生成额外的指标。它不包含在`rpc`指标记录中。\n\
  3. `dfs` – 此上下文包含`NameNode`、`FSNamesystem`、`JournalNode`和`DataNode`的指标。这是收集 NameNode\
  \ 操作、容量、日志同步和数据节点操作指标的最重要上下文之一。\n4. `yarn` – `Yarn`上下文捕获`NodeManager`、集群和队列管理器的指标。\n\
  5. `mapred` – 此上下文通过 MapReduce 守护进程生成指标。它包含与作业跟踪器（jobtrackers）和任务跟踪器（tasktrackers）相关的指标。\n\
  \n除了上述上下文之外，还可能存在提供额外指标的上下文，例如`ugi`、`metricsystem`和默认上下文。`ugi`上下文分组与用户和组相关的指标，例如成功和失败的\
  \ Kerberos 登录以及组解析。`metricsystem`上下文则揭示关于指标源的指标。\n\n## 识别源组件\n\n这是开发良好监控框架的第一步。组织的数据湖可能使用任何技术栈（Hadoop、Cassandra\
  \ 等）构建，其中 Hadoop 最为著名。必须识别出在技术栈平台上运行的所有必要服务。例如，一些应被监控且需要收集其指标的 Hadoop 关键组件列举如下。\n\
  \n### YARN 指标\n\n活跃节点或丢失节点列表 - 此指标应给出无任何问题运行的节点数量。节点可能由于网络问题到硬件资源（CPU、内存等）不足等各种原因与资源管理器失去联系。\n\
  \n如果某个`NodeManager`（`NM`）在给定的超时阈值内无法联系上`ResourceManager`（`RM`），则该`NM`将被标记为丢失，其资源对集群不可用。一旦节点被标记为“丢失”，我们就应采取行动。\n\
  \n已分配内存总量 - 此指标提供了集群内存使用情况的高层次概览。如果我们频繁接近集群容量，那么就该调查哪些作业可能在消耗内存，并投入足够关注来调优这些作业。另一种选择是添加`NodeManager`和/或增加为`YARN`预留的内存量。\n\
  \n### MapReduce 指标\n\n为了优化其应用或发现瓶颈，开发人员应跟踪以下内容：\n\n1. 失败的映射（map）任务数\n2. 失败的归约（reduce）任务数\n\
  3. 数据本地化计数器 – Hadoop 还公开了一组指标，显示一个作业创建其映射任务与数据的接近程度。如果在数据本地不可用的节点上创建了大量映射任务，这很好地表明了性能下降。\n\
  \n\n\n### HDFS\n\n有多个参数可以很好地指示 HDFS 的健康状况，例如：\n\n1. 文件总数\n2. `underReplicatedBlocks`\n\
  3. `StaleDataNodes`\n4. `CapacityRemaining`\n5. `BlocksTotal`：系统中当前已分配的块数\n\n有关\
  \ HDFS 中每个服务（NameNode 和 DataNode）所暴露的指标的详尽列表，请参阅 Apache 文档：[`https://Hadoop.apache.org/docs/r2.6.0/Hadoop-project-dist/Hadoop-common/Metrics.html`](https://hadoop.apache.org/docs/r2.6.0/hadoop-project-dist/hadoop-common/Metrics.html)\n\
  \n你的组织中的数据湖最终可能包含多个生态系统组件，如 HBase、Hive、Spark 以及其他 SQL-on-Hadoop 技术，例如 Apache Drill、Presto\
  \ 等。对于每个此类组件，你都必须包含某些必要的指标，这些指标将有助于在下一阶段（我们很快就会看到）对其进行监控。\n\n这里需要注意的关键点是，几乎每个 Hadoop\
  \ 生态系统组件都通过 JMX 端口暴露其指标，我们可以连接该端口并跟踪这些指标，用于监控和性能测量。除了有助于我们监控和测量性能的指标之外，收集每个 Hadoop\
  \ 组件生成的日志也很重要。\n\n### 指标收集工具\n\n完成所有收集指标繁重工作的重要工具之一是 CollectD。一个守护进程会定期收集系统性能指标，并提供多种机制来存储这些值，或将其发送到下一阶段，在此阶段数据由其他工具聚合，最终可供可视化工具使用。它在集群中的每个节点上运行。\n\
  \n**注意** – 启用以下默认插件，它们有助于收集相关指标：\n\n```\n[root@vm75-132 ~]# cat /etc/collectd.conf\
  \ | grep '^Load'\nLoadPlugin syslog\nLoadPlugin cpu\nLoadPlugin df\nLoadPlugin disk\n\
  LoadPlugin interface\nLoadPlugin load\nLoadPlugin memory\nLoadPlugin network\nLoadPlugin\
  \ swap\n```\n\n如果你来自传统数据库背景，那么这些与代理进程非常相似，例如：Oracle 世界中的 Oracle 代理或运行在每个节点上并将指标发送到管理器进程的\
  \ Nagios 代理。事实上，它们被称为“收集代理”。\n\n另一个知名的企业级组件是 Ganglia。它已在一些最大的云基础设施中使用，并得到活跃社区的支持。\n\
  \n与指标收集代理类似，其他日志收集代理包括 FluentD 和 Logstash。\n\n`FluentD` 是一个守护进程，运行在每个节点上以收集和解析日志。这些日志随后可以被发送到像\
  \ OpenTSDB 这样的数据存储或像 ElasticSearch 这样的后端存储。`FluentD` 如今被广泛采用，因为它以其内置的可靠性和较低的内存使用而闻名。\n\
  \n`Logstash` 主要作为 ELK 栈（ElasticSearch-Logstash-Kibana）的一部分而闻名。用户应该对每个工具的工作方式进行很好的比较，并做出明智的决定，选择某个特定的工具而不是另一个。\n\
  \n### 指标和日志存储\n\nOpenTSDB 是一个运行在 HBase 之上的分布式时间序列数据库。它可以用来存储和聚合由类似 `Fluentd` 和 `collectd`\
  \ 的代理接收到的日志和指标。`openTSDB` 的模式针对时间序列数据的快速聚合进行了高度优化。除了本质上具有分布式特性之外，它还可以以细粒度的方式存储大量数据。\n\
  \n但是，`openTSDB` 的实现比安装和配置 Graphite 等系统要复杂一些。尽管如此，如果你计划将 HBase 作为数据湖中的生态系统组件之一进行部署，你应该认真考虑将其用作日志和指标的数据存储。\n\
  \nElasticSearch (ES) 是一个开源的分布式全文搜索和分析引擎，它可以成为数据湖中你的 Hadoop 组件之一。复杂的搜索功能和日志分析是 ElasticSearch\
  \ 的最佳用例之一。如果你想分析和挖掘数据以寻找趋势、统计数据、汇总信息或异常情况，它会非常有用。你还可以使用 ELK 栈中的 `Logstash` 来收集、聚合和解析数据，然后让\
  \ `Logstash` 将这些数据馈送到 Elasticsearch。\n\n它会索引通过收集代理接收到的日志，以便这些日志易于访问和搜索。例如，`FluentD`\
  \ 在向 ES 写入日志时使用轮询方法。如果由于某种原因，某个节点不可用，`fluentd` 可以故障转移到其余幸存的 ES 节点之一。你不需要为 `fluentd`\
  \ 与 ES 配合使用而额外配置故障转移。但建议至少运行 3 个节点来运行 ElasticSearch。你必须根据需求调整集群规模，使其包含一个或多个节点。\n\
  \n默认情况下，它会对数据（接收到的日志和指标）索引 2 天。但可以轻松配置为更长的保留期。ES 也以其高内存消耗而闻名，并且至少使用 2Gb 的 RAM 堆大小。这同样可以根据你的需求进行配置。将所有聚合数据放入\
  \ Elasticsearch 后，你可以搜索任何你想要监控的节点、服务或消息严重性级别的组合，并在此基础上进一步开发告警和可视化分析功能。\n\nElasticSearch\
  \ 的仓库位置在 CentOS/RHEL 系统中默认可能不可用。因此，请将 ElasticSearch 的公共 GPG 密钥导入 rpm，然后按照以下步骤进行安装。\n\
  \n```\n//导入 GPG 密钥//\n[root@vm75-132 ~]# rpm --import http://packages.elastic.co/GPG-KEY-elasticsearch\n\
  [root@vm75-132 ~]#\n//添加仓库位置//\n[root@vm75-132 ~]# vi /etc/yum.repos.d/elasticsearch.repo\n\
  [root@vm75-132 ~]# cat /etc/yum.repos.d/elasticsearch.repo [elasticsearch-2.x]\n\
  name=Elasticsearch repository for 2.x packages\nbaseurl=http://packages.elastic.co/elasticsearch/2.x/centos\n\
  gpgcheck=1\ngpgkey=http://packages.elastic.co/GPG-KEY-elasticsearch\nenabled=1\n\
  //安装 ElasticSearch 并启动服务//\n[root@vm75-132 ~]# yum -y install elasticsearch\n[root@vm75-132\
  \ ~]# systemctl start elasticsearch\n```\n\n这里不需要为 ElasticSearch 进行显式配置。唯一需要编辑的项目是\
  \ NodeName 和集群名称。根据你的集群/节点名称修改它们。\n\n## 日志和指标可视化\n\n这一层最近经历了一些快速的发展。有一些很棒的、功能丰富的前端工具和库，它们都得到了\
  \ OpenTSDB 和 Elasticsearch 的支持。\n\nGraphite 在这一类别中一度非常流行。但就像 Hadoop 的所有事物一样，还有其他工具，比如\
  \ Grafana 和 Kibana，它们如今非常活跃，拥有活跃的用户群。\n\n就本文而言，我们仅提供 Grafana 和 Kibana 功能的概述。`Grafana`\
  \ 使用 REST API 从 OpenTSDB 访问指标数据。使用单个 `Grafana` 实例，用户可以构建自定义仪表板或使用示例仪表板来可视化指标。它还支持许多不同的数据存储，如\
  \ Elasticsearch 和 Graphite。\n\n`Grafana` 能够组合来自多个数据源的数据，并将其显示在单个仪表板中。每个数据源都与仪表板中的一个窗格/框架紧密相关。由于后端种类繁多，要使用的查询语言也各不相同。\n\
  \n图 8-2 显示了一个 `Grafana` 控制台，其中展示了节点级别的 CPU、内存、网络和 Swap 使用情况，这些是系统负载的一些指标。\n\n![A454145_1_En_8_Fig2_HTML.jpg](img/A454145_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n显示关键系统指标的 Grafana 控制台\n\n你还可以调整控制台上下文以显示运行中的指标（图 8-3）。\n\n![A454145_1_En_8_Fig3_HTML.jpg](img/A454145_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n可以修改 Grafana 控制台上下文以显示当前指标\n\n\n\n### Kibana\n\n`Kibana` 是另一款运行于 `Elasticsearch`\
  \ 之上的可视化平台。它通过 `REST API` 访问和搜索 `Elasticsearch` 中的日志。用户借助单个 `Kibana` 实例，即可创建可视化图表和仪表盘来分析日志。\n\
  \n`Kibana` 连接单个 `Elasticsearch` 节点来读取日志。如果因 `Elasticsearch` 节点故障导致 `Kibana` 无法读取日志，则必须将\
  \ `Kibana` 配置为连接可用的 `Elasticsearch` 节点。若希望在配置的 `ES` 节点宕机时仍能运行 `Kibana`，可以在集群中运行\
  \ `Kibana` 的同一节点上部署一个仅协调 `ES` 节点。这些协调节点充当负载均衡器，将来自 `Kibana` 的传入连接请求分发至其他 `ES` 节点，收集结果并返回给\
  \ `Kibana` 进行可视化呈现。\n\n## Apache Ambari\n\n`Apache Ambari` 是一款用于管理和监控 `Hadoop` 集群的开源平台。其功能不仅限于运维操作，还能实现集群的预配置并控制安全框架。在架构上，它与其他现代管理应用并无不同。服务器与部署在其上的各组件代理协同工作，以指标和日志的形式接收组件的状态信息。\n\
  \n`Ambari` 为平台监控和运维管理提供以下功能：\n\n1. **Ambari 告警** – `Apache Ambari` 会触发预定义且集中管理的告警。可修改告警以控制阈值、接收者、频率和通知方式。告警可提供集群健康状况的完整视图。`Ambari`\
  \ 提供多种配置选项来定制告警机制。\n2. **Ambari 指标** – 包含指标收集器、指标监控器和 `grafana`。`Grafana` 包含多个用于可视化关键指标的预构建仪表盘。以下是指标从生成到可视化的流转过程。\n\
  \    1. 指标监控器将系统指标发布至收集器\n    2. Sink 将 `Hadoop` 指标推送至收集器\n    3. 指标收集器聚合指标\n  \
  \  4. 通过 `REST API` 在 `Ambari UI` 上展示指标\n    5. 从 `Ambari 2.2` 开始，`grafana` 作为指标的原生界面提供服务\n\
  \        1. 为 `HDFS` 首页、名称节点、数据节点、`YARN`、应用、作业历史等提供仪表盘\n3. **Kerberos** – `Ambari`\
  \ 支持通过界面进行向导驱动的 `Kerberos` 管理。用户可以创建 `Kerberos` 主体和密钥表文件，分发密钥表文件，并执行集群配置任务。\n4.\
  \ **基于角色的访问控制** – 通过角色和权限控制对集群的访问。例如，admin 角色可以同时扮演服务管理员和集群管理员的角色。\n5. **日志搜索**\
  \ – `Apache Solr` 支持在 `Ambari` 内部轻松快速地搜索组件日志，无需任何麻烦。搜索条件可以包括关键词、时间范围或日志级别。\n6. **可扩展性**\
  \ – `Ambari` 保持敏捷性，可扩展以添加或修改服务以适应自定义环境。`Ambari` 界面视图可扩展以修改 Web 组件。\n7. **SmartSense**\
  \ – 这是一个自动诊断工具，用于收集事件信息，创建“数据包”，并将其上传至 Hortonworks 支持部门。这有助于加快事件解决速度，缩短周转时间。此外，它还能分析数据包并为每个集群生成建议。建议旨在减少运营问题并提升集群性能。\n\
  \n图 8-4 展示了 `Apache Ambari` 的功能分支。\n\n![A454145_1_En_8_Fig4_HTML.jpg](img/A454145_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\nApache Ambari 的优势\n\n## 数据湖运营化\n\n从本质上讲，数据湖从构思、规划、预配置到运营化的整个过程，需要敏锐的商业头脑和组织愿景。撇开在基础工作、领导共识以及与组织战略对齐方面投入的努力不谈，数据湖的一些关键阶段包括容量规划、预配置、监控和安全。\n\
  \n以下列表讨论了能够使数据湖正常运行的若干设计考量。与其说是考量，不如将其视为确保生态系统平台稳定性的最佳实践。\n\n\n\n## Hadoop 数据湖运维最佳实践\n\
  \n## 1. 集群规划\n\n基于 Hadoop 的数据湖可以部署在本地站点或云端。本地部署和云端部署各有优劣。虽然云服务旨在提供稳定性、可用性和更好的投资回报率（ROI），但本地部署在根据需求和使用场景进行调整方面更具灵活性。\n\
  \n## 2. 集群设计\n\n- 选择更多数量的轻量级节点，而不是少量的大型节点。\n- 更多的节点增强了弹性、并行性和处理能力。\n- 少量大型节点会暴露诸多问题，如更长的恢复时间。\n\
  \n## 3. 组件布局\n\n- 主组件应跨机架分布以降低风险。\n- 工作节点上的工作组件配置应保持一致。\n- 部署多个网关节点以实现客户端服务的负载均衡和分发。\n\
  - 将 Zookeeper 实例计数从默认的 3 个增加到 5 个：\n  - 便于维护\n  - 超过 5 个会因投票者过多而降低操作速度\n\n## 4.\
  \ 元数据存储\n\n像 Hive、Ambari、Oozie 和 Ranger 等组件需要关系数据库作为元数据存储：\n- 支持 Oracle、MySQL、PostgreSQL\n\
  - 考虑数据库的统一性以便于管理\n- 将所有元数据存储配置在同一台服务器上\n- 使元数据存储数据库的管理与常规数据库管理操作任务保持一致\n\n## 5.\
  \ 容量规划参数\n\n#### 5.1 容量计算参数\n\n容量规划成为以下参数的函数：\n- **初始数据大小** – 将迁移到数据湖的历史数据和当前数据\n\
  - **年增长率** – 每年的数据增长率\n- **压缩比** – 数据的压缩倍数\n- **副本因子** – 集群中的副本数量\n\n#### 5.2 副本因子权衡\n\
  \n较高的副本因子会影响查询性能和数据的可用性。副本因子为 3 是能够在可用性和性能之间取得平衡的最佳数值。\n\n#### 5.3 压缩因子差异\n\n压缩因子的测量因数据类型而异。\n\
  \n#### 5.4 临时数据大小\n\nHadoop 在中间阶段会创建多个临时文件。临时数据大小约占原始数据大小的 30-40%。\n\n#### 5.5 总存储需求\n\
  \n总存储需求 = [（初始数据大小 + 年增长率 + 临时数据大小）* 副本因子 * 1.2] / 压缩因子\n注：*1.2 是用于 HDFS 存储的随机缓冲因子\n\
  \n#### 5.6 Storm 与 Kafka\n\n- Storm 是计算密集型，而 Kafka 是磁盘密集型：\n  - 对于 Storm 监控，设置容量、延迟和失败事件计数的告警\n\
  \  - 对于 Kafka 监控，设置可用磁盘空间以及读写之间延迟的告警\n- 如果使用 Kafka，必须将 Kafka 日志保留期规划为 2-3 天\n\n\
  ## 6. 资源调配与部署\n\n- 通过 Chef、Puppet、Jenkins、Ansible 或 CFEngine 自动化资源调配和部署流程\n- 鼓励使用\
  \ Ambari 或 Cloudera Manager 等管理控制台进行资源调配\n- 添加节点后，务必在操作窗口内重新平衡 HDFS，以降低节点阈值水平\n\n\
  ## 7. 管理日常运行\n\n- 随着集群增长，调整堆大小（约 200 字节/对象）\n- 使用并行垃圾回收\n- 为元数据存储、NameNode 和安全组件设置高可用性\n\
  - 使用 Ambari 监控 HDFS 磁盘使用率、DataNode、集群负载、CPU 使用率等指标\n- 如果应用程序使用 HBase，监控以下指标：\n \
  \ - `callQueueLength`\n  - `memstore size`\n  - `compaction queue size`\n  - `slowHLogAppendCount`\n\
  \  - `GCTime`、`CPU Load`、`CPU Allocation`、`IOPS`\n- 关键故障排除日志：\n  - HDFS 审计日志\n \
  \ - 组件日志（`/var/log/Hadoop*`）\n  - 应用程序日志（`/app-logs/`）\n  - Hive 日志（`/tmp/<user>/hive.log`）\n\
  \n## 结论\n\n平稳且稳定的运维策略是数据湖之旅的基石。它让数据和分析社区有信心加入并开始无忧无虑地探索数据。一个破碎的数据湖运维方案会给数据治理委员会和业务领导层实现数据民主化的本质带来严峻挑战。\n\
  \n"
