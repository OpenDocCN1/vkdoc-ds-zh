- '# CSV 文件分析


  虽然使用电子表格是检查 CSV 文件最简单的方法，但并非最全面的方法。根据定义，CSV 文件包含逗号分隔值。即使电子表格显示数据行中第 57 到第 109 个字段没有内容，我们也需要确保这些字段存在于文件中且不包含任何内容。每一行总共应有
  108 个逗号，因为最后一个字段不需要逗号。从第 57 个字段开始，应该只有逗号且它们之间没有任何内容，或者是一对紧挨着的双引号（`""`），这表示一个空字符串。


  虽然这并非一件有趣的事情，但我们数了逗号后发现，我们选取的随机几行都包含分隔 109 个字段所需的所有逗号。这真是一个好消息，因为现在我们知道了 1987 年
  10 月的文件确实包含全部 109 个字段，尽管其中许多字段没有填充数据。这意味着我们只需要处理一种类型的 CSV 文件，而不是三种。


  下一步是确保所有航班数据的格式保持一致。为此，我们选择检查 2003 年 6 月和 2008 年 10 月这两个月份的数据，这些月份是添加新字段的时间点。我们检查了这些文件，发现布局是一致的。现在我们确信所有包含航班数据的文件都具有相同的布局或格式，包含
  109 个字段，因此我们不需要为此进行任何特殊处理。


  当使用电子表格检查数据时，您还需要注意，电子表格会对数据字段使用默认的表示形式。例如，CSV 文件中的 `FlightDate` 字段格式为 `yyyy-mm-dd`；然而，电子表格将其显示为
  `mm/dd/yyyy`。另一个例子是 `CRSDepTime` 字段，在 CSV 文件中它是一个格式为 `"hhmm"` 的字符串。字符串 `"0900"`
  在电子表格中显示为 `900`。您必须了解数据在电子表格中的呈现方式，因为在许多情况下，它会与实际数据不同。


  在熟悉要分析的数据时，务必做到全面细致。使用电子表格是快速验证某些事项的方法，但它并非最佳方案。您始终需要使用文本编辑器检查原始数据。


  ### 时间戳注意事项


  Splunk 是一个时间序列索引器。这一事实使得时间戳在 Splunk 中具有至关重要的意义。所有事件都会自动添加时间戳。搜索应用程序的用户界面有一个基于时间戳的时间范围选择器，这会影响搜索。时间线柱状图基于时间戳。默认情况下，搜索结果按时间戳排序。还有一些命令（如
  `timechart`）也是基于时间戳的。在 Splunk 中，数据必须包含时间戳，时间戳的分配遵循以下优先级规则：


  1.  Splunk 会在事件本身中查找时间或日期，使用您在 `props.conf` 文件中配置的显式 `TIME_FORMAT`。

  2.  如果未定义 `TIME_FORMAT`，Splunk 会尝试根据事件源类型识别时间或日期。

  3.  如果无法识别时间或日期，Splunk 将使用同一源中最近前一个事件的时间戳。

  4.  如果某个源中没有事件包含日期，Splunk 会尝试在文件名中查找日期，这要求事件包含时间。

  5.  对于文件源，如果无法在文件名中识别日期或时间，Splunk 将使用文件的修改时间。

  6.  如果上述所有方法都失败，Splunk 会在索引每个事件时将时间戳设置为当前系统时间。


  当我们将航班数据索引到 Splunk 中时，它会自动尝试识别 CSV 文件所有字段中的时间戳。由于航班数据中的时间戳并不明显，Splunk 将遵循优先级规则，默认使用包含事件的
  CSV 文件的最后修改日期和时间。


  这并非理想情况，因为我们无法充分利用 Splunk 提供的所有基于时间戳的功能，并且可能导致搜索结果不正确。诚然，我们仍然可以使用日期和时间来分析航班数据，因为其中有明确定义的字段包含此类信息，例如
  `FlightDate`、`CRSDepTime`，甚至如果我们想分析计划到达时间，还有 `CRSArrTime`。但如果能够组合一些字段来创建 Splunk
  时间戳，将对我们大有裨益。


  时间戳通常以两种方式表示：作为一个整数，表示自 1970 年 1 月 1 日以来的秒数，这被称为 Unix 时间；或者作为一个包含日期和时间的字符串，可以有多种不同的格式。例如，`2012
  年 12 月 21 日上午 9:15` 在 Unix 时间中表示为 `1356081300`。


  如前所述，航班数据中有两个字段组合起来可以为我们提供一个包含日期和时间的字符串。我们将使用飞行日期和 `CRS` 起飞时间，因为几乎所有人都根据起飞时间来处理航班。


  现在我们的数据有了时间戳，但还有一个额外的问题。没有对时区的明确定义。数据中的所有时间都是本地时间。由于我们知道航班的出发城市，时区是隐式定义的。在这种情况下，我们有几个选择。我们可以设计一种方法来创建一个包含时区的新字段，或者讨论是否需要时区字段。想想看，航班的起飞时间很少与特定时区关联，因为每个人都认为时间是出发城市的本地时间。基于此，我们选择不为这些数据创建时区。


  '
- '# 将字段映射到时间戳


  我们希望将第 6 列（`FlightDate`）和第 30 列（`CRSDepTime`）映射为航班数据的时间戳。有几种处理方式：


  *   对 CSV 文件进行预处理，将这些列移动到新的第 1 列和第 2 列。完成后，我们可以在 Splunk 中指定这些列提供时间戳。

  *   修改 Splunk 的时间戳处理器，直接从这些列的当前位置组装时间戳。


  和所有事情一样，这两个选项各有利弊。告诉 Splunk 从连续的列构建时间戳非常简单，但这意味着需要多一步预处理步骤来移动 CSV 文件中的列。修改 Splunk
  的时间戳处理器需要定义一个处理映射的正则表达式。当 Splunk 索引数据时，该正则表达式可能对计算机的处理开销较大，并可能成为可扩展性问题，但无需额外的步骤。由于这两个选项可以让我们说明
  Splunk 的不同功能，我们将对两者都进行解释。


  '
- "# 预处理航班数据\n\n处理结构化数据的优势之一在于，您总是知道其格式；因此，移动列相对容易。我们选择编写一个 AWK 程序来完成这项工作。该程序基于对作为字段分隔符的逗号进行计数。我们所要做的是读取一行，然后以重新排列后的列顺序写出它。在\
  \ AWK 中，程序的核心如下所示：\n\n```awk\nBEGIN {\n    FS = \",\";\n    OFS = \",\"\n}\nprint\
  \ $6, $30, $1, $2, $3, ..., $109\n```\n\n字段分隔符通过输入文件的 `FS` 变量和输出文件的 `OFS` 变量定义为逗号。AWK\
  \ 会接收每一行输入，分离字段，并将它们作为名为 `$N` 的变量提供，其中 `N` 是字段或列的编号。请注意，在 AWK 中不需要使用 `read` 指令。通过先写入第\
  \ 6 列和第 30 列，然后写入其余列，我们实现了目标。这个程序（我们称之为 `column_mover.awk`）在 Unix 中按如下方式执行：\n\n\
  ```bash\ncolumn_mover.awk < original_data_file > modified_data_file\n```\n\n\n\n\
  我们在使用 `AWK` 时遇到的一个问题是，它会统计所有逗号，包括字符串内（即一对双引号内）的逗号。在高级语言中，字符串内的逗号被视为字符串的一部分。这一点很关键，因为第\
  \ 30 列之前的两个字段都是始终包含逗号的字符串。第 16 列 `OriginCityName` 和第 25 列 `DestCityName` 总是包含城市名称和州缩写，以逗号分隔，例如\
  \ \"New York, NY\"。我们通过处理这两个额外的逗号来解决这个问题。现在 `OriginCityName` 由第 16 列和第 17 列组成，所有后续列向后移动一列；而\
  \ `DestCityName` 从第 26 列开始，由第 26 和第 27 列组成，进一步将所有后续列向后移动一列，至此总共增加了两列。新的 `AWK` 命令如下：\n\
  \n```\nprint $6, $32, $1, $2, $3, ..., $109, $110, $111\n```\n\n要确保此脚本正确运行，我们需要验证第\
  \ 30 列之后没有其他包含逗号的字符串字段。在检查数据描述后，确认了这一点。这次对数据结构和内容的审查提醒我们，必须非常熟悉要分析的数据。在选定的航班数据上执行此程序后，我们就可以将其加载到\
  \ Splunk 中。我们已将 `AWK` 程序以 `column_mover.awk` 的名称包含在本书的下载包中。\n\n为了定义所需的时间戳组合，我们需要创建一个新的源类型。在本示例中，我们将通过用户界面进行操作，但也可以直接修改\
  \ `props.conf` 配置文件来完成。按照定义新数据输入文件的对话框，我们选择在索引前预览数据，并选择要加载的文件，如图 9-4 所示。由于我们正在测试新功能，因此只使用一个月的数据。一旦确认所有操作都能正确运行，我们就可以使用所有可用数据。在本例中，我们将使用最新数据（截至撰写本文时为\
  \ 2012 年 9 月的数据）。\n\n![9781430257615_Fig09-04.jpg](img/9781430257615_Fig09-04.jpg)\n\
  \n图 9-4 . 数据预览对话框\n\n点击“继续”后，下一个对话框提供了三个与设置源类型相关的选项。我们选择定义一个新的源类型，因为我们将对字段进行特殊处理。下一屏幕如图\
  \ 9-5 所示，显示了 Splunk 对数据的初步解析。可以看到，它将所有航班记录显示为单个事件。默认设置是按时间戳换行，但由于 Splunk 无法找到时间戳，它将\
  \ CSV 文件的所有行呈现为一个事件。\n\n![9781430257615_Fig09-05.jpg](img/9781430257615_Fig09-05.jpg)\n\
  \n图 9-5 . 初始航班数据视图\n\n由于数据看起来不正确，我们点击了“调整时间戳和事件分隔设置”。这会将我们带到下一个屏幕，其中提供了多种定义事件分隔的选项。我们选择了“每行是一个事件”，然后点击“应用”按钮。经过短暂的事件处理后，它便以正确的事件分隔方式显示数据，如图\
  \ 9-6 所示。\n\n![9781430257615_Fig09-06.jpg](img/9781430257615_Fig09-06.jpg)\n\n图\
  \ 9-6 . 具有正确事件分隔的航班数据\n\n如图 9-6 所示，每行开头有一个警告三角形。将鼠标悬停在其上时，会提示“无法解析时间戳”。在这种情况下，根据优先级规则，显示的时间戳是\
  \ CSV 文件的最后修改时间戳。\n\n下一步是处理时间戳。为此，我们选择相应的标签。如图 9-7 所示，“位置”标题下有三个选项。由于时间戳位于事件的开始位置，我们无需指定其前面的模式。如果时间戳位于事件更靠后的位置，并且前面有类似字符串的内容，此选项非常有用，例如：\n\
  \n```\nPrinted on 04/17/2012 Page 01\n```\n\n![9781430257615_Fig09-07.jpg](img/9781430257615_Fig09-07.jpg)\n\
  \n图 9-7 . 时间戳定义\n\n你可以将模式定义为“Printed on”。你也可以使用正则表达式来定义模式。由于我们的情况并非如此，我们选择了最后一个选项，即定义时间戳处理器可以在事件中查找时间戳的最大字符数。这个数字是\
  \ 0，因为用于定义时间戳的字段始终位于事件的开头。时间戳字段越靠近事件开头，对 Splunk 来说越好，并且在索引数据时处理时间戳的速度也会越快。\n\n在“格式”标题下，我们可以指定时间戳格式和时区。我们已经决定不使用后者，因此可以继续定义前者。这是通过使用\
  \ `strptime()` 表达式完成的，这些表达式非常简单，并且在多种编程语言中都有详细的文档说明。在我们的例子中，表达式是 `%Y-%m-%d,\"%H%M,\"\
  `，这意味着四位数的年份、短横线、两位数的月份、短横线、两位数日期、逗号、双引号、24 小时制的小时（00 到 23）和两位数的分钟。\n\n![image](img/sq.jpg)\
  \ **注意** Splunk 目前无法识别非英文字符的月份名称（`%B`、`%b`）或星期名称（`%A`、`%a`）。替代方案是使用数字月份（`%m`）和星期（`%u`）。\n\
  \n应用这些定义后，图 9-7 中的数据预览屏幕会向我们显示一个事件列表，其中包含所需的时间戳，并且高亮显示了与时间戳表达式匹配的部分。唯一需要注意的是，标题行仍然显示一个警告，提示其无法解析时间戳，因此它使用了\
  \ CSV 文件的最后修改时间。在我们的例子中，这不是问题，因为 CSV 文件的标题行不包含任何航班信息。\n\n下一个对话框要求输入新源类型的名称。我们将其命名为\
  \ `FD_Source1` 并保存。之后会进入索引数据界面，在该界面上完成最终选择后，它会自动开始索引。此时，你可以转到搜索应用的摘要页面，查看已索引事件数量的增长情况，直到停止增长。在我们的例子中，2012\
  \ 年 9 月包含了 490,200 个事件。请注意，此计数包括了标题行。\n\n现在，我们可以验证新的源类型是否工作正常。我们首先在用户界面的搜索框中输入以下搜索命令来查看几行数据：`*\
  \ | head`。由于我们没有指定任何排序，Splunk 默认会按时间戳降序排列，即从最新到最旧。正如预期，标题行是第一个显示的事件，随后是时间戳为 2012\
  \ 年 9 月 30 日晚上 11:59:00.000 的事件，并继续按时间戳递减排列。这些事件包含了我们期望的信息。我们还可以看到，每个事件都正确显示了主机名称、源类型和源文件。\n\
  \n\n\n### 标题层级优化\n（根据内容逻辑重新划分，保留原始标题结构，未新增标题）\n\n---\n\n回顾左侧边栏，我们注意到在“Interesting\
  \ Fields”下，标题行中的字段名称没有显示出来。这并不理想，因为将来分析数据时，我们将无法在这些搜索中使用字段名称。问题在于我们错误地假设 Splunk\
  \ 会自动将标题行中的字段名称与数据字段关联起来。如果使用 CSV 作为源类型，这通常会发生，但在我们的案例中，我们定义了一个新的源类型。解决方案是在 `props.conf`\
  \ 文件的 `_FD_Source1_` 配置节中将 `CHECK_FOR_HEADER` 属性设置为 true。\n\n不幸的是，`CHECK_FOR_HEADER`\
  \ 属性仅在索引时生效，因此我们必须删除已索引的数据并重新索引。在 `_props.conf_` 文件中添加 `CHECK_FOR_HEADER` 属性后，我们停止\
  \ Splunk。所有对配置文件的更改都需要重启才能激活。我们停止 Splunk 的原因是，用于删除已索引事件的命令仅在 Splunk 未运行时才有效。\n\n\
  `clean` 命令是通过 Unix 提示符下的命令行界面（CLI）发出的，它根据你是否提供索引名称作为参数，来删除一个或所有索引中的数据。由于我们的 Splunk\
  \ 实例仅包含主索引中的航班数据，我们将通过执行以下命令来删除所有数据：\n\n```\nsplunk clean eventdata\n```\n\n删除索引中的数据后，我们再次启动\
  \ Splunk，然后可以继续重新索引数据。我们的操作方式与之前大致相同：预览数据，但这次我们选择使用现有的源类型，并从下拉菜单中选择 `FD_Source1`。Splunk\
  \ 向我们呈现了数据，看起来是正确的，然后我们继续索引。\n\n索引完成后，我们再次验证源类型是否正常工作。当我们搜索前 10 个事件时，我们可以看到字段名称出现在左侧边栏中。一切看起来都不错。然而，我们也注意到每个事件上的源类型现在变成了\
  \ `FD_Source1-2`。虽然看起来可疑，但这被证明是当 `CHECK_FOR_HEADER` 为 true 时的一个副作用，它会导致索引的源类型被追加一个数字。\n\
  \n![图片](img/sq.jpg)  \n**注意**   当 `CHECK_FOR_HEADER` 设置为 true 时，字段名称存储在定义源类型的服务器上。因此，此功能在大多数转发数据的环境中将无法使用。\n\
  \n现在，我们可以尝试一些搜索命令，看看字段名称是否与内容正确对齐。第一个快速检查是通过在用户界面的搜索屏幕中输入以下搜索命令，来查找按计划航班数量排序的前 10\
  \ 个出发机场：\n\n```\n* | top Origin\n```\n\n此搜索会遍历所有已索引的事件，这也是我们进行这些快速验证时想要做的事情之一。`Origin`\
  \ 字段包含机场代码。结果显示前 10 个机场，并包含了常见的主要机场：亚特兰大、芝加哥奥黑尔、达拉斯/沃斯堡、丹佛等。\n\n在接下来的检查中，我们将尝试验证如果某个事件具有最后一个字段\
  \ `Div5TailNum`，那么它是否也包含实际的尾翼编号。我们使用的搜索是：\n\n```\n* | where isnotnull(Div5TailNum)\n\
  ```\n\n此搜索的结果仅包含标题行，因此本月没有出现五个经停点的航班。我们尝试搜索 `Div4TailNum` 和 `Div3TailNum`，均未成功，直到我们对\
  \ `Div2TailNum` 进行搜索并得到结果。这仅显示了 9 月 1 日上午 7:40 阿拉斯加航空的一个事件。我们转到左侧边栏并点击 `Div2TailNum`。图\
  \ 9-8 显示了一个弹出窗口，其中包含统计信息和字段值的细分。这里有两个值：来自标题行的 `Div2TailNum` 和 `N768AS`，后者是一个正确的尾翼编号，恰好与\
  \ `TailNum` 字段中包含的编号相同。\n\n![9781430257615_Fig09-08.jpg](img/9781430257615_Fig09-08.jpg)\n\
  \n图 9-8 . 带有统计信息的字段弹出窗口\n\n我们使用事件中间的一个字段进行最后一项检查。选择的字段是 `Cancelled`。值为 1 表示航班取消，值为\
  \ 0 则表示未取消。执行以下搜索命令：\n\n```\n* | chart count by Cancelled\n```\n\n此命令遍历所有事件，字段弹出窗口显示三个值：0、1\
  \ 和 `Cancelled`。最后一个值果然来自标题行。由于没有其他值，且未取消航班（99.193%）和取消航班（0.807%）的百分比看起来合理，这个结果以及之前几次搜索的结果让我们确信数据已正确索引到\
  \ Splunk 中。\n\n---\n\n### 修改时间戳处理器\n\n将航班数据的期望字段映射到时间戳的第二个选项是修改 Splunk 的时间戳处理器。Splunk\
  \ 会自动识别并提取大多数明显的時間戳。它通过一组预定义的正则表达式来完成此操作，这些表达式可以在 Splunk 的 `etc` 目录下名为 `datetime.xml`\
  \ 的文件中找到。\n\n使用此选项，我们需要编写一个新的正则表达式，以便将第 6 列和第 30 列映射为新的时间戳。有许多不同的正则表达式可用于此映射。本例中，我们将采用与之前移动列的\
  \ AWK 脚本类似的方式：我们将统计逗号。和之前一样，我们必须考虑到第 6 列（`OriginCityName`）和第 25 列（`DestCityName`）始终包含城市名称和州缩写，两者之间用逗号分隔。\n\
  \n思路是跳过前五列，捕获日期，然后跳过接下来的 26 列，再捕获时间。我们使用的正则表达式是：\n\n```\n(?:[^,]*,){5}(\\d+)-(\\\
  d+)-(\\d+)(?:[^,]*,){26}\"(\\d\\d)(\\d\\d)\"\n```\n\n虽然这不是正则表达式教程，但我们会解释这串奇怪的字符组合的含义。你可以使用你喜欢的搜索引擎在网上找到各种正则表达式教程。在第一部分\
  \ `(?:[^,]*,)` 中，外层括号表示我们对正则表达式的这一部分进行分组。分组会被记住以备后续引用，但这是相当消耗处理资源的。因为我们在此正则表达式部分仅使用分组来跳过字段，所以我们使用了\
  \ `?:` 字符，这是一个特殊指令，告诉正则表达式处理器不要记住这个分组，这将加速处理过程。\n\n方括号（`[]`）用于定义字符集，它告诉正则表达式引擎仅匹配该集合中所有字符中的一个。当插入符号（`^`）用作集合中的第一个字符时，它表示该集合被取反。在本例中，`[^,]`\
  \ 匹配除逗号之外的任何字符。请注意，在所有其他上下文中，插入符号表示行首。紧随其后的星号（`*`）是一个重复指令，表示零次或多次。最后，逗号是一个需要匹配的字面逗号。因此，`(?:[^,]*,)`\
  \ 意味着该分组匹配任何字符（除逗号外）零次或多次，后跟一个逗号，并且不要记住此分组以备将来引用。分组可以通过用花括号（`{}`）括起来的次数来重复。在本例中，我们将第一个分组重复了五次。\n\
  \n在下一部分 `(\\d+)-(\\d+)-(\\d+)` 中，我们通过定义这三个分组来捕获日期。`\\d` 是字符集 `[0-9]` 的简写，它描述所有数字。加号（`+`）是一个重复指令，表示一次或多次。分组之间的短划线是需要匹配的字面字符。请注意，这些分组不包含\
  \ `?:` 指令；因此，它们将被记住，以便我们以后可以引用它们来提取日期。\n\n\n\n正则表达式的第四部分会跳过接下来的 26 个字段，然后我们将日期捕获为两个独立的分组——小时和分钟，并用双引号（“）括起来。\n\
  \n使用这个正则表达式，我们创建了一个新的时间戳处理器：\n\n```\n<datetime>\n  <define name=\"flightdata_csv_timestamp\"\
  \ extract=\"year, month, day, hour, minute\">\n    <text><![CDATA[(?:[^,]*,){5}(\\\
  d+)-(\\d+)(\\d+)(?:[^,]*,){26}\"(\\d\\d)(\\d\\d)\"]]></text>\n  </define>\n  <timePatterns>\n\
  \    <use name=\"flightdata_csv_timestamp\"/>\n  </timePatterns>\n  <datePatterns>\n\
  \    <use name=\"flightdata_csv_timestamp\"/>\n  </datePatterns>\n</datetime>\n\
  ```\n\n这里我们定义了一个名为`flightdata_csv_timestamp`的时间戳处理器，它会按照指定的顺序，从那些我们要求正则表达式记住的分组中提取年、月、日、小时和分钟。接下来的语句说明该处理器将用于处理时间和日期模式。按照最佳实践，我们没有将这段\
  \ XML 代码直接添加到`datetime.xml`文件中，而是创建了一个单独的文件，名为`datetime_flightdata.xml`，你可以在本书的下载包中找到它。\n\
  \n既然我们已经定义了一个新的时间戳处理器，下一步就是将其与一个源类型关联起来。这一次，我们不使用用户界面，而是直接处理配置文件。在 Splunk 的`etc/system/local`目录中，我们修改已有的`props.conf`文件，并为名为`FD_Source2`的源类型添加以下配置段：\n\
  \n```\n[FD_Source2]\nDATETIME_CONFIG = /etc/datetime_flightdata.xml\nMAX_TIMESTAMP_LOOKAHEAD\
  \ = 220\nSHOULD_LINEMERGE = false\nCHECK_FOR_HEADER = true\n```\n\n第一个属性指定了包含时间戳处理器的文件。注意，该文件名是相对于\
  \ Splunk 的安装目录的。第二个属性指定了 Splunk 应该在事件中向前查找多少个字符来寻找时间戳：在我们的场景中，即第 30 个字段在事件中的位置。在审查了航班数据后，我们估计\
  \ 150 个字符可以覆盖所有情况，但为了保险起见，我们将上限增加到了 220。请注意，如果这个数值设置不当，你可能会完全错过时间戳。\n\n行合并属性与 Splunk\
  \ 拆分行的方式有关。如前所述，默认情况下会在时间戳处拆分。如果没有时间戳，它就会创建一个包含所有事件（或者在我们的例子中是航班记录）的单一事件。通过将此属性设置为`false`，Splunk\
  \ 的行为将变为为每一行创建一个事件，也就是说，它会在换行符处拆分事件。最后一个属性指定 Splunk 应从 CSV 文件的标题行获取字段名。\n\n现在我们已经定义好了使用新时间戳处理器的源类型，可以进行测试了。首先，我们使用\
  \ CLI 的`clean`命令删除之前索引的所有事件。然后，通过用户界面，使用预览选项添加一个新文件。在这里，我们指定使用新的源类型`FD_Source2`，预览会显示除了标题行之外，所有事件都带有正确的时间戳。\n\
  \n索引完数据后，我们执行了与预处理选项相同的一组快速测试，并验证了该方法能正确工作。\n\n## 索引所有航班数据\n\n使用本书下载包中包含的`download_all_flight_data.sh`脚本，我们将所有航班数据下载到了名为`/mnt/flight_data`的目录中。现在，我们需要选择使用哪种选项将这些数据索引到\
  \ Splunk 中。因为我们有点懒，所以使用修改后的时间戳处理器，从而避免移动时间戳相关列的额外预处理步骤。\n\n在我们开始索引所有航班数据之前，必须在定义`FD_Source2`源类型的`props.conf`文件中添加一个属性。原来，默认情况下，Splunk\
  \ 只处理从当前日期起过去 2000 天以内的时间戳。这大约是五年半。而我们的数据最早可以追溯到 1987 年 10 月。通过设置`MAX_DAYS_AGO`属性，我们可以定义时间戳有效的过去天数。最大值是\
  \ 10,951 天，大约为 30 年，这个数值足以覆盖我们的数据。\n\n对于那些时间戳超出了`MAX_DAYS_AGO`属性所定义限制的事件，Splunk\
  \ 的时间戳将显示为最旧的有效时间戳。因此，你将无法有效使用 Splunk 的时间戳，因为它会显示错误的值。另一种方法是使用数据中包含日期和时间的特定字段。\n\
  \n![image](img/sq.jpg) **注意** 如果你的数据日期早于 1970 年 1 月 1 日（Unix 纪元），你将无法使用 Unix 时间作为替代时间戳。\n\
  \n如前几章所述，将文件一次性索引到 Splunk 的一种方法是使用 CLI 命令`add`配合`oneshot`选项。鉴于我们需要上传到 Splunk 的单个\
  \ CSV 文件数量庞大，索引这些文件的最佳方式是使用以下命令：\n\n```\nsplunk add oneshot /mnt/flight_data/On_Time_On_Time_Performance_YYYY_M.csv\
  \ \\\n–sourcetype FD_Source2\n```\n\n然而，由于`oneshot`选项不支持处理多个文件，我们编写了一个快速脚本，指定了`/mnt/flight_data`目录中所有\
  \ 300 个 CSV 文件。你可以在本书下载包中找到这个脚本，其文件名为`fd_index.sh`。\n\n像往常一样，我们想要验证所有数据是否都已正确索引，因此我们对\
  \ 2001 年 9 月 11 日（一个我们预计取消率很高的日期）运行了以下搜索命令。首先在用户界面的搜索页面上的时间选择器中设置日期，然后输入：\n\n```\n\
  * | stats count by Cancelled\n```\n\n结果显示，在 17,430 个计划航班中，有 14,900 个航班被取消。也就是说，只有\
  \ 14.5%的计划航班未被取消。下一个快速搜索是为了验证数据是否一直索引到了 1987 年 10 月，因此我们在时间选择器中设置适当的时间范围，并执行以下搜索：\n\
  \n```\n* | top Dest\n```\n\n由于此搜索命令将遍历该月的所有事件，我们首先验证事件数量是否与航班数量一致。结果相差一个，这是正确的。因为\
  \ Splunk 中的标题行有一个不属于 1987 年 10 月的时间戳。最终热门目的地机场的结果仍然是那些常见地点：芝加哥奥黑尔、亚特兰大、达拉斯/沃斯堡、洛杉矶和丹佛。虽然这不是一个详尽的验证过程，但我们确信所有航班数据都已正确索引到\
  \ Splunk 中。\n\n## 从关系数据库索引数据\n\n使用 CSV 文件的主要原因之一是您无法直接访问数据库。但如果您恰好能够直接访问包含待分析数据的**关系数据库**，即使只有只读权限，也可以避免将数据导出为\
  \ CSV 格式的额外步骤。通过使用 Splunk 的 DB Connect 应用，您可以创建并管理到外部关系数据库的连接，这些连接随后可以被定义为数据输入，就像处理任何其他文件、原始\
  \ TCP/UDP 输入或脚本化输入一样。\n\nDB Connect 应用的主要组件是 Java 服务器桥接器。该桥接器接收来自 Splunk 的指令，然后将其转换为\
  \ SQL 请求，并通过 JDBC 驱动程序发送到一个或多个关系数据库。当您在 Splunk 上安装此应用时，您就获得了创建和管理连接到外部基于 SQL 的关系数据库的能力。\n\
  \n\n\n在本节中，我们仅解释如何使用 DB Connect 应用从关系型数据库中提取数据，以便 Splunk 对其进行索引。使用 DB Connect 访问查找表的内容在第\
  \ 11 章中解释。为了说明直接从数据库索引数据的过程，我们创建了一个 MySQL 实例，其中包含一个表，该表存储了与 CSV 文件字段完全相同的航班数据。要完成此目标，需要执行两个步骤：\n\
  \n1.  定义数据库连接\n2.  从数据库中获取数据\n\n### 定义新的数据库连接\n\n安装 DB Connect 应用后，导航至 Splunk 的管理器界面。在“数据”组下，您会看到一个名为“外部数据库”的新选项。选择此选项后，将进入一个新界面，您可以在其中定义连接数据库所需的信息，如图\
  \ 9-9 所示。\n\n![9781430257615_Fig09-09.jpg](img/9781430257615_Fig09-09.jpg)\n\n图\
  \ 9-9 . 定义数据库连接\n\n与 Splunk 中的任何资源一样，您必须为此数据库连接指定一个名称。我们将其命名为 `FD_DB`。从此刻起，所需的信息与任何应用程序连接关系型数据库所需的信息基本相同。您必须提供主机名、端口号、数据库名称（或\
  \ Oracle SID）、用户名和密码，并可选择性地设置此连接是否为只读。您还可以在保存前验证连接，这对于确保连接正常工作非常有用。\n\n我们在测试连接时确实遇到了一个问题。连接失败，因为缺少\
  \ MySQL 的 JDBC 驱动程序。事实证明，DB Connect 包含了各种 JDBC 驱动程序，但由于许可问题，它没有包含 MySQL 的驱动程序。您只需从提供商处下载\
  \ JDBC 驱动程序，并将 JAR 文件放置在 `$SPLUNK_HOME/etc/apps/dbx/bin/lib` 目录中，然后重启 Splunk。Java\
  \ 类路径在 Splunk 启动时动态构建，并包含上述 `lib` 目录中的所有 JAR 文件。这样 DB Connect 的 Java 桥接器就能使用我们新的\
  \ JDBC 驱动程序了。\n\n### 数据库监控\n\nDB Connect 应用用于从关系型数据库获取数据的机制称为数据库监控。有两种类型的监控：\n\n\
  *   **转储**，每次运行时执行相同的 SQL 查询。如果您在计划中未指定间隔，则转储将仅运行一次。这是最基本的机制，相当于使用 CLI 对常规文件进行一次性加载。\n\
  *   **尾随**，其工作方式与 Splunk 为文件监控提供的尾随监控类似。此监控类型将确定指定表中的新记录，并仅输出这些记录。查询结果必须包含一个列，该列的值将始终大于任何旧记录的值。您可以为此目的使用自增值或时间戳。\n\
  \n当您从关系型数据库导入数据时，您还可以选择数据获取的格式。您有标准选项：CSV、带标题的 CSV，还可以定义一个模板。此外，您还可以定义基于键值对的格式或多行键值对格式。\n\
  \n无论输出格式如何，您都可以选择是否包含时间戳值。如果包含，事件将以时间戳值为前缀。您还可以指定一个包含时间戳的列。如果未定义时间戳，则使用当前时间。\n\n\
  另一个可定义的项目是执行间隔。您可以选择定义一个静态值（即监控器在两次执行之间应等待的时间量）或一个 cron 表达式。对于固定延迟，只需指定一个固定数字，例如\
  \ `1h` 表示 1 小时，或 `3000` 表示 3000 毫秒（3 秒）。Cron 表达式使用与 Unix `crontab` 文件相同的语法。\n\n\
  回到我们的示例，我们将使用转储选项，因为我们只想一次性将所有数据从数据库中取出。（不幸的是，航班数据本身并不适合作为使用尾随监控机制的示例，但此选项将在第 14\
  \ 章中讨论。）在此之前，我们需要做出几个与数据获取格式和时间戳处理相关的决定。\n\n我们非常倾向于使用键值对格式，原因有很多。首先，Splunk 非常喜欢键值对。键值对是默认格式，也是索引数据时性能最高的方式。其次，键值对格式保持了数据的丰富性和表现力。与\
  \ CSV 格式（存在诸多不便，如需要处理逗号计数、标题行被索引为事件等）相比，键值对格式似乎在易用性和强大性方面更胜一筹。我们仍然存在时间戳组件位于两个不同字段的问题，但这可以通过在\
  \ MySQL 中创建一个视图来轻松解决，该视图定义一个包含时间戳的新字段，并保留所有其他字段：\n\n```\nCREATE VIEW ontime_ts AS\n\
  SELECT STR_TO_DATE(CONCAT(FlightDate, ' ', DepTime), '%Y-%m-%d %H%i')\nAS FlightDateTime,\
  \ ontime.* FROM ontime;\n```\n\n这种将时间戳放在首位的方法与我们之前处理 CSV 文件的方法类似。但由于新字段具有 Splunk\
  \ 易于识别的时间戳，我们无需担心任何与时间戳相关的定义。同样，将时间戳作为事件中的第一个字段之一可以使索引更快。\n\n下一步是定义数据输入。我们可以在图 9-10\
  \ 所示的界面中完成此操作，该界面位于用户界面管理器“数据输入”界面的“数据库监控器”下。\n\n![9781430257615_Fig09-10.jpg](img/9781430257615_Fig09-10.jpg)\n\
  \n图 9-10 . 定义数据库监控器\n\n定义输入非常简单。我们将此数据库监控器命名为 `SQL_FlightData`，从下拉菜单中将其类型定义为 `Dump`，并指定使用\
  \ `FD-DB` 数据库连接。如果您未指定获取数据的查询，输入将默认为选择您定义的表中的所有记录。在本例中，我们希望使用刚刚定义的视图，因此我们的查询非常简单，即选择所有记录，但使用该视图，如图\
  \ 9-10 所示。或者，我们也可以不创建数据库视图，而是在 Splunk 中编写一个 SQL 查询，其本质与视图的定义相同：\n\n```\nSELECT STR_TO_DATE(CONCAT(FlightDate,\
  \ ' ', DepTime), '%Y-%m-%d %H%i')\nAS FlightDateTime, ontime.* from ontime;\n```\n\
  \n两种方法均可达到相同的结果，我们没有偏好。为了测试我们的输入是否正常工作，我们指定 `fd_kv` 作为数据加载的索引。我们点击“保存”按钮，查询开始执行，Splunk\
  \ 开始索引通过数据库连接传入的数据。完成后，我们继续验证数据是否已正确索引。我们通过检查以下搜索的输出（如图 9-11 所示）来做到这一点。\n\n```\n\
  index=fd_kv | head\n```\n\n![9781430257615_Fig09-11.jpg](img/9781430257615_Fig09-11.jpg)\n\
  \n图 9-11 . 从 MySQL 表导入的事件\n\n\n\n在图 9-11 中，你可以看到事件现在采用键值对格式，时间戳也是正确的，并且左侧边栏中的字段已正确填充。仔细检查第一个事件后，我们注意到\
  \ `FlightDateTime`、`Year` 和 `FlightDate` 字段使用的是 Unix 时间。这是因为后两个字段在 `ontime` 表中被定义为\
  \ `year` 和 `date` 类型，而 MySQL 内部会将这类字段存储为 Unix 时间。我们通过视图创建的第一个字段被自动归类为 `date` 类型；因此，它也显示为\
  \ Unix 时间。如上所见，这并非问题，因为 Splunk 时间戳已正确生成。然而，另外两个字段使用 Unix 时间可能会带来问题，因为任何使用这些字段的搜索都要求我们将其转换为更易读的格式。同样，我们有几种方法可以处理此问题。我们可以在导入查询时转换类型，也可以使用带有\
  \ `ctime` 函数的 Splunk `convert` 命令，该函数可将 Unix 时间转换为人类可读的格式：\n\n```\n... convert ctime(Year)\
  \ ctime(FlightDate) ...\n```\n\n在决定采用哪种方法之前，我们先退一步，思考一下使用这些字段的频率。事实证明，所讨论的字段仅用于创建\
  \ Splunk 时间戳；因此，这不算个问题，我们无需担心。\n\n关于事件，还需注意一点的是已分配的源类型和源。由于我们在定义数据库监视器时没有填写这些字段，它们采用了相当说明性的默认值。源类型是\
  \ `dbmon:kv`，由此我们可以快速推断出这是来自数据库监视器的键值对格式。源本身是 `dbmon-dump://FD_DB/SQL_FlightData`，同样，我们也能迅速推断出它来自一个数据库监视器，具体来说是来自名为\
  \ `FD_DB` 的数据库，且监视器名为 `SQL_FlightData`。\n\n如您所见，使用 DB Connect 应用连接到关系数据库非常简单。尽管我们没有探讨诸如追踪和调度等其他选项，但使用它们同样与我们在此处所做的一样简单。\n\
  \n## 总结\n\n在本章中，我们介绍了使用 CSV 文件以及直接连接到关系数据库将数据导入 Splunk 的过程。我们还处理了时间戳问题，以及为了创建有效的\
  \ Splunk 时间戳并充分利用它而可以采用的各种处理方法。我们使用航空公司的准点运行数据完成了所有这些操作，这些数据现在已完全索引到我们的 Splunk 实例中。在下一章中，我们将分析这些数据，并学习如何加速报告和搜索。\n\
  \n"
- "# 第 10 章\n\n![image](img/frontdot.jpg)\n\n## 分析航空公司、机场、航班与延误\n\n在本章中，我们将分析与实际航班、延误、延误原因以及机场绩效相关的航班数据。分析将使用前几章中介绍的\
  \ Splunk 搜索命令，以及新增的命令和功能，例如分析和报告加速。我们还将讨论如何可视化我们构建的搜索结果，否则这些结果可能会显得非常繁杂且难以理解。\n\n\
  ## 分析航空公司\n\n我们在前一章中提到的一点是，您应该非常熟悉您将要分析的数据。在本章中，我们将进一步利用这些对航班数据的了解。我们从一些非常基础的搜索开始，以了解聚合数据的概况。我们提出了一些简单的问题，例如查询航班数据中的航空公司数量。航空业务动态性很强，航空公司不断合并、破产，时不时还会有新的公司进入市场。因此，我们不能仅仅计算最近几个月的航空公司数量，因为我们知道，在\
  \ 26 年的航班数据中，这个数字会发生变化。\n\n我们需要弄清楚的第一件事是，在计算航空公司数量时应该查看哪个字段。你可能还记得，有三个字段以不同的方式提供了这些信息。`UniqueCarrier`\
  \ 是一个基于字母的代码，通常常旅客能够理解。当同一代码多年被不同承运商使用时，较早的承运商代码后会添加一个数字后缀。例如，`VX` 现在分配给维珍美国航空，但在此之前，它曾被哥伦比亚的\
  \ Aces 航空公司使用过，后者于 2003 年停止运营；因此，Aces 的代码是 `VX(1)`。\n\n第二个字段是 `AirlineID`，它是一个基于美国运输部证书的五位数字代码。随着时间的推移，该代码对每个航空公司都是唯一的。如果我们要对航空公司进行长期详细分析，这就是要使用的字段，但在分析的这个阶段它并不是很有用，因为我们必须记住一组五位数字，直到我们在下一章中实现对航空公司名称的查找。查找表用于根据一个表中的值显示另一个表中的信息。在这种情况下，我们将根据这些字段中包含的代码来显示航空公司的实际名称。最后一个字段是\
  \ `Carrier`，它几乎总是包含与 `UniqueCarrier` 相同的助记符，但对于重复使用的情况不会添加数字后缀；因此，该代码并不总是唯一的。检查相应的查找表时会出现另一个问题，该表可以从\
  \ TranStats 网站下载；包含航空公司名称的字段包括了该航空公司使用该代码的年份。此外，查找表中重复代码的顺序并不一致，如 表 10-1 的示例所示。\n\
  \n表 10-1。承运商字段查找表的选定样本\n\n| 代码 | 描述 |\n| --- | --- |\n| FL | 边疆航空有限公司（1960–1986）\
  \ |\n| FL | 穿越航空有限公司（1994–） |\n| PA | 泛美世界航空公司（1998–1999） |\n| PA | 泛美世界航空公司（1997–1998）\
  \ |\n| PA | 泛美世界航空公司（1960–1991） |\n| PA | 佛罗里达海岸航空公司（2003–2005） |\n| VX | 维珍美国航空（2007–）\
  \ |\n| VX | Aces 航空公司（1992–2003） |\n\n因为我们在下一章中将使用查找表来获取航空公司的名称，所以 `Carrier` 字段存在太多问题，不予考虑。重复代码不总是按顺序排列，这将迫使我们处理日期以找出最新的那个。之后，我们还需要从航空公司名称字段中删除那些日期。这只是太多不必要的工作。我们最好使用\
  \ `UniqueCarrier` 字段，因为它的查找表更适合我们的目的。每个航空公司只有一个代码，并且描述只包含航空公司的名称。\n\n![image](img/sq.jpg)\
  \ **注意**  对于我们在本书中进行的这种简易分析，我们不需要严格的历史记录来追溯航空公司多年来的名称变化，因此，使用 `UniqueCarrier` 字段来表示我们将要处理的航空公司，我们觉得很合适。\n\
  \n我们用于制定搜索策略的方法是，先从一个小样本数据开始运行搜索，比如最近一个月，仅是为了确保它们能正确工作。如果搜索使用了跨越数月的参数，我们只需用最近的两个月进行测试，以验证它能否正确处理月份边界。同样的原则也适用于日、周和年。总体思路是，你应逐步创建搜索，并在一个小数据样本上进行测试，这样就能快速验证搜索是否生成了正确的结果。\n\
  \n### 统计航空公司数量\n\n\n\n我们首先统计航空公司数量。如图图 10-1 所示，我们仅对 2012 年 9 月的数据应用以下命令（该月份通过用户界面中的时间范围选择器定义）：\n\
  \n![9781430257615_Fig10-01.jpg](img/9781430257615_Fig10-01.jpg)\n\n图 10-1 . 统计航空公司数量\n\
  \n结果显示有 15 家航空公司。验证结果是否正确有多种方法。我们可以将特定月份的航班数据加载到电子表格中，对 490,199 条航班记录执行各种计算；或者更简便的方法是，编写一条应能产生相同结果的备用\
  \ Splunk 搜索命令。由于我们只需要知道当月有定期航班的承运商数量，因此可以使用强制去重的方法，基于`UniqueCarrier`字段对所有事件进行去重。这样每个航空公司只会保留一条事件记录。Splunk\
  \ 的工作方式是从最近日期回溯到最早日期，因此它会为每个航空公司呈现最新的事件或航班记录，并忽略其余记录，因为它们是第一条记录的重复项。由于我们关注的是计数而非具体事件，可以使用以下命令，它同样会得到数量\
  \ 15：\n\n```\n* | dedup UniqueCarrier\n | stats count\n```\n\n验证搜索正常运行后，我们可以扩展它。由于我们有大约\
  \ 26 年的航班数据，按年查看这些结果是最简单的方式。如果出于某种原因需要深入查看月度数据，也可以针对感兴趣的时段进行分析。继续遵循逐步构建搜索并使用小样本数据的策略，我们将修改搜索命令，使其按年汇总。因此，我们将时间范围调整为从\
  \ 2011 年 1 月 1 日到 2012 年 9 月 30 日。请注意，`dc`是`distinct_count`的缩写。搜索命令和结果如图图 10-2 所示：\n\
  \n![9781430257615_Fig10-02.jpg](img/9781430257615_Fig10-02.jpg)\n\n图 10-2 . 2011\
  \ 年和 2012 年的航空公司数量\n\n在扫描了 10,684,656 条事件后，结果显示 2011 年有 16 家航空公司，2012 年为已知的 15 家。这似乎是合理的，因为联合航空在\
  \ 2011 年与大陆航空合并，因此承运商数量减少了 1 家。下一步是对所有航班数据运行此搜索。在我们的云服务器上，搜索耗时近三个小时。本章后面将讨论如何加速搜索。同时，我们可以通过图\
  \ 10-3 中的折线图查看结果，这种形式比一张包含年份和数量的表格能更快地传达信息。\n\n![9781430257615_Fig10-03.jpg](img/9781430257615_Fig10-03.jpg)\n\
  \n图 10-3 . 各年份航空公司数量\n\n## 可视化结果\n\n如图 10-3 的图表所示，从 1988 年到 1992 年间，航空公司数量从 15 家下降到\
  \ 10 家，随后近十年保持稳定，直到小幅增加到 12 家。2001 年“9·11”袭击的影响表现为两家航空公司退出市场。从 2003 年开始，行业迅速复苏，在\
  \ 2006 年达到 21 家航空公司的峰值，此后又缓慢下降至 15 家。我们想了解“9·11”事件后立即发生了什么，因此将搜索修改为按月而非按年计数，并在时间选择器中将时间段改为\
  \ 2001 年 9 月至 2002 年 6 月。结果显示，一家航空公司在 2001 年 10 月停止运营，另一家在 2001 年 12 月停止运营。了解哪些航空公司停止运营会很有趣。首先想到的搜索命令是：\n\
  \n```\n* | stats values(UniqueCarrier) by Month\n```\n\n`stats`函数中的`values`会返回`UniqueCarrier`字段所有不同值的列表，作为按字典序排序的多值条目输出。此搜索的问题在于，即使输出包含了我们想要的结果，但处理起来很困难。你可以在图\
  \ 10-4 中看到部分输出内容。\n\n![9781430257615_Fig10-04.jpg](img/9781430257615_Fig10-04.jpg)\n\
  \n图 10-4 . 各月份航空公司列表\n\n更好的方式是使用更易于解读的图形图表。点击图 10-4 中标注的图表按钮后，我们发现对于任何可用的图表类型，该搜索的结果都只会生成空白图表。让我们尝试另一个更易于生成图表的搜索。此外，由于我们已经确定了那两家航空公司在\
  \ 2002 年 1 月之前停止运营，因此将时间选择器中的时间段缩短为 5 个月，即从 2001 年 9 月到 2002 年 1 月。我们将使用`chart`命令并结合迷你图：\n\
  \n```\n* | chart sparkline(count,1w) by UniqueCarrier\n```\n\n默认情况下，迷你图会按被处理数据的最小时间单位呈现。由于我们在搜索中处理的是五个月的数据，迷你图默认以月为单位，但这在可视化中显得太小。使用`1w`作为参数可将分辨率从月度扩展到周度。此搜索的输出如图图\
  \ 10-5 所示。\n\n![9781430257615_Fig10-05.jpg](img/9781430257615_Fig10-05.jpg)\n\n\
  图 10-5 . 使用迷你图展示“9·11”事件后停运的航空公司\n\n`chart`命令的输出相当简陋。我们可以看到 KH（阿罗哈航空）和 TW（环球航空）在不同时间点降至零，因此我们的问题有了答案。然而，尽管迷你图提供了基本情况，但感觉仍不够完整。肯定有办法提供更全面、更具吸引力的可视化效果。为了探索更好的可视化方式，我们尝试使用`timechart`命令：\n\
  \n```\n* | timechart count by UniqueCarrier limit=0\n```\n\n在此搜索中，我们统计所有事件（航班记录）并按航空公司分组。这是一种找出所有航空公司并获取每家航空公司定期航班数量的简单方法。由于时间跨度为五个月，`timechart`命令将按月显示结果，这正是我们想要的。\n\
  \n使用`limit`参数的原因是，默认情况下显示的最大项数或数据系列数为 10。在我们分析的时间段内共有 12 家航空公司，因此可以将限制设为 12，或者偷懒设为\
  \ 0。设置`limit=0`意味着`timechart`将容纳`UniqueCarrier`字段中的所有不同项，无论有多少个。使用 0 作为参数时要小心，因为项目数量过多很可能会生成一个混乱且难以辨认的图表。如果未指定`limit`参数，Splunk\
  \ 将只显示 9 个项目，并将多余的项目归入名为`Other`的类别。哪些项目会落入`Other`类别取决于`timechart`命令使用的函数。在此示例中，将是那些数量较少的项目。控制`Other`分组是否存在的`useother`参数默认开启，但仅在`limit`的值不为零时才生效。\n\
  \n\n\n以目标受众易于理解的方式传达结果颇具挑战性。带有颜色的图表通常是首选方法。关键在于找到合适的图表类型。在这个特定示例中，我们将看到两种不同的图表类型清晰地传达了两种不同的信息。对于此次搜索的结果，Splunk\
  \ 提供的图表类型选项有柱状图、折线图和面积图。如图 10-6 所示的柱状图，通过相应航空公司柱状的消失，清楚地展示了在此期间破产的航空公司。在这个例子中，从\
  \ 11 月开始，阿罗哈航空的柱状消失，而环球航空在 1 月份也已不复存在。\n\n![9781430257615_Fig10-06.jpg](img/9781430257615_Fig10-06.jpg)\n\
  \n图 10-6. 9/11 后破产的航空公司（柱状图）\n\n图 10-7 展示了相同的结果，但使用了折线图。正如您所见，这张图表非常拥挤，没有像柱状图那样清晰地传达航空公司的消亡信息。然而，在\
  \ 12 月和 1 月之间，我们可以看到柱状图中不明显的一条信息。虽然环球航空的运量降为零，但美航的航班数量却增加了大致相同的量。实际情况是美航收购了环球航空，因此航班数量相应增加。仅仅通过更改图表类型，就浮现了一条完全不同的信息。\n\
  \n![9781430257615_Fig10-07.jpg](img/9781430257615_Fig10-07.jpg)\n\n图 10-7. 9/11\
  \ 后破产的航空公司（折线图）\n\n为了完整性，我们在图 10-8 中展示了与前面两张图表使用相同结果生成的面积图。您几乎无法区分五个项目，并且从图中无法真正推断出任何信息。尽管这种图表类型对于当前这类结果毫无用处，但对于其他搜索产生的结果可能很有用。\n\
  \n![9781430257615_Fig10-08.jpg](img/9781430257615_Fig10-08.jpg)\n\n图 10-8. 9/11\
  \ 后破产的航空公司（面积图）\n\n现在，我们对可用航班数据期间内的航空公司有了相当清晰的了解。下一步是了解机场情况。\n\n## 分析机场\n\n我们的第一个问题与分析航空公司时类似：有多少个机场？对此，有多个字段可以使用，但在深入探讨之前，我们必须注意，航班数据中的机场总是以起飞机场和目的机场成对出现。通常的预期是，起飞机场的数量应与目的机场的数量相同。让我们从检查\
  \ 2012 年 9 月的数据开始。如图 10-9 所示，我们使用与统计最近一个月航空公司数量类似的搜索：\n\n![9781430257615_Fig10-09.jpg](img/9781430257615_Fig10-09.jpg)\n\
  \n图 10-9. 统计 2012 年 9 月的机场数量\n\n结果显示，起飞机场和目的机场的数量完全相同，即 290 个机场。我们选择使用 `Origin`\
  \ 和 `Dest` 字段，因为它们包含机场名称的记忆代码，这对经常旅行的人来说相当熟悉。其他与机场相关的字段包含的代码只有该领域的专家才能理解。我们不应使用\
  \ `OriginCityName` 字段，因为有些城市拥有不止一个商业机场。我们可以通过以下搜索快速找出这些城市：\n\n![9781430257615_Fig10-10.jpg](img/9781430257615_Fig10-10.jpg)\n\
  \n图 10-10. 拥有不止一个机场的城市\n\n让我们继续对机场的研究。我们必须检查这 26 年航班数据中的机场数量。随着航空公司根据经济状况扩张和收缩，它们会增加或取消往返美国各地机场的服务。正如我们对航空公司所做的，让我们尝试对最近几年进行搜索：\n\
  \n```\n* | stats dc(Origin), dc(Dest) by Year\n```\n\n有趣的是，2012 年有 301 个起飞机场和 302\
  \ 个目的机场，而 2011 年有 299 个起飞机场和 301 个目的机场。这出乎意料。我们只能认为这是由数据不一致或跨年异常导致。为了确保搜索产生正确结果，我们像在航空公司分析中那样，基于\
  \ `dedup` 命令快速运行另一个搜索，该搜索生成了相同的结果。在图 10-11 中，您会找到展示起飞机场和目的机场数量的折线图。我们再次使用不同的图表类型审查了结果，并决定使用折线图，因为它能更清晰地呈现结果。然而，为了使起飞机场和目的机场之间的微小数值差异更明显，我们只展示了\
  \ 2000 年到 2009 年的数据，并更改了折线图中 `y` 轴的最小值。\n\n![9781430257615_Fig10-11.jpg](img/9781430257615_Fig10-11.jpg)\n\
  \n图 10-11. 起飞机场和目的机场的数量\n\n我们将跳过寻找使用最多和最少的机场，因为那些搜索非常简单。相反，我们将探讨另一个可视化挑战。这个搜索相当简单：找出每个航空公司排名前五的机场。为简化起见，我们仅使用起飞机场：\n\
  \n```\n* | top limit=5 Origin by UniqueCarrier\n```\n\n此搜索产生的输出如图 10-12 所示。这是一个按航空公司代码排序的简单表格，但它横跨了八页；这并非快速了解每个航空公司排名前五机场的最佳方式。\n\
  \n![9781430257615_Fig10-12.jpg](img/9781430257615_Fig10-12.jpg)\n\n图 10-12. 按航空公司划分的前\
  \ 5 大机场（表格）\n\n点击图表按钮，只提供柱状图、条形图和饼图作为选项。前两种只显示前四家航空公司的信息，但没有标明具体的机场名称，只显示了每家航空公司排名前五机场的单个计数。饼图选项则什么都不显示。如同尝试可视化多系列（或我们在本章中称之为的多个项目）的情况一样，没有简单的答案。一个有效的选择是将结果分解成易于管理的单元，使结果更容易理解。基于这个原则，我们考虑按航空公司分解结果，理想情况下使用饼图，因为它们非常容易理解。问题在于，我们无法真正通过单个\
  \ Splunk 命令生成任意数量的饼图。我们提出的解决方案是创建一个仪表板，其中每个面板专门用于显示特定航空公司的排名前五机场。毋庸讳言，每个面板的搜索都非常简单：\n\
  \n```\nUniqueCarrier=UA\n| top limit=5 Origin\n```\n\n最简单的方法是保存每个面板要使用的搜索，然后创建仪表板。我们已经针对最近一个月的航班数据以及随机选择的三个航空公司（西南航空、达美航空和美联航）完成了此操作。生成的仪表板如图\
  \ 10-13 所示。这是一种优雅且合乎逻辑的方式来处理一组结果，这些结果以表格形式呈现会难以阅读，并且几乎不可能以单个图表的形式展示。\n\n![9781430257615_Fig10-13.jpg](img/9781430257615_Fig10-13.jpg)\n\
  \n图 10-13. 按航空公司划分的前 5 大机场仪表板示例\n\n\n\n在继续分析航班数据之前，我们必须先提醒您一个容易混淆的点。如果您查看图 10-12，会发现百分比加起来并不完全吻合。当您比较第\
  \ 1 行数据时，美国航空（American Airlines）在达拉斯/沃斯堡机场的航班占比为 29.54%，总数为 12,358 架次，而阿拉斯加航空（Alaska\
  \ Airlines）在西雅图机场的航班为 3,704 架次，占比 30.90%，这看起来不太合理。为什么阿拉斯加航空的航班数量比美国航空少了约三分之一，但其主要机场的百分比却略高？答案是，这些百分比是针对每个航空公司在所有机场的占比计算的，因为搜索是按`UniqueCarrier`进行的。因此，达拉斯/沃斯堡机场代表了美国航空\
  \ 29.54%的始发航班，而西雅图机场则代表了阿拉斯加航空 30.90%的始发航班。\n\n## 分析航班\n\n由于到目前为止我们进行的所有搜索都比较简单，本节我们将开始增加搜索的复杂度。我们从一个简单的搜索开始：按航空公司计算平均飞行时间。和往常一样，我们针对最近一个月的数据进行搜索。搜索条件如图\
  \ 10-14 所示，它基于`CRSElapsedTime`字段，该字段包含的是计划飞行时间（以分钟为单位），而非实际飞行时间。\n\n![9781430257615_Fig10-14.jpg](img/9781430257615_Fig10-14.jpg)\n\
  \n图 10-14 .  按航空公司统计的平均飞行时间\n\n该搜索的输出是一个按航空公司排序的表格，平均飞行时间（计算为算术平均值）保留了六位小数。在确定呈现这些结果的最佳方式之前，我们想先对输出进行一些优化：四舍五入平均值并进行排序。我们按如下方式操作：\n\
  \n```\n* | stats avg(CRSElapsedTime) as AverageFlightTime\n          by UniqueCarrier\n\
  | eval AverageFlightTime=round(AverageFlightTime)\n| sort –AverageFlightTime\n```\n\
  \n每当我们通过管道操作处理数据以获取部分结果并将其传递给搜索的下一阶段时，我们都倾向于定义新字段，即使新字段并非显式必需。在这个例子中，我们在搜索的第二个子句中创建了一个包含平均值的新字段。输出在搜索的第三个子句中被四舍五入，使其更具可读性，最后按降序排序。`round`函数默认返回整数。如果您需要小数，只需在字段后用逗号分隔指定所需的精度即可。\n\
  \n确定给定数据集的最佳表示形式可能很困难。如果我们关心实际的分钟数，图 10-15 中呈现的表格形式提供了一种快速处理信息的方式，而图 10-16 中的柱状图则在不显示精确数字的情况下提供了信息。\n\
  \n![9781430257615_Fig10-15.jpg](img/9781430257615_Fig10-15.jpg)\n\n图 10-15 .  表格形式的平均飞行时间\n\
  \n![9781430257615_Fig10-16.jpg](img/9781430257615_Fig10-16.jpg)\n\n图 10-16 .  平均飞行（时间——柱状图）\n\
  \n值得注意的是，所有支线航空公司的平均飞行时间都在一个半小时左右，这印证了它们的支线定位。奇怪的是，夏威夷航空也出现在这一组中，但这可以归因于其大部分航班是夏威夷群岛内的短途飞行，这拉低了平均值，因为其飞往大陆的航班数量相对较少。\n\
  \n下一个搜索是查找最长飞行时间的航班，但搜索本身很容易实现。我们想知道每家航空公司最长飞行时间的航班，以及这些航班的始发地和目的地。同时呈现始发地和目的地增加了搜索制定的复杂性，但这并不一定意味着最终的搜索会更复杂。\n\
  \n我们无法仅用一个命令完成这个搜索，因此必须通过管道操作将其分解成多个子句。首先想到的是使用`stats`命令来查找最大计划飞行时间。正如预期，这将得出每家航空公司按时间计算的最长航班。下一步是理解如果我们将始发地和目的地添加到该特定搜索中会发生什么，如图\
  \ 10-17 所示。\n\n![9781430257615_Fig10-17.jpg](img/9781430257615_Fig10-17.jpg)\n\n\
  图 10-17 .  按航空公司、城市对分组统计的最长飞行时间\n\n该搜索的输出是一个表格，其中包含每家航空公司每个始发地-目的地对的最大飞行时间。该表格包含\
  \ 2012 年 9 月的 6,096 条记录，这意味着所有航空公司共存在这么多独特的城市对。出于好奇，我们通过搜索来查看表格中的第一项记录——美国航空从阿尔伯克基到达拉斯/沃斯堡的航班，统计了所有匹配事件，总共有\
  \ 214 条。\n\n```\nUniqueCarrier=AA Origin=ABQ Dest=DFW\n```\n\n点击左侧边栏的`CRSElapsedTime`字段，显示有两个值：100\
  \ 分钟和 105 分钟，如图 10-18 所示。这意味着该航空公司本身对此城市对有两种不同的计划飞行时间。点击出发时间字段时，有八个值，计划到达时间则有九个值。显然，这个城市对有多种航班选择。\n\
  \n![9781430257615_Fig10-18.jpg](img/9781430257615_Fig10-18.jpg)\n\n图 10-18 .  美国航空（American\
  \ Airlines）往返于阿尔伯克基和达拉斯/沃斯堡之间航班的计划飞行时间\n\n现在我们有了包含所有城市对的表格，可以尝试按最大飞行时间进行排序：\n\n\
  ```\n* | stats max(CRSElapsedTime) as MaxFlightTime\n          by UniqueCarrier,\
  \ Origin, Dest\n| sort -MaxFlightTime\n```\n\n因为我们通过管道将部分结果传递到下一个子句，所以我们创建了一个新字段`MaxFlightTime`。该搜索的输出提供了一个不区分航空公司的最长航班列表，但这并非我们想要的。我们想要每家航空公司各自的最长航班。因此，让我们尝试将`UniqueCarrier`作为`sort`命令的附加字段。这不会改变结果，因为它唯一的作用是对具有相同飞行时间的记录按航空公司进行排序。下一个合乎逻辑的步骤是按航空公司对条目进行去重。由于表格已按航空公司将最长到最短的所有城市对排序，结果应该就是我们想要的：\n\
  \n```\n* | stats max(CRSElapsedTime) as MaxFlightTime\n          by UniqueCarrier,\
  \ Origin, Dest\n| sort -MaxFlightTime\n| dedup UniqueCarrier\n```\n\n当我们验证这个搜索产生了预期的结果（如图\
  \ 10-19 所示）时，我们注意到可以将其从四个子句优化为三个，因为`dedup`命令本身就带有排序选项：\n\n```\n* | stats max(CRSElapsedTime)\
  \ as MaxFlightTime\n          by UniqueCarrier, Origin, Dest\n| dedup UniqueCarrier\n\
  \        sortby –MaxFlightTime\n```\n\n![9781430257615_Fig10-19.jpg](img/9781430257615_Fig10-19.jpg)\n\
  \n图 10-19 .  按航空公司、城市对统计的最长航班\n\n到目前为止，我们处理的是最大计划飞行时间，但众所周知，实际情况往往大相径庭，所以让我们加入实际飞行时间。我们可以通过将其作为`stats`命令的一部分来实现，并且它应该会贯穿其余部分：\n\
  \n```\n* | stats max(CRSElapsedTime) as MaxSchedTime\n          max(ActualElapsedTime)\
  \ as MaxActualTime\n          by UniqueCarrier, Origin, Dest\n| dedup UniqueCarrier\n\
  \        sortby –MaxActualTime\n```\n\n\n\n我们更改了新字段的名称，使其更能代表其内容，并根据最大实际飞行时间进行了排序。处理包含多个字段的结果时，一个问题是它们不便于以彩色图表的形式呈现。我们尝试了\
  \ Splunk 提供的各种图表类型，但虽然两种飞行时间都显示得很好，城市对的名称却找不到。图 10-20 以表格形式展示了此次搜索的结果，我们认为这是呈现这些结果的最佳选择。\n\
  \n![9781430257615_Fig10-20.jpg](img/9781430257615_Fig10-20.jpg)\n\n图 10-20. 各航空公司实际最长航班\n\
  \n有趣的是，2012 年 9 月，无论是按计划时间还是实际时间计算，最长的航班都是从纽约飞往檀香山的夏威夷航空航班。这是输出结果顶部的航班。它证实了我们在上一次搜索中看到的情况，即尽管夏威夷航空有最长的航班，但大多数航班都是短途航班，因此拉低了平均飞行时间。我们需要提醒您注意的是，在此次搜索中，如果任何实际飞行时间等于或小于计划飞行时间，结果的顺序将会改变，这可能会影响观众对结果的解读。\n\
  \n为了覆盖所有情况，我们还将查看最短的航班，包括按计划时间和实际飞行时间两个维度。一些读者可能认为最快、最简单的方法是反转我们刚才对最长航班搜索的排序，但这样行不通，因为你将得到最长航班中的最短时间，因为你是在按最大实际时间排序，而不是按最大计划时间。如果你通过删除短划线（`-`）并将字段名称改为\
  \ `MaxSchedTime` 来反转排序，它将正常工作；然而，表格中的列标题会出错，因为它们应该是“最小计划时间”和“最小实际时间”。修改后的搜索及部分输出见图\
  \ 10-21。\n\n```\n* | stats max(CRSElapsedTime) as MaxSchedTime\n          max(ActualElapsedTime)\
  \ as MaxActualTime\n          by UniqueCarrier, Origin, Dest\n| dedup UniqueCarrier\n\
  \        sortby MaxSchedTime\n```\n\n![9781430257615_Fig10-21.jpg](img/9781430257615_Fig10-21.jpg)\n\
  \n图 10-21. 各航空公司最短航班\n\n最短的计划航班是从加利福尼亚州的圣何塞飞往蒙特雷，时间为 18 分钟，但它在 2012 年 9 月只计划了一次，并且被取消了，所以实际时间为空。由于结果中所有其他航班都有实际飞行时间，我们想知道取消的航班对结果有何影响。查看最短航班组中的其他航班后，我们发现无论是计划还是实际飞行时间的最小值和最大值总会得出一个值。圣何塞到蒙特雷的航班是一个非常特殊的情况，因为没有实际飞行时间，而且只有一个航班，所以最小或最大实际飞行时间的结果为空。\n\
  \n## 分析延误\n\n航班数据中有许多与延误相关的字段，我们必须承认我们对它们了解不多。有关延误和取消报告方式的详细信息，可以访问 `http://www.bts.gov/help/aviation/html/understanding.html`。话虽如此，延误为我们提供了探索更复杂搜索的机会，并加深对某些搜索命令及其参数的理解。\n\
  \n延误信息按出发和到达进行分类，具体原因自 2003 年以来便已提供。航班数据还包括取消和改道的原因。此外，还有与返回登机口的航班相关的详细信息，这些信息自\
  \ 2008 年开始收集。\n\n### 按航空公司统计的延误\n\n我们将从找出各航空公司的延误情况开始。因为延误分为出发延误和到达延误，我们将重点关注到达延误，因为它们对乘客的影响最大。航班数据中有一个字段指示航班是否延误了\
  \ 15 分钟或更长时间；因此，我们使用 `ArrDel15` 作为搜索的基础。当有延误时，该字段的值设置为 1。此搜索的输出见图 10-22。\n\n```\n\
  * | stats count(ArrDel15) as Total,\n          count(eval(ArrDel15=0)) as OnTime,\n\
  \          count(eval(ArrDel15=1)) as Delayed\n          by UniqueCarrier\n```\n\
  \n![9781430257615_Fig10-22.jpg](img/9781430257615_Fig10-22.jpg)\n\n图 10-22. 各航空公司延误\
  \ 15 分钟或以上的情况\n\n此搜索的结果显示了各航空公司的总航班数，以及准点和延误的航班数，所有这些都按唯一的承运人代码排序。虽然原则上这产生了我们想要的结果，但这有点不公平。根据结果表，将\
  \ 2012 年 9 月拥有近 90,000 个航班的西南航空与拥有大约 4,600 个航班的维珍美国航空进行比较，并非同等级别的比较。此搜索的柱状图稍微清晰一些，因为比例能传达更好的信息，但这仍然不够。更公平的方式是将延误表示为总航班数的百分比，这可以通过向先前的搜索添加百分比计算来实现：\n\
  \n```\n* | stats count(ArrDel15) as Total,\n          count(eval(ArrDel15=0)) as\
  \ OnTime,\n          count(eval(ArrDel15=1)) as Delayed\n          by UniqueCarrier\n\
  | eval PCTOnTime=round(OnTime/Total*100,2)\n| eval PCTDelayed=round(Delayed/Total*100,2)\n\
  | sort - PCTDelayed\n```\n\n除了计算百分比，我们将结果四舍五入到两位小数，并按延误百分比对结果进行排序，这样我们就可以更好地了解各航空公司在\
  \ 2012 年 9 月的表现。如图 10-23 所示，美国航空公司经历了一个糟糕的月份，近 40%的航班在到达时延误了 15 分钟或更长时间。延误航班数量第二高的是西南航空，超过\
  \ 11,600 架次，但考虑到其航班总数庞大，这仅占其总航班数的 13%。我们考虑过对这些结果使用柱状图，但它与之前搜索生成的图表相同。问题在于要绘制的数值尺度差异很大，总数为数千，而百分比为数十。该图表仍然提供了很好的比例概念，但百分比却没有显示出来。\n\
  \n![9781430257615_Fig10-23.jpg](img/9781430257615_Fig10-23.jpg)\n\n图 10-23. 按航空公司统计的到达延误\n\
  \n### 按机场统计的延误原因\n\n接下来的搜索是按机场统计的延误原因。延误有五种原因，每种原因都有自己的字段，包含延误的分钟数：\n\n*   承运人 —\
  \ `CarrierDelay`\n*   天气 — `WeatherDelay`\n*   国家航空系统延误 — `NASDelay`\n*   安全 — `SecurityDelay`\n\
  *   飞机晚到 — `LateAircraftDelay`\n\n关于这些字段如何报告的详细信息，可以在本节开头提供的 URL 中找到。与之前的搜索一样，这些结果只有在以百分比形式呈现时才有意义。这意味着我们需要为每个延误原因计算百分比：\n\
  \n\n\n```\n* | stats count(ArrDel15) as Total,\n          count(eval(ArrDel15=1))\
  \ as Delayed,\n          count(eval(CarrierDelay>=15)) as CarrierDel,\n        \
  \  count(eval(WeatherDelay>=15)) as WeatherDel,\n          count(eval(NASDelay>=15))\
  \ as NASDel,\n          count(eval(SecurityDelay>=15)) as SecurityDel,\n       \
  \   count(eval(LateAircraftDelay>=15)) as LateAircraftDel\n          by Dest\n|\
  \ eval PCTDelayed=round(Delayed/Total*100,2)\n| eval PCTCarrierDelay=round(CarrierDel/Delayed*100,2)\n\
  | eval PCTWeatherDelay=round(WeatherDel/Delayed*100,2)\n| eval PCTNASDelay=round(NASDel/Delayed*100,2)\n\
  | eval PCTSecurityDelay=round(SecurityDel/Delayed*100,2)\n| eval PCTLateAircraftDelay=round(LateAircraftDel/Delayed*100,2)\n\
  | sort – Total\n| fields – Total, Delayed, CarrierDel, WeatherDel, NASDel, SecurityDel,\
  \ LateAircraftDel\n| head 5\n```\n\n由于我们在本次分析中使用 `ArrDel115` 字段作为基础，因此必须统计延误时间达\
  \ 15 分钟或更久的原因对应的计数。这些计数的结果随后被用于计算相应的百分比。我们按照机场的总航班数量对结果进行排序，因为我们希望了解最繁忙机场的延误情况。如果按延误百分比排序（即使用\
  \ `sort –PCTDelayed`），则会列出太平洋沿岸一些每天仅有几班航班且易受大雾影响的小型机场，如图 10-24 所示。\n\n![9781430257615_Fig10-24.jpg](img/9781430257615_Fig10-24.jpg)\n\
  \n图 10-24 . 延误百分比最高的机场\n\n我们回到最初的搜索，即按航班总数排序。由于我们只关注百分比，因此删除了用于计算百分比的字段。最后，我们使用\
  \ `head` 命令仅展示排名前 10 的机场。此次搜索生成的表格如图 10-25 所示。在尝试验证结果时，我们注意到包含 `PCTDelayed` 字段的列位于一个奇怪的位置。由于该字段显示的是每个机场所有延误航班的百分比，我们希望它要么是第二列（紧跟在机场代码之后），要么是最后一列。\n\
  \n![9781430257615_Fig10-25.jpg](img/9781430257615_Fig10-25.jpg)\n\n图 10-25 . 按机场统计的到达延误原因（表格形式）\n\
  \n经过详尽测试，我们发现使用 `eval` 命令创建的字段在表格和图表中会按 ASCII 顺序排列。ASCII 是计算机内部表示字符的一种方式，其顺序可描述为：某些符号、数字、另一些符号、字母顺序的大写字母、其他符号、字母顺序的小写字母以及最后一组符号。而使用\
  \ `stats` 命令创建的字段则按其创建时的顺序呈现。这种顺序在图 10-23 中清晰可见，其中 `PCTOnTime` 虽在 `PCTDelayed` 之前计算，却排在了表格的最后一列。为了按我们期望的方式调整图\
  \ 10-25 结果中列的顺序，我们可以在 `PCTDelayed` 字段前添加一个在 ASCII 表中排在 \"P\" 之前的字符。这样，它就会被放置在 `PCTCarrierDelay`\
  \ 字段列之前。请注意，它不会被放置在第一列，因为第一列是分配给 `by` 参数中使用的字段（本例中为目标机场）。在实验中，我们发现可以使用特殊字符来命名通过\
  \ `eval` 命令创建的字段。唯一的缺点是，当字段包含特殊字符时，它们无法用于进一步的计算。基于此知识，我们将 `PCTDelayed` 字段重命名为 `%Delayed`，它现在显示为本次搜索结果表的第二列，如图\
  \ 10-26 所示。\n\n![9781430257615_Fig10-26.jpg](img/9781430257615_Fig10-26.jpg)\n\n\
  图 10-26 . 按机场统计的到达延误原因（列顺序已调整）\n\n现在表格列的顺序已符合要求，我们可以继续验证结果。由于我们执行的计算相对简单，我们并不特别担心这些个别的结果。然而，我们关注的是各机场所有百分比之和是否等于\
  \ 100。拉斯维加斯的和为 99.99，足够接近 100，可以认为差异是由四舍五入误差造成的。但芝加哥奥黑尔机场的和却达到了 104.83，这已超出了四舍五入误差可以解释的范围。经过对此问题的研究，我们得出结论：原因在于用于表示延误原因的字段同时反映了出发和到达的延误。TranStats\
  \ 网站上的文档并未详细说明到这一层级，因此我们无法证实我们的猜测：即如果航班在起飞和到达时都有延误，其原因字段会将两者的分钟数相加，从而导致我们观察到的差异。\n\
  \n我们之前提到过，当搜索结果包含多个信息列时，使用图表来传达结果会比较困难。然而，在此次搜索中，使用带有 100%堆积模式选项的条形图或柱状图，可以很好地实现可视化效果，因为它展示了排名前\
  \ 10 的机场中每个机场延误原因的百分比。为了在使用此类图表时确保结果准确，我们需要对搜索进行一项修改：需要删除延误航班的总百分比（`PCTDelayed`），最简便的方法就是不再计算它。最终的搜索如下：\n\
  \n\n\n```\n* | stats count(ArrDel15) as Total,\n          count(eval(ArrDel15=1))\
  \ as Delayed,\n          count(eval(CarrierDelay>=15)) as CarrierDel,\n        \
  \  count(eval(WeatherDelay>=15)) as WeatherDel,\n          count(eval(NASDelay>=15))\
  \ as NASDel,\n          count(eval(SecurityDelay>=15)) as SecurityDel,\n       \
  \   count(eval(LateAircraftDelay>=15)) as LateAircraftDel\n          by Dest\n|\
  \ eval PCTCarrierDelay=round(CarrierDel/Delayed*100,2)\n| eval PCTWeatherDelay=round(WeatherDel/Delayed*100,2)\n\
  | eval PCTNASDelay=round(NASDel/Delayed*100,2)\n| eval PCTSecurityDelay=round(SecurityDel/Delayed*100,2)\n\
  | eval PCTLateAircraftDelay=round(LateAircraftDel/Delayed*100,2)\n| sort – Total\n\
  | fields – Total, Delayed, CarrierDel, WeatherDel, NASDel, SecurityDel, LateAircraftDel\n\
  | head\n```\n\n堆叠柱状图如图 10-27 所示。有趣的是，堆叠的顺序与图例的顺序正好相反。\n\n![9781430257615_Fig10-27.jpg](img/9781430257615_Fig10-27.jpg)\n\
  \n图 10-27 . 按机场划分的到达延误原因（柱状图）\n\n## 冬季与夏季延误对比\n\n接下来，我们想要比较 2012 年 1 月和 7 月排名前 10\
  \ 的机场的延误情况，以了解冬季是否会对延误产生影响。为此，我们将在两个不同时间段执行两个完全相同的搜索，然后合并结果。要运行两个或更多搜索，`Splunk`\
  \ 提供了一个子搜索机制。子搜索包含在方括号（`[]`）内，并在主搜索之前执行；这样，子搜索的结果就可以用于主搜索。子搜索仅限于与搜索相关的操作，而不能进行数据转换。通常，我们只在\
  \ `join` 和 `append` 命令中看到子搜索的使用。\n\n让我们从计算延误的搜索开始。到目前为止，我们一直在使用用户界面的时间选择器，但这在需要选择两个不同时间段时就行不通了。为此，我们可以使用搜索命令的\
  \ `earliest` 和 `latest` 属性来指定时间范围。据此，我们的主搜索如下：\n\n```\nearliest=1/1/2012:0:0:0 latest=2/1/2012:0:0:0\n\
  | stats count(ArrDel15) as Total_Jan,\n        count(eval(ArrDel15=1)) as Delayed_Jan\n\
  \        by Dest\n| eval PCTDelJan=round(Delayed_Jan/Total_Jan*100,2)\n```\n\n现在，我们没有使用表示所有事件的\
  \ `*`，而是将事件选择范围限制在 `earliest` 和 `latest` 定义的日期和时间之间。日期后的 “0:0:0” 序列表示具体时间（时、分、秒）。请注意，我们将最晚日期和时间定义为\
  \ 2 月 1 日凌晨，因为 `latest` 参数是排他性的，即不包含指定的日期和时间。而 `earliest` 中指定的日期和时间是包含在内的。\n\n![image](img/sq.jpg)\
  \ **注意** 在搜索或子搜索中指定的时间范围会覆盖用户界面时间选择器中选择的时间范围。\n\n子搜索与主搜索相同，只是我们修改了时间段和计算字段的名称。为了合并两个搜索的结果，我们使用了\
  \ `join` 命令，这与关系数据库中使用的 SQL `join` 非常相似。在 `Splunk` 的 `join` 命令中，你可以指定用于连接的具体字段。如果不指定，则默认使用两个结果集中所有共同的字段。由于我们的结果集结构相同，因此无需指定字段。你还可以指定要执行的连接类型。有两种连接类型：内连接和外连接（或左连接）。内连接是默认选项，仅包含两个结果集中都匹配的事件。外连接则会合并两个结果集中的所有事件，即使没有匹配项；可以将其视为合并。同样，由于我们的结果集结构相同，我们将使用内连接。搜索的最终版本如下：\n\
  \n```\nearliest=1/1/2012:0:0:0 latest=2/1/2012:0:0:0\n| stats count(ArrDel15) as\
  \ Total_Jan,\n        count(eval(ArrDel15=1)) as Delayed_Jan\n        by Dest\n\
  | eval PCTDelJan=round(Delayed_Jan/Total_Jan*100,2)\n| join\n  [\n   search earliest=7/1/2012:0:0:0\
  \ latest=8/1/2012:0:0:0\n   | stats count(ArrDel15) as ATotal_Jul,\n           count(eval(ArrDel15=1))\
  \ as Delayed_Jul\n           by Dest\n   | eval PCTDelJul=round(Delayed_Jan/ATotal_Jul*100,2)\n\
  \  ]\n| sort – TotalJan\n| fields – Delayed_Jan, Delayed_Jul\n| head\n```\n\n我们对搜索进行了缩进，使其更易于阅读，因为\
  \ `Splunk` 并没有针对搜索命令的缩进概念。`search` 命令是 `Splunk` 中搜索应用的核心。因此，当它在第一个子句中使用时，你甚至无需输入它；这就是我们一开始在所有搜索中只输入星号（`*`）的原因。但是，在第一个管道符之后，你需要输入它，正如在子搜索中看到的那样；否则，你会收到一条错误消息，指出\
  \ `earliest` 不是一个有效的命令。需要注意的一点是，我们使用了与之前搜索类似的技巧，按照我们期望的顺序排列表格列，以便更容易分析结果。如图 10-28\
  \ 所示，我们展示了两个月的航班总数和延误百分比。我们在 `Total_Jul` 字段的名称中添加了一个 `A`，使其成为第三列。这有点笨拙，但确实达到了目的。\n\
  \n![9781430257615_Fig10-28.jpg](img/9781430257615_Fig10-28.jpg)\n\n图 10-28 . 延误对比——2012\
  \ 年 1 月与 7 月\n\n我们特意将用户界面时间选择器的时间范围保留为 2012 年 9 月，以便您可以看到子搜索和主搜索覆盖时间范围的消息。有趣的是，`Splunk`\
  \ 仍然显示“2012 年 9 月有 10 条结果”。\n\n对于这个搜索，我们选择使用表格形式来显示结果，因为除了延误占航班总数的百分比之外，我们还需要航班总数来进行恰当的分析。不可否认，只显示延误百分比的图表就足以快速回答我们最初的问题（冬季是否会影响延误），但当我们查看结果时，发现了一个异常情况：除凤凰城机场外，所有机场在\
  \ 7 月的延误都更多。我们的第一个疑问是 1 月份的航班数量是否更高；因此，我们需要获取航班总数。当然，如果我们没有发现这个异常情况，也就没有必要以表格形式查看结果了。\n\
  \n## 创建和使用宏\n\n在“按机场划分的到达延误原因”搜索中，我们重复了五次相同的两个计算：统计延误原因出现次数（大于或等于 15 分钟）并计算每种原因所占的百分比。`Splunk`\
  \ 提供了定义宏的功能，可在搜索应用中使用。这些宏是搜索片段，可以在搜索中的多个位置重复使用，并且不必是一个完整的命令。宏还可以带有参数。\n\n我们可以创建两个宏来处理这些计算，这应该能简化我们的工作，并使搜索的维护更容易。例如，如果我们想分析超过\
  \ 60 分钟的延误，只需更改一次宏，而不是更改五次计算。\n\n我们将第一个宏命名为 `countd`，它将有一个参数：我们要统计其值大于等于 15 分钟的字段。该参数用美元符号（`$`）括起来，调用时将被实际值替换：\n\
  \n```\ncount(eval($cause$>=15))\n```\n\n第二个宏 `calcp` 用于计算字段的百分比，并将结果放入另一个字段中：\n\n\
  ```\neval $result$=round($input_field$/Delayed*100,2)\n```\n\n现在，使用宏后的搜索如下所示：\n\n\
  \n```spl\n* | stats count(ArrDel15) as Total,\n          count(eval(ArrDel15=1))\
  \ as Delayed,\n          `countd(CarrierDelay)` as CarrierDel,\n          `countd(WeatherDelay)`\
  \ as WeatherDel,\n          `countd(NASDelay)` as NASDel,\n          `countd(SecurityDelay)`\
  \ as SecurityDel,\n          `countd(LateAircraftDelay)` as LateAircraftDel\n  \
  \        by Dest\n| `calcp(PCTCarrierDelay,CarrierDel)`\n| `calcp(PCTWeatherDelay,WeatherDel)`\n\
  | `calcp(PCTNASDelay,NASDel)`\n| `calcp(PCTSecurityDelay,SecurityDel)`\n| `calcp(PCTLateAircraftDelay,LateAircraftDel)`\n\
  | sort – Total\n| fields – Total, Delayed, CarrierDel, WeatherDel, NASDel, SecurityDel,\
  \ LateAircraftDel\n| head\n```\n\n可以看到，要调用宏，只需将宏名称及其可能的参数括在反引号（`` ` ``）中。在 Splunk\
  \ 中，定义宏是在用户界面管理器的“高级搜索”屏幕中完成的。图 10-29 展示了 `calcp` 宏定义的部分截图。\n\n![9781430257615_Fig10-29.jpg](img/9781430257615_Fig10-29.jpg)\n\
  \n图 10-29. 在 Splunk 中定义宏\n\n在截图中可以看到，我们定义了宏的名称，但附加了 `\"(2)\"`。这意味着该宏有两个参数，这些参数将在屏幕下方定义。定义中包含了实际的宏。接下来，你可以选择是否指定该宏使用基于\
  \ eval 的定义，即宏是否基于 `eval` 命令。我们的这两个宏都是直接的扩展、文本替换；因此，我们不会勾选此项。最后，你还可以为参数定义一个验证表达式，这是一个\
  \ `eval` 表达式，其结果要么是布尔值，要么是字符串。如果布尔表达式返回 false 或为 null，宏将返回在“验证错误消息”中定义的字符串。如果验证表达式不是布尔表达式，则预期返回一个字符串或\
  \ null。如果返回 null，则视为验证成功，否则返回的字符串将用作错误信息。\n\n## 报表加速\n\n正如我们在本章中讨论的，大多数报表都会聚合信息，以呈现目标受众易于理解的摘要。创建报表所需的时间与要处理的数据量成正比。计算特定字段的平均值或像统计事件数量这样简单的操作，都意味着要读取每一个事件，在大型数据集中，这可能需要很长时间。当你需要定期汇总大型数据集生成报表时，这可能效率很低，尤其是在不同用户运行类似报表的情况下，这会增加系统负载，并可能迅速演变成一个重大问题。\n\
  \n问题的核心在于，每次运行报表时，它都会逐一遍历所有必需的事件。解决这种重复性问题的一种方法是定期为该特定报表创建数据摘要。这样一来，当你运行报表时，它会使用摘要数据，从而显著减少处理时间。对于尚未汇总的那部分数据，仍会进行常规处理，但由于数据量大幅减少，处理时间通常会快得多。\n\
  \nSplunk 提供了两种为报表创建数据摘要的方法：报表加速和摘要索引。你创建的大部分报表可能都可以通过报表加速功能来处理，这也是两种方法中最简单的一种。你只需点击一个复选框并指定一个时间范围，其余的工作\
  \ Splunk 会自动为你完成。不仅如此，任何与你为报表定义的搜索类似的搜索，也能受益于这些摘要。\n\n为了展示报表加速的工作原理，我们将使用之前定义的“按航空公司统计最长航班”的搜索。在构建这个搜索时，我们将时间范围限制在最近一个月的数据，即\
  \ 2012 年 9 月。为了使示例更有趣，我们假设这个搜索将每月运行一次，呈现过去 12 个月的数据，即一份滚动式的过去 12 个月报表。由于 TranStats\
  \ 上传最新月份数据需要几个月时间，我们还定义了搜索从当前日期前 2 个月开始，并回溯到该时间点之前的 12 个月，即总共 14 个月。在这种情况下，`earliest`\
  \ 定义为 `-14mon`，`latest` 定义为 `-2mon`。请记住，当使用月份作为时间修饰符时，必须使用 `mon`、`month` 或 `months`，而不是代表分钟的\
  \ `m`。这似乎是一个常见错误。\n\n在不加速此报表的情况下，处理近五百万个事件大约需要四分钟。在一个等待超过五秒就无法接受的世界里，四分钟简直是永恒。因此，让我们来了解一下加速此报表的必要步骤。有几种方法可以做到：在保存报表时加速，或者通过编辑现有报表来加速。我们将演示后者，为此，我们需要转到用户界面管理器的“搜索和报表”页面。在那里点击我们搜索的名称“按航空公司统计最长航班”。在图\
  \ 10-30 中，可以看到对话框包含了我们之前提供的所有信息。当我们点击“加速此搜索”时，会弹出一个下拉菜单，其中提供了摘要范围的各种选项。我们选择一年，因为我们的报表覆盖了大约过去\
  \ 12 个月的数据。之后，我们只需点击保存按钮即可。\n\n![9781430257615_Fig10-30.jpg](img/9781430257615_Fig10-30.jpg)\n\
  \n图 10-30. 加速报表\n\n从这时起，Splunk 将在后台定期负责更新摘要，以至于我们甚至不会察觉到。摘要首次创建是即时进行的，但可能需要一段时间才能完成。要了解摘要是否完成，你可以访问用户界面管理器的“报表加速摘要”页面。在图\
  \ 10-19 中，你会在“摘要状态”标题下看到我们报表的摘要已完成。如果它正在用最新信息更新摘要，则会以百分比形式显示已完成的工作量。“汇总负载”是一个重要的指标，因为它反映了\
  \ Splunk 在更新摘要方面付出的努力。这个数字越大，涉及的处理就越多。但是请注意，该计算基于更新摘要所需的时间及其发生频率。对于我们的报表（每月更新一次），这个数字会非常低。事实上，在图\
  \ 10-31 中，你可以看到该数字是 0.00004，因为它在过去几周内没有更新过。\n\n![9781430257615_Fig10-31.jpg](img/9781430257615_Fig10-31.jpg)\n\
  \n图 10-31. 报表加速摘要\n\n另一个重要的指标是“访问计数”，它也会显示报表上次运行的时间。如果你有一个负载很高但很少使用或长时间未使用的报表，你应该认真考虑删除此摘要。除了\
  \ `Complete`（完成）之外，汇总状态还可以是 `Pending`（待处理）、`Suspended`（已暂停）和 `Not enough data to\
  \ summarize`（数据不足，无法汇总）。`Pending` 意味着即将检查是否需要更新，而 `Suspended` 意味着 Splunk 已确定该搜索不值得汇总，因为摘要体积过大。这通常发生在具有高数据基数的搜索中，即它们会产生大量事件，其数量几乎与原始数据集中的事件一样多。\n\
  \n\n\n如果您对摘要的更多细节感兴趣，可以点击“摘要 ID”列下的奇怪数字。图 10-32 显示了摘要的详细信息。\n\n![9781430257615_Fig10-32.jpg](img/9781430257615_Fig10-32.jpg)\n\
  \n图 10-32 .  摘要状态\n\n在详细信息中，值得一提的是`size on disk`（磁盘上的大小）。此功能非常强大，以至于人们很容易忘记它是有成本的，即需要定期运行搜索，并且摘要会占用额外的磁盘空间。考虑到航班数据大约占用\
  \ 17GB，而该摘要的 45MB 几乎可以忽略不计。当然，这会随着时间的推移而增长，我们应该注意它可能对长期产生的影响。\n\n在 图 10-32 中，您还可以看到有多种可用的操作。由于数据、字段以及我们操作它们的方式往往会发生变化（有时是在我们不知情的情况下），我们可以使用`verify`（验证）操作来确保摘要仍在生成正确的结果，并且数据仍然是一致的。其他操作，如`update`（更新）、`rebuild`（重建）和`delete`（删除），是标准的维护问题。\n\
  \n现在的问题是，我们加速后的搜索有多快？非常快，大约只需要三秒钟。这快了好几个数量级，在这种情况下非常值得。再次提醒，您无法违背物理定律；您必须在某处付出代价。在这种情况下，我们增加了磁盘使用量，并将处理过程分散在后台进行。在摘要负载和使用方面，我们有两个很好的指标，可以让我们知道这个强大且非常简单的功能对每个报告是否值得。\n\
  \n当然，并非所有搜索都符合报表加速的条件，因为这有一些限制。首先，搜索必须使用报表命令，例如`chart`、`timechart`、`stats`、`top`、`rare`等。此外，为报表命令提供数据的命令必须是流式命令，例如`search`、`eval`、`fields`、`regex`、`lookup`、`multikv`等。第二个限制是，要汇总的数据必须至少有\
  \ 100,000 个最近的事件。\n\n摘要的工作方式是，Splunk 会定期在后台运行搜索并存储摘要信息，以便下次需要时可用。Splunk 会计算出运行后台搜索所需的频率，但可以说明的是，这取决于您定义的时间范围。\n\
  \n我们在本章中执行的所有搜索都符合报表加速的条件。您可能认为，查找最长和最短航班的搜索不符合条件，因为它们使用了`dedup`命令，而该命令不是流式命令，但它是在报表命令之后使用，而不是之前；因此，它符合第一个要求。关于最近的事件计数，我们知道每次月度更新都会带来超过\
  \ 400,000 个事件，所以这不是问题。\n\n创建数据摘要的第二种方法是摘要索引。它的工作原理与报表加速基本相同，但 Splunk 在内部处理方式不同。其设置和使用过程更为复杂。由于大多数报告都可以通过报表加速完成，摘要索引仅用于搜索在报表命令之前包含不可流式命令的情况。本书将不介绍摘要索引。如果您因任何原因需要使用它，请参考\
  \ Splunk 文档。\n\n## 加速统计\n\n正如我们在本章开头所看到的，对整个航班数据集运行一个简单的搜索可能需要长达三个小时。到目前为止，我们的策略是在最近一个月的航班数据上测试搜索。如果搜索跨度超过一个月，我们使用两个月的数据进行测试；如果搜索跨度超过几年，我们使用几年数据进行测试。不可避免地，当您的搜索准备好投入生产使用时，其中一些搜索将覆盖所有数据；在我们的示例中，这大约是\
  \ 26 年的航班数据。等待三个小时来获取单个搜索的结果或许可以忍受，但当您有十几个搜索需要定期运行时，这就完全不可接受了。\n\n报表加速侧重于为特定搜索或报告创建数据摘要，而\
  \ Splunk 有一种称为`tsidx`的机制，允许创建和使用索引数据的通用摘要。使用`tsidx`是一个两步过程。第一步是使用`tscollect`命令创建数据的通用摘要。然后，您可以使用`tstats`命令以难以置信的快速性能执行您感兴趣的统计查询。\n\
  \n`tscollect`命令非常简单；您只需定义 Splunk 将存储通用摘要的摘要文件名即可：\n\n```\n* | tscollect namespace=summary_fd\n\
  ```\n\n尽管如此简单，为所有 1.47 亿个航班事件创建通用摘要运行了超过 8 小时，并创建了一个大约为航班数据一半大小的文件。请注意，您不能使用`tscollect`命令替换摘要文件中的信息；但是，您可以向其中追加信息。例如，一旦我们将\
  \ 2012 年 10 月的航班数据加载到主索引中，我们可以像这样将其追加到`summary_fd`中：\n\n```\nearliest=10/1/2012:0:0:0\
  \ latest=11/1/2012:0:0:0\n| tscollect namespace=summary_fd\n```\n\n`tstats`命令的语法与`stats`命令不同。让我们用一个例子来说明它是如何工作的，使用我们本章前面定义的一个搜索：按航空公司统计的平均飞行时间，使用`stats`命令如下：\n\
  \n```\n* | stats avg(CRSElapsedTime) as AverageFlightTime\n          by UniqueCarrier\n\
  | eval AverageFlightTime=round(AverageFlightTime)\n| sort –AverageFlightTime\n```\n\
  \n现在，我们将用等效的`tstats`命令替换`stats`命令：\n\n```\n| tstats avg(CRSElapsedTime) as AverageFlightTime\n\
           from summary_fd\n         groupby UniqueCarrier\n```\n\n正如您所见，我们仍然可以使用函数对字段进行计算，并创建一个新字段来包含结果。接下来，我们必须指定包含通用摘要的文件名，最后，`by`参数现在是`groupby`。请注意，搜索开头不再有星号（`*`）。这是因为您不是在执行搜索并将事件传递给`tstats`命令。我们在命令前仍然有管道符号，因为我们必须告诉\
  \ Splunk 这是一个实际的命令，而不是搜索命令的属性。搜索的其余部分，即`eval`和`sort`，保持不变。\n\n它有多快？当我们使用老牌`stats`命令对\
  \ 2012 年 9 月的数据运行此搜索时，大约需要 15 秒。而使用`tstats`命令对全部 26 年的航班数据进行查询，大约需要 30 秒。看起来，投入超过八小时创建通用摘要，并额外使用\
  \ 8.6GB 磁盘空间，是非常值得的。\n\n`tstats`的缺点之一是并非所有统计函数都可用。在撰写本文时，可用的函数仅限于`count`、`sum`、`sumsq`、`distinct`、`avg`和`stdev`。但是，Splunk\
  \ 提供了一种方法，可以将`tstats`命令与`stats`命令桥接起来，以访问那些不可用的函数。这有点奇怪，但确实有效。让我们以统计航空公司数量的搜索为例：\n\
  \n```\n* | stats dc(UniqueCarrier) by Year\n```\n\n\n\n使用`tstats`进行等效搜索如下：\n\n```\n\
  | tstats prestats=t\n         dc(UniqueCarrier)\n         from summary_fd\n    \
  \     groupby Year\n| stats dc(UniqueCarrier)\n        by Year\n```\n\n为避免混淆，`tstats`中可用的`distinct`函数与`values`函数类似，均用于列出字段的唯一值，而`distinct_count`或`dc`函数则用于计算字段唯一值的数量。将`prestats`参数设为`t`（true）表示后续函数不被`tstats`支持，需通过它构建过渡，使紧随其后且功能相同的`stats`命令得以执行。虽然这看起来有些奇怪，但我们至少有了克服`tstats`限制的机制。该搜索的性能提升令人惊叹：对\
  \ 147,122,177 个事件使用`stats`的原始搜索耗时近三小时，而使用`tstats`仅需 15 秒！\n\n`tstats`中的`groupby`子句可处理多个字段。我们将简化之前用于查找各航空公司最长航班的搜索以说明这一点。原始搜索如下：\n\
  \n```\n* | stats max(CRSElapsedTime) as MaxSchedTime\n          max(ActualElapsedTime)\
  \ as MaxActualTime\n          by UniqueCarrier, Origin, Dest\n| dedup UniqueCarrier\n\
  \        sortby –MaxActualTime\n```\n\n将其改为使用`tstats`非常简单，与其他示例类似：\n\n```\n| tstats\
  \ prestats=t\n         max(CRSElapsedTime),\n         max(ActualElapsedTime)\n \
  \        from summary_fd\n         groupby UniqueCarrier, Origin, Dest\n| stats\
  \ max(CRSElapsedTime) as MaxSchedTime,\n        max(ActualElapsedTime) as MaxActualTime\n\
  \        by UniqueCarrier, Origin, Dest\n|  dedup UniqueCarrier\n         sortby\
  \ –MaxSchedTime\n```\n\n由于`max`函数不被`tstats`支持，我们通过将`prestats`参数设为 true 将其过渡到`stats`。由于`stats`是实际计算最大飞行时间的命令，因此我们在此处将结果分配给新字段。虽然在`tstats`命令中也可以输入，但不会有任何效果。出于教学目的，我们将排序字段改为最大计划飞行时间。对\
  \ 2012 年 9 月航班数据运行普通搜索大约需要 3 秒，而对全部 26 年数据进行加速搜索则需略超过两分钟。在图 10-33 中，您可以看到修改排序后的搜索结果。\n\
  \n![9781430257615_Fig10-33.jpg](img/9781430257615_Fig10-33.jpg)\n\n图 10-33 . 各航空公司历年最长航班\n\
  \n我们这样做的目的是向您展示最大计划时间列中几乎所有行都出现的奇怪数字。这显然有误，因为 1865 分钟（约 31 小时）对商业航班而言完全不现实。这一点可由以下事实证实：同一航班在过去\
  \ 26 年中的最大实际飞行时间为 477 分钟（约 8 小时），这对关岛至火奴鲁鲁的航班来说更为合理。我们需要查找更多信息。首先，我们想确认这是偶发性错误还是经常出现。为此，我们执行以下简单搜索，结果如图图\
  \ 10-34 所示。\n\n```\nUniqueCarrier=UA CRSElapsedTime=1865\n```\n\n![9781430257615_Fig10-34.jpg](img/9781430257615_Fig10-34.jpg)\n\
  \n图 10-34 . 所有计划飞行时间为 1,865 分钟的联合航空航班\n\n此搜索仅返回一个事件，但我们仍无法确定是否为孤立错误。因此，我们搜索该航线中计划时间超过\
  \ 26 年来最大实际飞行时间的航班：\n\n```\nUniqueCarrier=UA Origin=GUM Dest=HNL | where CRSElapsedTime>477\n\
  ```\n\n此搜索仅返回与上一个相同的事件，因此这是一个孤立事件。我们怀疑 2012 年 1 月 25 日的联合航空 200 航班存在数据录入问题。最后一个搜索使我们能够解释一些搜索性能技巧。当\
  \ Splunk 需从原始数据读取大量事件时速度较慢，这就是`tsidx`存在的原因。然而，Splunk 在查找事件中的特定项时速度极快，尤其是在处理键值对时。上述搜索对所有\
  \ 1.47 亿个事件耗时约 1 秒。搜索的第一部分直接通过查看 Splunk 内部维护的索引表来定位所需事件，而非读取每个事件。第二部分应用条件查询，这通常成本更高，但仅针对第一次搜索得到的事件。或者，我们也可以将搜索表述为：\n\
  \n```\n* | where UniqueCarrier=UA AND Origin=GUM AND Dest=HNL AND CRSElapsedTime>477\n\
  ```\n\n这将针对每个原始事件评估条件，耗时可能超过三小时。区别在于：匹配包含联合航空、关岛和火奴鲁鲁的 336 个事件，然后评估计划时间是否大于 477\
  \ 分钟；而后者则需对全部 1.47 亿以上事件逐一评估航空公司是否为联合航空、出发地是否为关岛、目的地是否为火奴鲁鲁以及计划时间是否大于 477 分钟。\n\n\
  为完整性起见，我们对美国航空的异常值进行了快速检查，发现两个事件的计划飞行时间分别为 1,613 分钟和 1,517 分钟，分别发生在 1993 年和 1991\
  \ 年。显然，这些是孤立事件，但可能因错误倾斜结果而影响分析。\n\n解决此问题的一种方法是使用`delete`命令删除这些事件。该命令实际上并不删除事件，只是将其标记为不在搜索中使用。当然，这不会影响在删除事件之前创建的`tsidx`摘要。删除存在异常计划飞行时间的特定事件的一种示例如下：\n\
  \n```\nUniqueCarrier=UA CRSElapsedTime=1865 | delete\n```\n\n使用此命令必须极其谨慎，据我们所知，事件删除后无法恢复。Splunk\
  \ 对此命令非常敏感，默认情况下，即使用户或管理员也没有删除事件的权限。官方建议创建用于删除事件的专用用户。\n\n最后一个示例展示了如何在单个`stats`命令中处理多个函数并将结果分配给新字段，以及如何处理条件查询。为此，我们将使用本章前面构建的按航空公司统计到达延误的搜索：\n\
  \n```\n* | stats count(ArrDel15) as Total,\n          count(eval(ArrDel15=0)) as\
  \ OnTime,\n          count(eval(ArrDel15=1)) as Delayed\n          by UniqueCarrier\n\
  | eval PCTOnTime=round(OnTime/Total*100,2)\n| eval PCTDelayed=round(Delayed/Total*100,2)\n\
  | sort - PCTDelayed\n```\n\n此搜索的第一个问题是它在`count`函数中使用了`eval`函数。尽管`count`被`tstats`支持，但`eval`不支持。解决方法是用`tstats`的`where`子句，但问题在于只能有一个子句，因此`stats`命令中的逻辑需分解为多个部分才能适配`tstats`。我们首先获取延误航班计数：\n\
  \n```\n| tstats count as Delayed\n         from summary_fd\n         where ArrDel15=1\n\
  \         groupby UniqueCarrier\n```\n\n\n\n"
- "# 排版后内容\n\n`*where*`参数的使用方式与`*eval*`函数类似，上述搜索最终按航空公司统计了所有延误航班的数量。请注意，在使用`*tstats*`命令时，必须遵循`*from*`、`*where*`和`*groupby*`子句的顺序。如果不按此顺序操作，您将收到非常具有误导性的消息，并花费大量时间试图理解发生了什么。接下来，我们需要另一个搜索来查找按航空公司统计的总航班数或准点航班数：\n\
  \n```\n| tstats count as Total\n         from summary_fd\n         groupby UniqueCarrier\n\
  ```\n\n这个搜索非常简单，剩下的工作就是连接两个`tstats`命令、计算百分比并进行适当排序。最终的搜索如下所示：\n\n```\n| tstats count\
  \ as Delayed\n         from summary_fd\n         where ArrDel15=1\n         groupby\
  \ UniqueCarrier\n| join\n  [\n   | tstats count as Total\n            from summary_fd\n\
  \            groupby UniqueCarrier\n  ]\n| eval PCTDelayed=round(Delayed/Total*100,2)\n\
  | eval PCTOnTime=round((Total-Delayed)/Total*100,2)\n| sort – PCTDelayed\n| fields\
  \ - Delayed, Total\n```\n\n本质上，我们完全重新构建了搜索，以绕过`*tstats*`命令的限制，并达到了相同的效果。在原始搜索中，我们通过一个命令统计了总数、准点航班和延误航班；而在新搜索中，我们将总数和延误航班的计数拆分为两个独立的`*tstats*`命令，然后使用`*join*`命令将它们合并，就像本章前面的“延误对比”搜索中所做的那样。准点率基于总数与延误航班数的差值计算。与原始搜索的唯一功能差异在于，我们使用`*fields*`命令消除了计数结果，只保留了百分比。使用\
  \ 100%堆叠柱状图可以很好地展示过去 26 年累积到达延误的可视化效果，如图 10-35 所示。\n\n![9781430257615_Fig10-35.jpg](img/9781430257615_Fig10-35.jpg)\n\
  \n**图 10-35.** 按航空公司统计的到达延误情况（所有年份）\n\n正如`tsidx`机制所预期的那样，性能差异巨大。仅使用 2012 年 9 月数据的原始搜索运行时间为\
  \ 10 秒，而使用重构搜索处理超过 1.47 亿条事件则耗时 15 秒。\n\n## 总结\n\n在本章中，我们使用航空公司准点性能数据完成了一次典型的数据分析会话，期间学习了如何使用\
  \ Splunk 中的一些命令。我们还讨论了各种可视化选项，这些选项取决于搜索结果以及需要传达给分析消费者的信息。最后，我们介绍了一些关于搜索和报告的性能优化技巧，这些技巧可以通过大幅缩短搜索响应时间，带来令人惊叹的巨大差异。\n\
