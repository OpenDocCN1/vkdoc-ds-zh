- "# 命名规范与自动查找\n\n按照命名规范，我们惯于在自动查找的名称前加上\"AL_\"前缀，因此基于`L_UniqueCarrier`查找定义，这个自动查找被命名为`AL_UniqueCarrier`。自动查找的唯一要求是必须根据来源（source）、来源类型（source\
  \ type）或主机（host）将其关联到事件上。对于本示例，我们将使用主机，因为所有航班数据都在名为`BigDBook`的单台主机上建立了索引。\n\n下一节是定义查找输入字段，即用于在查找表中查找匹配项的字段。我们的示例基于一个字段：表中的`Code`和航班数据中的`UniqueCarrier`。请注意，必须将\
  \ CSV 字段名放在左侧，要匹配的字段放在右侧，否则查找将静默失败。对于要从查找表返回并添加到事件中的字段也是如此。最后，保留\"Overwrite field\
  \ values\"为未选中状态，因为该选项仅在你希望用查找表中匹配到的对应值覆盖事件中的字段时使用。在此特定情况下，我们只是将`Description`作为新字段添加到事件中，并在定义中将其重命名为`Airline`。从现在开始，我们可以在任何搜索中直接使用`Airline`字段，而无需指定查找命令。例如：\n\
  \n```\n* | stats count by Airline\n```\n\n将产生与以下相同的结果：\n`* | stats count by UniqueCarrier`\n\
  `| lookup L_UniqueCarrier Code as UniqueCarrier`\n`| rename Description as Airline`\n\
  `| fields – Code, UniqueCarrier`\n\n有趣的是，通过创建自动查找，我们还可以执行反向搜索。这意味着你可以使用查找表的结果字段来进行搜索。例如：\n\
  `Airline=\"Virgin America\"`\n`| stats count`\n\n`Airline`字段作为自动查找的结果字段可用。请注意，由于我们指定了`Description`字段自动映射到`Airline`，因此`Description`字段不再可用。任何使用`Description`的搜索都将失败，使用`Code`字段的搜索也会失败，因为在自动查找定义中，我们将`Code`映射到了`UniqueCarrier`。`UniqueCarrier`字段仍然可用，因为它是原始事件的一部分。\n\
  \n## 从搜索创建查找表\n\n到目前为止，我们一直在使用 CSV 文件将数据上传到 Splunk 或将其用作查找表。Splunk 提供了创建基于 CSV 的查找表文件的能力。我们将优化本章前面使用的`L_UniqueCarrier.csv`查找表，以说明如何创建新的查找表文件并将其作为新查找表在搜索中重用。\n\
  \n最初从 TranStats 网站下载的`UniqueCarrier`字段的查找表包含 1,543 家航空公司。我们知道在整个航班数据中只涉及其中 30 家。此外，我们在清理数据时还更改了一些航空公司的名称，例如其中两家航空公司的合并备注。我们将使用以下搜索重新进行清理，并消除\
  \ 26 年航班数据中未使用到的所有航空公司：\n\n```\n| tstats count from summary_fd groupby UniqueCarrier\n\
  | lookup L_UniqueCarrier Code as UniqueCarrier\n| eval Airline=replace(Description,\
  \ \"^(.+)\\(.+\\)\", \"\\1\")\n| fields - count Description\n| outputlookup L_UniqueCarrier_short.csv\n\
  ```\n\n此搜索的前四个子句已为我们所熟知。新命令是`outputlookup`，它会创建一个 CSV 文件，并使用命令中给出的名称创建一个查找表文件定义。请注意，你还可以指定`.csv.gz`扩展名，这将自动压缩\
  \ CSV 文件。`outputlookup`命令有许多参数，我们只提及其中之一：`append`。该参数可用于将数据追加到现有的查找表文件，前提是该文件不是压缩文件。只有文件标题行中存在的字段才会被使用。\n\
  \n## 美联航 871 航班\n\n现在我们已经知道如何创建和使用查找表，接下来将通过尝试回答一个查询来让事情稍微复杂一些。在此过程中，我们将使用数据库查找表。我们提出的查询是展示美联航\
