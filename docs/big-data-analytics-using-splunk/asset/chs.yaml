  like Gecko) Chrome/5.0.375.38 Safari/533.4`

  - `Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)`

  - `Googlebot/2.1 (http://www.googlebot.com/bot.html)`

  - `Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; SV1; .NET CLR 1.1.4322)`

  - `Mozilla/5.0 (Windows; U; Windows NT 5.1; en-GB; rv:1.8.1.6) Gecko/20070725 Firefox/2.0.0.6`

  - `Opera/9.20 (Windows NT 6.0; U; en)`


  数据生成器脚本支持自定义用户代理和 HTTP 错误码的百分比，默认设置分别为 25% 和 30%。生成器的事件最大数量默认值为 50,000，周期为 30 天。生成器从当前日期开始，向后
  30 天创建示例数据。在本例中，我们采用了如上所述的默认设置。


  要运行数据生成器脚本，您的系统上需要安装 Python 2.7 或更高版本。您可以使用 Splunk 捆绑的 Python，它位于`$SPLUNK_HOME/bin`目录中（其中`$SPLUNK_HOME`是
  Splunk 的安装目录）。该数据生成器脚本已通过 Splunk 自带的 Python 2.7 和 Python 3.1.5 测试。有关 Python 的更多信息，请访问`http://www.python.org`。本书下载包中包含的示例数据生成脚本名为`Generate_Apache_Logs.py`。我们已将该脚本安装到
  Linux 机器的`/datagen/BigDBook`目录中。


