  ![9781430257615_Fig11-08.jpg](img/9781430257615_Fig11-08.jpg)\n\n**图 11-8.** 美联航\
  \ 871 航班随时间变化的计数\n\n如图 11-8 所示，该航班号的使用在多年来并不恒定。上一个搜索结果的另一个重要信息是，在整整 26 年间，美联航使用该航班号共飞行了\
  \ 5402 次。将鼠标悬停在 2012 年柱状图上，我们看到当年有 116 次航班。我们决定不使用最近一个月来测试搜索，而是只使用最近 10 次航班。这样做是因为，如果搜索有任何问题，仅用\
  \ 10 个事件比用 116 个事件更容易定位问题。逐步构建搜索，下一个合理的步骤是执行第一次查找：\n\n```\nUniqueCarrier=UA FlightNum=871\n\
  | head 10\n| lookup L_Master N_NUMBER as TailNum\n```\n\n然而，当查看显示字段的左侧边栏时，`MFR_MDL_CODE`并没有出现。我们确实注意到`Airline`字段在那里，所以我们之前定义的自动查找是正常工作的。为了确认查找表中没有匹配到尾号，我们修改搜索如下：\n\
  \n```\nUniqueCarrier=UA FlightNum=871\n| head 10\n| lookup L_Master N_NUMBER as\
  \ TailNum\n| stats count(MFR_MDL_CODE)\n```\n\n计数结果为零：没有匹配项。我们查看查询返回的第一个事件，其尾号为`N441UA`，然后使用电子表格在查找表中查找它。我们很快找到了它，同时也找到了查找失败的原因。事实证明，飞行数据中的尾号包含注册号开头的`N`，而主文件不包含，所以解决方案是在执行查找之前修剪掉`N`。我们使用`eval`命令的`ltrim`函数来实现，该函数从字段左侧修剪指定的字符串：\n\
  \n```\nUniqueCarrier=UA FlightNum=871\n| head 10\n| eval N_NUMBER=ltrim(TailNum,\
  \ \"N\")\n| lookup L_Master N_NUMBER\n```\n\n在修改这个搜索时，我们同时利用`eval`命令将修剪后的尾号赋值给`N_NUMBER`字段，以便它能直接被查找命令使用，这样我们就可以从查找命令中删除`as\
  \ TailNum`。在图 11-9 中，可以看到`MFR_MDL_CODE`字段现在出现在左侧边栏中，当我们点击它时，弹出窗口显示它有两个值。\n\n![9781430257615_Fig11-09.jpg](img/9781430257615_Fig11-09.jpg)\n\
  \n**图 11-9.** 字段侧边栏及`MFR_MDL_CODE`字段详情\n\n现在我们验证这些值是否存在于第二个查找表中。`1384956`对应波音 757，`3930326`对应空客\
  \ A320，这两者对于像美联航这样的商业航空公司来说都是合理的。此外，我们手动验证了这 10 个事件确实与图 11-9 中显示的计数匹配。我们选择只使用 10\
  \ 个事件而不是最近一个月的另一个原因是，验证 10 个事件及其在查找表中的所有关联关系要容易得多。现在我们有了这些值，就可以添加第二个查找来获取型号名称和制造商名称了。\n\
  \n```\nUniqueCarrier=UA FlightNum=871\n| head 10\n| eval N_NUMBER=ltrim(TailNum,\
  \ \"N\")\n| lookup L_Master N_NUMBER\n| lookup L_Reference CODE as MFR_MDL_CODE\n\
  ```\n\n我们再次验证，第二次查找产生的预期新字段出现在左侧边栏中，并且`MFR`和`MODEL`都显示了我们已经识别出的预期值，所以一切正常。现在我们有了所需的所有信息，让我们继续尝试回答查询问题：\n\
  \n```\nUniqueCarrier=UA FlightNum=871\n| head 10\n| eval N_NUMBER=ltrim(TailNum,\
  \ \"N\")\n| lookup L_Master N_NUMBER\n| lookup L_Reference CODE as MFR_MDL_CODE\n\
  | stats values(DestCityName) as Destination by Year OriginCityName MFR MODEL\n```\n\
  \n使用这个搜索的输出（可在图 11-10 中找到），我们验证了最近 10 个事件确实匹配了出发地和目的地。一切匹配后，我们准备删除搜索中的`| head 10`部分，并对所有飞行数据运行搜索。当我们这样做并检查结果时，我们发现\
  \ 2004 年用于芝加哥（伊利诺伊州）到得梅因（爱荷华州）航段的飞机是一架 P2004 Bravo，这是一架由 Costruzioni Aeronautiche\
  \ Tecna 公司制造的双座单引擎飞机。这显然是记录中的错误，我们决定忽略它。在这些结果中发现的另一件奇怪的事情是，它们从 1995 年开始，如图 11-11\
  \ 所示。我们知道自 1987 年（飞行数据的起始年份）以来就有美联航使用此航班号的航班，这是我们在开始为本查询探索飞行数据时了解到的，并且可以在图 11-8\
  \ 中看到。经过一些研究，我们发现 1994 年之前的事件不包含这些航班所使用飞机的尾号。\n\n![9781430257615_Fig11-10.jpg](img/9781430257615_Fig11-10.jpg)\n\
  \n**图 11-10.** 美联航 871 航班城市对及飞机信息\n\n![9781430257615_Fig11-11.jpg](img/9781430257615_Fig11-11.jpg)\n\
  \n**图 11-11.** 导出结果链接的位置\n\n数据库查找表不提供如 CSV 文件查找表那样的选项，即当未达到最小匹配数时，可以定义要返回的字符串（参见图\
  \ 11-3）。\n\n不幸的是，将这些结果可视化是一个真正的挑战。除了我们在图 11-10 中显示的表格之外，我们想不出任何像样的可视化方式，即使我们将表格分解为列的子组，并尝试像第\
  \ 10 章（图 10-9）中那样使用图表来处理仪表板示例（按航空公司排名前五的机场）。核心挑战在于找到一种方法来表示航段或城市对（出发地和目的地）。理想的方式是使用地图并在城市对之间绘制连线，但我们未能立即找到提供此功能的应用程序。然而，在寻找过程中，我们偶然发现了一个网络图，它是\
  \ Google Fusion Tables（位于`http://tables.googlelabs.com`）的一部分。在这里，您可以上传包含数据的 CSV\
  \ 文件并创建多种可视化效果，其中大部分在 Splunk 中已经可用。\n\n在 Splunk 中导出搜索结果非常简单。只需找到导出链接，它位于输出模式选择旁边。这可以在图\
  \ 11-11 中用红色圆圈标出。当您点击此链接时，一个对话框会要求您命名输出文件并选择格式。选项有 CSV、XML 和 JSON。\n\n我们创建了一个包含美联航\
  \ 871 航班所有飞行数据搜索结果的 CSV 文件，并将其上传到 Google Fusion Tables。我们选择使用`OriginCityName`和`Destination`列来创建网络图。有趣的图形如图\
  \ 11-12 所示。\n\n![9781430257615_Fig11-12.jpg](img/9781430257615_Fig11-12.jpg)\n\n\
  \n  \n图 11-12. 联合航空 871 航线的城市对网络图  \n\n## 本章小结  \n\n在本章中，你学习了如何创建和定义查找表。我们针对静态文件和数据库表都完成了这一操作。我们通过几次搜索，分别使用了简单和较为复杂的查找来说明其用法。此外，还讨论了如何基于搜索结果创建查找表，以及如何将搜索结果导出为\
  \ CSV、XML 或 JSON 格式的文件。  \n\n"
- "# 第 12 章  \n\n![image](img/frontdot.jpg)  \n\n## 分析推文  \n\n在本章中，我们将回顾如何处理和分析推文。我们将介绍\
  \ Twitter 对象格式及其包含的字段。你还会了解 JSON——Twitter 用来分享推文及其他信息的数据交换格式，以及如何将这种格式的数据加载到 Splunk\
  \ 中，包括时间戳方面的考量。我们将使用一些新命令来创建多个搜索，以历史方式和实时方式处理推文。  \n\nTwitter 是一种微博客服务，用户可发布或阅读最多\
  \ 140 个字符的文本消息。每一条这样的消息被称为一条 `tweet`。Twitter 非常成功，许多个人和公司都在使用它。来自互联网多个来源的统计数据显示，2012\
  \ 年，超过 4.65 亿注册账户每天发布约 1.75 亿条推文，且每天新增 100 万个账户。使用 Twitter 最多的三个国家是美国、巴西和日本。Twitter\
  \ 最繁忙的时刻每秒推文量高达 25,000 条。  \n\n用户可以订阅以阅读其他用户的推文，这被称为 `following`（关注），而订阅者则被称为 `followers`（粉丝）。截至\
  \ 2012 年底，按粉丝数量计算，最受欢迎的三位 Twitter 用户是：  \n\n- Lady Gaga，拥有 32,987,239 名粉丝  \n- Justin\
  \ Bieber，拥有 32,874,390 名粉丝  \n- Katy Perry，拥有 31,134,772 名粉丝  \n\n推文默认是公开的，即任何人都可以查看，但用户可以选择仅向他们的粉丝发送推文，并批准谁可以关注他们。此外，还可以发送直接消息，即一个\
  \ Twitter 用户向另一个用户发送的私人消息。这些消息受到限制，因为用户只能向关注自己的人发送私信。  \n\n关于推文还有一些额外的概念，例如 `@reply`。当一条推文以\
  \ `@username` 开头时，表示这是对发送该消息的用户的某条特定推文的回复。`@replies` 被视为普通推文，因此会发送给该用户的粉丝。由于推文的\
  \ 140 字符限制，多年来形成了一种特殊的行话。虽然我们不会深入探讨这种行话，但需要指出的是，诸如 `@username` 这样的元素不仅可以在推文中的任何位置使用，而且已经在\
  \ Twitter 之外变得相当流行。  \n\n在这种行话中，你还会发现主题标签（hashtags），它们也逐渐成为一种相当非正式的组织或分类推文的方式。用户在认为能代表推文内容类别或主题的词前加上\
  \ `#`。虽然这是一种有趣的分类内容的方式，但由于其随意性，并不总是精确的。例如，在 2012 年美国大选期间，同一个意图分类出现了多种变体：`#Elections`、`#elections`、`#Elections2012`、`elections2012`、`#Elections12`，此外还有一些拼写错误的变体，如\
  \ `election`。  \n\n当你转发别人的推文时，这被称为转推（retweeting）。当你使用 Twitter 的转推功能时，它会自动在推文开头添加字母\
  \ `RT` 和原始作者的用户名。有时用户会自行在推文中添加 `RT`、`MT` 或 `MRT`，以表明他们正在转推或已在转推前对推文进行了修改，但这并非 Twitter\
  \ 的官方功能，这些推文缺少 Twitter 在转推时包含的附加信息。  \n\n当一个主题标签频繁出现在推文中时，我们称之为趋势（trending）或变得流行。趋势通常持续时间较短，许多网站会根据自有的算法提供它们所认为的热门话题。Twitter\
  \ 本身也提供个性化趋势，这些趋势与你表达过兴趣的话题相匹配。它们的算法关注的是即时热门内容，而非那些已经流行一段时间或每日持续流行的内容。在本章后面，我们将提供我们自己相当简单的趋势版本。\
  \  \n\n当 URL 作为推文内容的一部分被包含时，Twitter 会自动将其与潜在危险网站列表进行比对。无论该 URL 是否指向可疑网站，Twitter\
  \ 还会使用他们称之为 `t.co` 服务的 URL 缩短器将其转换为新的 URL。这样，任何 URL 都将是 20 个字符长，即使链接本身更短。一些应用程序会据此调整消息的字符计数，而另一些则不会。\
  \  \n\n每个用户都有一个个人资料，他们可以定义自己的位置、时区、姓名和显示名称，还可以提供自己的照片以及许多其他属性。用户发布的每条公开推文都会发送给其粉丝，并自动发布到其个人资料页面，使其在\
  \ Twitter 网站上也可搜索。  \n\n除了网站，Twitter 还为各种手机和平板电脑提供了应用程序。还有大量第三方应用程序或客户端允许你与 Twitter\
  \ 交互。这些交互或集成通过 Twitter API 完成，这些 API 提供了对大多数功能的简单接口。此外，Twitter 还提供了一组专用于包含推文的数据流的\
  \ API。从所有这些 API 中，我们将使用能够访问名为“1% 样本”的数据流的 API，该数据流是总推文量中约 1% 的实时随机样本。包含所有推文的数据流（不公开可用）被称为\
  \ Twitter `firehose`（消防水管）。  \n\n### 接入样本数据流  \n\n我们使用一个名为 `get1pct.py` 的程序收集了 24\
  \ 小时的推文，在本章后续部分，我们将先利用这些数据进行一些基础分析，然后再使用一个 Splunk 应用程序来实时分析数据流。你可以在本书的下载包中找到该程序。使用该程序时，只需按如下方式调用，它便会将推文捕获到名为\
  \ `SampleTweets.out` 的文件中，直到你停止它：  \n\n```\nget1pct.py –n twitter_username –p password\n\
  ```\n\nTwitter 数据流使用 JSON 作为标准格式。JSON 代表 JavaScript 对象表示法（JavaScript Object Notation），是一种基于文本的数据交换标准。它通过使用花括号\
  \ `{ }` 来定义多层结构，并通过使用方括号 `[ ]` 为字段定义多个值。最终，一条使用 JSON 格式的推文是一个按多层结构组织的键值列表。你可以在图\
  \ 12-1 中看到一条典型的 JSON 格式推文，它（不可避免地）相当难以阅读。  \n\n![9781430257615_Fig12-01.jpg](img/9781430257615_Fig12-01.jpg)\
  \  \n\n图 12-1. 一条 JSON 格式的推文  \n\n为了解释典型推文中我们可以预期的基本字段，我们将它们进行格式化，每行放置一个字段（键值对），并对不同层级进行缩进。你需要意识到，这些字段在每条推文中出现的顺序不一定相同，并且并非所有字段都会出现在所有推文中。换句话说，如果某个字段未出现，可以认为其值为空或为空集。好消息是，Splunk\
  \ 在索引数据时会透明地处理这些情况。将推文格式化后，它变得更容易阅读：  \n\n\n\n```json\n{\n  \"contributors\": null,\n\
  \  \"truncated\": false,\n  \"text\": \"Searchtemplate on a form for a dashboard\
  \ and evalhttp://t.co/Cc4gIIDe\",\n  \"in_reply_to_status_id\": null,\n  \"id\"\
  : 287365037834788865,\n  \"source\": \"<a href=\\\"http://ifttt.com\\\" rel=\\\"\
  nofollow\\\">IFTTT</a>\",\n  \"retweeted\": false,\n  \"coordinates\": null,\n \
  \ \"entities\": {[+]},\n  \"in_reply_to_screen_name\": null,\n  \"id_str\": \"287365037834788865\"\
  ,\n  \"retweet_count\": 0,\n  \"in_reply_to_user_id\": null,\n  \"favorited\": false,\n\
  \  \"__time\": \"Sat Jan 05 01:08:58 +0000 2013\",\n  \"user\": {[+]},\n  \"geo\"\
  : null,\n  \"in_reply_to_user_id_str\": null,\n  \"possibly_sensitive\": false,\n\
  \  \"lang\": \"en\",\n  \"created_at\": \"Sat Jan 05 01:08:58 +0000 2013\",\n  \"\
  in_reply_to_status_id_str\": null,\n  \"place\": null\n}\n```\n\n按照此示例中的字段顺序，我们将对当前我们认为值得关注的字段进行说明；其他一些字段将在本章后面讨论。如果你想了解每个字段的详细描述，可以在\
  \ Twitter 网站 `http://dev.twitter.com/docs/platform-objects/tweets` 上找到。第一个值得关注的字段是\
  \ `text`，它包含了实际的推文内容。接下来是 `source` 字段，它告诉我们创建该推文时使用了哪个应用或客户端。对于 `entities` 字段，我们使用了\
  \ Splunk 标记 `{[+]}`（这并非 JSON 标准），来表示该字段包含我们稍后将要检查的其他子字段。`__time` 字段在推文中并不存在；它是由\
  \ Python 程序创建的，我们将在介绍数据加载和时间戳问题的章节中详细讨论。接下来的字段 `user` 包含了与发布推文的用户相关的所有信息，这些信息以子字段的形式呈现；同样，我们使用\
  \ `{[+]}` 标记来表示这一点。之后是 `lang` 字段，它包含一个遵循 ISO-639-1 标准的、由两个字母组成的语言代码。尽管在撰写本文时 Twitter\
  \ 文档中并未解释此字段，但我们推测它表示对推文实际语言的最佳猜测，并将在本章后面详细讨论。在第一次过目时最后一个值得关注的字段是 `created_at`，它记录了推文创建的时间。该字段中的所有时间均基于\
  \ UTC/GMT 时区，这一点由 `+0000` 字符串表示。\n\n展开 `user` 字段后，经过格式化的典型子字段如下所示：\n\n```json\n\"\
  user\":{\n  \"follow_request_sent\":null,\n  \"profile_use_background_image\":true,\n\
  \  \"default_profile_image\":false,\n  \"id\":121214676,\n  \"verified\":false,\n\
  \  \"profile_image_url_https\":  \"https://si0.twimg.com/profile_images/825701927/answers-avatar_normal.png\"\
  ,\n  \"profile_sidebar_fill_color\":\"DDEEF6\",\n  \"profile_text_color\":\"333333\"\
  ,\n  \"followers_count\":656,\n  \"profile_sidebar_border_color\":\"C0DEED\",\n\
  \  \"id_str\":\"121214676\",\n  \"profile_background_color\":\"C0DEED\",\n  \"listed_count\"\
  :28,\n  \"profile_background_image_url_https\":\"https://si0.twimg.com/images/themes/theme1/bg.png\"\
  ,\n  \"utc_offset\":-28800,\n  \"statuses_count\":12923,\n  \"description\":null,\n\
  \  \"friends_count\":9,\n  \"location\":\"San Francisco, CA\",\n  \"profile_link_color\"\
  :\"0084B4\",\n  \"profile_image_url\":  \"http://a0.twimg.com/profile_images/825701927/answers-avatar_normal.png\"\
  ,\n  \"following\":null,\n  \"geo_enabled\":true,\n  \"profile_background_image_url\"\
  :\"http://a0.twimg.com/images/themes/theme1/bg.png\",\n  \"name\":\"Splunk Answers\"\
  ,\n  \"lang\":\"en\",\n  \"profile_background_tile\":false,\n  \"favourites_count\"\
  :0,\n  \"screen_name\":\"splunkanswers\",\n  \"notifications\":null,\n  \"url\"\
  :\"http://answers.splunk.com/\",\n  \"created_at\":\"Mon Mar 08 20:09:54 +0000 2010\"\
  ,\n  \"contributors_enabled\":false,\n  \"time_zone\":\"Pacific Time (US & Canada)\"\
  ,\n  \"protected\":false,\n  \"default_profile\":true,\n  \"is_translator\":false\n\
  },\n```\n\n同样，按照此示例的顺序，我们将解释对我们目的来说最相关的字段。第一个是 `followers_count`，即订阅以接收该用户推文的 Twitter\
  \ 用户数量。下一个字段是 `utc_offset`，即 UTC/GMT 时区与用户声明的时区之间的差值，以秒为单位，这在进行基于 Unix 时间的数学运算时非常有用。然后是\
  \ `statuses_count`，即自账户创建以来该用户发布的推文数量。接下来是 `friends_count`，即该特定用户正在关注的其他用户数量。紧接着是\
  \ `location`，即用户声明的所在地位置。\n\n接下来的两个值得关注的字段是 `name` 和 `screen_name`，其中 `screen_name`\
  \ 是唯一的，被 Twitter 用作用户名。而 `name` 则不一定代表真实姓名。在这两个字段之间，可以找到 `lang`，它是该用户声明语言的代码。这并不意味着其推文就是用这种语言编写的。（请参阅本节后面的说明。）`created_at`\
  \ 字段包含了用户资料创建或最后更新的时间戳。请不要将此字段与上一层级中同名的字段混淆，因为那个字段包含的是推文创建的时间戳。最后一个字段包含了用户声明的时区名称。\n\
  \n![image](img/sq.jpg) **注意** 非常重要的一点是，某些字段是由用户在他们的应用或客户端中声明的，并不总是正确的。`location`、`lang`\
  \ 字段的内容，以及程度稍轻的 `time_zone` 和 `utc_offset` 字段的内容，可能与它们推文的内容有关，也可能毫无关系。我们的经验表明，这些字段的内容往往是不可靠的。在进行数据分析时请务必记住这一点。\n\
  \n当一条推文是使用 Twitter 原生功能进行的转发（retweet）时，该推文会包含一个名为 `retweeted_status` 的顶级字段。此字段的子字段包含了原始用户的所有相关信息，包括原始推文。在处理转发推文的文本时，如果原始推文接近\
  \ 140 个字符的限制，最好使用原始推文。这是因为转发推文会截掉原始推文的末尾部分，以便在转发文本的开头添加用户名和字母“RT”。请注意，顶层的 `retweeted`\
  \ 字段并不一定表示当前推文被转发了。\n\n在示例数据流中，我们还会发现一些事件并非推文，而是删除推文的指令。Twitter 不允许用户修改已经发布的推文；但它允许用户删除自己发布的推文或转发。尽管我们不需要这些记录（因为它们可能涉及到不包含在\
  \ 1% 样本中的推文），但我们决定将它们原样保留在我们将要索引到 Splunk 的文件中。这些删除事件经过格式化后如下所示：\n\n```json\n{\n\
  \  \"delete\":{\n    \"status\":{\n      \"user_id_str\":\"400166241\",\n      \"\
  user_id\":400166241,\n      \"id\":139980458426499072,\n      \"id_str\":\"139980458426499072\"\
  \n    }\n  }\n}\n```\n\n## 将推文加载到 Splunk\n\n我们对 `get1pct.py` 程序生成的文件进行了修改，使其正好包含\
  \ 24 小时的数据。我们的样本数据时间范围是从 1 月 4 日（星期五）的 15:00:00 到 1 月 5 日（星期六）的 14:59:59。该文件包含 4,815,166\
  \ 个事件，大小约为 12 GB。由于 Twitter 服务条款的限制，实际的推文数据无法分发。我们建议您运行 Python 程序并收集一个样本，其大小需适合您\
  \ Splunk 许可证的索引限制。\n\n\n### 第一个挑战：定义时间戳字段\n\n我们需要处理的第一个挑战是为 Splunk 时间戳定义正确的字段。问题在于，在\
  \ Splunk 中我们只能使用正则表达式来定义包含时间戳的字段。有两个名为 `created_at` 的字段，一个在顶层，对应实际的推文——这是我们想要的时间戳；另一个位于\
  \ `user` 对象内部。虽然对人类或 JSON 解析器来说这两个字段明显不同，但对正则表达式而言它们却是一样的，因为字段的顺序和存在性都无法保证。我们无法采用第\
  \ 9 章中使用的方法——当时时间戳分散在两个字段中，但我们能通过统计逗号数量来精确锁定想要的字段。这就是为什么 Python 程序会基于顶层的 `created_at`\
  \ 字段创建一个名为 `__time` 的新字段。请注意，这个新字段名称前有两个下划线，以免与 Splunk 内部仅有一个下划线的 `_time` 字段混淆。有了这个新字段，在\
  \ Splunk 中定义时间戳就变得非常简单。\n\n## 创建测试文件并定义新的源类型\n\n出于谨慎考虑，我们决定创建一个仅包含样本数据前 100 条推文的小型测试文件。通过这个文件，我们按照第\
  \ 9 章中“预处理航班数据”标题下的步骤，定义一个新的源类型，用于指定推文的时间戳位置：\n\n*   定义一个新的输入文件，并在索引前预览数据\n*   定义一个新的源类型\n\
  *   选择“调整时间戳和事件分隔设置”\n*   选择“每行是一个事件”并点击“应用”\n*   选择“时间戳”选项卡\n*   在“位置”下选择“时间戳总是以某种模式为前缀”，并输入以下内容：`\"\
  __time\":\"`（记住，在 `time` 这个词前有两个下划线字符）\n*   在“格式”下选择“指定时间戳格式”，并输入以下内容：`%a %b %d\
  \ %T %Z %Y`，其中：\n    *   `%a` 表示星期几的名称，可以是缩写或全称\n    *   `%b` 表示月份的名称，可以是缩写或全称\n\
  \    *   `%d` 表示月份中的日期，允许前导零，但不是必需的\n    *   `%T` 表示时间，格式为 `%H:%M:%S`\n    *   `%Z`\
  \ 表示时区或时区名称/缩写\n    *   `%Y` 表示包含世纪的年份\n*   选择“指定时区”，并从下拉菜单中选取“(UTC) 协调世界时”，因为我们知道所有时间戳都位于该时区。\n\
  *   点击“应用”。现在您应该会看到每个事件或推文上的时间戳已高亮显示，并且第二列显示正确的时间戳。您还会看到删除事件出现警告，因为它们没有时间戳。Splunk\
  \ 会为这些事件沿用前一个事件的时间戳。\n*   点击“继续”，然后指定新源类型的名称。我们将其保存为 `twitter`。\n*   现在可以开始索引测试数据了。\n\
  \n## 验证已索引的数据\n\n将这 100 个事件索引到 Splunk 后，我们可以快速验证并确认加载操作是否正确。在图 12-2 中，您可以看到列出所有事件时输出的部分截图。此图中有几点需要注意。首先，虽然图中无法显示，但在结果顶部显示“所有时间段内共有\
  \ 100 个事件”，因此确认已将我们提供的所有事件都索引了。其次要注意的是，左侧边栏显示了一些字段，这些字段与我们刚才查看的字段类似，这表明 Splunk 能够理解\
  \ JSON 格式。请注意，Splunk 表示多层字段的方式是使用点号（`.`）分隔层级形成路径。例如，`user` 字段下的 `created_at` 子字段被引用为\
  \ `user.created_at`，当我们使用 JSON 格式的数据创建搜索时，也将以这种方式引用字段。\n\n![9781430257615_Fig12-02.jpg](img/9781430257615_Fig12-02.jpg)\n\
  \n图 12-2. 用户界面中列出的 JSON 事件\n\n事件本身按字母顺序显示字段，并带有正确的 Splunk 时间戳，该时间戳与 `__time` 字段匹配。此外，第一个事件是我们测试文件中的最后一个事件。您可能还记得，Splunk\
  \ 按从最新到最旧的顺序显示事件，所以这是正确的，因为我们的测试文件是从最早到最新排列的。您还会注意到事件以 `{[-]` 开头。如果您点击减号，Splunk\
  \ 会折叠该层级显示的信息；这与点击 `{[+]}` 中的加号效果相反，点击加号会展开显示所选字段的所有子字段。注意，`entities`、`retweeted_status`\
  \ 和 `user` 字段提供了展开查看其子字段的选项。在列出的事件底部，有一个以原始文本形式显示事件的链接。点击此链接后，事件将如图 12-1 所示的方式呈现。\n\
  \n另外需要注意的一点是，左侧边栏中的字段（例如 `id` 和 `user.created_at`）计数为 88。这是因为在 100 个事件中，有 88 个是推文，12\
  \ 个是删除事件。最后，侧边栏上的 `source` 字段显示计数为 31，这看起来是错误的，因为只有一个源文件。当您查看列出的事件末尾时，会发现有两个 `source`\
  \ 项，一个正确显示了包含我们刚索引的测试事件的文件名，另一个则包含了来自推文的 `source` 字段内容。不可否认，这会造成混淆，因为 Splunk 处理着两个同名字段，但能够区分它们之间的某种差异。我们将在本章后面介绍\
  \ `spath` 命令时详细讨论这个问题。\n\n除了 `source` 字段造成的混淆情况之外，使用推文测试文件进行的索引似乎已成功，一切正常。接下来，我们将删除刚刚加载的\
  \ 100 个事件，然后索引包含近 500 万条推文的完整文件。\n\n## 推特中的一天\n\n使用我们刚刚索引的包含近 500 万个事件的文件，我们对这些推文进行一次历史分析。为了熟悉\
  \ JSON 的字段表示法，让我们先从统计收集到的文件中删除事件的数量开始：\n\n```\n* | stats count(delete.status.id)\n\
  ```\n\n直接搜索单词“delete”很诱人，但如果这个词出现在推文的任何字段中，我们就会得到不正确的计数。这就是为什么我们选择统计删除结构中一个唯一的字段。任何字段都可以；我们选择了\
  \ `id` 子字段，这样当事件中存在该字段时，我们就能确定它是一个删除事件。总计数为 493,382，约占数据流的 10% 以上；这说明有大量的人在改变主意。\n\
  \n接下来，我们想了解一天中每个小时的推文数量。无论数据格式如何，这个搜索都非常简单，因为我们只需统计事件数量：\n\n```\n* | stats count\
  \ by date_hour\n```\n\n`date_hour` 字段是 Splunk 中一组名为“日期时间”字段中的默认字段，这些字段为事件时间戳提供了更细的粒度。它们还包括\
  \ `date_minute`、`date_month`、`date_second`、`date_wday`、`date_year` 和 `date_zone`。此命令的输出以图表形式呈现在图\
  \ 12-3 中。请注意，*y* 轴起点为 140,000，而非 0。\n\n![9781430257615_Fig12-03.jpg](img/9781430257615_Fig12-03.jpg)\n\
  \n图 12-3. 一天中每个小时的推文数量\n\n\n\n您必须记住，Twitter 是一种全球现象，因此当我们统计推文时，它们遍布世界各地。如之前所述，时间戳基于\
  \ UTC 时区。推文数量最多的时段是下午 3 点，共计 241,995 条。结合具体背景来看，下午 3 点对应伦敦时间上午 10 点、纽约时间早上 7 点、旧金山时间早上\
  \ 4 点，以及东京时间的午夜（即新一天的开始）。还要注意，我们的样本数据从 1 月 4 日（周五）15:00 开始，因此图表应合理地从 15 点而不是 0 点开始，以呈现真实情况。遗憾的是，Splunk\
  \ 的图表选项并不提供决定坐标轴起始值的功能。\n\n在稍有差异的搜索中，我们使用`time_zone`和`utc_offset`这两个可用字段，按时区查看推文数量。这些字段属于用户对象的一部分，且如前所述，它们由用户定义，或者使用用户所使用的\
  \ App 的默认值。如果正确填写，它们通常指向用户的主要地理位置。我们发现，许多人在处理这两个字段时会感到困惑。一个时区可以有多个名称——毕竟时区从北极一直延伸到南极——因此`time_zone`字段的前五名是关于最常用的时区名称，而`utc_offset`字段则是关于实际时区偏移。表\
  \ 12-1 展示了按两个字段分别统计的前五名推文数量。\n\n表 12-1. 每小时区推文数量\n\n![Table12-1.jpg](img/Table12-1.jpg)\n\
  \n令人惊讶的是，两个字段中最受欢迎的时区都是空值，占比超过 27%。推文数量最多的时区名称是美国中部时区；然而，推文数量最多的实际时区偏移是 UTC-5 小时，这对应以下时区名称：东部时间（美国和加拿大）、印第安纳州（东部）、波哥大、利马和基多。要获取按\
  \ UTC 偏移量分组的时区名称列表，只需使用以下搜索：\n\n```\n* | stats values(user.time_zone) by user.utc_offset\n\
  ```\n\n您会发现，某些时区关联了大量的名称；例如，UTC+1 小时有 20 个名称，基本上都是欧洲国家首都的名称。请注意，尽管大多数偏移量基于整小时，但也有少数偏移量为\
  \ 30 或 45 分钟，最著名的是印度，偏移量为 UTC+5 小时 30 分钟，有四个时区名称：金奈、加尔各答、孟买和新德里。\n\n现在，让我们看看推文的语言。情况相当不明确，因为我们处理的是两个字段：一个是在高层级上，截至本文撰写时，Twitter\
  \ 并未对其文档化（但我们推测这是对推文语言的最佳猜测），另一个是作为用户结构一部分的`lang`字段。后者是用户所用 App 声明的语言，或者也可能是该 App\
  \ 的默认语言。我们对前 20 个这两个字段内容不同的事件进行了搜索，发现有 8 个事件符合这种情况。如果算上这 20 个事件中有 2 个是删除事件，那么比例几乎达到\
  \ 50%。仔细检查这 8 个事件的实际推文（`text`字段）语言，发现 5 条语言正确，2 条错误，还有 1 条没有足够的文本来猜测其语言，因为它只包含“@username\
  \ (Y)”。\n\n使用以下搜索来查找有多少事件的`text`字段语言与用户配置文件中定义的语言不同，我们得到 1,271,427 个事件，分布在 801 种不同的语言组合中。这几乎占推文总数的\
  \ 30%。有趣的是，其中约有 21%的推文将用户语言定义为英语，但推文语言被标记为印度尼西亚语。\n\n```\n* | rename user.lang as\
  \ tweet_user_lang\n| where tweet_user_lang != lang\n| stats count by tweet_user_lang,\
  \ lang\n```\n\n![image](img/sq.jpg) **注意**   在处理基于 JSON 的事件时，使用`eval`和`where`命令要小心。它们会将点号（`.`）解释为连接运算符。为避免这种情况，您可以将\
  \ JSON 字段路径用单引号（`'`）括起来，或者重命名字段。我们认为重命名字段是最佳实践。\n\n我们还注意到，在这些结果中，约有 81,000 个事件的推文语言代码为“und”，我们推测这表示未确定。尝试猜测某些文本的语言，尤其是当文本像推文一样短时，是一项困难的任务，尤其是在当今多种语言混合使用变得越来越普遍的情况下。一些具有有趣名称的语言组合，如\
  \ Spanglish（西班牙语和英语混合）、Portuñol（葡萄牙语和西班牙语混合）、Frarabic（法语和阿拉伯语混合）、Hinglish（印地语和英语混合）等，使得这项任务更具挑战性。对于这一点，我们只能说，您应该极其谨慎地处理推文语言的分析。\n\
  \n另一个内容有问题的字段是`location`。这个字段由用户提供，我们见过它从城市名称变成“@username 的心底”，以及介于两者之间和超出想象的各种内容。`location`并不是一个可以用于任何严肃分析的字段。一些\
  \ Twitter 的 App 提供在其推文上附加地理位置信息的功能，即以经纬度形式附加推文的位置。这个字段是`coordinates`。还有另一个称为`place`的字段，它允许包含地址和边界框（地理坐标的多边形）。目前这些字段并未被广泛使用。我们快速搜索后发现，样本中约有\
  \ 1.5%的推文带有地理位置信息。我们将在第 13 章中介绍如何处理地理位置数据。\n\n有三个字段提供了有趣的信息，而且相当直观：`followers_count`、`friends_count`和`statuses_count`。它们是用户对象的一部分，由\
  \ Twitter 为每条推文计算得出。搜索拥有最多关注者、关注最多用户或拥有最多推文的用户极其简单。唯一需要非常注意的是，这些指标是非常动态的，因此您必须使用最新的推文才能获得最准确的结果。和往常一样，我们建议您在制定搜索时非常谨慎。在分析的这段时间内推文最多的用户与历史上推文最多的用户之间存在巨大差异。对于第一种情况，您可以使用以下搜索：\n\
  \n```\n* | top user.screen_name\n```\n\n对于第二种情况，您可以使用如下搜索：\n\n```\n* | stats max(user.statuses_count)\
  \ as max_count by user.screen_name\n| sort - max_count\n```\n\n在第一个搜索中，我们仅根据已有的数据按用户统计事件。在第二个搜索中，我们寻找每个用户的最大推文计数，因为该数字会随每条推文而变化。对于第一个搜索，我们得到`favstar_bot`（一个机器人）是推文最多的用户，有\
  \ 31 条；而对于第二个搜索，我们得到`Yougakudan_00`（日本的另一个机器人），其推文数量远超 3600 万条。\n\n用于统计关注者和朋友数量的搜索也同样简单。当我们按关注者数量进行搜索时，我们在本章开头提到的前三名用户都没有出现在结果中。如果某个用户在样本期间内没有发布推文，该用户就不会出现在结果中，而上述三位用户在该期间内都没有发布推文。我们得到的关注者最多的用户是金·卡戴珊，拥有\
  \ 17,084,687 名关注者。\n\n最热门词汇\n\n\n\n## 分词与停用词过滤\n\n对于下一次搜索，我们希望找出推文中最流行的单词。我们将使用几个新命令来实现这一目标。主要思路是将文本字段分解为多值字段，其中每个值都是一个独立的单词。我们将单词定义为由两个空格包围的任何内容。完成这一步后，我们就可以继续对单词进行计数。第一个命令`makemv`接收一个字段，并使用空格作为默认分隔符将其转换为多值字段。由于\
  \ Splunk 将所有内容视为事件，我们将使用`mvexpand`将多值字段的每个值转换为独立的事件。我们首先只使用一条推文测试搜索，这样便于我们计数单词并确保其工作正常。下一步是使用前\
  \ 200 条事件进行搜索，以了解结果的大致情况：\n\n```\n* | head 200\n| makemv text\n| mvexpand text\n\
  | top text\n```\n\n此搜索的输出如图 12-4 所示。毫不意外，前 200 条推文中出现最多的单词是`RT`，其计数是排名第二的单词`\"to\"\
  `的两倍多。你还可以看到，大多数单词是英语和西班牙语中的介词、名词或代词，这些通常被视为非信息性词汇。我们需要的是更具实质内容的结果。一种方法是创建一个要从结果中排除的单词列表。这通常被称为停用词列表，在互联网上可以找到很多。我们需要考虑停用词列表的语言。我们创建了一个仅包含\
  \ 44 个英语单词的简单停用词列表，并将只关注英语推文。\n\n![9781430257615_Fig12-04.jpg](img/9781430257615_Fig12-04.jpg)\n\
  \n图 12-4 前 200 条推文中出现最多的单词\n\n为了说明如何构建排除停用词列表中的单词的搜索，我们将使用一个查找表。你已经在第 11 章中了解了如何使用查找表，但这次我们将以略有不同的方式使用它们。第一步是创建一个简单的文件，每行一个单词，并记得包含一个标题行。在此示例中，我们将在标题行中使用`Word`作为字段名称。下一步是定义一个查找表，我们将其命名为`StopWords.csv`。该文件可在本书的下载包中找到。请注意，我们使用了`csv`扩展名，尽管该文件在技术上不包含逗号分隔值，只有一列。无需创建查找定义，因为`inputlookup`命令接受文件名或表名作为参数。此命令将查找表的内容作为搜索结果加载。将所有内容组合在一起，搜索如下所示：\n\
  \n```\nlang=en\n| makemv text\n| mvexpand text\n| search text NOT\n  [\n    | inputlookup\
  \ StopWords.csv | rename Word as text\n  ]\n| top text\n```\n\n如你所见，该搜索基于一个子搜索，该子搜索加载所有停用词并将字段重命名为`text`。然后，停用词与我们在前一次搜索中找到的单词一起用于搜索，并结合布尔运算符`NOT`，这意味着我们不想统计那些同时出现在两者中的单词交由`top`命令进行计数。请注意，`NOT`必须大写，Splunk\
  \ 才能将其理解为布尔运算符。另外需要提到的是，你不能在搜索的第一部分重命名`text`字段，因为新字段本身将无法用于第二个`search`命令。\n\n##\
  \ 结果可视化\n\n既然我们在玩单词，我们也将稍微玩转一下结果的可视化。我们使用了 IBM 的 Many Eyes 网站，你可以在该网站上加载数据并尝试多种可视化类型。在尝试了前一次搜索的结果后，我们特别喜欢两种不同的可视化方式：气泡图（如图\
  \ 12-5 所示）和词云（如图 12-6 所示）。这个有趣的网站位于一个相当奇怪的 URL：`http://www-958.ibm.com`。请注意，你上传的任何数据都将被公开。\n\
  \n![9781430257615_Fig12-05.jpg](img/9781430257615_Fig12-05.jpg)\n\n图 12-5 英语推文前\
  \ 10 个单词的气泡图\n\n![9781430257615_Fig12-06.jpg](img/9781430257615_Fig12-06.jpg)\n\n\
  图 12-6 英语推文前 50 个单词的词云\n\n显然，我们使用的停用词列表可以进一步改进，因为前 10 个单词列表中仍然包含许多非信息性词汇。气泡图对于前\
  \ 10 个值效果不错，但它生成的词云相当稀疏，因此我们决定使用前 50 个值，这样可以得到更完整的词云。至此，我们结束了从历史角度审视 Twitter 信息的部分。接下来，我们将分析实时趋势。\n\
  \n## 实时 Twitter 趋势\n\n在 Splunk 的 App 库 Splunkbase 中，你会发现一个 App，它为 Splunk 提供了一个脚本化输入，可以自动从\
  \ Twitter 的 1%样本流中提取推文，并且带有一个炫酷的仪表板：\n\n```\nhttp://splunk-base.splunk.com/apps/56296/twitter-for-splunk\n\
  ```\n\n该 App 最初由 Splunk 的 David Foster 编写。它是免费提供的，并遵循 Apache 2 许可证。你必须拥有有效的 Twitter\
  \ 用户名才能使用此 App；此外，正如我们之前所见，Twitter 样本流每天会产生约 12GB 的数据，因此请确保你的 Splunk 许可证允许索引如此大量的数据。要从\
  \ Splunk 内部安装该 App，请遵循以下步骤：\n\n*   进入管理器，选择 Apps，然后点击“在线查找更多 App”\n*   搜索 Twitter\
  \ App；搜索框位于屏幕的右上方，只需输入`twitter`\n*   找到“Twitter for Splunk”并点击“免费安装”\n*   该 App\
  \ 将被下载，并提示你进行设置。你只需提供你的 Twitter 账户名和密码。如果信息正确，App 将开始运行，并在收集几分钟数据后，展示一个包含六个面板的仪表板，如图\
  \ 12-7 所示：\n    *   热门话题标签——过去 15 分钟\n    *   热门提及——过去 15 分钟\n    *   推文时区——过去 15\
  \ 分钟\n    *   热门用户代理——过去 24 小时\n    *   推文流（所有用户）——实时，过去 30 秒\n    *   推文流（首次用户）——实时，过去\
  \ 1 分钟\n\n![9781430257615_Fig12-07.jpg](img/9781430257615_Fig12-07.jpg)\n\n图 12-7\
  \ Twitter App 仪表板\n\n我们将回顾构成每个面板的搜索，但首先快速评论一下数据收集的方式。该 App 包含一个 Python 程序，它直接从 Twitter\
  \ 的 1%样本流收集数据，并将其索引到一个名为`twitter`的索引中。这被称为脚本化输入，Splunk 不是索引一个文件（一次性）或监控一个目录或 TCP/UDP\
  \ 端口，而是从程序获取数据。如果你有兴趣查看此程序，可以通过导航到“管理器” ➤ “数据输入” ➤ “脚本”找到其位置。该程序有两个版本，一个用于 Unix，另一个用于\
  \ Windows。我们不会审查任何一个程序，因为这超出了本书的范围。与此相关的是，我们在本章开头用于收集 24 小时数据的程序`get1pct.py`，是该\
  \ App 提供的程序的修改版本。\n\n\n\n"
- "# 排版后的内容\n\n仪表板的第一个面板展示了过去 15 分钟内的热门话题标签。基于本章前面构建的热门词汇搜索，我们可以将搜索条件制定为：\n\n```\n\
  index=twitter\n| makemv text\n| mvexpand text\n| eval hashtags = mvfilter(match(text,\
  \ \"#+\"))\n| top hashtags\n```\n\n在此案例中，我们使用`eval`命令提取话题标签。`match`函数将单词与正则表达式`“#+”`进行比较，该表达式表示“以#开头并包含一个或多个字符”。`mvfilter`函数基于布尔表达式（如我们在`match`函数中使用的表达式）对多值字段（例如`text`）进行过滤。综合运用时，`eval`命令会匹配以“#”开头的单词。这个过程相当简单，但\
  \ Twitter 为每条推文关联了一个`entities`对象，使操作更加简便。该对象包含从推文本身（文本字段）提取的元数据，例如：\n\n*   **话题标签**，已从推文文本中解析出来。\n\
  *   **媒体**，是一个综合对象，代表推文中上传的媒体元素，例如照片。\n*   **URL**，包含推文中的原始 URL 以及转换为`t.com`格式的对应\
  \ URL。\n*   **提及**，是推文中提及的其他用户的屏幕名称，即那些以“@”开头且是真实 Twitter 用户的名称。\n\n这些元素中的每一个都包含其在推文中的位置，表示为元素的起始和结束索引。根据元素类型的不同，计数和呈现方式也有所区别。详细信息可参阅\
  \ Twitter 文档。以下是一个包含几个话题标签、一个 URL 和一个提及的`entities`对象示例：\n\n```json\n\"entities\"\
  :{\n  \"user_mentions\":[\n    {\"name\":\"Twitter API\",\n     \"indices\":[4,15],\n\
  \     \"screen_name\":\"twitterapi\",\n     \"id\":6253282,\n     \"id_str\":\"\
  6253282\"}\n  ],\n  \"hashtags\":[\n    {\"indices\":[62,66],\n     \"text\":\"\
  lol\"}\n    {\"indices\":[79,85],\n     \"text\":\"rotfl\"}\n  ],\n  \"urls\":[\n\
  \    {\"indices\":[32,52],\n     \"url\":\" http:\\/\\/t.co\\/IOwBrTZR\",\n    \
  \ \"display_url\":\" youtube.com\\/watch?v=oHg5SJ\\u2026\",\n     \"expanded_url\"\
  :\"http:\\/\\/www.youtube.com\\/watch?v=oHg5SJ\\u2026\"}\n  ]\n}\n```\n\n使用 Twitter\
  \ 的`entities`对象后，查找热门话题标签的搜索条件从之前的变为：\n\n```\nindex=twitter\n| rename entities.hashtags{}.text\
  \ as hashtags\n| fields hashtags\n| mvexpand hashtags\n| top hashtags\n```\n\n如前所述，作为最佳实践，我们建议重命名多级\
  \ JSON 字段，以避免与`eval`和`where`命令产生问题，即使在搜索中未使用这些命令。这样做还有一个好处，即可以输入一个简短的字段名，该字段名也可用作图表的\
  \ Y 轴标签。使用`entities.hashtags{}.text`是 Splunk 中用于 JSON 格式字段的通配符规范，用于获取所有话题标签的文本，而不是逐个指定`entities.hashtags{0}.text`、`entities.hashtags{1}.text`等。使用`fields`命令是为了优化搜索。由于一条推文包含众多字段，我们将除话题标签之外的所有字段都排除掉，因为本搜索中我们只关心话题标签。`mvexpand`命令将多值字段的值扩展为单独的事件，以便`top`命令进行计数。如果您想创建一个面板来监控您感兴趣的话题标签（例如，最近一分钟内），一个可能的搜索条件为：\n\
  \n```\nindex=twitter\n| rename entities.hashtags{}.text as hashtags\n| fields hashtags\n\
  | mvexpand hashtags\n| where like(hashtags, \"your_hashtag\")\n| stats count\n```\n\
  \n您可以将可视化图表更改为径向仪表盘，因为您只展示一个数字，并指定时间范围为“从-1m@m 到现在”。生成的面板示例如图 12-8 所示。\n\n![9781430257615_Fig12-08.jpg](img/9781430257615_Fig12-08.jpg)\n\
  \n图 12-8. 统计特定话题标签\n\n展示热门提及的面板使用与热门话题标签相同的搜索条件，只是将字段名更改为`entities.user_mentions{}.screen_name\
  \ as mentions`。时区面板使用以下搜索条件：\n\n```\nindex=twitter\n| rename user.utc_offset as\
  \ z\n| search z=* z!=null\n| eval z=round(z/3600)\n| stats count by z\n| sort +z\n\
  ```\n\n正如您在本章前面所见，推文中时区为空的占比很高，因此为了避免计算中的问题，使用`search`命令来剔除所有那些推文。请记住`search`命令中隐式的\
  \ AND 布尔逻辑。该计算按整小时分解时区。如前面讨论，有少数时区偏移量为 30 分钟和 45 分钟。除以 3600 会将那些特殊时区的计数归入下一个整小时。我们尝试过移除`eval`命令来可视化结果，但由于时区过多，尝试的不同类型图表都无法清晰显示，因此我们可以称之为实用型时区图表。\n\
  \n下一个面板展示的是热门用户代理，这将使我们有机会介绍几个新命令。用户代理是用来创建推文的应用程序或客户端。对于面向营销的公司来说，这条信息非常有价值，因为它不仅展示了实际的应用程序，通常还包含了其运行的平台。包含此信息的字段是`source`。您可能还记得，在验证索引后的加载数据时，我们在这个字段和\
  \ Splunk 默认字段`source`之间遇到了一些冲突。我们将在解释搜索过程时澄清这些冲突。Twitter 的`source`字段内容与其他字段略有不同，因为在大多数情况下，它包含可以下载该应用程序的\
  \ URL。唯一的例外是当使用 Twitter 网站时，其值仅为“web”。这是一个典型示例：\n\n```\n\"<a href=\\\"http://twitter.com/download/android\\\
  \" rel=\\\"nofollow\\\">Twitter for Android</a>\"\n```\n\n其他应用程序的`source`字段内容具有相同的结构：下载链接的目标地址和应用程序的名称。我们只关心应用程序的名称，如本例中的“Twitter\
  \ for Android”，因此我们必须提出一个正则表达式来提取它，但需要考虑到特殊情况：`\"source\":\"web\"`。我们可以将字段内容分为三部分：第一部分从开头到应用程序的实际名称；第二部分是应用程序的名称；然后是剩余部分。基于此，正则表达式可以是：\n\
  \n```\n(<[^>]*>)?([^<]*)\n```\n\n部分正则表达式的概念在第 9 章的“修改时间戳处理器”中已有介绍。正则表达式的第一个分组（用括号括起来）表示它以“<”开头，后跟零个或多个除“>”之外的任意字符，并且该分组可以出现零次或一次。第二个分组通过简单地声明它可以包含零个或多个除“<”之外的任意字符来捕获应用程序的名称。我们无需关心剩余部分。现在让我们来看一下搜索条件：\n\
  \n```\nindex=twitter\n| spath source\n| fields source\n| rex field=source \"(<[^>]*>)?(?<source>[^<]*)\"\
  \n| top source\n```\n\n\n\n`spath`命令允许您基于 JSON 或 XML 从结构化事件中提取字段。由于本章中的 Twitter\
  \ 事件是完全结构化的 JSON，因此我们无需使用此命令——Splunk 自动使所有字段可用。当事件中包含部分 JSON 或 XML 结构（例如某些日志文件在同一事件中混合纯文本与\
  \ XML 结构）时，此命令主要被使用。在此特定案例中，我们使用`spath`来消除事件中的`source`字段与 Splunk 默认字段`source`之间的歧义。通过使用`spath`命令，我们强制\
  \ Splunk 使用我们想要的`source`字段。我们再次使用`fields`命令，通过将搜索的其余部分限制为此字段来提高性能。\n\n`rex`命令用于基于正则表达式提取字段。请注意，我们已修改正则表达式，在第二个分组的开头添加了`?<source>`。在`rex`命令中，这意味着该分组匹配的内容将被放入名为`source`的字段中。在普通的正则表达式解析器中，每个分组的匹配结果会作为$1、$2\
  \ 等形式可用。而在 Splunk 的`rex`命令中，分组的匹配结果可以放入在分组开头使用`?<field_name>`语法定义的字段中。这是一个非常方便的\
  \ Splunk 特性。\n\n显示此搜索结果的饼图见图 12-7。它显示大多数客户端来自 Web，占比超过 26%，紧随其后的是 iPhone 和 Android\
  \ 应用程序，各约占 23%，然后是 BlackBerry 应用程序，约占 16%。随着 Android 和 iOS 设备的兴起，我们决定为了更深入地理解这一现象，将基于时区名称分析\
  \ BlackBerry 设备的地理位置。为此，我们制定了一个搜索，并在本章前面处理过的 24 小时文件上运行，因为该文件包含的推文比我们通过实时应用收集的要多。排除那些没有时区的推文（如前所述，这些推文占比超过\
  \ 27%），我们查看了推文数量达到 15,000 条或更多的时区名称。这些是排名前六的时区，如表 12-2 所示。我们最初的预期是大多数 BlackBerry\
  \ 手机会集中在某些海外地区，但您可以看到，前六名中有三个在美国，且超过一半在美国。\n\n**表 12-2. 排名前六的 BlackBerry 时区**\n\n\
  | 时区 | 数量 |\n| --- | --- |\n| 太平洋时间（美国及加拿大） | 74,607 |\n| 曼谷 | 47,761 |\n| 雅加达 |\
  \ 34,064 |\n| 中部时间（美国及加拿大） | 20,636 |\n| 阿姆斯特丹 | 17,743 |\n| 夏威夷 | 17,231 |\n\n\
  仪表板的第五个面板以实时方式显示过去 30 秒的推文文本。这是通过将时间范围指定为“from rt-30s to rt”来实现的。搜索极其简单：\n\n```\n\
  index=twitter text=*\n| table text\n| sort - _time\n```\n\n通过指定`text=*`，我们确保推文的`text`字段包含内容，而`table`命令将所选字段以表格形式呈现。最终使用\
  \ Splunk 内部字段`_time`（单下划线）按降序排序，该字段包含时间戳，与由接入 Twitter 示例流的 Python 程序创建的`__time`字段（双下划线）无关。我们使用`_time`是因为它比使用任何其他可用字段更高效。请注意，以单个下划线符号（`_`）开头的字段通常供\
  \ Splunk 内部使用，但对用户可见。用于显示首条推文的面板的搜索也非常简单：\n\n```\nindex=twitter user.statuses_count=1\n\
  | rename user.screen_name as screenname\n| table screenname text\n| sort -_time\n\
  ```\n\n假设除了跟踪特定标签（hashtag）的数量（如本章前面所示）之外，您还想显示包含该标签的推文。该搜索将是用于统计标签计数的搜索的轻微变体：\n\n\
  ```\nindex=twitter\n| rename entities.hashtags{}.text as hashtags\n| rename user.screen_name\
  \ as account\n| fields account,hashtags,text\n| mvexpand hashtags\n| where like(hashtags,\
  \ \"your_hashtag\")\n| table account, text\n| sort - _time\n```\n\n我们按照最佳实践重命名用户屏幕名称，并将字段限制为我们使用的那些字段以提高性能。一旦找到包含我们正在查找的标签的推文，我们就在用户名旁边显示该推文。\n\
  \n## 总结\n\n在本章中，我们回顾了 Twitter 1%示例流的数据结构、如何收集它，以及如何以实时方式或从历史角度处理它。我们讨论了索引推文的时间戳问题，并探讨了一些关键字段及其内容。我们进行了多项有趣的搜索，从而引入了几个新命令，包括一些专门用于处理多值字段的命令。我们还使用了一个外部工具来创建更适合处理词语和标签的可视化。\n\
  \n## 第 13 章\n\n![image](img/frontdot.jpg)\n\n"
- "# 分析 Foursquare 签到数据\n\n基于位置的服务——尤其是在手机上——正在迅猛发展。随着越来越多支持 GPS 的智能手机投入使用，位置数据为应用带来了一个全新的维度，包括广告、推荐附近商家和天气。在本章中，我们将重点介绍与地理位置相关的一些基本概念。我们还将讨论处理多个时区的复杂性。为此，我们将以\
  \ Foursquare 服务作为示例的基础。\n\nFoursquare 可以被描述为一个以位置为中心的社交网络游戏。它不仅允许您在与朋友分享的地点签到，还能赢得奖励，其中大部分是虚拟的。每次签到都会为您赢得积分。通过积分，您可以获得徽章，这些徽章可以描述为正式的炫耀资本。徽章可以从简单的（如首次在某个场所签到获得的新手徽章）到探险家徽章（在\
  \ 25 个不同的场所签到后获得）不等。还有一些更复杂的徽章，例如在五个不同的机场签到后获得的 JetSetter 徽章，或者在看第十场电影时获得的 Zoetrope\
  \ 徽章。我们不应忘记那些与食物相关的徽章，比如在比萨餐厅签到 20 次获得的 Pizzaiolo 徽章，以及在 Zagat 评级的场所签到五次后获得的 Foodie\
  \ 徽章。徽章列表非常长且不断变化，许多徽章由企业推广，例如基于 Zagat 的徽章。\n\n另一个被认为重要的炫耀资本是成为某个场所的“市长”，这需要成为过去\
  \ 60 天内在该特定位置签到次数最多的人。这个身份在非常热门的场所可能会被激烈争夺。Foursquare 的另一个功能是用户能够留下关于某个场所的提示或评价，这些内容可以被其他用户看到。\n\
  \n我们尚未完全描述 Foursquare 提供的所有功能，但您能很快意识到其商业潜力。从企业通过给场所市长提供免费饮品或特别折扣来与客户互动，再到推广新产品或地点的完整营销活动，可能性是无限的。Foursquare\
  \ 网站上有一些很好的案例研究，展示了企业如何接触并与人们互动。\n\n\n\n类似地，越来越多的“混搭”应用（`mashups`）正在涌现，它们将两个或多个来源的数据或功能结合起来，以创建新的服务。在这种情况下，`mashups`获取`Foursquare`数据，并将其与`Twitter`、`LinkedIn`、`YouTube`、`Flickr`等其他服务或应用相结合。还有一些应用是构建在`Foursquare\
  \ API`之上的，例如`4sqwifi App`，它可以找到附近有`Wi-Fi`的场所并提供其密码。这个特定的应用利用了用户生成的场地小贴士来提供部分信息。\n\
  \n`Foursquare API`包含两个基本功能：核心`API`（`core API`）和实时`API`（`real-time API`）。核心`API`允许应用或混搭程序执行所有可以通过`Foursquare`提供的移动应用或其网站完成的操作。实时`API`提供两种推送通知：场地推送（`venue\
  \ push`），当用户签到其管理的场地时通知场地管理者；以及用户推送（`user push`），当使用其应用的用户在任何地方签到时通知开发者。\n\n## 签到格式\n\
  \n由实时`API`生成的签到基于`JSON`格式。回想一下第 12 章首次介绍`JSON`时的内容，它通过使用花括号“`{}`”定义多级结构，并使用方括号“`[]`”为字段提供多个值。同时请记住，字段并不总是以相同的顺序出现，并且并非所有字段都会出现在每次签到中。在高层次上，由用户推送`API`生成的典型签到与由场地推送`API`生成的签到几乎相同。以`Foursquare`总部作为签到的示例场地，其格式如下：\n\
  \n```\n{\n\"checkin\": {\n   \"id\": \"4e6fe1404b90c00032eeac34\",\n   \"createdAt\"\
  : 1315955008,\n   \"type\": \"checkin\",\n   \"timeZone\": \"America/New_York\"\
  ,\n   \"user\": {[+]},\n   \"venue\": {\n      \"id\": \"4ab7e57cf964a5205f7b20e3\"\
  ,\n      \"name\": \"foursquare HQ\",\n      \"contact\": {\n          \"twitter\"\
  : \"foursquare\"\n      },\n      \"location\": {[+]},\n      \"categories\": [+],\n\
  \      \"verified\": true,\n      \"stats\": {[+]},\n      \"url\":http://foursquare.com\n\
  \   }\n}\n```\n\n我们将回顾此结构中最重要的字段。首先是签到创建的时间，它是一个`Unix`时间戳，然后是时区名称。这两个字段非常重要，我们将在讨论如何将数据加载到`Splunk`时重点关注。接下来是`user`字段，使用`Splunk`的符号表示该字段可以展开为另一个层级。展开此字段后，其内容如下：\n\
  \n```\n\"user\": {\n   \"id\": \"1\",\n   \"firstName\": \"Jimmy\",\n   \"lastName\"\
  : \"Foursquare\",\n   \"photo\": \"https://foursquare.com/img/blank_boy.png\",\n\
  \   \"gender\": \"male\",\n   \"homeCity\": \"New York, NY\",\n   \"relationship\"\
  : \"self\"\n},\n```\n\n`gender`字段可以有三个值：`female`、`male`和`none`。接下来是`venue`字段，它是签到的核心，特别是`location`和`categories`字段。让我们回顾一下`location`字段：\n\
  \n```\n\"location\": {\n   \"address\": \"East Village\",\n   \"lat\": 40.72809214560253,\n\
  \   \"lng\": -73.99112284183502,\n   \"city\": \"New York\",\n   \"state\": \"NY\"\
  ,\n   \"postalCode\": \"10003\",\n   \"country\": \"USA\"\n},\n```\n\n很高兴`Foursquare`提供了如此丰富的定位信息，特别是当移动设备仅发送签到地点的纬度和经度时。其余信息是通过一个称为“反向地理编码”（`reverse\
  \ geocoding`）的过程生成的，我们将在本章后面进行解释。`categories`字段展开如下：\n\n```\n\"categories\": [\n\
  \   {\n      \"id\": \"4bf58dd8d48988d125941735\",\n      \"name\": \"Tech Startup\"\
  ,\n      \"pluralName\": \"Tech Startups\",\n      \"shortName\": \"Tech Startup\"\
  ,\n      \"icon\": \"https://foursquare.com/img/categories/building/default.png\"\
  ,\n      \"parents\": [\n         \"Professional & Other Places\",\n         \"\
  Offices\"\n      ],\n      \"primary\": true\n   }\n],\n```\n\n与`Twitter`不同，`Foursquare`不提供包含所有签到数据的“消防水管”流（`firehose`），甚至不提供签到样本流。这种情况让我们陷入了困境，因为我们希望说明如何处理这些数据。一个选择是创建一个使用`Foursquare\
  \ API`的应用，专注于提供一些面向用户的功能或管理场地的功能，但这超出了本书的范围。因此，我们决定基于真实的场地创建一组模拟的、但非常逼真的签到数据，并将其用作本项目的基础。为简化起见，我们创建的数据结构是之前描述的官方`Foursquare`结构的一个子集：\n\
  \n```\n{\n\"checkin\": {\n   \"id\": \"4e6fe1404b90c00032eeac34\",\n   \"createdAt\"\
  : 1315955008,\n   \"timeZone\": \"America/New_York\",\n   \"user\": {\n      \"\
  gender\":\"male\"\n   },\n   \"venue\": {\n      \"id\": \"4ab7e57cf964a5205f7b20e3\"\
  ,\n      \"name\": \"foursquare HQ\",\n      \"location\": {\n         \"lat\":\
  \ 40.72809214560253,\n         \"lng\": -73.99112284183502\n      },\n      \"categories\"\
  : {\n         \"id\": \"4bf58dd8d48988d125941735\",\n         \"name\": \"Tech Startups\"\
  ,\n         \"fullName\": \"Professional & Other Places:Offices:Tech Startups\"\
  ,\n         \"icon\": \"https://foursquare.com/img/categories/building/default.png\"\
  ,\n      }\n   }\n}\n}\n```\n\n请注意，我们将原始格式中的`parents`字段和`pluralName`字段合并为一个新字段，称为`fullName`，每个值之间用冒号（`:`）分隔。`Foursquare`中定义的类别最多可以有三级，如本示例所示。`Foursquare`类别的完整列表可以在`http://aboutfoursquare/foursquare-categories`找到。\n\
  \n使用这种简化格式，我们创建了两组签到数据：一组用于纽约地区，包含`541,238`次签到；另一组用于旧金山湾区，包含`271,662`次签到。两组数据的时间跨度均为一个星期，从协调世界时（`UTC`）4\
  \ 月 6 日星期六午夜开始，到 4 月 12 日星期五`23:59:59`结束。这些文件，以及它们各仅包含`10,000`次签到的较小版本，都可以作为本书下载包的一部分获取。\n\
  \n签到数据使用`Unix`时间戳，这隐含地意味着它们使用`UTC`时区，这将使我们能够讨论一些与时区处理相关的有趣问题。我们将在本章后面进行讨论，但首先我们将讨论反向地理编码。\n\
  \n## 反向地理编码\n\n反向地理编码是将由纬度和经度定义的点位置转换为人类可读地址的过程。尽管这看起来很简单，但它实际上是一个相当复杂且计算密集的过程。虽然我们不会详细讨论如何创建这样一个应用，但反向地理编码非常重要，值得我们解释其基本原理。\n\
  \n纬度（`Latitude`）被定义为某地点在赤道以北或以南的角距离，即平行于赤道的假想线。在北时，距离用正数或简单使用单词`north`表示，而负数或单词`south`表示赤道以南的距离。类似地，经度（`Longitude`）被定义为某地点在英格兰格林威治以东或以西的角距离。这定义了一组从北极到南极的假想线，称为子午线（`meridians`），其中格林威治的子午线被称为本初子午线（`meridian\
  \ zero`）。在本初子午线以东，使用单词`east`或正数；在本初子午线以西，则使用单词`west`或负数来表示位置。\n\n\n\n请注意，以下译文仅保留原文核心信息，并按照\
  \ Markdown 规范进行了格式排版。译文末尾的代码块格式已按规则修正，所有变量、函数、路径、命令等均已添加反引号。\n\n---\n\n请注意，这两个定义都指的是角距离。这是因为地球是一个球体，尽管并非完美——两极略扁；因此，专家将其描述为扁椭球体。纬度和经度以度、分、秒表示，例如纽约市中心位于\
  \ 40° 44’ 27.6498”，−74° 0’ 14.0616”，而南非开普敦市中心位于 −33° 51’ 40.6548”，18° 24’ 56.9982”。可以想象，用这类数字进行数学计算非常困难，因此存在一种用于度、分、秒的十进制表示法。将这些地理位置转换为数字格式后（互联网上有大量转换工具），纽约市中心位于\
  \ 40.741014，−74.003906，开普敦位于 −33.861293，18.415833。虽然海事和航空导航图仍使用度、分、秒格式，但 GPS 系统主要使用十进制表示法。\n\
  \n既然你已经有了经纬度（始终按此顺序提供），你可能对以下事项感兴趣：\n\n- 最近的地址，即根据相应国家规则确定的正式地址\n- 最近的十字路口，定义为最近的街道和交叉的下一条街道\n\
  - 指定半径内的附近邮政编码\n- 最近的气象站及其最新的气象观测数据\n- 国家或国家行政区域；例如，英国的萨里郡或美国的加利福尼亚州\n- 时区，其边界通常由政治因素决定，不一定基于子午线\n\
  - 或许对于 Foursquare 这类服务最重要的，是指定半径内的附近地点\n\n“最近”（`nearest`）和“附近”（`nearby`）这两个简单的词完全掩盖了计算这些项目所涉及的复杂性，这种计算通常基于哈弗辛公式（Haversine\
  \ formula）。该公式用于计算两个指定经纬度点之间的距离和方位角。公式中包含大量三角运算，即大量的 `sin`、`cos` 和 `atang` 函数，而且这还不够——角度必须以弧度给出。如你所见，这是一个相当复杂的命题，此外还需要一个包含地点、街道、气象站、城市、国家、时区或你所寻找的任何内容的数据库。\n\
  \n一个看似简单的“最近地址”也需要计算一个半径，然后将其与数据库进行比较，以确定哪条记录距离当前位置最近。例如，Splunk 总部的地址是旧金山布兰南街 250\
  \ 号，在各种数据库中显示为 37.783007，−122.391184，这很可能是大楼的入口。现在考虑有人签到参加 Splunk 总部会议室举办的 Splunk\
  \ 开发者论坛活动，其地理位置为 37.782971，−122.390935；这是一个不同的经纬度对，也称为位置对。如果会议室足够大，坐在会议室两侧的人会产生不同的位置对。此外，更复杂的是，位置对不包含海拔信息。因此，你可能会在\
  \ 20 楼公寓的客厅里，而最近的位置却是你所在大楼一楼的酒吧。\n\n试图判断一个位置对是否位于某个邮政编码或城市的边界内则更为复杂，因为这类边界通常是不规则的。它们以多边形表示，而计算一个位置对是否位于多边形内远比计算一个半径复杂。\n\
  \n现在你应该理解为什么我们如此感激 Foursquare 处理位置对并提供地址（包括邮政编码）了。你也可以看出，为提供附近地点推荐以及其他用户留下的建议，背后凝聚了多少努力。\n\
  \n如果你的项目需要使用反向地理编码，有两种选择可以考虑。第一种是使用商业服务，它们根据你发送的位置对提供所需信息。第二种是编写自己的反向地理编码应用程序。在这种情况下，你可以使用几乎每日更新的商业数据库，或者使用往往不够准确且通常过时的免费数据库。互联网上有大量免费的反向地理编码服务，但所有这些服务都有使用限制，主要是每日可处理的位置对数量。\n\
  \n## 时区考量\n\n如前所述，我们有两个签到数据文件，一个用于纽约大都会区，另一个用于旧金山湾区。这两个区域位于不同的时区，而签到数据使用 Unix 时间戳记录创建时间。Unix\
  \ 时间戳基于 UTC（协调世界时，Coordinated Universal Time）时区，该时区位于格林威治子午线，因此有时也被称为格林威治平均时（GMT）。UTC\
  \ 是 GMT 的继任者，但两者本质相同，你会看到它们被互换使用。我们提出这一点，是因为我们需要正确处理时区，才能在我们将要进行的分析中获得正确的结果。\n\n\
  鉴于我们将要分析的数据类型，时区是一个重要的考量因素，因为地点的签到模式需要反映对应位置的适当时间。假设我们要分析纽约和旧金山的周日早午餐模式，并定义周日早午餐从上午\
  \ 11:00 开始。这意味着对纽约来说，这将是 15:00 GMT，而对旧金山来说则是 18:00 GMT。当然，这取决于夏令时是否生效。为了就如何处理时区做出更好的决策，我们需要理解\
  \ Splunk 在索引事件时对时区分配的优先级规则：\n\n1.  Splunk 使用事件中指定的任何时区，例如 `PST` 或 `-0800`\n2.  Splunk\
  \ 使用属性文件中定义的 `TZ` 属性。这是将特定主机、source 或 sourcetype 与时区关联起来的好方法\n3.  如果以上规则均不适用，Splunk\
  \ 将分配索引该事件的服务器所在的时区\n\n尽管签到事件确实包含一个单独的时区字段，但 Splunk 会忽略它，因为它将 `createdAt` 字段识别为\
  \ Unix 时间戳；因此，时区自动设置为 GMT。当使用 Unix 时间戳时，不能通过 `TZ` 属性更改时区。这意味着我们必须根据当地时间与 GMT 之间的差值来计算一天中的当地时间。\n\
  \n由于签到事件包含 `timeZone` 字段，在将数据加载到 Splunk 时，我们在如何处理时区方面有几个选择。第一个选项是，我们可以将两个数据集加载到同一个索引中，然后在搜索过程中处理时区问题；也就是说，每次我们想将搜索范围缩小到某个大都会区时，我们都需要在搜索开头指定时区，例如：\n\
  \n```\ncheckin.timeZone=\"America/New_York\" | . . . \n```\n\n\n\n这个操作本身很容易，但将两个数据集合并到同一个索引中的问题在于，当进行搜索时（例如本章前面提到的周日早午餐示例），处理不同的时间会变得困难。第二种方案是将每个数据集加载到不同的索引中，然后在进行覆盖两个都会区的搜索时将两者合并。这种方法似乎更容易处理，因为可以使用\
  \ `search` 命令的 `earliest` 和 `latest` 属性来选择时间和日期。两个索引的数据可以通过 `append` 命令结合子搜索合并，但必须注意子搜索返回的结果数量有限制，目前是\
  \ 50,000 条。通常这不成问题，因为子搜索返回的是聚合信息，通常远小于该限制。\n\n## 加载签到数据\n\n我们先创建两个索引，分别命名为 `ny`\
  \ 和 `sf`。和往常一样，我们在用户界面的新数据输入选项中选择数据预览。由于 Splunk 没有预设的 Foursquare 源类型，我们需要创建一个新的源类型。在选择要处理的文件后，我们注意到\
  \ Splunk 已经正确分割了每个事件，并且也已找到 Unix 时间戳，因此我们甚至无需再定义其位置，如图 Figure 13-1 所示。\n\n![9781430257615_Fig13-01.jpg](img/9781430257615_Fig13-01.jpg)\n\
  \n图 13-1. 定义 Foursquare 源类型\n\n如 图 13-1 所示，第一个事件的时间戳为 2013 年 4 月 5 日下午 5:00:00.000，这是一个早于我们数据起始时间（4\
  \ 月 6 日星期六午夜）的日期和时间。这引发了一个问题，因为该第一个事件的 Unix 时间戳 1365206400 转换后为 2013 年 4 月 6 日星期六\
  \ 00:00:00 GMT，这与 Splunk 在数据预览中显示的结果不同。\n\n造成这种差异的原因是 Splunk 会以 Splunk 用户所设置的时区来显示事件时间戳，在我们的案例中是美国太平洋时区。两者相差七小时是合理的，因为\
  \ GMT/UTC 不会因夏令时改变。Splunk 用户的时区可以在用户界面“管理器”选项卡中的“您的账户”下进行修改。\n\n![image](img/sq.jpg)\
  \ **注意** 使用 Unix 时间戳时，默认的日期时间字段（如 `date_hour`、`date_mday` 等）包含的信息基于 GMT/UTC 时区，而非\
  \ Splunk 用户时区。\n\n由于一切看起来都正确，我们继续以名称 `foursquare` 保存新的源类型，并将纽约数据加载到 `ny` 索引中。将旧金山数据加载到\
  \ `sf` 索引则更为简单，因为我们无需再定义新的源类型，只需使用已定义好的 `foursquare` 即可，因此也无需进行预览。\n\n下一步是验证数据是否已正确索引。首先，我们通过查看索引活动概览屏幕来检查已索引的事件数量，如图\
  \ Figure 13-2 所示。在该图中，我们可以看到每个索引的事件计数与我们原始数据集中的签到数量相符。这些信息不会显示在“摘要”选项卡中，因为该选项卡仅显示主索引（或默认索引）的信息。\n\
  \n![9781430257615_Fig13-02.jpg](img/9781430257615_Fig13-02.jpg)\n\n图 13-2. 索引活动概览屏幕\n\
  \n现在我们来检查事件。我们需要确认几件事，例如验证 `createdAt` 字段中的 Unix 时间戳是否与 Splunk 显示的时间戳一致。我们还希望看到左侧边栏中出现正确的字段，并且每个事件末尾的主机、源类型和源文件信息也正确显示。要显示几个事件，只需输入以下搜索命令\
  \ `index=ny | head`，该命令生成的输出可部分见于 图 13-3。时间戳显示正确，构成签到事件的 13 个字段都出现在左侧，并包含适当的信息。每个事件底部的字段也显示了适当的信息。至此，我们可以确信数据已正确加载到\
  \ Splunk 中。我们成功地对旧金山数据重复了相同的验证过程。此阶段完成后，我们就可以开始分析了。\n\n![9781430257615_Fig13-03.jpg](img/9781430257615_Fig13-03.jpg)\n\
  \n图 13-3. 验证 Foursquare 签到事件\n\n## 分析签到数据\n\n在本节中，我们将制定一系列搜索，涉及时区处理、地理定位，以及一些会暴露某些搜索命令局限性的复杂搜索。我们还将讨论一些可视化项目。我们将从本章前面提到的周日早午餐搜索开始。\n\
  \n### 周日早午餐搜索\n\n通过这个搜索，我们试图比较纽约和旧金山都会区最受欢迎的周日早午餐地点。这个搜索存在两个挑战。第一个是我们需要处理来自两个不同索引的事件，第二个是我们需要处理两个不同的时区。如果我们定义早午餐为当地时间上午\
  \ 11:00 到下午 2:00 之间的美食场所签到，那么我们就需要用不同的当地时间执行相同的搜索。我们先来制定针对纽约的搜索，需要指定正确的日期、时间和场所。\n\
  \n处理本地时间有两种方法。第一种方法是使用默认的 `datetime` 字段，我们已经知道这些字段基于 GMT 时区。考虑到纽约与 GMT 在该年该时段的时差为四小时，我们需要的是\
  \ 2013 年 4 月 7 日星期日 GMT 时间 15:00:00 到 17:59:59 之间的事件。使用 `datetime` 字段，搜索的第一个子句为：\n\
  \n```\nindex=ny date_wday=sunday date_hour>=15 date_hour<18\n```\n\n请记住，`search`\
  \ 命令中隐含了 AND 逻辑。这个子句适用于我们的数据集，因为我们的数据中只有一个周日，并且时间不会跨越两天。另一种更通用且能覆盖我们刚才解释的 `datetime`\
  \ 字段局限性的方法，是使用 `search` 命令的 `earliest` 和 `latest` 属性。\n\n![image](img/sq.jpg) **注意**\
  \ `search` 命令的 `earliest` 和 `latest` 属性基于 Splunk 用户的时区，而非数据的时区。\n\n请记住，`latest`\
  \ 属性是排他性的。使用这些属性时，由于我们已知 Splunk 用户的时区是美国太平洋时区，那么纽约上午 11:00 对应加利福尼亚的上午 8:00，因此搜索的第一个子句为：\n\
  \n```\nindex=ny earliest=4/7/2013:08:00:00 latest=4/7/2013:11:00:00\n```\n\n\n\n\
  \n下一个问题是，我们应该搜索哪些类别。分析完前面提到的 `aboutfoursquare.com` 网站上的类别列表后，我们可以在 `checkin.venue.categories.name`\
  \ 字段中查找单词 `Restaurant`，但这会排除诸如百吉饼店和面包店之类的地点。另一种选择是在 `checkin.venue.categories.fullName`\
  \ 字段中查找单词 `Food`；这样我们就可以捕捉到所有与食品相关的场馆。该字段的典型条目类似于 “`Food:American Restaurants`”，因此我们必须确保指定匹配字段开头的单词\
  \ `Food`，后跟任何其他内容。初始搜索如下所示，输出结果见图 13-4。\n\n```\nindex=ny earliest=4/7/2013:08:00:00\
  \ latest=4/7/2013:11:00:00\n| rename checkin.venue.categories.fullName as Type\n\
  | where like(Type, \"Food%\")\n| top Type\n```\n\n![9781430257615_Fig13-04.jpg](img/9781430257615_Fig13-04.jpg)\n\
  \n图 13-4. 纽约市周日早午餐十大热门场馆类别\n\n请注意，`like` 函数使用了 SQL 表示法 `%`，这意味着任意字符出现任意次数。此外，请记住，在使用\
  \ `eval` 或 `where` 命令之前，我们必须重命名多层级 JSON 字段，否则这些命令会将字段中的点解释为连接指令。为了验证此搜索的结果，我们首先随机选择一个事件，并确保它在指定的时间范围内；然后我们验证其中一个餐厅类型的计数是否正确。为了检查一个随机事件，我们将搜索的最后一条子句从\
  \ `top Type` 修改为 `head 1`，这应该会生成该时间范围内最近的事件。在输出中（见图 13-5），你可以看到 Splunk 时间戳是 `4/7/13\
  \ 10:59:58.000 AM`，即纽约时间 `1:59:58 PM`，因此这是正确的。\n\n![9781430257615_Fig13-05.jpg](img/9781430257615_Fig13-05.jpg)\n\
  \n图 13-5. 所选时间段的签到事件示例\n\n为了验证计数，我们制定了一个搜索，仅查找我们感兴趣时间段内最受欢迎的场馆签到 `Coffee Shops`。这是一个非常简单的搜索，基于\
  \ `checkin.venue.categories.name` 字段，而不是我们正在验证的搜索中使用的 `fullName` 字段：\n\n```\nindex=ny\
  \ earliest=4/7/2013:08:00:00 latest=4/7/2013:11:00:00\n         checkin.venue.categories.name=\"\
  Coffee Shops\"\n| stats count\n```\n\n结果是 `787`，与正在验证的搜索结果匹配，因此我们现在知道它是正确的。现在我们有了与食品相关的事件，我们想找到最受欢迎的地点，这可以通过修改搜索的最后一条子句非常容易地完成，如下所示，输出结果见图\
  \ 13-6。\n\n```\nindex=ny earliest=4/7/2013:08:00:00 latest=4/7/2013:11:00:00\n|\
  \ rename checkin.venue.categories.fullName as Type\n| where like(Type, \"Food%\"\
  )\n| top 5 checkin.venue.name\n```\n\n![9781430257615_Fig13-06.jpg](img/9781430257615_Fig13-06.jpg)\n\
  \n图 13-6. 纽约市五大早午餐场馆\n\n请记住，图 13-6 中计算的百分比是基于定义时间段内所有食品类别事件，而不仅仅是前五名。另外需要注意的是，此特定搜索按名称匹配场馆，因此所有星巴克门店都被分组在一起。我们可以根据场馆的单个位置进行搜索，这很可能会提供不同的视角，如图\
  \ 13-7 所示。该搜索基于每个位置唯一的场馆 ID 号进行计数。之后，结果基于场馆名称。\n\n```\nindex=ny earliest=4/7/2013:08:00:00\
  \ latest=4/7/2013:11:00:00\n| rename checkin.venue.categories.fullName as Type\n\
  | rename checkin.venue.name as Venue\n| where like(Type, \"Food%\")\n| stats count\
  \ by checkin.venue.id, Venue\n| table Venue, count\n| sort -count\n```\n\n![9781430257615_Fig13-07.jpg](img/9781430257615_Fig13-07.jpg)\n\
  \n图 13-7. 纽约市五大早午餐地点\n\n如图 13-7 所示，星巴克不再位列前五名。事实上，在指定的时间段内，签到次数最多的星巴克门店也只有六次。\n\n\
  这是一个有趣的插曲，但让我们回到主要的早午餐搜索。我们现在可以添加旧金山湾区，通过以下搜索生成的结果见图 13-8。我们所要做的就是添加一个带有适当时间窗口的子搜索，这些事件将被附加到与第一个子句中的搜索相匹配的事件中。\n\
  \n```\nindex=ny earliest=4/7/2013:08:00:00 latest=4/7/2013:11:00:00\n| append [\n\
  \          search index=sf earliest=4/7/2013:11:00:00 latest=4/7/2013:14:00:00\n\
  \         ]\n| rename checkin.venue.categories.fullName as Type\n| where like(Type,\
  \ \"Food%\")\n| top 5 checkin.venue.name\n```\n\n![9781430257615_Fig13-08.jpg](img/9781430257615_Fig13-08.jpg)\n\
  \n图 13-8. 纽约和旧金山五大早午餐场馆\n\n这个搜索有一个问题：它没有区分大都市区，所以计数是两个地区的总和。如图 13-8 所示，星巴克的计数从 `310`\
  \ 增加到 `474`，因为它只是添加了来自旧金山的签到。\n\n我们可以考虑两种区分大都市区的方法。第一种是查看事件的经度，第二种是查看事件的时区。对于第一种方案，我们需要在纽约和旧金山之间选择一个子午线。纽约大约在\
  \ `−75` 度，而旧金山大约在 `−122` 度。因为我们喜欢整数，我们将选择 `−100` 子午线。这样，任何大于 `−100` 的经度就是纽约，而任何小于\
  \ `−100` 的经度就是旧金山。请注意，我们处理的是负数，因此大于 `−100` 的经度包括像 `−75` 这样的数字。当我们添加计算位于 `−100` 子午线哪一侧的子句并清理搜索时，搜索的新版本如下：\n\
  \n```\nindex=ny earliest=4/7/2013:08:00:00 latest=4/7/2013:11:00:00\n| append [\n\
  \          search index=sf earliest=4/7/2013:11:00:00 latest=4/7/2013:14:00:00\n\
  \         ]\n| rename checkin.venue.categories.fullName as Type\n| rename checkin.venue.name\
  \ as Name\n| rename checkin.venue.location.lng as Lng\n| where like(Type, \"Food%\"\
  )\n| eval MetroArea = case(Lng> -100, \"New York\", Lng < -100, \"San Francisco\"\
  )\n| stats count by Name, MetroArea\n| sort 10 -count\n```\n\n这个搜索中唯一的新项是 `eval`\
  \ 命令的 `case` 函数，它的功能与许多编程语言中的 `case` 语句非常相似。该函数接受成对的参数；如果第一个参数（一个布尔值）计算结果为 true，则返回该对中的第二个参数。\n\
  \n第二种区分大都市区的方法是查看签到的 `timeZone` 字段。为此，我们修改搜索如下：\n\n```\nindex=ny earliest=4/7/2013:08:00:00\
  \ latest=4/7/2013:11:00:00\n| append [\n          search index=sf earliest=4/7/2013:11:00:00\
  \ latest=4/7/2013:14:00:00\n         ]\n| rename checkin.venue.categories.fullName\
  \ as Type\n| rename checkin.venue.name as Name\n| rename checkin.timeZone as TZ\n\
  | where like(Type, \"Food%\")\n| eval MetroArea = if(like(TZ, \"%New_York\"), \"\
  New York\", \"San Francisco\")\n| stats count by Name, MetroArea\n| sort 10 -count\n\
  ```\n\n\n\n除了包含时区的字段重命名之外，变更还体现在`eval`命令中，现在我们使用了`if`函数。该函数会评估第一个参数；如果为真，则返回第二个参数，否则返回第三个参数（如果存在），若不存在则返回`null`。`like`函数用于查找任何以`New_York`结尾的字符串，使用\
  \ SQL 符号`%`表示。两次搜索的结果完全相同，如图 Figure 13-9 所示。\n\n![9781430257615_Fig13-09.jpg](img/9781430257615_Fig13-09.jpg)\n\
  \nFigure 13-9. 按大都市区域划分的十大早午餐场所\n\n由于我们已经验证了底层搜索，并注意到将纽约和旧金山的`Starbucks`计数相加，其结果与图\
  \ Figure 13-8 中搜索产生的结果相同，因此我们有信心认为此搜索产生的结果是可靠的。现在我们可以继续下一个有趣的搜索了。\n\n## Google Maps\
  \ 与顶级场所\n\n因为我们处理的是包含地理位置信息的数据，不妨使用一下我们在第 4 章中介绍的`Google Maps`应用。首先，我们运行一个非常简单的搜索，来找出所掌握的一周数据中纽约的五大场所。基于此，我们将挑选排名第一的场所，并使用`Splunk`的`Google\
  \ Maps`应用来探索这些位置。以下命令生成了如图 Figure 13-10 所示的表格。\n\n```\nindex=ny\n| top 5 checkin.venue.name\n\
  ```\n\n![9781430257615_Fig13-10.jpg](img/9781430257615_Fig13-10.jpg)\n\nFigure 13-10.\
  \ 纽约的五大场所\n\n根据图 Figure 13-10 中呈现的搜索结果，纽约大都市区的顶级场所无疑是`Starbucks`。排名第二的`JFK`机场，其签到次数略多于`Starbucks`的三分之一。鉴于`Starbucks`拥有众多分店，这是一个使用`Google\
  \ Maps`应用来显示它们绝佳的例子。\n\n在第 4 章中，我们通过向`geoip`命令提供一个 IP 地址来使用`Maps`应用。`geoip`命令接收\
  \ IP 地址，在表中查找，然后返回一个位置坐标对，坐标对被呈现在地图上。由于本章处理的是直接的位置坐标对，而非 IP 地址，因此调用`Maps`应用的方式略有不同。`Maps`应用期望在名为`_geo`的字段中提供一个纬度、经度坐标对，该字段以`纬度,经度`的形式包含它们，我们需要自己构建这个字段。这并不复杂。以下是在`Google\
  \ Maps`应用中执行的搜索，用于显示我们所掌握的一周数据中纽约大都市区所有的`Starbucks`位置。地图显示了纽约大都市区的选定区域，如图 Figure\
  \ 13-11 所示。\n\n```\nindex=ny checkin.venue.name=Starbucks\n| rename checkin.venue.location.lat\
  \ as Lat\n| rename checkin.venue.location.lng as Lng\n| eval _geo=Lat+\",\"+Lng\n\
  ```\n\n![9781430257615_Fig13-11.jpg](img/9781430257615_Fig13-11.jpg)\n\nFigure 13-11.\
  \ 纽约大都市区`Starbucks`位置地图\n\n与`Google Maps`一样，您可以放大，这将提供`Starbucks`位置的更细粒度视图。看起来，`Starbucks`签到最集中的区域发生在曼哈顿中城。当我们放大到该区域时，我们可以看到，在我们分析的那一周内，最受欢迎的`Starbucks`位置是位于第五大道和西\
  \ 33 街拐角处的那家，如图 Figure 13-12 所示。\n\n![9781430257615_Fig13-12.jpg](img/9781430257615_Fig13-12.jpg)\n\
  \nFigure 13-12. 曼哈顿最受欢迎的`Starbucks`地图\n\n## 场所的签到模式\n\n用于查找场所签到模式的搜索非常简单，但我们仍希望与您分享几个选项，并评论一下`stats`命令的一个限制。这次我们将重点关注旧金山湾区的顶级位置。查找该位置的搜索如下：\n\
  \n```\nindex=sf\n| rename checkin.venue.name as Venue\n| stats count by checkin.venue.id,\
  \ Venue\n| table Venue, count\n| sort –count\n```\n\n在此搜索中，我们使用场所的`id`字段来统计各个位置，但通过其名称来呈现结果。您会看到`stats`命令包含了`Venue`字段，您可能认为这是多余的。问题在于`stats`命令是一个转换命令；因此，调用它之后，剩下的字段只有用于分割的字段和按分割计算出的聚合值。基本上，如果您希望在`stats`命令之前创建的某个字段能传递到下一个子句，您必须在`stats`命令中使用它，即使它不执行任何操作。在此示例中，如果我们不在`stats`命令中包含`Venue`字段，它将无法用于`table`命令。前述搜索的输出如图\
  \ Figure 13-13 所示。\n\n![9781430257615_Fig13-13.jpg](img/9781430257615_Fig13-13.jpg)\n\
  \nFigure 13-13. 旧金山湾区的五大位置\n\n既然我们已经知道了顶级位置，查找旧金山机场签到模式最简单的方法就是搜索所有其名称中包含该机场的事件。`Splunk`的时间线将呈现该模式，如图\
  \ Figure 13-14 所示，同时附上搜索语句。\n\n![9781430257615_Fig13-14.jpg](img/9781430257615_Fig13-14.jpg)\n\
  \nFigure 13-14. 旧金山机场的每日签到模式\n\n然而，图 Figure 13-14 中呈现的时间线的问题是粒度不够细。它以天为单位显示结果，而我们希望按小时显示。为实现这一点，我们制定了另一个搜索，使用`timechart`命令并将时间跨度指定为每小时。搜索语句及其结果如图\
  \ Figure 13-15 所示。`Splunk`图表的一个不错的功能是，当您将鼠标悬停在图表上时，它会显示该特定数据点的详细信息。\n\n```\nindex=sf\
  \ checkin.venue.name=\"San Francisco International Airport (SFO)\"\n| timechart\
  \ span=1h count\n```\n\n![9781430257615_Fig13-15.jpg](img/9781430257615_Fig13-15.jpg)\n\
  \nFigure 13-15. 旧金山机场的每小时签到模式\n\n## 按签到次数划分的场所\n\n我们经常听到的一个问题是关于场所在特定时间段内的签到次数：具体来说，有多少场所有一周一次签到，有多少场所有两次，依此类推。这可以提供另一个有趣的`Foursquare`世界视角。此搜索的基础是统计每个位置的签到次数，然后按签到次数统计位置数量。这意味着一前一后使用两个`stats`命令：\n\
  \n```\nindex=sf\n| stats count as NumberOfCheckins by checkin.venue.id\n| stats\
  \ count as Locations by NumberOfCheckins\n| table NumberOfCheckins, Locations\n\
  ```\n\n这很简单，我们之前解释过的`stats`命令的限制在这里不是问题，因为我们在第二个子句中生成的字段会立即在第三个子句中使用。验证此搜索的结果是一个更复杂的问题。首先，我们运行相同的搜索，但针对一个更短的时间段，例如一小时。输出如图\
  \ Figure 13-16 所示。\n\n![9781430257615_Fig13-16.jpg](img/9781430257615_Fig13-16.jpg)\n\
  \n\n\n图 13-16. 按签到次数统计的场所（一小时内）\n\n事实证明，在较短时间范围内进行搜索恰好得到 10 条结果。现在，我们有了更易于处理的结果数量。挑战在于找到另一种搜索方式，以便验证图\
  \ 13-16 中展示的结果。在这些结果中，我们可以看到，某个场所有 85 次签到，另一个有 35 次，还有一个有 14 次。如果我们制定一个按场所名称计数的搜索，这些场所在结果中应该以单一地点场所的形式出现。验证搜索如下，部分结果展示在图\
  \ 13-17 中。\n\n```\nindex=sf earliest=4/8/2013:10:00:00 latest=4/8/2013:11:00:00\n\
  | stats count by checkin.venue.name\n| table count, checkin.venue\n| sort -count\n\
  ```\n\n![9781430257615_Fig13-17.jpg](img/9781430257615_Fig13-17.jpg)\n\n图 13-17.\
  \ 验证搜索结果\n\n拥有 85 次签到的场所是旧金山机场，35 次的是 Splunk 开发者论坛，14 次的是奥克兰机场。在图 13-17 所示结果中出现的其他场所都是多地点场所，因此它们没有出现在图\
  \ 13-16 的结果中是合理的。我们有理由相信，初始搜索的结果在整个时间段内都是正确的。\n\n有趣的是，Foursquare 有一个 Swarm 徽章，当\
  \ 50 人或更多人在三小时内签到同一地点时即可获得。根据图 13-17 显示的结果，在旧金山机场签到的人应该能获得此徽章，而且他们很可能还能获得 Super\
  \ Swarm 徽章（与 Swarm 徽章相同，但要求 250 人或以上）。\n\n现已验证过的初始搜索结果非常冗长。当以折线图呈现时，`x`轴的标签太多，无法显示。为了使结果更具可读性，我们将输出限制为前\
  \ 30 条，如图 13-18 所示。从中可以看到，在我们分析的一周内，大多数地点的签到次数很少。\n\n![9781430257615_Fig13-18.jpg](img/9781430257615_Fig13-18.jpg)\n\
  \n图 13-18. 旧金山各场所按签到次数统计\n\n接下来，我们对搜索进行了调整，要求结果以签到次数的百分比形式呈现，而不是目前的计数。这项挑战的主要问题在于，我们需要计算签到总数（这很容易），但鉴于我们之前提到的`stats`命令的限制，这会成为一个难题。我们曾使用的技巧（即在下一个`stats`命令的计算中保留你想要保留的字段）并不总是有效。例如：\n\
  \n```\nindex=sf\n| stats count as Total\n| stats sum(Total) as Total, count as NumberOfCheckins\
  \ by checkin.venue.id\n| stats count as Locations by NumberOfCheckins\n```\n\n在这个例子中，我们通过计数事件获得总数，并将其放入`Total`字段。在下一个子句中，我们通过计算一个不应影响`Total`值的总和，对`Total`字段未作任何处理。然而，由于`stats`命令使用了`by`参数，它确实影响了`Total`的值。我们无法将总数传递到所有需要的`stats`命令中。不过，还有另一种方法可以解决这个问题：只需将每个地点的`Locations`字段值与`NumberOfCheckins`字段值相乘，然后将它们相加。这样就能得到事件总数。基于此，搜索如下：\n\
  \n```\nindex=sf\n| stats count as NumberOfCheckins by checkin.venue.id\n| stats\
  \ count as Locations by NumberOfCheckins\n| eventstats sum(eval(NumberOfCheckins\
  \ * Locations)) as Total\n| eval PCT=round(Locations / Total * 100, 2)\n| table\
  \ NumberOfCheckins, Locations, PCT, Total\n```\n\n`eventstats`命令用于按前述方式计算总数，然后将`Total`字段添加到搜索前面子句产生的所有搜索结果中。有了这个，我们现在可以计算百分比，并以表格形式呈现结果，这样便于调试搜索中的任何问题。验证此搜索非常简单。由于我们已经有了按签到次数统计的场所数量以及事件总数，我们可以轻松计算百分比。如果仅有一次签到的场所比例为\
  \ 7.87%，则搜索正确。正如你在图 13-19 中所见，搜索成功。\n\n![9781430257615_Fig13-19.jpg](img/9781430257615_Fig13-19.jpg)\n\
  \n图 13-19. 按签到次数统计的场所百分比\n\n现在我们清理搜索，只保留签到次数和百分比，并将输出限制为前 25 条。这样我们就可以生成一个漂亮的柱形图，回答在我们分析的这段时间内，旧金山都市区有多少百分比的场所有多少次签到。该图表见图\
  \ 13-20。\n\n![9781430257615_Fig13-20.jpg](img/9781430257615_Fig13-20.jpg)\n\n图 13-20.\
  \ 按签到次数统计的场所百分比——柱形图\n\n## 分析性别活动\n\n按性别分析签到会非常有趣。为此，我们需要为每个类别名称按性别保留计数。正如我们之前所见，使用`stats`命令并不容易，因此我们将重点转向`eventstats`命令，它允许我们向事件添加新字段。此外，我们可以通过使用子搜索，在搜索的不同部分为每种性别添加这些计数。初始搜索着眼于\
  \ 4 月 10 日星期三上午 7 点到晚上 10 点的旧金山数据：\n\n```\nindex=sf earliest=4/10/2013:07:00:00\
  \ latest=4/10/2013:22:00:00\n         checkin.user.gender=male\n| eventstats count(checkin.id)\
  \ as Male by checkin.venue.categories.name\n| append [\n          search index=sf\
  \ earliest=4/10/2013:07:00:00 latest=4/10/2013:22:00:00\n                 checkin.user.gender=female\n\
  \          | eventstats count(checkin.id) as Female by checkin.venue.categories.name\n\
  \         ]\n| rename checkin.venue.categories.name as Category\n| stats count(Male)\
  \ as Men, count(Female) as Women by Category\n| table Category, Women, Men\n| sort\
  \ 25 –Women, -Men\n```\n\n通过`eventstats`命令，我们按类别名称计算签到次数，并将其放入一个字段中，然后附加到搜索的结果（本例中为所有男性和女性事件）上。接着，`stats`命令按类别对这些新字段进行计数，以获得最终计数。此搜索的部分结果可见于图\
  \ 13-21。\n\n![9781430257615_Fig13-21.jpg](img/9781430257615_Fig13-21.jpg)\n\n图 13-21.\
  \ 旧金山按性别统计的活动情况\n\n此搜索的验证相当简单，因为我们可以直接放大到这些类别中的任何一个并获取计数。例如：\n\n```\nindex=sf earliest=4/10/2013:07:00:00\
  \ latest=4/10/2013:22:00:00\n         checkin.user.gender=male\n         checkin.venue.categories.name=Offices\n\
  | stats count\n```\n\n\n\n此次搜索的结果为 `1,152`，这与图 13-21 所示的对应结果相符。我们再执行一次验证搜索，以确保一切运行正常。这次我们使用机场作为女性场所的搜索条件，结果同样匹配；因此，我们可以断定该搜索功能是正确的。理想情况下，我们应该以百分比形式呈现结果，这样会更清晰，但我们不想让搜索变得复杂。有趣的是，有一种方法无需计算即可将这些结果以百分比形式呈现：使用条形图或柱状图，并选择\
  \ 100%堆叠选项。我们在图 13-22 中展示了搜索结果的呈现方式。由于柱状图中没有空间显示类别名称，因此我们使用条形图。\n\n![9781430257615_Fig13-22.jpg](img/9781430257615_Fig13-22.jpg)\n\
  \n图 13-22. 旧金山按性别划分的活动——条形图\n\n在图 13-22 中很有趣地发现，旧金山湾区聚焦于科技领域，约 75%的男性签到来自科技初创公司，而第二大类别是酒店，很可能是科技初创公司的访客。对于女性而言，第一大类别是大学，第二大类别是百货商店。这种图表非常适合传达结果的对比，就像我们刚刚生成的那样。为了进行更非正式的对比，我们可以搜索纽约市一整周数据中，男性和女性按类别名称排名的热门活动。使用\
  \ IBM 的 Many Eyes 网站生成的词云结果，分别显示在图 13-23（女性）和图 13-24（男性）中。\n\n![9781430257615_Fig13-23.jpg](img/9781430257615_Fig13-23.jpg)\n\
  \n图 13-23. 纽约女性的活动\n\n![9781430257615_Fig13-24.jpg](img/9781430257615_Fig13-24.jpg)\n\
  \n图 13-24. 纽约男性的活动\n\n## 总结\n\n在本章中，我们利用 Foursquare 服务的签到数据，学习了地理定位配对、反向地理定位，以及\
  \ Splunk 的谷歌地图应用。我们还讨论了如何处理时区及其相关的所有问题。我们介绍了`eventstats`和`append`命令，并了解了`stats`命令的局限性。此外，我们还探索了可视化辅助工具，以便更好地传达搜索结果的含义，其中一些搜索结果相当复杂。\n\
  \n---\n\n"
- "# 第 14 章\n\n![image](img/frontdot.jpg)\n\n## 情感分析\n\n情感分析通常与社交媒体相关联，进而与大数据挂钩。在本章中，你将学习情感分析是什么，并通过一些实际示例来分析推文中的情感。本章的项目是世界情感指标，其目标是基于对全球众多网络新闻媒体的新闻标题进行分析，提供一个反映世界总体情感的指标。\n\
  \n## 观点、看法、信念、信仰\n\n情感分析可以定义为：检视文本或语音，以找出作者或说话者针对特定主题所持的观点、看法或感受的过程。（此定义适用于计算机系统，因为当人类进行此操作时，通常简称为阅读。）本节标题中的所有词汇都与情感密切相关，并且描述了高度主观和模糊的概念。这使得计算机程序从文本（无论是长文档还是推文）中提取这些信息变得相当具有挑战性。当你考虑到某些词汇或表达方式会根据知识领域（即专业领域）的不同而有不同含义时，这个挑战的复杂性会进一步增加。例如，“go\
  \ around”在普通对话中的含义与对飞机飞行员而言完全不同，对后者来说，它意味着中止着陆程序并重新尝试。与专业领域相关的问题中，还夹杂着通常与之相关的行话术语。\n\
  \n某些知识领域的文档或演讲往往比其他领域更难分析，而政治通常被认为是最复杂的领域。试图判断一篇政治演讲是否支持某个特定议题是困难的，因为这些讨论充满了讽刺、引文和（可能相当复杂的）对其他组织或人物的引用。我们很容易得出结论：情感是具有语境依赖性和领域依赖性的。\n\
  \n考虑到所涉及概念和人类本性的模糊性，我们也可以预期不同的人对正在检视的文本或观看的演讲会有不同的理解，并得出不同的结论，后者由于能看到肢体语言而更有优势。到目前为止所描述的这些挑战独立于所使用的语言而存在，并且是在人类进行信息提取工作的背景下呈现的。\n\
  \n试图通过计算机系统自动化信息提取过程会增加复杂性，因为软件程序需要明确的边界来消除歧义。这不可避免地会使得分析趋向于按领域进行专门化，此外，还要考虑所使用的媒介类型。例如，对新闻文章的处理方式会与对推文的处理方式不同。文章通常遵循其书写语言的语法规则，使用规范的词汇，且没有拼写错误。相比之下，推文缺乏句子结构，很可能使用俚语，包含表情符号![image](img/smiley.jpg)，有时还会通过重复字母来拉长单词以增强情感色彩（“我超超超超超级喜欢巧克力”）。此外，由于用于创建推文的设备特性，拼写错误的频率也更高。\n\
  \n如你所见，情感分析是困难的。在本章后面，我们将更详细地探讨自动化这种分析的各种技术，但首先，我们来了解一下为什么你可能需要使用它。\n\n## 商业用途\n\
  \n从历史的角度出发，并随着技术和社交媒体的演变，我们可以将情感分析（也称为意见挖掘）的用途分为两大类。第一类是将其用作决策过程的输入。他人的想法一直是这个过程中一个非常重要的组成部分，尤其是在决定购买某件物品时。在过去，获取他人意见的途径仅限于家人、朋友，以及在行业杂志或其他媒体上发表评论的专家。`Consumer\
  \ Reports` 是一本致力于评测从搅拌机到汽车等各种产品的杂志，它是提供“他人想法”的专家典范。\n\n\n\n随着数字足迹的不断增长以及互联网上商业交易的持续增加，我们发现了越来越多的数字论坛，这些论坛让人们能够分享自己的经验和观点，从而满足了解“别人怎么想”的需求。这些论坛的范围很广，从将互联网作为另一种媒介来发布观点的传统专家，到专门收集和分享任何人观点的组织良好的网站。像`Yelp`、`Angie’s\
  \ List`和`Rotten Tomatoes`这样的网站在根据公众反馈来汇总和排名商业机构、商家、工匠和电影方面做得非常出色。此外，人们还可以在他们购买产品的网站上留下评论，例如`amazon.com`。最后，还有个人观点，范围从博客文章到推特，可以被视为“口口相传”的等价物。\n\
  \n处理特定主题的数字论坛，例如`stackoverflow.com`（开发者的必备网站），以及由企业支持部门创建的论坛，提供了简单而强大的方式，允许参与者对答案的质量以及提供答案的人的可信度进行隐式评分。\n\
  \n这类决策支持在过去几年里得到了爆发式增长，任何人都可以非常轻松快速地找到他们可能感兴趣的任何事物的信息。当然，他们仍然需要从不完整或无用的评论中筛选出受尊敬的观点，并且识别出伪装成专业评论的纯粹广告。\n\
  \n第二个大类与企业获取其产品或服务反馈有关。从历史上看，企业必须通过组织焦点小组、进行民意调查、审查服务中心记录或保修索赔来了解其品牌、产品和服务的认知度。现在，他们可以监控社交媒体渠道，并近乎实时地了解其自身产品以及竞争对手产品的情况。通过使用情感分析，企业可以监控消费者趋势和市场热度。他们可以更快地找到其网站中客户行为的根本原因，也能更快地发现新的机遇和威胁。最终，这一切都引导到对公司最重要的东西——其品牌声誉——的管理上。\n\
  \n正如我们所看到的，情感分析并不容易，但若操作得当，它可以非常强大。在 2010 年由`O’Connor`等人发表的一篇题为“From Tweets to Polls:\
  \ Linking Text Sentiment to Public Opinion Time Series”的论文中，作者提出了一个令人信服的观点：“我们分析了\
  \ 2008 年至 2009 年期间关于消费者信心和政治观点的几项调查，发现它们与同时期推特消息中的情感词频率存在相关性。虽然我们的结果因数据集而异，但在几种情况下，相关性高达\
  \ 80%，并且捕捉到了重要的大尺度趋势。这些结果突显了文本流作为传统民意调查的替代和补充的潜力。”\n\n当然，如果情感分析做得不好，可能会导致一些相当有趣的情况。`Dan\
  \ Mirvish`在一篇题为“The Hathaway Effect: How Anne Gives Warren Buffet a Rise”（`http://www.huffingtonpost.com/dan-mirvish/the-hathaway-effect-how-a_b_830041.html`）的文章中描述了一个例子。作者怀疑华尔街的机器人交易程序包含了情感分析，每当`Anne\
  \ Hathaway`登上头条新闻时，`Warren Buffett`的`Berkshire Hathaway`的股票（代码`BRK.A`）就会上涨。`Dan`列出了`Anne\
  \ Hathaway`职业生涯中的里程碑日期以及`BRK.A`股价的相应涨幅。当然，这篇文章基于一个非常简单的分析，但这是一个很好的例子。\n\n很明显，情感分析有很多商业用途，并且有许多商业和开源产品声称具有各种功能。但是，在你决定是构建还是购买之前，让我们先来看看情感分析的技术方面。\n\
  \n## 情感分析的技术层面\n\n当你在互联网上搜索情感分析的信息时，你通常会发现大量充斥着复杂概率公式的科学论文，或者是解释其“秘方”如何优于他人的营销文档。我们冒着过度简化甚至可能曲解某些概念的风险，对情感分析的技术层面进行解释，这样你无需拥有统计学学位就能获得一个不错的理解。本章的这一部分大致基于`Bo\
  \ Pang`和`Lillian Lee`（2008 年）的开创性论文“Opinion Mining and Sentiment Analysis”。\n\n\
  情感分析本质上是一种文本分类；因此，此类分析的结果通常分为两类：\n\n*   **极性**，这是一个直接的正面、中性或负面结果。\n*   **极性范围**，即评分或排名，例如电影的星级评定，有时可以扩展到意见的强度，比如从\
  \ 1 到 10 的量表。\n\n可以在不同层面进行极性或极性范围的判定：词汇、短语、句子或文档。通常的做法是将一个层面的分析结果作为更高层面分析的输入。例如，你可以对词汇进行情感分析，然后使用结果来评估短语，然后是句子，依此类推。\n\
  \n基于情感对文本进行分类面临着许多挑战，我们将通过介绍各种基于所谓“特征”来提取和分类极性的算法来回顾这些挑战：\n\n*   **词频**。这可能是所有特征中最明显、最直观的一个。其思想是，文档中出现频率最高的词反映了该文档的极性。可以想象，这个前提并不总是正确的。\n\
  *   **词项出现**。这是词频的反向思路。不是关注最常见的词，而是寻找最独特的词，并基于它们来确定极性。同样，这个前提也并不总是准确的。\n*   **N-gram**。单词的位置决定，有时甚至会逆转一个短语的极性，从正面变为负面，反之亦然。分析是通过尝试理解单词在`unigram`（单个单词）、`bigram`（两个连续单词）、`trigram`（三个连续单词）等语境中的含义来进行的。\n\
  *   **词性**。传统的英语语法将单词分为八种词性：动词、名词、代词、形容词、副词、介词、连词和感叹词。在此特定情况下，形容词被认为是文本情感非常好的指示器；因此，它们被用来定义极性。这个特征涉及到将句子分解成所有不同的词性。\n\
  *   **句法**。已经有人尝试将句法关系纳入特征集，但关于使用此特征的优缺点仍然存在讨论。\n*   **否定**是情感分析中最重要的特征之一。虽然“我喜欢这本书”和“我不喜欢这本书”的词袋表示被大多数常用的相似度度量认为是非常相似的，但唯一不同的词——否定词——迫使这两个句子走向相反的极性。然而，并非所有显式否定词的出现都会反转所在句子的极性。\n\
  \n\n\n如您所见，这些算法各有优缺点，没有一种算法能解决所有问题。通常，文本分类器会组合使用多种特征提取器来分配极性。然而，要让这些特征提取器能分配语境极性，就意味着它们必须预先知道词语的基本极性。获取词语基本极性有几种方法：\n\
  \n*   使用情感词典。最基本的词典仅为每个独立词汇提供极性，但它们可以通过添加额外标签来变得非常精细，例如，可以指代特定情绪的强度等级。\n*   使用训练文档。每个训练文档包含若干句子，并且每个文档都预先被标记了特定的极性或极性范围。单个词汇的极性是根据特征提取器的组合以及它在不同分类中出现的频率来计算的。这种计算被称为训练，其结果存储在一个模型中。显然，每个分类文档中的句子越多，最终分类结果的准确性就越高。\n\
  \n使用训练文档的文本分类器属于机器学习工具的范畴。可以说，最流行的情感分析工具都基于机器学习分类器，它们通常采用以下方法之一：\n\n*   **朴素贝叶斯分类器**。一种基于贝叶斯定理的简单概率分类器。其特征提取器包括单词或一元组、二元组和三元组，以及每个句子中的词性。朴素贝叶斯分类器可以包含正面和负面词汇的计数，以及词汇序列极性的计数。它还可以包含结合了极性信息的词性计数。\n\
  *   **最大熵模型**。与朴素贝叶斯假设每个特征相互独立不同，最大熵模型不假设特征独立。这使得我们可以使用二元组和短语，而无需担心词汇重叠的问题。\n* \
  \  **支持向量机**。基于向量，这些向量的长度与分析所使用特征提取器的数量相同。可以对向量应用多种函数，例如线性函数、多项式函数、Sigmoid 函数等。最简单的分析基于单个词汇与表示该词是否出现的词项的组合。\n\
  \n关于这些方法，已有大量的研究和比较。结论可以概括为：每种方法都有可能略微优于其他方法，具体取决于被分析文本所属的领域。共同点是，只要使用高质量的训练文档，所有方法在特定领域（如电影评论）的准确率都能达到\
  \ 80%以上。由于编程更简单，朴素贝叶斯方法往往是最流行的。\n\n如您所见，在使用机器学习工具进行情感分析时，获得良好结果的关键在于拥有高质量的训练文档。这意味着您应该使用与待分析数据相同的数据来训练系统；否则，如果用其他领域的文档进行训练，很可能会降低结果的准确性。例如，在书评领域，“go\
  \ read the book”这句话表达的是正面情感，但在影评领域，它却是负面情感。\n\n互联网上有大量可用作训练资料的资源。例如，`imdb.com` 上的电影评论已经根据极性范围（星级评定）进行了标记。每篇评论都不止包含几个句子，而且数量庞大。其他网站如\
  \ `amazon.com` 和 `cnet.com` 也有大量已经分类的评论。显然，只有当您要分析的是评论数据时，使用这些评论才有意义。\n\n获取训练数据有不同的方法。您会听到监督训练和无监督训练的概念，这取决于您在多大程度上参与训练数据的分类。还有一种称为训练数据自举的方法，即获取一些现有数据并将其转换成您需要的形式。创建训练数据有很多富有创意的方法。Go\
  \ 等人（2009 年）发表的一篇优秀论文《使用远距离监督进行推特情感分类》就对此提供了一个很好的例子。作者描述了如何使用表情符号来对推文的极性进行分类，然后将这些分类后的推文作为训练数据。这项工作的成果可在\
  \ `http://www.sentiment140.com` 上获取。在这个网站上，您可以输入一个关键词，它会分析包含该关键词的推文，然后生成一些包含情感信息的图表，以及根据极性用颜色编码的实际推文。图\
  \ 14-1 显示了一个搜索关键词 `splunk` 的结果截屏。\n\n![9781430257615_Fig14-01.jpg](img/9781430257615_Fig14-01.jpg)\n\
  \n图 14-1. 使用 sentiment140.com 对单词 `splunk` 进行的基于推特的情感分析\n\n## 情感分析应用\n\n您可以在 Splunkbase\
  \ 上找到一个情感分析应用。该应用基于朴素贝叶斯方法，提供了一组有趣的命令和几个仪表盘。此外，该应用还包含了训练和测试数据的必要工具，以及两个基于推特和 IMDB\
  \ 电影评论预训练好的模型。您可以在以下地址找到它：\n\n```\nhttp://splunk-base.splunk.com/apps/57214/sentiment-analysis\n\
  ```\n\n该应用由 Splunk 工程师 David Carasso 编写，根据“知识共享 BY 3.0”许可免费提供。从 Splunk 内部安装该应用的步骤如下：\n\
  \n*   在用户界面的任意屏幕，点击位于右上角的应用下拉菜单，然后选择“在线上查找更多应用”\n*   搜索情感分析应用；搜索框位于屏幕的右上方，输入 `sentiment`\n\
  *   找到“Sentiment Analysis”，然后点击“免费安装”\n\n应用现已安装完毕，可以随时使用。除了几个留给您自行探索的仪表盘外，该应用还包含三个命令：\n\
  \n*   `sentiment`，根据软件包中提供的训练工具创建的特定模型来计算情感\n*   `language`，一个专门用来预测某个字段内容语言的命令\n\
  *   `token`，用于更方便地将术语和短语分词，以便进行文本分析\n\n## 全局启用命令\n\n在本章的示例中，我们将只使用 `sentiment` 和\
  \ `language` 命令。这为我们提供了一个解释如何在一个应用中使用其他应用命令的机会。默认情况下，这些命令仅限于在情感分析应用内部使用。要使其在 Splunk\
  \ 范围内全局可用，请执行以下步骤：\n\n*   在用户界面的任意屏幕，点击右上角的“管理器”按钮\n*   点击位于选项左下角的“高级搜索”\n*   接着点击“搜索命令”选项\n\
  *   在标题为“应用上下文”的下拉菜单中，选择“所有”，如图 14-2 所示\n\n![9781430257615_Fig14-02.jpg](img/9781430257615_Fig14-02.jpg)\n\
  \n图 14-2. 选择应用命令的上下文\n\n*   在第一列名为“命令名称”中找到 `sentiment`。在我们的示例中，它位于第二页。点击“权限”链接，如图\
  \ 14-3 所示\n\n![9781430257615_Fig14-03.jpg](img/9781430257615_Fig14-03.jpg)\n\n图\
  \ 14-3. 选择一个命令的共享权限\n\n\n\n在“Object should appear in”下，选择“All apps”，如图 14-4 所示。然后点击右下角的“Save”。此处也是您可以为命令授予基于角色的权限的地方。\n\
  \n![9781430257615_Fig14-04.jpg](img/9781430257615_Fig14-04.jpg)\n\n图 14-4. 全局启用命令\n\
  \n按照相同的步骤全局启用`language`命令。从现在开始，我们将在`search` App 的上下文中工作。\n\n## 发现情感\n\n使用我们在第 12\
  \ 章中处理的 Twitter 数据（这是一个包含近五百万条推文的样本日），我们将探索`sentiment`和`language`命令的使用。我们的好奇心驱使我们首先回顾包含单词“love”的推文的情感。我们预期结果情感将是正向的。\n\
  \n在制定合适的搜索之前，我们必须解释情感是以数字表示的。当它们是纯粹的极性（正向或负向）时，通常用 1 表示正向，−1 表示负向，0 表示中性。极性范围由训练数据的人定义的数字序列表示。例如，1\
  \ 到 5 可用于表示许多电影评论网站使用的流行的五星评级系统。\n\n![image](img/sq.jpg) **注意** 本章中的所有示例和训练数据均基于英语。机器学习工具足够灵活，可以处理任何语言。在训练期间，必须使用所需语言的适当训练数据。\n\
  \n搜索非常简单，因为我们只需要选择英文且包含单词“love”的推文，然后将它们传递给`sentiment`命令，最后计算结果的平均值：\n\n```\nindex=twitter\
  \ lang=en\n| where like(text, \"%love%\")\n| sentiment twitter text\n| stats avg(sentiment)\n\
  ```\n\n`sentiment`命令有两个参数。第一个参数是用于计算情感的模型。在此情况下，我们使用了`sentiment` App 自带的名为`twitter`的模型。第二个参数是包含待分析文本的字段名。情感分析的结果被放入一个名为`sentiment`的字段中，该字段被`stats`命令用来计算所有已分析事件的平均情感。此搜索的结果是\
  \ 0.4666，正如我们预期的那样，偏向正向。这个结果也说明了特征提取器面临的挑战之一：并非所有包含像“love”这样强烈正向词的文本都是正向的。在范围从−1\
  \ 到 1 的情况下，该结果也可以解释为“大约 75%包含单词 love 的推文是正向的”。要理解这个说法，您可以这样看：得分为 0（中性）意味着 50%的推文是正向的，另一半是负向的。得分为\
  \ 1 意味着 100%的推文是正向的；因此，接近 0.50 的得分可以解释为 75%的推文是正向的。\n\n从可视化的角度来看，将这个结果显示为一个纯数字相当令人沮丧。我们认为更合适的可视化方式是径向仪表盘，但当我们选择它时，Splunk\
  \ 会显示一个如图 14-5 所示的仪表盘，其刻度范围是 0 到 100，而我们需要的是从−1 到 1 的刻度。此外，颜色编码也不合适，因为绿色分配给了 0 到\
  \ 30，黄色分配给 31 到 70，红色分配给 71 到 100。对我们来说，理想的颜色编码是负向用红色，正向用绿色，中性用黄色。\n\n![9781430257615_Fig14-05.jpg](img/9781430257615_Fig14-05.jpg)\n\
  \n图 14-5. 默认径向仪表盘\n\n不幸的是，提供的格式化选项不包括更改刻度。解决方法是创建一个仪表盘。编辑面板时，您可以选择编辑可视化。通过选择“Color\
  \ ranges”并点击“Manual”，您可以修改刻度和颜色。默认情况下，对话框显示 3 个范围，可以根据需要增加或减少，并且每个范围都有默认颜色。第一个范围是绿色，第二个是黄色，最后一个是红色。由于颜色范围的值必须从最低到最高输入，并且我们处理的是负数，因此我们必须更改颜色的顺序。如图\
  \ 14-6 所示，我们选择将第一个范围（负向情感）设置为从−1 到−0.25，使用红色。我们将第二个范围（中性）设置为从−0.25 到 0.25，使用黄色。最后一个范围（正向情感）设置为从\
  \ 0.25 到 1，使用绿色。生成的径向仪表盘可以在图 14-7 中看到。\n\n![9781430257615_Fig14-06.jpg](img/9781430257615_Fig14-06.jpg)\n\
  \n图 14-6. 颜色范围选择对话框\n\n![9781430257615_Fig14-07.jpg](img/9781430257615_Fig14-07.jpg)\n\
  \n图 14-7. 自定义径向仪表盘\n\n如果我们分析了包含单词“love”的推文的情感，那么也应该探究那些包含单词“hate”的推文，这才公平。在图 14-8\
  \ 中，您将看到在增强型仪表盘中呈现的部分结果（搜索仍在运行）。有趣的是，这些结果在任何实际用途上都是互补的。\n\n![9781430257615_Fig14-08.jpg](img/9781430257615_Fig14-08.jpg)\n\
  \n图 14-8. Love 与 Hate 情感仪表盘\n\n为了完善我们对情感的探索，我们决定分析一组我们怀疑是高度正向的推文。由于 Justin Bieber\
  \ 在 Twitter 上的粉丝数量排名前三，我们只能认为他的粉丝会正面地发布关于他的推文，尤其是在他们使用#Beliebers 标签时。结果可以在图 14-9\
  \ 中看到一个更增强的仪表盘，证实了我们的怀疑。我们使用的搜索基于第 12 章中回顾的一个类似搜索。\n\n```\nindex=twitter lang=en\n\
  | rename entities.hashtags{}.text as hashtags\n| fields text, hashtags\n| mvexpand\
  \ hashtags\n| where like(hashtags, \"Beliebers\")\n| sentiment twitter text\n| stats\
  \ avg(sentiment)\n```\n\n![9781430257615_Fig14-09.jpg](img/9781430257615_Fig14-09.jpg)\n\
  \n图 14-9. Love、Hate 与 Justin Bieber\n\n## 处理语言\n\n尝试从一小段文本中猜测语言是一项相当有挑战性的任务。考虑到推文的性质——拼写错误频率更高，包含大量俚语，此外还有以@符号开头的用户名，大量以`http://t.co/`...形式的链接以及单词拉长——挑战会急剧增加。\n\
  \n在第 12 章中，我们看到推文对象包含两个语言字段。一个是用户声明的语言，另一个我们认为是的 Twitter 对实际推文语言的预测。您可能还记得，我们发现\
  \ Twitter 对推文语言的猜测并不十分准确。当出现像这样的推文时，这并不令人惊讶：\n\n```\n@cutiemz1 Lol...I knw jor\n\
  #crawleycrowd 5850\n@arturo_p hahahahahahahahahahahahahahahahahahahsjjahahajasjhsjshjshash\n\
  RT @carlitos898: #teamfollowback\n```\n\n\n\n意识到这颇具挑战性后，让我们通过查看前 35 条语言为英语的推文来试试`language`命令。此时必须说明，情感分析应用仍处于实验阶段，截至本文撰写时存在一些小缺陷，我们会提供变通方案。让我们看看这个相当简单的搜索：\n\
  \n```\nindex=twitter lang=en\n| head 35\n| language text\n| rename language as Lng\n\
  | stats count by Lng\n```\n\n`language`命令只有一个参数，即需要分析以预测语言的字段。结果会存放在名为`language`的字段中。当前版本的小缺陷是结果字段可能丢失（或许是在翻译过程中），变通方法是重命名字段。搜索结果指出\
  \ 35 条推文中有 34 条是英语，1 条是波兰语。那条被归类为波兰语的推文正是我们之前列出的示例中的第一条。对我们而言，这个准确率已经相当不错了。\n\n\
  当我们将需分析的语言改为西班牙语时，情况变得更有趣。仅查看前 10 条语言为西班牙语的推文，结果显示 5 条为西班牙语，4 条为英语，1 条为加泰罗尼亚语。经我们复核，实际计数是\
  \ 6 条西班牙语、1 条葡萄牙语、3 条无法确定。考虑到西班牙语和葡萄牙语的相似性，这种误分类可以理解。\n\n通过更加严格的筛选条件，我们可以获得更高准确率。我们再次尝试分析西班牙语推文，但这次不仅指定推文语言为西班牙语，还要求用户声明的语言也是西班牙语。结果显示\
  \ 7 条西班牙语、2 条英语、1 条加泰罗尼亚语。我们人工查验的结果是 8 条西班牙语、2 条无法确定。\n\n经过这些简单测试，我们认为`language`命令的表现与\
  \ Twitter 对推文的语言猜测基本相当。我们确信，如果文本长度超过推文 140 字符的限制，情感分析应用自带的`language`命令将有更出色的预测表现。如果你计划使用该命令，应当根据具体应用场景进行更仔细的针对性测试，这样才能对结果建立合理预期。\n\
  \n## 训练与测试数据\n\n本章前文已提及，训练数据的质量是良好情感预测的关键。基于前文讨论的特征提取相关问题，我们知道情感分析并非精确科学。即使有科学家和学者参与，最佳准确率也仅在\
  \ 80%到 85%之间。本节将详细说明如何构建训练数据集并测试其质量。\n\n首要任务之一是确定如何处理极性：你的结果是基于简单极性还是极性范围？情感应用已附带两个预训练模型。之前示例中使用的\
  \ Twitter 模型基于简单极性（积极或消极）。应用附带的另一个模型基于 IMDb 电影评论，使用 1 到 10 的极性范围。\n\n对于简单极性，你需要提供两组文档：一组包含积极情感样本，另一组包含消极情感样本。如果你的领域包含大量中性句子，还应提供中性样本集。对于极性范围，则需要为范围内的每个评分提供一组文档。这些文档统称为训练语料库。当处理多个模型时，则称为拥有多个语料库。\n\
  \n机器学习软件将处理语料库并创建模型，随后用该模型预测情感。语料库越大（即训练数据样本越多），模型质量越高。在前面的示例中，`sentiment`命令使用的模型名为`twitter`，其语料库包含\
  \ 190,852 条积极推文和 37,469 条消极推文，总计 228,321 条推文。`imdb`模型的语料库则基于 10 个评分的各 11 条电影评论，每条评论平均约\
  \ 200 词。该模型以`imdb`名称供`sentiment`命令调用。与之前示例（结果返回 1 或-1）类似，使用`imdb`模型会为每个分析事件返回 1\
  \ 到 10 之间的数值。\n\n要评估创建模型的效果，需进行测试。为此需要测试数据，且测试数据必须与训练数据不同。测试数据的分类方式应与训练数据相同，这样测试程序才能知道预期结果。随后测试程序会运行模型，将预测结果与预期结果进行比较。测试数据语料库越大，模型准确率的可信度越高。通常会将约\
  \ 10%的训练数据专门留作测试用途。\n\n应用自带的 Twitter 模型也包含测试数据，分类为 2,000 条积极推文和 2,000 条消极推文。当我们用这些测试数据运行\
  \ Twitter 模型的测试程序时，准确率为 69.09%，这被认为相当不错。此外，测试程序还会给出计算的误差范围，在此例中为 1.11%。\n\n为更好理解训练和测试流程，我们将获取一个语料库并演示完整过程。经过网络搜索，我们找到了一个有趣的\
  \ Twitter 语料库候选。该语料库由 Niek Sanders 创建，包含 5,513 条推文，由作者分为积极、消极、中性和无关四类。此外，语料库按主题标注了\
  \ Apple、Google、Microsoft 和 Twitter，意味着推文中包含这些关键词。由于 Twitter 服务条款的限制，实际推文不能随情感语料库一起分发，但作者提供了\
  \ Python 程序，可按照 Twitter 规则（本例中每 28 秒下载一条推文，总耗时约 43 小时）下载推文。文档中作者对分类标准有详细说明。该语料库可在以下地址找到：\n\
  \n```\nhttp://www.sananalytics.com/lab/twitter-sentiment/\n```\n\n我们下载了语料库和推文，然后手动提取了积极、消极和中性推文，并删除了标签（主题、情感、推文\
  \ ID 和时间戳）。下一步是创建三个测试文件。由于语料库相对较小，我们决定从正在使用的数据中提取推文自行创建测试文件，并将它们分为三类，每类十条推文。\n\n\
  现在拥有了包含训练和测试数据的必要文件，我们将说明创建和测试 Sanders 模型的步骤。由于训练和测试程序用 Python 编写，几乎可以在任何操作系统上运行。我们将在\
  \ Linux 系统上演示该流程。鉴于应用目前处于实验阶段，程序并非十分用户友好。假设`$SPLUNK_HOME`包含 Splunk 的安装路径，请切换目录并按如下方式创建新的子目录：\n\
  \n```\ncd $SPLUNK_HOME/etc/apps/sentiment/training_data\nmkdir sanders\nmkdir sanders/train\n\
  mkdir sanders/test\n```\n\n\n\n### 复制训练文件\n\n将正面训练文件复制到 `sanders/train` 子目录下，命名为\
  \ `1.txt`，中性训练文件命名为 `0.txt`。同时将负面训练文件复制到 `sanders/train` 子目录下，命名为 `-1.txt`。操作时需注意，许多\
  \ Unix 命令不接受以减号（`-`）开头的文件名。如果与文件处于同一目录，每次引用该文件时请使用以下表示法：`./-1.txt`。\n\n对测试文件重复复制过程，但将它们复制到\
  \ `sanders/test` 子目录下。记得相应命名为 `1.txt`、`0.txt` 和 `-1.txt`。切换目录并按如下方式运行程序以训练数据：\n\n\
  ```\ncd $SPLUNK_HOME/etc/apps/sentiment/bin\npython train.py train sanders m_sanders\n\
  ```\n\n`train.py` 程序可用于训练和测试，因此我们指定将使用 `sanders` 子目录中的数据进行训练，它将创建一个名为 `m_sanders`\
  \ 的模型。该程序的输出消息可在图 14-10 中找到。\n\n![9781430257615_Fig14-10.jpg](img/9781430257615_Fig14-10.jpg)\n\
  \n图 14-10. 训练程序的输出\n\n如图 14-10 所示，通过移除罕见词和弱相关词，令牌数量得以减少。这些操作可以作为训练程序中的选项进行选择，将在本章后面部分进行回顾。您应当注意，训练程序不仅创建模型，还创建一个包含训练数据中令牌的查找表，每个令牌都带有预期的情感评分。将此查找表视为可用于基本情感分析或其他相关目的的额外收获。\n\
  \n我们非常想了解此模型与应用程序附带模型的比较情况，因此我们进行测试。为此，我们输入 `python train.py test sanders m_sanders`，输出结果可在图\
  \ 14-11 中看到。\n\n![9781430257615_Fig14-11.jpg](img/9781430257615_Fig14-11.jpg)\n\n\
  图 14-11. 测试程序的输出\n\n准确率为 21.21%，我们对这个语料库并不满意。低准确率可归因于该语料库相比情感分析应用程序附带的 Twitter 语料库（几乎大\
  \ 70 倍）规模较小。另一个需要考虑的问题是，与 Twitter 模型的 4000 条推文相比，我们的测试数据极少。此外，训练程序中内部选项的设置也可能产生影响，但这将在本章后面讨论。\n\
  \n我们可以用 Twitter 模型的测试数据测试 Sanders 模型，看看准确率是否变化。这将会很有趣，因为测试数据比训练数据更大。为了测试，我们在 Unix\
  \ 提示符下输入以下命令：\n\n```\npython train.py test twitter m_sanders\n```\n\n结果更加令人沮丧，准确率降至\
  \ 11.67%。请注意，我们只是更改了测试数据，并未更改模型。这表明模型对训练和测试数据的数量与质量有多么敏感。出于好奇，我们再次运行了“爱、恨与贾斯汀·比伯”仪表板，这次使用了\
  \ Sanders 模型。结果截然不同，可在图 14-12 中看到。与图 14-9 中呈现的结果相比，爱和贾斯汀·比伯为中性，恨为略负面。\n\n![9781430257615_Fig14-12.jpg](img/9781430257615_Fig14-12.jpg)\n\
  \n图 14-12. 使用 Sanders 模型的爱、恨与贾斯汀·比伯\n\n为了理解模型对预测情感的影响，我们使用 `sentiment` 命令对 Twitter\
  \ 模型和 Sanders 模型进行了快速比较。由于后者模型更偏向技术话题，我们选择分析前 1000 条包含“twitter”一词的推文。使用附带的 Twitter\
  \ 模型，情感值为 0.35，而使用 Sanders 模型则为 -0.08。这是一个巨大的差异，从积极的下限滑入了中性的负面区域。这是模型敏感性的另一个例子。\n\
  \n为了探究更大的语料库是否能提高模型准确率，我们再次搜索了互联网。这次我们偶然发现了 Ibrahim Naji 的博客，他将 Sanders 语料库与密歇根大学\
  \ Kaggle 竞赛中创建的一个非常大的语料库进行了合并。两个来源的 URL 如下：\n\n```\nhttp://thinknook.com/twitter-sentiment-analysis-training-corpus-dataset-2012-09-22/\n\
  ```\n\n```\nhttp://inclass.kaggle.com/c/si650winter11\n```\n\n下载语料库、删除标签并创建正面和负面文件后，我们从每个文件中提取了\
  \ 50,000 条记录作为测试数据。最终统计结果是，该语料库包含 740,185 条正面推文和 738,442 条负面推文，总计 1,478,627 条训练推文。创建模型后，我们使用手头的三组\
  \ Twitter 测试数据对其进行了测试。结果见表 14-1。\n\n表 14-1. 密歇根大学 Twitter 语料库的准确率\n\n| 测试数据 | 准确率\
  \ | 误差幅度 |\n| --- | --- | --- |\n| 密歇根大学 | 72.49% | 1.05% |\n| Twitter（应用程序附带） |\
  \ 68.79% | 1.12% |\n| Sanders | 60.61% | 0.76% |\n\n基于这些结果，假设极性分类质量较高，那么语料库越大，模型准确率似乎越高。但在宣布优胜者之前，我们应该回顾一下\
  \ Twitter 模型在密歇根大学测试数据上的准确率。为了进行比较，我们在表 14-2 中展示了使用情感分析应用程序附带的 Twitter 语料库对我们手头三组测试数据集进行测试的结果。\n\
  \n表 14-2. 情感分析应用程序附带 Twitter 语料库的准确率\n\n| 测试数据 | 准确率 | 误差幅度 |\n| --- | --- | ---\
  \ |\n| 密歇根大学 | 64.41% | 1.19% |\n| Twitter（应用程序附带） | 69.09% | 1.11% |\n| Sanders\
  \ | 57.57% | 0.84% |\n\n再次表明，越大越好，并且有趣的是，每个模型在自己的测试数据上表现更佳。问题在于，更大的模型天生更慢且占用更多内存。这些是在做决策时需要权衡的要点。在结束本节时，我们提醒您，良好预测的关键在于训练数据的质量。\n\
  \n### 世界情感指标项目\n\n在回顾了如何基于 Twitter 衡量情感并看到其流行程度后，我们认为应该提出一个不涉及推文的项目来衡量情感。可以说，报纸可以被视为最初的社交媒体，因此它成为衡量情感的一个有趣替代方案。几乎所有报纸、期刊出版物和电视台都拥有网站，这些网站免费提供新闻，或基于提供不同级别受限访问权限的付费墙。此外，还有许多仅存在于互联网上的新闻媒体。\n\
  \n\n\n## RSS 新闻源与情感分析项目概述\n\n大多数新闻网站都提供一项服务，新闻头条会不断更新并向公众开放。该服务基于一种称为 RSS（Rich Site\
  \ Summary，也称为 Really Simple Syndication）的格式。RSS 文档（通常称为 RSS 源或简称为源）使用标准化的 XML 格式，我们稍后将对其进行介绍。RSS\
  \ 源的使用不仅限于新闻网站；任何想要分发或联合发布内容的网站（例如博客和其他在线发布者）也使用 RSS 来分发不仅是新闻，还包括播客和视频等其他媒体。提供此服务的网站会显示一个\
  \ RSS 链接，通常带有一个小图标和缩写 RSS、XML 或 RDF，以告知用户有可用源。这种典型的橙色图标示例如图 14-13 所示。\n\n![9781430257615_Fig14-13.jpg](img/9781430257615_Fig14-13.jpg)\n\
  \n图 14-13 RSS 图标\n\nRSS 源可以使用名为 RSS 阅读器、源阅读器或聚合器的程序读取。用户可以指示阅读器订阅多个源。这意味着阅读器程序会定期（例如每小时）读取所需网站上的\
  \ RSS 文档。这些阅读器程序（从非常简单到功能丰富的都有）允许用户按自己的意愿组织头条，从而创建自己的出版物。RSS 源仅携带头条和一些附加信息。要阅读实际的新闻文章，用户点击包含的链接，该链接会将其带到原始网站。\n\
  \n每个新闻网站的布局都不同，RSS 源也是如此。有些网站只有最新新闻的一个源，而其他网站则提供多个按主题（例如国内、商业、国际、体育等）分类的源。\n\n有趣且使本项目可行的是，世界各地大量主要语言非英语的新闻网站都提供一个或多个英语源。诚然，新闻条目的撰写方式取决于文章和头条的作者，但同一新闻条目的不同变体可能会导致情感感知从一个极性变为另一个极性。我们将在讨论本项目的训练语料库时更详细地讨论这一点。\n\
  \nRSS 文档包含一些描述源（技术上称为频道）的字段，以及每个新闻条目的另一组字段。尽管存在 RSS 和 Atom 两种标准，但并非所有网站都完全遵守它们，尤其是在每个字段中放置的内容方面。RSS\
  \ 源中典型的新闻条目字段列于表 14-3 中。\n\n表 14-3 典型的 RSS 条目字段\n\n| 字段 | 描述 |\n| --- | --- |\n\
  | `title` | 新闻头条 |\n| `description` | 新闻条目的摘要。内容差异很大，从空值、重复标题到整篇新闻文章 |\n| `content`\
  \ | 并不总是存在。与 `description` 字段一样，内容差异很大 |\n| `link` | 网站上文章的链接 |\n| `pubDate` | 网站发布新闻条目的时间戳\
  \ |\n\n还有其他字段，如 `author`、`copyright`、`category` 和 `image`，但并未广泛使用。就本项目而言，`title`\
  \ 字段应已足够，因为这是我们预测情感所需的全部内容。通过选择来自世界各地的英语 RSS 新闻源，我们应该能够获得一个相当好的样本来预测全球普遍情感。本项目需要执行的步骤如下：\n\
  \n- 收集 RSS 源\n- 将头条索引到 Splunk 中\n- 定义情感语料库\n- 创建结果的可视化\n\n### 收集 RSS 源\n\n理想的解决方案是拥有一个能够完成此任务的\
  \ Splunk 应用，但这需要我们编写该应用，很可能使用 Python 语言，这超出了本书的范围。因此，我们需要寻找收集 RSS 源的替代方法。我们查看了各种\
  \ RSS 阅读器和聚合器，但都没有提供将头条存储到文件中的方法，而文件随后可用于在 Splunk 中进行索引。扩大搜索范围后，我们发现了一个名为 Feedory\
  \ 的开源应用程序，它可以收集 RSS 源并将其存储在数据库中。该应用程序使用 PHP 编写，可在以下网址找到：\n\n```\nhttp://sourceforge.net/projects/feedory/\n\
  ```\n\n安装非常简单，将其连接到我们的 MySQL 数据库也轻而易举。我们发现唯一的缺点是，对于读取的每个新闻条目，它都会生成一个警告，因为它使用了一个旧版本的库。这很烦人，但似乎不影响应用程序。主页面截图见图\
  \ 14-14。\n\n![9781430257615_Fig14-14.jpg](img/9781430257615_Fig14-14.jpg)\n\n图 14-14\
  \ Feedory 的主页面\n\n如图 14-14 所示，源或频道的命名相当不一致。印度尼西亚的安塔拉通讯社和泰国的曼谷邮报明确指定了其 RSS 源的主题，而奥地利时报则没有。如前所述，一些网站只有一个通用的英语源；在此例中，有卡塔尔的半岛电视台、伊拉克的\
  \ Azzaman 和阿根廷的布宜诺斯艾利斯先驱报。您还可以看到最后一个条目，它有一个徽标和单词 Business；这信息量不大。事实证明，这个源来自休斯顿纪事报，但我们之所以能弄清楚，是因为我们将鼠标悬停在第四列的\
  \ RSS 徽标上，该徽标对应于原始 URL，并显示了该源的 URL。这些不一致性也体现在构成 RSS 源的其他字段中。\n\n我们为 Feedory 订阅了来自全球约\
  \ 100 个网站的 150 多个新闻源。我们的选择是国际、世界和商业新闻；当这些不可用时，我们就订阅通用源。源列表可在本书的下载包中的 `world_sentiment.opml`\
  \ 文件中找到。OPML 格式是专门为交换 RSS 源的 URL 而设计的。Feedory 或任何 RSS 阅读器都可以读取此文件并自动订阅这些源。\n\n为了定期获取\
  \ RSS 源，我们使用 Unix 的 `crontab` 命令每 15 分钟执行一次 Feedory 更新程序：\n\n```\n0,15,30,45 * *\
  \ * * /usr/bin/php /var/www/html/feedory/feedstore.php\n```\n\n### 将头条索引到 Splunk\
  \ 中\n\n我们已经在第 9 章中解释了如何从数据库进行索引，当时我们是从 MySQL 数据库加载航空数据。不同之处在于，那一章我们进行了一次性加载，而这次我们将进行“尾部”加载，即我们定期访问数据库并获取最新的新闻头条。在此之前，我们需要回顾\
  \ Feedory 在数据库中创建的表和字段。然后我们可以决定要将哪些字段加载到 Splunk 中。Feedory 创建了两个表：`fy_feeds`，其中包含我们订阅的\
  \ RSS 源列表；以及 `fy_items`，其中保存实际的新闻条目。由于我们只对新闻条目感兴趣，我们将重点关注 `fy_items` 表的字段，这些字段在图\
  \ 14-15 中展示。\n\n![9781430257615_Fig14-15.jpg](img/9781430257615_Fig14-15.jpg)\n\n\
  图 14-15 `fy_items` 数据库表的描述\n\n\n\n### `id` 字段及其作用\n\n`id` 字段将是本项目中的关键，因为 DB 连接应用（DB\
  \ Connect App）会利用它来追踪上次加载到 Splunk 的最新条目是哪一个。`title` 字段包含我们需要的新闻标题。我们将忽略 `description`\
  \ 和 `content` 字段，但会保留 `link` 字段，因为我们可以从中提取新闻的来源网站。如前所述，`author` 字段使用并不广泛，因此我们不会加载它。`postid`\
  \ 字段包含了访问文章链接的变体，因此我们也会忽略它。\n\n### `date` 字段与时间戳处理\n\n与往常一样，`date` 字段需要更详细的审视。我们首先要检查的是\
  \ RSS 订阅源中的时间戳是如何设置的。然后，我们需要了解数据库是否对时间戳进行了任何转换。在审查了随机选择的十几个 RSS 订阅源后，我们得出结论：它们在\
  \ `pubDate` 字段中都提供了格式良好的时间戳；日期格式如下：`Wed, 13 Feb 2013 01:22:59 +800`。唯一的区别在于时区格式，但它们始终符合标准。接着，我们检查了之前所选\
  \ RSS 订阅源中的特定新闻条目，并将其原始时间戳与数据库中的时间戳进行了对比；我们注意到数据库已将它们统一为 GMT 时区。基于此，我们决定使用数据库中的\
  \ `date` 字段作为 Splunk 中头条新闻的时间戳。因为我们处理的是来自世界各地的信息，使用 GMT 时区将更为方便。\n\n### 定义数据库连接\n\
  \n确定好所需的字段后，我们可以在 Splunk 中进行必要的定义。首先，我们将数据库连接名称定义为 `RSS`，如图 14-16 所示。您可以从用户界面的任何页面，点击右上角的“管理（Manager）”选项卡，然后选择“外部数据库（External\
  \ Databases）”选项，再点击“新增（Add new）”来进入该界面。\n\n![9781430257615_Fig14-16.jpg](img/9781430257615_Fig14-16.jpg)\n\
  \n图 14-16. 定义数据库连接\n\n### 创建数据输入\n\n现在，我们已经建立了一个直接连接到 Feedory RSS 数据库的连接，接下来可以定义\
  \ Splunk 数据输入，以便定期抓取新闻。在与 Feedory 的测试过程中，我们注意到它每小时会从我们订阅的所有 RSS 订阅源中抓取大约 100 条新闻头条，因此数据量足以让\
  \ Splunk 每 15 分钟更新一次。\n\n要进入数据输入页面，请点击用户界面右上角的“管理（Manager）”选项卡，然后选择“数据输入（Data inputs）”；在该页面中，点击“数据库输入（Database\
  \ Inputs）”选项右侧的“新增（Add new）”链接。这将带您进入图 14-17 所示的界面。\n\n![9781430257615_Fig14-17.jpg](img/9781430257615_Fig14-17.jpg)\n\
  \n图 14-17. 用于从数据库提取 RSS 新闻条目的 SQL 查询\n\n图 14-17 展示了定义界面的前半部分。如您所见，我们将输入命名为 `News_Feed`，并将其定义为尾追（tail）类型。该查询选择了我们想要加载到\
  \ Splunk 中的字段，外加 `id` 字段，该字段将用作递增列，以追踪最后加载的记录。DB 连接应用（DB Connect App）会将查询中的问号（`?`）替换为相应的数字。双花括号（`{}`）括起来的部分是查询首次运行时不会使用的部分。定义此输入所需的其余信息如图\
  \ 14-18 所示。\n\n![9781430257615_Fig14-18.jpg](img/9781430257615_Fig14-18.jpg)\n\n\
  图 14-18. 补充定义\n\n图 14-18 展示了数据输入界面的第二部分，我们可以在其中定义源类型、索引和主机字段值。在这种情况下，我们无需定义源类型，因为我们将使用键值对输出选项。这将为我们从数据库提取的每个值都提供一个字段名。正如第\
  \ 9 章中提到的，这是为 Splunk 提供数据以便索引的最高效方式。在此界面中，我们还可以定义包含时间戳的字段以及我们希望 Splunk 抓取数据的间隔时间，即每\
  \ 15 分钟一次。\n\n保存这些选择后，Splunk 连接到 Feedory 数据库，提取所有记录，并将其加载到 `rss` 索引中。从那时起，它只提取和加载自上次之后新增的记录。照例，我们在\
  \ Splunk 中审查事件，以确保我们拥有预期的字段。我们在用户界面的搜索栏中输入 `index=rss | head`，输出结果如图 14-19 所示。\n\
  \n![9781430257615_Fig14-19.jpg](img/9781430257615_Fig14-19.jpg)\n\n图 14-19. Splunk\
  \ 中的 RSS 新闻头条\n\n时间戳是正确的，我们需要的每个字段都存在，并且字段名位于值之前。这些值也是每个字段所预期的值。主机名正确，源类型反映了我们选择使用键值对输出。通过这次快速的审查，我们确信\
  \ RSS 新闻头条已被正确地索引到 Splunk 中。\n\n## 定义情感语料库\n\n基于我们本章前面学到的内容，这是项目的关键部分。新闻头条的问题在于，作者和编辑力求令其标题对潜在读者具有吸引力。在此过程中，他们可能会改变新闻条目的感知情感。例如，表\
  \ 14-4 包含了同一新闻条目的几个头条标题以及我们个人的情感分类。\n\n表 14-4. 某新闻条目的情感示例\n\n| 头条标题 | 情感 |\n| ---\
  \ | --- |\n| 教皇本笃十六世宣布辞职 | 中性 |\n| 教皇“太虚弱”无法继续履职 | 负面 |\n| 教皇辞去天主教会领袖职务 | 中性 |\n\
  | 教皇因健康原因辞职 | 负面 |\n\n如您所见，情感分类是一个极其主观的命题。教皇本笃十六世于 2013 年 2 月宣布辞职的新闻，出于多种原因通常可以被视为中性，而所有这些原因都可能存在争议。从我们的角度来看，这条新闻与世界上的部分人口相关，而对其他人则无关紧要；因此，我们将其归类为中性。我们将另外两条归类为负面，是因为健康状况不佳通常可以被认为偏向负面情感。\n\
  \n作为此过程的一部分，了解我们所处理的新闻头条的特点将大有裨益。与推文不同，头条标题是由专业作者撰写的，因此不应存在拼写错误或俚语。此外，也不应出现任何奇怪的字符、词语延长或表情符号。总的来说，新闻头条是我们可以期望从文本中得到的最干净的数据。为了查明头条标题的平均字符数，我们执行了以下搜索：\n\
  \n```\nindex=rss\n| eval chars=len(title)\n| stats avg(chars)\n```\n\n这个简单搜索的结果是\
  \ 47.79 个字符。为了查明头条标题的平均单词数，我们输入了以下搜索：\n\n```\nindex=rss\n| makemv title\n| eval\
  \ words=mvcount(title)\n| stats avg(words)\n```\n\n\n\n此搜索将标题转换为多值字段，其中每个值都是一个单词，因为\
  \ `makemv` 命令的默认分隔符是单个空格。`eval` 命令使用 `mvcount` 函数来统计所有值的数量，在此例中即单词的数量。结果显示，每个标题平均包含\
  \ 7.6 个单词。当我们将这些数字与本章开头提到的 Go 等人论文中的发现（每条推文 14 个单词或 78 个字符）进行比较时，我们的标题要短得多，几乎只有推文的一半大小。有了这些信息，我们可以考虑为训练语料库做出几种选择：\n\
  \n*   基于新闻标题创建我们自己的语料库\n*   使用现有的 Twitter 语料库\n*   使用电影评论语料库\n\n对于第一个选项，我们花了几个小时创建训练和测试文件。这是一个枯燥的过程，我们只为每个训练文件生成了\
  \ 100 个标题，为每个测试文件生成了 10 个标题。我们还可以证实一个普遍的看法：在我们处理此任务的这段时间里，正面新闻很少，并且主要出现在商业新闻版块。我们在新闻标题中发现的另一个特点是，其中很大一部分可以被视为中性，因此理想情况下，我们的语料库除了正面和负面文件之外，还应包含一个中性文件。基于我们本章前面所做的测试，我们可以预测这个语料库的质量不会很好。为了充分利用它，我们将尝试训练程序提供的一些选项，这些选项在表\
  \ 14-5 中进行了描述。\n\n表 14-5. 训练选项\n\n| 名称 | 描述 |\n| --- | --- |\n| phrases | 定义是使用短语（例如“United\
  \ States”）还是仅使用单个词元（例如“United”、“States”） |\n| remove_stopwords | 排除位于停用词列表中的单词 |\n\
  | dedup | 定义是否应从文本中消除重复单词，从而降低它们的权重 |\n| stem | 是否对一个单词进行词干提取，即还原为其词根形式。例如，单词 stemmer、stemming\
  \ 和 stemmed 将被还原为 stem。 |\n| punct | 定义是否关注“!”或“?”字符 |\n| emo | 是否包含表情符号 |\n| min_term_percent\
  \ | 定义我们愿意接受的最小词项出现频率。默认是接受至少在 200 个标题、推文或评论中出现 1 次的词项（5%）。 |\n\n在撰写本文时，这些选项必须在训练程序中更改。由于组合方式数不胜数，我们将重点关注其中几个，并首先将\
  \ `dedup` 和 `stem` 定义为 false，因为我们希望保留尽可能多的单词。这样做的原因是因为我们的语料库相当小。我们还将把 `punct` 和\
  \ `emo` 定义为 false，因为标题不包含表情符号，而且我们个人认为“!”和“?”实际上不会影响情感。最后，通过将 `min_term_percent`\
  \ 变量设置为 none，我们接受所有单词，无论它们多么罕见。尽管这可能基于错误的假设，我们还是通过每次更改 `phrases` 和 `remove_stopwords`\
  \ 选项中的一个来训练和测试我们的最小新闻语料库。在训练和测试了四种选项组合后，我们发现它们的准确率完全相同，只有 38.89%。虽然这在意料之中且令人沮丧，但这些结果是合理的，因为标题太短了，以至于任何单词出现在停用词列表中的可能性都很小。出于同样的原因，我们可以预期，将单词作为短语或单个词元来分析不会带来太大的差异。\n\
  \n我们的第二个选项是使用现有的 Twitter 语料库。我们之前尝试过两个：情感分析应用附带的一个，以及密歇根大学语料库。虽然领域或格式不同，但由于它们都基于短文本消息，因此具有些许相似性，我们需要测试它们以满足我们的好奇心。我们用它们各自的数据训练了这两个语料库，并用我们用于新闻模型训练的数据进行了测试。使用\
  \ Twitter 模型的结果显示准确率为 40.80%，而密歇根大学语料库的准确率为 43.81%。很明显，更大的语料库会产生更好的准确率，即使提升幅度很小。然而，低准确率也表明，语料库必须基于将要进行情感分析的数据所处的相同领域和格式。\n\
  \n为了完成研究周期，我们将利用 Pang 和 Lee 在本章前面提到的论文所做的实验中提供的电影评论语料库。除了极性范围语料库之外，还有一个基于简单极性的版本。您可以在以下位置找到这些语料库：\n\
  \n`http://www.cs.cornell.edu/people/pabo/movie-review-data/`\n\n我们下载、准备、训练并测试了极性数据集\
  \ 2.0 版，该版本包含正面和负面评论各 1000 条。我们期望获得比 Twitter 语料库更高的准确率，尽管领域或格式不同。这是因为这些评论基于大量的词汇，这可能更接近于新闻标题。令人惊讶的是，准确率下降到了\
  \ 36.79%，是所有语料库中最差的。\n\n考虑到我们过于简化的语料库（正面、负面和中性各 100 条）与其他语料库相比产生了可观的准确率，我们决定再花几个小时来扩大语料库的规模。新版本每个类别包含\
  \ 200 个新闻标题。当我们测试这个新模型时，我们惊讶地发现准确率提升了近九个百分点，达到 47.22%。这证明了使用与分析数据相同的数据训练语料库是所有选项中的最佳选择。我们在表\
  \ 14-6 中列出了语料库测试的最终结果汇总。\n\n表 14-6. 新闻模型的准确率\n\n| 模型 | 准确率 | 误差幅度 |\n| --- | ---\
  \ | --- |\n| 新闻 (300 个标题) | 38.89% | 1.02% |\n| 新闻 (600 个标题) | 47.22% | 1.05% |\n\
  | Twitter | 40.80% | 1.16% |\n| 密歇根大学 | 43.81% | 1.11% |\n| 电影评论 | 36.79% | 1.23%\
  \ |\n\n显然，我们将使用基于我们扩展语料库的模型。如果模型之间的差异很小，比如在 3% 的误差范围内，我们很可能会选择我们的新闻模型，因为它更小、更快。为了测试一下我们的模型，我们在\
  \ 10,000 个标题的样本上运行它，结果显示为 -0.35，符合我们的预期。根据我们在创建训练语料库时对标题的广泛审阅，新闻标题主要是中性的，带有轻微的负面倾向。\n\
  \n## 结果可视化\n\n世界情感指标可以提供许多信息。除了显示最近一段时间的情感之外，我们还可以呈现一个历史图表，它可以提供过去趋势的视图。我们还可以展示一些最近的标题，以及我们预测的情感，还有新闻来源。最后，我们还可以有一个精细打印部分，说明预测的准确率和用于计算最近情感指标的标题数量。所有这些可视化内容都可以放置在一个仪表板中。\n\
  \n\n\n为了显示情感分析结果，我们可以使用本章前面构建的仪表盘。为此，我们将计算过去一小时新闻标题的情感得分。对于历史情感趋势，我们可以使用基于过去 24\
  \ 小时的折线图。到目前为止，这些都是一些非常简单的搜索，但对于显示最新新闻标题的表格来说，情况会稍微复杂一些。复杂之处在于定义正则表达式，该表达式将从新闻文章的链接中提取网站的域名。搜索语句如下：\n\
  \n```\nindex=rss\n| rename title as Headline\n| sentiment news Headline\n| eval\
  \ Sentiment=case(sentiment==1, \"Positive\",\n                      sentiment==0,\
  \ \"Neutral\",\n                      sentiment==-1, \"Negative\")\n| rex field=link\
  \ \"http:\\/\\/(?<Source>[^\\/]*)\"\n| table Headline, Sentiment, Source\n```\n\n\
  我们首先重命名`title`字段，使其在表格中作为表头能更美观地显示。我们使用`eval`命令的`case`函数将情感数值转换为更易读的文本，最后通过`rex`命令，使用正则表达式捕获`http://`之后、下一个斜杠（`/`）之前的内容到`Source`字段，从而提取域名。请注意，斜杠字符在正则表达式中具有特殊含义；因此，我们通过在其前面放置一个反斜杠字符（`\\\
  `）来转义它。\n\n对于详细摘要信息，我们将使用一种仅在仪表盘上可用的可视化组件，即“单值”显示。在仪表盘中定义面板时，可以在可视化组件列表中选择“Single\
  \ Value”。弹出的对话框如图 14-20 所示。在这里，除了面板标题外，您还可以定义将放置在单值前后显示的文本。\n\n![9781430257615_Fig14-20.jpg](img/9781430257615_Fig14-20.jpg)\n\
  \n图 14-20. 单值可视化对话框\n\n我们使用的搜索语句非常简单，如图 14-21 所示，它展示了搜索的对话框。在此图中，您还可以看到所选的时间范围，该范围是从当前时间回溯\
  \ 1 小时，即从搜索执行那一刻开始的过去一小时。\n\n![9781430257615_Fig14-21.jpg](img/9781430257615_Fig14-21.jpg)\n\
  \n图 14-21. 单值搜索对话框\n\n当我们把这些面板组合到一个名为`WorldSentimentIndicator`的仪表盘中时，就得到了项目的最终可视化效果，如图\
  \ 14-22 所示，您也可以在其中看到显示不那么详细摘要信息的单值显示。\n\n![9781430257615_Fig14-22.jpg](img/9781430257615_Fig14-22.jpg)\n\
  \n图 14-22. 世界情感指示器仪表盘\n\n剩下的唯一事情是我们希望这个仪表盘每 15 分钟自动刷新一次。为此，我们需要编辑定义仪表盘的 XML 文件。这并没有听起来那么困难。只需按照以下步骤操作即可。从用户界面的搜索屏幕中，从“Dashboards\
  \ & Views”下拉菜单中选择“Manage views”选项，如图 14-23 所示。\n\n![9781430257615_Fig14-23.jpg](img/9781430257615_Fig14-23.jpg)\n\
  \n图 14-23. 选择管理视图\n\n进入“Manage Views”页面后，您将看到所有视图的列表。找到`WorldSentimentIndicator`并点击它。这将打开一个包含仪表盘配置\
  \ XML 定义的页面。第二行包含字符串`<dashboard>`，您需要通过在结束符号前添加以下内容来修改它：`<dashboard refresh=900>`。最终的修改结果如图\
  \ 14-24 所示。该指令表明我们希望仪表盘每 900 秒自动刷新一次，即 15 分钟。\n\n![9781430257615_Fig14-24.jpg](img/9781430257615_Fig14-24.jpg)\n\
  \n图 14-24. 为仪表盘添加自动刷新功能\n\n一旦您点击页面右下角的保存按钮，仪表盘将开始每 15 分钟自动刷新一次。您可以在`http://www.opallios.com`找到该项目的最新版本，我们会在那里继续扩大训练语料库，力求提高世界情感指示器的预测准确率。\n\
  \n## 总结\n\n在本章中，您学习了分析情感的原因。然后，我们下载并使用了情感分析应用。您还了解了与创建情感模型和训练语料库相关的所有问题，以及使用将要分析的数据来获得更高预测准确率的重要性。接着，我们研究了世界情感指示器项目，该项目引导我们如何从世界各地收集\
