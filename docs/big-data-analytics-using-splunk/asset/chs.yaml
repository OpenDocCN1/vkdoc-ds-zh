  的目录监控功能足够智能，能够应对这些实际用例，因为它可以在索引之前解压目录中的压缩文件。它还可以自动检测日志轮转，并跟踪最后被索引的日志条目所在位置；这样它就可以从该点开始处理。这在
  Splunk 重启或执行维护任务时非常有用。


  ## 网络数据源


  许多系统应用和网络设备（如路由器和交换机）通过使用 TCP 或 UDP 协议的网络端口来中继事件。一些应用程序使用 SNMP 标准通过 UDP 发送事件。Syslog
  是计算机数据日志记录的标准，是另一组数据源，其中包含大量可在网络端口级别捕获的信息。可以启用 Splunk 来接收来自 TCP 或 UDP 端口的输入。为此，您可以使用
  Splunk Web 用户界面配置一个网络输入源，您只需指定主机、端口和源类型即可。保存配置后，Splunk 将开始索引来自指定网络端口的数据。这种网络输入可用于捕获在远程机器上生成的
  syslog 信息，而该数据并不驻留在 Splunk 实例本地。Splunk 转发器也可用于在远程主机上收集数据。我们将在本章的最后部分讨论转发器。


  ## Windows 数据


  Windows 操作系统会产生大量日志文件，其中包含有关 Windows 事件、注册表、Active Directory、WMI、性能和其他数据的信息。Splunk
  将 Windows 日志流识别为一种源类型，并允许添加一个或多个此类日志流作为输入进行索引，以供进一步处理和分析。尽管可以单独配置诸如 Active Directory
  等 Windows 数据源，但 Splunk 提供了一种更好、更简单的方法来处理这些 Windows 日志或事件，即使用 Splunk App for Windows
  或 Splunk Technology Add-on for Windows。我们将在本章后面探讨这一点。


  ## 其他数据源


  Splunk 支持将脚本作为从其他未提供特定默认配置的数据源获取数据的机制。脚本可以接触的数据类型没有限制，只要脚本的输出可以作为 Splunk 能够理解或可以调整使其理解的输入提供即可。例如，可以从数据库获取数据的脚本，或者可以从
  Twitter 获取数据的脚本——我们将在第 12 章中探讨这个例子。Technology Add-ons 也可能使用脚本来获取数据，但它们提供了一种抽象，带来了附加价值，使得将数据导入
  Splunk 以进行进一步处理和分析变得容易。这为我们快速概述 Splunk 应用程序和附加组件提供了一个很好的机会。


  ## 应用程序和附加组件


  Splunk 用户界面默认为“搜索”应用程序。然而，Splunk 被设计为一个平台，作为基础设施，第三方开发人员或 ISV 可以在此基础上构建提供 Splunk
  扩展功能的专用应用程序。构建这些扩展有两种方式：应用程序和 Technology Add-ons。




  Splunk 应用程序将扩展功能与标准功能（如已保存搜索、仪表板和已定义的输入）打包在一起。此外，它们还捆绑了在 Splunk 用户界面之上构建的自己的用户界面。相比之下，插件（或简称为
  TA）是比应用程序更小的组件，它们包含附加功能，但没有自己的用户界面。我们将不得不使用标准的 Splunk 搜索应用程序来查询通过插件配置的已索引数据。任何具备一定编程知识的人都可以编写应用程序和插件。Splunk
  拥有一个充满活力的社区，不断创建和分享应用程序和插件。它托管在 `http://splunk-base.splunk.com/apps/` 上。在附录 B 中，您将找到一份可在企业中使用的有用应用程序和插件列表。


