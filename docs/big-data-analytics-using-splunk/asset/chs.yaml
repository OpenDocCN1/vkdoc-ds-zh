  \ 状态的信息。安全仪表板提供 AD 安全配置文件和操作的信息。此外，该仪表板还提供登录失败、试图破坏用户安全设置、用户利用率等信息，并显示环境中所有 AD 对象的审计和报告。预构建的审计报告提供用户、计算机、组和组策略对象的当前状态详情。变更管理仪表板提供对\
