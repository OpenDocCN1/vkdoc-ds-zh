- "# 扩展与高可用性\n\n到目前为止，本书中的所有示例和项目都基于使用单个 Splunk 实例，该实例同时充当索引器和搜索器。在本章中，我们将回顾如何通过添加更多服务器来处理索引和搜索组件，从而扩展\
  \ Splunk。您还将学习集群的基本原理，它通过处理索引器的自动故障转移来提高 Splunk 的弹性。我们将建立一个示例集群来说明此过程的基本步骤。\n\n\
  ## 扩展 Splunk\n\nSplunk 的功能大致可以分为三个基本领域：\n\n-   收集数据\n-   索引收集到的数据\n-   在已索引的数据中搜索信息\n\
  \nSplunk 的强大功能之一在于您可以分离这些功能区域并分别对它们进行扩展。在第 15 章中，您学习了如何通过使用转发器将数据收集扩展到远程服务器（无论是基于\
  \ Unix 的系统还是 Windows 服务器）；您还回顾了一些涉及使用转发器的典型拓扑结构。在本章中，我们将回顾如何单独或组合地扩展索引和搜索功能。\n\n\
  扩展任何一个功能都有多种理由。如果您有数百个转发器向单个 Splunk 实例发送信息，根据它们发送的数据量，单个实例可能会迅速成为瓶颈，因此您可以添加另一个 Splunk\
  \ 实例来协助分担负载。这样做的一个优点是，转发器可以将数据分发到两个实例上，有助于扩展。另一个优点是该分发隐式地为转发器创建了故障转移能力。当一个 Splunk\
  \ 实例宕机时，转发器会自动切换到另一个实例。这种拓扑结构可以在图 16-1 中看到。\n\n![9781430257615_Fig16-01.jpg](img/9781430257615_Fig16-01.jpg)\n\
  \n图 16-1. 多个转发器在两个索引器上负载均衡数据\n\n\n\n### 分布式搜索配置\n\n图 16-1 展示的拓扑结构虽然是有效的，但它引发了一个问题：每个\
  \ Splunk 实例只会拥有部分已索引数据。在一个实例上执行搜索时，只会搜索该实例所索引的数据部分，而不是全部数据。为了能够搜索两个实例上的所有已索引数据，必须使用分布式搜索。这并不像听起来那么困难，只需两步操作即可完成：首先在\
  \ Splunk Web 的 Manager 中激活此功能（见图 16-2），然后定义搜索对等节点。要进入激活界面，请转到 Manager 并从 Distributed\
  \ Environment 部分选择 Distributed search 选项。进入后，点击 Distributed search setup 链接。\n\n\
  ![9781430257615_Fig16-02.jpg](img/9781430257615_Fig16-02.jpg)\n\n图 16-2：启用分布式搜索\n\
  \n启用分布式搜索后（我们通常保持其他选项为默认值），需要重启 Splunk 实例。该过程的第二步是定义参与搜索的其他 Splunk 实例，也非常简单，如图 16-3\
  \ 所示，我们将第二个索引器定义为第一个索引器的对等节点。\n\n![9781430257615_Fig16-03.jpg](img/9781430257615_Fig16-03.jpg)\n\
  \n图 16-3：定义搜索对等节点\n\n![image](img/sq.jpg) **注意**：使用分布式搜索时，必须更改 Splunk 的初始密码。使用默认密码将无法正常工作。\n\
  \n图 16-3 中的搜索对等节点是从第一个索引器定义的。然后必须将第一个索引器定义为第二个索引器的对等节点。基本上，必须为混合环境中的每个索引器定义所有搜索对等节点，并且请记住需要在防火墙上开放管理端口（通常为\
  \ 8089），否则连接将无法工作。\n\n在转发器方面，有几件事需要完成。第一件事是定义接收器集合。这可以通过 CLI 或直接修改 `outputs.conf`\
  \ 文件来完成。无论采用哪种方式，都可以在 DNS 列表中为每个接收器的 IP 地址定义一个新的 A 记录，使其看起来像这样：\n\n```\nreceiver.mydomain.com\
  \           A       192.186.1.1\nreceiver.mydomain.com           A       192.186.1.2\n\
  ```\n\n显然，你应该使用自己的域名和合适的 IP 地址。使用此方法时，`outputs.conf` 文件将类似于以下内容：\n\n```\n[tcpout]\n\
  defaultGroup=my_indexers\n\n[tcpout:my_indexers]\ndisabled=false\nserver=receiver.mydomain.com:9997\n\
  ```\n\n需要指出的一点是，转发器基于时间分发数据：即负载均衡通过按固定时间段（默认为 30 秒）从一个索引器切换到下一个索引器来实现。由于 Splunk\
  \ 是一个时间序列索引器，这是关于数据分发的关键点。这意味着当进行搜索时，每个索引器将根据轮询机制拥有总数据的 30 秒切片。这种数据分发方式非常高效，索引器仅在有搜索时间段内的数据时才会参与分布式搜索。结果通常是几乎所有索引器都会以相当平衡的方式参与搜索。通常没有理由更改\
  \ 30 秒的默认值，但如果想将其更改为 20 秒，只需在 `outputs.conf` 文件中添加以下指令：`autoLBFrequency=20`。另一种指定负载均衡的方式是使用\
  \ CLI；在这种情况下，需要在 Unix 提示符下发出以下命令：\n\n```\n./splunk add forward-server receiver.mydomain.com:9997\
  \ –method autobalance\n```\n\n此示例假设你已按前述方式定义了 DNS A 记录。如果未这样做，你可以在转发器上指定每个单独的索引器，如下所示：\n\
  \n```\n./splunk add forward-server receiver1.mydomain.com:9997 –method autobalance\n\
  ./splunk add forward-server receiver2.mydomain.com:9997 –method autobalance\n```\n\
  \n如果你正在使用部署服务器，就像第 15 章的示例中那样，只需修改 `send/default` 目录下的 `outputs.conf` 文件，更改将自动发送到转发器，转发器在收到更新后将重启，并以\
  \ 30 秒的间隔在两个 Splunk 实例之间分发数据。\n\n通过启用分布式搜索，用户可以访问任何 Splunk 实例进行搜索，它将使用所有 Splunk\
  \ 实例（或本示例中的两个实例）上索引的数据。最终的拓扑结构（其中搜索在索引器之间协调）如图 16-4 所示。在此示例中，用户根据负载均衡器的决定访问任一 Splunk\
  \ 实例。\n\n![9781430257615_Fig16-04.jpg](img/9781430257615_Fig16-04.jpg)\n\n图 16-4：启用分布式搜索的拓扑结构\n\
  \n提醒一下，此设置中使用两个网络端口：管理端口（通常为 8089），用于 Splunk 实例之间的相互通信；以及接收器端口（通常为 9997），用于接收器获取转发器的数据流。无需多言，这两个网络端口必须在防火墙上开放才能工作。我们指出这一点是因为忘记开放防火墙上的网络端口是一个常见错误，而\
  \ Splunk 产生的错误消息与防火墙无关。\n\n任何已保存的搜索、Splunk 应用或一般的知识对象（即在某个 Splunk 实例上定义的）称为知识包。在分布式搜索环境中，知识包必须复制到其他\
  \ Splunk 实例或搜索对等节点，以便用户可以透明地使用任何实例进行搜索。如果知识包相当大，将其复制到所有搜索对等节点可能是一个缓慢的复制过程。为了提高效率，可以使用所谓的挂载包，即将实际的知识包放置在由所有搜索对等节点共享的磁盘上（使用\
  \ NFS 或 SMB），这样可以消除复制的需要。Splunk 文档详细说明了启用挂载包所需采取的步骤。包含使用挂载包的搜索对等节点的最终拓扑结构如图 16-5\
  \ 所示。请注意，这种拓扑结构对于所谓的中型部署可以正常工作。在某个节点上，搜索数量将迅速压垮挂载包和搜索轮询。\n\n![9781430257615_Fig16-05.jpg](img/9781430257615_Fig16-05.jpg)\n\
  \n图 16-5：使用挂载包的分布式搜索拓扑结构\n\n在本章到目前为止使用的示例中，Splunk 实例是自包含的，即它们同时拥有索引器和搜索组件。我们之前提到这些组件可以分离。一个典型的例子是将搜索组件安装在自己的服务器上，如图\
  \ 16-6 所示，此时它被称为搜索头。搜索头不接收和/或收集数据，它所做的只是协调所有索引器的搜索。此外，接收器或索引器不再由用户直接访问，用户必须通过搜索头来进行搜索。\n\
  \n![9781430257615_Fig16-06.jpg](img/9781430257615_Fig16-06.jpg)\n\n图 16-6：使用搜索头的分布式搜索拓扑结构\n\
  \n\n\n随着您对 Splunk 的使用不断增加，您可以信赖其提供的灵活性，特别是分离基本功能的能力，如 图 16-7 所示的拓扑结构中，不仅有各种索引器，还有多个搜索头。这个例子相当复杂，但也非常实际。增加更多搜索头的驱动因素是并发搜索的数量，通常是仪表板中的计划搜索。随着仪表板越来越普及，通常会发现有专门用于服务仪表板搜索的搜索头。当存在大量与\
  \ Splunk 交互的用户（无论是进行临时搜索还是保存的搜索）时，也需要额外的搜索头。关于何时添加索引器或搜索头的讨论可以在附录 A 中找到。\n\n![9781430257615_Fig16-07.jpg](img/9781430257615_Fig16-07.jpg)\n\
  \n图 16-7. 具有多个搜索头的分布式搜索拓扑\n\n关键在于，由于 Splunk 允许将搜索与索引分离，并且能够定义搜索对等节点和知识包，因此您可以创建最适合您独特需求的拓扑结构。这种灵活性不仅限于扩展，还可以用于其他需要管理组织上或地理上分散数据的情况。例如，您可能有一个公司，其大部分数据在本地层级处理，但加利福尼亚州除外，旧金山和洛杉矶的办公室共享数据。除此之外，总部还有一个搜索头可以访问所有办公室的数据。这种情况在\
  \ 图 16-8 中进行了描述。\n\n![9781430257615_Fig16-08.jpg](img/9781430257615_Fig16-08.jpg)\n\
  \n图 16-8. 地理上分散的拓扑结构\n\n如 图 16-8 所示的例子所见，通过分离索引器和搜索功能所能实现的灵活性，可以满足大多数需求，无论是为了处理更多数据和搜索而扩展，还是为了处理特殊的组织或地理需求。有关扩展的更多细节，例如何时添加索引器或搜索头，可以在附录\
  \ A 中找到。\n\n## 集群\n\n对 Splunk 索引器进行集群是实现高可用性的方法。分布式搜索的一个问题是，当搜索对等节点或索引器不可用时，该索引器中的数据将不再可用。尽管这对于自动负载均衡的转发器来说不是问题，因为它们会将数据流发送到下一个索引器，但对于执行搜索的人或进程来说，这就成了一个问题。在该\
  \ Splunk 实例中索引的那部分数据不再可用，搜索结果将不完整。\n\n集群在多个索引器上复制数据，这样当一个索引器宕机时，包含复制数据的其他索引器可以介入，为搜索提供数据的完整性。复制、故障转移和其他集群特定项目的协调由集群主机完成，集群主机是一个\
  \ Splunk 实例，仅执行此协调功能，不执行其他任何操作。在 图 16-9 中，您可以看到一个集群拓扑，其中包括一组转发器、四个索引器、一个搜索头和必要的集群主机，说明了数据流的走向。\n\
  \n![9781430257615_Fig16-09.jpg](img/9781430257615_Fig16-09.jpg)\n\n图 16-9. 展示数据链路的典型集群拓扑\n\
  \n由于集群主机仅协调对等节点之间的复制和故障转移活动，图 16-9 并未显示主机节点与其他实例之间的任何连接。在解释主机节点如何履行职责以及复制机制如何工作之前，我们必须先解释数据在\
  \ Splunk 中的存储方式。Splunk 中的数据分为两部分：\n\n*   **原始数据**，这并不是严格意义上的原始数据，而更像是一个已经分解成事件的处理版本。它以压缩格式存储。\n\
  *   **索引**，包含指向原始数据的元数据。这使得搜索非常快，因为搜索从索引开始，并在原始数据中查找特定事件以检索所需信息（如果存在）。\n\n这两部分都存储为平面文件，它们一起被统称为\
  \ Splunk 索引，并组织成桶。这些桶只是包含这些平面文件的目录，根据事件的时间戳按“年龄”排列。桶有自己的生命周期，经历从热到温再到冷，最后到冻结的各个阶段。数据根据大小从热阶段滚动到温阶段；此后，数据根据大小和年龄滚动到下一阶段。滚动到冻结阶段的数据将被删除，除非您将其归档，在这种情况下，以后可以解冻。在所有阶段中都可能存在（并且通常存在）许多桶。\n\
  \n在集群环境中，Splunk 会复制桶，而且是以相当高效的方式进行的。需要指定两个参数，第一个是**复制因子**。它定义了拥有桶原始数据的总索引器或对等节点数量。第二个是**搜索因子**，它定义了其中有多少个副本还包含索引或元数据。默认值是复制因子为\
  \ 3，搜索因子为 2。这意味着一个索引器包含主桶（原始数据和索引）；另一个索引器包含主桶的副本（包含原始数据和索引）；第三个索引器仅包含桶原始数据的副本。主桶是用于搜索的桶，而其他副本仅在出现故障时使用。\n\
  \n其效率基于这样一个事实：索引部分可以随时从原始数据生成；因此，存在一个完整的次要桶可用，如果由于任何原因该桶不再可用，第三个部分副本可以重新生成索引部分，成为一个功能完整的桶。\n\
  \n当然，您可以将复制因子和搜索因子定义为最适合您特定情况的值，但复制因子不能大于对等节点的数量。类似地，搜索因子不能大于复制因子。请注意，一旦定义了这些值并启动了集群，您就无法更改它们。在\
  \ 图 16-10 中，您可以看到一个在集群中使用默认值的索引工作示例。最左边的索引器接收数据，并将一个完整副本复制到另一个对等节点，并将部分桶复制到第三个节点。主节点告知索引器将复制数据发送到哪些对等节点。\n\
  \n![9781430257615_Fig16-10.jpg](img/9781430257615_Fig16-10.jpg)\n\n图 16-10. 显示一个索引器复制过程的集群拓扑\n\
  \n在使用集群时，强烈建议您使用转发器收集数据并启用数据确认选项，以确保索引器接收到转发器发送的数据流。\n\n\n\n主节点每秒接收来自所有对等节点的心跳信号。当它在\
  \ 60 秒内（这是默认值；虽然不推荐，但可以更改）未收到心跳信号时，会假定某个对等节点宕机，并启动补救措施。除此之外，主节点还有其他重要功能，总结如下：\n\n\
  - 它告诉每个对等节点数据应复制到哪里。虽然对等节点分配算法没有公开，但这显然取决于复制因子和搜索因子。\n- 它向搜索头提供一个可用索引器列表。\n- 当一个对等节点不可用时，协调补救措施：\n\
  \  - 对于故障对等节点中的每个主存储桶，选择一个拥有完整存储桶的新对等节点作为新的主存储桶。这通常只需几秒钟。\n  - 对于故障对等节点中的每个完整存储桶，选择一个将托管完整存储桶的新对等节点，以维持搜索因子。在某些情况下，这可能需要从部分存储桶的原始数据中计算元数据。这可能需要几分钟。\n\
  \  - 对于故障对等节点中的每个部分存储桶，选择一个将托管部分存储桶的新对等节点，以维持复制因子。\n\n此关于 Splunk 集群基本原理的高级概述应为您提供设置集群所需的基础知识。我们强烈建议您在设置生产集群之前，先查阅\
  \ Splunk 关于此主题的文档。\n\n### 设置集群\n\n为了说明我们刚刚回顾的集群概念，我们将练习设置一个类似于图 16-9 中描述的集群，该集群由四个索引器（或对等节点）、一个搜索头和一个主节点组成。我们将使用复制因子\
  \ 3 和搜索因子 2 的默认值。\n\n第一步是启用集群主节点。请注意，主节点不能同时作为对等节点或搜索头，它只能是一个主节点。一旦您安装并启动了 Splunk\
  \ 实例，请转到管理器并选择集群选项。在那里，您单击“配置”，这将调出图 16-11 中显示的屏幕。您可以看到，我们正在启用集群并将此实例设为集群主节点，并使用所有默认设置。您还可以提供一个密钥，该密钥将用于验证主节点与所有对等节点之间的通信。所有集群实例上的密钥必须相同。我们选择将其留空。\n\
  \n![9781430257615_Fig16-11.jpg](img/9781430257615_Fig16-11.jpg)\n\n图 16-11. 为主节点启用集群\n\
  \n保存此配置后，您必须重启 Splunk 才能生效。重启实例后，它就可以接受对等节点了。请注意，它会阻止对等节点上的索引，直到有足够多的对等节点满足复制因子。下一步是启用对等节点。这通过转到与启用主节点时相同的屏幕来完成，但您要选择将此实例设为集群对等节点，如图\
  \ 16-12 所示。在这里，您需要提供主节点的名称和管理端口，通常为 8089。记得添加`https://`，否则会失败。此外，您需要提供对等节点用于从其他对等节点接收复制数据的网络端口。任何未使用的端口都可以，因此我们选择了\
  \ 8100。因为我们没有在主节点上定义密钥，所以这里我们也将其留空。\n\n![9781430257615_Fig16-12.jpg](img/9781430257615_Fig16-12.jpg)\n\
  \n图 16-12. 启用集群对等节点\n\n在第一个对等节点上重启 Splunk 实例后，我们会收到以下警告消息：`Indexing not ready; fewer\
  \ than replication_factor peers are up`，这是意料之中的，因为集群中只有一个对等节点。在主节点上，您可以通过转到管理器，然后选择集群，再单击仪表盘链接来查看集群状态。此仪表盘可以配置，但默认情况下包含三个信息部分。在图\
  \ 16-13 中，我们展示了集群概览，其中显示了我们刚刚评论的状态。\n\n![9781430257615_Fig16-13.jpg](img/9781430257615_Fig16-13.jpg)\n\
  \n图 16-13. 集群概览报告\n\n再次提醒，您必须确保防火墙中所有必要的网络端口均已打开；否则，集群将无法工作，因为所有对等节点间的通信都无法进行。一旦您启用了所有搜索对等节点，就可以继续启用搜索头了。该过程与启用主节点或对等节点相同，但您只需选择搜索头。这将要求您提供主节点的\
  \ URL 和密钥。保存配置后，您需要重启 Splunk 实例。要验证搜索头是否正常工作，您可以在管理器的集群组下查看搜索头仪表盘。此选项的输出如图 16-14\
  \ 所示。\n\n![9781430257615_Fig16-14.jpg](img/9781430257615_Fig16-14.jpg)\n\n图 16-14.\
  \ 搜索头仪表盘\n\n搜索头仪表盘中显示的信息相当晦涩，但您需要查找的是在`Generation Peers`标题下是否有与对等节点数量相同的行。在我们的示例中，如图\
  \ 16-14 所示，它显示了四行，这是正确的。值得注意的是，您可以拥有多个活动集群，并且一个搜索头或一组搜索头可以访问多个集群。这为您提供了所需的灵活性，可以设计出几乎适用于任何情况的解决方案。\n\
  \n现在集群已启动并运行，您可以在主节点上查看集群概览报告，如图 16-15 所示。尽管此图仍呈现了总报告的部分信息，但我们添加了一个显示对等节点详细信息的章节。\n\
  \n![9781430257615_Fig16-15.jpg](img/9781430257615_Fig16-15.jpg)\n\n图 16-15. 完整集群的概览报告\n\
  \n到目前为止，我们执行的步骤适用于仅使用主索引的基本集群。如果您使用任何其他索引或应用程序，则需要准备一个所谓的`configuration bundle`在主节点上，这将允许您将附加信息分发到所有对等节点。有关此主题的更多详细信息，请查阅\
  \ Splunk 文档。\n\n最后一点是关于主节点的。诚然，它可以被认为是一个单点故障，但它并不像看起来那么脆弱。如果主节点不可用，对等节点之间会继续相互通信，根据需要复制数据，因为它们拥有所有必要的信息。当某个对等节点不可用时，主节点的缺失就会成为一个问题，因为没有一个主节点可以协调补救活动并为搜索提供数据完整性。当一个新的对等节点加入集群（无论是重启还是新节点）且不知道该使用哪些对等节点进行复制时，情况也是如此。Splunk\
  \ 文档介绍了一种设置备用主节点的方法。\n\n## 总结\n\n\n\n"
- "# 附录 A\n\n## Splunk 的性能表现\n\n本附录概述了 Splunk 在索引、搜索、分布式搜索以及磁盘速度对搜索影响方面的性能表现。我们还提出了一些建议，帮助您更好地了解您的\
  \ Splunk 环境，包括搜索头。\n\n## 搜索类型\n\n我们必须在此附录开头提出严正警告：性能不能一概而论，也不能从其他类似系统进行类推。无论您认为您的应用与另一个应用多么相似，或者与在别处运行的同一个应用多么相像，您都无法准确推断出其性能表现。事实上，您的应用会根据使用模式表现出不同的性能特征。Splunk\
  \ 是一个复杂的软件系统，没有公式可以计算其性能。在本附录中，我们将分享 Splunk 在不同情况下的性能表现，以便您了解其行为并设定合理的预期。\n\n此处提供的性能数据仅用于说明目的，不应视为\
  \ Splunk 性能的准确体现。如果您运行相同的性能测试，您得到的结果也会有所不同。这是因为有太多的配置文件，不仅在 Splunk 中，也在底层操作系统中，任何微小的差异都可能产生巨大影响。\n\
  \nSplunk 拥有多个活动组件，这使我们无法提供通用的性能衡量标准。从宏观层面来看，以下因素会影响 Splunk 的性能：\n\n*   搜索类型\n* \
  \  索引器数量\n*   搜索头数量\n*   被索引数据的类型\n*   底层硬件和操作系统\n\nSplunk 的工程团队根据搜索结果中返回的事件数量对搜索类型进行分类。您的预期可能是根据搜索的复杂度进行分类，但这实际上无法衡量；而搜索生成的事件数量是可以衡量的，并且对搜索的响应时间有非常大的影响。以下是搜索的类别或类型：\n\
  \n*   ***密集***：每索引一至一千个事件返回一个结果（1 到 1,000）\n*   ***稀疏***：每索引一千至一百万个事件返回一个结果（1,000\
  \ 到 1,000,000）\n*   ***罕见***：每索引一百万至十亿个事件返回一个结果（1,000,000 到 1,000,000,000）\n*  \
  \ ***大海捞针***：每索引十亿个或更多事件返回一个结果（1,000,000,000+）\n\n可以这样理解：密集搜索会产生大量事件，是对索引数据的全景式浏览。稀疏搜索则稍微放大，如同使用了双筒望远镜。罕见搜索开始深入细节，如同显微镜；而大海捞针搜索则真正深入到了分子层面，如果愿意的话，可以将其比作电子显微镜。从俯瞰森林，到观察树枝，再到审视树叶，最后目睹光合作用的进行。您越聚焦放大，Splunk\
  \ 的性能就越好，正如我们将在本附录中看到的。\n\n![image](img/sq.jpg) **注意** 我们必须提醒您，本附录中呈现的性能测试是在实验室的真空中完成的，不能指望其反映真实世界的情况。\n\
  \nSplunk 不会对搜索结果进行缓存或使用缓冲区。为了提供正确的比较，本附录中执行的所有性能测试都在运行前清除了 Unix 缓存。\n\n## 搜索性能概览\n\
  \n为了展示性能如何依赖于搜索类型，我们进行了一个简单的实验。我们按照组合日志格式创建了一个典型的 Web 访问日志文件，但在末尾放置了一些关键字，例如 `every2`、`every100`\
  \ 等，以及一个用于验证目的的序列号。每个关键字出现在相应的每个事件中，因此 `every2` 会出现在每第二个事件中，而 `every100` 出现在每第一百个事件中。多个关键字会相应出现，例如，每第一百个事件也将包含\
  \ `every2` 关键字，因为 100 是 2 的倍数；而每第一万个事件不仅包含 `every10K` 关键字，还包含 `every2` 和 `every100`。典型的\
  \ Web 访问日志条目如下所示：\n\n```\n150.135.220.120 - - [04/Jan/2012:23:59:59 -0700] \"GET\
  \ /themes/splunk_com/img/skins/white/logos/downloads/logo_freebsd.gif HTTP/1.1\"\
  \ 200 - \"http://www.splunk.com/index.php/landing?ac=ostg-cpd\" \"Mozilla/4.0 (compatible;\
  \ MSIE 7.0; Windows NT 5.1; .NET CLR 1.0.3705; .NET CLR 1.1.4322; Media Center PC\
  \ 4.0)\" \"150.135.220.120.0000044400204798\" every2 every100 num=000000100051200\n\
  ```\n\n我们生成了略多于 36 亿个事件，约 1 TB 的原始数据，这些数据被索引到一台普通服务器上。我们使用另一台服务器作为搜索头。这项测试并不十分真实，因为没有任何其他操作发生，没有数据被索引，也没有其他人执行其他搜索，但它仍然为我们提供了基于搜索分类的响应时间的相当不错的概念。测试是使用\
  \ CLI 通过简单搜索完成的，例如：\n\n```\nsearch every2\n| stats count\n```\n\n结果可以在图 A-1 中看到。我们不得不使用对数刻度，因为使用\
  \ `every2` 关键字的密集搜索的结果与光速测试的结果之间存在四个数量级的差距，光速测试只是搜索关键字 `SpeedOfLight`，我们知道它在生成的数据中并不存在。当您执行搜索时，Splunk\
  \ 会检查其数据桶，看其中是否有该字符串。光速搜索只是用来衡量遍历 Splunk 基础设施寻找一个不存在的字符串需要多长时间；在这个例子中只需两秒钟。当它在某个桶中找到该字符串时，它会在原始数据中查找包含搜索字符串的实际事件，但要做到这一点，它必须先解压缩原始数据，因为原始数据是以压缩格式存储的。匹配搜索的事件越多，它需要解压缩的数据就越多，因此密集搜索往往受限于\
  \ CPU。如结果图表所示，非常密集的 `every2` 关键字搜索耗时近四小时，因为 Splunk 必须处理超过 18 亿个 Web 访问事件。当我们转向不太密集的搜索，如\
  \ `every100`，响应时间降至 45 分钟，因为 Splunk 只需处理约 3600 万个事件。随着结果包含的事件越来越少，性能显著提升，如 `every200million`\
  \ 关键字所示，仅需 26 秒即可返回匹配搜索的 18 个事件。\n\n![9781430257615_AppA-01.jpg](img/9781430257615_AppA-01.jpg)\n\
  \n图 A-1 . 按类型划分的搜索性能\n\n\n\n随着搜索从密集到稀疏、稀有再到大海捞针，它们会从 CPU 密集型转变为 I/O 密集型，因为需要解压的原始数据减少了，但对桶的读取操作增多了。图\
  \ A-2 展示了在每索引 10,000 到 100,000 个事件中返回一个结果时发生的转变，这将其置于稀疏搜索类别的中间位置。\n\n![9781430257615_AppA-02.jpg](img/9781430257615_AppA-02.jpg)\n\
  \n图 A-2. 搜索资源消耗\n\n要判断搜索是 CPU 密集型还是 I/O 密集型，只需点击作业检查器按钮，该按钮位于用户界面的搜索屏幕上，在时间选择器下方，是一个内含字母“i”的蓝色方块。这将打开另一个浏览器窗口，其中包含该特定搜索的执行成本信息。在图\
  \ A-3 中，你可以看到我们在第 10 章中使用的一个简单搜索的部分输出，该搜索寻找计划飞行时间为 31 小时的美联航航班：\n\n```\nUniqueCarrier=UA\
  \ CRSElapsedTIme=1865\n```\n\n![9781430257615_AppA-03.jpg](img/9781430257615_AppA-03.jpg)\n\
  \n图 A-3. 搜索执行成本\n\n仔细查看作业检查器的输出，你会发现`command.search.index`花费的时间是 1.114 秒，而`command.search.rawdata`是\
  \ 0.179 秒；因此，此搜索是 I/O 密集型的。这在意料之中，因为该搜索属于稀有类别，在 1.47 亿个已索引事件中仅有一个结果。最后提醒一点：这不适用于基于`tsidx`机制的搜索。\n\
  \n## 大海捞针\n\n为大海捞针搜索设置性能测试非常复杂且耗时；这就是为什么之前的实验没有包含这种搜索类型的原因。然而，我们有幸专门为此案例运行了一些独立的性能测试。与之前的测试类似，我们使用组合访问格式创建了一组\
  \ Web 访问日志，并为每个事件附加了一个唯一的序列号，这次没有使用关键词。我们生成了 560 亿个事件，并将其平均分布在 10 个 Splunk 索引器上。该集群还有一个单独的搜索头。我们从\
  \ CLI 使用的搜索命令如下：\n\n```\nsearch 0000028000000123\n```\n\n这会查找该特定字符串，该字符串在 560 亿个事件中是唯一的，对应的事件编号为\
  \ 28000000123，可以在大约一半的位置找到。此搜索的结果可以在表 A-1 中找到。\n\n表 A-1. 大海捞针性能\n\n| 桶大小 | 布隆过滤器\
  \ | 响应时间（秒） |\n| --- | --- | --- |\n| 1GB | 否 | 186.636 |\n| 1GB | 是 | 31.788 |\n\
  | 10GB | 否 | 71.459 |\n| 10GB | 是 | 9.727 |\n\n当然，最引人注目的焦点是从 560 亿个事件中找出唯一事件只用了不到\
  \ 10 秒，但有几个地方需要先解释一下。我们先从桶开始。这是 Splunk 存储原始数据的地方；默认大小在安装 Splunk 时由系统自动计算。它基于运行 Splunk\
  \ 的服务器上的核心数量和其他配置信息进行设置。当桶与主索引关联时，默认大小很可能是每个桶 10GB，而对于与自定义索引（即您定义的索引）关联的桶，默认大小很可能为\
  \ 1GB。您可以配置桶大小，但一般来说，对于高容量索引（例如主索引），我们建议使用预定义的`auto_high_volume`设置，否则使用`auto`设置。一个高容量索引通常被认为是每天接收超过\
  \ 10GB 数据的索引。\n\n对搜索性能有巨大影响的另一项是布隆过滤器。这是一种可以明确声明某个元素不在数据集中的数据结构。Splunk 使用布隆过滤器来判断某个字符串是否不在某个桶中。这样，Splunk\
  \ 就不必打开并处理不包含我们正在查找的字符串的桶，从而显著提高性能。当您将更大的桶大小与布隆过滤器结合使用时，桶的数量会更少，这意味着需要处理的布隆过滤器更少，从而减少了搜索的处理时间。布隆过滤器在索引时创建，并且在\
  \ Splunk 中默认启用。创建它们会有相对较小的开销，但当您进行稀有或大海捞针搜索时，这点开销是非常值得的。开销包括索引期间创建布隆过滤器的额外处理时间，以及用于存储过滤器的额外磁盘空间。我们建议，如果您的大多数搜索是稀有或大海捞针类型，您可以在自定义索引上使用\
  \ 10GB 的桶大小。\n\n## 分布式搜索\n\n最常见的问题之一是何时应向 Splunk 服务器集群中添加索引器。由于这个问题没有精确答案，我们准备了一组三个性能测试，这些测试将让您对\
  \ Splunk 在增加部署中索引器数量时的行为有一个相当清晰的认识。\n\n### 性能测试 1\n\n在这组测试中，我们保持固定数量的事件（1 亿个）均匀分布在所有索引器上，同时增加索引器的数量。第一个数据点是使用一个索引器，它拥有全部\
  \ 1 亿个事件。接下来，我们将索引器数量增加到十个，但由于事件数量固定，现在每个索引器只有 1000 万个事件。下一个数据点是 50 个索引器，每个有 200\
  \ 万个事件，最后是 100 个索引器，每个有 100 万个事件。密集搜索的第一组结果见表 A-2。\n\n表 A-2. 性能测试 1——密集搜索\n\n![image](img/TableA-2.jpg)\n\
  \n随着我们增加索引器，性能提高了。在 1 到 10 个索引器之间，有线性可扩展性的迹象，但数据点不足以确定。然而，我们可以看到，从 50 个索引器增加到 100\
  \ 个索引器时出现了一个拐点，响应时间增加了。这是一个收益递减点，再增加索引器已经不值得了。我们将性能下降归因于搜索头与索引器之间的通信开销。\n\n在表 A-3\
  \ 中，你可以看到稀疏搜索的响应时间。虽然不那么明显，但在 1 到 10 个索引器之间，我们也有线性可扩展性的迹象。我们也可以看到与密集搜索相同的拐点，原因与之前相同。\n\
  \n表 A-3. 性能测试 1——稀疏搜索\n\n![image](img/TableA-3.jpg)\n\n表 A-4 显示了索引器过多实际上会损害稀有搜索的性能。拐点比其他搜索类型出现得更早。这是因为稀有搜索的性质决定：每个索引器的响应都非常快，但所有额外索引器的通信开销直接影响了响应时间。\n\
  \n表 A-4. 性能测试 1——稀有搜索\n\n![image](img/TableA-4.jpg)\n\n从这个性能测试中，我们可以得出结论：\n\n* \
  \  增加索引器的数量往往能提高性能\n*   存在一个收益递减点，即过多的索引器会对搜索性能产生负面影响，尤其是对稀有搜索。\n\n### 性能测试 2\n\n\
  \n\nIn this performance test, we fixed the number of events per indexer. That means\
  \ the total number of events increased every time we added an indexer. We used only\
  \ two data points: the first with 10 indexers each containing 10 million events,\
  \ resulting in a total of 100 million events; the second with 200 indexers each\
  \ containing 10 million events, giving a total of 2 billion events.\n\nIn Table\
  \ A-5, we can see the test results under dense search. In this case, scalability\
  \ was far better than linear, but our data points are insufficient to draw this\
  \ conclusion. Remember, in this set of tests, we increased the number of indexers,\
  \ each with additional data. In the previous set of tests, we increased the number\
  \ of indexers but diluted the number of events per indexer.\n\nTable A-5. Performance\
  \ Test 2 – Dense Search\n\n![image](img/TableA-5.jpg)\n\nIn Table A-6, we again\
  \ observe indications that the scalability of sparse search is far better than the\
  \ linear model. By extrapolation, the response time for 2 billion events should\
  \ have been 20 seconds, but it was actually only 9 seconds.\n\nTable A-6. Performance\
  \ Test 2 – Sparse Search\n\n![image](img/TableA-6.jpg)\n\nFinally, as shown in Table\
  \ A-7, the rare search exhibits a similar pattern, also showing indications of far\
  \ better than linear scalability. From this, we can conclude that under these conditions,\
  \ adding indexers as the number of events increases makes sense, and scalability\
  \ is at least linear or better.\n\nTable A-7. Performance Test 2 – Rare Search\n\
  \n![image](img/TableA-7.jpg)\n\n## Performance Test 3\n\nWe call this the real-world\
  \ performance test. The scenarios described in the first two performance tests do\
  \ not occur in practice. New events sent for indexing are distributed evenly across\
  \ all indexers, so a new indexer only receives a fraction of the total events. Since\
  \ a new indexer has no events when it first joins, the total number of events is\
  \ not evenly distributed across all indexers.\n\nIn this set of tests, we start\
  \ with one search head and one indexer. The first data point contains 100 million\
  \ events. We then increase the events to 200 million and 300 million. At this point,\
  \ we add another indexer and increase the events to 400 million and 500 million.\
  \ What happens here is: when we add the new indexer and increase events by 100 million,\
  \ 50 million of those go to the new indexer (bringing it to a total of 50 million\
  \ events), and the other 50 million go to the old indexer (bringing it to a total\
  \ of 350 million events). When we add another 100 million events, they are distributed\
  \ evenly between the two indexers. At this point, the new indexer has a total of\
  \ 100 million events, and the old indexer has 400 million events.\n\nIn Figure A-4,\
  \ we plotted the actual response times for the five data points, while adding a\
  \ trend line representing linear scalability. As you can see, the actual response\
  \ times are better than the expected linear scalability. In fact, the results may\
  \ be even better than shown in the graph. This is because search operations access\
  \ all data, while in real-world scenarios, these searches are often targeted at\
  \ a recent, continuously rolling time window, so the overall improvement in search\
  \ time will be greater than what we demonstrate here.\n\n![9781430257615_AppA-04.jpg](img/9781430257615_AppA-04.jpg)\n\
  \nFigure A-4. Performance Test 3, Dense Search\n\nAnother way to interpret the graph\
  \ in Figure A-5 is to observe the linear scalability trend line. You can see that\
  \ with a single indexer, the response time reaches 80 seconds when the number of\
  \ events reaches 400 million; after we add the second indexer, the 80-second response\
  \ time is only reached at 500 million events, so this significantly contributes\
  \ to both performance and scalability.\n\n![9781430257615_AppA-05.jpg](img/9781430257615_AppA-05.jpg)\n\
  \nFigure A-5. Performance Test 3, Sparse Search\n\nIn Figure A-6, we can see that\
  \ adding an indexer brought a small improvement, but given that the response time\
  \ was already very fast, adding another indexer seems unnecessary.\n\n![9781430257615_AppA-06.jpg](img/9781430257615_AppA-06.jpg)\n\
  \nFigure A-6. Performance Test 3, Rare Search\n\nBased on the results of this set\
  \ of performance tests, we can conclude that adding another indexer is useful, especially\
  \ for sparse searches, but it seems to offer no advantage for rare searches. Clearly,\
  \ scaling out by adding indexers can delay the degradation of response times to\
  \ a certain extent, which can be a reason to add indexers.\n\n## Indexing Performance\n\
  \nAnother example of why performance cannot be generalized is indexing performance.\
  \ This situation is highly dependent on the type of data being indexed. Furthermore,\
  \ the transformations performed when data is loaded into `Splunk` also have an impact.\
  \ This was thoroughly discussed in Chapter 9 when reviewing different ways to handle\
  \ timestamps for aviation on-time performance data. Finally, the underlying operating\
  \ system and hardware also affect performance.\n\nDepending on the data type, the\
  \ size of events can vary greatly. For example, web access log events using the\
  \ combined log format average around 300 characters. The average event size for\
  \ `syslog` files varies greatly by source type; we have observed ranges from 300\
  \ to 1200 characters. Another common type is `JBoss` log files; when content is\
  \ included, it is often a Java stack trace, which tends to be long, averaging around\
  \ 5000 characters. Due to these widely varying event sizes, it is more preferable\
  \ to measure indexing performance in kilobytes per second (`KBps`) rather than simply\
  \ the number of events.\n\nIn Figure A-7, you can see the results of measuring indexing\
  \ throughput using the three log file types discussed earlier. The results under\
  \ the Linux environment are very stable, around 14,000 `KBps`. The situation is\
  \ similar under the Solaris environment, although throughput drops to about 11,000\
  \ `KBps`. The inconsistency of indexing throughput under the Windows operating system\
  \ is surprising. To provide a more complete picture, we chose to compress the `syslog`\
  \ file with `gzip`. We can attribute the slightly slower throughput on Linux and\
  \ Solaris to the need to decompress the `syslog` file. However, Windows seems to\
  \ perform better when handling compressed files.\n\n![9781430257615_AppA-07.jpg](img/9781430257615_AppA-07.jpg)\n\
  \nFigure A-7. Indexing Performance\n\nThis chart is not intended to recommend any\
  \ particular operating system. As you know, there are a vast number of factors affecting\
  \ operating system performance. However, these tests were performed on the same\
  \ generic server, so Solaris 10 was running on x86 architecture, not on a `SPARC`\
  \ server. This chart is intended to illustrate that differences exist between data\
  \ types, and these differences can also be influenced by the underlying operating\
  \ system and hardware.\n\n## Disk Speed and Search\n\n\n\n作为计算机中最慢的硬件组件，磁盘驱动器确实会影响性能，尤其是在像`Splunk`这样将数据存储在磁盘上的应用程序中。在`Splunk`中，数据存储在桶（`bucket`）中。这些桶可以是热（`hot`）、温（`warm`）、冷（`cold`）或冻结（`frozen`）状态。我们不会详细讨论它们的工作原理以及数据如何从一个桶滚动到另一个桶，但可以说，索引性能与存储热桶和温桶的设备（`device`）的写入性能直接相关。搜索性能部分与存储热桶、温桶和冷桶的设备的读取性能相关。您可以在配置文件中指定桶的位置。\n\
  \n我们进行的测试旨在测量使用不同转速磁盘驱动器时的搜索性能。为了更清楚地了解这一行为，我们还会考虑并发搜索的数量。\n\n图 A-8 中的图表显示，固态硬盘（`SSD`）提供了最佳的搜索性能，并且随着并发搜索次数的增加，性能还会提升。其相对于传统机械磁盘驱动器的提升非常显著，以至于我们必须使用对数刻度。`SSD`在搜索性能上的差异可能足以证明其价格差异是合理的。\n\
