  `\n\n### 了解航班数据\n\n分析数据时最重要的事情之一是熟悉数据。这一论断适用于所有类型的数据，无论是大数据、结构化数据、非结构化数据，等等。通常，数据是一个不断演变的活实体。其内容及其格式总是在变化。实时数据和历史数据都是如此。无论何种情况，请确保你非常熟悉将要分析的数据。必须特别注意彻底理解可用字段的含义。根据我们的经验，许多棘手的问题都可以直接追溯到对数据的误解。\n\
