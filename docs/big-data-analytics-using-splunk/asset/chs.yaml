  \n### 历史运行时间\n\n一旦您识别出最耗资源的搜索，我们建议您回顾那些您最关心的搜索随时间推移的行为变化。之前的报告“最耗资源的搜索”仅显示每次搜索中资源消耗最高的记录。查看历史运行时间（即响应时间）会让我们有更清晰的概念。为此进行的搜索非常简单。如果它是已保存搜索，请使用以下命令：\n\
