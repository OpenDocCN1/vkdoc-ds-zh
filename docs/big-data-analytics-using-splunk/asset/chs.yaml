  '
- "# 处理和分析数据\n\n在本章中，您将学习如何使用 Splunk 的搜索处理语言 (SPL) 来处理和分析数据。我们将继续第 2 章中完成的数据加载工作；这将帮助您深入理解组合访问日志格式以及日志条目提供的信息。然后，您将学习如何使用\
  \ SPL 的报表、排序、过滤、修改和分组命令来处理 `MyGizmoStore.com` 的数据。\n\n## 了解组合访问日志数据\n\n我们在本书中强调的一点是，需要理解您想要处理和分析的数据集；也就是说，首先要深入了解您将要处理的数据。在本章中，我们将迈出第一步，解释我们在第\
  \ 2 章中用于生成示例数据的组合访问日志格式的数据。\n\n几乎所有类型的应用程序和服务器都会生成日志文件——无论是最终用户应用程序、Web 服务器，还是作为运行消费者或业务用户所用应用基础设施的复杂中间件平台。操作系统和固件也会将大量原始数据生成到日志文件中。挑战在于理解、分析和挖掘日志文件中的原始数据，并从中提取出有意义的信息。\n\
  \n由 Apache 或 Microsoft IIS 等 Web 服务器生成的组合访问日志提供了关于活动、性能以及间歇性或持续发生的问题的信息。这些日志包含有关服务器处理的所有请求的信息。Apache\
  \ 和 IIS 都允许自定义组合访问日志格式，这种格式被许多解释和处理这些日志文件中条目的日志分析应用程序广泛使用且易于理解。组合访问日志格式产生的日志条目如下所示：\n\
  \n```\n127.0.0.1 - JohnDoe [10/Oct/2000:13:55:36 -0700] \"GET /apache_pb.gif HTTP/1.0\"\
  \ 200 2326\n\"http://www.google.com\" \"Opera/9.20 (Windows NT 6.0; U; en)\"\n```\n\
  \n此示例中各个字段的含义在表 3-1 中进行了描述。\n\n表 3-1. 组合访问日志中的字段描述\n\n\n\n| 字段 | 描述 |\n| --- | ---\
  \ |\n| `127.0.0.1` | 这是发起 HTTP 请求以访问 Web 应用程序或单个网页的客户端（机器、主机或代理服务器）的 IP 地址。该字段的值可以表示为主机名\
  \ |\n| `-` | 该字段用于标识发起 HTTP 请求的客户端。由于此字段的内容非常不可靠，通常使用连字符表示，这意味着信息不可用 |\n| `JohnDoe`\
  \ | 这是请求网页或应用程序的用户的用户 ID |\n| `10/Jan/2013:10:32:55 -0800` | 服务器完成处理请求的时间戳。格式可以通过\
  \ Web 服务器设置进行控制 |\n| `\"GET /apache_pb.gif HTTP/1.0\"` | 这是从客户端接收到的请求行。它显示了方法信息，在本例中为\
  \ `GET`，客户端请求的资源，在本例中为 `/apache_pb.gif`，以及使用的协议，在本例中为 `HTTP/1.0` |\n| `200` | 这是服务器发送回客户端的状态码。状态码是非常重要的信息，因为它们可以告知来自客户端的请求是成功完成还是失败，如果失败，则需要采取一些措施。本例中的\
  \ `200` 表示请求已成功 |\n| `2326` | 此数字表示返回给客户端的数据大小。在本例中，`2326` 字节被发送回客户端。如果没有内容返回给客户端，则该值将是一个连字符\
  \ `\"-\"` |\n| `\"http://www.google.com\"` | 该字段被称为引荐来源字段，显示请求来自何处。您可能会在引荐来源字段中看到诸如\
  \ `http://www.google.com`、`http://www.yahoo.com` 或 `http://www.bing.com` 之类的网站 URL。引荐来源信息有助于网站或在线应用程序了解用户是如何进入网站的，并且此信息可用于确定在线广告费用应投向何处。您可能注意到引荐来源（referrer）多了一个“r”。这是有意为之，源自\
  \ HTTP 规范中最初提出的提案。在用户可以使用隐身模式或禁用引荐来源的浏览器（如 Chrome）中，该字段的值将不准确。在 HTML5 中，可以指示报告此信息的用户代理不发送引荐来源信息\
  \ |\n| `\"Opera/9.20 (Windows NT 6.0; U; en)\"` | 这是用户代理字段，包含客户端浏览器报告的有关自身的信息。您会看到像\
  \ `\"Opera/9.20 (Windows NT 6.0; U; en)\"` 这样的值，这意味着请求来自运行在 Windows NT（实际上是 Windows\
  \ Vista 或 Windows Server 2008）操作系统上的 Opera 浏览器。用户代理信息有助于优化网站和 Web 应用程序，并处理来自 iPad\
  \ 和手机等小型设备的请求 |\n\n现在让我们看一下我们在第 2 章中为 `MyGizmoStore.com` 生成的一些示例日志条目。以下是来自 `/opt/log/BigDBBook-www1/access.log`\
  \ 文件的示例条目。您可以看到其中包含不同的状态码以及用户代理或浏览器。\n\n```\n196.65.184.6 - - [28/Dec/2012:06:54:46]\
  \ \"GET /product.screen?productId=CA-NY-99&JSESSIONID=SD5SL8FF8ADFF4974 HTTP 1.1\"\
  \ 200 992 \"http://www.bing.com\" \"Opera/9.20 (Windows NT 6.0; U; en)\" 597\n\n\
  92.189.220.86 - - [29/Dec/2012:02:58:28] \"GET /cart.do?action=purchase&itemId=HYD-2&JSESSIONID=SD2SL1FF4ADFF5176\
  \ HTTP 1.1\" 500 1058 \"http://www.MyGizmoStore.com/oldlink?itemId=HYD-2\" \"Mozilla/4.0\
  \ (compatible; MSIE 6.0; Windows NT 5.1; SV1; .NET CLR 1.1.4322)\" 604\n\n189.228.151.119\
  \ - - [30/Dec/2012:18:18:50] \"GET /product.screen?productId=8675309&JSESSIONID=SD6SL9FF2ADFF6808\
  \ HTTP 1.1\" 404 3577 \"http://www.MyGizmoStore.com/product.screen?productId=CA-NY-99\"\
  \ \"Opera/9.01 (Windows NT 5.1; U; en)\" 916\n\n218.123.191.148 - - [31/Dec/2012:04:28:45]\
  \ \"GET /category.screen?categoryId=BLUE\nGIZMOS&JSESSIONID=SD0SL1FF1ADFF7226 HTTP\
  \ 1.1\" 500 2992 \"http://www.MyGizmoStore.com/category.screen?categoryId=BLUE GIZMOS\"\
  \ \"Mozilla/5.0 (Macintosh; U; Intel Mac OS X 10_6_3; en-US) AppleWebKit/533.4 (KHTML,\
  \ like Gecko) Chrome/5.0.375.38 Safari/533.4\" 928\n\n78.65.68.244 - - [31/Dec/2012:02:22:40]\
  \ \"GET /category.screen?categoryId=ORANGE WATCHMACALLITS&JSESSIONID=SD1SL5FF9ADFF7146\
  \ HTTP 1.1\" 200 2120 \"http://www.bing.com\" \"Mozilla/4.0 (compatible; MSIE 6.0;\
  \ Windows NT 5.1; SV1)\" 338\n```\n\n## 搜索和分析索引数据\n\n搜索和分析机器或日志数据可以提供极其有用的信息，了解应用程序、系统、Web\
  \ 服务器、负载均衡器和防火墙是如何工作的。这些信息还可用于调试、根本原因分析，以及通常更深入地了解外部或内部客户在用法或购买模式方面的行为。通过分析机器数据，企业可以开始提出以前未曾想到的问题，以了解\
  \ IT 基础设施正在发生什么。\n\n我们将使用 `MyGizmoStore.com` 的示例数据，看看是否能找到典型 IT 组织希望了解的有关其网站和应用程序的许多问题的答案。我们可以先尝试一些简单的搜索命令，看看字段名称是否与表\
  \ 3-1 中的信息正确对齐。在 Splunk 搜索栏中，输入 `sourcetype=access_combined_wcookie`，您可以在图 3-1 中看到检索到了\
  \ 8,688 个匹配事件。此数字将根据您在第 2 章中对示例数据生成器所做的自定义而有所不同。\n\n![9781430257615_Fig03-01.jpg](img/9781430257615_Fig03-01.jpg)\n\
  \n图 3-1. [MyGizmoStore.com](http://MyGizmoStore.com) 的事件总数\n\n为了进一步验证事件总数，我们可以找出每个主机\
  \ `BigDBook-www1`、`BigDBook-www2` 和 `BigDBook-www3` 相关的事件数量。所有主机的事件总数应与之前使用 `sourcetype`\
  \ 字段搜索得到的结果相匹配。在搜索栏中输入 `host=BigDBook*`，您将在图 3-2 中看到检索到了 8,688 个事件，并且所有事件中的主机字段值都被高亮显示。事件数量与我们之前搜索得到的数量相等。\n\
  \n![9781430257615_Fig03-02.jpg](img/9781430257615_Fig03-02.jpg)\n\n图 3-2. 所有主机的事件总数\n\
  \n我们还可以检查各个字段以进一步验证数据。示例数据生成器默认包含以下类别：\n\n*   `BLUE_GIZMOS`\n*   `RED_GADGETS`\n\
  *   `WHITE_WIDGETS`\n*   `ORANGE_WATCHMACALLITS`\n*   `PURPLE_DOOHICKEYS`\n*   `BLACK_DOODADS`\n\
  \n您可以转到 Splunk 搜索应用程序中的左侧栏，如图 3-3 所示；此侧边栏始终显示默认字段和附加字段，Splunk 将这些字段称为感兴趣的字段。这些字段被定义为出现在该特定索引的\
  \ 50% 或更多事件中的字段。\n\n![9781430257615_Fig03-03.jpg](img/9781430257615_Fig03-03.jpg)\n\
  \n图 3-3. 显示选定字段和感兴趣字段的侧边栏\n\n您可以看到我们是否有一个可以找到类别列表的字段。因为我们在两个字段列表中都找不到类别字段，请点击底部的“查看所有\
  \ 44 个字段”链接。这将弹出一个显示完整字段列表的对话框。您可以看到 `categoryId` 被列为从上往下数的第三个字段，如图 3-4 所示。\n\n\
  ![9781430257615_Fig03-04.jpg](img/9781430257615_Fig03-04.jpg)\n\n图 3-4. 字段列表\n\n\
  \n\n要查看类别列表，请单击`categoryId`字段第 2 列中显示的小条形图图标。您将看到弹出窗口中按所有事件分组的类别列表，如图 3-5 所示，弹出窗口中的列表与我们在示例数据生成器中使用的默认类别列表相匹配。此外，对话框会显示类别字段值；它还显示有关该字段的一些摘要统计信息，例如每个类别的总事件计数和百分比。此外，它还呈现了一个条形图，这使得它成为一种非常引人注目且简单的方法来深入了解特定字段。\n\
  \n![9781430257615_Fig03-05.jpg](img/9781430257615_Fig03-05.jpg)\n\n图 3-5. 类别列表\n\
  \n您始终可以向侧边栏添加其他字段。我们可以在“字段”对话框中执行此操作；单击字段列表中的第一个字段`action`旁边的箭头符号，然后单击“保存”按钮。您可以对`action`字段进行快速验证。在我们的示例数据生成器中，我们为`MyGizmoStore.com`访问者可以执行的操作使用了以下方法：\n\
