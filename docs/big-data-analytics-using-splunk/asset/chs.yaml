- '# 这两种搜索的输出都会生成一张图表。你需要调整图表选项才能获得清晰的图像。对我们而言，通常需要调整折线图 *y* 轴的最小值以获得更好的分辨率。根据我们的经验，上下浮动
  10% 的偏差可以视为可接受范围。如果你分析的搜索包含许多数据点，那么更容易观察到趋势（如果有的话）。显示搜索响应随时间恶化的趋势可能由以下原因导致：


  *   你索引的数据量比之前更多

  *   搜索返回的事件比例比之前更高，也就是说，搜索正在变得更高密度

  *   搜索覆盖的时间范围比之前更长


  上述任何一个原因都可能导致搜索随时间恶化。你需要详细分析你的配置，以确保如果出现上述原因，它们都出于已知的原因。如果你无法根据上述任何原因解释性能恶化，说明你的搜索存在问题，应当进行更深入的检查。


