  \n## 第 2 章\n\n![image](img/frontdot.jpg)\n\n### 将数据导入 Splunk\n\n\n\n"
- '# 数据导入 Splunk


  在本章中，您将学习如何将数据导入`Splunk`。我们将探讨不同的数据源以及将其导入`Splunk`的多种方式。我们将使用一个数据生成器为虚构的在线零售商店`MyGizmoStore.com`创建用户活动，并将样本数据加载到`Splunk`中。您还将了解`Splunk
  Technology Add-ons`如何为来自操作系统（如`Windows`和`Unix`）的特定数据源提供价值。在本章结束之前，您将了解`Splunk forwarders`的概念，以理解如何将远程数据加载到`Splunk`中。


  ## 数据的多样性


  典型的企业信息技术（IT）基础设施如今由网络和服务器组件构成，范围涵盖大型机到分布式服务器。在这套硬件基础设施之上，您会发现存储着与客户、供应商、订单、物流、供应链等交易相关信息的数据库。这些信息由多种业务应用程序捕获、处理和分析。传统上，企业利用所有这些结构化数据来做出业务决策。主要的挑战在于整合并理解来自如此众多不同来源的所有数据。尽管这一直是传统
  IT 组织的关注重点，但我们看到数据的定义和使用正在超越传统模式。如今，大多数企业希望处理和分析的数据可以分为以下几大类：


  - 存储在数据库或数据仓库中的传统结构化数据

  - 存储在内容仓库中的非结构化数据或文档

  - 不同类型日志中的多结构数据

  - 点击流数据

  - 网络数据

  - 来自社交媒体应用等的数据


  您可以看到这些较新类别的数据（如日志、网络、点击流和社交媒体）正成为企业为做出更好业务决策而进行的主流数据分析的一部分。这些类型的数据有时也被称为机器数据或运维数据。企业希望利用这些数据源的一些典型示例包括：


  - `Web`日志文件，由`Apache`和`IIS`等`Web`服务器生成。这些日志文件提供了网站上及关联应用程序中发生的各种活动信息。

  - 点击流数据文件提供访问者在网站上的具体行为细节。这可用于分析购物模式和特殊行为，例如购物车放弃。

  - 应用程序日志数据，通常包含大量关于应用程序执行的信息，可用于运维目的，例如优化服务器使用。

  - 操作系统级日志，可用于性能和系统监控。

  - 防火墙日志，用于更好地分析安全问题。

  - 来自`Twitter`、`Foursquare`等社交媒体源的数据，可用于大量营销和销售目的。


  那些认为机器数据或日志数据只是供系统管理员（坐在阴暗数据中心调试和分析系统为何宕机或性能为何不满足服务水平协议（`SLA`））使用的日子已经一去不复返了。尽管这种用例仍然有效，但企业希望实时、近实时或为传统商业智能和报告而查看、处理和分析的数据已经发生了彻底的范式转变。现在的问题是，`Splunk`能否处理所有这些机器数据或运维数据源，并与数据库和数据仓库等传统数据源协同工作？简而言之，答案是肯定的，我们将在本章后续部分学习如何将数据导入`Splunk`。


  ## Splunk 如何处理多种数据


  实际上，`Splunk`可以处理几乎任何类型的数据，这些数据来自广泛的源，包括`Web`日志、应用程序日志、网络源、系统指标、数据库中的结构化数据、社交数据等。`Splunk`需要针对每个数据源进行单独配置，每个源可以成为一个特定的数据输入。进入`Splunk`的数据可以是本地的，即数据位于或可用于运行`Splunk`的同一台计算机上，也可以是来自连接到运行`Splunk`的服务器（们）的任何远程设备的数据。您将在本章后面看到如何将远程数据加载到`Splunk`中。`Splunk`将可加载的数据源大致分类为：


  - 文件和目录

  - 网络源

  - `Windows`数据

  - 其他源


  您将详细了解这些源中的每一个。`Splunk`提供了多种选项来定义和配置上述源作为数据输入：


  - `Splunk Web` — 这是标准的用户界面，是与`Splunk`交互的最简单方式。

  - `Splunk CLI` — 命令行界面（`CLI`）也可用于与`Splunk`交互，但主要用于可处理批处理作业的脚本化程序。

  - 应用或插件（`Apps` 或 `Add-ons`）— 这些是运行在`Splunk`框架之上的专用应用程序，可简化与一个或多个数据源类型的工作。我们将在本章后面通过示例讨论`Apps`和`Add-ons`的区别以及如何使用它们。

  - 配置文件 — `Splunk`提供了各种配置文件，可以编辑这些文件来配置和指向不同的数据源。无论使用哪种选项来配置数据源，`inputs.conf`文件都会始终被更新，无论是通过`Splunk
  Web`、`Splunk CLI`、应用和插件，还是手动方式。


  无论您选择哪种方式与`Splunk`交互，数据输入的定义和配置最终都存储在配置文件中。对于本书中的示例，我们将使用用户界面`Splunk Web`。最流行的机器或日志数据形式之一，也是企业广泛分析的，是`Web`日志，也称为访问日志。我们将以`Web`日志为起点，探索并熟悉`Splunk`能做什么。为了模拟真实世界`Web`应用中可能发生的情况，我们创建了一个名为`MyGizmoStore.com`的虚构电商网站，它销售小器件。`MyGizmoStore.com`的数据由生成器创建，该生成器将在本章后面介绍。此生成器模拟典型用户活动产生的日志文件，包括浏览小器件目录、添加到购物车以及最终可能完成购买。


  ## 文件和目录


  `Splunk`使得从文件或目录结构中存储的文件获取数据变得非常容易。您可以作为一次性操作（也称为`oneshot`）从静态文件加载数据，也可以让`Splunk`监视一组目录中的特定类型文件。我们从加载单个文件开始。为了简化此操作，我们为`MyGizmoStore.com`生成了一个访问日志，包含大约`250`条日志条目，代表了商店生命周期中两天内的用户活动。文件`access.log`是本书下载包的一部分。获取下载包后，将`access.log`文件复制到`/opt`目录（`Linux`系统）或`C:\opt`目录（`Windows`系统）。


  `Splunk`将为您提供根据数据的数据类型或源添加数据的选项。对于这个初始示例，我们将使用一个源，即访问日志文件。登录到`Splunk`实例后，转到`Splunk`主页，点击“Do
  more with Splunk”部分中的“Add data”按钮。在“Add Data to Splunk”页面中，您将看到分为两类不同的可用选项。




  - `选择数据类型` — 允许选择预设的日志类型，例如访问日志、系统日志等。

  - `选择数据源` — 允许绑定确定类型的数据源，例如 Windows 注册表数据，或从脚本获取输出作为 Splunk 的数据输入。


  点击“选择数据源”部分下的“来自文件和目录”链接。该选项与“选择数据类型”部分中类似选项的区别在于，我们多了一个选项，即利用转发器将数据发送到 Splunk 服务器（在数据类型分类下）。由于你尚未了解转发器的概念，我们将选择简单的入门方式，如图
  2-1 所示。


  ![9781430257615_Fig02-01.jpg](img/9781430257615_Fig02-01.jpg)


  图 2-1 . 选择数据源


  这将带你进入数据预览页面，如图 2-2 所示。由于这是我们第一次将数据加载到 Splunk 中，预览数据是合理的。预览选项提供了一个机会，让你查看日志条目在提交到
  Splunk 数据存储（称为索引）之前将如何处理。接着，选择“索引前预览数据”单选按钮，并选择`/opt`目录下的`access.log`文件（如果你使用的是
  Linux 系统），或`C:\opt`目录下的文件（如果你使用的是 Windows 环境）。然后点击“继续”按钮。


  ![9781430257615_Fig02-02.jpg](img/9781430257615_Fig02-02.jpg)


  图 2-2 . 预览数据


  弹出的对话框为你提供了设置源类型的选项。默认情况下，Splunk 会解析作为输入提供的数据文件，并确定文件的源类型。然后，它会根据源类型的特性加载或索引该文件。在本例中，由于我们加载的是一个访问日志文件，它已被识别为组合访问日志文件，因此我们接受“使用自动检测的源类型”默认选项（如图
  2-3 所示），并点击“继续”按钮。在第 3 章中，我们将详细解释组合访问日志文件的格式以及日志条目中存储的信息。在第 9 章中，我们将回顾其他选项，例如定义需要以不同方式处理的自定义数据文件的输入。


  ![9781430257615_Fig02-03.jpg](img/9781430257615_Fig02-03.jpg)


  图 2-3 . 设置源类型


  通常被称为记录或简单数据行的内容，在 Splunk 中被称为事件，每个事件都有一个时间戳。在本书中，我们将不断使用、分析和操作时间戳，因为它们是 Splunk
  和大数据分析的关键元素。数据加载过程的下一屏会显示 Splunk 如何将日志条目分解为不同事件，并附带相关的时间戳。默认行为是按时间戳分割事件，但如果 Splunk
  找不到时间戳，它会将文件的所有行视为一个单一事件。然后我们可以自定义将条目分割成不同事件的位置，这将在第 9 章中学习。在本例中，Splunk 将访问日志的条目非常清晰地分解为事件，如图
  2-4 所示。在这里，你可以看到每个事件都包含关于`MyGizmoStore.com`上发生的用户活动信息。预览选项还会显示从日志文件中提取的事件数量，本例中共有
  243 个事件。


  ![9781430257615_Fig02-04.jpg](img/9781430257615_Fig02-04.jpg)


  图 2-4 . `access.log`的数据预览


  ![image](img/sq.jpg) **注意：** 如果你熟悉关系数据库的概念，那么可以这样理解：Splunk 分解出的每个事件在概念上等同于关系数据库表中的一行。


  既然我们已经确认数据看起来不错，并且已被 Splunk 正确处理，你可以点击“继续”按钮，这将带我们进入“添加新内容”页面，在那里我们将自定义一些设置，然后最终将数据索引到
  Splunk 中。由于这是一次性文件处理操作，我们将在“源”下选择“从此 Splunk 服务器索引一次文件”单选按钮。由于我们的计算机名称比较复杂，我们还选择将主机文件值更改为`BigDBook-Test`。


  在上一步中，我们要求 Splunk 自动确定`sourcetype`，因此我们会看到` sourcetype`被设置为自动。默认情况下，当数据加载到 Splunk
  时，它会进入主索引，这是用于存储、处理和分析数据的机制。Splunk 还提供了定义和使用其他索引的功能，这可以帮助你更好地组织和管理数据，尤其是在数据治理方面，例如访问、保护和保留策略。对于这个示例，我们将使用主索引，但我们将在下一节中看到如何创建一个新索引并使用它。点击“保存”按钮。如果
  Splunk 能够完全处理数据，下一页将显示一条成功消息。


  ![image](img/sq.jpg) **注意：** 如果你熟悉 Oracle 中的模式，Splunk 索引与该概念非常相似。Splunk 中的索引是数据的集合，而模式则包含数据的表集合。


  一旦 Splunk 成功索引数据，你就可以开始审查数据以确保其正确性。要列出加载到 Splunk 中的所有日志条目，我们在搜索栏中输入`host=BigDBook-Test`，然后按回车键。此搜索会列出所有事件的完整列表，以及默认字段，包括时间戳、数据来源的主机、源类型和数据源。Splunk
  将始终提供这些字段。在图 2-5 中，你可以看到总数为 243 个事件，这与我们刚刚索引的文件中的日志条目数量相同。你还可以看到每个事件左侧的时间戳，以及每个事件下方显示的另外三个默认字段。


  ![9781430257615_Fig02-05.jpg](img/9781430257615_Fig02-05.jpg)


  图 2-5 . 搜索结果


  当大量数据从单个来源摄入 Splunk 时，使用单独的索引可以更好地管理它们，这些索引可以放置在不同的存储层级上。我们将继续为`MyGizmoStore.com`日志文件创建一个单独的索引。要创建索引，请点击用户界面右上角的“管理器”菜单项，然后在数据部分点击“索引”链接，如图
  2-6 所示。


  ![9781430257615_Fig02-06.jpg](img/9781430257615_Fig02-06.jpg)


  图 2-6 . 创建索引


  在索引页面，点击“新建”按钮，并将索引命名为`mygizmostoreindex`。你可以忽略表单中的冷数据和解冻数据路径选项。这些是高级选项，可用于将 Splunk
  索引中较旧或未使用的数据移动到，例如，成本更低的存储中。它还提供了使用冻结归档路径的概念将数据归档到 Splunk 之外的能力。在我们的情况下，我们将保留这些选项的默认值，因为模拟数据集不会很大。点击“保存”按钮。一旦新索引创建成功，它将出现在索引页面中，如图
  2-7 所示。


  ![9781430257615_Fig02-07.jpg](img/9781430257615_Fig02-07.jpg)


  图 2-7 . 索引列表




  截至目前，我们了解了如何通过一次性文件索引将数据导入 Splunk。在实际用例中，日志文件会不断更新，新增条目，需要对这些不断扩大的日志文件进行持续处理和分析。Splunk
  为此提供了监控某些目录（这些目录中的文件持续更新）的能力。Splunk 的目录监控功能允许我们指定需要监控的目录，该目录中的文件将用作数据输入。


  在探索监控选项之前，让我们再次回到`MyGizmoStore.com`。之前我们使用了一个来自该在线商店的静态日志文件，来了解如何将此类数据导入 Splunk。在现实世界中，`MyGizmoStore.com`可能运行在不同主机的多个
  Web 服务器上，并写出需要持续监控、处理和分析的日志文件。


  为了模拟这种行为，我们设计了一个测试数据生成器来为`MyGizmoStore.com`生成日志文件。我们将回顾测试数据生成器如何运行以及如何启动数据生成。


  ## 数据生成器


  示例数据生成器使用 Python 脚本语言编写，旨在同时支持 Microsoft Windows 和 Linux 操作系统。该生成器使用随机生成器创建随机的 IP
  地址（代表网站访客）、一组预定义的产品识别码（格式如`CA-NY-99`）和物项识别码（格式如`HYD-19`）。商店销售的小玩意可分为以下几类：


  - `BLUE_GIZMOS`

  - `RED_GADGETS`

  - `WHITE_WIDGETS`

  - `ORANGE_WATCHMACALLITS`

  - `PURPLE_DOOHICKEYS`

  - `BLACK_DOODADS`


  网站访客可以执行以下操作：


