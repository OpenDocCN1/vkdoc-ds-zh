- "# 网站监控\n\n在本章中，您将学习如何建模并创建一个网站监控工具，该工具包含报表和仪表盘，可帮助企业的 IT 和业务部门衡量在线零售商店网站（例如`MyGizmoStore.com`）的不同方面。\n\
  \n## 监控网站\n\n企业通常使用网站监控来确保其网站正常运行并能响应用户请求。在对网站或应用程序进行更新并投入生产之前，IT 部门通常会模拟数千名访问者访问网站的行为，并观察网站或应用程序的响应情况。他们还会模拟来自不同地理区域和服务器的访问者。\n\
  \n我们为`MyGizmoStore.com`创建的示例数据与这种方法非常相似，包含一组定义明确且可自定义的模式。当网页或网站的部分功能出现故障时，监控工具会发送告警，使\
  \ IT 部门能够更快地解决问题。您在第 5 章中了解了如何使用 Splunk 告警获取通知。\n\n监控对于确保网站对用户可用并最大限度减少停机时间至关重要。依赖网站或应用程序进行工作的用户，如果其可靠性无法保证，可能会感到沮丧，甚至停止使用该应用程序。如果网站是在线业务（如`MyGizmoStore.com`），这一点就更加关键，因为网站失效意味着客户会转向竞争对手购买，从而导致收入损失。监控可以涵盖应用程序或网站运行所需的许多方面：网络连接、DNS\
  \ 记录、数据库连接、带宽以及计算机资源（如 RAM、CPU 负载、磁盘空间、事件等）。IT 方面常用的衡量指标包括响应时间、服务器可用性、流量模式；而业务方面则包括用户人口统计数据、用户在网站上花费的时间、新用户与现有用户的数量对比等。\n\
  \n在第 2 章、第 3 章和第 4 章中，您学习了如何使用不同的 SPL 命令处理、分析和可视化数据。在本章中，我们将利用您之前学到的不同 SPL 命令和搜索方法，着手创建一个网站监控工具，帮助我们监控`MyGizmoStore.com`站点。本章将回顾之前的一些讲解，并补充一些想法，介绍如何快速集合并生成一些关键报表，这些报表可从\
  \ IT 和业务角度出发，并通过仪表盘进行监控。当您在本书后续章节处理更多样化的数据集时，可以在此基础上扩展此监控工具。\n\n我们将利用以下用例来为监控仪表盘创建报表。\n\
  \n### IT 运维\n\n*   按主机统计的点击量\n*   排除内部访问后的按主机统计的点击量\n*   具有良好 HTTP 状态的流量\n*   具有不良\
  \ HTTP 状态的流量\n*   按不良 HTTP 状态排序的热门页面\n\n### 业务\n\n*   按地区划分的用户人口统计数据\n*   跳出率\n\
  *   独立访客数\n\n### IT 运维\n\n### 按主机统计的点击量\n\n在此用例中，我们希望查看指定时间段内进入`MyGizmoStore.com`主机的流量。虽然您可以使用时间轴来调整时间段，但您已经熟悉了第\
  \ 5 章中使用的时间修饰符；我们将利用它们来指定时间范围。在下面的搜索中，您将查看过去七天内的事件，按主机统计事件数量，并使用`timechart`命令以图表形式呈现。您会注意到时间修饰符`earliest`的赋值中包含了`@`符号。时间修饰符允许将`@`符号作为指定值的一部分，以指示时间应如何向下取整。在我们的搜索中，我们将其向下取整到天，但您可以将时间修饰符向下取整到任何支持的时间单位，例如秒、分钟、小时、天、周、特定的星期几、月、季度和年。让我们在搜索栏中输入以下搜索：\n\
  \n```\nsourcetype=access_*\n  earliest=-7d@d\n  latest=now\n| timechart count by\
  \ host\n```\n\n图 6-1 显示了此搜索的柱状图，图中每个柱形代表一个`MyGizmoStore.com`主机。在大多数日子里，三个主机中有两个处理的请求数量几乎相等，而另一个主机的负载较轻。IT\
  \ 部门可以使用此报表并通过增加查询天数来进一步分析数据，看看能否发现三个主机中哪个主机处理的请求较少，并找出其模式。然后，他们可以微调负载均衡器，以便所有用户请求都能得到快速响应，并且硬件资源得到适当优化。我们将使用“格式选项”链接来修改图表以及`x`轴和`y`轴的标题，并将此报表保存为“按主机统计的点击量”（图\
  \ 6-1）。\n\n![9781430257615_Fig06-01.jpg](img/9781430257615_Fig06-01.jpg)\n\n图 6-1。按主机统计的点击量\n\
  \n### 排除内部访问后的按主机统计的点击量\n\n对于像`MyGizmoStore.com`这样的在线零售商店，会有来自内部员工或正在浏览或购物的用户的点击。如果排除掉来自网络内部\
  \ IP 地址的事件，那么按主机统计的点击量图表会呈现出怎样的不同，这将非常有趣。为此，我们可以修改上述搜索，只查看`clientip`字段不等于`192*`的事件。如果需要，您可以向搜索中添加更多的子网。让我们在搜索栏中输入修改后的搜索：\n\
  \n```\nsourcetype=access_*\n  earliest=-7d@d\n  latest=now\n  clientip != 192*\n\
  | timechart count by host\n```\n\n\n\n图 6-2 展示了更新后搜索的列类型图表。我们为`MyGizmoStore.com`提供的样本数据中内部访问事件不多，因此图表上看不出差异；但在实际应用中，比较这两张图表有助于判断内部请求是否导致请求数量偏差。IT\
  \ 部门可以利用这一信息，将来自内部 IP 地址的流量分流到其他主机，以免影响外部客户。接下来，我们将修改图表以及*X 轴*和*Y 轴*的标题，并将此报告另存为“按主机统计的访问量（不含内部访问）”。\n\
  \n![9781430257615_Fig06-02.jpg](img/9781430257615_Fig06-02.jpg)\n\n图 6-2. 按主机统计的访问量（不含内部访问）\n\
  \n## 具有良好 HTTP 状态码的流量\n\n在前几章中，我们处理了使用 HTTP 状态码的搜索。从运维角度来看，了解 HTTP 流量的成功率至关重要；这能告诉我们有多少请求是成功的，多少是失败的。我们首先找出良好流量。我们在时间修饰符中使用了\
  \ 15 天的时间窗口，但您可以通过设置`earliest=-24h@h`将其调整为最近 24 小时。现在，让我们在搜索栏中输入以下搜索：\n\n```\nsourcetype=access_*\n\
  \  earliest=-15d@d\n  latest=now\n  status>100 status<300\n| timechart count BY\
  \ status\n```\n\n尽管我们指定的搜索条件是查找`status`字段在 100 到 300 之间（不含端点）的所有事件，但我们的样本数据在此范围内仅有状态码为\
  \ 200 的事件，正如图 6-3 所示。我们将对图表以及*X 轴*和*Y 轴*的标题进行适当修改，并将此报告另存为“具有良好 HTTP 状态码的流量”。\n\n\
  ![9781430257615_Fig06-03.jpg](img/9781430257615_Fig06-03.jpg)\n\n图 6-3. 具有良好 HTTP\
  \ 状态码的流量\n\n## 具有不良 HTTP 状态码的流量\n\n了解具有不良 HTTP 状态码的流量比了解良好流量重要得多，因为不良状态可能导致直接的经济损失。我们可以更新之前的搜索，使其查找所有`status`字段大于或等于\
  \ 300 的事件。当网站已迁移或需要临时重定向时，可能会用到 3xx 范围内的 HTTP 状态码（在这种情况下，它们并不一定意味着不良 HTTP 流量）。在这个特定示例中，我们包含了\
  \ 3xx 范围内的状态码，但可以通过将`status >=300`改为`status >= 400`来细化搜索以排除它们。也可以通过修改时间修饰符，将此搜索用作一个报表，显示过去\
  \ 24 小时内非 200 的 HTTP 状态。现在，让我们在搜索栏中输入以下搜索：\n\n```\nsourcetype=access_*\n  earliest=-15d@d\n\
  \  latest=now\n  status>=300\n| timechart count BY status\n```\n\n图 6-4 展示了具有不良\
  \ HTTP 状态码的图表；与我们之前仅包含 HTTP 状态码 200 的搜索不同，我们可以在此看到事件分布在 400、404、406、408、500 和 503\
  \ 这些 HTTP 状态码上。虽然我们在第 3 章中讨论过这些代码的含义，但用文字说明这些状态码比直接显示数字更有意义。我们可以通过查找表来实现这一点，您将在接下来的几章中学习到。由于本章旨在提供创建监控工具的基本框架，在本书结束时，您将能够将这些报表转化为满足企业需求的工具。我们将对图表以及*X\
  \ 轴*和*Y 轴*的标题进行适当修改，并将此报告另存为“具有不良 HTTP 状态码的流量”（图 6-4）。\n\n![9781430257615_Fig06-04.jpg](img/9781430257615_Fig06-04.jpg)\n\
  \n图 6-4. 具有不良 HTTP 状态码的流量\n\n您始终可以深入查看图表中的单个列，或点击右侧的不同状态图例。例如，点击 404 状态将显示下钻事件列表，如图\
  \ 6-5 所示。您会注意到搜索中还有一个额外的字段子句，即`status=404`。\n\n![9781430257615_Fig06-05.jpg](img/9781430257615_Fig06-05.jpg)\n\
  \n图 6-5. HTTP 404 状态的下钻图表\n\n## 按不良 HTTP 状态码统计的热门页面\n\n在获得不良 HTTP 状态码流量的信息后，下一步可能是找出属于不良\
  \ HTTP 状态的热门页面。我们可以使用以下搜索来实现，该搜索查找不良 HTTP 状态事件、不同的 IP 地址，并通过`uri`字段获取计数，该字段代表用户尝试访问的页面。现在，让我们在搜索栏中输入以下搜索：\n\
  \n```\nsourcetype=access_*\n  earliest=-3d@d\n  latest=now\n  status>=300\n| stats\
  \ dc(clientip) as \"unique ips\"\n  count as \"total count\" by uri, status\n```\n\
  \n图 6-6 展示了结果图表。根据您拥有的数据集以及时间修饰符的值，此图表会显得非常不同。在第 4 章中，您已经看到并非所有图表类型都适用于所有数据类型。在此特定用例中，我们得到的图表中各字段的值处于不同的数量级。这意味着我们同时拥有非常小和非常大的值。为了使图表更有意义，我们将图表类型更改为“折线图”，并选择对数刻度而非线性刻度，以提高图表的清晰度。要将刻度设置为对数，请点击“格式化选项”，点击*Y\
  \ 轴*，并将轴刻度值更改为对数。我们将对图表以及*X 轴*和*Y 轴*的标题进行适当修改，并将此报告另存为“按不良 HTTP 状态码统计的热门页面”。\n\n\
  ![9781430257615_Fig06-06.jpg](img/9781430257615_Fig06-06.jpg)\n\n图 6-6. 具有不良 HTTP\
  \ 状态码的热门页面\n\n### 业务\n\n#### 按区域划分的用户人口统计\n\n从业务角度来看，了解哪些地区或地方拥有最多的用户/客户会很有趣。在第\
  \ 4 章中，我们使用了 Google Maps 应用程序来可视化 IP 地址。我们可以利用 Google Maps 应用程序中的`geoip`命令来找出用户来自的前五个国家。`geoip`命令将\
  \ IP 地址作为输入，并将这些 IP 地址绘制在全球地图上。在我们的示例`MyGizmoStore.com`数据中，我们有`clientip`字段，其中包含我们可以输入的\
  \ IP 地址。除了在 Google Maps 中绘制 IP 地址外，`geoip`命令还会输出以下字段：\n\n*   `<field>_country_name`\n\
  *   `<field>_country_code`\n*   `<field>_region_name`\n*   `<field>_city`\n*   `<field>_latitude`\n\
  *   `<field>_longitude`\n*   `_geo`\n\n字段名称以作为输入的字段名称作为前缀。因为我们使用`clientip`字段作为输入，所以`geoip`将生成名称为`clientip_country_name`、`clientip_country_code`、`clientip_region_name`、`clientip_city`、`clientip_latitude`和`clientip_longitude`的新字段。`_geo`字段包含组合的纬度和经度信息。我们可以从一个简单的搜索开始，查看由`geoip`产生的新字段。让我们在搜索栏中输入以下内容：\n\
  \n```\nsourcetype=access_*\n| geoip clientip\n```\n\n图 6-7 显示了 Splunk 搜索的左侧栏，我们可以从中看到由`geoip`命令产生的字段。\n\
  \n![9781430257615_Fig06-07.jpg](img/9781430257615_Fig06-07.jpg)\n\n图 6-7. `geoip`命令产生的字段\n\
  \n\n\n现在你已经熟悉了 `geoip` 命令，可以通过添加时间修饰符来扩展这个简单的搜索，查找过去 15 天的所有事件，并将 `geoip` 命令的结果通过管道传递，利用\
  \ `clientip_country_name` 字段找到排名前五的国家。如果你想按城市而不是国家查看，也可以使用 `clientip_city` 字段。请在搜索栏中输入以下搜索：\n\
  \n```\nsourcetype=access_*\n  earliest=-15d@d\n  latest=now\n| geoip clientip\n\
  | top limit=5 clientip_country_name\n```\n\n我们将对图表以及 *x* 轴和 *y* 轴的标题进行适当的修改，并将此报告保存为“按地区划分的用户人口统计信息”。图\
  \ 6-8 展示了用户来源排名前五的国家的柱状图；在这个例子中，我们可以看到美国位居榜首。\n\n![9781430257615_Fig06-08.jpg](img/9781430257615_Fig06-08.jpg)\n\
  \n图 6-8. 按地区划分的用户人口统计信息\n\n#### 跳出率\n\n从商业角度来看，了解客户对 `MyGizmoStore.com` 等网站的访问跳出率会很有趣。当访问者进入和退出都在同一个页面上，且没有访问网站上的其他任何页面时，视为一次跳出。为了实现这一点，我们使用\
  \ `transaction` 命令根据特定 IP 地址访问的页面数量来分组事件。在以下搜索中，我们使用 `clientip` 作为事件组的共同标识符，并使用\
  \ `maxpause` 选项来指定事件之间的暂停时间不超过一小时。`transaction` 命令会产生两个字段：\n\n* `duration`，即第一个事件和最后一个事件时间戳之间的差值\n\
  * `eventcount`，即事务中的事件总数。\n\n我们使用 `eventcount` 字段配合 `eval` 命令将事务分类为：\n\n* 跳出\n*\
  \ 2-5 个页面\n* 6-10 个页面\n\n为了将事务归类到这三个桶中，我们使用了一个 `case` 函数，该函数比较每个事务 `eventcount`\
  \ 的值，并将其归入三个桶之一。请在搜索栏中输入以下搜索：\n\n```\nsourcetype=access_*\n| transaction clientip\
  \ maxpause=1h keepevicted=t mvlist=t\n| eval user_type=case(eventcount=1, \"Bounced\"\
  ,\n        eventcount<=5, \"2-5 pages\",\n        eventcount<=10,\"6-10 pages\"\
  )\n| top limit=5000\n  user_type\n```\n\n图 6-9 展示了跳出率分布的饼图，以及跳出访问和不同深度访问（如 2-5 个页面和\
  \ 6-10 个页面）的百分比。我们将对图表以及 *x* 轴和 *y* 轴的标题进行适当的修改，并将此报告保存为“跳出率”。\n\n![9781430257615_Fig06-09.jpg](img/9781430257615_Fig06-09.jpg)\n\
  \n图 6-9. 跳出率\n\n你可以将鼠标悬停在饼图上，查看用户数量和跳出率的百分比，如 图 6-10 所示。\n\n![9781430257615_Fig06-10.jpg](img/9781430257615_Fig06-10.jpg)\n\
  \n图 6-10. 带有计数和平均值的跳出率\n\n## 唯一访客\n\n从商业角度来看，了解访问网站的唯一用户数量会很有趣。我们可以使用 `clientip`\
  \ 字段的去重计数函数来查看在给定时间段内有多少唯一访客。在以下搜索中，我们查找 `MyGizmoStore.com` 不同主机在过去 10 天内的唯一访客。请在搜索栏中输入以下搜索：\n\
  \n```\nsourcetype=access_*\n  earliest=-10d@d\n  latest=now\n| timechart  dc(clientip)\
  \ AS unique_visitors by host\n```\n\n图 6-11 展示了主机 BigDBook-www1、BigDBook-www2 和\
  \ BigDBook-www3 的唯一访客柱状图。\n\n![9781430257615_Fig06-11.jpg](img/9781430257615_Fig06-11.jpg)\n\
  \n\n\n图 6-11. 独立访客\n\n我们将对图表以及 `x` 轴和 `y` 轴的标题进行适当修改，然后将此报告另存为“独立访客”。\n\n在第 4 章中，我们处理了一些已添加到\
  \ `MyGizmoStore.com` 仪表板中的报告。其中部分报告同样适合用作网站监控工具。我们在第 4 章中添加的、值得回顾的报告包括：\n\n- 每个产品的购买数和浏览数图表\n\
  - 购买趋势\n- 交易持续时间\n- 按产品统计的热门购买\n- 获取与提交\n\n现在，您可以创建一个名为“网站监控”的仪表板。虽然您已在第 4 章中学习了如何创建新仪表板，但我们还是快速回顾一下如何向仪表板添加报告。单击“仪表板和视图”菜单下的“创建仪表板...”链接，如图\
  \ 6-12 所示。\n\n![9781430257615_Fig06-12.jpg](img/9781430257615_Fig06-12.jpg)\n\n\
  图 6-12. 创建仪表板\n\n这将弹出“创建新仪表板”对话框。输入 `WSM` 作为 ID，输入 `Web Site Monitoring` 作为名称，如图\
  \ 6-13 所示。单击“创建”按钮。\n\n![9781430257615_Fig06-13.jpg](img/9781430257615_Fig06-13.jpg)\n\
  \n图 6-13. 创建网站监控仪表板\n\n您将看到已创建一个空仪表板。要使其可编辑并添加之前创建的报告，请将“编辑”开关打开，如图 6-14 所示。\n\n\
  ![9781430257615_Fig06-14.jpg](img/9781430257615_Fig06-14.jpg)\n\n图 6-14. 编辑网站监控仪表板\n\
  \n要开始向仪表板添加报告，您必须先创建一个新面板来容纳报告。单击“新建面板”按钮，将弹出一个对话框，如图 6-15 所示。开始为“按主机统计的点击量”报告创建面板。输入\
  \ `Hits by Host` 作为标题，并选中“已保存搜索”单选按钮；下拉框将显示已保存的报告列表。选择 `Hits by Host` 报告，然后单击“保存”按钮。\n\
  \n![9781430257615_Fig06-15.jpg](img/9781430257615_Fig06-15.jpg)\n\n图 6-15. 按主机统计的点击量面板\n\
  \n这将使报告以表格格式显示。为了将其可视化为图表，您需要单击“编辑”并选择“编辑可视化”，如图 6-16 所示。\n\n![9781430257615_Fig06-16.jpg](img/9781430257615_Fig06-16.jpg)\n\
  \n图 6-16. 为“按主机统计的点击量”编辑可视化\n\n这将弹出一个对话框，您可以在其中根据希望如何可视化表格数据来进行更改。选择“柱状图”，如图 6-17\
  \ 所示，然后单击“保存”按钮。\n\n![9781430257615_Fig06-17.jpg](img/9781430257615_Fig06-17.jpg)\n\
  \n图 6-17. 编辑可视化\n\n现在，您将能够看到“按主机统计的点击量”的表格数据以柱状图的形式呈现，如图 6-18 所示。\n\n![9781430257615_Fig06-18.jpg](img/9781430257615_Fig06-18.jpg)\n\
  \n图 6-18. 按主机统计的点击量\n\n对于我们在本章中创建的其余每个报告，您都可以在“网站监控”仪表板中创建一个新面板，并编辑该面板的可视化，使其呈现适当的图表。将所有面板添加到仪表板后，您可以移动面板，以便监控信息得到合理分组。\n\
  \n“网站监控”仪表板创建完成后，可以从“仪表板和视图”菜单访问它，如图 6-19 所示。\n\n![9781430257615_Fig06-19.jpg](img/9781430257615_Fig06-19.jpg)\n\
  \n图 6-19. 启动网站监控仪表板\n\n图 6-20 和 6-21 展示了您在本章中创建的所有报告的仪表板面板。这些图表看起来会有显著差异，因为它们将基于您拥有的样本数据。除了本章创建的报表，您还可以将前面章节的报表添加到网站监控仪表板中。\n\
  \n![9781430257615_Fig06-20.jpg](img/9781430257615_Fig06-20.jpg)\n\n图 6-20. 网站监控仪表板\n\
  \n![9781430257615_Fig06-21.jpg](img/9781430257615_Fig06-21.jpg)\n\n图 6-21. 网站监控仪表板\n\
  \n## 本章小结\n\n在本章中，我们创建了一个网站监控工具，它可以显示按主机统计的点击量、良好与不良 HTTP 流量、用户人口统计信息、独立访客、跳出率以及其他指标。\n\
  \n## 第 7 章\n\n![image](img/frontdot.jpg)\n\n"
- "# 使用日志文件创建高级分析\n\n在本章中，我们将介绍一种新范式：利用日志文件创建高级分析，从而绕过传统分析所采用的路径。为此，我们将通过一系列我们称为“语义日志记录”的建议，回顾创建分析的最佳方法。我们将通过一个示例来说明其简便性。\n\
  \n## 传统分析\n\n传统分析涵盖多种功能，通常有不同名称，如商业智能、数据挖掘、在线分析处理 (OLAP)，或干脆称为分析。通常，公司使用分析来更好地了解自身运营、削减成本、改进决策并识别低效流程，这有助于发现新的商机并重组其流程。\n\
  \n开发分析面临的挑战在于，大多数原始信息存储于通常解耦或分布在分布式系统中的数据存储中。这使得信息整合非常困难。最困难的挑战可能是，执行分析所需的信息必须为此目的而特意提供，而这种努力涉及经历典型的软件开发生命周期，这需要时间。它也会成为信息技术\
  \ (IT) 部门待办事项队列中的另一项任务，并且通常优先级较低。\n\n问题的核心在于，传统分析的开发周期基于所谓的“早期结构绑定”，即您需要事先知道将针对数据提出哪些问题。典型的开发步骤可以总结如下：\n\
  \n-   确定要问的问题\n-   设计数据模式\n-   规范化数据\n-   编写数据库插入代码\n-   创建查询\n-   将结果输入分析工具\n\n\
  根据获取必要数据的程序复杂程度，这个过程可能需要数天、数周甚至数月。通常，执行分析所需的数据将被放入数据仓库或数据集市，然后由各种分析工具访问。这种架构以及典型的数据收集案例，可以在\
  \ 图 7-1 中看到。\n\n![9781430257615_Fig07-01.jpg](img/9781430257615_Fig07-01.jpg)\n\n\
  图 7-1. 典型分析工具架构\n\n\n\n如图 7-1 所示，数据可以通过在系统中包含代码直接插入所需数据到数据仓库的方式来收集，或者从现有数据库中提取，这通常需要使用提取-转换-加载（ETL）程序进行某种转换。最后，许多数据仓库系统包含连接器，以便更轻松地从应用程序收集数据。如前所述，无论数据如何收集，这都是一个为此目的而必须执行的额外步骤。\n\
  \n### 范式转变\n\n我们建议，通过结合使用日志文件和 `Splunk`，您可以获得执行传统分析通常所需的所有信息。更棒的是，这个过程更快、更简单。首先，几乎任何程序或基于计算机的设备都会生成至少一个日志文件；诚然，在某些情况下（例如在\
  \ `Windows` 中），与日志文件相关的典型信息存储在事件管理系统中。日志文件通常被忽视这一事实并不会降低它们的重要性。\n\n正如您在之前的章节中所见，日志文件包含一个信息宝库，其中包含广泛的数据，可用于确保系统安全并满足合规性要求。它们是系统中活动和行为的确定性记录。因此，它们可以为\
  \ IT 部门和整个业务提供洞察，呈现客户行为、产品和服务使用情况，并最终实现端到端的事务可见性。\n\n如图 7-2 所示，当您从系统基础设施（如 `Windows`\
  \ 服务器、`Linux/Unix` 服务器、虚拟化和云服务器以及网络）以及应用程序和数据库的日志文件中收集机器数据时，您可以获得所有系统的完整视图。\n\n\
  ![9781430257615_Fig07-02.jpg](img/9781430257615_Fig07-02.jpg)\n\n图 7-2 企业系统的典型日志文件\n\
  \n使用像 `Splunk` 这样的工具可以轻松收集所有这些日志文件，即使它们不被认为是结构化的，因为数据没有预先定义的模式，没有自定义连接器，并且通常您不必使用关系数据库。关于\
  \ `Splunk` 的市场文献将收集和处理的信息称为运营智能。`Splunk` 提供运营智能的主要能力包括：\n*   **搜索**：允许深入挖掘数据以排查问题和事件，从而促进根本原因分析。\n\
  *   **实时可见性**：通过它，您可以监控和告警整个系统，从而跟踪服务水平协议（`SLA`）和性能问题。\n*   **历史分析**：通过它，您可以发现趋势和历史模式、行为基线和阈值，并生成合规报告。\n\
  \n使用 `Splunk` 通过日志文件进行分析更快、更容易的关键在于，它使用了与传统早期结构绑定不同的开发周期。使用 `Splunk`，您采用的是所谓的“后期结构绑定”，其步骤简单如下：\n\
  *   将数据（或事件）写入日志文件。\n*   收集日志文件。\n*   使用 `Splunk` 创建搜索、图表和报告。\n\n与传统开发生命周期相比，这个过程只需要几分钟或几小时，而不是几天、几周甚至几个月。使这一提议更具吸引力的是，您无需改变开发者的任何行为，因为他们已经在记录关键信息。尽管这主要是出于调试和审计的原因，但现有的大部分代码中都散布着相当数量的日志记录指令。\n\
  \n一般来说，从 IT 组织的角度来看，收集一堆日志文件比处理一个不断增长的数据仓库要简单得多，因为大多数操作系统都具备良好的日志文件管理功能，允许基于大小或时间进行轮转。\n\
  \n## 语义日志记录\n\n我们将语义日志记录定义为为了进行数据分析而明确写入日志文件的数据或事件。如前所述，大多数现有代码中已经包含了日志记录语句。通过语义日志记录，我们通过在整个代码中添加或修改日志记录指令来使这个过程正式化。通常，这非常简单；例如，以下是每次处理商业交易时都会调用的高级伪代码片段：\n\
  \n```\nvoid submitPurchase(transactionID)\n{\n   log.info(\"action=submitPurchaseStart,\
  \ transactionID=%d\", transactionID,\\\n            \" productId=%d\", productId,\\\
  \n            \" listPrice=%d\\n\", listPrice);\n\n// 如果发生错误，以下每个调用都会抛出异常，异常也会被记录\n\
  \   submitCreditCard(...);\n   generateInvoice(...);\n   fulfillOrder(...);\n\n\
  log.info(\"action=submitPurchaseComplete, transactionID=%d\\n\", transactionID);\n\
  }\n```\n\n上述伪代码中以粗体突出显示的日志记录语句，调用了一个记录相应信息并包含时间戳的方法。仅通过添加这两条日志记录语句，我们就能立刻获得足够的信息来回答以下问题：\n\
  *   每小时、每天或每月的购买量是多少？\n*   在一天中的不同时间和一周中的不同日子，购买过程耗时多长？\n*   购买耗时是否比上个月更长？\n*  \
  \ 底层系统是随着时间的推移变得越来越慢，还是保持稳定？\n*   有多少次购买失败了？将这些失败随时间变化的情况绘制成图表。\n*   哪些具体的购买失败了？\n\
  \n几年前，我们生成了一些伪造数据，这些数据本应由前面展示的代码示例创建。该文件包含了从 2011 年 8 月 29 日（星期一）到 2011 年 10 月 2\
  \ 日（星期日）共 5 周的交易数据，近 400 万个事件。您可以在本书的下载包中找到名为 `c7sampledata.log.gz` 的文件。\n\n在将数据加载到\
  \ `Splunk` 之前，我们按照第 2 章中介绍的步骤创建一个名为 `c7` 的新索引。我们将按照以下步骤将样本数据加载到这个索引中：\n*   在 `Splunk`\
  \ 用户界面的任何屏幕上，点击位于右上角的 `Manager` 链接。\n*   在管理屏幕上选择 `Data inputs` 选项。\n*   在 `Files\
  \ & directories` 选项右侧的 `Actions` 列下，点击 `Add new`。\n*   在 `Preview data before indexing`\
  \ 选项下，点击 `Browser server` 框选择 `c7sampledata.log.gz` 文件，然后点击右下角的 `Continue` 按钮。\n\
  *   由于 `Splunk` 不熟悉此数据源，它会弹出一个窗口，让您选择启动一个新的源类型或使用现有源类型。选择启动一个新的源类型。\n*   此时，`Splunk`\
  \ 会显示数据预览，它会高亮显示事件中的时间戳，并显示其解释的时间戳，如图 7-3 所示。\n\n![9781430257615_Fig07-03.jpg](img/9781430257615_Fig07-03.jpg)\n\
  \n图 7-3 数据预览\n\n在图 7-3 中，您可以看到 `Splunk` 分配的时间戳与实际事件中高亮显示的时间戳不同。差异的原因是事件的时间戳基于美国东部夏令时区，但\
  \ `Splunk` 用户定义了太平洋时区，因此它相应地显示了时间戳。\n\n\n\n![image](img/sq.jpg) **警告** 尽管 Splunk\
  \ 存储了正确的时间戳，但它会根据用户配置文件中定义的时区进行显示。这也会影响搜索中选择的时间范围。\n\n![image](img/sq.jpg) **注意**\
  \ 顺便提一句，要查看或更改当前用户配置文件的时区，可以进入管理器并选择“Your account”选项。从图 7-4 中可以看到，该界面允许管理用户配置文件中的多项设置，包括时区。\n\
  \n![9781430257615_Fig07-04.jpg](img/9781430257615_Fig07-04.jpg)\n\n图 7-4. 用户配置文件\n\
  \n回到加载样本数据。现在你理解了时间戳差异的原因，且其余数据看起来都正确，我们点击数据预览上方的“continue”链接。此操作会弹出一个窗口，要求命名新的源类型。我们将其命名为\
  \ `c7example`，然后点击右下角的“Save source type”按钮。随后会出现另一个弹出窗口，提示 `c7example` 已成功创建，接着点击“Create\
  \ input”按钮。\n\n此时，你会看到图 7-5 所示的界面，在此界面中选择“从此 Splunk 服务器索引一次文件”。图 7-5 中未显示，但在“More\
  \ settings”部分下的对应下拉菜单中，选择 Splunk 用于存储这些数据的索引，本例中为 `c7`。\n\n![9781430257615_Fig07-05.jpg](img/9781430257615_Fig07-05.jpg)\n\
  \n图 7-5. 加载新文件\n\n保存新文件定义后，Splunk 会立即开始加载。对于本例，加载需要几分钟。要了解加载何时完成，可以在用户界面中进入搜索窗口，从状态下拉菜单中选择“Index\
  \ activity”，然后选择“Index activity overview”。这将显示图 7-6 中的信息，从中可以看到 `c7` 索引拥有 3,815,666\
  \ 个事件，这与原始文件的事件数量一致。\n\n![9781430257615_Fig07-06.jpg](img/9781430257615_Fig07-06.jpg)\n\
  \n图 7-6. 索引活动概览\n\n下一步是验证数据是否已正确加载。在查看搜索结果之前，必须记住选择正确的数据时间范围，因为数据来自 2011 年。为此，从时间选择器的下拉菜单中选择“Custom\
  \ time”。这会弹出一个窗口，如图 7-7 所示。在窗口中可以看到，我们选择了最早的起始日期，并将 10 月 3 日作为最晚时间。尽管样本数据在 10 月\
  \ 2 日午夜前几秒结束，但选择 10 月 3 日可以避免在最新时间字段中输入 23:59:59.999。如果不这样做，搜索结果将为空。\n\n![9781430257615_Fig07-07.jpg](img/9781430257615_Fig07-07.jpg)\n\
  \n图 7-7. 设置自定义时间范围\n\n现在你可以输入以下搜索来验证数据：`index=c7 | head`。这会显示最新的 10 个事件，用于验证事件中的字段是否被识别并显示在左侧栏中。同时，还要检查\
  \ Splunk 为每个事件创建的默认字段的值：这些字段包括主机、源类型和源文件。在图 7-8 中可以看到，左侧栏中显示了 `action`、`transactionID`、`productId`\
  \ 和 `listPrice` 字段，且每个事件的默认字段显示了正确的信息。\n\n![9781430257615_Fig07-08.jpg](img/9781430257615_Fig07-08.jpg)\n\
  \n图 7-8. 验证加载的数据\n\n验证完成后，你可以编写搜索来回答之前提出的问题。然而，仅使用 `submitPurchaseStart` 事件来计算指标是不正确的，因为如果在\
  \ `submitPurchaseComplete` 事件之前的任何函数失败，指标就会出现偏差。由于完整的事务由这两个事件共同组成，你必须使用 Splunk 的\
  \ `transaction` 命令（我们在第 3 章中已经介绍过）来正确计算所需的指标。\n\n`transaction` 命令的开销相当大，因为它会跟踪所有事务的结束点，直到能够将它们与起始点匹配，前提是这些事件是成对的，但实际情况可能并非总是如此。根据事件数量以及首个事件与最后一个事件之间的时间差，这可能会消耗大量内存。跟踪是按逆序进行的，因为\
  \ Splunk 按时间逆序查看事件，从最新到最旧。\n\n我们首先找出样本数据中事务开始和结束之间的最长时间。可以通过输入以下命令完成：\n\n```\nindex=c7\n\
  | transaction transactionID maxspan=1m\n| stats max(duration)\n```\n\n在此搜索中，你指定事务由字段\
  \ `transactionID` 界定，即只有该字段值相同的事件才会被分组。你还指定事务中首个事件与最后一个事件之间的最长时间不能超过一分钟。我们这样做是因为如果不加以限制，某些事务可能会因被移除以腾出空间而不被计入。通过指定一个相对较大的时间，可以确保所有事务都被包含在计数中。\n\
  \n正如你在第 6 章中所看到的，`transaction` 命令会生成两个字段：`duration` 和 `eventcount`。该搜索的结果是 0.6 秒，因此从此刻起，你可以指定事务的最长时间为\
  \ 1 秒，以提高效率。接下来，你将找出哪些事务是不完整的，即购买失败。获取此信息的一种搜索方式是：\n\n```\nindex=c7\n| transaction\
  \ transactionID maxspan=1s\n| search NOT *submitPurchaseComplete\n```\n\n这个搜索相当有意思，因为我们使用了两次\
  \ `search` 命令。第一次用于从 `c7` 索引中提取所有事件。然后再次使用它来查找由 `transaction` 命令创建的新事件，这些事件不包含与正则表达式\
  \ `*submitPurchaseComplete` 匹配的字符串。请注意，第一行没有包含单词“search”，因为第一个命令总默认为搜索。第二次使用该命令时必须明确写出\
  \ `search`。值得指出的是，此搜索的结果将包含任何耗时超过 1 秒的事务，而我们知道这些事务并不存在。对于样本数据，此搜索的结果产生了四个事务，如图 7-9\
  \ 所示。这回答了关于购买失败的问题，并具体指出了哪些事务失败了。\n\n![9781430257615_Fig07-09.jpg](img/9781430257615_Fig07-09.jpg)\n\
  \n图 7-9. 不完整的事务\n\n现在你可以找出平均事务时间，这有助于回答清单中的几个问题。我们首先了解购买耗时情况。为了在用于呈现结果的柱状图中获得良好的分辨率，我们选择计算一周内每小时的平均事务持续时间，任何更长时间段都会导致图表难以辨认。请记得为此搜索更改时间范围。\n\
  \n```\nindex=c7\n| transaction transactionID maxspan=1s\n| timechart avg(duration)\
  \ span=1h\n```\n\n\n\n搜索结果可在图 7-10 中查看，该图呈现了一个最小 *y* 轴值为 0.3 的柱状图。我们这样做是为了让图表具有更好的分辨率。当我们将鼠标悬停在某个柱子上时，Splunk\
  \ 会显示该特定柱子的详细信息。由此我们可以推断，交易时间较长的情况发生在每天下午 4:00 到晚上 7:00 之间。\n\n![9781430257615_Fig07-10.jpg](img/9781430257615_Fig07-10.jpg)\n\
  \n图 7-10：每小时平均交易时间\n\n要查明底层系统是否正在变慢，或者购买时间是否比上个月更长，您可以执行一个类似于之前的搜索，但这次是按天计算平均值。因此，我们将`timechart`命令的`span`参数更改为`span=1d`。这将更好地反映较长时间跨度内的任何问题，并且我们使用折线图，可以清晰地显示任何可能存在的趋势。在将时间范围调整为包含时间选择器中所有\
  \ 5 周的数据后，结果可在图 7-11 中查看。\n\n![9781430257615_Fig07-11.jpg](img/9781430257615_Fig07-11.jpg)\n\
  \n图 7-11：每日平均交易时间\n\n如图 7-11 所示，除了数据第一天出现的偏差外，交易时间在整个样本数据覆盖的时期内看起来相当稳定。如果底层系统存在任何问题，它们会通过折线上随时间推移呈现的上升趋势而显现出来。很可能，整个样本期间的交易数量是相同的。您可以通过创建显示所有产品每日购买量的图表来验证这一点，并部分回答清单中的第一个问题。使用以下搜索，结果以堆积柱状图的形式呈现，可在图\
  \ 7-12 中查看。从图中可以看出，产品的销售量随时间变化非常稳定，这很可能就是交易时间没有出现任何退化的原因。\n\n![9781430257615_Fig07-12.jpg](img/9781430257615_Fig07-12.jpg)\n\
  \n图 7-12：按产品划分的每日销售量\n\n```\nindex=c7\n| transaction transactionID maxspan=1s\n\
  | timechart count by productId span=1day\n```\n\n图 7-11 中观察到的每日平均时间的偏差，可以通过查看图 7-12\
  \ 中数据第一天（2011 年 8 月 28 日，星期日）的销售数量来解释。由于那天的销售数量非常少，交易时间平均比其他日子短了 0.1 秒。\n\n诚然，这是一个简单的例子，但它清楚地说明了从日志文件中进行高级分析是多么容易，而无需处理数据模式或编写特殊代码将数据插入数据仓库或数据库。\n\
  \n### 日志记录最佳实践\n\n为了充分利用 Splunk 中的语义日志记录，我们提供一些提示或最佳实践。第一条，其中包含几个要点，是创建人类可读的日志：具体来说，就是使用纯文本记录。虽然二进制日志记录听起来更好，因为它经过了压缩，但它需要解码，并且不便于分段处理。您还应该让日志易于人类理解，因此不要在日志条目中对某些元素使用需要查找表才能解码的复杂编码。\n\
  \n另一个建议是使用日志条目的类别。大多数日志系统，如 Log4J，都提供了一组预定义的类别，可以满足大多数需求；请使用它们，因为这将更容易控制记录的数据量。最后，正如您将在本书的社交媒体部分看到的那样，Splunk\
  \ 使得使用 JSON 或 XML 变得非常容易，但除非您确实需要多层嵌套，否则请不要使用它们。\n\n时间戳是另一个需要考虑的项目，并且可能最为重要。不要使用时间偏移量，因为这在进行比较和处理时区时，会不必要地导致各种问题。请使用人类可读的标准时间戳，并尽量将其放在行首。这不仅适用于日志文件，正如您将在本书第二部分和第三部分中看到的那样，也适用于几乎所有包含日期和/或时间的数据。底线：为每个事件明确添加时间戳。\n\
  \n使用清晰的键值对。这看起来可能会因为重复大量信息而占用更多空间，但请记住，Splunk 以压缩格式存储原始数据，而键值对具有非常高的压缩率。以下示例是大多数开发者创建日志条目时非常传统的写法：\n\
  \n```\nlog.debug(\"Error 1454 - %s %d\\n\", userID, transID)\n```\n\n这种习惯性日志记录方式的问题在于，搜索单词`Error`过于宽泛。虽然\
  \ Splunk 会非常快速地找到它，但随后理解伴随信息所需的操作可能会相当复杂。通常，这种日志条目需要正则表达式来解析，而键值对则可以使用单一的、一致的规则进行处理。以下是前述示例的推荐等效日志记录语句：\n\
  \n```\nlog.debug(\"orderstatus=error, errorcode=1454, user=%s, transactionid=%d\\\
  n\", userID, transID)\n```\n\n如果您无法创建键值对，但您有包含列名或键名的标题行，这对 Splunk 也同样有效。诸如`ps`和`vmstat`之类的\
  \ Unix 命令会产生有价值的信息，但列名仅作为标题行提供。Splunk 知道如何提取这些列名并将其用作对应值的键。这将在本书第二部分的项目中详细回顾。\n\n\
  一种流行的做法是将包含多个值的字段记录为单行，因为开发者认为这是最简单的方式。我们强烈建议将多值信息分解为日志文件中的单独条目。请看这个示例：\n\n```\n\
  Mar 10 2013 04:12:02 phonenumber=669-555-1212, app=angrybirds,facebook\n```\n\n\
  在 Splunk 中解析`app`值要比直接使用键值对困难得多。此外，向每个多值添加数据也存在限制。如果将每个多值分解为日志文件中的单独行，解析和处理附加数据就会容易得多。从开发者的角度来看，这个建议不应增加日志记录语句或语句集的复杂性。如果按如下方式记录，前面的示例会好得多：\n\
  \n```\nMar 10 2013 04:12:02 phonenumber=669-555-1212, app=angrybirds, installdate=Jan-02-2012\n\
  Mar 10 2013 04:12:02 phonenumber=669-555-1212, app=facebook, installdate=Jun-29-2012\n\
  ```\n\n另一个最佳实践是在每次机会出现时记录唯一标识符。这样，您就能有效地跨越系统中不同组件的多个日志文件，并允许您详细追踪事务。您可以使用 Splunk\
  \ 的`transaction`命令来关联不同的日志条目，并将它们转换为单个事务。这也被称为传递闭包，因此，如果您有一些如下例所示的日志条目，您将能够将它们全部链接起来：\n\
  \n\n\n`transID=135889976`\n`transID=135889976, otherUniqueID=qwas543`\n`otherUniqueID=qwas543`\n\
  \n您当下正在记录的信息可能会暴露超出预期的大量信息。重构代码以利用这一新范式的努力起初看似艰巨，但请循序渐进、自然发展。在多数情况下，只需修改现有日志语句，使其遵循已介绍的最佳实践即可。带着这一新范式开发未来的应用程序，您会发现其投资回报将是无价的。\n\
  \n在运维方面，请记得使用日志文件轮转策略，即销毁或备份日志。您可能更倾向于销毁日志，因为所有信息现在都已索引到 Splunk 中。我们还建议您在生成日志文件的服务器本地进行日志记录。更多细节可在第\
  \ 15 章中了解，该章节回顾了 Splunk 转发器的使用。\n\n总而言之，记录明显需要的内容，即任何能为分析增加价值的信息，尤其是在聚合和可视化之后，因此请记录比调试事件更多的内容。\n\
  \n## 总结\n\n在本章中，您了解了一种新范式：从日志文件中获取高级分析，而非使用数据仓库的传统方法。我们通过一个示例说明了这有多么简单，并回顾了语义日志记录的最佳实践。\n\
  \n"
- "# 第 8 章\n\n![image](img/frontdot.jpg)\n\n## 航班准点率项目\n\n本章介绍一个项目，旨在让您习惯于在机器数据之外的场景中使用\
  \ Splunk，包括使用 CSV 文件以及与关系数据库交互。我们将讨论一个用于该项目的初步方法论，并解释接下来三章要完成的工作。\n\n航班准点率项目基于公开可用的数据，这些数据记录了美利坚合众国（包括波多黎各及太平洋领地和属地）的所有国内航班。该数据集特别适合用于解释如何将\
  \ Splunk 作为分析工具，原因如下：\n\n-   数据量足够小，无需大型硬件配置即可处理。实际上，如果愿意，在普通笔记本电脑上也能完成。\n-   我们几乎所有人都乘坐过商业航班，因此对数据来源领域有一定经验；也就是说，无需特殊培训就能理解我们将要处理的大部分数据。\n\
  -   数据基于真实数据，这使得我们构建的搜索的结果更具趣味性。虽然我们详细描述了各种搜索来解释多个 Splunk 命令，但仍留下了许多引人入胜的问题供您探索。\n\
  -   数据来源不同于本书迄今为止使用的传统机器数据。我们将介绍如何通过 CSV 文件和从关系数据库导入数据。\n\n我们称这些数据为航班数据，它包含每一个已排班航段的记录或事件。有时航空公司会将同一航班号分配给经停多个机场的航班，每个经停点被视为一个航段。因此，航班数据中的每个事件仅指两个机场之间的航班，有时称为城市对，代表一个出发地和一个目的地。请注意，航班数据基于排班航班，而非实际执飞航班。如果航班被取消、改航或延误，事件将在相应字段中反映出来。例如，如果您统计\
  \ 2001 年 9 月 11 日的航班数量，结果将显示约 17,000 个排班航班。如我们所知，其中大部分航班已被取消，并且有一个字段反映了这一点。\n\n\
  每个事件包含 109 个字段。并非所有字段都有数据，要么是因为缺乏可用信息，要么是该字段是原始版本发布后某个时间点新增的。任何数据分析类项目的重要部分都是探索字段，以深入理解其所含信息。航班数据非常适合这一点，因为有些字段包含相似但略有差异的信息。理解字段内容并选择正确的字段至关重要，因为根据所选字段的不同，结果的质量或预期会发生变化。\n\
  \n拥有如此多字段，包含美国每个航班的各类信息，有许多有趣且引人入胜的问题可以通过 Splunk 搜索来解答，这些问题从非常简单到非常复杂。您会经常发现，最大的复杂性不在于搜索本身，而在于如何构建搜索。我们在某些搜索中展示了这一点。\n\
  \n我们使用的航班数据包含超过 1.47 亿个事件，时间跨度从 1987 年 10 月到 2012 年 9 月。如此丰富的数据也为我们提供了绝佳的背景，来展示优化搜索和报告的各种方法。尽管有数千万个事件，但数据大小相当可控，约为\
  \ 65GB，并且由于航班数据由提供商按月分发，您可以只下载所需时间段的数据。\n\n该项目还允许我们介绍一套非正式的步骤，用于处理像这样的典型数据分析项目。这些步骤更多是基于常识；因此，我们暂且还不敢称之为方法论。每次我们处理新项目时，都会对其进行进一步完善，而且仍有很大的改进空间。从高层次来看，我们遵循以下步骤：\n\
  \n-   获取数据。这相当明显，但有些问题曾给我们带来不少麻烦。因此我们想强调获取数据的重要性，尤其是数据源的可靠性。这可以从三个方面来衡量：\n    -\
  \   **数据的准确性。** 不用说，数据质量决定了搜索结果的质量。我们发现并非所有数据源都像我们希望的那样准确。微小的错误可以接受，但持续不可靠的信息则不可取。即使在本例使用的航班数据中，我们在快速检查时也发现，美国航空的大量机尾号或飞机注册号是无效的，这可以追溯到\
  \ 1999 年 4 月。这并未直接影响我们，所以我们决定忽略它。但这正说明了为什么您需要仔细验证所处理数据的准确性，尤其是对您的业务关键的数据。\n    -\
  \   **服务器的可靠性。** 我们发现许多公共数据提供商的服务器基础设施并非最佳，下载数据变成了一个充满多次崩溃的痛苦过程，需要多次尝试才能下载单个数据单元。\n\
  \    -   **数据的规律性。** 并非所有公共数据提供商都能以一致的方式提供数据，因此本应定期更新的数据充其量也只是断断续续的。由于数据收集和准备导致的滞后可以理解，但要注意不规律的更新，因为它们会影响您的业务流程。\n\
  \n\n\n*   **加载数据**。这似乎是另一个显而易见的步骤，但初次操作时可能颇具挑战，尤其是在处理包含时间戳的数据元素时。当然，您始终可以选择忽略时间戳，但这将限制\
  \ Splunk 的强大功能。\n*   **验证已加载的数据**。如果想当然地认为您加载的数据已在 Splunk 中正确建立索引，很快就会遇到麻烦。仅在第一次执行此操作，之后就默认一切正常，这种做法无异于自找麻烦。\n\
  *   **逐步构建搜索**。Splunk 搜索语言是独一无二的。虽然拥有 SQL 经验会极大地帮助您构建搜索，但我们强烈建议您逐步构建搜索，并验证获得的中间结果是否符合预期。请使用小规模数据集进行此操作。在构建搜索时，要么限制时间范围，要么使用\
  \ `head` 或 `tail` 命令来限制您使用的事件数量，以便于验证结果。\n*   **验证结果**。使用备用搜索命令或外部工具（如数据库或电子表格）来验证您的搜索结果。结果在您的业务流程中越重要，您就越需要对其感到确信并进行认证。\n\
  \n按照这套相当初级的方案，我们将项目分解为三个章节，这些章节将引导您完成一个典型分析项目的全过程，这也帮助我们为您介绍一些最常用的 Splunk 功能和命令，以及一些不那么流行但非常实用的功能和命令。该方案也用于本书的社交媒体章节中。\n\
  \n第 9 章 侧重于获取数据。它在必要的层面上探索数据及其字段，以确保您拥有将所有数据成功索引到 Splunk 所需的一切。特别是，它详细讨论了与时间戳相关的问题。航班数据中，有用时间戳的组成部分分散在两个不同的字段中，且这两个字段并不相邻。本章介绍并使用了两种不同的策略来处理这个问题。本章还详细介绍了如何从\
  \ CSV 文件以及直接从关系型数据库加载数据。总而言之，本章重点介绍了成功加载数据并验证其正确加载的步骤。\n\n第 10 章 除了是项目中有趣的部分外，更是其核心所在。我们在本章详细介绍了对数据集的*实际分析*。首先探索感兴趣的字段并理解其内容。以分析机场流量、航班、延误及延误原因为契机，我们制定了一系列有趣的搜索，并介绍了一组\
  \ Splunk 命令。这些命令包括：\n\n*   `join`，允许您进行 SQL 风格的连接，但存在一些限制。\n*   `delete`，作为删除包含不准确信息的事件的一种选项。\n\
  *   **宏**，它们是参数化的搜索片段，可以重复使用，并在需要时接受参数。\n*   **报告加速**。大多数报告是处理所有相关事件的摘要，往往开销很大。我们解释了如何加速这类报告。\n\
  *   **加速统计**。利用 Splunk 的 TSIDX 功能以及相关的 `tscollect` 和 `tstats` 命令来显著加速搜索。这里的“显著”意味着从数小时缩短到数秒。\n\
  *   此外，我们还深入探讨了一些已知命令的新属性，例如：\n    *   `timechart` 命令的 `limit` 属性，以及\n    *   搜索命令的\
  \ `earliest` 和 `latest` 属性\n\n我们还讨论了如何将本章中创建的各种搜索获得的结果进行可视化。虽然这不是一本专门讨论可视化的书，但它是任何分析项目的重要组成部分，可能是仅次于结果准确性的最重要部分。因此，在我们创建和使用的整个搜索过程中，我们都会讨论\
  \ Splunk 中可用的可视化选项。\n\n在 第 11 章 中，我们详细介绍了查找表。与关系型数据库一样，我们在 Splunk 中也可以使用查找表，这些表可以基于\
  \ CSV 文件或关系型数据库。我们首先基于一个 CSV 文件创建一个查找表，然后对其进行自动化处理，使查找透明化，这是 Splunk 一个非常方便的功能。我们还基于搜索结果创建了一个新的查找表，表明您不仅可以使用外部查找表，还可以生成它们。需要查询特定航班号多年来所使用的飞机型号，这迫使我们处理来自另一个来源——美国联邦航空管理局\
  \ (FAA) 的另一组文件，并创建一个执行双重查找的搜索。在这个例子中，我们使用了存在于关系型数据库中的查找表。最后，我们大胆走出 Splunk 的领域，尝试将此搜索结果可视化。\n\
  \n在第 10 章 和第 11 章 中，我们大量使用了前面章节解释过的命令，例如 `stats`、`dedup`、`chart`、`timechart`、`top`、`eval`、`sort`、`fields`\
  \ 和 `head`。事实是，Splunk 让处理分析变得非常容易，您基本上只需要掌握基础的搜索命令即可。\n\n## 本章小结\n\n在本章中，我们回顾了一个典型分析项目的基础知识，并提出了在执行此类项目时应遵循的一套步骤：一种方法论。我们描述了项目的分解方式，并解释了在接下来的三个章节中各自要完成的工作。\n\
  \n"
- '# 第 9 章


  ![image](img/frontdot.jpg)


  ## 将航班数据加载到 Splunk 中


  本章详细讨论了航空公司准点率项目所使用的数据。它介绍了两种将结构化数据加载到 Splunk 的方法：使用逗号分隔值（CSV）文件以及直接从关系型数据库加载。本章还涵盖了基于分布在多个列上的数据来处理复杂时间戳的各种方法。


  ### 使用 CSV 文件


  CSV 文件可能是从关系型数据库或其他系统与应用程序导入和导出数据最流行、最简单的方法。在本节中，我们将使用一个包含美国所有计划内商业国内航班信息的公共数据集。该数据集将成为本书第二部分示例的基础。


  ### 航班数据


  美国运输统计局有一个专门介绍 TranStats 的网站，TranStats 是一个多式联运运输数据库。该数据库包含定期更新的航空、海运、公路、铁路及其他运输方式的信息。如前所述，我们将仅关注航空公司准点率数据，该数据以一个简单的表格形式提供，包含发生在美国境内所有计划内的直飞航班的起飞和到达数据。这些数据由在美国国内定期客运收入中占比至少百分之一的持证承运人按月报告。航班数据及其描述可在以下网址获取：


  `http://www.transtats.bts.gov/DL_SelectFields.asp?Table_ID=236&DB_Short_Name=On-Time`


  或者，首先访问 `www.transtats.bts.gov`。然后点击在左侧边栏“数据查找器”下，“按模式”分类中的“航空”链接。此选择如图 9-1 所示。


