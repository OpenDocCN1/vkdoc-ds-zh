  \ as user\n        first(total_run_time) as total_run_time\n        first(saved_name)\
  \ as saved_search_name\n        first(search) as search\n        first(is_scheduled)\
  \ as is_scheduled by search_id\n| search user=*\n| sort - total_run_time\n```\n\n\
