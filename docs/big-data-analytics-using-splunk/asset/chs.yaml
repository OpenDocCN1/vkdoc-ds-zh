  ## 转发器


  在实际场景中，企业拥有大量应用程序，其中大多数运行在异构基础设施上，包括各种硬件、数据库、中间件和应用程序。我们无法让 Splunk 在每一个应用程序或基础设施附近本地运行，这意味着数据对
  Splunk 而言并非本地的。我们在本章中看到的是如何将 Splunk 本地的数据导入其中。这些用例假设 Splunk 能够访问本地或挂载了远程数据的文件系统中的文件或目录，但这些目录均已挂载到运行
  Splunk 的机器上。


  为了解决将远程数据导入 Splunk 的用例，我们将介绍 Splunk 转发器。Splunk 转发器与标准 Splunk 实例相同，但仅包含将数据转发到接收器（可以是主
  Splunk 实例或索引器）所需的核心组件。转发器的主要任务是收集 Splunk 的远程数据，并将其转发到将加载这些远程数据的主 Splunk 实例或索引器。Splunk
  通用转发器是一个可从 `splunk.com` 下载的组件，可以配置用于转发所需数据。技术插件（如 Windows TA）可以与通用转发器配合使用，将 Windows
  源数据发送到在 Unix 环境下运行的 Splunk 实例。使用 Splunk 转发器是处理远程数据的推荐部署方式或最佳实践。转发器提供了许多优势，包括：


  -   它们会在远程位置自动缓冲数据，这在主 Splunk 实例因任何原因宕机时非常有用。

  -   它们支持利用技术插件来收集远程可用的不同数据源。

  -   它们可以远程管理。

  -   它们支持安全地发送远程数据，并具备压缩和数据确认功能。

  -   它们提供负载均衡支持，更适合扩展性和性能需求。


  它们可以与远程位置上任何可用的网络端口协同工作，以收集这些端口的数据。我们将在第 14 章和第 15 章中详细讨论 Splunk 部署，这两章将涉及分布式拓扑和高可用性。


  ## 总结


  在本章中，我们了解了可以将数据加载到 Splunk 中的不同类型的数据源。我们详细讨论了如何使用“文件和目录”选项获取数据，以及如何利用 Splunk 的监控功能获取
  `MyGizmoStore.com` 的访问日志。我们还简要介绍了如何配置 Windows 和 *Nix 等技术插件来从 Windows 和 Linux 机器收集数据。最后，您了解了
  Splunk 转发器以及它们如何帮助获取 Splunk 的远程数据。


