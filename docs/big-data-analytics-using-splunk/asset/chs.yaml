  ## 构建查询：美联航 871 航班分析\n\n现在我们已经建立并运行了查找表，可以开始构建搜索来回答查询问题。探索的第一步是了解美联航 871 航班在时间线上的数量变化。这个搜索非常简单，输出结果如图\
