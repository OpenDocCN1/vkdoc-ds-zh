- "# 附录 B\n\n![image](img/frontdot.jpg)\n\n## 有用的 Splunk 应用\n\n本章概述了一些有用的 Splunk 应用和插件，它们属于监控、安全、数据库、应用、应用服务器和网络等类别。\n\
  \n## Splunk 应用\n\n在本书的前面章节中，我们探索并使用了一些 Splunk 应用和插件，例如 Splunk App for Windows、*Nix、Google\
  \ Maps、Globe、Web Intelligence、Sentimental Analysis、Splunk DB Connect、Splunk Deployment\
  \ Monitor 等。在深入本章之前，让我们快速回顾一下 Splunk 应用。\n\nSplunk 被设计为一个平台，充当第三方开发者或独立软件供应商可以构建为\
  \ Splunk 提供扩展的专用应用程序的基础架构。有两种构建这些扩展的方式：应用和 Technology Add-On。Splunk 应用将扩展功能与标准特性（如已保存搜索、仪表板和已定义的输入）捆绑在一起。此外，它们还在\
  \ Splunk 用户界面之上捆绑了自己的用户界面。相比之下，Add-On（或简称为 TA）与应用相比是较小的组件，它们包含附加功能，但没有自己的用户界面。我们将必须使用标准的\
  \ Splunk 搜索应用程序来查询通过 Add-On 配置的索引数据。任何拥有相当编程知识的人都可以编写应用和 Add-On。Splunk 拥有一个充满活力的社区，不断创建和分享应用和\
  \ Add-On。它托管在 `http://splunk-base.splunk.com/apps/`。\n\n在撰写本书时，Splunkbase 上至少有几百个\
  \ Splunk 应用和 Add-On。我们将一些流行且有趣的应用大致分类为监控、网络、安全、数据库、应用和应用服务器。本章的目的是让你熟悉 Splunkbase，并提供一个你可以利用到\
  \ Splunk 部署中的热门应用和 Add-On 的简短列表。由于这些应用和 Add-On 经常更新，我们建议你参考 Splunkbase 中的具体应用页面以查找最新信息。本章为每个应用或\
  \ Add-On 提供的详细信息仅是基本的，旨在让你快速了解该应用的功能、它捕获的数据来源以及它提供的报告或仪表板。本章不深入介绍列出的应用或 Add-On 的安装、部署、配置和使用细节。你可以利用在前面章节中使用过的应用和\
