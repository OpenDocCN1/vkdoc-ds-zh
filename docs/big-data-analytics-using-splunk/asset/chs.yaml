  \   更改购物车中商品的数量（Changequantity）\n\n在左侧栏中，您现在可以看到`action`字段已列在选定的字段列表中。单击该字段的小条形图图标。图\
  \ 3-6 显示了包含`action`字段方法列表的弹出窗口；这些方法与我们的列表相匹配。我们可以看到`view`方法具有最高的事件数。当您学习如何使用 SPL\
  \ 处理事件时，您将对此进行分析。\n\n![9781430257615_Fig03-06.jpg](img/9781430257615_Fig03-06.jpg)\n\
  \n图 3-6. 操作方法列表\n\n我们刚刚对样本数据执行的基本检查和验证帮助我们确认获得了正确的数据；现在我们可以继续详细处理和分析数据集。Splunk 搜索应用程序提供了一个非常有用的时间选择器，它帮助我们根据时间放大到数据子集，这对于熟悉和验证数据非常有用。我们将使用我们之前使用过的相同查询，即：\n\
  \n```\nsourcetype=access_combined_wcookie\n```\n\n结果如图 3-7 所示。图形化的时间线在一个月的时间范围内以条形图显示事件，在这种情况下，时间范围介于\
  \ 2012 年 12 月 28 日和 2013 年 1 月 27 日之间。右上角的时间选择器显示我们使用的选项是“所有时间”，在我们的案例中，这映射到我们生成的\
  \ 30 天样本数据。您还将看到字段`sourcetype`在每个列出的事件中被突出显示。\n\n![9781430257615_Fig03-07.jpg](img/9781430257615_Fig03-07.jpg)\n\
  \n图 3-7. 带有时间选择器的 Splunk 搜索应用\n\n在实际使用场景中，您可能正在处理跨越数月或数年的数据集；或者您可能在非常短的时间内拥有数百万个事件。在任何情况下，您都需要深入到特定的时间窗口并找出正在发生的事情。这就是\
  \ Splunk 时间选择器派上用场的地方。单击时间选择器会向我们显示可以使用的不同时间线，如图 3-8 所示。列出的选项允许我们在短时间间隔（例如分钟、小时、天）或自定义时间段（可使用“自定义时间...”选项指定）内查看事件。\n\
  \n![9781430257615_Fig03-08.jpg](img/9781430257615_Fig03-08.jpg)\n\n图 3-8. Splunk\
  \ 时间选择器\n\n在时间选择器中选择“最近 7 天”选项，查看时间线栏如何更新。在图 3-9 中，我们可以看到 2013 年 1 月 21 日至 2013\
  \ 年 1 月 28 日之间的事件分布，您将看到 1,923 个事件。\n\n![9781430257615_Fig03-09.jpg](img/9781430257615_Fig03-09.jpg)\n\
  \n图 3-9. 最近七天的时时间线条形图\n\nSplunk 提供了时间范围命令，我们可以在搜索栏中使用它们来控制处理事件的时间段行为。您将在第 5 章和第\
  \ 11 章中了解这些时间范围命令。\n\n为了处理和分析实际用例，我们需要了解的不仅仅是在左侧栏和时间线中看到的字段的事件数。这就是 SPL 的用武之地。它提供了简单而强大的方法来分析加载到\
  \ Splunk 中的数据。在本章的后续部分，您将学习并探索以下类别中的不同 SPL 命令：\n\n*   报告\n*   排序\n*   过滤\n*   添加和评估字段\n\
  *   分组\n\n## 报告\n\n报告对每个 IT 组织以及企业的业务领导者来说都至关重要。他们每天使用报告来获取关于 IT 系统当前状态的信息，或者业务在销售、制造、运输等方面的运作情况。通常，报告汇总信息以呈现易于目标受众理解的摘要。我们将从`top`命令开始探索\
  \ Splunk 中的报告命令。此命令非常方便，用于回答在拥有网站或 Web 应用程序的 IT 组织中最常问的以下类型问题：\n\n*   哪些是最常用的浏览器？\n\
  *   我的前五个 IP 地址是哪些？\n*   哪些是最常引荐的网站？\n\n`top`命令可以与 Splunk 事件中可用的一个或多个字段一起使用。它对给定的数据集进行操作，查找最常出现的字段值，并返回命令后指定的字段的计数和百分比。默认情况下，`top`命令返回前十个结果，但您可以使用`limit`选项控制返回的数量。可能并非每次搜索都需要`top`命令返回的所有列。Splunk\
  \ 允许您使用`fields`命令从搜索结果中消除某些字段。需要消除的列必须在前面加上`-`指定。\n\n### 哪些是最常用的浏览器？\n\n在表 3-1 中，我们展示了组合访问日志中可用的不同字段。其中一个字段是用户代理，它包含客户端浏览器报告的有关自身的信息。像`MyGizmoStore.com`这样的在线零售商店想知道客户用来查看产品或进行购买的最常用用户代理（浏览器）是哪些。了解正在使用的浏览器将有助于`MyGizmoStore.com`优化在线商店页面，并确保在用户访问网站时最流行的浏览器上正确渲染页面。`top`命令使我们能够非常容易地获取这些信息。在开始使用`top`之前，请确保您已在时间选择器中选择了“所有时间”选项。`useragent`字段包含浏览器信息。Splunk\
  \ 在索引时自动将表 3-1 中的字段映射到其自己的字段名称，这使得我们很容易找到所需的信息或字段。在搜索栏中输入以下内容：\n\n```\nsourcetype=access_combined_wcookie\n\
  | top useragent\n```\n\n\n\n当第一条命令是搜索时，你无需手动输入，因为系统默认它就是搜索。上述搜索的第一个子句等同于：`search\
  \ sourcetype=access_combined_wcookie`。搜索中的管道符（`|`）的作用是将每个 Splunk 命令的结果作为输入传递给下一个命令。有时，它也会将前一个搜索评估结果中的特定数据子集传递给下一组评估。在此搜索中，你将基于\
  \ `sourcetype` 字段获取事件子集，并仅将这些事件通过管道传递给 `top` 命令，以找出最热门的浏览器。如图 3-10 所示，该搜索找到了 6,254\
  \ 个匹配事件，并找出了最热门的浏览器及其计数和百分比。可以看出，Mac OS 上的 Mozilla 5.0 是最热门的浏览器，而 Windows 上的同一浏览器紧随其后。\n\
  \n![9781430257615_Fig03-10.jpg](img/9781430257615_Fig03-10.jpg)\n\n图 3-10. 最热门浏览器\n\
  \n![image](img/sq.jpg) **注意** 用 SQL 的术语来说，你可以将这种情况类比为在 MySQL 中使用 `TOP` 关键字搭配 `select`\
  \ 语句，或在 Oracle 中使用 `rownum` 搭配 `where` 子句。这两种情况都会产生相同的结果集。\n\nSplunk 允许我们保存搜索结果，这样我们就不必每次都重新输入搜索查询来查看结果。如图\
  \ 3-11 所示，点击 Splunk 搜索应用程序右上角的“保存”（Save）链接。在下拉列表中，你将看到三个不同的选项：\n\n*   `保存结果`（`Save\
  \ results`）选项——允许我们保存当前搜索的结果\n*   `保存搜索`（`Save search`）选项——用于保存搜索，之后可以通过 Splunk\
  \ 搜索应用程序菜单中的“搜索和报告”（Searches & Reports）链接重新获取该搜索\n*   `保存并分享结果`（`Save & share results`）选项——允许我们保存搜索查询，并与其他已分配了适当安全角色以访问搜索的\
  \ Splunk 用户分享结果。Splunk 的这一特性使其成为一个协作环境，其中一位或多位高级用户可以创建从简单到复杂的搜索，然后与一组业务用户共享。\n\n\
  ![9781430257615_Fig03-11.jpg](img/9781430257615_Fig03-11.jpg)\n\n图 3-11. 保存搜索\n\n\
  当你点击“保存搜索”（Save search）选项时，会弹出如图图 3-12 所示的对话框。此对话框提供了将搜索设为“私有”或与其他 Splunk 用户共享的选项。你还可以看到一个加速搜索的选项，该选项有助于优化搜索，以便历史事件集已被预先汇总，从而加快搜索处理速度。你将在第\
  \ 10 章中了解更多关于搜索和报告加速的内容。在本示例中，我们将选择“以只读方式分享给当前应用的所有用户”选项的单选按钮，然后点击“完成”（Finish）按钮。\n\
  \n![9781430257615_Fig03-12.jpg](img/9781430257615_Fig03-12.jpg)\n\n图 3-12. 保存搜索选项\n\
  \n成功保存搜索后，Splunk 会提供一个唯一的 URL，类似于 `http://<hostname>:<port#>/en-US/app/search/%40go?s=Top%20browsers`。此\
  \ URL 可以分享给其他用户，他们随后即可直接访问保存了该搜索的服务器。如前所述，已保存的搜索可以通过 Splunk 搜索应用主菜单中的“搜索和报告”（Searches\
  \ & Reports）链接轻松访问。点击该链接将显示可访问的报告列表。图 3-13 显示了我们刚刚保存的报告。\n\n![9781430257615_Fig03-13.jpg](img/9781430257615_Fig03-13.jpg)\n\
  \n图 3-13. 保存的报告\n\n已保存的搜索也可以通过“管理”（Manager）菜单访问，方法是点击“知识”（Knowledge）部分下的“搜索和报告”（Searches\
  \ and reports）链接。这将显示搜索和报告的详细列表，如图 3-14 所示。通过这种替代方法访问报告的主要区别在于，你将获得每个报告的更多操作选项，例如“删除”（Delete）、“移动”（Move）和“禁用”（Disable）。这些可用操作显示在表格的右侧，具体取决于分配给用户的安全角色。你还可以通过点击单个搜索并指定告警选项，为已保存的搜索设置告警。我们将在第\
  \ 5 章中探索 Splunk 告警功能。\n\n![9781430257615_Fig03-14.jpg](img/9781430257615_Fig03-14.jpg)\n\
  \n图 3-14. 运行已保存的搜索\n\n### 排名前五的 IP 地址\n\n我们将使用 `top` 命令来查找向 `MyGizmoStore.com` 发出请求的排名前五的\
  \ IP 地址。在此搜索中，我们还将对 `top` 命令使用 `limit` 选项，以便仅获取报告中前五个值。在左侧边栏中，我们可以看到 `clientip`\
  \ 是其中一个字段；该字段保存了各个客户端请求来源的 IP 地址：\n\n```\nsourcetype=access_combined_wcookie\n|\
  \ top limit=5 clientip\n```\n\nSplunk 处理了 8,688 个事件，并报告了访问 `MyGizmoStore.com` 的排名前五的\
  \ IP 地址（这就是 `limit` 选项的用武之地），如图 3-15 所示。在第 4 章中，你将看到如何使用 Splunk 技术插件或应用程序，通过查找这些\
  \ IP 地址的地理位置或域名，来更好地理解它们。\n\n![9781430257615_Fig03-15.jpg](img/9781430257615_Fig03-15.jpg)\n\
  \n图 3-15. 基于 IP 地址的排名前五用户\n\n### 哪些是排名靠前的引荐网站？\n\n如今，用户大多通过点击第三方网站或搜索引擎（如 Google、Yahoo、Bing\
  \ 等）来访问网站。在某些情况下，用户会看到他们正在浏览的网站上弹出的在线广告，并点击这些广告进入某个网站并采取行动。对于像 `MyGizmoStore.com`\
  \ 这样的在线零售商店来说，弄清楚用户来自何处、哪些关键词真正有效、以及将在线广告费用投放在哪里，是很有意义的。\n\n对于我们的 `MyGizmoStore.com`，我们想要找出除了\
  \ `MyGizmoStore.com` 自身之外，哪些是排名靠前的引荐网站。我们将使用以下搜索，在该搜索中，我们将查找引荐来源值中不包含 MyGizmo 的事件。我们通过使用\
  \ `!=`（意为“不等于”）来实现这一点。管道符将第一个子句的结果传递给 `top` 命令，以生成一份关于引荐至 `MyGizmoStore.com` 的网站报告，最后从结果集中移除百分比字段：\n\
  \n```\nsourcetype=access_combined_wcookie referer != *MyGizmo*\n| top referer\n\
  | fields - percent\n```\n\n注意，搜索的第一个子句隐含了 `sourcetype` 和 `referer` 之间的 AND（与）关系。默认情况下，搜索命令假定为\
  \ AND（与），因此该子句等同于：\n\n```\nsourcetype=access_combined_wcookie\nAND referer != *MyGizmo*\n\
  ```\n\n图 3-16 显示有 2,256 个事件符合搜索条件，其中 Bing、Yahoo 和 Google 显示为除 `MyGizmoStore.com`\
  \ 自身之外排名前三的引荐网站。你还会注意到，结果中的百分比列已被移除。\n\n![9781430257615_Fig03-16.jpg](img/9781430257615_Fig03-16.jpg)\n\
  \n图 3-16. 引荐至 [MyGizmoStore.com](http://MyGizmoStore.com) 的网站\n\n\n\n虽然获取不同热门活动或项目集的报告很有用，但你也需要了解哪些事物不起作用。这时我们可以利用报告命令\
  \ `rare`。此命令的功能与 `top` 命令完全相反。我们只需将之前所有搜索中的 `top` 替换为 `rare`，就能找出哪些浏览器不常见，或哪些我们预期能提供更多点击量的来源（referrers）并未达到预期，等等。\n\
  \n接下来我们要探讨的另一个报告命令是 `stats` 命令。此命令是主力工具，因为它用于对给定的数据集计算聚合统计信息。`Stats` 命令自带多个函数，例如\
  \ `count`、`average`、`min`、`median`、`mode`、`sum` 等，每个函数都从多个事件中提取数值，并依据特定标准对它们进行分组，从而提供单一值或关于一组事件的更有意义的数据。这与\
  \ SQL 聚合非常相似。\n\n像 `MyGizmoStore.com` 这样的在线网站，可能因各种原因无法处理来自客户端的请求，而 Apache 和 IIS\
  \ 等网络服务器会返回属于 4xx 和 5xx 类的 HTTP 状态码。表 3-2 提供了一些常见 4xx 和 5xx 状态码的描述。\n\n表 3-2. HTTP\
  \ 状态码 4xx 和 5xx 的描述\n\n| HTTP 状态码 | 描述 |\n| --- | --- |\n| 400 | 错误请求 (Bad Request)—由于语法错误，服务器无法理解客户端发送的请求\
  \ |\n| 401 | 未授权 (Unauthorized)—客户端发送的请求需要用户身份验证 |\n| 403 | 禁止 (Forbidden)—服务器理解客户端发送的请求，但拒绝或拒绝处理该请求。例如，大多数网站阻止用户浏览站点的目录结构\
  \ |\n| 404 | 未找到 (Not Found)—服务器上找不到客户端请求的特定资源，例如网页或图片 |\n| 405 | 方法不允许 (Method\
  \ Not Allowed)—客户端发送的请求使用了不允许的方法 |\n| 407 | 需要代理认证 (Proxy Authentication Required)—这与\
  \ 401 状态码非常相似，但意味着客户端发送的请求必须首先在代理服务器上进行身份验证 |\n| 408 | 请求超时 (Request Timeout)—服务器在等待客户端生成请求时超时\
  \ |\n| 500 | 内部服务器错误 (Internal Server Error)—服务器遇到某种情况，使其无法完成请求 |\n| 501 | 未实现 (Not\
  \ Implemented)—服务器当前不支持请求的功能 |\n| 502 | 错误网关 (Bad Gateway)—服务器在向内部服务器发送请求以完成传入请求时，收到了无效响应\
  \ |\n| 503 | 服务不可用 (Service Unavailable)—服务器过载，无法处理传入请求 |\n| 504 | 网关超时 (Gateway\
  \ Timeout)—服务器在等待来自其他服务器（如 LDAP 服务器）的响应以进一步处理请求时超时 |\n| 505 | HTTP 版本不受支持 (HTTP\
  \ Version Not Supported)—服务器不支持客户端请求中使用的 HTTP 协议版本 |\n\n为了探索 `stats` 命令，我们来看几个典型的、像\
  \ `MyGizmoStore.com` 这样的在线零售商店的使用案例：\n\n*   查找所有因客户端请求失败而产生像 404 这样的 HTTP 状态码的事件，并根据不同的主机或网络服务器统计其数量\n\
  *   查找所有包含购买行为的事件，以及这些事件中涉及的产品数量\n\n网站需要跟踪诸如 404 之类的状态码，这意味着请求的资源未找到或不可用。这个资源可以是\
  \ HTML 页面、图片或类似项目。跟踪特定的状态码或状态码类别（例如 4xx 消息）有助于网站维护人员修复网站，并确保用户能找到他们想要的内容。我们将逐步处理这两个用例，首先找到包含\
  \ 404 状态的事件。\n\n### 有多少事件具有 HTTP 404 状态？\n\n`status` 字段包含针对每个来自客户端的请求所返回的 HTTP 状态码信息。Splunk\
  \ 提供了一种简单的方法，可以使用相关的字段和值将条件作为搜索标准添加到查询中。要查找所有包含 404 状态码的事件，我们将使用以下搜索：\n\n```\nsourcetype=\"\
  access_combined_wcookie\" status=404\n```\n\n图 3-17 显示了上述搜索的结果。您可以看到总共有 696 个事件具有\
  \ 404 状态，并且每个满足搜索条件的事件都有一个 404 状态码。\n\n![9781430257615_Fig03-17.jpg](img/9781430257615_Fig03-17.jpg)\n\
  \n图 3-17. 具有 HTTP 状态 404 的事件\n\n我们将使用刚刚构建的搜索，并将结果通过管道（`|`）传递给一个使用 `count` 函数的 `stats`\
  \ 命令。`count` 函数将聚合每个主机的计数。在搜索栏中输入以下内容：\n\n```\nsourcetype=access_combined_wcookie\
  \ status=404\n| stats count by host\n```\n\n图 3-18 显示了 696 个事件具有 404 状态码，以及它们如何在\
  \ BigDBook-www1、BigDBook-www2 和 BigDBook-www3 这三台主机之间分布的情况。\n\n![9781430257615_Fig03-18.jpg](img/9781430257615_Fig03-18.jpg)\n\
  \n图 3-18. 每个主机的 HTTP 状态 404 事件\n\n第二个用例涉及将 `stats` 命令与 `MyGizmoStore.com` 上可用的产品结合使用。一个非常有用的报告是展示哪些产品是最畅销的。比起找出所有用户查看过的产品，了解哪些产品参与了购买流程或实际被购买会更有趣。这意味着我们想知道该产品在购买流程中出现的次数。`stats`\
  \ 命令将帮助我们使用 `count` 函数来统计产品数量。首先找到属于购买请求的事件，然后使用之前添加到选定字段列表中的 `action` 字段。\n\n###\
  \ 有多少事件具有购买行为？\n\n使用以下搜索，其中 `action` 字段的值指定为 `purchase`：\n\n```\nsourcetype=access_combined_wcookie\
  \ action=purchase\n```\n\n如图 3-19 所示，有 767 个事件匹配该条件，并且每个事件都将 URL 行为显示为 purchase。\n\
  \n![9781430257615_Fig03-19.jpg](img/9781430257615_Fig03-19.jpg)\n\n图 3-19. 具有购买行为的事件\n\
  \n现在我们得到了包含购买行为的事件，下一步是进行统计聚合，找出这些事件中涉及的每个产品的计数。\n\n### 参与购买的产品列表\n\n我们将使用刚刚使用的查询，并将结果通过管道（`|`）传递给一个带有\
  \ `count` 函数的 `stats` 命令。`count` 函数将聚合每个 `productId` 的计数。在搜索栏中输入以下内容：\n\n```\nsourcetype=access_combined_wcookie\
  \ action=purchase\n| stats count by productId\n```\n\n\n\n图 3-20 展示了如何使用相同的 767\
  \ 个事件进行统计分析，并在表格中列出了`productid`及对应的`count`。第 2 章中生成的样本数据仅包含产品标识符，但缺少与每个产品标识符对应的实际描述。在第\
  \ 10 章中，你将了解如何利用 Splunk 中的`lookup`命令关联不同来源的数据，例如从数据库或 CSV 文件中获取产品描述或价格信息，并将其关联起来，使报告更加贴近业务需求，也更易于理解。\n\
  \n![9781430257615_Fig03-20.jpg](img/9781430257615_Fig03-20.jpg)\n\n图 3-20. 参与购买行为的商品计数\n\
  \n`stats`命令包含一个名为`distinct_count`（或`dc`）的函数，用于计算特定字段的唯一值数量。`sum`函数可用于计算某一列的总和。例如，我们可以基于之前构建的搜索（查找不包含`MyGizmoStore.com`的主要引荐来源）进行扩展，以查找来自除`MyStoreGizmo.com`以外来源的总引荐数。更新后的搜索如下：\n\
  \n```\nsourcetype=access_combined_wcookie   referer != *MyGizmo*\n | top referer\n\
  \ | fields – percent\n | stats sum(count)\n```\n\n我们可以将此查询中的`sum`函数替换为`avg`函数，以计算每个非`MyGizmoStore.com`来源的平均引荐数。对应的搜索如下：\n\
  \n```\nsourcetype=access_combined_wcookie   referer != *MyGizmo*\n| top referer\n\
  | fields – percent\n| stats avg(count)\n```\n\n你可能希望在报告中展示所有产品标识符及其各自的计数总数，但同时还需要一个总数列来显示售出产品的总数。这时就可以使用`addcoltotals`命令，它对所有汇总值求和，并创建一个包含该字段总计值的新事件。对应的搜索如下：\n\
  \n```\nsourcetype=access_combined_wcookie  action=purchase\n| stats count by productId\n\
  | addcoltotals labelfield=Total label=AllProducts\n```\n\n如图 3-21 所示，之前报告中的所有信息都得以保留，但现在你可以汇总报告中的所有产品。此外，`addcolTotals`命令允许你创建一个新事件，该事件将汇总信息保存在名为`Total`的事件中，并标记为`AllProducts`。由于结果超过\
  \ 13 条，我们可以通过页面滚动选项（如图 3-21 右侧高亮所示）将每页记录数调整为 20，从而使 Splunk 搜索应用程序每页显示 20 条记录。\n\n\
  ![9781430257615_Fig03-21.jpg](img/9781430257615_Fig03-21.jpg)\n\n图 3-21. 所有产品的总计\n\
  \n到目前为止，我们已经学习了 SPL 报告命令`top`、`rare`和`stats`，并探讨了使用这些命令可以解决的典型报告用例。其他 SPL 报告命令包括`chart`和`timechart`。我们将在第\
  \ 4 章开始进行数据可视化时对其进行探讨。\n\n### 排序\n\n报告的一个重要需求是能够对结果进行排序，这有助于我们理解报告中的信息。`Sort`是排序类别中的主要\
  \ SPL 命令。如图 3-21 所示，经过计数的产品数量结果并未按任何特定顺序排列，这使得我们难以了解产品数量的高低分布。`sort`命令根据命令后面指定的字段列表对结果事件进行排序。通过字段前的\
  \ (`+`) 或 (`-`) 符号来控制升序和降序。我们将使用与前一个示例相同的查询，并将结果通过管道符传递给`sort`命令，以获得降序排列的结果，从而了解哪些是最受欢迎的产品：\n\
  \n```\nsourcetype=access_combined_wcookie  action=purchase\n| stats count by productId\n\
  | sort –count\n```\n\n图 3-22 显示了按降序排列的产品。你将看到`productid`为 OR-DEN-33 的产品最受欢迎，计数为\
  \ 49。\n\n![9781430257615_Fig03-22.jpg](img/9781430257615_Fig03-22.jpg)\n\n图 3-22.\
  \ 按降序排列的产品\n\n## 过滤\n\nSPL 命令的第三类是过滤命令。过滤命令接收通过管道符传入的一组事件或结果，并将其过滤成更小的结果集。过滤有助于加速分析，也帮助你聚焦于可以收集更多洞察的特定结果。\n\
  \n如果你希望限制需要处理和分析的事件数量，Splunk 提供了`head`命令，允许你仅处理事件的子集。以查找前 100 个符合条件事件中的热门产品为例。为此，沿用之前查找产品计数并排序的搜索查询；现在我们将使用`head`命令来找出最近\
  \ 100 个符合条件事件中最受欢迎的产品。\n\n在以下搜索中，将满足购买行为条件的事件通过管道符传递，使用`head`命令获取前 100 个事件，然后使用`count`函数聚合结果集以对最终结果进行排序：\n\
  \n```\nsourcetype=access_combined_wcookie  action=purchase\n| head 100\n| stats\
  \ count by productId\n| sort –count\n```\n\n图 3-23 显示了基于前 100 个符合购买条件事件的流行产品。你可以看到产品\
  \ OR-DEN-33 是最受欢迎的产品。\n\n![9781430257615_Fig03-23.jpg](img/9781430257615_Fig03-23.jpg)\n\
  \n图 3-23. 前 100 个事件中最受欢迎的产品\n\nSplunk 还提供了`tail`命令，它获取最后`n`个事件并进行进一步分析。我们可以修改上一个搜索查询，将`head`命令替换为`tail`，如下所示：\n\
  \n```\nsourcetype=access_combined_wcookie  action=purchase\n| tail 100\n| stats\
  \ count by productId\n| sort –count\n```\n\n图 3-24 显示了使用最后 100 个事件（而非前 100 个事件）更新后的结果。最受欢迎的产品变成了\
  \ PA-DEL-44，而不是 OR-DEN-33。虽然数据集较小，但这些技术可用于分析前`n`个或后`n`个事件，并识别新的趋势或模式，以判断哪些产品可能变得更受欢迎，以及是否存在特定原因，例如季节变化或节假日影响。\n\
  \n![9781430257615_Fig03-24.jpg](img/9781430257615_Fig03-24.jpg)\n\n图 3-24. 基于最后\
  \ 100 个事件的最受欢迎产品\n\n\n\n#### 另外两个有用的过滤命令是 `dedup` 和 `where`\n\n`Dedup` 命令用于去除冗余数据，意思是该命令针对指定字段值的每种组合，仅保留第一条结果，并丢弃其余结果。我们将在第\
  \ 10 章中广泛使用 `dedup` 命令。\n\n### 添加和评估字段\n\n下一类命令用于过滤、修改和添加字段。我们将介绍最强大的命令之一：`eval`。`eval`\
  \ 命令可用于计算表达式并将值存储在新字段中。`Eval` 可以处理任意表达式，包括数学运算、字符串运算和布尔运算。正如我们在 `stats` 命令中所见，`eval`\
  \ 提供了几个函数。这些标准函数包括 `case`、`if`，若干数学函数（如 `abs`、`ceiling`、`floor`、`log`、`round` 等），以及字符串函数（包括\
  \ `rtrim`、`split`、`substr`、`tostring` 等）。\n\n我们将通过一个有趣的真实案例来探索 `eval` 命令：识别那些只浏览橱窗的客户与那些实际购买了商品的客户。这个案例既适用于实体零售店，也适用于在线零售店。由于\
  \ `MyGizmoStore.com` 是一家在线零售店，会有一些客户浏览网站、查看产品，但并不进行任何购买。找出只看页面不购买的用户与实际购买用户的比率将十分有趣。\n\
  \n你可以使用 `eval` 命令来查找最终状态码为 200 的 HTTP 状态码的基本分布情况——这表示请求已成功——并观察该数量与我们示例 `MyGizmoStore.com`\
  \ 数据中其余 HTTP 状态码总数的对比。这虽然无法提供关于用户购买比率的详细信息，但能让我们在更广泛的层面（所有事件的成功与失败）上开始分析。\n\n`Splunk`\
  \ 还允许你使用通配符 `*` 来表示所有内容。通常，你会访问不同类型的日志文件，并且很可能需要对它们全部进行处理和分析。为此，请修改搜索条件，将 `sourcetype`\
  \ 设为等于 `access_*`；这将选取所有以 `access_` 开头的数据源。使用 `eval` 命令来评估一个条件，判断单个事件的状态码是否为 200：如果是，则将其归入\
  \ `OK` 类别，其他所有事件则归入 `FAILED` 类别。这些值随后被存储到一个名为 `SuccessRatio` 的字段中并进行聚合。结果如图 3-25\
  \ 所示。你可以看到，搜索处理了我们一开始使用的示例 `MyGizmoStore.com` 数据中的所有 8,688 个事件，并且显示 `FAILED` 类别中的事件数量多于\
  \ `OK` 类别。\n\n```\nsourcetype=access_*\n| eval SuccessRatio = if (status==200, \"\
  OK\", \"FAILED\")\n| stats count by SuccessRatio\n```\n\n![9781430257615_Fig03-25.jpg](img/9781430257615_Fig03-25.jpg)\n\
  \n图 3-25. 状态码 200 的数量与其他状态码数量的对比\n\n既然你已经对 `eval` 命令有了初步了解，让我们来计算页面浏览量与实际购买量的比率。为此，请使用包含\
  \ `GET` 方法的事件，将这些事件通过管道传递给 `stats` 命令以获取实际的页面浏览次数。然后，在另一个计数中使用 `eval` 命令，检查事件中是否含有等于\
  \ `purchase` 的动作。你还需要使用 `stats` 命令的 `AS` 参数来重命名结果字段为 `Page_Views` 和 `Actual_Purchases`。在搜索栏中输入以下内容：\n\
  \n```\nsourcetype=access_*   method=GET\n| stats count AS Page_Views,\ncount(eval(action=\"\
  purchase\")) AS Actual_Purchases\n```\n\n图 3-26 显示的结果表明，共处理了 6,176 个带有 `GET` 方法的事件，产生了\
  \ 6,176 次页面浏览，其中只有 144 次是实际购买行为。\n\n\n```markdown\n\n![9781430257615_Fig03-26.jpg](img/9781430257615_Fig03-26.jpg)\n\
  \n图 3-26. 页面浏览量与实际购买次数\n\nSplunk 的 `eval` 命令也可用于计算数值之间的百分比差异。扩展您刚刚完成的搜索，将结果通过管道传递给另一个\
  \ `eval` 命令，该命令用于计算实际购买次数相对于页面浏览量的百分比。这个百分比将存储在一个名为 `PCTofPurchases` 的字段中。\n\n```\n\
  sourcetype=access_* method=GET\n| stats count AS Page_Views,\n          count(eval(action=\"\
  purchase\")) AS Actual_Purchases\n| eval PCTofPurchases =((Actual_Purchases*100)/Page_Views)\n\
  ```\n\n此类用于过滤、修改和添加字段的其他命令包括 `lookup`、`rex`、`replace` 和 `fields`。我们将在第 11 章中大量使用\
  \ `lookup` 命令，届时您将处理航空公司准点性能项目。\n\n### 分组\n\n最后一类命令是结果分组。分组的目的是识别已分组数据中的模式。`Transaction`\
  \ 是 SPL 命令，它允许将事件分组为一个事务。如果满足随命令一起定义的定义约束，则事件被分组在一起。`transaction` 命令中指定的约束标识了事务的开始和结束。这与传统数据库领域中的事务界定非常相似。\n\
  \n我们可以利用 `transaction` 命令进一步分析“只看不买”与“实际购买”的用例。在许多情况下，有些用户会将商品或产品添加到购物车但从不购买，或者有些用户会花相当多的时间浏览、将商品添加到购物车，但从不完成交易。\n\
  \n在我们的示例中，我们将着眼于对与特定会话 ID（`JSESSIONID`）相关且来自同一 IP 地址（`clientip`）的事件进行分组，其中第一个事件包含字符串\
  \ `addtocart`，最后一个事件包含字符串 `purchase`。在我们开始搜索之前，让我们看看如果采用如图 图 3-27 所示的一小组样本事件，结果会是什么样子。矩形中高亮显示的区域表明，您获得了相同的\
  \ IP 地址和会话 ID，并且在相关事件中也包含了 `addtocart` 和 `purchase` 操作。Splunk 会发现这些事件之间的关系并将它们分组为事务。在样本集中，我们得到了两个事务，涉及\
  \ IP 地址 `237.15.107.90` 和 `60.66.3.96`。如果来自客户端的请求中存在 cookie 值，您也可以使用这些值对事务进行分组。\n\
  \n![9781430257615_Fig03-27.jpg](img/9781430257615_Fig03-27.jpg)\n\n图 3-27. 事务分组\n\
  \n现在在搜索栏中输入以下内容，看看 Splunk 如何将事件分组为事务：\n\n```\nsourcetype=access_combined_wcookie\n\
  | transaction JSESSIONID clientip startswith=\"addtocart\" endswith=\"purchase\"\
  \n```\n\n如图 图 3-28 所示，有 609 个事件匹配您创建的分组模型，您可以看到每个分组事件都包含 `addtocart` 和 `purchase`\
  \ 作为操作，并且具有相同的 IP 地址和会话 ID。\n\n![9781430257615_Fig03-28.jpg](img/9781430257615_Fig03-28.jpg)\n\
  \n图 3-28. 包含 `addtocart` 和 `purchase` 的事件分组\n\n`transaction` 命令的另一个用例是对来自同一 `clientip`\
  \ 且具有 `purchase` 操作的事件进行分组，其中每个会话不超过 10 分钟且包含的事件不超过三个。这类组合和事件分组可用于识别那些完成购买花费时间最短或进行长时间事务的用户。在以下搜索中，我们使用了\
  \ `maxspan` 和 `maxevents` 属性以及 `clientip` 字段来对事件进行分组：\n\n```\nsourcetype=access_combined_wcookie\
  \   action=purchase\n| transaction clientip maxspan=10m maxevents=3\n```\n\n图 3-29\
  \ 显示有 519 个事件匹配了该分组，您可以看到所有这些事件都具有 `purchase` 操作。\n\n![9781430257615_Fig03-29.jpg](img/9781430257615_Fig03-29.jpg)\n\
  \n图 3-29. 10 分钟跨度内的事务\n\n我们将通过分析最后一个非常有用的用例来结束本章，该用例在分析组合的访问日志数据时非常有用，并且它也有助于我们练习本章中介绍的一些命令和概念。这个用例与我们的在线应用程序中因失败事务而损失了多少业务量有关。就\
  \ `MyGizmoStore.com` 而言，这意味着由于应用程序或服务器错误，用户未能完成购买流程。\n\n我们可以利用 HTTP 状态码来分析我们的样本数据集。在表\
  \ 3-2 中，列出了 4xx 和 5xx 类别的 HTTP 状态码。范围在 5xx 的 HTTP 状态码与服务器错误相关。任何 5xx 错误都意味着服务器端出了问题。一些常见的例子包括状态码\
  \ 500（表示通用内部服务器错误），以及状态码 503（表示服务器无法处理请求）。从运维角度看，5xx 错误码意味着服务器存在问题，可能需要立即关注。对于像\
  \ `MyGizmoStore.com` 这样的在线零售商店，5xx 状态意味着网站无法执行客户交易，因此该在线零售商店可能因客户无法完成交易而损失了业务。这可能导致客户转向竞争对手的商店，或者至少导致客户支持电话升级。\n\
  \n查看样本数据中的 5xx 状态码，或者状态码大于等于 500 的事件数量。使用 `status` 字段并应用条件 `status >= 500`：\n\n\
  ```\nsourcetype=access_combined_wcookie   status >= 500\n```\n\n图 3-30 显示总共有 1557\
  \ 个事件的状态码大于等于 500。\n\n![9781430257615_Fig03-30.jpg](img/9781430257615_Fig03-30.jpg)\n\
  \n图 3-30. 状态码大于等于 500 的事件\n\n您可以使用 Splunk 统计命令 `stats` 来精确查找不同 5xx 状态码下事件的分布情况。将之前筛选出的事件通过管道传递给\
  \ `stats` 命令，并使用 `count` 函数来统计不同的状态码。图 3-31 显示了 1554 个事件在不同 5xx 状态码之间的分布情况。在本例中，我们只有状态码\
  \ 500 和 503。\n\n您也可以使用 `sort` 命令按升序或降序对状态计数进行排序：\n\n```\nsourcetype=access_combined_wcookie\
  \    status >= 500\n| stats count by status\n```\n\n![9781430257615_Fig03-31.jpg](img/9781430257615_Fig03-31.jpg)\n\
  \n图 3-31. 500 范围状态码的事件分布\n\n既然我们已经确定 `MyGizmoStore.com` 服务器存在问题，我们需要找出哪些状态码大于等于\
  \ 500 的事件同时也参与了具有 `purchase` 操作的事件。如果存在任何符合该条件的事件，则意味着 `MyGizmoStore.com` 的业务受到了损失。我们将采用之前的搜索，并添加一个额外的字段条件\
  \ `action=purchase`，以找出符合条件的事件数量：\n\n```\nsourcetype=access_combined_wcookie  status\
  \ >= 500  action=purchase\n```\n\n```\n\n\n### 排版后的内容\n\n图 3-32 显示了有 175 个事件符合我们的购买行为条件。\n\
  \n![9781430257615_Fig03-32.jpg](img/9781430257615_Fig03-32.jpg)\n\n图 3-32. 状态码为\
  \ 500 且包含购买行为的事件\n\n我们可以进一步分析这 175 个事件，查看失败交易中产品的分布情况。`Splunk` 提供了 `rename` 命令，允许你更改或别名化列名，使其对业务更友好，因为日志可能包含含义模糊的字段名。\n\
  \n执行之前的搜索，并通过管道将其输出到 `stats` 命令，以按产品聚合结果。结果集将按降序排列。最后，将计数字段重命名为 `\"Product Units\
  \ In Failed Transactions\"`：\n\n```\nsourcetype=access_combined_wcookie   status\
  \ >= 500  action=purchase\n| stats count by productId\n| sort –count\n| rename count\
  \ as \"Product Units In Failed Transactions\"\n```\n\n图 3-33 显示相同的 175 个事件已被聚合，并且产品计数字段已相应重命名。\n\
  \n![9781430257615_Fig03-33.jpg](img/9781430257615_Fig03-33.jpg)\n\n图 3-33. 失败交易中的产品数量\n\
  \n**总结**\n\n在本章中，我们检查了组合访问日志的格式，以了解日志条目中哪些类型的信息可供处理和分析。你学习了一些基本命令，例如 `top`、`rare`、`stats`、`sort`、`addcoltotals`、`eval`、`rename`、`head`、`tail`\
  \ 和 `transaction`，这些命令帮助你报告、排序、过滤和分组事件，以找到企业通常需要回答的问题的答案。你还了解了如何使用时间选择器和字段来验证数据并处理较小数据子集。\n\
  \n## 第 4 章\n\n![image](img/frontdot.jpg)\n\n"
- "# 可视化结果\n\n在本章中，我们将重点讨论使用报表和仪表盘进行数据可视化。你将学习默认的 `Splunk` 仪表盘以及有助于绘制数据图表的新 `SPL`\
  \ 命令，并了解如何使用 `Splunk` 报表构建器创建报表。我们还将介绍用于数据可视化的 `Splunk` 应用程序，熟悉它们提供的默认仪表盘，并着手创建有助于可视化多个报表的自定义仪表盘。\n\
  \n## 数据可视化\n\n现代企业正在寻求将日志、网络、点击流和社交媒体等新型数据作为其主流数据分析的输入，以做出更好的业务决策。这意味着企业现在必须处理大数据处理和分析。除此之外，随着企业的扩张和收集多个数据源，它们正面临着巨大的数据增长。传统上，这些数据以电子表格或表格报表的形式交付，使得从中找到必要的模式、趋势和关联以采取行动变得非常困难。不仅如此，传统的电子表格或类似工具已不足以处理和分析企业希望整体审视的多个数据源的数据。\n\
  \n这就是数据可视化发挥作用的地方。可视化有助于清晰、精确地传达复杂的想法或数据模式。它通过在一个相对较小的图表中呈现许多数字，帮助观察者关注数据的实质，使用户能够比盯着成页的原始数字更快、更轻松地比较不同的数据片段。可视化最重要的好处之一是，它允许以其他方式无法实现的方式访问海量数据。最后，也许也是最重要的一点是，可视化使我们能够获得可操作的洞察。考虑在线商店（例如\
  \ `MyGizmoStore.com`）定价随时间变化的情况。通过可视化，我们可以快速了解客户是否购买了更多商品，或者他们的购买模式是否发生了改变等等。没有这种洞察，我们实际上就迷失了方向，做出正确决策的可能性会大大降低。无论你是来自\
  \ IT 部门还是业务部门，可视化都能让你快速检查大量数据，高效地揭示趋势和问题，与关键参与者交流想法，并最终影响那些将引领成功的决策。\n\n你在 第 2 章\
  \ 和 第 3 章 中看到了 `Splunk` 如何与多个数据源协同工作并使用 `SPL` 处理数据。下一个问题是：`Splunk` 是否提供任何工具来可视化数据，并使分析大数据以识别关联、趋势、异常值、模式和业务状况变得容易？是的，当然有！在本章中，你将学习如何在\
  \ `Splunk` 中可视化数据。\n\n### Splunk 如何处理可视化\n\n`Splunk` 提供了多种方式来构建报表和仪表盘，以可视化索引到其中的数据的搜索结果。在基本层面上，你可以将所有数据可视化为时间线条形图中的一组事件。在\
  \ 第 3 章 中，你学习了如何使用时间选择器来验证数据；它还可以为我们提供跨事件的快速视觉线索，显示活动的高峰和低谷。以 `MyGizmoStore.com`\
  \ 的样本数据为例，时间选择器让我们可以可视化任何明显的模式，这些模式可以向下钻取以获得更多细节。让我们通过在搜索栏中输入 `sourcetype=access_*`\
  \ 来快速搜索。图 4-1 显示了 `MyGizmoStore.com` 数据上的活动；我们可以看到，除了少数几个地方有一些小峰值和下降之外，活动基本上是恒定的。对于真实世界的数据，你很可能看到一个非常不同的图表，在时间线的不同位置会出现巨大的峰值。\n\
  \n![9781430257615_Fig04-01.jpg](img/9781430257615_Fig04-01.jpg)\n\n图 4-1. 使用时间线可视化数据\n\
  \n尽管 `Splunk` 的时间选择器很有用，但大多数有趣的细节来自对不同字段进行的统计分析。我们在 第 3 章 中执行的搜索以表格格式为我们提供了数据。例如，我们进行的其中一个搜索帮助我们找到了\
  \ `MyGizmoStore.com` 的顶级浏览器。如果我们将相同的搜索输入到搜索栏中，它会给出如 图 4-2 所示的表格报表。\n\n`sourcetype=access_*|\
  \ top useragent`\n\n![9781430257615_Fig04-02.jpg](img/9781430257615_Fig04-02.jpg)\n\
  \n图 4-2. `MyGizmoStore.com` 的顶级浏览器（表格格式）\n\n\n\nSplunk 提供了一种非常简便的方式来可视化表格数据。您只需点击\
  \ 图 4-2 中高亮显示的柱状图图标。Splunk 会将显示顶级浏览器的表格报表转换为可视化图表，如 图 4-3 所示。您现在可以直观地查看数据，而无需阅读原始数字。我们可以看到\
  \ `Mozilla 5.0` 是最受欢迎的浏览器，紧随其后的是 `Mozilla 4.0`。该图表还显示前两个浏览器与后续四个浏览器组之间的数值非常接近。\n\
  \n![9781430257615_Fig04-03.jpg](img/9781430257615_Fig04-03.jpg)\n\n图 4-3. MyGizmoStore.com\
  \ 的顶级浏览器（柱状图格式）\n\nSplunk 提供了不同的图表类型来可视化数据；我们将在本章后面部分进行探讨。您可以点击“格式选项”链接对图表进行格式化。在此处，您可以选择最能帮助可视化底层数据的图表类型。并非所有图表类型都适用于所有数据。要使\
  \ Splunk 图表能够可视化数据，数据必须采用结构化格式。根据您表格数据的数据结构类型，Splunk 会智能地仅启用那些适用的图表类型，并将其他选项置灰，如图\
  \ 4-4 所示。我们将为此报表选择条形图，然后继续将图表标题更改为“顶级浏览器”，X 轴标题设为“浏览器”，Y 轴标题设为“浏览器计数”。\n\n![9781430257615_Fig04-04.jpg](img/9781430257615_Fig04-04.jpg)\n\
  \n图 4-4. 格式化图表\n\n更新后的图表将如图 4-5 所示。让我们点击“保存”并将此搜索保存为“顶级浏览器”。\n\n![9781430257615_Fig04-05.jpg](img/9781430257615_Fig04-05.jpg)\n\
  \n图 4-5. 顶级浏览器\n\n到目前为止，我们所采用的方法是构建搜索并查看来自搜索结果的数据。正如您在第 3 章中所见，这种方法需要相当了解 SPL 命令才能构建搜索。以顶级浏览器搜索为例，我们必须熟悉\
  \ `top` 命令。Splunk 还提供了另一种使用报表生成器构建报表的方法。让我们用我们在第 3 章中构建的顶级 IP 地址搜索来探索报表生成器。使用报表生成器，您无需透彻理解\
  \ SPL 报表命令，例如 `stats`、`top`、`rare` 或我们将在本章中介绍的图表命令。您可以通过两个步骤使用报表生成器构建报表。\n\n-  \
  \ 定义报表\n-   格式化报表\n\n您可以通过选择“创建”下拉列表并点击“报表...”来访问报表生成器（参见图 4-6）。\n\n![9781430257615_Fig04-06.jpg](img/9781430257615_Fig04-06.jpg)\n\
  \n图 4-6. 报表生成器\n\n在“定义报表”步骤中，您可以像在时间选择器中那样选择时间范围；在我们的案例中，我们将保持默认设置，即“所有时间”。在“报表数据”部分，您必须选择要创建的报表类型。可用的三个选项是：\n\
  \n-   **值随时间变化**，用于可视化特定字段在选定时间段内的趋势。在内部，报表生成器将使用 `timechart` 命令，我们稍后将向您介绍该命令。\n\
  -   **热门值**，用于显示最常见字段值的报表，例如顶级浏览器、顶级 IP 地址等。报表生成器使用了您在第 3 章中学到的 `top` 命令。\n-   **稀有值**，用于显示最不常见或最少见值的报表。报表生成器使用了您在第\
  \ 3 章中学到的 `rare` 命令。\n\n对于顶级 IP 地址报表，我们将在报表类型中选择“热门值”选项。基于此选择，报表生成器将自动调整报表定义的其余选项。在我们的案例中，您会注意到用于报表显示的选项现在已被隐藏。下一个我们必须选择的选项是我们想要在其中查找常见或热门值的字段。因为我们希望找到顶级\
  \ IP 地址，我们将从“字段”下拉列表中选择 `clientip` 字段。“定义报表内容”页面将如图 4-7 所示。您会注意到报表生成器也提供了对它所构建的搜索命令的访问。默认情况下，搜索的编辑功能是禁用的，但对于熟悉\
  \ SPL 的用户，他们可以点击“使用搜索语言定义报表”链接并编辑查询。报表生成器还将 `top` 命令返回的值的默认值设为 1000，而不是您在第 3 章中看到的\
  \ 10。因为我们只需要前五个 IP 地址，我们将通过将 `limit=5` 来编辑搜索以仅返回五个。点击“下一步：格式化报表”按钮。\n\n![9781430257615_Fig04-07.jpg](img/9781430257615_Fig04-07.jpg)\n\
  \n图 4-7. 在报表生成器中创建报表定义\n\n对于前五个 IP 地址，报表生成器默认会显示柱状图。您会注意到在图表类型选项中，Splunk 启用了所有图表类型；但这并不意味着我们从报表获得的数据可以用所有类型的图表来可视化。例如，将图表类型更改为“径向仪表盘”并点击“应用”按钮，将显示如图\
  \ 4-8 所示的数据，您可以看到这意义不大。\n\n![9781430257615_Fig04-08.jpg](img/9781430257615_Fig04-08.jpg)\n\
  \n图 4-8. 以径向仪表盘显示的顶级 IP 地址\n\n我们强烈建议您尝试不同的选项，并考虑您展示这些报表的受众，以便选择合适的图表类型。在保存此搜索之前，让我们将图表标题更改为“前\
  \ 5 个 IP 地址”，X 轴标题设为“IP 地址”，Y 轴标题设为“计数”，将图表类型改回柱状图并点击“应用”按钮。报表应如图 4-9 所示。\n\n![9781430257615_Fig04-09.jpg](img/9781430257615_Fig04-09.jpg)\n\
  \n图 4-9. 以柱状图显示的顶级 IP 地址\n\n使用报表生成器与直接使用 SPL 命令之间的关键区别在于，您无需了解 SPL 命令。您也看到了，报表生成器通过在需要时允许您切换到搜索语言模式来提供灵活性。您可能仍然需要具备一些\
  \ SPL 知识才能对报表生成器生成的默认搜索进行修改，就像我们对 `top` 命令的 `limit` 选项所做的那样。将此报表保存为“前 5 个 IP 地址图表”。您可以随时使用“搜索和报表”菜单访问已保存的报表。\n\
  \n\n\n可以使用`stats`、`chart`和`timechart`命令对数据执行相同的统计计算。`stats`命令返回一个结果表格。`chart`命令返回相同的结果表格，但您可以使用报表生成器将此表格格式化为图表。如果您希望按时间范围绘制结果图表，则应使用`timechart`命令。现在您已经了解了\
  \ Splunk 提供的基本可视化形式，让我们探索两个强大的图表类 SPL 命令：\n\n*   `Chart`\n*   `Timechart`\n\n与第\
  \ 3 章中一样，我们将结合实际业务案例（与我们的在线零售商店`MyGizmoStore.com`相关）来探索这些命令。\n\n## `Chart`\n\n`Chart`命令可用于生成表格数据输出，该输出非常适合图表绘制或可视化目的。您必须使用`over`或`by`子句指定`x`轴变量或字段。它旨在与\
  \ Splunk 中`stats`报告命令的所有可用函数协同工作。您还可以将`eval`命令与`Chart`命令结合使用，使其成为获取可可视化聚合数据的强大命令。基于`chart`命令生成的数据结构，可以创建不同的图表类型。图表类型包括：\n\
  \n*   柱状图（Column）\n*   条形图（Bar）\n*   堆积柱状图（Stacked column）\n*   堆积条形图（Stacked Bar）\n\
  *   折线图（Line）\n*   面积图（Area）\n*   堆积折线图（Stacked line）\n*   堆积面积图（Stacked area）\n\
  *   饼图（Pie）\n*   散点图（Scatter）\n*   仪表盘——径向（Radial）、填充（Filler）和标记（Marker）\n\n我们将通过以下用例来了解其中一些图表类型及其与生成数据的工作方式：\n\
  \n*   绘制每个主机的`GET`和`POST`请求数量图表\n*   绘制每个产品类别的购买量与浏览量的图表\n*   哪些产品类别受到`404`错误的影响？\n\
  *   `MyGizmoStore.com`的购买趋势\n*   事务持续时间\n\n### 绘制每个主机的 GET 和 POST 请求数量图表\n\n所有发往`MyGizmoStore.com`的请求要么是`GET`类型，要么是`POST`类型。我们可以开始探索`chart`命令，以可视化发送至主机`BigDBBook-www1`、`BigDBBook-www2`和`BigDBBook-www3`的`GET`和`POST`请求数量。为此，我们将使用`eval`命令来判断方法是`GET`还是`POST`。确定后，使用`count`函数与`chart`命令来统计`GET`和`POST`的数量。我们将按主机分组，主机将成为图表的`x`轴字段。让我们在搜索栏中输入以下搜索：\n\
  \n```spl\nsourcetype=access_*\n| chart count(eval(method=\"GET\")) AS GET,\n  count(eval(method=\"\
  POST\")) AS POST\n  by host\n```\n\nSplunk 以表格格式显示结果，其中列出了每个主机的 `GET` 和 `POST` 数量。在表格格式报表中，您可以做的一件有趣事情是利用“叠加”（Overlay）功能，让\
  \ Splunk 在表格数据的各个值之间创建热图。热图通过使用不同颜色，帮助我们轻松可视化高值和低值。在图 4-10 中，我们可以看到开启了热图的表格报告；由于\
  \ `GET` 数量较大，我们可以看到高值单元格以红色显示。\n\n![9781430257615_Fig04-10.jpg](img/9781430257615_Fig04-10.jpg)\n\
  \n图 4-10. 带有热图的 GET 和 POST 请求表格格式\n\n要可视化图表中的表格数据，请点击条形图图标，该图标在图 4-10 中已高亮显示。默认情况下，Splunk\
  \ 会选择条形图；因为我们希望`x`轴按主机绘制，所以我们将图表类型从条形图更改为柱状图。您会发现，在比较我们拥有的数据量中的 `GET` 和 `POST` 时，柱状图效果更好。如前所述，您需要探索不同的图表选项，看看哪一个更适合生成的数据结构。让我们将图表标题更改为“GET-POST-Chart”，并将`y`轴标题更改为“Number\
  \ of Requests”。更新后的图表如图 4-11 所示。将图表保存为“GETPOSTRequestsChart”。\n\n![9781430257615_Fig04-11.jpg](img/9781430257615_Fig04-11.jpg)\n\
  \n图 4-11. 柱状图中的 Get 和 Post 请求\n\n#### 绘制每个产品类别的购买量与浏览量图表\n\n我们可以复用我们在第 3 章中的工作，在那里我们发现了\
  \ `MyGizmoStore.com` 用户的实际购买量与产品浏览量之间的对比。我们将使用 `chart` 命令，而不是 `stats` 命令。我们将为结果列赋予更有意义的名称。让我们在搜索栏中输入以下内容：\n\
  \n```spl\nsourcetype=access_* method=GET\n| chart count AS views,\n  count(eval(action=\"\
  purchase\")) AS purchases\n  by categoryId| rename views AS \"Views\",\n  purchases\
  \ AS \"Purchases\",\n  categoryId AS \"Category\"\n```\n\n图 4-12 显示了该搜索的默认图表。如您在此图表中所见，与浏览量相比，购买数量非常少，几乎可以忽略不计。我们在这里看到的是非常小和非常大的数值混合在一起。这时，您可以利用单位缩放设置，将其改为对数刻度而非线性刻度，以提高图表的清晰度。\n\
  \n![9781430257615_Fig04-12.jpg](img/9781430257615_Fig04-12.jpg)\n\n图 4-12. 产品类别的购买量与浏览量对比\n\
  \n让我们继续，点击`y`轴，将轴刻度的值改为对数。我们将图表标题重命名为“Purchases to Views chart”，并将图表保存为“PurchasestoViewsChart”。更新后的图表如图\
  \ 4-13 所示。同样，根据这些报告的受众不同，您对图表类型和缩放比例的选择也会有所不同。正如我们在这个特定示例中所看到的，图 4-12 和图 4-13 中的图表传达了不同的信息，而数据集是完全相同的。\n\
  \n![9781430257615_Fig04-13.jpg](img/9781430257615_Fig04-13.jpg)\n\n图 4-13. 使用对数刻度的产品类别购买量与浏览量对比\n\
  \n#### 哪些产品类别受到 HTTP 404 错误的影响？\n\n当 Web 服务器（如 Apache 或 Microsoft IIS）响应客户端请求时，如果请求的资源未找到或不可用，则会在客户端浏览器上显示\
  \ HTTP 404 错误消息。该资源可以是 HTML 页面、图片或类似内容。任何在线零售商店或网站都应跟踪所有 404 错误消息，以便修复网站并确保用户能找到他们想要的内容；否则，企业可能会因用户流失甚至转向竞争对手而蒙受损失。在第\
  \ 3 章中，我们使用 `stats` 命令来查找状态为 404 的事件数量。在本用例中，我们希望创建一个图表来查找每个产品类别的 404 错误数量。让我们在搜索栏中输入以下搜索：\n\
  \n```spl\nsourcetype=access_* status=404\n| chart count by categoryId\n```\n\n\n\
  \n你可以使用饼图来展示数据各组成部分与整个数据集之间的关系。由于产品类别中每个项目都只有一个值，我们可以创建一个饼图，来查看哪些类别具有最高的 404 错误数量。在图表类型中选择饼图，并将其命名为“404\
  \ 错误图表”。图 4-14 展示了生成的饼图。你会注意到，用于`x`轴和`y`轴格式选项的字段已被禁用，因为这显然是一个饼图。\n\n![9781430257615_Fig04-14.jpg](img/9781430257615_Fig04-14.jpg)\n\
  \n图 4-14. 404 错误饼图\n\nSplunk 为这些可视化图表提供的一项便捷功能是每个字段的下钻值，当你将鼠标悬停在饼图的特定部分时就会触发此功能。图\
  \ 4-15 向我们展示了`WHITE_WIDGETS`产品类别的计数和百分比。我们将此报告保存为“404 错误图表”。\n\n![9781430257615_Fig04-15.jpg](img/9781430257615_Fig04-15.jpg)\n\
  \n图 4-15. 饼图的下钻信息\n\n#### `MyGizmoStore.com` 的购买趋势\n\n我们想要可视化每个产品类别的购买趋势。趋势最好使用迷你图（sparklines）来呈现。迷你图能很好地展示一段时间内的进展，这种可视化方式广泛应用于医疗行业以及展示地震活动等模式。迷你图可以揭示隐藏的模式，例如\
  \ IT 或业务用户、医生或科学家可能正在寻找的大幅飙升或骤降。Splunk 提供了一个`sparkline`函数，可与`stats`或`chart`命令一起使用。在如下所示的搜索中，我们使用`eval`命令查找具有购买操作的请求。我们将统计符合该条件的事件数，并将其传递给`sparkline`函数，该函数与`chart`命令一起使用。我们还将列名改为“购买趋势”，并为每个产品类别进行计算。让我们输入以下搜索：\n\
  \n```\nsourcetype=access_*\n| chart sparkline(count(eval(action=\"purchase\")))\n\
    AS \"Purchases Trend\" by categoryId\n```\n\n按回车后，如果你看到一个空白图表，这意味着你处于图表模式。你可以点击小表格图标，这将带你进入表格报告，如图\
  \ 4-16 所示，其中为每个产品类别都显示了迷你图。\n\n![9781430257615_Fig04-16.jpg](img/9781430257615_Fig04-16.jpg)\n\
  \n图 4-16. 产品类别的购买趋势\n\n根据这些报告的受众，你对图表类型的选择会有所不同。有时迷你图可能并不最适合网络运营中心（NOC）的用户，但它们可能非常适合管理报告。折线图可能更适合\
  \ NOC 的用户，因为折线图的尺度比迷你图大得多。在此表格报告中，我们没有获得每个产品类别的总销售量。我们可以通过在搜索中添加一个额外的`count`函数并将其重命名为“总计”来实现这一点。我们还可以将`categoryId`字段重命名为“类别名称”，这对业务更友好。\n\
  \n```\nsourcetype=access_*\n| chart sparkline(count(eval(action=\"purchase\")))\n\
    AS \"Purchases Trend\"\n  count(eval(action=\"purchase\"))\n  AS Total\n  by categoryId\n\
  | rename categoryId AS \"Category Name\"\n```\n\n图 4-17 显示了包含迷你图和每个产品类别“总计”列的新表格报告。我们可以看到`RED_GADGETS`是最畅销的产品类别。我们将此报告保存为“购买趋势”。\n\
  \n![9781430257615_Fig04-17.jpg](img/9781430257615_Fig04-17.jpg)\n\n图 4-17. 包含每个类别总计的购买趋势\n\
  \n#### 交易持续时间\n\n在第 3 章中，你学习了如何将一组事件分组为一个交易。现在，我们将利用`transaction`命令创建一个图表，根据交易持续时间（以分钟为单位）显示交易数量。在此搜索中，我们查找所有具有购买操作的事件，并将具有相同\
  \ IP 地址的事件分组。交易发生在 10 分钟内。对于分组后的交易，我们使用`chart`命令根据持续时间进行计数。让我们输入以下搜索：\n\n```\nsourcetype=access_*\
  \ action=purchase\n| transaction clientip maxspan=10m\n| chart count by duration\
  \ span=log2\n```\n\n我们可以使用默认的柱状图，并将标题更改为“交易持续时间”。图 4-18 显示了生成的图表。我们可以看到，很大比例的交易发生在不到一分钟内，其次是持续时间为两到四分钟的交易，然后是一到两分钟的交易。让我们将此图表保存为“交易持续时间图表”。\n\
  \n![9781430257615_Fig04-18.jpg](img/9781430257615_Fig04-18.jpg)\n\n图 4-18. 交易持续时间\n\
  \n### 时间图\n\n`Timechart`命令与之前使用的`chart`命令类似，区别在于`timechart`创建一个图表，其中聚合值针对`x`轴上显示的时间。`x`轴上的时间可以使用`span`选项进行控制。\n\
  \n我们将使用`MyGizmoStore.com`的样本数据探索几个`timechart`命令的用例：\n\n*   按产品划分的热门购买\n*   页面浏览量和购买量\n\
  \n### 按产品划分的热门购买\n\n我们想了解针对`x`轴上的时间绘制的每种产品购买图表的样子。在搜索中，我们使用`count`函数来获取每个产品具有购买操作的事件数量，并使用`usenull`选项消除任何空值。图表（和时间线）的时间刻度是根据数据的上下文计算的。例如，如果你正在查看分钟级别的数据，刻度将自动设置为分钟。如果你正在查看小时级数据但数量很多，刻度可以是日级，依此类推，除非你使用`span`参数强制设置。让我们输入以下搜索：\n\
  \n```\nsourcetype=access_*\n| timechart count(eval(action=\"purchase\"))\n  by productId\n\
    usenull=f\n```\n\n正如你在图 4-19 中所见，图表显示了每个`x`轴时间变量的多条柱线，使得难以抓住数据的本质。正如我们之前看到的，Splunk\
  \ 有时会智能地将适用于给定数据结构的图表类型变灰。在这种情况下，图表类型唯一可用的其他选项是折线图和面积图。\n\n![9781430257615_Fig04-19.jpg](img/9781430257615_Fig04-19.jpg)\n\
  \n图 4-19. 按产品划分的热门购买\n\n我们不更改图表类型，而是保留柱状图，但采用堆叠模式选项并选择“堆叠”。这将更新图表，如图 4-20 所示。将图表重命名为“热门产品购买图表”，将`x`轴标题重命名为“时间线”，将`y`轴标题重命名为“计数”，然后将其全部保存为“热门产品购买图表”。你可以悬停在堆叠中的每个项目上，将显示该单个部分的计数和百分比。\n\
  \n![9781430257615_Fig04-20.jpg](img/9781430257615_Fig04-20.jpg)\n\n图 4-20. 堆叠模式下的产品购买\n\
  \n### 页面浏览量和购买量\n\n\n\n我们可以使用相同的用例，并利用`timechart`命令在`x`轴上按时间线显示数据。在以下搜索中，我们使用`eval`命令来判断事件是否包含\
  \ GET 方法或购买行为。我们在`timechart`中使用`per_hour`函数来将数据按时间线布局。`per_hour`是一个聚合函数，能很好地为数据提供一致的比例：\n\
  \n```\nsourcetype=access_*\n| timechart per_hour(eval(method=\"GET\"))\n  AS Views,\n\
  \  per_hour(eval(action=\"purchase\"))\n  AS Purchases\n```\n\n我们将此图表的类型更改为“面积图”。当你将面积图与默认的柱状图（通过在图表类型下拉框中切换值）进行比较时，你会注意到面积图对于我们这个用例所得的数据结构来说要清晰得多。我们将图表标题设为“购买与浏览面积图”，选择堆叠模式，并将图例位置切换到顶部。生成的可视化面积图如图\
  \ 4-21 所示。我们将此图表保存为“购买与浏览面积图”。\n\n![9781430257615_Fig04-21.jpg](img/9781430257615_Fig04-21.jpg)\n\
  \n图 4-21. 购买与浏览面积图\n\n到目前为止，你已经学习了如何使用`chart`和`timechart`命令，并熟悉了不同的图表类型。通常，柱状图或条形图更适用于比较字段值的频率。大多数图表要求搜索结果以至少两列的表格结构呈现，其中第一列提供`x`轴的值，其余列提供`y`轴的值。除了图表之外，Splunk\
  \ 还允许我们通过量表来可视化结果数据。当搜索结果中只有一个结果值，且该值可以映射到量表提供的范围时，量表的效果最佳。Splunk 提供了径向量表、填充量表和标记量表。你将在第\
  \ 10 章中了解更多关于`chart`和`timechart`命令的信息。\n\n在第 2 章中，你已经了解了 Splunk 技术插件和 Splunk 应用。其中一个关键区别在于，应用用于在数据加载到\
  \ Splunk 之后进行数据可视化。在本章前面以及第 3 章中，我们查看了`MyGizmoStore.com`的热门 IP 地址，但从业务角度来看，更有用且更具说服力的是找出这些\
  \ IP 地址的地理位置。这样，我们就可以发现模式，例如`MyGizmoStore.com`的大多数客户来自哪里。Splunkbase 上有两个可用的应用用于可视化\
  \ IP 地址的地理位置，我们将对它们进行探讨：\n\n*   Google Maps\n*   Globe\n\n## 使用 Google Maps 应用进行可视化\n\
  \n我们需要在 Splunk 实例上安装 Google Maps 应用。你可以使用在第 2 章中学到的相同方法，通过“应用”菜单下的“查找应用……”链接进行安装。在\
  \ Splunkbase 上搜索 Google Maps 并进行安装。安装完成后，你将能够在“应用”菜单中看到 Google Maps，如图 4-22 所示。\n\
  \n![9781430257615_Fig04-22.jpg](img/9781430257615_Fig04-22.jpg)\n\n图 4-22. Google\
  \ Maps 应用\n\n点击“Google Maps”将会打开熟悉的谷歌地图。此应用提供了一个`geoip`命令，该命令接收 IP 地址并将其绘制在地图上，遍布全球。在我们的示例`MyGizmoStore.com`数据中，我们有一个`clientip`字段，其中包含\
  \ IP 地址。让我们输入以下搜索：\n\n```\nsourcetype=access*\n| geoip clientip\n```\n\n图 4-23 显示了生成的谷歌地图，它缩放到了美国范围。我们可以看到，`MyGizmoStore.com`在\
  \ 180 个不同地点拥有客户；在美国，堪萨斯州、肯塔基州和纽约州是前三名区域。\n\n![9781430257615_Fig04-23.jpg](img/9781430257615_Fig04-23.jpg)\n\
  \n图 4-23. 美国境内`MyGizmoStore.com` IP 地址的可视化\n\n我们可以使用缩放控件缩小地图，以查看全球分布情况。如果你选择 Splunk\
  \ 叠加层，地图背景会变暗，顶部会显示更亮的数字，如图 4-24 所示。如你所见，北美是`MyGizmoStore.com`最受欢迎的区域。\n\n![9781430257615_Fig04-24.jpg](img/9781430257615_Fig04-24.jpg)\n\
  \n图 4-24. `MyGizmoStore.com` IP 地址全球分布的可视化\n\n我们可以使用“操作”菜单下的“保存搜索”来保存该搜索，如图 4-25\
  \ 所示。我们将搜索保存为“客户位置地图”。你可以点击“设置”菜单来编辑诸如地理位置数据库等设置，并指定 IP 地址反向查找的工作方式。在“视图”菜单下，你会找到一些演示，可以观看以熟悉该应用。\n\
  \n![9781430257615_Fig04-25.jpg](img/9781430257615_Fig04-25.jpg)\n\n图 4-25. 使用 Google\
  \ Maps 应用保存搜索\n\n我们要讨论的第二个用于可视化 IP 地址的应用是 Globe。\n\n## Globe\n\nGlobe 与 Google Maps\
  \ 应用非常相似，不同之处在于地理位置的显示是在一个旋转的地球上，并且位置以从地球射出的光束显示。光束越长，表示活动越多。你可以从 Splunkbase 安装\
  \ Globe 应用；成功安装后，你可以在“应用”菜单下找到它，如图 4-26 所示。\n\n![9781430257615_Fig04-26.jpg](img/9781430257615_Fig04-26.jpg)\n\
  \n图 4-26. Globe 应用\n\n点击“Globe”后，你将选择“ChromeGlobe”，如图 4-27 所示。\n\n![9781430257615_Fig04-27.jpg](img/9781430257615_Fig04-27.jpg)\n\
  \n图 4-27. Globe 视图\n\n选择视图后，我们可以使用与 Google Maps 相同的搜索：\n\n```\nsourcetype=access*\n\
  | geoip clientip\n```\n\n这将调出一个带有光束的旋转地球，你可以倾斜地球以从不同方向查看。图 4-28 显示了从北极一侧观察到的客户活动。在撰写本书时，Globe\
  \ 应用仍处于实验阶段，并且不公开提供下载。我们预计，当你阅读本章时，它应该可以在 Splunkbase 上获取。\n\n![9781430257615_Fig04-28.jpg](img/9781430257615_Fig04-28.jpg)\n\
  \n图 4-28. Globe 中的`MyGizmoStore.com`客户活动\n\n与 Google Maps 一样，你可以使用“操作”菜单下的“保存搜索……”选项来保存搜索，如图\
  \ 4-29 所示。\n\n![9781430257615_Fig04-29.jpg](img/9781430257615_Fig04-29.jpg)\n\n\
  图 4-29. 保存 Globe 搜索\n\n到目前为止，我们专注于构建可用于可视化加载到 Splunk 中的数据的报表，并利用 Splunk 应用来帮助可视化数据。现在，我们将探讨如何将这些报表组合成一个仪表板。\n\
  \n## 仪表板\n\n\n\n仪表盘在衡量和跟踪公司绩效方面非常流行，它们是一种管理最佳成功指标的有效方式。仪表盘允许公司不同部门之间共享关键信息，并可被视为查看当前状况的一站式场所。仪表盘能够精准定位优势与挑战；其用户无需费力翻阅大量无关紧要、缺乏意义的数据。相反，仪表盘能够基于高级分析来识别和展示数据。管理者可以根据仪表盘中的信息做出明智的、基于证据的决策。\n\
  \n企业正希望通过使用预测性指标来超越历史和描述性数据，从而进行决策。仪表盘中应仅引入少数几个关键指标。你的受众不需要海量数据；他们需要的是严谨的思考和有充分研究的信息。请务必记住，仪表盘的主要目标是沟通；你不应使用复杂的图形、仪表盘和刻度盘来分散查看者的注意力。仪表盘中的数据应当干净、可用，并以对企业有意义的方式进行整合。\n\
  \n`Splunk`提供了几种创建有意义仪表盘的方法，这些仪表盘基于搜索和可视化图表构建。最简单的方法是使用`Splunk` Web 用户界面。我们一直在使用`Splunk`的搜索应用进行搜索；然而，你可能没有意识到搜索应用已经内置了一个基础仪表盘（图\
  \ 4-30）。该仪表盘提供了关于加载到`Splunk`中的数据、已索引事件数量、不同数据源、源类型和主机的信息。它提供了一个整体快照，并让用户能够通过下钻或创建搜索来查找特定数据。\n\
  \n![9781430257615_Fig04-30.jpg](img/9781430257615_Fig04-30.jpg)\n\n图 4-30. Splunk\
  \ 搜索应用仪表盘\n\n`Splunk`还提供了一个包含五个状态仪表盘的默认集合，可以通过点击“状态”菜单来访问，如图 4-31 所示。\n\n![9781430257615_Fig04-31.jpg](img/9781430257615_Fig04-31.jpg)\n\
  \n图 4-31. Splunk 状态仪表盘\n\n*   “搜索活动”仪表盘提供了关于`Splunk`实例搜索活动的信息。你可以看到搜索的峰值负载时间、最受欢迎的搜索等。\n\
  *   “索引活动”仪表盘提供了关于索引和索引大小的几个有用统计分解，以及资源（如每个索引的 CPU）利用率、过去 24 小时内被索引的前五个来源等信息。\n\
  *   “服务器活动”仪表盘提供了关于近期浏览器使用情况、`Splunk` Web 错误以及`Splunk`运行状况的信息。图 4-32 展示了一个精美的服务器活动仪表盘，并很好地使用了仪表图表来显示错误、访问延迟和正常运行时间等信息。你可以控制仪表图表的阈值和范围值，以使数据更有意义。\n\
  \n![9781430257615_Fig04-32.jpg](img/9781430257615_Fig04-32.jpg)\n\n图 4-32. 使用仪表图表的\
  \ Splunk 活动概览\n\n*   “输入活动”仪表盘提供了关于已处理或被忽略的日志文件输入的相关信息。\n*   “调度器活动”仪表盘提供了关于搜索调度器的信息，其图表显示了已启动和已跳过的搜索、平均执行时间、运行计划搜索所需的平均时间等。\n\
  \n现在你已经了解了`Splunk`作为默认仪表盘提供的内容，以及可以使用的丰富信息，让我们探讨如何创建自定义仪表盘。在本章中，我们创建了与`MyGizmoStore.com`示例数据相关的不同搜索和可视化图表。我们将精心挑选其中一些，创建一个提供关于`MyGizmoStore.com`快照信息的仪表盘。我们将采用以下报告：\n\
  \n*   每个产品的购买量和浏览量图表\n*   404 错误\n*   购买趋势\n*   交易持续时间\n*   按产品划分的购买量排名\n\n首先，点击“仪表盘和视图”菜单下的“创建仪表盘...”链接，如图\
  \ 4-33 所示。\n\n![9781430257615_Fig04-33.jpg](img/9781430257615_Fig04-33.jpg)\n\n\
  图 4-33. 创建仪表盘\n\n这将调出“创建新仪表盘”对话框。我们将输入`MyGizmoStore`作为 ID，`MyGizmoStore.com`作为名称，如图\
  \ 4-34 所示。点击“创建”按钮。\n\n![9781430257615_Fig04-34.jpg](img/9781430257615_Fig04-34.jpg)\n\
  \n图 4-34. 创建 MyGizmoStore 仪表盘\n\n现在已创建一个空仪表盘。为了使其可编辑并添加之前创建的报告，请点击“编辑”开关以开启状态，如图\
  \ 4-35 所示。\n\n![9781430257615_Fig04-35.jpg](img/9781430257615_Fig04-35.jpg)\n\n\
  图 4-35. 编辑`MyGizmoStore.com`仪表盘\n\n为了开始将报告添加到仪表盘，我们需要创建一个新的面板来容纳报告。点击“新建面板”，这将调出一个对话框，如图\
  \ 4-36 所示。我们将开始为“购买量和浏览量”图表创建一个面板。输入“购买量和浏览量”作为标题，并选择“已保存搜索”单选按钮。下拉框将显示已保存的报告列表。选择“购买量和浏览量面积图”。点击“保存”按钮。\n\
  \n![9781430257615_Fig04-36.jpg](img/9781430257615_Fig04-36.jpg)\n\n图 4-36. 购买量和浏览量面板\n\
  \n这将使报告以表格格式显示。为了将其可视化为图表，您必须点击“编辑”并选择“编辑可视化”，如图 4-37 所示。\n\n![9781430257615_Fig04-37.jpg](img/9781430257615_Fig04-37.jpg)\n\
  \n图 4-37. 编辑购买量和浏览量的可视化\n\n这将调出对话框，您可以根据希望如何可视化表格数据来进行更改。让我们选择“面积图”，如图 4-38 所示，我们之前看到这种图表对此数据很有效。点击“保存”按钮。\n\
  \n![9781430257615_Fig04-38.jpg](img/9781430257615_Fig04-38.jpg)\n\n图 4-38. 编辑可视化\n\
  \n您现在将看到购买量和浏览量的表格数据以面积图的形式呈现，如图 4-39 所示。\n\n![9781430257615_Fig04-39.jpg](img/9781430257615_Fig04-39.jpg)\n\
  \n图 4-39. 购买量和浏览量\n\n现在您已经逐步学习了如何将报告添加到仪表盘，我们将把其余的报告也添加到仪表盘中。\n\n对于 404 错误报告：\n\n\
  *   点击“新建面板”；命名为“404 错误”，然后从下拉框中选择“404 错误图表”报告。点击“保存”。\n*   编辑该面板，并选择“饼图作为可视化”。点击“保存”。\n\
  \n对于购买趋势报告：\n\n*   点击“新建面板”；命名为“购买趋势”，然后从下拉框中选择“购买趋势”报告。点击“保存”。\n\n对于交易持续时间报告：\n\
  \n*   点击“新建面板”；命名为“交易持续时间”，然后从下拉框中选择“交易持续时间图表”报告。点击“保存”。\n*   编辑该面板，并选择“柱状图作为可视化”。点击“保存”。\n\
  \n\n\n针对**热销产品购买**报告：\n\n- 点击`新建面板`；命名为“热销产品购买”，然后从下拉框中选择“热销产品购买图表”报告。点击`保存`。\n\
  - 编辑该面板，选择“列作为可视化方式”，并将堆叠模式选项设为“堆叠”。点击`保存`。\n\n现在，我们已经将所有希望纳入`MyGizmoStore.com`仪表盘的报告添加完毕，接下来可以合理排列它们，使仪表盘更易于理解。您可以在仪表盘中拖放每个面板以重新排列。重新排列仪表盘后，前往“仪表盘和视图”菜单，点击`MyGizmoStore.com`链接以调出新的仪表盘，如图\
  \ 4-40 所示。\n\n![9781430257615_Fig04-40.jpg](img/9781430257615_Fig04-40.jpg)\n\n\
  图 4-40. `MyGizmoStore.com` 仪表盘\n\n您已经了解到诸如 Google Maps 或 Globe 之类的 Splunk 应用如何帮助我们实现数据可视化。在第\
  \ 2 章中，您学习并安装了用于 Windows 和*Unix 环境的 Splunk 技术插件，以便在 Windows 或 Unix 环境中收集数据。这些插件也包含功能完善的\
  \ Splunk 应用，这意味着您不仅可以收集数据，还可以通过预制仪表盘实现数据可视化。\n\n让我们看看如何利用 Splunk 的`*Nix`应用。您可以像安装其他应用一样下载并安装`*Nix`应用。如果您同时安装了`*Nix`插件，则需要先禁用它，`*Nix`应用才能正常工作。要禁用某个特定应用，请使用\
  \ Splunk 管理器并点击“应用”。安装`*Nix`应用后，它将会列在“应用”菜单下，如图 4-41 所示。\n\n![9781430257615_Fig04-41.jpg](img/9781430257615_Fig04-41.jpg)\n\
  \n图 4-41. `*Nix` 应用\n\n在 Unix 系统中，您可以启用要加载到 Splunk 的数据源。为了展示`*Nix`仪表盘的效果，我们启用了`/var/logs`作为文件和目录输入，并启用了脚本输入中的`cpu`、`memory`、`top`和`who`。`*Nix`提供了一套全面的仪表盘，让您能够可视化跨\
  \ CPU、内存、磁盘、网络、用户及不同日志文件的信息。您可以在此基础上构建自定义仪表盘，或利用`*Nix`加载到 Splunk 的数据，以不同图表格式创建报告。\n\
  \n本章将通过查看`*Nix`中的仪表盘示例来收尾。图 4-42 展示了 CPU 概览仪表盘，您可以从 CPU 菜单访问，它提供了按用户、进程等维度划分的 CPU\
  \ 消耗可视化信息。您可以看到，该应用使用了`timechart`命令来创建构成仪表盘的报告。\n\n![9781430257615_Fig04-42.jpg](img/9781430257615_Fig04-42.jpg)\n\
  \n图 4-42. `*Nix` CPU 概览仪表盘\n\n图 4-43 展示了内存仪表盘，它可视化了按进程划分的内存使用情况、前十名用户的内存用量等。\n\n\
  ![9781430257615_Fig04-43.jpg](img/9781430257615_Fig04-43.jpg)\n\n图 4-43. `*Nix`\
  \ 内存概览仪表盘\n\n图 4-44 展示了日志记录仪表盘，它可视化了跨不同日志文件的吞吐量。Splunk Windows 应用也提供了一套类似于`*Nix`的全面仪表盘。您可以像安装`*Nix`一样安装它。\n\
  \n![9781430257615_Fig04-44.jpg](img/9781430257615_Fig04-44.jpg)\n\n图 4-44. `*Nix`\
  \ 日志记录仪表盘\n\n## 总结\n\n在本章中，您学习了如何可视化索引到 Splunk 中的数据。您了解了 Splunk 通过报告生成器和 SPL 命令`chart`及`timechart`提供的报告功能。您学习了不同的图表类型，以及如何使用`MyGizmoStore.com`样本数据针对不同类型的数据结构应用这些图表。最后，您学习了如何构建仪表盘以及探索有助于实现可视化并预置仪表盘的\
  \ Splunk 应用。\n\n---\n\n## 定义告警\n\n在本章中，您将了解 Splunk 提供的不同类型的告警，以及如何创建告警并采取行动。您将利用来自`MyGizmoStore.com`和`*Nix`的搜索和数据，通过不同的使用场景触发不同类型的告警。\n\
  \n### 什么是告警？\n\n告警是简短的消息或通知，帮助个人了解已发生或可能发生的某些事情。我们在日常生活中都习惯了告警：例如，日历通知提醒我们应参加的会议。在美国乘飞机旅行的人熟知国土安全部的咨询系统，该系统以颜色编码威胁等级发出告警。作为在线客户，我们习惯了从在线商店或在线票务网站收到价格告警，例如当商品、机票或酒店客房价格下降时。企业\
  \ IT 团队关注安全、网络、CPU、内存等类型的告警，这些告警对应用程序性能、可能发生的安全漏洞或某些服务水平协议（SLA）是否无法达成有巨大影响。即使没有电脑，我们也习惯了通过收音机、电视、手机和平板电脑接收天气告警。\n\
  \n无论我们是否明确将其视为告警，告警如今已成为我们生活的一部分。对于企业而言，有关网络、硬件、应用程序、网站等的告警是了解 IT 基础设施状况、与 SLA 相比表现如何的关键指标；从业务角度看，也能反映运营状况，无论是库存、运输、呼叫中心、客户支持还是销售方面。那么问题来了：Splunk\
  \ 为告警提供了什么？我们将在本章接下来的几节中探讨。\n\n### Splunk 如何提供告警\n\n了解所有正在收集的数据发生了什么，以及如何利用这些信息来获知积极和消极类型的事件，这一点至关重要。我们已经看到\
  \ Splunk 处理、分析和可视化不同来源的数据；现在需要了解，从 IT 和业务角度来看，用户如何被告警到异常事件。您可以将 Splunk 用作企业的监控工具。Splunk\
  \ 提供三种不同类型的告警：\n\n\n\n"
- "# 警报类型与创建\n\nSplunk 提供了三种类型的警报：\n\n- **计划警报（Scheduled alerts）** — 这类警报用于按指定时间间隔运行的搜索。搜索基于历史事件集工作，当满足特定警报条件时触发警报。例如，一家在线商店（如\
  \ `MyGizmoStore.com`）会运行一个统计每日产品销售数量的搜索；当销售数量低于某个阈值时触发警报。这类警报适用于不需要立即响应，但用户希望了解警报条件是否满足的情况，以便他们知悉并可能采取行动或进一步调查问题。\n\
  - **按结果警报（Per results alerts）** — 这类警报用于当你希望在搜索中满足警报条件时立即获知。一个典型例子是运行一个检查 HTTP 状态码是否大于等于\
  \ 500（即服务器错误）的搜索，并在满足条件时每小时发送一次警报。\n- **滚动窗口警报（Rolling-window alerts）** — 这类警报用于在滚动时间窗口内实时监控事件，例如过去\
  \ 10 分钟。当滚动窗口中符合条件的事件满足警报条件时，警报被触发。一个典型例子是欺诈检测，其中某人在 10 分钟滚动窗口内使用同一张信用卡进行了超过三次购买。\n\
  \n现在你已经了解了 Splunk 提供的警报及其不同类型，让我们探索如何创建警报。与前几章类似，我们将以与 `MyGizmoStore.com` 相关的不同用例为例，并使用通过\
  \ *Nix 收集的数据。我们将探讨的三个用例是：\n\n- 基于产品销售数量的警报\n- 登录失败警报\n- 日志文件中严重错误的警报\n\nSplunk Web\
  \ 是创建警报最简单的方式。我们将从第一个用例开始。\n\n## 基于产品销售数量的警报\n\n在此用例中，我们希望统计昨天的产品销售数量，并在该数量低于 30\
  \ 时触发警报。\n\n首先，我们将构建一个快速搜索，以便在警报中使用。在第 2 章中，我们使用了时间选择器来聚焦特定日期范围。要计算昨天的产品销售总数，我们可以使用时间选择器中的“Yesterday”选项。Splunk\
  \ 提供了时间修饰符，用于自定义搜索的时间范围。Splunk 提供三种时间修饰符：\n\n- `earliest` — 指定搜索时间范围的最早时间\n- `latest`\
  \ — 指定搜索时间范围的最晚时间\n- `now` — 当前时间\n\n时间修饰符支持以秒、分钟、小时、天、周、星期几、月、季度和年为单位指定时间。在下面的搜索中，我们使用了\
  \ `earliest`，并通过指定 `-1d` 回溯一天，这意味着从当前日期减去一天。要计算总购买次数，我们使用 `eval` 命令查找具有购买操作的事件，并使用\
  \ `count` 函数。图 5-1 显示搜索已使用时间修饰符，并显示了昨天的产品销售总数。\n\n```\nsourcetype=access_*\n  earliest=-1d\n\
  \  action=purchase\n| stats count(eval(action=\"purchase\")) AS \"Total Products\
  \ Sold Yesterday\"\n```\n\n![9781430257615_Fig05-01.jpg](img/9781430257615_Fig05-01.jpg)\n\
  \n图 5-1. 昨日产品销售总数\n\n现在我们已经有了一个可以统计昨天产品销售总数的搜索，接下来可以使用 Splunk Web 安排一个计划警报，同时保存该搜索。选择“Create”并点击“Alert...”链接，如图\
  \ 5-2 所示。你也可以通过 Splunk Manager 界面将警报添加到已保存的搜索中，并在“Searches and reports”部分选择特定搜索。本章中我们将探讨的所有警报选项在向已保存搜索添加警报时均可用。\n\
  \n![9781430257615_Fig05-02.jpg](img/9781430257615_Fig05-02.jpg)\n\n图 5-2. 创建警报\n\
  \n在出现的“Create Alert”对话框中，输入“Yesterday Purchases Alert”作为名称。在“Schedule”下拉菜单中，选择“Run\
  \ on a schedule once every”。对话框将展开显示更多选项。选择“Day”作为计划周期，即每天运行一次。在“Trigger if”下拉菜单中，选择“Number\
  \ of results”和“is less than”，并输入 30 作为阈值。当昨天的产品销售数量低于 30 时，此警报将被触发。图 5-3 显示了所选选项。点击“Next”按钮。\n\
  \n![9781430257615_Fig05-03.jpg](img/9781430257615_Fig05-03.jpg)\n\n图 5-3. 安排警报\n\
  \n在“Create Alert”对话框的“Actions”页面，你将看到不同的操作选项。三种可能的操作选项包括：向用户或用户组发送电子邮件、运行一个可能采取立即预防措施的脚本（例如配置额外的磁盘空间），以及使用\
  \ Splunk Alert Manager 查看触发的警报。\n\n对于此用例，我们将选择警报管理器选项，并在创建警报后探索警报管理器。每个警报都可以标记一个严重级别，以指示警报的重要性。例如，你可能希望查看与\
  \ CPU 利用率超过 90% 或内存耗尽相关的警报。图 5-4 显示了一个严重级别下拉框，选项包括 Low、Medium、High 和 Critical。由于这不是高优先级警报，我们将选择“Medium”。你可以使用严重级别作为在警报管理器中筛选已触发警报的方式。警报可以针对所有结果触发，也可以针对每个结果触发。选择“All\
  \ results”单选按钮。我们将在接下来的两个用例中讨论节流（throttling）机制。点击“Next”按钮。图 5-4 显示了已启用的选项。\n\n![9781430257615_Fig05-04.jpg](img/9781430257615_Fig05-04.jpg)\n\
  \n图 5-4. 警报操作\n\n在警报创建过程的最后一步，你可以选择与其他用户共享警报或保持私有。这与共享搜索类似。选择“Share as read-only\
  \ to all users of current app”单选按钮。这将使多个用户能够查看警报，并及时了解特定活动或性能指标。点击“Finish”按钮。你将看到“Alert\
  \ saved successfully”弹出框。点击“OK”。\n\n![9781430257615_Fig05-05.jpg](img/9781430257615_Fig05-05.jpg)\n\
  \n图 5-5. 共享警报\n\n警报管理器显示所有警报的记录，并提供基于应用、所有者、严重级别和警报进行搜索、筛选和查看的选项。也可以删除选定的警报。要访问警报管理器，请点击“Alerts”菜单，如图\
  \ 5-6 所示。\n\n![9781430257615_Fig05-06.jpg](img/9781430257615_Fig05-06.jpg)\n\n图\
  \ 5-6. 警报管理器\n\n\n\n在 Alert manager 中，在 **Alert** 下拉框里选择 **Yesterday Purchases Alert**，如图\
  \ 图 5-7 所示。您会看到告警被筛选出来，并显示了与此告警相关的记录。在本例中，我们只有一个告警。\n\n![9781430257615_Fig05-07.jpg](img/9781430257615_Fig05-07.jpg)\n\
  \n图 5-7. Alert manager 中的昨日购买告警\n\n您可以点击“查看结果”链接来查看此次搜索的实际结果，并找出告警触发的原因。正如您在 图 5-1\
  \ 中看到的，销售的产品数量只有 18 个，而我们的告警条件设置为当销量低于 30 时触发告警，因此触发了告警。\n\n## 关于登录失败的告警\n\n我们在第\
  \ 4 章中安装了 Splunk *Nix 应用，并启用了将不同日志中的数据索引到 Splunk。现在我们可以利用从安全日志中加载的数据，找出过去 24 小时内发生了多少次登录失败，从而创建一个不同类型的实时告警。通过“App”菜单进入\
  \ *Nix 应用。*Nix 创建了自己的索引 `os`，因此我们指定索引名称开始搜索。在索引名称之后，搜索包含 failure 且 `sourcetype`\
  \ 为 `linux_secure` 的任何事件。利用 `stats` 命令，按远程主机（`rhost`）统计失败次数。最后，对结果进行排序。\n\n```\n\
  index=os sourcetype=linux_secure failure\n| stats count by rhost\n| sort by count\n\
  ```\n\n图 5-8 显示了我们在 *Nix 应用搜索栏中输入上述搜索后得到的结果。结果可能会有很大差异，因为这些结果特定于我们在编写本章时所使用的服务器。您可以看到尝试登录的远程主机（`rhosts`）的\
  \ IP 地址以及失败次数，这些结果按降序排列。\n\n![9781430257615_Fig05-08.jpg](img/9781430257615_Fig05-08.jpg)\n\
  \n图 5-8. 登录失败\n\n我们将通过从 **Create** 下拉框中选择 **Alert . . .** 来为我们的搜索创建告警。在 **Create\
  \ Alert** 对话框中，我们将告警命名为 **Login Failure Alert**，并选择 **Trigger in real-time whenever\
  \ a result matches**。这是我们之前讨论过的第二种告警类型，称为逐结果告警。每当传入的事件实时匹配到搜索条件时，此告警就会被触发。图 5-9\
  \ 显示了所选选项。点击 **Next** 按钮。\n\n![9781430257615_Fig05-09.jpg](img/9781430257615_Fig05-09.jpg)\n\
  \n图 5-9. 为登录失败创建告警\n\n在 **Create Alert** 对话框的操作页面中，我们将启用一个操作，让 Splunk 向 `alert@mydomain.com`\
  \ 发送电子邮件。您可以将结果以内联、CSV 或 PDF 附件的形式包含在内。我们将其设置为内联，并像之前一样启用通过 Alert manager 查看告警的功能。由于此告警与安全相关，我们将严重性设置为\
  \ **High**。图 5-10 显示了所选选项。点击 **Next** 按钮。\n\n![9781430257615_Fig05-10.jpg](img/9781430257615_Fig05-10.jpg)\n\
  \n图 5-10. 登录失败的告警操作\n\n一旦告警成功创建，我们可以通过启动 Alert manager 来查看已触发的告警。我们可以使用应用名称来筛选告警，在本例中应用名称为\
  \ *Nix。由于 *Nix 应用可能有多个告警，我们可以通过在告警下拉框中选择特定的告警（本例中为 **Login security alert**）来进一步筛选。图\
  \ 5-11 显示了已触发的一组告警。我们可以看到此告警的类型设置为 **Real-time**，并且它是一种 **Per Result** 类型的告警。您还可以看到，用户可能会被可能触发的告警数量所淹没。这时\
  \ Splunk 的告警节流功能就派上用场了，我们将在下一个用例中进行探索。\n\n![9781430257615_Fig05-11.jpg](img/9781430257615_Fig05-11.jpg)\n\
  \n图 5-11. Alert Manager\n\n点击告警旁边的 **View results** 链接将会显示触发该告警的特定事件集，如图 图 5-12\
  \ 所示。\n\n![9781430257615_Fig05-12.jpg](img/9781430257615_Fig05-12.jpg)\n\n图 5-12.\
  \ 触发登录失败告警的事件\n\n## 关于日志文件中关键错误的告警\n\n在此用例中，我们将利用 *Nix 应用中启用的 Unix 日志文件数据。我们可以设置一个告警来查找任何关键错误。我们可以通过一个简单的搜索来实现，在其中指定索引为\
  \ `os`，`sourcetype` 为 `linux_secure`，并查找其中包含 `critical` 或 `error` 字样的已索引事件。在 *Nix\
  \ 应用中，输入以下搜索并创建一个名为 **Critical Errors Alert** 的新告警，如图 图 5-13 所示。我们将在 **Schedule**\
  \ 下拉框中选择 **Monitor in real-time over a rolling window of** 选项。在这里，我们将指定一个 30 分钟的窗口，并在结果数量大于\
  \ 15 时触发告警。\n\n```\nindex=os sourcetype=linux_secure critical OR error\n```\n\n\
  ![9781430257615_Fig05-13.jpg](img/9781430257615_Fig05-13.jpg)\n\n图 5-13. 创建关键错误告警\n\
  \n在告警对话框的操作页面中，我们将启用向 `alert@mydomain.com` 用户发送电子邮件的功能，并启用警报管理器选项。为此用例选择的一个新选项是节流。节流选项会在初始告警触发后，在指定的时间段内抑制后续告警。正如您在之前关于登录失败的用例中看到的，与其收到重复的告警，不如指定在特定的秒、分钟或小时内抑制告警。在此例中，我们将指定为\
  \ 15 分钟。您需要找到最适合您所创建告警的最佳时间，以便节流不会抑制重要的告警。\n\nSplunk 允许您在告警触发时运行脚本。可以通过在 **Create\
  \ Alert** 的 **Actions** 页面中选中 **Run a script** 选项来启用此功能。此功能可用于通过脚本化自动化流程立即采取行动。典型的例子包括：在三次失败后禁用用户登录、阻止在\
  \ DDOS 攻击中使用的 IP 地址、当用户活动达到预设阈值时在云上预配额外的计算或存储资源，或者将触发告警的详细信息发送给另一个会触发所需操作的应用或系统。需要执行的脚本必须放置在\
  \ `$SPLUNK_HOME/bin/scripts` 目录下，其中 `$SPLUNK_HOME` 是 Splunk 的安装目录。\n\n\n\n创建告警后，您始终可以通过“管理”菜单中的“搜索与报告”链接对其进行编辑，该链接位于“知识”部分。图\
  \ 5-14 显示了针对严重错误告警的指定选项。单击**下一步**按钮。\n\n![9781430257615_Fig05-14.jpg](img/9781430257615_Fig05-14.jpg)\n\
  \n图 5-14。为告警选择节流选项\n\n告警创建完成后，您可以前往**告警管理器**，根据应用程序和告警进行筛选。我们可以在**告警**字段中选择`*Nix`作为应用程序，并选择`Critical\
  \ Errors Alert`，这样即可调出迄今为止已触发的告警。图 5-15 显示了告警记录。您会注意到**模式**列显示为**摘要**，这意味着该告警与一组事件相关。\n\
  \n![9781430257615_Fig05-15.jpg](img/9781430257615_Fig05-15.jpg)\n\n图 5-15。针对严重错误已触发的告警\n\
  \n点击“查看结果”会显示与合格告警摘要相关的事件列表。图 5-16 展示了此告警的示例事件集。\n\n![9781430257615_Fig05-16.jpg](img/9781430257615_Fig05-16.jpg)\n\
  \n图 5-16。与严重错误相关的事件\n\n## 本章小结\n\n在本章中，您学习了 Splunk 提供的三种不同类型的告警。我们通过一系列常见的用例场景，利用来自`MyGizmoStore.com`和`*Nix`的搜索以及告警中可用的不同操作，探讨了如何创建告警。您还学习了如何利用告警管理器查看已触发的告警。\n\
  \n"
