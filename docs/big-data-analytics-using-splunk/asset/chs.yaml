- "# 第 1 章\n\n![image](img/frontdot.jpg)\n\n## 大数据与 Splunk\n\n在本介绍性章节中，我们将讨论什么是大数据，以及处理大数据的各种方式（包括\
  \ Splunk）。\n\n## 什么是大数据？\n\n不可否认，“大数据”是一个被软件和硬件公司用来提升销量的过度炒作的热词。然而，在炒作的背后，存在着一个真实且极其重要的技术趋势，具有令人印象深刻的商业潜力。尽管大数据通常与社交媒体联系在一起，但我们将说明其意义远不止于此。然而，在我们深入探讨定义之前，先来看一些关于大数据的事实。\n\
  \n\n\n### 大数据的三个 V\n\n早在 2001 年，Meta Group（一家 IT 研究公司，于 2005 年被 Gartner 收购）的 Doug\
  \ Laney 撰写了一篇研究论文，其中指出电子商务已从三个维度引爆了数据管理：`volume`（数量）、`velocity`（速度）和`variety`（多样性）。这些被称为大数据的三个\
  \ V，而且正如你所料，许多供应商在其定义中增加了更多的 V。\n\n#### Volume（数量）\n\n`Volume`是提及大数据时首先想到的：即“大”的部分。一些专家认为`Petabytes`（拍字节）是大数据的起点。随着我们生成越来越多的数据，我们确信这个起点将持续增长。然而，数量本身并非大数据的完美标准，因为我们觉得另外两个\
  \ V 具有更直接的影响。\n\n#### Velocity（速度）\n\n`Velocity`指的是数据生成的速度或其传递的频率。想想来自洛杉矶地区高速公路传感器的数据流，或某些机场扫描和处理人群中面孔的摄像头。还有热门电子商务网站的点击流数据。\n\
  \n#### Variety（多样性）\n\n`Variety`涉及所有可用的不同数据和文件类型。只需想想 iTunes 商店中的音乐文件（约 2800 万首歌曲，超过\
  \ 300 亿次下载），或 Netflix 上的电影（超过 75000 部），《纽约时报》网站上的文章（自 1851 年起超过 1300 万篇），推文（每天超过\
  \ 5 亿条），带有地理定位数据的`foursquare`签到（每天超过 500 万次），然后还有所有由任何嵌入计算机的系统产生的不同日志文件。当你将这三个 V\
  \ 结合起来，你将开始对大数据的内涵有更全面的了解。\n\n## 大数据的其他特征\n\n另一个通常与大数据相关的特征是数据是非结构化的。我们认为，不存在所谓的非结构化数据。我们认为这种混淆源于一种普遍看法：如果数据不能符合预定义的格式、模型或模式，那么它就被认为是非结构化的。\n\
  \n一封电子邮件通常被用作非结构化数据的例子；虽然邮件正文可以被视为非结构化，但它是遵循`RFC-2822`规范的明确定义结构的一部分，并包含一组字段，包括`From`、`To`、`Subject`和`Date`。这对于\
  \ Twitter 消息也是如此，其中消息或推文的正文可以被视为非结构化，同时它也是一个明确定义结构的一部分。\n\n一般来说，自由文本可以被视为非结构化，因为正如我们之前提到的，它不一定符合预定义的模型。根据对文本的处理目的，有许多技术可以处理它，其中大多数不需要预定义的格式。\n\
  \n关系型数据库强制要求预定义的数据模型，这些模型具有清晰定义的字段，这些字段存在于表格中，表格之间可以存在关系。我们称之为**早期结构绑定**，即你必须事先知道要对数据提出什么问题，以便能够设计模式或结构，然后处理数据来回答这些问题。\n\
  \n由于大数据通常与被视为文本密集型的社交媒体信息流相关联，因此很容易理解为什么人们将“非结构化”一词与大数据联系起来。从我们的角度来看，“多结构化”可能是一个更准确的描述，因为大数据可以包含多种格式（三个\
  \ V 中的第三个 V）。\n\n认为大数据仅限于所谓的非结构化数据是不公平的。结构化数据也可以被视为大数据，尤其是那些滞留在辅助存储中，希望有一天能进入数据仓库进行分析并揭示其所含金矿的数据。这类数据通常被忽略的主要原因是因为其庞大的体积，这通常超出了基于关系数据库的数据仓库的容量。\n\
  \n## Gartner 的定义\n\n此时，我们可以引入信息技术（IT）咨询公司`Gartner`在 2012 年提出的定义：“大数据是需要新处理模式才能增强决策力、洞察发现力和流程优化能力的高数量、高速度或高多样性的信息资产。”我们喜欢这个定义，因为它不仅关注实际数据，还关注大数据的处理方式。在本书的后面，我们将对此进行更详细的讨论。\n\
  \n## 大数据的分类\n\n我们也喜欢对大数据进行分类，因为我们认为这能增进理解。从我们的角度来看，大数据可以分为两大类：人类生成的数字足迹和机器数据。随着我们在互联网上的互动不断增加，我们的数字足迹也在持续增长。尽管我们每天都在与数字系统互动，但大多数人没有意识到即使是简单的点击或互动会留下多少信息。我们必须承认，在我们开始阅读互联网统计数据之前，我们熟悉的唯一大数字是麦当劳的标语“已服务数十亿又数十亿人”，以及偶尔接触到的美国政客谈论数万亿美元预算或赤字的情况。为了让你有个概念，我们提供一些互联网统计数据，以展示我们数字足迹的规模。我们很清楚，在我们写下这些数据时它们已经过时了，但无论如何它们如下所示：\n\
  \n\n\n-   截至 2013 年 2 月，Facebook 的用户数量已超过十亿，其中日均活跃用户达 6.18 亿。这些用户每天分享 25 亿条内容、点赞\
  \ 27 亿次，由此每天产生超过 500TB 的新数据。\n-   截至 2013 年 3 月，以商务社交为核心的 LinkedIn 已拥有超过 2 亿会员，并以每秒新增\
  \ 2 名用户的速度增长，仅在 2012 年就生成了 57 亿次商务定向搜索。\n-   照片分享是热门领域，多数人的手机都配备摄像头。相关数据令人惊叹：Instagram\
  \ 用户每天上传 4000 万张照片，每秒收到 8500 个点赞和约 1000 条评论。而 Facebook 每天上传的照片量高达 3 亿张，相当于每月产生约\
  \ 7PB 数据。截至 2013 年 1 月，Facebook 已存储 2400 亿张照片。\n-   推特拥有 5 亿用户，并以每天 15 万的速度增长，其中活跃用户超过\
  \ 2 亿。2012 年 10 月，其日均推文量达到 5 亿条。\n-   Foursquare 在 2013 年 1 月庆祝签到总数突破 30 亿次，来自 2500\
  \ 万用户每天产生约 500 万次签到，这些用户累计创建了 3000 万条推荐贴士。\n-   在博客领域，热门平台 WordPress 于 2013 年 3\
  \ 月报告称，每月新增近 4000 万篇文章和 4200 万条评论，超过 3.88 亿用户每月浏览超 36 亿个页面。另一热门博客平台 Tumblr 同年 3\
  \ 月同样报告，其拥有近 1 亿个博客，内容超过 440 亿篇文章，当时日均发布新博文 7400 万篇。\n-   个性化网络电台 Pandora 报告称，2012\
  \ 年其用户总计收听了 130 亿小时的音乐，相当于约 13700 年的音乐时长。\n-   类似地，Netflix 宣布其用户在 2012 年 7 月观看了\
  \ 10 亿小时的视频内容，这约占美国互联网流量的 30%。更惊人的是，YouTube 在 2013 年 3 月报告称，其用户每月观看时长超 40 亿小时，且每分钟上传的视频时长高达\
  \ 72 小时。\n-   截至 2013 年 3 月，全球共有近 1.45 亿个互联网域名，其中约 1.08 亿个使用著名的“.com”顶级域名。这一领域非常活跃：仅在\
  \ 3 月 21 日当天，就有 167698 个新域名注册、128866 个域名被删除，净增长 38832 个域名。\n-   在更为传统的电子邮件领域，Mashable\
  \ 网站的 Bob Al-Greene 于 2012 年 11 月报告称，每天发送的电子邮件超过 1440 亿封，其中约 61%来自企业。主要电子邮件服务商 Gmail\
  \ 拥有 4.25 亿活跃用户。\n\n回顾这些数据，毫无疑问人类产生的数字足迹是庞大的。你可以迅速识别出“三 V”（体量、速度、多样性）特征。为了让您了解大数据对经济的影响，我们分享用户点评网站\
  \ Yelp 在 2013 年 1 月（当时其拥有 1 亿独立访客和超 100 万条评论）发布的声明：“对 Yelp 商家的调查显示，所有类别顾客的首次消费平均金额为\
  \ 101.59 美元。这涵盖从雇佣屋顶维修工、购买新床垫，到清晨一杯咖啡的各类消费。如果这 1 亿独立访客每人都在当地商家消费 100 美元，那么 Yelp\
  \ 在 1 月份就影响了超过 100 亿美元的本地商业经济。”\n\n我们不会用每分钟或每秒的互联网数据来令您感到乏味。不过，几个与您息息相关的大数据应用实例可以强化这一概念：您在访问亚马逊网站或在\
  \ Netflix 考虑影片时获得的推荐，都基于大数据分析，正如沃尔玛利用大数据识别区域客户偏好并据此备货一样。至此，您应该已充分了解我们的数字足迹所创造的数据量，以及它对整体经济和社会产生的影响。社交媒体只是大数据的一个组成部分。\n\
  \n大数据的第二个类别是机器数据。支撑我们数字足迹的包含数量庞大的防火墙、负载均衡器、路由器、交换机和计算机。所有这些系统都会生成日志文件，涵盖安全审计日志、网站访问日志（记录访客行为，包括令人头疼的购物车放弃记录）等。\n\
  \n由于所有公司对此事都高度保密，几乎无法查明支撑我们数字足迹需要多少台服务器。许多专家试图根据用电量来估算谷歌、Facebook 和亚马逊等知名公司的服务器数量（根据这些公司愿意分享的用电效能指标，可以大致推断其数据中心内的服务器规模）。基于此，James\
  \ Hamilton 在 2012 年 8 月的一篇博客中发布估算数据，推测 Facebook 拥有 180900 台服务器，谷歌则超过 100 万台。其他专家指出，亚马逊在\
  \ 2012 年 3 月约有 5 亿台服务器。2012 年 9 月，《纽约时报》发表了一篇引人深思的文章，声称美国有数万个数据中心，消耗了全美约 2%的电力，其中\
  \ 90%以上被浪费，因为许多服务器并未真正投入使用。\n\n我们只能推测全球活跃服务器数量已达数百万台。当你将这些服务器与数据中心的其他典型基础设施组件（如防火墙、负载均衡器、路由器、交换机等，它们同样会生成日志文件）相加，你会发现支撑我们数字足迹的基础设施以日志文件形式产生了海量的机器数据。\n\
  \n有趣的是，就在不久前，这些包含机器数据的日志文件大多被忽视。然而，这些日志文件实为宝贵的数据金矿，因为它们包含了 IT 和业务决策的关键洞察——它们是客户活动与行为、以及产品与服务使用的确定性记录。这使企业能够实现端到端的交易可视化，用于改善客户服务、确保系统安全，并帮助满足合规要求。更重要的是，日志文件不仅能帮助您发现已发生的问题，还能辅助您预测未来何时可能发生类似问题。\n\
  \n除了上述机器数据之外，还有实时采集数据的传感器。大多数工业设备都内置传感器，产生大量数据。例如，燃气轮机用于发电的叶片每天产生 520GB 数据，而一台涡轮机有\
  \ 20 个叶片。一架跨大西洋航班的飞机产生数 TB 数据，这些数据可用于优化维护操作、提升安全性，并且（对航空公司利润而言最重要的）降低油耗。\n\n\n\n\
  另一个有趣的例子来自日产聆风，这是一款全电动汽车。它配备了一个名为`CARWINGS`的系统，不仅提供传统的远程信息处理服务和用于控制车辆各项功能的智能手机应用，还能将车辆统计数据无线传输到中央服务器。每位聆风车主都可以追踪自己的驾驶效率，并与其他聆风车主的能源经济性进行比较。我们不清楚日产正在从聆风车型中收集哪些具体信息，以及他们如何处理这些信息，但在这个例子中，我们确实能看到三个\
  \ V 在发挥作用。\n\n总的来说，基于传感器的数据属于工业大数据的范畴，尽管最近“物联网”这个术语更受欢迎，用来描述一个拥有传感器的*物品*的高度互联世界，其中存在超过\
  \ 3 亿个联网设备，范围从电表到自动售货机。本书不会涵盖这一类大数据，但这里描述的方法和技术可以很容易地应用于工业大数据分析。\n\n## 替代数据处理技术\n\
  \n大数据不仅关乎数据本身，也关乎那些能够更好地处理随着数值增长而增加的三个 V 的替代数据处理技术。传统关系型数据库以其以下特点而闻名：\n\n*   支持\
  \ ACID 属性的事务：\n    *   原子性：所有更改都像单个操作一样完成。\n    *   一致性：在任何事务结束时，系统都处于有效状态。\n  \
  \  *   隔离性：用于产生结果的操作似乎是按顺序、逐一执行的。\n    *   持久性：对系统进行的所有更改都是永久性的。\n*   在处理数千个交互式用户的同时，响应时间通常在亚秒级范围内。\n\
  *   数据量在 TB 级别。\n*   通常使用`SQL-92`标准作为主要编程语言。\n\n通常，关系型数据库无法很好地处理三个 V。正因如此，人们创建了许多不同的方法来解决三个\
  \ V 带来的固有问题。这些方法牺牲了一个或多个 ACID 属性，有时甚至牺牲所有属性，以换取处理大规模数据量、高速度或多样性的可扩展性。这些替代方法中的一些也会放弃快速响应时间或同时处理大量用户的能力，以优先解决三个\
  \ V 中的一个或多个。\n\n有些人将这些替代数据处理方法统称为 NoSQL，并根据它们存储数据的方式进行分类，例如键值存储和文档存储，其中文档的定义因产品而异。根据你与谁讨论，可能还有更多的类别。\n\
  \n开源 Hadoop 软件框架可能是在大数据领域知名度最高的，但它绝非唯一。作为一个框架，它包含多个旨在解决与分布式数据存储、检索和分析相关问题的组件。它通过提供两种旨在在商品服务器集群上运行的基本功能来实现这一点：\n\
  \n*   一个名为`HDFS`的分布式文件系统，它不仅存储数据，还会复制数据，以确保数据始终可用。\n*   一个用于可并行化问题的分布式处理系统，称为`MapReduce`，这是一个两步的方法。在第一步或\
  \ Map 阶段，一个问题被分解成许多小问题，并发送到服务器进行处理。在第二步或 Reduce 阶段，Map 步骤的结果被合并，以产生原始问题的最终结果。\n\n\
  Hadoop 的其他一些组件，通常被称为 Hadoop 生态系统，包括`Hive`，它是 Hadoop 提供的基本功能的一个更高层次的抽象。`Hive`是一个数据仓库系统，用户可以使用`SQL-92`标准指定指令，这些指令会被转换成`MapReduce`任务。`Pig`是另一个\
  \ Hadoop 的高级抽象，具有与`Hive`类似的功能，但它使用一种名为`Pig Latin`的编程语言，这种语言更面向数据流。\n\n`HBase`是 Hadoop\
  \ 生态系统的另一个组件，它实现了谷歌的`Bigtable`数据存储。`Bigtable`是一个分布式的、持久的多维有序映射。映射中的元素是一个未经解释的字节数组，由行键、列键和时间戳进行索引。\n\
  \nHadoop 生态系统中还有其他组件，但我们不会深入探讨它们。我们必须告诉你，除了官方的 Apache 项目外，Cloudera 和 Hortonworks\
  \ 等公司也提供 Hadoop 解决方案，这些方案提供开源实现，并带有主要专注于集群管理的商业附加组件。MapR 是一家提供 Hadoop 商业实现的公司，声称其性能更高。\n\
  \n大数据领域的其他流行产品包括：\n\n*   `Cassandra`，一个 Apache 开源项目，是一种键值存储，在商品硬件上提供线性可扩展性和容错能力。\n\
  *   `DynamoDB`，亚马逊网络服务（AWS）的产品，与`Cassandra`非常相似。\n*   `MongoDB`，一个开源项目，是一种文档数据库，提供高性能、容错性和易于扩展性。\n\
  *   `CouchDB`，另一个开源的文档数据库，具有分布式和容错性。\n\n除了这些产品之外，还有许多公司提供自己的解决方案，以不同的方式处理三个 V。\n\
  \n## 什么是 Splunk？\n\n从技术上讲，Splunk 是一个时间序列索引器，但为了简化，我们只需说它是一个能很好处理三个 V 的产品。我们之前描述的大多数产品都起源于处理人类生成的数字足迹，而\
  \ Splunk 最初是一个专为处理机器数据而设计的产品。由于这些不起眼的起源，Splunk 并不总被视为大数据领域的参与者。但这不应阻止你使用它来分析属于数字足迹类别的大数据，因为正如本书所示，Splunk\
  \ 在这方面做得非常出色。Splunk 有三个主要功能：\n\n*   数据收集，可以对静态数据进行收集，也可以通过实时监控文件或完整目录的变更和新增来进行。数据也可以从网络端口或直接从程序或脚本中收集。此外，Splunk\
  \ 可以连接关系型数据库以收集、插入或更新数据。\n*   数据索引，在这个过程中，收集到的数据被分解成事件，大致相当于数据库记录或简单的数据行。然后对数据进行处理，并更新一个高性能索引，该索引指向存储的数据。\n\
  *   搜索与分析。使用 Splunk 处理语言，您能够搜索数据并对其进行操作，以获得所需的结果，无论是报告形式还是警报形式。结果可以呈现为单个事件、表格或图表。\n\
  \n\n\n这些功能中的每一项都可以独立扩展；例如，数据收集组件可以扩展以处理数十万台服务器。数据索引功能可以扩展到大量服务器，这些服务器可以配置为分布式对等节点，并且如有必要，还可以通过高可用性选项来透明地处理容错。作为专用于搜索和分析功能的服务器，搜索头同样可以根据需要扩展至任意数量。此外，这些功能中的每一项都可以通过特定的布局方式来优化，以适应地理位置、时区、数据中心或任何其他要求。Splunk\
  \ 在可扩展性方面非常灵活，你可以从在笔记本电脑上运行单个产品实例开始，然后在此基础上逐步扩展。\n\n你可以通过基于浏览器的用户界面 `SplunkWeb`\
  \ 与 Splunk 进行交互，也可以直接使用命令行界面（`CLI`）。Splunk 非常灵活，可以在 Windows 或几乎任何 Unix 变体上运行。\n\n\
  Splunk 也是一个可用于开发应用程序以处理大数据分析的平台。它拥有一组强大的 API，可与 Python、Java、JavaScript、Ruby、PHP\
  \ 和 C# 结合使用。在 Splunk 之上开发应用程序超出了本书的范围；不过，我们会介绍如何使用一些免费提供的流行应用程序。关于这一点我们就不再赘述，因为本书其余部分都将围绕\
  \ Splunk 展开。\n\n## 关于本书\n\n我们写这本书有几个目标。第一个目标是为你提供足够的知识，让你成为一名 *数据整理专家*，从而能够从数据中提取智慧。第二个目标是让你学会如何使用\
  \ Splunk，这是一款简单但功能极其强大的工具，能让你在所分析的数据中“点击即得黄金”。\n\n本书旨在让你接触来自数字足迹和机器数据的大数据。它从介绍简单的概念开始，然后逐步引入稍微复杂的方法。本书旨在成为一本关于涉及机器数据、社交媒体和挖掘现有数据仓库的大数据分析项目的手册式指南。我们通过真实项目来达成这一目标，这些项目详细回顾了如何收集数据、将其加载到\
