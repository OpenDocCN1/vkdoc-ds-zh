- fmt: '### While Loop


    For this example of the `while` loop, we keep looping asking the user to input
    numbers, and the program will output if the number is even or odd. Again, the
    most important thing to think about when using the `while` loop is the exiting
    or breaking condition, in other words, when the loop will end; otherwise, it is
    an infinite loop and will generate an error. For this example, the exit condition
    is when the user enters zero. The program will display an exit message and branches.


    The loops in Python have a unique feature that is not in other languages, which
    is using `else` with the `while` and `for` loops. In this example, we use the
    `while-else` to display the exit message, as in Listing [5-2](#619569_1_En_5_Chapter.xhtml#PC4).


    ```

    #input the first number from the user before the loop

    input_no = int(input(''Enter your number (0 to exit): ''))

    #check the input value if it equals zero or not; if not, the while loop is #entered

    while input_no != 0:

    #check the remainder after dividing by 2 if it is or zero or not

    if input_no%2==0:

    #if the remainder is zero, the input number is even

    print("your input is even")

    else:

    print("your input is odd")

    #ask the user to enter a new number

    input_no = int(input(''Enter your number (0 to exit): ''))

    else:

    #it keeps looping till the user enters zero. It prints this message and     #exits

    print("Bye and Have a great day!")

    Listing 5-2

    While loop example

    ```


    In Listing [5-2](#619569_1_En_5_Chapter.xhtml#PC4), we start with asking the user
    to enter the first value. The program checks in the `while` condition if it equals
    zero or not. If the input is not equal to zero, it enters the loop and checks
    using the `if`-condition the modulus of the number. If the remainder of the modulus
    equals zero, then it is an even number; otherwise, it is odd.


    If the input number equals zero, it goes to the `else` of the `while` loop. The
    program prints the message and exits. Figure [5-3](#619569_1_En_5_Chapter.xhtml#Fig3)
    shows a sample output of the listing.


    ![](images/619569_1_En_5_Chapter/619569_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    While loop example output


    ### For Loop


    The `for` loop is more common than the `while` loop and is used to loop over containers,
    DataFrames, lines in a file, and more. In this section, we have some examples
    to show the usage of the `for` loop. The first example is the most standard looping
    example of printing a sequence of numbers and printing their sum. The second one
    is for looping over the letters of a word. The third one is looping over a list,
    as one of the containers’ datatype examples. The last example is looping over
    a dataset to replace the null values with zeros.


    #### Looping over a Sequence of Numbers


    Listing [5-3](#619569_1_En_5_Chapter.xhtml#PC5) is to add the odd numbers only
    starting from 1 to 10 and print the sum and the number at every step.


    ```

    #initialize sum with zero

    sum=0

    #for loop from 1-10

    for num in range(1, 10):

    #check if it is an odd number

    if num%2!=0:

    #add the sum to the number

    sum=sum+num

    #print both the number and the new summation

    print(''num='',num)

    print(''sum='',sum)

    Listing 5-3

    Add the odd numbers from 0 to 10

    ```


    The `for` loop in Python has a different syntax than the other programming languages.
    The syntax is as follows:


    ```

    for <variable> in <iterable>:

    ```


    Iterables in Python can be tuples, lists, strings, sequences, and more.


    As in Listing [5-3](#619569_1_En_5_Chapter.xhtml#PC5), we start by initializing
    the variable `sum` with zero. Then, we use the `for` loop with the `range()` function
    to generate a sequence of numbers from 1 to 10. In the loop, we check if the number
