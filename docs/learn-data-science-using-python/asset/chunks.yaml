    ## IF Statement


    The `age` column has a wrong value for one of the voters, where they are 344 years
    old. To correct this, if the dataset data was a real one, we would have had several
    options:


    1.  Obtain the correct age by contacting the Secretary of Maine’s office or the
    voter directly.

    2.  Remove the value and put `NaN` instead of it to indicate that it is missing
    data, as mentioned in Chapter [5](#619569_1_En_5_Chapter.xhtml).

    3.  Delete the entire row containing the incorrect value.

    4.  Leave the value as is, though it would be an outlier and could skew the analysis
    of the relationship between age, party affiliation, and voting predictions.


    In this example, we will make it a missing value, `NaN`. Later in this chapter,
    we will learn how to delete the whole row.


    In Listing [6-5](#619569_1_En_6_Chapter.xhtml#PC5), we start as in the previous
    section by loading the libraries and the dataset, verifying the loading, and computing
    the age column. Then, we loop over the rows using a `for` loop and use the `df.index`
    property to return the maximum number of rows -1 because Python counts from zero.


    We use `if df.loc[x, "age"] > 150` to check if the value in the column `age` at
    index `x` is greater than `150`. We print the row with the wrong age value, then
    replace it with `NaN`, and reprint again using the index location `x` using `df.loc[x]`.


