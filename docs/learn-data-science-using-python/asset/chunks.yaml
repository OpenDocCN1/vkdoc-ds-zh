    in other words, when the loop will end; otherwise, it is an infinite loop and
    will generate an error. For this example, the exit condition is when the user
    enters zero. The program will display an exit message and branches.


    The loops in Python have a unique feature that is not in other languages, which
    is using `else` with the while and for loops. In this example, we use the `while-else`
    to display the exit message, as in Listing [5-2](#619569_1_En_5_Chapter.xhtml#PC4).


