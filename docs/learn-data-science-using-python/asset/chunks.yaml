    Exploring the stock, oil, and gold prices

    ```


    The output will be as in Figures [7-5](#619569_1_En_7_Chapter.xhtml#Fig5), [7-6](#619569_1_En_7_Chapter.xhtml#Fig6),
    [7-7](#619569_1_En_7_Chapter.xhtml#Fig7) and [7-8](#619569_1_En_7_Chapter.xhtml#Fig8).
    The 2008 financial crisis is clear in all the graphs. This crisis is the worst
    economic disaster in the United States since the Great Depression of 1929. The
