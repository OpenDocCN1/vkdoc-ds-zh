    `df.loc[行起始:行结束, ''列起始'':''列结束'']` 对行和列进行切片。我们将在第 6 章中提供更多示例来演示此主题。


    ## Numpy


    Numpy 是“数值 Python”的缩写，是一个用于数值计算的基础 Python 库。它支持数组、矩阵以及对这些数据结构进行操作的高级数学函数。Numpy
    是许多其他数据科学库（包括 Pandas）的支柱。


    我们经常将数据从 Pandas DataFrame 传输到 Numpy 数组。Pandas DataFrame 很有用，因为它们包含列名和其他文本数据，便于人类阅读。然而，对于计算机执行计算而言，Numpy
    数组是最有效的。


    ### 为什么使用 Numpy？


    -   **性能**：Numpy 操作是用 C 语言实现的，这使得它们对于大规模计算来说极其快速和高效。

    -   **易用性**：Numpy 使得使用简单的语法对数组和矩阵执行复杂的数学运算变得容易。

    -   **灵活性**：Numpy 数组可以处理各种数据类型，并且在数值计算方面比 Python 列表更通用。


