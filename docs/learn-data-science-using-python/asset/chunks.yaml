    ## Summary


    This chapter represents the foundation of our journey in learning Python. It starts
    with the installation and Python Cloud Playgrounds and then explains the interface
    and the essential components of a Jupyter Notebook. It also describes the datatypes
    and typecasting.


    Moreover, it explains Pandas and Numpy, which are crucial tools for data manipulation
    and numerical computations in Python. Pandas provide high-level data structures
    and functions for working with structured data, making it easy to analyze and
    visualize data.


    Numpy, on the other hand, offers powerful capabilities for numerical operations
    on arrays and matrices, providing the foundation for efficient scientific computing.
    Together, these libraries form a powerful base for delving into data. In the next
    chapter, we shall dig deeper into the data visualization.


    # 3. Data Visualizations


    There is an adage that says, “A picture is worth a thousand words.” Visualization
    is a tedious and harsh task. Luckily, Python has plenty of batteries that contain
    functions with options to make expressive graphs. This chapter uses big datasets
    that are available in the public domain. We shall follow the data science process
    mentioned in Chapter [1](#619569_1_En_1_Chapter.xhtml), where we start every section
    with a question and seek its answer through a graph.


    This chapter covers various essential charts, such as scatterplots, histograms,
    series plots, bar charts and sorted bar charts, and bubble plots.'
