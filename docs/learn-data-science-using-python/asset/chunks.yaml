    One of the most popular data exercises in healthcare is calculating the time a
    patient passes at a clinic or hospital and, based on historical data, making predictions
    for the patients’ arrival times to decrease the waiting time. In this example,
    Listing [6-2](#619569_1_En_6_Chapter.xhtml#PC2), we make up a dataset with patients’
    ID, age, arrival date, arrival time, leaving date, leaving time, and visit fees.
    Then, we compute the time the patients passed inside the clinic and print a report
    of this duration and the money with dollar sign and commas in the thousands. This
    example aims to learn how Python handles date and time processing and currency
    formatting.


    ```

    import pandas as pd

    import pandas as pd

    from datetime import datetime

    # Sample DataFrame

    data = {

    ''PatientID'': [1, 2, 3],

    ''Age'': [25, 34, 50],

    ''ArrivingDate'': [''2024-06-10'', ''2024-06-11'', ''2024-06-12''],

    ''ArrivingTime'': [''09:00'', ''10:30'', ''14:45''],

    ''LeavingDate'': [''2024-06-10'', ''2024-06-11'', ''2024-06-12''],

    ''LeavingTime'': [''10:00'', ''11:15'', ''15:30''],

    ''VisitFees'': [100.0, 150.75, 200.5]

    }

    df = pd.DataFrame(data)

    print("Datatypes of raw data:")

    print("\n",df.dtypes)

    print("\nHeader of the original dataset:(",len(df.columns),"columns)")

    print("\n",df.head())

    # Convert date and time columns to datetime

    df[''ArrivingDateTime''] = pd.to_datetime(df[''ArrivingDate''] + '' '' + df[''ArrivingTime''])

    df[''LeavingDateTime''] = pd.to_datetime(df[''LeavingDate''] + '' '' + df[''LeavingTime''])

    # Calculate the duration of the visit

    df[''VisitDuration''] = df[''LeavingDateTime''] - df[''ArrivingDateTime'']

    dummy=df[[''VisitDuration'', ''LeavingDateTime'', ''ArrivingDateTime'']]

    print("\nComputing the visit duration:")

    print("\n",dummy.head())

    # Function to format the duration

    def format_duration(duration):

    seconds = duration.total_seconds()

    hours = int(seconds // 3600)

    minutes = int((seconds % 3600) // 60)

    return f"{hours}h {minutes}m"

    # Function to format the fees

    def format_fees(fees):

    return ''${:,.2f}''.format(fees)

    # Print the report

    print("\nClinic Visit Report:")

    # display the DataFrame with formatted columns for reference

    df[''FormattedDuration''] = df[''VisitDuration''].apply(format_duration)

    df[''FormattedFees''] = df[''VisitFees''].apply(format_fees)

    print("\n", df[[''PatientID'', ''Age'', ''FormattedDuration'', ''FormattedFees'']])

    Listing 6-2

    Date and currency formatting

    ```


    Let us explain the code in Listing [6-2](#619569_1_En_6_Chapter.xhtml#PC2). First,
    we create a DataFrame with columns: `PatientID`, `Age`, `ArrivingDate`, `ArrivingTime`,
    `LeavingDate`, `LeavingTime`, and `VisitFees`, and initialize it with dummy values.


    Then, we use the `pd.to_datetime()` method to combine `ArrivingDate` and `ArrivingTime`
    into a single `ArrivingDateTime` column. Similarly, combine `LeavingDate` and
    `LeavingTime` into a `LeavingDateTime` column. To calculate the duration of the
    visit, subtract `ArrivingDateTime` from `LeavingDateTime` to compute the `VisitDuration`.
    We will next write a function to format this `VisitDuration` variable.


    To format the duration, we define a function using the `def` keyword that takes
    the duration as an argument and returns it formatted. The `format_duration(duration)`
    converts the duration into a string format of hours and minutes, as in the output
    in Figure [6-2](#619569_1_En_6_Chapter.xhtml#Fig2).


    Please check the following link to learn more about formatting dates: [`https://www.w3schools.com/python/python_datetime.asp`](https://www.w3schools.com/python/python_datetime.asp).


    About formatting the money currency, we define another function, `format_fees(fees)`,
    to format the fees with a dollar sign and commas using `''${:,.2f}''.format(fees)`,
    where `$` is to set the currency symbol, `:,` is for the thousand’s separator,
    and `.2f` is for the floating-point precision, setting it to two decimal places.
    Here is a link to learn more about currency formatting: [`https://www.geeksforgeeks.org/how-to-format-numbers-as-currency-strings-in-python/`](https://www.geeksforgeeks.org/how-to-format-numbers-as-currency-strings-in-python/).


    Finally, we specify the columns to print the report, as in Figure [6-2](#619569_1_En_6_Chapter.xhtml#Fig2).


