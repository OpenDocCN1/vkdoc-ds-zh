    \ in the previous example.\n\n![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig5_HTML.jpg)\n\
    \nFigure 3-5\n\nThe direction, intensity, and linearity of the scatterplot\n\n\
    If the interdependency is linear, look at its direction to know if it is positive\
    \ or negative. In Figure [3-5](#619569_1_En_3_Chapter.xhtml#Fig5), up-left, X1-Y1,\
    \ the relationship is positive, while the plot up-right, X2-Y2, is a negative\
    \ relationship. In Figure [3-8](#619569_1_En_3_Chapter.xhtml#Fig8), down-right,\
    \ X3-Y3, there is no direction because the relationship is not linear but curvilinear.\
    \ In Figure [3-5](#619569_1_En_3_Chapter.xhtml#Fig5), down left, X4-Y4, there\
    \ is no relationship as the points are scattered irregularly.\n\nFinally, describe\
    \ the strength of the relationship. If the points are so close to the line/form,\
    \ then there is high interdependency, and the relationship is strong. Otherwise,\
    \ it is a weak relationship."
  trans: "\n# 散点图\n\n散点图用于通过描述散点的方向、强度和线性关系来展示变量之间的相互依赖性。此外，它们还能轻松显示异常值。\n\n在本例中，我们的问题是：西雅图市的薪资是否与员工的年龄范围有关，还是两者之间没有关系？\n\
    \n你可以在数据集文件夹中找到数据文件，或者通过以下链接从 Data.Gov 项目下载 CSV 文件：[`https://web.archive.org/web/20170116035611/http://catalog.data.gov/dataset/city-of-seattle-wages-comparison-by-gender-average-hourly-wage-by-age-353b2`](https://web.archive.org/web/20170116035611/http://catalog.data.gov/dataset/city-of-seattle-wages-comparison-by-gender-average-hourly-wage-by-age-353b2)。\n\
    \n数据集位于数据集文件夹中，文件名为：`City_of_Seattle_Wages__Comparison_by_Gender_-_Average_Hourly_Wage_by_Age.csv`。完整代码位于示例代码文件夹中的\
    \ `Chapter 3.ipynb` 的清单 3-1 中。不过，在 Jupyter Notebook 中，代码将按照以下步骤划分到不同的单元格中。\n\n\
    有多种库可用于可视化。在本例中，我们使用 Matplotlib。步骤如下：\n\n1. 加载库。\n2. 加载数据并探索数据。\n3. 创建散点图。\n4.\
    \ 通过以下方式增强图表：\n   1. 移除一些不需要的值\n   2. 添加标题\n   3. 调整图表大小\n   4. 为 x 轴和 y 轴添加标签\n\
    \n```\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport numpy as np\n\
    清单 3-1-1\n导入所需的库\n```\n\n在清单 3-1-1 中，我们导入了所需的库。我们从将 `Pandas` 模块导入为 `pd` 开始。`Pandas`\
    \ 是 Python 如此流行的原因之一。它通过加载数据、以人类可读的表格形式查看数据以及进行大量计算，帮助读取和操作数据。数据表被称为 `DataFrame`，其简写约定为\
    \ `df`。`Pandas` DataFrame 具有列名和其他文本数据，使其对用户友好。\n\n然后，我们加载 `matplotlib.pyplot`\
    \ 库，其中包含所有可视化函数。通常将其简称为 `plt`。\n\n最后加载的库是 `numpy`，这是一个用于操作数值数据列表和表格的 Python 包。计算机发现以\
    \ numpy 数组形式进行统计计算更容易且更快。然而，它们对人类不太友好。因此，我们经常将数据从 `Pandas` DataFrame 转换为 `Numpy`\
    \ 数组。\n\n注意\n\n在本书的示例中，我们将频繁使用这三个库：Pandas、Matplotlib 和 Numpy。\n\n```\ndf=pd.read_csv('../Datasets/Chapter\
    \ 3/City_of_Seattle_Wages__Comparison_by_Gender_-_Average_Hourly_Wage_by_Age.csv')\n\
    print(df.head())\n清单 3-1-2\n加载数据集并探索数据\n```\n\n在清单 3-1-2 中，我们将数据导入 Pandas，以便将其视为\
    \ DataFrame。`read_csv()` 函数接受一个 csv 格式的文件，并将其转换为一个名为 `df` 的 Pandas DataFrame。然后，`head`\
    \ 方法返回 DataFrame 的前五行。\n\n`head` 方法的输出如图 3-1 所示。\n\n![](img/619569_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1\n\n`df.head()` 方法的输出\n\n从图 3-1 中，我们发现除了 `AGE RANGE` 列之外，所有八列都是数值型的。`AGE\
    \ RANGE` 列是 `string` 数据类型。\n\n让我们通过使用 `describe()` 方法进一步探索数据集。它会返回数据集的汇总统计报告，如清单\
    \ 3-1-3 所示。\n\n![](img/619569_1_En_3_Fig2_HTML.jpg)\n\n图 3-2\n\n图 3-2 显示了 `describe()`\
    \ 方法的输出\n\n```\nprint(df.describe())\n清单 3-1-3\ndescribe 方法计算汇总统计量\n```\n\n图 3-2\
    \ 显示了每列的一些统计量。请注意，它只给出数值列的统计量。以下是统计量的定义：\n\n* Count：非缺失行的数量。\n* Mean：平均值。\n* Std：标准差的缩写。这是衡量数据离散程度的指标。\n\
    * Min：最小值。\n* 25%：第 25 百分位数。\n* 50%：第 50 百分位数，也称为中位数。\n* 75%：第 75 百分位数。\n* Max：最大值。\n\
    \n我们使用 Pandas 的 `describe()` 方法来开始建立对数据的一些直觉。\n\n```\nplt.figure(figsize=(12,\
    \ 6))\nplt.scatter(df['AGE RANGE'], df['Total Average of HOURLY RATE'])\nplt.xlabel('AGE\
    \ RANGE')\nplt.ylabel('Total Average of HOURLY RATE')\n清单 3-1-4\n初始散点图\n```\n\n\
    为了避免图表相互重叠，我们使用 `figure` 方法，并在其中设置图表的尺寸，如清单 3-1-4 所示。然后，我们使用 `scatter` 方法，并将要绘制的两个变量传递给它。为了增强图表效果，我们使用\
    \ `xlabel` 和 `ylabel` 方法设置 x 轴和 y 轴的标签。\n\n![](img/619569_1_En_3_Fig3_HTML.jpg)\n\
    \n图 3-3\n\n散点图的输出\n\n在图 3-3 中，最后两个 `AGE RANGE` 值是不需要的，并且会给出关于两个变量之间关系的错误印象。因此，我们应该将它们从数据中过滤掉，如清单\
    \ 3-1-5 所示。\n\n```\nplt.figure(figsize=(12, 6))\ndf1=df['AGE RANGE']\ndf2=df['Total\
    \ Average of HOURLY RATE']\nplt.scatter(df1[:-2],df2[:-2] )\nplt.xlabel('AGE RANGE')\n\
    plt.ylabel('Total Average of HOURLY RATE')\nplt.title('年龄范围与总平均小时工资之间的相互依赖性')\n\
    清单 3-1-5\n过滤 AGE RANGE 中的最后两个值\n```\n\n从图 3-4 的最终散点图中，我们可以确定西雅图的 `AGE RANGE` 与\
    \ `Total Average of HOURLY RATE` 之间存在相互依赖性。这种关系不是线性的，而是曲线性的。\n\n![](img/619569_1_En_3_Fig4_HTML.jpg)\n\
    \n图 3-4\n\n最终的散点图\n\n## 散点图关系\n\n图 3-5 展示了散点图关系的不同示例。要描述散点图，你应该说明它是线性关系还是曲线关系，正如我们在上一个示例中看到的那样。\n\
    \n![](img/619569_1_En_3_Fig5_HTML.jpg)\n\n图 3-5\n\n散点图的方向、强度和线性度\n\n如果相互依赖性是线性的，则观察其方向以判断是正相关还是负相关。在图\
    \ 3-5 中，左上角 X1-Y1 的关系是正相关，而右上角 X2-Y2 的图是负相关。在图 3-8 中，右下角 X3-Y3 没有方向，因为关系不是线性的，而是曲线性的。在图\
    \ 3-5 中，左下角 X4-Y4 没有关系，因为点不规则地分散。\n\n最后，描述关系的强度。如果点非常接近线/形状，则存在高度相互依赖性，关系很强。否则，关系很弱。\n"
- fmt: '### Plotting More Than One Scatterplot in the Same Image


    We plot more than one scatterplot in the same image to compare values. For this
    example, we have the number of registered voters in every party and will plot
    them to compare which party has more registered voters in each of Maine’s counties.


    The dataset `MAINECOUNTIESPARTIES.xlsx` in the Datasets Folder has three columns:
    the counties and the registered voters per party, as in Table [3-1](#619569_1_En_3_Chapter.xhtml#Tab1).


    **Table 3-1** Maine Registered Voters for Political Parties in Every County


    | Counties | Republican | Democratic |

    | --- | --- | --- |

    | Androscoggin | 28189 | 22975 |

    | Aroostook | 19419 | 13377 |

    | Cumberland | 57697 | 102935 |

    | Franklin | 7900 | 7001 |

    | Hancock | 13682 | 16107 |

    | Kennebec | 29296 | 31753 |

    | Knox | 9148 | 12440 |

    | Lincoln | 9727 | 10241 |

    | Oxford | 12172 | 16214 |

    | Penobscot | 41601 | 32832 |

    | Piscataquis | 5403 | 3098 |

    | Sagadahoc | 9304 | 10679 |

    | Somerset | 14998 | 9092 |

    | Waldo | 10378 | 10442 |

    | Washington | 9037 | 6358 |

    | York | 50388 | 55828 |


    As always, we read the dataset and explore it to verify that it has been read
    correctly using the `head()` method, as in Listing [3-2-1](#619569_1_En_3_Chapter.xhtml#PC6).


    ```

    df=pd.read_excel(''../Datasets/Chapter 3/MAINECOUNTIESPARTIES.xlsx'')

    print(df.head())

    Listing 3-2-1

    Reading and exploring the dataset

    ```


    The output is as in Figure [3-6](#619569_1_En_3_Chapter.xhtml#Fig6) showing the
    first five rows of the dataset.


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig6_HTML.jpg)


    **Figure 3-6** Output of the `head()` method


    The code plots two overlapped scatterplots where both have `counties` on their
    x axis, while the y axis in the first scatterplot is the number of the Democrats,
    and in the second one is the number of the Republicans. To change the colors to
    distinguish between each one of them, we set the color option, as in Listing [3-2-2](#619569_1_En_3_Chapter.xhtml#PC7),
    using `c=[''r'']`. Moreover, we change the marker of the Republican Party points
    only to distinguish between the points even in grayscale using marker option to
    make it as a triangle using `marker=''^''` option to the scatter function. We
    changed the label of the y axis to "Republican:Red Triangles Democrat:Blue Circles."
    Finally, we set the title of the plot.


    ```

    plt.figure(figsize=(18, 6))

    plt.scatter(df[''counties''],df[''Democratic''], c=[''b''])

    plt.scatter(df[''counties''],df[''Republican''] , marker=''^'',c=[''r''])

    plt.xlabel(''counties'')

    plt.ylabel(''Republican:Red Triangles Democrat:Blue Circles'')

    plt.title(''Maine Counties and Parties'')

    Listing 3-2-2

    Comparing the Republican registered voters to the Democratic ones in Maine’s counties

    ```


    The output of the above code is as in Figure [3-7](#619569_1_En_3_Chapter.xhtml#Fig7).


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig7_HTML.jpg)


    **Figure 3-7** Scatterplot of Maine counties and parties


    From Figure [3-7](#619569_1_En_3_Chapter.xhtml#Fig7), we can say that Cumberland
    County has the highest Democratic voters and the highest registered voters in
    general. It might imply that it has the highest population as well, but we cannot
    ensure that and will need further verification. However, we are sure that the
    difference between the Democrats and Republicans is enormous there. Other than
    this county, Democrats are more than the Republicans in 8 of the remaining 15
    counties with trivial differences. Hence, Democrats must give more care to Maine,
    so it does not turn back to red.


    Moreover, if the Democratic party plans to do a rally in Maine, it should do it
    in Cumberland. On the other hand, the Republic party should do it in Penobscot.


    Similarly, you can do the same exercise with your state and get ready for the
    2024 Presidential Elections with your analysis and predictions.


    ## Histogram


    The histogram task creates a chart that displays the frequency distribution of
    a numeric variable. For this example, we shall see how annual wages of employees
    are being distributed in March 2018 at the City of Charlotte, North Carolina.


    You will find the data file in the Datasets Folder, or you can download the CSV
    file from the following link: [https://data.amerigeoss.org/dataset/city-employee-salaries-march-2018/resource/264fa25e-93cb-46b8-8edd-24ad224f3b74?view_id=4c9ee967-a039-4d72-ad78-2f556909b207](https://data.amerigeoss.org/dataset/city-employee-salaries-march-2018/resource/264fa25e-93cb-46b8-8edd-24ad224f3b74%253Fview_id%253D4c9ee967-%2560a039-4d72-ad78-2f556909b207).


    As always, load the CSV file to a DataFrame using the Pandas `read_csv()` method.
    Then, explore it using the `head()` method to verify that it has been read correctly,
    as in Listing [3-3-1](#619569_1_En_3_Chapter.xhtml#PC8).


    ```

    df=pd.read_csv(''../Datasets/Chapter 3/City_Employee_Salaries_March_2018.csv'')

    print(df.head())

    Listing 3-3-1

    Reading and exploring the dataset

    ```


    The output is as in Figure [3-8](#619569_1_En_3_Chapter.xhtml#Fig8) showing the
    first five rows of the dataset. We have nine columns. However, we are interested
    in one column only, `Annual_Rt`, to plot our histogram.


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig8_HTML.jpg)


    **Figure 3-8** Output of the `head()` method


    In Listing [3-3-2](#619569_1_En_3_Chapter.xhtml#PC9), we again start by using
    the `.figure()` method to draw the histogram in a new plot and do not override
    the histogram over the scatterplots of the previous section. Also, we set the
    plot dimension using the `figsize` in the `.figure()` method. Then, we select
    the `Annual_RT` as the variable in the `.hist()` method. Finally, we label the
    x axis and set the plot title.


    ```

    plt.figure(figsize=(18, 10))

    plt.hist(df[''Annual_Rt''])

    plt.xlabel(''Annual_Rt'')

    plt.title(''The Distribution of The Annual Rate of Charlotte City Employees'')

    Listing 3-3-2

    Select the analysis variable to plot its histogram

    ```


    Figure [3-9](#619569_1_En_3_Chapter.xhtml#Fig9) shows the histogram plot. However,
    we need to enhance the appearance of this plot. It is a right skewed curve, and
    there are some clear outliers. Also, we can resize the bins to have a more normally
    distributed curve. The last step will be adding a normally distributed curve over
    the histogram. We shall do all these steps in Listing [3-3-3](#619569_1_En_3_Chapter.xhtml#PC10).


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig9_HTML.jpg)


    **Figure 3-9** Histogram of Charlotte City employees


    Listing [3-3-3](#619569_1_En_3_Chapter.xhtml#PC10) starts with importing the `norm`
    from `spicy.stats`. This library is for plotting the normal distribution curve;
    it has functions for working with normal (Gaussian) distributions.


    Then, we generate an array of values for the x axis ranging from `0` to `14000`
    with step=`1`. We set the maximum annual salary rate to `140000` and will ignore
    any value larger than that by setting a mask over the `Annual_RT` series.


    Afterward, we plot the histogram using the new masked series, change the bins
    to `10`, and normalize the histogram to draw the density and return a probability
    density. Next is plotting the normal distribution with mean and standard deviation
    calculated from the data. The final changes are giving a label to the x axis,
    setting the title, setting the legend, and showing all that.'
