    Arithmetic operators indicate that an arithmetic calculation is performed, as
    shown in Table [5-1](#619569_1_En_5_Chapter.xhtml#Tab1).


    Table 5-1


    Arithmetic and Assignment Operators


    | Operator | Meaning | Example | Result |

    | --- | --- | --- | --- |

    | + | Addition | 2 + 3 | 5 |

    | += |   | X = 5X += 15 | X=20 |

    | - | Subtraction | 5 – 3 | 2 |

    | -= |   | X = 5X -= 15 | X=-10 |

    | / | Division | 5 / 2 | 2.5 |

    | /= |   | X = 15X /= 5 | X=3.0 |

    | // | Quotient | 5 // 2 | 2 |

    | % | Remainder | 5 % 2 | 1 |

    | * | Multiplication | 2 * 3 | 6 |

    |      *= |   | X = 15X *= 5 | X=75 |

    | ** | Exponentiation | 2 ** 3 | 8 |


    If a missing value is an operand for an arithmetic operator, the result is a missing
    value. To avoid propagating missing values, we discuss some of the methods of
    how to represent and handle the missing values in your dataset later in this chapter
    and in the next one.


    ### Python Operator Precedence Rule: PEMDAS


    *   P: Parentheses


    *   E: Exponentiation


    *   M: Multiplication


    *   D: Division


    *   A: Addition


    *   S: Subtraction


    You can remember it with the popular order of operators’ statement: “Please Excuse
    My Dear Aunt Sally.”


    ## Comparison Operators


    Comparison operators set up a comparison, operation, or calculation with two variables,
    constants, or expressions. If the comparison is true, the result is `True`. If
    the comparison is false, the result is `False`. Comparison operators can be expressed
    as in Table [5-2](#619569_1_En_5_Chapter.xhtml#Tab2).


    Table 5-2


    Comparison Operators


    | Operator | Meaning | Example | Result |

    | --- | --- | --- | --- |

    | == | Equality | print(2 == 3) | False |

    | != | Inequality | print(2 != 3) | True |

    | < | Less than | print(2 < 3) | True |

    | <= | Less than or equal | print(2 <= 3) | True |

    | > | Greater than | print(2 > 3) | False |

    | >= | Greater than or equal | print(2>=3) | False |

    | in | Membership | x=2     print(x in (2,3,5)) | True |


    ## Logical, Membership, and Identity Operators


    Logical operators are used to show the relationship between two conditions or
    expressions, determining whether they are both true, at least one is true, or
    the condition should be reversed. Table [5-3](#619569_1_En_5_Chapter.xhtml#Tab3)
    shows the three types of operators: logical, membership, and identity ones.


    Membership operators are used to check if a value is part of a collection or sequence,
    like a list or string.


    Identity operators are used to determine if two variables are actually the same
    object in memory, not just equivalent in value.


    Table 5-3


    Logical, Membership, and Identity Operators


    | **Operator** | **Meaning** | **Example** | **Result** |

    | --- | --- | --- | --- |

    | and | Returns True if both statements are true | x=5x < 5 and x < 10 | False
    |

    | or | Returns True if one of the statements is true | x=5x < 5 or x < 4 | False
    |

    | not | Reverses the result, returns False if the result is true | x=5not(x <
    5 and x < 10) | True |

    | in | Returns True if a sequence with the specified value is present in the object
    | y=[‘bus’,’car’,’walk’]x=’car’x in y | True |

    | not in | Returns True if a sequence with the specified value is not present
    in the object | y=[‘bus’,’car’,’walk’]x=’car’x not in y | False |

    | is | Returns True if both variables are the same object | x=[‘bus’,’car’,’walk’]y=[‘bus’,’car’,’walk’]print(x
    is y)print(x==y) | FalseTrue |

    | is not | Returns True if both variables are not the same object | x=[‘bus’,’car’,’walk’]y=[‘bus’,’car’,’walk’]x
    is not y | True |


    The order of operations in Python is as follows: parentheses, exponentiation,
    unary plus, unary minus, multiplication, division, floor division, and modulus,
    addition and subtraction, comparisons, identity, and membership operators, logical
    NOT, AND, OR.


