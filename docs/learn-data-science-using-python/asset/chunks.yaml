- fmt: 'However, the model fitting function requires a two-dimensional array. So,
    we use the `reshape(-1,1)` method to do so. The syntax of the `reshape` function
    is `reshape(number of rows, number of columns)`. To include all the rows without
    specifying a certain value, we use `-1`. Since this is a simple linear regression
    which means that we have one independent variable, we have `1` as the number of
    columns.


    For the target variable, `y`, we again change its type from `DataFrame` to `Numpy`
    by using the `.values` property.


    Now, our variables are ready to be fitted into the model. We first create an object
    of `LinearRegression` class using `LR = LinearRegression()`; then, we fit the
    variables using `LR.fit(x, y)`.


    From our model properties, we can get the parameter estimates and write the equation.
    We use them in plotting the line over the scatterplot of the two variables.


    ![](images/619569_1_En_7_Chapter/619569_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    Output of Listing [7-1-2](#619569_1_En_7_Chapter.xhtml#PC4)


    Figure [7-2](#619569_1_En_7_Chapter.xhtml#Fig2) shows that there is a linear relationship
    between oil and gold prices. The `slope of the line = 0.05965`. From the parameter
    estimate, the equation of the line is:


    ```

    oil_price = 1.98831 + 0.05965 gold_prices

    ```


    The plot consists of a scatterplot of data with the regression line overlaid over
    the scatterplot.


    ### 3. Test Model and Compute Predictions and Accuracy Score


    Finally, we evaluate the model using R-squared, mean squared error, and root mean
    squared error.


    ```

    #Listing 7-1-3

    #Test Model:

    y_prediction =  LR.predict(x)

    print(''y_prediction='',y_prediction)

    # predicting the accuracy score

    score=r2_score(y,y_prediction)

    print(''r2 socre = '',score)

    print(''mean_sqrd_error ='',mean_squared_error(y,y_prediction))

    print(''root_mean_squared error ='',np.sqrt(mean_squared_error(y,y_prediction)))

    Listing 7-1-3

    Test the model, and compute the predictions and accuracy score.

    ```


    In Listing [7-1-3](#619569_1_En_7_Chapter.xhtml#PC6), we computed the `y_prediction`
    values to calculate the accuracy of our model, which was implemented by the `r2_score`.
    It is a function inside `sklearn.metrics` module, where the value of `r2_score`
    varies between 0 and 100%.


    Also, we compute the mean squared error (MSE), the estimator that measures the
    average of the squares of errors.


    ![](images/619569_1_En_7_Chapter/619569_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Output of Listing [7-1-3](#619569_1_En_7_Chapter.xhtml#PC6)


    Figure [7-3](#619569_1_En_7_Chapter.xhtml#Fig3) shows the output of Listing [7-1-3](#619569_1_En_7_Chapter.xhtml#PC6).


    ### 4. Fit Diagnostics


    In Listing [7-1-4](#619569_1_En_7_Chapter.xhtml#PC7), we create diagnostic plots
    to assess the model''s performance. In this code:


    *   R-Student vs. Predicted: This plot helps identify influential observations
    that may be driving the residuals.

    *   R-Student vs. Leverage: This plot helps identify observations with high leverage,
    which can disproportionately affect the model.

    *   Cook''s D vs. Observation: This plot helps identify influential observations
    that may have a large impact on the model parameters.


    This part of the code uses `statsmodels` to fit an OLS model, and then, it extracts
    influence statistics such as R-Student, leverage, and Cook''s D. The final part
    of the code creates diagnostic plots for R-Student vs. Predicted, R-Student vs.
    Leverage, and Cook''s D vs. Observation using `seaborn`.


    ```

    #Listing 7-1-4

    plt.figure(3)

    # Plot diagnostic plots

    plt.figure(figsize=(12, 5))

    residuals = y - y_prediction

    # Scatter plot of predicted vs. actual values

    plt.subplot(1, 2, 1)

    sns.scatterplot(x=y, y=y_prediction)

    plt.title(''Predicted vs. Actual Values'')

    # Residuals vs. Fitted Values plot

    plt.subplot(1, 2, 2)

    sns.scatterplot(x=LR.predict(x), y=residuals)

    plt.axhline(y=0, color=''r'', linestyle=''--'')

    plt.title(''Residuals vs. Fitted Values'')

    plt.tight_layout()

    plt.show()                # Finalize and render the figure

    # Use statsmodels to perform OLS and access influence statistics

    X_ols = sm.add_constant(x)

    ols_model = sm.OLS(y, X_ols).fit()

    # Access influence statistics

    influence = ols_model.get_influence()

    r_student = influence.resid_studentized_internal

    leverage = influence.hat_matrix_diag

    cook_d = influence.cooks_distance

    # Remove missing values

    mask = ~np.isnan(r_student) & ~np.isnan(leverage)

    r_student = r_student[mask]

    leverage = leverage[mask]

    # Plot R-Student vs Predicted

    plt.figure(figsize=(12, 4))

    plt.subplot(1, 3, 1)

    sns.scatterplot(x=LR.predict(x), y=r_student)

    plt.axhline(y=0, color=''r'', linestyle=''--'')

    plt.title(''R-Student vs Predicted'')

    # Plot R-Student vs Leverage

    plt.subplot(1, 3, 2)

    sns.scatterplot(x=leverage, y=r_student)

    plt.axhline(y=0, color=''r'', linestyle=''--'')

    plt.title(''R-Student vs Leverage'')

    # Plot Cook''s D vs Observation

    plt.subplot(1, 3, 3)

    #print(len(df.index),len(cook_d))

    sns.scatterplot(x=df.index, y=cook_d[0])

    plt.xlim(0, 16)  # Set y-axis limits to have values above and below zero

    # Set x-axis ticks to increment by 1

    plt.xticks(np.arange(min(df.index), 15, 1))

    plt.axhline(y=0, color=''r'', linestyle=''--'')

    plt.title("Cook''s D vs Observation")

    plt.tight_layout()

    plt.show()

    Listing 7-1-4

    Fit diagnostics plots

    ```


    These plots are based on statistical diagnostics and can provide insights into
    the influence of individual observations on the model. Adjust the code as needed
    for your specific analysis and requirements. Let us look at the output and explain
    them.


    ![](images/619569_1_En_7_Chapter/619569_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Output of the fit diagnostics plots


    Figure [7-4](#619569_1_En_7_Chapter.xhtml#Fig4) shows the fit diagnostics for
    `oil_price`. The Dependent Variable (task) vs. the Predicted Value plot visualizes
    variability in the prediction. In this plot, the dots are random, and there is
    not a pattern that indicates a constant variance of the error. The outliers are
    clear in this plot.


    Residual vs. Fitted shows a random pattern of dots above and below the 0 line,
    which indicates an adequate model. Again, the three outliers are clear here.


    The R-Student vs. Predicted Value plot shows a couple of outside the ±2 limits.
    A third dot lies in between them but is far away from the rest of the dots.


    The R-Student vs. Leverage plot shows the outliers which have leverage on the
    calculation of the regression coefficients.


    The Cook''s D plot is designed to identify outliers. Here, the three points are
    so clear with their values. They are at Rows 12, 13, and 14. We shall explore
    these outliers and the reason behind them in the next section.


    These diagnostic plots help assess the assumptions and performance of the linear
    regression model. They include checking for linearity, homoscedasticity (constant
    variance of residuals), and influential observations. The plots can provide insights
    into the model''s behavior and identify potential issues that might require further
    investigation or model refinement.'
