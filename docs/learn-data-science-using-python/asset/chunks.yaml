- fmt: "### One-Sample T-Test\n\nIn this example, I gathered all the voting data from\
    \ past presidential elections in Maine for candidates representing both major\
    \ political parties across various years. This dataset served as the basis for\
    \ predicting the election outcomes in Maine for both the 2016 and 2020 elections.\n\
    \nThe dataset, `MaineVotesDR.xlsx`, comprises four columns: `Election Year`, `Democratic\
    \ Votes`, `Republican Votes`, and `Result`. The `Result` column records a binary\
    \ outcome: `0` signifies victory for the Republican candidate, while `1` indicates\
    \ success for the Democratic candidate.\n\nOur hypothesis is that the Republican\
    \ candidate will be victorious in the 2020 presidential elections in Maine, while\
    \ the alternative hypothesis suggests the victory of the Democratic candidate.\n\
    \nNull hypothesis (H0): `result = 0`  \nAlternative hypothesis (Ha): `result =\
    \ 1`\n\nNow, let us load the dataset and explore how the T-test can shed light\
    \ on the outcomes of the 2020 election, as shown in Listing [4-5](#619569_1_En_4_Chapter.xhtml#PC5).\n\
    \n```\nimport pandas as pd\nfrom scipy import stats\nmaine_votes_df = pd.read_excel('../Datasets/Chapter\
    \ 4/MaineVotesDR.xlsx')\n# Test for normality\nnormality_test = stats.shapiro(maine_votes_df['Result'])\n\
    print(\"Normality Test:\")\nprint(normality_test)\n# t-test\nt_stat, p_value =\
    \ stats.ttest_1samp(maine_votes_df['Result'], 0)\nprint(\"\\nT-test:\")\nprint(\"\
    T-statistic:\", t_stat)\nprint(\"P-value:\", p_value)\nListing 4-5\nOne-sample\
    \ T-test\n```\n\nIn Listing [4-5](#619569_1_En_4_Chapter.xhtml#PC5), we use `stats.shapiro()`\
    \ to perform the normality test on the `Result` column of the DataFrame. It is\
    \ appropriate for smaller sample sizes. The results will give a test statistic\
    \ and a p-value to determine if the data deviates significantly from normality.\
    \ If the dataset is larger than 20 rows, the `stats.normaltest()` function can\
    \ be used. Then, we use `stats.ttest_1samp()` to perform the one-sample t-test\
    \ on the `Result` column with the null hypothesis (h0) being 0. We print the results\
    \ of both tests. The output is as in Figure [4-9](#619569_1_En_4_Chapter.xhtml#Fig9).\n\
    \n![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig9_HTML.jpg)\n\nFigure 4-9\
    \  \nT-test results: prediction for 2020 presidential elections in Maine\n\nThe\
    \ p-value = 0.0004. Since the p-value is less than 0.05, we can reject the null\
    \ hypothesis. Hence, we can conclude that the Republican candidate will lose in\
    \ Maine in the 2020 election. He did lose Maine.\n\n### Two-Sample T-Test\n\n\
    In this example, the question is: Is there a significant difference in height\
    \ between the two genders?\n\nThe null hypothesis is that there is no difference\
    \ in height. The alternate hypothesis is that there is a difference in height\
    \ based on gender.\n\nIn this example, load the CLASS dataset, as in Listing [4-6-1](#619569_1_En_4_Chapter.xhtml#PC6).\n\
    \n```\nimport pandas as pd\nimport numpy as np\nfrom scipy import stats\nimport\
    \ seaborn as sns\nimport matplotlib.pyplot as plt\n#https://www.kaggle.com/datasets/megasatish/class-data\n\
    class_df = pd.read_csv('../Datasets/Chapter 4/Class.csv')\n# Test for normality\
    \ by Gender\nprint(\"Normality Test by Gender:\")\nfor Gender in class_df['Gender'].unique():\n\
    \    stat, p_value = stats.shapiro(class_df[class_df['Gender'] == Gender]['Height'])\n\
    \    print(f\"Gender: {Gender}, Statistic: {stat:.2f}, p-value: {p_value:.4f}\"\
    )\n# t-test by Gender\n# comparing males to females\nmale_heights = class_df[class_df['Gender']\
    \ == 'M']['Height']\nfemale_heights = class_df[class_df['Gender'] == 'F']['Height']\n\
    t_stat, p_value = stats.ttest_ind(male_heights, female_heights)\nprint(f\"\\nT-test\
    \ between male and female Heights:\")\nprint(f\"T-statistic: {t_stat:.2f}, p-value:\
    \ {p_value:.4f}\")\nListing 4-6-1\nTwo-sample T-test\n```\n\nIn Listing [4-6-1](#619569_1_En_4_Chapter.xhtml#PC6),\
    \ after importing the required libraries and loading the dataset, we test for\
    \ the normality of heights within each gender group using the `.shapiro()` method\
    \ as in the previous listing from `scipy.stats`. Then, we loop through unique\
    \ gender values (`M` and `F`) to perform the normality test on the heights for\
    \ each gender. And we print the test statistic and p-value for each gender, as\
    \ Figure [4-10](#619569_1_En_4_Chapter.xhtml#Fig10).\n\n![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig10_HTML.jpg)\n\
    \nFigure 4-10  \nNormality test by gender\n\nFrom Figure [4-10](#619569_1_En_4_Chapter.xhtml#Fig10),\
    \ we cannot reject the null hypothesis as there is not enough evidence for that;\
    \ the p-value is 0.1645, which is larger than 0.05. We can conclude that there\
    \ is no difference in height between the two genders. However, we must note that\
    \ the sample is small. The CLASS dataset contains only 19 rows.\n\nTo understand\
    \ the data distribution more, let us visualize the height of each gender using\
    \ box and line plots. As in Listing [4-6-2](#619569_1_En_4_Chapter.xhtml#PC7).\n\
    \n```\n# Visualizing the Height distribution by Gender\nsns.boxplot(x='Gender',\
    \ y='Height', data=class_df)\nplt.title('Height Distribution by Gender')\nplt.show()\n\
    # For t-test plots, let us use seaborn to show the distribution of heights by\
    \ Gender,\n# highlighting the means and confidence intervals\nsns.catplot(x='Gender',\
    \ y='Height', kind=\"point\", data=class_df, join=False, capsize=.1)\nplt.title('Point\
    \ Plot Showing Height Means by Gender')\nplt.show()\nListing 4-6-2\nVisualizing\
    \ the height of each gender\n```\n\nIn Listing [4-6-2](#619569_1_En_4_Chapter.xhtml#PC7),\
    \ we use the `sns.boxplot()` method to plot the height distribution of each gender.\
    \ As in Figure [4-11](#619569_1_En_4_Chapter.xhtml#Fig11), the box plot shows\
    \ that there is a small difference in the medians of the two groups, almost negligible.\
    \ Also, there is a small difference between the means of the two groups, as shown\
    \ in the line plot.\n\n![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig11_HTML.jpg)\n\
    \nFigure 4-11  \nBox plot and line plot for the height distribution by Gender\n\
    \n## Summary\n\nThis chapter explains the most crucial statistical concepts that\
    \ will be needed for almost all analytics and data science reports. They are the\
    \ frequency tables, summary statistics, correlation analysis, and T-tests. In\
    \ the next chapter, we shall learn the operators and loops.\n\n# 5. Data Preprocessing\
    \ and Feature Engineering\n\nThis chapter shows some essential data cleaning and\
    \ querying methods, such as comment statement, arithmetic, and comparison operators,\
    \ and how to represent missing values and loops.\n\n## Comment Statement\n\nIt\
