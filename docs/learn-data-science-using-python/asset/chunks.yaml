    ## Series Plot


    The series plot displays the values against time. In this example, let us plot
    stock trends of prices over time.


    In this exercise, we do not have a dataset to load. Rather, we will use the Yahoo
    Finance library, `yfinance`, to load the stocks data of any company. First, as
    in Listing [3-4-1](#619569_1_En_3_Chapter.xhtml#PC11), we will load Apple Inc.
    stocks’ historical data. Then, in Listing [3-4-2](#619569_1_En_3_Chapter.xhtml#PC12),
    we will load multiple companies and plot them vs. each other to compare values.
    The companies are Apple (AAPL), Intel (INTC), Microsoft (MSFT), and ASML Holding
    (ASML).


    ```python

    # This library is used to fetch financial data, including historical stock #prices

    import yfinance as yf

    #matplotlib is used for creating plots and visualizations

    import matplotlib.pyplot as plt

    # Define the stock symbol and time range

    stock_symbol = "AAPL"  # Example: Apple Inc.

    start_date = "2022-01-01"

    end_date = "2023-01-01"

    # Download historical stock data

    stock_data = yf.download(stock_symbol, start=start_date, end=end_date)

    # Plot the closing prices over time

    plt.figure(figsize=(15, 8))

    plt.plot(stock_data[''Close''], label=f"{stock_symbol} Closing Prices", color=''blue'')

    plt.title(f"{stock_symbol} Closing Prices Over Time")

    plt.xlabel("Date")

    plt.ylabel("Closing Price")

    plt.legend()

    plt.grid(True)

    plt.show()

    Listing 3-4-1

    Series plot to show Apple Inc. closing prices over time

    ```


    Now, let us explain the Listing [3-4-1](#619569_1_En_3_Chapter.xhtml#PC11) code
    line by line. As we mentioned, start by loading the required libraries. Then,
    we set the stock symbol of the company and the start and the end dates. We feed
    that to the `yf.download()` method to download the historical data for the specified
    stock symbols. Then, we use the `plt.plot()` method to plot the series plot by
    setting the color. Finally, as usual, we set the plot title and the labels of
    the x and y axes, show grid, and display the plot with all these settings. The
    output is as in Figure [3-11](#619569_1_En_3_Chapter.xhtml#Fig11).


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Series plot output


    We can add more companies’ stocks by adding their symbols as a list in the stock
    symbol, as follows: `stock_symbols = ["AAPL", "INTC", "MSFT", "ASML"]`, as in
    Listing [3-4-2](#619569_1_En_3_Chapter.xhtml#PC12).


    Moreover, in Listing [3-4-2](#619569_1_En_3_Chapter.xhtml#PC12), we loop over
    the companies’ list, `stock_symbols`, to draw their series plots in one figure.


    ```python

    # yfinance is used to fetch financial data, including historical stock #prices

    import yfinance as yf

    #matplotlib.pyplot used for creating plots and visualizations

    import matplotlib.pyplot as plt

    #stock_symbols are a list containing the stock symbols for Apple (AAPL), #Intel
    (INTC), Microsoft (MSFT), and ASML Holding (ASML)

    stock_symbols = ["AAPL", "INTC", "MSFT", "ASML"]

    #The date range to fetch historical stock data

    start_date = "2021-01-01"

    end_date = "2023-01-01"

    #Download historical stock data for each stock

    stock_data = yf.download(stock_symbols, start=start_date, end=end_date)[''Close'']

    #A loop is used to iterate over each stock symbol, and the closing prices #for
    each stock are plotted. All in the same figure

    plt.figure(figsize=(15, 8))

    for symbol in stock_symbols:

    plt.plot(stock_data[symbol], label=f"{symbol} Closing Prices")

    plt.title("Closing Prices Over Time for Selected Stocks")

    plt.xlabel("Date")

    plt.ylabel("Closing Price")

    # Displays a legend to identify each stock

    plt.legend()

    # Adds a grid to the plot for better readability

    plt.grid(True)

    #Show the plot using the above settings

    plt.show()

    Listing 3-4-2

    Series plot showing multiple companies’ closing prices over time aggregated together

    ```


    The output of Listing [3-4-2](#619569_1_En_3_Chapter.xhtml#PC12) is Figure [3-12](#619569_1_En_3_Chapter.xhtml#Fig12).
