- fmt: '### Looping over a DataFrame


    In the previous section in this chapter, we learned how to represent the `NULL`
    values in a dataset, so the Python interpreter reads it correctly. However, we
    have not discussed yet how to handle them. There are many ways in Python that
    help you to replace the missing values to avoid propagating them and to avoid
    producing wrong analytics reports.


    In the following example, Listing [5-7](#619569_1_En_5_Chapter.xhtml#PC10), we
    use the `fillna()` method to fill in the missing values in the dataset. First,
    we start by importing the required libraries and loading the excel file. To verify
    that the dataset has been read correctly, we print it and add three empty lines
    using `"\n\n\n"` after the DataFrame to easily distinguish the before and after.


    Then, we loop over all the columns of the DataFrame using its `columns` property.
    Inside the loop, we use the `fillna()` method of the DataFrame to replace the
    `NaN` values with zeros. It is entirely up to data scientists to decide how to
    replace the null values. You can replace it with the average or with maximum or
    the minimum values, and so on. The most important note is to document the new
    value and write in your analytics report your reasoning and justification for
    choosing such value. In the next chapter, we will discuss the procedure and the
    options in more detail.


    ```

    import pandas as pd

    import numpy as np

    import matplotlib.pyplot as plt

    students_df = pd.read_excel(''../Datasets/Chapter 5/missing_null.xlsx'')

    print(students_df,''\n\n\n'')

    for i in students_df.columns:

    students_df[i]=students_df[i].fillna(0)

    print(students_df)

    Listing 5-7

    For loop over a DataFrame

    ```


    The output of the listing is in Figure [5-7](#619569_1_En_5_Chapter.xhtml#Fig7).


    ![](images/619569_1_En_5_Chapter/619569_1_En_5_Fig7_HTML.jpg)


    **Figure 5-7** The dataset before and after handling the missing values


    ## Summary


    This chapter starts with how to make a comment in Python programs and how to use
    the arithmetic, comparison, logical, membership, and identity operators. Further,
    we discussed the different values that you can use to represent missing values
    in your datasets, so the Python interpreter reads them correctly. Moreover, we
    discussed the loops in detail with plenty of examples. There are the `while` and
    `for` loops. At the end of the chapter, we learned one of the ways of how to handle
    the missing values in Python. In the next chapter, we shall learn how to prepare
    for analysis and learn the essential conditional statement.


    # 6. Preparing Data for Analysis


    As we mentioned earlier, in any programming language, you learn the data types,
    operators, IF condition, and loops. We covered all these topics in Chapters [2](#619569_1_En_2_Chapter.xhtml)
    and [5](#619569_1_En_5_Chapter.xhtml), except the IF condition statements. In
    this chapter, we learn about them and more advanced data preparation and processing
    techniques.


    ## Rename


    In data analysis, an essential first step is to understand the variables of your
    dataset. You need to identify which variables are dependent and independent, as
    well as distinguish between numeric/continuous and character variables. Typically,
    your client provides this information in a text file accompanying the dataset.
    This text file, known as the dictionary, explains the variable names and their
    types. For instance, without the dictionary, variable names like `YOB`, `ENROLL`,
    and `DT_ACCEPT` might be unclear. The dictionary clarifies that `YOB` stands for
    Year Of Birth.


    To add these descriptive labels to a dataset, we use a process of renaming columns.
    The dataset is in the Datasets Folder and is named `Voter_A.CSV`. After uploading
    and importing the file, we rename the dataset to `Voters`. Note that this dataset
    is synthetic, created using the variable names provided by the Secretary of Maine,
    but does not contain any real voters’ information. I generated random 100 rows
    of voters’ information for these exercises.


    After importing, we see that the dataset contains 100 rows and 9 columns. We then
    rename the columns to include descriptive labels, making the dataset more readable.
    However, the data clearly needs cleaning. For instance, the `Special Designations`
    column is blank, and other columns have missing values. Verifying the data’s validity
    and ensuring it is error-free is essential. We will learn how to clean such messy
    data in the remaining sections.


    ```

    import pandas as pd

    df = pd.read_csv(''../Datasets/Chapter 6/Voters_A.csv'')

    print(df.head())

    # Renaming the columns to add labels

    df = df.rename(columns={

    ''FIRST_NAME'': ''Name'',

    ''YOB'': ''Year Of Birth'',

    ''ENROLL'': ''Enrollment Code'',

    ''DESIGNATE'': ''Special Designations'',

    ''DT_ACCEPT'': ''Date Accepted (Date of Registration)'',

    ''CG'': ''Congressional District'',

