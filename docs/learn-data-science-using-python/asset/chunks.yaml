    注册公司地址为：美国纽约州纽约市纽约广场 1 号，邮编 10004。


    *献给我聪慧的天才 Areej，请保持微笑，继续像你本来的星星一样闪耀。*


    *献给 Hesham，尽管我有时让你抓狂，但你从未放弃过我。*


    *献给我的父母，希望你们现在为我感到骄傲。*


    *献给我的兄弟、家人和朋友，你们总是耐心倾听我的倾诉。*


    ## 引言


    本书以逐步序列的方式向您展示如何使用 Python 完成数据清洗、统计和可视化任务，即使您没有任何编程或统计学背景。


    本书的案例研究预测了缅因州的总统选举，这是我在哈佛大学完成的一个项目。第 1 章更详细地解释了该案例研究。除了总统选举，本书还提供了现实生活中的例子，包括分析股票、石油和黄金价格、犯罪、市场营销和医疗保健。您将看到数据科学在行动中的实际应用，以及如何在
    Python 中完成复杂任务和可视化。


    您将逐步学习如何进行可视化。本书包含代码解释以及每一步的截图。全书遵循数据科学在行动中的范式，以易于理解的方式演示如何使用 Python 执行复杂任务和可视化，并使用真实的大数据进行有趣的动手实验。


    它将为读者提供使用 Python 进行数据科学和分析所需的专业知识：


    - 导入和导出原始数据文件

    - 操作和转换数据

    - 合并数据集

    - 创建汇总统计和报告

    - 识别并纠正数据、语法和编程逻辑错误

    - T 检验

    - 线性回归

    - 可视化


    ### 谁应该阅读本书？


    本书的主要读者是数据科学领域的新手学生，他们可能没有深厚的编程经验。因此，大学教授可以将其用作课程的讲义。此外，像我这样的技术讲师，在认证培训中心教授来自不同行业领域的专业人士，也可以用它来教学，并将其作为课程的教科书。


    此外，经验丰富但刚接触 Python 的系统分析师和科学家将找到更快速、更高效的工具来完成日常任务。同时，数据记者和调查记者会发现本书易于理解，并能快速生成必要的可视化内容。


    ### 本书是如何组织的？


    本书分为三个部分。第一部分，即第 1、2 和 3 章，让您熟悉 SAS 界面和基本核心任务。第 1 章重点介绍缅因州总统选举项目案例研究的总体思路及其输出。在整本书中，您将逐步学习如何获得这些输出图表和分析。


    然后，第二部分，即第 4、5 和 6 章，侧重于更高级的编程方面。第三部分，即第 7 章，将带您从分析历史数据走向预测未来。


    所有示例代码都在`Example Code`文件夹中，本书所需的数据集在`Datasets`文件夹中。


    关于作者 关于技术审稿人


    # 1. 数据科学在行动


    本章介绍了一个案例研究，该研究分析了缅因州的选民数据。该项目源于我 2016 年秋季在哈佛大学攻读硕士期间，在 Larry Adams 教授的指导下进行的一个项目，旨在预测全国总统选举结果。我的任务是预测缅因州
    2016 年和 2020 年的选举结果。


    该项目分两个阶段进行，首先侧重于预测 2016 年选举结果，并根据实际结果验证发现，然后再进入第二阶段。第二阶段纳入了 2016 年产生的新数据，以预测 2020
    年的结果：因此，本书的某些部分使用了 2016 年的数据。在可行的情况下，我收集了与分析相关的历史数据，包括可追溯到 1960 年的选举数据。


    选民的人口统计特征按年龄、性别、教育程度、人口统计和种族进行了划分。通过全面研究，确定了与该州相关的议题类别，包括经济、教育、环境、医疗保健和枪支管制。此外，我还审查了县的选票议题，以评估它们对总统选举的潜在影响。


    探索了各种预测方法和算法，包括蒙特卡洛和贝叶斯，以及统计检验（如 T 检验和卡方检验），并利用了自 1960 年以来的政党投票模式、民调准确性和选举人票数。过去，与
    FiveThirtyEight 和其他预测平台进行了比较，发现 2016 年的预测是准确的。该项目为将认知特征转化为用于分析的数值数据提供了宝贵的见解，最终基于趋势测量和模式分析做出明智的决策——这是通过后续数据科学工作磨练出来的技能。


    对于这个项目，我同时使用了 SAS 和 R 编程语言。2020 年，我与 Apress 合作出版了一本书《使用 SAS Studio 学习数据科学》。这本书大获成功，反响热烈；因此，Apress
    和我决定用 Python 重写它。

