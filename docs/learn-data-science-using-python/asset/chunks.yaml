    \n图 2-7\n\n一维 Numpy 数组\n\n1.  Pandas Series：能够保存任何数据类型的一维标签化数组，如代码清单 2-3 所示。\n\
    \n```\nimport pandas as pd\ns = pd.Series([1, 2, 3])\nprint(s)\n代码清单 2-3\nPandas\
    \ Series\n```\n\n输出如图 2-8 所示。我们使用 Pandas Series 来存储 Pandas DataFrame 中的一列，正如我们将在本书的许多示例中看到的那样。\n\
