    ## IF-ELIF Statements


    Now, we will analyze the number of voters in the following age groups: 18–24,
    25–29, 30–39, 40–49, 50–64, and 65+.


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    df = pd.read_csv(''../Datasets/Chapter 6/Voters_A.csv'')

    print("\nRaw data-first 5 rows:\n",df.head())

    df[''YOB_numeric''] = pd.to_numeric(df[''YOB''], errors=''coerce'')

    df[''age''] = 2024 - df[''YOB_numeric'']

    for x in df.index:

    #if (df.loc[x,''age'']>=18 and df.loc[x,''age'']=65) :

    df.loc[x,''age_group'']=''65+'';

    print("\nchecking age_group:\n",df.head())

    # Create frequency table directly from value_counts

    frequency_table = df[''age_group''].value_counts().to_frame(''Frequency'').reset_index()

    # Rename the columns to be consistent

    frequency_table.columns = [''age_group'', ''Frequency'']

    # Sort the table by frequency

    frequency_table = frequency_table.sort_values(by=''Frequency'', ascending=False)

    # Print the frequency table

    print("\n",frequency_table)

    # Plot the frequency

    plt.figure(figsize=(8, 6))

    plt.bar(frequency_table[''age_group''], frequency_table[''Frequency''], color=''skyblue'')

    plt.xlabel(''age_group'')

    plt.ylabel(''Frequency'')

    plt.title(''Frequency Plot of age_group'')

    plt.show()

    Listing 6-6

    IF-ELIF statements

    ```


    In Listing [6-6](#619569_1_En_6_Chapter.xhtml#PC6), as always, we start by loading
    the libraries and the dataset and verifying that the dataset has been loaded correctly
    by printing the first five rows. Then, as we explained in previous sections of
    this chapter, we compute the `age` column.


    To compute the `age_group` variable, we loop over the datasets row by row and
    made nested `if-elif` conditions using the age ranges, for example, `18<=df.loc[x,''age'']<=24`.
    Python allows using the ranges, and it also allows the compound conditional statements
    as other programming languages, `df.loc[x,''age'']>=18 and df.loc[x,''age'']<=24`.
    Also, you can use `else if` as in other programming languages instead of the `elif`
    statement.


    Afterward, as we explained in Chapter [4](#619569_1_En_4_Chapter.xhtml), we compute
    the frequency table of the `age_group` and plot its distribution using a bar chart.


    We can use many other ways to compute the `age_group` other than the nested `if-elif`
    statements. One of them is using the `pd.cut()` method. It would be more pythonic.
    However, this section aims to show how to use IF-ELIF statements. We can replace
    the whole section of the IF-ELIF statements with the following three lines:


    ```

    # Define age groups

    age_bins = [18, 25, 30, 40, 50, 65, float(''inf'')]

    # Define corresponding labels

    age_labels = [''18-24'', ''25-29'', ''30-39'', ''40-49'', ''50-64'', ''65+'']

    # Assign age groups using pd.cut

    df[''age_group''] = pd.cut(df[''age''], bins=age_bins, labels=age_labels, right=False)

    ```


    To create a frequency table to the `age_group` and make a bar chart for it, we
    use `to_frame()` method to convert the Series returned by `value_counts()` directly
    into a DataFrame and then rename the columns consistently. Then, we rename the
    `frequency_table` columns’ names by using the `.columns` property as in this statement:
    `frequency_table.columns = [''age_group'', ''Frequency'']`.


    At the end of this code snippet, we print the `frequency_table` and plot it as
    a bar chart, using `plt.bar(frequency_table[''age_group''], frequency_table[''Frequency''],
    color="skyblue")`. Afterward, we set the labels of the x and y axes and the title.
    Finally, we show the plot with these settings. Figure [6-6](#619569_1_En_6_Chapter.xhtml#Fig6)
    shows the output of Listing [6-6](#619569_1_En_6_Chapter.xhtml#PC6).


