    ## Statistical Analysis


    After reading datasets, there are usual statistical analysis tasks that should
    be performed to understand the data and to be included in the reports. In this
    chapter, we will discuss frequency tables, summary statistics, correlation analysis,
    and T-tests.


    ### Frequency Tables


    The frequency tables task is usually from the first steps when exploring any dataset.
    It generates frequency tables from your data showing the unique levels of each
    variable. Also, the table can help you identify the outliers.


    For this example, we explore the `HEART.csv` in the Datasets Folder to see how
    many people have high cholesterol. To do that, we focus on `CHOL_STATUS`, which
    is a string variable. The code is in Listing [4-1](#619569_1_En_4_Chapter.xhtml#PC1)
    in Chapter [4](#619569_1_En_4_Chapter.xhtml).ipynb in the Example Code Folder.


    In Listing [4-1](#619569_1_En_4_Chapter.xhtml#PC1), we learn how to generate a
    frequency table and plot the frequency distribution in a bar chart.


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    heart_df = pd.read_csv(''../Datasets/Chapter 4/HEART.csv'')

    frequency_table = heart_df[''Chol_Status''].value_counts().reset_index().rename(columns={''index'':
    ''Chol_Status'', ''Chol_Status'': ''Frequency''})

    # Sort the table by frequency

    frequency_table = frequency_table.sort_values(by=''Frequency'', ascending=False)

    # Print the frequency table

    print(frequency_table)

    # Plot the frequency

    plt.figure(figsize=(8, 6))

    plt.bar(frequency_table[''Chol_Status''], frequency_table[''Frequency''], color=''skyblue'')

    plt.xlabel(''Chol_Status'')

    plt.ylabel(''Frequency'')

    plt.title(''Frequency Plot of Chol_Status'')

    plt.show()

    Listing 4-1

    Frequency tables

    ```


    After importing the required libraries and reading the csv file in a Panda DataFrame,
    `heart_df`, we calculate the frequency table. This code line, `frequency_table
    = heart_df[''Chol_Status''].value_counts().reset_index().rename(columns={''index'':
    ''Chol_Status'', ''Chol_Status'': ''Frequency''})`, performs the following:


    *   `heart_df[''Chol_Status''].value_counts()`: This calculates the frequency
    of unique values in the `''Chol_Status''` column of the DataFrame `heart_df`.


    *   `.reset_index():` This resets the index of the resulting series, converting
    it into a DataFrame.


    *   `.rename(columns={''index'': ''Chol_Status'', ''Chol_Status'': ''Frequency''}):`
    This renames the columns of the DataFrame to `''Chol_Status''` and `''Frequency''`
    for clarity.


    Then, we sort the frequency table DataFrame by the `Frequency` column in descending
    order, ensuring that the categories with the highest frequencies are displayed
    first. This is done by this instruction: `frequency_table = frequency_table.sort_values(by=''Frequency'',
    ascending=False)`.


    Then, we print the frequency table DataFrame to the console, showing the frequencies
    of each unique value in the `Chol_Status` column. The output of this code is in
    the table in Figure [4-1](#619569_1_En_4_Chapter.xhtml#Fig1).


    ![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Frequency table


    For plotting the frequency plot, as mentioned before, we use `plt.figure()` method
    to create a new plot and do not have the plots drawn over each other. Also, we
    use it to set the plot dimensions. Then, create a bar chart of `Chol_Status` series
    as the x axis and the frequency as the y axis and add their labels. The last two
    steps are for setting the plot title and showing it. The output of this part is
    in Figure [4-2](#619569_1_En_4_Chapter.xhtml#Fig2).


    ![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Frequency bar chart


    Figure [4-2](#619569_1_En_4_Chapter.xhtml#Fig2) shows the distribution of `Chol_Status`
    in descending order, where `Borderline` has the highest percentage in this dataset,
    followed by `High`, and the lowest frequency is `Desirable`.'
