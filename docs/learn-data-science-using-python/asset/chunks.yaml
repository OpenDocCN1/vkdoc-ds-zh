    ## Pandas


    Throughout this book, we will use Pandas and Numpy extensively. Pandas is a powerful
    and popular Python library for data manipulation and analysis. It provides easy-to-use
    data structures and functions designed to work with structured data seamlessly.
    One of its notable features is the ability to present data in a human-readable
    table format while also allowing numerical interpretation for extensive computations.
    Think of Pandas as a supercharged version of Excel within Python, allowing you
    to handle and analyze data more efficiently and programmatically.


    ### Why Use Pandas?


    - **Easy Data Handling**: Pandas simplifies tasks like loading data from files,
    cleaning messy data, and performing calculations.

    - **Data Analysis**: With Pandas, you can explore large datasets quickly, filter
    out the information you need, and gain insights.

    - **Versatility**: Pandas can work with different datatypes, including numbers,
    text, and time series data.


    ### Key Concepts


    - **Series**: A Series is a one-dimensional array-like object that can hold various
    datatypes, including numbers, strings, and dates. Think of it as a single column
    in a spreadsheet, as shown in Listing [2-13](#619569_1_En_2_Chapter.xhtml#PC13).


    ```

    import pandas as pd

    df = pd.DataFrame({''A'': [1, 2, 3], ''B'': [4, 5, 6]})

    series=df[''A'']

    print(series)

    Listing 2-13

    Pandas Series

    ```


    The output is in Figure [2-11](#619569_1_En_2_Chapter.xhtml#Fig11).


    ![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig11_HTML.jpg)


    Figure 2-11


    Getting a Series from a Pandas DataFrame


    - **DataFrame**: A DataFrame is a two-dimensional table similar to a spreadsheet
    or a SQL table. It consists of rows and columns, where each column can have a
    different datatype, as in Listing [2-14](#619569_1_En_2_Chapter.xhtml#PC14).


    ```

    data = {

    ''Name'': [''Alice'', ''Bob'', ''Charlie''],

    ''Age'': [25, 30, 35],

    ''City'': [''New York'', ''Los Angeles'', ''Chicago'']

    }

    df = pd.DataFrame(data)

    print(df)

    Listing 2-14

    Pandas DataFrame

    ```


    The output is in Figure [2-12](#619569_1_En_2_Chapter.xhtml#Fig12).


    ![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig12_HTML.jpg)


    Figure 2-12


    Creating a Pandas DataFrame


    ### Basic Operations with Pandas


    - **Loading Data**: You can load data from various sources, such as CSV files,
    Excel files, and databases. In the coming chapters, we will see how to load multiple
    file types.

    - **Inspecting Data**: Check the structure and summary of the data. To summarize
    a DataFrame, use the `df.info()` method. To make a statistical summary, use the
    `df.describe()` method, as we will see in Chapter [3](#619569_1_En_3_Chapter.xhtml).

    - **Filtering Data**: In the next chapter, Chapter [3](#619569_1_En_3_Chapter.xhtml),
    we will see how to select specific rows and columns based on how we want to manipulate
    and analyze our data to generate the required chart for visualizations. Through
    the rest of the book, we keep using the same techniques for further data science
    tasks.

    - **Modifying Data**: Add, remove, or update columns. In Chapter [6](#619569_1_En_6_Chapter.xhtml),
    we will discuss how to do each of these tasks in full detail.

    - **Managing Missing Data**: Identify and handle missing values. Again, in Chapter
    [6](#619569_1_En_6_Chapter.xhtml), we will see how to use `df.dropna()` to remove
    rows with missing values, `df.fillna(0)` to replace missing values with 0, and
    other methods.

    - **Indexing in Pandas DataFrame**: Access a column by name, access a row by index,
    use `df.at[row number, ''column name'']` property to access a specific element
    by row and column, and use `df.loc[row start:row end, ''column start'':''column
    end'']` to slice both rows and columns. We will have more examples demonstrating
    this topic in Chapter [6](#619569_1_En_6_Chapter.xhtml).


    ## Numpy


    Numpy, short for “numerical Python,” is a foundational Python library for numerical
    computing. It supports arrays, matrices, and high-level mathematical functions
    to operate on these data structures. Numpy is the backbone of many other data
    science libraries, including Pandas.


    We frequently transfer data from our Pandas DataFrame to Numpy arrays. Pandas
    DataFrames are beneficial because they include column names and other text data,
    making them easy for humans to read. However, Numpy arrays are the most efficient
    for computers to perform calculations.


    ### Why Use Numpy?


    - **Performance**: Numpy operations are implemented in C, making them extremely
    fast and efficient for large-scale computations.

    - **Ease of Use**: Numpy makes it easy to perform complex mathematical operations
    on arrays and matrices with simple syntax.

    - **Flexibility**: Numpy arrays can handle various datatypes and are more versatile
    than Python lists for numerical computations.


    ### Key Concepts


    - **Array**: A Numpy array is a grid of values, all the same type, as in Listing
    [2-15](#619569_1_En_2_Chapter.xhtml#PC15). A tuple of nonnegative integers indexes
    arrays.


    ```

    import numpy as np

    array = np.array([1, 2, 3, 4, 5])

    print(array)

    Listing 2-15

