    ## 假设检验


    假设检验是一种统计方法，用于基于样本数据对总体参数进行推断。它涉及将观测数据与预期假设或零假设进行比较，以确定任何观测到的差异或关系是否具有统计显著性，或者仅仅是随机因素造成的。


    用于连续数据分析的假设检验示例包括 T 检验和方差分析，而卡方检验则用于分类数据分析。


    ### T 检验


    我们经常需要确定两个不同组别之间的均值是否存在真实差异，或者所感知到的差异是否仅仅是随机变异的结果。T 检验通过衡量两个数据集之间差异的可能性来服务于这一目的。换句话说，它评估两个样本的均值。值得注意的是，T
    检验适用于小样本量，因为小样本量可能不服从正态分布。

