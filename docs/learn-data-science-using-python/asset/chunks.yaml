    # 删除列


    `DROP` 方法用于从数据集中排除某些变量。在 `Voters_A.csv` 数据集中，`Designate` 列为空。在数据清洗过程中，我们应删除此列；换句话说，就是将其丢弃，如清单
    6-8 所示。


    ```

    import pandas as pd

    import numpy as np

    df = pd.read_csv(''../Datasets/Chapter 6/Voters_A.csv'')

    print("The size of the dataframe:",df.shape)

    df.replace(to_replace=[r''^\s*$'', '''', None], value=np.nan, regex=True, inplace=True)

    print(df.isnull().sum())

    print("The dataframe before dropping:")

    print(df.head())

    df.drop("DESIGNATE",axis = 1, inplace = True)

    print("The size of the dataframe:",df.shape)

    print("The dataframe after dropping:")

    print(df.head())

    Listing 6-8

    Drop method

    ```


    使用 `pd.csv()` 方法正确加载文件后，我们验证了 DataFrame 的大小，如图 6-8 所示，为 `(100,9)`。


    有时，空单元格可能不会被读取为空字符串（`'' ''`），而是被读取为 `None`、空白字符或其他表示形式。为了处理各种类型的空值并将其替换为 `NaN`，我们可以使用
    `df.replace(to_replace=[r''^\s*$'', '''', None], value=np.nan, regex=True, inplace=True)`。此方法将所有空值表示形式替换为
    `NaN`，其中包括一个正则表达式模式，用于匹配仅由空白字符组成的任何字符串：`r''^\s*$''`。同时，它还会替换空字符串和 `None`。


    `df.isnull().sum()` 用于统计每列中 `NaN` 值的数量。输出结果如图 6-8 所示，显示 `Designate` 列中的所有行均为 `NaN`。我们使用
    `.head()` 方法对此进行了验证。


    `df.drop("DESIGNATE", axis=1, inplace=True)` 从 DataFrame 中删除名为 `DESIGNATE` 的列。选项
    `axis=1` 表示要删除的是列（而非行）。在 Pandas 中，`axis=0` 指行，`axis=1` 指列。选项 `inplace=True` 会直接修改原始
    DataFrame `df`，而不会创建包含新值的新 DataFrame。


    我们打印删除列前后的 DataFrame 头部和大小，以验证列数已从 9 列减少到 8 列，如图 6-8 所示。


