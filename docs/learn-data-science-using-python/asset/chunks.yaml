- fmt: '# Multiple Linear Regression


    In multiple linear regression, there is more than one independent variable in
    the model. The line equation will be as follows:


    `Y = a + b[1] X[1] + b[2] X[2] + … + b[i] X[i]`


    where `Y` is the dependent variable that we want to predict its value, `a` is
    the intercept, `b[i]` are the coefficients, and `X[i]` are the independent variables.
    The error is ignored.


    The null hypothesis is that there is no linear relationship between the dependent
    variable and any of the independent variables. In other words, the values of `b[i]`
    are zeros. The alternative hypothesis is that there is a linear relationship and
    any `b[i]` does not equal zero.


    `H[0]: b[i] = 0`


    `H[a]: b[i] ^= 0`


    Let us see if there is a linear relationship between the stock performance index
    (S and P index) and the prices of oil per barrel and gold in the presidential
    election years. The dataset is in the Datasets Folder with the name: `sp_oil_gold.xlsx`.
    The code is in Listing [7-2](#619569_1_En_7_Chapter.xhtml#PC8) in Chapter [7](#619569_1_En_7_Chapter.xhtml).ipynb
    in the Example Code Folder.


    Listing [7-2](#619569_1_En_7_Chapter.xhtml#PC8) displays three vertical bar charts
    showing the prices of oil, gold, and stocks over the years (from 1960 to 2016),
    each in a dedicated graph. The years are the presidential election years.


    ```

    import numpy as np

    import pandas as pd

    from sklearn.linear_model import LinearRegression

    from matplotlib import pyplot as plt

    df = pd.read_excel(''../Datasets/sp_oil_gold.xlsx'')

    oil_price = df[''oil price'']

    gold_prices = df[''gold_prices'']

    Stock_Market_Returns=df[''Stock Market Returns'']

    years=df[''Year'']

    # Figure Size

    plt.figure(0)

    # set width of bar

    barWidth = 0.25

    fig = plt.subplots(figsize =(20, 8))

    plt.xticks(years)

    plt.yticks(Stock_Market_Returns)

    plt.axhline(y=0, color=''b'', linestyle=''-'')

    plt.title(''Stock_Market_Returns'')

    # Bar Plot

    plt.bar(years,Stock_Market_Returns)

    # Show Plot

    plt.show()

    plt.figure(1)

    # set width of bar

    barWidth = 0.25

    fig = plt.subplots(figsize =(20, 8))

    plt.xticks(years)

    plt.yticks(oil_price)

    plt.title(''oil_price'')

    plt.axhline(y=0, color=''b'', linestyle=''-'')

    # Bar Plot

    plt.bar(years,oil_price)

    # Show Plot

    plt.show()

    plt.figure(2)

    # set width of bar

    barWidth = 0.25

    fig = plt.subplots(figsize =(20, 8))

    plt.xticks(years)

    plt.yticks(gold_prices)

    plt.title(''gold_prices'')

    plt.axhline(y=0, color=''b'', linestyle=''-'')

    # Bar Plot

    plt.bar(years,gold_prices)

    # Show Plot

    plt.show()

    x=df[[''oil price'',''gold_prices'']].values

    y=df[''Stock Market Returns''].values

    # creating an object of LinearRegression class

    LR = LinearRegression()

    # fitting the training data

    LR.fit(x,y)

    print(''intercept:'', LR.intercept_)

    print(''slope:'', LR.coef_)

    print(''equation of Stock market returns='',LR.intercept_,"+",LR.coef_[0],''*
    oil price +'',LR.coef_[1],"*gold_prices")

