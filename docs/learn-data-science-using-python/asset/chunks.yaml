    \ `scikit-learn` 是一个可靠的选择。\n\n在某些情况下，分析人员会同时使用这两个库：先用 `statsmodels` 进行初步探索和假设检验，再用\
    \ `scikit-learn` 构建预测模型，以便轻松集成到更广泛的机器学习工作流中。在我们的代码中，我们将同时包含 `scikit-learn` 和 `statsmodels`，并使用\
    \ `seaborn` 绘制诊断图，以充分利用每个库的优势。\n\n在下面的示例中，我们将使用 `scikit-learn` 库进行模型拟合和拟合诊断图。\n\
    \n执行简单线性回归及其拟合诊断的步骤如下：\n\n1. 导入所需的库，加载数据集并进行探索。\n2. 创建模型。\n3. 测试模型并计算预测值和准确率分数。\n\
    4. 绘制总统选举年份每桶石油价格的五个拟合诊断图：\n   - 预测值与实际值对比图\n   - 残差与拟合值对比图\n   - R-Student 与预测值对比图\n\
    \   - R-Student 与杠杆值对比图\n   - Cook's D 与观测值对比图\n\n完整代码位于示例代码文件夹中第 7 章的 Listing\
    \ 7-1.ipynb 文件中。不过，在 Jupyter Notebook 中，代码将按照上述步骤划分到不同的单元格中。现在，我们将解释每个单元格，以编写上述每个步骤的代码，并解释拟合诊断图。\n\
    \n## 1. 导入库，加载数据集并进行探索\n\n在这一步中，我们导入所需的库，加载数据集并进行探索。为了更深入地探索数据，我们绘制了变量之间的多对双变量分布图。\n\
    \n```\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import\
    \ LinearRegression\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n#\
    \ 导入 r2_score 模块\nfrom sklearn.metrics import r2_score\nfrom sklearn.metrics import\
    \ mean_squared_error\nfrom sklearn.preprocessing import StandardScaler\nimport\
    \ statsmodels.api as sm\ndf = pd.read_excel('../Datasets/sp_oil_gold.xlsx')\n\
    print(df.head())\ndf=df[['oil price','gold_prices']]\nprint(df.head())\n# 将数值数据绘制成配对图\n\
    plt.figure(0)\nsns.pairplot(df);\nListing 7-1-1\n导入所需的库，加载数据集并进行探索\n```\n\n在 Listing\
    \ 7-1-1 中，我们首先导入了九个库。`Pandas`、`Numpy` 和 `sklearn.preprocessing` 用于处理数字和矩阵。`Matplotlib`\
    \ 和 `Seaborn` 用于可视化。`LinearRegression` 是一个机器学习模型。`sklearn.metrics` 库用于模型评估。`statsmodels.api`\
    \ 用于执行 OLS 并访问影响统计量。\n\n在 Python 中，你可以通过多种方式完成同一任务。这里，我们使用 `pd.read_excel()` 函数将数据加载为\
    \ DataFrame，因为数据集是一个 Excel 文件。不过，你也可以将数据加载为两个 `Numpy` 数组，如下所示，因为数据集很小。\n\n```\n\
    oil_prices = np.array([1.63, 1.45, 1.32, 1.82, 11.6, 35.52, 28.2, 14.24, 18.44,\
    \ 20.29, 27.6, 36.05, 94.1, 109.45, 40.76])\ngold_prices = np.array([35.27, 35.1,\
    \ 39.31, 58.42, 124.74, 615, 361, 437, 343.82, 387.81, 279.11, 409.72, 871.96,\
    \ 1668.98, 1250.74])\n```\n\n为了验证数据已正确加载，我们使用 `df.head()` 函数打印数据集的标题和前五行。我们只保留\
    \ `oil price` 和 `gold_prices` 变量，因为这是一个简单线性回归，只需要一个自变量，我们将删除其余列。我们通过以下语句实现：\n\n\
    ```\ndf=df[['oil price','gold_prices']]\n```\n\n为了探索数据，我们使用 `sns.pairplot(df)`\
    \ 函数打印变量之间的多对双变量分布图。为了避免图形相互重叠，我们使用 `plt.figure()` 函数对它们进行编号。\n\n![](img/619569_1_En_7_Fig1_HTML.jpg)\n\
    \n图 7-1\n\nListing 7-1-1 的输出\n\n图 7-1 显示了 Listing 7-1-1 的输出。该图首先显示了数据集中所有列的前五行。然后，它显示了\
    \ `oil price` 的直方图，以及以 `oil price` 为 y 轴、`gold_price` 为 x 轴的散点图。在图形分布的第二行，散点图再次出现，但这次是以\
    \ `gold_price` 为 y 轴、`oil price` 为 x 轴，而第二行第二列是 `gold_price` 的直方图。在两个散点图中，都有三个明显的异常值，我们将讨论导致这一现象的原因。\n\
    \n## 2. 创建模型\n\n在这一步中，我们指定自变量和目标变量。由于数据集很小，我们将跳过训练和测试集的划分步骤。我们将使用整个数据集进行训练和测试。然后，我们创建模型并将数据拟合到模型中。根据参数估计值，我们将写出直线方程。将拟合的直线直观地叠加在变量的散点图上。\n\
    \n```\nx=df['gold_prices'].values.reshape(-1, 1)\ny=df['oil price'].values\n#\
