- fmt: '# Logistic Regression


    Logistic regression is similar to linear regression except that the dependent
    variable is of binary values, not continuous. The model equation checks the probability
    of one of the discrete binary values of the dependent variable occurring.


    The binary logistic regression model equation is as follows:


    *   `p = e^(b0 + b1*X1 + b2*X2 + ...) / (1 + e^(b0 + b1*X1 + b2*X2 + ...))`


    Again, the null hypothesis is that there is no relationship between the variables,
    so all the coefficients are zeros. The alternate hypothesis is that there is a
    relationship between the dependent variable and the independent variables.


    For this example, we use the Titanic dataset to see if there is a relationship
    between the passenger’s survival, age, and passenger’s class as independent variables.
    The dataset is in the “Dataset” folder and has the name `titanic.csv`, or you
    can download the CSV file from OpenDataSoft.com at the following URL: [`https://www.kaggle.com/datasets/vinicius150987/titanic3/data`](https://www.kaggle.com/datasets/vinicius150987/titanic3/data).


    The code is in Listing 7-3 in Chapter [7](#619569_1_En_7_Chapter.xhtml).ipynb
    in the Example Code Folder.


    ```

    #Listing 7-3-1

    import pandas as pd

    from sklearn.linear_model import LogisticRegression

    df = pd.read_csv(''../Datasets/titanic.csv'')

    print(df.head())

    df[''male''] = df[''Gender''] == ''male''

    x = df[[''Pclass'', ''male'', ''Age'', ''Siblings/Spouses'', ''Parents/Children'',
    ''Fare'']].values

    y = df[''Survived''].values

    print(''x[0:5]='',x[0:5])

    print(''y[0:5]='',y[0:5])

    Listing 7-3-1

    Logistic regression

    ```


    In Listing [7-3-1](#619569_1_En_7_Chapter.xhtml#PC9), we start by importing the
    required libraries. Then, we load the data; because the dataset is in CSV format,
    we use `pd.read_csv()` function. As in the previous sections, we check if the
    dataset has been loaded correctly in the `DataFrame`, `df`, by printing the first
    five rows. The output is shown in Figure [7-9](#619569_1_En_7_Chapter.xhtml#Fig9).


    Let us look at the output of this code before proceeding explaining the code.


    ![](images/619569_1_En_7_Chapter/619569_1_En_7_Fig9_HTML.jpg)


    Figure 7-9


    Output of Listing [7-3-1](#619569_1_En_7_Chapter.xhtml#PC9)


    All the columns of this dataset are numeric except the `Gender`, which is `string`.
    We cannot use a string variable in regression. There are multiple ways to encode
    the string variables to numeric, for example, the ordinal and one-hot encodings.
    However, in our case, we do not need these encodings because the gender has two
    values only, `male` and `female`. So, it is easier to add a mask on one of the
    values, which means if the `mask` is `true`, the value will be `1`; otherwise,
    it will be `0`.


    We create a `Pandas Series` that will be a series of True and False values (`True`
    if the passenger is `male` and `False` if the passenger is `female`).


    ```

    df[''Gender'']==''male''

    ```


    Now, we want to create a column with this result. To create a new column, we use
    the same square bracket syntax `df[''male'']` and then assign this new value to
    it.


    ```

    df[''male''] = df[''Gender''] == ''male''

    print(df.head())

    ```


    Next, we set the independent variables in `DataFrame x` and the target variable
    `Series y` for the passengers who survived Titanic. In the code, we print the
    first five rows of both `x` and `y`.


    ```

    #Listing7-3-2

    model = LogisticRegression()

    model.fit(x, y)

    print(''model.coef_='',model.coef_)

    print(''model.intercept_='',model.intercept_)

    Listing 7-3-2

    The model

    ```


    In Listing [7-3-2](#619569_1_En_7_Chapter.xhtml#PC12), we create an instance of
    the `LogisticRegression` and fit the `x` and `y` to it. Then, we print the parameter
    estimates of the model, as in Figure [7-10](#619569_1_En_7_Chapter.xhtml#Fig10).


    ![](images/619569_1_En_7_Chapter/619569_1_En_7_Fig10_HTML.jpg)


    Figure 7-10


    Output of Listing [7-3-2](#619569_1_En_7_Chapter.xhtml#PC12)


    Figure [7-10](#619569_1_En_7_Chapter.xhtml#Fig10) shows the parameter estimates,
    and you can substitute the values in the equation of the logistic regression.


    ```

    #Listing 7-3-3

    print(''The predictions of the first 5 rows='',model.predict(x[:5]))

    # [0 1 1 1 0]

    print(''The actual y values of the first 5 rows='',y[:5])

    # [0 1 1 1 0]

    y_pred = model.predict(x)

    print(''accuracy='',(y == y_pred).sum()/y.shape[0])

    print(''model score='',model.score(x,y))

    Listing 7-3-3

    Test the model and compute the accuracy

    ```


    In Listing [7-3-3](#619569_1_En_7_Chapter.xhtml#PC13), we simply compute the predictions
    and the difference between the model predictions and the actual values. This computation
    is the model accuracy. There is function of the logistic regression called `model.score()`
    that makes this difference automatically without the need to compute the predictions
    manually.


    ![](images/619569_1_En_7_Chapter/619569_1_En_7_Fig11_HTML.jpg)


    Figure 7-11


    Output of Listing [7-3-3](#619569_1_En_7_Chapter.xhtml#PC13)


    Figure [7-11](#619569_1_En_7_Chapter.xhtml#Fig11) shows the output of Listing
    [7-3-3](#619569_1_En_7_Chapter.xhtml#PC13). In the figure, we compare the manual
    computing of the accuracy and the output of the `model.score()` function. As shown,
    there is no difference between them, and this model’s accuracy is about 81%.'
  raw: '## Logistic Regression


    Logistic regression is similar to linear regression except that the dependent
    variable is of binary values, not continuous. The model equation checks the probability
    of one of the discrete binary values of the dependent variable occurring.


    The binary logistic regression model equation is as follows:


    *   p=e^ ^((b0+b1X1+b2X2+...)) / (1+e^ ^((b0+b1X1+b2X2+...)))


    Again, the null hypothesis is that there is no relationship between the variables,
    so all the coefficients are zeros. The alternate hypothesis is that there is a
    relationship between the dependent variable and the independent variables.


    For this example, we use the Titanic dataset to see if there is a relationship
    between the passenger’s survival, age, and passenger’s class as independent variables.
    The dataset is in the “Dataset” folder and has the name titanic.csv, or you can
    download the CSV file from OpenDataSoft.com at the following URL: [`https://www.kaggle.com/datasets/vinicius150987/titanic3/data`](https://www.kaggle.com/datasets/vinicius150987/titanic3/data).


    The code is in Listing 7-3 in Chapter [7](#619569_1_En_7_Chapter.xhtml).ipynb
    in the Example Code Folder.


    ```

    #Listing 7-3-1

    import pandas as pd

    from sklearn.linear_model import LogisticRegression

    df = pd.read_csv(''../Datasets/titanic.csv'')

    print(df.head())

    df[''male''] = df[''Gender''] == ''male''

    x = df[[''Pclass'', ''male'', ''Age'', ''Siblings/Spouses'', ''Parents/Children'',
    ''Fare'']].values

    y = df[''Survived''].values

    print(''x[0:5]='',x[0:5])

    print(''y[0:5]='',y[0:5])

    Listing 7-3-1

    Logistic regression

    ```


    In Listing [7-3-1](#619569_1_En_7_Chapter.xhtml#PC9), we start by importing the
    required libraries. Then, we load the data; because the dataset is in CSV format,
    we use `pd.read_csv()` function. As in the previous sections, we check if the
    dataset has been loaded correctly in the `DataFrame`, `df`, by printing the first
    five rows. The output is shown in Figure [7-9](#619569_1_En_7_Chapter.xhtml#Fig9).


    Let us look at the output of this code before proceeding explaining the code.


    ![](images/619569_1_En_7_Chapter/619569_1_En_7_Fig9_HTML.jpg)


    Figure 7-9


    Output of Listing [7-3-1](#619569_1_En_7_Chapter.xhtml#PC9)


    All the columns of this dataset are numeric except the `Gender`, which is `string`.
    We cannot use a string variable in regression. There are multiple ways to encode
    the string variables to numeric, for example, the ordinal and one-hot encodings.
    However, in our case, we do not need these encodings because the gender has two
    values only, `male` and `female`. So, it is easier to add a mask on one of the
    values, which means if the `mask` is `true`, the value will be `1`; otherwise,
    it will be `0`.


    We create a `Pandas Series` that will be a series of True and False values (`True`
    if the passenger is `male` and `False` if the passenger is `female`).


    ```

    df[''Gender'']==''male''

    ```


    Now, we want to create a column with this result. To create a new column, we use
    the same square bracket syntax `df[''male'']` and then assign this new value to
    it.


    ```

    df[''male''] = df[''Gender''] == ''male''

    print(df.head())

    ```


    Next, we set the independent variables in `DataFrame x` and the target variable
