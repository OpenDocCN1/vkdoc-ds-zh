    ### Correlation Analysis


    Before explaining the correlation concepts, we want to set the difference between
    the causation and the correlation. Causation is when one thing causes another
    thing to happen, while correlation is when two or more things appear to be related.
    Correlations do not always mean causation.


    For example, travel causes buying suitcases and tickets, but suitcase sales and
    tickets are correlated, as shown in Figure [4-4](#619569_1_En_4_Chapter.xhtml#Fig4).


    ![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig4_HTML.jpg)


    **Figure 4-4** Causation vs. correlation


    Correlation serves as a statistical method to depict the connection between numerical
    variables. This connection is articulated through the computation of correlation
    coefficients, which range from -1 to 1. The correlation analysis task furnishes
    both graphs and statistics to explore the associations among variables.


    Let us inspect a couple of examples. The first one is finding if there is a correlation
    between the length and weight of cars and their horsepower. The cars’ dataset
    is in the `Datasets` folder.


    The code is in Listing [4-3](#619569_1_En_4_Chapter.xhtml#PC3) in Chapter [4](#619569_1_En_4_Chapter.xhtml).ipynb
    in the Example Code Folder. There are multiple ways to compute correlation in
    Python. In this example, we use the `corr()` method in Pandas to compute the correlation
    matrix between the specified variables.


    In Listing [4-3](#619569_1_En_4_Chapter.xhtml#PC3), we import the required libraries,
    load the dataset, and explore it. To explore the data more, we plot the multiple
    pairwise bivariate distributions of the variables.


    ```

    import pandas as pd

    import numpy as np

    import matplotlib.pyplot as plt

    cars_df = pd.read_excel(''../Datasets/Chapter 4/CARS.xlsx'')

    print(cars_df.head())

    print(cars_df.describe())

    # Selecting variables

    variables = cars_df[[''Weight'', ''Length'', ''Horsepower'']]

    # Calculate the correlation matrix

    correlation_matrix = variables[[''Weight'', ''Length'']].corrwith(variables[''Horsepower''])

    print("Pearson correlation coefficients:")

    print(correlation_matrix)

    plt.figure(figsize=(12, 6))

    plt.scatter(cars_df[''Weight''], cars_df[''Horsepower''])

    plt.xlabel(''Weight'')

    plt.ylabel(''Horsepower'')

    plt.figure(figsize=(12, 6))

    plt.scatter(cars_df[''Length''], cars_df[''Horsepower''])

    plt.xlabel(''Length'')

    plt.ylabel(''Horsepower'')

    Listing 4-3

    Import the required libraries, load the dataset, and explore it

    ```


    In Listing [4-3](#619569_1_En_4_Chapter.xhtml#PC3), we start by importing the
    Pandas library, which is used for data manipulation. We load the dataset `CARS.xlsx`
    into a Pandas DataFrame using the `pd.read_excel()` function. Then, we extract
    the columns `Weight`, `Length`, and `Horsepower` from the dataset and store them
    in a new DataFrame called `variables`.


    We use the `corrwith()` method to compute the Pearson correlation coefficients
    between the pairs of variables `Weight` and `Horsepower` and `Length` and `Horsepower`.
    This method calculates the correlation between two DataFrames or two Series. In
    this case, we correlate the `Weight` and `Length` columns in the `variables` DataFrame
    with the `Horsepower` column. The output in Figure [4-5](#619569_1_En_4_Chapter.xhtml#Fig5)
    shows that the horsepower is more correlated with weight than length.


    ![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig5_HTML.jpg)


    **Figure 4-5** Pearson correlation coefficients


    To confirm these correlations, let us draw the scatterplots, as in Figure [4-6](#619569_1_En_4_Chapter.xhtml#Fig6).


    ![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig6_HTML.jpg)


    **Figure 4-6** Correlation between horsepower and weight and length


    Now, let us explore how correlation can be applied to the presidential elections
    in Maine. The inquiry at hand is: Does the gross domestic product (GDP) have an
    impact on voter turnout in the state of Maine?'
