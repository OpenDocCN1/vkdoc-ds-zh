    测试模型，并计算预测值与准确率分数。

    ```


    在清单 7-1-3 中，我们计算了 `y_prediction` 值，以评估我们模型的准确率，这是通过 `r2_score` 实现的。它是 `sklearn.metrics`
    模块中的一个函数，`r2_score` 的值在 0 到 100% 之间变化。


    同时，我们还计算了均方误差（MSE），这是一种衡量误差平方平均值的估计量。


