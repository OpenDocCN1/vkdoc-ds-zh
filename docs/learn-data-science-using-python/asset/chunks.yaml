    are.*


    *To Hesham, who never gives up on me despite I sometimes drive you crazy.*


    *To my parents, I hope you are now proud of me.*


    *To my brothers, family, and friends, you always lend an ear to my venting.*


    ## Introduction


    This book shows you in step-by-step sequences how to use Python to accomplish
    data cleaning, statistics, and visualization tasks even if you do not have any
    programming or statistics background.


    The book’s case study predicts the presidential elections in the state of Maine,
    which is a project I did at Harvard University. Chapter [1](#619569_1_En_1_Chapter.xhtml)
    explains the case study in more detail. In addition to the presidential elections,
    the book provides real-life examples, including analyzing stocks, oil and gold
    prices, crime, marketing, and healthcare. You will see data science in action
    and how to accomplish complicated tasks and visualizations in Python.


    You will learn, step-by-step, how to do visualizations. The book includes explanations
    of the code with screenshots of every step. The whole book follows the paradigm
    of data science in action to demonstrate how to perform complicated tasks and
    visualizations in Python in an easy to follow way and with real big data for interesting
    hands-on-labs.


    It will provide readers the required expertise in data science and analytics using
    Python:


    - Import and export raw data files

    - Manipulate and transform data

    - Combine datasets

    - Create summary statistics and reports

    - Identify and correct data, syntax, and programming logic errors

    - T-test

    - Linear regression

    - Visualizations


    ### Who Should Read This Book?


    The primary audience of this book is students who are newbies to data science
    and might not have deep programming experience. Consequently, university professors
    can use it as a handout for their courses. Also, technical instructors, like myself,
    who teach professionals from various industry sectors at certified training centers,
    can teach from it and use it as the courses’ textbook.


    Also, system analysts and scientists who are experienced but new to Python will
    find faster and more efficient tools to achieve their daily tasks. Moreover, data
    journalists and investigative reporters will find the book easy to follow and
    can generate essential visualizations fast.


    ### How Is This Book Organized?


    The book has three parts. The first part, Chapters [1](#619569_1_En_1_Chapter.xhtml),
    [2](#619569_1_En_2_Chapter.xhtml), and [3](#619569_1_En_3_Chapter.xhtml), gets
    you familiar with the SAS interface and the basic essential tasks. Chapter [1](#619569_1_En_1_Chapter.xhtml)
    focuses on drawing a general idea of the case study of the presidential elections
    project in the state of Maine and its outputs. Throughout the book, you will learn
    how to get those output charts and analytics in a step-by-step manner.


    Then the second part, Chapters [4](#619569_1_En_4_Chapter.xhtml), [5](#619569_1_En_5_Chapter.xhtml),
    and [6](#619569_1_En_6_Chapter.xhtml), focuses on more advanced programming aspects.
    The third part, Chapter [7](#619569_1_En_7_Chapter.xhtml), takes you from analyzing
    historical data to predicting the future.


    All the example code is in the `Example Code` folder, and datasets required for
    this book are in the `Datasets` folder.


    About the Author About the Technical Reviewer


    # 1. Data Science in Action


    This chapter presents a case study examining voter data analysis in the state
    of Maine. Stemming from a project undertaken during my master’s program at Harvard
    University in the Fall of 2016, under the guidance of Professor Larry Adams, the
    project aimed to forecast presidential election results nationwide. My task was
    to predict Maine’s 2016 and 2020 election outcomes.


    The project unfolded in two phases, initially focusing on predicting the 2016
    election results and validating the findings against actual outcomes before proceeding
    to the second phase. The second phase incorporated new data generated in 2016
    to forecast the 2020 results: hence, some sections of this book feature 2016 data.
    Where feasible, I gathered historical data relevant to the analysis, including
    election data dating back to 1960.


    Voter demographics were delineated by age, gender, education, demographics, and
    race. Issue categories pertinent to the state, including the economy, education,
    environment, healthcare, and gun control, were identified through comprehensive
    research. Moreover, I examined county ballot topics to gauge their potential impact
    on the presidential election.


    Various prediction methodologies and algorithms, including Monte Carlo and Bayes,
    as well as statistical tests like T-test and chi-square, were explored, leveraging
    party voting patterns since 1960, poll accuracy, and electoral votes. In the past,
    FiveThirtyEight and other forecasting platforms were compared, and it was found
    that the prediction made in 2016 was accurate. This project provided valuable
    insights into translating cognitive features into numerical data for analysis,
    culminating in informed decision-making based on trend measurement and pattern
    analysis—a skillset honed through subsequent data science endeavors.


    For this project, I used both SAS and R programming languages. In 2020, I published
    a book, *Learn Data Science Using SAS Studio*, with Apress. The book has been
    a hit and phenomenally successful; therefore, Apress and I decided to rewrite
    it using Python.'
