    \ in Listing [2-7](#619569_1_En_2_Chapter.xhtml#PC7).\n\n1.  tuple(): Convert\
    \ to tuple, as in Listing [2-8](#619569_1_En_2_Chapter.xhtml#PC8).\n\n```\nx =\
    \ list((1, 2, 3))  # x is now [1, 2, 3]\nprint(x)\nListing 2-7\nConvert to list\n\
    ```\n\n1.  set(): Convert to set, as in Listing [2-9](#619569_1_En_2_Chapter.xhtml#PC9).\n\
    \n```\nx = tuple([1, 2, 3])  # x is now (1, 2, 3)\nprint(x)\nListing 2-8\nConvert\
