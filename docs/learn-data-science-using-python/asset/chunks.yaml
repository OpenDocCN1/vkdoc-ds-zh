- fmt: "# Data Science Process\n\nThe data science process initiates by formulating\
    \ a question or hypothesis; then by collecting pertinent raw data; followed by\
    \ data cleaning and exploration; modeling and evaluation; and finally, the deployment,\
    \ visualization, and communication of findings, as illustrated in Figure [1-1](#619569_1_En_1_Chapter.xhtml#Fig1).\n\
    \n![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig1_HTML.jpg)\n\nFigure 1-1\
    \  \nData science process\n\nQuestions in various fields differ, for example,\
    \ in politics, where inquiries revolve around predicting electoral outcomes, like\
    \ whether Trump will win in Maine in 2016 and 2020, or in the context of Facebook,\
    \ for exploration of strategies to increase user engagement.\n\nThe second stage\
    \ involves gathering raw data, manifested by acquiring comprehensive voter information,\
    \ including age, race, education, income, gender, industry, historical ballot\
    \ data, and voting results. The accuracy of the predictions increases when there\
    \ is more historical data. Furthermore, gathering information about population\
    \ distribution over the years is crucial.\n\nSubsequently, the third stage entails\
    \ cleaning the raw data; addressing issues like managing missing values, outliers,\
    \ and repeated rows; and correcting misspellings while standardizing data types\
    \ and formats across columns.\n\nThe fourth stage involves experimenting with\
    \ multiple models and comparing their tailored performance to the given problem.\
    \ For instance, I utilized Monte Carlo and Bayes algorithms in the presidential\
    \ election scenario.\n\nThe final stage involves visualizing and articulating\
    \ the results in accessible language within reports. This step is paramount as\
    \ it culminates in addressing the initial question that instigated the entire\
    \ process, thereby fulfilling the primary objective of the endeavor.\n\n## Case\
    \ Study: Presidential Elections in Maine\n\nAs noted earlier, the data science\
    \ journey commences with a query. In this project’s scope, my inquiry focused\
    \ on determining whether Donald Trump will win the state of Maine during the presidential\
    \ elections of 2016 and 2020 or not.\n\n### Population\n\nThe next step involves\
    \ gathering relevant data extensively. First, I focused on understanding the population\
    \ distribution across Maine’s counties, utilizing information from the US Census\
    \ Bureau. This exploration revealed that population distribution is unique, with\
    \ vast areas either sparsely populated or inhabited by solitary individuals. While\
    \ the tiny dots in the southern region may seem insignificant, each has over 5,000\
    \ people. Thus, be cautious against misinterpretations from maps disseminated\
    \ by presidential campaigns or mainstream media outlets.\n\nSubsequently, the\
    \ logical progression was to acquire voters’ information. While some states offer\
    \ free access to their voters’ databases, Maine operates differently, selling\
    \ such databases exclusively to political parties. Consequently, I contacted the\
    \ Secretary of State’s office for assistance.\n\nIn response, I was informed that\
    \ access to Maine’s Central Voter Registration system required affiliation with\
    \ one of five specific categories: a candidate or campaign representative, a party\
    \ affiliate, a participant in a referendum campaign, an organizer of get-out-the-vote\
    \ efforts, or an elected official for authorized purposes. Costs were determined\
    \ based on the number of records requested, as outlined in Title 21-A, Section\
    \ 196-A. Notably, a statewide voter file comprising one million records incurred\
    \ a fee of $2,200.\n\nFollowing several email exchanges elucidating the research\
    \ nature of my request and providing requisite verifications, the office graciously\
    \ offered a complimentary DVD containing the necessary information, with partial\
    \ data relevant to my research, and the voters’ personal data, such as last names;\
    \ addresses were removed from the datasets.\n\nThe DVD’s primary table features\
    \ voters’ details, as depicted in Figure [1-2](#619569_1_En_1_Chapter.xhtml#Fig2),\
    \ with columns including first name, year of birth, enrollment code, special designations,\
    \ registration date, congressional district, county ID, modification date, and\
    \ last statewide election with VPH.\n\n![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2  \nVoters’ information\n\nThe subsequent table summarizes registered\
    \ and enrolled voters, illustrated in Figure [1-3](#619569_1_En_1_Chapter.xhtml#Fig3).\
    \ Its columns include the county name, municipality name, ward precinct, congressional\
    \ district, state senate district, county commissioner district, party affiliation,\
    \ and total count. Party affiliations documented in the file encompass Democratic,\
    \ Green Independent, Libertarian, Republican, and unenrolled.\n\n![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3  \nRegistered and enrolled voters table\n\nThe initial dataset was\
    \ full of erroneous values and outliers. For instance, one voter’s age was listed\
    \ as 220 years despite their birthdate indicating an age of approximately 67 years—additionally,\
    \ some voter information was entirely blank. As emphasized earlier, it is imperative\
    \ to meticulously clean your data by addressing outliers and missing values, formatting\
    \ inconsistencies, and conducting thorough data exploration. In Chapter [6](#619569_1_En_6_Chapter.xhtml),\
    \ we will perform the data cleaning together in step-by-step labs.\n\nFurthermore,\
    \ I thoroughly searched and gathered data from various sources to ensure I had\
    \ enough historical data. I also obtained additional tables from the US Census\
    \ Bureau website:\n\n[`https://www.census.gov/data/tables/time-series/demo/voting-and-registration/p20-585.html`](https://www.census.gov/data/tables/time-series/demo/voting-and-registration/p20-585.html)\n\
    \nSubsequently, I categorized voters based on gender, age, and race for further\
    \ analysis.\n\n### Gender\n\nAs depicted in Figure [1-4](#619569_1_En_1_Chapter.xhtml#Fig4),\
    \ my analysis revealed that the number of registered female voters surpasses that\
    \ of registered male voters in Maine. However, the percentage disparity between\
    \ the two genders is between ±2%. Regarding the strategic implications for political\
    \ campaigns, representatives could consider leveraging this information by, for\
    \ example, wearing the cancer awareness pink ribbon to resonate with female voters,\
    \ given their historically higher turnout than men. This recommendation highlights\
    \ the significant influence that data and statistics wield, shaping speech topics\
    \ and influencing political representatives’ attire.\n\n![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4  \nMaine registered voters grouped by gender\n\n### Race\n\nConcerning\
    \ racial demographics in Maine, over 96% of the population identifies as white,\
    \ as indicated in Figure [1-5](#619569_1_En_1_Chapter.xhtml#Fig5). Consequently,\
    \ I categorized Black, Asian, and Hispanic voters as non-white registered voters.\n\
    \n![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig5_HTML.jpg)\n\nFigure 1-5\
    \  \nMaine registered voters grouped by race\n\n### Age\n\nIn 2016, there was\
    \ a notable decline in registered voters over 65, as depicted in Figure [1-6](#619569_1_En_1_Chapter.xhtml#Fig6)\
    \ (note the varying scales). Conversely, there was an uptick in the 18–24 and\
    \ 25–44 age brackets. This observation suggests a need for adjustments in speech\
    \ topics to resonate with a broader voter base. For instance, campaign representatives\
    \ should prioritize issues like student loans and home mortgages instead of prioritizing\
    \ medical insurance and retirement funding discussions.\n\n![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig6_HTML.jpg)\n\
    \nFigure 1-6  \nMaine registered voters grouped by age"
  raw: '## Data Science Process


    The data science process initiates by formulating a question or hypothesis; then
    by collecting pertinent raw data; followed by data cleaning and exploration; modeling
    and evaluation; and finally, the deployment, visualization, and communication
    of findings, as illustrated in Figure [1-1](#619569_1_En_1_Chapter.xhtml#Fig1).


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Data science process


    Questions in various fields differ, for example, in politics, where inquiries
    revolve around predicting electoral outcomes, like whether Trump will win in Maine
    in 2016 and 2020, or in the context of Facebook, for exploration of strategies
    to increase user engagement.


    The second stage involves gathering raw data, manifested by acquiring comprehensive
    voter information, including age, race, education, income, gender, industry, historical
    ballot data, and voting results. The accuracy of the predictions increases when
    there is more historical data. Furthermore, gathering information about population
    distribution over the years is crucial.


    Subsequently, the third stage entails cleaning the raw data; addressing issues
    like managing missing values, outliers, and repeated rows; and correcting misspellings
    while standardizing data types and formats across columns.


    The fourth stage involves experimenting with multiple models and comparing their
    tailored performance to the given problem. For instance, I utilized Monte Carlo
    and Bayes algorithms in the presidential election scenario.


    The final stage involves visualizing and articulating the results in accessible
    language within reports. This step is paramount as it culminates in addressing
    the initial question that instigated the entire process, thereby fulfilling the
    primary objective of the endeavor.


    ## Case Study: Presidential Elections in Maine


    As noted earlier, the data science journey commences with a query. In this project’s
    scope, my inquiry focused on determining whether Donald Trump will win the state
    of Maine during the presidential elections of 2016 and 2020 or not.


    ### Population


    The next step involves gathering relevant data extensively. First, I focused on
    understanding the population distribution across Maine’s counties, utilizing information
    from the US Census Bureau. This exploration revealed that population distribution
    is unique, with vast areas either sparsely populated or inhabited by solitary
    individuals. While the tiny dots in the southern region may seem insignificant,
    each has over 5,000 people. Thus, be cautious against misinterpretations from
    maps disseminated by presidential campaigns or mainstream media outlets.


    Subsequently, the logical progression was to acquire voters’ information. While
    some states offer free access to their voters’ databases, Maine operates differently,
    selling such databases exclusively to political parties. Consequently, I contacted
    the Secretary of State’s office for assistance.


    In response, I was informed that access to Maine’s Central Voter Registration
    system required affiliation with one of five specific categories: a candidate
    or campaign representative, a party affiliate, a participant in a referendum campaign,
    an organizer of get-out-the-vote efforts, or an elected official for authorized
    purposes. Costs were determined based on the number of records requested, as outlined
    in Title 21-A, Section 196-A. Notably, a statewide voter file comprising one million
    records incurred a fee of $2,200.


    Following several email exchanges elucidating the research nature of my request
    and providing requisite verifications, the office graciously offered a complimentary
    DVD containing the necessary information, with partial data relevant to my research,
    and the voters’ personal data, such as last names; addresses were removed from
    the datasets.


    The DVD’s primary table features voters’ details, as depicted in Figure [1-2](#619569_1_En_1_Chapter.xhtml#Fig2),
    with columns including first name, year of birth, enrollment code, special designations,
    registration date, congressional district, county ID, modification date, and last
    statewide election with VPH.


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Voters’ information


    The subsequent table summarizes registered and enrolled voters, illustrated in
    Figure [1-3](#619569_1_En_1_Chapter.xhtml#Fig3). Its columns include the county
    name, municipality name, ward precinct, congressional district, state senate district,
    county commissioner district, party affiliation, and total count. Party affiliations
    documented in the file encompass Democratic, Green Independent, Libertarian, Republican,
    and unenrolled.


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Registered and enrolled voters table


    The initial dataset was full of erroneous values and outliers. For instance, one
    voter’s age was listed as 220 years despite their birthdate indicating an age
    of approximately 67 years—additionally, some voter information was entirely blank.
    As emphasized earlier, it is imperative to meticulously clean your data by addressing
    outliers and missing values, formatting inconsistencies, and conducting thorough
    data exploration. In Chapter [6](#619569_1_En_6_Chapter.xhtml), we will perform
    the data cleaning together in step-by-step labs.


    Furthermore, I thoroughly searched and gathered data from various sources to ensure
    I had enough historical data. I also obtained additional tables from the US Census
    Bureau website:


    [`https://www.census.gov/data/tables/time-series/demo/voting-and-registration/p20-585.html`](https://www.census.gov/data/tables/time-series/demo/voting-and-registration/p20-585.html).


    Subsequently, I categorized voters based on gender, age, and race for further
    analysis.


    ### Gender


    As depicted in Figure [1-4](#619569_1_En_1_Chapter.xhtml#Fig4), my analysis revealed
    that the number of registered female voters surpasses that of registered male
    voters in Maine. However, the percentage disparity between the two genders is
    between ±2%. Regarding the strategic implications for political campaigns, representatives
    could consider leveraging this information by, for example, wearing the cancer
    awareness pink ribbon to resonate with female voters, given their historically
    higher turnout than men. This recommendation highlights the significant influence
    that data and statistics wield, shaping speech topics and influencing political
    representatives’ attire.


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    Maine registered voters grouped by gender


    ### Race


    Concerning racial demographics in Maine, over 96% of the population identifies
    as white, as indicated in Figure [1-5](#619569_1_En_1_Chapter.xhtml#Fig5). Consequently,
    I categorized Black, Asian, and Hispanic voters as non-white registered voters.


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Maine registered voters grouped by race


    ### Age


    In 2016, there was a notable decline in registered voters over 65, as depicted
    in Figure [1-6](#619569_1_En_1_Chapter.xhtml#Fig6) (note the varying scales).
    Conversely, there was an uptick in the 18–24 and 25–44 age brackets. This observation
    suggests a need for adjustments in speech topics to resonate with a broader voter
    base. For instance, campaign representatives should prioritize issues like student
    loans and home mortgages instead of prioritizing medical insurance and retirement
    funding discussions.


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Maine registered voters grouped by age'
  trans: "\n# 数据科学流程\n\n数据科学流程始于提出一个问题或假设；接着收集相关的原始数据；随后进行数据清洗与探索；建模与评估；最后是部署、可视化以及沟通研究发现，如图\
    \ 1-1 所示。\n\n![](img/619569_1_En_1_Fig1_HTML.jpg)\n\n图 1-1  \n数据科学流程\n\n不同领域的问题各不相同，例如在政治领域，问题围绕预测选举结果展开，比如特朗普是否会在\
    \ 2016 年和 2020 年赢得缅因州；或者在 Facebook 的背景下，探索提高用户参与度的策略。\n\n第二阶段涉及收集原始数据，具体表现为获取全面的选民信息，包括年龄、种族、教育程度、收入、性别、行业、历史投票数据以及投票结果。历史数据越多，预测的准确性就越高。此外，收集多年的人口分布信息也至关重要。\n\
    \n随后，第三阶段需要对原始数据进行清洗；处理缺失值、异常值和重复行等问题；纠正拼写错误，同时标准化各列的数据类型和格式。\n\n第四阶段涉及尝试多种模型，并比较它们针对特定问题的定制化表现。例如，在总统选举场景中，我使用了蒙特卡洛和贝叶斯算法。\n\
    \n最后一个阶段是在报告中以通俗易懂的语言将结果进行可视化和阐述。这一步至关重要，因为它最终回答了启动整个流程的初始问题，从而实现了这项工作的首要目标。\n\
    \n## 案例研究：缅因州总统选举\n\n如前所述，数据科学之旅始于一个疑问。在本项目的范围内，我的疑问聚焦于确定唐纳德·特朗普是否会在 2016 年和 2020\
    \ 年的总统选举中赢得缅因州。\n\n### 人口\n\n下一步是广泛收集相关数据。首先，我利用美国人口普查局的信息，重点了解了缅因州各县的人口分布情况。这一探索揭示出人口分布非常独特，大片区域要么人口稀少，要么只有零星的居民。虽然南部地区的小点看似微不足道，但每个点都代表着超过\
    \ 5000 人。因此，要警惕总统竞选团队或主流媒体发布的地图可能带来的误解。\n\n接下来，合乎逻辑的步骤是获取选民信息。虽然有些州免费提供选民数据库，但缅因州的做法不同，它只向政党出售此类数据库。因此，我联系了州务卿办公室寻求帮助。\n\
    \n作为回应，我被告知要访问缅因州的中央选民登记系统，必须隶属于以下五个特定类别之一：候选人或竞选代表、政党成员、公投竞选参与者、动员投票活动的组织者，或为授权目的服务的民选官员。费用根据请求的记录数量确定，详见第\
    \ 21-A 章第 196-A 节。值得注意的是，包含一百万条记录的州级选民档案费用为 2,200 美元。\n\n在通过几封电子邮件阐明我请求的研究性质并提供必要的验证后，该办公室慷慨地提供了一张免费的\
    \ DVD，其中包含必要的信息，包括与我研究相关的部分数据，而选民的个人数据，如姓氏和地址，已从数据集中移除。\n\n该 DVD 的主表列出了选民的详细信息，如图\
    \ 1-2 所示，列包括名字、出生年份、注册代码、特殊指定、注册日期、国会选区、县 ID、修改日期以及最近一次有 VPH 的州级选举。\n\n![](img/619569_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2  \n选民信息\n\n接下来的表格汇总了已注册和已登记的选民，如图 1-3 所示。其列包括县名、市镇名、选区、国会选区、州参议院选区、县专员选区、党派归属以及总人数。文件中记录的党派归属包括民主党、绿党独立派、自由意志党、共和党以及无党派。\n\
    \n![](img/619569_1_En_1_Fig3_HTML.jpg)\n\n图 1-3  \n已注册和已登记选民表\n\n最初的数据集充满了错误值和异常值。例如，一位选民的年龄被列为\
    \ 220 岁，尽管其出生日期显示年龄大约为 67 岁。此外，一些选民信息完全是空白的。正如之前强调的，必须通过处理异常值和缺失值、格式不一致问题，并进行彻底的数据探索来仔细清洗数据。在第\
    \ 6 章中，我们将通过逐步实验一起进行数据清洗。\n\n此外，我彻底搜索并从各种来源收集数据，以确保拥有足够的历史数据。我还从美国人口普查局网站获取了额外的表格：\n\
    \n[`https://www.census.gov/data/tables/time-series/demo/voting-and-registration/p20-585.html`](https://www.census.gov/data/tables/time-series/demo/voting-and-registration/p20-585.html)\n\
    \n随后，我根据性别、年龄和种族对选民进行分类，以便进一步分析。\n\n### 性别\n\n如图 1-4 所示，我的分析显示，在缅因州，注册的女性选民数量超过了注册的男性选民。然而，两性之间的百分比差异在\
    \ ±2% 之间。就政治竞选活动的战略意义而言，代表们可以考虑利用这一信息，例如，佩戴癌症意识粉红丝带以引起女性选民的共鸣，因为历史上她们的投票率高于男性。这一建议凸显了数据和统计的巨大影响力，它们能够塑造演讲主题并影响政治代表的着装。\n\
    \n![](img/619569_1_En_1_Fig4_HTML.jpg)\n\n图 1-4  \n按性别分组的缅因州注册选民\n\n### 种族\n\n\
    关于缅因州的种族人口统计数据，超过 96% 的人口被认定为白人，如图 1-5 所示。因此，我将黑人、亚裔和西班牙裔选民归类为非白人注册选民。\n\n![](img/619569_1_En_1_Fig5_HTML.jpg)\n\
    \n图 1-5  \n按种族分组的缅因州注册选民\n\n### 年龄\n\n2016 年，65 岁以上的注册选民数量显著下降，如图 1-6 所示（注意纵坐标刻度不同）。相反，18-24\
    \ 岁和 25-44 岁年龄段的选民数量有所增加。这一观察结果表明，需要调整演讲主题以引起更广泛选民基础的共鸣。例如，竞选代表应优先关注学生贷款和住房抵押贷款等问题，而不是优先讨论医疗保险和退休金。\n\
    \n![](img/619569_1_En_1_Fig6_HTML.jpg)\n\n图 1-6  \n按年龄分组的缅因州注册选民\n"
- fmt: '### Voter Turnout


    I examined historical voter turnout to gauge the number of individuals who braved
    Maine’s snowy streets to cast their votes. Figure [1-7](#619569_1_En_1_Chapter.xhtml#Fig7)
    illustrates voter turnout percentages from 2000 to 2016, with the Democratic Party
    emerging as the victor.


    If you try this exercise with a swing party, the columns’ colors will change to
    reflect the winning party.


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Maine voter turnout 2000–2016


    Once more, I examined the voter turnout patterns categorized by the winning party
    and by age, race, and gender groups. In Figure [1-8](#619569_1_En_1_Chapter.xhtml#Fig8),
    the letter D denotes the Democratic Party, R signifies the Republican Party, and
    O represents all other parties combined.


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    Maine voter turnout according to party, age, race, and gender groupings


    ### Winning Candidates in 2012


    I began delving into the data by constructing a histogram illustrating candidates
    and their respective winning percentages in the 2012 Maine election. The analysis
    revealed a substantial victory for Barack Obama over Mitt Romney, with other candidates
    receiving minimal votes, as depicted in Figure [1-9](#619569_1_En_1_Chapter.xhtml#Fig9).
    Chapter [3](#619569_1_En_3_Chapter.xhtml) provides a detailed, step-by-step guide
    on replicating Figure [1-9](#619569_1_En_1_Chapter.xhtml#Fig9).


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    Histogram of candidates and their winning percentages in 2012


    I then attempted to represent the data geographically, delineating it by county.
    Figure [1-10](#619569_1_En_1_Chapter.xhtml#Fig10) illustrates Democratic-leaning
    counties with the darkest shade, contrasting with Republican-held regions depicted
    in a lighter hue from 2000 to 2016. However, it is essential to remember that
    geographical areas do not necessarily correlate with population density in Maine.


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig10_HTML.jpg)


    Figure 1-10


    Map of how Maine’s counties voted in the presidential elections in years 2000–2016


    ## Categories/Issues


    Each presidential election debate addresses pertinent issues and elucidates each
    candidate’s proposed approach. These strategies can sway voter opinions and influence
    their decision-making based on topics. Consequently, it is imperative to examine
    these issues thoroughly.


    ### Issues Facing the Country


    According to CNN’s report in 2016, Maine voters considered foreign policy, immigration,
    economy, and terrorism the most pressing national concerns. However, it is noteworthy
    that these issues may not directly reflect Maine’s challenges. As the map indicates,
    Maine’s local context is not significantly impacted by foreign policy matters.


    Based on the race statistics, it is evident that Maine has a minimal immigrant
    population. A brief inquiry into any terrorist incidents in Maine yielded no results
    till the time of that project in 2016. However, the economy emerged as a persistent
    global concern. Consequently, I commenced exploring Maine-specific issues documented
    in the ballots.


    ### Categories: Issues Facing Maine


    I accessed a list of ballots outlined in Table [1-1](#619569_1_En_1_Chapter.xhtml#Tab1)
    on the Ballotpedia website.


    Table 1-1


    The Issues Facing Maine Residents^([¹](#fn1),[²](#fn2))


    | 2000 | 2004 | 2008 | 2012 | 2016 |

    | --- | --- | --- | --- | --- |

    | Assisted death | Education | Bonds | Marriage | Marijuana |

    | Business | Taxes | Taxes | Education | Education |

    | Lottery | Hunt and fish | Gambling | Water | Firearms |

    | Taxes |   | Water | Transportation | Economics |

    | Suffrage |   | Transportation | Bond issues | Elections |

    | LGBT |   |   |   | Bonds |

    | Fishing |   |   |   |   |


    It became apparent that specific issues, such as fishing, bonds, water, education,
    and taxes, persist unresolved over time. This finding led me to infer that Maine
    grapples with water resources and taxation challenges. Once again, I underscored
    the importance of presidential campaign speeches addressing these specific issues
    by proposing viable solutions or plans. Addressing these concerns directly in
    speeches could sway Maine’s voters.


    Based on the information gathered, a review of local newspapers, and the most
    repeated topics discussed and unresolved on Maine ballots, I anticipate the primary
    five issues in Maine for 2020 to be


    1.  Education


    2.  Economics


    3.  Bonds


    4.  Healthcare


    5.  Taxes


    ## Factors Affecting Maine’s Economy


    When discussing the economy, it is imperative to identify sources of income. According
    to information from the *Portland Press Herald* and revenue datasets available
    on the Maine.gov website^([³](#fn3)), the income sources include


    1.  Agriculture


    2.  Forestry


    3.  Fishing


    4.  Hunting


    5.  Taxes


    6.  Management of companies and enterprises


    7.  The finance and insurance sector


    ### Comparing the Unemployment Rate of Maine to That of the Rest of the States


    Donald Trump pledged to create more job opportunities and bring manufacturing
    companies back to the United States instead of outsourcing them. Numerous news
    sources suggested that his emphasis on job creation influenced the voting decisions
    of Rust Belt states in favor of him over Hillary Clinton. I sought to examine
    the unemployment rate in Maine and compare it to national figures to assess the
    potential resonance of Trump’s promise to Maine voters. It emerged that Maine
    did not experience significant unemployment issues in 2016. Therefore, Trump’s
    promise might appeal less to Maine voters than in certain other states.


    ### Median Income for Maine


    For greater precision and research objectives, I referenced the median income
    data for Maine. I juxtaposed it with the median income of the entire United States.
    As indicated in Table [1-2](#619569_1_En_1_Chapter.xhtml#Tab2), from 2005 to 2015,
    Maine’s median income remained slightly lower than the national average. Nevertheless,
    there was a notable increase in the three years leading to the elections.


    Table 1-2


    Historical Real Median Household Income for Maine^([⁴](#fn4))


    | Date | US | Maine |

    | --- | --- | --- |

    | 2018 | $61,937 | $55,602 |

    | 2017 | $61,807 | $57,649 |

    | 2016 | $60,291 | $55,542 |

    | 2015 | $59,116 | $54,578 |

    | 2014 | $56,969 | $52,515 |

    | 2013 | $56,415 | $50,718 |

    | 2012 | $56,288 | $51,180 |

    | 2011 | $56,507 | $51,507 |

    | 2010 | $57,762 | $52,878 |

    | 2009 | $58,921 | $53,657 |

    | 2008 | $60,829 | $54,459 |

    | 2007 | $61,601 | $55,710 |

    | 2006 | $60,490 | $54,233 |

    | 2005 | $59,604 | $55,168 |


    ### How Did Exit Polls Show the Income Factor in the 2016 Election in Maine?


    Viewed from a different angle, CNN reported that exit polls indicated a strong
    inclination for Clinton among Maine voters, except those earning salaries between
    $30,000 and $50,000. Interestingly, this demographic favored Trump. However, they
    constituted only 19% of the surveyed sample. Consequently, the prevailing sentiment
    in Maine leaned toward supporting Clinton.'
