    ## 追加


    追加数据集等同于垂直合并，即增加行。在 Python 中，你可以使用 `pandas` 库对 DataFrame 进行垂直和水平合并。在本节中，我们将追加两个数据集：`democrats`
    和 `republicans`，这两个数据集是在上一节中创建的。下一节将给出一个水平合并的示例。


    在通过清单 6-10 追加数据集之前，必须先运行清单 6-9 来加载民主党和共和党的数据集。


    ```

    import pandas as pd

    # 垂直连接 DataFrame

    vertical_merged_df = pd.concat([democrats,republicans ], axis=0)

    print("新数据框的大小=",vertical_merged_df.shape)

    print("垂直合并结果:")

    print(vertical_merged_df.iloc[:,:6])

    清单 6-10

    追加两个数据集

    ```


    在清单 6-10 中，我们使用 `pd.concat()` 方法垂直合并 DataFrame；换句话说，就是将它们堆叠在一起。`axis=0` 选项指定了连接应沿着行方向进行。这意味着
    `republicans` DataFrame 的行会被添加到 `democrats` DataFrame 的行中，从而生成一个包含两个 DataFrame
    所有行的新 DataFrame。这个包含两个数据集所有行的最新数据集被称为 `vertical_merged_df`。


    为了验证两个数据集的行是否都在新数据集中，我们使用 `vertical_merged_df.shape` 属性检查其维度。它会返回一个表示 DataFrame
    维度的元组，显示数据集的大小、行数和列数。图 6-10 显示大小为 `(48,9)`，表明追加操作正确，因为每个数据集都有 24 行，如上一节的频率表所示。


    为了使输出看起来更美观，我们只显示前六列，以便标题保持在一行，避免某些列延续到下一行造成混淆。因此，我们使用 `vertical_merged_df.iloc[:,
    :6]` 通过 `iloc` 方法选择连接后 DataFrame 的前六列。它使用基于整数的索引，其中 `:` 表示所有行，`:6` 表示前六列。这样，我们打印出
    DataFrame 的选定子集，仅显示新 DataFrame 中所有行的前六列。


    ![](img/619569_1_En_6_Fig10_HTML.jpg)


    图 6-10


    将两个数据集追加为一个


    你也可以通过设置 `axis=1`，使用 `pd.concat()` 水平合并 DataFrame（并排放置）。


    ## 合并


    在上一节中，我们学习了如何追加两个数据集以增加行数。在本节中，我们将学习如何基于一个公共变量合并两个数据集，其中一个数据集包含许多变量，另一个只包含少数几个变量。


    在本例中，我们将使用 Zillow 发布的一个 Kaggle 竞赛数据集来进行房价预测。该竞赛包含两个数据集。“多变量”数据集从一个名为 `properties_2016.csv`
    的 CSV 文件中加载，包含 58 列和约三百万行。“少变量”数据集从另一个名为 `train_2016_v2.csv` 的 CSV 文件中加载，包含三列和超过
    9 万行。两个文件之间的公共变量是 `parcelid`。你可以通过以下链接下载原始数据集：[`https://www.kaggle.com/competitions/zillow-prize-1/data`](https://www.kaggle.com/competitions/zillow-prize-1/data)。


    由于这些文件体积巨大，我只从第一个文件中选取了 3000 行，从第二个文件中选取了 1000 行，并将它们命名为 `many.csv` 和 `few.csv`。你可以在数据集文件夹中找到它们。


    ```

    import pandas as pd

    file1 = pd.read_csv(''../Datasets/Chapter 6/many.csv'', low_memory=False)

    file2 = pd.read_csv(''../Datasets/Chapter 6/few.csv'', low_memory=False)

    print("\n 多变量数据集维度:\n",file1.shape)

    print("\n 少变量数据集维度:\n",file2.shape)

    zillow_merged = pd.merge(file1, file2, on=''parcelid'')

    print("\n 合并后数据集维度:\n",zillow_merged.shape)

    print("\n 合并后数据集头部:\n",zillow_merged.head())

    清单 6-11

    合并少变量到多变量数据集

    ```


    在清单 6-11 中，我们在加载数据集时使用了 `low_memory=False` 选项以避免分块读取。将此参数设置为 `False` 会使 Pandas
    在解析之前将整个文件读入内存。当列包含混合类型时，这可以通过允许 Pandas 更准确地推断正确的数据类型来发挥作用。你也可以在加载数据后，通过循环并修复导致错误的列的混合数据类型来手动检查和转换列。但这超出了本练习的范围，因此我们直接使用该参数即可。


    为了基于一个关键变量水平连接 DataFrame，我们使用 `pd.merge()` 方法，并在 `on` 参数中指定 `parcelid` 作为关键变量。默认情况下，merge
    方法使用内连接。因此，它只保留 `parcelid` 同时存在于 `file1` 和 `file2` 中的行。这就是为什么生成的 DataFrame 的行数接近
    `file2` 的 1004 行。多出的四行是由于 `parcelid` 存在重复值。


    你可以使用以下语句删除重复值：


    ```

    file1 = file1.drop_duplicates(subset=''parcelid'')

    file2 = file2.drop_duplicates(subset=''parcelid'')

    ```


    如果你想包含 `file1` 中的所有行，无论 `file2` 中是否有匹配的 `parcelid`，你可以使用多种类型的连接，例如左连接。语句将是 `zillow_merged
    = pd.merge(file1, file2, on="parcelid", how="left")`。不匹配的列将显示为 `NaN`。在这种情况下，合并后的
    DataFrame 的行数将接近“多变量”文件的行数，即 3000 行。


    Python 中的合并操作很简单，不需要像其他语言那样按关键标识符进行排序。


    输出结果如图 6-11 所示。


    ![](img/619569_1_En_6_Fig11_HTML.jpg)


    图 6-11


    合并少变量到多变量数据集


    ## 总结


    本章解释了为分析而清理和准备数据的步骤。它讨论了如何重命名变量以及调整报告的格式。还解释了如何创建新变量以及如何在数据集中重新排列它们。它解释了 IF 和
    IF-ELIF 语句。此外，还描述了如何删除行和列、子集化数据集，以及追加和合并多个数据集。至此，我们已经完成了最常见的数据分析任务，下一章将介绍如何使用回归进行预测。


    # 7. 回归


    线性回归任务拟合一个线性模型，用于根据一个或多个连续或分类预测变量来预测单个连续的因变量。该任务会生成用于解释结果的统计数据和图表。

