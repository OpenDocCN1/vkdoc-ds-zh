    ## Bubble Chart


    The bubble chart is useful in displaying three variables of data at a time. In
    this example, we will create a bubble chart to display the height, weight, and
    the age of a class.


    For this example, I generated random data for the class, as shown in Listing [3-7-1](#619569_1_En_3_Chapter.xhtml#PC18),
    to function as a third data source in this chapter.


    ```

    import pandas as pd

    import numpy as np

    import matplotlib.pyplot as plt

    # Generate a dataset for 20 students

    np.random.seed(42)  # Set seed for reproducibility

    students_data = {

    ''Name'': [f''Student{i}'' for i in range(1, 21)],

    ''Height'': np.random.uniform(150, 190, 20),  # Heights in centimeters

    ''Weight'': np.random.uniform(45, 90, 20),   # Weights in kilograms

    ''Age'': np.random.randint(18, 25, 20)        # Ages in years

    }

    students_df = pd.DataFrame(students_data)

    # Create a bubble chart

    plt.figure(figsize=(12, 8))

    # Adjust the scaling factor for bubble sizes

    scaling_factor = 500

    scatter = plt.scatter(students_df[''Height''], students_df[''Weight''], s=students_df[''Age'']
    * scaling_factor, c=students_df[''Age''], cmap=''viridis'', alpha=0.7)

    # Annotate each point with student name

    for i, name in enumerate(students_df[''Name'']):

    plt.text(students_df[''Height''][i], students_df[''Weight''][i], name, ha=''center'',
    va=''center'', fontsize=8, color=''black'', alpha=0.7)

    # Add labels and title

    plt.xlabel(''Height (cm)'')

    plt.ylabel(''Weight (kg)'')

    plt.title(''Bubble Chart: Height vs Weight with Age as Bubble Size and Student
    Names'')

    # Add colorbar

    cbar = plt.colorbar(scatter)

    cbar.set_label(''Age (years)'')

    # Display the bubble chart

    plt.show()

