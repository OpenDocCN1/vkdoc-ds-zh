    # 4. Statistical Analysis and Linear Models


    In Chapter [3](#619569_1_En_3_Chapter.xhtml), we explored graph and data visualization.
    In Chapter [4](#619569_1_En_4_Chapter.xhtml), we will explore statistics and linear
