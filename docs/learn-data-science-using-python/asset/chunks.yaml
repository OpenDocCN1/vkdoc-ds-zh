- fmt: '## Append


    Appending datasets is the same as vertical merging, which means adding rows. In
    Python, you can merge DataFrames both vertically and horizontally using the `pandas`
    library. In this section, we will append the two datasets, `democrats` and `republicans`,
    datasets that we created in the previous section. In the next section, we will
    have an example of horizontal merging.


    You must run Listing [6-9](#619569_1_En_6_Chapter.xhtml#PC10) first to load the
    Democratic and Republican datasets before appending them using Listing [6-10](#619569_1_En_6_Chapter.xhtml#PC11).


    ```

    import pandas as pd

    # Concatenate DataFrames vertically

    vertical_merged_df = pd.concat([democrats,republicans ], axis=0)

    print("The size of the new dataframe=",vertical_merged_df.shape)

    print("Vertical Merge Result:")

    print(vertical_merged_df.iloc[:,:6])

    Listing 6-10

    Append two datasets

    ```


    In Listing [6-10](#619569_1_En_6_Chapter.xhtml#PC11), we use the `pd.concat()`
    method to merge DataFrames vertically; in other words, stacking them on top of
    each other. The option of `axis=0` specifies that the concatenation should be
    performed along rows. This means rows from the `republicans` DataFrame are added
    to the rows of the `democrats` DataFrame, resulting in a new DataFrame that contains
    all rows from both DataFrames. The new latest dataset that has rows of both datasets
    is called `vertical_merged_df`.


    To verify that the rows of the two datasets are in the new one, we check its dimensions
    by using the `vertical_merged_df.shape` property. It returns a tuple representing
    the dimensions of the DataFrame. It shows the dataset size, number of rows, and
    columns. Figure [6-10](#619569_1_En_6_Chapter.xhtml#Fig10) shows that the size
    is `(48,9)` indicating that the append occurred correctly because each has 24
    rows, as was shown in the frequency table in the previous section.


    To make the output look nice, we display the first six columns only to have one
    line header and avoid confusion by some columns continuing on the following lines.
    Therefore, we use `vertical_merged_df.iloc[:, :6]` to select the first six columns
    of the concatenated DataFrame using the `iloc` method. It uses integer-based indexing,
    where `:` indicates all rows and `:6` indicates the first six columns. So, we
    print the selected subset of the DataFrame, displaying the first six columns only
    for all rows in the new DataFrame.


    ![](images/619569_1_En_6_Chapter/619569_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Appending two datasets in one


    You can also use `pd.concat()` to merge DataFrames horizontally (side by side)
    by setting the `axis=1`.


    ## Merge


    In the previous section, we learned how to append two datasets and increase the
    rows. In this section, we will learn how to merge two datasets over one common
    variable, where one has many variables and the other has a few ones.


    In this example, we will use the datasets of a Kaggle competition posted by Zillow
    to make house predictions. The contest has two datasets. The Many dataset is loaded
    from a CSV file called `properties_2016.csv`, which contains 58 columns and about
    three million rows. The Few dataset is loaded from another CSV file called `train_2016_v2.csv`,
    which contains three columns and more than 90K rows. The common variable between
    both files is `parcelid`. You can download the original datasets from this link:
    [`https://www.kaggle.com/competitions/zillow-prize-1/data`](https://www.kaggle.com/competitions/zillow-prize-1/data).


    As the sizes of these files are enormous, I selected only 3000 rows from the first
    file and 1000 rows from the second file and named them `many.csv` and `few.csv`.
    You will find them in the Datasets Folder.


    ```

    import pandas as pd

    file1 = pd.read_csv(''../Datasets/Chapter 6/many.csv'', low_memory=False)

    file2 = pd.read_csv(''../Datasets/Chapter 6/few.csv'', low_memory=False)

    print("\nThe Many Dataset Dimensions:\n",file1.shape)

    print("\nThe Few Dataset Dimensions:\n",file2.shape)

    zillow_merged = pd.merge(file1, file2, on=''parcelid'')

    print("\nThe Merged Dataset dimensions:\n",zillow_merged.shape)

    print("\nThe Merged Dataset Head:\n",zillow_merged.head())

    Listing 6-11

    Merge a few-to-many datasets

    ```


    In Listing [6-11](#619569_1_En_6_Chapter.xhtml#PC12), we use `low_memory=False`
    option when loading the datasets to avoid chunking. Setting this parameter to
    `False` makes Pandas read the entire file into memory before parsing it. This
    can be used when columns have mixed types by allowing Pandas to infer the correct
    data types more accurately. You can also manually inspect and convert the columns
    after loading the data by looping and fixing the mixed datatypes of the columns
    that cause errors. However, this is beyond the scope of this exercise, so that
    we will use the parameter, and that is it.


    To concatenate the DataFrames horizontally on a key variable, we use the `pd.merge()`
    method and specify `parcelid` as the key variable in the `on` parameter. By default,
    the merge method uses Inner Join. So, it only keeps the rows where the `parcelid`
    exists in `file1` and `file2`. This is why the resulting DataFrame has the number
    of rows close to `file2`, which is 1004. The extra four rows are due to duplicates
    in the `parcelid`.


    You can remove the duplicates by using these statements:


    ```

    file1 = file1.drop_duplicates(subset=''parcelid'')

    file2 = file2.drop_duplicates(subset=''parcelid'')

    ```


    If you want to include all rows from `file1` regardless of whether there is a
    matching `parcelid` in `file2`, you can use several types of joins, such as a
    Left Join. The statement will be `zillow_merged = pd.merge(file1, file2, on="parcelid",
    how="left").` You will have `NaN` for the nonmatching columns. The merged DataFrame,
    in such case, will have about the number of rows as the Many file, which is 3000
    rows.


    Merging in Python is easy and does not require sorting by the key identifier as
    in other languages.


    The output is shown in Figure [6-11](#619569_1_En_6_Chapter.xhtml#Fig11).


    ![](images/619569_1_En_6_Chapter/619569_1_En_6_Fig11_HTML.jpg)


    Figure 6-11


    Merging few-to-many datasets


    ## Summary


    This chapter explains the steps to clean and prepare data for analysis. It discusses
    how to rename the variable and adjust the reports’ formatting. It also explains
    how to create new variables and how to rearrange them in datasets. It explains
    the IF and IF-ELIF statements. Moreover, it describes how to drop a row and a
    column, subset a dataset, and append and merge multiple datasets. Now, we are
    done with the most common data analysis tasks, and the next chapter will introduce
    predicting the future using regression.


    # 7. Regression


    The linear regression task fits a linear model to predict a single continuous
    dependent variable from one or more continuous or categorical predictor variables.
    This task produces statistics and graphs for interpreting the results.'
