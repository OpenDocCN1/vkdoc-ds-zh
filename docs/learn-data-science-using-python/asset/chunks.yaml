    ![](images/619569_1_En_7_Chapter/619569_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Exploring S and P index


    Despite these three values acting as outliers, we cannot exclude them because
    they have a direct impact on how public might vote. Next, as we did in the previous
