    to be dropped. In Pandas, `axis=0` refers to rows, and `axis=1` refers to columns.
    The option `inplace=True` modifies the original DataFrame `df` directly and does
    not create a new DataFrame with the new values.


    We print the DataFrame header and size before and after dropping the column to
    verify that the number of columns decreased from 9 to 8, as shown in Figure [6-8](#619569_1_En_6_Chapter.xhtml#Fig8).


    ![](images/619569_1_En_6_Chapter/619569_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Eight columns after dropping one


    ## Subset


    There are multiple ways to subset the Pandas DataFrames in Python. One of them
    is Boolean indexing. In this example, we continue using the dataset of the previous
    sections, Voters_A.CSV. We want to create two new datasets as subsets of the original,
    where the first one contains only voters who are enrolled as Democrats and the
    other includes voters who are enrolled as Republicans.


    ```

    import pandas as pd

    import numpy as np

    df = pd.read_csv(''../Datasets/Chapter 6/Voters_A.csv'')

    democrats=df[df[''ENROLL'']=="D"]

    print(democrats.iloc[:,:6].head())

    print(democrats.shape)

    republicans=df[df[''ENROLL'']=="R"]

    print(republicans.iloc[:,:6].head())

    print(republicans.shape)

    frequency_table = df[''ENROLL''].value_counts().reset_index().rename(columns={''index'':
    ''ENROLL'', ''ENROLL'': ''Frequency''})

    frequency_table = frequency_table.sort_values(by=''Frequency'', ascending=False)

    print(frequency_table)

    Listing 6-9

    Subset the dataset

    ```


    In Listing [6-9](#619569_1_En_6_Chapter.xhtml#PC10), after importing the library
    and loading the dataset, we use `df[df[''ENROLL''] == "D"]` to filter the DataFrame
    to include only the rows where the `ENROLL` column is equal to "`D`." This subset
    is stored in the `democrats` DataFrame.


    To print the first six columns of the `democrats` DataFrame, we use `democrats.iloc[:,
    :6].head().` The `iloc` property is used for indexing rows and columns. We used
    it here to select the first six columns. To get the number of Democratic voters
    in this dataset, we use `democrats.shape`.


    We repeat the same steps for the Republican party. Then, at the end, we print
    the frequency table to compute all the unique levels of the `ENROLL` column and
    the number of the frequency of each level in this dataset. We use `df[''ENROLL''].value_counts()`
    to calculate the frequency of each unique value in the `ENROLL` column. The `reset_index()`
    method converts the resulting Series into a DataFrame and resets the index. The
    `rename(columns={''index'': ''ENROLL'', ''ENROLL'': ''Frequency''})` method is
    to rename the columns to ENROLL and Frequency for clarity. Finally, the method
    `sort_values(by=''Frequency'', ascending=False)` sorts the DataFrame by the `Frequency`
    column in descending order.


    Figure [6-9](#619569_1_En_6_Chapter.xhtml#Fig9) shows the first five rows of both
    smaller datasets, and the frequency table shows how many times each enrollment
    type appears in the dataset.


    ![](images/619569_1_En_6_Chapter/619569_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Subset output and the frequency table'
