    (Patterns)


    Finally, the final phase of the project involved gathering historical data from
    previous elections to inform the subsequent modeling and prediction steps. As
    previously stated, I concentrated exclusively on Democrats and Republicans, given
    that other parties garnered negligible percentages in the 2012 elections.


    Table 1-3


    The Historical Results of Past Presidential Elections in Maine^([⁵](#fn5),[⁶](#fn6))


    | Year | D | D% | R | R% |

    | --- | --- | --- | --- | --- |

    | 2016 | **357,735** | **47.80%** | 335,593 | 44.90% |

    | 2012 | **401,306** | **56.27%** | 292,276 | 40.98% |

    | 2008 | **421,923** | **57.71%** | 295,273 | 40.38% |

    | 2004 | **396,842** | **53.57%** | 330,201 | 44.58% |

    | 2000 | **319,951** | **49.10%** | 286,616 | 44.00% |

    | 1996 | **312,788** | **51.60%** | 186,378 | 30.80% |

    | 1992 | **263,420** | **38.80%** | 206,820 | 30.40% |

    | 1988 | 243,569 | 43.90% | **307,131** | **55.30%** |

    | 1984 | 214,515 | 38.80% | **336,500** | **60.80%** |

    | 1980 | 220,974 | 42.30% | **238,522** | **45.60%** |

    | 1976 | 232,279 | 48.07% | **236,320** | **48.91%** |

    | 1972 | 160,584 | 38.50% | **256,458** | **61.50%** |

    | 1968 | **217,312** | **55.30%** | 169,254 | 43.10% |

    | 1964 | **62,264** | **68.84%** | 118,701 | 31.16% |

    | 1960 | **181,159** | **42.95%** | 240,608 | 57.05% |


    Upon reviewing the data presented in Table [1-3](#619569_1_En_1_Chapter.xhtml#Tab3),
    I was taken aback to discover Maine’s historical political trajectory: transitioning
    from a predominantly Republican state to a staunchly Democratic one. Consequently,
    I opted to characterize Maine as a “Lean Democrat” state, given that Democrats
    emerged victorious in 7 out of 15 elections from 1960 to 2016\. My prediction
    for 2020 leans toward a predominantly Democratic outcome, albeit by a narrow margin.
    Notably, since 1992, Maine has consistently favored the Democratic Party. However,
    neglecting Maine could potentially lead to a shift toward Republican allegiance.
    According to the *Bangor Daily News*, Clinton did not visit Maine after September
    2015, opting instead to delegate surrogates. Consequently, for the first time
    in years, the Democratic Party lost one electoral vote to the Republican Party.


    ## Modeling


    In modeling, it is advisable to experiment with various algorithms for prediction
    and assess their outcomes rather than relying solely on one model. In this project,
    I used Monte Carlo and Bayes algorithms. Regarding statistical tests, the methods
    utilized included


    *   Histograms


    *   Box plots


    *   Proportion test


    *   T-test


    *   Decision tree


    *   Chi-square test


    *   Scatterplot and linear regression


    ### My 2016 Predictions


    Following executing the Monte Carlo algorithm in SAS University Edition using
    previous election outcomes, the resulting output is illustrated in Figure [1-11](#619569_1_En_1_Chapter.xhtml#Fig11).


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    The 2016 prediction results of Monte Carlo algorithm


    Figure [1-11](#619569_1_En_1_Chapter.xhtml#Fig11) indicates that according to
    the simulation, Hillary Clinton was projected to win Maine with a mean percentage
    of 52.14%. Her victory margin^([⁷](#fn7)) was only 48%. Nonetheless, the simulation
    accurately predicted her win in Maine, resulting in a successful outcome for this
    project and earning me an A in the course. Hurray!


    ### My 2020 Predictions


    Based on my prediction, the Democratic Party is expected to secure three out of
    Maine’s four electoral votes with a majority of 50.8%, as depicted in Figure [1-12](#619569_1_En_1_Chapter.xhtml#Fig12).


    ![](images/619569_1_En_1_Chapter/619569_1_En_1_Fig12_HTML.jpg)


    Figure 1-12


    The 2020 prediction results of the Monte Carlo algorithm


    The probability suggests that in 2020, the Democrats are expected to edge out
    the Republicans in Maine by about 51% with a slim margin of approximately +3%.
    In 2020^([⁸](#fn8)), Biden won by 53.1%, while Trump earned 44% only of the votes.
    Historical data from 1960 to 2016 indicates that the average percentage of Democratic
    support in Maine hovers around 43%, while the average percentage for Republicans
    is about 40%. This margin mirrors the difference between Democrats and Republicans
    in Maine during the 2016 election. Nonetheless, there is a risk of Maine shifting
    allegiance to the Republican Party if the Democratic Party fails to exercise caution.


    ## Summary


    In this chapter, our attention is directed toward extracting the key concepts
    from the case study of the presidential elections project in Maine, along with
    its accompanying charts. In the subsequent chapter, we will delve into the process
    of writing our initial Python program and data types.


    Footnotes [1](#619569_1_En_1_Chapter.xhtml#Fn1_source)   [2](#619569_1_En_1_Chapter.xhtml#Fn2_source)
      [3](#619569_1_En_1_Chapter.xhtml#Fn3_source)   [4](#619569_1_En_1_Chapter.xhtml#Fn4_source)
      [5](#619569_1_En_1_Chapter.xhtml#Fn5_source)   [6](#619569_1_En_1_Chapter.xhtml#Fn6_source)
      [7](#619569_1_En_1_Chapter.xhtml#Fn7_source)   [8](#619569_1_En_1_Chapter.xhtml#Fn8_source)


    # 2. Getting Started


    We will start this chapter by installing and taking a tour in the Jupyter Notebook
    interface to get more familiar with it. When studying any programming language,
    we always cover the following topics: the datatypes, which we will discuss in
    this chapter, comparison and logical operators in Chapter [5](#619569_1_En_5_Chapter.xhtml),
    conditional statements in Chapter [6](#619569_1_En_6_Chapter.xhtml), and loops
    in Chapter [5](#619569_1_En_5_Chapter.xhtml).


    ## Installation


    You can install Anaconda for free for personal and educational purposes. Anaconda
    is an easy-to-install manager for environment, Python distribution, and a collection
    of over 720 open source packages. Its main advantage is that it comes bundled
    with Python, Jupyter Notebook, Spyder IDE, and data analysis and machine learning
    libraries and packages, as shown in Figure [2-1](#619569_1_En_2_Chapter.xhtml#Fig1).
    You can install it for free from this site:


    [`https://www.anaconda.com/download/`](https://www.anaconda.com/download/)


    For this book’s example code, I used Jupyter Notebooks. However, you can copy
    and paste the code into your favorite Python IDE (integrated development environment).
    You must make sure to upload the book’s datasets from the Datasets Folder and
    adjust the files’ paths in the code accordingly. Also, you can install only the
    Python and Jupyter Notebook without installing the whole Anaconda. You can install
    Jupyter Notebook for free from this link:


    [`https://jupyter.org/install`](https://jupyter.org/install)


    ![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Anaconda


    ## Python on the Cloud


    If you do not have Conda or Anaconda installed, you can use one of these playgrounds
    to access Python on the cloud:


    *   Kaggle: [`https://www.kaggle.com/code`](https://www.kaggle.com/code)


    *   Anaconda Cloud: [`https://anaconda.cloud/`](https://anaconda.cloud/)


    *   Online Python: [`www.online-python.com`](http://www.online-python.com)


    *   Sololearn: [`https://code.sololearn.com/python`](https://code.sololearn.com/python)


    *   Replit: [`https://replit.com/languages/python3`](https://replit.com/languages/python3)


    *   Trinket: [`https://trinket.io/library/trinkets/create?lang=python3`](https://trinket.io/library/trinkets/create%253Flang%253Dpython3)


    *   Google Colab: [`https://colab.research.google.com`](https://colab.research.google.com/)


    Note


    All these playgrounds are free except Anaconda Cloud; it is free for a while.
    As the terms and conditions and pricing plans change frequently, please make sure
    that you read them well before signing up.'
  trans: "\n### 回顾过往选举，探寻是否存在可预测的结果（模式）\n\n最后，项目的最终阶段涉及收集历次选举的历史数据，以便为后续的建模和预测步骤提供信息。如前所述，我仅专注于民主党和共和党，因为其他党派在\
    \ 2012 年选举中获得的选票比例微乎其微。\n\n**表 1-3** 缅因州历届总统选举历史结果^(⁵,⁶)\n\n| 年份 | 民主党 | 民主党得票率\
    \ | 共和党 | 共和党得票率 |\n| --- | --- | --- | --- | --- |\n| 2016 | **357,735** | **47.80%**\
    \ | 335,593 | 44.90% |\n| 2012 | **401,306** | **56.27%** | 292,276 | 40.98% |\n\
    | 2008 | **421,923** | **57.71%** | 295,273 | 40.38% |\n| 2004 | **396,842** |\
    \ **53.57%** | 330,201 | 44.58% |\n| 2000 | **319,951** | **49.10%** | 286,616\
    \ | 44.00% |\n| 1996 | **312,788** | **51.60%** | 186,378 | 30.80% |\n| 1992 |\
    \ **263,420** | **38.80%** | 206,820 | 30.40% |\n| 1988 | 243,569 | 43.90% | **307,131**\
    \ | **55.30%** |\n| 1984 | 214,515 | 38.80% | **336,500** | **60.80%** |\n| 1980\
    \ | 220,974 | 42.30% | **238,522** | **45.60%** |\n| 1976 | 232,279 | 48.07% |\
    \ **236,320** | **48.91%** |\n| 1972 | 160,584 | 38.50% | **256,458** | **61.50%**\
    \ |\n| 1968 | **217,312** | **55.30%** | 169,254 | 43.10% |\n| 1964 | **62,264**\
    \ | **68.84%** | 118,701 | 31.16% |\n| 1960 | **181,159** | **42.95%** | 240,608\
    \ | 57.05% |\n\n在审阅表 1-3 中呈现的数据后，我惊讶地发现了缅因州的历史政治轨迹：从一个以共和党为主的州转变为一个坚定的民主党州。因此，我选择将缅因州定性为“倾向民主党”的州，因为从\
    \ 1960 年到 2016 年的 15 次选举中，民主党赢得了 7 次。我对 2020 年的预测倾向于民主党以微弱优势获胜。值得注意的是，自 1992 年以来，缅因州一直支持民主党。然而，忽视缅因州可能会导致其转向支持共和党。据《班戈每日新闻》报道，克林顿在\
    \ 2015 年 9 月之后没有访问过缅因州，而是选择派遣代理人。因此，多年来民主党首次将一张选举人票输给了共和党。\n\n### 建模\n\n在建模过程中，建议尝试多种算法进行预测并评估其结果，而不是仅仅依赖单一模型。在本项目中，我使用了蒙特卡洛和贝叶斯算法。关于统计检验，所使用的方法包括：\n\
    \n- 直方图\n- 箱线图\n- 比例检验\n- T 检验\n- 决策树\n- 卡方检验\n- 散点图和线性回归\n\n#### 我的 2016 年预测\n\
    \n在 SAS University Edition 中使用过往选举结果执行蒙特卡洛算法后，得到的输出如图 1-11 所示。\n\n![](img/619569_1_En_1_Fig11_HTML.jpg)\n\
    \n**图 1-11** 蒙特卡洛算法的 2016 年预测结果\n\n图 1-11 显示，根据模拟结果，希拉里·克林顿预计将以平均 52.14%的得票率赢得缅因州。她的获胜优势^(⁷)仅为\
    \ 48%。尽管如此，模拟准确预测了她在缅因州的胜利，这为该项目带来了成功的结果，并让我在该课程中获得了 A。太好了！\n\n#### 我的 2020 年预测\n\
    \n根据我的预测，民主党预计将以 50.8%的多数票赢得缅因州四张选举人票中的三张，如图 1-12 所示。\n\n![](img/619569_1_En_1_Fig12_HTML.jpg)\n\
    \n**图 1-12** 蒙特卡洛算法的 2020 年预测结果\n\n概率表明，2020 年，民主党预计将以约 51%的得票率，以大约+3%的微弱优势在缅因州击败共和党。在\
    \ 2020 年^(⁸)，拜登以 53.1%的得票率获胜，而特朗普仅获得 44%的选票。1960 年至 2016 年的历史数据显示，缅因州民主党的平均支持率约为\
    \ 43%，而共和党的平均支持率约为 40%。这一差距与 2016 年大选中缅因州民主党和共和党之间的差距相似。尽管如此，如果民主党不谨慎行事，缅因州仍有可能倒向共和党。\n\
    \n### 总结\n\n在本章中，我们重点关注从缅因州总统选举项目案例研究及其附带的图表中提取关键概念。在下一章中，我们将深入探讨编写第一个 Python\
    \ 程序以及数据类型的过程。\n\n**脚注** 1 2 3 4 5 6 7 8\n\n## 开始入门\n\n我们将从安装 Jupyter Notebook\
    \ 并浏览其界面以熟悉它开始本章的学习。在学习任何编程语言时，我们都会涵盖以下主题：数据类型（本章讨论）、比较和逻辑运算符（第 5 章）、条件语句（第 6\
    \ 章）以及循环（第 5 章）。\n\n### 安装\n\n您可以免费安装 Anaconda 用于个人和教育目的。Anaconda 是一个易于安装的环境管理器、Python\
    \ 发行版以及包含超过 720 个开源包的集合。其主要优势在于它捆绑了 Python、Jupyter Notebook、Spyder IDE 以及数据分析和机器学习库与包，如图\
    \ 2-1 所示。您可以从以下网站免费安装：\n\n[`https://www.anaconda.com/download/`](https://www.anaconda.com/download/)\n\
    \n本书的示例代码使用了 Jupyter Notebook。但是，您可以将代码复制并粘贴到您喜欢的 Python IDE（集成开发环境）中。您必须确保从数据集文件夹上传本书的数据集，并相应调整代码中的文件路径。此外，您也可以只安装\
    \ Python 和 Jupyter Notebook，而无需安装整个 Anaconda。您可以从以下链接免费安装 Jupyter Notebook：\n\n\
    [`https://jupyter.org/install`](https://jupyter.org/install)\n\n![](img/619569_1_En_2_Fig1_HTML.jpg)\n\
    \n**图 2-1** Anaconda\n\n### 云端 Python\n\n如果您没有安装 Conda 或 Anaconda，您可以使用以下在线平台之一在云端访问\
    \ Python：\n\n- Kaggle：[`https://www.kaggle.com/code`](https://www.kaggle.com/code)\n\
    - Anaconda Cloud：[`https://anaconda.cloud/`](https://anaconda.cloud/)\n- Online\
    \ Python：[`www.online-python.com`](http://www.online-python.com)\n- Sololearn：[`https://code.sololearn.com/python`](https://code.sololearn.com/python)\n\
    - Replit：[`https://replit.com/languages/python3`](https://replit.com/languages/python3)\n\
    - Trinket：[`https://trinket.io/library/trinkets/create?lang=python3`](https://trinket.io/library/trinkets/create%253Flang%253Dpython3)\n\
    - Google Colab：[`https://colab.research.google.com`](https://colab.research.google.com/)\n\
    \n> **注意**  \n> 除 Anaconda Cloud 外，所有这些在线平台都是免费的；Anaconda Cloud 仅在一段时间内免费。由于条款、条件及定价计划频繁变更，请务必在注册前仔细阅读。\n"
- fmt: "# What Is Python?\n\nPython is a programming and scripting language. It is\
    \ popular, fast, and more flexible than other programming languages. The main\
    \ advantage is that an enormous community contributes to it. Therefore, you will\
    \ easily find batteries/packages and code samples for whatever you need for your\
    \ projects.\n\n# Tour\n\nEach place to enter text is called a cell, as shown in\
    \ Figure [2-2](#619569_1_En_2_Chapter.xhtml#Fig2). You can enter Python code or\
    \ any text. If you want to insert any plain English text, select the markup language\
    \ from the drop-down menu and choose `Markdown`.\n\nTo make titles in the markup\
    \ cell, you type `#` and space before your title. When you run this cell, the\
    \ Python interpreter will make it bolded and of large font, as shown in Figure\
    \ [2-3](#619569_1_En_2_Chapter.xhtml#Fig3).\n\n![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig2_HTML.jpg)\n\
    \nFigure 2-2\n\nCell and Markdown\n\nTo run a cell, click the `Run` icon, as shown\
    \ in Figure [2-3](#619569_1_En_2_Chapter.xhtml#Fig3), or click `Shift-Return`\
    \ by holding the Shift key; then, click the Return key. If you want to run all\
    \ Jupyter Notebook cells, you click on the double arrows icon, as highlighted\
    \ in Figure [2-3](#619569_1_En_2_Chapter.xhtml#Fig3).\n\n![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig3_HTML.jpg)\n\
    \nFigure 2-3\n\nRun and Run-All\n\nTo delete any cell, you can click `ESC`, then\
    \ double-click on the `D` key on the keyboard, or select it from the Edit menu\
    \ by clicking on Delete Cell, as in Figure [2-4](#619569_1_En_2_Chapter.xhtml#Fig4).\n\
    \n![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig4_HTML.jpg)\n\nFigure 2-4\n\
    \nDelete Cells\n\nTo add any cell, click on the `plus`. As shown in Figure [2-5](#619569_1_En_2_Chapter.xhtml#Fig5),\
    \ you can move it up and down by clicking on the icons in the toolbar. You can\
    \ also move it from the `Insert` menu as well.\n\n![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig5_HTML.jpg)\n\
    \nFigure 2-5\n\nAdding Cells\n\nAgain, it depends on your installed version; the\
    \ interface might vary. In this book, the version is Jupyter Notebook server 6.4.5.\
    \ The server running on this version of Python is Python 3.9.7 (default, Sep 16\
    \ 2021, 16:59:28) [MSC v.1916 64 bit (AMD64)]. The kernel information is Python\
    \ 3.9.7 (default, Sep 16 2021, 16:59:28) [MSC v.1916 64 bit (AMD64)].\n\n# Datatypes\n\
    \nThere are different ways to classify the datatypes in Python. Usually, it will\
    \ be in the following six categories:\n\n1.  Numeric Types\n    1.  `int`: Used\
    \ for whole numbers, e.g., `42`\n    2.  `float`: Used for decimal numbers, e.g.,\
    \ `3.14`\n    3.  `complex`: Used for complex numbers, e.g., `3+4j`\n2.  Sequence\
    \ Types\n    1.  `str`: Used for text, e.g., `\"hello\"`\n    2.  `list`: Used\
    \ for ordered collections of items, e.g., `[1, 2, 3]`\n    3.  `tuple`: Used for\
    \ ordered, immutable collections of items, e.g., `(1, 2, 3)`\n3.  Mapping Types\n\
    \    1.  `dict`: Dictionary type used for key/value pairs, e.g., `{'name': 'Alice',\
    \ 'age': 25}`\n4.  Set Types\n    1.  `set`: Used for unordered collections of\
    \ unique items, e.g., `{1, 2, 3}`\n    2.  `frozenset`: Immutable set type, e.g.,\
    \ `frozenset([1, 2, 3])`\n5.  Boolean Types\n    1.  `bool`: Boolean type, used\
    \ for true/false values, e.g., `True, False`\n6.  Binary Types\n    1.  `bytes`:\
    \ Immutable sequence of bytes, e.g., `b'hello'`\n    2.  `bytearray`: Mutable\
    \ sequence of bytes, e.g., `bytearray(b'hello')`\n    3.  `memoryview`: Memory\
    \ view object, e.g., `memoryview(b'hello')`\n\nAlthough this classification is\
    \ standard, I prefer classifying it into scalar/basic, container, and advanced.\
    \ Therefore, the next section of the typecasting will follow this classification.\n\
    \n1.  Scalar types are simple datatypes that hold a single value. It includes\
    \ `int`, `float`, `bool`, `complex`, and `str`.\n2.  Container types are data\
    \ structures with multiple values, which can be of different datatypes. This class\
    \ includes `list`, `tuple`, `dict`, `set`, and `frozenset`.\n3.  Advanced types\
    \ typically come from external libraries for more complex data structures and\
    \ operations.\n    1.  Pandas DataFrame: Two-dimensional labeled data structure\
    \ with columns of potentially several types used for data analysis, as in Listing\
    \ [2-1](#619569_1_En_2_Chapter.xhtml#PC1). The whole code is in Chapter 2.ipynb\
    \ in the Example Code Folder.\n\n```\nimport pandas as pd\ndf = pd.DataFrame({'A':\
    \ [1, 2, 3], 'B': [4, 5, 6]})\nprint(df)\nListing 2-1\nPandas DataFrame\n```\n\
    \nThe output is as in Figure [2-6](#619569_1_En_2_Chapter.xhtml#Fig6). The first\
    \ column on the left is not a component of the DataFrame; it is an index that\
    \ serves as an identifier for the rows.\n\n![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig6_HTML.jpg)\n\
    \nFigure 2-6\n\nPandas DataFrame is like a datasheet which consists of columns\
    \ and rows\n\n1.  Numpy array: N-dimensional array object for numerical operations,\
    \ as in Listing [2-2](#619569_1_En_2_Chapter.xhtml#PC2).\n\n```\nimport numpy\
    \ as np\narr = np.array([1, 2, 3])\nprint(arr)\nListing 2-2\nNumpy\n```\n\nThe\
    \ output is in Figure [2-7](#619569_1_En_2_Chapter.xhtml#Fig7).\n\n![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig7_HTML.jpg)\n\
    \nFigure 2-7\n\nOne-dimensional Numpy array\n\n1.  Pandas Series: One-dimensional\
    \ labeled array capable of holding any datatype, as in Listing [2-3](#619569_1_En_2_Chapter.xhtml#PC3).\n\
    \n```\nimport pandas as pd\ns = pd.Series([1, 2, 3])\nprint(s)\nListing 2-3\n\
    Pandas Series\n```\n\nThe output is in Figure [2-8](#619569_1_En_2_Chapter.xhtml#Fig8).\
    \ We use the Pandas Series to store one column from a Pandas DataFrame, as we\
    \ are going to see in many of the book’s examples.\n\n![](images/619569_1_En_2_Chapter/619569_1_En_2_Fig8_HTML.jpg)\n\
    \nFigure 2-8\n\nPandas Series\n\nWe will discuss Pandas and Numpy extensively\
    \ later in this chapter and learn how to use them effectively throughout the book.\n\
    \n# Typecasting\n\nTypecasting is converting from one datatype to another. Here\
    \ are examples within these categories:\n\n## Scalar Type Casting\n\n1.  `int()`:\
    \ Convert to an integer, as in Listing [2-4](#619569_1_En_2_Chapter.xhtml#PC4).\n\
    2.  `float()`: Convert to float, as in Listing [2-5](#619569_1_En_2_Chapter.xhtml#PC5).\n\
    \n```\nx = int(3.14)  # x is now 3\nprint(x)\nListing 2-4\nConvert to integer\n\
    ```\n\n```\nx = float(3) # x is now 3.0\nprint(x)\nListing 2-5\nConvert to float\n\
    ```\n\n1.  `str()`: Convert to string, as in Listing [2-6](#619569_1_En_2_Chapter.xhtml#PC6).\n\
    \n```\nx = str(3.14) # x is now '3.14'\nprint(x)\nListing 2-6\nConvert to string\n\
    ```\n\n## Container Type Casting\n\n1.  `list()`: Convert to list, as in Listing\
    \ [2-7](#619569_1_En_2_Chapter.xhtml#PC7).\n2.  `tuple()`: Convert to tuple, as\
    \ in Listing [2-8](#619569_1_En_2_Chapter.xhtml#PC8).\n\n```\nx = list((1, 2,\
    \ 3))  # x is now [1, 2, 3]\nprint(x)\nListing 2-7\nConvert to list\n```\n\n```\n\
    x = tuple([1, 2, 3])  # x is now (1, 2, 3)\nprint(x)\nListing 2-8\nConvert to\
    \ tuple\n```\n\n1.  `set()`: Convert to set, as in Listing [2-9](#619569_1_En_2_Chapter.xhtml#PC9).\n\
    2.  `dict()`: Convert to dictionary (usually from a list of key/value pairs),\
    \ as in Listing [2-10](#619569_1_En_2_Chapter.xhtml#PC10).\n\n```\nx = set([1,\
    \ 2, 2, 3])  # x is now {1, 2, 3}\nprint(x)\nListing 2-9\nConvert to set\n```\n\
    \n```\nx = dict([('a', 1), ('b', 2)])  # x is now {'a': 1, 'b': 2}\nprint(x)\n\
    Listing 2-10\nConvert to dict\n```"
