    # 多元线性回归


    在多元线性回归中，模型包含多个自变量。其直线方程如下：


    `Y = a + b[1] X[1] + b[2] X[2] + … + b[i] X[i]`


    其中，`Y` 是我们想要预测其值的因变量，`a` 是截距，`b[i]` 是系数，`X[i]` 是自变量。此处忽略了误差项。


    原假设是因变量与任何自变量之间不存在线性关系。换句话说，`b[i]` 的值均为零。备择假设是存在线性关系，且至少有一个 `b[i]` 不等于零。


    `H[0]: b[i] = 0`


    `H[a]: b[i] ^= 0`


