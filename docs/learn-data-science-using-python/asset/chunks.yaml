    # Drop a Column


    The `DROP` method specifies excluding some variables from the dataset. In the
    `Voters_A.csv` dataset, the `Designate` column is empty. In cleaning the data,
    we should delete this column; in other words, drop it, as in Listing [6-8](#619569_1_En_6_Chapter.xhtml#PC9).


    ```

    import pandas as pd

    import numpy as np

    df = pd.read_csv(''../Datasets/Chapter 6/Voters_A.csv'')

    print("The size of the dataframe:",df.shape)

    df.replace(to_replace=[r''^\s*$'', '''', None], value=np.nan, regex=True, inplace=True)

    print(df.isnull().sum())

    print("The dataframe before dropping:")

    print(df.head())

    df.drop("DESIGNATE",axis = 1, inplace = True)

    print("The size of the dataframe:",df.shape)

    print("The dataframe after dropping:")

    print(df.head())

    Listing 6-8

    Drop method

    ```


    After loading the file correctly using the `pd.csv()` method, we verified the
    DataFrame size, which is shown in Figure [6-8](#619569_1_En_6_Chapter.xhtml#Fig8)
    as `(100,9)`.


    Sometimes, empty cells might not be read as empty strings (`'' ''`) but as `None`,
    whitespace characters, or other representations. To handle various types of empty
    values and replace them with `NaN`. Therefore, we can use `df.replace(to_replace=[r''^\s*$'',
    '''', None], value=np.nan, regex=True, inplace=True).` This method replaces all
    representations of empty values with `NaN,` including a RegEx (Regular Expression)
    pattern to match any string that consists only of whitespace characters, `r''^\s*$''`.
    Also, it will replace empty strings and `None`.


    The `df.isnull().sum()` counts the `NaN` values in each column. The output, as
    in Figure [6-8](#619569_1_En_6_Chapter.xhtml#Fig8), shows that all the rows in
    the `Designate` column are `NaN`. We verify that using the `.head()` method.


    The `df.drop("DESIGNATE", axis=1, inplace=True)` removes the column named `DESIGNATE`
    from the DataFrame. The option `axis=1` indicates that a column (not a row) is
    to be dropped. In Pandas, `axis=0` refers to rows, and `axis=1` refers to columns.
    The option `inplace=True` modifies the original DataFrame `df` directly and does
    not create a new DataFrame with the new values.


    We print the DataFrame header and size before and after dropping the column to
    verify that the number of columns decreased from 9 to 8, as shown in Figure [6-8](#619569_1_En_6_Chapter.xhtml#Fig8).


