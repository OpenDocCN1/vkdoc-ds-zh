    *   Reshaping Arrays: Change the shape of an array without changing its data,
    as in Listing [2-21](#619569_1_En_2_Chapter.xhtml#PC21).


    ```

    array = np.array([[1, 2, 3], [4, 5, 6]]) # 3x3 array

    reshaped = array.reshape((3, 2))  # Reshape to a 3x2 array

    print(reshaped)

