- fmt: '# Bar Chart


    The bar chart is for comparing the values side to side whether vertical or horizontal.
    For this example, we shall use the crime data in NYC to compare the crime rate
    in the different NYC boroughs in 2018. You can download the 2018 NYPD Complaint
    Data from this link: [`https://www.kaggle.com/datasets/mihalw28/nypd-complaint-data-current-ytd-july-2018/data?select=NYPD_Complaint_Data_Current_YTD.csv`](https://www.kaggle.com/datasets/mihalw28/nypd-complaint-data-current-ytd-july-2018/data%253Fselect%253DNYPD_Complaint_Data_Current_YTD.csv).


    For downloading the most recent data, it is available through the NYC Open Data
    Project website. You will find the data file in the Datasets Folder, or you can
    download the dataset from this link: [`https://data.cityofnewyork.us/Public-Safety/NYPD-Complaint-Data-Current-Year-To-Date-/5uac-w243/data`](https://data.cityofnewyork.us/Public-Safety/NYPD-Complaint-Data-Current-Year-To-Date-/5uac-w243/data).


    To download the dataset of the current year from the above link, the steps are
    similar to the ones in Figure 3-13 by clicking on Export then CSV.


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig13_HTML.jpg)


    Figure 3-13: NYPD Compliant Data—NYC OpenData


    The dataset contains a massive amount of information. Much investigation and analysis
    can be done over this data. For example: what is the highest crime type in every
    borough? When is the most probable time when crimes happen? Which day of the week
    where the highest number of crimes occur?


    For this example, we are interested solely in answering: Which borough has the
    highest crime rate, and which has the least?


    To answer this question, we shall need the following three columns: `Borough`,
    `Longitude`, and `Latitude`. Hence, we shall drop all the other columns. Then,
    we shall count the number of crimes in every borough to represent it with a bar
    chart.


    After cleaning the data and preparing it, we have the following dataset as in
    Table 3-2.


    Table 3-2: Number of Crimes Per Borough


    | Borough | Count of Crimes | Latitude | Longitude |

    | --- | --- | --- | --- |

    | BRONX | 50153 | 40.82452 | -73.8978 |

    | BROOKLYN | 67489 | 40.82166 | -73.9189 |

    | MANHATTAN | 56691 | 40.71332 | -73.9829 |

    | QUEENS | 44137 | 40.74701 | -73.7936 |

    | STATEN ISLAND | 10285 | 40.63204 | -74.1222 |


    To load the data, we write Listing 3-5-1. In this example, we insert the values
    in the code instead of reading external data to practice other ways to read data
    in Python.


    ```

    # Data

    Borough = [''BRONX'', ''BROOKLYN'', ''MANHATTAN'', ''QUEENS'', ''STATEN ISLAND'']

    crimes = [50153, 67489, 56691, 44137, 10285]

    # Create a bar chart

    plt.figure(figsize=(10, 6))

    plt.bar(Borough, crimes, color=''skyblue'')

    # Add labels and title

    plt.xlabel(''Borough'')

    plt.ylabel(''Number of Crimes'')

    plt.title(''Number of Crimes in Different Boroughs'')

    # Display the bar chart

    plt.show()

    ```


    Listing 3-5-1: Creating a dataset for number of crimes per borough


    In Listing 3-5-1, we insert the names of the boroughs and the total number of
    crimes in each one in two lists, `Borough` and `crimes`. Then, we create the bar
    chart using the `plt.bar()` method and set the two variables and the color. Finally,
    as always, we set the labels of the x and y axes and the plot title and then show
    the plot.


    The output of Listing 3-5-1 is Figure 3-14.


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig14_HTML.jpg)


    Figure 3-14: Bar chart showing the number of crimes in different NYC boroughs


    ## How to Sort a Bar Chart?


    To avoid any confusion, it is better to sort the graph in ascending or descending
    order. In this example, we shall learn a way to sort the previous bar chart of
    the crimes in NYC boroughs. There are many ways to sort the bar chart. In Listing
    3-5-2, we see one of these ways.


    ```

    # Data

    Borough = [''BRONX'', ''BROOKLYN'', ''MANHATTAN'', ''QUEENS'', ''STATEN ISLAND'']

    crimes = [50153, 67489, 56691, 44137, 10285]

    # Sort data by number of crimes

    sorted_data = sorted(zip(Borough, crimes), key=lambda x: x[1])

    # Extract sorted Borough and crimes after sorting

    sorted_Borough, sorted_crimes = zip(*sorted_data)

    # Create a bar chart

    plt.figure(figsize=(10, 6))

    plt.bar(sorted_Borough, sorted_crimes, color=''skyblue'')

    # Add labels and title

    plt.xlabel(''Borough'')

    plt.ylabel(''Number of Crimes'')

    plt.title(''Number of Crimes in Different Boroughs (Sorted)'')

    # Display the bar chart

    plt.show()

    ```


    Listing 3-5-2: Sort the vertical bar chart ascendingly


    In Listing 3-5-2, we use `zip(Borough, crimes)` function to combine the two lists
    into pairs of boroughs and the count of crimes. The `sorted()` function sorts
    these pairs based on the second element of each pair, number of crimes, using
    a `lambda` function as the sorting key.


    After sorting, the `zip(*sorted_data)` function is used to unzip the sorted data
    into two separate lists `sorted_Borough` and `sorted_crimes`. Then, as usual,
    we use `Matplotlib` to create a bar chart. The `plt.figure(figsize=(10, 6))` sets
    the figure size. The `plt.bar()` function is then used to create a bar chart,
    where `sorted_Borough` is on the x axis, `sorted_crimes` variable is on the y
    axis, and the bars are colored sky blue. The `plt.xlabel`, `plt.ylabel`, and `plt.title`
    functions add labels to the x axis, y axis, and the title of the chart, respectively.
    Finally, `plt.show()` is used to display the created bar chart. The output of
    Listing 3-5-2 is the ascending sorted graph in Figure 3-15.


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig15_HTML.jpg)


    Figure 3-15: Ascending sorted bar chart


    To reverse the output to get a descending vertical bar chart, set the `reverse`
    option to `True` in the `sorted_data = sorted(zip(Borough, crimes), key=lambda
    x: x[1], reverse=True)`, as in Listing 3-5-3.


    ```

    # Data

    Borough = [''BRONX'', ''BROOKLYN'', ''MANHATTAN'', ''QUEENS'', ''STATEN ISLAND'']

    crimes = [50153, 67489, 56691, 44137, 10285]

    # Sort data by number of crimes in descending order

    sorted_data = sorted(zip(Borough, crimes), key=lambda x: x[1], reverse=True)

    # Extract sorted Borough and crimes after sorting

    sorted_Borough, sorted_crimes = zip(*sorted_data)

    # Create a bar chart

    plt.figure(figsize=(10, 6))

    plt.bar(sorted_Borough, sorted_crimes, color=''skyblue'')

    # Add labels and title

    plt.xlabel(''Borough'')

    plt.ylabel(''Number of Crimes'')

    plt.title(''Number of Crimes in Different Boroughs (Sorted Descending)'')

    # Display the bar chart

    plt.show()

    ```


    Listing 3-5-3: Sort the bar chart in descending order


    The output of Listing 3-5-3 is in Figure 3-16.


    ![](images/619569_1_En_3_Chapter/619569_1_En_3_Fig16_HTML.jpg)


    Figure 3-16: Set reverse to true to reverse the bar chart in descending order


    To change the bar chart orientation from vertical to horizonal, we use `plt.barh()`
    function to plot the bar chart, as in Listing 3-5-4.'
