  raw: '### One-Sample T-Test


    In this example, I gathered all the voting data from past presidential elections
    in Maine for candidates representing both major political parties across various
    years. This dataset served as the basis for predicting the election outcomes in
    Maine for both the 2016 and 2020 elections.


    The dataset, MaineVotesDR.xlsx, comprises four columns: `Election Year`, `Democratic
    Votes`, `Republican Votes`, and `Result`. The `Result` column records a binary
    outcome: `0` signifies victory for the Republican candidate, while `1` indicates
    success for the Democratic candidate.


    Our hypothesis is that the Republican candidate will be victorious in the 2020
    presidential elections in Maine, while the alternative hypothesis suggests the
    victory of the Democratic candidate.


    Null hypothesis (H0): result = 0Alternative hypothesis (Ha): result = 1


    Now, let us load the dataset and explore how the T-test can shed light on the
    outcomes of the 2020 election, as shown in Listing [4-5](#619569_1_En_4_Chapter.xhtml#PC5).


    ```

    import pandas as pd

    from scipy import stats

    maine_votes_df = pd.read_excel(''../Datasets/Chapter 4/MaineVotesDR.xlsx'')

    # Test for normality

    normality_test = stats. shapiro (maine_votes_df[''Result''])

    print("Normality Test:")

    print(normality_test)

    # t-test

    t_stat, p_value = stats.ttest_1samp(maine_votes_df[''Result''], 0)

    print("\nT-test:")

    print("T-statistic:", t_stat)

    print("P-value:", p_value)

    Listing 4-5

    One-sample T-test

    ```


    In Listing [4-5](#619569_1_En_4_Chapter.xhtml#PC5), we use `stats.shapiro()` to
    perform the normality test on the `Result` column of the DataFrame. It is appropriate
    for smaller sample sizes. The results will give a test statistic and a p-value
    to determine if the data deviates significantly from normality. If the dataset
    is larger than 20 rows, the `stats.normaltest()` function can be used. Then, we
    use `stats.ttest_1samp()` to perform the one-sample t-test on the `Result` column
    with the null hypothesis (h0) being 0\. We print the results of both tests. The
    output is as in Figure [4-9](#619569_1_En_4_Chapter.xhtml#Fig9).


    ![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig9_HTML.jpg)


    Figure 4-9


    T-test results: prediction for 2020 presidential elections in Maine


    The p-value = 0.0004\. Since the p-value is less than 0.05, we can reject the
    null hypothesis. Hence, we can conclude that the Republican candidate will lose
    in Maine in the 2020 election. He did lose Maine.


    ### Two-Sample T-Test


    In this example, the question is: Is there a significant difference in height
    between the two genders?


    The null hypothesis is that there is no difference in height. The alternate hypothesis
    is that there is a difference in height based on gender.


    In this example, load the CLASS dataset, as in Listing [4-6-1](#619569_1_En_4_Chapter.xhtml#PC6).


    ```

    import pandas as pd

    import numpy as np

    from scipy import stats

    import seaborn as sns

    import matplotlib.pyplot as plt

    #https://www.kaggle.com/datasets/megasatish/class-data

    class_df = pd.read_csv(''../Datasets/Chapter 4/Class.csv'')

    # Test for normality by Gender

    print("Normality Test by Gender:")

    for Gender in class_df[''Gender''].unique():

    stat, p_value = stats. shapiro (class_df[class_df[''Gender''] == Gender][''Height''])

    print(f"Gender: {Gender}, Statistic: {stat:.2f}, p-value: {p_value:.4f}")

    # t-test by Gender

    # comparing males to females

    male_heights = class_df[class_df[''Gender''] == ''M''][''Height'']

    female_heights = class_df[class_df[''Gender''] == ''F''][''Height'']

    t_stat, p_value = stats.ttest_ind(male_heights, female_heights)

    print(f"\nT-test between male and female Heights:")

    print(f"T-statistic: {t_stat:.2f}, p-value: {p_value:.4f}")

    Listing 4-6-1

    Two-sample T-test

    ```


    In Listing [4-6-1](#619569_1_En_4_Chapter.xhtml#PC6), after importing the required
    libraries and loading the dataset, we test for the normality of heights within
    each gender group using the `.shapiro()` method as in the previous listing from
    `scipy.stats`. Then, we loop through unique gender values (“`M`” and “`F`”) to
    perform the normality test on the heights for each gender. And we print the test
    statistic and p-value for each gender, as Figure [4-10](#619569_1_En_4_Chapter.xhtml#Fig10).


    ![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    Normality test by gender


    From Figure [4-10](#619569_1_En_4_Chapter.xhtml#Fig10), we cannot reject the null
    hypothesis as there is not enough evidence for that; the p-value is 0.1645, which
    is larger than 0.05\. We can conclude that there is no difference in height between
    the two genders. However, we must note that the sample is small. The CLASS dataset
    contains only 19 rows.


    To understand the data distribution more, let us visualize the height of each
    gender using box and line plots. As in Listing [4-6-2](#619569_1_En_4_Chapter.xhtml#PC7).


    ```

    # Visualizing the Height distribution by Gender

    sns.boxplot(x=''Gender'', y=''Height'', data=class_df)

    plt.title(''Height Distribution by Gender'')

    plt.show()

    # For t-test plots, let us use seaborn to show the distribution of heights by
    Gender,

    # highlighting the means and confidence intervals

    sns.catplot(x=''Gender'', y=''Height'', kind="point", data=class_df, join=False,
    capsize=.1)

    plt.title(''Point Plot Showing Height Means by Gender'')

    plt.show()

    Listing 4-6-2

    Visualizing the height of each gender

    ```


    In Listing [4-6-2](#619569_1_En_4_Chapter.xhtml#PC7), we use the `sns.boxplot()`
    method to plot the height distribution of each gender. As in Figure [4-11](#619569_1_En_4_Chapter.xhtml#Fig11),
    the box plot shows that there is a small difference in the medians of the two
    groups, almost negligible. Also, there is a small difference between the means
    of the two groups, as shown in the line plot.


    ![](images/619569_1_En_4_Chapter/619569_1_En_4_Fig11_HTML.jpg)


    Figure 4-11


    Box plot and line plot for the height distribution by Gender


    ## Summary


    This chapter explains the most crucial statistical concepts that will be needed
    for almost all analytics and data science reports. They are the frequency tables,
    summary statistics, correlation analysis, and T-tests. In the next chapter, we
    shall learn the operators and loops.


    # 5. Data Preprocessing and Feature Engineering


    This chapter shows some essential data cleaning and querying methods, such as
    comment statement, arithmetic, and comparison operators, and how to represent
    missing values and loops.


    ## Comment Statement


    It is crucial to document your code so you and your peers can understand the reasoning
    behind how the analysis is constructed. In general, if you do not document your
    code, you might look at it after a few months and not remember why you used a
    certain function or why you made a certain check. Hence, code documentation is
    crucial to follow the logic flow.


    The syntax of the comment statement in Python can be done in two ways as follows:


    ```

    #message

    """message"""

    ```


    You can use the comment statement anywhere in the program to explain your code.
    The Python interpreter ignores text in comment statements during processing. It
    is always recommended that you start your programs by writing a comment at the
    top explaining what your program will do and then add as many comments as you
    need. To describe the logic flow, it is best to write a comment at every data
    or procedure step to describe what it does.'
  trans: "\n### 单样本 T 检验\n\n在此示例中，我收集了缅因州过去总统选举中代表两大主要政党的候选人在不同年份的所有投票数据。该数据集作为预测缅因州\
    \ 2016 年和 2020 年选举结果的基础。\n\n数据集 `MaineVotesDR.xlsx` 包含四列：`Election Year`（选举年份）、`Democratic\
    \ Votes`（民主党得票数）、`Republican Votes`（共和党得票数）和 `Result`（结果）。`Result` 列记录了一个二元结果：`0`\
    \ 表示共和党候选人获胜，而 `1` 表示民主党候选人获胜。\n\n我们的假设是共和党候选人将在 2020 年缅因州总统选举中获胜，而备择假设则表明民主党候选人获胜。\n\
    \n零假设 (H0)：`result = 0`  \n备择假设 (Ha)：`result = 1`\n\n现在，让我们加载数据集，并探索 T 检验如何揭示\
    \ 2020 年选举的结果，如代码清单 4-5 所示。\n\n```\nimport pandas as pd\nfrom scipy import stats\n\
    maine_votes_df = pd.read_excel('../Datasets/Chapter 4/MaineVotesDR.xlsx')\n# 正态性检验\n\
    normality_test = stats.shapiro(maine_votes_df['Result'])\nprint(\"正态性检验:\")\n\
    print(normality_test)\n# t 检验\nt_stat, p_value = stats.ttest_1samp(maine_votes_df['Result'],\
    \ 0)\nprint(\"\\nT 检验:\")\nprint(\"T 统计量:\", t_stat)\nprint(\"P 值:\", p_value)\n\
    代码清单 4-5\n单样本 T 检验\n```\n\n在代码清单 4-5 中，我们使用 `stats.shapiro()` 对 DataFrame 的 `Result`\
    \ 列执行正态性检验。它适用于较小的样本量。结果将给出一个检验统计量和一个 p 值，以确定数据是否显著偏离正态分布。如果数据集大于 20 行，则可以使用 `stats.normaltest()`\
    \ 函数。然后，我们使用 `stats.ttest_1samp()` 对 `Result` 列执行单样本 t 检验，零假设 (h0) 为 0。我们打印两个检验的结果。输出如图\
    \ 4-9 所示。\n\n![](img/619569_1_En_4_Fig9_HTML.jpg)\n\n图 4-9  \nT 检验结果：对 2020 年缅因州总统选举的预测\n\
    \np 值 = 0.0004。由于 p 值小于 0.05，我们可以拒绝零假设。因此，我们可以得出结论，共和党候选人将在 2020 年缅因州选举中失利。他确实输掉了缅因州。\n\
    \n### 双样本 T 检验\n\n在此示例中，问题是：两个性别之间的身高是否存在显著差异？\n\n零假设是身高没有差异。备择假设是身高因性别而异。\n\n\
    在此示例中，加载 CLASS 数据集，如代码清单 4-6-1 所示。\n\n```\nimport pandas as pd\nimport numpy as\
    \ np\nfrom scipy import stats\nimport seaborn as sns\nimport matplotlib.pyplot\
    \ as plt\n#https://www.kaggle.com/datasets/megasatish/class-data\nclass_df = pd.read_csv('../Datasets/Chapter\
    \ 4/Class.csv')\n# 按性别进行正态性检验\nprint(\"按性别进行正态性检验:\")\nfor Gender in class_df['Gender'].unique():\n\
    \    stat, p_value = stats.shapiro(class_df[class_df['Gender'] == Gender]['Height'])\n\
    \    print(f\"性别: {Gender}, 统计量: {stat:.2f}, p 值: {p_value:.4f}\")\n# 按性别进行 t\
    \ 检验\n# 比较男性和女性\nmale_heights = class_df[class_df['Gender'] == 'M']['Height']\n\
    female_heights = class_df[class_df['Gender'] == 'F']['Height']\nt_stat, p_value\
    \ = stats.ttest_ind(male_heights, female_heights)\nprint(f\"\\n 男性和女性身高之间的 T 检验:\"\
    )\nprint(f\"T 统计量: {t_stat:.2f}, p 值: {p_value:.4f}\")\n代码清单 4-6-1\n双样本 T 检验\n\
    ```\n\n在代码清单 4-6-1 中，导入所需库并加载数据集后，我们使用 `scipy.stats` 中的 `.shapiro()` 方法（与上一个代码清单相同）检验每个性别组内身高的正态性。然后，我们遍历唯一的性别值（`M`\
    \ 和 `F`），对每个性别的身高执行正态性检验。并打印每个性别的检验统计量和 p 值，如图 4-10 所示。\n\n![](img/619569_1_En_4_Fig10_HTML.jpg)\n\
    \n图 4-10  \n按性别进行正态性检验\n\n从图 4-10 中，我们不能拒绝零假设，因为没有足够的证据支持拒绝；p 值为 0.1645，大于 0.05。我们可以得出结论，两个性别之间的身高没有差异。但是，我们必须注意样本量很小。CLASS\
    \ 数据集仅包含 19 行。\n\n为了进一步理解数据分布，让我们使用箱线图和折线图来可视化每个性别的身高。如代码清单 4-6-2 所示。\n\n```\n\
    # 按性别可视化身高分布\nsns.boxplot(x='Gender', y='Height', data=class_df)\nplt.title('按性别划分的身高分布')\n\
    plt.show()\n# 对于 t 检验图，让我们使用 seaborn 按性别显示身高分布，\n# 突出显示均值和置信区间\nsns.catplot(x='Gender',\
    \ y='Height', kind=\"point\", data=class_df, join=False, capsize=.1)\nplt.title('显示按性别划分的身高均值的点图')\n\
    plt.show()\n代码清单 4-6-2\n可视化每个性别的身高\n```\n\n在代码清单 4-6-2 中，我们使用 `sns.boxplot()`\
    \ 方法绘制每个性别的身高分布。如图 4-11 所示，箱线图显示两组的中位数差异很小，几乎可以忽略不计。此外，如折线图所示，两组的均值之间也存在微小差异。\n\
    \n![](img/619569_1_En_4_Fig11_HTML.jpg)\n\n图 4-11  \n按性别划分的身高分布箱线图和折线图\n\n## 总结\n\
    \n本章解释了几乎所有分析和数据科学报告所需的最关键的统计概念。它们是频数表、汇总统计、相关分析和 T 检验。在下一章中，我们将学习运算符和循环。\n\n\
    # 5. 数据预处理与特征工程\n\n本章介绍一些基本的数据清理和查询方法，例如注释语句、算术和比较运算符，以及如何表示缺失值和循环。\n\n## 注释语句\n\
    \n记录你的代码至关重要，这样你和你的同事才能理解分析构建背后的逻辑。通常，如果你不记录代码，几个月后你再看它时，可能不记得为什么使用某个函数或为什么进行某项检查。因此，代码文档对于遵循逻辑流程至关重要。\n\
    \nPython 中注释语句的语法可以通过以下两种方式实现：\n\n```\n#消息\n\"\"\"消息\"\"\"\n```\n\n你可以在程序中的任何位置使用注释语句来解释你的代码。Python\
    \ 解释器在处理过程中会忽略注释语句中的文本。始终建议你在程序开头编写一条注释，说明你的程序将做什么，然后根据需要添加尽可能多的注释。为了描述逻辑流程，最好在每个数据或过程步骤处编写一条注释，描述其作用。\n"
- fmt: '# Arithmetic and Assignment Operators


    Arithmetic operators indicate that an arithmetic calculation is performed, as
    shown in Table [5-1](#619569_1_En_5_Chapter.xhtml#Tab1).


    **Table 5-1** Arithmetic and Assignment Operators


    | Operator | Meaning | Example | Result |

    | --- | --- | --- | --- |

    | `+` | Addition | `2 + 3` | `5` |

    | `+=` |   | `X = 5` `X += 15` | `X=20` |

    | `-` | Subtraction | `5 – 3` | `2` |

    | `-=` |   | `X = 5` `X -= 15` | `X=-10` |

    | `/` | Division | `5 / 2` | `2.5` |

    | `/=` |   | `X = 15` `X /= 5` | `X=3.0` |

    | `//` | Quotient | `5 // 2` | `2` |

    | `%` | Remainder | `5 % 2` | `1` |

    | `*` | Multiplication | `2 * 3` | `6` |

    | `*=` |   | `X = 15` `X *= 5` | `X=75` |

    | `**` | Exponentiation | `2 ** 3` | `8` |


    If a missing value is an operand for an arithmetic operator, the result is a missing
    value. To avoid propagating missing values, we discuss some of the methods of
    how to represent and handle the missing values in your dataset later in this chapter
    and in the next one.


    ## Python Operator Precedence Rule: PEMDAS


    - `P`: Parentheses

    - `E`: Exponentiation

    - `M`: Multiplication

    - `D`: Division

    - `A`: Addition

    - `S`: Subtraction


    You can remember it with the popular order of operators’ statement: “Please Excuse
    My Dear Aunt Sally.”


    # Comparison Operators


    Comparison operators set up a comparison, operation, or calculation with two variables,
    constants, or expressions. If the comparison is true, the result is `True`. If
    the comparison is false, the result is `False`. Comparison operators can be expressed
    as in Table [5-2](#619569_1_En_5_Chapter.xhtml#Tab2).


    **Table 5-2** Comparison Operators


    | Operator | Meaning | Example | Result |

    | --- | --- | --- | --- |

    | `==` | Equality | `print(2 == 3)` | `False` |

    | `!=` | Inequality | `print(2 != 3)` | `True` |

    | `<` | Less than | `print(2 < 3)` | `True` |

    | `<=` | Less than or equal | `print(2 <= 3)` | `True` |

    | `>` | Greater than | `print(2 > 3)` | `False` |

    | `>=` | Greater than or equal | `print(2>=3)` | `False` |

    | `in` | Membership | `x=2` `print(x in (2,3,5))` | `True` |


    # Logical, Membership, and Identity Operators


    Logical operators are used to show the relationship between two conditions or
    expressions, determining whether they are both true, at least one is true, or
    the condition should be reversed. Table [5-3](#619569_1_En_5_Chapter.xhtml#Tab3)
    shows the three types of operators: logical, membership, and identity ones.


    Membership operators are used to check if a value is part of a collection or sequence,
    like a list or string.


    Identity operators are used to determine if two variables are actually the same
    object in memory, not just equivalent in value.


    **Table 5-3** Logical, Membership, and Identity Operators


    | Operator | Meaning | Example | Result |

    | --- | --- | --- | --- |

    | `and` | Returns `True` if both statements are true | `x=5` `x < 5 and x < 10`
    | `False` |

    | `or` | Returns `True` if one of the statements is true | `x=5` `x < 5 or x <
    4` | `False` |

    | `not` | Reverses the result, returns `False` if the result is true | `x=5` `not(x
    < 5 and x < 10)` | `True` |

    | `in` | Returns `True` if a sequence with the specified value is present in the
    object | `y=[''bus'',''car'',''walk'']` `x=''car''` `x in y` | `True` |

    | `not in` | Returns `True` if a sequence with the specified value is not present
    in the object | `y=[''bus'',''car'',''walk'']` `x=''car''` `x not in y` | `False`
    |

    | `is` | Returns `True` if both variables are the same object | `x=[''bus'',''car'',''walk'']`
    `y=[''bus'',''car'',''walk'']` `print(x is y)` `print(x==y)` | `False` `True`
    |

    | `is not` | Returns `True` if both variables are not the same object | `x=[''bus'',''car'',''walk'']`
    `y=[''bus'',''car'',''walk'']` `x is not y` | `True` |


    The order of operations in Python is as follows: parentheses, exponentiation,
    unary plus, unary minus, multiplication, division, floor division, and modulus,
