  ## 重命名


  在数据分析中，一个关键的第一步是理解数据集中的变量。你需要识别哪些变量是因变量和自变量，并区分数值/连续变量和字符变量。通常，你的客户会在随数据集提供的文本文件中提供这些信息。这个文本文件被称为数据字典，它解释了变量名称及其类型。例如，如果没有数据字典，像
  `YOB`、`ENROLL` 和 `DT_ACCEPT` 这样的变量名称可能含义不清。数据字典会阐明 `YOB` 代表出生年份（Year Of Birth）。


  为了将这些描述性标签添加到数据集中，我们使用重命名列的过程。数据集位于 Datasets 文件夹中，文件名为 `Voter_A.CSV`。上传并导入文件后，我们将数据集重命名为
  `Voters`。请注意，该数据集是合成的，使用了缅因州州务卿提供的变量名称，但不包含任何真实选民的信息。我为这些练习随机生成了 100 行选民信息。


  导入后，我们看到数据集包含 100 行和 9 列。然后我们重命名列以包含描述性标签，使数据集更易读。然而，数据显然需要清洗。例如，`Special Designations`
  列为空，其他列也存在缺失值。验证数据的有效性并确保其无错误至关重要。我们将在剩余部分学习如何清洗此类杂乱数据。


