  \ | 118,701 | 31.16% |\n| 1960 | **181,159** | **42.95%** | 240,608 | 57.05% |\n\
  \n让我们读取数据，并计算数据集中民主党与共和党两列（即变量 `D` 和 `R`）的汇总统计，如代码清单 4-2 所示。\n\n```\nimport pandas\
