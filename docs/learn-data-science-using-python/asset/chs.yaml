  \n代码清单 3-3-3 首先从 `scipy.stats` 中导入 `norm`。该库用于绘制正态分布曲线；它包含用于处理正态（高斯）分布的函数。\n\n然后，我们生成一个\
  \ x 轴的值数组，范围从 `0` 到 `14000`，步长为 `1`。我们将最高年薪率设置为 `140000`，并通过在 `Annual_RT` 序列上设置掩码来忽略任何大于该值的数值。\n\
  \n之后，我们使用新的掩码序列绘制直方图，将组距（bins）更改为 `10`，并对直方图进行归一化以绘制密度并返回概率密度。接下来是绘制正态分布，其均值和标准差根据数据计算得出。最后的修改包括为\
  \ x 轴添加标签、设置标题、设置图例并显示所有内容。\n\n\n\n```python\nfrom scipy.stats import norm\nplt.figure(figsize=(15,\
  \ 10))\n#Generate data for x-axis ranging from 0 to 14000 with 1 step\nx = np.arange(0,\
