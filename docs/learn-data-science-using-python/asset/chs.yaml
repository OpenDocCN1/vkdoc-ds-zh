- '# 格式


  医疗领域最常见的数据处理练习之一是计算患者在诊所或医院停留的时间，并根据历史数据预测患者的到达时间以减少等待时间。在本例中，即代码清单 6-2，我们创建了一个包含患者
  ID、年龄、到达日期、到达时间、离开日期、离开时间和就诊费用的数据集。然后，我们计算患者在诊所内停留的时间，并打印一份报告，其中包含时长以及带有美元符号和千位分隔符的金额。此示例旨在学习
  Python 如何处理日期时间处理和货币格式化。


  ```

  import pandas as pd

  import pandas as pd

  from datetime import datetime

  # 示例 DataFrame

  data = {

  ''PatientID'': [1, 2, 3],

  ''Age'': [25, 34, 50],

  ''ArrivingDate'': [''2024-06-10'', ''2024-06-11'', ''2024-06-12''],

  ''ArrivingTime'': [''09:00'', ''10:30'', ''14:45''],

  ''LeavingDate'': [''2024-06-10'', ''2024-06-11'', ''2024-06-12''],

  ''LeavingTime'': [''10:00'', ''11:15'', ''15:30''],

  ''VisitFees'': [100.0, 150.75, 200.5]

  }

  df = pd.DataFrame(data)

  print("原始数据的数据类型：")

  print("\n",df.dtypes)

  print("\n 原始数据集的前几行（",len(df.columns),"列）：")

  print("\n",df.head())

  # 将日期和时间列转换为 datetime 类型

  df[''ArrivingDateTime''] = pd.to_datetime(df[''ArrivingDate''] + '' '' + df[''ArrivingTime''])

  df[''LeavingDateTime''] = pd.to_datetime(df[''LeavingDate''] + '' '' + df[''LeavingTime''])

  # 计算就诊时长

  df[''VisitDuration''] = df[''LeavingDateTime''] - df[''ArrivingDateTime'']

  dummy=df[[''VisitDuration'', ''LeavingDateTime'', ''ArrivingDateTime'']]

  print("\n 计算就诊时长：")

  print("\n",dummy.head())

  # 格式化时长的函数

  def format_duration(duration):

  seconds = duration.total_seconds()

  hours = int(seconds // 3600)

  minutes = int((seconds % 3600) // 60)

  return f"{hours}h {minutes}m"

  # 格式化费用的函数

  def format_fees(fees):

  return ''${:,.2f}''.format(fees)

  # 打印报告

  print("\n 诊所就诊报告：")

  # 显示带有格式化列的 DataFrame 以供参考

  df[''FormattedDuration''] = df[''VisitDuration''].apply(format_duration)

  df[''FormattedFees''] = df[''VisitFees''].apply(format_fees)

  print("\n", df[[''PatientID'', ''Age'', ''FormattedDuration'', ''FormattedFees'']])

  代码清单 6-2

  日期与货币格式化

  ```


  让我们解释一下代码清单 6-2 中的代码。首先，我们创建一个包含以下列的 DataFrame：`PatientID`、`Age`、`ArrivingDate`、`ArrivingTime`、`LeavingDate`、`LeavingTime`
  和 `VisitFees`，并用虚拟值对其进行初始化。


  然后，我们使用 `pd.to_datetime()` 方法将 `ArrivingDate` 和 `ArrivingTime` 合并为一个 `ArrivingDateTime`
  列。类似地，将 `LeavingDate` 和 `LeavingTime` 合并为 `LeavingDateTime` 列。为了计算就诊时长，从 `LeavingDateTime`
  中减去 `ArrivingDateTime` 来计算 `VisitDuration`。接下来，我们将编写一个函数来格式化这个 `VisitDuration` 变量。


  为了格式化时长，我们使用 `def` 关键字定义了一个函数，该函数将时长作为参数并返回格式化后的结果。`format_duration(duration)` 将时长转换为小时和分钟的字符串格式，如图
  6-2 中的输出所示。


  请查看以下链接以了解更多关于日期格式化的信息：[`https://www.w3schools.com/python/python_datetime.asp`](https://www.w3schools.com/python/python_datetime.asp)。


  关于货币格式化，我们定义了另一个函数 `format_fees(fees)`，使用 `''${:,.2f}''.format(fees)` 来格式化费用，其中包含美元符号和逗号。其中
  `$` 用于设置货币符号，`:,` 用于千位分隔符，`.2f` 用于浮点数精度，设置为两位小数。以下是一个了解更多关于货币格式化的链接：[`https://www.geeksforgeeks.org/how-to-format-numbers-as-currency-strings-in-python/`](https://www.geeksforgeeks.org/how-to-format-numbers-as-currency-strings-in-python/)。


