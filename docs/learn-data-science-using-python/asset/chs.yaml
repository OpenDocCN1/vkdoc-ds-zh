  \ | 40.98% |\n| 2008 | **421,923** | **57.71%** | 295,273 | 40.38% |\n| 2004 | **396,842**\
  \ | **53.57%** | 330,201 | 44.58% |\n| 2000 | **319,951** | **49.10%** | 286,616\
  \ | 44.00% |\n| 1996 | **312,788** | **51.60%** | 186,378 | 30.80% |\n| 1992 | **263,420**\
