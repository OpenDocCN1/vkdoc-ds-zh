  \n图 3-10\n\n最终的直方图\n\n现在，我们得到的正态分布曲线比之前右偏的曲线更接近正态分布。\n\n## 序列图\n\n序列图显示数值随时间的变化。在本例中，让我们绘制股票价格随时间变化的趋势。\n\
