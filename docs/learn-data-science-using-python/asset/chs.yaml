  ## 循环


  Python 中有两种用于迭代的循环类型：`while` 循环和 `for` 循环。


  - **While 循环**：当你不知道迭代次数，并依赖某个条件为假来退出循环时使用。

  - **For 循环**：当你已知迭代次数，或需要遍历某个特定的容器变量，或在特定的数字范围内循环时使用。


  让我们探索一些这两种循环的示例。




  ### While 循环


  在这个 `while` 循环的示例中，我们持续循环要求用户输入数字，程序将输出该数字是偶数还是奇数。再次强调，使用 `while` 循环时最重要的事情是考虑退出或中断条件，换句话说，就是循环何时结束；否则，它将是一个无限循环并产生错误。在这个示例中，退出条件是当用户输入零时。程序将显示一条退出消息并结束分支。


  Python 中的循环有一个其他语言没有的独特特性，即可以在 `while` 和 `for` 循环中使用 `else`。在这个示例中，我们使用 `while-else`
  来显示退出消息，如代码清单 5-2 所示。


  ```

  #在循环前输入用户的第一个数字

  input_no = int(input(''请输入您的数字（输入 0 退出）：''))

  #检查输入值是否等于零；如果不等于，则进入 while 循环

  while input_no != 0:

  #检查除以 2 后的余数是否为零

  if input_no%2==0:

  #如果余数为零，则输入的数字是偶数

  print("您输入的是偶数")

  else:

  print("您输入的是奇数")

  #要求用户输入一个新数字

  input_no = int(input(''请输入您的数字（输入 0 退出）：''))

  else:

  #它会持续循环直到用户输入零。打印此消息并退出

  print("再见，祝您愉快！")

  代码清单 5-2

  While 循环示例

  ```


  在代码清单 5-2 中，我们首先要求用户输入第一个值。程序在 `while` 条件中检查它是否等于零。如果输入不等于零，则进入循环并使用 `if` 条件检查数字的模数。如果模数的余数为零，则为偶数；否则为奇数。


  如果输入的数字等于零，则进入 `while` 循环的 `else` 部分。程序打印消息并退出。图 5-3 显示了该代码清单的示例输出。


  ![](img/619569_1_En_5_Fig3_HTML.jpg)


  图 5-3


  While 循环示例输出


  ### For 循环


  `for` 循环比 `while` 循环更常见，用于遍历容器、DataFrame、文件中的行等。在本节中，我们有一些示例来展示 `for` 循环的用法。第一个示例是最标准的循环示例，用于打印数字序列并计算它们的和。第二个示例是遍历一个单词的字母。第三个示例是遍历一个列表，作为容器数据类型示例之一。最后一个示例是遍历一个数据集，将空值替换为零。


  #### 遍历数字序列


  代码清单 5-3 用于仅将从 1 到 10 的奇数相加，并在每一步打印总和和数字。


  ```

  #将 sum 初始化为零

  sum=0

  #从 1 到 10 的 for 循环

  for num in range(1, 10):

  #检查是否为奇数

  if num%2!=0:

  #将数字加到 sum 上

  sum=sum+num

  #打印数字和新的总和

  print(''num='',num)

  print(''sum='',sum)

  代码清单 5-3

  将从 0 到 10 的奇数相加

  ```


  Python 中的 `for` 循环语法与其他编程语言不同。语法如下：


  ```

  for <变量> in <可迭代对象>:

  ```


  Python 中的可迭代对象可以是元组、列表、字符串、序列等。


  如代码清单 5-3 所示，我们首先将变量 `sum` 初始化为零。然后，我们使用带有 `range()` 函数的 `for` 循环来生成从 1 到 10 的数字序列。在循环中，我们检查数字是否为奇数。如果为真，我们将该数字加到
  sum 上，并在每一步打印数字和总和以便追踪。请注意，`range()` 函数在结束的 `number - 1` 处停止。因此，它从 1 开始，到 9 结束，如图
