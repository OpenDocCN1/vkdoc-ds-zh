  \n\n\n## 条形图\n\n条形图用于并排比较数值，无论是垂直方向还是水平方向。在本示例中，我们将使用纽约市的犯罪数据来比较 2018 年纽约市不同行政区的犯罪率。你可以通过此链接下载\
  \ 2018 年纽约警察局投诉数据：[`https://www.kaggle.com/datasets/mihalw28/nypd-complaint-data-current-ytd-july-2018/data?select=NYPD_Complaint_Data_Current_YTD.csv`](https://www.kaggle.com/datasets/mihalw28/nypd-complaint-data-current-ytd-july-2018/data%253Fselect%253DNYPD_Complaint_Data_Current_YTD.csv)。\n\
  \n如需下载最新数据，可通过纽约市开放数据项目网站获取。你可以在数据集文件夹中找到该数据文件，或通过此链接下载数据集：[`https://data.cityofnewyork.us/Public-Safety/NYPD-Complaint-Data-Current-Year-To-Date-/5uac-w243/data`](https://data.cityofnewyork.us/Public-Safety/NYPD-Complaint-Data-Current-Year-To-Date-/5uac-w243/data)。\n\
  \n从上述链接下载当前年份的数据集，步骤与图 3-13 类似，点击“导出”然后选择“CSV”即可。\n\n![](img/619569_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13：纽约警察局投诉数据——纽约市开放数据\n\n该数据集包含海量信息。可以对这些数据进行大量的调查和分析。例如：每个行政区最常见的犯罪类型是什么？犯罪最可能发生在什么时间？一周中哪一天犯罪数量最多？\n\
  \n在本示例中，我们只关心回答一个问题：哪个行政区的犯罪率最高，哪个最低？\n\n要回答这个问题，我们需要以下三列：`Borough`（行政区）、`Longitude`（经度）和`Latitude`（纬度）。因此，我们将删除所有其他列。然后，我们将统计每个行政区的犯罪数量，并用条形图表示。\n\
  \n在清理和准备数据之后，我们得到如下数据集，如表 3-2 所示。\n\n表 3-2：各行政区犯罪数量\n\n| 行政区 | 犯罪数量 | 纬度 | 经度 |\n\
  | --- | --- | --- | --- |\n| 布朗克斯 | 50153 | 40.82452 | -73.8978 |\n| 布鲁克林 | 67489\
  \ | 40.82166 | -73.9189 |\n| 曼哈顿 | 56691 | 40.71332 | -73.9829 |\n| 皇后区 | 44137\
  \ | 40.74701 | -73.7936 |\n| 史坦顿岛 | 10285 | 40.63204 | -74.1222 |\n\n为了加载数据，我们编写代码清单\
  \ 3-5-1。在本示例中，我们将值直接插入代码中，而不是读取外部数据，以练习在 Python 中读取数据的其他方式。\n\n```\n# 数据\nBorough\
  \ = ['BRONX', 'BROOKLYN', 'MANHATTAN', 'QUEENS', 'STATEN ISLAND']\ncrimes = [50153,\
  \ 67489, 56691, 44137, 10285]\n# 创建条形图\nplt.figure(figsize=(10, 6))\nplt.bar(Borough,\
  \ crimes, color='skyblue')\n# 添加标签和标题\nplt.xlabel('Borough')\nplt.ylabel('Number\
  \ of Crimes')\nplt.title('Number of Crimes in Different Boroughs')\n# 显示条形图\nplt.show()\n\
  ```\n\n代码清单 3-5-1：创建各行政区犯罪数量的数据集\n\n在代码清单 3-5-1 中，我们将行政区的名称和每个行政区的犯罪总数分别插入到两个列表`Borough`和`crimes`中。然后，我们使用`plt.bar()`方法创建条形图，并设置两个变量和颜色。最后，像往常一样，我们设置\
  \ x 轴和 y 轴的标签以及图表标题，然后显示图表。\n\n代码清单 3-5-1 的输出是图 3-14。\n\n![](img/619569_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14：显示纽约市不同行政区犯罪数量的条形图\n\n### 如何对条形图进行排序？\n\n为避免混淆，最好将图表按升序或降序排序。在本示例中，我们将学习一种对之前纽约市行政区犯罪条形图进行排序的方法。排序条形图的方法有很多种。在代码清单\
  \ 3-5-2 中，我们展示了其中一种方法。\n\n```\n# 数据\nBorough = ['BRONX', 'BROOKLYN', 'MANHATTAN',\
  \ 'QUEENS', 'STATEN ISLAND']\ncrimes = [50153, 67489, 56691, 44137, 10285]\n# 按犯罪数量对数据进行排序\n\
  sorted_data = sorted(zip(Borough, crimes), key=lambda x: x[1])\n# 排序后提取排序后的行政区与犯罪数量\n\
  sorted_Borough, sorted_crimes = zip(*sorted_data)\n# 创建条形图\nplt.figure(figsize=(10,\
  \ 6))\nplt.bar(sorted_Borough, sorted_crimes, color='skyblue')\n# 添加标签和标题\nplt.xlabel('Borough')\n\
  plt.ylabel('Number of Crimes')\nplt.title('Number of Crimes in Different Boroughs\
  \ (Sorted)')\n# 显示条形图\nplt.show()\n```\n\n代码清单 3-5-2：对垂直条形图进行升序排序\n\n在代码清单 3-5-2\
  \ 中，我们使用`zip(Borough, crimes)`函数将两个列表组合成行政区与犯罪数量的配对。`sorted()`函数根据每个配对的第二个元素（即犯罪数量），使用`lambda`函数作为排序键对这些配对进行排序。\n\
  \n排序后，使用`zip(*sorted_data)`函数将排序后的数据解压缩为两个独立的列表`sorted_Borough`和`sorted_crimes`。然后，像往常一样，我们使用`Matplotlib`创建条形图。`plt.figure(figsize=(10,\
  \ 6))`设置图形大小。接着使用`plt.bar()`函数创建条形图，其中`sorted_Borough`位于 x 轴，`sorted_crimes`变量位于\
  \ y 轴，条形颜色为天蓝色。`plt.xlabel`、`plt.ylabel`和`plt.title`函数分别用于添加 x 轴、y 轴的标签和图表标题。最后，使用`plt.show()`显示创建的条形图。代码清单\
  \ 3-5-2 的输出是图 3-15 中的升序排序图表。\n\n![](img/619569_1_En_3_Fig15_HTML.jpg)\n\n图 3-15：升序排序的条形图\n\
  \n要反转输出以获得降序的垂直条形图，请在`sorted_data = sorted(zip(Borough, crimes), key=lambda x: x[1],\
  \ reverse=True)`中将`reverse`选项设置为`True`，如代码清单 3-5-3 所示。\n\n```\n# 数据\nBorough = ['BRONX',\
  \ 'BROOKLYN', 'MANHATTAN', 'QUEENS', 'STATEN ISLAND']\ncrimes = [50153, 67489, 56691,\
  \ 44137, 10285]\n# 按犯罪数量对数据进行降序排序\nsorted_data = sorted(zip(Borough, crimes), key=lambda\
  \ x: x[1], reverse=True)\n# 排序后提取排序后的行政区与犯罪数量\nsorted_Borough, sorted_crimes = zip(*sorted_data)\n\
  # 创建条形图\nplt.figure(figsize=(10, 6))\nplt.bar(sorted_Borough, sorted_crimes, color='skyblue')\n\
  # 添加标签和标题\nplt.xlabel('Borough')\nplt.ylabel('Number of Crimes')\nplt.title('Number\
  \ of Crimes in Different Boroughs (Sorted Descending)')\n# 显示条形图\nplt.show()\n```\n\
  \n代码清单 3-5-3：对条形图进行降序排序\n\n代码清单 3-5-3 的输出如图 3-16 所示。\n\n![](img/619569_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16：将 reverse 设置为 true 以反转条形图，实现降序排列\n\n要将条形图的方向从垂直改为水平，我们使用`plt.barh()`函数来绘制条形图，如代码清单\
  \ 3-5-4 所示。\n\n\n\n"
- "# 数据\n\n```python\nBorough = ['BRONX', 'BROOKLYN', 'MANHATTAN', 'QUEENS', 'STATEN\
  \ ISLAND']\ncrimes = [50153, 67489, 56691, 44137, 10285]\n# 按犯罪数量降序排序数据\nsorted_data\
  \ = sorted(zip(Borough, crimes), key=lambda x: x[1], reverse=True)\n# 提取排序后的行政区划和犯罪数量\n\
  sorted_Borough, sorted_crimes = zip(*sorted_data)\n# 创建水平条形图\nplt.figure(figsize=(10,\
  \ 6))\nplt.barh(sorted_Borough, sorted_crimes, color='skyblue')\n# 添加标签和标题\nplt.xlabel('犯罪数量')\n\
  plt.ylabel('行政区划')\nplt.title('不同行政区划的犯罪数量（降序排列）')\n# 显示水平条形图\nplt.show()\n```\n\
