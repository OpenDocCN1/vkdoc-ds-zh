  '
- "# 7. 回归\n\n线性回归任务拟合一个线性模型，用于根据一个或多个连续或分类预测变量来预测单个连续的因变量。该任务会生成用于解释结果的统计数据和图表。\n\
  \n\n\n## 简单线性回归\n\n在简单线性回归中，模型中只有一个自变量。其直线方程如下：\n\n`Y = a + b X`\n\n其中，`Y` 是我们想要预测其值的因变量，`a`\
  \ 是截距，`b` 是系数，`X` 是自变量。误差项被忽略。\n\n原假设是变量之间不存在线性关系。换句话说，`b` 的值为零。备择假设是存在线性关系，且 `b`\
  \ 不等于零。\n\n`H[0]: b = 0`\n\n`H[a]: b ^= 0`\n\n让我们看看每桶石油价格与黄金价格之间是否存在线性关系。数据集位于 Datasets\
  \ 文件夹中，文件名为：`sp_oil_gold.xlsx`。\n\n在 Python 中，有多个库可用于执行线性回归。两个常用的库是 `statsmodels`\
  \ 和 `scikit-learn`。选择使用 `statsmodels` 库中的 `Ordinary Least Squares (OLS)` 还是 `scikit-learn\
  \ (sklearn)` 中的 `linear regression`，取决于你的具体需求和分析背景。这两个库都提供线性回归功能，但它们的用途和特性有所不同。\n\
  \n如果你主要关注统计分析、假设检验和详细的诊断信息，并且不需要将模型用于更广泛的机器学习任务，那么 `statsmodels` 可能更适合你。\n\n如果你更侧重于预测建模、与其他机器学习工具的集成以及简洁性，那么\
  \ `scikit-learn` 是一个可靠的选择。\n\n在某些情况下，分析人员会同时使用这两个库：先用 `statsmodels` 进行初步探索和假设检验，再用\
  \ `scikit-learn` 构建预测模型，以便轻松集成到更广泛的机器学习工作流中。在我们的代码中，我们将同时包含 `scikit-learn` 和 `statsmodels`，并使用\
  \ `seaborn` 绘制诊断图，以充分利用每个库的优势。\n\n在下面的示例中，我们将使用 `scikit-learn` 库进行模型拟合和拟合诊断图。\n\n\
