  \ Market Returns']\nyears=df['Year']\n# Figure Size\nplt.figure(0)\n# set width\
  \ of bar\nbarWidth = 0.25\nfig = plt.subplots(figsize =(20, 8))\nplt.xticks(years)\n\
  plt.yticks(Stock_Market_Returns)\nplt.axhline(y=0, color='b', linestyle='-')\nplt.title('Stock_Market_Returns')\n\
  # Bar Plot\nplt.bar(years,Stock_Market_Returns)\n# Show Plot\nplt.show()\nplt.figure(1)\n\
  # set width of bar\nbarWidth = 0.25\nfig = plt.subplots(figsize =(20, 8))\nplt.xticks(years)\n\
  plt.yticks(oil_price)\nplt.title('oil_price')\nplt.axhline(y=0, color='b', linestyle='-')\n\
  # Bar Plot\nplt.bar(years,oil_price)\n# Show Plot\nplt.show()\nplt.figure(2)\n#\
  \ set width of bar\nbarWidth = 0.25\nfig = plt.subplots(figsize =(20, 8))\nplt.xticks(years)\n\
  plt.yticks(gold_prices)\nplt.title('gold_prices')\nplt.axhline(y=0, color='b', linestyle='-')\n\
  # Bar Plot\nplt.bar(years,gold_prices)\n# Show Plot\nplt.show()\nx=df[['oil price','gold_prices']].values\n\
  y=df['Stock Market Returns'].values\n# creating an object of LinearRegression class\n\
  LR = LinearRegression()\n# fitting the training data\nLR.fit(x,y)\nprint('intercept:',\
  \ LR.intercept_)\nprint('slope:', LR.coef_)\nprint('equation of Stock market returns=',LR.intercept_,\"\
  +\",LR.coef_[0],'* oil price +',LR.coef_[1],\"*gold_prices\")\n清单 7-2\n探索股票、石油和黄金价格\n\
  ```\n\n输出结果如图 7-5、7-6、7-7 和 7-8 所示。2008 年的金融危机在所有图表中都清晰可见。这场危机是美国自 1929 年大萧条以来最严重的经济灾难。石油和黄金价格在\
  \ 2012 年飙升。\n\n![](img/619569_1_En_7_Fig7_HTML.jpg)\n\n图 7-7\n探索黄金价格\n\n![](img/619569_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6\n探索石油价格\n\n![](img/619569_1_En_7_Fig5_HTML.jpg)\n\n图 7-5\n探索标普指数\n\n尽管这三个值表现为异常值，但我们不能将其排除，因为它们对公众的投票倾向有直接影响。接下来，如同我们在上一节中所做的那样，我们创建模型并将数据拟合到模型中。最后，我们计算了参数估计值、斜率和截距。\n\
  \n根据参数估计，直线方程为：\n\n`stock_market_returns = 0.13010 - 0.00671 oil_price + 0.00036367\
  \ gold_prices`\n\n![](img/619569_1_En_7_Fig8_HTML.jpg)\n\n图 7-8\n输出结果\n\n图 7-8 展示了参数估计值和方程的输出结果。\n\
  \n您可以重复上一节的相同步骤来绘制拟合诊断图。不过，我们认为这足以演示多元线性回归的概念。\n\n\n\n## 逻辑回归\n\n逻辑回归与线性回归类似，区别在于因变量是二值变量，而非连续变量。该模型方程用于检验因变量中某个离散二值出现的概率。\n\
  \n二元逻辑回归模型方程如下：\n\n*   `p = e^(b0 + b1*X1 + b2*X2 + ...) / (1 + e^(b0 + b1*X1 +\
  \ b2*X2 + ...))`\n\n同样，零假设认为变量之间不存在关系，因此所有系数均为零。备择假设则认为因变量与自变量之间存在关系。\n\n在本例中，我们使用泰坦尼克号数据集，以乘客的生存情况为因变量，年龄和乘客等级为自变量，探究它们之间是否存在关系。该数据集位于“Dataset”文件夹中，文件名为\
  \ `titanic.csv`，你也可以通过以下网址从 OpenDataSoft.com 下载 CSV 文件：[`https://www.kaggle.com/datasets/vinicius150987/titanic3/data`](https://www.kaggle.com/datasets/vinicius150987/titanic3/data)。\n\
  \n代码位于示例代码文件夹中 Chapter 7.ipynb 文件的清单 7-3。\n\n```\n#清单 7-3-1\nimport pandas as pd\n\
  from sklearn.linear_model import LogisticRegression\ndf = pd.read_csv('../Datasets/titanic.csv')\n\
  print(df.head())\ndf['male'] = df['Gender'] == 'male'\nx = df[['Pclass', 'male',\
  \ 'Age', 'Siblings/Spouses', 'Parents/Children', 'Fare']].values\ny = df['Survived'].values\n\
  print('x[0:5]=',x[0:5])\nprint('y[0:5]=',y[0:5])\n清单 7-3-1\n逻辑回归\n```\n\n在清单 7-3-1\
  \ 中，我们首先导入所需的库。然后，加载数据；由于数据集是 CSV 格式，我们使用 `pd.read_csv()` 函数。与前面几节一样，我们通过打印前五行来检查数据集是否已正确加载到\
  \ `DataFrame`（即 `df`）中。输出结果如图 7-9 所示。\n\n在继续解释代码之前，我们先看一下这段代码的输出。\n\n![](img/619569_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9\n\n清单 7-3-1 的输出\n\n该数据集的所有列都是数值型的，除了 `Gender` 列是 `string`（字符串）类型。我们不能在回归中使用字符串变量。有多种方法可以将字符串变量编码为数值型，例如，序数编码和独热编码。但是，在我们的例子中，我们不需要这些编码，因为性别只有两个值：`male`\
  \ 和 `female`。因此，更简单的方法是对其中一个值添加掩码，这意味着如果 `mask` 为 `true`，则该值为 `1`；否则，该值为 `0`。\n\n\
  我们创建一个 `Pandas Series`，它将是一个由 True 和 False 值组成的序列（如果乘客是 `male`，则为 `True`；如果乘客是 `female`，则为\
  \ `False`）。\n\n```\ndf['Gender']=='male'\n```\n\n现在，我们想创建一个包含此结果的列。要创建新列，我们使用相同的方括号语法\
  \ `df['male']`，然后将这个新值赋给它。\n\n```\ndf['male'] = df['Gender'] == 'male'\nprint(df.head())\n\
  ```\n\n接下来，我们在 `DataFrame x` 中设置自变量，在 `Series y` 中设置泰坦尼克号幸存乘客的目标变量。在代码中，我们打印了 `x`\
  \ 和 `y` 的前五行。\n\n```\n#清单 7-3-2\nmodel = LogisticRegression()\nmodel.fit(x, y)\n\
  print('model.coef_=',model.coef_)\nprint('model.intercept_=',model.intercept_)\n\
  清单 7-3-2\n模型\n```\n\n在清单 7-3-2 中，我们创建了一个 `LogisticRegression` 实例，并将 `x` 和 `y` 拟合到该模型。然后，我们打印模型的参数估计值，如图\
  \ 7-10 所示。\n\n![](img/619569_1_En_7_Fig10_HTML.jpg)\n\n图 7-10\n\n清单 7-3-2 的输出\n\n\
  图 7-10 显示了参数估计值，你可以将这些值代入逻辑回归方程中。\n\n```\n#清单 7-3-3\nprint('前 5 行的预测值=',model.predict(x[:5]))\n\
  # [0 1 1 1 0]\nprint('前 5 行的实际 y 值=',y[:5])\n# [0 1 1 1 0]\ny_pred = model.predict(x)\n\
  print('准确率=',(y == y_pred).sum()/y.shape[0])\nprint('模型评分=',model.score(x,y))\n\
  清单 7-3-3\n测试模型并计算准确率\n```\n\n在清单 7-3-3 中，我们简单地计算了预测值以及模型预测值与实际值之间的差异。这个计算结果就是模型的准确率。逻辑回归有一个名为\
  \ `model.score()` 的函数，它可以自动计算这个差异，无需手动计算预测值。\n\n![](img/619569_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11\n\n清单 7-3-3 的输出\n\n图 7-11 显示了清单 7-3-3 的输出。在图中，我们比较了手动计算的准确率和 `model.score()`\
  \ 函数的输出。如图所示，两者之间没有差异，该模型的准确率约为 81%。\n\n\n\n## 总结\n\n本章讲解了简单线性回归、多元线性回归以及逻辑回归。它详细阐述了诊断矩阵图及其各自含义。此外，还展示了如何通过诊断图中的多个图表轻松识别异常值。\n\
