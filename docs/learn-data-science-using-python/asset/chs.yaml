  ## 气泡图\n\n气泡图有助于同时展示三个数据变量。在本例中，我们将创建一个气泡图来展示一个班级的身高、体重和年龄。\n\n对于本例，我生成了班级的随机数据，如代码清单\
  \ 3-7-1 所示，作为本章的第三个数据源。\n\n```python\nimport pandas as pd\nimport numpy as np\n\
  import matplotlib.pyplot as plt\n# 生成 20 名学生的数据集\nnp.random.seed(42)  # 设置随机种子以确保可重复性\n\
  students_data = {\n    'Name': [f'Student{i}' for i in range(1, 21)],\n    'Height':\
  \ np.random.uniform(150, 190, 20),  # 身高，单位：厘米\n    'Weight': np.random.uniform(45,\
  \ 90, 20),   # 体重，单位：千克\n    'Age': np.random.randint(18, 25, 20)        # 年龄，单位：岁\n\
  }\nstudents_df = pd.DataFrame(students_data)\n# 创建气泡图\nplt.figure(figsize=(12, 8))\n\
  # 调整气泡大小的缩放因子\nscaling_factor = 500\nscatter = plt.scatter(students_df['Height'],\
  \ students_df['Weight'], s=students_df['Age'] * scaling_factor, c=students_df['Age'],\
  \ cmap='viridis', alpha=0.7)\n# 用学生姓名标注每个点\nfor i, name in enumerate(students_df['Name']):\n\
  \    plt.text(students_df['Height'][i], students_df['Weight'][i], name, ha='center',\
  \ va='center', fontsize=8, color='black', alpha=0.7)\n# 添加标签和标题\nplt.xlabel('身高\
  \ (cm)')\nplt.ylabel('体重 (kg)')\nplt.title('气泡图：身高 vs 体重，气泡大小表示年龄，并显示学生姓名')\n# 添加颜色条\n\
  cbar = plt.colorbar(scatter)\ncbar.set_label('年龄 (岁)')\n# 显示气泡图\nplt.show()\n```\n\
  \n代码清单 3-7-1：随机生成班级数据并绘制气泡图\n\n代码清单 3-7-1 首先使用 `np.random.seed(42)` 设置随机种子以确保可重复性。固定随机化中的种子意味着每次重新编译和运行代码时，都会生成相同的随机值。但如果我们不指定种子，每次重新运行单元格时，都会生成新的随机值。然后，使用\
  \ `np.random.uniform` 函数为 20 名学生生成随机数据。数据集包含学生姓名、身高、体重和年龄列。接着，使用 Matplotlib 创建气泡图。一如既往，`plt.figure(figsize)`\
  \ 设置图形大小。\n\n现在，惊喜之处在于再次使用了 `plt.scatter` 函数。是的，我们用它来绘制散点图和气泡图。在散点图中，x 轴表示身高，y 轴表示体重，气泡大小与年龄成正比（缩放因子为\
  \ 500），颜色表示年龄。`cmap='viridis'` 指定颜色映射，`alpha=0.7` 设置气泡的透明度。\n\n然后使用 `plt.text` 函数为图表上的每个点添加注释，在相应位置显示学生姓名。代码为\
