  \n**图 4-3** 缅因州民主党与共和党的汇总统计\n\n民主党与共和党的平均值差异并不显著。因此，缅因州属于“倾向民主党”的州，因为民主党在 15 次选举中赢得了\
  \ 7 次（从 1960 年到 2016 年）。自 1992 年以来，民主党在缅因州的选举中一直获胜。\n\n### 相关性分析\n\n在解释相关性概念之前，我们想先明确因果关系与相关性的区别。因果关系是指一件事导致另一件事发生，而相关性是指两件或更多事情看起来有关联。相关性并不总是意味着因果关系。\n\
  \n例如，旅行会导致购买行李箱和机票，但行李箱的销售与机票是相关的，如图 4-4 所示。\n\n![](img/619569_1_En_4_Fig4_HTML.jpg)\n\
  \n**图 4-4** 因果关系与相关性\n\n相关性是一种用于描述数值变量之间联系的统计方法。这种联系通过计算相关系数来表达，其取值范围从 -1 到 1。相关性分析任务提供图表和统计数据，以探索变量之间的关联。\n\
  \n让我们看几个例子。第一个例子是探究汽车的长度、重量与其马力之间是否存在相关性。汽车数据集位于 `Datasets` 文件夹中。\n\n代码位于示例代码文件夹中第\
  \ 4 章的 `Chapter 4.ipynb` 文件中的代码清单 4-3。在 Python 中有多种计算相关性的方法。在本例中，我们使用 Pandas 中的\
  \ `corr()` 方法来计算指定变量之间的相关矩阵。\n\n在代码清单 4-3 中，我们导入所需的库，加载数据集，并对其进行探索。为了更深入地探索数据，我们绘制了变量之间的多对双变量分布图。\n\
  \n```\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  cars_df = pd.read_excel('../Datasets/Chapter 4/CARS.xlsx')\nprint(cars_df.head())\n\
  print(cars_df.describe())\n# Selecting variables\nvariables = cars_df[['Weight',\
  \ 'Length', 'Horsepower']]\n# Calculate the correlation matrix\ncorrelation_matrix\
  \ = variables[['Weight', 'Length']].corrwith(variables['Horsepower'])\nprint(\"\
  Pearson correlation coefficients:\")\nprint(correlation_matrix)\nplt.figure(figsize=(12,\
  \ 6))\nplt.scatter(cars_df['Weight'], cars_df['Horsepower'])\nplt.xlabel('Weight')\n\
  plt.ylabel('Horsepower')\nplt.figure(figsize=(12, 6))\nplt.scatter(cars_df['Length'],\
  \ cars_df['Horsepower'])\nplt.xlabel('Length')\nplt.ylabel('Horsepower')\nListing\
  \ 4-3\nImport the required libraries, load the dataset, and explore it\n```\n\n\
  在代码清单 4-3 中，我们首先导入用于数据操作的 Pandas 库。我们使用 `pd.read_excel()` 函数将数据集 `CARS.xlsx` 加载到一个\
  \ Pandas DataFrame 中。然后，我们从数据集中提取 `Weight`、`Length` 和 `Horsepower` 列，并将它们存储在一个名为\
  \ `variables` 的新 DataFrame 中。\n\n我们使用 `corrwith()` 方法计算变量对 `Weight` 与 `Horsepower`\
  \ 以及 `Length` 与 `Horsepower` 之间的皮尔逊相关系数。该方法计算两个 DataFrame 或两个 Series 之间的相关性。在本例中，我们将\
  \ `variables` DataFrame 中的 `Weight` 和 `Length` 列与 `Horsepower` 列进行相关性计算。图 4-5 中的输出显示，马力与重量的相关性高于与长度的相关性。\n\
  \n![](img/619569_1_En_4_Fig5_HTML.jpg)\n\n**图 4-5** 皮尔逊相关系数\n\n为了确认这些相关性，让我们绘制散点图，如图\
  \ 4-6 所示。\n\n![](img/619569_1_En_4_Fig6_HTML.jpg)\n\n**图 4-6** 马力与重量和长度之间的相关性\n\n\
