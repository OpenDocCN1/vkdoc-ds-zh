  \ 中列 `D` 和 `R` 的描述性统计。`.describe()` 方法会为指定列生成计数、均值、标准差、最小值和最大值等汇总统计信息。\n\n`.isnull()`\
  \ 方法用于检查 DataFrame `past_elections_df` 中的缺失值，该方法返回一个由布尔值组成的 DataFrame，指示是否存在缺失值。接着，`.sum()`\
