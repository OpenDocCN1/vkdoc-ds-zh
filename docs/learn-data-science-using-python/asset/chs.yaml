  )\nplt.tight_layout()\nplt.show()\n清单 7-1-4\n拟合诊断图\n```\n\n这些图基于统计诊断，可以提供关于单个观测值对模型影响的见解。请根据您的具体分析和需求调整代码。让我们查看输出并对其进行解释。\n\
