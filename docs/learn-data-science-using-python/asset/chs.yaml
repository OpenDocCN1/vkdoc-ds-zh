- "# 4. 统计分析及线性模型\n\n在第 3 章中，我们探讨了图形与数据可视化。在第 4 章中，我们将研究统计学与线性模型。\n\n## 统计分析\n\n读取数据集后，通常需要执行一些统计分析任务，以理解数据并将其纳入报告中。本章将讨论频数表、汇总统计、相关性分析以及\
  \ T 检验。\n\n### 频数表\n\n频数表任务通常是探索任何数据集时的首要步骤之一。它根据数据生成频数表，显示每个变量的唯一水平。此外，该表还有助于识别离群值。\n\
  \n在此示例中，我们探索数据集文件夹中的`HEART.csv`文件，以查看有多少人患有高胆固醇。为此，我们重点关注字符串变量`CHOL_STATUS`。相关代码位于示例代码文件夹中第\
  \ 4 章的代码清单 4-1 中。\n\n在代码清单 4-1 中，我们将学习如何生成频数表，并以条形图的形式绘制频数分布。\n\n```\nimport pandas\
  \ as pd\nimport matplotlib.pyplot as plt\nheart_df = pd.read_csv('../Datasets/Chapter\
  \ 4/HEART.csv')\nfrequency_table = heart_df['Chol_Status'].value_counts().reset_index().rename(columns={'index':\
  \ 'Chol_Status', 'Chol_Status': 'Frequency'})\n# 按频数排序\nfrequency_table = frequency_table.sort_values(by='Frequency',\
  \ ascending=False)\n# 打印频数表\nprint(frequency_table)\n# 绘制频数图\nplt.figure(figsize=(8,\
  \ 6))\nplt.bar(frequency_table['Chol_Status'], frequency_table['Frequency'], color='skyblue')\n\
  plt.xlabel('Chol_Status')\nplt.ylabel('Frequency')\nplt.title('Frequency Plot of\
  \ Chol_Status')\nplt.show()\n代码清单 4-1\n频数表\n```\n\n在导入所需库并将 csv 文件读取到 Pandas DataFrame\
  \ `heart_df`后，我们计算频数表。以下代码行：`frequency_table = heart_df['Chol_Status'].value_counts().reset_index().rename(columns={'index':\
  \ 'Chol_Status', 'Chol_Status': 'Frequency'})`，执行了以下操作：\n\n*   `heart_df['Chol_Status'].value_counts()`：计算\
  \ DataFrame `heart_df`中`'Chol_Status'`列唯一值的频数。\n\n*   `.reset_index():`：重置结果序列的索引，将其转换为\
  \ DataFrame。\n\n*   `.rename(columns={'index': 'Chol_Status', 'Chol_Status': 'Frequency'}):`：将\
  \ DataFrame 的列重命名为`'Chol_Status'`和`'Frequency'`，以提高清晰度。\n\n然后，我们按`Frequency`列对频数表\
  \ DataFrame 进行降序排序，确保频数最高的类别显示在最前面。这是通过以下指令完成的：`frequency_table = frequency_table.sort_values(by='Frequency',\
  \ ascending=False)`。\n\n接着，我们将频数表 DataFrame 打印到控制台，显示`Chol_Status`列中每个唯一值的频数。此代码的输出结果如图\
  \ 4-1 中的表格所示。\n\n![](img/619569_1_En_4_Fig1_HTML.jpg)\n\n图 4-1\n\n频数表\n\n至于绘制频数图，如前所述，我们使用`plt.figure()`方法创建一个新图形，避免图表相互叠加。同时，我们用它来设置图形尺寸。然后，以`Chol_Status`序列为\
  \ x 轴，频数为 y 轴创建条形图，并添加相应的标签。最后两步是设置图形标题并显示图形。此部分的输出结果如图 4-2 所示。\n\n![](img/619569_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n频数条形图\n\n图 4-2 展示了`Chol_Status`的降序分布情况，其中`Borderline`在该数据集中占比最高，其次是`High`，频数最低的是`Desirable`。\n\
  \n\n\n### 汇总统计\n\n汇总统计任务提供所有观测值以及分组观测值内各变量的描述性统计。您还可以通过图形化展示（如直方图或箱线图）来汇总数据。\n\n\
  在本例中，我们回顾缅因州过去的选举情况，以观察是否存在任何可预测的结果（模式）。数据集位于 `Datasets` 文件夹中，文件名为 `Maine_Past_Elections.xlsx`。该\
  \ Excel 文件的内容如表 4-1 所示。\n\n**表 4-1** `Maine_Past_Elections.xlsx`\n\n| 年份 | 民主党票数\
