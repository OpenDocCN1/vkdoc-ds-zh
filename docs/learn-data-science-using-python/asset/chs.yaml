  `YOB` 的数据类型更改为数值型，以便对其执行算术运算。如代码清单 6-3 所示，我们使用 `pd.to_numeric()` 方法进行类型转换，并设置 `errors=''coerce''`
  参数，该参数会将无效的解析结果转换为 `NaN`。这种识别允许我们在计算年龄之前用默认值填充这些 `NaN` 值。不过，在本练习中，我们将保留其为 `NaN`。


