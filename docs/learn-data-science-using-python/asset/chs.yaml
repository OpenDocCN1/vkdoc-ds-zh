  \ `yf.download()` 方法，以下载指定股票代码的历史数据。接着，我们使用 `plt.plot()` 方法，通过设置颜色来绘制序列图。最后，像往常一样，我们设置图表标题、x\
  \ 轴和 y 轴的标签、显示网格，并在应用所有这些设置后显示图表。输出结果如图 3-11 所示。\n\n![](img/619569_1_En_3_Fig11_HTML.jpg)\n\
