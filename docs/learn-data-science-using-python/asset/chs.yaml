  \ fit\nmu, std = norm.fit(df1)\n#Plots the normal distribution curve using the calculated\
  \ mean and standard #deviation. The curve is in red and labeled as Normal Distribution\n\
  plt.plot(x, norm.pdf(x, mu, std), 'r-', label='Normal Distribution')\n#Sets the\
  \ label for the x-axis\nplt.xlabel('Annual_Rt')\n#Sets the title of the plot\nplt.title('The\
  \ Distribution of The Annual Rate of Charlotte City Employees')\n#Displays a legend\
  \ to identify the histogram and the normal distribution curve\nplt.legend()\n#Displays\
  \ the plot\nplt.show()\nListing 3-3-3\nEnhancing the appearance of the histogram\n\
