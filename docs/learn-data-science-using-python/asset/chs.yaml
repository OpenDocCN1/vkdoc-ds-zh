  \ GDP 之间的相关性\n\n## 假设检验\n\n假设检验是一种统计方法，用于基于样本数据对总体参数进行推断。它涉及将观测数据与预期假设或零假设进行比较，以确定任何观测到的差异或关系是否具有统计显著性，或者仅仅是随机因素造成的。\n\
  \n用于连续数据分析的假设检验示例包括 T 检验和方差分析，而卡方检验则用于分类数据分析。\n\n### T 检验\n\n我们经常需要确定两个不同组别之间的均值是否存在真实差异，或者所感知到的差异是否仅仅是随机变异的结果。T\
  \ 检验通过衡量两个数据集之间差异的可能性来服务于这一目的。换句话说，它评估两个样本的均值。值得注意的是，T 检验适用于小样本量，因为小样本量可能不服从正态分布。\n\
  \n\n\n#### 单样本 T 检验\n\n在此示例中，我收集了缅因州过去总统选举中代表两大主要政党的候选人在不同年份的所有投票数据。该数据集作为预测缅因州\
  \ 2016 年和 2020 年选举结果的基础。\n\n数据集 `MaineVotesDR.xlsx` 包含四列：`Election Year`（选举年份）、`Democratic\
  \ Votes`（民主党得票数）、`Republican Votes`（共和党得票数）和 `Result`（结果）。`Result` 列记录了一个二元结果：`0`\
  \ 表示共和党候选人获胜，而 `1` 表示民主党候选人获胜。\n\n我们的假设是共和党候选人将在 2020 年缅因州总统选举中获胜，而备择假设则表明民主党候选人获胜。\n\
  \n零假设 (H0)：`result = 0`  \n备择假设 (Ha)：`result = 1`\n\n现在，让我们加载数据集，并探索 T 检验如何揭示 2020\
  \ 年选举的结果，如代码清单 4-5 所示。\n\n```\nimport pandas as pd\nfrom scipy import stats\nmaine_votes_df\
  \ = pd.read_excel('../Datasets/Chapter 4/MaineVotesDR.xlsx')\n# 正态性检验\nnormality_test\
  \ = stats.shapiro(maine_votes_df['Result'])\nprint(\"正态性检验:\")\nprint(normality_test)\n\
  # t 检验\nt_stat, p_value = stats.ttest_1samp(maine_votes_df['Result'], 0)\nprint(\"\
  \\nT 检验:\")\nprint(\"T 统计量:\", t_stat)\nprint(\"P 值:\", p_value)\n代码清单 4-5\n单样本\
  \ T 检验\n```\n\n在代码清单 4-5 中，我们使用 `stats.shapiro()` 对 DataFrame 的 `Result` 列执行正态性检验。它适用于较小的样本量。结果将给出一个检验统计量和一个\
  \ p 值，以确定数据是否显著偏离正态分布。如果数据集大于 20 行，则可以使用 `stats.normaltest()` 函数。然后，我们使用 `stats.ttest_1samp()`\
  \ 对 `Result` 列执行单样本 t 检验，零假设 (h0) 为 0。我们打印两个检验的结果。输出如图 4-9 所示。\n\n![](img/619569_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9  \nT 检验结果：对 2020 年缅因州总统选举的预测\n\np 值 = 0.0004。由于 p 值小于 0.05，我们可以拒绝零假设。因此，我们可以得出结论，共和党候选人将在\
  \ 2020 年缅因州选举中失利。他确实输掉了缅因州。\n\n#### 双样本 T 检验\n\n在此示例中，问题是：两个性别之间的身高是否存在显著差异？\n\n\
  零假设是身高没有差异。备择假设是身高因性别而异。\n\n在此示例中，加载 CLASS 数据集，如代码清单 4-6-1 所示。\n\n```\nimport pandas\
  \ as pd\nimport numpy as np\nfrom scipy import stats\nimport seaborn as sns\nimport\
  \ matplotlib.pyplot as plt\n#https://www.kaggle.com/datasets/megasatish/class-data\n\
  class_df = pd.read_csv('../Datasets/Chapter 4/Class.csv')\n# 按性别进行正态性检验\nprint(\"\
  按性别进行正态性检验:\")\nfor Gender in class_df['Gender'].unique():\n    stat, p_value =\
  \ stats.shapiro(class_df[class_df['Gender'] == Gender]['Height'])\n    print(f\"\
  性别: {Gender}, 统计量: {stat:.2f}, p 值: {p_value:.4f}\")\n# 按性别进行 t 检验\n# 比较男性和女性\n\
  male_heights = class_df[class_df['Gender'] == 'M']['Height']\nfemale_heights = class_df[class_df['Gender']\
  \ == 'F']['Height']\nt_stat, p_value = stats.ttest_ind(male_heights, female_heights)\n\
  print(f\"\\n 男性和女性身高之间的 T 检验:\")\nprint(f\"T 统计量: {t_stat:.2f}, p 值: {p_value:.4f}\"\
  )\n代码清单 4-6-1\n双样本 T 检验\n```\n\n在代码清单 4-6-1 中，导入所需库并加载数据集后，我们使用 `scipy.stats` 中的\
  \ `.shapiro()` 方法（与上一个代码清单相同）检验每个性别组内身高的正态性。然后，我们遍历唯一的性别值（`M` 和 `F`），对每个性别的身高执行正态性检验。并打印每个性别的检验统计量和\
  \ p 值，如图 4-10 所示。\n\n![](img/619569_1_En_4_Fig10_HTML.jpg)\n\n图 4-10  \n按性别进行正态性检验\n\
  \n从图 4-10 中，我们不能拒绝零假设，因为没有足够的证据支持拒绝；p 值为 0.1645，大于 0.05。我们可以得出结论，两个性别之间的身高没有差异。但是，我们必须注意样本量很小。CLASS\
  \ 数据集仅包含 19 行。\n\n为了进一步理解数据分布，让我们使用箱线图和折线图来可视化每个性别的身高。如代码清单 4-6-2 所示。\n\n```\n#\
  \ 按性别可视化身高分布\nsns.boxplot(x='Gender', y='Height', data=class_df)\nplt.title('按性别划分的身高分布')\n\
  plt.show()\n# 对于 t 检验图，让我们使用 seaborn 按性别显示身高分布，\n# 突出显示均值和置信区间\nsns.catplot(x='Gender',\
  \ y='Height', kind=\"point\", data=class_df, join=False, capsize=.1)\nplt.title('显示按性别划分的身高均值的点图')\n\
  plt.show()\n代码清单 4-6-2\n可视化每个性别的身高\n```\n\n在代码清单 4-6-2 中，我们使用 `sns.boxplot()` 方法绘制每个性别的身高分布。如图\
  \ 4-11 所示，箱线图显示两组的中位数差异很小，几乎可以忽略不计。此外，如折线图所示，两组的均值之间也存在微小差异。\n\n![](img/619569_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11  \n按性别划分的身高分布箱线图和折线图\n\n## 总结\n\n本章解释了几乎所有分析和数据科学报告所需的最关键的统计概念。它们是频数表、汇总统计、相关分析和\
  \ T 检验。在下一章中，我们将学习运算符和循环。\n\n"
- '# 5. 数据预处理与特征工程


  本章介绍一些基本的数据清理和查询方法，例如注释语句、算术和比较运算符，以及如何表示缺失值和循环。


  ## 注释语句


  记录你的代码至关重要，这样你和你的同事才能理解分析构建背后的逻辑。通常，如果你不记录代码，几个月后你再看它时，可能不记得为什么使用某个函数或为什么进行某项检查。因此，代码文档对于遵循逻辑流程至关重要。


  Python 中注释语句的语法可以通过以下两种方式实现：


  ```

  #消息

  """消息"""

  ```


  你可以在程序中的任何位置使用注释语句来解释你的代码。Python 解释器在处理过程中会忽略注释语句中的文本。始终建议你在程序开头编写一条注释，说明你的程序将做什么，然后根据需要添加尽可能多的注释。为了描述逻辑流程，最好在每个数据或过程步骤处编写一条注释，描述其作用。




  ## 算术运算符与赋值运算符


  算术运算符表示执行算术计算，如表 5-1 所示。


  **表 5-1** 算术运算符与赋值运算符


  | 运算符 | 含义 | 示例 | 结果 |

  | --- | --- | --- | --- |

  | `+` | 加法 | `2 + 3` | `5` |

  | `+=` |   | `X = 5` `X += 15` | `X=20` |

  | `-` | 减法 | `5 – 3` | `2` |

  | `-=` |   | `X = 5` `X -= 15` | `X=-10` |

  | `/` | 除法 | `5 / 2` | `2.5` |

  | `/=` |   | `X = 15` `X /= 5` | `X=3.0` |

  | `//` | 商 | `5 // 2` | `2` |

  | `%` | 余数 | `5 % 2` | `1` |

  | `*` | 乘法 | `2 * 3` | `6` |

  | `*=` |   | `X = 15` `X *= 5` | `X=75` |

  | `**` | 幂运算 | `2 ** 3` | `8` |


  如果缺失值是算术运算符的操作数，则结果也为缺失值。为避免缺失值的传播，我们将在本章及下一章中讨论一些在数据集中表示和处理缺失值的方法。


  ## Python 运算符优先级规则：PEMDAS


  - `P`：括号（Parentheses）

  - `E`：幂运算（Exponentiation）

  - `M`：乘法（Multiplication）

  - `D`：除法（Division）

  - `A`：加法（Addition）

  - `S`：减法（Subtraction）


  你可以通过流行的运算符顺序口诀来记忆：“Please Excuse My Dear Aunt Sally.”


  ## 比较运算符


  比较运算符用于对两个变量、常量或表达式进行比较、运算或计算。如果比较结果为真，则返回 `True`；如果比较结果为假，则返回 `False`。比较运算符如表 5-2
  所示。


  **表 5-2** 比较运算符


  | 运算符 | 含义 | 示例 | 结果 |

  | --- | --- | --- | --- |

  | `==` | 等于 | `print(2 == 3)` | `False` |

  | `!=` | 不等于 | `print(2 != 3)` | `True` |

  | `<` | 小于 | `print(2 < 3)` | `True` |

  | `<=` | 小于或等于 | `print(2 <= 3)` | `True` |

  | `>` | 大于 | `print(2 > 3)` | `False` |

  | `>=` | 大于或等于 | `print(2>=3)` | `False` |

  | `in` | 成员资格 | `x=2` `print(x in (2,3,5))` | `True` |


  ## 逻辑运算符、成员运算符和身份运算符


  逻辑运算符用于表示两个条件或表达式之间的关系，判断它们是否同时为真、至少一个为真，或者条件是否应被反转。表 5-3 展示了三种类型的运算符：逻辑运算符、成员运算符和身份运算符。


  成员运算符用于检查某个值是否是集合或序列（如列表或字符串）的一部分。


  身份运算符用于判断两个变量在内存中是否为同一个对象，而不仅仅是值相等。


  **表 5-3** 逻辑运算符、成员运算符和身份运算符


  | 运算符 | 含义 | 示例 | 结果 |

  | --- | --- | --- | --- |

  | `and` | 如果两个语句都为真，则返回 `True` | `x=5` `x < 5 and x < 10` | `False` |

  | `or` | 如果其中一个语句为真，则返回 `True` | `x=5` `x < 5 or x < 4` | `False` |

  | `not` | 反转结果，如果结果为真则返回 `False` | `x=5` `not(x < 5 and x < 10)` | `True` |

  | `in` | 如果对象中存在包含指定值的序列，则返回 `True` | `y=[''bus'',''car'',''walk'']` `x=''car''`
  `x in y` | `True` |

  | `not in` | 如果对象中不存在包含指定值的序列，则返回 `True` | `y=[''bus'',''car'',''walk'']` `x=''car''`
  `x not in y` | `False` |

  | `is` | 如果两个变量是同一个对象，则返回 `True` | `x=[''bus'',''car'',''walk'']` `y=[''bus'',''car'',''walk'']`
  `print(x is y)` `print(x==y)` | `False` `True` |

  | `is not` | 如果两个变量不是同一个对象，则返回 `True` | `x=[''bus'',''car'',''walk'']` `y=[''bus'',''car'',''walk'']`
  `x is not y` | `True` |


  Python 中的运算顺序如下：括号、幂运算、一元正号、一元负号、乘法、除法、整除和取模、加法和减法、比较运算、身份和成员运算符、逻辑 `NOT`、`AND`、`OR`。


  ## 如何在原始数据中表示缺失值


  以下是原始数据中表示缺失值的值，以便 Python 解释器正确读取和存储这些值：


  ```

  null,  , NA, nan, NaN

  ```


  Python 解释器会将上述值转换为 `NaN` 并将其作为缺失值处理。请注意大小写，因为以下值不会被解释为缺失值：`None`、`none`、`na`、`Null`。


  让我们测试这些值，并通过一个示例了解 Python 解释器如何计算它们。在代码清单 5-1 中，我们测试了上述所有值以及其他一些统计编程语言中缺失值的表示形式。例如，“.”
  在 SAS 中表示缺失值。


  ```

  #import the libraries

  import pandas as pd

  import numpy as np

  import matplotlib.pyplot as plt

  #import the dataset

  students_df = pd.read_excel(''../Datasets/Chapter 5/missing.xlsx'')

  #verify that the dataset has been read correctly

  print(students_df)

  #generate the summary statistics

  students_df[''Height''].describe()

  #create a new empty dataframe that has the Height and Missing variables

  new=pd.DataFrame(columns = [''Height'', ''Missing''])

  #Height is equal the Haight column of the dataset

  new[''Height''] = students_df[''Height'']

  #Missing equals the Boolean output of checking of each value is missing or #not

  new[''Missing'']=students_df[''Height''].isnull()

  #print the new dataframe after filling it in

  print(new)

  ```


  **代码清单 5-1** 尝试不同的值来表示缺失值，并查看 Python 解释器能够正确读取哪些值


