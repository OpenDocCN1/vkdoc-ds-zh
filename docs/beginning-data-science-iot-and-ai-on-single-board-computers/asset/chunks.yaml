    Figure 11-7


    Connecting "Web service input" to the "Score Model"


    - Once you have completed these, click **RUN** to let the new model validate.
    Remember to wait for it to complete.

    - Click **DEPLOY WEB SERVICE** to deploy the model as a web service.


    You have now built an **experiment** which you can see by clicking the **Experiments**
    list on the left-hand menu. You have also created a **Web Service** object which
    we will link to from Azure: we will pass data into this Web Service. To do so
    we need to take note of a couple of details (URI and API Key):


    - Click the **Web Services** link on the left-hand menu. You will see a list showing
    at least one web service.

    - Click the name of the web service we just created – by default it will be named
    **Weather prediction model (Predictive Exp) (Figure** [**11-8**](#486852_1_En_11_Chapter.xhtml#Fig8)**)**.


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig8_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig8_HTML.jpg)


    Figure 11-8


    Link for accessing the details of the web service'
