    ## 10.2 AI/ML?


    The terms machine learning (ML) and artificial intelligence (AI) are encountered
    frequently in the press and social media, but few of us are clear on the distinction.
    At the risk of annoying experts by oversimplifying, the key difference between
    AI and ML can be summed up as follows:


    *   **AI** is concerned with creating machines that display **intelligent behavior**.


    *   The core goal of **ML** is data analysis. It is a branch of AI that focuses
    on systems that can learn and improve from experience: enhancing the quality and
    accuracy of the outcomes they produce or finding new and novel ways to reach an
    outcome.


    > ML is a subset of AI, and the example we look at later in the book is an ML
    implementation.


    To illustrate the difference between AI and ML consider this: when AlphaGo beat
    the world’s best player at the board game Go it was a triumph of ML. It would
    be a triumph of AI if AlphaGo decided to deliberately lose a game to avoid being
    detected, or to ensure its human opponent did not get too upset.


    We are not going to look at each of the 14 different types of learning that compromise
    ML. Neither are we going to ponder the three or four different types of AI or
    probe exactly what is, and isn’t, ML. The core elements that comprise AI are fascinating,
    but again we will pass. Our goal here is to foster an intuitive understanding
    of AI and learn how to use it as a tool for data science experimentation.'
  trans: '

    # 10.1 人工智能


    要理解人工智能，我们首先需要理解真正的东西：什么是真正的智能？其他生物或机器是否拥有智能？我们人类，真的拥有智能吗？


    借助我们对数据科学日益深入的理解，要客观地、以任何科学严谨的态度来回答诸如此类的问题，其挑战在于收集关于我们所研究对象的*数据*。而收集数据需要某种形式的*测量*。作为数据科学家，我们需要一个关于“智能”的简洁且客观的定义，以及一种测量它的方法。


    但关于智能究竟是什么，并没有真正的共识；没有普遍的定义或便捷的测量工具。


    智商测试（图 10-1）是测量“智能”最广为人知的方法。还有其他类似的测试，以及一些完全不同的方法，例如计算脑化指数或由训练有素的心理学家进行评估。


    智商测试以及我们现有所有方法的问题在于，它们试图测量的对象缺乏明确性。智商测试的结果与在一系列有限的脑力技能上的表现相关，而这些技能受到设计该测试的科学家们的高度重视。这些脑力技能被认为是与“智能”紧密相关的因素。


    也许当我们最终有了一个人人都认同的智能定义时，我们会观察到它与智商分数之间存在相关性。但我们可以确信的是，它只衡量了某人在一组任务中的表现如何。我们会质疑将智商数据外推并直接作为智能衡量指标的有效性和可靠性。


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig1_HTML.jpg](img/486852_1_En_10_Fig1_HTML.jpg)


    图 10-1


    一个智商测试例题（来自瑞文标准推理测验示例）。哪个图案适合填入空白方格？来源：[`en.wikipedia.org/wiki/Intelligence_quotient#/media/File:Raven_Matrix.svg`](https://en.wikipedia.org/wiki/Intelligence_quotient%2523/media/File:Raven_Matrix.svg)


    似乎不可避免的是，这种智商并非将我们与蛞蝓或树木区分开来的那种智能。*正是那种*智能才是计算机科学家及其资助者们的圣杯。


    尽管“智能”一词定义模糊，但我们在识别他人以及非人类实体（例如海豚、黑猩猩或计算机）的**智能行为**时却毫不费力。


    **智能行为**是满足以下条件的行动：


    -   观察者不会将其归因于运气或对习得行为的模仿。

    -   不是反射或自动反应：它们需要行为发出者的意志和洞察力。

    -   其结果为该实体带来有利的结果，或避免不利的后果。

    -   我们不会预期在相同情况下，其他类似实体会每次都重复该行为。

    -   不是孤立事件。一个智能实体应预期会定期表现出智能行为。


    因此，我们可以观察到行动中的智能。诚然，将某个行为标记为**智能行为**是主观的，但我们可以列举出广泛人群都会认同其符合**智能行为**门槛的行为。对于机器而言，一些示例如下：


    -   它表现出一种并非被编程设定、但对达成目标有效的行为。

    -   它表现出一种行为，达成了它未被编程设定要去追求的目标。


    关注智能行为为我们提供了一种定义智能的实用方法：


    -   智能是促使有机体或机器展示“智能行为”的驱动力。


    具有讽刺意味的是，阿甘无意中说对了：“*蠢人做蠢事*”；对我们而言，这可以理解为“智能就是展现智能行为”。不过，他说得更好听一些。


    ## 10.2 人工智能/机器学习？


    机器学习（ML）和人工智能（AI）这两个术语在新闻和社交媒体上经常出现，但很少有人清楚它们的区别。冒着因过度简化而惹恼专家的风险，AI 和 ML 的主要区别可以总结如下：


    -   **AI** 专注于创造能够展现**智能行为**的机器。

    -   **ML** 的核心目标是数据分析。它是 AI 的一个分支，专注于能够从经验中学习和改进的系统：提高其产生结果的质量和准确性，或寻找达成目标的新颖方法。


    > ML 是 AI 的一个子集，本书后面章节所看的示例正是一个 ML 实现。


    为了说明 AI 和 ML 的区别，请考虑这一点：当 AlphaGo 在棋盘游戏围棋中击败世界顶尖选手时，这是 ML 的胜利。如果 AlphaGo 为了不被发现，或为了确保其人类对手不至于太过沮丧而故意输掉一局，那才是
    AI 的胜利。


    我们不打算逐一分析构成 ML 的 14 种不同类型的学习。我们也不会去思考三四种不同类型的 AI，或探究究竟什么算 ML、什么不算。构成 AI 的核心元素虽然迷人，但我们也暂且略过。我们在此的目标是培养对
    AI 的直观理解，并学习如何将其用作数据科学实验的工具。

    '
- fmt: "### 10.3 ML/AI and Data Science\n\nThe field of AI is vast and complicated;\
    \ we can barely hope to scratch the surface in a single chapter. But scratching\
    \ the surface is all we need to be able to use AI in our data science work – in\
    \ the same way that we can drive a car without building it from scratch, so we\
    \ can use AI services in our data science endeavors without knowing how to build\
    \ an AI model ourselves.\n\nThere are a large range of AI services that are available\
    \ for public use, and many of those are transactional: data is passed into the\
    \ service, some activity is undertaken using the data, and some data is returned.\
    \ It's quite mundane really.\n\nUsing a service requires no real knowledge of\
    \ what actually goes on within the service: how it manipulates and transforms\
    \ our data is a \"black box.\" Nevertheless, as was the case with sensors, to\
    \ use these services effectively a basic understanding of what they do with our\
    \ data is ideal. In the next section we undertake an exercise that will help us\
    \ understand how an ML service operates.\n\nThere is a lot of hype about what\
    \ AI is capable of and what the future holds for it. But make no mistake, the\
    \ cleverest AI does not have a patch on you as far as being able to undertake\
    \ novel and intuitive cognitive leaps. The edge that AI has over us resides in\
    \ its ability to crunch numbers: to work with mind-boggling huge sets of data\
    \ and to perform a staggering volume of analysis on that data.\n\nAI is a very\
    \ powerful tool for sophisticated data science applications, but without a human\
    \ being somewhere in the process an AI is little more than an infernal machine\
    \ – a robot dog forever chasing its own tail. AI is like the chef, using all manner\
    \ of ingredients to serve its human masters with perfectly prepared meals, but\
    \ the chef is unable to taste its own creations. Ultimately it is humans who will\
    \ look at any facts/conclusions generated by an AI and will make the most important\
    \ judgment: is this interesting?\n\nOne of the pivotal moments for AI in the twentieth\
    \ century was when IBM's Deep Blue supercomputer (Figure [10-2](#486852_1_En_10_Chapter.xhtml#Fig2))\
    \ beat grandmaster and world number 1 Gary Kasparov at chess, in May 1997. The\
    \ computer won 3.5/2.5 in a six game series, and for many this felt like the beginning\
    \ of the end of human intellectual dominance. Forevermore would computers be \"\
    better\" than humans at chess – what next?\n\nBut there is more to the story:\
    \ Kasparov put forward a strong case arguing that something untoward occurred\
    \ (he used the term \"cheating\"). He presented a few arguments in support; the\
    \ most interesting was one particular move that Deep Blue made that Kasparov was\
    \ adamant an AI would not be capable of formulating. Deep Blue had several human\
    \ operators who worked on it while the game was being played, so the means to\
    \ interfere existed. Fuel was given to Kasparov's claims when IBM refused his\
    \ demands for a rematch and dismantled Deep Blue. Whatever the truth is, this\
    \ battle between human and AI was big news and the success of Deep Blue signaled\
    \ a new era: AI had arrived.\n\n![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig2_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig2_HTML.jpg)\n\
    \n**Figure 10-2**  \nIBM's Deep Blue, at the Computer History Museum. [https://commons.m.wikimedia.org/wiki/File:Deep_Blue.jpg#mw-jump-to-license](http://commons.m.wikimedia.org/wiki/File:Deep_Blue.jpg%2523mw-jump-to-license)\n\
    \n### 10.4 Thinking Like a Machine\n\nIt is often said that the best way to understand\
    \ someone is to walk a mile in their shoes. By extension, to understand ML it\
