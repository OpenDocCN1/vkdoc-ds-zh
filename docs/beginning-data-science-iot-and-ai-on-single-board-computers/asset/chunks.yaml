    \n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig29_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig29_HTML.jpg)\n\
    \n  Figure 11-29  \n  Searching and selecting the “Response” action\n\n- Provide\
