  trans: '

    # 3.10 分析我们收集的数据


    在第 1 章和第 2 章中，我们探讨了针对数据和实验设计可以提出的各种问题。当数据分析开始时，这些应当始终萦绕在你心头。


    但对于本次实验，我们明确的目标非常清晰：记录数据的人要了解温度、湿度和气压如何共同影响他们对天气的个人感受。在你下一次度假时，你最希望这些变量各自达到什么水平？


    让我们看看能从图表中发现什么。由于本次实验中制作的每一张图表都会不同，所以无法预判你看到的具体内容。相反，我们将回顾作者们在开展这项实验时所收集到的结果。


    我们在**图****3-12**中看到了完整的结果，但我们要寻找的是其中的模式。为了帮助观察，请思考我们在**图****3-13**中添加的以下标记：


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig13_HTML.jpg](img/486852_1_En_3_Fig13_HTML.jpg)


    图 3-13


    将我的温度和气压评分分组


    -   温度标记周围的红色框

    -   气压标记周围的黄色框

    -   将这两者框在一起的黑色框


    这个黑色框非常有效地展示了我的评分与温度和气压之间的关系：


    -   **图****3-13****的左上方**：我的评分与温度强烈相关：我喜欢温暖的日子，相比寒冷的日子往往会给出更高的分数。这并非令人惊讶的新信息：我早就知道这一点。但这仍是个好消息：我所创建的可视化图表显示了一个我知道真实存在的相关性，这验证了我们所用的可视化方法。也许数据中还潜藏着其他不那么明显的相关性。


    -   **图****3-13****的左下方**：气压也与我的评分相关：比起低压的日子，我更喜欢高压的日子。这让我有点意外：在进行这项实验之前，我并未怎么留意过这一点。


    -   **高湿度与我的极端评分相关**：如果湿度很高，我要么会非常喜欢这一天，要么会极其讨厌它。这也让我有点意外，并且我不确定该如何解读。这是有用的信息，还是仅仅有趣而已？


    你发现了类似的情况吗？每张可视化图表都是独一无二的，任何得出的结论也都是个人化的：它们只适用于记录评分数据的那个人。


    > *对于完成该可视化图表的某些人来说，温度和气压的标记很可能显示出相关性的证据。在所示的数据中，我们可以看到（相对）低温与低压往往同时出现，高温与高压也是如此。这可以从图**3-13**中观察到：右侧的图表显示气压和温度表现出非常相似的行为。你的温度和气压评分也显示出这种特征吗？*


    如果答案是“是”，那么人们可能倾向于认为温度与气压之间存在相关性已成定论。但是，我们的实验并非为得出这一结论而设计的。我们的实验已经达到了目标：我们了解了一些关于自己如何感知天气状况的事情。此外，它还为我们暗示了一些有趣的事情：两种完全不同的现象之间存在真实世界的相关性。但是，要想有把握地断言温度与气压之间存在相关性，我们需要收集更多的数据，并使用更复杂的分析技术。在得出结论时务必谨慎：硬核事实是数据科学中珍贵的宝藏，而且通常得来不易。


    ## 3.11 本章小结


    在本章中，我们着手了解温度、湿度和气压如何影响我们对天气的感知，并构建了工具和可视化图表来帮助我们回答这个问题。我们的目标是引入相关性的概念，并在收集的数据中寻找它们。我们将在**第****5****章**再次探讨相关性。


    有些读者可能已经在自己的可视化图表中观察到了有意义的关联：它们告诉你一些感觉有趣和/或真实的东西。也许这已经是你所知道的事情（我们大多数人都知道温度如何影响我们对天气的评价），也可能是新的信息（较少人意识到大气压的影响）。然而，关键收获并非我们了解（或未了解）到关于温度、湿度或气压的什么内容。相反，这项练习表明，你可以收集不同的数据集并应用分析技巧来揭示它们之间的关联：利用数据科学，我们可以分析不同现实世界现象相互之间的影响。我们能够了解到关于这个世界的新知识。


    脚注 1   2   3


    # 4. 处理大型数据集


    在本章中，我们将通过显著增加收集的数据量，在数据科学实验方面向前迈进一步。到目前为止，我们只处理了十几个数据点，这足以满足我们的需求。但有时候相关性（以及数据其他有趣的特征）是微妙的，难以发现。我们的数据集越大，我们寻找的答案就越有可能存在于其中。


    如果我们打算收集成百上千甚至数百万个数据点，我们的工具包就存在一个弱点：这个缺陷限制了我们可以合理收集的数据量。考虑这个问题：如果我们想记录一段较长时间（比如说
    24 小时）内的天气测量数据，我们该如何重新设计**第****3**章中的实验？


    这个弱点当然就是那个手拿纸笔、尽职尽责地在风雨中站上整整一天一夜、每隔 5 分钟记录一次温度、湿度和气压的人。


    在本章中，我们将通过数字化方式收集和存储数据，从而开始消除数据收集过程中的人为因素。这将使我们能够建立起一个包含大量温度和气压数据的数据库，我们将在**第****5****章**中分析这些数据之间的相关性。

