    # 自省


    在任何实验中，都要思考如何改进：


    - 如何提高效率（即节省人力/精力）？请全程考虑技术解决方案。

    - 能否让实验更环保？

    - 如何让数据更有效、更可靠？

    - 效率与数据可靠性/有效性之间是否存在权衡？如果存在，下次应做出哪些改变？

    - 能否扩大规模？一小时内能采集多少个地点的样本？如果存在上限，如何克服？

    - 如何基于实验进行扩展？例如，如何设计实验，使其在一天内每半小时读取一次不同的数据？

    - 是否存在任何伦理问题？


    你是否发现上述问题的任何答案有趣或有价值？只需一两个洞见，就足以让一切努力变得值得。


    我们将在后续章节更详细地探讨数据分析——目前请记住，所有数据分析的根源，都是一组类似前述的问题。


    ## 1.10 总结


    我们都是数据科学家。在日常生活中，我们往往在不经意间消费数据。我们不断利用提供的信息来做决策、制定计划，甚至只是进行交谈。


    本章我们快速了解了数据的完整旅程：从实验设计开始，通过某些工具进行采集，再经过分析并转化为信息。


    要深入数据科学，我们需要比水银温度计更复杂的工具。在第 2 章中，我们将探讨如何自行构建测量数据的仪器。


    # 2. 数据科学走向数字化


    本章我们将确定一套电子元件，并用它们构建一系列不同的数字工具。这些工具将用于收集数据，而数据是我们踏上数据科学之旅的关键燃料。


    ## 2.1 使其数字化


    你是否知道，地球上的每一位青少年都出生于 21 世纪，即在互联网、电子邮件甚至谷歌诞生之后？如今成长的许多孩子从未体验过没有数字魔法的世界。我们生活在一个数字时代——它悄然降临在部分人身边，但越来越多的人一出生就身处其中。人们甚至将我们当前的时代称为数字时代或信息时代，这承认了信息已融入我们生活的方方面面。数字革命——用数字技术取代模拟技术——为现代社会奠定了基础。


    尽管第 1 章中的模拟温度计表现良好，但要进一步学习数据科学，我们需要接触日益复杂的数据集：随着实验规模的扩大，我们将收集成百上千、甚至数百万个数据点。我们的模拟温度计已无法胜任此任务，其他模拟工具亦是如此。我们需要复杂的数字工具才能完成这一旅程。


    ## 2.2 数字测温


    在第 1 章中，我们了解了模拟温度计的工作原理；数字温度计的基本原理与之相同。环境温度会导致某种物质发生反应、产生变化，而这种变化会以某种方式被观测到：


    - 在模拟温度计中，水银的可见液面发生变化。

    - 在数字工具中，该反应被转换为计算机（或微处理器）能够感知和解读的电信号。


    图 2-1 展示了构成数字温度计的不同组件。这是一个非常基础的“电路图”或“框图”，其风格贯穿全书。


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig1_HTML.jpg](img/486852_1_En_2_Fig1_HTML.jpg)


    **图 2-1** 数字温度计的核心组件


    任何数字温度计都包含以下组件：


    1. **电源**：数字电路需要电力供应。

    2. **微处理器**：其作用将在下文详细说明。

    3. **温度传感器**：当电力供应给温度传感器时，它会对其周围的环境温度做出反应。传感器通过电路传输其状态数据，其作用与模拟温度计中的水银相同。

    4. **输出温度数据的方式**：例如，在屏幕上显示。

    5. **这些组件需要以某种方式连接起来**：连接组件的线路同样重要。


    ### 微处理器的作用


    微处理器好比婴儿的大脑：潜力无限，但自身无法实际完成任何事。婴儿通过被教导来学习执行基本动作，而我们则通过将计算机程序加载到微处理器上来“教导”它执行基本动作。


    微处理器是电路的“大脑”。电流在电路中流动，微处理器“监控”电流，解读其中编码的任何数据，然后据此做出行动。要充当温度计：


    - 微处理器知道自己需要“监听”来自温度传感器的任何信号：它之所以知道，是因为有人——也许是我们——对它进行了相应“编程”。当接收到传感器的信号时，微处理器能够将该信号转换为一个可用的数据点：即温度读数。

    - 微处理器也知道如何向屏幕发送信息以显示文字和数字：它之所以知道，同样是因为在程序中被告知了方法。它会向屏幕发送一个信号，使屏幕显示温度。有人——也许是我们——已经对微处理器进行了编程/告知，使其知道在屏幕上显示什么信息以及如何显示。


    ## 2.3 构建数字工具


    我们真的需要学会构建数字工具才能成为数据科学家吗？在专业领域，数据科学家并不需要成为工具制造者：


    - 有许多现成的产品可以满足您的数据收集需求。您可以购买气象监测仪、二氧化碳监测仪以及能显示温度的应用程序。

    - 开展数据科学工作的团队可能拥有多个领域的专家，各自负责流程的不同部分：可能会有其他人负责构建数据收集工具。

    - 您可以委托他人为您收集数据。许多企业会向您出售各种数据。或者使用在线工具。


    本书是为那些无法使用上述方法的人编写的；我们将不得不自行收集数据，并构建所需的数据收集工具。


    知道如何构建数字工具始终是一项有用的技能，但这显然不是数据科学的核心技能。数据科学领域涵盖众多学科：数据分析师、工具制造者、数据收集者、项目经理和实验设计师等。他们的贡献在数据科学流程中都发挥着作用。在本书中，我们只需学习足够的电路构建知识，以便能够构建探索数据科学所需的工具。我们将向您展示如何做到这一点，而无需先成为工程师：阅读本书并不需要任何电路构建（或计算机编程）的先前知识。

    '
- fmt: '# 2.4 Using the BBC micro:bit As a Thermometer


    Did you know that the BBC micro:bit has a built-in temperature sensor? It is easy
    to use and means that the micro:bit can be programmed to behave like a thermometer,
    which is what we are about to do.


    We’ve seen how understanding a measuring tool helps us to understand the data
    that it yields:


    When the BBC micro:bit was built they did not include a temperature sensor on
    the board. It was only after it had been designed that one of the engineers realized
    there was a chip on the micro:bit with a built-in heat sensor, and that it was
    possible to access the temperature from that. There is a similar story about how
    someone realized that the light sensitivity of the LED matrix could be used as
    a crude sensor.


    To use the micro:bit as a thermometer we will have to write some code, which we
    will then copy (or flash) onto the micro:bit. Every digital tool that we build
    will need to be coded.


    # 2.5 Coding Guidelines Used in This Book


    Throughout the book we are going to build ever more sophisticated digital tools
    to help us develop our data science skills, and each tool will need to have code
    written for it. When it comes to coding the tools we will always provide two options:


    1. **The no-code option**: Go to our resource website (`http://xib.one/XB`) and
    find “Section X.Y”. You will see a hex file that you can download and flash straight
    onto your micro:bit. Instructions are on the page. Throughout the book, we will
    offer you “no-code” solutions.


    2. **An option that you can code yourself:** Where possible we will use Microsoft
    MakeCode, which is a fun and easy-to-use block code editor. Where MakeCode does
    not provide the functionality we need MicroPython is used. We will use the Mu
    editor for our MicroPython coding.


    If you choose to write your own code we will show you first the natural language
    code: a step-by-step description of the process required to achieve our goals,
    written in natural language. We will then show you the MakeCode blocks (or MicroPython
    code) needed to turn that natural language code into real code that will work
    on your micro:bit. This approach makes it easier to adapt the code to different
    hardware platforms or different coding languages: the natural language code serves
    as a simple but adequate software specification.


    # 2.6 Using the micro:bit Code Editors


    If you choose to write the code yourself then you need to choose a code editor.
    There are several options for the BBC micro:bit; we will provide guidelines for
    MakeCode and Mu (MicroPython).


    The purpose of this book is not to introduce you to coding on the BBC micro:bit
    – there are many great books you can use for that. But for those of you who are
    new to coding on the BBC micro:bit there are a few key topics that you will need
    to understand. You will be able to read up on them in links from our resource
    website (`http://xib.one/XB`).


    # 2.7 Using the “No-Code” Option


    Not everyone who needs to use a weather station wants to write the code for it
    themselves. In some situations coding is an important skill, while in others it
    is irrelevant: building a weather station in a computer science class and in a
    geography class will be approached in completely different ways and will have
    very different learning outcomes. And of course, the focus of this book is on
    data science: the tools we build and the code we write for them are just enablers
    – we need them to tell the data science story properly, but they are not the heroes
    of the story.


    The no-code option , along with the easy-to-build system of components that we
    describe later in this chapter, will allow you to get your digital tools up and
    running in minutes. You will just need to build the tool as described, and then
    download the code from the URL provided.


    And don’t think of this as cheating! You don’t program a new fridge when you buy
    one, nor are you expected to code your car before you drive it. So why should
    you have to program a data gathering tool?'
