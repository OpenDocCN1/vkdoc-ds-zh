    \n## 11.6 使用 Azure Logic Apps 创建工作流\n\n让我们回顾一下我们到目前为止所做的工作：\n\n1.  我们设置了一个**Azure**帐户以访问其云服务。\n\
    2.  我们配置了一个**IoT 中心**，以便我们可以在 Azure 和我们的气象站之间通信数据。\n3.  我们启动了**Azure ML Studio**，选择了一个天气预测模型，然后将其设置为可供使用。\n\
    \n到目前为止，有三个独立的组件/服务需要协同工作：我们的气象站设备、IoT 中心以及 ML Studio 模型/实验。比这更复杂的实验可能有多个数据源，并可能使用各种服务/附加组件。工作流工具用于帮助管理具有许多动态部分的复杂项目：本质上，它们确保步骤按正确的顺序执行。\n\
    \n在本节中，我们使用**Azure Logic Apps**构建一个工作流。此应用程序将定期检查我们的气象站是否正在发送数据。当检测到新数据时，此应用程序将通过\
    \ Web 服务将其发送给天气预测模型（托管在 Azure ML Studio 上）。它还将接收来自 ML 服务的响应，将其转换（**解析**）为我们指定的格式，然后将结果发送回我们的气象站设备。\n\
    \n按照此处列出的步骤创建一个新的逻辑应用：\n\n- 在 Azure 主页上的 **Azure 服务** 下，点击 **创建资源**。\n- 在 **新建**\
    \ 页面的 **Azure 市场** 下，点击 **集成**，然后点击 **逻辑应用**（**图** **11-14**）。\n\n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig14_HTML.jpg](img/486852_1_En_11_Fig14_HTML.jpg)\n\
    \n    图 11-14\n\n    选择逻辑应用资源\n\n- 在 **逻辑应用** 窗格中，提供有关逻辑应用的信息，如 **图** **11-15**\
    \ 所示。完成后，点击 **审阅 + 创建** 来验证信息。\n\n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig15_HTML.jpg](img/486852_1_En_11_Fig15_HTML.jpg)\n\
    \n    图 11-15\n\n    “基本信息”选项卡的详细信息\n\n- 如果提供的信息正确，点击 **创建**。这将开始部署你的逻辑应用。这可能需要一些时间。\n\
    - 点击 **转到资源** 以访问已部署的逻辑应用（**图** **11-16**）。\n\n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig16_HTML.jpg](img/486852_1_En_11_Fig16_HTML.jpg)\n\
    \n    图 11-16\n\n    部署确认消息\n\n提示\n\n您也可以通过直接在搜索框中输入名称来查找并选择您的逻辑应用。\n\n- **逻辑应用设计器**\
    \ 将打开，并显示包含介绍视频和常用触发器的页面。\n- 向下滚动页面。在 **模板** 下，点击 **空白逻辑应用**。\n\n## 11.7 设置工作流\n\
    \n我们现在来审查刚刚创建的工作流，并确保每个步骤都配置正确。\n\nAzure Logic App 管理着五个基本操作/步骤/事件，它们是工作流的关键；无论您使用什么服务来实现\
    \ ML，都会有与这些步骤等同的步骤：\n\n1.  从气象站设备发送数据\n2.  将数据传递到 ML 服务\n3.  解释（“解析”）来自 ML 服务的结果\n\
    4.  设置一个变量来存储来自 ML 服务的数据\n5.  管理并将此数据发送回气象站设备\n\n我们将更详细地审查每个步骤。\n"
- fmt: "### Step 1: Sending Data from the Weather Station Instrument\n\nThe workflow\
    \ begins/triggers when data is sent from the weather station instrument. This\
    \ step is referred to as the `When a http request is received` trigger in the\
    \ Azure Logic App.\n\nTo set up this part of the workflow:\n\n- In the `Logic\
    \ App Designer`, under the `search box`, select `All`.\n- In the search box, enter\
    \ `http` to find the HTTP triggers.\n- From the `Triggers` list, click `When a\
    \ http request is received` trigger (Figure [11-17](#486852_1_En_11_Chapter.xhtml#Fig17)).\n\
    \n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig17_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig17_HTML.jpg)\n\
    \n  Figure 11-17\n  Choosing “When a HTTP request is received” trigger\n\n- Provide\
    \ the information for the `When a http request is received` trigger as shown in\
    \ Figure [11-18](#486852_1_En_11_Chapter.xhtml#Fig18).\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig18_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig18_HTML.jpg)\n\
    \n  Figure 11-18\n  `When a http request is received` trigger details\n\n- The\
    \ following is the full listing of the `Schema` that you can directly copy in\
    \ the `Request Body JSON`^(17) `Schema` text box:\n\n```\n{\n\"properties\":\n\
    {    \"humidity\":\n{    \"type\": \"integer\"\n},\n\"temperature\":\n{    \"\
    type\": \"integer\"\n}\n},\n\"type\": \"object\"\n}\n```\n\n### Step 2: Passing\
    \ Data into the ML Service\n\nThe next step in the workflow is to pass the temperature\
    \ and humidity values to the Azure ML web service we set up in Section 11.2.\n\
    \n| Method: | POST                                                           \
    \                                                                   |\n| :------\
    \ | :--------------------------------------------------------------------------------------------------------------------------------\
    \ |\n| URI:    | The Request URI copied from the `Request Response API Documentation\
    \ for Weather prediction model [Predictive Exp.]`. – See Section 11.5.       \
    \    |\n| Headers:   | `Accept`                 | `application/json`         \
    \                                     |\n|         | `Authorization`         \
    \ | The API Key copied from the `Request Response API Documentation for Weather\
    \ prediction model [Predictive Exp.]`. – See Section 11.5. Note: Make sure to\
    \ add a space between `Bearer` and the `API key`. |\n|         | `Content-Type`\
    \           | `application/json`                                             \
    \ |\n| Queries:  | Keep it as blank                                          \
    \                                                                       |\n| BODY:\
    \   | `{   \"GlobalParameters\": {},   \"Inputs\": {       \"input1\": {     \
    \      \"ColumnNames\": [               \"temperature\",               \"humidity\"\
    \           ],           \"Values\": [               [                   \"value\"\
    ,                   \"value\"               ]           ]       }   }}`      \
    \                                                                            \
    \                                  |\n| Cookie:  | Keep it as blank          \
    \                                                                            \
    \                           |\n\n- In the designer view click `+ New step` (Figure\
