- fmt: '# 3.6 Coding Our Weather Station


    The hardware is ready, but we need to teach the microprocessor/micro:bit how to
    behave like a digital weather station: we need to code it.


    **Table 3-3** shows the natural language code which we will convert into `MakeCode`
    blocks.


    **Table 3-3** Natural language code for a digital weather station


    | Step | Natural language code | Notes |

    | --- | --- | --- |

    | 1 | Load any libraries that are required. | *We’ll need the core micro:bit library
    as well as the library for our weather sensor.* |

    | 2 | Keep repeating the following steps. | *The program will run continuously
    until the micro:bit is switched off. The following actions will be repeated…*
    |

    | 3 | Print “T” on screen and then show the temperature. | *We just print “T”
    for temperature to avoid waiting ages for it to scroll.* |

    | 4 | Print “H” on screen and then show the humidity. | *We just print “H” for
    humidity for the same reason.* |

    | 5 | Print “P” on screen and then show the atmospheric pressure. | *We just print
    “P” for atmospheric pressure.* |


    > ***No-code option***: *You can find a precompiled version of the code used in
    this section on our* ***resource website**. Go to* [*http://xib.one/XB*](http://xib.one/XB)
    *and search for* ***Section 3.6**.*


    **Table 3-4** shows how to convert the natural language code earlier into MakeCode
    blocks that can be compiled and loaded onto your micro:bit.


    **Table 3-4** Developing code with MakeCode blocks


    | Step | MakeCode | Notes |

    | --- | --- | --- |

    | 1 | Add the XinaBox `SW01` extension to your project. | • Click **Advanced**/**Extensions**.• Type
    in “XinaBox”².• Select `SW01`. |

    | 2 | Ensure you have a `forever` loop in your coding area. | ![../images/486852_1_En_3_Chapter/486852_1_En_3_Figa_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Figa_HTML.jpg)
    |

    | 3 | Add the two blocks shown here to the `forever` block:![../images/486852_1_En_3_Chapter/486852_1_En_3_Figb_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Figb_HTML.jpg)
    | The first block causes “T” to be displayed.The second block displays the temperature
    as a whole number. |

    | 4 | Add the two blocks shown here to the `forever` block after the temperature
    blocks:![../images/486852_1_En_3_Chapter/486852_1_En_3_Figc_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Figc_HTML.jpg)
    | The first block causes “H” to scroll.The second block displays the relative
    humidity. It doesn’t need to be converted to a round number. |

    | 5 | Add the 2 blocks shown here to the `forever` block after the humidity blocks:![../images/486852_1_En_3_Chapter/486852_1_En_3_Figd_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Figd_HTML.jpg)
    | The first block causes “T” to be displayed.The second block displays the pressure
    as a whole number. |


    **Figure 3-5** shows the full MakeCode program listing for the micro:bit weather
    station.


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig5_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig5_HTML.jpg)


    **Figure 3-5** MakeCode blocks for the micro:bit weather station


    Now that the code has been written you just need to compile it and download (“flash”)
    it onto your micro:bit.


    Once the flashing process has been completed the temperature, humidity and atmospheric
    pressure data will scroll continually on the 5x5 LED matrix.


    The sensor readings are taken from a small chip mounted onto the `SW01`: the Bosch
    `BME280` is the tiny metal cube on the front of the `SW01`. Test that the sensor
    is working by manipulating the readings:


    1. **Temperature**: Touch the sensor for a few seconds with a finger. The heat
    from your finger should cause the temperature to rise (**Figure 3-6**).


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig6_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig6_HTML.jpg)


    **Figure 3-6** Touching the sensor with a finger


    2. **Humidity**: Manipulate the humidity by breathing onto the `BME280` sensor.
    The moisture in your breath should cause the humidity to increase (**Figure 3-7**).


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig7_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig7_HTML.jpg)


    **Figure 3-7** Humidifying the sensor


    3. **Pressure**: Take a hollow rubber tube and place one side on the `SW01` so
    that it covers the `BME280` sensor. Hold the tube and board tightly together.
    Now blow air (blow hard through pursed lips) into the other end of the tube. This
    should increase the pressure (**Figure 3-8**).


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig8_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig8_HTML.jpg)


    **Figure 3-8** Applying air pressure onto the sensor


    ## 3.7 Upgrading the Display


    The micro:bit 5x5 LED matrix is adequate to display the three measurements, but
    with only one character on screen at once it is hard to read. And it is easy to
    miss a character as it scrolls across the screen.


    To address this weakness, and to provide us with a larger screen on which to output
    data/messages, we are going to upgrade to an OLED display. We will use the 64x128
    pixel `OD01` display from XinaBox³ and we will adapt the code so that we are showing
    all three measures on the OLED at the same time.


    > ***No-code option**: You can find a precompiled version of the code needed for
    this section on our* ***resource website*** (*[http://xib.one/XB](http://xib.one/XB)*).


    The tool we are building here was shown earlier in **Figure 3-4**. The code for
    it is very similar: we just need to adapt it to direct the output to the 64x128
    OLED screen instead of the micro:bit’s 5x5 LED matrix.


    **Figure 3-9** shows the MakeCode blocks for micro:bit weather station with the
    XinaBox `OD01` OLED display.


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig9_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig9_HTML.jpg)


    **Figure 3-9** MakeCode blocks for micro:bit weather station with OLED


    **Note**

    This code requires the XinaBox `OD01` extension. Import this by clicking **Advanced/Extensions**
    and then typing in `“xinabox/pxt-od01”`.'
