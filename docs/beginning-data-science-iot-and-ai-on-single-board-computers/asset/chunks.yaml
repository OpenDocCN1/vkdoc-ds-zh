    \ on the **designer** toolbar, click **Save**. This may take a few moments.\n\n\
    ## 11.8 Testing the Workflow\n\nNow we will start our logic app manually to test\
    \ it:\n\n- Run your logic app – on the **designer** toolbar, select **Run**. It\
