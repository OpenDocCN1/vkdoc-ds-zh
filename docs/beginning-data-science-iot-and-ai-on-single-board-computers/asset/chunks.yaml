  trans: "\n### 步骤 4：设置变量以存储来自机器学习服务的数据\n\n现在，我们需要将要从 JSON 对象中提取（解析）的降雨预测分数（“是”或“否”）分配给一个\
    \ `String` 类型的变量。为此，我们将添加名为 **初始化变量** 的操作。\n\n| **名称：** | `Score` |\n| --- | ---\
    \ |\n| **类型：** | `String` |\n| **值：** | 我们将使用一个公式来获取二维数组中的“评分标签”：`body('Parse_JSON')?['Results']?['output1']?['value']?['Values']?[0]?[2]`\
    \ |\n\n- 在设计器视图中选择 **+ 新建步骤**。\n- 在搜索框中输入 **初始化变量**。从 **操作** 列表中，选择 **初始化变量**（**图**\
    \ **11-27**）。\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig27_HTML.jpg](img/486852_1_En_11_Fig27_HTML.jpg)\n\
    \n  图 11-27  \n  搜索并选择“初始化变量”操作\n\n- 为 **初始化变量** 操作提供如下所示的信息：\n\n完成后，**初始化变量**\
    \ 模板应如下图所示（**图** **11-28**）。\n\n![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig28_HTML.jpg](img/486852_1_En_11_Fig28_HTML.jpg)\n\
    \n图 11-28  \n“初始化变量”操作详情\n\n### 步骤 5：将数据发送回气象站仪器\n\n最后，我们将变量 `score` 发送到 micro:bit，以便在\
    \ 5x5 LED 矩阵上显示。\n\n| **状态代码：** | `200` |\n| --- | --- |\n| **标头：** | 保持为空 |\n\
    | **主体：** | 从 **变量** 类别下的 **动态内容** 窗格中插入动态变量 `score`。![../images/486852_1_En_11_Chapter/486852_1_En_11_Figb_HTML.jpg](img/486852_1_En_11_Figb_HTML.jpg)\
    \ |\n\n- 在设计器视图中选择 **+ 新建步骤**。\n- 在搜索框中输入 **响应**。等待搜索结果。然后在 **操作** 列表中，选择 **响应**（**图**\
    \ **11-29**）。\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig29_HTML.jpg](img/486852_1_En_11_Fig29_HTML.jpg)\n\
    \n  图 11-29  \n  搜索并选择“响应”操作\n\n- 为 **响应** 操作提供如下所示的信息：\n\n完成后，**响应** 模板应如下图所示（**图**\
    \ **11-30**）。\n\n![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig30_HTML.jpg](img/486852_1_En_11_Fig30_HTML.jpg)\n\
    \n图 11-30  \n“响应”操作详情\n\n完成！保存你的逻辑应用：在 **设计器** 工具栏上，单击 **保存**。这可能需要一些时间。\n\n##\
    \ 11.8 测试工作流\n\n现在，我们将手动启动逻辑应用以进行测试：\n\n- 运行你的逻辑应用 – 在 **设计器** 工具栏上，选择 **运行**。检查工作流可能需要一些时间。完成后，你将在页面右上角收到一条通知，提示已成功检查逻辑应用的触发器，应如下图所示（**图**\
    \ **11-31**）。\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig31_HTML.jpg](img/486852_1_En_11_Fig31_HTML.jpg)\n\
    \n  图 11-31  \n  触发器检查成功的通知\n\n- 你的工作流将再次以 **运行模式** 显示（**图** **11-32**）。如果测试成功，标题栏右上角将添加一个勾选图标（绿色圆圈中的白色勾选）。\n\
    \n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig32_HTML.jpg](img/486852_1_En_11_Fig32_HTML.jpg)\n\
    \n  图 11-32  \n  手动触发工作流\n\n- **响应** 操作的标题栏上有一个叉号图标（灰色背景上的叉号），表示测试未成功。要查看 **响应**\
    \ 操作的输出详情，请单击 **响应** 操作标题栏内部。你应该会看到消息（**图** **11-33**）：“ActionResponseSkipped”。这是因为工作流没有从硬件接收到任何数据。目前这没关系：一旦我们连接好气象站，一切都会正常工作。\n\
    \n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig33_HTML.jpg](img/486852_1_En_11_Fig33_HTML.jpg)\n\
    \n  图 11-33  \n  响应触发器显示 `ActionResponseSkipped` 消息\n\n- 在设计器工具栏上，选择 **设计器** 以返回到设计器视图。\n\
    \n现在我们已经完成了物联网应用的设置和测试，并且支持机器学习预测功能的气象站已准备就绪。我们只需要开始向它输入数据即可。\n\n## 11.9 总结\n\n\
    从概念上讲，使用机器学习服务的过程非常简单：你传入一些数据，机器学习服务执行其黑箱操作，然后返回一个值。设置和使用它不需要几十个步骤和无数选项；但实际情况确实如此。\n\
    \n在本章中，我们已经设置并配置了构建支持机器学习的预测性气象站所需的物联网基础设施。我们构建了一个包含机器学习服务的物联网应用：来自我们数字仪器的数据将由该服务处理并生成预测数据。然后，这些数据被发送回我们的仪器，并显示在屏幕上。\n\
    \n在下一章中，我们将构建气象站数字仪器并将其连接到我们的物联网应用。\n\n脚注 1\n\n# 12. 将边缘设备连接到物联网应用\n\n在上一章中，我们开发了一个将接收温度和湿度数据的物联网应用。这些数据将由机器学习服务处理，并进行预测：是否会下雨？\n\
    \n现在剩下的工作就是构建一个能够将所需数据输入到物联网应用的设备，以及另一个（或可能是同一个）能够接收来自机器学习服务的预测数据并显示它的设备。\n"
- fmt: "# 12.1 Choosing the Hardware\n\nIn this chapter we use the same hardware that\
    \ we used in Chapter 9.\n\nThroughout the book we have seen that when it comes\
    \ to data science applications, the specific hardware instrument that we use is\
    \ just an enabler: a means to an end. The outcomes – what the hardware enables\
    \ – that is what is important, and any number of alternative hardware devices\
    \ could have delivered the same outcomes.\n\nThis point is especially relevant\
    \ here: we have just spent a long and arduous chapter building an IoT application\
    \ and we will now spend a fraction of the time building an edge device. Once you\
    \ have invested the time setting up your IoT application it is relatively trivial,\
    \ by comparison at least, to switch out different edge devices.\n\nA broad range\
    \ of different edge devices could be used, including a mobile phone. If you can\
    \ source temperature and humidity data on your phone, you could send it to the\
    \ IoT application over Wi-Fi. Perhaps more likely is wanting to use a phone to\
    \ receive the data: for example, trigger a text message whenever rain becomes\
    \ likely. Hooking up a mobile phone is outside our scope here, but with the right\
    \ tools it is similar to connecting a micro:bit.\n\nOne of the implications of\
    \ this separation of the edge device and the IoT application is that the IoT application\
    \ is effectively a stand-alone “product.” It could be used by several different\
    \ manufacturers of edge devices, competitors even. Consider a heart monitor that\
    \ records someone’s heart rate and uses AI to analyze the data. Chapter 11 showed\
    \ that building an AI-/ML-enabled IoT application that analyzes heart rate is\
    \ unlikely to be trivial. An AI service that ingests this data and produces useful\
    \ reports could be of great value to the health industry, especially to someone\
    \ interested in building an edge device that might use the service.^(18) IoT applications\
    \ like the one we built are “assets” in and of themselves.\n\nWe will use the\
    \ same hardware we have throughout: a micro:bit and weather sensor, with Wi-Fi\
    \ capabilities added to provide IoT connectivity. The same components we used\
    \ in Chapter 9.\n\n# 12.2 The Role of the Edge Device\n\nThe edge device has two\
    \ core functions:\n\n- To measure and send weather data\n- To receive and display\
    \ predictive data\n\nFigure 12-1 shows the role of the edge device (see items\
    \ 1 and 3) as well as the linear process that our data will follow (it starts\
    \ at 1, goes through 2, and then terminates at 3).\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig1_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig1_HTML.jpg)\n\
    \n*Figure 12-1* The data flow from edge device to IoT application and back\n\n\
    Referring to the numbers in Figure 12-1:\n\n1.  Data originates at our edge device:\n\
    \    - Initially we need to connect to our IoT application.\n    - We then need\
    \ to measure temperature and humidity data.\n    - This data is output to our\
    \ IoT application using Wi-Fi.\n2.  Our IoT application follows its workflow,\
    \ as per Chapter 11.\n3.  Predictive data is returned:\n    - Our edge device\
    \ is connected to our IoT application and is listening for messages from it.\n\
    \    - When a message is received it is parsed into a format we can use.\n   \
    \ - The predictive data which we extract from the message is displayed on a screen.\n\
    \n# 12.3 Building the Edge Device\n\nThe instrument that we will use is identical\
    \ to the one described in Chapter 9. Figure 12-2 shows the hardware components;\
    \ please refer to Chapter 9 for more specifics. Connect the components you have\
    \ at hand to build an instrument that approximates Figure 12-2.\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig2_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig2_HTML.jpg)\n\
    \n*Figure 12-2* Hardware components of our edge device\n\n# 12.4 Coding the Edge\
    \ Device\n\nThe hardware instrument is little more than a paperweight, until we\
    \ write the code we need to make it work the way we want it to. Before we start\
    \ coding we need to understand exactly what it is we need the code to do.\n\n\
    Figure 12-3 presents the natural language code which we will convert into MakeCode\
    \ blocks.\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig3_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig3_HTML.jpg)\n\
    \n*Figure 12-3* Natural language code for the edge device\n\n**No-code option**:\
    \ It is not possible to provide a no-code option for this tool – each program\
    \ needs to be updated to include your Wi-Fi credentials and the Azure HTTP Post\
    \ URL.\n\nSee Section 12.7, “When a HTTP request is received,” for details on\
    \ how to find the HTTP Post URL.\n\nA full version of the code is available on\
    \ the supporting website for you to edit.\n\nTable 12-1 shows how each step of\
    \ the natural language code translates into MakeCode actions or blocks.\n\n*Table\
    \ 12-1* Developing code with MakeCode blocks\n\n| Step | MakeCode |\n| --- | ---\
    \ |\n| 1 | Start a new project. Add the `XinaBox CW01` and `SW01` extensions.\
    \ |\n| 2 | Add `CW01 connect to WiFi` block inside the `on start` block. Type\
    \ in the SSID and password of your Wi-Fi network. ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figa_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Figa_HTML.jpg)\
    \ |\n| 3 | Add the `CW01 connect to Azure with access endpoint` block. Then copy\
    \ and paste the HTTP POST URL. ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figb_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Figb_HTML.jpg)\
    \ See Section 12.7 for help in finding the HTTP POST URL. Make sure to delete\
    \ the `\"https://\"` part from the HTTP POST URL when adding it to the block.\
    \ |\n| 4 | Add a `forever` block. |\n| 5, 6, and 7 | Steps 5, 6, and 7 are all\
    \ taken care of by a single block of code: Add the `CW01 update two variables`\
    \ block to the `forever` block. Add the following in the four available spaces:\
    \ - **First variable**: Type in `\"temperature\"`. - **Second variable**: Type\
    \ in `\"humidity\"`.^(19) - **First value**: Add the `SW01 temperature (C)` block.\
    \ - **Second value**: Add the `SW01 humidity (%RH)` block. ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figc_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Figc_HTML.jpg)\
    \ |\n| Finally, add a `pause` block. The delay should be at least long enough\
    \ for the response to scroll on the screen. | ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figd_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Figd_HTML.jpg)\
    \ |\n\nFigure 12-4 shows the full code listing.\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig4_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig4_HTML.jpg)\n\
    \n*Figure 12-4* MakeCode blocks for a micro:bit weather station\n\nWhen the code\
    \ is complete, flash it onto your micro:bit and then remove the USB cable.\n\n\
    The function used earlier (`CW01 update two variables`…) is highly specialized:\
    \ it was built specifically to integrate the BBC micro:bit with Azure ML services\
    \ that take two variables as input and simultaneously return one variable as output.\n\
    \nThe CW01 MakeCode extension also includes generic MQTT blocks (we used them\
    \ in Chapter 9) that can be used to connect to any MQTT based IoT platform. We\
    \ could not have used those blocks in this context: Azure is not easy to connect\
    \ to from a micro:bit."
  raw: "## 12.1 Choosing the Hardware\n\nIn this chapter we use the same hardware\
    \ that we used in **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml).\n\nThroughout\
    \ the book we have seen that when it comes to data science applications, the specific\
    \ hardware instrument that we use is just an enabler: a means to an end. The outcomes –\
    \ what the hardware enables – that is what is important, and any number of alternative\
    \ hardware devices could have delivered the same outcomes.\n\nThis point is especially\
    \ relevant here: we have just spent a long and arduous chapter building an IoT\
    \ application and we will now spend a fraction of the time building an edge device.\
    \ Once you have invested the time setting up your IoT application it is relatively\
    \ trivial, by comparison at least. To switch out different edge devices.\n\nA\
    \ broad range of different edge devices could be used, including a mobile phone.\
    \ If you can source temperature and humidity data on your phone, you could send\
    \ it to the IoT application over Wi-Fi. Perhaps more likely is wanting to use\
    \ a phone to receive the data: for example, trigger a text message whenever rain\
    \ becomes likely. Hooking up a mobile phone is outside our scope here, but with\
    \ the right tools it is similar to connecting a micro:bit.\n\nOne of the implications\
    \ of this separation of the edge device and the IoT application is that the IoT\
    \ application is effectively a stand-alone “product.” It could be used by several\
    \ different manufacturers of edge devices, competitors even. Consider a heart\
    \ monitor that records someone’s heart rate and uses AI to analyze the data. **Chapter**\
    \ [**11**](#486852_1_En_11_Chapter.xhtml) showed that building an AI-/ML-enabled\
    \ IoT application that analyzes heart rate is unlikely to be trivial. An AI service\
    \ that ingests this data and produces useful reports could be of great value to\
    \ the health industry, especially to someone interested in building an edge device\
    \ that might use the service.^([^(18)](#fn18)) IoT applications like the one we\
    \ built are “assets” in and of themselves.\n\nWe will use the same hardware we\
    \ have throughout: a micro:bit and weather sensor, with Wi-Fi capabilities added\
    \ to provide IoT connectivity. The same components we used in **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml).\n\
    \n## 12.2 The Role of the Edge Device\n\nThe edge device has two core functions:\n\
    \n*   To measure and send weather data\n\n*   To receive and display predictive\
    \ data\n\n**Figure** [**12-1**](#486852_1_En_12_Chapter.xhtml#Fig1) shows the\
    \ role of the edge device (see **items 1** and **3**) as well as the linear process\
    \ that our data will follow (it starts at 1, goes through 2, and then terminates\
    \ at 3).\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig1_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig1_HTML.jpg)\n\
    \nFigure 12-1\n\nThe data flow from edge device to IoT application and back\n\n\
    Referring to the numbers in **Figure** [**12-1**](#486852_1_En_12_Chapter.xhtml#Fig1):\n\
    \n1.  Data originates at our edge device:\n    *   Initially we need to connect\
    \ to our IoT application.\n\n    *   We then need to measure temperature and humidity\
    \ data.\n\n    *   This data is output to our IoT application using Wi-Fi.\n\n\
    2.  Our IoT application follows its workflow, as per **Chapter** [**11**](#486852_1_En_11_Chapter.xhtml).\n\
    \n3.  Predictive data is returned:\n    *   Our edge device is connected to our\
    \ IoT application and is listening for messages from it.\n\n    *   When a message\
    \ is received it is parsed into a format we can use.\n\n    *   The predictive\
    \ data which we extract from the message is displayed on a screen.\n\n## 12.3\
    \ Building the Edge Device\n\nThe instrument that we will use is identical to\
    \ the one described in **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml). **Figure**\
    \ [**12-2**](#486852_1_En_12_Chapter.xhtml#Fig2) shows the hardware components;\
    \ please refer to **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml) for more specifics.\
    \ Connect the components you have at hand to build an instrument that approximates\
    \ **Figure** [**12-2**](#486852_1_En_12_Chapter.xhtml#Fig2).\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig2_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig2_HTML.jpg)\n\
    \nFigure 12-2\n\nHardware components of our edge device\n\n## 12.4 Coding the\
    \ Edge Device\n\nThe hardware instrument is little more than a paperweight, until\
    \ we write the code we need to make it work the way we want it to. Before we start\
    \ coding we need to understand exactly what it is we need the code to do.\n\n\
    **Figure** [**12-3**](#486852_1_En_12_Chapter.xhtml#Fig3) presents the natural\
    \ language code which we will convert into MakeCode blocks.\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig3_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig3_HTML.jpg)\n\
    \nFigure 12-3\n\nNatural language code for the edge device\n\n**No-code option**:\
    \ It is not possible to provide a no-code option for this tool – each program\
    \ needs to be updated to include your Wi-Fi credentials and the Azure **HTTP Post\
    \ URL**.\n\nSee **Section 12.7, “When a HTTP request is received**,” for details\
    \ on how to find the **HTTP Post URL**.\n\nA full version of the code is available\
    \ on the supporting website for you to edit.\n\n**Table** [**12-1**](#486852_1_En_12_Chapter.xhtml#Tab1)\
    \ shows how each step of the natural language code translates into MakeCode actions\
    \ or blocks.\n\nTable 12-1\n\nDeveloping code with MakeCode blocks\n\n| Step |\
    \ MakeCode |\n| --- | --- |\n| 1 | Start a new project.Add the XinaBox CW01 and\
    \ SW01 extensions. |\n| 2 | Add **CW01 connect to WiFi** block inside the **on\
    \ start** block.Type in the SSID and password of your Wi-Fi network.![../images/486852_1_En_12_Chapter/486852_1_En_12_Figa_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Figa_HTML.jpg)\
    \ |\n| 3 | Add the **CW01 connect to Azure with access endpoint** block. Then\
    \ copy and paste the **HTTP POST URL**.![../images/486852_1_En_12_Chapter/486852_1_En_12_Figb_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Figb_HTML.jpg)See\
    \ **Section 12.7** for help in finding the **HTTP POST URL**.Make sure to delete\
    \ the “https://” part from the **HTTP POST URL** when adding it to the block.\
    \ |\n| 4 | Add a **forever** block. |\n| 5, 6, and 7 | Steps 5, 6, and 7 are all\
    \ taken care of by a single block of code:Add the **CW01 update two variables**\
    \ block to the **forever** block.Add the following in the four available spaces:•    **First\
    \ variable**: Type in **“temperature”**.•    **Second variable**: Type in **“humidity”**.^([^(19)](#fn19))•    **First\
    \ value**: Add the **SW01 temperature (C)** block.•    **Second value**: Add the\
    \ **SW01 humidity (%RH)** block.![../images/486852_1_En_12_Chapter/486852_1_En_12_Figc_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Figc_HTML.jpg)\
    \ |\n| Finally, add a **pause** block. The delay should be at least long enough\
    \ for the response to scroll on the screen. | ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figd_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Figd_HTML.jpg)\
    \ |\n\n**Figure** [**12-4**](#486852_1_En_12_Chapter.xhtml#Fig4) shows the full\
    \ code listing.\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig4_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig4_HTML.jpg)\n\
    \nFigure 12-4\n\nMakeCode blocks for a micro:bit weather station\n\nWhen the code\
    \ is complete, flash it onto your micro:bit and then remove the USB cable.\n\n\
    The function used earlier (**CW01 update two variables**…) is highly specialized:\
    \ it was built specifically to integrate the BBC micro:bit with Azure ML services\
    \ that take two variables as input and simultaneously return one variable as output.\n\
    \nThe CW01 MakeCode extension also includes generic MQTT blocks (we used them\
    \ in **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml)) that can be used to connect\
    \ to any MQTT based IoT platform. We could not have used those blocks in this\
    \ context: Azure is not easy to connect to from a micro:bit."
  trans: "\n# 12.1 选择硬件\n\n本章我们将沿用第 9 章所使用的硬件。\n\n在本书中，我们已多次看到，对于数据科学应用而言，所使用的具体硬件设备仅仅是一个工具：达成目的的手段。真正重要的是成果——即硬件所实现的功能——而任何其他硬件设备都可能带来相同的成果。\n\
    \n这一点在此处尤其相关：我们刚刚花费了大量精力构建了一个物联网应用，而现在将用少得多的时间来构建一个边缘设备。一旦你投入时间搭建好物联网应用，相比之下，更换不同的边缘设备就相对简单了。\n\
    \n可以使用多种不同的边缘设备，包括手机。如果你能在手机上获取温度和湿度数据，就可以通过 Wi-Fi 将其发送到物联网应用。更可能的情况是，你想用手机接收数据：例如，当可能下雨时触发一条短信。连接手机超出了本书的范围，但有了合适的工具，它与连接\
    \ micro:bit 类似。\n\n将边缘设备与物联网应用分离的意义之一在于，物联网应用实际上是一个独立的“产品”。它可能被多家不同的边缘设备制造商使用，甚至是竞争对手。考虑一个记录心率并使用\
    \ AI 分析数据的心率监测器。第 11 章表明，构建一个支持 AI/机器学习、能分析心率数据的物联网应用并非易事。一个能够接收这些数据并生成有用报告的 AI\
    \ 服务，对医疗行业来说可能极具价值，尤其是对那些有兴趣构建使用该服务的边缘设备的人来说。¹⁸ 像我们构建的这种物联网应用本身就是“资产”。\n\n我们将沿用本书始终使用的硬件：一个\
    \ micro:bit 和天气传感器，并增加 Wi-Fi 功能以提供物联网连接。这与我们在第 9 章中使用的组件相同。\n\n# 12.2 边缘设备的作用\n\
    \n边缘设备有两个核心功能：\n\n- 测量并发送天气数据\n- 接收并显示预测数据\n\n图 12-1 展示了边缘设备的作用（见项目 1 和 3），以及我们的数据将遵循的线性流程（始于\
    \ 1，经过 2，终止于 3）。\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig1_HTML.jpg](img/486852_1_En_12_Fig1_HTML.jpg)\n\
    \n*图 12-1* 数据从边缘设备到物联网应用再返回的流程\n\n参照图 12-1 中的编号：\n\n1.  数据源自我们的边缘设备：\n    - 首先我们需要连接到物联网应用。\n\
    \    - 然后需要测量温度和湿度数据。\n    - 这些数据通过 Wi-Fi 输出到我们的物联网应用。\n2.  物联网应用按照第 11 章所述的工作流程运行。\n\
    3.  返回预测数据：\n    - 我们的边缘设备连接到物联网应用，并监听来自它的消息。\n    - 收到消息后，将其解析成可用的格式。\n    -\
    \ 从消息中提取的预测数据显示在屏幕上。\n\n# 12.3 构建边缘设备\n\n我们将使用的设备与第 9 章描述的完全相同。图 12-2 展示了硬件组件；更多细节请参考第\
    \ 9 章。请连接手头已有的组件，构建一个近似图 12-2 的设备。\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig2_HTML.jpg](img/486852_1_En_12_Fig2_HTML.jpg)\n\
    \n*图 12-2* 边缘设备的硬件组件\n\n# 12.4 边缘设备编程\n\n在我们编写所需的代码使其按期望方式工作之前，硬件设备仅仅是个镇纸。开始编码之前，我们需要确切理解代码需要做什么。\n\
    \n图 12-3 展示了我们将转换为 MakeCode 块的自然语言代码。\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig3_HTML.jpg](img/486852_1_En_12_Fig3_HTML.jpg)\n\
    \n*图 12-3* 边缘设备的自然语言代码\n\n**无代码选项**：无法为此工具提供无代码选项——每个程序都需要更新以包含你的 Wi-Fi 凭据和 Azure\
    \ HTTP Post URL。\n\n关于如何找到 HTTP Post URL 的详细信息，请参见 12.7 节“当收到 HTTP 请求时”。\n\n代码完整版可在配套网站上获取，供你编辑。\n\
    \n表 12-1 展示了自然语言代码的每一步如何转换为 MakeCode 操作或块。\n\n*表 12-1* 使用 MakeCode 块开发代码\n\n|\
    \ 步骤 | MakeCode |\n| --- | --- |\n| 1 | 开始一个新项目。添加`XinaBox CW01`和`SW01`扩展。 |\n\
    | 2 | 在`on start`块内添加`CW01 connect to WiFi`块。输入你的 Wi-Fi 网络的 SSID 和密码。 ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figa_HTML.jpg](img/486852_1_En_12_Figa_HTML.jpg)\
    \ |\n| 3 | 添加`CW01 connect to Azure with access endpoint`块。然后复制并粘贴 HTTP POST URL。\
    \ ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figb_HTML.jpg](img/486852_1_En_12_Figb_HTML.jpg)\
    \ 关于找到 HTTP POST URL 的帮助，请参见 12.7 节。在将 URL 添加到块时，请确保删除`\"https://\"`部分。 |\n| 4\
    \ | 添加一个`forever`块。 |\n| 5、6 和 7 | 步骤 5、6 和 7 都由一个单独的代码块处理：将`CW01 update two variables`块添加到`forever`块中。在四个可用输入框中添加以下内容：\
    \ - **第一个变量**：输入`\"temperature\"`。 - **第二个变量**：输入`\"humidity\"`。¹⁹ - **第一个值**：添加`SW01\
    \ temperature (C)`块。 - **第二个值**：添加`SW01 humidity (%RH)`块。 ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figc_HTML.jpg](img/486852_1_En_12_Figc_HTML.jpg)\
    \ |\n| 最后，添加一个`pause`块。延迟时间应至少足够让响应在屏幕上滚动显示。 | ![../images/486852_1_En_12_Chapter/486852_1_En_12_Figd_HTML.jpg](img/486852_1_En_12_Figd_HTML.jpg)\
    \ |\n\n图 12-4 展示了完整的代码清单。\n\n![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig4_HTML.jpg](img/486852_1_En_12_Fig4_HTML.jpg)\n\
    \n*图 12-4* micro:bit 气象站的 MakeCode 块\n\n代码完成后，将其烧录到你的 micro:bit 上，然后拔掉 USB 线。\n\
    \n前面用到的函数（`CW01 update two variables`…）非常专业化：它是专门为将 BBC micro:bit 与接受两个变量作为输入并同时返回一个变量作为输出的\
    \ Azure 机器学习服务集成而构建的。\n\nCW01 MakeCode 扩展还包括通用的 MQTT 块（我们在第 9 章中使用过它们），可用于连接任何基于\
    \ MQTT 的物联网平台。在这种场景下我们无法使用这些块：从 micro:bit 连接到 Azure 并不容易。\n"
- fmt: '# 12.5 Using the Edge Device


    With the edge device built and programmed, all we need to do now is power it up
    and use it.


    > *It is necessary to power up the weather station in a specific way, so please
    follow the steps described in* **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml)**,
    Section 9.9*.


    **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml) also lists the stages that the
    instrument will go through as it connects first to a Wi-Fi router and then to
    the targeted IoT platform. It is slightly different in this case because we are
    receiving and displaying data from the IoT platform too. If the process is working
    correctly you should see the following:


    1.  If the instrument has connected to the Wi-Fi network the letter `C` will display
    on the `micro:bit` LED screen.


    2.  The `micro:bit` will then try to connect to Azure and start to send data to
    our IoT application.


    3.  When data is successfully transmitted a tick is displayed on the screen followed
    by the rain prediction result (`"Yes"` or `"No"`).


    The weather station will continue to share and display this data until you turn
    it off.


    When you first see the `"Yes"` or `"No"` scrolling on the `micro:bit` LEDs, you
    are entitled to feel a great deal of satisfaction: you have achieved something
    that even a few years ago would not have been possible. The weather prediction
    application is the (unofficial) `Hello World!` of ML, and **Chapter** [**13**](#486852_1_En_13_Chapter.xhtml)
    will elaborate on what other, more complex, applications this simple ML experiment
    unlocks for us.


    ## 12.6 Improving the Edge Device


    The edge device is as simple as can be: the barest minimum of code and hardware
    was used – just five hardware modules and six blocks of code.


    We could enhance the instrument either by adding more components or by making
    the code more sophisticated. Using techniques we''ve covered in this book you
    should be able to implement some of the following enhancements:


    *   Add a decent display and print data to it.


    *   When the `A` button is clicked, show the status of the connection.


    *   Process the prediction data – do something when the prediction is `"Yes"`
    and something else when it is `"No"` – why not show a graphic to indicate rain?


    *   Control the frequency with which data is sent and received or only send when
    the `B` button is clicked.


    *   Do you have credentials for more than one Wi-Fi network? Use constant variables
    and try to auto-connect to whichever is in range.


    ## 12.7 Peering Under the Hood of the IoT Application


    Looking at our `micro:bit` screen scrolling the word `"Yes"` or `"No"` and then
    looking out the window to check if it''s raining… that is only fun for so long.
    When you get bored of it, pop back to the IoT application, while the edge device
    is still active, and take a look at what is going on in there.


    Open the **Azure logic app designer** and click **Run** on the designer toolbar
    to run data through your workflow. It may take a few moments for things to load
    up, after which the workflow will be displayed. You should recognize the five
    steps listed in **Figure** [**12-5**](#486852_1_En_12_Chapter.xhtml#Fig5) from
    **Chapter** [**11**](#486852_1_En_11_Chapter.xhtml).


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig5_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig5_HTML.jpg)


    **Figure 12-5** Manually triggered workflow: the green tick on the `Response`
    tab shows it is in `RUN` mode


    If the edge device is still working you should have opened the workflow in `RUN`
    mode: if it has loaded properly you will see a tick icon (white tick on a green
    circle) added to the title bar of the `Response` action. This indicates that your
    logic app has received confirmation that the data transaction between Azure and
    the `micro:bit` has been successfully completed. From here we can look into each
    stage of the workflow to see what is going on and check the live data that it
    is being handled.


    > **Tip:** If you still get a "**cross**" icon on the `Response` action''s title
    bar, make sure the edge device is functioning properly and then run the logic
    app again, and again, until you get the "**tick**".


    We will look at a few elements of the workflow.


    ### Parse JSON


    When we created the workflow, our `Parse JSON` file was set up for us and contained
    variable names, not values. Now that data is being passed through the workflow,
    we can see what the JSON file looks like with live content:


    *   Click the `Parse JSON` action.


    *   Scroll down and find the section `OUTPUTS`.


    *   Click the body and scroll down the text box.


    **Figure** [**12-6**](#486852_1_En_12_Chapter.xhtml#Fig6) shows the parsed array
    containing the temperature and humidity values from the `micro:bit`, as well as
    the rain prediction results from the ML service.


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig6_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig6_HTML.jpg)


    **Figure 12-6** The output of the `Parse JSON` action


    ### Initialize Variable


    *   Click the `Initialize variable` action.


    When the workflow was originally set up, a variable called `score` was created.
    This is the variable that stores our prediction: it is a String that contains
    either `"Yes"` or `"No"`.


    **Figure** [**12-7**](#486852_1_En_12_Chapter.xhtml#Fig7) shows that the result
    in `score` is currently `Yes`.


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig7_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig7_HTML.jpg)


    **Figure 12-7** The output of the `Initialize variable` action


    ### Response


    *   Click the `Response` action.


    The `score` variable (discussed earlier) has been assigned to the `Body` of the
    response message (**Figure** [**12-8**](#486852_1_En_12_Chapter.xhtml#Fig8)).
    This is the content we pass back to the `micro:bit` as the result.


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig8_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig8_HTML.jpg)


    **Figure 12-8** The output of the `Response` action


    ### When a HTTP Request Is Received


    *   Click the `When a HTTP request is received` action.


    This information does not change during running of the workflow; the `HTTP POST
    URL` can be found here (**Figure** [**12-9**](#486852_1_En_12_Chapter.xhtml#Fig9)).
    This parameter is crucial as it is used in the MakeCode block `CW01 connect to
    Azure with access endpoint` to connect to the Azure-based IoT application.


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig9_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig9_HTML.jpg)


    **Figure 12-9** The `When a HTTP request is received` action showing the `HTTP
    POST URL`'
  raw: '## 12.5 Using the Edge Device


    With the edge device built and programmed, all we need to do now is power it up
    and use it.


    > *It is necessary to power up the weather station in a specific way, so please
    follow the steps described in* ***Chapter*** [***9***](#486852_1_En_9_Chapter.xhtml)***,
    Section 9.9**.*


    **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml) also lists the stages that the
    instrument will go through as it connects first to a Wi-Fi router and then to
    the targeted IoT platform. It is slightly different in this case because we are
    receiving and displaying data from the IoT platform too. If the process is working
    correctly you should see the following:


    1.  If the instrument has connected to the Wi-Fi network the letter C will display
    on the micro:bit LED screen.


    2.  The micro:bit will then try to connect to Azure and start to send data to
    our IoT application.


    3.  When data is successfully transmitted a tick is displayed on the screen followed
    by the rain prediction result (“Yes” or “No”).


    The weather station will continue to share and display this data until you turn
    it off.


    When you first see the “Yes” or “No” scrolling on the micro:bit LEDs, you are
    entitled to feel a great deal of satisfaction: you have achieved something that
    even a few years ago would not have been possible. The weather prediction application
    is the (unofficial) Hello World! of ML, and **Chapter** [**13**](#486852_1_En_13_Chapter.xhtml)
    will elaborate on what other, more complex, applications this simple ML experiment
    unlocks for us.


    ## 12.6 Improving the Edge Device


    The edge device is as simple as can be: the barest minimum of code and hardware
    was used – just five hardware modules and six blocks of code.


    We could enhance the instrument either by adding more components or by making
    the code more sophisticated. Using techniques we’ve covered in this book you should
    be able to implement some of the following enhancements:


    *   Add a decent display and print data to it.


    *   When the A button is clicked, show the status of the connection.


    *   Process the prediction data – do something when the prediction is “Yes” and
    something else when it is “No” – why not show a graphic to indicate rain?


    *   Control the frequency with which data is sent and received or only send when
    the B button is clicked.


    *   Do you have credentials for more than one Wi-Fi network? Use constant variables
    and try to auto-connect to whichever is in range.


    ## 12.7 Peering Under the Hood of the IoT Application


    Looking at our micro:bit screen scrolling the word “Yes” or “No” and then looking
    out the window to check if it’s raining… that is only fun for so long. When you
    get bored of it, pop back to the IoT application, while the edge device is still
    active, and take a look at what is going on in there.


    Open the **Azure logic app designer** and click **Run** on the designer toolbar
    to run data through your workflow. It may take a few moments for things to load
    up, after which the workflow will be displayed. You should recognize the five
    steps listed in **Figure** [**12-5**](#486852_1_En_12_Chapter.xhtml#Fig5) from
    **Chapter** [**11**](#486852_1_En_11_Chapter.xhtml).


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig5_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig5_HTML.jpg)


    Figure 12-5


    Manually triggered workflow: the green tick on the Response tab shows it is in
    RUN mode


    If the edge device is still working you should have opened the workflow in **RUN**
    mode: if it has loaded properly you will see a tick icon (white tick on a green
    circle) added to the title bar of the **Response** action. This indicates that
    your logic app has received confirmation that the data transaction between Azure
    and the micro:bit has been successfully completed. From here we can look into
    each stage of the workflow to see what is going on and check the live data that
    it is being handled.


    Tip


    If you still get a “**cross**” icon on the **Response** action’s title bar, make
    sure the edge device is functioning properly and then run the logic app again,
    and again, until you get the “**tick**”.


    We will look at a few elements of the workflow.


    ### Parse JSON


    When we created the workflow, our Parse JSON file was set up for us and contained
    variable names, not values. Now that data is being passed through the workflow,
    we can see what the JSON file looks like with live content:


    *   Click the **Parse JSON** action.


    *   Scroll down and find the section **OUTPUTS**.


    *   Click the body and scroll down the text box.


    **Figure** [**12-6**](#486852_1_En_12_Chapter.xhtml#Fig6) shows the parsed array
    containing the temperature and humidity values from the micro:bit, as well as
    the rain prediction results from the ML service.


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig6_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig6_HTML.jpg)


    Figure 12-6


    The output of the Parse JSON action


    ### Initialize Variable


    *   Click the **Initialize variable** action.


    When the workflow was originally set up, a variable called **score** was created.
    This is the variable that stores our prediction: it is a String that contains
    either “Yes” or “No” .


    **Figure** [**12-7**](#486852_1_En_12_Chapter.xhtml#Fig7) shows that the result
    in score is currently **Yes**.


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig7_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig7_HTML.jpg)


    Figure 12-7


    The output of the Initialize variable action


    ### Response


    *   Click the **Response** action.


    The **score** variable (discussed earlier) has been assigned to the **Body** of
    the response message (**Figure** [**12-8**](#486852_1_En_12_Chapter.xhtml#Fig8)).
    This is the content we pass back to the micro:bit as the result.


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig8_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig8_HTML.jpg)


    Figure 12-8


    The output of the Response action


    ### When a HTTP Request Is Received


    *   Click the **When a** **HTTP request** **is received** action.


    This information does not change during running of the workflow; the **HTTP POST
    URL** can be found here (Figure [12-9](#486852_1_En_12_Chapter.xhtml#Fig9)). This
    parameter is crucial as it is used in the MakeCode block **CW01 connect to Azure
    with access endpoint** to connect to the Azure-based IoT application.


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig9_HTML.jpg](images/486852_1_En_12_Chapter/486852_1_En_12_Fig9_HTML.jpg)


    Figure 12-9


    The When a HTTP request is received action showing the HTTP POST URL'
