- fmt: "# 9.9 Powering and Running the Weather Station\n\nCompile the code and flash\
    \ it onto your `micro:bit`. When it has completed flashing remove the USB cable\
    \ from the `micro:bit`. We need to power up the weather station in a particular\
    \ way, as described here:\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig24_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig24_HTML.jpg)\n\
    \n**Figure 9-24** The weather station is sending data to the IBM Watson IoT platform\n\
    \n* Connect the `IM01`, `SW01`, and `CW01` together. Do NOT connect the `micro:bit`\
    \ yet.\n* Connect a USB power cable to the `IM01` (Figure [9-22](#486852_1_En_9_Chapter.xhtml#Fig22)).\
    \ Wait until there is a strong blue light showing on the `CW01`. It should take\
    \ a few seconds at most.\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig22_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig22_HTML.jpg)\n\
    \n**Figure 9-22** Step 2 of the powering process\n\n* Now you can connect your\
    \ `micro:bit` to the `IM01` (Figure [9-23](#486852_1_En_9_Chapter.xhtml#Fig23)).\
    \ On start the `micro:bit` should display the pattern shown. This indicates that\
    \ the `CW01` is trying to connect to the Wi-Fi network.\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig23_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig23_HTML.jpg)\n\
    \n**Figure 9-23** Step 3 of the powering process\n\n* Once connected to the Wi-Fi\
    \ network, the letter C is shown on the 5X5 LED matrix.\n* Next the weather station\
    \ will try to connect to the IBM Watson IoT platform. The diamond pattern on the\
    \ LED matrix indicates an active connection between the weather station and the\
    \ IBM Watson IoT cloud.\n\nFor as long as the `micro:bit` is powered and the diamond\
    \ pattern is showing, data will be sent to the IoT Weather Service. The next section\
    \ explains how to view the data.\n\n## 9.10 Viewing the Data Visualizations\n\n\
    With everything running smoothly the `micro:bit` weather station should be transferring\
    \ data to the IoT platform. Confirm this by viewing the visualization(s) that\
    \ you have set up from the pin-board:\n\n* Click **Boards** in the left navigation\
    \ and then click the **Weather** board created in Section 9.7 (Figure [9-25](#486852_1_En_9_Chapter.xhtml#Fig25)).\n\
    \n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig25_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig25_HTML.jpg)\n\
    \n**Figure 9-25** Accessing the line chart to view the data coming from the weather\
    \ station\n\n* The line chart will show temperature and humidity data over a time\
    \ period that you specify (Figure [9-26](#486852_1_En_9_Chapter.xhtml#Fig26)).\n\
    \n> **Note**  \n> The option to publish the board and make it publicly accessible\
    \ is also available. Under the **Members** tab of **Board settings**, there is\
    \ an option to **share as read only with everyone**. Checking this box will provide\
    \ public access to the board via a URL you can share.\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig26_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig26_HTML.jpg)\n\
    \n**Figure 9-26** A line chart card on our board showing live and historical weather\
    \ data\n\n## 9.11 Summary\n\nIf all has gone to plan, your weather station is\
    \ hooked up to the IoT platform and you are able to view real-time data on the\
    \ board using a web browser. At the risk of stating the obvious, you will be able\
    \ to view the board from anywhere in the world (where you can get an Internet\
    \ connection). If this seems mundane, bear in mind that 20 years ago this was\
    \ extremely difficult and even 10, maybe 5, years ago you needed a broad and niche\
    \ skill set to build something like this.\n\nSo take a moment to feel a sense\
    \ of achievement: what you have done this chapter is not trivial, and only a tiny\
    \ fraction of the human beings who have ever lived have managed to do this. More\
    \ importantly, the model we have built is one where we send any sensor data to\
    \ a cloud service. Switching out different sensors is relatively trivial, which\
    \ greatly expands the potential of this system. In addition, we used a service\
    \ that provided a rich set of visualization tools, but what about connecting to\
    \ other types of service, perhaps even an artificial intelligence service? That\
    \ is exactly what we will do in Chapter [11](#486852_1_En_11_Chapter.xhtml) and\
    \ Chapter [12](#486852_1_En_12_Chapter.xhtml).\n\nBut before we can aspire to\
    \ use artificial intelligence we need to know a little bit about it, which we\
    \ will look at in Chapter [10](#486852_1_En_10_Chapter.xhtml).\n\nFootnotes [1](#486852_1_En_9_Chapter.xhtml#Fn1_source)\
    \ [2](#486852_1_En_9_Chapter.xhtml#Fn2_source)\n\n# 10. Introduction to Machine\
    \ Learning and Artificial Intelligence\n\n> *HAL 9000*^([(14)](#fn14)): “I’m sorry\
    \ Dave, I’m afraid I can’t do that”\n>\n> —2001: A Space Odyssey^([(15)](#fn15))\n\
    \nIn this chapter we will look at artificial intelligence (AI) and machine learning\
    \ (ML) through our data science lens: what are they, how do they differ, and what\
    \ do they have to offer?"
