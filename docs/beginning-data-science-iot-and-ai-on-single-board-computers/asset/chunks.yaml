  trans: '

    ## 13.2 成为数据科学家


    虽然关于何谓数据科学家的松散/非正式定义很有趣，但当公司招聘数据科学家时，他们通常对自己寻找的目标有清晰的认识。这往往是一套与公司现有数据科学实践相关的技能/经验，且常见的招聘广告会要求具备特定技能，例如编码（如`Python`）、`SQL`、统计学和机器学习。


    如果你有兴趣进一步探索数据科学，并可能以此谋生，那么有许多学科需要学习，也有众多方向可以探索。了解数据科学领域哪些技能重要的最佳方法之一，就是查看招聘网站。


    所需的大部分技能都是可以学习的，如果你发现自己能轻松理解本书中的内容，那么你很可能具备所需的才能。在整个探索过程中有一个主题始终贯穿其中，那就是好奇心所扮演的角色。上文提到的技能固然宝贵，但成就伟大数据科学家的，是其好奇心以及不断提问的动力。直觉也同样备受重视：对正确的事物保持好奇，并能提出正确的问题，这些特质是计算机远无法企及的。请记住，你不需要像计算机一样思考：我们有计算机来替我们做这件事。


    ## 13.3 破除一些迷思


    从数据科学的角度来看，迷思是指那些被人们接受为真实/已被证明的假设/事实，但它们并非基于任何可靠或可验证的数据。^(²¹) 具有讽刺意味的是，像数据科学这样的领域竟然也有自己的一套迷思。迷思的问题在于，它们常常像障碍一样竖立在观望者面前，所以我们来看看几个常见的迷思并尝试打破它们：


    **只有数据科学家才做真正的数据科学。**


    -   数据科学正是我们在本书中一直在做的事情——运用科学方法来收集、处理数据，并对数据执行各种操作。

    -   在专业标准建立之前，数据科学家就是指那些职务头衔中包含“数据科学家”的人。该术语在专业上用于指代流程中的分析环节。负责构建传感器阵列并编写代码的团队成员不会被称作数据科学家。但他们也参与了数据科学：这是一项团队运作，而数据科学家是团队中的一员。


    **真正的数据科学家不使用 Excel/电子表格。**


    -   新手会过度使用 Excel。

    -   专家从不使用 Excel。

    -   大师则在适当的时候使用 Excel。


    **要成为数据科学家，你必须是一名强大的程序员。**


    -   数据科学家会发现自己处于需要编码的情境中。这确实是一项很好的技能。

    -   但是当需要编写某些代码时，数据科学家可以利用开发者来替他们编写。

    -   关键在于知道要向开发者提出什么需求：代码需要实现哪些结果？任何优秀的开发者都应该能够毫无问题地将构思周密的自然语言代码转换为真正的代码。


    **只有大公司和大学才能负担得起数据科学。**


    -   即使是预算有限的个人，也有可能进行真正、负担得起且新颖的数据科学实验。

    -   鉴于每天产生海量的数据，而且其中大部分都可以免费且轻松地在线获取，有多少引人入胜、开创性且实用的关联性正等待着被发现，或许只需点击几下鼠标就能找到？


    **你必须异常聪明才能成为数据科学家。**


    -   数据科学是一个智力领域，但任何拥有适当好奇心和动力的人都可以学习所需的技术。

    -   当然，非常聪明的人往往在包括数据科学在内的一系列智力领域表现良好。


    **市场研究不是真正的数据科学。**


    -   特别是在学术界，市场研究常被认为档次较低；有些人可能会说它犯了“堕落”之罪——将利润置于质量之上。

    -   市场研究有好有坏，正如学术研究也有好有坏一样。

    -   真正的区别在于，我们经常在广告牌上看到糟糕的市场研究，或是在广告中被强行推销。这并不能代表市场研究行业的全貌和潜力。

    -   后种族隔离时代南非一项重要的市场研究案例，将有助于说明其更积极的应用。


    早在 20 世纪 90 年代，非国大（ANC）的顾问们就曾委托一家位于德班的小型市场研究公司（现已倒闭的 Research Surveys），该公司拥有一项名为“转换模型”的创新产品。这是一种调查技术，在衡量不同人群对特定信息的预测行为反应方面出奇地有效。简而言之，这条信息是会煽动对立还是促成团结？


    曼德拉先生无疑是他那个时代乃至任何时代最伟大的政治家之一。尽管非国大在全国大选中胜券在握，但他的首要任务之一是确保国内所有不同种族群体都能参与进来，并对将南非转变为“彩虹之国”的进程感到兴奋。


    他们委托进行了多次转换模型调查，以评估非国大信息的哪些部分最能引起不同种族群体的共鸣，哪些部分最易引发两极分化。曼德拉先生的民族团结政府在优先处理那些有助于让广大民众保持热情和乐观的事项方面做得非常出色。

    '
- fmt: '# 13.4 Extrapolating Learnings


    With access to the right hardware there is no limit to the range and sophistication
    of digital instruments that you can build using the techniques outlined in this
    book. Most of the skills we have covered are transferrable:


    **If you can connect one sensor to a microprocessor:**


    ![../images/486852_1_En_13_Chapter/486852_1_En_13_Fig1_HTML.jpg](images/486852_1_En_13_Chapter/486852_1_En_13_Fig1_HTML.jpg)


    Figure 13-1


    Two digital instruments of differently complexity built using the same principles


    *   Whatever peripheral system you are using (`XinaBox`, breadboards, `SparkFun`,
    etc.), if you have successfully connected one sensor to a microprocessor, then
    you can usually apply the same method to attach other sensors too. If you choose
    a peripheral system with a broad range of sensors, you should be able to attach
    any of these.


    *   As long as the microprocessor supports it (and most do), you can connect several
    sensors at the same time and build instruments capable of measuring a broad range
    of sensor readings.


    *   And remember, in 2020+ you do not need an engineering degree or a soldering
    iron to build high-quality and robust digital instruments.


    *   **Figure** [**13-1**](#486852_1_En_13_Chapter.xhtml#Fig1) shows two digital
    instruments built with `xChips`. We built the Wi-Fi gateway shown on the left,
    while the device shown on the right could be used in a high-altitude balloon to
    record and transmit environmental data.


    **If you can write block code for micro:bit** **:**


    ![../images/486852_1_En_13_Chapter/486852_1_En_13_Fig2_HTML.jpg](images/486852_1_En_13_Chapter/486852_1_En_13_Fig2_HTML.jpg)


    Figure 13-2


    A selection of boards that can be programmed using block code in Microsoft’s `Maker.Makecode`


    *   Then you **can** write code: you can program.


    *   There are a LOT of microprocessors that can take block code. And most of them
    are orders of magnitude more powerful than the micro:bit. You **can** program
    these too, using the same techniques.


    *   **Figure** [**13-2**](#486852_1_En_13_Chapter.xhtml#Fig2) shows the `Maker.Makecode`
    block coding environment. This is a Microsoft product – the micro:bit `MakeCode`
    we used is a “white label” implementation of this block coding environment.


    *   The interface, syntax, flashing process are very similar – they will be familiar
    to users of `MakeCode`.


    *   **Figure** [**13-2**](#486852_1_En_13_Chapter.xhtml#Fig2) shows a selection
    of the boards that can be coded using block code.


    **If you can program a microprocessor to read data from a sensor:**


    ![../images/486852_1_En_13_Chapter/486852_1_En_13_Fig3_HTML.jpg](images/486852_1_En_13_Chapter/486852_1_En_13_Fig3_HTML.jpg)


    Figure 13-3


    Four `MakeCode` extensions for four different sensors


    *   Then you can program it to read data from any sensor. You know how to load
    libraries/extensions, and the blocks to read sensor data tend to work in a very
    similar way. Finding the right extension for a specific sensor can be the trickiest
    part: look for manufacturers who provide easy-to-use (and find) `MakeCode` extensions
    for the microprocessor you are using.


    *   Reading data from more than one sensor is trivial: you should be able to read
    from an array of many sensors simultaneously.


    *   **Figure** [**13-3**](#486852_1_En_13_Chapter.xhtml#Fig3) shows four `MakeCode`
    extensions for different types of sensor. The names of the variables change, but
    in each case the value from the sensor is returned as a simple variable, a number.
    The paradigm is the same.


    **If you can analyze** **temperature and humidity data** **:**


    *   Then you can analyze any two data sets using the same techniques.


    *   You should be able to extend this: add other data sets, experiment with different
    types of visualizations, hunt for correlations, and add trend lines.


    **If you can connect to an** **IoT platform** **:**


    *   Then you can send and receive data from an online platform and access services
    on the cloud.


    *   The power of the online platform and the services available can be used to
    add sophistication to your digital instrument.


    **If you can process received data from an** **IoT platform** **:**


    *   Then you can use/respond to commands or data from that IoT platform. These
    commands/data have had the processing power of the IoT platform behind them: processing
    power orders of magnitude greater than is available on the SBC you are using.


    *   If you can get an IoT platform to send data to a remote digital instrument,
    then an AI/ML service that the IoT platform is hooked up to can also sent data
    to it.


    **If you can hook up a weather station to a** **ML predictive model** **:**


    *   Then you can hook up any edge device to any of the many ML predictive models
    available.


    As recently as 20, maybe even 10 years ago, a comparable set of skills would have
    taken a bright and motivated individual many years to acquire. But with modern
    technology it is possible to gain those skills more quickly and focus on how to
    apply them, on the things that the technology can enable, rather than fiddling
    with the technology itself. Data science is a layer on top of digital technology,
    and being able to delve into it like we have done here is a luxury that would
    not have been possible until quite recently: within the lifetime of most readers.


    ## 13.5 Applying Our Knowledge to Different Builds


    Using the skills outlined in the previous section you could build all sorts of
    things, such as


    *   An instrument with an array of sensors that connects to an IoT platform


    *   And that sends data which is then passed into an ML model


    *   The ML generates predictions or key metrics which are sent back (perhaps to
    a completely different device/devices)


    *   And where a series of real-world electronic switches or motors are turned
    on/off


    *   All this time information is output on one or more screens, perhaps on devices
    in different locations


    *   And is written to a file and backed up on the IoT platform


    While this might sound complex, it is extremely generic: the core architecture
    of any number of modern inventions/gadgets. With this basic model, you can build
    a huge range of things, including:


    *   A tool to monitor the air quality of a classroom, or bedroom, or airport waiting
    room. Data is collected by sensors in the room and shared by Wi-Fi with an ML
    service, which analyzes the data and remotely controls a window, blinds, fan,
    dehumidifier, and air conditioner as appropriate to maintain a healthy environment
    at minimal energy cost.


    *   Having trouble sleeping? Build a sensor array to monitor factors in your bedroom.
    Collect a few weeks’ worth of sensor data and add in data about how well you slept.
    Identify sensor readings that correlate with you sleeping well; then build an
    instrument that can manage the relevant factors to give you an optimal environment.


    *   What about a chess playing robot? Or a robot that can sort different colored
    jelly beans? Or one that can pick ripe strawberries?


    *   Building and maintaining a controlled environment such as an enclosure for
    an “exotic” pet.


    *   Cities like London have large flood gates which are closed when water levels
    get too high. But it takes time to close them, and it is often costly to do so.
    A range of sensor arrays upstream and weather report data all being fed into an
    ML model which predicts flooding could make for a very efficient control system.


    *   There are rural villages in India that are visited by wild roaming elephants
    who are known to eat crops and cause damage. A series of arrays and actuators
    spread around a village might be capable of setting off loud noises or lights
    to divert elephants away.'
