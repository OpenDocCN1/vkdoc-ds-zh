    \ **图** **11-13**。\n\n![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig13_HTML.jpg](img/486852_1_En_11_Fig13_HTML.jpg)\n\
    \n图 11-13\n\n响应结果\n\n**响应结果** 显示了当您输入的测试变量被处理时，ML 服务将返回的数据。结果（数组）中有四个关键数据点：\n\n\
