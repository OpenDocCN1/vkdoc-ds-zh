    # 2.4 使用 BBC micro:bit 作为温度计


    你知道吗，BBC micro:bit 内置了一个温度传感器？它使用起来非常简单，这意味着我们可以对 micro:bit 进行编程，让它像一个温度计一样工作，而这正是我们接下来要做的。


    我们已经了解到，理解测量工具有助于我们理解它所产生的数据：


    在制造 BBC micro:bit 时，主板上并没有配备温度传感器。直到设计完成后，一位工程师才意识到，micro:bit 上的某个芯片内置了热传感器，并且可以从中读取温度数据。类似的故事还有，有人发现
    LED 矩阵的光敏特性也可以用作一个简易传感器。


    要将 micro:bit 用作温度计，我们需要编写一些代码，然后将其复制（或烧录）到 micro:bit 上。我们构建的每一个数字工具都需要进行编码。


    # 2.5 本书使用的编码指南


    在整本书中，我们将构建越来越复杂的数字工具，以帮助我们发展数据科学技能，而每个工具都需要编写相应的代码。在编写工具代码时，我们始终会提供两种选择：


    1. **免编码方案**：访问我们的资源网站（`http://xib.one/XB`），找到“第 X.Y 节”。你会看到一个可以下载并直接烧录到 micro:bit
    上的 hex 文件。页面上有操作说明。在整本书中，我们都会为你提供“免编码”解决方案。


    2. **你自己编码的方案**：在可能的情况下，我们将使用 Microsoft MakeCode，这是一个有趣且易于使用的积木式代码编辑器。当 MakeCode
    无法提供所需功能时，我们会使用 MicroPython。我们将使用 Mu 编辑器进行 MicroPython 编码。


    如果你选择自己编写代码，我们会首先向你展示自然语言代码：这是一种用自然语言编写的、实现目标所需过程的逐步描述。然后，我们会向你展示所需的 MakeCode
    积木（或 MicroPython 代码），用于将自然语言代码转换为能在你的 micro:bit 上运行的实际代码。这种方法使得代码更容易适应不同的硬件平台或不同的编程语言：自然语言代码充当了一个简单但充分的软件规范。


    # 2.6 使用 micro:bit 代码编辑器


    如果你选择自己编写代码，那么你需要选择一个代码编辑器。BBC micro:bit 有几种选择；我们将提供 MakeCode 和 Mu（MicroPython）的指南。


    本书的目的不是向你介绍如何在 BBC micro:bit 上编码——有很多优秀的书籍可以供你学习。但对于那些刚接触 BBC micro:bit 编码的人来说，有几个关键主题是你需要理解的。你可以通过我们的资源网站（`http://xib.one/XB`）上的链接来阅读相关资料。


    # 2.7 使用“免编码”方案


    并非每个需要使用气象站的人都想亲自为其编写代码。在某些情况下，编码是一项重要技能，而在其他情况下则无关紧要：在计算机科学课上和在地理课上搭建气象站，其方法会截然不同，也会带来非常不同的学习成果。当然，本书的重点是数据科学：我们构建的工具以及为它们编写的代码只是辅助手段——我们需要它们来恰当地讲述数据科学的故事，但它们并非故事的主角。


    免编码方案，加上本章后面描述的易于搭建的组件系统，将让你在几分钟内就能让你的数字工具启动并运行。你只需要按照描述构建工具，然后从提供的网址下载代码即可。


    并且，不要认为这是在作弊！你买新冰箱时不会去编程，你开车前也不必给汽车编写代码。那么，为什么你就一定要给一个数据采集工具编程呢？

    '
- fmt: "### 2.8 Coding the micro:bit Thermometer\n\nWe will now build our micro:bit\
    \ thermometer.\n\nThe circuit for this is very simple – just a micro:bit and a\
    \ power supply (Figure 2-2). We don’t need anything extra as we are going to use\
    \ the micro:bit’s onboard temperature sensor and the 5x5 LED matrix to display\
    \ the temperature.\n\n![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig2_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig2_HTML.jpg)\n\
    \n**Figure 2-2**  \nmicro:bit thermometer – just a micro:bit and a power supply\
    \ (2xAAA battery pack)\n\nThere are several ways to power your micro:bit, the\
    \ most common being:\n\n1.  You can plug your micro:bit into a USB socket using\
    \ a cable.\n2.  You can plug the 2xAAA battery pack that is supplied with the\
    \ micro:bit into the available connection port.\n\nThere is more detail on this\
    \ in our **resource website** ([`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)).\
    \ A number of the digital tools we will build need to be portable, so you should\
    \ ensure you have the micro:bit battery pack and some batteries available.\n\n\
    We will need to write code to tell the micro:bit how to act as a thermometer:\
    \ Figure 2-3 presents the “natural language code” for this.\n\n![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig3_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig3_HTML.jpg)\n\
    \n**Figure 2-3**  \nNatural language code for a digital thermometer\n\n**No-code\
    \ option**: You can find a precompiled version of the code needed for this section\
    \ on our **resource website**. Go to [`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)\
    \ and search for **Section 2.8**.\n\nTable 2-1 shows how to convert the **natural\
    \ language code** from earlier into MakeCode blocks that can be compiled and loaded\
    \ onto your micro:bit.\n\n**Table 2-1**  \nDeveloping code with MakeCode blocks\n\
    \n| Step | MakeCode | Notes |\n| --- | --- | --- |\n| 1 | Open MakeCode and start\
    \ a new project. | MakeCode imports the core micro:bit library automatically.\
    \ |\n| 2 | Ensure your project has a `forever` loop: <br>![../images/486852_1_En_2_Chapter/486852_1_En_2_Figa_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Figa_HTML.jpg)\
    \ | The code we put inside a `forever` loop will just keep on running over and\
    \ over. New projects have a `forever` loop preloaded by default. |\n| 3 & 4 |\
    \ Add the following blocks to the `forever` loop: <br>![../images/486852_1_En_2_Chapter/486852_1_En_2_Figb_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Figb_HTML.jpg)\
    \ | The first block will make `\"Temp C:\"` scroll on the micro:bit LEDs. The\
    \ second block will make the temperature scroll on the micro:bit LEDs. |\n\nFigure\
    \ 2-4 shows the full MakeCode program for the micro:bit thermometer.\n\n![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig4_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig4_HTML.jpg)\n\
    \n**Figure 2-4**  \nMakeCode blocks for the micro:bit thermometer\n\nNow that\
    \ the code has been written you just need to compile it and download (“flash”)\
    \ it onto your micro:bit. Check our **resource website** ([`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0))\
    \ if you are unsure of how to do so.\n\nOnce the flashing process has been completed,\
    \ the temperature in Celsius will display on the 5x5 LED matrix, scrolling continually.\
    \ The output will look something like Figure 2-5.\n\n![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig5_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig5_HTML.jpg)\n\
    \n**Figure 2-5**  \nA temperature reading scrolling on a micro:bit from right\
    \ to left. Each micro:bit image represents a single frame of the output.\n\nThe\
    \ code we have put onto the micro:bit tells it how to behave as a digital thermometer.\
    \ We have built our first digital tool; now it’s time to use it.\n\n### 2.9 Comparing\
    \ Analog and Digital Thermometers\n\nWe are going to undertake a quick exercise,\
    \ described in Table 2-2, where we will read temperature simultaneously from a\
    \ micro:bit and an analog thermometer and then compare our results.\n\n**Table\
    \ 2-2**  \nDetails for Exercise 2-1\n\n| Exercise 2-1 | What is the temperature\
    \ in the room? |\n| --- | --- |\n| Summary | We measure the temperature in a room\
    \ using different tools, ideally read by a number of different people. Values\
    \ will be different: the micro:bit temperature sensor reads hotter than the air\
    \ almost all the time so is likely to be higher than the analog readings. This\
    \ exercise is designed to reveal insights about data quality and the tools being\
    \ used while introducing the concept of aggregating data. How can we resolve all\
    \ the different results into a single measure: what *is* the temperature in the\
    \ room? |\n| Duration | 10–15 minutes |\n| Step-by-step process | 1. Acquire at\
    \ least 1 micro:bit thermometer and an analog thermometer. 2. Read the temperature\
    \ from both devices in a variety of locations in a room and write them down in\
    \ a table. 3. As discrepancies are revealed, consider hypotheses about the source.\
    \ 4. When you have collected the data, work through the points listed in **Section\
    \ 2.9**. |\n| What we will learn | We apply what we’ve learned about data quality\
    \ to analyze our results and try to make sense out of discrepancies. By trying\
    \ to agree on what the temperature of the room is, we are introduced to aggregation\
    \ and range. We also learn how to use the micro:bit tool we designed to gather\
    \ data. |\n\n### 2.10 Analysis\n\nIn later chapters we are going to look at some\
    \ of the tools you can use to enhance your analysis. But analysis always starts\
    \ with curiosity – quite often with questions, such as these:\n\n“Is the air quality\
    \ in my neighborhood poor?”\n\n“Is the lake getting lower every year?”\n\n“How\
    \ far is it to the moon?”\n\nWork through the topics in the following sections.\n\
    \n#### Analysis of Extremities\n\nLook at the maximum and minimum values for the\
    \ micro:bit and the analog readings. The **range** is the difference between the\
    \ maximum and the minimum. Which tool has the greatest range, and why might that\
    \ be? What does this tell us, does it tell us anything? Is a smaller or larger\
    \ range ideal? Why? This all links this back to the reliability/validity of the\
    \ data.\n\nHaving a broad range could just reflect that different areas of the\
    \ room are at different temperatures. In general, though, a smaller range can\
    \ indicate higher accuracy – if the room is a stable temperature throughout, then\
    \ accurate thermometers would have a tight range.\n\nBut something else comes\
    \ into play with our micro:bits: their thermometers measure the operating heat\
    \ of the chip on which they are mounted, and this is usually higher than room\
    \ temperature. So they MAY show a tighter range, but perhaps because they are\
    \ less sensitive to ambient temperature."
  raw: '## 2.8 Coding the micro:bit Thermometer


    We will now build our micro:bit thermometer.


    The circuit for this is very simple – just a micro:bit and a power supply (**Figure**
    [**2-2**](#486852_1_En_2_Chapter.xhtml#Fig2)). We don’t need anything extra as
    we are going to use the micro:bit’s onboard temperature sensor and the 5x5 LED
    matrix to display the temperature.


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig2_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    micro:bit thermometer – just a micro:bit and a power supply (2xAAA battery pack)


    There are several ways to power your micro:bit, the most common being:


    1.  You can plug your micro:bit into a USB socket using a cable.


    2.  You can plug the 2xAAA battery pack that is supplied with the micro:bit into
    the available connection port.


    There is more detail on this in our **resource website** ([`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)).
    A number of the digital tools we will build need to be portable, so you should
    ensure you have the micro:bit battery pack and some batteries available.


    We will need to write code to tell the micro:bit how to act as a thermometer:
    **Figure** [**2-3**](#486852_1_En_2_Chapter.xhtml#Fig3) presents the **“natural
    language code”** for this.


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig3_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Natural language code for a digital thermometer


    **No-code option**: You can find a precompiled version of the code needed for
    this section on our **resource website**. Go to [`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)
    and search for **Section 2.8**.


    **Table** [**2-1**](#486852_1_En_2_Chapter.xhtml#Tab1) shows how to convert the
    **natural language code** from earlier into MakeCode blocks that can be compiled
    and loaded onto your micro:bit.


    Table 2-1


    Developing code with MakeCode blocks


    | Step | MakeCode | Notes |

    | --- | --- | --- |

    | 1 | Open MakeCode and start a new project. | MakeCode imports the core micro:bit
    library automatically. |

    | 2 | Ensure your project has a forever loop:![../images/486852_1_En_2_Chapter/486852_1_En_2_Figa_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Figa_HTML.jpg)
    | The code we put inside a forever loop will just keep on running over and over.New
    projects have a forever loop preloaded by default. |

    | 3 & 4 | Add the following blocks to the forever loop:![../images/486852_1_En_2_Chapter/486852_1_En_2_Figb_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Figb_HTML.jpg)
    | The first block will make “Temp C:” scroll on the micro:bit LEDs.The second
    block will make the temperature scroll on the micro:bit LEDs. |


    **Figure** [**2-4**](#486852_1_En_2_Chapter.xhtml#Fig4) shows the full MakeCode
    program for the micro:bit thermometer.


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig4_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    MakeCode blocks for the micro:bit thermometer


    Now that the code has been written you just need to compile it and download (“flash”)
    it onto your micro:bit. Check our **resource website** ([`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0))
    if you are unsure of how to do so.


    Once the flashing process has been completed, the temperature in Celsius will
    display on the 5x5 LED matrix, scrolling continually. The output will look something
    like **Figure** [**2-5**](#486852_1_En_2_Chapter.xhtml#Fig5).


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig5_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    A temperature reading scrolling on a micro:bit from right to left. Each micro:bit
    image represents a single frame of the output


    The code we have put onto the micro:bit tells it how to behave as a digital thermometer.
    We have built our first digital tool; now it’s time to use it.


    ## 2.9 Comparing Analog and Digital Thermometers


    We are going to undertake a quick exercise, described in **Table** [**2-2**](#486852_1_En_2_Chapter.xhtml#Tab2),
    where we will read temperature simultaneously from a micro:bit and an analog thermometer
    and then compare our results.


    Table 2-2


    Details for Exercise 2-1


    | Exercise 2-1 | What is the temperature in the room? |

    | --- | --- |

    | Summary | We measure the temperature in a room using different tools, ideally
    read by a number of different people. Values will be different: the micro:bit
    temperature sensor reads hotter than the air almost all the time so is likely
    to be higher than the analog readings.This exercise is designed to reveal insights
    about data quality and the tools being used while introducing the concept of aggregating
    data. How can we resolve all the different results into a single measure: what
    *is* the temperature in the room? |

    | Duration | 10–15 minutes |

    | Step-by-step process | 1. Acquire at least 1 micro:bit thermometer and an analog
    thermometer.2. Read the temperature from both devices in a variety of locations
    in a room and write them down in a table.3. As discrepancies are revealed, consider
    hypotheses about the source.4. When you have collected the data, work through
    the points listed in **Section 2.9**. |

    | What we will learn | We apply what we’ve learned about data quality to analyze
    our results and try to make sense out of discrepancies.By trying to agree on what
    the temperature of the room is, we are introduced to aggregation and range.We
    also learn how to use the micro:bit tool we designed to gather data. |


    ## 2.10 Analysis


    In later chapters we are going to look at some of the tools you can use to enhance
    your analysis. But analysis always starts with curiosity – quite often with questions,
    such as these:


    “Is the air quality in my neighborhood poor?”


    “Is the lake getting lower every year?”


    “How far is it to the moon?”


    Work through the topics in the following sections.


    ### Analysis of Extremities


    Look at the maximum and minimum values for the micro:bit and the analog readings.
    The **range** is the difference between the maximum and the minimum. Which tool
    has the greatest range, and why might that be? What does this tell us, does it
    tell us anything? Is a smaller or larger range ideal? Why? This all links this
    back to the reliability/validity of the data.


    Having a broad range could just reflect that different areas of the room are at
    different temperatures. In general, though, a smaller range can indicate higher
    accuracy – if the room is a stable temperature throughout, then accurate thermometers
    would have a tight range.


    But something else comes into play with our micro:bits: their thermometers measure
    the operating heat of the chip on which they are mounted, and this is usually
    higher than room temperature. So they MAY show a tighter range, but perhaps because
    they are less sensitive to ambient temperature.'
  trans: "\n### 2.8 为 micro:bit 温度计编程\n\n现在我们将构建自己的 micro:bit 温度计。\n\n这个电路非常简单——只需要一个\
    \ micro:bit 和一个电源（图 2-2）。我们不需要任何额外组件，因为我们将使用 micro:bit 的板载温度传感器和 5x5 LED 矩阵来显示温度。\n\
    \n![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig2_HTML.jpg](img/486852_1_En_2_Fig2_HTML.jpg)\n\
    \n**图 2-2**  \nmicro:bit 温度计——仅需一个 micro:bit 和一个电源（2xAAA 电池组）\n\n有多种方式可以为你的 micro:bit\
    \ 供电，最常见的有：\n\n1.  你可以用 USB 线将 micro:bit 连接到 USB 插座上。\n2.  你可以将 micro:bit 附带的\
    \ 2xAAA 电池组插入可用的连接端口。\n\n关于此的更多详细信息，请参见我们的**资源网站**（[`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)）。我们将构建的许多数字工具需要便携，因此你应确保手头有\
    \ micro:bit 电池组和一些电池。\n\n我们需要编写代码来告诉 micro:bit 如何充当温度计：图 2-3 展示了相应的“自然语言代码”。\n\
    \n![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig3_HTML.jpg](img/486852_1_En_2_Fig3_HTML.jpg)\n\
    \n**图 2-3**  \n数字温度计的自然语言代码\n\n**无代码选项**：你可以在我们的**资源网站**上找到本节所需代码的预编译版本。前往[`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)并搜索**第\
    \ 2.8 节**。\n\n表 2-1 展示了如何将前面的**自然语言代码**转换为可编译并加载到 micro:bit 上的 MakeCode 积木。\n\n\
    **表 2-1**  \n使用 MakeCode 积木开发代码\n\n| 步骤 | MakeCode 操作 | 说明 |\n| --- | --- | ---\
    \ |\n| 1 | 打开 MakeCode 并开始一个新项目。 | MakeCode 会自动导入 micro:bit 核心库。 |\n| 2 | 确保你的项目中有一个\
    \ `forever` 循环：<br>![../images/486852_1_En_2_Chapter/486852_1_En_2_Figa_HTML.jpg](img/486852_1_En_2_Figa_HTML.jpg)\
    \ | 放在 `forever` 循环内的代码会反复运行。新项目默认会预载一个 `forever` 循环。 |\n| 3 和 4 | 将以下积木添加到 `forever`\
    \ 循环中：<br>![../images/486852_1_En_2_Chapter/486852_1_En_2_Figb_HTML.jpg](img/486852_1_En_2_Figb_HTML.jpg)\
    \ | 第一个积木会让 `\"Temp C:\"` 在 micro:bit 的 LED 上滚动显示。第二个积木会让温度值在 micro:bit 的 LED\
    \ 上滚动显示。 |\n\n图 2-4 展示了 micro:bit 温度计的完整 MakeCode 程序。\n\n![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig4_HTML.jpg](img/486852_1_En_2_Fig4_HTML.jpg)\n\
    \n**图 2-4**  \nmicro:bit 温度计的 MakeCode 积木\n\n代码编写完成后，你只需编译并将其下载（“烧录”）到你的 micro:bit\
    \ 上。如果你不确定如何操作，请查看我们的**资源网站**（[`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)）。\n\
    \n烧录过程完成后，以摄氏度为单位的温度将显示在 5x5 LED 矩阵上，并持续滚动。输出效果大致如图 2-5 所示。\n\n![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig5_HTML.jpg](img/486852_1_En_2_Fig5_HTML.jpg)\n\
    \n**图 2-5**  \n温度读数在 micro:bit 上从右向左滚动显示。每个 micro:bit 图像代表输出的一帧。\n\n我们上传到 micro:bit\
    \ 上的代码告诉它如何像一个数字温度计一样工作。我们已经构建了第一个数字工具；现在该使用它了。\n\n### 2.9 比较模拟温度计和数字温度计\n\n我们将进行一个快速练习，如表\
    \ 2-2 所述，同时用 micro:bit 和一个模拟温度计读取温度，然后比较结果。\n\n**表 2-2**  \n练习 2-1 的详细信息\n\n|\
    \ 练习 2-1 | 房间里的温度是多少？ |\n| --- | --- |\n| 概述 | 我们使用不同的工具测量房间内的温度，理想情况下由多个不同的人读取。数值会有所不同：micro:bit\
    \ 的温度传感器几乎总是读取到比空气更高的温度，因此其读数很可能高于模拟读数。本练习旨在揭示关于数据质量和所用工具的见解，同时引入数据聚合的概念。我们如何才能将所有不同的结果整合成一个单一的度量：房间里*到底*是多少度？\
    \ |\n| 时长 | 10–15 分钟 |\n| 分步流程 | 1. 获取至少 1 个 micro:bit 温度计和一个模拟温度计。 2. 在房间内的不同位置读取两个设备的温度，并将其记录在表格中。\
    \ 3. 当发现差异时，思考可能的原因。 4. 收集完数据后，完成**第 2.9 节**中列出的要点。 |\n| 学习内容 | 我们应用所学到的关于数据质量的知识来分析结果，并尝试理解差异。通过试图就房间温度达成一致，我们初步了解了数据聚合和范围的概念。同时，我们还学习了如何使用设计的\
    \ micro:bit 工具来收集数据。 |\n\n### 2.10 分析\n\n在后面的章节中，我们将探讨一些可用于增强分析能力的工具。但分析总是始于好奇心——通常始于诸如此类的问题：\n\
    \n“我所在社区的空气质量很差吗？”\n\n“这个湖的水位是否在逐年下降？”\n\n“到月球的距离有多远？”\n\n请完成以下各节中的主题。\n\n####\
    \ 极值分析\n\n查看 micro:bit 和模拟温度计读数的最大值和最小值。**极差** 是最大值和最小值之间的差值。哪个工具拥有最大的极差，为什么？这告诉我们什么，它有什么启示？极差是大好还是小好？为什么？所有这些都回到了数据的可靠性/有效性上。\n\
    \n较大的极差可能仅仅反映了房间内不同区域温度不同。但总体来说，较小的极差可能意味着更高的精度——如果整个房间温度稳定，那么精确的温度计读数范围就会很紧凑。\n\
    \n但我们的 micro:bit 还涉及另一个因素：它们的温度传感器测量的是其所在芯片的工作温度，这通常高于室温。因此，它们**可能**会显示更小的极差，但这也许是因为它们对环境温度的敏感度较低。\n"
- fmt: '### Analysis of Averages: “Central Tendency”


    Is there actually a perfect, right answer to the question: *what is the temperature
    in this room*? If so, which parts of the room are that exact temperature? What
    is the single value we would choose to describe the temperature of this room?
    An average is a convenient and useful summary of a large set of numbers.


    ### Analysis of Data Quality


    Is one of our thermometers right? Or is one more right than the other? Remember
    to link this back to what the tool is actually measuring.


    BOTH are right in relation to what they are measuring – if there is an error,
    it is because we have **extrapolated**. When we extrapolate, we take a value that
    means something and we apply it to something else.


    So, when we take a temperature value that applies to a very small volume of the
    room and we apply that to the whole room, we have extrapolated the data. Extrapolating
    can impact on the validity of data: the more we extrapolate, the less valid we
    risk the data becoming.


    ### Introspection


    What could be improved if we were to repeat the exercise?


    There aren’t really any right and wrong answers to the questions earlier; the
    value of the exercise is in the questioning and the discussion – getting into
    the habit of asking loads of questions about a data set. This is the heart of
    the data analysis phase.


    Data analysis does get a bit more formal. The professional tools of data analysis
    are very sophisticated and the mathematics that backs it up is complicated and
    elegant. But whatever tool you use, data analysis means asking questions and then
    finding answers. To a data scientist a set of data is like an unopened box of
    chocolates, a treat, ready to be cracked and discovered. But first, always check
    the ingredients!


    ## 2.11 Why the `micro:bit`?


    In the previous section the analog thermometer was probably slightly easier to
    use and most likely a little more accurate; if all we ever wanted to do was measure
    the temperature then there is no compelling reason to switch to the `micro:bit`.


    Moving forward we are going to stick with digital tools: digital means that we
    have access to a huge range of hardware, software and knowledge that we can use
    to great effect in our data science experiments.


    Imagine building a tool that reads pollen levels and then uploads them in real
    time to a website that tracks the levels as you walk around. Add in a warning
    light if the level is too high, get a few dozen people using it at the same time
    and get your route updated live to take you through the areas least likely to
    set off an allergy you might have. That is applied data science, and it is the
    promise of being able to do that sort of really cool stuff that makes us stick
    with digital tools.


    The BBC `micro:bit` might not make a great thermometer but it meets our needs
    for a microprocessor in many ways:


    *   It is a very easy microprocessor to use – it’s more user friendly than any
    other option out there.

    *   The coding editors are very easy to use.

    *   A lot of people already have them (there are almost 5 million in circulation)
    and more are bring produced all the time. It is a growing platform, especially
    in education.

    *   It is well supported – lots of materials and help.

    *   It also has a bit of a cool factor: *from the makers of* **Doctor Who**, here
    comes the BBC `micro:bit`*!


    We are going to use the BBC `micro:bit` throughout this book, but when we list
    the hardware requirements we will suggest alternatives. You can follow this book
    just as easily with a `Circuit Playground`, `Raspberry Pi` or `Arduino` device
    at hand.


    The BBC `micro:bit` by itself is not going to meet all of our needs though – our
    experience in this chapter has already shown us a couple of shortcomings:


    *   It includes a temperature sensor as well as a magnetometer and an accelerometer,
    but there are no other environmental sensors. We need access to a broader set
    of sensors that we can use to gather interesting data.

    *   The 5x5 LED matrix is not very good for reading lots of data. At some point,
    we are going to need other methods to get the data out of the `micro:bit`.


    We are going to go digital and we are going to use the BBC `micro:bit` as the
    microprocessor in our digital toolkit. We are also going to need to enhance it
    with some other kit to gather all the data we’ll need.


    ## 2.12 What Kit Do We Need?


    Every digital measuring device has a number of common features: they are made
    up of the same basic components. Throughout this book when we describe how to
    build the devices we’ll use a circuit/block diagram such as **Figure** [**2-1**](#486852_1_En_2_Chapter.xhtml#Fig1)
    (shown earlier) and **Figure** [**2-6**](#486852_1_En_2_Chapter.xhtml#Fig6) to
    show you the hardware components that are included. Using these circuit/block
    diagrams you can build your tools/instruments using whatever hardware you have
    access to. **Figure** [**2-6**](#486852_1_En_2_Chapter.xhtml#Fig6) shows an example
    of a circuit built with seven components.


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig6_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig6_HTML.jpg)


    **Figure 2-6** A simple rendition of the components of a sophisticated digital
    tool


    The tools we build in this book will include most of the following components:


    1.  **A power source**: We will use the 2xAAA battery holder or the USB cable
    that comes with the `micro:bit` for power.

    2.  **A microprocessor**: We are going to use the BBC `micro:bit`.

    3.  **One or more sensors**: Sensors to measure things. There are a huge range
    of digital sensors available, and by the end of this book, you should feel confident
    enough to source a specific sensor and use it to create a digital measuring tool.

    4.  **Several ways to output data**: The image shows us using an `OLED` display,
    a file system, and `Wi-Fi` – three different ways we can access the data that
    is collected from the sensors.

    5.  Other **cool stuff**: Like `GPS` or actuators (which move or control things:
    e.g. start a motor or turn on a light).

    6.  **A way of connecting it all up**: When all the pieces are connected, we have
    a **“circuit**.” The way that components are joined together is a key element
    of the circuit and is often not trivial.


    The instrument shown in **Figure** [**2-5**](#486852_1_En_2_Chapter.xhtml#Fig5)
    would make a great weather monitoring tool. The `GPS` module would allow us to
    **geo-tag** our results to identify the location where readings are taken. The
    `Wi-Fi` module would be used to upload data from the instrument to an `Internet
    of Things` (`IoT`) platform as well as allowing us to get the real time, which
    would be used to **timestamp** the data (when a data reading is taken the time
    of the reading is also recorded). Data is saved locally on the memory card in
    case the `Wi-Fi` connection drops out. We need a toolkit that will allow us to
    build data gathering instruments of this complexity.'
