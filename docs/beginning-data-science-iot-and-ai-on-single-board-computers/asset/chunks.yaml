    # 10.9 分析数据


    收集并下载数据后，下一步就是对其进行分析，看看数据深处是否隐藏着有趣的秘密。


    如果你使用了之前推荐的硬件和软件，那么你应该会得到一个带有以下标签的数据集：


    - **时间戳**：这是一个整数，表示自 micro:bit 通电以来经过的毫秒数。

    - **加速度 X**：x 轴方向的加速度测量值（相对于 micro:bit，由板载加速度计记录）。

    - **加速度 Y**：y 轴方向的加速度测量值。

    - **加速度 Z**：z 轴方向的加速度测量值。

    - **磁力 X**：x 轴方向的磁力测量值（由 micro:bit 板载磁力计记录）。

    - **磁力 Y**：y 轴方向的磁力测量值。

    - **磁力 Z**：z 轴方向的磁力测量值。

    - **B**：标记——该值通常为 0，仅在 B 按钮被点击时为 1。

    - **温度**：由 `SW01 xChip` 记录的摄氏温度。

    - **气压**：由 `SW01 xChip` 记录的大气压力。

    - **湿度**：由 `SW01 xChip` 记录的相对湿度。


    标记为 **B** 的字段中的数据告诉我们受试者何时表现出了目标行为。


    寻找数据字段与目标行为之间关联性的一个相当简单的方法是使用下述流程绘制折线图：


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig7_HTML.jpg](img/486852_1_En_10_Fig7_HTML.jpg)


    图 10-7 目标行为发生前的温度数据


    - 在数据中找到目标行为发生时对应的点——即 H 列出现数值 1 的位置。

    - 选择另一个要查看的数据字段（例如温度）。从当前记录**向上**高亮该字段中的数据（以选择在标记目标行为之前记录的数据）：选择几百条记录。

    - 点击**插入/图表/折线图**。创建一个显示高亮数据的折线图。

    - 你的图表看起来会类似于图 10-7。


    我们在图 10-7 中看到的是温度数据。它显示了在我感到冲动想泡杯咖啡前几分钟的数据。我本可以选取更长时段内更大块的数据，但我选择不这么做：想泡咖啡的冲动通常很突然，所以我想观察一个较短的时间段。请以类似的方式运用你的逻辑来选择要分析的时间段。


    就其本身而言，这种可视化几乎没有价值。我们需要查看其他类似的图表，并检查是否存在相似的模式。针对每次目标行为重复生成图表的这个过程。尝试使用相同数量的数据点，并且不要让图表使用重叠的数据。


    我生成了四个图表，如图 10-8 所示。


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig8_HTML.jpg](img/486852_1_En_10_Fig8_HTML.jpg)


    图 10-8 显示目标行为发生前温度变化的四个图表


    将这些图表并排放置，有助于我们发现是否存在某种模式：即在目标行为发生前，图表形状的相似之处。


    在显示的四个实例中，温度在我感到冲动想泡杯茶之前是持续下降的。这出乎意料：尽管我假设最可能与目标行为相关的度量值是温度，但我确实没想到会看到一种模式。这些数据并不能证明什么，但它表明温度可能在触发我的“咖啡冲动”中发挥了作用。我心中的数据科学家将此结果标记为值得以后更严格调查的内容。


    我们分析过程的下一步是对所有不同的度量值重复此过程，看看是否有其他模式出现。我们有九个传感器读数可以选择，因此需要绘制大量图表——最好马上开始！


    但是，**不**。在这一点上，我们应用人类智能来指导我们的分析：


    加速度有可能成为目标行为的触发因素吗？磁力计读数呢？我的逻辑告诉我，这种可能性要么为零，要么非常接近于零。湿度和/或气压起作用的可能性更大。我判断，花时间创建加速度和磁力计数据的图表并不值得我付出努力，并且我会优先考虑那些更有可能产生结果的度量值。用省下的时间，我会再去泡杯咖啡（天气有点凉了！）。


    ## 10.10 人类与机器的比较


    目前有多种公开可用的人工智能服务，我们将在下一章介绍如何访问其中之一。然而在这个实验中，我们完全是手动完成的。表 10-3 列出了我们进行的若干活动和操作，并说明了在每个实例中人工智能可能能够做什么。


    表 10-3 数据分析：比较人类和人工智能可能如何执行此处概述的分析


    | 我所做的 | 人工智能会做的 |

    | --- | --- |

    | 我出于好奇设计了一个实验来探究某事。 | 人工智能会响应某种命令。它们天生没有好奇心。 |

    | 我选择先查看温度：感觉它是最可能产生影响的度量值。 | 人工智能会查看所有不同的度量值，然后查看它们之间各种组合。随着时间的推移，它会学会优先考虑那些能更稳定地产生显著结果的度量值。
    |

    | 我制作了四个图表，它们都关注基于逻辑假设选择的相似时间段。然后我目视检查了我制作的图表。 | 人工智能会使用广泛的模式匹配算法来彻底分析数据，测试各种不同的时间段。只要有足够的时间处理数据，它就能找到任何具有统计显著性的结果。
    |

    | 我寻找模式。 | 人工智能寻找模式。 |

    | 我运用逻辑来减少工作量。我珍惜自己的时间，并排除了我认为无关紧要的度量值。 | 人工智能会利用先前的学习来指导其搜索方式，并且只要有工作需要完成，或者直到被告知停止，它都会继续工作。
    |

    | 我认为结果很有趣，可能值得进一步调查。 | 人工智能会报告具有一定统计显著性程度的结果。我们可以训练人工智能为一个结果被人类认为有趣的可能性打分。 |

    | 我可能会基于直觉和经验做出一些预测。 | 人工智能可能会基于大量先前的类似事件，以及一个经过高度训练和演进的预测模型来做出预测。 |


    请注意，表 10-3 中最可能被归类为“智能行为”的活动都列在了“**我所做的**”一栏中。人工智能可以提供很多帮助，但数据科学中真正的智能仍然来自参与流程的人。


    然而，人工智能的价值显而易见，它可以执行大量复杂分析，这些分析对人类来说太耗时，并且超出了我们大多数人的技能范围。在下一章中，我们将解锁这种能力，并开始在数据科学工作中使用人工智能。

    '
- fmt: "# 10.11 Summary\n\nIn this chapter we looked at intelligence, both artificial\
    \ and real, and learned what lies at the core of AI and ML. We then undertook\
    \ an experiment that gathered data which we analyzed: the experiment was designed\
    \ to make us process data in ways that could be compared to AI.\n\nThe key takeout\
    \ is that AI is a tool which can be added to human intellect to achieve outcomes\
    \ a human could not on their own. Conversely without a human intellect to drive\
    \ it, most AI services are as relevant as the sound a tree makes when it falls\
    \ where no one can hear it.\n\nWe have no evidence yet that AI can help us become\
    \ better data scientists, but it clearly has the potential to. It is time to use\
    \ it.\n\nFootnotes [1](#486852_1_En_10_Chapter.xhtml#Fn1_source) [2](#486852_1_En_10_Chapter.xhtml#Fn2_source)\
    \ [3](#486852_1_En_10_Chapter.xhtml#Fn3_source)\n\n# 11. Using ML Services\n\n\
    In **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml) we saw how to connect our\
    \ micro:bit weather station to an IoT platform for the purpose of enhancing our\
    \ data science toolkit. In **Chapter** [**10**](#486852_1_En_10_Chapter.xhtml)\
    \ we considered the potential value that AI/ML can bring to our data science experimentation,\
    \ how it can liberate us from elements of the process and allow us to maximize\
    \ the time available to exercise our curiosity and intuition – the irreplaceable\
    \ human traits that are the true brains of data science.\n\nIn this chapter we\
    \ will bring both of these together and look at how an online and free-to-use\
    \ ML service can be added to our growing weather station project: we are going\
    \ to build a genuine \"artificial intelligence powered predictive weather station.\"\
    \n\n## 11.1 Defining Our IoT Application\n\nWhat is an \"Artificial intelligence\
    \ powered predictive weather station\"? What exactly are we going to build? The\
    \ requirements are simple to describe:\n\n1. It includes an edge device: a micro:bit\
    \ recording temperature and humidity data and sending it to an IoT platform.\n\
    \n2. It will use AI (ML specifically) to analyze that data and make predictions\
    \ about the likelihood of rain based on it.\n\n3. Predictions will be shown on\
    \ the micro:bit 5x5 LED display.\n\nWe are familiar by now with items 1 and 3\
    \ in the list; in this chapter we will focus on 2: how to integrate an ML service\
    \ into our weather station. The process is nontrivial: we are going to have to\
    \ build an **IoT application**.\n\nThe term **IoT application** is used in this\
    \ chapter to collectively describe all the different IoT services that we set\
    \ up and use and the functionality that they jointly provide. It is appropriate\
    \ to call it an application: what we are doing is using a range of modules (\"\
    services\") and configuring them to deliver an outcome. This is similar to using\
    \ several different blocks of code together to make a program, or connecting a\
    \ few electronic components together to make a digital instrument. In many respects\
    \ the weather prediction example we are building here is the Hello World! of ML\
    \ in physical computing.\n\nThis chapter focuses on building the IoT application.\
    \ The edge device that we build – our weather station instrument – is covered\
    \ in **Chapter** [**12**](#486852_1_En_12_Chapter.xhtml). It is useful to remember\
    \ that you could send data to the IoT application from any viable source, not\
    \ just the one we will build in the next chapter.\n\n## 11.2 Choosing an IoT Service\
    \ Provider\n\nA fundamental component of the IoT application we are building is\
    \ the ML engine that will power our predictive model. Before we can start building\
    \ our application we need to find a suitable ML service to use.\n\nWe will use\
    \ Microsoft Azure. We chose to use Azure, rather than extend the IBM IoT Platform\
    \ we built in **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml), for a number\
    \ of reasons:\n\n1. Variety. Knowing how to use two of the leading IoT service\
    \ providers is better than just one. And perhaps one is blocked or doesn't work\
    \ for you.\n\n2. Setting up an IoT platform is slightly different for each provider.\
    \ Once you have set up both an IBM and an Azure platform, you should have more\
    \ confidence setting up any IoT platform.\n\n3. Through Azure we can access a\
    \ broad and growing range of services to add to our toolkit.\n\n   Once you have\
    \ worked through this chapter, we encourage you to go back to your IBM IoT Platform\
    \ and look at how that can be integrated with the IBM Watson AI services.\n\n\
    The process of setting Azure up is quite long and onerous, but once complete you\
    \ can reuse most of the functionality and switch out bits like the data you send\
    \ and the ML service you use. Although we focus on the weather station, you should\
    \ be able to use the same process to integrate different edge devices with a broad\
    \ range of the ML services available through Azure.\n\n## 11.3 Setting Up Microsoft\
    \ Azure: Cloud Computing Services\n\nThe first thing you need is an **Azure**\
    \ subscription; if you don't have one, you should be able to create a **free 30-day**\
    \ account which will grant you access to all the services used here.\n\nThere\
    \ are two steps to get things started:\n\n1. Set up a Microsoft Azure account:\
    \ search online for \"set up an Azure account\" to find out how to set one up\
    \ where you are located.\n\n2. Once you have set up your Azure account, ensure\
    \ you have access to Azure Machine Learning Studio (`https://studio.azureml.net/`)."
  raw: "## 10.11 Summary\n\nIn this chapter we looked at intelligence, both artificial\
    \ and real, and learned what lies at the core of AI and ML. We then undertook\
    \ an experiment that gathered data which we analyzed: the experiment was designed\
    \ to make us process data in ways that could be compared to AI.\n\nThe key takeout\
    \ is that AI is a tool which can be added to human intellect to achieve outcomes\
    \ a human could not on their own. Conversely without a human intellect to drive\
    \ it, most AI services are as relevant as the sound a tree makes when it falls\
    \ where no one can hear it.\n\nWe have no evidence yet that AI can help us become\
    \ better data scientists, but it clearly has the potential to. It is time to use\
    \ it.\n\nFootnotes [1](#486852_1_En_10_Chapter.xhtml#Fn1_source)   [2](#486852_1_En_10_Chapter.xhtml#Fn2_source)\
    \   [3](#486852_1_En_10_Chapter.xhtml#Fn3_source)\n\n# 11. Using ML Services\n\
    \nIn **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml) we saw how to connect our\
    \ micro:bit weather station to an IoT platform for the purpose of enhancing our\
    \ data science toolkit. In **Chapter** [**10**](#486852_1_En_10_Chapter.xhtml)\
    \ we considered the potential value that AI/ML can bring to our data science experimentation,\
    \ how it can liberate us from elements of the process and allow us to maximize\
    \ the time available to exercise our curiosity and intuition – the irreplaceable\
    \ human traits that are the true brains of data science.\n\nIn this chapter we\
    \ will bring both of these together and look at how an online and free-to-use\
    \ ML service can be added to our growing weather station project: we are going\
    \ to build a genuine “artificial intelligence powered predictive weather station.”\n\
    \n## 11.1 Defining Our IoT Application\n\nWhat is an “Artificial intelligence\
    \ powered predictive weather station”? What exactly are we going to build? The\
    \ requirements are simple to describe:\n\n1.  It includes an edge device: a micro:bit\
    \ recording temperature and humidity data and sending it to an IoT platform.\n\
    \n2.  It will use AI (ML specifically) to analyze that data and make predictions\
    \ about the likelihood of rain based on it.\n\n3.  Predictions will be shown on\
    \ the micro:bit 5x5 LED display.\n\nWe are familiar by now with items 1 and 3\
    \ in the list; in this chapter we will focus on 2: how to integrate an ML service\
    \ into our weather station. The process is nontrivial: we are going to have to\
    \ build an **IoT application**.\n\nThe term **IoT application** is used in this\
    \ chapter to collectively describe all the different IoT services that we set\
    \ up and use and the functionality that they jointly provide. It is appropriate\
    \ to call it an application: what we are doing is using a range of modules (“services”)\
    \ and configuring them to deliver an outcome. This is similar to using several\
    \ different blocks of code together to make a program, or connecting a few electronic\
    \ components together to make a digital instrument. In many respects the weather\
    \ prediction example we are building here is the Hello World! of ML in physical\
    \ computing.\n\nThis chapter focuses on building the IoT application. The edge\
    \ device that we build – our weather station instrument – is covered in **Chapter**\
    \ [**12**](#486852_1_En_12_Chapter.xhtml). It is useful to remember that you could\
    \ send data to the IoT application from any viable source, not just the one we\
    \ will build in the next chapter.\n\n## 11.2 Choosing an IoT Service Provider\n\
    \nA fundamental component of the IoT application we are building is the ML engine\
    \ that will power our predictive model. Before we can start building our application\
    \ we need to find a suitable ML service to use.\n\nWe will use Microsoft Azure.\
    \ We chose to use Azure, rather than extend the IBM IoT Platform we built in **Chapter**\
    \ [**9**](#486852_1_En_9_Chapter.xhtml), for a number of reasons:\n\n1.  Variety.\
    \ Knowing how to use two of the leading IoT service providers is better than just\
    \ one. And perhaps one is blocked or doesn’t work for you.\n\n2.  Setting up an\
    \ IoT platform is slightly different for each provider. Once you have set up both\
    \ an IBM and an Azure platform, you should have more confidence setting up any\
    \ IoT platform.\n\n3.  Through Azure we can access a broad and growing range of\
    \ services to add to our toolkit.\n\n    Once you have worked through this chapter,\
    \ we encourage you to go back to your IBM IoT Platform and look at how that can\
    \ be integrated with the IBM Watson AI services.\n\nThe process of setting Azure\
    \ up is quite long and onerous, but once complete you can reuse most of the functionality\
    \ and switch out bits like the data you send and the ML service you use. Although\
    \ we focus on the weather station, you should be able to use the same process\
    \ to integrate different edge devices with a broad range of the ML services available\
    \ through Azure.\n\n## 11.3 Setting Up Microsoft Azure: Cloud Computing Services\n\
    \nThe first thing you need is an **Azure** subscription; if you don't have one,\
    \ you should be able to create a **free 30-day** account which will grant you\
    \ access to all the services used here.\n\nThere are two steps to get things started:\n\
    \n1.  Set up a Microsoft Azure account: search online for “set up an Azure account”\
    \ to find out how to set one up where you are located.\n\n2.  Once you have set\
    \ up your Azure account, ensure you have access to Azure Machine Learning Studio\
    \ ([`https://studio.azureml.net/`](https://studio.azureml.net/))."
  trans: "\n# 10.11 总结\n\n在本章中，我们探讨了智能，包括人工智能和真实智能，并了解了人工智能和机器学习的核心所在。随后我们进行了一项实验，收集了数据并对其进行了分析：该实验旨在让我们以可与人工智能对比的方式处理数据。\n\
    \n关键收获在于，人工智能是一种可以增强人类智力的工具，能够实现人类无法独自完成的结果。反之，如果没有人类智力驱动，大多数人工智能服务就如同树倒于无人之境，其声响无人听闻一般，毫无意义。\n\
    \n目前尚无证据表明人工智能能帮助我们成为更优秀的数据科学家，但它显然具备这种潜力。是时候利用它了。\n\n脚注 1 2 3\n\n# 11. 使用机器学习服务\n\
    \n在第**9**章中，我们了解了如何将我们的 micro:bit 气象站连接到 IoT 平台，以增强我们的数据科学工具集。在第**10**章中，我们探讨了人工智能/机器学习为数据科学实验带来的潜在价值，以及它如何将我们从某些流程中解放出来，让我们能够最大限度地利用时间来发挥好奇心和直觉——这些不可替代的人类特质才是数据科学真正的智慧所在。\n\
    \n在本章中，我们将把两者结合起来，探讨如何将一项在线且免费使用的机器学习服务添加到我们不断发展的气象站项目中：我们将构建一个真正的“人工智能驱动的预测性气象站”。\n\
    \n## 11.1 定义我们的物联网应用\n\n什么是“人工智能驱动的预测性气象站”？我们究竟要构建什么？需求描述很简单：\n\n1. 包含一个边缘设备：一个\
    \ micro:bit 记录温度和湿度数据，并将其发送到 IoT 平台。\n2. 它将使用人工智能（特别是机器学习）来分析这些数据，并据此预测降雨的可能性。\n\
    3. 预测结果将显示在 micro:bit 的 5x5 LED 显示屏上。\n\n到目前为止，我们对列表中的第 1 项和第 3 项已经熟悉；本章我们将重点放在第\
    \ 2 项：如何将机器学习服务集成到我们的气象站中。这个过程并不简单：我们将需要构建一个**物联网应用程序**。\n\n本章中使用的术语**物联网应用程序**，是指我们设置和使用的所有不同\
    \ IoT 服务及其联合提供的功能的统称。将其称为应用程序是恰当的：我们所做的是使用一系列模块（“服务”），并配置它们以实现某个结果。这类似于将几个不同的代码块组合在一起制作一个程序，或者将几个电子元件连接起来制作一个数字仪器。在许多方面，我们在此构建的天气预报示例，就是物理计算中机器学习的\
    \ Hello World！\n\n本章重点在于构建物联网应用程序。我们构建的边缘设备——即我们的气象站仪器——将在第**12**章中介绍。值得记住的是，你可以从任何可行的来源向物联网应用程序发送数据，而不仅仅是我们将在下一章中构建的那个来源。\n\
    \n## 11.2 选择物联网服务提供商\n\n我们正在构建的物联网应用程序的一个基本组件，是驱动我们预测模型的机器学习引擎。在开始构建应用程序之前，我们需要找到一个合适的机器学习服务。\n\
    \n我们将使用 Microsoft Azure。我们选择使用 Azure，而不是扩展我们在第**9**章中构建的 IBM IoT 平台，原因如下：\n\n\
    1. 多样性。了解如何使用两个领先的 IoT 服务提供商比只知道一个要好。而且，也许其中一个服务提供商被屏蔽或对你来说无法使用。\n2. 每个提供商设置 IoT\
    \ 平台的方式略有不同。一旦你同时设置好了 IBM 和 Azure 平台，你在设置任何 IoT 平台时都应该更有信心。\n3. 通过 Azure，我们可以访问广泛且不断增长的服务范围，以添加到我们的工具集中。\n\
    \n   完成本章内容后，我们鼓励你回到 IBM IoT 平台，研究一下如何将其与 IBM Watson 人工智能服务集成。\n\n设置 Azure 的过程相当冗长繁琐，但一旦完成，你就可以重用大部分功能，并更换其中的部分内容，比如发送的数据和你使用的机器学习服务。虽然我们专注于气象站，但你应该能够使用相同的过程，将不同的边缘设备与\
    \ Azure 提供的广泛机器学习服务集成起来。\n\n## 11.3 设置 Microsoft Azure：云计算服务\n\n你首先需要的是一个 **Azure**\
    \ 订阅；如果你没有，你应该能够创建一个 **30 天免费** 账户，该账户将允许你访问此处使用的所有服务。\n\n要开始使用，需要两个步骤：\n\n1.\
    \ 设置一个 Microsoft Azure 账户：在线搜索“设置 Azure 账户”，了解如何在你的所在地设置一个账户。\n2. 设置好 Azure 账户后，确保你能访问\
    \ Azure Machine Learning Studio（`https://studio.azureml.net/`）。\n"
- fmt: '# 11.4 Creating an IoT Hub Using Azure Portal


    This section describes how to create an `IoT hub` using the Azure portal.


    An `IoT hub` is the name given to a service that links the edge devices (in this
    case our weather station, but we could have multiple devices) with the IoT application.
    It controls access of the devices to the IoT application.


    To set up the hub, you will need to do the following:


    | **Subscription:** | Select the subscription to use for your hub (e.g., *Pay-As-You-Go*).
    |

    | --- | --- |

    | **Resource Group:** | Select **Create new** and fill in the name you want to
    use (e.g., *iot-hubs*), and then select **OK**. |

    | **Region:** | Select the region from the list in which you want your hub to
    be located. Select the location closest to you, but if your area is not available,
    use the default shown. |

    | **IoT hub Name:** | Enter a name for your hub (e.g., *your-iot-hub*). This name
    must be globally unique. If the name you enter is available, a green checkmark
    appears. To keep the uniqueness, we used the ISBN-13 number of this book which
    is 978-1484243565. |


    - Sign in to the Azure portal (`https://portal.azure.com/`).

    - From the Azure home page, select the **+ Create a resource** button.

    - Enter **IoT hub** in the **Search the Marketplace** field.

    - In the **Marketplace** page, select **IoT hub** from the search results.

    - In the **IoT hub** page, select **Create**.

    - On the **Basics** tab, complete the fields as follows:


    | **Pricing and scale tier:** | Choose F1: Free tier*NOTE: Free IoT hubs are limited
    to one per subscription.* |

    | --- | --- |

    | **IoT Hub units:** | 1 |

    | **Azure Security Center:** | Off |

    | **Advanced Settings > Device-to-cloud partitions:** | Keep the default value
    4 |


    - Once completed, your **Basics** tab should look something like this (**Figure**
    [**11-1**](#486852_1_En_11_Chapter.xhtml#Fig1)).


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig1_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig1_HTML.jpg)


    Figure 11-1


    Configuring the Basics tab


    - Select **Next: Size and scale** to continue creating your hub. On the **Size
    and scale** tab, complete the fields as follows:


    Once completed, your **Size and scale** tab should look something like this (**Figure**
    [**11-2**](#486852_1_En_11_Chapter.xhtml#Fig2)).


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig2_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig2_HTML.jpg)


    Figure 11-2


    Configuring the Size and scale tab


    | **Name:** | department |

    | --- | --- |

    | **Value:** | data science |


    - Select **Next: Tags** to continue creating your hub. On the **Tags** tab, complete
    the fields as follows:


    - Once completed, your **Tags** tab should look something like this (**Figure**
    [**11-3**](#486852_1_En_11_Chapter.xhtml#Fig3)).


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig3_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig3_HTML.jpg)


    Figure 11-3


    Configuring the Tags tab


    - Select **Next: Review + create** to continue creating your hub. Your **Review
    + create** tab should look something like this (**Figure** [**11-4**](#486852_1_En_11_Chapter.xhtml#Fig4)).


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig4_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig4_HTML.jpg)


    Figure 11-4


    Review + create tab


    - Select **Create** to create your new hub. Creating the hub may take a few minutes.


    After creating the IoT hub we''ll delve into the Azure Machine Learning Studio
    and will set up an Azure Logic App. You will need to provide the name of the `IoT
    hub` and the `Resource group` when you create the Logic App, so make sure you
    have these details available.


    ## 11.5 Setting Up a Weather Prediction Model in Azure Machine Learning Studio


    To use a weather prediction model we first choose one: there are several options
    available. Then we have to import the chosen "weather prediction experiment" into
    our Azure Machine Learning Studio project:


    - Open ML Studio – check that you are signed in.

    - In a separate tab in the same browser, go to this URL (`https://gallery.azure.ai/Experiment/Weather-prediction-model-1`)
    to locate the weather prediction AI "experiment" that we use. *There are several
    available that you could also try, as well as loads of other experiments to play
    with.*


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig5_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig5_HTML.jpg)


    Figure 11-5


    Azure AI Gallery experiment: Weather prediction model


    - Click **Open in Studio**. A modal window will then pop up prompting you to choose
    a region: leave the default option and click the tick to continue.

    - Once the experiment has imported, the ML Studio interface should look something
    like this (**Figure** [**11-6**](#486852_1_En_11_Chapter.xhtml#Fig6)).


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig6_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig6_HTML.jpg)


    Figure 11-6


    Weather prediction model


    - Click **RUN** (in the menu at the bottom of the screen) to validate the steps.

    - As each step in the process runs, it also validates, and you will see a green
    tick get added as each validates successfully. There shouldn''t be any errors.
    It should stop running once all steps have been validated – it may take a minute
    or so.

    - Click **SETUP WEB SERVICE ➤ Predictive Web Service.** This can be found in the
    bottom menu next to **RUN**.


    > **Note**

    > The SETUP WEB SERVICE option won''t be selectable unless the system has run
    all the way through the validation process in the previous step. When complete,
    all the steps should show little green ticks.


    - After you click to set up the web service, your view updates as a new version
    of the model is generated: the **Predictive Experiment**, which is what we will
    use. Once complete there should be two tabs: Training Experiment and Predictive
    Experiment.

    - We are going to **MOVE** the **Web services input** block. This block tells
    the experiment where to inject the data from the web service (i.e., from our weather
    station instrument) into the model.

    - Click the line joining **Web services input** to **Weather Dataset** (click
    where it joins the **Web services input** block) – this will disconnect them.

    - Now connect the line to the **Score Model** block as shown in **Figure** [**11-7**](#486852_1_En_11_Chapter.xhtml#Fig7).


