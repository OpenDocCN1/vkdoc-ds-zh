  trans: '

    # 7.1 什么是蓝牙？


    从本质上讲，两个微处理器之间的无线通信是一个相对简单的概念。其工作原理如下：


    1.  取两个微处理器，并为每个微处理器添加一个短距离无线电发射器。

    2.  这些微处理器可以被编程来发送和接收无线电信号。

    3.  因此，我们可以对其中一个微处理器进行编程，使其在特定频率上发送特定信号。

    4.  我们可以对另一个微处理器进行编程，使其监听相同的特定频率，并在接收到特定信号时做出反应。

    5.  这样，我们的两个微处理器就实现了无线通信。


    蓝牙是一套管理无线通信的规则和程序：它是一个人们同意遵循的标准。它定义了该过程的五个组成部分如何实现：第一个处理器如何将数据转换为特定信号？使用什么频率？第二个处理器如何知道该消息来自第一个处理器，而不是来自恶意的第三个处理器？


    当人类进行无线通信（即，交谈）时，我们使用口头语言。我们说出的话语传达含义，其他因素也同样如此，例如，我们如何强调词语、选择哪些词语以及说话的音量。我们不仅交流思想，也交流情感。为了让其他人理解我们所传达的所有深层含义和层次，他们需要理解我们使用的口头语言，以及支配这些细微差别的“规则”。我们话语形成的声音波就像无线电信号，而其他一切就像蓝牙标准。


    在我们的数据科学之旅中，深入理解蓝牙标准并不特别相关，因此我们将在需要使用时挑选出所需的关键特性。现在只需知道蓝牙是管理无线通信的一种标准方式，并且：


    *   这套标准/规则列表是由人们编写并由人们维护的。

    *   通过拥有一个已商定的标准，不同的制造商可以构建相互兼容的“蓝牙”设备。

    *   蓝牙技术联盟（`SIG`）确保蓝牙规范得到维护、推广、保护，并在必要时进行更新。他们使其与不断变化的技术格局保持相关性。

    *   如果某个设备遵循了标准中规定的所有规则，那么将其称为“`支持蓝牙的设备`”是合理的。


    ## 7.2 为什么要使用蓝牙？


    我们调查蓝牙适用性的最有力理由是，BBC micro:bit 内置了`低功耗蓝牙`（`BLE`）天线，如图 7-1 所示。`BLE` 是蓝牙的一个版本，其设计旨在非常经济地使用电量。


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig1_HTML.jpg](img/486852_1_En_7_Fig1_HTML.jpg)


    图 7-1 micro:bit 背面，`BLE` 天线已圈出


    如果板载的 `BLE` 能够满足我们在第 6 章中确定的需求，那么我们的拼图最后一块就位了，我们可以将云服务和物联网添加到我们的数据科学工具包中。


    ## 7.3 在 micro:bit 上使用 BLE


    我们使用无线通信的主要目标是收集我们的数据，然后将其传输到更合适的位置：可能传输到像 `Excel` 这样的程序，或者传输到 5000 英里外的服务器，甚至可能传输到人工智能服务。很简单！


    当你们听到并非如此简单时，应该不会感到惊讶：在 micro:bit 上使用 `BLE` 能做的事情有一些限制：


    *   无法选择在 `MicroPython` 中使用 `BLE`。

    *   在 `MakeCode` 中，最稳定的 `BLE` 实现是使用 `UART` 线缆——也就是说，它不是无线的。


    尽管存在这些限制，在追求数据科学的过程中，我们仍然有多种方式可以利用 `BLE`，但我们需要首先了解一些有关 `BLE` 如何处理数据的知识：


    *   `BLE` 规范要求 `BLE` 设备拥有一个`配置文件`，该文件包含关于设备及其能够提供的数据（称为`服务`）的信息。

    *   micro:bit 有一个`配置文件`，定义了它将根据请求共享的数据（即，它提供的`服务`），包括来自加速度计、磁力计、板载温度传感器、按钮以及一些其他组件的数据。

    *   当另一个`支持 BLE 的`设备与 micro:bit `配对`^(¹¹)时，两者都会共享其配置文件，并且各自都可以访问对方提供的数据服务。

    *   术语`任意数据`指的是未包含在配置文件中的任何数据。如果我们向 micro:bit 添加一个外设，例如气象站或 `CO2` 监测器，来自该外设的数据就是任意数据，并且不能作为一项服务提供。


    我们的范围比 micro:bit 原生提供的数据更广泛。我们可能今天想测量天气，明天想测量 `CO2` 水平，后天想测量土壤酸度。对于仅使用加速度计和/或磁力计数据的实验，micro:bit
    和 `BLE` 是一个很棒的组合，但对于其他所有情况，我们将需要另一种解决方案。


    不过，有一些巧妙的 `BLE` 使用方法可能对我们有价值，例如，基于 `MakeCode` 的 `Bluetooth UART` 允许我们将`任意`数据传输到连接的智能设备上；我们将在第
    7.4 节中对此进行探讨。还有其他一些使用 `USB` 线缆的实现也相当稳定。但是，对于任何需要 micro:bit 通过 `USB` 线缆连接到计算机的用例，第
    6 章中提到的 `Excel Data Streamer` 是难以超越的。


    ## 7.4 使用蓝牙 UART 构建 BLE 气象站


    我们将重建气象站，使其利用 `Bluetooth UART`：我们将数据从 micro:bit 直接传送到智能设备。


    图 7-2 展示了一个支持 `BLE` 的数字气象站仪器的模块电路图。


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig2_HTML.jpg](img/486852_1_En_7_Fig2_HTML.jpg)


    图 7-2 支持 `BLE` 的数字气象站电路图


    表 7-1 列出了我们将用于构建蓝牙气象站工具的硬件。


    **表 7-1** 蓝牙气象站工具的硬件需求


    | 你需要什么 | 我们使用的物品 | 数量 | 替代方案 |

    | --- | --- | --- | --- |

    | 微处理器及向其烧录代码的方法 | micro:bit | 1 | `Adafruit Feather 32u4 Bluefruit LE` |

    | 电源 | 带 `JST` 连接器的 `2xAAA` 电池盒 | 1 | 锂聚合物电池 – 3.7v |

    | 读取天气数据的传感器 | `XinaBox SW01` | 1 | `Adafruit BME280 I2C` 或 `SPI 温度` `湿度压力传感器`
    |

    | 向应用程序发送天气数据的蓝牙无线电 | micro:bit 内置蓝牙无线电 | 1 | `Adafruit Bluefruit LE Shield` |

    | 将所有部件连接起来的方法 | `XinaBox IM01` micro:bit 桥接器和 `xBus` 连接器 | 11 | 连接线 |


    选择合适的工具，并按照图 7-3 所示组装部件。


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig3_HTML.jpg](img/486852_1_En_7_Fig3_HTML.jpg)


    图 7-3 使用 micro:bit 内置蓝牙无线电的气象站

