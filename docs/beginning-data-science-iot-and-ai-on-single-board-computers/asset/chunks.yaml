- fmt: '# Introducing Data Science


    A new day dawns. The alarm clock goes off and you leap out of bed, ready to face
    the world. You scan the weather report, settle on some clothes, grab a bite of
    breakfast – maybe cereal with milk. You might check a traffic update and then
    plan your route to school or work accordingly.


    By the time your day has started you have already interacted with loads of different
    types of data – the time, the weather report, traffic updates, sports results
    and even the “right” amount of milk for the volume of cereal you poured. All driven
    by data. Data is such a normal part of our daily interaction with the world that
    we often do not give it a second thought. We are voracious consumers of data!


    Where does all this data come from? If we are the consumers, who are the producers,
    and how do they do it? Where are the data factories? Why should we believe some
    data and not others, and how can we get smarter in how we use the data we are
    inundated with? Understanding how to read and take advantage of data is a key
    skill in today’s data-driven society.


    ## Introducing Data Science


    The longest journey begins with a single step. By the end of this book you will
    have a broad and solid grounding in the concepts that underlie theoretical and
    applied data science, but the first step is to ensure that this destination is
    clearly defined. What is “data science”?


    The exact definition of data science is debated. We’ll use the broadest possible
    definition and say that


    *Data science encompasses the activities associated with collecting, analyzing,
    interpreting, and acting on data.*


    If you count the number of eggs left in your fridge and work out which day of
    the week you will need to buy more, then you have performed an act of data science.
    Or if you estimate how many chocolate puddings are left in the canteen and how
    many people are ahead of you in the queue, then infer the likelihood of there
    being any left when you get to the front… again, data science! Even the activity
    of a teacher calling register in the morning form class, then again in the afternoon,
    and comparing the results has all the hallmarks of basic data science.


    It is worth noting here that many people define data science more tightly and
    focus it on the analysis of data; most people who are identified as “data scientists”
    work primarily in the field of data analysis. For example, the textbook for data
    science at the University of Berkeley^([¹](#fn1)) tells us that data science “is
    about drawing useful conclusions from large and diverse data sets through exploration,
    prediction, and inference.” It does not refer to the process of gathering those
    data sets or look in detail about how to use the data for anything besides making
    predictions. The definition we have adopted earlier does not contradict Berkeley
    or any commentator who would argue that data science is focused on data analysis.
    In this book we take a holistic overview and look at the activities that lead
    up to the analysis of data. You will see how the process of gathering data impacts
    on its analysis: how the experimental design introduces biases and factors that
    need to be understood and catered for. This book will show you that every element
    of the process is linked and that understanding the process will enrich your analysis.


    In simple terms, data science is the process of converting **data** into **information**.
    The words **data** and **information** have formal meanings that are quite distinct.
    We’ll illustrate these in **Table** [**1-1**](#486852_1_En_1_Chapter.xhtml#Tab1).


    **Table 1-1** Highlighting the differences between data and information


    |   | Data | Information |

    |---|------|-------------|

    | 1 | **Data** is the ingredients of a cake, the eggs, sugar, milk, etc. | **Information**
    is a slice of the cake. |

    | 2 | If you ask 100 people whether they believe in climate change, you will have
    100 units of **data**. | The statement “99% of people believe climate change needs
    to be addressed” is **information**. |

    | 3 | **Data** is gathered or collected. | **Information** comes from analyzing
    data. |

    | 4 | A **data** reading describes the state of something. | **Information** is
    a “fact” about something. |


    ## Using Temperature


    One of the most common data measures, and one that we come into contact with daily,
    is temperature.


    We usually have an idea of what the temperature is today, even if we haven’t checked
    a weather report. We use temperature measures to cook our food and to maintain
    the air in our homes and workplaces at a comfortable level. When people are poorly
    we take their body temperature and when the temperature in an engine gets too
    hot we know there is something wrong.


    We use temperature in this chapter because the reader will have an intuitive understanding
    of it: we don’t need to try and explain what temperature is. But the concepts
    that we’ll discuss, in this chapter and throughout the book, can be applied to
    any set of data: perhaps your data of choice is social media likes or stock market
    indicators, maybe sports results and leagues, or virus counts in blood cells,
    or the chilli heat of curry from your favorite curry shop. The principles of data
    science apply equally to all manner of data.


    ## Measuring Temperature


    Most humans (but not all) can sense temperature: we can feel the sun beating down
    on us in summer and our senses tell us the dangers of extreme hot and cold. We
    have a very rich subjective experience of the temperature and quite often strong
    opinions about it.


    The first tool that measured temperature objectively was invented by Daniel Gabriel
    Fahrenheit in 1714. His mercury-based thermometer works from a very simple principle,
    which is shown in **Figure** [**1-1**](#486852_1_En_1_Chapter.xhtml#Fig1).


    ![../images/486852_1_En_1_Chapter/486852_1_En_1_Fig1_HTML.jpg](images/486852_1_En_1_Chapter/486852_1_En_1_Fig1_HTML.jpg)


    **Figure 1-1** Mercury in a closed glass container reacts to temperature


    **Warning**


    There are other ways to make thermometers – you can even build one yourself with
    water and food coloring. Mercury is especially effective but it is also a harmful
    element that has a toxic effect, both on humans and on the environment. Thermometers
    that use mercury are banned in places like hospitals and schools in many countries
    around the world. The danger to humans comes from breathing in mercury vapors,
    so if a mercury thermometer breaks you will need to take great care in how you
    deal with it. Alcohol is the most common alternative to mercury, but the principle
    of how the thermometer works is the same whatever substance we put inside it.


    When DG Fahrenheit invented the thermometer he also introduced a standard scale
    – Fahrenheit – which was widely used at the time and still is today. Alternative
    scales have been introduced since, with Celsius/Centigrade and Kelvin the most
    common and preferred by data scientists.


    To undertake the exercises in this chapter you need to acquire one or more thermometers
    – ideally analog ones, but any kind will do. We will use the Celsius scale, where
    0 degrees is the freezing point of water and 100 degrees the temperature at which
    it boils.'
  raw: '# 1. Introducing Data Science


    A new day dawns. The alarm clock goes off and you leap out of bed, ready to face
    the world. You scan the weather report, settle on some clothes, grab a bite of
    breakfast – maybe cereal with milk. You might check a traffic update and then
    plan your route to school or work accordingly.


    By the time your day has started you have already interacted with loads of different
    types of data – the time, the weather report, traffic updates, sports results
    and even the “right” amount of milk for the volume of cereal you poured. All driven
    by data. Data is such a normal part of our daily interaction with the world that
    we often do not give it a second thought. We are voracious consumers of data!


    Where does all this data come from? If we are the consumers, who are the producers,
    and how do they do it? Where are the data factories? Why should we believe some
    data and not others, and how can we get smarter in how we use the data we are
    inundated with? Understanding how to read and take advantage of data is a key
    skill in today’s data-driven society.


    ## 1.1 Introducing Data Science


    The longest journey begins with a single step. By the end of this book you will
    have a broad and solid grounding in the concepts that underlie theoretical and
    applied data science, but the first step is to ensure that this destination is
    clearly defined. What is “data science”?


    The exact definition of data science is debated. We’ll use the broadest possible
    definition and say that


    *Data science encompasses the activities associated with collecting, analyzing,
    interpreting, and acting on data.*


    If you count the number of eggs left in your fridge and work out which day of
    the week you will need to buy more, then you have performed an act of data science.
    Or if you estimate how many chocolate puddings are left in the canteen and how
    many people are ahead of you in the queue, then infer the likelihood of there
    being any left when you get to the front… again, data science! Even the activity
    of a teacher calling register in the morning form class, then again in the afternoon,
    and comparing the results has all the hallmarks of basic data science.


    It is worth noting here that many people define data science more tightly and
    focus it on the analysis of data; most people who are identified as “data scientists”
    work primarily in the field of data analysis. For example, the textbook for data
    science at the University of Berkeley^([¹](#fn1)) tells us that data science “is
    about drawing useful conclusions from large and diverse data sets through exploration,
    prediction, and inference.” It does not refer to the process of gathering those
    data sets or look in detail about how to use the data for anything besides making
    predictions. The definition we have adopted earlier does not contradict Berkeley
    or any commentator who would argue that data science is focused on data analysis.
    In this book we take a holistic overview and look at the activities that lead
    up to the analysis of data. You will see how the process of gathering data impacts
    on its analysis: how the experimental design introduces biases and factors that
    need to be understood and catered for. This book will show you that every element
    of the process is linked and that understanding the process will enrich your analysis.


    In simple terms, data science is the process of converting **data** into **information**.
    The words **data** and **information** have formal meanings that are quite distinct.
    We’ll illustrate these in **Table** [**1-1**](#486852_1_En_1_Chapter.xhtml#Tab1).


    Table 1-1


    Highlighting the differences between data and information


    |   | Data | Information |

    | --- | --- | --- |

    | 1 | **Data** is the ingredients of a cake, the eggs, sugar, milk, etc. | **Information**
    is a slice of the cake. |

    | 2 | If you ask 100 people whether they believe in climate change, you will have
    100 units of **data**. | The statement “99% of people believe climate change needs
    to be addressed” is **information**. |

    | 3 | **Data** is gathered or collected. | **Information** comes from analyzing
    data. |

    | 4 | A **data** reading describes the state of something. | **Information** is
    a “fact” about something. |


    ## 1.2 Using Temperature


    One of the most common data measures, and one that we come into contact with daily,
    is temperature.


    We usually have an idea of what the temperature is today, even if we haven’t checked
    a weather report. We use temperature measures to cook our food and to maintain
    the air in our homes and workplaces at a comfortable level. When people are poorly
    we take their body temperature and when the temperature in an engine gets too
    hot we know there is something wrong.


    We use temperature in this chapter because the reader will have an intuitive understanding
    of it: we don’t need to try and explain what temperature is. But the concepts
    that we’ll discuss, in this chapter and throughout the book, can be applied to
    any set of data: perhaps your data of choice is social media likes or stock market
    indicators, maybe sports results and leagues, or virus counts in blood cells,
    or the chilli heat of curry from your favorite curry shop. The principles of data
    science apply equally to all manner of data.


    ## 1.3 Measuring Temperature


    Most humans (but not all) can sense temperature: we can feel the sun beating down
    on us in summer and our senses tell us the dangers of extreme hot and cold. We
    have a very rich subjective experience of the temperature and quite often strong
    opinions about it.


    The first tool that measured temperature objectively was invented by Daniel Gabriel
    Fahrenheit in 1714\. His mercury-based thermometer works from a very simple principle,
    which is shown in **Figure** [**1-1**](#486852_1_En_1_Chapter.xhtml#Fig1).


    ![../images/486852_1_En_1_Chapter/486852_1_En_1_Fig1_HTML.jpg](images/486852_1_En_1_Chapter/486852_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Mercury in a closed glass container reacts to temperature


    Warning


    There are other ways to make thermometers – you can even build one yourself with
    water and food coloring. Mercury is especially effective but it is also a harmful
    element that has a toxic effect, both on humans and on the environment. Thermometers
    that use mercury are banned in places like hospitals and schools in many countries
    around the world. The danger to humans comes from breathing in mercury vapors,
    so if a mercury thermometer breaks you will need to take great care in how you
    deal with it. Alcohol is the most common alternative to mercury, but the principle
    of how the thermometer works is the same whatever substance we put inside it.


    When DG Fahrenheit invented the thermometer he also introduced a standard scale –
    Fahrenheit – which was widely used at the time and still is today. Alternative
    scales have been introduced since, with Celsius/Centigrade and Kelvin the most
    common and preferred by data scientists.


    To undertake the exercises in this chapter you need to acquire one or more thermometers –
    ideally analog ones, but any kind will do. We will use the Celsius scale, where
    0 degrees is the freezing point of water and 100 degrees the temperature at which
    it boils.'
  trans: '好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。



    # 数据科学导论


    新的一天开始了。闹钟响起，你一跃而起，准备迎接这个世界。你浏览一下天气预报，选好要穿的衣服，匆忙吃几口早餐——也许是泡着牛奶的麦片。你可能会查看一下交通状况，然后相应地规划好去学校或上班的路线。


    在你的一天开始之前，你已经与各种不同类型的数据打了交道——时间、天气预报、交通信息、体育赛事结果，甚至是你倒的麦片所需要的“适量”牛奶。所有这一切都由数据驱动。数据已经成为我们日常与世界互动的如此正常的一部分，以至于我们常常对其熟视无睹。我们是贪婪的数据消费者！


    所有这些数据从何而来？如果我们是消费者，那谁是生产者，他们又是如何生产的？数据工厂在哪里？为什么我们应该相信某些数据而不相信其他数据？我们如何才能在使用这些应接不暇的数据时变得更明智？理解如何解读和利用数据，是当今数据驱动社会中的一项关键技能。


    ## 数据科学导论


    千里之行，始于足下。在读完本书时，你将对构成理论和应用数据科学基础的概念有一个广泛而扎实的掌握，但第一步是确保这个目标被明确定义。什么是“数据科学”？


    关于数据科学的准确定义存在争议。我们将采用最宽泛的定义，即：


    *数据科学包括与收集、分析、解释和基于数据采取行动相关的活动。*


    如果你数了冰箱里剩下的鸡蛋数量，并算出周几需要再买一些，那么你就完成了一项数据科学活动。或者，如果你估算食堂里还剩多少巧克力布丁，以及排在你前面有多少人，然后推断当你排到前面时是否还有布丁剩下……这又是数据科学！即使是老师在晨会点名，然后在下午再次点名并比较结果的活动，也具备基础数据科学的所有特征。


    值得注意的是，许多人更严格地定义数据科学，并将其重点放在数据分析上；大多数被称为“数据科学家”的人主要工作在数据分析领域。例如，加州大学伯克利分校的数据科学教科书^(¹)告诉我们，数据科学“是关于通过探索、预测和推断，从庞大而多样的数据集中得出有用结论的学科。”它不涉及收集这些数据集的过程，也没有详细探讨如何将这些数据用于除进行预测之外的任何其他目的。我们先前采用的定义与伯克利或任何主张数据科学专注于数据分析的评论者并不矛盾。在本书中，我们将采取一个整体的视角，审视那些通向数据分析的活动。你将看到数据收集过程如何影响其分析：实验设计如何引入需要被理解和处理的偏差和因素。本书将向你展示，过程中的每一个环节都是相互关联的，理解这个过程将丰富你的分析。


    简单来说，数据科学是将**数据**转化为**信息**的过程。**数据**和**信息**这两个词有其正式且截然不同的含义。我们将在**表格 [1-1]**(#486852_1_En_1_Chapter.xhtml#Tab1)
    中说明它们。


    **表 1-1** 突出显示数据与信息之间的区别


    |   | 数据 | 信息 |

    |---|------|-------------|

    | 1 | **数据**是做蛋糕的原料，鸡蛋、糖、牛奶等。 | **信息**是切好的一块蛋糕。 |

    | 2 | 如果你问 100 个人是否相信气候变化，你将得到 100 个**数据**单位。 | “99%的人认为气候变化问题需要得到解决”这个陈述是**信息**。
    |

    | 3 | **数据**是被收集或汇集的。 | **信息**来自对数据的分析。 |

    | 4 | 一条**数据**读数描述了某事物的状态。 | **信息**是关于某事物的一个“事实” 。 |


    ## 使用温度


    温度是最常见的数据度量之一，也是我们日常会接触到的。


    即使我们没有查看天气预报，我们通常也能知道今天的气温大概是多少。我们使用温度测量来烹饪食物，并维持家和工作场所的空气在一个舒适的水平。当人们生病时，我们会测量他们的体温；当发动机温度过高时，我们知道出了问题。


    我们在本章中使用温度，因为读者会对其有直观的理解：我们不需要试图解释温度是什么。但是，我们在本章以及全书将要讨论的概念，可以应用于任何数据集：也许你选择的数据是社交媒体点赞数或股市指标，也许是体育赛事结果和联赛排名，或是血细胞中的病毒数量，或是你最喜欢的咖喱店的咖喱辣度。数据科学的原理适用于各种各样的数据。


    ## 测量温度


    大多数人类（但不是全部）能感知温度：我们能感受到夏天火辣辣的太阳，我们的感官会告诉我们极热和极寒的危险。我们对温度有着非常丰富的主观体验，并且常常对此有强烈的看法。


    第一个客观测量温度的工具是由丹尼尔·加布里埃尔·华伦海特于 1714 年发明的。他基于水银的温度计工作原理非常简单，如**图 [1-1]**(#486852_1_En_1_Chapter.xhtml#Fig1)
    所示。


    ![../images/486852_1_En_1_Chapter/486852_1_En_1_Fig1_HTML.jpg](img/486852_1_En_1_Fig1_HTML.jpg)


    **图 1-1** 封闭玻璃容器中的水银对温度做出反应


    **警告**


    还有其他制作温度计的方法——你甚至可以用水和食用色素自己制作一个。水银特别有效，但它也是一种对人体和环境都有毒性的有害元素。在世界许多国家，医院和学校等场所禁止使用水银温度计。对人体的危害来自吸入水银蒸气，因此如果水银温度计破裂，你需要非常小心地处理。酒精是水银最常见的替代品，但无论我们在温度计中放入什么物质，其工作原理都是相同的。


    当华伦海特发明温度计时，他也引入了一个标准温标——华氏度——这在当时被广泛使用，并沿用至今。此后，又引入了其他温标，其中摄氏度（百分温标）和开尔文最为常见，也是数据科学家偏好的温标。


    为了完成本章中的练习，你需要获取一个或多个温度计——最好是模拟式的，但任何类型都可以。我们将使用摄氏温标，其中 0 度是水的冰点，100 度是水的沸点。

