- fmt: '# 10.9 Analyzing the Data


    Once you have collected and downloaded the data, the next step is to analyze it
    and see whether any interesting secrets are buried in its depths.


    If you have used the hardware and software suggested earlier, you should have
    a data set with the following labels:


    - **Timestamp**: This is an integer that is a measure of how many milliseconds
    have elapsed since the micro:bit was powered up.

    - **Acc X**: A measure of acceleration in the x-plane (relative to the micro:bit
    and recorded from the onboard accelerometer).

    - **Acc Y**: A measure of acceleration in the y-plane.

    - **Acc Z**: A measure of acceleration in the z-plane.

    - **Mag X**: A measure of magnetic attraction in the x-plane (recorded by the
    micro:bit’s onboard magnetometer).

    - **Mag Y**: A measure of magnetic attraction in the y-plane.

    - **Mag Z**: A measure of magnetic attraction in the z-plane.

    - **B**: Tags – the value is 0 except when the B button is clicked.

    - **Temp**: Temperature in Centigrade recorded by the `SW01 xChip`.

    - **Pressure**: Atmospheric pressure recorded by the `SW01 xChip`.

    - **Humidity**: Relative humidity recorded by the `SW01 xChip`.


    The data in the field labeled **B** tells us when the subject exhibited a target
    behavior.


    A fairly simple way to look for correlations between fields of data and the target
    behavior is to draw line charts using the process described here:


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig7_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig7_HTML.jpg)


    Figure 10-7 Temperature data leading up to the target behavior


    - Locate a point in the data where the target behavior was exhibited – where the
    value 1 appears in column H.

    - Choose one of the other data fields to look at (e.g., temperature). Highlight
    data in that field from the current record UPWARD (to select data recorded before
    the target behavior was tagged): select a few hundred records.

    - Click **Insert/Chart/Line Chart**. Create a line chart showing the highlighted
    data.

    - Your chart will look something like Figure [10-7](#486852_1_En_10_Chapter.xhtml#Fig7).


    What we are looking at in Figure [10-7](#486852_1_En_10_Chapter.xhtml#Fig7) is
    temperature data. It shows data from a couple of minutes before I found myself
    feeling the urge to make a cup of coffee. I could have taken a much bigger chunk
    of data over a longer period of time, but I chose not to: the urge to make coffee
    is typically quite sudden, so I wanted to look at a short time period. Use your
    logic in a similar way to choose a time period to consider.


    By itself, this visualization is of little value. We need to look at other, similar
    graphs and check if there are similar patterns. Repeat the process of generating
    charts for each instance of the target behavior. Try to use the same number of
    data points and don’t let the chart use overlapping data.


    I generated four charts, shown in Figure [10-8](#486852_1_En_10_Chapter.xhtml#Fig8).


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig8_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig8_HTML.jpg)


    Figure 10-8 Four charts showing temperature leading up to my target behavior


    Looking at these charts side-by-side helps us see if there is a pattern: similarities
    in the shapes leading up to the target behavior.


    In the four instances shown there is a steady decline in the temperature up to
    the moment I felt the urge to make a cuppa. This was unexpected: although I hypothesized
    that the most likely measure to correlate with the target behavior was the temperature,
    I did not really expect to see a pattern. This data does not prove anything, but
    it shows me that temperature might play a role in triggering my coffee-impulse.
    The data scientist in me marks this result as something worth investigating more
    rigorously later.


    The next step in our analysis is to repeat this for all the different measures
    and see if any other patterns emerge. There are nine sensor readings we can choose
    from so lots of charting to do – better get started!


    But, **no**. At this point we apply our human intelligence to guide our analysis:


    Is there any likelihood at all that acceleration could be a trigger for my target
    behavior? What about magnetometer readings? My logic tells me that the likelihood
    is either zero, or very close to zero. There is a greater likelihood of humidity
    and/or pressure playing a role. I make a judgment that the time it will take me
    to create charts for acceleration and magnetometer data is not worth my effort
    and I prioritize the measures that feel more likely to yield results. And with
    the time saved I’ll go and make another cup of coffee (it is getting a bit chilly)!


    ## 10.10 Comparing Humans and Machines


    There are a broad range of AI services publicly available and we will look at
    how to access one of these in the next chapter. In this experiment we did everything
    manually though. Table [10-3](#486852_1_En_10_Chapter.xhtml#Tab3) lists a number
    of the activities and actions we undertook and gives an idea of what an AI might
    be capable of doing in each instance.


    Table 10-3 Data analysis: comparing how a human and an AI might undertake the
    analysis outlined here


    | What I did | What AI would do |

    | --- | --- |

    | I designed an experiment to investigate something because I was curious. | An
    AI will react to a command of some kind. They are not innately curious. |

    | I chose to look at temperature first: it felt like the most likely measure to
    have an impact. | AI would look at all the different measures and then look at
    all sorts of combinations of them. Over time it would learn to prioritize measures
    that more consistently yield significant results. |

    | I made 4 charts that all looked at a similar time period which I chose based
    on logical assumptions. I then visually inspected the charts I had made. | AI
    would use a broad range of pattern matching algorithms to analyze the data thoroughly,
    testing all sorts of different time segments. With enough time to process the
    data it would find any statistically significant results. |

    | I looked for patterns. | An AI looks for patterns. |

    | I used logic to cut down on my workload. I valued my time and left out measures
    I felt were spurious. | An AI would use prior learning to target how it searches,
    and will continue working as long as there is work to do, or until it is told
    to stop. |

    | I decided that the results were interesting and potentially worth investigating
    further. | An AI would report on results that had some degree of statistical significance.
    We could train an AI to assign a score to the likelihood that a human would find
    a result interesting. |

    | I might make some predictions based on intuition and experience. | An AI might
    make predictions based on a vast body of prior, similar events and a highly trained
    and evolved prediction model. |


    Notice how the activities in Table [10-3](#486852_1_En_10_Chapter.xhtml#Tab3)
    that are most likely to qualify as “intelligent behavior” are listed in the **What
    I did** column. AI has a great deal to offer, but the real intelligence in data
    science still comes from the people involved in the process.


    What is clear though is the value of AI to perform volumes of sophisticated analysis
    that would be too time-consuming for a person, and beyond the skill set of most
    of us. In the following chapter we will unlock this power and begin to use AI
    in our data science work.'
