  raw: '## 6.5 Wireless Communication Options for IoT


    Wireless communication is not new: our ancestors used it long before the age of
    computing, and not just to talk to each other. Signal fires and lighthouses are
    wireless communication methods that utilize light waves to send a message.


    There are a lot of similarities in how people and computers communicate wirelessly:


    *   People can transmit and receive data wirelessly very easily and frequently.
    Speaking is the most obvious way, but other factors such as body language are
    used to communicate data to people who are in a vicinity to hear or notice us.


    *   Computers can transmit and receive data wirelessly very easily and frequently.
    Transmitting radio waves is the most common way, but other options are available.
    We will not pay these any attention.


    There are three leading technologies that transmit and receive radio signals to
    communicate data and which are used to connect devices to the Internet/IoT and
    to access cloud-based services:


    *   **Bluetooth**: The micro:bit has a built-in radio transmitter that conforms
    to the BLE (Bluetooth Low Energy) specification. The radio functionality can be
    used on its own, without invoking the Bluetooth protocol. We will explore the
    capabilities of Bluetooth in **Chapter** [**7**](#486852_1_En_7_Chapter.xhtml),
    and then in **Chapter** [**8**](#486852_1_En_8_Chapter.xhtml) we will look at
    how the radio can be used without Bluetooth.


    *   **Wi-Fi**: **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml) explains a bit
    more about Wi-Fi and shows how to add Wi-Fi capabilities to your micro:bit.


    *   **LoRaWAN** and **Sigfox**: LoRaWAN (Long Range Wide Area Network) and Sigfox.
    These are both exciting and growing technologies, but they currently have limited
    support on the micro:bit. Bluetooth, radio, and Wi-Fi are much better supported
    and will be suitable for a wide range of data science applications. It is these
    wireless communication methods that we will use in the remainder of this book.


    Note


    There are circumstances where LoRaWAN or Sigfox are more appropriate technologies
    than Bluetooth or Wi-Fi. The range on LoRa and its low power model make it very
    suitable for deploying remote sensors: it is a popular choice in high-altitude
    experimentation, such as communicating data from sensors on a weather balloon.
    In the interests of limited space, we are omitting these technologies from this
    book.


    ## 6.6 Transmitting Data Using a Serial Connection


    A UART (USB) cable can be used to extract data from a micro:bit. Data can be transferred
    over a “serial” cable from a micro:bit directly to a computer, where it can be
    saved in great volume (**Figure** [**6-3**](#486852_1_En_6_Chapter.xhtml#Fig3)).


    ![../images/486852_1_En_6_Chapter/486852_1_En_6_Fig3_HTML.jpg](images/486852_1_En_6_Chapter/486852_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    A micro:bit attached to a computer using a USB cable can transmit data over that
    cable to the computer


    This approach is tried and tested, but it does have some limits:


    *   The measuring instrument has to be a cable-length away from the computer.
    There will be a number of data science use cases where this sort of solution will
    do adequately, but we are going to use the remainder of this book to look at wireless
    solutions: ways that we can transmit data between the micro:bit and another device
    without the constraint of a physical connection.


    *   The process is not trivial. There are code libraries and apps that make it
    as simple as possible, but the range of options and configuration can make it
    a bit tricky for beginners.


    *   It is without doubt a useful tool to have in your repertoire, but there are
    no use cases it will enable that the wireless options we explore later in the
    book cannot do just as well.


    If a cabled solution will suit all of your needs, you should consider looking
    into this, and the Micro:bit Foundation’s website has all the details you will
    need.


    Note


    There is a relatively new cabled solution available for micro:bit that is much
    easier to use than the methods currently promoted by the Micro:bit Foundation
    and the community. The **Excel Data Streamer** app is available on the latest
    version of Excel and can be used to feed data from the micro:bit (or any edge
    device) directly into Excel (via a serial/USB port). Given the ease with which
    Excel can be integrated with other Office 365 applications, this solution is potentially
    very powerful. If you have access to Office 365 and are looking for a cabled solution,
    then you should consider this.


    ## 6.7 Summary


    In this chapter we have tried to demystify some of the terminology associated
    with the IoT and look at the technology that it is built upon. We have seen how
    it can help us address the main weakness in our toolkit: data storage limitations.
    There are also hints that it can offer us other benefits: if cloud computing provides
    services that we can access, surely some of those services will be useful in our
    data science endeavors? We have learned that wireless communication is the ideal
    way to connect to the IoT, and using Bluetooth, radio, or Wi-Fi, we will build
    a gateway to connect our edge devices to the cloud, thereby solving the problem
    of data storage. We will then be in a position to investigate what else IoT has
    to offer.


    Footnotes [1](#486852_1_En_6_Chapter.xhtml#Fn1_source)   [2](#486852_1_En_6_Chapter.xhtml#Fn2_source)
      [3](#486852_1_En_6_Chapter.xhtml#Fn3_source)


    # 7. Using Bluetooth for Data Science


    In the lead up to this chapter we have looked at how the BBC micro:bit can be
    used to build data gathering tools that enable us to undertake meaningful real-world
    data science experiments. In the process we have identified a flaw in our capabilities:
    the micro:bit can measure almost unlimited volumes of data, but saving that data
    and/or getting it off of the micro:bit (and into an environment where we can use
    it) has been challenging.


    At the end of **Chapter** [**6**](#486852_1_En_6_Chapter.xhtml) we concluded that
    wireless technology could provide us with the means to extract data as it is recorded.
    In this chapter we will look at one of the technologies that is available to use
    that can deliver this functionality: we’ll see how Bluetooth can help meet this
    need.'
  trans: "\n## 6.5 物联网的无线通信选项\n\n无线通信并非新鲜事物：早在计算机时代之前，我们的祖先就已使用它进行通信，且并不仅限于彼此交谈。烽火和灯塔就是利用光波传递信息的无线通信方式。\n\
    \n人与人之间以及计算机之间的无线通信存在许多相似之处：\n\n-   人类可以非常轻松且频繁地无线发射和接收数据。说话是最明显的方式，但其他因素如肢体语言，也被用来向附近能听到或注意到我们的人传递数据。\n\
    -   计算机可以非常轻松且频繁地无线发射和接收数据。发射无线电波是最常见的方式，但还有其他选项可用。我们不会对这些选项给予关注。\n\n目前有三种主流技术通过发射和接收无线电信号来传输数据，并用于将设备连接到物联网以及访问基于云的服务：\n\
    \n-   **蓝牙**：`micro:bit` 内置了一个符合 BLE（低功耗蓝牙）规范的无线电发射器。其无线电功能可以独立使用，无需调用蓝牙协议。我们将在**第**\
    \ **7** **章**探索蓝牙的能力，然后在**第** **8** **章**介绍如何在不使用蓝牙的情况下使用无线电。\n-   **Wi-Fi**：**第**\
    \ **9** **章**将更详细地介绍 Wi-Fi，并展示如何为你的 `micro:bit` 添加 Wi-Fi 功能。\n-   **LoRaWAN**\
    \ 和 **Sigfox**：LoRaWAN（远距离广域网）和 Sigfox。这两者都是令人兴奋且不断发展的技术，但目前它们在 `micro:bit` 上的支持有限。蓝牙、无线电和\
    \ Wi-Fi 得到更好的支持，并将适用于广泛的数据科学应用。本书的其余部分将使用这些无线通信方法。\n\n> **注意**  \n> 在某些情况下，LoRaWAN\
    \ 或 Sigfox 比蓝牙或 Wi-Fi 更合适。LoRa 的覆盖范围及其低功耗模式使其非常适合部署远程传感器：在高空实验（例如从气象气球上的传感器传输数据）中是一个流行的选择。由于篇幅有限，我们在本书中省略了这些技术。\n\
    \n## 6.6 使用串行连接传输数据\n\n可以使用 UART（USB）线缆从 `micro:bit` 提取数据。数据可以通过“串行”线缆从 `micro:bit`\
    \ 直接传输到计算机，并在计算机上大量保存（**图** **6-3**）。\n\n![../images/486852_1_En_6_Chapter/486852_1_En_6_Fig3_HTML.jpg](img/486852_1_En_6_Fig3_HTML.jpg)\n\
    \n*图 6-3*  \n使用 USB 线缆连接到计算机的 `micro:bit` 可以通过该线缆将数据传输到计算机。\n\n这种方法久经考验，但也存在一些限制：\n\
    \n-   测量仪器必须与计算机保持在一根线缆长度之内。虽然有许多数据科学用例可以通过这种方案充分实现，但本书的其余部分将专注于无线解决方案：即如何在 `micro:bit`\
    \ 与另一设备之间传输数据，而不受物理连接的限制。\n-   过程并不简单。虽然有代码库和应用程序可使其尽可能简化，但众多的选项和配置对初学者来说可能有点棘手。\n\
    -   这无疑是你技能库中的一个有用工具，但它能实现的用例，我们在本书后面探索的无线选项同样可以很好地实现。\n\n如果有线解决方案能满足你的所有需求，你应该考虑深入研究一下。Micro:bit\
    \ 基金会的网站提供了你所需的所有详细信息。\n\n> **注意**  \n> 对于 `micro:bit`，有一个相对较新的有线解决方案，它比目前 Micro:bit\
    \ 基金会和社区推广的方法更容易使用。**Excel Data Streamer** 应用程序可在最新版本的 Excel 中使用，并可用于将 `micro:bit`（或任何边缘设备）的数据直接输入\
    \ Excel（通过串行/USB 端口）。鉴于 Excel 与其他 Office 365 应用程序集成的便捷性，该解决方案可能非常强大。如果你能访问 Office\
    \ 365 并正在寻找有线解决方案，那么可以考虑这个方案。\n\n## 6.7 总结\n\n在本章中，我们试图揭开与物联网相关的一些术语的神秘面纱，并探讨了其构建所依赖的技术。我们看到了它如何帮助解决我们工具包中的主要弱点：数据存储限制。同时也有迹象表明，它可以为我们带来其他好处：如果云计算提供了我们可以访问的服务，那么其中一些服务肯定会对我们的数据科学工作有所帮助？我们了解到无线通信是连接到物联网的理想方式，并且通过使用蓝牙、无线电或\
    \ Wi-Fi，我们将构建一个网关，将我们的边缘设备连接到云端，从而解决数据存储问题。届时，我们将有能力进一步探究物联网还能提供什么。\n\n脚注 1  \
    \ 2   3\n\n# 7. 使用蓝牙进行数据科学\n\n在本章之前，我们已经探讨了如何使用 BBC `micro:bit` 构建数据采集工具，使我们能够进行有意义的真实世界数据科学实验。在这个过程中，我们发现了自身能力的一个缺陷：`micro:bit`\
    \ 可以测量几乎无限量的数据，但保存这些数据或将其从 `micro:bit` 中取出（并放入我们可以使用的环境）一直是个挑战。\n\n在**第** **6**\
    \ **章**的结尾，我们得出结论，无线技术可以为我们提供在数据记录时提取数据的方法。在本章中，我们将探讨一种可用于实现此功能的技术：我们将了解蓝牙如何帮助满足这一需求。\n"
- fmt: '# 7.1 What Is Bluetooth?


    At its essence, wireless communication between two microprocessors is a relatively
    straightforward concept. It works like this:


    1.  Take two microprocessors and add a short-range radio transmitter to each of
    them.

    2.  These microprocessors can be programmed to send and receive radio signals.

    3.  So, we could program one microprocessor to send a specific signal over a specific
    frequency.

    4.  We could program the other microprocessor to listen to that same specific
    frequency and react when a specific signal is received.

    5.  Our two microprocessors would now be communicating wirelessly.


    Bluetooth is a set of rules and procedures that govern wireless communications:
    it is a standard that people have agreed to follow. It defines how each of the
    five components of the process is implemented: How does the first processor convert
    data into a specific signal? What frequency is used? How does the second processor
    know the message is from the first one, rather than a malicious third processor?


    When humans communicate wirelessly (i.e., talk), we use spoken language. The words
    we speak convey meaning, and so too do other factors, for example, how we emphasize
    our words, which words we choose, and how loudly we speak them. We communicate
    our emotions as well as our thoughts, and for other people to understand all the
    depths and layers of meaning we are communicating, they need to understand the
    verbal language we use as well as the “rules” governing the subtleties. The sound
    waves that our words make are like the radio signal and everything else is like
    the Bluetooth standard.


    A deep understanding of the Bluetooth standard is not especially relevant to us
    on our data science journey, so we will pick out the key features we need as the
    need to use them arises. For now it is enough to know that Bluetooth is a standard
    way of managing wireless communication, and that:


    *   This standard/list of rules was written down by people and is maintained by
    people.

    *   By having an agreed standard, different manufacturers can build “Bluetooth”
    devices that will be compatible with each other.

    *   The Bluetooth Special Interest Group (`SIG`) ensures that the Bluetooth specification
    is maintained, promoted, protected, and, where necessary, updated. They keep it
    relevant to the changing technological landscape.

    *   Where a device follows all the rules laid out in the standard, it is legitimate
    to refer to it as a `Bluetooth-enabled device`.


    ## 7.2 Why Use Bluetooth?


    The most compelling reason for us to investigate the suitability of Bluetooth
    is that the BBC micro:bit has a built-in `Bluetooth Low Energy` (`BLE`) antenna,
    as is shown in Figure [7-1](#486852_1_En_7_Chapter.xhtml#Fig1). `BLE` is a version
    of Bluetooth that was designed to be very economical in its use of power.


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig1_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig1_HTML.jpg)


    Figure 7-1 The rear of a micro:bit with `BLE` antenna circled


    If the onboard `BLE` is able to meet the needs we identified in Chapter [6](#486852_1_En_6_Chapter.xhtml),
    then the last piece of our jigsaw is in place and we can add cloud services and
    IoT to our data science toolkit.


    ## 7.3 Using BLE on micro:bit


    Our primary objective in using wireless communication is to gather our data and
    then transmit it to a more suitable location: perhaps to a program like `Excel`,
    or to a server 5000 miles away, or maybe even to an artificial intelligence service.
    Simple!


    It will come as a surprise to very few of you to hear that it is not as simple
    as this: there are some limitations in what can be done with `BLE` on micro:bit:


    *   There is no option to use `BLE` with `MicroPython`.

    *   With `MakeCode` the most stable implementation of `BLE` is using a `UART`
    cable – so, not wireless.


    Despite the limitations, there are still a number of ways in which we can take
    advantage of `BLE` in our pursuit of data science, but we need to understand a
    bit about how `BLE` handles data first:


    *   The `BLE` specification requires a `BLE` device to have a `profile`, which
    is information about the device and the data it is able to provide (referred to
    as a `service`).

    *   A micro:bit has a `profile` which defines the data that it will share on request
    (i.e., the `services` it offers), including data from the accelerometer, magnetometer,
    onboard temperature sensor, buttons, and a few other bits.

    *   When another `BLE-enabled` device `pairs`^([^(11)](#fn11)) with the micro:bit,
    both share their profile, and each can access the data services offered by the
    other.

    *   The term `arbitrary data` refers to any data that is not included in the profile.
    If we add a peripheral to the micro:bit, such as a weather station or `CO2` monitor,
    the data from that peripheral is arbitrary and is not available as a service.


    Our scope is broader than just the data that is native to the micro:bit. We might
    want to measure weather today, `CO2` levels tomorrow, and soil acidity the next
    day. For experiments that just use accelerometer and/or magnetometer data, the
    micro:bit and `BLE` are a great tool, but for everything else, we will need another
    solution.


    There are some clever ways in which `BLE` is used that may be of value to us though,
    for example, the `MakeCode`-based `Bluetooth UART` allows us to transfer `arbitrary`
    data onto a connected smart device; we will look at this in Section 7.4. There
    are also a few other implementations that use a `USB` cable which are quite stable.
    But, for any use case where you require the micro:bit to be connected by a `USB`
    cable to a computer, the `Excel Data Streamer` referred to in Chapter [6](#486852_1_En_6_Chapter.xhtml)
    is hard to beat.


    ## 7.4 Building a BLE Weather Station with Bluetooth UART


    We are going to rebuild the weather station so that it takes advantage of `Bluetooth
    UART`: we will feed data from a micro:bit directly to a smart device.


    Figure [7-2](#486852_1_En_7_Chapter.xhtml#Fig2) shows the block circuit diagram
    for a `BLE`-enabled digital weather station instrument.


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig2_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig2_HTML.jpg)


    Figure 7-2 Circuit diagram for a `BLE`-enabled digital weather station


    Table [7-1](#486852_1_En_7_Chapter.xhtml#Tab1) lists the hardware that we will
    use to build our Bluetooth weather station tool.


    **Table 7-1** Hardware requirements for the Bluetooth weather station tool


    | What you need | What we use | Qty | Alternatives |

    | --- | --- | --- | --- |

    | A microprocessor and the means to flash code onto it | micro:bit | 1 | `Adafruit
    Feather 32u4 Bluefruit LE` |

    | Power | `2xAAA` battery holder with a `JST` connector | 1 | Lithium-ion polymer
    battery – 3.7v |

    | A sensor to read weather data | `XinaBox SW01` | 1 | `Adafruit BME280 I2C` or
    `SPI Temperature` `Humidity Pressure Sensor` |

    | A Bluetooth radio to send weather data to an app | micro:bit built-in Bluetooth
    radio | 1 | `Adafruit Bluefruit LE Shield` |

    | The means to connect it all together | `XinaBox IM01` micro:bit bridge and `xBus`
    connectors | 11 | Hookup wires |


    Pick the appropriate tool and assemble the parts as shown in Figure [7-3](#486852_1_En_7_Chapter.xhtml#Fig3).


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig3_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig3_HTML.jpg)


    Figure 7-3 Weather station using the micro:bit built-in Bluetooth radio'
