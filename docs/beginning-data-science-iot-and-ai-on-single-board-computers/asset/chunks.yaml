    # 1.8 温度实验


    在本节中，我们将开展一项活动，在多个地点采集温度数据；随后在下一节中，我们将分析所采集的数据。我们将整个过程称为一次实验。


    本节概述了我们的实验设计，即我们将遵循的一系列操作指南和规则。我们之前已了解到，数据的有效性和可靠性至关重要——清晰且规划周密的实验设计有助于我们控制一些外部变量，从而获得更可靠、更有效的数据。


    我们建议你在室内和室外的多个不同地点读取温度读数。理想的结果是获得大约十几个读数，并确保结果之间存在合理的差异范围。


    如果你无法访问多个地点，另一种替代方案是在同一地点的不同时间读取温度读数，或者使用医用温度计测量不同植物周围土壤的温度。你甚至可以用其他类型的数据来进行这项练习——用紫外线强度、二氧化碳浓度或任何你能测量且感兴趣的数据来替代温度（`表
    1-6`）。


    **表 1-6 练习 1-2 概述**


    | 练习 1-2 | 比较不同地点的温度 |

    | --- | --- |

    | 摘要 | 将测量并记录多个不同地点的温度；随后分析这些数据。我们将分析结果以及此项活动的实验设计质量。 |

    | 时长 | 30 分钟 |

    | 准备 | • 收集一些温度计——它们不必完美，存在偏差和数据问题是可以接受的。• 准备一份地点清单。选择那些温度可能存在一些差异的地点——如果可能，应包括室内和室外。•
    绘制一个数据表格用于记录数据。写下地点名称，并添加任何可能有价值的备注（例如，识别外部变量）。 |

    | 分步流程 | 1. 访问每个指定地点。2. 按照以下“附加说明”中的指南读取温度计。3. 在每个地点记录温度。4. 返回步骤 1 并重复，直到所有地点都测量完毕。5.
    收集完所有数据后，继续学习第 1.9 节，并回答该节列出的问题与主题。 |

    | 附加说明 | 读取温度计时，请遵循以下步骤：• 找一个平坦的木质表面，该表面应避免阳光直射，且不紧邻直射区域。该位置应远离微风，且不在任何角落。• 将温度计放在平坦表面上，确保刻度清晰可见。•
    后退一步，等待 30 秒。• 30 秒后，在不触碰温度计或对着它呼吸的情况下读取温度。 |

    | 我们将学到什么 | 数据收集过程会很有趣，但略显繁琐：人的时间是宝贵的。这是推动使用数字工具的关键因素，我们将在下一章介绍这些工具。参与者将通过回答下一节列出的问题与主题来对数据进行分析——他们将看到，对数据提出问题如何能提供有趣且独特的信息。
    |


    ## 1.9 分析结果


    我们现在有了一张根据我们制定的计划谨慎收集的数据表格，该计划的目的是尽可能确保数据的可靠性和有效性。这些数据可能并不完美，但可以公平地说，与没有制定计划相比，大多数人对这些数据的信任度会稍高一些。


    这张表格是一个原始数据集——刚刚收集完毕，随时可用于分析。与其试图定义什么是分析，不如让我们直接动手分析！


    我们将审视我们的数据集，看看能从中提取出哪些信息。我们将尝试用有意义的英文句子来描述数据：将数据表格转化为对话片段。例如：


    - “学校里最热的地方是……”

    - “如果你想凉快一下，就去坐……。”

    - “数据收集方法在此方面存在缺陷……”


    数据分析既是科学，也是艺术：


    - 科学部分包括多年来发展起来的工具和技术，我们将在本书后面部分探讨其中一些内容。

    - 艺术部分则是充满好奇心的人类思维，思考有趣的问题，并审视数据集是否包含有助于回答这些问题的洞察。


    可以稳妥地说，数据分析中最重要的单一要素是人的好奇心。


    对于刚刚收集到的数据集，你现在应该提出并尝试回答下面列出的问题。将答案整理成陈述句，用平实的语言表达，可以用于日常对话、电子邮件或社交媒体更新中。留意任何听起来有趣的内容。


    我们无法直接为你提供这些问题的答案：想象一下在盛夏的斯里兰卡、冬季的冰岛或你所在的社区使用本书。不同地方的答案会各不相同——你将在完全独特的数据集上工作，你的结论将是原创的。


    问题按类别分组。


    ### 极值分析


    几乎对于任何数据集，审视极值通常都能让我们学到一些东西。请提出这类问题：


    - 最热的地点在哪里？

    - 最冷的地点在哪里？

    - 如果两者不同，原因是什么？是什么使得一个地点比另一个地点更暖或更冷？

    - 温度的范围是多少？最热和最冷的地点差异有多大？我们能从中推断出什么？


    ### 平均值分析（集中趋势）


    我们将在第 5 章更详细地探讨平均值。现在，请提问：


    - 你所分析的学校/区域的平均温度是多少？

    - 平均值的用处有多大？有多少地点的温度等于平均值？这真正告诉了我们什么？

    - 如果我们认为平均值有用，它是在极值的中点，还是更接近其中之一？无论是哪种情况，这能告诉我们什么吗？


    ### 随机洞察


    同时，通过提出以下问题来寻找数据中的洞察：


    - 你能找出减少供暖/制冷开销的方法吗？风扇/暖气/空调是否安装在了最佳位置？

    - 是否存在需要关注的问题地点？是否有某个特定区域让人感觉不舒适？

    - 如果有多个让人感觉不舒适的地点，是否存在单一原因？

    - 温度会影响行为吗？你会如何调查这一点？

    - 你会去哪里吃冰淇淋，又会去哪里喝汤？


    ### 数据质量分析


    我们应该始终质疑数据的质量：


    - 我们的实验中哪些因素可能影响数据的可靠性？哪些可能影响其有效性？这会如何改变我们的答案？

    - 我们在分析中得出的答案在逻辑上合理吗？它们讲得通吗？我们相信它们吗？

    - 务必复核任何异常数据！许多研究人员会告诉你，看起来异常的数据通常很有趣，但对有趣数据的第一反应是检查是否存在错误。

    - 如果你的实验包含两个或更多组，请检查不同组之间的数据有多相似？任何差异如何解释？

    - 我们认为结果中存在误差范围吗？如果是，误差范围有多大？

    '
- fmt: '# Introspection


    And with any experiment, ask how you can improve it:


    - How can you make it more efficient (i.e., save human time/effort)? Consider
    technological solutions throughout.

    - Can we make our experiment more environmentally friendly?

    - How could we make our data more valid and reliable?

    - Is there is a trade-off between efficiency and making our data more reliable/valid?
    If so, what should we do differently next time?

    - Could we scale it up? How many locations could we sample in 1 hour? If there
    are upper limits, how do we overcome these?

    - How could we build on the experiment? For example, how would you design the
    experiment so that it takes a different reading every half an hour throughout
    the day?

    - Were there any ethical implications?


    Did you find that any of the answers to the preceding questions were interesting
    or useful? It only takes one or two insights to make it all worthwhile.


    We will look at data analysis in more detail in later chapters - for now, bear
    in mind that at the root of all data analysis is a set of questions such as the
    ones asked earlier.


    ## 1.10 Summary


    We are all data scientists. On a daily basis, often without realizing it, we consume
    data. We use the information dished up to us constantly to make decisions, plans
    or even just conversation.


    In this chapter we had a quick overview of the whole journey that data goes on:
    from an experimental design to being collected using some tools, to being analyzed
    and converted into information.


    To delve further into data science we are going to need access to more sophisticated
    tools than mercury thermometers. In Chapter 2 we will look at ways that we can
    build our own instruments to measure data.


    # 2. Data Science Goes Digital


    In this chapter we will identify a set of electronic components with which we
    will build a range of different digital tools. These tools will be used to gather
    data, which is essential fuel for our journey into data science.


    ## 2.1 Making It Digital


    Did you know that every single teenager on the planet was born in the twenty-first
    century, after the creation of the Internet, email, even Google? Many of the children
    growing up today have never known the absence of digital magic. We are living
    in a digital world – it crept up on some of us, but more and more of us are being
    born into it. People even refer to our current epoch as the Digital or Information
    Age, acknowledgment of the extent to which information is woven into every aspect
    of our lives. The digital revolution – the replacement of analog technology with
    digital equivalents – laid the foundation for our modern society.


    Although the analog thermometer served us well in Chapter 1, to learn more about
    data science we are going to need access to increasingly complex data sets: we
    will collect hundreds, thousands, or even millions of data points as our experiments
    get more ambitious. Our analog thermometer is not fit for this purpose, and the
    same is true of other analog tools. We are going to need access to sophisticated
    digital tools to make this journey possible.


    ## 2.2 Measuring Temperature Digitally


    In Chapter 1 we saw how an analog thermometer works; the fundamental principle
    is the same for a digital one. Ambient temperature causes something to react,
    to change, and this change is observed in some way:


    - In an analog thermometer, the visible level of mercury changes.

    - In a digital tool the reaction is converted into an electrical signal that a
    computer (or microprocessor) can perceive and interpret.


    Figure 2-1 shows the different components that constitute a digital thermometer.
    It is a very basic “circuit” or “block diagram” in a style that is used throughout
    this book.


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig1_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig1_HTML.jpg)


    **Figure 2-1** Core components of a digital thermometer


    Any digital thermometer will have the following components:


    1. **A power source**: Digital circuits require electrical power.

    2. **A microprocessor**: The role it plays is explained in more detail below.

    3. **A temperature sensor**: When power/electricity is supplied to a temperature
    sensor it will react to the ambient temperature around it. The sensor transmits
    data about its state through the circuit and it plays the same role as the mercury
    in an analog thermometer.

    4. **A way of outputting the temperature data**: For example, on a screen.

    5. **These need to be connected together somehow**: The lines joining the components
    are also important.


    ### The Role of the Microprocessor


    A microprocessor can be compared to the brain of a baby: full of potential but
    unable to actually do anything. A baby learns how to perform basic actions through
    being taught, and we “teach” our microprocessor how to perform basic actions by
    loading a computer program onto it.


    The microprocessor is the “brain” of the circuit. Electricity flows through the
    circuit, and it is the microprocessor which “monitors” this electricity, interprets
    any data encoded into it, and then acts on it. To perform as a thermometer:


    - The microprocessor knows it needs to “listen” for any signals coming from the
    temperature sensor: it knows this because someone, perhaps us, has “programmed”
    it to do just that. When a signal is received from the sensor, the microprocessor
    is able to convert that signal into a usable data point: a temperature reading.

    - The microprocessor also knows how to send information to the screen to make
    it show words and numbers: it knows this because, again, it has been told how
    in the program. It will send a signal to the screen that will make it display
    the temperature. Someone, perhaps us, has programmed/told the microprocessor what
    information to show on the screen and how to display it.


    ## 2.3 Building Digital Tools


    Do we really need to know how to build digital tools to become data scientists?
    In the professional world a data scientist doesn’t need to be a toolmaker:


    - There are many off-the-shelf products that will meet your data gathering needs.
    You can buy weather monitors, CO2 monitors and apps that tell you the temperature.

    - A team that is undertaking data science might have specialists in many fields,
    all responsible for different parts of the process: someone else might build data
    gathering tools.

    - You could commission someone to gather the data for you. Lots of businesses
    will sell you all manner of data. Or use online tools.


    This book is written for people who do not have access to those methods; we will
    have to collect data ourselves and we will build the data gathering tools that
    we need.


    Knowing how to build a digital tool is always going to be a useful skill, but
    it is clearly not a core skill of data science. The field of data science encompasses
    many disciplines: the data analyst, the toolmaker, the data collector, the project
    manager, and the experiment designer, to name a few. All their contributions play
    a role in the data science process. In this book we learn just enough about circuit
    building to enable us to build the tools we need to explore data science. We’ll
    show you how to do this without needing to become engineers first: it is not necessary
    to have any prior knowledge of circuit building (or computer programming) to work
    through this book.'
  raw: '### Introspection


    And with any experiment, ask how you can improve it:


    *   How can you make it more efficient (i.e., save human time/effort)? Consider
    technological solutions throughout.


    *   Can we make our experiment more environmentally friendly?


    *   How could we make our data more valid and reliable?


    *   Is there is a trade-off between efficiency and making our data more reliable/valid?
    If so, what should we do differently next time?


    *   Could we scale it up? How many locations could we sample in 1 hour? If there
    are upper limits, how do we overcome these?


    *   How could we build on the experiment? For example, how would you design the
    experiment so that it takes a different reading every half an hour throughout
    the day?


    *   Were there any ethical implications?


    Did you find that any of the answers to the preceding questions were interesting
    or useful? It only takes one or two insights to make it all worthwhile.


    We will look at data analysis in more detail in later chapters - for now, bear
    in mind that at the root of all data analysis is a set of questions such as the
    ones asked earlier.


    ## 1.10 Summary


    We are all data scientists. On a daily basis, often without realizing it, we consume
    data. We use the information dished up to us constantly to make decisions, plans
    or even just conversation.


    In this chapter we had a quick overview of the whole journey that data goes on:
    from an experimental design to being collected using some tools, to being analyzed
    and converted into information.


    To delve further into data science we are going to need access to more sophisticated
    tools than mercury thermometers. In Chapter [2](#486852_1_En_2_Chapter.xhtml)
    we will look at ways that we can build our own instruments to measure data.


    Footnotes [1](#486852_1_En_1_Chapter.xhtml#Fn1_source)


    # 2. Data Science Goes Digital


    In this chapter we will identify a set of electronic components with which we
    will build a range of different digital tools. These tools will be used to gather
    data, which is essential fuel for our journey into data science.


    ## 2.1 Making It Digital


    Did you know that every single teenager on the planet was born in the twenty-first
    century, after the creation of the Internet, email, even Google? Many of the children
    growing up today have never known the absence of digital magic. We are living
    in a digital world – it crept up on some of us, but more and more of us are being
    born into it. People even refer to our current epoch as the Digital or Information
    Age, acknowledgment of the extent to which information is woven into every aspect
    of our lives. The digital revolution – the replacement of analog technology with
    digital equivalents – laid the foundation for our modern society.


    Although the analog thermometer served us well in **Chapter** [**1**](#486852_1_En_1_Chapter.xhtml),
    to learn more about data science we are going to need access to increasingly complex
    data sets: we will collect hundreds, thousands, or even millions of data points
    as our experiments get more ambitious. Our analog thermometer is not fit for this
    purpose, and the same is true of other analog tools. We are going to need access
    to sophisticated digital tools to make this journey possible.


    ## 2.2 Measuring Temperature Digitally


    In **Chapter** [**1**](#486852_1_En_1_Chapter.xhtml) we saw how an analog thermometer
    works; the fundamental principle is the same for a digital one. Ambient temperature
    causes something to react, to change, and this change is observed in some way:


    *   In an analog thermometer, the visible level of mercury changes.


    *   In a digital tool the reaction is converted into an electrical signal that
    a computer (or microprocessor) can perceive and interpret.


    **Figure** [**2-1**](#486852_1_En_2_Chapter.xhtml#Fig1) shows the different components
    that constitute a digital thermometer. It is a very basic **“circuit”** or **“block
    diagram** **”** in a style that is used throughout this book.


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig1_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Core components of a digital thermometer


    Any digital thermometer will have the following components:


    1.  **A power source**: Digital circuits require electrical power.


    2.  **A microprocessor**: The role it plays is explained in more detail below.


    3.  **A temperature sensor**: When power/electricity is supplied to a temperature
    sensor it will react to the ambient temperature around it. The sensor transmits
    data about its state through the circuit and it plays the same role as the mercury
    in an analog thermometer.


    4.  **A way of outputting the temperature data**: For example, on a screen.


    5.  **These need to be connected together somehow**: The lines joining the components
    are also important.


    ### The Role of the Microprocessor


    A microprocessor can be compared to the brain of a baby: full of potential but
    unable to actually do anything. A baby learns how to perform basic actions through
    being taught, and we **“teach”** our microprocessor how to perform basic actions
    by loading a computer program onto it.


    The microprocessor is the **“brain”** of the circuit. Electricity flows through
    the circuit, and it is the microprocessor which **“monitors”** this electricity,
    interprets any data encoded into it, and then acts on it. To perform as a thermometer:


    *   The microprocessor knows it needs to **“listen”** for any signals coming from
    the temperature sensor: it knows this because someone, perhaps us, has **“programmed”**
    it to do just that. When a signal is received from the sensor, the microprocessor
    is able to convert that signal into a usable data point: a temperature reading.


    *   The microprocessor also knows how to send information to the screen to make
    it show words and numbers: it knows this because, again, it has been told how
    in the program. It will send a signal to the screen that will make it display
    the temperature. Someone, perhaps us, has programmed/told the microprocessor what
    information to show on the screen and how to display it.


    ## 2.3 Building Digital Tools


    Do we really need to know how to build digital tools to become data scientists?
    In the professional world a data scientist doesn’t need to be a toolmaker:


    *   There are many off-the-shelf products that will meet your data gathering needs.
    You can buy weather monitors, CO2 monitors and apps that tell you the temperature.


    *   A team that is undertaking data science might have specialists in many fields,
    all responsible for different parts of the process: someone else might build data
    gathering tools.


    *   You could commission someone to gather the data for you. Lots of businesses
    will sell you all manner of data. Or use online tools.


    This book is written for people who do not have access to those methods; we will
    have to collect data ourselves and we will build the data gathering tools that
    we need.


    Knowing how to build a digital tool is always going to be a useful skill, but
    it is clearly not a core skill of data science. The field of data science encompasses
    many disciplines: the data analyst, the toolmaker, the data collector, the project
    manager, and the experiment designer, to name a few. All their contributions play
    a role in the data science process. In this book we learn just enough about circuit
    building to enable us to build the tools we need to explore data science. We’ll
    show you how to do this without needing to become engineers first: it is not necessary
    to have any prior knowledge of circuit building (or computer programming) to work
    through this book.'
