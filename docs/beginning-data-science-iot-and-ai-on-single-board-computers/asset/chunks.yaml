      [3](#486852_1_En_3_Chapter.xhtml#Fn3_source)


    # 4. Working with Large Data Sets


    In this chapter we are going to take a step forward in our data science experimentation
    by significantly increasing the volume of data that we collect. So far we have
    worked with a dozen data points, and that was adequate for our needs. But sometimes
    correlations (and other interesting features of data) are subtle and hard to find.
    The larger our data set, the more likely it is that the answers we are looking
    for lie within it.


    If we are going to gather hundreds, thousands, or even millions of data points,
    there is a weakness in our toolkit: a flaw that limits how much data we can reasonably
    collect. Consider this question: how would we redesign the experiment in **Chapter**
    [**3**](#486852_1_En_3_Chapter.xhtml) if we wanted to record the weather measures
    over an extended period of time, say 24 hours?


    The weak spot is of course the human being with paper and pen in hand, dutifully
    standing in the elements for a whole day and night recording temperature, humidity
    and pressure every 5 minutes.


    In this chapter we will begin to eliminate the human factor from the data collection
    process by collecting and storing the data digitally. This will allow us to build
