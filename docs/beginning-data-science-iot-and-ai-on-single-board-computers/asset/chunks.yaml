    ## 5.11 统计显著性


    回顾一下我们在**表****5-1**和**表****5-2**中看到的示例。我们复制了几列包含 100 个数字的数据，然后检查了不同列之间的相关系数。再来看一下
    A 列和 D 列，以及**图****5-4**。


    你认为如果我们只使用这两列的前 50 个数字，结果会一样吗？


    让我们提出一个类似但措辞截然不同的问题。考虑以下场景：


    -   你有两个数据集，都包含温度和压力数据。

    -   一个数据集有 100 万个数据点，连续采集了 10 年。另一个数据集有 500 个数据点，采集了 2 周。

    -   在较小的数据集中，温度与压力之间的相关系数为 0.5。在较大的数据集中，相关系数为 0.75。


    考虑到前面概述的场景，如果有人请你描述这个相关系数，你会说它是**强相关**还是**中等相关**？


    我们大多数人会本能地信任较大的数据集——1000 万个数据点比 1000 个数据点包含更多实质内容和潜在信息，这很合理。每个数据点都包含一些价值——就像构成图像的像素一样。拥有更多数据点就像是拥有更多像素：随着分辨率的提高，我们看清全局的能力也会增强。


    因此，逻辑告诉我们，来自较大数据集的结果在某种程度上比来自较小数据集的结果更有意义。同理，可以合理地说，来自大型、有效、可靠数据集的结果比来自不那么**丰富**的数据集的结果更有意义。“丰富”数据这个术语非常恰当——它指的是有可能产生大量信息的数据。


    **统计显著性**的概念是衡量特定结果有多有意义的最佳指标。计算显著性的数学原理相当复杂，不在我们此处的讨论范围内，但非常有趣，值得深入研究。然而，对数据科学家来说，重要的不是了解显著性分数所依据的数学原理，而是理解统计显著性分数的含义：


    -   相关系数与显著性分数完全不同。

    -   显著性通常以百分比或指数的形式表示。

    -   它通常被称为**置信度**水平。

    -   它是衡量如果重复实验，特定结果再次出现的可能程度。

    -   如果某个结果的显著性分数为 50%，这意味着如果重复实验，有 50%的概率会观察到相同的结果。这个结果一半时间成立，其余时间不成立。

    -   如果某个结果的显著性分数为 100%，这意味着它总是成立——一个不容置疑的事实。100%的分数非常罕见。

    -   数据科学家设定了一个任意阈值：高于此阈值的结果可以被视为“事实”的显著性水平——通常是 95%或 99%。我们接触过的几乎每一个科学事实，都是在显著性分数大于
    95%甚至 99%（但几乎总是低于 100%）的实验中证明的。


    根据经验法则，在少于 50 个读数的数据集中很少能发现显著结果；较大的数据集更有可能产生显著结果，并且数据越有效、越可靠，就越有可能发现显著结果。在大多数数据科学实验中，不显著的结果会被舍弃或谨慎对待。


    计算相关性分数的显著性是有可能的，鼓励读者深入研究这一点。


    ## 5.12 本章小结


    在本章中，我们探讨了如何使用电子表格来帮助分析我们在**第****4**章中构建的数据表。我们解决的关键挑战是从`micro:bit`中提取数据，并将其导入更适合数据分析任务的工具中。电子表格功能强大且广泛可用，但当物联网仅一步之遥（一个调制解调器）时，何必止步于将数据从`micro:bit`移动到笔记本电脑呢？


    脚注 1 2 3


    # 6. 将物联网引入数据科学


    在本章中，我们将从数据科学家的角度来审视**物联网**（IoT）。什么是物联网？它如何帮助我们扩展数据科学能力？


    ## 6.1 我们数据科学工具箱中的弱点


    在前面的章节中，我们进行了日益复杂的数据科学实验。我们的问题和工具都变得更加精密，但基本流程通常包括以下步骤：


    1.  **好奇心**：这个过程总是始于好奇心；一个问题。

    2.  **实验设计**：然后我们规划如何回答这个问题——我们应该收集什么数据？需要什么工具？我们定义了执行实验所需采取的步骤。

    3.  **数据收集**：实验涉及一段数据收集期。

    4.  **数据传输**：收集到的数据从数据收集工具转移到更适合分析的其他环境中。到目前为止，我们已经将数据转录到纸上并将数据保存到文件中。

    5.  **分析**：使用适当的技术和软件对从数据收集工具中检索到的数据进行分析。

    6.  **报告**：我们制作了可视化图表，并看到了数据如何以对话式事实的形式呈现。

    7.  **反思**：从实验中汲取经验教训，以改进未来的设计。


    到目前为止，我们数据科学工具箱中最大的弱点在于第 4 步。我们将数据写在纸上，并使用`micro:bit`的持久内存来记录数据，但这两种方案的可扩展性都不太好。为了收集数量更大的数据，我们需要找到其他方法将数据从基于`micro:bit`的数据收集工具传输到分析软件中。正是在这里，物联网将向我们证明其价值。

    '
- fmt: '## 6.2 Internet of Things Overview


    Before we can find a role for IoT in our data science experiments we need to have
    a clear and simple understanding of what IoT actually is. And not a technical
    understanding; there are other books for that. We need to understand how IoT can
    be useful to us in our data science work; then we’ll learn how to utilize it.


    To understand the Internet of Things it helps to first consider the “Internet
    of Everything” and the “Internet of Humans.”^([⁸](#fn8)) `Figure` [`6-1`](#486852_1_En_6_Chapter.xhtml#Fig1)
    shows all the computers in the world that are connected to each other: the Internet
    of Everything.


    ![../images/486852_1_En_6_Chapter/486852_1_En_6_Fig1_HTML.jpg](images/486852_1_En_6_Chapter/486852_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    The Internet of Everything: all the connected computers in the world


    In `Figure` [`6-1`](#486852_1_En_6_Chapter.xhtml#Fig1) the blocks highlighted
    in red represent the computers and smart devices that humans use to access Facebook,
    YouTube, email, online banking, and so on. This is the “Internet of Humans”: all
    of our experiences on a browser or a connected app occur on these devices.


    The smart devices that make up the Internet of Things are all the blocks that
    are not highlighted in red in `Figure` [`6-1`](#486852_1_En_6_Chapter.xhtml#Fig1).
    These devices go about their business and interact with each other without any
    need for direct human intervention.


    The IoH and IoT are very similar:


    *   The Internet of Humans (IoH) is built so that **people** can understand it:
    data is presented to us in a way that we find easy to digest and, where we are
    required to interact with the IoH, it is usually made quite easy for us.


    *   The Internet of Things (IoT) is built in a way that **machines** can easily
    understand it: it is designed to allow data to be moved around from one place
    to another quickly and efficiently.


    The IoH and IoT are not distinct and separate systems:


    *   There isn’t separate infrastructure for the IoH and IoT: just like trucks
    and cars drive on the same roads, so data for both travels over the same networks.


    *   There is a lot of overlap: the IoH uses services and accesses data from the
    IoT and is used by humans to control and calibrate the IoT. In some respects the
    IoH is the “front end” of the IoT: it is a window through which we see and interact
    with the IoT.


    There are protocols^([⁹](#fn9)) and technologies that are distinct to IoT and
    IoH. Extending the motoring analogy used earlier, these differences might be compared
    to those between a diesel and a petrol vehicle.


    So, an IoT system is one where there is interaction between two or more machines
    using the Internet, and where there is no human being involved at any stage in
    the process.


    But why would fridges, or houses, or satellites want to share data, and why would
    they do so without involving humans? All sorts of innovative and practical applications
    have been developed, and more and more are being imagined and built:


    *   Smart houses. A lot of homes use heating and lighting, which consume energy
    and cost money. Sensors placed around a home can provide information about which
    parts of the home need to be lit or heated, and a central control unit can adjust
    the levels accordingly.


    *   Smart streetlights are becoming more and more common. Not only do they help
    cut down on unnecessary use of lighting, they are often integrated with monitors
    that report other data – environmental sensors or CCTV cameras are often used.


    *   IoT-enabled health monitors send medical data to AI systems that analyze it
    and send out alerts if any concerning data is observed.


    *   Some buildings have IoT-enabled monitors that record data pertaining to the
    state of the building. If data suggests the building needs maintenance, then details
    will be sent to an engineering team who will come in and undertake an inspection.


    One theme that emerges from the preceding examples is that the IoT serves us:
    it is typical for IoT systems to collect and analyze data and then to perform
    an action that is of benefit to people. It may alert us when undesirable conditions
    are identified, or it may adjust a system to make it less dangerous or more efficient.


    IoT is not the means by which computers take over the world; instead, it is how
    we as humans have delegated great swathes of activity to computers to make our
    own lives easier and more comfortable. For now, at least, computers dance to the
    tune of humans.'
