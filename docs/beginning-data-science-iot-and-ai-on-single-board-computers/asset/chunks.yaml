    # 11.4 使用 Azure 门户创建 IoT 中心


    本节介绍如何使用 Azure 门户创建 `IoT 中心`。


    `IoT 中心`是在边缘设备（此处为气象站，但我们也可能有多个设备）与物联网应用程序之间建立联系的服务。它控制设备对物联网应用程序的访问权限。


    要设置中心，您需要执行以下操作：


    | **订阅：** | 选择用于您的中心的订阅（例如：*即用即付*）。 |

    | --- | --- |

    | **资源组：** | 选择**新建**，填写您要使用的名称（例如：*iot-hubs*），然后选择**确定**。 |

    | **区域：** | 从列表中选择您希望中心所在的区域。选择离您最近的位置，但如果您的区域不可用，请使用显示的默认区域。 |

    | **IoT 中心名称：** | 为您的中心输入一个名称（例如：*your-iot-hub*）。此名称必须全局唯一。如果您输入的名称可用，则会显示一个绿色的勾选标记。为保持唯一性，我们使用了本书的
    ISBN-13 编号（978-1484243565）。 |


    -   登录 Azure 门户（`https://portal.azure.com/`）。

    -   在 Azure 主页上，选择 **+ 创建资源** 按钮。

    -   在**搜索市场**字段中输入 **IoT 中心**。

    -   在**市场**页面上，从搜索结果中选择 **IoT 中心**。

    -   在 **IoT 中心**页面上，选择**创建**。

    -   在**基本**选项卡上，按如下所示填写字段：


    | **定价和缩放层级：** | 选择 F1：免费层级。*注意：每个订阅仅限使用一个免费 IoT 中心。* |

    | --- | --- |

    | **IoT 中心单元数：** | 1 |

    | **Azure 安全中心：** | 关闭 |

    | **高级设置 > 设备到云分区：** | 保留默认值 4 |


    -   完成后，您的**基本**选项卡应如下所示（**图** **11-1**）。


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig1_HTML.jpg](img/486852_1_En_11_Fig1_HTML.jpg)


    图 11-1


    配置基本选项卡


