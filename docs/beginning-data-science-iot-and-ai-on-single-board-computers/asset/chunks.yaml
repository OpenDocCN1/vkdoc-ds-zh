    Azure Machine Learning Studio is set up and ready to go. Before our IoT application\
    \ is complete, we need to define how the services we are using will all work together\
    \ and how the data will be passed from each component of our application to the\
    \ next: we need to set up the **workflow**.\n\n## 11.6 Creating a Workflow Using\
    \ Azure Logic Apps\n\nLet’s take stock of what we have done so far:\n\n1.  We\
    \ set up an account with **Azure** to access its cloud services.\n\n2.  We configured\
    \ an **IoT hub** so that we could communicate data between Azure and our weather\
    \ station.\n\n3.  We launched **Azure ML Studio**, chose a weather prediction\
    \ model, and then set it up ready to use.\n\nSo far there are three separate components/services\
    \ that we need to get to work together: our weather station instrument, our IoT\
    \ Hub, and the ML Studio model/experiment. A more sophisticated experiment than\
    \ this may have multiple data sources and may use a variety of services/add-ons.\
    \ Workflow tools are used to help manage complex projects with lots of moving\
    \ parts: in essence they ensure that steps are undertaken in the right sequence.\n\
    \nIn this section we build a workflow using **Azure Logic Apps** . This app will\
    \ regularly check to see if data is being sent from our weather station. When\
    \ new data is detected, this app sends it to the weather prediction model (hosted\
    \ on Azure ML Studio) through a web service. It will also receive responses from\
    \ the ML service, convert (**parse**) them to a format we specify, and then send\
    \ the result back to our weather station device.\n\nFollow the steps listed here\
    \ to create a new logic app:\n\n*   From the Azure home page, under **Azure services**,\
    \ click **Create a resource**.\n\n*   On the **New** page, under **Azure Marketplace**,\
    \ click **Integration** and then click **Logic App** (**Figure** [**11-14**](#486852_1_En_11_Chapter.xhtml#Fig14)).\n\
    \n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig14_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig14_HTML.jpg)\n\
    \n    Figure 11-14\n\n    Selecting Logic App resource\n\n*   On the **Logic App**\
    \ pane, provide details about your logic app as shown in **Figure** [**11-15**](#486852_1_En_11_Chapter.xhtml#Fig15).\
    \ After you’re done, click **Review + Create** to validate your details.\n\n \
    \   ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig15_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig15_HTML.jpg)\n\
    \n    Figure 11-15\n\n    Details of the Basics tab\n\n*   If the information\
    \ you provided is correct, click **Create**. This will start to deploy your logic\
    \ app. This may take a few moments.\n\n*   Click **Go to resource** for your deployed\
    \ logic app (**Figure** [**11-16**](#486852_1_En_11_Chapter.xhtml#Fig16)).\n\n\
    \    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig16_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig16_HTML.jpg)\n\
    \n    Figure 11-16\n\n    Deployment confirmation message\n\nTip\n\nYou can also\
    \ find and select your logic app by typing the name in the search box.\n\n*  \
    \ The **Logic Apps Designer** opens and shows a page with an introduction video\
    \ and commonly used triggers.\n\n*   Scroll down the page. Under **Templates**,\
    \ click **Blank Logic App**.\n\n## 11.7 Setting Up the workflow\n\nWe will now\
    \ review the workflow that we have just created and will ensure each step is configured\
    \ properly.\n\nThere are five basic actions/steps/events that are managed by the\
    \ Azure Logic App and which are key to the workflow; whatever service you use\
    \ to implement ML, there will be an equivalent to each of these steps:\n\n1. \
    \ Sending data from the weather station instrument\n\n2.  Passing the data into\
    \ the ML service\n\n3.  Interpreting (“parsing”) results from the ML service\n\
    \n4.  Setting up a variable to store the data from the ML service\n\n5.  Managing\
    \ and sending this data back to the weather station instrument\n\nWe will review\
    \ each of these steps in more detail."
