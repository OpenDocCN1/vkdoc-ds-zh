    \nFigure 11-12\n\nInput modal box for entering temperature and humidity values\
    \ manually\n\n- 预测结果将显示在底部菜单上方。点击 **DETAILS** 查看完整结果。它看起来应该类似于 **Figure** [**11-13**](#486852_1_En_11_Chapter.xhtml#Fig13)。\n\
    \n![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig13_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig13_HTML.jpg)\n\
    \nFigure 11-13\n\nResponse result\n\n**response result** 显示了当您输入的测试变量被处理时，ML 服务将返回的数据。结果（数组）中有四个关键数据点：\n\
    \n| 32 | The temperature value (the test value provided) |\n| 70 | The humidity\
    \ value (the test value provided) |\n| Yes | Binary probability of rain: Yes if\
    \ index >0.5 and No if less than that |\n| 0.641514122486115 | Index of probability\
    \ of rain |\n\n- **CLOSE** the result section.\n\n测试应该可以正常工作。如果不行，请尝试删除 Web 服务并重新部署，或重新导入实验。\n\
    \nAzure Machine Learning Studio 已设置好并准备就绪。在我们的 IoT 应用程序完成之前，我们需要定义我们正在使用的服务将如何协同工作，以及数据将如何从应用程序的每个组件传递到下一个组件：我们需要设置**workflow**。\n\
    \n## 11.6 Creating a Workflow Using Azure Logic Apps\n\n让我们回顾一下我们到目前为止所做的工作：\n\
    \n1.  我们设置了一个**Azure**帐户以访问其云服务。\n2.  我们配置了一个**IoT hub**，以便我们可以在 Azure 和我们的气象站之间通信数据。\n\
    3.  我们启动了**Azure ML Studio**，选择了一个天气预测模型，然后将其设置为可供使用。\n\n到目前为止，有三个独立的组件/服务需要协同工作：我们的气象站设备、IoT\
    \ Hub 和 ML Studio 模型/实验。比这更复杂的实验可能有多个数据源，并可能使用各种服务/附加组件。工作流工具用于帮助管理具有许多动态部分的复杂项目：本质上，它们确保步骤按正确的顺序执行。\n\
    \n在本节中，我们使用**Azure Logic Apps**构建一个工作流。此应用程序将定期检查我们的气象站是否正在发送数据。当检测到新数据时，此应用程序将通过\
    \ Web 服务将其发送给天气预测模型（托管在 Azure ML Studio 上）。它还将接收来自 ML 服务的响应，将其转换（**parse**）为我们指定的格式，然后将结果发送回我们的气象站设备。\n\
    \n按照此处列出的步骤创建一个新的逻辑应用：\n\n- 在 Azure 主页上的 **Azure services** 下，点击 **Create a resource**。\n\
    - 在 **New** 页面的 **Azure Marketplace** 下，点击 **Integration**，然后点击 **Logic App**（**Figure**\
    \ [**11-14**](#486852_1_En_11_Chapter.xhtml#Fig14)）。\n\n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig14_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig14_HTML.jpg)\n\
    \n    Figure 11-14\n\n    Selecting Logic App resource\n\n- 在 **Logic App** 窗格中，提供有关逻辑应用的信息，如\
    \ **Figure** [**11-15**](#486852_1_En_11_Chapter.xhtml#Fig15) 所示。完成后，点击 **Review\
    \ + Create** 来验证信息。\n\n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig15_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig15_HTML.jpg)\n\
    \n    Figure 11-15\n\n    Details of the Basics tab\n\n- 如果提供的信息正确，点击 **Create**。这将开始部署你的逻辑应用。这可能需要一些时间。\n\
    - 点击 **Go to resource** 以访问已部署的逻辑应用（**Figure** [**11-16**](#486852_1_En_11_Chapter.xhtml#Fig16)）。\n\
    \n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig16_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig16_HTML.jpg)\n\
    \n    Figure 11-16\n\n    Deployment confirmation message\n\n提示\n\n您也可以通过直接在搜索框中输入名称来查找并选择您的逻辑应用。\n\
    \n- **Logic Apps Designer** 将打开，并显示包含介绍视频和常用触发器的页面。\n- 向下滚动页面。在 **Templates**\
    \ 下，点击 **Blank Logic App**。\n\n## 11.7 Setting Up the workflow\n\n我们现在来审查刚刚创建的工作流，并确保每个步骤都配置正确。\n\
    \nAzure Logic App 管理着五个基本操作/步骤/事件，它们是工作流的关键；无论您使用什么服务来实现 ML，都会有与这些步骤等同的步骤：\n\n\
    1.  从气象站设备发送数据\n2.  将数据传递到 ML 服务\n3.  解释（“parsing”）来自 ML 服务的结果\n4.  设置一个变量来存储来自\
    \ ML 服务的数据\n5.  管理并将此数据发送回气象站设备\n\n我们将更详细地审查每个步骤。"
