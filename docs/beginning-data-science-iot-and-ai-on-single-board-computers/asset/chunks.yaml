    ## 前言


    我在英国广播公司（BBC）工作了 17 年，一直在 BBC 的学习部门。该部门负责为正式学习（学生、教师和学校）以及所有只想学习新知识的人（即所谓的非正式学习）开发学习材料。在我
    BBC 职业生涯的最后阶段，我负责管理 BBC 学习部门的创新团队，正是根据 BBC 激发受众参与编程、计算机技术和数字创意的雄心，我在该团队中创造了 BBC
    micro:bit。


    在领导创新团队期间，我对三种素养深感兴趣：数字素养、媒介素养和数据素养。我相信这些素养对我们至关重要，因为它们归根结底关乎公民身份，关乎为社会公民提供理解社会与文化、安全地生活其中并有意义地为之贡献力量，以及帮助塑造这些社会与文化未来的工具。在我们生活的这个世界里，计算机和数字技术占据核心地位，并且深度依赖数据，在我看来，数字素养和数据素养是任何公民的基本要求；没有这些素养，他们就会被剥夺权利，而任何能帮助他们有效获得这些素养的资源都是非常必要的。


    BBC 及其合作伙伴开发了 BBC micro:bit，旨在帮助儿童掌握数字素养：为年轻人提供一种简单、有趣且引人入胜的方式，来发展数字技能和创造力，且这种学习是物理性的——他们可以握在手中——并且成本低廉，足以免费赠送。BBC
    micro:bit 从一开始就被设计成一个学习工具，一个能帮助年轻人开始编码、制作和构建的设备，帮助他们思考自己想要创造的东西，并具备实现其抱负的技能和工具。其核心目标是支持新一代技术先驱的培养，帮助今天的年轻学习者成为我们社会的创造者，而不仅仅是消费者。


    在 BBC 工作时，我从未有机会开始思考解决数据素养的问题；然而，我确实满意地认为 BBC micro:bit 在这方面也可能是一个有用的学习工具。该设备被设计用于多种不同的课程，显而易见的如计算机科学、科学、数学以及设计与技术，不太明显的如艺术、音乐和舞蹈。我们的想法是，在计算机科学课程中，它将帮助学生理解计算机如何工作以及如何编程。然而，在其他课程中，其用途则有所不同。在科学和数学课程中，我们认为
    micro:bit 将能够收集和分析科学数据。对于设计与技术课程，micro:bit 是一个发明工具——一个能够收集环境或控制数据，并利用这些数据来指导产品各个元素的设备。对于艺术、音乐和舞蹈课程，micro:bit
    是一个表演工具，一个能收集各种表演数据（如手臂的运动）并将其转化为艺术输出（如音乐声、灯光的颜色或强度、画笔的移动等——任何艺术家/表演者想要的）的设备。所有这些“其他”课程中所使用的关键
    micro:bit 始终是一样的——数据的收集、分析和利用。


    当合作伙伴开发 BBC micro:bit 时，存在着一种巨大的诱惑，即制造一个能做所有事情的设备，因此它配备了所有可能的芯片和传感器。最终我们意识到，这不仅是成本问题——micro:bit
    必须尽可能便宜——而且是一个学习和社区问题。micro:bit 必须留有空间——它必须具有内置的局限性——这样其他人才能开发它，增加它的功能，使其更适合自己的需求，并使其对他们想做的事情有用。


    所有这些都使得看到这本优秀的著作令人如此满足。作者们完全按照我们的期望使用 micro:bit，将其作为众多赋能工具之一（希望是非常简单的一个），来帮助学习者理解成为一名数据科学家意味着什么，同时他们也认识到
    BBC micro:bit 并非完美适用于其任务。它需要被扩展、被构建——为此，他们巧妙地使用了 XinaBox——同时确保始终存在替代方案，包括如何编写代码。在做到这一切的同时，他们也像
    BBC micro:bit 一样，认识到使用他们书籍的人是学习者，是新手。一开始的事情必须简单；不能让核心任务不必要的东西立刻使学习者负担过重，因此他们确保诸如电路搭建和计算机编程等知识不会成为使用这本书的障碍。从个人层面看，我也非常喜欢这本书背后的精神。作者认为，回答生活中所提出问题的核心驱动力是人类的好奇心，是求知若渴的头脑，并且，尽管他们没有明确使用这个词，数据素养是我们所生活的这个世界的一项关键技能。


    正如本书所说，“我们都是数据科学家。在日常生活中，我们常常不知不觉地消费数据。我们不断利用呈现在我们面前的信息来做决定、制定计划，甚至只是进行交谈……理解如何阅读和利用数据，在当今这个数据驱动的社会中是一项关键技能。”


    > 霍华德·贝克，2019 年 10 月 9 日


    ## 关于作者

