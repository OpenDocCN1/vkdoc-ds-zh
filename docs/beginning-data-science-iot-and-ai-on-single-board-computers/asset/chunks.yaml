    # 使用其他分析函数


    数据分析远不止寻找相关性，大多数电子表格程序都提供了丰富的函数供你使用。


    完成**表****5-4**中的练习来回答这些问题：


    **表 5-4** 在电子表格中使用关键统计函数


    | 步骤 | 操作内容 | 备注 |

    | --- | --- | --- |

    | 1 | 在电子表格程序中打开**表****5-3**中的文件。 | 我们将查找关于温度和压力数据的更多信息。 |

    | 2 | 在指定的单元格中输入以下内容：`D2`: 最大压力 =`D3`: 最小压力 =`D4`: 压力范围 =`D5`: 平均压力 =`D6`: 众数压力
    =`D7`: 最高温度 =`D8`: 最低温度 =`D9`: 温度范围 =`D10`: 平均温度 =`D11`: 众数温度 = | 这些是标签：我们输入它们是为了帮助跟踪数据。我们将在它们旁边输入与标签对应的公式。
    |

    | 3 | 输入以下内容：`E2`: `=MAX(B1:B42)``E7`: `=MAX(A1:A42)` | 找出最高温度和压力。 |

    | 4 | 输入以下内容：`E3`: `=MIN(B1:B42)``E8`: `=MIN(A1:A42)` | 找出最低温度和压力。 |

    | 5 | 输入以下内容：`E4`: `=D2-D3``E9`: `=D7-D8` | 用最大值减去最小值得到范围。 |

    | 6 | 输入以下内容：`E3`: `=AVERAGE(B1:B42)``E8`: `=AVERAGE(A1:A42)` | 找出平均温度和压力。 |

    | 7 | 输入以下内容：`E3`: `=MODE(B1:B42)``E8`: `=MODE(A1:A42)` | 找出温度和压力的众数。这是最常见的值——即重复次数最多的值。
    |

    | 8 | 保存你的工作。 | 我们将在下一节中使用这个电子表格来帮助创建可视化图表。 |


    - 温度和压力的最高值和最低值各是多少？

    - 该期间的平均温度和压力是多少？

    - 温度和压力各自最常见的单个读数是多少？


    # 使用可视化工具


    大多数电子表格程序都提供生成可视化的工具，这些通常包括一些标准图表类型（例如，折线图、柱状图和饼图）。在不同的程序中，生成和编辑图表的方式类似，而且在线支持通常很好。我们将按照以下步骤生成一个非常简单的折线图来显示我们的温度和湿度数据，你应该能够在所使用的任何电子表格程序中按这些步骤操作：


    1.  突出显示电子表格中的两列数据。

    2.  点击**插入**。

    3.  找到**图表**选项并点击。

    4.  选择列出的第一个**折线图**选项。


    这将为你生成一个基础的折线图，可能足以满足你的需求。你可以通过多种方式编辑图表，具体方式因程序而异，但只要遵循这些简单的指导原则，你应该就能顺利操作：


    -   要选择图表的特定部分，请点击它。通常会出现某种视觉指南（例如，角落的标记）来显示你选择了什么。

    -   如果你想编辑图表上的某个内容，请选择它，然后右键单击。查找包含**编辑**一词的选项。点击它。

    -   尝试各种设置——你不会弄坏任何东西。

    -   如果对结果不满意，可以重新开始。


    我们的图表如**图****5-5**所示。我们省略了具体的时间；时间通常显示在底部的 x 轴上。看看你是否能通过观察数据猜出黎明破晓的时间。


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig5_HTML.jpg](img/486852_1_En_5_Fig5_HTML.jpg)


    **图 5-5** 一张显示 24 小时内温度和压力的折线图。2019 年 9 月在英国拍摄。


    # 报告


    我们对温度和压力数据的分析产生了一些结果。我们获得了相关性得分、最大值、最小值、范围、平均值以及一个可视化图表。但是，在结果被整理成文并提交报告给我们的**利益相关者**之前，我们的实验尚未完成。这些人是代表他们进行数据科学实验的对象——可能是我们的雇主、一个慈善基金会或一个投资者。即使我们是为自己而做，一篇博客或社交媒体更新也是一种报告形式。


    你整理这份报告的方式将取决于你使用的软件，但无论采用何种方式，都有一些有用的指导原则值得尝试遵循：


    -   包含你实验的简要总结。

    -   显示样本大小——你收集了多少个数据点。

    -   尽量将所有内容放在一页内。

    -   不要使用技术性语言——用通俗易懂的英语展示结果。

    -   添加你的可视化图表。


    我们的报告如**图****5-6**所示。


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig6_HTML.jpg](img/486852_1_En_5_Fig6_HTML.jpg)


    **图 5-6** 一份展示实验概览的单页报告

