- fmt: '# 1.4 Controlling Data


    In this section we begin to design an experiment to investigate the temperature
    at different locations around your home or school (or similar place of interest).
    On the surface, this is an easy sounding assignment, but we will take some time
    to look at ways in which we can ensure our experimental design is of a high quality.


    To gather data involves walking around taking temperature readings at various
    locations. In simple terms the process will go like this:


    1. Equip yourself with a list of locations and a thermometer.

    2. Walk to a specified location.

    3. Look at the thermometer.

    4. Write down the temperature.

    5. Go back to 2 and repeat until all locations have been measured.


    This plan is simple but it has flaws. **Exercise 1-1** (outlined in **Table**
    [**1-2**](#486852_1_En_1_Chapter.xhtml#Tab2)) will show that when we measure temperature
    at a single location there are other factors which can influence the readings.
    We will undertake a quick activity that will help identify these **extraneous
    variables**.


    **Extraneous variables** are factors that influence the data we collect but which
    are not related to the thing we are interested in. The ideal is to eliminate these
    from our experiment.


    **Table 1-2** Guidelines for the temperature experiment activity


    | Exercise 1-1 | Controlling extraneous variables |

    | --- | --- |

    | Summary | Demonstrates the way in which extraneous variables can impact our
    readings, as well as ways to control these variables. It also trains us for Exercise
    1-2. |

    | Duration | 5–10 minutes |

    | Step-by-step process | 1. Measure the temperature at different locations 2 in
    a single room. 2. Are there discrepancies in these values, and if so why? 3. Repeat:
    measure again but follow the guidelines outlined in the Additional Instructions
    section. 4. If you experienced discrepancies with the first round of measuring,
    were there similar discrepancies now? 5. Consider the differences in the approaches
    – was it worth the extra effort of the second method? |

    | Additional Instructions | When reading the thermometer the second time (in step
    3), follow this process: • Find a flat, wooden surface that is out of direct sunlight
    and not right next to it. The location should be away from breezes and not in
    any corners. • Place the thermometer down on the flat surface with the scale clearly
    visible. • Step back and wait for 30 seconds. • After 30 seconds read the temperature
    without touching or breathing on the thermometer. |

    | What we will learn | The effect of extraneous variables. How a “sloppy” data
    gathering process can result in unreliable data. The value in identifying and
    controlling extraneous variables and how a margin of error manifests. How a human
    being can have an impact on science. |


    The likelihood is that the preceding activity will have shown discrepancies –
    different temperature readings. How is this possible in a closed room – surely
    the temperature in the room is stable, so why aren’t the readings all the same?
    There are a number of factors that might cause these discrepancies, such as:


    * Putting a thermometer in direct sunlight will result in a higher reading than
    putting it in a shady spot.

    * Holding a thermometer in your hand will impart some heat to it, which will change
    the reading.

    * Some rooms will be naturally warmer/colder in different areas due to air flow
    and density of heat sources (e.g., people).

    * Air sources – things such as a strong breeze, a fan, or an air conditioner –
    will affect the reading.

    * Different thermometers might be calibrated differently, or they may be hard
    to read.


    By detailing the process of reading the thermometer, as we did in the Additional
    Instructions section of the activity, we have reduced the impact of these extraneous
    variables by keeping them consistent across all measurements. In data science
    terminology, we have **controlled** those variables. Some data scientists might
    say that we have eliminated some of the “noise” from the data.


    ## 1.5 Understanding the Tools


    Throughout this book we are going to use increasingly more complex tools to measure
    a variety of different data types. Even with a simple mercury thermometer it is
    important to understand exactly what your tools are measuring.


    A thermometer reads **ambient** temperature – the temperature in the immediate
    vicinity of the thermometer. For this experiment we want to measure the temperature
    in a location (such as a room), but what we are actually measuring is the temperature
    in a limited area around the thermometer.


    Understanding how a measuring tool works allows us to identify factors that might
    influence our readings – that might impact on the quality of our data. Our thermometer
    measures ambient temperature, not the temperature of a room; we need to look out
    for factors that might make this ambient temperature different from the room temperature.
    We need to ensure that the small area of space we actually measure is typical
    of the wider space that we are interested in. We can use this knowledge to design
    data collection strategies that provide higher-quality data.'
