- fmt: '## 4.4 Transferring Files onto a Computer


    The purpose of learning how to write data to a file is to allow us to use some
    of the powerful analysis tools that are available on our computers. We just need
    to move the file off of the `micro:bit` and onto our computer first. The process
    for doing so is outlined in Table [4-5](#486852_1_En_4_Chapter.xhtml#Tab5).


    **Table 4-5** Extract a file from Mu and then open it and view its contents


    | Step | Description |

    | --- | --- |

    | 1 | On the Mu toolbar, click **Files**. |

    | 2 | Drag and drop the `hello.txt` file created earlier from “**Files on your
    micro:bit**” to the “**Files on your computer**”. The file will copy onto your
    computer’s hard drive from the `micro:bit` storage and will show under “**Files
    from your computer**”. |

    | 3 | In the “**Files from your computer**” pane, right-click the `hello.txt`,
    and then from the shortcut menu, click **open**. The file will open with the default
    app installed on your computer for working with text files. |

    | 4 | Inspect the file when it opens and confirm that it contains the words “Hello
    world!”. |

    | 5 | Exit from the application. |


    You can also access the file via whatever **File Explorer** you use on your computer.
    The file is saved in the same folder that Mu saves files to by default.


    We have now written a file to the `micro:bit` memory and then extracted that file
    and opened it on our computer. We know everything we need to use the file system
    in our experiment.


    ## 4.5 Hardware Requirements


    The components that our digital instrument will need to include are shown in **Figure**
    [**4-1**](#486852_1_En_4_Chapter.xhtml#Fig1).


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig1_HTML.jpg](images/486852_1_En_4_Chapter/486852_1_En_4_Fig1_HTML.jpg)


    **Figure 4-1** A digital tool for reading weather data and saving it to a file


    **Table** [**4-6**](#486852_1_En_4_Chapter.xhtml#Tab6) lists the specific hardware
    that we will use to build our weather station tool.


    **Table 4-6** Hardware requirements for the weather station tool


    | What you need | What we use | Qty | Alternatives |

    | --- | --- | --- | --- |

    | A microprocessor and the means to flash code onto it | `micro:bit` with micro-B
    USB cable to connect to laptop/desktop | 1 | Raspberry Pi, Circuit Playground
    |

    | Power | The `micro:bit` battery holder | 1 | Seenov Inc Solar Battery |

    | A sensor to read weather data | XinaBox SW01 – advanced weather sensor | 1 |
    SparkFun Weatherbit |

    | Persistent memory | `micro:bit` onboard memory | 1 | XinaBox IM01 `micro:bit`
    bridge (SD card) |

    | The means to connect it all together | XinaBox IM01 `micro:bit` bridge | 1 |
    Breadboard, edge connector breakout, crocodile/alligator leads, and hookup wires
    |

    | xBus connectors | 1 |


    ## 4.6 Storing Sensor Data in a File


    When we write data to a text file we can write whatever we want: any numbers or
    letters we like. We could store the sensor data in plain text in a format that
    is easily readable, like **Figure** [**4-2**](#486852_1_En_4_Chapter.xhtml#Fig2).


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig2_HTML.jpg](images/486852_1_En_4_Chapter/486852_1_En_4_Fig2_HTML.jpg)


    **Figure 4-2** Screen grab of a text file containing sensor data


    With this approach a lot of the file space would be taken up with the words like
    “Temperature”, “Humidity”, “Pressure”, and “degrees”: they help to make the file
    readable but they take up space in the file. Every character we write to the file
    “costs” us some space, and if memory is tight on the `micro:bit` (which it is,
    as we will see), we need to ditch redundant data.


    The hardest decision that we have to make is to not collect humidity data: who
    knows what interesting observations may emerge in the analysis stage? But as you
    will see in the upcoming sections, the amount of memory we have on the `micro:bit`
    is very limited. Our experiment is designed to analyze the relationship between
    pressure and temperature, so we make the decision to omit humidity because it
    cannot help us answer the specific objective of the experiment. Memory space on
    the `micro:bit` file system is precious and every character we save has to earn
    its keep.


    The core issue with the file shown in **Figure** [**4-2**](#486852_1_En_4_Chapter.xhtml#Fig2)
    is that it is a bespoke format that we have “invented” for this experiment. This
    is an unusual way to store data in a file, and it will be tricky to open it on
    software that has no way of recognizing the format we created. We can read it
    easily but computers would struggle to.


    Instead we will make use of a tried and tested file format: we are going to create
    a **comma-separated values** (or **CSV**) **file**. Writing our data in this format
    will ensure that we can open the file in a spreadsheet program: the data will
    import automatically as a table, which will be perfect for our analysis.


    CSV files have to follow a number of conventions:


    - Each line of the **file** is a **record**. An end-of-line character indicates
    the end of a record.

    - A record is a collection of **fields**: for us this means each record will include
    a value of temperature and pressure.

    - Each value in the file is separated by a comma.


    **Figure** [**4-3**](#486852_1_En_4_Chapter.xhtml#Fig3) shows the same file from
    **Figure** [**4-2**](#486852_1_En_4_Chapter.xhtml#Fig2), but with the data records
    written in CSV format.


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig3_HTML.jpg](images/486852_1_En_4_Chapter/486852_1_En_4_Fig3_HTML.jpg)


    **Figure 4-3** Data file with records recorded in CSV style


    To ensure we construct our file in a CSV-valid way, when we write each record
    to file, we will do so as follows:


    1. Start a new line in our file (or a “new record”).

    2. Write the temperature value to the file.

    3. Write a comma to the file.

    4. Write pressure to the file.

    5. Write an end-of-line character.


    If we follow this process, when we open our `csv` file in a text editor, it will
    look something like **Figure** [**4-4**](#486852_1_En_4_Chapter.xhtml#Fig4).


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig4_HTML.jpg](images/486852_1_En_4_Chapter/486852_1_En_4_Fig4_HTML.jpg)


    **Figure 4-4** Data saved in CSV format viewed in a text editor


    Using the `micro:bit` file system presents us with another challenge. As more
    and more data is **written** (or **appended**) to a file, eventually the `micro:bit`
    will be unable to write any more data to it: an upper limit of file size will
    be reached. Despite the `micro:bit` having approximately **30 KB** of memory reserved
    for file storage, it is not capable of writing files that size in the way we want
    it to. Other factors, such as the working memory of the `micro:bit`, are also
    limiting factors.


    The way the `micro:bit` file system works is that when you write anything to a
    file you overwrite everything that is already in the file. This means that when
    we want to append more data to a file, we have to read all the data already in
    the file into a variable, and then add the additional data we want to append to
    the variable. Then we write the entire contents of the file, with the new record
    added, back into the file. The most common limiting factor when writing data to
    file is the ability of the `micro:bit` to store the entire content of the file
    to a single variable.'
