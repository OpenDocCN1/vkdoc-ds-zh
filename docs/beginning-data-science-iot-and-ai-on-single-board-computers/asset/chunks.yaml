- fmt: '# 4.7 Measuring How Many Data Points We Can Store


    Our experimental design states that we should “gather as much temperature and
    pressure data as we can”. It would be helpful to know how much data we can store
    on a micro:bit:


    - If we can store 100 data points on our micro:bit, that means we should take
    one reading roughly every 14 and a half minutes over a 24-hour period.

    - If we can store 1000 data points on our micro:bit, that means we can take one
    reading roughly every 90 seconds.

    - If we can store 10,000 data points on our micro:bit, that means we can take
    one reading roughly every 9 seconds.


    To find out the capacity of the micro:bit, we will write code that will bombard
    it with data until it breaks, and then we’ll see how much data we managed to save
    before it stopped working. Fun! And don’t worry, the micro:bit will be fine.


    We are going to write a program that fills up a file very quickly – in seconds
    rather than 24 hours. We will program the micro:bit to read temperature and pressure
    data from a SW01 and write it to a CSV file, and to continue doing so until it
    is no longer able to.


    The natural language code in Table 4-7 shows the steps we need to tell the micro:bit
    to follow.


    **Table 4-7** Natural language code for measuring the data points


    | Step | Natural language code | Notes |

    | --- | --- | --- |

    | 1 | Import any libraries that are required. | We’ll need the core micro:bit
    library as well as the library for our weather sensor. |

    | 2 | Initialize our weather station. | Most sensors and add-ons for micro:bit
    need to be “initialized” before they can be used. |

    | 3 | Stop if there is a data file already in the micro:bit storage. | If there
    is a data file already in the micro:bit, display “x” on the micro:bit and then
    exit from the code. Otherwise continue executing the code. |

    | 4 | Create a file and open it for writing. | This is the file we write data
    to. |

    | 5 | Keep repeating the following steps. | We will keep on reading and writing
    data until the program crashes! |

    | 6 | Read the content of the file into a variable. | We can’t just add data to
    the file – when we write anything to file, it overwrites what is already in the
    file. So we need to first copy the existing content of the file to a variable.
    |

    | 7 | Read the weather sensor for temp and humidity. | We’ll add (“append”) the
    following to the variable: `temperature, humidity [new line character]` |

    | 8 | Write the content of the variable back to the file. | This will write the
    content of the variable to persistent memory, overwriting the existing file. |


    **No-code option**: You can find a fully working version of the precompiled code
    used here on our resource website. Go to `http://xib.one/XB` and search for Section
    4.7.


    **Note**: This code requires the SW01 MicroPython library to function. Follow
    these steps:


    1. Download the SW01 library (see the resource website).

    2. Flash the precompiled code onto the micro:bit.

    3. Copy the SW01 library onto the micro:bit.


    **Warning**: Ensure that you undertake these steps in the order listed.


    Table 4-8 shows how to convert the natural language code into MicroPython code
    that can be compiled and loaded onto your micro:bit.


    **Table 4-8** Developing code with MicroPython


    | Step | Description |

    | --- | --- |

    | 1 | Type the following:<br> `from microbit import *`<br> `from SW01 import SW01`<br>
    `import os`<br> `import sys`<br> This will import all the required libraries to
    your program. |

    | 2 | `SW01 = SW01()`<br> This will initialize (or “instantiate”) the SW01 library.
    |

    | 3 | `d = 0`<br> `try:`<br> `d = os.size("we.csv")`<br> `except:`<br> `pass`<br>
    `if (d > 0):`<br> `display.show("*")`<br> `sys.exit()`<br> When the micro:bit
    powers up, if there is already a file called `we.csv`, then a “x” will display
    on screen and the program will stop running. This ensures we do not overwrite
    the file when we try to retrieve it. |

    | 4 | `open("we.csv", "w")`<br> This will create the file named `we.csv` and open
    it for writing. |

    | 5 | `while True:`<br> This is a loop (like the `forever` block in MakeCode):
    it will keep running until the micro:bit is powered down, or if there is an error
    (in our program it will run until the data file gets too big and causes the micro:bit
    to throw an error). |

    | 6 | `try:`<br> `with open("we.csv") as a:`<br> `cont = a.read()`<br> `cont =
    cont + str(SW01.getTempC()) + "," + str(SW01.getHumidity()) + "\n"`<br> `except:`<br>
    `display.show(".")`<br> `sys.exit()`<br> This will do the following:<br> • Open
    the file for reading.<br> • Copy the content of the file to a variable (`cont`).<br>
    • Read temperature and humidity from the weather sensor.<br> • Append them as
    a record to the end of the content.<br> When the storage gets full during the
    writing, a full stop will be displayed on the LED matrix and the program will
    terminate. |

    | 7 | `with open("we.csv", ''w'') as b:`<br> `b.write(cont)`<br> This will write
    the content of the variable `cont` to the file. |


    The complete MicroPython code listing follows:


    ```

    from microbit import *

    from SW01 import SW01

    import os

    import sys

    SW01 = SW01()

    d = 0

    try:

    d = os.size("we.csv")

    except:

    pass

    if (d > 0):

    display.show("*")

    sys.exit()

    open("we.csv",''w'')

    while True:

    try:

    with open("we.csv") as a:

    cont = a.read()

    cont = cont + str(SW01.getTempC()) + "," + str(SW01.getHumidity()) + "\n"

    except:

    display.show(".")

    sys.exit()

    with open("we.csv", ''w'') as b:

    b.write(cont)

    ```


    When the code runs, a file will be created on the micro:bit and a new record will
    be continually appended to the end of the file. Follow these steps to see how
    many records were written before the micro:bit stopped:


    Flash the code to your micro:bit. The code will begin to run once the flashing
    completes.


    Wait for code to stop running, indicated by an LED as shown in Figure 4-5.


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig5_HTML.jpg](images/486852_1_En_4_Chapter/486852_1_En_4_Fig5_HTML.jpg)


    **Figure 4-5** The LED shown turns on to indicate that data recording has stopped


    Extract the file and open it as shown earlier.


    Scroll to the end of the file and check how many rows were written – write this
    number down.


    Repeat a few times (first delete the data file from the micro:bit storage and
    then restart the micro:bit). You could try different micro:bits if you have more
    than one, or get other people to try too. It will vary from person to person and
    from time to time, but it is likely you will be able to store between 50 and 60
    records.


    We found that it was possible to store 50 records quite reliably.


    Take a look again at the code we wrote in step 3 of Table 4-8. This code prevents
    an existing data file from getting added to or overwritten. If your micro:bit
    displays a small “x”, that means this “software lock” code was activated and an
    existing data file was detected on the micro:bit (Figure 4-6). You will need to
    delete the file from the micro:bit file system to continue.


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig6_HTML.jpg](images/486852_1_En_4_Chapter/486852_1_En_4_Fig6_HTML.jpg)


    **Figure 4-6** The small x indicates that a data file is already in the file system


    **EASY INFO CODES**


    `x` = A data file is already in the storage. No data recording happens.


    `.` = Data recording is completed. Extract the data file from the storage.'
