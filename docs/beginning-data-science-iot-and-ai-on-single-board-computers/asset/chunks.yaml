    this section on our **resource website**. Go to [`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)
    and search for **Section 4.1**.


    **Table** [**4-3**](#486852_1_En_4_Chapter.xhtml#Tab3) lists MicroPython code
    that implements the **natural language code** in **Table** [**4-2**](#486852_1_En_4_Chapter.xhtml#Tab2).


    Table 4-3


    Writing “Hello, World!” to a file with MicroPython


    | Step | MicroPython |

    | --- | --- |

    | 1&2 | Type the following and press ENTER:`with open(''hello.txt'', ''w'') as
    my_file:`This will create the file named **hello.txt** on the micro:bit storage
    and then open it for you to write into it later. |

    | 3 | Type the following and press ENTER:`my_file.write("Hello, World!")`This
    will write **Hello,World!** to the file. |

    | 4 | The file is closed for us – we do not need to write any code for this. |


    The complete **MicroPython** code for writing **“Hello, World!”** to a file is


    ```

    with open(''hello.txt'', ''w'') as my_file:

    my_file.write("Hello, World!")

    ```


    Compile the code and flash it onto your micro:bit.


    Once the flashing process has completed and the micro:bit resets, a file named
    “**hello.txt**” is created with the content you provided ( “Hello, World!”). In
    the following sections we will show you how to view and access that file.


    The code we have put onto the micro:bit basically tells it how to behave as a
    file storage device: we can now write anything we want to a file, including data,
    and we will be able to retrieve it later.


    This functionality elevates the potential of the micro:bit as a tool for data
    science. File storage enables us to expand our data gathering capabilities and
    perform experiments that might otherwise not be possible. In this chapter we’ll
    look at how to save data from the weather station to file, but the same technique
    could be used with any number of sensors. Your micro:bit could be the basis of
    digital tools that monitor all sorts of environmental measures.


    ## 4.3 Accessing Files on the micro:bit


    Once you have saved data onto a file on your micro:bit the next step is to retrieve
    it and use it on a computer, where sophisticated analysis tools are available
    to us.


    There are a few tools available that we can use to list and access the files stored
    on a micro:bit, including **Mu** and **MicroFS**. We will show you how to use
    Mu to access the file we have just written.


    **Table** [**4-4**](#486852_1_En_4_Chapter.xhtml#Tab4) presents the steps you
    need to follow to use **Mu** to view files on the micro:bit storage.


    Table 4-4


    Listing files on the micro:bit storage with Mu


    | Step | Description |

    | --- | --- |

    | 1 | Connect the micro:bit to your computer using a micro USB cable. |

    | 2 | On the **Mu toolbar**, click the **Files** button. The **Files** pane will
    appear on the bottom of the Mu window. In the **Files** pane, under “**Files on
    your micro:bit**”, you will see the list of files on your micro:bit.![../images/486852_1_En_4_Chapter/486852_1_En_4_Figa_HTML.jpg](images/486852_1_En_4_Chapter/486852_1_En_4_Figa_HTML.jpg)Can
    you see the file you created in the preceding exercise? |

    | 3 | Click the **Files** button again to close the **Files** pane. |


    Caution


    When you flash a code onto the micro:bit using Mu a copy of your MicroPython code
    will save to the persistent storage (main.py). Deleting this file prevents your
    code from running and you need to reflash the micro:bit.'
  trans: '

    ### 4.1 实验设计


    本章将要开展实验，探究我们在第 3 章中观察到的温度与气压之间的相关性。我们将在 24 小时内记录这些测量值，然后分析数据并量化相关性的强度。虽然这听起来与第
    3 章的做法相似，但存在两个关键区别：


    1.  我们将收集更多数据。

    2.  我们将使用软件进行数据分析。


    该实验分为两章：在本章中，我们将搭建并使用 micro:bit 气象站来收集大量数据集；然后在第 5 章中对数据进行分析。表 4-1 描述了我们将如何收集实验所需的数据。


    **表 4-1** 练习 4-1 详情


    | 练习 4-1 | 温度与大气压之间存在相关性吗？ |

    | --- | --- |

    | 概述 | 我们将在 24 小时内尽可能多地收集温度和气压数据，然后进行分析。 |

    | 逐步流程 | 1. 为数据收集仪器找一个合适的位置。确保电量充足。 2. 将仪器放置在选定位置并开机。它将开始记录数据。 3. 24 小时后取回仪器。
    4. 从 micro:bit 中提取数据并加载到计算机上。 5. 使用计算机上的软件进行分析。 |

    | 我们将学到什么 | • 如何在 micro:bit 上使用文件存储。 • 如何构建数据文件。 • 如何使用电子表格进行数据分析。 • 如何量化/测量相关性。
    • 温度与气压的相关强度。 • 什么是统计显著性。 |


    本实验首先需要的是一种能记录 24 小时数据的方法。


    ### 4.2 将 micro:bit 用作文件存储设备


    我们不能指望有人能在一个地方站 24 小时，每隔几分钟就记录一次温度和气压读数。为了消除这种需求，我们将在数据收集过程中将记录的数据保存到文件中，之后再访问该文件。直接将数据保存到文件将使我们能够更高效地组织数据收集过程：打开仪器电源，放置
    24 小时进行数据测量和记录，然后回来取走仪器。随后可以检索文件。


    `MicroPython` 拥有一个文件系统，允许我们在 micro:bit 上保存文件。`MakeCode` 中没有类似选项，因此我们需要用 MicroPython
    为此编写代码。


    使用文件系统的第一步是学习如何将数据写入文件。为此，你只需要一个 micro:bit 和一个电源。


    用 micro:bit 写入文件的**自然语言代码**列于表 4-2 中。


    **表 4-2** 在 micro:bit 上创建并写入文件的自然语言代码


    | 步骤 | 描述 | 备注 |

    | --- | --- | --- |

    | 1 | 创建文件。 | 在 micro:bit 存储中创建一个文件并为其命名。 |

    | 2 | 以写入模式打开文件。 | 文件必须先“打开”才能使用。 |

    | 3 | 写入文件。 | 我们将向文件写入一些任意数据，以便稍后检查代码是否成功。 |

    | 4 | 关闭文件。 | 使用完文件后，务必关闭它。 |


    **无代码选项**：你可以在我们的**资源网站**上找到本节所需代码的完整可用版本。访问 [`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)
    并搜索 **第 4.1 节**。


    表 4-3 列出了实现表 4-2 中**自然语言代码**的 MicroPython 代码。


    **表 4-3** 使用 MicroPython 将“Hello, World!”写入文件


    | 步骤 | MicroPython |

    | --- | --- |

    | 1&2 | 输入以下内容并按回车键：`with open(''hello.txt'', ''w'') as my_file:` 这将在 micro:bit
    存储中创建名为 `hello.txt` 的文件，然后将其打开以便稍后写入。 |

    | 3 | 输入以下内容并按回车键：`my_file.write("Hello, World!")` 这会将 `Hello,World!` 写入文件。 |

    | 4 | 文件会自动关闭——我们无需为此编写任何代码。 |


    将 `“Hello, World!”` 写入文件的完整 `MicroPython` 代码如下：


    ```

    with open(''hello.txt'', ''w'') as my_file:

    my_file.write("Hello, World!")

    ```


    编译代码并将其刷写到 micro:bit 上。


    刷写过程完成且 micro:bit 重置后，将创建一个名为 `“hello.txt”` 的文件，其中包含你提供的内容（`“Hello, World!”`）。在接下来的章节中，我们将向你展示如何查看和访问该文件。


    我们放入 micro:bit 的代码基本上告诉它如何像一个文件存储设备一样运行：现在我们可以将任何我们想要的内容写入文件，包括数据，并且稍后能够检索它们。


    这一功能提升了 micro:bit 作为数据科学工具的潜力。文件存储使我们能够扩展数据收集能力，并执行原本可能无法完成的实验。在本章中，我们将研究如何将气象站的数据保存到文件，但同样的技术可以用于任何数量的传感器。你的
    micro:bit 可以成为监测各种环境指标的数字化工具的基础。


    ### 4.3 访问 micro:bit 上的文件


    将数据保存到 micro:bit 的文件中后，下一步是将其检索出来并在计算机上使用，因为我们可以利用计算机上强大的分析工具。


    有几种工具可用于列出和访问 micro:bit 上存储的文件，包括 `Mu` 和 `MicroFS`。我们将向你展示如何使用 `Mu` 访问刚刚写入的文件。


    表 4-4 列出了使用 `Mu` 查看 micro:bit 存储中文件所需遵循的步骤。


    **表 4-4** 使用 Mu 列出 micro:bit 存储上的文件


    | 步骤 | 描述 |

    | --- | --- |

    | 1 | 使用 micro USB 线将 micro:bit 连接到计算机。 |

    | 2 | 在 `Mu 工具栏`上，单击 `文件` 按钮。`文件` 窗格将出现在 `Mu` 窗口底部。在 `文件` 窗格中，`“micro:bit 上的文件”`
    下方，你将看到 micro:bit 上的文件列表。![../images/486852_1_En_4_Chapter/486852_1_En_4_Figa_HTML.jpg](img/486852_1_En_4_Figa_HTML.jpg)
    你能看到在上一个练习中创建的文件吗？ |

    | 3 | 再次单击 `文件` 按钮以关闭 `文件` 窗格。 |


    **警告**


    当你使用 `Mu` 将代码刷写到 micro:bit 上时，MicroPython 代码的副本会保存到持久存储中（`main.py`）。删除此文件会阻止你的代码运行，你需要重新刷写
    micro:bit。

