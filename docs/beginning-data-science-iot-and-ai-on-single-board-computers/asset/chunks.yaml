    *   **Step 3**: Connect to the IoT platform. This is explained in **Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3).


    There are a number of details from the IoT platform that you need to enter into
    the code. **Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3) explains how
    to find and construct each of the parameters that are used in MakeCode.


    Table 9-3


    Setting parameters for the MakeCode blocks


    | Parameter to set in MakeCode | Where to find/how to create the parameter |

    | --- | --- |

    | To connect to the IoT platform, you need to set the **Client ID** value. | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figa_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figa_HTML.jpg)The
    Client ID consists of 3 parameters that you need to join together (“**concatenate**”)
    in a very specific format. The parameters you need are•    Organization ID•    Device
    type•    Device IDThe format is***d:Organization-ID:Device-Type:Device-ID***When
    you have concatenated the data correctly, it should look something like this:**d:oprah53:XinaBox:xb123456**
    |

    | To connect to the IoT platform, you need to set 3 values in the **Connect to
    the MQTT broker** block. | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figb_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figb_HTML.jpg)You
    need to enter 3 parameters into the **Connect to the MQTT broker** block for this:    1.    The
    **broker URL** (or “connection address”)*Add the* ***organization ID*** *to the
    front of the string “.messaging.internetofthings.ibmcloud.com”**A correct* ***broker
    URL*** *looks like this:***opra53\. messaging.internetofthings.ibmcloud.com**    2.    The
    **user name***The fixed string “use-token-auth” is entered here.*    3.    The
    **password***The password is the* ***Authentication Token*** *specified in the*
    ***Device Credentials*** *section.* |

    | To pass data to the IoT platform, you need to send a **payload** to a specific
    **topic.** | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figc_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figc_HTML.jpg)What
    we send to the IoT platform is referred to as the **payload** and we have to specify
    where we want to send it to: the **topic**.    1.    The **payload**We have to
    concatenate 3 bits to build the payload. Choose a Join block and add the following
    elements:•    {“*[variable name]* ”: “•    The value that you want to send•    ”}So,
    if you are sending temperature data, the join block will look something like this:![../images/486852_1_En_9_Chapter/486852_1_En_9_Figd_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figd_HTML.jpg)
    |

    |   |     2.    The **topic**The topic is a string which tells the IoT platform
    which card to pass the data to, and which data point it is. The format for the
    topic is ***iot-2/evt/<Event>/fmt/json***.A valid topic will look something like
    this:**iot-2/evt/status1/fmt/json**The **<Event>** is the Event name you entered
    when setting up the card, in **Edit Line chart Card > connect data set:**![../images/486852_1_En_9_Chapter/486852_1_En_9_Fige_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fige_HTML.jpg)
    |


    **Table** [**9-4**](#486852_1_En_9_Chapter.xhtml#Tab4) shows how to convert the
    code from **Figure** [**9-20**](#486852_1_En_9_Chapter.xhtml#Fig20) into MakeCode
    blocks using the parameters outlined in **Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3).


    Table 9-4


    Developing code with MakeCode blocks


    | Step | Description |

    | --- | --- |

    | 1 | Start a new project. Add the XinaBox **SW01** and **CW01** extensions. |

    | 2 | Add the **CW01 connect to WiFi** block to the **on start** block.![../images/486852_1_En_9_Chapter/486852_1_En_9_Figf_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figf_HTML.jpg)This
    will connect your CW01 to a Wi-Fi network. |

    | 3 | **Connect to the IoT platform/set Client ID:**•    Add a **CW01 set MQTT
    client ID** block to the **on start** block:![../images/486852_1_En_9_Chapter/486852_1_En_9_Figg_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figg_HTML.jpg)
    |

    | **Connect to the IoT platform/set MQTT broker:**•    Add the following block
    to the **on start** block after **set MQTT client** block:![../images/486852_1_En_9_Chapter/486852_1_En_9_Figh_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figh_HTML.jpg)This
    will connect the weather station to the MQTT broker.**See Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3)
    **for more details.** |

    | 4 | Use the **forever** block. |

    | 5 | Add a **CW01 send payload** block to the **forever** block:![../images/486852_1_En_9_Chapter/486852_1_En_9_Figi_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figi_HTML.jpg)**See
    Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3) **for more details.** |

    | 6 | Adapt the join block shown in step 6 to send humidity data:![../images/486852_1_En_9_Chapter/486852_1_En_9_Figj_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figj_HTML.jpg)The
    rest of the CW01 send payload block remains the same. |

    | 7 | We have not set up our IoT platform to do anything with the pressure data,
    so we have nowhere to send it.If you have set up a card to display the pressure
    data, you should try to adapt the code in step 6 and add it here. |

    |   | Complete the program with a pause to control the rate at which data is transmitted:![../images/486852_1_En_9_Chapter/486852_1_En_9_Figk_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figk_HTML.jpg)
    |


    **Figure** [**9-21**](#486852_1_En_9_Chapter.xhtml#Fig21) shows the full **MakeCode**
    block program.


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig21_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig21_HTML.jpg)


    Figure 9-21


    MakeCode blocks for the Wi-Fi weather station


    The full code is available on our **resource website**. You will need to adapt
    the parameters to work with your IoT Platform, as described in **Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3).'
  trans: '

    # 9.8 为我们的 Wi-Fi 气象站编写代码


    本节我们将编写所需代码，让 micro:bit 像一个数字气象站一样工作；我们首先要设置好物联网平台，因为代码中需要用到平台的详细信息。**图 9-20**
    用自然语言概述了程序流程。


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig20_HTML.jpg](img/486852_1_En_9_Fig20_HTML.jpg)


    **图 9-20** 物联网气象站的自然语言代码


    **图 9-20** 包含两个我们之前未曾接触过的步骤：


    - **第 2 步**：连接到 Wi-Fi 网络。要连接 Wi-Fi 网络，你需要知道其名称（**SSID**）和**密码**。在开始编写代码前，请准备好这些信息。

    - **第 3 步**：连接到物联网平台。相关内容在**表 9-3** 中说明。


    你需要将来自物联网平台的若干详细信息输入到代码中。**表 9-3** 解释了如何查找和构造在 MakeCode 中使用的每个参数。


    **表 9-3** 设置 MakeCode 块的参数


    | 需要在 MakeCode 中设置的参数 | 参数的位置/如何创建参数 |

    | --- | --- |

    | 要连接到物联网平台，你需要设置**客户端 ID** 值。 | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figa_HTML.jpg](img/486852_1_En_9_Figa_HTML.jpg)
    客户端 ID 由 3 个参数组成，你需要按照非常特定的格式将它们连接（“**拼接**”）在一起。需要的参数是： - **组织 ID** - **设备类型**
    - **设备 ID** 格式为：`d:组织 ID:设备类型:设备 ID` 当你正确拼接数据后，结果应类似这样：`d:oprah53:XinaBox:xb123456`
    |

    | 要连接到物联网平台，你需要在**连接到 MQTT 代理**块中设置 3 个值。 | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figb_HTML.jpg](img/486852_1_En_9_Figb_HTML.jpg)
    为此，你需要在**连接到 MQTT 代理**块中输入 3 个参数： 1. **代理 URL**（或“连接地址”）：将**组织 ID** 添加到字符串 `.messaging.internetofthings.ibmcloud.com`
    的开头。 正确的**代理 URL** 如下所示：`opra53.messaging.internetofthings.ibmcloud.com` 2. **用户名**：此处输入固定字符串`use-token-auth`。
    3. **密码**：密码是在**设备凭证**部分中指定的**认证令牌**。 |

    | 要将数据传递到物联网平台，你需要向特定的**主题**发送一个**有效载荷**。 | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figc_HTML.jpg](img/486852_1_En_9_Figc_HTML.jpg)
    我们发送给物联网平台的内容称为**有效载荷**，我们必须指定将其发送到何处：即**主题**。 1. **有效载荷**：我们需要拼接 3 部分来构建有效载荷。选择一个拼接块并添加以下元素：
    - `{"[变量名]": "` - 你想要发送的值 - `"}` 因此，如果你要发送温度数据，拼接块将类似这样：![../images/486852_1_En_9_Chapter/486852_1_En_9_Figd_HTML.jpg](img/486852_1_En_9_Figd_HTML.jpg)
    2. **主题**：主题是一个字符串，它告知物联网平台将数据传递给哪个卡片，以及它是哪个数据点。主题的格式为 `iot-2/evt/<事件>/fmt/json`。一个有效的主题应类似这样：`iot-2/evt/status1/fmt/json`
    `<事件>` 是你在设置卡片时，在**编辑折线图卡片 > 连接数据集** 中输入的事件名称：![../images/486852_1_En_9_Chapter/486852_1_En_9_Fige_HTML.jpg](img/486852_1_En_9_Fige_HTML.jpg)
    |


    **表 9-4** 展示了如何使用**表 9-3** 中列出的参数，将**图 9-20** 中的代码转换为 MakeCode 块。


    **表 9-4** 使用 MakeCode 块开发代码


    | 步骤 | 描述 |

    | --- | --- |

    | 1 | 开始一个新项目。添加 XinaBox **SW01** 和 **CW01** 扩展。 |

    | 2 | 将 **CW01 连接到 WiFi** 块添加到 **on start** 块中。 ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figf_HTML.jpg](img/486852_1_En_9_Figf_HTML.jpg)
    这将使你的 CW01 连接到 Wi-Fi 网络。 |

    | 3 | **连接到物联网平台/设置客户端 ID**： - 将一个 **CW01 设置 MQTT 客户端 ID** 块添加到 **on start** 块中：
    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figg_HTML.jpg](img/486852_1_En_9_Figg_HTML.jpg)
    **连接到物联网平台/设置 MQTT 代理**： - 在 **set MQTT client** 块之后，将以下块添加到 **on start** 块中：
    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figh_HTML.jpg](img/486852_1_En_9_Figh_HTML.jpg)
    这将使气象站连接到 MQTT 代理。**更多详细信息请参见表 9-3。** |

    | 4 | 使用 **forever** 块。 |

    | 5 | 将一个 **CW01 发送有效载荷** 块添加到 **forever** 块中： ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figi_HTML.jpg](img/486852_1_En_9_Figi_HTML.jpg)
    **更多详细信息请参见表 9-3。** |

    | 6 | 修改步骤 6 中所示的拼接块，以发送湿度数据： ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figj_HTML.jpg](img/486852_1_En_9_Figj_HTML.jpg)
    **CW01 发送有效载荷**块的其余部分保持不变。 |

    | 7 | 我们还没有将物联网平台设置为对气压数据进行任何操作，因此我们没有地方发送它。如果你已经设置了一个用于显示气压数据的卡片，你应该尝试修改步骤 6
    中的代码并将其添加到这里。 |

    | | 通过添加一个暂停来完成程序，以控制数据传输的速率： ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figk_HTML.jpg](img/486852_1_En_9_Figk_HTML.jpg)
    |


    **图 9-21** 显示了完整的 **MakeCode** 块程序。


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig21_HTML.jpg](img/486852_1_En_9_Fig21_HTML.jpg)


    **图 9-21** Wi-Fi 气象站的 MakeCode 块


    完整代码可在我们的**资源网站**上找到。你需要按照**表 9-3** 所述，调整参数以使其适用于你的物联网平台。


