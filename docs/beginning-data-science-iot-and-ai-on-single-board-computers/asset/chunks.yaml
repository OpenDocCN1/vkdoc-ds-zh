- fmt: '`## 5.5 Calculating Correlation Scores`


    Follow the steps in **Table 5-2** to find out the correlation scores when comparing
    the different columns we created in **Table 5-1**.


    **Table 5-2** Adding correlation scores to Table 5-1 data


    | Step | What to do | Notes |

    | --- | --- | --- |

    | 1 | Use the same spreadsheet created in Table 5-1. | We are going to type labels
    in Column G and formulae into column H. |

    | 2 | Search online for details of how to use the correlation function in your
    spreadsheet program. | For both Excel and Google Sheets, the formula for the correlation
    score of 2 columns of data is `=CORREL(A1:A100,B1:B100)`. |

    | 3 | In cell G1, type **Correlation of A and B**. In H1 type in `=CORREL(A1:A100,B1:B100)`.
    | This compares the data in Column A with the data in Column B. Once you have
    entered the formula, you will see the result. Is it what you expected? |

    | 4 | In cell G2, type **Correlation of A and C**. In H2 type in `=CORREL(A1:A100,C1:C100)`.
    | This compares the data in Column A with Column C. Once you have entered the
    formula, you will see the result. Is it what you expected? |

    | 5 | In cell G3, type **Correlation of A and D**. In H3 type in `=CORREL(A1:A100,D1:D100)`.
    | This compares the data in Column A with the data in Column D. Once you have
    entered the formula, you will see the result. Is it what you expected? |

    | 6 | In cell G4, type **Correlation of A and E**. In H4 type in `=CORREL(A1:A100,E1:E100)`.
    | This compares the data in Column A with the data in Column E. Refresh the random
    numbers and see how the correlation score changes when you do. |

    | 7 | In cell G5, type **Correlation of E and F**. In H5 type in `=CORREL(E1:E100,F1:F100)`.
    | Columns E and F both contain random numbers – does Column E correlate more strongly
    with Column A or Column F? And does this change when you refresh the random numbers?
    |

    | 8 | Try comparing other columns together to see their correlation scores. |
    It is fun to use the formulae in a spreadsheet to come up with columns of numbers
    with different correlation scores. |

    | 9 | Save and close. | We will not use this spreadsheet again. |


    We can learn a few things about correlation coefficients from these results:


    *   Column A and Column B are identical. Their correlation score is `1`.

    *   Column A and Column C are completely the opposite: When one goes up, the other
    goes down – they are basically a mirror image of each other. But the behavior
    of one is completely predictable by looking at the other. Their correlation score
    is `-1`.


    **Figure 5-3** shows an experiment where a correlation of `-1` might be measured.
    The height of the green ball and the height of the blue ball have a perfect negative
    correlation.


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig3_HTML.jpg](images/486852_1_En_5_Chapter/486852_1_En_5_Fig3_HTML.jpg)


    **Figure 5-3** As the blue ball ascends so the green ball descends.


    *   Although Columns A and D behave similarly at first, this does not last the
    full data set. Their behavior is not related and knowing that one column is ascending
    does not help us guess whether the other is ascending or descending. There is
    a very low correlation score (`-0.03`).^([⁶](#fn6))


    **Figure 5-4** shows the values of **Columns A** and **D** on a line chart.


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig4_HTML.jpg](images/486852_1_En_5_Chapter/486852_1_En_5_Fig4_HTML.jpg)


    **Figure 5-4** A line graph showing values from Column A to Column D.


    ## 5.6 Understanding a Correlation Coefficient/Score


    We’ve seen what a correlation of `1`, `-1`, and close to `0` means, but what should
    we make of two sets of data that have a correlation of `0.4`, or `-0.5`, or `0.78`?
    There are no hard-and-fast rules and context is always a factor, but outside of
    very tightly controlled experiment the following guidelines can be used to interpret
    a correlation score:


    *   Where two data sets have a correlation of `0.7` or more (or `-0.7` or less),
    then it is safe to describe it as a **strong** correlation. Above `0.9` would
    be very strong. If we see scores this high in our data science experimentation,
    we would be extremely interested to understand the underlying relationship between
    the things being measured.

    *   A score between `0.4` and `0.7` (or `-0.4` and `-0.7`) means that the data
    sets are correlated – there is some evidence of a relationship. It is potentially
    interesting and we might look more deeply into this, but only after we looked
    at any strong correlations.

    *   A score between `0.2` and `0.4` (or `-0.2` and `-0.4`) means that the data
    sets are **moderately** correlated – there is some evidence of a weak relationship
    which may be of interest.

    *   Below `0.2` (or `-0.2`) suggests no real relationship between the data sets
    at all.


    Correlations do not have to be strong to be useful results: discounting correlations
    between data sets might be the objective of an experiment. For example, your experiment
    might set out to show that height and hair color are not linked. A close-to-zero
    correlation score would help to demonstrate this.


    ## 5.7 Calculating the Correlation Score for Weather Data


    The process of calculating the strength of the correlation between our temperature
    and pressure data is quite straightforward now, and is detailed in **Table 5-3**.


    **Table 5-3** Calculating the correlation coefficient for our temperature and
    pressure data


    | Step | What to do | Notes |

    | --- | --- | --- |

    | 1 | Open the CSV file from Chapter 4 in your spreadsheet program. | It should
    import as 2 columns, with headers. Check the data has imported correctly; if not,
    try again or Google a quick fix. |

    | 2 | In D1 type in: **Correlation score =**. In E1 type in: `=CORREL(A1:A42,B1:B42)`.
    | Adapt the formula depending on how many rows of data there are. Note the answer.
    |

    | 3 | Save the file. | We will use it later. |


    The formula that we typed in **C1** should return a number between `-1` and `1`:
    this is a measure of the extent to which the temperature and pressure readings
    you took during your experiment are correlated. Whatever score you got has answered
    the question posed in our experiment^([⁷](#fn7)): is there a correlation between
    temperature and pressure? Use the guidelines from **Section 5.5** to uniquely
    answer this question.


    In our experiment we were constrained in how much data we could collect, which
    meant we only looked at temperature and pressure. With more data at our disposal,
    analysis of correlation scores can have some great applications:


    *   We saw in Chapter 1 that there are a large number of data points that we can
    measure that relate to the weather – dozens of them. Over many years climate scientists
    have analyzed these and measured correlations between them. This has helped build
    up a body of knowledge about the weather that is used, among other things, to
    make predictions.

    *   Medical science is built on the humble correlation. Where there is a strong
    correlation between a new procedure and the life expectancy of a patient, we might
    say a “cure” has been found.

    *   Imagine being able to measure 100 things about yourself and then finding the
    5 that most correlate with your happiness.'
