  trans: '

    ## 3.4 天气实验


    实验是一种旨在学习新知识或验证已有认知的项目。在这个实验中，我们将尝试探究收集到的测量数据与我们描述天气的方式之间的关联：


    > *这个天气实验将帮助我们了解温度、湿度和气压如何影响我们对天气的感知。实验将展示这些测量数据的哪些组合能为记录数据的人提供理想的天气条件。*


    在我们的实验中，我们将在较长一段时间内，于不同时间点收集温度、湿度和气压数据。理想情况下，最好是连续记录几天的日志。


    每次读取读数时，我们都需要对当时的天气进行主观评估——给出一个 1 到 10 分之间的评分，具体标准如下：


    1.  10 分表示对于你所在地的该季节而言，这是最理想的天气。

    2.  1 分表示在合理范围内，该季节可能遇到的最糟糕天气。

    3.  5 分表示天气完全符合该季节的预期。


    这完全是主观的：请根据你在记录数据那一刻对天气的感受来打分——不要想太多！多样性也是好的——尝试收集各种不同天气条件下的数据。


    我们将根据**表 3-1** 的样式，将数据记录在表格中。


    ***表 3-1.*** *为空白的天气站实验数据表*


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fige_HTML.png](img/486852_1_En_3_Fige_HTML.png)


    本实验融合了**客观数据**（时间、温度、湿度和气压）与**主观**数据（10 分制评分和备注）。


    > *主观测量值通常不太可靠，数据科学家会尽量避免使用它们，如果无法避免则会进行严格管控。但我们在分析时会小心谨慎，不会过度推论结果：本实验将帮助记录评分的人洞察自己的天气体验与温度、湿度和气压之间的关联。我们不应指望实验能告诉我们除此之外的其他信息。但在分析过程中，我们会保持开放的心态。*


    ## 3.5 构建我们的天气站工具


    为了进行实验，我们需要构建一个能够测量温度、湿度和气压的数字仪器。


    **图 3-2** 展示了数字天气站仪器的**“电路”**或**“模块”**框图。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig2_HTML.jpg](img/486852_1_En_3_Fig2_HTML.jpg)


    图 3-2


    天气站工具的“电路”或“模块”框图，显示连接了电源、天气传感器和 OLED 显示屏的微处理器


    **表 3-2** 列出了我们将用于构建天气站工具的硬件。


    表 3-2


    天气站工具的硬件需求


    | 所需组件 | 我们使用的型号 | 数量 | 替代方案 |

    | --- | --- | --- | --- |

    | 微处理器及烧录代码的方式 | micro:bit，附带连接笔记本/台式机的 USB 线 | 1 | Raspberry Pi Circuit Playground
    |

    | 电源 | 2 节 AAA 电池盒 | 1 | Seenov Inc 太阳能电池 |

    | 读取天气数据的传感器 | XinaBox SW01 – 高级天气传感器 | 1 | SparkFun Weatherbit |

    | 查看数据的屏幕 | micro:bit 5x5 LED 矩阵 | 1 | XinaBox OD01 – 64x128 OLED 显示屏 |

    | 连接各组件的方式 | XinaBox IM01 micro:bit 桥接板 | 1 | 面包板、边缘接口转接板、鳄鱼夹导线和连接线 |

    | 用于连接 xChips 的 xBus 连接器 | 3 |


    我们将展示两种显示传感器数据的方式：


    1.  本节及**第 3.6 节**将介绍如何使用 micro:bit 的 5x5 LED 矩阵。

    2.  在**第 3.7 节**中，我们将在 micro:bit 上添加一个 64x128 像素的 OLED 显示屏（XinaBox OD01），并将数据输出到该屏幕上。


    选择合适的方案，并按下图所示组装部件。或者，也可以使用一套完全不同的组件来构建一个能实现相同功能的工具。目标是收集数据并进行分析；我们使用的工具本身并不特别重要。


    **图 3-3** 展示了不带 OLED 显示屏的天气站。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig3_HTML.jpg](img/486852_1_En_3_Fig3_HTML.jpg)


    图 3-3


    使用 micro:bit LED 矩阵进行显示的天气站


    **图 3-4** 展示了带 OLED 显示屏的天气站。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig4_HTML.jpg](img/486852_1_En_3_Fig4_HTML.jpg)


    图 3-4


    带 OLED 显示屏的天气站

