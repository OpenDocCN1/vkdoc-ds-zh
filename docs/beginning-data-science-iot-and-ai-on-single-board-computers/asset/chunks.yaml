  trans: '

    ## 8.1 标准至关重要


    BLE 的一项出色功能是允许 `micro:bit` 与其他（支持 BLE 的）设备进行通信。它可以与手机、平板电脑和笔记本电脑配对，但不能与其他 `micro:bit`
    配对。


    如果没有 BLE 标准来管理无线电通信，我们将面临类似于听到某人用我们不熟悉的语言说话时所遇到的问题：我们能听到他们发出的声音，但无法从中提取含义。两个无线电设备可以无休止地发送和接收信号：除非发送方和接收方都同意使用一种共同的语言，否则它们将无法理解彼此。


    某种通信标准是必要的：如果我们放弃 BLE，就必须用其他东西来代替它。`MakeCode` 和 `MicroPython` 都提供了一种替代方案，一种更简单的使用板载无线电的方法。


    ## 8.2 使用无线电进行输入/输出


    我们已经了解了如何将数据写入 `micro:bit` 的内存、如何将数据打印到屏幕以及如何通过 BLE 连接传输数据。在所有这些情况下，我们所做的事情都非常相似：我们都在输出数据。无线电只是我们可以输出数据的另一个地方：我们不是告诉微处理器将数据发送到屏幕或文件，而是告诉它通过天线进行传输。


    `MicroPython` 和 `MakeCode` 都提供了将板载天线用作数据通信工具的工具。它们应用的标准不同；其主要后果是，使用 `MicroPython`
    编写的代码运行的 `micro:bit` 无法通过无线电与使用 `MakeCode` 编程的 `micro:bit` 进行通信。


    `MakeCode` 和 `MicroPython` 都提供了使用天线所需的基本功能：它们允许将数据转换为无线电信号，进行无线传输，然后在接收时再转换回数据。我们知道，如果我们（例如）将数字“4”或单词“hello”转换为无线电信号并传输，那么另一端的
    `micro:bit` 接收到这个信号后，就能解释出“4”或“hello”的含义。但正如我们将看到的，在代码中我们仍有工作要做。


    板载无线电的一个限制是它只允许 `micro:bit` 与其他 `micro:bit` 通信。我们可以用它来构建一个封闭的 `micro:bit` 网络，这些
    `micro:bit` 可以相互通信。我们如何在数据科学工作中有意义地使用它呢？


    ## 8.3 使用无线电构建网络


    在第 1 章中，我们看到温度计记录的是环境温度，即传感器附近极小空间体积的温度。


    要测量一个房间/大区域的温度，并确保我们对结果有信心，最好对几个不同位置进行采样，并基于多个数据点得出答案。`micro:bit` 无线电是完成这项工作的完美工具。


    我们要做的是构建一个由 `micro:bit` 组成的小型网络；我们使用四个，但两个也行，而且这个练习可以扩展到更多数量。我们的网络将按如下描述运行：


    -   我们将让四个 `micro:bit` 通过无线电相互通信。

    -   网络中的一个 `micro:bit` 将与其他 `micro:bit` 不同：我们将其称为 `服务器` 或 `收集器`，它的工作是监听网络中其他 `micro:bit`
    发出的无线电信号。

    -   其他三个 `micro:bit` 是 `节点`。它们是一样的，其工作是测量温度并传输结果。

    -   `服务器` 将监听网络中 `micro:bit` 发出的温度数据。当它接收到所有节点的数据后，它会汇总数据并显示平均值。


    图 8-1 描绘了一个基于无线电的简单 `micro:bit` 网络，包含三个 `节点` 和一个 `服务器`。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig1_HTML.jpg](img/486852_1_En_8_Fig1_HTML.jpg)


    图 8-1


    我们的网络由四个独立的仪器组成


    ## 8.4 选择 MakeCode 还是 MicroPython


    `MicroPython` 和 `MakeCode` 处理无线电通信的方式存在一些细微差别。其中最明显的是关于组/通道：


    -   在 `MakeCode` 中，有 256 个组，范围从 0 到 255。要在 `micro:bit` 上使用无线电功能，你必须将其分配到一个组。

    -   在 `MicroPython` 中，有 84 个（一些资料声称是 100 个）通道，编号为 0–83，可用于发送/接收信号。


    在本章的剩余部分，我们将使用 `MakeCode`：我们的目标是理解 `micro:bit` 上的无线电如何为我们的数据科学实验增加价值，而 `MakeCode`
    使用起来稍微简单一些。此外，避免考虑 `MakeCode` 和 `MicroPython` 在实现无线电方面的微妙但武断的差异，将确保我们始终专注于核心信息。


    ## 8.5 MakeCode 无线电组


    当我们通过无线电发送数据时，假设是数字“4”，`MakeCode` 标准会用其他数据（例如 `组 ID`）对其进行填充。所以，当你告诉 `MakeCode`
    发送“4”时，实际发送的内容可能看起来更像是“32_4”（这做了简化，但说明了问题）。所有数据一起发送，被称为一个 `数据包`。


    `Micro:bit` 在每个 `数据包` 内广播其 `组 ID`。此外，一个 `micro:bit` 只会处理包含相同 `组 ID` 的消息。图 8-2
    显示了部署为两个组的六个 `micro:bit`。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig2_HTML.jpg](img/486852_1_En_8_Fig2_HTML.jpg)


    图 8-2


    部署为两个组的六个 `micro:bit`


    在组 1 中，`micro:bit` A、B 和 C 在发送 `数据包` 时都使用相同的 `组 ID`，并且它们只处理接收到的包含该 `组 ID` 的 `数据包`。它们可以相互通信，但不能与组
    2 中的 `micro:bit` D、E 和 F 通信。组 2 中的 `micro:bit` 会忽略来自组 1 的任何消息，反之亦然。


    `Micro:bit` 无线电不执行单向或双向通信。相反，它就像广播电台播放音乐和声音一样广播数据。如果任何 `micro:bit` 想要接收另一个 `micro:bit`
    广播的数据，它们只需要处于同一组即可。


    ## 8.6 节点与收集器


    为了构建我们的联网温度计，我们将设计一个简单的无线电网络，它由几个 `节点` 和一个 `收集器` 组成：


    -   `节点` 收集数据并将其传输给同一组中的其他 `micro:bit`。

    -   `收集器` 监听来自 `节点` 的数据，并以某种预定的方式对这些数据做出响应。


    我们将使用的示例包括三个 `节点` 和一个 `收集器`。你可以通过添加或移除 `节点` 来调整网络规模；如果这样做，你需要修改代码。一个最多包含十个 `节点`
    的 `micro:bit` 网络应该是相对稳定的。


    图 8-3 显示了我们将要构建的无线电网络：


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig3_HTML.jpg](img/486852_1_En_8_Fig3_HTML.jpg)


    图 8-3


    我们简单的无线电网络，包含三个 `节点` 和一个 `收集器`


    每个 `节点` 都有一个唯一的 ID，我们将在代码中定义它。它们各自测量 `环境温度`（使用内置的 `micro:bit` 温度计），然后广播温度和它们的
    `节点 ID`。其间会设置一个 5 秒的时间延迟。


    `收集器` 将监听无线电传输。当它接收到一条带有正确 `节点 ID` 的消息时，它会从 `数据包` 中提取 `温度` 和 `节点 ID`。它将等待直到网络中所有
    `节点` 都报告了它们的温度；然后它会计算出平均温度并显示出来。

    '
- fmt: '# 8.7 Building the Nodes


    We are going to build three nodes. The hardware required for each node is very
    simple: just a micro:bit and a power supply. We will use the onboard temperature
    sensor, antenna, and the 5x5 LED matrix to display a “message sent” status. **Figure**
    [**8-4**](#486852_1_En_8_Chapter.xhtml#Fig4) shows our three nodes.


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig4_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig4_HTML.jpg)


    **Figure 8-4** Three micro:bit temperature sensor nodes


    The code we need to write is illustrated in natural language in **Figure** [**8-5**](#486852_1_En_8_Chapter.xhtml#Fig5).


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig5_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig5_HTML.jpg)


    **Figure 8-5** Natural language code for our sensor nodes


    **No-code option**: You can find a precompiled version of the code used in this
    section on our resource website. Go to [`http://xib.one/XB`](http://xib.one/XB)
    and search for **Section 8.7**.


    **Table** [**8-1**](#486852_1_En_8_Chapter.xhtml#Tab1) shows how to convert the
    natural language code earlier into `MakeCode` blocks that can be compiled and
    loaded into your nodes.


    **Table 8-1** Developing code for sensor nodes with MakeCode blocks


    | Step | Description |

    | --- | --- |

    | 1 | Make sure your MakeCode project has the `Radio` extension. If not, add it
    to the project using the `Extensions` option.![../images/486852_1_En_8_Chapter/486852_1_En_8_Figa_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Figa_HTML.jpg)
    |

    | 2 | Add the `radio set group` block to the `on start` block. Use the default
    `group ID` unless you need a different one (valid range: 0–255).![../images/486852_1_En_8_Chapter/486852_1_En_8_Figb_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Figb_HTML.jpg)**Note** Use
    the same group ID for all the nodes. |

    | 3 | Repeat the following. |

    | 4 | Add the `radio send value` block to the `forever` block.![../images/486852_1_En_8_Chapter/486852_1_En_8_Figc_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Figc_HTML.jpg)This
    will send data as a name-value pair: we will send our `Node ID` as the name and
    temperature as the value. |

    | 5 | Type the `Node ID` in the `name` box. Use *different* `Node IDs` for other
    nodes.Then add the `temperature` block onto the `value` box:![../images/486852_1_En_8_Chapter/486852_1_En_8_Figd_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Figd_HTML.jpg)
    |

    | 6 | Add the following blocks after the `radio send value` block:![../images/486852_1_En_8_Chapter/486852_1_En_8_Fige_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fige_HTML.jpg)The
    `show icon` block is used to display a tick on the micro:bit 5x5 LED matrix after
    a packet sent.The `pause` block is used to send data every 5 seconds. |


    **Figure** [**8-6**](#486852_1_En_8_Chapter.xhtml#Fig6) shows the `MakeCode` blocks
    for the micro:bit sensor node 1.


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig6_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig6_HTML.jpg)


    **Figure 8-6** MakeCode blocks for sensor node 1. It is in radio group 1 and its
    Node ID is 1


    Now compile the code and flash it onto your micro:bit. Label it Node 1; then change
    the code (just the `radio send value` block) for your other nodes and flash them
    too.


    ## 8.8 Building the Server/Collector


    Our server/collector will also use a micro:bit and power supply, but we will add
    an OLED display to view the data (**Figure** [**8-7**](#486852_1_En_8_Chapter.xhtml#Fig7)).


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig7_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig7_HTML.jpg)


    **Figure 8-7** The server/collector


    The way that the code needs to work is outlined in natural language in **Figure**
    [**8-8**](#486852_1_En_8_Chapter.xhtml#Fig8).


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig8_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig8_HTML.jpg)


    **Figure 8-8** Natural language code for the collector


    **No-code option**: Our resource website has versions of the server/collector
    code for 1, 2, 3, and 4 nodes. Go to [`http://xib.one/XB`](http://xib.one/XB)
    and search for **Section 8.10**.


    While the natural language code is relatively simple, converting it into `MakeCode`
    blocks (or `MicroPython`) will be daunting for an inexperienced programmer. We
    are effectively building a server, a very simple one, but nonetheless it is a
    nontrivial programming task.


    The full `MakeCode` block program, several pages of it, is shown in **Figure**
    [**8-9**](#486852_1_En_8_Chapter.xhtml#Fig9). If you are interested in looking
    at how each step of the natural language code translates into blocks, please check
    out the supporting website.


    If you are less interested in the code and more interested in the data science
    applications that the instruments can support, then ask yourself the following
    questions:


    1.  Could you adapt the code so that it works for other measures, for example,
    humidity or CO2 levels?

    2.  Could you adapt the code to add in more nodes?

    3.  Could you describe what you need to a programmer so that they could adapt
    the code?


    If you answered yes to (3), then it really doesn’t matter if you can program or
    not. Being a strong programmer is a great skill for a data scientist to have,
    but you can be a great data scientist without it. In later chapters we will connect
    to Wi-Fi, build an IoT application and communicate with an artificial intelligence.
    In none of these instances will the code we use be anywhere near as complex as
    the following code. Noncoders: please persevere!


    **Figure** [**8-9**](#486852_1_En_8_Chapter.xhtml#Fig9) shows the `MakeCode` blocks
    for the micro:bit collector.


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig9a_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig9a_HTML.jpg)![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig9b_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig9b_HTML.jpg)![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig9c_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig9c_HTML.jpg)![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig9d_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig9d_HTML.jpg)


    **Figure 8-9** MakeCode blocks for the micro:bit collector


    Flash the code onto the collector and then power it up. Make sure the nodes are
    powered up too.


    The collector will listen to the group 1 channel and, when it receives a message
    from one of the nodes it is programmed to listen out for, it will extract the
    temperature data from that message and display it on screen. When data from all
    the nodes has been received the collector will display the average temperature
    on the OLED screen (**Figure** [**8-10**](#486852_1_En_8_Chapter.xhtml#Fig10)).


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig10_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig10_HTML.jpg)


    **Figure 8-10** The OLED screen displays temperature from each sensor node and
    the calculated average temperature


    Test your network by placing the nodes in remote locations: how far away from
    the collector can they be and how important is “line of sight” to the range? The
    node code could be adapted to send other types of data, and we have seen in earlier
    chapters how to add sensors to a micro:bit. What sensors could you add to the
    network to provide useful data?'
