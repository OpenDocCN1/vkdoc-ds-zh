  trans: '

    # 13.4 举一反三


    只要有合适的硬件，利用本书介绍的技术，你就能构建出各种复杂精密的数字仪器，其范围几乎没有限制。我们介绍的大部分技能都可以迁移应用：


    **如果你能将一个传感器连接到微处理器：**


    ![../images/486852_1_En_13_Chapter/486852_1_En_13_Fig1_HTML.jpg](img/486852_1_En_13_Fig1_HTML.jpg)


    图 13-1


    采用相同原理构建的两个复杂程度不同的数字仪器


    *   无论你使用何种外围系统（`XinaBox`、面包板、`SparkFun`等），只要你成功地将一个传感器连接到微处理器，通常就能应用同样的方法连接其他传感器。如果你选择的外围系统支持广泛的传感器种类，那么你就能连接其中的任一种。


    *   只要微处理器支持（大多数都支持），你就可以同时连接多个传感器，构建能够测量多种传感器读数的仪器。


    *   请记住，在 2020 年及以后，你不再需要工程学位或烙铁就能构建高质量且坚固耐用的数字仪器。


    *   **图** **13-1**展示了两个用`xChips`构建的数字仪器。左侧是我们构建的 Wi-Fi 网关，而右侧的设备可用于高空气球，以记录和传输环境数据。


    **如果你能用积木式语言为 micro:bit 编写程序：**


    ![../images/486852_1_En_13_Chapter/486852_1_En_13_Fig2_HTML.jpg](img/486852_1_En_13_Fig2_HTML.jpg)


    图 13-2


    可使用微软`Maker.Makecode`积木式编程语言进行编程的部分开发板


    *   那么你**就**会写代码：你能编程。

    *   有**大量**微处理器支持积木式编程。其中绝大多数在性能上都比 micro:bit 强大数个数量级。使用同样的技术，你**也能**为它们编程。

    *   **图** **13-2**展示了`Maker.Makecode`积木式编程环境。这是微软的一款产品——我们使用的 micro:bit `MakeCode`正是该积木式编程环境的一个“白标”实现。

    *   其界面、语法、烧录流程都非常相似——`MakeCode`的用户会感到熟悉。

    *   **图** **13-2**展示了部分可以使用积木式编程的开发板。


    **如果你能编写程序让微处理器从传感器读取数据：**


    ![../images/486852_1_En_13_Chapter/486852_1_En_13_Fig3_HTML.jpg](img/486852_1_En_13_Fig3_HTML.jpg)


    图 13-3


    用于四种不同传感器的四个`MakeCode`扩展


    *   那么你就能编写程序让它从任何传感器读取数据。你知道如何加载库/扩展，而且用于读取传感器数据的积木块其工作方式通常非常相似。为特定传感器找到合适的扩展可能是最棘手的部分：寻找那些能为你所使用的微处理器提供易用（且易查找）`MakeCode`扩展的制造商。


    *   从多个传感器读取数据很简单：你应该能够同时从许多传感器组成的阵列中读取数据。


    *   **图** **13-3**展示了用于不同类型传感器的四个`MakeCode`扩展。变量的名称会变化，但在每种情况下，传感器的值都会作为一个简单变量（一个数字）返回。范式是相同的。


    **如果你能分析温度和湿度数据：**


    *   那么你就能运用同样的技巧分析任意两组数据集。

    *   你应该能够对此进行扩展：添加其他数据集，尝试不同类型的可视化，寻找相关性，并添加趋势线。


    **如果你能连接到物联网平台：**


    *   那么你就能从在线平台收发数据，并访问云端的服务。

    *   利用在线平台及其可用服务的强大功能，可以为你的数字仪器增加复杂性。


    **如果你能处理从物联网平台接收的数据：**


    *   那么你就能使用/响应该物联网平台发送的命令或数据。这些命令/数据背后有物联网平台的处理能力支持：其处理能力比你正在使用的单板计算机高出数个数量级。

    *   如果你能让物联网平台向远程数字仪器发送数据，那么该物联网平台所连接的人工智能/机器学习服务也可以向其发送数据。


    **如果你能将气象站连接到机器学习预测模型：**


    *   那么你就能将任何边缘设备连接到任意众多可用的机器学习预测模型上。


    就在 20 年前，甚至 10 年前，要掌握一套水平相当的技能，对于一个聪明且有动力的人来说，可能需要花费多年时间。但借助现代技术，你可以更快地获得这些技能，并专注于如何应用它们，专注于技术所能实现的事情，而不是在技术本身上纠结。数据科学是数字技术之上的一个层级，能够像我们在这里所做的那样深入其中，是一种直到最近才成为可能的奢侈：这在大多数读者的有生之年里都发生着。


    ## 13.5 将所学应用于不同构建


    利用上一节概述的技能，你可以构建各种各样的东西，例如：


    *   一个带有传感器阵列并连接到物联网平台的仪器

    *   它发送数据，这些数据随后被传入机器学习模型

    *   机器学习生成预测或关键指标，然后将结果发回（可能发给完全不同的一个或多个设备）

    *   同时，一系列真实的电子开关或电机被打开或关闭

    *   所有这些信息都输出到一个或多个屏幕上（可能位于不同位置的设备上）

    *   并且被写入文件，在物联网平台上备份


    虽然这听起来可能很复杂，但它实际上非常通用：它是无数现代发明/小工具的核心架构。有了这个基本模型，你可以构建大量的东西，包括：


    *   用于监测教室、卧室或机场候机室空气质量工具。房间内的传感器收集数据，通过 Wi-Fi 发送给机器学习服务，该服务分析数据，并远程控制窗户、百叶窗、风扇、除湿器和空调，以最小的能源成本维持健康环境。

    *   睡眠不好？构建一个传感器阵列来监测卧室中的各项因素。收集几周的传感器数据，并加入你的睡眠质量数据。识别出与你睡眠质量相关的传感器读数；然后构建一个能够管理相关因素为你提供最佳环境的仪器。

    *   下棋机器人怎么样？或者一个能分拣不同颜色软糖的机器人？又或者一个能采摘成熟草莓的机器人？

    *   构建和维护一个受控环境，例如为“异域”宠物建造的饲养箱。

    *   像伦敦这样的城市拥有大型防洪闸门，在水位过高时关闭。但关闭闸门需要时间，而且通常成本高昂。将上游的一系列传感器阵列数据和天气预报数据全部输入预测洪水的机器学习模型，可以构建一个非常高效的控制系统。

    *   在印度的某些乡村，有野生游荡的大象到访，它们会吃庄稼并造成破坏。分布在村庄周围的一系列传感器阵列和执行器可能能够发出巨大的噪音或强光来驱赶大象。'
- fmt: '## 13.6 Ethical Considerations


    So, you can now undertake all manner of experimentation and build all sorts of
    innovative and potentially impactful contraptions. But what kind of things shouldn''t
    you build?


    Obviously nothing that risks causing physical injury or criminal damage: we know
    a line exists. So, if there is a line between what is OK and what isn''t, then
    where is that line?


    To find the answer, we need to look into ethics:


    What is/are "ethics"? Many people would agree that at the core of most ethical
    arguments is the tenet that if you are engaged in any activity that impacts on
    other people then you have some kind of responsibility for any effect this activity
    has on those people. Ethics shines a light on that responsibility.


    Data science is used to inform decisions and policies that touch our lives in
    a wide range of different ways, as we have seen throughout this book. Is ethical
    consideration necessary though?


    Data science can appear to be scientific, unbiased, and impartial: the methods
    and tools are independent of the data that is being analyzed. The same techniques
    used to analyze temperature and humidity data would work for religious affiliation
    and IQ data: a correlation coefficient does not have an opinion.


    A study into religious affiliation and IQ data is without doubt going to arouse
    passion, anger, and hurt and could very easily be manipulated (e.g., different
    IQ tests have cultural biases). Whether it would be ethical or not to actually
    gather and study this data is not a judgment we will make here. At the point of
    conception of an idea, the impact of implementing that idea should be considered
    though; you are your own ethical guardian.


    The field of ethics is fascinating and vast, but we have almost run out of space.
    The important point to make here is that data science is not exempt: good people
    can produce bad science.


    Most important is to remember that, with the growth of AI and ML, the human component
    of data science may change or even shrink. But it is humans who create the need
    for ethical considerations and who need to be the guardians of ethics. The best
    AI/ML cannot come near to a human in terms of empathy and passion for the value
    of ethics. As we hand over aspects of the data science process to AI/ML, we need
    to cling to ownership of this key consideration.


    So, before we conclude, an ethical dilemma to ponder:


    Is it OK to scare off elephants who are just foraging, and what is the impact
    on the elephants? Will everyone who answers this question have the same answer?
    Do the opinions of people whose lives are not affected by the elephants matter?
    What happens if we extend the metaphor and substitute elephants with groups of
    migrant people?


    ## 13.7 Summary


    The original plan for this final summary was to list all the bits and bobs that
    have been featured in the book: make you feel good about attaining a very useful
    and practical body of skills and techniques.


    Instead the authors would like to completely break the fourth wall and end on
    a somewhat less conventional note:


    Hi. Thank you for investing your time and money in this book.


    We started writing back in August 2019, in the pre-covid19 world, and we are finishing
    it in April 2020. So much has changed since then, and we share your loss and sadness.


    We still want to end on an upbeat note though.


    This crisis will pass and those that remain will emerge stronger from it. When
    the war on Coronavirus is finally won, society must, and will, remember the heroes
    who got us through it: the nurses, doctors, orderlies, truck drivers, shelf stackers,
    teachers, police, farmers, shopkeepers… the list goes on.


    And it includes data scientists, front and center.


    During the height of this crisis it is hard to look at a screen and not see a
    chart showing infection/survival rates, or hear experts talk about models projecting
    predicted outcomes, or read about the expected impact on the global economy. Data
    science is at the heart of all of these endeavors, informing the life-or-death
    decisions that governments are being forced to make on a daily, even hourly, basis.
    The strategy and implementation of self-isolation is based on data science modeling
    and the development and testing of new medicines will use data science techniques.
    Next to medicine, data science might be the best weapon we have in our arsenal.


    We will leave you with this final thought: what we have looked at in this book
    is small and frivolous in comparison to the work described earlier, but our efforts
    share the same DNA as these endeavors. The great scientists who are leading us
    through this crisis were once at the same stage of their data science journey
    as you are now.


    Thank you and stay safe.'
