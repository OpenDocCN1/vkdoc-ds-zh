  trans: '

    # 5.2 数据分析软件


    在计算机普及之前，数据分析速度缓慢且劳动强度大。那时使用手绘的数据表（类似于我们在前几章中创建的那些），而开展我们一直在探讨的那种基于数据的实验，需要广泛的知识储备、大量的训练以及极大的耐心——这是一种罕见的素质组合。


    随着计算机的出现以及我们在前几章中探讨的各种功能的开发，数据科学的潜力呈指数级增长：


    软件取代了人力，但计算机和代码并不能取代我们在数据科学过程中的角色。相反，它们将我们从繁琐的任务中解放出来，让我们能够将时间和精力投入到需要人类智慧和直觉的环节。尽管人工智能（AI）近年来取得了一些进展，但从未有任何数据科学实验是完全由计算机完成的。人类因素始终存在且不可替代。


    可以公平地说，数据分析的计算机化使数据科学得以普及：强大且易用的软件让任何拥有笔记本电脑和数据的人都能进行复杂的分析。


    数据科学家并没有一个统一的软件套件作为标准。许多人信奉`Python`、`SAS`或某种`SQL`变体。在本章中，我们将使用电子表格，它拥有我们所需的所有功能，包括：


    *   支持数据表。我们创建的 CSV 文件在任何电子表格程序中都能轻松打开。

    *   许多电子表格程序内置了可用于数据分析的函数，例如衡量两组数据之间相关性的函数。

    *   支持可视化。多数电子表格允许你轻松创建标准图表和其他可视化内容。

    *   电子表格相对易于使用。

    *   功能强大的电子表格程序分布非常广泛，易于获取。

    *   电子表格通常非常实用，掌握电子表格程序的使用方法是一项值得培养的技能。


    ## 5.3 选择电子表格程序


    我们将使用`Excel`作为电子表格程序，但也有其他可行的替代方案，包括`Google Sheets`、`OpenOffice`和`LibreOffice`。


    如果你使用的是其他电子表格程序，并且不确定它是否适合学习本章内容，只需用搜索引擎搜索你的电子表格名称加上“相关性公式”这几个字。如果你使用的软件带有内置的相关性测量函数，那么你应该能够使用该软件学习本章。如果没有，我们建议你另选一个软件，其中许多可以在网上免费获取。^(⁵)


    虽然我们将介绍使用电子表格程序进行数据分析的基础知识，但你还需要掌握一些本书不会涵盖的核心技能。你需要知道如何：


    *   打开电子表格程序并开始一个新项目。

    *   在电子表格程序中打开 CSV 文件。

    *   在单元格中输入数值。

    *   在电子表格中导航。


    **图** **5-1** 概述了我们用于描述电子表格不同方面的一些关键术语。


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig1_HTML.jpg](img/486852_1_En_5_Fig1_HTML.jpg)


    图 5-1


    列、行和单元格的命名约定


    *   **行**：行横向排列，从左到右，并从 1、2、3 等序号开始编号。

    *   **列**：列纵向排列，从上到下，并用 A、B、C 等字母标记。

    *   **单元格**：单元格是列和行相交的位置，并根据其所在的列和行进行标记：例如`A1`、`B3`或`C8`。


    ## 5.4 测量相关性


    在**第** **3 章**中，我们看到温度和压力的变化方式相似：它们似乎以某种方式相关联，我们使用术语“相关性”来描述这种关系。然而，我们无法说明这种相关性有多强——我们缺乏客观描述它的语言。它们是
    100%相关，还是 0.5 相关？这两个问题本身是否有意义？


    相关系数的测量范围在-1 到+1 之间：


    *   两组数据之间可能的最强相关性得分为 1。当两组数据的相关性得分为 1 时，通常意味着它们描述的是完全相同的事物（例如，以摄氏度表示的温度和以华氏度表示的温度的相关性为
    1）。

    *   得分为 0 或非常接近 0 意味着两组数字之间没有关系。它们所测量的事物完全不相关。

    *   两组各有几百个随机数的集合不太可能得到正好为 0 的相关性得分。我们可能预期分数在 0.1 或-0.1 左右，但由于它们是随机的，任何情况都可能发生。

    *   不存在“好”或“坏”的相关性得分——它仅仅是对两组数据行为相似程度的一种描述。


    你会如何解读相关性得分为-1 的情况？


    **表** **5-1** 提供了一个简单的练习，用于演示数字集之间的相关性得分。


    表 5-1


    探究相关系数


    | 步骤 | 操作内容 | 备注 |

    | --- | --- | --- |

    | 1 | 打开电子表格程序并开始一个新项目/电子表格/工作簿。 | 从一个空白工作表开始——我们将输入一些数字。 |

    | 2 | 在 A 列：输入数字 1 到 100。 | 有一些技巧可以帮助你完成此操作：你不需要逐个输入每个数字。 |

    | 3 | 在 B 列：复制第一列的数字。 | A 列和 B 列完全相同——因此它们应该具有最大的相关性得分。 |

    | 4 | 在 C 列：输入数字 100 到 1，使其在每个单元格中递减。 | 这是 A 列的倒序。这将如何与 A 列相关？ |

    | 5 | 在 D 列：输入数字 2, 4, 6…到 100，然后往回：98, 96, 94 等。 | 在此列中，数字直到中间部分都与 A 列非常相似，之后开始下降。我们预期
    D 列与 A 列的相关性如何？ |

    | 6 | 在 E 列：在 100 个单元格中每个都输入 1 到 100 之间的随机数。 | 使用随机数生成函数。对于 Excel 和 Google Sheets，你可以使用`=
    100*RAND()`。 |

    | 7 | 在 F 列：复制你在第 5 步中的操作。 | E 列和 F 列都只有随机数。 |


    完成后，你的电子表格应类似于**图** **5-2**。


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig2_HTML.jpg](img/486852_1_En_5_Fig2_HTML.jpg)


    图 5-2


    按照表 5-1 填入数据后的电子表格顶部


    在此值得暂停一下，思考一下**表** **5-1** 中“备注”列提出的问题。你的预期是什么？设定好你的预期后，请按照**表** **5-2** 中的步骤操作，计算相关性得分。

