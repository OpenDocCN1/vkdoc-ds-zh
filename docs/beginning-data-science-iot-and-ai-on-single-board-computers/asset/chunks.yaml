    Using the micro:bit file system presents us with another challenge. As more and
    more data is **written** (or **appended**) to a file, eventually the micro:bit
    will be unable to write any more data to it: an upper limit of file size will
    be reached. Despite the micro:bit having approximately **30 KB** of memory reserved
    for file storage, it is not capable of writing files that size in the way we want
    it to. Other factors, such as the working memory of the micro:bit, are also limiting
    factors.


    The way the micro:bit file system works is that when you write anything to a file
    you overwrite everything that is already in the file. This means that when we
    want to append more data to a file, we have to read all the data already in the
    file into a variable, and then add the additional data we want to append to the
    variable. Then we write the entire contents of the file, with the new record added,
    back into the file. The most common limiting factor when writing data to file
    is the ability of the micro:bit to store the entire content of the file to a single
    variable.'
