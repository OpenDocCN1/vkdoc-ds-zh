  trans: '

    ## 2.13 选择我们的工具包


    大多数电子产品零售商都会储备我们所需的组件：只需在谷歌上搜索一下，就能制作出一些非常酷且独一无二的工具。


    但除非你熟悉微电脑领域，否则琳琅满目的选项会让人望而生畏。从初学者到资深制作者，以下问题总让购物变得有些压力：


    -   我们怎么知道该买哪些？市场上有几十种二氧化碳传感器——哪些适合我们的需求？

    -   我们如何确保买来的零件能协同工作？所有组件都**兼容**吗？正确的电压是多少，电压又到底是什么？它们都讲同一种二进制语言，还是有方言？我是剪红线还是绿线？

    -   一个相关的挑战是**连接性**——这些组件实际上是如何组装在一起的？我们该如何把它们连接起来？


    为了避免这类担忧，也为了省去学习电路知识的必要，我们将使用 **XinaBox** 系列的组件来补充我们的 BBC micro:bit。该系列在多个方面满足我们的需求：


    -   它与 micro:bit 兼容，并且可以通过 MakeCode 和 MicroPython 轻松编程。

    -   组件可以通过连接器连接——我们可以像搭乐高一样轻松地搭建电路。无需学习任何电路搭建知识。

    -   它提供了本书中所需的所有组件。

    -   将组件“**映射**”到我们的需求很简单。想增加 Wi-Fi？有对应的 xChip。LoRa、GPS 或蓝牙？也有对应的 xChip。需要测量紫外线、运动或二氧化碳水平的传感器？同样有对应的
    xChip。而且它们都以相同的方式连接。


    使用这个系统能让我们专注于数据科学的核心技能——我们不需要花大量时间学习如何使用烙铁、面包板和导线来搭建复杂电路。那虽然很有趣，也是一项很棒的技能，但并非本书的重点。


    **图** **2-7** 展示了一个安装在 **IM01 桥接板** 上的 micro:bit。


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig7_HTML.jpg](img/486852_1_En_2_Fig7_HTML.jpg)


    图 2-7


    micro:bit 可以轻松滑入 XinaBox IM01 桥接板


    **图** **2-8** 和 **2-9** 展示了两个 **xChip** 连接在一起的情形。ID 清晰可见（左侧为 OD01，右侧为 SW01）。


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig9_HTML.jpg](img/486852_1_En_2_Fig9_HTML.jpg)


    图 2-9


    将 xChips 夹到桥接板上，你就构建好了一个数字工具


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig8_HTML.jpg](img/486852_1_En_2_Fig8_HTML.jpg)


    图 2-8


    使用 xBus 连接器，xChips 可以轻松地夹在一起。只需确保 ID 始终朝上即可


    对于那些不使用 micro:bit 或没有 XinaBox 套件的用户，请注意：


    -   尽管每项活动都使用 micro:bit 和 XinaBox 套件解决，但我们会提供替代的硬件方案，其自然语言代码应易于适配。

    -   活动中的硬件是以通用方式描述的——如果你能搭建所描述的电路，无论使用何种系统，都应该能跟上本书的内容。


    ## 2.14 硬件要求指南


    在本书中，我们将进行一系列越来越复杂的实验。每个实验都需要我们收集数据，并且我们需要构建一个工具来完成这项工作。我们将在“硬件要求”部分定义该工具所需的组件，其中将包含以下细节：


    表 2-3


    硬件要求组件列表表示例


    | 我们需要什么 | 我们将使用什么 | 替代硬件 |

    | --- | --- | --- |

    | 电源 | micro:bit 2xAAA 电池组 | USB 数据线 |

    | 微处理器 | micro:bit | Adafruit Circuit Playground |

    | 天气传感器 | XinaBox SW01 xChip | 任何带有博世 BME280 芯片的设备 |

    | 显示屏 | XinaBox OD01 OLED 屏幕 | micro:bit 5x5 LED 矩阵 |

    | 连接性 | XinaBox IM01 桥接板和 xBus 连接器 | 边缘连接器扩展板、面包板和跳线 |


    1.  将显示一个简单的框图/电路图，标识出我们工具中使用的组件。**图** **2-1** 和**图** **2-6** 即为此类示例。

    2.  一个表格将列出这些组件——**表** **2-3** 即为一例。我们在**“我们需要什么”**一列中列出框图/电路图中的组件。我们还在**“我们将使用什么”**一列中列出了本书中使用的硬件。第三列**“替代硬件”**展示了你可以用来构建相同工具的不同硬件设置。


    **图** **2-10** 展示了一个使用**表** **2-3** 中**“我们将使用什么”**一列所列硬件构建的**“工具”**。


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig10_HTML.jpg](img/486852_1_En_2_Fig10_HTML.jpg)


    图 2-10


    一个使用“我们将使用什么”一列中列出的硬件构建的工具


    所有提供的代码（无代码、MakeCode 和 MicroPython）都将与**表** **2-3** 中**“我们将使用什么”**一列所述硬件兼容。


    如果你使用不同的硬件，可能需要稍微调整代码。特别是，大多数制造商会提供库（或扩展）供你与其套件一起使用。如果你使用不同的硬件，请查阅制造商网站，了解如何查找和使用相应的库。将它们添加到你的工作区的方式应与我们网站上描述的方式类似。


    ## 2.15 总结


    要进行有意义的数据科学实验，我们需要收集自己的数据。这将要求我们构建数字数据收集工具，并为其编写代码。


    我们选择了一个非常简单的硬件系统来构建工具，并提供了多种编写代码的方案。这包括无代码方案，旨在让那些不热衷于自己编写代码的人也能使用数据收集工具：成为一名计算机程序员与接触数字技术并非同一回事。


    我们将使用的系统是 BBC micro:bit + XinaBox “xChips”。除了购买能执行我们所需功能的现成工具外，很难找到比这更简单的选择了。有了这个系统，即使没有任何硬件知识，我们也能踏上数据科学之旅。


    # 3. 天气实验


    在本章中，我们将设计一个实验，记录温度、湿度和大气压强。我们将使用数字工具包构建一个气象站，然后研究这些测量值如何影响我们对天气的日常感知。

