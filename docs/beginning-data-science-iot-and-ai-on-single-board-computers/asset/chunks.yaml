  trans: '

    # 3.6 为我们的气象站编程


    硬件已经准备就绪，但我们还需要教微处理器/micro:bit 像数字气象站一样工作：我们需要为它编写代码。


    **表 3-3**展示了我们将转化为`MakeCode`积木的自然语言代码。


    **表 3-3** 数字气象站的自然语言代码


    | 步骤 | 自然语言代码 | 备注 |

    | --- | --- | --- |

    | 1 | 加载所需的任何库。 | *我们需要核心的 micro:bit 库以及我们气象传感器的库。* |

    | 2 | 不断重复以下步骤。 | *程序将持续运行，直到 micro:bit 关机。以下动作将被重复……* |

    | 3 | 在屏幕上显示“T”，然后显示温度。 | *我们只显示“T”代表温度，以避免等待太久才能滚动显示。* |

    | 4 | 在屏幕上显示“H”，然后显示湿度。 | *出于同样原因，我们只显示“H”代表湿度。* |

    | 5 | 在屏幕上显示“P”，然后显示大气压力。 | *我们只显示“P”代表大气压力。* |


    > ***免编程选项***：*你可以在我们的***资源网站**上找到本节所用代码的预编译版本。访问* [*http://xib.one/XB*](http://xib.one/XB)
    *并搜索***3.6 节**。


    **表 3-4**显示了如何将之前的自然语言代码转换为可以编译并加载到你的 micro:bit 上的 MakeCode 积木。


    **表 3-4** 使用 MakeCode 积木开发代码


    | 步骤 | MakeCode | 备注 |

    | --- | --- | --- |

    | 1 | 将 XinaBox `SW01` 扩展添加到你的项目中。 | • 点击**高级**/**扩展**。• 输入“XinaBox”²。• 选择`SW01`。
    |

    | 2 | 确保你的编程区域中有一个`forever`循环。 | ![../images/486852_1_En_3_Chapter/486852_1_En_3_Figa_HTML.jpg](img/486852_1_En_3_Figa_HTML.jpg)
    |

    | 3 | 将此处显示的两个积木添加到`forever`循环中：![../images/486852_1_En_3_Chapter/486852_1_En_3_Figb_HTML.jpg](img/486852_1_En_3_Figb_HTML.jpg)
    | 第一个积木用于显示“T”。第二个积木以整数形式显示温度。 |

    | 4 | 将此处显示的两个积木添加到`forever`循环中温度积木之后：![../images/486852_1_En_3_Chapter/486852_1_En_3_Figc_HTML.jpg](img/486852_1_En_3_Figc_HTML.jpg)
    | 第一个积木用于滚动显示“H”。第二个积木用于显示相对湿度。它不需要转换为整数。 |

    | 5 | 将此处显示的 2 个积木添加到`forever`循环中湿度积木之后：![../images/486852_1_En_3_Chapter/486852_1_En_3_Figd_HTML.jpg](img/486852_1_En_3_Figd_HTML.jpg)
    | 第一个积木用于显示“T”。第二个积木以整数形式显示压力。 |


    **图 3-5**显示了 micro:bit 气象站的完整 MakeCode 程序列表。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig5_HTML.jpg](img/486852_1_En_3_Fig5_HTML.jpg)


    **图 3-5** micro:bit 气象站的 MakeCode 积木


    代码编写完毕后，你只需编译并将其下载（“刷写”）到你的 micro:bit 上。


    刷写过程完成后，温度、湿度和大气压力数据将连续在 5x5 LED 矩阵上滚动显示。


    传感器读数取自安装在`SW01`上的一个小芯片：博世`BME280`就是`SW01`正面那个微型金属立方体。通过操作读数来测试传感器是否工作：


    1. **温度**：用手指触摸传感器几秒钟。手指的热量应导致温度上升（**图 3-6**）。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig6_HTML.jpg](img/486852_1_En_3_Fig6_HTML.jpg)


    **图 3-6** 用手指触摸传感器


    2. **湿度**：通过向`BME280`传感器呼气来改变湿度。你呼出的湿气应导致湿度增加（**图 3-7**）。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig7_HTML.jpg](img/486852_1_En_3_Fig7_HTML.jpg)


    **图 3-7** 为传感器加湿


    3. **压力**：拿一根空心橡胶管，将一端放在`SW01`上，使其覆盖`BME280`传感器。将管子和电路板紧紧固定在一起。然后向管子的另一端吹气（通过噘起的嘴唇用力吹）。这应会增加压力（**图
    3-8**）。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig8_HTML.jpg](img/486852_1_En_3_Fig8_HTML.jpg)


    **图 3-8** 向传感器施加气压


    ## 3.7 升级显示器


    micro:bit 的 5x5 LED 矩阵足以显示这三个测量值，但屏幕上同时只能显示一个字符，阅读起来很困难。并且字符滚动时很容易错过。


    为了解决这个缺点，并为我们提供一个更大的屏幕来输出数据/信息，我们将升级到 OLED 显示器。我们将使用来自 XinaBox³ 的 64x128 像素`OD01`显示屏，并调整代码，以便在
    OLED 上同时显示所有三个测量值。


    > ***免编程选项**：你可以在我们的***资源网站**（*[`xib.one/XB`](http://xib.one/XB)*）上找到本节所需代码的预编译版本。


    我们正在构建的工具先前已在**图 3-4**中展示。其代码非常相似：我们只需调整它，使其将输出定向到 64x128 OLED 屏幕，而不是 micro:bit
    的 5x5 LED 矩阵。


    **图 3-9**显示了带有 XinaBox `OD01` OLED 显示器的 micro:bit 气象站的 MakeCode 积木。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig9_HTML.jpg](img/486852_1_En_3_Fig9_HTML.jpg)


    **图 3-9** 带 OLED 的 micro:bit 气象站的 MakeCode 积木


    **注意**

    此代码需要 XinaBox `OD01` 扩展。通过点击 **高级/扩展**，然后输入 `“xinabox/pxt-od01”` 来导入它。

