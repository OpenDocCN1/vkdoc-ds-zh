  trans: '

    ## 3.8 实验设计


    我们已经掌握了设计实验所需的所有背景信息，并且拥有一个用于收集数据的数字工具。我们将遵循的过程在**表** **3-5** 中进行了概述。


    **表 3-5** 练习 3-1 的详细信息


    | 练习 3-1 | 温度、湿度和气压的综合影响如何影响我对天气的感知 |

    | --- | --- |

    | 摘要 | 使用**表** **3-1** 作为模板记录天气数据日志。一天中的任何时间都可以采集数据：目标是记录尽可能多的不同天气场景。尝试采集大约 15
    个测量值。本练习旨在介绍如何处理多个变量以及寻找数据中的模式/相关性。如果实验按计划进行，参与者可能会注意到温度和气压之间存在有趣的相关性。 |

    | 分步流程 | 1. 参与者应绘制一个表格来捕获数据。他们需要能够使用测量温度、湿度和气压的工具。2. 参与者应尝试每天记录几次数据，理想情况下是在各种条件下进行记录。我们希望收集广泛多样的数据。在处理数据收集工具时，请运用我们在第
    1 章和第 2 章中学到的谨慎原则。3. 当参与者收集到 15 个数据点时，就足够了。4. 数据收集完成后，着手处理**第 3.9 节 分析**中列出的要点。
    |

    | 我们将学到什么 | • 温度、湿度和气压如何影响我们对天气的评价。• 相关性的介绍。• 在分析中使用可视化。• 自然界中温度和气压之间存在相关性^(⁴)，并且这种相关性有可能在你的结果中显现出来。如果是这样，我们使用的可视化技术应该有助于我们观察到这一点。
    |


    ## 3.9 可视化收集到的数据


    我们已经收集了相当多的数据：填好的表格里密密麻麻都是数字。大多数人发现，通过将数据/数字组转换为信息图或图表等图像，更容易理解它们。这些可视化结果是数据的摘要，其中最佳的可视化结果能够将多年的研究和数据收集浓缩成普通人在一眼之间就能理解的简单表示。在本节中，我们将在纸上创建一个可视化结果，并在下一节中对其进行分析，以寻找我们最初问题的答案。


    首先，在一张纸上画一个空白的图表，如图 **3-10** 所示。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig10_HTML.jpg](img/486852_1_En_3_Fig10_HTML.jpg)


    **图 3-10** 已准备好添加数据的空白图表


    接下来，将下表（**表** **3-6**）抄写到另一张纸上，并填写温度、湿度和气压的最大值和最小值。我们同样对中点感兴趣——即最小值和最大值之间的中间值。通过执行以下操作来填写：


    *   通过从最大值中减去最小值来找出范围。

    *   将范围除以 2。

    *   将该值加到最小值上，得到中点。


    > *因此，如果你的最小值是 12，最大值是 20，那么中点就是 16。*

    > *对于最小值 94 和最大值 101，中点就是 97.5。*


    **表 3-6** 记录天气值的范围（最小值和最大值）


    | 测量项 | 最小值 | 最大值 | 区间（最大值 – 最小值） | 半区间（区间/2） | 中点（最小值 + 半区间） |

    | --- | --- | --- | --- | --- | --- |

    | 温度 | 11 | 27 | 16 | 8 | 19 |

    | 湿度 | 30 | 68 | 38 | 19 | 49 |

    | 气压 | 95 | 102 | 7 | 3.5 | 98.5 |


    我们将以**表** **3-6** 作为参考，逐一处理天气数据的每一行，在图表上为温度、湿度和气压添加标记。我们为每个变量添加一个视觉上不同的标记（如图 **3-11**
    所示）。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig11_HTML.jpg](img/486852_1_En_3_Fig11_HTML.jpg)


    **图 3-11** 已添加第一行数据的图表


    我们从第一行数据开始，如**表** **3-7** 所示。


    **表 3-7** 我的第一个数据点——英格兰一个阴冷的夏日雨天


    | 日 | 时间 | 温度 | 湿度 | 气压 | 评分 | 备注 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 周一 | 上午 10 点 | 16 | 55 | 97 | **2** | 穿抓绒衣&下雨 |


    当我们把这行数据添加到图表上时，看起来就像**图** **3-11**。


    在**图** **3-11** 中，可以清晰地看到哪个值是温度、湿度和气压。如果你喜欢，可以使用其他标记，只要确保容易看出哪个标记对应哪个测量项即可。


    要将标记放置在图表上，请遵循以下步骤：


    *   所有三个标记都直接添加在数字 2 的上方。这是我给出的**评分**：当时对于夏天来说很冷，而且雨下得很大，所以我给它打了 2 分。

    *   我的总体最低温度是 12，最高温度是 27，因此中点是 19.5。那天的温度是 15，高于最低值但低于中点。*我将“T”标记添加在最低值和中点之间，稍微更靠近最低值。*

    *   我的最低湿度是 30，最高是 68，中点是 49。我记录的湿度值是 58，大约位于中点与最大值之间的一半位置。*我将“H”标记添加在中点和最大值之间。*

    *   我的最低气压是 95，最高是 101。我的读数是 96，低于中点（98）但高于最低值，更接近最低值。*我将“P”标记添加在最低值略偏上的位置。*


    依此类推：继续使用这种方法，处理表格中的所有行，并将标记添加到图表中。有些标记会略微重叠，但这没关系——关键在于我们已清晰标记了温度、湿度和气压，这样当我们查看图表时，眼睛可以很容易地识别每个标记代表什么。完成后，你的图表应该类似于**图**
    **3-12** 所示的样子。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig12_HTML.jpg](img/486852_1_En_3_Fig12_HTML.jpg)


    **图 3-12** 一个完成的可视化结果


    你可能已经注意到，我们在绘制数据图表时有些不够精确；如果多花点功夫，本可以做到更加准确。可视化只是数据的摘要：它是一个比充满数字的表格更容易理解的快照。我们走了一些捷径以使绘制图表更简单快捷，但如果我们的可视化结果不够充分，我们总是可以尝试以更高的精度重新创建它。让我们看看目前这个版本的效果如何。'
- fmt: '# 3.10 Analyzing the Data We Collected


    In Chapters [1](#486852_1_En_1_Chapter.xhtml) and [2](#486852_1_En_2_Chapter.xhtml)
    we looked at a range of different questions to ask of the data and the experimental
    design, and those questions should always be on your mind when data analysis begins.


    But for this experiment our stated objective was very clear: the person recording
    the data would learn about how temperature, humidity, and atmospheric pressure
    all impact on their personal experience of the weather. What combined levels of
    each of those variables would you most want on your next holiday?


    Let us see what we can learn from our chart. Given that every chart made in this
    experiment will be different it is impossible to anticipate what you are looking
    at. Instead, we will review the results the authors collected when conducting
    this experiment.


    We saw the full results in **Figure** [**3-12**](#486852_1_En_3_Chapter.xhtml#Fig12),
    but we are looking for patterns. To help in our search, consider the following
    marks we have added to the chart in **Figure** [**3-13**](#486852_1_En_3_Chapter.xhtml#Fig13):


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig13_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig13_HTML.jpg)


    Figure 3-13


    Grouping together my temperature and pressure scores


    - A red box around the temperature markers

    - A yellow box around the pressure markers

    - A black box around both of these


    The black box is quite effective at showing the relationship between the rating
    I gave and temperature and pressure:


    - **Top left of Figure** [**3-13**](#486852_1_En_3_Chapter.xhtml#Fig13): My ratings
    correlate strongly with temperature: I like warm days and I tend to score them
    more highly compared to colder days. This is not surprising or new information:
    I knew this already. But it is good news: the visualization that I created shows
    a correlation that I know to be true, which validates the visualization we have
    used. Perhaps other, less obvious correlations may be lurking in the data.


    - **Bottom left of Figure** [**3-13**](#486852_1_En_3_Chapter.xhtml#Fig13): Pressure
    also correlates with my ratings: I like high pressure days more than I do the
    days with low pressure. This was bit of a surprise to me: it wasn’t something
    I’d paid much attention to before conducting this experiment.


    - **High levels of humidity correlate with the extremes of my ratings**: If humidity
    is high, I am either going to like the day or hate it. This was also a bit of
    a surprise to me, and I am not sure what to make of it. Is this useful information,
    or is it just interesting?


    Did you find anything similar? Every visualization will be unique and any conclusions
    drawn are personal: they apply only to the person who recorded the rating data.


    > *It is likely that, for some people who completed the visualization, the temperature
    and atmospheric pressure markers will show evidence of correlation. In the data
    shown here we can see how (relatively) low temperature and low pressure tend to
    occur simultaneously, as do high temperature and high pressure. This can be observed
    in Figure* [*3-13*](#486852_1_En_3_Chapter.xhtml#Fig13)*: the charts on the right-hand
    side show that pressure and temperature display very similar behavior. Did your
    temperature and pressure scores display this quality?*


    If the answer is “yes,” then the tendency might be to take it as proven that a
    correlation between temperature and pressure exists. But our experiment was not
    designed to draw this conclusion. Our experiment has met its objective: we learned
    a few things about how we perceive weather conditions. In addition, it has also
    given us a hint of something interesting: a real-world correlation between two
    completely different phenomena. But to be able to say with any certainty that
    there is a correlation between temperature and pressure we need to gather a lot
    more data and use more sophisticated analysis techniques. It is prudent to be
    cautious when drawing conclusions: hard facts are prized treasures in data science
    and usually are hard to come by.


    ## 3.11 Summary


    In this chapter we set out to understand how temperature, humidity and pressure
    impact on our perception of the weather, and we have built tools and visualizations
    to help us answer this question. The goal was to introduce the concept of correlations
    and to search for some in the data we collected. We will look again at correlations
    in **Chapter** [**5**](#486852_1_En_5_Chapter.xhtml).


    Some readers will have observed correlations in their visualizations which are
    meaningful: they tell you something that feels interesting and/or true. Perhaps
    this was something you already knew (most of us know how temperature impacts on
    our rating of the weather) or maybe there was new information (fewer people are
    as aware of the impact of atmospheric pressure). The key takeout is not what we
    learned (or didn’t learn) about temperature, humidity or pressure though. Instead,
    this exercise has shown that you can collect different data sets and apply analytical
    techniques to reveal correlations between them: using data science we can analyze
    the effects that different real-world phenomena have on each other. We can learn
    new things about the world.


    Footnotes [1](#486852_1_En_3_Chapter.xhtml#Fn1_source)   [2](#486852_1_En_3_Chapter.xhtml#Fn2_source)
      [3](#486852_1_En_3_Chapter.xhtml#Fn3_source)


    # 4. Working with Large Data Sets


    In this chapter we are going to take a step forward in our data science experimentation
    by significantly increasing the volume of data that we collect. So far we have
    worked with a dozen data points, and that was adequate for our needs. But sometimes
    correlations (and other interesting features of data) are subtle and hard to find.
    The larger our data set, the more likely it is that the answers we are looking
    for lie within it.


    If we are going to gather hundreds, thousands, or even millions of data points,
    there is a weakness in our toolkit: a flaw that limits how much data we can reasonably
    collect. Consider this question: how would we redesign the experiment in **Chapter**
    [**3**](#486852_1_En_3_Chapter.xhtml) if we wanted to record the weather measures
    over an extended period of time, say 24 hours?


    The weak spot is of course the human being with paper and pen in hand, dutifully
    standing in the elements for a whole day and night recording temperature, humidity
    and pressure every 5 minutes.


    In this chapter we will begin to eliminate the human factor from the data collection
    process by collecting and storing the data digitally. This will allow us to build
    up a large collection of temperature and pressure data which we will analyze for
    correlations in **Chapter** [**5**](#486852_1_En_5_Chapter.xhtml).'
  raw: '## 3.10 Analyzing the Data We Collected


    In Chapters [1](#486852_1_En_1_Chapter.xhtml) and [2](#486852_1_En_2_Chapter.xhtml)
    we looked at a range of different questions to ask of the data and the experimental
    design, and those questions should always be on your mind when data analysis begins.


    But for this experiment our stated objective was very clear: the person recording
    the data would learn about how temperature, humidity, and atmospheric pressure
    all impact on their personal experience of the weather. What combined levels of
    each of those variables would you most want on your next holiday?


    Let us see what we can learn from our chart. Given that every chart made in this
    experiment will be different it is impossible to anticipate what you are looking
    at. Instead, we will review the results the authors collected when conducting
    this experiment.


    We saw the full results in **Figure** [**3-12**](#486852_1_En_3_Chapter.xhtml#Fig12),
    but we are looking for patterns. To help in our search, consider the following
    marks we have added to the chart in **Figure** [**3-13**](#486852_1_En_3_Chapter.xhtml#Fig13):


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig13_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig13_HTML.jpg)


    Figure 3-13


    Grouping together my temperature and pressure scores


    *   A red box around the temperature markers


    *   A yellow box around the pressure markers


    *   A black box around both of these


    The black box is quite effective at showing the relationship between the rating
    I gave and temperature and pressure:


    *   **Top left of Figure** [**3-13**](#486852_1_En_3_Chapter.xhtml#Fig13): My
    ratings correlate strongly with temperature: I like warm days and I tend to score
    them more highly compared to colder days. This is not surprising or new information:
    I knew this already. But it is good news: the visualization that I created shows
    a correlation that I know to be true, which validates the visualization we have
    used. Perhaps other, less obvious correlations may be lurking in the data.


    *   **Bottom left of Figure** [**3-13**](#486852_1_En_3_Chapter.xhtml#Fig13):
    Pressure also correlates with my ratings: I like high pressure days more than
    I do the days with low pressure. This was bit of a surprise to me: it wasn’t something
    I’d paid much attention to before conducting this experiment.


    *   **High levels of humidity correlate with the extremes of my ratings**: If
    humidity is high, I am either going to like the day or hate it. This was also
    a bit of a surprise to me, and I am not sure what to make of it. Is this useful
    information, or is it just interesting?


    Did you find anything similar? Every visualization will be unique and any conclusions
    drawn are personal: they apply only to the person who recorded the rating data.


    > *It is likely that, for some people who completed the visualization, the temperature
    and atmospheric pressure markers will show evidence of correlation. In the data
    shown here we can see how (relatively) low temperature and low pressure tend to
    occur simultaneously, as do high temperature and high pressure. This can be observed
    in Figure* [*3-13*](#486852_1_En_3_Chapter.xhtml#Fig13)*: the charts on the right-hand
    side show that pressure and temperature display very similar behavior. Did your
    temperature and pressure scores display this quality?*


    If the answer is “yes,” then the tendency might be to take it as proven that a
    correlation between temperature and pressure exists. But our experiment was not
    designed to draw this conclusion. Our experiment has met its objective: we learned
    a few things about how we perceive weather conditions. In addition, it has also
    given us a hint of something interesting: a real-world correlation between two
    completely different phenomena. But to be able to say with any certainty that
    there is a correlation between temperature and pressure we need to gather a lot
    more data and use more sophisticated analysis techniques. It is prudent to be
    cautious when drawing conclusions: hard facts are prized treasures in data science
    and usually are hard to come by.


    ## 3.11 Summary


    In this chapter we set out to understand how temperature, humidity and pressure
    impact on our perception of the weather, and we have built tools and visualizations
    to help us answer this question. The goal was to introduce the concept of correlations
    and to search for some in the data we collected. We will look again at correlations
    in **Chapter** [**5**](#486852_1_En_5_Chapter.xhtml).


    Some readers will have observed correlations in their visualizations which are
    meaningful: they tell you something that feels interesting and/or true. Perhaps
    this was something you already knew (most of us know how temperature impacts on
    our rating of the weather) or maybe there was new information (fewer people are
    as aware of the impact of atmospheric pressure). The key takeout is not what we
    learned (or didn’t learn) about temperature, humidity or pressure though. Instead,
    this exercise has shown that you can collect different data sets and apply analytical
    techniques to reveal correlations between them: using data science we can analyze
    the effects that different real-world phenomena have on each other. We can learn
    new things about the world.


