- fmt: '### 3.1 Introduction


    If you had to pick the single most important concept within data science it would
    probably be **correlations**:


    > When two different data sets are correlated it means that they will usually
    behave in ways that are mutually predictable: by observing one data set we can
    make predictions about the other data set. We have an intuitive understanding
    of correlations: we know it gets cooler at night, so there is a correlation between
    the time of day and the temperature; we also take it for granted that taller people
    tend to weigh a bit more than shorter people, all other things being equal. A
    lot of what we call “common sense” is built on these sorts of real-world correlations.
    We will look at correlations in more detail in **Chapter** [**5**](#486852_1_En_5_Chapter.xhtml).


    Discovering correlations in data is exciting and can lead to very interesting,
    sometimes groundbreaking, insights. We are going to collect a load of data and
    then search it for correlations.


    ### 3.2 Measuring Weather


    Humans have a sense of the weather – our experience of it is visceral – we can
    feel it. It can make or break our moods, save or doom whole civilizations and
    turn a dream day into a lifelong regret. And, of course, those beautiful rainbows!


    Weather is a fundamental human experience; with climate change disrupting weather
    patterns all over the world and bringing extreme events the need to study it grows
    increasingly urgent. The more we understand the weather the better we can predict
    it and maybe even control it. But this understanding begins with data, which we
    are going to collect. So how do we measure **“the weather”**?


    Climate/weather scientists use a variety of measures such as temperature, humidity,
    atmospheric pressure, light levels, soil moisture, soil temperature, wind direction
    and speed, rain gauges, and many more:


    > There is a dizzying array of factors that have an impact on or help to describe
    **“the weather.”** The mathematics used to predict weather is referred as **chaos
    theory**, which is very apt! A butterfly might flick its wings in the Amazon and
    cause a monsoon in Bulgaria, but only if countless other factors all align perfectly.
    Weather predictions have won wars and lost lives and improving the quality of
    these predictions is a never-ending quest for a whole industry of data scientists.


    ### 3.3 Choosing the Data to Measure


    We are going to build a weather station that monitors three key weather-related
    parameters (factors):


    **Temperature**: We’ve looked at this in detail already.


    **Humidity** is the amount of water vapor (moisture) present in the air. Water
    vapor is the gaseous phase of water: tiny particles of water that are part of
    the air that we breath.


    As with temperature, extreme levels of humidity are uncomfortable: the dry, brittle
    heat of the low humidity desert and the moist, cloying stickiness of the rainforest
    feel very different, but equally uncomfortable.


    Humidity is typically measured in two ways.


    1. One method is called the **specific humidity**: This is a measure of the mass
    of water vapor present in a kilogram mass of air (including the water). If the
    air is more humid, it has more water vapor. If the air is less humid, it has less
    water vapor.


    2. A much more common measurement is **relative humidity**, which is the amount
    of water vapor in the air compared to the maximum amount of water vapor that the
    air could possibly contain at that temperature – warmer air can hold more vapor
    than cold air. This value is shown as a percentage.


    When you watch a weather report and they mention the humidity, they are generally
    referring to the relative humidity: our perception of humidity correlates more
    with relative humidity than specific humidity.


    We use a tool called a **hygrometer** to measure the amount of vapor in the air,
    in soil or confined spaces. There are analog and digital hygrometers: our tools
    will be digital.


    **Atmospheric (air) pressure** (sometimes referred to as barometric pressure)
    is the amount of pressure exerted by the atmosphere:


    > Look straight up: for several miles above you there is air, lots and lots of
    air, and it has mass. That air is being pulled down by gravity – right onto your
    head! Atmospheric pressure is basically a measure of how much air there is above
    a given area.


    We measure atmospheric pressure by looking at the amount of pressure air exerts
    on a fixed area. For example, at sea level on an average day, the atmospheric
    pressure will be around 14.7 pounds per square inch. This amounts to


    * Roughly 1 kilogram of pressure per square centimeter

    * Several tons on an adult of average size

    * 2100 tons on a home of about 2000 square feet


    **Figure** [**3-1**](#486852_1_En_3_Chapter.xhtml#Fig1) illustrates that pressure
    at point **X** is a factor of the weight of the air above it.


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig1_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Weight of the air in the column applying pressure to point X


    The most commonly used unit for measuring atmospheric pressure is the pascal or
    kilopascal: 1 kPa = 1000 Pa. Other units that are used include PSI (pounds per
    square inch) and millibars (or just bars). In this book we will use `kPa`.


    > To understand the `kPa` scale it is helpful to note that at sea level the amount
    of pressure is around `101kPa`. As you go higher the average `kPa` declines –
    it is about `34kPa` on top of Mount Everest. The highest pressure ever recorded
    occurring naturally in the air at or above sea level is just below `109kPa`.


    Air pressure is what makes your ears pop when you change altitude quickly and
    it’s what we add to our tires when we pump them up. When we inflate a balloon
    we increase the pressure inside and many people report reactions such as headaches
    and anxiety when the pressure is especially high. As with temperature and humidity,
    atmospheric pressure is something we are able to perceive.


    Atmospheric pressure is an important facet of the weather too: high pressure tends
    to bring more settled and pleasant weather, while dropping pressure often precedes
    inclement conditions. The movement of air from areas of high to low pressure is
    a fundamental force shaping our planet’s weather.'
  raw: '## 3.1 Introduction


    If you had to pick the single most important concept within data science it would
    probably be **correlations**:


    > *When two different data sets are correlated it means that they will usually
    behave in ways that are mutually predictable: by observing one data set we can
    make predictions about the other data set. We have an intuitive understanding
    of correlations: we know it gets cooler at night, so there is a correlation between
    the time of day and the temperature; we also take it for granted that taller people
    tend to weigh a bit more than shorter people, all other things being equal. A
    lot of what we call “common sense” is built on these sorts of real-world correlations.
    We will look at correlations in more detail in* ***Chapter*** [**5**](#486852_1_En_5_Chapter.xhtml)*.*


    Discovering correlations in data is exciting and can lead to very interesting,
    sometimes groundbreaking, insights. We are going to collect a load of data and
    then search it for correlations.


    ## 3.2 Measuring Weather


    Humans have a sense of the weather – our experience of it is visceral – we can
    feel it. It can make or break our moods, save or doom whole civilizations and
    turn a dream day into a lifelong regret. And, of course, those beautiful rainbows!


    Weather is a fundamental human experience; with climate change disrupting weather
    patterns all over the world and bringing extreme events the need to study it grows
    increasingly urgent. The more we understand the weather the better we can predict
    it and maybe even control it. But this understanding begins with data, which we
    are going to collect. So how do we measure **“the weather”**?


    Climate/weather scientists use a variety of measures such as temperature, humidity,
    atmospheric pressure, light levels, soil moisture, soil temperature, wind direction
    and speed, rain gauges, and many more:


    > *There is a dizzying array of factors that have an impact on or help to describe*
    ***“the weather**.**”*** *The mathematics used to predict weather is referred
    as* ***chaos theory**, which is very apt! A butterfly might flick its wings in
    the Amazon and cause a monsoon in* Bulgaria*, but only if countless other factors
    all align perfectly. Weather predictions have won wars and lost lives and improving
    the quality of these predictions is a never-ending quest for a whole industry
    of data scientists.*


    ## 3.3 Choosing the Data to Measure


    We are going to build a weather station that monitors three key weather-related
    parameters (factors):


    **Temperature**: We’ve looked at this in detail already.


    **Humidity** is the amount of water vapor (moisture) present in the air. Water
    vapor is the gaseous phase of water: tiny particles of water that are part of
    the air that we breath.


    As with temperature, extreme levels of humidity are uncomfortable: the dry, brittle
    heat of the low humidity desert and the moist, cloying stickiness of the rainforest
    feel very different, but equally uncomfortable.


    Humidity is typically measured in two ways.


    1.  One method is called the **specific humidity**: This is a measure of the mass
    of water vapor present in a kilogram mass of air (including the water). If the
    air is more humid, it has more water vapor. If the air is less humid, it has less
    water vapor.


    2.  A much more common measurement is **relative humidity**, which is the amount
    of water vapor in the air compared to the maximum amount of water vapor that the
    air could possibly contain at that temperature – warmer air can hold more vapor
    than cold air. This value is shown as a percentage.


    When you watch a weather report and they mention the humidity, they are generally
    referring to the relative humidity: our perception of humidity correlates more
    with relative humidity than specific humidity.


    We use a tool called a **hygrometer** to measure the amount of vapor in the air,
    in soil or confined spaces. There are analog and digital hygrometers: our tools
    will be digital.


    **Atmospheric (air) pressure** (sometimes referred to as barometric pressure)
    is the amount of pressure exerted by the atmosphere:


    > *Look straight up: for several miles above you there is air, lots and lots of
    air, and it has mass. That air is being pulled down by gravity – right onto your
    head! Atmospheric pressure is basically a measure of how much air there is above
    a given area.*


    We measure atmospheric pressure by looking at the amount of pressure air exerts
    on a fixed area. For example, at sea level on an average day, the atmospheric
    pressure will be around 14.7 pounds per square inch. This amounts to


    *   Roughly 1 kilogram of pressure per square centimeter


    *   Several tons on an adult of average size


    *   2100 tons on a home of about 2000 square feet


    **Figure** [**3-1**](#486852_1_En_3_Chapter.xhtml#Fig1) illustrates that pressure
    at point **X** is a factor of the weight of the air above it.


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig1_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Weight of the air in the column applying pressure to point X


    The most commonly used unit for measuring atmospheric pressure is the pascal or
    kilopascal: 1 kPa = 1000 Pa. Other units that are used include PSI (pounds per
    square inch) and millibars (or just bars). In this book we will use kPa.


    > *To understand the kPa scale it is helpful to note that at sea level the amount
    of pressure is around 101kPa. As you go higher the average kPa declines – it is
    about 34kPa on top of* Mount Everest*. The highest pressure ever recorded occurring
    naturally in the air at or above sea level is just below 109kPa.*


    Air pressure is what makes your ears pop when you change altitude quickly and
    it’s what we add to our tires when we pump them up. When we inflate a balloon
    we increase the pressure inside and many people report reactions such as headaches
    and anxiety when the pressure is especially high. As with temperature and humidity,
    atmospheric pressure is something we are able to perceive.


    Atmospheric pressure is an important facet of the weather too: high pressure tends
    to bring more settled and pleasant weather, while dropping pressure often precedes
    inclement conditions. The movement of air from areas of high to low pressure is
    a fundamental force shaping our planet’s weather.'
  trans: '### 3.1 引言


    如果要在数据科学中挑选一个最重要的概念，那很可能是**相关性**：


    > 当两个不同的数据集存在相关性时，意味着它们通常会在某种可相互预测的方式下表现：通过观察一个数据集，我们可以对另一个数据集做出预测。我们对相关性有一种直观的理解：我们知道夜晚会更凉爽，所以一天中的时间与温度之间存在相关性；我们也会理所当然地认为，在其他条件相同的情况下，个子高的人往往比个子矮的人更重一些。我们称之为“常识”的很多东西都建立在现实世界中这类相关性之上。我们将在**第**
    **5** **章**中更详细地探讨相关性。


    在数据中发现相关性是令人兴奋的，并且可能带来非常有趣、有时甚至是开创性的洞见。我们将收集大量数据，然后从中搜索相关性。


    ### 3.2 测量天气


    人类对天气有一种感知——我们对它的体验是发自内心的——我们能感受到它。它既能成就或破坏我们的情绪，也能拯救或毁灭整个文明，还能把一个完美的日子变成终生的遗憾。当然，还有那些美丽的彩虹！


    天气是人类的基本体验；随着气候变化扰乱世界各地的天气模式并带来极端事件，研究天气的需求变得越来越紧迫。我们对天气了解得越多，就越能更好地预测它，甚至可能控制它。但这种理解始于数据，我们将着手收集这些数据。那么，我们如何测量**“天气”**呢？


    气候/天气科学家会使用多种测量指标，例如温度、湿度、大气压力、光照水平、土壤湿度、土壤温度、风向和风速、雨量计等等：


    > 影响或有助于描述**“天气”**的因素多得令人眼花缭乱。用于预测天气的数学方法被称为**混沌理论**，这非常贴切！一只蝴蝶可能在亚马逊扇动翅膀，并在保加利亚引发一场季风，但这只会在无数其他因素完美契合的情况下发生。天气预测曾赢得过战争，也曾导致过生命损失，而提高这些预测的质量是整个数据科学家行业永无止境的追求。


    ### 3.3 选择要测量的数据


    我们将搭建一个气象站，用于监测三个关键的天气相关参数（因素）：


    **温度**：我们已经详细探讨过这个参数了。


    **湿度**是指空气中存在的水蒸气（水分）含量。水蒸气是水的气态形式：微小的水颗粒是我们呼吸空气的一部分。


    与温度一样，极端湿度水平也会让人感到不适：低湿度沙漠干燥、脆弱的酷热与雨林潮湿、粘人的闷热感截然不同，但同样令人不适。


    湿度通常通过两种方式测量。


    1. 一种方法称为**比湿度**：这是对一千克质量的空气（包括水在内）中所含水蒸气质量的度量。如果空气更潮湿，则水蒸气更多。如果空气较干燥，则水蒸气较少。


    2. 一种更常见的测量方法是**相对湿度**，即空气中实际水蒸气含量与该温度下空气可能容纳的最大水蒸气量之比——温暖的空气比冷空气能容纳更多的水蒸气。该值以百分比表示。


    当你观看天气预报，他们提到湿度时，通常指的是相对湿度：我们对湿度的感知与相对湿度的关联性比与比湿度更强。


    我们使用一种叫做**湿度计**的工具来测量空气、土壤或封闭空间中的水蒸气含量。有模拟湿度计和数字湿度计：我们的工具将是数字式的。


    **大气压力**（有时称为气压）是指大气所施加的压力大小：


    > 抬头向上看：在你上方数英里的空中都是空气，大量大量的空气，而且它们有质量。这些空气被地球引力向下拉——正好压在你的头上！大气压力本质上是衡量给定区域上方有多少空气的一个指标。


    我们通过观察空气对固定区域施加的压力大小来测量大气压力。例如，在海平面在一个普通的日子里，大气压力约为每平方英寸 14.7 磅。这相当于：


    *   每平方厘米大约 1 千克的压力

    *   对一个中等身材的成年人施加数吨的压力

    *   对一个约 2000 平方英尺的房屋施加 2100 吨的压力


    **图** **3-1** 说明了点 **X** 处的压力是其上方空气重量的一个因素。


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig1_HTML.jpg](img/486852_1_En_3_Fig1_HTML.jpg)


    图 3-1


    柱状空气施加在点 X 上的重量


    测量大气压力最常用的单位是帕斯卡或千帕：1 kPa = 1000 Pa。其他使用的单位包括 PSI（磅每平方英寸）和毫巴（或简称巴）。在本书中，我们将使用
    `kPa`。


    > 要理解 `kPa` 这个量程，有必要知道在海平面上的压力大约是 `101kPa`。随着海拔升高，平均 `kPa` 会下降——在珠穆朗玛峰顶约为 `34kPa`。在海平面或以上自然发生的大气压力中有记录的最高值略低于
    `109kPa`。


    当你快速改变海拔高度时，是空气压力让耳朵感到发闷；我们给轮胎充气时，增加的就是这种压力。当我们给气球充气时，我们增加了内部的压力；许多人报告说，当气压特别高时，会有头痛和焦虑等反应。与温度和湿度一样，大气压力也是我们能够感知到的。


    大气压力同样是天气的一个重要方面：高压往往会带来更稳定、宜人的天气，而气压下降则常常预示着恶劣天气的到来。空气从高压区向低压区的移动是塑造我们地球天气的基本力量。'
- fmt: '## 3.4 Experimenting with Weather


    An experiment is a project designed to learn something or demonstrate something
    already learned. In this experiment we are going to try and learn how the measures
    we collect correlate with the way we describe the weather:


    > *This weather experiment will help us understand how temperature, humidity and
    atmospheric pressure relate to our perception of the weather. The experiment will
    show what combinations of these measures offer ideal weather conditions for the
    person recording the data.*


    In our experiment we will collect temperature, humidity and atmospheric pressure
    data over an extended period and at different times. The ideal would be to keep
    a log over a few days.


    When we take readings, we are going to make a subjective evaluation of the weather
    at that moment – we’ll give it a score from 1 to 10, where:


    1. A score of 10 means it is the best possible weather for where you are at that
    time of year.

    2. A score of 1 means the worst weather it could reasonably be at this time of
    year.

    3. A score of 5 means the weather is exactly what is expected for the time of
    year.


    This is meant to be subjective: give a score based on how you feel about the weather
    at the moment of recording the data – don’t think too hard about it! Variety is
    good too – try to gather results for lots of different weather conditions.


    We will record the data in a table based on **Table** [**3-1**](#486852_1_En_3_Chapter.xhtml#Par111).


    ***Table 3-1.*** *A blank data table for our weather station experiment*


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fige_HTML.png](images/486852_1_En_3_Chapter/486852_1_En_3_Fige_HTML.png)


    This experiment mixes **objective data** (time, temperature, humidity, and pressure)
    with **subjective** data (rating out of 10 and notes).


    > *Subjective measures are typically not very reliable and data scientists avoid
    them where possible, or heavily manage them where not. But we will be careful
    in our analysis to not extrapolate our results: this experiment will give the
    person who records their ratings insights into how their experience of weather
    is linked to temperature, humidity and atmospheric pressure. We should not expect
    the experiment to tell us anything else. But we will keep an open mind in our
    analysis.*


    ## 3.5 Building Our Weather Station Tool


    To perform our experiment we need to build a digital instrument that will measure
    temperature, humidity and atmospheric pressure.


    **Figure** [**3-2**](#486852_1_En_3_Chapter.xhtml#Fig2) shows the **“circuit”**
    or **“block”** diagram for a digital weather station instrument.


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig2_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    “Circuit” or “block” diagram for the weather station tool, with a power source,
    weather sensor, and OLED display attached to a microprocessor


    **Table** [**3-2**](#486852_1_En_3_Chapter.xhtml#Tab2) lists the hardware that
    we will use to build our weather station tool.


    Table 3-2


    Hardware requirements for the weather station tool


    | What you need | What we use | Qty | Alternatives |

    | --- | --- | --- | --- |

    | A microprocessor and the means to flash code onto it | micro:bit with USB cable
    to connect to laptop/desktop | 1 | Raspberry PiCircuit Playground |

    | Power | 2xAAA battery holder | 1 | Seenov Inc Solar Battery |

    | A sensor to read weather data | XinaBox SW01 – advanced weather sensor | 1 |
    SparkFun Weatherbit |

    | A screen to view data | micro:bit 5x5 LED matrix | 1 | XinaBox OD01 – 64x128
    OLED display |

    | The means to connect it all together | XinaBox IM01 micro:bit bridge | 1 | Breadboard,
    edge connector breakout, crocodile/alligator leads and hookup wires |

    | xBus connectors to connect xChips together | 3 |


    We will show you two options for displaying sensor data:


    1. This section and **Section 3.6** show how to use the micro:bit 5x5 LED matrix.

    2. In **section 3.7** we will add a 64x128 pixel OLED display to the micro:bit
    (the XinaBox OD01) and output our data there.


    Pick the appropriate option and assemble the parts as shown in either of the following
    images. Alternately use a completely different set of components to build a tool
    that can perform the same functions. The goal is to gather data and analyze it;
    the tool we use is not particularly important.


    **Figure** [**3-3**](#486852_1_En_3_Chapter.xhtml#Fig3) shows the weather station
    without OLED display.


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig3_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Weather station using micro:bit LED matrix for display


    **Figure** [**3-4**](#486852_1_En_3_Chapter.xhtml#Fig4) shows the weather station
    with OLED display.


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig4_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Weather station with OLED display'
