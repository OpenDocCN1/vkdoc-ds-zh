- fmt: '### 4.1 Experimental Design


    The experiment we are going to begin working on in this chapter is to investigate
    the correlation that we saw in Chapter [3](#486852_1_En_3_Chapter.xhtml) between
    temperature and pressure. We will record these measures over a 24-hour period
    and then we will analyze the data and quantify the strength of the correlation.
    Although this sounds similar to what we did in Chapter [3](#486852_1_En_3_Chapter.xhtml),
    there are two key differences:


    1. We are going to gather a lot more data.

    2. We are going to use software for our data analysis.


    The experiment is split over two chapters: in this chapter, we build and then
    use a micro:bit weather station to gather a large data set; then in Chapter [5](#486852_1_En_5_Chapter.xhtml)
    we analyze that data. Table [4-1](#486852_1_En_4_Chapter.xhtml#Tab1) describes
    how we will go about gathering the data we need for the experiment.


    **Table 4-1** Details for Exercise 4-1


    | Exercise 4-1 | Is there a correlation between temperature and atmospheric pressure?
    |

    | --- | --- |

    | Summary | We will gather as much temperature and pressure data as we can over
    a 24-hour period and then analyze it. |

    | Step-by-step process | 1. Find a suitable location for the data gathering instrument.
    Ensure it has fresh batteries. 2. Place the instrument in the chosen location
    and power it up. It will begin recording data. 3. After 24 hours go and collect
    the instrument. 4. Extract the data from the micro:bit and load it onto a computer.
    5. Use software on your computer to undertake analysis. |

    | What we will learn | • How to use file storage on the micro:bit. • How to construct
    a data file. • How to use a spreadsheet to undertake data analysis. • How correlations
    are quantified/measured. • How strongly temperature and pressure are correlated.
    • What is statistical significance. |


    The first thing we need for this experiment is a way of recording data over a
    24-hour period.


    ### 4.2 Using the micro:bit As a File Storage Device


    We can’t expect a person to stand in one place for 24 hours and write down temperature
    and pressure readings every few minutes. To eliminate the need for this we are
    going to save the data we record onto file during the data collection process,
    and then access the file afterward. Saving data straight to file will allow us
    to structure our data collection process much more efficiently: we will turn on
    our instrument, leave it for 24 hours while data is measured and recorded, and
    then come back and pick it up. The file will then be retrieved.


    `MicroPython` has a file system that allows us to save files on a micro:bit. There
    is no similar option on `MakeCode`, so we will need to write code for this in
    MicroPython.


    The first step in using the file system is learning how to write data to a file.
    For this, all you need is a micro:bit and a power source.


    The **natural language code** for writing to a file with micro:bit is listed in
    Table [4-2](#486852_1_En_4_Chapter.xhtml#Tab2).


    **Table 4-2** Natural language code for creating and writing to a file on the
    micro:bit


    | Step | Description | Notes |

    | --- | --- | --- |

    | 1 | Create the file. | Create a file on the micro:bit storage and provide a
    name for it. |

    | 2 | Open the file for writing. | The file has to be “open” before it can be
    used. |

    | 3 | Write to the file. | We will write some arbitrary data to the file, to check
    later that our code has succeeded. |

    | 4 | Close the file. | When we are finished using a file, we should always close
    it. |


    **No-code option**: You can find a fully working version of the code needed for
    this section on our **resource website**. Go to [`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)
    and search for **Section 4.1**.


    Table [4-3](#486852_1_En_4_Chapter.xhtml#Tab3) lists MicroPython code that implements
    the **natural language code** in Table [4-2](#486852_1_En_4_Chapter.xhtml#Tab2).


    **Table 4-3** Writing “Hello, World!” to a file with MicroPython


    | Step | MicroPython |

    | --- | --- |

    | 1&2 | Type the following and press ENTER: `with open(''hello.txt'', ''w'') as
    my_file:` This will create the file named `hello.txt` on the micro:bit storage
    and then open it for you to write into it later. |

    | 3 | Type the following and press ENTER: `my_file.write("Hello, World!")` This
    will write `Hello,World!` to the file. |

    | 4 | The file is closed for us – we do not need to write any code for this. |


    The complete `MicroPython` code for writing `“Hello, World!”` to a file is:


    ```

    with open(''hello.txt'', ''w'') as my_file:

    my_file.write("Hello, World!")

    ```


    Compile the code and flash it onto your micro:bit.


    Once the flashing process has completed and the micro:bit resets, a file named
    `“hello.txt”` is created with the content you provided (`“Hello, World!”`). In
    the following sections we will show you how to view and access that file.


    The code we have put onto the micro:bit basically tells it how to behave as a
    file storage device: we can now write anything we want to a file, including data,
    and we will be able to retrieve it later.


    This functionality elevates the potential of the micro:bit as a tool for data
    science. File storage enables us to expand our data gathering capabilities and
    perform experiments that might otherwise not be possible. In this chapter we’ll
    look at how to save data from the weather station to file, but the same technique
    could be used with any number of sensors. Your micro:bit could be the basis of
    digital tools that monitor all sorts of environmental measures.


    ### 4.3 Accessing Files on the micro:bit


    Once you have saved data onto a file on your micro:bit the next step is to retrieve
    it and use it on a computer, where sophisticated analysis tools are available
    to us.


    There are a few tools available that we can use to list and access the files stored
    on a micro:bit, including `Mu` and `MicroFS`. We will show you how to use `Mu`
    to access the file we have just written.


    Table [4-4](#486852_1_En_4_Chapter.xhtml#Tab4) presents the steps you need to
    follow to use `Mu` to view files on the micro:bit storage.


    **Table 4-4** Listing files on the micro:bit storage with Mu


    | Step | Description |

    | --- | --- |

    | 1 | Connect the micro:bit to your computer using a micro USB cable. |

    | 2 | On the `Mu toolbar`, click the `Files` button. The `Files` pane will appear
    on the bottom of the `Mu` window. In the `Files` pane, under `“Files on your micro:bit”`,
    you will see the list of files on your micro:bit. ![../images/486852_1_En_4_Chapter/486852_1_En_4_Figa_HTML.jpg](images/486852_1_En_4_Chapter/486852_1_En_4_Figa_HTML.jpg)
    Can you see the file you created in the preceding exercise? |

    | 3 | Click the `Files` button again to close the `Files` pane. |


    **Caution**


    When you flash a code onto the micro:bit using `Mu` a copy of your MicroPython
    code will save to the persistent storage (`main.py`). Deleting this file prevents
    your code from running and you need to reflash the micro:bit.'
