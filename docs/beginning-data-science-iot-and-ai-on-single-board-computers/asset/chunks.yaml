  trans: '

    # 1.4 控制数据


    在本节中，我们将开始设计一个实验，以调查你家、学校（或类似感兴趣地点）周围不同位置的温度。表面上看，这似乎是一个简单的任务，但我们会花些时间探讨如何确保我们的实验设计具有高质量。


    收集数据需要四处走动，在不同位置读取温度值。简单来说，流程如下：


    1.  准备好一份地点清单和一支温度计。

    2.  步行至指定地点。

    3.  查看温度计。

    4.  记录温度。

    5.  返回步骤 2 并重复，直到测量完所有地点。


    这个计划很简单，但存在缺陷。**练习 1-1**（如**表 1-2** 所述）将表明，当我们测量单一位置的温度时，还有其他因素会影响读数。我们将进行一项快速活动，以帮助识别这些**无关变量**。


    **无关变量**是指那些影响我们收集到的数据，但与我们所关注的事物无关的因素。理想的做法是将它们从我们的实验中排除。


    **表 1-2** 温度实验活动指南


    | 练习 1-1 | 控制无关变量 |

    | --- | --- |

    | 摘要 | 演示无关变量如何影响我们的读数，以及控制这些变量的方法。同时，这也为我们进行练习 1-2 做好准备。 |

    | 时长 | 5–10 分钟 |

    | 分步流程 | 1. 在单个房间内的 2 个不同位置测量温度。 2. 这些数值是否存在差异？如果存在，原因是什么？ 3. 重复测量：再次测量，但遵循“附加说明”部分概述的指南。
    4. 如果你在第一轮测量中发现了差异，现在是否还有类似的差异？ 5. 思考两种方法的差异——第二种方法付出的额外努力是否值得？ |

    | 附加说明 | 第二次读取温度计（步骤 3 中）时，请遵循以下流程： • 找一个平整的木质表面，该表面应避免阳光直射，且不要紧邻阳光直射处。该位置应远离气流，且不在任何角落。
    • 将温度计平放在平整的表面上，确保刻度清晰可见。 • 后退一步，等待 30 秒。 • 30 秒后，在不触碰温度计或对着它呼吸的情况下读取温度。 |

    | 我们将学到什么 | 无关变量的影响。“马虎”的数据收集过程如何导致不可靠的数据。识别和控制无关变量的价值，以及误差幅度如何显现。人类如何对科学产生影响。
    |


    前面的活动很可能会显示出差异——不同的温度读数。在一个封闭的房间里，这怎么可能呢？房间里的温度肯定是稳定的，那么为什么读数不全都一样呢？有许多因素可能导致这些差异，例如：


    *   将温度计置于阳光直射下，会比放在阴凉处得到更高的读数。

    *   用手握住温度计会传递一些热量给它，从而改变读数。

    *   由于空气流动和热源（例如人）的密度不同，某些房间的不同区域自然会偏暖/偏冷。

    *   空气源——例如强风、风扇或空调——会影响读数。

    *   不同的温度计可能校准方式不同，或者难以读取。


    通过详细规定读取温度计的过程（正如我们在活动的“附加说明”部分所做的那样），我们通过在所有测量中保持这些流程的一致，减少了无关变量的影响。用数据科学的术语来说，我们**控制**了这些变量。有些数据科学家可能会说，我们消除了数据中的一些“噪音”。


    ## 1.5 理解工具


    在本书中，我们将使用越来越复杂的工具来测量各种不同的数据类型。即使是使用简单的水银温度计，准确理解你的工具在测量什么也很重要。


    温度计读取的是**环境**温度——即温度计紧邻区域的温度。对于这个实验，我们希望测量某个位置（例如一个房间）的温度，但我们实际测量的是温度计周围有限区域内的温度。


    理解测量工具的工作原理，使我们能够识别可能影响读数、进而影响数据质量的因素。我们的温度计测量的是环境温度，而不是房间的温度；我们需要留意那些可能使环境温度与室温产生差异的因素。我们需要确保我们实际测量的那一小片空间区域，能够代表我们感兴趣的更大空间。我们可以利用这些知识来设计能提供更高质量数据的数据收集策略。

    '
- fmt: '# 1.6 Data Quality


    We collect data so that it can be used, and it is self-evident that high-quality
    data will be more useful than low-quality data, all other things being equal.
    GIGO: garbage in, garbage out. But what makes one set of data "higher quality"
    than another set?


    To judge the quality of data, we look at its **validity** and **reliability**.


    The **validity** of data refers to the extent to which it measures what we want
    it to measure. We are trying to measure the temperature of a location, but we
    are actually measuring the temperature around the thermometer. Is it valid to
    say that the temperature readings we have taken apply to the location in which
    they were taken?


    **Reliable** data can be replicated. So, if several people all measure the temperature
    in the same location at the same time, we would expect them to all get the same
    result. Where this happens, we say that the data is reliable.


    When we know that two data points are both **reliable** and **valid**, we can
    compare them to other similarly reliable and valid data and have some confidence
    in any observations we make. So if I measure the temperature at my desk in the
    United Kingdom and it is 25 degrees, and if an astronaut measures the temperature
    on the International Space Station (ISS) and finds that it is 23 degrees, then
    I can be pretty sure that it is warmer at my desk than on the ISS.


    If we don''t control the extraneous variables then our data is not so valid and
    reliable. Does that mean it is useless? In real-world experiments not all extraneous
    variables can be controlled. To perform real-world experimentation data scientists
    have come up with clever techniques to extract valuable insights, even from low-quality
    data. The trick lies in identifying and understanding the extraneous variables
    that are influencing our data and then making allowances for their influence when
    we analyze the data. Consider the following example:


    Temperature records dating all the way back to the 19th century have been compared
    to help show incontrovertible evidence of climate change. Over the years the measuring
    equipment has been replaced, maybe even changed or upgraded, and the locations
    where measures are taken have either changed completely or the surroundings are
    now very different. All these factors are likely to have some impact on the measurements
    – they are extraneous variables and it is impossible to control these fully. To
    address situations like this data scientists use what is called a **margin of
    error**, which is an estimation of just how **reliable** their data is. So, if
    there is a margin of error of 2 in a thermometer reading of 20 degrees, a data
    scientist will understand that the actual temperature is most likely somewhere
    between 18 degrees and 22 degrees.


    We''ve looked at how to use our thermometers to gather quality data, but before
    we undertake our first experiment let''s have a quick look at capturing (or recording)
    that data.


    ## 1.7 Data Capturing


    The experiment that we are planning will require us to record a number of different
    temperature values. Human memory being what it is it makes sense to write down
    the readings when we take them.


    This process – writing down or recording our data readings – is referred to as
    **capturing** or **gathering** data. There are a load of different ways you can
    record data, but the standard approach is to use a **data table**.


    Chances are you familiar with the idea of information being presented in the form
    of a table: we''ve already used a couple tables in this book. **Table** [**1-3**](#486852_1_En_1_Chapter.xhtml#Tab3)
    outlines the key features of a data table.


    **Table 1-3** Key features of a data table


    | Feature | Description | True or false |

    | --- | --- | --- |

    | 1 | A table is a made up of columns and rows. | True |

    | 2 | Where the rows and columns cross, each rectangle is called a cell. This
    paragraph is in a cell. | True |

    | 3 | For data science we usually write data, in the form of numbers, in each
    cell. But we also put text into tables, like we are doing here. | True |

    | 4 | Usually tables have a few columns and each column is used for different
    types of data, like this table. | True |

    | 5 | Tables usually have more rows than columns. | True |

    | 6 | As you collect more and more data, you add more and more rows to the table.
    You only add columns when you start to collect new types of data. | True |

    | 7 | When you have some data that is linked, such as location name and the temperature
    at that location, you add it to the same row. | True |

    | 8 | If you know how to use a table, you know all you need to know about tables
    to work through this book. | True |


    Ask yourself two questions about the preceding table:


    1. **Were you able to follow the way the information was presented?** If so your
    knowledge of tables is adequate to continue with the chapter.


    2. **Did you wonder what the point of the first and third columns was?** If so,
    good spotting – they were useless – your knowledge of tables is adequate to continue
    with the chapter.


    Tables are one of those things that are hard to explain but which most people
    are able to use. For now, we just need to capture data into tables. In the exercise
    in the following section we will use a data table that has three columns:


    1. **Location** – Write down the names of the locations in this column.


    2. **Temperature** – Write down the temperature in this one.


    3. **Notes** – Use the Notes column to write down observations that might be relevant
    to the experiment.


    Draw up a table to capture the data. Allow for 12 rows or so and try to pick a
    nice variety of locations – we want some variation in our data. **Table** [**1-4**](#486852_1_En_1_Chapter.xhtml#Par111)
    shows what it will look like.


    ***Table 1-4.*** *A blank data capturing form for Exercise 1-2*


    ![../images/486852_1_En_1_Chapter/486852_1_En_1_Figa_HTML.png](images/486852_1_En_1_Chapter/486852_1_En_1_Figa_HTML.png)


    Use the table by writing a location in the left-hand column and then writing the
    temperature at that location in the middle column. The Notes column is used to
    jot down observations that might be of interest to our experiment and can be left
    blank for some locations. Table [1-5](#486852_1_En_1_Chapter.xhtml#Tab5) shows
    what a completed table might look like.


    **Table 1-5** An illustration of a filled-in table from Exercise 1-2


    | Location | Temperature | Notes |

    | --- | --- | --- |

    | Staffroom | 22.5 | Perfectly air conditioned with large comfy couches |

    | The canteen | 24 | Unable to find a flat wooden surface for the thermometer
    |

    | The library | 20.5 | Has air conditioning |

    | Big tree in playground | 16 | Was an overcast day |

    | Ms. Smith''s classroom | 22.5 | Classroom faces the sunny side of the school
    |

    | Ms. Cohen''s classroom | 22 | |

    | Mr. Nkomo''s classroom | 21 | There were three fans blowing in the classroom
    |'
