    # 8.9 总结


    无线电功能可用于创建能够相互通信的 micro:bit 封闭网络。我们之前构建的示例可以进行扩展：最多十个 micro:bit 应能在同一网络内协同工作。通过多个传感器节点向服务器报告数据，你可以监控和控制办公室、教室、异宠栖息地、核反应堆或任何无线电信号覆盖的区域。


    然而，只要这些网络是封闭的，我们就无法利用物联网（IoT）的潜力，并且我们的应用范围将受限于 micro:bit 本身的能力。无线电功能可以被运用在我们的数据科学实践中，但在我们能够连接到云端并使用其提供的服务之前，我们的工具箱仍是不完整的。在第
    9 章中，我们将为 micro:bit 添加 Wi-Fi，并最终打开通往物联网的大门。


    # 9. 使用 Wi-Fi 连接到互联网


    在第 6 章中，我们了解到，能够将实验连接到互联网，有望极大地增强我们的数据科学工具箱。在第 7 章和第 8 章中，我们探究了 micro:bit 板载功能是否能够让我们连接到云端，以便访问那里的服务。尽管
    BLE 和 micro:bit 无线电都提供了一些非常有用的无线功能，但与几章前相比，我们在正确连接物联网方面仍然没有进展。现在是时候将目光投向 micro:bit
    以外的原生功能了。


    如今，连接到物联网相对简单，最常见的方式是使用 Wi-Fi。（12）在本章中，我们将为 micro:bit 气象站添加 Wi-Fi，并将其连接到云端。


    ## 9.1 定义我们的物联网气象站


    仅仅为我们的 micro:bit 气象站添加 Wi-Fi 功能固然很好，但这实际上意味着什么呢？我们到底要构建什么？我们需要对系统的工作方式有一个更清晰的概念：


    1.  我们的 micro:bit 气象站不会有太大变化：我们将记录温度、湿度和气压数据。这次，我们将通过 Wi-Fi 输出这些数据。

    2.  我们将把 micro:bit 气象站连接到一个物联网平台。

    3.  我们将把气象数据发送到该物联网平台。

    4.  数据进入平台后，我们就能使用多种工具/服务。我们将构建一个图表，用于实时显示数据并将其与历史数据进行比较。


    正如我们在第 6 章中所见，一旦数据进入我们的物联网平台，我们就能使用一系列可以在数据科学工作中运用的工具。在第 9.4 节中，我们将设置我们的物联网平台，但首先，我们要准备好所需的硬件。


    ## 9.2 构建我们的 Wi-Fi 气象站


    除了我们在第 8 章中使用的硬件之外，我们还需要引入一个提供 Wi-Fi 连接的模块。图 9-1 展示了支持 Wi-Fi 的数字气象站仪器的框图。


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig1_HTML.jpg](img/486852_1_En_9_Fig1_HTML.jpg)


    *图 9-1 构建支持 Wi-Fi 的气象站工具所需的组件*


    表 9-1 列出了我们用于构建 micro:bit 气象站边缘设备的具体硬件。


    *表 9-1 micro:bit 气象站边缘设备的硬件建议*


    | 你需要什么 | 我们使用的硬件 | 数量 | 替代方案 |

    | --- | --- | --- | --- |

    | 微处理器和向其烧录代码的方法 | micro:bit 及 micro-B USB 数据线 | 1 | Raspberry Pi / Circuit Playground
    |

    | 电源 | 通过 XinaBox IM01 连接的 USB 充电宝 | 1 | XinaBox PB01 – 双 AA 电池供电包 |

    | 读取气象数据的传感器 | XinaBox SW01 气象传感器 | 1 | SparkFun Weatherbit |

    | Wi-Fi 核心模块 | XinaBox CW01 Wi-Fi 核心模块 | 1 | SparkFun ESP32 Thing |

    | 显示数据的屏幕 | Micro:bit 5x5 LED 矩阵 | 1 | XinaBox OD01 – 64x128 OLED 显示屏 |

    | 连接所有组件的方式 | XinaBox IM01 – micro:bit 桥接模块 | 1 | 面包板、边缘连接器扩展板、鳄鱼夹引线及连接线 |

    | xBus 连接器 | 2 | | |


    图 9-2 展示了组装完成后的 micro:bit 气象站边缘设备的样子。


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig2_HTML.jpg](img/486852_1_En_9_Fig2_HTML.jpg)


    *图 9-2 带 Wi-Fi 的 micro:bit 气象站*


    ## 9.3 更新固件


    **固件** 是微处理器上作为其操作系统运行的计算机程序。我们编写的代码（使用 MakeCode/MicroPython）并烧录到 micro:bit 上，是一套由固件解释的指令：我们的程序告诉固件该做什么。


    BBC micro:bit 首次发布至今已有近五年时间，在此期间它并没有实质性的改变。早期版本的 micro:bit 固件不支持 Wi-Fi：你可能需要更新固件，这不仅是为了本章，也为了第
    11 章中的示例。


    确保固件始终是最新的是一个好习惯，因此，如果你最近没有更新过，我们建议你在继续之前进行更新。这非常简单：只需将一个文件烧录到 micro:bit 上即可，这将确保所有最新版本和高级功能在你的
    micro:bit 上正常工作。你可以在我们的资源网站或 Micro:bit 基金会的网站上找到完整的说明。


    尽管我们仅使用其 Wi-Fi 功能，但来自 XinaBox 的 CW01 也是一个微处理器；它本身也加载了固件。为了将 CW01 与 micro:bit 一起使用，有必要确保它运行正确的固件。不过，大多数读者**不需要**更新该固件；这完全取决于你从哪里获得的
    CW01：


    -   如果 CW01 是 XinaBox XK05 套件的一部分，则**不需要**更新。

    -   如果你是单独购买的 CW01，或者它随其他套件（例如 XK01）一起提供，则需要进行更新。


    更新 CW01 固件的完整说明可在我们的资源网站上找到。


    > *在继续之前，请确保 micro:bit 和 CW01 都运行着合适的固件。*

    '
- fmt: "# 9.4 Choosing an IoT Platform\n\nTo build an IoT weather station, we need\
    \ to choose an IoT platform to use. There are a range of options, some more simple\
    \ than others.\n\nThe `MakeCode` extension for the `CW01` Wi-Fi module from `XinaBox`\
    \ has blocks that are tailored to connect easily to `Ubidots`, `ATT`, and `Azure`.\
    \ It also has “generic” `MQTT` blocks, which allow you to connect to any IoT platform\
    \ that follows the `MQTT` standard.\n\nWe will use the `IBM Cloud` as our exemplar,\
    \ for the following reasons:\n\n* We had to choose one, and IBM have always been\
    \ at the forefront of IoT.\n* Showing how to use the `MQTT` blocks in `MakeCode`\
    \ will better equip you to connect to any IoT platform. The tailored blocks are\
    \ easier to use, but can only be used with the IoT platform they are tailored\
    \ to.\n* You will have access to a broad range of IBM Cloud services (including\
    \ the IBM Watson AI services).\n* They offer a free 28-day service so you can\
    \ test it without needing to pay.\n\nTo sign up for an `IBM Cloud`, you need to\
    \ have an `IBMid`. This allows you to log in to all IBM products and services.\
    \ If you don’t have one already, the following steps explain how to sign up using\
    \ your email address:\n\n> **Warning**  \n> We found that outlook email addresses\
    \ can’t be used to create IBM Cloud accounts. Gmail works.\n\n* Go to the IBM\
    \ Cloud login page (`https://cloud.ibm.com/login`), and click **Create an IBM\
    \ Cloud account** (**Figure 9-3**).\n\n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig3_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig3_HTML.jpg)\n\
    \n  *Figure 9-3* – IBM Cloud login page\n\n* Enter your **email address**.\n*\
    \ Complete the remaining fields and then click **Create Account**.\n* The next\
    \ page will show you if your account has been created successfully (**Figure 9-4**).\n\
    \n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig4_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig4_HTML.jpg)\n\
    \n  *Figure 9-4* – Account creation success message\n\n* Check your email, and\
    \ then confirm your account by clicking **Confirm account** in the confirmation\
    \ email you are sent.\n* You will be taken to the login page. Click **Log in**\
    \ to proceed.\n* You will be redirected to the **About your IBMid Account Privacy**\
    \ page. Ensure you are happy with the privacy policy before scrolling down the\
    \ page to find the **Proceed** button.\n* You will be automatically logged in\
    \ to the **IBM Cloud Dashboard** (**Figure 9-5**).\n\n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig5_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig5_HTML.jpg)\n\
    \n  *Figure 9-5* – IBM Cloud Dashboard\n\nThe `IBM Cloud Dashboard` is the hub\
    \ from which you can access all the IBM products and services.\n\n## 9.5 Setting\
    \ Up the IoT Platform\n\nThe service that we will connect our micro:bit weather\
    \ station to is the aptly named `IBM Internet of Things Platform`, which is accessed\
    \ from the `IBM Cloud Dashboard`, as described here:\n\n* In the `IBM Cloud Dashboard`,\
    \ click **Create resource** (**Figure 9-6**).\n\n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig6_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig6_HTML.jpg)\n\
    \n  *Figure 9-6* – Creating a new resource with the IBM Cloud Dashboard\n\n* In\
    \ the **Catalog** page, select **Internet of Things** from the Services list.\
    \ Then select **Internet of Things Platform** from the filtered result (**Figure\
    \ 9-7**).\n\n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig7_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig7_HTML.jpg)\n\
    \n  *Figure 9-7* – Selecting Internet of Things Platform service\n\n* Select the\
    \ **Lite Plan**.\n* Scroll down the page and rename the service name (e.g., **Weather\
    \ Service**) (**Figure 9-8**).\n\n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig8_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig8_HTML.jpg)\n\
    \n  *Figure 9-8* – Renaming the default service name\n\n* Click **Create**. After\
    \ a few seconds, the service will be created.\n* Click **Launch** (**Figure 9-9**).\n\
    \n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig9_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig9_HTML.jpg)\n\
    \n  *Figure 9-9* – Launch page for our weather service\n\n* This will redirect\
    \ you to the `IBM Watson IoT Platform`, which we will set up in the next section.\n\
    \n## 9.6 Adding Our Weather Station to the IoT Platform\n\nWe have now set up\
    \ an IoT platform to which we will connect our micro:bit weather station. We still\
    \ need to configure it, but the basic infrastructure is in place.\n\nThe first\
    \ stage in configuring our IoT platform is to identify the device(s) that are\
    \ allowed to connect to it. The following steps will achieve this objective:\n\
    \n* Click **Add Device** at the top right of the page (**Figure 9-10**).\n\n \
    \ ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig10_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig10_HTML.jpg)\n\
    \n  *Figure 9-10* – Adding a new device\n\n* In the **Add Device** window, enter\
    \ a name and unique ID for the device and then click **Next** (**Figure 9-11**).\
    \ We used the details listed:\n  * **Device Type**: `XinaBox`\n  * **Device ID**:\
    \ `xb123456`\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig11_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig11_HTML.jpg)\n\
    \n    *Figure 9-11* – Step 1 of adding a device\n\n* In the **Device Information**\
    \ tab, leave all the device information blank and click **Next**.\n* In the **Security**\
    \ tab, leave **Authentication Token** blank (to let the Authentication Token be\
    \ auto-generated). Click **Next**.\n* In the **Summary** tab, click **Finish**.\n\
    * The next page shows the **Device Credentials** (**Figure 9-12**).\n\n  > **Warning**\
    \  \n  > It was not clear how to retrieve the Authentication Token once you go\
    \ away from this page. Remember to take a screenshot of that page or write down\
    \ the device credentials on a paper. You will need them when you build the code.\n\
    \n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig12_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig12_HTML.jpg)\n\
    \n  *Figure 9-12* – Device Credentials for the device we have just added\n\n*\
    \ Click **Back** at the top left of the page to see all devices that have been\
    \ added. Your device will show in the device list.\n* Click **Security** in the\
    \ left navigation (**Figure 9-13**).\n\n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig13_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig13_HTML.jpg)\n\
    \n  *Figure 9-13* – The Security tab is available in the left-hand-side menu\n\
    \n* In the **Policies** page, click **edit** to edit the **Connection Security**\
    \ (**Figure 9-14**).\n\n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig14_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig14_HTML.jpg)\n\
    \n  *Figure 9-14* – The Policies page\n\n* Choose **TLS Optional** from the **Security\
    \ Level** drop-down list (**Figure 9-15**). Then click **Save** at the top right.\n\
    \n  ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig15_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig15_HTML.jpg)\n\
    \n  *Figure 9-15* – The security level chosen for the default rule applies to\
    \ all your devices\n\nIn **Section 9.5** we set up the shell of our “IoT application”\
    \ and in this section we defined key parameters relating to the device we will\
    \ connect to it. What remains is to tell our IoT application what to do with data\
    \ that we will send to it from that device."
  raw: "## 9.4 Choosing an IoT Platform\n\nTo build an IoT weather station, we need\
    \ to choose an IoT platform to use. There are a range of options, some more simple\
    \ than others.\n\nThe MakeCode extension for the CW01 Wi-Fi module from XinaBox\
    \ has blocks that are tailored to connect easily to Ubidots, ATT, and Azure. It\
    \ also has “generic” MQTT^([^(13)](#fn13)) blocks, which allow you to connect\
    \ to any IoT platform that follows the MQTT standard.\n\nWe will use the **IBM\
    \ Cloud** as our exemplar, for the following reasons:\n\n*   We had to choose\
    \ one, and IBM have always been at the forefront of IoT.\n\n*   Showing how to\
    \ use the MQTT blocks in MakeCode will better equip you to connect to any IoT\
    \ platform. The tailored blocks are easier to use, but can only be used with the\
    \ IoT platform they are tailored to.\n\n*   You will have access to a broad range\
    \ of IBM Cloud services (including the IBM Watson AI services).\n\n*   They offer\
    \ a free 28-day service so you can test it without needing to pay.\n\nTo sign\
    \ up for an IBM Cloud, you need to have an **IBMid**. This allows you to log in\
    \ to all IBM products and services. If you don’t have one already, the following\
    \ steps explain how to sign up using your email address:\n\nWarning\n\nWe found\
    \ that outlook email addresses can’t be used to create IBM Cloud accounts. Gmail\
    \ works.\n\n*   Go to the IBM Cloud login page ([`https://cloud.ibm.com/login`](https://cloud.ibm.com/login)),\
    \ and click **Create an IBM Cloud account** (**Figure** [**9-3**](#486852_1_En_9_Chapter.xhtml#Fig3)).\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig3_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig3_HTML.jpg)\n\
    \n    Figure 9-3\n\n    IBM Cloud login page\n\n*   Enter your **email address**.\n\
    \n*   Complete the remaining fields and then click **Create Account**.\n\n*  \
    \ The next page will show you if your account has been created successfully (**Figure**\
    \ [**9-4**](#486852_1_En_9_Chapter.xhtml#Fig4)).\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig4_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig4_HTML.jpg)\n\
    \n    Figure 9-4\n\n    Account creation success message\n\n*   Check your email,\
    \ and then confirm your account by clicking **Confirm account** in the confirmation\
    \ email you are sent.\n\n*   You will be taken to the login page. Click **Log\
    \ in** to proceed.\n\n*   You will be redirected to the **About your IBMid Account\
    \ Privacy** page. Ensure you are happy with the privacy policy before scrolling\
    \ down the page to find the **Proceed** button.\n\n*   You will be automatically\
    \ logged in to the **IBM Cloud Dashboard** (**Figure** [**9-5**](#486852_1_En_9_Chapter.xhtml#Fig5)).\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig5_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig5_HTML.jpg)\n\
    \n    Figure 9-5\n\n    IBM Cloud Dashboard\n\nThe IBM Cloud Dashboard is the\
    \ hub from which you can access all the IBM products and services.\n\n## 9.5 Setting\
    \ Up the IoT Platform\n\nThe service that we will connect our micro:bit weather\
    \ station to is the aptly named **IBM Internet of Things Platform**, which is\
    \ accessed from the IBM Cloud Dashboard, as described here:\n\n*   In the IBM\
    \ Cloud Dashboard, click **Create resource** (**Figure** [**9-6**](#486852_1_En_9_Chapter.xhtml#Fig6)).\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig6_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig6_HTML.jpg)\n\
    \n    Figure 9-6\n\n    Creating a new resource with the IBM Cloud Dashboard\n\
    \n*   In the **Catalog** page, select **Internet of Things** from the Services\
    \ list. Then select **Internet of Things Platform** from the filtered result (**Figure**\
    \ [**9-7**](#486852_1_En_9_Chapter.xhtml#Fig7)).\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig7_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig7_HTML.jpg)\n\
    \n    Figure 9-7\n\n    Selecting Internet of Things Platform service\n\n*   Select\
    \ the **Lite Plan**.\n\n*   Scroll down the page and rename the service name (e.g.,\
    \ **Weather Service**) (**Figure** [**9-8**](#486852_1_En_9_Chapter.xhtml#Fig8)).\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig8_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig8_HTML.jpg)\n\
    \n    Figure 9-8\n\n    Renaming the default service name\n\n*   Click **Create**.\
    \ After a few seconds, the service will be created.\n\n*   Click **Launch** (**Figure**\
    \ [**9-9**](#486852_1_En_9_Chapter.xhtml#Fig9)).\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig9_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig9_HTML.jpg)\n\
    \n    Figure 9-9\n\n    Launch page for our weather service\n\n*   This will redirect\
    \ you to the **IBM Watson IoT Platform**, which we will set up in the next section.\n\
    \n## 9.6 Adding Our Weather Station to the IoT Platform\n\nWe have now set up\
    \ an IoT platform to which we will connect our micro:bit weather station. We still\
    \ need to configure it, but the basic infrastructure is in place.\n\nThe first\
    \ stage in configuring our IoT platform is to identify the device(s) that are\
    \ allowed to connect to it. The following steps will achieve this objective:\n\
    \n*   Click **Add Device** at the top right of the page (**Figure** [**9-10**](#486852_1_En_9_Chapter.xhtml#Fig10)).\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig10_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig10_HTML.jpg)\n\
    \n    Figure 9-10\n\n    Adding a new device\n\n*   In the **Add Device** window,\
    \ enter a name and unique ID for the device and then click **Next** (**Figure**\
    \ [**9-11**](#486852_1_En_9_Chapter.xhtml#Fig11)). We used the details listed:\n\
    \    *   **Device Type**: *XinaBox*\n\n    *   **Device ID**: *xb123456*\n\n \
    \       ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig11_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig11_HTML.jpg)\n\
    \n        Figure 9-11\n\n        Step 1 of adding a device\n\n*   In the **Device\
    \ Information** tab, leave all the device information blank and click **Next**.\n\
    \n*   In the **Security** tab, leave **Authentication Token** blank (to let the\
    \ Authentication Token be auto-generated). Click **Next**.\n\n*   In the **Summary**\
    \ tab, click **Finish**.\n\n*   The next page shows the **Device Credentials**\
    \ (**Figure** [**9-12**](#486852_1_En_9_Chapter.xhtml#Fig12)).\n\nWarning\n\n\
    It was not clear how to retrieve the Authentication Token once you go away from\
    \ this page. Remember to take a screenshot of that page or write down the device\
    \ credentials on a paper. You will need them when you build the code.\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig12_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig12_HTML.jpg)\n\
    \nFigure 9-12\n\nDevice Credentials for the device we have just added\n\n*   Click\
    \ **Back** at the top left of the page to see all devices that have been added.\
    \ Your device will show in the device list.\n\n*   Click **Security** in the left\
    \ navigation (**Figure** [**9-13**](#486852_1_En_9_Chapter.xhtml#Fig13)).\n\n\
    \    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig13_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig13_HTML.jpg)\n\
    \n    Figure 9-13\n\n    The Security tab is available in the left-hand-side menu\n\
    \n*   In the **Policies** page, click **edit** to edit the **Connection Security**\
    \ (**Figure** [**9-14**](#486852_1_En_9_Chapter.xhtml#Fig14)).\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig14_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig14_HTML.jpg)\n\
    \n    Figure 9-14\n\n    The Policies page\n\n*   Choose **TLS Optional** from\
    \ the **Security Level** drop-down list (**Figure** [**9-15**](#486852_1_En_9_Chapter.xhtml#Fig15)).\
    \ Then click **Save** at the top right.\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig15_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig15_HTML.jpg)\n\
    \n    Figure 9-15\n\n    The security level chosen for the default rule applies\
    \ to all your devices\n\nIn **Section 9.5** we set up the shell of our “IoT application”\
    \ and in this section we defined key parameters relating to the device we will\
    \ connect to it. What remains is to tell our IoT application what to do with data\
    \ that we will send to it from that device."
  trans: "\n# 9.4 选择物联网平台\n\n要搭建物联网气象站，我们需要选择一个物联网平台。目前有多种选择，有些平台相对更简单易用。\n\n`XinaBox`\
    \ 的 `CW01` Wi-Fi 模块对应的 `MakeCode` 扩展包含了一些专门用于轻松连接 `Ubidots`、`ATT` 和 `Azure` 的积木块。它还提供了“通用”的\
    \ `MQTT` 积木块，允许你连接到任何遵循 `MQTT` 标准的物联网平台。\n\n我们将以 `IBM Cloud` 为例进行演示，原因如下：\n\n\
    *   我们需要选择一个平台，而 IBM 一直处于物联网领域的前沿。\n*   展示如何在 `MakeCode` 中使用 `MQTT` 积木块，能让你更好地掌握连接到任何物联网平台的方法。专用的积木块虽然更易用，但只能用于它们所适配的特定物联网平台。\n\
    *   你将能够访问 IBM Cloud 的一系列广泛服务（包括 IBM Watson AI 服务）。\n*   他们提供 28 天的免费试用服务，让你无需付费即可进行测试。\n\
    \n要注册 `IBM Cloud` 账户，你需要拥有一个 `IBMid`。这将允许你登录所有 IBM 产品和服务。如果你还没有，请按照以下步骤使用你的电子邮件地址进行注册：\n\
    \n> **警告**  \n> 我们发现 Outlook 邮箱地址无法用于创建 IBM Cloud 账户。Gmail 邮箱可以正常使用。\n\n*   访问\
    \ IBM Cloud 登录页面（`https://cloud.ibm.com/login`），然后点击**创建 IBM Cloud 账户**（**图 9-3**）。\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig3_HTML.jpg](img/486852_1_En_9_Fig3_HTML.jpg)\n\
    \n    *图 9-3* – IBM Cloud 登录页面\n\n*   输入你的**电子邮件地址**。\n*   填写其余字段，然后点击**创建账户**。\n\
    *   下一页将显示你的账户是否已成功创建（**图 9-4**）。\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig4_HTML.jpg](img/486852_1_En_9_Fig4_HTML.jpg)\n\
    \n    *图 9-4* – 账户创建成功消息\n\n*   检查你的电子邮件，然后点击收到的确认邮件中的**确认账户**来确认你的账户。\n*   你将被重定向到登录页面。点击**登录**继续操作。\n\
    *   你将被重定向到**关于您的 IBMid 账户隐私**页面。在向下滚动页面找到**继续**按钮之前，请确保你同意隐私政策。\n*   你将自动登录到\
    \ **IBM Cloud 仪表板**（**图 9-5**）。\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig5_HTML.jpg](img/486852_1_En_9_Fig5_HTML.jpg)\n\
    \n    *图 9-5* – IBM Cloud 仪表板\n\n`IBM Cloud 仪表板`是一个中心枢纽，你可以从中访问所有 IBM 产品和服务。\n\
    \n## 9.5 设置物联网平台\n\n我们将要连接 micro:bit 气象站的服务恰如其分地命名为 `IBM Internet of Things Platform`（IBM\
    \ 物联网平台），可通过 `IBM Cloud 仪表板`访问，具体步骤如下：\n\n*   在 `IBM Cloud 仪表板`中，点击**创建资源**（**图\
    \ 9-6**）。\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig6_HTML.jpg](img/486852_1_En_9_Fig6_HTML.jpg)\n\
    \n    *图 9-6* – 使用 IBM Cloud 仪表板创建新资源\n\n*   在**目录**页面中，从服务列表中选择 **Internet of\
    \ Things**。然后在筛选结果中选择 **Internet of Things Platform**（**图 9-7**）。\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig7_HTML.jpg](img/486852_1_En_9_Fig7_HTML.jpg)\n\
    \n    *图 9-7* – 选择 Internet of Things Platform 服务\n\n*   选择 **Lite 计划**（轻量版）。\n\
    *   向下滚动页面并重命名服务名称（例如，**Weather Service**（气象服务））（**图 9-8**）。\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig8_HTML.jpg](img/486852_1_En_9_Fig8_HTML.jpg)\n\
    \n    *图 9-8* – 重命名默认服务名称\n\n*   点击**创建**。几秒钟后，服务将被创建。\n*   点击**启动**（**图 9-9**）。\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig9_HTML.jpg](img/486852_1_En_9_Fig9_HTML.jpg)\n\
    \n    *图 9-9* – 我们气象服务的启动页面\n\n*   这将把你重定向到 `IBM Watson IoT Platform`，我们将在下一节中进行设置。\n\
    \n## 9.6 将气象站添加到物联网平台\n\n现在我们已经设置了一个物联网平台，我们将把 micro:bit 气象站连接到该平台。我们仍需对其进行配置，但基本的基础设施已经就位。\n\
    \n配置物联网平台的第一步是识别允许连接到平台的设备。以下步骤将实现此目标：\n\n*   点击页面右上角的**添加设备**（**图 9-10**）。\n\n\
    \    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig10_HTML.jpg](img/486852_1_En_9_Fig10_HTML.jpg)\n\
    \n    *图 9-10* – 添加新设备\n\n*   在**添加设备**窗口中，输入设备的名称和唯一 ID，然后点击**下一步**（**图 9-11**）。我们使用了以下详细信息：\n\
    \    *   **设备类型**：`XinaBox`\n    *   **设备 ID**：`xb123456`\n\n        ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig11_HTML.jpg](img/486852_1_En_9_Fig11_HTML.jpg)\n\
    \n        *图 9-11* – 添加设备的第 1 步\n\n*   在**设备信息**标签页中，将所有设备信息留空，然后点击**下一步**。\n\
    *   在**安全**标签页中，将**身份验证令牌**留空（以便自动生成身份验证令牌）。点击**下一步**。\n*   在**摘要**标签页中，点击**完成**。\n\
    *   下一页显示**设备凭证**（**图 9-12**）。\n\n    > **警告**  \n    > 离开此页面后，如何重新获取身份验证令牌尚不明确。请务必备份该页面的屏幕截图，或将设备凭证抄写在纸上。在编写代码时将会用到它们。\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig12_HTML.jpg](img/486852_1_En_9_Fig12_HTML.jpg)\n\
    \n    *图 9-12* – 我们刚添加的设备的设备凭证\n\n*   点击页面左上角的**返回**，查看已添加的所有设备。你的设备将显示在设备列表中。\n\
    *   点击左侧导航栏中的**安全**（**图 9-13**）。\n\n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig13_HTML.jpg](img/486852_1_En_9_Fig13_HTML.jpg)\n\
    \n    *图 9-13* – 左侧菜单中可用的“安全”标签页\n\n*   在**策略**页面中，点击**编辑**以编辑**连接安全**（**图 9-14**）。\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig14_HTML.jpg](img/486852_1_En_9_Fig14_HTML.jpg)\n\
    \n    *图 9-14* – 策略页面\n\n*   从**安全级别**下拉列表中选择 **TLS Optional**（可选 TLS）（**图 9-15**）。然后点击右上角的**保存**。\n\
    \n    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig15_HTML.jpg](img/486852_1_En_9_Fig15_HTML.jpg)\n\
    \n    *图 9-15* – 为默认规则选择的安全级别，将应用于你的所有设备\n\n在**第 9.5 节**中，我们设置了“物联网应用”的框架，在本节中，我们定义了与将要连接到该平台的设备相关的关键参数。剩下要做的就是告诉我们的物联网应用如何处理我们将从该设备发送给它的数据。\n"
- fmt: "# 9.7 Visualizing Data in the IoT Platform\n\nIn this section we will tell\
    \ our IoT platform what to do with the data and how to output/display it. We will\
    \ build a visualization: a line chart.\n\n`IBM Watson` allows us to set up virtual\
    \ \"pin-boards\" to which we can add all sorts of different content. Later, when\
    \ everything is running smoothly, we will be able to view these pin-boards (referred\
    \ to as **boards**) from a browser.\n\nThe content that we add to a board is called\
    \ a **card**. Cards are predefined items (e.g., a line chart) that are used to\
    \ show data from or about the device(s) defined in our IoT platform. We can add\
    \ multiple cards to a board. In this section we will create a new **Board** in\
    \ the `Watson Internet of Things Dashboard` and then add a **Card** to it.\n\n\
    ## Add a new board using the following steps:\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig17_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig17_HTML.jpg)\n\
    \n**Figure 9-17** The newly created board showing under Your boards\n\n*   Click\
    \ **Boards** in the left navigation.\n*   Click **+ Create New Board**.\n*   In\
    \ the **Create a new board** window, in the **Information** tab, provide the following\
    \ configuration details (**Figure** [**9-16**](#486852_1_En_9_Chapter.xhtml#Fig16)).\
    \ Then click the **Next** button.\n    *   **Board name**: `Weather`\n    *  \
    \ **Description**: `Displays sensor data from various weather sensors.`\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig16_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig16_HTML.jpg)\n\
    \n**Figure 9-16** Creating a new dashboard: the Information tab\n\n*   In the\
    \ **Members** tab don't provide any information. Just click **Submit**.\n*   The\
    \ **board** will be created and the **Your boards** page will load up (**Figure**\
    \ [**9-17**](#486852_1_En_9_Chapter.xhtml#Fig17)).\n\nWe now have an empty pin-board\
    \ to which we can add cards; we will add a line chart card to show the weather\
    \ data as it is received. This line chart will show temperature and relative humidity\
    \ data (not pressure – this messes up the chart because the scale used for pressure\
    \ is so different). You will see that there are a range of different cards that\
    \ you can add to the board.\n\n*   Click the **WEATHER** board.\n*   Click **+\
    \ Add New Card**.\n*   In the **Create card** window, click the **Line chart**\
    \ (**Figure** [**9-18**](#486852_1_En_9_Chapter.xhtml#Fig18)).\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig18_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig18_HTML.jpg)\n\
    \n**Figure 9-18** Choosing the line chart data visualization option\n\n*   In\
    \ the **Create Line chart Card** window, in the **Card source data** tab, select\
    \ the **device** you created earlier and click **Next** (**Figure** [**9-19**](#486852_1_En_9_Chapter.xhtml#Fig19)).\n\
    \n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig19_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig19_HTML.jpg)\n\
    \n**Figure 9-19** Choosing the device\n\n*   Click to select the `xb123456` device\
    \ (rem – this is the **Device ID** we specified in **Section 9-6**) and then click\
    \ **Next**.\n\nIn this step we have linked the micro:bit edge device to the line\
    \ chart. We now need to tell the line chart which data to use and how to handle\
    \ it. We will add two data sets (temperature and humidity); we need to add these\
    \ **New data sets** with the details in **Table** [**9-2**](#486852_1_En_9_Chapter.xhtml#Tab2).\n\
    \n**Table 9-2** Parameters to use to set up the line chart card\n\n| Name of data\
    \ point you need to enter | Value to enter for temperature | Value to enter for\
    \ humidity |\n| --- | --- | --- |\n| **Event** | `status1` | `status2` |\n| **Property**\
    \ | `Temperature` | `Humidity` |\n| **Name** | `Temperature` | `Humidity` |\n\
    | **Type** | `Number` | `Number` |\n| **Unit** | `C` | `%` |\n| **Min** | `-40`\
    \ | `0` |\n| **Max** | `85` | `100` |\n\n*   In the **Card preview** tab, click\
    \ **XL**. Then click **Next**.\n*   In the **Card information** tab, provide the\
    \ following details and click **Submit**.\n    *   **Title**: `Live and Historical\
    \ Weather Data`\n    *   **Color scheme**: Choose any color\n\nThe card has been\
    \ added to the board and the board is now ready to use: as soon as we set up the\
    \ data feed we should see the line chart updating in real time with the temperature\
    \ and humidity data.\n\nOther cards can be added to the board in much the same\
    \ way. Why not add a card to visualize the pressure data too."
