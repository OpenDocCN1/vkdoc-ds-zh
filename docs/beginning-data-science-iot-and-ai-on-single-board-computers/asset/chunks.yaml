- fmt: "## 7.5 Using the Serial Bluetooth Terminal App\n\nWe will use Bluetooth UART\
    \ to send data to a smartphone/tablet. To do so, our smart device will need to\
    \ be Bluetooth enabled and we will need to install a compatible app on it. There\
    \ are plenty of apps to be found on Google Play for micro:bit Bluetooth UART;\
    \ we have tested many of them and found that a few show some success with Bluetooth\
    \ UART–based data transmission, but we did experience some issues too. We found\
    \ the best app that provides success most of the time is the `Serial Bluetooth\
    \ Terminal` app.\n\nThe bandwidth of Bluetooth UART is quite low, which means\
    \ that you can't send a lot of data very quickly. For sending small chunks of\
    \ data at a time it is quite adequate.\n\nInstall the `Serial Bluetooth Terminal`\
    \ app from Google Play for smartphones/tablets running Android OS. Currently,\
    \ there is no version of this app available for iOS users.\n\n## 7.6 Coding the\
    \ BLE Weather Station\n\nThe code that we need to write is very similar to our\
    \ previous weather station code (e.g., Chapter [3](#486852_1_En_3_Chapter.xhtml),\
    \ Section 3-7): the main difference is that we have to turn on our Bluetooth UART\
    \ service and output data via that service (rather than outputting the data to\
    \ a screen). The natural language code has only minor differences.\n\nTable 7-2:\
    \ Natural language code for a Bluetooth Low Energy weather station\n\n| Step |\
    \ Natural Language Code | Notes |\n| --- | --- | --- |\n| 1 | Import any necessary\
    \ libraries. | We need a library for the weather sensor and Bluetooth. |\n| 2\
    \ | Start the Bluetooth UART service. | The Bluetooth UART service allows another\
    \ device such as a smartphone/tablet to exchange any data it wants to with the\
    \ micro:bit. |\n| 3 | Repeat the following steps. |  |\n| 4 | Read temperature\
    \ from the weather sensor. | You could use humidity or pressure if you prefer.\
    \ |\n| 5 | Send temperature data through Bluetooth UART. | We output the data\
    \ by sending it via BLE to the `Serial Bluetooth Terminal` app running on our\
    \ smart device. |\n\n**No-code option**: You can find a precompiled version of\
    \ the code used in this section on our resource website. Go to [`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)\
    \ and search for Section 7.6.\n\nFigure [7-4](#486852_1_En_7_Chapter.xhtml#Fig4)\
    \ shows the full MakeCode program for the micro:bit Bluetooth Low Energy weather\
    \ station.\n\n![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig4_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig4_HTML.jpg)\n\
    \nFigure 7-4: MakeCode blocks to send weather sensor data to the `Serial Bluetooth\
    \ Terminal` app running on a smartphone/tablet\n\n> **Note**  \n> The code is\
    \ written to send temperature only. By modifying it you can add humidity and pressure\
    \ data too. But the more data you send at once, the greater the chance that you\
    \ will encounter difficulties due to low bandwidth. This solution does not scale\
    \ well if we want to send several data points at the same time.\n\nThere is one\
    \ more thing to do before downloading the code to flash onto the micro:bit:\n\n\
    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig5_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig5_HTML.jpg)\n\
    \nFigure 7-5: Configuration settings for the Bluetooth UART\n\n- Go to Project\
    \ Settings (click the cog-wheel at the top-right corner of the page).\n- Choose\
    \ No Pairing Required: Anyone can connect via Bluetooth option (Figure [7-5](#486852_1_En_7_Chapter.xhtml#Fig5)).\n\
    - Click Save to save the new settings and go back to the editor.\n\nNow compile\
    \ your program and flash it onto your micro:bit. Reset your micro:bit and keep\
    \ it powered up.\n\nStart the `Serial Bluetooth Terminal` app installed on your\
    \ smartphone/tablet, and from the menu (top-left corner) select `Devices` ➤ `BLUETOOTH\
    \ LE`. Then select the name of your micro:bit from the list. The app will connect\
    \ to your micro:bit. At the same time, the letter \"C\" will display on the micro:bit\
    \ 5X5 LED matrix. After that, the temperature data will display on the app's terminal\
    \ (Figure [7-6](#486852_1_En_7_Chapter.xhtml#Fig6)).\n\n> **Note**  \n> Sometimes\
    \ your app might not connect to the micro:bit at the first attempt. Try a few\
    \ more times and if that doesn't solve the problem, restart the app/micro:bit.\
    \ If that still doesn't work after a few times then try Wi-Fi, which we will look\
    \ at in Chapter [9](#486852_1_En_9_Chapter.xhtml).\n\n![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig6_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig6_HTML.jpg)\n\
    \nFigure 7-6: Sensor data is displaying on the app's terminal\n\nWe have succeeded\
    \ in extracting data wirelessly from our micro:bit. The tools that are available\
    \ in the application you are using to view this data are now available.\n\nClosing\
    \ the app will disconnect the BLE connection between your smartphone/tablet and\
    \ the micro:bit.\n\n## 7.7 Other Options for BLE on micro:bit\n\nSupport for BLE\
    \ is not available in MicroPython and is limited in MakeCode, but there are many\
    \ other ways to code a micro:bit: it is possible to develop applications in platforms\
    \ such as `ArduinoIDE` or `mBed` that open up what can be achieved. Our website\
    \ includes an application we have put together that uses `ArduinoIDE` to build\
    \ a BLE-enabled weather station for micro:bit which can connect to the IoT.\n\n\
    This example begins to show the real potential of BLE on micro:bit, but it is\
    \ complex and long, not suitable for learners or beginners and way more complicated\
    \ than other potential solutions, which we will begin to look at in later chapters.\n\
    \n## 7.8 Summary\n\nThe version of Bluetooth that is available on micro:bit (BLE)\
    \ provides some tools that have the potential to be quite useful to us in our\
    \ data science endeavors. If all we need is the data that is native to a micro:bit,\
    \ or if limited data is acceptable, or if a wired solution is adequate, then BLE\
    \ has a lot to offer. But these limitations feel restrictive and BLE does not\
    \ give us free and easy access to the Internet of Things or the cloud.\n\nAt the\
    \ beginning of this chapter, we set out to identify a way of extracting data wirelessly\
    \ from the micro:bit; while BLE has some very interesting and useful applications,\
    \ it also has limitations.\n\nWe are going to add BLE to our toolkit, but we will\
    \ continue our search for a wireless solution. BLE has a lot to offer and is a\
    \ very promising technology, but as long as we use the micro:bit as the core of\
    \ our data gathering tool, the limitations will restrict our capabilities.\n\n\
    ## Footnotes\n\n[1] (#486852_1_En_7_Chapter.xhtml#Fn1_source)\n\n# 8. Investigating\
    \ the micro:bit Radio\n\nIn Chapter [7](#486852_1_En_7_Chapter.xhtml) we saw that\
    \ the BLE offering on micro:bit is comprised of two completely different components:\n\
    \n- A physical, onboard radio transmitter/receiver (antenna)\n- The BLE standards\
    \ that govern what is transmitted, how it is transmitted and how messages received\
    \ are handled\n\nBLE acts as a manager: it governs how the antenna is used but\
    \ is completely separate from the antenna. It is possible to bypass BLE and access\
    \ the radio directly, to manage the antenna ourselves. This chapter will look\
    \ at how we can use the micro:bit radio to bring value to our data science toolkit."
  raw: '## 7.5 Using the Serial Bluetooth Terminal App


    We will use Bluetooth UART to send data to a smartphone/tablet. To do so, our
    smart device will need to be Bluetooth enabled and we will need to install a compatible
    app on it. There are plenty of apps to be found on **Google Play** for micro:bit
    Bluetooth UART; we have tested many of them and found that a few show some success
    with Bluetooth UART–based data transmission, but we did experience some issues
    too. We found the best app that provides success most of the time is the **Serial
    Bluetooth Terminal** app .


    The bandwidth of Bluetooth UART is quite low, which means that you can’t send
    a lot of data very quickly. For sending small chunks of data at a time it is quite
    adequate.


    Install the **Serial Bluetooth Terminal** app from **Google Play** for smartphones/tablets
    running Android OS. Currently, there is no version of this app available for iOS
    users.


    ## 7.6 Coding the BLE Weather Station


    The code that we need to write is very similar to our previous weather station
    code (e.g., **Chapter** [**3**](#486852_1_En_3_Chapter.xhtml)**, Section 3-7**):
    the main difference is that we have to turn on our Bluetooth UART service and
    output data via that service (rather than outputting the data to a screen). The
    natural language code has only minor differences.


    Table 7-2


    Natural language code for a Bluetooth Low Energy weather station


    | Step | Natural Language Code | Notes |

    | --- | --- | --- |

    | 1 | Import any necessary libraries. | We need a library for the weather sensor
    and Bluetooth. |

    | 2 | Start the Bluetooth UART service. | The Bluetooth UART service allows another
    device such as a smartphone/tablet to exchange any data it wants to with the micro:bit.
    |

    | 3 | Repeat the following steps. |   |

    | 4 | Read temperature from the weather sensor. | You could use humidity or pressure
    if you prefer. |

    | 5 | Send temperature data through Bluetooth UART. | We output the data by sending
    it via BLE to the **Serial Bluetooth Terminal** app running on our smart device.
    |


    **No-code option**: You can find a precompiled version of the code used in this
    section on our **resource website**. Go to [`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)
    and search for **Section 7.6**.


    **Figure** [**7-4**](#486852_1_En_7_Chapter.xhtml#Fig4) shows the full **MakeCode**
    program for the micro:bit Bluetooth Low Energy weather station.


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig4_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    MakeCode blocks to send weather sensor data to the ***Serial Bluetooth Terminal***
    app running on a smartphone/tablet


    Note


    The code is written to send temperature only. By modifying it you can add humidity
    and pressure data too. But the more data you send at once, the greater the chance
    that you will encounter difficulties due to low bandwidth. This solution does
    not scale well if we want to send several data points at the same time.


    There is one more thing to do before downloading the code to flash onto the micro:bit:


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig5_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Configuration settings for the Bluetooth UART


    *   Go to **Project Settings** (click the **cog-wheel** at the top-right corner
    of the page).


    *   Choose **No Pairing Required: Anyone can connect via Bluetooth** option (**Figure**
    [**7-5**](#486852_1_En_7_Chapter.xhtml#Fig5)).


    *   Click **Save** to save the new settings and go back to the editor.


    Now compile your program and flash it onto your micro:bit. Reset your micro:bit
    and keep it powered up.


    Start the **Serial Bluetooth Terminal** app installed on your smartphone/tablet,
    and from the menu (top-left corner) select **Devices ➤ BLUETOOTH LE**. Then select
    the name of your micro:bit from the list. The app will connect to your micro:bit.
    At the same time, the letter “C” will display on the micro:bit 5X5 LED matrix.
    After that, the temperature data will display on the app’s terminal (**Figure**
    [**7-6**](#486852_1_En_7_Chapter.xhtml#Fig6)).


    Note


    Sometimes your app might not connect to the micro:bit at the first attempt. Try
    a few more times and if that doesn’t solve the problem, restart the app/micro:bit.
    If that still doesn’t work after a few times then try Wi-Fi, which we will look
    at in **Chapter** [**9**](#486852_1_En_9_Chapter.xhtml).


    ![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig6_HTML.jpg](images/486852_1_En_7_Chapter/486852_1_En_7_Fig6_HTML.jpg)


    Figure 7-6


    Sensor data is displaying on the app’s terminal


    We have succeeded in extracting data wirelessly from our micro:bit. The tools
    that are available in the application you are using to view this data are now
    available.


    Closing the app will disconnect the BLE connection between your smartphone/tablet
    and the micro:bit.


    ## 7.7 Other Options for BLE on micro:bit


    Support for BLE is not available in MicroPython and is limited in MakeCode, but
    there are many other ways to code a micro:bit: it is possible to develop applications
    in platforms such as ArduinoIDE or mBed that open up what can be achieved. Our
    website includes an application we have put together that uses ArduinoIDE to build
    a BLE-enabled weather station for micro:bit which can connect to the IoT.


    This example begins to show the real potential of BLE on micro:bit, but it is
    complex and long, not suitable for learners or beginners and way more complicated
    than other potential solutions, which we will begin to look at in later chapters.


    ## 7.8 Summary


    The version of Bluetooth that is available on micro:bit (**BLE**) provides some
    tools that have the potential to be quite useful to us in our data science endeavors.
    If all we need is the data that is native to a micro:bit, or if limited data is
    acceptable, or if a wired solution is adequate, then BLE has a lot to offer. But
    these limitations feel restrictive and BLE does not give us free and easy access
    to the Internet of Things or the cloud.


    At the beginning of this chapter, we set out to identify a way of extracting data
    wirelessly from the micro:bit; while BLE has some very interesting and useful
    applications, it also has limitations.


    We are going to add BLE to our toolkit, but we will continue our search for a
    wireless solution. BLE has a lot to offer and is a very promising technology,
    but as long as we use the micro:bit as the core of our data gathering tool, the
    limitations will restrict our capabilities.


    Footnotes [1](#486852_1_En_7_Chapter.xhtml#Fn1_source)


    # 8. Investigating the micro:bit Radio


    In **Chapter** [**7**](#486852_1_En_7_Chapter.xhtml) we saw that the BLE offering
    on micro:bit is comprised of two completely different components:


    *   A physical, onboard radio transmitter/receiver (antenna)


    *   The BLE standards that govern what is transmitted, how it is transmitted and
    how messages received are handled


    BLE acts as a manager: it governs how the antenna is used but is completely separate
    from the antenna. It is possible to bypass BLE and access the radio directly,
    to manage the antenna ourselves. This chapter will look at how we can use the
    micro:bit radio to bring value to our data science toolkit.'
  trans: "\n## 7.5 使用串口蓝牙终端应用\n\n我们将通过蓝牙 UART 向智能手机/平板电脑发送数据。为此，我们的智能设备需要具备蓝牙功能，并且我们需要在其上安装一个兼容的应用。在\
    \ Google Play 上可以找到许多适用于 micro:bit 蓝牙 UART 的应用；我们测试了其中很多应用，发现有些在基于蓝牙 UART 的数据传输方面表现不错，但我们也遇到了一些问题。我们发现，大多数时候都能成功连接的应用是\
    \ `Serial Bluetooth Terminal`。\n\n蓝牙 UART 的带宽很低，这意味着你无法非常快速地发送大量数据。对于一次发送小块数据来说，它已经足够用了。\n\
    \n请在运行 Android 操作系统的智能手机/平板电脑上从 Google Play 安装 `Serial Bluetooth Terminal` 应用。目前，该应用没有适用于\
    \ iOS 用户的版本。\n\n## 7.6 编写 BLE 气象站代码\n\n我们需要编写的代码与我们之前的气象站代码（例如，第 3 章，第 3-7 节）非常相似：主要区别在于我们必须开启蓝牙\
    \ UART 服务并通过该服务输出数据（而不是将数据输出到屏幕上）。自然语言代码只有细微差别。\n\n表 7-2：低功耗蓝牙气象站的自然语言代码\n\n|\
    \ 步骤 | 自然语言代码 | 备注 |\n| --- | --- | --- |\n| 1 | 导入任何必要的库。 | 我们需要一个用于气象传感器和蓝牙的库。\
    \ |\n| 2 | 启动蓝牙 UART 服务。 | 蓝牙 UART 服务允许其他设备（如智能手机/平板电脑）与 micro:bit 交换任意数据。 |\n\
    | 3 | 重复以下步骤。 |  |\n| 4 | 从气象传感器读取温度。 | 如果你愿意，也可以使用湿度或气压。 |\n| 5 | 通过蓝牙 UART 发送温度数据。\
    \ | 我们通过 BLE 将数据发送到运行在智能设备上的 `Serial Bluetooth Terminal` 应用来输出数据。 |\n\n**无代码选项**：您可以在我们的资源网站上找到本节所用代码的预编译版本。请访问\
    \ [`http://xib.one/XB`](https://nam12.safelinks.protection.outlook.com/?url%253Dhttp%253A%252F%252Fxib.one%252FXB%2526data%253D02%257C01%257C%257C96ee9c32c458423e9b6a08d7c36cd73f%257C84df9e7fe9f640afb435aaaaaaaaaaaa%257C1%257C0%257C637192744542720716%2526sdata%253D0W1OfWTmIx3U20MIwolvjFvh9lCQJVpw9KNNvUwCdU8%253D%2526reserved%253D0)\
    \ 并搜索第 7.6 节。\n\n图 7-4 显示了 micro:bit 低功耗蓝牙气象站的完整 MakeCode 程序。\n\n![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig4_HTML.jpg](img/486852_1_En_7_Fig4_HTML.jpg)\n\
    \n图 7-4：向运行在智能手机/平板电脑上的 `Serial Bluetooth Terminal` 应用发送气象传感器数据的 MakeCode 模块\n\
    \n> **注意**  \n> 代码编写为仅发送温度。通过修改，你也可以添加湿度和气压数据。但是，一次发送的数据越多，由于带宽低而遇到困难的可能性就越大。如果我们想要同时发送多个数据点，这种方案的扩展性并不好。\n\
    \n在将代码下载并烧录到 micro:bit 之前，还有一件事要做：\n\n![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig5_HTML.jpg](img/486852_1_En_7_Fig5_HTML.jpg)\n\
    \n图 7-5：蓝牙 UART 的配置设置\n\n- 进入项目设置（点击页面右上角的齿轮图标）。\n- 选择无需配对：任何人都可以通过蓝牙连接选项（图 7-5）。\n\
    - 点击保存以保存新设置，然后返回编辑器。\n\n现在编译你的程序并将其烧录到你的 micro:bit 上。重置你的 micro:bit 并保持供电。\n\n\
    启动你安装在智能手机/平板电脑上的 `Serial Bluetooth Terminal` 应用，从菜单（左上角）中选择 `Devices` ➤ `BLUETOOTH\
    \ LE`。然后从列表中选择你的 micro:bit 的名称。该应用将连接到你的 micro:bit。同时，字母 \"C\" 将显示在 micro:bit\
    \ 的 5x5 LED 矩阵上。之后，温度数据将显示在应用的终端上（图 7-6）。\n\n> **注意**  \n> 有时你的应用可能无法在第一次尝试时连接到\
    \ micro:bit。请多尝试几次，如果问题仍未解决，请重启应用/micro:bit。如果几次尝试后仍然无法工作，请尝试 Wi-Fi，我们将在第 9 章中讨论。\n\
    \n![../images/486852_1_En_7_Chapter/486852_1_En_7_Fig6_HTML.jpg](img/486852_1_En_7_Fig6_HTML.jpg)\n\
    \n图 7-6：传感器数据显示在应用的终端上\n\n我们已经成功地从 micro:bit 上无线提取了数据。你现在可以使用正在用来查看这些数据的应用中的工具了。\n\
    \n关闭应用将断开你的智能手机/平板电脑与 micro:bit 之间的 BLE 连接。\n\n## 7.7 micro:bit 上 BLE 的其他选项\n\n\
    MicroPython 不支持 BLE，并且在 MakeCode 中支持有限，但是有很多其他方法可以编写 micro:bit 代码：可以在诸如 `ArduinoIDE`\
    \ 或 `mBed` 等平台上开发应用程序，从而开启更多可能性。我们的网站提供了一个我们整理的应用程序，它使用 `ArduinoIDE` 为 micro:bit\
    \ 构建了一个支持 BLE 的气象站，该气象站可以连接到物联网。\n\n这个例子开始展示 BLE 在 micro:bit 上的真正潜力，但它复杂且冗长，不适合学习者或初学者，并且比其他潜在解决方案复杂得多，我们将在后面的章节中开始探讨这些解决方案。\n\
    \n## 7.8 总结\n\nmicro:bit 上可用的蓝牙版本（BLE）提供了一些工具，这些工具在我们进行数据科学工作时可能非常有用。如果我们只需要 micro:bit\
    \ 自带的数据，或者可以接受有限的数据，或者有线解决方案就足够了，那么 BLE 有很多优势。但这些限制令人感到局限，而且 BLE 并不能让我们自由、轻松地访问物联网或云端。\n\
    \n在本章开始时，我们着手寻找一种从 micro:bit 无线提取数据的方法；虽然 BLE 有一些非常有趣和实用的应用，但它也有局限性。\n\n我们将把 BLE\
    \ 添加到我们的工具箱中，但我们会继续寻找无线解决方案。BLE 有很多优势，是一项非常有前途的技术，但只要我们将 micro:bit 作为数据收集工具的核心，这些限制就会制约我们的能力。\n\
    \n## 脚注\n\n[1] (#486852_1_En_7_Chapter.xhtml#Fn1_source)\n\n# 8. 探索 micro:bit\
    \ 无线电\n\n在第 7 章中，我们看到 micro:bit 上的 BLE 功能由两个完全不同的组件组成：\n\n- 一个物理板载无线电发射器/接收器（天线）\n\
    - BLE 标准，这些标准管理着传输内容、传输方式以及如何处理接收到的消息\n\nBLE 充当管理者：它管理着天线的使用方式，但与天线是完全分离的。可以绕过\
    \ BLE 直接访问无线电，由我们自己来管理天线。本章将介绍如何利用 micro:bit 无线电为我们数据科学工具箱增添价值。\n"
- fmt: '## 8.1 Standards Are Important


    One of the things that BLE does well is it allows the `micro:bit` to communicate
    with other (BLE-enabled) devices. It can pair with mobile phones, tablets, and
    laptops, but not with other `micro:bit`s.


    Without the BLE standard to manage radio communication we will face the same problem
    we might encounter listening to someone speaking in a language we are not familiar
    with: we hear the sounds they are making but we cannot extract meaning from them.
    Two radios can transmit and receive signals till the cows come home: unless there
    is a common language that both the transmitter and the receiver have agreed to
    use, they will not be able to make sense of each other.


    Some kind of communication standard is necessary: if we drop BLE we will have
    to replace it with something else. Both `MakeCode` and `MicroPython` provide an
    alternative, much simpler, way of using the onboard radio.


    ## 8.2 Using Radio for Input/Output


    We have already seen how to write data to the `micro:bit`’s memory, how to print
    data to a screen and how to transmit data over a BLE connection. In all these
    cases, what we are doing is very similar: we are outputting data. Radio is just
    another place that we can output data to: instead of telling the microprocessor
    to send data to a screen or file, we tell it to transmit it from the antenna.


    Both `MicroPython` and `MakeCode` provide tools to use the onboard antenna as
    a data communication tool. The standards that they apply are different; the main
    consequence of which is that a `micro:bit` running code written in `MicroPython`
    cannot communicate by radio with a `micro:bit` programmed in `MakeCode`.


    Both `MakeCode` and `MicroPython` provide the basic functionality needed to use
    the antenna: they allow data to be converted into radio signals, transmitted wirelessly
    and then, when received, converted back into data. We know that if we convert
    (for example) the number “4” or the word “hello” into a radio signal which is
    transmitted, then a `micro:bit` at the other end receiving this signal will be
    able to interpret the signal to mean “4” or “hello”. But there is still work for
    us to do in the code, as we will see.


    A constraint with the onboard radio is that it only enables `micro:bit`s to communicate
    with other `micro:bit`s. We can use it build a closed network of `micro:bit`s
    that can communicate among themselves. How can we use this meaningfully in our
    data science endeavors?


    ## 8.3 Using Radio to Build a Network


    In Chapter [1](#486852_1_En_1_Chapter.xhtml) we saw that thermometers record ambient
    temperature, which is the temperature of a very small volume of space in the vicinity
    of the sensor.


    To measure the temperature of a room/large area, such that we can be confident
    in our result, it helps to sample several different locations and derive an answer
    based on multiple data points. The `micro:bit` radio is the perfect tool for this.


    What we will do is build a small network of `micro:bit`s; we use four, two will
    do, and the exercise will scale up to many more. Our network will behave as described:


    *   We are going get four `micro:bit`s that communicate with each other over radio.


    *   One of the `micro:bit`s on the network will be different from the others:
    we will call this one our `server` or `collector` and it will have the job of
    listening out for radio signals from other `micro:bit`s in the network.


    *   The other three `micro:bit`s are `nodes`. They are identical, and their job
    is to measure temperature and transmit the result.


    *   The `server` will listen for temperature data from the `micro:bit`s in the
    network. When it has received data from all of them it aggregates it and shows
    the average.


    Figure [8-1](#486852_1_En_8_Chapter.xhtml#Fig1) depicts a simple radio-based network
    of `micro:bit`s, with three `nodes` and one `server`.


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig1_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Our network consists of four separate instruments


    ## 8.4 Choosing MakeCode or MicroPython


    There are some subtle differences between how `MicroPython` and `MakeCode` handle
    radio communication. Most obvious of these is with groups/channels:


    *   In `MakeCode` there are 256 groups ranging from 0 to 255. To use the radio
    feature on a `micro:bit`, you have to assign it to a group.


    *   In `MicroPython` the are 84 (some sources claim 100) channels, numbered 0–83,
    that you can use to transmit/receive.


    For the remainder of this chapter we are going to use `MakeCode`: our objective
    is to understand what value radio on the `micro:bit` can add to our data science
    experimentation, and `MakeCode` is slightly simpler to use. In addition, avoiding
    having to consider subtle but arbitrary differences in how `MakeCode` and `MicroPython`
    implement radio will ensure we stay focused on the core message.


    ## 8.5 MakeCode Radio Groups


    When we send data over radio, let’s say the number “4”, the `MakeCode` standard
    pads it with other data, such as the `group ID`. So, when you tell `MakeCode`
    to send “4”, what is actually transmitted might look more like “32_4” (which is
    simplified, but makes the point). All the data is sent together and is referred
    to as a `packet`.


    `Micro:bit` broadcasts its `group ID` inside each data `packet`. In addition,
    a `micro:bit` will ONLY process messages that include the same `group ID`. Figure
    [8-2](#486852_1_En_8_Chapter.xhtml#Fig2) shows six `micro:bit`s deployed as two
    groups.


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig2_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Six `micro:bit`s deployed as two groups


    In group 1 `micro:bit`s A, B, and C all transmit the same `group ID` when they
    send `packet`s, and they only process `packet`s they receive that include that
    `group ID`. They can communicate with each other, but they cannot communicate
    with `micro:bit`s D, E, and F in group 2. The `micro:bit`s in group 2 ignore any
    messages coming from group 1 and vice versa.


    `Micro:bit` radio doesn’t perform one-way or two-way communication. Instead it
    broadcasts data just like a radio station broadcasts music and voice. If any `micro:bit`
    wants to receive the data broadcasted by another `micro:bit`, they just need to
    be in the same group.


    ## 8.6 Nodes and a Collector


    To build our networked thermometer we will design a simple radio network that
    consists of a few `nodes` and a `collector`:


    *   A `node` collects data and transmits it to other `micro:bit`s in the same
    group.


    *   The `collector` listens for data from `nodes` and acts on that data in some
    predetermined way.


    The example we will use includes three `nodes` and one `collector`. You can adapt
    the network size by adding or removing `nodes`; if so you will need to modify
    the code. A `micro:bit` network of up to ten `nodes` should be relatively stable.


    Figure [8-3](#486852_1_En_8_Chapter.xhtml#Fig3) shows the radio network we will
    build:


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig3_HTML.jpg](images/486852_1_En_8_Chapter/486852_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Our simple radio network with three `nodes` and a `collector`


    Each `node` has a unique ID, which we will define in the code. They each measure
    the `ambient temperature` (using the built-in `micro:bit` thermometer) and then
    broadcast the temperature and their `Node ID`. A time delay, 5 seconds, will be
    implemented in between.


    The `collector` will monitor radio transmissions. When it receives a message with
    the right `Node ID` it will extract both the `temperature` and the `Node ID` from
    the `packet`. It will wait until all the `nodes` in the network have reported
    their temperature; then it will work out the mean temperature, which it will display.'
