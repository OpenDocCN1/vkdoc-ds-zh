    # 4.7 测量可存储的数据点数量


    我们的实验设计指出应“尽可能多地收集温度和压力数据”。了解 micro:bit 上能存储多少数据会很有帮助：


    -   如果能在 micro:bit 上存储 100 个数据点，就意味着在 24 小时内大约每 14.5 分钟读取一次数据。

    -   如果能在 micro:bit 上存储 1000 个数据点，就意味着大约每 90 秒读取一次数据。

    -   如果能在 micro:bit 上存储 10000 个数据点，就意味着大约每 9 秒读取一次数据。


    为了找出 micro:bit 的容量，我们将编写代码，向其中持续写入数据直至其崩溃，然后查看它在停止工作前成功保存了多少数据。很有趣！别担心，micro:bit
    不会损坏。


    我们将编写一个能在几秒内（而非 24 小时）快速填满文件的程序。我们将对 micro:bit 编程，使其读取 SW01 传感器上的温度和压力数据并写入 CSV
    文件，并持续执行直至无法写入。


    表 4-7 中的自然语言代码展示了需要告诉 micro:bit 执行的步骤。


    **表 4-7** 测量数据点的自然语言代码


    | 步骤 | 自然语言代码 | 备注 |

    | --- | --- | --- |

    | 1 | 导入所有必需的库。 | 我们需要核心 micro:bit 库以及气象传感器的库。 |

    | 2 | 初始化气象站。 | micro:bit 的大多数传感器和扩展件在使用前都需要进行“初始化”。 |

    | 3 | 如果 micro:bit 存储中已存在数据文件则停止。 | 如果 micro:bit 中已存在数据文件，则在 micro:bit 上显示“x”并退出代码。否则继续执行代码。
    |

    | 4 | 创建文件并打开用于写入。 | 这是我们要写入数据的文件。 |

    | 5 | 重复以下步骤。 | 我们将持续读写数据，直到程序崩溃！ |

    | 6 | 将文件内容读入一个变量。 | 我们不能简单地向文件添加数据——当写入任何内容时，它会覆盖文件中原有的内容。因此，我们需要先将文件的现有内容复制到一个变量中。
    |

    | 7 | 读取气象传感器的温度和湿度数据。 | 我们将向变量中“追加”以下内容：`temperature, humidity [换行符]` |

    | 8 | 将变量内容写回文件。 | 这将把变量内容写入持久化存储，覆盖现有文件。 |


    **免代码选项**：你可以在我们的资源网站上找到此处使用的预编译代码的完整工作版本。访问 `http://xib.one/XB` 并搜索第 4.7 节。


    **注意**：此代码需要 SW01 MicroPython 库才能运行。请按以下步骤操作：


    1.  下载 SW01 库（请参阅资源网站）。

    2.  将预编译代码刷写到 micro:bit 上。

    3.  将 SW01 库复制到 micro:bit 中。


    **警告**：请务必按列出的顺序执行这些步骤。


    表 4-8 展示了如何将自然语言代码转换为可编译并加载到 micro:bit 上的 MicroPython 代码。


    **表 4-8** 使用 MicroPython 开发代码


    | 步骤 | 描述 |

    | --- | --- |

    | 1 | 输入以下内容：<br> `from microbit import *`<br> `from SW01 import SW01`<br> `import
    os`<br> `import sys`<br> 这将把所有必需的库导入到你的程序中。 |

    | 2 | `SW01 = SW01()`<br> 这将初始化（或称“实例化”）SW01 库。 |

    | 3 | `d = 0`<br> `try:`<br> `d = os.size("we.csv")`<br> `except:`<br> `pass`<br>
    `if (d > 0):`<br> `display.show("*")`<br> `sys.exit()`<br> 当 micro:bit 上电时，如果已存在名为
    `we.csv` 的文件，屏幕上将显示“x”，程序将停止运行。这确保我们在尝试取回文件时不会覆盖它。 |

    | 4 | `open("we.csv", "w")`<br> 这将创建名为 `we.csv` 的文件并打开用于写入。 |

    | 5 | `while True:`<br> 这是一个循环（类似于 MakeCode 中的 `forever` 积木块）：它会持续运行，直到 micro:bit
    断电，或发生错误（在我们的程序中，它会一直运行到数据文件过大导致 micro:bit 抛出错误为止）。 |

    | 6 | `try:`<br> `with open("we.csv") as a:`<br> `cont = a.read()`<br> `cont =
    cont + str(SW01.getTempC()) + "," + str(SW01.getHumidity()) + "\n"`<br> `except:`<br>
    `display.show(".")`<br> `sys.exit()`<br> 这将执行以下操作：<br> • 打开文件进行读取。<br> • 将文件内容复制到一个变量
    (`cont`) 中。<br> • 从气象传感器读取温度和湿度。<br> • 将它们作为一条记录追加到内容末尾。<br> 当写入过程中存储空间满时，LED
    矩阵上会显示一个句点，程序将终止。 |

    | 7 | `with open("we.csv", ''w'') as b:`<br> `b.write(cont)`<br> 这将把变量 `cont`
    的内容写入文件。 |


    完整的 MicroPython 代码清单如下：


    ```

    from microbit import *

    from SW01 import SW01

    import os

    import sys

    SW01 = SW01()

    d = 0

    try:

    d = os.size("we.csv")

    except:

    pass

    if (d > 0):

    display.show("*")

    sys.exit()

    open("we.csv",''w'')

    while True:

    try:

    with open("we.csv") as a:

    cont = a.read()

    cont = cont + str(SW01.getTempC()) + "," + str(SW01.getHumidity()) + "\n"

    except:

    display.show(".")

    sys.exit()

    with open("we.csv", ''w'') as b:

    b.write(cont)

    ```


    当代码运行时，micro:bit 上会创建一个文件，并持续向文件末尾追加新记录。请按以下步骤查看 micro:bit 停止前写入了多少条记录：


    将代码刷写到你的 micro:bit 上。刷写完成后代码将开始运行。


    等待代码停止运行（如 LED 所示，如图 4-5）。


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig5_HTML.jpg](img/486852_1_En_4_Fig5_HTML.jpg)


    **图 4-5** 所示 LED 亮起，表示数据记录已停止


    取出文件并按照前面的方法打开。


    滚动到文件末尾，检查写入了多少行——记下这个数字。


    重复几次（首先从 micro:bit 存储中删除数据文件，然后重新启动 micro:bit）。如果你有多个 micro:bit，可以尝试不同的设备，也可以让其他人一起尝试。结果会因人而异、因时而异，但很可能你能够存储
    50 到 60 条记录。


    我们发现可靠地存储 50 条记录是可行的。


    再看一下我们在表 4-8 步骤 3 中编写的代码。这段代码可以防止现有的数据文件被添加或覆盖。如果你的 micro:bit 显示一个小“x”，则表示此“软件锁定”代码已被激活，并且在
    micro:bit 上检测到了现有数据文件（图 4-6）。你需要从 micro:bit 文件系统中删除该文件才能继续。


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig6_HTML.jpg](img/486852_1_En_4_Fig6_HTML.jpg)


    **图 4-6** 小 x 表示文件系统中已存在数据文件


    **简易信息码**


    `x` = 存储中已存在数据文件。不进行数据记录。


    `.` = 数据记录已完成。从存储中取出数据文件。

