    ## Foreword


    I worked for the BBC for 17 years, all of them in the BBC’s Learning department,
    that part of the BBC responsible for developing materials for formal learning
    – students, teachers, and schools – and for all those people who just wanted to
    learn something new, what’s called informal learning. In the last part of my BBC
    career, I ran BBC Learning’s Innovation team, which is where I created the BBC
    micro:bit in response to the BBC’s ambition to inspire its audience to engage
    with coding, computer technology, and digital creativity.


    While leading the Innovation team, I was deeply interested in three literacies:
    digital literacy, media literacy and data literacy. I believe these literacies
    are vitally important to us, because, in the end, they are about citizenship,
    about providing a society’s citizens with the tools to understand, safely live
    in and meaningfully contribute to their society and its cultures and to help shape
    the futures of those societies and cultures. In the world we live in, with its
    central focus on computer and digital technologies and its deep reliance on data,
    it seems to me digital and data literacies are core requirements for any citizen;
    they are disenfranchised without them, and any resource helping them effectively
    acquire them is much needed.


    The BBC and its partners developed the BBC micro:bit to help children get to grips
    with digital literacy: to offer young people a simple, fun, and engaging way to
    develop digital skills and creativity that was physical in nature – something
    they could hold in their hands – and was low-cost enough to be given away. The
    BBC micro:bit was designed, from the outset, to be a learning tool, a device that
    would help young people start coding, making, and building, to help them think
    about something they wanted to produce and have the skills and tools to realize
    their ambitions. At its core, its aim was to support the development of a new
    generation of tech pioneers, to help today’s young learners be the creators in
    our society, not just its mere consumers.


    I never got the opportunity at the BBC to start thinking about tackling data literacy;
    however, I did have the satisfaction of believing the BBC micro:bit would probably
    be a useful learning tool with that too. The device was built to be used in a
    number of different curricula, the obvious ones like Computer Science, Science,
    Mathematics, and Design and Technology and the less obvious like Art, Music, and
    Dance. Our thinking was that in Computer Science it would help students understand
    how a computer worked and how to program one. However, in the other curricula,
    its use was intended to be different. In Science and Mathematics, we thought the
    micro:bit would enable the collection and analysis of scientific data. For Design
    and Technology, the micro:bit was a tool for invention – a device that would collect
    environmental or control data and make use of it in directing elements of a product.
    For Art, Music, and Dance, the micro:bit was to be a performance tool, a device
    for collecting various performance data, like the movement of an arm, and converting
    it to an artistic output, a musical sound, the color or intensity of a light,
    the movement of a brush – whatever the artist/performer wanted. The key micro:bit
    used in all these “other” curricula was always the same – the collection, analysis,
    and use of data.


    When the partnership developed the BBC micro:bit, there was a huge temptation
    to build a device that could do everything, so every possible chip and sensor
    was on it. In the end, we realized that not only was this a cost issue – the micro:bit
    had to be as cheap as possible – but it was a learning and community issue. The
    micro:bit had to have space on it – it had to have inbuilt inability – so other
    people could develop it, add things to what it could do, make it better for themselves,
    and make it useful for the things they wanted to do.


    All of this is why it is so satisfying to see this excellent book. The authors
    put the micro:bit to use exactly as we hoped, as one of a number of enablers,
    hopefully a very easy one, to help learners understand what it is to be a data
    scientist, while at the same time they recognized the BBC micro:bit is not perfect
    for its job. It has to be added to, built upon – and for this they use the clever
    XinaBox – while making sure there are always alternatives, including how things
    are coded. In doing all this, they also recognize, as the BBC micro:bit did, the
    person using their book is a learner, a novice. Things at the beginning have to
    be easy; they cannot be immediately overburdened with things not necessary to
    the core task, so they make sure knowledge of things, like circuit building and
    computer programming, are not barriers to using their book. At a personal level,
    I also really like the ethos behind the book. The authors believe the core driver
    for answering the questions posed in life is human curiosity, an inquisitive human
    mind, and, though they don’t actually use the words, data literacy is a key skill
    for the world we live in.


    As the book says, “We are all data scientists. On a daily basis, often without
    realizing it, we consume data. We use the information dished up to us constantly
    to make decisions, plans, or even just conversation… Understanding how to read
    and exploit data is a key skill in today’s data driven society.”


    > Howard Baker, 9 October 2019


