    computers on the Internet. They might save data, or process it, or perform transactions,
    or even provide artificial intelligence (AI) services.


    *   The **Internet of Things** can be thought of as the systems within the Internet
    where data is transferred or processed without human intervention.


    **Figure** [**6-2**](#486852_1_En_6_Chapter.xhtml#Fig2) shows a simplified view
    of how different connected components fit together.


    ![../images/486852_1_En_6_Chapter/486852_1_En_6_Fig2_HTML.jpg](images/486852_1_En_6_Chapter/486852_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    The anatomy of an IoT system


    Referring to the numbered elements in **Figure** [**6-2**](#486852_1_En_6_Chapter.xhtml#Fig2):


    1.  **Edge devices**: Some digital devices are connected to the real world, such
    as sensors that record weather data or provide GPS coordinates. When they are
    connected to the Internet they provide new data from outside of it. So these devices
    are at the edge of the IoT and we call them edge devices.


    2.  **Gateway devices**: A gateway device provides an edge device with the means
    of connecting to the Internet/IoT. Bear in mind that if you want to connect an
    edge device to the IoT, then it suggests that you want to send data somewhere –
    to some other device. There are two main options (3 and 4 below).


    3.  Other devices/networks that make up the Internet of Everything and the IoT
    (as seen in **Figure** [**6-1**](#486852_1_En_6_Chapter.xhtml#Fig1)).


    4.  **Service providers**: There is a huge global industry providing online services.
    Email, image backup, social media, banking, and a huge range of other services
    are available in the cloud for us to use. These services constitute the backbone
    of the cloud.


    So, the cloud is a vast collection of service providers who provide tools (such
    as email and social media) which we use over the Internet. These services are
    not free; for example it costs Google to provide and maintain Gmail.


    **The cloud is not an altruistic undertaking**. It costs service providers money
    to provide services, so they of course need to make that money back.


    In some way each gateway into the cloud needs to pay a price to access the services
    they use on the cloud. We may pay by providing a cash payment for a specific service,
    or by providing data about ourselves that is of value to a service provider. Often
    they may make their money by enabling advertisers to reach us with marketing messages.


    It is true that some services are genuinely free, but just like when you enter
    a shop you expect to pay for any item you walk out with, so should you expect
    to pay, in some form or another, when using cloud services.


    In this book we’ll use free services to get started with the IoT – most providers
    offer free trial periods. But they are always limited in various ways, and to
    use these services on an unlimited basis it will be ultimately necessary to pay
    a fee.


    ## 6.4 Transferring Data from a micro:bit


    In **Section 6.1** we looked at the different aspects of the data science process
    and we identified the greatest weakness in our existing tool set: we are unable
    to use the micro:bit to collect any real volume of data. It is great at measuring
    the data that we need, just not very suitable when it comes to storing it.


    IoT offers us a solution for this: it provides the means to go from recording
    a few dozen data points to a virtually unlimited number:


    By transferring the data as soon as it is recorded we avoid the limitations inherent
    in storing the data on the micro:bit. If we could move the data to another platform
    that is more suited to storing large amounts of data then we are limited by that
    platform, rather than the micro:bit. There are IoT platforms that are designed
    to make it easy to do just this: they provide cloud services to store data. So,
    if we can find a way to transfer our data to a suitable IoT platform, then the
    micro:bit’s data storage issues cease to be a limiting factor on our data science
    capacity.


    The challenge we face is: how can we transfer data as it is being collected on
    the micro:bit to another device? There are four ways this could be done:


    1.  By having a person transcribe data as it is recorded, then enter it manually
    onto the next device. We tried this sort of thing in earlier chapters and abandoned
    it quite quickly as it was too labor intensive. This is not a viable option.


    2.  By connecting a peripheral that can store volumes of data. At the end of Chapter
    [5](#486852_1_En_5_Chapter.xhtml), we looked at an SD card solution for the micro:bit
    that allows for data files in excess of 1 gigabyte to be stored. This is an excellent
    solution if you have access to the hardware and if you don’t mind only being able
    to access the data later, after it has been collected.


    3.  By using a cable to join the micro:bit and the other device. We’ll look at
    **wired** options in **Section 6-6**.


    4.  By using a **wireless** option. Computers are able to transmit data wirelessly
    in a number of ways, which we look at in **Section 6-5**.


    We have set our sights on transferring the data from our micro:bit to the cloud^([^(10)](#fn10))
    where a broad range of tools and capabilities will enable us to significantly
    increase out data science productivity. We will now consider options 3 and 4 and
    decide on which to pursue in later chapters.'
  trans: '

    ## 6.3 云的剖析


    在我们探讨如何将物联网融入数据科学之旅之前，还有几个我们将遇到且需要基本了解的概念。本节将澄清一些语义，并审视构成物联网系统的不同组件。


    首先，在**第 6.2 节**的基础上，我们将了解互联网、物联网以及“云”的定义：


    - **互联网。** 在**第 6.2 节**中，我们提到了万物互联和人类互联，但并未明确这两者中哪一个才是“互联网”一词的真正含义。大多数人会将互联网等同于“万物互联”。

    - **云**是万物互联的一个子集：它由多台计算机（通常是强大的服务器）组成，为互联网上的其他计算机提供服务。这些计算机可以保存数据、处理数据、执行事务，甚至提供人工智能服务。

    - **物联网**可以被视为互联网中无需人工干预即可传输或处理数据的系统。


    **图 6-2** 展示了不同连接组件如何协同工作的简化视图。


    ![../images/486852_1_En_6_Chapter/486852_1_En_6_Fig2_HTML.jpg](img/486852_1_En_6_Fig2_HTML.jpg)


    图 6-2


    物联网系统的剖析


    参照**图 6-2**中的编号元素：


    1. **边缘设备**：一些数字设备与现实世界相连，例如记录天气数据或提供 GPS 坐标的传感器。当它们连接到互联网时，就会从外部提供新的数据。因此，这些设备位于物联网的边缘，我们称之为边缘设备。

    2. **网关设备**：网关设备为边缘设备提供连接到互联网/物联网的方式。请注意，如果你想把边缘设备连接到物联网，那就意味着你想将数据发送到某个地方——发送到其他设备。主要有两种选择（下方的
    3 和 4）。

    3. 构成万物互联和物联网的其他设备/网络（如**图 6-1**所示）。

    4. **服务提供商**：全球有一个庞大的在线服务行业。电子邮件、图片备份、社交媒体、银行以及海量其他服务都在云端供我们使用。这些服务构成了云的主干。


    因此，云是大量服务提供商的集合，他们提供我们通过互联网使用的工具（如电子邮件和社交媒体）。这些服务并非免费；例如，谷歌提供和维护 Gmail 是需要成本的。


    **云并非一项无私的事业**。服务提供商提供服务需要花钱，因此他们当然需要收回这些成本。


    从某种程度上说，每个接入云端的网关都需要为其在云上使用的服务支付一定的代价。我们可能通过为特定服务支付现金来付费，也可能通过提供对服务提供商有价值的个人数据来付费。通常，他们可能通过让广告商向我们投放营销信息来赚钱。


    诚然，有些服务确实是免费的，但就像你进入商店时，就要为带走的任何商品付款一样，在使用云服务时，你也应该以某种形式支付费用。


    在本书中，我们将使用免费服务来开始物联网的探索——大多数提供商都提供免费试用期。但这些服务总是在不同方面受到限制，要想无限制地使用这些服务，最终还是需要付费。


    ## 6.4 从 micro:bit 传输数据


    在**第 6.1 节**中，我们研究了数据科学过程的不同方面，并指出了现有工具集中最大的弱点：我们无法使用 micro:bit 收集任何实质性的数据量。它在测量我们所需的数据方面表现出色，但在存储数据方面却不太合适。


    物联网为此提供了一种解决方案：它提供了从记录几十个数据点到几乎无限数量的方法：


    通过在数据记录后立即传输数据，我们避免了 micro:bit 上存储数据的固有限制。如果我们能将数据转移到另一个更适合存储大量数据的平台，那么我们就受限于该平台，而非
    micro:bit。有些物联网平台的设计目的就是让这一点变得简单：它们提供云服务来存储数据。因此，如果我们能找到一种方法将数据传输到合适的物联网平台，那么
    micro:bit 的数据存储问题就不再会成为我们数据科学能力的限制因素。


    我们面临的挑战是：如何将 micro:bit 上正在收集的数据传输到另一台设备？有四种方法可以实现：


    1. 由一个人转录记录下来的数据，然后手动输入到下一台设备。我们在前面的章节中尝试过这种做法，但很快放弃了，因为它太费劳力了。这不是一个可行的选择。

    2. 连接一个能够存储大量数据的外设。在第 5 章末尾，我们研究了一个用于 micro:bit 的 SD 卡解决方案，该方案允许存储超过 1GB 的数据文件。如果你能获取到硬件，并且不介意只能在数据收集完成后才能访问数据，那么这是一个极好的解决方案。

    3. 使用线缆连接 micro:bit 和另一台设备。我们将在**第 6.6 节**中讨论**有线**选项。

    4. 使用**无线**选项。计算机能够通过多种方式无线传输数据，我们将在**第 6.5 节**中讨论这些方式。


    我们的目标是将数据从 micro:bit 传输到云端^((10))，在那里，广泛的工具和功能将使我们能够显著提高数据科学的生产力。现在我们将考虑选项 3 和
    4，并在后续章节中决定采用哪一个。'
