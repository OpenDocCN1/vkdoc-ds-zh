    \ A tick icon (white tick on a green circle) will be added at the top-right corner\
    \ of the title bars if the tests succeeded.\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig32_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig32_HTML.jpg)\n\
    \n  Figure 11-32  \n  Triggering the workflow manually\n\n- The **Response** action\
    \ has a cross icon (cross on the gray background) on its title bar to indicate\
    \ that the test was unsuccessful. To view the Response action’s output details,\
    \ click inside the Response action’s title bar. You should see the message (**Figure**\
    \ [**11-33**](#486852_1_En_11_Chapter.xhtml#Fig33)): “ActionResponseSkipped”.\
