    完成后，您的**大小和缩放**选项卡应如下所示（**图** **11-2**）。


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig2_HTML.jpg](img/486852_1_En_11_Fig2_HTML.jpg)


    图 11-2


    配置大小和缩放选项卡


    | **名称：** | department |

    | --- | --- |

    | **值：** | data science |


    -   选择 **下一步：标签** 继续创建您的中心。在**标签**选项卡上，按如下所示填写字段：


    -   完成后，您的**标签**选项卡应如下所示（**图** **11-3**）。


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig3_HTML.jpg](img/486852_1_En_11_Fig3_HTML.jpg)


    图 11-3


    配置标签选项卡


    -   选择 **下一步：查看 + 创建** 继续创建您的中心。您的**查看 + 创建**选项卡应如下所示（**图** **11-4**）。


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig4_HTML.jpg](img/486852_1_En_11_Fig4_HTML.jpg)


    图 11-4


    查看 + 创建选项卡


    -   选择**创建**以创建您的新中心。创建中心可能需要几分钟时间。


    创建 IoT 中心后，我们将深入探讨 Azure 机器学习工作室并设置 Azure 逻辑应用。在创建逻辑应用时，您需要提供 `IoT 中心`和`资源组`的名称，因此请确保您有这些详细信息。


    ## 11.5 在 Azure 机器学习工作室中设置天气预报模型


    要使用天气预报模型，我们首先选择一个模型：有多个选项可用。然后，我们必须将选定的“天气预报实验”导入到我们的 Azure 机器学习工作室项目中：


    -   打开 ML 工作室 – 确保您已登录。

    -   在同一浏览器的另一个选项卡中，转到此 URL（`https://gallery.azure.ai/Experiment/Weather-prediction-model-1`）以定位我们使用的天气预报
    AI“实验”。*还有几个可用的实验，您也可以尝试，以及大量其他实验可供操作。*


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig5_HTML.jpg](img/486852_1_En_11_Fig5_HTML.jpg)


    图 11-5


    Azure AI 库实验：天气预报模型


    -   单击**在工作室中打开**。然后会弹出一个模态窗口，提示您选择一个区域：保留默认选项，然后单击勾选标记继续。

    -   导入实验后，ML Studio 界面应如下所示（**图** **11-6**）。


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig6_HTML.jpg](img/486852_1_En_11_Fig6_HTML.jpg)


    图 11-6


    天气预报模型


    -   单击**运行**（在屏幕底部的菜单中）以验证这些步骤。

    -   当流程中的每一步运行时，它也会进行验证，并且您会看到每当一个步骤成功验证时，都会添加一个绿色的勾选标记。应该没有任何错误。所有步骤验证完成后，它应该会停止运行
    – 可能需要一分钟左右。

    -   单击**设置 WEB 服务 ➤ 预测 Web 服务**。这可以在底部菜单中 **运行** 按钮旁边找到。


    > **注意**

    > 除非系统在上一步中全程通过了验证过程，否则 **设置 WEB 服务** 选项将不可选。完成后，所有步骤都应显示小的绿色勾选标记。


    -   单击设置 Web 服务后，您的视图会随着生成模型的新版本而更新：**预测实验**，这就是我们将要使用的。完成后，应该有两个选项卡：训练实验和预测实验。

    -   我们将**移动****Web 服务输入**块。此块告知实验从何处将 Web 服务的数据（即，来自我们的气象站仪器）注入到模型中。

    -   单击连接**Web 服务输入**和**天气数据集**的线条（单击连接到**Web 服务输入**块的位置）– 这将断开它们的连接。

    -   现在，将线条连接到**评分模型**块，如**图** **11-7** 所示。


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig7_HTML.jpg](img/486852_1_En_11_Fig7_HTML.jpg)


    图 11-7


    将“Web 服务输入”连接到“评分模型”


    -   完成这些操作后，单击**运行**以让新模型进行验证。请记住等待它完成。

    -   单击**部署 WEB 服务**以将模型部署为 Web 服务。


    您现在已构建了一个**实验**，您可以通过单击左侧菜单中的**实验**列表来查看它。您还创建了一个**Web 服务**对象，我们将从 Azure 链接到该对象：我们将把数据传递到此
    Web 服务中。为此，我们需要记下一些详细信息（URI 和 API 密钥）：


    -   单击左侧菜单上的**Web 服务**链接。您会看到一个列表，其中至少显示一个 Web 服务。

    -   单击我们刚刚创建的 Web 服务的名称 – 默认情况下，它将被命名为**天气预报模型（预测扩展）（图** **11-8****）**。


    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig8_HTML.jpg](img/486852_1_En_11_Fig8_HTML.jpg)


    图 11-8


    用于访问 Web 服务详细信息的链接

