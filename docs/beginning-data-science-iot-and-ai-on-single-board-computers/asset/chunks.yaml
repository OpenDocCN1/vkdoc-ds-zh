    ### 12.8 数据分析


    在数据科学实验的这个阶段，开始分析我们收集到的数据是很正常的。但是，当机器学习服务使用温度和湿度数据生成我们的预测时，这不已经完成了吗？我们的角色是否被颠覆了：在分析阶段，我们现在是否变得多余了？


    答案是响亮的：不！与数据科学流程的大多数领域一样，自动化的出现让我们从重复且费力的任务中解放出来，使我们能够运用我们非人工智能的智慧，专注于那些无法自动化的事情。


    在此情况下，我们的分析目光落在了结果上：它们有多智能或有用？我们可以利用结果做些什么来从中提取价值？是否存在任何伦理考量？我们不应只看结果表面：我们的角色是质疑它们，并检查它们是否合乎逻辑、可信且有用。我们应该问，人工智能是否真的在驱动分析，还是它仅仅是一个复杂的算法？


    何不将机器学习服务在一段较长时间内的结果记录下来，并添加你自己的数据（例如是否下雨）。然后运用分析技术来看看这些预测的真实有效性如何。机器学习服务做出的预测与实际下雨之间的相关性有多强？


    虽然这些问题及其答案会影响我们对我们天气预测数据的信任程度，但该预测的有效性与我们本章所取得的成就相比，只是次要的。能够使用一个机器学习服务意味着能够使用许多个，正如我们将在**第**
    **13** **章**中讨论的那样。


    可能会让一些读者担忧的是，机器学习服务缺乏任何明显的学习方式：如果我们没有提供关于预测准确性的反馈，那么服务如何知道其预测是否准确，又如何从错误中学习呢？


    我们的物联网应用中缺少的一个要素是**训练**。当一个机器学习服务首次被建立时，它会经历一个训练阶段，在此期间，人类操作员会提供关于其生成结果准确性的信息。


    一个简单的例子是能够区分猫和狗图像的机器学习服务。当机器学习服务最初被设置时，一个人会向它提供被标识为`cat`或`dog`的图像。机器学习会推断出与`cat`或`dog`相关的视觉特征，并开始对提供的新图像进行分类。当机器学习开始区分猫和狗时，人的角色就是通过审查结果并识别正确/错误的结果来训练机器学习。机器学习会持续适应，直到人接受模型的准确性并停止训练它。


    我们这里并没有专注于训练：本书的目标是使用机器学习服务进行数据科学工作，而不是学习如何构建/设置机器学习服务或帮助使其更准确。训练机器学习服务很有趣，并且有助于直观理解其工作原理，但作为消费端的机器学习服务并不需要包含训练要素。^(²⁰)
    当我们作为消费者使用电子邮件服务时，我们并不期望必须训练它如何发送邮件。同样地，对于现成的机器学习服务（就像我们使用的那个），非专业消费者也希望能够直接使用。构建机器学习服务（包括训练它）的过程，未来可能会有很大比例的使用机器学习服务的人对此知之甚少。


    ### 12.9 总结


    我们的数据科学之旅已接近尾声，在此过程中，我们接触了广泛的技术和技巧，它们都以某种方式对我们的数据科学工作有所帮助。


    开发者构建一个可重复使用的模块/函数个人库（即他们的工具包）是非常正常的。当程序员掌握一个新概念时，他们会开发一些代码片段/函数来帮助自己运用它。多年以后，他们可能忘记了该概念的某些方面，但仍然会确切地知道如何使用他们的函数。


    你应该将你在本书中成功实现的不同技术视为你工具包的一部分；在构建本章的边缘设备时，我们几乎没做什么全新的工作（除了在`MakeCode`中使用了一些新的模块）：我们只是组合了我们已经开发过的内容。早期关于模块化和可重用性价值的观点，已被我们能够轻松构建所需仪器的事实所隐含地证明了。


    你的工具包现在已经达到了一个临界点：具有被用于各种新颖且意想不到的应用的潜力。在下一章也是最后一章中，我们将探讨在合上本书后，我们在本书中积累的工具包如何能对你有所帮助。


    **脚注** 1 2 3


    # 13. 巩固我们的所学


    在最后一章中，我们将回顾本书所涵盖的内容，并探讨我们学到的技能如何能在不同的情境中应用。旅程即将结束，终点会是什么样子，我们从这里又将去向何方？我们还能用数据科学工具包做些什么？


    ### 13.1 我是一名数据科学家吗？


    恭喜你走到了这里。如果你跟随各章节，完成了所有示例并且一切都理解透彻，那么你就拥有了数据科学的坚实基础，并具备了在实际情境中应用它的能力。


    当然，就像学习生物学基础并不能使人成为医生一样，拥有数据科学的坚实基础也不能使人立刻成为数据科学家。本书所概述的信息和技术是一个垫脚石：它们本身就有用，并且可能是成为专业数据科学家的第一步。但什么是`专业数据科学家`？


    医生、护士、建筑师、水管工：这些学科需要在正确使用头衔之前获得认证。这涉及学习一套规定的知识体系，并通过某种资格认证过程。目前没有普遍接受的数据科学家认证，没有管理机构，也没有最终考试：任何人都可以自称为数据科学家。


    至于你是否是一名数据科学家这个问题：在你的工作或日常生活中，你是否处理数据、处理和分析数据、解释数据并产生可执行的输出？如果是，那么也许你就是。

    '
- fmt: '## 13.2 Becoming a Data Scientist


    While the loose/informal definition of what makes someone a data scientist is
    interesting, when companies are hiring data scientists they generally have a clear
    idea of what they are looking for. This tends to be a set of skills/experiences
    that relate to how the company already undertakes data science, and it is very
    common to see jobs advertised requiring specific skills such as coding (e.g.,
    in `Python`), `SQL`, statistics and machine learning.


    If you are interested in exploring data science further, potentially making a
    living from it, there are many disciplines to study and a huge range of directions
    to go in. One of the best ways to get an understanding of what skills matter in
    the field of data science is to look at job boards.


    Most of the skills required can be learned, and if you’ve found that you are comfortable
    with the material in the book then you probably have the aptitude required to
    do so. One theme has been consistent throughout this journey, and that is the
    role that curiosity plays in the process. The skills mentioned are valuable, but
    what makes a great data scientist is their curiosity, their drive to ask questions.
    Intuition is also highly prized: being curious about the right things and being
    able to ask the right questions are traits that computers are nowhere near able
    to replicate. And remember, you don’t need to be able to think like a computer:
    we have computers to do that for us.


    ## 13.3 Debunking Some Myths


    From a data science point of view, myths are hypotheses/facts that have been accepted
    by people to be true/proven, but which are not based on any reliable or verifiable
    data.^([^(21)](#fn21)) It is somewhat ironic that a field like data science has
    its own set of myths. The problem with myths are that they often look like barriers
    to people on the other side, so we’ll take a look at a few and try to debunk them:


    **Only data scientists do real data science.**


    - Data science is what we have been doing throughout this book – using scientific
    methods to gather, process, and perform all manner of operations on data.

    - Until a professional standard is established, a data scientist is someone who
    is employed in a job with “Data Scientist” in the title. The term is used professionally
    to refer to the analytical aspects of the process. The team member who builds
    and codes the sensor arrays would not be called the data scientist. But they are
    participating in data science: it is a team operation, and the data scientist
    is a member of that team.


    **Real data scientists do not use Excel/spreadsheets.**


    - A novice uses Excel excessively.

    - An expert never uses Excel.

    - A guru uses Excel when it is appropriate.


    **You have to be a strong coder to be a data scientist.**


    - Data scientists will find themselves in situations where coding is required.
    It is a great skill to have.

    - But when some code needs to be written, a data scientist can use a developer
    to write it for them.

    - The key is knowing what to ask the developer for: what are the outcomes needed
    from the code? Any good developer should have no problem converting well thought-out
    natural language code into real code.


    **Only big corporations and universities can afford it.**


    - It is possible for a single individual on a budget to undertake real, affordable
    and novel data science experimentation.

    - Given the sheer volume of data that is being generated daily, and with so much
    of it being free and easy to access online, how many fascinating, groundbreaking
    and useful correlations are there waiting to be found, perhaps only a few clicks
    away?


    **You have to be exceptionally intelligent to be a data scientist.**


    - Data science is an intellectual field, but anyone with the right curiosity and
    drive can learn the techniques needed.

    - Of course highly intelligent people tend to do well in a range of intellectual
    fields, including data science.


    **Market research is not real data science.**


    - Especially in academia, market research is looked down on as being substandard;
    some might say it is guilty of “selling out” – putting profit before quality.

    - There is good and bad market research just like there is good and bad academic
    research.

    - The real difference is that we so often see bad market research splashed on
    billboards and thrust in our faces on advertising. This does not represent the
    full range and potential of the market research industry.

    - An example of nontrivial market research in post-apartheid South Africa will
    help illustrate a more positive application.


    Back in the 1990s, advisers to the ANC used a small market research company based
    in Durban (the now defunct Research Surveys) who had an innovative product called
    “The Conversion Model”. This was a survey technique which was surprisingly effective
    at measuring predicted behavioral responses from different groups of people to
    specific messages. In a nutshell, would this message incite or unite?


    Mr. Mandela was without question one of the greatest statesmen of his, or any,
    era, and while the ANC were assured of victory in the national elections it was
    a priority of his to ensure that all the different race groups in the country
    were engaged with, and excited by, the process of transforming South Africa into
    the Rainbow Nation.


    Multiple conversion model surveys were commissioned to assess which parts of the
    ANC’s message resonated the best with different race groups and which ones were
    most polarizing. Mr. Mandela’s government of national unity did a great job of
    prioritizing items that helped keep a broad spectrum of the population enthused
    and optimistic.'
