    microSD card that is mounted on the IM01 bridge.


    The coding element is not central to what we are looking at in this chapter: we
    are not introducing any new coding concepts, just employing concepts we’ve already
    covered (saving sensor data to persistent memory). The software required can be
    downloaded from our resource website, which also shows how to replicate the code
    in MakeCode using the IM01:


    Go to [`http://xib.one/XB`](http://xib.one/XB) and search for **Section 10.7**.


    ## 10.8 Using the Hardware


    When the hardware has been constructed, it can be powered up and used. **Figure**
    [**10-5**](#486852_1_En_10_Chapter.xhtml#Fig5) shows some snapshots of our hardware
    in action.


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig5_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig5_HTML.jpg)


    Figure 10-5


    Using the data logger to record environmental conditions that are present when
    a target behavior is exhibited. (1) Powering up. (2) Pressing button A to start
    recording. (3) Data is recording. (4) Pressing the button B to tag the data. (5)
    Pressing button A again to stop/resume recording


    Click the A button on the micro:bit to start it recording and leave it somewhere
    within reach. Act as you normally would until you notice that you have exhibited
    the target behavior. At this point click the B button.


    When you click the B button, you “tag” the data: a record in the data file is
    labeled with a “1”. This is illustrated in **Figure** [**10-6**](#486852_1_En_10_Chapter.xhtml#Fig6).


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig6_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig6_HTML.jpg)


    Figure 10-6


    Tagged data collected in the experiment


    In **Figure** [**10-6**](#486852_1_En_10_Chapter.xhtml#Fig6) the header for column
    H (heading = **B)** is highlighted. Note that row 12 has the value **1** in this
    column (also highlighted). When you click the B button on your micro:bit, the
    value 1 is written into this column. This allows us to identify a point in time
    when the target behavior was observed.


    Continue to record and tag data until you have several instances of the target
    behavior. We recommend you record four to six instances before moving on to the
    analysis phase; more instances will yield better results but will require more
    work.'
