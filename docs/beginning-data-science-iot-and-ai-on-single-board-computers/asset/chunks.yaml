    # 12.5 使用边缘设备


    在构建并编程好边缘设备后，我们现在只需为其通电并开始使用。


    > *必须以特定方式为气象站通电，因此请遵循**第** **9****章****9.9**节所述的步骤*。


    **第** **9****章**还列出了仪器在首先连接 Wi-Fi 路由器，然后连接目标物联网平台时所经历的阶段。本例略有不同，因为我们也要接收并显示来自物联网平台的数据。如果流程运行正常，你应该看到以下现象：


    1.  如果仪器已连接到 Wi-Fi 网络，`micro:bit` LED 屏幕上将显示字母 `C`。


    2.  随后，`micro:bit` 将尝试连接到 Azure，并开始向我们的物联网应用发送数据。


    3.  当数据成功传输时，屏幕上会显示一个对勾，随后显示降雨预测结果（`"Yes"` 或 `"No"`）。


    气象站将持续共享并显示这些数据，直到你将其关闭。


    当你第一次看到 `"Yes"` 或 `"No"` 在 `micro:bit` 的 LED 上滚动时，你完全有理由感到极大的满足感：你实现了一些在几年前还不可能完成的事情。天气预测应用是机器学习（ML）的（非官方）`Hello
    World!`，**第** **13****章**将详细阐述这个简单的 ML 实验为我们解锁了哪些其他更复杂的应用。


    ## 12.6 改进边缘设备


    这个边缘设备尽可能地简单：使用了最少的代码和硬件——仅五个硬件模块和六个代码块。


    我们可以通过添加更多组件或使代码更复杂来增强该仪器。利用本书中介绍的技术，你应该能够实现以下一些增强功能：


    *   添加一个像样的显示器并打印数据到上面。


    *   当按下 `A` 按钮时，显示连接状态。


    *   处理预测数据——当预测结果为 `"Yes"` 时执行某种操作，为 `"No"` 时执行另一种操作——为什么不显示一个图形来表示下雨呢？


    *   控制数据发送和接收的频率，或者仅在按下 `B` 按钮时发送。


    *   你有多个 Wi-Fi 网络的凭据吗？使用常量变量并尝试自动连接到任何在范围内的网络。


    ## 12.7 探究物联网应用的内部机制


    看着我们的 `micro:bit` 屏幕上滚动着 `"Yes"` 或 `"No"`，然后望向窗外检查是否在下雨……这种乐趣持续不了多久。当你对此感到厌倦时，趁着边缘设备仍在运行，返回物联网应用，看看里面发生了什么。


    打开 **Azure 逻辑应用设计器**，并单击设计器工具栏上的 **运行**，以使数据流经你的工作流。加载可能需要一些时间，之后工作流将显示出来。你应该能认出**第**
    **11****章**中**图** **12-5** 所列出的五个步骤。


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig5_HTML.jpg](img/486852_1_En_12_Fig5_HTML.jpg)


    **图 12-5** 手动触发的工作流：`Response` 选项卡上的绿色对勾表示其处于 `RUN` 模式


    如果边缘设备仍在运行，你应该已在 `RUN` 模式下打开了工作流：如果它已正确加载，你将看到一个对勾图标（绿色圆圈内的白色对勾）添加到 `Response`
    操作的标题栏上。这表示你的逻辑应用已收到确认，即 Azure 与 `micro:bit` 之间的数据交易已成功完成。从这里我们可以查看工作流的每个阶段，了解正在发生的事情，并检查正在处理的实时数据。


    > **提示：** 如果 `Response` 操作的标题栏上仍然显示一个"**叉号**"图标，请确保边缘设备功能正常，然后反复运行逻辑应用，直到获得"**对勾**"。


    我们将查看工作流的一些元素。


    ### 解析 JSON


    当我们创建工作流时，`Parse JSON` 文件已经为我们设置好，其中包含变量名，而非值。现在，由于数据正在流经工作流，我们可以查看 JSON 文件包含实时内容时的样子：


    *   单击 `Parse JSON` 操作。

    *   向下滚动，找到 `OUTPUTS` 部分。

    *   单击主体并向下滚动文本框。


    **图** **12-6** 显示了已解析的数组，其中包含来自 `micro:bit` 的温度和湿度值，以及来自 ML 服务的降雨预测结果。


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig6_HTML.jpg](img/486852_1_En_12_Fig6_HTML.jpg)


    **图 12-6** `Parse JSON` 操作的输出


    ### 初始化变量


    *   单击 `Initialize variable` 操作。


    当初次设置工作流时，创建了一个名为 `score` 的变量。这是存储我们预测结果的变量：它是一个字符串，包含 `"Yes"` 或 `"No"`。


    **图** **12-7** 显示 `score` 中的结果当前为 `Yes`。


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig7_HTML.jpg](img/486852_1_En_12_Fig7_HTML.jpg)


    **图 12-7** `Initialize variable` 操作的输出


    ### 响应


    *   单击 `Response` 操作。


    `score` 变量（前面讨论过）已被分配到响应消息的 `Body` 中（**图** **12-8**）。这就是我们作为结果传回给 `micro:bit`
    的内容。


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig8_HTML.jpg](img/486852_1_En_12_Fig8_HTML.jpg)


    **图 12-8** `Response` 操作的输出


    ### 当收到 HTTP 请求时


    *   单击 `When a HTTP request is received` 操作。


    此信息在工作流运行期间不会改变；可以在这里找到 `HTTP POST URL`（**图** **12-9**）。此参数至关重要，因为它用于 MakeCode
    块 `CW01 connect to Azure with access endpoint`，以连接到基于 Azure 的物联网应用。


    ![../images/486852_1_En_12_Chapter/486852_1_En_12_Fig9_HTML.jpg](img/486852_1_En_12_Fig9_HTML.jpg)


    **图 12-9** `When a HTTP request is received` 操作，显示 `HTTP POST URL`

