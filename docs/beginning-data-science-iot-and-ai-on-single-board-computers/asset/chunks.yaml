- fmt: '# 5.2 Software for Data Analysis


    Before the adoption of computers, data analysis was very slow and labor intensive.
    Hand-drawn data tables similar to the ones we created in earlier chapters were
    used, and undertaking the sorts of data-based experiments we have been looking
    at required a broad skill set, lots of training, and tons of patience; a rare
    combination of qualities.


    As computers emerged and the sorts of capabilities we’ve been exploring in earlier
    chapters were developed, so the potential for data science expanded exponentially:


    Software replaced human effort, but computers and code do not replace us in the
    data science process. Instead they free us from the mundane tasks and allow us
    to dedicate our time and attention to elements of the process where human intelligence
    and intuition are required. Notwithstanding some recent developments in artificial
    intelligence (AI), no data science experiment has ever been conducted purely by
    computers. The human element is always present and irreplaceable.


    It is fair to say that the computerization of data analysis democratized data
    science: powerful and usable software allows anyone with a laptop and some data
    to perform sophisticated analysis.


    There is not a single suite of software that is the standard for data scientists.
    Many swear by `Python`, or `SAS`, or some flavor of `SQL`. In this chapter we
    are going to use a spreadsheet, which has all the features we need, including:


    * Support for data tables. The CSV file we created will open effortlessly in any
    spreadsheet program.

    * Many spreadsheet programs have built-in functions that we can use for data analysis,
    such as functions that measure correlations between two sets of data.

    * Support for visualizations. Most spreadsheets allow you to easily create standard
    charts and other visualizations.

    * Spreadsheets are relatively easy to use.

    * Powerful spreadsheet programs are very widely distributed and easy to get your
    hands on.

    * Spreadsheets are very useful in general and knowing how to use a spreadsheet
    program is a worthwhile skill to nurture.


    ## 5.3 Selecting a Spreadsheet Program


    We are going to use `Excel` as our spreadsheet program, but there are other viable
    alternatives including `Google Sheets`, `OpenOffice` and `LibreOffice`.


    If you use a different spreadsheet program and you are not sure if it is suitable
    for working through this chapter, just Google the name of your spreadsheet and
    the words "formula for correlation." If the software you are using comes with
    a built-in function for measuring correlations then you should be able to follow
    this chapter using that software. If not, we recommend you look at an alternative,
    many of which are available for free online.^([⁵](#fn5))


    While we will cover the basics of using the spreadsheet program for data analysis,
    there are a few core skills you will need which we will not cover in this book.
    You need to know how to:


    * Open the spreadsheet program and start a new project.

    * Open a CSV file in the spreadsheet program.

    * Type values into cells.

    * Navigate around the spreadsheet.


    **Figure** [**5-1**](#486852_1_En_5_Chapter.xhtml#Fig1) outlines some key terms
    we use to describe different aspects of a spreadsheet.


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig1_HTML.jpg](images/486852_1_En_5_Chapter/486852_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Naming conventions for columns, rows, and cells


    * **Rows**: Rows run laterally, left to right, and are numbered from 1, 2, 3 and
    so on.

    * **Columns**: Columns run vertically, top to bottom, and are labeled A, B, C
    and so on.

    * **Cells**: A cell is the place where a column and a row intersect, and they
    are labeled according to their column and row: `A1` or `B3` or `C8`, for example.


    ## 5.4 Measuring Correlation


    In **Chapter** [**3**](#486852_1_En_3_Chapter.xhtml) we saw that temperature and
    pressure behaved in a similar way: they appeared to be related somehow and we
    used the term "correlation" to describe this relationship. We were unable to say
    how strong this correlation was though – we don''t have the language to describe
    this in an objective way. Are they 100% correlated, or 0.5 correlated, and do
    either of these questions actually mean anything?


    Correlation coefficients are measured on a scale from -1 to +1:


    * The strongest possible correlation between two data sets gets a score of 1.
    When two data sets have a correlation score of 1, it usually means that they are
    both describing exactly the same thing (e.g., temperature in Celsius and temperature
    in Fahrenheit will have a correlation of 1).

    * A score of 0 or very close to 0 means there is no relationship between the two
    sets of numbers. The things they measure are completely unrelated.

    * Two sets of a couple of hundred random numbers are unlikely to have a correlation
    score of exactly 0. We might expect the score to be around 0.1, or -0.1, but as
    they are random, anything can happen.

    * There is no "good" or "bad" correlation score – it is just a description of
    how similarly two data sets behave.


    How would you interpret a correlation score of -1?


    **Table** [**5-1**](#486852_1_En_5_Chapter.xhtml#Tab1) provides a simple exercise
    that demonstrates the correlation scores between sets of numbers.


    Table 5-1


    Investigating correlation coefficients


    | Step | What to do | Notes |

    | --- | --- | --- |

    | 1 | Open the spreadsheet program and start a new project/spreadsheet/workbook.
    | Start with a blank sheet – we will type in some numbers. |

    | 2 | In Column A:Type the numbers 1 to 100. | There are tricks to help you do
    this: you don''t need to type out each number. |

    | 3 | In Column B:Copy the numbers from the first column. | Column A and Column
    B are identical – so they should have a maximum correlation score. |

    | 4 | In Column C:Type the numbers 100 to 1, so they count down in each cell.
    | This is the reverse of Column A. How will this correlate with column A? |

    | 5 | In Column D:Type in the numbers 2, 4, 6… to 100 and then go backward: 98,
    96, 94, etc. | In this column the numbers are very similar to Column A until the
    middle, when they start declining.How do we expect column D to correlate Column
    A? |

    | 6 | In Column E:Enter random numbers between 1 and 100 in each of the 100 cells.
    | Use a random number generating function. For both Excel and Google Sheets, you
    can use `= 100*RAND()`. |

    | 7 | In Column F:Copy what you did in column 5. | Columns E and F both have just
    random numbers throughout. |


    Once complete your spreadsheet should look something like **Figure** [**5-2**](#486852_1_En_5_Chapter.xhtml#Fig2).


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig2_HTML.jpg](images/486852_1_En_5_Chapter/486852_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    The top of a spreadsheet filled in as per Table [5-1](#486852_1_En_5_Chapter.xhtml#Tab1)


    It is worth taking a pause here and pondering the questions raised in the Notes
    column in **Table** [**5-1**](#486852_1_En_5_Chapter.xhtml#Tab1). What are your
    expectations? Once you have set your expectations, work through the steps in **Table**
    [**5-2**](#486852_1_En_5_Chapter.xhtml#Tab2) to calculate correlation scores.'
