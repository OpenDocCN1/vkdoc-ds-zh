  trans: "\n### 步骤 1：从气象站仪器发送数据\n\n工作流在气象站仪器发送数据时启动/触发。此步骤在 Azure 逻辑应用中被称为“`收到 HTTP\
    \ 请求时`”触发器。\n\n要设置工作流的这一部分：\n\n- 在 `Logic App 设计器`中，于 `搜索框` 下方，选择 `所有`。\n- 在搜索框中，输入\
    \ `http` 以查找 HTTP 触发器。\n- 从 `触发器` 列表中，点击 `收到 HTTP 请求时` 触发器（图 11-17）。\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig17_HTML.jpg](img/486852_1_En_11_Fig17_HTML.jpg)\n\
    \n  图 11-17\n  选择“收到 HTTP 请求时”触发器\n\n- 填写 `收到 HTTP 请求时` 触发器的信息，如图 11-18 所示。\n\n\
    \  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig18_HTML.jpg](img/486852_1_En_11_Fig18_HTML.jpg)\n\
    \n  图 11-18\n  `收到 HTTP 请求时`触发器详细信息\n\n- 以下是 `架构` 的完整列表，你可以直接将其复制到 `请求正文 JSON`¹⁷\
    \ `架构` 文本框中：\n\n```\n{\n\"properties\":\n{    \"humidity\":\n{    \"type\": \"\
    integer\"\n},\n\"temperature\":\n{    \"type\": \"integer\"\n}\n},\n\"type\":\
    \ \"object\"\n}\n```\n\n### 步骤 2：将数据传递到 ML 服务\n\n工作流中的下一步是将温度和湿度值传递给我们于第 11.2\
    \ 节中设置的 Azure ML Web 服务。\n\n| 方法：  | POST                                    \
    \                                                                            \
    \              |\n| :------ | :--------------------------------------------------------------------------------------------------------------------------------\
    \ |\n| URI：   | 从 `天气预测模型 [预测体验] 的请求-响应 API 文档` 中复制的请求 URI。 – 参见第 11.5 节。    \
    \                                                   |\n| 标头：    | `Accept`   \
    \              | `application/json`                                          \
    \    |\n|         | `Authorization`          | 从 `天气预测模型 [预测体验] 的请求-响应 API 文档`\
    \ 中复制的 API 密钥。 – 参见第 11.5 节。注意：确保在 `Bearer` 和 `API 密钥` 之间添加一个空格。 |\n|        \
    \ | `Content-Type`           | `application/json`                            \
    \                  |\n| 查询：   | 保持为空                                         \
    \                                                                        |\n|\
    \ 正文：   | `{   \"GlobalParameters\": {},   \"Inputs\": {       \"input1\": { \
    \          \"ColumnNames\": [               \"temperature\",               \"\
    humidity\"           ],           \"Values\": [               [              \
    \     \"value\",                   \"value\"               ]           ]     \
    \  }   }}`                                                                   \
    \                                                 |\n| Cookie：  | 保持为空       \
    \                                                                            \
    \                              |\n\n- 在设计器视图中，点击 `+ 新建步骤` (图 11-19)。\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig19_HTML.jpg](img/486852_1_En_11_Fig19_HTML.jpg)\n\
    \n  图 11-19\n  添加新步骤\n\n- 在搜索框中输入 `HTTP`。从结果中选择 `HTTP` 操作组 (图 11-20)。\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig20_HTML.jpg](img/486852_1_En_11_Fig20_HTML.jpg)\n\
    \n  图 11-20\n  搜索 `HTTP` 操作组\n\n- 这将展开为几个操作。从 `操作` 列表中，选择 `HTTP` 操作 (图 11-21)。\n\
    \n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig21_HTML.jpg](img/486852_1_En_11_Fig21_HTML.jpg)\n\
    \n  图 11-21\n  选择 `HTTP` 操作\n\n- 为 HTTP 操作提供以下信息：\n\n现在在 `正文` 中，将 `temperature`\
    \ 和 `humidity` 的值替换为 `动态内容`。\n\n- 选中第一个出现的 `\"value\"` (包括双引号)，然后从 `动态内容` 窗格中选择\
    \ `temperature` (图 11-22)。\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig22_HTML.jpg](img/486852_1_En_11_Fig22_HTML.jpg)\n\
    \n  图 11-22\n  插入动态内容 (步骤 1)\n\n- 接下来，将第二个出现的 `\"value\"` 替换为动态内容 `humidity`。\n\
    \n现在你的 `JSON 正文` 应该类似于这样 (图 11-23)。\n\n![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig23_HTML.jpg](img/486852_1_En_11_Fig23_HTML.jpg)\n\
    \n图 11-23\n插入动态内容 (步骤 2)。在此例中，为温度和湿度\n\n完成后，`HTTP` 模板应该类似于这样 (图 11-24)。\n\n![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig24_HTML.jpg](img/486852_1_En_11_Fig24_HTML.jpg)\n\
    \n图 11-24\n`HTTP` 操作详细信息\n\n### 步骤 3：解释（解析）ML 服务的结果（解析 JSON）\n\n数据通过 Web 服务以 `请求`\
    \ 形式传递到 Azure ML 模型，ML 模型以 `响应` 形式将结果发回。该响应是一个 `JSON 对象`（即一个包含 JSON 格式数据的“文件”），我们需要解析它以提取所需的值。为此，我们将添加名为\
    \ `解析 JSON` 的操作。\n\n| 内容： | 点击 `内容` 框，然后在动态内容中，于 HTTP 下方选择 `正文`。![../images/486852_1_En_11_Chapter/486852_1_En_11_Figa_HTML.jpg](img/486852_1_En_11_Figa_HTML.jpg)\
    \ |\n| :------- | :-----------------------------------------------------------------------------------------------------------------------------------------------------------------------\
    \ |\n| 架构：  | `{   \"properties\": {      \"Results\": {         \"properties\"\
    : {            \"output1\": {               \"properties\": {                \
    \  \"type\": {                     \"type\": \"string\"                  },  \
    \                \"value\": {                     \"properties\": {          \
    \              \"ColumnNames\": {                           \"items\": {     \
    \                         \"type\": \"string\"                           },  \
    \                         \"type\": \"array\"                        },      \
    \                  \"ColumnTypes\": {                           \"items\": { \
    \                             \"type\": \"string\"                           },\
    \                           \"type\": \"array\"                        },    \
    \                    \"Values\": {                           \"items\": {    \
    \                          \"items\": {},                              \"type\"\
    : \"array\"                           },                           \"type\": \"\
    array\"                        }                     },                     \"\
    type\": \"object\"                  }               },               \"type\"\
    : \"object\"            }         },         \"type\": \"object\"      }   },\
    \   \"type\": \"object\" }` |\n\n- 在设计器视图中选择 `+ 新建步骤`。\n- 在搜索框中输入 `Parse JSON`。从\
    \ `操作` 列表中，选择 `Parse JSON` (图 11-25)。\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig25_HTML.jpg](img/486852_1_En_11_Fig25_HTML.jpg)\n\
    \n  图 11-25\n  搜索并选择 `Parse JSON` 操作\n\n- 按如下所示和所述为 `Parse JSON` 操作提供此信息：\n\n\
    完成后，`Parse JSON` 模板应该类似于这样 (图 11-26)。\n\n![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig26_HTML.jpg](img/486852_1_En_11_Fig26_HTML.jpg)\n\
    \n图 11-26\n`Parse JSON` 操作详细信息\n"
- fmt: "### Step 4: Setting Up a Variable to Store the Data from the ML Service\n\n\
    Now we need to assign the rain prediction score (“Yes” or “No”) we are going to\
    \ extract (parse) from the JSON object to a variable of type `String`. To do that\
    \ we will add the action named **Initialize variable**.\n\n| **Name:** | `Score`\
    \ |\n| --- | --- |\n| **Type:** | `String` |\n| **Value:** | We will use a formula\
    \ to get the “Scored labels” in the two-dimensional array: `body('Parse_JSON')?['Results']?['output1']?['value']?['Values']?[0]?[2]`\
    \ |\n\n- In the designer view select **+ New step**.\n- In the search box type\
    \ **Initialize variable**. From the **Actions** list, select **Initialize variable**\
    \ (**Figure** [**11-27**](#486852_1_En_11_Chapter.xhtml#Fig27)).\n\n  ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig27_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig27_HTML.jpg)\n\
    \n  Figure 11-27  \n  Searching and selecting the “Initialize variable” action\n\
    \n- Provide this information for the **Initialize variable** action as shown and\
    \ described here:\n\nOnce completed the **Initialize variable** template should\
    \ look something like this (**Figure** [**11-28**](#486852_1_En_11_Chapter.xhtml#Fig28)).\n\
    \n![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig28_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig28_HTML.jpg)\n\
    \nFigure 11-28  \n“Initialize variable” action details\n\n### Step 5: Sending\
    \ Data Back to the Weather Station Instrument\n\nFinally, we will send the variable\
    \ `score` to the micro:bit to be displayed on the 5X5 LED matrix.\n\n| **Status\
    \ Code:** | `200` |\n| --- | --- |\n| **Headers:** | Keep as blank |\n| **BODY:**\
    \ | Insert the dynamic variable `score` from the **Dynamic content** pane under\
    \ the **Variables** category.![../images/486852_1_En_11_Chapter/486852_1_En_11_Figb_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Figb_HTML.jpg)\
    \ |\n\n- In the designer view select **+ New step**.\n- In the search box type\
    \ **Response**. Wait for the search results. Then in the **Actions** list, select\
