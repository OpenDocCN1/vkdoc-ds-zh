    in the next section. |


    - What were the highest and lowest temperature and pressure scores?

    - What was the mean average temperature and pressure during the period?

    - What single reading was most common for temperature and pressure?


    # Using Visualization Tools


    Most spreadsheet programs provide you with tools to generate visualizations, and
    these usually include some standard chart types (e.g., line, bar, and pie charts).
    Across the different programs the way you generate and edit charts is similar,
    and online support is generally good. We will generate a very simple line chart
    showing our temperature and humidity data using the following steps, which you
    should be able to follow in whichever spreadsheet program you are using:


    1. Highlight both columns of data in the spreadsheet.

    2. Click **insert**.

    3. Find the **chart** option and click that.

    4. Select the first **line chart** option listed.


    This should give you a rudimentary line chart, which may be good enough for your
    needs. You can edit the chart in a number of ways which differ from program to
    program, but if you follow these simple guidelines, you should be fine:


    - To select a specific part of a chart, click it. Usually some kind of visual
    guide (e.g., markers around the corners) will show you what you have selected.

    - If you want to edit something on the chart, select it and then right-click.
    Look for an option with the word **edit**. Click it.

    - Play around with settings – you can’t break anything.

    - Start again if you don’t like what you have.


    Our chart is shown in **Figure** [**5-5**](#486852_1_En_5_Chapter.xhtml#Fig5).
    We’ve omitted the time of day; it would usually be shown along the bottom on the
    x axis. See if you can guess when dawn broke by looking at the data.


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig5_HTML.jpg](images/486852_1_En_5_Chapter/486852_1_En_5_Fig5_HTML.jpg)


    **Figure 5-5** A line chart showing temperature and pressure over 24 hours. Taken
    in the United Kingdom in September 2019


    # Reporting


    Our analysis of the temperature and pressure data has yielded a number of outputs.
    We have a correlation score, max, min, range, average and a visualization. But
    our experiment is not complete until the results have been written up and a report
    has been delivered to our **stake holders**. These are the people on whose behalf
    we are undertaking our data science experiment – perhaps our employers, or a charitable
    foundation, or an investor. Even if we are doing it for ourselves, a blog or social
    media update is still a form of reporting.


    The way in which you put together this report will depend on the software that
    you use, but however you do so there are a number of guidelines that are useful
    to try and follow:


    - Include a brief summary of what your experiment was.

    - Show the sample size – how many data points you collected.

    - Try to fit everything on one page.

    - Don’t be technical – show results written in plain English.

    - Add your visualization.


    Our report is shown in **Figure** [**5-6**](#486852_1_En_5_Chapter.xhtml#Fig6).


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig6_HTML.jpg](images/486852_1_En_5_Chapter/486852_1_En_5_Fig6_HTML.jpg)


    **Figure 5-6** A one-page report showing an overview of the experiment'
