  trans: '

    ### 平均值分析：“集中趋势”


    对于*这个房间的温度是多少？*这一问题，是否真的存在一个完美且正确的答案？如果有，房间的哪些部分恰好是那个温度？我们会选择哪一个单一数值来描述这个房间的温度？平均值是对大量数字集合的一种便捷且有用的概括。


    ### 数据质量分析


    我们的某个温度计是对的吗？还是其中一个比另一个更准确？记住要将这一点与工具实际测量的内容联系起来。


    **两者**相对于它们所测量的对象来说都是正确的——如果存在误差，那是因为我们进行了**外推**。当我们进行外推时，我们取一个有意义的值并将其应用于其他事物。


    因此，当我们取一个适用于房间中非常小体积的温度值，并将其应用于整个房间时，我们就对数据进行了外推。外推可能会影响数据的有效性：外推得越多，数据失去有效性的风险就越大。


    ### 内省


    如果我们要重复这个练习，有哪些地方可以改进？


    对于之前的问题，确实没有绝对的对错之分；这个练习的价值在于提问和讨论——养成对数据集提出大量问题的习惯。这是数据分析阶段的核心。


    数据分析确实会变得更加规范化。专业的数据分析工具非常复杂，支撑它的数学理论既精妙又繁复。但无论你使用什么工具，数据分析都意味着提出问题，然后找到答案。对数据科学家来说，一组数据就像一盒未拆封的巧克力，是一种有待探索和发现的乐趣。但首先，一定要先检查配料表！


    ## 2.11 为什么选择 `micro:bit`？


    在前一节中，模拟温度计可能使用起来稍微简单一些，而且很可能也更精确一点；如果我们只是想测量温度，那么没有迫切的理由要改用 `micro:bit`。


    展望未来，我们将坚持使用数字工具：数字意味着我们可以接触到大量的硬件、软件和知识，在我们的数据科学实验中能够有效地利用它们。


    想象一下，构建一个能够读取花粉水平，然后在你四处走动时将其实时上传到追踪该水平的网站上的工具。如果水平过高，就添加一个警示灯，让几十个人同时使用它，并实时更新你的路线，带你经过最不可能引发你过敏的区域。这就是应用数据科学，正是这种能够做这类酷炫事情的承诺，让我们坚持使用数字工具。


    BBC `micro:bit` 可能不是一个很出色的温度计，但它在很多方面满足了我们对微处理器的需求：


    *   它是一个非常易于使用的微处理器——比市面上任何其他选择都更加用户友好。

    *   编码编辑器非常易于使用。

    *   很多人已经拥有它（流通量接近 500 万），而且还在持续生产。它是一个不断发展的平台，尤其是在教育领域。

    *   它得到了很好的支持——有大量的资料和帮助。

    *   它还有一些酷炫的元素：*来自* **神秘博士** *的创造者，BBC* `micro:bit` *登场！*


    我们将在本书中全程使用 BBC `micro:bit`，但在列出硬件需求时，我们也会推荐替代方案。你也可以使用手头的 `Circuit Playground`、`Raspberry
    Pi` 或 `Arduino` 设备，同样可以轻松地阅读本书。


    不过，BBC `micro:bit` 本身并不能满足我们所有的需求——我们在本章中的经验已经揭示了一些缺点：


    *   它包含一个温度传感器，以及一个磁力计和一个加速度计，但没有其他环境传感器。我们需要访问更广泛的传感器组，以便收集有趣的数据。

    *   5x5 的 LED 矩阵不太适合读取大量数据。在某些时候，我们将需要其他方法来从 `micro:bit` 中提取数据。


    我们将转向数字化，并将使用 BBC `micro:bit` 作为我们数字工具包中的微处理器。我们还需要用其他一些套件来增强它，以收集我们所需的所有数据。


    ## 2.12 我们需要什么套件？


    每个数字测量设备都有一些共同特征：它们都由相同的基本组件构成。在本书中，当我们描述如何构建设备时，将使用诸如**图** **2-1**（如前所示）和**图**
    **2-6** 这样的电路/框图来向您展示所包含的硬件组件。使用这些电路/框图，你可以利用手头的任何硬件来构建你的工具/仪器。**图** **2-6** 展示了一个由七个组件构建的电路示例。


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig6_HTML.jpg](img/486852_1_En_2_Fig6_HTML.jpg)


    **图 2-6** 一个复杂数字工具组件的简单示意图


    我们在本书中构建的工具将包含以下大部分组件：


    1.  **电源**：我们将使用随 `micro:bit` 附带的 2xAAA 电池盒或 USB 线缆供电。

    2.  **微处理器**：我们将使用 BBC `micro:bit`。

    3.  **一个或多个传感器**：用于测量事物的传感器。市面上有大量数字传感器可供选择，到本书结束时，你应该有足够的信心找到特定传感器并使用它来创建数字测量工具。

    4.  **多种数据输出方式**：图中展示使用了 `OLED` 显示屏、文件系统和 `Wi-Fi` —— 三种不同的方式来访问从传感器收集的数据。

    5.  其他**酷炫部件**：如 `GPS` 或执行器（用于移动或控制事物：例如启动电机或打开灯光）。

    6.  **连接所有部件的方式**：当所有部件连接起来后，我们就得到了一个**“电路”**。各组件连接的方式是电路的关键要素，通常并不简单。


    **图** **2-5** 中所示的仪器将构成一个出色的天气监测工具。`GPS` 模块允许我们对结果进行**地理标记**，以识别读取数据的位置。`Wi-Fi`
    模块将用于将数据从仪器上传到`物联网`（`IoT`）平台，同时也允许我们获取实时时间，用于为数据添加**时间戳**（即记录数据读取的时间）。数据会本地保存到存储卡上，以防
    `Wi-Fi` 连接中断。我们需要一个能够让我们构建这种复杂程度的数据采集仪器的工具包。

    '
- fmt: '## 2.13 Selecting Our Toolkit


    Most electronics retailers will stock the components we need: we are just a Google
    search away from being able to make some really cool and quite unique tools.


    But unless you are familiar with the world of microcomputing the array of options
    will be daunting. From beginners to seasoned makers, the following questions always
    make purchases a bit stressful:


    - How do we know which ones to buy? There are dozens of CO2 sensors on the market
    – which ones are appropriate for our needs?

    - How can we be sure the bits we buy will work together? Will the components all
    be **compatible**? What is the right voltage, and what is voltage anyway? Do they
    all speak the same kind of binary, or are there dialects? Do I cut the red wire
    or the green one?

    - A related challenge is **connectivity** – how do the components actually fit
    together? How are we supposed to join them?


    To avoid these sorts of concerns, as well as avoiding the need to learn anything
    about circuits, we are going to use components from the **XinaBox** range to supplement
    our BBC micro:bit. This range is suitable for our needs in a number of ways:


    - It is compatible with micro:bit and can be coded easily through MakeCode and
    MicroPython.

    - Components can be joined with connectors – we can make circuits as easily as
    building with Lego. There is no need to learn anything about circuit building.

    - It provides all the components we will need throughout this book.

    - It is simple to **“map”** components to our needs. Want to add Wi-Fi? There
    is an xChip for that. LoRa, or GPS, or Bluetooth? There is an xChip for that.
    A sensor that measures UV light, or motion, or CO2 levels? There is an xChip for
    that. And they all connect together the same way.


    Using this system allows us to focus on the core skills of data science – we don’t
    need to spend ages learning how to build complex circuits with soldering irons,
    breadboards, and cables. That is fun and is a great skill to have, but it is not
    what this book is about.


    **Figure** [**2-7**](#486852_1_En_2_Chapter.xhtml#Fig7) shows a micro:bit sitting
    in an **IM01 bridge**.


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig7_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    The micro:bit slips easily into the XinaBox IM01 bridge


    **Figures** [**2-8**](#486852_1_En_2_Chapter.xhtml#Fig8) and [**2-9**](#486852_1_En_2_Chapter.xhtml#Fig9)
    show the two **xChips** connected together. IDs are clearly visible (OD01 on the
    left and SW01 on the right).


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig9_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig9_HTML.jpg)


    Figure 2-9


    Clip the xChips to the bridge and you have built a digital tool


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig8_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig8_HTML.jpg)


    Figure 2-8


    Using the xBus connectors, xChips can be clipped together easily. Just make sure
    the ID is always facing up


    For those of you who do not use micro:bit or do not have access to XinaBox kit,
    please note that:


    - Although every activity is solved using micro:bit and the XinaBox kit, we present
    an alternative hardware solution each time and the natural language code should
    be easy to adapt.

    - The hardware in the activities is described in a generic way – if you can build
    the circuits described, whatever system you use, then you should be able to follow
    the book.


    ## 2.14 Guide to Hardware Requirements


    Throughout the book, we will undertake a series of increasingly more complex experiments.
    Each of these will require us to gather data, and we will need to build a tool
    to do so. We will define the components needed in this tool in a “Hardware Requirements”
    section which will include the following details:


    Table 2-3


    An example of the Hardware Requirements component list table


    | What we need | What we will use | Alternative hardware |

    | --- | --- | --- |

    | Power | micro:bit 2xAAA battery pack | USB cable |

    | Microprocessor | micro:bit | Adafruit Circuit Playground |

    | Weather sensor | XinaBox SW01 xChip | Any device with a mounted Bosch BME280
    chip |

    | Display | XinaBox OD01 OLED screen | micro:bit 5x5 LED matrix |

    | Connectivity | XinaBox IM01 bridge and xBus connectors | Edge connector breakout,
    breadboard and hookup wires |


    1. A simple block/circuit diagram will be shown identifying the components used
    in our tool. **Figure** [**2-1**](#486852_1_En_2_Chapter.xhtml#Fig1) and **Figure**
    [**2-6**](#486852_1_En_2_Chapter.xhtml#Fig6) are examples of these.

    2. A table will list these components – **Table** [**2-3**](#486852_1_En_2_Chapter.xhtml#Tab3)
    is an example. We list the components from the block/circuit diagram in the column
    **What we need**. We also list the hardware we use in the book in the **What we
    will use** column. The third column, **Alternative hardware**, shows a different
    hardware setup that you could use to build the same tool.


    **Figure** [**2-10**](#486852_1_En_2_Chapter.xhtml#Fig10) shows a **“tool”** built
    with the hardware listed in the **What we will use** column in **Table** [**2-3**](#486852_1_En_2_Chapter.xhtml#Tab3).


    ![../images/486852_1_En_2_Chapter/486852_1_En_2_Fig10_HTML.jpg](images/486852_1_En_2_Chapter/486852_1_En_2_Fig10_HTML.jpg)


    Figure 2-10


    A tool built with the hardware listed in the “What we will use” column


    All the code that is provided (no-code, MakeCode, and MicroPython) will work with
    the hardware described in the **What we will use** column in **Table** [**2-3**](#486852_1_En_2_Chapter.xhtml#Tab3).


    You may need to adapt the code slightly if you use different hardware. In particular,
    most manufacturers will provide libraries (or extensions) for you to use with
    their kit. If you use different hardware, look on the manufacturer’s website for
    information on how to find and use the appropriate libraries. Adding them to your
    workspace should be similar to how it is described in our website.


    ## 2.15 Summary


    To undertake meaningful data science experiments we are going to need to gather
    our own data. This will require us to build digital data gathering tools which
    we will also need to code.


    We have chosen a very simple system of hardware to build our tools with and have
    provided a variety of options to code them. This includes the no-code option,
    which is intended to make the data gathering tools useful to people who are not
    keen on writing code themselves: being a computer programmer and engaging with
    digital technology are not the same thing.


    The system we will use is the BBC micro:bit + XinaBox “xChips”. It is hard to
    find a simpler option, short of buying ready-made tools that will perform the
    functions we need. With this system we can embark on our data science journey
    without any prior hardware knowledge.


    # 3. Experimenting with Weather


    In this chapter we are going to design an experiment where we will record temperature,
    humidity and atmospheric pressure. We’ll use our digital toolkit to build a weather
    station, and then we’ll investigate how those measures impact on our day-to-day
    perception of the weather.'
