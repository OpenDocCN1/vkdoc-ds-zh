- fmt: '## 5.11 Statistical Significance


    Consider the examples we looked at in **Table** [**5-1**](#486852_1_En_5_Chapter.xhtml#Tab1)
    and **Table** [**5-2**](#486852_1_En_5_Chapter.xhtml#Tab2). We copied out a couple
    of columns containing 100 numbers and then we checked the correlation coefficients
    between different columns. Have a look again at Column A and Column D, as well
    as **Figure** [**5-4**](#486852_1_En_5_Chapter.xhtml#Fig4).


    Do you think the results would have been the same if we only used the first 50
    numbers of both columns?


    Let’s ask a similar question but phrased very differently. Consider the following
    scenario:


    - You have two data sets, both containing temperature and pressure data.

    - One data set has 1 million data points taken continuously over 10 years. The
    other has 500 data points taken over 2 weeks.

    - In the smaller data set, the correlation between temperature and pressure is
    0.5. In the larger data set, the correlation is 0.75.


    Considering the scenario outlined earlier, if someone asked you to describe the
    correlation score, would you say it is **strong** or **moderate**?


    Most of us would instinctively trust the larger data set – it just makes sense
    that 10 million data points contain more substance, more potential information,
    than 1000 data points. Each data point contains some value – it is like a pixel,
    making up an image. Having more data points is like having more pixels: as the
    resolution improves so does our ability to see the big picture.


    Logic therefore tells us that results coming from larger data sets are somehow
    more meaningful than results coming from a smaller set. Similarly, it is logical
    to say that results coming from large, valid, and reliable data sets are more
    meaningful than results coming from less **rich** data. The term “rich” data is
    very apt – it is used to refer to data that has the potential to yield lots of
    information.


    The concept of **statistical significance** is the best measure of how meaningful
    a specific result is. The mathematics of calculating significance is quite complex
    and not in scope for us here, but very interesting and well worth looking into.
    The important thing for a data scientist is not knowing the mathematics that significance
    scores are built on though, it is understanding what a statistical significance
    score means:


    - A correlation coefficient is completely different from a significance score.

    - Significance is usually shown as a percentage or an index.

    - It is frequently referred to as the **confidence** level.

    - It is a measure of the extent to which a specific result is likely to recur
    if the experiment is repeated.

    - If a result has a significance score of 50%, that means that if the experiment
    were to be repeated there is a 50% chance that the same result would be observed.
    The result is true half the time and not true the rest of the time.

    - If a result scored 100% significance, then that means it is always true – an
    unassailable fact. Scores of 100% are very rare.

    - Data scientists set an arbitrary threshold: a significance level above which
    a result can be considered a “fact” – usually 95% or 99%. Pretty much every scientific
    fact that we have ever been presented with has been demonstrated in an experiment
    where the significance score was greater than 95% or even 99%, but almost always
    lower than 100%.


    As a rule of thumb, it is rare to find significant results in a data set with
    less than 50 readings; larger data sets are more likely to yield significant results,
    and the more valid and reliable data is, the more likely significant results will
    be uncovered. In most data science experiments, results that are not significant
    are discarded or treated with caution.


    It is possible to calculate the significance of a correlation score, and readers
    are encouraged to look more deeply into this.


    ## 5.12 Summary


    In this chapter we have looked at how to use a spreadsheet to help us undertake
    analysis of a data table we built in **Chapter** [**4**](#486852_1_En_4_Chapter.xhtml).
    The key challenge we solved was extracting the data from the `micro:bit` and getting
    it into a tool that is better suited to the task of data analysis. Spreadsheets
    are powerful and widely available, but why stop at moving data from the `micro:bit`
    to a laptop when the Internet of Things is just a modem away.


    Footnotes [1](#486852_1_En_5_Chapter.xhtml#Fn1_source) [2](#486852_1_En_5_Chapter.xhtml#Fn2_source)
    [3](#486852_1_En_5_Chapter.xhtml#Fn3_source)


    # 6. Introducing IoT to Data Science


    In this chapter we will look at the **Internet of Things** (IoT) from the perspective
    of data scientists. What is IoT and how can it help us expand our data science
    capabilities?


    ## 6.1 The Weakness in Our Data Science Toolkit


    In the preceding chapters we have undertaken increasingly complex data science
    experiments. Our questions and our tools have grown more sophisticated, but the
    underlying process typically includes the following steps:


    1. **Curiosity**: The process always starts with curiosity; a question.

    2. **Experimental design**: We then work out how we are going to answer this question
    – what data should we gather and what tools do we need? We define the steps that
    are going to be taken to execute our experiment.

    3. **Data collection**: The experiment involves a period of collecting data.

    4. **Data transference**: Data that has been collected is moved off of the data
    gathering tool into some other environment more conducive to analysis. So far
    we have transcribed data onto paper and saved data onto file.

    5. **Analysis**: The data that has been retrieved from our data gathering tool
    is analyzed using appropriate techniques and software.

    6. **Reporting**: We have developed visualizations and seen how data can be presented
    as conversational facts.

    7. **Introspection**: Deriving learnings from the experiment to improve future
    designs.


    The greatest weakness so far in our data science toolkit is in step 4. We have
    written data down on a piece of paper and used the `micro:bit`’s persistent memory
    to record data, but neither of these solutions can scale very well. To collect
    much greater volumes of data we are going to need to find other ways to transfer
    data off of our `micro:bit`-based data collection tools and into our analysis
    software. It is here that IoT will prove its value to us.'
