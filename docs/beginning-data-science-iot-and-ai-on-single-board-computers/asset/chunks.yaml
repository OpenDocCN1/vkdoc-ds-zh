  trans: '

    `## 5.5 计算相关性得分`


    按照**表 5-2** 中的步骤，在比较我们在**表 5-1**中创建的不同列时，找出相关性得分。


    **表 5-2** 为表 5-1 数据添加相关性得分


    | 步骤 | 操作说明 | 备注 |

    | --- | --- | --- |

    | 1 | 使用在表 5-1 中创建的同一个电子表格。 | 我们将在 G 列输入标签，在 H 列输入公式。 |

    | 2 | 在线搜索如何在电子表格程序中使用相关性函数的详细信息。 | 对于 Excel 和 Google Sheets 来说，计算两列数据相关性得分的公式是
    `=CORREL(A1:A100,B1:B100)`。 |

    | 3 | 在单元格 G1 中，输入**A 和 B 的相关性**。在 H1 中输入 `=CORREL(A1:A100,B1:B100)`。 | 这将比较 A
    列与 B 列的数据。输入公式后，你将看到结果。是否如你所料？ |

    | 4 | 在单元格 G2 中，输入**A 和 C 的相关性**。在 H2 中输入 `=CORREL(A1:A100,C1:C100)`。 | 这将比较 A
    列与 C 列的数据。输入公式后，你将看到结果。是否如你所料？ |

    | 5 | 在单元格 G3 中，输入**A 和 D 的相关性**。在 H3 中输入 `=CORREL(A1:A100,D1:D100)`。 | 这将比较 A
    列与 D 列的数据。输入公式后，你将看到结果。是否如你所料？ |

    | 6 | 在单元格 G4 中，输入**A 和 E 的相关性**。在 H4 中输入 `=CORREL(A1:A100,E1:E100)`。 | 这将比较 A
    列与 E 列的数据。刷新随机数，看看相关性得分如何随之变化。 |

    | 7 | 在单元格 G5 中，输入**E 和 F 的相关性**。在 H5 中输入 `=CORREL(E1:E100,F1:F100)`。 | E 列和 F
    列都包含随机数——E 列与 A 列的相关性更强，还是与 F 列的相关性更强？当你刷新随机数时，这种情况会改变吗？ |

    | 8 | 尝试比较其他列，看看它们的相关性得分。 | 在电子表格中使用公式生成具有不同相关性得分的数字列是很有趣的。 |

    | 9 | 保存并关闭。 | 我们不会再使用这个电子表格了。 |


    从这些结果中，我们可以了解有关相关系数的一些知识：


    *   A 列和 B 列完全相同。它们的相关性得分是 `1`。

    *   A 列和 C 列完全相反：一个上升时，另一个就下降——它们基本上是彼此的镜像。但通过观察一个列的行为，可以完全预测另一个列的行为。它们的相关性得分是
    `-1`。


    **图 5-3** 展示了一个可能测得相关性为 `-1` 的实验。绿色球的高度和蓝色球的高度存在完美的负相关。


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig3_HTML.jpg](img/486852_1_En_5_Fig3_HTML.jpg)


    **图 5-3** 蓝色球上升时，绿色球下降。


    *   尽管 A 列和 D 列在开始时表现相似，但这种趋势并未持续整个数据集。它们的行为无关，知道其中一列在上升并不能帮助我们猜测另一列是在上升还是下降。相关性得分非常低（`-0.03`）。^(⁶)


    **图 5-4** 在折线图上显示了**A 列**和 **D 列**的值。


    ![../images/486852_1_En_5_Chapter/486852_1_En_5_Fig4_HTML.jpg](img/486852_1_En_5_Fig4_HTML.jpg)


    **图 5-4** 显示 A 列到 D 列数值的折线图。


    ## 5.6 理解相关系数/得分


    我们已经看到了相关性为 `1`、`-1` 以及接近 `0` 的含义，但我们应该如何看待两组数据的相关性为 `0.4`、`-0.5` 或 `0.78` 呢？虽然没有硬性规定，并且具体情况始终是一个影响因素，但在严格控制实验之外，可以使用以下指南来解释相关性得分：


    *   当两组数据的相关性为 `0.7` 或更高（或 `-0.7` 或更低）时，可以安全地将其描述为**强**相关。高于 `0.9` 则属于非常强。如果在我们的数据科学实验中看到如此高的得分，我们会非常有兴趣去理解所测量事物之间的潜在关系。

    *   得分在 `0.4` 到 `0.7` 之间（或 `-0.4` 到 `-0.7` 之间）意味着数据集之间存在相关性——有一些证据表明存在关系。这可能是有趣的，我们可能会更深入地研究这个问题，但前提是我们已经研究了所有强相关的情况。

    *   得分在 `0.2` 到 `0.4` 之间（或 `-0.2` 到 `-0.4` 之间）意味着数据集之间存在**中等**相关——有一些证据表明存在可能值得关注的弱关系。

    *   低于 `0.2`（或 `-0.2`）表明数据集之间没有真正的关系。


    相关性不一定要强才能成为有用的结果：排除数据集之间的相关性可能是一个实验的目标。例如，你的实验可能旨在证明身高和发色没有关联。接近零的相关性得分将有助于证明这一点。


    ## 5.7 计算天气数据的相关性得分


    现在，计算温度与压力数据之间相关性强度的过程相当简单，详见表 5-3。


    **表 5-3** 计算温度与压力数据的相关系数


    | 步骤 | 操作说明 | 备注 |

    | --- | --- | --- |

    | 1 | 在你的电子表格程序中打开第 4 章的 CSV 文件。 | 它应该导入为 2 列，并带有标题行。检查数据是否已正确导入；如果没有，请重试或搜索快速修复方法。
    |

    | 2 | 在 D1 中输入：**相关性得分 =**。在 E1 中输入：`=CORREL(A1:A42,B1:B42)`。 | 根据数据行数调整公式。记下结果。
    |

    | 3 | 保存文件。 | 我们稍后会用到它。 |


    我们在 **C1** 中输入的公式应返回一个介于 `-1` 和 `1` 之间的数字：这是衡量你在实验中记录的温度和压力读数之间相关程度的指标。无论你得到什么分数，都回答了我们在实验中提出的问题^(⁷)：温度和压力之间是否存在相关性？使用**第
    5.5 节**中的指南来唯一地回答这个问题。


    在我们的实验中，我们能够收集的数据量是有限的，这意味着我们只观察了温度和压力。如果手头有更多数据，相关性得分分析可以有一些很好的应用：


    *   我们在第 1 章中看到，与天气相关的可测量数据点有很多——多达几十个。多年来，气候科学家分析了这些数据并测量了它们之间的相关性。这有助于建立起关于天气的知识体系，该体系可用于（除其他外）进行预测。

    *   医学科学建立在不起眼的相关性之上。如果一项新程序与患者的预期寿命之间存在强相关性，我们可能会说已经找到了“治疗方法”。

    *   想象一下，能够测量关于你自己的 100 项事物，然后找出与你的幸福感最相关的 5 项。'
- fmt: '# Using Other Analysis Functions


    There is a lot more to data analysis than just looking for correlations, and most
    spreadsheet programs provide a broad range of functions you can use.


    Complete the exercise in **Table** [**5-4**](#486852_1_En_5_Chapter.xhtml#Tab4)
    to answer these questions:


    **Table 5-4** Using key statistical functions in a spreadsheet


    | Step | What to do | Notes |

    | --- | --- | --- |

    | 1 | Open the file from **Table** [**5-3**](#486852_1_En_5_Chapter.xhtml#Tab3)
    in your spreadsheet program. | We are going to find out some more information
    about our temperature and pressure data. |

    | 2 | Type in the following in the cells indicated:`D2`: Maximum pressure =`D3`:
    Minimum pressure =`D4`: Range of pressure =`D5`: Average pressure =`D6`: Modal
    pressure =`D7`: Maximum temperature =`D8`: Minimum temperature =`D9`: Range of
    temperature =`D10`: Average temperature =`D11`: Modal temperature = | These are
    labels: we type them in to help us keep track of things. We will type in formulae
    next to them, corresponding to the labels. |

    | 3 | Type in the following:`E2`: `=MAX(B1:B42)``E7`: `=MAX(A1:A42)` | Find the
    maximum temperature and pressure. |

    | 4 | Type in the following:`E3`: `=MIN(B1:B42)``E8`: `=MIN(A1:A42)` | Find the
    minimum temperature and pressure. |

    | 5 | Type in the following:`E4`: `=D2-D3``E9`: `=D7-D8` | Subtract the minimum
    from the maximum to give you the range. |

    | 6 | Type in the following:`E3`: `=AVERAGE(B1:B42)``E8`: `=AVERAGE(A1:A42)` |
    Find the average temperature and pressure. |

    | 7 | Type in the following:`E3`: `=MODE(B1:B42)``E8`: `=MODE(A1:A42)` | Find
    the modal temperature and pressure. This is the most common value – the value
    that is repeated the most times. |

