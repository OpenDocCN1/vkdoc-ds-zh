- fmt: '## 3.8 Experimental Design


    We have all the background information needed to design our experiment and we
    have a digital tool to collect our data. The process we will follow is outlined
    in **Table** [**3-5**](#486852_1_En_3_Chapter.xhtml#Tab5).


    **Table 3-5** Details for Exercise 3-1


    | Exercise 3-1 | How do the combined effects of temperature, humidity, and atmospheric
    pressure impact on my perception of the weather |

    | --- | --- |

    | Summary | Keep a log of weather data using **Table** [**3-1**](#486852_1_En_3_Chapter.xhtml#Par111)
    as a template. Data can be taken at any time of the day: aim for as many different
    weather scenarios as possible. Try to take around 15 measurements. This exercise
    is designed to introduce working with multiple variables and looking for patterns/correlations
    in the data. If the experiment goes as planned the participants may notice an
    intriguing correlation between temperature and pressure. |

    | Step-by-step process | 1. Participants should draw up a table to capture data.
    They will need to have access to a tool that measures temperature, humidity, and
    atmospheric pressure. 2. Participants should try to record data a few times each
    day, ideally across a variety of conditions. We want to collect a broad variety
    of data. Exercise the caution we learned in Chapters [1](#486852_1_En_1_Chapter.xhtml)
    and [2](#486852_1_En_2_Chapter.xhtml) when handling the data gathering tool. 3.
    When participants have collected 15 data points, that is adequate. 4. When the
    data is collected work through the points listed in **Section 3.9 Analysis**.
    |

    | What we will learn | • How temperature, humidity, and pressure impact on how
    we rate the weather. • An introduction to correlations. • Using visualizations
    in our analysis. • There is a correlation between temperature and pressure in
    nature^([⁴](#fn4)), and there is a chance that this will be apparent in your results.
    If so, the visualization technique we use should help us see this. |


    ## 3.9 Visualizing the Data We Collected


    We have collected a fair amount of data: the completed tables are quite dense
    with numbers. Most people find it easier to make sense of sets of data/numbers
    by converting them into images such as infographics or charts. These visualizations
    are summaries of the data, and the best of them can condense years of research
    and data gathering into simple representations that an ordinary person can understand
    at a glance. In this section, we’ll create a visualization on paper which we will
    analyze in the next section to search for answers to our original question.


    Begin by drawing an empty chart on a piece of paper, as shown in **Figure** [**3-10**](#486852_1_En_3_Chapter.xhtml#Fig10).


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig10_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig10_HTML.jpg)


    **Figure 3-10** Blank chart ready for data to be added


    Next copy the following table (**Table** [**3-6**](#486852_1_En_3_Chapter.xhtml#Tab6))
    onto a separate sheet of paper and fill in the maximum and minimum values for
    temperature, humidity, and pressure. We are also interested in the midpoint –
    the value halfway between the min and the max. Fill this in by doing the following:


    *   Find the range by subtracting the min from the max.

    *   Divide the range by 2.

    *   Add that value to the minimum to give the midpoint.


    > *So, if your minimum is 12 and your maximum is 20, the midpoint is 16.*

    > *For minimum 94 and maximum 101, the midpoint is 97.5.*


    **Table 3-6** Recording range (minimum max) weather values


    | Measure | Min | Max | Range (max – min) | Half range (range/2) | Midpoint (min
    + half range) |

    | --- | --- | --- | --- | --- | --- |

    | Temperature | 11 | 27 | 16 | 8 | 19 |

    | Humidity | 30 | 68 | 38 | 19 | 49 |

    | Pressure | 95 | 102 | 7 | 3.5 | 98.5 |


    We will use **Table** [**3-6**](#486852_1_En_3_Chapter.xhtml#Tab6) as a reference
    while we work through each row of our weather data, adding markers for temperature,
    humidity and pressure to the chart. We add a visually distinct marker for each
    variable (as shown in **Figure** [**3-11**](#486852_1_En_3_Chapter.xhtml#Fig11)).


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig11_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig11_HTML.jpg)


    **Figure 3-11** Our chart with the first row of data added


    We start with the first line of data, which is shown in **Table** [**3-7**](#486852_1_En_3_Chapter.xhtml#Tab7).


    **Table 3-7** My first data point – a miserable rainy summer day in England


    | Day | Time | Temp | Humidity | Pressure | Rating | Notes |

    | --- | --- | --- | --- | --- | --- | --- |

    | Mon | 10am | 16 | 55 | 97 | **2** | Fleece & rain |


    When we add this line of data to the chart, it looks like **Figure** [**3-11**](#486852_1_En_3_Chapter.xhtml#Fig11).


    In **Figure** [**3-11**](#486852_1_En_3_Chapter.xhtml#Fig11) it is clear to see
    which value is temperature, humidity, and pressure. You can use other markers
    if you like, just make sure that it is easy to see which marker applies to each
    measure.


    To place the markers on the chart, follow these steps:


    *   All three markers are added directly above the number 2. This is the RATING
    that I gave: it was cold for summer and raining heavily so I scored it a 2.

    *   My overall minimum temperature was 12 and my max was 27, so the midpoint is
    19.5. On that day the temperature was 15, which is above the minimum but below
    the midpoint. *I have added my “T” marker between the minimum and the midpoint,
    slightly closer to the minimum.*

    *   My minimum humidity was 30 and my max was 68 and the midpoint was 49. The
    value I recorded, 58, is about halfway between the midpoint and the maximum. *I
    have added my “H” marker between the midpoint and maximum values.*

    *   My minimum pressure was 95 and the max was 101. My reading, 96, is below the
    midpoint (98) and above the minimum, closer to the minimum. *I have added my “P”
    marker just above the minimum.*


    And so on: continue to use this approach and work through all the rows in the
    table adding markers to the chart. Some will overlap a bit, but that is OK – the
    idea is that we have clearly marked temperature, humidity, and pressure, so when
    we look at the chart, our eye can easily pick up what each mark represents. When
    completed your chart should look something like the one shown in **Figure** [**3-12**](#486852_1_En_3_Chapter.xhtml#Fig12).


    ![../images/486852_1_En_3_Chapter/486852_1_En_3_Fig12_HTML.jpg](images/486852_1_En_3_Chapter/486852_1_En_3_Fig12_HTML.jpg)


    **Figure 3-12** A completed visualization


    You may have noticed that we have been a bit imprecise in how we chart our data;
    with a bit more effort it could have been a lot more accurate. A visualization
    is just a summary of the data: it is a snapshot that is easier to understand than
    a table full of numbers. We have taken shortcuts to make it easier and quicker
    to draw the chart, but if our visualization is not adequate we can always try
    to create it with a higher degree of accuracy. Let’s see how we get on with it
    as it is.'
