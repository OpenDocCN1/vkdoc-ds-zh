- fmt: '### 12.8 Data Analysis


    It is normal at this stage of a data science experiment to begin to analyze the
    data we have collected. But hasn’t that already been done by the ML service when
    it used the temperature and humidity data to produce our prediction? Has our role
    been subverted: are we now redundant in the analysis phase?


    The answer is a resounding NO! As with most areas of the data science process,
    where automation occurs it frees us from tasks that are repetitive and laborious
    and allows us to use our not-artificial intelligence to focus on things that cannot
    be automated.


    In this instance our analytical gaze falls on the results: How intelligent or
    useful are they? What could we do with the results to extract value from them?
    Are there any ethical considerations? We should not just accept the results at
    face value: our role is to question them and check whether they are logical, believable,
    and useful. We should ask whether artificial intelligence is really driving the
    analysis, or is it just a sophisticated algorithm?


    Why not record the results from the ML service over an extended period and add
    your own data (whether it is raining or not). Then use the analysis techniques
    to see just how effective the predictions really are. How strongly do the predictions
    made by the ML service correlate with it actually raining?


    While these questions, and their answers, will have a bearing on how much faith
    we put in our weather prediction data, the efficacy of that prediction is only
    of secondary importance to what we have achieved in this chapter. Using one ML
    service means being able to use many, as we will discuss in **Chapter** [**13**](#486852_1_En_13_Chapter.xhtml).


    What may cause some readers concern is the absence of any obvious way in which
    the ML service can learn: if we are not providing feedback on the accuracy of
    the predictions, then how does the service know whether its predictions are accurate
    and how can it learn from its mistakes?


    The element that is missing from our IoT application is **training**. When an
    ML service is first set up, it undergoes a period of training, where a human operator
    provides information about the accuracy of the results it is generating.


    A simple example is an ML service that can distinguish between an image of a cat
    and a dog. When the ML service is initially set up, a person will provide it with
    images that are identified as `cat` or `dog`. The ML will extrapolate visual features
    that correlate with `cat` or `dog` and will begin to classify new images that
    are provided. As the ML begins to distinguish cats and dogs, the role of the person
    is to train the ML by reviewing the results and identifying correct/incorrect
    ones. The ML will continue to adapt until the person accepts the accuracy of the
    model and stops training it.


    We have not focused on training here: our goal in this book was to use an ML service
    for data science work, not to learn how build/set up a machine learning service
    or help to make it more accurate. Training an ML service is interesting and helps
    provide an intuitive understanding of how it works, but a consumer ML service
    does not need to include a training element.^([^(20)](#fn20)) When we, as consumers,
    use an email service, we do not expect to have to train it in how to send emails.
    In the same way, there is a demand for fully formed ML services (like the one
    we used) to be available to non-expert consumers. The process of building an ML
    service, including training it, is something that in the future a significant
    proportion of the people who use ML services will know very little about.


    ### 12.9 Summary


    We have almost come to the end of our data science journey and, in the process,
    we have looked at a broad range of technologies and techniques, all of them in
    some way useful to us in our data science endeavors.


    It is quite normal for developers to build up a personal library of modules/functions
    that they reuse extensively: their toolkit. As a programmer masters a new concept,
    they develop code fragments/functions that help them exploit it. Years later they
    might have forgotten aspects of the concept, but they will still know exactly
    how to use their functions.


    You should regard the different techniques that you have succeeded in implementing
    throughout this book as part of your toolkit; in building the edge device in this
    chapter we have done very little new (besides using a few new blocks in `MakeCode`):
    we combined stuff that we had already developed. The point made early on about
    the value of modularity and reusability has been implicitly proven by the ease
    with which we were able to build the required instrument.


    Your toolkit has now reached a point where it has critical mass: the potential
    to be used for a broad variety of novel and unexpected applications. In the next
    and final chapter we will look at ways in which the toolkit that we have built
    up throughout this book can be useful to you once you’ve put the book down.


    **Footnotes** [1](#486852_1_En_12_Chapter.xhtml#Fn1_source) [2](#486852_1_En_12_Chapter.xhtml#Fn2_source)
    [3](#486852_1_En_12_Chapter.xhtml#Fn3_source)


    # 13. Consolidating our Learnings


    In this, the final chapter, we will review what we have covered in this book and
    look at how the skills we’ve learned can be used in different contexts. With the
    journey all but over, what does the destination look like and where might we go
    from here? What else can we use our data science toolkit for?


    ### 13.1 Am I a Data Scientist?


    Congratulations on making it this far. If you’ve followed the chapters, worked
    through the examples and everything has made sense, then you have a solid foundation
    in data science and the ability to apply it in real-world situations.


    Of course, just like studying the basics of biology does not make one a doctor,
    so having a solid foundation in data science does not make one a data scientist.
    The information and techniques outlined in this book are a stepping-stone: useful
    in and of themselves and potentially the first step toward becoming a professional
    data scientist. But what is a `professional data scientist`?


    Doctors, nurses, architects, plumbers: disciplines like these require accreditation
    before the title can be rightfully used. That involves studying a prescribed body
    of knowledge and passing through some or other qualification process. There is
    no universally accepted data scientist accreditation, no governing body, and no
    final exam: anyone can call themselves a data scientist.


    As to the question of whether you are a data scientist: in your job or day-to-day
    life do you work with data, process and analyze that data, interpret it and produce
    actionable output? If so, then maybe you are.'
