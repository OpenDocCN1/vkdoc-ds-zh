    \n    Figure 11-18\n\n    “When a http request is received” trigger details\n\n\
    *   The following is the full listing of the **Schema** that you can directly\
    \ copy in the **Request Body JSON**^([^(17)](#fn17)) **Schema** text box:\n\n\
    ```\n{\n\"properties\":\n{    \"humidity\":\n{    \"type\": \"integer\"\n},\n\"\
    temperature\":\n{    \"type\": \"integer\"\n}\n},\n\"type\": \"object\"\n}\n```\n\
    \n### Step 2: Passing Data into the ML Service\n\nThe next step in the workflow\
    \ is to pass the temperature and humidity values to the Azure ML web service we\
    \ set up in **Section 11.2**.\n\n| **Method:** | POST |\n| **URI:** | The Request\
    \ URI copied from the “Request Response API Documentation for Weather prediction\
    \ model [Predictive Exp.]”. – See Section 11.5. |\n| **Headers:** | Accept | application/json\
    \ |\n| Authorization | The API Key copied from the “Request Response API Documentation\
    \ for Weather prediction model [Predictive Exp.]”. – See Section 11.5.Note Make\
    \ sure to add a space between **Bearer** and the **API key**. |\n| Content-Type\
    \ | application/json |\n| **Queries:** | Keep it as blank |\n| **BODY:** | {   \"\
    GlobalParameters\": {},   \"Inputs\": {       \"input1\": {           \"ColumnNames\"\
    : [               \"temperature\",               \"humidity\"           ],           \"\
    Values\": [               [                   \"value\",                   \"\
    value\"               ]           ]       }   }} |\n| **Cookie:** | Keep it as\
    \ blank |\n\n*   In the designer view click **+ New step** (**Figure** [**11-19**](#486852_1_En_11_Chapter.xhtml#Fig19)).\n\
    \n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig19_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig19_HTML.jpg)\n\
    \n    Figure 11-19\n\n    Adding a new step\n\n*   In the search box type **HTTP**.\
    \ From the results select **HTTP** actions group (**Figure** [**11-20**](#486852_1_En_11_Chapter.xhtml#Fig20)).\n\
    \n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig20_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig20_HTML.jpg)\n\
    \n    Figure 11-20\n\n    Searching the “HTTP” actions group\n\n*   This will\
    \ expand to a few actions. From the **Actions** list , select **HTTP** action\
    \ (**Figure** [**11-21**](#486852_1_En_11_Chapter.xhtml#Fig21)).\n\n    ![../images/486852_1_En_11_Chapter/486852_1_En_11_Fig21_HTML.jpg](images/486852_1_En_11_Chapter/486852_1_En_11_Fig21_HTML.jpg)\n\
