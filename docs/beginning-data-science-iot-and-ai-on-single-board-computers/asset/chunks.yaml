- fmt: '# Replicating the Weather Station Experiment with File Storage


    We now have all the information and techniques we need to set up a weather station
    that will record 24 hours of data. We just need to choose the interval at which
    to record data, and our understanding of the capacity of the `micro:bit` comes
    in useful:


    - We expect to be able to take 50 readings.

    - In a 24-hour period, there are 86400 seconds.

    - We will take a reading every 1728 seconds, which is every 28.5 minutes.


    The code is almost identical to the code we wrote to test the capacity of the
    file storage size in **Section 4.7** (**Table** [**4-8**](#486852_1_En_4_Chapter.xhtml#Tab8)).
    The differences are highlighted in the following code listing.


    The main difference is that in the code we wrote previously we did not want to
    wait between writing to the file; now we need to add in a long delay between readings.
    We have also added a simple feature to the code to prevent data capturing starting
    automatically. Now your weather station starts to capture data *ONLY* if you press
    button A on the `micro:bit`.


    The full code is listed as follows and available on the resource website:


    ```

    from microbit import *

    from SW01 import SW01

    import os

    import sys

    SW01 = SW01()

    d = 0

    try:

    d = os.size("we.csv")

    except:

    pass

    if (d > 0):

    display.show("*")

    sys.exit()

    bp = False

    while True:

    if button_a.was_pressed():

    a = open("we.csv", "w")

    bp = True

    if (bp == True):

    try:

    with open("we.csv") as a:

    cont = a.read()

    cont = cont + str(SW01.getTempC()) + "," + str(SW01.getHumidity()) + "\n"

    except:

    pass

    display.show(".")

    with open("we.csv", ''w'') as b:

    b.write(cont)

    sleep(1440000)    # Every 28.5 minutes

    ```


    When this code runs a file is created on the `micro:bit`. Every 28.5 minutes the
    weather sensor data is sampled and the values are saved in the file. If the memory
    buffer or storage is full the program will stop working.


    The following steps explain how to use the weather station as a portable tool
    to capture weather data in a remote location:


    1.  Connect the `micro:bit` to your computer and flash the code onto it.

    2.  Remove the `micro:bit` from the computer and connect the portable battery
    power.

    3.  Place the `micro:bit` in the location that you want to capture weather data.

    4.  Press the button A to start capturing.

    5.  When the `micro:bit` stops (after storage gets full), an LED on the 5x5 matrix
    turns on.

    6.  Connect the `micro:bit` to a computer using the micro USB cable and extract
    the file as explained earlier.


    **Note**


    This code is designed to be as simple as possible. It can be improved in a number
    of ways, such as adding more error handling and providing feedback on the `micro:bit`
    LEDs as to the state of the program.


    # Addressing Memory Limitations


    Knowing the limitations of the `micro:bit` file storage allows us to build our
    experiment accordingly. There are strategies we can employ that will ensure that
    we make the very best of the space available:


    - Capture only the data that is needed. If you start an experiment at 1 pm and
    take a sensor reading every 5 minutes, you don’t need to record the time whenever
    the sensor is read.

    - You could try writing several files, perhaps write 40 records to one file and
    then start another before any errors occur.

    - Try writing temperature data to one file and pressure data to another.

    - Store the data on an SD card. It can hold more data than the `micro:bit` and
    the data on the SD card will not erase when you flash a new program to the `micro:bit`.

    - Move the data from the `micro:bit` to a computer more frequently – our plan
    earlier involved removing the data from the `micro:bit` every 24 hours, but what
    if we could transmit the data wirelessly from the `micro:bit` as it’s read – then
    storage capacity of the `micro:bit` would not limit us at all.


    There are other ways to optimize the `micro:bit` persistent storage to store more
    data points.


    - Use a short name for the sensor data file (e.g., use `we.csv` instead of `weather.csv`).

    - Avoid using functions for displaying text and images on the 5X5 LED matrix (e.g.,
    `display.scroll()` and `display.show()`).

    - Avoid using additional libraries (e.g., libraries for OLED display).


    # Expanding Data Storage Capacity


    We undertake analysis on the 50-point data set in the next chapter, and that will
    be more than enough data for now. But it really isn’t much data at all: there
    are 86,400 seconds in a day, so why should we settle for only 50 data points?


    One solution is to look to `micro:bit` add-ons to see if there are any that offer
    extended memory options. There are a few products available: SparkFun and XinaBox
    offer peripherals that are designed to expand the data logging capabilities of
    the `micro:bit` by recording data to a microSD card. If you have an XinaBox IM01
    `micro:bit` bridge, you will notice a microSD card slot on the back.


    # Summary


    In this chapter we learned how to use the `micro:bit` file system to store data
    as it is recorded and retrieve it later, removing the need for human involvement
    in the collection process. We recorded a set of weather data over a 24-hour period
    and that data is stored on a file, which we have transferred onto a laptop/computer.


    We are now set to use the data we have collected in this chapter for some more
    detailed analysis, which is the focus of **Chapter** [**5**](#486852_1_En_5_Chapter.xhtml).


    # Introduction to Data Analysis


    From **Chapter** [**4**](#486852_1_En_4_Chapter.xhtml) we have inherited a table
    of data. Our objective is to analyze the relationship between the temperature
    and pressure data we collected and see if there are similarities between these
    measures and, if so, are they meaningful? How can we measure the correlation?


    In this chapter we will investigate how to use widely available software to answer
    this question, in the process unlocking a rich and easy-to-use data analysis tool
    that most computer users can access. Data science really is at your fingertips
    with the modern spreadsheet program, and this chapter will show you how to utilize
    these gems of technology.


    ## Expanding Our Analysis Tools


    To look at the temperature and pressure data from **Chapter** [**4**](#486852_1_En_4_Chapter.xhtml)**,**
    we could use a similar approach to the one we used in **Chapter** [**3**](#486852_1_En_3_Chapter.xhtml):
    hand scribing a visualization. It would take a lot longer now, depending on how
    much data you collected, but it is possible.


    This does not scale well though – what happens when we collect weather data for
    a whole month, or we find a way to gather (say) 10,000 data points? We will reach
    the stage where looking through a table to see the range, or hand drawing a chart,
    is no longer a task that a human being can realistically undertake.


    Just as we used persistent memory in **Chapter** [**4**](#486852_1_En_4_Chapter.xhtml)
    to reduce the role that humans need to play in the data collection process, so
    too will we use digital tools to assist us in our analysis.'
