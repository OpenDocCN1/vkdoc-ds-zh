  raw: '## 10.3 ML/AI and Data Science


    The field of AI is vast and complicated; we can barely hope to scratch the surface
    in a single chapter. But scratching the surface is all we need to be able to use
    AI in our data science work – in the same way that we can drive a car without
    building it from scratch, so we can use AI services in our data science endeavors
    without knowing how to build an AI model ourselves.


    There are a large range of AI services that are available for public use, and
    many of those are transactional: data is passed into the service, some activity
    is undertaken using the data, and some data is returned. It’s quite mundane really.


    Using a service requires no real knowledge of what actually goes on within the
    service: how it manipulates and transforms our data is a “black box.” Nevertheless,
    as was the case with sensors, to use these services effectively a basic understanding
    of what they do with our data is ideal. In the next section we undertake an exercise
    that will help us understand how an ML service operates.


    There is a lot of hype about what AI is capable of and what the future holds for
    it. But make no mistake, the cleverest AI does not have a patch on you as far
    as being able to undertake novel and intuitive cognitive leaps. The edge that
    AI has over us resides in its ability to crunch numbers: to work with mind-boggling
    huge sets of data and to perform a staggering volume of analysis on that data.


    AI is a very powerful tool for sophisticated data science applications, but without
    a human being somewhere in the process an AI is little more than an infernal machine
    – a robot dog forever chasing its own tail. AI is like the chef, using all manner
    of ingredients to serve its human masters with perfectly prepared meals, but the
    chef is unable to taste its own creations. Ultimately it is humans who will look
    at any facts/conclusions generated by an AI and will make the most important judgment:
    is this interesting?


    One of the pivotal moments for AI in the twentieth century was when IBM’s Deep
    Blue supercomputer (Figure [10-2](#486852_1_En_10_Chapter.xhtml#Fig2)) beat grandmaster
    and world number 1 Gary Kasparov at chess, in May 1997\. The computer won 3.5/2.5
    in a six game series, and for many this felt like the beginning of the end of
    human intellectual dominance. Forevermore would computers be “better” than humans
    at chess – what next?


    But there is more to the story: Kasparov put forward a strong case arguing that
    something untoward occurred (he used the term “cheating”). He presented a few
    arguments in support; the most interesting was one particular move that Deep Blue
    made that Kasparov was adamant an AI would not be capable of formulating. Deep
    Blue had several human operators who worked on it while the game was being played,
    so the means to interfere existed. Fuel was given to Kasparov’s claims when IBM
    refused his demands for a rematch and dismantled Deep Blue. Whatever the truth
    is, this battle between human and AI was big news and the success of Deep Blue
    signaled a new era: AI had arrived.


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig2_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig2_HTML.jpg)


    Figure 10-2


    IBM’s Deep Blue, at the Computer History Museum. [https://​commons.​m.​wikimedia.​org/​wiki/​File:​Deep_​Blue.​jpg#mw-jump-to-license](http://commons.m.wikimedia.org/wiki/File:Deep_Blue.jpg%2523mw-jump-to-license)


    ## 10.4 Thinking Like a Machine


    It is often said that the best way to understand someone is to walk a mile in
    their shoes. By extension, to understand ML it makes sense to perform some of
    the sorts of functions that a machine learning service undertakes.


    We are going to build an experiment that requires us to go through a number of
    steps in the data analysis process. The experiment is designed to investigate
    a target behavior and see if there are any correlations with a set of environmental
    data that we will capture.


    The real point of the experiment is not the results per se, but the style of analysis
    they will allow us to undertake. A lot of what we do during the experiment can
    be done by an AI, and quite a bit can’t. By considering these side-by-side we
    will gain insights into what AI brings to the table.


    Despite this, the experiment we suggest does have the potential to yield interesting
    data too. The key is choosing the right target behavior:


    What is it that makes you decide to get up and make a drink? Or lean back in your
    chair and stretch? Or scratch the back of your head? Machines don’t really display
    comparable behavioral traits, or “quirks”.


    Are these sometimes random, sometimes pointless, and sometimes even automatic
    actions evidence of the elusive intelligence we seek? Or is it possible that some
    environmental stimulus triggers these responses in you?


    Pick a target behavior carefully and strap in: the experiment could reveal insights
    into the age-old dilemma between fate and free will (spoiler: it probably won’t).


    ## 10.5 Experimental Design


    **Table** [**10-1**](#486852_1_En_10_Chapter.xhtml#Tab1) outlines the activities
    we will undertake to investigate the impact of environmental conditions on a target
    behavior.


    Table 10-1


    Investigating factors that trigger a target behavior


    | Exercise 10.1 | Do environmental factors trigger a target behavior? |

    | --- | --- |

    | Summary | We will record environmental conditions that are present when a target
    behavior is exhibited. We will then look at these environmental measures and see
    if there is a correlation with the target behavior. |

    | Step-by-step process |     1.    Decide on a target behavior to investigate.    2.    Build
    the data gathering instrument described in the Hardware section and flash on the
    appropriate code.    3.    Find a suitable location for the data gathering instrument.    4.    Place
    the instrument in the chosen location and power it up.    5.    Leave the device
    running. When the target behavior is displayed, click B on the micro:bit.    6.    Once
    you have 6 instances of the behavior, extract the data and load it onto a laptop/computer.    7.    Use
    software on your laptop/computer to undertake the analysis outlined in the Analysis
    section. |

    | What we will learn | •    Is there evidence that any of the environmental factors
    might play a role in triggering the target behavior?•    The value of an AI service
    might add to an experiment of this nature. |


    The experiment has two distinct steps:


    1.  The data collection phase


    2.  The data analysis phase


    The target behavior I used is **the impetus to make a cup of coffee**, which I
    feel two to three times every day while working at my desk. There is no time-based
    pattern: I don’t have a cup at a given time every day or at specific intervals.
    Instead, I find myself drifting toward the kitchen, often without having made
    a conscious decision to actually make another cup. For me this is a very suitable
    example, but you will need to find one that is meaningful to you.'
  trans: "\n### 10.3 机器学习/人工智能与数据科学\n\n人工智能领域博大精深，仅用一章的篇幅我们几乎不可能触及皮毛。但浅尝辄止足以让我们在数据科学工作中运用\
    \ AI——就像我们不必从零造车就能驾驶汽车一样，我们同样可以在数据科学事业中利用 AI 服务，而无需亲自构建 AI 模型。\n\n目前有大量可供公众使用的\
    \ AI 服务，其中许多是事务性的：将数据传入服务，利用数据执行某些操作，然后返回一些数据。这其实相当平凡。\n\n使用某项服务并不需要真正了解其内部运作机制：它如何处理和转换我们的数据就像\"\
    黑箱\"一样。不过，正如传感器的案例所示，为了有效使用这些服务，对它们处理数据的方式有个基本了解是理想的。在下一节中，我们将通过一个练习来帮助理解机器学习服务的运作原理。\n\
    \n关于 AI 的能力及其未来前景，存在大量炒作。但请明确一点，在实现新颖且直觉性的认知跨越方面，最聪明的 AI 也无法与你相提并论。AI 相对于我们的优势在于其处理数据的能力：处理令人难以置信的庞大数据集，并对其进行海量分析。\n\
    \n对于复杂的数据科学应用来说，AI 是一个非常强大的工具，但如果在整个过程中没有人类的参与，AI 不过是一台疯狂的机器——一只永远追逐自己尾巴的机器狗。AI\
    \ 就像一位厨师，使用各种食材为人类主人准备完美的餐食，但这厨师却无法品尝自己的作品。最终，还是由人类来审视 AI 生成的任何事实/结论，并做出最重要的判断：这有趣吗？\n\
    \n20 世纪 AI 的转折点之一，是 1997 年 5 月 IBM 的深蓝超级计算机（图 10-2）在国际象棋中击败了特级大师、世界排名第一的加里·卡斯帕罗夫。这台计算机在六局系列赛中以\
    \ 3.5 比 2.5 获胜，对很多人来说，这感觉像是人类智力优势终结的开始。从此以后，计算机在国际象棋上将永远\"优于\"人类——下一个领域会是什么？\n\
    \n但故事不止于此：卡斯帕罗夫提出了有力论据，认为发生了不正当行为（他用词是\"作弊\"）。他提出了一些支持论点；最有趣的是深蓝走出的某一步棋，卡斯帕罗夫坚信\
    \ AI 不可能构思出这样的棋步。深蓝在比赛进行时有若干人类操作员在维护，因此存在干预手段。当 IBM 拒绝卡斯帕罗夫重赛的要求并拆解深蓝时，卡斯帕罗夫的说法得到了更多证据支持。无论真相如何，这场人机大战都是重大新闻，深蓝的成功预示着一个新时代的到来：AI\
    \ 已经来临。\n\n![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig2_HTML.jpg](img/486852_1_En_10_Fig2_HTML.jpg)\n\
    \n**图 10-2**  \nIBM 的深蓝，摄于计算机历史博物馆。[`commons.m.wikimedia.org/wiki/File:Deep_Blue.jpg#mw-jump-to-license`](http://commons.m.wikimedia.org/wiki/File:Deep_Blue.jpg%2523mw-jump-to-license)\n\
    \n### 10.4 像机器一样思考\n\n常言道，理解一个人的最好方式是设身处地。推而广之，要理解机器学习，执行一些机器学习服务所承担的同类功能是合情合理的。\n\
    \n我们将构建一个实验，要求我们经历数据分析过程中的若干步骤。该实验旨在调查某个目标行为，并观察其与我们捕获的一组环境数据之间是否存在任何相关性。\n\n\
    实验的真正意义不在于结果本身，而在于我们将能够进行的分析方式。我们在实验过程中所做的很多事情可以由 AI 完成，也有相当一部分是 AI 做不到的。通过并排比较这两类情况，我们将深入了解\
    \ AI 能为我们带来什么。\n\n尽管如此，我们建议的这个实验确实也有潜力产生有趣的数据。关键在于选择正确的目标行为：\n\n是什么让你决定起身去倒杯饮料？或者往椅背上一靠伸个懒腰？或者挠挠后脑勺？机器并不会表现出类似的行为特征，或\"\
    怪癖\"。\n\n这些有时随机、有时无意义、有时甚至是自动化的行为，是否预示着我们所寻求的那种难以捉摸的智能？还是说，某些环境刺激引发了你的这些反应？\n\n\
    仔细选择一个目标行为，然后系好安全带：这个实验可能会揭示关于命运与自由意志这一古老难题的洞见（剧透：它大概不会）。\n\n### 10.5 实验设计\n\n\
    **表 10-1** 概述了我们将调查环境条件对目标行为影响的活动。\n\n**表 10-1**  \n调查触发目标行为的因素\n\n| 练习 10.1 |\
    \ 环境因素是否会触发目标行为？ |\n| --- | --- |\n| 摘要 | 我们将记录目标行为表现出时的环境条件。然后审视这些环境测量数据，观察其是否与目标行为存在相关性。\
    \ |\n| 分步流程 | 1. 决定要调查的目标行为。 2. 搭建\"硬件\"部分描述的数据采集工具，并烧录相应的代码。 3. 为数据采集工具寻找合适的位置。\
    \ 4. 将工具放置在选定位置并通电。 5. 让设备持续运行。当目标行为出现时，点击`micro:bit`上的`B`按钮。 6. 一旦记录到 6 次行为实例，提取数据并加载到笔记本电脑/计算机上。\
    \ 7. 使用笔记本电脑/计算机上的软件，按照\"分析\"部分所述进行数据分析。 |\n| 我们将学到什么 | • 是否有证据表明，某些环境因素可能在触发目标行为中起作用？\
    \ • AI 服务为这类实验可能增添的价值。 |\n\n实验包含两个不同的步骤：\n\n1. 数据收集阶段\n2. 数据分析阶段\n\n我使用的目标行为是冲泡咖啡的冲动，我在办公桌前工作时每天会感到两到三次。这种冲动没有时间规律：我并非每天固定时间或每隔特定时间喝一杯。相反，我会发现自己不知不觉地走向厨房，常常并没有有意识地决定再去泡一杯。对我来说，这是一个非常合适的例子，但你需要找到一个对你有意义的例子。\n"
- fmt: '# 10.6 Hardware Requirements


    The components that our digital instrument will need to include are shown in **Figure**
    [**10-3**](#486852_1_En_10_Chapter.xhtml#Fig3).


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig3_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig3_HTML.jpg)


    Figure 10-3 Core components of a data logger


    **Table** [**10-2**](#486852_1_En_10_Chapter.xhtml#Tab2) lists the specific hardware
    that we will use to build our data logger (or "target behavior monitoring instrument").


    Table 10-2 Hardware requirements for the data logger


    | What you need | What we use | Qty | Alternatives |

    | --- | --- | --- | --- |

    | A microprocessor and the means to flash code onto it | micro:bit with micro-B
    USB cable to connect to laptop/desktop | 1 | Raspberry Pi Arduino XinaBox CS11
    |

    | Power | The micro:bit battery holder | 1 | Seenov Inc Solar Battery |

    | A sensor to read weather data | XinaBox SW01 – advanced weather sensor | 1 |
    SparkFun Weatherbit |

    | Persistent memory | Xinabox IM01 micro:bit bridge with microSD card | 1 | microprocessor
    onboard memory |

    | The means to connect it all together | XinaBox IM01 micro:bit bridge | 1 | Breadboard,
    edge connector breakout, crocodile/alligator leads, and hookup wires |

    | xBus connectors | 1 |


    Before using the microSD card make sure it is formatted using the `FAT32` option.
    If you are unsure how to format an SD card, the process is explained on our **resource
    website**.


    When you have formatted it, insert the microSD card into the slot on the back
    of the `IM01`.


    The data logging tool described in the **What we use** column is shown in **Figure**
    [**10-4**](#486852_1_En_10_Chapter.xhtml#Fig4).


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig4_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig4_HTML.jpg)


    Figure 10-4 Assembled hardware for data logging


    ## 10.7 Software


    It is possible to write software for the micro:bit that will use the onboard memory
    to record the data we are looking at: the code and techniques described in **Chapter**
    [**4**](#486852_1_En_4_Chapter.xhtml) will serve this purpose. Memory limitations
    on the micro:bit will severely limit the amount of data we can collect though.


    Alternately a Raspberry Pi, Arduino, or CS11 core from XinaBox will be able to
    support the data logging app required. There are also other solutions that can
    be used to extract data from a micro:bit, such as the Excel Data Streamer. Whatever
    technique you use to capture sensor data will be adequate as long as you can tag
    the moment in time that the target behavior is observed.


    We use the combination of the micro:bit and the XinaBox IM01 bridge as it is perfect
    for our needs and very simple to use. The code we use will record a range of different
    sensor readings and will write these to a `CSV` file. This file is saved on the
    microSD card that is mounted on the `IM01` bridge.


    The coding element is not central to what we are looking at in this chapter: we
    are not introducing any new coding concepts, just employing concepts we’ve already
    covered (saving sensor data to persistent memory). The software required can be
    downloaded from our resource website, which also shows how to replicate the code
    in `MakeCode` using the `IM01`:


    Go to [`http://xib.one/XB`](http://xib.one/XB) and search for **Section 10.7**.


    ## 10.8 Using the Hardware


    When the hardware has been constructed, it can be powered up and used. **Figure**
    [**10-5**](#486852_1_En_10_Chapter.xhtml#Fig5) shows some snapshots of our hardware
    in action.


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig5_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig5_HTML.jpg)


    Figure 10-5 Using the data logger to record environmental conditions that are
    present when a target behavior is exhibited. (1) Powering up. (2) Pressing button
    A to start recording. (3) Data is recording. (4) Pressing the button B to tag
    the data. (5) Pressing button A again to stop/resume recording


    Click the `A` button on the micro:bit to start it recording and leave it somewhere
    within reach. Act as you normally would until you notice that you have exhibited
    the target behavior. At this point click the `B` button.


    When you click the `B` button, you "tag" the data: a record in the data file is
    labeled with a "1". This is illustrated in **Figure** [**10-6**](#486852_1_En_10_Chapter.xhtml#Fig6).


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig6_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig6_HTML.jpg)


    Figure 10-6 Tagged data collected in the experiment


    In **Figure** [**10-6**](#486852_1_En_10_Chapter.xhtml#Fig6) the header for column
    `H` (heading = **B**) is highlighted. Note that row `12` has the value **1** in
    this column (also highlighted). When you click the `B` button on your micro:bit,
    the value `1` is written into this column. This allows us to identify a point
    in time when the target behavior was observed.


    Continue to record and tag data until you have several instances of the target
    behavior. We recommend you record four to six instances before moving on to the
    analysis phase; more instances will yield better results but will require more
    work.'
