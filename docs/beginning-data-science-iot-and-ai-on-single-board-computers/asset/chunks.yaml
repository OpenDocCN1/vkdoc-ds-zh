    ## 4.4 将文件传输到计算机


    学习如何将数据写入文件的目的是为了让我们能够使用计算机上一些强大的分析工具。我们只需要先将文件从 `micro:bit` 移出，再移动到计算机上即可。表 4-5
    概述了具体的操作流程。


    **表 4-5** 从 Mu 中提取文件，然后打开并查看其内容


    | 步骤 | 描述 |

    | --- | --- |

    | 1 | 在 Mu 工具栏上，单击 **文件**。 |

    | 2 | 将之前创建的 `hello.txt` 文件从“**你的 micro:bit 上的文件**”拖放到“**你的计算机上的文件**”。该文件将从 `micro:bit`
    存储区复制到计算机的硬盘上，并会显示在“**来自你计算机的文件**”下。 |

    | 3 | 在“**来自你计算机的文件**”窗格中，右键单击 `hello.txt`，然后从快捷菜单中单击 **打开**。该文件将使用计算机上安装的用于处理文本文件的默认应用程序打开。
    |

    | 4 | 检查打开的文件，确认其中包含文字“Hello world!”。 |

    | 5 | 退出该应用程序。 |


    你也可以通过计算机上使用的任何**文件资源管理器**来访问该文件。该文件会保存在 Mu 默认保存文件的同一文件夹中。


    现在，我们已经将文件写入 `micro:bit` 内存，然后提取了该文件并在计算机上将其打开。我们已掌握了在实验中使用文件系统所需的一切知识。


    ## 4.5 硬件要求


    我们的数字仪器需要包含的组件如**图** **4-1** 所示。


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig1_HTML.jpg](img/486852_1_En_4_Fig1_HTML.jpg)


    **图 4-1** 用于读取天气数据并将其保存到文件的数字工具


    **表** **4-6** 列出了我们将用于构建气象站工具的具体硬件。


    **表 4-6** 气象站工具的硬件要求


    | 所需物品 | 我们使用的物品 | 数量 | 替代品 |

    | --- | --- | --- | --- |

    | 微处理器及向其烧录代码的手段 | 配备用于连接笔记本/台式机的 micro-B USB 线的 `micro:bit` | 1 | Raspberry Pi、Circuit
    Playground |

    | 电源 | `micro:bit` 电池座 | 1 | Seenov Inc 太阳能电池 |

    | 用于读取天气数据的传感器 | XinaBox SW01 – 高级气象传感器 | 1 | SparkFun Weatherbit |

    | 持久化存储器 | `micro:bit` 板载内存 | 1 | XinaBox IM01 `micro:bit` 桥接器（SD 卡） |

    | 用于连接所有组件的工具 | XinaBox IM01 `micro:bit` 桥接器 | 1 | 面包板、边缘连接器扩展板、鳄鱼夹导线以及跳线 |

    | xBus 连接器 | 1 |


    ## 4.6 将传感器数据存储到文件中


    当我们向文本文件写入数据时，我们可以写入任何我们想要的内容：任何数字或字母。我们可以将传感器数据以易于阅读的纯文本格式存储，如**图** **4-2** 所示。


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig2_HTML.jpg](img/486852_1_En_4_Fig2_HTML.jpg)


    **图 4-2** 包含传感器数据的文本文件截图


    采用这种方法时，文件的大量空间将被诸如“温度”、“湿度”、“气压”和“度”等词语占据：它们虽然有助于文件的可读性，但也占用了文件空间。我们写入文件的每个字符都会“消耗”一些空间，如果
    `micro:bit` 的内存很紧张（正如我们将会看到的，它确实很紧张），我们就需要剔除冗余数据。


    我们必须做出的最艰难的决定是不收集湿度数据：谁知道在分析阶段会出现什么有趣的观察结果呢？但正如你在接下来的章节中将看到的，`micro:bit` 上的内存量非常有限。我们的实验旨在分析气压和温度之间的关系，因此我们决定忽略湿度，因为它无助于我们回答实验的具体目标。`micro:bit`
    文件系统上的存储空间非常宝贵，我们节省的每个字符都必须物有所值。


    **图** **4-2** 中所示文件的核心问题是，它是我们为此实验“发明”的一种定制格式。这是一种不寻常的文件数据存储方式，并且在不识别我们创建格式的软件中打开它会很棘手。我们可以轻松读取，但计算机会很吃力。


    相反，我们将使用一种经过验证的文件格式：我们将创建一个**逗号分隔值**（或 **CSV**）**文件**。以这种格式写入数据可以确保我们能够在电子表格程序中打开该文件：数据将自动作为表格导入，这对我们的分析来说非常完美。


    CSV 文件必须遵循一些约定：


    - **文件**的每一行都是一条**记录**。行尾字符表示一条记录的结束。

    - 一条记录是多个**字段**的集合：对我们来说，这意味着每条记录将包括一个温度和气压值。

    - 文件中的每个值由逗号分隔。


    **图** **4-3** 显示了与**图** **4-2** 相同的文件，但数据记录是以 CSV 格式写入的。


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig3_HTML.jpg](img/486852_1_En_4_Fig3_HTML.jpg)


    **图 4-3** 以 CSV 格式记录的数据文件


    为了确保我们构建的文件符合 CSV 规范，在将每条记录写入文件时，我们将按照以下步骤进行：


    1. 在文件中开始新的一行（或一条“新记录”）。

    2. 将温度值写入文件。

    3. 向文件写入一个逗号。

    4. 将气压值写入文件。

    5. 写入一个行尾字符。


    如果我们遵循这个过程，当我们在文本编辑器中打开我们的 `csv` 文件时，它看起来会像**图** **4-4** 所示。


    ![../images/486852_1_En_4_Chapter/486852_1_En_4_Fig4_HTML.jpg](img/486852_1_En_4_Fig4_HTML.jpg)


    **图 4-4** 以 CSV 格式保存并在文本编辑器中查看的数据


    使用 `micro:bit` 文件系统给我们带来了另一个挑战。随着越来越多的数据被**写入**（或**追加**）到文件中，最终 `micro:bit` 将无法再向其中写入更多数据：会达到文件大小的上限。尽管
    `micro:bit` 有大约 **30 KB** 的内存保留用于文件存储，但它无法按照我们想要的方式写入那么大的文件。其他因素，例如 `micro:bit`
    的工作内存，也是限制因素。


    `micro:bit` 文件系统的工作方式是，当你向文件写入任何内容时，都会覆盖文件中已有的所有内容。这意味着当我们想要向文件追加更多数据时，我们必须将文件中已有的所有数据读入一个变量，然后将我们想要追加的额外数据添加到该变量中。然后，我们将包含新记录的整个文件内容重新写回文件。将数据写入文件时最常见的限制因素是
    `micro:bit` 将整个文件内容存储到单个变量中的能力。

