  trans: '

    # 8.7 构建节点


    我们将构建三个节点。每个节点所需的硬件非常简单：只需一个 micro:bit 和一个电源。我们将使用板载温度传感器、天线以及 5x5 LED 矩阵来显示“消息已发送”状态。**图**
    **8-4** 展示了我们的三个节点。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig4_HTML.jpg](img/486852_1_En_8_Fig4_HTML.jpg)


    **图 8-4** 三个 micro:bit 温度传感器节点


    我们需要编写的代码以自然语言形式在**图** **8-5** 中说明。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig5_HTML.jpg](img/486852_1_En_8_Fig5_HTML.jpg)


    **图 8-5** 传感器节点的自然语言代码


    **免代码选项**：您可以在我们的资源网站上找到本节所用代码的预编译版本。访问 [`http://xib.one/XB`](http://xib.one/XB)
    并搜索 **第 8.7 节**。


    **表** **8-1** 展示了如何将前面的自然语言代码转换为可编译并加载到节点中的 `MakeCode` 代码块。


    **表 8-1** 使用 MakeCode 代码块开发传感器节点代码


    | 步骤 | 描述 |

    | --- | --- |

    | 1 | 确保你的 MakeCode 项目包含 `Radio` 扩展。如果没有，请使用 `Extensions` 选项将其添加到项目中。![../images/486852_1_En_8_Chapter/486852_1_En_8_Figa_HTML.jpg](img/486852_1_En_8_Figa_HTML.jpg)
    |

    | 2 | 将 `radio set group` 代码块添加到 `on start` 代码块中。除非你需要不同的组 ID（有效范围：0-255），否则请使用默认的
    `group ID`。![../images/486852_1_En_8_Chapter/486852_1_En_8_Figb_HTML.jpg](img/486852_1_En_8_Figb_HTML.jpg)**注意** 所有节点使用相同的组
    ID。 |

    | 3 | 重复以下步骤。 |

    | 4 | 将 `radio send value` 代码块添加到 `forever` 代码块中。![../images/486852_1_En_8_Chapter/486852_1_En_8_Figc_HTML.jpg](img/486852_1_En_8_Figc_HTML.jpg)这将以名称-值对的形式发送数据：我们将发送
    `Node ID`（节点 ID）作为名称，温度作为值。 |

    | 5 | 在 `name` 框中输入 `Node ID`。为其他节点使用*不同*的 `Node IDs`。然后将 `temperature` 代码块添加到
    `value` 框中：![../images/486852_1_En_8_Chapter/486852_1_En_8_Figd_HTML.jpg](img/486852_1_En_8_Figd_HTML.jpg)
    |

    | 6 | 在 `radio send value` 代码块之后添加以下代码块：![../images/486852_1_En_8_Chapter/486852_1_En_8_Fige_HTML.jpg](img/486852_1_En_8_Fige_HTML.jpg)`show
    icon` 代码块用于在数据包发送后在 micro:bit 的 5x5 LED 矩阵上显示一个对勾符号。`pause` 代码块用于每 5 秒发送一次数据。
    |


    **图** **8-6** 展示了 micro:bit 传感器节点 1 的 `MakeCode` 代码块。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig6_HTML.jpg](img/486852_1_En_8_Fig6_HTML.jpg)


    **图 8-6** 传感器节点 1 的 MakeCode 代码块。它位于无线组 1 中，节点 ID 为 1


    现在编译代码并将其烧录到你的 micro:bit 上。将其标记为节点 1；然后修改其他节点的代码（只需修改 `radio send value` 代码块）并同样进行烧录。


    ## 8.8 构建服务器/收集器


    我们的服务器/收集器也将使用 micro:bit 和电源，但我们会添加一个 OLED 显示屏来查看数据（**图** **8-7**）。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig7_HTML.jpg](img/486852_1_En_8_Fig7_HTML.jpg)


    **图 8-7** 服务器/收集器


    代码需要以何种方式工作，在**图** **8-8** 中以自然语言形式进行了概要说明。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig8_HTML.jpg](img/486852_1_En_8_Fig8_HTML.jpg)


    **图 8-8** 收集器的自然语言代码


    **免代码选项**：我们的资源网站提供了适用于 1、2、3 和 4 个节点的服务器/收集器代码版本。访问 [`http://xib.one/XB`](http://xib.one/XB)
    并搜索 **第 8.10 节**。


    虽然自然语言代码相对简单，但将其转换为 `MakeCode` 代码块（或 `MicroPython`）对于经验不足的程序员来说将是一项艰巨的任务。我们实际上是在构建一个服务器，一个非常简单的服务器，但尽管如此，这仍然是一项重要的编程任务。


    完整的 `MakeCode` 代码块程序（包含好几页）在**图** **8-9** 中展示。如果您有兴趣了解自然语言代码的每一步是如何转换为代码块的，请查看配套网站。


    如果您对代码本身不太感兴趣，而更关心这些设备所能支持的数据科学应用，那么请问问自己以下问题：


    1.  您能否修改代码，使其适用于其他测量值，例如湿度或二氧化碳水平？

    2.  您能否修改代码以添加更多节点？

    3.  您能否向程序员描述您的需求，以便他们可以修改代码？


    如果您对问题 (3) 的回答是肯定的，那么您是否会编程其实并不重要。掌握出色的编程技能对于数据科学家来说是一项很好的本领，但即使没有这项技能，您仍然可以成为一名优秀的数据科学家。在后续章节中，我们将连接
    Wi-Fi、构建物联网应用，并与人工智能进行通信。在这些实例中，我们使用的代码都不会像以下代码那样复杂。非编程人员：请坚持下去！


    **图** **8-9** 展示了 micro:bit 收集器的 `MakeCode` 代码块。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig9a_HTML.jpg](img/486852_1_En_8_Fig9a_HTML.jpg)![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig9b_HTML.jpg](img/486852_1_En_8_Fig9b_HTML.jpg)![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig9c_HTML.jpg](img/486852_1_En_8_Fig9c_HTML.jpg)![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig9d_HTML.jpg](img/486852_1_En_8_Fig9d_HTML.jpg)


    **图 8-9** micro:bit 收集器的 MakeCode 代码块


    将代码烧录到收集器中，然后给它上电。确保节点也已上电。


    收集器将监听组 1 的频道，当它收到来自其程序中设定的监听节点的消息时，它会从该消息中提取温度数据并显示在屏幕上。当所有节点的数据都接收完毕后，收集器会在
    OLED 屏幕上显示平均温度（**图** **8-10**）。


    ![../images/486852_1_En_8_Chapter/486852_1_En_8_Fig10_HTML.jpg](img/486852_1_En_8_Fig10_HTML.jpg)


    **图 8-10** OLED 屏幕显示来自每个传感器节点的温度以及计算出的平均温度


    通过将节点放置在偏远位置来测试你的网络：它们能离收集器多远？“视线”对于通信范围有多重要？可以修改节点代码来发送其他类型的数据，我们在前面的章节中已经看到如何为
    micro:bit 添加传感器。你还可以在网络上添加哪些传感器来提供有用的数据？

    '
- fmt: '# 8.9 Summary


    The radio functionality can be used to create closed networks of micro:bits that
    are able to communicate with each other. The example we built earlier could be
    extended: up to ten micro:bits should work together on a network. With several
    nodes of multiple sensors reporting data to a server, you could monitor and control
    an office, classroom, exotic pet habitat, nuclear reactor or any area served by
    the range of the radio.


    But as long as these networks are closed we will not be able to harness the potential
    of IoT and our scope will be limited by the capabilities of the micro:bit. Radio
    provides functionality that can be harnessed in our data science endeavors, but
    until we can connect to the cloud and consume the services available there our
    toolkit is incomplete. In Chapter [9](#486852_1_En_9_Chapter.xhtml) we will add
    Wi-Fi to micro:bit and finally open a window into IoT.


    # 9. Using Wi-Fi to Connect to the Internet


    In Chapter [6](#486852_1_En_6_Chapter.xhtml) we saw that being able to hook up
    our experiments to the Internet has the potential to greatly enhance our data
    science toolkit. In Chapter [7](#486852_1_En_7_Chapter.xhtml) and Chapter [8](#486852_1_En_8_Chapter.xhtml)
    we looked to see if the functionality on board the micro:bit could connect us
    to the cloud, to give us access to the services available there. Although both
    BLE and the micro:bit radio provide some really useful wireless functionality,
    we are still no closer to connecting properly to the IoT than we were several
    chapters ago. It is time to look beyond the native functionality of the micro:bit.


    Connecting to the IoT is relatively simple these days and most commonly done using
    Wi-Fi. (12) In this chapter we will add Wi-Fi to our micro:bit weather station
    and connect it to the cloud.


    ## 9.1 Defining Our IoT Weather Station


    Just adding Wi-Fi to our micro:bit weather station is all well and good, but what
    does this actually mean: what is it that we are going to build? We need a much
    clearer idea of how we want the system to work:


    1. Our micro:bit weather station is not going to change much: we will record temperature,
    humidity, and pressure data. We will just output that data over Wi-Fi this time.

    2. We are going to connect the micro:bit weather station to an IoT platform.

    3. We will send the weather data to the IoT platform.

    4. When the data is in the platform we will have access to a number of tools/services.
    We will build a chart that shows the data in real time and compares it to historical
    data.


    As we saw in Chapter [6](#486852_1_En_6_Chapter.xhtml), once the data is in our
    IoT platform, we will have access to a range of tools that we can use in our data
    science undertakings. In Section 9.4 we will set up our IoT platform, but first
    we’ll sort out the hardware that we need.


    ## 9.2 Building Our Wi-Fi Weather Station


    In addition to the hardware we used in Chapter [8](#486852_1_En_8_Chapter.xhtml),
    we need to introduce a module that provides Wi-Fi connectivity. Figure [9-1](#486852_1_En_9_Chapter.xhtml#Fig1)
    shows the block diagram for a Wi-Fi-enabled digital weather station instrument.


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig1_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig1_HTML.jpg)


    *Figure 9-1 Components required for a Wi-Fi-enabled weather station tool*


    Table [9-1](#486852_1_En_9_Chapter.xhtml#Tab1) lists the specific hardware we
    used to build our micro:bit weather station edge device.


    *Table 9-1 Hardware suggestions for the micro:bit weather station edge device*


    | What you need | What we use | Qty | Alternatives |

    | --- | --- | --- | --- |

    | A microprocessor and the means to flash code onto it | micro:bit with a micro-B
    USB cable | 1 | Raspberry Pi / Circuit Playground |

    | Power | USB power bank through the XinaBox IM01 | 1 | XinaBox PB01 – dual AA
    battery power pack |

    | A sensor to read weather data | XinaBox SW01 weather sensor | 1 | SparkFun Weatherbit
    |

    | A Wi-Fi core | XinaBox CW01 Wi-Fi Core | 1 | SparkFun ESP32 Thing |

    | A screen to view data | Micro:bit 5x5 LED matrix | 1 | XinaBox OD01 – 64x128
    OLED display |

    | The means to connect it all together | XinaBox IM01 – micro:bit bridge | 1 |
    Breadboard, edge connector breakout, crocodile/alligator leads, and hookup wires
    |

    | xBus connectors | 2 | | |


    Figure [9-2](#486852_1_En_9_Chapter.xhtml#Fig2) shows what the micro:bit weather
    station edge device looks like when assembled.


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig2_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig2_HTML.jpg)


    *Figure 9-2 micro:bit weather station with Wi-Fi*


    ## 9.3 Updating Firmware


    **Firmware** is a computer program on a microprocessor that serves as its operating
    system. Code that we write (in MakeCode/MicroPython) and flash onto our micro:bits
    is a set of instructions that the firmware interprets: our programs tell the firmware
    what to do.


    The BBC micro:bit was first released almost 5 years ago and in that time it hasn’t
    really changed. Earlier versions of the micro:bit firmware do not support Wi-Fi:
    you may need to update yours, not just for this chapter but for the example in
    Chapter [11](#486852_1_En_11_Chapter.xhtml) too.


    It is good practice to ensure that your firmware is always up to date, so if you
    haven’t updated it recently we recommend that you do so before continuing. It
    is very easy: little more than flashing a file onto the micro:bit, and will ensure
    that all the latest releases and advanced functionality work properly on your
    micro:bit. You can find full instructions on our resource website, or on the Micro:bit
    Foundation’s website.


    Although we only use it for its Wi-Fi capabilities, the CW01 from XinaBox is also
    a microprocessor; it too has firmware loaded onto it. To use the CW01 with micro:bit,
    it is necessary to ensure it is running the correct firmware. Most readers will
    NOT need to update the firmware though; it all depends on where you got the CW01
    from:


    - If the CW01 was part of the XinaBox XK05 kit then it does NOT need to be updated.

    - If you bought the CW01 by itself, or it came with a different kit (e.g., the
    XK01), you will need to update it.


    Full instructions for updating the CW01 firmware are available on our resource
    website.


    > *Before proceeding please ensure that both the micro:bit and the CW01 are running
    suitable firmware.*'
