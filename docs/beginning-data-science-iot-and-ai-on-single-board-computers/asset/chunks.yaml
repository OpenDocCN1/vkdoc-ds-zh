  trans: '

    # 1.6 数据质量


    我们收集数据是为了使用，不言而喻，在其他条件相同的情况下，高质量的数据比低质量的数据更有用。GIGO：垃圾进，垃圾出。但是，是什么让一组数据比另一组数据“质量更高”呢？


    为了判断数据质量，我们关注其**有效性**和**可靠性**。


    数据的**有效性**指的是它衡量我们想要衡量的内容的程度。我们试图测量某个地点的温度，但实际上我们测量的是温度计周围的温度。说我们记录的温度读数适用于测量地点，这有效吗？


    **可靠**的数据是可以复制的。因此，如果几个人同时在同一地点测量温度，我们期望他们都得到相同的结果。如果出现这种情况，我们就说数据是可靠的。


    当我们知道两个数据点既**可靠**又**有效**时，我们就可以将它们与其他同样可靠和有效的数据进行比较，并对我们做出的任何观察抱有信心。所以，如果我在英国我的办公桌上测量温度为
    25 度，而一位宇航员在国际空间站（ISS）上测量温度为 23 度，那么我就可以相当确定我的办公桌比国际空间站更暖和。


    如果我们不控制无关变量，那么我们的数据就不那么有效和可靠。这是否意味着它毫无用处？在现实世界的实验中，并非所有无关变量都能被控制。为了进行现实世界的实验，数据科学家们想出了巧妙的技术，甚至能从低质量数据中提取有价值的见解。诀窍在于识别和理解那些影响我们数据的无关变量，然后在分析数据时对它们的影响进行修正。请看以下示例：


    可追溯到 19 世纪的温度记录被用来进行比较，以帮助提供无可辩驳的气候变化证据。多年来，测量设备已被更换，甚至可能改变或升级，而进行测量的地点要么完全改变，要么周围环境已大不相同。所有这些因素都可能对测量结果产生一些影响——它们就是无关变量，并且完全控制这些变量是不可能的。为了处理这种情况，数据科学家使用所谓的**误差范围**，这是对其数据**可靠性**的一种估计。因此，如果温度计读数为
    20 度，误差范围为 2，数据科学家就会明白实际温度很可能在 18 度到 22 度之间。


    我们已经讨论了如何使用温度计收集高质量数据，但在开展第一个实验之前，让我们快速了解一下如何捕获（或记录）这些数据。


    ## 1.7 数据捕获


    我们计划进行的实验需要记录多个不同的温度值。鉴于人类记忆的特性，每次读取时记下读数是有意义的。


    这个记录或写下数据读数的过程被称为**捕获**或**收集**数据。记录数据的方法有很多，但标准方法是使用**数据表**。


    你可能已经熟悉以表格形式呈现信息的概念：本书中我们已经使用过几个表格。**表** **1-3** 概述了数据表的关键特征。


    **表 1-3** 数据表的关键特征


    | 特征 | 描述 | 对或错 |

    | --- | --- | --- |

    | 1 | 表格由列和行组成。 | 对 |

    | 2 | 行与列交叉处，每个矩形称为一个单元格。本段文字就在一个单元格内。 | 对 |

    | 3 | 在数据科学中，我们通常在每个单元格中以数字形式写入数据。但我们也像这里一样，将文本放入表格中。 | 对 |

    | 4 | 通常表格有若干列，每列用于不同类型的数据，就像这个表格一样。 | 对 |

    | 5 | 表格通常行数多于列数。 | 对 |

    | 6 | 当你收集的数据越来越多时，你就在表格中不断增加行。只有当你开始收集新类型的数据时，你才添加列。 | 对 |

    | 7 | 当你有一些相关联的数据时，例如位置名称和该位置的温度，你应将它们添加到同一行。 | 对 |

    | 8 | 如果你知道如何使用表格，你就掌握了阅读本书所需的全部表格知识。 | 对 |


    对于上表，问自己两个问题：


    1.  **你能否理解信息的呈现方式？** 如果可以，说明你的表格知识足以继续本章的学习。


    2.  **你是否好奇第一列和第三列的作用？** 如果是，观察力不错——它们毫无用处——你的表格知识足以继续本章的学习。


    表格是一种难以解释但大多数人都会使用的东西。现在，我们只需要将数据捕获到表格中。在下一节的练习中，我们将使用一个包含三列的数据表：


    1.  **位置** – 在此列中写下位置的名称。


    2.  **温度** – 在此列中写下温度。


    3.  **备注** – 使用“备注”列写下可能与实验相关的观察结果。


    画一个表格来捕获数据。预留大约 12 行，并尝试选择多样化的位置——我们希望数据有一定的变化。**表** **1-4** 展示了它的样子。


    ***表 1-4.*** *练习 1-2 的空白数据捕获表*


    ![../images/486852_1_En_1_Chapter/486852_1_En_1_Figa_HTML.png](img/486852_1_En_1_Figa_HTML.png)


    使用表格时，在左列写下位置名称，然后在中间列写下该位置的温度。“备注”列用于记下可能对实验有价值的观察结果，某些位置可以留空。表 1-5 展示了一个填写完毕的表格可能的样子。


    **表 1-5** 练习 1-2 中填写完毕的表示例


    | 位置 | 温度 | 备注 |

    | --- | --- | --- |

    | 员工休息室 | 22.5 | 空调效果极佳，配有大型舒适沙发 |

    | 食堂 | 24 | 找不到平坦的木质表面放置温度计 |

    | 图书馆 | 20.5 | 有空调 |

    | 操场上的大树旁 | 16 | 当天多云 |

    | 史密斯女士的教室 | 22.5 | 教室朝向学校向阳的一侧 |

    | 科恩女士的教室 | 22 | |

    | 恩科莫先生的教室 | 21 | 教室里有三台风扇在吹 |

    '
- fmt: '# 1.8 Experimenting with Temperature


    In this section we undertake the activity of capturing temperature data in a number
    of locations and then, in the following section, we will analyze the data we capture.
    We will refer to the whole process as an experiment.


    This section outlines our experimental design, which is the set of instructions
    and guidelines we will follow to perform the experiment. We saw earlier that the
    validity and reliability of our data are important – having a clear and well-planned
    experimental design helps us to control some extraneous variables and gives us
    more reliable and valid data.


    We recommend you take temperature readings from a number of different locations,
    inside and outside. The ideal outcome is to have around a dozen readings and to
    ensure that there is a fair range in results.


    If you don’t have access to a range of locations, an alternative would be to take
    temperature readings from the same location at different times, or use a medical
    thermometer to measure the temperature of soil around different plants. You could
    even undertake this exercise with a different type of data – substitute temperature
    for UV light levels, CO2 or anything that you can measure and which you find interesting
    (`Table 1-6`).


    **Table 1-6 Outline for Exercise 1-2**


    | Exercise 1-2 | Comparing the temperature of different locations |

    | --- | --- |

    | Summary | The temperature at a number of different locations will be measured
    and recorded; then the data will be analyzed. We will analyze both the results
    and the quality of the experimental design of this activity. |

    | Duration | 30 mins |

    | Preparation | • Round up some thermometers – they don’t need to be perfect –
    discrepancies and data issues are OK. • Prepare a list of locations. Choose ones
    that are likely to have some variances in temperature – inside and outside if
    possible. • Draw a data table to use to capture the data. Write in the location
    names and add any notes that might be of value (e.g., identify extraneous variables).
    |

    | Step-by-step process | 1. Visit each location specified. 2. Read the thermometer
    using the guidelines specified in the following Additional Instructions. 3. The
    temperature is recorded in each location. 4. Go back to 1 and repeat until all
    locations have been measured. 5. Once all the data has been gathered, move on
    to Section 1.9 and work through the questions and topics listed there. |

    | Additional Instructions | When reading the thermometer, follow this process:
    • Find a flat, wooden surface that is out of direct sunlight and not right next
    to it. The location should be away from breezes and not in any corners. • Place
    the thermometer down on the flat surface with the scale clearly visible. • Step
    back and wait for 30 seconds. • After 30 seconds, read the temperature without
    touching or breathing on the thermometer. |

    | What we will learn | The data gathering process will be fun, but a bit tedious:
    human time is precious. This is a key driver toward digital tools, which we introduce
    in the next chapter. Participants will undertake an analysis of the data by working
    through the questions and topics listed in the next section – they will see how
    asking questions of the data can provide interesting and unique information. |


    ## 1.9 Analyzing Our Results


    We have a table of data collected with some care according to a plan we put together
    to ensure our data is as reliable and valid as possible. It probably isn’t perfect,
    but it is fair to say that most people would have a little more confidence in
    this data than they would if we had not put a plan in place.


    This table is a raw data set – freshly gathered and ready to be used in our analysis.
    Rather than try and define what analysis is, let’s just do some!


    We are going to look at our data set and see what information we can extract from
    it. What we will try to do is describe the data in English sentences that have
    some meaning: we are going to turn the table of data into snippets of conversation.
    For example:


    - “The hottest place in the school is…”

    - “If you want to cool down go and sit …”

    - “The data collection method was flawed in this way… ”


    Data analysis is part science, part art:


    - The science part includes tools and techniques that have been developed over
    many years, some of which we will look at later on in this book.

    - The art part is the inquisitive human mind thinking of interesting questions
    and looking at whether a data set contains insights that will help answer those
    questions.


    It is probably safe to say that the single most important element of data analysis
    is human curiosity.


    With the data set that we have just collected you should now ask, and try to answer,
    the questions listed below. Formulate the answers as statements, in plain English,
    that you might drop into a conversation, or in an email, or perhaps as a social
    media update. Listen out for anything that sounds interesting.


    We can’t really provide answers to these questions for you: imagine working through
    this book in Sri Lanka in high summer, or Iceland in the winter months, or in
    your local neighborhood. The answers are going to be different everywhere – you
    will be working on a totally unique data set and your conclusions will be original.


    The questions are grouped into categories.


    ### Analysis of Extremities


    With pretty much any set of data we can usually learn something by looking at
    the extreme values. Ask these sorts of questions:


    - Where was the hottest location?

    - Where was the coldest?

    - If they are different, why? What makes one location warmer or colder than the
    other?

    - What is the range of temperatures? How different is the hottest and the coldest
    locations? What can we infer from this?


    ### Analysis of Averages (Central Tendency)


    We will look at averages in more detail in Chapter 5. For now, ask:


    - What is the average temperature of the school/area you analyzed?

    - How useful is the average? How many locations were there where the temperature
    was equal to the average? What does it really tell us?

    - If we decide the average is useful, is it midway between the extremes or is
    it closer to one or the other? Either way, does this tell us anything?


    ### Random Insights


    Also look for insights in the data by asking questions such as:


    - Could you identify ways to cut down on heating/cooling? Are fans/heaters/air
    conditioners in the best locations.

    - Are there any problem locations that need attention? Is there a particular area
    that is not comfortable?

    - If there are several locations that are not comfortable, is there a single reason?

    - Does the temperature affect behavior? How would you investigate this?

    - Where would you go to eat an ice cream, and where would you go to eat soup?


    ### Analysis of Data Quality


    We should always question the quality of our data:


    - What factors in our experiment might impact on the reliability of the data?
    And which might impact on its validity? How does this change our answers?

    - Are the answers we have decided on in our analysis logical – do they make sense?
    Do we believe them?

    - Double check anything unusual! A lot of researchers will tell you that data
    that looks unusual is often interesting, but the first response to interesting
    data is to check for errors.

    - If your experiment included two or more groups, check how similar is the data
    across different groups? How can any differences be explained?

    - Do we think there is a margin of error in our results? If so, how much?'
