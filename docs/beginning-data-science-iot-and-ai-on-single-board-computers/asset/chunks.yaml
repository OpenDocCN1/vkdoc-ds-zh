  trans: "\n# 9.7 在物联网平台中可视化数据\n\n本节我们将告诉物联网平台如何处理数据以及如何输出/显示数据。我们将构建一个可视化图表：折线图。\n\
    \n`IBM Watson` 允许我们设置虚拟“看板”，你可以在看板上添加各种不同的内容。之后，当一切运行顺畅时，你将能够通过浏览器查看这些看板（称为**看板**）。\n\
    \n添加到看板上的内容称为**卡片**。卡片是预定义的项目（例如，折线图），用于展示物联网平台中定义的设备数据或相关信息。你可以在一个看板上添加多张卡片。在本节中，我们将先在\
    \ `Watson 物联网仪表板` 中创建一个新的**看板**，然后向其添加一张**卡片**。\n\n## 按照以下步骤添加新看板：\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig17_HTML.jpg](img/486852_1_En_9_Fig17_HTML.jpg)\n\
    \n**图 9-17** 新创建的看板显示在“你的看板”下\n\n*   点击左侧导航栏中的**看板**。\n*   点击 **+ 创建新看板**。\n*\
    \   在**创建新看板**窗口中，在**信息**选项卡中提供以下配置详情（**图** **9-16**）。然后点击**下一步**按钮。\n    *  \
    \ **看板名称**：`天气`\n    *   **描述**：`显示来自各种气象传感器的数据。`\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig16_HTML.jpg](img/486852_1_En_9_Fig16_HTML.jpg)\n\
    \n**图 9-16** 创建新仪表板：信息选项卡\n\n*   在**成员**选项卡中不要提供任何信息，只需点击**提交**。\n*   此时**看板**将被创建，并加载“你的看板”页面（**图**\
    \ **9-17**）。\n\n现在我们有了一个空的看板，可以添加卡片了；我们将添加一个折线图卡片，用于展示接收到的天气数据。这个折线图将显示温度和相对湿度数据（不包括气压——因为气压使用的量级差异太大，会弄乱图表）。你会看到可以添加到看板上的卡片有多种类型。\n\
    \n*   点击**天气**看板。\n*   点击 **+ 添加新卡片**。\n*   在**创建卡片**窗口中，点击**折线图**（**图** **9-18**）。\n\
    \n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig18_HTML.jpg](img/486852_1_En_9_Fig18_HTML.jpg)\n\
    \n**图 9-18** 选择折线图数据可视化选项\n\n*   在**创建折线图卡片**窗口中，在**卡片源数据**选项卡中，选择你之前创建的**设备**，然后点击**下一步**（**图**\
    \ **9-19**）。\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig19_HTML.jpg](img/486852_1_En_9_Fig19_HTML.jpg)\n\
    \n**图 9-19** 选择设备\n\n*   点击选择 `xb123456` 设备（提醒：这是我们在**第 9-6 节**中指定的**设备 ID**），然后点击**下一步**。\n\
    \n在这一步中，我们将 micro:bit 边缘设备连接到了折线图。现在需要告诉折线图使用哪些数据以及如何处理这些数据。我们将添加两个数据集（温度和湿度）；需要按照**表**\
    \ **9-2** 中的详细信息添加这些**新数据集**。\n\n**表 9-2** 设置折线图卡片所使用的参数\n\n| 需要输入的数据点名称 | 温度对应的值\
    \ | 湿度对应的值 |\n| --- | --- | --- |\n| **事件** | `status1` | `status2` |\n| **属性**\
    \ | `Temperature` | `Humidity` |\n| **名称** | `Temperature` | `Humidity` |\n| **类型**\
    \ | `Number` | `Number` |\n| **单位** | `C` | `%` |\n| **最小值** | `-40` | `0` |\n\
    | **最大值** | `85` | `100` |\n\n*   在**卡片预览**选项卡中，点击**XL**。然后点击**下一步**。\n*   在**卡片信息**选项卡中，提供以下详细信息并点击**提交**。\n\
    \    *   **标题**：`实时与历史天气数据`\n    *   **配色方案**：选择任意颜色\n\n卡片已添加到看板中，看板现在可以用了：一旦我们设置好数据馈送，就应该能看到折线图实时更新温度和湿度数据。\n\
    \n其他卡片也可以按照类似的方式添加到看板中。何不再添加一张卡片来可视化气压数据呢？\n"
- fmt: '# 9.8 Coding Our Wi-Fi Weather Station


    In this section we will write the code required to make the micro:bit behave like
    a digital weather station; we set up the IoT platform first as there are details
    from it that we need to include in the code. **Figure** [**9-20**](#486852_1_En_9_Chapter.xhtml#Fig20)
    outlines the program flow in natural language.


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig20_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig20_HTML.jpg)


    **Figure 9-20** Natural language code for our IoT weather station


    **Figure** [**9-20**](#486852_1_En_9_Chapter.xhtml#Fig20) includes two steps that
    we haven’t encountered before:


    - **Step 2**: Connect to the Wi-Fi network. To connect to a Wi-Fi network you
    will need to know its name (**SSID**) and **password**. Have these handy before
    you start writing the code.

    - **Step 3**: Connect to the IoT platform. This is explained in **Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3).


    There are a number of details from the IoT platform that you need to enter into
    the code. **Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3) explains how
    to find and construct each of the parameters that are used in MakeCode.


    **Table 9-3** Setting parameters for the MakeCode blocks


    | Parameter to set in MakeCode | Where to find/how to create the parameter |

    | --- | --- |

    | To connect to the IoT platform, you need to set the **Client ID** value. | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figa_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figa_HTML.jpg)
    The Client ID consists of 3 parameters that you need to join together (“**concatenate**”)
    in a very specific format. The parameters you need are: - **Organization ID**
    - **Device type** - **Device ID** The format is: `d:Organization-ID:Device-Type:Device-ID`
    When you have concatenated the data correctly, it should look something like this:
    `d:oprah53:XinaBox:xb123456` |

    | To connect to the IoT platform, you need to set 3 values in the **Connect to
    the MQTT broker** block. | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figb_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figb_HTML.jpg)
    You need to enter 3 parameters into the **Connect to the MQTT broker** block for
    this: 1. The **broker URL** (or “connection address”): Add the **organization
    ID** to the front of the string `.messaging.internetofthings.ibmcloud.com` A correct
    **broker URL** looks like this: `opra53.messaging.internetofthings.ibmcloud.com`
    2. The **user name**: The fixed string `use-token-auth` is entered here. 3. The
    **password**: The password is the **Authentication Token** specified in the **Device
    Credentials** section. |

    | To pass data to the IoT platform, you need to send a **payload** to a specific
    **topic**. | ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figc_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figc_HTML.jpg)
    What we send to the IoT platform is referred to as the **payload** and we have
    to specify where we want to send it to: the **topic**. 1. The **payload**: We
    have to concatenate 3 bits to build the payload. Choose a Join block and add the
    following elements: - `{"[variable name]": "` - The value that you want to send
    - `"}` So, if you are sending temperature data, the join block will look something
    like this: ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figd_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figd_HTML.jpg)
    2. The **topic**: The topic is a string which tells the IoT platform which card
    to pass the data to, and which data point it is. The format for the topic is `iot-2/evt/<Event>/fmt/json`.
    A valid topic will look something like this: `iot-2/evt/status1/fmt/json` The
    `<Event>` is the Event name you entered when setting up the card, in **Edit Line
    chart Card > connect data set**: ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fige_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fige_HTML.jpg)
    |


    **Table** [**9-4**](#486852_1_En_9_Chapter.xhtml#Tab4) shows how to convert the
    code from **Figure** [**9-20**](#486852_1_En_9_Chapter.xhtml#Fig20) into MakeCode
    blocks using the parameters outlined in **Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3).


    **Table 9-4** Developing code with MakeCode blocks


    | Step | Description |

    | --- | --- |

    | 1 | Start a new project. Add the XinaBox **SW01** and **CW01** extensions. |

    | 2 | Add the **CW01 connect to WiFi** block to the **on start** block. ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figf_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figf_HTML.jpg)
    This will connect your CW01 to a Wi-Fi network. |

    | 3 | **Connect to the IoT platform/set Client ID**: - Add a **CW01 set MQTT client
    ID** block to the **on start** block: ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figg_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figg_HTML.jpg)
    **Connect to the IoT platform/set MQTT broker**: - Add the following block to
    the **on start** block after **set MQTT client** block: ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figh_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figh_HTML.jpg)
    This will connect the weather station to the MQTT broker. **See Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3)
    **for more details.** |

    | 4 | Use the **forever** block. |

    | 5 | Add a **CW01 send payload** block to the **forever** block: ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figi_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figi_HTML.jpg)
    **See Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3) **for more details.**
    |

    | 6 | Adapt the join block shown in step 6 to send humidity data: ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figj_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figj_HTML.jpg)
    The rest of the **CW01 send payload** block remains the same. |

    | 7 | We have not set up our IoT platform to do anything with the pressure data,
    so we have nowhere to send it. If you have set up a card to display the pressure
    data, you should try to adapt the code in step 6 and add it here. |

    | | Complete the program with a pause to control the rate at which data is transmitted:
    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Figk_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Figk_HTML.jpg)
    |


    **Figure** [**9-21**](#486852_1_En_9_Chapter.xhtml#Fig21) shows the full **MakeCode**
    block program.


    ![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig21_HTML.jpg](images/486852_1_En_9_Chapter/486852_1_En_9_Fig21_HTML.jpg)


    **Figure 9-21** MakeCode blocks for the Wi-Fi weather station


    The full code is available on our **resource website**. You will need to adapt
    the parameters to work with your IoT Platform, as described in **Table** [**9-3**](#486852_1_En_9_Chapter.xhtml#Tab3).'
