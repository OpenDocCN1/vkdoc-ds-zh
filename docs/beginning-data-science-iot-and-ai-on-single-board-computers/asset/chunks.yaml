    \nFootnotes [1](#486852_1_En_9_Chapter.xhtml#Fn1_source)   [2](#486852_1_En_9_Chapter.xhtml#Fn2_source)\n\
    \n# 10. Introduction to Machine Learning and Artificial Intelligence\n\n> *HAL\
    \ 9000*^([^(14)](#fn14))*: “I’m sorry Dave, I’m afraid I can’t do that”*\n> \n\
    > —2001: A Space Odyssey^([^(15)](#fn15))\n\nIn this chapter we will look at artificial\
    \ intelligence (AI) and machine learning (ML) through our data science lens: what\
    \ are they, how do they differ, and what do they have to offer?"
  trans: "\n# 9.9 为气象站供电并运行\n\n编译代码并将其烧录到你的 `micro:bit` 中。烧录完成后，从 `micro:bit` 上拔下\
    \ USB 线缆。我们需要按如下所述的特殊方式为气象站供电：\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig24_HTML.jpg](img/486852_1_En_9_Fig24_HTML.jpg)\n\
    \n**图 9-24** 气象站正在向 IBM Watson IoT 平台发送数据\n\n* 将 `IM01`、`SW01` 和 `CW01` 连接在一起。**暂时不要**连接\
    \ `micro:bit`。\n* 将 USB 电源线连接到 `IM01`（图 9-22）。等待直到 `CW01` 上显示强烈的蓝光。这通常最多只需几秒钟。\n\
    \n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig22_HTML.jpg](img/486852_1_En_9_Fig22_HTML.jpg)\n\
    \n**图 9-22** 供电过程的第二步\n\n* 现在你可以将你的 `micro:bit` 连接到 `IM01`（图 9-23）。启动时，`micro:bit`\
    \ 应显示所示的图案。这表明 `CW01` 正在尝试连接到 Wi-Fi 网络。\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig23_HTML.jpg](img/486852_1_En_9_Fig23_HTML.jpg)\n\
    \n**图 9-23** 供电过程的第三步\n\n* 一旦连接到 Wi-Fi 网络，字母 C 会显示在 5X5 LED 矩阵上。\n* 接下来，气象站将尝试连接到\
    \ IBM Watson IoT 平台。LED 矩阵上的菱形图案表示气象站与 IBM Watson IoT 云之间的连接处于活动状态。\n\n只要 `micro:bit`\
    \ 保持通电且菱形图案显示，数据就会持续发送到 IoT 气象服务。下一节将说明如何查看这些数据。\n\n## 9.10 查看数据可视化\n\n一切运行顺畅后，`micro:bit`\
    \ 气象站应持续向 IoT 平台传输数据。通过查看你在看板 (pin-board) 上设置的可视化内容来确认这一点：\n\n* 点击左侧导航栏中的 **Boards**，然后点击在第\
    \ 9.7 节中创建的 **Weather** 看板（图 9-25）。\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig25_HTML.jpg](img/486852_1_En_9_Fig25_HTML.jpg)\n\
    \n**图 9-25** 访问折线图以查看来自气象站的数据\n\n* 折线图将显示你指定时间范围内的温度和湿度数据（图 9-26）。\n\n> **注意**\
    \  \n> 还可以选择发布看板并将其设置为可公开访问。在 **Board settings** 的 **Members** 选项卡下，有一个 **share\
    \ as read only with everyone** 选项。勾选此框后，即可通过你可分享的 URL 向公众提供对该看板的访问权限。\n\n![../images/486852_1_En_9_Chapter/486852_1_En_9_Fig26_HTML.jpg](img/486852_1_En_9_Fig26_HTML.jpg)\n\
    \n**图 9-26** 我们看板上的一个折线图卡片，显示实时和历史气象数据\n\n## 9.11 总结\n\n如果一切按计划进行，你的气象站已成功连接到\
    \ IoT 平台，并且你可以通过 Web 浏览器在看板上查看实时数据。虽然这听起来显而易见，但你将能够从世界上任何可以连接互联网的地方查看这个看板。如果这看起来稀松平常，请记住，在\
    \ 20 年前这极其困难，甚至就在 10 年，也许 5 年前，你需要广泛而小众的技能组合才能构建类似的东西。\n\n所以，请花一点时间感受成就感：你在本章所完成的任务并不简单，在人类历史长河中，只有极少数人能够做到这一点。更重要的是，我们构建的模型是一个将任何传感器数据发送到云服务的模型。更换不同的传感器相对容易，这极大地扩展了该系统的潜力。此外，我们使用了一个提供丰富可视化工具集的服务，但如果要连接到其他类型的服务，甚至可能是人工智能服务呢？这正是我们将在第\
    \ 11 章和第 12 章中要做的事情。\n\n但在我们有能力使用人工智能之前，我们需要对它有所了解，这将在第 10 章中讨论。\n\n脚注 1 2\n\n\
    # 10. 机器学习和人工智能简介\n\n> *HAL 9000*^((14))：“抱歉，戴夫，恐怕我做不到。”\n>\n> ——《2001：太空漫游》^((15))\n\
    \n在本章中，我们将通过数据科学的视角来审视人工智能 (AI) 和机器学习 (ML)：它们是什么，有何不同，以及它们能提供什么？\n"
- fmt: '# 10.1 Artificial Intelligence


    To understand artificial intelligence we first need to understand the real stuff:
    what is actual intelligence? Do other creatures or machines possess intelligence?
    Do we, really?


    Drawing on our growing understanding of data science, the challenge in trying
    to answer questions like these objectively, and with any kind of scientific rigor,
    lies in gathering data about the thing we are studying. And gathering data requires
    measurement, of some sort. As data scientists, we require a concise and objective
    definition of "intelligence" and a way to measure it.


    But there is no real consensus on what intelligence actually is; no universal
    definition or handy measuring tool.


    The IQ test (Figure 10-1) is the most well-known method for measuring "intelligence."
    There are other, similar tests as well as some completely different methods, such
    as calculating the encephalization quotient(16) or an assessment by a trained
    psychologist.


    The problem with the IQ test, and all of the methods at our disposal, is the lack
    of clarity on what they are trying to measure. The IQ test results correlate with
    performance on a limited subset of mental skills that were held in high regard
    by the scientists who created the test. These mental skills were taken to be factors
    that would correlate strongly with "intelligence."


    Perhaps when we finally have a definition of intelligence that everyone agrees
    on we will observe a correlation with the IQ score. But all we know for sure is
    that it measures how well someone has performed on a set of tasks. We would question
    the validity and reliability of extrapolating IQ data and taking it is a straight
    measure of intelligence.


    ![../images/486852_1_En_10_Chapter/486852_1_En_10_Fig1_HTML.jpg](images/486852_1_En_10_Chapter/486852_1_En_10_Fig1_HTML.jpg)


    Figure 10-1


    An example IQ test question (from Raven''s Progressive Matrices example). What
    pattern fits in the blank square? Source: [https://en.wikipedia.org/wiki/Intelligence_quotient#/media/File:Raven_Matrix.svg](https://en.wikipedia.org/wiki/Intelligence_quotient%2523/media/File:Raven_Matrix.svg)


    It does seem inevitable that this IQ is not the same as the intelligence that
    separate us from slugs or trees. It is THAT intelligence that is the holy grail
    of computer scientists, and the people that finance them.


    Despite the fact that the term intelligence is nebulous, we have little difficulty
    identifying **intelligent behavior** in other people and by nonhuman entities
    (e.g., a dolphin, chimpanzee, or computer).


    **Intelligent behaviors** are actions that:


    - An observer would not attribute to luck or to mirroring learned behavior.

    - Are not reflexes or automatic responses: they required volition and insight
    from the party displaying the behavior.

    - Result in an outcome that is favorable to the entity, or the avoidance of an
    unpleasant outcome.

    - We would not expect to be repeated by other, similar entities every time the
    circumstance are identical.

    - Are not isolated incidents. An intelligent entity would be expected to display
    intelligent behavior on a regular basis.


    We can therefore observe intelligence in action. Admittedly labeling an action
    as an **intelligent behavior** is subjective, but it is possible to list behaviors
    that a wide range of people would agree meet the threshold for **intelligent behavior**.
    For machines some examples might be as follows:


    - It displayed a behavior that it was not programmed to display that was effective
    in meeting an objective.

    - It displayed a behavior that achieved an objective it was not programmed to
    pursue.


    Focusing on intelligent behavior gives us a practical way to define intelligence:


    - Intelligence is the impetus that prompts an organism or machine to demonstrate
    "intelligent behavior."


    In a wonderful case of irony, Forrest Gump got it right when he said *"*stupid
    is as stupid does*"*; for us that translates into "intelligence is performing
    intelligent behavior." It sounds better the way he says it though.


    ## 10.2 AI/ML?


    The terms machine learning (ML) and artificial intelligence (AI) are encountered
    frequently in the press and social media, but few of us are clear on the distinction.
    At the risk of annoying experts by oversimplifying, the key difference between
    AI and ML can be summed up as follows:


    - **AI** is concerned with creating machines that display **intelligent behavior**.

    - The core goal of **ML** is data analysis. It is a branch of AI that focuses
    on systems that can learn and improve from experience: enhancing the quality and
    accuracy of the outcomes they produce or finding new and novel ways to reach an
    outcome.


    > ML is a subset of AI, and the example we look at later in the book is an ML
    implementation.


    To illustrate the difference between AI and ML consider this: when AlphaGo beat
    the world''s best player at the board game Go it was a triumph of ML. It would
    be a triumph of AI if AlphaGo decided to deliberately lose a game to avoid being
    detected, or to ensure its human opponent did not get too upset.


    We are not going to look at each of the 14 different types of learning that compromise
    ML. Neither are we going to ponder the three or four different types of AI or
    probe exactly what is, and isn''t, ML. The core elements that comprise AI are
    fascinating, but again we will pass. Our goal here is to foster an intuitive understanding
    of AI and learn how to use it as a tool for data science experimentation.'
