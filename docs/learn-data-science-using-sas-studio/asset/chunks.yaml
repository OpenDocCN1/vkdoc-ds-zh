    ### Correlation Analysis


    Correlation is a statistical procedure for describing the relationship between
    numeric variables. The relationship is described by calculating correlation coefficients
    for the variables. The correlations range from –1 to 1. The Correlation Analysis
    task provides graphs and statistics for investigating associations among variables.


    We shall inspect a couple of examples. To do this example, click on `Tasks and
    Utilities` ➤ `Tasks` ➤ `Statistics` ➤ `Correlation Analysis`. Select in `Data`
    the dataset `CARS` from the `SASHELP` library. In `Analysis variables`, select
    `Weight` and `Length`. In `Correlate with`, choose `Horsepower`, as in Figure
    [4-7](#501068_1_En_4_Chapter.xhtml#Fig7).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig7_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig7_HTML.jpg)


    Figure 4-7 Correlation Analysis Data tab


    In `Options` ➤ `Plots`, select `Individual Scatter Plots`, as in Figure [4-8](#501068_1_En_4_Chapter.xhtml#Fig8).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig8_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig8_HTML.jpg)


    Figure 4-8 Correlation Analysis Options tab


    Then, click `Run`. The output will be as shown in Figure [4-9](#501068_1_En_4_Chapter.xhtml#Fig9).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig9_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig9_HTML.jpg)


    Figure 4-9 Pearson correlation coefficients


    The output shows that the horsepower is more correlated with weight than length.
    Again, these correlations are confirmed in the following plots, Figures [4-10](#501068_1_En_4_Chapter.xhtml#Fig10)
    and [4-11](#501068_1_En_4_Chapter.xhtml#Fig11).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig11_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig11_HTML.jpg)


    Figure 4-11 Correlation between horsepower and length


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig10_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig10_HTML.jpg)


    Figure 4-10 Correlation between horsepower and weight


    Now, let us look at how to use correlation for the presidential election in Maine.
    The question is: Does the gross domestic product (GDP) affect the voters turnout
    in the state of Maine?


    The dataset is called `correlation.xlsx` and can be found in the `Datasets` folder.
    I faced a challenge while building this dataset. Various media and government
    sites put out different values for Maine’s voter turnout. I used the most repeated
    numbers from 2016. Further verification is needed if you will use these numbers
    beyond this exercise.


    Here is a sample of the references that I researched:


    - `https://en.wikipedia.org/wiki/United_States_presidential_election_in_Maine,_2000`

    - `http://www.270towin.com/states/Maine`

    - `http://www.pressherald.com/2016/11/08/mainers-head-to-polls-in-historic-election/`

    - `http://mainepublic.org/post/maine-voter-turnout-extremely-heavy#stream/0`

    - `http://www.csmonitor.com/USA/Elections/2012/1106/Voter-turnout-the-6-states-that-rank-highest-and-why/Maine`

