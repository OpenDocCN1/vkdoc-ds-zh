  trans: '

    ### 人口


    第二步是尽可能收集相关的数据。因此，我从人口信息入手。


    根据美国人口普查局关于缅因州各县人口分布的数据，我发现人口分布并不均匀。有大片区域要么无人居住，要么只有一个人居住。虽然南部的红点看起来很小，但每个红点代表有超过
    5000 人居住。因此，我不应该被总统竞选活动或主流媒体发布的地图所迷惑。


    接下来的逻辑步骤是获取选民信息。有些州免费公开选民数据库，任何人都可以下载。然而，缅因州并非如此。该州将选民数据库出售给政党。于是，我联系了州务卿办公室。


    该办公室回复说，要获取缅因州中央选民登记系统中的选民档案和更新信息，申请方必须属于以下五类之一：


    1.  候选人本人，或为候选人竞选活动工作的个人或实体

    2.  为某个政党工作的个人

    3.  参与下届全州选举中缅因州选票上公投活动的个人或实体

    4.  参与缅因州特定“促投票”活动的个人或实体（需指明活动的名称、地点和日期）

    5.  经选举或任命，并在市、县、州或联邦政府机构任职的个人，仅用于该官员的授权活动，不得转交其他实体


    费用根据获取的记录数量计算；收费标准详见《缅因州法律汇编》第 21-A 篇第 196-A 节。一份包含近一百万条记录的州级选民档案售价为 2200 美元。


    经过几封邮件往来，解释了我需要这些数据用于研究项目并发送了一些验证信息后，该办公室善意地免费寄给我一张 DVD，里面包含了所有必要的信息，并隐藏了不需要的数据，如姓氏等。


    DVD 上的第一个表格是选民信息，如图 1-2 所示。列包括名字、出生年份、注册代码、特殊标识、注册日期、国会选区、县 ID、变更日期以及带有`VPH`标识的上次全州选举日期。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig2_HTML.jpg](img/501068_1_En_1_Fig2_HTML.jpg)


    图 1-2 选民信息


    第二个表格是注册和登记选民报告，如图 1-3 所示。该表的列包括县名、市镇名、选区、国会选区、州参议院选区、县专员选区、政党及总人数。文件中列出的政党有民主党、绿党独立人士、自由意志党、共和党和无党派。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig3_HTML.jpg](img/501068_1_En_1_Fig3_HTML.jpg)


    图 1-3 注册和登记选民报告


    这些原始数据很混乱，包含许多错误值和异常值。例如，一名选民的年龄是 220 岁，而他的出生日期显示他当时大约是 67 岁。有些选民的信息缺失，等等。再次强调，如前所述，一定要清理你的数据：处理异常值、缺失数据，调整数据格式，并探索你的数据。


    不仅如此，你还应该尽可能多地收集历史数据。于是，我开始深入研究，收集了所有能找到的数据。我从美国人口普查局下载了更多表格（`http://www.census.gov/topics/public-sector/voting/data/tables.html`）。


    我按性别、年龄和种族对选民进行了分组。


    ### 性别


    如图 1-4 所示，我发现缅因州注册的女性选民人口多于注册的男性选民。然而，两种性别的百分比差异小于±2%。至于候选人应如何利用这一信息，鉴于女性的投票率总是高于男性，竞选活动的代表可以佩戴癌症意识丝带以激发女性的同情心。这一建议展示了数据和数字不仅能够控制演讲话题，甚至能控制代表们的穿着。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig4_HTML.jpg](img/501068_1_En_1_Fig4_HTML.jpg)


    图 1-4 按性别分组的缅因州注册选民


    ### 种族


    关于缅因州的种族构成，超过 96%的人口是白人（如图 1-5 所示）。因此，我将黑人、亚裔和西班牙裔选民归为非白人注册选民。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig5_HTML.jpg](img/501068_1_En_1_Fig5_HTML.jpg)


    图 1-5 按种族分组的缅因州注册选民


    ### 年龄


    2016 年，年龄在 65 岁以上的注册选民数量显著下降，如图 1-6 所示（请注意纵轴刻度不同）。另一方面，18–24 岁和 25–44 岁年龄段的选民数量有所增加。这一发现表明，为了说服更多选民，演讲话题也应随之改变。例如，竞选代表应侧重讨论学生贷款和住房抵押贷款，而不是聚焦于医疗保险和退休金。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig6_HTML.jpg](img/501068_1_En_1_Fig6_HTML.jpg)


    图 1-6 按年龄分组的缅因州注册选民


    ### 选民投票率


    我查阅了过去几年的选民投票率，以了解有多少选民愿意冒着缅因州的风雪走上街头投票。图 1-7 显示了 2000 年至 2016 年的选民投票率百分比，并且在这些年份中，获胜政党均是民主党。如果你用摇摆州尝试这个练习，柱状图的颜色会相应变化以反映获胜政党。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig7_HTML.jpg](img/501068_1_En_1_Fig7_HTML.jpg)


    图 1-7 2000–2016 年缅因州选民投票率


    我再次根据获胜政党，并按照年龄、种族和性别分组，检查了近年来的选民投票率。在图 1-8 中，`D`代表民主党，`R`代表共和党，`O`代表所有其他政党的总和。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig8_HTML.jpg](img/501068_1_En_1_Fig8_HTML.jpg)


    图 1-8 按政党及年龄、种族和性别分组的缅因州选民投票率

