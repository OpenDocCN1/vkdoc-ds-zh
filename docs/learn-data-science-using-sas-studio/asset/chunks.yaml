- fmt: '### How Do You Write Your Results, Keeping Your Audience in Mind?


    After we are done with the technicalities of generating the report from `SAS Studio`,
    we need to think about our audience, who will read it. Our audience varies and
    includes data scientist peers, our team leaders, the company board of directors,
    the marketing team, and our company’s clients.


    For example, our clients hired us to decide whether to buy or sell a stock. They
    would not care about histograms or maps. They would want plain English to know
    the justification for our decision. On the other hand, our manager and team will
    need to know every detail and need even to be able to read and understand the
    code.


    It is crucial to know the deliverables required for every entity and write our
    results so as to be customized to our audience’s needs. Explaining the visualizations
    is more critical than the visualizations themselves.


    Here are some further links for data analysis reports examples:


    - [`https://www.datapine.com/blog/analytical-report-example-and-template/`](https://www.datapine.com/blog/analytical-report-example-and-template/)

    - [`http://www.stat.cmu.edu/~brian/701/notes/paper-structure.pdf`](http://www.stat.cmu.edu/%257Ebrian/701/notes/paper-structure.pdf)

    - [`https://www.examples.com/business/data-analysis-report-examples.html`](https://www.examples.com/business/data-analysis-report-examples.html)

    - [`https://bizfluent.com/how-5822409-write-good-data-analysis-report.html`](https://bizfluent.com/how-5822409-write-good-data-analysis-report.html)


    Here are links for data science report structure:


    - [`https://www.kaggle.com/WinningModelDocumentationGuidelines`](https://www.kaggle.com/WinningModelDocumentationGuidelines)

    - [`https://github.com/rdpeng/courses/blob/master/05_ReproducibleResearch/Checklist/Reproducible%20Research%20Checklist.pdf`](https://github.com/rdpeng/courses/blob/master/05_ReproducibleResearch/Checklist/Reproducible%2520Research%2520Checklist.pdf)


    ## How Can You Make Money Online from Data Science?


    You can find a vast number of articles about how to make money online from data
    science. In this section, I share with you a slice of my experience and what I
    actually do. I am a freelance instructor, consultant, journalist, and author.


    ### Teaching Online


    I have been teaching computer and technical courses my whole life. I taught my
    first course when I was still an undergraduate in my second year at the Faculty
    of Engineering, Cairo University. In Egypt, studying engineering takes five years,
    not four. I became a Microsoft Certified Professional in my fourth year. After
    graduating, I passed many of Microsoft’s tracks and became a Charter at .NET track
    and a Microsoft Certified Trainer.


    Yes, getting certified advances your career and proves your expertise. Others
    prefer showing their skills by making online tutorials, blogging, and answering
    others’ questions on technical communities. I always read and hear about people
    who make thousands of dollars from YouTube. However, I do not know anyone who
    actually does that for a living.


    Anyway, that other way around would not have worked for me, because to teach technically
    at certified centers, you must be certified. However, the con to that is that
    you must keep chasing the newest technologies, getting certified to always be
    top-notch. Otherwise, you lose your sparkle. If you get tired at any instant,
    you can switch to teaching basic sciences and technologies academically at universities.
    At some phases of my life, I did that as well, but soon I missed the adrenaline
    and switched back to technology instead of academia. Of course, teaching technically
    is much more rewarding financially than teaching at any university. Currently,
    I teach SAS, Docker, and Kubernetes tracks as a freelance instructor at ONLC Training
    Centers, Microsoft Partners, and at other certified centers.


    I started exploring data science in a similar way. My first step in the field
    was to get certified by taking the Harvard Graduate Professional Certificate.
    It was an exhilarating experience. I shall talk to you later about it in detail
    because I cannot degrade it to a paragraph in a section.


    ### Writing Online


    I write online for several venues as a freelancer and as a volunteer. Volunteering
    usually brings me job or project offers. It is another way to show your experience.
    However, you must do volunteering with sincerity. I never thought of my volunteering
    as a chance to show my experience, but in many cases, I received job offers because
    of it.


    Once, I wrote an article for free at *Medium* merely to share my knowledge and
    experience after I had a disagreement with my editor at one of the outlets. I
    was surprised to receive an offer from *Medium* to join their partner program.
    After publishing with the program, I started receiving money and another offer
    to write at one of the *Medium* magazines. The advantage of this program is that
    you are not compelled to write about certain topics or to have an editor who might
    reject your article. You can write whenever you have time about whatever you like
    and earn money if people read and like your articles. Here is the link to join
    the *Medium* partner program:


    [`https://medium.com/creators`](https://medium.com/creators)


    Although I write for several venues for larger fees than *Medium*, I prefer it
    the most. I vouch for it as the best venue for which to write whenever you have
    a chance. Writing regularly is the best practice to get a steady flow of cash
    and followers. Unfortunately, I do not do that yet, because I am mostly busy teaching.
    I consider writing as another way of teaching. However, I prefer the human interaction
    of teaching. Others of my friends prefer writing over teaching because articles
    last longer.'
