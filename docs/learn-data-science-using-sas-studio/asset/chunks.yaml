    # 气泡图


    散点图适用于展示两个变量之间的关系。若要展示三个变量之间的关系，则需使用气泡图。在本示例中，我们将创建一个气泡图来显示某班级学生的身高、体重和年龄。


    点击 `Tasks and Utilities` ➤ `Tasks` ➤ `Graph` ➤ `Bubble Chart`。在`Data`中，选择`SASHELP.CLASS`库。接着在`Roles`中，为图形的
    X 轴选择`Height`；为 Y 轴选择`Weight`；为气泡大小选择`Age`，如图 3-35 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig35_HTML.jpg](img/501068_1_En_3_Fig35_HTML.jpg)


    图 3-35


    气泡图


    点击 `Run`。初始输出的图形将如图 3-36 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig36_HTML.jpg](img/501068_1_En_3_Fig36_HTML.jpg)


    图 3-36


    初始输出图表


    现在，让我们美化一下外观。点击 `Appearance` 选项卡。如图 3-37 所示，在 `Bubble Labels` 中，为 `Bubble Label`
    选择 `Name`。同样如图 3-37 所示，点击 `Title and Footnote`，在标题栏输入“Age by Height and Weight”，在脚注栏输入“Bubble
    size represents age”。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig37_HTML.jpg](img/501068_1_En_3_Fig37_HTML.jpg)


    图 3-37


    添加气泡标签


    重新运行程序。输出结果将如图 3-38 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig38_HTML.jpg](img/501068_1_En_3_Fig38_HTML.jpg)


    图 3-38


    带有气泡标签的图表


    图表应简洁明了，不应包含任何重复数据。图 3-38 中的图表将学生姓名重复显示了两次：一次作为气泡标签，另一次显示在图表底部的图例中。要修正此问题，我们需要编辑代码。如图
    3-39 所示，点击 `Edit`。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig39_HTML.jpg](img/501068_1_En_3_Fig39_HTML.jpg)


    图 3-39


    点击编辑


    如图 3-40 所示，通过向 `sgplot` 函数添加 `noautolegend` 选项来编辑代码，以移除图形下方自动生成的图例。为了美化脚注的外观，我们将其位置调整到图形内部，并缩进到右下角，以避免与任何结果重叠。为此，请添加以下代码行：


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig40_HTML.jpg](img/501068_1_En_3_Fig40_HTML.jpg)


    图 3-40


    编辑代码


    ```

    inset"Bubble size represents Age" / position=bottomright textattrs=(size=11);

    ```


    现在，重新运行代码。输出结果得到优化，如图 3-41 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig41_HTML.jpg](img/501068_1_En_3_Fig41_HTML.jpg)


    图 3-41


    气泡图的最终版本


    从该图中，我们可以看到 Joyce 是班上最轻、最矮的学生。同时，她也是班上两名最年轻的学生之一。Joyce 和 Thomas 的气泡最小。如果通过点击 `Libraries`
    ➤ `SASHELP` ➤ `CLASS` 返回表格，并点击 `Age` 列对年龄数据进行排序，你会发现他们俩都是十一岁。另一方面，Philip 是班上最高、最重且年龄最大的学生。他是唯一一个十六岁的学生，班上其他人都比他年轻。这就是为什么他的气泡是最大的。Joyce
    和 Philip 可以被视为异常值。然而，这个班只有十九名学生，样本量非常小。样本量越大，分析效果越好。


    # 地图


    在地图上显示数据能提供新的视角。它本身就能讲述一个完整的故事。SAS Studio 使在地图上显示数据变得容易。此外，使用颜色和气泡自定义地图为你的数据增添了新的维度。本节将使用真实数据引导你完成整个过程。它将逐步向你展示如何下载数据并将其准备好以显示在地图上。

    '
- fmt: '### Bubble Map


    The Bubble Map task creates a map that is overlaid with a bubble plot. For this
    example, we shall use crime data for New York City to create a bubble map showing
    the crime rate in the different NYC boroughs in 2018. The data is available through
    the NYC Open Data Project website.


    You will find the data file in the `Datasets` folder; the file is named `NYPD_Complaint_Data_Current__Year_To_Date.csv`.
    Or, you can download the dataset from this URL: [`https://data.cityofnewyork.us/Public-Safety/NYPD-Complaint-Data-Current-Year-To-Date-/5uac-w243/data`](https://data.cityofnewyork.us/Public-Safety/NYPD-Complaint-Data-Current-Year-To-Date-/5uac-w243/data)


    To download the dataset from the link, as in Figure 3-42, click on Export, then
    on CSV.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig42_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig42_HTML.jpg)


    Figure 3-42 – NYPD Compliant Data—NYC OpenData


    The dataset contains a massive amount of information. Much investigation and analysis
    can be done with this data. For example, what is the most prevalent crime type
    in every borough? When is the most probable time for crime to happen? On which
    day of the week do most crimes occur?


    For this example, we are interested solely in answering the question of which
    borough has the highest crime rate and which has the least.


    To answer this question, we need the following three columns: `Borough`, `Longitude`,
    and `Latitude`. Hence, we drop all the other columns. Then, we count the number
    of crimes in every borough to represent it with a bubble on a map.


    After cleaning the data and preparing it, we have the dataset shown in Table 3-3.


    Table 3-3 – Number of Crimes Per Borough


    | Borough | Count of Crimes | Latitude | Longitude |

    | --- | --- | --- | --- |

    | BRONX | 50153 | 40.82452 | -73.8978 |

    | BROOKLYN | 67489 | 40.82166 | -73.9189 |

    | MANHATTAN | 56691 | 40.71332 | -73.9829 |

    | QUEENS | 44137 | 40.74701 | -73.7936 |

    | STATEN ISLAND | 10285 | 40.63204 | -74.1222 |


    To load the data, we write Listing 3-4 in SAS Studio. You can load `Listing 3-4.sas`
    from the `Example Code` folder. Click Run.


    ```

    data NYC_crime;

    input Borough $13.;

    datalines;

    BRONX

    BROOKLYN

    MANHATTAN

    QUEENS

    STATEN ISLAND

    ;

    run;

    data NYC_crime_dim;

    set nyc_crime;

    input count Latitude Longitude;

    datalines;

    50153 40.82451851 -73.897849

    67489 40.82166423 -73.91885603

    56691 40.71332365 -73.98288902

    44137 40.74701026 -73.79358825

    10285 40.63203653 -74.1222402

    ;

    run;

    ```


    Listing 3-4 – Creating a Dataset for Number of Crimes Per Borough


    In this program, we did not import the raw data file. We inserted the values of
    the table into the code using the `DATALINES` keyword in the data step. In Listing
    3-4, we have two data steps. The first one is called `NYC_crime`. The second line
    uses the `INPUT` statement to specify the columns’ names and types. In this table,
    we define only one column as the borough names, and its type is character because
    we used the `$`. The maximum number of characters is 13. Then, we use a `DATALINES`
    statement to insert the actual values, and end it with a semicolon.


    The second data step creates another table called `NYC_crime_dim` to insert the
    boroughs’ dimensions and the number of crimes in each one. This table is initialized
    by the previous table, `nyc_crime`, by using the `SET` statement. Again, we use
    the `INPUT` statement to specify that we shall add three more columns to the borough.
    We add the `count`, `latitude`, and `longitude`. Remember to leave a space in
    between the column names, and do not use commas. Again, use `DATALINES` to insert
    the actual values, and end it with a semicolon.


    After running Listing 3-4, two new tables called `NYC_crime` and `NYC_crime_dim`
    will be created in the `Work` library. To check the output table, click `Libraries`
    ➤ `Work`; under it, you will find `NYC_crime` and `NYC_crime_dim`. If not, refresh
    your libraries as we explained in Chapter 2.


    Now, click on `Tasks and Utilities` ➤ `Tasks` ➤ `Map` ➤ `Bubble Map`, as in Figure
    3-43.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig43_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig43_HTML.jpg)


    Figure 3-43 – Create a bubble map


    As in Figure 3-44, select the dataset `WORK.NYC_CRIME_DIM` in the Data field.
    In Roles, select the `Latitude` and `Longitude`. In Bubble size, select `count`,
    which is the number of crimes. Finally, in Group, select the `Borough` column.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig44_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig44_HTML.jpg)


    Figure 3-44 – Number of crimes per borough


    For Base Map select `OpenStreetMap`. Later in the chapter, we shall try the Esri
    maps to see the difference in the output. Leave the rest of defaults and click
    Run. The bubble map seen in Figure 3-45 will be displayed.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig45_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig45_HTML.jpg)


    Figure 3-45 – Number of crimes per borough


    It is clear from the bubble size that Brooklyn has the highest crime rate, while
    Staten Island has the lowest one. SAS Studio automatically adjusts the bubble
    location, size, and color. Moreover, it adds a legend at the bottom of the map
    for the borough color codes.


    Now, let us enhance the appearance of the bubble map. We can add a label to the
    bubble with the count of crimes, and add a title to the map. As in Figure 3-46,
    in the Appearance tab, in Data Labels, for Bubble label, select the `count` column
    from the dataset. Then, in Label options, for Font weight, select Bold. In the
    Label position, select Center. Finally, in Title And Footnote, for Title, type
    “Number of crimes in NYC Boroughs.”


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig46_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig46_HTML.jpg)


    Figure 3-46 – Enhance the appearance


    Click Run to check the new changes. The output would be as in Figure 3-47.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig47_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig47_HTML.jpg)


    Figure 3-47 – Number of crimes in NYC boroughs


    Listing 3-5 shows the code that SAS Studio auto-generates from our options through
    the user interface.


    ```

    ods graphics / reset width=6.4in height=4.8in;

    proc sgmap plotdata=WORK.NYC_CRIME_DIM;

    openstreetmap;

    title ''Number of crimes in NYC Boroughs'';

    bubble x=Longitude y=Latitude size=count/    group=Borough datalabel=count

    datalabelpos=center

    datalabelattrs = (color=CX0f0e0e  size=7pt  weight=bold)

    name="bubblePlot";

    keylegend "bubblePlot" / title =  ''Borough'' ;

    run;

    ods graphics / reset;

    title;

    ```


    Listing 3-5 – Creating a Dataset for Number of Crimes Per Borough


    SAS Studio is powerful in that it provides two types of base maps: `OpenStreetMap`
    and Esri maps. Now, let us try the other base map type. As in Figure 3-48, return
    to the Data tab, choose Esri maps, and click Run. The output map will be as in
    Figure 3-48.


