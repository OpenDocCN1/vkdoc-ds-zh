    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig24_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig24_HTML.jpg)


    Figure 8-24


    Butterfly chart will show which gender overdosed more


    Figure [8-25](#501068_1_En_8_Chapter.xhtml#Fig25) shows that males commit such
    deadly drug overdoses more than females.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig25_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig25_HTML.jpg)


    Figure 8-25


    Males overdose a great deal more than do females


    ## Summary


    This chapter introduced SAS Viya, which is an all-in-one product. It includes
    SAS Studio in it as well. We talked about the choropleth maps, which are not available
    in the free version of SAS Studio. Moreover, we created a report that contained
    many infographics in one sheet. It has some interesting features, such as the
    word cloud. In the next chapter, we shall talk about where to go after this book
    and how to continue your track in learning data science using SAS and how to hunt
    yourself down some data science jobs.


    # 9. What Is Next?


    As we discussed in Chapter [1](#501068_1_En_1_Chapter.xhtml), the data science
    process starts with a question or hypothesis. Then, you collect as much relevant
    raw data as you can, then clean and explore it. The fourth stage is modeling and
    evaluating. The last step is deploying, visualizing, and communicating results
    in reports, as in Figure [9-1](#501068_1_En_9_Chapter.xhtml#Fig1).


    ![../images/501068_1_En_9_Chapter/501068_1_En_9_Fig1_HTML.jpg](images/501068_1_En_9_Chapter/501068_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    Data science process


    It is worth mentioning that the first three phases in the data science process
    are called data analytics, while the modeling and evaluation phase is data science.
    The visualization and reporting of the results are common between data science
    and analytics.


    Therefore, the data analytics cares more about analyzing the real historical data
    that we already have, while data science’s scope is predicting the future. In
    this book, we presented the modeling and evaluation phase in Chapters [7](#501068_1_En_7_Chapter.xhtml)
    and [8](#501068_1_En_8_Chapter.xhtml). Moreover, we discussed the difference between
    supervised and unsupervised algorithms in Chapter [3](#501068_1_En_3_Chapter.xhtml).


    However, there are plenty of other data science algorithms that you should know
    about as a data scientist; for example, decision trees, support vector machines,
    and neural networks. If you are interested in image analysis, then go ahead to
    learning about deep learning and TensorFlow.


    ## Reports: How Do You Present Your Results?


    Throughout the book, we have talked in several chapters about reports. In this
    section, we assemble these scattered puzzle pieces to learn how easy it is to
    write a report in SAS Studio in comparison to other languages.


    In SAS Studio, compiling a report is much easier than in other data science languages.
    For example, in R, to compile a report that collects all your graphs, statistical
    analyses, and inferences, you need to use Markdown to generate an HTML document
    at the end. Adding your companies’ logos and following its report templates might
    be troublesome to some newbies to data science if they are not familiar with HTML
    code. While in SAS Studio, as we mentioned in Chapter [2](#501068_1_En_2_Chapter.xhtml),
    Figure 2-7, the report output can be in RTF, PDF, or HTML formats. Editing the
    RTF file in any word processing application is much easier than editing it embedded
    in code; for example, adding your company’s logo, any extra text, and inferences.


    To have a complete analytics report with multiple sections, you might do each
    section as an independent program using SAS Studio GUI. For example, in one program,
    you might create the statistical analysis using one-way frequencies. In another
    program, you might do the histogram. In a third program, you might make a visualization
    using the maps, and so on. In the end, you would want to combine all these programs
    in one to generate one report only. You can do that by clicking on the `Edit`
    tab, as in Figure 3-39. At each of the programs that we mentioned, copy the auto-generated
    code and paste after each other in one program. Run this new, large program and
    compile your report from it. We did that in Listing 7-1, where we explored the
    oil, the gold, and the stocks. We copied the three programs and compiled them
    in one report that had all three charts; then, we performed the regression.


    In conclusion, by copying the scattered code from several programs, you can generate
    one report. Then, click on `Print` and save your report in RTF format and edit
    it in any word processing application. In SAS Studio, there is no need to write
    special code to generate the report.'
