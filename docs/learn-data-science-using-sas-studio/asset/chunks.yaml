    # DO 循环


    `DO` 循环有三种迭代方式：`DO LOOP`、`DO UNTIL` 和 `DO WHILE`。`DO` 循环的基本语法如下：


    ```

    DO 索引变量=起始值 to 结束值    ;

    SAS 语句 . . .

    END;

    ```


    默认情况下，增量值为 1，但您可以更改它。以下示例仅将从 1 到 10 的奇数相加。为了将迭代结果保存到输出数据集中，请使用 `OUTPUT` 语句；该语句会立即保存每个观测值，而不是在数据步结束时保存。参见图
    5-4。


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig4_HTML.jpg](img/501068_1_En_5_Fig4_HTML.jpg)


    图 5-4 – DO 循环输出示例


    ```

    data b;

    SUM=0;

    DO ILOOP=1 to 10 by 2;

    SUM=SUM + ILOOP;

    output;* OUTPUT 语句指示 SAS 立即将当前观测值写入 SAS 数据集，而不是在 DATA 步结束时写入;

    END;

    run;

    代码清单 5-5 – DO 循环示例

    ```


    `DO UNTIL` 循环会一直迭代，直到 `UNTIL` 子句的条件变为真。`UNTIL` 条件在循环结束时进行评估。让我们使用 `DO UNTIL` 循环重做前面的示例。请注意，您必须在循环内手动递增计数器；否则会形成无限循环。好消息是，即使您创建了无限循环，也无需担心，因为
    SAS Studio 不会崩溃。它的执行时间会比正常情况更长，然后会为您生成一个错误。因此，请再次记住，即使收到了结果，检查 SAS 日志也始终是个好习惯。参见代码清单
    5-6 和图 5-5。


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig5_HTML.jpg](img/501068_1_En_5_Fig5_HTML.jpg)


    图 5-5 – DO UNTIL 输出示例


    ```

    data d;

    SUM=0;

    i=1;

    DO UNTIL (i GT 9);

    SUM=SUM + i;

    output;

    i=i+2;

    END;

    run;

    代码清单 5-6 – DO UNTIL 示例

    ```


    `DO WHILE` 与 `DO UNTIL` 相反。循环会持续进行，直到 `WHILE` 子句中的条件为假。参见代码清单 5-7 和图 5-6。


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig6_HTML.jpg](img/501068_1_En_5_Fig6_HTML.jpg)


    图 5-6 – DO WHILE 输出示例


    ```

    data e;

    SUM=0;

    i=1;

    DO WHILE(i LT 10);

    SUM=SUM + i;

    output;

    i=i+2;

    END;

    run;

    代码清单 5-7 – DO WHILE 示例


    最后一种使用 `DO` 循环的方法是，当迭代计数器没有特定模式时，可以对一组项进行循环。我们仍然可以得到与前面示例相同的结果，但这里使用一组数字，而不是使用计数器和增量语句。参见代码清单
    5-8 和图 5-7。


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig7_HTML.jpg](img/501068_1_En_5_Fig7_HTML.jpg)


    图 5-7 – 对项集进行 DO 循环的输出


    ```

    data f;

    SUM=0;

    DO i=1,3,5,7,9;

    SUM=SUM + i;

    output;

    END;

    run;

    代码清单 5-8 – 对项集进行 DO 循环的示例

    ```


    ## 摘要


    本章首先介绍了如何在 SAS 程序中添加注释，以及如何使用算术运算符和比较运算符。我们简要介绍了 `PROC SQL`，并详细讨论了 `SELECT` 语句。`SELECT`
    语句与 `WHERE` 和 `WHEN` 语句有多种组合方式。此外，我们还详细讨论了 SAS 中的循环。这些循环包括 `DO` 循环、`DO UNTIL`
    和 `DO WHILE` 循环。在下一章中，我们将学习如何为分析做准备，并学习基本条件语句。


    # 6. 准备分析数据


    在本章中，我们将继续深入探讨 SAS 编程，仍然重点关注代码而非图形用户界面。正如我们之前提到的，在任何编程语言中，您都会学习数据类型、运算符、`IF` 条件和循环。我们在第
    2 章和第 5 章中涵盖了所有这些主题，但 `IF` 条件语句除外。在本章中，我们将学习它们以及更高级的数据准备和处理技术。


    ## LABEL（标签）


    在第 2 章中，我们提到 SAS 程序由两部分组成：数据步和过程步。在前面的章节中，我们尝试了许多过程，例如 `PROC SGPLOT` 和 `PROC MEANS`。`LABEL`
    语句位于数据步中，而 `LABEL` 选项位于 `PROC PRINT` 中。


    分析数据集的第一步是了解您拥有的变量。识别哪些是因变量，哪些是自变量，哪些是数值/连续变量，哪些是字符变量。通常，您的客户会随着包含数据的文件一起，在文本文件中为您提供这些信息。该文本文件称为字典，因为它包含了变量名称及其类型的解释。让我们回顾一下第
    1 章中的图 1-2，即缅因州务卿办公室发送给我的文件。


    数据位于 Excel 工作表中，字典用中间的红色框突出显示。如果没有字典，变量名 `YOB`、`ENROLL` 和 `DT Accept` 的含义是模糊的。通过字典，我们理解了每个变量的含义；例如，`YOB`
    代表出生年份。


    为了将这些解释性名称附加到 SAS 中的数据集，我们使用 `LABEL` 语句。数据集位于“Dataset”文件夹中，名称为 `Voter_A.CSV`。从
    SAS Studio 上传它，点击刷新，然后导入它，就像我们在第 2 章中解释的那样。将数据集的名称从 `IMPORT` 更改为 `Voters`。


    此数据集并非真实数据集。我是使用缅因州务卿发送给我的相同变量创建的。但是，此文件不包含真实信息。


    导入文件后，我们发现它有 100 行和 9 列，如图 6-1 所示。


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig1_HTML.jpg](img/501068_1_En_6_Fig1_HTML.jpg)


    图 6-1 – 导入 Voters_A.CSV


    现在，让我们在数据步中编写一个 `LABEL` 语句，并使用 `PROC PRINT` 的 `LABEL` 选项，如代码清单 6-1 所示。


    ```

    data voters_label;

    set work.voters;

    label

    FIRST_NAME=''姓名''

    YOB=''出生年份''

    ENROLL=''注册代码''

    DESIGNATE=''特殊名称''

    DT_ACCEPT=''接受日期（注册日期）''

    CG=''国会选区''

    CTY=''县 ID''

    DT_CHG=''更改日期''

    DT_LAST_VPH=''最近一次有选民登记记录的全州选举日期'';

    run;

    proc print label;

    run;

    代码清单 6-1 – LABEL 语句和 LABEL 选项

    ```


    当您运行代码清单 6-1 时，输出如图 6-2 所示。


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig2_HTML.jpg](img/501068_1_En_6_Fig2_HTML.jpg)


    图 6-2 – 使用标签（而非变量名）的输出


    图 6-2 显示，报告打印时使用了描述性标签，而不是变量名。因此，它更具可读性。但是，数据明显不整洁。“特殊名称”是一个空白列，其他列中存在缺失值。很可能，数据需要验证其有效性，并确保不包含任何错误信息。在本章后面的章节中，您将学习如何清理此类杂乱数据。

