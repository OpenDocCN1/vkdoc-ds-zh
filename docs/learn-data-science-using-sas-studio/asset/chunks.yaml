    在图中，`AGE_RANGE`变量的最后两个值是不需要的，并且会对这两个变量之间的关系给出错误印象。因此，我们应当将其过滤并从数据中移除。如图 3-6 所示，点击数据集下方的`Filter`按钮并输入以下内容：


