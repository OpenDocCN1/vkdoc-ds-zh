    Later in this chapter, we shall learn more about the `SET` statement.


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/SAS4Days/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    *creating age as a new variable;

    age=2020-YOB;

    run;

    data voters_retain;

    retain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG  DT_LAST_VPH;

    set voters_format;

    run;

    proc print data=voters_retain;

    run;

    Listing 6-5

    Retain Statement

    ```


    After running Listing [6-5](#501068_1_En_6_Chapter.xhtml#PC5) , age now is after
    YOB, as in Figure [6-7](#501068_1_En_6_Chapter.xhtml#Fig7). If you got an error,
    please check the file path in the INFILE statement. Change it to where the file
    is located on your machine.


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig7_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Voters dataset after reordering its variables to have age after YOB


    There are other ways to reorder the variables in the dataset. You can check them
    at this link:


    [`http://support.sas.com/kb/8/395.html`](http://support.sas.com/kb/8/395.html)


    ## IF Statement


    Now, this is the crucial section for data cleaning—the `IF` statement. There are
    three forms in which to use the `IF` statement:


    1.  `IF` (Condition) without `THEN` statement


    2.  `IF-THEN` statement


    3.  `IF-THEN-ELSE` statement'
