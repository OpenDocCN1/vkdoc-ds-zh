    Scatter plot of Maine counties and parties


    From Figure [3-9](#501068_1_En_3_Chapter.xhtml#Fig9), we can say that Cumberland
    County has the highest number of Democratic voters and the highest number of registered
    voters in general. This might imply that it has the largest population as well,
    but we cannot ensure that and will need further verification. However, we are
    sure that the difference between the Democrats and Republicans is enormous there.
    Other than this county, Democrats are more than the Republicans in eight of the
    remaining fifteen counties with small differences. Hence, Democrats have to give
    more care to Maine so it does not turn back to red.


    Similarly, you can do the same exercise with your state and get ready for the
    next presidential election with your own analysis and predictions.


    ## Histogram


    The Histogram task creates a chart that displays the frequency distribution of
    a numeric variable. For this example, we shall see how the annual wages of employees
    are being distributed in March 2018 in Charlotte, North Carolina.


    You will find the data file named City_Employee_Salaries_March_2018.csv in the
    “Datasets” folder. Or, you can download the CSV file from the Data.Gov project
    at the following URL: [`https://catalog.data.gov/dataset/city-employee-salaries-march-2018`](https://catalog.data.gov/dataset/city-employee-salaries-march-2018)


    Copy the CSV file to the “myfolders” folder. From SAS Studio, click Refresh, then
    import it as we explained in Chapter [2](#501068_1_En_2_Chapter.xhtml). Change
    the name of the dataset from IMPORT to Charlotte_wages.


    Click on Tasks and Utilities ➤ Graph ➤ Histogram. In Data, select WORK.CHARLOTTE_WAGES.
    To do that, as in Figure [3-3](#501068_1_En_3_Chapter.xhtml#Fig3), click on the
    small table beside the dataset name. Next, click on the + sign beside the Analysis
    Variable and select Annual_Rt, as in Figure [3-10](#501068_1_En_3_Chapter.xhtml#Fig10);
    then, click OK.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig10_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Select the analysis variable to plot its histogram


    Observe that SAS Studio auto-generated the code in the right-hand pane in the
    Code tab. Again, it uses `SG Plot`, but using the `histogram` keyword this time.
    Now, click Run. SAS Studio will plot the histogram in the Results tab, as in Figure
    [3-11](#501068_1_En_3_Chapter.xhtml#Fig11).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig11_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Histogram of Charlotte city employees


    ### Appearance Tab


    Let us enhance the appearance of the graph by comparing our histogram to the normal
    distribution and kernel estimates. Click on the Appearance tab. Select Normal
    and Kernel Density. Re-run the code. The output is similar to Figure [3-12](#501068_1_En_3_Chapter.xhtml#Fig12).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig12_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig12_HTML.jpg)


    Figure 3-12


    Normal and kernel density


    As in Figure [3-13](#501068_1_En_3_Chapter.xhtml#Fig13), change the title to “The
    Distribution of The Annual Rate of Charlotte City Employees.” Then, click on X-Axis
    and check “Show tick marks at bin midpoints.”


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig13_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig13_HTML.jpg)


    Figure 3-13


    Show tick marks


    Click on the Code tab. Observe how SAS Studio has changed the code according to
    your choices, as in Figure [3-14](#501068_1_En_3_Chapter.xhtml#Fig14).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig14_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig14_HTML.jpg)


    Figure 3-14


    Histogram code after changing the settings of the bin midpoints and the title


    Now, return to the Appearance tab. Change the number of bins to 20, as in Figure
    [3-15](#501068_1_En_3_Chapter.xhtml#Fig15). Re-run the code.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig15_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig15_HTML.jpg)


    Figure 3-15


    Number of bins


    Now, in the X-Axis section, change the maximum value to 140000, as in Figure [3-16](#501068_1_En_3_Chapter.xhtml#Fig16).
    Re-run.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig16_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig16_HTML.jpg)


    Figure 3-16


    Change the X-Axis maximum value


    Now, we have a more normal distribution curve than before, when we had a right-skewed
    curve.'
