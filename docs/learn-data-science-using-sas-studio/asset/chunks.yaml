    Click on `Tasks and Utilities` ➤ `Tasks` ➤ `Graph` ➤ `Series Plot`. In `Data`,
    select `SASHELP.STOCKS`, for X-axis, select `Date`, and for Y-axis, select `Close`,
    as in Figure [3-17](#501068_1_En_3_Chapter.xhtml#Fig17).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig17_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig17_HTML.jpg)


    Figure 3-17


    Series plot code


    Run the plot. The output is similar to Figure [3-18](#501068_1_En_3_Chapter.xhtml#Fig18).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig18_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig18_HTML.jpg)


    Figure 3-18


    Series plot output


    Let us explore the frequency of the stock and get the unique values of stocks.
    Click on `Tasks and Utilities` ➤ `Tasks` ➤ `Statistics` ➤ `One-Way Frequency`.
    In the `Analysis Variable`, click on the `+` sign and select `Stock`, as in Figure
    [3-19](#501068_1_En_3_Chapter.xhtml#Fig19).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig19_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig19_HTML.jpg)


