- fmt: '### Add a New Table to the Library


    After you have successfully created your new library, you can add new datasets
    or tables to it. There are two methods to achieve this task. The first method
    is done by code by adding a two-level name to your dataset in the data step and
    putting your library name as the first level and the dataset name as the second
    level.


    In a new program, type the code in Listing [2-5](#501068_1_En_2_Chapter.xhtml#PC5).
    The first code line adds a new table called `europeancars` to the `newlib` library
    that we created in the previous step. The second and third lines use the `SET`
    and `WHERE` statements, which we shall explain in detail later in the book in
    Chapter [6](#501068_1_En_2_Chapter.xhtml). For now, the `SET` statement copies
    all the contents of `sashelp.cars` to the `newlib.europeancars` table, where the
    `Origin` column equals `Europe` only.


    ```

    data newlib.europeancars;

    set sashelp.cars;

    where origin="Europe";

    run;

    Listing 2-5

    Add New Table to the Library

    ```


    Click `Run`. Click on the `newlib` library. You will find the dataset listed under
    it, as in Figure [2-28](#501068_1_En_2_Chapter.xhtml#Fig28). If you did not find
    it, click `Refresh`.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig28_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig28_HTML.jpg)


    Figure 2-28 Save a table to your new library


    Now, login to SAS Studio again or refresh the SAS Studio window. You should find
    the library and the table after signing in.


    The second method is by importing the dataset. Select `Files and Folders ➤ Import
    Data ➤ select the file name`, as in Figure [2-29](#501068_1_En_2_Chapter.xhtml#Fig29).
    Then click `Run`.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig29_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig29_HTML.jpg)


    Figure 2-29 Import data


    Click on `Select Files`, as in Figure [2-30](#501068_1_En_2_Chapter.xhtml#Fig30).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig30_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig30_HTML.jpg)


    Figure 2-30 Select our file from the Server Files and Folders tab


    Then, choose the file that you would like to import, as in Figure [2-31](#501068_1_En_2_Chapter.xhtml#Fig31).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig31_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig31_HTML.jpg)


    Figure 2-31 Select the file


    The default values in SAS Studio are that the library will be the temporary one,
    `Work`, and the dataset name will be `IMPORT<Number>` depending on the number
    of imports that you have done during the current session. You can change the defaults
    by clicking on the `Change` button, as in Figure [2-32](#501068_1_En_2_Chapter.xhtml#Fig32).
    Select one of your permanent libraries and rename the dataset to something more
    meaningful.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig32_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig32_HTML.jpg)


    Figure 2-32 Change the table and library names


    Moreover, if you scroll down, you will find more options to change, like the delimiter
    and the first row, as in Figure [2-33](#501068_1_En_2_Chapter.xhtml#Fig33).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig33_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig33_HTML.jpg)


    Figure 2-33 Import data options


    The auto-generated SAS variables’ names will be extracted from the first row in
    your data file. If your data file’s first row is data and not header names, you
    can uncheck that. In the code, in the data step, you can rename the variables
    using the `Rename` keyword.


    ### INFILE technique


    Equivalent to importing the file, you can use the `INFILE` statement. You set
    the delimiter and the first observation/row as options for the `INFILE` statement.
    You use the `INPUT` statement to change the variables’ names and their data types.
    Always remember that any `INFILE` statement is followed by an `INPUT` one.


    Let us try doing that step-by-step. In the `Datasets` folder, you will find a
    file with the name `Exam.txt`. You first upload the file, as we did in Figures
    [2-21](#501068_1_En_2_Chapter.xhtml#Fig21) and [2-22](#501068_1_En_2_Chapter.xhtml#Fig22).
    Get the file path by right-clicking on the file then click `Properties`, as in
    Figure [2-34](#501068_1_En_2_Chapter.xhtml#Fig34).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig34_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig34_HTML.jpg)


    Figure 2-34 Right-click on the file to get its properties


    Then, select the location and right-click ➤ `Copy`, as in Figure [2-35](#501068_1_En_2_Chapter.xhtml#Fig35).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig35_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig35_HTML.jpg)


    Figure 2-35 Copy the file location


    The `INFILE` statement syntax is as follows:


    ```

    INFILE  DLM= FIRSTOBS=

    ```


    Listing [2-6](#501068_1_En_2_Chapter.xhtml#PC7) shows an example of using the
    `INFILE` statement. The first code line will create a table called `examdata`
    saved in the temporary library `Work`. The second line uses the `INFILE` statement
    to specify the raw data file path, uses the option of `DLM` to indicate the delimiter
    used, and uses another option of `FIRSTOBS` to tell SAS Studio to import data
    rows starting from the second row. The delimiter in this file is a comma. The
    second row is our first row that contains data. Open `examdata.txt` and check
    it. The first row in the file is a header, not data. Let us get back to Listing
    [2-6](#501068_1_En_2_Chapter.xhtml#PC7). The third line uses the `INPUT` statement
    to specify the column names. The names should be separated using spaces. The data
    step ends with `RUN;` to tell SAS Studio that this is the last line in this step.


    ```

    data examdata;

    infile ''/folders/myfolders/sasuser.v94/Exam.txt'' dlm='','' firstobs=2;

    input year pass fail;

    run;

    Listing 2-6

    INFILE Statement

    ```


    Click `Run` to execute the program. The output is as in Figure [2-36](#501068_1_En_2_Chapter.xhtml#Fig36).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig36_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig36_HTML.jpg)


    Figure 2-36 The output of the INFILE statement


    Note that `FIRSTOBS` can be any number, not only zero or one. Assume that you
    have a big data file of a million rows while you only need to test your code on
    100 sample rows. You can set `FIRSTOBS=1000` to tell SAS Studio to start reading
    from row 1000 in that file. To indicate the last row, you use another option to
    the `INFILE` statement called `OBS`. The `INFILE` statement will be as follows:


    ```

    INFILE  FIRSTOBS=1000 OBS=1100;

    ```


    ## Summary


    This chapter represents the basic foundation of our journey in learning SAS Studio
    and SAS programming. It starts with the installation steps then explains the interface
    and the basic components of a SAS program. Also, it explains the data types and
    the libraries. In the next chapter, we shall dig deeper into the data visualization.


    # 3. Data Visualization


    There is an adage that says, “A picture is worth a thousand words.” Visualization
    is a tedious and harsh task in other programming endeavors. Luckily, SAS Studio
    can make pretty graphs easily through its integrated development environment (IDE).
    This chapter uses really big datasets that are available in the public domain.
    We shall follow the data science process mentioned in Chapter [1](#501068_1_En_1_Chapter.xhtml),
    where we start every section with a question and seek its answer through a graph.


    This chapter covers various essential charts, such as scatter plots, histograms,
    series plots, bar charts and sorted bar charts, bubble plots, and cluster analysis
    and dendrograms. Moreover, this chapter demonstrates how to display data onto
    maps, which is an extremely challenging task in other programming languages.'
