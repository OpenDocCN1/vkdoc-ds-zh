    ## 聚类分析


    聚类分析是一种无监督学习算法。监督学习用于预测，具有特定的输出/因变量，而无监督学习则用于数据探索。


    聚类在市场细分、基因和癌症研究中很受欢迎。例如，在在线商店中，你通常会发现自己正在查看的产品经常与其他列出的产品一起被购买。另一个例子是它在基因研究中的应用，用于发现基因之间的相似性。


    执行聚类分析最流行的方法是主成分分析、K 均值和层次分析。


    在 SAS Studio 中，你可以轻松完成所有这些操作。在本例中，你将学习如何进行层次分析。这主要包含两个步骤：上传干净的数据集，并将所有变量添加到聚类中，然后
    SAS Studio 会为你处理其余部分。


    点击 `Tasks and Utilities` ➤ `Tasks` ➤ `Cluster Analysis` ➤ `Cluster Variables`。`Cluster
    Variables` 任务的用户界面会打开。如图 3-49 所示，在 `Data` 选项卡上，选择 `SASHELP.CARS` 数据集。最后，在 `Variables
    to cluster` 部分选择你想要的所有变量。然后，点击 `Run`。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig49_HTML.jpg](img/501068_1_En_3_Fig49_HTML.jpg)


    **图 3-49** 聚类变量


    层次聚类有两种类型：凝聚型（自下而上）和分裂型（自上而下）。


    凝聚算法将每个点视为一个聚类，然后重复合并两个最近的聚类。分裂型从一个聚类开始，然后递归地将其拆分成更多分支。


    SAS Studio 使用分裂方法。输出结果清晰地解释了树的结构，以及每个分支如何被细分为更多分支。在本例中，如图 3-50 所示的输出结果显示，聚类被分成两个分支，在第二层级，每个分支又被分成更多分支。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig50_HTML.jpg](img/501068_1_En_3_Fig50_HTML.jpg)


    **图 3-50** 拆分聚类


    此外，SAS Studio 还会生成树状图，如图 3-51 所示。要按聚类形成的顺序来解读树状图，请从右向左阅读。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig51_HTML.jpg](img/501068_1_En_3_Fig51_HTML.jpg)


    **图 3-51** 树状图


    然而，要了解相似性，请从左向右阅读树状图。`马力`、`发票价格`和`厂商建议零售价`的聚类最相似，因为它的分支最短。同样，`长度`、`轴距`、`重量`、`MPG
    (高速公路)`、`MPG (城市)`、`气缸数`和`发动机排量`的聚类也具有相似性，并且其分支长度与前一聚类相同。第一个聚类具有最长分支。


    ## 本章小结


    本章深入研究了数据可视化。从最基础的图表（如散点图和直方图）开始，然后深入到更高级的图表（如地图）。此外，还展示了如何通过改变颜色和图案来叠加图表，以便于比较分析结果。SAS
    Studio 中的数据可视化是其最强大的功能之一，因为许多图表都可以通过集成开发环境完成，而无需编写任何代码。


    本章最后解释了数据科学中的一些关键概念，即监督学习和无监督学习。同时，也讨论了如何进行聚类分析。在下一章中，我们将阐述最重要的统计任务和线性模型。


