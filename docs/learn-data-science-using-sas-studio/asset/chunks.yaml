    ### 汇总统计


    汇总统计任务可对所有观测值及观测值组内的变量提供描述性统计。您还可以通过直方图或箱线图等图形化显示来汇总数据。


    在本示例中，我们回顾缅因州过去的选举情况，以探寻是否存在可预测的结果（模式）。数据集位于`Dataset`文件夹中，文件名为`Maine_Past_Elections.xlsx`。从
    SAS Studio 上传该文件，点击`Refresh`，然后按照第 2 章所述的方法导入。将数据集名称从`IMPORT`更改为`PAST_ELECTIONS`。Excel
    文件的内容如表 4-1 所示。


    表 4-1


    `Maine_Past_Elections.xlsx`


