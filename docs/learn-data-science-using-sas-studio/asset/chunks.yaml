    Return again to the series plot and let us enhance the graph upon this information.
    Since we have three stocks only, select `Group By Stock`, as in Figure [3-20](#501068_1_En_3_Chapter.xhtml#Fig20).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig20_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig20_HTML.jpg)


