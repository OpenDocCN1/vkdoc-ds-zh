- fmt: '# Linear Models


    ANOVA is short for ANalysis Of VAriance. A one-way ANOVA is used to test the difference
    between the means of two groups on a single variable. The T-test does this as
    well and is used more frequently than the ANOVA. However, some clients insist
    on asking for the ANOVA test with the T-test to compare both outputs for additional
    verification.


    ## One-Way ANOVA


    The one-way ANOVA task tests and provides graphs for differences among the means
    of a single categorical variable or a single continuous dependent variable.


    For this example, we inspect whether the smell sense changes with age. The dataset
    is in the `Dataset` folder and has the name `UPSIT.csv`. Or, you can run the code
    to create the dataset from the following URL: [`http://support.sas.com/documentation/cdl/en/statug/66859/HTML/default/viewer.htm#statug_glm_examples10.htm`](http://support.sas.com/documentation/cdl/en/statug/66859/HTML/default/viewer.htm%2523statug_glm_examples10.htm).


    From SAS Studio, upload the file and click `Refresh`, then import it, as we explained
    in Chapter [2](#501068_1_En_2_Chapter.xhtml). Change the name of the dataset from
    `IMPORT` to `UPSIT`.


    Click on `Tasks and Utilities` ➤ `Tasks` ➤ `Linear Models` ➤ `One-Way ANOVA`.
    In `Data`, select the `WORK.UPSIT` table, in `Roles`, select `smell` as the Dependent
    variable, and in `Categorical variable`, select `agegroup`, as in Figure [4-23](#501068_1_En_4_Chapter.xhtml#Fig23).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig23_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig23_HTML.jpg)


    Figure 4-23


    One-Way ANOVA Data tab


    Click `Run`. The output will be as in Figures [4-24](#501068_1_En_4_Chapter.xhtml#Fig24)
    to [4-28](#501068_1_En_4_Chapter.xhtml#Fig28). The figures indicate that the sense
    of smell significantly differs across the age groups. Figure [4-24](#501068_1_En_4_Chapter.xhtml#Fig24)
    shows that there are five age groups in this sample, with 180 observations. As
    usual, the null hypothesis is that there is no relationship between the olfactory
    sense and age. The alternate hypothesis is that there is a relationship between
    the two variables. The p-values, in Figure [4-24](#501068_1_En_4_Chapter.xhtml#Fig24),
    are all less than 0.05, which indicates that there is a relationship between the
    sense of smell and age.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig24_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig24_HTML.jpg)


    Figure 4-24


    Class-level information and p-values


    Figure [4-25](#501068_1_En_4_Chapter.xhtml#Fig25) shows clearly different degrees
    of variability for the olfactory index within different age groups, with the variability
    generally rising with age. The sense of smell weakens and decreases with older
    age.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig25_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig25_HTML.jpg)


    Figure 4-25


    Box plot of smell distribution


    Levene’s test is for equal age group variances, and Welch’s test is for equal
    age group means. They are shown in Figure [4-26](#501068_1_En_4_Chapter.xhtml#Fig26).
    The hypotheses of age effects for mean and variance of the olfactory index are
    both confirmed as the p-values in both tests are less than 0.0001.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig26_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig26_HTML.jpg)


    Figure 4-26


    Levene’s and Welch’s tests


    Figure [4-27](#501068_1_En_4_Chapter.xhtml#Fig27) shows no remarkable difference
    between the means of the first three groups, while the difference increases with
    groups four and five.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig27_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig27_HTML.jpg)


    Figure 4-27


    LS-Means for age group


    The Tukey diagram in Figure [4-28](#501068_1_En_4_Chapter.xhtml#Fig28) shows the
    mean difference between each of the groups. There is no significant difference
    between the first three groups, which are shown in the figure with red lines.
    However, there is a significant difference between the first three groups and
    groups four and five, which are shown in the figure with blue lines. The Tukey
    output is interactive in SAS Studio; roll your mouse over every line, and SAS
    Studio shows which two groups it is comparing.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig28_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig28_HTML.jpg)


    Figure 4-28


    Tukey-Kramer diagram'
