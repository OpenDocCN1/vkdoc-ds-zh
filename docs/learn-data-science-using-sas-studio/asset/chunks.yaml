- fmt: '# Data Science in Action


    In this chapter, we will introduce the case study of the book, which analyzes
    voters’ data in the state of Maine. It is based on a project I did at Harvard
    University in 2016 during my master’s degree. In fall 2016, the project for my
    “A Practical Approach to Data Science” course was to predict the presidential
    election results in every state. The project was under the guidance and supervision
    of Professor Larry Adams, who set the project milestones and requirements. I was
    responsible for forecasting Maine’s outcome for the 2016 and 2020 elections.


    The project was done in two phases. The first was to predict the results for the
    2016 election. After verifying our data and results against what actually happened
    in the election, the second phase started. It was to include the new data that
    was generated in 2016 and use it to predict the results of the year 2020. Therefore,
    some charts and exercises in this book include 2016 data. Whenever possible, I
    collected any related historic data. For the prediction, I used historic election
    data going back to 1960.


    I defined voters’ groups by age, gender, education, demographics, and race. After
    studying the state from reliable academic sources, I identified issue categories
    like the economy, education, the environment, health care, and gun control.


    Similarly, I listed the state’s issues that would influence the presidential election
    by using the county ballot topics. Using the voting patterns of each party since
    1960, poll accuracy, and the electoral votes, I tried different prediction methods
    and algorithms, such as Monte Carlo and Bayes, and statistical testing, such as
    T-test, chi-square, and others. Afterward, I had to compare my results to other
    forecast sites, like Five-Thirty-Eight. My prediction was correct for 2016.


    This project was an exciting experience in which I converted cognitive features
    to numbers and crunched them to come up with results. Similarly, through other
    data science projects, I learned how to predict outcomes so as to drive decision
    making based upon measuring trends and studying patterns.


    ## Data Science Process


    The data science process starts with forming a question or hypothesis, then collecting
    relevant raw data, then cleaning and exploring that data, then modeling and evaluating,
    then deploying, visualizing, and communicating results in reports, as shown in
    Figure 1-1.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig1_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig1_HTML.jpg)


    `Figure 1-1` Data science process


    Questions vary according to the field; for example:


    - Politics: Will Trump win in Maine in 2016 and 2020?

    - Facebook: How can you make people stay on Facebook longer?

    - Medical: Is this tumor cancer or not?

    - Hospital Management: How can you decrease patients’ wait lines so as to increase
    patients’ satisfaction?


    The second step is collecting raw data. For example, in the politics question:
    Will a particular candidate win in a certain state?


    Collecting all the voters’ information—age, race, education, income, gender, and
    industry—is a crucial step, as is collecting the ballot data and voting results
    from over the years. The more historical data we have, the more accurate our predictions
    are. Furthermore, we should collect information on the population distribution
    throughout the years.


    The third step is cleaning this raw data, from managing the missing values, outliers,
    repeated rows, and misspelled information, to adjusting the columns’ data types,
    unifying the format of the values, and so on.


    The fourth step is trying several models and comparing their results with each
    other, depending upon the problem’s nature. In the presidential election problem,
    I used Monte Carlo and Bayes algorithms.


    The fifth and final step is visualizing the results and communicating them in
    plain language in our reports. This step is the primary goal of the whole process
    because it holds the predictions to the answer to the first question that initiated
    the whole process.


    ## Case Study: Presidential Elections in Maine


    As I mentioned in the previous section, the data science process starts with a
    question. In this project, my question is: Will Donald Trump win in the state
    of Maine in the 2016 and 2020 presidential elections?'
  raw: '# 1. Data Science in Action


    In this chapter, we will introduce the case study of the book, which analyzes
    voters’ data in the state of Maine. It is based on a project I did at Harvard
    University in 2016 during my master’s degree. In fall 2016, the project for my
    “A Practical Approach to Data Science” course was to predict the presidential
    election results in every state. The project was under the guidance and supervision
    of Professor Larry Adams, who set the project milestones and requirements. I was
    responsible for forecasting Maine’s outcome for the 2016 and 2020 elections.


    The project was done in two phases. The first was to predict the results for the
    2016 election. After verifying our data and results against what actually happened
    in the election, the second phase started. It was to include the new data that
    was generated in 2016 and use it to predict the results of the year 2020\. Therefore,
    some charts and exercises in this book include 2016 data. Whenever possible, I
    collected any related historic data. For the prediction, I used historic election
    data going back to 1960.


    I defined voters’ groups by age, gender, education, demographics, and race. After
    studying the state from reliable academic sources, I identified issue categories
    like the economy, education, the environment, health care, and gun control.


    Similarly, I listed the state’s issues that would influence the presidential election
    by using the county ballot topics. Using the voting patterns of each party since
    1960, poll accuracy, and the electoral votes, I tried different prediction methods
    and algorithms, such as Monte Carlo and Bayes, and statistical testing, such as
    T-test, chi-square, and others. Afterward, I had to compare my results to other
    forecast sites, like Five-Thirty-Eight. My prediction was correct for 2016.


    This project was an exciting experience in which I converted cognitive features
    to numbers and crunched them to come up with results. Similarly, through other
    data science projects, I learned how to predict outcomes so as to drive decision
    making based upon measuring trends and studying patterns.


    ## Data Science Process


    The data science process starts with forming a question or hypothesis, then collecting
    relevant raw data, then cleaning and exploring that data, then modeling and evaluating,
    then deploying, visualizing, and communicating results in reports, as shown in
    Figure [1-1](#501068_1_En_1_Chapter.xhtml#Fig1).


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig1_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Data science process


    Questions vary according to the field; for example:


    *   Politics: Will Trump win in Maine in 2016 and 2020?


    *   Facebook: How can you make people stay on Facebook longer?


    *   Medical: Is this tumor cancer or not?


    *   Hospital Management: How can you decrease patients’ wait lines so as to increase
    patients’ satisfaction?


    The second step is collecting raw data. For example, in the politics question:
    Will a particular candidate win in a certain state?


    Collecting all the voters’ information—age, race, education, income, gender, and
    industry—is a crucial step, as is collecting the ballot data and voting results
    from over the years. The more historical data we have, the more accurate our predictions
    are. Furthermore, we should collect information on the population distribution
    throughout the years.


    The third step is cleaning this raw data, from managing the missing values, outliers,
    repeated rows, and misspelled information, to adjusting the columns’ data types,
    unifying the format of the values, and so on.


    The fourth step is trying several models and comparing their results with each
    other, depending upon the problem’s nature. In the presidential election problem,
    I used Monte Carlo and Bayes algorithms.


    The fifth and final step is visualizing the results and communicating them in
    plain language in our reports. This step is the primary goal of the whole process
    because it holds the predictions to the answer to the first question that initiated
    the whole process.


    ## Case Study: Presidential Elections in Maine


    As I mentioned in the previous section, the data science process starts with a
    question. In this project, my question is: Will Donald Trump win in the state
    of Maine in the 2016 and 2020 presidential elections?'
  trans: '

    # 数据科学实战


    在本章中，我们将介绍本书的案例研究，该研究分析了缅因州选民的数据。它基于我 2016 年在哈佛大学攻读硕士学位期间完成的一个项目。2016 年秋季，我的《数据科学实践方法》课程作业是预测每个州的总统选举结果。该项目在拉里·亚当斯教授的指导和监督下进行，由他设定了项目的里程碑和要求。我负责预测缅因州在
    2016 年和 2020 年选举中的结果。


    该项目分两个阶段进行。第一阶段是预测 2016 年的选举结果。在将我们的数据和结果与实际选举结果进行验证后，第二阶段便开始了。这一阶段需要纳入 2016 年产生的新数据，并利用这些数据预测
    2020 年的结果。因此，本书中的一些图表和练习包含了 2016 年的数据。只要有可能，我就收集了所有相关的历史数据。在预测过程中，我使用了可追溯至 1960
    年的历史选举数据。


    我按年龄、性别、教育水平、人口统计特征和种族划分了选民群体。在通过可靠的学术资料研究了该州的情况后，我确定了经济、教育、环境、医疗保健和枪支管控等议题类别。


    同样，我利用县级选票议题，列出了会影响总统选举的该州议题。根据自 1960 年以来各政党的投票模式、民调准确性和选举人票，我尝试了不同的预测方法和算法，如蒙特卡洛法和贝叶斯法，以及统计检验方法，如
    T 检验、卡方检验等。之后，我不得不将自己的结果与其他预测网站（如 Five-Thirty-Eight）进行对比。我的预测在 2016 年是准确的。


    这个项目是一次激动人心的经历，我将认知特征转化为数字，并通过对这些数据进行计算得出结果。同样，通过其他数据科学项目，我学会了如何基于测量趋势和研究模式来预测结果，从而推动决策制定。


    ## 数据科学流程


    数据科学流程始于提出一个问题或假设，然后收集相关的原始数据，接着清洗和探索这些数据，再进行建模和评估，最后部署、可视化并在报告中传达结果，如图 1-1 所示。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig1_HTML.jpg](img/501068_1_En_1_Fig1_HTML.jpg)


    `图 1-1` 数据科学流程


    问题因领域而异；例如：


    - 政治：特朗普会在 2016 年和 2020 年赢得缅因州吗？

    - 脸书：如何让人们更长时间地停留在脸书上？

    - 医疗：这个肿瘤是癌症与否？

    - 医院管理：如何减少患者等待时间，从而提高患者满意度？


    第二步是收集原始数据。例如，在政治问题中：某位特定候选人会赢得某个州吗？


    收集所有选民的信息——年龄、种族、教育程度、收入、性别和行业——是至关重要的一步，同时收集历年的选票数据和投票结果也同样重要。我们拥有的历史数据越多，预测就越准确。此外，我们还应该收集多年间的人口分布信息。


    第三步是清洗这些原始数据，包括处理缺失值、异常值、重复行和拼写错误的信息，调整列的数据类型，统一值的格式等。


    第四步是尝试多种模型，并根据问题的性质将它们的相互结果进行比较。在总统选举问题中，我使用了蒙特卡洛和贝叶斯算法。


    第五步也是最后一步，是在我们的报告中以平实的语言将结果可视化并进行传达。这一步是整个流程的主要目标，因为它包含了对最初引发整个流程的第一个问题的预测答案。


    ## 案例研究：缅因州总统选举


    正如我在上一节中提到的，数据科学流程始于一个问题。在这个项目中，我的问题是：唐纳德·特朗普会在 2016 年和 2020 年的总统选举中赢得缅因州吗？

