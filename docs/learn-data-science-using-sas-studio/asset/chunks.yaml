    ### IF-THEN 语句


    如前所述，“Age”列中有一位选民的年龄存在明显错误值（340岁）。要修正此问题，如果数据集是真实的，我们会有以下几种选择：


    1.  通过联系缅因州州务卿办公室或联系该选民来获取正确的年龄。

    2.  移除该值，并用点号（`.`）代替以表示缺失数据，如第[5](#501068_1_En_5_Chapter.xhtml)章所述。SAS 中缺失数据的惯例是：数值型缺失值用点号表示，字符型缺失值用空白表示。

    3.  另一种解决方案是删除整行。

    4.  保留该值。但是，该值将成为一个异常值，并影响分析（例如分析年龄、政党和预期投票率之间的关系）。


    在本例中，我们将该值视为缺失值。为此，我们使用`IF-THEN`语句，如代码清单[6-7](#501068_1_En_6_Chapter.xhtml#PC8)所示。


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/sasuser.v94/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    *creating age as a new variable;

    age=2020-YOB;

    run;

    data voters_retain;

    retain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG  DT_LAST_VPH;

    set voters_format;

    *T clean this outlier, we mark it as a missing data;

    if age= 340 then age=.;

    run;

    proc print data=voters_retain;

    run;

    Listing 6-7

    IF-THEN Statement Example

    ```


    运行代码清单[6-7](#501068_1_En_6_Chapter.xhtml#PC8)后，该值将变为缺失值，如图[6-13](#501068_1_En_6_Chapter.xhtml#Fig13)所示。


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig13_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig13_HTML.jpg)


    **图 6-13** 将错误值设为缺失值


    另一种解决方案是使用`DELETE`语句删除整行，如代码清单[6-8](#501068_1_En_6_Chapter.xhtml#PC9)所示。


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/sasuser.v94/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    *creating age as a new variable;

    age=2020-YOB;

    run;

    data voters_retain;

    retain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG  DT_LAST_VPH;

    set voters_format;

    *Delete the whole row;

    if age= 340 then Delete;

    run;

    proc print data=voters_retain;

    run;

    Listing 6-8

    Delete the Whole Row of the Wrong Age Value

    ```


    运行代码清单[6-8](#501068_1_En_6_Chapter.xhtml#PC9)后，整行被删除，如图[6-14](#501068_1_En_6_Chapter.xhtml#Fig14)所示。


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig14_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig14_HTML.jpg)


