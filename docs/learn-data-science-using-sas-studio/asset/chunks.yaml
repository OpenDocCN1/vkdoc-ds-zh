  raw: '## SAS Certification


    After finishing this book, you will have covered almost all the topics required
    for the following two certifications:


    1.  [SAS Certified Specialist:​ Base Programming Using SAS](https://www.sas.com/en_us/certification/credentials/foundation-tools/base-programming-credentials.html)


    2.  [SAS Certified Advanced Programmer for SAS 9](https://www.sas.com/en_us/certification/credentials/foundation-tools/advanced-programmer.html)


    The required topics for the Base Programming exam are:


    *   Read and create data files.


    *   Manipulate and transform data.


    *   Create basic detail and summary reports using Base SAS procedures.


    *   Identify and correct syntax and programming logic errors.


    The required topics for Advanced Programmer are:


    *   Using advanced data step programming statements and efficiency techniques
    to solve complex problems.


    *   Writing and interpreting SAS SQL code.


    *   Creating and using the SAS MACRO facility. (This topic is the only one that
    is not discussed in this book.)


    SAS Certification credentials are globally recognized as the premier means of
    validating your SAS knowledge and accessing higher-paying job opportunities. Of
    all skills considered by employers, SAS is one of the most valuable in terms of
    salary. Please check this link as well: [`https://www.sas.com/en_us/careers.html`](https://www.sas.com/en_us/careers.html).


    I am certified by Microsoft, Oracle, and Docker in tens of tracks. The safest
    and fastest way to get certified is to study from braindumps. You can buy them
    online. The braindumps are pools of actual exam questions and their correct answers.
    Do not memorize the answers because you might not get the same questions. Instead,
    research the questions that you do not know and try to understand their answers.
    Remember that in the end, at work, your knowledge will be tested and not your
    memory.


    ## Stay in Touch


    Please stay in touch. Let me know if I can help you in any way. I am always glad
    to give a hand.


    My email: efoda@ieee.org.My website: [`www.engyfoda.com`.](http://www.engyfoda.com)My
    LinkedIn: [`https://www.linkedin.com/in/engyfouda/`.](https://www.linkedin.com/in/engyfouda/)


    ## Summary


    In this chapter, we talked about how to write your reports with your audience
    in mind. Then, we talked about the next steps in your data science career. You
    can do ahead to academic certificates or technical ones to prove your experience
    and work on real-world projects under mentoring. Moreover, we talked about how
    to make money online through your data science experience. Wish you best of luck!


