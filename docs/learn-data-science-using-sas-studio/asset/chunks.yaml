    清单 2-6 展示了一个使用 `INFILE` 语句的示例。第一行代码将创建一个名为 `examdata` 的表，并保存在临时库 `Work` 中。第二行使用
    `INFILE` 语句指定原始数据文件的路径，使用 `DLM` 选项指示所使用的分隔符，并使用另一个选项 `FIRSTOBS` 告诉 SAS Studio
    从第二行开始导入数据行。该文件的分隔符是逗号。第二行是我们的第一行数据。打开 `examdata.txt` 并检查它。文件中的第一行是标题，不是数据。让我们回到清单
