    # 2. Getting Started


    SAS Studio enables you to import and export raw data files, manipulate and transform
    data, combine SAS data sets, create summary reports using SAS procedures, identify
    and correct data, and debug syntax and programming logic errors. Moreover, it
    enables you to do visualizations, including maps, in easier steps than other programming
    languages such as R or Python. However, it has a programming editor as well to
    customize and write your own code if needed.


    ## How Do You Install SAS Studio?


    The installation comprises four steps. You can follow them step-by-step at the
    following URL: [`https://www.sas.com/en_us/software/university-edition/download-software.html`](https://www.sas.com/en_us/software/university-edition/download-software.html).


    As the installation steps can change, it is better to consult this URL for the
    latest updated online guide.


    ## What Is SAS and SAS Studio?


    SAS stands for Statistical Analysis System, and SAS Studio is its interface. SAS
    Studio has a powerful integrated development environment (IDE), which includes
    both the tasks’ graphical user interface (GUI) and the code editor. If you use
    the GUI, which uses the point-and-click approach, SAS Studio auto-generates the
    equivalent code for you. Or, you can use the code editor to write your own code.


    Throughout the book, we will go through both approaches: using the GUI and writing
    code. For the examples that use the GUI, we will explain the generated code. For
    some advanced examples or user-customized ones that can be done solely by code,
    I shall explain the required code line by line, along with the procedures and
    their options.


    It is worth mentioning that SAS Studio also has two modes: the SAS Programmer
    and the Visual Programmer. The Visual Programmer mode uses the drag-and-drop method.
    You can change the mode from the drop-down menu in the upper bar on the right.
    However, the book focuses on the SAS Programmer mode.'
  trans: '

    ### 建模


    在建模时，最好尝试不同的预测算法并比较其结果，而不是只依赖单一模型。在这个项目中，我使用了 `Monte Carlo` 和 `Bayes` 算法。


    对于统计检验，我使用了以下方法：


    -   直方图

    -   箱线图

    -   比例检验

    -   T 检验

    -   决策树

    -   卡方检验

    -   散点图和线性回归


    ### 我的 2016 年预测


    在 `SAS University Edition` 中使用过去的选举结果运行 `Monte Carlo` 算法后，输出如图 1-11 所示。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig11_HTML.jpg](img/501068_1_En_1_Fig11_HTML.jpg)


    *图 1-11 Monte Carlo 算法的 2016 年预测结果*


    图 1-11 显示，`Hillary Clinton` 将以平均 52.14%的得票率赢得缅因州。实际上，她的得票率仅为 48%。因此，模拟检测到了她赢得缅因州，并且她确实赢了。因此，我在这项目中获得了满分，课程也得了
    A。太棒了！


    ### 我的 2020 年预测


    我预测民主党将以 50.8%的得票率赢得缅因州四张选举人票中的三张，如图 1-12 所示。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig12_HTML.jpg](img/501068_1_En_1_Fig12_HTML.jpg)


    *图 1-12 Monte Carlo 算法的 2020 年预测结果*


    缅因州的概率是，民主党将在 2020 年以大约高出共和党+3%的微弱优势获胜，而 1960 年至 2016 年的历史数据显示，缅因州民主党的平均得票率约为
    43%，共和党的平均得票率为 40%。这与 2016 年缅因州民主党与共和党之间的差距相同。


    然而，如果民主党不小心，缅因州可能会倒向共和党。


    ## 总结


    本章重点阐述了缅因州总统选举项目案例研究的主要思路及其图表。在下一章中，我们将了解如何安装 `SAS Studio` 并编写我们的第一个 SAS 程序。


    ## 2. 入门


    `SAS Studio` 使您能够导入和导出原始数据文件、操作和转换数据、组合 SAS 数据集、使用 SAS 过程生成摘要报告、识别和纠正数据，以及调试语法和编程逻辑错误。此外，它还让您能够更轻松地完成可视化（包括地图），步骤比
    `R` 或 `Python` 等其他编程语言更简单。不过，它也有一个编程编辑器，以便在需要时自定义和编写您自己的代码。


    ### 如何安装 SAS Studio？


    安装包括四个步骤。您可以通过以下网址逐步操作：[`www.sas.com/en_us/software/university-edition/download-software.html`](https://www.sas.com/en_us/software/university-edition/download-software.html)。


    由于安装步骤可能会发生变化，最好查阅此网址以获得最新的在线指南。


    ### 什么是 SAS 和 SAS Studio？


    `SAS` 代表统计分析系统（Statistical Analysis System），`SAS Studio` 是其界面。`SAS Studio` 拥有一个强大的集成开发环境（IDE），其中既包含任务的图形用户界面（GUI），也包含代码编辑器。如果您使用采用“点击”方式的
    GUI，`SAS Studio` 会自动为您生成相应的代码。或者，您也可以使用代码编辑器编写自己的代码。


    在本书中，我们将介绍两种方法：使用 GUI 和编写代码。对于使用 GUI 的示例，我们将解释生成的代码。对于某些高级示例或仅能通过代码完成的用户自定义示例，我将逐行解释所需的代码，以及相关的过程和选项。


    值得一提的是，`SAS Studio` 还有两种模式：`SAS Programmer`（SAS 程序员）和 `Visual Programmer`（可视化程序员）。`Visual
    Programmer` 模式使用拖放方法。您可以从右上角顶栏的下拉菜单中更改模式。然而，本书重点介绍的是 `SAS Programmer` 模式。

    '
- fmt: '# Tour


    The SAS Studio interface is basically divided into two vertical panes. The first
    one is the navigation pane, which has several tabs; for example, `Server Files
    and Folders`, `Tasks and Utilities`, `Snippets`, and `Libraries`. The second one
    is the work area, which displays the programs’ editor/code, log, and results.


    The `Server Files and Folders` tab contains all the folders and subfolders that
    are inside the shared folder that you have created on your machine. Remember that
    SAS Studio runs inside a virtual machine; hence, it does not see your operating
    system files and folders by default. It sees only what is inside that shared folder.
    Later in this chapter, you will learn several ways to import files from your operating
    system to the virtual machine where SAS Studio runs and vice versa. After doing
    so, you will be able to use the files inside SAS Studio.


    The `Tasks and Utilities` tab has task GUIs that you can use within the SAS Studio
    IDE. Later in this chapter and the book, you will learn how this tab eases your
    data science process, and how, with a few mouse clicks, it helps you to finish
    most of the essential steps to explore, clean, and process your data and help
    you to make your predictions.


    The `Snippets` tab has some of the most-used tasks as ready-made code for you.
    You can reuse this code for your datasets and customize them. You will learn more
    about it later in this chapter.


    The `Libraries` tab is where the datasets, that SAS Studio uses to execute the
    tasks and utilities, are located.


    After you successfully install the SAS Studio inside the virtual machine, click
    on `Libraries` in the left pane. Then click on `SASHELP`, then `CARS`. You will
    have a table viewer, as in Figure [2-1](#501068_1_En_2_Chapter.xhtml#Fig1), displaying
    a dataset that has information about cars. The middle pane shows the columns of
    that dataset. By default, `"Select all"`, highlighted with red in Figure [2-1](#501068_1_En_2_Chapter.xhtml#Fig1)
    to the left, is selected. Now, uncheck it and check `"Make"` and `"Model"` only.
    The right pane will show the data of these two columns only. Try to resize them.
    You can drag any of the columns to the left or to the right to rearrange them.
    You can sort any column ascending or descending by clicking on the column name.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig1_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig1_HTML.jpg)


    **Figure 2-1** SAS Studio interface


    Now, click on the icon highlighted in Figure [2-1](#501068_1_En_2_Chapter.xhtml#Fig1)
    in the middle. This icon is the Expand/Collapse button. The first time you click
    on it, the left pane will collapse, giving you an expanded view of the task that
    you are working on. If you click on it a second time, the pane will be back.


    Another way to view the data is by using code. Let us write our first SAS code.
    The third icon from the left, when you click on it, will display a drop-down menu,
    as shown in Figure [2-2](#501068_1_En_2_Chapter.xhtml#Fig2).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig2_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig2_HTML.jpg)


    **Figure 2-2** Open a new SAS program


    Click on `New SAS Program` and start typing `"pr"`, as in Figure [2-3](#501068_1_En_2_Chapter.xhtml#Fig3).
    You will find that helping menus pop up, showing the keywords to autocomplete
    what you are typing, along with an explanation and additional links for examples
    and documentation, as shown in Figure [2-3](#501068_1_En_2_Chapter.xhtml#Fig3).
    This feature is useful for beginners.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig3_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig3_HTML.jpg)


    **Figure 2-3** Autocomplete feature and helpful pop-up menus


    However, when you get more experienced and familiar with SAS Studio and would
    like to disable it, you can do that by clicking on `Preferences`, as shown in
    Figure [2-4](#501068_1_En_2_Chapter.xhtml#Fig4).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig4_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig4_HTML.jpg)


    **Figure 2-4** Preferences


    Now, click on `Code and Log` and uncheck `"Enable autocomplete (CTRL + spacebar
    or Command + spacebar)"`, as shown in Figure [2-5](#501068_1_En_2_Chapter.xhtml#Fig5).
    As this book targets the beginners, we will not change the defaults.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig5_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig5_HTML.jpg)


    **Figure 2-5** Code and Log to enable or disable code autocomplete


    Now, type in the code shown in Listing [2-1](#501068_1_En_2_Chapter.xhtml#PC1).


