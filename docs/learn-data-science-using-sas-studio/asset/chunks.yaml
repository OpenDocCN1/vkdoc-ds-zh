    background and yellow font, as in Figure [8-9](#501068_1_En_8_Chapter.xhtml#Fig9).


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig9_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig9_HTML.jpg)


    Figure 8-9


    Enhance the report background


    Scroll down the options to the Layout section and uncheck “Avoid Scrollbars,”
    as in Figure [8-10](#501068_1_En_8_Chapter.xhtml#Fig10). This is crucial, as when
    you leave the default option, the plots and reports are not displayed clearly.
    Moreover, it locks the resizing features of the report sections. Hence, it is
    better to uncheck this option to be able to control the dimensions of your report.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig10_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig10_HTML.jpg)


    Figure 8-10


    Uncheck “Avoid Scrollbars”


    Feel free to check out the rest of the options of the report and explore how to
    enhance the look of it.


    ### Histogram


    On the left pane, click on Objects ➤ Histogram, as in Figure [8-11](#501068_1_En_8_Chapter.xhtml#Fig11).
    Drag it onto your report in the contents pane. It does not display anything until
    you assign a role for it, as in the next step.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig11_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig11_HTML.jpg)


    Figure 8-11


    Histogram


    On the right pane, click on Roles to assign the Measure, as in Figure [8-12](#501068_1_En_8_Chapter.xhtml#Fig12).
    For histograms, only numeric values are allowed. Hence, Age is the only feasible
    variable in this dataset.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig12_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig12_HTML.jpg)


    Figure 8-12


    Only numeric values are allowed as a histogram’s measure


    SAS Visual Statistics generates a plot, as in Figure [8-13](#501068_1_En_8_Chapter.xhtml#Fig13),
    showing that the highest age range that experienced accidental drug-related deaths
    in the state of Connecticut between the years 2016 and 2018 is 31–34 years old.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig13_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig13_HTML.jpg)


    Figure 8-13


    The age distribution of people who died with drug overdose in Connecticut in years
    2016–2018


    Note


    To see Figures [8-13](#501068_1_En_8_Chapter.xhtml#Fig13), [8-14](#501068_1_En_8_Chapter.xhtml#Fig14),
    and [8-15](#501068_1_En_8_Chapter.xhtml#Fig15) in color, please access this book’s
    source code.


    To enhance the appearance of the title, double click on it, and a menu pops up,
    as in Figure [8-14](#501068_1_En_8_Chapter.xhtml#Fig14). Change the color, and
    make it bold and centered.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig14_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig14_HTML.jpg)


    Figure 8-14


    Enhance the title appearance


    As you can see in Figure [8-15](#501068_1_En_8_Chapter.xhtml#Fig15), the title
    is more clear now.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig15_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig15_HTML.jpg)


    Figure 8-15


    The final look of this part of the report


    ### Word Cloud


    The word cloud is an exciting feature of the natural language processing of character
    variables. It displays the most frequently used words in any variable larger than
    the rest of the words. Again, from the right pane, click on Objects ➤ Word Cloud,
    as in Figure [8-16](#501068_1_En_8_Chapter.xhtml#Fig16). Drag it to the report.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig16_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig16_HTML.jpg)


    Figure 8-16


    Word cloud


    Assign a role to it from the right pane. Select Roles, and in Word, select DeathCity,
    as in Figure [8-17](#501068_1_En_8_Chapter.xhtml#Fig17).


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig17_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig17_HTML.jpg)


    Figure 8-17


    Choose DeathCity column from the dataset


    The word cloud, as in Figure [8-18](#501068_1_En_8_Chapter.xhtml#Fig18), shows
    that Hartford is where these lethal drug-related deaths most often happen, followed
    by New Haven, Bridgeport, and Waterbury. This cloud can help law enforcement to
    increase surveillance in these cities. Furthermore, you can add a plot of the
    most recurring dates and times to check if there is a relationship between certain
    holidays or times and these incidents. You can dig more by tracking down the streets
    to identify if there are certain locations that sell drugs in these cities.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig18_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig18_HTML.jpg)


    Figure 8-18


    Cities that have higher numbers of drug-related mortalities are in a larger font
    than others


    Note


    To see Figure [8-18](#501068_1_En_8_Chapter.xhtml#Fig18) in color, please access
    this book’s source code.'
  trans: '

    # SAS Visual Statistics：首个报告


    现在，为了返回 Visual Statistics 来编写我们的第一个交互式报告，我们需要上传数据集。在本节中，我们使用“康涅狄格州意外药物相关死亡”数据集。


    你可以从以下链接下载 CSV 文件：


    [`https://catalog.data.gov/dataset/accidental-drug-related-deaths-january-2012-sept-2015`](https://catalog.data.gov/dataset/accidental-drug-related-deaths-january-2012-sept-2015)


    不过，我们只使用 2016 年至 2018 年的数据。你可以在“Datasets”文件夹中找到名为 `Accidents_Drugs_CT.csv` 的数据集。如上一节所述，点击三条横线；选择“管理数据”，如下图
    8-6 所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig6_HTML.jpg](img/501068_1_En_8_Fig6_HTML.jpg)


    图 8-6：管理数据


    点击“导入” ➤ “本地文件”，如下图 8-7 所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig7_HTML.jpg](img/501068_1_En_8_Fig7_HTML.jpg)


    图 8-7：导入 2016-2018 年康涅狄格州药物过量意外死亡数据集


    然后，点击“导入项”。接着，点击三条横线，然后点击“探索和可视化”，如下图 8-8 所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig8_HTML.jpg](img/501068_1_En_8_Fig8_HTML.jpg)


    图 8-8：探索和可视化


    在右侧窗格中，点击“选项”，如下图 8-9 所示，以更改报告的背景颜色和字体。我们选择深灰色背景和黄色字体，如下图 8-9 所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig9_HTML.jpg](img/501068_1_En_8_Fig9_HTML.jpg)


    图 8-9：增强报告背景


    向下滚动选项至“布局”部分，并取消勾选“避免滚动条”，如下图 8-10 所示。这一点至关重要，因为如果你保留默认选项，图表和报告将无法清晰显示。此外，它还会锁定报告部分的调整大小功能。因此，最好取消勾选此选项，以便能够控制报告的尺寸。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig10_HTML.jpg](img/501068_1_En_8_Fig10_HTML.jpg)


    图 8-10：取消勾选“避免滚动条”


    请随意查看报告的其他选项，并探索如何增强其外观。


    ## 直方图


    在左侧窗格中，点击“对象” ➤ “直方图”，如下图 8-11 所示。将其拖放到内容窗格的报告中。在为其分配角色之前，它不会显示任何内容，如下一步所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig11_HTML.jpg](img/501068_1_En_8_Fig11_HTML.jpg)


    图 8-11：直方图


    在右侧窗格中，点击“角色”来分配度量，如下图 8-12 所示。对于直方图，只允许使用数值。因此，`Age` 是该数据集中唯一可行的变量。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig12_HTML.jpg](img/501068_1_En_8_Fig12_HTML.jpg)


    图 8-12：只有数值才能作为直方图的度量


    SAS Visual Statistics 生成一个图，如下图 8-13 所示，显示 2016 年至 2018 年间康涅狄格州发生意外药物相关死亡的最高年龄段是
    31-34 岁。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig13_HTML.jpg](img/501068_1_En_8_Fig13_HTML.jpg)


    图 8-13：2016-2018 年康涅狄格州药物过量死亡人员的年龄分布


    > **注意：** 要查看彩色版图 8-13、8-14 和 8-15，请访问本书的源代码。


    为增强标题外观，双击标题，会弹出菜单，如下图 8-14 所示。更改颜色，并设置为粗体且居中。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig14_HTML.jpg](img/501068_1_En_8_Fig14_HTML.jpg)


    图 8-14：增强标题外观


    如图 8-15 所示，标题现在更加清晰。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig15_HTML.jpg](img/501068_1_En_8_Fig15_HTML.jpg)


    图 8-15：报告此部分的最终效果


    ## 词云


    词云是字符变量自然语言处理的一个激动人心的功能。它显示任何变量中出现频率最高的词，其字号大于其他词。再次从右侧窗格中，点击“对象” ➤ “词云”，如下图 8-16
    所示。将其拖到报告中。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig16_HTML.jpg](img/501068_1_En_8_Fig16_HTML.jpg)


    图 8-16：词云


    从右侧窗格为其分配角色。选择“角色”，然后在“词”中，选择 `DeathCity`，如下图 8-17 所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig17_HTML.jpg](img/501068_1_En_8_Fig17_HTML.jpg)


    图 8-17：从数据集中选择 `DeathCity` 列


    词云如下图 8-18 所示，显示哈特福德是这些致命药物相关死亡事件最常发生的城市，其次是纽黑文、布里奇波特和沃特伯里。该词云可以帮助执法部门加强这些城市的监控。此外，你可以添加最常发生日期和时间的图表，以检查某些节假日或时间与这些事件之间是否存在关系。你可以通过追踪街道来深入挖掘，以识别这些城市中是否存在某些地点出售毒品。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig18_HTML.jpg](img/501068_1_En_8_Fig18_HTML.jpg)


    图 8-18：药物相关死亡率较高的城市名称字号大于其他城市


    > **注意：** 要查看彩色版图 8-18，请访问本书的源代码。

