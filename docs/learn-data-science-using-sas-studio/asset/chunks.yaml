    ### 条形图


    另一个要展示的图表是条形图。同样，从左侧窗格中选择 `Objects ➤ Graphs ➤ Bar Chart`，如图 8-19 所示。用鼠标将条形图拖拽到内容窗格中。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig19_HTML.jpg](img/501068_1_En_8_Fig19_HTML.jpg)


    图 8-19


    条形图


    拖拽后，系统会提示您尚未分配角色。从右侧窗格中选择 `Roles`。对于 `Category`，选择 `Race`，如图 8-20 所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig20_HTML.jpg](img/501068_1_En_8_Fig20_HTML.jpg)


    图 8-20


    从数据集中选择种族


    默认情况下，SAS Visual Statistics 中的条形图是水平方向的。在右侧窗格中，点击 `Options ➤ Bar`。点击 `Vertical
    direction`，如图 8-21 所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig21_HTML.jpg](img/501068_1_En_8_Fig21_HTML.jpg)


    图 8-21


    将条形图方向更改为垂直


    调整图表及其标题的大小和外观，使其更加清晰，如图 8-22 所示。该图显示，白人因药物过量死亡的人数比其他任何种族都多。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig22_HTML.jpg](img/501068_1_En_8_Fig22_HTML.jpg)


    图 8-22


    药物过量死亡的种族分布


    **注意**


    要查看图 8-22 的彩色版本，请访问本书的源代码。


    ### 蝴蝶图


    蝴蝶图显示两个共享类别轴的条形图，以便在它们之间进行比较。这两个条形图的基线位于图表的中心。点击 `Objects ➤ Graphs ➤ Butterfly
    Chart`，如图 8-23 所示。将其拖拽到报告中，放在之前图表的下方或任意图表旁边。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig23_HTML.jpg](img/501068_1_En_8_Fig23_HTML.jpg)


    图 8-23


    蝴蝶图


    在右侧窗格中，选择 `Roles`，然后在 `Category` 中选择 `Sex`，如图 8-24 所示。在 `Measure (bar)` 中选择 `Age`，在
    `(bar2)` 中选择 `Frequency`，如图 8-24 所示。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig24_HTML.jpg](img/501068_1_En_8_Fig24_HTML.jpg)


    图 8-24


    蝴蝶图将显示哪个性别的药物过量情况更严重


    图 8-25 显示，男性因致命药物过量致死的情况比女性更严重。


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig25_HTML.jpg](img/501068_1_En_8_Fig25_HTML.jpg)


    图 8-25


    男性药物过量致死人数远超女性


    ## 总结


    本章介绍了 SAS Viya，这是一款一体化产品。它其中也包含了 SAS Studio。我们讨论了分级统计地图，这些在 SAS Studio 的免费版本中无法使用。此外，我们创建了一个报告，其中包含了一个工作表中的多个信息图。它有一些有趣的功能，例如词云。在下一章中，我们将讨论阅读本书后下一步该做什么，以及如何继续学习使用
    SAS 进行数据科学，并如何为自己寻找数据科学的工作。


    # 9. 下一步是什么？


    正如我们在第 1 章中讨论的，数据科学过程始于一个问题或假设。然后，您尽可能多地收集相关原始数据，接着进行清洗和探索。第四阶段是建模和评估。最后一步是部署、可视化，并在报告中交流结果，如图
    9-1 所示。


    ![../images/501068_1_En_9_Chapter/501068_1_En_9_Fig1_HTML.jpg](img/501068_1_En_9_Fig1_HTML.jpg)


    图 9-1


    数据科学过程


    值得一提的是，数据科学过程的前三个阶段被称为数据分析，而建模和评估阶段则是数据科学。结果的可视化和报告是数据科学和数据分析的共同点。


    因此，数据分析更侧重于分析我们已经拥有的真实历史数据，而数据科学的范围是预测未来。在本书中，我们在第 7 章和第 8 章中介绍了建模和评估阶段。此外，我们在第
    3 章中讨论了监督式算法与非监督式算法之间的区别。


    然而，作为一名数据科学家，您还应该了解许多其他数据科学算法；例如，决策树、支持向量机和神经网络。如果您对图像分析感兴趣，请继续学习深度学习和 TensorFlow。


    ## 报告：如何呈现你的结果？


    在整本书中，我们在多个章节中讨论了报告。在本节中，我们将这些散落的拼图碎片组合起来，以了解在 SAS Studio 中编写报告相比其他语言是多么容易。


    在 SAS Studio 中，编译报告比其他数据科学语言容易得多。例如，在 R 中，要编译一个收集所有图表、统计分析和推断的报告，您需要使用 Markdown
    最终生成一个 HTML 文档。如果新接触数据科学的人不熟悉 HTML 代码，那么添加公司徽标并遵循报告模板可能会很麻烦。而在 SAS Studio 中，正如我们在第
    2 章的图 2-7 中所提到的，报告输出可以是 RTF、PDF 或 HTML 格式。在任何文字处理应用程序中编辑 RTF 文件，都比编辑嵌入在代码中的内容容易得多；例如，添加公司徽标、任何额外文本和推断。


    要制作一个包含多个部分的完整分析报告，您可以使用 SAS Studio 图形用户界面将每个部分作为一个独立的程序来执行。例如，在一个程序中，您可以使用单变量频数创建统计分析。在另一个程序中，您可以制作直方图。在第三个程序中，您可以使用地图进行可视化，依此类推。最后，您需要将所有程序合并到一个程序中，以仅生成一个报告。您可以通过点击
    `Edit` 选项卡来实现，如图 3-39 所示。在我们提到的每个程序中，复制自动生成的代码，并将其逐一粘贴到一个程序中。运行这个新的、大型的程序，并从中编译您的报告。我们在清单
    7-1 中做了这件事，我们探索了石油、黄金和股票。我们复制了这三个程序，并将它们编译成一个包含所有三个图表的报告；然后，我们进行了回归分析。


    总之，通过复制多个程序中的散落代码，您可以生成一个报告。然后，点击 `Print`，将报告保存为 RTF 格式，并在任何文字处理应用程序中编辑它。在 SAS
    Studio 中，无需编写特殊代码来生成报告。

