- fmt: '# Scatter Plot


    Scatter plots are used to show the interdependence between variables by describing
    their direction, strength, and linearity. Moreover, they can easily display the
    outliers.


    For this example, our question is: Do salaries in the city of Seattle depend on
    the age range of the employees, or is there no relationship?


    You can find the data file in the `Datasets` folder of this book’s source code
    called `City_of_Seattle_Wages__Comparison_by_Gender_-_Average_Hourly_Wage_by_Age.csv`.
    Or, you can download the CSV file from the `Data.Gov` project at the following
    URL: [`https://catalog.data.gov/dataset/city-of-seattle-wages-comparison-by-gender-average-hourly-wage-by-age-353b2`](https://catalog.data.gov/dataset/city-of-seattle-wages-comparison-by-gender-average-hourly-wage-by-age-353b2).


    Copy the CSV file to the `myfolders` folder. From SAS Studio, click `Refresh`,
    then import the file as we explained previously in Chapter 2. Change the name
    of the dataset from `IMPORT` to `Seattle_wages`, as in Figure 3-1. Then click
    `Run`.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig1_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Change dataset name


    To explore the data, click on the `Results` tab, as in Figure 3-2.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig2_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    The two variables for the scatter plot


    We want to create a scatter plot of the `AGE_RANGE` and `Total_Average_of_HOURLY_RATE`
    variables to see if there is an interdependency between them. Figure 3-2 shows
    the two variables.


    Click on `Tasks and Utilities` ➤ `Graph` ➤ `Scatter Plot`. In `Data`, select the
    `WORK.SEATTLE_WAGES` dataset. To do that, as in Figure 3-3, click on the small
    table beside the dataset name.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig3_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Click this table to change the dataset


    A new window, as shown in Figure 3-4, will pop up. Select the dataset and click
    `OK`.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig4_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Select the dataset


    Click on the `+` beside the x-axis and select `AGE_RANGE`, as in Figure 3-5. Similarly,
    click on the `+` beside the y-axis and select `Total_Average_of_HOURLY_RATE`.
    Click `Run` or press `F3` to run the program. SAS will auto-generate the code
    for you in the `Code` tab, and SAS Studio will display the scatter plot in the
    `Results` tab, as in Figure 3-5.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig5_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Select the variables and run


    In the graph, the last two values for the `AGE_RANGE` variable are not needed
    and give the wrong impression about the relationship between the two variables.
    Hence, we shall filter and remove them from the data. As in Figure 3-6, click
    the `Filter` button under the dataset and type the following:


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig6_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Add the filter code to eliminate the last two values in `AGE_RANGE`


    ```

    age_range ne ''Grand Total'' and age_Range ne ''under 20''

    ```


    Please observe the case letters because while SAS Studio is not case sensitive
    in the variable names, it is case sensitive in the variables’ values. Hence, SAS
    Studio will interpret `"under 20"` and `"Under 20"` differently. It will find
    nothing for the latter. However, feel free to type `age_range` as upper- or lowercase
    or mixed; SAS Studio will interpret it correctly. Now, click `Run` again to execute
    the filter code.


    From the final scatter plot in Figure 3-7, we can see that there is an interdependence
    between age and salary in Seattle. The relationship is not linear; it is curvilinear.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig7_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    The final scatter plot


    ## Scatter Plot Code


    As you have just seen, you can do your graph with some clicks and without writing
    a single line of code. That is why SAS Studio is the best choice for any beginner
    in data science. The user-friendly graphical user interface (GUI) helps you to
    focus on the concept, and it handles the syntax for you. However, reading the
    code and checking the log are good habits to gain along the way in case you want
    to write a more complicated code than what the GUI affords. Later in this chapter
    and the rest of the book, we shall have some advanced examples where we will exercise
    editing the code.


    Check the `Log` tab to make sure that you do not have any errors or warnings.
    Verify from the log the number of rows that SAS Studio executed without errors
    and resolve the issues of any rows that SAS Studio skipped during processing.


    So, let us take a look at the code. The code should look like Listing 3-1.


    ```

    ods graphics / reset width=6.4in height=4.8in  imagemap;

    proc sgplot data= WORK.SEATTLE_WAGES (where=(age_range ne ''Grand Total'' and
    age_Range ne ''under 20'')) ;

    scatter x=AGE_RANGE y=Total_Average_of_HOURLY_RATE /

    ;

    xaxis   grid;

    yaxis   grid;

    run;

    ods graphics / reset;

    ```


    Listing 3-1


    Scatter Plot Code Including Filter Code to Exclude the Last Two Values in `AGE_RANGE`


    In the first line of code, SAS Studio uses `ods graphics`. Statistical procedures
    use ODS Graphics to create graphs as part of their output, setting the width and
    height of the graph. You can change these dimensions in the code or by using the
    `Appearance` tab in the GUI. The second line uses `PROC SGPLOT`, which provides
    a simple way to make a variety of scatter plots. Notice the filter code is added
    in the `Data` statement. Then, SAS Studio uses the `scatter` keyword to identify
    the `sgplot` type and to identify the variables used in the x- and y-axes. Finally,
    choose xy-grids. You can remove the grids by deleting these two lines from the
    code or by unchecking them in the `Appearance` tab.


    ## Scatter Plot Relationships


    Figure 3-8 displays various examples of scatter plot relationships. To describe
    the scatter plot, you should state if it is a linear relationship or curvilinear,
    as we have seen in the previous example. If the interdependency is linear, look
    at its direction to know if it is positive or negative. In Figure 3-8, upper-left,
    the relationship is positive, while the plot at the upper-right is a negative
    relationship. In Figure 3-8, lower-left, there is no relationship, as the points
    are scattered irregularly. In Figure 3-8, lower-right, there is no direction,
    because the relationship is not linear, but rather curvilinear. Finally, scatter
    plots describe the strength of the relationship. If the points are very close
    to the line/form, then there is high interdependency, and the relationship is
    strong. Otherwise, it is a weak relationship.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig8_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    The direction, intensity, and linearity of the scatter plot'
