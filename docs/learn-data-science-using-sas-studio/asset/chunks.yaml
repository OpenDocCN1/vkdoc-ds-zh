- fmt: '### N-Way ANOVA


    The N-Way ANOVA task provides graphs for the effects of one or more factors on
    the means of a single, continuous dependent variable.


    In this example, assume that a flight company wants to run an advertising campaign.
    It needs to know which customers to target to increase its revenue. Therefore,
    we investigate if there is a significant difference in revenue based on the type
    and the source of the revenue.


    Select `Tasks and Utilities ➤ Tasks ➤ Linear Models ➤ N-Way ANOVA`. In the data,
    select the `SASHELP.REVHUB2` table. In Roles, select `Revenue` as the Dependent
    variable and `Source` and `Type` as the Factors, as in Figure [4-29](#501068_1_En_4_Chapter.xhtml#Fig29).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig29_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig29_HTML.jpg)


    Figure 4-29 N-Way ANOVA Data tab


    Click on the Model tab. Click on Edit beside the Intercept. Add `Source` and `Type`.
    To add their product, select them using `CTRL + A` or by selecting them using
    the mouse. Then, click on `Full Factorial`, as in Figure [4-30](#501068_1_En_4_Chapter.xhtml#Fig30).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig30_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig30_HTML.jpg)


    Figure 4-30 Model effects builder


    Scroll down and click `OK`.


    In the Options tab, in Statistics, make the following choices, as in Figure [4-31](#501068_1_En_4_Chapter.xhtml#Fig31):


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig31_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig31_HTML.jpg)


    Figure 4-31 N-Way ANOVA options


    *   Select Statistics to display ➤ Default and additional statistic

    *   Which effect ➤ Selected effects

    *   Select the product of `Source` and `Type`: `"Source * Type"`

    *   In Sum of Squares, uncheck "Sequential sum of squares (Type 1)"


    Then, click `Run`.


    The output, as in Figure [4-32](#501068_1_En_4_Chapter.xhtml#Fig32), shows that
    there are four sources of revenue to this company, which are Freight, Other, Passenger,
    and Service. There are three types of revenue, which are Direct, Indirect, and
    Other.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig32_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig32_HTML.jpg)


    Figure 4-32 Class-level information


    The interaction plot for revenue, as shown in Figure [4-33](#501068_1_En_4_Chapter.xhtml#Fig33),
    shows that the highest revenue comes from Passenger-Direct, followed by Freight-Direct,
    then Passenger-Indirect, then the rest of `Source*Type`. Roll the mouse over every
    point; SAS Studio will display the source, type, and revenue value.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig33_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig33_HTML.jpg)


    Figure 4-33 Interaction plot for revenue


    Again, in Figure [4-34](#501068_1_En_4_Chapter.xhtml#Fig34), the LS-Means for
    `Source*Type` also shows that Passenger-Direct is way higher than the other sources.
    Its value is more than $4 million, followed by Freight-Direct, with a value of
    about $1.6 million, and Passenger-Indirect, which is less than $1 million.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig34_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig34_HTML.jpg)


    Figure 4-34 LS-Means for `Source*Type`


    The Tukey plot in Figure [4-35](#501068_1_En_4_Chapter.xhtml#Fig35) shows that
    the comparisons between Passenger-Direct and Freight-Direct are significant (blue
    lines) while ignoring all the other comparisons and labeling them as insignificant
    (red lines).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig35_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig35_HTML.jpg)


    Figure 4-35 Tukey-Kramer diagram for revenue comparison for `Source*Type`


    ## Summary


    This chapter explains the most crucial five statistics concepts that will be needed
    for almost all analytics and data science reports. The five concepts are one-way
    frequency, summary statistics, correlation analysis, T-tests, and ANOVA. Moreover,
    the chapter introduces plenty of advanced visualizations and tables, such as Leven
    and Welch tables and Tukey and LS-Means plots.


    Again, we did all these tasks while relying primarily on the IDE and explaining
    the code as well. Now, it is time to go more intensely into code. In the next
    chapter, we shall step deeper into SAS programming and learn the operators, the
    loops, and the `SELECT` statement, and touch on `PROC SQL`.


    # 5. Advanced Data Preprocessing and Feature Engineering


    We mentioned in the preface that in this book we try to balance between using
    the integrated development environment (IDE) and the code. In Chapters [5](#501068_1_En_5_Chapter.xhtml)
    and [6](#501068_1_En_6_Chapter.xhtml), we focus on the code. This chapter shows
    some advanced data cleaning and querying methods, such as using `PROC SQL`, `SELECT`,
    `WHERE`, `WHEN`, and `DO` loops.


    ## Comment Statement


    It is crucial to document your code so you and your peers can understand the reasoning
    behind how the analysis is constructed. In general, if you do not document your
    code, you might look at it after a few months and not remember why you used a
    certain function or why you made a certain check. Hence, code documentation is
    crucial so as to follow the logic flow.


    The syntax of the comment statement in SAS Studio can be done in two ways as follows:


    ```

    *message;

    /*message*/

    ```


    You can use the comment statement anywhere in a SAS program to explain your code.
    The SAS compiler ignores text in comment statements during processing.


    It is always recommended that you start your programs by writing a comment at
    the top explaining what your program will do, and then add as many comments as
    you need. To describe the logic flow, it is best to write a comment at every data
    or procedure step to describe what it does.


    ## Arithmetic Operators


    Arithmetic operators indicate that an arithmetic calculation is performed, as
    shown in Table [5-1](#501068_1_En_5_Chapter.xhtml#Tab1).


    Table 5-1 Arithmetic Operators^([⁸](#fn8))


    | Symbol | Definition | Example | Result |

    | --- | --- | --- | --- |

    | `**` | exponentiation | `a**3` | raise A to the third power |

    | `*` | Multiplication^(*****) | `2*y` | multiply 2 by the value of Y |

    | `/` | division | `var/5` | divide the value of VAR by 5 |

    | `+` | addition | `num+3` | add 3 to the value of NUM |

    | `-` | subtraction | `sale-discount` | subtract the value of DISCOUNT from the
    value of SALE |

    | ***** The asterisk (`*`) is always necessary to indicate multiplication; `2Y`
    and `2(Y)` are not valid expressions. |


    If a missing value is an operand for an arithmetic operator, the result is a missing
    value. You have to handle the missing values in your dataset by using an `IF`
    statement to avoid propagating missing values. We discuss the `IF` statement in
    detail in Chapter [6](#501068_1_En_6_Chapter.xhtml).


    ### How to Represent Missing Values in Raw Data


    Table [5-2](#501068_1_En_5_Chapter.xhtml#Tab2) shows how to represent each type
    of missing value in raw data, so that SAS reads and stores the value appropriately.


    Table 5-2 Missing Values Conventions^([⁹](#fn9))


    | Missing Values | Representation in Data |

    | --- | --- |

    | Numeric | `.` (a single decimal point) |

    | Character | `'' ''` (a blank enclosed in quotation marks) |

    | Special | `.`letter (a decimal point followed by a letter; for example, `.B`)
    |

    | Special | `._` (a decimal point followed by an underscore) |


    You can set values to missing within your data step by using program statements
    such as this one:


    ```

    if age<0 then

    age=.;

    ```


    This statement sets the stored value of Age to a numeric missing value, if Age
    has a value less than 0.


    For more information about handling missing values, please check the SAS documentation
    at the following link:


    [`http://bit.ly/2tX68BO`](http://bit.ly/2tX68BO)


    The order of operations in SAS is as follows: parentheses, exponents, multiplication,
    division, addition, subtraction.'
