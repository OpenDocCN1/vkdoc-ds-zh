    each. The output is as in Figure [6-20](#501068_1_En_6_Chapter.xhtml#Fig20).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig20_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig20_HTML.jpg)


    Figure 6-20


    Appending the Democrats and Republicans datasets


    ## Summary


    This chapter explains the steps to clean and prepare data for analysis. It discusses
    the `LABEL` and `FORMAT` statements. It also explains how to create new variables
    and how to rearrange the variables in datasets. It explains the `IF`, `IF-THEN`,
    and `IF-THEN-ELSE` statements. Finally, it explains the `DROP` and `SET` statements.
    Now, we are done with the most common data analysis tasks, and the next chapter
    will introduce predicting the future using regression.


    # Part IIIAdvanced Topics


    # 7. Regression


    The linear regression task fits a linear model to predict a single continuous
    dependent variable from one or more continuous or categorical predictor variables.
    This task produces statistics and graphs for interpreting the results.'
