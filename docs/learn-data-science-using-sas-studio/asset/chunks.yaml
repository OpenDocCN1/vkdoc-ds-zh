    choose `SASHELP.CARS`. In `List Variables`, choose the following variables: `Make`,
    `Model`, `Invoice`. In `Group Analysis By`, choose `Origin`, as in Figure [2-9](#501068_1_En_2_Chapter.xhtml#Fig9).


