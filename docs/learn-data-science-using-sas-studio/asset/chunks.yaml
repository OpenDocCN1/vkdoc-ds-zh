    ## 格式


    在上一节中，我们了解了`LABEL`语句如何将输出更改为更易读的格式。另一方面，`FORMAT`语句更改的是输入，而非输出。我们在第 2 章的“变量类型”一节中提到，默认情况下，字符数据类型的长度为
    8 个字符。因此，如果我们使用`INPUT`语句而不是导入 Excel 文件，`FORMAT`语句会覆盖默认的变量格式。此外，`FORMAT`语句可以一次性为多个变量分配相同的格式。


    数据集位于“Dataset”文件夹中，文件名为 Voters_A.CSV。从 SAS Studio 上传它并点击“刷新”。不要导入它，因为我们将使用`INPUT`语句，正如我们在第
    2 章最后一节所解释的那样。


    运行代码清单 6-2 并检查输出。在代码清单 6-2 中，我们仍然没有使用`FORMAT`语句。


    ```

    data voters_format;

    infile "/folders/myfolders/SAS4Days/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    run;

    proc print ;

    run;

    代码清单 6-2

    使用 INPUT 语句读取 CSV 文件

    ```


    在代码清单 6-2 中，第一行`DATA VOTERS_FORMAT`在 Work 逻辑库中创建了一个名为`VOTERS_FORMAT`的新数据集。第二行中，`INFILE`语句从指定路径读取
    CSV 文件，将分隔符设置为逗号，并告诉 SAS Studio 第一个观测值在 CSV 文件的第二行，因为该文件有标题行。第三行使用`INPUT`语句设置变量的名称及其类型。为了区分字符变量和数值变量，你在字符变量后面放一个美元符号（`$`），这样
    SAS Studio 就能正确读取它们。数据步中的最后一行是结束数据步的`RUN`语句。最后，`PROC PRINT`将数据集打印为可打印的报告。


    运行该程序并检查“Name”列。SAS Studio 截断了名称，只读取前八个字符。例如，VOTERS_A.CSV 中的第一个名字是“Eula Vitolo”，而
    SAS Studio 将其截断为“Eula Vit”，如图 6-3 所示。正如我们在第 2 章中所说，SAS Studio 默认只给字符字段分配八个字符。


