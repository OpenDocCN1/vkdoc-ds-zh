- fmt: '# Multiple Linear Regression


    In multiple linear regression, there is more than one independent variable in
    the model. The line equation will be as follows:


    * `Y = a + b[1] X[1] + b[2] X[2] + … + b[i] X[i]`


    Where `Y` is the dependent variable for which we want to predict its value, `a`
    is the intercept, `b[i]` are the coefficients, and `X[i]` are the independent
    variables. The error is ignored.


    The null hypothesis is that there is no linear relationship between the dependent
    variable and any of the independent variables. In other words, the values of `b[i]`
    are zeros. The alternative hypothesis is that there is a linear relationship,
    and any `b[i]` does not equal zero.


    * H0: `b[i] = 0`

    * Ha: `b[i] != 0`


    Let us see if there is a linear relationship between the stock performance index
    (S & P index) and the prices of oil per barrel and gold in presidential election
    years.


    We shall use the same dataset as in the previous example of the simple linear
    regression. The dataset is in the "Dataset" folder and has the name `sp_oil_gold.xlsx`.
    From SAS Studio, upload it and click Refresh, and then import it, as we explained
    in Chapter 2. Change the name of the dataset from `IMPORT` to `sp_oil_gold`.


    Let us first explore the three variables. Run the code found in the `Listing 7-1.sas`
    file in the "Example Code" folder. Listing 7-1 displays three vertical bar charts
    showing the prices of oil, gold, and stocks over the years (from 1960 to 2016),
    each in a dedicated graph. The years are the presidential elections years.


    ```

    ods graphics / reset width=6.4in height=4.8in imagemap;

    proc sgplot data=  WORK.SP_OIL_GOLD noautolegend ;

    /*this vertical bar chart will show the stock performance over the years*/

    vbar Year / response=Stock_Market_Returns  group=Stock_Market_Returns groupdisplay=cluster  datalabel;

    yaxis grid;

    run;

    ods graphics / reset;

    ods graphics / reset width=6.4in height=4.8in imagemap;

    proc sgplot data=  WORK.SP_OIL_GOLD noautolegend;

    /*this vertical bar chart will show the oil prices over the years*/

    vbar Year / response=oil_price group=oil_price groupdisplay=cluster datalabel;

    yaxis grid;

    run;

    ods graphics / reset;

    ods graphics / reset width=6.4in height=4.8in imagemap;

    proc sgplot data=  WORK.SP_OIL_GOLD noautolegend ;

    /*this vertical bar chart will show the gold prices over the years*/

    vbar Year / response=gold_prices group=gold_prices groupdisplay=cluster

    datalabel;

    yaxis grid;

    run;

    ods graphics / reset;

    Listing 7-1

    Exploring the Stock, Oil, and Gold Prices

    ```


    The output will be as shown in Figures 7-7, 7-8, and 7-9. The 2008 financial crisis
    is clear in all the graphs. This crisis is the worst economic disaster in the
    United States since the Great Depression of 1929. Oil and gold prices spiked in
    2012.


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig9_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig9_HTML.jpg)


    Figure 7-9 Exploring gold price


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig8_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig8_HTML.jpg)


    Figure 7-8 Exploring oil price


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig7_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig7_HTML.jpg)


    Figure 7-7 Exploring S & P Index


    Now, let us check if there is a linear relationship between the stock returns
    and the oil and gold prices. Click on Tasks and Utilities ➤ Tasks ➤ Linear Models
    ➤ Linear Regression. In Data, select `WORK.SP_OIL_GOLD`. In Dependent variable,
    select `oil_price`. In Continuous variables, select `gold_prices`, as in Figure
    7-10.


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig10_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig10_HTML.jpg)


    Figure 7-10 Multiple linear regression


    Click on the Model tab and then click Edit, as shown in Figure 7-11.


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig11_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig11_HTML.jpg)


    Figure 7-11 Model tab


    Click Run. The output is shown in Figure 7-12. Figure 7-12 shows that the p-value
    is < 0.05, which means that we have enough evidence to reject the null hypothesis,
    and that there is a linear relationship between the stock returns and the oil
    and gold prices. The R-Square value represents how strong that relationship is.
    From the Parameter Estimate, the equation of the line is as follows:


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig12_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig12_HTML.jpg)


    Figure 7-12 Output


    ```

    stock_market_returns  = 0.13010 - 0.00671 oil_price + 0.00036367 gold_prices

    ```


    Figure 7-13 shows the fit diagnostics for `oil_price`. Residual shows a random
    pattern of dots above and below the 0 line, which indicates an adequate model.


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig13_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig13_HTML.jpg)


    Figure 7-13 Fit diagnostics


    The RStudent by Predicted Value plot shows a couple of dots outside the ±2 limits.


    The RStudent by Leverage plot shows the outliers that have leverage on the calculation
    of the regression coefficients.


    The Residual by Quartile plot again shows those three points. The dots are almost
    on the diagonal line.


    The Dependent Variable (TASK) by Predicted Value plot visualizes variability in
    the prediction. In this plot, the dots are random, and there is not a pattern
    that indicates a constant variance of the error.


    The Cook’s D plot is designed to identify outliers. Here, the three points are
    quite clear with their values.


    The Percent-Residual shows a normal distribution curve.'
  raw: '## Multiple Linear Regression


    In multiple linear regression, there is more than one independent variable in
    the model. The line equation will be as follows:


    *   *Y* = *a* + *b*[1] *X*[1] + *b*[2] *X*[2]+ … + *b*[i] *X*[i]


    Where *Y* is the dependent variable for which we want to predict its value, *a*
    is the intercept, *b*[i] are the coefficients, and *X*[i] are the independent
    variables. The error is ignored.


    The null hypothesis is that there is no linear relationship between the dependent
    variable and any of the independent variables. In other words, the values of *b*[i]
    are zeros. The alternative hypothesis is that there is a linear relationship,
    and any *b*[i] does not equal zero.


    *   H0: *b*[i] = 0


    *   Ha: *b*[i] ^= 0


