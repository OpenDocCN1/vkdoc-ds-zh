- fmt: "### Reports\n\nTo continue the tour and see how easily you can generate reports\
    \ in `SAS Studio`, click on the `Tasks and Utilities` tab ➤ `Tasks` ➤ `Summary\
    \ Statistics`, as in Figure [2-11](#501068_1_En_2_Chapter.xhtml#Fig11).\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig11_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig11_HTML.jpg)\n\
    \nFigure 2-11 Summary Statistics\n\nIn `Data`, click on the table. Select `SASHELP.CARS`.\
    \ In the `Analysis Variables`, select `Weight`, as in Figure [2-12](#501068_1_En_2_Chapter.xhtml#Fig12).\
    \ Instantly, after you select `Weight`, observe that `SAS Studio` auto-generated\
    \ the code for you in the most right pane, as in Figure [2-12](#501068_1_En_2_Chapter.xhtml#Fig12).\
    \ In the first line of code, `SAS Studio` uses `PROC MEANS` to compute the summary\
    \ statistics, the dataset is `SASHELP.CARS`, then some options to the `PROC MEANS`\
    \ as the standard deviation, mean, minimum, maximum, and the number of observations.\
    \ Later in the book, we will learn how to change these options and customize them.\
    \ The second line is the analysis variable, which is `Weight`. Finally, it ends\
    \ the procedure with `RUN` and semicolon.\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig12_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig12_HTML.jpg)\n\
    \nFigure 2-12 Observe the code\n\nNow, click `Run` to get the generated report.\
    \ The reports are always displayed in the `Results` tab, as in Figure [2-13](#501068_1_En_2_Chapter.xhtml#Fig13).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig13_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig13_HTML.jpg)\n\
    \nFigure 2-13 The Results tab\n\n### Graphs\n\nLet’s make a quick graph. Click\
    \ on `Tasks and Utilities` ➤ `Tasks` ➤ `Graph` ➤ `Bar Chart`, as in Figure [2-14](#501068_1_En_2_Chapter.xhtml#Fig14).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig14_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig14_HTML.jpg)\n\
    \nFigure 2-14 Bar Chart\n\nNow, as in Figure [2-15](#501068_1_En_2_Chapter.xhtml#Fig15),\
    \ change `Data` to `SASHELP.FISH`.\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig15_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig15_HTML.jpg)\n\
    \nFigure 2-15 Do the following changes\n\n1.  Select `Species`.\n2.  `Measure`\
    \ should be `Variable`.\n3.  Select `Weight`.\n4.  Then change `Statistic` to\
    \ `Mean`.\n\nAs in Figure [2-16](#501068_1_En_2_Chapter.xhtml#Fig16), change the\
    \ title to \"Average Weight for Different Species.\" In `Bars`, check \"Set Color\"\
    \ and change the color. In `Details`, change `Effect` to `Sheen`. Then, click\
    \ `Run`. Figure [2-16](#501068_1_En_2_Chapter.xhtml#Fig16) shows the output.\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig16_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig16_HTML.jpg)\n\
    \nFigure 2-16 Bar chart Appearance tab\n\n### Snippets\n\nYou use snippets mainly\
    \ when you have a repetitive, customized code to do. Instead of redoing it every\
    \ time, you just save it as a snippet, and whenever it’s needed you just change\
    \ the dataset name, variables, and title. Hence, you can consider snippets as\
    \ an alternative to custom tasks.\n\n#### So, What Are Snippets?\n\n*   It’s ready-made\
    \ `SAS` code.\n*   You can customize it.\n*   You can add your own snippet.\n\n\
    Let’s use two examples to demonstrate how to use the ready-made snippet and another\
    \ to create your own new snippet.\n\n#### Example to Use Ready-Made Snippet\n\n\
    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig17_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig17_HTML.jpg)\n\
    \nFigure 2-17 HBar plot snippet\n\n*   Click `Snippets` ➤ `Graph`.\n*   Select\
    \ `Hbar`. The code is as shown in Figure [2-17](#501068_1_En_2_Chapter.xhtml#Fig17).\n\
    \nThe code in Listing [2-2](#501068_1_En_2_Chapter.xhtml#PC2) is in the \"Example\
    \ Code\" folder, from which you can copy and paste it.\n\n*   Edit the code to\
    \ be as shown in Figure [2-16](#501068_1_En_2_Chapter.xhtml#Fig16), as follows:\n\
    \    *   Edit the title.\n    *   Change the dataset to `baseball` instead of\
    \ `cars`.\n    *   Change `hbar` from \"type\" to \"team.\"\n    *   Change `response`\
    \ from \"mpg_city\" to \"salary.\"\n    *   Remove limits.\n\n```\n/*--HBar Plot--*/\n\
    title 'Mileage by Type';\nproc sgplot data=sashelp.cars ;\nhbar type / response=mpg_city\
    \  stat=mean  limits=both;\nyaxis display=(nolabel) grid;\nxaxis display=(nolabel);\n\
    run;\n```\nListing 2-2 Snippet Example\n\nThe modified code for Listing [2-3](#501068_1_En_2_Chapter.xhtml#PC3)\
    \ is located in the \"Example Code\" folder, from which you can copy and paste\
    \ it. Its screenshot looks like Figure [2-18](#501068_1_En_2_Chapter.xhtml#Fig18).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig18_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig18_HTML.jpg)\n\
    \nFigure 2-18 Customize the snippet to your new dataset and variables\n\n```\n\
    /*--HBar Plot--*/\ntitle 'Average Salary by Team';\nproc sgplot data=sashelp.baseball\
    \ ;\nhbar team / response=salary  stat=mean  ;\nyaxis display=(nolabel) grid;\n\
    xaxis display=(nolabel);\nrun;\n```\nListing 2-3 Customized Snippet Example\n\n\
    *   Run the code.\n\n#### To Create Your Own Snippets\n\nAs in Figure [2-19](#501068_1_En_2_Chapter.xhtml#Fig19),\
    \ click on the `Code` tab, and then choose the icon for (Add to My Snippets).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig19_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig19_HTML.jpg)\n\
    \nFigure 2-19 Add to My Snippets\n\n## Main Components of a SAS Program\n\nA `SAS`\
    \ program consists of two steps: the data step and the proc step. Each program\
    \ can contain as many data and proc steps as you need, as in Figure [2-20](#501068_1_En_2_Chapter.xhtml#Fig20).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig20_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig20_HTML.jpg)\n\
    \nFigure 2-20 Main components of a SAS program\n\n### Data Step\n\nThe data step\
    \ is where you prepare your data for processing by defining the dataset, combining\
    \ datasets, cleaning your data, creating new variables, checking for errors, removing\
    \ any variables, and so on.\n\n### Variable Types\n\nIn `SAS`, there are two variable\
    \ types: numeric and character. `SAS` dates and times are not standard numeric\
    \ or character variables. They have their functions but are stored as numbers.\
    \ In data science, the terminology that data scientists use is different. The\
    \ continuous variables or the quantitative variables are represented in numeric\
    \ variables, while the categorical or qualitative variables are represented in\
    \ character variables.\n\n### Proc Step\n\nThe proc step is where you define your\
    \ procedures to process clean data and generate reports. You use the proc step\
    \ to summarize, sort, list, filter, or perform any other task from the `Tasks`\
    \ tab.\n\n## Libraries\n\nThe next stop in our tour is the third tab in the left\
    \ pane, `Libraries`. `Libraries` are where you load your tables, so `SAS Studio`\
    \ can access the tables’ data. There are two types of libraries: permanent and\
    \ temporary. You will learn how to distinguish between them and how to create\
    \ new permanent libraries. However, before that, we need to talk about how the\
    \ files and folders can be shared between the host machine and the virtual machine\
    \ where `SAS Studio` runs.\n\n### Accessing Your Existing Local Files\n\nThere\
    \ are two methods to access the files on your machine from inside `SAS Studio`.\
    \ The first method is by using the `SAS Studio` interface to upload the file.\
    \ The second method is by using the operating system to copy and paste the file\
    \ from the local machine to the `myfolders` folder that you created on your local\
    \ machine."
  raw: "### Reports\n\nTo continue the tour and see how easily you can generate reports\
    \ in SAS Studio, click on the Tasks and Utilities tab ➤ Tasks ➤ Summary Statistics,\
    \ as in Figure [2-11](#501068_1_En_2_Chapter.xhtml#Fig11).\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig11_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig11_HTML.jpg)\n\
    \nFigure 2-11\n\nSummary Statistics\n\nIn Data, click on the table. Select SASHELP.CARS.\
    \ In the Analysis Variables, select Weight, as in Figure [2-12](#501068_1_En_2_Chapter.xhtml#Fig12).\
    \ Instantly, after you select Weight, observe that SAS Studio auto-generated the\
    \ code for you in the most right pane, as in Figure [2-12](#501068_1_En_2_Chapter.xhtml#Fig12).\
    \ In the first line of code, SAS Studio uses PROC MEANS to compute the summary\
    \ statistics, the dataset is SASHELP.CARS, then some options to the PROC MEANS\
    \ as the standard deviation, mean, minimum, maximum, and the number of observations.\
    \ Later in the book, we will learn how to change these options and customize them.\
    \ The second line is the analysis variable, which is Weight. Finally, it ends\
    \ the procedure with RUN and semicolon.\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig12_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig12_HTML.jpg)\n\
    \nFigure 2-12\n\nObserve the code\n\nNow, click Run to get the generated report.\
    \ The reports are always displayed in the Results tab, as in Figure [2-13](#501068_1_En_2_Chapter.xhtml#Fig13).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig13_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig13_HTML.jpg)\n\
    \nFigure 2-13\n\nThe Results tab\n\n### Graphs\n\nLet’s make a quick graph. Click\
    \ on Tasks and Utilities ➤ Tasks ➤ Graph ➤ Bar Chart, as in Figure [2-14](#501068_1_En_2_Chapter.xhtml#Fig14).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig14_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig14_HTML.jpg)\n\
    \nFigure 2-14\n\nBar Chart\n\nNow, as in Figure [2-15](#501068_1_En_2_Chapter.xhtml#Fig15),\
    \ change Data to SASHELP.FISH.\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig15_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig15_HTML.jpg)\n\
    \nFigure 2-15\n\nDo the following changes\n\n1.  Select Species.\n\n2.  Measure\
    \ should be Variable.\n\n3.  Select Weight.\n\n4.  Then change Statistic to Mean.\n\
    \nAs in Figure [2-16](#501068_1_En_2_Chapter.xhtml#Fig16), change the title to\
    \ “Average Weight for Different Species.” In Bars, check “Set Color” and change\
    \ the color. In Details, change Effect to Sheen. Then, click Run. Figure [2-16](#501068_1_En_2_Chapter.xhtml#Fig16)\
    \ shows the output.\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig16_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig16_HTML.jpg)\n\
    \nFigure 2-16\n\nBar chart Appearance tab\n\n### Snippets\n\nYou use snippets\
    \ mainly when you have a repetitive, customized code to do. Instead of redoing\
    \ it every time, you just save it as a snippet, and whenever it’s needed you just\
    \ change the dataset name, variables, and title. Hence, you can consider snippets\
    \ as an alternative to custom tasks.\n\n#### So, What Are Snippets?\n\n*   It’s\
    \ ready-made SAS code.\n\n*   You can customize it.\n\n*   You can add your own\
    \ snippet.\n\nLet’s use two examples to demonstrate how to use the ready-made\
    \ snippet and another to create your own new snippet.\n\n#### Example to Use Ready-Made\
    \ Snippet\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig17_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig17_HTML.jpg)\n\
    \nFigure 2-17\n\nHBar plot snippet\n\n*   Click Snippets ➤ Graph.\n\n*   Select\
    \ Hbar. The code is as shown in Figure [2-17](#501068_1_En_2_Chapter.xhtml#Fig17).\n\
    \nThe code in Listing [2-2](#501068_1_En_2_Chapter.xhtml#PC2) is in the “Example\
    \ Code” folder, from which you can copy and paste it.\n\n*   Edit the code to\
    \ be as shown in Figure [2-16](#501068_1_En_2_Chapter.xhtml#Fig16), as follows:\n\
    \    *   Edit the title.\n\n    *   Change the dataset to baseball instead of\
    \ cars.\n\n    *   Change hbar from “type” to “team.”\n\n    *   Change response\
    \ from “mpg_city” to “salary.”\n\n    *   Remove limits.\n\n```\n/*--HBar Plot--*/\n\
    title 'Mileage by Type';\nproc sgplot data=sashelp.cars ;\nhbar type / response=mpg_city\
    \  stat=mean  limits=both;\nyaxis display=(nolabel) grid;\nxaxis display=(nolabel);\n\
    run;\nListing 2-2\nSnippet Example\n```\n\nThe modified code for Listing [2-3](#501068_1_En_2_Chapter.xhtml#PC3)\
    \ is located in the “Example Code” folder, from which you can copy and paste it.\
    \ Its screenshot looks like Figure [2-18](#501068_1_En_2_Chapter.xhtml#Fig18).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig18_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig18_HTML.jpg)\n\
    \nFigure 2-18\n\nCustomize the snippet to your new dataset and variables\n\n```\n\
    /*--HBar Plot--*/\ntitle 'Average Salary by Team';\nproc sgplot data=sashelp.baseball\
    \ ;\nhbar team / response=salary  stat=mean  ;\nyaxis display=(nolabel) grid;\n\
    xaxis display=(nolabel);\nrun;\nListing 2-3\nCustomized Snippet Example\n```\n\
    \n*   Run the code.\n\n#### To Create Your Own Snippets\n\nAs in Figure [2-19](#501068_1_En_2_Chapter.xhtml#Fig19),\
    \ click on the Code tab, and then choose the icon for (Add to My Snippets).\n\n\
    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig19_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig19_HTML.jpg)\n\
    \nFigure 2-19\n\nAdd to My Snippets\n\n## Main Components of a SAS Program\n\n\
    A SAS program consists of two steps: the data step and the proc step. Each program\
    \ can contain as many data and proc steps as you need, as in Figure [2-20](#501068_1_En_2_Chapter.xhtml#Fig20).\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig20_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig20_HTML.jpg)\n\
    \nFigure 2-20\n\nMain components of a SAS program\n\n### Data Step\n\nThe data\
    \ step is where you prepare your data for processing by defining the dataset,\
    \ combining datasets, cleaning your data, creating new variables, checking for\
    \ errors, removing any variables, and so on.\n\n### Variable Types\n\nIn SAS,\
    \ there are two variable types: numeric and character. SAS dates and times are\
    \ not standard numeric or character variables. They have their functions but are\
    \ stored as numbers. In data science, the terminology that data scientists use\
    \ is different. The continuous variables or the quantitative variables are represented\
    \ in numeric variables, while the categorical or qualitative variables are represented\
    \ in character variables.\n\n### Proc Step\n\nThe proc step is where you define\
    \ your procedures to process clean data and generate reports. You use the proc\
    \ step to summarize, sort, list, filter, or perform any other task from the Tasks\
    \ tab.\n\n## Libraries\n\nThe next stop in our tour is the third tab in the left\
    \ pane, Libraries. Libraries are where you load your tables, so SAS Studio can\
    \ access the tables’ data. There are two types of libraries: permanent and temporary.\
    \ You will learn how to distinguish between them and how to create new permanent\
    \ libraries. However, before that, we need to talk about how the files and folders\
    \ can be shared between the host machine and the virtual machine where SAS Studio\
    \ runs.\n\n### Accessing Your Existing Local Files\n\nThere are two methods to\
    \ access the files on your machine from inside SAS Studio. The first method is\
    \ by using the SAS Studio interface to upload the file. The second method is by\
    \ using the operating system to copy and paste the file from the local machine\
    \ to the “myfolders” folder that you created on your local machine."
  trans: "\n### 报表\n\n要继续浏览并了解如何在 `SAS Studio` 中轻松生成报表，请点击 `任务和实用工具` 选项卡 ➤ `任务` ➤\
    \ `汇总统计`，如图 2-11 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig11_HTML.jpg](img/501068_1_En_2_Fig11_HTML.jpg)\n\
    \n图 2-11 汇总统计\n\n在 `数据` 中，点击表格。选择 `SASHELP.CARS`。在 `分析变量` 中，选择 `Weight`，如图 2-12\
    \ 所示。选择 `Weight` 后，立即观察到 `SAS Studio` 在最右侧窗格中自动生成了代码，如图 2-12 所示。在代码的第一行，`SAS Studio`\
    \ 使用 `PROC MEANS` 计算汇总统计量，数据集为 `SASHELP.CARS`，然后是 `PROC MEANS` 的一些选项，如标准差、均值、最小值、最大值和观测数量。在本书后续部分，我们将学习如何更改和自定义这些选项。第二行是分析变量，即\
    \ `Weight`。最后，该过程以 `RUN` 和分号结束。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig12_HTML.jpg](img/501068_1_En_2_Fig12_HTML.jpg)\n\
    \n图 2-12 观察代码\n\n现在，点击 `运行` 以获取生成的报表。报表始终显示在 `结果` 选项卡中，如图 2-13 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig13_HTML.jpg](img/501068_1_En_2_Fig13_HTML.jpg)\n\
    \n图 2-13 结果选项卡\n\n### 图形\n\n让我们快速制作一个图形。点击 `任务和实用工具` ➤ `任务` ➤ `图形` ➤ `条形图`，如图\
    \ 2-14 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig14_HTML.jpg](img/501068_1_En_2_Fig14_HTML.jpg)\n\
    \n图 2-14 条形图\n\n现在，如图 2-15 所示，将 `数据` 更改为 `SASHELP.FISH`。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig15_HTML.jpg](img/501068_1_En_2_Fig15_HTML.jpg)\n\
    \n图 2-15 进行以下更改\n\n1.  选择 `Species`。\n2.  `度量` 应为 `变量`。\n3.  选择 `Weight`。\n4.\
    \  然后将 `统计量` 更改为 `均值`。\n\n如图 2-16 所示，将标题更改为“不同物种的平均重量”。在 `条形` 中，勾选“设置颜色”并更改颜色。在\
    \ `详情` 中，将 `效果` 更改为 `光泽`。然后，点击 `运行`。图 2-16 显示了输出结果。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig16_HTML.jpg](img/501068_1_En_2_Fig16_HTML.jpg)\n\
    \n图 2-16 条形图外观选项卡\n\n### 代码片段\n\n当您有需要重复执行的定制化代码时，可以主要使用代码片段。不必每次都重做，只需将其保存为代码片段，每当需要时，只需更改数据集名称、变量和标题即可。因此，您可以将代码片段视为自定义任务的替代方案。\n\
    \n#### 那么，什么是代码片段？\n\n*   它是现成的 `SAS` 代码。\n*   您可以自定义它。\n*   您可以添加自己的代码片段。\n\n\
    让我们使用两个示例来演示如何使用现成代码片段，以及如何创建您自己的新代码片段。\n\n#### 使用现成代码片段的示例\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig17_HTML.jpg](img/501068_1_En_2_Fig17_HTML.jpg)\n\
    \n图 2-17 水平条形图代码片段\n\n*   点击 `代码片段` ➤ `图形`。\n*   选择 `Hbar`。代码如图 2-17 所示。\n\n清单\
    \ 2-2 中的代码位于“示例代码”文件夹中，您可以从中复制粘贴。\n\n*   编辑代码，使其如图 2-16 所示，操作如下：\n    *   编辑标题。\n\
    \    *   将数据集从 `cars` 更改为 `baseball`。\n    *   将 `hbar` 从“type”更改为“team”。\n  \
    \  *   将 `response` 从“mpg_city”更改为“salary”。\n    *   移除限制。\n\n```\n/*--HBar 图--*/\n\
    title '按类型划分的里程数';\nproc sgplot data=sashelp.cars ;\nhbar type / response=mpg_city\
    \  stat=mean  limits=both;\nyaxis display=(nolabel) grid;\nxaxis display=(nolabel);\n\
    run;\n```\n清单 2-2 代码片段示例\n\n清单 2-3 的修改后代码位于“示例代码”文件夹中，您可以从中复制粘贴。其屏幕截图如图 2-18 所示。\n\
    \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig18_HTML.jpg](img/501068_1_En_2_Fig18_HTML.jpg)\n\
    \n图 2-18 将代码片段自定义为新的数据集和变量\n\n```\n/*--HBar 图--*/\ntitle '按团队划分的平均薪资';\nproc sgplot\
    \ data=sashelp.baseball ;\nhbar team / response=salary  stat=mean  ;\nyaxis display=(nolabel)\
    \ grid;\nxaxis display=(nolabel);\nrun;\n```\n清单 2-3 自定义代码片段示例\n\n*   运行代码。\n\n\
    #### 创建您自己的代码片段\n\n如图 2-19 所示，点击 `代码` 选项卡，然后选择（添加到我的代码片段）图标。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig19_HTML.jpg](img/501068_1_En_2_Fig19_HTML.jpg)\n\
    \n图 2-19 添加到我的代码片段\n\n## SAS 程序的主要组成部分\n\n一个 `SAS` 程序包含两个步骤：数据步和过程步。每个程序可以根据需要包含任意数量的数据步和过程步，如图\
    \ 2-20 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig20_HTML.jpg](img/501068_1_En_2_Fig20_HTML.jpg)\n\
    \n图 2-20 SAS 程序的主要组成部分\n\n### 数据步\n\n数据步用于准备待处理的数据，包括定义数据集、合并数据集、清理数据、创建新变量、检查错误、移除任何变量等操作。\n\
    \n### 变量类型\n\n在 `SAS` 中，有两种变量类型：数值型和字符型。`SAS` 日期和时间既不是标准的数值型变量，也不是字符型变量。它们有专门的函数，但以数字形式存储。在数据科学中，数据科学家使用的术语有所不同。连续变量或定量变量用数值型变量表示，而分类变量或定性变量用字符型变量表示。\n\
    \n### 过程步\n\n过程步用于定义处理干净数据并生成报表的过程。您可以使用过程步从 `任务` 选项卡中进行汇总、排序、列出、过滤或执行任何其他任务。\n\
    \n## 逻辑库\n\n我们浏览的下一站是左侧窗格的第三个选项卡：`逻辑库`。`逻辑库` 是您加载表格的地方，这样 `SAS Studio` 就可以访问表格中的数据。逻辑库有两种类型：永久逻辑库和临时逻辑库。您将学习如何区分它们以及如何创建新的永久逻辑库。不过在此之前，我们需要讨论如何在宿主机器和运行\
    \ `SAS Studio` 的虚拟机之间共享文件和文件夹。\n\n### 访问您现有的本地文件\n\n有两种方法可以从 `SAS Studio` 内部访问您机器上的文件。第一种方法是使用\
    \ `SAS Studio` 界面上传文件。第二种方法是使用操作系统将文件从本地机器复制粘贴到您在本地机器上创建的 `myfolders` 文件夹中。\n"
- fmt: '### The First Method


    Click on **Server Files and Folders** ➤ **Upload**. Then, choose the Excel or
    CSV or any format file from your local machine to upload it into SAS Studio (see
    Figures [2-21](#501068_1_En_2_Chapter.xhtml#Fig21) and [2-22](#501068_1_En_2_Chapter.xhtml#Fig22)).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig21_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig21_HTML.jpg)


    Figure 2-21 Click the **Upload** icon


    Similarly, if you want to download a file from inside SAS Studio to your local
    machine, select the file and click the **Download** icon to download the file
    (see Figure [2-23](#501068_1_En_2_Chapter.xhtml#Fig23)). You will find it in your
    **Downloads** folder on your local machine (see Figure [2-23](#501068_1_En_2_Chapter.xhtml#Fig23)).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig23_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig23_HTML.jpg)


    Figure 2-23 **Download** icon to download any file from SAS Studio to your operating
    system


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig22_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig22_HTML.jpg)


    Figure 2-22 Select the file from server files and folders


    ### The Second Method


    Just copy and paste the required file (SAS, XLS, or CSV) to the **myfolders**
    folder. As SAS Studio operates inside a virtual machine, it won’t access any files
    on the Windows filesystem or your local operating system except those that are
    in the shared folder.


    ## Accessing Data in SAS Libraries


    SAS Studio stores the tables in libraries. In general, they are permanent. However,
    there is the **Work** library, which is a temporary one that lasts only for the
    current session and vanishes when refreshing the browser and logging out. All
    other libraries in the **Libraries** tab are permanent ones. For example, **SAS
    Help** is a permanent library.


    ### How Do You Distinguish Between Permanent and Temporary Libraries?


    Any dataset has a two-level name separated by a dot, with the following syntax:
    `<first level name>.<second level name>`; for example, `sashelp.cars` or `newlib.adults`.
    This is an indication that your dataset is saved in a permanent library. However,
    if your dataset has `work` as its first level, it is saved in a temporary library;
    for example, `work.ratedata`.


    SAS Studio uses the **Work** library by default. Hence, for any dataset that has
    only one level, `work` will be its first level, and it is temporary; for example,
    `income`. You will find it saved under the **Work** library in the **Libraries**
    tab. So, `work.income` is similar to `income`; both are the same and indicate
    a temporary library called `income`.


    ## Create a New Library


    There are two ways to create new libraries: by code or by GUI. Creating a new
    library by code is only one command: `libname <Library Name> <Path>;`


    ### Library Naming Conventions


    The library that you create must have a name between one and eight characters
    in length, beginning with a letter or underscore. It cannot start with a number
    or contain any special characters. The remaining characters of the name can be
    letters, numbers, and underscores. No special characters are allowed.


    The path can be any folder saved in the **Server Files and Folders** tab. Type
    the code shown in Listing [2-4](#501068_1_En_2_Chapter.xhtml#PC4), found in the
    **Example Code** folder, from which you can copy it and paste it into a new program
    to create your new library, and then click **Run**.


    ```

    libname newlib ''/folders/myfolders'';

    Listing 2-4

    Create a New Library Using libname Statement

    ```


    You will find your library listed in the **Libraries** tab. If not, click **Refresh**.


    The second method is by using the GUI. Click on the **Libraries** tab, and then
    click the **New Library** icon, as in Figure [2-24](#501068_1_En_2_Chapter.xhtml#Fig24).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig24_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig24_HTML.jpg)


    Figure 2-24 Create a new library using the GUI


    Select your folder, as in Figure [2-25](#501068_1_En_2_Chapter.xhtml#Fig25).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig25_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig25_HTML.jpg)


    Figure 2-25 Select the location of your library


    Enter its name and path, as in Figure [2-26](#501068_1_En_2_Chapter.xhtml#Fig26).
    It is better to check **Re-create this library at start-up**, so you can find
    it whenever you refresh SAS Studio or restart the virtual machine. Otherwise,
    you will not find it and will need to re-add it to your libraries list manually.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig26_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig26_HTML.jpg)


    Figure 2-26 Creating the new library options


    Click **OK**. You will find your new library in the **Libraries** list, as in
    Figure [2-27](#501068_1_En_2_Chapter.xhtml#Fig27).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig27_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig27_HTML.jpg)


    Figure 2-27 The new library in the **Libraries** list'
