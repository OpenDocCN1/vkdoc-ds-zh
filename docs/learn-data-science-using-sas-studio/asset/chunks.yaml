    In `Tasks` ➤ `Statistics` tab, you will find some of the statistical tasks that
    should be included in the reports. In this chapter, we will discuss `One-Way Frequency`,
    `Summary Statistics`, `Correlation Analysis`, and `T-Tests`.


    ### One-Way Frequency


    The `One-Way Frequencies` task is usually the first step when exploring any dataset.
    It generates frequency tables from your data showing the unique levels of each
    variable. You can also use this task to perform binomial and chi-square tests.
    You can use this task to distinguish the outliers as well.


    For this example, we explore the `SASHELP.HEART` dataset to see how many people
    have high cholesterol. Click on `Tasks and Utilities` ➤ `Tasks` ➤ `Statistics`
    ➤ `One-Way Frequencies`. In `Data`, select `SASHELP.HEART`, and in `Analysis Variables`,
    select `CHOL_STATUS`, as in Figure [4-1](#501068_1_En_4_Chapter.xhtml#Fig1).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig1_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig1_HTML.jpg)


    **Figure 4-1** Choose dataset and analysis variable


