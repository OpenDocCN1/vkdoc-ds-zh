- fmt: '# Simple Linear Regression


    In simple linear regression, there is only one independent variable in the model.
    The line equation will be as follows:


    *   `Y = a + bX`


    Where `Y` is the dependent variable that we want to predict its value, `a` is
    the intercept, `b` is the coefficient, and `X` is the independent variable. The
    error is ignored.


    The null hypothesis is that there is no linear relationship between the variables.
    In other words, the value of `b` is zero. The alternative hypothesis is that there
    is a linear relationship, and `b` is not equal to zero.


    ```

    H0: b = 0

    Ha: b ^= 0

    ```


    Let us see if there is a linear relationship between the prices of oil per barrel
    and gold.


    The dataset is in the `Dataset` folder and has the name `sp_oil_gold.xlsx`. From
    SAS Studio, upload the file and click Refresh, then import it, as we explained
    in Chapter [2](#501068_1_En_2_Chapter.xhtml). Change the name of the dataset from
    `IMPORT` to `sp_oil_gold`.


    The sources of this data are as follows:


    *   [`https://www.thebalance.com/presidential-elections-and-stock-market-returns-2388526`](https://www.thebalance.com/presidential-elections-and-stock-market-returns-2388526)

    *   [`https://www.statista.com/statistics/262858/change-in-opec-crude-oil-prices-since-1960/`](https://www.statista.com/statistics/262858/change-in-opec-crude-oil-prices-since-1960/)

    *   [`https://www.statista.com/statistics/268027/change-in-gold-price-since-1990/`](https://www.statista.com/statistics/268027/change-in-gold-price-since-1990/)

    *   [`https://www.nma.org/pdf/gold/his_gold_prices.pdf`](https://www.nma.org/pdf/gold/his_gold_prices.pdf)

    *   [`https://nma.org/wp-content/uploads/2018/02/his_gold_prices_1833_pres_2018.pdf`](https://nma.org/wp-content/uploads/2018/02/his_gold_prices_1833_pres_2018.pdf)


    Click on Tasks and Utilities ➤ Tasks ➤ Linear Models ➤ Linear Regression. In Data,
    select `WORK.SP_OIL_GOLD`. In Dependent variable, select `oil_price`. In Continuous
    variables, select `gold_prices`, as in Figure [7-1](#501068_1_En_7_Chapter.xhtml#Fig1).


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig1_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig1_HTML.jpg)


    Figure 7-1 Single linear regression


    Click on the Model tab and click Edit, as in Figure [7-2](#501068_1_En_7_Chapter.xhtml#Fig2).


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig2_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig2_HTML.jpg)


    Figure 7-2 Model tab


    Select `gold_prices` and click Add, and then scroll down and click OK, as in Figure
    [7-3](#501068_1_En_7_Chapter.xhtml#Fig3).


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig3_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig3_HTML.jpg)


    Figure 7-3 Model effects builder


    Click Run. The output is shown in Figure [7-4](#501068_1_En_7_Chapter.xhtml#Fig4).


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig4_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig4_HTML.jpg)


    Figure 7-4 Output


    Figure [7-4](#501068_1_En_7_Chapter.xhtml#Fig4) shows that the p-value is < 0.0001,
    which means that we have enough evidence to reject the null hypothesis, and that
    there is a linear relationship between oil and gold prices. The R-Square value
    represents how strong that relationship is. The slope of the line = 0.05965. From
    the Parameter Estimate, the equation of the line is:


    ```

    oil_price = 1.98831 + 0.05965 gold_prices

    ```


    Figure [7-5](#501068_1_En_7_Chapter.xhtml#Fig5) shows the fit diagnostics for
    the `oil_price` variable. Residual shows a random pattern of dots above and below
    the 0 line, which indicates an adequate model.


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig5_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig5_HTML.jpg)


    Figure 7-5 Fit diagnostics


    The RStudent by Predicted Value plot shows a couple of dots outside the ±2 limits.
    A third dot lies in between the two lines but is far away from the rest of the
    dots.


    The RStudent by Leverage plot shows the outliers that have leverage on the calculation
    of the regression coefficients.


    The Residual by Quartile plot again shows those three points.


    The Dependent Variable (TASK) by the Predicted Value plot visualizes variability
    in the prediction. In this plot, the dots are random, and there is not a pattern
    that indicates a constant variance of the error.


    The Cook’s D plot is designed to identify outliers. Here, the three points are
    very clear with their values.


    Finally, the FitPlot in Figure [7-6](#501068_1_En_7_Chapter.xhtml#Fig6) consists
    of a scatter plot of the data overlaid with the regression line and 95% confidence
    and prediction limits. Again the three outlier points are clear.


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig6_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig6_HTML.jpg)


    Figure 7-6 Fit plot'
