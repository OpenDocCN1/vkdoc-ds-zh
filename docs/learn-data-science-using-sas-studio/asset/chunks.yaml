    dataset from IMPORT to CORRELATION.


    Click on Tasks and Utilities ➤ Tasks ➤ Statistics ➤ Correlation Analysis. Select
    in Data the dataset CORRELATION. In Analysis variables, select GDP. In Correlate
    with, choose voterturnout, as shown in Figure [4-12](#501068_1_En_4_Chapter.xhtml#Fig12).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig12_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig12_HTML.jpg)


    Figure 4-12


    Correlation analysis of GDP and voter turnout in Maine


    In Options ➤ Plots, select Individual Scatter Plots, as in Figure [4-13](#501068_1_En_4_Chapter.xhtml#Fig13).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig13_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig13_HTML.jpg)


    Figure 4-13


    The Options tab


    Then, click Run. The output will be as shown in Figure [4-14](#501068_1_En_4_Chapter.xhtml#Fig14).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig14_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig14_HTML.jpg)


    Figure 4-14


    Pearson correlation coefficients


    The correlation coefficient is 0.05, which indicates that there is almost no relation
    between the GDP and voter turnout in Maine.


    On the plot, you will find the points are all over the place, as shown in Figure
    [4-15](#501068_1_En_4_Chapter.xhtml#Fig15).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig15_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig15_HTML.jpg)


    Figure 4-15


    Correlation between voter turnout and GDP


    Be aware that this is not the general rule. In your state, the correlation might
    be different. The state of Maine historically has one of the highest voter turnouts.
    I think that the weather might have a larger impact than the GDP. However, this
    is just a theory and needs further investigation. As an exercise, you could build
    a dataset of the temperature and voter turnout in Maine and verify if there is
    a high correlation between the weather and voter turnout. Further, you could investigate
    your state and see which factors affect voter turnout there.


    ### T-Tests


    Often, we are interested in knowing whether the means of two independent groups
    are truly different or if the observed difference merely occurred by chance.


    The T-test is used to determine the probability of the difference between two
    sets of data. In simpler words, it compares the mean values between two samples.


    Note that the T-test is used for small samples because they will not follow the
    normal distribution.


    ### One-Sample T-tests


    In this example, I collected all the votes from the previous presidential elections
    in Maine for both parties’ candidates over the years. I used this dataset in predicting
    the results in Maine for both the 2016 and the 2020 elections.


    The dataset name is MaineVotesDR.xlsx. It has four columns: Year of elections,
    Democrat voters, Republican voters, and the Result. The Result column is either
    0 or 1\. If it is 0, the Republican candidate won. If it is 1, the Democratic
    candidate won.


    Now, import the dataset and let us see how to use the T-test to see the results
    in 2020\. In Tasks, click Statistics, then T Tests. In Data, select the dataset.
    In the Analysis variable, select Result, as in Figure [4-16](#501068_1_En_4_Chapter.xhtml#Fig16).


    Our hypothesis is that the Republican candidate will win in the 2020 presidential
    election in Maine, while the alternative hypothesis will be that the Democratic
    candidate will win.


    ```

    H0: Result=0

    Ha: Result=1

    ```


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig16_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig16_HTML.jpg)


    Figure 4-16


    T-test


    In the code, the default value of the null hypothesis is zero. You will find it
    in the Code tab as `h0=0`. Do not change the default value, as it as our hypothesis.
    Now, click Run and check the p-value that SAS Studio generates in the reports,
    as in Figure [4-17](#501068_1_En_4_Chapter.xhtml#Fig17).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig17_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig17_HTML.jpg)


    Figure 4-17


    T-test results: Prediction for 2020 presidential election in Maine


    The p-value = 0.0004\. Since the p-value is less than 0.05, we can reject the
    null hypothesis. Hence, we can conclude that the Republican candidate will lose
    in Maine in the 2020 election.


    ### Paired-sample T-test


    Now, we will test whether the difference between price and cost is significantly
    different from 30\. In other words, the null hypothesis will be that the difference
    between the price and cost equals 30, while the alternative hypothesis of the
    difference will not be equal to 30.


    ```

    H0: Difference=30.

    Ha: Difference ^= 30 or in other languages syntax is: Ha: Difference !=30.

    ```


    To do this example, click on Tasks and Utilities ➤ Tasks ➤ Statistics ➤ T Tests.
    Select in Data the dataset PRICEDDATA in SASHELP. In T-test type, select Paired
    test. In Group 1 Variable, choose price, and for Group 2 Variable, choose cost,
    as in Figure [4-18](#501068_1_En_4_Chapter.xhtml#Fig18).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig18_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig18_HTML.jpg)


    Figure 4-18


    Paired T-test Data tab


    Now, click the Options tab. In Tests ➤ Tails, select Two-tailed test. In the Alternative
    hypothesis, put mu1-mu2 ^=30, as in Figure [4-19](#501068_1_En_4_Chapter.xhtml#Fig19).
    You have the choice whether to include the tests for normality and the default
    plots. Usually, it is better to include them and present them in your reports.
    However, in this example, we mainly focus on the value of the p-value in the results.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig19_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig19_HTML.jpg)


    Figure 4-19


    The Options tab


    In the results, the p-value is less than 0.0001, as in Figure [4-20](#501068_1_En_4_Chapter.xhtml#Fig20).
    Hence, we have enough evidence to reject the null hypothesis, because the p-value
    is less than 0.05.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig20_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig20_HTML.jpg)


    Figure 4-20


    The P-value


    It is worth mentioning that the paired T-test is done in the same way as the one-sample
    T-test. In the preceding example, the paired T-test first computes the difference
    between the price and the cost, then performs the one-sample T-test over the difference,
    as in the previous section.


    ### Two-Sample T-tests


    In this example, the question is: Is there a significant difference in height
    between the two genders?


    The null hypothesis is that there is no difference in height. The alternate hypothesis
    is that there is a difference in height based on gender.


    In this example, choose the CLASS dataset from SASHELP. Choose the Two-sample
    test in the T test. Finally, select Height as the Analysis variable and Sex as
    the Groups variable, as in Figure [4-21](#501068_1_En_4_Chapter.xhtml#Fig21).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig21_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig21_HTML.jpg)


    Figure 4-21


    T-test Data tab


    Click Run and check the p-value in the output, as in Figure [4-22](#501068_1_En_4_Chapter.xhtml#Fig22).


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig22_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig22_HTML.jpg)


    Figure 4-22


    P-value


    We cannot reject the null hypothesis as there is not enough evidence for that;
    the p-value is larger than 0.05\. We can conclude that there is no difference
    in height between the two genders. However, we must note that the sample is small.
    The SASHELP.CLASS dataset contains only nineteen rows.'
  trans: '

    *   [`https://www.census.gov/prod/2011pubs/12statab/election.pdf`](https://www.census.gov/prod/2011pubs/12statab/election.pdf)

    *   [`https://www.deptofnumbers.com/gdp/maine/`](https://www.deptofnumbers.com/gdp/maine/)


    现在，上传数据集。从 SAS Studio 中，点击 `Refresh`，然后导入数据集，正如我们在第 2 章中解释的那样。将数据集的名称从 `IMPORT`
    更改为 `CORRELATION`。


    点击 `Tasks and Utilities ➤ Tasks ➤ Statistics ➤ Correlation Analysis`。在 `Data`
    中选择数据集 `CORRELATION`。在 `Analysis variables`（分析变量）中，选择 `GDP`。在 `Correlate with`（与之相关）中，选择
    `voterturnout`，如图 4-12 所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig12_HTML.jpg](img/501068_1_En_4_Fig12_HTML.jpg)


    图 4-12


    缅因州 GDP 与选民投票率的相关性分析


    在 `Options ➤ Plots` 中，选择 `Individual Scatter Plots`（单个散点图），如图 4-13 所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig13_HTML.jpg](img/501068_1_En_4_Fig13_HTML.jpg)


    图 4-13


    “选项”选项卡


    然后，点击 `Run`。输出结果将如图 4-14 所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig14_HTML.jpg](img/501068_1_En_4_Fig14_HTML.jpg)


    图 4-14


    皮尔逊相关系数


    相关系数为 0.05，这表明在缅因州，GDP 与选民投票率之间几乎没有关系。


    在图上，你会发现点分布得很散，如图 4-15 所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig15_HTML.jpg](img/501068_1_En_4_Fig15_HTML.jpg)


    图 4-15


    选民投票率与 GDP 之间的相关性


    请注意，这并非普遍规律。在你的州，相关性可能会有所不同。缅因州历史上一直是选民投票率最高的州之一。我认为天气的影响可能比 GDP 更大。不过，这只是一个理论，需要进一步研究。作为练习，你可以建立一个缅因州温度和选民投票率的数据集，并验证天气与选民投票率之间是否存在高度相关性。此外，你也可以研究一下你所在的州，看看有哪些因素会影响当地的选民投票率。


    ## T 检验


    通常，我们想知道两个独立组的均值是否真的不同，还是观察到的差异仅仅是偶然发生的。


    T 检验用于确定两组数据之间差异的概率。简单来说，它比较了两个样本之间的平均值。


    请注意，T 检验适用于小样本，因为它们不遵循正态分布。


    ## 单样本 T 检验


    在这个例子中，我收集了历届缅因州总统选举中两党候选人的所有选票。我使用这个数据集来预测 2016 年和 2020 年缅因州的选举结果。


    数据集的名称是 `MaineVotesDR.xlsx`。它有四列：`选举年份`、`民主党选民`、`共和党选民`和`结果`。`结果`列的值是 0 或 1。如果是
    0，表示共和党候选人获胜。如果是 1，表示民主党候选人获胜。


    现在，导入数据集，让我们看看如何使用 T 检验来查看 2020 年的结果。在 `Tasks` 中，点击 `Statistics`，然后点击 `T Tests`。在
    `Data` 中，选择数据集。在 `Analysis variable`（分析变量）中，选择 `Result`，如图 4-16 所示。


    我们的假设是共和党候选人将在 2020 年缅因州总统选举中获胜，而备择假设将是民主党候选人获胜。


    ```

    H0: Result=0

    Ha: Result=1

    ```


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig16_HTML.jpg](img/501068_1_En_4_Fig16_HTML.jpg)


    图 4-16


    T 检验


    在代码中，原假设的默认值是 0。你会在 `Code` 选项卡中看到 `h0=0`。不要更改默认值，因为它就是我们的假设。现在，点击 `Run` 并检查 SAS
    Studio 在报告中生成的 p 值，如图 4-17 所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig17_HTML.jpg](img/501068_1_En_4_Fig17_HTML.jpg)


    图 4-17


    T 检验结果：2020 年缅因州总统选举预测


    p 值 = 0.0004。由于 p 值小于 0.05，我们可以拒绝原假设。因此，我们可以得出结论：共和党候选人将在 2020 年缅因州选举中失利。


    ## 配对样本 T 检验


    现在，我们将检验价格与成本之间的差异是否显著不同于 30。换句话说，原假设是价格与成本之间的差值等于 30，而备择假设是该差值不等于 30。


    ```

    H0: Difference=30.

    Ha: Difference ^= 30 或者在其它语言中的语法是： Ha: Difference !=30.

    ```


    要执行此示例，请点击 `Tasks and Utilities ➤ Tasks ➤ Statistics ➤ T Tests`。在 `Data` 中选择 `SASHELP`
    中的数据集 `PRICEDDATA`。在 `T-test type`（T 检验类型）中，选择 `Paired test`（配对检验）。在 `Group 1
    Variable`（组 1 变量）中，选择 `price`，在 `Group 2 Variable`（组 2 变量）中，选择 `cost`，如图 4-18
    所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig18_HTML.jpg](img/501068_1_En_4_Fig18_HTML.jpg)


    图 4-18


    配对 T 检验“数据”选项卡


    现在，点击 `Options` 选项卡。在 `Tests ➤ Tails` 中，选择 `Two-tailed test`（双尾检验）。在 `Alternative
    hypothesis`（备择假设）中，输入 `mu1-mu2 ^=30`，如图 4-19 所示。你可以选择是否包含正态性检验和默认图形。通常，最好包含它们并在报告中呈现。但是，在本例中，我们主要关注结果中
    p 值的数值。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig19_HTML.jpg](img/501068_1_En_4_Fig19_HTML.jpg)


    图 4-19


    “选项”选项卡


    在结果中，p 值小于 0.0001，如图 4-20 所示。因此，我们有足够的证据拒绝原假设，因为 p 值小于 0.05。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig20_HTML.jpg](img/501068_1_En_4_Fig20_HTML.jpg)


    图 4-20


    P 值


    值得一提的是，配对 T 检验的执行方式与单样本 T 检验相同。在前面的示例中，配对 T 检验首先计算价格与成本之间的差值，然后对该差值执行单样本 T 检验，就像上一节中那样。


    ## 两样本 T 检验


    在这个例子中，问题是：两个性别之间的身高是否存在显著差异？


    原假设是身高没有差异。备择假设是根据性别存在身高差异。


    在这个例子中，从 `SASHELP` 中选择 `CLASS` 数据集。在 T 检验中选择 `Two-sample test`（两样本检验）。最后，选择 `Height`
    作为 `Analysis variable`（分析变量），选择 `Sex` 作为 `Groups variable`（分组变量），如图 4-21 所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig21_HTML.jpg](img/501068_1_En_4_Fig21_HTML.jpg)


    图 4-21


    T 检验“数据”选项卡


    点击 `Run` 并检查输出中的 p 值，如图 4-22 所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig22_HTML.jpg](img/501068_1_En_4_Fig22_HTML.jpg)


    图 4-22


    P 值


    我们不能拒绝原假设，因为没有足够的证据支持拒绝；p 值大于 0.05。我们可以得出结论：两个性别之间的身高没有差异。但是，我们必须注意样本量很小。`SASHELP.CLASS`
    数据集仅包含 19 行。

