- fmt: '# Comparison Operators


    Comparison operators set up a comparison, operation, or calculation with two variables,
    constants, or expressions. If the comparison is true, the result is 1. If the
    comparison is false, the result is 0.


    Comparison operators can be expressed as symbols or with their mnemonic equivalents,
    which are shown in Table 5-3. `SAS Studio` can process the symbol or the mnemonic.
    The mnemonic can be uppercase or lowercase or mixed case.


    **Table 5-3** Comparison Operators


    | Symbol | Mnemonic Equivalent | Definition | Example |

    | --- | --- | --- | --- |

    | `=` | `EQ` | equal to | `a=3` |

    | `^=` | `NE` | not equal to | `a ne 3` |

    | `¬=` | `NE` | not equal to | |

    | `~=` | `NE` | not equal to | |

    | `>` | `GT` | greater than | `num>5` |

    | `<` | `LT` | less than | `num<8` |

    | `>=` | `GE` | greater than or equal to | `sales>=300` |

    | `<=` | `LE` | less than or equal to | `sales<=100` |

    | | `IN` | equal to one of a list | `num in (3, 4, 5)` |


    Again, you can use either the mnemonic or the symbol. For example:


    ```

    if grade >= 50 then status = pass;

    else status = fail;

    ```


    similar to:


    ```

    if grade GE 50 then status EQ pass;

    else status EQ fail;

    ```


    To learn more about SAS operators in expressions, please check the SAS documentation
    at this URL: [`http://bit.ly/36UGEnk`](http://bit.ly/36UGEnk).


    ## `PROC SQL` Statement


    Writing SQL statements is crucial for database developers. `SAS Studio` enables
    database developers to use `PROC SQL` statements where they can create tables,
    query them, select or delete or update any data from them, and merge or subset
    the tables as developers used to do. Throughout this book, we show plenty of examples
    of various ways to achieve those tasks using other SAS statements. In this section,
    you will learn how to use `PROC SQL`.


    The sequence for the `PROC SQL` statement is as follows:


    ```

    PROC SQL;

    select

    from

    group by

    having

    order by

    ;

    quit;

    ```


    To remember this sequence, you can use this acronym: “So Few Workers Go Home On
    Time.” The source of this acronym is [`https://blogs.sas.com/content/sastraining/2012/04/24/go-home-on-time-with-these-5-proc-sql-tips/`](https://blogs.sas.com/content/sastraining/2012/04/24/go-home-on-time-with-these-5-proc-sql-tips/).


    In Listing 2-5 in Chapter 2, we created a new table in the `newlib` library by
    filtering out the cars that were made in Europe. In Listing 5-1, we do the same
    task but by using `PROC SQL`.


    ```

    proc sql;

    create table newlib.europeancars as

    select * from sashelp.cars where origin = "Europe" ;

    quit;

    Listing 5-1

    PROC SQL Example

    ```


    In this example, Listing 5-1, we start with `PROC SQL`. Then, we create a table
    and use the `AS` keyword to define the table contents. We use `SELECT *` to select
    all the columns from `SASHELP.CARS`. For the condition to filter the European
    cars only, we use the `WHERE` clause and check on the value of the `origin`. If
    the `origin = Europe`, the row is added to the table and excluded otherwise.


    ## `SELECT-WHERE` Statement


    The `SELECT` statement is the primary tool of `PROC SQL`. You use it to identify,
    retrieve, and manipulate columns of data from a table.


    The following simple `SELECT` statement is sufficient to produce a useful result:


    ```

    select party

    from maine.voters;

    ```


    The preceding statement contains a `SELECT` clause that lists the `party` column
    and a `FROM` clause that lists the table in which the `party` column resides.


    ### `WHERE` Clause


    The `WHERE` clause adds more specification to `SELECT` statement lists by adding
    a condition to it. It is similar to the `IF-THEN-ELSE` statement that we shall
    talk about in the next chapter.


    For example, if we want to check the party distribution for seniors in Maine,
    we should add a `WHERE` clause to the `SELECT` statement as follows:


    ```

    select Party

    from maine.voters;

    where age >= 65;

    ```


    Another example, Listing 5-2, is from the sample questions of the SAS Base Programming
    Certificate Free Preparation Guide.


    ```

    data class;

    input name $ gender $ age;

    datalines;

    Anna F 23

    Ben M 25

    Bob M 21

    Brian M 27

    Edward M 26

    Emma F 32

    Joe M 34

    Sam F 32

    Tom M 24

    ;

    data WORK.MALES_OVER25;

    set WORK.CLASS;

    where Gender="M";

    where age>25;

    run;

    Listing 5-2

    WHERE Clause Example

    ```


    How many observations are in the dataset `WORK.MALES_OVER25`?


    The output will be five observations. The output is Figure 5-1. The table contains
    both males and females whose age is larger than 25, because only the last `WHERE`
    clause took effect.


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig1_HTML.jpg](images/501068_1_En_5_Chapter/501068_1_En_5_Fig1_HTML.jpg)


    **Figure 5-1** The output of `WHERE` clause example


    If you want to modify the code to have a table that contains males whose age is
    larger than 25, you should combine both conditions with the `AND` operator.


    Instead of two `WHERE` statements:


    ```

    where Gender="M";

    where age>25;

    ```


    It should be:


    ```

    where Gender="M" and age>25;

    ```


    Or use `WHERE` and `WHERE ALSO` statements, as follows:


    ```

    where Gender=”M”;

    where also age>25;

    ```


    In Listing 5-2, the `WHERE` statement is used to subset the dataset. There is
    another way to subset the dataset, which is by using the `IF` statement without
    `THEN`; we will have an example about it in the next chapter.


    Moreover, this listing shows that if we have several consecutive `WHERE` statements,
    not `WHERE ALSO`, only the last one will take effect.


    ## `SELECT-WHEN-OTHERWISE` Statement


    The `SELECT-WHEN` statement is a conditional statement similar to the `IF-THEN`
    statement.


    The syntax is as follows:


    ```

    SELECT ;

    WHEN-1 (when-expression-1 ) statement;

    ```


    The `select-expression` is optional. Let us have a couple of examples, one where
    `select-expression` is present and another where it is omitted.


    ```

    DATA MYDATA;

    SET sashelp.class;

    SELECT(age);

    when (10) status="child";

    WHEN (11,12) status="preteen";

    OTHERWISE status="teenager";

    END;

    PROC PRINT DATA=MYDATA;

    RUN;

    Listing 5-3

    The Select-Expression Is Present Example

    ```


    If `select-expression` is present, SAS evaluates the `select-expression` and `when-expression`.
    SAS compares the two for equality and returns a value of true or false. If the
    comparison is true, the statement is executed. If the comparison is false, execution
    proceeds to the next `when-expression`. If no `WHEN` statements remain, the `OTHERWISE`
    statement will be executed. See Figure 5-2.


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig2_HTML.jpg](images/501068_1_En_5_Chapter/501068_1_En_5_Fig2_HTML.jpg)


    **Figure 5-2** The Output of `Select-Expression` Clause Example


    If there is no `select-expression`, the `when-expression` is evaluated to produce
    a Boolean result. If the result is true, the statement is executed. If the result
    is false, SAS proceeds to the next `when-expression` or to the `OTHERWISE` statement.
    If the result of all `when-expressions` is false and no `OTHERWISE` statement
    is present, SAS issues an error message. If more than one `WHEN` statement has
    a true `when-expression`, only the first `WHEN` statement is used. See Figure
    5-3.


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig3_HTML.jpg](images/501068_1_En_5_Chapter/501068_1_En_5_Fig3_HTML.jpg)


    **Figure 5-3** The Output of the Absent `Select-Expression` Clause Example


    ```

    DATA MYDATA;

    SET sashelp.class;

    SELECT;

    WHEN (age=15 and sex="F") research="include";

    OTHERWISE research="not include";

    END;

    PROC PRINT DATA=MYDATA;

    RUN;

    Listing 5-4

    No Select-Expression Example

    ```'
