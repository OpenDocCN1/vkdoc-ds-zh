    **Figure 2-10** The output of the list data'
  raw: '## Tour


    The SAS Studio interface is basically divided into two vertical panes. The first
    one is the navigation pane, which has several tabs; for example, Server Files
    and Folders, Tasks and Utilities, Snippets, and Libraries. The second one is the
    work area, which displays the programs’ editor/code, log, and results.


    The Server Files and Folders tab contains all the folders and subfolders that
    are inside the shared folder that you have created on your machine. Remember that
    SAS Studio runs inside a virtual machine; hence, it does not see your operating
    system files and folders by default. It sees only what is inside that shared folder.
    Later in this chapter, you will learn several ways to import files from your operating
    system to the virtual machine where SAS Studio runs and vice vera. After doing
    so, you will be able to use the files inside SAS Studio.


    The Tasks and Utilities tab has task GUIs that you can use within the SAS Studio
    IDE. Later in this chapter and the book, you will learn how this tab eases your
    data science process, and how, with a few mouse clicks, it helps you to finish
    most of the essential steps to explore, clean, and process your data and help
    you to make your predictions.


    The Snippets tab has some of the most-used tasks as ready-made code for you. You
    can reuse this code for your datasets and customize them. You will learn more
    about it later in this chapter.


    The Libraries tab is where the datasets, that SAS Studio uses to execute the tasks
    and utilities, are located.


    After you successfully install the SAS Studio inside the virtual machine, click
    on Libraries in the left pane. Then click on SASHELP, then CARS. You will have
    a table viewer, as in Figure [2-1](#501068_1_En_2_Chapter.xhtml#Fig1), displaying
    a dataset that has information about cars. The middle pane shows the columns of
    that dataset. By default, “Select all,” highlighted with red in Figure [2-1](#501068_1_En_2_Chapter.xhtml#Fig1)
    to the left, is selected. Now, uncheck it and check “Make” and “Model” only. The
    right pane will show the data of these two columns only. Try to resize them. You
    can drag any of the columns to the left or to the right to rearrange them. You
    can sort any column ascending or descending by clicking on the column name.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig1_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    SAS Studio interface


