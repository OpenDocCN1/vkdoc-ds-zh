    in the middle. This icon is the Expand/Collapse button. The first time you click
    on it, the left pane will collapse, giving you an expanded view of the task that
    you are working on. If you click on it a second time, the pane will be back.


    Another way to view the data is by using code. Let us write our first SAS code.
    The third icon from the left, when you click on it, will display a drop-down menu,
    as shown in Figure [2-2](#501068_1_En_2_Chapter.xhtml#Fig2).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig2_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig2_HTML.jpg)


