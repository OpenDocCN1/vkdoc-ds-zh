- fmt: '### Population


    The second step is collecting as much related data as possible. Therefore, I started
    with the population.


    From information on the population distribution over Maine’s counties, found at
    the U.S. Census Bureau, I learned that it is not uniformly distributed. There
    are vast areas that are either unpopulated or that have only one person living
    in them. While the red dots in the south look small, more than 5,000 people live
    in each of them. Therefore, I should not be deceived by the maps distributed by
    the presidential campaigns or by the mainstream media.


    The following logical step was to get the voters’ information. Some states publish
    their voters databases for free, and anyone could download them. However, in Maine,
    this was not the case. The state sold the voter databases to the political parties.
    So, I contacted the Secretary of State.


    The office replied that to obtain voters files and updates from Maine’s Central
    Voter Registration system, the requesting person or entity must be from the following
    five cases:


    1. A candidate or person or entity working on a candidate’s campaign

    2. Someone working for a party

    3. A person or entity involved in a referendum campaign that will be on the ballot
    in Maine in the next statewide election

    4. A person or entity involved in specific get-out-the-vote efforts in Maine (the
    efforts have to be identified, including name, location, and date of events in
    Maine)

    5. An individual who has been elected or appointed to and currently serving in
    a municipal, county, state, or federal office, but only for use for the official’s
    authorized activities, not to turn over to another entity


    The cost was based on the number of records obtained; the fee was scheduled in
    Title 21-A, section 196-A. A statewide voter file, which contained almost one
    million records, was $2,200.


    After a few emails back and forth explaining that I needed them for a research
    project and sending some verifications, the office kindly sent me for free a DVD
    with all the required information, hiding the unneeded data like last names and
    so on.


    The first table on the DVD has the voters’ information and is shown in Figure
    [1-2](#501068_1_En_1_Chapter.xhtml#Fig2). The columns are first name, year of
    birth, enrollment code, special designations, date of registration, congressional
    district, county ID, changed date, and date of last statewide election with `VPH`.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig2_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig2_HTML.jpg)


    Figure 1-2 Voters’ information


    The second table contains a registered and enrolled voters report, as in Figure
    [1-3](#501068_1_En_1_Chapter.xhtml#Fig3). The columns of this table are the county
    name, municipality name, ward precinct, congressional district, state senate,
    county commissioner district, the party, and the total. The parties listed in
    the file are Democratic, Green Independent, Libertarian, Republican, and unenrolled.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig3_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig3_HTML.jpg)


    Figure 1-3 Registered and enrolled voters report


    This raw data was messy and contained many wrong values and outliers. For example,
    the age of one voter was 220 years, while his date of birth states that he was
    about 67 years old at that time. Some voters’ information was missing, and so
    on. Again, as mentioned earlier, always clean your data: outliers, missing data,
    adjust data formatting, and explore your data.


    Not only that, but also you should collect as much historical data as you can.
    So, I started digging and collected as much data as I could find. From the United
    States Census Bureau, I downloaded more tables (`http://www.census.gov/topics/public-sector/voting/data/tables.html`).


    I grouped the voters by gender, age, and race.


    ### Gender


    As shown in Figure [1-4](#501068_1_En_1_Chapter.xhtml#Fig4), I found that the
    registered female population is larger than the registered male population in
    Maine. However, the percentage difference for both genders is less than ±2%. As
    for how the candidates should use this information, the campaigns’ representatives
    could wear the cancer awareness ribbon to play on women’s compassion, as the women’s
    turnout was always higher than the males’. This recommendation shows how data
    and numbers can control not only the speech topics but even what the representatives
    wear.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig4_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig4_HTML.jpg)


    Figure 1-4 Maine registered voters grouped by gender


    ### Race


    Regarding race in Maine, more than 96 percent of the population is white (as shown
    in Figure [1-5](#501068_1_En_1_Chapter.xhtml#Fig5)). Therefore, I grouped the
    black, Asian, and Hispanic voters as non-white registered voters.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig5_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig5_HTML.jpg)


    Figure 1-5 Maine registered voters grouped by race


    ### Age


    In 2016, there was a remarkable decrease in the number of registered voters who
    were over the age of sixty-five, as seen in Figure [1-6](#501068_1_En_1_Chapter.xhtml#Fig6)
    (note that the scales are different). On the other hand, there was an increase
    in the 18–24 and 25–44 age groups. This finding indicates that the speech topics
    should change as well to convince more voters. For example, instead of focusing
    on medical insurance and retirement funding, the campaign representative should
    focus on student loans and home mortgages.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig6_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig6_HTML.jpg)


    Figure 1-6 Maine registered voters grouped by age


    ### Voter Turnout


    I checked the voter turnout for past years to see how many voters got dressed
    and went out in Maine’s snowy streets to vote. Figure [1-7](#501068_1_En_1_Chapter.xhtml#Fig7)
    shows voter turnout from the years 2000 to 2016 as percentages, and that the winning
    party was the Democratic Party for those years. If you try this exercise with
    a swing party, the columns’ colors will change to reflect the winning party.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig7_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig7_HTML.jpg)


    Figure 1-7 Maine voter turnout 2000–2016


    Again, I inspected the voter turnout in recent years, according to the winning
    party and with age, race, and gender groupings. In Figure [1-8](#501068_1_En_1_Chapter.xhtml#Fig8),
    the `D` represents the Democratic Party, the `R` stands for the Republican Party,
    and the `O` is for all other parties combined.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig8_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig8_HTML.jpg)


    Figure 1-8 Maine voter turnout according to party and with age, race, and gender
    groupings'
