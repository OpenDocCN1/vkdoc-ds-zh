  raw: '### IF (Condition) Without THEN statement


    The `IF` statement without a `THEN` statement is used to subset the datasets.
    In this example, let us continue using the dataset of the previous sections, Voters_A.CSV.
    We want to have two new datasets as subsets of the original, where the first one
    contains only voters who are enrolled as Democrat, and the other contains voters
    who are enrolled as Republican. We use an `IF` statement and check the `ENROLL`
    variable value, as in Listing [6-6](#501068_1_En_6_Chapter.xhtml#PC6).


    Use the `SET` statement to copy the old dataset to a new one. It is usually better
    to create a new copy of the dataset and do all your analysis over the new dataset
    and keep the original one intact. This is a good practice, especially for those
    who use datasets provided by governments or the United Nations or banks.


    ```

    data voters_enroll;

    Format Name $21\. ;

    infile "/folders/myfolders/sasuser.v94/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    run;

    data voters_democrat;

    set voters_enroll;

    if enroll="D";

    run;

    data voters_republican;

    set voters_enroll;

    if enroll="R";

    run;

    proc print data=voters_enroll (obs=3);

    run;

    proc print data=voters_democrat (obs=3);

    run;

    proc print data=voters_republican (obs=3);

    run;

    Listing 6-6

    IF (Condition) Statement Example

    ```


    After running Listing [6-6](#501068_1_En_6_Chapter.xhtml#PC6), we have three datasets.
    Voters_Enroll has all the parties, Voters_Democrats has the Democratic voters
    only, and Voters_Republicans has the Republican voters only. We need three data
    steps, one for each dataset; similarly, we need three `PROC PRINT`s. If you got
    an error, please check the file path in the INFILE statement. Change it to where
    the file is located on your machine.


    Instead of printing all the rows in the dataset, we added `(OBS=3)` option to
    the `PROC PRINT` to print three rows only from each dataset. Click on the Results
    tab to see the three reports, as in Figure [6-8](#501068_1_En_6_Chapter.xhtml#Fig8).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig8_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Print three rows after subsetting the dataset


    Click on the Output Data tab and select the table from the drop-down menu, as
    in Figure [6-9](#501068_1_En_6_Chapter.xhtml#Fig9). WORK.VOTERS_ENROLL contains
    all the parties and has 100 rows.


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig9_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Select the output table from the drop-down menu


    Select the WORK.VOTERS_DEMOCRAT table, which has 24 rows only, as in Figure [6-10](#501068_1_En_6_Chapter.xhtml#Fig10).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig10_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig10_HTML.jpg)


