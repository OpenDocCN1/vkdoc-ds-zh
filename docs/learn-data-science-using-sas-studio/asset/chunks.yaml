- fmt: '### Modeling


    For modeling, it is always better to try different algorithms for prediction and
    compare their results, and not rely on only one model. For this project, I used
    `Monte Carlo` and `Bayes` algorithms.


    For the statistical tests, I used the following methods:


    - Histograms

    - Box plots

    - Proportion test

    - T-test

    - Decision tree

    - Chi-square test

    - Scatter plot and linear regression


    ### My 2016 Predictions


    After running the `Monte Carlo` algorithm in `SAS University Edition` using the
    past election results, the output was as shown in Figure 1-11.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig11_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig11_HTML.jpg)


    *Figure 1-11 The 2016 prediction results of Monte Carlo algorithm*


    Figure 1-11 shows that `Hillary Clinton` would win Maine by a percentage mean
    of 52.14 percent. Actually, she won by 48 percent only. So, the simulation detects
    that she won Maine, and she did. Therefore, I got the full mark in this project
    and an A in the course. Hurray!


    ### My 2020 Predictions


    I predict that the Democratic Party will win three of Maine’s four electoral votes
    by 50.8 percent, as shown in Figure 1-12.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig12_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig12_HTML.jpg)


    *Figure 1-12 The 2020 prediction results of Monte Carlo algorithm*


    The likelihood probability for Maine is that the Democrats will win 2020 by a
    minor margin of about +3% over the Republicans, where the historical data from
    1960 to 2016 shows that the mean percentage of Democrats is about 43 percent while
    the mean percentage of the Republicans in Maine is 40 percent. It is the same
    difference as there was between the Democrats and Republicans in 2016 in Maine.


    If the Democratic Party is not careful, however, Maine might switch to the Republican
    Party.


    ## Summary


    This chapter focuses on drawing the main ideas of the case study of the presidential
    elections project in the state of Maine, as well as its charts. In the next chapter,
    we shall see how to install `SAS Studio` and write our first SAS program.


    ## 2. Getting Started


    `SAS Studio` enables you to import and export raw data files, manipulate and transform
    data, combine SAS data sets, create summary reports using SAS procedures, identify
    and correct data, and debug syntax and programming logic errors. Moreover, it
    enables you to do visualizations, including maps, in easier steps than other programming
    languages such as `R` or `Python`. However, it has a programming editor as well
    to customize and write your own code if needed.


    ### How Do You Install SAS Studio?


    The installation comprises four steps. You can follow them step-by-step at the
    following URL: [https://www.sas.com/en_us/software/university-edition/download-software.html](https://www.sas.com/en_us/software/university-edition/download-software.html).


    As the installation steps can change, it is better to consult this URL for the
    latest updated online guide.


    ### What Is SAS and SAS Studio?


    `SAS` stands for Statistical Analysis System, and `SAS Studio` is its interface.
    `SAS Studio` has a powerful integrated development environment (IDE), which includes
    both the tasks’ graphical user interface (GUI) and the code editor. If you use
    the GUI, which uses the point-and-click approach, `SAS Studio` auto-generates
    the equivalent code for you. Or, you can use the code editor to write your own
    code.


    Throughout the book, we will go through both approaches: using the GUI and writing
    code. For the examples that use the GUI, we will explain the generated code. For
    some advanced examples or user-customized ones that can be done solely by code,
    I shall explain the required code line by line, along with the procedures and
    their options.


    It is worth mentioning that `SAS Studio` also has two modes: the `SAS Programmer`
    and the `Visual Programmer`. The `Visual Programmer` mode uses the drag-and-drop
    method. You can change the mode from the drop-down menu in the upper bar on the
    right. However, the book focuses on the `SAS Programmer` mode.'
