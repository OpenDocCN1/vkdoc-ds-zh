    在 `Tasks` ➤ `Statistics` 选项卡中，你会发现一些应包含在报告中的统计任务。在本章中，我们将讨论`单变量频率`、`汇总统计`、`相关分析`和`T
    检验`。


    ### 单变量频率


    `单变量频率`任务通常是探索任何数据集时的第一步。它会根据你的数据生成频率表，显示每个变量的唯一水平。你还可以使用此任务执行二项检验和卡方检验。你也可以使用此任务来识别异常值。


    在此示例中，我们探索 `SASHELP.HEART` 数据集，以查看有多少人胆固醇水平偏高。点击 `Tasks and Utilities` ➤ `Tasks`
    ➤ `Statistics` ➤ `One-Way Frequencies`。在 `Data` 中，选择 `SASHELP.HEART`，在 `Analysis
    Variables` 中，选择 `CHOL_STATUS`，如图 4-1 所示。


