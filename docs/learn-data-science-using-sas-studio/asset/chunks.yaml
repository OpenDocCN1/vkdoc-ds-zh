  trans: '

    ### Kaggle-Zillow 竞赛


    `Kaggle` 是第三种在线赚钱的方式。我知道有些人辞去公司职务，通过参加`Kaggle`竞赛谋生。这是一个数据科学中心，大学和公司会在上面发布带有数据集的项目作为挑战，并提供现金奖励。我曾尝试过一次，那是一次很棒的经历；我从中收获良多。


    我参加的那场比赛总奖金为 120 万美元，分两轮进行。参赛者将角逐大约一年半的时间。第一轮结束后，只有分数最准确的 100 名参赛者才能进入第二轮。第一轮之后有一些小奖项，总奖金为
    5 万美元。第二轮结束后，一等奖是一百万美元。比赛的目标是预测未来两年的房价。这场比赛由`Zillow`呈现。


    竞赛的数据集通常有两种类型：一种用于训练，另一种用于测试。此外，有些竞赛对内核提交次数没有限制，而另一些则限制提交次数。所以，请仔细阅读规则，以免浪费你的机会。


    你可以通过这个链接查看比赛的档案、奖金和时间线：[`https://www.kaggle.com/c/zillow-prize-1`](https://www.kaggle.com/c/zillow-prize-1)。


    我参加的那场比赛的时间线从 2017 年 5 月开始，到 2019 年 1 月结束。因此，赢得比赛并不容易。就个人而言，我不建议你辞去工作，靠参加`Kaggle`竞赛谋生，除非你真的尝试过并掌握了获胜的方法。


    在`Kaggle`上，参赛者可以互相合作，如果他们愿意，也可以发布他们的代码或结果。这种分享会提升内核的排名和参赛者的讨论排名。一些 Kaggle 会员会因此出名，他们的贡献会获得大量点赞。雇主和研究中心经常会雇佣这些受欢迎的
    Kaggle 会员，即使他们没有赢得比赛。因此，`Kaggle`在展示数据科学家的技能和编程风格方面等同于`GitHub`。


    再次提醒，提交内核时要注意它是公开的还是私密的。有些竞赛禁止你首次设置内核隐私后再次更改。有些竞赛允许你一次分享你的内核，另一次改为私密。


    对于这次比赛，我使用了`XGBoost`算法来预测价格。我是从`Kaggle`上了解到`XGBoost`算法的。所以，它对于初学者来说也是一个教育平台。最近，`Kaggle`开始提供免费的在线数据科学课程和免费数据集供尝试。这是链接：[`https://www.kaggle.com/learn/overview`](https://www.kaggle.com/learn/overview)。


    如果你有问题或疑问，随时可以在讨论板上发帖。`Kaggle`的支持团队和社区非常活跃、支持且乐于合作。一段时间后，你可以认识其他 Kaggle 会员，与他们组队，一起竞争。


    在`Zillow`比赛中，我的排名是 3131 个团队中的第 231 名。我的算法运行良好，通过改变一些数值，结果有了巨大提升。我在几周内从排行榜的第 1000
    名跃升至第 231 名。不幸的是，我无法继续参加比赛，因为我必须前往波士顿参加校园内的几门课程。你可能不同意我的决定；每个人优先考虑的事情不同。对我来说，我在哈佛大学的硕士学位是我的最高优先事项，其价值超过一百万美元。


    ## 哈佛大学扩展学院：数据科学研究生专业证书


    该证书课程包含四门课程，你可以选择在线或在校内参加。所有的讲座和实验课都会进行直播并录像。毕业后，你也可以根据需要随时观看，次数不限。如果你正在考虑通过它来推进你的职业生涯，我强烈建议你立即开始。课程价格每学期都会上涨，所以越快报名越便宜。无需申请或深厚的先前经验。据我所知，对许多人来说，入学很容易，但完成学业太难。该证书需要大量的努力和实践。你不能指望轻松通过。你必须在所有课程中至少获得
    B，并在三年内完成。推荐的时间是十八个月。其中一门课程必须是统计课程，另一门必修课是数据科学课程。另外两门课程是选修课。


    我在大约一年内完成了该证书的学习，所有成绩都是 A 和 A-。其中两门课程，我不仅获得了满分，还获得了额外加分。顺便说一下，哈佛大学没有 A+！我从哈佛大学暑期学校的一门暑期强化统计课程开始。课程讲师是迈克尔·帕森教授。他是有史以来最好的教授之一，并被评选为大学里最受欢迎的教授。2016
    年秋季，我一个学期选修了两门课程。我在这本书中记录的那门课是拉里·亚当斯教授的。另一门课是奥列格·皮亚内赫教授的《医疗保健中的大数据》。我从那门课中也学到了很多。春季学期，我选修了由安德烈·西瓦琴科教授和维克托·法鲁丁教授讲授的必修数据科学课程。这门课非常出色，确实是一次很棒的经历。


    我建议你从统计课程开始，然后是必修的数据科学课程，最后再选修其他课程。你并不总能自由选择，因为并非所有课程每个学期都会开设。最好事先咨询你的学校顾问。哈佛大学的顾问们都很棒——非常友好且知识渊博。请注意，在你注册大学任何项目后，规则或课程有时可能会发生变化。因此，最好向你的顾问汇报你的学习进度，并在注册前与他们讨论你感兴趣的课程。顾问会检查你是否能满足证书或学位的要求，并指导你做出最佳选择。我的顾问阿莉森·K·博格斯和我的入学教练克里斯汀·凯勒给了我巨大的帮助。如果没有他们的帮助以及我的毕业设计项目主任萨莉·夏普教授的指导，我肯定无法完成我的学位。


    这个证书费用昂贵，但大约一年内你就能赚回这笔钱。在你的简历和`LinkedIn`账户上印上哈佛大学的标志，会大大提升你的工作机会。除了工作和金钱，哈佛的经历会永远改变你的生活和思维方式。是的，它很艰难；你会连续数日不眠不休地工作和学习。但是，相信我，你会爱上它的！


    数据科学方向，无论是学术型还是技术型，如今都无处不在。你也可以尝试一下。除了哈佛大学，许多其他大学也开始提供数据科学的学位和证书课程。

    '
- fmt: "# SAS Certification\n\nAfter finishing this book, you will have covered almost\
    \ all the topics required for the following two certifications:\n\n1. [SAS Certified\
    \ Specialist: Base Programming Using SAS](https://www.sas.com/en_us/certification/credentials/foundation-tools/base-programming-credentials.html)\n\
    2. [SAS Certified Advanced Programmer for SAS 9](https://www.sas.com/en_us/certification/credentials/foundation-tools/advanced-programmer.html)\n\
    \nThe required topics for the Base Programming exam are:\n\n- Read and create\
    \ data files.\n- Manipulate and transform data.\n- Create basic detail and summary\
    \ reports using Base SAS procedures.\n- Identify and correct syntax and programming\
    \ logic errors.\n\nThe required topics for Advanced Programmer are:\n\n- Using\
    \ advanced data step programming statements and efficiency techniques to solve\
    \ complex problems.\n- Writing and interpreting SAS SQL code.\n- Creating and\
    \ using the SAS MACRO facility. (This topic is the only one that is not discussed\
    \ in this book.)\n\nSAS Certification credentials are globally recognized as the\
    \ premier means of validating your SAS knowledge and accessing higher-paying job\
    \ opportunities. Of all skills considered by employers, SAS is one of the most\
    \ valuable in terms of salary. Please check this link as well: [`https://www.sas.com/en_us/careers.html`](https://www.sas.com/en_us/careers.html).\n\
    \nI am certified by Microsoft, Oracle, and Docker in tens of tracks. The safest\
    \ and fastest way to get certified is to study from braindumps. You can buy them\
    \ online. The braindumps are pools of actual exam questions and their correct\
    \ answers. Do not memorize the answers because you might not get the same questions.\
    \ Instead, research the questions that you do not know and try to understand their\
    \ answers. Remember that in the end, at work, your knowledge will be tested and\
    \ not your memory.\n\n## Stay in Touch\n\nPlease stay in touch. Let me know if\
    \ I can help you in any way. I am always glad to give a hand.\n\nMy email: efoda@ieee.org.\
    \  \nMy website: [`www.engyfoda.com`](http://www.engyfoda.com).  \nMy LinkedIn:\
    \ [`https://www.linkedin.com/in/engyfouda/`](https://www.linkedin.com/in/engyfouda/).\n\
    \n## Summary\n\nIn this chapter, we talked about how to write your reports with\
    \ your audience in mind. Then, we talked about the next steps in your data science\
    \ career. You can go ahead to academic certificates or technical ones to prove\
    \ your experience and work on real-world projects under mentoring. Moreover, we\
    \ talked about how to make money online through your data science experience.\
    \ Wish you best of luck!\n\nIndex\n\nA  \n`ANalysis Of VAriance (ANOVA)`  \n`Arithmetic\
    \ operators`  \n`calculation missing value conventions`\n\nB  \n`Bar chart`  \n\
    `ascending sort`  \n`creation dataset`  \n`descending HBar`  \n`histogram creation`\
    \  \n`reverse tick values`  \n`summary statistics table selection`  \n`title`\
    \  \n`Bubble chart`  \n`editing code`  \n`final version`  \n`initial output` \
    \ \n`chart label`  \n`labels`  \n`SASHELP.CLASS`  \n`library sgplot function`\
