- fmt: '# SAS Viya Tour


    After you sign in to your Visual Statistics account on Viya, you will have an
    interface, as shown in Figure 8-1. The interface is divided into three panes.
    The contents pane on the left enables you to work with your data and select your
    model object type. The canvas in the middle is where you build your models. The
    properties pane on the right enables you to set model roles, options, and filters.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig1_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig1_HTML.jpg)


    Figure 8-1 Visual Statistics interface


    Later in this chapter, we shall discuss SAS Visual Statistics in more detail.
    Now, let us see the other products that are available inside SAS Viya along with
    SAS Visual Statistics. Click on the three lines at the top left to show the applications
    menu, as in Figure 8-2.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig2_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig2_HTML.jpg)


    Figure 8-2 Click on the three lines to show the applications menu


    After clicking, all the available applications will show, as in Figure 8-3. In
    the next section, we shall use SAS Studio on the Viya platform by clicking on
    “Develop SAS Code.”


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig3_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig3_HTML.jpg)


    Figure 8-3 SAS Viya applications


    # Map of Counties


    We will use SAS Studio on SAS Viya to create a map of selected counties within
    a state with `PROC GMAP`.


    We modify the code of the example listed at the following URL to visualize Democratic
    and Republican counties in the state of Maine:


    [`http://support.sas.com/kb/24/898.html`](http://support.sas.com/kb/24/898.html)


    From the following URL, Maine’s FIPS Code in SAS is 23:


    [`https://documentation.sas.com/?cdcId=sasstudiocdc&cdcVersion=5.1&docsetId=grmapref&docsetVersion=9.4_01&docsetTarget=n1w5dpp87y5qxon1vxqh3bs4m444.htm&locale=en&activeCdc=pgmsascdc`](https://documentation.sas.com/%253FcdcId%253Dsasstudiocdc%2526cdcVersion%253D5.1%2526docsetId%253Dgrmapref%2526docsetVersion%253D9.4_01%2526docsetTarget%253Dn1w5dpp87y5qxon1vxqh3bs4m444.htm%2526locale%253Den%2526activeCdc%253Dpgmsascdc)


    FIPS stands for Federal Information Processing Standards. Here are the FIPS codes
    for Maine counties: [`https://en.wikipedia.org/wiki/List_of_counties_in_Maine`](https://en.wikipedia.org/wiki/List_of_counties_in_Maine)


    ```

    * Political Parties Illustrated on Maine’s Counties for 2016 Presidential Elections;

    /* Set the graphics environment */

    goptions reset=all cback=white border htitle=12pt htext=10pt;

    /* Create a sample data set */

    data voters;

    /* input the FIPS values of the state and the counties, then the number of voters
    who voted for the democratic candidate and the number of voters who voted republican
    */

    input State County Republican Democrat;

    /*if the county’s number of democratic voters are higher than the republicans
    then mark this county’s party as 1 and 2 if republicans are higher*/

    if democrat > republican then party=1;

    else if democrat< republican then party=2;

    /*actual data values*/

    datalines;

    23 1 28189 22975

    23 3 19419 13377

    23 5 57697 102935

    23 7 7900 7001

    23 9 13682 16107

    23 11 29296 31753

    23 13 9148 12440

    23 15 9727 10241

    23 17 12172 16214

    23 19 41601 32832

    23 21 5403 3098

    23 23 9304 10679

    23 25 14998 9092

    23 27 10378 10442

    23 29 9037 6358

    23 31 50388 55828

    ;

    run;

    /* Project the map coordinates and create a new map data set */

    proc gproject data=maps.counties out=newmap;

    where state=23 ;

    id state county;

    run;

    /*the value pattern is solid and the color is blue or red*/

    pattern1 v=s c=blue;

    pattern2 v=M3X0 c=red;

    /* Generate the map */

    proc gmap data=voters map=newmap all;

    id state county;

    choro party / nolegend ;

    title "Political Parties Illustrated on Maine’s Counties for 2016 Presidential
    Election";

    run;

    quit;

    ```


    Listing 8-1 Political Parties Illustrated on Maine’s Counties for 2016 Presidential
    Election


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig4_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig4_HTML.jpg)


    Figure 8-4 Political parties illustrated on Maine’s counties for 2016 presidential
    election


    Listing 8-1 starts by creating a new dataset called `voters` that contains four
    columns: `state`, `county`, `democrat`, and `republican`. The first column, `state`,
    is the state’s FIPS code, which is 23, indicating Maine. The second column, `county`,
    is the county’s FIPS code. The third column, `democrat`, is the number of voters
    who voted for the Democratic candidate, while the last column, `republican`, is
    the number of voters who voted for the Republican candidate.


    Then, the code compares the Democratic and Republican numbers of voters. If the
    Democratic is larger, this county’s party is 1, else it’s 2. The code uses these
    numbers to color the county. The `datalines` section has the actual values to
    fill in the dataset.


    The new section uses `PROC GPROJECT` to project a new map that has only the state
    of Maine and its counties by using the FIPS values.


    Then it sets two patterns (Figure 8-4). The first one is for `party=1`, which
    is solid blue for Democrats, and the second is `M3X0`, which is crosshatched lines,
    with red color for `party=2`, for Republicans. You can check the SAS documentation
    for further details about the `PATTERN` keyword at this URL: [`https://documentation.sas.com/?docsetId=graphref&docsetTarget=p02daopdgx5yh4n1vmffk4ud4697.htm&docsetVersion=9.4&locale=en`](https://documentation.sas.com/%253FdocsetId%253Dgraphref%2526docsetTarget%253Dp02daopdgx5yh4n1vmffk4ud4697.htm%2526docsetVersion%253D9.4%2526locale%253Den).


    `PROC GMAP` uses these two patterns to generate the colored choro map using the
    `voters` dataset and the map that `PROC GPROJECT` generated. To learn more about
    `PROC GMAP`, please check the following URL of the SAS documentation:


    [`https://documentation.sas.com/?docsetId=grmapref&docsetTarget=n0ncszzwvnx84bn1ql4487r08jpa.htm&docsetVersion=9.4_01&locale=en`](https://documentation.sas.com/%253FdocsetId%253Dgrmapref%2526docsetTarget%253Dn0ncszzwvnx84bn1ql4487r08jpa.htm%2526docsetVersion%253D9.4_01%2526locale%253Den)


    To verify the results, I checked plenty of sites to compare my results with theirs.
    A couple of them are as follows:


    *   [`https://www.politico.com/2016-election/results/map/president/maine/`](https://www.politico.com/2016-election/results/map/president/maine/)

    *   [`https://en.wikipedia.org/wiki/2016_United_States_presidential_election_in_Maine`](https://en.wikipedia.org/wiki/2016_United_States_presidential_election_in_Maine)


    Similarly, I was able to compare the parties’ distribution over the counties over
    the years, which was mentioned in Chapter 1, in Figure 1-12.


    I added the code for the years 2012, 2008, 2004, and 2000 to the “Example Code”
    folder. They are `Listing 8-2.sas`, `Listing 8-3.sas`, `Listing 8-4.sas`, and
    `Listing 8-5.sas`. These listed programs generate the maps in Figure 8-5.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig5_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig5_HTML.jpg)


    Figure 8-5 Maps of how Maine’s counties voted in the presidential elections in
    years 2000–2016


    For further resources, please check the appendix.'
