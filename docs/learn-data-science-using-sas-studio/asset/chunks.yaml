    # Introduction


    The book’s scope is primarily to introduce SAS Studio, a free data science web
    browser–based product for non-commercial and academic usage. SAS Studio is also
    known as SAS University Edition. The power of SAS Studio relies on its visual
    point-and-click user interface that generates SAS code. Users can create data
    analysis reports without writing a line of code, unlike with R and Python. Hence,
    data cleaning, statistics, and visualization are easy to do.


    The book’s case study analyzes the presidential elections data in Maine, which
    is part of a project I did at Harvard University. Chapter [1](#501068_1_En_1_Chapter.xhtml)
    explains the case study in more detail.


    In addition to the presidential elections, the book uses real-life examples like
    analyzing stocks, oil and gold prices, crime, marketing, and healthcare. The whole
    book follows the paradigm of data science in action to demonstrate how easy it
    is to perform complicated tasks and visualizations in SAS Studio.


    The book starts from scratch in step-by-step, hands-on labs, and includes screenshots
    of every step.


    It will provide readers the required expertise in data science and analytics using
    SAS Studio, such as how to do the following:


    - Import and export raw data files

    - Manipulate and transform data

    - Combine SAS data sets

    - Create summary statistics and reports using SAS procedures

    - Identify and correct data, syntax, and programming logic errors

    - Compare between samples using T-test and Anova

    - Predict new values using linear regression

    - Create visualizations


    Moreover, it will show how to do visualizations, including maps, step-by-step.
    In many cases, readers will not need to write a line of code, because SAS has
    a powerful graphical user interface. It is much easier to learn compared to R
    and Python. However, every example will explain the auto-generated code and how
    to edit it to perform more-complicated advanced tasks. The book will introduce
    you to multiple SAS products, such as SAS Studio, SAS Viya, SAS Analytics, and
    SAS Visual Statistics.


    I teach most of these contents as a course at one of the Microsoft Partner Centers.
    The students always get amazed by how much they learn in merely a few days.


    ## Who Should Read This Book?


    The primary audience of this book is students who are newbies to data science
    and might not have deep programming experience. Consequently, university professors
    can use it as a handout for their courses. Also, technical instructors, like me,
    who teach professionals from various industry sectors at certified training centers
    can teach from it.


    Also, system analysts and scientists who are experienced but new to SAS will find
    faster and more efficient tools to achieve their daily tasks. From my experience,
    I learned from the attendees of my courses that many government agencies migrated
    to SAS. Moreover, data journalists and investigative reporters will find the book
    easy to follow and will be able to generate pretty visualizations quickly.


    ## How Is This Book Organized?


    In general, the book tries to balance between using SAS point-and-click and the
    code. The users might be tempted to rely on the integrated development environment
    (IDE). However, the book uses the IDE merely to introduce the users to the various
    tasks, along with explaining the code so as to be able to do advanced tasks.


    The book has three parts. Part [I](https://doi.org/10.1007/978-1-4842-6237-5_I),
    “Basics” (Chapters [1](#501068_1_En_1_Chapter.xhtml), [2](#501068_1_En_2_Chapter.xhtml),
    and [3](#501068_1_En_3_Chapter.xhtml)), gets you familiar with the SAS interface
    and the basic essential tasks. Chapter [1](#501068_1_En_1_Chapter.xhtml) focuses
    on drawing a general idea of the case study of the presidential election project
    in the state of Maine and its outputs. Throughout the book, you will learn how
    to get those output charts and analytics step-by-step.


    Then, Part [II](https://doi.org/10.1007/978-1-4842-6237-5_II), “More Programming”
    (Chapters [4](#501068_1_En_4_Chapter.xhtml), [5](#501068_1_En_5_Chapter.xhtml),
    and [6](#501068_1_En_6_Chapter.xhtml)), focuses on more advanced programming aspects.
    Part [III](https://doi.org/10.1007/978-1-4842-6237-5_III), “Advanced Topics” (Chapters
    [7](#501068_1_En_7_Chapter.xhtml), [8](#501068_1_En_8_Chapter.xhtml), and [9](#501068_1_En_9_Chapter.xhtml)),
    takes you from analyzing historical data to predicting the future and introducing
    you to more advanced SAS platforms.


    Finally, in Chapter [9](#501068_1_En_9_Chapter.xhtml), I try to give some insights
    from my personal experience on how to get certified and how to make money online
    through teaching, writing, and competing online. Moreover, I shall give you more
    details on the data science graduate professional certificate at Harvard University,
    Extension School.


    All the SAS example code is in the “Example Code” folder, and datasets required
    for this book are in the “Datasets” folder of this book’s source code. Go to [`http://www.apress.com/9781484262368`](http://www.apress.com/9781484262368)
    and click the Download Source Code button to access it.


