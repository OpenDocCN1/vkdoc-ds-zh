    what you are typing, along with an explanation and additional links for examples
    and documentation, as shown in Figure [2-3](#501068_1_En_2_Chapter.xhtml#Fig3).
    This feature is useful for beginners.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig3_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Autocomplete feature and helpful pop-up menus


    However, when you get more experienced and familiar with SAS Studio and would
    like to disable it, you can do that by clicking on Preferences, as shown in Figure
    [2-4](#501068_1_En_2_Chapter.xhtml#Fig4).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig4_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Preferences


    Now, click on Code and Log and uncheck “Enable autocomplete (CTRL + spacebar or
    Command + spacebar),” as shown in Figure [2-5](#501068_1_En_2_Chapter.xhtml#Fig5).
    As this book targets the beginners, we will not change the defaults.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig5_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    Code and Log to enable or disable code autocomplete


    Now, type in the code shown in Listing [2-1](#501068_1_En_2_Chapter.xhtml#PC1).


