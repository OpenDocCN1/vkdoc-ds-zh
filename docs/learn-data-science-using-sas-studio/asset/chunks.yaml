    ### 如何根据读者需求撰写结果报告？


    在完成从 `SAS Studio` 生成报告的技术细节后，我们需要考虑阅读报告的受众。我们的受众群体多样，包括数据科学家同事、团队领导、公司董事会、营销团队以及公司客户。


    例如，客户雇佣我们是为了判断某只股票是买入还是卖出。他们不会关心直方图或地图。他们需要的是通俗易懂的说明，来了解我们决策的依据。而另一方面，我们的经理和团队成员则需要了解每一个细节，甚至需要能够阅读和理解代码。


    了解每个相关方所需交付的成果至关重要，并且要针对受众需求量身定制报告内容。对可视化的解释比可视化本身更为重要。


    以下是数据分析报告示例的更多链接：


    - [`https://www.datapine.com/blog/analytical-report-example-and-template/`](https://www.datapine.com/blog/analytical-report-example-and-template/)

    - [`http://www.stat.cmu.edu/~brian/701/notes/paper-structure.pdf`](http://www.stat.cmu.edu/%257Ebrian/701/notes/paper-structure.pdf)

    - [`https://www.examples.com/business/data-analysis-report-examples.html`](https://www.examples.com/business/data-analysis-report-examples.html)

    - [`https://bizfluent.com/how-5822409-write-good-data-analysis-report.html`](https://bizfluent.com/how-5822409-write-good-data-analysis-report.html)


    以下是数据科学报告结构的相关链接：


    - [`https://www.kaggle.com/WinningModelDocumentationGuidelines`](https://www.kaggle.com/WinningModelDocumentationGuidelines)

    - [`https://github.com/rdpeng/courses/blob/master/05_ReproducibleResearch/Checklist/Reproducible%20Research%20Checklist.pdf`](https://github.com/rdpeng/courses/blob/master/05_ReproducibleResearch/Checklist/Reproducible%2520Research%2520Checklist.pdf)


    ## 如何通过数据科学在线赚钱？


    你可以找到大量关于如何通过数据科学在线赚钱的文章。在本节中，我将分享自己的一部分经验以及实际所做的工作。我是一名自由讲师、顾问、记者和作者。


    ### 在线教学


    我一生都在教授计算机和技术课程。我的第一堂课是在开罗大学工程学院读大二时教授的。在埃及，工程专业需要五年而不是四年才能毕业。我在大四时成为了微软认证专家。毕业后，我通过了微软的多项认证，成为
    .NET 领域的特许专家和微软认证讲师。


    是的，获得认证可以促进你的职业发展并证明你的专业能力。其他人则更倾向于通过制作在线教程、撰写博客以及在技术社区回答他人问题来展示技能。我经常读到或听到有人通过
    YouTube 赚取数千美元。但我不认识任何真正以此为生的人。


    无论如何，另一种方式对我并不适用，因为在认证中心教授技术课程，你必须获得认证。然而，这样做的弊端是你必须不断追逐最新技术，通过获得认证来始终保持顶尖水平。否则你就会失去优势。如果你在某个时刻感到疲惫，可以转向在大学里教授基础科学和技术学术课程。在我人生的某些阶段，我也这样做过，但很快我就怀念那种激情，于是从学术界转回了技术领域。当然，教授技术课程在经济上的回报远高于在任何大学任教。目前，我作为自由讲师，在
    ONLC 培训中心、微软合作伙伴以及其他认证中心教授 SAS、Docker 和 Kubernetes 课程。


    我以类似的方式开始了数据科学的探索。我在该领域迈出的第一步是考取哈佛研究生专业证书。那是一次令人振奋的经历。我稍后会详细向你介绍，因为我不愿将其仅简化为本节中的一段话。


    ### 在线写作


    我以自由职业者和志愿者的身份为多个平台在线撰稿。志愿服务通常会为我带来工作或项目机会。这是展示你经验的另一种方式。但是，你必须真诚地做志愿服务。我从未将志愿服务视为展示经验的机会，但在很多情况下，正是因为它而收到了工作邀请。


    有一次，在与某个媒体的编辑产生分歧后，我免费在 *Medium* 上写了一篇文章，仅仅是为了分享我的知识和经验。令我惊讶的是，我收到了 *Medium* 的邀请，加入其合作伙伴计划。在该计划下发表文章后，我开始获得收入，并收到了另一份为
    *Medium* 杂志撰稿的邀请。该计划的优点是，你不必被迫撰写特定主题，也不会有编辑可能拒绝你的文章。你可以在有时间的时候写任何你喜欢的内容，只要有人阅读并喜欢你的文章，你就能赚钱。以下是加入
    *Medium* 合作伙伴计划的链接：


    [`https://medium.com/creators`](https://medium.com/creators)


    尽管我以高于 *Medium* 的稿费为多个平台撰稿，但我最钟爱的还是 *Medium*。我极力推荐它作为你只要有空就应去撰稿的最佳平台。定期写作是获得稳定现金流和粉丝的最佳实践。不幸的是，我目前还做不到这一点，因为我大部分时间都在忙于教学。我认为写作是另一种教学方式。然而，我更喜欢教学中的人际互动。我的其他一些朋友则更喜欢写作而非教学，因为文章的生命力更持久。

    '
- fmt: '### Kaggle-Zillow Competition


    `Kaggle` is a third way to make money online. I know some people resigned from
    their companies and earn their living by competing at `Kaggle`. It is a data science
    hub, where universities and companies post projects with datasets as challenges
    with cash prizes. I tried it once, and it was a wonderful experience; I learned
    a lot from it.


    The competition I joined was for $1,200,000 over two rounds. The participants
    would compete for about a year and a half. After the first round, only 100 participants
    whose scores were most accurate would join the second round. There were small
    prizes after the first round of $50,000. After the second round, the first prize
    is one million dollars. The goal of the contest is to predict house prices for
    the coming two years. The competition was presented by `Zillow`.


    The competitions’ datasets are usually of two types: one for training and the
    other for testing. Moreover, some competitions are open in the number of kernel
    submissions, while others are restricted to the number of submissions. So, read
    the rules carefully so as not to waste your chances.


    You can check the contests’ file, prizes, and timelines at this link: [`https://www.kaggle.com/c/zillow-prize-1`](https://www.kaggle.com/c/zillow-prize-1).


    The timeline for the contest I entered started in May 2017 and ended in January
    2019. Therefore, it is not easy to win contests. Personally, I do not recommend
    that you resign from your work to earn a living from competing at `Kaggle` unless
    you actually tried and learned the winning formula.


    At `Kaggle`, the participants can collaborate and post their code or results if
    they like. This sharing raises the rank of the kernel and the discussion rank
    of the participant. Some kagglers get famous, and their contributions get plenty
    of thumbs-ups. Employers and research centers many times hire these popular Kagglers
    even if they do not win competitions. Hence, `Kaggle` is equivalent to `GitHub`
    in showing the data scientists’ skills and programming styles.


    Again, be careful when you submit your kernel as to whether it is public or private.
    Some competitions prohibit you from changing your kernel’s privacy after you set
    it the first time. Some competitions accept sharing your kernel once and making
    another private.


    For this competition, I used the `XGBoost` algorithm for predicting the prices.
    I learned about the `XGBoost` algorithm from `Kaggle`. So, it is an educational
    spot for beginners as well. Recently, `Kaggle` started offering free online data
    science courses and free datasets for trying. Here is the link: [`https://www.kaggle.com/learn/overview`](https://www.kaggle.com/learn/overview).


    If you have an issue or a question, feel free to post on the discussion board.
    The `Kaggle` support team and the community are highly active, supportive, and
    cooperative. After some time, you can get to know other kagglers, form a team
    with them, and compete together.


    My rank in the `Zillow` competition was 231 out of 3131 teams. My algorithm was
    working fine, and by altering some values, the results were enhancing tremendously.
    I jumped from position 1000 to 231 in the leaderboard in a couple of weeks. Unfortunately,
    I was unable to continue competing as I had to travel to Boston to attend a couple
    of courses on campus. You might disagree with my decision; each person prioritizes
    differently. To me, my master’s degree at Harvard University was my highest priority
    and worth more than a million dollars.


    ## Harvard University, Extension School: Data Science Graduate Professional Certificate


    This certificate consists of four courses that you can choose to attend online
    or on campus. All the lectures and labs are live-streamed and recorded. You are
    free to watch them as many times as you need even after graduation. If you think
    about it and consider taking it to advance your career, I highly recommend that
    you start right away. The course prices increase every semester, so the faster,
    the cheaper. No application or deep prior experience is required. For many people
    I know, it was easy to enroll but too hard to finish. The certificate needs much
    work and practice. You cannot take it on the fly. You must earn at least B in
    all the courses and finish them before three years. The recommended time is eighteen
    months. One of the courses must be a statistics course, and another mandatory
    course is the data science course. The other two courses are electives.


    I finished the certificate in about a year, and all of my grades were A and A-.
    For two of these courses, I earned not only the full mark but also the bonus marks.
    By the way, there is no A+ at Harvard University! I started with the statistics
    course as a summer condensed course at Harvard University, Summer School. The
    course instructor was Professor Michael Parzen. He is one of the best professors
    ever and is rated as the most popular professor at the university. In fall 2016,
    I took two courses in one semester. The one that I document through this book
    was with Professor Larry Adams. The other course was "Big Data in Health Care"
    with Professor Oleg Pianykh. I learned a lot from that course as well. In spring,
    I took the mandatory data science course with Professors Andrey Sivachenko and
    Victor Farutin. It was an outstanding course, indeed a magnificent experience.


    I recommend that you start with the statistics course, then the mandatory data
    science, then take the electives. You do not always have the power to choose,
    because not all courses are offered every semester. It is always better to check
    with your school advisor. The advisors at Harvard University are awesome—so friendly
    and knowledgeable. Be aware that sometimes the rules or courses change after you
    enroll in any of the university’s programs. Hence, it is always better to update
    your advisor with your progress and discuss with them the courses that interest
    you before registering. The advisor always checks if you will fulfill the certificate
    or degree requirements and will direct you to the best choices. My advisor, Allyson
    K. Boggess, and my enrollment coach, Kristin Keller, helped me tremendously. Definitely,
    I would not have finished my degree without their help and Professor Sallie Sharp’s
    supervision as my capstone project director.


    The certificate is expensive, but you will earn this money back in about a year.
    Having the Harvard University logo on your resume and `LinkedIn` account advances
    your job opportunities to a higher level. Besides the work and money, the Harvard
    experience changes your life and your way of thinking forever. Yes, it is tough;
    you will stay awake working and studying for days without an hour of sleep. However,
    trust me, you will love it!


    Data science tracks, whether academic or technical, are ubiquitous nowadays. You
    can try them as well. Many universities other than Harvard University started
    offering degrees and certificates in data science.'
