    Figure 6-17


    Add `AGE_GROUP` variable


    To get the count of each age group and its percentage, run one-way frequencies
    over the `AGE_GROUP` variable, as in Figure [6-18](#501068_1_En_6_Chapter.xhtml#Fig18).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig18_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig18_HTML.jpg)


    Figure 6-18


    One-way frequencies over `AGE_GROUP` variable


    There are other ways to make `AGE_GROUP` in SAS. You can read more about them
    at this URL: [`https://stackoverflow.com/questions/53395384/creating-an-agegroup-variable-in-sas`](https://stackoverflow.com/questions/53395384/creating-an-agegroup-variable-in-sas).


    ## DROP Statement


    The `DROP` statement specifies excluding some variables from the dataset. In the
    `Voters_A.csv` dataset, we have the “Designate” column. It is entirely empty.
    In the process of cleaning the data, we should delete this column; in other words,
    drop it, as in Listing [6-10](#501068_1_En_6_Chapter.xhtml#PC11).


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/SAS4Days/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    drop designate;

    run;

    proc print ;

    run;

    Listing 6-10

    DROP Statement Example

    ```


    After running Listing [6-10](#501068_1_En_6_Chapter.xhtml#PC11), the output will
    have eight columns only, as in Figure [6-19](#501068_1_En_6_Chapter.xhtml#Fig19).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig19_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig19_HTML.jpg)


    Figure 6-19


    Eight columns after dropping one


    ## SET Statement


    We have been using the `SET` statement in the previous examples without discussing
    it in detail. We learned so far that we use the `SET` statement to copy an old
    dataset to a new one. Hence, all our processing is executed over the new dataset,
    while the old one is left intact. The `SET` statement has multiple functions.
    This website has many examples for each of these functions:


    [`https://documentation.sas.com/?docsetId=lestmtsref&docsetTarget=p00hxg3x8lwivcn1f0e9axziw57y.htm&docsetVersion=3.1&locale=en`](https://documentation.sas.com/%253FdocsetId%253Dlestmtsref%2526docsetTarget%253Dp00hxg3x8lwivcn1f0e9axziw57y.htm%2526docsetVersion%253D3.1%2526locale%253Den)


    However, in this section, we focus on appending two datasets into a new larger
    one. Simply, its syntax is: `SET <dataset1> <dataset2> <dataset3> …`.


    Note that all the dataset names are separated by spaces.


    We already have seen in Listing [6-6](#501068_1_En_6_Chapter.xhtml#PC6) how to
    copy the old dataset to a new dataset. In this example, let us do the reverse
    process. Assume we had the two Democrat and Republican datasets and wanted to
    combine them into one.


    Re-run Listing [6-6](#501068_1_En_6_Chapter.xhtml#PC6) first, so you have the
    two datasets loaded in the `Work` library. Then, run Listing [6-11](#501068_1_En_6_Chapter.xhtml#PC12),
    where it merges the two datasets.


    ```

    data all;

    set voters_democrats voters_republicans;

    run;

    proc print data=all;

    run;

    Listing 6-11

    Appending Two Datasets

    ```


    After running Listing [6-11](#501068_1_En_6_Chapter.xhtml#PC12), the dataset `WORK.ALL`
    has 48 rows because `WORK.VOTERS_DEMOCRATS` and `WORK.VOTERS_REPUBLICANS` are
    24 rows each. The output is as in Figure [6-20](#501068_1_En_6_Chapter.xhtml#Fig20).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig20_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig20_HTML.jpg)


    Figure 6-20


    Appending the Democrats and Republicans datasets


    ## Summary


    This chapter explains the steps to clean and prepare data for analysis. It discusses
    the `LABEL` and `FORMAT` statements. It also explains how to create new variables
    and how to rearrange the variables in datasets. It explains the `IF`, `IF-THEN`,
    and `IF-THEN-ELSE` statements. Finally, it explains the `DROP` and `SET` statements.
    Now, we are done with the most common data analysis tasks, and the next chapter
    will introduce predicting the future using regression.


    # Part III: Advanced Topics


    # 7. Regression


    The linear regression task fits a linear model to predict a single continuous
    dependent variable from one or more continuous or categorical predictor variables.
    This task produces statistics and graphs for interpreting the results.'
