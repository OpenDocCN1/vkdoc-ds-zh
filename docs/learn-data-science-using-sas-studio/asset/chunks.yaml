    ### 第一种方法


    点击**服务器文件和文件夹** ➤ **上传**。然后，从本地计算机中选择 Excel、CSV 或任何格式的文件，将其上传到 SAS Studio（见图 2-21
    和 2-22）。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig21_HTML.jpg](img/501068_1_En_2_Fig21_HTML.jpg)


    图 2-21 点击**上传**图标


    同样，如果您想将文件从 SAS Studio 内部下载到本地计算机，请选择该文件并点击**下载**图标进行下载（见图 2-23）。您将在本地计算机的**下载**文件夹中找到它（见图
    2-23）。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig23_HTML.jpg](img/501068_1_En_2_Fig23_HTML.jpg)


    图 2-23 使用**下载**图标将 SAS Studio 中的任何文件下载到您的操作系统


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig22_HTML.jpg](img/501068_1_En_2_Fig22_HTML.jpg)


    图 2-22 从服务器文件和文件夹中选择文件


    ### 第二种方法


    只需将所需文件（SAS、XLS 或 CSV）复制并粘贴到 **myfolders** 文件夹中。由于 SAS Studio 在虚拟机内运行，除了共享文件夹中的文件外，它无法访问
    Windows 文件系统或本地操作系统上的任何文件。


    ## 访问 SAS 逻辑库中的数据


    SAS Studio 将表存储在逻辑库中。通常，这些逻辑库是永久性的。然而，**Work** 逻辑库是一个临时库，仅持续当前会话，并在刷新浏览器或注销时消失。**逻辑库**选项卡中的所有其他逻辑库都是永久性的。例如，**SAS
    Help** 就是一个永久逻辑库。


    ### 如何区分永久逻辑库和临时逻辑库？


    任何数据集都有一个由点分隔的两级名称，语法如下：`<第一级名称>.<第二级名称>`；例如，`sashelp.cars` 或 `newlib.adults`。这表明您的数据集保存在一个永久逻辑库中。但是，如果您的数据集的第一级是
    `work`，则它保存在一个临时逻辑库中；例如，`work.ratedata`。


    SAS Studio 默认使用 **Work** 逻辑库。因此，对于任何只有一级名称的数据集，`work` 将是其第一级，并且它是临时的；例如，`income`。您可以在**逻辑库**选项卡的
    **Work** 逻辑库下找到它。因此，`work.income` 等同于 `income`；两者相同，都表示一个名为 `income` 的临时逻辑库。


    ## 创建新逻辑库


    有两种创建新逻辑库的方法：通过代码或通过图形用户界面。通过代码创建新逻辑库只需一条命令：`libname <逻辑库名称> <路径>;`


    ### 逻辑库命名约定


    您创建的逻辑库的名称长度必须在 1 到 8 个字符之间，并且以字母或下划线开头。它不能以数字开头或包含任何特殊字符。名称的其余字符可以是字母、数字和下划线。不允许使用特殊字符。


    路径可以是保存在**服务器文件和文件夹**选项卡中的任何文件夹。键入如清单 2-4 所示的代码（该代码位于**示例代码**文件夹中），您可以从该处复制代码并将其粘贴到新程序中以创建您的新逻辑库，然后点击**运行**。


    ```

    libname newlib ''/folders/myfolders'';

    清单 2-4

    使用 libname 语句创建新逻辑库

    ```


    您将在**逻辑库**选项卡中找到您的逻辑库。如果没有，请点击**刷新**。


    第二种方法是使用图形用户界面。点击**逻辑库**选项卡，然后点击**新建逻辑库**图标，如图 2-24 所示。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig24_HTML.jpg](img/501068_1_En_2_Fig24_HTML.jpg)


    图 2-24 使用图形用户界面创建新逻辑库


    选择您的文件夹，如图 2-25 所示。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig25_HTML.jpg](img/501068_1_En_2_Fig25_HTML.jpg)


    图 2-25 选择逻辑库的位置


    输入其名称和路径，如图 2-26 所示。最好勾选**启动时重新创建此逻辑库**，这样您就可以在每次刷新 SAS Studio 或重启虚拟机时找到它。否则，您将无法找到它，需要手动将其重新添加到逻辑库列表中。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig26_HTML.jpg](img/501068_1_En_2_Fig26_HTML.jpg)


    图 2-26 配置新逻辑库的创建选项


    点击**确定**。您将在**逻辑库**列表中找到您的新逻辑库，如图 2-27 所示。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig27_HTML.jpg](img/501068_1_En_2_Fig27_HTML.jpg)


    图 2-27 **逻辑库**列表中的新逻辑库

