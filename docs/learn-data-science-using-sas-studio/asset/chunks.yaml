  trans: '

    # 比较运算符


    比较运算符用于对两个变量、常量或表达式建立比较、运算或计算关系。若比较结果为真，则返回 1；若为假，则返回 0。


    比较运算符可以用符号表示，也可以用其助记符表示，如表 5-3 所示。`SAS Studio` 可以处理符号或助记符。助记符可以是大写、小写或大小写混合形式。


    **表 5-3** 比较运算符


    | 符号 | 助记符等效 | 定义 | 示例 |

    | --- | --- | --- | --- |

    | `=` | `EQ` | 等于 | `a=3` |

    | `^=` | `NE` | 不等于 | `a ne 3` |

    | `¬=` | `NE` | 不等于 | |

    | `~=` | `NE` | 不等于 | |

    | `>` | `GT` | 大于 | `num>5` |

    | `<` | `LT` | 小于 | `num<8` |

    | `>=` | `GE` | 大于或等于 | `sales>=300` |

    | `<=` | `LE` | 小于或等于 | `sales<=100` |

    | | `IN` | 等于列表中的某一个值 | `num in (3, 4, 5)` |


    再次说明，你可以使用助记符或符号。例如：


    ```

    if grade >= 50 then status = pass;

    else status = fail;

    ```


    等价于：


    ```

    if grade GE 50 then status EQ pass;

    else status EQ fail;

    ```


    要了解有关表达式中 SAS 运算符的更多信息，请访问此网址查看 SAS 文档：[`http://bit.ly/36UGEnk`](http://bit.ly/36UGEnk)。


    ## `PROC SQL` 语句


    编写 SQL 语句对于数据库开发人员至关重要。`SAS Studio` 使数据库开发人员能够使用 `PROC SQL` 语句，像以往一样创建表、查询表、从表中选择、删除或更新任何数据，以及合并或子集化表。在本书中，我们展示了大量示例，说明如何使用其他
    SAS 语句实现这些任务。在本节中，你将学习如何使用 `PROC SQL`。


    `PROC SQL` 语句的顺序如下：


    ```

    PROC SQL;

    select

    from

    group by

    having

    order by

    ;

    quit;

    ```


    要记住这个顺序，你可以使用这个助记口诀：“So Few Workers Go Home On Time。” 该口诀的来源是 [`https://blogs.sas.com/content/sastraining/2012/04/24/go-home-on-time-with-these-5-proc-sql-tips/`](https://blogs.sas.com/content/sastraining/2012/04/24/go-home-on-time-with-these-5-proc-sql-tips/)。


    在第 2 章的清单 2-5 中，我们通过过滤掉欧洲制造的汽车，在 `newlib` 逻辑库中创建了一个新表。在清单 5-1 中，我们使用 `PROC SQL`
    完成了相同的任务。


    ```

    proc sql;

    create table newlib.europeancars as

    select * from sashelp.cars where origin = "Europe" ;

    quit;

    清单 5-1

    PROC SQL 示例

    ```


    在此示例（清单 5-1）中，我们从 `PROC SQL` 开始。然后，我们创建一个表，并使用 `AS` 关键字定义表的内容。我们使用 `SELECT *`
    从 `SASHELP.CARS` 中选择所有列。为了过滤出仅欧洲汽车的条件，我们使用了 `WHERE` 子句并检查 `origin` 变量的值。如果 `origin
    = Europe`，则将该行添加到表中，否则排除该行。


    ## `SELECT-WHERE` 语句


    `SELECT` 语句是 `PROC SQL` 的主要工具。你可以用它来识别、检索和操作表中的数据列。


    以下简单的 `SELECT` 语句足以生成有用的结果：


    ```

    select party

    from maine.voters;

    ```


    上述语句包含一个 `SELECT` 子句（列出了 `party` 列）和一个 `FROM` 子句（列出了包含 `party` 列的表）。


    ### `WHERE` 子句


    `WHERE` 子句通过添加条件，为 `SELECT` 语句列表增加了更多说明。它类似于我们将在下一章讨论的 `IF-THEN-ELSE` 语句。


    例如，如果我们想检查缅因州老年人的党派分布，我们应该向 `SELECT` 语句添加一个 `WHERE` 子句，如下所示：


    ```

    select Party

    from maine.voters;

    where age >= 65;

    ```


    另一个例子是清单 5-2，它来自 SAS 基础编程认证免费备考指南的样题。


    ```

    data class;

    input name $ gender $ age;

    datalines;

    Anna F 23

    Ben M 25

    Bob M 21

    Brian M 27

    Edward M 26

    Emma F 32

    Joe M 34

    Sam F 32

    Tom M 24

    ;

    data WORK.MALES_OVER25;

    set WORK.CLASS;

    where Gender="M";

    where age>25;

    run;

    清单 5-2

    WHERE 子句示例

    ```


    数据集 `WORK.MALES_OVER25` 中有多少个观测值？


    输出将有五个观测值。输出结果如图 5-1 所示。该表包含了所有年龄大于 25 岁的男性和女性，因为只有最后一个 `WHERE` 子句生效。


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig1_HTML.jpg](img/501068_1_En_5_Fig1_HTML.jpg)


    **图 5-1** `WHERE` 子句示例的输出


    如果你想修改代码，使其生成一个包含年龄大于 25 岁的男性的表，你应该使用 `AND` 运算符将两个条件组合起来。


    而不是使用两个 `WHERE` 语句：


    ```

    where Gender="M";

    where age>25;

    ```


    应该是：


    ```

    where Gender="M" and age>25;

    ```


    或者使用 `WHERE` 和 `WHERE ALSO` 语句，如下所示：


    ```

    where Gender=”M”;

    where also age>25;

    ```


    在清单 5-2 中，`WHERE` 语句用于对数据集进行子集化。还有一种对数据集进行子集化的方法，即使用不带 `THEN` 的 `IF` 语句；我们将在下一章中介绍一个相关示例。


    此外，该清单还表明，如果我们有多个连续的 `WHERE` 语句（而非 `WHERE ALSO`），只有最后一个语句会生效。


    ## `SELECT-WHEN-OTHERWISE` 语句


    `SELECT-WHEN` 语句是一个条件语句，类似于 `IF-THEN` 语句。


    其语法如下：


    ```

    SELECT ;

    WHEN-1 (when-expression-1 ) statement;

    ```


    `select-expression` 是可选的。让我们看几个例子，一个带有 `select-expression`，另一个没有。


    ```

    DATA MYDATA;

    SET sashelp.class;

    SELECT(age);

    when (10) status="child";

    WHEN (11,12) status="preteen";

    OTHERWISE status="teenager";

    END;

    PROC PRINT DATA=MYDATA;

    RUN;

    清单 5-3

    select-expression 存在的示例

    ```


    如果存在 `select-expression`，SAS 会评估 `select-expression` 和 `when-expression`。SAS 会比较两者是否相等，并返回真或假值。如果比较结果为真，则执行语句。如果为假，则继续执行下一个
    `when-expression`。如果不再有 `WHEN` 语句，则执行 `OTHERWISE` 语句。参见图 5-2。


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig2_HTML.jpg](img/501068_1_En_5_Fig2_HTML.jpg)


    **图 5-2** `Select-Expression` 子句示例的输出


    如果没有 `select-expression`，则评估 `when-expression` 以产生一个布尔结果。如果结果为真，则执行语句。如果为假，SAS
    会继续执行下一个 `when-expression` 或 `OTHERWISE` 语句。如果所有 `when-expressions` 的结果都为假，并且没有
    `OTHERWISE` 语句，SAS 会发出错误消息。如果多个 `WHEN` 语句的 `when-expression` 都为真，则仅使用第一个 `WHEN`
    语句。参见图 5-3。


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig3_HTML.jpg](img/501068_1_En_5_Fig3_HTML.jpg)


    **图 5-3** 缺少 `Select-Expression` 子句示例的输出


    ```

    DATA MYDATA;

    SET sashelp.class;

    SELECT;

    WHEN (age=15 and sex="F") research="include";

    OTHERWISE research="not include";

    END;

    PROC PRINT DATA=MYDATA;

    RUN;

    清单 5-4

    无 select-expression 的示例

    ```

    '
- fmt: '# DO Loops


    There are three types of `DO` loops for iteration: `DO LOOP`, `DO UNTIL`, and
    `DO WHILE`. The basic syntax for the `DO` loop is as follows:


    ```

    DO indexvariable= initialvalue to endvalue    ;

    SAS statements . . .

    END;

    ```


    By default, the increment value is 1, but you can change it. The following example
    is to add the odd numbers only starting from 1 to 10. To be able to save the iteration
    in the output dataset, use the `OUTPUT` statement; this saves every observation
    instantly instead of at the end of the data step. See Figure 5-4.


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig4_HTML.jpg](images/501068_1_En_5_Chapter/501068_1_En_5_Fig4_HTML.jpg)


    Figure 5-4 – The DO LOOP Output Example


    ```

    data b;

    SUM=0;

    DO ILOOP=1 to 10 by 2;

    SUM=SUM + ILOOP;

    output;* The OUTPUT statement tells SAS to write the current observation to a
    SAS data set immediately, not at the end of the DATA step;

    END;

    run;

    Listing 5-5 – DO LOOP Example

    ```


    The `DO UNTIL` loop keeps iterating until the condition of the `UNTIL` clause
    becomes true. The `UNTIL` condition is evaluated at the end of the loop. Let’s
    redo the previous example using the `DO UNTIL` loop. Pay attention that you must
    increment the counter manually inside the loop; otherwise, it is an infinite loop.
    The good news is that even if you did an infinite loop, there is no need to worry,
    as SAS Studio won’t crash. It will take a longer time than normal in execution,
    then it will generate an error for you. Hence, again, it is always a good habit
    to check the SAS log even if you receive results. See Listing 5-6 and Figure 5-5.


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig5_HTML.jpg](images/501068_1_En_5_Chapter/501068_1_En_5_Fig5_HTML.jpg)


    Figure 5-5 – The DO UNTIL Output Example


    ```

    data d;

    SUM=0;

    i=1;

    DO UNTIL (i GT 9);

    SUM=SUM + i;

    output;

    i=i+2;

    END;

    run;

    Listing 5-6 – DO UNTIL Example

    ```


    The `DO WHILE` is the inverse of the `DO UNTIL`. The loop continues until the
    condition in the `WHILE` clause is false. See Listing 5-7 and Figure 5-6.


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig6_HTML.jpg](images/501068_1_En_5_Chapter/501068_1_En_5_Fig6_HTML.jpg)


    Figure 5-6 – The DO WHILE Output Example


    ```

    data e;

    SUM=0;

    i=1;

    DO WHILE(i LT 10);

    SUM=SUM + i;

    output;

    i=i+2;

    END;

    run;

    Listing 5-7 – DO WHILE Example

    ```


    One last way to do the `DO` loops is by looping over a set of items if there is
    no specific pattern for the iteration counter. We still can get the same result,
    as in the previous examples, but by using a set of numbers instead of using a
    counter and increment statement. See Listing 5-8 and Figure 5-7.


    ![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig7_HTML.jpg](images/501068_1_En_5_Chapter/501068_1_En_5_Fig7_HTML.jpg)


    Figure 5-7 – The DO Loop Over Set of Items Output


    ```

    data f;

    SUM=0;

    DO i=1,3,5,7,9;

    SUM=SUM + i;

    output;

    END;

    run;

    Listing 5-8 – DO Loop Over Set of Items Example

    ```


    ## Summary


    This chapter starts with how to make a comment in SAS programs and how to use
    the arithmetic and comparison operators. We touched on `PROC SQL` and discussed
    the `SELECT` statement in detail. The `SELECT` statement has various combinations
    with `WHERE` and `WHEN` statements. Further, we discussed the loops in SAS in
    detail. There are `DO` loops, and `DO UNTIL` and `DO WHILE` loops. In the next
    chapter, we shall learn how to prepare for analysis and learn the essential conditional
    statement.


    # 6. Preparing Data for Analysis


    In this chapter, we continue digging into SAS programming, still focusing on the
    code rather than the GUI. As we mentioned earlier, in any programming language,
    you learn the data types, operators, `IF` condition, and loops. We covered all
    these topics in Chapters 2 and 5, except the `IF` condition statements. In this
    chapter, we learn about them and also more advanced data preparation and processing
    techniques.


    ## Label


    In Chapter 2, we mentioned that the SAS program consists of two parts: the data
    step and the proc step. In the previous chapters, we tried many procedures; for
    example, `PROC SGPLOT` and `PROC MEANS`. The `LABEL` statement lies in the data
    step, and the `LABEL` option lies in `PROC PRINT`.


    The first step to analyze the dataset is to understand the variables that you
    have. Identify which are the dependent variables and which are the independent
    variables, which are numeric/continuous, and which are character. Usually, your
    client will provide you with this information in a text file along with the file
    that contains the data. The text file is called the dictionary because it contains
    the explanations of the variable names and their types. Let us recall from Chapter
    1, Figure 1-2, the files that the Secretary of State of Maine office sent me.


    The data is in the Excel sheet, and the dictionary is highlighted in the red box
    in the middle. The variable names of `YOB`, `ENROLL`, and `DT Accept` are ambiguous
    without the dictionary. From the dictionary, we understand what each of these
    variables means; for example, `YOB` is Year Of Birth.


    To append these explanatory names to the dataset in SAS, we use the `LABEL` statement.
    The dataset is in the “Dataset” folder and has the name `Voter_A.CSV`. From SAS
    Studio, upload it and click Refresh, then import it, as we explained in Chapter
    2. Change the name of the dataset from `IMPORT` to `Voters`.


    This dataset is not a real dataset. I created it using the same variables that
    were sent to me by the Secretary of Maine. However, this file does not contain
    real information.


    After importing the file, we find that it has one hundred rows and nine columns,
    as in Figure 6-1.


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig1_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig1_HTML.jpg)


    Figure 6-1 – Import Voters_A.CSV


    Now, let us write a `LABEL` statement in the data step and use the `LABEL` option
    of `PROC PRINT`, as in Listing 6-1.


    ```

    data voters_label;

    set work.voters;

    label

    FIRST_NAME=''Name''

    YOB=''Year Of Birth''

    ENROLL=''Enrollment Code''

    DESIGNATE=''Special Designations''

    DT_ACCEPT=''Date Accepted (Date of Registration)''

    CG=''Congressional District''

    CTY=''County ID''

    DT_CHG=''Date Changed''

    DT_LAST_VPH=''Date Of Last Statewide Election with VPH'';

    run;

    proc print label;

    run;

    Listing 6-1 – Label Statement and Label Option

    ```


    When you run Listing 6-1, the output is as in Figure 6-2.


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig2_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig2_HTML.jpg)


    Figure 6-2 – Output with labels, not variable names


    Figure 6-2 shows that the report is printed with descriptive labels and not the
    variable names. Hence, it is more readable. However, the data is clearly unclean.
    “Special Designations” is a blank column, and there are missing values in other
    columns. Probably, the data needs verification that it is valid and does not contain
    any wrong information. In the rest of this chapter’s sections, you will learn
    how to clean such messy data.'
