    Figure 3-48 – The map using Esri maps


    SAS Studio will generate the code in Listing 3-6 for this Esri map option.'
  raw: '### Bubble Map


    The Bubble Map task creates a map that is overlaid with a bubble plot. For this
    example, we shall use crime data for New York City to create a bubble map showing
    the crime rate in the different NYC boroughs in 2018\. The data is available through
    the NYC Open Data Project website.


    You will find the data file in the “Datasets” folder; the file is named NYPD_Complaint_Data_Current__Year_To_Date.csv.
    Or, you can download the dataset from this URL: [`https://data.cityofnewyork.us/Public-Safety/NYPD-Complaint-Data-Current-Year-To-Date-/5uac-w243/data`](https://data.cityofnewyork.us/Public-Safety/NYPD-Complaint-Data-Current-Year-To-Date-/5uac-w243/data)


    To download the dataset from the link, as in Figure [3-42](#501068_1_En_3_Chapter.xhtml#Fig42),
    click on Export, then on CSV.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig42_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig42_HTML.jpg)


    Figure 3-42


    NYPD Compliant Data—NYC OpenData


    The dataset contains a massive amount of information. Much investigation and analysis
    can be done with this data. For example, what is the most prevalent crime type
    in every borough? When is the most probable time for crime to happen? On which
    day of the week do most crimes occur?


    For this example, we are interested solely in answering the question of which
    borough has the highest crime rate and which has the least.


    To answer this question, we need the following three columns: Borough, Longitude,
    and Latitude. Hence, we drop all the other columns. Then, we count the number
    of crimes in every borough to represent it with a bubble on a map.


    After cleaning the data and preparing it, we have the dataset shown in Table [3-3](#501068_1_En_3_Chapter.xhtml#Tab3).


    Table 3-3


    Number of Crimes Per Borough


    | Borough | Count of Crimes | Latitude | Longitude |

    | --- | --- | --- | --- |

    | BRONX | 50153 | 40.82452 | -73.8978 |

    | BROOKLYN | 67489 | 40.82166 | -73.9189 |

    | MANHATTAN | 56691 | 40.71332 | -73.9829 |

    | QUEENS | 44137 | 40.74701 | -73.7936 |

    | STATEN ISLAND | 10285 | 40.63204 | -74.1222 |


    To load the data, we write Listing [3-4](#501068_1_En_3_Chapter.xhtml#PC6) in
    SAS Studio. You can load Listing [3-4](#501068_1_En_3_Chapter.xhtml#PC6). sas
    from the “Example Code” folder. Click Run.


    ```

    data NYC_crime;

    input Borough $13.;

    datalines;

    BRONX

    BROOKLYN

    MANHATTAN

    QUEENS

    STATEN ISLAND

    ;

    run;

    data NYC_crime_dim;

    set nyc_crime;

    input count Latitude Longitude;

    datalines;

    50153 40.82451851 -73.897849

    67489 40.82166423 -73.91885603

    56691 40.71332365 -73.98288902

    44137 40.74701026 -73.79358825

    10285 40.63203653 -74.1222402

    ;

    run;

    Listing 3-4

    Creating a Dataset for Number of Crimes Per Borough

    ```


    In this program, we did not import the raw data file. We inserted the values of
    the table into the code using the `DATALINES` keyword in the data step. In Listing
    [3-4](#501068_1_En_3_Chapter.xhtml#PC6), we have two data steps. The first one
    is called `NYC_crime`. The second line uses the `INPUT` statement to specify the
    columns’ names and types. In this table, we define only one column as the borough
    names, and its type is character because we used the $. The maximum number of
    characters is 13\. Then, we use a `DATALINES` statement to insert the actual values,
    and end it with a semicolon.


    The second data step creates another table called NYC_crime_dim to insert the
    boroughs’ dimensions and the number of crimes in each one. This table is initialized
    by the previous table, nyc_crime, by using the `SET` statement. Again, we use
    the `INPUT` statement to specify that we shall add three more columns to the borough.
    We add the count, latitude, and longitude. Remember to leave a space in between
    the column names, and do not use commas. Again, use `DATALINES` to insert the
    actual values, and end it with a semicolon.


    After running Listing [3-4](#501068_1_En_3_Chapter.xhtml#PC6), two new tables
    called NYC_crime and NYC_crime_dim will be created in the Work library. To check
    the output table, click Libraries ➤ Work; under it, you will find NYC_crime and
    NYC_crime_dim. If not, refresh your libraries as we explained in Chapter [2](#501068_1_En_2_Chapter.xhtml).


    Now, click on Tasks and Utilities ➤ Tasks ➤ Map ➤ Bubble Map, as in Figure [3-43](#501068_1_En_3_Chapter.xhtml#Fig43).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig43_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig43_HTML.jpg)


    Figure 3-43


    Create a bubble map


    As in Figure [3-44](#501068_1_En_3_Chapter.xhtml#Fig44), select the dataset WORK.NYC_CRIME_DIM
    in the Data field. In Roles, select the Latitude and Longitude. In Bubble size,
    select count, which is the number of crimes. Finally, in Group, select the Borough
    column.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig44_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig44_HTML.jpg)


    Figure 3-44


    Number of crimes per borough


    For Base Map select OpenStreetMap. Later in the chapter, we shall try the Esri
    maps to see the difference in the output. Leave the rest of defaults and click
    Run. The bubble map seen in Figure [3-45](#501068_1_En_3_Chapter.xhtml#Fig45)
    will be displayed.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig45_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig45_HTML.jpg)


    Figure 3-45


    Number of crimes per borough


    It is clear from the bubble size that Brooklyn has the highest crime rate, while
    Staten Island has the lowest one. SAS Studio automatically adjusts the bubble
    location, size, and color. Moreover, it adds a legend at the bottom of the map
    for the borough color codes.


    Now, let us enhance the appearance of the bubble map. We can add a label to the
    bubble with the count of crimes, and add a title to the map. As in Figure [3-46](#501068_1_En_3_Chapter.xhtml#Fig46),
    in the Appearance tab, in Data Labels, for Bubble label, select the count column
    from the dataset. Then, in Label options, for Font weight, select Bold. In the
    Label position, select Center. Finally, in Title And Footnote, for Title, type
    “Number of crimes in NYC Boroughs.”


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig46_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig46_HTML.jpg)


    Figure 3-46


    Enhance the appearance


    Click Run to check the new changes. The output would be as in Figure [3-47](#501068_1_En_3_Chapter.xhtml#Fig47).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig47_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig47_HTML.jpg)


    Figure 3-47


    Number of crimes in NYC boroughs


    Listing [3-5](#501068_1_En_3_Chapter.xhtml#PC7) shows the code that SAS Studio
