- fmt: '## Format


    In the previous section, we saw how the `LABEL` statement changed the output to
    a more readable format. On the other hand, the `FORMAT` statement changes the
    input, not the output. We mentioned in Chapter [2](#501068_1_En_2_Chapter.xhtml),
    in the “Variable Types” section, that, by default, the length of the character
    data type is eight characters. Hence, if we use the `INPUT` statement instead
    of importing the Excel file, the `FORMAT` statement overrides the default variables’
    formats. Moreover, the `FORMAT` statement can assign the same format to several
    variables at one time.


    The dataset is in the “Dataset” folder and has the name Voters_A.CSV. From SAS
    Studio, upload it and click Refresh. Do not import it, because we shall use the
    `INPUT` statement, as we explained the last section of Chapter [2](#501068_1_En_2_Chapter.xhtml).


    Run Listing [6-2](#501068_1_En_6_Chapter.xhtml#PC2) and check the output. In Listing
    [6-2](#501068_1_En_6_Chapter.xhtml#PC2), we still did not use the `FORMAT` statement.


    ```

    data voters_format;

    infile "/folders/myfolders/SAS4Days/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    run;

    proc print ;

    run;

    Listing 6-2

    Read CSV File with the INPUT Statement

    ```


    In Listing [6-2](#501068_1_En_6_Chapter.xhtml#PC2), the first line, `DATA VOTERS_FORMAT`
    creates a new dataset in the Work library with the name `VOTERS_FORMAT`. In the
    second line, the `INFILE` statement reads the CSV file from the assigned path,
    sets the delimiter to comma, and tells SAS Studio that the first observation is
    at the second row in the CSV file, because the file has a header. The third line
    uses the `INPUT` statement to set the variables’ names and their types. To distinguish
    between the character and numeric variables, you put a dollar sign (`$`) after
    the character variables, so SAS Studio can read them correctly. The last line
    in the data step is the `RUN` statement to end it. Finally, `PROC PRINT` prints
    the dataset in a printable report.


    Run the program and check the “Name” column. SAS Studio truncates the names and
    reads only the first eight characters. For example, the first name in VOTERS_A.CSV
    is “Eula Vitolo,” while SAS Studio truncates it to “Eula Vit,” as in Figure [6-3](#501068_1_En_6_Chapter.xhtml#Fig3).
    As we said in Chapter [2](#501068_1_En_2_Chapter.xhtml), SAS Studio, by default,
    assigns eight characters only to the character field.


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig3_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Name values are truncated to eight characters only


    To override this rule and resolve this problem, we use the `FORMAT` statement
    to read all the characters, as in Listing [6-3](#501068_1_En_6_Chapter.xhtml#PC3).


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/SAS4Days/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    run;

    proc print ;

    run;

    Listing 6-3

    FORMAT Statement

    ```


    After running Listing [6-3](#501068_1_En_6_Chapter.xhtml#PC3), the names are displayed
    entirely, as in Figure [6-4](#501068_1_En_6_Chapter.xhtml#Fig4). The `FORMAT`
    statement specifies the type of the `NAME` variable as character by using the
    `$` sign, and the number of characters is 21\. Remember to put the dot at the
    end (`$21.`), so SAS Studio can read the values correctly.


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig4_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    The names are complete now


    ## Create New Variables


    In SAS, you do not need to define a new variable beforehand or set its data type
    as you do in some other languages. You just put the name of the new variable and
    its value. That is it. SAS will be able to identify the data type of the new variable
    by itself.


    In this example, let us continue using the dataset of the previous sections, Voters_A.CSV.
    In the dataset, there is a variable called `YOB`, which is the Year Of Birth.
    The new variable that we will create is the age of the voters.


    As in Listing [6-4](#501068_1_En_6_Chapter.xhtml#PC4), the age equals the difference
    between the current year and the birth date. The age is defined as `age=2020-YOB`.
    We define it in the data step.


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/SAS4Days/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    *creating age as a new variable;

    age=2020-YOB;

    run;

    proc print ;

    run;

    Listing 6-4

    Creating New Variables

    ```


    After running Listing [6-4](#501068_1_En_6_Chapter.xhtml#PC4), the output has
    a new variable appended to it, as in Figure [6-5](#501068_1_En_6_Chapter.xhtml#Fig5).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig5_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    Output of Listing [6-4](#501068_1_En_6_Chapter.xhtml#PC4)


    Scroll down a little and check the age. There is one voter listed as being 340
    years old, seen in Figure [6-6](#501068_1_En_6_Chapter.xhtml#Fig6). Probably,
    this value is wrong. We see later in this chapter how to resolve this issue by
    using the `IF` statement.


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig6_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Check the age values for wrong ones


    ## Rearrange the Dataset Variables


    Before cleaning the data, you might like to reorder the variables in the dataset;
    for example, rearrange the variables to have the age variable directly beside
    `YOB`. We use `RETAIN` and `SET` statements to achieve that.


    However, it has to be done in a new data step, as in Listing [6-5](#501068_1_En_6_Chapter.xhtml#PC5).
    Later in this chapter, we shall learn more about the `SET` statement.


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/SAS4Days/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    *creating age as a new variable;

    age=2020-YOB;

    run;

    data voters_retain;

    retain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG  DT_LAST_VPH;

    set voters_format;

    run;

    proc print data=voters_retain;

    run;

    Listing 6-5

    Retain Statement

    ```


    After running Listing [6-5](#501068_1_En_6_Chapter.xhtml#PC5), age now is after
    `YOB`, as in Figure [6-7](#501068_1_En_6_Chapter.xhtml#Fig7). If you got an error,
    please check the file path in the `INFILE` statement. Change it to where the file
    is located on your machine.


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig7_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Voters dataset after reordering its variables to have age after YOB


    There are other ways to reorder the variables in the dataset. You can check them
    at this link:


    [`http://support.sas.com/kb/8/395.html`](http://support.sas.com/kb/8/395.html)


    ## IF Statement


    Now, this is the crucial section for data cleaning—the `IF` statement. There are
    three forms in which to use the `IF` statement:


    1.  `IF` (Condition) without `THEN` statement


    2.  `IF-THEN` statement


    3.  `IF-THEN-ELSE` statement'
