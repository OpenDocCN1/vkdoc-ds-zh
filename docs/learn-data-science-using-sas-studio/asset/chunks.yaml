    proc print data=SASHELP.CARS;

    run;

    ```


    **Listing 2-1** Proc Print


    Click the `Run` button, as shown in Figure [2-6](#501068_1_En_2_Chapter.xhtml#Fig6).
    Don’t forget the semicolon and `run;` to end the procedure section.


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig6_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig6_HTML.jpg)


