    the chart. Click on `Objects ➤ Graphs ➤ Butterfly Chart`, as in Figure [8-23](#501068_1_En_8_Chapter.xhtml#Fig23).
    Drag it onto your report under the previous charts or beside any of them.


    ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig23_HTML.jpg](images/501068_1_En_8_Chapter/501068_1_En_8_Fig23_HTML.jpg)


