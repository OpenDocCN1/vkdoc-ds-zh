    # 散点图


    散点图通过描述变量之间的方向、强度和线性关系，来展示变量间的相互依赖程度。此外，它们还能轻松显示异常值。


    在本例中，我们提出的问题是：西雅图市的薪资是否与员工的年龄段有关，还是毫无关联？


    你可以在本书源码的`Datasets`文件夹中找到名为`City_of_Seattle_Wages__Comparison_by_Gender_-_Average_Hourly_Wage_by_Age.csv`的数据文件。或者，你也可以通过以下网址从`Data.Gov`项目下载该
    CSV 文件：[`https://catalog.data.gov/dataset/city-of-seattle-wages-comparison-by-gender-average-hourly-wage-by-age-353b2`](https://catalog.data.gov/dataset/city-of-seattle-wages-comparison-by-gender-average-hourly-wage-by-age-353b2)。


    将 CSV 文件复制到`myfolders`文件夹中。在 SAS Studio 中，点击`Refresh`，然后按照我们在第 2 章中介绍的方法导入该文件。将数据集名称从`IMPORT`改为`Seattle_wages`，如图
    3-1 所示。然后点击`Run`。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig1_HTML.jpg](img/501068_1_En_3_Fig1_HTML.jpg)


    图 3-1


    更改数据集名称


    若要探索数据，请点击`Results`选项卡，如图 3-2 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig2_HTML.jpg](img/501068_1_En_3_Fig2_HTML.jpg)


    图 3-2


    散点图的两个变量


    我们想要创建`AGE_RANGE`和`Total_Average_of_HOURLY_RATE`变量的散点图，以查看它们之间是否存在相互依赖关系。图 3-2
    显示了这两个变量。


    点击`Tasks and Utilities` ➤ `Graph` ➤ `Scatter Plot`。在`Data`中，选择`WORK.SEATTLE_WAGES`数据集。为此，如图
    3-3 所示，点击数据集名称旁边的小表格。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig3_HTML.jpg](img/501068_1_En_3_Fig3_HTML.jpg)


    图 3-3


    点击此表格以更改数据集


    会弹出一个新窗口，如图 3-4 所示。选择数据集并点击`OK`。


