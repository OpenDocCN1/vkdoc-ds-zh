    X      INELIGIBLE

    ```


    ### IF-THEN Statement


    As mentioned earlier, the “Age” column has a definite wrong value for one of the
    voters, where they are 340 years old. To correct this, if the dataset data was
    a real one, we would have had several options:


    1.  Get the correct age by contacting the Secretary of Maine office or contacting
    the voter.


    2.  Remove the value and put a dot instead of it to indicate that it is a missing
    data, as mentioned in Chapter [5](#501068_1_En_5_Chapter.xhtml). The SAS convention
    for missing data is to put a dot for the missing numeric value and a blank for
    the missing character value.


    3.  Another solution is to delete the whole row.


    4.  Leave the value as it is. However, this value will be an outlier and will
    affect the analysis when trying to find the relationship between the age, party,
    and the expected voting.


    In this example, consider it as a missing value. To do so, we use the `IF-THEN`
    statement , as in Listing [6-7](#501068_1_En_6_Chapter.xhtml#PC8).


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/sasuser.v94/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    *creating age as a new variable;

    age=2020-YOB;

    run;

    data voters_retain;

    retain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG  DT_LAST_VPH;

    set voters_format;

    *T clean this outlier, we mark it as a missing data;

    if age= 340 then age=.;

    run;

    proc print data=voters_retain;

    run;

    Listing 6-7

    IF-THEN Statement Example

    ```


    After running Listing [6-7](#501068_1_En_6_Chapter.xhtml#PC8), the value will
    be missing, as in Figure [6-13](#501068_1_En_6_Chapter.xhtml#Fig13).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig13_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig13_HTML.jpg)


    Figure 6-13


    Make the wrong value a missing value


    The other solution is to delete the whole row, as in Listing [6-8](#501068_1_En_6_Chapter.xhtml#PC9),
    using the `DELETE` statement.


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/sasuser.v94/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    *creating age as a new variable;

    age=2020-YOB;

    run;

    data voters_retain;

    retain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG  DT_LAST_VPH;

    set voters_format;

    *Delete the whole row;

    if age= 340 then Delete;

    run;

    proc print data=voters_retain;

    run;

    Listing 6-8

    Delete the Whole Row of the Wrong Age Value

    ```


    After running Listing [6-8](#501068_1_En_6_Chapter.xhtml#PC9), the whole row is
    deleted, as in Figure [6-14](#501068_1_En_6_Chapter.xhtml#Fig14).


    ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig14_HTML.jpg](images/501068_1_En_6_Chapter/501068_1_En_6_Fig14_HTML.jpg)


    Figure 6-14


    The row was deleted


    For further verification, compare the number of rows in the new dataset, WORK.VOTERS_RETAIN,
    with those in the original dataset, WORK.VOTERS_FORMAT. In Figure [6-15](#501068_1_En_6_Chapter.xhtml#Fig15),
    the number of rows is 99, while in the original dataset, the number of rows is
