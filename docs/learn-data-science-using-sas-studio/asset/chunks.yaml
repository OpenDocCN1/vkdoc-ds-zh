- fmt: '### IF-THEN-ELSE Statement


    Now, let us do an analysis by counting how many voters in the following age groups:
    18–24, 25–29, 30–39, 40–49, 50–64, and 65+, as in Listing [6-9](#501068_1_En_6_Chapter.xhtml#PC10).


    ```

    data voters_format;

    Format Name $21\. ;

    infile "/folders/myfolders/SAS4Days/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    *creating age as a new variable;

    age=2020-YOB;

    run;

    data voters_retain;

    retain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG  DT_LAST_VPH;

    set voters_format;

    if age= 340 then Delete;

    if (age>=18 and age=25 and age=30 and age=40 and age=50 and age=65) then age_group=''65+'';

    run;

    proc print data=voters_retain ;

    run;

    Listing 6-9

    IF-THEN-ELSE Statement Example

    ```


    After running Listing [6-9](#501068_1_En_6_Chapter.xhtml#PC10), the output is
    as in Figure [6-17](#501068_1_En_6_Chapter.xhtml#Fig17).


