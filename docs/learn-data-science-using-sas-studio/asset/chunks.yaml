    You just wrote, successfully executed, and printed the report for your first SAS
    program. Hurray! Congratulations!


    Now, click on `Libraries` in the left pane. Then, click on `SASHELP`, then `CARS`.
    To get the code that SAS Studio auto-generated to display the table, click on
    the icon highlighted in Figure [2-8](#501068_1_En_2_Chapter.xhtml#Fig8).


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig8_HTML.jpg](images/501068_1_En_2_Chapter/501068_1_En_2_Fig8_HTML.jpg)


