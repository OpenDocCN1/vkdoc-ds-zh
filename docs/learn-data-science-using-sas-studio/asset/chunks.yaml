- fmt: '### Winning Candidates in 2012


    I started to explore the data by generating a histogram of candidates and their
    winning percentages in 2012 in Maine. I found that Barack Obama won by a big margin
    over Mitt Romney, while the other candidates had almost zero votes, as in Figure
    [1-9](#501068_1_En_1_Chapter.xhtml#Fig9). In Chapter [3](#501068_1_En_3_Chapter.xhtml),
    the section “Create a Histogram Using a Bar Chart” shows how to generate Figure
    [1-9](#501068_1_En_1_Chapter.xhtml#Fig9) step-by-step.


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig9_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig9_HTML.jpg)


    *Figure 1-9 Histogram of candidates and their winning percentages in 2012*


    Next, I tried to visualize the data on the map, per county. Figure [1-10](#501068_1_En_1_Chapter.xhtml#Fig10)
    shows the Democratic counties with the darkest shade and the Republican Party
    as a lighter shade for the years 2000–2016. However, remember that in Maine the
    area does not correspond to the population. Chapter [8](#501068_1_En_8_Chapter.xhtml)
    lists the steps and the codes needed to generate the maps in Figure [1-10](#501068_1_En_1_Chapter.xhtml#Fig10).


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig10_HTML.jpg](images/501068_1_En_1_Chapter/501068_1_En_1_Fig10_HTML.jpg)


    *Figure 1-10 Map of how Maine’s counties voted in the presidential elections in
    years 2000–2016*


    ### Categories/Issues


    All presidential election debates focus on the issues and how every candidate
    is going to deal with them. Based upon these strategies, voters might change their
    minds and vote based on a specific issue. Therefore, it is crucial to investigate
    the issues.


    #### Issues Facing the Country


    In 2016, according to CNN, Maine voters thought that the most crucial issues facing
    the country were foreign policy, immigration, economy, and terrorism. However,
    these issues are not the issues that face Maine itself. (¹) From the map, Maine
    is not affected by foreign policy. From the race statistics, it is clear that
    Maine has almost no immigrants. I searched briefly for any terroristic attacks
    in Maine and found nothing. The only lasting common issue all over the world was
    the economy. Hence, I started searching for Maine’s issues in the ballots.


    #### Categories: Issues Facing Maine


    On the Ballotpedia website, the ballots are listed as in Table [1-1](#501068_1_En_1_Chapter.xhtml#Tab1).


    *Table 1-1 The Issues Facing Maine Residents* (²)


    | 2000 | 2004 | 2008 | 2012 | 2016 |

    | --- | --- | --- | --- | --- |

    | Assisted Death Business Lottery Taxes Suffrage LGBT Fishing | Education Taxes
    Hung & Fish | Bonds Taxes Gambling Water Transportation | Marriage Education Water
    Transportation Bond Issues | Marijuana Education Firearms Economics Elections
    Bonds |


    I found that there are specific issues that are not resolved over the years; for
    example, fishing, bonds, water, education, and taxes. I deduced that Maine has
    water and tax problems. Again, I recommended that the speeches of the presidential
    campaigns should include a proposed solution or a plan for these specific issues.
    The speech that tackles these issues might win over Maine’s voters.


    From the information I collected and by surveying the local newspapers, I predict
    the major five issues in Maine in 2020 to be as follows:


    1.  Education

    2.  Economics

    3.  Bonds

    4.  Health care

    5.  Taxes


    ### Factors Affecting Maine’s Economy


    As we talk about the economy, looking for income sources is crucial. According
    to the *Portland Press Herald* and Maine’s revenue datasets provided on Maine.gov
    website, (³) the income sources are as follows:


    1.  Agriculture

    2.  Forestry

    3.  Fishing

    4.  Hunting

    5.  Taxes

    6.  Management of companies and enterprises

    7.  The finance and insurance sector


    #### Comparing the Unemployment Rate of Maine to That of the Rest of the States


    Donald Trump promised to offer more jobs and to return manufacturing firms to
    the United States instead of outsourcing them. Many news outlets claimed that
    his jobs promise is what made the Rust Belt states inclined to vote for him instead
    of Hillary Clinton. So, I searched for the unemployment rate in Maine and compared
    it to the rest of the country to check if Trump’s promise would work with Maine
    voters or not. I found that Maine did not have an unemployment issue in 2016.
    Hence, I predicted that Trump’s promise would not be as appealing to Maine’s voters
    as it would be in some other states.


    #### Median Income for Maine


    To be more specific and for research purposes, I looked up the median income for
    Maine; then, I compared it to the median income of the United States. According
    to Table [1-2](#501068_1_En_1_Chapter.xhtml#Tab2), from 2005 until 2015, Maine’s
    median income was slightly less than that of the United States. However, there
    was an increase in the three years before the elections.


    *Table 1-2 Historical Real Median Household Income for Maine* (⁴)


    | Date | US | Maine |

    | --- | --- | --- |

    | 2018 | $61,937 | $55,602 |

    | 2017 | $61,807 | $57,649 |

    | 2016 | $60,291 | $55,542 |

    | 2015 | $59,116 | $54,578 |

    | 2014 | $56,969 | $52,515 |

    | 2013 | $56,415 | $50,718 |

    | 2012 | $56,288 | $51,180 |

    | 2011 | $56,507 | $51,507 |

    | 2010 | $57,762 | $52,878 |

    | 2009 | $58,921 | $53,657 |

    | 2008 | $60,829 | $54,459 |

    | 2007 | $61,601 | $55,710 |

    | 2006 | $60,490 | $54,233 |

    | 2005 | $59,604 | $55,168 |


    #### How Did Exit Polls Show the Income Factor in the 2016 Election in Maine?


    Looking from another perspective, according to CNN, the exit polls showed that
    Maine would mostly vote for Clinton except voters whose salaries ranged from $30,000
    to $50,000. (⁵) These voters would vote for Trump. However, they represented only
    19 percent of the sample. Hence, the majority in Maine would vote for Clinton.


    #### Reviewing Past Elections to See if There Are Any Predictable Outcomes (Patterns)


    Finally, the last step of the project was to collect the historical data for the
    past elections and use this data for the next step of modeling and prediction.
    As I mentioned earlier, I neglected any other party and focused solely on Democrats
    and Republicans because the rest got almost zero percentages in the 2012 elections.


    *Table 1-3 The Historical Results of Past Presidential Elections in Maine* (⁶)


    | Year | D | D% | R | R% |

    | --- | --- | --- | --- | --- |

    | 2016 | **357,735** | **47.80%** | 335,593 | 44.90% |

    | 2012 | **401,306** | **56.27%** | 292,276 | 40.98% |

    | 2008 | **421,923** | **57.71%** | 295,273 | 40.38% |

    | 2004 | **396,842** | **53.57%** | 330,201 | 44.58% |

    | 2000 | **319,951** | **49.10%** | 286,616 | 44.00% |

    | 1996 | **312,788** | **51.60%** | 186,378 | 30.80% |

    | 1992 | **263,420** | **38.80%** | 206,820 | 30.40% |

    | 1988 | 243,569 | 43.90% | **307,131** | **55.30%** |

    | 1984 | 214,515 | 38.80% | **336,500** | **60.80%** |

    | 1980 | 220,974 | 42.30% | **238,522** | **45.60%** |

    | 1976 | 232,279 | 48.07% | **236,320** | **48.91%** |

    | 1972 | 160,584 | 38.50% | **256,458** | **61.50%** |

    | 1968 | **217,312** | **55.30%** | 169,254 | 43.10% |

    | 1964 | **62,264** | **68.84%** | 118,701 | 31.16% |

    | 1960 | **181,159** | **42.95%** | 240,608 | 57.05% |


    Seeing the data collected in Table [1-3](#501068_1_En_1_Chapter.xhtml#Tab3), I
    was surprised to find out that historically Maine was a Republican state, and
    then it became a strong Democratic state. Hence, I decided to describe Maine as
    a “Lean Democrat” state because Democrats won seven out of fifteen times from
    1960 to 2016. I am predicting that it will mostly vote Democrat in 2020 with a
    small margin. Since 1992, Democrats have won straight in Maine. However, if the
    Democratic Party does not pay more attention to Maine, it might switch to be a
    Republican one. According to *Bangor Daily News*, Clinton did not visit Maine
    after September 2015 and sent surrogates instead. For the first time in years,
    the Democratic Party lost one electoral vote to the Republican Party. (Bangor
    is a city in Maine.)'
