    Close by Year,” as in Figure [3-22](#501068_1_En_3_Chapter.xhtml#Fig22). Observe
    the code changes in the Code tab and re-run the program.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig22_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig22_HTML.jpg)


    Figure 3-22


    The series plot code


    ## Bar Chart


    You use a bar chart to compare groups or to track a variable over time.


    In the following program, you will compare the average salaries of baseball teams.
    We also want to answer the questions of which team has the highest average salary
    and which one has the lowest.


    Let us make a program to make a horizontal bar chart (HBar) for the average salaries
    of baseball teams.


    Select Tasks ➤ Graph ➤ Bar Chart.


    As in Figure [3-23](#501068_1_En_3_Chapter.xhtml#Fig23), use the Baseball dataset
    from the library (SASHELP.BASEBALL). For Chart Orientation, select Horizontal.
    In Roles, select “Team” for Category, “Salary” for Variable, and “Mean” for Statistic.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig23_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig23_HTML.jpg)


    Figure 3-23


    Create a bar chart


    In the Appearance tab, add a report title, “Average Salaries by Team,” as in Figure
    [3-24](#501068_1_En_3_Chapter.xhtml#Fig24). Then, click Run.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig24_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig24_HTML.jpg)


    Figure 3-24


    Add the title


    ### How Do You Sort a Bar Chart?


    Figure [3-24](#501068_1_En_3_Chapter.xhtml#Fig24) shows the average salaries by
    team. However, it can be confusing to find the second and third highest teams
    from the graph. To avoid any confusion, it is best to sort the graph ascending
    or descending. We will do sorting the bar chart over four steps.


    **Step 1:** Create a new dataset that has only the team names and mean salaries.
    Click on Tasks and Utilities ➤ Tasks ➤ Statistics ➤ Summary Statistics. Select
    SASHELP.BASEBALL for Data, Salary for Analysis Variables, and Team for Classification
    Variables, as in Figure [3-25](#501068_1_En_3_Chapter.xhtml#Fig25).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig25_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig25_HTML.jpg)


    Figure 3-25


    Click on Summary Statistics


    **Step 2:** In the Options tab, check “Mean” only and deselect the rest of the
    default selections, as in Figure [3-26](#501068_1_En_3_Chapter.xhtml#Fig26).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig26_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig26_HTML.jpg)


    Figure 3-26


    Check “Mean” in the Options tab


    **Step 3:** In the Output tab, check “Create output data set” to save the mean
    of the data to a new dataset, as in Figure [3-27](#501068_1_En_3_Chapter.xhtml#Fig27).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig27_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig27_HTML.jpg)


    Figure 3-27


    Save the results in a new dataset


    **Step 4:** Make a bar chart sorted by the mean salary, not by the team. Select
    the output dataset that was generated from the previous step as the input data
    to a new bar chart. Select Salary_Mean for Category, Team for Subcategory, and
    Salary_Mean for the Measure Variable, as in Figure [3-28](#501068_1_En_3_Chapter.xhtml#Fig28).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig28_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig28_HTML.jpg)


    Figure 3-28


    Select your table as your data


    Run the chart to get a new sorted graph, as in Figure [3-29](#501068_1_En_3_Chapter.xhtml#Fig29).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig29_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig29_HTML.jpg)


    Figure 3-29


    Ascending sorted bar chart


    To reverse the output, check “Reverse tick values” in Category Axis in the Appearance
    tab, as in Figure [3-30](#501068_1_En_3_Chapter.xhtml#Fig30).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig30_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig30_HTML.jpg)


    Figure 3-30


    Check “Reverse Tick Values”


    Re-run the bar chart. The output is similar to Figure [3-31](#501068_1_En_3_Chapter.xhtml#Fig31).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig31_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig31_HTML.jpg)


    Figure 3-31


    Descending bar chart


    Finally, the team that has the highest average salary in 1987 is Boston, and the
    one that has the lowest average salary is San Francisco.'
  trans: '

    # 序列图


    序列图显示数值随时间的变化。在本例中，我们将绘制股票价格随时间变化的趋势。


    依次点击 `Tasks and Utilities` ➤ `Tasks` ➤ `Graph` ➤ `Series Plot`。在 `Data` 中选择 `SASHELP.STOCKS`，X
    轴选择 `Date`，Y 轴选择 `Close`，如图 3-17 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig17_HTML.jpg](img/501068_1_En_3_Fig17_HTML.jpg)


    图 3-17


    序列图代码


    运行该图。输出结果类似于图 3-18。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig18_HTML.jpg](img/501068_1_En_3_Fig18_HTML.jpg)


    图 3-18


    序列图输出


    让我们探究股票的频率并获取股票的唯一值。依次点击 `Tasks and Utilities` ➤ `Tasks` ➤ `Statistics` ➤ `One-Way
    Frequency`。在 `Analysis Variable` 中，点击 `+` 号并选择 `Stock`，如图 3-19 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig19_HTML.jpg](img/501068_1_En_3_Fig19_HTML.jpg)


    图 3-19


    使用单因子频率分析股票


    你会发现这些是三家公司的股票：IBM、Intel 和 Microsoft，如图 3-19 所示。


    再次回到序列图，让我们基于此信息来增强图形。由于我们只有三只股票，选择 `Group By Stock`，如图 3-20 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig20_HTML.jpg](img/501068_1_En_3_Fig20_HTML.jpg)


    图 3-20


    通过按股票分组来增强序列图


    Y 轴显示收盘价，X 轴显示年份。图 3-21 显示了 IBM、Intel 和 Microsoft 从 1986 年到 2006 年的收盘价。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig21_HTML.jpg](img/501068_1_En_3_Fig21_HTML.jpg)


    图 3-21


    二十年的收盘价


    从图 3-21 中，我们发现 Intel 多年来大部分时间的收盘价最低，而 IBM 的收盘价最高。有史以来的最高收盘价超过 200 美元，是 IBM 的股票。从
    2004 年到 2006 年，IBM 与其他公司之间的差异显著，IBM 的股票价格接近 100 美元，而 Intel 和 Microsoft 大约为 25
    美元。那时，这些信息和数据分析本可以帮助股票经纪人决定是卖出还是买入哪只股票。


    在 `Appearance` 选项卡中，选择 `Title and Footnote` 并将标题编辑为“按年份的股票收盘价”，如图 3-22 所示。观察 `Code`
    选项卡中的代码变化，然后重新运行程序。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig22_HTML.jpg](img/501068_1_En_3_Fig22_HTML.jpg)


    图 3-22


    序列图代码


    # 条形图


    您可以使用条形图来比较组别或跟踪变量随时间的变化。


    在下面的程序中，您将比较棒球队的平均薪资。我们还希望回答哪个球队的平均薪资最高，哪个最低的问题。


    让我们创建一个程序，为棒球队的平均薪资制作一个水平条形图 (`HBar`)。


    选择 `Tasks` ➤ `Graph` ➤ `Bar Chart`。


    如图 3-23 所示，使用库中的 `Baseball` 数据集 (`SASHELP.BASEBALL`)。对于 `Chart Orientation`，选择
    `Horizontal`。在 `Roles` 中，为 `Category` 选择 `Team`，为 `Variable` 选择 `Salary`，为 `Statistic`
    选择 `Mean`。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig23_HTML.jpg](img/501068_1_En_3_Fig23_HTML.jpg)


    图 3-23


    创建条形图


    在 `Appearance` 选项卡中，添加报告标题“各队平均薪资”，如图 3-24 所示。然后，点击 `Run`。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig24_HTML.jpg](img/501068_1_En_3_Fig24_HTML.jpg)


    图 3-24


    添加标题


    ## 如何对条形图排序？


    图 3-24 显示了各队的平均薪资。然而，从图中找出薪资第二和第三高的球队可能会令人困惑。为避免混淆，最好对图形进行升序或降序排序。我们将通过四个步骤对条形图进行排序。


    **步骤 1：** 创建一个仅包含球队名称和平均薪资的新数据集。依次点击 `Tasks and Utilities` ➤ `Tasks` ➤ `Statistics`
    ➤ `Summary Statistics`。为 `Data` 选择 `SASHELP.BASEBALL`，为 `Analysis Variables` 选择
    `Salary`，为 `Classification Variables` 选择 `Team`，如图 3-25 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig25_HTML.jpg](img/501068_1_En_3_Fig25_HTML.jpg)


    图 3-25


    点击 Summary Statistics


    **步骤 2：** 在 `Options` 选项卡中，仅勾选 `Mean`，并取消选择其他默认选项，如图 3-26 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig26_HTML.jpg](img/501068_1_En_3_Fig26_HTML.jpg)


    图 3-26


    在 Options 选项卡中勾选“Mean”


    **步骤 3：** 在 `Output` 选项卡中，勾选 `Create output data set` 将数据的平均值保存到新数据集，如图 3-27 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig27_HTML.jpg](img/501068_1_En_3_Fig27_HTML.jpg)


    图 3-27


    将结果保存到新数据集


    **步骤 4：** 创建一个按平均薪资排序的条形图，而不是按球队排序。选择上一步生成的数据集作为新条形图的输入数据。为 `Category` 选择 `Salary_Mean`，为
    `Subcategory` 选择 `Team`，为 `Measure Variable` 选择 `Salary_Mean`，如图 3-28 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig28_HTML.jpg](img/501068_1_En_3_Fig28_HTML.jpg)


    图 3-28


    选择您的表格作为数据


    运行图表以获得新的排序图形，如图 3-29 所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig29_HTML.jpg](img/501068_1_En_3_Fig29_HTML.jpg)


    图 3-29


    升序排序的条形图


    要反转输出，请在 `Appearance` 选项卡中的 `Category Axis` 中勾选 `Reverse tick values`，如图 3-30
    所示。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig30_HTML.jpg](img/501068_1_En_3_Fig30_HTML.jpg)


    图 3-30


    勾选“Reverse Tick Values”


    重新运行条形图。输出结果类似于图 3-31。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig31_HTML.jpg](img/501068_1_En_3_Fig31_HTML.jpg)


    图 3-31


    降序条形图


    最后，1987 年平均薪资最高的球队是波士顿队，平均薪资最低的是旧金山队。

