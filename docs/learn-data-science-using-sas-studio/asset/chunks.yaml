    ## IF 语句


    现在，这是数据清理的关键部分——`IF`语句。使用`IF`语句有三种形式：


    1.  `IF`（条件）不带`THEN`语句


    2.  `IF-THEN`语句


    3.  `IF-THEN-ELSE`语句

    '
- fmt: '### IF (Condition) Without THEN Statement


    `IF`语句在没有`THEN`语句的情况下用于对数据集进行子集选择。在此示例中，我们继续使用前几节的数据集`Voters_A.CSV`。我们希望创建两个新数据集作为原始数据的子集，其中第一个数据集仅包含登记为民主党的选民，另一个数据集包含登记为共和党的选民。我们使用`IF`语句并检查`ENROLL`变量值，如代码清单[6-6](#501068_1_En_6_Chapter.xhtml#PC6)所示。


    使用`SET`语句将旧数据集复制到新数据集。通常最好创建数据集的新副本，并在新数据集上执行所有分析，同时保留原始数据不变。这是一个良好的实践，尤其适用于使用政府、联合国或银行提供的数据集的情况。


    ```

    data voters_enroll;

    Format Name $21\. ;

    infile "/folders/myfolders/sasuser.v94/Voters_A.csv" dlm='','' firstobs=2;

    input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH
    $;

    run;

    data voters_democrat;

    set voters_enroll;

    if enroll="D";

    run;

    data voters_republican;

    set voters_enroll;

    if enroll="R";

    run;

    proc print data=voters_enroll (obs=3);

    run;

    proc print data=voters_democrat (obs=3);

    run;

    proc print data=voters_republican (obs=3);

    run;

    Listing 6-6

    IF (Condition) Statement Example

    ```


    运行代码清单[6-6](#501068_1_En_6_Chapter.xhtml#PC6)后，我们得到三个数据集。`Voters_Enroll`包含所有政党，`Voters_Democrats`仅包含民主党选民，`Voters_Republicans`仅包含共和党选民。我们需要三个数据步骤，每个数据集对应一个；同样，我们需要三个`PROC
    PRINT`。如果出现错误，请检查`INFILE`语句中的文件路径。将其更改为文件在您机器上的实际位置。


    为了不打印数据集中的所有行，我们在`PROC PRINT`中添加了`(OBS=3)`选项，以仅从每个数据集中打印三行。单击“Results”选项卡查看三个报告，如图[6-8](#501068_1_En_6_Chapter.xhtml#Fig8)所示。


