  trans: '好的，作为一名高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。



    ### 2012 年获胜候选人


    我开始通过生成直方图来探索数据，该直方图展示了 2012 年缅因州候选人及其获胜百分比。我发现巴拉克·奥巴马以大幅优势击败米特·罗姆尼，而其他候选人的得票率几乎为零，如图
    1-9 所示。在第 3 章 中，“使用条形图创建直方图”一节逐步展示了如何生成图 1-9。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig9_HTML.jpg](img/501068_1_En_1_Fig9_HTML.jpg)


    *图 1-9 2012 年候选人及其获胜百分比直方图*


    接下来，我尝试在地图上按县可视化这些数据。图 1-10 显示了 2000 年至 2016 年期间，民主党以最深色阴影标识，共和党以较浅色阴影标识。但请记住，在缅因州，面积并不等同于人口。第
    8 章 列出了生成图 1-10 中地图所需的步骤和代码。


    ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig10_HTML.jpg](img/501068_1_En_1_Fig10_HTML.jpg)


    *图 1-10 2000 年至 2016 年总统大选中缅因州各县投票情况地图*


    ### 类别/议题


    所有总统选举辩论都聚焦于各种议题以及每位候选人将如何应对这些议题。基于这些策略，选民可能会改变想法，并根据特定议题投票。因此，研究这些议题至关重要。


    #### 国家面临的议题


    根据 CNN 报道，2016 年，缅因州选民认为国家面临的最关键议题是外交政策、移民、经济和恐怖主义。然而，这些议题并非缅因州自身所面临的问题。(¹) 从地图上看，缅因州不受外交政策影响。从种族统计数据来看，很明显缅因州几乎没有移民。我简要搜索了缅因州是否有过任何恐怖袭击，结果一无所获。全世界唯一持久存在的共同议题是经济。因此，我开始在选票中寻找缅因州的议题。


    #### 类别：缅因州面临的议题


    在 Ballotpedia 网站上，选票情况如表 1-1 所示。


    *表 1-1 缅因州居民面临的议题* (²)


    | 2000 | 2004 | 2008 | 2012 | 2016 |

    | --- | --- | --- | --- | --- |

    | 辅助死亡商业彩票税收选举权 LGBT 渔业 | 教育税收狩猎与渔业 | 债券税收博彩水运输 | 婚姻教育水运输债券问题 | 大麻教育火器经济选举债券 |


    我发现有一些特定议题多年来一直未得到解决，例如渔业、债券、水利、教育和税收。我推断缅因州存在水利和税收问题。我再次建议，总统竞选的演讲内容应包含针对这些特定议题的解决方案或计划。处理这些议题的演讲可能会赢得缅因州选民的支持。


    根据我收集的信息以及对当地报纸的调查，我预测 2020 年缅因州的五大议题如下：


    1.  教育

    2.  经济

    3.  债券

    4.  医疗保健

    5.  税收


    ### 影响缅因州经济的因素


    当我们谈论经济时，寻找收入来源至关重要。根据《波特兰新闻先驱报》和 Maine.gov 网站上提供的缅因州收入数据集，(³) 其收入来源如下：


    1.  农业

    2.  林业

    3.  渔业

    4.  狩猎

    5.  税收

    6.  公司和企业管理

    7.  金融和保险业


    #### 缅因州失业率与其他各州的比较


    唐纳德·特朗普承诺提供更多就业机会，并将制造业企业迁回美国，而不是外包出去。许多新闻媒体声称，正是他的就业承诺使得“铁锈地带”各州倾向于投票给他，而不是希拉里·克林顿。因此，我搜索了缅因州的失业率，并将其与美国其他地区进行比较，以考察特朗普的承诺是否对缅因州选民有效。我发现缅因州在
    2016 年并不存在失业问题。因此，我预测特朗普的承诺对缅因州选民的吸引力不会像对其他一些州的选民那样大。


    #### 缅因州的中位收入


    为了更具体一些，并出于研究目的，我查阅了缅因州的中位收入；然后，将其与整个美国的中位收入进行了比较。根据表 1-2，从 2005 年到 2015 年，缅因州的中位收入略低于美国整体水平。然而，在大选前的三年里，这一数字有所增长。


    *表 1-2 缅因州历史实际家庭中位收入* (⁴)


    | 日期 | 美国 | 缅因州 |

    | --- | --- | --- |

    | 2018 | $61,937 | $55,602 |

    | 2017 | $61,807 | $57,649 |

    | 2016 | $60,291 | $55,542 |

    | 2015 | $59,116 | $54,578 |

    | 2014 | $56,969 | $52,515 |

    | 2013 | $56,415 | $50,718 |

    | 2012 | $56,288 | $51,180 |

    | 2011 | $56,507 | $51,507 |

    | 2010 | $57,762 | $52,878 |

    | 2009 | $58,921 | $53,657 |

    | 2008 | $60,829 | $54,459 |

    | 2007 | $61,601 | $55,710 |

    | 2006 | $60,490 | $54,233 |

    | 2005 | $59,604 | $55,168 |


    #### 出口民调如何显示收入因素在 2016 年缅因州选举中的影响？


    从另一个角度来看，根据 CNN 的报道，出口民调显示，除薪资在 30,000 美元到 50,000 美元之间的选民外，缅因州大多数选民会投票给克林顿。(⁵)
    这部分群体会投票给特朗普。然而，他们仅占样本的 19%。因此，缅因州的多数人会投票给克林顿。


    #### 回顾以往选举，看是否存在可预测的结果（模式）


    最后，项目的最后一步是收集以往选举的历史数据，并将其用于下一步的建模和预测。正如我之前提到的，我忽略了任何其他政党，只关注民主党和共和党，因为其他政党在 2012
    年选举中的得票率几乎为零。


    *表 1-3 缅因州以往总统选举的历史结果* (⁶)


    | 年份 | 民主党 | 民主党% | 共和党 | 共和党% |

    | --- | --- | --- | --- | --- |

    | 2016 | **357,735** | **47.80%** | 335,593 | 44.90% |

    | 2012 | **401,306** | **56.27%** | 292,276 | 40.98% |

    | 2008 | **421,923** | **57.71%** | 295,273 | 40.38% |

    | 2004 | **396,842** | **53.57%** | 330,201 | 44.58% |

    | 2000 | **319,951** | **49.10%** | 286,616 | 44.00% |

    | 1996 | **312,788** | **51.60%** | 186,378 | 30.80% |

    | 1992 | **263,420** | **38.80%** | 206,820 | 30.40% |

    | 1988 | 243,569 | 43.90% | **307,131** | **55.30%** |

    | 1984 | 214,515 | 38.80% | **336,500** | **60.80%** |

    | 1980 | 220,974 | 42.30% | **238,522** | **45.60%** |

    | 1976 | 232,279 | 48.07% | **236,320** | **48.91%** |

    | 1972 | 160,584 | 38.50% | **256,458** | **61.50%** |

    | 1968 | **217,312** | **55.30%** | 169,254 | 43.10% |

    | 1964 | **62,264** | **68.84%** | 118,701 | 31.16% |

    | 1960 | **181,159** | **42.95%** | 240,608 | 57.05% |


    看到表 1-3 中收集的数据，我惊讶地发现，缅因州历史上曾是共和党州，后来才变成了一个强大的民主党州。因此，我决定将缅因州描述为“倾向民主党”州，因为从 1960
    年到 2016 年，民主党在十五次选举中赢得了七次。我预测它在 2020 年仍将以微弱优势支持民主党。自 1992 年以来，民主党在缅因州连续获胜。然而，如果民主党不再更多地关注缅因州，它可能会转而支持共和党。据《班戈每日新闻》报道，克林顿在
    2015 年 9 月之后再未访问过缅因州，而是派代理人前往。多年来，民主党首次将一张选举人票输给了共和党。（班戈是缅因州的一个城市。）

