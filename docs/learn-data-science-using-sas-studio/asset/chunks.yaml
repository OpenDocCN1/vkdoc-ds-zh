  raw: '## Logistic Regression


    Logistic regression is similar to linear regression except that the dependent
    variable is of binary values, not continuous. The model equation checks the probability
    of one of the discrete binary values of the dependent variable occurring.


    The binary logistic regression model equation is as follows:


    *   *p*=*e*^ (*b*[0]+*b*[1]*X*[1]+*b*[2]*X*[2]+...) / (1+*e*^ (*b*[0]+*b*[1]*X*[1]+*b*[2]*X*[2]+...))


    Again, the null hypothesis is that there is no relationship between the variables,
    so all the coefficients are zeros. The alternative hypothesis is that there is
    a relationship between the dependent variable and the independent variables.


    For this example, we use the Titanic dataset to see if there is a relationship
    between surviving and age and passenger’s class as independent variables.


    The dataset is in the “Dataset” folder and has the name logistic_titanic_passengers.csv,
    or you can download the CSV file from `OpenDataSoft.com` at the following URL:
    [`https://public.opendatasoft.com/explore/dataset/titanic-passengers/export/`](https://public.opendatasoft.com/explore/dataset/titanic-passengers/export/).


    From SAS Studio, upload the file and click Refresh, and then import it, as we
    explained in Chapter [2](#501068_1_En_2_Chapter.xhtml). Change the name of the
    dataset from IMPORT to TITANIC.


    Click on Tasks and Utilities ➤ Tasks ➤ Linear Models ➤ Binary Logistic Regression.
    In Data, select WORK.TITANIC. In Response variable, select Survived. For the Event
    of Interest, select Yes to see the probability of the survived people, not the
    deceased. In Explanatory variables, select Age and Pclass for Continuous variables,
    as in Figure [7-14](#501068_1_En_7_Chapter.xhtml#Fig14).


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig14_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig14_HTML.jpg)


    Figure 7-14


    Binary logistic regression


    Click on the Model tab, select Custom Model, and click Edit, as in Figure [7-15](#501068_1_En_7_Chapter.xhtml#Fig15).


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig15_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig15_HTML.jpg)


    Figure 7-15


    Model tab


    Select Age and Pclass and click Add, and then scroll down and click OK, as in
    Figure [7-16](#501068_1_En_7_Chapter.xhtml#Fig16).


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig16_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig16_HTML.jpg)


    Figure 7-16


    Model effects builder


    Click Run. The output is shown in Figure [7-17](#501068_1_En_7_Chapter.xhtml#Fig17).


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig17_HTML.jpg](images/501068_1_En_7_Chapter/501068_1_En_7_Fig17_HTML.jpg)


    Figure 7-17


    Output


    Figure [7-17](#501068_1_En_7_Chapter.xhtml#Fig17) shows that the p-values of all
    the tests are < 0.0001, which means that we have enough evidence to reject the
    null hypothesis, and that there is a relationship between a passenger’s survival
    and their age and social class. The intercept is 3.6, and the coefficient of Age
    is -0.042 and that of Pclass is -1.24.


    ## Summary


    This chapter explains the single, multiple, and logistic regressions. It explains
    in detail the diagnostic matrix plots and the meaning of each of them. Moreover,
    it shows how to easily spot the outliers in several plots of the diagnostic plots.
    In the next chapter, we shall talk about the most popular SAS product on the market
    nowadays, which is SAS Viya. SAS Viya is an all-in-one product. Therefore, it
    includes SAS Studio in it as well. We shall touch on some features and options
    that are not available in the free version of SAS Studio and are added value to
    the SAS Studio packaged with SAS Viya. Moreover, we shall do a report using SAS
    Visual Analytics.


    # 8. SAS Visual Statistics: Viya


    The free version of SAS Studio does not contain all of the available features.
    Therefore, in this chapter, we will see some advanced features that are available
    in SAS Viya. SAS Viya is one of the most popular products of SAS, and its platform
    includes SAS Studio in it.


    ## About SAS Studio, SAS Visual Statistics, SAS Visual Analytics, and SAS Viya


    Too many names, and you might get confused about which does what, right?


    SAS Visual Statistics is an add-on to SAS Visual Analytics, which is a product
    that has been built on top of the Viya platform. Hence, they are all a stack built
    upon each other.


    SAS Visual Analytics enables you to explore data, apply predictive analytics,
    and build interactive reports. SAS Visual Statistics extends these capabilities
    by creating, testing, and comparing models based on the patterns discovered in
    SAS Visual Analytics.


    SAS Viya is a cloud-based product. I think that it was built with the philosophy
    of having one solution for all users. From data scientists to business analysts,
    application developers to executives, anyone can use its point-and-click interface.
    The programming interface of SAS Viya is SAS Studio. However, SAS Viya can run
    code from other programming languages, such as Python, R, and Java.


    Several products have been built on top of the Viya platform: SAS Visual Analytics,
    SAS Visual Statistics, SAS Visual Investigator, and SAS Visual Data Mining and
    Machine Learning.


    If you subscribed to try any of these products, you would have access to the rest
    of them, as they are all integrated into the SAS Viya platform. However, in this
    chapter, we will focus merely on SAS Visual Statistics.


    If you would like to know more about SAS Viya, please check out its big-picture
    video at this URL:


    [`https://video.sas.com/detail/videos/sas-viya_/video/4911667600001/sas%C2%AE-viya%E2%84%A2:-the-big-picture`](https://video.sas.com/detail/videos/sas-viya_/video/4911667600001/sas%25C2%25AE-viya%25E2%2584%25A2:-the-big-picture)


    If you would like to watch a brief introduction video about SAS Visual Statistics,
    please check out the following URL:


    [`https://players.brightcove.net/1872491364001/default_default/index.html?videoId=5772778452001`](https://players.brightcove.net/1872491364001/default_default/index.html%253FvideoId%253D5772778452001)


    To try SAS Visual Analytics and SAS Visual Statistics for free for fourteen days
    (with the option to extend if needed), please fill in this form:


    [`https://www.sas.com/en_us/trials/software/visual-analytics-visual-statistics/form.html`](https://www.sas.com/en_us/trials/software/visual-analytics-visual-statistics/form.html)


    You will receive an email with instructions and links to your portal. No installation
    is needed at all, because SAS Viya is a cloud-based platform. On SAS Viya, there
    is an option to extend your trial period.'
  trans: '

    # 逻辑回归


    逻辑回归与线性回归类似，不同之处在于因变量是二元值而非连续值。该模型方程用于检验因变量中某个离散二元值发生的概率。


    二元逻辑回归模型方程如下：


    *   `p = e^(b[0] + b[1]*X[1] + b[2]*X[2] + ...) / (1 + e^(b[0] + b[1]*X[1] + b[2]*X[2]
    + ...))`


    同样，零假设认为变量之间不存在关系，因此所有系数均为零。备择假设则认为因变量与自变量之间存在关系。


    在本例中，我们使用泰坦尼克号数据集，以年龄和乘客等级作为自变量，探究其与乘客幸存情况之间是否存在关系。


    该数据集位于 `Dataset` 文件夹中，文件名为 `logistic_titanic_passengers.csv`，你也可以通过以下链接从 `OpenDataSoft.com`
    下载该 CSV 文件：[`https://public.opendatasoft.com/explore/dataset/titanic-passengers/export/`](https://public.opendatasoft.com/explore/dataset/titanic-passengers/export/)。


    在 SAS Studio 中，上传文件并点击 `Refresh`，然后按照第二章中介绍的方法将其导入。将数据集的名称从 `IMPORT` 更改为 `TITANIC`。


    依次点击 `Tasks and Utilities ➤ Tasks ➤ Linear Models ➤ Binary Logistic Regression`。在
    `Data` 中，选择 `WORK.TITANIC`。在 `Response variable` 中，选择 `Survived`。对于 `Event of
    Interest`，选择 `Yes` 以查看幸存人员的概率，而非遇难人员的概率。在 `Explanatory variables` 中，为 `Continuous`
    变量选择 `Age` 和 `Pclass`，如图 7-14 所示。


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig14_HTML.jpg](img/501068_1_En_7_Fig14_HTML.jpg)


    图 7-14 二元逻辑回归


    点击 `Model` 选项卡，选择 `Custom Model`，然后点击 `Edit`，如图 7-15 所示。


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig15_HTML.jpg](img/501068_1_En_7_Fig15_HTML.jpg)


    图 7-15 Model 选项卡


    选择 `Age` 和 `Pclass`，点击 `Add`，然后向下滚动并点击 `OK`，如图 7-16 所示。


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig16_HTML.jpg](img/501068_1_En_7_Fig16_HTML.jpg)


    图 7-16 模型效果构建器


    点击 `Run`。输出结果如图 7-17 所示。


    ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig17_HTML.jpg](img/501068_1_En_7_Fig17_HTML.jpg)


    图 7-17 输出结果


    图 7-17 显示所有检验的 p 值均 < 0.0001，这意味着我们有足够的证据拒绝零假设，即乘客的幸存情况与其年龄和社会阶层之间存在关系。截距为 3.6，Age
    的系数为 -0.042，Pclass 的系数为 -1.24。


    ## 本章小结


    本章讲解了简单线性回归、多元线性回归和逻辑回归。详细介绍了诊断矩阵图及其各自含义。此外，还展示了如何轻松识别诊断图中的多个异常点。在下一章中，我们将介绍当前市场上最流行的
    SAS 产品——SAS Viya。SAS Viya 是一个一体化产品，因此也包含 SAS Studio。我们将介绍一些 SAS Studio 免费版中不具备、但集成在
    SAS Viya 中的 SAS Studio 所独有的增值功能和选项。此外，我们还将使用 SAS Visual Analytics 创建一个报告。


    # 8. SAS Visual Statistics: Viya


    SAS Studio 的免费版本并未包含所有可用功能。因此，在本章中，我们将了解 SAS Viya 中提供的一些高级功能。SAS Viya 是 SAS 最受欢迎的产品之一，其平台也包含了
    SAS Studio。


    ## 关于 SAS Studio、SAS Visual Statistics、SAS Visual Analytics 和 SAS Viya


    名称太多了，你可能会混淆各自的功能，对吧？


    SAS Visual Statistics 是 SAS Visual Analytics 的一个附加组件，而 SAS Visual Analytics 是建立在
    Viya 平台之上的产品。因此，它们是一个层层堆叠的技术栈。


    SAS Visual Analytics 使您能够探索数据、应用预测分析并构建交互式报告。SAS Visual Statistics 则通过基于 SAS Visual
    Analytics 中发现的模式来创建、测试和比较模型，从而扩展了这些功能。


    SAS Viya 是一款基于云的产品。我认为它秉承了为所有用户提供一站式解决方案的理念。无论是数据科学家、业务分析师、应用程序开发人员还是高管，任何人都可以使用其点击式界面。SAS
    Viya 的编程界面是 SAS Studio。然而，SAS Viya 也可以运行来自其他编程语言的代码，例如 Python、R 和 Java。


    在 Viya 平台上构建了多个产品：SAS Visual Analytics、SAS Visual Statistics、SAS Visual Investigator
    以及 SAS Visual Data Mining and Machine Learning。


    如果你订阅并尝试使用其中任何一个产品，你都将可以访问其余产品，因为它们都集成在 SAS Viya 平台中。但是，在本章中，我们将只关注 SAS Visual
    Statistics。


    如果你想了解更多关于 SAS Viya 的信息，请观看其全景介绍视频，网址如下：


    [`https://video.sas.com/detail/videos/sas-viya_/video/4911667600001/sas%C2%AE-viya%E2%84%A2:-the-big-picture`](https://video.sas.com/detail/videos/sas-viya_/video/4911667600001/sas\C2\AE-viya\E2\84\A2:-the-big-picture)


    如果你想观看关于 SAS Visual Statistics 的简短介绍视频，请查看以下网址：


    [`https://players.brightcove.net/1872491364001/default_default/index.html?videoId=5772778452001`](https://players.brightcove.net/1872491364001/default_default/index.html\videoId=5772778452001)


    要免费试用 SAS Visual Analytics 和 SAS Visual Statistics 十四天（如有需要可延期），请填写此表单：


    [`https://www.sas.com/en_us/trials/software/visual-analytics-visual-statistics/form.html`](https://www.sas.com/en_us/trials/software/visual-analytics-visual-statistics/form.html)


    你将收到一封包含说明和门户链接的电子邮件。由于 SAS Viya 是基于云计算的平台，因此完全无需安装。在 SAS Viya 上，可以选择延长试用期。

