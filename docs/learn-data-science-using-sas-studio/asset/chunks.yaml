    Class-level information and p-values


    Figure [4-25](#501068_1_En_4_Chapter.xhtml#Fig25) shows clearly different degrees
    of variability for the olfactory index within different age groups, with the variability
    generally rising with age. The sense of smell weakens and decreases with older
    age.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig25_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig25_HTML.jpg)


    Figure 4-25


    Box plot of smell distribution


    Levene’s test is for equal age group variances, and Welch’s test is for equal
    age group means. They are shown in Figure [4-26](#501068_1_En_4_Chapter.xhtml#Fig26).
    The hypotheses of age effects for mean and variance of the olfactory index are
    both confirmed as the p-values in both tests are less than 0.0001.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig26_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig26_HTML.jpg)


    Figure 4-26


    Levene’s and Welch’s tests


    Figure [4-27](#501068_1_En_4_Chapter.xhtml#Fig27) shows no remarkable difference
    between the means of the first three groups, while the difference increases with
    groups four and five.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig27_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig27_HTML.jpg)


    Figure 4-27


    LS-Means for age group


    The Tukey diagram in Figure [4-28](#501068_1_En_4_Chapter.xhtml#Fig28) shows the
    mean difference between each of the groups. There is no significant difference
    between the first three groups, which are shown in the figure with red lines.
    However, there is a significant difference between the first three groups and
    groups four and five, which are shown in the figure with blue lines. The Tukey
    output is interactive in SAS Studio; roll your mouse over every line, and SAS
    Studio shows which two groups it is comparing.


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig28_HTML.jpg](images/501068_1_En_4_Chapter/501068_1_En_4_Fig28_HTML.jpg)


    Figure 4-28


    Tukey-Kramer diagram'
