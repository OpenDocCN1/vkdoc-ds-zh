    点击`Tasks and Utilities` ➤ `Tasks` ➤ `Statistics` ➤ `Summary Statistics`。在`Data`中，选择`WORK.PAST_ELECTIONS`表，在`Roles`中，选择`D`和`R`作为分析变量，如图
    4-5 所示。


    ![../images/501068_1_En_4_Chapter/501068_1_En_4_Fig5_HTML.jpg](img/501068_1_En_4_Fig5_HTML.jpg)


