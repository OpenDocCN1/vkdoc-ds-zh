- fmt: "### Create a Histogram Using a Bar Chart\n\nA bar chart can be used to create\
    \ histograms as well. In this example, you will learn how to create a chart of\
    \ the presidential candidates and their winning percentages in Maine in 2012,\
    \ which was previously mentioned in Chapter [1](#501068_1_En_1_Chapter.xhtml)\
    \ in Figure [1-9](#501068_1_En_1_Chapter.xhtml#Fig9). The results in Maine were\
    \ as shown in Table [3-2](#501068_1_En_3_Chapter.xhtml#Tab2).\n\n**Table 3-2**\
    \ Results of Candidates and Their Winning Percentages in Maine in 2012\n\n| Candidates\
    \ | Winning Percentages |\n| --- | --- |\n| Obama | 56.27 |\n| Romney | 40.98\
    \ |\n| Johnson | 1.31 |\n| Stein | 1.14 |\n| Paul | 0.29 |\n| Anderson | 0.01\
    \ |\n| Reed | 0 |\n\nYou will find a dataset created to present these percentages\
    \ in the `Dataset` folder; the file is named `Maine_Candidates and their winning\
    \ percentages in 2012.csv`.\n\nCopy the CSV file to your `myfolders` folder. From\
    \ SAS Studio, click `Refresh`, and then import it as we explained in Chapter [2](#501068_1_En_2_Chapter.xhtml).\
    \ Change the name of the dataset from `IMPORT` to `CANDIDATES2012`, as in Figure\
    \ [3-32](#501068_1_En_3_Chapter.xhtml#Fig32). Click `Run`.\n\n![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig32_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig32_HTML.jpg)\n\
    \n**Figure 3-32** Import the dataset\n\nTo create a histogram using a bar chart,\
    \ click on Tasks and Utilities ➤ Tasks ➤ Graph ➤ Bar Chart. As in Figure [3-33](#501068_1_En_3_Chapter.xhtml#Fig33),\
    \ in the Data section, select the `WORK` library and `CANDIDATES2012` table. In\
    \ Roles ➤ Category, select the column `x`. Then, run the program.\n\n![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig33_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig33_HTML.jpg)\n\
    \n**Figure 3-33** The initial histogram using bar chart\n\nNow, we want to do\
    \ three tasks to enhance the chart:\n\n*   Color the bars with the corresponding\
    \ party color.\n*   Modify the footnote to append the candidates’ names.\n*  \
    \ Remove the x-axis label.\n\nTo do these three tasks, we need to edit the code,\
    \ and not from the GUI. In the Code tab, click `Edit`. The code will open in a\
    \ new program window. Edit the code to be as in Listing [3-2](#501068_1_En_3_Chapter.xhtml#PC3),\
    \ or just copy and paste the listing, which is in the source code for this book.\n\
    \n```\nods graphics / reset width=6.4in height=4.8in imagemap ;\nproc sgplot data=\
    \  WORK.CANDIDATES2012 noautolegend;\nfootnote2 \"The candidates, 1: Obama 2:Romney\
    \ 3:Johnson, 4:Stein 5:Paul 6:Anderson 7:Reed\";\nvbar x / colorresponse=x colorstat=mean\
    \ colormodel=(blue red silver green) ;\nxaxis display=(nolabel);\nyaxis grid;\n\
    run;\nods graphics / reset;\nfootnote2;\n```\n\n**Listing 3-3** Histogram Using\
    \ Parties’ Colors\n\nRun the code. The output will be as in Figure [3-34](#501068_1_En_3_Chapter.xhtml#Fig34).\n\
    \n![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig34_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig34_HTML.jpg)\n\
    \n**Figure 3-34** The bars with corresponding party colors\n\nPlease feel free\
    \ to play with the code. For example, remove `noautolegend` in the second line\
    \ of the code, re-run it, and check the change in the graph; or remove `display=(nolabel)`\
    \ in the X-Axis options or play with the colors in the `colormodel` option.\n\n\
    For more examples and explanations of the bar chart options, please check the\
    \ following links:\n\n1.  SAS Documentation—Managing Axes in OVERLAY Layouts:\n\
    \    [`https://documentation.sas.com/?docsetId=grstatug&docsetTarget=p1pqfzgbuzbpkzn1mrbzhgggvhkz.htm&docsetVersion=9.4&locale=en#p18of8gjhjfti1n15y1w0iqtp4nr`](https://documentation.sas.com/%253FdocsetId%253Dgrstatug%2526docsetTarget%253Dp1pqfzgbuzbpkzn1mrbzhgggvhkz.htm%2526docsetVersion%253D9.4%2526locale%253Den%2523p18of8gjhjfti1n15y1w0iqtp4nr)\n\
    \n2.  SAS Blog—Response Colors and Thickness:\n    [`https://blogs.sas.com/content/graphicallyspeaking/2015/09/21/response-colors-and-thickness/`](https://blogs.sas.com/content/graphicallyspeaking/2015/09/21/response-colors-and-thickness/)\n\
    \n3.  Data Flair—Types of Bar Chart in SAS:\n    [`https://data-flair.training/blogs/sas-bar-chart/`](https://data-flair.training/blogs/sas-bar-chart/)"
  raw: '### Create a Histogram Using a Bar Chart


    A bar chart can be used to create histograms as well. In this example, you will
    learn how to create a chart of the presidential candidates and their winning percentages
    in Maine in 2012, which was previously mentioned in Chapter [1](#501068_1_En_1_Chapter.xhtml)
    in Figure [1-9](#501068_1_En_1_Chapter.xhtml#Fig9). The results in Maine were
    as shown in Table [3-2](#501068_1_En_3_Chapter.xhtml#Tab2).


    Table 3-2


    Results of Candidates and Their Winning Percentages in Maine in 2012


    | Candidates | Winning Percentages |

    | --- | --- |

    | Obama | 56.27 |

    | Romney | 40.98 |

    | Johnson | 1.31 |

    | Stein | 1.14 |

    | Paul | 0.29 |

    | Anderson | 0.01 |

    | Reed | 0 |


    You will find a dataset created to present these percentages in the “Dataset”
    folder; the file is named Maine_Candidates and their winning percentages in 2012.csv.


    Copy the CSV file to your “myfolders” folder. From SAS Studio, click Refresh,
    and then import it as we explained in Chapter [2](#501068_1_En_2_Chapter.xhtml).
    Change the name of the dataset from IMPORT to CANDIDATES2012, as in Figure [3-32](#501068_1_En_3_Chapter.xhtml#Fig32).
    Click Run.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig32_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig32_HTML.jpg)


    Figure 3-32


    Import the dataset


    To create a histogram using a bar chart, click on Tasks and Utilities ➤ Tasks
    ➤ Graph ➤ Bar Chart. As in Figure [3-33](#501068_1_En_3_Chapter.xhtml#Fig33),
    in the Data section, select the WORK library and CANDIDATES2012 table. In Roles
    ➤ Category, select the column x. Then, run the program.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig33_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig33_HTML.jpg)


    Figure 3-33


    The initial histogram using bar chart


    Now, we want to do three tasks to enhance the chart:


    *   Color the bars with the corresponding party color.


    *   Modify the footnote to append the candidates’ names.


    *   Remove the x-axis label.


    To do these three tasks, we need to edit the code, and not from the GUI. In the
    Code tab, click Edit. The code will open in a new program window. Edit the code
    to be as in Listing [3-2](#501068_1_En_3_Chapter.xhtml#PC3), or just copy and
    paste the listing, which is in the source code for this book.


    ```

    ods graphics / reset width=6.4in height=4.8in imagemap ;

    proc sgplot data=  WORK.CANDIDATES2012 noautolegend;

    footnote2 "The candidates, 1: Obama 2:Romney 3:Johnson, 4:Stein 5:Paul 6:Anderson
    7:Reed";

    vbar x / colorresponse=x colorstat=mean colormodel=(blue red silver green) ;

    xaxis display=(nolabel);

    yaxis grid;

    run;

    ods graphics / reset;

    footnote2;

    Listing 3-3

    Histogram Using Parties’ Colors

    ```


    Run the code. The output will be as in Figure [3-34](#501068_1_En_3_Chapter.xhtml#Fig34).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig34_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig34_HTML.jpg)


    Figure 3-34


    The bars with corresponding party colors


    Please feel free to play with the code. For example, remove `noautolegend` in
    the second line of the code, re-run it, and check the change in the graph; or
    remove `display=(nolabel)` in the X-Axis options or play with the colors in the
    colormodel option.


    For more examples and explanations of the bar chart options, please check the
    following links:


    1.  SAS Documentation—Managing Axes in OVERLAY Layouts:


    [`https://documentation.sas.com/?docsetId=grstatug&docsetTarget=p1pqfzgbuzbpkzn1mrbzhgggvhkz.htm&docsetVersion=9.4&locale=en#p18of8gjhjfti1n15y1w0iqtp4nr`](https://documentation.sas.com/%253FdocsetId%253Dgrstatug%2526docsetTarget%253Dp1pqfzgbuzbpkzn1mrbzhgggvhkz.htm%2526docsetVersion%253D9.4%2526locale%253Den%2523p18of8gjhjfti1n15y1w0iqtp4nr)


    2.  SAS Blog—Response Colors and Thickness:


    [`https://blogs.sas.com/content/graphicallyspeaking/2015/09/21/response-colors-and-thickness/`](https://blogs.sas.com/content/graphicallyspeaking/2015/09/21/response-colors-and-thickness/)


    3.  Data Flair—Types of Bar Chart in SAS:


    [`https://data-flair.training/blogs/sas-bar-chart/`](https://data-flair.training/blogs/sas-bar-chart/)'
  trans: "\n### 使用条形图创建直方图\n\n条形图也可用于创建直方图。在此示例中，您将学习如何创建一张关于 2012 年缅因州总统候选人及其得票率的图表，该图表先前在第一章的图\
    \ 1-9 中提及过。缅因州的结果如表 3-2 所示。\n\n**表 3-2** 2012 年缅因州候选人及其得票率结果\n\n| 候选人 | 得票率 |\n\
    | --- | --- |\n| 奥巴马 | 56.27 |\n| 罗姆尼 | 40.98 |\n| 约翰逊 | 1.31 |\n| 斯泰因 | 1.14\
    \ |\n| 保罗 | 0.29 |\n| 安德森 | 0.01 |\n| 里德 | 0 |\n\n您将在`Dataset`文件夹中找到为呈现这些百分比而创建的数据集；文件名为`Maine_Candidates\
    \ and their winning percentages in 2012.csv`。\n\n将 CSV 文件复制到您的`myfolders`文件夹中。从\
    \ SAS Studio 中，点击`Refresh`，然后按照第二章中的说明导入它。将数据集的名称从`IMPORT`更改为`CANDIDATES2012`，如图\
    \ 3-32 所示。点击`Run`。\n\n![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig32_HTML.jpg](img/501068_1_En_3_Fig32_HTML.jpg)\n\
    \n**图 3-32** 导入数据集\n\n要使用条形图创建直方图，请点击 Tasks and Utilities ➤ Tasks ➤ Graph ➤ Bar\
    \ Chart。如图 3-33 所示，在 Data 部分，选择`WORK`库和`CANDIDATES2012`表。在 Roles ➤ Category 中，选择列`x`。然后运行程序。\n\
    \n![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig33_HTML.jpg](img/501068_1_En_3_Fig33_HTML.jpg)\n\
    \n**图 3-33** 使用条形图生成的初始直方图\n\n现在，我们需要执行三项任务来完善图表：\n\n*   用对应的政党颜色为条形着色。\n*   修改脚注以附加候选人姓名。\n\
    *   移除 x 轴标签。\n\n要完成这三项任务，我们需要编辑代码，而不是通过图形界面进行操作。在 Code 选项卡中，点击`Edit`。代码将在新的程序窗口中打开。按照代码清单\
    \ 3-2 编辑代码，或者直接复制粘贴本书源代码中的该代码清单。\n\n```\nods graphics / reset width=6.4in height=4.8in\
    \ imagemap ;\nproc sgplot data=  WORK.CANDIDATES2012 noautolegend;\nfootnote2\
    \ \"候选人：1:奥巴马 2:罗姆尼 3:约翰逊, 4:斯泰因 5:保罗 6:安德森 7:里德\";\nvbar x / colorresponse=x\
    \ colorstat=mean colormodel=(blue red silver green) ;\nxaxis display=(nolabel);\n\
    yaxis grid;\nrun;\nods graphics / reset;\nfootnote2;\n```\n\n**代码清单 3-3** 使用政党颜色绘制的直方图\n\
    \n运行代码。输出结果将如图 3-34 所示。\n\n![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig34_HTML.jpg](img/501068_1_En_3_Fig34_HTML.jpg)\n\
    \n**图 3-34** 具有对应政党颜色的条形图\n\n请随意修改代码进行尝试。例如，删除代码第二行的`noautolegend`，重新运行并观察图表的更改；或者移除\
    \ X 轴选项中的`display=(nolabel)`，亦或修改`colormodel`选项中的颜色。\n\n有关条形图选项的更多示例和说明，请查看以下链接：\n\
    \n1.  SAS 文档——在 OVERLAY 布局中管理坐标轴：\n    [`https://documentation.sas.com/?docsetId=grstatug&docsetTarget=p1pqfzgbuzbpkzn1mrbzhgggvhkz.htm&docsetVersion=9.4&locale=en#p18of8gjhjfti1n15y1w0iqtp4nr`](https://documentation.sas.com/%253FdocsetId%253Dgrstatug%2526docsetTarget%253Dp1pqfzgbuzbpkzn1mrbzhgggvhkz.htm%2526docsetVersion%253D9.4%2526locale%253Den%2523p18of8gjhjfti1n15y1w0iqtp4nr)\n\
    \n2. SAS 博客——响应颜色与厚度：\n    [`https://blogs.sas.com/content/graphicallyspeaking/2015/09/21/response-colors-and-thickness/`](https://blogs.sas.com/content/graphicallyspeaking/2015/09/21/response-colors-and-thickness/)\n\
    \n3. Data Flair——SAS 中的条形图类型：\n    [`https://data-flair.training/blogs/sas-bar-chart/`](https://data-flair.training/blogs/sas-bar-chart/)\n"
- fmt: '# Bubble Chart


    The scatter plot is useful if you want to display the relationship between two
    variables. If you want to display the relationship between three variables, you
    use the bubble chart. In this example, we will create a bubble chart to display
    the heights, weights, and ages of students of a class.


    Click on `Tasks and Utilities` ➤ `Tasks` ➤ `Graph` ➤ `Bubble Chart`. In `Data`,
    select the `SASHELP.CLASS` library. Then in `Roles`, for the X axis of the graph,
    select `Height`; for the Y axis, select `Weight`, and for Bubble size, select
    `Age`, as in Figure [3-35](#501068_1_En_3_Chapter.xhtml#Fig35).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig35_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig35_HTML.jpg)


    Figure 3-35


    Bubble chart


    Click `Run`. The initial output graph will be as in Figure [3-36](#501068_1_En_3_Chapter.xhtml#Fig36).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig36_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig36_HTML.jpg)


    Figure 3-36


    The initial output chart


    Now, let us enhance the appearance. Click on the `Appearance` tab. As in Figure
    [3-37](#501068_1_En_3_Chapter.xhtml#Fig37), in `Bubble Labels`, for `Bubble Label`,
    select `Name`. As in Figure [3-37](#501068_1_En_3_Chapter.xhtml#Fig37), click
    on `Title and Footnote`, and for the Title, write “Age by Height and Weight,”
    and for Footnote, write “Bubble size represents age.”


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig37_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig37_HTML.jpg)


    Figure 3-37


    Add bubble label


    Re-run the program. The output will be as in Figure [3-38](#501068_1_En_3_Chapter.xhtml#Fig38).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig38_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig38_HTML.jpg)


    Figure 3-38


    The chart with bubble labels


    The chart should be concise and should not contain any repeated data. The graph
    in Figure [3-38](#501068_1_En_3_Chapter.xhtml#Fig38) has the students’ names repeated
    twice, once as bubble labels and again in the legend at the bottom of the chart.
    To correct that, we need to edit the code. Click `Edit`, as in Figure [3-39](#501068_1_En_3_Chapter.xhtml#Fig39).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig39_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig39_HTML.jpg)


    Figure 3-39


    Click Edit


    As in Figure [3-40](#501068_1_En_3_Chapter.xhtml#Fig40), edit the code by adding
    the option of `noautolegend` to the `sgplot` function to remove the auto-generated
    legend under the graph. To enhance the appearance of the footnote, let us change
    its place to be inside the graph and indent it to the bottom right so as to not
    overlap any of the results. To do that, add the following line of code:


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig40_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig40_HTML.jpg)


    Figure 3-40


    Edit the code


    ```

    inset"Bubble size represents Age" / position=bottomright textattrs=(size=11);

    ```


    Now, re-run the code. The output is enhanced and would be as in Figure [3-41](#501068_1_En_3_Chapter.xhtml#Fig41).


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig41_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig41_HTML.jpg)


    Figure 3-41


    The final version of the bubble chart


    From this plot, we can see that Joyce is the lightest and shortest student in
    the class. Also, she is one of the two youngest students in the class. Joyce and
    Thomas have the smallest circles. If we return to the table by clicking on `Libraries`
    ➤ `SASHELP` ➤ `CLASS`, click on the `Age` column to sort the data by age. You
    will find that both of them are eleven years old. On the other hand, Philip is
    the tallest, heaviest, and oldest student in the class. He is the only student
    who is sixteen years old, and the rest of the class is younger than him. That
    is why his circle is the largest. Joyce and Philip would be considered as outliers.
    However, this class is only nineteen students, which is a very small sample. The
    larger the sample size, the better the analysis.


    # Maps


    Displaying data on a map adds new perspectives. It can tell a whole story all
    by itself. SAS Studio made displaying data on maps easy. Moreover, customizing
    the map with colors and bubbles adds new dimensions to your data. This section
    will walk you through the process using real-life data. It will show you in step-by-step
    how to download the data and prepare it to be displayed on a map.'
