    # 导览


    SAS Studio 界面基本分为两个垂直窗格。第一个是导航窗格，包含多个选项卡，例如：`Server Files and Folders`（服务器文件和文件夹）、`Tasks
    and Utilities`（任务与工具）、`Snippets`（代码片段）以及 `Libraries`（库）。第二个是工作区，用于显示程序的编辑器/代码、日志和结果。


    `Server Files and Folders` 选项卡包含您在机器上创建的共享文件夹内的所有文件夹和子文件夹。请记住，SAS Studio 运行在虚拟机内部；因此，默认情况下它看不到您操作系统的文件和文件夹。它只能看到该共享文件夹内的内容。在本章稍后的内容中，您将学习如何将文件从您的操作系统导入到
    SAS Studio 运行的虚拟机，反之亦然。完成这些操作后，您将能够在 SAS Studio 内部使用这些文件。


    `Tasks and Utilities` 选项卡包含您可以在 SAS Studio IDE 内使用的任务图形用户界面（GUI）。在本章及本书的后续内容中，您将了解该选项卡如何简化您的数据科学流程，以及如何通过几次鼠标点击，帮助您完成探索、清理和处理数据的大部分基本步骤，并帮助您进行预测。


    `Snippets` 选项卡将一些最常用的任务以现成的代码形式提供给您。您可以针对自己的数据集重用这些代码并进行自定义。您将在本章后文中了解更多相关信息。


    `Libraries` 选项卡中存放着 SAS Studio 用于执行任务和工具的数据集。


    在虚拟机中成功安装 SAS Studio 后，点击左侧窗格中的 `Libraries`。然后依次点击 `SASHELP` 和 `CARS`。您将看到一个表格查看器，如图
    2-1 所示，其中显示了一个包含汽车信息的数据集。中间窗格显示该数据集的列。默认情况下，左侧图 2-1 中以红色高亮的 "Select all"（全选）处于选中状态。现在，取消选中它，并仅勾选
    "Make"（制造商）和 "Model"（型号）。右侧窗格将仅显示这两列的数据。尝试调整它们的大小。您可以将任何列向左或向右拖动以重新排列它们。您可以通过点击列名来对任何列进行升序或降序排序。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig1_HTML.jpg](img/501068_1_En_2_Fig1_HTML.jpg)


    **图 2-1** SAS Studio 界面


    现在，点击图 2-1 中间高亮的图标。此图标是展开/折叠按钮。第一次点击时，左侧窗格将折叠，为您正在处理的任务提供展开视图。如果再次点击该按钮，窗格将恢复原状。


    查看数据的另一种方法是使用代码。让我们编写第一段 SAS 代码。从左侧开始的第三个图标，点击后会显示一个下拉菜单，如图 2-2 所示。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig2_HTML.jpg](img/501068_1_En_2_Fig2_HTML.jpg)


    **图 2-2** 打开一个新的 SAS 程序


    点击 `New SAS Program`（新建 SAS 程序）并开始输入 `"pr"`，如图 2-3 所示。您将会发现有帮助菜单弹出，显示用于自动补全您输入内容的关键字，并附有说明以及用于示例和文档的附加链接，如图
    2-3 所示。此功能对初学者非常有用。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig3_HTML.jpg](img/501068_1_En_2_Fig3_HTML.jpg)


    **图 2-3** 自动补全功能和有用的弹出菜单


    然而，当您对 SAS Studio 更加熟悉并希望禁用此功能时，您可以通过点击 `Preferences`（首选项）来实现，如图 2-4 所示。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig4_HTML.jpg](img/501068_1_En_2_Fig4_HTML.jpg)


    **图 2-4** 首选项


    现在，点击 `Code and Log`（代码和日志），并取消选中 `"Enable autocomplete (CTRL + spacebar or Command
    + spacebar)"`（启用自动补全），如图 2-5 所示。由于本书针对的是初学者，我们将不会更改默认设置。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig5_HTML.jpg](img/501068_1_En_2_Fig5_HTML.jpg)


    **图 2-5** 用于启用或禁用代码自动补全的代码和日志


    现在，输入清单 2-1 中所示的代码。


    ```

    proc print data=SASHELP.CARS;

    run;

    ```


    **清单 2-1** Proc Print 过程


    点击 `Run`（运行）按钮，如图 2-6 所示。不要忘记分号和 `run;` 来结束过程段。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig6_HTML.jpg](img/501068_1_En_2_Fig6_HTML.jpg)


    **图 2-6** 运行按钮


    结果将准备好进行打印。您可以通过点击图 2-7 中高亮的图标，将结果打印为 HTML、PDF 或 RTF 格式。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig7_HTML.jpg](img/501068_1_En_2_Fig7_HTML.jpg)


    **图 2-7** 将结果打印为 HTML、PDF 或 RTF 格式


    您刚刚成功编写、执行并打印了第一个 SAS 程序的报告。太棒了！恭喜！


    现在，点击左侧窗格中的 `Libraries`。然后依次点击 `SASHELP` 和 `CARS`。要获取 SAS Studio 自动生成以显示该表格的代码，请点击图
    2-8 中高亮的图标。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig8_HTML.jpg](img/501068_1_En_2_Fig8_HTML.jpg)


    **图 2-8** 显示创建当前表格的代码的图标


    在接下来的章节中，我们将使用此功能来修改 SAS Studio 为我们生成的代码，以执行更高级的任务。例如，在第 3 章关于气泡图的章节中，有一个示例，您将编辑生成的代码来对图表外观进行一些自定义设置。


    ## 任务


    让我们完成一个简单的任务。列出数据是在 SAS Studio 界面中查看数据的第三种方式。点击 `Tasks` ➤ `Data` ➤ `List Data`（列出数据）。在
    `DATA` 中，选择 `SASHELP.CARS`。在 `List Variables`（列出变量）中，选择以下变量：`Make`、`Model`、`Invoice`。在
    `Group Analysis By`（分组依据）中，选择 `Origin`，如图 2-9 所示。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig9_HTML.jpg](img/501068_1_En_2_Fig9_HTML.jpg)


    **图 2-9** 列出数据


    然后，点击 `Run`。图 2-10 显示了 `List Data` 示例的输出。


    ![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig10_HTML.jpg](img/501068_1_En_2_Fig10_HTML.jpg)


    **图 2-10** 列出数据的输出

