    ## 总结


    本章代表了我们在学习 SAS Studio 和 SAS 编程之旅中的基础。它从安装步骤开始，然后解释了界面和 SAS 程序的基本组成部分。此外，还解释了数据类型和库。在下一章中，我们将更深入地研究数据可视化。


    # 3. 数据可视化


    有句格言说：“一图胜千言。”在其他编程工作中，可视化是一项繁琐而艰巨的任务。幸运的是，SAS Studio 可以通过其集成开发环境轻松制作出漂亮的图形。本章使用公共领域中可用的大型数据集。我们将遵循第
    1 章中提到的数据科学流程，即每个部分都从一个问题开始，并通过图表寻求答案。


    本章涵盖了各种基本图表，例如散点图、直方图、序列图、条形图和排序条形图、气泡图以及聚类分析和树状图。此外，本章还演示了如何将数据显示在地图上，这在其他编程语言中是一项极具挑战性的任务。

