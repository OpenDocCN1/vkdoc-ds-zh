    ## 散点图代码


    正如你刚才所见，只需点击几下鼠标，无需编写一行代码即可完成图表制作。这就是 SAS Studio 成为数据科学初学者最佳选择的原因。友好的图形用户界面（GUI）帮助你专注于概念，而它为你处理语法问题。然而，阅读代码并检查日志是沿途应养成的良好习惯，以便你编写比
    GUI 提供的更复杂的代码。本章后续部分及本书其余章节，我们将提供一些高级示例，届时我们将练习编辑代码。


    检查`Log`选项卡，确保没有出现任何错误或警告。从日志中验证 SAS Studio 执行无误的行数，并解决 SAS Studio 在处理过程中跳过的行相关问题。


    那么，让我们来看看代码。代码应如代码清单 3-1 所示。


    ```

    ods graphics / reset width=6.4in height=4.8in  imagemap;

    proc sgplot data= WORK.SEATTLE_WAGES (where=(age_range ne ''Grand Total'' and
    age_Range ne ''under 20'')) ;

    scatter x=AGE_RANGE y=Total_Average_of_HOURLY_RATE /

    ;

    xaxis   grid;

    yaxis   grid;

    run;

    ods graphics / reset;

    ```


    代码清单 3-1


    包含过滤代码以剔除`AGE_RANGE`中最后两个值的散点图代码


    在代码的第一行，SAS Studio 使用了`ods graphics`。统计过程使用 ODS Graphics 在其输出中创建图表，并设置图表的宽度和高度。你可以在代码中或在
    GUI 的`Appearance`选项卡中更改这些尺寸。第二行使用了`PROC SGPLOT`，它提供了一种制作各种散点图的简便方法。请注意过滤代码被添加到了`Data`语句中。然后，SAS
    Studio 使用`scatter`关键字来标识`sgplot`类型，并标识 x 轴和 y 轴使用的变量。最后，选择 xy 网格。你可以通过从代码中删除这两行或在`Appearance`选项卡中取消选中它们来移除网格。


    ## 散点图关系


    图 3-8 展示了散点图关系的各种示例。要描述散点图，你应该说明它是线性关系还是曲线关系，正如我们在前面的例子中看到的那样。如果相互依赖关系是线性的，则查看其方向以判断是正相关还是负相关。在图
    3-8 中，左上角的关系是正相关，而右上角的图是负相关。在图 3-8 中，左下角没有关系，因为点不规则地分散。在图 3-8 中，右下角没有方向，因为关系不是线性的，而是曲线关系。最后，散点图描述了关系的强度。如果点非常靠近线/形状，则相互依赖程度高，关系强。否则，关系弱。


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig8_HTML.jpg](img/501068_1_En_3_Fig8_HTML.jpg)


    图 3-8


    散点图的方向、强度和线性

