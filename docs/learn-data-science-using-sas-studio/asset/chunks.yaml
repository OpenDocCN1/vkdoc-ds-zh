- fmt: '# Plotting More Than One Scatter Plot in the Same Image


    We can plot more than one scatter plot in the same image to compare values. For
    this example, we have the number of registered voters in every party and will
    plot them to compare which party has more registered voters in each of Maine’s
    counties. This program cannot be done using the GUI and has to be done using the
    code.


    The dataset `MAINECOUNTIESPARTIES.xlsx` in the “Dataset” folder has three columns:
    the counties and the registered voters per Republican and Democratic party (Table
    3-1).


    **Table 3-1** `MAINECOUNTIESPARTIES.xlsx`


    | Counties | Republican | Democratic |

    | --- | --- | --- |

    | Androscoggin | 28189 | 22975 |

    | Aroostook | 19419 | 13377 |

    | Cumberland | 57697 | 102935 |

    | Franklin | 7900 | 7001 |

    | Hancock | 13682 | 16107 |

    | Kennebec | 29296 | 31753 |

    | Knox | 9148 | 12440 |

    | Lincoln | 9727 | 10241 |

    | Oxford | 12172 | 16214 |

    | Penobscot | 41601 | 32832 |

    | Piscataquis | 5403 | 3098 |

    | Sagadahoc | 9304 | 10679 |

    | Somerset | 14998 | 9092 |

    | Waldo | 10378 | 10442 |

    | Washington | 9037 | 6358 |

    | York | 50388 | 55828 |


    After uploading the Excel file to SAS Studio and importing it to the Work library,
    as we did in Chapter 2, we run the code in Listing 3-2.


    ```sas

    ods graphics / reset width=6.4in height=4.8in  imagemap;

    proc sgplot data= WORK.MAINECOUNTIESPARTIES NOAUTOLEGEND;

    scatter x=counties y=Republican markerattrs=(color=red);

    scatter x=counties y=Democratic markerattrs=(color=Blue symbol=circlefilled);

    xaxis grid;

    yaxis grid  label="Republican:Red Democrat:Blue";

    run;

    ods graphics / reset;

    ```


    *Listing 3-2 Comparing the Republican Registered Voters to the Democratic Ones
    in Maine’s Counties*


    The code plots two overlapped scatter plots, where each has counties on its x-axis.
    The y-axis in the first scatter plot is the number of Republicans and in the second
    one is the number of Democrats. To change the colors to distinguish between each
    of them, we used the `markerattrs` option. Moreover, we added `symbol=circlefilled`
    to only the Democratic Party points to distinguish between the points even in
    grayscale. We added the grids to both the x- and y-axis. Finally, we changed the
    label of the y-axis to `Republican:Red Democrat:Blue` instead of the legend, as
    we removed the automatic legend from generation by adding `NOAUTOLEGEND` as an
    option to `PROC SGPLOT`.


    The output of the preceding code is shown in Figure 3-9.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig9_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig9_HTML.jpg)


    *Figure 3-9 Scatter plot of Maine counties and parties*


    From Figure 3-9, we can say that Cumberland County has the highest number of Democratic
    voters and the highest number of registered voters in general. This might imply
    that it has the largest population as well, but we cannot ensure that and will
    need further verification. However, we are sure that the difference between the
    Democrats and Republicans is enormous there. Other than this county, Democrats
    are more than the Republicans in eight of the remaining fifteen counties with
    small differences. Hence, Democrats have to give more care to Maine so it does
    not turn back to red.


    Similarly, you can do the same exercise with your state and get ready for the
    next presidential election with your own analysis and predictions.


    ## Histogram


    The Histogram task creates a chart that displays the frequency distribution of
    a numeric variable. For this example, we shall see how the annual wages of employees
    are being distributed in March 2018 in Charlotte, North Carolina.


    You will find the data file named `City_Employee_Salaries_March_2018.csv` in the
    “Datasets” folder. Or, you can download the CSV file from the Data.Gov project
    at the following URL: [`https://catalog.data.gov/dataset/city-employee-salaries-march-2018`](https://catalog.data.gov/dataset/city-employee-salaries-march-2018)


    Copy the CSV file to the “myfolders” folder. From SAS Studio, click Refresh, then
    import it as we explained in Chapter 2. Change the name of the dataset from `IMPORT`
    to `Charlotte_wages`.


    Click on **Tasks and Utilities** ➤ **Graph** ➤ **Histogram**. In **Data**, select
    `WORK.CHARLOTTE_WAGES`. To do that, as in Figure 3-3, click on the small table
    beside the dataset name. Next, click on the `+` sign beside the **Analysis Variable**
    and select `Annual_Rt`, as in Figure 3-10; then, click **OK**.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig10_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig10_HTML.jpg)


    *Figure 3-10 Select the analysis variable to plot its histogram*


    Observe that SAS Studio auto-generated the code in the right-hand pane in the
    **Code** tab. Again, it uses `SG Plot`, but using the `histogram` keyword this
    time. Now, click **Run**. SAS Studio will plot the histogram in the **Results**
    tab, as in Figure 3-11.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig11_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig11_HTML.jpg)


    *Figure 3-11 Histogram of Charlotte city employees*


    ### Appearance Tab


    Let us enhance the appearance of the graph by comparing our histogram to the normal
    distribution and kernel estimates. Click on the **Appearance** tab. Select **Normal**
    and **Kernel Density**. Re-run the code. The output is similar to Figure 3-12.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig12_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig12_HTML.jpg)


    *Figure 3-12 Normal and kernel density*


    As in Figure 3-13, change the title to “The Distribution of The Annual Rate of
    Charlotte City Employees.” Then, click on **X-Axis** and check “Show tick marks
    at bin midpoints.”


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig13_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig13_HTML.jpg)


    *Figure 3-13 Show tick marks*


    Click on the **Code** tab. Observe how SAS Studio has changed the code according
    to your choices, as in Figure 3-14.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig14_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig14_HTML.jpg)


    *Figure 3-14 Histogram code after changing the settings of the bin midpoints and
    the title*


    Now, return to the **Appearance** tab. Change the number of bins to 20, as in
    Figure 3-15. Re-run the code.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig15_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig15_HTML.jpg)


    *Figure 3-15 Number of bins*


    Now, in the **X-Axis** section, change the maximum value to 140000, as in Figure
    3-16. Re-run.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig16_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig16_HTML.jpg)


    *Figure 3-16 Change the X-Axis maximum value*


    Now, we have a more normal distribution curve than before, when we had a right-skewed
    curve.'
