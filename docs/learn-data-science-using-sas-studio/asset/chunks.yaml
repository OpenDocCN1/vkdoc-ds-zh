    ## Cluster Analysis


    Cluster analysis is an unsupervised learning algorithm. Supervised learning is
    for prediction and has a specific output/dependent variable, while unsupervised
    learning is for exploring data.


    Clustering is popular in market segmentation, gene, and cancer research. For example,
    in online stores, you usually will find that the product you are looking at is
    often bought with other listed products. Another example is its use in gene studies
    to find similarities between them.


    The most popular ways to perform cluster analysis are PCA, K-means, and hierarchal
    analysis.


    In SAS Studio, you can do all of them easily. In this example, you will learn
    how to do hierarchal analysis. This mainly has two steps: upload the clean dataset
    and add all the variables to the cluster, and SAS Studio will handle the rest
    for you.


    Click on `Tasks and Utilities` ➤ `Tasks` ➤ `Cluster Analysis` ➤ `Cluster Variables`.
    The user interface for the `Cluster Variables` task opens. As in Figure [3-49](#501068_1_En_3_Chapter.xhtml#Fig49),
    on the `Data` tab, select the `SASHELP.CARS` dataset. Finally, select all the
    variables you want in the `Variables to cluster` section. Then, click `Run`.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig49_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig49_HTML.jpg)


    **Figure 3-49** Cluster Variables


    Hierarchal clustering has two types: agglomerative (bottom-up) and divisive (top-down).


    The agglomerative algorithm considers each point as a cluster, then repeatedly
    combines the two nearest clusters. The divisive starts with one cluster and recursively
    splits it into more branches.


    SAS Studio uses the divisive method. The output clearly explains how the tree
    is structured and then how each branch is divided into more branches. In this
    example, the output, which is shown in Figure [3-50](#501068_1_En_3_Chapter.xhtml#Fig50),
    says that the cluster is divided into two branches, and that on the second level,
    each branch is divided into more branches.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig50_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig50_HTML.jpg)


    **Figure 3-50** Splitting the cluster


    Moreover, SAS Studio publishes dendrograms, as in Figure [3-51](#501068_1_En_3_Chapter.xhtml#Fig51).
    To read the dendrogram in the order of the cluster formation, read it from right
    to left.


    ![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig51_HTML.jpg](images/501068_1_En_3_Chapter/501068_1_En_3_Fig51_HTML.jpg)


    **Figure 3-51** Dendrogram


    However, to know the similarity, read the dendrogram from left to right. The cluster
    of `Horsepower`, `Invoice`, and `MSRP` is most similar as it has the shortest
    branch. Similarly, the other cluster of `Length`, `Wheelbase`, `Weight`, `MPG
    (Highway)`, `MPG (City)`, `Cylinders`, and `Engine Size` is similar and has the
    shortest branch equal to that of the previous cluster. The first cluster has the
    longest branch.


    ## Summary


    This chapter digs deeper into data visualization. It starts with the most essential
    plots, such as scatter plots and histograms, then moves to more advanced ones,
    such as maps. Moreover, it shows how to concatenate plots over each other by changing
    the colors and patterns to ease the comparisons of the findings. Data visualization
    in SAS Studio is one of the most powerful features because plenty of the plots
    can be done using the IDE and without writing any code.


    The chapter ends with explaining some crucial concepts in data science, which
    are supervised and unsupervised learning. Also, it talks about how to do clustering.
