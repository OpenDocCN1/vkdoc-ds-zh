  \n图 3-24\n\n添加标题\n\n## 如何对条形图排序？\n\n图 3-24 显示了各队的平均薪资。然而，从图中找出薪资第二和第三高的球队可能会令人困惑。为避免混淆，最好对图形进行升序或降序排序。我们将通过四个步骤对条形图进行排序。\n\
