  ## 本章小结


  本章解释了几乎所有分析和数据科学报告中最重要的五个统计概念。这五个概念是单因子频数分析、概要统计量、相关性分析、T 检验和方差分析。此外，本章还介绍了大量高级可视化和表格，例如
  Levene 和 Welch 表以及 Tukey 和最小二乘均值图。


  同样，我们在主要依靠集成开发环境完成所有这些任务的同时，也解释了代码。现在，是时候更深入地学习代码了。在下一章中，我们将更深入地学习 SAS 编程，了解运算符、循环和
  `SELECT` 语句，并初步接触 `PROC SQL`。


