  SAS Studio 的强大之处在于它提供了两种类型的底图：`OpenStreetMap` 和 Esri 地图。现在，让我们尝试另一种底图类型。如图 3-48
  所示，返回“数据”选项卡，选择 Esri 地图，然后点击运行。输出的地图将如图 3-48 所示。


