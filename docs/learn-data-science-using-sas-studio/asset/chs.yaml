- "# DO 循环\n\n`DO` 循环有三种迭代方式：`DO LOOP`、`DO UNTIL` 和 `DO WHILE`。`DO` 循环的基本语法如下：\n\n\
  ```\nDO 索引变量=起始值 to 结束值    ;\nSAS 语句 . . .\nEND;\n```\n\n默认情况下，增量值为 1，但您可以更改它。以下示例仅将从\
  \ 1 到 10 的奇数相加。为了将迭代结果保存到输出数据集中，请使用 `OUTPUT` 语句；该语句会立即保存每个观测值，而不是在数据步结束时保存。参见图 5-4。\n\
  \n![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig4_HTML.jpg](img/501068_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4 – DO 循环输出示例\n\n```\ndata b;\nSUM=0;\nDO ILOOP=1 to 10 by 2;\nSUM=SUM + ILOOP;\n\
  output;* OUTPUT 语句指示 SAS 立即将当前观测值写入 SAS 数据集，而不是在 DATA 步结束时写入;\nEND;\nrun;\n代码清单\
  \ 5-5 – DO 循环示例\n```\n\n`DO UNTIL` 循环会一直迭代，直到 `UNTIL` 子句的条件变为真。`UNTIL` 条件在循环结束时进行评估。让我们使用\
  \ `DO UNTIL` 循环重做前面的示例。请注意，您必须在循环内手动递增计数器；否则会形成无限循环。好消息是，即使您创建了无限循环，也无需担心，因为 SAS\
  \ Studio 不会崩溃。它的执行时间会比正常情况更长，然后会为您生成一个错误。因此，请再次记住，即使收到了结果，检查 SAS 日志也始终是个好习惯。参见代码清单\
  \ 5-6 和图 5-5。\n\n![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig5_HTML.jpg](img/501068_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5 – DO UNTIL 输出示例\n\n```\ndata d;\nSUM=0;\ni=1;\nDO UNTIL (i GT 9);\nSUM=SUM\
  \ + i;\noutput;\ni=i+2;\nEND;\nrun;\n代码清单 5-6 – DO UNTIL 示例\n```\n\n`DO WHILE` 与\
  \ `DO UNTIL` 相反。循环会持续进行，直到 `WHILE` 子句中的条件为假。参见代码清单 5-7 和图 5-6。\n\n![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig6_HTML.jpg](img/501068_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6 – DO WHILE 输出示例\n\n```\ndata e;\nSUM=0;\ni=1;\nDO WHILE(i LT 10);\nSUM=SUM\
  \ + i;\noutput;\ni=i+2;\nEND;\nrun;\n代码清单 5-7 – DO WHILE 示例\n\n最后一种使用 `DO` 循环的方法是，当迭代计数器没有特定模式时，可以对一组项进行循环。我们仍然可以得到与前面示例相同的结果，但这里使用一组数字，而不是使用计数器和增量语句。参见代码清单\
  \ 5-8 和图 5-7。\n\n![../images/501068_1_En_5_Chapter/501068_1_En_5_Fig7_HTML.jpg](img/501068_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7 – 对项集进行 DO 循环的输出\n\n```\ndata f;\nSUM=0;\nDO i=1,3,5,7,9;\nSUM=SUM + i;\n\
  output;\nEND;\nrun;\n代码清单 5-8 – 对项集进行 DO 循环的示例\n```\n\n## 摘要\n\n本章首先介绍了如何在 SAS 程序中添加注释，以及如何使用算术运算符和比较运算符。我们简要介绍了\
  \ `PROC SQL`，并详细讨论了 `SELECT` 语句。`SELECT` 语句与 `WHERE` 和 `WHEN` 语句有多种组合方式。此外，我们还详细讨论了\
  \ SAS 中的循环。这些循环包括 `DO` 循环、`DO UNTIL` 和 `DO WHILE` 循环。在下一章中，我们将学习如何为分析做准备，并学习基本条件语句。\n\
  \n# 6. 准备分析数据\n\n在本章中，我们将继续深入探讨 SAS 编程，仍然重点关注代码而非图形用户界面。正如我们之前提到的，在任何编程语言中，您都会学习数据类型、运算符、`IF`\
  \ 条件和循环。我们在第 2 章和第 5 章中涵盖了所有这些主题，但 `IF` 条件语句除外。在本章中，我们将学习它们以及更高级的数据准备和处理技术。\n\n\
  ## LABEL（标签）\n\n在第 2 章中，我们提到 SAS 程序由两部分组成：数据步和过程步。在前面的章节中，我们尝试了许多过程，例如 `PROC SGPLOT`\
  \ 和 `PROC MEANS`。`LABEL` 语句位于数据步中，而 `LABEL` 选项位于 `PROC PRINT` 中。\n\n分析数据集的第一步是了解您拥有的变量。识别哪些是因变量，哪些是自变量，哪些是数值/连续变量，哪些是字符变量。通常，您的客户会随着包含数据的文件一起，在文本文件中为您提供这些信息。该文本文件称为字典，因为它包含了变量名称及其类型的解释。让我们回顾一下第\
  \ 1 章中的图 1-2，即缅因州务卿办公室发送给我的文件。\n\n数据位于 Excel 工作表中，字典用中间的红色框突出显示。如果没有字典，变量名 `YOB`、`ENROLL`\
  \ 和 `DT Accept` 的含义是模糊的。通过字典，我们理解了每个变量的含义；例如，`YOB` 代表出生年份。\n\n为了将这些解释性名称附加到 SAS\
  \ 中的数据集，我们使用 `LABEL` 语句。数据集位于“Dataset”文件夹中，名称为 `Voter_A.CSV`。从 SAS Studio 上传它，点击刷新，然后导入它，就像我们在第\
  \ 2 章中解释的那样。将数据集的名称从 `IMPORT` 更改为 `Voters`。\n\n此数据集并非真实数据集。我是使用缅因州务卿发送给我的相同变量创建的。但是，此文件不包含真实信息。\n\
  \n导入文件后，我们发现它有 100 行和 9 列，如图 6-1 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig1_HTML.jpg](img/501068_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1 – 导入 Voters_A.CSV\n\n现在，让我们在数据步中编写一个 `LABEL` 语句，并使用 `PROC PRINT` 的 `LABEL`\
  \ 选项，如代码清单 6-1 所示。\n\n```\ndata voters_label;\nset work.voters;\nlabel\nFIRST_NAME='姓名'\n\
  YOB='出生年份'\nENROLL='注册代码'\nDESIGNATE='特殊名称'\nDT_ACCEPT='接受日期（注册日期）'\nCG='国会选区'\n\
  CTY='县 ID'\nDT_CHG='更改日期'\nDT_LAST_VPH='最近一次有选民登记记录的全州选举日期';\nrun;\nproc print label;\n\
  run;\n代码清单 6-1 – LABEL 语句和 LABEL 选项\n```\n\n当您运行代码清单 6-1 时，输出如图 6-2 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig2_HTML.jpg](img/501068_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2 – 使用标签（而非变量名）的输出\n\n图 6-2 显示，报告打印时使用了描述性标签，而不是变量名。因此，它更具可读性。但是，数据明显不整洁。“特殊名称”是一个空白列，其他列中存在缺失值。很可能，数据需要验证其有效性，并确保不包含任何错误信息。在本章后面的章节中，您将学习如何清理此类杂乱数据。\n\
  \n\n\n## 格式\n\n在上一节中，我们了解了`LABEL`语句如何将输出更改为更易读的格式。另一方面，`FORMAT`语句更改的是输入，而非输出。我们在第\
  \ 2 章的“变量类型”一节中提到，默认情况下，字符数据类型的长度为 8 个字符。因此，如果我们使用`INPUT`语句而不是导入 Excel 文件，`FORMAT`语句会覆盖默认的变量格式。此外，`FORMAT`语句可以一次性为多个变量分配相同的格式。\n\
  \n数据集位于“Dataset”文件夹中，文件名为 Voters_A.CSV。从 SAS Studio 上传它并点击“刷新”。不要导入它，因为我们将使用`INPUT`语句，正如我们在第\
  \ 2 章最后一节所解释的那样。\n\n运行代码清单 6-2 并检查输出。在代码清单 6-2 中，我们仍然没有使用`FORMAT`语句。\n\n```\ndata\
  \ voters_format;\ninfile \"/folders/myfolders/SAS4Days/Voters_A.csv\" dlm=',' firstobs=2;\n\
  input NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG $  DT_LAST_VPH\
  \ $;\nrun;\nproc print ;\nrun;\n代码清单 6-2\n使用 INPUT 语句读取 CSV 文件\n```\n\n在代码清单 6-2\
  \ 中，第一行`DATA VOTERS_FORMAT`在 Work 逻辑库中创建了一个名为`VOTERS_FORMAT`的新数据集。第二行中，`INFILE`语句从指定路径读取\
  \ CSV 文件，将分隔符设置为逗号，并告诉 SAS Studio 第一个观测值在 CSV 文件的第二行，因为该文件有标题行。第三行使用`INPUT`语句设置变量的名称及其类型。为了区分字符变量和数值变量，你在字符变量后面放一个美元符号（`$`），这样\
  \ SAS Studio 就能正确读取它们。数据步中的最后一行是结束数据步的`RUN`语句。最后，`PROC PRINT`将数据集打印为可打印的报告。\n\n\
  运行该程序并检查“Name”列。SAS Studio 截断了名称，只读取前八个字符。例如，VOTERS_A.CSV 中的第一个名字是“Eula Vitolo”，而\
  \ SAS Studio 将其截断为“Eula Vit”，如图 6-3 所示。正如我们在第 2 章中所说，SAS Studio 默认只给字符字段分配八个字符。\n\
  \n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig3_HTML.jpg](img/501068_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n名称值被截断为仅八个字符\n\n为了覆盖此规则并解决此问题，我们使用`FORMAT`语句来读取所有字符，如代码清单 6-3 所示。\n\n\
  ```\ndata voters_format;\nFormat Name $21\\. ;\ninfile \"/folders/myfolders/SAS4Days/Voters_A.csv\"\
  \ dlm=',' firstobs=2;\ninput NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG\
  \  CTY $ DT_CHG $  DT_LAST_VPH $;\nrun;\nproc print ;\nrun;\n代码清单 6-3\nFORMAT 语句\n\
  ```\n\n执行代码清单 6-3 后，名称将完整显示，如图 6-4 所示。`FORMAT`语句通过使用`$`符号指定`NAME`变量为字符类型，字符个数为 21。请记住在末尾加上句点（`$21.`），这样\
  \ SAS Studio 才能正确读取这些值。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig4_HTML.jpg](img/501068_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n现在名称是完整的\n\n## 创建新变量\n\n在 SAS 中，你不需要像在其他某些语言中那样事先定义新变量或设置其数据类型。你只需放入新变量的名称及其值即可。就是这样。SAS\
  \ 能够自行识别新变量的数据类型。\n\n在此示例中，让我们继续使用前面章节的数据集 Voters_A.CSV。该数据集中有一个名为`YOB`的变量，代表出生年份。我们将要创建的新变量是选民的年龄。\n\
  \n如代码清单 6-4 所示，年龄等于当前年份与出生年份之差。年龄定义为`age=2020-YOB`。我们在数据步中定义它。\n\n```\ndata voters_format;\n\
  Format Name $21\\. ;\ninfile \"/folders/myfolders/SAS4Days/Voters_A.csv\" dlm=','\
  \ firstobs=2;\ninput NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG\
  \ $  DT_LAST_VPH $;\n*创建年龄作为一个新变量;\nage=2020-YOB;\nrun;\nproc print ;\nrun;\n代码清单\
  \ 6-4\n创建新变量\n```\n\n执行代码清单 6-4 后，输出中附加了一个新变量，如图 6-5 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig5_HTML.jpg](img/501068_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5\n\n代码清单 6-4 的输出\n\n向下滚动一点并检查年龄。有一位选民显示为 340 岁，如图 6-6 所示。很可能这个值是错误的。我们将在本章后面了解如何使用`IF`语句解决这个问题。\n\
  \n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig6_HTML.jpg](img/501068_1_En_6_Fig6_HTML.jpg)\n\
  \n图 6-6\n\n检查年龄值中的错误值\n\n## 重新排列数据集变量\n\n在清理数据之前，你可能希望重新排序数据集中的变量；例如，重新排列变量，使年龄变量直接位于`YOB`旁边。我们使用`RETAIN`和`SET`语句来实现这一点。\n\
  \n但是，这必须在新的数据步中完成，如代码清单 6-5 所示。本章后面，我们将进一步了解`SET`语句。\n\n```\ndata voters_format;\n\
  Format Name $21\\. ;\ninfile \"/folders/myfolders/SAS4Days/Voters_A.csv\" dlm=','\
  \ firstobs=2;\ninput NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG\
  \ $  DT_LAST_VPH $;\n*创建年龄作为一个新变量;\nage=2020-YOB;\nrun;\ndata voters_retain;\nretain\
  \ NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG  DT_LAST_VPH;\nset voters_format;\n\
  run;\nproc print data=voters_retain;\nrun;\n代码清单 6-5\nRETAIN 语句\n```\n\n执行代码清单 6-5\
  \ 后，年龄现在位于`YOB`之后，如图 6-7 所示。如果出现错误，请检查`INFILE`语句中的文件路径。将其更改为文件在您机器上的实际位置。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig7_HTML.jpg](img/501068_1_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7\n\n重新排序变量使年龄位于 YOB 之后后的选民数据集\n\n还有其他方法可以重新排序数据集中的变量。您可以通过此链接查看：\n\n[`http://support.sas.com/kb/8/395.html`](http://support.sas.com/kb/8/395.html)\n\
  \n## IF 语句\n\n现在，这是数据清理的关键部分——`IF`语句。使用`IF`语句有三种形式：\n\n1.  `IF`（条件）不带`THEN`语句\n\n\
  2.  `IF-THEN`语句\n\n3.  `IF-THEN-ELSE`语句\n\n\n\n### 不带 THEN 语句的 IF（条件）\n\n`IF`语句在没有`THEN`语句的情况下用于对数据集进行子集选择。在此示例中，我们继续使用前几节的数据集`Voters_A.CSV`。我们希望创建两个新数据集作为原始数据的子集，其中第一个数据集仅包含登记为民主党的选民，另一个数据集包含登记为共和党的选民。我们使用`IF`语句并检查`ENROLL`变量值，如代码清单\
  \ 6-6 所示。\n\n使用`SET`语句将旧数据集复制到新数据集。通常最好创建数据集的新副本，并在新数据集上执行所有分析，同时保留原始数据不变。这是一个良好的实践，尤其适用于使用政府、联合国或银行提供的数据集的情况。\n\
  \n```\ndata voters_enroll;\nFormat Name $21\\. ;\ninfile \"/folders/myfolders/sasuser.v94/Voters_A.csv\"\
  \ dlm=',' firstobs=2;\ninput NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG\
  \  CTY $ DT_CHG $  DT_LAST_VPH $;\nrun;\ndata voters_democrat;\nset voters_enroll;\n\
  if enroll=\"D\";\nrun;\ndata voters_republican;\nset voters_enroll;\nif enroll=\"\
  R\";\nrun;\nproc print data=voters_enroll (obs=3);\nrun;\nproc print data=voters_democrat\
  \ (obs=3);\nrun;\nproc print data=voters_republican (obs=3);\nrun;\n代码清单 6-6\nIF（条件）语句示例\n\
  ```\n\n运行代码清单 6-6 后，我们得到三个数据集。`Voters_Enroll`包含所有政党，`Voters_Democrats`仅包含民主党选民，`Voters_Republicans`仅包含共和党选民。我们需要三个数据步骤，每个数据集对应一个；同样，我们需要三个`PROC\
  \ PRINT`。如果出现错误，请检查`INFILE`语句中的文件路径。将其更改为文件在您机器上的实际位置。\n\n为了不打印数据集中的所有行，我们在`PROC\
  \ PRINT`中添加了`(OBS=3)`选项，以仅从每个数据集中打印三行。单击“Results”选项卡查看三个报告，如图 6-8 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig8_HTML.jpg](img/501068_1_En_6_Fig8_HTML.jpg)\n\
  \n**图 6-8** 子集选择后打印三行\n\n单击“Output Data”选项卡，从下拉菜单中选择表格，如图 6-9 所示。`WORK.VOTERS_ENROLL`包含所有政党，共有\
  \ 100 行。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig9_HTML.jpg](img/501068_1_En_6_Fig9_HTML.jpg)\n\
  \n**图 6-9** 从下拉菜单中选择输出表格\n\n选择`WORK.VOTERS_DEMOCRAT`表格，该表格仅有 24 行，如图 6-10 所示。\n\n\
  ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig10_HTML.jpg](img/501068_1_En_6_Fig10_HTML.jpg)\n\
  \n**图 6-10** 民主党表格\n\n选择`WORK.VOTERS_REPUBLICAN`表格，该表格仅有 24 行，如图 6-11 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig11_HTML.jpg](img/501068_1_En_6_Fig11_HTML.jpg)\n\
  \n**图 6-11** 共和党表格\n\n要了解表格中剩余的其他政党、每党行数及占比，请运行单向频率分析，如图 6-12 所示。请查阅政党代码字典：\n\n\
  ![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig12_HTML.jpg](img/501068_1_En_6_Fig12_HTML.jpg)\n\
  \n**图 6-12** 单向频率分析输出\n\n```\nA      AMERICANS ELECT\nD      DEMOCRATIC\nG     \
  \ GREEN INDEPENDENT\nL      LIBERTARIAN\nO      OTHER QUALIFYING PARTY\nR      REPUBLICAN\n\
  U      UNENROLLED\nX      INELIGIBLE\n```\n\n### IF-THEN 语句\n\n如前所述，“Age”列中有一位选民的年龄存在明显错误值（340\
  \ 岁）。要修正此问题，如果数据集是真实的，我们会有以下几种选择：\n\n1.  通过联系缅因州州务卿办公室或联系该选民来获取正确的年龄。\n2.  移除该值，并用点号（`.`）代替以表示缺失数据，如第\
  \ 5 章所述。SAS 中缺失数据的惯例是：数值型缺失值用点号表示，字符型缺失值用空白表示。\n3.  另一种解决方案是删除整行。\n4.  保留该值。但是，该值将成为一个异常值，并影响分析（例如分析年龄、政党和预期投票率之间的关系）。\n\
  \n在本例中，我们将该值视为缺失值。为此，我们使用`IF-THEN`语句，如代码清单 6-7 所示。\n\n```\ndata voters_format;\n\
  Format Name $21\\. ;\ninfile \"/folders/myfolders/sasuser.v94/Voters_A.csv\" dlm=','\
  \ firstobs=2;\ninput NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG\
  \ $  DT_LAST_VPH $;\n*creating age as a new variable;\nage=2020-YOB;\nrun;\ndata\
  \ voters_retain;\nretain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG\
  \  DT_LAST_VPH;\nset voters_format;\n*T clean this outlier, we mark it as a missing\
  \ data;\nif age= 340 then age=.;\nrun;\nproc print data=voters_retain;\nrun;\n代码清单\
  \ 6-7\nIF-THEN 语句示例\n```\n\n运行代码清单 6-7 后，该值将变为缺失值，如图 6-13 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig13_HTML.jpg](img/501068_1_En_6_Fig13_HTML.jpg)\n\
  \n**图 6-13** 将错误值设为缺失值\n\n另一种解决方案是使用`DELETE`语句删除整行，如代码清单 6-8 所示。\n\n```\ndata voters_format;\n\
  Format Name $21\\. ;\ninfile \"/folders/myfolders/sasuser.v94/Voters_A.csv\" dlm=','\
  \ firstobs=2;\ninput NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG\
  \ $  DT_LAST_VPH $;\n*creating age as a new variable;\nage=2020-YOB;\nrun;\ndata\
  \ voters_retain;\nretain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG\
  \  DT_LAST_VPH;\nset voters_format;\n*Delete the whole row;\nif age= 340 then Delete;\n\
  run;\nproc print data=voters_retain;\nrun;\n代码清单 6-8\n删除年龄错误值的整行\n```\n\n运行代码清单\
  \ 6-8 后，整行被删除，如图 6-14 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig14_HTML.jpg](img/501068_1_En_6_Fig14_HTML.jpg)\n\
  \n**图 6-14** 该行已被删除\n\n为了进一步验证，比较新数据集`WORK.VOTERS_RETAIN`和原始数据集`WORK.VOTERS_FORMAT`中的行数。在图\
  \ 6-15 中，行数为 99，而原始数据集的行数为 100，如图 6-16 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig16_HTML.jpg](img/501068_1_En_6_Fig16_HTML.jpg)\n\
  \n**图 6-16** 包含 100 行的原始数据集\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig15_HTML.jpg](img/501068_1_En_6_Fig15_HTML.jpg)\n\
  \n**图 6-15** 删除行后的新数据集\n\n\n\n### IF-THEN-ELSE 语句\n\n现在，让我们通过计算以下年龄组中的选民人数来进行分析：18–24\
  \ 岁、25–29 岁、30–39 岁、40–49 岁、50–64 岁和 65 岁以上，如 6-9 所示。\n\n```\ndata voters_format;\n\
  Format Name $21\\. ;\ninfile \"/folders/myfolders/SAS4Days/Voters_A.csv\" dlm=','\
  \ firstobs=2;\ninput NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG  CTY $ DT_CHG\
  \ $  DT_LAST_VPH $;\n*creating age as a new variable;\nage=2020-YOB;\nrun;\ndata\
  \ voters_retain;\nretain NAME YOB age ENROLL DESIGNATE DT_ACCEPT  CG  CTY DT_CHG\
  \  DT_LAST_VPH;\nset voters_format;\nif age= 340 then Delete;\nif (age>=18 and age=25\
  \ and age=30 and age=40 and age=50 and age=65) then age_group='65+';\nrun;\nproc\
  \ print data=voters_retain ;\nrun;\nListing 6-9\nIF-THEN-ELSE 语句示例\n```\n\n运行 6-9\
  \ 后，输出结果如图 6-17 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig17_HTML.jpg](img/501068_1_En_6_Fig17_HTML.jpg)\n\
  \n图 6-17\n\n添加 `AGE_GROUP` 变量\n\n要获取每个年龄组的计数及其百分比，请对 `AGE_GROUP` 变量运行单变量频率统计，如图\
  \ 6-18 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig18_HTML.jpg](img/501068_1_En_6_Fig18_HTML.jpg)\n\
  \n图 6-18\n\n对 `AGE_GROUP` 变量进行单变量频率统计\n\n在 SAS 中还有其他创建 `AGE_GROUP` 的方法。您可以通过以下链接了解更多信息：[`https://stackoverflow.com/questions/53395384/creating-an-agegroup-variable-in-sas`](https://stackoverflow.com/questions/53395384/creating-an-agegroup-variable-in-sas)。\n\
  \n## DROP 语句\n\n`DROP` 语句用于指定从数据集中排除某些变量。在 `Voters_A.csv` 数据集中，我们有一个“Designate”列。该列完全为空。在数据清洗过程中，我们应该删除这一列；换句话说，就是丢弃它，如\
  \ 6-10 所示。\n\n```\ndata voters_format;\nFormat Name $21\\. ;\ninfile \"/folders/myfolders/SAS4Days/Voters_A.csv\"\
  \ dlm=',' firstobs=2;\ninput NAME $ YOB $  ENROLL $ DESIGNATE $ DT_ACCEPT $  CG\
  \  CTY $ DT_CHG $  DT_LAST_VPH $;\ndrop designate;\nrun;\nproc print ;\nrun;\nListing\
  \ 6-10\nDROP 语句示例\n```\n\n运行 6-10 后，输出结果将只剩下八个列，如图 6-19 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig19_HTML.jpg](img/501068_1_En_6_Fig19_HTML.jpg)\n\
  \n图 6-19\n\n删除一列后剩余八个列\n\n## SET 语句\n\n在前面的示例中，我们一直在使用 `SET` 语句，但没有详细讨论它。到目前为止，我们了解到我们使用\
  \ `SET` 语句将一个旧数据集复制到一个新数据集。因此，我们所有的处理都在新数据集上执行，而旧数据集保持不变。`SET` 语句具有多种功能。该网站为每个函数提供了许多示例：\n\
  \n[`https://documentation.sas.com/?docsetId=lestmtsref&docsetTarget=p00hxg3x8lwivcn1f0e9axziw57y.htm&docsetVersion=3.1&locale=en`](https://documentation.sas.com/%253FdocsetId%253Dlestmtsref%2526docsetTarget%253Dp00hxg3x8lwivcn1f0e9axziw57y.htm%2526docsetVersion%253D3.1%2526locale%253Den)\n\
  \n然而，在本节中，我们专注于将两个数据集追加到一个新的更大的数据集中。简单来说，其语法是：`SET <数据集 1> <数据集 2> <数据集 3> ...`。\n\
  \n请注意，所有数据集名称之间用空格分隔。\n\n我们已经在 6-6 中看到了如何将旧数据集复制到新数据集。在这个例子中，让我们执行相反的过程。假设我们有两个数据集，分别是民主党数据集和共和党数据集，并希望将它们合并为一个。\n\
  \n首先重新运行 6-6，以便将两个数据集加载到 `Work` 库中。然后，运行 6-11，该代码将合并这两个数据集。\n\n```\ndata all;\n\
  set voters_democrats voters_republicans;\nrun;\nproc print data=all;\nrun;\nListing\
  \ 6-11\n追加两个数据集\n```\n\n运行 6-11 后，数据集 `WORK.ALL` 将有 48 行，因为 `WORK.VOTERS_DEMOCRATS`\
  \ 和 `WORK.VOTERS_REPUBLICANS` 各有 24 行。输出结果如图 6-20 所示。\n\n![../images/501068_1_En_6_Chapter/501068_1_En_6_Fig20_HTML.jpg](img/501068_1_En_6_Fig20_HTML.jpg)\n\
  \n图 6-20\n\n追加民主党与共和党数据集\n\n## 总结\n\n本章解释了为分析而清洗和准备数据的步骤。它讨论了 `LABEL` 和 `FORMAT`\
  \ 语句。它还解释了如何创建新变量以及如何重新排列数据集中的变量。它解释了 `IF`、`IF-THEN` 和 `IF-THEN-ELSE` 语句。最后，它解释了\
  \ `DROP` 和 `SET` 语句。至此，我们完成了最常见的数据分析任务，下一章将介绍如何使用回归预测未来。\n\n# 第三部分：高级主题\n\n# 7. 回归\n\
  \n线性回归任务拟合一个线性模型，以根据一个或多个连续或分类预测变量来预测单个连续因变量。该任务会生成用于解释结果的统计量和图形。\n\n\n\n# 简单线性回归\n\
  \n在简单线性回归中，模型中只有一个自变量。其直线方程如下：\n\n*   `Y = a + bX`\n\n其中，`Y`是我们想要预测其值的因变量，`a`是截距，`b`是系数，`X`是自变量。此处忽略误差。\n\
  \n原假设是变量之间不存在线性关系。换句话说，`b`的值为零。备择假设是存在线性关系，且`b`不等于零。\n\n```\nH0: b = 0\nHa: b ^=\
  \ 0\n```\n\n让我们看看每桶石油价格与黄金价格之间是否存在线性关系。\n\n数据集位于`Dataset`文件夹中，文件名为`sp_oil_gold.xlsx`。从\
  \ SAS Studio 中，上传该文件并点击刷新，然后按照第 2 章所述将其导入。将数据集名称从`IMPORT`更改为`sp_oil_gold`。\n\n这些数据的来源如下：\n\
  \n*   [`https://www.thebalance.com/presidential-elections-and-stock-market-returns-2388526`](https://www.thebalance.com/presidential-elections-and-stock-market-returns-2388526)\n\
  *   [`https://www.statista.com/statistics/262858/change-in-opec-crude-oil-prices-since-1960/`](https://www.statista.com/statistics/262858/change-in-opec-crude-oil-prices-since-1960/)\n\
  *   [`https://www.statista.com/statistics/268027/change-in-gold-price-since-1990/`](https://www.statista.com/statistics/268027/change-in-gold-price-since-1990/)\n\
  *   [`https://www.nma.org/pdf/gold/his_gold_prices.pdf`](https://www.nma.org/pdf/gold/his_gold_prices.pdf)\n\
  *   [`https://nma.org/wp-content/uploads/2018/02/his_gold_prices_1833_pres_2018.pdf`](https://nma.org/wp-content/uploads/2018/02/his_gold_prices_1833_pres_2018.pdf)\n\
  \n点击 任务和实用程序 ➤ 任务 ➤ 线性模型 ➤ 线性回归。在“数据”中，选择`WORK.SP_OIL_GOLD`。在“因变量”中，选择`oil_price`。在“连续变量”中，选择`gold_prices`，如图\
  \ 7-1 所示。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig1_HTML.jpg](img/501068_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1 简单线性回归\n\n点击“模型”选项卡，然后点击“编辑”，如图 7-2 所示。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig2_HTML.jpg](img/501068_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2 “模型”选项卡\n\n选择`gold_prices`并点击“添加”，然后向下滚动并点击“确定”，如图 7-3 所示。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig3_HTML.jpg](img/501068_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3 “模型效应生成器”\n\n点击“运行”。输出结果如图 7-4 所示。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig4_HTML.jpg](img/501068_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4 输出结果\n\n图 7-4 显示 p 值为 < 0.0001，这意味着我们有足够的证据拒绝原假设，并且石油与黄金价格之间存在线性关系。R 平方值代表这种关系的强度。直线的斜率\
  \ = 0.05965。根据参数估计，直线方程为：\n\n```\noil_price = 1.98831 + 0.05965 gold_prices\n```\n\
  \n图 7-5 展示了`oil_price`变量的拟合诊断图。残差图显示点在 0 线上方和下方呈现随机分布模式，这表明模型是合适的。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig5_HTML.jpg](img/501068_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5 拟合诊断图\n\n学生化残差对预测值图显示有几个点位于 ±2 限值之外。第三个点位于两条线之间，但远离其余的点。\n\n学生化残差对杠杆图显示了那些对回归系数计算具有杠杆作用的异常值。\n\
  \n残差对四分位数图再次显示了这三个点。\n\n因变量（TASK）对预测值图展示了预测值的变异性。在此图中，点分布是随机的，没有指示误差具有恒定方差的模式。\n\
  \nCook's D 图旨在识别异常值。此处，这三个点及其数值非常清晰。\n\n最后，图 7-6 中的拟合图由数据散点图与回归线以及 95% 置信限和预测限叠加而成。同样，这三个异常值点清晰可见。\n\
  \n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig6_HTML.jpg](img/501068_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6 拟合图\n\n\n\n# 多元线性回归\n\n在多元线性回归中，模型包含多个自变量。其线性方程如下：\n\n* `Y = a + b[1] X[1]\
  \ + b[2] X[2] + … + b[i] X[i]`\n\n其中，`Y` 是我们想要预测其值的因变量，`a` 是截距，`b[i]` 是系数，`X[i]`\
  \ 是自变量。此处忽略误差项。\n\n原假设为因变量与任一自变量之间不存在线性关系。换句话说，`b[i]` 的值均为零。备择假设为存在线性关系，且至少有一个 `b[i]`\
  \ 不等于零。\n\n* H0: `b[i] = 0`\n* Ha: `b[i] != 0`\n\n让我们看看在总统选举年，股票市场表现指数（标普指数）与每桶石油价格和黄金价格之间是否存在线性关系。\n\
  \n我们将使用与之前简单线性回归示例相同的数据集。该数据集位于 \"Dataset\" 文件夹中，文件名为 `sp_oil_gold.xlsx`。从 SAS Studio\
  \ 上传该文件，点击“刷新”，然后按照我们在第 2 章中的说明进行导入。将数据集名称从 `IMPORT` 更改为 `sp_oil_gold`。\n\n首先，让我们探索这三个变量。运行位于\
  \ \"Example Code\" 文件夹中 `Listing 7-1.sas` 文件内的代码。清单 7-1 显示了三个垂直条形图，分别展示了历年（从 1960\
  \ 年到 2016 年）石油、黄金和股票的价格，每个图对应一个变量。这些年份均为总统选举年。\n\n```\nods graphics / reset width=6.4in\
  \ height=4.8in imagemap;\nproc sgplot data=  WORK.SP_OIL_GOLD noautolegend ;\n/*此垂直条形图将展示历年的股票市场表现*/\n\
  vbar Year / response=Stock_Market_Returns  group=Stock_Market_Returns groupdisplay=cluster\
  \  datalabel;\nyaxis grid;\nrun;\nods graphics / reset;\nods graphics / reset width=6.4in\
  \ height=4.8in imagemap;\nproc sgplot data=  WORK.SP_OIL_GOLD noautolegend;\n/*此垂直条形图将展示历年的石油价格*/\n\
  vbar Year / response=oil_price group=oil_price groupdisplay=cluster datalabel;\n\
  yaxis grid;\nrun;\nods graphics / reset;\nods graphics / reset width=6.4in height=4.8in\
  \ imagemap;\nproc sgplot data=  WORK.SP_OIL_GOLD noautolegend ;\n/*此垂直条形图将展示历年的黄金价格*/\n\
  vbar Year / response=gold_prices group=gold_prices groupdisplay=cluster\ndatalabel;\n\
  yaxis grid;\nrun;\nods graphics / reset;\n清单 7-1\n探索股票、石油和黄金价格\n```\n\n输出结果将如图 7-7、7-8\
  \ 和 7-9 所示。2008 年的金融危机在所有图表中都很明显。这场危机是自 1929 年大萧条以来美国最严重的经济灾难。石油和黄金价格在 2012 年飙升。\n\
  \n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig9_HTML.jpg](img/501068_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9 探索黄金价格\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig8_HTML.jpg](img/501068_1_En_7_Fig8_HTML.jpg)\n\
  \n图 7-8 探索石油价格\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig7_HTML.jpg](img/501068_1_En_7_Fig7_HTML.jpg)\n\
  \n图 7-7 探索标普指数\n\n现在，让我们检查股票收益率与石油和黄金价格之间是否存在线性关系。点击“任务和实用程序” ➤ “任务” ➤ “线性模型” ➤\
  \ “线性回归”。在“数据”中，选择 `WORK.SP_OIL_GOLD`。在“因变量”中，选择 `oil_price`。在“连续变量”中，选择 `gold_prices`，如图\
  \ 7-10 所示。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig10_HTML.jpg](img/501068_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10 多元线性回归\n\n点击“模型”选项卡，然后点击“编辑”，如图 7-11 所示。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig11_HTML.jpg](img/501068_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11 模型选项卡\n\n点击“运行”。输出结果如图 7-12 所示。图 7-12 显示 p 值 < 0.05，这意味着我们有足够的证据拒绝原假设，并且股票收益率与石油和黄金价格之间存在线性关系。R\
  \ 方值表示这种关系的强度。根据参数估计，线性方程如下：\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig12_HTML.jpg](img/501068_1_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12 输出结果\n\n```\nstock_market_returns  = 0.13010 - 0.00671 oil_price + 0.00036367\
  \ gold_prices\n```\n\n图 7-13 显示了 `oil_price` 的拟合诊断图。残差图显示点随机分布在 0 线上方和下方，这表明模型是合适的。\n\
  \n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig13_HTML.jpg](img/501068_1_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13 拟合诊断图\n\nRStudent 与预测值关系图显示有几个点落在 ±2 限值之外。\n\nRStudent 与杠杆关系图显示了那些对回归系数计算具有杠杆作用的异常值。\n\
  \n分位数残差图再次显示出那三个点。点几乎都在对角线上。\n\n因变量（任务）与预测值关系图可视化了预测中的变异性。在此图中，点随机分布，没有显示出误差方差恒定模式的迹象。\n\
  \nCook's D 图旨在识别异常值。此处，这三个点及其数值非常清晰。\n\n百分比残差图显示了一条正态分布曲线。\n\n\n\n# 逻辑回归\n\n逻辑回归与线性回归类似，不同之处在于因变量是二元值而非连续值。该模型方程用于检验因变量中某个离散二元值发生的概率。\n\
  \n二元逻辑回归模型方程如下：\n\n*   `p = e^(b[0] + b[1]*X[1] + b[2]*X[2] + ...) / (1 + e^(b[0]\
  \ + b[1]*X[1] + b[2]*X[2] + ...))`\n\n同样，零假设认为变量之间不存在关系，因此所有系数均为零。备择假设则认为因变量与自变量之间存在关系。\n\
  \n在本例中，我们使用泰坦尼克号数据集，以年龄和乘客等级作为自变量，探究其与乘客幸存情况之间是否存在关系。\n\n该数据集位于 `Dataset` 文件夹中，文件名为\
  \ `logistic_titanic_passengers.csv`，你也可以通过以下链接从 `OpenDataSoft.com` 下载该 CSV 文件：[`https://public.opendatasoft.com/explore/dataset/titanic-passengers/export/`](https://public.opendatasoft.com/explore/dataset/titanic-passengers/export/)。\n\
  \n在 SAS Studio 中，上传文件并点击 `Refresh`，然后按照第二章中介绍的方法将其导入。将数据集的名称从 `IMPORT` 更改为 `TITANIC`。\n\
  \n依次点击 `Tasks and Utilities ➤ Tasks ➤ Linear Models ➤ Binary Logistic Regression`。在\
  \ `Data` 中，选择 `WORK.TITANIC`。在 `Response variable` 中，选择 `Survived`。对于 `Event of\
  \ Interest`，选择 `Yes` 以查看幸存人员的概率，而非遇难人员的概率。在 `Explanatory variables` 中，为 `Continuous`\
  \ 变量选择 `Age` 和 `Pclass`，如图 7-14 所示。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig14_HTML.jpg](img/501068_1_En_7_Fig14_HTML.jpg)\n\
  \n图 7-14 二元逻辑回归\n\n点击 `Model` 选项卡，选择 `Custom Model`，然后点击 `Edit`，如图 7-15 所示。\n\n\
  ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig15_HTML.jpg](img/501068_1_En_7_Fig15_HTML.jpg)\n\
  \n图 7-15 Model 选项卡\n\n选择 `Age` 和 `Pclass`，点击 `Add`，然后向下滚动并点击 `OK`，如图 7-16 所示。\n\n\
  ![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig16_HTML.jpg](img/501068_1_En_7_Fig16_HTML.jpg)\n\
  \n图 7-16 模型效果构建器\n\n点击 `Run`。输出结果如图 7-17 所示。\n\n![../images/501068_1_En_7_Chapter/501068_1_En_7_Fig17_HTML.jpg](img/501068_1_En_7_Fig17_HTML.jpg)\n\
  \n图 7-17 输出结果\n\n图 7-17 显示所有检验的 p 值均 < 0.0001，这意味着我们有足够的证据拒绝零假设，即乘客的幸存情况与其年龄和社会阶层之间存在关系。截距为\
  \ 3.6，Age 的系数为 -0.042，Pclass 的系数为 -1.24。\n\n## 本章小结\n\n本章讲解了简单线性回归、多元线性回归和逻辑回归。详细介绍了诊断矩阵图及其各自含义。此外，还展示了如何轻松识别诊断图中的多个异常点。在下一章中，我们将介绍当前市场上最流行的\
  \ SAS 产品——SAS Viya。SAS Viya 是一个一体化产品，因此也包含 SAS Studio。我们将介绍一些 SAS Studio 免费版中不具备、但集成在\
  \ SAS Viya 中的 SAS Studio 所独有的增值功能和选项。此外，我们还将使用 SAS Visual Analytics 创建一个报告。\n\n\
  # 8. SAS Visual Statistics: Viya\n\nSAS Studio 的免费版本并未包含所有可用功能。因此，在本章中，我们将了解 SAS\
  \ Viya 中提供的一些高级功能。SAS Viya 是 SAS 最受欢迎的产品之一，其平台也包含了 SAS Studio。\n\n## 关于 SAS Studio、SAS\
  \ Visual Statistics、SAS Visual Analytics 和 SAS Viya\n\n名称太多了，你可能会混淆各自的功能，对吧？\n\n\
  SAS Visual Statistics 是 SAS Visual Analytics 的一个附加组件，而 SAS Visual Analytics 是建立在\
  \ Viya 平台之上的产品。因此，它们是一个层层堆叠的技术栈。\n\nSAS Visual Analytics 使您能够探索数据、应用预测分析并构建交互式报告。SAS\
  \ Visual Statistics 则通过基于 SAS Visual Analytics 中发现的模式来创建、测试和比较模型，从而扩展了这些功能。\n\n\
  SAS Viya 是一款基于云的产品。我认为它秉承了为所有用户提供一站式解决方案的理念。无论是数据科学家、业务分析师、应用程序开发人员还是高管，任何人都可以使用其点击式界面。SAS\
  \ Viya 的编程界面是 SAS Studio。然而，SAS Viya 也可以运行来自其他编程语言的代码，例如 Python、R 和 Java。\n\n在 Viya\
  \ 平台上构建了多个产品：SAS Visual Analytics、SAS Visual Statistics、SAS Visual Investigator\
  \ 以及 SAS Visual Data Mining and Machine Learning。\n\n如果你订阅并尝试使用其中任何一个产品，你都将可以访问其余产品，因为它们都集成在\
  \ SAS Viya 平台中。但是，在本章中，我们将只关注 SAS Visual Statistics。\n\n如果你想了解更多关于 SAS Viya 的信息，请观看其全景介绍视频，网址如下：\n\
  \n[`https://video.sas.com/detail/videos/sas-viya_/video/4911667600001/sas%C2%AE-viya%E2%84%A2:-the-big-picture`](https://video.sas.com/detail/videos/sas-viya_/video/4911667600001/sas\\\
  C2\\AE-viya\\E2\\84\\A2:-the-big-picture)\n\n如果你想观看关于 SAS Visual Statistics 的简短介绍视频，请查看以下网址：\n\
  \n[`https://players.brightcove.net/1872491364001/default_default/index.html?videoId=5772778452001`](https://players.brightcove.net/1872491364001/default_default/index.html\\\
  videoId=5772778452001)\n\n要免费试用 SAS Visual Analytics 和 SAS Visual Statistics 十四天（如有需要可延期），请填写此表单：\n\
  \n[`https://www.sas.com/en_us/trials/software/visual-analytics-visual-statistics/form.html`](https://www.sas.com/en_us/trials/software/visual-analytics-visual-statistics/form.html)\n\
  \n你将收到一封包含说明和门户链接的电子邮件。由于 SAS Viya 是基于云计算的平台，因此完全无需安装。在 SAS Viya 上，可以选择延长试用期。\n\n\
  \n\n# SAS Viya 导览\n\n登录 Viya 上的 Visual Statistics 账户后，您将看到一个界面，如图 8-1 所示。该界面分为三个窗格。左侧的**内容**窗格允许您处理数据并选择模型对象类型。中间的**画布**是您构建模型的地方。右侧的**属性**窗格允许您设置模型角色、选项和过滤器。\n\
  \n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig1_HTML.jpg](img/501068_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1 Visual Statistics 界面\n\n在本章稍后部分，我们将更详细地讨论 SAS Visual Statistics。现在，让我们看看\
  \ SAS Viya 中与 SAS Visual Statistics 一起提供的其他产品。点击左上角的三条横线以显示应用程序菜单，如图 8-2 所示。\n\n\
  ![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig2_HTML.jpg](img/501068_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2 点击三条横线以显示应用程序菜单\n\n点击后，所有可用的应用程序将会显示，如图 8-3 所示。在下一节中，我们将通过点击“Develop SAS\
  \ Code”在 Viya 平台上使用 SAS Studio。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig3_HTML.jpg](img/501068_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3 SAS Viya 应用程序\n\n# 县地图\n\n我们将使用 SAS Viya 上的 SAS Studio，通过 `PROC GMAP` 创建一个州内选定县的地图。\n\
  \n我们修改了以下 URL 中列出的示例代码，以可视化缅因州的民主党和共和党县：\n\n[`http://support.sas.com/kb/24/898.html`](http://support.sas.com/kb/24/898.html)\n\
  \n根据以下 URL，缅因州的 FIPS 代码在 SAS 中为 23：\n\n[`https://documentation.sas.com/?cdcId=sasstudiocdc&cdcVersion=5.1&docsetId=grmapref&docsetVersion=9.4_01&docsetTarget=n1w5dpp87y5qxon1vxqh3bs4m444.htm&locale=en&activeCdc=pgmsascdc`](https://documentation.sas.com/%253FcdcId%253Dsasstudiocdc%2526cdcVersion%253D5.1%2526docsetId%253Dgrmapref%2526docsetVersion%253D9.4_01%2526docsetTarget%253Dn1w5dpp87y5qxon1vxqh3bs4m444.htm%2526locale%253Den%2526activeCdc%253Dpgmsascdc)\n\
  \nFIPS 代表联邦信息处理标准（Federal Information Processing Standards）。以下是缅因州各县的 FIPS 代码：[`https://en.wikipedia.org/wiki/List_of_counties_in_Maine`](https://en.wikipedia.org/wiki/List_of_counties_in_Maine)\n\
  \n```\n* Political Parties Illustrated on Maine’s Counties for 2016 Presidential\
  \ Elections;\n/* Set the graphics environment */\ngoptions reset=all cback=white\
  \ border htitle=12pt htext=10pt;\n/* Create a sample data set */\ndata voters;\n\
  /* input the FIPS values of the state and the counties, then the number of voters\
  \ who voted for the democratic candidate and the number of voters who voted republican\
  \ */\ninput State County Republican Democrat;\n/*if the county’s number of democratic\
  \ voters are higher than the republicans then mark this county’s party as 1 and\
  \ 2 if republicans are higher*/\nif democrat > republican then party=1;\nelse if\
  \ democrat< republican then party=2;\n/*actual data values*/\ndatalines;\n23 1 28189\
  \ 22975\n23 3 19419 13377\n23 5 57697 102935\n23 7 7900 7001\n23 9 13682 16107\n\
  23 11 29296 31753\n23 13 9148 12440\n23 15 9727 10241\n23 17 12172 16214\n23 19\
  \ 41601 32832\n23 21 5403 3098\n23 23 9304 10679\n23 25 14998 9092\n23 27 10378\
  \ 10442\n23 29 9037 6358\n23 31 50388 55828\n;\nrun;\n/* Project the map coordinates\
  \ and create a new map data set */\nproc gproject data=maps.counties out=newmap;\n\
  where state=23 ;\nid state county;\nrun;\n/*the value pattern is solid and the color\
  \ is blue or red*/\npattern1 v=s c=blue;\npattern2 v=M3X0 c=red;\n/* Generate the\
  \ map */\nproc gmap data=voters map=newmap all;\nid state county;\nchoro party /\
  \ nolegend ;\ntitle \"Political Parties Illustrated on Maine’s Counties for 2016\
  \ Presidential Election\";\nrun;\nquit;\n```\n\n程序清单 8-1 2016 年总统选举中缅因州各县的政党分布\n\
  \n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig4_HTML.jpg](img/501068_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4 2016 年总统选举中缅因州各县的政党分布\n\n程序清单 8-1 首先创建了一个名为 `voters` 的新数据集，该数据集包含四列：`state`、`county`、`democrat`\
  \ 和 `republican`。第一列 `state` 是州级 FIPS 代码，值为 23，表示缅因州。第二列 `county` 是县级 FIPS 代码。第三列\
  \ `democrat` 是投票给民主党候选人的选民数量，最后一列 `republican` 是投票给共和党候选人的选民数量。\n\n然后，代码比较了民主党与共和党的选民数量。如果民主党数量更多，则该县的政党标记为\
  \ 1，否则标记为 2。代码使用这些数字为县着色。`datalines` 部分包含填充数据集的实际值。\n\n新的部分使用 `PROC GPROJECT` 通过利用\
  \ FIPS 值投影出一个仅包含缅因州及其各县的新地图。\n\n接着，代码设置了两类填充图案（图 8-4）。第一种用于 `party=1`，是代表民主党的纯蓝色；第二种是\
  \ `M3X0`，即交叉影线，红色用于表示 `party=2` 的共和党。您可以通过此 URL 查阅 SAS 文档，了解关于 `PATTERN` 关键字的更多详细信息：[`https://documentation.sas.com/?docsetId=graphref&docsetTarget=p02daopdgx5yh4n1vmffk4ud4697.htm&docsetVersion=9.4&locale=en`](https://documentation.sas.com/%253FdocsetId%253Dgraphref%2526docsetTarget%253Dp02daopdgx5yh4n1vmffk4ud4697.htm%2526docsetVersion%253D9.4%2526locale%253Den)。\n\
  \n`PROC GMAP` 使用这两种图案，基于 `voters` 数据集和 `PROC GPROJECT` 生成的地图，生成彩色的统计地图（choro map）。要了解更多关于\
  \ `PROC GMAP` 的信息，请查阅以下 SAS 文档的 URL：\n\n[`https://documentation.sas.com/?docsetId=grmapref&docsetTarget=n0ncszzwvnx84bn1ql4487r08jpa.htm&docsetVersion=9.4_01&locale=en`](https://documentation.sas.com/%253FdocsetId%253Dgrmapref%2526docsetTarget%253Dn0ncszzwvnx84bn1ql4487r08jpa.htm%2526docsetVersion%253D9.4_01%2526locale%253Den)\n\
  \n为了验证结果，我查阅了大量网站以比较我的结果。其中几个网站如下：\n\n*   [`https://www.politico.com/2016-election/results/map/president/maine/`](https://www.politico.com/2016-election/results/map/president/maine/)\n\
  *   [`https://en.wikipedia.org/wiki/2016_United_States_presidential_election_in_Maine`](https://en.wikipedia.org/wiki/2016_United_States_presidential_election_in_Maine)\n\
  \n类似地，我能够比较过往年份中各县的政党分布情况，这在第 1 章的图 1-12 中已有提及。\n\n我将 2012、2008、2004 和 2000 年的代码添加到了“示例代码”文件夹中。它们分别是\
  \ `Listing 8-2.sas`、`Listing 8-3.sas`、`Listing 8-4.sas` 和 `Listing 8-5.sas`。这些列出的程序生成了图\
  \ 8-5 中的地图。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig5_HTML.jpg](img/501068_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5 2000-2016 年总统选举中缅因州各县投票情况的地图\n\n如需更多资源，请查阅附录。\n\n\n\n# SAS Visual Statistics：首个报告\n\
  \n现在，为了返回 Visual Statistics 来编写我们的第一个交互式报告，我们需要上传数据集。在本节中，我们使用“康涅狄格州意外药物相关死亡”数据集。\n\
  \n你可以从以下链接下载 CSV 文件：\n\n[`https://catalog.data.gov/dataset/accidental-drug-related-deaths-january-2012-sept-2015`](https://catalog.data.gov/dataset/accidental-drug-related-deaths-january-2012-sept-2015)\n\
  \n不过，我们只使用 2016 年至 2018 年的数据。你可以在“Datasets”文件夹中找到名为 `Accidents_Drugs_CT.csv` 的数据集。如上一节所述，点击三条横线；选择“管理数据”，如下图\
  \ 8-6 所示。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig6_HTML.jpg](img/501068_1_En_8_Fig6_HTML.jpg)\n\
  \n图 8-6：管理数据\n\n点击“导入” ➤ “本地文件”，如下图 8-7 所示。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig7_HTML.jpg](img/501068_1_En_8_Fig7_HTML.jpg)\n\
  \n图 8-7：导入 2016-2018 年康涅狄格州药物过量意外死亡数据集\n\n然后，点击“导入项”。接着，点击三条横线，然后点击“探索和可视化”，如下图\
  \ 8-8 所示。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig8_HTML.jpg](img/501068_1_En_8_Fig8_HTML.jpg)\n\
  \n图 8-8：探索和可视化\n\n在右侧窗格中，点击“选项”，如下图 8-9 所示，以更改报告的背景颜色和字体。我们选择深灰色背景和黄色字体，如下图 8-9\
  \ 所示。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig9_HTML.jpg](img/501068_1_En_8_Fig9_HTML.jpg)\n\
  \n图 8-9：增强报告背景\n\n向下滚动选项至“布局”部分，并取消勾选“避免滚动条”，如下图 8-10 所示。这一点至关重要，因为如果你保留默认选项，图表和报告将无法清晰显示。此外，它还会锁定报告部分的调整大小功能。因此，最好取消勾选此选项，以便能够控制报告的尺寸。\n\
  \n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig10_HTML.jpg](img/501068_1_En_8_Fig10_HTML.jpg)\n\
  \n图 8-10：取消勾选“避免滚动条”\n\n请随意查看报告的其他选项，并探索如何增强其外观。\n\n## 直方图\n\n在左侧窗格中，点击“对象” ➤ “直方图”，如下图\
  \ 8-11 所示。将其拖放到内容窗格的报告中。在为其分配角色之前，它不会显示任何内容，如下一步所示。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig11_HTML.jpg](img/501068_1_En_8_Fig11_HTML.jpg)\n\
  \n图 8-11：直方图\n\n在右侧窗格中，点击“角色”来分配度量，如下图 8-12 所示。对于直方图，只允许使用数值。因此，`Age` 是该数据集中唯一可行的变量。\n\
  \n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig12_HTML.jpg](img/501068_1_En_8_Fig12_HTML.jpg)\n\
  \n图 8-12：只有数值才能作为直方图的度量\n\nSAS Visual Statistics 生成一个图，如下图 8-13 所示，显示 2016 年至 2018\
  \ 年间康涅狄格州发生意外药物相关死亡的最高年龄段是 31-34 岁。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig13_HTML.jpg](img/501068_1_En_8_Fig13_HTML.jpg)\n\
  \n图 8-13：2016-2018 年康涅狄格州药物过量死亡人员的年龄分布\n\n> **注意：** 要查看彩色版图 8-13、8-14 和 8-15，请访问本书的源代码。\n\
  \n为增强标题外观，双击标题，会弹出菜单，如下图 8-14 所示。更改颜色，并设置为粗体且居中。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig14_HTML.jpg](img/501068_1_En_8_Fig14_HTML.jpg)\n\
  \n图 8-14：增强标题外观\n\n如图 8-15 所示，标题现在更加清晰。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig15_HTML.jpg](img/501068_1_En_8_Fig15_HTML.jpg)\n\
  \n图 8-15：报告此部分的最终效果\n\n## 词云\n\n词云是字符变量自然语言处理的一个激动人心的功能。它显示任何变量中出现频率最高的词，其字号大于其他词。再次从右侧窗格中，点击“对象”\
  \ ➤ “词云”，如下图 8-16 所示。将其拖到报告中。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig16_HTML.jpg](img/501068_1_En_8_Fig16_HTML.jpg)\n\
  \n图 8-16：词云\n\n从右侧窗格为其分配角色。选择“角色”，然后在“词”中，选择 `DeathCity`，如下图 8-17 所示。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig17_HTML.jpg](img/501068_1_En_8_Fig17_HTML.jpg)\n\
  \n图 8-17：从数据集中选择 `DeathCity` 列\n\n词云如下图 8-18 所示，显示哈特福德是这些致命药物相关死亡事件最常发生的城市，其次是纽黑文、布里奇波特和沃特伯里。该词云可以帮助执法部门加强这些城市的监控。此外，你可以添加最常发生日期和时间的图表，以检查某些节假日或时间与这些事件之间是否存在关系。你可以通过追踪街道来深入挖掘，以识别这些城市中是否存在某些地点出售毒品。\n\
  \n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig18_HTML.jpg](img/501068_1_En_8_Fig18_HTML.jpg)\n\
  \n图 8-18：药物相关死亡率较高的城市名称字号大于其他城市\n\n> **注意：** 要查看彩色版图 8-18，请访问本书的源代码。\n\n\n\n###\
  \ 条形图\n\n另一个要展示的图表是条形图。同样，从左侧窗格中选择 `Objects ➤ Graphs ➤ Bar Chart`，如图 8-19 所示。用鼠标将条形图拖拽到内容窗格中。\n\
  \n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig19_HTML.jpg](img/501068_1_En_8_Fig19_HTML.jpg)\n\
  \n图 8-19\n\n条形图\n\n拖拽后，系统会提示您尚未分配角色。从右侧窗格中选择 `Roles`。对于 `Category`，选择 `Race`，如图\
  \ 8-20 所示。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig20_HTML.jpg](img/501068_1_En_8_Fig20_HTML.jpg)\n\
  \n图 8-20\n\n从数据集中选择种族\n\n默认情况下，SAS Visual Statistics 中的条形图是水平方向的。在右侧窗格中，点击 `Options\
  \ ➤ Bar`。点击 `Vertical direction`，如图 8-21 所示。\n\n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig21_HTML.jpg](img/501068_1_En_8_Fig21_HTML.jpg)\n\
  \n图 8-21\n\n将条形图方向更改为垂直\n\n调整图表及其标题的大小和外观，使其更加清晰，如图 8-22 所示。该图显示，白人因药物过量死亡的人数比其他任何种族都多。\n\
  \n![../images/501068_1_En_8_Chapter/501068_1_En_8_Fig22_HTML.jpg](img/501068_1_En_8_Fig22_HTML.jpg)\n\
