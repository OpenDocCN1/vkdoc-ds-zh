  #### 出口民调如何显示收入因素在 2016 年缅因州选举中的影响？


  从另一个角度来看，根据 CNN 的报道，出口民调显示，除薪资在 30,000 美元到 50,000 美元之间的选民外，缅因州大多数选民会投票给克林顿。(⁵) 这部分群体会投票给特朗普。然而，他们仅占样本的
  19%。因此，缅因州的多数人会投票给克林顿。


  #### 回顾以往选举，看是否存在可预测的结果（模式）


  最后，项目的最后一步是收集以往选举的历史数据，并将其用于下一步的建模和预测。正如我之前提到的，我忽略了任何其他政党，只关注民主党和共和党，因为其他政党在 2012
  年选举中的得票率几乎为零。


