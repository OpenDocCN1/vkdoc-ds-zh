  \ data set` 将数据的平均值保存到新数据集，如图 3-27 所示。\n\n![../images/501068_1_En_3_Chapter/501068_1_En_3_Fig27_HTML.jpg](img/501068_1_En_3_Fig27_HTML.jpg)\n\
  \n图 3-27\n\n将结果保存到新数据集\n\n**步骤 4：** 创建一个按平均薪资排序的条形图，而不是按球队排序。选择上一步生成的数据集作为新条形图的输入数据。为\
