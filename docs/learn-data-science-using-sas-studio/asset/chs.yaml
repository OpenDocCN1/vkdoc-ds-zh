  \n图 2-13 结果选项卡\n\n### 图形\n\n让我们快速制作一个图形。点击 `任务和实用工具` ➤ `任务` ➤ `图形` ➤ `条形图`，如图 2-14\
  \ 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig14_HTML.jpg](img/501068_1_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14 条形图\n\n现在，如图 2-15 所示，将 `数据` 更改为 `SASHELP.FISH`。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig15_HTML.jpg](img/501068_1_En_2_Fig15_HTML.jpg)\n\
  \n图 2-15 进行以下更改\n\n1.  选择 `Species`。\n2.  `度量` 应为 `变量`。\n3.  选择 `Weight`。\n4.  然后将\
  \ `统计量` 更改为 `均值`。\n\n如图 2-16 所示，将标题更改为“不同物种的平均重量”。在 `条形` 中，勾选“设置颜色”并更改颜色。在 `详情`\
  \ 中，将 `效果` 更改为 `光泽`。然后，点击 `运行`。图 2-16 显示了输出结果。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig16_HTML.jpg](img/501068_1_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16 条形图外观选项卡\n\n### 代码片段\n\n当您有需要重复执行的定制化代码时，可以主要使用代码片段。不必每次都重做，只需将其保存为代码片段，每当需要时，只需更改数据集名称、变量和标题即可。因此，您可以将代码片段视为自定义任务的替代方案。\n\
  \n#### 那么，什么是代码片段？\n\n*   它是现成的 `SAS` 代码。\n*   您可以自定义它。\n*   您可以添加自己的代码片段。\n\n让我们使用两个示例来演示如何使用现成代码片段，以及如何创建您自己的新代码片段。\n\
  \n#### 使用现成代码片段的示例\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig17_HTML.jpg](img/501068_1_En_2_Fig17_HTML.jpg)\n\
  \n图 2-17 水平条形图代码片段\n\n*   点击 `代码片段` ➤ `图形`。\n*   选择 `Hbar`。代码如图 2-17 所示。\n\n清单 2-2\
  \ 中的代码位于“示例代码”文件夹中，您可以从中复制粘贴。\n\n*   编辑代码，使其如图 2-16 所示，操作如下：\n    *   编辑标题。\n  \
  \  *   将数据集从 `cars` 更改为 `baseball`。\n    *   将 `hbar` 从“type”更改为“team”。\n    * \
  \  将 `response` 从“mpg_city”更改为“salary”。\n    *   移除限制。\n\n```\n/*--HBar 图--*/\n\
  title '按类型划分的里程数';\nproc sgplot data=sashelp.cars ;\nhbar type / response=mpg_city\
  \  stat=mean  limits=both;\nyaxis display=(nolabel) grid;\nxaxis display=(nolabel);\n\
  run;\n```\n清单 2-2 代码片段示例\n\n清单 2-3 的修改后代码位于“示例代码”文件夹中，您可以从中复制粘贴。其屏幕截图如图 2-18 所示。\n\
  \n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig18_HTML.jpg](img/501068_1_En_2_Fig18_HTML.jpg)\n\
  \n图 2-18 将代码片段自定义为新的数据集和变量\n\n```\n/*--HBar 图--*/\ntitle '按团队划分的平均薪资';\nproc sgplot\
  \ data=sashelp.baseball ;\nhbar team / response=salary  stat=mean  ;\nyaxis display=(nolabel)\
  \ grid;\nxaxis display=(nolabel);\nrun;\n```\n清单 2-3 自定义代码片段示例\n\n*   运行代码。\n\n\
  #### 创建您自己的代码片段\n\n如图 2-19 所示，点击 `代码` 选项卡，然后选择（添加到我的代码片段）图标。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig19_HTML.jpg](img/501068_1_En_2_Fig19_HTML.jpg)\n\
  \n图 2-19 添加到我的代码片段\n\n## SAS 程序的主要组成部分\n\n一个 `SAS` 程序包含两个步骤：数据步和过程步。每个程序可以根据需要包含任意数量的数据步和过程步，如图\
  \ 2-20 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig20_HTML.jpg](img/501068_1_En_2_Fig20_HTML.jpg)\n\
  \n图 2-20 SAS 程序的主要组成部分\n\n### 数据步\n\n数据步用于准备待处理的数据，包括定义数据集、合并数据集、清理数据、创建新变量、检查错误、移除任何变量等操作。\n\
  \n### 变量类型\n\n在 `SAS` 中，有两种变量类型：数值型和字符型。`SAS` 日期和时间既不是标准的数值型变量，也不是字符型变量。它们有专门的函数，但以数字形式存储。在数据科学中，数据科学家使用的术语有所不同。连续变量或定量变量用数值型变量表示，而分类变量或定性变量用字符型变量表示。\n\
  \n### 过程步\n\n过程步用于定义处理干净数据并生成报表的过程。您可以使用过程步从 `任务` 选项卡中进行汇总、排序、列出、过滤或执行任何其他任务。\n\n\
  ## 逻辑库\n\n我们浏览的下一站是左侧窗格的第三个选项卡：`逻辑库`。`逻辑库` 是您加载表格的地方，这样 `SAS Studio` 就可以访问表格中的数据。逻辑库有两种类型：永久逻辑库和临时逻辑库。您将学习如何区分它们以及如何创建新的永久逻辑库。不过在此之前，我们需要讨论如何在宿主机器和运行\
  \ `SAS Studio` 的虚拟机之间共享文件和文件夹。\n\n### 访问您现有的本地文件\n\n有两种方法可以从 `SAS Studio` 内部访问您机器上的文件。第一种方法是使用\
  \ `SAS Studio` 界面上传文件。第二种方法是使用操作系统将文件从本地机器复制粘贴到您在本地机器上创建的 `myfolders` 文件夹中。\n\n\n\
  \n### 第一种方法\n\n点击**服务器文件和文件夹** ➤ **上传**。然后，从本地计算机中选择 Excel、CSV 或任何格式的文件，将其上传到 SAS\
  \ Studio（见图 2-21 和 2-22）。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig21_HTML.jpg](img/501068_1_En_2_Fig21_HTML.jpg)\n\
  \n图 2-21 点击**上传**图标\n\n同样，如果您想将文件从 SAS Studio 内部下载到本地计算机，请选择该文件并点击**下载**图标进行下载（见图\
  \ 2-23）。您将在本地计算机的**下载**文件夹中找到它（见图 2-23）。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig23_HTML.jpg](img/501068_1_En_2_Fig23_HTML.jpg)\n\
  \n图 2-23 使用**下载**图标将 SAS Studio 中的任何文件下载到您的操作系统\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig22_HTML.jpg](img/501068_1_En_2_Fig22_HTML.jpg)\n\
  \n图 2-22 从服务器文件和文件夹中选择文件\n\n### 第二种方法\n\n只需将所需文件（SAS、XLS 或 CSV）复制并粘贴到 **myfolders**\
  \ 文件夹中。由于 SAS Studio 在虚拟机内运行，除了共享文件夹中的文件外，它无法访问 Windows 文件系统或本地操作系统上的任何文件。\n\n##\
  \ 访问 SAS 逻辑库中的数据\n\nSAS Studio 将表存储在逻辑库中。通常，这些逻辑库是永久性的。然而，**Work** 逻辑库是一个临时库，仅持续当前会话，并在刷新浏览器或注销时消失。**逻辑库**选项卡中的所有其他逻辑库都是永久性的。例如，**SAS\
  \ Help** 就是一个永久逻辑库。\n\n### 如何区分永久逻辑库和临时逻辑库？\n\n任何数据集都有一个由点分隔的两级名称，语法如下：`<第一级名称>.<第二级名称>`；例如，`sashelp.cars`\
  \ 或 `newlib.adults`。这表明您的数据集保存在一个永久逻辑库中。但是，如果您的数据集的第一级是 `work`，则它保存在一个临时逻辑库中；例如，`work.ratedata`。\n\
  \nSAS Studio 默认使用 **Work** 逻辑库。因此，对于任何只有一级名称的数据集，`work` 将是其第一级，并且它是临时的；例如，`income`。您可以在**逻辑库**选项卡的\
  \ **Work** 逻辑库下找到它。因此，`work.income` 等同于 `income`；两者相同，都表示一个名为 `income` 的临时逻辑库。\n\
  \n## 创建新逻辑库\n\n有两种创建新逻辑库的方法：通过代码或通过图形用户界面。通过代码创建新逻辑库只需一条命令：`libname <逻辑库名称> <路径>;`\n\
  \n### 逻辑库命名约定\n\n您创建的逻辑库的名称长度必须在 1 到 8 个字符之间，并且以字母或下划线开头。它不能以数字开头或包含任何特殊字符。名称的其余字符可以是字母、数字和下划线。不允许使用特殊字符。\n\
  \n路径可以是保存在**服务器文件和文件夹**选项卡中的任何文件夹。键入如清单 2-4 所示的代码（该代码位于**示例代码**文件夹中），您可以从该处复制代码并将其粘贴到新程序中以创建您的新逻辑库，然后点击**运行**。\n\
  \n```\nlibname newlib '/folders/myfolders';\n清单 2-4\n使用 libname 语句创建新逻辑库\n```\n\n\
  您将在**逻辑库**选项卡中找到您的逻辑库。如果没有，请点击**刷新**。\n\n第二种方法是使用图形用户界面。点击**逻辑库**选项卡，然后点击**新建逻辑库**图标，如图\
  \ 2-24 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig24_HTML.jpg](img/501068_1_En_2_Fig24_HTML.jpg)\n\
  \n图 2-24 使用图形用户界面创建新逻辑库\n\n选择您的文件夹，如图 2-25 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig25_HTML.jpg](img/501068_1_En_2_Fig25_HTML.jpg)\n\
  \n图 2-25 选择逻辑库的位置\n\n输入其名称和路径，如图 2-26 所示。最好勾选**启动时重新创建此逻辑库**，这样您就可以在每次刷新 SAS Studio\
  \ 或重启虚拟机时找到它。否则，您将无法找到它，需要手动将其重新添加到逻辑库列表中。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig26_HTML.jpg](img/501068_1_En_2_Fig26_HTML.jpg)\n\
  \n图 2-26 配置新逻辑库的创建选项\n\n点击**确定**。您将在**逻辑库**列表中找到您的新逻辑库，如图 2-27 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig27_HTML.jpg](img/501068_1_En_2_Fig27_HTML.jpg)\n\
  \n图 2-27 **逻辑库**列表中的新逻辑库\n\n\n\n### 向库中添加新表\n\n成功创建新库后，你可以向其中添加新的数据集或表。有两种方法可以实现此任务。第一种方法是通过代码，在数据步骤中为数据集添加两级名称，将你的库名作为第一级，数据集名作为第二级。\n\
  \n在一个新程序中，输入清单 2-5 中的代码。第一行代码向我们在上一步骤中创建的 `newlib` 库中添加了一个名为 `europeancars` 的新表。第二行和第三行使用了\
  \ `SET` 和 `WHERE` 语句，我们将在本书后面的第 6 章中详细解释。现在，`SET` 语句会将 `sashelp.cars` 的所有内容复制到 `newlib.europeancars`\
  \ 表中，但仅限 `Origin` 列等于 `Europe` 的行。\n\n```\ndata newlib.europeancars;\nset sashelp.cars;\n\
  where origin=\"Europe\";\nrun;\n清单 2-5\n向库中添加新表\n```\n\n点击 `Run`。点击 `newlib` 库。你会看到该数据集已列在其中，如图\
  \ 2-28 所示。如果没找到，请点击 `Refresh`。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig28_HTML.jpg](img/501068_1_En_2_Fig28_HTML.jpg)\n\
  \n图 2-28 将表保存到你的新库\n\n现在，重新登录 SAS Studio 或刷新 SAS Studio 窗口。登录后，你应该能找到该库和该表。\n\n\
  第二种方法是通过导入数据集。选择 `Files and Folders ➤ Import Data ➤ select the file name`，如图 2-29\
  \ 所示。然后点击 `Run`。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig29_HTML.jpg](img/501068_1_En_2_Fig29_HTML.jpg)\n\
  \n图 2-29 导入数据\n\n点击 `Select Files`，如图 2-30 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig30_HTML.jpg](img/501068_1_En_2_Fig30_HTML.jpg)\n\
  \n图 2-30 从服务器文件和文件夹选项卡中选择我们的文件\n\n然后，选择你想要导入的文件，如图 2-31 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig31_HTML.jpg](img/501068_1_En_2_Fig31_HTML.jpg)\n\
  \n图 2-31 选择文件\n\nSAS Studio 中的默认设置是库为临时库 `Work`，数据集名称则根据当前会话中完成的导入次数命名为 `IMPORT<Number>`。你可以通过点击\
  \ `Change` 按钮来更改默认设置，如图 2-32 所示。选择一个永久库，并将数据集重命名为更有意义的名称。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig32_HTML.jpg](img/501068_1_En_2_Fig32_HTML.jpg)\n\
  \n图 2-32 更改表和库名称\n\n此外，如果向下滚动，你会找到更多可以更改的选项，比如分隔符和第一行，如图 2-33 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig33_HTML.jpg](img/501068_1_En_2_Fig33_HTML.jpg)\n\
  \n图 2-33 导入数据选项\n\n自动生成的 SAS 变量名将从你的数据文件的第一行中提取。如果你的数据文件的第一行是数据而不是列名，你可以取消勾选该选项。在代码的数据步骤中，你可以使用\
  \ `Rename` 关键字重命名变量。\n\n### INFILE 技术\n\n与导入文件等效，你可以使用 `INFILE` 语句。将分隔符和第一个观测值/行设置为\
  \ `INFILE` 语句的选项。使用 `INPUT` 语句修改变量名及其数据类型。始终记住，任何 `INFILE` 语句后都必须跟一个 `INPUT` 语句。\n\
  \n让我们逐步尝试一下。在 `Datasets` 文件夹中，你会找到一个名为 `Exam.txt` 的文件。首先上传该文件，就像我们在图 2-21 和图 2-22\
  \ 中所做的那样。右键单击该文件，然后点击 `Properties` 来获取文件路径，如图 2-34 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig34_HTML.jpg](img/501068_1_En_2_Fig34_HTML.jpg)\n\
  \n图 2-34 右键单击文件以获取其属性\n\n然后，选择该位置并右键点击 ➤ `Copy`，如图 2-35 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig35_HTML.jpg](img/501068_1_En_2_Fig35_HTML.jpg)\n\
  \n图 2-35 复制文件位置\n\n`INFILE` 语句的语法如下：\n\n```\nINFILE  DLM= FIRSTOBS=\n```\n\n清单 2-6\
  \ 展示了一个使用 `INFILE` 语句的示例。第一行代码将创建一个名为 `examdata` 的表，并保存在临时库 `Work` 中。第二行使用 `INFILE`\
  \ 语句指定原始数据文件的路径，使用 `DLM` 选项指示所使用的分隔符，并使用另一个选项 `FIRSTOBS` 告诉 SAS Studio 从第二行开始导入数据行。该文件的分隔符是逗号。第二行是我们的第一行数据。打开\
  \ `examdata.txt` 并检查它。文件中的第一行是标题，不是数据。让我们回到清单 2-6。第三行使用 `INPUT` 语句指定列名。列名之间应使用空格分隔。数据步骤以\
  \ `RUN;` 结束，以告诉 SAS Studio 这是该步骤的最后一行。\n\n```\ndata examdata;\ninfile '/folders/myfolders/sasuser.v94/Exam.txt'\
  \ dlm=',' firstobs=2;\ninput year pass fail;\nrun;\n清单 2-6\nINFILE 语句\n```\n\n点击\
  \ `Run` 执行程序。输出结果如图 2-36 所示。\n\n![../images/501068_1_En_2_Chapter/501068_1_En_2_Fig36_HTML.jpg](img/501068_1_En_2_Fig36_HTML.jpg)\n\
  \n图 2-36 INFILE 语句的输出\n\n请注意，`FIRSTOBS` 可以是任何数字，不限于零或一。假设你有一个包含一百万行的大数据文件，但你只需要在\
  \ 100 行样本数据上测试你的代码。你可以设置 `FIRSTOBS=1000` 来告诉 SAS Studio 从该文件的第 1000 行开始读取。要指定最后一行，你可以在\
  \ `INFILE` 语句中使用另一个选项 `OBS`。`INFILE` 语句将如下所示：\n\n```\nINFILE  FIRSTOBS=1000 OBS=1100;\n\
  ```\n\n## 总结\n\n本章代表了我们在学习 SAS Studio 和 SAS 编程之旅中的基础。它从安装步骤开始，然后解释了界面和 SAS 程序的基本组成部分。此外，还解释了数据类型和库。在下一章中，我们将更深入地研究数据可视化。\n\
  \n"
- '# 3. 数据可视化


  有句格言说：“一图胜千言。”在其他编程工作中，可视化是一项繁琐而艰巨的任务。幸运的是，SAS Studio 可以通过其集成开发环境轻松制作出漂亮的图形。本章使用公共领域中可用的大型数据集。我们将遵循第
  1 章中提到的数据科学流程，即每个部分都从一个问题开始，并通过图表寻求答案。


  本章涵盖了各种基本图表，例如散点图、直方图、序列图、条形图和排序条形图、气泡图以及聚类分析和树状图。此外，本章还演示了如何将数据显示在地图上，这在其他编程语言中是一项极具挑战性的任务。




  '
- '# 散点图


  散点图通过描述变量之间的方向、强度和线性关系，来展示变量间的相互依赖程度。此外，它们还能轻松显示异常值。


  在本例中，我们提出的问题是：西雅图市的薪资是否与员工的年龄段有关，还是毫无关联？


  你可以在本书源码的`Datasets`文件夹中找到名为`City_of_Seattle_Wages__Comparison_by_Gender_-_Average_Hourly_Wage_by_Age.csv`的数据文件。或者，你也可以通过以下网址从`Data.Gov`项目下载该
  CSV 文件：[`https://catalog.data.gov/dataset/city-of-seattle-wages-comparison-by-gender-average-hourly-wage-by-age-353b2`](https://catalog.data.gov/dataset/city-of-seattle-wages-comparison-by-gender-average-hourly-wage-by-age-353b2)。


