  看到表 1-3 中收集的数据，我惊讶地发现，缅因州历史上曾是共和党州，后来才变成了一个强大的民主党州。因此，我决定将缅因州描述为“倾向民主党”州，因为从 1960
  年到 2016 年，民主党在十五次选举中赢得了七次。我预测它在 2020 年仍将以微弱优势支持民主党。自 1992 年以来，民主党在缅因州连续获胜。然而，如果民主党不再更多地关注缅因州，它可能会转而支持共和党。据《班戈每日新闻》报道，克林顿在
  2015 年 9 月之后再未访问过缅因州，而是派代理人前往。多年来，民主党首次将一张选举人票输给了共和党。（班戈是缅因州的一个城市。）




  ### 建模


  在建模时，最好尝试不同的预测算法并比较其结果，而不是只依赖单一模型。在这个项目中，我使用了 `Monte Carlo` 和 `Bayes` 算法。


  对于统计检验，我使用了以下方法：


  -   直方图

  -   箱线图

  -   比例检验

  -   T 检验

  -   决策树

  -   卡方检验

  -   散点图和线性回归


  ### 我的 2016 年预测


  在 `SAS University Edition` 中使用过去的选举结果运行 `Monte Carlo` 算法后，输出如图 1-11 所示。


  ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig11_HTML.jpg](img/501068_1_En_1_Fig11_HTML.jpg)


  *图 1-11 Monte Carlo 算法的 2016 年预测结果*


  图 1-11 显示，`Hillary Clinton` 将以平均 52.14%的得票率赢得缅因州。实际上，她的得票率仅为 48%。因此，模拟检测到了她赢得缅因州，并且她确实赢了。因此，我在这项目中获得了满分，课程也得了
  A。太棒了！


  ### 我的 2020 年预测


  我预测民主党将以 50.8%的得票率赢得缅因州四张选举人票中的三张，如图 1-12 所示。


  ![../images/501068_1_En_1_Chapter/501068_1_En_1_Fig12_HTML.jpg](img/501068_1_En_1_Fig12_HTML.jpg)


  *图 1-12 Monte Carlo 算法的 2020 年预测结果*


  缅因州的概率是，民主党将在 2020 年以大约高出共和党+3%的微弱优势获胜，而 1960 年至 2016 年的历史数据显示，缅因州民主党的平均得票率约为 43%，共和党的平均得票率为
  40%。这与 2016 年缅因州民主党与共和党之间的差距相同。


  然而，如果民主党不小心，缅因州可能会倒向共和党。


  ## 总结


  本章重点阐述了缅因州总统选举项目案例研究的主要思路及其图表。在下一章中，我们将了解如何安装 `SAS Studio` 并编写我们的第一个 SAS 程序。


  '
- '# 2. 入门


  `SAS Studio` 使您能够导入和导出原始数据文件、操作和转换数据、组合 SAS 数据集、使用 SAS 过程生成摘要报告、识别和纠正数据，以及调试语法和编程逻辑错误。此外，它还让您能够更轻松地完成可视化（包括地图），步骤比
  `R` 或 `Python` 等其他编程语言更简单。不过，它也有一个编程编辑器，以便在需要时自定义和编写您自己的代码。


  ## 如何安装 SAS Studio？


  安装包括四个步骤。您可以通过以下网址逐步操作：[`www.sas.com/en_us/software/university-edition/download-software.html`](https://www.sas.com/en_us/software/university-edition/download-software.html)。


  由于安装步骤可能会发生变化，最好查阅此网址以获得最新的在线指南。


  ## 什么是 SAS 和 SAS Studio？


  `SAS` 代表统计分析系统（Statistical Analysis System），`SAS Studio` 是其界面。`SAS Studio` 拥有一个强大的集成开发环境（IDE），其中既包含任务的图形用户界面（GUI），也包含代码编辑器。如果您使用采用“点击”方式的
  GUI，`SAS Studio` 会自动为您生成相应的代码。或者，您也可以使用代码编辑器编写自己的代码。


  在本书中，我们将介绍两种方法：使用 GUI 和编写代码。对于使用 GUI 的示例，我们将解释生成的代码。对于某些高级示例或仅能通过代码完成的用户自定义示例，我将逐行解释所需的代码，以及相关的过程和选项。


  值得一提的是，`SAS Studio` 还有两种模式：`SAS Programmer`（SAS 程序员）和 `Visual Programmer`（可视化程序员）。`Visual
  Programmer` 模式使用拖放方法。您可以从右上角顶栏的下拉菜单中更改模式。然而，本书重点介绍的是 `SAS Programmer` 模式。




  '
