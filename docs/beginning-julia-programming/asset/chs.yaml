- "# 1. 引言\n\n## 1.1 欢迎来到朱利亚世界\n\n当你面对浩瀚的编程语言之海时，学习一门新语言可能感觉是一项艰巨的任务。学习新的编程模式和结构需要时间、耐心和专注的努力，因此投入如此耗时的工作必须有非常充分的理由。Julia\
  \ 就是一门能提供这些理由的编程语言。由于已有众多成熟的编程语言，包括 Python、C、C++、Java、R 和 MATLAB，你需要真正有动力才能投入时间学习\
  \ Julia 这门新语言。在本章结束时，我希望你会发现，有足够多的理由让你深入探索朱利亚世界。\n\nJulia 被誉为能满足所有需求的单一编程语言，因为它消除了掌握多种语言的必要性。大多数编程语言的设计都是为了满足其诞生时代的需求。例如，C\
  \ 语言被设计为一种高效的**过程式**编程语言。C++ 的开发则是在业已高效且流行的 C 语言基础上增加了**面向对象**编程特性。Java 也为面向对象领域增添了新功能。MATLAB\
  \ 的发明是为了减轻定义数学问题所需的编码负担。Python 的发展理念与此类似，但拓展到了 MATLAB 效率低下的领域。由于这两种语言在结构上相似，许多 MATLAB\
  \ 程序员轻松转向了 Python。它同时也是开源且模块化的，这增加了使用他人代码的便捷性。然而，计算机科学领域这种发展方式的一个主要问题是，每种编程语言都只在特定领域表现优秀。因此，用户需要为不同任务使用多种编程语言，然后根据需要调整它们以构建所需的软件。一些编程语言，如\
  \ C 和 C++，是为速度而创造的，而另一些则旨在其领域内进行高效计算。数据科学任务的出现，要求一种语言不仅要快速，而且要有消除为完成一项计算任务而使用多种语言之需求的特性。\n\
  \nJulia 几乎完美地契合了这些新需求。其官网 [`http://julialang.org`](http://julialang.org) 声明如下：\n\
  \n- Julia 提供了 R、Python、MATLAB、SAS 或 Stata 的功能性、易用性和直观语法，并结合了 C、C++ 或 Java 的速度、容量与性能\
  \ [1]。\n\n由于本质上是开源的，Julia 吸引了大量开发者编写模块，这些模块如今已用于大多数工作。Julia 是用于数据科学、机器学习和科学计算的最快的现代开源语言之一。\n\
  \n凭借 Julia 令人印象深刻的功能集，你现在应该有足够的理由去探索这门语言了。它是当前——并且希望在将来——能用于几乎所有类型计算任务的最新一代编程语言之一。此外，许多高科技公司正在招聘朱利亚程序员。\n\
  \n如果你有使用 Python 编程语言的经验，就会知道它因多种原因而流行。它的学习曲线极其平缓。凭借其开源架构，数百万开发者贡献了数千个包来执行各种任务。这些包易于使用，你只需一个简单的命令就能导入它们。Python\
  \ 还可以在各种平台上运行。它是面向对象的，这使其总体上成为最适合模拟和计算的高级语言之一。它还能运行用其他编程语言编写的部分代码。由于这些特性，在撰写本书时，它已成为程序员中最流行的语言。但它有一个大问题：速度慢。因此，当开发者需要编写时间高效的代码时，他们常常陷入困境。许多时候，他们选择用更快的语言（如\
  \ C 或 C++）来编写时间低效的部分。这个过程使得整体体验非常丰富但也非常繁琐。创造 Julia 的主要动机正是源于这个问题。\n\nJulia 的创造者们自己\
  \ [2] 也评论了这些问题：\n\n- 我们需要一种开源且具有宽松许可证的语言。我们需要 C 的速度，同时兼具 Ruby 的动态性。我们需要一种同像性语言，像\
  \ Lisp 那样拥有真正的宏，但又像 MATLAB 那样拥有直观、熟悉的数学符号。我们需要一种像 Python 一样适用于通用编程、像 R 一样易于进行统计、像\
  \ Perl 一样自然地处理字符串、像 MATLAB 一样擅长线性代数、像 shell 一样善于黏合程序的语言。一种学起来极其简单，却能让最严肃的黑客感到满意的东西。我们需要它具备交互性，同时又能被编译。（我们提过它应该像\
  \ C 一样快吗？）\n\nLLVM（低级虚拟机）的引入 [3] 使得这种理念成为现实。从设计之初就能打造一门满足大多数需求的语言，从而消除“两语言”方法成为可能。基于\
  \ LLVM 的 JIT（即时）编译器使得 Julia 能够接近并通常能匹敌 `C/C++` 的性能。（详细解释这个概念超出了本书的范围，对初学者来说也不相关。）\n\
  \n## 1.2 JIT 编译器\n\n所有编程指令最终都会变成在硬件上运行的机器码（因此，机器码是特定于硬件的）。因此，更快的代码意味着更高效的机器码。机器码可以手工编写，但这是一项繁琐的工作。汇编语言（低级语言）是机器码的符号表示，可以手工输入硬件设备，但它有两个主要障碍：\n\
  \n1.  读写不易。\n2.  它特定于硬件。\n\n这两个问题被更高级的语言所克服。目前存在多种高级语言。FORTRAN、C、C++ 等是基于编译器的语言，其代码读写比汇编语言更容易；它们能高效地转换为机器码。然而，用户被迫提供大量关于代码应如何执行以及使用何种数据类型的信息。有了提供给编译器的充分信息，编译器会提前（AOT）构建机器码。另一方面，像\
  \ Python 这样的解释型语言则会即时生成机器码，即在程序执行期间生成。这些语言不使用编译器，而是使用解释器来解释每一行代码，最终将其转换为机器码。这营造了一个灵活且交互的环境，深受所有人喜爱。程序员甚至可以将定义数据类型和内存分配的任务委托给解释器。但这些便利是有代价的，因为解释型语言需要时间来生成合适的机器码。\n\
  \nJIT 编译融合了 AOT 编译和解释执行两方面的优点。主要区别在于，特定任务的函数是按需编译的。在某些情况下，程序员将所有信息提供给编译器，以便高效地转换为机器码。当某些信息缺失时，编译器会尝试根据其使用情况来推断缺失的信息。\n\
  \n然而，在某些情况下，JIT 并非最优方法，并且会表现糟糕。当类型推断失败，或者编译器没有足够信息进行有效优化时，就会发生这种情况。\n\n基于这些理念，Julia\
  \ 的创造者们踏上了一段有趣的旅程，为世界带来了最有前途的编程语言之一。了解其发展历史可能会非常鼓舞人心。下一节将描述来自不同背景的人们如何聚集在一起协作，共同创造了\
  \ Julia。\n\n\n## 1.3 发展简史\n\nJulia 社区中流行一句口号：“像 Python 一样易用，像 C 一样快。”速度和易用性一直是开发\
  \ Julia 的首要标准。由四位开发者（杰夫·贝赞森、斯特凡·卡尔平斯基、维拉尔·B·沙阿和艾伦·埃德尔曼）组成的团队在麻省理工学院创建了这门实用语言。\n\n\
  《连线》杂志的一篇文章阐述了 Julia 的发展历程[4]。开发这门语言的主要动机源于卡尔平斯基在设计网络模拟器时遇到的问题。为了完成项目的各个部分，他不得不拼接多种最适合特定任务的编程语言。他向沙阿请教，沙阿将他介绍给了贝赞森。贝赞森得出结论：在不同编程语言之间进行取舍是可以避免的。这一结论解决了卡尔平斯基的问题。三位开发者又邀请了数学家埃德尔曼，共同开始了这个项目。不久，一门面向技术计算的高级、高性能、动态编程语言开始初具雏形，其语法对其他技术计算环境的用户来说非常熟悉。该语言的运算速度可与\
  \ C 语言媲美，同时还提供了亟需的复杂编译器，支持分布式并行执行，并实现了更高的数值精度和丰富的数学函数库。凭借这些强大的特性，该团队发布了一系列研究论文[5,\
  \ 6, 7, 8]，让人们得以一窥精彩的 Julia 世界。\n\n## 1.4 安装\n\n让我们深入 Julia 世界，开始学习这门强大程序的使用方法。如前所述，Julia\
  \ 开发者的主要资源是其官方网站[9]。在撰写本文时，当前版本 (v0.5.0) 可从网站的“下载”选项卡下载。首先，根据您的操作系统选择下载相应的版本[10]。该网站介绍了针对\
  \ macOS、Windows 和基于 Linux 操作系统的安装方法。探索 Julia 的一个有趣方式是使用 JuliaBox，您无需安装任何软件，只需访问一个运行着包含\
  \ Julia 内核的笔记本实例的服务器即可（见图 1-1）。用户可以选择其中任何一种方法来练习代码。\n\n![A458482_1_En_1_Fig1_HTML.jpg](img/A458482_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1 JuliaBox 控制台\n\n### 1.4.1 JuliaBox\n\n如果您有稳定的网络连接，您可能希望在不于本地机器上下载和安装软件的情况下使用\
  \ Julia。JuliaBox 的网址在参考文献列表中给出[11]。使用其中一个账户登录，然后通过选项卡选项打开 Julia 控制台。\n\n每个单元格可用于编写代码或使用标记语言编写文本信息。初学者只需选择在单元格中编写代码，然后按`Shift+Enter`执行即可。结果将显示在执行单元格的下方，并准备一个新单元格以接收下一组\
  \ Julia 命令。\n\n### 1.4.2 MacOS\n\nJulia 可在 macOS 10.7 及更高版本上运行。在 Mac 上安装 Julia 非常简单，只需从其网站下载`Julia-<version>.dmg`文件即可。该文件包含`Julia.app`。可以通过将`Julia-<version>.app`复制到硬盘（任何位置）或直接从磁盘映像运行来完成安装。双击快捷方式图标即可启动\
  \ Julia 控制台（图 1-2），其启动方式与 JuliaBox（图 1-1）中的 Julia 控制台类似。多个`Julia.app`二进制文件可以共存而互不干扰。因此，可以安装并使用多个版本的\
  \ Julia，它们之间不会相互影响。\n\n![A458482_1_En_1_Fig2_HTML.jpg](img/A458482_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2 macOS 下的 Julia 控制台\n\n要卸载 Julia，请删除`Julia.app`以及`~/.julia`目录下的包目录。如果您还想删除个人偏好设置文件，请删除`~/.juliarc.jl`。\n\
  \n### 1.4.3 Windows 操作系统\n\nJulia 适用于 Windows 7 及更高版本。32 位和 64 位操作系统版本均与 Julia 安装兼容。第一步是下载`julia.exe`文件（适用于您平台的安装程序）。值得注意的是，Julia\
  \ 的 32 位版本可在`x86`和`x86_64`上运行，而 64 位版本仅能在 64 位 Windows (`x86_64`) 操作系统上运行。因此，检查已安装的\
  \ Windows 操作系统的版本信息非常重要。默认情况下，它会安装到您的`AppData`文件夹。您可以保留默认路径或选择自己的目录（例如，`C:\\Julia`）。接下来，运行已下载的`julia.exe`文件，这将启动安装程序。安装完成后，桌面上会出现一个\
  \ Julia 程序的快捷方式。双击解压文件夹中的这个 Julia 快捷方式，即可启动类似于 JuliaBox（图 1-1）中所示的 Julia 环境。如果出现问题，可能是因为缺少某些依赖项。Windows\
  \ 的 README 文件中包含依赖项的相关信息。您需要安装这些依赖项才能完成安装。\n\n如果因为出现问题而被迫卸载 Julia，请删除解压目录和`%HOME%/.julia`目录下的包目录。如果您还想删除个人偏好设置文件，请删除`%HOME%/.juliarc.jl`和`%HOME%/.julia_history`。\n\
  \n### 1.4.4 Linux 操作系统\n\n#### 通过 PPA 为 Ubuntu 及其衍生版安装\n\n对于基于 Ubuntu 的 Linux 发行版，通过命令行终端添加仓库并安装\
  \ Julia，输入以下命令：\n\n```\n$ sudo add-apt-repository ppa:staticfloat/juliareleases\n\
  $ sudo add-apt-repository ppa:staticfloat/julia-deps\n$ sudo apt-get update\n$ sudo\
  \ apt-get install julia\n```\n\n使用此方法的主要优点是 Julia 将随已安装机器上的其他软件一起更新。\n\n要卸载 Julia，输入以下命令：\n\
  \n```\n$ sudo apt-get purge julia\n```\n\n要移除 Julia 仓库，使其在更新时不再尝试更新 Julia（请确保在移除仓库之前先卸载软件包），请使用以下代码片段：\n\
  \n```\n$ sudo add-apt-repository --remove ppa:staticfloat/juliareleases\n```\n\n\
  #### 在 Fedora/RHEL/CentOS/SL/OEL 上安装\n\n在这种情况下，可以使用 copr (Cool Other Package Repo)\
  \ [12] 仓库。该仓库为 Fedora 和 EPEL (RHEL/CentOS/SLES/OEL) 提供了 Julia 的 RPM 包。如果您使用的是 RHEL、CentOS、Scientific\
  \ Linux 或 Oracle Enterprise Linux（版本 5 或更高），请首先通过运行命令提示符为您的发行版版本启用 EPEL：\n\n```\n\
  $ sudo dnf copr enable nalimilan/julia\n```\n\n另一种方法是将可用的`.repo`文件复制到`/etc/yum.repos.d/`。最后，只需在终端中执行以下命令：\n\
  \n```\n$ sudo yum install julia\n```\n\n新版本每晚都会构建。如果您已经安装了 Julia 并希望升级到最新版本，请向终端发出以下命令：\n\
  \n```\n$ sudo yum upgrade julia\n```\n\n#### 从源码编译构建\n\n经验丰富的程序员通常更倾向于从源码编译构建，因为这需要具备在\
  \ Linux 中处理文件和更改权限的知识。Julia 的源代码托管在 GitHub 上[13]。因此，您的系统上需要安装`Git`[14]。完成此操作后，您必须首先满足依赖项[15]。以下说明也在`README`文件[16]中给出。\n\
  \n\n\n## 1.5 包安装\n\n除了 Julia 内置的函数外，用户还可以添加具有特定功能的包，甚至可以制作自己的包（随后发布给 Julia 社区）。主网站上提供了一个包列表。这显然是一个极其丰富的计算设施生态系统。目前已经存在用于各种计算任务的包，并且\
  \ Julia 社区会定期扩充这个列表。\n\n为了以干净的方式向 Julia 安装中添加和删除包，Julia 有一个内置的包管理器，但这需要有效的互联网连接。由于包管理器在内部使用\
  \ Git 来管理包仓库，用户在运行 `Pkg.add()`（安装包）时可能会遇到协议问题（例如，在防火墙后面）。可以通过命令行运行以下命令，告诉 Git 在克隆仓库时使用\
  \ HTTPS 协议而非 Git 协议：\n\n```\n$ git config --global url.\"https://\".insteadOf git://\n\
  ```\n\n### 1.5.1 包管理器初始化\n\n包管理器的初始化可以通过以下方式使用 `Pkg.init()` 来完成。首先，通过单击其图标打开 Julia\
  \ 应用程序。此时会打开一个 Julia 终端，其命令提示符为 `julia>`。我们在此处输入 Julia 命令。尝试以下操作：\n\n```\njulia>\
  \ Pkg.init()\n```\n\n该命令将输出有关包目录初始化的信息。\n\n### 1.5.2 更新包仓库\n\n假设我们要使用名为 `AlgebraicDiffEq`\
  \ 的包。其源代码可以在其 Git 地址找到。建议更新包仓库的元数据，以将包的版本更新到最新版本。因此，我们可以发出以下命令：\n\n```\njulia> Pkg.update()\n\
  ```\n\n根据您机器的状态，它将更新已安装包的版本。这可能需要相当长的时间，具体取决于您机器的速度和互联网连接。定期执行此命令是一个好的实践，以保持包处于最新状态。\n\
  \n### 1.5.3 安装新包\n\nJulia 包管理器是声明式的，而非命令式的。这意味着用户只需发出他们想要什么的命令。包管理器会找出要安装（或删除）的版本，以便最优且最小地满足这些需求。因此，用户只需将包名称添加到需求列表中。然后，包管理器会解决与其安装相关的问题。这意味着，如果某个包是因为之前版本的某个依赖而被安装，但新版本不再需要该依赖，那么更新时实际上会删除该包。\n\
  \n包的安装遵循以下模式：\n\n*   包需求位于文件 `~/.julia/v0.4/REQUIRE` 中。\n*   将要安装的包名称添加到此文件中。\n\
  *   然后调用 `Pkg.resolve()` 来解决依赖关系，以便最终安装。\n\n这些任务可以通过执行单个命令来完成：\n\n```\njulia> Pkg.add(\"\
  AlgebraicDiffEq\")\n```\n\n内置安装程序的一大优点是它会处理新安装的依赖树。依赖项列表可以在包的 `REQUIRE` 文件中找到。\n\
  \n### 1.5.4 移除包\n\n就像安装包非常容易一样，只需发出以下命令即可移除包：\n\n```\njulia> Pkg.rm(\"AlgebraicDiffEq\"\
  )\n```\n\n移除包的过程类似于其安装：\n\n*   包需求位于文件 `~/.julia/v0.4/REQUIRE` 中。\n*   将要移除的包名称从此文件中移除。\n\
  *   然后调用 `Pkg.resolve()` 来解决依赖关系，以便最终安装。\n\n`Pkg.add()` 和 `Pkg.rm()` 都是添加和移除单个包需求的便捷方式。然而，在处理多个包的情况下，我们建议使用\
  \ `Pkg.edit()`。发出此命令可以让用户手动编辑 `~/.julia/v0.4/REQUIRE` 的内容，更改内容，然后相应地更新他们的包。此过程只应由经验丰富的用户执行，因此我们在此不进行讨论。\n\
  \n### 1.5.5 已安装包的状态\n\n`Pkg.status()` 命令会输出您已安装包的状态摘要。例如，当在我的机器上运行此命令时，会生成以下输出：\n\
  \n```\njulia> Pkg.status()\n1 required packages:\n- IJulia                     \
  \       1.6.0\n9 additional packages:\n- BinDeps                           0.7.0\n\
  - Compat                            0.30.0\n- Conda                            \
  \ 0.7.0\n- Homebrew                          0.5.8\n- JSON                     \
  \         0.13.0\n- MbedTLS                           0.4.5\n- SHA             \
  \                  0.5.1\n- URIParser                         0.2.0\n- ZMQ     \
  \                          0.4.3\n```\n\n可以清楚地看到，所有已安装包的缓存正在更新以供后续使用。让我们看看更新包的过程：\n\
  \n*   更新包的第一步是拉取位于 `~/.julia/v0.4/METADATA` 文件的新更改，并查看是否有新的已注册包版本发布。\n*   接下来，`Pkg.update()`\
  \ 尝试通过从包的上游仓库拉取更改来更新已检出到分支且未“脏”（即 Git 跟踪的文件未被修改）的包。\n*   只有不需要合并或变基时（换句话说，如果分支可以快进），才会应用上游更改。\n\
  *   如果分支无法快进，则假定用户正在处理该分支，并将自行更新仓库。\n*   作为最后一步，更新过程会重新计算一组最优的包版本进行安装，以满足用户的顶级需求以及“固定”包的需求。\n\
  \n### 1.5.6 离线安装包\n\n如果无法连接互联网，可以通过将包根目录 `Pkg.dir()` 从具有相同操作系统和环境的机器上复制过来进行安装。发出\
  \ `Pkg.add()` 命令会在包根目录内执行以下操作：\n\n*   将包名称添加到 `REQUIRE`\n*   将包下载到 `.cache`，然后将包复制到包根目录\n\
  *   对包 `REQUIRE` 文件中列出的所有包递归执行第 2 步。运行 `Pkg.build()`\n\n## 1.6 使用本书中的代码\n\n本书中的代码可以直接在\
  \ Julia 提示符下编写，然后按 Enter 键执行。如果您使用 JuliaBox 或笔记本格式，可以同时按 Shift 和 Enter 键来执行 Julia\
  \ 单元格。注释以 `#` 符号开头。它们是可选的，仅有助于概念清晰。代码使用不同的字体呈现，以便于视觉区分。\n\nJulia 文件以 `.jl` 格式存储。如果编译器路径已正确定义，则可以通过运行以下命令来执行\
  \ Julia 文件：\n\n```\n$julia \n```\n\n使用本书的最佳方式是将其视为工作手册。阅读每个概念并运行随附的示例代码。尝试运行书中的代码，并推理出可能出现的错误和警告。最后，尝试编写自己的代码，以便更深入地理解该概念。\n\
  \n\n\n## 1.7 小结\n\n本章我们介绍了 Julia 编程语言的世界，并提供了在 Windows、Linux 和 MacOSX 操作系统上正确安装该语言的说明。随着计算资源和配置可用性的变化，这些说明可能会随时更新。因此，我们建议用户持续关注\
  \ Julia 语言官方网站 [9] 以获取最新版本的 Julia。在后续章节中，我们将探索 Julia 的结构，以便有效地使用它。\n\n"
- "# 2. 面向对象编程\n\n## 2.1 引言\n\nJulia 被设计成一种面向对象编程（OOP）语言。这一选择源于 OOP 语言在计算领域的巨大成功。在\
  \ OOP 中定义计算问题的便捷性使其成为一种著名的计算范式；因此，Julia 也采用了 OOP。要学习 Julia，了解 OOP 是前提条件。本章专门为此目的而设。\n\
  \n## 2.2 过程式编程 vs. 面向对象编程\n\n定义计算任务时，你可以定义一套固定的程序，通过数据块并根据过程的要求将它们连接起来，以解决问题。这种强调设定过程，而不考虑数据类型及其不同使用模式的范式，被称为过程式编程。另一方面，OOP\
  \ 则强调对象以及它们之间通过运算符建立的关系（运算符作用于对象，改变它们的值和其他属性以解决计算任务）。C++、Java 和 Python 都是 OOP 语言，Julia\
  \ 也是如此。\n\n## 2.3 OOP 的思想\n\n对象的概念源于对我们日常生活的观察。对象被理解为具有一组属性和一组相关行为的事物。这正是人类婴儿最初认识环境的方式。例如，婴儿会学到球（对象）有颜色、形状和大小（属性），并且它会滚动、打滑和弹跳（行为）。\n\
  \n20 世纪 70 年代初，施乐帕克研究中心（PARC）的艾伦·凯致力于 OOP 概念的研究 [1]。在研究名为 Smalltalk [2] 的编程语言时，他运用了\
  \ OOP 的思想。关键思想是基于将计算机编程应用于物理模拟。现实世界可以被想象成各种对象（具有属性和行为）相互作用。因此，在构建模拟世界时采用相同的想法是很自然的。所有基于\
  \ GUI 的系统都继承了凯在这些想法上的努力成果，如今所有主流编程语言都严格遵循这些理念。\n\n## 2.4 对象\n\n在 Julia 的世界里，一切都是对象。但什么是对象呢？对象是一个抽象概念，用来表示可以执行计算的实体。就像一个物理对象一样，计算机中的对象也有一组属性和一组相关行为。数字、字符串、图片、视频、文件等都可以被视为对象。在数字中，你可以将对象进一步细分为整数、浮点数和布尔数等子类，或者它们的有序或无序集合。在字符串中，你可以有字符、单词、句子等等。在文件中，可以有文本文件、媒体文件、数据文件、脚本文件等。\n\
  \n## 2.5 对象的类型\n\n每个对象都有一个关联的类型。类型决定了内存存储需求以及可以对对象进行何种计算操作。例如，`int` 和 `float` 是不同类型的对象，`int`\
  \ 存储整数，而 `float` 存储浮点数。这些类型将在后续章节中详细讨论。`float` 需要存储关于小数点前和小数点后数字位数的信息，而 `int` 对象则无需关心这些信息。类似地，复数存储在另一种对象类型中，恰当地命名为\
  \ `complex`，因为它需要存储复数的两个部分（即实部和虚部）。因此，它们在计算机内存中的存储方式必然大相径庭，并在后续计算中以非常不同的方式被使用。创建对象时必须声明其类型。除非明确指定，Julia\
  \ 会动态分配类型。对象的类型可以通过内置函数 `typeof()` 获取，该函数接受需要扫描类型的对象。\n\n让我们通过一个例子来测试这个概念。尽管对象的值在数值上都是\
  \ 1，但它们分别被存储为整数、浮点数和字符：\n\n```\njulia> a = 1\n\njulia> b = 1.0\n1.0\njulia> c =\
  \ '1'\n'1': ASCII/Unicode U+0031\n（类别 Nd: 数字，十进制数字）\njulia> typeof(a) # 64 位整数对象\n\
  Int64\njulia> typeof(b) # 64 位浮点数对象\nFloat64\njulia> typeof(c) # 字符对象\nChar\n```\n\
  \n整数对象与浮点对象和字符串截然不同。某些函数会明确要求特定类型的对象。在这些情况下，需要将它们相互转换。有时转换会很麻烦，偶尔甚至无法完成。有关转换问题的详细信息将在第\
  \ 3 章中借助数字对象进行概述。\n\n## 2.6 对象引用\n\nJulia 中的对象被表示为对计算机内存中某个对象的引用。“A”指向一个内存位置。这个内存位置可以通过内置函数\
  \ `pointer_from_objref(x)` 访问，其中 `x` 是对该对象的引用。类似地，可以通过函数 `sizeof(x)` 获取内存的字节大小。我们可以通过之前使用过的代码来理解这一点：\n\
  \n```\njulia> a = 1 # a 引用一个 Int64 类型的整数对象\n\njulia> b = 1.0 # b 引用一个 Float64 类型的浮点数对象\n\
  1.0\njulia> c = '1' # c 引用一个 Char 类型的对象\n'1': ASCII/Unicode U+0031\n（类别 Nd: 数字，十进制数字）\n\
  julia> typeof(a)\nInt64\njulia> typeof(b)\nFloat64\njulia> typeof(c)\nChar\njulia>\
  \ pointer_from_objref(a) # a 的内存地址\nPtr{Void} @0x000000011b8240a0\njulia> pointer_from_objref(b)\
  \ # b 的内存地址\nPtr{Void} @0x0000000120804e30\njulia> pointer_from_objref(c) # c 的内存地址\n\
  Ptr{Void} @0x0000000120a672e0\njulia> sizeof(a) # a 占用 8 字节（Int64）\n\njulia> sizeof(b)\
  \ # b 占用 8 字节（Int64）\n\njulia> sizeof(c) # c 占用 4 字节（Char）\n\n```\n\n命令 `whos()`\
  \ 会显示机器内存消耗的详细状态。例如，在编写本文时，我机器的状态显示如下：\n\n```\njulia> whos()\nBase  34434 KB   \
  \  Module\nCore  12485 KB     Module\nMain  41112 KB     Module\na         8 bytes\
  \  Int64\nans       4 bytes  Char\nb         8 bytes  Float64\nc         4 bytes\
  \  Char\n```\n\n机器的状态清楚地表明，除了 `Base`、`Core` 和 `Main` 模块之外，当前命名空间（或者简单来说，工作环境）中创建了四个引用：\n\
  \n*   `a`（对象的 `Int64` 数据类型占用 8 字节）\n*   `b`（对象的 `Float64` 数据类型占用 8 字节）\n*   `c`（对象的\
  \ `Char` 数据类型占用 4 字节）\n*   `ans`（对象的 `Char` 数据类型占用 4 字节）\n    *   `ans` 是自动创建的，引用\
  \ Julia 提示符下最后使用的对象。\n\n\n\n## 2.7 变量\n\n变量是与一个值相关联（或绑定）的名称，即对存储在内存位置中的数据的引用。数据被视为对象；变量引用或指向该对象。当代码运行时，对象的值可以被改变——因此得名“变量”。（换句话说，该对象能够在不同时间点存储不同的值。）例如，在以下代码中，名为\
  \ `a` 的变量可以存储一个整数，然后是另一个整数，接着是一个浮点数，一个字符串，最后是一个有理数。因此，`a` 的值可以是可变的。\n\n```\njulia>\
  \ a = 1 # 'a' 指向值为 1 的整数对象\n\njulia> a = 2 # 现在 'a' 指向一个新的整数对象\n### 值为 2\n\njulia>\
  \ a = 3.4 # 现在 'a' 指向一个新的浮点数\n### 对象，值为 3.4\n3.4\n\njulia> a = \"hi\" # 现在 'a' 指向一个字符串\n\
  ### 值为 \"hi\"\n\"hi\"\n\njulia> a = 1//2 # 现在 'a' 指向一个有理数\n### 1/2\n1//2\n```\n\n\
  ### 2.7.1 变量命名\n\n变量名是区分大小写的，并且在 Julia 中没有任何语义含义。因此，关键字不能用作变量名。Julia 提供了一个极其灵活的变量命名系统。甚至允许使用\
  \ Unicode 字符作为变量名。在 Julia REPL 和其他几个 Julia 编辑环境中，可以通过输入对应的 LaTeX 命令然后按 Tab 键来调用\
  \ Unicode 字符。例如，要给变量命名为 `α`，你需要输入 `\\alpha`，然后按 Tab 键就会看到 `α` 作为变量名。\n\n关于变量名有一些规则：\n\
  \n-   变量名必须以字母（A–Z 或 a–z）、下划线或大于 `00A0` 的 Unicode 码点子集开头。\n-   后续字符可以包括特殊字符（例如，`&`、`@`、`%`、`ˆ`、`#`\
  \ 等）和数字（0–9）或其他 Unicode 字符。\n-   关键字不允许用于变量命名。\n\n### 2.7.2 命名风格约定\n\n为了保持一致性，Julia\
  \ 提出了一种命名风格约定（这是建议性的，并非强制性的）。风格约定的主要方面如下：\n\n-   变量名使用小写字母书写。\n-   单词分隔可以用下划线（`_`）表示，但不鼓励使用下划线，除非名称在不用下划线时难以阅读。\n\
  -   类型和模块的名称以大写字母开头，单词分隔使用大写字母而不是下划线表示。\n-   函数和宏的名称是小写的，不带下划线。\n-   对其参数进行写入的函数，其名称以\
  \ `!` 结尾。这些函数有时被称为“更改”或“原地”函数，因为它们旨在调用函数后更改其参数，而不仅仅是返回一个值。\n\n## 2.8 总结\n\n在本章中，我们讨论了面向对象编程的基本范式，以及\
  \ Julia 如何真正证明其作为面向对象编程候选者的作用。处理对象使得任务模块化，因为计算的灵活性赋予了开发者自由，能够以多种方式探索计算任务的维度。不同的物理系统可以轻松模拟，因为您只需定义一个合适的计算对象，并将其属性声明为相关的函数（称为方法）。对象可以通过变量名来引用，并且通过引用调用可以轻松地更改值。\n\
  \n"
- "# 3. Julia 基础数学\n\n## 3.1 引言\n\n在本章中，我们将探讨如何使用 Julia 执行构成大多数计算任务基础的简单数学计算。理解本章内容需要具备高中水平的数学基础知识。本章将包含代表各种数学数字及其代数运算的图示，以及其他用于定义数学计算的运算。事实上，由于其简单的学习曲线，Julia\
  \ 在教授基础数学时被证明是一个不错的选择。\n\n需要指出的是，除了执行基本的数学计算外，Julia 也是高性能计算的一个好选择。高性能计算意味着使用超级计算机的普遍观念正在慢慢被取代，因为廉价而强大的计算能力已经很容易获得。一组树莓派计算机集群就是穷人的（经济上贫穷，学术上富有！）超级计算机。基于\
  \ GPU（图形处理单元）的迷你超级计算机现在已进入普通人的可及范围，但更快的编程语言的作用在此不容忽视。\n\n配备几 GHz 多核处理器和 2 到 8GB\
  \ 内存的笔记本电脑和台式机已成为全球标准。如果您能使用这些机器执行高性能计算，那么对昂贵计算系统的需求就过时了。这消除了经济困难社会结构中的研究人员和学生的根本障碍。如果解决方案能够在开源框架内呈现，则为其易访问性增加了价值。\n\
  \nJulia 编程语言满足了这些条件中的大部分。它是开源的，支持多并行处理，学习曲线平缓，并且其速度可与 C/C++ 媲美。因此，Julia 正迅速流行起来，尤其是在处理需要快速处理的海量数据的数据分析任务中。由于这类工作的基础是数学，让我们开始学习\
  \ Julia 如何在其基本框架内（不使用额外的包）处理基础数学。\n\n## 3.2 REPL\n\nJulia 在可执行文件中内置了一个功能齐全、交互式的命令行\
  \ REPL（读取-求值-打印-循环）。Julia 编程语言的交互式 shell 通常被称为 REPL，因为\n\n-   它读取用户输入的内容，\n-   编译器求值它读取的内容，\n\
  -   它在求值后打印出返回值，\n-   然后循环回到起点，再次执行。\n\n只要我们点击 Julia 快捷方式，就会得到 REPL 环境，如图 1-2 所示。提示符显示为\
  \ `julia>`，光标在此提示符处闪烁。它正在等待输入被读取和求值，然后它会打印求值的输出，并等待下一个输入。在计算世界中存在许多类似的环境。Linux 的\
  \ shell、Python 的交互环境、MATLAB 的交互环境等等，都遵循相同的理念。\n\n除了允许快速简便地求值 Julia 语句外，它还具有：\n\n\
  -   可搜索的历史记录，\n-   制表符补全，\n-   许多有用的快捷键绑定，以及\n-   专用的帮助和 shell 模式。\n\n### 3.2.1\
  \ Hello World！\n\n让我们输出字符串 `\"Hello World,\"`，这是计算世界的第一个程序：\n\n```\njulia> println(\"\
  Hello  World\")\nHello World\n```\n\n当你在命令提示符 `julia>` 处输入 Julia 命令 `println(\"\
  Hello World\")` 时，Julia 会读取这个语句，即它会搜索内置函数 `println` 并向其传递一个字符串（由一对引号括起来的字符定义）。Julia\
  \ 编译器会根据 `println` 函数的定义来求值这个语句。该函数仅仅在命令提示符上显示传递给它的是什么字符串。因此，求值 `println` 的结果会在控制台打印出单词\
  \ `Hello World`。一旦完成，环境就会返回到 Julia 提示符 `julia>`，等待下一个输入。\n\n\n\n### 3.2.2 REPL 中的输入与输出\n\
  \n让我们在 REPL 中尝试输入一些内容并观察输出：\n\n- 当我们在提示符后输入数字 `2` 时，它会被求值为值 `2`，从数学角度看，这像一个正整数。需要记住的是，在某些情况下，计算机中的值不一定完全等同于精确的数学量。\n\
  - 类似地，当我们在提示符后输入数字 `-2` 时，它会被求值为值 `-2`，从数学角度看，这像一个负整数。\n- 当我们在提示符后输入数字 `2.` 时，它会被求值为值\
  \ `2.0`，从数学角度看，这像一个正实数。因此，在 Julia 中，小数点前后的数字是可选的。\n- 当值 `2` 被传给内置函数 `println` 时，它会被求值为值\
  \ `2`。看起来什么都没发生，但事实并非如此。\n- 当数学表达式 `2 - 2.0` 被传给内置函数 `println` 时，它会计算该表达式并将输出打印为值\
  \ `0.0`。\n- 当数学表达式 `2 - 2.0` 以字符串形式传给内置函数 `println` 时，它会像之前打印字符串 `Hello World` 一样打印该字符串。\n\
  \n```\njulia> 2\n\njulia> -2\n\njulia> 2.\n2.0\njulia> println(2-2.0)\n0.0\njulia>\
  \ println(\"2-2.0\")\n2-2.0\n```\n\n可以看出，Julia 函数 `println` 会考虑到自身可能接收到不同类型的数据，并做出相应的处理。当接收到一个数学表达式时，它会按照数学规则对该表达式进行求值。当接收到相同的字符串时，它只是在终端提示符下方的屏幕上将其显示出来。让我们看看如果\
  \ `println` 接收到多个值（以逗号分隔）会发生什么：\n\n```\njulia> println(\"2-2.0\",\"@#%^&! \",2+2)\n\
  2-2.0@#%^&! 4\n```\n\n字符串 `\"2-2.0\",\"@#%^&!\"` 被原样打印，而数学表达式 `2 + 2` 则被求值。结果 `4`\
  \ 被打印在字符串之后，因为其作为函数输入的顺序如此。请注意，空格也是字符串中的字符之一，它也会被打印为一个空格。空格并非意味着打印一个白色的空白区域，而是指它不打印任何可见内容，即打印一个与终端背景颜色相同的空白区域。\n\
  \n### 3.2.3 制表符补全\n\n与 Linux 的 shell 以及 MATLAB 和 Python 的交互环境一样，Julia 的 REPL 也支持制表符补全。你可以输入函数或类型的前几个字符，然后按下\
  \ Tab 键，即可获得所有匹配项的列表：\n\n```\njulia> pri\nprimitive type    print_shortest    println\n\
  print             print_with_color\n```\n\n请注意，在输入 `pri` 后，你需要按下 Tab 键才能获取选项并获得如下所示的输出。如果找到一个唯一匹配项，它会自动补全；否则，它会打印所有可能的选项供你选择。这有助于减少语法错误，在编码时非常有用。\n\
  \n### 3.2.4 向 Julia 寻求帮助\n\n学习 Julia 的最好方法就是向这门语言本身寻求帮助！我们看到了函数 `println()` 的多种用法。假设我们想了解更多关于它的信息。你可以在\
  \ Julia 提示符后输入 `? println`。它会输出其用法的简要描述。一旦遇到 `?`，REPL 就会进入帮助模式（提示符从 `julia>` 变为\
  \ `?help>`），在该模式下，输入的任何内容都会在帮助文件中进行搜索：\n\n```\nhelp?> println\nsearch: println print_with_color\
  \ print\nprint_shortest sprint @printf isprint\nprintln(io::IO, xs...)\n打印（使用 print）xs\
  \ 后跟一个换行符。\n如果未提供 io，则打印\n到 STDOUT。\n```\n\n如果 REPL 找不到查询的匹配项，它会建议相似的词，假设用户输入时出现了错误：\n\
  \n```\nhelp?> clear\nsearch: clear! ClusterManager\n无法找到 clear\n您是不是想找 clear!，close，\n\
  clamp，cld，ceil，Cchar，cat，cor 或 Char\n未找到文档。\n绑定 clear 不存在。\n```\n\nTab 键的另一个用途是输入\
  \ LaTeX 数学符号，例如 `π`、`α`、`μ` 等。除了使用 ASCII [1] 字符（共 128 个）之外，Julia 还支持打印 Unicode [2]\
  \ 字符（超过 128,000 个）。\n\n### 3.2.5 Shell 模式\n\nLinux shell 命令对于执行进程非常有用。Julia REPL\
  \ 为此提供了一个 Shell 模式。分号 (`;`) 可激活 Shell 模式。可以通过在一行开头按 Backspace 键退出该模式：\n\n```\njulia>;\n\
  shell> ls\nApplications\nDesktop\nDocuments\nDownloads\n```\n\n### 3.2.6 搜索模式\n\n\
  所有执行过的行都会保存到一个历史记录文件中，可以对其进行搜索。为此，需要启用搜索模式。该模式通过同时按下 Control 键和 R 键来激活。命令提示符变为 `(reverse-i-search)'':`。现在，当输入查询内容时，搜索查询将显示在引号内。正如\
  \ `Ctrl+R` 激活反向搜索一样，`Ctrl+S` 则激活正向搜索。\n\n### 3.2.7 快捷键绑定\n\nJulia 将快捷键绑定作为 REPL\
  \ 操作的主要特性。表 3-1 列出了一些有用的快捷键绑定。\n\n表 3-1\n一些重要的快捷键绑定\n\n| `^D` | 退出（当缓冲区为空时） |\n\
  | `^C` | 退出（中断或取消） |\n| `^L` | 清空控制台屏幕 |\n| 回车/换行 | 新行，如果语句完整则执行 |\n| `?,;` | 进入帮助或\
  \ Shell 模式（当位于行首时） |\n| `^R,^S` | 增量历史搜索 |\n\n有关快捷键绑定的完整列表，建议用户参考参考文献 [3]。\n\n###\
  \ 3.2.8 版本信息\n\n`versioninfo()` 会打印特定机器上安装的 Julia 版本信息，如下例所示：\n\n```\njulia> versioninfo()\n\
  Julia Version 0.6.0\nCommit 903644385b (2017-06-19 13:05  UTC)\nPlatform Info:\n\
  OS: macOS (x86_64-apple-darwin13.4.0)\nCPU: Intel(R) Core(TM) i5-5250U CPU @ 1.60GHz\n\
  WORD_SIZE: 64\nBLAS: libopenblas (USE64BITINT DYNAMIC_ARCH NO_AFFINITY Haswell)\n\
  LAPACK: libopenblas64_\nLIBM: libopenlibm\nLLVM: libLLVM-3.9.1 (ORCJIT, broadwell)\n\
  ```\n\n## 3.3 与数字相关的一些实验\n\nJulia 因其在处理复杂数学计算时能完美处理数字的精细系统，而成为数值计算的绝佳工具。在尝试使用 Julia\
  \ 创建复杂的数学结构之前，理解数字在 Julia 世界中是如何定义的，对用户来说至关重要。\n\n### 3.3.1 数字系统\n\n数学中常用的数字系统有多种。例如：\n\
  \n- 整数：I = {…− 3, −2, −1, −, 1, 2, 3…}\n- 有理数：`{ p/q : p,q ∈ I, q ≠ 0 }`\n- 实数：`R\
  \ = { x : -∞ < x < ∞ }`\n- 复数：`{ a + bi : a,b ∈ R, i² = -1 }`\n\n在这些定义之上还定义了特殊的子集，例如自然数\
  \ {0, 1, 2...}、偶数、奇数、正数、非负数等等。从数学上讲，这些数字系统是自然嵌套的，因为整数是有理数，有理数是实数，而实数可以看作是复数的一部分。\n\
  \nJulia 将每个数字系统定义为一个数据类型。换句话说，Julia 创建了一类数字类型，并围绕其定义了相应的代数规则。用户必须理解 Julia 如何为特定数字定义类型，以便正确使用。除了本书之外，参考文献\
  \ [4] 也是一个极好的资源。\n\n\n\n### 3.3.2 Julia 作为计算器\n\n我们已经看到，Julia REPL 的行为就像计算器一样。你可以在终端中输入包含数字的特定计算式，它就会输出计算结果。\n\
  \n对于数字计算机来说，整数和实数的处理方式不同。因此，`5` 和 `5.0` 是两个不同的实体。相应地，当两个整数（如 `2` 和 `3`）相加时，结果是一个整数：\n\
  \n```\njulia> 2+3\n```\n\n需要注意的是，当 `2`（一个整数）和 `3.0`（一个实数）相加时，结果是一个整数（`5`）。\n\n```\n\
  julia> 2.+3\n```\n\n然而，当两个实数（`2.0` 和 `3.0`）相加时，结果是一个实数（`5.0`）。\n\n```\njulia> 2.+3.\n\
  5.0\n```\n\n复数 `A + iB` 在 Julia 中表示为 `A + B im`。其他语言使用字母 `i` 或 `j` 来表示复数的虚部，但 Julia\
  \ 特意用字母组 `im` 来实现这一目的，因为在循环中定义计数器时通常使用 `i` 和 `j`。\n\n当一个整数（或者实数）与一个复数相加时，结果是一个复数，但其分量（实部和虚部）会相应地发生变化：\n\
  \n```\njulia> 2 + (2+3im)\n4 + 3im\njulia> 2. + (2+3im) #实数是一个浮点数\n4 + 3im\njulia>\
  \ 2. + (2.0+3im) #复数的实部是浮点数\n4.0 + 3.0im\njulia> 2 + (2.0+3im)\n4.0 + 3.0im\n```\n\
  \n有理数包含分子和分母。Julia 使用命令 `Rational(A, B)` 来表示数学上的有理数 ![$$ \\frac{A}{B} $$](img/A458482_1_En_3_Chapter_IEq4.gif)。让我们检查一下有理数与其他类型数字相加时的行为：\n\
  \n```\njulia> Rational(2,3)\n2//3\njulia> Rational(2,3)+2\n8//3\n```\n\n因此，我们得到以下结果：\n\
  \n![$$ \\frac{2}{3}+2=\\frac{8}{3} $$](img/A458482_1_En_3_Chapter_Equa.gif)\n\n\
  让我们看看如果使用实数代替整数会发生什么：\n\n```\njulia> Rational(2,3)+2.0\n2.6666666666666665\n```\n\
  \n值得注意的是，输出结果不再表示为有理数，而是表示为一个实数：\n\n![$$ \\frac{2}{3}+2.0=2.6666666666666665 $$](img/A458482_1_En_3_Chapter_Equb.gif)\n\
  \n让我们检查一下有理数与复数相加时会发生什么：\n\n![$$ \\left(\\frac{2}{3}\\right)+\\left(2+3i\\right)=\\\
  frac{8}{3}+\\frac{3}{1}i $$](img/A458482_1_En_3_Chapter_Equc.gif)\n\n```\njulia>\
  \ Rational(2,3)+ (2+3im)\n8//3 + 3//1*im\n```\n\n正如数学上所预期的，结果被打印为一个复数，且其实部和虚部都用有理数表示。\n\
  \n以下示例演示了将有理数、复数和实数相加时会发生什么：\n\n![$$ \\left(\\frac{2}{3}\\right)+\\left(2+3i\\right)+3.0=5.666666666666666+3.0i\
  \ $$](img/A458482_1_En_3_Chapter_Equd.gif)\n\n```\njulia> Rational(2,3)+ (2+3im)\
  \ + 3.0\n5.666666666666666 + 3.0im\n```\n\n输出是一个复数，其中实部和虚部都用实数表示。\n\n让我们来看看无理数，比如\
  \ π 和 e，它们在 Julia 中预定义为 `pi` 和 `e`：\n\n```\njulia> pi\nπ = 3.1415926535897...\n\
  julia> e\ne = 2.7182818284590...\n```\n\n以下示例展示了它们与整数、有理数、复数和其他无理数相加时的行为：\n\n```\n\
  julia> e+pi\n5.859874482048838\njulia> e+2\n4.718281828459045\njulia> e+2.0\n4.718281828459045\n\
  julia> e+Rational(2,3)\n3.3849484951257116\njulia> e+(2+3im)\n4.718281828459045\
  \ + 3.0im\n```\n\n尝试用两个无理数 π 和 e 分别作为分子和分母来定义有理数将会失败：\n\n```\nRational(pi,e)\nERROR:\
  \ MethodError: no method matching Rational(::Irrational{:pi}, ::Irrational{:e})\n\
  ```\n\n这两个错误消息都表明在匹配输入错误类型时出现语法错误，并且发现这样做是不兼容的。\n\nJulia 中的布尔数用 `true` 和 `false`\
  \ 表示：\n\n```\njulia> true\ntrue\njulia> false\nfalse\n```\n\n将布尔数与任何类型的自然数相加通常是没有意义的，因为通常你会收到不兼容的错误消息。然而，在\
  \ Julia 中情况并非如此：\n\n```\njulia> true + 1\njulia> true + 0\njulia> true + 0.1\n1.1\n\
  julia> true + Rational(2,3)\n5//3\njulia> true + pi\n4.141592653589793\njulia> true\
  \ + (2 + 3im)\n3 + 3im\n```\n\n布尔数 `true` 和 `false` 具有数值 `1` 和 `0`。应当考虑到这一事实，以避免混淆和错误。\n\
  \n从这些简单的实验性计算中可以得出一个明显的结论：Julia 不仅起计算器的作用，它还能动态识别计算所用的数据类型并据此执行。换句话说，你不必像在用 C 和\
  \ C++ 编写代码时那样预先声明数据类型。Julia 会根据其值来识别数据类型。同样重要的是，Julia 会匹配数字的数据类型来执行特定操作。某些匹配是不兼容的。这表明了一种定义数据类型的层次结构。现在我们来更详细地探讨这些概念。\n\
  \n## 3.4 整数和实数的数据类型\n\n数字是数值数学的基本构件。为了将数字表示为计算机可计算的数量，需要将它们作为数据存储在计算机内存中。由于内存本质上是有限的，因此为各种数字类型（如整数、实数、复数等）分配了固定的内存空间。第\
  \ 3.3.2 节已简要讨论了这些数字类型的表示。下一节将详细讨论此主题。\n\n## 3.5 类型分配\n\n我们已经清楚，整数和其他数字在算术计算中的存储和处理方式是不同的。整数在分配的内存空间中是作为一个整体存储的，而实数是存储小数点前后的数字信息，有理数存储分子和分母的信息，复数存储其实部和虚部的信息。在这方面，Julia\
  \ 不同于 C 和 C++，因为它是一种动态类型语言。也就是说，数据类型不需要显式声明。Julia 会根据值来判断数据类型。如果在计算中混合了两种或多种数据类型，Julia\
  \ 还会在数据类型之间维护一个层次结构，以便为输出分配数据类型。\n\n如果我们有一台 64 位架构的机器，那么它可以为每个实体分配 64 位。但是，使用 64\
  \ 位来存储很小的值（比如 `0`）是否明智？自动分配面临着这种低效的计算方式。因此，是严格声明数据类型，还是让 Julia 自行处理，这仍由开发者决定。如果运用得当，这可以加快计算速度并减少内存空间的需求。\n\
  \n\n\n### 3.5.1 数字类型的层级树\n\n当你遇到多种数学数字的数据类型时，需要一个层级树来将一种数据类型转换为另一种。Julia 的数字类型系统层级树如图\
  \ 3-1 所示。其中一些数据类型已在本章前面介绍过，另一些可能看起来非常陌生。\n\n![A458482_1_En_3_Fig1_HTML.gif](img/A458482_1_En_3_Fig1_HTML.gif)\n\
  \n图 3-1 数字类型的层级树 [5]\n\n层级树的最顶层是 `Number` 类型。它有两个子类型：`Complex` 和 `Real`。前者没有子类型，而后者有进一步的子类型。这些子类型如下图所示：\n\
  \n- `AbstractFloat` 浮点数、`Integer`（整数）、`Irrational`（无理数）、`Rational`（有理数）。\n    -\
  \ `AbstractFloat` 有四个子类型：\n        - `BigFloat`：任意精度的十进制数\n        - `Float16`：16\
  \ 位精度的十进制数\n        - `Float32`：32 位精度的十进制数\n        - `Float64`：64 位精度的十进制数\n \
  \   - `Integer` 类型有三个子类型：\n        - `BigInt`：任意精度的整数\n        - `Bool`：布尔数\n  \
  \      - `Signed`：有符号整数\n            - `Int8`：8 位精度有符号整数\n            - `Int16`：16\
  \ 位精度有符号整数\n            - `Int32`：32 位精度有符号整数\n            - `Int64`：64 位精度有符号整数\n\
  \            - `Int128`：128 位精度有符号整数\n        - `Unsigned`：无符号整数\n            -\
  \ `UInt8`：8 位精度无符号整数\n            - `UInt16`：16 位精度无符号整数\n            - `UInt32`：32\
  \ 位精度无符号整数\n            - `UInt64`：64 位精度无符号整数\n            - `UInt128`：128 位精度无符号整数\n\
  \    - `Irrational`：无理数\n    - `Rational`：有理数\n\n#### 数字类型\n\nJulia 中有四种基本数字类型：\n\
  \n- `Int`\n- `Float`\n- `Rational`\n- `Complex`\n\n数字类型决定了它如何被存储，以及存储值与其所表示的数学值的精确程度。为了区分这些数字类型，Julia\
  \ 的解析器使用了以下易于理解的语法规则 [4]：\n\n- 整数没有小数点。\n- 浮点数有小数点（或采用科学计数法）。\n- 有理数通过双除法运算符 `//`\
  \ 从整数构造而成。\n- 复数通过包含虚数单位 `im` 的项来构成。\n\nJulia 中的抽象数据类型在定义层级结构时扮演着至关重要的角色，即使它们在定义计算时不直接起作用。抽象类型允许为不同的具体类型（如\
  \ `Int64`、`Float64`、`Complex`、`Rational` 等）编写通用代码。\n\n#### 精度\n\n多种数据类型的多样性使我们能够针对特定的数学计算选择合适的数字精度。要检查数据类型的精度，内置函数\
  \ `precision()` 会非常有用。它输出尾数（在 3.5.2 节中解释）中的有效位数：\n\n```\njulia> precision(BigFloat)\n\
  \njulia> precision(Float16)\n\njulia> precision(Float32)\n\njulia> precision(Float64)\n\
  \n```\n\n在不同数据类型之间进行转换可以节省计算机内存并加快计算速度，但代价是损失精度。开发人员必须利用本章提供的信息，提前做出这些决策。你并不总是需要更高的精度。例如，如果你在处理桥梁的尺寸，并且数字以米为单位表示，那么通常使用\
  \ ![$$ {\\frac{1}{10}}^{th}m $$](img/A458482_1_En_3_Chapter_IEq5.gif) 的精度就足够了。但如果你进行的计算涉及到埃（Å\
  \ = 10^(−9) 米）级别的精度，那么显然你需要更高的准确性和精确度。\n\n### 3.5.2 浮点运算\n\n实数在计算机中表示为浮点数。实数到计算机存储系统的映射是一种公式化的表示（称为浮点表示）[6]。在这里，实数被表示为三个部分：有效数、基数和指数。\n\
  \n例如，π 的值为 3.1415926535897…。假设对于一个特定的计算，我们只有四位有效数字，那么该值可以重写为 3.1415。现在这个数表示为 31415\
  \ × 10^(−4)，其中 31415 称为有效数，10 称为基数，-4 称为指数。\n\n在将数字赋值给有效数部分时，会用到有效数字位数的信息。一个数字的有效数字是那些对其测量分辨率有贡献、具有意义的数字。在前面的例子中，我们根据计算/测量的需求，仅假设了四位有效数字。术语“浮点”指的是一个数字的基数点（小数点）可以“浮动”；也就是说，它可以相对于该数字的有效数字放置在任何位置。这个位置由指数部分指示，因此浮点表示可以看作是一种科学计数法。\n\
  \n\n\n#### 如何存储浮点数\n\n计算机可以将数字存储为浮点数对象。一个浮点数对象按照以下方式存储数字：\n\n![$$ \\pm {d}_1{d}_2\\\
  dots {d}_s\\times {\\beta}^e $$](img/A458482_1_En_3_Chapter_Equ1.gif)\n\n其中 `d[i]\
  \ = 0, 1, 2…β − 1` 但 `d[1] ≠ 0`，且 `m ≤ e ≤ M`，这里 `m ∈ I⁻` 且 `M ∈ I⁺`。\n\n以下是浮点数的三个组成部分：\n\
  \n- 符号（`±`）\n- 有效数字（尾数）（`d[1] d[2] … d[s]`）\n- 指数（`β`）\n\n浮点数的每个部分都存储在不同的内存位置，并占用特定的位数。每个部分分配多少位？这些问题已由名为\
  \ IEEE754 的 IEEE 标准[[6]](#A458482_1_En_3_Chapter.html#Par249) 给出了答案。首先，让我们理解数字表示精度的概念。\n\
  \n1. 单精度：\n   - 占用 4 字节 = 32 位。（见图 3-2。）\n2. 双精度：\n   - 占用 8 字节 = 64 位。（见图 3-3。）\n\
  3. 扩展双精度：\n   - 占用 80 位。（见图 3-4。）\n4. 四精度：\n   - 占用 16 字节 = 128 位。（见图 3-5。）\n\n\
  ![A458482_1_En_3_Fig5_HTML.jpg](img/A458482_1_En_3_Fig5_HTML.jpg)\n\n图 3-5 — IEEE\
  \ 754 标准的四精度浮点数格式[[10]](#A458482_1_En_3_Chapter.html#Par253)\n\n![A458482_1_En_3_Fig4_HTML.jpg](img/A458482_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4 — IEEE 754 标准的扩展精度浮点数格式[[9]](#A458482_1_En_3_Chapter.html#Par252)\n\n![A458482_1_En_3_Fig3_HTML.jpg](img/A458482_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3 — IEEE 754 标准的双精度浮点数格式[[8]](#A458482_1_En_3_Chapter.html#Par251)\n\n![A458482_1_En_3_Fig2_HTML.jpg](img/A458482_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2 — IEEE 754 标准的单精度浮点数格式[[7]](#A458482_1_En_3_Chapter.html#Par250)\n\n每个版本都有一位用于表示数字的符号。其余位分配给有效数字和指数。由于计算机中的所有数字都以二进制形式存储，因此基数始终为\
  \ 2。根据可用于存储的位数，可以定义数据类型的最大数值。\n\n例如，如果有效数字有 `n` 位可用，那么最大值为 `2ⁿ`。对于整个数据类型，如果存储可用\
  \ `m` 位，且其中一位必须用于分配符号位，那么 `2ⁿ - 1` 是该数据类型可以存储的最大数值。每种数据类型的极限都趋向两个极端（正数和负数）。因此，超出极限会定义溢出和下溢错误。\n\
  \nJulia 遵循 IEEE745 系统定义的数据类型声明。表 3-2 讨论了该系统。\n\n**表 3-2 — Julia 的数字数据类型及其属性**\n\n\
  | 类型 | 有符号？ | 位数 | 最小值 | 最大值 |\n| --- | --- | --- | --- | --- |\n| `Int8` | 是 |\
  \ 8 | `-2⁷` | `2⁷` |\n| `UInt8` | 否 | 8 | 0 | `2⁸ - 1` |\n| `Int16` | 是 | 16 | `-2¹⁵`\
  \ | `2¹⁵` |\n| `UInt16` | 否 | 16 | 0 | `2¹⁶ - 1` |\n| `Int32` | 是 | 32 | `-2³¹`\
  \ | `2³¹` |\n| `UInt32` | 否 | 32 | 0 | `2³² - 1` |\n| `Int64` | 是 | 64 | `-2⁶³`\
  \ | `2⁶³` |\n| `UInt64` | 否 | 64 | 0 | `2⁶⁴ - 1` |\n| `Int128` | 是 | 128 | `-2¹²⁷`\
  \ | `2¹²⁷` |\n| `UInt128` | 否 | 128 | 0 | `2¹²⁸ - 1` |\n| `Float16` | 是 | 16 | `-2¹⁰\
  \ × 2⁵` | `-2¹⁰ × 2⁵` |\n| `Float32` | 是 | 32 | `-2²³ × 2⁸` | `2²³ × 2⁸` |\n| `Float64`\
  \ | 是 | 64 | `-2⁵² × 2¹¹` | `-2²⁰ × 2¹¹` |\n\n针对特定问题执行粗略计算非常重要，以便了解程序运行期间预期的最大值和最小值。据此，你可以分配数据类型。如果你不这样做，Julia\
  \ 将根据其自身规则进行分配，这可能会导致精度错误、下溢错误和溢出错误。\n\nJulia 提供了以二进制、八进制、十六进制或十进制数字输入数值的功能。可以使用\
  \ `typeof()` 函数来探知数据类型。让我们从整数开始。我的计算机安装的是 64 位操作系统和 64 位版本的 Julia 编译器。因此，我的系统默认字长为\
  \ 64 位。基于这些定义，让我们从小到大扫描整数：\n\n```\njulia> typeof(1234567890)\nInt64\njulia> typeof(-1234567890)\n\
  Int64\njulia> typeof(1234567890000000000000)\nInt128\njulia> typeof(-1234567890000000000000\n\
  0000000000000000)\nInt128\njulia> typeof(12345678900000000000000\n00000000000000000000000000)\n\
  BigInt\n```\n\nJulia 默认不会为所有正数分配 `UInt64` 数据类型。必须使用 `UInt64()` 函数进行声明。无符号整数使用 `0x`\
  \ 前缀和十六进制（基数为 16）数字 `0-9a-f` 进行输入和输出。（大写字母 `A-F` 也可用于输入。）无符号值的大小由所使用的十六进制位数决定：\n\
  \n```\njulia> typeof(0x1)\nUInt8\njulia> typeof(0x111)\nUInt16\njulia> typeof(0x11111111)\n\
  UInt32\njulia> typeof(0x11111111abcdef)\nUInt64\n```\n\n也支持二进制和八进制表示，如下所示：\n\n```\n\
  julia> typeof(0b1)\nUInt8\njulia> typeof(0b110111111)\nUInt16\njulia> typeof(0b110111111000000\n\
  111000101001)\nUInt32\njulia> typeof(0b110111111000000\n1110001010010101101010101010101)\n\
  UInt64\njulia> typeof(0o11111)\nUInt16\n```\n\n内置函数 `typemin()` 和 `typemax()` 可用于查找数据类型可以存储的最小值和最大值：\n\
  \n```\njulia> typemin(Int8)\n\njulia> typemin(UInt8)\n0x00\njulia> typemin(UInt64)\n\
  0x0000000000000000\njulia> typemin(Int64)\n\njulia> typemax(Int64)\n\njulia> typemax(Int128)\n\
  \njulia> typemin(Int128)\n\n```\n\n### 3.5.3 溢出和除法错误\n\n当一个比数据类型能存储的最大数字还大的数字被存储时，我们会遇到溢出错误消息。假设我们将最大可存储数字赋给一个名为\
  \ `a` 的变量，然后将其增加 1，并将新值存储到一个名为 `b` 的新变量中：\n\n```\njulia> a = typemax(Int64)\n\n\
  julia> b = a + 1\n\njulia> typemin(Int64)\n\njulia> c = a + 2\n\njulia> typeof(a)\n\
  Int64\njulia> typeof(b)\nInt64\njulia>  typeof(c)\nInt64\n```\n\n在整数的默认数据类型（即 `Int64`）内工作时，我们看到一种回绕行为，其中将最大值加\
  \ 1 会使其变为最小值。在数学中，模运算是整数的一种运算系统，其中数字在达到某个值后会“回绕”。Julia 整数的算术运算也遵循相同的概念。如果输入的数字大于特定数据类型定义的数字，则会显示错误消息：\n\
  \n```\njulia> Float64(2e900)\n错误：数值常量 \"2e900\" 溢出\n```\n\n\n\n### 3.5.4 浮点数与实数\n\
  \n你应该记住，浮点数是实数的抽象。有时这种抽象无法精确表示实数。\n\n用户必须判断，如果这种抽象的失败影响不大，他们仍然可以放心地使用浮点数进行计算，但需留意误差。几个例子可以阐明这一点：\n\
  \n1.  如果 `a,b,n ∈ ℜ ∃ c = (a + b)/n` 使得 `c ∈ ℜ`（ℜ 表示实数集合）\n    *   这本质上说明，任意两个实数之间，都存在另一个实数。\n\
  \    *   然而，这对浮点数并不成立，因为浮点数是以有限精度定义的。（参见第 3.5.1 节）\n2.  基于上述原因，浮点数是实数的近似值。\n   \
  \ *   `√7 × √7 − 7 = 0`，但 Julia 对该计算显示了一个很小的非零数，这是由于用于定义 `√7` 的浮点数的有限精度特性所致：\n\n\
  \        ```\n        julia> (sqrt(7)*sqrt(7))\n        7.000000000000001\n    \
  \    julia> (sqrt(7)*sqrt(7))-7\n        8.881784197001252e-16\n        ```\n\n\
  \    *   当定义为浮点数时，`(1/2 + 1/6) − 5/6 = 0` 的计算会出错。若将其转换为有理数类型，则计算正确：\n\n        ```\n\
  \        julia> 1//2 + 1//3 == 5//6\n        true\n        julia> (1//2+1//3)-(5//6)\n\
  \        0//1\n        julia> 1/2 + 1/3 == 5/6\n        false\n        julia> (1/2+1/3)-(5/6)\n\
  \        -1.1102230246251565e-16\n        ```\n\n3.  结合律属性在使用浮点数定义时可能不成立，但使用有理数数据类型时则成立：\n\
  \n    ```\n    julia> a = 1//10\n    1//10\n    julia> b = 2//10\n    1//5\n   \
  \ julia> c = 3//10\n    3//10\n    julia> a1 = 1/10\n    0.1\n    julia> b1 = 2/10\n\
  \    0.2\n    julia> c1 = 3/10\n    0.3\n    julia> (a+b)+c == a+(b+c)\n    true\n\
  \    julia> (a1+b1)+c1 == a1+(b1+c1)\n    false\n    ```\n\n### 3.5.5 机器精度\n\n这里需要解释机器精度的概念。机器精度是特定数据类型所能表示的最小数值。Julia\
  \ 提供了一个函数来查询这个值，即 `eps()`。尝试在 `help` 模式下搜索 `eps()`。相关文档相当具有说明性。如果数据类型记为 `T`，那么 `eps(T)`\
  \ 给出 1.0 与下一个更大的可表示的 `T` 类型浮点值之间的距离。\n\n```\njulia> eps(Float16)\nFloat16(0.000977)\n\
  julia> eps(Float32)\n1.1920929f-7\njulia> eps(Float64)\n2.220446049250313e-16\n\
  julia> eps(BigFloat)\n1.727233711018888925077270360632485e-77\n```\n\n## 3.6 任意精度算术\n\
  \n除了浮点精度，Julia 还通过封装 GNU 多精度算术库(GMP)和 GNU MPFR 库，提供了任意精度的算术功能。此处不详细讨论，因为一般用户不常需要这些信息。\n\
  \n对于整数，提供了 `BigInt` 数据类型；对于浮点数，提供了 `BigFloat` 数据类型，可以通过以下方式使用：\n\n```\njulia> a\
  \ = BigInt(typemax(Int64))\n\njulia> typeof(a)\nBigInt\njulia> a = BigFloat(1.0)\n\
  1.00000000000000000000\n\njulia> a = BigFloat(1.5)\n1.50000000000000000000\n```\n\
  \n当用户尝试将十进制字面量转换为浮点数时会遇到问题。例如：\n\n```\njulia> BigFloat(2.1)\n2.100000000000000088817\n\
  ```\n\n为克服此问题，建议使用 `big`。`big` 将数字转换为最大精度的表示形式（通常是 `BigInt` 或 `BigFloat`）：\n\n```\n\
  julia> a = big\"2.1\"\n2.0999999999999999999999\n\njulia> typeof(a)\nBigFloat\n\
  ```\n\n默认精度（通常为 256 位）和 `BigFloat` 的舍入模式可以通过 `with_bigfloat_precision()` 和 `with_rounding()`\
  \ 函数进行修改。\n\n## 3.7 数值转换\n\n当你想将一种数据类型转换为另一种时，必须意识到转换可能会导致误差。例如，浮点数转换为整数时必须进行舍入，从而产生舍入误差。舍入也有多种规则。此外，当较大的数字转换为较小容量的计算机内存格式时，会引入不精确性，这通过不精确错误来表示。\n\
  \nJulia 支持三种数值转换形式，它们在处理不精确转换时有所不同：\n\n| 名称 | 行为 | 返回类型 |\n| --- | --- | --- |\n\
  | `round(x)` | 将 `x` 舍入到最接近的整数 | `typeof(x)` |\n| `round(T,x)` | 将 `x` 舍入到最接近的整数\
  \ | `T` |\n| `floor(x)` | 向 `-Inf` 方向舍入 `x` | `typeof(x)` |\n| `floor(T,x)` | 向\
  \ `-Inf` 方向舍入 `x` | `T` |\n| `ceil(x)` | 向 `Inf` 方向舍入 `x` | `typeof(x)` |\n| `ceil(T,x)`\
  \ | 向 `Inf` 方向舍入 `x` | `T` |\n| `trunc(x)` | 向 0 方向舍入 `x` | `typeof(x)` |\n| `trunc(T,x)`\
  \ | 向 0 方向舍入 `x` | `T` |\n\n*   `T(x)` 或 `convert(T,x)` 将 `x` 转换为 `T` 类型的值\n   \
  \ *   假设我们希望将整数 3 转换为 `Float64`：\n\n        ```\n        julia> a = Int64(3)\n\n\
  \        julia> a1 = Float64(a)\n        3.0\n        julia> a2 = Int64(a1)\n\n\
  \        julia> a3 = Int8(a2)\n\n        julia> a4 = convert(Float64,a3)\n     \
  \   3.0\n        julia> a5 = convert(Int8,a4)\n        ```\n\n    *   如果 `T` 是浮点类型，结果是最近的可表示值，可能是正无穷或负无穷。\n\
  \    *   如果 `T` 是整数类型，且 `x` 不能被 `T` 表示，则会引发 `InexactError`。\n\n        ```\n   \
  \     julia> a = 2.1\n        2.1\n        julia> typeof(a)\n        Float64\n \
  \       julia> a1 = BigInt(a)\n        julia> a1=BigInt(a)\n        ERROR: InexactError()\n\
  \        Stacktrace:\n        [1] convert(::Type{BigInt}, ::Float64) at ./gmp.jl:162\n\
  \        [2] BigInt(::Float64) at ./sysimg.jl:24\n        julia> a1 = Int64(a)\n\
  \        ERROR: InexactError()\n        Stacktrace:\n        [1] convert(::Type{Int64},\
  \ ::Float64) at ./float.jl:679\n        [2] Int64(::Float64) at ./sysimg.jl:24\n\
  \        ```\n\n*   `x % T` 将整数 `x` 转换为整数类型 `T` 的一个值，该值与 `x` 模 `2^n` 同余，其中 `n` 是\
  \ `T` 的位数。换句话说，二进制表示被截断以适应。\n    *   由于 127 是 `Int8` 类型（2⁷ − 1 = 127）能存储的最大数，当数字\
  \ 128 需要转换为 `Int8` 数据类型时，其位数将被截断以适应。\n\n    ```\n    julia> a = 128 % Int8\n\n \
  \   julia> a1 = 127 % Int8\n    ```\n\n*   舍入函数 `Rounding off` 接受一个可选参数 `T`。例如，`round(Int,x)`\
  \ 是 `Int(round(x))` 的简写：\n\n    ```\n    julia> round(Int8,127.2)\n\n    julia>\
  \ round(Int8,125.9)\n\n    julia> round(127.2)\n    127.0\n    julia> round(125.9)\n\
  \    126.0\n    julia> Int8(round(127.2))\n\n    julia> Int8(round(125.9))\n   \
  \ ```\n\n*   其他舍入函数包括 `floor()`、`ceil()` 和 `trunc()`。以下是示例代码：\n\n```\njulia> round(2.6)\n\
  3.0\njulia> round(Int8,2.6)\n\njulia> floor(2.6)\n2.0\njulia> floor(Int8,2.6)\n\n\
  julia> ceil(2.6)\n3.0\njulia> ceil(Int8,2.6)\n\njulia> trunc(2.6)\n2.0\njulia> trunc(Int8,2.6)\n\
  ```\n\n\n\n## 3.8 算术运算符\n\n除了定义数学数字外，用户还必须定义诸如`+,-,*, and /`之类的算术运算符，以便根据数据类型的代数规则执行算术计算。\n\
  \n下面通过一些例子来说明这一点：\n\n| 运算符符号 | 名称 | 行为 |\n| --- | --- | --- |\n| `+a` | 一元正号 | 恒等运算\
  \ |\n| `-a` | 一元负号 | 将值映射为`a`的加法逆元 |\n| `a+b` | 二元加法 | 执行 `a` 加 `b` |\n| `a-b` |\
  \ 二元减法 | 执行 `a` 减 `b` |\n| `a*b` | 乘法 | 执行 `a` 乘以 `b` |\n| `a/b` | 除法 | 返回 `a` 除以\
  \ `b` 所得的商 |\n| `a\\b` | 反除法 | 返回 `b` 除以 `a` 所得的商 |\n| `a%b` | 取余 | 返回 `a` 除以 `b`\
  \ 所得的余数 |\n| `a^b` | 幂运算 | 计算 a ^ b |\n\n```\njulia> a = 1.0\n1.0\n```\n\n```\n\
  julia> b = 1.5\n1.5\njulia> +a # 恒等运算不改变值\n1.0\njulia> -a # 返回 1.0 的加法逆元 -1.0\n\
  -1.0\njulia> a+b # 1.0+1.5 = 2.5\n2.5\njulia> a-b # 1.0-1.5 = -0.5\n-0.5\njulia>\
  \ a*b # 1.0 乘以 1.5 等于 1.5\n1.5\njulia> a/b # 1.0/1.5 的商是 0.66 ...\n0.6666666666666666\n\
  julia> a\\b # 1.5/1.0 的商是 1.5\n1.5\njulia> a%b # 1.0/1.5 的余数是 1.0\n1.0\njulia> a^b\
  \ # 1.0 的 1.5 次幂是 1.0\n1.0\n```\n\n## 3.9 布尔数值\n\n布尔数值与布尔代数共同构成了现代计算的基石。乔治·布尔（George\
  \ Bool）发明了布尔代数，用于处理布尔数值（`true` 和 `false`）以及诸如 `AND`、`OR`、`NOT` 和 `XOR` 之类的布尔运算符。它们可用于量值的比较，以及构建逻辑语句并判断其真值。\n\
  \n### 3.9.1 数学量值的比较\n\nJulia 中存在两个逻辑数值，即 `true` 和 `false`，可用于执行布尔算术运算。在最简单的形式中，它们可用于检查量值之间的不等关系和相等关系。\n\
  \n```\njulia> a = 1.0\n1.0\njulia> b = 1\n\njulia> a == b # 1.0 和 1 的值都是 1\ntrue\n\
  julia> a!=-b # 从数学上看，1.0 不等于 -1\ntrue\njulia> a   a  a  >  b  #  因为数学上 1.0=1\nfalse\n\
  julia> a>= b # 因为至少相等关系成立\ntrue\n```\n\n下面列出了已经探索过的运算符：\n\n| 运算符符号 | 含义 |\n| ---\
  \ | --- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `<` | 小于 |\n| `<=` | 小于或等于 |\n| `>`\
  \ | 大于 |\n| `>=` | 大于或等于 |\n\n对于计算机来说，整数的比较很简单，因为它只需比较位值。在这方面，浮点数略有不同。它们是根据 IEEE754\
  \ 标准进行比较的：[6]\n\n*   正零等于但不大于负零。\n*   `Inf` 等于自身，并且大于除 `NaN` 之外的任何值。\n*   `-Inf`\
  \ 等于自身，并且小于除 `NaN` 之外的任何值。\n*   `NaN` 不等于、不小于、也不大于任何值，包括其自身。\n\n可以轻松验证这些陈述，如下所示：\n\
  \n```\njulia> +0.0 == 0.0 # 正零与零相同\ntrue\njulia> +0.0 == -0.0 # 正零与负零相同\ntrue\n\
  julia> +0.0  +0.0 > -0.0\nfalse\njulia> Inf == -Inf # 正无穷不等于负无穷\nfalse\njulia> Inf\
  \ > Inf # 正无穷不大于自身\nfalse\njulia> Inf > -Inf # 正无穷大于负无穷\ntrue\njulia> NaN  ==  Inf\
  \ # Inf 和 NaN 不能按值进行比较\nfalse\njulia> Inf >  NaN\nfalse\njulia> -Inf > NaN\nfalse\n\
  julia>  -NaN\nNaN\njulia> NaN  >  Inf\nfalse\njulia> NaN > -Inf\nfalse\njulia> NaN\
  \ == NaN # 两个 NaN 值不相同\nfalse\njulia> NaN != NaN\ntrue\njulia> NaN  NaN >= NaN\n\
  false\njulia> NaN > NaN\nfalse\njulia> NaN > NaN\nfalse\n```\n\n为了避免不同数据类型下运算符行为的不一致，Julia\
  \ 提供了一些内置函数。\n\n| 函数 | 行为 |\n| --- | --- |\n| `isequal(x,y)` | `x` 和 `y` 完全相同 |\n\
  | `isfinite(x)` | `x` 不是 `Inf` 或 `-Inf` |\n| `isinf(x)` | `x` 等于 `Inf` 或 `-Inf`\
  \ |\n| `isnan(x)` | `x` 等于 `NaN` |\n\n```\njulia> isequal(1.0, 1)\ntrue\njulia>\
  \ isfinite(Inf)\nfalse\njulia> isfinite(-Inf)\nfalse\njulia> isfinite(1.0)\ntrue\n\
  julia> isinf(Inf)\ntrue\njulia> isinf(-Inf)\ntrue\njulia> isinf(1.0)\nfalse\njulia>\
  \ isnan(NaN)\ntrue\njulia> isnan(Inf)\nfalse\njulia> isnan(-Inf)\nfalse\njulia>\
  \ isnan(1.0)\nfalse\n```\n\n### 3.9.2 比较链\n\n在 Julia 中，比较可以任意链接：\n\n```\njulia>\
  \ 1 < 2 > 3\nfalse\n```\n\n`1<2>3`可以这样理解：首先将`1<2`赋值给`a`，其值为`true`，然后计算`a>3`，结果为`false`：\n\
  \n```\njulia> a=1<2\ntrue\n\njulia> a > 3\nfalse\n```\n\n除非使用括号，否则链式比较中的求值顺序是未定义的。该语句从右侧开始读取，并将连续的比较结果串联起来。\n\
  \n括号内的表达式会优先计算。括号内的表达式也是从右侧开始读取，并将连续的比较结果串联起来。示例如下：\n\n```\njulia> (1<2)<(3==3)\n\
  false\njulia> 1<2<3==3\ntrue\njulia> true>true\nfalse\njulia> (1<2)>(3>3)\ntrue\n\
  julia> 3>3\nfalse\njulia> true>false\ntrue\n```\n\n### 3.9.3 布尔运算符\n\n`AND` (`&`)、`NOT`\
  \ (`!` 或 `~`)、`XOR` (`$`) 和 `OR` (`|`) 运算符可用于构建复杂的逻辑语句。值得注意的是，布尔运算符多数是按位运算符。也就是说，在执行比较操作时，它们按位进行运算。\n\
  \n| 表达式 | 行为 |\n| --- | --- |\n| `~a` | 按位 `NOT`（`NOT` a） |\n| `a & b` | 按位 `AND`（a\
  \ `AND` b） |\n| `a | b` | 按位 `OR`（a `OR` b） |\n| `a $ b` | 按位 `XOR`（a `XOR` b） |\n\
  | `a >>> b` | 逻辑右移 |\n| `a >> b` | 算术右移 |\n| `a << b` | 逻辑/算术左移 |\n\n逻辑移位是一种对操作数的所有位进行移位的按位运算。另一方面，算术移位也是一种移位运算符，有时称为有符号移位（尽管它不限于有符号操作数）。这两个运算符都可以定义为向左或向右移位。\n\
  \n对于二进制数来说，它是一种按位运算。（换句话说，它将操作数的所有位按给定的位数进行移位。）空出的位会被填充。与逻辑移位中全部填充 0 不同，在向右移位时，最左边的位（通常是有符号整数表示中的符号位）会被复制以填充所有空出的位置（这是一种符号扩展）。\n\
  \n我们先扫描一下基本的布尔运算符，然后理解按位移位运算符。首先定义名为 `a` 和 `b` 的变量来保存布尔值 `true` 和 `false`。使用布尔运算符，可以构建简单以及复杂的逻辑语句来获得结果：\n\
  \n```\njulia> a = Bool(true)\ntrue\njulia> b = Bool(false)\nfalse\njulia> !a # NOT\
  \ 运算符\nfalse\njulia> ∼a # 按位非\nfalse\njulia> a & b # AND 运算符\nfalse\njulia> a |\
  \ b # OR 运算符\ntrue\njulia> a $ b # XOR 运算符\ntrue\njulia> a & (a | b) & a # 一个复杂的逻辑语句\n\
  true\n```\n\n\n\n## 3.10  更新运算符\n\n每个二元算术运算符和位运算符也都有一个更新版本。这些运算符会将运算结果重新赋值给其左操作数。\n\
  \n它们的定义相当简单。二元运算符的更新版本是通过在运算符后立即加上一个 `=` 形成的。\n\n| 表达式 | 行为 |\n| --- | --- |\n|\
  \ `a+=1` | `a = a+1` |\n| `a-=1` | `a = a-1` |\n| `a*=2` | `a = a*2` |\n| `a/=2`\
  \ | `a = a/2` |\n| `a\\=2` | `a = 2/a` |\n| `a%=2` | `a = a%2` |\n| `a^=2` | `a\
  \ = a²` |\n| `a!=a` | `a = !a` |\n| `a&=2` | `a = a&a` |\n| `a&#124;=a` | `a = a\
  \ &#124; a` |\n\n```\njulia> a = 1.5\n1.5\njulia> a+=1 # a 现在的值为 1.5+1 = 2.5\n2.5\n\
  julia> a-=1 # a 现在的值为 2.5-1=1.5\n1.5\njulia> a*=2 # a 现在的值为 1.5*2=3.0\n3.0\njulia>\
  \ a/=2 # a 现在的值为 3.0/2 = 1.5\n1.5\njulia> a\\=2 # a 现在的值为 2/1.5 = 1.33 ...\n1.3333333333333333\n\
  julia> 2/1.5 # 验证\n1.3333333333333333\njulia> a=10 # 将 a 重新定义为 10\n\njulia> a%=2\
  \ # a 现在的值为 10%2 = 0\n\njulia> 10%2  #  验证\n\njulia> a=10 # 将 a 重新定义为 10\n\njulia>\
  \ a^=2 # a 现在的值为 10² = 100\n\njulia> a = Bool(true) # a 被定义为布尔值 true\ntrue\njulia>\
  \ a!=a # a 被更新为 (NOT a)，因此得到值 false\nfalse\njulia> a # 验证 a 的值为 false\nfalse\njulia>\
  \ a&=a # a 被更新为值 (a&a)\n### 即 false&false\nfalse\njulia> a|=a # a 被更新为值\n### (a|a)\
  \ 即 false|false\nfalse\njulia> a$=a # a 被更新为值\n$(a$a) 即 false$false\nfalse\n```\n\
  \n值得注意的是，更新运算符会重新绑定左侧的变量。因此，变量的类型可能会改变。\n\n```\njulia> a = UInt8(12)\n0x0c\njulia>\
  \ typeof(a)\nUInt8\njulia> a ^= 200.5\n2.375963871483476e216\njulia> typeof(a)\n\
  Float64\n```\n\n## 3.11  运算符优先级\n\n为了使用数学数字进行数学计算，编程语言定义运算符优先级非常重要。例如，如果我们要计算\n\n\
  `2+3*5/2³.5`\n\n我们必须理解结果取决于数学函数运算的顺序。让我们在 Julia 控制台上尝试计算：\n\n```\njulia> 2+3*5/2³.5\n\
  3.3258252147247767\n```\n\n现在让我们理解为了得到这个值，运算符的应用顺序。根据 Julia 文档 [13]，以下是定义的运算符优先级：\n\
  \n| 符号 | 含义 |\n| --- | --- |\n| `^` | 乘方 |\n| `//` 和 `\\\\` | 分数 |\n| `* / % & \\\
  ` | 代数运算 |\n| `+ - | $` | 加法 |\n| `> < >= <= == === != !== <:` | 比较 |\n\n```\njulia>\
  \ 2+3*5/2³.5\n3.3258252147247767\njulia> 2³.5 # 首先应用乘方\n11.31370849898476\njulia>\
  \ ans # ans 存储了上一个计算值\n11.31370849898476\njulia> 5/ans # 除法运算符\n0.4419417382415922\n\
  julia> ans*3 # 乘法运算符\n1.3258252147247767\njulia> ans+2 # 加法\n3.3258252147247767\n\
  ```\n\n运算符优先级逻辑遵循著名的数学运算法则 BEDMAS（括号—乘方—除法—乘法—加法—减法）。建议对需要单独计算的数字使用括号。例如：\n\n`(2+3)*(5/2)³.5`\n\
  \n将首先计算每个括号内的计算，然后应用运算符优先级。因此结果会不同：\n\n```\njulia>   (2+3)*(5/2)³.5\n123.52647110032733\n\
  julia> 5/2 # 首先计算括号内的 5/2 和 2+3\n2.5\njulia> ans³.5 # 接下来执行乘方\n24.705294220065465\n\
  julia> ans*(5) # 结果乘以 (2+3) = 5\n123.52647110032733\n```\n\n## 3.12  小结\n\n本章讨论了\
  \ Julia 执行数学任务的方式。它为各种数字类型提供了多种对象。每个对象都有特定的方法来处理数学运算符。了解运算符与特定数据的用法，可以让您有意义地决定如何使用它们。数字系统的层次结构也必须全面理解，因为转换规则决定了数字在计算任务中如何处理。决定使用特定的数据类型进行计算需要在精度和内存使用之间进行有效的权衡。运算符优先级是本章讨论的另一个重要任务，因为它决定了最终结果。此外，Julia\
  \ REPL 及其各种模式在执行数学计算时也很有用。\n\n"
- '# 4. 复数


  ## 4.1 引言


  在初步了解基本的数学结构之后，您现在需要理解如何处理复数。涉及复数的计算几乎出现在科学和数学的所有分支中。所有基于 Julia 的数值计算开发人员都必须理解定义复数及其数学运算的各种方法，以便高效计算。


  复数世界涵盖了重要的科学领域。当用于描述现实时，它们比实数更能丰富地描绘物理现象。每一种声称能稳健执行数学计算的编程语言都必须能轻松处理复数。Julia 确实是这样一种语言。复数可以用简单的术语定义，并且提供了大部分处理它们的函数。此外，它们与其他数据类型在计算中的使用非常灵活且完美无瑕。这些品质使其成为执行复杂分析任务的最佳选择之一。




  ## 4.2 定义复数


  定义复数的首要任务是定义复数的符号 ![](img/A458482_1_En_4_Chapter_IEq1.gif)。一个由 `im` 表示的全局常量被用来代表
  `i`。这表示主值 ![](img/A458482_1_En_4_Chapter_IEq2.gif)。数学家通常使用字母 `i` 和 `j` 来表示 `i`，但这些字母在计算机科学学院中也广泛用于表示索引变量。为了避免混淆，选择了符号
  `im` 而不是 `i` 或 `j`。


  因此，复数 `1 + 4i` 可以写成如下形式：


  ```

  julia> a = 1+4im

  1 + 4im

  julia> real(a)


  julia> imag(a)


  ```


  该复数的实部是 `1`，虚部是 `4i`。在 Julia 中，复数存储为两个数：`re`（实部）和 `im`（虚部）。两者都是某种类型的实数。可以通过函数 `real()`
  和 `imag()` 获取它们。


  创建复数对象的另一种方法是使用 `complex()`、`complex32()`、`complex64()` 和 `complex128()` 函数：


  ```

  julia> a = 3.5 # 定义 "a"

  3.5

  julia> b = -4.9 # 定义 "b"

  -4.9

  julia> z = complex(a,b) # 创建复数

  ### a 作为实部，b 作为虚部

  3.5 - 4.9im

  julia> typeof(z)

  Complex{Float64}

  julia> typeof(real(z)) # 实部存储为

  ### Float64 对象

  Float64

  julia> typeof(imag(z)) # 虚部存储为

  ### Float64 对象

  Float64

  julia> z1 = Complex32(a,b) # 复数的

  ### 32 位存储

  Float16(3.5) - Float16(4.9)im

  julia> typeof(real(z1)) # z1 将实部存储为

  ### Float16 对象

  Float16

  julia> typeof(imag(z1)) # z1 将虚部存储为

  ### Float16 对象

  Float16

  julia> z2 = Complex64(a,b) # 复数的

  ### 64 位存储

  3.5f0 - 4.9f0im

  julia> typeof(real(z2)) # z2 将实部存储为

  ### Float32 对象

  Float32

  julia> typeof(imag(z2)) # z2 将虚部存储为

  ### Float32 对象

  Float32

  julia> z3 = Complex128(a,b) # 复数的

  ### 128 位存储

  3.5 - 4.9im

  julia> typeof(real(z2)) # z3 将实部存储为

  ### Float64 对象

  Float64

  julia> typeof(imag(z2))# z3 将虚部存储为

  ### Float64 对象

  Float64

  ```


  值得注意的是，实部和虚部的数据类型会根据定义函数的定义而保留，其转换规则与用于整数和实数的规则类似。


  ## 4.3 复数的性质


  复数以图形方式定义，如图 4-1 所示。在基于实-虚轴的复平面上，一个特定的点由复数 `a + ib` 定义，其中 `a` 是该点在实轴上的投影大小，`b` 是该点在虚轴上的投影大小。


  图 4-1 展示了一个表示复数 `z = x + iy` 的点，并演示了 `r = |z|`（绝对值）和 `ϕ`（幅角）的值是如何给出的。


  (4.1) `r = sqrt(x² + y²)`


  (4.2) `ϕ = tan^{-1}(y/x)`


  ![A458482_1_En_4_Fig1_HTML.jpg](img/A458482_1_En_4_Fig1_HTML.jpg)


  **图 4-1** 在复平面上描绘的复数 [1]


  一个复数的绝对值就是它到原点的距离。一个复数的幅角就是它与水平轴沿逆时针方向所成的角度。


  对于一个复数，例如 `z = -4 + 3i`，其主值和幅角（以弧度为单位）可以使用 Julia 计算：


  ```

  julia> z = -4 + 3im

  -4 + 3im

  julia> r = abs(z)

  5.0

  julia> r_squared = abs2(z)


  julia> phi = angle(z)

  2.498091544796509

  julia> z = -4 + 3im

  -4 + 3im

  julia> z_conjugate = conj(z)

  -4 - 3im

  julia> abs2(z) == z*z_conjugate

  true

  ```


  一个复数的共轭是其沿水平轴的镜像。换句话说，它的虚部是原数的相反数。当与其共轭相乘时，结果为 `r²`，这由上述代码的最后一行验证。


  `Inf` 和 `NaN` 会通过复数的实部和虚部进行传播。我们来处理三个复数：`z1 = complex(NaN,Inf)`、`z2 = complex(Inf,NaN)`
  以及一个简单的复数 `z3 = complex(1,2)`。然后，让我们计算 `z1+z2`、`z2+z3` 和 `z1+z3`，以测试如何处理包含 `NaN`
  和 `Inf` 的复数：


  ```

  julia> z1 = complex(NaN,Inf)

  NaN + Inf*im

  julia> z2 = complex(Inf,NaN)

  Inf + NaN*im

  julia> z3 = complex(1,2)

  1 + 2im

  julia> z1+z3

  NaN + Inf*im

  julia> z2+z3

  Inf + NaN*im

  julia> z1+z2

  NaN + NaN*im

  ```




  ### 复数运算


  复数运算涉及与之前第 4 章讨论的实数运算类似的操作。这些运算包括加法、减法、乘法、除法、乘方等。然而，这些运算的规则对于复数来说略有不同。


  两个复数相加涉及将它们的实部和虚部分别相加。减法也是如此。假设我们按如下方式定义两个复数：


  ![$$ {\displaystyle \begin{array}{l}{z}_1={a}_1+{b}_1i\\ {}{z}_2={a}_2+{b}_2i\end{array}}
  $$](img/A458482_1_En_4_Chapter_Equa.gif)


  现在我们可以如下定义它们的加法和减法：


  ![$$ {\displaystyle \begin{array}{l}{z}_1+{z}_2=\left({a}_1+{a}_2\right)+\left({b}_1+{b}_2\right)i\\
  {}{z}_1-{z}_2=\left({a}_1+{a}_2\right)-\left({b}_1+{b}_2\right)i\end{array}} $$](img/A458482_1_En_4_Chapter_Equb.gif)


  复数的乘法和除法运算并非如此直接：


  ![$$ {z}_1\times {z}_2=\left({a}_1\times {a}_2\right)+\left({a}_1\times {b}_2\right)i+\left({a}_2\times
  {b}_2\right)+\left({b}_1\times {b}_2\right)\left({i}²\right) $$](img/A458482_1_En_4_Chapter_Equc.gif)


  通过合并实部和虚部项，这个式子可以简化，因为![$$ {i}²=-1 $$](img/A458482_1_En_4_Chapter_IEq3.gif)：


  ![$$ {z}_1\times {z}_2=\left({a}_1{a}_2-{b}_1{b}_2\right)+\left({a}_1{b}_2+{a}_2{b}_1\right)i
  $$](img/A458482_1_En_4_Chapter_Equd.gif)


  复数与实数的乘法和除法可以通过分别对实部和虚部执行乘法或除法来更简单地进行。


  复数 ![$$ {z}_1={a}_1+{b}_1i $$](img/A458482_1_En_4_Chapter_IEq4.gif) 的共轭复数定义为 ![$$
  {z}_1^{\ast }={a}_1-{b}_1i $$](img/A458482_1_En_4_Chapter_IEq5.gif)。从几何角度看，z[1]^*
  是 z[1] 关于实轴的“反射”。因此，如果计算两次共轭，我们就会得到原数：![$$ {\left({z_1}^{\ast}\right)}^{\ast }={z}_1
  $$](img/A458482_1_En_4_Chapter_IEq6.gif)。


  复数的除法可以如下使用其共轭数进行：


  ![$$ \frac{a_1+{b}_1i}{a_2+{b}_2i}=\frac{a_1+{b}_1i}{a_2+{b}_2i}\times \frac{a_2-{b}_2i}{a_2-{b}_2i}=\frac{a_1\kern0.125em
  {a}_2+{b}_1{b}_2}{a_2²+{b_2}²}+\frac{b_1\kern0.125em {a}_2-{a}_1{b}_2}{a_2²+{b_2}²}i
  $$](img/A458482_1_En_4_Chapter_Eque.gif)


  因此，将分母的共轭复数与分子和分母相乘，会得到一个新的复数，该复数就是两个复数相除的结果。


  Julian 运算符，如 `+`、`-`、`*`、`^` 和 `/`，对实数和复数都同样适用，无需额外处理。例如：


  ```

  julia> a = 3.2

  3.2

  julia> b = -4.4

  -4.4

  julia> z1 = complex(a,b)

  3.2 - 4.4im

  julia> z2 = -z1

  -3.2  +  4.4im

  julia> z3 = z1 + z2 # 两个复数相加

  0.0 + 0.0im

  julia> z3 = z1 - z2 # 两个复数相减

  6.4 - 8.8im

  julia> z3 = z1 * z2 # 两个复数相乘

  9.120000000000001 + 28.160000000000004im

  julia> z3 = z1 / z2 # 两个复数相除

  -1.0 - 0.0im

  julia> z3 = z1^z2 # 复数作为另一个复数的指数

  ### 进行幂运算

  -0.1407063188343073 - 0.24121298541124633im

  julia> z3 = z1² # 复数作为实数的指数进行幂运算

  ### 实数的幂

  -9.120000000000001 - 28.160000000000004im

  julia> z3 = 2*z1 # 一个实数乘以一个复数

  ### 一个复数

  6.4 - 8.8im

  julia> z3  =  z1*(z2³.2  - z2/z1)

  1211.337685375584 - 232.35311358949485im

  ```


  当涉及的数字是混合数据类型时，遵循层级规则：


  ```

  julia> a = Int8(9)


  julia> b = Float64(287.876567)

  287.876567

  julia> z = complex(a,b)

  9.0 + 287.876567im

  julia> typeof(real(z))

  Float64

  julia> typeof(imag(z))

  Float64

  julia> c = Int64(3456)


  julia> z1 = c*(z)

  31104.0 + 994901.415552im

  julia> typeof(imag(z1))

  Float64

  julia> typeof(real(z))

  Float64

  ```


  ## 总结


  处理复数及其运算的能力使得 Julia 能够以逼真的方式进入现实世界模拟。复分析是物理和工程科学中数学研究的基石之一。实部和虚部的物理重要性对于科学解释至关重要，尤其是在处理随时间变化的现象（通常是动态问题）时。定义复数的便捷性，以及提取实部和虚部的简便性，再加上执行复分析的运算符，使得
  Julia 成为模拟现实问题最先进的选择之一。


