  ## 13.5 总结


  在本章中，我们描述了 Julia 处理数据并有效将结果可视化为图形的能力。图形的多样性及其简单的定义是 Julia 的关键特性之一。本章还涉及一个不由 Julia
  基础包处理，而是由外部包处理的计算任务。因此，本章也演示了如何使用外部包并定义其配置。需要指出的是，解释 Julia 的绘图功能本身就可以写成一本专著。因此，本章仅通过
  `Plots` 包提供的其中一种选项，对这些功能进行了初步展示。这为用户探索其余选项并做出明智决策留下了空间。


