  \ Julia 中一些内置的数学函数。\n\n\n## 6.2 除法函数\n\n除法是四种基本算术运算之一；另外三种是加法、减法和乘法。两个自然数的除法是计算一个数包含在另一个数中的次数的过程。这本质上是在计算我们能在第二个数中分出多少组。例如，当用`10`（除数）除以`3`（被除数）时，我们可以得到`3`（商）组，并剩余`1`（余数）。除法也可以被描述为一个数在另一个数上循环，直到我们找到终点。这种循环可以是线性的、极性的等等。循环由模函数描述，其中`a\
  \ modulo b`意味着`a`被循环`b`次，以找出循环的次数（商）和剩下的部分（余数）。\n\nJulia 定义了一组函数，用于以指定方式执行一个或多个数的除法。表\
