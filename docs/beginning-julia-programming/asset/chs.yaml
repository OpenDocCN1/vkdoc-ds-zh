  0//1\njulia> signbit(a5)\nfalse\n```\n\n要了解一个数的符号，可以使用 `sign()` 函数。如果输入数为零，则返回 `0`；如果输入数为正，则返回\
  \ `1`；如果输入数为负，则返回 `-1`。\n\n```\njulia> a = -123\njulia> sign(a)\njulia> b = 123\n\
  julia> sign(b)\njulia> c = 0\njulia> sign(c)\n```\n\n#### 操作符号\n\n有时，你需要给一个数分配一个选定的符号。可能需要扫描特定数字，并将选定的数字符号分配给一个新数字。这由函数\
  \ `copysign(x, y)` 完成。它返回一个与 `y` 具有相同符号的 `x`。`methods(copysign)` 给出了可以传递给此函数的数据类型列表：\n\
  \n```\njulia> copysign(123,-231)\njulia> copysign(-123,231)\njulia> copysign(-123,-231)\n\
  julia> copysign(123,231)\njulia> copysign(123,0)\njulia> copysign(-123,0)\n```\n\
  \n`flipsign(x, y)` 函数返回一个 `x`，如果 `y` 为负，则其符号翻转。\n\n```\njulia> flipsign(123,-231)\
