  \ 1，并再次检查条件。如果发现条件为`true`，则执行`println()`语句。这个过程会一直重复，直到条件不再为`true`，即直到`x = 4`。\n\
  \n### 11.7 嵌套循环\n\n在 Julia 编程语言中定义循环最方便的一点就是定义嵌套循环的简洁性。嵌套循环只需用逗号`,`运算符分隔循环即可写出。例如，考虑以下\
  \ Julia 代码：首先`x`从 1 遍历到 3，在此循环的每一步内部，`y`从 1 遍历到 3。在`y`循环的每一步中，`z`被定义为一个元组，其中包含`x`和`y`的当前值。因此当`x=1`时，会迭代创建坐标`(1,1),\
  \ (1,2), (1,3)`，接着`x`增加到`2`，并重复同样的过程：\n\n```\njulia> for x in 1:3,y in 1:3\nz =\
  \ (x,y)\nprintln(z)\nend\n(1,1)\n(1,2)\n(1,3)\n(2,1)\n(2,2)\n(2,3)\n(3,1)\n(3,2)\n\
