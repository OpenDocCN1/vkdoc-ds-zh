- "# 14. 元编程\n\n## 14.1 引言\n\n元编程是 Julia 编程语言最强大的特性之一。粗略地说，元编程是关于 Julia 代码控制源文件的其他部分，其程度可以达到修改它们并控制其执行。要理解这个过程，你必须理解\
  \ Julia 代码的执行方式。广义上讲，Julia 代码执行有两个阶段：\n\n- 生成抽象语法树  \n  Julia 代码被解析成适合求值的形式。\n-\
  \ 求值  \n  编译器执行解析后的代码。\n\n元编程是关于在代码被解析之后但在执行之前对其进行修改。这一特性被证明非常有用，因为你可以在代码被解析后但在执行前进行修改。你可以编写简短的代码段，这些代码段可以执行根据给定规则编写更大代码段的繁琐工作。\n\
  \n\n\n## 14.2 `:` 运算符\n\n每个 Julia 任务都被视为一个表达式。REPL 会计算这些表达式。要执行元编程，你必须能够阻止 Julia\
  \ 计算表达式。这可以通过 `:` 运算符实现。让我们在以下 Julia 代码中查看其用法：\n\n```\njulia> a = \"Hello\"\n\"\
  Hello\"\njulia> :a\n:a\njulia> b = \"1.0\"\n\"1.0\"\njulia> :b\n:b\njulia> :(3.5²)\n\
  :(3.5 ^ 2)\n```\n\n输出显示为 `:a`、`:b` 和 `:(3.5 ^ 2)`。这些被称为符号。这些符号是未经计算的代码片段，可供修改。\n\
  \n符号也可以通过将表达式包裹在 `quote` 和 `end` 关键字中来形成。以下示例演示了这一概念：\n\n```\njulia> a = quote\n\
  \       3.5²\n       end\nquote # REPL[437], line 2:\n    3.5 ^ 2\nend\njulia> typeof(a)\n\
  Expr\njulia> eval(a) 12.25\njulia> 3.5² 12.25\njulia> :(3.5²)\n:(3.5 ^ 2)\n```\n\
  \n变量 `a` 存储了一个 `Expr`（表达式）对象。这可以通过 `eval()` 函数进行计算。两种定义符号的写法 `:(3.5 ^ 2)` 都可以使用。`quote`\
  \ 和 `end` 关键字用于多行用法，而 `:` 运算符通常用于单行用法。\n\n## 14.3 表达式\n\n让我们通过 Julia 探查一个表达式。为此，我们先构造一个简单的表达式，用于计算直角三角形的斜边，假设其垂直边为\
  \ 2 个单位，底边为 3 个单位。\n\n```\njulia> A = quote\n       p=3\n       b=4\n       h=sqrt(p²+b²)\n\
  \       end\nquote  # REPL[442], line 2:\n    p = 3 # REPL[442], line 3:\n    b\
  \ = 4 # REPL[442], line 4:\n    h = sqrt(p ^ 2 + b ^ 2)\nend\njulia> eval(A) # 计算\
  \ A\n5.0\n```\n\n这个表达式将在后续用于探查其属性和构造。\n\n### 14.3.1 `fieldnames()` 和 `dump()`\n\n\
  `fieldnames()` 函数可用于查看存储在 `A` 中的这个表达式的结构。完整的结构，即抽象语法树，可以通过 `dump()` 函数获得。\n\n```\n\
  julia> fieldnames(A)\n3-element Array{Symbol,1}:\n :head\n :args\n :typ\njulia>\
  \ dump(A)\nExpr\n  head: Symbol block\n  args: Array{Any}((6,))\n    1: Expr\n \
  \     head: Symbol line\n      args: Array{Any}((2,))\n        1: Int64 2\n    \
  \    2: Symbol REPL[442]\n      typ: Any\n    2: Expr\n      head: Symbol =\n  \
  \    args: Array{Any}((2,))\n        1: Symbol p\n        2: Int64 3\n      typ:\
  \ Any\n    3: Expr\n      head: Symbol line\n      args: Array{Any}((2,))\n    \
  \    1: Int64 3\n        2: Symbol REPL[442]\n      typ: Any\n    4: Expr\n    \
  \  head: Symbol =\n      args: Array{Any}((2,))\n        1: Symbol b\n        2:\
  \ Int64 4\n      typ: Any\n    5: Expr\n      head: Symbol line\n      args: Array{Any}((2,))\n\
  \        1: Int64 4\n        2: Symbol REPL[442]\n      typ: Any\n    6: Expr\n\
  \      head: Symbol =\n      args: Array{Any}((2,))\n        1: Symbol h\n     \
  \   2: Expr\n          head: Symbol call\n          args: Array{Any}((2,))\n   \
  \         1: Symbol sqrt\n            2: Expr\n              head: Symbol call\n\
  \              args: Array{Any}((3,))\n                1: Symbol +\n           \
  \     2: Expr\n                3: Expr\n              typ: Any\n          typ: Any\n\
  \      typ: Any\n  typ: Any\n```\n\n输出是一个表达式数组，这些表达式是存储在变量名 `A` 中的原始表达式的子表达式。每个子表达式都有一个\
  \ `head`、`Expr` 和 `typ`，它们定义了一个代码块、其子表达式以及包含的类型。这就是抽象语法树（AST）。让我们尝试探查 `Symbol block`\
  \ 的参数：\n\n```\njulia> A.args[1]\n:( # REPL[442], line 2:)\njulia> A.args[2]\n:(p\
  \ = 3)\njulia> A.args[3]\n:( # REPL[442], line 3:)\njulia> A.args[4]\n:(b = 4)\n\
  julia> A.args[5]\n:( # REPL[442], line 4:)\njulia> A.args[6]\n:(h = sqrt(p ^ 2 +\
  \ b ^ 2))\n```\n\n或者，可以使用 `for` 循环来打印 `args` 列表：\n\n```\njulia> for (n, expr) in\
  \ enumerate(A.args)\n           println(n,  \":  \",  expr)\n       end\n1:  # REPL[442],\
  \ line 2:\n2: p = 3\n3:  # REPL[442], line 3:\n4: b = 4\n5:  # REPL[442], line 4:\n\
  6: h = sqrt(p ^ 2 + b ^ 2)\n```\n\n现在，让我们编辑 `A.args`（它存储了表达式 `:(h=sqrt(p²+b²))`），将其更改为另一个表达式\
  \ `:(multiply = p * b)`：\n\n```\njulia> eval(A) # 编辑前\n5.0\njulia> A.args[end]=\
  \ :(multiply=p*b)\n:(multiply = p * b)\njulia> eval(A) # 编辑后\n\n```\n\n这是一个简单的元编程演示，其中\
  \ Julia 代码的子表达式被编辑，以计算完全不同的内容，而无需为此编写代码。\n\n## 14.4 表达式插值\n\n为了以更简单的方式编写表达式，你可以在表达式中使用\
  \ `$` 插值运算符，就像我们在字符串中学到的那样（参见第 9 章第 9.9 节）。例如，如果我们设置 `x=-2` 和 `y=2`，那么表达式 `expr=:(x^y)`\
  \ 返回 `:(x^y)`，而 `expr1=:($x^y)` 将返回 `:(-2 ^ y)`，`expr2=:(x^$y)` 将返回 `:(x ^ 2)`。所有这些计算结果都相同，为\
  \ 4。这在以下 Julia 代码中显示：\n\n```\njulia> x=-2\n\njulia> y=2\n\njulia> expr=:(x^y)\n\
  :(x ^ y)\njulia> expr1=:($x^y)\n:(-2 ^ y)\njulia> expr2=:(x^$y)\n:(x ^ 2)\njulia>\
  \ eval(expr)\n\njulia> eval(expr1)\n\njulia> eval(expr2)\n\n```\n\n这种插值的一个重要特性是，表达式求值在解析时进行，而其他插值仅在解析后调用\
  \ `eval()` 函数时才求值。\n\n## 14.5 宏\n\n使用 `宏`，你可以从未经计算的输入表达式生成一个新的输出表达式。这些表达式在解析时进行求值，并返回一个未经计算的表达式。它们类似于函数，但不同之处在于它们将输入表达式映射到输出表达式。\n\
  \n宏的语法如下：\n\n```\nmacro name_of_macro\n    # 宏的主体\nend\n```\n\n宏的调用方式是在名称前放置一个 `@`\
  \ 且不带空格，然后传递一个表达式，例如：\n\n```\njulia> @name_of_macro expr1, expr2\n### 另一种调用方式\n\
  julia> @name_of_macro(expr1, expr2)\n```\n\n让我们通过以下 Julia 代码来理解这种定义和用法形式。这里定义了一个名为\
  \ `expFeatures` 的宏，它打印表达式的 `args`、`head` 和 `typ`。它还会计算表达式并返回计算后的值。\n\n```\njulia>\
  \ macro expFeatures(expression)\n           if typeof(expression)==Expr\n      \
  \         println(expression.args)\n               println(expression.head)\n  \
  \             println(expression.typ)\n           end\n           answer=eval(expression)\n\
  \           return answer\n       end\n@expFeatures (macro with 1 method)\njulia>\
  \ @expFeatures 3+4-5\nAny[:-, :(3 + 4), 5]\nCall\nAny\n\njulia> @expFeatures (3+4)-(5²)\n\
  Any[:-, :(3 + 4), :(5 ^ 2)]\nCall\nAny\n\njulia> @expFeatures sin(90), sind(90)\n\
  Any[:(sin(90)), :(sind(90))]\nTuple\nAny\n(0.8939966636005579, 1.0)\n```\n\n当向宏\
  \ `@expFeatures` 输入表达式 `3+4-5` 时，发现 `args` 是 `Any[:-, :(3 + 4), 5]`，`head` 是 `call`，`typ`\
  \ 是 `Any`。同时该表达式被计算为 2。类似地，可以向该宏输入其他表达式来研究其特征。在最后一次尝试中，输入了两个表达式（`sin(90)` 和 `sind(90)`），用逗号分隔（这就是为什么\
  \ `head` 变成 `tuple` 的原因），并且相应地完成了计算。\n\n## 14.6 内置宏\n\nJulia 编译器预定义了许多宏。这里将讨论其中一些。最常用的宏之一是用于计算代码执行时间的宏。对表达式使用\
  \ `@time`，你可以获得以下信息：\n\n*   一个用于执行表达式的宏\n*   执行所花费的时间\n*   内存分配次数\n*   其执行导致分配的总字节数\n\
  *   返回表达式的值\n\n```\njulia> x=1:10e4;\njulia> @time x.³\n  1.024123 seconds (63.48\
  \ k allocations: 4.167 MiB)\n100000-element Array{Float64,1}:\n 1.0\n 8.0\n 27.0\n\
  \ 64.0\n 125.0\n 216.0\n 343.0\n 512.0\n 729.0\n 1000.0\n   .\n   .\n   .\n 9.9976e14\n\
  \ 9.9979e14\n 9.9982e14\n 9.9985e14\n 9.9988e14\n 9.9991e14\n 9.9994e14\n 9.9997e14\n\
  \ 1.0e15\n```\n\n这显示执行耗时 1.024123 秒，进行了 63.48K 次分配，占用了 4.167 MiB 内存；然后显示了每个数组元素立方值的部分结果。用户还可以尝试使用\
  \ `@timev`、`@timed`、`@elapsed` 和 `@allocated`，并通过 `help?` 模式检查它们的用法。\n\n\n\n## 14.7\
  \ 总结\n\n在本章中，我们介绍了符号、表达式、表达式插值和宏的概念，从而引入了 Julia 中的元编程概念。在 Julia 中拥有方便的元编程方式是其对开发者最具吸引力的特性之一。许多宏也以类似的方式被开发并发布。学会编写实用的宏并明智地使用它们，被认为是\
  \ Julia 程序员的关键技能。\n\n"
