- '# 前言


  2008 年，谷歌首席经济学家哈尔·瓦里安（Hal Varian）指出：


  我一直在说，未来十年最性感的职业将是统计学家……


  理解数据、处理数据、从中提取价值、可视化数据、传达数据的能力——这将在未来几十年成为一项极其重要的技能，不仅在专业层面，甚至在教育层面，从小学到高中再到大学的孩子都需要掌握。


  瓦里安明确表示，他实际谈论的是我们现在所称的“数据科学家”，而非传统统计学家。那么，这一技能组合具体是什么？数据科学家与统计学家、数学家或计算机科学家有何不同？瓦里安又为何称之为“性感”？


  最近，我与来自不同职业的朋友们讨论了这个话题。我们决定通过共同理解同一个问题来比较各自的领域——一个具有简单规则的理论经济市场。数学家佩尔西·迪亚科尼斯（Persi
  Diaconis）拿出了他最喜欢的工具：铅笔和纸。他成功地证明了一些关于该游戏的收敛结果。统计学家苏珊·霍姆斯（Susan Holmes）（她曾因想用计算机进行数据分析而被数学系开除）使用她的工具——`R`统计计算包——对
  10 个智能体在 100 个时间步长内进行了模拟，并绘制了结果图。由于图表含有大量随机噪声，她不得不运用一些理论知识来理解情况。而我，作为一名计算机/数据科学家，拥有多种工具，但我选择了`iPython
  Notebook`和`matplotlib`来创建一个与苏珊类似的模拟，但包含了 5000 个智能体在 25000 个时间步长内的数据。由于我的数据量是其 12.5
  万倍，我的图表平滑得多——信号主导了噪声，更容易看清发生了什么。最终，我们都达到了类似的理解水平，但通过不同的路径达成。


  > 哈尔·瓦里安，詹姆斯·曼尼卡（James Manyika）采访，“哈尔·瓦里安谈网络如何挑战管理者”，麦肯锡公司与出版物，2008 年 10 月（文字记录于
  2009 年 1 月发布）。`http://www.mckinsey.com/insights/innovation/hal_varian_on_how_the_web_challenges_managers`


  最早探索所有这些路径的先驱之一是统计学家利奥·布雷曼（Leo Breiman），他于 2001 年撰写了影响深远的论文《统计建模：两种文化》。在布雷曼看来，当时的大多数统计学家属于数据建模文化，该文化假设存在某种潜在的随机模型生成数据，分析师的职责是衡量模型对数据的拟合程度。模型的可解释性是最重要的考量。2001
  年的少数统计学家和今天的大多数数据科学家则属于算法建模文化——该文化认识到数据可能源于未知因素的复杂组合，因此难以通过简单模型来表征。然而，即使没有完全表征系统的模型，仍然可以利用数据对新出现的、未见过的数据进行预测。其首要关注点是预测的准确性，而非可解释性。


  布雷曼在文章结尾警告道：


  > 我们正处于一个从未有过如此丰富的统计问题和数据来源的时期。危险在于，如果我们将领域的边界限定在熟悉的工具和熟悉的问题上，我们将无法抓住新的机遇。




  另一位渴望抓住新机遇的统计学家是乔治·博克斯（George Box），他曾写道：“所有模型都是错的，但有些是有用的。”3 H 他作为统计学家的职业生涯与工程师紧密相连，这让他明白，“你的模型是错的”并不是一种批评，而是对现实世界固有复杂性的接纳。模型的价值依据其经验效用来判断，而非某种难以捉摸的柏拉图式理性主义理想。


  现在，我们来回答最后一个问题：为什么数据科学如此性感？这与“抓住机遇”有很大关系，也与其“催生新事物”有关：如此多的新应用和全新行业，都源于对海量数据的明智运用。例如，语音识别、计算机视觉中的物体识别、机器人和自动驾驶汽车、生物信息学、神经科学、系外行星的发现及对宇宙起源的理解，以及组建低成本但能获胜的棒球队。在这些案例中，数据科学家都是整个事业的核心。


  数据科学家必须将应用领域的知识与统计专长相结合，并利用最新的计算机科学理念来实现这一切。


  归根结底，“性感”在于能产生实际效果。在一个拥有许多复杂活动部件（与客户、供应商、原材料、制造及其他所有环节互动）的企业中，数据分析师仅通过操控数据（`bits`）而不触及实物（`atoms`），就能将效率提升
  10%或更多，这是非常常见的情况。有时，10%的提升是一笔不错的额外收益；有时，这却是成败的分水岭。在本书中，你将看到一些世界顶级数据科学家如何在令人眼花缭乱的各行各业和应用领域中工作——每个人都运用自己独特的领域知识、统计学和计算机科学来创造巨大的价值和影响力。


  ——彼得·诺维格（Peter Norvig）


  谷歌研究总监


  于加利福尼亚州山景城


