- '# 扬·勒昆


  ## Facebook


  **扬·勒昆** *是 Facebook（全球最大的社交网络服务公司）的 AI 研究总监。Facebook 的核心业务是促进人与人之间、人与数字世界之间的沟通。鉴于所涉及数据的庞大规模，支撑这一使命所需的技术是巨大的。截至
  2014 年，Facebook 拥有超过 13 亿活跃用户（用户之间拥有超过 1500 亿条连接）和 8.29 亿每日独立登录用户。平均每天，这些用户上传约 3.5
  亿张照片，分享约 47.5 亿条内容，并发送约 100 亿条消息。这些流式数据集的可用性如此之大，以至于在大多数情况下，Facebook 的系统只有时间对每条数据看一次。这样的活动水平带来了一系列独特的挑战：如何最好地理解和读懂所有数据，以及如何利用这些情报来做出决策。*


  *在加入 Facebook 之前，勒昆曾担任并继续担任纽约大学的 Silver 计算机科学、神经科学以及电气与计算机工程教授，同时也是纽约大学数据科学中心的创始主任。在多伦多大学杰弗里·辛顿的小组完成博士后工作，开发了具有反向传播功能的人工神经网络理论后，他加入了
  AT&T 贝尔实验室，后来成为图像处理研究部门的负责人。勒昆之后曾短暂在新泽西州普林斯顿的 NEC 研究所担任研究员，随后于 2003 年加入纽约大学。在他的职业生涯中，他发表了超过
  180 篇关于机器学习、计算机视觉、手写识别、图像处理与压缩以及神经网络的技术论文和书籍章节。他尤其以其在深度学习方法方面的工作而闻名，公司们利用这些方法来理解图像、视频、文档、人机交互和语音。*


  **第 3 章 | 扬·勒昆，Facebook**


  *勒昆是一位拥有变革愿景的数据科学家的杰出典范——就他而言，是利用深度学习教会机器感知世界——他努力在学术和工业研究实验室中实现这一愿景。勒昆孜孜不倦地追求自己的愿景，从
  AI 的早期时代到当今互联网规模的机器学习时代，这贯穿了他关于发布 MNIST 数据集及其如何被频繁用于测试新机器学习方法的故事，见证了神经网络在学术界兴衰起伏的时尚潮流，以及他自身关于监督学习和无监督学习相对优点的不断演变的信念。对勒昆的采访证明了他对能够学习的机器的热情，以及他对它们未来的信念。*


  **塞巴斯蒂安·古铁雷斯：** 请谈谈你的工作地点。


  **扬·勒昆：** 我是 Facebook 的 AI 研究总监。这个角色的一部分涉及数据科学，尽管 Facebook 还有其他的团队在做数据科学。如果你愿意，可以将
  AI 研究视为数据科学中更前沿的一面。我同时也是纽约大学的兼职教授，纽约大学恰好就在我 Facebook 实验室的街对面。虽然我现在是大学教授，但我职业生涯的大部分时间都在工业界的研究部门度过。早期我在贝尔实验室的一个小组工作，当时那个小组研究机器学习、神经网络和类似的项目。后来我成为了
  AT&T 实验室（这是 AT&T 在 1996 年分拆后其研究实验室的名称）的一个部门主管。我于 2003 年加入纽约大学，所以我已经在这里待了 11 年多。我在
  2013 年底加入了 Facebook。


  **古铁雷斯：** 是什么让你对 Facebook 的机会感到兴奋？


  **勒昆：** 主要是，我得到了一个从零开始创建世界级研究实验室的机会。Facebook 之前没有积极投入研究的传统，所以这对 Facebook 来说是一个有点新的尝试。不是每天都会有人来找你说，“我们希望你来创建一个研究实验室，并雇佣世界上最优秀的人才。”你无法拒绝。我们的使命非常雄心勃勃：理解智能并让机器更智能。这就是吸引我来这里的原因。


  **古铁雷斯：** 你的团队构成是怎样的？


  **勒昆：** 截至 2014 年 11 月，团队大约有 35 人。由研究科学家和更偏工程方向的人员组成。大约是四分之三的研究科学家和四分之一的研究工程师。35
  人这个数字很快就会改变，因为我们将快速增长。现在，我们的增长速度实际上受到可用优秀人才数量的限制，特别是因为其他每家公司都在试图招聘这个领域的人才。我们正在与谷歌、微软、百度、雅虎、IBM
  等许多公司激烈争夺人才。




  **古铁雷斯:** 实验室的短期和长期目标是什么？


  ***工作中的数据科学家*** 47


  **乐昆:** 我先从长期目标说起。这听起来可能极其狂妄，但本质上就是解决人工智能问题。当然，许多人尝试过并失败了，所以我们并非声称一定会成功，至少我们没给出时间表。长期目标是真正理解智能，无论是自然智能还是人工智能，并尝试让机器更智能，以便它们能在各个方面更好地帮助人类——帮助人们沟通以及应对数字世界。这就是长期目标。


  短期目标则是理解内容。用户每天在 Facebook 上传数亿张图片，还会发布数十亿条帖子和评论。Facebook 要做的一件主要事情就是决定向用户展示什么。用户每天可能会被展示大约
  1500 到 2000 个内容项。用户没有时间处理这么多信息，因此 Facebook 的算法基本上会从中选出几百个用户确实有时间每天查看的内容。为了做好选择展示内容的工作，我们本质上必须将内容与用户的兴趣相匹配。能够识别出图片里有什么、帖子是关于什么的、主题是什么，以及某个特定用户是否可能对该主题感兴趣，这使我们能更好地将内容与用户兴趣匹配起来。因此，理解内容对
  Facebook 来说至关重要。


  **古铁雷斯:** 在这个过程中深度学习的参与度有多大？


  **乐昆:** 我们做的很多事情都基于深度学习，但并非全部。深度学习对我们非常有用，尤其适用于图像、某些文本表示和主题提取这类任务，因为深度学习在处理海量数据的情况下表现优异。当然，Facebook
  确实拥有海量数据，所以我们会使用它。在很多情况下，由于我们拥有的数据量，它胜过了手工特征提取后接分类器的方法。


  **古铁雷斯:** 回顾你的职业生涯发展，你当时是遵循着一条路径吗？


  **乐昆:** 虽然就我工作过的机构而言并没有清晰的路径，但就我一直感兴趣的技术问题来说，确实存在一条路径。事实上，除了很短的一段时间外，我感兴趣的东西一直相当稳定。我从小就对人工智能和相关学科十分着迷。在
  20 世纪 70 年代末到 80 年代初读本科时，我学习的是电子工程。在此期间，我做了许多项目，试图弄清楚我们能否让机器学会学习。我一直相信，制造智能机器的唯一途径是让其学会学习，因为每一种动物都有学习能力。任何有大脑的生物基本上都能学习。


  我通过搜索文献来寻找能学习的机器，并意识到，至少在 20 世纪 80 年代初，没有人研究这类问题。我能找到的文献只有 20 世纪 60 年代的，


  ***第三章 | 扬·乐昆，** Facebook*


  一部分是 70 年代的，但大部分来自 60 年代。那是 20 世纪 50 年代关于第一代神经网络的老旧研究，比如感知器以及类似的技术，还有随后在 70 年代初出现的统计模式识别文献。但当我开始对这个研究领域产生兴趣时，该领域基本已被研究界抛弃了。这个时期有时被称为“神经网络寒冬”。


  我毕业了——虽然我的专业其实不是机器学习，因为那时根本没有机器学习这个概念。事实上，在当时的法国，甚至都没有计算机科学这个专业。我毕业时的专业是超大规模集成电路设计和自动控制。本科毕业后，我进入了研究生院。不幸的是，我很难找到对我想要做的事情感兴趣的人，因为我已经非常清楚自己想研究什么。早在本科时期，我就已经意识到，60
  年代人们追求但从未解决的问题，本质上就是多层神经网络和深度学习的理念。


  大概在开始读研究生之前两年，我开始尝试各种算法。我想出了一些东西，最终演变成了我们现在所说的反向传播算法——我们在 Facebook 每天都会大规模使用它——而且我是独立于大卫·鲁梅尔哈特、保罗·韦伯斯、戴维·帕克、杰夫·辛顿等人提出的。在研究生院，我很难让资深人士帮助我，因为这个领域已经被抛弃了。幸运的是，我有一位非常好的导师莫里斯·米尔格拉姆，并且我有自己的研究资金，基本上不依赖于导师。这位非常好的导师，其实根本不从事我所做的任何研究工作，他基本上告诉我，他可以签字，因为我看上去是个聪明的家伙，但他帮不了我。


  **古铁雷斯:** 是什么让你如此确信这是正确的方向？


  **乐昆:** 我不知道。我就是非常确信。对我来说，多层神经网络的学习能力就是关键，这一点太明显了。然后在 80 年代初，我发现了像杰夫·辛顿和特里·谢诺夫斯基这样的人，并意识到他们也对同样的问题感兴趣。所以杰夫·辛顿就是我想见的人。他基本上是唯一一个能理解我在说什么的人。碰巧的是，1985
  年，他被邀请参加在法国举行的首届神经网络会议之一。我在会议上遇到了他，我们一拍即合。他邀请我第二年参加一个暑期学校，然后又邀请我与他一起做博士后研究。杰夫·辛顿过去是，现在仍然是我的重要导师。所以我很有动力。我知道自己在做什么。这并不是我去找导师，导师告诉我“你为什么不研究这个算法？”这完全是我自己决定的。


  **古铁雷斯:** 最初是什么激发了你对人工智能的兴趣？


  ***工作中的数据科学家*** 49


  **乐昆:** 我出生于 1960 年。所以到我九岁时，火箭已经飞向太空，人类登上了月球，电影《2001 太空漫游》上映了，里面有太空和智能计算机。科幻是那个时代的精神。我一直对科学感兴趣。小时候，我思考和希望自己将来能成为一名科学家。我曾在几个领域之间犹豫——遗憾的是，并没有太久——比如天体物理学、古生物学、神经科学或人工智能。但我其实是个工程师。这一点遗传自我父亲，他是一名机械工程师，我喜欢创造东西。


  所以当我考虑从事科学时，我想的是：我们这个时代的大科学问题是什么？一个问题：宇宙是由什么构成的？这是天体物理学和基础物理学试图回答的问题。另一个问题：生命是怎么回事？这是生物学等学科试图回答的问题。再一个问题：大脑是如何工作的？这是一个巨大的科学谜团。如果你是一个年轻科学家，还没有意识到自己的局限性，你会去挑战大问题。而理解智能就是一个非常宏大的问题。




  作为一名工程师，我认为大脑是一个非常复杂的系统。智能是一个非常抽象的东西，也许可以用数学来建模，因此我们可以通过构建智能机器来验证我们关于大脑工作原理的设计或概念想法，从而采用工程方法来理解大脑的运作。关于大脑的实际工作方式，已经有很多说法，其中一些非常抽象。但如果不实际构建一个能正常工作的系统，你怎么知道这些说法是正确的呢？因此，至少在这个构建过程中，你具备了大多数必要的要素。这就是我感兴趣的那种科学问题。


  当然，我不仅要满足自己构建东西的欲望，还必须找到能够让我开发优秀技术、做出卓越成就的工作。说来奇怪，我从来都不太确定自己是否能成为一名学者。我曾经——也许我应该更早成为学者——但很长一段时间里，工业界的研究对我来说是一种完美的环境。所以现在我又回到了这种模式，尽管仍与学术界保持着联系，我发现这两种环境实际上是相辅相成的。因此，我处于一种非常幸运的境地：一只半脚踏在工业界，半只脚踏在学术界，这让我能够充分利用两者之间的互补性。在学术界，你可以从事计算神经科学和理论之类的工作；而在工业界，你则可以构建那些在学术界难以完成的宏伟项目。


  **Gutierrez:** 你最早处理过的数据集是什么？


  **LeCun:** 我处理过的第一个真正意义上的数据集是一个医疗数据集，那是在我攻读博士学位期间。这个数据集来自一项医学研究，研究对象是因腹痛前来急诊室的患者。事实证明，仅凭腹痛，对外科医生来说，判断是否需要进行手术是一个非常困难的诊断。


  对于外科医生来说，仅凭腹痛做出决定是极其困难的。大约有 20 种不同的基本诊断可以从腹痛中得出。其中一些诊断需要非常紧急的手术，比如阑尾炎。当时，我得到了一个在当时来说相当大的数据集，有数千个样本，包含患者的基本描述、缺失值以及你可能会预料到的各种情况。


  与我交流过、收集了这个数据集的人曾尝试过朴素贝叶斯和类似的方法。我尝试了神经网络。当时神经网络尚未成型，但我基本就是尝试了这个新兴的东西——反向传播——并取得了一些相当不错的结果。这帮助我提出了定制系统架构的想法，使其能够识别症候群之类的症状集合，从而减少系统中的自由参数数量，因为即使在
  1986 年，我们就已经知道过拟合是一个大问题。


  **Gutierrez:** 是否存在某个特定的顿悟时刻，让你领悟到数据的威力？


  **LeCun:** 对我来说，从来都不是数据的问题。对我来说，数据过去是、现在也是实现目的的一种手段。对我来说，关键始终在于你能够训练的模型的能力，因此关键在于学习算法。数据的广泛可用性是在很久很久以后才出现的——差不多是我开始研究这些问题
  20 年之后。我们在 20 世纪 90 年代才开始拥有用于手写识别或语音识别的大型数据集或中等规模的数据集。事实上，我发布了一个这样的数据集——`MNIST`数据集，它被非常频繁地用于手写识别。现在它被认为一点也不大，但在当时却是很大的。


  拥有大到甚至没有时间去看任何一条数据超过一次的数据集，是一个相当近期的现象。在我感兴趣的那些方法中，有很多恰好能在这种情况下很好地扩展，因为我一直是随机梯度下降和类似技术的信徒。


  这些方法在沉寂了 10 年之后，现在是人们正在使用的东西。人们曾经使用其他扩展性不佳的方法，因为他们没有面对这种数据流；而现在，当他们拥有如此规模的数据时，他们又开始回归这些技术。


  **Gutierrez:** 对于刚开始研究 AI 的人，你会推荐哪些会议、论文或书籍？


  **LeCun:** 我感兴趣的有两个不同的方向。一个是 AI 或雄心勃勃的机器学习，另一个是我称之为数据科学的东西。不过，这并不是工业界意义上的数据科学。我在这里所说的数据科学，实际上是指从数据中提取知识的普遍问题，不管这是自动完成还是半自动完成，也不管我们谈论的是方法、工具还是基础设施，更不管数据是关乎商业、科学还是社会科学。这些是我两个略有不同的兴趣点。在两种情况下，我相信像深度学习这样的东西在不久的将来很可能会对数据科学的实践产生巨大影响。


  如果你对 AI 或机器学习感兴趣，主要的会议是`NIPS`和`ICML`，还有像`AI Stats`、`UAI`和`KDD`这样的会议，实际上`KDD`更偏向数据科学方向，但那里现在也有相当多的方法类论文。


  此外，还有许多其他优秀的、规模较小的会议。事实上，有一个对我来说非常重要的会议，不仅仅是因为我参与组织它，它叫做`ICLR`，即国际学习表征会议。这是一个深度学习会议。它相对较小，但非常专注且非常有趣。所以这些是针对机器学习类内容的会议。


  机器学习还有其他一些领域我并不是非常活跃。比如强化学习，它对工业界实际上非常重要，并被用于广告投放等领域，因此有`AAAI`和类似的会议。我也涉足计算机视觉领域。在计算机视觉方面，主要的会议是`CVPR`、`ICCV`和`ECCV`。`CVPR`更侧重于图像、视频等方面的内容。


  **Gutierrez:** 在当今，你是否发现有某个领域，类似于你刚开始研究深度学习时的情形，即你认为它未来会变得非常庞大，但人们目前却没有关注它？


  **LeCun:** 我认为这是周期性的。我们会有新的技术出现，在一段时间内处于雷达之下，然后突然爆发，每个人都会在这段时间内探索如何榨干这项技术的潜力，直到你碰壁。之后进展放缓，变得乏味。然后新的一批技术出现，整个过程又重头开始。


  在我的领域，在 1986 年和 1987 年，神经网络一直处于雷达之下，并在 1986 年爆发了。因此，发生了很多有趣的事情，很多疯狂的事情——也伴随着大量的炒作——直到
  90 年代初，在我自己的贝尔实验室的实验室里，下一波浪潮来临了。下一波浪潮是支持向量机或核方法，它们非常流行且效果很好。这在某种程度上取代了大量的神经网络研究工作。因此，神经网络当时转移到了其他会议，比如`NIPS`。




  '
- '# ICML 会议变迁与深度学习的发展


  ICML 会议实际上曾经更侧重于机器学习的另一个完全不同的分支，即符号主义。那个机器学习分支如今已基本消失。`ICML` 向“统计”机器学习的转型大约在 2009
  年完成，当时数值机器学习技术几乎取代了符号机器学习，以至于现在`ICML`上关于这些主题的论文几乎绝迹。


  在核方法兴起的同时，图模型也在 20 世纪 90 年代中期出现了。


  图模型与神经网络这类技术实际上是正交的，更像是一个围绕其他技术的框架。在诸如 `NIPS` 这样的会议上，神经网络在 21 世纪初开始重新被提及。实际上，我曾离开该领域几年，不是人们对神经网络不感兴趣，而是我想追寻其他兴趣。我在
  1996 年到 2002 年左右研究了图像压缩。


  然后，我在 2000 年初回到了机器学习领域。杰弗里·辛顿、约书亚·本吉奥和我开始了可以称之为“阴谋”的合作——基本上是深度学习阴谋——我们试图重新激发学界对学习表征（而不仅仅是学习分类器）的兴趣。最初几年，我们很难在任何地方发表论文，无论是在计算机视觉会议还是机器学习会议上。这些工作被贴上“神经网络”的标签，因此被认为毫无趣味。人们似乎根本不愿意深入阅读标题之下的内容。大约直到
  2007 年左右情况才开始好转。


  对于深度学习而言，在随后一段时间里仍然有些挣扎，尤其是在计算机视觉领域。在计算机视觉中，向深度学习的转变就发生在去年。而在语音识别领域，这种转变大约发生在三年前，当时人们开始意识到深度学习效果非常好，并且胜过其他所有方法，于是掀起了一股涌向这些方法的热潮。但这几乎经历了十年的挣扎。


  **古铁雷斯：** 您已经涉足视觉和音频领域。接下来是什么？


  **勒存：** 接下来是自然语言处理。在 Facebook，我们在深度学习用于自然语言处理方面投入了大量精力。不过，这似乎是显而易见的，对吧？谷歌在这方面也有相当大的投入。自然语言处理之后是视频，再之后是以上所有内容的结合。因为视频中通常也包含音频。人们还会对图像和视频做出评论。所以，我们希望能够在同一空间中表示所有这些不同的内容片段，以便讨论相同主题或相似话题的内容最终落在该空间的同一区域。这被称为“嵌入”。


  **古铁雷斯：** 到目前为止，您职业生涯中最自豪的是什么？


  **勒存：** 我最自豪的是，早在 20 世纪 90 年代初，在贝尔实验室，有一群非常聪明的人一起工作，我们共同构建了一个支票读取/支票识别系统。但这不仅仅是一个支票读取系统；它是一个实现端到端图像识别的完整流程。当时可用的数据和计算机的限制促使我们将这些想法应用于支票识别。这基本上是我们拥有数据、并且有人愿意实际进行开发、将其商业化并完成所有工作的实际应用之一。


  人们现在仍然需要追赶我们当年用来解决这个问题的技术。我在那里使用的技术——特别是集成的深度学习卷积网络，以及我们现在称之为“结构预测”的技术——我敢打赌，人们将在未来几年内重新发明它们。我和莱昂·布图、帕特里克·哈夫纳以及约书亚·本吉奥合著了一篇论文，这篇论文基本上描述了卷积网络以及我们构建的完整端到端系统。这篇论文题为《基于梯度的学习应用于文档识别》。它发表于
  1998 年，刊登在《IEEE 论文集》上。这是一篇很长的论文，是在我们完成该系统几年后撰写的。


  我们构建的支票识别系统最初是一个研究原型，后来变成了产品。一家名为 NCR 的公司，当时是 AT&T 的子公司，将该产品部署在他们的机器上。它于 1996 年首次部署。而在
  1996 年，AT&T 拆分，基本上终止了这个项目，因为研究团队留在了 AT&T，而开发团队则去了朗讯科技。产品部门 NCR 作为一家公司被剥离出来，因此整个项目在取得巨大成功之后不久就被解散了。关于这个项目，唯一令人失望的是，我们从未因其成功而获得内部认可，除了我被提拔为经理！对我来说，令人沮丧的是，在这个巨大的成功时刻，促成这一切的整个公司突然决定分崩离析。


  我们花了几年时间写了一篇长论文来描述整个系统。所以论文的前半部分基本上是：这里是关于卷积网络的一切，这里是你如何实现它们，然后这里是关于该技术你需要知道的其他所有东西。论文的后半部分则是关于如何将其与语言模型或语言解释模型等集成。例如，当你阅读一段文本时，如果是英文文本，你有英文语法，所以你希望在其之上有一个系统来提取最可能的语言解释。而你想做的是训练系统同时进行识别和分割，并为语言模型提供正确的输入。我们成功地弄清楚了如何做到这一点。


  自那以后，这项技术以不同的形式在自然语言处理和其他领域的多个不同场景中被重新发明。


  有像`CRF`这样的模型——条件随机场——以及结构化感知机，还有后来的结构化`SVM`等，它们的精神非常相似，只是不具备深度。我们的系统是深度的。


  所以那篇论文的后半部分讨论了如何做到这一点。可悲的是，似乎很少有人读过论文的后半部分！


  我为我们的工作感到无比自豪。这可能是我最引以为豪的事情。


  我因卷积网络而闻名，它在近年来产生了巨大的影响。它在概念上并不复杂。当初困难的是让它实际工作起来，特别是考虑到我们当时拥有的计算资源以及我们必须自己构建的软件工具。我为我早期在反向传播及其他技术方面的一些工作感到非常自豪，其中一些我从未正式发表过。我也为`DjVu`系统感到自豪，它不是机器学习；它是一个数字文档压缩系统。


  **古铁雷斯：** 您是一位教授，也是纽约大学数据科学中心的创始人之一。您还领导着 Facebook 的一个研究实验室。您典型的工作日是什么样的？


  **勒存：** 我花少量时间在纽约大学。如果你一年前问我这个问题，答案会非常不同，因为我当时基本上是在管理数据科学中心并整合其中一些项目。这涉及大量的行政工作。但我不再做这些了，因为现在纽约大学的其他人负责这些。每当我在纽约大学时（时间相对较少），我会与我的学生和博士后交谈。




  所以，这主要是更新他们的项目进展，给他们一些下一步做什么的想法，以及诸如此类的事情。


  当我在 Facebook 时，也有不少技术会议。有些会议更偏向组织层面，因此需要与公司内部那些遇到 AI 或 ML 问题的人会面，这些问题可能我的团队能够帮助解决——比如招聘、与候选人交谈、面试候选人以及相关事宜。


  我实际上把大量精力都投入在招聘上。然后是日常的工作。我们所有人都会陷入很多这样的工作——比如处理邮件和参加流程性会议。当然，还有一些服务社区的工作，比如运营 ICLR
  会议、进行同行论文评审、撰写推荐信以及相关活动。其中一些更偏科学性质。


  **古铁雷斯：** 您如何看待和衡量成功？


  **勒昆：** 对于学术界和工业界的科学家来说，标准略有不同，但也没有太大差别。在每个领域，真正的标准是影响力。在工业界，有三种特定的影响力。第一种是对整个世界，或者对科学技术的智力影响。这体现在你通过发表论文、做演讲以及帮助改变人们做事方式等方面所做的工作。


  你可能会认为像 Facebook 这样的公司没有任何理由发表他们内部进行的研究，因为这会告诉竞争对手他们在做什么。但实际上，这么做有巨大的动力。这个动力在于，对于那些离应用还很远的项目，甚至对于那些离应用很近的项目，衡量你工作质量的最佳方式，是在一些标准数据集上测试你的方法，或者通过同行评审这种正式的众包方式来评估自己。


  对于离产品还很远的项目，尽管存在各种缺点，但这比起内部评估来说，是一个精确得多的过程。


  ***数据科学家在工作*** 55


  将自己置于科学界的审视之下，是评估一项工作质量的更好方法，远胜于内部评估。由少数可能并非该领域专家的内部人员来严格评估一项工作是非常困难的。这种评估方式本质上会导致内部炒作。你可以在一些倾向于保密的行业中看到这种情况，比如国防工业。那里发生了很多不太好的事情，但由于他们不能发表，他们真的无从知晓。因此，让公司的科学家们实际发表他们的工作对公司是有益的。这能让他们保持诚实。这对公司的声望也非常好。发表成果使他们能够吸引高素质的人才，这些人通常希望炫耀自己的工作，并且如果他们要成为研究社区不可或缺的一部分，也需要讨论他们的工作。这就是工业界特定影响力的第一种类型——强大的智力影响。


  第二种影响力侧重于那些在内部被认为重要的研究项目。这类项目指的是那些我们说，“我们知道我们要在这个项目上工作。” 我们不知道它最终会有什么应用，但我们知道它很重要。一群人会在这个项目上工作，如果你对其产生了影响，我们在内部就能评估这种影响是否重要。


  第三种影响力，当然，是对已部署产品的影响力。


  所以，如果你从事的工作最终被部署了，或者你以某种可衡量的方式改进了已部署的东西，那么这就是一种非常直接的衡量影响力的方式。有些组织声称是研究实验室，但它们只衡量第三种影响力，因此它们并不是真正的研究实验室。它们只专注于短期机会。


  **古铁雷斯：** 您是如何获得研究或分析的点子的？


  **勒昆：** 这其实是一个非常重要的问题，它决定了研究实验室应该如何组织。有几种不同类型的研究科学家。首先，你需要有远见的人。这些研究科学家拥有长远的眼光。他们实际实施的能力可能强也可能不强。他们可能会与其他人合作进行实施。其次，是那些善于紧盯长远目标、能够产生长期影响，并且善于忽略一时潮流的人。再次，是那些优秀的问题解决者，他们可能不一定有长远的眼光，但他们有能力解决其他人无法解决的复杂问题。最后，是那些能够实际实现、让系统运转起来的人。在一个研究实验室里，你需要所有这些类型的人。


  是的，你需要所有这些类型的人，但非常重要的一点是，研究部门的管理人员必须有远见，这意味着他们在自己的领域必须受到尊重。那种认为你可以把一群研究科学家凑在一起，然后让某个并非科学家的随便一个经理来指导他们的想法是行不通的。我从未见过这种模式成功过。你需要一个有远见、在业界有一定地位的人来领导研究实验室或研究实验室内的某个小组。


  管理技能在某种意义上被高估了，因为管理研究科学家就像放猫。你基本上只需要确保每天早上猫砂盆是干净的，这样人们就能做他们最擅长的事情，然后你就别去妨碍他们了。


  **古铁雷斯：** 您使用哪些具体工具？


  **勒昆：** 我在这方面很特别。我有很长一段历史都在构建自己的工具，其中一些非常奇特。早在加入贝尔实验室之前，我就和我的朋友莱昂·布图一起构建了一个当时被称为
  `SN` 的工具。它最终变成了一个名为 `Lush` 的项目。`Lush` 项目始于 1987 年，那时 `MATLAB` 还没有出现。它基本上是一个类似于 `MATLAB`
  的环境，前端是解释型语言，后端是数值库。前端的语言是我们写的一个 Lisp 方言。我加入贝尔实验室后，我们继续使用它。随后，在贝尔实验室的几十年里，像莱昂·布图、帕特里斯·西马德和其他人围绕它开发了各种工具，包括一个编译器。它成了我们在贝尔实验室非常有用的工具，因为我们最终能够用
  `Lush` 编写研究原型，编译它们，然后直接转化为产品，而无需将代码转录成其他语言。


  事实上，我们的支票阅读器的第一个版本就是用 `Lush` 建立原型，然后由一个开发团队翻译成 `C++` 的。不幸的是，这样做的结果是我们的研究环境与生产环境不同了。在这种设置下，你无法真正改进生产环境，因为它变成了一个黑盒，没有可检测性。经过这次经验，我们决定必须使用同一个工具来进行原型设计和产品化，这就是为什么我们编写了
  `Lush` 编译器。这个编译器有很多局限性，但最终证明非常有用。2002 年，当莱昂和我离开 AT&T 时，我们成功地将其以开源形式发布。当我短暂地在普林斯顿的
  NEC 研究所工作时，我们使用了 `Lush`。我们在纽约大学也曾长时间使用 `Lush` 进行许多项目，直到大约 2010 年。




  '
- '# Torch 7 与深度学习研究


  几年前，我们切换到了另一个名为 Torch 7 的类似环境。它的理念非常相似。这是一种灵活、动态但经过编译的语言。Torch 7 构建于 `LuaJIT` 之上，因此它是
  Lua 编程语言的编译版本。Lua 是一种简单的语言，在视频游戏和计算机游戏行业非常流行。它是一门脚本语言，因此也是一种非常易于扩展的语言。Torch 7 本质上是对
  Lua 的数值计算和机器学习扩展。对我们来说，Torch 一直非常灵活。


  我们在纽约大学（NYU）的研究中使用 Torch 7，在 Facebook 人工智能研究（FAIR）中也在使用它。事实上，我们已经将一些与 Torch 相关的
  Facebook 源代码作为开源发布了。谷歌也在使用 Torch 7。他们最近收购了一家名为 Deep Mind 的伦敦公司。Deep Mind 的所有代码基本上都是围绕
  Torch 构建的。作为 Torch 的创始人和主要开发者之一的罗南·科洛伯特（Ronan Collobert）已经加入了 Facebook。另外两位主要开发者都是我以前的学生。科拉伊·卡武克措奥卢（Koray
  Kavukcuoglu）在 Deep Mind 工作。克莱芒·法拉贝特（Clément Farabet）在纽约的 Twitter 工作。还有其他一些开发者，但这三位是核心人物。除了
  Facebook、谷歌和 Twitter 之外，还有许多其他公司也在使用 Torch 7 进行深度学习。


  **古铁雷斯：** 关于你在 Facebook 所做的工作，已经发表了哪些论文？


  **勒昆：** 我们在 2014 年 CVPR 会议上发表了两篇论文。其中一篇是关于一个名为 `PANDA` 的系统的，该系统基本上可以检测图像中的人体。另一篇论文是关于一个名为
  `DeepFace` 的系统的，它能够以非常高的精度识别人脸。这两个系统都使用了卷积网络。顺便说一下，这两个项目在我加入 Facebook 之前就启动了。我们还在
  2014 年 EMNLP 会议上发表了两篇论文，主题涉及文本嵌入（例如用于话题标签预测）和问答系统。还有其他一些最近启动的项目，我们在过去几周内刚刚提交了相关论文，这些论文主要涉及自然语言相关的任务。


  自然语言模型是一种系统，它可以根据一段文本预测接下来会出现哪个单词。它虽然无法预测确切的单词，但可以预测单词的分布，并衡量这种预测的准确性。因此，我们一直在研究实现这一点的基本技术——这不一定是出于我们对语言模型本身的兴趣，而是因为我们对可以应用于各种不同领域的底层技术感兴趣。例如，循环神经网络的变体就是我们正在探索的技术之一。一个特别有趣的发展是我们称之为“记忆网络”的技术，它是一种循环网络，并增加了一个独立的“短期记忆”来存储临时状态。利用记忆网络，我们已经能够构建一些简单世界的模型，类似于文本冒险游戏的世界，该模型在被告知一系列事件后，能够回答复杂的问题。一个令人印象深刻的例子是，一段描述《指环王》主要事件序列的段落。然后我们可以问诸如“戒指在哪里？”（答案：末日火山）、“佛罗多在哪里？”等等问题。


  **古铁雷斯：** 你从在 Facebook 工作并处理他们的数据集中学到了什么？


  **勒昆：** 嗯，数据集确实非常庞大。在某些领域，数据量已经超出了我们目前能够智能处理的范畴。内容分析和理解用户是非常重要的问题。然后还有一个关键问题，即如何将用户的兴趣与内容相匹配。在像
  Facebook、谷歌和微软这样的公司内部，图像识别和自然语言理解等领域存在着有趣的相互作用。当然，还有其他参与者，因为这有点像一场淘金热。这倒也不完全是圈地运动，因为你无法阻止其他人做和你一样的事情，尽管确实存在专利这种东西。在
  Facebook，我们申请专利不是为了起诉别人；我们偶尔会申请专利，是为了防止别人起诉我们。


  本质上，Facebook 申请专利是为了能够声明：“我们想出了这个主意，也许同时你也想出来了，但你不能因为我们使用了它而起诉我们。”另一种保护我们自己的方式是发表论文，因为这也确立了优先权。这确实存在一些很有意思的圈地运动。让我非常惊讶的是，如今在整个业界，有一种普遍认知，即人工智能将彻底改变一切。人工智能，或者说机器学习，尤其是深度学习，突然间就从某种晦涩的学术研究领域，一跃成为谷歌、Facebook、微软、IBM、雅虎、百度、Yandex
  等主要成功公司的核心焦点。对我来说，这是一个非常近期、迅速且令人惊讶的现象。


  **古铁雷斯：** 你如何看待这种突然的变化和关注？


  **勒昆：** 从某种程度上说，这并非完全出乎意料，但这并非你能指望发生的事情。作为一名研究人员，你做研究，并希望有人能够采纳它。当采纳者是马克·扎克伯格时，他不同于通常的学术界或工业界的同行。硅谷和科技界的许多人对于人工智能未来的潜在影响感到着迷。这正是推动这个学术领域如此发展和聚集的核心动力。我同意这一点。可以肯定的是，人工智能将对整个社会产生巨大影响。那些能够以正确方式在人工智能领域定位自己的公司，很可能在未来将处于某种有利地位。


  这就是为什么，举例来说，谷歌正在涉足机器人领域。他们相信机器人技术将成为未来十年的大趋势。现在，对于一些财力不济的公司来说，这可能显得为时过早。也许这个行业在未来五到十年内还不会起飞，但谷歌有足够的资源可以等待，并确保自己做好准备，或者实际上推动它的到来。Facebook
  也有类似的做法。Facebook 的核心业务是促进人与人之间的沟通，也促进人与数字世界之间的沟通。这将通过人工智能作为媒介。事实上，它已经通过机器学习作为媒介了。


  **古铁雷斯：** 你如何知道你正在解决的是否是正确的难题？


  **勒昆：** 这个问题，取决于我们谈论的是研究项目还是更实际的短期项目，答案是不同的。对于一个研究项目来说，要知道自己是否走在正确的方向上总是很困难。这与我之前谈到的愿景有关，如果你对世界未来的发展方向有一些想法，那么如果你真的相信它，就更容易坚持下去。例如，对我来说，深度学习的动机完全是不言而喻的。25
  年前我就觉得这是显而易见的，而让我惊讶的是，其他人花了这么长时间才意识到这一点。但同样让我惊讶的是，一旦他们被说服，其转变速度之快。




  当你构建系统时，大部分时间都花在构建数据分析系统、数据挖掘系统或机器学习系统上。大部分时间首先用于数据清洗，然后进行特征设计。接着，你转动你所喜欢的 `SVM`、逻辑回归、提升树或其他用于分类和预测的算法的“曲柄”。从这个角度看，特征设计占据了所有的时间。而你在特征设计上做得好坏，直接决定了系统的最终性能。


  因此，显然，如果你能利用学习来完成这项工作——并且只要有足够的数据，你就能做到——你就可以用学习来设计特征提取系统。这将是一个巨大的胜利，因为大量的人工劳动将消失，而且由于特征提取器会针对你手头的数据进行调优，你的系统可能会运行得更好。这就是深度学习背后的动机。当然，这样做的风险在于，系统现在参数过多，容易过拟合。所以我们有所有这些相关的担忧。因此，你需要大量数据才能让它工作，这也是直到最近人们才开始重视它的原因。


  这个逻辑在 25 年前对我来说就很明显，现在依然如此。令我惊讶的是，人们花了这么久才意识到这一点。所以，这就是一个例子，说明拥有这种长远眼光如何帮助你在论文被拒、无人关注你的工作时，仍然确信自己走在正确的道路上。当然，在缺乏成功的情况下，这种信念也有其限度。我的意思是我并非完全没有成功过。当然，支票读取系统就是一个巨大的成功。这是人们从早期神经网络成功案例中为数不多的记忆点之一。


  我的工作并非完全被忽视。不过，在 1990 年代中期到 2000 年代中后期之间，确实经历了一个“寒冬期”。


  现在，对于更实际或短期的事情，有明确的成功衡量标准，有各种指标。所有网络公司都有衡量自身表现的数据，比如点击量、你所衡量的任何指标的提升程度等等。这些指标非常直观，并且时时都在被测试。


  **古铁雷斯：** 目前谁的工作在激励着你？


  **勒昆：** 那些在工作中激励我的人，是我在与他们交谈时真正能学到东西的人。他们是老朋友。比如杰夫·辛顿、莱昂·博图和约书亚·本吉奥。在更工业化的背景下，我在贝尔实验室的老板拉里·杰克尔和拉里·拉比纳是非常出色的导师。在神经科学领域，是塞巴斯蒂安·西恩和伊罗·西蒙切利。这些人和我年龄相仿，或稍年轻或稍年长，我知道他们对相同的问题感兴趣，但对事物的看法略有不同，我们总能互相学习。我很珍惜能与他们共度的每一刻。还有很多年轻人，他们的工作让我觉得非常出色。我试图把他们都招到
  Facebook 来！至于那些我发现其工作鼓舞人心的人，他们不一定是我的领域内的人。他们是像理查德·费曼、阿尔伯特·爱因斯坦，或者有类似突破性成就的人。我发现他们鼓舞人心之处在于他们独特的、处理问题的智力方式，我觉得那很迷人，甚至有些神秘，而我希望能效仿。


  **古铁雷斯：** 你在他人工作中看重什么？


  **勒昆：** 我倾向于感兴趣的工作是创新、有创造性的工作，这些工作有时因为太创新、太有创造性而无法进入大型会议。大型会议的评审过程往往侧重于对主流模型的渐进式改进，我觉得这非常无聊。我的意思是，这有用，所以别误会我。我不是说人们应该停止这类工作，但我从中学不到太多东西。我只是对创新、创造性的工作感兴趣。我从这类工作中学到的东西多得多。


  另一种让我感兴趣的工作是那种实验非常严谨、令人印象深刻的工作。这种工作的内容相对直接明了，但它的伟大之处在于，人们把它做得如此出色，以至于你现在可以指着某个数据点说：“如果方法正确，这确实能行。”事实上，在某种程度上，卷积网络对我们许多人来说就是这样。


  我记得我离开杰夫·辛顿的博士后岗位大约一年后，在 1989 年的 `NIPS` 会议上做了一个关于卷积网络的报告。那是我做的第一个关于卷积网络的重要报告，杰夫·辛顿当时在听众席里。


  我在多伦多跟他做博士后时就开始思考我演讲主题相关的内容，所以他对我的想法有所了解。


  在演讲结束时，他说：“你做了一个非常好的报告。基本上，结果就是，如果你把所有合理的事情都做对了，它确实能行。”


  这句话既是赞美又不是赞美，他似乎在说：“这并非特别创新。我们知道这是正确的做法，很高兴你完成了它并证明了它是正确的。”我认为这确实有其意义，我也在他人的工作中发现了这种有趣之处。当然，这些想法对其他人来说远没有对我们那么显而易见。但最好的想法事后看来总是显而易见的。有些人更看重数学上的精湛技艺——你知道，就是在非常高的数学水平上做出的令人印象深刻的、真正的技术工作。其中一些工作偶尔会很有用，尽管并非总是如此。我对那些为如何思考问题奠定基础的理论工作非常感兴趣，但我对空洞的理论不以为然，即使它在技术上令人印象深刻。


  **古铁雷斯：** 你改变想法最大的一件事是什么？


  **勒昆：** 无监督学习。实际上，关于这一点我已经改变了两次或三次想法，而且可能还没改完。在过去，当我还在本科和研究生早期阶段开始研究神经网络时，我研究过无监督学习，但从未发表过任何相关的东西。我是说，其实并没有。我发表过，但成果没那么好。在那个时候，我认为无监督学习定义非常不明确。你可以衡量性能，但真的没有客观的方法可以说：“这是一个需要最小化的目标函数。我知道如果最小化它，我的系统就能工作得很好。”所以，因为我认为它的公式化如此糟糕，我断定它毫无用处。




  '
- '# 杨立昆谈监督学习与无监督学习


  于是我开始研究并成为判别式纯监督学习的坚定信徒。卷积网络正是这种思维的产物。实际上，此前已有类似架构被使用过。例如福岛的神经认知机，其结构与卷积网络相近——虽不尽相同但高度相似。当时的研究者主要尝试使用无监督学习。我认为这种特定方法存在不足，因此卷积网络本质上是对福岛神经认知机进行监督简化的版本。与此同时，我的朋友弗拉基米尔·瓦普尼克提出了一个理论观点：永远不应试图解决比必须解决的更复杂的问题。在此语境下，无监督学习在某种程度上比分类问题更复杂——它好比在高维空间中学习密度分布，这是你能想象到的最困难的任务。所以当时我在某些方面是反对无监督学习的。


  然而那个时期，杰夫·辛顿却是无监督学习的坚定倡导者和信徒。有趣的是，我们在监督学习与无监督学习的观点上始终存在相位差。当时他竭力说服我研究无监督学习，而我则不断告诉他真正奏效的是监督学习。进入
  21 世纪初，我的看法发生了彻底转变。我意识到要用极深网络解决深度学习问题，或许需要无监督学习进行预训练。杰夫提出了实现这一目标的思路，这极具启发性。


  于是我开始对这项工作和无监督学习产生浓厚兴趣。我研究了一种名为`稀疏自编码器`的技术，该技术现在应用相对广泛，尽管尚未真正用于工业领域。我们通过这项技术完成了一系列有趣的研究，并在某些数据集上看到了非常显著的改进。无监督学习在生物学上更具合理性，因为显然大脑更多是通过无监督方式而非监督方式进行训练。这项工作因此与神经科学建立了更多联系。这也成了一种发表论文的途径——因为如果你再发表一篇关于监督式卷积网络的论文，人们会说："你在
  1991 年就讨论过这个了，为什么不换个方向？"


  而无监督学习在当时算是新领域，正是它引发了人们对深度学习的兴趣。


  然而后来深度学习的实际应用却全部是纯监督式的。它们本质上都是基于卷积网络的反向传播。


  有趣的是，杰夫在这方面的观点也发生了变化。我的意思是，他并非彻底改变看法——他仍然认为无监督学习是长远之道，我也这么认为，吴恩达和约书亚·本吉奥也坚信这点。但在实际应用方面，他确实改变了想法，开始像我一样研究纯监督式卷积网络。他将此应用于语音识别、图像识别，并为改变学界对深度学习整体理念的看法做出了贡献。


  我们一直处于某种摇摆状态：杰夫认为无监督学习是长远方向，却不得不捏着鼻子让监督学习发挥作用，因为它确实有效。而对我而言，这些年来的观念转变更为明显。如今我更接近杰夫的立场——我仍然确信在自然语言和视频等领域，无监督学习终将扮演重要角色，但我们今天实际使用的方法全是反向传播。


  **古铁雷斯：** 数据科学领域未来会是什么样？


  **勒昆：** 关于数据科学的未来，我经常强调的一点是：被收集和存储的数据量正以指数级增长——要么随通信网络带宽增速，要么随硬盘容量增速。这取决于数据是流式传输还是静态存储，但总是二选一。而这是个相当高速的指数增长。目前当我们试图从这些数据中提取知识时，仍有人类参与其中。地球上人类脑力的总量也在以指数增长，但增速非常非常缓慢。与数据增长速度相比，这种增速微不足道。


  这意味着不可避免的是——事实上这已经发生——到达某个临界点后，地球上根本没有足够的脑细胞来检视这些数据，更不用说分析和提取知识了。因此未来世界上大部分知识都将由机器提取并存储在机器中。实际上这可能已经成为现实，取决于你如何定义知识。


  对我而言，知识是能够辅助决策的数据汇编。如今我们看到计算机正在自动做出大量决策，未来这种情况只会更加普遍。


  所以展望数据科学的未来，这门科学与技术——以及围绕从数据中提取知识的工程方法——将成为未来社会依赖的重要支柱。某种程度上这已是现实：互联网已经依赖于此。但未来整个社会都将依赖它。这不是一时热潮，也不会消失。如果说数据科学是一时狂热，那就像
  1962 年说计算机科学是一时狂热一样。看看我们现在身处何处。


  因此我的想法是，这种现象将会催生——当然它已经催生了我们熟知的产业——对专业人才的需求。同时也催生了处理这一领域的学术学科需求。这是目前某些人尚未完全理解的地方。例如，统计学家会说："这不就是统计学。"机器学习专家会说："这不就是机器学习。"数据库专家会说："这不就是数据库，再加点机器学习和统计学的应用。"应用数学家会说："所有这些技术和方法都用到了应用数学。"


  所有这些人都错了。这是上述所有学科融合而成的新学科：统计学+应用数学+计算技术+基础设施+应用领域——也就是这些方法能应用的领域，这需要专业知识。因此深度学习这类技术能让我们减少或最小化解决新问题所需的人类专业知识，让机器尽可能自主完成。当然目前这个阶段仍需人类参与。只要还有人类参与，数据可视化这类工具就能帮助人们完成工作。但最终，这些模型将能够自我构建。


  我坚信数据科学应该成为一门新的学术学科。




