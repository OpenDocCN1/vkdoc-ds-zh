  多线程计算和 MapReduce 模式。能够用最少的代码来完成这些工作至关重要。我们的代码库太大了，需要精简。对此我感到非常兴奋。




  类似地，人们和初创公司正开始尝试将数据科学和分析学民主化。我也完全支持这一举措。虽然更优的工具会让我们的工作更轻松，但这永远无法取代有人来创造和使用这些工具。即使有了这些整合和民主化的工具，你仍然需要数据科学家。仅仅因为人们能使用诸如
  `R`、`Stata`、`SAS` 等统计工具，并不意味着所有人都能突然正确地进行统计分析。虽然你可以借助这些工具更轻松地运行统计分析，但你仍然需要知道自己在运行的是否正确，甚至能否正确解读分析结果。


  实时性也让我感到非常兴奋。正如我们之前讨论过的，我们的许多业务都建立在手机和设备产生的海量数据尾气之上，因此能够尽快将这些数据转化为可执行的洞察，确实是未来的方向。我们正在关注许多有趣的技术，它们让这成为可能。我之前提到的
  `Storm`，以及那些让数据库分片变得容易得多的工具，让我们能够拥有真正可运行关系查询的水平可扩展数据库。我对这类数据库感到非常兴奋，因为我认为我们在 `Hadoop`
  内部进行关系查询上浪费了大量时间——不仅是浪费时间，还积累了大量技术债务。我受够了。我认为未来确实是一个让更多人能够更快地完成有趣工作的工具时代。


  最后，我还看到许多量化领域正形成一种产业界和学术界之间更加共生的关系。许多量化领域最初是由学术界的前期艰苦工作推动的，之后再由产业界的工作推进。最近，我感觉过去产业界和学术界之间存在的紧张关系正在缓和。例如，工业物理学家和学术物理学家现在正在一个更具协作性的环境中工作。实际上，已经有了大家共同参加的会议。这在物理界是过去从未见过的。我认为这种友好关系将继续扩展到许多其他量化领域。


  **古铁雷斯：** 你每天看到的、认为其他人尚未完全理解的事情是什么？


  **莱纳根：** 当人们想到位置的力量时，他们真正想的是——我和人们交谈时总是听到这个——我们做的事情就是在你路过星巴克时给你推送一杯星巴克的广告。或者我们做的事情是，当你路过公交车站的数字户外广告牌时，它会读取你手机上的某个标识符，然后向你展示一个个性化广告。我认为这是对未来的科幻式想象。这是每个人都认为会发生的事，但它实际上不会发生。未来的外在样貌基本上会与现在差不多——就像
  80 年代的外在样貌和现在也大致相似。


  一架 1968 年的`波音 747`飞机和今天看起来没什么两样。


  但世界已经非常不同。我们拥有这些移动设备，并且能够获取信息。我认为在位置方面，你当前所在的位置很重要，但你曾经去过的地方才是未来许多有趣产品诞生的源泉。所以，问题不在于你恰好站在广告牌前就瞬间改变它。而是——这听起来可能有点像《少数派报告》——你的生活和偏好将被以一种比仅仅通过你访问的网站所获得的背景信息更加丰富的方式来语境化。


  网络搜索是一个很好的指标。正如谷歌所证明的，它是一个很好的意图指标。但比这更强大的指标是你所在的位置。所以，我可能在梅奥诊所网站上搜索一些东西，那是因为我兄弟生病了之类的，但这其实和我本人没什么关系。但和我真正有关的是我过去六个月去过的地方。这更能体现我的品味和兴趣。我认为区别在于，每个人都知道位置会变得重要。但我认为人们尚未真正看到的是，重要的其实是你的位置历史，而不一定是你现在在哪里。


  ***第 9 章 | 乔纳森·莱纳根，PlaceIQ***


  **古铁雷斯：** 当您和您公司的初级员工一起创造未来时，您会给他们什么建议？


  **莱纳根：** 首先，保持自我批判非常重要：始终质疑你的假设，并对你的输出保持偏执。这是容易的部分。就人们若想在数据科学领域真正成功所应具备的技能而言，拥有良好的软件工程技能至关重要。因此，即使我们可能会雇佣一些编程经验很少的人，我们也会非常努力地让他们尽快认识到工程、工程实践和大量优秀敏捷编程实践的重要性。这对他们和我们都有帮助，因为所有这些现在几乎可以一对一地应用到数据科学中。


  如果你现在看看开发运维，他们有持续集成、持续构建、自动测试和测试框架等实践——所有这些都能很容易地从开发运维领域映射到数据运维（这是我借用 Red Monk 的一个说法）领域。我认为这是一个非常强大的概念。为你的所有数据建立测试框架非常重要，这样当你修改代码时，就可以回去测试你的所有数据。拥有工程思维对于在数据科学领域高速前进至关重要。阅读《代码大全》1
  和《程序员修炼之道》2 将比阅读机器学习书籍让你走得更远——尽管你当然也需要阅读机器学习书籍。


  **古铁雷斯：** 所以，了解机器学习是入门的敲门砖，而一旦入门，掌握工程实践才是让你脱颖而出的关键？


  **莱纳根：** 是的，就日常实践的重要性而言，你绝不能低估工程能力。而很多人都低估了它。我们面试的很多人，甚至是非常资深的人，也只是运行一些清理过的数据集，然后跑几个`R`包。要想真正成功，拥有工程思维很重要。我认为，拥有分析思维最重要，其次是良好的卫生工程实践，然后才是工具。


  当你的技能集被颠倒时，事情就会变得一团糟——也就是说，你只依赖工具，基本上在没有良好的开发运维或工程实践、也没有任何批判性思维的情况下盲目地应用它们。编程库和实践的整合是件好事，但工具和打包的库只有在你首先具备了批判性思维技能和工程实践时才能为你服务。


