- '# 第 15 章 | 埃里克·乔纳斯，神经科学研究


  这类公司都是这样建立起来的——甚至在某种程度上，像 Cloudera 这样的公司也是如此，当雅虎剥离 Hadoop 时，他们已经构建了许多核心技术。必须有人为此买单，而风险投资家没有风险偏好或耐心让你花三年时间去尝试某事。他们可能会让你尝试一年，并且很可能在接下来两年里继续给你资金，但结果将是你的股权结构表不断被稀释，等你某天醒来，也许终于取得了成功，却发现自己已经卖掉了公司
  90%的股份。哎呀。


  **古铁雷斯：** 你在招聘时看重什么？


  **乔纳斯：** 这很大程度上取决于职位。首先要搞清楚的是他们是不是个混蛋。生命太短暂，不值得和混蛋共事。在麻省理工，我们曾讨论过新生需要一段时间才能摆脱“新生综合征”。他们入学时总认为自己是最聪明的人，因为从小到大他们一直是自己认识的人中最聪明的。然后他们进入现实世界，才意识到自己并非如此。他们必须被磨掉那种傲慢。有些人永远摆脱不了这种心态。有些人非常认为聪明就可以不必具备人际交往技巧。而这个世界已经太需要协作，那种想法行不通了。


  我的联合创始人博·克罗宁前几天评论道，当时我正在谈论一位与我合作、有点难相处的学者，博说：“创办初创公司的好处之一就是你可以说，‘不！不行！别说话！’”在学术界，由于激励机制的结构往往不同，情况并非如此，因此你最终可能不得不与难相处的人共事。在
  P(K)，我们评估过许多非常聪明但就是不适合的人。


  如今，初创公司花了太多时间谈论文化，而文化往往成了“跟我不完全一样”的委婉说法。这是一种看待文化的可怕方式。真正重要的是——我们如何判断是否契合，是通过问自己关于他们的以下几个问题：他们是否和我们一样对相同的技术问题感到兴奋？他们是否热衷于协作？他们是否喜欢分享成功与失败？他们是否具备一定程度的恰当谦逊，并理解其重要性？找到合适的、与之契合的人很难，尤其是在机器学习和数据领域。但这是最重要的事情——确保他们是个合适的人选。


  显然，扎实的数学背景是必要的。如果我要向某人解释概率，那对所有参与者来说都将是一场艰苦的战斗。我宁愿选择一个定量技能属于前 20%、同时也是一名优秀软件工程师的人，而不是一个顶尖
  5%但不会写代码的人。量化金融模式极大地普及了一种观念，即原始的认知天赋才是一切。这就是 D. E. Shaw 和 Renaissance Technologies
  的模式：“我们要雇佣那些长期从事代数拓扑研究的人，然后教他们量化金融，这将是一个好方案。”从某种意义上看，这对他们来说显然非常成功，但尤其是在数据方面，数据分析比纯粹的数学要混乱得多。我有朋友在研究这些基于拓扑的方法，我会说：“你意识到当你真正把噪声引入系统时，这些流形会完全消失吗？你认为这在实际中会如何发展？”所以我更愿意选择具备计算能力的人。我愿意用他们过去在普特南数学竞赛的分数，去换取他们为多少开源
  GitHub 项目提交过代码。


  我也非常怀疑那种数据科学家没有领域知识就投入工作并产出成果的做法。我认为你确实需要关心领域。我确实认为，许多有趣的问题，尤其是那些我感兴趣的，要求你已经在该领域工作了一段时间。所以我很少会雇佣只有数据科学经验的人。


  我在神经科学界——甚至在工业界——经常看到的现象是，有些人非常喜欢数学，跑过来说：“我们怎么把我掌握的这些技术应用到你的问题上？”他们只想做数学，并不真正关心应用。但如果你不真正关心底层问题，你就不会愿意做出必要的妥协来理解如何指导自己的工作。在学术界或工业界，如果你不用客户能够理解的语言说话，那你可能会聊得挺开心，但没人会真正听你的。


  **古铁雷斯：** 有什么事情是你现在知道、并且认为五年后会让人们惊叹的？


  **乔纳斯：** 要么是贝叶斯非参数模型能让你在数据中发现你不知道存在的东西，要么是马尔可夫链蒙特卡洛方法能够扩展到你所关心的数据规模。恰当地使用概率方法可以解决我们在机器学习中面临的许多问题，比如过拟合和复杂的变换问题——这些问题我至今仍未完全理解。有一整套机器学习工作，其前提是假设你的数据是一个完全可观测的实值矩阵，矩阵形式为
  `R * n * m`。从我的角度看，问题几乎从不长这样。这个前提迫使你对数据做各种处理，试图让它变成那个样子。然后，一旦数据变成那种形式，你再做一堆线性回归。我的观点是，在这里做稍微复杂一点的建模会更好，即通过建模似然函数并采用生成式方法。我认为五年后，这将成为大多数人的做法。我认为这是不可避免的。不过，我认为要达成这个目标还需要大量工作。


  另一件我认为人们会非常惊讶的事情是，生命科学将变得多么量化和计算化。从某种意义上说，每个人都在这么说——这现在几乎都快成老生常谈了——但只会越来越真实。每次回顾过去，我们都比五年前进步了很多。尽管如此，我们依然总是对自己感到不满，因为我们从未达到理想中的状态——但我认为我们会达到的。


  **古铁雷斯：** 对于刚刚起步的人，有什么事情应该尝试深入理解？


  **乔纳斯：** 他们应该彻底地理解概率论。我现在已经到了一个阶段，我学到的其他一切东西，都会映射回概率论。这很棒，因为它提供了一个惊人、深刻、丰富的基础集，我可以据此投射出其他所有知识。有一本
  E. T. 杰恩斯写的书叫《概率论沉思录》，那是我们的圣经。从某种意义上说，我们确实深信不疑。我喜欢概率生成式方法的原因在于，你有两个正交的轴——建模轴和推理轴。这基本上转化为：我如何表达我的问题？以及我如何在给定数据的情况下计算我假设的概率？我喜欢贝叶斯视角的一点是，你可以沿着每个轴独立地进行工程优化。当然，它们并非完全独立，但可以接近到足以让你以这种方式对待它们。




