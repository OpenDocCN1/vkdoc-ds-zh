  ***第 12 章 | Amy Heineike, Quid***


  **Gutierrez:** 你在过去一年里主要在做些什么？


  **Heineike:** 这是激动人心的一年，因为我们到了真正扩大我们交付成果的阶段。这意味着我们一直非常专注于提高用户整体体验的质量，以及利用更多的数据集。我花了大量时间与我们的生产软件工程师紧密合作，帮助定义我们如何解读新的数据流——理解其中有什么、什么是有用的、数据问题在哪里，以及我们如何解决它们。我们还致力于提高每个主要算法的质量，并确定它们是否需要针对每个数据集进行调整，以及如何进行调整，同时回应用户的反馈。


  数据科学团队今年也成长迅速，我们吸纳了在技术栈不同领域拥有专业知识的人才，他们能够更深入地研究每一个部分。


  **Gutierrez:** 为什么扩大规模对 `Quid` 很重要？


  **Heineike:** 实现产品规模化意味着业务在增长，这显然很重要。不过，能够把我们内部构建的东西展示给很多人，也真的令人兴奋。我们产品的起源源于我们自身的好奇心——探索新兴技术、重要全球对话中正在发生的事情——并推动这些工具的发展，看看我们能让用户的使用变得多简单。


  一方面，现在看到其他人的好奇心也得到满足，看到他们提出并回答各种各样的问题，这真是太棒了。我们的用户通常都是非常有创造力且聪明的人，所以当他们使用产品时，会带来一种真正的能量。


  另一方面，作为一名数据科学家，我着迷于我们如何能够普及那种真正深入钻研和探索数据的能力。能够编写一个脚本从特定数据集中提取特定问题的见解是一回事，这需要很多技术知识——而将这种能力的本质产品化，让其他人能够驱动它，则是另一回事。将这种控制权交给那些拥有最佳问题的人，确实令人振奋。


  **Gutierrez:** 你们关注哪些具体的新闻来源？


  **Heineike:** 我们使用一个非常广泛的新闻语料库。我们每天从全球来源收集并索引大约 150 万篇新闻文章。这些新闻文章代表了所生成内容的广泛选择，因为数据涵盖了从主流新闻到独特的、非常个人化的博客（比如人们的
  `WordPress` 账户），以及技术来源和其他所有中间类型的内容。


  ***工作中的数据科学家*** 245


  **Gutierrez:** 你会如何向一位不熟悉数据科学但了解数据科学的人描述你的工作？


  **Heineike:** 从数据科学的角度来看，我解释的方式是，我们所做的是自然语言处理（`NLP`）加上机器学习，再加上网络科学，再加上数据可视化——这实际上是一个非常奇怪的组合。我认为没有多少领域会将网络可视化与
  `NLP` 结合在一起。所以这里有一种独特的混合技术栈。对于技术人员来说，有很多不同的方面他们可能根据自身经验会感兴趣。


  **Gutierrez:** 为什么将这些技术结合在一起会如此强大？


  **Heineike:** 信息检索和搜索领域的许多工作都专注于突出显示你应该阅读的那一个文档的问题。


  同样，如果你看看 `NLP` 领域，有很多工作是关于如何从一块内容中提取实体或主题。但同样，输出通常只是一个项目列表，希望是按相关性排序的。重点是找到唯一最佳的结果。我们的不同之处在于，`Quid`
  正在解决这样一个问题：“我们能否揭示数据中的所有内容，并使其易于理解，以便任何人都可以与之交互？” 因此，我们转而寻找数据中存在的独特信号，然后弄清楚这些指标如何相互作用——从而对市场、消费者、创新等提供完全不同的视角。因此，人们使用
  `Quid` 回答的问题实际上与通常的问题略有不同——它不是一个单一信号，而是一种整体且细致入微的理解。这就是为什么我们最终会进行主题的网络可视化，这并不常见。


  **Gutierrez:** 你如何向数学知识非常有限的人描述你的工作？




  **海内克：** 在研究、投资和战略分析领域，有很多人面临着关于世界正在发生或可能发生的、具有挑战性和复杂性的问题。这些问题包括：人们对我的业务怎么看？下一个技术泡沫是什么？主要市场参与者的长期知识产权策略是什么？当人们说到*幸福*、家庭、爱这些词时，他们指的是什么？历史上，人们尝试回答这些问题的方式是聘请顾问、找一些实习生、自己坐下来谷歌搜索，或者订阅一个超长的
  RSS 或 Twitter 动态，不停地读啊读，直到最终能把发现总结到电子表格或演示文稿幻灯片里。这是一个基础但效率低下的过程，却支撑了全球各类组织做出的无数重大决策。这就是这套系统的运作方式。


  ***第 12 章 | 艾米·海内克，** Quid*


  所以，对于这些人，我把我的工作描述为：我们在研究什么样的工具能让他们更好、更系统、更高效地完成这件事。我们构建的工具，赋能那些目前只能低效地阅读大量资料的人，让他们能够熟练地消费更多、更好的信息。通常，如果我向任何做过咨询工作的人解释这一点，他们的眼睛会闪闪发亮，而且会非常震惊，因为居然有人在开发工具来真正帮助他们做这些事。他们会立刻想要使用这些工具。


  **古铁雷斯：** 你是什么时候意识到自己想以处理数据为职业的？


  **海内克：** 我想是在我进入经济咨询工作的时候意识到的，尽管我并不认为当时我主要把它看作是和数据打交道。更确切地说，我认为它主要是通过数学建模来理解系统。但很明显，数据是其中非常基础的组成部分。数据限制了你所能达到的深度，所以我想正是在那时，我清楚地意识到自己需要深入到数据的世界里去。


  **古铁雷斯：** 你是如何对数学和编程产生兴趣的？


  **海内克：** 在成长过程中，我的家人对我展现出的对数学的任何兴趣和爱好都给予了极大的支持和鼓励。我的大哥其实是一名程序员，他从很小的时候就开始捣鼓电脑，而那时我甚至更小。在我很小时，他就试图教我编码。我断断续续地学了一点，然后在我开始工作后，才真正投入其中。我认为数学是一个很好的基础，因为它教会你非常严谨和逻辑地思考。一旦我有想用编程来构建的东西，编程就变得有趣了。


  对我来说，从抽象数学过渡到数据分析，再到编程，是非常自然的过程。随着我学会做更好的数据分析并探索分析的不同领域，我编写的代码也越来越多。在 Quid 工作很长一段时间里，如果我们决定尝试一些新的算法或方法，我通常就是那个去学习如何实现并尝试的人，通常会和一两个同事合作。当我们决定应该尝试分析大量文本时，我学习了自然语言处理。当我们想更好地分析我们的网络时，我学习了大规模网络分析。当我需要将代码投入生产环境时，我花时间学习了如何清晰地组织代码结构。


  这是一个很有趣的进步过程，根据实际需求来掌握技能——为了实现我们想做的事情，为了能通过数据讲述我们想讲述的故事。


  ***工作中的数据科学家*** 247


  **古铁雷斯：** 你记得你处理的第一个数据集是什么吗？


  **海内克：** 可能不是我真正意义上的第一个数据集，但在我的经济学工作中，我最早接触并摆弄的一些数据实际上是政府数据集。你会登录一个门户网站，下载英国的经济指标或人口普查数据，或者类似的数据。这些数据受到非常严格的控制——你实际上需要经过英国某个机构的审查，他们来决定你是否能获取这些经济统计数据。如果你被批准了，那么你就可以根据你的查询条件，以电子表格的形式下载数据。所以，你只能看到零散的数据片段。那些大概是我最早接触的数据集。这些数据集非常“小”，在某种程度上，可以算是我们现在可能认为的“老派数据”。也就是说，这些数据实际上就是为了人们使用它的目的而被收集的，而且可以放在一个电子表格里。不仅如此，在你看到数据之前，会有一堆统计学家争论如何精确地呈现它。这与我每天使用的数据类型，以及我们现在认为是“大数据”的数据类型，是非常非常不同的。


  **古铁雷斯：** 你是什么时候认识到数据的力量的？


  **海内克：** 我曾为英国一家名为 Volterra Consulting 的小公司工作，他们做了一些非常有趣的分析和一些非常有趣、不同类型的工作。我在那里的时候，这家公司做了几项引人入胜的研究。举个例子，公司的一位董事保罗·奥默罗德发表了一些论文，他的发现是：在英国，如果你看一个人是否有银行账户，实际上很难仅仅根据他们的经济状况、收入或挣钱多少来预测。这其实是一个对我们来说很重要的理解，因为那些没有银行账户的人通常被排除在金融体系之外，并且更难融入我们经济的运作方式。通过研究，保罗发现，如果你能获取他们的朋友是否有银行账户的信息，你就能更有效地预测一个人是否有银行账户。一旦你知道了这一点，你就会意识到这显然是一种网络效应。银行账户是那种人们需要理解“哦，我应该办一个这东西。这就是我使用它的方式，我不应该害怕办银行账户。我可以去银行。”的东西。这让你意识到，他们的社区对于传递这种知识至关重要。然而，这种见解是无法从高层次统计数据中获得的。你需要的是关于人与人之间联系的数据。要理解这个问题，你必须弄清楚要看哪些数据。你可能需要从调查中获得这些数据，或者在寻找信号来源方面非常有创意。人们的互动以深刻的方式驱动着经济活动。


  ***第 12 章 | 艾米·海内克，** Quid*


  另一位董事，布里奇特·罗斯韦尔，领导了许多城市分析工作，这真的非常吸引人。她强烈反对使用过于复杂的模型，而是专注于提出正确的问题，并收集数据以便能够讲述需要讲述的故事。你必须提出正确的问题，也必须获得正确的数据，才能讲述这个故事。这让我意识到，与其思考我应该找出一种更复杂的分析相同的宏观经济趋势数据的方法来理解经济，不如思考我们如何能够引入其他类型的数据，从而对经济动态提供更深刻的洞见。我们能否找出人们的社会关系或职业关系，以及它们如何影响社会？你怎样才能看到这些，又需要哪些数据才能看到这些？




  '
- "# 那么，如果我们能够看清这一点，我们是否会对经济运作方式及其缺陷有截然不同的理解？我们至今仍难以理解经济中真正根本的动态机制，比如商业周期和公司生命周期——什么样的数据能让我们更好地理解这些？\n\
  \n**古铁雷斯：** Quid 在研究和战略分析领域中处于什么位置？\n\n**海因内克：** 商业情报行业中有很多人在从事更高层次的思考研究和战略分析工作，他们试图分析、思考并弄清楚自己的业务和市场到底发生了什么。然而，目前我们有点与众不同，因为我们正在为这些用户开发数据分析产品。通过将我们的行业和技术视为两个独立的部分来思考我们在该领域的定位，是很有帮助的。\n\
  \n在我们的行业中，人们主要致力于理解真正重大且重要的问题，并利用这些答案来指导企业及政府应该做什么。这个行业的人通常在咨询公司工作，或者在组织内部的团队（例如政府部门或战略小组）中工作。他们通常是自己领域的专家，或者与专家合作。然而，我们更多的是技术驱动型的。\n\
  \n从技术角度来看，我认为我们与其他行业中构建软件的人有更多共同点。因此，这些技术与那些提出如下问题的组织相关：如何大规模分析文本？如何从语料库中提取实体或含义？如何同时可视化大量数据点，并使其具有交互性和美观性？例如，我们的搜索技术与消费级搜索产品有重叠之处，而我们的可视化工具则与为生物信息学家构建的工具相似。\n\
  \n**工作中的数据科学家** 249\n\n**古铁雷斯：** Quid 是否会在内部使用自身产品来了解其应该向哪个方向发展、即将面临的挑战是什么，以及应该开发什么？\n\
  \n**海因内克：** 是的，我们确实审视过自己，并向自己提出了很多问题，因为我们喜欢这种“元认知”。我们曾在内部使用我们的产品来分析大数据领域，看看我们领域内所有初创公司是谁，以及我们与谁最相似。我们还用它来研究我们正在考虑使用的技术，并快速了解新的算法和方法。所以是的，我们绝对使用过它，并且发现它对于分析我们自身和我们的行业非常有用。\n\
  \n过去我还分析过数据科学，想了解数据科学领域的新闻在谈论什么。我发现一个有趣的现象是，推动大量话题讨论的正是那些大型供应商——主要是数据平台供应商。然后你会发现少数几家公司非常成功地定位了自身及其产品。这些公司主要是\
  \ LinkedIn、Facebook 和 Twitter。因此，对话是由他们谈论自己构建的产品以及这些产品为何有趣而驱动的。\n\n最后，在其他人中间还有一片喧嚣，他们都在问：“到底什么是数据科学？需要哪些技能？应该组建什么样的团队？”\n\
  \n**古铁雷斯：** 对于那些有兴趣进一步了解你们领域的人，有哪些值得关注的出版物、网站、会议或博客？\n\n**海因内克：** 我们在 `quid.com/insights`\
  \ 上汇集了关于数据可视化、深度学习、数据科学及其应用方式的信息，你可以去看看。\n\n在 Quid 之外，我发现 Twitter 对于跟进最新动态非常有用。那里有很多来自不同视角的有趣人物，他们会推文分享各种有用的链接和参考资料。其中一些是来自《卫报》等媒体的记者，还有一些是像斯坦福自然语言处理小组这样的组织。例如，曾在《卫报》工作、现已转到\
  \ Twitter 的西蒙·罗杰斯，会发布指向不同可视化作品的链接。斯坦福自然语言处理小组则会发布近期文本挖掘研究的链接。\n\n还有一些创意人士以富有想象力的方式使用数据。例如，刚刚发布了一个软件开发工具包的皮特·沃登，该工具包让你可以在智能手机应用中利用深度学习。你基本上可以轻松设置，从而创建一个在后台使用深度学习的移动应用。\n\
  \n他的博客上有一段精彩的视频，展示了他如何让应用检测他的猫“老兄”是否在照片中。\n\n因此，对我来说，将这些来自不同领域的人拼凑起来，从他们那里获得想法和灵感，一直都很重要。\n\
  \n**第 12 章 | 艾米·海因内克，** Quid\n\n至于会议，我认为 Strata 会议是规模最大的之一。\n\nO'Reilly 团队做得非常好，他们将来自不同问题领域、对数据科学和大数据问题持有不同观点的人汇聚在一起。因此，他们组织了一些真正令人着迷的会议。\n\
  \n数据科学非常广泛，所以并没有一两种出版物能全面涵盖它，这就是为什么我们最终会拥有一个极其复杂的 Twitter 信息流，来自世界各地的人们纷纷发表各种不同的观点。如果你能把它们融合在一起，就能得到一些非常有趣的东西。\n\
  \n**古铁雷斯：** 你提到你整理了你的 Twitter 信息流，以涵盖不同的观点。有哪些好的例子？\n\n**海因内克：** 我关注了来自不同学科的人，这意味着他们拥有不同类型的方法论思想。因此，这些观点涵盖了“我该如何着手做这件事？”\
  \ 对于整个数据行业，我有几个很喜欢的人，他们对数据行业有着不同的看法。\n\n其中一位是凯特·克劳福德，她是微软研究院的研究员。\n\n她在 Strata 会议上做了一个精彩的主题演讲，并在《哈佛商业评论》上发表了一篇后续文章，2\
  \ 她在文章中谈到要确保对自己的数据保持足够怀疑。他们对飓风桑迪进行了分析，发现——通过查看 Twitter 数据——几乎所有事情都发生在曼哈顿。然后他们意识到：“嗯，不，并非所有事情都发生在曼哈顿。实际上，只是住在曼哈顿的人比住在沿海地区的人发推文要多得多。”所以，关键信息是要真正思考你的数据以及它是如何产生的，正如他们根据\
  \ Twitter 数据分析发现的关于飓风的情况所证明的那样。\n\n另一个人是肯尼思·库基尔，他是《经济学人》的大数据编辑。他合著了一本书，名为《大数据：一场将改变我们生活、工作和思维的革命》，这本书给了我很多关于行业未来方向的思考。所以，拥有这些能对你提出一点挑战的声音是件好事。\n\
