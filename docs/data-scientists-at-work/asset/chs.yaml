  我们花费大量时间与这些更年轻、经验不足的团队在一起，帮助他们聚焦目标，成长为合格的创始人和建设者，并执行他们的愿景。


  **古铁雷斯：** 与公司早期合作是什么样的？


  **埃伦伯格：** 我们很早就与所投公司合作，确定在执行他们的计划时，关键绩效指标是什么以及应该是什么。关键绩效指标并非在第一天就能确定。当然，有一些通用指标是每个人都需要追踪的，但根据业务不同，你可能还需要收集其他数据元素，而这些元素的重要性只有在客户开始与产品互动时才会显现。因此，我们与公司合作，努力建立一种衡量文化。我们倾向于那些直觉上就接受数据收集和分析的创始人。我们与这些团队合作，根据他们的特定业务识别出需要追踪的正确数据，以及如何利用这些数据来改进产品和/或营销策略。


  ***第 7 章 | 罗杰·埃伦伯格，IA Ventures***


  **古铁雷斯：** 在访谈中，你谈到投资那些将*被动数据*转化为*主动数据资产*的公司。你是如何找到这些公司的？


  **埃伦伯格：** 识别机会有两种主要方法。一种是筛选我们大量的*进入式*交易流，这些交易流要么通过可信赖的关系以“*热*”的方式来到我们面前，要么通过不在我们网络中的人直接接触以“*冷*”的方式出现。另一种方法源于我们对某个特定市场机会或新兴领域的假设。在这种情况下，我们会主动寻找那些试图解决我们眼中市场空白问题的人，并且我们对寻找解决方案充满热情。


  而帮助将被动数据转化为主动数据的问题则是在后期才出现的。


  我们投资的是一个正在建立业务的团队。我们投资的是一个不是正在建立数据集的团队。数据集在许多情况下是与客户互动产生的副产品。一旦公司与客户互动，我们就可以考虑这些副产品，以及公司如何通过从数据中获取洞察来改进产品或客户体验。


  **古铁雷斯：** 是什么人或什么事帮助塑造了你对数据领域的看法？


  **埃伦伯格：** 除了阅读当前文献，我认为就是观察社会如何应对快速变化的条件和新技术的浪潮。随着我们投资组合的增长以及我们对所投公司有了更长的纵向经验，我们能够越来越多地了解到哪些是有效的，哪些是无效的，以及哪些是尚未解决的大问题。我们一直在收集数据，无论是来自我们自己公司的内部数据，还是我们在外部世界中观察到的东西。


  **古铁雷斯：** 你最初关于以数据为中心的公司的看法是如何形成的？


  **埃伦伯格：** 很大一部分是通过我在华尔街的经历潜移默化而来的。我职业生涯的最后五年都沉浸在高速数据和数据流的世界里。这让我明白，尽管 90 年代末和 21
  世纪初存在的基础设施还不错，但相对于我所认为的数据速度和体量不可阻挡的增长而言，存在着巨大的差距。我明白需要出现新的技术来处理这个不断变化的世界。


  另一个帮助我形成观点的经历是预测分析和语义智能如何被实际应用。同样，这些也是我们在 DB Advisors 的一些策略中涉足过的事情。所以，即使我离开了华尔街，我仍然觉得这两个领域非常吸引人。有趣的是，大多数传统的量化方法已经是众所周知的。文献资料就摆在那里，人人都可以看到，因此，要么需要在被解析以产生洞察的数据类型上进行创新，要么需要在解析现有数据以产生更好、更快洞察的技术上进行创新。


  ***工作中的数据科学家*** 137


  所以，这些是早期帮助塑造我思维的一些影响。


  然后，当我看到广告技术领域正在发生的事情时，我凭直觉就明白，广告市场和金融市场的结构会随着时间的推移而趋于一致。至于何时会发生，我当时并不确定，但这正是指导我在早期进行广告技术投资（例如投资
  Invite Media 和 TubeMogul 这样的公司）的理念。这些早期的洞察，以及它们后来被验证的方式，一直延续到了 IA Ventures。


  **古铁雷斯：** 既然有了这些看法和洞察，你是否创办了一家公司来利用它们？


  **埃伦伯格：** 我确实自己创办了一家公司。不幸的是，我们起步太早，犯了很多错误，最终失败了。在帮助建立这家公司的过程中，我继续做天使投资，所以收集了大量关于成功的创始人如何建立公司，以及这与我的第一手经验有何不同的数据。在我作为公司创始人失败后，我决定有一种方法可以让我继续成为建设者——那就是成为一名全职投资者。这就是促使我创办一家风险投资公司，并更好地利用我的核心能力的原因。到目前为止，一切进展得相当顺利，但风险投资和公司建设是一个非常长周期的事业。


  **古铁雷斯：** 你如何引导初次创业者思考并找到他们的核心能力？


  **埃伦伯格：** 当我们进行投资时，我们对创始人的核心能力已经有了一个概念。仅仅因为创始人的技能组合不完整，并不意味着他们不能成长和发展，特别是考虑到我们支持的大多数创始人都在
  20 多岁和 30 多岁——这些是年轻人，有大量的时间成长和发展。然而，有些人就是不想改变。比如说，一个创始人非常专注于技术，他们只想写代码。所以他们既不想做
  CTO，也不想做工程副总裁。他们真正想做的是首席架构师。我们尝试做的是支持那些人才济济的优秀小团队。然后，随着时间的推移，当公司执行他们的计划并相应配置人员时，他们和我们都会重新评估角色和职责。


  有些技术型创始人绝对、肯定地想要成为 CEO，然而他们知道，与那些成功将公司做大的前辈相比，自己在知识和经验上存在差距。这些技术创始人中的许多人会积极寻求指导。他们思想开放，渴望拓展自己的技能组合。然而，有时候，一个创始人认为自己想当
  CEO，但当他被要求负责招聘、财务和整体监督时，他们会意识到(a) 他们不擅长这些，并且 (b) 他们讨厌这些。




  '
- '# 这没什么不好。我们的职责不仅是为创始人创造成功的机会，还要帮助他们坦诚面对自己的优势、劣势和个人目标。一旦他们做出诚实的评估，我们就会围绕他们建立一个支持体系，帮助他们在实现个人目标的同时，也尽最大努力推动公司走向成功。


  ***第七章 | 罗杰·埃伦伯格，IA Ventures***


  **古铁雷斯：** 你是如何学到这些经验的？


  **埃伦伯格：** 我想说，这源自于我的成功与失败。在离开华尔街之后、创办 `IA Ventures` 之前的五年里，我以天使投资人的身份投资了四十家公司。这段经历让我积累了大量的数据，无论好坏。关于成功公司的要素，包括创始人类型、区分成败的共性，以及我与创始人及其公司合作时什么才是最有效能的，我都有了深入的认识。


  通过反思，我逐渐认识到一个事实：人的因素——也就是心理——与对一个团队的量化及技术评估相比，至少同样重要，甚至更为重要。这就是为什么——我也多次撰文提到——风投是一门手艺活。一个人有多聪明并不重要——我见过一些才华横溢的人，他们在创办公司时却遭遇了
  `abysmal` 失败，就是因为他们缺乏同理心，缺乏人际交往技能，也缺乏大局观。所以，创业不是在真空中闭门造车。而是要走向市场，与其他人打交道。我认为，这是我深有体会的一课。


  **古铁雷斯：** 有没有哪些创始人展现了出色的心理素质，能举个例子吗？


  **埃伦伯格：** 作为天使投资人，我最成功的投资案例是 `Buddy Media`。如果你认识迈克和`卡斯·拉泽罗`——他们都是非常聪明的人——但他们卓越的原始思维能力，在他们杰出的团队建设和领导技能面前，也显得
  `dwarfed` 相形见绌。他们在公司创造了一种无与伦比的文化。


  无论团队是三个人还是三百人——我都亲眼见证了这两个阶段——他们建立了一支由 A+级人才组成的团队，拥有极强的 `esprit de corps` 团队精神。即使后来很难深入了解每个成员，大家依然对
  `Buddy` 有着强烈的归属感，这意义非凡。


  迈克和卡斯在塑造文化和传递使命方面做得极其出色，为公司员工和投资人带来了同样令人瞩目的成果。


  当然，当 Facebook 只有两千万用户时，迈克就预见到它将改变世界。这是他把握住的关键大事。


  实际上，他们尝试了三次才为 `Buddy` 找到了正确的道路。第一次是 Facebook 虚拟货币，第二次是应用开发，最终是运营 Facebook 页面，并成为大品牌和营销人员衡量、变现和奖励社交网络互动的仪表盘。然而，这并非一蹴而就。迈克、卡斯和他们的团队足够灵活，也足够谦逊，能够判断什么有效、什么无效，他们保持冷静，不断测试、调整，并始终维护着投资人和团队的信心。一旦找到方向，他们就全速前进，最终成就了纽约创业史上最成功的案例之一。


  ***工作中的数据科学家*** 139


  **古铁雷斯：** 他们第一次来和你交谈时，你看到了什么，让你觉得他们是值得支持的正确团队？


  **埃伦伯格：** 我当时还没见过卡斯。我见的是迈克。迈克非常有亲和力，而且已经是三次创业的连续创业者了。他刚刚把 `GOLF.com` 卖给了时代公司，此前还在互联网泡沫的鼎盛时期经营过一家学生贷款营销公司。我们交谈时，他有一个愿景，解释了为什么这个叫
  Facebook 的东西会真正改变品牌与客户互动的方式。显然，我知道 Facebook 是什么，但它当时绝算不上一个现象级产品。那还是在 2007 年中期。


  他谈到了他对品牌和营销人员的了解，以及他深知他们不知道如何在这个新媒介中进行沟通。他们不懂社交媒体。因此，`Buddy` 的 `raison d''être`
  存在意义就是帮助他们理解如何在社交媒体上与用户沟通，最初是 Facebook。


  这就是当初的想法。


  至于他们打算如何实现这个想法，对我来说，那几乎不重要。我学到的最重要的一点（至今仍深信不疑）是，作为种子轮投资者，你可能会在很多事情上犯错，但有几件事必须做对。最重要的是找到合适的人。其次，市场上需要有足够的“空白地带”——也就是接触客户并取得成功的机会。这并不意味着没有竞争对手。事实上，竞争反而是一种验证。如果别人在你进入之前就验证了这个领域，你可以做得更好；如果有足够的空白地带，那就太棒了。迈克所做的就是发现了一个拥有巨大空白地带的领域，而且他本人非常出色，所以他可以承受多次试错。


  当时的市场还非常不成熟，只要他把握住了大方向——是的，Facebook 将成为现象级产品；是的，品牌和营销人员将希望在社交网络上与用户沟通——迈克就能在资金耗尽之前，找到赚钱的方法！


  真正困难的是，当你看到第五十八个 `NoSQL` 数据库公司时，空白地带正在急剧缩小。你或许能组建一个 A+++级的团队，但如果他们在一个竞争异常激烈、极其拥挤、差异化空间很小的领域里运作，那几乎是在浪费时间。反过来，假设我们再次遇到像
  `Buddy` 那样的情况，但没有迈克和卡斯。一个 B 级团队发现了正确的大方向，但作为执行者，他们是 B 级选手，他们就会失败。所以，正是 A 级团队与足够的市场空白地带的交汇点，才构成了一个有吸引力的投资机会。


  **古铁雷斯：** 你投资 `Buddy Media` 时，考虑过数据业务吗？


  **埃伦伯格：** 我毫不怀疑，`Buddy` 会因为用户在 Facebook 上与品牌以及由 `Buddy` 支持的应用进行互动，而创造出极具价值的数据资产。这些数据资产将反过来指导更精准的定位和更有效的营销活动。这与
  `DSPs` [需求方平台] 和 `DMPs` [数据管理平台] 在广告技术领域的工作原理非常相似。“需求方平台”允许数字广告买家通过一个界面管理多个广告交易平台和数据交易平台账户，而“数据管理平台”则充当数据仓库。虽然这个类比并不完美，但也相当接近了。从我个人的角度来看，我一直有种感觉，这里存在数据业务的机会，但这种情况非常罕见——至少就我们的投资方式而言——一开始就存在巨大的数据机会。数据的价值是从规模化运营的成功企业中浮现出来的，这就是我对
  `Buddy` 的假设。


  **古铁雷斯：** 你的工作日通常是怎样的？你如何衡量成功？




  **埃伦伯格：** 我几乎每天都在思考这个问题，因为如何最优地利用时间始终是一个挑战。我的一天通常由三部分组成：信息摄入与分享、参与董事会事务并帮助投资组合公司，以及关注新的交易机会。在信息摄入与分享方面，我通常会在一天中较早的时间完成所有阅读。我在
  Twitter 上非常活跃，分享大量信息。


  其中一部分原因很简单，就是我喜欢分享。我知道有些人把我发布的信息流当作新闻阅读器，因为我会在 Twitter 上做内容筛选。我分享的内容也向世界强化了我最感兴趣和最热衷的事情。我认为分享很重要，因为创业者正在寻找真正理解他们的合适投资者。我把一切都展示出来，这样人们就能很好地了解我的兴趣和风格。我也非常清楚自己对哪些事情感兴趣——无论是数据、创业、金融市场、青少年棒球，还是密歇根大学。这些都在那里。这就是我一天中的第一部分，而且开始得非常早。


  然后是一天中最重要的部分：参与董事会事务并支持我们的投资组合公司。我深度参与我们公司的事务，尤其是那些最不成熟、最需要帮助的公司。因此，几乎每天都会有现有的投资组合公司占据我大部分时间。我经常与潜在招聘对象交谈，协助业务发展，讨论并帮助制定融资策略，有时只是为我们的创始人提供一个可以探讨想法的平台。这就是我一天中与投资组合相关的工作。


  我一天的第三部分是关注新事物，无论是进入我们交易漏斗的公司，还是深入探究关于不同市场和新兴领域的假设。


  **古铁雷斯：** 随着投资生命周期的推进，你花在公司上的时间是如何变化的？


  **埃伦伯格：** 随着一家公司走过投资生命周期，情况会发生巨大变化。这是我目前正在经历的，因为我们旗下几只第一轮基金投资的公司最近完成了 C 轮融资，筹集了
  3000 万到 4000 万美元。老实说，在这样阶段，我能做的事情以及我带来的价值，远少于公司早期阶段。在这些公司里，我们引入了新的董事会成员——既有拥有丰富行业经验的独立董事，也有了解如何帮助公司收入从
  2000 万增长到 2 亿再到 20 亿的后期增长投资者。我从未做过这些事，所以能坐在桌前学习对我来说很棒。虽然我仍然在招聘和融资策略上提供帮助，但当重点从“摸索解决方案”转向“快速扩张”时，关于商业模式和实现产品市场契合度的更详细讨论就会减少。


  **古铁雷斯：** 你是如何保持如此脚踏实地的？


  **埃伦伯格：** 这绝对是我参与过的最能令人谦逊的行业。没有哪一天我不曾感到自己愚蠢。这个行业非常艰难。


  虽然弗雷德·威尔逊显然是风险投资领域最成功的投资者之一——即便不是有史以来，也无疑是这个时代的——但他也异常谦逊。弗雷德一直是我的主要导师之一，也是我早期的支持者之一。他很早就对我说，他总觉得自己在学习，并且经常感觉自己正在犯错误。这句话我一直铭记在心。我也认为，随着年龄增长，经历过成功和失败，我现在比年轻时那个狂妄自大、“挑战世界”的自己拥有更多的同理心。


  在目前这个阶段，我深感自己处于最佳状态，这不再是为了向别人证明什么，而是向自己证明，并尽力提供帮助，所以我认为这有助于我保持脚踏实地。


  **古铁雷斯：** 面对如此高的商业难度，你是如何评估新机会的？


  **埃伦伯格：** 通常，当机会来临时，会有三种不同类型的交易。一种是冷交易，没有来自可靠来源的介绍。然后是来自其他投资者的较热门的介绍。最后是我们生态系统内创业者的热门介绍。每一个进入的机会都会根据其来源而隐含地获得权重。来自可信赖和受尊敬来源的事务会被优先处理。我们有非常清晰的理念，以及非常明确的投资介入时机。我们是早期投资者。所以时机必须在孵化期到
  A 轮前之间。种子轮到“种子轮 Prime” [或种子轮延伸] 之间的区域，可能是我们启动投资时分布最集中的部分。因此，即使只是让我们愿意深入了解一家公司，也需要很多条件都吻合。


  假设有一家公司处于合适的阶段，涉及我们热衷的领域，并且创始团队在初次接触中似乎很有吸引力。我们中会有一人担任交易负责人，通常首先与创始团队会面。如果那时兴趣依然存在，那么我们就会真正开始梳理我们对这个领域和这家公司的假设。我们会努力进行差距分析，判断公司当前的位置，以及我们认为这轮融资应帮助他们达成什么目标。我们还会开始围绕公司和领域，与团队一起进行背景调查，量化这些差距，并评估他们希望筹集的资金数额是否合适。很多时候，在深入挖掘一家公司并提供帮助时，我们发现他们的财务模型显示，他们通常低估了实现关键里程碑所需的资源，而这些里程碑正是他们向下一轮融资证明自己实力所必需的。大约在这个时候，公司会过来与我们三个人都见面，了解我们作为个人和合作伙伴关系的情况。然后我们会决定是否希望作为合作伙伴一起工作，去打造一家伟大的企业。


  我学到的一件事是，最糟糕的事情就是让企业资金不足，尤其是在后续融资非常困难的环境下。再次重申，我们谈论的是非常早期的阶段，所以问题不在于开出一张 3000 万美元的支票让他们资金过剩。这个阶段的问题是，你筹集的是
  150 万还是 250 万美元。我们讨论的就是这个数量级。有时，多出的 50 万或 100 万美元，能多提供六个月的运营资金，这可能意味着是获得一个非常成功的
  A 轮融资，还是“天哪，我们需要做一轮过桥融资，因为我们还没能证明足够的东西”。后一种谈话从来都不是愉快的。这种情况在种子轮阶段非常常见，所以我们努力工作，通过一开始就恰当地为计划提供资金来尽量避免这种情况。


  **古铁雷斯：** 你如何管理自己为这些投资假设生成的数据？


  **埃伦伯格：** 我们有一个结构非常、非常严谨的文件共享系统。我们对分类非常小心。这让我们非常容易访问数据。然后，考虑到我们管理的是一个相对集中的投资组合，我们并不因为只有不到一百家或更多投资组合公司而烦恼。我们不是微型
  VC。我们是经典的、传统的、老派的风险投资公司，这使得我们的数据非常集中。因此，我们很擅长检索这些数据，并一次又一次地加以利用。尽管我们频繁利用这些数据，但我们也在不断改进分析公司和与公司互动的方式。目前，我不觉得我们已经达到了稳定的状态。




  **古铁雷斯：** 您之前谈到过寻找那些以数据为中心、拥有数据基因的人。您是如何判断的？


  **埃伦伯格：** 我们可以通过与他们共事的过程来判断。假设有一个团队在我们感兴趣的领域运作，我们会与创始人进行两到三次会面。在那个时候，就很容易看出他们是否以指标为导向，是否深思熟虑地设计业务架构，以便最好地利用他们收集的数据。这是在尽职调查的自然过程中会变得显而易见的事情。


  ***数据科学家在工作*** 143


  了解一个人是无法走捷径的。


  这就是为什么我经常提到我的朋友马克·苏斯特关于“投资于线，而非点”¹的文章，也说明了为什么花时间建立关系、真正了解创始人——反之亦然，让他们了解我们——如此重要。我们非常坚定地认为，我们不会追逐，也不会卷入竞价战。如果有人手上有五份投资意向书，并且他们根据价格来选择——那对我们来说就不是合适的创始人。我们对此毫无怨言。无论如何，尤其是如果是一位经验丰富的创始人，并且他们真的不认为某个特定投资者能带来多少价值，那么我们就不是合适的投资者。


  我相信——而且我相信如果你去和我们的创始人谈，他们会证实这一点——最终选择与我们合作的人，他们想要的就是 **IA Ventures**。人们想要我、布拉德和杰西，是因为他们想要我们作为个人和团队，喜欢我们与公司互动的方式，并看重我们的知识和领域经验。这些人是我们希望多年来与之合作的伙伴。必须是我们想要他们，他们也同样想要我们。如果天平严重倾斜——我们想要他们，但他们并不真正想要我们，那么这就不是一个好的匹配。


  **古铁雷斯：** 您多久能判断出这是否会是一个好的或不好的匹配？


  **埃伦伯格：** 请记住，我们支持的大多数人都是初次创业者。如果有人将其目标函数优化为价格，并且价格就是一切，那么那就不适合我们。一个普遍只想要钱，而不想要参与或支持的人，要么是一位经验丰富的创业老手，要么是认为投资者不是合作伙伴、而是资本来源的人。虽然我们也支持过非常成功、连续创业、既不需要也不想要太多支持的创始人，但这并非普遍情况。如果一位缺乏经验的初次创业者同时也沟通不畅，这种类型的创始人通常不适合我们。


  我们追求的理想情况是一个优秀的创始团队，他们对经营和创办企业感兴趣并且能力出众。如果我们能提供他们认为有价值的帮助，那很好，但通常我们只让他们做自己的事。然而，在我们公司发展的这个早期阶段，我们没有很多回头客的创始人。所以我们接触到很多新的企业家，他们看重我们在诸多议题上的帮助。这并不是要“传授我们的智慧”，而是试图以他们重视且对企业重要的具体方式来帮助一家年轻的公司。这就是我所说的化学反应——当才华横溢、富有远见和具有自我意识这些特质与我们的热情和兴趣相契合时。


  **古铁雷斯：** 在一个竞争激烈的招聘环境中，好像随手扔块石头都能砸到一百家新创公司，您如何指导一个团队去找到具备合适才能组合的人才？


  ¹ 马克·苏斯特，“投资于线，而非点”（Bothsid.es，2010 年 11 月 15 日：www.bothsidesofthetable.com/2010/11/15/invest-in-lines-not-dots/）。


  ***第七章 | 罗杰·埃伦伯格，IA Ventures***


  **埃伦伯格：** 这又回到了人的问题上。你可能会说：“我们拥有这项超级棒的技术。我们更好、更快。我们有这个算法。”老实说，没人在乎。你卖的是体验，无论你是卖给客户还是潜在员工。你必须销售这种体验。是的，薪酬和股票期权等经济因素是体验的一部分。然而，仅仅因为你多付一点钱，并不意味着你就能招到人。


  能吸引人的，是你将愿景推销给他们、将团队推销给他们，并展示你的热情的能力。这才是吸引和留住顶尖人才的关键。当我试图与一些更技术型的创始人谈论这一点时，这很困难，因为对他们来说，他们做这些事的原因如此显而易见。你为什么不想拿着十万年薪和公司股票期权，来攻克我们这些令人惊叹的技术难题呢？


  这时候，创业公司的创始人需要学习如何销售。我不在乎他们技术有多强——他们需要销售。因此，指导他们如何销售、如何传达愿景、如何展现热情、如何让别人感到被需要，而不是像一个商品——超越单纯的交易关系，这非常重要。你必须让它变得个性化，而这很难。


  但这就是你为了赢得人才而必须做的。这就是你如何招聘到优秀团队的方法。


  **古铁雷斯：** 您在筹集最初及后续的 LP（有限合伙人）基金时，是如何推销自己的，大的愿景是什么？


  **埃伦伯格：** 早在 09 年，当我在金融危机后的 LP 市场“核冬天”中起步时，我实际上并没有花时间与传统的风险投资 LP 打交道。我最初的钱是从一小群认识我的顶尖风险投资普通合伙人、以及一些战略投资者那里筹集的，当然也包括我自己的钱。我有一个非常清晰的论点，认为大数据是一个可投资的主题。我是第一个谈论这个主题的人。我还推销了拥有传统风险投资思维的想法，但通过一个小型基金进行种子阶段投资，同时也会进行后续投资。这种论点、结构和策略的组合引起了一部分精明投资者的共鸣。


  在 2010 年初我们完成首轮 1700 万美元的募资后，我对我们的投资者说：


  > 我们将埋头苦干六个月。我们不会考虑筹集一分钱。我们将专注于将 **IA Ventures** 品牌打造为与大数据的同义词。我们将与东西海岸的数据科学社区建立牢固的关系。我们将成为该领域公认的思想领袖，并有望与一些真正伟大的企业家合作，开展一些非常有趣的业务，来验证我们的论点。


  ***数据科学家在工作*** 145


  快进到 2010 年中，LP 市场已经解冻。随着市场流动性增强，新兴管理人变得炙手可热。大数据当时火热至极，而我们就身处其中。因此，在那个时候，IA Ventures
  获得了显著的机构需求。最初，当我们关闭第一只基金时，主要是围绕推销大数据这个论点，但也强调了更高水平的投资严谨性。我的华尔街背景和对风险管理的强烈重视引起了许多
  LP 的共鸣，因为这非常不寻常。我谈论投资组合管理的方式也很有吸引力，因为它高度结构化、分析性强，并且与许多其他风险投资管理人不同。




  '
- "# 排版后的文本\n\n当我们募集第二支基金时，通过少数几位我的风投导师，我们接触到了一批优秀的机构有限合伙人。我们花时间积极培养这些关系，并让他们随时了解我们在第一支基金中的进展。我们对他们说：\"\
  这是我们将如何打造第一支基金的规划。等我们准备好募集第二支基金时，会回来向你们展示我们如何执行了计划。\"我们做到了，随后我们得以悄无声息、迅速地从我认为是全球最佳的合作伙伴那里，为第二支基金募集了\
  \ 1.05 亿美元。到目前为止，这是一段美妙的合作关系。\n\n**古铁雷斯：** 你如何向你的技术背景创始人传授建立关系和寻求指导的经验？\n\n**埃伦伯格：**\
  \ 我试着把他们介绍给可能成为他们优秀导师的人。我发现有很多非常成功的人非常愿意通过帮助年轻创始人来\"传递善意\"。就像曾经有人帮助过我一样，我也尽力去帮助别人，而那些已经成功的技术背景创始人也很乐意去帮助其他人。没有什么比类比学习更有效的了，所以当你能够坐在一个已经做到过的人面前，并为自己找到那些相似之处时，一切就变得真实了。这不仅仅是空话。因此，我所做的是帮助这些极其聪明的年轻创始人培养一系列关系，让他们建立自己的指导网络。\n\
  \n**古铁雷斯：** 你是最早谈论大数据投资理论、预测其发展方向及演变过程的人之一。随着它不断发展，你认为未来会是什么样子？\n\n**埃伦伯格：** \"\
  大数据\"这个术语我很早就开始使用。在当时它非常有力，因为（a）没人用这个词，（b）它是有含义的。现在这个词已经被扭曲和过度使用，以至于我们再也不用了。我甚至都不清楚它现在到底是什么意思了。这就是为什么我转向了\"\
  以数据为中心\"这个概念。事实上，我想说，看看我们最新的投资，不一定会有人给它们贴上\"大数据\"投资的标签。对我们来说，更重要的是我们拥有一套独特的技能、兴趣和热情，并且有很强的技术倾向。我们在寻找那些我们认为正在执行非常有趣使命的公司，而我们正是这些公司的最佳投资者。所以，我们正在做的事情的定义，我得说，已经发生了变化。\n\
  \n***第七章 | 罗杰·埃伦伯格，IA Ventures***\n\n我认为大多数人想到大数据时，想到的是基础设施。他们想到的是赋能技术。我们在那个领域做了一些投资。我们可能会也可能不会做更多类似的投资，至少在下一波机会中是这样。如果你看看我们最近做的投资，它们更多是关于应用的。无论是重塑制造业流程中的质量检验方式，还是为开发者社区提供基础设施即服务。我们还在医疗健康领域进行了三项投资。\n\
  \n随着市场的发展，我们也在发展。我们对自己真正擅长什么以及如何提供最大帮助有了非常清晰的认识。这自然导致我们倾向于某些类型的创始人和特定的应用场景。\n\n\
  如果三年后我们再坐下来进行这次讨论，我会很想知道自己当时会说什么，因为自 2010 年早期以来，我们的重点和投资方法论一直在演变和精炼。\n\n**古铁雷斯：**\
  \ 一个变得普遍的术语是\"数据科学家\"。你认为这是否类似于，在 2014 年的当下它是有意义的，但最终会失去其含义，或者你认为它最终会演变成一个定义更明确的角色？\n\
  \n**埃伦伯格：** 我认为它现在之所以独特，是因为我们需要培养更多这样的角色：目前没有足够多的熟练人员来操作数据并从中提取意义。市场试图解决这种短缺的一种方式是通过新技术和应用，将数据科学的能力赋予非数据科学家。我们投资了一家名为`Data\
  \ Robot`的公司，它本质上是将数据科学家的能力交到了非数据科学家手中。所以我认为我们会看到更多工具和技术来民主化数据科学家的力量。\n\n与此同时，我认为能够超越这些工具的人的自身价值会继续上升，因为尽管这些工具很强大，足以应对广泛的应用场景，但它们并非万能药。这有点像机器学习和人工智能。这些领域已经取得了巨大进步，但你仍然需要人类的输入才能从这些系统中获得最大价值。\n\
  \n我认为数据科学在很大程度上也是如此。\n\n**古铁雷斯：** IA Ventures 是为数不多的拥有数据科学家担任驻场科学家的投资基金之一。这个角色将如何演变？\n\
  \n**埃伦伯格：** 团队中有像我们的驻场科学家德鲁这样的人是非常有价值的。至于未来是会有一位具备同样知识背景的人更多地加入投资团队，还是有人扮演类似德鲁今天的角色——我不知道。也许我们的一位投资人员其构成会很像德鲁，但他仍然是一名投资者，而不是数据科学家。我认为这会演变。随着数据科学融入一切，我不太确定我们是否还需要像他这样地位的人物。\n\
  \n***工作中的数据科学家*** 147\n\n**古铁雷斯：** 你认为以数据为中心的投资理论还有哪些领域的发展空间？\n\n**埃伦伯格：** 我认为是医疗健康\
  \ IT 领域——我甚至不确定我们是否触及了冰山一角。我认为机遇最大的领域也面临最大的挑战。医疗健康数据显然在个人身份信息和隐私方面存在一些最大的问题。除此之外，还有僵化的官僚机构、化石般的基础设施以及数据孤岛，这些都使得解决需要跨多个数据集进行集成的难题变得非常困难。这一切终将发生，我认为我们这里讨论的许多技术与改善医疗健康、使其更可负担、更分散化直接相关。\n\
  \n我认为这代表着一代人的机遇。\n\n另一个尚处于早期阶段的巨大领域是风险管理——无论是在金融、交易还是保险领域。当你谈论将新的数据集纳入风险评估时，这是一个非常棘手的问题——尤其是在将这些技术应用于像保险这样的行业时，该行业与医疗健康一样，存在大量隐私问题，且数据被困在庞大的官僚机构内。与此同时，这些老牌的化石级公司现在才刚刚开始开放，并学习如何最好地与创业社区互动，以便利用新技术。这是我觉得非常令人兴奋的另一个领域。\n\
  \n我充满热情的第三个领域是重塑制造业并提高其效率。制造业回流已成为一种趋势。一个更强大的制造业部门可以成为在美国重建充满活力的中产阶级的桥梁。我认为技术可以帮助加速这一有利趋势。\n\
  \n**古铁雷斯：** 你和你的投资公司如何向制造业公司的中层管理人员传达数据、数据技术和尖端技术的好处？\n\n\n  \n**埃伦伯格：** 最重要的一点——我们正与所投资的公司实时应对这个问题——就是你必须找到一个最有动力去改变的人。举例来说，我们公司`Sight\
  \ Machine`正投入大量时间与工厂厂长及质量主管沟通。你知道的——就是那些戴着护目镜、安全帽，穿着钢头靴的人。从文化角度而言，能够与这些人对话至关重要。\n\
  \n这些厂长和质量主管有强烈动力来降低质量成本，因此如果你能向他们展示一种大幅提升绩效的方法——这直接关系到他们工厂的评估结果以及他们的薪酬——那么这种方法就相当有说服力。\n\
  \n这有点像成功企业攻克华尔街的方式。它们并非从高层开始推销；而是去找那些感受最大痛点的基层员工。所以它们避开 IT 部门，直接向银行家和交易员销售。这就是`BlackBerry`如何在华尔街无处不在的原因：它们直接销售，让用户迷上产品。而一旦设备渗透进交易大厅和银行家办公室，这些最接近客户的生产者就会对\
  \ IT 部门说：“支持这个设备。”IT 员工起初会回应：“我们不支持这个。”然后银行家和交易员会说：“现在你们支持了。”这之所以奏效，是因为最接近金钱的人最终总能得到他们想要的。\n\
  \n**古铁雷斯：** 考虑到关于失业和数据隐私的骇人听闻的故事，您如何看待在数据方面更加开放的转变？\n\n**埃伦伯格：** 作为一个了解好与坏两方面的人，我的做法是对自己的数据相当开放。为什么呢？因为我希望生活在一个能看到有意义的事物并拥有相应机会的世界里。随着我开放数据，我发现我收到的报价和看到的机会越来越相关，也越来越适合我。\n\
  \n总体而言，这带来了非常积极的体验。\n\n显然，个人身份信息（PII）与其他类型的数据之间存在区别。例如，你的社保号码与被设置 Cookie 或标记以便追踪点击流，这两者是有区别的。我对自己的\
  \ PII 极其谨慎。至于我的点击流和偏好，我并不在意，因为我的个人体验会越来越好。所以我会对担忧的人说：“听着，如果你花时间在电脑上，喜欢看新闻或购物，如果你愿意让别人跟踪你、跟踪你的点击，那么你将会读到更好、更相关的内容，收到你在意的优惠，整个体验都会让你受益。”话虽如此，我确实知道有些人对这些问题很敏感并选择退出，但他们只代表人口中极小的一部分。\n\
  \n相反，当涉及到你的社保号码和高度个人化的数据时，你确实应该对所分享的内容保持谨慎和小心。\n\n你应该始终极其小心地选择在哪些网站提交这类信息，因为存在不良行为者——就像塔吉特（Target）事件中那样——你可能在做一件看似无害的事情，却导致个人数据被曝光。\n\
  \n所以，只要你身处网络之中，就永远不可能零风险。如果你愿意使用互联网，就一定会遇到风险。\n\n**古铁雷斯：** 在教育方面，随着越来越多的人接触到数据，接触到那些用数据进行有趣探索的公司，您认为数据素养教育的未来是怎样的？\n\
  \n**埃伦伯格：** 我实际上正在身体力行。我与密歇根大学信息学院（UMSI）合作非常紧密。`UMSI`专注于编程、数据科学、用户交互和创业精神的交叉领域。我对这个项目投入了很多，相信他们广泛的课程体系代表着未来的趋势。它旨在提出尖锐的问题，并获取解决棘手问题的实用工具。这在营利性和非营利性环境中都有应用前景，而且`UMSI`除了为`Facebook`和`Google`等初创公司和大企业输送人才外，还有着强烈的社会使命。\n\
  \n我相信我们会看到这些主题在学生教育阶段被越来越早地引入。曾经是博士研究范畴的内容，现在正教授给硕士生；硕士课程正提供给本科生，然后到高中生，以此类推。所以，不只是学数学，而是数学加统计学。不只是选西班牙语或法语，而是选西班牙语或法语加脚本编程。无论是`CodeNow`还是任何涌现出来的优秀举措，我们正看到这些主题在学生学习生涯中越来越早地被引入校园，这让我感到无比兴奋。对数据素养的重视将会加强。这只是一个速度和时间早晚的问题。在纽约市，你已经在许多公立和私立学校中看到它正在实验性地推行。我认为它很快就会变得更加普遍。问题在于它何时能普及到所有地方，而不仅仅是在纽约、旧金山和波士顿这些密集型科技中心。\n\
  \n**古铁雷斯：** 关于数据，您认为有什么东西已经存在，但尚未均匀分布？\n\n**埃伦伯格：** 我认为是教育以及教授这些主题的知识。编程和数据分析的基础是众所周知的，也是被理解的。但只有相对较小的一群人从中受益。如何让这些成为全国课程的核心部分，这是一个挑战。我们需要更动态、更灵活的成就衡量标准，这些标准要能考虑抽象问题解决能力、统计学以及数据解读——这些才是你在现实世界中真正需要的东西。我认为这才是能提高整个国家生活水平、重建那个被挤压并推向两端的中产阶级的关键，而这种挤压对我们的国家或社会而言毫无益处。数据素养的兴起必将到来，并且对社会产生巨大影响。\n\
  \n### 第七章 | 罗杰·埃伦伯格，IA Ventures\n\n## 克劳迪娅·佩尔利希 – Dstillery\n\n**克劳迪娅·佩尔利希**是`Dstillery`（前身为`Media6Degrees`）的首席科学家，并在纽约大学斯特恩商学院的\
  \ MBA 项目中教授商业智能数据挖掘课程。`Dstillery`位列《福布斯》美国最具潜力公司 100 强的前 50 名，是一家广告技术公司，通过科学方法从数字世界和物理世界收集海量数据，以捕捉完整的客户旅程，识别出品牌特有的、表明消费者意图的模式。其模型能预测营销者设定的结果——在正确的时间，通过正确的平台和正确渠道，找到正确的人。\n\
  \n这些模型的范围、构建模型所需的数据，以及客户不断变化的口味和行为，给数据基础设施（每天超过 300 亿次广告竞价请求的决策和响应必须在不到 30 毫秒内完成）、隐私、欺诈、模型准确性以及如何思考模型正确性等带来了挑战。\n\
  \n\n\n"
- '# 第八章 | 克劳迪娅·珀利奇，Dstillery 公司


  `珀利奇`在东德长大，直到 15 岁才第一次接触计算机。她在科罗拉多大学获得计算机科学硕士学位，并在纽约大学获得信息系统博士学位，之后在 IBM 沃森研究中心从事数据分析研究工作。在那里，她连续三年（2007-2009
  年）赢得了`KDD CUP`——由美国计算机协会（`ACM`）赞助的数据科学竞赛。她拥有多项机器学习专利，发表了 50 多篇科学论文，曾在纽约大学、麻省理工学院、沃顿商学院和哥伦比亚大学任教。许多组织都认可她对数据科学的贡献，包括美国计算机协会（`ACM`）、克莱恩纽约商业周刊、快公司、广告研究基金会和美国营销协会。


  `珀利奇`是数据科学家的典范，她自创规则，并在商业、营销、计算机和学术等多个领域取得了成功。她多方面的才华对于她在 Dstillery 公司担任科学家、导师和公司代言人这一独特角色至关重要。`珀利奇`在工作中以及她在纽约大学的学术角色里所展现出的学习、分享和指导热情，让这次访谈充满活力。


  **塞巴斯蒂安·古铁雷斯：** 请说说你是如何开始与数据打交道的。


  **克劳迪娅·珀利奇：** 我最初学的是计算机科学。我算是个数学极客，但我对应用更感兴趣，而不仅仅是理论。一个偶然的机会，我参加了一个大学交流项目，来到科罗拉多大学博尔德分校学习一年。在选课时，我发现了一门由一位德国教授讲授的人工神经网络课程，一时冲动之下，我决定：“好吧，为什么不试试呢？”


  那位德国教授是`安德烈亚斯·韦根德`。他后来成了亚马逊的首席科学家。他是我的导师之一，也是一位很好的朋友。


  **古铁雷斯：** 交流项目之后发生了什么？


  **珀利奇：** 我回到自己的大学，对数据感到非常兴奋。于是我全身心投入其中，真正开始更多地与数据打交道。我在德国完成了学业，开始寻找计算机科学方向的博士项目。与此同时，`安德烈亚斯`在纽约大学斯特恩商学院的信息系统系找到了一份工作。当我向他索要那些计算机科学项目的推荐信时，他建议我申请纽约大学斯特恩商学院。我告诉他：“你看，我对商业一窍不通。”他说：“嗯，我也不懂。”通过这层关系，我最终进入了纽约大学斯特恩商学院，在那里获得了信息系统博士学位，与`福斯特·普罗沃斯特`一起研究机器学习和数据挖掘。我的博士论文是关于预测建模的。


  **古铁雷斯：** 你有没有接触过研究中的产业应用方面？


  **珀利奇：** 在读博期间的一个夏天，我在 IBM 沃森研究中心实习。我非常喜欢那里的氛围和团队。因此，当我思考博士毕业后的人生道路时，决定要么进入学术界，要么去
  IBM。最后，我决定去 IBM，并在那里的预测建模小组工作了六年。我非常喜欢项目的多样性，因为他们有各种各样内部和外部的咨询项目。所有这些项目都围绕数据和构建数据驱动的解决方案展开。我们还有时间发表论文和参与数据挖掘竞赛，所以对我来说，那是一个非常棒的环境。


  **古铁雷斯：** 是什么驱使你离开 IBM 去了一家初创公司？


  **珀利奇：** 我的好友兼博士导师`福斯特·普罗沃斯特`约我见面，告诉我他一直在与一家专注于定向展示广告的初创公司合作。他担任他们的学术顾问已经有一段时间了，认为这个团队非常出色，极其聪明。他建议我和他们一起吃顿午饭。我去吃了那顿午饭，之后的故事就顺理成章了。所以现在我是`Dstillery`公司的首席科学家，尽管它以前叫`Media6Degrees`。我已经做了四年，从未后悔过这个决定。


  **古铁雷斯：** 请讲讲`Dstillery`公司的历史和业务重点。


  **珀利奇：** `Media6Degrees`/`Dstillery`公司六年前成立，专注于展示广告。最初，它的前提是社交广告——即能够针对人们的社交好友进行广告投放。思路是，我们可以与营销商合作，观察是谁在网上购买了他们的产品。然后，我们会利用购买者的浏览历史，查看他们访问过哪些网站，并将其与他们社交网络上好友的浏览历史进行比较。这种网站的共同访问情况被用来建立人与人之间的联系。接着，我们会锁定那些与初始购买人群有联系的人，并向他们展示营销商的广告。


  我们最初是从`MySpace`开始的。我们很快就意识到，虽然社交数据可以作为某些类型产品的预测指标，但它对其他类型的产品根本不起作用。一旦涉及到没有社交关联性的产品或服务，观察人们的兴趣和他们采取的行动就会更有用。阅读一篇关于纽约马拉松的博客，实际上比他们在某个时候看过一个跑步爱好者的`MySpace`页面更能预测他们很可能也是一名跑步者。能够大规模地发现这种信号，正是我们目前在做的。


  随着时间的推移，`Media6Degrees`/`Dstillery`逐渐发展成一个完全不同的概念。我们现在的观点是，你和购买某物的人是不是朋友其实并不重要。真正重要的是——如果你严格从技术角度看待这个问题——能够预测某人购买某个产品的概率。这就是我们的核心理念，这很棒，因为这正是我喜欢做的事——解决大规模的机器学习问题。


  我们为金融、旅游以及全球范围内任何其他类型的在线可购消费产品/服务提供解决方案。唯一必要的是，你与客户有某种在线接触点。最近，我们开始更多地关注移动端和视频，业务范围有所拓宽。


  话虽如此，但我没法为牛奶做广告。在网上买牛奶的人太少了，基本上没希望。所以，除了那些不在网上售卖的东西之外，当我们找到某种可以在线追踪的信号时，就会将其用于预测模型。


  **古铁雷斯：** 现在你的预测模型中包含哪些数据？


  **珀利奇：** 在数据方面，我们拥有来自数据提供商的用户实际访问过的部分 URL 历史记录，以及来自广告交易所的出价请求，我们通过这些交易所实际购买广告展示机会。除非用户禁用了
  Cookie，否则我们可以观察到他们访问过的一些网站。在使用这些 URL 之前，我们会对其进行编码和哈希处理，因为我们不关心网页的内容或实际的 URL 是什么。我们关心的是，一个人的浏览历史是否显示他们访问过数据流中包含的数百万个
  URL 中的某一个。




  至此，我们现在基本上为任何一个人（实际是 cookie，因为一个人可能使用多台电脑，并且多个人也可能使用同一台电脑）在数百万个 URL 上建立了二进制指标。基于这些数据，我们可以通过在所服务的产品/品牌网站上观察其他数千人的行为，来预测该人是否会购买产品。这种方法对任何类型的
  URL 数据都非常通用，因为我们不需要依赖数据对哈希处理有意义。


  它可以是照片分享 URL、视频 URL、博客 URL、零售网站 URL，或者其他完全不同的网站 URL。由于我们使用二进制指标，我们能够利用这种非常通用的数据表示形式，它适用于模型所需的各种
  URL 数据。这现在是核心价值主张，并且在某种意义上支持隐私保护，因为我们无意提取有意义的行为模式，也不将其关联到特定个人。


  **古铁雷斯：** 你和其他的数据科学家是如何融入 Dstillery 公司的？


  **珀利奇：** 目前，在我们大约一百人的团队中，数据科学家约有六位半。考虑到我们的工作性质以及我们是一家初创公司的现实，这个团队的规模已经相当大了。随着时间的推移，团队逐渐形成了一些层级结构，但整体上仍然非常扁平化。


  我们有一位数据科学副总裁，他正式负责管理并需要处理管理职责。而我作为首席科学家，没有管理职责，尽管可以说，当人们遇到问题时，我可能承担一些名义上和智力上的领导角色。他们看重我的意见，会来找我。


  这种职责分离意味着我本身并不领导一个团队——我只是挑选并选择我想做的事情。有时我可能会请人帮我做些事，但我从未真正喜欢指挥别人做事。


  没有管理职责的好处之一是与其它数据科学家的交流更加顺畅。我非常喜欢那种平等的交流，你们可以互相碰撞想法，讨论各种问题。


  如果人们感觉是你的下属，这种交流效果就不太好。我更喜欢直接找个人说：“嘿！我们能谈谈这个吗？我需要另一双眼睛或另一个大脑来看看这个。”不让他们成为下属，能让这种对话变得更好。所以我们努力在这里保持平等的氛围。


  **古铁雷斯：** 数据科学小组的职责是什么？


  **珀利奇：** 我们有三大主要职责——模型构建、性能监控和欺诈检测，此外还要与小组外的人沟通。在模型方面，我们现在每周构建大约一万个预测模型，每个模型都存在于一个非常高维的空间中。


  这些模型基于 URL 历史记录，我们会从一千万个或更多 URL 的数据集中精简到大约两百万个 URL。这个过程是完全自动化的。即使我们有一个六人团队，我们也不会去逐个查看一万个模型。那是不可能的。


  有时建模工作也意味着构建非常特定的模型和原型。例如，我们最近做的一件事是构建一个竞价模型，它不仅评估一个人过去的行为历史，还会根据这个人当前的行为，专门估算在实时广告竞价中该人的正确出价，或者根据我们认为该人是“跑单者”的可能性来调整出价。所以我们构建一个原型，在小规模生产中运行以测试其效果，然后监督其自动化过程。之后，由我们的工程团队通过一个强大的、完全自动化的流程来构建，该流程包含质量保证部分，如果出现问题会发出警告。


  在监控方面，我们监督模型的运行性能及其表现。这包括观察性能，以及处理质量保证流程在发出问题警告时的情况。最后一部分则是在发现问题时进行实际的排查工作。


  在欺诈检测方面，这项工作一直在进行。我们必须处理大量的广告欺诈。我们每天收到大约 300 亿次竞价请求。


  当一个请求到来时，我们大约有 30 毫秒的时间来决定是否要对该特定请求进行竞价。如果我竞价并获胜，那么我们的系统就会在本次实时竞价中展示一个广告。问题在于，其中相当一部分竞价请求来自机器人、人工流量或非意图性的网页访问，这些访问实际上不太可能被任何人看到。这导致我们面临的欺诈问题实际上是两个问题：一是判断流量是否为欺诈流量，从而决定是否展示广告；二是理解被判定为欺诈的流量如何影响我们的模型。


  由于我们已展示广告的流量数据是模型的一部分，欺诈流量也会被输入到模型中，这意味着我们必须非常认真地思考如何抵消欺诈数据对模型的影响。有趣的是，模型在识别谁是机器人、谁不是这方面要好得多，因为机器人表现出确定性的行为。这很突出，因为我们的模型预测的是非常嘈杂的人类决策过程，比如去购买一双鞋。因此，我们主动承担欺诈检测工作的原因是，我们需要在数据流进入时就进行清理。所以，在过去一年左右的时间里，这一直是我们关注的焦点。


  在沟通方面，我们必须与小组外的人进行交流。这也是我们在数据可视化上花时间的地方。当一个营销人员问你到底是如何找到你的受众时，很难对他们说：“哦，相信我，这是一个在千万维空间中构建模型的黑箱。”这显然行不通。因此，能够解释模型所做的一些工作是我们工作的重要组成部分。最近，我们一直在做的一件事是将模型中的信号嵌入到地理位置信息中，某种程度上将桌面端和移动端世界结合起来，并实际查看人们在哪些地方购买概率最高，然后将此投射到一个地理区域并制作成可交互的图形。这确实有助于沟通。


  最后，我和我们的团队充当着公司及我们工作的形象大使。我为纽约大学斯特恩商学院的 MBA 项目讲授一门数据挖掘的高级概览课程，目的是让人们很好地理解其中的机遇以及如何管理它们，而不是真正教他们如何去做。这与计算机科学系的视角略有不同。我们也会发表文章和撰写论文。我的时间越来越多地被用于协助组织
  2014 年在纽约市举行的 KDD 会议。


  **古铁雷斯：** 这份工作中什么让你觉得有趣和兴奋？


  **珀利奇：** 我一直对数学谜题和一般意义上的谜题着迷。我所做的工作就像是生活呈现给你的现实版谜题。数据在某种程度上是现实生活的足迹，所以它总是很有趣。这就像一场侦探游戏，去弄清楚到底发生了什么。我大部分时间都在调试数据，试图找出其中的问题，或者数据在哪些地方与我对其应有含义的假设不符。所以这些都是能让我由衷感到兴奋的游戏。


  人们笑我，因为我不是一个 GUI（图形用户界面）爱好者。




  '
- '# 工作中的数据科学家


  由于隐私、防火墙和其他数据安全措施，我们无法打开任何窗口查看原始数据，因此这实际上是个无意义的问题。这意味着我只能让 ASCII 文件在我的屏幕上滚动。我盯着它们，寻找诸如“这些数字在不该有序的时候却有序”或“这应该是一个连续的数字，却含有过多的零”之类的现象。诸如此类的事情会让我非常、非常兴奋地去弄清楚到底发生了什么。而且，嘿，我还能靠解决谜题赚钱，这简直太完美了。


  **工作中的数据科学家** 157


  我也很喜欢在这里做报告和抛头露面的自由度。我总是厌倦一遍又一遍地做同样的事情，所以我在工作中需要多样化的任务。数据总是伴随着不同的问题，所以完全不用担心会长时间被困在同一个问题上。我从来都没有足够的耐心和自制力去成为一个规规矩矩的、优秀的程序员，所以我可以用
  `Perl`、shell 或者任何我想要的工具来胡乱拼凑代码，据我所知，这最能发挥我的计算机科学技能。


  **古铁雷斯：** 你玩过哪些令人兴奋的非工作数据谜题？


  **珀利奇：** 一个很好的例子来自我们用于预测乳腺癌的数据集。西门子医疗提供了 fMRI [功能性磁共振成像] 数据集，其中编码了 117 个数值变量。这个谜题是使用这个数据集来预测一个数据样本是否显示恶性肿瘤。结果发现，该数据集中最具预测性的特征是患者
  ID，即分配给患者的随机数。原因在于，他们不得不将不同的数据集合并在一起，因为他们无法从任何一个特定来源获得足够的阳性数据。所以他们必须从不同地方获取数据集，结果发现，一些治疗中心的乳腺癌患病率非常高。患者有每个地点分配的随机数。因此，模型能够识别出，患者所在的具体治疗中心是判断样本是否为恶性的一个重要指标。


  这项工作的更广阔视角是在问这样一个问题：“如果我们真的想建立一个识别乳腺癌的模型，这个数据集合适吗？”答案是，“这取决于情况。”你不能忽视它，因为即使你不使用患者标识符（当然，你并不希望它出现在你的模型中），模型仍然会找到某种灰阶校准。所以模型仍然会隐式地从地点信息中学习。如果你想在一个不同的地点集合上使用该模型，它显然根本行不通。如果你想在相同的地点集合上使用它，你基本上应该直接在其中加入一个地点标识符。这是你能建立的最佳模型。


  从这个案例中得出的有趣观察是，如果你想让它变得有用，你真的必须改变数据集或对其进行扩充。这只是那种偶然情况之一，你看着它，然后心想，“这很奇怪。这看起来像是个古怪的故事。”这正是乐趣所在。这就是我在处理数据时想要深挖的数据收集背后隐藏的故事。我发现这种思考和工作方式让我非常开心。这种有点抽象的智力挑战让我兴奋不已。


  令我惊叹的是，数据集在多大程度上违背了我的预期。如果数据完全符合我的预期——也许它出奇地干净，但毫无谜题可言，那么它并不会真正让我兴奋。


  **第 8 章 | 克劳迪娅·珀利奇，Dstillery 公司**


  **古铁雷斯：** 你还记得你处理过的第一个数据集吗？


  **珀利奇：** 我处理的第一个数据集是关于教育测试以及人们是否通过某些期末考试的信息。那是在博尔德做交换生期间。我们试图根据大学申请材料中的信息来预测他们在这些考试中的表现。这个数据集的问题在于它太无趣了，因为它过于聚合。它不包含人们的实际行为。相反，它只是他们在过去若干年里的平均绩点。这个数据集中没有什么有趣的事情发生。


  也许这就是我对大数据运动的回答，也是它为什么比以往的数据工作更令人兴奋的原因。我们越来越不需要查看那些被聚合、被准备、被预设、被篡改，以及其他各种被处理过的数据集。我喜欢的是，现在我们可以追溯到最初的记录。就像我们此刻的对话一样。对话的内容并不在于文字记录本身。真正传达兴奋感的是声音中的细微差别，而非语言本身，而这很难捕捉。数据的世界也是如此。


  **古铁雷斯：** 这种洞察如何应用到你的工作中？


  **珀利奇：** 现在，我们不再查看聚合的 URL 历史记录，而是可以捕捉到像“这个浏览器访问了这个网站，两秒钟后又访问了另一个网站”这样的信息。例如，我们可能会发现，百分之八十访问女性健康页面的人，接下来会去看摔跤新闻，然后又去电视上尝试
  Netflix。这完全说不通，而这正是让人兴奋的地方。这看起来像是欺诈行为。我找到了！


  如果你只看聚合数据，这种模式很难发现。在过去，没有大数据给予我们的基础设施，你根本无法让这些数据集保持可访问和可探索的状态。你也许可以存储它们，但你无法回头去分析它们，因为你无法获得足够的带宽和访问权限。现在你可以回到原始材料并与之打交道，这真的让我着迷。所以，实际上，情况只会越来越好。就目前而言，我觉得这只会越来越好。


  **古铁雷斯：** 广告定向投放行业正面临哪些挑战？


  **珀利奇：** 让我试着为你概述一下三个主要挑战——归因、指标和欺诈。第一件重要的事情实际上是弄清楚应该向谁展示广告。这方面的转变在于，历史上这完全依赖于粗糙的受众划分，比如中年富裕的足球妈妈或纳斯卡赛车爸爸，或者任何你想称呼他们的方式。这种划分如此粗糙和宽泛——而且老实说，毫无意义——我认为它根本没有公正地反映出人们生活和身份的实际复杂性。就拿我自己来说，我有许多不同的自我呈现：工作中的我、家中的我，以及我从事爱好的样子。


  **工作中的数据科学家** 159


  所以，用这种分类方式来给人们贴标签是毫无意义的。但这就是该行业过去一百年来的运作方式。


  而现在我们发现，该行业正转向这种非常精细、具体的数据，人们可以从中看到消费者实际做了什么，他们如何通过行为表达自己。这意味着他们可以停止使用那些通常是错误的、武断的标签。我认为该行业目前正面临的这种转变——我们是其中的一部分——需要一段时间才能真正被接受。随之而来的，是传达广告价值主张的概念。




  从消费者的角度来看，大多数人看到一大堆横幅广告并不会感到特别高兴。大约百分之九十五的互联网基础设施由广告支付，这一事实在人们认知中处于非常、非常遥远的背景位置。一旦你禁止所有广告，你将再也找不到免费的博客托管系统了。因此，我们需要进行一场讨论，关于如何找到广告的适当平衡与程度的权衡。这场讨论应围绕赋予人们大规模发言权和选择权展开，让他们决定自己愿意在付费且不受打扰与追踪、还是使用非付费内容系统因而必须面对会看到广告这一事实的连续统中处于何种位置。这就是当前的一大重要议题。


  该行业目前面临的另一个挑战是如何整合移动端，因为越来越多的人将时间花在移动设备上。相关讨论基于如何妥善处理关于人们生活轨迹的更为敏感的信息。处理敏感信息是一个相当有趣的挑战，另一方面，如何将其与指标真正联系起来，从而确保我们没有浪费任何人的时间，也是一个挑战。广告应该能够与受众相关。为了做到这一点，我需要在你采取行动时将你的身份与之关联。只有当我能够将同一身份关联到购买者身上时，我才能进行优化。


  然而，在归因和最后一次点击方面存在许多问题。这些问题实际上造成了大量的激励错位，这对行业来说是一个大问题。如果你说功劳应归于购买前最后一次展示，那么我的动机就是以最低成本向你铺天盖地展示五万次广告——我不会说得太具体——而相反，如果你尝试进行更因果性的分析，看看哪些展示似乎在总体上（显然，你无法针对单个人这样做）起到了关键作用，改变了那个人的行为，那就要难得多。虽然有分析解决方案可以做到这一点，但要让其可靠却非常困难。这就是归因问题，而指标则是其中另一个重要组成部分。


  ***第 8 章 | 克劳迪娅·珀利奇，Dstillery 公司***


  第三个挑战是广告交易平台中存在的巨额欺诈。


  当我们谈论广告交易平台时，我们基本上是在讨论一个市场，一个用于程序化购买和销售展示广告的地方。像任何市场一样，无论是 eBay、证券交易所还是展示广告市场，市场总有一部分几乎持续不断地试图利用系统漏洞牟利。在展示广告中，追踪问题更难，因为客户不会那么大声地抱怨。如果我在
  eBay 上买东西，而东西没到，我会投诉吗？会，而且 eBay 会处理。但如果客户是一个营销人员，投放了广告而人们从未看到，他们怎么会知道呢？公众的强烈抗议并不那么明显，所以在这方面，这是一个更难处理的问题。


  从技术上讲，要清晰地断言“这是一个欺诈实例，而另一个可能没问题”也更具挑战性。这是一个我们整个行业必须共同面对的挑战。我们可能需要合作并提高对此的认识，因为营销人员关注的大多数指标都极易造假。


  `点击量`曾经就是其中之一。我们看到的大量`点击`显然不是自然的，或者来自与广告展示地不同的国家。我认为点击欺诈相对更容易观察到。但当问题涉及到点击的另一端是否真的是一个真人时，事情就变得更难了。我们现在正转向可见度和其他验证真人是否在场的方法。我猜测这同样可以伪造。这使得它很像老式的垃圾邮件过滤对抗问题——每次你建立一个更好的模型，你的对手就会试图找出如何击败你更好的模型。这会把游戏变成一场升级竞赛。我想这会让数据科学家们有事可做。


  **古铁雷斯：** 到底是什么驱动了欺诈问题？


  **珀利奇：** 欺诈问题的主要原因之一是行业的高度碎片化。有营销人员自身。他们历史上一直依赖代理商来帮助他们执行营销活动。然后是创意部分——试图为一特定受众包装品牌信息。接着你有各种不同类型的媒体，不仅包括平面、电视、在线和社交，甚至包括户外媒体——基本上就是广告牌——这些也是孤立的，因为它们是完全不同的测量和互动形式。现在，我们又在已有的行业参与者、数据提供商和实时交易平台这一层级上增加了新的元素。其上是像
  Dstillery 这样的公司，它们被要求进行定向投放。可以想象，每个参与者对于问题是什么、问题出在哪里以及如何解决，都持有略微不同的看法。而且，不仅如此，他们对于自己真正应该实现的目标也有着非常不同的激励因素。


  ***《数据科学家在工作》*** 第 161 页


  取决于你站在哪个位置，欺诈问题可能不是问题，可能是小问题，也可能是大问题。例如，实时交易平台。它们按流量收费。它们基本上会说：“判断这是个好机会还是坏机会，或者这是不是欺诈，真的不应该是我的问题。”现在，你可以争辩说，嘿，如果你是
  eBay，那这就是你的问题，你应该清理它，但这些实时交易平台是按批量付费的，所以他们不一定有那种动力。此外，他们会说：“瞧，我甚至有广告主想要它，因为它在某些指标上看起来很棒。你说我不应该卖，但你猜怎么着？我有客户认为这正是他们想要的，”所以这让他们处于非常艰难的境地。


  现在，广告代理商会说：“如果我告诉我的客户这一切都是欺诈，你猜会发生什么？我会失去他们的业务。这同样不符合我的真正利益。我会看看能否以某种方式绕过这个问题。”


  接着，在衡量创意的广告效果时也发生了类似的问题。我们开发了一些内部工具，可以实际看到展示广告是否对购买行为有任何影响。我们曾见过一些广告活动，其创意非常注重点击率，而我们证明它对购买行为的影响为零。我们曾一度将这些工具作为服务提供，但问题是，每当答案不是正面时，没有人想知道答案。如果你回去告诉一个大广告主：“哦，顺便说一下，你的创意没有任何效果，”这有点糟糕。


  **古铁雷斯：** 没人想听到这个。


  **珀利奇：** 没人想听到这个。这就是我所说的激励问题的含义。




  ### 排版后的文本


  因此，事物的呈现、沟通和表达方式在很大程度上会从截然不同的角度传递出截然不同的信息，这取决于你阅读的内容，所以你可能需要非常广阔的视野才能理解这些问题。实际上，并没有一个单一的地方能实现这一点。许多研究导向的实体——*《广告研究杂志》*和*美国市场营销协会*——在科学性上更强，是一个不错的起点。我认为它们正在努力追赶现实的发展速度。过去五年间，这个行业发生了翻天覆地的变化，堪称一场革命。这意味着研究领域正在努力建立分析这些事物的良好标准。实际上，谁也不知道该如何处理这一切。


  **古铁雷斯：** 你典型的一天是什么样的？


  **珀利奇：** 对我来说，典型的一天在很大程度上取决于我在这里为自己打造的特定领域。正式地讲，在我入职大约两年后，我与首席营销官、首席执行官和首席技术官共同明确了我职位的定义。让我解释一下我在这里非常具体的职责划分。我花
  20%的时间从事管理工作，这包括智力领导及相关活动。我花 40%的时间为核心业务做贡献，这意味着我要构建模型并进行数据分析。最后，我花 40%的时间担任公司的大使。


  **古铁雷斯：** 典型的大使周是什么样的？


  **珀利奇：** 这种安排让我能够花相当可观的时间进行演讲。我大概每周一次。例如，周六我将前往华盛顿特区，参加一个 AAAI（人工智能促进协会）的活动。下周四，我将在华盛顿特区乔治城的一个关于立法的专家小组讨论会上发言。


  然后，第二天，我飞往加利福尼亚州旧金山，在伯克利做一个简短的演示。这大致就是我的日程安排。


  此外，我在 O''Reilly Strata 会议上做了两场演讲，然后在 Data IO 会议上做了主题演讲。我做了很多演讲，主要是因为我喜欢并乐于这样做，而且公司也很欣赏我这么做。我也会参加许多当地的聚会和交流会。


  **古铁雷斯：** 典型的知识领导工作日是什么样的？


  **珀利奇：** 关于实际的内部工作，我们这里的会议非常非正式。我会联系两三位同事，聊聊他们手头正在做什么，以及在那个背景下什么是有意义的，然后交流一些想法。我们目前也在讨论想发表什么内容，所以前几天我们进行了一场头脑风暴，探讨哪些是我们觉得可以放心撰写并可能提交给
  KDD 或其他会议的好素材。这种团队合作在这里是常态。


  **古铁雷斯：** 典型的建模与分析工作日是什么样的？


  **珀利奇：** 我的日常工作分为常规任务、特殊项目和构建新原型。举一个我亲自处理的特殊项目例子：最近我花了几个小时深入钻研了首席技术官向我提出的一个具体问题。问题在于，我们用来关联物理位置和桌面身份的方式出了问题。这个过程的一个例子是，如果我们看到人们出现在机场，就会将其关联到“他们的桌面身份”。


  完成关联后，我们就可以尝试针对他们投放旅行广告，看看能触达多少用户，然后衡量这是否有价值，即是否具有更高的预测能力或更高的转化率。我们的首席技术官要求我确保从某些移动广告竞价请求位置信息到通过
  IP 地址转换为 Cookie 身份的翻译过程能够被正确识别和转换。然后检查这些 Cookie 身份是否在后端的竞价系统中正确运行。最后，当我们对这些身份出价时，是否真的获得了广告展示。


  这意味着这是一个侦探游戏或谜题，对吧？你预计会看到大约十万次展示。结果发现系统只看到了三次展示，你就会开始想，它们在传输过程中到底发生了什么？要弄清楚这一点，你需要从大型
  Hadoop 集群中提取非常特定的数据集，并追踪数据流（如特定事件）在系统中的流转，看看它们能否从另一端输出。如果无法输出，你就得找出它们是在哪里丢失的。这就是实际工作中的侦探环节，就是弄清楚数据出了什么问题。


  **古铁雷斯：** 那你的常规任务呢？


  **珀利奇：** 至于我更常规的任务，我几乎每周都会重建并研究我们的库存模型。这是一个通过我运行的几个半自动化定时任务完成的基本流程。每次有竞价请求时，后端都会运行这些库存模型。请记住，我们每天要处理多达
  300 亿次竞价请求。所以这些模型是预测模型，用于评估当前竞价请求的 URL 对特定广告活动的价值。


  如果价值高，我们就对该请求出价。否则，我们就放弃。


  举个例子，对于我们的旅行广告活动，我们知道如果收到来自 Kayak 的竞价请求，旅行广告活动的转化率会乘以 4。因此，对于 Kayak 的 URL 和旅行广告活动，系统中会有一个因子，将出价乘以
  4、3.5 或 4.7。所以，根据模型的估算，这些模型会决定是否出价以及出价多少。


  所以我的日常工作就是启动并运行这些模型。运行完成后，我会快速审视结果。这个过程没有完全自动化，因为其依赖的技术对数据流和竞价请求有点敏感。


  所有涉及竞价请求的事物——拍卖中的供需关系——都有点棘手。我更倾向于查看结果，以确保它们能通过我个人的直觉检验。我可能会花些时间查看结果，确保它们在我们期望的大致范围内。然后我会把它们交给客户管理负责人加布里埃尔，以便我们进行讨论。我们与耐克等品牌对接的方式是，由专人负责管理这种关系以及广告活动。因此，他们决定投放多少广告以及设定什么目标。


  在某种程度上，我们会就众多模型中哪个最好提出建议，但他们拥有一定的最终决定权，因为模型只针对单一目标进行优化。


  有时，广告活动衡量的可能是其他指标，或者使用不同的归因标准，因此需要进行一些转换。这中间涉及人工步骤，这也是我们至少每周重新审视一次结果的原因。我们经常对模型、结果和性能进行深入分析。我们可能会讨论：“我们觉得这个广告活动未能达到预期效果。你能告诉我们是否应该改变投放频率，或者是否需要用某种方式调整出价策略？”因此，我会花一些时间与楼上的同事合作，处理一些客户管理工作，将我了解的这些机制如何运作的知识，转化为如何最优执行特定广告活动的策略。



  **古铁雷斯：** 你的原型构建任务进展如何？


  **佩利奇：** 我有很多喜欢的小玩具问题。有时它们会被开发成新的原型。这些玩具问题涵盖的范围很广，比如有反馈说我们在某些广告活动上表现得太好，或者反馈说我们没有在其他广告活动上实现应得的利润。原型工作很大程度上就是观察和探究，看看是否有聪明的方法进入我们的系统、审视数据，并判断是否有我们应该采用的策略来帮助我们的客户并提升我们的利润空间。


  一旦我决定构建一个原型，我就对要做什么有了基本概念。我会实现它，然后在一个小数据集上进行测试。我们称这些小数据集为“沙盒”，因为它们不使用生产级数据系统。我运行原型，观察它在沙盒中的表现如何。如果结果不错，我们就会用更大的数据集进行测试。


  最近就有一个这样的案例，我们觉得我们的出价和最终支付价格之间的关系有些问题。拍卖的运作方式有点像 eBay，按理说赢家只需要支付第二高的出价。针对这些广告活动，我们想要一份不应出价的发布商黑名单，因为由于某些原因，我们赢下的出价非常昂贵，而它们的表现却非常糟糕。在这种情况下，我们发现，似乎我们可以降低这类请求的出价，从而节省利润，而对于某些广告活动，表现甚至还会提升。我不知道这是为什么，也不知道是什么原因导致的，所以这就成为了我们最终构建的一个原型，用于选择哪些广告活动采用不同的出价策略。但它最初只是我的一个小型个人项目，用了一个玩具模型，我花了三天时间研究，直到我们有了一个原型。它并非对所有广告活动都持续产生价值，所以我们没有将其自动化，而是把它当作一个在需要时使用的工具。


  **古铁雷斯：** 你使用哪些工具？


  **佩利奇：** 我们是一个非常注重自给自足的工作室，所以我们自己构建需要的东西。我对生产端的具体情况并不是特别精通，所以我就谈谈我们这边的情况。在我们这边，主要有两个技术领域。


  ***数据科学家在工作*** 165


  第一个领域是用于分析的数据收集和存储。另一个领域则负责在 30 毫秒内对出价请求做出实时响应。因此，我们使用了 NoSQL 技术——例如`Cassandra`和其他高速查找表。


  就我的日常工作而言，我们有一个`Hadoop`集群。所有传入的事件都被转换成标准格式并进行存储。我们有所有事件的事件日志——出价请求、展示、点击、转化、所有访问数据等等。我希望所有东西都记录下来。我们将它们记录为事件日志，包含特定的回溯期和字段。


  它们存放在一个`Hadoop`集群中，在此基础上我们使用了`Apache Hive`。


  `Hive`是一种工具，基本上可以让你用或多或少标准的 SQL 来查询这些数据。它不一定是实时的。由于与`Hadoop`的整个交互过程，它会有点慢，但我不需要实时。我只需要获取我想要的数据。所以我用`Hive`从`Hadoop`中提取数据。


  处理这些数据的关键在于弄清楚你需要的确切数据样本，也就是要找出哪个`Hive`查询能给你这些数据。通常，我会尽量避免处理超过 10GB 的数据。对于我需要做的大多数事情，我可以进行大幅降采样，因为我不需要处理所有数据。一旦我弄清楚需要哪个降采样的数据集，我只需编写正确的查询来获取我需要的那部分。


  **古铁雷斯：** 你使用哪些工具来预处理数据？


  **佩利奇：** 我使用很多 UNIX 工具——`sed`、`awk`、`sort`、`grep`等等。只要你能想到的，我可能都用过。我也用`Perl`编写大量自己的代码。我写很多脚本来处理这些数据。编写脚本的目的更多是为了分析。


  更确切地说，是为了将数据预处理成一种状态，以便我可以将其通过某些专用工具运行。


  **古铁雷斯：** 你构建了哪些类型的专用工具？


  **佩利奇：** 对于我们所做的核心建模，我们有自己实现的随机梯度下降逻辑回归。这个东西处理大约 1000 万个样本和 1000 万个特征，在 5 到 10 分钟内就能得到结果。它不是并行的，但非常切中要点，并且针对我们处理这类稀疏数据的特定用例进行了很好的实现。


  我们是一个非常注重自给自足的工作室，所以我们不使用任何商业工具。因此，我们构建自己的专门解决方案。当我们有需求时，我通常会在学术文献中查找，比如说：“好吧，让我们看看`SVMlight`（康奈尔大学某种具体的支持向量机算法实现）在做什么。”
  我首先检查性能，即使需要三个小时，那也没关系。或者我们试试随机森林。我可以获取这些代码的示例，然后看看哪个对某个特定问题效果好。


  ***第 8 章 | Claudia Perlich,** Dstillery*


  当我们得出看似正确的技术解决方案的结论时，我们通常会重新实现它，并针对我们需要的精确设置进行调优。然后，这就成了我们的内部解决方案。


  **古铁雷斯：** 你使用哪些非专用工具进行数据分析？


  **佩利奇：** 我们仍然大量使用`R`，但这需要更多的降采样。你无法在我们想要的数据集规模上运行随机梯度下降。或者，至少我不知道怎么做，这么说吧，我把这个留给别人。偶尔我们会进行数据可视化，不过主要是为了沟通目的。在我们这个高维模型的世界里，没有什么真正值得看的东西。对于数据可视化，我稍微摆弄过一些用于制作地图的`KML`（`Keyhole
  Markup Language`，关键穴标记语言）文件。我们还在面向客户的方面使用了`D3.js`，在那里我们展示所运行广告活动的统计图表。面向消费者的方面更多是分析团队的工作。所以数据科学团队并不太参与那部分。


  **古铁雷斯：** 在使用这些工具将玩具项目转化为生产系统的过程中，你学到了哪些经验教训？


  **佩利奇：** 我不确定这算不算针对这些工具本身的经验教训，但一如既往，当你开始仔细研究一个之前没人特别关注的数据集时，你最终会发现一些你意料之外的东西。例如，谈到出价与表现问题的那个案例，我们意识到，在某些库存（即
  URL）上，我们总是按照出价支付。现在，根据规则，这是第二价格拍卖。这种情况本不应发生。所以我们发现了几起案例，感觉计费系统的设置方式可能不正确。我们还发现了一些实例，我们只是以错误的方式硬编码了最低出价。我想，最重要的经验是，如果一个数据集超过一个月没人查看，它很快就会变得毫无用处，因为在某些地方它几乎完全是错误的，所以只有定期查看和处理的数据集才是可靠的。


  即使该项目出于其他所有原因会完全失败，我认为它也在我们的设置中找出了足够多的问题，这足以值得我花三天时间去做。这是我们一次又一次意识到的事情——附带观察和洞察几乎总能带来超出主要目标的价值。每当你审视数据时，这种额外价值都非常一致地出现。




  '
- "# 另一个令人惊叹的案例，展示了真正审视数据能学到什么教训。它发生在最近一次调查欺诈案件时。\n\n我的首席技术官走进来说：“各位，你们在过去两周内将我们所有广告活动的效果提升了一倍。有什么要跟我说的吗？”我们面面相觑，因为我们实际上什么都没做。唯一做过的事情就是从各个交易所添加了一些新数据。但一旦你知道预测人类行为有多难，业绩翻倍这个事实本身——就有点吓人了。最终发现，确实，业绩翻倍是因为存在实施欺诈的机器人。我们之所以能通过数据识破这一点，是因为这些机器人的行为非常机械刻板。\n\
  \n整件事最初只是一个业余项目，目的是搞清楚为什么业绩会翻倍——这在某种程度上是件好事。但我们足够怀疑，以至于没有轻信。结果发现，整个机器人网络都在欺骗我们。好吧，我很高兴我们讨论并搞清楚了这一点。从那以后，我们实施了一整套监控系统来防范这种情况。这类事情非常典型：我们开始调查一些事情，说：“嘿，发生了一些非常令人惊讶的事情”，而答案通常与你最初的推测完全不同。这就是学到的教训：始终要对旁枝末节保持开放心态。我认为这是一种很好的技能：不要仅仅缩小范围，只盯着你眼前的特定问题。保持开放思维，看看这里还在发生什么。你通常会在过程中发现更多事情。\n\
  \n**古铁雷斯：** 什么造就了优秀的数据科学家？\n\n**佩利希：** 我认为这确实是优秀数据科学家的标志——你必须对应该发生的事情有一定的直觉。你不需要成为医学专家才能意识到患者\
  \ ID 具有预测性是一个问题。只需要一些常识就能观察到这一点。我认为这种直觉是通过大量经验培养出来的。你未必能仅仅通过将计算机科学家或数学家训练成数据科学家。\n\
  \n我所观察到的是，有一类人能够接纳不确定性和噪声及其含义。还有另一类人则喜欢生活在一个确定性的非黑即白的世界里。从某种意义上说，他们相信当你对列表排序时，它就被排好了。一旦算法对列表排序，它总能正确排序，因为这就是它的设计目的。算法要么是正确的，要么是错误的，但你有非常明确的正确性度量标准。\n\
  \n一旦你转向数据层面，整个世界就出现了更多灰色地带。对我来说，观察我们与一些工程团队的互动真的很有趣。有些人能理解这一点，有些人最终也能想明白，而有些人则觉得只要完成了列表上的步骤就算完事了。最后一类人没有理解到，执行完这些步骤之后，你必须开始审视输出结果，检查这些输出是否合理。“合理”或“这不应该发生”并不在这些程序员的非正式检查清单里。\n\
  \n因此，数据科学家需要这种围绕数据的直觉部分。这就像怀疑精神和抱有预期一样，是性格的一部分。我和我的朋友安德烈亚斯·魏根德进行过一次长谈，他是第一个让我对数据感到兴奋的人。他的信念甚至更坚定。他认为：“你必须要有情绪反应。”我说：“你只要抱有预期就行了。你需要知道你会期望看到什么，然后你才能看出它是否偏离了预期。”他认为这很好，但他更强烈地认为必须要有情绪上的反应。\n\
  \n**古铁雷斯：** 这是一个人与生俱来的，还是可以教授和/或学习的？\n\n**佩利希：** 在我自己和其他数据科学家身上，我始终观察到一种能力，那就是说：“你知道，有些地方看起来不对劲”，尽管可能需要一段时间才能将这种感觉转化为可以表达的内容，并正式论证其错误之处。这通常始于“嗯，我不太确定这个。”要培养这种能力，我认为需要良好的师徒传承。你需要有人向你展示这个过程。你需要与这个过程和解。我有幸拥有非常好的导师，从安德烈亚斯开始，然后是福斯特，他对这些事情有着非常相似的背景和态度。有趣的是，这个过程并不那么正式，但只要你见过几次这个过程，你就能开始掌握它的要领。\n\
  \n话虽如此，你不可能强迫每个人都接受。它需要经验和学徒经历，但这是必要条件，而非充分条件。除了经验和学徒经历，你仍然需要对正在发生的事情有直觉。\n\n**古铁雷斯：**\
  \ 你如何看待自己是否在解决正确的问题或对正确的事物建模？你甚至如何知道自己拥有了正确的数据？\n\n**佩利希：** 这是数据科学领域出现的最普遍的问题之一。要回答这些问题，仅仅有技术技能是不够的。我可能知道如何解决一个问题，但是能否对别人向我提出的问题本身是否有意义提供反馈——这是一个非常棘手的问题。\n\
  \n我喜欢在 Dstillery 工作的原因之一，就是这里非常欣赏数据科学的作用以及我们如何提供帮助。从商业角度来看，我们几乎从一开始就参与了几乎所有的决策过程。我在\
  \ IBM 担任咨询工作时看到的是，如果一个对话中没有了解数据能做什么的人参与，你最终往往会解决错误的问题，或者根本解决不了问题。\n\n我喜欢把它比作牵线搭桥。首先，有你试图解决的问题。其次，有你可能有、可能没有、或想要获取的数据。最后，有算法。作为一名数据科学家，我的主要挑战是用正确的算法，将正确的数据与你实际想要解决的问题连接起来。然而，在尝试匹配这三者的过程中，也可能意味着这个问题无法用我所知的任何算法来解决。也可能意味着我们的数据可能不对。最后，还有一个问题：我们正在解决的这个问题本身是否相关、是否定义明确、是否从一开始就是正确的问题？在问题、数据和算法之间进行这种迭代的最佳方式是，你需要有一个由业务人员和数据科学家共同组成的团队。数据和算法知识存在于数据科学家手中，但要真正将其与你想要解决的业务问题联系起来，如果你能把数据科学家请进会议室，让他们从一开始就参与讨论，那就太好了。\n\
  \n我想到一个例子。最近有人来问我：“我们看到的 cookie 平均年龄是多少？”这个问题表面上听起来有意义，但实际上并不是一个很有意义的问题。要回答这个问题，我可以给出在一小时到三个月之间的任何数字。不仅如此，每个时间段给出的答案都可以是合理的。之所以有这么大的差异，是因为如果有人在他们的电脑上禁用了第三方\
  \ cookie，那么该 cookie 看起来就像只存活了零秒，所以我写下 cookie，它再也没有回来过。\n\n\n```markdown\n# 第 8 章\
  \ | Claudia Perlich，Dstillery\n\n现在的问题是，我到底要不要把它们算进去？如果它们是平均值的一部分，那么我们谈论的就是一个在零处有巨大尖峰、拖有极长尾部的分布。对于这种分布，平均值是没有意义的。如果我把零算进去，答案是一小时。如果你问我，我们至少见过两次的稳定\
  \ cookie 的平均年龄是多少，那么我的答案会从一小时跳到三个月。所以你可以看到，如果没有更具体的信息，平均值是毫无意义的。\n\n因此，当有人问我这类问题时，我的回应是问一系列问题：你为什么想知道？你打算用我告诉你的东西做什么？你打算用它来达成什么目的？你会根据我的答案做出什么决定？在理解你在做什么之前，我不会做出陈述或回答问题。\n\
  \n**Gutierrez：** 这是否部分解释了为什么让数据科学家从一开始就参与对话是有帮助的？\n\n**Perlich：** 是的，因为——取决于目标和背景是什么——答案可能完全不同。问题在于，很多人认为自己足够了解数据，可以谈论平均值和其他统计指标，这让他们觉得自己能提出有意义的问题。但问题在于，在现实世界中，数据不像他们在课堂和书本上看到的数据那样。他们没有意识到，自己对分布和其他统计指标的实际运作方式知之甚少。如果他们知道，就会意识到单一数字的汇总几乎总是完全无用的。而这正是我需要进行的对话部分，因为在知道你想做什么之前，我不会给你一个数字。你可能正在解决正确的问题，只是不知道如何提出正确的问题。甚至不一定是问题本身错了，你可能只是无法在提交问题时以一种有意义的方式将其表述出来。\n\
  \n**Gutierrez：** 你如何看待非数据科学家向你以及向数据提问这个问题？\n\n**Perlich：** 你不能期望每个人都成为数据科学家。我并不真的需要我的\
  \ CEO 或其他管理层人员理解长尾分布的细微之处。我认为，对于管理层来说，有其他更重要的核心能力需要培养和发展。最重要的是要摆脱你过去在很多设有统计学家的机构中看到的“孤岛”模式。在这些机构中，统计学家被安置在地下室或远离业务部门的地方。没人认识他们，他们被完全隔离。你只需向他们订购一份报告，他们就会把答案返回给你。然后你根据这些报告做出任何你想做的决定。我见过的与统计学家和数据科学家合作成功的唯一情况是，问题解决是以团队形式进行的，你实际上有足够的面谈时间来与最终执行的人进行对话。\n\
  \n在教育和数据素养方面有帮助的是，你不必在每次讨论时都花三天时间来统一术语。至少我们必须知道如何互相沟通。当你向我索要平均值时，在开始对话之前，有一个关于平均值含义的共同语言会带来巨大的不同。否则，如果我不能迅速切入要点或理解他们问的是什么，人们几分钟后就会走开。\n\
  \n这意味着业务方可能应该具备一些高层次的分析理解能力。他们不需要能亲自操作，但他们需要掌握足够的词汇来理解他们的技术人员或数据科学家在告诉他们什么。同样，强制技术人员或数据科学家实际与从业者交流也是非常好的。让他们真正了解业务方以及那个世界的通用语言，并非世界上最糟糕的事情。这是双向的。这并非要让每个人都变得多才多艺，更多的是就一种用于沟通的词汇达成一致并学习它。一旦你做到了这一点，就是向前迈出了一大步。\n\
  \n**Gutierrez：** 当你在招聘时，你是如何思考这个过程的，沟通方面在其中扮演了什么角色？\n\n**Perlich：** 在内部，我们一直在进行一场有趣的对话，讨论数据科学家是史上最困难的工作之一，因此如何正确地招聘一位数据科学家。随着我们最近招聘了两个人，这场讨论一直在进行。面试分两个主要阶段。首先，我们给他们半小时的时间，就他们之前的工作做一个演示。这个演示可以是他们以前做过的一两件事。然后我们会讨论一些我们正在处理的问题，并征求他们的想法。在整个面试过程中，我们主要考察四个方面：直觉测试、批判性思维、沟通能力，以及他们如何推动理解数据的过程。\n\
  \n我首先看的是直觉测试。我需要你有那种感觉，即当数据中的某些东西感觉不对劲时能察觉到。这是如果你没有一定的感觉，我就无法教你的东西。我可以教你语言。我完全不需要的是领域知识。当我们第一次与\
  \ HR 人员讨论需要数据科学家时，他们问我们是否需要他们了解数字广告。\n\n我们告诉他们：“不，完全不需要。我们一点也不在乎。”相反，我更喜欢那些在十个不同领域做过十件不同事情的人，因为他们很可能从每一个不同的地方和领域学到了一些关于数据的新东西。我宁愿要广度而不是深度。所以，忘掉领域知识吧。我假设他们足够聪明，可以在两周到三个月内学会他们需要了解的领域知识。\n\
  \n在直觉测试之后，我们会考察其余的标准。我认为沟通能力在任何一组要求中都没有被明确提及，但这是我们在与候选人交谈时能感知到的东西。在批判性思维方面，我们可能会向他们展示数据图，然后说：“这里面有什么让你觉得奇怪的地方吗？”我们想看看他们如何处理这些信息，并提出他们认为对于真正弄清事情根源至关重要的那些问题。\n\
  \n然后我们会继续说：“好的，这里有一个问题。”对我们来说，甚至比谈论问题更重要的是，他们能够并且自如地开始提出正确的问题。当我提出一个场景时，我希望他们问：“你这是什么意思？”他们需要知道什么时候自己真正理解了某件事，什么时候没有。所以，思想开放并且能够推动这个过程是非常重要的。毕竟，这就是他们作为数据科学家在这里要做的事情。\n\
  \n**Gutierrez：** 你和其中一位新员工探讨了什么问题？\n\n**Perlich：** 当我们面试 Melinda 时，我们看了一个我们最近做过的项目。我们说：“我们必须优化\
  \ Nielsen 报告。”Nielsen 是为广告活动提供反馈的公司之一。例如，他们可能会告诉你，在你展示的所有广告中，女性看到了 73% 的广告。关于这一点，有趣的是\
  \ Nielsen 有一些内部样本组。这个样本组并不涵盖你向其展示广告的所有人，而只是其中一部分人。然后，这个样本组的一部分会与 Facebook 进行匹配。\n\
  ```\n\n  \n然后，他们根据脸书上这个百分比，找出其中哪些人自我认定为女性。这些人是否是女性是另一个问题。但这就是那份报告的基础，报告告诉你，女性看到了\
  \ 73%的广告。所以，这些数据是某个子集的某个子集，很难判断它最终是否能代表我的广告样本。现在的问题是，我需要在无法访问任何底层数据的情况下优化它。但由于它不是一个预测模型，我无法针对任何个案/个人得到答案。我只能获得每十万次展示的汇总反馈。\n\
  \n这是我们最近一直在思考和解决的问题。在内部，我们进行了头脑风暴，并基本上制定了一套方法。\n\n所以当我们面试梅琳达时，我们问了这样的问题：“你如何优化它？”以及“如果这是你想要的，你如何建立一个模型来针对女性进行优化？”这通常不是我们想要的，但我们想听一听她的思考过程。我们说：“告诉我们该怎么做。你有一小时的时间。如果你想问问题就问。这是我们正在研究的问题。”进行这样的对话非常有趣。\n\
  \n**古铁雷斯：** 梅琳达是如何处理这个问题的？\n\n**珀利奇：** 梅琳达深入研究了概率论，她说：“你有一个群体，其中 80%是女性。另一个群体 70%是女性。两者的交集：应该是高于\
  \ 70%还是低于 70%？你同时出现在这两个群体中，是增加了我认为你是女性的概率，还是降低了它？”\n\n于是我们讨论了如何用贝叶斯概率理论来处理这个问题——特别是，在哪些情况下可以假设独立性与重叠性，等等。最终，这个想法并没有被我们实际采用，因为重叠部分不够充分。但我们确实采纳了其中的一些想法，并将其转化为一个预测建模任务：“好吧，让我们用它来随机标记样本。我们找一堆尼尔森认为是女性的样本。如果他们说是\
  \ 80%的概率，那么我们就以 80%的概率将这些样本标记为女性。”我们对所有类型的细分群体都做了同样的处理，然后在此基础上建立了一个模型。所以，我们伪造了结果，并基于概率建立了模型，而这实际上正是我们最终采用的方案。\n\
  \n**古铁雷斯：** 那么，这场面试基本上就是一场工作会议了。\n\n**《数据科学家在行动》** 第 173 页\n\n**珀利奇：** 没错。在我们日常工作中，经常会有这样的对话：“我们遇到了一个棘手的问题。找个能人来想想该怎么解决。”这种工作方式和他们的汇报，能让我们了解他们的直觉判断力、批判性思维、沟通能力，以及他们如何推动理解数据的过程。这也能让我们看到他们如何提问。我们特别感兴趣的是，他们会问哪些关于问题背景、约束条件、问题发生的环境，以及行业或特定场景中相关因素的问题。当然，我们也非常有兴趣了解他们是如何想出解决问题的方案的。我们认为这是个好方法，到目前为止，我们面试过的人似乎也都很喜欢。\n\
  \n**古铁雷斯：** 没有数据科学家的公司，要招聘数据科学家是不是很难？\n\n**珀利奇：** 是的，我这里甚至还没谈到说服他们加入你以及相关的成本问题。公司可能在供应商的帮助下已经开始收集数据了。既然公司有了数据，或者很快会关注数据，他们就必须去招聘一些人来处理这些数据。\n\
  \n但当他们寻找数据科学家时，问题在于“数据科学家”这个职位描述是完全不明确的。公司面临的最大问题是，如果他们要尝试招聘一位数据科学家，他们甚至不知道如何判断自己是否在面试一位数据科学家，因为他们并不真正了解“数据科学家”的含义。只要他们没有一个数据科学家去识别另一个，这实际上就是一项相当艰巨的任务。可能有点过于消极了，但在我看来，很多数据科学家基本上只是更改了简历上的标签，对其中一些人来说这说得通，但对另一些人来说则不然。一个主要问题是，到目前为止，数据科学家并没有一个公认的技能集。如果你招聘一个数据库管理员，你知道你得到的是什么。如今，如果你招聘一个数据科学家，你不知道你得到的是什么。\n\
  \n**古铁雷斯：** 对于已经有数据科学家的公司来说，招聘数据科学家难吗？\n\n**珀利奇：** 更容易一些，因为如果公司已经有了一位数据科学家，第二位更有可能接受这份工作，而且你有可以某种程度上评估候选人的人，但这仍然远非易事。数据科学领域最大的担忧之一是我称之为“质量控制”的问题。如果我建了一个模型，我对模型的整体质量有一个很好的直觉判断。然而，我无法告诉你它究竟有多好，因为我不知道再花一周时间研究它，性能是会提升\
  \ 5%还是 50%。我对此有种直觉，但现实是，数据中有一部分噪音与算法完全无关。这使得你很难真正了解自己在模型质量上处于什么位置。根据我花费的时间、探索的深度以及还有多少未探索的余地，我对自己模型的预测质量还算有把握。\n\
  \n**第 8 章 | 克劳迪娅·珀利奇, Dstillery**\n\n所以现在，一家有数据科学家的公司想招聘一位数据科学家。这位数据科学家给了公司他们负责的一个项目，然后公司就应该判断这个数据科学家的模型有多好？数据科学家自己都不知道。公司也不清楚这位数据科学家到底做了什么，或者本可以做什么。而且，除非是在同一个行业，公司甚至可能并不真正了解这些数据。因此，从一个半外部的角度，甚至是管理或招聘的角度来看待一个项目，去评判它本可能达到或应该达到的水平有多好，几乎是不可能的。而这直接关系到衡量数据科学家的技能水平，因为技能水平决定了能产出多好的项目。所以，质量控制既是项目本身的问题，也转化成了评估你正在招聘或洽谈对象的技能和方案的真正难题。如果你已经有一个团队，他们既能审视项目，又能对数据科学家进行直觉判断，那就会容易一些。\n\
  \n**古铁雷斯：** 您如何看待数据科学的现在和未来？\n\n**珀利奇：** 就目前而言，我不太确定我们作为一个群体处于什么位置。这种不确定性部分源于数据科学和大数据的叙事很大程度上是由那些有切身利益的人塑造的，无论是供应商还是顾问。他们专注于告诉你所有可以用大数据做的酷炫事情。这产生了许多人难以满足的期望，这是消极的一面。\n\
  \n与此同时，我认为人们对数据带来的机遇有了更多的认识，这是非常好的事情。因为过去二十年里，我们一直在争论数据和它的未来。我很高兴终于有人愿意听了。我认为这完全是好事。有很多人一直在用数据做很酷的事情，但可能长期被忽视。现在他们开始获得一些关注。\n\
  \n在未来，我认为我们将拥有一个规模大得多的、技能娴熟的人才群体。\n\n\n\n我还认为，关于数据的教育、语言、鉴赏能力以及发现机遇的能力也将得到提升。尤其是在管理层方面，我们将看到这种知识的增长。\n\
  \n未来人们也会更清晰地认识到，数据科学并非总是有用的。有很多领域你并不需要数据科学家，不要让任何人告诉你并非如此。归根结底，你能用数据做的事情是有限的。如今我看到很多人鼓吹的东西，只会让我翻个白眼说：“好吧，行——随便吧。”仅仅因为某件事可以用数据完成，并不代表它就有价值，哪怕它看起来很酷。归根结底，问题必须始终是：你是否能够并且愿意根据数据采取行动。如果不能，那你就是在浪费金钱和资源，搞“数据色情”。\n\
  \n`Data Scientists at Work` 175\n\n我认为我们还需要五到十年的时间，才能更好地理解最佳实践和预期，知道什么时候事情真正有效且有用，什么时候并非如此。我不认为数据科学的实践方式会发生根本性的改变。随着炒作降温，我认为一些流传的更硬核的概念，比如优化，会得到更多的认可，而一些炒作性强的东西，当人们意识到它们最终无法产生真正影响时，热度会有所下降。\n\
  \n例如，每当有人向我索求可执行的洞察（actionable insights）时，我都会非常犹豫。这让我害怕。真的让我害怕，因为如果你不先告诉我你的行动是什么，你怎么能期望我告诉你可执行的洞察呢？除非你非常清晰地沟通，并且思考清楚你到底能做什么、愿意根据数据做什么，否则让我像没头苍蝇一样在数据里乱转，然后带回所谓的可执行洞察，这根本就是徒劳的任务。你给我的数据越多，情况就越糟，因为我会找到更多可能毫无意义的东西。我认为我们需要改变这个过程，而这又回到了沟通问题上。我认为这将会改善，但我不认为会有任何根本性的改变。\n\
  \n我不相信数据科学会被自动化。我不相信你的秘书能为你做数据科学，尽管它被宣传成那样——好像人人都能做数据科学。这不是真的，因为通常情况下，问题出在数据上，你必须先找到问题，如果你不了解数据，你就无法做到这一点。仅仅因为你可以在数据上运行算法，并不意味着你得到了有意义的结果。你确实需要审视数据。这种能力必须具备。必须有人在其中，在某个环节。你不能把一切都隐藏起来，抽象成数据层和酷炫的工具。那是行不通的。\n\
  \n**古铁雷斯：** 你认为数据科学应该重点关注哪些领域？\n\n**珀利希：** 我认为数据科学在医学领域，特别是大众健康方面，有巨大的机会可以产生重大影响。要实现这种影响，我们必须回过头来，真正弄清如何处理隐私和数据共享问题，以便奠定良好的基础。我个人曾多次放弃医疗应用项目，因为我总是被\
  \ HIPPA 法规卡住。这令人沮丧，因为我感觉自己的手脚被束缚住了。知道如果不受限制，我本可以产生巨大影响，这非常令人沮丧。\n\n在医疗领域，我认为至关重要的是，我们要更好地理解这些法规所带来的利弊权衡。我们需要让医学专家清楚地沟通哪些事情可以做，以及处理数据的人会是谁。与大多数事情一样，部分问题在于信息共享的缺乏。每个医生基本上都有自己读过的病例，并且了解自己过去二十年职业生涯中做过什么。\n\
  \n`第 8 章 | Claudia Perlich, Dstillery`\n\n所以当医生遇到一个新病人时，他们是在利用自己的经验以及他们读过的病例——可能甚至包括来自医学期刊的一些内容。更好的做法是，能够以保护隐私的方式，将某个人的具体情况、病情、用药和症状结合起来，输入到一个系统中。然后我们可以让系统告诉医生：“这种情况我们见过大约\
  \ 15 次。如果你采用治疗方案 X，这个病人会恢复得很差，所以这不太是你想要的。但是，如果你采用治疗方案 Y，这个病人会好转。”\n\n因此，能够拥有关于医疗状况、症状、诊断、用药、治疗方案和结果的集体经验，将是极其有益的。\n\
  \n毕竟，数据本质上就是这样——将发生的集体经验汇集在一起。这很重要，因为临床试验存在两个问题：(a) 临床试验从来都不是在真实的生活环境中进行，人们会服用所有药物，因为受试者是经过严格筛选的；(b)\
  \ 另一方面，我确实有一些担忧，而且这些担忧已经被多次提及，即某些临床试验的可靠性如何。我暂且就说到这里。\n\n我认为，通过观察性数据，我们可以学到更多，了解哪些是有效的解决方案，哪些是无效的解决方案。在获得更多观察性数据的同时，我们还需要更好的数据监管形式。必须处理好数据监管和隐私影响。我认为这普遍适用于广告和隐私领域。不仅仅是在医疗应用和人们在\
  \ Facebook 上分享的、被用于各种目的的社交数据中。\n\n我认为医疗应用是最能说明“这才是真正应该做的事情”的案例。我们需要开始能够不带煽动性地比较收益与成本。\n\
  \n当我听到像 Target 事件那样孤立的、耸人听闻的例子——父亲发现女儿怀孕了——我感到不安。父亲们每天都会通过各种方式知道他们宝贝女儿怀孕的消息。无论是女儿的朋友告诉他们，还是爱管闲事的邻居不小心说漏了嘴，或者其他什么方式——这些事情一直都在发生。那也是生活的一部分。我不一定想借此呼吁更精准的营销定位。\n\
  \n相反，我认为我们必须面对这样一个事实：隐私有时确实可能被侵犯。毕竟，这在现实生活中每天都在发生。\n\n所以，我对那种利用这种情况来煽动巨大抗议的小报氛围感到不安。事实是，你无法让隐私密不透风。这不能成为目标。我们需要就利弊权衡进行一次真正有意义的对话。遗憾的是，我认为这在短期内不会发生，因为隐私倡导者常常站在一边，抱怨连连，却拿不出任何更好的方案；而另一边，普遍的态度更接近于：“天空才是极限，我们想怎么做就怎么做。”\n\
  \n`Data Scientists at Work` 177\n\n所以，双方都没有走到中间来推进讨论。我正在寻找一个真诚的中间地带，但我没有看到。我不确定如何达到那里，但我很希望能就此进行更有建设性的辩论。一旦我们达到了，我认为数据科学在医疗领域就有巨大的机会可以产生重大影响。\n\
  \n**古铁雷斯：** 对于刚入门的人，他们应该努力深入理解什么？\n\n\n\n**Perlich：** 我认为，学习数据科学归根结底就像学滑雪。你必须亲自去实践。你可以看很多视频，观摩别人怎么滑。但最终，你还是得踩上你的雪橇，从山坡上滑下去。途中你会摔倒几次，这没关系。这正是你需要的学习体验。实际上，我更喜欢问面试者那些不顺利的事情，而不是他们成功的地方，因为这能告诉我他们从过程中学到了什么。\n\
  \n每当有人来找我，问“我该怎么办？”时，我会说：“没问题，去上些关于机器学习技术的在线课程吧。这毫无疑问是有用的。你显然需要具备一定的编程能力，至少得会一些。你不必成为`Java`程序员，但你必须能设法完成一些任务。用什么方法我不在乎。”\n\
  \n归根结底，无论是去`DataKind`做志愿者，为非政府组织贡献时间帮助他们，还是去`Kaggle`网站参加一些数据挖掘比赛——都要让自己亲身体验一下。尤其是在`Kaggle`上，要阅读讨论区里别人对问题的建议，因为这是你了解人们做了什么、什么方法对他们有效、什么方法无效的地方。所以，任何能让你真正参与处理数据的事情，即便没有报酬，也是一件好事。\n\
  \n记住，你必须滑下那座山。没有别的办法。你无法用其他方式学习。所以，奉献你的时间，用你能想到的任何方式弄脏你的手，如果有机会实习——那就更完美了。\n\n否则，还有很多可以让你起步的机会。所以，放手去做吧。\n\
  \n## 章节\n\n**乔纳森·莱纳汉**\n\nPlaceIQ\n\n`乔纳森·莱纳汉`是`PlaceIQ`的数据科学负责人。`PlaceIQ`是一家移动地理定位智能公司，为营销人员聚合和分析空间数据。2014\
  \ 年初，移动互联网用户首次超过桌面互联网用户。预测显示，随着我们迈向未来，这一趋势只会加速。`PlaceIQ`正处于移动广告与位置智能交汇的前沿。这一动态交汇点的快速增长带来了隐私、数据基础设施、数据规模以及智能处理数据并将数据学习成果付诸应用的能力等方面的挑战。\n\
  \n在涉足数据科学之前，`莱纳汉`的职业生涯跨越了理论物理研究、编辑知名科学期刊，以及在华尔街从事算法量化权益交易的量化研究。在耶鲁大学获得物理学博士学位后，他在布鲁克海文国家实验室、尼尔斯·玻尔研究所和弗吉尼亚大学进行了强相互作用夸克-胶子等离子体统计特性的研究。他曾担任美国物理学会两本期刊——《物理评论\
  \ C》（核物理）和《物理评论 D》（粒子物理与宇宙学）的编辑。\n\n`莱纳汉`是一个从物理科学经由量化金融转向数据科学的数据科学家的杰出典范。这段极其多样化的背景塑造了`莱纳汉`对数据科学风险维度的细致理解、他乐观的实用主义，以及他坚信有用的数据科学关键在于扎实的工程基础的信念。\n\
  \n"
- '# 第 9 章 | 乔纳森·莱纳汉，PlaceIQ


  **塞巴斯蒂安·古铁雷斯：** 请谈谈你成为`PlaceIQ`数据科学家的经历。


  **乔纳森·莱纳汉：** 在 2012 年 3 月作为数据科学家加入`PlaceIQ`之前，我曾在金融服务业从事算法交易。在此之前，我在学术界从事了八年的物理研究工作。所以我一直与大量数据打交道——不过，与我的算法交易工作相比，我的物理研究工作更侧重于分析而非计算。




  '
- '# 采访记录：Jonathan Lenaghan（PlaceIQ 数据科学负责人）


  **Gutierrez：** 算法交易听起来是一份有趣的工作，能接触到有趣的数据集。是什么促使你转向了 PlaceIQ？


  **Lenaghan：** 我喜欢在金融服务业工作时的那种风格，解决定量问题，但后来感觉年复一年都在解决同样的问题，只是略有变化。五年后，我准备好迎接新的挑战了。


  当时纽约的数据初创社区发展非常迅速，我开始参加纽约的科技聚会。在 2012 年 2 月的一次聚会上，我碰巧坐在一位风险投资人旁边，他告诉我他正在投资的一些公司。我向他介绍了我在算法交易领域处理数据的工作。他告诉我，他投资的一两家公司需要数据科学家，建议我和他们谈谈。第二天，我就和
  PlaceIQ 的首席技术官 Steve Milton 聊了聊，几天后又和首席执行官 Duncan McCall 聊了聊。一周半后，我开始在 PlaceIQ 担任数据科学负责人。


  **Gutierrez：** 哇，这个转变真快！


  **Lenaghan：** 两周时间。


  **Gutierrez：** PlaceIQ 一定有什么地方让你特别兴奋。是什么？


  **Lenaghan：** 数据集的大小和多样性。PlaceIQ 是一个位置智能平台，所以我们摄取各种类型的数据——社交数据、GIS（地理信息系统）数据、POI
  和 AOI（兴趣点/兴趣区域）数据，以及一些消费者行为数据。


  **Gutierrez：** 你们用这些数据集做什么？


  **Lenaghan：** 我们把世界划分成 100 米乘 100 米的方块。我们摄取所有这些数据，进行清洗、标准化，然后将其投影到我们 100 米见方的方块上，并与我们称之为“PlaceIQ
  时间段”的数据集成。利用这个统一的数据层，我们应用机器学习来对位置和移动数据进行情境化分析。


  **Gutierrez：** 除了移动数据，你们摄取的数据集看起来相当直接。这些移动数据来自哪里，你们如何使用它？


  **Lenaghan：** 我们移动数据的来源是广告请求日志。所以，尽管我们的地理空间分析平台非常水平化，但我们一直从事的主要垂直领域是移动广告。现在我们正在进入消费者洞察领域，并逐领域地构建我们的地理空间分析平台。


  **Gutierrez：** 所以，这个想法是，当我带着移动设备四处走动时，应该在正确的时间和地点，获得针对正确产品或服务的正确广告。


  **Lenaghan：** 完全正确。


  **Gutierrez：** 你能描述一下你帮助构建的某个特定产品吗？


  **Lenaghan：** 我们推向广告技术领域的第一个产品叫做 `Audience Now`。它对单个 100 米见方块内发生的事情进行情境化分析，使我们的数据库能够高置信度地识别其主要的人口统计和心理特征——例如，我们可以说：“这个方块指数在‘购物妈妈’类型上非常高。”
  然后，如果你的移动设备移动到那个方块中，它就会受到“购物妈妈”广告定向。`Audience Now` 纯粹是基于位置的。我们没有进行任何设备跟踪或类似操作。


  **Gutierrez：** 这个产品是如何演进的？


  **Lenaghan：** 随后，我们开始摄取大量带有位置、时间和设备 ID 标记的广告请求数据。设备 ID 通过持久哈希被混淆——因此，即使我们无法将给定设备追溯到任何
  PII（个人身份信息），我们也可以对移动数据进行情境化分析。我们可以看到，某个特定的假名设备 ID 在过去一个月里几次出现在高尔夫球场上，并且倾向于停留在富裕程度评分很高的方块中。因此，我们可能将此设备
  ID 标记为“高尔夫球手”类型。过去一年，PlaceIQ 的最大推动力是不仅通过位置，还通过情境化的位置历史来定向设备。


  **Gutierrez：** 这看起来与算法交易非常不同。为什么你会对它感兴趣？


  **Lenaghan：** 当我刚加入 PlaceIQ 时，我未必对广告技术领域本身感兴趣，我在股票交易和物理学方面的背景并没有给我带来移动广告方面的特定专业知识。移动广告市场确实在某种程度上显示出与股票市场的系统相似性。两者都涉及低延迟、高吞吐量的系统、网络和交易所。我进入时曾预期我在广告技术和股票市场生态系统中的工作会非常相似，但类比几乎立刻就失效了。在
  PlaceIQ，我实际上并没有做太多实时竞价的工作，我更多的是在做地理空间位置分析，利用机器学习和启发式算法来构建受众群体，以定向移动广告。


  我最初加入 PlaceIQ，更多是为了处理所有位置数据、移动数据和广告请求的挑战，而不是为了专门从事广告技术。但现在，随着我对广告技术行业有了更多了解，我发现它比我想象的有趣得多。


  **Gutierrez：** 从理论角度，你如何向其他数据科学家或定量领域的人描述你的工作？


  **Lenaghan：** 用一个词来说，我会告诉他们，我们所做的是摄取、转换和情境化。我们摄取海量的位置数据——每月大约 500 亿条记录。然后，我们基本上对我们的地理空间层进行大型连接操作。我们在该地理空间层上运行许多不同类型的分类器，以确定某个特定方块是住宅区、商业区还是混合用途区。然后，我们应用我们开发的领域特定语言，将这些受众构建成配置文件，这些配置文件不仅对地点进行情境化，还为我们从聚合移动数据中观察到的模式增加了更多洞察。


  **Gutierrez：** 如果要用更通俗的语言向一个五岁孩子解释你的工作，你会怎么说？


  **Lenaghan：** 现在的五岁孩子对移动设备越来越精通了。我会对一个五岁孩子说，我们是世界的地图绘制者。我们利用人们手机发出的信号，来更好地了解世界上任何给定地点的人群类型。


  **Gutierrez：** 这是一个我可以讲给我妈妈听的解释：“乔纳森正在利用手机信号来绘制我们世界中不同类型人群的流动图。”

  “好吧，这说得通，塞巴斯蒂安。”


  你是什么时候意识到自己想以数据处理为职业的？


  **Lenaghan：** 在我读本科时，我主修物理。我知道自己想成为一名物理学家——更准确地说，是一名物理学教授。我非常钦佩我本科时的所有教授，对研究生院也充满期待。你可能会从我未来的职业轨迹推断，我在物理领域工作时一定沉浸于实验数据中，但实际上我更多是在做粒子物理学中形式化的理论方面工作。


  我的研究是关于量子色动力学理论所描述的强相互作用的数学形式化方面：夸克和胶子如何相互作用，并形成中子和质子等等。即使我们无法求解量子色动力学中的控制方程，我们仍然可以在其上运行模拟，并在一定限度内求解它。


  当时，我其实并不关心任何与强相互作用相关的实验告诉了我们什么。我只是对回答这个问题感兴趣：“利用数学一致性的所有约束，我能从这个定义方程中学到什么？” 我妻子碰巧也在同一领域工作，但她是实验方面的。当我还在学术的云端时，她已经在加速器前工作了。




  离开学术界后，我在布鲁克海文的《物理评论》担任了几年助理编辑，那是一段愉快的经历。能目睹审稿和同行评议的运作过程，以及学术出版界的“香肠制作”内幕，非常有趣。这让我对计算和数据有了更多思考。当时我身处纽约及金融行业附近。


  进入量化金融领域工作无疑是我首次踏入一个高度数据密集的世界。量化金融大致分为两个领域。第一个领域是处理非常复杂的金融工具，例如场外衍生品，其交易方式非常简单，通常通过电话进行。围绕这些复杂工具有相应的数学框架，涉及理论、分析和计算方面。第二个领域是高频算法交易，其交易的是非常简单的金融工具（如股票），但交易方式却极其复杂。这个领域更偏重计算和算法驱动。这类交易没有分析性框架，基本上由实验数据驱动。我最初进入量化金融是想从事第一个领域——分析复杂衍生品，但最终却进入了第二个领域——对简单金融工具进行算法交易。


  **古铁雷斯：** 是什么让你改变了计划，从纯粹的 analytic 工作转向数据驱动的工作？


  **莱纳根：** 我很快发现，算法交易中的实证工作风格非常适合我。我喜欢实验设计——弄清楚什么有效、什么无效，以及如何在数据面前不欺骗自己。在算法世界里处理数据面临着诸多挑战。其中之一是，成千上万的其他人在研究完全相同的数集，基本上都在竭尽全力从中挖掘一切。另一个挑战是，迫于寻找规律的压力，人们容易陷入常见的人类认知谬误：用不足的数据过度拟合模型，以及将相关性过度解读为因果关系。


  **古铁雷斯：** 你在算法交易领域面临的数据挑战，与你在 PlaceIQ 面对的数据挑战相比如何？


  **莱纳根：** 我初到 PlaceIQ 时面临的首要数据挑战是，地理空间数据是我从未处理过的数据类型。第二个挑战是数据量级提升了好几个数量级。


  我之前从事的算法交易数据量相当大——比如说，每年一太字节。但 PlaceIQ 环境每年会产生成百上千太字节的数据。适应这些变化对我来说是令人振奋的挑战。PlaceIQ
  另一个让我兴奋之处是，能在一个并非所有数据都是时间序列的数据密集型世界中工作。起初有些应接不暇，但我一直在学习，并将继续学习新的技术。


  **古铁雷斯：** 从金融业转向广告技术行业，你还遇到了哪些其他挑战？


  **莱纳根：** 从算法交易转向移动广告领域时，我注意到的其中一个差异是基础设施。金融行业的基础设施要好得多。金融业存在的时间久远得多，因此其基础设施更完善、更健全，而且对故障的容忍度要低得多。在广告技术行业，标准则稍微宽松一些。


  **古铁雷斯：** 在金融领域，如果你犯错，比如过度拟合模型，你就会亏钱。在 PlaceIQ 的工作中，是否也存在同样的紧迫感或压力？


  **莱纳根：** 没有，没有同样的紧迫感或恐惧感。如果你过度拟合了交易模型，就会亏钱。当赚钱是你的工作时，亏掉别人的钱是世界上最可怕的失落感之一。因此，你非常有动力不去过度拟合模型。如果你过度拟合了广告技术模型，后果就没那么严重了。


  当广告投放错误时，在专业上很糟糕，但对收入的影响更多是渐进式的。我确实努力在我的广告技术数据科学团队中灌输一种——不完全是开玩笑地说——对数据质量和模型稳健性保持“健康偏执”的意识。但当我团队出问题时，反馈不是“天哪，太糟糕了！”，而是“我们来解决它”。


  因此，在对错误的惩罚和容错方面，这两个世界有些不同。在内部，PlaceIQ 的紧迫感不像交易台那样一刻不停。在外部，我们仍然必须非常谨慎地确保我们发布的任何内容都准确无误，因为如果移动广告活动出了差错，可能会造成巨大的收入损失。在
  PlaceIQ，我们主要处理大型、直接的交易，而不是大量小型渠道交易，所以失去一个合作伙伴总是一件大事。一个严重的错误可能会导致失去一个大客户，代价极其高昂。


  **古铁雷斯：** 你在 PlaceIQ 处理的第一个大型数据集是什么？


  **莱纳根：** 我处理的第一个大型数据集来自一个后台定位应用的匿名化位置历史记录。我们选择这个非常大的数据集作为测试集，来检验我们究竟能在多大程度上对用户移动进行场景化分析。我们想从宏观层面了解人们的居住地，以及我们可以将哪些行为与基于家庭人口统计学特征的社会数据关联起来。


  **古铁雷斯：** 是否有过“这太强大了”的顿悟时刻？


  **莱纳根：** 我们的“强大了”时刻出现在看到人类行为的可预测性之时。位置历史记录往往高度聚集，因此，令人着迷的是，仅仅用少量数据，就能构建出有趣的设备画像。大多数人大部分时间不是在家就是在工作。所以从这个意义上说，即使对一个设备一无所知，推断出其高层次的人口统计学信息并将其与设备关联起来，也并非十分困难。


  **古铁雷斯：** 你是如何学习并迅速跟上地理空间分析行业的发展的？


  **莱纳根：** 我进入这个行业时，它基本还算一个非常新的领域。一方面，地理学是一个非常古老的领域。另一方面，我们所涉及的规模是相当新颖的，因此并没有太多文献能帮助学习过程。虽然其他一些公司也在从事定位相关业务，但它们做的并非完全与我们相同。所以我开始通过研究其中一些公司来学习，比如
  Factual——它是一个定位数据提供商。


  在研究方面，谷歌基于他们在用户定位上进行的实验，发布了许多关于纬度研究的白皮书。因此，好坏参半的是——除了谷歌的白皮书和一些博客文章外——这个领域完全是开放的，所以我们不得不边摸索边解决问题。


  **古铁雷斯：** 相关的文献资料和行业规模有扩大吗？


  **莱纳根：** 尽管行业在竞争者数量上有了很大扩张，但关于位置历史记录的文献资料仍然相当稀少。艾伯特-拉斯洛·巴拉巴西做过一些有趣的统计工作，他在定位方面，特别是利用移动数据预测人们习惯方面有所建树。学术文献关注的问题包括：能够与另一个数据集关联以推断该设备信息的最小位置历史记录集是什么？




  另一个研究领域关注的是人们总体行为中的幂律分布。就特定于地理位置且与我们工作相关的学术研究而言，目前产出的成果并不多。话虽如此，我们现在有很多竞争对手，在过去一年里，他们声称在做我们做的事情。这既有利也有弊。


  **古铁雷斯：** 通常来说，有竞争被视作好事。


  **莱纳根：** 没错。没有竞争才是坏事。


  ***第 9 章 | 乔纳森·莱纳根，** PlaceIQ*


  **古铁雷斯：** 作为一名地理空间分析行业的专家，你典型的日常工作是什么样的？


  **莱纳根：** 我得说，我在 2012 年和 2013 年的典型日子是相当不同的。2012 年，我们是一家非常小的公司，我是第七名员工。到年底时，我们的规模翻了一番，达到了
  14 名员工。尽管我们增长迅速，但仍然是一家非常小的公司，只有少数几人在广告技术行业有经验。从这个意义上说，我的日常工作和其他任何初创公司的故事非常相似：我参与并协助处理所有事情。


  我建立模型并开发启发式算法，以便在我们没有数据或数据非常稀疏的情况下构建受众群体。除此之外，我还做了大量工程和后端工作来支持我们的广告活动，检查广告活动的健康状况，执行广告运营，并开发一些新产品。公司里的每个人也都在这些项目中提供帮助。


  **古铁雷斯：** 你属于哪个特定的团队吗？


