  100 年前就被识别出来的病原体。但是，测序意味着你从拥有它的图片，以及可能通过往上面倒点东西、它可能变蓝这样的实验，转变为拥有相当于一本电话簿的信息量。不幸的是，这些信息是用一种不是我们选择的语言书写的，只是一个四字母的字母表，想象一下`ACGT
  ACGT`，一遍又一遍。你可以想象出一本电话簿那么多的这种字母序列。




