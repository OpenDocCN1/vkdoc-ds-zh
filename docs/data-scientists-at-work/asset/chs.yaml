  公司帮助《财富》世界 500 强公司进行收入管理、定价优化和销售预测。在这些不同的角色中，福尔曼与广泛的利益相关者打交道——从美国国防部和国税局，到可口可乐、皇家加勒比国际游轮和洲际酒店集团等公司。他拥有麻省理工学院运筹学硕士学位和佐治亚大学数学学士学位。


