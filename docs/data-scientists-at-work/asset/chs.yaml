  **古铁雷斯：** 从投资以数据为中心的公司中，您学到了哪些经验教训？


  **埃伦伯格：** 有趣的是，最有价值的公司看起来很像平台，但它们并非一开始就是这样。它们起初往往看起来像是拥有非常具体垂直应用的初创公司。随着时间的推移，当在一个特定用例或垂直领域取得成功后，这些公司才会扩展到其他垂直领域。我认为，拥有一个非常清晰的早期用例至关重要，因为《工作中的数据科学家》第
  135 页提到，当你支持这些拥有平台愿景的杰出技术专家时，很容易分心太多，“试图煮沸整个海洋”。


