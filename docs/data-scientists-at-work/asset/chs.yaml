- '# 排版后的内容


  [P(K)] 于 2011 年 8 月成立，目标是将机器学习技术变得对开发者可访问。我们的愿景是构建无处不在的机器学习。我们深受 Heroku 和 Twilio
  等公司的启发，它们将当时相当前沿的技术普及化。我们认为，在将这项技术交到普通人手中时，保留不确定性——即能够说“我不知道答案”——至关重要。在当时，这确实是一个激进的想法。


  当然，贝叶斯统计学界早已践行这一点，但当时许多机器学习方法只专注于给人们一个答案。关键是要问自己：你是否能信任这个答案？尤其是因为答案的可信度往往取决于你所提出的问题。机器学习系统会非常可靠地告诉你存在男性和女性两种性别，但在预测你正在与谁交谈时，它们并不总是准确的。这正是我们追求的目标。


  我们做了初创公司该做的事——构建产品、演示并进入了 TechCrunch Disrupt 决赛，并从风险投资公司那里获得了融资。Peter Thiel 的团队
  Founders Fund 支持了我们。随后，我们在 2012 年 12 月被 Salesforce 收购，在那里我们找到了一支非常认同“无处不在的预测平台”愿景的优秀团队——最终，“预测”应该像“选择”一样简单。我在
  Salesforce 工作了一年多，期间我的团队和我继续研究机器学习技术。我被提升为 Salesforce 的首席预测科学家，并负责这一领域。


  **Gutierrez：** 你现在已经离开 Salesforce，开始从事计算神经科学研究。为什么选择神经科学研究？


  **Jonas：** 大脑之所以迷人，是因为它能计算。肝脏也很有趣——它是一锅复杂的代谢汤，一旦出问题你就会死，所以有很多人在研究它。然而，作为一个计算机科学出身的人，令我惊叹的是，我脑袋里这团黏糊糊的东西竟然能完成所有这些复杂的计算。


  ***Data Scientists at Work*** 295


  所以如今我花时间做两件事。第一是与神经科学家合作，回答关于学习和记忆如何工作的问题。你的大脑如何接收新信息，在内部构建模型，然后执行诸如将其保存到新皮层等操作？


  第二件事是构建新型机器学习模型，以便在这类数据中寻找模式。我认为这正是该领域的发展方向，尤其是在我们看到对神经科学数据产生巨大兴趣的今天。


  我一生大部分时间都对大脑感兴趣。甚至在上大学之前，我就已对它着迷。后来进入麻省理工学院（MIT）时，我本科主修了电气工程与计算机科学（EECS）以及脑与认知科学（BCS）。之后我攻读了
  EECS 的硕士学位，最后完成了 BCS 的博士学位。所以我的背景是计算机科学和脑与认知科学，并且我已经研究这个领域很多年了。


  即使在我从事工业界工作时，也一直在思考这个领域。


  从初创公司 CEO 到大型公司工作是一个颠覆性的转变，因为你突然有了下班后的额外时间。在这段额外时间里，我完成了博士学位，并继续从事一些博士期间进行的神经科学研究。我一直对构建机器学习信号处理技术以在神经科学数据中寻找我们原生无法发现的模式这一想法非常感兴趣。作为本科生，我们学过傅里叶变换或主成分分析，但这些都已有五十年历史了。显然，现有的机器学习技术在发现数据中的这类模式方面已经变得好得多。所以最近我一直在与
  UCSF、西北大学、MIT、哈佛大学以及其他学术机构的研究人员合作。


  奥巴马政府率先提出了新的 BRAIN 计划，很快就会有大量高通量的神经数据出现，但坦率地说，目前几乎没有技术来处理这些数据——尤其是对普通科学家可及的技术。我所说的“普通科学家”，部分原因是进行实验和提出问题的研究人员，往往与那些经过十年计算或数学训练、能够构建和理解模型的人截然不同。我正努力在两者之间开辟一个空间，充当阻抗匹配层，扮演缓冲角色，因为我相信在那里你可以非常有成效。


  **Gutierrez：** 为什么这项工作在现在以及十年后都很重要？


  **Jonas：** 我离开 Salesforce 的一个原因，在某种程度上是因为我的团队已经就位，一切尽在掌握，而我正在寻找下一个重大挑战。Box 公司的 CEO
  Aaron Levie 曾评论道：


  “在做初创公司时，你必须问自己的一个问题：为什么现在是做这家初创公司的正确时机？”我想 Peter Thiel 告诉过他这句话。


  ***Chapter 15 | Eric Jonas,** Neuroscience Research*


  所以对我来说，问题是：为什么现在正是构建工具来解决这些神经科学问题的正确时机？一个原因是数据很快就要可用了。大约五年前，关于绘制神经系统中所有神经元及其连接方式的问题确实存在，因为当时没人拥有大脑的示意图。


  连接组项目（Connectome projects）正是致力于创建大脑神经连接的综合图谱的项目。因此，在 Sebastian Seung 的 MIT 团队等小组的领导下，人们一直在构建这些系统的密集示意图的连接组。


  然而，生物电路的问题在于，你得到的示意图上并没有漂亮的小方框标明“这是一个加法器”或“这是一个寄存器”。不，它只是一张密密麻麻的乱七八糟的图。你可以想象一下，如果只通过观察所有晶体管是如何连接的来试图理解处理器的工作原理，那会是怎样的情况。显然，这极大地限制了你的理解。因此，西北大学的科学家
  Konrad Kording1, 和我开始尝试构建模型，以发现这种连接组状态中的结构和模式。我们有一篇论文刚刚送审，正是关于这个想法：如何从这些高通量、模糊、有噪声、有时充满错误的数据中提取出科学意义。


  这里与生物信息学的类比非常贴切。过去，生物学家就是生物学家。然后我们迎来了基因组学作为一个领域的发展，现在又有了计算基因组学作为一门学科。整个生物信息学领域实际上是一个让生物学家坐在电脑前工作的领域。


  他们实际上并不涉足湿实验室。它之所以成为一个真正独立的领域，部分原因是因为高质量、高通量数据的可用性转变。我认为神经科学也将经历类似的转变。




