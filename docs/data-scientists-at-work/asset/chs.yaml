- "# 排版后的文本\n\n在这种情况下，衡量模型成功与否变得更加困难，因为你在做决策时永远无法知道模型是对是错。内容获取模型一直是一个非常成功的模型，但这并不意味着它对每一个内容决策都准确无误。\n\
  \n我们会持续监控这类模型在整体上的成功程度。\n\n衡量这类模型成功与否的方式，更多取决于公司内部如何看待该模型的实用性。我们会观察诸如：他们是否在使用这个模型？是否基本信任它？他们是否要求功能增强？是否希望从中获得更多价值？他们是否找到我们的团队，希望建立更多模型来解决其他问题？因此，对于这类建模而言，成功的衡量标准更为“软性”。\n\
  \n**古铁雷斯：** 你们每年需要创建多少个模型？\n\n**斯莫尔伍德：** 这又回到了之前关于低流程化要求的观点。我的团队并没有硬性规定每年必须推出多少个模型。我们几乎没有（如果有的话）具体的要求。我们拥有的更多的是责任。对我个人而言，我的责任是思考如何推动团队和我们的工作不断进化，以跟上公司各方面创新的步伐。\n\
  \n例如，我看到随着 Netflix 向更多原创内容转变，将需要做出不同类型的内容决策。由此我意识到，我的团队需要加强在该领域的专业人才和资源投入，以便我们能够帮助做出一些非常艰难的决策。我需要理解公司在业务各个不同部分的战略是什么。\n\
  \n***第 2 章 | 凯特琳·斯莫尔伍德，Netflix***\n\n很幸运，我曾在许多不同的行业工作过，积累了多年的经验，因为我很清楚要实现我所设想在各个领域需要完成的工作大概需要多少资源。而且目标总是在变化，从未倒退。我从不担心招聘过多。\n\
  \n**古铁雷斯：** 你最近负责的具体项目是什么？\n\n**斯莫尔伍德：** 我来谈谈一个同时涉及实验和预测建模的项目。实验是 Netflix 发展产品核心部分。我们坚信这种方法适用于我们的产品创新，因此严格按照标准衡量这些实验结果非常重要，因为它们数量众多，且对每个人都至关重要。\n\
  \n我们用于衡量实验结果的关键指标之一是观看时长。比如说，在一个 28 天的周期内，某个特定客户花了多少小时观看 Netflix，因为这实际上是衡量用户参与度的关键指标。如果你在\
  \ Netflix 上花费时间，这与留存率有着极强的相关性。虽然留存率是我们的核心指标，但我会结合这个项目来谈谈观看时长。\n\n在很长一段时间里，我们只衡量总时长和在几个不同阈值下播放时长超过\
  \ *n* 小时的客户百分比。这是一种很好的思考时长的方式，因为你可以了解其分布情况。\n\n然而，让那些每月只观看 3 小时的人增加到 4 小时，其影响力远大于让那些已经每月观看\
  \ 30 小时的人增加到 31 小时。我们深入思考了这个问题，并不满意在评估观看时长时对所有客户一视同仁。\n\n我们希望找到一种统计方法来比较算法 A 和算法\
  \ B 对轻度用户的影响，但不想仅仅在一个阈值上做比较。我们希望在所有阈值上进行比较。为了解决这个问题，我们实际上构建了一个预测模型，该模型涉及观看时长与留存率在整个分布上的关系。\n\
  \n我们提出了一个指标，称之为“流媒体评分”。这个流媒体评分既与客户的观看时长和他们在 Netflix 上的使用时长有关，也与留存率的关系有关。\n\n流媒体评分还考虑了观看地区，因为美国用户和拉丁美洲用户在电视观看时长上存在很大差异。因此，我们构建了这个模型，现在有了流媒体评分这个指标及其相关的检验统计量，这让我们能够从更精细、更具影响力、更本质的角度来审视流媒体使用情况。\n\
  \n**古铁雷斯：** 这个模型是如何构建的？\n\n**斯莫尔伍德：** 首先，我们做了大量研究，探讨了各种不同的建模方法。情况有点复杂，因为客户每月只付一次账单，而流媒体是每天发生的。所以，在你决定取消\
  \ Netflix 账户的那一天有一个标记。你可能停止流媒体播放，但你的服务会持续到计费周期结束，因此两者之间存在一种模糊的关系。这种关系让我们考虑使用生存分析模型。\n\
  \n最终，我们针对这个特定指标实现了一个自定义模型。但我们做了很多研究，然后构建了模型的几个不同版本。我们研究这两个版本的模型在准确性（AUC）和在 A/B 测试结果上的表现。并且，再次回到之前关于相互学习的观点，我们团队内部对结果进行了辩论，并确定了一个我们认为不错的建模版本。\n\
  \n**古铁雷斯：** 你们是如何确定研究路径的？\n\n**斯莫尔伍德：** 很多研究想法都来自团队的不同成员。整个团队中有足够多的人熟悉不同的方法论，因此我们有很多关于如何解决问题的想法。\n\
  \n团队中的许多人都很擅长跟踪行业内的研究进展，他们会将新的技术带回团队，并与大家分享。这意味着我们有能力很好地覆盖世界各地涌现的新技术，无论是我们团队内部的研究，还是其他地方正在进行的研究。\n\
  \n所以，我们首先集思广益，讨论了哪些技术类别适用于这个问题。不同的技术取决于数据的特征，因此我们确保真正理解我们所关心的所有关键维度以及数据是如何分布的。我们还努力真正了解哪些维度对这个问题是真正重要的。随着这个过程的推进，团队中有一位非常出色的统计学家，她主导了这项工作，并开始全力攻克这个难题。\n\
  \n**古铁雷斯：** 她是如何主导的？是指派的，还是自然形成的？\n\n**斯莫尔伍德：** 很多事情都是自然而然地水到渠成，因为她对这个问题的热情非常高，并且有时间投入其中。她和我都一致认为，这对\
  \ Netflix 来说是一个需要解决的重要问题，尤其我们都认为之前看待这个问题的方式并不完全正确。我们也明白，即使在 Netflix 内部，这也可能有点难以推行，因为长期以来大家都习惯了原有的测试方法。因此，她不仅拥有解决这类特殊问题的完美头脑，也理解了接手并领导这个项目所代表的意义。\n\
  \n**古铁雷斯：** 你们如何平衡时间、项目和优先级？\n\n**斯莫尔伍德：** 在我的团队内部，有几个小组，每个小组都主要专注于业务的不同部分。这并不是该小组成员唯一的工作内容，但至少他们有一个主要焦点，这样他们就能积累与该部分业务相关的所有领域知识。\n\
  \n\n  \n显然，市场营销部门与产品部门所思考的策略以及所关注的数据类型完全不同。因此，我们发现团队中必须有人完全理解业务的那一部分，这一点至关重要。\n\n\
  否则，你该如何在脑海中完成对你要建模内容的转化呢？这种部分专业化还能帮助我们了解来自不同领域的数据负载量，从而我们能够根据实际需求持续进行调整。\n\n在日常工作中，总会出现一些意料之外的事情，突然让你觉得团队的工作量增加了百分之五十，不知道该如何完成。由于我基本了解\
  \ Netflix 正在发生的大部分事情，而团队里的同事也熟悉各自领域的情况，所以我们很擅长判断哪些事项可以降级处理，以便让那些紧急的突发事件优先进入流程。\n\
  \n**古铁雷斯：** 你怎么知道自己解决的是正确的问题？\n\n**斯莫尔伍德：** 我认为这归根结底是要理解业务目标，以及理解对于你试图解决的问题而言，业务的优先级是什么。这是一个好奇心的探索，还是实际会被用于重要决策、重要流程或产品的？或者它在本质上是运营相关的问题？是否已经存在一个相当不错的方案，你只是想优化它？又或者这是一个完全空白、显而易见的问题，你知道自己能显著改善现状？\n\
  \n这其中存在一个判断，它源于对业务优先级的理解，也源于你知道自己能提供哪些建模或算法角度的方案。我确实认为，这既与理解手头的数据、数据及模型的可能性有关，也与理解从业务角度看什么是重要的有关。\n\
  \n**古铁雷斯：** 你怎么知道自己采集了正确的数据？\n\n**斯莫尔伍德：** 对我来说，这个问题真的非常有趣，因为我觉得在自己的职业生涯中，在不同公司工作过的经历让我见识了各种情况。在雅虎，阳光下的所有数据都会被采集，这很棒。\n\
  \n当你想研究某件事时，你知道总能在某个地方找到数据。但这也很具有挑战性，因为数据很混乱，这意味着你花在整理数据、使其达到可实际用于分析的阶段所花费的时间，与你实际做分析工作本身的时间相比，比例很高。\n\
  \n***《数据科学家工作坊》*** 33\n\n在 Netflix，情况恰恰相反，我们对于采集什么数据以及如何采集数据非常谨慎。无论我们对数据做什么处理，我们都尽量在采集点嵌入任何我们知道将来会应用的关键业务逻辑。这让几乎所有事情都变得简单得多。有时我们会搞错。而当这种情况发生时，工程团队就会有更多工作要做，因为他们必须回头去梳理我们之前做的事情，然后重新开发新方案，这可能会很痛苦。\n\
  \n但无论你在数据栈的哪个层面，这种情况都难免会发生。而我们发现，在源头层面尽可能这样做会更简单。\n\n不过，你不可能总能做到这一点，因为你希望保留颗粒度细的数据，这样以后当你有新想法时，可以按任意多种方式汇总。\n\
  \n但有些东西你确实知道并不需要。我们会尽可能地筛选掉这些内容，但你永远无法做到百分之百正确。偶尔你还是得回头重新处理一些事情。\n\n你只能尽量将这种情况降到最低。\n\
  \n**古铁雷斯：** 你如何看待数据栈的技术选型？\n\n**斯莫尔伍德：** 这是个难题，因为技术，尤其是数据领域的技术，发展速度比大多数公司的演进速度都快。这在数据仓库层面尤其明显，无论是云上还是专用仓库。有太多不同的广泛机制，而一旦你在公司内部构建了大量基础设施，切换到一个新技术就会变得极其昂贵。\n\
  \n我们很大一部分数据仓库使用的是 Teradata。如果我们想从 Teradata 迁移到其他以数据中心为导向的仓库系统，会有海量数据需要迁移，这将是整个数据部门一整年的工作量。也许没那么多，但工作量确实巨大。所以我认为，在你的技术栈中，越往上游走，更换技术就越困难。\n\
  \n话虽如此，但和许多公司一样，我们也越来越倾向于使用基于云的分析平台。我刚加入 Netflix 时，几乎所有数据都在 Teradata 中，只有少量数据在云上。Netflix\
  \ 当时正朝着基于云来服务整个产品的方向发展，所以你可以想象，这意味着我们在云上的数据越来越多。随着产品的这种演变，对我们有效的方式是并行开发。我们已经从主要使用\
  \ Teradata 进行分析，转变到现在主要在云端进行分析。\n\n我们仍然在 Teradata 中保留了相当可观的数据量，但我们的理念已经改变。我们在 Teradata\
  \ 中保存用于持续报告的聚合数据。我们在云端保存更多用于建模的细粒度数据，各种分析工作则在两个平台都进行。但我们在云端的数据更多，因为它更接近数据采集点。对我们来说，让这些系统并行运行的效果非常好。\n\
  \n***第 2 章 | Caitlin Smallwood，Netflix***\n\n也许最终我们会完全脱离数据中心。但这取决于效率和对最符合我们需求方案的投入。\n\
  \n**古铁雷斯：** 你如何看待团队内部常用技术的选型？\n\n**斯莫尔伍德：** 相比数据基础设施，为团队选技术要更轻量一些。我们需要进行分析，然后对分析结果进行可视化。在这项工作中，我们会尝试各种不同类型的工具，而技术选型基本取决于做事之人的热情所在。\n\
  \n在这个层面的技术栈中，我们使用各种工具。对于分析，我们大量使用 `R`。大多数情况下，开源软件比商业软件更受青睐，所以我们非常倾向于开源。我们大量使用 `R`、`Python`，以及那些易于上手、学习，并且也能用来做各种可视化工作的工具。\n\
  \n**古铁雷斯：** 目前谁的工作对你有所启发？\n\n**斯莫尔伍德：** 我的同事对我启发很大，既包括我自己的团队成员，也包括 Netflix 的其他同事。我们有位出色的同事——卡洛斯·戈麦斯-乌里韦，他领导着产品创新方面的算法团队。他是一位杰出、才华横溢的人，他的整个团队都非常强大且鼓舞人心。我反反复复这么说可能显得有点傻，但这确实是事实：Netflix\
  \ 拥有非常棒的人才！\n\n在 Netflix 之外，在实验方面，我一直很欣赏罗尼·科哈维，他是一位出色的演讲者，也非常擅长实验。他深知实验的力量，并且善于在他的演讲中将其传达出来。在算法和预测模型方面，有太多优秀的人在做出出色的成果，所以与其说追随某个特定的人，不如说关注那些在实验或预测算法与模型领域做出有趣事情的公司所发表的特定论文或应用。\n\
  \n我一直认为亚马逊在过去和现在都利用数据做了非常了不起的事情。领英也在持续利用数据做有趣的工作。\n\n\n\n**Gutierrez：** 一方面是因为他们拥有有趣的数据，另一方面也是因为他们与\
  \ DJ Patel 在数据科学领域有着悠久的历史，并在此基础上不断进步。我一直是领英及其产出的粉丝。\n\n**Gutierrez：** 是什么激励你担任 HiQ\
  \ Labs 的顾问？这家公司专门对员工流失率进行预测建模。\n\n**Smallwood：** 我之所以被吸引，实际上是因为它的应用。我一直在寻找可以用数据做的有趣事情。对我来说，他们所做的事情非常值得思考。正如我所说，随着我的职业生涯发展，我深切地意识到拥有一个优秀团队是多么棒的事情。一旦你拥有了一支优秀的团队，你就想留住这个团队。因此，对我来说，思考导致人们离开的因素非常有趣。尤其是在硅谷，这里有太多有趣的机会，我团队中的任何人都可能跳槽，并在其他地方轻松找到另一个超级有趣的职位。那么，他们为什么留在\
  \ Netflix，以及我怎样才能让他们保持投入并愿意留下，而不是跳槽去做别的事情——我真的很想了解这些因素。\n\n我认为这非常困难，因为如今这个时代的人——至少是在硅谷——似乎习惯于每几年就换一次工作。这就是你推进职业生涯的方式，通过做一些新的、令人兴奋的事情。所以，作为一名顾问从事这个副项目，并从数据角度研究这个问题，一直很有趣。这本质上就是利用领英的\
  \ API 来研究并尝试理解人们在什么时候会离职，以及你是否可以根据他们的领英数据等因素来预测这一点。\n\n**Gutierrez：** 你有没有将一些有趣的见解应用到你在\
  \ Netflix 的团队中？\n\n**Smallwood：** 有一些。无论模型对某人的判断是否正确——预测某个人有离职风险，都促使我与自己的团队进行了一些原本可能不会有的对话。也许正是这些对话最为重要。这确实有助于确保你与团队成员沟通，并询问：“你开心吗？有干劲吗？如果没有，我们谈谈，因为我不能保证我们能改变现状，但我们肯定可以谈谈并尝试一下。”所以我认为，在快节奏的业务中，很容易忘记时间已经过去一整年，而你却不知道团队成员是否开心。如果你想确保你的团队有干劲，让这种情况发生是很危险的。\n\
  \n**Gutierrez：** 你对自己的团队感到非常自豪，并且非常享受你们之间的同事情谊。这是你灌输给团队的东西，还是你在招聘时会寻找的特质？\n\n**Smallwood：**\
  \ 我认为两者都有。这当然与你招聘的人的特性有很大关系。同时，这也关乎拥有共同的目标，以及团队为之兴奋的事情。让人们感到彼此能够真正信任、互相激励，也是其中很重要的一部分。\n\
  \n我还认为，部分原因在于我自己在这个领域几十年的工作经验。我学会了比年轻时更欣赏团队情谊之类的东西。当我工作五年的时候，我可能根本没有像现在这样深刻体会到拥有一个优秀团队的意义。\n\
  \n**Gutierrez：** 你的这种认识是在什么时候发生变化的？\n\n**Smallwood：** 我认为是在我经历并带领了最初的几个团队之后发生变化的。在学习如何管理的过程中，我犯了所有典型的新手管理错误，也犯了招聘错误并不得不承受后果。在不得不设法处理所有这些事情之后，你就逐渐学会了。\n\
  \n**Gutierrez：** 你在招聘时会看重候选人哪些方面？\n\n**Smallwood：** 我会说最重要的两点是求知欲和永不满足的好奇心。你想象一个数据集，光是想到这个数据集就会让你垂涎欲滴。这些是首要品质，因为那些总是渴望深入挖掘、探索数据、从数据中学习新东西的人，是从事这类工作最快乐的人。显然，技术技能也很重要。但这始终是面试中最容易考察的部分，因为问那些技术问题很直接。然而，想了解你有多好奇就没那么简单了。你不能直接问别人：“你有多好奇？”但你可以通过他们提问的数量来判断。如果你向他们描述一个数据集，然后问：“你会用这个数据集做什么？”有些人会不停地讲述一个又一个的想法，而有些人则可能说：“哦，我不知道。也许我会看看平均分钟数”——或者诸如此类无关紧要的东西。所以我显然会考察技术技能和好奇心。\n\
  \n我寻找的最后一个重要方面是坚韧不拔。数据和算法的工作永远没有止境，所以坚韧不拔是核心要素。对我们业务以及我们试图实现的目标充满热情也同样重要。\n\n**Gutierrez：**\
  \ 你在招聘时是会考察工具集的知识，还是更倾向于“我们需要正确的思维方式，我们可以教你工具库里可能缺失的部分”？\n\n**Smallwood：** 更偏向于后者，不过了解一些工具也很重要。如果你从来没有使用过任何类型的数据查询，你就不会那么深入地理解数据，而且你需要很长的学习曲线才能达到高效的水平。所以，如果一个人不了解数据栈每一层的某些工具，那将会是一个障碍。但具体的工具并没有那么重要。通常，一旦人们了解了数据栈某一层的某个工具，他们就理解了那一层，并且能够很容易地掌握另一个工具。\n\
  \n**Gutierrez：** 关于使用数据，你改变想法最大的一件事是什么？\n\n**Smallwood：** 毫无疑问是 A/B 测试。很多年前当我第一次接触它，把它当作“网络分析”时，我并没有对它有多大的敬意。对我来说，它看起来非常简单和浅薄。直到我来到\
  \ Netflix，我才真正体会到它的威力。有趣的是，人们的直觉经常是错的，即使你是某个领域的专家。即使你在某个领域有大量的专业知识和背景，你在回答任何一个具体问题时的直觉有时仍然是错的。\n\
  \n类似地，对于预测模型，当我们看到 AUC 值为 0.75 时，我们会很兴奋。我们会说：“哦，天哪！这是个好模型！”但它仍然经常出错，只有通过实验才能真正获得对某事的因果判断。观看这个过程非常有趣和迷人。我们在\
  \ Netflix 可以同时做这两件事：开发替代算法，然后对它进行测试。我们最初可能会想，“这个算法会比我们以前的算法好得多！它有惊人的 AUC。”或者我们离线测量的任何指标——也许是\
  \ MRR（平均倒数排名）。然后我们测试这个模型，却发现它比我们以前的更差。一个接一个的意外结果就会出现。对我来说，正是获得这种真实因果关系的威力，彻底颠覆了我对数据的思考方式。\n\
  \n**Gutierrez：** 你是否会将每次 A/B 测试中学到的东西记录下来？\n\n\n**斯莫尔伍德：** 我们确实会尝试从测试中总结学到的主题，但更关注的是我们还能在哪些尚未涉及的地方进行测试。我们很想在内容领域进行测试，以便更深入地了解哪些片名和目录构成对客户最重要，但我们不想测试那些会给客户带来负面体验的内容。所以我们过去没有、将来也不会这样做。我们曾讨论过一些极小的实验，比如“如果我们只从片库中移除一部影片，看看能否衡量其影响？”即便如此，我们不仅与制片厂有合约协议，而且也不希望降低客户的体验。但我们始终在思考，是否有什么办法能在内容领域进行实验，从而为这些决策提供依据。\n\
  \n**古铁雷斯：** 你在个人生活中会做 `A/B` 测试吗？\n\n**斯莫尔伍德：** 不完全是 `A/B` 测试，但在我年轻的时候，我常常为个人决策构建一些小小的模型。就是一些很书呆子气的小模型来做个人决定。我会弄清楚决策\
  \ A 和决策 B 的所有属性，然后为每个属性的重要性设定权重。\n\n**古铁雷斯：** 你的团队里有数学家、运筹学专家、统计学家和数据科学家。你是如何对他们进行分类的？\n\
  \n***第 2 章 | 凯特琳·斯莫尔伍德，Netflix***\n\n**斯莫尔伍德：** 职称一直是个难题。十年前我们甚至都不使用“数据科学”这个词。所以整个行业的职称都很棘手。至于人们具体做什么，更多是自我选择。人们要么对产品和实验类工作更感兴趣，要么对算法更感兴趣。即使在算法领域，有些人也对特定类型的算法有非常专精的兴趣。所以我认为，总体而言，我们会尽量把人安排在他们最感兴趣的领域和方向，这样既能带来商业效益，又能让大家满意。\n\
  \n在 Netflix，我们对职称相当灵活。人们可以自行选择他们认为合适的称呼。\n\n**古铁雷斯：** 数据科学的未来看起来是怎样的？\n\n**斯莫尔伍德：**\
  \ 我认为它会继续爆发式增长，并且变得无处不在。有点像现在的趋势图随处可见一样。我认为模型、算法和更深层的数据科学也会如此。\n\n这些技术已经很惊人了，而且还会变得更好。即使是我们现在所处的阶段，它们在数学的深度和复杂性以及各种不同的技术方面，都已经发展得非常惊人。这得益于我们拥有海量的数据，让人们能够真正深入研究各种精妙的技术。所以我认为这些技术会继续蓬勃发展。而数据科学面临的一个更大挑战将是：要了解如此多的不同技术，要善于知道如何用恰当的技术来构建问题，并且不能误用这些技术。\n\
  \n我认为这其中也蕴藏着一些危险。由于开源工具的普及、编程这些技术的便利性以及复杂技术的多样性，开发出糟糕的模型会变得非常容易。现在已经很容易开发出糟糕的模型了，不幸的是，我认为未来会变得更容易。\n\
  \n我认为对于那些试图在以前没有数据科学团队的部门新建这样一个团队的公司来说，尤其如此。我觉得这对他们来说是个危险区。他们很容易雇到一个只构建过一个回归模型、在面试中用一些花哨术语（比如“支持向量机”）的人。\n\
  \n然后高管们会说：“哇，快来帮我们建立数据科学团队吧。”\n\n对于这些公司来说，他们无法衡量所雇的人是否真的懂行，因为好的模型和坏的模型都还是模型。它们都能输出相同类型的结果，你也有某种衡量标准来判断结果的好坏，但几乎不可能真正知道这个模型到底好不好。在我看来，关键在于构建这些模型的人的质量，而对于缺乏经验的公司来说，要分辨这一点会很困难。\n\
  \n**古铁雷斯：** 人们如何才能分辨出优秀的人才和其余的人呢？\n\n***工作中的数据科学家*** 39\n\n**斯莫尔伍德：** 我认为寻找经验非常重要——特别是当你从头组建一个新团队的时候。你不能用一个没有经验的人，即使他是麻省理工学院博士项目的致告别词代表。我仍然不会让这个人成为我唯一或第一个数据科学家，因为他们历练还不够。\n\
  \n我认为教育背景很棒——别误会，教育是很了不起的。\n\n但在当今世界，当人们处理更实际的问题时，在一个又一个模型中挣扎的实际经验，对于招聘唯一或第一个数据科学家来说至关重要。尤其是在数据环境非常不同、底层数据分布不同、数据特征也不同的情况下获得的经验。你还需要看到他们有处理缺失数据、重复数据以及你在处理原始收集数据时面临的所有挑战的经验。而这还仅仅是数据方面。\n\
  \n在建模方面，你还需要看到他们有思考“你解决的问题是否正确”的经验，然后从业务角度认识到这完全不切实际，你解决错了问题。\n\n你必须经历所有这些过程，才能真正积累起丰富的经验。\n\
  \n我认为，如果你找到了一个拥有这样经验的人——哪怕只有一个这样优秀的人，你就稳了。因为之后你可以招聘一些初级员工，然后在工作中培养他们。但你至少得有一个真正有经验的人。\n\
  \n**古铁雷斯：** 你认为数据科学家需要解决的一个问题是什么？\n\n**斯莫尔伍德：** 这是一个非常难回答的问题，因为我觉得所有那些可以用数据解决的重要问题，人们都已经开始着手解决了。未来也许会出现其他新的重要问题，但就目前而言，人们正在关注当前的重要问题。不过我要说的是，对我来说，最值得改进的地方是在整个行业内更公开地共享数据，无论你谈论的是哪个行业。\n\
  \n如果我要挑出一个需要在这个领域解决的问题，那就是医疗数据的共享进展远远慢于应有的速度。如果我们能找到某种方法，加速在所有收集到的优秀数据中进行隐私保护的信息共享，我相信我们可以在诊断（甚至是自我诊断）方面取得更多进展。尤其是在症状及其与健康关联的信息能更广泛公开共享的情况下。\n\
  \n任何在同一个行业内、跨越整个消费者和商业领域进行数据共享的事情，我认为都是极其有益的。我喜欢在微型慈善领域所做的工作。这个领域的工作非常酷。目前也有很多环境方面的工作，同样非常酷。所以我认为，凭借当今收集和共享数据的能力，到处都是真正的机遇。\n\
  \n***第 2 章 | 凯特琳·斯莫尔伍德，Netflix***\n\n**古铁雷斯：** 有什么事情是少数人知道，但你认为未来会变得非常重要的？\n\n\n\
  **Smallwood:** 我认为呈指数级增长的一个领域是运动、文本和语言分析。基本上，非数值数据领域的一切都会增长得非常快。具体到文本方面，我发现`Twitter`正在做的事情非常有趣，尤其是那些处理非常模糊的文本数据并识别重要模式的技能。我认为这是一个将会真正爆发的领域。\n\
  \n**Gutierrez:** 是什么推动了文本分析的增长？\n\n**Smallwood:** 越来越多的机制在处理文本数据，因为我们能够处理更大的数据量。过去，你可能会遇到一个多选题，必须从`a`、`b`、`c`或`d`中选择答案，然后这些数据会被编码。现在，人们可以直接回答开放式文本，而我们也有方法在数学上解释这些文本块。\n\
  \n这仍然是一个复杂的问题，因为本体论、文本解释和消歧领域本身就很复杂。这带来了许多非常困难的挑战。然而，产品正朝着正确的方向发展，因为越来越多的收集机制在收集这些数据，并且能够处理这些数据量。因此，那些尽可能让产品对客户友好的公司，将会朝着正确的方向演进，这通常意味着语音或文本输入以及分析功能。\n\
  \n**Gutierrez:** `Netflix`在语音方面有正在开发的项目吗？\n\n**Smallwood:** 我们在`PS3`上有一个名为`Max`的实验性语音对话界面。`Max`会说话，并试图以对话的方式询问你，比如：“你现在心情怎么样？你想看什么？”\
  \ 我们还没有开始在另一个方向上进行尝试，即让客户说话。\n\n我们确实有指针设备，所以这是向运动方向迈出的一步。\n\n**Gutierrez:** 对于如何做出出色的工作，你有什么建议？\n\
  \n**Smallwood:** 我认为保持你的好奇心非常重要。你不应该轻易满足于一个答案，你应该始终有比答案更多的问题。将这种态度作为一种生活方式来享受会大有裨益。能够将你的工作与你热爱的事物联系起来也同样重要。\n\
  \n就我个人而言，我非常喜欢通过数据来理解人们，特别是如果我能够将这种理解反馈给他们，希望能帮助改善他们的世界。因此，对我来说，任何让我尝试理解人们并因此改善他们世界的工作都特别令人满足。这对每个人来说都是不同的。所以，我认为找到那个让你对自己所做的事情感到兴奋的连接点至关重要。\n\
  \n***Data Scientists at Work*** 41\n\n在数据科学的世界里，保持一定的无我心态是非常重要的。\n\n在某些行业，你的角色允许你拥有自负，这对产生巨大影响很有效。然而，在数据科学中，当你尝试做事情时，你会一次又一次地被挫败。你以为自己想出了一个绝妙的主意，然后你构建了一些模型或一些指标，哪怕只是一个简单的指标，当你看到结果时，你会想：“哦，太糟糕了。”\
  \ 这太令人沮丧了。反之亦然，有时候你做了些几乎没怎么思考的小事，结果却产生了巨大的积极影响。因此，在这个领域保持一定的无我心态很重要。\n\n如果你有自负，不仅会一直感到失望，而且你也不会对数据可能告诉你的东西保持足够开放的心态，因为你会固守在自己的思维模式里。你必须对你的思维方式非常灵活，既要考虑极其微小的细节，也要上升到非常高的层面，去思考贯穿数据的各种力量。\n\
  \n你还必须对不同技术保持开放的心态。假设你构建了一个回归模型，发现你加入的一个信号确实让你的回归模型成功了。然后你尝试了一个完全不同的技术，发现那个信号在另一个技术中变得无足轻重。你必须足够开放，去考虑放弃这个信号。你不能过于依赖那个信号，因为你可能还没有意识到那个让你兴奋不已的信号其实并不重要。这种开放的、灵活的、无我的态度非常重要。\n\
  \n**Gutierrez:** 无我的态度是可以教授的吗？\n\n**Smallwood:** 我认为这是人们可以学会的，但我不确定是否可以手把手地教。我认为人们更多是从经验中学习到的。\n\
  \n**Gutierrez:** 对于刚起步的人，应该深入理解什么？\n\n**Smallwood:** 我非常信奉理解概率分布。\n\n理解所有不同类型的分布，以及它们在你的数据中表现出的特征，对于理解如何构建不同类型的模型大有裨益。如果你只知道正态分布，你的效率远不如你同时了解泊松分布以及其他各种分布。理解和掌握分布确实能帮助你指导如何思考建模问题。\n\
  \n同样重要的是学习多种技术：聚类技术、回归技术、基于树的技术等等。尝试接触各种各样的技术，因为随着时间的推移，你会意识到它们之间存在微妙的相似之处。有时候，你可以通过从所有这些角度来解决问题，并观察结果，从而学到一些东西。\n\
  \n***Chapter 2 | Caitlin Smallwood,** Netflix*\n\n找出所有方法中的共性。正如我们之前谈到的，体验不同的模型、不同的数据集以及数据集中的各种复杂情况是极其重要的。\n\
  \n**Gutierrez:** 一个人如何培养为问题选择正确技术的能力？\n\n**Smallwood:** 这需要尝试很多不同的技术，并学习使用这些技术时可能遇到的常见陷阱。我也认为，在协作环境中工作也有很多好处，你可以向别人展示你的方法，并听取他们对以下问题的反馈：为什么那是个好主意？为什么那不是一个好主意？\n\
  \n如果你在孤立地构建模型，就很难判断对错。你很难知道自己是否构建了正确的模型，因为无论你的建模是否正确，模型都会输出一些结果。\n\n如果你傲慢自大或充满自负，你会相信自己做了正确的事，而不会停下来思考你是否真的做对了。这又回到了无我和开放的心态。所以，我认为如果没有来自该领域有经验的多个人提供的反馈，真的很难学会如何为问题选择正确的技术。随着时间的推移，你能从越多的人那里获得反馈就越好。我真的认为这是取得进步的好方法。\n\
  \n**Gutierrez:** 对于那些进入这个领域的人，有什么有用的建议？\n\n**Smallwood:** 我想说的是，在做其他任何事情之前，总是要咬紧牙关，先理解数据的基础，即使这既不酷也不那么有趣。换句话说，要花精力去理解数据是如何被捕获的，准确理解每个数据字段是如何定义的，并理解数据何时会缺失。如果数据缺失了，这是否本身就有含义？它是否只在某些情况下缺失？这些微小的、微妙的、关于数据的小陷阱真的会让你栽跟头。它们真的会。\n\
  \n\n\n你可以使用天底下最复杂的算法，但归根结底还是“垃圾进，垃圾出”的老问题。无论你对进入模型构建的有趣环节有多么兴奋，都不能对原始数据视而不见。在着手开发模型之前，请务求精确（Dot\
  \ your `i`’s, cross your `t`’s），并检查你能查到的关于底层数据的一切。\n\n随着时间推移，我学到的另一件事是，在系统的语境下，混合使用多种算法几乎总是比使用单一算法效果更好，因为不同的技术会利用数据中模式的不同方面，尤其是在复杂的大数据集中。所以，虽然你可以选定一个特定算法并反复迭代以使其更优，但我几乎总是看到，多种算法的组合往往能比单一算法表现更好。\n\
  \n***工作中的数据科学家*** 43\n\n同样地，我想说，如果你只是开发一个模型——比如，一个预测模型——尝试多种技术真的很有益处。你会学到很多。这就像艺术与科学。科学的那部分是整个事情中相对简单的部分。而艺术则在于想象所有可以作为模型输入的可能信号。尝试不同的技术，观察浮现出的主题，这能让你走得更远。它会帮助你理解，无论你使用什么技术，哪些类别的信号似乎总是会显现。最后，除了尝试不同的技术，还要尽可能地在任何地方进行\
  \ A/B 测试，因为将其加入到你对不同技术和主题的严谨理解中，确实非常有益。\n\n**古铁雷斯：** 你喜欢数据科学的什么？\n\n**斯莫尔伍德：** 我喜欢它的是，它极具创造力和创新性。\n\
  \n如果有人刚刚涉足这个领域——请进来多学学，这是一个迷人的领域。如果你觉得，“哦，这不过是个无聊的数学领域”，那根本不是这样。它极具挑战性和创造性。\n\n\
  多年来，这对我来说一直是个不断的惊喜，现在依然如此。你在这个领域待得越久，它就越有创造性，因为你有更多的工具可供支配，在不同时期对数据也有更多的直觉，无论这些直觉是对是错。所以，随着时间的推移，它只会变得更加激动人心和富有创造力。\n\
  \n"
