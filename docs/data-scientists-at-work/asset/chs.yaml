- '# 原文排版


  **Erin Shellman**是一位统计学家和数据科学家，任职于诺德斯特龙数据实验室（Nordstrom Data Lab）——这是一个由数据科学家和软件开发者组成的小型团队，负责构建诸如产品推荐等数据驱动型技术。截至撰写本文时，诺德斯特龙在美国和加拿大运营着
  289 家全品类百货商店，以及 151 家诺德斯特龙折扣店（Nordstrom Rack）。消费者越来越多地在线购物，诺德斯特龙提供多种零售体验以满足不同偏好。对于淘便宜货的顾客，限时抢购网站`Hautelook`为会员提供每日优惠；对于追求个性化服务的男士，`Trunk
  Club`提供精心策划的试穿体验。结合`Nordstrom.com`、`nordstromrack.com`以及实体店，这些渠道构成了一个丰富的数据生态系统，数据实验室利用该生态系统为业务决策提供信息并提升客户体验。


  谢尔曼的数据科学生涯始于美国国立卫生研究院（National Institutes of Health）计算生物科学部（Division of Computational
  Biosciences）的实习。正是在这里，她最初学习并应用机器学习来揭示基因组进化中的模式。


  实习结束后，她在密歇根大学安娜堡分校（University of Michigan in Ann Arbor）获得了生物统计学硕士学位和生物信息学博士学位。在密歇根大学期间，谢尔曼频繁合作并分析了多种类型的异质性生物数据，包括基因表达微阵列、代谢组学、网络图谱以及临床时间序列数据。


  作为一名经常演讲和教学的专家，谢尔曼曾在`Strata`和`Big Data Congress II`等会议上发表演讲，并定期在西雅图科技社区的聚会上发言。她还是华盛顿大学（University
  of Washington）的讲师，在继续教育项目中教授数据挖掘课程。


  作为社区外展活动的领导者，谢尔曼是西雅图分会`PyLadies`的联合组织者，这是一个面向女性 Python 开源社区的国际导师团体；同时，她还通过女性数学协会（Association
  for Women in Mathematics）指导追求数学教育和职业的年轻女性。


  ## 第四章 | Erin Shellman，诺德斯特龙


  谢尔曼是物理科学家转型进入数据科学领域以帮助公司和组织利用数据做出更好决策这一趋势的杰出典范。在访谈中，谢尔曼展现了她对生物学的热爱，将科学推理应用于数据科学世界的过程，以及作为该领域的新人，她如何调整自己的技能和思维方式以应对新职业带来的挑战。她讨论了如何应用记录链接（record
  linkage）来匹配具有高 SKU 周转率的相似产品，她如何思考要构建什么以及要解决哪些问题，并为有志于转行从事数据科学事业的本科生和研究生提供了建议。


  **塞巴斯蒂安·古铁雷斯（Sebastian Gutierrez）：** 请介绍一下你的工作单位。


  **Erin Shellman：** 我在诺德斯特龙数据实验室工作。这份工作令人兴奋，因为在零售业，尤其是时尚零售业，我有机会处理多个领域的数据应用和问题，包括交易数据、业务运营、点击流以及服装颜色的季节性趋势。像诺德斯特龙这样规模和历史的零售商，能够接触到许多纯在线零售商无法获得的独特数据，因为他们没有实体店。我们处理的数据的异质性使这份工作既有趣又富有挑战性。


  **Gutierrez：** 诺德斯特龙数据实验室是如何架构的？


  **Shellman：** 我们是一个小型、多学科的团队，几乎平均分为数据科学家和软件开发者，我们在所有项目上紧密合作。我们携手合作，实现了 1+1>2 的效果。


  **Gutierrez：** 在这种多学科团队中工作感觉如何？


  **Shellman：** 我非常喜欢我的团队，因为每个人都很出色，而且有很多相互学习的机会。例如，我们使用一种称为“结对编程”（pair programming）的技术。这是一种相互合作的编程练习，我们连接两台显示器、键盘和鼠标，以便能同时在同一个程序上工作。这是一种进行代码评审、学习和教学的绝佳方式。


  这确实是我在多学科团队工作中最喜欢的部分。


  **Gutierrez：** 除了结对编程，你们会进行“结对数据科学”吗？


  **Shellman：** 我们不会在统计或数据科学工作上正式结对。对于这些主题，我们会在开放式办公室的白板前进行常设讨论。例如，昨天我们以一场讨论结束了当天的工作，讨论内容包括如何应用统计模型、需要哪些数据、模型的局限性，以及在实时应用中使用模型时预期的延迟。所以，虽然我们不是在结对编程，但我们作为团队共同讨论了行为方式和预期结果。我们工作空间的伟大之处在于，这些讨论都是公开进行的，每个人都能听到、选择参与，并在有贡献时加入讨论。


  ## 《工作中的数据科学家》第 69 页


  **Gutierrez：** 与开发者合作感觉如何？


  **Shellman：** 我已经使用`R`语言编程十年了，但你不会用`R`来开发通用软件，所以我必须学习大量新知识，并以不同的方式思考。我们今年早些时候发布了`Recommendo
  2.0`，这是我们产品推荐 API 的第二个版本，我负责其中一个名为`the scorer`的实时组件。简而言之，`the scorer`接收关于客户行为（如产品页面浏览或加入购物车事件）的消息。然后，它会根据客户当下在会话中的行为，实时重新排序推荐内容。


  我最初使用`Python`库`pandas`编写了`the scorer`，因为我们之前一直用它在夜间进行批量推荐。嗯，我后来了解到，我们在批处理作业中享受的`pandas``DataFrame`的便利性，在实时应用中表现不佳。每次`the
  scorer`运行时，都需要解析一条消息、计算并更新分数，该过程需要对`AWS`上的`Dynamo`表进行多次读写。在这种情况下，`DataFrame`对象设置的启动成本太高，我最终不得不重写整个程序，不再使用`pandas`。


  过去，我不太需要担心程序的性能，所以没有意识到我编写的`the scorer`的性能限制。当我需要建议时，身边有才华横溢的开发者真是太好了。


  **Gutierrez：** 从本科到诺德斯特龙，你的职业发展历程是怎样的？


  **Shellman：** 我本科时主修经济学和哲学，因为我非常喜欢思考人类行为和互动的复杂性。我特别被经济学吸引，是因为我喜欢用数学来描述这种复杂性的过程。随着学业的深入，我意识到自己在
  40 岁时无法想象自己仍在从事经济学工作，并且知道我需要改变。我当时很年轻，没有意识到你不必一辈子都做你主修的专业。


  驱使我从社会科学转向的部分原因是阅读了理查德·道金斯（Richard Dawkins）的《自私的基因》（*The Selfish Gene*）1 和罗伯特·阿克塞尔罗德（Robert
  Axelrod）的《合作的进化》（*The Evolution of Cooperation*）2，后者是关于进化博弈论的经典著作。我对将类似经济学的数学模型应用于生物学产生了钦佩和热爱。因此，我决定不再专注于经济学，而是希望在学习生物科学的同时保留数学方向。为了真正探索这个领域，我在美国国立卫生研究院计算生物科学部获得了一份实习机会。




  我曾为数学家吉姆·马利工作，他教会了我机器学习以及如何将其应用于生物学问题。我使用`随机森林`在比较基因组学研究中做了大量工作。


  我非常热爱那次实习，以至于我知道自己在本科毕业后想从事与统计学和生物学相关的工作。随后，我在密歇根大学开始了生物统计学的硕士项目，之后又在该校攻读生物信息学博士学位。毕业后，我意识到传统的学术道路并不适合我，我更想投身于数据科学领域具有挑战性的问题。有趣的是，尽管学术界在应用机器学习技术方面领先于工业界，但在数据技术的有效利用上却较为滞后。我认为要真正掌握那些技术，就必须离开学术界，而我也正是这样做的。


  **古铁雷斯：** 你对现在的本科生有什么建议？


  **谢尔曼：** 我给本科生的建议是学习计算机科学、数学或统计学，最好是三者的结合。除此之外，你学什么其他专业都无关紧要，只要拥有这三项技能，你就可以做任何你想做的事，毫不夸张地说。我认为机会是无限的，这意味着你实际上不必局限于任何一个行业。无论如何强调学习数学以及更广泛的数学知识的重要性都不为过，因为这是你学会推理和批判性思维的地方。那些正在经历高速增长、令人振奋的行业，都以某种方式涉及数学、计算机科学和统计学。


  **古铁雷斯：** 既然你已经进入了这个行业，你目前在学些什么？


  **谢尔曼：** 我现在正在努力学习编程和计算机科学，并且投入了大量精力。我参加了很多线下技术交流活动，在不少活动中发表演讲，甚至还在组织一场。我是`PyLadies`西雅图分会的联合组织者，这是一个国际性的导师制团体，旨在帮助女性成为
  Python 开源社区的积极参与者和领导者。


  我也在重新审视研究生时期的一些旧项目，并运用我新提升的数据技能，看看能否让它们焕发新生。


  我现在感觉自己正在翻越一座智力高峰。我已经完成了基础知识的学习，对各个部分如何协同工作有了清晰的认识，并在此基础上不断深化。不过，我也开始意识到，以前掌握得很牢固的东西现在变得有些模糊了，所以我必须回头复习。我必须确保在编程和数学之间保持平衡。


  **古铁雷斯：** 你是什么时候意识到自己想将数据工作作为职业的？


  **谢尔曼：** 我在美国国立卫生研究院实习后，就知道自己想以科学为职业，而收集和分析数据是科学工作中极为重要的一部分。


  我觉得自己从未真正清醒地意识到想要与数据打交道*本身*，我只是想回答那些酷炫的问题。数据不过是世界在对你发出的声响。


  我想我更感兴趣的是应用层面。


  **古铁雷斯：** 你觉得自己四十多岁时还会从事数据科学工作吗？


  **谢尔曼：** 嗯，数据科学的问题在于，它几乎成了一个无所不包、以至于毫无意义的概念。几乎所有数据科学讲座都以一张讨论“这到底*意味着*什么？”的幻灯片开始，原因就在于它几乎什么都说明不了。对我来说，数据科学家是拥有特定量化和计算技能、并能将其应用于不同领域的人。因此，作为一名数据科学家，即使我没有某个领域的专业知识，我也可以去学习，并且能够处理任何可以用定量方法描述的问题。


  我几乎可以肯定自己四十多岁时不会还在时尚零售业，但我确信我会从事一些依赖数据的工作，并运用类似的技术和方法。


  **古铁雷斯：** 你会如何向一位数据科学家描述你的工作？


  **谢尔曼：** 我构建推荐引擎，就像你在网络上随处可见的那种，有时我会利用非常独特的数据来做这件事，比如我们实体店中个人造型师的交易数据，或者来自面料的色彩趋势。


  **古铁雷斯：** 你最近在忙些什么？


  **谢尔曼：** 在过去的一年半里，我主要在做`Recommendo`项目，负责构建新算法和实时评分器。在过去的几个月里，我们一直在开发`Recommendo`的后续项目，它将提供客户细分服务。我们称之为`Segmento`，并且已经与电子邮件营销团队进行了一些初步测试。


  `Segmento`是一个用于创建自定义受众的内部工具，其部分灵感来源于 Facebook 的受众构建工具。在初步测试中，我们根据过去的购买活动和商品页面浏览记录，为特定品牌和产品类别构建了客户偏好度评分。我最近在开发一个分类器，以便根据人口统计特征和购买行为将相似的客户分配到预定义的组别中。


  **古铁雷斯：** 为什么推荐对诺德斯特龙如此重要？


  **谢尔曼：** 首先，推荐服务能发挥诺德斯特龙的优势，因为我们拥有其他零售商没有的数据。我们拥有那些令人喜爱的实体店！我参与的第一个推荐引擎叫做`我们的造型师推荐`，它的原理是分析我们全线百货商店中由个人造型师促成的交易记录。


  我们的想法是，我们的个人造型师是我们能找到的最好的推荐者，他们非常擅长为我们的顾客搭配出协调的服装。


  我们的目标是在线上模拟这些造型师，并构建一个推荐策略来帮助我们的顾客协调他们的衣橱。


  `我们的造型师推荐`是一个很好的例子，它展示了针对时尚数据定制的推荐算法，并充分利用了我们造型师的深厚专业知识。


  相比纯线上零售商，这是一个竞争优势，因为这是一种他们难以轻易复制的客户体验。


  **古铁雷斯：** 你刚加入诺德斯特龙时，处理的是什么数据？


  **谢尔曼：** `我们的造型师推荐`是我们团队处理的第一个项目，主要涉及我们全美 117 家全线门店的店内交易数据。我们首先研究了造型师在卖什么，特别是购物篮的商品构成。


  现在，我们已经将推荐工作扩展为一个完整的平台，处理来自多种渠道的数据，包括点击流数据和在线购买数据。


  **古铁雷斯：** 你是如何将历史悠久的诺德斯特龙品牌与创新的数据科学方法融合在一起的？


  **谢尔曼：** 这是一个持续的挑战，但我们已制定了几项成功的策略。首先是公司范围内的开放政策，邀请人们随时过来看看我们，而他们也确实经常这么做。来自公司各个部门的同事会来告诉我们，他们过去是如何处理某个问题的，以及他们认为我们能在哪些方面提供帮助。


  很多时候，他们已经陷入瓶颈，想听听我们对如何解决这个问题的看法。其他时候，人们只是停下来聊聊，把我们当作一个反馈对象。


  我们还努力与最终负责将我们的成果呈现给客户的团队——主要是网站团队——保持良好的关系。因此，我们会定期与他们沟通，让他们了解我们这边的进展。同时，我们也确保当他们发现错误时，我们能迅速响应——尤其是在企业环境中，他们通常习惯了提交服务请求后，需要等上一周才能得到回复。因此，当我们能回应说“我刚推送了更改，大约十分钟后就会在网站上生效”时，他们显然非常喜欢这样。




  最后，将我们的产品制作成原型，让内部客户能够尽早使用，这对我们的成功至关重要。它甚至不需要多么花哨。例如，我们的推荐预览工具并没有特别有趣的视觉效果，但它足以展示我们算法的结果。现在我们可以向内部客户发送一个
  `URL`，让他们坐在办公桌前就能了解我们产品的行为，进行试验，并在我们讨论产品上线之前就提供反馈。这非常有帮助，也是让人们对我们的工作感到兴奋的一个非常好的方式。建立和维护这些关系就像其他任何事情一样——你必须不断投入。培养这些关系是工作的一部分，如果你不加理会，它们以后可能就不复存在了。


  **古铁雷斯：** 你们在大型门店中如何与造型师对接？


  **谢尔曼：** 对我们来说幸运的是，诺德斯特龙喜欢从内部提拔人才，所以我们的许多合作者过去都在销售区或仓库工作，这在你想联系门店员工时非常有用。


  我提出的一个推荐策略是分析客户重复购买的美容产品，这样当我们认为您最喜欢的化妆品快用完时，就能发送邮件提醒。诺德斯特龙有“美容造型师”——专门精通美容产品和化妆品的个人造型师，我们利用一位合作者的人脉去了旗舰店，与那里的美容造型师交谈。我们请她喝咖啡，了解她的一天是如何度过的，以及她如何与客户互动。我们还和她谈到了一个我们计划构建的工具，当客户的美容产品快用完时，这个工具会提醒她。然后造型师就可以给客户打电话，跟进并确认该产品的情况。


  然而，通过我们的交谈，我们了解到她对我们的工具不感兴趣，因为如果与她聊天的客户在线补充了产品，这位造型师无法获得该笔销售的业绩提成。幸好我们在花大量时间为她开发工具之前就发现了这一点，而如果我们不去和她当面交流，我们就不可能知道。这个发现过程对于最终产品——一个个性化邮件活动——的开发至关重要。


  **古铁雷斯：** 你们在门店里做过什么实验？


  **谢尔曼：** 我们进行了一项实验，在门店里被评为最高收藏量的产品旁放置具有 Pinterest 风格的主题标志。这些主要是写着“本周收藏量最高单品”的小标牌。这是一个有趣的案例，即在我们实体店中使用在线数据，看看它能为客户提供什么价值。具体来说，我们测量了新的
  Pinterest 标识是否提高了这些热门产品的销售率。


  我们测试了几种实验条件。例如，是把所有最高收藏量单品集中放在一个显眼的位置好，还是把它们放在各自原本的货架上以鼓励顾客去发现更好？


  虽然只是个小实验，但它有助于将顾客的注意力吸引到热门产品上，也成为了我们造型师开启对话的话题。


  **古铁雷斯：** 还有哪些公司在时尚零售和特色零售领域做着有趣的工作？


  **谢尔曼：** Rent the Runway 出租高端服装，是一家很酷且具有创新性的企业。Birchbox 为男性和女性的美容产品提供了一种简洁的月度订阅模式。然后还有像
  Stitch Fix 这样的箱式订阅公司，当然还有最近被诺德斯特龙收购的 Trunk Club。我对 Trunk Club 感到非常兴奋，因为他们将会有有趣的新问题需要解决，比如如何优化产品组合，甚至优化运输的重量和成本。在闪购领域，有
  Haute Look（也是诺德斯特龙旗下的公司）和 Zulily，它们都在进行创新，尤其是在产品推荐方面做了大量出色的工作。


  闪购网站的产品更替率极高，因此他们每天都要应对每个产品面临的冷启动问题。


  **古铁雷斯：** 考虑到你们拥有大型百货商店的模式，你认为还有哪些类型的数据可以充分利用？


  **谢尔曼：** 我们最近收购的 HauteLook 和 Trunk Club 带来了许多令人兴奋的新数据。诺德斯特龙认识到并非只有一种类型的客户，并通过大型门店、Rack
  折扣店、HauteLook 和 Trunk Club 提供不同的购物体验，这是非常明智的。看看客户如何与所有这些渠道互动将会非常有趣，并且这也会带来新的挑战。衡量跨所有这些渠道的行为会很困难，但也为交叉推广提供了众多机会。


  最有趣的数据类型是为一个目的收集却被用于另一个目的的数据。例如，我们的一位开发人员 Jason Wilson 有一个很酷的想法，查看人们在要求提供礼品收据时购买了哪些商品。然后你就可以为即将到来的节日推荐最常被作为礼物的产品。这与“我们的造型师推荐”的思路如出一辙。就让人们做他们正在做的事情，并利用这种行为来提升我们的服务。


  **古铁雷斯：** 一个刚刚起步的人如何从数据科学的角度学习更多关于时尚零售行业的知识？


  **谢尔曼：** 会议是学习和结识从事类似问题的人的好地方。老实说，Twitter 是一个非常好的资源。很容易找到并关注 Rent the Runway、Warby
  Parker、Zulily 等公司的人，看看他们在做什么，以及他们目前喜欢哪些工具和技术。另一个好地方是公司博客。MailChimp 和 Etsy 都有非常棒的博客。


  我还建议，当你在交谈中有机会学习时，要多问问题，不要担心别人会认为你什么都不懂。然后问跟进问题。电子邮件是这种交流的一个很好的媒介。我完全不反对主动发送邮件。不要担心不懂术语。我来自生物医学科学领域，在零售业没有任何经验，所以有很多东西我不懂，我就直接请别人解释给我听。如果你以这种态度进行每一次谈话，人们会告诉你很多东西，而你的工作就是吸收它们。


  **古铁雷斯：** 在诺德斯特龙的工作中，有什么让你感到自豪的事情？


  **谢尔曼：** 我为我们能在短时间内取得的成就感到非常自豪。在不到一年的时间里，我们发布了一个推荐 `API`，它被用于业务的许多不同部分。`Recommendo`
  遍布我们的网站、营销邮件和交易邮件中，并且很快会出现在移动应用中。


  从个人角度来看，我也为自己在毕业后能够如此迅速地学习和适应这个行业感到自豪。当我回顾自己作为生物信息学家所掌握的技能和使用的技术时，与我目前使用的技能和技术几乎没有太多重叠。我学到了很多，技能也成熟了不少，这真的很棒。不过，我并不觉得自己已经完成了，甚至感觉还差得远，但我非常期待看到一年后的自己会是什么样。


  **古铁雷斯：** 一个典型的工作日是什么样的？


  **谢尔曼：** 我们从小组站会开始，讨论当天的工作内容、任何求助请求或需要注意的事项。我们小组使用一个 `kanban` 板来跟踪工作进度，所以我们会把任务写在便利贴上，然后在“待办”、“进行中”和“已完成”之间移动它们。然后通常，取决于我在做什么，我大部分时间都在编程。耶！




  '
- '# 诺德斯特龙公司艾琳·谢尔曼访谈


  偶尔我会参加一些会议，不过我们的总监在这方面做得很好，帮我们挡住了大部分会议，这让我们可以在一天中花大量时间做有成效的工作。团队也有许多例行活动。


  集体午餐是常事，下午一起喝咖啡也很普遍。我真的很庆幸，团队里的所有人都是我整天都想待在一起的人。


  **古铁雷斯：** 您如何看待和衡量进展与成功？


  **谢尔曼：** 我们都对自己的进展负责，并且不做冲刺规划。我们把具体任务写在便利贴上，比如“为评分器增加更多测试”，然后专注于这些任务直至完成。我们不一定每周都有必须完成的事项，只是尽可能快速推进我们负责的、以任务为基础的项目。


  在衡量成功方面，每周四，诺德斯特龙创新实验室都会举办演示分享会，内容是五个五分钟的闪电演讲。目的是展示你正在做的工作，并获取早期反馈。内容不必有多么完整，甚至可以是你遇到瓶颈、需要建议的某个尚未解决的问题。


  ***第四章 | 艾琳·谢尔曼，诺德斯特龙公司***


  对我们来说，周四是一个不成文的截止日期，因为我们都想确保有东西可以展示。由于只有五个名额，你可能没有机会展示自己的工作，但目标是有所准备，哪怕只是几张图表。了解彼此的工作——进展和障碍——非常有帮助。


  演示分享会结束后，我们立即进行“回顾”，也就是复盘，对我们来说基本上就是欢乐时光。在复盘会上，我们讨论本周的生产力情况、哪些做得好、哪些做得不好，以及下周如何改进。无论讨论什么，我们都把它看作是团队聚在一起反思或只是聊聊天的时间。


  **古铁雷斯：** 你们是如何想出要研究或分析的点子的？


  **谢尔曼：** 我们的点子来源于内部，或者来自公司内部的合作者。我们团队最酷的一点就是与来自各个业务领域的人合作。例如，团队里的另一位数据科学家艾丽莎·布朗一直在研究门店履约这个领域。除了我们的仓库，每家诺德斯特龙门店都可以作为一个微型履约中心。艾丽莎的工作涉及预测预期的履约请求，以便这些请求能高效地分配到各个门店，并有望缩短产品送达客户的时间。


  我们也自主开发项目。例如，我们创建了一个名为 `My Color Trends` 的推荐策略，这是一个通过色彩视角对客户的诺德斯特龙衣橱进行交互式可视化的工具。这个推荐器是一种交互式方式，让你可以可视化自己的调色板，并探索你购买的产品中的颜色。`My
  Color Trends` 也是一个工具，帮助客户找到与所选颜色精确匹配或互补的新产品。我构建的功能之一是一个推荐互补色产品的策略。什么是互补色尚有争议，但我通过从织物本身最常见的共现颜色中创建关联规则，一举解决了这个问题。这个策略的妙处在于它是数据驱动的，因此我不需要制定僵化且武断的规则。当季节和潮流变化时，关联规则也会随之调整，反映品味的变迁。


  一些最初与合作者共同启动的项目，为了找到合适的定位可能需要演变。例如，我之前提到的美容补货工作，最初是供美容造型师使用的工具，后来演变成了一场个性化的电子邮件营销活动。这非常棒，因为我们可以自由地开展这项工作，并能够根据我们认为最佳的方向进行改变。幸运的是，我们最初取得了非常好的成功，这让我们能够勇于创新。我们没有被要求做的项目搞砸，所以现在我们有了更大的自由度去做一些更酷的工作。


  ***工作中的数据科学家*** 77


  **古铁雷斯：** 你们具体使用哪些工具？


  **谢尔曼：** 我最近写了很多 `Python` 代码，我们所有的推荐算法都是用 `Python` 编写的。`Recommendo API` 是用 `node`
  编写的，托管在 `AWS` 上。我们在 `Python` 中使用了大量开源库，比如 `scikit-learn` 和 `pandas`。作为一个以前几乎只用 `R`
  的人，`pandas` 非常棒，因为它在某种程度上算是“作弊”。它让 `Python` 变得很像 `R`，所以你可以用 `Python` 编码，同时享受到我们习惯的
  `R` 的诸多便利。当然，你也会因为要记住是 `len` 还是 `length`，以及索引是从 0 开始还是从 1 开始而抓狂。


  **古铁雷斯：** 您最近具体参与了哪个项目？


  **谢尔曼：** 虽然已经过去一段时间了，但美容补货项目真的很有趣。这个项目最初是供美容造型师使用的工具，后来演变成了一场个性化的电子邮件营销活动。起初我们以为，造型师如果能知道客户的产品快用完了，就可以打电话提醒他们来店里补货，这会很有帮助。但在从造型师那里获得早期反馈，得知他们不太可能使用这样的工具后，我们将美容补货工作应用到了个性化电子邮件中。


  我开始分析活跃的美容客户，查阅她们的美容交易历史，了解她们购买了什么，然后估算她们什么时候需要补货。


  最大的挑战是美容产品的 `SKU`（库存量单位）更迭很快。例如，假设四个月前我买了一瓶乳液，现在出了新的改良配方。作为客户，当我补货这瓶乳液时，新的改良配方就是我四个月前买的同款产品。然而，从制造商的角度来看，这是一个新的
  `SKU`。


  问题在于，如果我在分析中没有考虑这种 `SKU` 的谱系关系，就会遗漏很多补货购买。


  我使用 `record linkage`（记录链接）来解决这个问题。`Record linkage` 是一种用于在人口普查数据和医疗记录等数据中查找重复项的技术。在调查数据中，通常会有拼写错误和姓名拼写变异，你需要将这些不同的记录关联到同一个条目中。我做的也是同样的事情——只不过不是名字和地址，而是品牌、类别和产品描述。我对产品类型和品牌等进行强制匹配，然后使用模糊字符串匹配来衡量产品描述之间的相似性。我的输出结果是两个候选产品是同一个“记录”的概率。


  在开始这个项目时，我并不知道 `SKU` 更迭会占这么大的比重。我当时经验不足，对产品目录以及 `SKU` 如何演变并不熟悉。但这恰恰让这个项目变得有趣且充满挑战。


  ***第四章 | 艾琳·谢尔曼，诺德斯特龙公司***


  美容补货邮件是诺德斯特龙公司推出的第一批针对个人层面的个性化营销活动，其表现优于传统的营销邮件。今年夏天，我们一位非常能干的实习生接手了这项工作，并将所有流程自动化，变成了每周持续进行的活动。看到这项工作从最初的想法，到测试，再到自动化，并最终投入生产，真是非常有成就感。我由衷地感到自豪，因为它是诺德斯特龙内部构思和打造的产品，并且我认为它展示了诺德斯特龙的技术能力。




  **古铁雷斯：** 您或实验室是如何考虑是否承接新项目，或者改进已有项目的？


  **谢尔曼：** 我们通常只是与提出新功能需求的人进行一次简单的成本效益对话。对话内容大致是这样的：“我可以构建一种新的推荐策略，它能读懂客户的心思，并自动将产品送到他们家中，但我必须停止处理你要求的其他功能。”
  虽然不总是如此，但大多数情况下，所请求的改进是锦上添花，而非必不可少的，尽管一个“读心”推荐器或许是个值得追求的好主意。我们主要根据网络团队的发布期限来确定优先级，因此只要我们能满足这些期限，添加新功能就没有问题。


  **古铁雷斯：** 您如何判断自己是否在解决正确的问题？


  **谢尔曼：** 我通常从终点开始思考。假设你已经构建了你正在考虑的东西，然后问“那又怎样？”客户想要你的产品，并且他们会用吗？客户可以是内部的，也可以是外部的。有一次，我们正在考虑制定一个涉及香水“香调”的推荐策略。最终我们决定不这么做，因为我们问了一些简单的问题。有多少人在网站上使用香水筛选器？谁会使用这些推荐？事实证明，大多数购物者不会按香调筛选搜索结果，也没有热切的消费者在等待这个功能，所以我们没有构建它。


  **古铁雷斯：** 一旦你确定了这个项目值得做，你是如何开始了解数据的？


  **谢尔曼：** 我会花大量时间进行基础的绘图和视觉扫描新的数据集。我们的总监杰森·高恩斯会笑话我，因为我会把数据集在我的大显示器上全屏打开，然后只是滚动浏览。我就是喜欢看着它，了解字段是什么，感受一下数据的“感觉”。这也是发现拼写错误和像兰蔻、M•A•C
  这类品牌名中常见的奇怪字符的好方法。


  使用 `R` 将数据绘制成散点图矩阵非常有帮助，因为你无需做太多工作就能快速开始发现数据中的关系。热图在这方面也很棒。我大量使用 `plyr` 和 `dplyr`
  来拆分数据并查看聚合结果。这并非一个线性的过程。我只是随意摆弄，并提出很多问题。通常，当我看新数据时，脑海中会立刻涌现出许多关于事物是什么以及它们如何关联的想法、假设和结论。一旦有了这些想法，我就会试图去推翻它们。这是一种了解数据结构的有趣方式。


  **古铁雷斯：** 您如何与其他人分享您正在构建的知识？


  **谢尔曼：** 我们对 Atlassian 公司的 Confluence 非常着迷，数据实验室在 Confluence 上有一个非常活跃的空间。Recommendo
  项目在 Confluence 上有完整的文档记录，因此公司里的任何人都可以了解它是如何构建的、在哪里可以找到它以及如何使用它。我们也在 Confluence 上分享探索性分析和报告，这样即使工作没有融入到一个更大的项目中，我们仍然可以交流知识。


  除了 Confluence，展示与讲述对知识共享也非常有益。我们还有午餐学习会，这是一个进行更长篇幅演示的空间。有时午餐学习会就是从展示与讲述发展而来的。例如，我们的一位团队成员构建了一个
  REST API，因此展示与讲述的演示就扩展成了一个午餐学习会。


  在公司外部，我们的团队会在很多会议和聚会上做演示。分享我们的技术过去并不是诺德斯特龙经常做的事情，所以我很高兴我们现在正在这样做，因为我喜欢谈论我的工作。


  **古铁雷斯：** 目前谁的工作在启发着您？


  **谢尔曼：** 我有点痴迷于哈德利·威克汉姆的工作。我认为，十年后，人们会清楚地看到，是哈德利让 `R` 免于变得除了学术界以外无人问津。或者也许不会，但无论如何我们都是赢家，因为像
  `dplyr` 和 `ggplot2` 这样的库让我们所有人都受益匪浅。我也是 Python 中 `pandas` 库的创建者韦斯·麦金尼的粉丝。


  尽管我现在已不在那个行业，但我仍然阅读生物信息学/系统生物学的文献，并且非常着迷于斯坦福大学科弗特系统生物学实验室的工作。他们进行全细胞建模，这是一种在基因组尺度上对细胞系统进行数学建模的实践。我曾有一个失败的相关论文课题，但我热爱这项研究。同样地，OpenWorm
  项目——一个线虫的完整生物体模拟器——也令人着迷。


  **古铁雷斯：** 当您说“关注”那个项目和文献时，具体意味着什么？


  **谢尔曼：** 嗯，除了阅读他们的论文，我还会下载数据和代码并研究它们。科弗特实验室公开了他们的代码，我最近一直在摆弄它，因为从研究生院毕业后，我脑海里还有一些尚未成型的想法。


  **古铁雷斯：** 在别人的工作中，您看重什么？


  **谢尔曼：** 呈现能力。我能说什么呢？我很肤浅。我指的不只是视觉呈现（虽然这也很重要），而是能用技术性和非技术性两种方式来传达结果的能力。这项工作需要清晰、连贯地传达其要点。我会看他们是否做了花哨但缺乏严谨性的工作。草率的复杂性比比皆是，因为许多方法，特别是机器学习领域的方法，已经通过外部库商品化了。呈现能力是构思故事的能力，包括你做这项研究的原因、为什么我应该感兴趣、你做了什么，以及你方法的合理性。


  不幸的是，我认为呈现能力被低估了，但它实际上是促成个人成功和创造成功项目的最重要因素之一。


  **古铁雷斯：** 您如何看待数据科学的未来？


  **谢尔曼：** 如果你观察数据科学初创公司的趋势，我们似乎正朝着“一键式”数据科学的方向发展。我听到很多这样的营销话术：“将数据科学家从编程中解放出来”或“将数据科学家从技术负担中解放出来，让他们可以回归数据本身。”我认为这些产品是对具备数据科学技能人才供应不足的一种回应。在那些很幸运拥有一位数据科学家的小公司里，这些工具承诺能让他们更高效。但这并非易事，所以我非常怀疑这些产品以及它们的持久性。


  我认为我们未来会看到的是数据科学家角色的演变。目前，数据科学家通常是拥有硕士或博士学位的学术界出身人士，但这样的人材数量不足以满足需求，因此我预计我们会看到大量软件工程师接受再培训并转型进入数据科学领域。你可以在
  Coursera 和 Udacity 提供数据科学课程和认证这一点上看到这种趋势已经发生。


  **古铁雷斯：** 有什么事情是少数人知道，但你认为五年后人人都会知道的？




  ### 谢尔曼：广告技术行不通，但我觉得现在大家都明白了……开个玩笑。回到我前面提到的科弗特实验室的工作，我希望在未来五年内，我们能看到细胞科学中对预测模型的重视程度有所提高。我认为，以计算方式运行实验并在全细胞系统级别进行预测的能力具有不可估量的价值。通过建模学习、用实验检验模型预测、再根据结果更新模型，这个循环对我来说是显而易见的，但整个学术界极其厌恶风险，并且未能有效利用这些模型作为实验设计的工具。


  **工作中的数据科学家** 81


  **古铁雷斯：** 对于那些希望进入数据科学领域的本科生和研究生，你有什么建议？


  **谢尔曼：** 给那些还在决定学什么的人的建议是，STEM 领域是显而易见的选择，尤其是其中的“TEM”。学习 STEM 学科会为你提供测试和理解世界的工具。这就是我对数学、统计学和机器学习的看法。我对数学*本身*不是特别感兴趣，我感兴趣的是用数学来描述事物。毕竟这些是工具集，所以即使你对数学或统计学提不起劲，投入时间去学习它们，并思考如何将之应用到你真正热爱的事情上，仍然是超级值得的。


  对于那些像我一样试图转型的人，我会说，首先，这很难。要意识到换行业很困难，你必须要为此付出巨大努力。这不仅限于数据科学——生活本就如此。在这个领域没有任何人脉是很艰难，但你可以通过参加聚会、与慷慨的人喝咖啡来建立联系。我人生的首要原则是“跟进”。如果你和某个拥有你想要的东西的人交谈过，记得要跟进。


  我从一个和我们类似的数据实验室的主任那里听说了一个故事，是关于一个潜在的候选人，他不具备加入团队所需的技能和经验。主任建议这位候选人在 Coursera 上选修一门机器学习课程，弄清楚数据科学是否不仅仅是一时兴起。这位候选人真的选修了这门课，并且每周都给主任发邮件汇报学习进度，并请教后续问题。我认为这是一个非常棒的例子，展示了付出额外努力，并向潜在雇主和自己证明，你能够做到成为一名成功的数据科学家所需的一切。我相当肯定他们最终得到了那份工作。


  **古铁雷斯：** 你对正在找工作的数据科学家有什么建议？


  **谢尔曼：** 数据科学家的招聘启事可能非常吓人，因为大多数读起来就像一个数据科学术语表。事实是，技术变化如此之快，没有人能拥有写在一份招聘启事上的所有经验。当你看到这些时，可能会感到不知所措，你可能会觉得，“这不适合我。我没有任何这些技能，也做不了任何贡献。”只要你能接受变化和不断学习新事物，我会鼓励你不要陷入这种心态。


  归根结底，公司想要的是一个能够严谨地定义问题并设计解决方案路径的人。他们也想要善于学习的人。


  我认为这些才是核心技能。


  ## 章节


  ### 丹尼尔·唐克朗


  领英


  **丹尼尔·唐克朗**是领英的搜索质量负责人，领英是全球最大的互联网职业社交网络。自 2003 年成立以来，领英已发展到超过 200 个国家的 3 亿多会员，增长率超过每秒新增两名会员。领英庞大且不断增长的规模，使得在领英生态系统内找到职业相关信息和专业人士的能力变得更为关键，也更具数据密集型。考虑到所涉及的数据量、搜索实体的特异性、数据的消歧以及所需的搜索相关性，构建和维护能够提供所需用户体验的搜索能力面临着巨大的挑战。


  唐克朗此前担任领英的数据科学总监，领导产品数据科学团队。在加入领英之前，他在谷歌领导一个本地搜索质量团队。在此之前，他是 Endeca 的创始员工和首席科学家，这是一家企业搜索应用供应商，后被甲骨文以
  11 亿美元收购。唐克朗还曾在 IBM 托马斯·J·沃森研究中心和 AT&T 贝尔实验室工作。他拥有 22 项专利，卡内基梅隆大学的计算机科学博士学位，以及麻省理工学院的学士和硕士学位。


  **第 5 章 | 丹尼尔·唐克朗**，领英


  **古铁雷斯：** 给我讲讲你成为领英搜索质量负责人的经历吧。


  **唐克朗：** 我很幸运能很早就接触到数学和计算机科学。在我还在上小学的时候，我父亲就教我编程，还有一些数学和物理知识。我在学校也有很棒的数学老师，这让我在上高中时就能在离家一个街区远的哥伦比亚大学选修很多数学和计算机课程。


  后来我去了麻省理工学院读本科，在那里我主修了数学和计算机科学双学位，同时通过一个包含在 IBM 托马斯·J·沃森研究中心实习的项目，也拿到了计算机科学的硕士学位。


  正如人们所说，上麻省理工就像从消防水带里喝水。我有机会学习了概率、组合数学和博弈论等许多非同寻常的课程。


  之后我去卡内基梅隆大学攻读计算机科学博士学位，我参与了一个名为“算法、组合数学与优化”的项目。这个跨学科项目强调计算机科学与数学和运筹学重叠的方面。我从课堂上学到了很多，从我的同学身上学到的东西甚至更多。我曾考虑做一个关于优化共享出行交通的论文，但最终开发了一个网络可视化系统。当时我万万没想到，有一天我会在为世界提供最大职业社交网络的公司工作！


  当我在 1998 年底完成博士论文时，我需要做一些内心的探索。我意识到自己不适合在学术界发展，但也不太清楚工业界能提供什么。我在一家咨询公司工作了几个月，这是我第一次体验非学术、非研究的工作。


  我的幸运转折点是在 1999 年被 Endeca 的联合创始人发现，并被聘为首席科学家。在那里的十年是一段非凡的冒险。我们最初的雄心壮志是在 eBay 上建立一个更好的方式来查找东西。


  像大多数初创公司一样，我们调整了方向，最终开发了彻底改变在线零售搜索体验的技术，并将其扩展到制造、商业智能和政府等其他领域。


  离开 Endeca 后，我去了谷歌，致力于提升本地搜索质量。具体来说，我领导了一个团队，负责将本地搜索索引与网络索引进行匹配，以确定本地企业的官方主页。这是一个有趣的机器学习问题，而且为世界上最受欢迎的网站改善搜索体验，本身就非常有成就感。





  但 2010 年底，领英向我发出邀请，让我有机会领导并组建一支数据科学团队，这是一个我无法拒绝的机会。


  ***工作中的数据科学家*** 85


  **塞巴斯蒂安·古铁雷斯：** 为什么领英的这份邀请如此有吸引力？


  **丹尼尔·坦克朗：** 在领英工作非常棒。我们解决的是能创造巨大价值的挑战性问题——不仅是在线上，线下也是如此。我们帮助人们找到工作，帮助企业发现人才，更广泛地说，是帮助职场人士每天都能更成功。为此，我们分析大数据——丰富、半结构化的社交数据。在这个过程中，我们开发并贡献开源工具、发表酷炫的研究成果等等。


  **古铁雷斯：** 你在领英的哪些团队工作过？


  **坦克朗：** 2010 年底加入领英时，我领导了产品数据科学团队，这是一群专注于通过创新方案来改进领英产品并创造新产品的数据科学家。这是一个绝佳的机会，让我能够领导和招聘那些兼具计算机科学背景、技术技能、创造性解决问题能力和产品直觉的稀缺人才。


  2013 年春天，我转岗到工程部门，组建了一个专注于查询理解的团队。在我职业生涯的大部分时间里，我一直对搜索（尤其是领英搜索）充满热情，这个机会让我能将这份热情聚焦到产品上。在工程部门工作很棒——我们需要更埋头苦干，专注于运维，但能一直在线上网站工作感觉很好。当然，和我共事的人都非常出色——他们是才华横溢、富有创造力的问题解决者，并且能把事情搞定。


  **古铁雷斯：** 担任搜索质量主管具体负责什么？


  **坦克朗：** 2014 年秋天，我的职责扩大，担任了搜索质量主管。我现在领导的团队，致力于让领英 3 亿多会员能够有效且高效地利用领英上的专业内容来满足他们的信息需求。这包括查询理解，也包括结果的评分和排序，以及为了在正确的时间将正确的结果提供给正确的搜索者，我们所需要做的一切其他工作。


  **古铁雷斯：** 你如何比较和对照领导数据科学团队与领导工程团队的不同？


  **坦克朗：** 我雇佣的数据科学家都拥有很强的软件工程技能，所以与领导数据分析师或统计学家团队相比，这种差异并不那么显著。主要的变化在于，我现在领导的团队完全拥有一个每年服务数十亿次搜索的产品。我们必须考虑所有事情，从提出新算法到确保网站不会宕机。


  ***第 5 章 | 丹尼尔·坦克朗**，领英*


  **古铁雷斯：** 为什么查询理解对领英来说是一个需要解决的重要问题？


  **坦克朗：** 搜索是让领英数亿会员能够互相找到并被找到的方式。2012 年，领英会员在该平台上进行了超过 57 亿次以职业为导向的搜索，而且这个数字此后还在持续增长。搜索是领英会员与我们平台互动的最重要方式之一。


  确保我们的会员能找到他们要找的东西或人，是我们的工作。由于领英上的搜索体验是高度个性化的，我们在向会员提供高质量结果方面面临着独特的挑战。我们的搜索引擎需要考虑到你是谁、你认识谁，以及我们对你的社交网络了解多少，来帮助你找到你要找的东西。


  查询理解在相当一段时间里一直是一个重要问题。我在`Endeca` 公司工作时，就开始思考这件事，当时我从事分面搜索和半结构化数据集的工作。由于领英在这两方面都是典型代表，很自然地就能看到更好的查询理解如何能改善搜索体验。我在这块领域已经摸索了一段时间，并在
  2013 年决定全身心投入其中。


  **古铁雷斯：** 为什么查询理解让你如此感兴趣？




  **Tunkelang：** 查询理解提供了弥合搜索者意图与机器理解之间差距的机会。它不处理内容与搜索者相关程度这一主观模糊的问题，而是专注于建立明确信息需求这一更客观的问题，这样我们就能判断哪些内容从根本上来说是相关的。此外，我们还能改善搜索者与机器之间的沟通语言，这是人机交互领域一项令人兴奋的发展。


  **Gutierrez：** 为什么搜索相关性对于 LinkedIn 来说是一个需要解决的重要问题？


  **Tunkelang：** 搜索是 LinkedIn 平台的一大支柱——它使我们超过 3 亿的会员能够找到他人并被他人找到。但搜索结果当然必须具有相关性。我们的会员进行着数十亿次搜索，而每一次搜索都根据搜索者的身份及其与
  LinkedIn 经济图谱中其他专业实体的关系进行了高度个性化处理。这是一个涉及多个维度的挑战性问题，解决它将为我们的会员带来巨大价值。


  **Gutierrez：** 今年你一直在做什么工作？


  **Tunkelang：** 顾名思义，查询理解团队一直致力于理解查询——具体来说，就是我们的会员在 LinkedIn 上搜索时发出的查询。我们在决定检索和评分哪些结果之前，会先对查询进行理解。例如，如果有人搜索
  `"daniel linkedin"`，我们可以判断出 `"daniel"` 是一个人的名字，而 `"linkedin"` 是一家公司，因此我们只检索与名叫 Daniel
  且在 LinkedIn 工作或曾工作过的人相关的结果。这种搜索前处理通过排除无关结果，大幅缩减了结果集，并使得评分能专注于更细微的差别——例如优先呈现与搜索者职业关系更强的人。


  与此同时，我们一直在解决评分和排序方面的各种问题。我们一直在构建个性化的、基于机器学习的排序模型，并按查询类型进行细分。例如，一位职场人士通过姓名查找新认识的人，与一位招聘人员试图寻找候选人，情况是不同的。我们已开始使用一种名为
  `Galene` 的新架构，该架构是为了应对 LinkedIn 独特的搜索挑战而构建的。


  **Gutierrez：** `Galene` 现在允许 LinkedIn 用户执行哪些之前无法执行的查询类型？


  **Tunkelang：** LinkedIn 早期的搜索引擎是建立在流行的开源框架 `Lucene` 上的。随着我们的发展，我们通过在该框架之上添加层来演进搜索技术栈。我们的系统扩展方法是反应式的，往往关注点很窄，导致我们不断向架构堆叠新组件，每个组件用于解决一个特定问题，而没有从整体上考虑系统的整体需求。这种增量式演进最终遇到了瓶颈，迫使我们花费大量时间来维持系统运行，并进行各种扩展性上的黑客手段来突破系统的极限。


  因此，我们决定彻底重新设计我们的平台。结果就是 `Galene`，一种新的搜索架构，它现在为我们的多种搜索产品提供支持，包括在你输入时即时查找人员的 `"instant"`
  功能。`Galene` 还帮助我们改进了开发文化和流程。例如，每周都能利用离线算法的变更构建新索引的能力，支持了更敏捷的测试和发布流程。


  **Gutierrez：** 自从你组建团队以来，这种方法是如何演进的？


  **Tunkelang：** 当我们组建团队时，我们在搜索体验方面相当保守。通过移除不相关结果来过滤查询在当时是一个相当激进的想法，因为传统观点认为你应该返回所有结果，然后依赖排序。


  自此以后，我们的成功鼓舞了我们。现在，我们在搜索者输入时就能提出结构化的查询建议。我们的最终目标是实现一个……



  ### “以实体为查询对象”的体验，其中所有查询均由标准化实体组成。


  ***第 5 章 | 丹尼尔·唐克朗，领英**


  我们还采用了更复杂的排序方法。并且我们越来越多地关注双面相关性方法，这反映了我们试图优化的人才市场。


  **古铁雷斯：** 你说的“标准化实体”是什么意思？为什么“以实体而非字符串”是最终目标？


  **唐克朗：** 在领英，我们的实体是人、公司、大学以及类似的事物。当然，人们会像使用其他搜索引擎一样在搜索框中输入字符串。但他们大多试图引用参与领英生态系统的实体——或者，正如我们喜欢称之为的“经济图谱”。


  “以实体而非字符串”的想法很简单。因为字符串旨在引用实体，那么让我们消除字符串与实体之间的不确定性障碍。这样做有助于实现更丰富的查询世界，在其中我们引入实体之间的关系——例如，被收购的公司、相似的职位名称——并提供对信息空间更具结构化和引导性的探索。谷歌和微软正通过他们的“知识图谱”项目开始在网络上实现这一点，但由于我们数据中固有的丰富结构，我们今天有能力提供这种体验。


  **古铁雷斯：** 什么是双面相关性搜索方法？你们如何优化它？


  **唐克朗：** 领英是一个大规模地将人才与机会连接起来的人才市场。一次成功的连接需要满足被连接的双方。仅帮助求职者找到梦想工作或帮助招聘人员找到理想候选人是不够的——工作或候选人必须是可实现的。最终我们遇到的是一个多目标优化问题，它既包含了搜索者的意愿，也包含了成功结果的可能性。


  **古铁雷斯：** 领英会员搜索什么？


  **唐克朗：** 领英会员搜索人、工作、公司以及各种类型的内容。对于某些职业专业人士，如招聘人员和销售人员，通过领英进行搜索是他们生计的核心部分。


  对于其他外向性较弱的专业人士来说，被找到意味着有机会获得意想不到的职业机遇。将这两个方面都做好，使我们能够最好地将人才与经济机会连接起来。


  **古铁雷斯：** 你们如何衡量一次搜索是否成功？


  **唐克朗：** 我们有几种衡量标准来评估搜索的成功与否。


  我们考察人们是否点击了结果，更重要的是考察他们在点击后采取的行动——例如邀请一个人建立联系或申请工作。我们也使用人工评判——但在评估高度个性化的搜索体验时，这只能起到有限的作用。


  ***工作中的数据科学家*** 89


  **古铁雷斯：** 领英如何个性化搜索体验？


  **唐克朗：** 你搜索体验的个性化主要取决于你个人资料中的信息，比如你的公司、地点、行业以及你的人脉网络。对于某些类别的搜索，人脉距离是一个特别重要的特征——例如，它有助于我们区分同名同姓的搜索结果。


  **古铁雷斯：** 搜索是你曾在不同职位和公司都从事过的工作。最初是什么让你对它感到兴奋，现在又是什么让你兴奋？


  **唐克朗：** 搜索是一个令人惊叹的问题，它总能不断带来新的挑战。当你初次接触它时，它看起来似乎很简单，就像 20 世纪 50 年代的信息科学家们可能认为的那样——当他们意识到仅仅通过单词索引文档不足以让它们被找到时，他们不得不发明“相关性”这个概念。搜索是信息经济的核心问题。信息就在那里，问题是我们是否能找到它。搜索之所以伟大，还在于它是一个充满开放问题的领域，其中许多问题都相当基础。


  也许五十年后搜索会变得乏味，但我对此表示怀疑。



  **Gutierrez：** 如果今天有人想入门搜索领域，他们应该怎么做？


  **Tunkelang：** 他们应该从参加一门信息检索课程开始，或者从线上和线下海量的可用资源中学习。考虑到搜索领域的开源技术，他们应该通过实践来学习——例如，为一个公共数据集实现一个基本的搜索引擎。入门搜索并不难。


  真正有趣的地方在于细节。排序仍然是一个开放的研究领域，尤其是在个性化和社交搜索应用中。而在探索新的搜索用户界面方面，则有更多的机会。


  我承认自己有偏见，但我会引导那些对搜索的未来感兴趣的人关注这些方向。


  **Gutierrez：** 你在谷歌从事的搜索工作具体包括哪些内容？


  **Tunkelang：** 我在谷歌领导过一个团队，负责将谷歌本地搜索索引（现在是谷歌+的一部分）中的商家与其官方主页进行映射。除了网络搜索索引外，谷歌还有一个本地搜索索引，旨在帮助人们找到本地商家。你可以把它想象成
  21 世纪的黄页。


  我们团队的目标是提高本地搜索的质量。我们通过将本地搜索索引与网络搜索索引进行映射来实现这一目标，以确定本地商家何时拥有官方主页，并将两者关联起来。


  *第 5 章 | 丹尼尔·坦克朗，领英*


  其结果在两个层面上都很有用。首先，我们可以在本地商家页面上提供一个指向其主页的链接。其次，我们可以改进这种关联，将其作为网络搜索相关性判断的一个信号，从而更好地确定用户的搜索意图是否是查找本地商家。当网络搜索确定这一意图时，通常会显示地图和其他与此类搜索查询相关的信息。这是一个有趣的机器学习问题，我们的准确性不仅提高了本地搜索页面的质量，还帮助谷歌判断用户何时在寻找本地商家，以便用地图和其他适当内容进行响应。


  当我加入谷歌时，已经有一个系统可以将商家映射到其主页上。那是一个机器学习系统——具体来说，它使用逻辑回归来为商家的候选主页进行评分。


  我无法透露具体数字，但该系统在精确度和覆盖范围上还有很大的提升空间。此外，该模型不稳定且难以解读，这使得对其进行渐进式改进的工作变得很困难。因此，我们决定探索其他方法，不仅要提高系统的准确性，还要为持续改进工作提供便利。


  关于我们的成果，我不能说得太多——根据我的保密协议，相关数据都是保密的。但我可以说的是，通过一系列改变，我们显著提高了准确性，其中包括将逻辑回归模型转换为决策树方法。这令人惊讶，因为决策树几乎算不上是前沿的机器学习模型。然而，它们非常易于解读，这种可解释性极大地帮助我们获得了洞察并进行了迭代。


  **Gutierrez：** 您是否发现，当非前沿模型被应用到新领域时，有时会比更新的模型表现更好？


  **Tunkelang：** 我并不是说非前沿模型工作得更好——实际上，我愿意相信机器学习的进步确保了相反的情况！准确地说，当你试图理解你的数据并为其迭代开发模型时，保持简单是值得的。在这些情况下，优先优化可解释性比追求准确性更好。一旦你尽可能多地学到了知识，你可以回到更复杂的模型上。那时，希望你已经拥有了正确的训练数据、目标函数和特征，从而能够充分利用机器学习领域最新、最伟大的成果。


  **Gutierrez：** 继续改进已经构建好的模型有多重要？


  **Tunkelang：** 对于替换模型和改进模型，没有特别的偏好。


  我们将大部分精力投入到收集更好的训练数据和提出新特征上。这通常需要我们训练新模型。存在一种复用现有基础设施的倾向，因为这通常工作量更小，并且有助于我们避免引入新的错误。但我们会尽力根据模型自身的优点来评估它们，即使这意味着需要做更多工作来利用新方法。


  *工作中的数据科学家* 91


  **Gutierrez：** 在这个项目中，你最引以为豪的是什么？


  **Tunkelang：** 我最自豪的是，尽管这个项目的大部分工作只有我们三个人在做，但我们所做的改变提升了极大比例的网络搜索查询质量。这听起来可能有些老套，但能致力于改善我母亲日常的网络体验，感觉非常棒。


  **Gutierrez：** 你们三个人是如何聚在一起从事这个项目的？这是谷歌的 20%项目之一吗？


  **Tunkelang：** 这是我们的本职工作，而不是 20%项目。我们被安排作为一个团队工作，因此我们完全负责这个项目。以前的开发者可供我们咨询，但大多时候，他们对我们在他们成果的基础上进行改进表示高兴，并乐意去从事新项目。我由衷地敬佩那些理解自己的产品会超越他们自身任期并持续发挥作用的开发者。


  **Gutierrez：** 用于改进本地商家搜索的模型是如何构建的？


  **Tunkelang：** 幸运的是，我们有一个现成的框架来比较不同机器学习方法的表现。我们尝试了许多种方法，根据一个黄金标准集来评估它们的准确性，以及它们的效率、稳定性和可解释性。最终，我们选择了使用决策树。


  我们原本预计从回归切换到决策树会牺牲准确性来换取可解释性和稳定性。但令我们惊喜的是，我们在这三个方面都取得了改进。而且，一旦我们有了决策树模型，开发新的模型特征就变得容易多了。


  **Gutierrez：** 关于替换已在生产环境中运行的模型，决策是如何做出的？


  **Tunkelang：** 无论是在谷歌还是领英，我们都会依据指标来做决策。如果一个改变只影响一个指标——或者影响多个指标但方向一致——那么决策过程就很明确：我们直接发布。


  更有趣的情况是某些指标上升而其他指标下降。


  理论上，我们使用一个单一的效用度量来评估整体影响。实践中，我们会协商这种权衡对业务而言是否为净正面。决策通常发生在拥有各种指标的团队层面，但在特殊情况下，这种权衡会被上报给能够协调相互竞争的业务目标的人。


  **Gutierrez：** 你从这个项目中学到了什么教训？


  **Tunkelang：** 我一直重视可解释性，但这个项目让我看到了它在机器学习背景下是多么至关重要。我还学到了很多关于处理不具代表性的训练数据所带来的挑战。虽然我们拥有大量的训练数据，但同时也存在系统性的偏差，这些偏差可能会诱使我们的机器学习模型对这些偏差进行过拟合。我们必须学会补偿这些偏差，并对任何看起来过于聪明的东西持怀疑态度。


  *第 5 章 | 丹尼尔·坦克朗，领英*


  **Gutierrez：** 你对系统性偏差、过拟合模型以及“过于聪明”与“工作得更好”之间的关系有何看法？


  **Tunkelang：** 我是奥卡姆剃刀原理的忠实信徒，在建模中，这转化为对最小描述长度的偏好。我更喜欢小型的、易于理解的模型，其中的系数使用的比特数越少越好。如果一个模型要变得更复杂，它必须在在线测试中证明自己更准确。而准确性的提升并不总能证明复杂性的增加是合理的，因为更复杂的模型在出问题时更难调试。



  '
- '# 关于系统性偏差与过拟合


  至于系统性偏差和过拟合，这始终是一个持续关注的问题。我们通过仔细审查收集训练数据的方法并考虑我们可能引入偏差的每一种方式来尝试预测它。最坏的情况是，当在训练数据上表现良好的模型在面对
  withheld 数据时失败，我们发现了训练数据中的偏差。然后我们利用这些失败来改进我们的收集过程。


  **Gutierrez：** 你会如何向不熟悉数据科学但熟悉数据科学领域的人描述你的工作？


  **Tunkelang：** 作为数据科学家，我们的工作是从噪声中提取信号。我们在许多环境下做这件事，从执行驱动业务战略的分析到启用像推荐系统这样的数据产品。在搜索质量的背景下，这意味着分析我们索引的内容以及搜索者与之交互的方式，以提供相关结果并改善搜索体验。


  **Gutierrez：** 在你的职业生涯中，到目前为止你最引以为豪的是什么？


  **Tunkelang：** 我和我的同事在`Endeca`所取得的成就是非凡的。我们帮助改变了人们对搜索的看法，我每天在浏览网页时都能看到这些影响。


  **Gutierrez：** 你是什么时候意识到你想以数据处理为职业的？


  **Tunkelang：** 我不确定是否有某个特定的时刻让我意识到这一点。


  我一直热爱数学和计算机科学。早期，理论比实践更吸引我，我痴迷于组合学和计算复杂性中的开放问题。但最终，我无法抗拒解决具有实际意义的问题，这使我专注于信息检索以及更广泛的数据科学领域。


  **Gutierrez：** 你是如何对数据处理工作产生兴趣的？


  **Tunkelang：** 我在`IBM`研究的一个问题是可视化通过对大型文档集合应用自然语言处理算法获得的语义网络。尽管我的重点是网络可视化算法，但我还是注意到自然语言处理算法有状态好和状态差的时候。如果原始数据充满噪声，仅靠可视化算法能做的事情是有限的。


  *《数据科学家在工作》* 93


  几年后，当我在`Endeca`时，我致力于术语提取的研究，并不得不亲自面对噪声问题。讽刺的是，我们最终将我们的术语提取算法授权给了`IBM`，作为我们为他们构建的搜索应用的一部分。


  **Gutierrez：** 你处理的第一个数据集是什么？


  **Tunkelang：** 我很遗憾记不起我的第一个数据集了，这听起来好像这不是一段深刻而有意义的经历！我确实花了大量时间研究一个路透社新闻语料库，来测试信息检索和信息提取算法。我在`Endeca`工作的一个好处是有机会处理我们客户的数据，尤其是在我们为新产品功能制作原型时。


  **Gutierrez：** `Endeca`的数据是客户数据这一事实如何影响你对数据的看法？


  **Tunkelang：** 拥有多样化的客户群很好，这样就能接触到许多不同的问题。但作为企业软件供应商，代价是我们与用户的关系总是间接的。所以我们不能简单地决定运行实验并观察其影响。


  **Gutierrez：** 是否有某个特定的“啊哈！”时刻让你意识到数据的力量？


  **Tunkelang：** 不确定是否只有一个时刻，但在我与数据的关系中有两个难忘的时刻。第一个是当我在研究一个数字图书馆时，我意识到我们可以通过算法回收作者提供的标签来显著改进文档标记。虽然作者用关键词和短语标记文章，但标记是稀疏且不一致的。由于这种标记方式，使用标签进行文章检索提供了高精度但低召回率。不幸的是，对标签进行全文搜索的替代方案提供了低得无法接受的精度。因此，我们开发了一个系统，基于作者提供的标签进行引导，从而改进了整个集合的标记。结果是在不牺牲精度的情况下，召回率提升了一个数量级。


  第二个是使用语言模型的熵计算来自动检测新闻存档中的事件。我们首先对存档进行实体提取，以检测命名实体和关键短语。然后，当我们执行搜索时，例如“iraq”，我们可以计算搜索结果的`language
  model`并追踪它在集合时间跨度内的变化。我们发现语言模型的突然变化对应着事件的发生。我只有机会用这个系统构建原型，但我确实有机会向“三字母机构”的人演示它们。


  ***第 5 章 | Daniel Tunkelang，LinkedIn***


  **Gutierrez：** 在鸡尾酒会上，你会如何向外行描述你的工作？


  **Tunkelang：** 如果你使用搜索引擎，你可能理所当然地认为搜索引擎知道你的意思并返回你正在寻找的内容。除非它没有做到，这时你会诅咒我们的“天网”统治者。我的团队致力于把你所说的——搜索框中的几个词——转换成你的意思，然后提供最相关的结果。例如，“ford”在“john
  ford”的语境中是姓氏，但在“ford engineer”的语境中是公司名称。我们通过从数据中学习来做到这一点。特别是，词语在我们的搜索索引中是如何被使用的，以及人们在搜索时是如何使用词语的。我们还根据人们是否与我们展示的结果互动来获得我们做对了的反馈。我们利用这些反馈来改进我们的算法，希望下次能做得更好。


  **Gutierrez：** 社交网络搜索中主要解决的问题类型有哪些？


  **Tunkelang：** 尽管有很多问题，但你可以用三个“R”来概括它们——相关性（`Relevance`）、推荐（`Recommendations`）和声誉（`Reputation`）。相关性显然出现在搜索质量的背景下，但也当我们向用户呈现信息流或流时，必须从无尽的可能性中选择有趣的条目。推荐是对搜索的补充。如果搜索相关性是关于给用户他们正在寻找的信息，那么推荐就是关于给用户他们需要但没有要求的信息。最后，声誉涵盖了广泛的问题，从识别主题专家到量化信任。


  **Gutierrez：** 你是否经常处理所有这三个问题，还是在特定时间只研究一个子集？


  **Tunkelang：** 这些天我几乎只专注于相关性。`LinkedIn`有其他团队更专注于推荐和声誉。尽管我专注于相关性，但我对所有三个领域的挑战都感到兴奋，并且我尽最大努力在公司内为我们在这方面的努力做出贡献。我也尝试通过博客和会议参与关于这些话题的全球对话。


  **Gutierrez：** 搜索和社交网络领域的主要思想领袖有哪些？




  **Tunkelang:** 这很难一一列举，尤其是在这些领域工作需要成为知识上的杂食者。我会阅读信息检索会议的研究论文，也会关注初创公司如何创新用户体验。身处全球最大职业社交网络中心的优势之一，就是新动态会通过多种渠道进入我的收件箱。


  ***工作中的数据科学家*** 95


  **Gutierrez:** 你如何决定读什么内容以及关注哪些初创公司？


  **Tunkelang:** 如今，我主要依靠我的职业社交网络来筛选信息。我当然会查看我的`LinkedIn`信息流。我也会关注我在`Twitter`上关注的人分享的内容。我还使用几个新闻聚合器——主要是`Techmeme`和`Prismatic`。因此，我能很好地平衡首页科技新闻和特定领域的信息，并尽力跟上。


  **Gutierrez:** 这些数据科学家处理的是哪些类型的数据？


  **Tunkelang:** 各种类型——文本、数字、点击、关系图谱、地理信息、时间序列以及类似的数据。在数据科学领域工作的挑战之一，就是你往往会处理许多不同类型的数据，而你的工作就是将它们整合在一起。


  **Gutierrez:** 有没有数据科学家尚未关注的数据？


  **Tunkelang:** 可能没有。但我认为，在改进可穿戴设备的数据采集方式方面还有很多工作要做，这样才能真正通过数据带来更好的生活。我希望有一个设备能追踪从我的身体活动到情绪的一切，并让我能从数据分析中获益，而无需冒暴露极度私密的个人数据的风险。我们正在朝着这个方向前进，但总体而言，可穿戴设备和传感器仍处于早期阶段。


  **Gutierrez:** 哪些资源对你的工作有帮助？


  **Tunkelang:** 因为我专注于搜索领域，所以我会跟进领先的信息检索会议，特别是由`ACM`主办的`SIGIR`和`CIKM`会议。我也会通过像`O''Reilly
  Strata`这样的会议，在大数据领域保持关注。我不再阅读特定的博客了。相反，我主要依靠`LinkedIn`和`Twitter`来向我推送相关的内容。我倾向于将书籍主要用作参考。幸运的是，一些最有价值的信息是永恒的。


  **Gutierrez:** 考虑到信息流转瞬即逝的特性，你不在办公室时如何追踪事物？


  **Tunkelang:** 可悲的是，我几乎从不上线，因为我有点信息成瘾。我最近确实断线了一周，结果接下来的大部分周末都用来追赶进度。尽管新闻聚合投入了那么多努力，但显然更侧重于提供实时信息流，而不是聚合几天甚至几周的信息。


  **Gutierrez:** 你典型的工作日是什么样的？


  **Tunkelang:** 我不确定是否有典型的工作日。总的来说，我领导着一个优秀的团队，然后把剩下的时间花在招聘和对外联络上。我的大部分时间是指导我非常有成就的团队——在我能增加价值的地方贡献价值，在我做不到的地方就放手让他们干。我也花很多时间在招聘和对外联络上。


  ***第 5 章 | Daniel Tunkelang,** LinkedIn*


  **Gutierrez:** 除了领导团队，你是否也亲自写代码？


  **Tunkelang:** 我有一段时间没写生产环境的代码了，但在我们试图诊断系统行为时，我仍然会查看代码和系统日志。


  也就是说，我确实很怀念写代码。当我有机会写代码时，比如最近给我女儿弄一些老派的游戏，我回想起让东西运行起来所带来的那种即时满足感是多么有趣。我很兴奋她将在成长过程中，用比我当年好得多的工具体验到同样的魔力。


  然而，我发现，虽然我软件开发做得还行，但实际上我更擅长领导软件工程师。我有幸招聘到比我优秀得多的开发者，我很荣幸能帮助他们取得伟大的成就。


  **Gutierrez:** 你的工作流程是怎样的？你如何看待和衡量成功？


  **Tunkelang:** 我们的工作分三个阶段进行。首先是假设生成。我们通过查看日志被动地提出假设，或者通过运用直觉主动地提出假设。其次是离线分析。我们使用历史数据、人工评判或其他一些代理方式来高效地测试我们的假设。我们的预期是大多数假设都无法通过离线测试——这就是零假设的用途。很重要的一点是，离线测试要快速且廉价，这样我们只对我们最有希望的假设进行在线测试。第三阶段是在线测试，我们实施产品变更来测试我们的假设，并针对真实流量对这些变更进行分桶测试。


  这三个阶段是并行发生的。在任何时候，我们都在进行假设生成、离线测试和在线测试的组合。可以把它看作是管理数据驱动创新的投资组合策略。


  **Gutierrez:** 你如何管理这个投资组合？


  **Tunkelang:** 对于投资组合管理，我们尝试用科学的方法，但在必要时会依赖直觉。例如，我们会花一个小时来决定某事是否值得花几天时间去研究。或者，一个人会花一周时间进行离线分析，来决定某事是否值得在我们进行在线测试之前，投入几个月的工程努力。基本原则是快速失败，并随着风险的降低而呈指数级增加投入。


  要对这个过程完全数据驱动是很困难的，因为不同的假设适用于不同的问题。但我们会适应。如果我们的大部分努力都失败了，那说明我们对风险不够敏感。如果所有努力都成功了，那可能我们过于规避风险，从而把重大机会留在了桌上。没有简单的方法来衡量假设的数量，因为我们从不同的粒度层次探索它们——从是否应该改变相关性调优参数，到用户是否会对新功能感兴趣。


  ***工作中的数据科学家*** 97


  **Gutierrez:** 你使用哪些具体的工具和技术？


  **Tunkelang:** 我们使用数据科学领域惯用的技巧——机器学习模型、`A/B`测试、众包评估、数据收集以及类似的技术。最重要的是，我们会在聚合层面之下查看数据和日志。只查看聚合数据是很容易偷懒的——例如，因为一个机器学习模型在平均性能上表现更好就偏向它。


  深入分析差异并查看具体案例，往往能让我们真正理解背后的情况。


  **Gutierrez:** 你对哪种新兴工具最感兴趣？


  **Tunkelang:** 我不确定它是否还算新兴，但我对“人类计算”感到非常兴奋。我无法想象今天的数据科学没有众包来进行数据收集和评估是什么样子。例如，我正在使用`Duolingo`学习意大利语，这是一款免费的语言学习应用，它同时也是一个众包文本翻译平台。人类计算仍处于早期阶段，我预计在未来几年，我们将会看到更强大的应用。


  **Gutierrez:** 你提到了深入分析以真正理解一个模型。你如何衡量真正的理解？




  **Tunkelang:** 我不了解用于理解（understanding）的量化指标，但理解的后果很容易量化。当我们意识到一个模型能提升某个用户群体的性能，却损害其他群体的性能时，我们就有了一个起点去探究原因。但愿最终我们能得到一个更丰富的模型——或者可能是两个不同的模型——从而更好地服务这两个群体。理想情况下，随着我们更深入地理解各个群体的区别以及从中获得的、可推广到整个用户群体的洞察，我们会学到更多。


  **Gutierrez:** 你如何向公司内的其他团队传达你的成果？


  **Tunkelang:** 我们如何向公司其他部门展示和沟通工作成果，情况各不相同。我们会向从事类似相关性和数据科学问题的同行做演示。但有时我们与团队的合作更紧密，因为我们的工作高度相关。例如，滥用搜索引擎优化团队与欺诈团队之间存在关联。我们学到的一件事是：沟通再多也不为过。从来没有人抱怨他们获取同行工作信息的渠道太多。


  **Gutierrez:** 你在之前的回答中提到了日志。你们有用于查看这些日志的系统吗？


  **Tunkelang:** 我们有一系列内部报告工具，用于常规的日志分析。当这些工具不够灵活时，我们会使用像 `Hive` 或 `Pig` 这样的工具来执行临时分析。当然，这个过程的关键部分是我们对一切进行检测和追踪。我们构建了许多开源工具来支持日志记录需求。我强烈推荐一篇由
  LinkedIn 的 Jay Kreps 撰写的文章，标题是“`The Log: What Every Software Engineer Should Know
  About Real-Time Data’s Unifying Abstraction`”。他将其作为博客文章发布，但它更像是关于该主题的权威著作。


  **Gutierrez:** 在项目的生命周期中，你的工作如何演变？


  **Tunkelang:** 在早期，我们的目标是快速失败。大多数疯狂的想法确实就是疯狂的。因此，在最初阶段，重要的是要有高效的方法基于数据来否决坏想法——例如，通过分析日志来设定某个变更影响的上限。但是，当一个假设通过离线测试显示出前景时，我们就会加大投入。我们的重心从试图扼杀它转变为让它成功。我们优化参数设置，然后寻找边缘案例和相关技术来改进和理解模型。由于这种重心的转变是剧烈的，因此只对那些通过了严苛验证筛选的想法进行这样的转变是很重要的。


  **Gutierrez:** 你如何区分疯狂的想法和新颖的想法？


  **Tunkelang:** 这很难。如果有人相信一个想法，我们总会给那个人机会尝试用数据来支持它。在这个过程中，一个关键问题是，在我们否决这个想法之前，允许他们进行多少次尝试来证明这个模型值得研究。到了某个时候，我们会依靠自己的判断，认为我们已经穷尽了可能性空间。或者我们只是失去了耐心。有时，当我们有了新的见解时，我们也会从“停尸房”里复活一些想法。


  **Gutierrez:** 你如何跟踪“停尸房”里所有的想法？


  **Tunkelang:** 坦率地说，我们依赖联想记忆。我们中的一些人有一些我们从未真正放弃的想法，所以不需要太多触发因素就能再次想起它们。如果出现了新信息，为令人信服的案例提供了素材，那么这个想法的原始倡导者就很容易证明应该再给这个想法一次机会。我们可能是数据驱动的，但我们的想法源于热情。


  **Gutierrez:** 你从哪里获得研究和分析的想法？


  **Tunkelang:** 在很大程度上，我依靠自己的直觉和经验。我鼓励我的同事也这样做。虽然我们对实验采取了严谨的数据驱动方法，但我们常常依靠自己的创造力来找出哪些假设值得探索。当然，有时用户通过向我们提供反馈或在日志中表现出异常行为，让我们更容易找到方向。


  **Gutierrez:** 你是如何培养自己的直觉的？


  **Tunkelang:** 我的直觉主要来自于接触大量不同的问题。随着时间的推移，你学会了识别模式。直觉实际上是一个训练有素的关联网络。


  **Gutierrez:** 你如何选择要解决的问题？


  **Tunkelang:** 我首先根据乐观的假设思考潜在的影响。如果我们交付一个最优解，会有多少人关心？这个最优解比我们目前的方案好多少？我试图找到正确的影响度量指标并设定一个上限。如果这个上限不够高，那么这个问题可能就不值得解决。然后，我试图对预期影响做出更保守的假设。如果我们只从目前的位置前进到最优解的一半，是否仍然值得？如果只前进到
  10% 呢？如果更保守的假设让我犹豫，那么我会尽量使我们的机会分析更加严谨。最后，我试图估算验证我们的假设需要多少工作。不是解决问题需要多少工作，而是消除项目成功方面的大部分不确定性需要多少工作。我强烈倾向于那些能够快速降低不确定性的项目。有时这意味着快速失败，有时则意味着早期的成功承诺。


  **Gutierrez:** 你如何看待自己是否在建模正确的对象？


  **Tunkelang:** 正如 George Box 所说：“所有模型都是错的，但有些是有用的。”让模型尽可能逼真是很有诱惑力的，但我努力抵制这种诱惑。我宁愿要一个简单且易于解释的模型。当然，使用简单模型意味着必须考虑将它们与现实混淆的风险。例如，当我在研究搜索质量时，容易将点击建模为一次成功的搜索，将放弃搜索结果页面建模为一次失败的搜索。但并非所有点击都是成功的。例如，搜索者可能需要点击来查看更多信息，以确定某个结果是不相关的。另一方面，并非所有放弃的搜索都是失败的。例如，搜索者可能对搜索结果摘要中显示的信息感到满意。因此我们努力牢记，模型不应该是照片级真实的。相反，它们给了你一些足够接近现实的东西，使之成为一个合适的代理，同时又足够简单，以便被度量和优化。而且，只要我们诚实地使用模型，并睁大眼睛留意其与现实的明显偏离，我们的模型通常会善待我们。


  **Gutierrez:** 你如何看待自己是否拥有正确的数据？


  **Tunkelang:** 常识无可替代。你必须查看你拥有的所有数据，并与你没有的数据进行对比验证。例如，如果你的数据告诉你，最受欢迎的技能都集中在某个特定行业，你应该检查以确保你的数据没有过度代表那个行业。我们大多数人都能识别并嘲笑那个在路灯下找钥匙的醉汉的寓言，因为那里有光。但这种情况我们一直在做。作为一个行业，我们使用手头的数据，优化我们能衡量的东西。这并非完全是坏事。这比试图在没有数据的情况下工作，或者试图改进我们无法衡量的东西要好得多。尽管如此，保持一点谦逊会大有裨益。如果我们的数据告诉了我们一些看似不可思议的事情，正确的反应是怀疑。毕竟，“不可思议”（`incredible`）在拉丁语中的意思是“不可信的”。




  **古铁雷斯：** 技术选择在解决问题中扮演什么角色？


  **通凯朗：** 技术显然很重要，选择技术栈是软件工程师或数据科学家做出的最大决策之一。错误的技术选择可能成为主要障碍，因为它常常导致笨拙的变通方案。


  仅凭技术选择本身不太可能解决任何问题。技术就像健身器材，除非你善加利用，否则购买最花哨的设备也不会让你变得健康。因此，始终要将人才置于技术之前。先组建合适的科学家与工程师团队，然后确保技术不会阻碍他们。


  **古铁雷斯：** 你在招聘时看重什么？


  **通凯朗：** 我考察候选人三个方面。首先，他们需要是聪明、有创造力的问题解决者，不仅具备分析能力，还要知道如何以及何时运用这些能力。其次，他们必须是执行者，并展示出使用适当工具构建解决方案的能力与热情。第三，他们需要有足够的**产品直觉**——无论是来自本能还是经验——以便在其将要应对的问题领域中导航并提出正确问题。


  **古铁雷斯：** 你说的"产品直觉"是什么意思，为什么它很重要？


  **通凯朗：** 所谓"产品直觉"，我指的是从用户及其他利益相关者的视角看待实际问题的能力。例如，计算机科学家可能会设计一个通过正负反馈来改进的系统。但有产品直觉的人会思考：是什么因素能激励用户向系统提供这种反馈？在商业层面，有产品直觉的人会用这种直觉来指导关键业务指标——比如判断推荐系统在什么情况下给出的建议差到不仅让用户不点击，还会带来额外成本。


  产品直觉是数据科学家的关键技能。没有产品直觉，你可能是优秀的软件工程师和统计学家，但很可能无法确定要解决的正确问题，或选择评估解决方案的恰当指标。最后，产品直觉还能帮你找到捷径，比如让用户协助你解决问题。


  ***工作中的数据科学家*** 101


  有些人似乎天生具备这种直觉，或许它是应用型同理心的一种形式。


  你可以通过研究多种学科（尤其是社会科学）以及处理大量不同的现实问题来显著提升它。


  **古铁雷斯：** 你如何考察创造力？


  **通凯朗：** 关于创造力，我们通过向候选人询问我们曾处理过的开放式问题来评估。优秀的候选人能发现我们走过的某些路径。最出色的那些则会用我们未曾想到的想法给我们带来惊喜。有时他们会加入我们，共同解决这些问题并完善这些想法。


  **古铁雷斯：** 在领英工作是否让招聘变得更容易？


  **通凯朗：** 找到兼具合适技能与态度的人极其困难。我们已竭尽全力优化招聘流程来识别他们。然而，仅仅找到他们还不够，因为这些顶尖人才通常手握所有硅谷知名公司的录用通知。因此，与他们交流时，我会尽力了解他们的职业抱负，以及我们能否通过领英的机会来实现这些抱负。招聘是一个竞争极其激烈的过程，尤其在硅谷，但这也是一件非常激动人心的事。


  **古铁雷斯：** 你期望候选人具备什么样的态度？


  **通凯朗：** 当然是对解决问题的热情，但也需要一种谦逊——将工作的价值置于个人自我之上。我共事过的最优秀的人对工作怀有非凡的自豪感，但将自我意识置于门外，这一点在我们团队协作或与其他团队合作时尤为重要。




  **古铁雷斯：** 您如何发掘潜在员工的职业抱负？


  **通克兰：** 我当然会直接问他们。但大多数人连晚餐想吃什么都要纠结半天，更别说想清楚五年后自己的职业生涯会走向何方了。所以我尽量描绘出不同的职业发展轨迹图景，看看哪种能引起他们的共鸣。


  **古铁雷斯：** 在招聘时，您如何评估一个人的技术经验？


  **通克兰：** 我会询问他们参与过的项目以及项目中使用的工具。我关心的不是他们用过哪些技术，而是他们是否做出了明智的选择。我寻找那些在需要时能够适应新技术的人——无论是学习一门新的编程语言，还是基于新的计算框架进行构建。


  *第 5 章 | 丹尼尔·通克兰，领英*


  **古铁雷斯：** 您在他人的工作中寻找什么？


  **通克兰：** 我很乐意找到那些对问题有良好品味的人。对我来说，有价值的问题比巧妙的解决方案更有趣。作为数据科学家，我们确实处于改变世界的位置，因为我们可以改善人们的健康和福祉，优化资源配置，指导更好的政策决策，以及解决其他类似的有价值的问题。


  那些致力于解决鼓舞人心问题的人激励着我。杰夫·哈默巴赫曾说过：“我们这一代最聪明的头脑都在思考如何让人们点击广告。这真糟糕。”我完全同意，所以这就是为什么我建议人们应该把他们最好的天赋用在有价值的问题上。


  **古铁雷斯：** 要做好数据科学工作需要什么？


  **通克兰：** 希拉里·梅森和克里斯·威金斯说得最好：数据科学家是获取、清洗、探索、建模和解释数据的人。1 这意味着，正如德鲁·康威在他的数据科学韦恩图中表达的那样，数据科学家需要具备黑客技能、数学和统计学知识以及领域知识。2
  而且，也许最重要的是，数据科学家需要具备强大的批判性思维能力以及健康的怀疑精神。


  **古铁雷斯：** 在为您的小组招聘和培训人员时，您如何教导或指导他们培养这些技能？


  **通克兰：** 失败是一位好老师。我在大学里最好的学习经历之一是根据一篇论文实现一个算法，结果发现它的性能并不如声称的那样。我联系了作者，他们告诉我是如何针对论文中的每个例子调整他们的系统的。在克服了最初愤慨的反应之后——毕竟我为自己的竞争方法工作了几个月——我意识到我学到了重要的一课：不要相信在同行评审的出版物中读到的一切。


  正如 W. 爱德华兹·戴明据称说过的那样：“我们信靠上帝。其他人请带着数据来。”


  在科学领域，默认假设是零假设，它将证据的负担放在了你试图证明的假设上。这些都是同一主题的不同变体——如果它好得令人难以置信，那么在你能用数据支撑你的信念之前，不要相信它。告诉人们要保持怀疑既容易又重要，但我怀疑这不足以克服我们的认知偏差。在这种情况下，经验不仅是最好的老师，而且可能是唯一的老师。


  1. 希拉里·梅森和克里斯·威金斯，《数据科学分类法》（2010 年 9 月 25 日：[www.dataists.com/2010/09/a-taxonomy-of-data-science/)](http://www.dataists.com/2010/09/a-taxonomy-of-data-science/)。

  2. 德鲁·康威，《数据科学韦恩图》（2010 年 9 月 30 日：[`drewconway.com/zia/2013/3/26/the-data-science-venn-diagram`](http://drewconway.com/zia/2013/3/26/the-data-science-venn-diagram)）。


  *《工作中的数据科学家》* 103


  **古铁雷斯：** 目前谁的工作激励着您？


  **通克兰：** 也许不是你想的那样，但我受到比尔·盖茨的启发。


  具体来说，我深受他数据驱动的慈善方式的启发。


  当然，看到世界上最富有的人之一捐出几乎全部净资产来让世界变得更美好，令人感到谦卑。但真正鼓舞人心的是他做事的方式。他专注于可衡量的改进，并根据其产生最大可衡量利益的地方来优化他的慈善事业。这使他不仅仅是一个伟大的人——也使他成为一名伟大的数据科学家。


  **古铁雷斯：** 您会给刚起步的人什么建议？


  **通克兰：** 这取决于他们的背景。对于来自数学或物理科学领域的人，我建议投资学习软件技能——尤其是`Hadoop`和`R`，它们是最广泛使用的工具。


  来自软件工程领域的人应该上一门机器学习课程，并做一个使用真实数据的项目，很多数据都是免费提供的。正如许多人所说，成为数据科学家的最佳途径就是去做数据科学。数据就在那里，科学本身也不难学，特别是对于受过数学、科学或工程训练的人来说。


  **古铁雷斯：** 刚起步的人应该努力深入理解什么内容？


  **通克兰：** 阅读《数据的非理性有效性》——谷歌研究人员阿隆·哈勒维、彼得·诺维格和费尔南多·佩雷拉的经典文章。3 这篇文章通常被概括为“更多的数据胜过更好的算法”。全文值得一读，因为它概述了近期利用网络规模数据改进语音识别和机器翻译的成功案例。然后，为了更加全面，听听莫妮卡·罗加蒂关于更好的数据胜过更多数据的见解。4
  理解并内化这两个见解，你就踏上了成为数据科学家的正确道路。


  **古铁雷斯：** 在您看来，教育机构应该教授哪些必要的批判性思维和分析技能？


  **通克兰：** 任何人高中毕业时都应该对科学方法有扎实的基础——即假设检验和可证伪性的基本概念。对概率和统计学的基本知识也应如此。


  在我们被数据和数据分析轰炸的世界里，我们应该成为明智的消费者。当然，每个人都应该学习计算的基础知识——至少要足以揭开我们周围计算机的神秘面纱。


  3. 阿隆·哈勒维，彼得·诺维格，和费尔南多·佩雷拉，《数据的非理性有效性》（2009 年 3/4 月，《IEEE 智能系统》[www.computer.org](http://www.computer.org/)：[www.cs.columbia.edu/igert/courses/E6898/Norvig.pdf](http://www.cs.columbia.edu/igert/courses/E6898/Norvig.pdf)）。

  4. 莫妮卡·罗加蒂，《模型与火车事故：训练数据指南》（O''Reilly Strata 2012：[www.youtube.com/watch?v=F7iopLnhDik](http://www.youtube.com/watch?v=F7iopLnhDik)）。


  *第 5 章 | 丹尼尔·通克兰，领英*


  特别是对于数据科学，我认为学习数学、软件工程以及至少一些社会科学（如经济学或社会学）的混合知识是很有帮助的。最优秀的数据科学家是全面发展的，能够结合理论、实践以及关于事物（尤其是人）在现实世界中如何运作的直觉。


  **古铁雷斯：** 数据科学的未来是什么样子？


  **通克兰：** 正如尼尔斯·玻尔所说：“预测非常困难——尤其是关于未来。”我看到当前有一些令人兴奋的发展——人们越来越意识到数据驱动决策的价值，并认识到数据在产品开发中的关键作用。我乐观地认为这一趋势将持续下去，数据将在组织中发挥其应有的主要作用。




  未来会是什么样？随着可穿戴计算成为主流，我们无疑会看到新的数据来源。就在几年前，“量化自我”运动还像是未来主义者的边缘话题。如今，它正稳步迈向一个十亿美元级别的市场。我们有望看到医疗保健领域采用更多以数据为导向的方法。更广泛地说，我希望任何致力于解决棘手问题的人都能更容易地找到有助于解决问题的数据。


  **古铁雷斯：** 你认为数据科学的工作流程将如何变化？


  **通克兰：** 目前，大数据工具的专业技能仍然相当小众。我认为这是一个过渡阶段，我们今天称之为“大数据”的东西，明天将仅仅是“数据”。我们会找到方法隐藏那些杂乱的细节，这样，在
  PB 级数据上进行简单分析的学习曲线，就不会与今天学习使用 Excel 有太大差异。然而，即使技术变得更强大、更高效，科学本身也不会变得更简单。关键在于，我们的教育机构必须向下一代数据科学家传授必要的批判性思维和分析技能。


  **古铁雷斯：** 你希望看到哪些数据集被开发出来？


  **通克兰：** 健康与福祉是我期待看到相关数据集生成的激动人心的领域。在更好地理解营养、运动、睡眠以及类似的个人过程方面，还有很多机会。当然，这些领域也引发了对个人隐私的关键担忧。但我确信，能够找到一种方法，在开发数据集以推动科学进步的同时，采取必要的预防措施来保护那些被收集数据的人。


  **古铁雷斯：** 你认为数据科学领域需要解决的一个问题是什么？


  *《工作中的数据科学家》* 105


  **通克兰：** 一个问题？问题太多了！数据应该帮助我们做出更好的决策。正如我们从赫伯特·西蒙、丹尼尔·卡尼曼以及其他许多人的工作中所了解到的，人类在做出理性决策方面非常糟糕。数据科学家应该致力于在数据需要与人类非理性抗衡的任何地方改进决策过程。


  **古铁雷斯：** 有什么事情是相对少数人知道，但你认为未来会变得非常重要的？


  **通克兰：** 到现在，知道丹·艾瑞里所说的“可预测的非理性”的人应该不止是少数了。他和丹尼尔·卡尼曼的书都是畅销书。然而，我几乎看不到任何证据表明人们正在应用他们应该从这些书中获得的见解。


  我们在做大多数决定时，都没有意识到那些玷污我们决策过程的认知偏见。事实上，这样做本身就体现了一种过度自信的偏见。


  随着软件在我们的日常生活中扮演越来越重要的角色，我希望它能介入到部分决策过程中。我们的电脑、移动设备以及基于网络的服务是我们许多日常决策的见证者。


  我期待有一天，这些设备能在帮助我们做出更好决策方面发挥更积极的作用。


  **古铁雷斯：** 你改变主意最大的一件事是什么？这种改变是如何发生的？


  **通克兰：** 当我还是个学生时，我理想化了理论工作。我的志向是成为一名为理论数学和计算机科学做出贡献的教授。部分原因可能是因为这些问题非常困难，而我把困难等同于价值。


  随着年龄的增长，我的价值观受到了经验的熏陶。我仍然对理论家们的敏锐才智深表敬意，但我更钦佩那些带来实际影响的人。事实上，那些能为重要问题找到简单解决方案的人尤其令我印象深刻。有时候努力工作是有必要的，但重要的是结果，而不是付出的努力。


  我自己也努力按照这些价值观来生活。我的目标是用最少的努力产生最有价值的结果。如果在此过程中我必须解决难题或做出理论贡献，那么只要结果好，手段就是可以接受的。


  **古铁雷斯：** 你从与数据打交道的过程中发展出了哪些个人哲学或理论？


  **通克兰：** 不确定这是否算个人哲学，但我倾向于假设任何看起来有趣的东西都可能是错的。尽管我这么假设，我还是会去查看它，因为有时候它确实非常有趣，而在那些情况下，它可能会极其有趣。


  ## 第 章


  ### 约翰·福尔曼


  #### MailChimp


  **约翰·福尔曼**是火箭科学集团（Rocket Science Group）的首席数据科学家，该公司旗下拥有 `MailChimp.com`、`Mandrill.com`、`TinyLetter.com`
  以及其他十二个与电子邮件相关的网页和移动应用。火箭科学集团是一家电子邮件发送公司，专注于为从个人到跨国公司的各种团体和企业提供交易邮件、营销邮件和新闻邮件。


