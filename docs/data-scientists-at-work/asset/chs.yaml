- '# 第 15 章 | 埃里克·乔纳斯，神经科学研究


  可惜，就目前而言，我认为围绕神经科学工具创办一家初创公司行不通。即使我能完成像记录 10 亿个神经元这样引人注目的壮举——我认为所有人都承认这将是过去 50 年神经科学领域最大的突破之一——这项工具的总潜在市场也仅能覆盖大约
  20 个实验室。这些实验室如果运气好的话，每年能从`NIH`获得数百万美元的资助。这不是一个能支撑起大公司的市场。我希望它是——但可惜，并不是。


  **古铁雷斯：** 你在 Prior Knowledge 公司时，典型的一天是怎样的？


  **乔纳斯：** 在`P(K)`公司，根本不存在所谓的“典型一天”。作为 CEO，意味着我要与客户打交道、管理团队、掌控产品愿景，并应对投资者。这些职责和日常工作内容随着我们在
  18 个月内从创意到执行再到被收购，变化非常迅速。每一天我都要处理所有这些领域的事务，不知不觉中，一整天就过去了。有时候我会觉得自己什么都没做。毕竟，作为麻省理工出身的人，我过去习惯用写了多少方程、提交了多少行代码来衡量一天的工作，所以这非常艰难。有些周末我会去办公室写代码，因为我实在太想念做实际技术工作的感觉了。


  我的一位极其聪明的朋友亚历克斯·雅各布森，他曾是 Founders Fund 的驻场企业家，也是最初引荐我们的人。有一次他对我说：“你再也没机会做新的技术工作了，因为现在所有人都知道你能管理技术人员，而从很多方面来看，这是一项更有价值的技能。大多数人不知道如何评估技术人员，或如何说服他们做任何事。所以，你能管理一群
  24 岁的年轻人，并让他们做出实事，这就是所有人希望你做的事。” 这让我有点沮丧，因为我不想被定型，从而远离技术工作。


  我能在 CEO 这个位置上坚持下来，唯一的原因是团队非常出色。我的联合创始人博·克罗宁负责产品方面。我的联合创始人维马尔·巴洛迪亚处理所有`COO`类型的工作、规划和执行。我的联合创始人马克斯·加斯纳负责所有事务性工作，并和我一起外出路演筹资。联合创始人卡普·佩楚拉特，我在爱达荷州高中时最好的朋友，是我们的首席架构师。所以，这真是一群非常棒的人，帮助我度过了那段时期。我们最初招聘的两个人——伯克利本科毕业生乔纳森·格利登和卡内基梅隆大学博士弗里茨·奥伯迈耶——也非常出色。那是我第一次真正管理那些明显比我聪明得多的人。每天工作结束时，发现他们取得了多少技术进展，总是令人无比欣慰。


  **古铁雷斯：** 你在 Salesforce 公司时，典型的一天是怎样的？


  **乔纳斯：** 在 Salesforce，我们的很多挑战围绕整体集成、与现有系统的集成以及与客户沟通展开。这让生活少了许多忙乱。任何大公司内部的挑战都与初创公司截然不同，因为其激励机制大相径庭。在初创公司，你可以行动得非常迅速。Facebook
  的“快速行动，打破常规”的信条在初创公司行得通，因为你打破常规时没人在乎——因为你通常只有四个客户，而且很可能还是通过朋友的朋友或风险投资家的朋友认识的。所以，如果你搞砸了，可以打电话给
  CEO 道歉。在大公司里，你不能这么做，所以这更像是学会如何在复杂环境中周旋，并理解如何参与这场游戏。


  尽管结构不同，但这对我个人和团队来说仍然是一个重要的挑战。我认为我们成功完成了任务，证据就是大多数团队成员甚至在一年之后仍然留任。


  **古铁雷斯：** 你现在做研究，典型的一天是怎样的？


  **乔纳斯：** 大多数早晨醒来后，我会去菲尔兹咖啡店，在那里坐几个小时，写代码或者读论文。这些天，我比以往任何时候都更努力地捍卫大块的完整时间。我发现，如果我想完成任何技术工作，我需要连续四个小时不受打扰。否则，工作就根本完成不了。哪怕只是一个
  15 分钟的电话，都能彻底毁掉这四小时。


  作为一个没有行政支持或团队协作的独立研究员，这有点艰难。回到家后——哇——账务文书工作并没有神奇地自动为我处理好。所以，我目前面临的最大挑战是，如何在完成行政任务的同时，还能保持技术上的产出。同样，出差也会阻碍技术上的产出。


  比如，我下周要回麻省理工学院。再下一周，我们要在 COSYNE 会议上举办一个研讨会。之后两周，要去冰岛参加一个机器学习会议，然后还要去哥本哈根参加另一个。这些小事太容易一点一点吞噬掉你试图保持技术产出所需要的时间了。我认为这常常就是为什么在学术界，真正干活的是研究生和博士后。首席研究员身负那么多职责，根本不可能坐下来做真正的技术工作。


  **古铁雷斯：** 作为一个博士生，你如何看待和衡量成功？


  **乔纳斯：** “很糟糕”是我能给出的最诚实的答案。我还没见过哪个研究生不犯混淆投入和产出的错误，尤其是在实验科学领域。我们认为，因为我们早上九点到实验室，一直待到午夜，整天坐在电脑前，甚至可能真的在写代码而不是在刷新
  Reddit 或 Hacker News，我们就是高效的。我们工作非常努力，并认为这就是成功的。我们会说：“我已经 48 小时没睡了！”然后大家都惊叹：“哦——”。大家很容易认为这就是重要指标，而不是你写了多少篇论文，或者你离真正毕业还有多远。所以，在研究生院，我对于成功的看法和衡量标准并不理想。


  **古铁雷斯：** 作为一个初创公司 CEO，你如何看待和衡量成功？


  **乔纳斯：** 幸运的是，在业界，尤其是在初创公司世界里，人们不会让你侥幸持有那种看法或衡量标准。如果你拥有一群聪明的同事一起工作，就像我当时那样，所有传统的初创公司虚荣指标都会被忽略，转而关注一个根本问题：“有收入进账吗？”这个成功的衡量标准才是最重要的，尤其是在你拿了风险投资的情况下，因为资金流出的数字通常非常大。所以对我们`P(K)`公司来说，首要关注点是：有多少客户正在用我们的系统做实事，并为此付费？当然，在我们项目非常早期的时候，我们曾采取错误的成功衡量方式，过于关注技术性问题，比如：系统正常运行时间是多少？处理一个任务需要多久？我们的预测准确率是多少？等等。


  然而，我们很快意识到，没人在乎这些。真正重要的是谁在实际使用并为之付费。


  例如，到处都在谈论预测分析。Kaggle 之所以变得如此重要，是因为似乎每个人都认为预测准确率至关重要。



