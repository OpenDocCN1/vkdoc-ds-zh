- '# 总体来看，该项目经历了一系列步骤，并在过程中遇到了问题并找到了解决方案。随着我们取得进展，问题变得越来越小，但归根结底，这仍然是一个需要解决的非常大的问题。这是一个我引以为傲的项目，因为我构建了它的大部分内容，而且我们现在每天都在运行它——尽管最初它运行时需要很长时间。


  **古铁雷斯:** 它的运行时间长是因为它是一个原型吗？


  **莱纳汉:** 它是用`Java`编写的，因为我们知道它必须具有非常高的性能。所以我们构建了原型来证明它是可行的并且可以扩展。一旦我们证明了它能工作，尽管运行时间很长，我们就把它交给了工程团队，因为这里面也涉及大量的配置。那时，由于它的性能还不够理想，我们让一位年轻的天才工程师把它变得非常快速和高效。


  **古铁雷斯:** 数据是如何存储的？


  **莱纳汉:** 对于 PlaceIQ 来说，这是一个非常重要的、涉及两个方面的关键问题。第一个方面，也是优先事项，是以能够最大程度保护人们隐私的方式存储非常敏感的位置数据。我们最不希望发生的事情就是出现数据丑闻。当我们讨论位置历史记录与地理空间层进行大规模连接时，我们实际上从未存储过设备
  ID（`device ID`）。即使我们在使用设备 ID 时已经对其进行了混淆和哈希处理，我们也会格外谨慎，永远不实际存储它们。


  在数据摄入时，我们会从广告请求日志中获取位置和设备 ID。


  然而，一旦我们将其与基础数据层连接起来，我们就会丢弃具体的位置信息。因此，数据以混淆后的设备 ID、上下文和时间戳的格式存储。例如，存储格式为`device123/Walmart/Wednesday,
  December 17, 3 P.M.`。请注意，在这种格式中，我们并未指定是哪家沃尔玛，只知道这是一个沃尔玛。我们从不存储关于具体是哪个沃尔玛的任何信息；所以我们不知道这个沃尔玛是旧金山地区的、纽约地区的，还是其他地方的。


  对于我们的任何衍生数据，我们始终非常谨慎，绝不存储任何类型的标识符——例如设备 ID、IP 地址或类似数据——以及任何原始位置数据。我们在这些数据集之间保持着非常严格的信息隔离。因此，我们的数据存储为设备
  ID 及其所处的上下文，但并非设备的确切位置。我们的规则是专门制定的，以便我们仅根据上下文和时间进行查询。


  **古铁雷斯:** 那么第二个方面呢？


  **莱纳汉:** 第二个方面本质上纯技术性的，因为我们所使用的数据规模庞大。因此，思考如何存储、检索和分析这些数据对我们来说至关重要。目前，我们的整个基础设施都托管在亚马逊的
  S3（`Amazon''s S3`）服务上。一个月内，我们将迁移到一个托管数据中心设施。这个托管数据中心将有助于存储非常敏感的位置数据。


  从技术上讲，所有数据都将存储在 Apache 的 Hadoop 分布式文件系统（`Apache''s Hadoop Distributed File System
  [HDFS]`）中。


  **古铁雷斯:** 随着团队扩大，你们在寻找什么样的人才？你们又如何判断他们是优秀的？


  **莱纳汉:** 当我们寻找人才时，我们寻找的是那些充满热情并且具有定量思维能力的人。尽管我们在这里大量使用 Hadoop，但成为 Hadoop 专家并不是一项工作要求。我们希望人们能够以逻辑、科学和定量的方式思考问题。


  我们希望他们能够准确识别什么有效、什么无效。同时，我们也希望他们能够理解为什么某些事情行不通，即使他们最初以为行得通。具备自我批判精神非常重要。


  我们的面试流程更多是探讨他们如何思考，而不是问“你如何在 map-reduce 框架中实现这个特定的图算法？”对于我们的数据科学团队，我们更看重原始能力而不是特定技能。无论是招聘初级还是高级职位，我们都在寻找那种具备定量分析能力的人。我们曾招聘过编程或软件工程经验很少的初级员工，他们必须在工作中学习这些技能，而现在他们正在编写出色的代码。因此，根据原始能力而不是特定经验来招聘，对我们来说完全没有问题。话虽如此，我们偶尔也需要非常专业的人才来处理非常专业的任务，但这在我们通常的招聘实践中属于例外情况。


  **古铁雷斯:** 目前你们的工作流程中是否有让你们感到兴奋但尚未使用的工具？


  **莱纳汉:** 我们正在关注的技术之一是`Julia`。数据科学团队中某位同事正在负责的一个项目，就是研究我们可以在工作流程的哪些环节使用`Julia`。目前，由于我们使用亚马逊的服务，我们需要为计算时间付费。因此，我们肯定希望尽可能降低计算成本。一旦我们迁移到托管数据中心，这方面的担忧会减轻，但我们仍然希望缩短计算时间。


  我们每月要运行数百亿次流程。当你在广告请求日志上运行算法时，即使像将经纬度转换为图块（`tile`）这样简单的操作，也会对计算时间和成本产生巨大影响。在我们的工作中，进行这类微小的改变非常重要，因此我们总是在寻找性能更优的数值计算技术。


  `Julia`在这方面看起来非常有前景，所以我们专门安排了一个人研究如何将其整合到我们的工作流程中。


  我也想多了解一些关于`Clojure`的知识。我认为需要编写的代码行数越少越好。仅观察一些`Clojure`项目，我就觉得它非常有前途。函数式编程语言非常适用于我们大量从事的工作——例如分布式计算、多线程计算和
  MapReduce 模式。能够用最少的代码来完成这些工作至关重要。我们的代码库太大了，需要精简。对此我感到非常兴奋。


  **古铁雷斯:** 除了编程语言，还有哪些其他工具或流程让你们感到兴奋？


  **莱纳汉:** 我对像`Storm`这样的实时处理和实时计算系统感到非常兴奋，尽管`Storm`已经不算新兴技术了。实时处理和计算在我们数据或产品管道的多个环节都有影响。它影响到管道的起点，即我们摄入、处理和分析广告请求日志，并将结果写入亚马逊的`S3`服务的环节。它也影响到管道的终点，即我们进行大量批处理以构建受众群体和投放广告的环节。


  这在我们投放广告的环境中尤其重要，因为那是一个高 QPS（每秒查询数）、低延迟的环境。我希望在后端将我们的大量批处理迁移到更实时的处理方式。


  这样一来，我们就可以更早地发现问题。我们目前正朝着这个方向努力。


  **古铁雷斯:** 你如何看待未来？


  **莱纳汉:** 在过去一年半里，我们观察到的一个可喜趋势是编程库和软件包的整合。进一步整合并抽象化软件包和库的巨大推动力非常棒。这无疑能让更多人去做有趣的工作，而无需花费数年时间攻读博士学位来理解你可以对哪些算法应用随机梯度下降法以及它的收敛性如何。


