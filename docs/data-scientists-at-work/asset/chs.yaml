- '# 关于作者


  **塞巴斯蒂安·古铁雷斯（Sebastian Gutierrez）**是一位数据创业者，他创立了三家数据相关公司：`DataYou`（数据科学与数据可视化咨询及教育）、`LetsWombat`（数据驱动的产品样品派发）和`Acheevmo`（运动表现统计）。他曾是`Scotia
  Capital`的新兴市场风险经理，并在`JP Morgan`和`Standard Chartered Bank`担任外汇期权交易员。


  古铁雷斯为包括纽约证券交易所、美国运通公司、通用动力公司等企业在内的多元化客户群，以及大学、媒体机构和初创公司提供数据可视化和`D3.js`方面的培训。他领导着拥有
  1600 名成员的纽约市`D3.js`聚会小组，并担任《`Data Science Weekly`》（一份每周提供数据科学最新发展精选文章和视频的新闻通讯）的联合编辑。他经常在`Strata`和`Hadoop
  World`（纽约和巴塞罗那）等聚会和会议上发言。他还是`General Assembly`的跨学科讲师。古铁雷斯拥有麻省理工学院数学学士学位和旧金山大学经济学硕士学位。


