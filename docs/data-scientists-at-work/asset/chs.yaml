  《数据科学家在工作》 第 11 页


  马克·汉森是一个做了出色工作的好例子。事实上，尽管他不会承认，但在过去的 12 年里，他一直在使用“数据科学”这个短语。多年来，他一直在撰文论述他常称之为“数据的科学”。他比大多数人更早地将数据科学作为一个领域来认真思考。实际上，他曾与
  AT&T 的比尔·克利夫兰合作。而比尔·克利夫兰又与图基共事过，所以那里有一条很好的学术传承脉络。数据科学之所以能引起学术界如此强烈的共鸣，是有原因的。我觉得这是因为在应用计算统计学领域，半个世纪以来一直存在一个学术基础。


  大卫·麦迪根是哥伦比亚大学统计学系的前主任，他同样令人鼓舞。他在展示统计学——无论是好是坏——对人们生活的实际影响方面做得非常出色。所有我尊敬的人都是与我一样重视社群价值的人。马克·汉森正试图在新闻学院建立一个数据记者社群。他拥有统计学博士学位，但现在他是一名新闻学教授，正试图建立一个数据记者社群。大卫·麦迪根也是如此——他曾是统计学系主任，现在是哥伦比亚大学艺术与科学执行副校长。


  最让我深受启发的人，是那些按此顺序思考问题的人：人——即如何建立一个强大的社群；想法——即如何在这个社群中团结人们；以及用来建立体现这些想法的社群的事物。


  但总的来说，我会说是我的学生们——广义上的，在哥伦比亚大学和`hackNY`——激励着我。


  **古铁雷斯：** 是什么让你相信，在休假期间加入《纽约时报》并试图做出改变？


  **威金斯：** 在我来这里的第一天结束时，我就清楚地意识到，我们应该构建一个预测模型来观察订阅者的行为。我花了一些时间采访或会见了公司里我觉得志同道合的每个人。我找到了一些好的合作者，致力于这个项目，而且从人们的反应中可以清楚地看出，以前没有人做过这件事。我当时并不清楚自己是否在重复发明轮子。


  从人们的反应中，我得到的印象是，人们似乎太忙于“喂羊”了，即忙于履行他们运营公司的日常职责，在新闻业情况甚至更糟。在新闻业，你总有截稿日期，但即使在商业方面，也有业务要经营。没有人有时间去做一个为期两个月的研究项目。我认为正是这一点让我相信，这家公司收集和整理的数据确实有很多东西可以学习。


  **古铁雷斯：** 你在其他人的工作中寻找什么？



  **Wiggins：** 创造力和关怀。你必须真正热爱某件事，才愿意长时间、深入地思考它。此外，还需要一定程度的怀疑精神。这也是我喜欢博士生的一点——五年时间足够你做出一个发现，然后意识到一路上所有做错的地方。在思想上反复经历从相信“冷聚变”到意识到“哦，我完全搞砸了”的过程，并因此犯下一系列错误再加以修正，这对你的心智成长很有好处。我确实认为，攻读博士学位的过程有助于培养你对看似确定无疑的事物（尤其是在研究中）持有怀疑态度。我认为这很有用，否则，你很容易过快地走上错误的道路——仅仅因为你第一次遇到那条路时，它看起来前景光明。


  尽管这是个乏味的回答，但事实是，你确实需要具备技术深度。数据科学目前还不是一个成熟的学科，因此还没有相应的资质认证。


  要获得维基百科级别的理解，比如对机器学习，是很容易的。


  但是，要实际去做，你真的需要知道什么工具适合什么工作，并且要对每个工具的所有局限性有很好的理解。这种经验没有捷径可走。你必须犯很多错误。你必须亲身体验把分类问题硬塞进聚类问题，或者把聚类问题硬塞进假设检验问题。


  当你自信满满地尝试某件事，认为它是对的，然后最终意识到自己完全错了，并且反复经历多次——这实际上是一种经验水平，不幸的是，没有捷径可走。你只能去做，并不断犯错，这也是我喜欢那些在该领域工作多年的人的原因。成为某方面的专家需要很长时间。需要多年的错误积累。几个世纪以来都是如此。著名物理学家尼尔斯·玻尔有句名言，他认为在某领域成为专家的方法，就是犯尽该领域可能犯的所有错误。


  **Gutierrez：** 哪件事是你改变想法最大的？


  **Wiggins：** 这是个艰难的选择。我改变想法的事情太多了。我想，我改变想法最大的，大概是“老狗学不了新把戏”这句老话。我认为，如果你真的在乎某件事，你就会找到办法。只要你真的想，你就会找到学习新技能的方法。


  另一件我改变想法的事情是，我像大多数学者一样，在成长过程中曾认为科学家是以某种与世俗世界不同的、正交的价值观体系在运作。在这方面我改变的一个想法是——但这要追溯到大约
  20 年前，当时我还没成为博士——那就是，科学家也是人，不管他们自己知不知道。科学是由科学家做的，而科学家也是人。因此，人类所有的优点和缺点，以及他们如何做出选择、他们看重什么，都会延续到科学和学术事业中。这并没有什么不同。这是一个可爱的行会，几个世纪以来运作得非常出色，我希望它能长久地运作下去，因为我认为它对人类这个物种非常有益，但我们不应该相信科学家在某种程度上就能免于所有其他人都会有的喜悦和分心。


  所以，这是我学到的部分认知——科学在本质上与技术或任何其他艰难的人类事业并无不同。这些都是非常艰难的人类事业，需要规划、关注、关怀和执行，还需要一群人来支持它。我刚才说的一切，对于学术科学、撰写论文、赢得资助、培养学生、教导学生，以及创办新公司、进行研究、或在已建立的大型企业中使用技术，都完全适用。所有这些事情都很困难，需要有一群人共同努力才能实现。正如他们所说：“人、想法、然后是东西，按这个顺序。”这在任何科学领域都是如此，在现实世界中也是如此。


  **Gutierrez：** 数据科学的未来是什么样的？


  **Wiggins：** 我看不出数据科学有什么理由不遵循其他许多领域的发展轨迹，即在学术界找到自己的归宿，这意味着会出现认证功能，尤其是在专业领域。你会看到硕士和博士学位。这个领域会变得有意义，但也会走向专业化。你已经看到人们开始把“数据工程”和“数据科学”作为不同的概念来使用了。我在《纽约时报》的团队是数据科学组，它隶属于更大的数据科学与工程组。人们开始意识到一个数据科学团队需要包含数据科学、数据工程、数据可视化和数据架构。


  `Data Product`（数据产品）目前还算不上一个成熟的概念，但可以肯定的是，如果你看看数据科学在 LinkedIn 是如何发展的——数据科学向上汇报给产品部门。在其他公司，数据科学向业务部门汇报；或者向工程部门汇报。目前我在《纽约时报》的工程职能体系内，独立于产品、市场和广告部门。不同的公司将数据科学置于不同的部门之下。


  所以我认为未来会有认证体系。我认为会有专业化。新的领域不断诞生——我不会说总是如此，因为按照现实世界的标准，学术界里似乎什么都没发生——但每隔几年，大学里确实会有新的系成立。这是事实，而新领域的诞生过程是其形成的一部分。我年纪够大，有幸目睹过，比如，系统生物学作为一个领域诞生，合成生物学作为一个领域诞生，甚至纳米科学也是在我从事学术研究期间作为一个领域诞生的。我在
  20 世纪 80 年代的第一个研究项目是关于混沌理论的，那时它正作为一个新领域诞生。詹姆斯·格雷克写过一本著名的书，当时他为《纽约时报》撰稿，书名叫《混沌：开创新科学》。


  这并不是说学术界不创造新领域。只是相比于现实世界的节奏，它实在太慢了，而我认为这实际上是最好的安排。毕竟这关系到年轻人的未来，所以我觉得这其实也不坏。


  所以我认为数据科学的未来是成为学术界的一部分，这意味着不同大学之间会就“究竟什么是数据科学”展开激烈、充满争议的对话。你已经能看到这方面的进展了。例如，在哥伦比亚大学，我的一位同事，历史学家马特·琼斯，正在写一本关于机器学习和数据科学历史的书。所以你已经开始看到人们认识到数据科学并非凭空产生于
  2008 年。从知识层面看，我们称之为数据科学的东西其实早已被隐约意识到——也就是说，在统计学和机器学习之间存在一个空白，那里存在着某种别的东西。所以我认为未来人们会更加重视数据科学的历史。



  当一个领域成为学术领域时，通常会发生三件主要事情：确立学术经典、启动资格认证流程、以及通过历史研究提供领域背景。学术经典是构成该领域核心知识元素的一系列课程。资格认证流程是学术界的另一项独立职能（可以拆分出来），它被启动，以便人们能够获得硕士和博士学位。


  最后，进行历史研究以理解背景：这些思想从何而来？


  随着人们使用的名称和短语变得更有意义，专业化的可能性就会出现，因为目前当人们提到“数据科学”时，可能指代很多不同的事物，比如数据可视化、数据工程、数据科学、机器学习或其他东西。当这些短语被更谨慎地使用时，我想你就会看到团队更高效的专业化分工。你不能拥有一支所有队员都说“我是踢球手”的橄榄球队。必须有人当踢球手，有人当扶球手，有人当线卫。当人们开始专业化时，你才能进行配合。你可以与他人进行有意义的协作，因为人们清楚自己的角色，也知道“任务完成”是什么样的。而现在，我认为数据科学领域究竟何谓“胜利”，尚无定论。


  6 James Gleick, *混沌：开创新科学* (Viking, 1987).


  ***工作中的数据科学家*** 15


  再次强调，我来自一个非常古老的领域。物理学领域的本科课程基本上在 1926 年就被经典化了。多年前，我在 Book Scientific 书店买了一本书，叫《理论物理纲要》。7
  它有四个章节：经典力学、统计力学、量子力学以及电磁学。这四个支柱构成了整个物理学的基础。物理学拥有非常丰富的知识传统，背后有一些坚实而明确的成果，但它确实是建立在这四个支柱之上的。你可以看出它有一个强大的经典体系。大多数领域都没有这种优势。我认为，你必须拥有一个成熟的领域，才能说：“这是你作为本科生真正需要学习的四门课程。”


  **Gutierrez：** 哥伦比亚大学数据科学与工程学院的学术经典涵盖哪些内容？


  **Wiggins：** 我是哥伦比亚大学数据科学研究所教育委员会的成员，因此我们创建了包含四门课程的经典体系：概率论与数理统计、数据科学算法、数据科学机器学习，以及
  `EDAV`（探索性数据分析与可视化）。这三个字母 `EDA` 直接取自约翰·图基。


  图基在 20 世纪 70 年代写过一本书，名为《探索性数据分析》——这基本上是描述图基在没有计算机的情况下所做的事情，可能是在普林斯顿和贝尔实验室之间的火车上，每当有人给他一份新数据集时他就是这样做的。8
  这本书基本上描述了他绘制数据的所有方法：直方图、图基箱线图、图基茎叶图——所有他用来处理数据的工具。如果你现在读这本书，它会看起来像：


  “天呐，这家伙太古怪了。他当时就应该打开 `R` 语言。他当时就应该打开 `matplotlib`。”


  大约在同一时间，他正在普林斯顿大学与爱德华·塔夫特共同授课。如果你拿起《定量信息的视觉展示》这本书，看看它是献给谁的。9 这本书是献给图基的。同样，许多数据科学思想都建立在非常古老的学术传统之上。学术界长期以来一直在思考什么是定量信息的视觉展示。我们如何有意义地“做”数据可视化？当有人递给我们一份数据，而我们完全不知道其分布时，我们该怎么做？世界并不会递给你一个分布，它递给你的是观测值。


  [7 www.wachter-hoeber.com/Books.html?bid=002](http://www.wachter-hoeber.com/Books.html?bid=002)


  8 John W. Tukey, *探索性数据分析* (Pearson, 1977) *.*


  9 Edward R. Tufte, *定量信息的视觉展示* (第 2 版) (Graphics Press, 1983) *.*


  ***第 1 章 | 克里斯·威金斯，《纽约时报》***


  我们在物理学或数理统计学中所做的大部分工作，都是围绕什么是合适的模型来组织我们的世界观。现在是时候把它当作统计力学来处理了吗？如果是，我应该在哈密顿量中加入哪些项？这是一个量子力学问题吗？如果是，我应该在哈密顿量中加入哪些项？这是一个经典力学问题吗？如果是，我应该在哈密顿量中加入哪些项？


  世界就是这样。世界不会递给你模型。它不会带着一个模型来找你说：“对角线化这个哈密顿量。”10 它递给你的是观测值和一个问题，这个问题通常是由收集这些数据的人提出的。这就是那个我觉得非常重要的传统，以至于我们把它作为哥伦比亚大学数据科学的四大支柱之一。我们希望学生在决定用某种特定分布或某个特定图模型对数据进行建模之前，先思考如何探索数据。当你拿到一份数据集时，你该如何探索它？


  **Gutierrez：** 数据科学中最让你兴奋的事情是什么？


  **Wiggins：** 最让我兴奋的事情不是新事物。最让我兴奋的是意识到某些大家以为很新的东西，实际上非常古老。这就是为什么我如此喜欢图基。对于这个被称为“数据科学”的新事物，有很多兴奋点。我觉得去阅读那些甚至比图基年代更早的统计学旧论文非常有趣。例如，休厄尔·赖特在
  20 世纪 20 年代就已经将图模型用于遗传学研究。11


  真正让我兴奋的并非那些新奇的东西。尤其是围绕想法本身，而不是事物本身，因为——再说一次，顺序是：人、想法、事物。事物会变化。当我们认为有一个新想法时，这很有趣，但我们通常会发现这个想法其实非常古老。当你理解了这一点，你就会意识到这真他娘的是个好主意。


  例如，随机优化和随机梯度下降在过去五年间取得了巨大成功，但它们源自罗宾斯和门罗在 1951 年发表的一篇论文。12 这是个好主意，但我觉得它是好主意，是因为在很久以前，有人用纸和笔非常仔细地思考过它。试图通过数据和你的计算机来理解世界，这是一个非常好的主意。这就是为什么图基在
  1962 年就写下了它，当时他敦促每个人都重新定位统计学这个专业学科，并为 NSF（美国国家科学基金会）组织了一条围绕计算、数据和数据分析的资助线。他在 1962
  年写了一篇文章，题为《数据分析的未来》。13 而且，他并不是最后一个，对吧？


  [10 http://vserver1.cscs.lsa.umich.edu/~crshalizi/reviews/fragile-objects/](http://vserver1.cscs.lsa.umich.edu/~crshalizi/reviews/fragile-objects/)




