  with Friends`）或其他应用。免费短信应用往往朝一个方向偏移，而与朋友拼词这类应用——连我妈妈都在用——则往往朝另一个方向偏移。在解读我们的数据时，我们必须不断地对这些以及许多其他类型的偏差进行校正。


  **Gutierrez:** 让我们更深入地探讨一下偏差。这些偏差是您和同事们自己发现的，还是业内已知的、基于人口、社会及/或心理特征的启发式标准（`heuristics`）？


