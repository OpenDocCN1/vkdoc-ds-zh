- '# 可变剪接与生物学的复杂性


  故事到此结束。现在我们知道了，一个基因会先转变为 mRNA，然后 mRNA 或多或少被切片和切块，最后转变为蛋白质。这种被称为“可变剪接”的切片过程，就是为什么人类基因组看起来只有大约
  20,000 个基因，但我们却拥有数量庞大得多的各种不同蛋白质的原因。


  蛋白质具有令人难以置信的多样性。因此，许多人——例如麻省理工学院的 Yarden Katz4——正在开发算法，以处理这些高通量数据，理解实际发生的情况以及背后的生成随机过程。如果你以天真的计算机科学视角来看，每个细胞基本上就是一台小型计算机，对吧？它拥有一块内存，而
  DNA 就是运行在这套复杂随机微分方程中的那个经过压缩、混淆、充满 bug 的二进制代码。如果我们想搞清楚这一切是如何运作的，就必须开始应用更先进的计算技术。所以，确实有很多人正在用类似的数据和算法目标来研究不同的生物系统。


  我可能要提出一个略带争议的观点：我认为人类无法完全理解生物学。我认为我们对“理解某事”的定义必须改变。我们将不得不更加适应这样一种情况：计算机内部有一个复杂的模型，而我们只理解其中的一部分。从某种意义上说，物理学让我们无比幸运。麦克斯韦方程组仅仅是四个线性偏微分方程，却能解释所有这些现象，这简直是神奇而不可思议的。


  我们没有理由期望这些我们称之为身体的、经过 40 亿年进化出来的“粗陋的流体袋子”，会展现出那种极端还原论的特性。


  当你观看 Steven Boyd5 的讲座时，他会反复提到我们都熟知的 19 世纪数学，以及这种 19 世纪的科学研究方法根本行不通。因此，我们必须开始开发算法，并且必须使用计算工具来重新定义“理解”。事实上，我认为工业界在这方面已经领先一步。来自塔吉特（Target）公司（那个众所周知的，或许是杜撰的塔吉特预测应用案例）的一位高管，并不一定关心导致某人购买尿布而非啤酒的潜在因果过程。这位高管关心的是：“这个模型是否具有预测能力？它能否让我据此采取其他行动？”


  我认为，你将在生命科学领域看到更多这样的趋势。


  **古铁雷斯:** 对于那些想在这个领域开始工作的人，他们应该阅读哪些材料？


  **乔纳斯:** 在计算生物学方面，实际上有很多博客。例如，《自然》和《科学》杂志都运营着博客。然而，我认为最有用的资源之一，是我作为本科生时未能充分重视的——综述文章。一篇综述文章就是对某个特定子领域的最新概览。当你
  21 岁，在某个材料中苦苦挣扎时，没有人会告诉你这个。如果有人对你说，“你知道吗？某个可怜的研究生已经写了一篇 15 页的文章，讲述了该领域的最新技术水平，内容深入浅出且通俗易懂，因为它就是为更广泛的科学素养读者而设计的。你应该去读一读来理解这个材料。”
  那事情就容易多了。《自然综述·神经科学》和《自然综述·遗传学》都是获取这类综述的绝佳来源。这是我最常去查找的两个资源。


  另外一件人们没有充分意识到的事情是，研究生们——或许是因为沉没成本谬误——常常在他们博士论文的开头阶段，写出非常出色的领域综述。通常，当我想要进入一个新领域或相邻领域时，我会去找一篇最新的研究生论文，然后阅读第一章。因为在这一章中，他们会以一种面向普通读者的方式来介绍他们领域的综述。因此，它们常常是极好的教学工具。我的客厅里散落着许多不知名研究生的打印版博士论文。


  **古铁雷斯:** 让我们回到你之前创立 Prior Knowledge 的经历。在斯坦福大学，作为彼得·蒂尔的初创公司课程的客座讲师是什么感觉？


  **乔纳斯:** 整个经历都很棒，斯坦福的学生们也非常热情。具体到我客座讲授的那堂课，体验非常有趣，因为它非常专注于人工智能，而不是数据分析。这次经历之所以非常有趣，是因为我与其他几位客座讲师同台，包括
  Vicarious 公司的 CEO 斯科特·布朗，以及 Palantir 公司的工程总监鲍勃·麦格鲁。这两家公司几乎代表了数据/人工智能公司领域截然相反的两极。


  Palantir 是一家非常成功的公司，但丝毫与人工智能无关。事实上，他们往往对人工智能持不可知论的态度。他们构建工具，让人类分析师能够进行更好的数据分析。而另一边是
  Vicarious，他们宣称要在十年内解决通用人工智能问题。


  我认为课堂上没有多少人认识到，Vicarious 所说的那些话，在过去二十年里人们也一直在说，因为这类技术很容易被过度炒作和过度承诺。然后是我们，Prior Knowledge，恰好处于这个光谱的中间位置。


  就我个人而言，课堂上发生的最棒的一件事是，彼得问道：“你们是否担心自己的技术被用于邪恶目的？” Palantir 的人回答说：“嗯，是的，事实上，我们有一整支法律团队专门负责确保这种事情不会发生。”
  我认为这是我听过的对合规部门最好的美化了。拥有一群律师是因为你喜欢和政府签合同，跟说“不，我们雇了约翰·康纳来阻止这件事”完全是两回事。


  让彼得来教授初创公司课程很棒，因为他极其聪明，并且非常愿意进行长期技术押注。他既擅长投资科学和最尖端的工程，也擅长像 Facebook 那样的纯商业消费者投资。很少有风投机构会进行这类押注，而
  Founders Fund 一直非常愿意为此承担风险，进行更深度的科学投资。当然，我对此显然非常感激。最后，看到这门课因为布莱克·马斯特斯做了详尽的笔记并将其发布到网上而变得声名狼藉（或臭名昭著），也是件很有趣的事。


  **古铁雷斯:** 你能把你的神经科学研究转化为一家初创公司吗？


  **乔纳斯:** 我希望开发能改善神经科学的技术能赚到 10 亿美元。我希望为科学构建工具能赚到更多的钱，这样你就能雇佣工程师和支持团队来加速进步。然而，这并不可持续。目前现实的情况是，科学工具公司是一门糟糕的生意。如果一个产品有非常明确和有用的临床应用，那么它通常会更具可行性。以制造分析遗传变异和生物功能系统的
  Illumina 公司，就是这类公司的一个例子。


