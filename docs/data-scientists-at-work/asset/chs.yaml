- '# 对话录：数据科学实践与思考


  **Jonas:** 我在 Python 中使用 `Matplotlib`。我会先绘制一批初始图表，然后对数据进行各种调整。我处理的数据大多与行业领域常见的数据类型截然不同。科学领域几乎没人使用关系型数据库，因为我们面对的是时间序列、图形、图像或其他各种非标准格式的数据。我们很少获得关系型事实数据。因此，我其实不怎么用
  `SQL`。更多的是编写大量自定义脚本来解析 100 GB 的时间序列数据，并查看不同的光谱波段或类似内容。


  **Gutierrez:** 你在评估他人工作时会关注什么？


  **Jonas:** 在研究方面，我的答案与我共事的许多人以及该领域的其他人不同。一位同事曾告诉我，我读的论文比他们认识的任何人都多。但实际上，我并未真正阅读大多数论文。我只看标题和摘要，查看图表，然后就继续看下一篇。例如，在评估机器学习论文时，我关注的是该方法是否有效。这是世界需要知道的——大多数论文实际上并未告知你该方法是否有效。这非常令人恼火，因为大多数论文只会展示五个数据集示例，然后与
  20 年前的某个方法对比，表明它们在两个指标上略优一些。在学术界，这或许没问题。但在工业界，这让人极其不满，因为你需要知道什么实际有效，什么无效。


  所以，我主要关注的是：“我认为他们的方法合理吗？我认识他们吗？” 我阅读认识且信任的人所写的论文的可能性，远高于阅读那些我不认识的人所写的论文。人们抱怨新人很难进入某个领域。这在一定程度上是因为，在任何特定时间，99%
  的新人都是“怪人”。因此，很大程度取决于：“我觉得这个模型的结构有趣吗？我认为他们正确地进行了推理吗？他们问了基本问题吗？我相信那些结果吗？这个答案是我在阅读论文之前就会相信的吗？”
  如果答案肯定，那么我更可能相信它。“我是否感到惊讶？结果的信息熵是多少？” 结果越令人惊讶，我在评估时就越要彻底。


  在工业界方面，我认为掌握软件工程能力非常重要，但这并非真正被教授。你作为计算机科学本科生学不到这些，作为研究生更是如此。所以对我来说，有人以某种方式学会了这项技能——无论是自学还是跟别人学——至关重要。我基本上不能雇用一个不懂
  `Git` 的人。


  在某些规模的公司，或许还能雇用在工具方面有短板的人。但就我所关联过的几乎所有事情而言，情况并非如此，这很不幸，因为这意味着你会错过一些非常聪明的人。你希望人们在第
  10 天就能产出，而不是第 100 天。我也强烈认为，机器学习的贝叶斯方法具有巨大的潜力。我认为它鼓励一种精确的思维。如果你不使用它，很容易迷惑自己并误入歧途。


  因此，我通常寻找至少熟悉贝叶斯领域的人。


  **Gutierrez:** 在数据使用方面，你有什么改变主意的经历吗？


  **Jonas:** 我大约在 2001 年开始和我大学时期最好的朋友约会。我们在一起九年，然后分手了。所以 29 岁时我单身了，意识到我必须学习如何约会。我决定，既然要开始约会，我应该记录数据。于是我创建了一个约会电子表格，然后经历了大约
  100 次初次约会，最终得到了这一大块数据。从麻省理工学院毕业后，你会觉得自己很笨，因为其他人都比你聪明，你会对自己产生各种负面想法。然而，在查看数据后，结果发现我其实还挺有魅力的——这是一个让我改变想法的很棒的事情。


  我发现，如果我能和某人进行第二次约会，那么我通常能和他们约会到第五次。存在一个初始评估过程，但我通常在这方面做得很好。所以实际上，我在约会方面的处境远比我想象的要好。当你醒来发现
  30 岁近在眼前，而你的朋友们都在结婚，只有你单身时，你会想：“天哪，我错过了这班船！” 有了约会电子表格，很容易就能看到，不，实际上数据显示了相反的情况。这太棒了。从心理上讲，你很容易陷入这种锚定效应，你总是记得上一次糟糕的约会，却想不到之前
  15 次中有 10 次都进行得很顺利。如果我没有记录这些数据，我想我的自信会受到很大打击，这又会影响到我生活中的其他方方面面。现在我和一个很棒的人约会，如果我没有意识到数据表明确实有人喜欢我，我认为这不可能实现。


  这个约会电子表格现在成了一个玩笑，但它确实帮了大忙。每个人都在谈论“量化自我”，每个人都想追踪自己。但没人会记录那些真正重要的人际互动——谁在乎你上周走了多少步，你吻了谁？所以我认为约会电子表格很好地证明了这种数据上的量化自我方法。


  **Gutierrez:** 数据科学或计算神经生物学的未来会是什么样子？


  **Jonas:** 我知道每个人都想谈论大数据。现在这个词以一种糟糕的方式进入了词典。还有，数据科学家是“21 世纪最性感的工作”——诚然，这是一位数据科学家在他写的一篇文章中说的，所以并不客观。当然，它发表在了《哈佛商业评论》上……但拜托！我实际上认为未来更多在于小数据。或者像我在
  `Bitsight` 的朋友们所说的“Grande Data”，就像星巴克的杯子尺寸——既不是 Tall（短杯）也不是 Venti（超大杯）；而是 Grande（中杯）。你能从
  1 GB 数据中发现的东西，往往比从 1 TB 数据中发现的东西有趣得多，因为有了 1 GB 的数据，你可以提出更有趣的问题。你可以构建更有趣的模型。你可以更好地理解正在发生的事情。


  一方面，有 Peter Norvig 的理念：只要有足够的数据，就可以使用简单的模型。如果你是 Facebook、Google、Walmart 或类似规模的公司，这是正确的。否则，大多数公司只有一千、一万甚至一百万客户，这远未达到
  Norvig 理念所需的规模。大多数购买和使用 Hadoop 这类技术的人，都是把它当作记录引擎，筛选所有数据，然后将其存入 `RDBMS`，再在 `R` 和
  `SQL` 中进行实际数据分析。我认为，随着大数据炒作周期的顶峰过去，我们将看到越来越多的人认识到，他们真正想做的是对小数据集提出有趣的问题。




  在计算神经科学方面，数据正在不断涌现，并且在未来十年内数据集会变得越来越大。如果现在我们没有构建正确的模型，我认为十年后我们将会陷入困境。我们该怎么办——做线性回归吗？我曾与谷歌非常聪明、著名的机器学习专家交流过，我问他们：“你们整天都在做什么？”他们回答：“嗯，我们做特征工程，然后在最大的数据集上运行线性回归。”“但你们还写了一本书！”


  我想：“这是怎么回事？”


  我讨厌“预测分析”这个词。如果你认为整个世界都是关于预测分析的，那么整个宇宙在某种意义上就已经被解决了，也变得无趣了。如果你关心黑箱内部发生了什么，并且希望技术让你看到新事物，那么这目前正是一片蓝海。


  ***第 15 章 | Eric Jonas，神经科学研究***


  DARPA 资助的数据显微镜项目正是为了构建这类工具，让你能够在数据中看到以前看不到的东西。如今很多数据分析初创公司就像是数据可视化技术，当你能够想出要问的问题，然后提问、可视化并绘制条件关系等时，效果很好。


  然而，对于大量数据领域而言，我们早已超越了那个阶段。


  当你开始面对这些“大数据”问题，数据量大到无法可视化，但又不至于多到能做 Google 规模的事情，甚至你连做 Google 规模所需的资源都没有——那现在该怎么办？更多的线性回归？我真的认为这最终会成为未来，尤其是在科学领域。这是不可避免的。而且我认为你最终会看到这类数据显微镜技术被教授给本科生。我们将看到真正的转变。


  **Gutierrez：** 你希望看到哪些数据集得到开发？


  **Jonas：** 有两个数据集。第一个，我希望拥有大脑中每个细胞之间的所有连接。这包括大脑中每个细胞的空间位置和连接。第二个，我想要海马体中每个神经元的时间序列。我们必须开始构建这类高通量的神经数据集。我并不满足于这些数据只来自动物模型，尽管它们暂时会是这样，但最终我们会实现目标，因为系统已经存在。数据就在那里，只是目前无法获取。我们必须改变这一点。幸运的是，人们的兴趣越来越浓厚。在我大脑的某个地方，有一团胶状物知道我的电话号码。我们不知道那是什么，它长什么样，甚至不知道它如何运作，这很荒谬，因为它就在那里。那里存在某个回路。我想理解它，并且我希望有数据存在来帮助我理解它。


  **Gutierrez：** 在你博士早期，你曾制造过一个设备来测量这些数据。你或其他人是否考虑过继续研究这个方向？


  **Jonas：** 我确实考虑过继续研究。问题部分在于比较优势。我认为这个领域足够大。我真正想达到的是——如果你能记录所有这些神经元，你如何利用这项技术赚取
  100 亿美元？因为这样我们就可以让资本创新机器发挥作用了。然而，我们目前的研究对象是老鼠。没有人真的想读懂老鼠的心思。即使是制药公司也对读懂老鼠的心思没兴趣，因为老鼠对于做大规模实验来说体型太大了。他们喜欢老鼠，是因为老鼠体型小，但即便如此，从制药公司的角度来看，老鼠实验也极其昂贵。我们最终会实现的。希望炒作不会先毁了它。但是，我可以想象回到仪器研发方面。我曾花了一点时间在伯克利的`AMPLab`，与一些从事压缩感知研究的人合作，试图探索这些领域。走着瞧吧。希望未来那里有很多机会。


  ***Data Scientists at Work*** 313


  **Gutierrez：** 如果让你给刚起步的人一些建议，你会说什么？


  **Jonas：** 我认为如果你今天是一名本科生，并且不会编程，那你基本上就完蛋了。如果你做任何与技术相关的事情，尤其是在生物学方面，你必须学会编程。这是不可避免的。对于我那些文科专业的朋友来说，可能这对他们的职业生涯不那么关键。但处理数据的能力变得至关重要，为此，你必须学会与计算机对话。


  对于刚开始攻读理科研究生的人，我建议阅读 Derek Lowe 的博客“In the Pipeline”。7 Derek 是一名药物化学家，已经写博客多年，他是一位见解深刻的了不起人物。他谈到在医学、制药和生命科学领域工作了三十年，他研发的药物从未真正进入患者体内。他说这很常见，因为中位数成功率是零。他还谈到，读研的目的是为了毕业，其他都不重要。我认为这非常正确。我也会鼓励人们进入更量化的项目，因为以后变得不那么量化要容易得多。


  对于学术界人士，我的建议是：初创公司不是资金来源。


  令人惊讶的是，有大量研究生带着一些基本没有市场的东西来找我，说：“嗯，我觉得我可能能让风投给我钱做这个。”我的回答总是：“你不了解这里面的游戏规则。风投会希望你专注于你不想关注的事情，这行不通。”即使你遇到了像我们那样非常支持你的风投，你最终也会意识到，他们给你的不是资助。他们希望你能回报他们十亿美元。如果这不是你拿钱时的初衷，那也没问题，但你需要在开始时就明确告诉他们。


  利用风投来资助科研是一件困难且虚伪的事情，研究生很容易自欺欺人。


  人们很容易说：“我要成立一家工具公司。”然后你就会想：“不，让我们用对待其他科学研究一样严谨的态度来对待这个过程。有多少这样的公司？它们是怎么成功的？它们真实的轨迹是怎样的？”


  这也是我认为追求像 DARPA 这样的非稀释性资本，或者为任何这些硬科技问题做早期咨询工作，实际上是正确道路的原因之一。如果你看看很多真正成功的公司


  [7http://www.pipeline.corante.com/](http://www.pipeline.corante.com/)。




