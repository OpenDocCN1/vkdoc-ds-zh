  最后，当然还有一些问题，当它们被解决后，会让像我们这样的人受益。例如，假设我们要去某个地方潜水或航行，或者选择一个度假地点。为此，我们想知道何时去、去哪里，并且如果我们靠近海或洋，了解水下能见度如何会非常好。如果我们想航行到某个地方，了解最佳风向以便从一个地方航行到另一个地方也很棒。这个解决问题领域的一个衍生是，这些数据也有助于帆船比赛。


  总的来说，这主要是两个最重要的方面：长期投资决策和日常运营决策。在大多数情况下，海洋学家通常有物理学背景，因此他们利用这些数据，通过数值模型创建动态海洋环境的模拟。这涉及对过去事件进行大量统计分析，以预测未来事件。如今他们使用高度先进的技术和方法，因此你可以想到许多许多的应用场景。


  **古铁雷斯：** 刚开始时，你参加了哪些书籍、出版物、博客或会议来学习更多关于这个行业的知识？


  **卡尔皮什琴科：** 我们做的第一件事就是参加顶级会议，并联系顶级组织。我们访问了美国国家海洋和大气管理局（NOAA），与美国国家航空航天局（NASA）进行了互动，并去了不同的大学，比如康奈尔大学和罗格斯大学，它们现在是
  Planet OS 的合作伙伴。我们研究了他们正在做的事情，并经常与他们的专家进行对话。我们对客户也做了类似的事情：在两年的时间里，我们与近 100 个不同的组织进行了互动。我们确保与高管和董事会层面的人员，以及那些实际在海上工作的人进行交流。我们非常努力地理解他们的决策如何依赖于他们收集或拥有的数据，他们的决策流程是什么，以及他们的工作流程是什么，以便我们能够确保我们的产品和平台比他们当前的做法高效得多。


  ***第 11 章 | 安德烈·卡尔皮什琴科，** Planet OS*


  至于会议、论文和博客，那可就太多了！如今，如果你在自己周围建立了一个社群，新闻和人们就会开始找到你。2013 年，我们举办了两项挑战——一项是与 Kaggle
  合作的，另一项是我们自己主办的挑战。与 Kaggle 合作时，我们创建了一个名为


