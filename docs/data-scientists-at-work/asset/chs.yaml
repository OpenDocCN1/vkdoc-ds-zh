  ***工作中的数据科学家*** 119


  **古铁雷斯：** 你在 MailChimp 的典型一天是怎样的？


  **福尔曼：** 我领导 MailChimp 的数据科学团队，同时我也喜欢亲自动手。我一天中的重要部分包括：与我的团队一起盘点当前项目并规划下一步方向，完成我自己的工作并进行原型设计——我和我的同事们一样做项目——然后还要与其他团队沟通，与管理层交谈，并规划未来。


  在我们的团队中，不同的人负责不同类型的项目。我们有一个人专门负责合规，并审视我们的合规流程。


  还有另一位数据科学家，更专注于用户体验方面，并了解我们的客户。我在做前面提到的三件事——构建数据产品、充当翻译、与数据科学社区交流——的同时，根据需要帮助他们和其他人。


  我们团队中还有开发人员，他们可以将原型转化为生产工具。


  除此之外，我们团队还有一组定性研究人员，他们与我们并肩工作，通过调查和大量的客户拜访来获取创意和项目——并验证发现和产品方向。


  这就是让 MailChimp 数据科学独树一帜的一点——我们将定量和定性研究放在同一个地方，紧邻一些优秀的工程师。这是一个强大的组合。


  回到我一天的安排，当我开始工作时，第一件事就是盘点我们在各个项目上的进展情况。了解我们在项目上处于什么阶段很重要——无论是调查用户、挖掘数据还是构建模型。一旦我对我们的进展了然于胸，我会在头脑清醒之前挤出时间进行原型设计。我不是开发人员，也不自称是开发人员。不过，我能写出能运行但糟糕透顶的意大利面条式代码，尽管可能没人愿意去读它。


  因此，我努力做的一件事就是亲自动手，真正接触数据并构建原型模型。我最近完成的一个原型示例，专注于帮助人们根据预测的电子邮件地址人口统计信息（例如年龄范围）来对列表进行细分。


  一天开始后，一个重要组成部分是与其他团队沟通，弄清楚我们可以做些什么来帮助他们。例如，我们可能与集成和合作伙伴团队合作，他们可能有一个大客户，希望对其列表进行球面
  K 均值聚类，以研究不同的细分群体。因此，我们将一起努力，弄清楚我们是否能运行这个聚类，然后与他们一起讨论结果，以了解从中得出了什么，以及这个列表上的读者是谁。这种工作最终会使这个特定团队受益，因为他们可以将此作为报告提供给客户。这对我也有好处，因为我对自己数据的强大之处以及客户的需求有了更多了解。


  ***第 6 章 | 约翰·福尔曼，MailChimp***


  一天中的另一部分时间用于非常仔细地规划和思考我们要构建的基础设施类型。既然我们在 MailChimp 有了一个数据科学团队，就不能仅仅着眼于构建维持应用程序运行的基础设施了。那显然是第一要务。但现在我们有了所有这些想要访问数据进行分析的人。这种访问模式与用户访问他们自己的数据非常不同，所以我们需要仔细考虑这一点。每当我执行一个`SQL`查询时，大家都会跑开，因为从应用程序运行的查询只命中索引，而我运行的查询则涉及大量的连接或子查询。


  所以，当我带着一个包含百万次连接的奇怪嵌套查询出现时，天哪，里面还有一个交叉连接，我正把某个数据集搞得一团糟，并在`SQL`中对它做窗口函数之类的事情，我会让我们
  NOC [网络运营中心] 墙上的所有信号灯变红。这对他们和我来说都不好玩。因此，白天肯定需要讨论我们要构建哪些系统，以及它们将如何被使用。


  我们必须为分析师留出空间，让他们可以随心所欲地访问这些服务器，或者随心所欲地处理不同的数据集。这需要反复沟通：你需要什么数据？我们能提供什么数据？你的需求是什么？你是在为生产环境构建东西，还是在为分析构建东西？你能否接受查询运行很长时间？它需要运行得非常快吗？所以，我一天中的一部分时间涉及技术需求。


  一天中的另一部分时间则用于与高管和其他面向客户的团队交谈，询问他们从用户那里听说了哪些他们想要的功能。然后思考是否可以利用数据来实现这些被要求的功能。我们最近完成的一个被要求的功能是发送时间优化。我们花了大量时间讨论如何利用我们的数据来适当地预测和优化客户应该何时发送他们的新闻通讯，以便最好地吸引他们的受众。推动参与度的因素之一可能是电子邮件接收者的时区。每个人都不同，每个人的日程安排也不同，但他们可能会集中在一天中的几个特定时间点，尤其是根据他们在地球的哪一侧，因为大多数人上白班，大多数人晚上睡觉。这些都是显而易见的事情。但从那以后，问题就变得更加复杂了。所以，我们与高管和我们的定性研究团队交谈，以真正了解人们是否想要这个功能，然后弄清楚需要什么数据。如果我们真的构建了它，我们认为应该如何向用户展示它。我们花了相当多的时间来确保，如果我们在这个项目上投入时间和精力，这将是一项很好的投资。


  ***工作中的数据科学家*** 121




  '
- '# 在我一天的工作中，一旦我们花时间弄清了客户的需求，接下来的部分就是规划我们下一步要构建哪些产品，然后将这些规划带回我们合作的团队，向他们解释我们将如何构建特定产品。例如，我们内部很多事情都是通过内部
  API 调用来完成的，因此我们需要确保这些 API 的构建方式能够满足我们内部客户的需求。


  **古铁雷斯：** 你如何看待和衡量成功？


  **福尔曼：** 对于使用所谓的 `KPIs` 来衡量成功，我们非常谨慎，甚至可以说是抱有敌意。我们看到许多竞争对手用非常死板的方式衡量成功。互联网公司关注诸如
  `ARPU`（每用户平均收入）、留存率或向付费计划的转化率等指标。我们本也可以这样做，但我们没有。整个组织完全不衡量这些指标。具体原因是我们作为一个组织——不仅仅是数据科学团队，而是整个组织——都认为，当你开始关注这些定量的成功指标时，事情会变得扭曲。


  我来举个例子说明 `KPIs` 导致的这种扭曲。我是大力水手炸鸡的忠实粉丝。我喜欢他们的鸡肉和红豆米饭。然而，最近我去他们的一家汽车穿梭餐厅点餐。我把车开到窗口，他们有一个计时器在运行。这个计时器本质上是为了评估他们服务每位顾客的速度绩效。如果这个指标是被激励的，是每个人都关注的指标，那么在理想情况下，人们会以适当的方式努力改进这个指标。


  但他们实际的做法是以一种扭曲的方式来改进指标。每一位开车过来的顾客，都会立刻被告知：“嘿，你能把车停到那边的车位吗？我稍后会把食物给你送过去。”于是，他们立刻就降低了实际绩效，并没有真正加快任何速度。他们之所以改善了被衡量的“服务每位顾客的时间”指标，是因为他们重置了时钟——因为你只是把车开进了停车位。毕竟，你很难拒绝他们，因为他们正在为你准备食物，你也不想惹麻烦。但现在他们的绩效反而下降了，因为他们不得不把食物送过来。所以他们花时间绕过柜台、走出店门、试图找到哪辆车对应这份订单、把食物送到我的车窗、和我确认确保找对了车、然后走回店内、再绕过柜台去服务下一位顾客。你可以想象，这会花很长时间。因此，由于这个组织专注于这个时间指标
  `KPI`，他们实际上从全局上降低了绩效。


  回到我们的业务，我们在竞争对手那里也看到了类似的行为。他们专注于某些指标，结果却导致了无法恰当地服务用户——也许他们在短期内创造了更多收入，推高了股价，但实际上也与用户之间积累了大量敌意。我们不必担心这个，因为我们是一家私营公司，不为他人所有。我们关注的是——这听起来可能有点傻，尤其对于数据科学家来说——我们用户的幸福感。因此，我们与用户保持着非常密切的沟通，不仅是通过社交媒体在线积极互动，还飞往全球各地与用户交谈。我们利用这些对话来了解客户在说什么，他们喜欢什么，不喜欢什么。我们只专注于他们的幸福感，以便提供尽可能最好的产品。


  抛开指标不谈，如果你正在尽己所能解决所有你通过对话了解到的问题，并专注于你做得好的方面，那么这实际上就是你能做到的最好状态。这也不会产生任何奇怪的、扭曲的衡量标准，让你不去看用户和你的产品，而是避开用户和产品，只盯着一个
  `KPI` 数字。在某些情况下，你甚至会在内部与其他团队就这个数字展开竞争，并提出诸如“这个数字中有多少可以归功于数据科学团队？”这样的问题。这是一种看待问题的可怕方式。


  有多少收入可以归功于数据科学，而不是市场营销或用户体验？一旦你开始这样区分，突然间，你就让团队之间产生了对立，让领导之间产生了对立，合作的意愿就降低了。


  所以，我认为，通过不专注于这些衡量标准，我们实际上为组织做出了巨大贡献，我们只是鼓励每个人都专注于让我们的用户满意。当需要解决的问题出现时，我们更容易直接说“这里有个问题需要解决”，然后问“谁能为此做些什么？”也许问题背后并没有一个数字，所以我衡量成功的方式就是我从客户那里得到的反馈——无论是内部客户还是外部客户。专注于获得非常积极的反馈，确保我的目标是看到人们以正确的方式使用我的功能，并从中获得良好的体验。


  当然，我们也会衡量一些非常实在的指标，以确保我们的客户保持满意度。这些低层次的指标更多是关于服务器正常运行时间、发送时间优化是否有效、人们是否在使用它、细分效果如何、它是否有帮助、不良用户是否被拦截、垃圾邮件报告情况如何、邮件是否被退回，以及其他类似的局部指标。因此，我们关注的是类似这样的运营指标——只是没有那些疯狂的、全局性的愚蠢指标。


  **古铁雷斯：** 你如何知道你正在解决正确的问题？


  **福尔曼：** 这是个难题，因为弄清楚你应该解决什么问题的有趣之处在于，它需要结合用户认为他们想要什么、用户实际想要什么，以及这个领域的发展方向。与用户交谈至关重要，因为他们会为你指明正确的方向。然而，内部或外部用户描述问题的方式，通常是某人已经以特定方式思考和处理过问题的结果，这意味着我们必须弄清楚他们提出的问题方式是否就是*实际*的问题。


  回到前面提到的电梯群例子，也许问题是“我需要你构建一个优化方案来加快我的电梯速度”，而实际上，问题是“我想用任何可能的方式让更多人进入电梯”。根据你解决的是哪个问题，解决方案会截然不同。一旦明白了人们只需要通过（挤进电梯），正确的解决方案就是在那里放上镜子，这样人们就会挤得更紧密。所以你必须非常小心，当人们要求功能或工具时，你实际上解决的是他们根本的问题。


  ***第六章 | 约翰·福尔曼，* MailChimp**


  ***工作中的数据科学家*** 123




