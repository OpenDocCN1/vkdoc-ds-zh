- '# 正文


  整个 20 世纪 90 年代，Leo Breiman 始终在向他所在的统计学界呼吁：“统计学界，让我们拥抱数据吧！” 他在 90 年代末撰写的论文中，敦促所有同事开始参加
  NIPS 大会。这就像他独自在荒野中探索了一番，然后回到伯克利——最早设立数理统计系的院校之一——对所有人说：“你们需要醒醒了，因为外面已经‘着火了’。你们还在忙着证明定理。外面已经火光冲天。快醒醒吧！”


  因此，我认为存在一种强大的传统，即人们认识到通过数据理解世界是多么强大且与众不同。“数据至上”是伯克利一位数理统计学家很久以前用来强调 Tukey 思想的说法。这一强大传统，通过一条近乎异端的思想脉络，从
  John Tukey 延续到 Leo Breiman，再到 2001 年的 Bill Cleveland。尽管他们是足够“异端”的人，但他们都将自己视为正统的统计学家。


  只是，由于统计学每五年就在数学领域加倍投入——因为其起源于数学，这使统计学成为了一门真正的学科——你总能发现这些异端分子在说：“不，你真的应该试着去拥抱数据。”
  我认为，在人物、思想和事物方面，最激动人心之处就在于此——不要被今日之事物所迷惑，而是去寻找那些实际上更为古老的人物及其思想。


  [14](https://www.stat.berkeley.edu/~breiman/wald2002-1.pdf)


  15 Erich L. Lehmann, *一个统计学家的回忆：我所交往的人* (纽约: 施普林格科学与商业媒体, 2008), 198.


