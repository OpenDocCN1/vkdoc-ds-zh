  \ 251\n\n**古铁雷斯：** 到目前为止，在你的职业生涯中，你最引以为豪的是什么？\n\n\n\n**海涅克：** 最令我惊叹的是，我和 Quid 团队一路走来所取得的成就。在\
  \ Quid 的早期，我们制作了一张可视化海报，用网络图来展示初创公司的全景。\n\n当我第一次打印出这张图，并在全体会议上展示给大家时——在此之前我已与团队其他几位成员合作过——这显然非常酷，但当时并不清楚这类工作会走向何方。令人惊叹的是，一方面我很幸运，另一方面我身处一个了不起的团队，我们得以将这个最初的想法付诸实践，并真正去问：“如果我们围绕它打造一个真正的产品，它会是什么样子？”\n\
  \n快进到现在，我们真的围绕这个想法构建了一整个情报平台，人们可以付费购买权限来分析数据，这实在令人惊叹。我们拥有这种范式，它真正帮助人们大规模探索数据，而这正是源于那些早期的想法和分析。这有些令人震惊，能参与将我们的海报变为现实的工作，我感到无比兴奋和荣幸。\n\
  \n**古铁雷斯：** 你典型的工作日是什么样的？\n\n**海涅克：** 这完全取决于我正在处理的事情类型。我是那种会思考如何将各个部分拼凑起来，打造一个可用产品的数据科学家。这意味着，有时我与公司的业务方合作非常紧密。我会为他们生成分析报告，并与他们讨论如何使用这些分析。我努力理解人们提出的问题，并判断我们是否在帮助他们解答问题方面做得足够好。\n\
  \n而在其他日子里，我更专注于技术层面正在发生的细节问题，以及我们实际如何实现这些功能。\n\n例如，今天，我一直在操心模式和元数据的问题。所以我下载了大量文档，逐一检查，确保所有元数据都符合我预期的格式。我还查看了我们工程团队的任务清单，对部分数据处理流程进行了质量检查，并告知工程师处理是否正确。所以，我的日常工作完全取决于我正在从事的项目类型。\n\
  \n**古铁雷斯：** 你如何看待和衡量工作中的成功？\n\n**海涅克：** 作为一家公司，成功归结于拥有满意的用户——并且用户越来越多。这显然会反馈到我们正在构建的东西上。对于一些数据科学家来说，他们的目标是优化系统内部的某个指标，因此非常明确：如果能让那个数字变得更好，他们就赢了。\n\
  \n而在我们这里，我们构建的工具和产品是为了数据探索，所以这更抽象一些。\n\n**第 12 章 | 艾米·海涅克，Quid**\n\n对我们来说，成功在于打造更好的产品，这意味着我们需要很多小方法来评估是否在朝着这个方向前进。我们会关注一些问题：是否有出错的地方？我们是否不断收到反馈，用户非常想要某些他们目前没有的功能？\n\
  \n是否有反馈显示他们因为能实现某个功能而超级、超级开心、欣喜若狂？所以我们着眼的是更大的图景——我认为这是数据科学中非常重要的一部分。\n\n我认为，过去很多人把数据科学看作是优化的一部分。而我们显然更侧重于探索和大局观。所以我们关注的是：我们讲的故事对吗？我们看的数据对吗？你无法真正为此进行优化，所以我们衡量和看待成功的方式更偏向产品和产品设计，除了看到人们真正想用、并且真正在用的结果之外，很难证明。\n\
  \n**古铁雷斯：** 你如何看待和衡量自己的成功？\n\n**海涅克：** 我深怀动力，想要打造我认为有用且重要的东西。当我能登录产品，并用它学到新东西时，这对我来说就非常满足。当我看到我们的用户使用这些工具探索重要的全球性问题时，这真的让人很有成就感。在日常工作中，我重视不断接受挑战和学习新事物。我希望这能转化为我们所做之物的实质性改进。我希望看到其他人因我的成果而获得力量。\n\
  \n**古铁雷斯：** 你从哪里获得研究和分析的想法？\n\n**海涅克：** 来源有几个不同的地方。一部分来自最终用户案例，人们会说：“哦，我真的很想回答这个问题。”\
  \ 然后我们可能会想：“如果我们增加一个额外的功能，就能让你回答这个问题。” 有时可能是他们说：“哦，这个功能并没有按我想要的方式工作。” 然后我们可能会想：“如果我们改进分词方式，就能让它变得更好。”\n\
  \n还有些时候，是我们自己在看数据时想：“可能没有其他人想到过这个，但只要这样做、那样做，我们就能做出人们想要的东西。” 所以，将这些东西拼凑起来并选择做什么，存在着一种有趣的平衡。我认为，选择做什么部分取决于我们个人，部分则源于与公司其他人的大量交流，了解他们想要什么，以及源于产品管理流程。我们有一个很长的愿望清单，上面列满了我们想做的事情。\n\
  \n**工作中的数据科学家** 253\n\n**古铁雷斯：** 你如何判断自己是否在解决正确的问题？\n\n**海涅克：** 嗯，这是个棘手的问题。我认为你必须通过迭代才能找到答案。在\
  \ Quid，我们有很多用户提出的问题，我们认为这些问题值得很好地解答，所以问题在于，我们是否真的在很好地帮助他们解答这些问题？\n\n在这种情况下，时刻把用户放在心上非常重要。深入了解他们，这样你就能像他们一样定期使用产品，发现产品的不足之处，并确保你正努力去修复它。对我们来说，这也意味着：产品是否能满足我们自己的好奇心？\n\
  \n我能否用它快速了解比特币、微生物组或者苹果公司？\n\n可以肯定的是，很容易就会陷入细节的泥沼，因为总有成千上万种不同的算法可以尝试，有数不清的参数调整可以做。你必须努力保持对大局的关注。\n\
  \n此外，也依赖于对什么会带来最大价值的一些直觉。我认为你必须做出决策并付诸行动。我觉得我们这里有一个非常棒的团队，所以当我在处理事情时，有很多人可以和我一起探讨想法，或者他们对正确的方向有非常强烈的见解。\n\
  \n所以，这实际上也关乎充分利用你身边的人才。\n\n**古铁雷斯：** 目前谁的工作在激励着你？\n\n**海涅克：** 我精彩纷呈的推特信息流上那些我觉得有趣的人，总是能激励我。在重大的体育赛事或政治活动期间，看到人们构建各种可视化作品来探索它们，这非常有趣。例如，世界杯期间，谷歌有专门的页面。推特上肯定也有好几个相关页面。翻看和浏览这些内容当然很有趣。皮特·沃登和他的深度学习\
  \ SDK 目前也激励着我。我认为他非常擅长深入一些真正困难的问题，然后从中做出一些非常有趣且出乎意料的事情。所以，这常常是一种激励人心的挑战——思考我们还能做些什么，或者如何能更有创意地运用我们已经在做的事情。\n\
  \n**古铁雷斯：** 做好数据科学工作需要什么？\n\n\n\n**海尼克:** 数据科学已经是一个相当广泛的领域了。有许多方面都可以自称为“数据科学”，或者归于这个标签之下。\n\
  \n对我来说，你首先要做的就是把这样一个想法拼凑起来：“这是一个真正有趣的问题，这里有能够解释这个问题的数据，这里有能够处理这些数据、执行正确操作、并最终得到结果的方法论。”\
  \ 对我而言，关键在于弄清楚如何让这三样东西——正确的问题、正确的数据和正确的方法论——融合在一起。所以这只是第一个阶段——能够设想它们如何结合起来。\n\n\
  ***第 12 章 | 艾米·海尼克，** Quid 公司*\n\n实际上，通常一个不为人知的秘密是，很多时候不仅仅存在一个能解决问题的算法。还涉及到某种形式的人工工作流程。如果你开始仔细研究人们拥有和使用的不同大型算法，你其实就会发现这一点。你会发现，通常存在一个阶段，需要分析师检查某些东西，或者有人把数据集发给“亚马逊土耳其机器人”（Mechanical\
  \ Turk）。这意味着你在如何开展这件事上有很多选择。也许你可以让一些人做一些工作，然后你还有算法和数据，接着你还有问题。所以，把这些部分拼凑起来，并想象它们将如何协同工作——对我来说，这正是魔力产生的地方。\n\
  \n但在此之后，在每一个部分内部，都有大量的艰苦工作，而且你经常会发现一些真正有趣的事情发生。所以，有一些很迷人的算法可以摆弄，还有一些人在拥有敏锐洞察力时做的非常有见地的事情，他们会说：“如果我用这种方法精确地操作，就会产生很酷的结果。”\n\
  \n**古铁雷斯:** 对于刚入门的人，你有什么建议？他们应该努力深入理解什么？\n\n**海尼克:** 我想，他们或许需要从审视自己开始，弄清楚自己真正在意的是什么。他们想做什么？\n\
  \n目前，数据科学是一个有点热门的话题，所以我认为有很多人觉得，如果他们能贴上“数据科学”的标签，那么魔力、幸福和金钱就会随之而来。因此，我强烈建议你弄清楚，数据科学的哪些部分是你真正在意的。这是你应该问自己的第一个问题。然后你要想办法如何在这方面变得擅长。\n\
  \n你还需要开始思考，外面有哪些类型的工作真正符合你的兴趣。\n\n一种策略是，在你需要了解的某一领域内深入钻研。我们团队里有获得自然语言处理博士学位的人，也有获得物理学博士学位的人，他们在物理学中运用了许多不同的分析方法。所以你可以深入一个领域，然后找到那些认为这类问题很重要的人，或者找到你可以用同样的思维方式来解决的类似问题。这是一种方法。\n\
  \n另一种方法是直接去尝试。外面有大量的数据集。\n\n如果你有一份工作，并且正在尝试换工作，试着想想你当前岗位上是否有你可以获取的数据，并可以用有趣的方式进行处理。找个借口尝试一下，看看这是不是你真正想做的事。或者，仅仅是在家里，也有你可以拉取的开源数据。随便探查一下，看看你能发现什么，然后开始摆弄这些数据。我认为这是一个很好的开始方式。目前，“数据科学”这个名头下有很多不同的角色，也有很多工作很可能就是你认为的数据科学，但还没有贴上标签，因为人们不一定使用这个术语。想想你真正想要的是什么。\n\
  \n***《数据科学家在工作》*** 255\n\n**古铁雷斯:** 有什么事情是少数人知道，但你认为未来会变得非常巨大的？\n\n**海尼克:** 我认为，关注点一直放在那些拥有大型网站、有大量用户点击流量的科技公司员工身上，他们利用数据科学方法来优化用户体验，销售大量广告或产品。很多关注点都集中在利用公司自有数据，然后在此基础上进行优化。这种情况会继续下去。\n\
  \n我实际上认为更令人兴奋的是，现在有大量可用的数据，可以告诉我们更广泛的故事，讲述从全球经济或政治体系，到流行病和冲突，再到城市和我们物理环境等一切事物中真正发生了什么。也许你需要稍微不同的工具来分析这些数据，但这种分析真能改变我们做决策或与这些系统互动的方式。我很着迷于这将如何改变那些系统，乃至改变整体的方式。这也可能很危险，对吧？因为你得到的数据可能并不真正具有代表性，然后你可能会得出错误的结论，或者对某些类型的人产生偏见。所以，肯定有一些部分我们必须非常小心。\n\
  \n例如，想想可以从手机传感器数据中收集到的广泛信息。这些信息可以告诉我们人们与城市互动的方式，以及这将如何改变我们城市系统的运作方式。或者，想想关于我们政府立法以及他们如何获得资金的大量数据，这些数据目前很难理解，但可能会改变我们对民主和政府问责制的看法。\n\
  \n我们拥有了所有这些工具，但实际上，我们可以利用的很多信息——当你深挖下去时——目前都未被充分利用。我认为这意味着有很多机会可以用它来做有趣的新事情，并且看到这些事情是什么将会非常迷人。而且，希望更多的是：“我们更好地理解了事物。我们做出了更好的决策。我们建立了一种更好的方式让人们彼此互动。”\
  \ 而更少的是：“哦，这真让人毛骨悚然。我不确定我对这个感到满意。”\n\n**古铁雷斯:** 你对招聘人员有什么想法？\n\n**海尼克:** 目前发生的一件有趣的事情是，学术界因资金削减而陷入困境。所以实际上，有大量非常非常聪明的人，他们刚从计算领域的博士和博士后岗位走出来，正在想：“我想进入工业界，”\
  \ 并且实际上在关注其他人用数据科学做的有趣事情，心里想着自己也许可以尝试一下。但他们通常没有任何商业工作经验，也未必了解与工程团队合作是什么样子，或者在他们工作的基础上构建一个产品是什么样的。\n\
  \n***第 12 章 | 艾米·海尼克，** Quid 公司*\n\n另一方面，我认为有很多人已经在工业界工作了很长时间，他们可能在某个领域没有同样深厚的专业技术知识，但更清楚如何在团队和行业中工作，也明白在他们工作的基础上构建产品是什么感觉。\n\
  \n我认为，总的来说，很难招聘到那些完美的全面型人才，他们知道做什么以及如何做。这非常具有挑战性，所以对于我们做的招聘，我们有点像是在多方面下注，或者将不同特质的人组合起来，或者寻找那些充满激情和热情，并且愿意学习他们未知领域的人。我想，展望未来，这种职业很大程度上将是一种不畏惧持续学习海量知识的职业。所以，这种天赋和态度非常重要。\n\
  \n**古铁雷斯:** 你使用哪些具体的工具或技术？\n\n\n  \n**海内克：** 我们大量使用 `Python` 进行计算。`Python` 是一种非常优秀的语言，相对易于学习，使用起来也相当优雅。\n\
  \n在数据科学工作中，涉及大量的自然语言处理，这方面有现成的工具包，但我们也会编写不少自己的代码，以确保它完全按照我们的需求运行。我们会关注实体抽取、分词和规范化。我们会关注不同的降维方法。我们会关注文本处理中出现的各种问题。\n\
  \n至于我们所做的网络方面的工作，我认为网络科学领域很有趣，因为它是一个相对小众的社区。可能了解它的人更少。在过去 20 年里，已经有很多非常酷的研究成果。图论已经发展了很长时间，但直到最近，人们才真正拥有大型网络数据集，能够研究网络的结构及其意义。关于如何识别网络中的有趣节点、如何发现网络中的社区，或者网络的哪些属性具有意义，这些方面的研究都非常活跃。\n\
  \n所以，这是一个非常有趣的社区，我们一直与之互动，也是我们新技术的重要来源。\n\n有一点可能有点令人惊讶，那就是我们发现与我们工作最相似的应用领域实际上是在生物信息学。例如，加州大学旧金山分校的佩茜·巴比特领导的一个实验室正在对蛋白质进行分析，他们观察大量的蛋白质，相互比较，利用网络可视化进行检验，然后通过大规模分析这些蛋白质，找出科学研究的线索。他们的结果让他们能够告诉其他科学家：“这些蛋白质中很可能有一个会做有趣的事情，”或者“也许你应该去研究这个，”或者“这种蛋白质可能告诉我们这些蛋白质的进化历史，因为它起到了桥梁作用，”或者“这个结果实际上非常令人惊讶。”他们能够为关于做什么科学的决策提供背景信息。实际上，有很多相似之处，这有点令人惊讶，因为它们是截然不同的领域，但当你在这样意想不到的地方发现这些相似之处时，也很有趣。在招聘具有相关知识的人才时，这也很有用。\n\
  \n**古铁雷斯：** 你和你的数据科学同事们目前正在讨论什么有趣的事情？\n\n**海内克：** 有一件事非常有趣，那就是我们的讨论经常回到伦理问题和对数据使用的担忧上。我认为这反映了一个事实，即许多正在进行的数据科学研究实际上是在分析人，也许是在分析那些不想被分析或不知道自己被分析的人。我总体上是一个相当注重隐私的人，想到我的浏览器历史记录被追踪，会让我感到有点不安，而且我认为对很多人来说可能也是如此。我认为现在确实可以做一些令人毛骨悚然的事情。而且我认为，我们和这个社区都有责任认真思考我们的行为，明智地选择我们要解决的问题，以及我们行为的后果。\n\
  \n我确实认为有很多问题需要解决，而这些并不涉及追踪人们并让他们购买可能并不想要的东西。有很多非常重要的问题需要解决，这些问题将帮助人们更好地完成他们想要和需要做的事情。当你这样思考时，就越来越难以理解全球正在发生的事情——具体来说，就是那些可能影响政治家做出重大决策的事情，或者帮助我们理解本应关注和关心的重大社会变革的事情。有一些重大的全球性问题值得我们担忧，而相关的数据可以帮助我们解开谜团，更好地理解正在发生的事情，从而能够更有效地应对这些问题。\n\
  \n有一些很棒的团体正在鼓励人们运用数据科学技能来解决政府或非营利组织的问题。当我们思考这类问题可能和应该产生的影响时，我们会感到更加欣慰。因此，我认为这包含三个方面。第一，不要认为数据科学的一切都是为了追踪你或做一些邪恶的事情。它还有其他用途。第二，如果你正在找工作，要明白外面有很多非常酷的应用案例，不要满足于那些让你对工作内容感到不舒服的职位。最后，不断质疑并考虑你行为的后果。\n\
  \n"
- "# 第 13 章 | 维克多·胡，Next Big Sound\n\n**维克多·胡**是 Next Big Sound 的首席数据科学家。Next Big\
  \ Sound 是一个在线音乐行业平台，根据唱片公司提供的详细报告，追踪艺术家在社交媒体、广播和传统销售渠道中的受欢迎程度、盈利能力以及粉丝行为。Next Big\
  \ Sound 目前追踪着超过三十个互联网和社交媒体平台上数十万艺术家的当前受欢迎程度和未来发展趋势。同时实现这两项评估并非易事。音乐听众群体的增长和分化、粉丝通过社交媒体与艺术家互动的速度和即时性的提升，以及销售渠道数据的复杂性，都给如何处理缺失数据、如何解决命名实体识别问题以及如何确保预测新兴人才的准确性带来了挑战。\n\
  \n在加入 Next Big Sound 之前，胡的职业生涯包括为美国国防部工作、在 Milliman 公司从事精算咨询，以及为纽约洋基队进行统计分析。还在哈佛大学时，胡就主动将自己的简历和棒球分析报告寄给了洋基队，他们迅速录用了他。他为洋基队所做的工作曾被《体育画报》报道，该刊将他评为“25\
  \ 位 25 岁以下精英”之一，并被《纽约杂志》报道。胡随后利用社交媒体预测音乐趋势和艺术家销量的工作，也被《福布斯》、西南偏南音乐节等媒体报道。胡拥有哈佛大学统计学硕士学位和应用数学学士学位。\n\
  \n胡展示了数据科学家如何将数学和统计技能应用于体育、精算金融、国防和音乐等截然不同的领域。追求广泛兴趣和梦想的自由，是胡谈论如何通过数据智能应用造福每个行业、如何选择项目，以及与使用其成果的人合作、协作并建立联盟以确保产生持久影响的重要性的背景。胡坚信数据科学能够改变即使是最传统的行业，这一信念贯穿于他的整个访谈。\n\
  \n**塞巴斯蒂安·古铁雷斯：** 为什么数据科学让你感兴趣？  \n\n\n\n### Victor Hu:  \n我认为当今世界存在数据爆炸，我们存储和分析数据的能力正在迅速扩展。伴随数据扩展的分析技术发展速度并未完全同步，因此人们可以研究的产品、用数据解答的问题以及受影响的行业，其潜力都在爆发。这非常令人兴奋。数据能在众多行业产生巨大影响。最激励我的莫过于此——那些非常传统的行业——金融、医疗、公共政策、音乐、体育，几乎任何领域——都能从数据的智能应用中受益。\n\
  \n### Gutierrez:  \n请谈谈从大学到美国职业棒球大联盟的经历。\n\n### Hu:  \n我在哈佛大学的本硕阶段学习了数学和统计学。很长一段时间里，我不确定自己想用这些技能做什么。\n\
  \n人们总告诉我：“有了数学学位，你什么都能做”——我觉得这很有趣。我不确定这是否一定正确。我认为数学可以应用于许多行业，但方法往往相似。\n\n我最早的灵感之一来自阅读迈克尔·刘易斯的《魔球》¹。他率先提出了数据正在改变棒球行业的概念。那是我最早真正认识到智能数据分析力量的事例之一。我认为，甚至早在“数据科学”术语真正流行之前。然而，所有棒球运营部门的人都在提供非常有价值的见解，这些见解或许违背了常规。显然，每当试图这样做时，总会遇到阻力。最终，由于它如此成功，并且存在一个无可争议的事实——更多数据带来更好洞察，这现在已成为棒球决策的重要组成部分。听到并读到这些，看到你可以在一个从未想象过的行业中产生如此巨大的影响，这非常鼓舞人心。\n\
  \n这就是我最初进入体育领域的原因。我想做大量这类工作，并尽早参与其中。我成为了洋基队的实习生，是他们为进行这类分析而雇用的首批两人之一。这非常激动人心，因为感觉像西部大开发。任何事情都有可能——我想做或他们想做的任何事情都有可能，我们尝试了非常多不同的事情。我认为这也是当今数据科学最令人兴奋的一点。\n\
  \n¹ 迈克尔·刘易斯，《魔球》（W.W. Norton & Co.，2004）。\n\n***数据科学家在工作*** 261\n\n### Gutierrez:\
  \  \n你在洋基队的经历中学到的重要一课是什么？\n\n### Hu:  \n我认为学到的最重要的教训之一是说服他人有多么关键。作为数据科学家的一大挑战——人们通常可能不会想到——是你得出的结果或见解必须合理且具有说服力。你让它们越容易理解，你的建议就越有可能被付诸实施。这是你必须非常注意的事情。\n\
  \n你不能躲在洞穴里，生成所有没人理解、没人能用的酷东西。\n\n我们遇到过很多情况，我提出的建议或多或少会违背传统智慧。在这些情况下，我不得不在数据和实际应用之间做出妥协。\n\
  \n### Gutierrez:  \n请详细谈谈其中一种情况。\n\n### Hu:  \n一个例子是，当我研究击球阵容决策，试图为洋基队找出最高效的阵容时。我的一条建议是，把一个更擅长上垒的重炮手——当时一位大名鼎鼎的重击手——放到更靠前的位置，因为这能产生更多得分。然而，这大大违背了关于谁应该排在击球阵容前列的传统智慧。传统智慧认为，速度快、善于盗垒、不会打出双杀打的球员应该排在前面。一个脚步缓慢的重击手会打出很多双杀打，所以传统智慧认为应该把他放在后面。此外，还有一个很大的顾虑：他不会接受在阵容中前移，因为他将自己视为强力击球手，这意味着应该排在击球阵容后面。因此，在设计模型时，我未能考虑到很多现实生活中的顾虑。\n\
  \n最终，我们达成了一个妥协，涉及使用另一位不同的强击手来代替那位重击手。这位强击手当时在球队名单上，他也有不错的上垒率。我们最终把他移到了阵容的第二棒，因为他更愿意接受这次调整。\n\
  \n我认为这之所以可能，是因为他成长的文化环境——在那里，对你在阵容中击球位置并没有太多的关注或污名。这是一次非常重要的教训，关乎如何平衡数据与人员。始终牢记你正在向其提出建议的人，这一点非常重要。\n\
  \n### Gutierrez:  \n你在洋基队、美国国防部以及现在的 Next Big Sound 等不同组织工作过，你的关键关注领域是什么？\n\n###\
  \ Hu:  \n技能习得一直是我思考的问题——我总是在学习新东西。\n\n这很有趣，因为我觉得作为数据科学家，你需要的技能肯定有不同分支，它们相互交织，但当你学习它们时，它们几乎是独立的领域。例如，有沟通方面：如何有效地传达你的发现，如何说服人们采纳它们？这在很大程度上与有效的写作和有效的数据可视化有关。这是我认为会随着可视化软件的发展而不断改进的一项非常重要的技能。\n\
  \n还有机器学习技术分支，它在不断演变。多年来，很多技术已被更广泛地接受。话虽如此，每天人们都在对这些技术进行令人兴奋的新调整或创新。尤其是在更复杂的问题上，比如文本分析，这些技术也在不断发展——因此，了解可以应用的最先进的机器学习技术以及哪些实现更好，这一点很重要。\n\
  \n还有数据管理分支，它涉及存储和之后检索数据的整个后端。当我处理较小规模的数据集时，比如在棒球或精算领域，我并没有完全理解这个分支。这是因为我们使用的数据量在一台或几台机器上相对可控。但现在我们开始处理越来越大的数据集，必须处理存储海量数据的整个后端、能够之后访问数据，以及在其上运行算法，这绝对是一个巨大的挑战。\n\
  \n我认为传统机器学习算法的并行化仍然是我们正在努力解决的问题，尤其是要找到最高效的方式。我很期待看到它如何继续发展。\n\n### Gutierrez:  \n\
  你是如何学习各个分支的新技能的？\n\n\n\n\n**胡：** 我认为无论是作为演讲者还是参会者，参加行业会议都是保持信息更新的绝佳方式。我曾主持过 2013\
  \ 年芝加哥预测分析创新峰会的一日活动，并有机会与每位演讲者进行简短交流。聆听他们学到的新知和前沿探索总是令人振奋，因为你不可能同时掌握所有动态——时间根本不够用。我记录了许多从其他演讲者那里学到的内容，非常希望能将这些方法融入我们的工作流程。\n\
  \n除了会议，线下聚会、书籍和讨论小组也是保持与时俱进的好方法。纽约市有很多线下聚会活动，虽然很难追踪所有活动的动态，但只要听说有趣的演讲或好书，我一定会参加或阅读。\n\
  \n还有许多讨论小组会引发大量自由交流的讨论。我认为纽约市的数据科学社群联系非常紧密。\n\n例如，上周末我参加了 DataKind 组织的\"数据潜水\"活动，遇到了很多过去三年间活跃在这个社群的老朋友。看到这种跨领域的交集非常棒。每次遇到数据科学家，我们都能交流专业话题，了解他们各自领域的动态。这之所以绝佳，是因为我们的工作在很多方面都有交叉，因此也是跟上行业动态的好方法。\n\
  \n**古铁雷斯：** 请谈谈 Next Big Sound 研究的社会与音乐产业数据。\n\n**胡：** Next Big Sound 通过追踪不同数据信号为音乐产业提供分析与洞察，帮助唱片公司、艺人和乐队经理做出更明智的决策。为此，我们聚焦的数据整合了社交媒体数据、销售数据、电台播放数据、活动数据以及任何可获取的专有数据，为音乐产业提供背景信息和跨领域洞察。我们追踪至少\
  \ 30 个不同社交媒体平台的动态——`Spotify`、`Facebook`、`YouTube`、`Twitter`，应有尽有——并将这些数据与唱片公司的销售数据相结合。这些数据相当精细化，具体到每位艺人每日的专辑和单曲销量，并经常按不同地理区域和人口统计特征进行细分。\n\
  \n**古铁雷斯：** 你们想通过收集的数据回答什么问题？\n\n**胡：** Next Big Sound 最初的愿景是：如何发现下一个大热的声音？我们的核心理念是，借助数据（特别是社交数据）可以更好地做到这一点。因此我们利用各种数据集分析几个不同方面：第一，社交媒体对销量的影响；第二，电台对演唱会的影响；第三，活动对流媒体播放的影响；接着是预测专辑销量或未来社交媒体互动的能力。当艺人举办演唱会或电视亮相时，对社交媒体和销量有何影响？我们能多大程度量化这种影响？最后，如何发掘新兴艺人？\n\
  \n有趣的是，你完全可以在早期阶段就发现谁即将走红——比如几百人在 SoundCloud 上收听某位艺人的某首单曲时，就能看出谁将成为下一个贾斯汀·比伯、凯蒂·佩里或坎耶·韦斯特。你可以观察到艺人的成长轨迹。例如，戈提耶在\
  \ 2011 年发行了大热单曲《某个我曾经熟悉的人》。在这首歌爆红之前，他在澳大利亚以外相对默默无闻。然而，如果你当时在 SoundCloud 上观察，就能发现这首歌刚发布时，他已是增长最快的艺人。在被主流唱片公司签约、在任何人知道他之前，仅凭这项指标他就连续数月位居榜首。如果你追踪这些数据，就会知道他将大红大紫，尽管他是在几个月后才被签约的。因此我们构建的一个工具本质上就是对这些指标的逆向查询：谁在特定周、月、年获得最多\
  \ SoundCloud 播放量？这基于我们拥有的全部数据，实际上我们可以建立一个数据库来实现这种网格化分析。\n\n**古铁雷斯：** 谁觉得这些数据有价值？\n\
  \n**胡：** 整个音乐产业。主流唱片公司是我们的最大客户。向这些公司提供关于该签约谁的洞察显然极具价值。我们最近签署了一份唱片合约，将提供具体的艺人推荐和未来一到两年内谁将走红的预测，如果他们签约该艺人，我们就能从合约中获得一定比例的分成。除了唱片公司，我们还与推广方、乐队经理和艺人本人合作，因此覆盖了整个产业链。我认为关键在于成为音乐产业的思想领袖。\n\
  \n例如，去年我们发表了一篇关于社交媒体如何影响销量的研究报告。我们根据各平台对销量的实际影响力进行排名，并展示如何根据你在不同平台的表现预测未来专辑销量。我们发现了颇为惊人的洞察：维基百科具有惊人的预测效果。我们必须谨慎，不能简单地说\"\
  你需要引导人们访问你的维基百科页面\"，尽管这在一定程度上成立——维基百科是人们对艺人产生更深兴趣的代理指标。如果有人确实足够关心你、想了解你的背景、过往发行的歌曲以及合作过的对象——如果她想知道的不只是听过的那首热门单曲——那么这个人就更有可能购买你的专辑。我认为这个洞察在音乐产业中非常出人意料。在我们发布之后，这项研究和结论被整个音乐产业广为引用。\n\
  \n最近我们还拓展到娱乐产业的新垂直领域。例如，我们成立了图书部门，正在开展类似的研究：社交活动如何与出版业的销量产生关联。\n\n**古铁雷斯：** 你加入\
  \ Next Big Sound 后参与的第一个项目是什么？\n\n**胡：** 我参与的第一个项目实际上是尝试清理数据。我们的数据来自不同来源、不同社交媒体平台和不同\
  \ API，包括客户和数据提供商提供的各种信息。这些来源极其多样，都需要集成到仪表盘中。我们遇到的问题是必须处理缺失或错误的数据。我认为这是每家公司都会面临的问题。\n\
  \n我最初尝试做的一件事是，看能否用机器学习预测哪些数值明显错误。我们发现的一个问题是，系统中存在大量错误关联的用户档案。例如，我们看到贾斯汀·比伯在 Twitter\
  \ 和其他几个平台上都是最受欢迎的艺人，这符合预期。但因为他太出名，很多其他艺人的档案会被错误地关联到他的 Twitter 账号。如何系统性地捕捉这类重要问题，就是我参与的首批项目之一。\n\
  \n**古铁雷斯：** 你们数据团队是如何组织架构并协同工作的？\n\n\n\n\n"
- '# 排版后的文本


  **胡：** 我们团队的成员在不同时间处理不同事务。团队中有数据工程师、数据科学家、前端工程师，以及掌握全栈技术的成员。我认为大多数人都会说自己是全栈工程师。这里并没有像大公司那样严格划分角色，这种模式非常好。我们会根据当前周期负责的项目进行自我组织，而不是固守特定职位。虽然我们是一家相对晚期的初创公司，但这里的工作环境很棒，因为每个人都要参与各类事务，几乎没有层级制度带来的限制。


  我们的工作以两周为"周期"。每两周所有人会聚在一起，自主选择想要参与的项目。两周后举行演示日，展示已完成的项目和取得的进展。我们会评估下一步方向，然后重新选择项目。就这样在极短的迭代周期中工作。


  这种模式源于我们工程副总裁一直倡导的理念——快速失败。


  **古铁雷斯：** 其他团队是否也应该采用两周项目周期？


  **胡：** 如果具备实施能力，我认为这非常有意义，理由显而易见——能提升士气和投入度。由于项目是自主选择的，人们会更有兴趣参与其中。这或许部分归因于我们行业的特殊性，但自主选择工作内容并感受到对公司的投入，确实能全面激发工作动力。


  当然，维护这种周期系统也面临诸多挑战。主要问题在于：如何确保成员责任感？如何让成员充分了解信息，以便他们选择最有利于公司发展的项目？这确实具有挑战性，但如果具备实施这种架构的能力，就能打造更敏捷的工作环境——你可以迅速融汇在会议中学到的新知识，甚至能立即实现洗澡时闪现的灵感。不会陷入缺乏反馈的长周期项目泥潭，而反馈恰恰至关重要。我完全认同快速迭代和快速失败的理念。


  ***第十三章 | 维克多·胡，Next Big Sound***


  **古铁雷斯：** 你如何选择要提议或参与的项目？


  **胡：** 这个问题我思考过很多次，相信每位数据科学家都会面临这个难题。我的理论是：关键在于产出对受众或客户有用、甚至不可或缺的东西。


  这意味着，我通常不会过分关注理论性技术。我认为这是在初创公司或快节奏环境中工作的必要特质。因此在这个岗位上，我主要思考的是：我们的客户或潜在客户当下最迫切的需求是什么？


  这需要与产品团队和客户团队紧密合作，了解他们真正关心的洞察。我们用`Trello`追踪所有产品，团队会汇总历年来客户提出的所有数据科学相关问题。


  我们不断在看板上添加新的问题。提议或选择项目的关键在于确定这些问题的优先级，始终致力于呈现客户当前最关心的项目。


  当然，我们始终在权衡理论与实用性之间的矛盾——理论有趣但可能枯燥的实用方案之间。有很多理论课题我特别想深入研究，也觉得非常有价值，但当产品团队或客户团队听到时，反应往往是：

  "天哪——你为什么要花时间研究这个？这太愚蠢了。"经过讨论后，我会综合这些反馈，将有趣的理论与客户需求相结合。


  **古铁雷斯：** 请谈谈你最近参与的一个项目以及发现的洞察。


  **胡：** 去年我参与的最有趣且影响力最大的项目，是预测潜力新人的模型。这其实从公司创立之初我们就想实现。真正让项目成为可能的是数据梳理和明确我们实际拥有的资源。当然，在此之前我们已经尝试过各种方案。这个项目的转折点在于那个"顿悟时刻"——我们意识到之前项目失败的关键在于选错了成功指标。


  在音乐行业，衡量成功的方式有很多种：艺术家职业生涯的不同阶段、各种里程碑事件都可能被视为重要指标。但要真正构建预测模型，必须明确你想要关注的核心输出指标。经过多次讨论，我们最终确定的成功指标是`Billboard
  200`。如果我们将这个问题的关注点定义为"那些创作出位列`Billboard 200`热门专辑的艺术家"，就能获得非常实用的衡量标准。


  ***《数据科学家在工作》第 267 页***


  这个指标有三个优点：第一，随时间保持一致性；第二，与我们关注的艺术家排名相关，能排除误差干扰；第三，历史数据与未来数据均可获取。不过，虽然数据可得，但获取过程需要大量整理工作。当我们掌握数据和成功指标后，就能进行预测。建模过程中的特征选择本身也是独特的挑战，但最关键的是明确预测目标。


  **古铁雷斯：** 在创建模型之前需要做哪些准备工作？


  **胡：** 在项目启动前，我们做了大量后端工作：将所有时间序列数据加载到可查询的数据库中，能快速获取播放量最高、播放增长率最快、跨平台总量最大等维度的热门艺术家排名——而不是逐一查询每个艺术家的数据。


  完成这些基础工作并确定预测框架后，才能真正进入激动人心的建模阶段。


  我想强调的是，从准备到真正建模需要投入大量前期工作。你必须思考：想要解答什么问题？现有数据能回答什么问题？


  很多人忽略了这种耗时的工作，以及所需行业知识和自有数据认知的重要性。这是很重要的一课。


  **古铁雷斯：** 进入建模阶段后，具体流程是怎样的？


  **胡：** 建模无疑是迭代过程。起初我们尝试用理论模型直接套用，很快发现很多因素在初始构思时被忽略了。例如，大多数艺术家并未关联所有社交媒体平台。这就产生了特殊的数据特征——关于某位艺术家的每条数据记录可能只包含少数指标，且在整个艺术家数据集中各不相同。




  ### 背景与问题发现


  此外，尚不明确这种现象是系统性的，还是仅仅表明艺术家尚未接入该网络因而暂无数据。这无疑是数据中的一个异常方面。我在运行模型时意识到了这一点，突然间，所有未连接特定网络的艺术家排名都非常靠低——例如，`Kanye
  West` 没有连接`Facebook`或类似网络，因此他的预测值非常低，而这显然不符合常理。


  ***第 13 章 | Victor Hu，Next Big Sound***


  我们不得不回头想办法处理这个问题，所以这确实是一个反复迭代的过程。这正是大量统计检验发挥作用的地方，你可以看到，某人未连接网络这一事实本身确实提供了大量信息。最终，我不得不将其编码为模型的一部分——网络的存在与否成为了预测变量之一。这就是我们在建模过程中发现的音乐数据中一个有趣且不同寻常的方面。


  **Gutierrez：** 你们的数据栈中使用哪些工具？


  **Hu：** 在数据分析方面，我们主要是一个`R`语言团队。我们的全栈技术主要是`Java`和`PHP`，不过建模工作是在`R`或`Python`中完成的。我们的数据存储在`HBase`中，然后我们通过`Pig`将其提取出来，并通常存储在用于事件的`Mongo`数据库中。很多时候，我们会使用`SQL`数据库来处理时间序列数据，只是为了让数据科学工作更简单。可视化部分则使用不同的工具完成，有时我们会用`R`，其他时候会用`D3.js`。


  实际上，我们目前的一大重点是做更多的`D3.js`可视化。


  我们使用的工具更新换代非常快。就在几个月前，我们所有的数据还存储在`Cassandra`中。我们在最近一个月左右才转向了`HBase`。现在，我一直在使用`Pig`和`Hive`配合我们更偏向`Hadoop`的数据后端。我确信明年我们会使用不同的工具，或者现有工具会演变成新的形态。所以，新技术涌现的速度确实令人震惊。


  在我最近参加的一次会议上，`PrestoDB`是一项新技术，被广泛宣传为比`Hive`更快的版本。我们一直在努力将`R`或`Python`与后端的`Java`以及前端的`PHP`连接起来。根据涌现的不同技术，有几种不同的方法可以实现这一点。关键在于使用当前有效且符合需求的技术，而不必太过担心两年后的事，因为届时一切可能都已改变。


  **Gutierrez：** 鉴于变化之快，您如何看待招聘或将新成员融入团队这件事？


  **Hu：** 在这个时代招聘数据科学家非常令人兴奋，因为在某些方面，这项工作还没有既定的指导方针。人们在众多不同领域拥有技能。我记得在招聘第二位数据科学家时，我有一些特定的要求。我当时的原则是招聘那些能做到我所不能，或者至少在我知之甚少的领域拥有广博知识的人，这样我和整个团队都能学习并受益。我们将成为互补的拼图。


  我认为，无论招聘的是数据科学家还是其他职位，我们始终追求的是：寻找非常聪明、能够快速学习的人。我认为这是当今数据科学中的一个重要组成部分，因为没有人知道所有答案。对于许多事情，并不存在既定的


  ***《工作中的数据科学家》*** 第 269 页


  操作手册，所以你确实必须能够吸收任何在当时看来新颖有趣的东西。这就是我们招聘时看重的几大特质：聪明、掌握数学、统计学和编程基础、能够快速学习并吸收新技术，并且拥有我们尚不具备的知识。


  **Gutierrez：** 对于正在招聘第一位数据科学家的人，您有什么建议？


  **Hu：** 当我作为第一位数据科学家被`Next Big Sound`聘用时，团队中已经有许多人非常精通数据，只是可能没有足够的带宽或特定的统计学背景来完成某些工作。因此，他们有能力评估数据科学候选人的质量。如果你没有那样的背景，我认为很难真正辨别不同数据科学家水平的优劣，因为目前这行人员水平的差距真的很大。


  如果你不具备一些机构内部的知识，就很难判断谁合格谁不合格。这一点尤其正确，因为大多数大学里还没有非常成熟的相关培养项目。话虽如此，现在确实有很多新项目正在兴起，所以未来情况可能会改变。


  目前，很多人通过在线课程和自己动手实践来学习，我认为这很棒。我招聘时看重的是那些做过项目的人，特别是那些使用机器学习提供过具体见解，并且懂得如何沟通这些见解的人。


  **Gutierrez：** 对您来说，提供具体的见解意味着什么？


  **Hu：** 归根结底，如果你没有改变客户或你所处行业的行为，那么你的见解或工作的价值就很难评估。所以，这就是我每天都在思考的问题，在我所做研究中。我问自己：我正在构思的新产品能力，真的会改变音乐行业某人的工作流程吗？这项研究会改变他们发现艺人的方式、营销艺人的方式、决定巡演或发行专辑的方式，或者任何能影响他们决策的事情吗？这一系列问题适用于任何行业和任何数据科学领域。


  最近在`DataKind Data Dive`做志愿者工作很好地说明了这一点，因为在那里，我们试图影响的是那些真正触及成千上万（甚至数百万）人的非营利组织。我们与联合国、世界银行和国际特赦组织等机构合作。我负责协助国际特赦组织的项目，我们在短时间内取得了很大成就，因为他们能够即时反馈哪些具体产品或见解会真正影响他们的日常工作。让非政府组织的代表以及拥有行业特定知识的人，在整个周末与数据科学家紧密合作，我认为这正是使项目更具影响力和成功率的关键。拥有这种快速反馈至关重要。


  ***第 13 章 | Victor Hu，Next Big Sound***


  你等待确认所做之事是否正确或有用所花的时间越长，你就有可能花更多的时间在错误的方向上。


  **Gutierrez：** 所以，拥有数据、成功指标和模型还不够——你还需要有影响力的反馈。


  **Hu：** 确实如此。重申一下，我认为有影响力的反馈是一个非常容易被忽视的东西，也是我随着时间的推移真正学会去寻找的东西。你确实需要从你提供见解或与你互动的人那里获得反馈，因为很容易陷入你自己的象牙塔里。


  很容易倾向于提供漂亮的数学见解或应用非常复杂的算法，然后才发现你提供的东西没有任何实际影响。这一点尤其重要，因为很多机器学习技术不易于解释。我认为，在大多数情况下，你更希望拥有一个易于解释的算法和结果，而不是一个稍微精确一点的算法。


  **Gutierrez：** 您认为哪些技术或方法是数据科学的未来？




  '
- '# 采访维克多·胡


  **胡：** 所以毫无疑问，首要的就是自然语言处理。每个人都觉得它有趣，每个人都关心它，每个人都认为其中蕴藏着巨大潜力。然而，目前还没有人真正有效地实现它。我相信它及其未来。无论在工作中还是在空闲时间，只要有机会，我就从事自然语言处理项目。当我们——是“当”而不是“如果”——解决了理解情感倾向并从大量文本中提取意义的问题时，我认为这将真正改变数据科学在几乎所有领域的影响力。


  **古铁雷斯：** 你最近处理过哪些非工作相关的数据集？


  **胡：** 正如我之前提到的，我最近一直在做的一个重要非工作项目是 DataKind。他们的使命本质上是“数据科学造福社会”，所以他们把数据技术人员与拥有优质或有趣数据的非政府组织联系起来，然后我们共同合作，为他们提供洞察。这是一个伟大的使命。我最近参与的一个项目是与一个非营利组织合作，该组织致力于通过在线留言板的数据来抓捕儿童犯罪者。这是一项崇高的事业，这个项目涉及大量的文本处理。值得注意的是，目前非政府组织对这些数据的利用实在太少了，而
  DataKind 确实能够提供帮助。


  强大之处在于，我们能够提供一些简单的洞察，比如：“这些是您的数据中人们正在讨论的话题，这是您如何据此识别目标人群的方法。”然后我们可以将这些代码提供给该组织，并为他们提供一种简单的方法，让他们能够持续运行这套程序。因此，这种能够相当快速地应用聚类算法——几小时内就能完成、并且可重复操作——的想法非常强大。经验是，相对快速简单的方法，确实能够为那些数据尚未被充分利用的非营利组织和任何行业提供有价值的洞察。最终令人鼓舞的是，我们共同努力确实能够产生影响。


  **古铁雷斯：** 对于后起之秀，有什么是他们应该真正理解的吗？


  **胡：** 有几点。首先，你必须要会讲故事。归根结底，你所做的是深入探究一个系统、一个组织或一个行业运作的基本原理。但为了让人们觉得有用且易于理解，你必须讲述一个故事。


  能够写出你做了什么，以及能够说出你的工作，这是非常关键的。同样值得理解的是，你可能不必过于担心你正在使用什么算法。更多的数据或更好的数据胜过更好的算法，所以如果你能建立一种方法来分析并获取大量优质、干净、有用的数据——那就太棒了！


  **古铁雷斯：** 对于一个刚开始进行数据收集的组织，您会如何向他们传达如何正确捕获这些数据，或者如何正确地进行编码？


  **胡：** 这是一个非常棘手的问题。我认为智能地存储数据是人们可能不会考虑的事情，因为在获取这些数据时，他们并没有预见到数据科学组件将如何契合以及他们能用数据做什么。因此，随着数据科学变得越来越流行和重要，建立相应机制以获取所需的数据是至关重要的。不幸的是，我认为只有深入挖掘之后，你才能真正知道自己需要什么。所以我不会因为有人在项目进行到一半才发现没有所需数据而责怪他们。这种情况经常发生，甚至在我们
  Next Big Sound 的工作中也是如此。关键在于要尽可能早地意识到这一点，所以也许可以仔细思考一下你想要做什么，弄清楚你是否拥有这些数据，如果没有就去获取它。


  在 Next Big Sound，我们从 2009 年开始追踪社交媒体数据，我们之所以能够进行此类横截面分析，唯一的原因就是我们拥有这些数据。没有其他人拥有每位艺术家多年的每日数据记录，或者他们在特定日期获得了多少
  Facebook 粉丝，或者他们的 YouTube 播放量是多少。你真的需要提前仔细思考你想要做什么。


  **古铁雷斯：** 仅仅是数据集本身就是一个非常有价值的资产吗？


  **胡：** 没错。我们提供的很大一部分价值都基于我们所拥有的数据。此外，我们还有一个仪表盘，可以让你在一个地方看到你所有的数据。这也是我学到的一点——仅仅将你所有的数据放在一个地方，易于访问，便于针对不同问题进行查询——这本身就对绝大多数人来说极其有价值。在很多情况下，你甚至不需要高级的机器学习就能完成很多事情。一个简单的
  `group by` 查询就能让你走得很远。永远不要忘记这一点。


  **古铁雷斯：** 你为什么个人如此相信数据和数据科学？


  **胡：** 首先，我相信数据有改变行业的力量。


  这归根结底是每天驱动我的动力，也是吸引我加入 Next Big Sound 的原因，更是让我对未来充满信心的原因。我们不仅能够改善对音乐的理解以及音乐行业的运作方式，还能在各个领域改善人们的生活——比如保护儿童免受侵害，或是支持人道主义工作，又或是培养出更优秀的棒球运动员。


  每个领域都可以，并且我认为，都将在不同程度上被数据所革命。


  与人们紧密合作，深入挖掘他们的需求，讲述你所做的事情的故事，以此真正激发人们的兴趣并有效传达你的信息，然后进行宏大思考——这些都是重要的事情。我非常期待看到数据将如何触及不同的领域和行业，也很兴奋能成为这个未来的一部分，为改善人们的生活做出贡献。


  '
- '# 第 13 章：基拉·拉丁斯基 – SalesPredict


  **基拉·拉丁斯基** 是 SalesPredict 的首席技术官兼联合创始人。该公司利用机器学习和预测分析来提供“客户生命周期智能”。


  SalesPredict 通过帮助销售人员识别真正的潜在买家，并提供赢得业务的洞察，来提高公司的收入。通过使用销售数据、客户关系管理软件以及来自网络和其他数据源的信号，SalesPredict
  为公司特定的高价值客户构建模型，然后利用预测分析来增加潜在客户数量和转化率，同时加速销售周期并减少客户流失。由于成功的客户购买历史数据集通常很稀疏，并且场景高度特定，因此要在噪声中找到正确的信号极具挑战性。


  拉丁斯基是构建这项技术和这家公司的合适人选。她的工作横跨多个领域：构建利用网络信息的算法、开发预测性数据挖掘工具，以及利用关于世界动态的数据来预测未来事件。事实上，在以色列理工学院和微软研究院进行博士研究期间，拉丁斯基因开发了能够对重大全球事件（包括骚乱和疾病疫情）发出早期预警信号的预测算法而赢得了国际声誉。2014
  年，福布斯将拉丁斯基评为“以色列最具影响力的 50 位女性”之一。2013 年，她被《麻省理工科技评论》评为“35 岁以下 35 位青年创新者”之一。拉丁斯基是
  O''Reilly Strata、TED 演讲和 WWW 等会议的常客和思想领袖。




