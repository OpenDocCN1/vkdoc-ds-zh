- '# 第 14 章 | 基拉·拉丁斯基，SalesPredict 公司


  *拉丁斯基是那种致力于预测未来，并拥有成功预测记录的数据科学家典范。在谈论她对霍乱爆发预测的研究、对发展中国家骚乱原因的分析，以及对鱼类死亡和石油泄漏的研究成果时，她展现了对数据预测力量的理解。这支撑了她对
  SalesPredict 重要性的阐述，以及她对该产品最终将帮助塑造公司各级决策的预测。拉丁斯基的访谈充满了她对挖掘人类知识与经验数据以建议、预测和应对未来事件的热情。*


  **塞巴斯蒂安·古铁雷斯：** 请谈谈你的工作。


  **基拉·拉丁斯基：** 我是 SalesPredict 的首席技术官兼联合创始人。在 SalesPredict，我们致力于改变企业间的商务方式。


  尽管如今几乎每家公司都拥有关于其销售方式及历史销售业绩的大量数据，但他们缺乏从数据中推断出有用信息的科学能力。这正是我们的用武之地。我们的算法分析公司的历史数据，并告知他们：


  “这些是您需要销售的对象，这是接近他们的最佳方式，这些是您需要接洽的公司。”这就是我为何对 SalesPredict 的工作如此兴奋，因为我们有能力运用数据科学，通过为其增加一层可预测性，来改变整个经济的运作方式。


  我们成立已有三年。最初，我们启动了一个运行时间不到一个月的试点项目，并帮助试点客户取得了巨大成果。通过使用我们的产品，他们的销售管道翻了一番，资格认定时间减少了
  90%。自那以后，我们一直在扩展技术和客户群。


  **古铁雷斯：** 你对 SalesPredict 的愿景是什么？


  **拉丁斯基：** 在我看来，我们的愿景是受希望改变企业商务方式的愿望所驱动。这样我们就能通过帮助企业做出更优决策，让他们以更好的方式相互连接。我希望他们拥有比现在好得多的数据。


  我希望看到 SalesPredict 发展壮大以实现这一目标。目前，我们正从为我们合作的每家公司构建公司模型开始。


  我们从销售和营销预测入手，引导他们更好地了解应该与哪些人沟通、在哪里停止花钱、在哪里开始花钱，等等。毕竟，销售是企业的命脉。完成这一步后，下一步将是帮助 CEO
  做出决策。这只是扩展业务模型以适应并预测另一部分。接下来，我们处理人力资源部门，目标是让企业知道将哪个人匹配到哪个岗位。


  这有助于真正改变企业运作的整个方式，因为它再次为决策者提供了更多数据。这就是我们现在和将来要做的事——逐步构建一个更全面的企业模型。


  *工作中的数据科学家* 275


  五年后，我们将对企业如何运作有足够的了解，从而能在整个垂直领域为他们提供更多洞察。我们希望能够告诉他们：“这是您应操作的最佳范围。这是我们过去看到的其他公司的做法，这是您现在应该做的。”


  **古铁雷斯：** SalesPredict 团队的构成是怎样的？


  **拉丁斯基：** 我们是一家工程团队在以色列、销售和营销团队在旧金山的公司。这意味着作为首席技术官，我在以色列，而我们的 CEO 在旧金山。CEO 和我是联合创始人，我们曾在微软共事过。这段共同经历使我们能够紧密合作，尽管身处世界不同地区，因为我们一起工作了这么多年，已经到了彼此知道对方在想什么的地步。


  我们的工程团队在以色列，是因为这里的工程人才非常出色。许多人之间有一种纽带，帮助实现更高的目标——我们一起长大，一起参军。军队是对科技人才来说最不可思议的孵化器。因此，我们这里拥有非常丰饶的环境。然而，我相信销售和营销应该始终靠近你的目标市场。目前，我们的目标市场是美国，所以
  SalesPredict 的销售团队就在那里。


  我们是一家初创公司，所以只有十五个人。在这十五人中，我们有十个人在工程团队。工程团队里的每个人都是数据科学家和工程师。当然，尽管每个人都是数据科学家，但有些人理论背景更强，有些人更以数据科学为中心，有些人则拥有更硬核的工程背景，曾扩展过整个系统。


  我两方面都喜欢——工程和数据科学。当然，我的热情确实与数据有关。然而，如果我不真的把它实现出来，这些工作就毫无价值，所以我真的很喜欢实施过程中的工程方面，并看到它发生。这就是为什么我认为一个数据科学家首先应该是一名优秀的工程师。我的职责是思考如何将这项技术不断向前推进。因此，我与算法一起处理应用的业务方面，定义我们如何让它全部运作起来，然后与工程团队合作。我们是一个小团队，所以我尽量少做管理，多做事。


  **古铁雷斯：** SalesPredict 是如何运作的？


  **拉丁斯基：** 我们是一个基于云的解决方案，在获得授权后，会连接到我们客户的 CRM（例如 SalesForce）来访问他们的销售数据。我们的算法会查看该公司过去成功销售给了哪些公司，以及是哪些人促成了这些销售。我们从他们的
  CRM 中收集关于这些人的所有数据。当我说收集所有数据时，我是说所有信息——他们在电话里说了什么、使用了哪些销售话术（如果有的话）、他们告诉客户什么、客户购买了多少件商品，等等。基本上，任何输入到
  CRM 中的数据对我们来说都是有用的。


  一旦我们获得这些数据，它就会被传递给我们构建的网络爬虫。这些爬虫会爬取网络，尽可能多地获取关于销售对象及其所在公司的信息。对于个人，我们希望更清楚地了解他们是谁，以及他们在网络上的形象。例如，了解他们是技术人员还是非技术人员会很有帮助。


  对于公司，我们希望更清楚地了解它们是谁——不仅是它们在网络上的形象，还包括更相关的财务和运营信息。为了进行这项分析，我们会爬取他们的网页，对他们进行税收分析，对他们所专长的领域进行分类，并购买关于公司的流量数据，这样我们就掌握了有多少人访问潜在客户网站的数据。


  我们也能访问我们客户的网站数据，以及他们的潜在客户如何与该网站互动的信息。例如，某人是否下载了他们的白皮书、查看了哪些页面，等等。在销售代表与潜在客户开始交谈之前，我们掌握了大量关于潜在销售互动的行为数据。




  ```markdown

  然后，在聚合了关于潜在客户、其公司以及来自我们客户网站的行为数据之后，我们进入数学、机器学习算法和模型的阶段。我们希望从这些数据中得到两样东西。第一是深入理解过去的销售交易是如何发生的。第二是基于我们过去看到的历史数据，能够计算出新人员成为客户的概率，以及我们应该采取哪些行动使其成为真正的客户。


  在我们这边，我们自动构建这些模型。这包括添加数据。从客户的角度来看，整个过程在不到十分钟内完成。其他一切都在我们的服务器上完全自动完成，例如数据的处理、数据的收集、特征工程等等，这带来了诸多挑战。以上就是对
  `SalesPredict` 工作原理的简单描述。


  **Gutierrez：** 随着客户群、技术和数据的增长，你们面临了哪些挑战？


  **Radinsky：** 这类模型的挑战来自于从简单方案向真实世界的迁移。首先，我们的市场需求非常苛刻。


  我们客户的历史数据和分布一直在变化——他们今天的完美客户可能已经不是两个月前的样子了。随着一切都在变化，这个模型必须随着数据的变化自动重建——大约每周一次。除此之外，我们必须为做决策的销售人员提供近实时的数据。这是因为如果有人刚刚下载了白皮书，或者某人改变了头衔，或者发生了影响销售流程的事情，或者有新人进入销售漏斗需要跟进，模型都必须考虑到这些新信息。无论人们是通过网站进入，还是来自购买的名单，或是来自某些营销材料，我们都必须立即对他们进行评分。因此，处理所有这些动态变量是一次学习的机会。


  **Gutierrez：** 你们遇到过数据方面的挑战吗？


  **Radinsky：** 我们遇到的一个特定数据挑战与数据量大小有关。如今大数据炒得很热，但我们实际上是一家小数据公司。诚然，我们从海量的来源收集数据，但客户拥有的与其潜在客户相关的信息量却非常少。例如，他们可能只有两百个潜在客户，但他们见过成千上万的非客户。这些非客户对业务仍然是有意义的，因为他们没有购买，这本身就是一个信号。从这两组数据中构建统计模型非常困难。不仅如此，它还完全不平衡。


  **Gutierrez：** 你们遇到过建模方面的挑战吗？


  **Radinsky：** 存在一种普遍的范式，即数据科学家获取数据并构建一个分类器，然后就期望它能直接工作。但事实并非如此，让非数据科学家认识到这一点很重要。我将举一个我们观察到的最简单的例子。在这个例子中，我们试图模拟一个销售流程，根据客户的不同，该流程可能包含
  6 到 12 个阶段。


  当然，销售流程中的每一步都涉及数据。当我们接收到数据时，我们只获得了一个快照。例如，假设你试图向某人销售，而此人在成为客户后已经回答了一个关于他是否满意的问题。你会遇到一些回头客，所以你会看到他们。因此，对于“客户是否满意”这个问题，对于已经是客户的人，它会有“是”或“否”的值，而对于还不是客户的人来说，这个值将是空的。


  于是我们得到这些数据，我们根据历史数据构建这个统计模型，然后模型会聚焦于这个简单的单一规则。但是当我们实时应用该算法时，它对所有潜在人员都给出了“否”的判断，因为他们尚未填写这个字段。这是怎么回事？


  这涉及到一个流程，而我们是从一个完全不同的流程阶段进行学习的。不仅如此，我们必须考虑到人们填写表格时并不总是正确，甚至不一致。我们最终采取的做法是完全模拟我们客户的流程，并尝试从他们的数据中重建它，然后为每一步构建不同类型的分类器。


  ***Data Scientists at Work*** 277


  **Gutierrez：** 你们在向客户提供模型结果方面遇到过挑战吗？


  **Radinsky：** 在我们收集数据并构建各种分类器之后，我们提供给客户的是关于他们正在向其销售的人员的评分。


  我来自搜索引擎背景，因为我之前为 `Bing` 构建过不同的算法。在那里，这算不上什么大问题。你收到一个查询，然后只需给用户返回一个排序后的结果。我们现在也做同样的事——我们的客户也会得到一个按排名排列的需要致电的人员列表。我们在此面临的挑战是，有时销售人员并不想按我们建议的那样去打电话。他们会反驳并问：“为什么这个人是
  A 级而这个人却是 B 级？”你不能仅仅创建这个统计模型，然后把它交给销售人员就期望他们说“哦，是的，有道理”——因为他们想理解为什么某些人会以某种方式被排名。


  此外，销售人员会有一些他们希望纳入模型的先验知识。统计上正确的东西和人们感觉正确的东西之间存在巨大差异。我实际上称之为情感人工智能，因为我们是在与人打交道。我们的算法及其产生的结果必须能与人类协作。因此，我们最终实现的聚类不仅在统计上是正确的，而且还充分考虑了与算法协同工作的人员所考虑的所有情感因素。


  我们用于解决这个问题的一个算法如下。我们为销售人员对大量潜在人员进行从 A 到 D 的评级，供其致电。然后我们监控是否有人跳过了我们评为 A 级的候选人而去联系了
  B 级的。如果他们跳过了，我会说对 A 级评级的解释可能有问题。这个新见解随后会被反馈到我们的分类器中。然后模型会重新训练自身，并生成更好的摘要或更好的解释。


  除此之外，我们的大多数客户只是想给系统提供反馈，因此我们一直在使用大量的强化学习算法。


  销售人员有时会告诉我：“这个人不是 A 级。我知道他不是 A 级。这个人肯定是 B 级。”即使我们根据历史数据知道这是错的，但销售人员了解一些情况，对吧？所以我们在构建分类器时必须与人合作。我们的挑战是以自动化的方式实现这种交互——这是一个有趣的挑战。


  **Gutierrez：** 你觉得这方面最令人兴奋的是什么？


  **Radinsky：** 让我感到兴奋的部分是，我们能够帮助公司表现得更好，因为我们从宏观角度观察他们的销售运营。这与他们自己的视角完全不同，因为我们是从数据的角度来看待问题，这有助于我们帮助他们做出更好的决策。在过去的六个月里，我们主要的工作是构建系统并进行规模化，因为我们的客户越来越多，系统必须持续构建并为所有客户工作。


  ***Data Scientists at Work*** 279

  ```




  随着越来越多的人开始使用该系统并遵循我们的评分，我们不得不思考如何为那些我们客户从未见过的潜在客户进行评分。我们还希望思考如何让销售人员开展探索工作。实际上，我们已开始将这一点纳入考量。不仅如此，随着客户数量的增加，我们开始从多个相互合作的客户那里获取更多信息。例如，我们拥有同一家公司两家分销商的数据，并且发现这两家分销商都在试图向同一个人销售产品。这反过来让我们能够提出诸如“你们为什么要这样做？”之类的重要问题。因此，对我们来说，令人惊叹的是，正因为我们拥有所有这些销售数据，我们才能洞察到商业世界中那些通过其他方式无法获得的见解。


  我们实际上正在将所有数据整合在一起并进行挖掘。


  **Gutierrez：** 您从这些模型中发现的最令人惊讶的事情是什么？


  **Radinsky：** 我们所做工作中最令人惊讶的部分涉及到客户对我们模型结果的感知问题，以及我们如何应对这种感知。每个人都在谈论人机交互。


  我认为我们实际上正在这里实现它。所以对我来说，这是下一步。我们必须弄清楚如何基于对客户的理解，以及对客户之客户的理解，来产生出色的结果，以便我们能有效地将这些综合信息利用起来。这真的让我感到兴奋。


  例如，我们的系统会发现这样一类情况：一位销售人员正试图向一位高级工程师推销产品。这位高级工程师的特征是职业生涯发展非常迅速，所在公司也在财务上不断增长。这就是销售人员对他们想要推销产品的高级工程师的感知。为了找到这个人，我们必须在幕后弄清楚一些事情，比如我们如何知道一家公司在财务上正在增长。我们希望弄清这一点，以便能够将这些数据作为特征添加到我们的分类器模型中。因此，我们必须摄入大量数据，才能匹配销售人员对他们想要推销产品的高级工程师的思维方式。


  另一件让我们觉得相当有趣和惊讶的事情是，我们不同的客户对于进入销售漏斗的新人所需了解的知识水平各不相同。因为我们为每种类型的客户自动安装系统，并且在那时我们并不了解客户的数据，所以我们为每个潜在客户构建了一个所谓的“买家画像”。但我们的不同客户对这个买家画像的精细程度要求不同。


  其工作原理是，当潜在客户进入他们的系统时，他们会希望我们告诉他们这个人是谁。他们想知道那人是技术人员、营销人员还是其他角色。


  我们的一位客户关心的是区分此人是直接销售人员还是渠道销售人员。然而，另一位客户可能只关心知道这是一个技术营销销售人员，这是完全不同的精细度。我们解决这个问题的方法是，最终构建了一个本体论（ontology），并找到了与该本体论协同工作的算法。通过这种方式，我们可以为每位客户找出网络精细度层的价值。这起初看似一个简单的问题，但随着时间的推移，问题变得愈发复杂，就像一个个谜题，最终让整个系统像一台运转顺畅的机器一样协同工作。


  关于这个本体论以及从网络精细度层获取价值的另一个棘手之处在于，我们几乎每周都在自动重建模型。这其中也有很多问题。随着时间的推移，随着人们的行为和被观察到的行为方式发生变化，模型会改变某人被评分时的分布情况。即使关于某个特定潜在客户的信息没有改变，一个`A`级排名也可能变成`B`级，因为我们是根据全局数据变化来训练模型的。而且由于我们处理的是小数据，这种情况甚至可能经常发生，这意味着销售人员会看着新结果问我们：“你们改了什么东西？”因此，我们必须考虑到一个事实：我们不能快速地改变分布，因为这必须对业务方有意义，而这又把我们带回到了情感
  AI 的问题上。


  **Gutierrez：** 您是如何涉足计算机科学领域的？


  **Radinsky：** 我四岁时从乌克兰来到以色列。我妈妈在我五六岁时给我买了一台电脑。她想让我通过电脑上的语言学习程序来学习和练习俄语。她还给我买了很多电脑游戏。其中一些电脑游戏包含与数学相关的练习。有一次，我卡在一个非常非常难的关卡过不去。我非常想进入下一关，于是我阿姨教我如何编写一个`for`循环来解决这个问题。通过这种方式，我学会了用穷举法来解决部分练习，而不是一直用人工计算器的方式。那是我第一次觉得编程的能力如此神奇，“太棒了。我可以通过使用电脑更快地进入游戏的下一关。”这开启了我对计算机科学的痴迷。


  除了电脑，小时候我对生物信息学也特别着迷。我真正感兴趣的是，你可以获取所有的基因数据，把它们装进电脑，解决许多以前看似无法解决的问题，并取得医学发现。你甚至可以构建一个人与计算机的结合体。我
  15 岁时参加了以色列理工学院的校外学习项目，这让我在高中时就可以开始上大学级别的课程。而当我开始在以色列理工学院学习时，这正是我想做的事情——学习生物信息学。


  在我的学业开始之前，也就是 14 岁的时候，我参加了一个研究夏令营。在夏令营里，我们每个人选择自己想要主导的研究项目——我选择研究天然化合物如何影响癌细胞的增殖，特别是前列腺癌细胞。我们研究了很多细胞，并试图识别它们如何影响癌症。在处理这些数据时，我们有很多关于癌细胞如何生长的图像。那是我第一次做图像处理，因为我不想手动数细胞，每张图像里大约有五千个细胞需要数。所以我做的是编写一个系统来为我处理这些图像，这让我有一些空闲时间去游泳池游泳，而不是做那些乏味的工作。


  在夏令营做这项工作的同时，以及在参加以色列理工学院校外学习项目期间，我开始越来越多地阅读关于人工智能的资料。


  我心想：“哇，这太神奇了！我们周围有这么多数据，我们真的可以利用起来。”我完成了高中学业和部分本科学业，然后参军了。在那里的三年，我是一名软件工程师，主要从事安全相关的工作。之后我回到大学完成了我的本科学位。


  **Gutierrez：** 您是什么时候意识到数据的强大力量的？




  **Radinsky：** 2011 年，美国阿肯色州比布发生了一起事件，大约五千只死鸟从天而降。这非常有趣，因为当时临近玛雅历法的终结日期，所以每个人都认为这是世界末日的征兆。不仅如此，就在几天前，阿肯色州附近一处海岸还有数十万条鱼被冲上岸死亡。所有报纸都报道称，这两起事件之间没有关联。没有人能理解为什么鸟会死，鱼也会死。


  我不会说这是我对数据的初次热情，但这确实是我第一次真正理解到，处理数据就像一场冒险。对我来说，正是那个“嗯，这里发生了什么？”的时刻，促使我对它进行额外的调查。于是我开始使用`Google
  Trends`来搜索鸟类死亡和鱼类死亡相关搜索的峰值，看看它们通常何时发生。我注意到它们往往发生在几乎同一时间。


  我当时使用的数据是`Google Trends`的图片，因为他们当时还没有应用程序编程接口（API）。我实际上不得不获取图片，并对其应用图像处理，以便扫描其中涉及的所有线条，从而获取图表背后的数据。为了完成一件相当简单的事情，我做了大量的工作。提取完所有数据后，我编写了一个系统，用于寻找那些在人们以不寻常方式搜索鸟类和鱼类死亡之前往往会发生的事件之间的相关性。


  系统自动发现的结果是，在人们搜索石油泄漏事件的地点，甚至在事件发生前的六个月，这两个搜索词往往会同时达到峰值。石油泄漏会导致氧气耗尽，而氧气耗尽正是鱼类死亡的头号原因。我对自己说，哇，有趣——这可能有关联。我不知道这是否就是当时


  ***第 14 章 | Kira Radinsky，SalesPredict***


  那里实际发生的情况，我只知道美国一条主要的石油管道经过阿肯色州比布。但对我来说，这是我为了解正在发生的事情而进行的第一次数据冒险。


  **Gutierrez：** 这个项目带你走向了何方？


  **Radinsky：** 在思考我的发现以及是如何发现它的过程中，我意识到这些搜索词存在一个问题：我只能看到人们想让我看到的东西。也就是说，我只能看到那些人们认为足够有趣以至于去搜索的数据。我看不到像“氧气耗尽导致所有鱼类死亡”这样的内容。由此我开始思考，如何利用人们曾写下的所有新闻，去寻找其中的因果关系。


  但首先，我必须弄清楚如何定义因果关系。我最初从“*x* 导致 *y*”这样的表述开始。我查看了报纸文章，以及人们如何写出像“石油泄漏是由事故引起的”这样的内容。所以我开始寻找所有以这种方式体现因果关系的短语。当我有了这些短语后，我开始在语用层面进行语义分析，以弄清楚谁是动作的发出者、动作施加于谁等等。我扫描了自
  1851 年至今我能找到的所有报纸。从所有这些信息中，我构建了我称之为“因果关系图”的东西。它包括所有事件以及它们如何基于这些短语相互关联。


  从那时起，我很快意识到这还不够，因为我需要为其添加某种抽象层。例如，假设澳大利亚发生了一场地震。如果你回顾过去，澳大利亚从未发生过地震，那么它会产生什么后果？你无法据此进行预测。然而，土耳其过去发生过地震，所以我需要做的第一件事是，知道土耳其的地震和澳大利亚的地震都是地震，并且两国都是国家。我如何才能知道这一点，并让我建立的模型也知道呢？我所做的是访问维基百科，寻找实体抽象的不同方式。在这种情况下，我就会知道你可以说这两个地方都是国家。有了这个添加的抽象层，现在可以说我离解决这个问题更近了一步。


  接下来，假设澳大利亚确实发生了一场地震。系统会找到过去的一个类似模式，比如土耳其的地震。系统会查看那个特定事件在过去导致了什么，然后它会找到有人在新闻中写的东西，例如：“土耳其发生地震后，红十字会的援助被送往安卡拉。”
  因此系统会查看这个，并输出“澳大利亚发生地震后，红十字会的援助被送往安卡拉”，这是一个问题，因为它既不是事实，也不可能真正发生。


  我接下来做的是，根据我们正在关注的当前事件的情况来调整预测。这意味着系统必须理解，在过去，因果关系的发生是因为安卡拉是土耳其的首都。一旦它理解了这一点，它就会将这个函数应用到当前的情况上。现在系统会说：“澳大利亚发生地震。红十字会的援助被送往堪培拉。”
  我寻找这类关系——首都和国家——以及其他关系，不仅使用了维基百科，还使用了来自一个名为“关联数据”项目的数百个其他数据集。这些连接的数据集中最大的一个当然是维基百科，它只是来自维基百科的结构化信息。


  有了这个因果关系图，我现在可以问它任何我想知道的问题。一个我经常举的有趣例子是，当我想买一台`iPad`时它教给我的东西。我问系统：“一台`iPad`多少钱？告诉我接下来会怎样。”
  系统随后告诉我价格会上涨。我很好奇它为什么会这么认为，于是我让它回溯它是如何通过这个因果关系图得出这个结论的。它告诉我现在价格会上涨是因为日本的海啸。然后我问，为什么美国苹果产品的价格会因日本海啸而上涨。它随后向我展示了其中的关系。这个链条基本上是：日本发生海啸，沿海有工厂，其中一些工厂生产芯片工厂所需的一些物质，而这些芯片工厂位于中国，为美国生产`iPad`。因此系统计算出，如果沿海工厂受到影响，可能导致材料短缺。它在过去看到过，当某种东西短缺时，价格就会上涨。能够推断出这一点是一个有趣的观察。


  然而，研究因果关系的问题在于，有时会得出一些简单的结果。这是让我感到惊讶的事情之一，因为它可能需要经过好几个因果环节才能得出一个简单的结论。例如，我给它设定以下情景：“以色列教授在爆炸后身亡”，




  ### 第 14 章 | 基拉·拉丁斯基，SalesPredict


  **古铁雷斯：** 你们将系统应用于解决哪些问题？


  **拉丁斯基：** 当时，我与拥有医学博士学位、并担任微软研究院雷德蒙德实验室主任的埃里克·霍维茨共事。他对疾病预测和算法极为感兴趣。当系统开始考虑相关性后，我们决定验证其能否预测霍乱爆发。我们编写了一些代码，使得我们可以向系统输入`"cholera
  outbreak"`，系统就会每天给出该事件在世界各地发生的概率。在查看历史数据时，系统预测的准确率达到百分之八十多。不仅如此，在 2012 年，我们成功预测了古巴
  130 年来首次霍乱爆发。


  情况是这样的，霍乱是一种水媒疾病，因此系统发现它往往发生在洪水之后，这并不令人意外。但系统发现的模式是，如果在洪水的两年前发生过干旱，那么这些洪水导致霍乱爆发的概率会大大增加。不仅如此，它往往还发生在
  GDP 较低且水资源匮乏的国家。为什么是水资源匮乏？埃里克告诉我，霍乱通过清洁饮水就很容易治疗。清洁的饮用水能将死亡率从 50%降至 1%以下。因此，能够获得清洁饮用水的人们根本不会爆发霍乱，这就是为什么低
  GDP 国家会成为问题的关键。


  在霍乱预测上取得这一突破后，我们开始着手预测暴乱。例如，该系统预测了苏丹最近的暴乱。我们发现，如果一个国家的一种基本商品价格上涨，就会引发学生暴乱。然后，如果在这场学生暴乱中，一名警察杀害了一名大学生，这就会导致更大规模的骚乱，甚至可能波及政府。埃及的面包价格事件就是如此。该系统从埃及的情况推断出，当苏丹的天然气价格开始上涨时，同样的事情会发生在苏丹。在苏丹，政府多年来一直对天然气价格进行补贴。苏丹发生的事件正如系统预测的那样——十二月发生了学生暴乱，随后一名警察杀害了一名大学生，这反过来又引发了大规模骚乱。


  对我来说，系统预测出霍乱爆发和暴乱是令人兴奋的；这是我第一次看到系统能做到这一点。这个系统可以改变我们看待世界的方式，因为它能发现我们从未见过的模式。这是每位科学家的梦想——更好地理解我们生存的世界。对于决策者来说，这是一个非常实用的工具，他们常常在信息不明的情况下做出影响我们所有人的决策。我只想为他们提供科学工具，帮助他们做出更好的决策，因为我们已经有海量的数据。我们可以极大地帮助他们。我们最近已经开始与比尔及梅琳达·盖茨基金会合作，构建一个更精细的霍乱预测器，试图预测全球范围内的霍乱爆发。


