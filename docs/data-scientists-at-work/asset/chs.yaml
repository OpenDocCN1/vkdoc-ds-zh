- '# 第 章


  ## 埃里克·乔纳斯


  ### 神经科学研究


  **埃里克·乔纳斯** *是一位计算神经科学和信号处理领域的研究科学家，主要从事两条主要的研究线索。第一条侧重于学习和记忆是如何运作的：大脑如何接收新信息，建立内部模型，并利用这些模型做什么（比如将它们保存到新皮层）。他的第二条研究线索侧重于利用信号处理技术构建新型机器学习模型，以检测这类数据中无法被原生检测到的模式。在这两项工作中，乔纳斯都必须应对两个截然不同的问题集。第一组问题涉及找到正确的模型和技术来解释和处理噪音极大、高通量的神经数据。另一组问题则涉及弥合进行实验的科学家与创建数学模型的人之间的鸿沟。*


  *尽管乔纳斯从七岁起就一直对大脑着迷，但他却在脑科学和创业之间交替转换。他共同创立了两家初创公司，这两家公司都得到了* *彼得·蒂尔的风险投资公司 Founders
  Fund 的支持。第一家* *Navia Systems，开发了一种新型的概率计算机，用于在不确定性下进行推断。他是第二家公司 Prior Knowledge
  的首席执行官，该公司创建了一个预测数据库，学习其所包含数据的深层结构，然后利用这些知识基于概率推断生成预测。就在成为 TechCrunch Disrupt 决赛入围者仅仅三个月后，Prior
  Knowledge 就被 Salesforce.com 收购。乔纳斯随公司过渡，并成为 Salesforce.com 的首席预测科学家。2014 年初，乔纳斯重返纯研究领域，他在麻省理工学院的职业生涯中对此环境非常熟悉，在那里他获得了四个学位：电气工程与计算机科学理学学士学位、脑与认知科学理学学士学位、电气工程与计算机科学工程硕士学位，以及脑与认知科学博士学位。他目前是加州大学伯克利分校电气工程与计算机科学系的博士后研究员。*


  **第 15 章 | 埃里克·乔纳斯，** 神经科学研究


  *乔纳斯是构建未来工具的数据科学家的典范。这一点在他谈论创建从脑细胞记录信号的仪器、他对过去十年工具开发速度缓慢的挫败感，以及他对于拥有合适工具来分析未来可获取的海量大脑数据的愿景时，表现得淋漓尽致。他渴望构建能够帮助科学家和非科学家通过数据理解世界的工具——再加上他对生命科学未来将变得多么定量化和计算化的看法——使他的访谈充满活力。*


