- '# 数据科学家访谈录


  塞巴斯蒂安·古铁雷斯是一位数据创业者，他创立了三家数据相关公司：`DataYou`（数据科学与可视化咨询及培训）、`LetsWombat`（产品试用平台）和`Acheevmo`（运动表现统计）。他曾任加拿大丰业银行新兴市场风险经理，以及摩根大通和渣打银行的外汇期权交易员。他领导着拥有
  1600 名成员的纽约市`D3.js`用户组，并担任 *数据科学周刊* 的联合编辑。


  ---


  *“在这本书中，你将看到全球顶尖的数据科学家如何在令人眼花缭乱的行业和应用场景中开展工作——每位科学家都融合了自身的领域专长、统计学和计算机科学知识，从而创造出巨大的价值和影响力。”*
  ——摘自谷歌研究总监彼得·诺维格所作序言


  《数据科学家访谈录》收录了对来自这一热门新兴行业各个领域的十六位全球最具影响力和创新精神的数据科学家的访谈。根据《哈佛商业评论》的说法，“数据科学家是 21 世纪最性感的职业”。麦肯锡报告预测，到
  2018 年，美国将面临 19 万名熟练数据科学家的短缺。


  通过深入透彻的访谈，本书从各行各业杰出从业者的故事、创意、洞察和预测中，挖掘出数据科学实践的本质、方法和原因。这些领域包括：社交网络（Yann LeCun，Facebook）；职业社交网络（Daniel
  Tunkelang，LinkedIn）；风险投资（Roger Ehrenberg，IA Ventures）；企业云计算与神经科学（Eric Jonas，前 Salesforce.com）；报刊与媒体（Chris
  Wiggins，《纽约时报》）；流媒体电视（Caitlin Smallwood，Netflix）；音乐预测（Victor Hu，Next Big Sound）；战略情报（Amy
  Heineike，Quid）；环境大数据（André Karpíštšenko，Planet OS）；地理空间营销情报（Jonathan Lenaghan，PlaceIQ）；广告（Claudia
  Perlich，Dstillery）；时尚电商（Anna Smith，Rent the Runway）；专业零售（Erin Shellman，Nordstrom）；邮件营销（John
  Foreman，MailChimp）；预测销售情报（Kira Radinsky，SalesPredict）；以及人道主义非营利组织（Jake Porway，DataKind）。


  每位数据科学家都分享了他们如何凭借独创性、想象力、耐心和热情，将应对大数据洪流的技术、数据可视化、搜索和统计学方法，量身定制并应用于特定工作。《数据科学家访谈录》揭开了受访者早期数据项目的神秘面纱，讲述他们如何成为数据科学家，在数据处理过程中的发现与惊喜，对本行业过去、现在和未来的思考，在组织内团队协作的经验，以及在将海量原始数据精炼成对组织与客户具有商业、科学和教育价值的产品过程中所获得的深刻洞见。


  读者将了解到：


  - 数据科学家如何走上现在的岗位，以及他们为他人提供的建议

  - 数据科学家从事的项目以及他们使用的技术与工具

  - 如何构建数据科学能够解决的问题框架

  - 数据科学家认为未来数据科学领域最具吸引力的机遇在哪里




