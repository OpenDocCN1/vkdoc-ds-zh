  在我琢磨那次会议以及自己未来的时候，我得到了一份工作，为数学系另一位教授做绳结建模。绳结研究关注的是自相交的绳结或曲线如何相互作用，当它们被拉紧时会发生什么，以及它们能变得多紧凑。这在物理宇宙学、蛋白质折叠以及其他重要学科中都有应用。因此，我们对这类问题进行了大量的三维建模，同时也需要判断，当你有一个绳结时，如何理解它属于哪种类型？绳结有一套庞大的分类系统，所以这项工作需要编写大量代码。


  ***第六章 | 约翰·福尔曼，MailChimp***


  这是我第一次用 `C` 语言编程的经历——寻找内存泄漏——而我竟然还挺享受。我有一大堆 Mac Pro 工作站，并且可以跨所有工作站并行化代码。那感觉真是太棒了。在这次经历中，我开始认为“现实世界”中有些方面是我可能会感兴趣的。然而，我仍然不太清楚自己该往哪个方向走。


  我后来短暂地去了`NSA`，参加了一个名为“局长暑期项目”的实习。他们基本上是召集一群数学书呆子，把他们关在一个房间里，在他们做数学时给他们投喂食物。我经历了这些，然后意识到我其实并不想待在政府机构。不是因为政府不处理重要问题——他们确实处理，而是因为我遇到了很多只是在等着退休的人。例如，我和一个人共事，他的办公桌上方挂着一张高尔夫球场图片，他会说：“这就是两年后的我。”我期望我的工作生活能比这更有激情。


  **古铁雷斯：** 排除了政府和学术界的数学工作后，你毕业时做了什么？


  **福尔曼：** 我进入了咨询行业，部分原因是我想能够快速地解决问题。于是我加入了博思艾伦，开始为政府做很多不同的分析项目。我所在的团队主要处理快速反应的分析项目。例如，其中一个项目是关于陆军基地调整和关闭（BRAC）的。由于陆军在迁移基地时不能中断训练，我们针对装甲学校的迁移过程建立了模型，涉及将所有坦克和重型车辆，连同训练需求，从诺克斯堡转移到本宁堡。我们的数学模型让军方能够在关闭部分基地并重新部署的同时，继续训练人员操作重型火炮。永远不要让别人告诉你，你无法给一辆行驶中的汽车换轮胎！


  为政府做分析工作的妙处在于，有很多改进事物的机会。他们有许多非常复杂且带有非常有趣约束条件的问题。例如，当禁止使用与欺诈行为高度相关的歧视性特征（如邮政编码）时，你如何预测纳税申报欺诈？这是一个挑战！


  离开政府后，我转而为大型企业做咨询，涉及定价模型，以及一些面向中国的果汁产品混合模型，这非常有趣。所以到那时，我已经有了一些大型企业的工作经验，但我想感受一下初创世界中的数据科学。在企业界，我没有太多机会接触监督式人工智能。我做了很多预测分析，这是一种预测建模。你使用的是时间序列数据，以及在涉及定价或供应链时的大量优化模型，但真正的机器学习却用得不多。


  ***《数据科学家在工作》*** 117


  **古铁雷斯：** 你是怎么进入 MailChimp 的？


  **福尔曼：** 我见到了当时 MailChimp 的首席运营官尼尔·班顿，并与他讨论了 MailChimp 面临的问题，以及数据如何能潜在解决其中一些问题。因为它是一家成功的在线公司，在
  Alexa 500 强中拥有两个域名，其产生的数据集非常庞大。所以这正是一个利用数据解决问题的绝佳机会。起初我和他见面时，我以为是因为他在寻找人才，于是我开始推荐其他他应该谈谈的人。经过一些交谈后，他问道：“那么，你呢？”
  随着我们谈得更多，这个机会的广度对我来说变得清晰起来，于是我最终来到了这里。


  这绝对是一段极其精彩的经历，因为 MailChimp 的运作方式与政府或大型企业公司截然不同。在政府中，管理层级层层叠叠，有着非常明确的沟通链条。在企业界也是如此。而
  MailChimp 是一个小型组织，所以结构非常扁平化。这不是一个你去告诉别人该做什么，或者去找他们的经理、让经理吩咐他们该做什么的地方。不，一切都要通过紧密的沟通与协作来完成，因此在这种环境下做分析工作是一个新的挑战。我发现我真的很喜欢随之而来的独立性和混乱状态。


  **古铁雷斯：** 你是什么时候意识到数据的力量的？


  **福尔曼：** 当你研究运筹学问题或优化问题时，数据很重要，但真正关键的是问题的建模。你只有很少量的输入数据——却需要基于这些数据做出非常复杂的决策。当我开始做价格优化模型时，数据的力量真正击中了我，让我大开眼界。这是因为你要利用历史数据来预测某种产品的需求，不管是酒店房间、游轮舱房、飞机座位还是其他什么，然后随着更多数据的涌入来更新该产品的定价。


  这些定价模型的惊人之处——我认为它们是目前最酷的数据科学模型之一——在于其决策直接影响收入。如果我选择降低酒店的价格，因为我认为这能最大化收入，这对一个模型来说，是一个相当大胆的决策。它居然能说“你需要把价格降低
  15 美元”，并且这能对你的最终利润产生积极的影响，这太神奇了。这个模型确实能这么说，之后我们还可以回过头来证明它是正确的。我们看到一些《财富》500 强公司每年因之获得
  2% 的收入增长，在那种规模下，这是非常惊人的。


  这真正让我认识到，如果你能够恰当地收集并跟踪大量的交易数据，那么你就拥有了一项竞争优势。


  ***第六章 | 约翰·福尔曼，MailChimp***


  **古铁雷斯：** 你是如何学习并保持对数据科学行业的最新了解的？


  **福尔曼：** 虽然我喜欢阅读博客，也喜欢在线交流以保持与时俱进，但在学习这类事情上，没有什么能替代书籍。在数据科学领域，有大量优秀的书籍正在出版。有太多好书都附带了现实世界的例子和随书数据集。显然，有哈斯蒂、蒂布希拉尼、弗里德曼合著的《统计学习基础》。它可以说是数据科学的圣经。就在最近，库恩和约翰逊关于预测建模的新书《应用预测建模》出版了，我一直在读。这本书非常棒。所以书籍是我学习的所有来源。


  很多数据科学书籍有趣的一点是，它们都预先选定了一种特定的工具，不管是 `R` 语言、`Python` 还是其他东西。




  如果你想真正学会如何完成这些工作，就必须使用现有的工具来实践，因此书籍会做出工具相关的决策。通过学习这些书中的代码示例，可以帮助你初步入门。但当你试图真正理解一项技术时，这同样可能成为一种干扰。


  这也是我写《Data Smart》这本书的部分原因。3 我觉得书中的许多示例都只是：“让我们加载支持向量机包，训练模型，然后查看结果。”这就像是等等等等等等。你需要详细解释那个支持向量机是如何构建起来的。你不能只是构建它。那是作弊，而这正是你在实际工作中会做的事——你相信那些包能正常工作——但为了学习目的，你不能这样。所以我写这本书就是为了详细拆解所有这些内容，并且不使用非常复杂的公式，也许不像哈斯蒂那本书那样。


  **古铁雷斯：** 你还在哪些地方与社区互动？


  **福尔曼：** 目前数据科学的一大优点是，无论是在现实世界——如在奥莱利的 Strata 会议等大会上，还是在线上——如 Cross Validated 和
  Twitter 这样的网站，都有一个非常活跃、积极参与的社区。线下和线上都是与其他从业者交流的好地方。令人惊讶的是，Twitter 可能是开始讨论数据科学话题的最佳场所，尽管我发现自己经常转而通过电子邮件来完成这些讨论。你可以找到懂这些知识的专家，然后通过更长篇幅的对话来进一步深入探讨。


