  '
- '# 工作中的数据科学家


  我必须与他人合作，思考如何向普通大众传达数据挖掘的概念，让他们能够有效地使用和理解产品。所以现在，我不仅是一名数据科学家/分析师，还成了一名为广泛人群服务的沟通者/翻译者。而这正是数学、美学和设计相互交织的地方。你如何在用户体验的语境中思考数据科学，让你的数据产品真正为企业带来价值呢？与之前的分析工作相比，这份工作对我来说是全新的。


  这令人耳目一新。


  **工作中的数据科学家** 111


  **古铁雷斯：** 为什么`发现相似订阅者`对 MailChimp 很重要？


  **福尔曼：** 作为一家邮件公司，MailChimp 存在的意义是帮助人们与他们的受众互动。无论是希望与捐助者互动的非营利组织，运营新闻通讯的小型企业，还是联系老客户的大型企业，都是如此。我们在与各种规模的团体合作时发现，几乎所有人都想有效了解他们名单上的人之间有何不同，以便与他们进行恰当的沟通。他们明白，不同类型的人对不同的沟通方式反应良好。MailChimp
  自认是一家科技公司，因此我们的工具带有一定自助服务的元素。所以，为我们自己构建一个能帮助客户轻松、有效地自行细分名单的工具就显得非常重要。`发现相似订阅者`正是促进了应用中的这种自助式受众研究。


  在 MailChimp，由于我们拥有庞大的用户群和收件人地址库，我们确实在全球层面了解读者。因此，我们可以向用户提供关于他们自己名单的情报，这是竞争对手无法做到的。我们之所以能做到这一点，是因为我们从全球的电子邮件数据集中提取信息，这些数据包括梦幻足球联赛名单、拼布爱好者通讯，以及规模更大的公司通讯名单。我们拥有这些数据，因此可以想办法让用户也能获取。所以，`发现相似订阅者`产品是我们将自身对电子邮件的理解带给客户的一种方式——通过这种方式告诉他们：“根据您提供的标准，我们认为您名单上的这些人属于这个细分群体，而这些人属于另一个细分群体。”


  **古铁雷斯：** 这个工具你们内部也使用吗？


  **福尔曼：** 是的。我们自己在大约两年前发布一个名为 Mandrill 的新产品时就使用过它。Mandrill 是一个通过 API 操作的交易邮件产品。应用程序可以用它来发送邮件。这与
  MailChimp 非常不同。使用 MailChimp，你需要登录、上传邮件列表，然后在拖放编辑器中组合内容。而 Mandrill 的不同之处在于，你需要将它集成到你的应用程序中。这样你就可以用它来发送收据、密码重置邮件以及类似的交易邮件。这是一个非常棒的产品。


  当我们准备宣布推出 Mandrill 时，我们正是使用`发现相似订阅者`来挖掘哪些客户可能想了解我们的新产品。


  当时，我们拥有一个包含大约三百万个电子邮件地址的客户名单。那么问题来了，我们是否要让所有三百万人知道，如果他们正在开发应用程序，他们也可以使用我们开发的这个其他产品？答案并不意外：不。毕竟，我所在的本地教堂，他们只是定期发送新闻通讯，并不需要知道
  Mandrill。他们没有理由知道，我们也不想打扰他们。所以我们所做的就是使用`发现相似订阅者`工具来确定我们应该向谁发送关于新产品的邮件。


  **第 6 章 | John Foreman,** MailChimp


  **古铁雷斯：** `发现相似订阅者`工具是如何工作的？


  **福尔曼：** 当你思考我们拥有的数十亿个电子邮件地址时，你可以把它们想象成一个全球连接的图，所有这些地址基于共同的订阅或兴趣相互连接。有了所有这些连接，我就可以根据邻近度计算，找出谁（在兴趣意义上）“居住”在谁旁边或附近。基本上，你可以用邻里的概念来理解——也就是说，哪些邮件地址互为邻居。因此，一个拥有订阅者名单的用户，可以根据这个全球连接的图，提取出不同的细分群体。然后他们可以为自己名单中的这些特定细分群体创建并命名。


  回到 Mandrill 的例子，我们就是这么做的——我们根据兴趣（软件开发）创建了一个细分群体。然后，我们专门向这个群体发送了我们的产品发布通知邮件，说：“嘿，请注意，Mandrill
  现在推出了。如果你想使用它，真的非常酷。” 那封邮件获得了惊人的参与度。我们不仅从中获得了极佳的参与度，也没有打扰到其他那些不想知道这个新产品的用户。这就是我所看到的，拥有这种数据并向用户提供这种细分能力的力量所在。


  **古铁雷斯：** 你如何向不熟悉背后数学原理的人描述你的工作？


  **福尔曼：** 对于那些不熟悉数学的人，我会说我扮演着三个角色。第一，我构建数据产品；第二，我是客户与我们的数据科学团队之间的翻译者；第三，我是 MailChimp
  的大使。关于构建数据产品，我为两类客户做这件事。第一类客户是 MailChimp 的用户。为他们构建的数据产品通常是面向外部的产品，或像报告、博客文章这样的制品。我们对全球数据集进行研究，并向外部客户提供制品或产品，例如`发现相似订阅者`或`发送时间优化`。


  另一类客户实际上是内部客户。在 MailChimp，各个团队都非常需要了解我们所拥有的数据，特别是了解我们的客户及其独特特征。这些正是数据科学团队可以提供支持的领域，因此我们也为这些内部客户构建工具。这些工具涵盖从反滥用模型、支持排班工具到支付意愿模型等各种类型。


  第二个角色是成为内外部客户与数据科学团队之间的翻译者。作为一名翻译者，这有助于我弄清楚应该构建什么。我需要他人的意见；我不会自己凭空创造工作量。实际上，当一些分析团队那样做时是很可怕的。他们只是出现并说：“嗯，我们应该构建这个”，而他们并没有与任何人沟通。他们只是觉得使用某些工具会很酷。因此，我所做的工作很大一部分是与人交谈，理解他们的需求和问题，然后将这些需求翻译给
  MailChimp 内部的技术同事。


  **工作中的数据科学家** 113


  我所做的第三件事是与同行交流，了解数据科学领域的发展动向，并向外界传达 MailChimp 正在做的事情。这关乎参与到新兴的、全球性的数据科学对话中。我认为 MailChimp
  正在做一些前沿的事情，我想告诉人们这些。此外，我也想知道其他所有人正在做什么。这更多涉及如下问题：工具的发展方向是什么？哪些类型的数据正在变得可用？


  正在采用哪些实践？我想理解其他人用来思考自己工作的隐喻和类比。例如，在 Strata 会议上，我会参加关于医疗保健、海洋学、国防等领域的演讲。演讲者的领域不是我的领域，但许多问题却是相通的；这些隐喻对我帮助很大。




  **古铁雷斯:** 你会如何向了解背后数学原理的人描述你的工作？


  **福尔曼:** 除了可能对我们的某些数据科学产品的实现细节感到兴奋外，我不会对这种描述做太多改动。技术人士（或许比非技术人士更需要）需要听到沟通作为数据科学家日常工作一部分的强调。


  **古铁雷斯:** MailChimp 如何看待垃圾邮件？


  **福尔曼:** 首先，我们来谈谈电子邮件。电子邮件是一种无人真正控制的通讯标准。其他通讯系统，例如由 Facebook 运营的 Facebook Messenger，则受控于某个实体，由它决定其系统上发生什么。而电子邮件则不同，它的强大之处在于，任何地方的任何人都可以随时向你发送关于任何事情的电子邮件——无需某个更大的实体来规定交换的条款。


  任何人都可以建立一个邮件服务器，并突然拥有发送和接收电子邮件的能力。当有人收到他们不想要的电子邮件时，我们称之为垃圾邮件。这一直是电子邮件的一个问题，因此人们与垃圾邮件斗争了很长时间。


  打击垃圾邮件对 MailChimp 尤其重要，主要有两个原因。一是我们不想让用户发送垃圾邮件；二是如果大邮件公司（如 Gmail、AOL、Hotmail 等）的用户举报来自我们
  IP 地址的垃圾邮件，这些公司会屏蔽我们的 IP 地址。我们的 IP 地址有可能被屏蔽是一个大问题。我们为七百万用户发送邮件，但我们没有七百万个 IP 地址。除了少数拥有专用
  IP 地址的用户外，大多数用户是与其他用户共享一个 IP 地址来发送邮件的。如果我们允许一个不良用户发送恶意内容，邮件接收方就会屏蔽那个 IP 地址，这对使用该
  IP 地址的所有用户都是不利的。因此，我们在打击垃圾邮件方面做了大量工作。


  ***第 6 章 | 约翰·福尔曼，** MailChimp*


  **古铁雷斯:** 通常如何打击垃圾邮件？


  **福尔曼:** 十多年前，保罗·格雷厄姆写了一篇题为《垃圾邮件应对计划》的文章。从那时起，人们在垃圾邮件检测方面做了大量工作。如果你回顾一下那些早期的文章，处理方式是查看电子邮件的实际内容。人们分析页面上的词语，将其输入模型，以判断邮件中的词语是否涉及不良或垃圾内容。当然，这开启了垃圾邮件发送者与试图阻止他们的人之间的较量。


  突然之间，Viagra（伟哥）这个词里出现了 @ 符号、用数字 `1` 代替字母“I”，或者类似的手段。垃圾邮件发送者试图绕过匹配标记、朴素贝叶斯过滤器以及类似的垃圾邮件检测技术。这种较量不断升级。然后，垃圾邮件发送者不再使用文字，而是开始使用包含文字的图片，这意味着试图阻止他们的人必须开始对图片进行
  OCR（光学字符识别）以提取标记，再放入模型中来识别垃圾邮件。


  这种状况一直持续到需要新方法的时刻。我们非常清楚，仅仅查看垃圾邮件发送者发送的内容是不够的。我们是一家国际公司，因此我们分析的内容可能涉及多种语言。也可能全是图片。或者，最令人担忧的——或许是最大的问题——是内容可能看起来完全正常。我认为这一点很多人并不了解垃圾邮件的本质。现代经典垃圾邮件过滤器运作的前提假设是，垃圾邮件体现了一种理想形式，即垃圾邮件总是与尼日利亚王子、Viagra
  或类似的东西相关。


  **古铁雷斯:** MailChimp 是如何打击垃圾邮件的？


  **福尔曼:** 我们采用后现代的定义来思考垃圾邮件，即“垃圾邮件存在于读者的眼中”。我们知道这是真的，因为电子邮件客户端都有举报垃圾邮件的按钮。是收到邮件的你——将一封邮件判定为垃圾邮件。不是页面上的文字，而是*你如何解读*这些文字，以及你与发送者的关系。从数据科学的角度来看，这非常引人入胜。


  我们打击垃圾邮件的方式是追踪发送者和接收者之间的关系。发送出去的邮件内容可能非常无害。比如说，可能是当地房地产广告。在这个例子中，可能是一个房地产经纪人发送某个市场待售房屋的广告。我们要弄清楚并试图判断的是，这个房地产经纪人如何获取他通过邮件联系的那些人的名单。这些人是他们过去服务过的客户，并且告诉经纪人：“是的，我希望以后还能看到你的内容！”吗？还是经纪人在当地商会会议上拿走了邮件列表？或者经纪人向州政府提交了公共信息请求，获取了公立大学雇员的电子邮件地址——我们见过有人这么做。经纪人是否从互联网上抓取了电子邮件地址？经纪人是否访问了公开的
  Facebook 个人资料并获取了这些地址？所有这些获取电子邮件的方式，都会表现为发送者和接收者之间不同的关系。


  ***数据科学家在工作*** 115


  因此，我们需要做的是确定发送者和接收者之间的关系，以判断它看起来像是垃圾邮件发送者还是非垃圾邮件发送者的关系。再次强调，因为 MailChimp 与其他竞争对手不同，拥有关于邮件如何关联、人们在阅读什么、用户过去如何与邮件地址交互等海量全球信息，我们可以利用所有这些信息来解决这个问题。因此，我们可以计算出用户与他们构建的邮件列表之间的关系是否正常。我们通过围绕交易数据、元数据和邮件列表数据构建大量
  AI 模型来实现这一点。所以，当新用户注册时，我们可以将他们及其列表运行通过 AI 模型，要么允许他们通过，要么立即阻止他们。这种方法的好处在于，我们甚至可以在用户为邮件创建内容之前，就判断出我们是否应该阻止他，因为这种关系看起来非常可疑。当然，我们会与他们沟通，我们认为这种关系完全是虚假的，他们必须另寻出路，因为我们能立即判断出这看起来像是一个垃圾邮件发送者账户。


  **古铁雷斯:** 你是如何开始编程的？


  **福尔曼:** 大学时期，我主修纯数学，并且非常喜欢这门学科。我觉得抽象代数很棒。我也很喜欢数论中学到的东西。我觉得这一切都非常有趣。


  但我的导师，无论好坏，有一天坐下来对我说：“你知道吗？你可以一路走下去，在学术界成为一个相当平庸的数学家。你永远不会很出色，但如果你想的话，你可以成为那种默默无闻、平平庸庸的数学家。”那次谈话结束后，我想，好吧，他对我很坦白。他或多或少告诉了我未来在学术界的定位，那就是平庸，而这也是一条非常崇高的道路。




