  Analytics 的精品咨询公司工作，该公司为世界 500 强企业构建大规模定价模型。这些咨询项目为数据科学家提供了绝佳的机会。问题很复杂，影响顶层收入，并且拥有出色的数据集。你可以争辩说，像洲际酒店这样的公司在大数据概念出现之前就已经在做大数据了。但是，考虑到这些模型的最终客户，以及他们那些已经丑陋不堪、难以使用的企业商业智能工具——我就不点名了！——我提供的东西虽然严谨，但往往不够美观。


