  YouNoodle，正在为企业家构建一个社交网络。我联系他说：“嘿，鲍勃，我想你肯定生成了一些有趣的数据。我很乐意分析这些数据，而且对于我们能做什么，我有一堆想法。你听说过网络分析吗？如果有必要，我可以免费分析你的数据，只要让我摆弄一下就行。”


