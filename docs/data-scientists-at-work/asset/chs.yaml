- "# 排版后的文本\n\n在 DataKind，我们面临一个非常实际的挑战：如何衡量项目的成功。我们衡量一切，从数据科学和分析带来的组织效率提升，到组织的数据素养提高了多少。最终，我们至少要让我们参与的地方变得比以前更好，而这只有通过帮助与我们合作的每个组织提升其能力才能实现。\n\
  \n**Gutierrez：**数据科学的未来是什么样子？\n\n**Porway：**数据时代已经到来，而公众的数据素养将成为未来的必备技能。现在，数据素养就像是旧时代的读写能力，那时只有僧侣才能读写。这很危险，因为这意味着即便是心怀善意的僧侣，也只是从他们自己的世界观出发来决定写什么和读什么。只有当每个人都学会了读写，我们才拥有了丰富多彩的交流方式，人们可以分享思想。\n\
  \n我认为，目前数据科学正相似地被禁锢在学术界、大公司和华尔街的塔楼里。我们需要打破这些壁垒，让所有人都能至少就数据科学进行交流。否则，作为公民，我们可能会丧失批判性评估数据驱动结果的能力，这意味着我们会被操控、被利用，并被排除在对话之外。\n\
  \n随着政府和公司越来越多地使用数据科学，数据素养几乎开始像是一项公民权利。\n\n**Gutierrez：**与四年前相比，我们现在处于什么位置？你认为四年后我们会在哪里？\n\
  \n**Porway：**我认为科学将被民主化。我们一直在谈论数据和数据科学，但我认为我们真正在谈论的是一个科学的新时代。不再仅仅是学术界或政府实验室的专家才拥有收集信息、得出结论并在论文、发现和行动中发布的技术或能力。我们所有人都将成为科学家。\n\
  \n我们的孩子将来会嘲笑我们过去的日子。“你是怎么选水管工的？你只是在黄页上看到他就选了他？你就挨个打电话？什么？你为什么不用任何数据或证据来做决定？”或者，“你们是怎么吃饭的？哦，你们就跟着食谱吃？难道你们不知道自己的内分泌水平吗？你们是在自己身上做实验，全凭直觉吗？”我确实认为这一天肯定会到来，而且我认为这非常令人兴奋。这绝对是一些人可能还没有真正意识到的事情。这是一个公民科学的新时代，我们每个人都被赋予数据收集和分析工具，来研究我们的世界并了解我们自己。\n\
  \n**Gutierrez：**做好数据科学工作需要什么？\n\n**Porway：**我认为扎实的统计学背景是前提，因为你需要知道自己在做什么，并理解你所构建模型的内部机制。此外，我的统计学课程也教授了很多关于伦理学的知识，这也是我们在\
  \ DataKind 经常思考的问题。你总是需要思考你的工作将如何被应用。你可以给任何人一个算法。你可以给某人一个模型来使用“拦截与搜身”数据，警察会据此进行逮捕，但目的和结果是什么？这就像构建任何新技术一样，你必须权衡利弊和风险，因为你要对自己创造的东西负责。\n\
  \n无论你来自哪里，只要你理解你用来得出结论的工具，这就是你能做的最好的事情。我们现在都是科学家，我指的可不仅仅是设计产品。我们都在对我们生活的这个世界得出自己的结论。这就是统计学的意义所在——收集数据来证明一个假设，或者建立一个解释世界运作方式的模型。如果你盲目地相信那个模型的结果，那是危险的，因为那是你对世界的解读，而你的理解有多少缺陷，结果就会有多少缺陷。\n\
  \n简而言之，学习统计学，并保持深思熟虑。\n\n**Gutierrez：**数据科学家是否应该对他们的工作承担伦理责任？\n\n**Porway：**数据科学家应该，并且确实对他们所做的工作负有非常重大的伦理责任。作为一名数据科学家，你可能会发现自己本质上是在对用户进行某种心理实验。这是他需要深入思考的问题。最终的决定只能由你自己做出，但我们不能回避这样一个事实：我们作为数据科学家拥有巨大的影响力。\n\
  \n人们总是把数据当作“事实”，但它远非如此，这是一个我们需要不断传达的真相。作为数据科学家和数据素养较高的人，我们有伦理责任让数据和数据科学变得易于理解、可获得，并对我们周围的每个人不那么可怕。如果我们要创造一个每个人都能更好地利用数据和数据科学的世界，我们就必须摒弃专业术语，让我们的领域更容易被理解。普通大众越容易理解我们的工作，我们就越能就我们工作的伦理问题进行更好的对话。\n\
  \n**Gutierrez：**公司如何在其中发挥作用？\n\n**Porway：**我认为企业有一个绝佳的机会，成为这场伦理数据科学运动的合作伙伴。试想一下，用企业数据能做多少事情，这简直令人难以置信。仅仅通过应用程序，所有这些公司都已成为人类和自然数据的巨大仓库，我们可以从中学习很多东西，让世界变得更美好。\n\
  \n联合国全球脉动项目的 Robert Kirkpatrick 谈了很多这方面的问题，所以很多功劳都要归功于他。\n\n例如，看看 OkCupid，一个看似不具侵入性的约会应用。然而，他们有关于什么让人们相互感兴趣的数据。考虑到一个明显的限制前提（即用户群是年轻、精通技术的群体），他们可能拥有最大的现代人际关系数据库之一。最近有人提到，他们试图了解美国年轻人如何看待宗教在人际关系中的作用。他们想知道诸如：信教的年轻人主要是被其他信教的年轻人吸引，还是被不信教的年轻人吸引？大多数研究人员可能会为了通过复杂的调查来收集这些数据而苦苦挣扎。然而，OkCupid\
  \ 实际上可以很容易地用他们的数据回答这个问题。\n\n每家公司都拥有可以帮助让世界变得更美好的数据。LinkedIn 也许能在经济衰退发生之前就做出预测。谷歌发布了流感趋势，但他们有发布它的伦理责任吗？如果他们能预测流感，并且这能挽救生命，他们是否应该必须发布并告知世界？我认为，在我们作为一个专业领域向前发展，以及公司不断完善他们如何使用数据科学的过程中，这确实是一个现在和未来都非常值得讨论的话题。思考如何以符合伦理的方式使用数据来让世界变得更美好，这一点非常重要。\n\
  \n**Gutierrez：**通过与数据打交道，你形成了哪些个人理念？\n\n\n\n### 波维：质疑一切，但保持乐观\n\n我一直对科技持深度批判态度，因为它存在被滥用的可能。乔治·博克斯一个世纪以来都在说：所有模型都是错的，但有些模型是有用的。对我而言，这就是乐观的一面。当然，有些人可能会说，因为数据隐私问题，我们根本不该涉足数据科学。我们应该封锁数据，避免自食其果。我认为这过于极端了。质疑围绕数据、数据科学、数据隐私、数据伦理、数据滥用等问题是正确的。但这不应阻止我们寻找这些问题的解决方案，因为其益处远大于风险。我很乐观。是的，要怀疑，但同时也要确保保持乐观。\n\
