    ## 凝聚层次聚类


    凝聚模型是一种层次模型，它采用自底向上的方法来生成树状图。它首先创建 *n* 个簇（每个数据点一个），然后计算邻近度。之后，它合并彼此接近的簇，同时更新邻近度矩阵。最终结果是一个单一的簇。计算数据点之间距离的方法有多种。表
