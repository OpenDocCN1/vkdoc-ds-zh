    ## 结论


    本章涵盖了时间序列分析。我们训练了一个阶数为 `(1, 1, 1)`、季节性阶数为 `(1, 1, 1, 12)` 的 SARIMAX 模型。它预测了上升趋势；然而，由于序列中存在有影响力的数据点，该预测并不可靠。该模型在预测序列时会出现显著错误。下一章将介绍加法模型。


    # 4. 高质量时间序列分析


    前一章介绍了季节性 ARIMA。在数据预处理和超参数优化方面付出了大量努力之后，该模型在预测序列的未来实例时仍会产生相当大的误差。为了进行快速自动化的预测流程，请使用
    Facebook 的 Prophet；它基于包含季节性和假日效应的非线性趋势来预测时间序列数据。本章介绍 Prophet，并展示开发和测试加法模型的方法。首先，讨论
    Statsmodels 包和 Prophet 包之间的关键区别。


    ## Statsmodels 与 Prophet 的区别


    时间序列分析通常需要诊断和处理缺失值与异常值、使用多种检验统计量验证关键假设、进行超参数优化以及控制季节性效应。如果工作流程中出现一点小错误，模型在预测未来实例时就会产生重大错误。因此，使用
    Statsmodels 构建模型需要一定程度的精通。


    请牢记，机器学习的目标是用最少的代码赋予计算机智能。Statsmodels 并未提供这一点。Prophet 填补了这一空白。它由 Facebook 的核心数据科学团队开发。它可以执行缺失值和异常值检测、超参数优化以及季节性和假日效应控制等任务。要在
    Python 环境中安装 FB Prophet，请使用 `pip install fbprophet`。要在 Conda 环境中安装，请使用 `conda
    install -c conda-forge fbprophet`。


    ## 理解 Prophet 的组成部分


    在上一章中，我们费尽心力构建了一个包含三个组成部分的时间序列模型，即趋势、季节性和不规则成分。

