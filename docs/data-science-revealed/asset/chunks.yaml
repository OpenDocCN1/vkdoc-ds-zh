    ## 诊断残差


    残差表示实际值与预测值之间的差异。残差诊断涉及发现模型所犯错误的行为模式。我们可以使用多种工具来检查模型是否满足假设。分析残差最简单的方法是查看其平均值。如果残差的平均值接近
    0，则模型拟合良好。


    为了以图形方式表示残差并理解错误的行为模式，我们可以使用一些图，例如自相关函数图、偏自相关函数图、拟合值与残差值图、杠杆值与残差值图、拟合值与学生化残差值图、杠杆值与学生化残差值图（也称为
    Cook''s D 影响图）以及正态概率（或正态 Q-Q）图。这些图对于检测残差中的异常非常有用。


    如果残差中存在某种模式或形状，则模型违反了回归假设。主要有三种模式，即*扇形模式*，当变异性随预测值增加时发生（误差项不受自变量值影响）；*抛物线模式*，当预测值相关或存在乘法误差时发生；以及*双弓模式*，当自变量是比例或百分比时发生。还有其他因素会影响残差的行为模式，例如数据的分布和明显存在的异常值。确保我们为模型提供高质量的数据非常重要。

