    # Other Correlation Methods


    There are other methods used to measure correlation between variables, such as
    the Kendall method and the Spearman method. Their use depends on the use case.


    ## The Kendall Correlation Method


    The Kendall correlation method estimates the association between rankings in ordinal
    variables. An ordinal variable comprises categorical variables with unknown distances.
    An example of ordinal data is a Likert scale. The Kendall correlation method has
    values that range from -1 to 1, where -1 indicates that rankings are not the same,
    0 indicates that rankings are independent, and 1 indicates that two rankings are
    the same. Listing [5-3](#506148_1_En_5_Chapter.xhtml#PC3) produces the Kendall
    correlation matrix (see Figure [5-3](#506148_1_En_5_Chapter.xhtml#Fig3)).


    ![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig3_HTML.jpg](images/506148_1_En_5_Chapter/506148_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Kendall correlation matrix


    ```

    dfcorr_kendall = df.corr(method="kendall")

    sns.heatmap(dfcorr_kendall, annot=True,annot_kws={"size":12}, cmap="Oranges")

    plt.show()

    Listing 5-3

    Kendall Correlation Matrix

    ```


    Figure [5-3](#506148_1_En_5_Chapter.xhtml#Fig3) shows most rankings are close
    to being the same. There is a slight difference in the values produced by the
    Kendall correlation method and the Pearson correlation method.


    ## The Spearman Correlation Method


    The Spearman correlation method is an alternative rank correlation method. It
    measures the statistical dependence between the rankings of two variables. The
    method helps identify whether variables are linear. It also has values that range
    from -1 and 1, where -1 indicates that there is a weak association, 0 indicates
    that there is no association, and 1 indicates that there is a strong association.
    Listing [5-4](#506148_1_En_5_Chapter.xhtml#PC4) returns a Spearman correlation
    matrix (see Figure [5-4](#506148_1_En_5_Chapter.xhtml#Fig4)).


    ![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig4_HTML.jpg](images/506148_1_En_5_Chapter/506148_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Spearman correlation matrix


    ```

