    Partial Autocorrelation Function

    ```


    Lag 0 can explain all higher-order autocorrelation.


    ## Conclusion


    This chapter covered the simple linear regression method and the least-squares
    model and its application. It examined whether there is a significant difference
    between employees’ work experience and employees’ salaries using two regressors
    (applying both `Statsmodels` and `SciKit-Learn`). The findings suggest there is
    a significant difference between employees’ work experience and employees’ salaries.
    There is linearity, but the regressors violate certain regression assumptions.
    They make marginal errors due to minor abnormalities in the data (this is common
    with a small sample). The subsequent chapter covers techniques for dealing with
    errors; it introduces the concept of errors due to bias and variance and how to
    solve the errors using advanced parametric methods such as ridge regression and
    lasso regression.


    Footnotes [1](#506148_1_En_1_Chapter.xhtml#Fn1_source)


    # 2. Advanced Parametric Methods


    The method covered in the previous chapter violated certain regression assumptions.
    It cannot capture noise, and as a result, it makes mistakes when predicting future
    instances. The most convenient way of combating this problem involves adding a
    penalty term to the equation.


    This chapter introduces the novel concept of bias-variance trade-off, and it then
    covers regularized models like ridge regression, ridge with built-in cross-validation
    regression, and lasso regression. Last, it compares the performance of these models
    against that of the least-squares model. To tacitly understand regularizing models,
    you must first understand the concept of bias-variance trade-off. In the following
    section, we properly introduce the concept.


    ## Concepts of Bias and Variance


    *Bias* represents the closeness of estimates to the actual value, and *variance*
    represents how the data points vary for each realization of a model. Error due
    to bias occurs when a model class cannot fit the data. Developing a more expressive
    model class combats this problem. On the other hand, error due to variance represents
    the variability of a model’s prediction on a data point. This occurs when a model
    class can fit the data, but cannot do so. Developing a less expressive model class
    combats this problem.


    ![../images/506148_1_En_2_Chapter/506148_1_En_2_Fig1_HTML.png](images/506148_1_En_2_Chapter/506148_1_En_2_Fig1_HTML.png)


    Figure 2-1


    Bias and variance graphic definition


    Figure [2-1](#506148_1_En_2_Chapter.xhtml#Fig1) shows bias and variance.


    ## Bias-Variance Trade-Off in Action


    The bias-variance trade-off involves decreasing bias or variance at the expense
    of the other. We decrease variance to increase bias when there are a few variables
    in the data, there is a highly regularized model, the decision tree model has
    extremely pruned decision trees, and the K-nearest neighbor model has a large
    k. Figure [2-2](#506148_1_En_2_Chapter.xhtml#Fig2) shows an example of low bias
    (or high variance).


    ![../images/506148_1_En_2_Chapter/506148_1_En_2_Fig2_HTML.png](images/506148_1_En_2_Chapter/506148_1_En_2_Fig2_HTML.png)


    Figure 2-2


    Low bias/high variance


    We decrease bias to increase variance when there are several variables in the
    data, the model is unregularized, the decision tree model is unpruned, or the
    K-nearest neighbor model has a small k. Figure [2-3](#506148_1_En_2_Chapter.xhtml#Fig3)
    shows an example of high bias (or low variance).


    ![../images/506148_1_En_2_Chapter/506148_1_En_2_Fig3_HTML.png](images/506148_1_En_2_Chapter/506148_1_En_2_Fig3_HTML.png)


    Figure 2-3


    High bias/low variance


    Bias-variance trade-off is about addressing the problem of underfitting (when
    there is a low bias error term) and overfitting (when there is high variance).
    We decrease bias and variance based on the complexity of the model. Several parameters
    in a model increase the complexity of the model and variance and decrease bias.


    ## Ridge Regression


    We also recognize ridge regression as Tikhonov or L2 regularization. This model
    addresses the problem of multicollinearity by minimizing variables by a small
    k along each eigenvector to ensure that there is a narrow spread in axes. Similar
    to the least squares regressor, it assumes linearity and normality in the data.
    The major difference between the two models is that the ridge regressor assumes
    that after normalizing the data, coefficients are small. It also assumes that
    as the value of k increases, coefficients with multicollinearity alter their behavior.
    Given this assumption, the model sharply decreases coefficients to zero. At most,
    the value of k of the ridge regressor is less than the value of k of the least
    squares model.


    It shrinks the estimates to stabilize variability by adding bias (introducing
    a penalty and controlling for shrinkage to the least squares function). It prevents
    the values of the independent variable from exploding, reduces standard errors,
    and provides more reliable estimates. This procedure minimizes the penalized sum
    of residuals and carefully controls the considerable amount of shrinkage in a
    regression model. It changes the cost function by adding a penalty term (a term
    relative to the sum of squares of the coefficients). A constant penalty term ranges
    from 0 to 1. It controls estimates, β, and as a result, high variance is more
    likely to occur. The least squares model does not control the loss function of
    the ridge model. Equation 2-1 expresses a standard ridge formula.


    ![$$ {\beta}^{ridge}={\left({X}^{\prime }X+{\lambda}_2\right)}^{-1}{X}^{\prime
    }y $$](images/506148_1_En_2_Chapter/506148_1_En_2_Chapter_TeX_Equ1.png)


    (Equation 2-1)


    Here, `λ[2]` represents the ridge penalty term responsible for penalizing the
    squared regression coefficient. The penalty term controls the size of the coefficients
    and the amount of regularization.'
