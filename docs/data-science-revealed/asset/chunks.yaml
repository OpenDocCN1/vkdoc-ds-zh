    ### R 平方


    R 平方（R²）表示模型所能解释的数据变异程度。该指标的取值范围为 0 到 1，其中 0 表示回归模型对数据变异性的解释能力很差，而 1 则表示回归模型对数据的解释能力最佳。


    ![$$ {R}²=1-\frac{\sum {\left({y}_i-\hat{y}\right)}²}{\sum {\left({y}_i-\underset{\_}{y}\right)}²}
    $$](img/506148_1_En_1_Chapter_TeX_Equ12.png)


    （公式 1-12）


    此处，![$$ \hat{y} $$](img/506148_1_En_1_Chapter_TeX_IEq4.png) 表示 `y` 的预测值，而 ![$$
    \underset{\_}{y} $$](img/506148_1_En_1_Chapter_TeX_IEq5.png) 表示 `y` 的平均值。R² 分数需要乘以一百。例如，如果分数是
    0.9，那么模型解释了数据中 90% 的变异。


    还有其他用于模型评估的指标，例如：


    *   *解释方差分数*：一个衡量模型与实际数据之间差异的指标。如果该分数接近 1，则表明存在强相关性。

    *   *平均伽马偏差*：一个衡量因变量尺度并估计相对误差的指标。它是幂参数为 2 的 Tweedie 偏差。

    *   *平均泊松偏差*：一个衡量因变量尺度并估计相对误差的指标。它是幂参数为 1 的 Tweedie 偏差。


