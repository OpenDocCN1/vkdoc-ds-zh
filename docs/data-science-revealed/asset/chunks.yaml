    Listing 3-4

    Autocorrelation

    ```


    图 3-3 显示了美元/南非兰特每日收益率，其中大部分尖峰在统计上不显著。


    # 自相关函数


    清单 3-5 展示了自相关函数（ACF）图。图 3-4 考虑了趋势、季节性、周期性和残差成分。


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig4_HTML.jpg](img/506148_1_En_3_Fig4_HTML.jpg)


    **图 3-4** ACF 图


    ```

    plot_acf(df["Close"])

    plt.xlabel("Lag")

    plt.ylabel("ACF")

    plt.show

    Listing 3-5

    ACF Plot

    ```


    # 偏自相关


    清单 3-6 展示了偏自相关（PACF）。图 3-5 显示了在低阶滞后中未解释的偏相关系数。在滞后 1 处有一个显著的尖峰。第一个滞后解释了所有高阶自相关。


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig5_HTML.jpg](img/506148_1_En_3_Fig5_HTML.jpg)


    **图 3-5** PACF 图


    ```

