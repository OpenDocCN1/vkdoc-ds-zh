    bias_regularizer=regularizers.l2(0.001)))

    model4.add(Dense(8, activation="relu"))

    model4.add(Dense(1, activation="relu"))

    model4.compile(loss="binary_crossentropy", optimizer=optimizer, metrics=["accuracy"])

    return model4

