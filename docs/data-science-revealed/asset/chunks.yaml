    ## The Eigen Matrix


    To reliably find the severity of the correlation between variables, use the eigenvalues.
    An eigenvalue less than 0 indicates multicollinearity, between 10 and 100 indicates
    slight multicollinearity, and more than 100 indicates severe multicollinearity.
