    # 3. 时间序列分析


    本章介绍一种复杂的回归方法，称为*时间序列分析*。与回归方法类似，时间序列对数据的底层结构做出了强有力的假设。我们将时间序列分析视为一种参数方法，因为它处理的是连续变量。请记住，我们并不将序列分析局限于连续变量；我们也可以分析与时间相关的分类变量。


    本章介绍了用于检验假设的实证检验，然后介绍了分析时间序列的标准技术，如季节性分解和平滑。之后，它展示了如何估计收益率以及如何计算最小值和最大值。最后，涵盖了
    `SARIMAX` 模型的开发和评估。


    ## 什么是时间序列分析？


    时间序列分析使我们能够识别序列中明显的趋势和一致的模式。它捕捉变量随时间的变化。在连续时间序列分析中，我们持续检查一个变量。我们在特定时间点定义序列，而不是在每个时间点。例如，我们将使用外汇的收盘价（每个交易日有一个收盘价）。我们从雅虎获取了示例数据（这是关于
    2010 年 7 月 3 日至 2020 年 7 月 4 日期间美元/南非兰特货币对价格的时间序列数据）。

