    ![$$ {e}_1^2+{e}_2^2\dots {e}_i^2 $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ4.png)


    (Equation 1-4)


    Equation 1-4 assumes that residuals are always equal to zero and that estimates
    are unbiased.


    ## Regression Assumptions


    If a regressor satisfies the assumptions specified in Table [1-1](#506148_1_En_1_Chapter.xhtml#Tab1),
    then it is reliable.


    Table 1-1


    Linear Regression Assumptions


    | Assumption | Description |

    | --- | --- |

    | **Linearity** | There must be a linear relationship between an independent variable
    and a dependent variable. We verify this assumption using a pairwise scatter plot.
    |

    | **Normality** | Data must come from a normal distribution. There is a normal
    distribution when values of a variable spread symmetrically around the true mean
    value. We verify this assumption using a normal probability plot (also called
    a *normal Q-Q plot*). For a reliable test of normality, use a test statistic called
    the *Kolmogorov-Smirnov test*. If there is no normality, then transform the data.
    |

    | **Multicollinearity** | There must be little or no multicollinearity in the
    data. If an independent variable has a high correlation, then there is multicollinearity.
    We verify this assumption by using a correlation matrix, tolerance, and VIF. If
    there is multicollinearity, we must center the data. The example data has one
    dependent variable, so multicolllinearity with VIF is not covered. |

    | **No autocorrelation** | There must be no autocorrelation in the residuals.
    There is autocorrelation when residuals are not independent of each other. We
    verify this assumption using a lag plot, autocorrelation function plot, and partial
    autocorrelation plot. For a reliable test of autocorrelation, use the Dublin-Watson
    test. |


    In contrast, if a regressor violates the underlying regression assumption, then
    it becomes difficult to generalize a model.


    ## Simple Linear Regression in Practice


    The example data^([¹](#fn1)) has two columns (each column represents a variable).
    The first column contains the values of employees’ years of work experience (an
    independent variable), and the second column contains the values of employees’
    salaries (a dependent variable).


    ## Check Data Quality


    The least-squares model is sensitive (the quality of the data influences its performance).
    For optimal model performance, ensure there are no missing values or outliers
    and scale the data prior to training the regressor.


    ### Detect Missing Values


    The visible presence of missing values in the data results in poor model performance.
    To avoid this dilemma, after loading the data, check whether there are missing
    values in the data.


    #### Missing Values Heatmap


    Listing [1-1](#506148_1_En_1_Chapter.xhtml#PC1) plots a heatmap that shows the
    missing values (see Figure [1-2](#506148_1_En_1_Chapter.xhtml#Fig2)).


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig2_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Missing values heatmap


    ```

    import seaborn as sns

    sns.heatmap(df.isnull(),cmap="Blues")

    plt.show()

    Listing 1-1

    Missing Values Heatmap

    ```


    Figure [1-2](#506148_1_En_1_Chapter.xhtml#Fig2) shows that there are no missing
    values detected in the data. If there are missing values in the data, the heatmap
    looks like Figure [1-3](#506148_1_En_1_Chapter.xhtml#Fig3).


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig3_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Missing values heatmap


    If there are missing values in the data, replace the missing values with the mean
    value or the median of the variable. Listing [1-2](#506148_1_En_1_Chapter.xhtml#PC2)
    replaces the missing values with the mean value.


    ```

    df["YearsExperience"].fillna(df["YearsExperience"].mean())

    df["Salary"].fillna(df["YearsExperience"].mean())

    Listing 1-2

    Replace Missing Values with the Mean Value

    ```


    Listing [1-3](#506148_1_En_1_Chapter.xhtml#PC3) replaces missing values with the
    median value.


    ```

    df["YearsExperience"].fillna(df["YearsExperience"].median())

    df["Salary"].fillna(df["YearsExperience"].median())

    Listing 1-3

    Replace Missing Values with the Median Value

    ```'
  trans: "\n# 1. 简单线性回归入门\n\n本书将带你进入数据科学的世界，揭示进行数据科学研究的正确方法。书中涵盖了必要的统计与编程技术，帮助你从宏观视角理解数据科学。不仅如此，它还为运用数据科学技术解决问题提供了理论、技术和数学基础。\n\
    \n本章将介绍*参数方法*，也称为*线性方法*。理解如何在违反回归假设的情况下测试回归模型，将使你能够轻松应对后续章节中的问题。阅读时需注意，示例数据中只有一个因变量。本章不涉及使用方差膨胀因子（`VIF`）处理多重共线性问题。\n\
    \n简单线性回归用于估计自变量与因变量之间关系的性质，其中*自变量*可以是连续变量或分类变量，而*因变量*则必然是连续变量。它研究自变量的变化如何影响因变量的变化。标准公式如公式\
    \ 1-1 所示。\n\n![$$ y=a+ bx $$](img/506148_1_En_1_Chapter_TeX_Equ1.png)\n\n（公式 1-1）\n\
    \n其中，`y` 代表因变量，`a` 代表截距（当自变量保持不变时因变量的均值），`b` 代表斜率或梯度（直线的方向），`x` 代表自变量。\n\n该模型为数据点拟合一条直线。如果它能完美地将直线拟合到数据点上，那么这就是一个典范模型。相反，如果数据点严重偏离直线，则违反了回归假设。\n\
    \n![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig1_HTML.png](img/506148_1_En_1_Fig1_HTML.png)\n\
    \n图 1-1\n\n完美线性回归模型的成对散点图\n\n图 1-1 展示了一个最优模型（由于变异性，这在现实世界中几乎不可能发生）。大多数情况下，数据点会散布在直线附近。为了解决这个问题，回归模型（或称回归器）在建模过程中引入了一个误差项，以使数据点的平方偏差尽可能小。它通过估计截距和斜率来减小误差项。最常见的回归模型是最小二乘模型。公式\
    \ 1-2 表达了最小二乘模型的公式。\n\n![$$ \\hat{y}={\\beta}_0+{\\beta}_1{X}_1+{\\varepsilon}_i\
    \ $$](img/506148_1_En_1_Chapter_TeX_Equ2.png)\n\n（公式 1-2）\n\n其中，`ŷ` 代表期望的因变量，`β₀`\
    \ 代表截距，`β₁` 代表斜率，`X₁` 代表自变量，`εᵢ` 代表误差项（即 `n` 个数据点中第 `i` 个点的残差），如公式 1-3 所示。\n\n\
    ![$$ {e}_i={y}_i-\\hat{y_i} $$](img/506148_1_En_1_Chapter_TeX_Equ3.png)\n\n（公式\
    \ 1-3）\n\n最小二乘回归模型确保残差的平方和较小。公式 1-4 利用以下性质估计残差的平方和。\n\n![$$ {e}_1²+{e}_2²\\dots\
    \ {e}_i² $$](img/506148_1_En_1_Chapter_TeX_Equ4.png)\n\n（公式 1-4）\n\n公式 1-4 假设残差始终为零，且估计值是无偏的。\n\
    \n## 回归假设\n\n如果回归模型满足表 1-1 中指定的假设，那么它就是可靠的。\n\n表 1-1\n\n线性回归假设\n\n| 假设 | 描述 |\n\
    | --- | --- |\n| **线性性** | 自变量与因变量之间必须存在线性关系。我们通过成对散点图来验证这一假设。 |\n| **正态性** |\
    \ 数据必须来自正态分布。当变量的值围绕真实均值对称分布时，即为正态分布。我们通过正态概率图（也称为*正态 Q-Q 图*）来验证这一假设。为了进行可靠的正态性检验，可使用名为*柯尔莫哥洛夫-斯米尔诺夫检验*的检验统计量。如果不满足正态性，则需对数据进行变换。\
    \ |\n| **多重共线性** | 数据中必须几乎没有或完全没有多重共线性。如果自变量之间存在高度相关性，则存在多重共线性。我们通过使用相关矩阵、容忍度和`VIF`来验证这一假设。如果存在多重共线性，则必须对数据中心化。示例数据只有一个因变量，因此不涉及使用`VIF`处理多重共线性。\
    \ |\n| **无自相关** | 残差中必须不存在自相关。当残差彼此不独立时，即存在自相关。我们通过滞后图、自相关函数图和偏自相关图来验证这一假设。为了进行可靠的自相关检验，可使用德宾-沃森检验。\
    \ |\n\n相反，如果回归模型违反了基本的回归假设，那么模型将难以泛化。\n\n## 实践中的简单线性回归\n\n示例数据¹包含两列（每列代表一个变量）。第一列包含员工工作年限的值（自变量），第二列包含员工薪资的值（因变量）。\n\
    \n## 检查数据质量\n\n最小二乘模型是敏感的（数据质量会影响其性能）。为了获得最佳模型性能，需确保数据中没有缺失值或异常值，并在训练回归模型之前对数据进行缩放。\n\
    \n### 检测缺失值\n\n数据中明显存在的缺失值会导致模型性能不佳。为避免此困境，在加载数据后，应检查数据中是否存在缺失值。\n\n#### 缺失值热力图\n\
    \n代码清单 1-1 绘制了一个显示缺失值的热力图（见图 1-2）。\n\n![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig2_HTML.jpg](img/506148_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2\n\n缺失值热力图\n\n```\nimport seaborn as sns\nsns.heatmap(df.isnull(),cmap=\"\
    Blues\")\nplt.show()\n```\n\n代码清单 1-1  \n缺失值热力图\n\n图 1-2 显示数据中未检测到缺失值。如果数据中存在缺失值，热力图将如图\
    \ 1-3 所示。\n\n![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig3_HTML.jpg](img/506148_1_En_1_Fig3_HTML.jpg)\n\
    \n图 1-3\n\n缺失值热力图\n\n如果数据中存在缺失值，请用该变量的均值或中位数替换缺失值。代码清单 1-2 使用均值替换缺失值。\n\n```\n\
    df[\"YearsExperience\"].fillna(df[\"YearsExperience\"].mean())\ndf[\"Salary\"\
    ].fillna(df[\"YearsExperience\"].mean())\n```\n\n代码清单 1-2  \n用均值替换缺失值\n\n代码清单\
    \ 1-3 使用中位数替换缺失值。\n\n```\ndf[\"YearsExperience\"].fillna(df[\"YearsExperience\"\
    ].median())\ndf[\"Salary\"].fillna(df[\"YearsExperience\"].median())\n```\n\n\
    代码清单 1-3  \n用中位数替换缺失值\n"
- fmt: '### Detect Normality


    Regressors assume the data follows a normal distribution (data points are spread
    symmetrically around the true mean value). If the data is not normal, perform
    data transformation to reduce its skewness. Negatively skewed data requires a
    power transformation or an exponential transformation. In contrast, positively
    skewed data requires a log transformation or square root transformation. A standardized
    normal distribution with different means and variances is written mathematically
    in terms of the distribution.


    ![$$ N\left(0,1\right) $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ5.png)


    (Equation 1-5)


    Here, the mean value is equal to 0, and the standard deviation is equal to 1.


    #### Histogram


    A histogram plot has the intervals of a variable on the x-axis and the frequency
    of the values on the y-axis. Listing [1-4](#506148_1_En_1_Chapter.xhtml#PC4) plots
    the employee’s years of work experience, and Figure [1-4](#506148_1_En_1_Chapter.xhtml#Fig4)
    exhibits the distribution of employees’ years of work experience.


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig4_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    Histogram


    ```

    sns.distplot(df["YearsExperience"])

    plt.ylabel("Frequency")

    plt.xlabel("Experience")

    plt.show()

    Listing 1-4

    Employees’ Years of Work Experience Histogram

    ```


    Figure [1-4](#506148_1_En_1_Chapter.xhtml#Fig4) shows that the values of employees’
    years of work experience slightly follow a normal distribution. We cannot summarize
    the independent variable using the mean value.


    Listing [1-5](#506148_1_En_1_Chapter.xhtml#PC5) plots the histogram for employees’
    salaries (see Figure [1-5](#506148_1_En_1_Chapter.xhtml#Fig5)).


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig5_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Histogram


    ```

    sns.distplot(df["Salary"])

    plt.ylabel("Frequency")

    plt.xlabel("Salary")

    plt.show()

    Listing 1-5

    Employees’ Salaries Histogram

    ```


    Both Figure [1-4](#506148_1_En_1_Chapter.xhtml#Fig4) and Figure [1-15](#506148_1_En_1_Chapter.xhtml#Fig15)
    show nonextreme normal distributions. Skewness frequently occurs when there are
    outliers in the data.


    ### Detect Outliers


    An outlier represents a data point that is too small or large. It can influence
    the model by inflating error rates. If there are outliers in the data, remove
    them, or replace them with the mean value or median value.'
