- fmt: '### Feature Importance


    Feature importance determines the relative importance of independent variables
    to a dependent variable. It allocates a score that ranges from 0 to 1 to each
    independent variable. An independent variable with the highest score is the most
    important variable, an independent variable with the second highest score is the
    second most important variable, and so forth. Listing [8-5](#506148_1_En_8_Chapter.xhtml#PC5)
    plots feature importance (see Figure [8-3](#506148_1_En_8_Chapter.xhtml#Fig3)).


    ![../images/506148_1_En_8_Chapter/506148_1_En_8_Fig3_HTML.jpg](images/506148_1_En_8_Chapter/506148_1_En_8_Fig3_HTML.jpg)


    **Figure 8-3** Feature importance


    ```

    diabetes_features = [x for i,x in enumerate(df.columns) if i!=8]

    def plot_feature_importances_diabetes(model):

    plt.figure(figsize=(8,6))

    n_features = 8

    plt.barh(range(n_features), model.feature_importances_, align="center")

    plt.yticks(np.arange(n_features), diabetes_features)

    plt.xlabel("Feature Importance")

    plt.ylabel("Feature")

    plt.ylim(-1, n_features)

    plot_feature_importances_diabetes(dt)

    plt.savefig(''feature_importance'')

    Listing 8-5

    Feature Importance

    ```


    Figure [8-3](#506148_1_En_8_Chapter.xhtml#Fig3) shows that there are a few important
    variables to the dependent variable. `Glucose` has the topmost score, meaning
    that it is more important than other variables to the dependent variable (diabetes
    outcome). This is followed by `bmi` and `age`, respectively.


    We use the previous findings to reduce the number of variables in the data. Listing
    [8-6](#506148_1_En_8_Chapter.xhtml#PC6) reduces the data.


    ```

    x = df[["Glucose","DiabetesPedigreeFunction","Age"]]

    x = df.iloc[::,0:8]

    y = df.iloc[::,-1]

    x_train, x_test, y_train, y_test = train_test_split(x,y,test_size=0.2,random_state=0)

    scaler = StandardScaler()

    x_train = scaler.fit_transform(x_train)

    x_test = scaler.transform(x_test)

    dt = DecisionTreeClassifier(criterion= ''entropy'', max_depth= 3)

    dt.fit(x_train,y_train)

    Listing 8-6

    Re-processing

    ```


    ### Evaluate the Decision Tree Classifier


    Listing [8-7](#506148_1_En_8_Chapter.xhtml#PC7) returns a table that compares
    actual values and predicted values (see Table [8-1](#506148_1_En_8_Chapter.xhtml#Tab1)).


    **Table 8-1** Actual Values and Predicted Values


    |   | Actual | Predicted |

    | --- | --- | --- |

    | **661** | 1 | 1 |

    | **122** | 0 | 0 |

    | **113** | 0 | 0 |

    | **14** | 1 | 0 |

    | **529** | 0 | 0 |

    | **...** | ... | ... |

    | **476** | 1 | 0 |

    | **482** | 0 | 0 |

    | **230** | 1 | 1 |

    | **527** | 0 | 0 |

    | **380** | 0 | 0 |


    ```

    y_preddt = dt.predict(x_test)

    pd.DataFrame({"Actual":y_test, "Predicted": y_preddt})

    Listing 8-7

    Actual Values and Predicted Values

    ```


    #### Confusion Matrix


    Listing [8-8](#506148_1_En_8_Chapter.xhtml#PC8) and Table [8-2](#506148_1_En_8_Chapter.xhtml#Tab2)
    show the performance of the decision tree classifier. It has four combinations
    of actual values and predicted values.


    **Table 8-2** Confusion Matrix


    |   | Predicted: No | Predicted: Yes |

    | --- | --- | --- |

    | **Actual: No** | 93 | 14 |

    | **Actual: Yes** | 23 | 24 |


    ```

    cmatdt = pd.DataFrame(metrics.confusion_matrix(y_test,y_preddt), index=["Actual:
    No","Actual: Yes"],

    columns=("Predicted: No","Predicted: Yes"))

    cmatdt

    Listing 8-8

    Confusion Matrix

    ```


    #### Classification Report


    To gain deep insight into the decision tree classifier’s performance, we use the
    classification report. Listing [8-9](#506148_1_En_8_Chapter.xhtml#PC9) tabulates
    a classification report (see Table [8-3](#506148_1_En_8_Chapter.xhtml#Tab3)).


    **Table 8-3** Classification Report


    |   | precision | recall | f1-score | support |

    | --- | --- | --- | --- | --- |

    | **0** | 0.801724 | 0.869159 | 0.834081 | 107.00000 |

    | **1** | 0.631579 | 0.510638 | 0.564706 | 47.00000 |

    | **accuracy** | 0.759740 | 0.759740 | 0.759740 | 0.75974 |

    | **macro avg** | 0.716652 | 0.689899 | 0.699393 | 154.00000 |

    | **weighted avg** | 0.749797 | 0.759740 | 0.751869 | 154.00000 |


    ```

    creportdt = pd.DataFrame(metrics.classification_report(y_test,y_preddt, output_dict=True)).transpose()

    creportdt

    Listing 8-9

    Classification Report

    ```


    Table [8-3](#506148_1_En_8_Chapter.xhtml#Tab3) indicates that the decision tree
    classifier performs poorly. The accuracy score is 74%, which is about 8% lower
    than the accuracy score of the logistic regression classifier, linear support
    vector classifier, and linear discriminant analysis classifier. The classifier
    also has a lower precision score than both classifiers.


    #### ROC Curve


    The most reliable way involves predicting the probabilities of each class. First,
    we predict the probabilities of each class. Thereafter, we construct an ROC and
    find the AUC. Listing [8-10](#506148_1_En_8_Chapter.xhtml#PC10) produces an ROC
    curve (see Figure [8-4](#506148_1_En_8_Chapter.xhtml#Fig4)).


    ![../images/506148_1_En_8_Chapter/506148_1_En_8_Fig4_HTML.jpg](images/506148_1_En_8_Chapter/506148_1_En_8_Fig4_HTML.jpg)


    **Figure 8-4** ROC curve


    ```

    y_preddt_proba = dt.predict_proba(x_test)[::,1]

    fprdt, tprdt, _ = metrics.roc_curve(y_test,y_preddt_proba)

    aucdt = metrics.roc_auc_score(y_test, y_preddt_proba)

    plt.plot(fprdt, tprdt, label="AUC: "+str(aucdt), color="navy")

    plt.plot([0,1],[0,1],color="red")

    plt.xlim([0.00,1.01])

    plt.ylim([0.00,1.01])

    plt.xlabel("Specificity")

    plt.ylabel("Sensitivity")

    plt.legend(loc=4)

    plt.show()

    Listing 8-10

    ROC Curve

    ```


    Figure [8-4](#506148_1_En_8_Chapter.xhtml#Fig4) shows that the AUC score is close
    to 80%. Ideally, we want an AUC score greater than 80%. The previous AUC score
    shows that the classifier is not skillful in distinguishing between classes.


    #### Precision-Recall Curve


    Listing [8-11](#506148_1_En_8_Chapter.xhtml#PC11) produces a curve that gives
    meaningful insight about false positives and false negatives (see Figure [8-5](#506148_1_En_8_Chapter.xhtml#Fig5)).


    ![../images/506148_1_En_8_Chapter/506148_1_En_8_Fig5_HTML.jpg](images/506148_1_En_8_Chapter/506148_1_En_8_Fig5_HTML.jpg)


    **Figure 8-5** Precision-recall curve


    ```

    precisiondt, recalldt, thresholddt = metrics.precision_recall_curve(y_test,y_preddt)

    apsdt = metrics.roc_auc_score(y_test,y_preddt)

    plt.plot(precisiondt, recalldt, label="APS: "+str(apsdt),color="navy")

    plt.axhline(y=0.5,color="red")

    plt.xlabel("Recall")

    plt.ylabel("Precision")

    plt.legend(loc=4)

    plt.show()

    Listing 8-11

    Precision-Recall Curve

    ```


    Without considering the decision thresholds, the APS is 69%.


    #### Learning Curve


    Listing [8-12](#506148_1_En_8_Chapter.xhtml#PC12) produces a curve that depicts
    the progression of the `LinearSVC` classifier’s accuracy as it learns the training
    data (see Figure [8-6](#506148_1_En_8_Chapter.xhtml#Fig6)).


    ![../images/506148_1_En_8_Chapter/506148_1_En_8_Fig6_HTML.jpg](images/506148_1_En_8_Chapter/506148_1_En_8_Fig6_HTML.jpg)


    **Figure 8-6** Learning curve


    ```

    trainsizedt, trainscoredt, testscoredt = learning_curve(dt, x, y, cv=5, n_jobs=5,
    train_sizes=np.linspace(0.1,1.0,50))

    trainscoredt_mean = np.mean(trainscoredt,axis=1)

    testscoredt_mean = np.mean(testscoredt,axis=1)

    plt.plot(trainsizedt,trainscoredt_mean,color="red", label="Training Score")

    plt.plot(trainsizedt,testscoredt_mean,color="navy", label="Cross Validation Score")

    plt.xlabel("Training Set Size")

    plt.ylabel("Accuracy")

    plt.legend(loc=4)

    plt.show()

    Listing 8-12

    Learning Curve

    ```


    Figure [8-6](#506148_1_En_8_Chapter.xhtml#Fig6) shows that the training accuracy
    score is higher than the cross validation from the time the decision tree classifier
    learns the data. The classifier starts off very optimistic, but as we increase
    the training set, the size drops and becomes comfortable around the 0.75 to 0.80
    range.'
