    method to split data into training data, test data, and validation data.


    ```

    train, valid, test = df.split_frame(ratios=[.8, .1], seed=1234)

    print("Train shape: ", train.shape)

    print("Valid shape: ", valid.shape)

    print("Test shape: ", test.shape)

    Listing 13-5

    Split Data into Training Data, Test Data and Validation Data

    ```


    ## Model Training


    Listing [13-6](#506148_1_En_13_Chapter.xhtml#PC6) completes the logistic classifier.


    ```

    from h2o.estimators.glm import H2OGeneralizedLinearEstimator glm = H2OGeneralizedLinearEstimator(family="binomial")
    glm.train(x=x, y=y, training_frame=train, validation_frame=valid)

    Listing 13-6

    Finalize the Logistic Classifier

    ```


    We specified the family type as “binomial” since we are solving a binary classification
    problem. If we were solving a multiclass classification problem, then we would
    have specified the family type as “multinomial.”


    ### Model evaluation


    Throughout the book, we depended on the confusion matrix, classification report,
    ROC curve, Precision-Recall curve, and learning curve to conclude about the binary
    classifiers’ performance. The SciKit-Learn package provides a few matrices compared
    to the H2O package. Underneath, we adequately discuss classification evaluation
    metrics available in the H2O package, and we then show you how to estimate them.
    We begin with the Gini Index.


    #### Gini Index


    The H2O package enables us to obtain the Gini Index value, which measures the
    extent to which there is inequality in the values. We use the index to correctly
    determine the quality of a classifier. The index compromises values that range
    from 0 to 1. Where 0 shows that a classifier has perfect equality and 1 shows
    that a classifier has perfect inequality. When we develop a classifier, we ordinarily
    expect to find a Gini Index value that is closer to 1. Listing [13-7](#506148_1_En_13_Chapter.xhtml#PC7)
    returns estimates of the Gini index.


    ```

    glm.gini(train=True, valid=True, xval=False)

    {''train'': 0.6828073360331426, ''valid'': 0.548148148148148}

    Listing 13-7

    Gini Index

    ```


    The Gini Index value of the training data is 0.68 and the value of the validation
    data is 0.55. Both sets are on the borderline between equality and non-equality.
    We do not have perfect inequality, as expected. However, the values are not small
    enough to affect conclusions about the classifier.


    #### Absolute Matthews Correlation Coefficient


    Another classification model evaluation metric available on the H2O package is
    the Absolute Matthews Correlation Coefficient (MCC). We use it to determine the
    nature of the correlation between the actual classes and those predicted by a
    classifier. MCC has values that range from -1 to 1. Where -1 shows that a classifier
    makes many errors when predicting classes, 0 shows that a classifier struggles
    with guesstimating classes and 1 shows that a classifier is not skillful in distinguishing
    classes. Listing [13-8](#506148_1_En_13_Chapter.xhtml#PC8) returns estimates of
    the Absolute MCC.


    ```

    glm.mcc(train=True, valid=True, xval=False)

    {''train'': [[0.3356601829569534, 0.5297584436640914]],

    ''valid'': [[0.3790626186045188, 0.39336862882432994]]}

    Listing 13-8

    Absolute MCC

    ```


    The finding above shows that there is a weak positive correlation between actual
    classes and those predicted by the classifier.


    #### Confusion Matrix


    Listing [13-9](#506148_1_En_13_Chapter.xhtml#PC9) returns abstract information
    about a classifier’s performance. (see Table [13-2](#506148_1_En_13_Chapter.xhtml#Tab2)).


    Table 13-2 Confusion Matrix


    |   |   | 0 | 1 | Error | Rate |

    | --- | --- | --- | --- | --- | --- |

    | **0** | 0 | 306.0 | 90.0 | 0.2273 | (90.0/396.0) |

    | **1** | 1 | 49.0 | 168.0 | 0.2258 | (49.0/217.0) |

    | **2** | Total | 355.0 | 258.0 | 0.2268 | (139.0/613.0) |


    ```

    glm.confusion_matrix()

    Listing 13-9

    Confusion Matrix

    ```


    Listing [13-10](#506148_1_En_13_Chapter.xhtml#PC10) finds the F1 score of both
    the training data and validation data.


    ```

    glm.F1(train=True, valid=True, xval=False)

    {''train'': [[0.3356601829569534, 0.7073684210526315]],

    ''valid'': [[0.3790626186045188, 0.5405405405405405]]}

    Listing 13-10

    F1 Score Both the Training Data and Validation Data

    ```


    The findings above show that the logistic classifier has decent precession and
    recall. Listing [13-11](#506148_1_En_13_Chapter.xhtml#PC11) finds the accuracy
    coefficient.


    ```

    glm.accuracy(train=True, valid=True, xval=False)

    {''train'': [[0.5331122058852918, 0.7862969004893964]], ''valid'': [[0.8926783510054471,
    0.8115942028985508]]}

    Listing 13-11

    Accuracy Coefficient

    ```


    Listing [13-12](#506148_1_En_13_Chapter.xhtml#PC12) produces a curve that summarize
    how skillful the classifier is in distinguishing classes (see Figure [13-1](#506148_1_En_13_Chapter.xhtml#Fig1)).


    ![../images/506148_1_En_13_Chapter/506148_1_En_13_Fig1_HTML.jpg](images/506148_1_En_13_Chapter/506148_1_En_13_Fig1_HTML.jpg)


    Figure 13-1 ROC Curve


    ```

    glm_perf.plot()

    Listing 13-12

    ROC Curve

    ```


    Figure [13-1](#506148_1_En_13_Chapter.xhtml#Fig1) exhibits the characteristics
    of a well-behaved curve; it follows the left-hand-side of the border in the beginning.
    However, as we increase the false positive rate, the true positive rate also increases.'
