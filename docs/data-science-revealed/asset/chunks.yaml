- fmt: '# 12. Neural Networks


    This chapter introduces a subfield of machine learning frequently recognized as
    deep learning. First, it introduces different artificial neural networks. Second,
    we cover back propagation and forward propagation. Third, it presents different
    activation functions. Last, it builds and test a Restricted Boltzmann Machine
    and a multilayer perceptron using the `SciKit-Learn` package, followed by deep
    belief networks using the `Keras` package. To install `Keras` on the Python environment,
    use `pip install Keras` and on the conda environment use `conda install -c conda-forge
    keras`.


    An artificial neural network is an interconnected group of nodes that retrieves
    and processes input values using different weights and biases across layers until
    there is an output value. A neural network comprises several layers with configured
    nodes. Each node in a hidden layer and output layer contains its own classifier.
    Nodes in the visible layer retrieve input values, thereafter, the activation happens.
    Table [12-1](#506148_1_En_12_Chapter.xhtml#Tab1) highlights several types of neural
    networks and their applications.


    **Table 12-1** Types of Neural Networks and their Applications


    | Neural Network | Application |

    | --- | --- |

    | `Restricted Boltzmann Machine` or `Autoencoder` | Unlabelled data, variable
    extraction, and pattern recognition |

    | `Recursive Neural Tensor Network` or `Recurrent Neural Network` | Text processing^([^(12)](#fn12))
    |

    | `Deep Belief Net` or `Convolutional Neural Network` | Image recognition |

    | `Recurrent Neural Network` | Speech recognition |

    | `Multilayer Perceptron` or `Deep Belief Network` | Classification and Time Series
    Analysis |


    ## Forward Propagation


    Forward propagation involves nodes in the visible layer receiving and processing
    input values, and transmitting them to nodes in the subsequent layers until an
    output value is produced. Although each layer retrieves the same input value,
    they do not transmit the same value.


    ## Back Propagation


    Back propagation is the reverse of forward propagation. In back propagation, the
    network estimates the gradient in reverse, and transforms weights of error rates
    of the preceding epoch. This process is not memory efficient, and it also results
    in poor model performance.


    ## Cost Function


    Chapter [1](#506148_1_En_1_Chapter.xhtml) introduced residual analysis, thus understanding
    the cost function should be relatively easy. A cost function estimates the differences
    between actual values and predicted values. It adjusts weights and biases until
    it finds the lowest value. We use cost function and loss function interchangeably.


    ## Gradient


    A gradient represents the rate at which the cost changes weights and bias. We
    calculate the gradient during training. It is used to. A neural network multiples
    gradients of preceding layers to find the gradient of subsequent layers. To optimize
    the gradient, we use gradient descent. There three types of gradient descent method,
    namely 1) batch gradient descent - estimates gradient of cost function to the
    parameters of the whole training data, 2) stochastic gradient descent - updates
    parameter for each independent variable and dependent variable, 3) mini-batch
    gradient descent - applies batch gradient descent and stochastic gradient descent
    to perform a mini-batch of the training data.


    ## Vanishing Gradient


    If the gradient is large, we train the network fast, and if the gradient is small,
    the training becomes slow. At most, the first layer has a small gradient, and
    subsequent layers have larger gradients. A traditional machine learning model
    learns at a slow pace and makes a lot of errors when predicting classes. Artificial
    neural networks fill this gap by scaling the gradient.


    ## Activation Function


    An activation function adds non-linearity to the network. An activation function
    enables back propagation. Excluding an activation function reduces the neural
    network to a linear regression model. Underneath, we discuss these activation
    functions. There are other functions^([^(13)](#fn13)) we may use.


    ### The Sigmoid Activation Function


    Chapter [5](#506148_1_En_5_Chapter.xhtml) introduced the logistic function and
    how it estimates values. We also recognize the logistic function as the sigmoid
    activation. It triggers output values between 0 and 1. We primarily use the sigmoid
    activation function to solve binary classification problems. We express the sigmoid
    function as:


    ![$$ Sigmoid=\frac{1}{1+{e}^{-z}} $$](images/506148_1_En_12_Chapter/506148_1_En_12_Chapter_TeX_Equ1.png)


    (Equation 12-1)


    The activation function feeds forward neural networks that require positive output
    values only.


    ### The Tangent Hyperbolic Activation Function


    The tangent hyperbolic (`tanh`) activation function extends the sigmoid activation
    function. It triggers output values between -1 and 1 and enables the network to
    center the mean value to 0. We express the function as:


    ![$$ Tanh=\frac{e^t-{e}^{-t}}{e^t-{e}^{-t}} $$](images/506148_1_En_12_Chapter/506148_1_En_12_Chapter_TeX_Equ2.png)


    (Equation 12-2)


    The `tanh` activation fits a tangent hyperbolic curve to the data. Figure [12-1](#506148_1_En_12_Chapter.xhtml#Fig1)
    depicts the standard `tanh` function.


    ![../images/506148_1_En_12_Chapter/506148_1_En_12_Fig1_HTML.jpg](images/506148_1_En_12_Chapter/506148_1_En_12_Fig1_HTML.jpg)


    **Figure 12-1** Tanh Function


    Notice the output value is between -1 and 1 and the mean value is centered to
    0.


    ### Rectified Linear Units Activation Function


    `ReLU` is the default activation function in CNN and multilayer perceptron. `ReLU`
    helps models to learn more fast and its performance is better. Unlike the sigmoid
    and `tanh` activation functions, the `ReLu` activation does not saturate the data
    to -1, 0, or 1. Rather, it moves onward until it retrieves an optimal value. It
    helps solve the vanishing gradient problem. We express the function as:


    ![$$ f(x)=\mathit{\max}\left(0,x\right) $$](images/506148_1_En_12_Chapter/506148_1_En_12_Chapter_TeX_Equ3.png)


    (Equation 12-3)


    Figure [12-2](#506148_1_En_12_Chapter.xhtml#Fig2) depict the standard `ReLu` function.


    ![../images/506148_1_En_12_Chapter/506148_1_En_12_Fig2_HTML.jpg](images/506148_1_En_12_Chapter/506148_1_En_12_Fig2_HTML.jpg)


    **Figure 12-2** ReLu Function


    Notice the output value is not constrained to a specific range.


    ### Loss Function


    Loss is a standard metric for examining the underlying performance of a model.
    A neural network applies a loss function to determine whether it should improve
    its learning process per epoch. An increasing loss shows that a model is a skillful
    learner. The most common loss functions for continuous dependent variables include
    Mean Squared Error (`MSE`), Mean Absolute Error (`MAE`), Mean Absolute Percentage
    Error (`MAPE`), and Mean Squared Logarithmic Error (`MSLE`). Loss functions for
    categorical outcomes include binary cross-entropy for binary classification and
    categorical cross-entropy for multiclass classification.


    ## Optimization


    There are many methods for model performance optimization, like `SGD`, `RMSProp`,
    `ADAGRAD`, `Adadelta`, and `Adam`. This chapter applies the `Adam` optimization
    method^([^(14)](#fn14)) because it works better in minimizing the cost function
    during training. `Adam` stands for Adaptive Movement Estimation. It considers
    preceding gradients in momentum and lowers the learning rate.'
