    | **全链接聚类** | 寻找簇之间的最大距离 |

    | **平均链接聚类** | 寻找簇之间的平均距离 |

    | **质心链接聚类** | 寻找簇质心之间的距离 |


    与随机初始化质心的 K-means 模型不同，凝聚模型会根据分辨率生成多个分区。代码清单 10-18 完成了凝聚模型。


