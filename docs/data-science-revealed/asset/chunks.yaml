    | **Actual: Yes** | 0 | 263 |


    ```

    cmatLDA = pd.DataFrame(metrics.confusion_matrix(y_test,y_predLDA), index=["Actual:
    No","Actual: Yes"],

    columns=("Predicted: No","Predicted: Yes"))

    cmatLDA

