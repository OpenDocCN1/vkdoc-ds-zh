    ```


    如您所见，共有 163 名患者参与了这项研究。数据中没有缺失值。这意味着所使用的数据收集方法是严谨的。请记住，这在现实世界中几乎不会发生。大多数情况下，我们处理的数据都包含缺失值。该数据包含三列；第一列是连续变量（以年数表示的时间线），第二列是二元变量（事件结果——我们将未能在特定时间后存活的患者编码为
    0，将在特定时间后存活的患者编码为 1），第三列是二元分类变量（患者属于对照组或 miR-137 组）。基于数据结构，我们可以使用生存分析模型，例如 Kaplan-Meier
    模型或 Nelson-Aalen 模型。在本章中，我们将研究 Kaplan-Meier 模型。在开发模型之前，我们先描述一下数据。


    代码清单 11-3 统计并列出每个组别的患者数量（见表 11-3）。


    **表 11-3** 每组患者数量


    |   | 数量 |

    | --- | --- |

    | **组别** |   |

    | **对照组** | 129 |

    | **miR-137** | 34 |


    ```

