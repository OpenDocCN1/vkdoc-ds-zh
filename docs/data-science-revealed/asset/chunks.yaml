    Table [2-2](#506148_1_En_2_Chapter.xhtml#Tab2) summarizes the performance of all
    regressors using primary evaluation metrics.


    Table 2-2


    Model Evaluation Results of All Models


    |   | MAE | MSE | RMSE | R² | Explained variance score |

    | --- | --- | --- | --- | --- | --- |

    | OLS | 550.512799 | 528211.610638 | 726.781680 | 0.942619 | 0.944409 |

    | Ridge | 548.303122 | 526871.168399 | 725.858918 | 0.942764 | 0.944672 |

    | Ridge CV | 550.291000 | 528056.270472 | 726.674804 | 0.942636 | 0.944437 |

    | Lasso | 550.291000 | 528056.270472 | 726.674804 | 0.942636 | 0.944437 |


    Table [2-2](#506148_1_En_2_Chapter.xhtml#Tab2) highlights that all regressors
    explain more than 94% of the variability in the data. However, the least-squares
    regressor is the weakest contender, with the lowest R-squared score and discrepancies.
    In addition, the ridge regressor has the highest discrepancy between predicted
    values and actual values.


    # Conclusion


    This chapter explored the different models for regularizing estimates of the least
    squares model such as ridge, ridge with built-in cross-validation, and lasso.
    These models sufficiently dealt with error due to bias and error due to variance.
    After testing their performance, we found that regularizing or shrinking estimates
    of a mode improves the general performance. The ridge regressor model is a delicate
    contender. In a case where both regularizing models do not improve the predictive
    power of the least squares model, use the `ElasticNet` model, a viable hybrid
    of ridge regression and lasso regression.


