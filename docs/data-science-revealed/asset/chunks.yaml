    # 7. Finding Hyperplanes Using Support Vectors


    The preceding chapter presented a linear classification model called linear discriminant
    analysis (LDA), which distributes groups equally when covariance matrices are
    equivalent. Although the classifier is one of the optimum linear classification
    models, it has its limits. Foremost, we cannot estimate the dependent variable
    using a categorical variable. Second, we train and test the model under strict
    assumptions of normality. This chapter brings together an alternative linear classification
    model called support vector machine (SVM). It is part of the ensemble family;
    it estimates either a continuous variable or a categorical variable. It applies
    a kernel function to transform data in such a way that a hyperplane best fits
    the data. Unlike LDA, SVM makes no assumptions about the underlying structure
    of the data.


    ## Support Vector Machine


    SVM typically assumes that the data points are linearly indistinguishable in lower
    dimensions and linearly distinguishable in higher dimensions. It finds an optimal
    hyperplane to take full advantage of the margin and simplify nonlinear problems.
    First, it efficiently captures data and develops a new dimensional vector space.
    Thereafter, it develops a linear boundary of the new vector space into two classes.
    It positions a data point either above or underneath a hyperplane, resulting in
    classification. It uses a kernel function to estimate a hyperplane with an extreme
    margin. The primary kernel functions are the linear function, polynomial function,
    and sigmoid function. Except if you are analyzing high-dimensional data, there
    is absolutely no need to study these functions extensively. You can always use
    hyperparameter optimization to find an optimal function.


    ### Support Vectors


    Support vectors are data points next to the hyperplane. They determine the position
    of the hyperplane. Furthermore, when we eliminate these data points, the position
    of a hyperplane changes.


    ### Hyperplane


    A hyperplane is a line that splits into two categories (each class falls on either
    side). It serves as a boundary between the two sides. Positioning an optimal hyperplane
    is challenging when using real-world data. SVM transforms the data into higher
    dimensions through a procedure called *kerneling*. After transforming the data,
    it does not develop a straight line but a plane. It applies a kernel function
    to transform the data, so it positions a hyperplane at the proper location. Figure
    [7-1](#506148_1_En_7_Chapter.xhtml#Fig1) portrays a hyperplane.


    ![../images/506148_1_En_7_Chapter/506148_1_En_7_Fig1_HTML.png](images/506148_1_En_7_Chapter/506148_1_En_7_Fig1_HTML.png)


    **Figure 7-1** Hyperplane


    Figure [7-1](#506148_1_En_7_Chapter.xhtml#Fig1) shows the formula of the straight
    line expressed in Equation 7-1.


    ![$$ WT\ x+b=0 $$](images/506148_1_En_7_Chapter/506148_1_En_7_Chapter_TeX_Equ1.png)


    **(Equation 7-1)**


    Here, `W` represents the slope of the line, `x` represents the input vector, and
    `b` represents bias. The two lines (highlighted in orange) pass through the support
    vectors and support the best plane. A decent hyperplane has an extreme margin
    for the support vectors.


    It figures out how to position a hyperplane during training by using an optimization
    procedure that enlarges the separation. We do not add hyperplanes manually. It
    applies a technique recognized as a kernel trick to transform the data. The technique
    enables it to enlarge the dimensional vector space with less computing power.'
