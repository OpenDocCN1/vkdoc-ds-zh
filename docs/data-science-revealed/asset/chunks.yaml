    # Conclusion


    This chapter covers the generalized additive model. The model takes seasonality
    into account and uses time as a regressor. Its performance surpasses that of the
    seasonal ARIMA model. The model commits minor errors when forecasting future instances
    of the series. We can rely on the Prophet model to forecast a time series.


    The first four chapters of this book properly introduce the parametric method.
    This method makes bold assumptions about the underlying structure of the data.
    It assumes the underlying structure of the data is linear.


    The subsequent chapter introduces the nonparametric method. This method supports
    flexible assumptions about the underlying structure of the data. It assumes the
    underlying structure of the data is nonlinear.


