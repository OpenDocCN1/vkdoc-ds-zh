- fmt: '### The Covariance Method


    Covariance is the joint variability between the two variables (it estimates how
    two variables vary together). Equation 1-7 expresses the covariance method.


    ![$$ {S}_{xy}=\frac{\sum \left({x}_i-\underset{\_}{x}\right)\left({y}_i-\underset{\_}{y}\right)\
    }{n-1} $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ7.png)


    (Equation 1-7)


    Here, `n` is the number of the samples, `y[i]` represents scalar random variables,
    and `x` and `y` are the mean values of the scalar random variables.


    ### Covariance Matrix


    Listing 1-13 produces the covariance matrix (see Figure 1-12).


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig12_HTML.png](images/506148_1_En_1_Chapter/506148_1_En_1_Fig12_HTML.png)


    Figure 1-12


    Covariance matrix heatmap


    ```

    dfcov = df.cov()

    sns.heatmap(dfcov, annot=True,annot_kws={"size":12}, cmap="Blues")

    plt.show()

    Listing 1-13

    Covariance Matrix

    ```


    Figure 1-12 reveals that the covariance is approximately 0.0076 (which is close
    to 1). It confirms a positive relationship between variables.


    ## Assign and Reshape Arrays


    Listing 1-14 assigns arrays of `x` and `y` using `NumPy`. An array holds one or
    more variables.


    ```

    x = np.array(df["YearsExperience"])

    y = np.array(df["Salary"])

    Listing 1-14

    Assign x and y arrays

    ```


    Listing 1-15 reshapes `x` and `y` (transforms one-dimensional data into two-dimensional
    data).


    ```

    x = x.reshape(-1,1)

    y = y.reshape(-1,1)

    Listing 1-15

    Reshape x and y arrays

    ```


    ## Split Data into Training and Test Data


    Supervised models require a data partition. Listing 1-16 splits the data into
    training and test data by calling the `train_test_split()` method.


    ```

    from sklearn.model_selection import train_test_split

    x_train, x_test, y_train, y_test = train_test_split(x,y,test_size=0.2, random_state=0)

    Listing 1-16

    Split Data into Training and Test Data

    ```


    Note that 80% of the data is for training, and 20% of the data is for testing.


    ## Normalize Data


    Widespread scaling methods include `StandardScaler()`, which scales data in such
    a way that the mean value is 0 and the standard deviation is 1; `MinMaxScaler()`,
    which scales data between 0 and 1 or between -1 and 1 if there are negative values
    in the data; and `RobustScaler()`, which removes outliers and uses scale data
    (using either of the previous scales). Listing 1-17 applies the `StandardScaler()`
    method to normalize data.


    ```

    from sklearn.model_selection import StandardScaler

    scaler = StandardScaler()

    x_train = scaler.fit_transform(x_train)

    x_test = scaler.transform(x_test)

    Listing 1-17

    Normalize Data

    ```


    ## Develop the Least Squares Model Using Statsmodels


    `Statsmodels` is a Python scientific package that contains a set of distinct classes
    and functions for correctly estimating statistical models and performing test
    statistics. It complements the `SciPy` package for statistical computation. By
    default, it does not include an intercept. Listing 1-18 manually adds an intercept
    to the model.


    ```

    x_constant = sm.add_constant(x_train)

    x_test = sm.add_constant(x_test)

    Listing 1-18

    Add a Constant

    ```


    Listing 1-19 completes the regressor.


    ```

    model = sm.OLS(y_train, x_constant).fit()

    Listing 1-19

    Develop the Least Squares Model

    ```


