    and predicted values of employees’ salaries, but those differences are not large.


    ## Diagnose Residuals


    A residual represents the difference between the actual values and the predicted
    values. Residual diagnosis involves discovering behavioral patterns of errors
    that a model makes. There are several tools that we can use to check whether a
    model fulfils the assumption. The easiest way of analyzing the residuals involves
    looking at their mean value. If the mean value of the residuals is close to 0,
    then the model is a good fit.


    To graphically represent residuals and make sense of the behavioral patterns of
    errors, we can use plots such as the autocorrelation function plot, partial autocorrelation
    function plot, fitted values and residuals values plot, leverage values and residual
    values plot, fitted values and studentized residual values, leverage and studentized
    residual values (also recognized as Cook’s D influence plot), and the normal probability
    (or normal Q-Q) plot. These plots are useful for detecting abnormalities in residuals.


    If there is a pattern or shape in the residuals, then the model violates a regression
    assumption. There are three main patterns, namely, *fan-shaped pattern*, which
    happens when there is an increase of variability with predicted values (error
    term not affected by the value of an independent variable); *parabolic pattern*,
    which happens when predicted values are relative or there are multiplicative errors;
    and *double bow pattern*, which happens when an independent variable is a proportion
    or percentage. There are other factors that influence behavioral patterns of residuals
    such as the distribution of the data and visible presence of outliers. It is important
    to ensure that we feed the model quality data.'
  raw: '#### R-squared


    R-squared (R²) represents the variability explained by the model about the data.
    The metric comprises values that range from 0 to 1, where 0 shows that the regression
    model poorly explains the variability in the data, and 1 shows that the regression
    model best explains the data.


    ![$$ {R}^2=1-\frac{\sum {\left({y}_i-\hat{y}\right)}^2}{\sum {\left({y}_i-\underset{\_}{y}\right)}^2}
    $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ12.png)


    (Equation 1-12)


    Here, ![$$ \hat{y} $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_IEq4.png)
    represents the predicted value of y, and ![$$ \underset{\_}{y} $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_IEq5.png)
    represents the mean value of y. The R² score must be multiplied by a hundred.
    For example, if the score is 0.9, then the model explains 90% of the variability
    in the data.


    There are other metrics for model evaluation such as the following:


    *   *Explained variance score*: A metric that captures a discrepancy between a
    model and the actual data. If the score is close to 1, then there is a strong
    correlation.


    *   *Mean gamma deviance*: A metric that captures the scaling of a dependent variable
    and estimates the relative error. It is a Tweedie deviance with a power parameter
    of 2.


    *   *Mean Poisson deviance*: A metric that captures the scaling of a dependent
    variable and estimates the relative error. It is a Tweedie deviance with a power
    parameter of 1.


    Listing [1-33](#506148_1_En_1_Chapter.xhtml#PC33) tabulates the evaluation metrics
    (see Table [1-8](#506148_1_En_1_Chapter.xhtml#Tab8)).


