    conclusions about the networks’ performance on the trade-off between precision
    and recall. Listing [12-29](#506148_1_En_12_Chapter.xhtml#PC29) plots a precision-recall
    curves of all networks (see Figure [12-9](#506148_1_En_12_Chapter.xhtml#Fig9)).


    ![../images/506148_1_En_12_Chapter/506148_1_En_12_Fig9_HTML.jpg](images/506148_1_En_12_Chapter/506148_1_En_12_Fig9_HTML.jpg)


    **Figure 12-9** Precision-Recall Curves


    ```

    precisionmodel1, recallmodel1, thresholdmodel1 = metrics.precision_recall_curve(y_test,
    y_predmodel1)

    precisionmodel2, recallmodel2, thresholdmodel2 = metrics.precision_recall_curve(y_test,
    y_predmodel2)

    precisionmodel3, recallmodel3, thresholdmodel3 = metrics.precision_recall_curve(y_test,
    y_predmodel3)

    precisionmodel4, recallmodel4, thresholdmodel4 = metrics.precision_recall_curve(y_test,
    y_predmodel4)

    plt.plot(precisionmodel1, recallmodel1, label="Model 1", color="navy")

    plt.plot(precisionmodel2, recallmodel2, label="Model 2", color="orange")

    plt.plot(precisionmodel3, recallmodel3, label="Model 3", color="green")

    plt.plot(precisionmodel4, recallmodel4, label="Model 4", color="brown")

    plt.axhline(y=0.5, color="red")

    plt.xlabel("Recall")

    plt.ylabel("Precision")

    plt.legend(loc=3)

    plt.show()

    ```


    **Listing 12-29** Precision-Recall Curves


    As we progressively increase the recall, the precision of the fourth network drops
    faster than all models. Figure [12-9](#506148_1_En_12_Chapter.xhtml#Fig9) also
    shows the first network outperforms other networks. Table 12-19 summarizes the
    precision and recall of all networks using the APS score.


    ```

    apsmodel1 = metrics.average_precision_score(y_test, y_predmodel1)

    apsmodel2 = metrics.average_precision_score(y_test, y_predmodel2)

    apsmodel3 = metrics.average_precision_score(y_test, y_predmodel3)

    apsmodel4 = metrics.average_precision_score(y_test, y_predmodel4)

    apsfinal = [[apsmodel1, apsmodel2, apsmodel3, apsmodel3]]

    apsfinaldata = pd.DataFrame(apsfinal, columns = ("Model 1",

    "Model 2",

    "Model 3",

    "Model 4"),

    index=["APS Score"]).transpose()

    apsfinaldata

    ```


    **Listing 12-30** APS Score


    The unregularized network has the greatest APS score, followed by networks regularized
    using L1 and L2 penalty terms. The network with dropped neurons is less precise.


    ## Training and Validation Loss across Epochs


    Figure [12-10](#506148_1_En_12_Chapter.xhtml#Fig10) shows how the leading deep
    belief network learns to compare actual classes and predicted classes.


    ![../images/506148_1_En_12_Chapter/506148_1_En_12_Fig10_HTML.jpg](images/506148_1_En_12_Chapter/506148_1_En_12_Fig10_HTML.jpg)


    **Figure 12-10** Training and Validation Loss across Epochs


    ```

    plt.plot(history1.history["loss"], color="red", label="Training Loss")

    plt.plot(history1.history["val_loss"], color="green", label="Cross-Validation
    Loss")

    plt.xlabel("Epochs")

    plt.ylabel("Loss")

    plt.legend(loc=4)

    plt.show()

    ```


    **Listing 12-31** Training and Validation Loss across Epochs


    Figure [12-10](#506148_1_En_12_Chapter.xhtml#Fig10) shows that in the 1st epoch,
    cross-validation loss increases until it reaches its peak at the 60th epoch and
    begins to drop. The training loss is constantly 0 across epochs.


    ## Training and Validation Accuracy across Epochs


    Figure [12-11](#506148_1_En_12_Chapter.xhtml#Fig11) shows how the leading deep
    belief network learns to predict classes correctly.


    ![../images/506148_1_En_12_Chapter/506148_1_En_12_Fig11_HTML.jpg](images/506148_1_En_12_Chapter/506148_1_En_12_Fig11_HTML.jpg)


    **Figure 12-11** Training and Validation Accuracy across Epochs


    ```

    plt.plot(history1.history["accuracy"], color="red", label="Training Accuracy")

    plt.plot(history1.history["val_accuracy"], color="green", label="Cross-Validation
    Accuracy")

    plt.xlabel("Epochs")

    plt.ylabel("Accuracy")

    plt.legend(loc=4)

    plt.show()

    ```


    **Listing 12-32** Training and Validation Accuracy across Epochs


    Figure [12-11](#506148_1_En_12_Chapter.xhtml#Fig11) highlights that in the 1st
    epoch, the training accuracy increases to about 80%. Meanwhile, the cross-validation
    accuracy declines until it reaches 0%, thereafter, it is constantly 0%.


    ## Conclusion


    This chapter described artificial neural networks and their applications, and
    it then explained various activation functions. It solved the same classification
    problem covered in the preceding chapters using different artificial neural networks
    such as the Bernoulli RBM classifier, MLP classifier, and deep belief networks.


    After properly building their architecture and completing them, we tested their
    performance using several classification evaluation matrices. We found that the
    Bernoulli RBM classifier struggles to distinguish between classes. However, the
    MLP classifier is skillful in distinguishing between classes. All regularized
    deep belief networks show characteristics of well-behaved classifiers. Moreover,
    the unregularized deep belief network outperforms the rest.


