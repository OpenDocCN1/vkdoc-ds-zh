    ### 平均绝对误差


    绝对误差是估计值与真实值之间的差值。例如，如果模型预测薪水为 40,749 美元，而实际值为 37,731 美元，那么该模型的绝对误差为 40,749 美元
    – 37,731 美元 = 3,018 美元。平均绝对误差（MAE）表示估计中误差的平均幅度，不考虑方向。


    ![$$ MAE=\frac{1}{n}{\sum}_{i=1}^n\mid {x}_i-x\mid $$](img/506148_1_En_1_Chapter_TeX_Equ9.png)


    (公式 1-9)


    这里，*n* 表示误差的数量，∣*x*[*i*] − *x*∣ 表示绝对误差。


    ### 均方误差


    均方误差（MSE）表示在考虑回归关系后，模型对数据变异性的解释程度。


    ![$$ MSE=\frac{1}{n}{\sum}_{i=1}^n\mid {y}_i-\hat{y}\mid $$](img/506148_1_En_1_Chapter_TeX_Equ10.png)


    (公式 1-10)


    ### 均方根误差


    均方根误差（RMSE）表示在不考虑回归关系的情况下解释的变异性。要获得 RMSE 分数，请使用 MSE 的平方根。


    ![$$ RMSE=\sqrt{MSE} $$](img/506148_1_En_1_Chapter_TeX_Equ11.png)


    (公式 1-11)

    '
- fmt: '### R-squared


    R-squared (R²) represents the variability explained by the model about the data.
    The metric comprises values that range from 0 to 1, where 0 shows that the regression
    model poorly explains the variability in the data, and 1 shows that the regression
    model best explains the data.


    ![$$ {R}^2=1-\frac{\sum {\left({y}_i-\hat{y}\right)}^2}{\sum {\left({y}_i-\underset{\_}{y}\right)}^2}
    $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ12.png)


    (Equation 1-12)


    Here, ![$$ \hat{y} $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_IEq4.png)
    represents the predicted value of `y`, and ![$$ \underset{\_}{y} $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_IEq5.png)
    represents the mean value of `y`. The R² score must be multiplied by a hundred.
    For example, if the score is 0.9, then the model explains 90% of the variability
    in the data.


    There are other metrics for model evaluation such as the following:


    *   *Explained variance score*: A metric that captures a discrepancy between a
    model and the actual data. If the score is close to 1, then there is a strong
    correlation.

    *   *Mean gamma deviance*: A metric that captures the scaling of a dependent variable
    and estimates the relative error. It is a Tweedie deviance with a power parameter
    of 2.

    *   *Mean Poisson deviance*: A metric that captures the scaling of a dependent
    variable and estimates the relative error. It is a Tweedie deviance with a power
    parameter of 1.


    Listing [1-33](#506148_1_En_1_Chapter.xhtml#PC33) tabulates the evaluation metrics
    (see Table [1-8](#506148_1_En_1_Chapter.xhtml#Tab8)).


    **Table 1-8** Performance Matrix


    | | Values |

    | --- | --- |

    | **MAE** | 2.446172e+03 |

    | **MSE** | 1.282341e+07 |

    | **RMSE** | 3.580979e+03 |

    | **R²** | 9.881695e-01 |

    | **Explained variance score** | 9.897038e-01 |

    | **Mean gamma deviance** | 3.709334e-03 |

    | **Mean Poisson deviance** | 2.129260e+02 |


    ```

    MAE = metrics.mean_absolute_error(y_test,y_pred)

    MSE = metrics.mean_squared_error(y_test,y_pred)

    RMSE = np.sqrt(MSE)

    R2 = metrics.r2_score(y_test,y_pred)

    EV = metrics.explained_variance_score(y_test,y_pred)

    MGD = metrics.mean_gamma_deviance(y_test,y_pred)

    MPD = metrics.mean_poisson_deviance(y_test,y_pred)

    lmmodelevaluation = [[MAE,MSE,RMSE,R2,EV,MGD,MPD]]

    lmmodelevaluationdata = pd.DataFrame(lmmodelevaluation,

    index = ["Values"],

    columns = ["MAE",

    "MSE",

    "RMSE",

    "R2",

    "Explained variance score",

    "Mean gamma deviance",

    "Mean Poisson deviance"]).transpose()

