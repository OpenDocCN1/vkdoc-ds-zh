    ## K-Means Clustering


    The K-means model is the most prevalent cluster model. It splits the data into
    *k* clusters with the nearest mean *centroids* , and it then finds the distance
    between subsets to develop a cluster. It also reduces the intracluster distances
    and advance intercluster. We express the formula as shown in Equation 10-1.


    ![$$ Dis\left({x}_1,{x}_2\right)=\sqrt{\sum_{i=0}^n{\left({x}_{1i}-{y}_{2i}\right)}^2}
    $$](images/506148_1_En_10_Chapter/506148_1_En_10_Chapter_TeX_Equ1.png)


    (Equation 10-1)


    Basically, the model finds the initial *k* (the number of clusters) and calculates
    the distance between clusters. Thereafter, it allocates each data point to the
    closest centroid. The model works best with large samples. See Listing [10-11](#506148_1_En_10_Chapter.xhtml#PC11).


    ```

    kmeans = KMeans(n_clusters=3)

    kmeans_output = kmeans.fit(df)

    kmeans_output

    Listing 10-11

    K-Means Model Using Default Hyperparameters

