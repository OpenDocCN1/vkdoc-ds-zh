    # 使用 Keras 的深度信念网络


    深度信念网络是多个 RBM 的组合。该网络是反向传播的一种替代方案。其结构类似于 MLP 网络。然而，它们在训练方式上有所不同；一个 RBM 的隐藏层是另一个
    RBM 的可见层。

