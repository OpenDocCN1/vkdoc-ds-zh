    本章介绍了树分类建模技术，包括发现最优超参数、寻找对因变量最重要的变量，以及仅使用重要变量和最佳超参数来可视化决策树和分类器。还有一些独特的决策树分类器扩展算法，例如极端随机树和随机森林树。极端随机树会随机分割决策树的节点，而随机森林树则并行迭代构建多个决策树。


    # 9. 回归经典


    现在我们将介绍最古老的分类方法之一：朴素贝叶斯，这是一种 18 世纪初期的模型。它是一种监督学习模型，可以解决二分类和多分类问题。*朴素*一词源于该模型对数据所做的假设。我们之所以认为它朴素，是因为它假设变量之间相互独立，即数据之间不存在依赖关系。这在现实世界中很少发生。我们可以将朴素贝叶斯定理简化为公式
    9-1。


    ![$$ P\left(A\vert B\right)=\kern0.5em \left(P\left(B\vert A\right)P(A)\right)/\left(P(B)\right)
    $$](img/506148_1_En_9_Chapter_TeX_Equ1.png)


    （公式 9-1）


    这里，表示在事件 B 已发生的情况下，事件 A 发生的概率。


    本章将介绍高斯朴素贝叶斯。它假设自变量是二元的。然而，我们可以放宽这一假设，以容纳服从正态分布的连续变量。此外，由于我们不需要进行超参数调优（它没有可调的超参数），因此该方法内存效率高且速度快。贝叶斯模型属于概率模型家族。要理解该模型，请先熟悉朴素贝叶斯。


    ## 朴素贝叶斯定理


    当处理连续自变量时，请使用`GaussianNB`分类器。只要您具备处理连续变量的背景知识，建模就相对容易。关于高斯分布（也称为*正态分布*）的回顾，请参考本书第一章。我们提到，当数据点接近实际均值时，数据服从正态分布。`GaussianNB`分类器会估计一个变量属于某个特定类别的概率；同时，它还会估计中心值，即均值或标准差。它最适合高维特征。我们通常在小训练集的情况下使用此分类器。该分类器使用高斯概率密度函数来估计自变量新值的概率。


