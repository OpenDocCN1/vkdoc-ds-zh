    # 10. Cluster Analysis


    This chapter briefly covers the cluster analysis concept in a structured format.
    In previous chapters, we sufficiently covered supervised learning. In supervised
    learning, we present a model with a set of correct answers, and then we permit
    it to predict unseen data. Now, let’s turn our attention a little. Imagine we
    have data with a set of variables and there is no independent variable of concern.
    In such a situation, we do not develop any plausible assumptions about a phenomenon.


    This chapter introduces unsupervised learning. We do not present a model with
    a set of correct answers; rather, we allow it to make intelligent guesstimates.
    Unsupervised learning encompasses dimension reduction and cluster analysis. In
    this chapter, we first familiarize you with a dimension reduction method widely
    called principal component analysis (PCA), and we then acquaint you with cluster
    analysis. Thereafter, we develop and appraise models such as the K-means model,
    agglomerative model, and DBSCAN model. Before we preprocess and model the data,
    let’s discuss cluster analysis.


    ## What Is Cluster Analysis?


    Cluster analysis is a method that assuredly finds a group of data points with
    similarities and dissimilarities. In cluster analysis, we are concerned with distinct
    clusters that explain variation in the data. There is no real dependent variable.
    We treat all variables equally. Popular clustering techniques include *centroid
    clustering*, which is random and selects centroids of the data points into a group
    of specified clusters, i.e., K-means; *density clustering*, which groups data
    points based on density population, i.e., DBSCAN; and *distribution clustering*,
    which identifies the probability of data points belonging in a cluster based on
    some distribution, i.e., Gaussian mixture model, etc.


    ## Cluster Analysis in Practice


