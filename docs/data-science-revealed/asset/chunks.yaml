    ## Develop the Logistic Classifier Using Statsmodels


    In the past two chapters (covering time-series analysis), we criticized how difficult
    it is to develop a reliable time-series model using Statsmodels. This does not
    mean that the package in its entirety is bad. It is still relevant; actually,
    there are few packages that offer in-depth analysis like Statsmodels does.


    ### Add the Constant


    By default, Statsmodels does not include the constant. Listing [5-10](#506148_1_En_5_Chapter.xhtml#PC10)
    manually adds a constant.


    ```

    from statsmodels.api import sm

    x_constant = sm.add_constant(x_train)

    x_test = sm.add_constant(x_test)

