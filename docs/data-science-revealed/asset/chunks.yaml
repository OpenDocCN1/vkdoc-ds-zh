- fmt: '# Time-Series Assumptions


    A time-series analysis model must fulfill the following assumptions:


    - More than 50 independent data points

    - No missing values

    - No outliers in the series

    - Nonstationary

    - Absence of white noise

    - Correlation between variables with themselves


    # Types of Time-Series Models


    We typically analyze a series by smoothing or moving averages (MA) using the Box-Jenkins
    autoregressive (AR) and MA model, which is a combination of these methods called
    the ARMA model. When a series convincingly shows a pattern, we use a relaxed version
    of the model recognized as the autoregressive integrated moving averages (ARIMA)
    model. We can include a seasonal component using the seasonal ARIMA or SARIMAX
    model. These methods describe a series in terms of its linear structure. Sometimes,
    there is a nonlinear structure. When dealing with a nonlinear model, use the autoregressive
    conditionally heteroscedasticity (ARCH) model. When dealing with multiple time
    series, use the VARMA model.


    # The ARIMA Model


    `ARIMA(p, d, q)` finds a key trend and reasonably predicts future values of the
    series, where `p` represents the order of the autoregressive model, `d` represents
    the degree of differencing, and `q` represents the order of the moving average
    model. The term ARIMA is threefold: AR (autoregressive) represents the linear
    combination of preceding values’ influence, I (integrative) represents the random
    walk, and the MA (moving average) represents the linear combination of preceding
    errors.


    # Test for Stationary


    The series is stationary when there are stochastic trends (random walk or unit
    root). This happens when there is uncertainty in the data. We recognize these
    trends when the series possesses elements of randomness. Their visible presence
    affects conclusions. Before training a time-series model, test whether a series
    is stationary. We express the hypothesis as follows:


    - *Null hypothesis:* The series is stationary.

    - *Alternative hypothesis:* The series is not stationary.


    ## The Augmented Dickey-Fuller Test


    The most reliable way to test whether a series is stationary is the augmented
    Dickey-Fuller (ADF) test. It is a unit root test. When looking at the results,
    fiercely devote attention to the ADF F-statistics. If the F-statistics have a
    negative value, then there is sound evidence that there is a unit root. We express
    the hypothesis as follows:


    - *Null hypothesis:* There is a unit root.

    - *Alternative hypothesis:* There is no unit root.


    If the p-value score exceeds 0.05, then we adamantly reject the null hypothesis
    in favor of the alternative hypothesis. There is sound evidence that there is
    no unit root.


    ### Conduct an ADF Fuller Test


    Listing [3-1](#506148_1_En_3_Chapter.xhtml#PC1) conducts an ADF Fuller test (see
    Table [3-1](#506148_1_En_3_Chapter.xhtml#Tab1)).


    **Table 3-1** ADF Test Statistics


    | | Values |

    | --- | --- |

    | **ADF F% statistics** | -1.031626 |

    | **P-value** | 0.741555 |

    | **No. of lags used** | 0.000000 |

    | **No. of observations** | 262.000000 |


    ```

    from statsmodels.tsa.stattools import adfuller

    adfullerreport = adfuller(new_df["Close"])

    adfullerreportdata = pd.DataFrame(adfullerreport[0:4],

    columns = ["Values"],

    index=["ADF F% statistics",

    "P-value",

    "No. of lags used",

    "No. of observations"])

    Adfullerreportdata

    Listing 3-1

    ADF Fuller Test

    ```


    As expected, the F-statistics have a negative value. The p-value exceeds 0.05.
    We reject the null hypothesis in favor of the alternative hypothesis. There is
    sound evidence that there is no unit root—the series is not stationary.


    # Test for White Noise


    A series has white noise when there is an element of randomness. The apparent
    presence of randomness shows that there is no correlation between data points
    of a series—the autocorrelation is zero. White noise is an example of stationary.
    We express the hypothesis as follows:


    - *Null hypothesis:* There is white noise.

    - *Alternative hypothesis:* There is no white noise.


    To check whether a series has white noise, look at the mean value. If the mean
    value is zero, then a series has white noise. If the mean value of a series is
    not zero, then there is no white noise. See Listing [3-2](#506148_1_En_3_Chapter.xhtml#PC2)
    and Figure [3-1](#506148_1_En_3_Chapter.xhtml#Fig1).


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig1_HTML.jpg](images/506148_1_En_3_Chapter/506148_1_En_3_Fig1_HTML.jpg)


    **Figure 3-1** Random white noise


    ```

    randval = np.random.randn(1000)

    autocorrelation_plot(randval)

    plt.show()

    Listing 3-2

    Random White Noise

    ```


    There are significant spikes above the 95% and 99% confidence interval.


    ## Test for Correlation


    Correlation estimates of the strength of a linear relationship between variables.
    In time-series analysis, we focus on the correlation between data points in a
    series. If you recall, we proceed under the assumption that the underlying structure
    of the data is linear. To check whether there is a correlation in a series, we
    do not use the Pearson correlation method. We verify the assumption using autocorrelation.


    Listing [3-3](#506148_1_En_3_Chapter.xhtml#PC3) and Figure [3-2](#506148_1_En_3_Chapter.xhtml#Fig2)
    show lagged variables. A lag is the difference in time between a recent data points
    and preceding data points. It verifies whether a series has an element of randomness.
    When we plot lags, we expect to find a pattern. If a lag plot shows a linear pattern,
    then there is a correlation between the two lagged variables. It also detects
    outliers in a time series. As you can see, there were no outliers detected.


