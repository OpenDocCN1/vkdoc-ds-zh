    #### Find the Average Precision Score


    To make sense of a precision-recall curve, we unbundle the central tendency. An
    average precision score (APS) is the arithmetic average of the precision scores
    inside the precision-recall curve. The classifier is precise 76% of the time.


    ### Learning Curve


    A learning curve finds whether a model has a low bias error term (under-fitting)
    and high variance (over-fitting). It depicts a model’s learning process over time.
    This curve enables us to determine the extent to which we can benefit from increased
    data points in the training data and to find out whether the estimator suffers
    variance error or bias. There are two types of learning curves, namely, training
    learning curve (calculated from the training data) and validation learning curve
    (calculated using the validation data). A learning curve has two axes: the training
    set size on the x-axis and the accuracy score on the y-axis. Figure [5-9](#506148_1_En_5_Chapter.xhtml#Fig9)
    shows the classifier’s learning process. See also Listing [5-24](#506148_1_En_5_Chapter.xhtml#PC24).


    ![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig9_HTML.jpg](images/506148_1_En_5_Chapter/506148_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    Learning curve


    ```

    trainsizelogreg, trainscorelogreg, testscorelogreg = learning_curve(logreg, x,
    y, cv=5, n_jobs=5, train_sizes=np.linspace(0.1,1.0,50))

    trainscorelogreg_mean = np.mean(trainscorelogreg,axis=1)

    testscorelogreg_mean = np.mean(testscorelogreg,axis=1)

    plt.plot(trainsizelogreg,trainscorelogreg_mean,color="red", label="Training score",
    alpha=0.8)

    plt.plot(trainsizelogreg,testscorelogreg_mean,color="navy", label="Cross validation
    score", alpha=0.8)

    plt.xlabel("Training set size")

    plt.ylabel("Accuracy")

    plt.legend(loc=4)

    plt.show()

    Listing 5-24

    Learning Curve

    ```


    At the beginning phase of the learning process, the logistic classifier over-fits.
    However, as the training set size increases, the classifier over-fits less. As
    the classifier approaches the 400^(th) data point, the cross-validation accuracy
    score starts to decrease. Adding more data points will not increase generalization.
    You will learn more about how to interpret a learning curve in the subsequent
    chapters.


