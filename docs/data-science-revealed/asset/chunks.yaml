    As you can see, 163 patients took part in the study. There are no missing values
    in the data. This means that the data collection methods used were rigorous. Remember,
    this hardly happens in the actual world. At most, we deal with data with missing
    values. The data is comprised of three columns; the first column is a continuous
    variable (timeline specified by the number of years), the second column is a binary
    variable (event outcome—we code a patient failing to survive beyond a specific
    time as 0 and a patient who survives beyond a specific time as 1), and the third
    column is a binary categorical (a patient is in the control group or the miR-137
    group). Based on the structure of the data, we can use a survival analysis model
    such as the Kaplan-Meier model or the Nelson-Aalen model. In this chapter, we
    look at the Kaplan-Meier model. Before we develop the model, let’s first describe
    the data.


