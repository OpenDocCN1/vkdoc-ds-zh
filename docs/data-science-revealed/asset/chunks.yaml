    ## 理解相关性


    线性回归的核心在于检验相关系数。相关性估计了自变量与因变量之间线性关系的表观强度。确定两个变量之间相关性的方法有多种，例如皮尔逊相关法、斯皮尔曼相关法和肯德尔相关法。


    ### 皮尔逊相关法


    清单 1-12 应用了皮尔逊相关法（因变量为连续变量）。公式 1-6 表达了该方法。


    ![$$ {r}_{xy}=\frac{s_{xy}}{s_x{s}_y} $$](img/506148_1_En_1_Chapter_TeX_Equ6.png)


    （公式 1-6）


    这里，`s[x]` 代表自变量的标准差，`s[y]` 代表因变量的标准差，`s[xy]` 代表协方差。该方法产生的值范围从 -1 到 1，其中 -1 表示强负相关关系，0
    表示无相关关系，1 表示强正相关关系。


