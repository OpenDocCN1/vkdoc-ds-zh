    # L2 Regularization


    We base L2 regularization on the premise that after normalizing the data, coefficients
    are small and that the value of *k* increases, coefficients with multicollinearity
    alter their behavior. This regularization technique is the most suitable for variables
    with severe correlation. Listing [12-23](#506148_1_En_12_Chapter.xhtml#PC23) builds
    the architecture of the fourth deep belief network. It compromises a visible layer
    with the sigmoid activation function and an L2 penalty term with an alpha of 0.01.
    There are also two hidden layers with the ReLu activation function.


    ```

