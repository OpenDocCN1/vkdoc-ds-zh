    ### Mean Absolute Error


    An absolute error is a difference between the estimated value and the true value.
    For example, if a model predicts that the salary is $40,749 while the actual value
    is $37,731, then the model has an absolute error of $40,749 – $37,731 = $3,018.
    Mean absolute error (MAE) represents the average magnitude of error in estimates
    without considering the direction.


    ![$$ MAE=\frac{1}{n}{\sum}_{i=1}^n\mid {x}_i-x\mid $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ9.png)


    (Equation 1-9)


    Here, *n* represents the number of errors, and ∣*x*[*i*] − *x*∣ represents the
    absolute errors.


    ### Mean Squared Error


    Mean squared error (MSE) represents the variability explained by the model about
    the data after considering a regression relationship.


    ![$$ MSE=\frac{1}{n}{\sum}_{i=1}^n\mid {y}_i-\hat{y}\mid $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ10.png)


    (Equation 1-10)


    ### Root Mean Squared Error


    Root mean squared error (RMSE) represents the variability explained without considering
    a regression relationship. To get an RMSE score, use the square root of the MSE.


    ![$$ RMSE=\sqrt{MSE} $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ11.png)


    (Equation 1-11)'
