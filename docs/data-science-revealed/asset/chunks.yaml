- fmt: '# Bernoulli Restricted Boltzmann Machine


    We use the Restricted Boltzmann Machine (RBM) to address the vanishing gradient
    problem. An RBM is a shallow neural network that comprises the visible layer and
    the hidden layer. It connects each node in the visible layer to every node in
    the hidden layer. In addition, it applies weight and biases to understand the
    underlying relationship between variables.


    Figure [12-3](#506148_1_En_12_Chapter.xhtml#Fig3) shows an RBM with 3 nodes at
    the visible layer and 4 nodes at the hidden layer.


    ![../images/506148_1_En_12_Chapter/506148_1_En_12_Fig3_HTML.png](images/506148_1_En_12_Chapter/506148_1_En_12_Fig3_HTML.png)


    Figure 12-3


    Restricted Boltzmann Machine


    ## Train a Logistic Classifier


    Listing [12-1](#506148_1_En_12_Chapter.xhtml#PC1) trains the logistic classifier.


    ```

    from sklearn.linear_model import LogisticRegression

    logreg = LogisticRegression(dual= False,

    fit_intercept= True,

    max_iter= 10,

    n_jobs= -5,

    penalty= ''l2'',

    tol=0.0001,

    warm_start= False)

    logreg.fit(x_train, y_train)

    Listing 12-1

    Finalize the Logistic Classifier

    ```


    ## Pipeline


    Listing [12-2](#506148_1_En_12_Chapter.xhtml#PC2) creates a pipeline for the logistic
    classifier and RBM classifier.


    ```

    from sklearn.neural_network import BernoulliRBM

    from sklearn.pipeline import Pipeline

    rbm = BernoulliRBM()

    classifier = Pipeline(steps=[("rbm", rbm), ("logreg", logreg)])

    classifier.fit(x_train, y_train)

    Listing 12-2

    Complete the Pipeline

    ```


    Table [12-2](#506148_1_En_12_Chapter.xhtml#Tab2) highlights key classification
    evaluation metrics such as accuracy, precision, recall, and others.


    Table 12-2


    Classification Report


    |   | precision | recall | f1-score | support |

    | --- | --- | --- | --- | --- |

    | **0** | 0.829787 | 0.728972 | 0.776119 | 107.000000 |

    | **1** | 0.516667 | 0.659574 | 0.579439 | 47.000000 |

    | **accuracy** | 0.707792 | 0.707792 | 0.707792 | 0.707792 |

    | **macro avg** | 0.673227 | 0.694273 | 0.677779 | 154.000000 |

    | **weighted avg** | 0.734224 | 0.707792 | 0.716094 | 154.000000 |


    ```

    y_pred = classifier.predict(x_test)

    creportbm = pd.DataFrame(metrics.classification_report(y_test, y_pred, output_dict=True)).transpose()

    creportbm

    Listing 12-3

    Classification Report

    ```


    The Bernoulli RBM classifier is accurate 70.78% of the time when predicting classes.
    The accuracy score is lower than that of the classifiers we covered in the preceding
    chapters. The classifier is precise 82.98% of the time when predicting class 0
    and precise 51.67% of the time when predicting class 1.


    # Multilayer Perceptron using SciKit-Learn


