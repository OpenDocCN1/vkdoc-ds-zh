- fmt: '### Support Vector Classifier


    A support vector classifier (SVC), also known as a *margin classifier*, permits
    certain data points to be on the inappropriate side of the hyperplane. If the
    data is not directly distinguishable, it includes slack variables to permit the
    violation of constraints by allowing certain data points to fall inside the margin;
    in addition, it punishes them. It limits slack variables to non-negative values.
    If slack variables are over 0, it sets aside constraints by positioning a plane
    next to the data points instead of the margin by selecting a lambda. Figure [7-2](#506148_1_En_7_Chapter.xhtml#Fig2)
    shows how the SVC works.


    ![../images/506148_1_En_7_Chapter/506148_1_En_7_Fig2_HTML.png](images/506148_1_En_7_Chapter/506148_1_En_7_Fig2_HTML.png)


    Figure 7-2


    LinearSVC workflow


    There are three basic tasks the `LinearSVC` classifier performs.


    - *Transformation*: Changing an input space into higher-dimensional vectors space

    - *Linear separation or straight division*: Realizing a hyperplane with the most
    margin

    - *Classification*: Allocating data points to a class


    ## Develop the LinearSVC Classifier


    We obtained the example data from Kaggle.^([⁶](#fn6)) Listing [7-1](#506148_1_En_7_Chapter.xhtml#PC1)
    completes the classifier.


    ```

    from sklearn.svm import LinearSVC

    lsvc = LinearSVC()

    lsvc.fit(x_train,y_train)

    Listing 7-1

    Finalize the LinearSVC Classifier

    ```


    ### LinearSVC Hyperparameter Optimization


    Table [7-1](#506148_1_En_7_Chapter.xhtml#Tab1) highlights key hyperparameters.


    Table 7-1


    Tunable Hyperparameters


    | Parameter | Description |

    | --- | --- |

    | `Dual` | Determines whether the model must solve dual problems |

    | `fit_intercept` | Determines whether the model must calculate the intercept.
    |

    | `max_iter` | Determines the maximum number of iterations. |

    | `Penalty` | Determines the regularization method to use. Available penalty terms
    include l1 penalty (lasso) and l2 penalty (ridge). |

    | `Tol` | Determines the tolerance for the optimization. |

    | `Loss` | Determines the type of function. Available loss functions include hinge
    and squared hinge. |


    Listing [7-2](#506148_1_En_7_Chapter.xhtml#PC2) creates a dictionary with group
    parameters and a specific range of values we expect to find the best cross-validation
    score from and then applies the `GridSearchCV()` method to develop a grid model
    and find hyperparameters with the best score.


    ```

    param_gridlsvc = {"dual":[False,True],

    "fit_intercept":[False,True],

    "max_iter":[1,10,100,100],

    "penalty":("l1","l2"),

    "tol":[0.0001,0.001,0.01,1.0],

    "loss":("hinge", "squared_hinge")}

    grid_modellsvc = GridSearchCV(estimator=lsvc, param_grid=param_gridlsvc)

    grid_modellsvc.fit(x_train,y_train)

    print("Best score: ", grid_modellsvc.best_score_, "Best parameters: ", grid_modellsvc.best_params_)

    Listing 7-2

    Hyperparameter Optimization

    ```


    Best score: 0.7671331467413035 Best parameters: {‘dual’: False, ‘fit_intercept’:
    True, ‘loss’: ‘squared_hinge’, ‘max_iter’: 100, ‘penalty’: ‘l1’, ‘tol’: 0.001}


    ### Finalize the LinearSVC Classifier


    The previous findings suggest that we use the squared hinge function and control
    for bias and variance using the L1 penalty term. Listing [7-3](#506148_1_En_7_Chapter.xhtml#PC3)
    completes the `LinearSVC` classifier.


    ```

    lsvc = LinearSVC(dual= False,

    fit_intercept= True,

    max_iter= 100,

    penalty= ''l1'',

    tol= 0.001,

    loss="squared_hinge")

    lsvc.fit(x_train,y_train)

    Listing 7-3

    Finalize the LinearSVC Classifier

    ```


    ### Evaluate the LinearSVC Classifier


    Listing [7-4](#506148_1_En_7_Chapter.xhtml#PC4) tabulates the actual classes and
    predicted classes side by side. See also Table [7-2](#506148_1_En_7_Chapter.xhtml#Tab2).


    Table 7-2


    Actual Values and Predicted Values


