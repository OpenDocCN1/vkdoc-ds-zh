    ### Evaluate the Logistic Classifier


    After finalizing a binary classifier, we must look at how well the binary classifier
    classifies classes. This involves comparing the difference between actual and
    predicted labels. We begin with developing a confusion matrix.


    #### Confusion Matrix


    When the classifier makes predictions, it is prone to make errors. When dealing
    with a binary classification problem, there are two types of errors, namely, the
    Type I error (False Positive) and the Type II error (False Negative).


    - *False positive (FP)*: Incorrectly predicting that an event took place. An example
    is predicting that a patient is diabetic when a patient is not diabetic.

    - *False negative (FN)*: Incorrectly predicting an event that never took place.
    An example is predicting that a patient is not diabetic when a patient is diabetic.


    Although the classifier is prone to making errors, it does get some predictions
    correct.


    - *True positive (TP)*: Correctly predicting that an event took place. An example
    is correctly predicting that a patient is diabetic.

    - *True negative (TN)*: Correctly predicting that an event never took place. An
    example is correctly predicting that a patient is not diabetic.


    A confusion matrix takes four combinations of actual classes and predictions.
    A confusion matrix looks like Table [5-6](#506148_1_En_5_Chapter.xhtml#Tab6),
    Listing [5-20](#506148_1_En_5_Chapter.xhtml#PC20), and Table [5-7](#506148_1_En_5_Chapter.xhtml#Tab7).


    Table 5-7


    Confusion Matrix


    |   | Predicted: No | Predicted: Yes |

    | --- | --- | --- |

    | **Actual: No** | 98 | 9 |

    | **Actual: Yes** | 18 | 29 |


    Table 5-6


    Confusion Matrix


    |   | Predicted: No | Predicted: Yes |

    | --- | --- | --- |

    | **Actual: No** | TN = 98 | FP = 9 |

    | **Actual: Yes** | FN = 18 | TP = 29 |


    ```

    cmatlogreg = pd.DataFrame(metrics.confusion_matrix(y_test,y_predlogreg), index=["Actual:
    No","Actual: Yes"],

    columns=("Predicted: No","Predicted: Yes"))

    cmatlogreg

    Listing 5-20

    Confusion Matrix

    ```


    #### Classification Report


    A classification report is a detailed report that highlights how well the classifier
    performs. It encompasses key metrics such as accuracy, precision, F-1 support,
    recall, and prevalence. Calculations of these metrics come from the confusion
    matrix. Table [5-8](#506148_1_En_5_Chapter.xhtml#Tab8) outlines key metrics in
    a classification report, and Listing [5-21](#506148_1_En_5_Chapter.xhtml#PC21)
    returns a classification report.


    Table 5-8


    Classification Report


    | Metric | Description |

    | --- | --- |

    | Precision | Determines how often the classifier is correct |

    | Accuracy | Determines how often the classifier got predictions right |

    | F1-support | Determines the mean value of precision and recall |

    | Support | Determines the number of samples of the true response that lies in
    that class |


    ```

    creportlogreg = pd.DataFrame(metrics.classification_report(y_test,y_predlogreg,
    output_dict=True)).transpose()

    creportlogreg

    Listing 5-21

    Classification Report

    ```


    Table [5-9](#506148_1_En_5_Chapter.xhtml#Tab9) highlights that the logistic classifier
    is accurate 82% of the time. It also tells us that there is an imbalance in the
    data. The classifier is more precise when it predicts class 0 than when it predicts
    class 1.


    Table 5-9


    Classification Report


    |   | precision | recall | f1-score | support |

    | --- | --- | --- | --- | --- |

    | **0** | 0.844828 | 0.915888 | 0.878924 | 107.000000 |

    | **1** | 0.763158 | 0.617021 | 0.682353 | 47.000000 |

    | **Accuracy** | 0.824675 | 0.824675 | 0.824675 | 0.824675 |

    | **macro avg** | 0.803993 | 0.766455 | 0.780638 | 154.000000 |

    | **weighted avg** | 0.819902 | 0.824675 | 0.818931 | 154.000000 |


    #### ROC Curve


    A receiver operating characteristics (ROC) curve is a tool used to find appropriate
    hyperparameter settings. It helps summarize the trade-off between the true positive
    rate and the false positive rate using different probability thresholds. On the
    x-axis lies the false positive rate, and on the y-axis lies the true positive
    rate. The closer the curve follows the left-side border than the top border of
    the ROC space, the more accurate it is. See Listing [5-22](#506148_1_En_5_Chapter.xhtml#PC22).


    ```

    y_predlogreg_proba = logreg.predict_proba(x_test)[::,1]

    fprlogreg, tprlogreg, _ = metrics.roc_curve(y_test,y_predlogreg_proba)

    auclogreg = metrics.roc_auc_score(y_test, y_predlogreg_proba)

    plt.plot(fprlogreg, tprlogreg, label="AUC: "+str(auclogreg), color="navy")

    plt.plot([0,1],[0,1],color="red")

    plt.xlim([0.00,1.01])

    plt.ylim([0.00,1.01])

    plt.xlabel("Specificity")

    plt.ylabel("Sensitivity")

    plt.legend(loc=4)

    plt.show()

    Listing 5-22

    ROC Curve

    ```


    The curve in Figure [5-7](#506148_1_En_5_Chapter.xhtml#Fig7) follows the left-side
    border for a while; then it smoothly bends to the top border of the ROC space.
    The curve slowly approaches the 45-degree line. This means that the logistic classifier
    is not accurate as we would want it to be.


    ![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig7_HTML.jpg](images/506148_1_En_5_Chapter/506148_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    ROC curve


    ##### Area Under the Curve


    The area under the curve (AUC) is also recognized as the index of accuracy. It
    consists of performance metrics for an ROC curve. It indicates how the classifier
    distinguishes between classes. The closer the area under the curve score is to
    1, the better the predictive power the model has. The AUC score is `0.87`. Using
    the 80/20 rule, the classifier is skillful in distinguishing classes between actual
    classes and predicted classes.'
