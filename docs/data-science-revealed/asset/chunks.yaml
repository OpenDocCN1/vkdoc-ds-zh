    # 其他相关方法


    还有其他用于衡量变量间相关性的方法，例如肯德尔方法和斯皮尔曼方法。它们的使用取决于具体应用场景。


    ## 肯德尔相关方法


    肯德尔相关方法用于估计有序变量中排名之间的关联性。有序变量由距离未知的分类变量组成。有序数据的一个例子是李克特量表。肯德尔相关方法的值范围从 -1 到 1，其中
    -1 表示排名不一致，0 表示排名相互独立，1 表示两个排名完全一致。清单 5-3 生成了肯德尔相关矩阵（见图 5-3）。


    ![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig3_HTML.jpg](img/506148_1_En_5_Fig3_HTML.jpg)


    图 5-3


    肯德尔相关矩阵


    ```

    dfcorr_kendall = df.corr(method="kendall")

    sns.heatmap(dfcorr_kendall, annot=True,annot_kws={"size":12}, cmap="Oranges")

    plt.show()

    清单 5-3

    肯德尔相关矩阵

    ```


    图 5-3 显示大多数排名非常接近一致。肯德尔相关方法与皮尔逊相关方法产生的值略有差异。


    ## 斯皮尔曼相关方法


    斯皮尔曼相关方法是另一种基于排名的相关方法。它衡量两个变量排名之间的统计依赖性。该方法有助于识别变量是否呈线性关系。其值范围也在 -1 到 1 之间，其中
    -1 表示弱关联，0 表示无关联，1 表示强关联。清单 5-4 返回了一个斯皮尔曼相关矩阵（见图 5-4）。


