    1","Cluster 2","Cluster 3"))

    kmean_centroids

    ```


    **Listing 10-15** Centroids


    To really make sense of the model, Listing [10-16](#506148_1_En_10_Chapter.xhtml#PC16)
    creates a scatter plot displaying clusters and centers of cluster (see Figure
    [10-6](#506148_1_En_10_Chapter.xhtml#Fig6)).


    ![../images/506148_1_En_10_Chapter/506148_1_En_10_Fig6_HTML.jpg](images/506148_1_En_10_Chapter/506148_1_En_10_Fig6_HTML.jpg)


    **Figure 10-6** K-means model


