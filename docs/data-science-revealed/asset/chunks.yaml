    1 时的精确率为 51.67%。


    # 使用 SciKit-Learn 的多层感知机


    单感知机模型最多只能勉强捕捉数据的底层结构，导致模型性能不佳。多层感知机（MLP）模型解决了这个问题。它训练、加权并阈值化一组随机值，然后使用激活函数估计和控制变化。它包含多个层；至少需要三个层，即可见层、隐藏层和输出层。


