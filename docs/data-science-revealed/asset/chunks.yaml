    # 伯努利受限玻尔兹曼机


    我们使用受限玻尔兹曼机（RBM）来解决梯度消失问题。RBM 是一种浅层神经网络，包含可见层和隐藏层。它将可见层中的每个节点与隐藏层中的每个节点相连接。此外，它还应用权重和偏置来理解变量之间的潜在关系。


    图 12-3 展示了一个在可见层有 3 个节点、隐藏层有 4 个节点的 RBM。


    ![../images/506148_1_En_12_Chapter/506148_1_En_12_Fig3_HTML.png](img/506148_1_En_12_Fig3_HTML.png)


    图 12-3


    受限玻尔兹曼机


    ## 训练逻辑分类器


    代码清单 12-1 训练了逻辑分类器。


    ```

    from sklearn.linear_model import LogisticRegression

    logreg = LogisticRegression(dual= False,

    fit_intercept= True,

    max_iter= 10,

    n_jobs= -5,

    penalty= ''l2'',

    tol=0.0001,

    warm_start= False)

    logreg.fit(x_train, y_train)

    代码清单 12-1

    完成逻辑分类器

    ```


    ## 流水线


    代码清单 12-2 为逻辑分类器和 RBM 分类器创建了一个流水线。


    ```

    from sklearn.neural_network import BernoulliRBM

    from sklearn.pipeline import Pipeline

    rbm = BernoulliRBM()

    classifier = Pipeline(steps=[("rbm", rbm), ("logreg", logreg)])

    classifier.fit(x_train, y_train)

    代码清单 12-2

    完成流水线

    ```


