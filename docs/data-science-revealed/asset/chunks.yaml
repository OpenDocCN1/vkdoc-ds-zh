    interval to 95%, and it considers yearly seasonality, weekly seasonality, and
    daily seasonality.


    ```

    holidays = pd.DataFrame({

    ''holiday'': ''playoff'',

    ''ds'': pd.to_datetime(["2020-12-25", "2020-12-24", "2020-12-23", "2019-12-25",
    "2021-01-01", "2021-01-20"]),

