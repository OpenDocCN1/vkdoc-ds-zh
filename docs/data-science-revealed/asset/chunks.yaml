- fmt: '# RidgeCV


    `RidgeCV` stands for “ridge regression with built-in cross-validation” (it weighs
    the prediction errors of a model to validate each data point as an out-of-sample
    prediction). CV methods include the K-fold, leave-one-out, and generalized cross-validation
    (GCV). By default, the `ridgeCV` regressor in SciKit-Learn uses GCV. See Equation
    2-2.


    ![$$ GCV=\frac{1}{n}{\sum}_{i=1}^n\left(\frac{y_i-\hat{f}\left({x}_i\right)}{1-\frac{tr(S)}{n}}\right)
    $$](images/506148_1_En_2_Chapter/506148_1_En_2_Chapter_TeX_Equ2.png)


    (Equation 2-2)


    Recall that `tr(S)` is the effective number of parameters.


    It alters model behavior by partitioning data, finding optimal penalty terms,
    and training and validating complementary regressors.


    # Lasso Regression


    `Lasso` stands for “least absolute shrinkage selector operator” (also known as
    L1 regularization). It applies the shrinkage technique (centering the data to
    its central point, such as centering the data to the mean value). This procedure
    produces sparse models (models with a reduced numbers of parameters). We use it
    for both variable selection and regularization. Like ridge regression, lasso regression
    boosts a regressor’s predictive power by including a penalty term. They differ
    from the penalty term: lasso regression uses L1 to penalize the sum of residuals,
    while ridge regression uses the L2 penalty term. It assumes that as the penalty
    term increases, more coefficients were set to zero, which results in fewer variables
    being selected. L1 regularization uses nonzero coefficients and coerces the sum
    of absolute values of coefficient (sets 0 coefficients and adds interpretability).
    See Equation 2-3.


    ![$$ {\beta}^{lasso}={\left({X}^{\prime }X\right)}^{-1}{X}^{\prime }y-\frac{\lambda_1}{2}\
    w $$](images/506148_1_En_2_Chapter/506148_1_En_2_Chapter_TeX_Equ3.png)


    (Equation 2-3)


    `λ1` represents the lasso penalty, penalizing the sum of the absolute values of
    the regression coefficients.


    ## Tunable Hyperparameters


    If you do not want to use default parameters to complete your model, you can change
    the hyperparameters accordingly. Table [2-1](#506148_1_En_2_Chapter.xhtml#Tab1)
    highlights tunable hyperparameters.


    Table 2-1


    Tunable Hyperparameters


    | Parameters | Description |

    | --- | --- |

    | `alpha` | Determines the regularization strength. It is a constant that multiplies
    the term. One must be cautious when selecting `alpha`. A small value of `alpha`
    specifies weak regularization, and a large value specifies strong regularization.
    As `alpha` increases, the parameters become smaller. If `alpha` increases, coefficients
    approach 0 and under-fit the data. The default value is 1. |

    | `fit_intercept` | Determines whether the model must estimate the intercept.
    |

    | `normalize` | Determines whether we must normalize the independent variables.
    |

    | `copy_X` | Determines whether we must copy the independent variable. |

    | `tol` | Determines the precision. The default value is 0.003. |

    | `max_iter` | Determines the maximum number of iterations. |

    | `tol` | Determines the tolerance for the optimization |

    | `warm_state` | Determines whether to initialize a solution or erase the preceding
    solution. |


    # Develop the Models


    The example data was obtained from GitHub.^([²](#fn2)) It compromises a few categorical
    independent variables. Listing [2-1](#506148_1_En_2_Chapter.xhtml#PC1) transforms
    the categorical variable into numeric using the `LabelEncoder()` method. For example,
    we transform `[''VS2'' ''VS1'' ''VVS1'' ''VVS2'' ''IF'']` to `[0,1,2,34]`. Listing
    [2-2](#506148_1_En_2_Chapter.xhtml#PC2) creates an `x` and `y` array and thereafter
    splits and normalizes the data.


    ```

    from sklearn.preprocessing import LabelEncoder

    categorical_features = [''colour'', ''clarity'']

    le = LabelEncoder()

    for i in range(2):

    new = le.fit_transform(df[categorical_features[i]])

    df[categorical_features[i]] = new

    df["certification"] = pd.get_dummies(df["certification"])

    print(df.clarity.unique())

    print(df.colour.unique())

    print(df.certification.unique())

