    extremely pruned decision trees, and the K-nearest neighbor model has a large
    k. Figure [2-2](#506148_1_En_2_Chapter.xhtml#Fig2) shows an example of low bias
    (or high variance).


    ![../images/506148_1_En_2_Chapter/506148_1_En_2_Fig2_HTML.png](images/506148_1_En_2_Chapter/506148_1_En_2_Fig2_HTML.png)


    Figure 2-2


    Low bias/high variance


    We decrease bias to increase variance when there are several variables in the
    data, the model is unregularized, the decision tree model is unpruned, or the
    K-nearest neighbor model has a small k. Figure [2-3](#506148_1_En_2_Chapter.xhtml#Fig3)
    shows an example of high bias (or low variance).


    ![../images/506148_1_En_2_Chapter/506148_1_En_2_Fig3_HTML.png](images/506148_1_En_2_Chapter/506148_1_En_2_Fig3_HTML.png)


    Figure 2-3


    High bias/low variance


    Bias-variance trade-off is about addressing the problem of underfitting (when
    there is a low bias error term) and overfitting (when there is high variance).
    We decrease bias and variance based on the complexity of the model. Several parameters
    in a model increase the complexity of the model and variance and decrease bias.


    ## Ridge Regression


    We also recognize ridge regression as Tikhonov or L2 regularization. This model
    addresses the problem of multicollinearity by minimizing variables by a small
    k along each eigenvector to ensure that there is a narrow spread in axes. Similar
    to the least squares regressor, it assumes linearity and normality in the data.
    The major difference between the two models is that the ridge regressor assumes
    that after normalizing the data, coefficients are small. It also assumes that
    as the value of k increases, coefficients with multicollinearity alter their behavior.
    Given this assumption, the model sharply decreases coefficients to zero. At most,
    the value of k of the ridge regressor is less than the value of k of the least
    squares model.


    It shrinks the estimates to stabilize variability by adding bias (introducing
    a penalty and controlling for shrinkage to the least squares function). It prevents
    the values of the independent variable from exploding, reduces standard errors,
    and provides more reliable estimates. This procedure minimizes the penalized sum
    of residuals and carefully controls the considerable amount of shrinkage in a
    regression model. It changes the cost function by adding a penalty term (a term
    relative to the sum of squares of the coefficients). A constant penalty term ranges
    from 0 to 1\. It controls estimates, β, and as a result, high variance is more
    likely to occur. The least squares model does not control the loss function of
    the ridge model. Equation 2-1 expresses a standard ridge formula.


    ![$$ {\beta}^{ridge}={\left({X}^{\prime }X+{\lambda}_2\right)}^{-1}{X}^{\prime
    }y $$](images/506148_1_En_2_Chapter/506148_1_En_2_Chapter_TeX_Equ1.png)


    (Equation 2-1)


    Here, λ[2] represents the ridge penalty term responsible for penalizing the squared
    regression coefficient. The penalty term controls the size of the coefficients
    and the amount of regularization.'
