- fmt: '### Prophet Components


    The Prophet package sufficiently takes into account the trend, seasonality and
    holidays, and events. In this section, we will briefly discuss the key components
    of the package.


    #### Trend


    A trend is a single and consistent directional movement (upward or downward).
    We fit a time-series model to discover a trend. Table [4-1](#506148_1_En_4_Chapter.xhtml#Tab1)
    highlights tunable trend parameters.


    **Table 4-1** Tunable Trend Parameters


    | Parameters | Description |

    | --- | --- |

    | `growth` | Specifies a piecewise linear or logistic trend |

    | `n_changepoints` | The number of changes to be automatically included, if changepoints
    are not specified |

    | `change_prior_scale` | The change of automatic changepoint selection |


    #### Changepoints


    A changepoint is a penalty term. It alters the behavior of a time-series model.
    If you do not specify changepoints, the default changepoint value is automated.


    #### Seasonality


    Seasonality represents consistent year-to-year upward or downward movements. Equation
    4-1 approximates this.


    ![$$ S(t)={\sum}_{n=1}^N{\alpha}_n coscos\ \left(\frac{2\pi nt}{P}\right)+{b}_n\mathit{\cos}\left(\frac{2\pi
    nt}{P}\right) $$](images/506148_1_En_4_Chapter/506148_1_En_4_Chapter_TeX_Equ1.png)


    (Equation 4-1)


    Here, `P` is the period (7 for weekly data, 30 for monthly data, 90 for quarterly
    data, and 365 for yearly data).


    #### Holidays and Events Parameters


    Holidays and events affect the time series’ conditional mean. Table [4-2](#506148_1_En_4_Chapter.xhtml#Tab2)
    outlines key tunable holiday and event parameters.


    **Table 4-2** Holiday and Event Parameters


    | Parameters | Description |

    | --- | --- |

    | `daily_seasonality` | Fit daily seasonality |

    | `weekly_seasonality` | Fit weekly seasonality |

    | `year_seasonality` | Fit yearly seasonality |

    | `holidays` | Include holiday name and date |

    | `yeasonality_prior_scale` | Determine strength of needed for seasonal or holiday
    components |


    ### The Additive Model


    The additive models assume that the trend and cycle are treated as one term. Its
    components are similar to the Holt-Winters technique. We express the equation
    as shown in Equation 4-2.


    ![$$ y=S(t)+T(t)\ast I(t) $$](images/506148_1_En_4_Chapter/506148_1_En_4_Chapter_TeX_Equ2.png)


    (Equation 4-2)


    The formula is written mathematically as shown in Equation 4-3.


    ![$$ y=g(t)+s(t)+h(t)+{\varepsilon}_i $$](images/506148_1_En_4_Chapter/506148_1_En_4_Chapter_TeX_Equ3.png)


    (Equation 4-3)


    Here, `g(t)` represents the linear or logistic growth curve for modeling changes
    that are not periodic, `s(t)` represents the periodic changes (daily, weekly,
    yearly seasonality), `h(t)` represents the effects of holidays, and `+ ε[i]` represents
    the error term that considers unusual changes.


    ### Data Preprocessing


    We obtained the example data from Yahoo Finance.^([³](#fn3)) Before training the
    model, repurpose the data as follows:


    *   `df["ds"]`, which repurposes time

    *   `df["y"]`, which repurposes the independent variable

    *   `df.set_index("")`, which sets the date and time as the index column


    Listing [4-1](#506148_1_En_4_Chapter.xhtml#PC1) sets column names to the right
    format.


    ```

    df["ds"] = df["Date"]

    df["y"] = df["Close"]

    df.set_index("Date")

    Listing 4-1

    Process Data

    ```


