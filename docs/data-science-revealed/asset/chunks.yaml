    Correlation Matrix

    ```


    Figure [1-11](#506148_1_En_1_Chapter.xhtml#Fig11) shows a line of 1s that go from
    the top left to the bottom right (each variable perfectly correlates with itself).
    There is strong positive correlation between the employees’ years of work experience
    and the employees’ salaries.'
