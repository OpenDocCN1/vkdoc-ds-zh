    Last, as the classifier is about to reach the 600^(th) data point, the training
    accuracy score surpasses the cross-validation accuracy score.


    ## Conclusion


    This chapter presented how SVM changes the input space into a higher-dimensional
    vector space and creates a hyperplane and classifies variables. We configured
    the LinearSVC classifier with a squared hinge loss function and an L1 penalty
    term. Remember, we do not develop ROC curve and precision-recall curve as the
    classifier lacks probabilistic importance. We rely upon the classification report
    and learning curve to comprehend the underlying performance of the classifier.


