    # 理解趋势、季节性与不规则成分


    将趋势与周期分离颇具挑战性。理解时间序列数据最简单的方法是将数据分解为不同成分。季节性分解涉及将一个序列分解为三个成分，即趋势、周期、季节性和不规则成分。我们通常使用加法模型，如公式
    3-1 所示。


    `Y(t) = T(t)+C(t)+S(t) x I(t)` (公式 3-1)


    这里，`T(t)` 表示时期 `t` 的趋势值，`S(t)` 表示时期 `t` 的季节性值，`C(t)` 表示时期 `t` 的周期值，`I(t)` 表示时期
    `t` 的不规则（随机）值。季节性分解要求数值为正。当序列中存在零值时，需对整个序列加上 0.5 或 1。清单 3-7 对该序列进行了分解（见图 3-6）。


