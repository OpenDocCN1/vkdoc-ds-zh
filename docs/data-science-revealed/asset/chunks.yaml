- fmt: '# Split Data into Training, Test Data and Validation Data


    Previously, we split the data into training data and test data, whereby 80% of
    the data is for training, and 20% of the data is for testing. From now on, we
    allocate a certain portion of the training data for validation. First, we split
    the data into training data and test data using the 80/20 ratio. Last, we further
    split the training data to allocate a portion of 10% for validation. Figure [12-7](#506148_1_En_12_Chapter.xhtml#Fig7)
    shows how we split the data into three sets.


    ![../images/506148_1_En_12_Chapter/506148_1_En_12_Fig7_HTML.png](images/506148_1_En_12_Chapter/506148_1_En_12_Fig7_HTML.png)


