    # 6. Dimension Reduction and Multivariate Analysis Using Linear Discriminant Analysis


    The preceding chapter presented a classification method known as logistic regression.
    It solves binary classification problems. Multinomial logistic regression (MLR)
    is an extension of logistic regression using the `Softmax` function; instead of
    the `Sigmoid` function, it applies the cross-entropy loss function. It is a form
    of logistic regression used to predict a target variable with more than two classes.
    It differs from linear discriminant analysis (LDA) in the sense that MLR does
    not assume the data comes from a normal distribution. LDA comes from a linear
    family; it assumes normality and linearity.


    We use LDA to solve binary class problems and multiclass classification problems.
    This chapter introduces linear classification and discriminant analysis. It reveals
    a way of using LDA to condense data to fewer dimensions and estimate categorical
    variables using continuous variables.


    This model works like models concealed in the preceding chapters, like linear
    regression and logistic regression. It is also similar to analysis of covariance
    (ANOVA). ANOVA estimates continuous variables using categorical variables. LDA
    reasonably assumes that the covariance structure of the groups is alike. If the
    covariance structure groups are unequal, then use the quadratic discriminant analysis.
    An extension of the LDA model is known as Fisher’s discriminant analysis (FDA).
    FDA does not perform classification, but features obtained after transformation
    can be used for classification.


    Both logistic regression and LDA estimate a categorical dependent variable. What
    differentiates LDA from logistic regression has more assumptions. It is also like
    principal component analysis and factor analysis in the sense it looks for linear
    combinations that best explain the data. LDA works best when there is a large
    sample.


    It applies the discriminant function to allocate a group of continuous variables
    into categories by finding the linear combinations of variables and maximizing
    the difference between them. Likewise, it applies Fisher’s linear discriminant
    rule to maximize the ratio between the within-class scatter matrix and between-class
    scatter matrix and to discover the linear combinations in groups.


    Last, it estimates categorical variables using only continuous variables. If independent
    variables are categorical and the dependent variable is categorical, use an alternative
    model recognized as discriminant correspondence analysis. Given its inheritance
    from the linear family, test the model against assumptions of linearity and normality.
    LDA serves two purposes: dimension reduction and classification.


    ### Dimension Reduction


    We use LDA, which is similar to PCA, for dimension reduction. It discovers variance
    explained in the data and reduces data into fewer dimensions. Remember to use
    eigenvalues to find the source of considerable variation in the data. An eigenvalue
    with the uppermost loading is the first function, the one with the second-highest
    loading is the second function, and so forth. We eliminate the factors with excessive
    eigenvalues (extreme variability) based on some criteria.


    ### Classification


    LDA solves both binary and multiclass classification problems. It applies a linear
    classifier to assign variables to a class. Given that the model applies a linear
    classifier, it inherits strict assumptions of linearity and normality.'
