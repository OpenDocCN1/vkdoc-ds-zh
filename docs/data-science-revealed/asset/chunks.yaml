    creportlsvc = pd.DataFrame(metrics.classification_report(y_test,y_predlsvc, output_dict=True)).transpose()

    creportlsvc

    Listing 7-6

    Classification Report

    ```


    The `LinearSVC` classifier is accurate 82% of the time. It is precise 84% of the
    time when predicting class 0 and 76% of the time when predicting class 1.


    #### Learning Curve


    Listing [7-7](#506148_1_En_7_Chapter.xhtml#PC7) produces a curve that depicts
    the progression of the `LinearSVC` classifier’s accuracy as it learns the training
    data (see Figure [7-3](#506148_1_En_7_Chapter.xhtml#Fig3)).


    ![../images/506148_1_En_7_Chapter/506148_1_En_7_Fig3_HTML.jpg](images/506148_1_En_7_Chapter/506148_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Learning curve


    ```

    trainsizelsvc, trainscorelsvc, testscorelsvc = learning_curve(lsvc, x, y, cv=5,
    n_jobs=5, train_sizes=np.linspace(0.1,1.0,50))

    trainscorelsvc_mean = np.mean(trainscorelsvc,axis=1)

    testscorelsvc_mean = np.mean(testscorelsvc,axis=1)

    plt.plot(trainsizelsvc,trainscorelsvc_mean,color="red", label="Training Score")

    plt.plot(trainsizelsvc,testscorelsvc_mean,color="navy", label="Cross Validation
    Score")

    plt.xlabel("Training Set Size")

    plt.ylabel("Accuracy")

    plt.legend(loc=4)

    plt.show()

    Listing 7-7

    Learning Curve

    ```


    In the first phase of the learning process, the training accuracy score sharply
    declined to an all-time low of about 70%, followed by an upward rally. As the
    classifier reached the 200^(th) data point, the training accuracy score improved.
    At most, the training accuracy score is below the cross-validation accuracy score.
    Last, as the classifier is about to reach the 600^(th) data point, the training
    accuracy score surpasses the cross-validation accuracy score.


    ## Conclusion


    This chapter presented how SVM changes the input space into a higher-dimensional
    vector space and creates a hyperplane and classifies variables. We configured
    the `LinearSVC` classifier with a squared hinge loss function and an L1 penalty
    term. Remember, we do not develop ROC curve and precision-recall curve as the
    classifier lacks probabilistic importance. We rely upon the classification report
    and learning curve to comprehend the underlying performance of the classifier.


