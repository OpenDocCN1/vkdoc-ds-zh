    Listing 9-5

    ROC Curve

    ```


    Figure [9-1](#506148_1_En_9_Chapter.xhtml#Fig1) shows a curve that sails close
    to the right-side border when specificity is between 0 and 0.1. However, as specificity
    increases, the curve bends and slowly approaches 1. The AUC score is 0.84.


    ### Precision Recall Curve


    The classification report tells us that class 0 has an enormous number of data
    points (the data is imbalanced). We must focus more on precision and recall. Listing
    [9-6](#506148_1_En_9_Chapter.xhtml#PC6) produces the precision-recall curve (see
    Figure [9-2](#506148_1_En_9_Chapter.xhtml#Fig2)).


    ![../images/506148_1_En_9_Chapter/506148_1_En_9_Fig2_HTML.jpg](images/506148_1_En_9_Chapter/506148_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    Precision-recall curve


    ```

    precisiongnb, recallgnb, thresholdgnb = metrics.precision_recall_curve(y_test,y_predgnb)

    apsgnb = metrics.roc_auc_score(y_test,y_predgnb)

    plt.plot(precisiongnb, recallgnb, label="aps: "+str(apsgnb),color="navy",alpha=0.8)

    plt.axhline(y=0.5,color="red",alpha=0.8)

    plt.xlabel("Precision")

    plt.ylabel("Recall")

    plt.legend(loc=4)

    plt.show()

    Listing 9-6

    Precision-Recall Curve

    ```


    The mean of the precision scores is 74%. The curve does not approach the uppermost
    border. Rather, it slows down smoothly until it reaches 0.8, and then the momentum
    declines.'
