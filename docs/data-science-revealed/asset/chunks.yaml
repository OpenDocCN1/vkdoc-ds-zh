    An intensive search returns an estimator, a parameter space, the method used to
    search candidates, the cross-validation scheme, and the score function. Cross-validation
    methods include `RandomizedSearchCV`, which considers a specific number of candidates;
    `GridSearchCV`, which considers all parameter combinations; and `BayesSearchCV`,
    which uses previous loss to determine the best point to sample the loss by processing
    the Gaussian process as a prior for function. Underneath, we show you how to perform
    cross-validation using `GridSearchCV` and `BayesSearchCV`. Table [1-5](#506148_1_En_1_Chapter.xhtml#Tab5)
    highlights optimizable hyperparameter.


