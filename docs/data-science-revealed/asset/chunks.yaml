    # Survival Analysis


    This chapter introduces the survival analysis. The method comprises two families:
    the parametric method and the nonparametric method. Parametric survival analysis
    models include Weibull, exponential, log-linear, and many others (learn more from
    Lifelines^([^(11)](#fn11))). Nonparametric survival analysis models include Kaplan-Meier
    and Nelson-Aalen.


    This chapter covers only the most popular nonparametric model, called the Kaplan-Meier
    model, which measures a binary variable using time. It has relaxed assumptions
    about the structure of the data. Likewise, it does not hold assumptions about
    the linearity and normality of the data.


    It does not capture time in the traditional sense. It captures the actual date
    of entry and exit in the study. We also call survival analysis *reliability analysis*
    or *duration modeling*. When we use it, the duration is more important than time.
    In clinical trials, we use it to estimate the probabilities of a patient surviving
    an event (i.e., illness or death) beyond a specific time. In engineering, we use
    it to estimate the probabilities of a machine surviving an event (i.e., machine
    failure) beyond time.


    It must fulfill certain conditions for us to consider a study and a survival analysis
    model reliable. First, the research design should include a control group. Second,
    there must be rigorous methods in place to capture the activities of participants
    in the study; we must always consider factors like a patient entering or leaving
    a study, a patient at risk, and a patient dying. Table [11-1](#506148_1_En_11_Chapter.xhtml#Tab1)
    outlines key survival analysis terms.


    Table 11-1


    Survival Analysis Key Term


    | Term | Description |

    | --- | --- |

    | **Survival time** | Represents the timeline of events |

    | **Event** | Represents a binary outcome under investigation (mostly illness
    or death) |

    | **Censoring** | Represents removal of a patient from a study |


    Studies that measure event outcomes such as illness and death take a long period.
    Participants can enter or exit a study, some can die, and we report others as
    risky. In survival analysis, we mostly deal with missing values. We call data
    with missing values *censored data*. Unlike other nonparametric models such as
    logistic regression and linear discriminant analysis, survival analysis models
    are not sensitive to missing values. In fact, we always expect to find missing
    values in the data.'
