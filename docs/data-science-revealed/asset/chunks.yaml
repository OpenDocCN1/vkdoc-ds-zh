    ## Conclusion


    This chapter presented dimension reduction and cluster analysis. We developed
    and assessed three cluster models, namely, the K-means, DBSCAN model, and agglomerative
    model. We began by plummeting the dimension of the data using the PCA method.
    Thereafter, we employed the elbow curve to discover the number of clusters to
    be specified on the K-means model and agglomerative model. We do not postulate
    the number of clusters when developing the DBSCAN model.


    Cluster models are relaxed; they are free of strong assumptions. The daunting
    part about cluster analysis is model evaluation. They lack robust evaluation metrics,
    and we rest on the Silhouette method for model evaluation.


