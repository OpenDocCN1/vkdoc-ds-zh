    # 3. Time-Series Analysis


    This introduces a complex regression method, called *time-series analysis* . Similar
    to the regression method, the time series makes strong assumptions about the underlying
    structure of the data. We recognize time-series analysis as a parametric method
    because it deals with a continuous variable. Remember, we do not limit series
    analysis to continuous variables; we can also analyze time-dependent categorical
    variables.


    It introduces empirical tests for testing assumptions, and we then introduce the
    standard techniques for analyzing a time series like seasonal decomposition and
    smoothing. After that, it shows you how to estimate the rate of return and how
    to run the minimum and maximum. Last, it covers SARIMAX model development and
    evaluation.


    ## What Is Time-Series Analysis?


    Time-series analysis enables us to recognize apparent trends and consistent patterns
    in a series. It captures the movement of a variable across time. In continuous
    time-series analysis, we continuously examine a variable. We define a series at
    a specific point and not at each point. For instance, we will use closing prices
    on the foreign exchange (there is one closing price per trading trade). We obtained
    the example data from Yahoo (it is series data about the price of the USD/ZAR
    currency pair from July 3, 2010, to July 4, 2020).'
