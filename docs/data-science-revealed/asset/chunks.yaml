- fmt: '# Assumptions


    LDA makes strong assumptions about the structure of the data. We consider the
    LDA classifier reliable if it satisfies the assumptions highlighted in Table [6-1](#506148_1_En_6_Chapter.xhtml#Tab1).


    **Table 6-1** LDA Assumptions


    | Assumption | Description |

    | --- | --- |

    | Multivariate normality | There must be multivariate normality in each grouping
    of variables; independent variables must follow a normal distribution. |

    | Covariance | Variances among group variables are the same across levels of predictors.
    When covariance is equal, one can make use of linear discriminant analysis. Otherwise,
    use quadratic discriminant analysis. |

    | Correlation | Variables must not be highly correlated. |

    | Random sampling | Participants must be selected using random sampling. A participant’s
    score must be independent of variables. |


    Assuming there are C classes, let the mean vector of the class be the number of
    samples within classes.


    Equation 6-1 is for a within-class scatter matrix.


    ![$$ {S}_w={\sum}_{i=1}^C{\sum}_{j=1}^{M_i}\left({y}_j-{\mu}_i\right){\left({y}_j-{\mu}_i\right)}^T
    $$](images/506148_1_En_6_Chapter/506148_1_En_6_Chapter_TeX_Equ1.png)


    (Equation 6-1)


    Equation 6-2 is for a between-class scatter matrix. Equation 6-3 is within scatter
    matrix.


    ![$$ {S}_b={\sum}_{i=1}^C\left({y}_j-{\mu}_i\right){\left({y}_j-{\mu}_i\right)}^T
    $$](images/506148_1_En_6_Chapter/506148_1_En_6_Chapter_TeX_Equ2.png)


    (Equation 6-2)


    ![$$ \mu =\frac{1}{C}{\sum}_{i=1}^C{\mu}_i\left( mean\ of\ the\ entire\ dataset\right)
    $$](images/506148_1_En_6_Chapter/506148_1_En_6_Chapter_TeX_Equ3.png)


    (Equation 6-3)


    It performs a transformation that maximizes the between-class scatter matrix while
    minimizing the within-scatter. See Equation 6-4.


    ![$$ \mathit{\operatorname{maximize}}=\frac{\mathit{\det}\left({S}_w\right)}{\mathit{\det}\left({S}_b\right)}
    $$](images/506148_1_En_6_Chapter/506148_1_En_6_Chapter_TeX_Equ4.png)


    (Equation 6-4)


    This transformation keeps class separability while reducing the variation due
    to sources other than identity. The linear transformation is given by a matrix
    *U* whose columns are the eigenvectors of *S*[*w*]^(-1)*S*[*b*].


    Basically, it computes the d-dimensional mean vectors, followed by the scatter
    matrices and eigenvectors and equivalent eigenvalues for the scatter matrices.
    Thereafter, the model class the eigenvalues and select larger eigenvalues to form
    a *d×k* dimensional matrix and convert the samples onto the new subspace. The
    end result is a class separation.


    # Develop the LDA Classifier


    The example data was retrieved from ML Data.^([⁵](#fn5)) We want to predict the
    quality of a car based on a set of independent variables. See Listing [6-1](#506148_1_En_6_Chapter.xhtml#PC1).


    ```

    from sklearn.discriminant_analysis import LinearDiscriminantAnalysis

    LDA = LinearDiscriminantAnalysis()

    LDA.fit(x_train,y_train)

    Listing 6-1

    Develop the Model with Default Hyperparameters

    ```


    ## LDA Hyperparameter Optimization


    Tuning LDA hyperparameters is not as tedious as tuning hyperparameters of other
    classification models. Table [6-2](#506148_1_En_6_Chapter.xhtml#Tab2) highlights
    important hyperparameters.


    **Table 6-2** Tunable Hyperparameters


    | Parameters | Description |

    | --- | --- |

    | `n_component` | Determines the number of components. |

    | `shrinkage` | Determines the automatic shrinkage using the Ledoit-Wolf lemma
    or specifies the value. |

    | `solver` | Determines the solver to use; use `svd` for single-value decomposition,
    `lsqr` for least squares solutions, and `eigen` for Eigenvalue decomposition by
    default |

    | `store_covariance` | Determines whether to store covariance |

    | `tol` | Determines the tolerance for the optimization |


    Listing [6-2](#506148_1_En_6_Chapter.xhtml#PC2) finds the hyperparameters that
    yield optimal model performance.


    ```

    param_gridLDA = {"n_components":[1,2,3,4,5,6,7,8,9],

    "solver":("svd", "lsqr", "eigen"),

    "store_covariance":[False,True],

    "tol":[0.0001,0.001,0.01,1.0]}

    grid_modelLDA = GridSearchCV(estimator=LDA, param_grid= param_gridLDA)

    grid_modelLDA.fit(x_train,y_train)

    print("Best score: ", grid_modelLDA.best_score_, "Best parameters: ", grid_modelLDA.best_params_)

    Best score: 0.7622550979608157 Best parameters: {‘n_components’: 1, ‘solver’:
    ‘svd’, ‘store_covariance’: False, ‘tol’: 0.0001}

    Listing 6-2

    Hyperparameter Optimizations

    ```


    Listing [6-3](#506148_1_En_6_Chapter.xhtml#PC3) completes the model using default
    hyperparameters.


    ```

    LDA = LinearDiscriminantAnalysis(n_components= 1,

    solver= ''svd'',

    store_covariance= False,

    tol= 0.0001)

    LDA.fit(x_train,y_train)

    Listing 6-3

    Finalize the LDA Classifier

    ```


    Listing [6-4](#506148_1_En_6_Chapter.xhtml#PC4) transforms the variables.


    ```

    features_new = LDA.transform(x_train)

    Listing 6-4

    Create New Features

    ```


    Listing [6-5](#506148_1_En_6_Chapter.xhtml#PC5) estimates the percentage of variance
    explained by each of the selected components.


    ```

    print(LDA.explained_variance_ratio_)

    [1.]

    Listing 6-5

    Explained Variance Ratio

    ```


    Each of the selected components explains 100% of the variance. Listing [6-6](#506148_1_En_6_Chapter.xhtml#PC6)
    prints the original number of features and the number of reduced features.


    ```

    print(''Original feature #:'', x_train.shape[1])

    print(''Reduced feature #:'', features_new.shape[1])

    Original feature #: 7

    Reduced feature #: 1

    Listing 6-6

    The Number of Original and Reduced Features

    ```


    Initially, we had eight features; there are now seven features.


