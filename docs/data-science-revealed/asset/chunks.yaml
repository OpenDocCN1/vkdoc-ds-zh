    ### 移动平均平滑技术


    `MA` 应用了先前和近期数据点的加权平均均值。当序列中没有季节性，但我们希望预测未来实例时，此方法非常有用。权重取决于序列的稳定性。如果序列稳定，则近期数据点权重高，先前数据点权重低。相反，如果序列不稳定，则近期数据点权重低，先前数据点权重高。清单
    3-9 返回了 90 天的移动平均值（见图 3-8）。


