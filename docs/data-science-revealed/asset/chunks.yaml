    # 基于密度的含噪声空间聚类模型


    我们使用基于密度的含噪声空间聚类模型（`DBSCAN`）来寻找任意空间形状的聚类。该模型识别一个包含若干数据点的半径区域。任何一个数据点都可以是核心点、边界点或离群点。根据这些点，数据点被分组为不同的聚类。表
    10-11 重点说明了这些点。


    表 10-11


    DBSCAN 点类型


    | 点类型 | 描述 |

    | --- | --- |

    | **核心点** | 被最少数量邻居所包围的点。核心点被边界点所包围。 |

    | **边界点** | 未被最少数量邻居所包围，但可以从核心点到达的点。 |

    | **离群点** | 既不是核心点也不是边界点的点。该点远离核心点的可达范围。 |


    该模型会寻找互为邻居的核心点，并将它们归入同一个聚类。因此，一个聚类至少包含一个核心点（可达点）或边界点。此外，它还能发现被不同聚类所包围的聚类。参见代码清单
    10-22。


    ```

    dbscan = DBSCAN()

    dbscan_output = dbscan.fit(df)

    dbscan_output

    代码清单 10-22

    完成 DBSCAN 模型

    ```


    代码清单 10-23 和表 10-12 重点说明了预测的标签。


    表 10-12


    预测类别


    |   | 预测值 |

    | --- | --- |

    | **0** | -1 |

    | **1** | -1 |

    | **2** | -1 |

    | **3** | -1 |

    | **4** | -1 |

    | **...** | ... |

    | **195** | -1 |

    | **196** | -1 |

    | **197** | -1 |

    | **198** | -1 |

    | **199** | -1 |


    ```

    y_pred = pd.DataFrame(dbscan_output.labels_,columns = ["Predicted"])

    y_pred

    代码清单 10-23

    预测标签

    ```


    代码清单 10-24 描述了 DBSCAN 模型的特征（见图 10-9）。


    ![../images/506148_1_En_10_Chapter/506148_1_En_10_Fig9_HTML.jpg](img/506148_1_En_10_Fig9_HTML.jpg)


    图 10-9


    DBSCAN 模型


    ```

    fig, ax = plt.subplots()

    plt.scatter(df[:,0],df[:,1],c=dbscan_output.labels_,cmap="viridis",s=20)

    plt.xlabel("y")

    plt.show()

    代码清单 10-24

    可视化 DBSCAN 模型

    ```


    图 10-9 显示，DBSCAN 模型并未做出大量智能的推测。这并不意味着该模型在所有情况下都表现不佳。当满足基于密度的标准时，该模型是适用的。显然，高斯分布表现出更优的性能。


    ## 结论


    本章介绍了降维和聚类分析。我们开发并评估了三种聚类模型，即 K-means 模型、DBSCAN 模型和凝聚层次模型。我们首先使用 PCA 方法降低数据的维度。然后，我们采用肘部法则来确定在
    K-means 模型和凝聚层次模型中需要指定的聚类数量。在开发 DBSCAN 模型时，我们不需要预先假定聚类的数量。


    聚类模型是宽松的；它们没有强假设条件。聚类分析中令人望而生畏的部分是模型评估。它们缺乏稳健的评估指标，我们依赖轮廓系数法进行模型评估。


