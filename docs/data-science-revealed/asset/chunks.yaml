  trans: '

    # H2O 的工作原理


    H2O 使我们能够以较少的技术投入来开发、测试和验证机器学习和深度学习模型。使用此包时，我们无需编写大量代码。它自动化了大部分数据科学流程。清单 13-1
    初始化了 H2O。


    表 13-1 环境信息


    | H2O_cluster_uptime: | 07 秒 |

    | --- | --- |

    | **H2O_cluster_timezone:** | America/Los_Angeles |

    | **H2O_data_parsing_timezone:** | UTC |

    | **H2O_cluster_version:** | 3.30.0.7 |

    | **H2O_cluster_version_age:** | 3 个月零 3 天 |

    | **H2O_cluster_name:** | H2O_from_python_i5_lenov_z4hv4c |

    | **H2O_cluster_total_nodes:** | 1 |

    | **H2O_cluster_free_memory:** | 2.975 Gb |

    | **H2O_cluster_total_cores:** | 0 |

    | **H2O_cluster_allowed_cores:** | 0 |

    | **H2O_cluster_status:** | 接受新成员，运行健康 |

    | **H2O_connection_url:** | [`http://127.0.0.1:54321`](http://127.0.0.1:54321)
    |

    | **H2O_connection_proxy:** | {“http”: null, “https”: null} |

    | **H2O_internal_security:** | False |

    | **H2O_API_Extensions:** | Amazon S3, Algos, AutoML, Core V3, TargetEncoder,
    Core V4 |

    | **Python_version:** | 3.7.6 final |


    ```

    import h2o

    h2o.init()

    清单 13-1

    初始化 H2O

    ```


    ## 数据处理


    我们使用 `import_file()` 方法将数据加载到 H2O 数据框中。该包支持不同的文件格式。同样，我们从 Kaggle 获取了示例数据。^((16))


    ```

    df = h2o.import_file(path_name)

    清单 13-2

    将数据加载到 H2O 数据框

    ```


    清单 13-3 返回前 10 个数据点。


    ```

    df.head()

    清单 13-3

    查看 H2O 数据框

    ```


    清单 13-4 将自变量和因变量分配到两个独立的数据框中。


    ```

    y = "Outcome" x = df.col_names x.remove("Outcome") df["Outcome"] = df["Outcome"].asfactor()

    清单 13-4

    将变量分配到 X 和 Y 数据框

    ```


    清单 13-5 应用 `split_frame()` 方法将数据拆分为训练数据、测试数据和验证数据。


    ```

    train, valid, test = df.split_frame(ratios=[.8, .1], seed=1234)

    print("Train shape: ", train.shape)

    print("Valid shape: ", valid.shape)

    print("Test shape: ", test.shape)

    清单 13-5

    将数据拆分为训练数据、测试数据和验证数据

    ```


    ## 模型训练


    清单 13-6 完成了逻辑分类器。


    ```

    from h2o.estimators.glm import H2OGeneralizedLinearEstimator glm = H2OGeneralizedLinearEstimator(family="binomial")
    glm.train(x=x, y=y, training_frame=train, validation_frame=valid)

    清单 13-6

    完成逻辑分类器

    ```


    我们将族类型指定为“binomial”，因为我们正在解决一个二分类问题。如果我们要解决一个多分类问题，那么我们会将族类型指定为“multinomial”。


    ### 模型评估


    在本书中，我们依赖混淆矩阵、分类报告、ROC 曲线、精确率-召回率曲线和学习曲线来总结二分类器的性能。与 H2O 包相比，SciKit-Learn 包提供的矩阵较少。下面，我们将充分讨论
    H2O 包中可用的分类评估指标，然后向您展示如何估算它们。我们从基尼指数开始。


    #### 基尼指数


    H2O 包使我们能够获取基尼指数值，该值衡量数值中存在的不平等程度。我们使用该指数来正确判断分类器的质量。该指数的取值范围从 0 到 1。其中，0 表示分类器具有完全平等性，1
    表示分类器具有完全不平等性。当我们开发分类器时，通常期望找到更接近 1 的基尼指数值。清单 13-7 返回基尼指数的估计值。


    ```

    glm.gini(train=True, valid=True, xval=False)

    {''train'': 0.6828073360331426, ''valid'': 0.548148148148148}

    清单 13-7

    基尼指数

    ```


    训练数据的基尼指数值为 0.68，验证数据的值为 0.55。这两个数据集都处于平等与不平等的边界线上。我们没有达到预期的完全不平等。然而，这些值并没有小到足以影响关于分类器的结论。


    #### 绝对马修斯相关系数


    H2O 包中另一个可用的分类模型评估指标是绝对马修斯相关系数 (MCC)。我们用它来确定实际类别与分类器预测类别之间相关性的性质。MCC 的取值范围从 -1
    到 1。其中，-1 表示分类器在预测类别时犯了很多错误，0 表示分类器难以猜测类别，1 表示分类器在区分类别方面不熟练。清单 13-8 返回绝对 MCC 的估计值。


    ```

    glm.mcc(train=True, valid=True, xval=False)

    {''train'': [[0.3356601829569534, 0.5297584436640914]],

    ''valid'': [[0.3790626186045188, 0.39336862882432994]]}

    清单 13-8

    绝对 MCC

    ```


    上述发现表明，实际类别与分类器预测的类别之间存在微弱的正相关。


    #### 混淆矩阵


    清单 13-9 返回关于分类器性能的抽象信息。（见表 13-2）。


    表 13-2 混淆矩阵


    |   |   | 0 | 1 | 错误率 | 比率 |

    | --- | --- | --- | --- | --- | --- |

    | **0** | 0 | 306.0 | 90.0 | 0.2273 | (90.0/396.0) |

    | **1** | 1 | 49.0 | 168.0 | 0.2258 | (49.0/217.0) |

    | **2** | 总计 | 355.0 | 258.0 | 0.2268 | (139.0/613.0) |


    ```

    glm.confusion_matrix()

    清单 13-9

    混淆矩阵

    ```


    清单 13-10 找出训练数据和验证数据的 F1 分数。


    ```

    glm.F1(train=True, valid=True, xval=False)

    {''train'': [[0.3356601829569534, 0.7073684210526315]],

    ''valid'': [[0.3790626186045188, 0.5405405405405405]]}

    清单 13-10

    训练数据和验证数据的 F1 分数

    ```


    上述发现表明，逻辑分类器具有不错的精确率和召回率。清单 13-11 找出准确率系数。


    ```

    glm.accuracy(train=True, valid=True, xval=False)

    {''train'': [[0.5331122058852918, 0.7862969004893964]], ''valid'': [[0.8926783510054471,
    0.8115942028985508]]}

    清单 13-11

    准确率系数

    ```


    清单 13-12 生成一条曲线，总结分类器在区分类别方面的熟练程度（见图 13-1）。


    ![../images/506148_1_En_13_Chapter/506148_1_En_13_Fig1_HTML.jpg](img/506148_1_En_13_Fig1_HTML.jpg)


    图 13-1 ROC 曲线


    ```

    glm_perf.plot()

    清单 13-12

    ROC 曲线

    ```


    图 13-1 展示了一条表现良好的曲线的特征；它一开始沿着边界的左侧行进。然而，随着我们增加假阳性率，真阳性率也随之增加。

    '
- fmt: '### Standardized Coefficient Magnitude


    Listing [13-13](#506148_1_En_13_Chapter.xhtml#PC13) returns a plot that graphically
    represent the relationship between independent variables and the dependent variable
    (see Figure [13-2](#506148_1_En_13_Chapter.xhtml#Fig2)).


    ![../images/506148_1_En_13_Chapter/506148_1_En_13_Fig2_HTML.jpg](images/506148_1_En_13_Chapter/506148_1_En_13_Fig2_HTML.jpg)


