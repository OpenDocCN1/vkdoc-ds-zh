    We use L1 regularization to center the data to its central point. This regularization
    technique makes weak variables produce coefficients equal to zero. It helps reduce
    noisy variables, consequently optimizing the learning process. Listing [12-19](#506148_1_En_12_Chapter.xhtml#PC19)
