    bias_regularizer=regularizers.l1(0.01)))

    model3.add(Dense(8, activation="relu"))

    model3.add(Dense(1, activation="relu"))

    model3.compile(loss="binary_crossentropy", optimizer=optimizer, metrics=["accuracy"])

