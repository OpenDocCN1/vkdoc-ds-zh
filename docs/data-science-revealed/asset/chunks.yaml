    ## Evaluate the LDA Classifier


    To understand how the LDA classifier performs, we must compare actual classes
    and predicted classes side by side.


    ### Confusion Matrix


    We commonly recognize a confusion matrix as the error matrix. It is a 2×2 matrix
    that counts actual labels and predicted labels. Listing [6-8](#506148_1_En_6_Chapter.xhtml#PC8)
