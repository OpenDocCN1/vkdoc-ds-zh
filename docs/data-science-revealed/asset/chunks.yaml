    # 结论


    本章介绍了广义加性模型。该模型考虑了季节性，并将时间作为回归变量。其性能优于季节性 ARIMA 模型。该模型在预测序列未来实例时误差较小。我们可以依赖 Prophet
    模型来预测时间序列。


    本书前四章恰当地介绍了参数化方法。该方法对数据的底层结构做出了大胆的假设。它假设数据的底层结构是线性的。


    后续章节将介绍非参数化方法。该方法支持对数据底层结构进行灵活的假设。它假设数据的底层结构是非线性的。


    脚注 1


    # 5. 逻辑回归分析


    本章以结构化的方式介绍逻辑回归的概念及其实现。前面的章节介绍了监督学习，并重点讨论了参数化方法。在监督学习中，我们向模型提供一组正确答案，然后让模型预测未见过的数据。我们使用参数化方法来解决回归问题（当因变量是连续变量时）。


    本章介绍一种被称为非参数化方法（或分类方法）的监督学习方法。与线性回归方法不同，它对数据的结构有灵活的假设。它没有线性和正态性假设。分类方法有两个完整的类别。它们是二元分类（当因变量有两个结果时使用，例如：是/否、通过/失败）和多类分类（当因变量有两个以上结果时使用，例如：负面/中性/正面）。


    ## 什么是逻辑回归？


    逻辑回归是一种用于估计自变量对因变量影响程度的模型。自变量可以是连续变量或分类变量，而因变量则始终是只有两个结果的分类变量。尽管逻辑回归被称为*回归*，但它并非回归模型，而是一种分类模型。与线性回归一样，我们使用该模型来寻找截距和斜率。


    ## 逻辑回归的假设


    分类方法不包含对数据结构的严格假设。它假设因变量是分类变量，并且数据中至少有 50 个数据点。理想情况下，我们需要大样本。


    ## 逻辑回归实践


    我们从 Kaggle 获取了示例数据。^(⁴) 表 5-1 显示了数据的前几行。


