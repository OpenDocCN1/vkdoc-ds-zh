    x-axis represents time in years, and the y-axis represents the probability of
    surviving or the proportion of people surviving. Listing [11-15](#506148_1_En_11_Chapter.xhtml#PC15)
    plots the survival curve (see Figure [11-2](#506148_1_En_11_Chapter.xhtml#Fig2)).


