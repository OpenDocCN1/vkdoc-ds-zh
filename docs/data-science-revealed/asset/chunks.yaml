- fmt: '### Box Plot


    The simplest way to detect outliers is by using a box plot. A box plot succinctly
    summarizes information about the distinctive shape and dispersion of the data.
    It has the following properties: a box representing the middle values in the data,
    the median line representing the point where 50% of the data points are, and quartiles
    representing the point at which 25% of the data points are above and 75% of the
    data points are below the straight line. While `Q3` represents the point at which
    75% of the data is over and 25% of it is under, the straight line and the other
    lines are representing a whisker that joins `Q1` or `Q3` with the farthest data
    point other than an outlier.


    Listing [1-6](#506148_1_En_1_Chapter.xhtml#PC6) plots the employees’ years of
    work experience.


    ```

    sns.boxplot(df["YearsExperience"])

    plt.xlabel("Experience")

    plt.show()

    Listing 1-6

    Employees’ Years of Work Experience Box Plot

    ```


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig6_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Box plot


    Figure [1-6](#506148_1_En_1_Chapter.xhtml#Fig6) shows that the values of employees’
    years of work experience are slightly skewed to the left, and there were no outliers
    in the data.


    Listing [1-7](#506148_1_En_1_Chapter.xhtml#PC7) constructs a box plot for the
    values of the dependent variable (see Figure [1-7](#506148_1_En_1_Chapter.xhtml#Fig7)).


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig7_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Box plot


    ```

    sns.boxplot(df["Salary"])

    plt.xlabel("Salary")

    plt.show()

    Listing 1-7

    Employees’ Salaries Box Plot

    ```


    Figure [1-7](#506148_1_En_1_Chapter.xhtml#Fig7) indicates that the values of employees’
    salaries are skewed to the left, and there are no outliers detected in the data.
    Both Figure [1-6](#506148_1_En_1_Chapter.xhtml#Fig6) and Figure [1-7](#506148_1_En_1_Chapter.xhtml#Fig7)
    slightly resemble a normal distribution.


    Listing [1-8](#506148_1_En_1_Chapter.xhtml#PC8) plots the employees’ years of
    work experience and employees’ salaries. Figure [1-8](#506148_1_En_1_Chapter.xhtml#Fig8)
    exhibits changes over time connected by a straight line. It has two axes: x-axis
    (horizontal) and y-axis (vertical). The axes are graphically denoted as (`x`,
    `y`). The independent variable is on the x-axis, and the dependent is on the y-axis.


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig8_HTML.png](images/506148_1_En_1_Chapter/506148_1_En_1_Fig8_HTML.png)


    Figure 1-8


    Line plot


    ```

    df.plot(kind="line")

    plt.xlabel("Experience")

    plt.ylabel("Salary")

    plt.show()

    Listing 1-8

    Employees’ Years of Work Experience and Employees’ Salaries Line Plot

    ```


    Figure [1-8](#506148_1_En_1_Chapter.xhtml#Fig8) does not show an ideal line. The
    data points invariably follow a long-run upward trend. The straight line slopes
    upward and to the right. Employees’ salaries increase as their years of work experience
    increase.


    Listing [1-9](#506148_1_En_1_Chapter.xhtml#PC9) returns a plot that shows the
    probability density function using kernel density estimation (see Figure [1-9](#506148_1_En_1_Chapter.xhtml#Fig9)).
    It captures the probabilities of the continuous random variable.


    ![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig9_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    Density plot


    ```

    sns.kdeplot(df["YearsExperience"],df["Salary"])

    plt.title("Experience and salary density plot")

    plt.xlabel("Experience")

    plt.ylabel("Salary")

    plt.show()

    Listing 1-9

    Density Plot

    ```


    Figure [1-9](#506148_1_En_1_Chapter.xhtml#Fig9) suggests a two-dimensional probability
