    ## Understand Correlation


    Linear regression is all about examining correlation coefficients. Correlation
    estimates the apparent strength of a linear relationship between an independent
    variable and a dependent variable. There are several methods for determining the
    correlation between two variables like the Pearson correlation method, Spearman
    correlation method, and Kendall correlation method.


    ### The Pearson Correlation Method


    Listing [1-12](#506148_1_En_1_Chapter.xhtml#PC12) applies the Pearson correlation
    method (the dependent variable is a continuous variable). Equation 1-6 expresses
    the method.


    ![$$ {r}_{xy}=\frac{s_{xy}}{s_x{s}_y} $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ6.png)


    (Equation 1-6)


    Here, `s[x]` represents the standard deviation of an independent variable, `s[y]`
    represents the standard deviation of a dependent variable, and `s[xy]` represents
    the covariance. The method produces values that range from -1 to 1, where -1 shows
    a strong negative correlation relationship, 0 shows no correlation relationship,
    and 1 shows a strong positive correlation relationship.


    #### Correlation Matrix


    Figure [1-11](#506148_1_En_1_Chapter.xhtml#Fig11) shows the correlation between
    employees’ years of work experience and employees’ salaries.


