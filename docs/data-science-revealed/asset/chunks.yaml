    #### ROC Curve


    A receiver operating characteristics (ROC) curve is a tool used to find appropriate
    hyperparameter settings. It helps summarize the trade-off between the true positive
    rate and the false positive rate using different probability thresholds. On the
    x-axis lies the false positive rate, and on the y-axis lies the true positive
    rate. The closer the curve follows the left-side border than the top border of
    the ROC space, the more accurate it is. See Listing [5-22](#506148_1_En_5_Chapter.xhtml#PC22).


