- fmt: "# 1. An Introduction to Simple Linear Regression\n\nThis book introduces you\
    \ to the world of data science. It reveals the proper way to do data science.\
    \ It covers essential statistical and programming techniques to help you understand\
    \ data science from a broad perspective. Not only that, but it provides a theoretical,\
    \ technical, and mathematical foundation for problem-solving using data science\
    \ techniques.\n\nThis chapter covers the *parametric method*, also called the\
    \ *linear method*. Understanding how to test a regressor under the violation of\
    \ regression assumptions will enable you to tackle problems in subsequent chapters\
    \ with ease. While reading, it is important to remember that the example data\
    \ has one dependent variable. This chapter does not cover multicollinearity with\
    \ a variance inflation factor (`VIF`).\n\nSimple linear regression estimates the\
    \ nature of the relationship between an independent variable and a dependent variable,\
    \ where an *independent variable* is a continuous variable or a categorical variable\
    \ and a *dependent variable* is inevitably a continuous variable. It investigates\
    \ how a change in an independent variable influences a change in a dependent variable.\
    \ We express the standard formula as shown in Equation 1-1.\n\n![$$ y=a+ bx $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ1.png)\n\
    \n(Equation 1-1)\n\nHere, `y` represents a dependent variable, `a` represents\
    \ an intercept (the mean value of a dependent variable given that we hold an independent\
    \ variable constant), `b` represents a slope or gradient (the direction of a straight\
    \ line), and `x` represents an independent variable.\n\nThe model fits a straight\
    \ line to the data points. If it perfectly fits a straight line to the data points,\
    \ then it is an exemplary model. In contrast, if the data points severely deviate\
    \ away from a straight line, then it violates regression assumptions.\n\n![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig1_HTML.png](images/506148_1_En_1_Chapter/506148_1_En_1_Fig1_HTML.png)\n\
    \nFigure 1-1\n\nPairwise scatter plot for a perfect linear regression model\n\n\
    Figure [1-1](#506148_1_En_1_Chapter.xhtml#Fig1) illustrates an optimal model (it\
    \ hardly happens in the actual world because of variability). At most, the data\
    \ points scatter close to the straight line. To combat this problem, a regressor\
    \ (or a regression model) introduces an error term during modeling so that the\
    \ squared deviation of the data points is small. It estimates an intercept and\
    \ a slope to reduce the error terms. The most common regressor is the least-squares\
    \ model. Equation 1-2 expresses the formula of the least-squares model.\n\n![$$\
    \ \\hat{y}={\\beta}_0+{\\beta}_1{X}_1+{\\varepsilon}_i $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ2.png)\n\
    \n(Equation 1-2)\n\nHere, `ŷ` represents an expected dependent variable, `β₀`\
    \ represents an intercept, `β₁` represents a slope, `X₁` represents an independent\
    \ variable, and `εᵢ` represents the error terms (the residual for the `i`-th of\
    \ `n` data points) expressed as shown in Equation 1-3.\n\n![$$ {e}_i={y}_i-\\\
    hat{y_i} $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ3.png)\n\
    \n(Equation 1-3)\n\nThe least-squares regressor ensures that the sum squares of\
    \ residuals are small. Equation 1-4 estimates the sum squares of residuals by\
    \ using the property underneath.\n\n![$$ {e}_1^2+{e}_2^2\\dots {e}_i^2 $$](images/506148_1_En_1_Chapter/506148_1_En_1_Chapter_TeX_Equ4.png)\n\
    \n(Equation 1-4)\n\nEquation 1-4 assumes that residuals are always equal to zero\
    \ and that estimates are unbiased.\n\n## Regression Assumptions\n\nIf a regressor\
    \ satisfies the assumptions specified in Table [1-1](#506148_1_En_1_Chapter.xhtml#Tab1),\
    \ then it is reliable.\n\nTable 1-1\n\nLinear Regression Assumptions\n\n| Assumption\
    \ | Description |\n| --- | --- |\n| **Linearity** | There must be a linear relationship\
    \ between an independent variable and a dependent variable. We verify this assumption\
    \ using a pairwise scatter plot. |\n| **Normality** | Data must come from a normal\
    \ distribution. There is a normal distribution when values of a variable spread\
    \ symmetrically around the true mean value. We verify this assumption using a\
    \ normal probability plot (also called a *normal Q-Q plot*). For a reliable test\
    \ of normality, use a test statistic called the *Kolmogorov-Smirnov test*. If\
    \ there is no normality, then transform the data. |\n| **Multicollinearity** |\
    \ There must be little or no multicollinearity in the data. If an independent\
    \ variable has a high correlation, then there is multicollinearity. We verify\
    \ this assumption by using a correlation matrix, tolerance, and `VIF`. If there\
    \ is multicollinearity, we must center the data. The example data has one dependent\
    \ variable, so multicollinearity with `VIF` is not covered. |\n| **No autocorrelation**\
    \ | There must be no autocorrelation in the residuals. There is autocorrelation\
    \ when residuals are not independent of each other. We verify this assumption\
    \ using a lag plot, autocorrelation function plot, and partial autocorrelation\
    \ plot. For a reliable test of autocorrelation, use the Dublin-Watson test. |\n\
    \nIn contrast, if a regressor violates the underlying regression assumption, then\
    \ it becomes difficult to generalize a model.\n\n## Simple Linear Regression in\
    \ Practice\n\nThe example data¹ has two columns (each column represents a variable).\
    \ The first column contains the values of employees’ years of work experience\
    \ (an independent variable), and the second column contains the values of employees’\
    \ salaries (a dependent variable).\n\n## Check Data Quality\n\nThe least-squares\
    \ model is sensitive (the quality of the data influences its performance). For\
    \ optimal model performance, ensure there are no missing values or outliers and\
    \ scale the data prior to training the regressor.\n\n### Detect Missing Values\n\
    \nThe visible presence of missing values in the data results in poor model performance.\
    \ To avoid this dilemma, after loading the data, check whether there are missing\
    \ values in the data.\n\n#### Missing Values Heatmap\n\nListing [1-1](#506148_1_En_1_Chapter.xhtml#PC1)\
    \ plots a heatmap that shows the missing values (see Figure [1-2](#506148_1_En_1_Chapter.xhtml#Fig2)).\n\
    \n![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig2_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2\n\nMissing values heatmap\n\n```\nimport seaborn as sns\nsns.heatmap(df.isnull(),cmap=\"\
    Blues\")\nplt.show()\n```\n\nListing 1-1  \nMissing Values Heatmap\n\nFigure [1-2](#506148_1_En_1_Chapter.xhtml#Fig2)\
    \ shows that there are no missing values detected in the data. If there are missing\
    \ values in the data, the heatmap looks like Figure [1-3](#506148_1_En_1_Chapter.xhtml#Fig3).\n\
    \n![../images/506148_1_En_1_Chapter/506148_1_En_1_Fig3_HTML.jpg](images/506148_1_En_1_Chapter/506148_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nMissing values heatmap\n\nIf there are missing values in the data,\
    \ replace the missing values with the mean value or the median of the variable.\
    \ Listing [1-2](#506148_1_En_1_Chapter.xhtml#PC2) replaces the missing values\
    \ with the mean value.\n\n```\ndf[\"YearsExperience\"].fillna(df[\"YearsExperience\"\
    ].mean())\ndf[\"Salary\"].fillna(df[\"YearsExperience\"].mean())\n```\n\nListing\
    \ 1-2  \nReplace Missing Values with the Mean Value\n\nListing [1-3](#506148_1_En_1_Chapter.xhtml#PC3)\
    \ replaces missing values with the median value.\n\n```\ndf[\"YearsExperience\"\
    ].fillna(df[\"YearsExperience\"].median())\ndf[\"Salary\"].fillna(df[\"YearsExperience\"\
    ].median())\n```\n\nListing 1-3  \nReplace Missing Values with the Median Value"
