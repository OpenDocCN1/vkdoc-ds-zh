- fmt: '# Density-Based Spatial Clustering Model with Noise


    We use the density-based spatial clustering model with noise (`DBSCAN`) model
    to find arbitrary-spatial clusters. It recognizes a radius area that includes
    several data points. Any of the data points can be a core point, border point,
    or outlier point. Points are grouped as clusters based on these points. Table
    [10-11](#506148_1_En_10_Chapter.xhtml#Tab11) highlights these points.


    Table 10-11


    DBSCAN Points


    | Points | Description |

    | --- | --- |

    | **Core point** | A point enclosed by the smallest number of neighbors. Core
    points are surrounded by border points. |

    | **Border point** | A point that is not enclosed by the smallest number of neighbors
    and can be reached from the core point. |

    | **Outlier point** | A point that is neither a core point nor a border point.
    This is a point that is far away from the reach of a core point. |


    It finds core points that are neighbors and places them in the same cluster. As
    a result, a cluster encompasses at least one core point (reachable points) or
    border points. Moreover, it discovers clusters enclosed by different clusters.
    See Listing [10-22](#506148_1_En_10_Chapter.xhtml#PC22).


    ```

    dbscan = DBSCAN()

    dbscan_output = dbscan.fit(df)

    dbscan_output

