    y_pred

    ```


    **Listing 10-19** Predicted Labels


    ```

    fig, ax = plt.subplots()

    plt.scatter(df[:,0],df[:,1],c=agglo_output.labels_,cmap="viridis",s=20)

    plt.xlabel("y")

    plt.show()

    ```


    **Listing 10-20** Agglomerative Model


    Figure [10-7](#506148_1_En_10_Chapter.xhtml#Fig7) points out three clusters. The
    large cluster breaks down into two small clusters. We also realize a minor overlap
    between cluster 1 and cluster 2.


    ![../images/506148_1_En_10_Chapter/506148_1_En_10_Fig7_HTML.jpg](images/506148_1_En_10_Chapter/506148_1_En_10_Fig7_HTML.jpg)


    **Figure 10-7** Agglomerative model


    We use a dendogram to depict the hierarchy of the cluster tree. Listing [10-21](#506148_1_En_10_Chapter.xhtml#PC21)
    creates a linkage matrix, creates the counts of samples under each node, and creates
    a corresponding dendrogram (see Figure [10-8](#506148_1_En_10_Chapter.xhtml#Fig8)).


    ![../images/506148_1_En_10_Chapter/506148_1_En_10_Fig8_HTML.jpg](images/506148_1_En_10_Chapter/506148_1_En_10_Fig8_HTML.jpg)


    **Figure 10-8** Agglomerative dendrogram


    ```

    def plot_dendrogram(model, **kwargs):

    counts = np.zeros(model.children_.shape[0])

    n_samples = len(model.labels_)

    for i, merge in enumerate(model.children_):

    current_count = 0

    for child_idx in merge:

    if child_idx < n_samples:

    current_count += 1

    else:

    current_count += counts[child_idx - n_samples]

    counts[i] = current_count

    linkage_matrix = np.column_stack([model.children_, model.distances_,

    counts]).astype(float)

    dendrogram(linkage_matrix, **kwargs)

    plot_dendrogram(agglo_output, truncate_mode="level", p=3)

    ```


    **Listing 10-21** Visualize the Dendrogram


    Figure [10-8](#506148_1_En_10_Chapter.xhtml#Fig8) shows data points connected
    in clusters (one parent with two children).'
