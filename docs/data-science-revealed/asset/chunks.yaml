    plt.scatter(kmean_centroids[:,0], kmean_centroids[:,1], color="red")

    plt.xlabel("y")

    plt.show()

    Listing 10-16

    Visualize the K-Means Model

    ```


    The K-means model made intelligent guesstimates until data points were allocated
    to the nearest centroid and found the mean value of the centroids. Figure [10-6](#506148_1_En_10_Chapter.xhtml#Fig6)
    indicates that there are three apparent clusters in the data.


    ## The Silhouette Score


    We use the Silhouette method to appraise the K-means model. The method compares
    cohesion and separation. It has values that range from -1 to 1, where -1 indicates
    severe mislabeling, 0 indicates overlaps in clusters, and 1 indicates that the
    sample is far away from adjacent clusters. See Listing [10-17](#506148_1_En_10_Chapter.xhtml#PC17).


    ```

    metrics.silhouette_score(df, y_predkmeans)

    0.3839349967742105

    Listing 10-17

    Silhouette Score

    ```


    The Silhouette score is 0.38, which indicates that the model is far from perfect.
    There are overlaps in clusters.


    ## Agglomerative Clustering


    The agglomerative model is a hierarchical model that uses a bottom-up approach
    to produce dendrograms. It develops *n* clusters (one for each) and then computes
    proximity. Thereafter, it consolidates clusters close to each other while updating
    the proximity matrix. The end result is a single cluster. There are several ways
    of calculating the distance between data points. Table [10-9](#506148_1_En_10_Chapter.xhtml#Tab9)
    highlights key distance calculation techniques.


    Table 10-9


    Distancing Techniques


    | Technique | Description |

    | --- | --- |

    | **Single-linkage clustering** | Finding the minimum distance between clusters
    |

    | **Complete-linkage clustering** | Finding the maximum distance between clusters
    |

    | **Average linkage clustering** | Finding the average distance between clusters
    |

    | **Centroid linkage clustering** | Finding the distance between cluster centroids
    |


    Unlike the K-means model that randomly initializes centroids, the agglomerative
    generates more than one partition based on resolution. Listing [10-18](#506148_1_En_10_Chapter.xhtml#PC18)
    completes the agglomerative model.


    ```

    agglo = AgglomerativeClustering(n_clusters=None,distance_threshold=0)

    agglo_output = agglo.fit(pca_df)

    agglo_output

