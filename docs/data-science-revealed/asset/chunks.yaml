    ### 精确率-召回率曲线


    我们使用精确率-召回率曲线来展示不同阈值下精确率与召回率之间的权衡关系。理想情况下，我们希望曲线能径直向右上方移动，然后急剧水平弯曲。这样的曲线意味着高精确率和高召回率，表明二分类器做出的所有预测都是正确的。参见清单
    5-23。


    ```

    precisionlogreg, recalllogreg, thresholdlogreg = metrics.precision_recall_curve(y_test,y_predlogreg)

    apslogreg = metrics.roc_auc_score(y_test,y_predlogreg)

    plt.plot(precisionlogreg, recalllogreg, label="aps: "+str(apslogreg),color="navy",alpha=0.8)

    plt.axhline(y=0.5,color="red",alpha=0.8)

    plt.xlabel("Precision")

    plt.ylabel("Recall")

    plt.legend(loc=4)

    plt.show()

    清单 5-23

    精确率-召回率曲线

    ```


    图 5-8 中的曲线并未逼近右上角边界，而是缓慢地向右下角下降。这表明糖尿病患者与非糖尿病患者之间存在重叠区域。精确率和召回率都不够高。


    ![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig8_HTML.jpg](img/506148_1_En_5_Fig8_HTML.jpg)


    图 5-8


    精确率-召回率曲线


    #### 计算平均精确率分数


    为了理解精确率-召回率曲线，我们需要解析其集中趋势。平均精确率分数（APS）是精确率-召回率曲线内所有精确率分数的算术平均值。该分类器在 76% 的情况下是精确的。


    ### 学习曲线


    学习曲线用于判断模型是否存在低偏差误差项（欠拟合）和高方差（过拟合）。它描绘了模型随时间推移的学习过程。该曲线使我们能够确定增加训练数据中的数据点能在多大程度上带来收益，并判断估计器是存在方差误差还是偏差。学习曲线有两种类型，即训练学习曲线（根据训练数据计算）和验证学习曲线（根据验证数据计算）。学习曲线有两个轴：x
    轴表示训练集大小，y 轴表示准确率分数。图 5-9 展示了分类器的学习过程。另请参见清单 5-24。


    ![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig9_HTML.jpg](img/506148_1_En_5_Fig9_HTML.jpg)


    图 5-9


    学习曲线


    ```

    trainsizelogreg, trainscorelogreg, testscorelogreg = learning_curve(logreg, x,
    y, cv=5, n_jobs=5, train_sizes=np.linspace(0.1,1.0,50))

    trainscorelogreg_mean = np.mean(trainscorelogreg,axis=1)

    testscorelogreg_mean = np.mean(testscorelogreg,axis=1)

    plt.plot(trainsizelogreg,trainscorelogreg_mean,color="red", label="Training score",
    alpha=0.8)

    plt.plot(trainsizelogreg,testscorelogreg_mean,color="navy", label="Cross validation
    score", alpha=0.8)

    plt.xlabel("Training set size")

    plt.ylabel("Accuracy")

    plt.legend(loc=4)

    plt.show()

    清单 5-24

    学习曲线

    ```


    在学习过程的初始阶段，逻辑分类器存在过拟合。然而，随着训练集大小的增加，分类器的过拟合程度降低。当分类器接近第 400 个数据点时，交叉验证准确率分数开始下降。增加更多数据点并不会提升泛化能力。你将在后续章节中学习更多关于如何解读学习曲线的知识。


    ## 结论


    本章介绍了非参数方法。它评估了使用 `Statsmodels` 和 `SciKit-Learn` 开发的两个逻辑分类器。第二个模型展示了表现良好的模型的特征。该模型在
    85% 的情况下是正确的。理想情况下，我们希望模型在 100% 的情况下都是正确的。有几种方法可以改进逻辑分类器的性能，例如降维和正则化。在 `SciKit-Learn`
    包中，有内置交叉验证的逻辑分类器和岭分类器。这些模型有助于提升分类器的性能。


    脚注 1


    # 6. 使用线性判别分析进行降维与多变量分析


    前一章介绍了一种称为逻辑回归的分类方法。它用于解决二分类问题。多项逻辑回归（MLR）是逻辑回归的扩展，它使用 `Softmax` 函数代替 `Sigmoid`
    函数，并应用交叉熵损失函数。它是一种用于预测具有两个以上类别的目标变量的逻辑回归形式。它与线性判别分析（LDA）的不同之处在于，MLR 不假设数据来自正态分布。LDA
    属于线性家族，它假设正态性和线性。


    我们使用 LDA 来解决二分类问题和多分类问题。本章介绍线性分类和判别分析。它揭示了使用 LDA 将数据压缩到更少维度，并利用连续变量估计分类变量的方法。


    该模型的工作方式类似于前几章中介绍的模型，如线性回归和逻辑回归。它也与协方差分析（ANOVA）相似。ANOVA 使用分类变量估计连续变量。LDA 合理地假设各组的协方差结构相似。如果各组的协方差结构不相等，则使用二次判别分析。LDA
    模型的一个扩展被称为费舍尔判别分析（FDA）。FDA 不执行分类，但变换后获得的特征可用于分类。


    逻辑回归和 LDA 都用于估计分类因变量。LDA 与逻辑回归的区别在于它有更多的假设。它也与主成分分析和因子分析相似，因为它寻找最能解释数据的线性组合。当样本量较大时，LDA
    效果最佳。


    它应用判别函数，通过寻找变量的线性组合并最大化它们之间的差异，将一组连续变量分配到各个类别中。同样，它应用费舍尔线性判别规则来最大化类内散度矩阵与类间散度矩阵之间的比率，并发现组内的线性组合。


    最后，它仅使用连续变量来估计分类变量。如果自变量是分类变量，因变量也是分类变量，则使用另一种称为判别对应分析的替代模型。鉴于其继承自线性家族，需要根据线性和正态性假设对模型进行检验。LDA
    有两个用途：降维和分类。


    ### 降维


    我们使用 LDA（类似于 PCA）进行降维。它发现数据中解释的方差，并将数据减少到更少的维度。请记住使用特征值来寻找数据中显著变异性的来源。具有最高载荷的特征值是第一个函数，具有第二高载荷的是第二个函数，依此类推。我们根据某些标准剔除具有过高特征值（极端变异性）的因子。


    ### 分类


    LDA 解决二分类和多分类问题。它应用线性分类器将变量分配到某个类别。由于该模型应用线性分类器，因此继承了线性和正态性的严格假设。

