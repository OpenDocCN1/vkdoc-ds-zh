- fmt: '# Conclusion


    This chapter showed the tree classification modeling technique, including discovering
    the optimal hyperparameters, finding variables that are the most important to
    the dependent variables, and visualizing the decision tree and classifier using
    only import variables and the best hyperparameters. There are alternative classifiers
    that uniquely extend the decision tree classifier, such as the extra tree and
    random forest tree. Extra trees split a point of the decision tree at random.
    A random forest tree iteratively builds multiple decision trees in parallel.


    # 9. Back to the Classics


    We will now cover one of the oldest classification methods; naïve Bayes is an
    early 18^(th) century model. It is a supervised learning model that solves binary
    and multiclass classification problems. The word *naïve* derives from the assumption
    that the model makes about the data. We consider it naïve because it assumes that
    variables are independent of each other, meaning there is no dependency on the
    data. This rarely occurs in the actual world. We can reduce the naïve Bayes theorem
    into Equation 9-1.


    ![$$ P\left(A\vert B\right)=\kern0.5em \left(P\left(B\vert A\right)P(A)\right)/\left(P(B)\right)
    $$](images/506148_1_En_9_Chapter/506148_1_En_9_Chapter_TeX_Equ1.png)


    (Equation 9-1)


    Here, the probability of event A happening knowing that event B has already happened.


    This chapter covers Gaussian naïve Bayes. It assumes that the independent variables
    are binary. However, we can relax the assumption to accommodate continuous variables
    that follow a normal distribution. Also, it is memory efficient and fast because
    we do not perform hyperparameter tuning; it has no tunable hyperparameters. Bayes
    models are part of the probabilistic family. To comprehend the model, familiarize
    yourself with naïve Bayes.


    ## The Naïve Bayes Theorem


    When dealing with continuous independent variables, use the `GaussianNB` classifier.
    It is relatively easy to model, provided you have background on dealing with continuous
    variables. Refer to the first chapter of the book for a recap on the Gaussian
    distribution (also known as *normal distribution*). We mentioned that the data
    follows a normal distribution when the data points are close to the actual mean.
    The `GaussianNB` classifier estimates the probability of a variable belonging
    to a certain class; simultaneously, it estimates the central values, in other
    words, the mean value or standard deviation value. It is most suitable for features
    with high dimensionality. At most, we use this classifier when the training set
    is small. The classifier uses the Gaussian probability density function to estimate
    the probabilities of new values of the independent variable.


    ## Develop the Gaussian Naïve Bayes Classifier


    The `GaussianNB` classifier does not require hyperparameter optimization. Likewise,
    we obtained the data from Kaggle.^([⁷](#fn7)) Listing [9-1](#506148_1_En_9_Chapter.xhtml#PC1)
    completes the `GaussianNB` classifier.


    ```

    from sklearn.naive_bayes import GaussianNB

    gnb = GaussianNB()

    gnb.fit(x_train,y_train)

    Listing 9-1

    Finalize the GaussianNB Classifier

    ```


