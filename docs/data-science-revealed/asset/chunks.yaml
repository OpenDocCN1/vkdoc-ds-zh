- fmt: '# 8. Classification Using Decision Trees


    This chapter presents the most widespread ensemble method, the decision tree.
    A decision tree classifier estimates a categorical dependent variable or a continuous
    dependent. It solves binary and multiclass classification problems. We base the
    model on a tree-like structure. It breaks down the data into small, manageable
    chunks while incrementally developing a decision tree. The outcome is a tree-like
    structure with decision nodes and leaf nodes. We consider it a greedy model since
    its primary concern is to reduce the training time while maximizing information
    gain.


    To get the best out of decision trees, knowing the data and partitions are required
    in advance. We construct a decision tree by recursive partitioning the training
    data into decision nodes. Thereafter, we examine variables and branch cases grounded
    on the findings of the examination.


    It selects variables with excessive predictive power, less impurity, and low entropy.
    It also explores the paramount variable to decrease impurity. The most important
    thing is the purity of the leaves after partitioning; it discovers a tree with
    the lowest entropy on the nodes. In summary, the decision tree classifier serves
    two purposes: separating data into different subsets and shortening the branches
    of a decision tree. It limits the depth of the tree.


    ## Entropy


    Entropy represents an estimate of randomness or uncertainty. The lower the entropy,
    the less uniform the distribution is, and the more the nodes. It shows the level
    of disorder in the data. It estimates the homogeneity of samples in a node. If
    the variables are homogenous, then the entropy is zero. If we equally divide samples,
    then entropy is 1. We estimate entropy using Equation 8-1.


    ![$$ Entropy=p(A)\kern0.5em \mathit{\log}\left(p(A)\right)-p(B)\mathit{\log}\left(p(B)\right)
    $$](images/506148_1_En_8_Chapter/506148_1_En_8_Chapter_TeX_Equ1.png)


    (Equation 8-1)


    Here, `p` is the prop or ratio of a category. We use entropy to group comparative
    data groups into comparable classes. High entropy shows that we have highly disordered
    data. A low entropy shows the data is well-organized. The model assumes that a
    less impure node requires less information to describe it, and a more impure node
    requires more information.


    A decision tree estimates the entropy of the node, and it then estimates the entropy
    of each node of the partition. Thereafter, it weighs averages of the subnodes
    and estimate information gain and selects the node with the highest information
    gain for partitioning. Organizing data for decision tree classification involves
    partitioning the data and group samples together in classes they belong to and
    maximizing the purity of the groups each time it develops a node.


    ## Information Gain


    Information gain refers to information that increases the level of certainty after
    a partition. It is the opposite of entropy. If weighted entropy decreases, then
    information gain increases, and vice versa. In summary, the decision tree classifier
    finds variables that return the most noteworthy information gain. To calculate
    information gain, we use Equation 8-2.


    ![$$ Information\ gain=\left( Entropy\ before\ the\ split\right)-\Big( Weighted\
    entropy\ after\ the\ split $$](images/506148_1_En_8_Chapter/506148_1_En_8_Chapter_TeX_Equ2.png)


    (Equation 8-2)


    ## Structure of a Decision Tree


    As mentioned, a decision tree is a flowchart-based tree-like structure. A decision
    tree estimates a sin curve using a bunch of `if`-`then`-`else` decision rules.
    The complexity of the decision rules depends on the depth of the tree. A decision
    tree encompasses decision nodes and leaf nodes. The uppermost decision node corresponds
    to the root node (the noteworthy independent variable). A leaf node is a classification
    or decision. Figure [8-1](#506148_1_En_8_Chapter.xhtml#Fig1) shows the structure
    of a decision tree.


    ![../images/506148_1_En_8_Chapter/506148_1_En_8_Fig1_HTML.png](images/506148_1_En_8_Chapter/506148_1_En_8_Fig1_HTML.png)


    Figure 8-1


    Decision tree structure


    ## Develop the Decision Tree Classifier


    Listing [8-1](#506148_1_En_8_Chapter.xhtml#PC1) develops a decision tree classifier
    with default hyperparameters.


    ```

    from sklearn.tree import plot_tree

    from sklearn.tree import DecisionTreeClassifier

    dt = DecisionTreeClassifier()

    dt.fit(x_train,y_train)

    Listing 8-1

    Develop the Decision Tree Classifier with Default Hyperparameters

    ```


    ### Decision Tree Hyperparameter Optimization


    There are dozens of tunable decision tree hyperparameters. We cover only two key
    hyperparameters: `criterion` and `max_depth`. Criteria include `gini` impurity
    and `entropy`. By default, the criterion is `gini`, which gives the probability
    of each label or class. A higher value shows high homogeneity. Listing [8-2](#506148_1_En_8_Chapter.xhtml#PC2)
    finds the optimal hyperparameters.


    ```

    param_griddt = {"criterion":("gini","entropy"),

    "max_depth":[1,3,5,7,9,12]}

    grid_modeldt = GridSearchCV(estimator=dt, param_grid=param_griddt)

    grid_modeldt.fit(x_train,y_train)

    print("Best score: ", grid_modeldt.best_score_, "Best parameters:", grid_modeldt.best_params_)

    Listing 8-2

    Hyperparameter Optimization

    ```


    Best score: 0.7182993469278954 Best parameters: {‘criterion’: ‘entropy’, ‘max_depth’:
    3}


    The previous results indicate that we should use `entropy` as the criterion and
    set 3 as the maximum depth of the tree. See Listing [8-3](#506148_1_En_8_Chapter.xhtml#PC3).


    ```

    dt = DecisionTreeClassifier(criterion= ''entropy'', max_depth= 3)

    dt.fit(x_train,y_train)

    Listing 8-3

    Finalize the Decision Tree Classifier

    ```


    ### Visualize Decision Trees


    Listing [8-4](#506148_1_En_8_Chapter.xhtml#PC4) visualizes the decision tree (see
    Figure [8-2](#506148_1_En_8_Chapter.xhtml#Fig2)).


    ![../images/506148_1_En_8_Chapter/506148_1_En_8_Fig2_HTML.jpg](images/506148_1_En_8_Chapter/506148_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Decision tree


    ```

    plt.figure(figsize=(24,14))

    tree.plot_tree(dt, filled=True)

    plt.show()

    Listing 8-4

    Visualize the Decision Tree

    ```'
