    # 10. 聚类分析


    本章将以结构化形式简要介绍聚类分析的概念。在前几章中，我们充分介绍了监督学习。在监督学习中，我们向模型提供一组正确答案，然后让它预测未见过的数据。现在，让我们稍微转移一下注意力。假设我们有一组包含多个变量的数据，并且没有需要关注的独立变量。在这种情况下，我们不会对某种现象做出任何看似合理的假设。


    本章将介绍无监督学习。我们不会向模型提供一组正确答案；相反，我们允许它做出智能的粗略估计。无监督学习包括降维和聚类分析。在本章中，我们首先让您熟悉一种广泛称为主成分分析（PCA）的降维方法，然后向您介绍聚类分析。之后，我们将开发并评估诸如
    K-means 模型、凝聚模型和 DBSCAN 模型等模型。在对数据进行预处理和建模之前，我们先讨论一下聚类分析。


    ## 什么是聚类分析？


    聚类分析是一种能够可靠地找到具有相似性和差异性的数据点组的方法。在聚类分析中，我们关注的是能够解释数据变异的独特聚类。没有真正的因变量。我们平等地对待所有变量。流行的聚类技术包括：*质心聚类*，它是随机的，将数据点的质心选择到一组指定的聚类中，例如
    K-means；*密度聚类*，它根据密度分布对数据点进行分组，例如 DBSCAN；以及*分布聚类*，它根据某种分布识别数据点属于某个聚类的概率，例如高斯混合模型等。


    ## 聚类分析实践


    表 10-1 显示了此用例的数据。数据中有三个变量。没有实际的独立变量。所有变量同等重要。我们关注的是数据中的相似性和差异性。同样，我们从 Kaggle 获得了示例数据。^(⁹)


