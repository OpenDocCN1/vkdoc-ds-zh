    # Lasso 回归


    `Lasso` 代表“最小绝对收缩和选择算子”（也称为 L1 正则化）。它应用了收缩技术（将数据居中到其中心点，例如将数据居中到均值）。这个过程会产生稀疏模型（参数数量减少的模型）。我们将其用于变量选择和正则化。与岭回归一样，lasso
    回归通过包含惩罚项来提升回归器的预测能力。它们的区别在于惩罚项：lasso 回归使用 L1 来惩罚残差之和，而岭回归使用 L2 惩罚项。它假设随着惩罚项的增加，更多的系数被设置为零，从而导致选择的变量更少。L1
    正则化使用非零系数，并强制系数绝对值之和（将系数设为 0 并增加可解释性）。参见公式 2-3。


