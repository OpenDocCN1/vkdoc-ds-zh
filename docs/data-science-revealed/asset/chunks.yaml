- fmt: '# Survival Table


    We widely recognize the life table as the survival table. A survival table is
    a table that provides information about the activities of the patients while participating
    in a study. Table [11-7](#506148_1_En_11_Chapter.xhtml#Tab7) highlights the contents
    of a survival table.


    Table 11-7


    Contents of a Survival Table


    | Content | Description |

    | --- | --- |

    | **Removed** | The number of subjects who die (or suffer the event of interest)
    during interval *t* |

    | **Observed** | The number of subjects who are event-free and thought of as being
    at risk during interval *t* |

    | **Censored** | The number of participants who leave the study during interval
    *t* |

    | **Entrance** | The number of subjects who entered during interval *t* |

    | **At-risk** | The aggregate number of subjects at risk during interval *t* |


    Listing [11-9](#506148_1_En_11_Chapter.xhtml#PC9) applies the `survival_from_event()`
    method to create a survival table (see Table [11-8](#506148_1_En_11_Chapter.xhtml#Tab8)).


    Table 11-8


    Survival Table


    |   | removed | observed | censored | entrance | at_risk |

    | --- | --- | --- | --- | --- | --- |

    | **event_at** |   |   |   |   |   |

    | **0.0** | 0 | 0 | 0 | 34 | 34 |

    | **6.0** | 1 | 1 | 0 | 0 | 34 |

    | **9.0** | 3 | 3 | 0 | 0 | 33 |

    | **13.0** | 3 | 3 | 0 | 0 | 30 |

    | **15.0** | 2 | 2 | 0 | 0 | 27 |


    ```

    table = survival_table_from_events(T1,E1)

    table.head()

    Listing 11-9

    Survival Table

    ```


    Table [11-8](#506148_1_En_11_Chapter.xhtml#Tab8) tells us the following:


    - In the first year patients entered the study. By default, we consider all patients
    under risk.

    - At year 6, one patient died, and we thought another to be at risk.

    - At year 9, three patients died, and we thought another three to be at risk.

    - At year 13, we reported three deaths and three patients at risk.

    - By year 15, we reported two deaths and two patients at risk. There were 27 patients
    left in the miR-137 group.


    ## The Kaplan-Meier Model


    The Kaplan-Meier (KM) model is a nonparametric method used to estimate the survival
    probability from the observed survival times. It measures a binary variable using
    time. We also recognize the model as a product limit model. When we use the model,
    we look at the number of patients dying in a specified period, considering that
    they have already survived. To understand how this model works, we explain the
    survival function underneath. Listing [11-10](#506148_1_En_11_Chapter.xhtml#PC10)
    completes the Kaplan-Meier models.


    ```

    kmf_miR_137 = KaplanMeierFitter().fit(T1,E1)

    kmf_control_group = KaplanMeierFitter().fit(T2,E2)

    Listing 11-10

    Finalize the Kaplan-Meier Models

    ```


    After developing the models, we find the estimates of the confidence interval.


    ### Confidence Interval


    A confidence interval (CI) represents the probability of a value falling within
    a specific range. Table [11-9](#506148_1_En_11_Chapter.xhtml#Tab9) shows the probability
    of the survival estimates falling in a specific range at a certain period. The
    first column shows the timeline, the second column shows the lower limit of the
    CI, and the third column shows the upper limit of the CI. See Listing [11-11](#506148_1_En_11_Chapter.xhtml#PC11).


    Table 11-9


    Kaplan-Meier Estimate Confidence Interval


    |   | KM_estimate_lower_0.95 | KM_estimate_upper_0.95 |

    | --- | --- | --- |

    | **0.0** | 1.000000 | 1.000000 |

    | **6.0** | 0.809010 | 0.995804 |

    | **9.0** | 0.716269 | 0.954139 |

    | **13.0** | 0.616102 | 0.896087 |

    | **15.0** | 0.552952 | 0.852504 |


    ```

    kmf_miR_137_ci = kmf_miR_137.confidence_interval_

    kmf_control_group_ci = kmf_control_group.confidence_interval_

    kmf_miR_137_ci.head()

    Listing 11-11

    Kaplan-Meier Estimate Confidence Interval

    ```


    Table [11-9](#506148_1_En_11_Chapter.xhtml#Tab9) shows, if we were to reproduce
    the study 95% of the time.


    - At year 0, the survival probability of patients in the miR-137 group is 100%.

    - At year 6, the survival probability of patients in the miR-137 group is between
    80.90% and 99.58%.

    - At year 9, the survival probability of patients in the miR-137 group is between
    71.27% and 95.41%.

    - At year 13, the survival probability of patients in the miR-137 group is between
    61.61% and 89.61%.

    - At year 13, the survival probability of patients in the miR-137 group is between
    55.95% and 85.25%.


    ### Cumulative Density


    Cumulative density represents the probability of failure occurring at a specific
    time *t*. It estimates the cumulative density. We use the formula in Equation
    11-1 to estimate the unconditional failure rate.


    ![$$ \hat{f}=\frac{d_i}{\left\{\frac{d_i}{t_{i+1}-{t}_i}\right\}} $$](images/506148_1_En_11_Chapter/506148_1_En_11_Chapter_TeX_Equ1.png)


    (Equation 11-1)


    Here, *d*[*i*] represents the number of events, and *t* is the survival time.
    See Listing [11-12](#506148_1_En_11_Chapter.xhtml#PC12) and Table [11-10](#506148_1_En_11_Chapter.xhtml#Tab10).


    Table 11-10


    Kaplan-Meier Cumulative Density Estimates


    |   | KM_estimate |

    | --- | --- |

    | **timeline** |   |

    | **0.0** | 0.000000 |

    | **6.0** | 0.029412 |

    | **9.0** | 0.117647 |

    | **13.0** | 0.205882 |

    | **15.0** | 0.264706 |


    ```

    kmf_c_density = kmf_miR_137.cumulative_density_

    kmf_control_group_c_density = kmf_control_group.cumulative_density_

    kmf_c_density.head()

    Listing 11-12

    Kaplan-Meier Cumulative Density Estimates

    ```


    To make sense of the cumulative density estimates, we plot the Kaplan-Meier cumulative
    density curve.


    #### Cumulative Density Curve


    We use a cumulative density curve to understand the median value and the interquartile
    range. When we plot the curve, the cumulative frequency is on the x-axis, and
    the upper-class boundary of each interval is on the y-axis. Listing [11-13](#506148_1_En_11_Chapter.xhtml#PC13)
    and Figure [11-1](#506148_1_En_11_Chapter.xhtml#Fig1) show the Kaplan-Meier cumulative
    density curve. From the curve, we can identify the median quartile and interquartile.


    ![../images/506148_1_En_11_Chapter/506148_1_En_11_Fig1_HTML.jpg](images/506148_1_En_11_Chapter/506148_1_En_11_Fig1_HTML.jpg)


    Figure 11-1


    Kaplan-Meier cumulative density curve


    ```

    kmf_miR_137.plot_cumulative_density(color="navy", label="miR-137")

    kmf_control_group.plot_cumulative_density(color="green", label="control")

    plt.xlabel("Time")

    plt.ylabel("Cumulative Incidence")

    plt.legend(loc=2)

    plt.show()

    Listing 11-13

    Kaplan-Meier Cumulative Density Curve

    ```


    Figure [11-1](#506148_1_En_11_Chapter.xhtml#Fig1) shows the following:


    - At year 0, the unconditional failure rate is 0%.

    - At year 6, the unconditional failure rate is 2.94%.

    - At year 9, the unconditional failure rate is 11.17%.

    - At year 13, the unconditional failure rate is 20.59%.

    - At year 15, the unconditional failure rate is 26.47%.'
