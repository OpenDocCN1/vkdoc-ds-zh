    ## Evaluate the Kaplan-Meier Model


    After estimating the survival probabilities of the two groups, we must find whether
    the death generation of both groups is equal. Unlike other nonparametric models,
    the Kaplan-Meier model does not have sophisticated model evaluation metrics. The
    best way to test the model involves finding out whether groups share a similar
    survival curve. We express the hypothesis as follows:


    * *Null hypothesis:* All groups share the same survival curve.

    * *Alternative hypothesis:* All groups do not share the same survival curve.


    Listing [1-19](#506148_1_En_11_Chapter.xhtml#PC19) returns the log-rank results
    (see Table [11-12](#506148_1_En_11_Chapter.xhtml#Tab12)). Listing [11-20](#506148_1_En_11_Chapter.xhtml#PC20)
    shows the p-value.


    Table 11-12


    Log-Rank Test Results


    | t_0 | -1 |

    | --- | --- |

    | **null_distribution** | chi squared |

    | **degrees_of_freedom** | 1 |

    | **test_name** | logrank_test |

    |   | **test_statistic** | p |

    | **0** | **122.25** | <0.005 |


    ```

    from lifelines.statistics import logrank_test

    results = logrank_test(T1, T2, event_observed_A=E1, event_observed_B=E2)

    results.print_summary()

    Listing 1-19

    Log-Rank Test Results

    ```


    ```

    print(results.p_value)

    2.0359832222855426e-28

    Listing 11-20

    P-Value

    ```


    The previous findings show that the p-value is greater than 0.05. We reject the
    null hypothesis in favor of the alternative hypothesis. All groups do not share
    the same survival curve.


    ## Conclusion


    This chapter covered the most popular nonparametric survival analysis model known
    as the Kaplan-Meier model. We estimated the survival probabilities of a patient
    surviving an event beyond a specific time. Before developing the model, we split
    the data into two groups, and we then created a survival table for the group under
    investigation. We plotted the cumulative density curve and survival curve to make
    sense of the estimates. Thereafter, we tested whether the two groups share the
    same survival curve using the log-rank test. After studying the test statistic,
    we found the model is reliable, and we can use it to predict future instances
    of event outcomes.


