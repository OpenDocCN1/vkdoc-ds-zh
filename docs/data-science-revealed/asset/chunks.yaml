- fmt: '# K-Means Hyperparameter Optimization


    At most, we do not want to fit a model with initial hyperparameters, unless it
    yields optimal performance. With each use case, we must find the best hyperparameters
    (provided a model has tunable hyperparameters). Table [10-6](#506148_1_En_10_Chapter.xhtml#Tab6)
    outlines key tunable K-means hyperparameters.


    **Table 10-6** Tunable Hyperparameters


    | Parameter | Description |

    | --- | --- |

    | `copy_X` | Finds whether the independent variable must be copied. |

    | `tol` | Finds the precision. The default value is 0.003. |

    | `max_iter` | Finds the maximum number of iterations. |

    | `tol` | Finds the tolerance for the optimization |


    Listing [10-12](#506148_1_En_10_Chapter.xhtml#PC12) finds the optimal hyperparameters
    for the K-means model.


    ```

    param_gridkmeans = {"copy_x":[False,True],

    "max_iter":[1,10,100,1000],

    "n_init":[5,10,15,20],

    "tol":[0.0001,0.001,0.01,1.0]}

    grid_modelkmeans = GridSearchCV(estimator=kmeans_output, param_grid=param_gridkmeans)

    grid_modelkmeans.fit(df)

    print("Best score: ", grid_modelkmeans.best_score_, "Best hyper-parameters: ",
    grid_modelkmeans.best_params_)

    ```


    **Listing 10-12** Hyperparameter Optimization


    Best score: -49470.220198874384 Best hyper-parameters: `{''copy_x'': False, ''max_iter'':
    1, ''n_init'': 15, ''tol'': 0.01}`


    Listing [10-13](#506148_1_En_10_Chapter.xhtml#PC13) concludes the K-means model
    with optimal hyperparameters.


    ```

    kmeans = KMeans(n_clusters=3,

    copy_x=False,

    max_iter= 1, n_init= 15,

    tol= 0.01)

    kmeans_output = kmeans.fit(df)

    kmeans_output

    ```


    **Listing 10-13** Finalize the K-Means Model


    Listing [10-14](#506148_1_En_10_Chapter.xhtml#PC14) tabulates predicted labels
    (Table [10-7](#506148_1_En_10_Chapter.xhtml#Tab7)).


