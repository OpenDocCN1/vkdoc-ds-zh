    #### Classification Report


    Listing [7-6](#506148_1_En_7_Chapter.xhtml#PC6) and Table [7-4](#506148_1_En_7_Chapter.xhtml#Tab4)
    show how reliable the `LinearSVC` classifier is. It provides the model’s accuracy
    score, precision score, recall, and other key evaluation metrics.


    Table 7-4


    Classification Report


    |   | precision | recall | f1-score | support |

    | --- | --- | --- | --- | --- |

    | **0** | 0.844828 | 0.915888 | 0.878924 | 107.000000 |

