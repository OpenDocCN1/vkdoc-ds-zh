    # 引言


    欢迎阅读《数据科学揭秘》。本书是您使用数据科学流程解决实际问题的指南。它深入介绍了数据科学技术，例如数据工程与可视化、统计建模、机器学习和深度学习。书中包含丰富的示例，涵盖如何选择变量、优化超参数、开发流水线，以及训练、测试和验证机器与深度学习模型。每章都提供一系列示例，帮助您理解每个模型背后的概念、假设和流程。


    首先，本书揭示了参数化方法或线性模型，以及使用正则化技术（如套索和岭回归）来应对欠拟合或过拟合的方法。接着，通过介绍时间序列平滑、分解和预测，总结了复杂回归。然后，以全新的视角审视了用于二元分类的非参数模型——逻辑回归，以及集成方法，如决策树、支持向量机和朴素贝叶斯。接下来，介绍了最流行的用于时间事件数据的非参数方法——卡普兰-迈耶估计量。本书还涵盖了使用人工神经网络（如受限玻尔兹曼机、多层感知器和深度信念网络）解决分类问题的方法。随后，通过揭示聚类技术（如
    K 均值、凝聚聚类和 DBSCAN）以及降维技术（如特征重要性、主成分分析和线性判别分析），总结了无监督学习。此外，还介绍了使用 H2O 的无人驾驶人工智能。


    本书使用 Anaconda（Python 编程的开源发行版）来准备示例。以下是本书涵盖的部分库：


    *   `Pandas`：用于数据结构和工具

    *   `Statsmodels`：用于基本统计计算和建模

    *   `SciKit-Learn`：用于构建和验证关键机器学习算法

    *   `Prophet`：用于时间序列分析

    *   `Keras`：用于深度学习的高级框架

    *   `H2O`：用于无人驾驶机器学习

    *   `Lifelines`：用于生存分析

    *   `NumPy`：用于数组和矩阵

    *   `SciPy`：用于积分、求解微分方程和优化

    *   `Matplotlib` 和 `Seaborn`：用于常用图表和图形


    本书面向希望学习完整数据科学流程的初级到中级数据科学家和机器学习工程师。在阅读本书内容之前，请确保您了解统计学、Python 编程和概率论的基础知识。此外，您还需要在您的环境中安装前面列表中提到的软件包。


    # 致谢


    这是我的第一本书，因此对我意义重大。撰写一本独著书籍颇具挑战，但我得到了家人和挚友的坚定支持和积极鼓励。衷心感谢来自金山大学的 Chris William
    Callaghan 教授和 Renette Krommenhoek 女士。他们慷慨地帮助激发了我对使用高级分析解决实际问题的浓厚兴趣。没有 Apress 出版社敬业团队（包括
    Aditee Mirashi 和 Celestin Suresh John）的宝贵帮助，我无法完成本书。他们信任我，并在整个写作和编辑过程中引导我。最后，衷心感谢所有阅读本书的读者；我真诚地希望本书对您有所帮助。


    # 关于作者 关于技术审校者

