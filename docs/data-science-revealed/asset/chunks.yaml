- fmt: '### Logistic Hyperparameter Optimization


    After reviewing the contents of the preceding chapters, you might have noticed
    that hyperparameters play a significant role in model performance. Before finalizing
    machine learning models, ensure that a model has optimal hyperparameters. Listing
    [5-15](#506148_1_En_5_Chapter.xhtml#PC15) returns optimal hyperparameters.


    ```

    from sklearn.model_selection import GridSearchCV

    param_grid = {"dual":[False,True],

    "fit_intercept":[False,True],

    "max_iter":[1,10,100,1000],

    "penalty":("l1","l2"),

    "tol":[0.0001,0.001,0.01,1.0],

    "warm_start":[False,True]}

    grid_model = GridSearchCV(estimator=logreg, param_grid=param_grid)

    grid_model.fit(x_train,y_train)

    print("Best score: ", grid_model.best_score_, "Best parameters: ", grid_model.best_params_)

    Listing 5-15

    Hyperparameter Optimization

    ```


    Best score: `0.7960609991158407` Best parameters: `{''dual'': False, ''fit_intercept'':
    True, ''max_iter'': 100, ''penalty'': ''l2'', ''tol'': 0.0001, ''warm_start'':
    False}`


    Listing [5-16](#506148_1_En_5_Chapter.xhtml#PC16) completes the model.


    ```

    logreg = LogisticRegression(dual= False,

    fit_intercept= True,

    max_iter= 10,

    n_jobs= -5,

    penalty= ''l2'',

    tol=0.0001,

    warm_start= False)

    logreg.fit(x_train,y_train)

    Listing 5-16

    Finalize the Logistic Classifier

