- fmt: '# Understand Trends, Seasonality, and Irregular Components


    It is challenging to separate a trend from a cycle. The easiest way to make sense
    of time-series data is by breaking down data into different components. Seasonal
    decomposition involves breaking down a series into three components, namely, trend,
    cycles, seasonality, and irregular components. We commonly use an additive model,
    expressed as shown in Equation 3-1.


    `Y(t) = T(t)+C(t)+S(t) x I(t)` (Equation 3-1)


    Here, `T(t)` represents the trend value at period `t`, `S(t)` represents a seasonal
    value at period `t`, `C(t)` represents a cyclical value at time `t`, and `I(t)`
    represents an irregular (random) value at period `t`. Seasonal decomposition requires
    positive values. When there are zeros in a series, add 0.5 or 1 to the entire
    series. Listing [3-7](#506148_1_En_3_Chapter.xhtml#PC7) decomposes the series
    (see Figure [3-6](#506148_1_En_3_Chapter.xhtml#Fig6)).


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig6_HTML.jpg](images/506148_1_En_3_Chapter/506148_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Seasonal components


    ```

    decompose = seasonal_decompose(df["Close"].interpolate(),freq=30)

    decompose.plot()

    plt.show()

    Listing 3-7

    Seasonal Decomposition

    ```


    # Smoothing a Time Series Using Moving Average and Exponential Techniques


    The most straightforward way to analyze a series involves using smoothing techniques.
    There are two primary smoothing techniques, namely, moving average smoothing and
    exponential smoothing.


    ## Original Time Series


    Listing [3-8](#506148_1_En_3_Chapter.xhtml#PC8) graphically represents the movement
    of a variable over time. Figure [3-7](#506148_1_En_3_Chapter.xhtml#Fig7) has two
    axes: x-axis (horizontal) and y-axis (vertical), graphically denoted as `(x,y)`.
    Time (an independent variable) is on the x-axis, and the dependent variable is
    on the y-axis.


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig7_HTML.jpg](images/506148_1_En_3_Chapter/506148_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    Original time series


    ```

    Original = new_df["Close"]

    fig, ax = plt.subplots()

    Original.plot(kind="line", color="navy")

    plt.xlabel("Time")

    plt.ylabel("Close")

    plt.xticks(rotation=45)

    plt.show()

    Listing 3-8

    Time Series

    ```


    ### The Moving Averages Smoothing Technique


    `MA` applies the means of weight average of preceding and recent data points.
    It is useful when there is no seasonality in a series, but we want to forecast
    future instances. Weighting depends on the stability of a series. If a series
    is stable, then recent data points weigh high and preceding data points weigh
    low. In contrast, if the series is not stable, then we weigh recent data points
    that weigh lower and preceding data points higher. Listing [3-9](#506148_1_En_3_Chapter.xhtml#PC9)
    returns 90 days of moving averages (see Figure [3-8](#506148_1_En_3_Chapter.xhtml#Fig8)).


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig8_HTML.jpg](images/506148_1_En_3_Chapter/506148_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    Time series (90 days of moving averages)


    ```

    MA90 = df["Close"].rolling(window=90).mean()

    df.plot(kind="line",color="navy")

    MA90.plot(kind="line",color="black",label="Rolling MA 90 days")

    plt.xlabel("Date")

    plt.xticks(rotation=45)

    plt.ylabel("Price")

    plt.legend()

    plt.show()

    Listing 3-9

    Time Series (90 Days of Moving Averages)

    ```


    Figure [3-8](#506148_1_En_3_Chapter.xhtml#Fig8) does not consider seasonality.
    The close price is mostly above the moving average. However, it struggles to keep
    at abreast with the trend.


    ### The Exponential Smoothing Technique


    An alternative to the `MA` method is exponential smoothing. It weights values
    outside the window to zero. Using this method, large weighted values rapidly die
    out, and small weighted values slowly die out. Listing [3-10](#506148_1_En_3_Chapter.xhtml#PC10)
    specifies the half life (the time lag at which the exponential weights decay by
    one-half) as 30 (see Figure [3-9](#506148_1_En_3_Chapter.xhtml#Fig9)).


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig9_HTML.jpg](images/506148_1_En_3_Chapter/506148_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Time series (exponential)


    ```

    Exp = df["Close"].ewm(halflife=30).mean()

    fig, ax = plt.subplots()

    Original.plot(kind="line", color="navy")

    Exp.plot(kind="line", color="gray", label="Half Life")

    plt.xlabel("Time")

    plt.ylabel("Close")

    plt.xticks(rotation=45)

    plt.legend()

    plt.show

    Listing 3-10

    Time Series (Exponential)

    ```


    Smoothing methods do not produce confidence intervals for forecasts or tests for
    whether the model is reasonable.


    # Running Minimum and Maximum Value


    Running min is the lowest value in a series as it progresses, and running max
    is the highest value in a series as it progresses. Extreme values of a series
    tell us much about boundaries in a series. Listing [3-11](#506148_1_En_3_Chapter.xhtml#PC11)
    estimates the running min and max using the `expanding()` method (see Figure [3-10](#506148_1_En_3_Chapter.xhtml#Fig10)).


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig10_HTML.jpg](images/506148_1_En_3_Chapter/506148_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Running the minimum and maximum value of price


    ```

    expanding_df = df

    expanding_df["running_min"] = expanding_df["Close"].expanding().min()

    expanding_df["running_max"] = expanding_df["Close"].expanding().max()

    fig, ax = plt.subplots()

    Original.plot(kind="line", color="navy")

    expanding_df["running_min"].plot(kind="line", color="red")

    expanding_df["running_max"].plot(kind="line", color="red")

    plt.xlabel("Date")

    plt.ylabel("Close")

    plt.legend()

    plt.xticks(rotation=45)

    plt.show()

    Listing 3-11

    Running Minimum and Maximum Values

    ```


    Figure [3-10](#506148_1_En_3_Chapter.xhtml#Fig10) shows that the USD/ZAR closing
    price dropped to a low of 13.8531 on July 24, 2019. Thereafter, it approached
    a psychological level. In the last quarter of 2019, the South African rand moderately
    steadied against the US dollar. However, those gains quickly wiped out at the
    beginning of the year. The US dollar edged higher, reaching a new high of 19.2486
    on April 6, 2020.


    ## Find the Rate of Return and Rolling Rate of Return


    Returns refer to profit on an investment. It shows the change in the value of
    an investment. Listing [3-12](#506148_1_En_3_Chapter.xhtml#PC12) shows the delete
    expansion.


    ```

    del df_expanding["Running_min"]

    del df_expanding["Running_max"]

    Listing 3-12

    Delete Expansion

    ```


    Listing [3-13](#506148_1_En_3_Chapter.xhtml#PC13) and Figure [3-11](#506148_1_En_3_Chapter.xhtml#Fig11)
    show the rate of return of the portfolio.


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig11_HTML.jpg](images/506148_1_En_3_Chapter/506148_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Rate of return


    ```

    pr = df.pct_change()

    pr_plus_one = pr.add(1)

    cumulative_return = pr_plus_one.cumprod().sub(1)

    fig, ax = plt.subplots()

    cumulative_return.mul(100).plot(ax=ax, color="navy")

    plt.xlabel("Date")

    plt.ylabel("Return (%)")

    plt.xticks(rotation=45)

    plt.show()

    Listing 3-13

    Rate of Return

    ```


    ### Find the Rolling Rate of Return


    The rolling rate of return shows the rolling window rate of return. It communicates
    the stability of the rate of return. Listing [3-14](#506148_1_En_3_Chapter.xhtml#PC14)
    finds a linear combination of the previous mean returns, and Listing [3-15](#506148_1_En_3_Chapter.xhtml#PC15)
    plots 90 days of the rolling rate of return (see Figure [3-12](#506148_1_En_3_Chapter.xhtml#Fig12)).


    ![../images/506148_1_En_3_Chapter/506148_1_En_3_Fig12_HTML.jpg](images/506148_1_En_3_Chapter/506148_1_En_3_Fig12_HTML.jpg)


    Figure 3-12


    Rolling rate of return


    ```

    rolling_90_days_rate_of_return = df["Close"].rolling(window=90).apply(get_period_return)

    fig, ax = plt.subplots()

    rolling_90_days_rate_of_return.plot(color="navy")

    plt.xlabel("Date")

    plt.ylabel("Return (%)")

    plt.xticks(rotation=45)

    plt.show()

    Listing 3-15

    Rolling Rate of Return

    ```


    ```

    def get_period_return(period_return):

    return np.prod(period_return + 1) – 1

    Listing 3-14

    Rolling Rate of Return Function

    ```'
