    # Introduction


    Welcome to *Data Science Revealed*. This book is your guide to solving practical
    and real-world problems using data science procedures. It gives insight into data
    science techniques, such as data engineering and visualization, statistical modeling,
    machine learning, and deep learning. It has a rich set of examples on how to select
    variables, optimize hyperparameters, develop pipelines, and train, test and validate
    machine and deep learning models. Each chapter contains a set of examples allowing
    you to understand the concepts, assumptions, and procedures behind each model.


    First, it conceals the parametric method or linear model and the means for combating
    underfitting or overfitting using regularization techniques such as lasso and
    ridge. Next, it concludes complex regression by presenting time-series smoothening,
    decomposition, and forecasting. Then, it takes a fresh look at a nonparametric
    model for binary classification, known as logistic regression, and ensemble methods
    such as decision tree, support vector machine, and naïve Bayes. Next, it covers
    the most popular nonparametric method for time-event data, recognized as the Kaplan-Meier
    estimator. It also covers ways of solving a classification problem using artificial
    neural networks, like the restricted Boltzmann machine, multilayer perceptron,
    and deep belief network. Then, it summarizes unsupervised learning by uncovering
    clustering techniques, such as K-means, agglomerative and DBSCAN, and dimension
    reduction techniques such as feature importance, principal component analysis,
    and linear discriminant analysis. In addition, it introduces driverless artificial
    intelligence using H2O.


    It uses Anaconda (an open source distribution of Python programming) to prepare
    the examples. The following are some of the libraries covered in this book:


    *   `Pandas` for data structures and tools

    *   `Statsmodels` for basic statistical computation and modeling

    *   `SciKit-Learn` for building and validating key machine learning algorithms

    *   `Prophet` for time-series analysis

    *   `Keras` for high-level frameworks for deep learning

    *   `H2O` for driverless machine learning

    *   `Lifelines` for survival analysis

    *   `NumPy` for arrays and matrices

    *   `SciPy` for integrals, solving differential equations and optimization

    *   `Matplotlib` and `Seaborn` for popular plots and graphs


    This book targets beginner to intermediate data scientists and machine learning
    engineers who want to learn the full data science process. Before exploring the
    contents of this book, ensure that you understand the basics of statistics, Python
    programming, and probability theories. Also, you’ll need to install the packages
    mentioned in the previous list in your environment.


    # Acknowledgments


    This is my first book, which makes it significant to me. Writing a single-authored
    book is demanding, but I received firm support and active encouragement from my
    family and dear friends. Many heartfelt thanks to Professor Chris William Callaghan
    and Mrs. Renette Krommenhoek from the University of the Witwatersrand. They gallantly
    helped spark my considerable interest in combating practical and real-world problems
    using advanced analytics. I would not have completed this book without the valuable
    help of the dedicated publishing team at Apress, which compromises Aditee Mirashi
    and Celestin Suresh John. They trusted and ushered me throughout the writing and
    editing process. Last, humble thanks to all of you reading this; I earnestly hope
    you find it helpful.


