    | **113** | 0 | 0 |

    | **14** | 1 | 1 |

    | **529** | 0 | 0 |

    | **...** | ... | ... |

    | **476** | 1 | 0 |

    | **482** | 0 | 0 |

    | **230** | 1 | 1 |

    | **527** | 0 | 0 |

    | **380** | 0 | 0 |


    ```

    y_predlsvc = lsvc.predict(x_test)

    pd.DataFrame({"Actual":y_test,"Predicted":y_predlsvc})

    清单 7-4

    实际值与预测值

    ```


    #### 混淆矩阵


    清单 7-5 和表 7-3 为我们提供了关于分类器性能的抽象报告。


    表 7-3


    混淆矩阵


    |   | 预测：否 | 预测：是 |

    | --- | --- | --- |

    | **实际：否** | 98 | 9 |

    | **实际：是** | 18 | 29 |


