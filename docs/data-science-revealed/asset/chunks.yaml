    ## Centroids


    The central tendency of the data indicates much about the data. We must find the
    centers of clusters also recognized as centroids. Listing [10-15](#506148_1_En_10_Chapter.xhtml#PC15)
    applies `cluster_centers_` to find centroids (see Table [10-8](#506148_1_En_10_Chapter.xhtml#Tab8)).


    **Table 10-8** Centroids


    |   | Cluster 1 | Cluster 2 | Cluster 3 |

    | --- | --- | --- | --- |

    | **0** | -8.879001 | -11.467679 | 0.891796 |

    | **1** | -10.435900 | 42.928296 | -5.127039 |

    | **2** | 43.326081 | 2.774284 | 1.470721 |


    ```

