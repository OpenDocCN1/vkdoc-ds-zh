    ## Conclusion


    This chapter covers the time-series analysis. We trained a SARIMAX model with
    a (1, 1, 1) order and a (1, 1, 1, 12) seasonal order. It forecasts an upward trend;
    however, it is unreliable because of influential data points in the series. The
    model commits significant mistakes when it forecasts the series. The subsequent
    chapter introduces the additive model.


    # 4. High-Quality Time-Series Analysis


    The preceding chapter covered seasonal ARIMA. After all the considerable effort
    in data preprocessing and hyperparameter optimization, the model generates considerable
    errors when forecasting future instances of the series. For a fast and automated
    forecasting procedure, use Facebook’s Prophet; it forecasts time-series data based
    on nonlinear trends with seasonality and holiday effects. This chapter introduces
    Prophet and presents a way of developing and testing an additive model. First,
    it discusses the crucial difference between the Statsmodels package and the Prophet
    package.


    ## The Difference Between Statsmodels and Prophet


    Time-series analysis typically requires missing values and outliers diagnosis
    and treatment, multiple test statistics to verify key assumptions, hyperparameter
    optimization, and seasonal effects control. If we commit a slight mistake in the
    workflow, then the model will make significant mistakes when forecasting future
    instances. Consequently, building a model using Statsmodels reasonably requires
    a certain level of mastery.


    Fondly remember that machine learning is about inducing a computer with intelligence
    using minimal code. Statsmodels does not offer us that. Prophet fills that gap.
    It was developed by Facebook’s Core Data Science team. It performs tasks such
    as missing value and outlier detection, hyperparameter optimization, and control
    of seasonality and holiday effects. To install FB Prophet in the Python environment,
    use `pip install fbprophet`. To install it in the Conda environment, use `conda
    install -c conda-forge fbprophet`.


    ## Understand Prophet Components


    In the previous chapter, we painstakingly built a time-series model with three
    components, namely, trend, seasonality, and irregular components.'
