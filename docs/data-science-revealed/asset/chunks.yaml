    `MA` 方法的一种替代方案是指数平滑。它将窗口外的值权重设为零。使用此方法，大权重值会迅速衰减，小权重值则缓慢衰减。清单 3-10 将半衰期（指数权重衰减一半的时间滞后）指定为
