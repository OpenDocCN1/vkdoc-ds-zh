    # 5. Logistic Regression Analysis


    This chapter covers the logistic regression concept and implementation in a structured
    way. Preceding chapters introduced supervised learning and concentrated on the
    parametric method. In supervised learning, we present a model with a set of correct
    answers, and we then allow a model to predict unseen data. We use the parametric
    method to solve regression problems (when a dependent variable is a continuous
    variable).


    This chapter introduces a supervised learning method recognized as the nonparametric
    method (or the classification method). Unlike the linear regression method, it
    has flexible assumptions about the structure of the data. It does not have linearity
    and normality assumptions. There are two intact families of the classification
    method. They are binary classification, which is used when a dependent variable
    has two outcomes (i.e., yes/no, pass/fail), and multiclass classification, which
    is used when a dependent variable has more than two outcomes (negative/neutral/positive).


    ## What Is Logistic Regression?


    Logistic regression is a model that estimates the extent to which an independent
    variable influences a dependent variable. An independent variable is a continuous
    variable or categorical, and the dependent variable is invariably a categorical
    variable with only two outcomes. Although logistic regression is called *regression*,
    it is not a regression model but a classification model. Like with linear regression,
    we use the model to find an intercept and slope.


    ## Logistic Regression Assumptions


    The classification method does not contain strict assumptions about the structure
    of the data. It assumes that a dependent variable is a categorical variable and
    there are more than 50 data points in the data. Ideally, we require a large sample.


    ## Logistic Regression in Practice


    We obtained the example data from Kaggle.^([⁴](#fn4)) Table [5-1](#506148_1_En_5_Chapter.xhtml#Tab1)
    shows the first rows of the data.


    Table 5-1


    Dataset


    |   | Pregnancies | Glucose | BloodPressure | SkinThickness | Insulin | BMI |
    DiabetesPedigreeFunction | Age | Outcome |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | **0** | 6 | 148 | 72 | 35 | 0 | 33.6 | 0.627 | 50 | 1 |

    | **1** | 1 | 85 | 66 | 29 | 0 | 26.6 | 0.351 | 31 | 0 |

    | **2** | 8 | 183 | 64 | 0 | 0 | 23.3 | 0.672 | 32 | 1 |

    | **3** | 1 | 89 | 66 | 23 | 94 | 28.1 | 0.167 | 21 | 0 |

    | **4** | 0 | 137 | 40 | 35 | 168 | 43.1 | 2.288 | 33 | 1 |


    ## Sigmoid Function


    Logistic regression uses the sigmoid function to transform an output in such a
    way that it promptly returns a probabilistic value that is assigned to two categorical
    classes. The standard formula of is an S-shape or sigmoid shape. Figure [5-1](#506148_1_En_5_Chapter.xhtml#Fig1)
    shows a standard logistic function.


    ![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig1_HTML.jpg](images/506148_1_En_5_Chapter/506148_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Sigmoid function


    Equation 5-1 expresses the sigmoid function.


    ![$$ S(x)=\frac{L}{1-{e}^{-x}}=\frac{e^x}{e^x+1} $$](images/506148_1_En_5_Chapter/506148_1_En_5_Chapter_TeX_Equ1.png)


    (Equation 5-1)


    The standard sigmoid function takes any input and outputs a value between 0 and
    1.'
