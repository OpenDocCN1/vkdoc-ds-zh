  \n##### 混淆矩阵\n\n当分类器进行预测时，它容易出错。在处理二分类问题时，存在两种类型的错误，即第一类错误（假阳性）和第二类错误（假阴性）。\n\n\
  - *假阳性（FP）*：错误地预测事件发生。例如，预测患者患有糖尿病，而实际上患者并未患病。\n- *假阴性（FN）*：错误地预测事件未发生。例如，预测患者未患糖尿病，而实际上患者患有糖尿病。\n\
  \n尽管分类器容易出错，但它确实能做出一些正确的预测。\n\n- *真阳性（TP）*：正确地预测事件发生。例如，正确预测患者患有糖尿病。\n- *真阴性（TN）*：正确地预测事件未发生。例如，正确预测患者未患糖尿病。\n\
  \n混淆矩阵包含了实际类别与预测类别的四种组合。混淆矩阵的形式如表 5-6、清单 5-20 和表 5-7 所示。\n\n表 5-7\n\n混淆矩阵\n\n| \
