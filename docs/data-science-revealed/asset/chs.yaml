  ### 检测正态性\n\n回归模型假设数据服从正态分布（数据点围绕真实均值对称分布）。若数据不服从正态分布，需进行数据变换以降低其偏度。负偏态数据需采用幂变换或指数变换，而正偏态数据则需采用对数变换或平方根变换。具有不同均值和方差的标准正态分布在数学上可用分布函数表示。\n\
  \n![$$ N\\left(0,1\\right) $$](img/506148_1_En_1_Chapter_TeX_Equ5.png)\n\n（公式 1-5）\n\
