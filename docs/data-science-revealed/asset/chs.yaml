  \n\n\n### 协方差方法\n\n协方差是两个变量之间的联合变异性（它估计两个变量如何一起变化）。公式 1-7 表达了协方差方法。\n\n![$$ {S}_{xy}=\\\
  frac{\\sum \\left({x}_i-\\underset{\\_}{x}\\right)\\left({y}_i-\\underset{\\_}{y}\\\
  right)\\ }{n-1} $$](img/506148_1_En_1_Chapter_TeX_Equ7.png)\n\n（公式 1-7）\n\n这里，`n`\
