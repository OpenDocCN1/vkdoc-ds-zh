  \n### 检测异常值\n\n异常值是指过小或过大的数据点。它可能通过增大误差率来影响模型。若数据中存在异常值，应将其移除，或用均值或中位数替换。\n\n\n\n\
  ### 箱线图\n\n检测异常值最简单的方法是使用箱线图。箱线图简洁地总结了数据独特形状和离散程度的信息。它具有以下属性：一个代表数据中间值的箱子，一条代表 50%数据点所在位置的中位数线，以及代表四分位数的直线，其中\
  \ 25%的数据点位于直线上方，75%的数据点位于直线下方。而`Q3`代表 75%的数据在其上方、25%的数据在其下方的点。这条直线和其他直线代表须线，它将`Q1`或`Q3`与除异常值外最远的数据点连接起来。\n\
