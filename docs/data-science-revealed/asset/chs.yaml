- '# 7. 使用支持向量寻找超平面


  前一章介绍了一种名为线性判别分析（LDA）的线性分类模型，当协方差矩阵相等时，该模型能均等地分布各组。尽管该分类器是最优的线性分类模型之一，但它也有其局限性。首先，我们无法使用分类变量来估计因变量。其次，我们是在严格的正态性假设下训练和测试模型的。本章将介绍另一种线性分类模型，称为支持向量机（SVM）。它属于集成家族；它可以估计连续变量或分类变量。它应用核函数来转换数据，使得超平面能够最佳地拟合数据。与
  LDA 不同，SVM 不对数据的底层结构做任何假设。


  ## 支持向量机


  SVM 通常假设数据点在低维空间中线性不可分，而在高维空间中线性可分。它找到一个最优超平面，以充分利用间隔并简化非线性问题。首先，它有效地捕获数据并开发一个新的维度向量空间。然后，它将新向量空间的线性边界划分为两个类别。它将数据点定位在超平面的上方或下方，从而进行分类。它使用核函数来估计具有极大间隔的超平面。主要的核函数有线性函数、多项式函数和
  Sigmoid 函数。除非你在分析高维数据，否则完全没有必要深入研究这些函数。你总是可以使用超参数优化来找到最优函数。


  ### 支持向量


  支持向量是紧邻超平面的数据点。它们决定了超平面的位置。此外，当我们移除这些数据点时，超平面的位置会发生变化。


  ### 超平面


  超平面是一条将数据分成两个类别的线（每个类别落在其中一侧）。它充当两侧之间的边界。在使用真实世界数据时，定位一个最优超平面是具有挑战性的。SVM 通过一个称为*核技巧*的过程将数据转换到更高维度。转换数据后，它不再是一条直线，而是一个平面。它应用核函数来转换数据，从而将超平面定位在合适的位置。图
  7-1 描绘了一个超平面。


  ![../images/506148_1_En_7_Chapter/506148_1_En_7_Fig1_HTML.png](img/506148_1_En_7_Fig1_HTML.png)


  **图 7-1** 超平面


  图 7-1 显示了公式 7-1 中表达的直线方程。


  ![$$ WT\ x+b=0 $$](img/506148_1_En_7_Chapter_TeX_Equ1.png)


  **（公式 7-1）**


  这里，`W` 代表直线的斜率，`x` 代表输入向量，`b` 代表偏置。两条线（以橙色高亮显示）穿过支持向量并支撑最佳平面。一个理想的超平面对于支持向量具有极大的间隔。


  它通过在训练期间使用一种扩大分离的优化过程来确定如何定位超平面。我们不会手动添加超平面。它应用一种被称为核技巧的技术来转换数据。该技术使其能够用更少的计算能力来扩大维度向量空间。




  ### 支持向量分类器


  支持向量分类器（SVC），也称为*间隔分类器*，允许某些数据点位于超平面的错误一侧。如果数据无法直接区分，它会引入松弛变量，允许某些数据点落在间隔内部，从而违反约束条件；此外，它还会对这些点进行惩罚。它将松弛变量限制为非负值。如果松弛变量大于
  0，它会通过选择 lambda 值，将平面放置在数据点附近而非间隔处，从而搁置约束条件。图 7-2 展示了 SVC 的工作原理。


  ![../images/506148_1_En_7_Chapter/506148_1_En_7_Fig2_HTML.png](img/506148_1_En_7_Fig2_HTML.png)


  图 7-2


  LinearSVC 工作流程


  `LinearSVC` 分类器执行三个基本任务。


  - *转换*：将输入空间转换为更高维的向量空间

  - *线性分离或直线划分*：实现具有最大间隔的超平面

  - *分类*：将数据点分配到某个类别


