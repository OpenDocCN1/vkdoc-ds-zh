  ## 正则化


  在第二章中，我们介绍了偏差-方差权衡的概念。你可以回顾一下那一章。我们通过使用 dropout 方法或添加惩罚项来对深度信念网络进行正则化。


  ### Dropout


  我们使用 dropout 方法在训练过程中移除每一层的神经元，以减少过拟合。网络会估算在某一层丢弃一个神经元的概率。丢弃率表示在某一层中被丢弃的变量所占的比例。代码清单
  12-15 构建了第二个深度信念网络，并以 0.2 的比率丢弃层中的神经元。


  ```

  def create_dnn_model2(optimizer="adam"):

  model2 = Sequential()

  model2.add(Dense(8, input_dim=8, activation="sigmoid"))

  model2.add(Dense(8, activation="relu"))

  model2.add(Dropout(0.2))

  model2.add(Dense(1, activation="relu"))

  model2.compile(loss="binary_crossentropy", optimizer=optimizer, metrics=["accuracy"])

  return model2

  代码清单 12-15

  构建模型 2 的架构

  ```


  代码清单 12-16 封装了分类器。


