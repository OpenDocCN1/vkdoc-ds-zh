  我们将族类型指定为“binomial”，因为我们正在解决一个二分类问题。如果我们要解决一个多分类问题，那么我们会将族类型指定为“multinomial”。


  #### 模型评估


  在本书中，我们依赖混淆矩阵、分类报告、ROC 曲线、精确率-召回率曲线和学习曲线来总结二分类器的性能。与 H2O 包相比，SciKit-Learn 包提供的矩阵较少。下面，我们将充分讨论
  H2O 包中可用的分类评估指标，然后向您展示如何估算它们。我们从基尼指数开始。


  ##### 基尼指数


  H2O 包使我们能够获取基尼指数值，该值衡量数值中存在的不平等程度。我们使用该指数来正确判断分类器的质量。该指数的取值范围从 0 到 1。其中，0 表示分类器具有完全平等性，1
  表示分类器具有完全不平等性。当我们开发分类器时，通常期望找到更接近 1 的基尼指数值。清单 13-7 返回基尼指数的估计值。


  ```

  glm.gini(train=True, valid=True, xval=False)

  {''train'': 0.6828073360331426, ''valid'': 0.548148148148148}

  清单 13-7

  基尼指数

  ```


  训练数据的基尼指数值为 0.68，验证数据的值为 0.55。这两个数据集都处于平等与不平等的边界线上。我们没有达到预期的完全不平等。然而，这些值并没有小到足以影响关于分类器的结论。


  ##### 绝对马修斯相关系数


  H2O 包中另一个可用的分类模型评估指标是绝对马修斯相关系数 (MCC)。我们用它来确定实际类别与分类器预测类别之间相关性的性质。MCC 的取值范围从 -1 到
  1。其中，-1 表示分类器在预测类别时犯了很多错误，0 表示分类器难以猜测类别，1 表示分类器在区分类别方面不熟练。清单 13-8 返回绝对 MCC 的估计值。


  ```

  glm.mcc(train=True, valid=True, xval=False)

  {''train'': [[0.3356601829569534, 0.5297584436640914]],

  ''valid'': [[0.3790626186045188, 0.39336862882432994]]}

  清单 13-8

  绝对 MCC

  ```


  上述发现表明，实际类别与分类器预测的类别之间存在微弱的正相关。


