  ## 结论


  本章介绍了一个名为 `H2O` 的无人驾驶开源软件包。我们开发并测试了一个逻辑分类器和 `AutoML` 模型。你可能已经注意到这个软件包是多么直观和功能丰富。它不需要使用者具备广泛的技术技能和经验。该软件包的易用性使得组织能够加速采用实用的人工智能解决方案。我们预计在可预见的未来会出现更多无人驾驶开源软件包。


  至此，我们来到了本书的最后一章；我们相信你已经对数据科学的世界有了足够的洞察。现在，请运用所学知识来解决复杂问题。始终紧跟最新的研究和技术。切勿陷入部署不可靠模型或忽视模型及
  Web 应用可扩展性的陷阱。


