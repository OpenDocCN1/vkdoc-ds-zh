  \n\n\n### 基于密度的含噪声空间聚类模型\n\n我们使用基于密度的含噪声空间聚类模型（`DBSCAN`）来寻找任意空间形状的聚类。该模型识别一个包含若干数据点的半径区域。任何一个数据点都可以是核心点、边界点或离群点。根据这些点，数据点被分组为不同的聚类。表\
  \ 10-11 重点说明了这些点。\n\n表 10-11\n\nDBSCAN 点类型\n\n| 点类型 | 描述 |\n| --- | --- |\n| **核心点**\
  \ | 被最少数量邻居所包围的点。核心点被边界点所包围。 |\n| **边界点** | 未被最少数量邻居所包围，但可以从核心点到达的点。 |\n| **离群点**\
  \ | 既不是核心点也不是边界点的点。该点远离核心点的可达范围。 |\n\n该模型会寻找互为邻居的核心点，并将它们归入同一个聚类。因此，一个聚类至少包含一个核心点（可达点）或边界点。此外，它还能发现被不同聚类所包围的聚类。参见代码清单\
