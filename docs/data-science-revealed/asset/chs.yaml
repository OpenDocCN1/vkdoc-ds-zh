  ### L1 正则化


  我们使用 L1 正则化将数据居中到其中心点。这种正则化技术会使弱变量的系数变为零。它有助于减少噪声变量，从而优化学习过程。清单 12-19 展示了第三个深度信念网络的架构。它包含一个使用
  sigmoid 激活函数和 alpha 为 0.01 的 L1 惩罚项的可见层。此外，还有两个使用 ReLu 激活函数的隐藏层。


  ```

  def create_dnn_model3(optimizer="adam"):

  model3 = Sequential()

  model3.add(Dense(8, input_dim=8, activation="sigmoid", kernel_regularizer=regularizers.l1(0.001),
  bias_regularizer=regularizers.l1(0.01)))

  model3.add(Dense(8, activation="relu"))

  model3.add(Dense(1, activation="relu"))

  model3.compile(loss="binary_crossentropy", optimizer=optimizer, metrics=["accuracy"])

  return model3

