  ## 结论


  本章涵盖了时间序列分析。我们训练了一个阶数为 `(1, 1, 1)`、季节性阶数为 `(1, 1, 1, 12)` 的 SARIMAX 模型。它预测了上升趋势；然而，由于序列中存在有影响力的数据点，该预测并不可靠。该模型在预测序列时会出现显著错误。下一章将介绍加法模型。


  '
- '# 4. 高质量时间序列分析


  前一章介绍了季节性 ARIMA。在数据预处理和超参数优化方面付出了大量努力之后，该模型在预测序列的未来实例时仍会产生相当大的误差。为了进行快速自动化的预测流程，请使用
  Facebook 的 Prophet；它基于包含季节性和假日效应的非线性趋势来预测时间序列数据。本章介绍 Prophet，并展示开发和测试加法模型的方法。首先，讨论
  Statsmodels 包和 Prophet 包之间的关键区别。


  ## Statsmodels 与 Prophet 的区别


  时间序列分析通常需要诊断和处理缺失值与异常值、使用多种检验统计量验证关键假设、进行超参数优化以及控制季节性效应。如果工作流程中出现一点小错误，模型在预测未来实例时就会产生重大错误。因此，使用
  Statsmodels 构建模型需要一定程度的精通。


  请牢记，机器学习的目标是用最少的代码赋予计算机智能。Statsmodels 并未提供这一点。Prophet 填补了这一空白。它由 Facebook 的核心数据科学团队开发。它可以执行缺失值和异常值检测、超参数优化以及季节性和假日效应控制等任务。要在
  Python 环境中安装 FB Prophet，请使用 `pip install fbprophet`。要在 Conda 环境中安装，请使用 `conda install
  -c conda-forge fbprophet`。


  ## 理解 Prophet 的组成部分


  在上一章中，我们费尽心力构建了一个包含三个组成部分的时间序列模型，即趋势、季节性和不规则成分。




  ### Prophet 组件


  Prophet 包充分考虑了趋势、季节性和节假日及事件。在本节中，我们将简要讨论该包的关键组件。


  #### 趋势


  趋势是单一且一致的方向性运动（向上或向下）。我们通过拟合时间序列模型来发现趋势。表 4-1 突出显示了可调优的趋势参数。


  **表 4-1** 可调优的趋势参数


  | 参数 | 描述 |

  | --- | --- |

  | `growth` | 指定分段线性或逻辑斯蒂趋势 |

  | `n_changepoints` | 如果未指定变点，则自动包含的变点数量 |

  | `change_prior_scale` | 自动变点选择的变更 |


  #### 变点


  变点是一个惩罚项。它会改变时间序列模型的行为。如果你不指定变点，则默认变点值会自动设置。


  #### 季节性


  季节性表示逐年一致的上行或下行运动。公式 4-1 对此进行了近似。


  ![$$ S(t)={\sum}_{n=1}^N{\alpha}_n coscos\ \left(\frac{2\pi nt}{P}\right)+{b}_n\mathit{\cos}\left(\frac{2\pi
  nt}{P}\right) $$](img/506148_1_En_4_Chapter_TeX_Equ1.png)


  （公式 4-1）


  此处，`P` 是周期（周数据为 7，月数据为 30，季度数据为 90，年数据为 365）。


  #### 节假日和事件参数


  节假日和事件会影响时间序列的条件均值。表 4-2 概述了关键的可调优节假日和事件参数。


  **表 4-2** 节假日和事件参数


  | 参数 | 描述 |

  | --- | --- |

  | `daily_seasonality` | 拟合日季节性 |

  | `weekly_seasonality` | 拟合周季节性 |

  | `year_seasonality` | 拟合年季节性 |

  | `holidays` | 包含节假日名称和日期 |

  | `yeasonality_prior_scale` | 确定季节性或节假日组件所需的强度 |


  ### 加法模型


  加法模型假设趋势和周期被视为一个项。其组件类似于 Holt-Winters 技术。我们将该方程表示为公式 4-2。


  ![$$ y=S(t)+T(t)\ast I(t) $$](img/506148_1_En_4_Chapter_TeX_Equ2.png)


  （公式 4-2）


  该公式的数学表达式如公式 4-3 所示。


  ![$$ y=g(t)+s(t)+h(t)+{\varepsilon}_i $$](img/506148_1_En_4_Chapter_TeX_Equ3.png)


  （公式 4-3）


  此处，`g(t)` 表示用于建模非周期性变化的线性或逻辑斯蒂增长曲线，`s(t)` 表示周期性变化（日、周、年季节性），`h(t)` 表示节假日的影响，`+ ε[i]`
  表示考虑异常变化的误差项。


