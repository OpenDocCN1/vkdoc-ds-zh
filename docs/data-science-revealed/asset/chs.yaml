  \ | -1 |\n| **197** | -1 |\n| **198** | -1 |\n| **199** | -1 |\n\n```\ny_pred =\
  \ pd.DataFrame(dbscan_output.labels_,columns = [\"Predicted\"])\ny_pred\n代码清单 10-23\n\
  预测标签\n```\n\n代码清单 10-24 描述了 DBSCAN 模型的特征（见图 10-9）。\n\n![../images/506148_1_En_10_Chapter/506148_1_En_10_Fig9_HTML.jpg](img/506148_1_En_10_Fig9_HTML.jpg)\n\
  \n图 10-9\n\nDBSCAN 模型\n\n```\nfig, ax = plt.subplots()\nplt.scatter(df[:,0],df[:,1],c=dbscan_output.labels_,cmap=\"\
  viridis\",s=20)\nplt.xlabel(\"y\")\nplt.show()\n代码清单 10-24\n可视化 DBSCAN 模型\n```\n\
  \n图 10-9 显示，DBSCAN 模型并未做出大量智能的推测。这并不意味着该模型在所有情况下都表现不佳。当满足基于密度的标准时，该模型是适用的。显然，高斯分布表现出更优的性能。\n\
  \n## 结论\n\n本章介绍了降维和聚类分析。我们开发并评估了三种聚类模型，即 K-means 模型、DBSCAN 模型和凝聚层次模型。我们首先使用 PCA\
  \ 方法降低数据的维度。然后，我们采用肘部法则来确定在 K-means 模型和凝聚层次模型中需要指定的聚类数量。在开发 DBSCAN 模型时，我们不需要预先假定聚类的数量。\n\
  \n聚类模型是宽松的；它们没有强假设条件。聚类分析中令人望而生畏的部分是模型评估。它们缺乏稳健的评估指标，我们依赖轮廓系数法进行模型评估。\n\n脚注 1  \
  \ 2\n\n"
- '# 生存分析


  本章介绍生存分析。该方法包括两个分支：参数方法和非参数方法。参数生存分析模型包括威布尔模型、指数模型、对数线性模型等（更多信息请参阅 Lifelines^(¹¹)）。非参数生存分析模型包括
  Kaplan-Meier 模型和 Nelson-Aalen 模型。


  本章仅介绍最流行的非参数模型，即 Kaplan-Meier 模型，该模型使用时间来衡量一个二元变量。它对数据的结构有宽松的假设。同样，它也不对数据的线性关系和正态性做出假设。


  它不以传统意义来捕捉时间。它捕捉的是研究对象在研究中的实际进入和退出日期。我们也称生存分析为*可靠性分析*或*持续时间建模*。当我们使用它时，持续时间比时间更重要。在临床试验中，我们用它来估计患者在特定时间之后存活（即疾病或死亡）的概率。在工程领域，我们用它来估计机器在特定时间之后无故障运行（即机器故障）的概率。


  要使一项研究和生存分析模型被认为是可靠的，必须满足某些条件。首先，研究设计应包含一个对照组。其次，必须有严格的方法来记录研究中参与者的活动；我们必须始终考虑诸如患者进入或退出研究、患者处于风险状态以及患者死亡等因素。表
  11-1 概述了关键的生存分析术语。


  表 11-1


  生存分析关键术语


  | 术语 | 描述 |

  | --- | --- |

  | **生存时间** | 表示事件的时间线 |

  | **事件** | 表示正在研究的二元结果（通常是疾病或死亡） |

  | **删失** | 表示患者从研究中移除 |


  衡量疾病和死亡等事件结果的研究需要很长时间。参与者可以进入或退出研究，有些人可能死亡，而其他人则被报告为处于风险中。在生存分析中，我们主要处理缺失值。我们将包含缺失值的数据称为*删失数据*。与逻辑回归和线性判别分析等其他非参数模型不同，生存分析模型对缺失值不敏感。事实上，我们总是期望在数据中发现缺失值。




