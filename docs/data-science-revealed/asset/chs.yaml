- '# 6. 使用线性判别分析进行降维与多变量分析


  前一章介绍了一种称为逻辑回归的分类方法。它用于解决二分类问题。多项逻辑回归（MLR）是逻辑回归的扩展，它使用 `Softmax` 函数代替 `Sigmoid`
  函数，并应用交叉熵损失函数。它是一种用于预测具有两个以上类别的目标变量的逻辑回归形式。它与线性判别分析（LDA）的不同之处在于，MLR 不假设数据来自正态分布。LDA
  属于线性家族，它假设正态性和线性。


  我们使用 LDA 来解决二分类问题和多分类问题。本章介绍线性分类和判别分析。它揭示了使用 LDA 将数据压缩到更少维度，并利用连续变量估计分类变量的方法。


  该模型的工作方式类似于前几章中介绍的模型，如线性回归和逻辑回归。它也与协方差分析（ANOVA）相似。ANOVA 使用分类变量估计连续变量。LDA 合理地假设各组的协方差结构相似。如果各组的协方差结构不相等，则使用二次判别分析。LDA
  模型的一个扩展被称为费舍尔判别分析（FDA）。FDA 不执行分类，但变换后获得的特征可用于分类。


  逻辑回归和 LDA 都用于估计分类因变量。LDA 与逻辑回归的区别在于它有更多的假设。它也与主成分分析和因子分析相似，因为它寻找最能解释数据的线性组合。当样本量较大时，LDA
  效果最佳。


  它应用判别函数，通过寻找变量的线性组合并最大化它们之间的差异，将一组连续变量分配到各个类别中。同样，它应用费舍尔线性判别规则来最大化类内散度矩阵与类间散度矩阵之间的比率，并发现组内的线性组合。


  最后，它仅使用连续变量来估计分类变量。如果自变量是分类变量，因变量也是分类变量，则使用另一种称为判别对应分析的替代模型。鉴于其继承自线性家族，需要根据线性和正态性假设对模型进行检验。LDA
  有两个用途：降维和分类。


  ### 降维


  我们使用 LDA（类似于 PCA）进行降维。它发现数据中解释的方差，并将数据减少到更少的维度。请记住使用特征值来寻找数据中显著变异性的来源。具有最高载荷的特征值是第一个函数，具有第二高载荷的是第二个函数，依此类推。我们根据某些标准剔除具有过高特征值（极端变异性）的因子。


  ### 分类


  LDA 解决二分类和多分类问题。它应用线性分类器将变量分配到某个类别。由于该模型应用线性分类器，因此继承了线性和正态性的严格假设。




  ## 假设


  LDA 对数据结构做出了强假设。如果满足表 6-1 中强调的假设，我们认为 LDA 分类器是可靠的。


  **表 6-1** LDA 假设


  | 假设 | 描述 |

  | --- | --- |

  | 多元正态性 | 每个变量分组中必须存在多元正态性；自变量必须服从正态分布。 |

  | 协方差 | 各组变量之间的方差在预测变量的各个水平上相同。当协方差相等时，可以使用线性判别分析。否则，使用二次判别分析。 |

  | 相关性 | 变量之间不能高度相关。 |

  | 随机抽样 | 必须使用随机抽样选择参与者。参与者的得分必须独立于变量。 |


  假设有 C 个类别，令类别的均值向量为类别内的样本数量。


  公式 6-1 是类内散度矩阵。


  ![$$ {S}_w={\sum}_{i=1}^C{\sum}_{j=1}^{M_i}\left({y}_j-{\mu}_i\right){\left({y}_j-{\mu}_i\right)}^T
  $$](img/506148_1_En_6_Chapter_TeX_Equ1.png)


  （公式 6-1）


  公式 6-2 是类间散度矩阵。公式 6-3 是类内散度矩阵。


  ![$$ {S}_b={\sum}_{i=1}^C\left({y}_j-{\mu}_i\right){\left({y}_j-{\mu}_i\right)}^T
  $$](img/506148_1_En_6_Chapter_TeX_Equ2.png)


  （公式 6-2）


  ![$$ \mu =\frac{1}{C}{\sum}_{i=1}^C{\mu}_i\left( 整个数据集的均值\right) $$](img/506148_1_En_6_Chapter_TeX_Equ3.png)


  （公式 6-3）


  它执行一种变换，在最小化类内散度的同时最大化类间散度矩阵。参见公式 6-4。


  ![$$ \mathit{\operatorname{maximize}}=\frac{\mathit{\det}\left({S}_w\right)}{\mathit{\det}\left({S}_b\right)}
  $$](img/506148_1_En_6_Chapter_TeX_Equ4.png)


  （公式 6-4）


  这种变换在保持类别可分性的同时，减少了由身份以外的来源引起的变异。线性变换由一个矩阵 *U* 给出，其列是 *S*[*w*]^(-1)*S*[*b*] 的特征向量。


  基本上，它计算 d 维均值向量，然后是散度矩阵以及散度矩阵的特征向量和等效特征值。此后，模型对特征值进行分类，并选择较大的特征值形成一个 *d×k* 维矩阵，并将样本转换到新的子空间。最终结果是类别分离。


