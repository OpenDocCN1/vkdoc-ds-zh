  \ | TN = 98 | FP = 9 |\n| **实际：是** | FN = 18 | TP = 29 |\n\n```\ncmatlogreg = pd.DataFrame(metrics.confusion_matrix(y_test,y_predlogreg),\
  \ index=[\"Actual: No\",\"Actual: Yes\"],\ncolumns=(\"Predicted: No\",\"Predicted:\
