  ## 结论


  本章探讨了用于正则化最小二乘模型估计的不同模型，例如岭回归、带内置交叉验证的岭回归和 lasso 回归。这些模型充分处理了由偏差引起的误差和由方差引起的误差。在测试它们的性能后，我们发现正则化或收缩模型估计可以提高整体性能。岭回归模型是一个微妙的竞争者。如果两种正则化模型都不能提高最小二乘模型的预测能力，请使用
  `ElasticNet` 模型，它是岭回归和 lasso 回归的可行混合体。


