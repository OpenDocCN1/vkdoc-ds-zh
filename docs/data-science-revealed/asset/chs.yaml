  代码清单 1-32\n创建实际值表格\n```\n\n表 1-7 表明回归器存在轻微误差。\n\n### 平均绝对误差\n\n绝对误差是估计值与真实值之间的差值。例如，如果模型预测薪水为\
  \ 40,749 美元，而实际值为 37,731 美元，那么该模型的绝对误差为 40,749 美元 – 37,731 美元 = 3,018 美元。平均绝对误差（MAE）表示估计中误差的平均幅度，不考虑方向。\n\
  \n![$$ MAE=\\frac{1}{n}{\\sum}_{i=1}^n\\mid {x}_i-x\\mid $$](img/506148_1_En_1_Chapter_TeX_Equ9.png)\n\
  \n(公式 1-9)\n\n这里，*n* 表示误差的数量，∣*x*[*i*] − *x*∣ 表示绝对误差。\n\n### 均方误差\n\n均方误差（MSE）表示在考虑回归关系后，模型对数据变异性的解释程度。\n\
  \n![$$ MSE=\\frac{1}{n}{\\sum}_{i=1}^n\\mid {y}_i-\\hat{y}\\mid $$](img/506148_1_En_1_Chapter_TeX_Equ10.png)\n\
  \n(公式 1-10)\n\n### 均方根误差\n\n均方根误差（RMSE）表示在不考虑回归关系的情况下解释的变异性。要获得 RMSE 分数，请使用 MSE\
  \ 的平方根。\n\n![$$ RMSE=\\sqrt{MSE} $$](img/506148_1_En_1_Chapter_TeX_Equ11.png)\n\n\
  (公式 1-11)\n\n\n\n### R 平方\n\nR 平方（R²）表示模型所能解释的数据变异程度。该指标的取值范围为 0 到 1，其中 0 表示回归模型对数据变异性的解释能力很差，而\
  \ 1 则表示回归模型对数据的解释能力最佳。\n\n![$$ {R}²=1-\\frac{\\sum {\\left({y}_i-\\hat{y}\\right)}²}{\\\
  sum {\\left({y}_i-\\underset{\\_}{y}\\right)}²} $$](img/506148_1_En_1_Chapter_TeX_Equ12.png)\n\
  \n（公式 1-12）\n\n此处，![$$ \\hat{y} $$](img/506148_1_En_1_Chapter_TeX_IEq4.png) 表示 `y`\
  \ 的预测值，而 ![$$ \\underset{\\_}{y} $$](img/506148_1_En_1_Chapter_TeX_IEq5.png) 表示\
  \ `y` 的平均值。R² 分数需要乘以一百。例如，如果分数是 0.9，那么模型解释了数据中 90% 的变异。\n\n还有其他用于模型评估的指标，例如：\n\n\
  *   *解释方差分数*：一个衡量模型与实际数据之间差异的指标。如果该分数接近 1，则表明存在强相关性。\n*   *平均伽马偏差*：一个衡量因变量尺度并估计相对误差的指标。它是幂参数为\
  \ 2 的 Tweedie 偏差。\n*   *平均泊松偏差*：一个衡量因变量尺度并估计相对误差的指标。它是幂参数为 1 的 Tweedie 偏差。\n\n清单\
