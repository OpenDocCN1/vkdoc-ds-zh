  \n#### 肯德尔相关方法\n\n肯德尔相关方法用于估计有序变量中排名之间的关联性。有序变量由距离未知的分类变量组成。有序数据的一个例子是李克特量表。肯德尔相关方法的值范围从\
  \ -1 到 1，其中 -1 表示排名不一致，0 表示排名相互独立，1 表示两个排名完全一致。清单 5-3 生成了肯德尔相关矩阵（见图 5-3）。\n\n![../images/506148_1_En_5_Chapter/506148_1_En_5_Fig3_HTML.jpg](img/506148_1_En_5_Fig3_HTML.jpg)\n\
