  ### 累积密度


  累积密度表示在特定时间 *t* 发生失败的概率。它估计的是累积密度。我们使用公式 11-1 来估计无条件失败率。


  ![$$ \hat{f}=\frac{d_i}{\left\{\frac{d_i}{t_{i+1}-{t}_i}\right\}} $$](img/506148_1_En_11_Chapter_TeX_Equ1.png)


  (公式 11-1)


  这里，*d*[*i*] 表示事件数量，*t* 是生存时间。参见代码清单 11-12 和表 11-10。


