  ## Kaplan-Meier 模型


  Kaplan-Meier (KM) 模型是一种非参数方法，用于根据观测到的生存时间估计生存概率。它使用时间测量一个二元变量。我们也将其视为乘积限模型。使用该模型时，我们考察在特定时期内死亡的患者数量，并假设他们在此之前一直存活。为了理解该模型的工作原理，我们解释其底层的生存函数。代码清单
  11-10 完成了 Kaplan-Meier 模型。


  ```

  kmf_miR_137 = KaplanMeierFitter().fit(T1,E1)

  kmf_control_group = KaplanMeierFitter().fit(T2,E2)

  代码清单 11-10

  完成 Kaplan-Meier 模型

  ```


