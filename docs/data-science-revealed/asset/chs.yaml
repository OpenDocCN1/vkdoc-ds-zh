  \ 会计算累积比例。请记住，我们并非基于某个模型来执行 PCA，而是由它来寻找能够解释变异的数据点。与因子分析类似，我们使用 PCA^(¹⁰) 来简化一组变量的结构。它通过计算变量的线性组合来得到主成分。该方法的主要目标是解释总方差。同时，它也将数据压缩到更少的成分中，以便所使用的成分能够代表模型估计值。最后，它会剔除具有较大特征值（极端变异性）的因子。不仅如此，它还使用凯泽准则来确定需要保留的因子数量。图\
  \ 10-1 简化了一组变量的结构。\n\n![../images/506148_1_En_10_Chapter/506148_1_En_10_Fig1_HTML.png](img/506148_1_En_10_Fig1_HTML.png)\n\
