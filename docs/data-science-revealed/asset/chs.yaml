  \n### 最小二乘模型超参数优化\n\n超参数是在训练模型之前设置的值。它控制模型的学习过程。超参数优化涉及指定一个值列表，并找到能产生最佳模型性能的值。\n\
  \n#### 步骤 1：使用默认超参数拟合最小二乘模型\n\n代码清单 1-22 使用默认超参数拟合最小二乘模型。\n\n```\nfrom sklearn.linear_model\
  \ import LinearRegression\nlm = LinearRegression()\nlm.fit(x_train,y_train)\n代码清单\
  \ 1-22\n开发最小二乘模型\n```\n\n\n\n#### 步骤 2：确定交叉验证得分的均值和标准差\n\n交叉验证涉及检验模型对数据的泛化程度。代码清单\
  \ 1-24 使用 `R²` 分数作为标准来寻找交叉验证得分。还有其他可用作标准的分数，例如均方误差（在考虑回归关系后，模型对数据变异性的解释程度）和均方根误差（在不考虑回归关系的情况下对变异性的解释程度）。代码清单\
  \ 1-23 查找回归器的默认参数。\n\n```\nlm.get_params()\n代码清单 1-23\n默认参数\n```\n\n一次密集搜索会返回一个估计器、一个参数空间、用于搜索候选参数的方法、交叉验证方案以及评分函数。交叉验证方法包括\
  \ `RandomizedSearchCV`（考虑特定数量的候选参数）、`GridSearchCV`（考虑所有参数组合）以及 `BayesSearchCV`（通过将高斯过程作为函数的先验来处理，利用先前的损失来确定对损失进行采样的最佳点）。下面，我们将向您展示如何使用\
  \ `GridSearchCV` 和 `BayesSearchCV` 执行交叉验证。表 1-5 突出显示了可优化的超参数。\n\n**表 1-5** 可优化的超参数\n\
  \n| 参数 | 描述 |\n| --- | --- |\n| `fit_intercept` | 决定模型是否必须估计截距 |\n| `normalize`\
  \ | 决定是否必须对自变量进行归一化 |\n| `copy_X` | 决定是否必须复制自变量 |\n\n代码清单 1-24 创建了网格模型。\n\n```\n\
  from sklearn.model_selection import GridSearchCV\nparam_grid = {'fit_intercept':[True,False],\n\
  'normalize':[True,False],\n'copy_X':[True, False]}\ngrid_model  = GridSearchCV(estimator=lm,\n\
  param_grid=param_grid,\nn_jobs=-1)\ngrid_model.fit(x_train,y_train)\n代码清单 1-24\n\
  使用 GridSearchCV 开发网格模型\n```\n\n代码清单 1-25 返回最佳交叉验证得分和最佳参数。\n\n```\nprint(\"Best score:\
  \ \", grid_model.best_score_, \"Best parameters: \", grid_model.best_params_)\n\
  代码清单 1-25\n使用 GridSearchCV 查找最佳超参数\n```\n\n最佳得分：0.9272138118711238 最佳参数：{‘copy_X’:\
  \ True, ‘fit_intercept’: True, ‘normalize’: True}\n\n另一种查找正确超参数的方法是使用贝叶斯优化。代码清单\
