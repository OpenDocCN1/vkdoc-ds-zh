  *图 6-59：`Edit Assignment` 按钮*\n\n10. 从下拉菜单中选择您创建的紧凑布局，如图 6-60 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig60_HTML.jpg](img/437055_1_En_6_Fig60_HTML.jpg)\n\
  *图 6-60：选择紧凑布局*\n\n11. 点击 `Save`。\n\n## 总结\n\n如您所见，在 Salesforce 中，用户有多种方式可以相互协作以及与外部客户互动。企业中的协作是促成销售成交或推动项目/任务前进的关键。通过使用\
  \ Chatter 和 Salesforce 移动应用，用户便拥有了全天候工作所需的所有工具。\n\n\n\n"
- "# 7. 闪电流程生成器\n\n`闪电流程生成器` 是一款功能极为强大的业务流程自动化工具，能够解决众多现实中的业务问题。`流程生成器` 通过其增强的点击式界面，使得在一个地方构建逻辑变得简单。借助\
  \ `流程生成器`，你可以减少或消除为简单流程编写 `Apex` 代码的需求。你可以创建自动化逻辑来更新相关记录、更新字段、创建任务、发送电子邮件等等。点击 `新建`\
  \ 开始操作，如图 7-1 所示。\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig1_HTML.jpg](img/437055_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n\n`流程生成器` 主页。点击 `新建` 开始操作。\n\n## Salesforce 工作流规则与流程生成器\n\nSalesforce 提供了多种解决方案来自动化你的业务流程，包括工作流规则和\
  \ `流程生成器`。\n\n*工作流规则* 是在记录满足特定条件并被保存时自动执行的操作。通过建立一个系统化的流程，你可以最大限度地减少手动数据录入和处理过程。\n\
  \n`流程生成器` 在 `Salesforce Lightning` 中得到支持，并且能完成工作流规则所能做的一切，甚至更多（出站消息除外）。`流程生成器` 的操作可以在记录发生更改或被另一个进程调用时启动。两种自动化类型都支持基于时间的操作。\n\
  \n如果你有一个简单的单一 `if/then` 语句，建议使用工作流规则来自动化你的流程。换句话说，如果你的自动化标准包含简单的逻辑，请使用工作流规则。如果你的自动化需求具有一定的复杂性，那么\
  \ `流程生成器` 是最佳选择。请阅读“操作”部分，以了解每种操作类型的具体功能。\n\n表 7-1 列出了工作流规则与 `流程生成器` 工具之间的差异。\n\n\
  表 7-1\n\n工作流规则和流程生成器中可用的操作\n\n## 流程生成器：操作类型\n\n`流程生成器` 使创建自动化操作变得更加容易，因为它是一个可视化设计器，如图\
  \ 7-2 所示。\n\n以下是可以通过工作流规则或 `流程生成器` 完成的操作：\n\n*   *调用 Apex 类*：`Apex` 是一种用于在 Salesforce\
  \ 中开发复杂流程的编程语言。你可以使用 `流程生成器` 来调用现有的 `Apex` 类。\n*   *创建记录*：使用此操作可以从任何标准或自定义对象创建新记录。可以设置字段值来适当地构建记录。\n\
  \    **提示** 通过流程创建记录时，必填字段仍然有效。确保在`设置字段值`部分为所有必填字段赋值，以便成功创建记录。\n*   *电子邮件警报*：选择现有电子邮件警报，自动向指定收件人发送电子邮件。\n\
  *   *流程*：选择此操作以启动现有的可视化工作流。\n*   *发布到 Chatter*：创建一条消息，并选择更新用户、`Chatter` 群组，或向相关记录发布新的\
  \ `Chatter` 帖子。\n    **注意** 可以使用合并字段来生成 `Chatter` 帖子。\n*   *进程*：使用此操作类型来触发另一个进程。\n\
  \    **注意** 只能启动已激活的进程。\n*   *快速操作*：使用此操作类型来启动一个快速操作。选择“全局操作”来创建记录或记录通话。选择对象来为所选对象定义一个操作。\n\
  *   *提交以进行审批*：选择为给定记录激活默认审批流程或特定审批流程，如图 7-2 所示。通过选择适当的值来控制提交者是谁：`当前用户`、`来自记录的用户字段`\
  \ 或 `特定用户`。可以输入提交备注。\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig2_HTML.jpg](img/437055_1_En_7_Fig2_HTML.jpg)\n\
  \n    图 7-2\n\n    `提交以进行审批` 操作类型\n\n*   *更新记录*：选择更新现有记录或与对应对象相关的记录（如图 7-3 所示）。\n\
  \n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig3_HTML.jpg](img/437055_1_En_7_Fig3_HTML.jpg)\n\
  \n    图 7-3\n\n    在 `流程生成器` 中选择要更新的记录\n\n### 基于时间的操作\n\n当记录满足条件时，操作可以立即执行，也可以按照指定的时间表执行。\n\
  \n为了控制操作何时执行，可以向流程添加时间间隔，如图 7-4 所示。操作可以被触发在指定日期之前或之后运行。\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig4_HTML.jpg](img/437055_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4\n\n为基于时间的操作设置时间\n\n#### 示例\n\n举例来说，我们创建一个自动化操作，在客户生日的前一天向所有活跃客户发送一张“生日快乐”贺卡。`计划操作`\
  \ 选项仅在流程的第一个节点以“仅当创建记录时” *或* “当记录被创建或编辑时”启动 *并且* 在标准节点的 `高级` 部分选中了 `是` 复选框时才可用，如图\
  \ 7-5 所示。\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig5_HTML.jpg](img/437055_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5\n\n为操作组设置条件\n\n## 使用流程生成器创建流程\n\n按照本节中的步骤创建自动化业务流程。\n\n在这个场景中，你将遇到一个现实中的业务问题。假设销售用户必须手动创建一个项目记录，该记录包含存储在商机级别相同的详细信息。与其创建新记录并复制粘贴详细信息，不如让他们使用工具自动创建新的项目记录。同时，自动将存储在商机记录中的详细信息提取到新项目记录中也很有帮助。\n\
  \n### 注意\n\n在此用例中，项目记录是存储在名为 `项目` 的自定义对象中的记录。\n\n对于所有设置为 `已结束并赢得` 的商机，你希望创建一个新的项目记录，并将\
  \ `项目` 字段 `下一步` 更新为 `安排项目启动会`。\n\n\n\n### 注意\n\n这是你在 Salesforce 中管理项目时可以使用的一个用例。这些步骤也可以稍作调整，用于创建保险公司最常用的新保单记录。金融服务行业的人也会在商机结束时，利用这个概念创建新的财务账户记录。这些只是几个例子。在\
  \ Salesforce 中使用自动化的机会是无限的！\n\n请按照以下步骤创建此流程：\n\n1.  在`设置`中，选择`平台工具`部分的`流程自动化`，如图\
  \ 7-6 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig6_HTML.jpg](img/437055_1_En_7_Fig6_HTML.jpg)\n\
  \n   **图 7-6** – 设置中的流程自动化\n\n2.  接着，选择`流程生成器`以访问`流程生成器`主页。\n\n   该页面会列出所有**激活**和**未激活**的流程，如图\
  \ 7-7 所示，同时显示流程描述、相关对象、流程类型、最后修改日期、状态和操作。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig7_HTML.jpg](img/437055_1_En_7_Fig7_HTML.jpg)\n\
  \n   **图 7-7** – 流程生成器主页及流程列表\n\n3.  点击`新建`按钮以启动新流程。\n\n4.  输入流程名称并按`Tab`键生成 API\
  \ 名称，如图 7-8 所示。\n\n   **注意** 并非必须，但建议为每个流程输入描述。对于自动化流程众多的组织来说，若没有描述，可能很难找到正确的流程。\n\
  \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig8_HTML.jpg](img/437055_1_En_7_Fig8_HTML.jpg)\n\
  \n   **图 7-8** – 为流程命名\n\n5.  确定流程应在何时启动。选项包括“当记录更改时”和“当被其他流程调用时”。\n\n   **注意** 你可以将更复杂的流程分解为更简单的流程。如前所述，这些流程可以被其他流程重复使用和调用。\n\
  \n   在当前场景中，你将在“当记录更改时”启动流程。点击`保存`，如图 7-9 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig9_HTML.jpg](img/437055_1_En_7_Fig9_HTML.jpg)\n\
  \n   **图 7-9** – 当记录更改时启动流程\n\n6.  首次启动流程时，必须选择其启动的对象。选择`添加对象`，如图 7-10 高亮所示。\n\n\
  \   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig10_HTML.jpg](img/437055_1_En_7_Fig10_HTML.jpg)\n\
  \n   **图 7-10** – 在流程生成器中选择对象\n\n7.  选择流程应评估的对象，如图 7-11 所示。在此示例中，你将选择`商机`。\n\n \
  \  ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig11_HTML.jpg](img/437055_1_En_7_Fig11_HTML.jpg)\n\
  \n   **图 7-11** – 选择何时启动流程\n\n8.  选择流程应何时启动，如图 7-11 所示。\n   - 选择“仅当创建记录时”，仅对新记录启动流程。\n\
  \   - 选择“当创建或编辑记录时”，对新记录 *以及* 保存时被编辑的现有记录启动流程。\n\n9.  你可以点击`是`，如图 7-12 所示，允许在一次执行中多次评估该记录（最多五次）。\n\
  \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig12_HTML.jpg](img/437055_1_En_7_Fig12_HTML.jpg)\n\
  \n   **图 7-12** – 点击“是”以允许流程在单次事务中多次评估记录\n\n10. 确认你的规格后，点击 ![../images/437055_1_En_7_Chapter/437055_1_En_7_Figa_HTML.jpg](img/437055_1_En_7_Figa_HTML.jpg)。\n\
  \n11. 选择图 7-13 中显示的`添加条件`节点，为此流程设置条件。\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig13_HTML.jpg](img/437055_1_En_7_Fig13_HTML.jpg)\n\
  \n    **图 7-13** – 向流程添加条件节点\n\n12. 设置记录为了执行操作而应满足的条件。\n\n    在此示例中，你希望设置条件，使得仅当商机记录的阶段标记为`已赢得`时，流程才启动。\n\
  \n### 设置条件\n\n请按照以下步骤为流程设置条件：\n\n1.  为你的条件命名，如图 7-14 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig14_HTML.jpg](img/437055_1_En_7_Fig14_HTML.jpg)\n\
  \n   **图 7-14** – 设置条件的步骤\n\n2.  查找一个字段并选择合适的运算符来设置条件。\n\n3.  选择执行操作的条件（如图 7-15\
  \ 所示）。你可以选择：仅在满足条件时执行操作、当公式计算结果为真时执行操作，或无条件执行操作。在此示例中，选择“无条件 – 直接执行操作！”以便对所有商机记录执行操作。\n\
  \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig15_HTML.jpg](img/437055_1_En_7_Fig15_HTML.jpg)\n\
  \n   **图 7-15** – 设置执行操作的条件\n\n4.  设置条件。使用字段和运算符值来设置这些条件，如图 7-16 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig16_HTML.jpg](img/437055_1_En_7_Fig16_HTML.jpg)\n\
  \n   **图 7-16** – 设置调用流程的条件\n\n5.  所有条件设置完毕后，点击`保存`。\n\n6.  选择满足此条件后的操作。点击`添加操作`，如图\
  \ 7-17 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig17_HTML.jpg](img/437055_1_En_7_Fig17_HTML.jpg)\n\
  \n   **图 7-17** – 向流程添加即时操作\n\n7.  定义操作类型。\n\n8.  在此场景中，你想要创建一个新的项目记录。点击`创建记录`。\n\
  \n9.  命名操作并选择应创建的记录类型，如图 7-18 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig18_HTML.jpg](img/437055_1_En_7_Fig18_HTML.jpg)\n\
  \n   **图 7-18** – 命名操作并选择记录类型\n\n10. 设置新记录的字段值，如图 7-19 所示。在我们的示例中，我们设置了所有想要带入新项目记录的字段值。\n\
  \n    **注意** 选择此操作时，必须填写所有必填字段。如果未输入必填字段的值，将不会创建记录。\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig19_HTML.jpg](img/437055_1_En_7_Fig19_HTML.jpg)\n\
  \n    **图 7-19** – 创建新记录时设置字段值\n\n11. 确认条件和操作正确后，点击`保存` ![../images/437055_1_En_7_Chapter/437055_1_En_7_Figb_HTML.jpg](img/437055_1_En_7_Figb_HTML.jpg)。\n\
  \n12. 要使此流程生效，请点击`激活`，如图 7-20 所示。\n\n    **注意** 同一时间只能有一个版本的流程处于激活状态。\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig20_HTML.jpg](img/437055_1_En_7_Fig20_HTML.jpg)\n\
  \n    **图 7-20** – 激活流程\n\n13. 最佳实践是测试该流程。创建一个测试记录来测试这个新的自动化流程。\n\n\n\n## 总结\n\n\
  在本章中，我们回顾了流程生成器可以完成的高级功能详情。它能实现的自动化远超仅靠工作流规则所能做到的。重要的是要知道，你有无数种方法可以在现有设置中构建自动化功能。请将本章作为指南，了解流程生成器的实际能力。\n\
  \n"
- "# 8. 数据管理\n\nSalesforce 提供了一系列数据管理工具。Lightning Salesforce 提供了一个数据导入向导，允许你更新现有记录或创建新记录（图\
  \ 8-1）。数据导入向导支持使用逗号分隔值（CSV）文件、Outlook CSV、ACT! CSV 和 Gmail CSV 执行导入、更新和插入操作。Salesforce\
  \ 不仅提供了导入工具，还提供了帮助你将数据导出为 CSV 文件的工具、根据记录条件将记录从一位所有者批量转移给另一位所有者的工具，以及根据记录条件批量删除记录的工具。Salesforce\
  \ 还提供了数据控制工具，帮助你控制用户向系统中添加的数据类型。你可以创建重复规则，以防止用户添加重复记录。数据管理对组织来说极为重要；事实上，你的 Salesforce\
  \ 组织的价值完全取决于你用它收集的数据质量。如果数据是“脏数据”，那么你的报告也同样是脏数据。拥有准确且有用的数据，你才能恰当地分析信息，这反过来又能让你改善用户和客户的体验。\n\
  \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig1_HTML.jpg](img/437055_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n导入可以很简单！\n\n## 使用数据导入向导\n\nSalesforce 提供的数据导入向导允许你导入新记录和更新现有记录。你只需要一个\
  \ CSV 文件，其列标题与你现有的 Salesforce 字段匹配，并且数据位于电子表格的行中即可（图 8-2）。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig2_HTML.jpg](img/437055_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n准备导入到 Salesforce 组织的 CSV 文件\n\n你可以轻松地用 Excel 电子表格创建 CSV 文件。保存文件后，你会在文件名下方看到创建了一个“另存为”类型。选择下拉菜单并将其更改为“CSV（逗号分隔）”。根据你的\
  \ Excel 版本，措辞可能会有所不同。示例如图 8-3 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig3_HTML.jpg](img/437055_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n如何将 Excel 文件保存为 CSV 文件格式\n\n## 准备导入的数据\n\n为了准备导入联系人和帐户的数据，你必须确保在你的 CSV\
  \ 文件中，为你可能已设置的所有必填字段或 Salesforce 自带的字段都各有一列。你可以通过编辑记录并查找旁边带有红色线条的字段来确定哪些字段是必填项。你可以将目标对象上找到的任何字段作为\
  \ CSV 文件中的一列包含进来。另一个重要的准备步骤是确保导入的数据与字段的数据类型匹配。准备好数据非常重要，因为如果数据不正确，系统会报错并且不会导入该记录。为了避免在导入上花费数小时，请遵循以下提示：\n\
  \n*   日期数据类型只能接受以下格式：`MM/DD/YYYY`。\n*   日期和时间数据类型可以接受以下格式：`MM/DD/YYYY hh:mm:ss`。也可以接受其他格式。\n\
  *   数字和货币数据类型只接受数字（不接受字母）。\n*   复选框数据类型接受 `TRUE` 和 `FALSE` 值（`TRUE` = 已选中，`FALSE`\
  \ = 未选中）。\n*   电子邮件数据类型字段要求包含 `@` 符号，并且包含一个点号（`.`）及合适的后缀（`.com`， `.org`， `.gov`\
  \ 等）。Salesforce 不检查特定的后缀类型，但如果点号后面没有后缀，通常会产生错误。\n*   选择列表数据类型字段必须与该选择列表值中已有的内容完全匹配，或者你可以在字段级别取消选中“将选项列表限制为值集中定义的选项”复选框，以便任何值都能被包含并导入。\n\
  *   多选选择列表值必须用分号分隔（例如，`blue; red; green`）。\n*   URL 数据类型字段需要包含一个带有后缀的点号（`.com`，\
  \ `.org`， `.gov` 等）。\n\n### 注意\n\n在此导入向导中，如果帐户名称与 CSV 文件中的另一个名称相同，Salesforce 不会创建重复项。如果帐户名称多了一个字母，Salesforce\
  \ 会将其视为新帐户并创建重复项。\n\n此外，如果你将列标题标记为 Salesforce 字段标签，Salesforce 导入向导会自动将你的列映射到 Salesforce\
  \ 字段（我们将在第 9 步中讨论这一点）。\n\n*   尝试将所有列标题与你导入的字段名称匹配。大多数导入工具会将你的列标题“自动映射”到相应的字段。\n\n\
  \n\n### 使用数据导入向导导入客户和联系人\n\nSalesforce 数据导入向导是一款出色且易于使用的工具。它提供视频来引导您完成导入过程，并设有完善的常见问题解答部分。甚至还为您提供了设置导入的分步流程。保持\
  \ Salesforce 数据的准确性和时效性非常重要。无论您是首次导入客户和联系人，还是向系统中添加新的客户和联系人，都需要了解如何操作以确保数据的完整性。\n\
  \n1. **准备要导入的数据**。标准 Salesforce 设置中的客户需要客户名称。除了客户，您还可以导入联系人。标准 Salesforce 设置中的联系需要客户名称和姓氏。由于联系人的导入需要客户名称，您可以在\
  \ CSV 文件中将客户和客户详细信息放在一行，对于与该客户相关的其他联系人，只需使用该客户名称即可。如果您在每个联系人的客户字段中填写了不同的客户字段详细信息，则导入过程中该客户的最后一行数据将反映在\
  \ Salesforce 中。如图 8-4 所示，第 5 行的 Cloud Creations 是导入后在 Salesforce 中看到的信息。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig4_HTML.jpg](img/437055_1_En_8_Fig4_HTML.jpg)\
  \  \n   *图 8-4 – 准备导入的数据*\n\n2. **导航至“设置”菜单**，如图 8-5 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig5_HTML.jpg](img/437055_1_En_8_Fig5_HTML.jpg)\
  \  \n   *图 8-5 – 导航至“设置”菜单*\n\n3. 在“快速查找”框中，输入 `Data import`（不要按 `Enter` 键；选项会随您的输入自动填充）。点击\
  \ `Data Import Wizard`，如图 8-6 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig6_HTML.jpg](img/437055_1_En_8_Fig6_HTML.jpg)\
  \  \n   *图 8-6 – 搜索数据导入向导*\n\n4. 点击绿色的 `Launch Wizard!` 按钮，如图 8-7 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig7_HTML.jpg](img/437055_1_En_8_Fig7_HTML.jpg)\
  \  \n   *图 8-7 – 访问数据导入向导*\n\n5. 在“您要导入哪种类型的数据？”问题下，点击“标准对象”选项卡上的 `Accounts and\
  \ Contacts`，如图 8-8 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig8_HTML.jpg](img/437055_1_En_8_Fig8_HTML.jpg)\
  \  \n   *图 8-8 – 您要导入哪种类型的数据？*\n\n6. 在“您想要做什么？”问题下，点击“添加新记录”，将显示以下信息：\n   - **按以下方式匹配联系人**：此选项允许您根据联系人的全名、电子邮件或您已创建并设为唯一\
  \ ID 或外部 ID 的任何字段，将您的 CSV 数据与 Salesforce 中可能已存在的联系人进行匹配。这有助于防止导入时产生重复记录。您需要选择您认为最佳匹配的字段。通常使用电子邮件进行匹配。\n\
  \n   > **注意**  \n   > 唯一 ID 或外部 ID 是仅与该记录相关的标识符。当将数据从其他 CRM 迁移到 Salesforce 时，您的其他\
  \ CRM 会包含其自身的唯一 ID。您应该创建一个字段并将其标记为外部 ID，然后将此字段导入到您的 Salesforce 实例中。这样，如果您在初始导入时忘记包含某些内容，将来可以对其进行更新。或者，对于与其他系统集成的业务用途，外部\
  \ ID 对于关联两个组织并确保只更新一条记录至关重要。Salesforce 也会为创建的每条记录生成唯一的 ID；它是一个 15 到 18 个字符的字母数字\
  \ ID。您可以在报表中找到记录的此 ID；只需搜索 `ID` 字段，如图 8-9 所示，或者在浏览器的 URL 中找到它，如图 8-10 所示。\n\n  \
  \ ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig10_HTML.jpg](img/437055_1_En_8_Fig10_HTML.jpg)\
  \  \n   *图 8-10 – 在浏览器 URL 中找到您的记录 ID*\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig9_HTML.jpg](img/437055_1_En_8_Fig9_HTML.jpg)\
  \  \n   *图 8-9 – 如何在报表中搜索记录的 ID*\n\n7. **按以下方式匹配客户**：此选项允许您根据客户名称和站点（客户上的标准网站字段）或您已创建并设为唯一\
  \ ID 或外部 ID 的任何字段，将您的 CSV 数据与 Salesforce 中可能已存在的客户进行匹配，如图 8-11 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig11_HTML.jpg](img/437055_1_En_8_Fig11_HTML.jpg)\
  \  \n   *图 8-11 – 您想要做什么？*\n\n   > **注意**  \n   > 您可以通过创建或编辑字段并选中“唯一”或“外部 ID”复选框，将以下任一数据类型字段设为唯一\
  \ ID 或外部 ID：`auto-number`、`email`、`number` 或 `text`。\n\n8. Salesforce 允许启用或禁用通过工作流规则或流程生成器创建的自动化流程。通过选中此框，您可以在此导入期间启用这些流程。如果您创建的自动操作包含电子邮件和任务，这一点很重要，因为这可能会对您的客户或用户造成困扰。例如，您可能有一个工作流规则，每次创建联系人时都会向该联系人发送欢迎邮件。如果您保持此选项处于选中状态，则所有导入的联系人都将收到此电子邮件。\n\
  \n9. 您还可以将所有导入的联系人分配到一个现有的营销活动。如果您选择此选项，则需要在导入文件中包含一列，其中包含该营销活动的 Salesforce ID。\n\
  \n10. 在“您的数据位于何处？”问题下，您可以将 CSV 文件拖放到“将 CSV 文件拖到此处以上传”区域，如图 8-12 所示。您也可以单击 CSV、Outlook\
  \ CSV、ACT! CSV 或 Gmail CSV，然后单击“选择文件”。在您的计算机上找到该文件，然后单击“打开”。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig12_HTML.jpg](img/437055_1_En_8_Fig12_HTML.jpg)\
  \  \n    *图 8-12 – 您的数据位于何处？*\n\n11. 完成这些步骤后，单击屏幕右下角的 `Next` 按钮，如图 8-13 所示。\n\n\
  \    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig13_HTML.jpg](img/437055_1_En_8_Fig13_HTML.jpg)\
  \  \n    *图 8-13 – 单击屏幕上的“下一步”按钮*\n\n\n12. 在 `Edit Mapping`（编辑映射）字段中，你可以在此处选择将哪个列标题映射到账户或联系人的哪个\
  \ Salesforce 字段。如果正确设置了列标题，你会看到 Salesforce 会将所有列与 Salesforce 中的字段匹配起来，如图 8-14 所示。在图\
  \ 8-15 中，你会看到标题与字段名称不匹配。如果你的列标题没有与它们所映射的字段名称匹配，则可以按照步骤 13 和 14 中的附加步骤进行操作。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig15_HTML.jpg](img/437055_1_En_8_Fig15_HTML.jpg)\n\
  \n图 8-15：当列标题未与 Salesforce 中的字段名称匹配时的字段映射\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig14_HTML.jpg](img/437055_1_En_8_Fig14_HTML.jpg)\n\
  \n图 8-14：当列标题与 Salesforce 中的字段名称正确匹配时的字段映射\n\n13. 如果看到一个带有感叹号的三角形，这意味着映射存在错误，如图\
  \ 8-16 所示。将鼠标悬停在该图标上即可显示错误消息。大多数情况下，这是因为您将一个列映射到了多个字段。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig16_HTML.jpg](img/437055_1_En_8_Fig16_HTML.jpg)\n\
  \n图 8-16：显示小三角形符号\n\n**注意** 如果您的导入需要两个字段同时更新相同的信息，则您需要创建两个列，每个列中包含相同的数据，并将这些列分别映射到各自的字段。导入工具一次只能链接到一个数据点。\n\
  \n14. 如果看到某个字段以红色粗体显示，如图 8-15 所示，则表示该字段仍需要映射。要映射一个字段或更改已映射的字段，请单击 `Map`（映射）或 `Change`（更改）超链接。您可以输入字段名称，也可以使用滚动条查找字段。选择合适的字段后，单击\
  \ `Map`（映射），如图 8-17 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig17_HTML.jpg](img/437055_1_En_8_Fig17_HTML.jpg)\n\
  \n图 8-17：使用数据导入向导映射字段\n\n**注意** 如果您在导入时没有创建记录所有者字段，则创建的记录将自动分配给执行导入的用户。如果您的安全设置阻止用户查看数据，这可能会影响您的组织。例如，如果设置了角色层级，而您位于层级顶端并作为导入用户，那么层级低于您的用户可能无法看到您导入的记录。这最终意味着他们无法完成工作。\n\
  \n15. 确认所有列都已映射到相应的字段后，单击右下角的 `Next`（下一步）按钮，如图 8-18 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig18_HTML.jpg](img/437055_1_En_8_Fig18_HTML.jpg)\n\
  \n图 8-18：单击“下一步”按钮继续\n\n16. `Review & Start Import`（审阅并开始导入）屏幕会汇总您要导入的对象、导入类型（插入、更新、更新插入）、导入所使用的\
  \ CSV 文件、已映射的字段数以及未映射的字段数，如图 8-19 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig19_HTML.jpg](img/437055_1_En_8_Fig19_HTML.jpg)\n\
  \n图 8-19：单击“开始导入”前的导入审阅\n\n17. 审阅完这些信息并确认无误后，单击 `Start Import`（开始导入）按钮，如图 8-20 所示。\n\
  \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig20_HTML.jpg](img/437055_1_En_8_Fig20_HTML.jpg)\n\
  \n图 8-20：开始导入按钮\n\n18. 在祝贺页面上，单击 `OK`（确定）按钮，您将跳转到批量数据加载请求和状态页面，如图 8-21 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig21_HTML.jpg](img/437055_1_En_8_Fig21_HTML.jpg)\n\
  \n图 8-21：确定按钮\n\n19. 如果导入的数据量很大（数万行），则处理作业可能需要长达数小时。如果是小规模导入，您可能会发现单击 `OK`（确定）后作业即完成，如图\
  \ 8-22 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig22_HTML.jpg](img/437055_1_En_8_Fig22_HTML.jpg)\n\
  \n图 8-22：导入摘要\n\n20. 当作业完成时，Salesforce 会向您发送一封电子邮件，并附上一个错误文件以供您查看导入中的任何错误。某些错误可能包括数据类型不匹配。另一种可能的情况是\
  \ Salesforce 检测到一个空行，如图 8-23 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig23_HTML.jpg](img/437055_1_En_8_Fig23_HTML.jpg)\n\
  \n图 8-23：导入完成时收到的电子邮件\n\n\n#### 导入潜在客户\n\n理想情况下，您会发现需要不断导入新的潜在客户！无论是从参加的会议中获取的新线索，还是从购买的列表中获得，您都希望立即导入它们，以便您的销售团队能够跟进处理！以下步骤将向您展示如何快速完成此操作：\n\
  \n1.  准备要导入的数据。确保导入文件中的所有必填字段都已作为列填充。标准的`Salesforce`设置要求包含姓氏、公司名称和潜在客户状态。\n\n2.\
  \  导航至`Setup`菜单，如图 8-24 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig24_HTML.jpg](img/437055_1_En_8_Fig24_HTML.jpg)\n\
  \n图 8-24  \n导航至`Salesforce`中的“设置”区域\n\n3.  在`Quick Find`区域，输入`Data import`（不要按`Enter`键；选项会随您的输入自动填充）。点击`Data\
  \ Import Wizard`，如图 8-25 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig25_HTML.jpg](img/437055_1_En_8_Fig25_HTML.jpg)\n\
  \n图 8-25  \n搜索`Data Import Wizard`\n\n4.  点击绿色的`Launch Wizard!`按钮，如图 8-26 所示。\n\n\
  ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig26_HTML.jpg](img/437055_1_En_8_Fig26_HTML.jpg)\n\
  \n图 8-26  \n启动`Salesforce`向导\n\n5.  在“您要导入哪种类型的数据？”问题下，点击`Standard objects`选项卡上的`Leads`，如图\
  \ 8-27 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig27_HTML.jpg](img/437055_1_En_8_Fig27_HTML.jpg)\n\
  \n图 8-27  \n您要导入哪种类型的数据？\n\n6.  在“您想要做什么？”问题下，点击“添加新记录”，将显示以下信息：\n    *   `Match\
  \ Lead by`（匹配依据）：这允许您根据潜在客户的**全名**、**电子邮件**或您创建并设置为唯一 ID 或外部 ID 的任何字段，将 CSV 数据与`Salesforce`中已有的潜在客户或联系人进行匹配。这有助于防止导入重复数据。您应选择您认为最匹配的选项。最常用的是电子邮件。\n\
  \    *   `Assign New Leads to this Source`（将此来源分配给新潜在客户）：这允许您选择所有潜在客户应分配到的**潜在客户来源**。如果您的导入数据来源单一，可以使用此功能。例如，如果您刚参加完一个会议，并希望显示所有这些潜在客户都来自该会议，您可以在此列表中全局分配所有导入的潜在客户到该来源。如果您的潜在客户来源混杂，则应忽略此选项。\n\
  \    *   `Assign all leads using Assignment rules`（使用分配规则分配所有潜在客户）：这允许您利用已创建的潜在客户分配规则来自动分配**所有者**。下拉菜单应包含您在潜在客户分配中创建的所有选项。如果您导入的所有潜在客户都需要分配给特定用户，则可以忽略此功能。但是，如果您购买了列表，这些线索对任何人开放，您可能希望让自动分配规则来处理谁获得哪些线索。\n\
  \    *   `Assign leads to campaigns`（将潜在客户分配给营销活动）：这允许您将所有导入的潜在客户添加到一个**营销活动**中。您只需确保在电子表格中包含一列，其中含有该营销活动的\
  \ ID。如果您希望将所有导入的潜在客户与某个活动或邮件群发营销活动关联起来，可以使用此功能。\n\n7.  `Salesforce`允许启用或禁用通过工作流规则或`Process\
  \ Builder`创建的自动化流程。通过勾选复选框，您可在本次导入期间启用这些自动化流程。如果您创建了包含电子邮件和任务的操作，这一点很重要，因为可能会对您的客户或用户造成干扰。\n\
  \n8.  在“您的数据位于何处？”问题下，您可以将 CSV 文件拖放到“将 CSV 文件拖放到此处以上传”区域，如图 8-28 和 8-29 所示。您也可以点击`CSV`、`Outlook\
  \ CSV`、`ACT! CSV`或`Gmail CSV`。然后点击`Choose File`，在您的计算机上找到该文件，并点击`Open`。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig29_HTML.jpg](img/437055_1_En_8_Fig29_HTML.jpg)\n\
  \n图 8-29  \n您的数据位于何处？\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig28_HTML.jpg](img/437055_1_En_8_Fig28_HTML.jpg)\n\
  \n图 8-28  \n您想要做什么？\n\n9.  完成这些步骤后，点击屏幕右下角的`Next`按钮，如图 8-30 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig30_HTML.jpg](img/437055_1_En_8_Fig30_HTML.jpg)\n\
  \n图 8-30  \n`Next`按钮\n\n10. 在`Edit Mapping`字段中，您可以选择将哪个列标题映射到潜在客户的哪个`Salesforce`字段。如果您的列标题设置正确，您会看到`Salesforce`会将您的所有列与`Salesforce`中的字段自动匹配，如图\
  \ 8-31 所示。在图 8-32 中，您会看到标题与字段名称不匹配。如果您未将列标题与它们映射到的字段名称匹配，则需要执行步骤 11 和 12。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig32_HTML.jpg](img/437055_1_En_8_Fig32_HTML.jpg)\n\
  \n图 8-32  \n当您未将列标题与`Salesforce`中的字段名称匹配时的字段映射\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig31_HTML.jpg](img/437055_1_En_8_Fig31_HTML.jpg)\n\
  \n图 8-31  \n当您正确地将列标题与`Salesforce`中的字段名称匹配时的字段映射\n\n11. 如果您看到某个字段以粗体红色显示，这意味着该字段仍需映射，如图\
  \ 8-33 所示。要映射字段或更改已映射的字段，请点击`Map`或`Change`超链接。您可以直接输入字段名称，或使用滚动条查找字段。选择合适的字段并点击`Map`，如图\
  \ 8-34 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig34_HTML.jpg](img/437055_1_En_8_Fig34_HTML.jpg)\n\
  \n图 8-34  \n选择字段\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig33_HTML.jpg](img/437055_1_En_8_Fig33_HTML.jpg)\n\
  \n图 8-33  \n显示为未映射的字段\n\n**注** 如果您没有创建记录所有者字段，并且没有选择在导入中使用潜在客户分配规则，则创建的记录将自动分配给执行导入的用户。如果您设置了限制用户查看数据的安全权限，这可能会影响您的组织。例如，如果您设置了角色层级，且您位于层级顶部并执行导入，则层级低于您的用户可能无法看到您导入的记录。这最终意味着他们无法正常工作。\n\
  \n12. 在您确认所有列都已映射到适当字段后，点击右下角的`Next`按钮，如图 8-35 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig35_HTML.jpg](img/437055_1_En_8_Fig35_HTML.jpg)\n\
  \n图 8-35  \n`Next`按钮\n\n13. `Review & Start Import`屏幕会汇总您要导入的对象、导入类型（`插入`、`更新`、`更新或插入`）、用于导入的\
  \ CSV 文件、已映射的字段数以及未映射的字段数，如图 8-36 所示。\n\n\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig36_HTML.jpg](img/437055_1_En_8_Fig36_HTML.jpg)\n\
  \n**图 8-36** – 导入审核\n\n14. 审核完此信息并确认无误后，点击`开始导入`按钮，如图 8-37 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig37_HTML.jpg](img/437055_1_En_8_Fig37_HTML.jpg)\n\
  \n**图 8-37** – `开始导入`按钮\n\n15. 在祝贺页面上点击`确定`按钮，即可进入批量数据加载作业请求和状态页面，如图 8-38 所示。\n\n\
  ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig38_HTML.jpg](img/437055_1_En_8_Fig38_HTML.jpg)\n\
  \n**图 8-38** – `确定`按钮\n\n16. 如果导入的数据量很大（数万行），正在处理的作业可能需要几个小时才能完成。如果导入的数据量较小，您可能会发现点击`确定`后作业就会立即完成，如图\
  \ 8-39 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig39_HTML.jpg](img/437055_1_En_8_Fig39_HTML.jpg)\n\
  \n**图 8-39** – 批量数据加载作业审核\n\n17. 作业完成后，Salesforce 还会向您发送一封电子邮件，并附上一个错误文件，供您查看导入过程中的任何错误。某些错误可能包括数据类型不匹配。另一种可能是\
  \ Salesforce 检测到了空行，如图 8-40 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig40_HTML.jpg](img/437055_1_En_8_Fig40_HTML.jpg)\n\
  \n**图 8-40** – 电子邮件确认\n\n## 排定数据导出\n\nSalesforce 是一款基于云的 CRM 和开发平台，只要您能连接到互联网，就可以随时随地访问它。如果您的互联网服务中断，或者您需要暂时离线工作，Salesforce\
  \ 允许您将数据导出到`CSV`文件中。或者，如果您和我们一样，希望保留数据备份，也可以这样做。您可以安排每月（对所有 Salesforce 版本免费）、每周或每天（根据\
  \ Salesforce 版本可能收费）的定期导出，并让系统通过电子邮件将数据发送给您。或者，您也可以执行一次性导出。\n\n1. 导航到`设置`菜单，如图 8-41\
  \ 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig41_HTML.jpg](img/437055_1_En_8_Fig41_HTML.jpg)\n\
  \n**图 8-41** – 导航到`设置`区域\n\n2. 在`快速查找`区域，输入`数据导出`（无需按`回车`键；选项会随着您的输入自动出现）。点击`数据导出`，如图\
  \ 8-42 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig42_HTML.jpg](img/437055_1_En_8_Fig42_HTML.jpg)\n\
  \n**图 8-42** – 搜索`数据导出`\n\n3. 要排定导出，请点击`排定导出`按钮；要创建一次性导出，请点击`立即导出`，如图 8-43 所示。\n\
  \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig43_HTML.jpg](img/437055_1_En_8_Fig43_HTML.jpg)\n\
  \n**图 8-43** – 每月导出服务选项\n\n4. 要排定导出，请选择导出应执行的频率。对于每月导出，您可以选择应在每月的哪一天执行，或者选择每周的第几天（如第一个、第二个、第三个、第四个或最后一个特定工作日）。您还可以选择排程的开始日期、结束日期以及应开始的时间，如图\
  \ 8-44 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig44_HTML.jpg](img/437055_1_En_8_Fig44_HTML.jpg)\n\
  \n**图 8-44** – 频率\n\n> **注意：** 开始时间并不能保证数据会在那个时间送达。根据您的数据量，完成整个过程可能需要几个小时。\n\n5.\
  \ 您可以通过勾选页面顶部的复选框，选择将图像、文档、附件、Salesforce 文件和 CRM 内容文档版本包含在导出中，如图 8-45 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig45_HTML.jpg](img/437055_1_En_8_Fig45_HTML.jpg)\n\
  \n**图 8-45** – 选择要包含的内容\n\n6. 您还可以仅选择要导出的特定对象，或者您可以选择右上角的选项以包含所有数据，如图 8-46 所示。\n\
  \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig46_HTML.jpg](img/437055_1_En_8_Fig46_HTML.jpg)\n\
  \n**图 8-46** – 要导出的对象\n\n7. 导出设置完成后，点击`保存`按钮。\n\n8. 如果您已排定导出，则会看到一个黄色框，其中显示下次排定导出的运行时间，如图\
  \ 8-47 所示。如果导出已排定执行，则会有备注说明由谁排定、排定时间以及将以何种格式接收信息，如图 8-48 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig48_HTML.jpg](img/437055_1_En_8_Fig48_HTML.jpg)\n\
  \n**图 8-48** – 导出排定响应\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig47_HTML.jpg](img/437055_1_En_8_Fig47_HTML.jpg)\n\
  \n**图 8-47** – 立即导出响应\n\n9. 导出准备就绪后，Salesforce 会通过电子邮件向您发送一个链接，指向`设置`菜单中的数据导出，如图\
  \ 8-49 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig49_HTML.jpg](img/437055_1_En_8_Fig49_HTML.jpg)\n\
  \n**图 8-49** – Salesforce 发送的电子邮件，告知您的数据导出已接收\n\n10. 此处需要点击下载超链接来下载文件，随后需要将该文件存储到一台机器上，如图\
  \ 8-50 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig50_HTML.jpg](img/437055_1_En_8_Fig50_HTML.jpg)\n\
  \n**图 8-50** – 在收到的电子邮件中，会有一个链接将您引导回 Salesforce 以下载您的文件\n\n11. 文件将下载为一个 zip 压缩包，您需要解压缩后才能使用。所有对象都将被拆分成独立的`CSV`文件，如图\
  \ 8-51 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig51_HTML.jpg](img/437055_1_En_8_Fig51_HTML.jpg)\n\
  \n**图 8-51** – 显示所有对象被拆分为单独的`CSV`文件\n\n\n\n## 重复数据管理\n\nSalesforce 中的另一个出色功能是设置重复规则。重复规则允许您创建规则，系统将针对任何新客户、联系人或潜在客户检查这些规则，从而防止用户创建重复记录。Salesforce\
  \ 默认提供以下重复规则：\n\n- **标准客户重复规则**：将验证新创建的客户是否与现有客户的以下任意客户字段组合相匹配：\n    1. `Account\
  \ Name` 和 `Billing Street`\n    2. `Account Name` 和 `City` 和 `State`\n    3. `Account\
  \ Name` 和 `Zip Code`\n    4. `Account Name` 和 `Phone`\n    5. `Account Website`\
  \ 和 `Phone`\n    6. `Account Website` 和 `Billing Street`\n\n- **标准联系人重复规则**：将验证新创建的联系人是否与现有联系人的以下任意联系人字段组合相匹配：\n\
  \    1. `First Name` 和 `Last Name` 和 `Title` 和 `Account Name`\n    2. `First Name`\
  \ 和 `Last Name` 和 `Email`\n    3. `First Name` 和 `Last Name` 和 `Phone` 和 `Company\
  \ Name`\n    4. `First Name` 和 `Last Name` 和 `Mailing Street` 和 (`City` 或 `Zip Code`\
  \ 或 `Phone`)\n    5. `First Name` 和 `Last Name` 和 `Mailing Street` 和 `Title`\n \
  \   6. `First Name` 和 `Last Name` 和 `Title` 和 `Email`\n    7. `First Name` 和 `Last\
  \ Name` 和 `Phone`\n\n- **标准潜在客户重复规则**：将验证新创建的潜在客户是否与现有潜在客户的以下任意潜在客户字段组合相匹配：\n  \
  \  1. `First Name` 和 `Last Name` 和 `Title` 和 `Account Name`\n    2. `First Name`\
  \ 和 `Last Name` 和 `Email`\n    3. `First Name` 和 `Last Name` 和 `Phone` 和 `Company\
  \ Name`\n    4. `First Name` 和 `Last Name` 和 `Mailing Street` 和 (`City` 或 `Zip Code`\
  \ 或 `Phone`)\n    5. `First Name` 和 `Last Name` 和 `Mailing Street` 和 `Title`\n \
  \   6. `First Name` 和 `Last Name` 和 `Title` 和 `Email`\n    7. `First Name` 和 `Last\
  \ Name` 和 `Phone`\n\n如果标准规则不适用于贵公司，您也可以创建自己的规则。例如，也许您有另一组更适合客户重复规则的字段组合。您的企业或许可以根据`Account\
  \ Name`和您收集的一个自定义字段来匹配客户。要创建新规则，请按照以下步骤操作：\n\n1.  转到设置菜单，搜索**重复规则**。单击**重复规则**，如图\
  \ 8-52 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig52_HTML.jpg](img/437055_1_En_8_Fig52_HTML.jpg)\n\
  \n图 8-52 – 选择重复规则\n\n2.  从**新规则**下拉菜单中，选择对象，在此示例中为`Account`，如图 8-53 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig53_HTML.jpg](img/437055_1_En_8_Fig53_HTML.jpg)\n\
  \n图 8-53 – 新客户规则\n\n3.  为您的重复规则命名。\n\n4.  添加描述。\n\n5.  设置记录级安全性。此选项仅影响具有共享规则的用户。\n\
  \    - **启用共享规则**意味着，如果您的用户对并非其拥有的客户可见性有限，他们将无法看到与这个新创建客户匹配的其他客户。\n    - **绕过共享规则**意味着，如果匹配规则已激活，您允许用户查看他们不拥有的客户。\n\
  \n6.  在**操作**部分，您可以选择允许用户在重复规则检查被激活的情况下创建或编辑客户。另一个选项是**阻止**，这将阻止用户保存记录。您也可以选择通过提醒框中的消息来提醒他们。报表选项会将重复的客户/联系人/潜在客户包含在列表视图中，如图\
  \ 8-54 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig54_HTML.jpg](img/437055_1_En_8_Fig54_HTML.jpg)\n\
  \n图 8-54 – 重复规则，步骤 3 至 6\n\n7.  您可以选择一个已创建的现有匹配规则，或者从下拉菜单中选择**创建新的匹配规则**，如图 8-55\
  \ 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig55_HTML.jpg](img/437055_1_En_8_Fig55_HTML.jpg)\n\
  \n图 8-55 – 创建新的匹配规则\n\n8.  单击**保存重复规则**，如图 8-56 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig56_HTML.jpg](img/437055_1_En_8_Fig56_HTML.jpg)\n\
  \n图 8-56 – 保存您的重复规则\n\n9.  为您的匹配规则命名，然后按`Tab`键，让 Salesforce 生成唯一名称。\n\n10. 为您的匹配规则添加描述。\n\
  \n11. 匹配条件部分即您创建规则本身的地方。从字段列中，选择您将用作匹配规则一部分的字段。在此示例中，您有`Account Name`。在**匹配方法**中，您可以选择`Exact`，或者对于某些字段，可以选择`Fuzzy`。`Fuzzy`方法会剔除客户名称中的\
  \ *Inc* 或 *Corporation* 等字样，并查看是否能匹配两个名称中不含这些字样的客户。`Fuzzy`方法因字段而异；要查看这些方法的完整列表，请访问[`help.salesforce.com/`](https://help.salesforce.com/)并搜索*与匹配规则一起使用的匹配方法*。\n\
  \n12. 选择**匹配空白字段**，以允许您的条件在字段为空时进行匹配。例如，如果记录中的客户名称相同，并且两者的自定义字段均为空且这两项均已勾选，则条件将匹配，并且您的用户将收到提醒。我建议使用精确值并同时匹配空白字段。\n\
  \n13. 您还可以选择筛选逻辑是应使用`AND`包含所有上述字段，还是应使用`OR`包含部分而非全部字段。\n\n14. 单击**保存**，如图 8-57 所示。\n\
  \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig57_HTML.jpg](img/437055_1_En_8_Fig57_HTML.jpg)\n\
  \n图 8-57 – 创建匹配规则\n\n15. 务必通过单击**激活**按钮来激活您的匹配规则，如图 8-58 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig58_HTML.jpg](img/437055_1_En_8_Fig58_HTML.jpg)\n\
  \n图 8-58 – 激活您的匹配规则\n\n16. 返回重复规则区域（参见步骤 1），单击所创建规则的名称，然后激活该重复规则，如图 8-59 所示。\n\n\
  ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig59_HTML.jpg](img/437055_1_En_8_Fig59_HTML.jpg)\n\
  \n图 8-59 – 激活您的重复规则\n\n\n\n### 批量删除记录\n\nSalesforce 为帐户、潜在客户、活动、联系人、个案、解决方案、产品和报告提供了`批量删除记录`选项。该选项尤为重要，因为它能让你清理数据库。如果你允许或不维护\
  \ Salesforce CRM，并将对你或员工毫无意义的记录留在其中，最终就会产生“脏数据”。含有脏数据的 CRM 几乎与没有 CRM 一样无用。请记住，CRM\
  \ 的价值完全取决于其中的数据质量。因此，Salesforce 为你提供了批量删除的工具。例如，假设你刚参加完一场会议，捕获了所有新的潜在客户，于是你直接导入了它们。然而，在审查导入结果后，你发现导入的是错误的列表，而且还是一个旧列表。你需要删除这些记录！接下来的几个步骤将帮你清理数据库：\n\
  \n1.  进入“设置”菜单，搜索 `批量删除记录`。点击 `批量删除记录`，如图 8-60 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig60_HTML.jpg](img/437055_1_En_8_Fig60_HTML.jpg)\n\
  \n    图 8-60 找到“批量删除记录”功能\n\n2.  点击你想要删除记录的对象选项。在前面的例子中，是潜在客户，如图 8-61 所示。\n\n  \
  \  ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig61_HTML.jpg](img/437055_1_En_8_Fig61_HTML.jpg)\n\
  \n    图 8-61 批量删除记录的选择\n\n3.  确定需要删除数据的具体条件。在这个例子中，我们知道创建日期是昨天。或者潜在客户来源是某次特定的会议。对象上的几乎任何字段都可以用作查找需要删除记录的条件。\n\
  \n4.  在第一列中，选择字段。\n\n5.  在第二列中，选择匹配方式。\n\n6.  在第三列中，输入你的值。\n\n7.  点击“搜索”按钮，如图 8-62\
  \ 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig62_HTML.jpg](img/437055_1_En_8_Fig62_HTML.jpg)\n\
  \n    图 8-62 设置条件以查找需要删除的记录\n\n8.  选择你想要删除的记录，或勾选顶部的复选框以选择所有记录。\n\n9.  如果你确定之后不再需要找回这些记录，请勾选“永久删除”复选框。\n\
  \n    **注意** 已删除的记录会进入回收站，并在 15 天后自动删除，或者如果回收站已满，则删除最早的记录。\n\n10. 准备好删除记录时，点击“删除”按钮，如图\
  \ 8-63 所示。\n\n    **注意** 每次只能批量删除 250 条记录。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig63_HTML.jpg](img/437055_1_En_8_Fig63_HTML.jpg)\n\
  \n    图 8-63 批量删除你的记录\n\n### 批量转移记录\n\nSalesforce 提供了一个工具，可以帮助你将帐户、潜在客户、宏或流媒体频道记录的所有权转移给另一个用户。这允许你将一个用户拥有的所有记录转移给另一个用户，并且可以基于记录的条件进行转移。如果你有员工离职或晋升，这将是一个重要的工具！例如，如果一名员工即将离职，并且他拥有许多需要由另一名员工管理的帐户，你可以使用此工具将这些帐户转移给新用户。\n\
  \n1.  进入“设置”菜单，搜索 `批量转移记录`，然后点击该短语，如图 8-64 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig64_HTML.jpg](img/437055_1_En_8_Fig64_HTML.jpg)\n\
  \n    图 8-64 在“设置”菜单中搜索“批量转移记录”\n\n2.  在本节引言部分的例子中，你需要将帐户从一个离职用户转移给另一个用户。为此，请点击“转出帐户”链接，如图\
  \ 8-65 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig65_HTML.jpg](img/437055_1_En_8_Fig65_HTML.jpg)\n\
  \n    图 8-65 “转出帐户记录”界面\n\n3.  使用放大镜图标，搜索你要从其转出记录所有权的用户。\n\n4.  使用放大镜图标，搜索你要向其转入记录所有权的用户。\n\
  \n5.  通常，你不应将已关闭或已完成的记录从一个用户转移给另一个用户。我们建议你以此方式保留业务历史记录。因此，在图 8-66 中，你将看到我们只选择了“转移未结机会”和“转移未结个案”。\n\
  \n6.  如果你希望一个用户拥有的所有记录都转移给另一个用户，你可以将此部分留空。否则，如果你只想根据记录的条件转移特定记录，则需使用此部分。请注意，你只能使用“并且\
  \ (AND)”逻辑。这意味着你在此处设置的每组条件都将用于搜索记录。例如，如果你将“类型”字段设置为“客户-渠道”，并将“帐单所在州”设置为“加利福尼亚”，那么记录必须同时满足这两个值，才可被转移。\n\
  \    -   找到你要筛选的字段。例如，如果你在帐户上使用“类型”字段，并且只想将特定类型的帐户转移给新用户。\n    -   使用适当的匹配方式：等于、包含、小于、大于等等。在此例中，我们只想要特定类型的帐户，因此使用“等于”。\n\
  \    -   输入条件应满足的值。在此例中，是“类型”等于“客户-渠道”的帐户。\n\n7.  完成条件设置后，点击“查找”按钮以查找符合条件的记录，如图\
  \ 8-66 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig66_HTML.jpg](img/437055_1_En_8_Fig66_HTML.jpg)\n\
  \n    图 8-66 设置批量转移记录\n\n8.  使用表头中的复选框选择所有要转移的记录，或使用帐户名称旁的复选框单个选择用户。\n\n9.  选择所有记录后，点击“转移”按钮，如图\
  \ 8-67 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig67_HTML.jpg](img/437055_1_En_8_Fig67_HTML.jpg)\n\
  \n    图 8-67 选择要转移的记录\n\n完成后，你应该会看到已转移记录的计数，如图 8-68 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig68_HTML.jpg](img/437055_1_En_8_Fig68_HTML.jpg)\n\
  \n图 8-68 已转移记录的计数\n\n## 总结\n\nSalesforce 提供了众多触手可及的工具。有了上述所有数据工具，你应该不会再遇到脏数据的问题。如果你任由脏数据失控，它将成为你和用户的负担。只要手头有合适的工具，你就永远没有理由让其发展到那一步。\n\
  \n\n\n"
- "# 9. 安全概览\n\nSalesforce 致力于运营最安全的云平台。保护数据完整性和隐私是 Salesforce 商业模式的核心。Salesforce\
  \ 采用多层架构来保障安全，支持更高的灵活性和保护性。系统管理员可以完全控制授予最终用户的访问级别。您可以使用 `profiles`、`permission sets`、字段级安全性、共享规则等来保护敏感信息并管理最终用户的可访问性。请访问\
  \ Salesforce Trust 网站 [`http://trust.salesforce.com`](http://trust.salesforce.com)（图\
  \ 9-1），以透明地获取安全威胁和建议。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig1_HTML.jpg](img/437055_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1\n\nSalesforce Trust 网站\n\n## Salesforce 安全模型\n\n控制对您 Salesforce 组织的访问级别对于确保客户和数据保护至关重要。虽然\
  \ Salesforce 致力于最高级别的数据保护，但您的系统管理员应配置安全设置，以使系统尽可能安全。通过考虑数据的主要风险来设计安全计划，然后了解 Salesforce\
  \ 共享架构及其组件，以正确配置您的安全设置。\n\n基础知识 数据可以在 Salesforce 中的不同级别进行保护和分层。访问权限通过三种方式保护：对象级别、字段级别和记录级别。用数据库术语来说，对象就是一张表。`Objects`\
  \ 保存可能相关的信息分组。这包括存在于其中的记录。`Records` 是表中包含的信息行。\n\n`Accounts`、`contacts` 和 `opportunities`\
  \ 只是标准 Salesforce 对象的几个示例。图 9-2 显示了 `Account` 对象中账户记录的列表视图。Cloud Creations HQ 是\
  \ `Account` 对象中账户记录的一个示例，如图 9-2 所示。\n\n每条记录都存储关键信息片段。这些被称为 `fields`。用数据库术语来说，字段是表中的列。在图\
  \ 9-2 中，账户名称、账户站点和电话都是账户记录中字段的示例。请参阅图 9-2 来识别对象、记录和字段之间的区别。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig2_HTML.jpg](img/437055_1_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2\n\n识别对象、记录和字段\n\n## 简档和权限集\n\n`Profiles` 包含一组设置，用于确定用户或用户组在 Salesforce 中可以看到和执行的操作。`permission\
  \ set` 包含相同的管理设置集合，但可以作为额外的权限层分配给单个用户或用户组。\n\n### 注意\n\n最佳实践是为单个用户分配 `permission\
  \ set`，而不是创建无数个简档来分配适当的设置和权限。\n\n### 简档\n\n所有用户都必须分配一个 `profile`，并且一个简档可以分配给多个用户。但是，一个用户只能被分配一个简档。通常，简档根据用户的工作职能进行分配。这通常是因为具有相同工作描述的用户通常需要相似的访问级别。\n\
  \n例如，您可能为营销用户、客服人员、销售代表和开发人员设置不同的安全要求。建议您创建或修改简档以满足他们的特定要求。\n\n#### 简档主页\n\n我们建议您熟悉简档主页上的不同简档设置。此页面分为以下权限和设置。\n\
  \n##### 控制台设置\n\n点击 `Edit` 以控制每个简档的控制台设置（如图 9-3 所示）。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig3_HTML.jpg](img/437055_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3\n\n控制台设置\n\n##### 页面布局\n\n可以为每个简档配置页面布局。点击所需对象旁边的 `View Assignment`，为简档配置不同的页面布局（如图\
  \ 9-4 所示）。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig4_HTML.jpg](img/437055_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4\n\n您可以在简档级别控制每个对象的页面布局。\n\n##### 字段级安全性\n\n一旦授予了对象级访问权限和记录级访问权限，您就可以控制在简档级别哪些字段可见。导航到字段级别，点击所需对象旁边的\
  \ `View`，以控制简档应对某个字段拥有的访问级别。点击 `View` 后，您将看到与该对象相关的所有字段列表以及当前的字段级权限。点击 `Edit` 以更改相应字段（如图\
  \ 9-5 所示）。\n\n点击 `Read Access` 可使字段可见。选择 `Edit Access` 以允许用户查看和编辑字段。取消选择 `Read Access`\
  \ 和 `Edit Access` 可使字段隐藏。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig5_HTML.jpg](img/437055_1_En_9_Fig5_HTML.jpg)\n\
  \n图 9-5\n\n账户级别的字段级安全性\n\n让我们看一个例子。假设 Michael Scott Paper Co. 使用 Salesforce 来跟踪销售和会计信息。但是，CEO\
  \ Michael Scott 不希望销售代表看到敏感的财务信息，如信用卡号和社会安全号码。\n\n为了解决这个问题，为销售代表创建一个简档，为会计部门创建另一个简档。对于每个简档，点击账户旁边的\
  \ `View Assignment` 并编辑字段安全性。对于销售代表简档，取消选择信用卡和社会安全号码字段中的 `Read Access` 和 `Edit Access`。这将从分配给销售代表简档的用户那里隐藏这两个字段。以分配给销售代表简档的用户身份登录以测试您的操作。\n\
  \n##### 应用程序和选项卡设置\n\n在简档的 `Custom App Settings` 部分指定哪些应用程序可见并设置默认值（如图 9-6 所示）。\n\
  \n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig6_HTML.jpg](img/437055_1_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6\n\n简档中的自定义应用程序设置区域\n\n##### 记录类型设置\n\n记录类型可以在简档级别分配。对于有记录类型的对象，请在相应对象旁边添加记录类型。\n\
  \n##### 管理权限和常规用户权限\n\n简档有两种权限类型：管理权限和常规权限，如图 9-7 和 9-8 所示。熟悉这些精细的权限类型，以便您能更好地管理一个安全的组织。\n\
  \n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig8_HTML.jpg](img/437055_1_En_9_Fig8_HTML.jpg)\n\
  \n图 9-8\n\n简档级别的常规用户权限部分\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig7_HTML.jpg](img/437055_1_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7\n\n位于简档中的管理权限部分\n\n\n\n## 对象级安全\n\n对象级安全存储在配置文件的 `对象权限` 部分。作为起点，用户必须对某个对象拥有适当的访问级别，才能查看该对象及其中的记录。您可以在配置文件中控制对象级安全，如图\
  \ 9-3 所示。\n\n以下是用于设置用户对每个对象访问级别的不同权限类型：\n\n- **`读取`**：用户可以查看记录。\n- **`创建`**：用户可以创建记录。\n\
  - **`编辑`**：用户可以读取和编辑此对象中存储的记录。\n- **`删除`**：用户有权读取、编辑和删除记录。\n- **`查看全部`**：用户可以查看此对象中存储的所有记录。\n\
  - **`修改全部`**：用户可以修改此对象中存储的所有记录。\n\n为标准对象和自定义对象设置 `对象级安全`。定义配置文件应具有 `读取`、`创建`、`编辑`、`删除`、`查看全部`\
  \ 或 `修改全部` 权限，如图 9-9 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig9_HTML.jpg](img/437055_1_En_9_Fig9_HTML.jpg)\n\
  \n**图 9-9** — 设置对象级安全\n\n## 密码策略、登录时段和 IP 范围\n\n您可以指定密码过期时间、密码要求、会话超时等。您还可以控制每个配置文件的登录时段和可接受的\
  \ IP 范围。\n\n## 分配配置文件\n\n共有六种不同类型的标准配置文件：\n\n- **`系统管理员`**：将此配置文件分配给需要访问许可证内所有功能的用户。此配置文件拥有查看和修改所有数据的权限。\n\
  - **`标准用户`**：此配置文件具有核心平台功能。他们可以查看、编辑和删除其有权访问的记录。\n- **`解决方案经理`**：此配置文件拥有与 `标准用户`\
  \ 相同的功能，并增加了管理已发布解决方案的权限。\n- **`营销用户`**：此配置文件拥有与 `标准用户` 相同的功能，并增加了导入潜在客户、管理营销活动和管理沟通模板的权限。\n\
  - **`合同经理`**：此配置文件拥有与 `标准用户` 相同的功能，并增加了管理和审批合同的权限。\n- **`只读`**：此配置文件只能查看其有权访问的记录，并运行报告和导出数据。\n\
  \n## 创建自定义配置文件\n\n创建自定义配置文件，为不同的用户组构建一套独特的权限集。请按照以下步骤创建自定义配置文件：\n\n1. 从 `设置` 菜单中搜索并选择\
  \ `配置文件`（如图 9-10 所示）。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig10_HTML.jpg](img/437055_1_En_9_Fig10_HTML.jpg)\n\
  \   **图 9-10** — 在 Salesforce 中导航到 `配置文件`\n\n2. 要创建新配置文件，请单击 `新建配置文件`，如图 9-11 所示。\n\
  \   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig11_HTML.jpg](img/437055_1_En_9_Fig11_HTML.jpg)\n\
  \   **图 9-11** — 配置文件主页上的 `新建配置文件` 按钮\n\n3. 要创建自定义配置文件，您必须从现有的标准配置文件克隆一个。选择一个要克隆的标准配置文件，然后单击\
  \ `克隆`。\n\n4. 输入新配置文件的名称，然后单击 `保存`，如图 9-12 所示。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig12_HTML.jpg](img/437055_1_En_9_Fig12_HTML.jpg)\n\
  \   **图 9-12** — 命名您的自定义配置文件\n\n要完成对此配置文件查看和操作权限的更改，请单击配置文件名称旁边的 `编辑`。根据您的新配置文件修改相应的权限，如图\
  \ 9-13 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig13_HTML.jpg](img/437055_1_En_9_Fig13_HTML.jpg)\n\
  \n**图 9-13** — 配置文件主页\n\n> **注意**：所有用户都必须有一个分配的配置文件，并且配置文件可以分配给多个用户。但是，每个用户只能分配一个配置文件。\n\
  >\n> 那么，当您需要向单个用户授予额外权限时，该怎么办？\n>\n> 例如，假设您想将 `创建报告` 权限扩展到单个用户。我们建议创建权限集，而不是创建新配置文件或编辑现有配置文件上的权限。\n\
  \n## 权限集\n\n权限集是一组权限和设置，可以分配给需要的用户。\n\n请按照以下步骤创建权限集：\n\n1. 在 `设置` 中搜索 `权限`，然后单击\
  \ `权限集`。\n\n2. 单击 `新建` 按钮创建新的权限集，如图 9-14 所示。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig14_HTML.jpg](img/437055_1_En_9_Fig14_HTML.jpg)\n\
  \   **图 9-14** — 权限集主页\n\n3. 在 `标签` 字段中输入权限集名称，并提供详细描述，如图 9-15 所示。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig15_HTML.jpg](img/437055_1_En_9_Fig15_HTML.jpg)\n\
  \   **图 9-15** — 创建权限集的步骤\n\n4. 选择将使用此权限集的用户类型。\n\n> **提示**：最佳实践是为您的权限集添加描述。当存在多个权限集时，这使其更易于查找。\n\
  \n## 记录级安全\n\n记录级安全指定用户在每个对象中可以查看和编辑哪些记录。\n\n### 记录所有权\n\nSalesforce 中的每条记录都必须有一个所有者。所有者可以是用户或队列。默认情况下，记录所有者拥有完全访问权限。这意味着他们可以查看、编辑、删除、转移和共享记录。\n\
  \n## 组织范围默认值\n\n默认情况下，您的 Salesforce 组织以公共共享模型运行。我们称之为*组织范围默认值*（OWD）。这意味着，只要用户具有适当的对象级安全，他们就可以按对象查看和编辑所有数据。要限制某些记录的可见性，请考虑对该对象使用私有共享模型。\n\
  \n### 私有还是公共？\n\n在考虑对某个对象使用私有还是公共模式时，请思考：您的数据中是否有任何部分应限制给特定用户？\n\n如果答案是肯定的，那么您应该对该对象使用私有共享模型。\n\
  \n如前文图 9-2 所示，组织范围默认值具有最高级别的限制。这是唯一限制访问的安全组件。\n\n所有其他安全组件都旨在共享访问权限。通过角色、手动共享和共享规则，可以将记录访问权限开放给特定用户或用户组。\n\
  \n\n\n### 更改共享设置\n\n如需修改组织的默认设置，请导航至`设置`中的`共享设置`。\n\n要控制外部用户的共享设置，必须首先启用外部共享。在`设置`区域的`快速查找`中选择`共享设置`，然后点击`启用外部共享`。\n\
  \n此处可按对象查看内外部用户的访问级别，如图 9-16 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig16_HTML.jpg](img/437055_1_En_9_Fig16_HTML.jpg)\n\
  \n图 9-16\n\n默认组织范围设置\n\n外部用户包括社区用户、访客用户、网站用户、`Chatter`外部用户和门户用户。您可以为内部和外部用户分别设置每个对象的共享设置。\n\
  \n选择`编辑`可将设置更改为以下任一选项：\n\n*   `私有`：此对象中的所有记录均为私有，仅记录所有者、角色或共享规则可见。\n*   `公开只读`：此对象中的所有记录以只读形式可见。\n\
  *   `公开读写`：此对象中的所有记录对所有用户可见且可修改。\n*   `公开读/写/转让`：此对象中的所有记录对所有用户可见、可修改且可转让。\n*  \
  \ `由父对象控制`：用户在主从关系的明细对象上拥有相同级别的访问权限。\n\n选择`标准报表可见性`可启用对报表中数据的可见性，这些数据可能因组织范围默认设置而无法访问。\n\
  \n选择`手动用户记录共享`可允许用户手动将记录共享给其他用户。\n\n选择`经理组`可允许用户与其经理组共享记录，如图 9-17 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig17_HTML.jpg](img/437055_1_En_9_Fig17_HTML.jpg)\n\
  \n图 9-17\n\n其他安全设置\n\n## 角色层次结构\n\n一旦通过 OWD 限制了数据，您就可以使用角色层次结构来开放可见性并共享记录访问权限。角色定义了用户或用户组自上而下拥有的访问级别。记录访问权限会沿层次结构向上汇总。\n\
  \n例如，在`销售经理`下创建一个名为`销售代表`的分支，以便销售经理可以访问其下属销售代表的记录，如图 9-18 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig18_HTML.jpg](img/437055_1_En_9_Fig18_HTML.jpg)\n\
  \n图 9-18\n\n理解角色首页\n\n### 备注\n\n在设计角色结构图时，请记住角色层次结构不一定与您的执行组织架构图相同。通常，您是为层级结构中的每一级创建角色，而不是为每个职位创建。\n\
  \n如果某个角色在角色层次结构中位于其他角色之上，则该角色将被授予对该分支下所有记录的相同访问级别。因此，如果访问权限是只读的，则授予相同的记录访问级别。\n\n\
  ### 创建新角色\n\n使用角色来定义用户如何查看和共享记录。正确的角色结构取决于组织的文化。\n\n要创建角色，请遵循以下步骤：\n\n1.  在`快速查找`框中搜索`角色`，然后点击导航。\n\
  2.  选择`设置角色`。\n3.  选择`展开全部`以查看`Salesforce`的默认设置。\n4.  在相应分支下点击`添加角色`以在其下方添加一个分支（参见图\
  \ 9-19）。\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig19_HTML.jpg](img/437055_1_En_9_Fig19_HTML.jpg)\n\
  \n    图 9-19\n\n    展开的树形分支视图\n\n5.  填写以下详细信息以成功保存新角色，如图 9-20 所示：\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig20_HTML.jpg](img/437055_1_En_9_Fig20_HTML.jpg)\n\
  \n    图 9-20\n\n    创建新角色的步骤\n\n    1.  `标签`：这是用于命名角色的名称。示例可包括销售副总裁、区域经理等。按`Tab`键可自动填充角色名称。\n\
  \    2.  `角色名称`：这是唯一的 API 名称。此角色需向上级角色汇报。\n\n6.  将用户分配到指定的角色。\n\n通过选择分配，您可以搜索未分配的用户并将其连接到适当的角色。您也可以导航到用户的个人资料并选择`编辑`来分配角色。\n\
  \n### 共享规则\n\n您可以使用共享规则来向可能被排除在数据访问之外的特定角色、组或个人用户授予数据访问权限。共享规则可用于覆盖现有的安全限制。\n\n\
  ### 公共组\n\n可以创建组以简化共享和安全性。这可以包括个人、具有特定角色的用户或其他公共组的成员的组合。\n\n### 创建公共组\n\n在创建共享规则之前，您必须创建一个公共组。请遵循以下步骤创建一个公共组：\n\
  \n1.  在`快速查找`框中搜索`公共组`。\n2.  点击`新建`或将`视图`设置为`全部`以查看现有组的列表（图 9-21）。\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig21_HTML.jpg](img/437055_1_En_9_Fig21_HTML.jpg)\n\
  \n    图 9-21\n\n    设置公共组\n\n3.  填写以下详细信息，如图 9-22 所示。\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig22_HTML.jpg](img/437055_1_En_9_Fig22_HTML.jpg)\n\
  \n    图 9-22\n\n    向公共组添加成员\n\n    *   在`标签`中输入公共组的名称。\n    *   在`组名称`中输入唯一的 API\
  \ 名称。\n    *   要将成员添加到公共组，请将其从`可用成员`移动到`已选成员`。\n\n4.  点击`保存`。现在您已拥有一个包含成员的新公共组。\n\
  \n#### 手动共享\n\n手动共享可用于通过共享按钮向个人提供对记录的访问权限。\n\n给予对其他记录的访问权限需要满足四个前提条件。这些前提条件要求：\n\
  \n*   您是记录所有者。\n*   您的角色高于记录所有者。\n*   您对该记录拥有“完全访问”权限。\n*   您是系统管理员。\n\n## 总结\n\n\
  在本章中，您学习了 `Salesforce` 如何在多层架构中处理安全问题，该架构支持更高的灵活性和保护性。请务必访问 [`trust.salesforce.com`](http://trust.salesforce.com)，以透明地了解安全威胁和建议。\n\
  \n### 索引\n\n#### A, B\n\n`AppExchange` 市场 应用程序，lightning `AppExchange` 市场 `AppExchange`\
  \ 网站 应用程序启动器 选择正确的应用程序 主页面 兼容性 顾问列表 主页 详细信息选项卡 亮点栏 信息 概览选项卡 安装详细信息，已安装和未安装的包 主页面\
  \ 生产环境/沙盒，选择用户 应用程序选择 lightning 组件 包组件 价格 提供商 评论\n\n\n\n#### C\n\n案例自动分配规则：访问、创建、名称和激活字段条件设置、检索规则条件、向用户发送通知。\
  \  \n案例自动回复规则：访问、命名、检索规则条件、创建、设置电子邮件。  \n案例升级规则：操作设置、营业时间选择、创建、名称创建、导航、检索规则条件、创建。\
  \  \n案例队列：创建、命名和设置通知选项、对象选择、用户、组和角色选择。  \n电子邮件转案例设置：案例线程电子邮件验证导航、重新发送链接、电子邮件路由地址创建、Salesforce\
  \ 登录页面设置、路由地址。  \nWeb 转案例设置：Chatter 动态跟踪（请参见“动态跟踪”）。  \n通知：电子邮件通知、接收消息用户配置窗口。  \n\
  对象概述：配置文件编辑、流程、头像修改导航、图片更新、用户配置文件侧边栏。  \n协作工具（请参见“Chatter”）。  \n逗号分隔值（CSV）文件。  \n\
  公司设置：营业时间、公司信息、功能集许可证、组织详细信息、权限集许可证、存储使用量、用户许可证、会计年度。  \n联系人和账户报告：创建、拖放示例、报告选择、运行报告、保存选项。\
  \  \n客户关系管理（CRM）。\n\n#### D, E\n\n仪表板：图表创建、动态仪表板修改、命名和创建、报告和图表组件、报告查找、保存选项、选项卡创建。\
  \  \n数据库术语：字段、对象、记录。  \n数据控制工具。  \n数据导出：选择、包含图片、电子邮件频率、导航、设置菜单、对象、搜索、服务选项。  \n数据导入向导：访问账户和联系人、CSV\
  \ 文件、编辑映射、字段错误消息、导入、映射字段、唯一/外部 ID、CSV 文件、导入数据、潜在客户分配规则、自动化流程、营销活动、CSV 文件、电子邮件字段映射、导入、启动、匹配、导航、设置菜单、搜索、源数据准备、快捷方式、搜索“设置”菜单。\
  \  \n重复规则：账户、联系人、创建新规则、“操作”部分、添加账户匹配规则、选择、设置记录级安全、潜在客户。\n\n#### F, G, H, I, J, K\n\
  \n功能集许可证。  \n动态跟踪：Chatter 导航、设置菜单、步骤、跟踪设置。  \n字段级安全。\n\n#### L\n\n潜在客户分配规则。  \n\
  潜在客户管理：转换按钮、确认页面、状态创建、编辑页面、错误消息、潜在客户记录、成功消息、列表视图、潜在客户记录活动部分、Chatter 选项卡、详细信息选项卡、重复区域、亮点面板、Lightning\
  \ 体验、新闻选项卡、工作区工具栏。  \n潜在客户队列。  \n潜在客户报告：拖放、新报告、报告选项卡、运行选项、保存选项、源步骤、类型查找。  \nLightning\
  \ 助手：Lightning 体验主页、助手、收藏夹图标、全局搜索栏、帮助和培训、Lightning 操作、通知设置、查看配置文件、导航栏、新闻。  \n季度绩效：用户添加、多个用户按钮创建、停用、编辑用户信息、必填字段、添加新用户设置。\
  \  \nLightning 体验迁移：启用/禁用、Lightning 功能迁移助手、预览选项卡、迁移助手就绪状态、开启用户设置。  \nLightning 页面：App\
  \ Builder、编辑页面、设置下拉菜单、Lightning 应用创建、添加选项卡、应用详情、分配用户、启用实用栏、导航选项、Salesforce 账户记录、Lightning\
