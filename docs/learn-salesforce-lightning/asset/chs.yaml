  *图 6-50：配置联系人紧凑布局*\n\n**注意：** 通过快速入门，您只能为联系人记录创建紧凑布局。我们将在下一页介绍如何为其他对象创建紧凑布局。\n\n\
  11. 将您希望在移动应用中显示的字段移动到 `Compact Layout for Contacts` 区域，将不希望包含的字段移动到 `Available\
  \ Fields` 部分。通过拖放来重新排列字段的顺序，如图 6-51 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig51_HTML.jpg](img/437055_1_En_6_Fig51_HTML.jpg)\n\
  *图 6-51：修改联系人紧凑布局的字段顺序*\n\n12. 完成后点击 `Save & Next`。\n13. 在步骤 4 中，您可以通过依次点击 `Navigation\
  \ Menu`、`Global Actions` 和 `Contact Compact Layout` 来回顾您在此快速入门中已配置的内容，查看您创建的项目。是否发现需要修改的地方？点击\
  \ `Edit` 按钮即可进入相应的编辑屏幕进行修改，如图 6-52 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig52_HTML.jpg](img/437055_1_En_6_Fig52_HTML.jpg)\n\
  *图 6-52：核查您已完成设置*\n\n14. 完成后点击 `Next`。\n15. 如果您已准备好邀请用户，请在 `To` 字段中输入用户姓名，并自定义主题和消息。然后点击\
  \ `Send`，如图 6-53 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig53_HTML.jpg](img/437055_1_En_6_Fig53_HTML.jpg)\n\
  *图 6-53：邀请用户下载 Salesforce 移动应用*\n\n16. 完成后依次点击 `Next` 和 `Finish`。\n\n### 创建紧凑布局\n\
  \n在前面的步骤 10 中，我们提到您也可以为其他对象创建紧凑布局。操作方法如下：\n\n1.  点击浏览器右上角的设置齿轮图标，然后点击 `Setup`。\n\
  2.  选择主页选项卡旁边顶部的 `Object Manager` 选项卡。\n3.  选择您想要为其配置紧凑布局的对象，然后点击该对象的超链接名称，如图 6-54\
  \ 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig54_HTML.jpg](img/437055_1_En_6_Fig54_HTML.jpg)\n\
  *图 6-54：导航到某个对象的紧凑布局*\n\n4.  在左侧，您将看到该对象内的各种选项和操作。选择 `Compact Layouts`，如图 6-55 所示。\n\
  ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig55_HTML.jpg](img/437055_1_En_6_Fig55_HTML.jpg)\n\
  *图 6-55：选择紧凑布局*\n\n5.  点击 `New` 创建一个新的紧凑布局，如图 6-56 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig56_HTML.jpg](img/437055_1_En_6_Fig56_HTML.jpg)\n\
  *图 6-56：点击 `New` 按钮*\n\n6.  为您的紧凑布局创建一个标签，然后按 `Tab` 键自动生成名称。使用中间的箭头将字段从 `Available\
  \ Fields` 区域移动到 `Selected Fields` 区域。使用 `Selected Fields` 旁边的箭头上下移动字段，以调整用户查看详细信息的顺序，如图\
  \ 6-57 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig57_HTML.jpg](img/437055_1_En_6_Fig57_HTML.jpg)\n\
  *图 6-57：创建紧凑布局*\n\n7.  完成后，点击 `Save`。\n8.  点击 `Compact Layout Assignment` 按钮，如图\
  \ 6-58 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig58_HTML.jpg](img/437055_1_En_6_Fig58_HTML.jpg)\n\
