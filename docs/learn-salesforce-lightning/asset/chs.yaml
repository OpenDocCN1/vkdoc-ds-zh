- "# 1. 介绍 Salesforce Lightning  \n\nSalesforce 目前是用于业务管理的排名第一的客户关系管理（CRM）解决方案。通过提供强大的平台和突破性技术，Salesforce\
  \ 为销售、服务和市场营销部门提供解决方案。Lightning Experience 提供了一个新的用户界面，该界面具有更快的平台、动态功能和增强的美学效果。企业报告称，转向\
  \ Lightning 后，成交率提高、协作增强、生产力提升且报告速度加快（见图 1-1）。  \n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig1_HTML.jpg](img/437055_1_En_1_Fig1_HTML.jpg)\
  \  \n\n图 1-1：Salesforce Lightning Experience\n\n\n\n## Lightning 页面\n\nLightning\
  \ 页面将注意力聚焦于最重要的事项。关键信息会显示在“首屏上方”，即屏幕的上半部分，以便用户更快地查看要点。\n\n此外，布局一致且易于导航。请对比 Classic\
  \ 中的帐户记录（见图 1-2）与 Lightning 中的同一记录（图 1-3）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig3_HTML.jpg](img/437055_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3：Lightning Experience 中的 Salesforce 帐户记录\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig2_HTML.jpg](img/437055_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2：Salesforce Classic 中的 Salesforce 帐户记录\n\n## 迁移到 Lightning Experience\n\n\
  迁移到 Salesforce Lightning Experience 非常简单。以下步骤描述了如何访问迁移助手。迁移助手将检查你的组织对 Lightning\
  \ 的准备情况，并引导你完成一系列步骤，以便为你的组织启用 Lightning。这是你的 Lightning 之旅中一个很好的第一步。\n\n> **注意：**\
  \ 这些步骤并非必需，但强烈建议执行。Salesforce 花了大量时间思考潜在的迁移陷阱，并尝试在迁移助手中解决这些问题。\n\n### 迁移助手\n\n请执行以下步骤：\n\
  \n1. 在 Classic 中，选择 `Setup`（设置）（见图 1-4）。\n   \n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig4_HTML.jpg](img/437055_1_En_1_Fig4_HTML.jpg)\n\
  \   \n   图 1-4：Salesforce Classic 中的“设置”区域\n\n2. 在 `Setup`（设置）菜单中，点击 `Get Started`（开始使用）按钮（见图\
  \ 1-5）。\n   \n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig5_HTML.jpg](img/437055_1_En_1_Fig5_HTML.jpg)\n\
  \   \n   图 1-5：设置中的“开始使用”按钮\n\n3. 在这里，你有三个可用资源来了解更多关于 Lightning Experience 的信息。你可以从图\
  \ 1-6 中的选项中进行选择。\n   \n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig6_HTML.jpg](img/437055_1_En_1_Fig6_HTML.jpg)\n\
  \   \n   图 1-6：Salesforce Lightning 的学习资源\n\n4. 点击 `Next Step`（下一步）开始操作。\n\n####\
  \ 检查准备情况\n\n首先，Salesforce 将请求访问你的组织，以分析你当前的设置（图 1-7）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig7_HTML.jpg](img/437055_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7：允许访问 Lightning 准备情况检查\n\n单击 `Allow`（允许）（如图 1-7 所示）后，你必须选择要访问的 Salesforce\
  \ 产品（见图 1-8）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig8_HTML.jpg](img/437055_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8：选择要检查 Lightning 准备情况的产品\n\n选择适当的 Salesforce 产品并单击 `Check Readiness`（检查准备情况）。Salesforce\
  \ 将分析你当前的设置，并通过电子邮件发送一份准备情况报告（见图 1-9）。新组织可以跳过此步骤。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig9_HTML.jpg](img/437055_1_En_1_Fig9_HTML.jpg)\n\
  \n图 1-9：Lightning 迁移选项\n\n#### 预览\n\n你可以预览你的组织在 Lightning 环境中的运作方式。这是一个很好的功能，可以用来测试你的准备情况报告中可能提出的任何问题。如果在此切换过程中遇到任何问题，你可以当场进行更改。要进行测试，请导航至\
  \ `Preview`（预览）选项卡，然后单击 `Preview`（预览），如图 1-10 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig10_HTML.jpg](img/437055_1_En_1_Fig10_HTML.jpg)\n\
  \n图 1-10：迁移助手中的“预览”选项卡\n\n如图 1-11 所示，你将立即切换到预览模式下的 Lightning。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig11_HTML.jpg](img/437055_1_En_1_Fig11_HTML.jpg)\n\
  \n图 1-11：预览模式下的 Lightning Experience\n\n#### 利用功能进行优化\n\n为了获得 Lightning 的完整体验，请查看一些新增的可用功能。这包括用于新闻的新功能、启用活动和笔记的选项等等。导航到此选项卡，并单击\
  \ `Optimize with Features`（利用功能进行优化）来启用/禁用图 1-12 中的 Lightning 功能。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig12_HTML.jpg](img/437055_1_En_1_Fig12_HTML.jpg)\n\
  \n图 1-12：要启用的 Lightning 功能\n\n你可以启用以下选项：\n\n*   单击 `Set Up My Domain`（设置我的域）可以创建一个反映你公司品牌的\
  \ URL。这会将一个子域添加到你的 Salesforce 组织 URL。使用此功能来增强登录和身份验证过程。\n*   单击 `Set Up Shared Activities`（设置共享活动）以允许用户将多个联系人关联到单个活动。\n\
  *   启用 `News`（新闻）以显示关于你的帐户及其行业的相关新闻文章。这些信息由你组织中列出的帐户拉取。\n*   启用 `Social Accounts`（社交帐户）、`Contacts`（联系人）和\
  \ `Leads`（潜在客户），以允许用户通过同步社交媒体帐户更好地与你的帐户建立联系。\n*   启用 `Notes`（笔记）以使用增强版笔记，该版本包括在编辑模式下自动保存、添加图像的选项以及共享功能。\n\
  \n#### 设置用户\n\n你可以控制谁有权访问 Lightning Experience。你可以选择向用户组、单个用户或所有用户推出此功能。\n\n> **注意：**\
  \ 标准简档用户默认有权访问 Lightning，而自定义简档用户则没有。单击 `Learn How`（了解如何操作）以更改这些设置。\n\n导航至图 1-13\
  \ 中显示的 `Set up Users`（设置用户）选项卡，以微调此体验并选择要切换的用户。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig13_HTML.jpg](img/437055_1_En_1_Fig13_HTML.jpg)\n\
  \n图 1-13：用户设置\n\n请执行以下步骤来切换用户：\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig14_HTML.jpg](img/437055_1_En_1_Fig14_HTML.jpg)\n\
  \n图 1-14：选择要迁移到 Lightning 的用户\n\n1.  单击 `Switch Users`（切换用户）。\n2.  通过单击用户名旁边的 `+`\
  \ 来选择适当的用户（图 1-14）。\n3.  单击 `Save`（保存）。\n\n##### 推出方式\n\n执行最适合你公司的推出策略。对于较大的组织，建议采用分阶段推出的方法。这种方法在迁移大型组织和复杂设置时非常有利。这种方法有几个好处，包括：\n\
  \n*   此方法允许你进行用户验收测试。用它来识别新体验中的任何挑战或问题。你可以在向整个组织推广之前收集用户的反馈并微调更改。\n*   通过将实施工作分解成若干部分来取得进展。这确保了在紧跟新功能和变更的同时，能够取得进展。\n\
  \n建议的推出方式是从新用户开始，然后是试点用户组，最后是所有用户。\n\n\n\n##### 启用功能\n\n太好了！终于到了最后一步！当你的组织准备好迁移到\
  \ Lightning 时，请选择图 1-15 中所示的 `Turn It On` 选项卡。将此选项卡切换为 `Enabled` 即可完成。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig15_HTML.jpg](img/437055_1_En_1_Fig15_HTML.jpg)\n\
  \n**图 1-15**\n启用 Lightning 以完成操作\n\n### 注意\n\n拥有相应权限的用户可以选择在 `Classic` 和 `Lightning\
  \ Experience` 之间切换。在 `Classic` 界面中，选择你的用户名并点击 `Switch to Lightning Experience`，如图\
  \ 1-16 所示。在 `Lightning Experience` 界面中，点击 `Switch to Classic`，如图 1-17 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig16_HTML.jpg](img/437055_1_En_1_Fig16_HTML.jpg)\n\
  \n**图 1-16**\n从 Classic 切换到 Lightning\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig17_HTML.jpg](img/437055_1_En_1_Fig17_HTML.jpg)\n\
  \n**图 1-17**\n从 Lightning Experience 切换到 Salesforce Classic\n\n## Lightning 主页\n\
  \n`Lightning Experience` 主页通过新功能得到了增强。主页可以根据用户需求进行定制，为他们提供在一个集中位置管理工作所需的一切。无需任何配置，`Salesforce`\
  \ 会显示以下组件：`Quarterly Performance`（季度业绩）、`Assistant`（助手）、`News`（资讯）、`Today’s Tasks`（今日任务）、`Today’s\
  \ Events`（今日活动）、`Recent Records`（最近记录）和 `Top Deals`（重点交易）。请参见图 1-18 和图 1-19。\n\n\
  ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig19_HTML.jpg](img/437055_1_En_1_Fig19_HTML.jpg)\n\
  \n**图 1-19**\nLightning 主页的下半部分\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig18_HTML.jpg](img/437055_1_En_1_Fig18_HTML.jpg)\n\
  \n**图 1-18**\nLightning 主页的上半部分\n\n### 导航栏\n\n导航栏使用选项卡来存放对象，如图 1-20 所示。用数据库术语来说，*对象*（object）就是一个表。对象存储着可能相关的信息分组，包括其中的记录。记录可以看作是表中的行。你会在本书中反复听到这些术语。有关对象、记录和字段的更多信息，请导航到第\
  \ X 章。\n\n在 Lightning 中，每个选项卡都是可操作的。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig20_HTML.jpg](img/437055_1_En_1_Fig20_HTML.jpg)\n\
  \n**图 1-20**\n导航栏\n\n在导航栏中，对象被分解为列表。这些列表存放与对象相关的 `Salesforce` 记录。其中一个很棒的功能是，可以直接从一个选项卡中创建记录。每个列表都能用来查看该对象最近的项目，这使得用户可以更轻松地即时创建新记录。\n\
  \n### 季度业绩（Quarterly Performance）\n\n`Quarterly Performance`（季度业绩）摘要是一个强大的报告工具，用于根据销售漏斗展示销售用户的业绩（见图\
  \ 1-21）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig21_HTML.jpg](img/437055_1_En_1_Fig21_HTML.jpg)\n\
  \n**图 1-21**\n位于主页上的季度业绩组件\n\n-   `Closed`（已关闭）记录显示用户已赢单的商机。\n-   `Open (>70%)`（进行中，>70%）显示概率大于\
  \ 70% 的所有记录的总和。\n\n如果用户属于某个团队，则此报告将展示团队的商机总额。否则，所显示的数据将是该用户自己拥有的商机。\n\n#### 设定目标\n\
  \n要设定目标，请遵循以下步骤：\n\n1.  点击铅笔图标并输入金额，如图 1-22 所示。\n\n    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig22_HTML.jpg](img/437055_1_En_1_Fig22_HTML.jpg)\n\
  \n    **图 1-22**\n    选择铅笔图标以编辑你的季度目标\n\n2.  点击 `Save`（保存）。\n\n图表会自动计算并更新。点击 ![../images/437055_1_En_1_Chapter/437055_1_En_1_Figa_HTML.jpg](img/437055_1_En_1_Figa_HTML.jpg)\
  \ 可刷新数据。点击 ![../images/437055_1_En_1_Chapter/437055_1_En_1_Figb_HTML.jpg](img/437055_1_En_1_Figb_HTML.jpg)\
  \ 可按周或日筛选数据（图 1-23）。\n\n现在，你的销售用户就可以通过销售进度的数据可视化来开始新的一天了。\n\n### 资讯（News）\n\n这项新功能非常适合展示与你客户及其行业相关的新闻文章。一旦按照“增强功能”部分所述启用，新闻信息便可在主页上显示。当从主页访问新闻时，系统会根据最近查看的记录以及这些记录的任务和事件来显示信息。请参见图\
  \ 1-23。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig23_HTML.jpg](img/437055_1_En_1_Fig23_HTML.jpg)\n\
  \n**图 1-23**\n主页上的资讯组件\n\n点击 `See More News`（查看更多资讯）以导航至 `News`（资讯）选项卡，如图 1-24 所示。\n\
  \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig24_HTML.jpg](img/437055_1_En_1_Fig24_HTML.jpg)\n\
  \n**图 1-24**\n在资讯对象中找到的行业新闻\n\n此选项卡显示一个标题为 `Industry News`（行业新闻）的新闻文章列表。此处填充的信息与你的客户及其行业相关。\n\
  \n### 助手（Assistant）\n\n`Lightning Assistant`（Lightning 助手）有助于排列最终用户日常任务的优先级。逾期的任务会首先显示在页面右上角（见图\
  \ 1-25）。紧接着是截止日期为今天的任务。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig25_HTML.jpg](img/437055_1_En_1_Fig25_HTML.jpg)\n\
  \n**图 1-25**\nLightning Assistant\n\n#### 全局搜索\n\nSalesforce 的全局搜索栏出现在每个页面的顶部。使用此区域可以在\
  \ `Salesforce` 中的任何对象上进行搜索。最佳实践是在创建新记录之前先搜索记录，以避免重复数据。使用通配符和运算符可以获得更好的搜索结果。\n\n\
  使用星号（`*`）可以查找搜索词中间或末尾匹配的记录，使用问号（`?`）可以查找搜索词中间或末尾仅匹配一个字符的记录。\n\n例如，在末尾搜索 `Ay*` 将找到并显示名为\
  \ `Ayden` 的联系人的结果，也会找到并显示 `Andy Young` 的结果（图 1-26）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig26_HTML.jpg](img/437055_1_En_1_Fig26_HTML.jpg)\n\
  \n**图 1-26**\n搜索 `Ay*` 的结果\n\n#### 收藏夹列表\n\n`Favorites`（收藏夹）图标是 Lightning 平台中的一个新工具。收藏夹是针对最常访问的记录和项目（如单个收藏记录、列表视图、仪表板等）的自定义快捷方式。\n\
  \n要将某项设为收藏，请点击图 1-27 中的星形按钮。这个强大的工具使你可以轻松地从不同对象位置找到你收藏的记录，并集中在一个地方查看。\n\n你可以将你的重点交易、最常访问的报告、最重要的潜在客户等设为收藏！\n\
  \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig27_HTML.jpg](img/437055_1_En_1_Fig27_HTML.jpg)\n\
  \n**图 1-27**\n收藏夹图标\n\n点击星形旁边的箭头以选择你的 `Favorites`（收藏夹）列表中的项目，如图 1-28 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig28_HTML.jpg](img/437055_1_En_1_Fig28_HTML.jpg)\n\
  \n**图 1-28**\n收藏夹列表\n\n\n\n### Lightning 操作\n\n如图 1-29 所示的 **+** 按钮可用于在 `Salesforce`\
  \ 中快速创建记录。使用此快速创建功能，可直接从主页新建活动、潜在客户、联系人、商机、个案或电话。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig29_HTML.jpg](img/437055_1_En_1_Fig29_HTML.jpg)\n\
  \n图 1-29\n\nLightning 操作\n\n点击任意可用选项，即可在屏幕右下角立即显示一个快速创建窗口。\n\n在 Lightning Experience\
  \ 中，可以从主页打开多个窗口，以提高用户的工作效率和速度。最多可同时显示三个窗口（见图 1-30）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig30_HTML.jpg](img/437055_1_En_1_Fig30_HTML.jpg)\n\
  \n图 1-30\n\n*实用工具栏*\n\n### 帮助与培训\n\nSalesforce 拥有许多出色的支持资源，包括视频、操作指南以及名为 Trailhead\
  \ 的互动学习工具。从主页点击问号（如图 1-30 所示）即可访问这些资源。每个页面都有一个帮助菜单，其中包含指向实用资源的链接。使用此区域可以记录个案、获取支持、提供反馈以及查看版本说明。\n\
  \nSalesforce 每年提供三个季度的版本更新：春季、夏季和冬季。每个版本提供超过 150 个新功能。此菜单右下角显示的图像（如图 1-31 所示）会告知您的组织当前处于哪个版本。\n\
  \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig31_HTML.jpg](img/437055_1_En_1_Fig31_HTML.jpg)\n\
  \n图 1-31\n\n帮助与培训\n\n### 设置\n\n设置是 Salesforce 管理员最常使用的区域。在 Lightning 中，设置页面已得到改进！设置区域拥有更符合逻辑且更易于导航的布局。系统管理员和拥有适当权限设置的用户可以访问此区域。从工具栏中选择“设置”即可导航至此（见图\
  \ 1-32）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig32_HTML.jpg](img/437055_1_En_1_Fig32_HTML.jpg)\n\
  \n图 1-32\n\nLightning 设置主页\n\n设置包含以下类别：管理、平台工具和设置。查看设置中的“最近使用的位置”，以无缝地继续任何管理工作。使用“快速查找”可以轻松找到进行自定义工作所需的管理工具。\n\
  \n点击“创建”按钮可快速访问最常用的工具，包括新建对象、工作流、选项卡、模板和用户（见图 1-33）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig33_HTML.jpg](img/437055_1_En_1_Fig33_HTML.jpg)\n\
  \n图 1-33\n\n创建按钮\n\n### 通知\n\n在一个位置查看所有通知，包括批准请求和 Chatter 提及。点击铃铛图标可查看通知列表（见图 1-34）。\n\
  \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig34_HTML.jpg](img/437055_1_En_1_Fig34_HTML.jpg)\n\
  \n图 1-34\n\n通知区域\n\n### 查看个人资料\n\n使用此部分可以更改个人设置、注销或切换到 Salesforce Classic（见图 1-35）。\n\
  \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig35_HTML.jpg](img/437055_1_En_1_Fig35_HTML.jpg)\n\
  \n图 1-35\n\n设置区域\n\n## 用户\n\n在 Lightning 中，您可以像在 Classic 中一样轻松地创建 Salesforce 用户。用户通过许可证、用户名和密码以及配置文件进行标识。在\
  \ Lightning 中，您可以创建新用户、停用用户、编辑用户设置等。\n\n### 创建新用户\n\n要分配许可证和记录所有权，您必须首先创建一个用户。每个用户都必须分配一个许可证。要释放许可证，您可以停用某个用户并进行相应分配。在“快速查找”中，搜索并选择位于“管理”部分的“用户”。\n\
  \n导航到用户主页（见图 1-36）以创建单个用户、编辑现有用户的信息、添加多个用户以及重置密码。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig36_HTML.jpg](img/437055_1_En_1_Fig36_HTML.jpg)\n\
  \n图 1-36\n\n用户设置主页\n\n### 创建和编辑用户信息\n\n请按照以下步骤创建新用户：\n\n1.  单击“新建用户”。\n2.  填写所有标红且为必填的字段。这包括姓氏、别名、电子邮件、用户名和昵称（见图\
  \ 1-37）。\n    \n    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig37_HTML.jpg](img/437055_1_En_1_Fig37_HTML.jpg)\n\
  \    \n    图 1-37\n    \n    添加新用户的必填字段\n\n    **注意** 电子邮件地址必须是有效的电子邮件格式，但可用于多个组织。但是，用户名必须是唯一的，并且格式正确的电子邮件地址。\n\
  \    \n    例如，`felicia@cloudcreations.com` 就是一种正确的电子邮件格式。\n\n3.  在“用户许可证”字段中分配适当的许可证。\n\
  4.  使用“配置文件”字段分配配置文件。\n5.  选中“市场营销用户”以使分配的用户有权访问您组织的营销工具。\n6.  选中“离线用户”以使分配的用户获得离线访问权限。\n\
  7.  选中“知识用户”以授予对知识库文章进行更改的权限。\n8.  选中“Force.com Flow 用户”以授予 Force.com 许可用户运行 Flow\
  \ 的能力。\n9.  选中“Service Cloud 用户”以授予对 Service Cloud 的访问权限。\n10.  选中“Site.com 贡献者用户”以允许访问\
  \ Site.com。\n11.  选中“Work.com 用户”以分配 work.com 用户功能许可证。\n12.  选中“Salesforce Classic\
  \ 用户”以启用对 Salesforce Mobile Classic 的访问。\n13.  应用适当的区域设置，例如时区、区域设置和语言（图 1-30）。\n\
  14.  单击“保存”。\n\nSalesforce 会立即向用户发送通知电子邮件以生成新密码。要停止此操作，请取消选择屏幕底部的“生成新密码”。\n\n###\
  \ 添加多个用户\n\n您可以通过一次添加多个用户来节省时间。要在用户主页上添加多个用户，请单击“添加多个用户”，如图 1-38 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig38_HTML.jpg](img/437055_1_En_1_Fig38_HTML.jpg)\n\
  \n图 1-38\n\n添加多个用户按钮\n\n下一页将列出每种许可证类型可用的许可证数量，如图 1-39 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig39_HTML.jpg](img/437055_1_En_1_Fig39_HTML.jpg)\n\
  \n图 1-39\n\n可用许可证的细分信息\n\n滚动到页面底部，然后选择您要为所有用户添加的用户许可证，如图 1-40 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig40_HTML.jpg](img/437055_1_En_1_Fig40_HTML.jpg)\n\
  \n图 1-40\n\n为批量用户组选择用户许可证\n\n### 注意\n\n添加多个用户时，这些用户必须具有相同的许可证类型。\n\n一旦您选择了适当的许可证类型，请填写用户的详细信息并单击“保存”，如图\
  \ 1-41 所示。并非所有用户字段在此过程中都可用。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig41_HTML.jpg](img/437055_1_En_1_Fig41_HTML.jpg)\n\
  \n图 1-41\n\n新用户的必填字段\n\n\n\n### 停用用户\n\n在 Salesforce 中，你不能删除用户，但可以停用用户以阻止其登录。停用用户会释放一个许可证，该许可证可分配给其他用户（参见图\
  \ 1-42）。当你停用某个用户时，该用户将从所有共享权限和组中移除。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig42_HTML.jpg](img/437055_1_En_1_Fig42_HTML.jpg)\n\
  \n图 1-42 – 用户页面上的 `Active` 复选框\n\n该用户拥有的记录仍可转移至活跃账户。以下是停用步骤：\n\n1. 导航至 `Setup` 中的\
  \ `User` 部分。\n2. 选择需要停用的用户名称。\n3. 在用户记录页面点击 `Edit`。\n4. 在用户配置文件中取消勾选 `Active`。\n\
  5. 点击 `Save`。\n\n## Lightning 页面\n\nLightning 允许你创建自定义页面，为特定用户组显示和安排关键信息。你可以通过构建清晰易用的页面来提高采用率和用户接受度。通过创建应用程序，你可以最大限度地减少公开信息的类型，使\
  \ Salesforce 组织更易于使用。`App Builder` 是一个新的拖放工具，无需编写代码即可自定义界面（参见图 1-43）。\n\n请按照以下步骤更改\
  \ Lightning 主页：\n\n1. 在主页上，点击 `Edit Page`（此功能可在大多数 Lightning 页面上找到）。参见图 1-43。\n\n\
  ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig43_HTML.jpg](img/437055_1_En_1_Fig43_HTML.jpg)\n\
  \n图 1-43 – `Setup` 下拉菜单中的 `Edit Page`\n\n2. 安排你想要用户看到的可用组件。参见图 1-44。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig44_HTML.jpg](img/437055_1_En_1_Fig44_HTML.jpg)\n\
  \n图 1-44 – `Lightning App Builder`\n\n3. 在左侧面板中，从可用的 Lightning 组件中进行选择，并将其拖放到主页上的所需区域。右侧面板将提示所选组件的详细信息。\n\
  \n### 创建新的 Lightning 应用程序\n\n从 `Setup` 中，搜索并选择 `App Manager` 以打开 `Lightning Experience\
  \ App Manager`。点击 `New Lightning App` 以创建一个新应用程序（参见图 1-45）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig45_HTML.jpg](img/437055_1_En_1_Fig45_HTML.jpg)\n\
  \n图 1-45 – 创建新的 Lightning 应用程序\n\n要创建新应用程序，请遵循以下步骤：\n\n1. 填写必填字段（标有星号的字段）。\n   -\
  \ 应用程序名称将显示在导航栏中。\n   - 开发人员名称是 API 名称，必须在组织中的其他应用程序中保持唯一。\n\n2. 对于 `App Branding`，上传一张图片（如公司徽标）来自定义页面（参见图\
  \ 1-46）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig46_HTML.jpg](img/437055_1_En_1_Fig46_HTML.jpg)\n\
  \n图 1-46 – 应用程序详细信息\n\n3. 填写完相应字段后，点击 `Next`。\n\n4. 选择导航样式。选择 `Standard` 在顶部显示导航栏，或选择\
  \ `Console` 在新工作区选项卡中打开记录（参见图 1-47）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig47_HTML.jpg](img/437055_1_En_1_Fig47_HTML.jpg)\n\
  \n图 1-47 – 新的 Lightning 应用程序导航选项\n\n5. 点击 `Next`。\n\n6. 点击 `Add` 添加实用程序栏（参见图 1-48）。\n\
  \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig48_HTML.jpg](img/437055_1_En_1_Fig48_HTML.jpg)\n\
  \n图 1-48 – 为应用程序启用实用程序栏的步骤\n\n7. 选择应在新应用程序中显示的项目。所选项目的顺序将从左到右显示在页面顶部（参见图 1-49）。\n\
  \n> **注意：** 最佳实践是为不同的用户组创建不同的应用程序。创建这些应用程序时，建议只显示与这些用户组相关的项目。如果用户看到过多不必要的信息，可能会感到不知所措和沮丧。\n\
  >\n> 例如，销售应用程序应仅显示与销售相关的项目，如潜在客户、客户、联系人和商机。对于服务代理，他们很可能不需要看到商机。为服务代理创建一个仅显示与服务相关项目（如联系人和案例）的应用程序。\n\
  \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig49_HTML.jpg](img/437055_1_En_1_Fig49_HTML.jpg)\n\
  \n图 1-49 – 向新应用程序添加选项卡\n\n8. 点击 `Next`。\n\n9. 选择应有权访问此应用程序的配置文件（参见图 1-50）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig50_HTML.jpg](img/437055_1_En_1_Fig50_HTML.jpg)\n\
  \n图 1-50 – 向应用程序分配用户\n\n10. 点击 `Save and Finish Now`。你可以在 `App Launcher` 中找到新创建的应用程序。\n\
  \n## 公司设置\n\n公司设置包括可以自定义的设置，例如会计年度、营业时间和节假日时间、语言设置以及其他重要信息。\n\n### 公司信息\n\n在 `Quick\
  \ Find` 区域中搜索并选择 `Company Information`。`Company Information` 部分包含有关组织、许可证可用性和数据使用情况的重要信息。\n\
  \n#### 组织详细信息\n\n组织详细信息显示公司的一般信息。编辑主要联系人以建立任何技术支持请求的联系点。在此处更改区域设置、货币和新闻通讯设置（参见图\
  \ 1-51）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig51_HTML.jpg](img/437055_1_En_1_Fig51_HTML.jpg)\n\
  \n图 1-51 – 组织详细信息\n\n#### 存储使用情况\n\n每个组织都有存储限制。存储分为两类：数据存储和文件存储。要查看存储限制、存储使用情况和已使用百分比，请导航到公司设置。\n\
  \n点击 `Used Data Space` 或 `Used File Space` 旁边的 `View`，查看组织当前的存储使用情况。\n\n存储使用情况会被细分，并显示两者之间的使用百分比。信息也按对象细分，如图\
  \ 1-52 所示。使用此细分来确定哪些记录占用空间最多。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig52_HTML.jpg](img/437055_1_En_1_Fig52_HTML.jpg)\n\
  \n图 1-52 – `Storage Usage` 细分\n\n#### 用户许可证\n\n此部分显示每种许可证类型的可用许可证总数、已使用总数以及剩余可用许可证数量。这包括标准的\
  \ Salesforce 许可证，这是最常购买和分配的许可证（参见图 1-53）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig53_HTML.jpg](img/437055_1_En_1_Fig53_HTML.jpg)\n\
  \n图 1-53 – 用户许可证\n\n#### 权限集许可证\n\n权限集许可证授权用户访问其用户许可证中未包含的功能和各种工具。这可能包括 `Service\
  \ Cloud` 控制台用户、`CRM` 用户、`Analytics Cloud` 访问权限等。\n\n\n\n##### 功能集许可证\n\n功能集许可证在标准用户许可证的基础上增加了附加功能。这些功能可能包括`Data.com`、知识用户、营销用户等。\n\
  \n## 基于使用量的授权（BETA 版）许可证\n\n此功能允许组织在有限时间内使用。这些工具各不相同，但通常是临时提供。\n\n### 会计年度\n\n在\
  \ Salesforce 中，根据您现有的季度和年度会计期间设置会计年度。此信息对于报告和预测目的至关重要。\n\n#### 修改会计年度：标准\n\n要修改标准会计年度，请导航至`设置`中的`会计年度`区域，并按照以下步骤操作（见图\
  \ 1-54）：\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig54_HTML.jpg](img/437055_1_En_1_Fig54_HTML.jpg)\n\
  \n图 1-54\n\n修改组织的会计年度\n\n1. 如果贵公司遵循公历年度，请选择**标准自定义年度**。（如果不遵循标准会计年度，请选择**自定义**。）\n\
  2. 选择**会计年度起始月份**。\n3. 设置输入的月份是基于月末还是月初。\n4. 点击**保存**。\n5. 选择**标准**或**自定义会计年度**。\n\
  \n### 营业时间\n\n营业时间定义客户支持团队与 Salesforce 的交互方式。指定支持团队可用于解决案例的时间。Salesforce 将调整时间以与升级规则、里程碑、案例和授权流程同步。请按照以下步骤开始：\n\
  \n1. 在`快速查找`区域中选择`营业时间`。\n2. 点击**新建营业时间**以导航至编辑页面（见图 1-55）。\n\n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig55_HTML.jpg](img/437055_1_En_1_Fig55_HTML.jpg)\n\
  \n   图 1-55\n\n   修改组织的营业时间\n\n3. 为其指定具体名称。\n4. 选择时区。\n5. 指定营业时间。\n6. 点击**启用**以激活这些时间。\n\
  7. 点击**保存**以将这些营业时间设为默认值。\n\n## 本章小结\n\n本章介绍了 Salesforce Lightning 的新智能和复杂性。在本章中，我们涵盖了如何从\
  \ Classic 迁移到 Lightning，并通过设置让您的组织为成功做好准备。下一章将讨论如何在 Lightning 中充分利用 Sales Cloud。\n\
  \n"
- "# 2. Sales Cloud Lightning\n\nSales Cloud 使销售和营销专业人员能够以闪电般的速度提高销售效率和收入。通过记录潜在客户、客户、联系人、商机和市场活动，您可以查看从潜在客户到活跃客户的完整客户历程。在\
  \ Sales Cloud Lightning 中，潜在客户被捕获、培育，并无缝转换为活跃客户或潜在客户。销售主管随后可以通过商机跟踪来管理其销售管道，从而有效达成更多交易（图\
  \ 2-1）。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig1_HTML.jpg](img/437055_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\nSales Cloud 中`商机`对象上的新看板功能\n\n## 潜在客户管理\n\n在不同的业务模型中，Salesforce 中的潜在客户可以是个人、组织或实体。`潜在客户`对象可以充当存储在\
  \ Salesforce 中所有潜在客户的容器。潜在客户来源多样。因此，最好使用潜在客户区域来跟踪有关潜在客户的重要信息，包括联系信息及备注。\n\n您的潜在客户可能来自多个切入点，并且可能是营销活动的结果。使用`潜在客户`对象来管理和培育正在经历资格认证流程的潜在客户。这包括通过`Web\
  \ 到潜在客户`从您的网站获取的潜在客户、购买的列表、推荐、网络活动等。利用此信息来判断您的最佳潜在客户来自哪些渠道。\n\n例如，为您在最新营销活动中遇到的潜在客户创建一条潜在客户记录。包括有关该潜在客户的重要联系信息、添加备注，并创建跟进任务，以防止潜在客户遗漏。生成报告以查看大部分合格潜在客户的来源。利用此信息将您的营销预算投入到最有效的地方。\n\
  \n## 潜在客户转换\n\n一旦将潜在客户确认为可靠潜在客户，您就可以将其转换为客户、联系人和商机。在 Salesforce 中转换潜在客户时，标准潜在客户字段会填充到新的客户、联系人和商机记录中。\n\
  \n企业潜在客户会创建企业客户、企业联系人和商机。个人客户在转换时会创建个人客户和商机。\n\n### 注意\n\n并非所有业务模型都使用潜在客户。然而，Salesforce\
  \ 中的潜在客户跟踪是一种有用的方法，用于将数据库中未接触的潜在客户与更有前景的潜在客户区分开来。请确定您的业务流程以决定转换的时机。\n\n\n\n### 了解潜在客户页面\n\
  \n在 Lightning Experience 中，潜在客户记录包含关于该潜在客户的重要信息，包括联系详情、活动跟踪、营销活动历史、Chatter 和新闻。\n\
  \n借助`潜在客户工作区`工具栏，销售主管可以更快地处理最优质的潜在客户。该工具栏使销售代表能够轻松地引导其潜在客户完成潜在客户转化流程。\n\n图 2-2 展示了\
  \ Lightning Experience 中的一条潜在客户记录。此页面布局通过一个高亮面板、一个活动区域和`潜在客户工作区`工具栏整合了关键信息。\n\n\
  ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig2_HTML.jpg](img/437055_1_En_2_Fig2_HTML.jpg)\n\
  *图 2-2 — Lightning Experience 中的潜在客户记录页面*\n\n如图 2-3 所示的高亮面板在页面顶部显示关键信息。默认情况下，这包括潜在客户的称呼、名、姓、职务、公司、所有电话字段和电子邮件。此功能使您的用户能够更快速地处理潜在客户。\n\
  \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig3_HTML.jpg](img/437055_1_En_2_Fig3_HTML.jpg)\n\
  *图 2-3 — 潜在客户记录上的高亮面板*\n\n如图 2-4 所示的交互式工具栏称为`潜在客户工作区`。此区域帮助用户遵循转化过程中的一系列可配置步骤，这些步骤被称为*销售路径*。鼓励用户在努力确认潜在客户资格时更新其状态。\n\
  \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig4_HTML.jpg](img/437055_1_En_2_Fig4_HTML.jpg)\n\
  *图 2-4 — 潜在客户工作区工具栏*\n\n使用`活动`选项卡（如图 2-5 所示）来记录通话、创建新任务或事件以及发送电子邮件。创建任务以防止潜在客户从缝隙中溜走。任何需要完成的任务将填充在`后续步骤`区域。已完成的活动记录在`过往活动`部分。\n\
  \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig5_HTML.jpg](img/437055_1_En_2_Fig5_HTML.jpg)\n\
  *图 2-5 — 潜在客户记录上的活动区域*\n\n将潜在客户记录上的 Chatter 功能（如图 2-6 所示）用作协作工具。将其作为您在 Salesforce\
  \ 内部的沟通载体，以便相互协作。发布更新、提出问题并创建投票。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig6_HTML.jpg](img/437055_1_En_2_Fig6_HTML.jpg)\n\
  *图 2-6 — 潜在客户记录上的 Chatter 选项卡*\n\n如图 2-7 所示的`详细信息`选项卡显示与潜在客户相关的信息。这包括向用户展示的所有标准和自定义字段。\n\
  \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig7_HTML.jpg](img/437055_1_En_2_Fig7_HTML.jpg)\n\
  *图 2-7 — 潜在客户记录上的详细信息选项卡*\n\n使用如图 2-8 所示的`新闻`选项卡查找与您的潜在客户相关的新闻文章。您还可以将您的组织与 Twitter\
  \ 同步，以查看最新的 Twitter 信息流和相关连接。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig8_HTML.jpg](img/437055_1_En_2_Fig8_HTML.jpg)\n\
  *图 2-8 — 潜在客户记录上的新闻区域*\n\n在默认潜在客户页面布局的最右侧（如图 2-9 所示），您可以识别潜在的重复记录。如果发现任何重复项，该信息将填充到此区域。\n\
  \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig9_HTML.jpg](img/437055_1_En_2_Fig9_HTML.jpg)\n\
  *图 2-9 — 潜在客户记录上的重复项区域*\n\n### 注意\n\n可以对高亮面板进行重新排列，以在页面顶部显示最重要的潜在客户详细信息。这使最终用户能够轻松利用关键信息。\n\
  \n### 创建潜在客户\n\n请按照以下步骤学习如何从列表视图创建新的潜在客户记录：\n\n1.  点击`潜在客户`选项卡旁边的`![../images/437055_1_En_2_Chapter/437055_1_En_2_Figa_HTML.jpg](img/437055_1_En_2_Figa_HTML.jpg)`按钮，然后点击`新建潜在客户`。\n\
  \n    或者，您可以从`潜在客户`列表视图中点击`新建`来创建一个新的潜在客户（图 2-10）。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig10_HTML.jpg](img/437055_1_En_2_Fig10_HTML.jpg)\n\
  \    *图 2-10 — 潜在客户列表视图中的新建按钮*\n\n2.  如图 2-11 所示，在编辑页面上键入潜在客户的名。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig11_HTML.jpg](img/437055_1_En_2_Fig11_HTML.jpg)\n\
  \    *图 2-11 — 潜在客户记录的编辑页面。在此处填写适当的潜在客户详细信息。*\n\n3.  键入潜在客户的姓，这是保存任何潜在客户记录所必需的。键入公司名称；这是潜在客户关联的企业名称。\n\
  \n    **注意** 转化时，名和姓将生成联系人的名和姓。公司名称用于创建客户记录，并映射到`客户名称`字段。\n\n    `姓`和`公司名称`是必填的潜在客户字段。如果这些字段未填写数据，记录将无法保存。理想情况下，应在潜在客户记录中填写更多数据。您应考虑添加有关潜在客户的任何其他重要信息。\n\
  \n4.  点击`保存`以保存记录。点击`保存并新建`以保存当前记录并跳转创建新的潜在客户。\n\n5.  成功创建潜在客户后，页面顶部将显示一条成功消息，如图\
  \ 2-12 所示。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig12_HTML.jpg](img/437055_1_En_2_Fig12_HTML.jpg)\n\
  \    *图 2-12 — 新建潜在客户记录成功消息*\n\n如果记录未正确保存，将显示一条错误消息，如图 2-13 所示。错误消息显示在页面顶部。\n\n\
  ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig13_HTML.jpg](img/437055_1_En_2_Fig13_HTML.jpg)\n\
  *图 2-13 — 尝试保存记录但未填写所有标记为红色的必填字段后收到的错误消息*\n\n### 注意\n\n必填字段用红色星号标记，如图 2-11 所示。这些字段必须填写信息才能保存记录。如果某个字段没有星号，则它不是必填字段，假设没有其他验证规则，则可以留空。\n\
  \n\n\n### 如何转化线索\n\n请按照以下步骤了解如何在 Salesforce 中转化线索：\n\n1.  打开一条现有的线索记录。\n2.  在线索记录页面，点击如图\
  \ 2-14 所示的 `Convert` 按钮。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig14_HTML.jpg](img/437055_1_En_2_Fig14_HTML.jpg)\n\
  \n   **图 2-14** 线索记录上的 `Convert` 按钮\n\n3.  在 `Convert Lead` 编辑页面填写相应的详细信息，如图 2-15\
  \ 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig15_HTML.jpg](img/437055_1_En_2_Fig15_HTML.jpg)\n\
  \n   **图 2-15** 转化页面包含转化状态、记录所有者、客户名称和商机名称\n\n4.  输入转化后的状态。`Closed - Converted`\
  \ 是默认的转化状态。\n\n   **注意** 线索状态字段会捕获一个对应已转化或未转化状态的值。请选择适当的线索状态。默认情况下，`Converted` 是默认状态。\n\
  \n5.  指定记录所有者。可将其分配给任何 Salesforce 用户。\n6.  输入客户名称。您可以搜索现有的客户，也可以新建一个。如果客户不存在，请点击\
  \ `New Account` 直接创建新的客户记录。如果线索为个人，请将 `Account Name` 字段留空。\n7.  若要在转化时创建商机记录，请键入商机的名称。如果不存在商机，请将此字段留空。\n\
  8.  点击 `Convert` 并查看转化确认页面，如图 2-16 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig16_HTML.jpg](img/437055_1_En_2_Fig16_HTML.jpg)\n\
  \n   **图 2-16** 转化确认页面\n\n---\n\n## 客户和联系人\n\nSalesforce 中的客户可以是一个组织、公司或机构，而联系人则可以是与业务相关的个人。\n\
  \n例如，您可能即将与 Dunder Mifflin Paper Co. 的 Michael Scott 会面，商讨与您的产品或服务相关的潜在商机。在 Salesforce\
  \ 中跟踪有关 Michael Scott 和 Dunder Mifflin Paper Co. 的信息。创建一个名为 Dunder Mifflin Paper\
  \ Co. 的新客户。接着，为 Michael Scott 创建一条联系人记录以关联两者。\n\n### 提示\n\n在创建新记录之前最好先执行搜索，以避免重复。\n\
  \n### 客户\n\n您可以按类型、状态或 Salesforce 中的任何其他标准或自定义字段对客户进行排序。跟踪处于活跃与非活跃状态的客户、特定行业或区域内的客户，等等。\n\
  \n从 `Account` 列表中，您可以识别关键联系人、商机、个案以及相关的备注和附件，以便快速浏览。\n\n### 注意\n\n您可以在客户级别创建汇总字段以汇总特定指标。例如，创建一个汇总字段来聚合所有\
  \ `Closed Won` 商机的总金额。有关汇总字段的更多信息，请参阅第 1 章中的“字段类型”部分。\n\n客户和联系人具有主从关系。这是一种父子关系，其中主对象（`Account`）控制从对象（`Contact`）。请参阅第\
  \ 1 章中的“字段类型”部分，了解有关主从关系的更多信息。\n\n### 创建新客户\n\n客户可以直接在 Salesforce 中创建或导入，无需经过转化。创建客户记录以在客户级别跟踪信息，例如员工数量、客户编号、网站等。\n\
  \n1.  在工具栏中，点击 `Account` 标签旁边的 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figb_HTML.jpg](img/437055_1_En_2_Figb_HTML.jpg)。\n\
  2.  点击 `New Account`。\n3.  填写所有标有星号的必填字段，包括客户名称（图 2-17）。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig17_HTML.jpg](img/437055_1_En_2_Fig17_HTML.jpg)\n\
  \n   **图 2-17** 编辑模式下的客户记录\n\n4.  点击 `Save` 保存客户记录。保存成功后，将出现一条成功消息，如图 2-18 所示。\n\
  \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig18_HTML.jpg](img/437055_1_En_2_Fig18_HTML.jpg)\n\
  \n   **图 2-18** 客户成功消息\n\n### 联系人\n\n使用联系人记录来捕获个人信息，包括电子邮件地址、电话号码、出生日期等。利用这些信息增进客户关系。创建加密字段以在联系人级别存储安全信息，例如社会安全号码和信用卡信息。\n\
  \n如前所述，客户和联系人具有主从关系。要在两者之间建立关系，请确保在创建联系时输入客户名称。\n\n### 提示\n\n通过客户记录创建联系人，可以快速关联两者。\n\
  \n按照以下步骤从现有客户创建联系人：\n\n1.  在客户记录上，点击如图 2-19 所示的 `New Contact` 按钮。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig19_HTML.jpg](img/437055_1_En_2_Fig19_HTML.jpg)\n\
  \n   **图 2-19** 客户记录上的 `New Contact` 按钮\n\n2.  在编辑页面输入名字，如图 2-20 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig20_HTML.jpg](img/437055_1_En_2_Fig20_HTML.jpg)\n\
  \n   **图 2-20** 新联系人的编辑页面\n\n3.  输入姓氏（这是保存任何联系人记录所必需的）。\n4.  客户名称字段会预填您开始操作的客户记录的名称。填写关于此联系人的任何其他信息。\n\
  5.  点击 `Save` 保存记录，并关联 Michael Scott 与 Dunder Mifflin。保存成功后，将出现一条成功消息，如图 2-21 所示。\n\
  \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig21_HTML.jpg](img/437055_1_En_2_Fig21_HTML.jpg)\n\
  \n   **图 2-21** 新联系人成功消息\n\n现在，在客户记录中您可以看到新联系人记录，如图 2-22 所示。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig22_HTML.jpg](img/437055_1_En_2_Fig22_HTML.jpg)\n\
  \n**图 2-22** 一个客户及其相关联系人。点击 `New` 以关联更多联系人。\n\n---\n\n## 列表视图\n\n列表视图让您能够更轻松地排序每个对象中的\
  \ Salesforce 数据。利用列表视图可以调出特定的记录分组。例如，创建一个列表视图，仅查看活跃的客户、热门的线索以及处于谈判阶段的商机等。当满足条件时，记录会自动显示在任何列表视图中。利用\
  \ Salesforce 的导入和批量更新功能对这些列表执行操作。\n\nLightning 中的新用户界面 (UI) 使数据可视化更加容易。将图表添加到您的视图中，并使用新的拖放功能在不同阶段之间移动记录。\n\
  \n\n\n### 创建列表视图\n\n请按以下步骤创建新的列表视图：\n\n1.  要创建列表视图，请先选择所需对象的选项卡。例如，选择 `Accounts`\
  \ 选项卡来创建 `Account List` 视图。\n2.  选择图 2-23 中红色框出的列表视图控制器，然后点击 `New`。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig23_HTML.jpg](img/437055_1_En_2_Fig23_HTML.jpg)\n\
  \   图 2-23 – 列表视图控制器\n3.  为你的列表视图命名。在本例中，你正在为你的黄金客户创建一个列表视图（图 2-24）。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig24_HTML.jpg](img/437055_1_En_2_Fig24_HTML.jpg)\n\
  \   图 2-24 – 新建列表视图编辑页面\n4.  选择合适的访问级别。如果这个列表视图只希望你自己可见，请选择“只有我可以看到此列表视图”。\n5. \
  \ 点击 `Save`，然后在图 2-25 中查看新的列表。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig25_HTML.jpg](img/437055_1_En_2_Fig25_HTML.jpg)\n\
  \   图 2-25 – 选择保存后的列表视图\n6.  对列表视图应用筛选器以细分 `Salesforce` 数据，如图 2-26 所示。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig26_HTML.jpg](img/437055_1_En_2_Fig26_HTML.jpg)\n\
  \   图 2-26 – 列表视图中的筛选区域\n7.  使用图 2-27 中的筛选部分对您的 `Salesforce` 数据应用筛选器。点击 `Add Filter`。\n\
  \   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig27_HTML.jpg](img/437055_1_En_2_Fig27_HTML.jpg)\n\
  \   图 2-27 – 使用此部分创建筛选逻辑\n8.  设置筛选器的 `Field`、`Operator` 和 `Value` 选项，如图 2-14 所示。（更多关于操作符的信息，请参见报表区域。）\n\
  \   **示例** 为了创建一个仅包含我拥有的热门线索的列表，我创建了一个筛选器。此筛选器的值包括“仅显示我是所有者的线索记录”，并且 `Rating` 字段值为\
  \ `Equal to Hot`。\n9.  点击 `Done` 和 `Save`。\n\n### 对列表视图执行操作\n\n在列表视图中，可以通过点击铅笔图标或双击字段来内联编辑记录。要保存在列表视图中修改过的记录，请点击页面底部的\
  \ `Save`（图 2-28）。\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig28_HTML.jpg](img/437055_1_En_2_Fig28_HTML.jpg)\n\
  图 2-28 – 列表内的图表\n\n体验 Lightning Experience 中对列表视图的增强更新。`Salesforce` 通过其报表图表和看板功能为列表视图引入了全新的用户界面。报表图表可以显示为条形图和环形图。\n\
  \n#### 看板功能\n\n借助全新的看板功能，在 `Salesforce` 中进行闪电般快速的更改。通过使用图 2-29 中所示的新拖放功能，即时更新列表视图内多个记录的状态。在看板视图中，每个记录都显示为一个小组件，可以在线索状态流程中进行拖放。此增强功能使数据的可视化和组织更加容易。\n\
  \n1.  要将默认的列表视图从网格列表更改为看板，请点击 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figc_HTML.jpg](img/437055_1_En_2_Figc_HTML.jpg)\
  \ 按钮。\n2.  点击 `Kanban`。\n3.  将记录拖放到相应的列以即时更新状态。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig29_HTML.jpg](img/437055_1_En_2_Fig29_HTML.jpg)\n\
  图 2-29 – 看板视图中的列表视图\n\n#### 批量更改状态\n\n要一次更改一组记录的状态，请为那组数据创建一个列表视图。\n\n1.  选择需要更新的记录，可以逐个选择，也可以全选，如图\
  \ 2-18 所示。\n2.  在列表视图中，点击 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figd_HTML.jpg](img/437055_1_En_2_Figd_HTML.jpg)。\n\
  3.  接着，点击 `Change Status`。需要注意的是，只有前三个操作会显示出来。任何额外的状态值都归在箭头下。\n4.  在 `Change Status`\
  \ 弹出窗口中，选择图 2-30 中所示的更新状态。在此处，您可以一键更改一组记录的状态。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig30_HTML.jpg](img/437055_1_En_2_Fig30_HTML.jpg)\n\
  \   图 2-30 – 批量更改一组记录状态的步骤\n5.  点击 `Save` 并查看对所选记录的更新更改。\n\n### 创建电子邮件模板\n\n轻松在一个中心位置标准化公司电子邮件。使用合并字段，从给定的记录中将自定义值填充到模板中。直接从帐户、联系人或商机中创建并存储在即兴的电子邮件模板。\n\
  \n1.  在联系人记录中，选择 `Email`，如图 2-31 所示。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig31_HTML.jpg](img/437055_1_En_2_Fig31_HTML.jpg)\n\
  \   图 2-31 – 如何创建并保存电子邮件模板\n2.  输入收件人的电子邮件地址。\n3.  输入电子邮件的主题。\n4.  在邮件正文中撰写邮件内容。\n\
  5.  选择 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fige_HTML.jpg](img/437055_1_En_2_Fige_HTML.jpg)\
  \ 以包含合并字段。\n6.  点击 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figf_HTML.jpg](img/437055_1_En_2_Figf_HTML.jpg)\
  \ 将其另存为新模板。\n\n### 发送电子邮件\n\n在 `Salesforce` 的 `Activity` 部分中，选择 `Email` 选项卡即可发送电子邮件。输入收件人的电子邮件地址和主题，如图\
  \ 2-31 所示。\n\n1.  从任意记录中点击 `Activity` 选项卡。\n2.  输入电子邮件的主题。\n3.  输入电子邮件的正文内容。\n4.\
  \  要将此电子邮件与 `Salesforce` 中的另一个记录关联，请在 `Related To` 部分中搜索并输入该记录。\n5.  点击 `Send`。\n\
  \n### 注意\n\n要访问存储的模板，请点击 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figg_HTML.jpg](img/437055_1_En_2_Figg_HTML.jpg)\
  \ 并选择 `Insert Template`。从可用模板列表中进行选择。\n\n## 商机\n\n商机使您能够保存关于任何潜在交易、订单或任何可能产生收入的**关键信息**（图\
  \ 2-32）。交易追踪是任何业务不可或缺的一部分。通过跟踪所有进行中的交易，有效最大化并加速销售工作。使用这个强大的工具，防止交易从缝隙中溜走。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig32_HTML.jpg](img/437055_1_En_2_Fig32_HTML.jpg)\n\
  图 2-32 – 商机列表视图\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成地道、专业的中文。\n\
  \n\n### 创建新的商机\n\n跟踪关键信息以帮助达成进行中的交易。跟踪已发送的样品、最新的接触点以及后续步骤。利用或自定义`阶段`字段，以跟踪交易在销售渠道中的位置。使用结束日期来预测此交易的预期成交日期。\n\
  \n1.  点击`商机`菜单。\n2.  点击`新建商机`，并填写图 2-33 所示的必填字段。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig33_HTML.jpg](img/437055_1_En_2_Fig33_HTML.jpg)\n\
  \n    图 2-33\n    商机的编辑页面\n\n3.  输入商机名称。\n4.  输入预期的结束日期，并填写有关此商机的任何其他详细信息。建议填写更多关于商机的详细信息。\n\
  5.  选择商机记录的阶段。\n6.  点击`保存`以保存商机记录。\n7.  一旦保存，Salesforce 会将客户与商机关联起来。\n\n### 提示\n\
  \n不确定如何命名商机？请尽量保持商机命名的一致性并使其具体化。例如，`数量 + 感兴趣的产品或服务`。\n\n### 商机阶段历史记录\n\n使用`阶段历史记录`区域来跟踪阶段的变更。对阶段、金额、可能性、预期收入或结束日期所做的任何更改都会显示在此处。选择`查看全部`以查看所有更改的列表视图，如图\
  \ 2-34 所示。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig34_HTML.jpg](img/437055_1_En_2_Fig34_HTML.jpg)\n\
  \n图 2-34\n商机记录上的阶段历史记录列表\n\n## 产品\n\n`产品`代表您公司提供的产品或服务。在此对象中存储重要的产品信息，以便销售代表在销售过程中利用。产品描述和定价是销售代表在出差或通话时可以使用的有力信息。\n\
  \n使用产品来与商机或报价关联。无缝更新商机金额以预测潜在的即将到来的收入。利用此信息来报告畅销产品等。\n\n### 创建产品\n\n请按照以下步骤在 Salesforce\
  \ 中创建产品：\n\n1.  点击`产品`选项卡（如图 2-35 所示）。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig35_HTML.jpg](img/437055_1_En_2_Fig35_HTML.jpg)\n\
  \n    图 2-35\n    产品选项卡\n\n2.  点击`新建`（图 2-36）。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig36_HTML.jpg](img/437055_1_En_2_Fig36_HTML.jpg)\n\
  \n    图 2-36\n    产品列表视图上的新建按钮\n\n3.  输入产品详细信息。为产品输入一个描述性名称，并提供描述（图 2-37）。\n\n \
  \   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig37_HTML.jpg](img/437055_1_En_2_Fig37_HTML.jpg)\n\
  \n    图 2-37\n    创建产品的编辑页面包括产品名称、产品代码、描述、产品系列和启用状态\n\n4.  点击`启用`复选框以在 Salesforce\
  \ 中激活该产品。\n5.  点击`保存`。\n6.  在产品记录的`相关`选项卡中，点击`添加标准价格`（如图 2-38 所示）。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig38_HTML.jpg](img/437055_1_En_2_Fig38_HTML.jpg)\n\
  \n    图 2-38\n    添加标准价格按钮\n\n7.  输入产品的标价，如图 2-39 所示，如果未使用其他价目表，则将其与标准价目表关联。\n\n\
  \    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig39_HTML.jpg](img/437055_1_En_2_Fig39_HTML.jpg)\n\
  \n    图 2-39\n    价目表条目页面\n\n8.  点击`保存`。Salesforce 将创建新的价目表条目记录。\n\n#### 说明\n\n\
  产品如何与价目表关联？必须先将产品添加到价目表，然后才能在商机中使用。价目表可用于记录单个产品的多个定价。使用价目表为批发商、分销商和其他客户定义价格。\n\n\
  ### 商机产品\n\n请按照以下步骤在 Salesforce 中创建商机产品：\n\n1.  在商机记录中，点击图 2-40 所示的`产品`列表中的箭头。\n\
  \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig40_HTML.jpg](img/437055_1_En_2_Fig40_HTML.jpg)\n\
  \n    图 2-40\n    商机记录上的产品列表\n\n2.  点击`添加产品`。\n3.  选择每个应附加的产品旁边的`+`按钮。参见图 2-41。\n\
  \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig41_HTML.jpg](img/437055_1_En_2_Fig41_HTML.jpg)\n\
  \n    图 2-41\n    产品选择页面\n\n4.  点击`下一步`。\n5.  为此特定商机和每个产品选择数量，如图 2-42 所示。\n\n  \
  \  ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig42_HTML.jpg](img/437055_1_En_2_Fig42_HTML.jpg)\n\
  \n    图 2-42\n    商机产品选择\n\n6.  更新每个产品的销售价格。\n7.  如果需要，输入日期或行描述。\n8.  点击`保存`。\n\
  9.  查看成功附加到此商机的新的商机产品记录，如图 2-43 所示。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig43_HTML.jpg](img/437055_1_En_2_Fig43_HTML.jpg)\n\
  \n    图 2-43\n    附加了新产品的商机主页\n\n#### 商机记录页面\n\n图 2-43 右侧的产品面板显示了与商机关联的产品。点击任何产品记录旁边的\
  \ ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figh_HTML.jpg](img/437055_1_En_2_Figh_HTML.jpg)\
  \ 可从商机中进行编辑或删除。\n\n图 2-43 页面顶部的`阶段`工作区是一个交互式工具，可用于帮助销售代理推进其销售流程。\n\n### 活动时间线\n\n\
  通过在 Salesforce 中设置提醒和分配任务来确定日常任务的优先级。使用活动来创建任务、创建事件或记录通话。在 Lightning Experience\
  \ 中，`活动时间线`替代了经典的`活动历史记录`和`未完成活动`列表，如图 2-44 所示。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig44_HTML.jpg](img/437055_1_En_2_Fig44_HTML.jpg)\n\
  \n图 2-44\n潜在客户记录中的活动部分\n\n使用`记录通话`选项卡的评论部分来记录重要的通话详情。将联系人与其他客户或商机关联起来。\n\n### 配置活动动态\n\
  \n您可以通过创建新任务和事件来配置您的活动动态。\n\n\n\n### 创建新任务\n\n按以下步骤创建新任务，如图 2-45 所示：\n\n1. 输入任务的主题。\n\
  2. 输入任务截止日期。该截止日期用于在任务即将到期或逾期时发出通知。\n3. 在`相关`部分将任务与`Salesforce`中的其他记录关联。默认情况下，创建任务的人即为`分配给`的人员。只需点击`x`并选择应分配任务的人员，即可更改此设置。\n\
  4. 选择状态。`未开始`、`进行中`、`已完成`、`等待他人`和`已推迟`是标准状态值。\n5. 点击`保存`。成功创建任务记录后会显示一条消息，如图 2-46\
  \ 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig46_HTML.jpg](img/437055_1_En_2_Fig46_HTML.jpg)\n\
  \n   图 2-46 — 任务创建成功消息\n\n6. 任务已保存并记录在`后续步骤`部分。已完成的任务会移至`过往活动`区域并显示，如图 2-47 所示。\n\
  \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig47_HTML.jpg](img/437055_1_En_2_Fig47_HTML.jpg)\n\
  \n   图 2-47 — 后续步骤部分\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig45_HTML.jpg](img/437055_1_En_2_Fig45_HTML.jpg)\n\
  \n图 2-45 — 创建新任务的步骤\n\n### 创建新事件\n\n追踪与您的线索或联系人相关的任何事件。事件将包含开始日期和结束日期。\n\n按照以下步骤为线索记录创建新事件，并参考图\
  \ 2-48。\n\n1. 选择`新建事件`选项卡，如图 2-46 所示。\n2. 输入事件的主题。\n3. `Salesforce`中的每个事件都必须有开始日期和结束日期。在此处输入这些详细信息。\n\
  4. 如果这是一个全天事件，请选中该复选框。\n5. 如果事件有地点，请在`地点`中输入地点详细信息。此为可选操作。\n6. 如果事件与某个客户相关联，请搜索相关客户以关联两者，如图\
  \ 2-49 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig49_HTML.jpg](img/437055_1_En_2_Fig49_HTML.jpg)\n\
  \n   图 2-49 — 事件页面上的“关联至”和“分配给”字段\n\n7. 任务和事件可以分配给其他`Salesforce`用户。选择应将任务分配给谁，如图\
  \ 2-49 所示。\n8. 点击`保存`。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig48_HTML.jpg](img/437055_1_En_2_Fig48_HTML.jpg)\n\
  \n图 2-48 — 创建新事件的步骤\n\n### 创建网络线索表单\n\n借助网络线索表单，可以从您的网站即时生成`Salesforce`中的线索。例如，在您的网站上创建一个`联系我们`表单，用于在`Salesforce`中创建新的线索记录。创建自定义字段以跟踪来自您网站的特定信息并将其纳入`Salesforce`。\n\
  \n按以下步骤创建网络线索表单：\n\n1. 点击`设置`。\n2. 在`快速查找`部分搜索`web-to-lead`。\n3. 点击`创建网络线索表单`。\n\
  4. 标准和自定义字段会显示在`可用字段`多选选择列表中，如图 2-50 所示。将字段添加到`已选择字段`列，以显示在您的网络线索表单上。\n\n   **注意：**\
  \ 公式字段不可选择。\n\n5. 用户提交网络线索表单后，将被引导至指定的返回 URL。在此处输入返回 URL。请注意，这通常是一个感谢页面。\n6. 选中此复选框以启用`reCaptcha`来防止垃圾邮件。建议启用。\n\
  7. 要使用此功能，请访问 Google `reCaptcha` 网站，点击`获取 reCaptcha` 注册域名。获取后，在此处输入 API 密钥对。\n8.\
  \ 如果 Google 服务器宕机，请选中此框，以允许所有流量和线索无需`reCaptcha`即可生成。\n\n**注意：** 您可以在 24 小时内最多生成\
  \ 500 个线索。超过此数量的任何额外线索将被放入队列。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig50_HTML.jpg](img/437055_1_En_2_Fig50_HTML.jpg)\n\
  \n图 2-50 — 网络线索设置页面\n\n### 创建网络线索自动回复规则\n\n通过向从您的网站捕获的线索发送自动回复消息，改善您的客户沟通。例如，创建一个自动回复规则，通知客户您已收到他们的提交，并将在\
  \ 24 小时内联系他们。\n\n1. 点击图 2-51 中所示的`新建`按钮。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig51_HTML.jpg](img/437055_1_En_2_Fig51_HTML.jpg)\n\
  \n   图 2-51 — 创建新的网络线索自动回复规则\n\n2. 为图 2-52 中所示的自动回复规则命名。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig52_HTML.jpg](img/437055_1_En_2_Fig52_HTML.jpg)\n\
  \n   图 2-52 — 命名自动回复规则\n\n3. 选择`启用`以激活规则。\n4. 点击`保存`。\n5. 选择已创建的规则。\n6. 点击`规则条目`部分的`新建`。\n\
  7. 确定排序顺序并设置所需条件。在此示例中，我为所有来自我网站的线索创建了一个自动回复规则，如图 2-53 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig53_HTML.jpg](img/437055_1_En_2_Fig53_HTML.jpg)\n\
  \n   图 2-53 — 设置自动回复规则的条件\n\n8. 选择触发此规则的条件。当任何线索的来源为`Web`时，将触发此规则。\n9. 输入发件人姓名。\n\
  10. 输入发件人电子邮件地址。\n11. 选择要使用的电子邮件模板。\n12. 点击`保存`。现在，任何符合您所设置条件的线索将自动收到一封使用您所选模板的电子邮件。\n\
  \n### 创建线索分配规则\n\n通过创建线索分配规则来自动化您的线索路由流程。可以根据设置的条件将新线索自动分配给某个用户或队列。\n\n1. 点击`设置`。\n\
  2. 在`快速查找`中搜索`线索分配规则`并选择它。\n3. 点击`新建`按钮。\n4. 为规则命名并在此处输入。\n5. 选择`启用`以激活此规则；一次只能激活一个规则。\n\
  6. 点击`保存`。\n7. 选择规则名称。\n8. 点击`规则条目`部分的`新建`按钮，如图 2-54 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig54_HTML.jpg](img/437055_1_En_2_Fig54_HTML.jpg)\n\
  \n   图 2-54 — 线索分配规则列表\n\n9. `Salesforce`将根据排序顺序评估每个条目。为此规则设置排序顺序。\n10. 通过选择字段、适当的运算符和值来设置此规则的条件。在此示例中，我为所有来自加利福尼亚州的线索创建规则。\n\
  11. 确定符合此条件的线索应分配给用户还是队列。输入用户或队列的名称。\n12. 点击`保存`。\n\n\n\n#### 创建线索队列\n\n通过控制线索分配方式来管理工作负载。线索会被分组到这些队列中，供团队成员查看和领取。线索记录在用户领取前会一直保留在队列中。\n\
  \n1. 在 `Setup`中，转到 `Queues`。\n2. 点击如图 2-55 所示的 `New` 按钮。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig55_HTML.jpg](img/437055_1_En_2_Fig55_HTML.jpg)\n\
  \n   图 2-55\n\n   线索队列\n\n3. 输入队列名称。\n4. 若要在线索添加到队列时通知团队成员，请输入队列电子邮件并选择 `Send Email\
  \ to Members`。\n5. 选择 `Lead` 并将其移动到 `Selected Objects`。\n6. 如图 2-56 所示，选择队列成员并将其移动到`Selected\
  \ Members`。您可以通过用户、角色和组来定义选定的成员。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig56_HTML.jpg](img/437055_1_En_2_Fig56_HTML.jpg)\n\
  \n   图 2-56\n\n   将成员添加到队列\n\n7. 点击 `Save`。现在，符合条件的线索记录将被放入队列。队列成员将能够查看这些线索并从中获取。\n\
  \n## 创建营销活动\n\n市场营销专业人员可以使用这个强大的工具来跟踪任何营销举措和努力。跟踪响应率和转化率，最终计算投资回报率 (ROI)。使用这些指标来确认营销工作的有效性。营销活动可以成为改进未来营销工作的有效工具。\n\
  \n按照以下步骤创建营销活动并添加营销活动成员：\n\n1. 在 `Campaign` 选项卡中选择 `New Campaign`，如图 2-57 所示。\n\n\
  \   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig57_HTML.jpg](img/437055_1_En_2_Fig57_HTML.jpg)\n\
  \n   图 2-57\n\n   营销活动选项卡和列表视图\n\n2. 输入您的营销活动的名称，如图 2-58 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig58_HTML.jpg](img/437055_1_En_2_Fig58_HTML.jpg)\n\
  \n   图 2-58\n\n   营销活动编辑页面\n\n3. 填写营销活动的详细信息。包括活动类型、活动开始日期和结束日期，以及其他重要信息。\n4. 选中\
  \ `Active` 复选框以使营销活动处于活动和当前状态。\n5. 点击 `Save`。\n\n   营销活动激活后，您需要添加营销活动成员。这将把一切联系起来。营销活动成员是与特定营销活动相关联的线索和联系人。\n\
  \n   请注意，线索和联系人与营销活动是多对一关系。这意味着它们可以与多个营销活动相关联。点击 `Add Leads` 关联线索记录，或点击 `Add Contacts`\
  \ 关联联系人记录（图 2-59）。这些线索和联系人被视为营销活动的成员。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig59_HTML.jpg](img/437055_1_En_2_Fig59_HTML.jpg)\n\
  \n   图 2-59\n\n   将线索和联系人作为营销活动成员添加到营销活动中\n\n6. 选择应作为营销活动成员关联的记录，然后选择 `Add to Campaign`，如图\
  \ 2-60 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig60_HTML.jpg](img/437055_1_En_2_Fig60_HTML.jpg)\n\
  \n   图 2-60\n\n   添加营销活动成员\n\n   营销活动成员提供关于营销活动响应率的报告。Salesforce 使用以下标准值来跟踪这些工作：`Sent`\
  \ 和 `Responded`。\n\n7. 输入此记录应关联的营销活动。\n8. 将成员状态定义为现有状态，或更新成员状态为 `Sent` 或 `Responded`（见图\
  \ 2-61）。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig61_HTML.jpg](img/437055_1_En_2_Fig61_HTML.jpg)\n\
  \n   图 2-61\n\n   关联营销活动和所选营销活动成员应具有的状态的步骤\n\n9. 点击 `Submit`。Salesforce 将生成一条成功消息，如图\
  \ 2-62 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig62_HTML.jpg](img/437055_1_En_2_Fig62_HTML.jpg)\n\
  \n   图 2-62\n\n   营销活动成员成功消息\n\n## 总结\n\nSales Cloud 提供了有效的工具来连接您的销售和营销团队。Sales\
  \ Cloud 为您的 CRM 需求奠定了基础，并为您的机会管道提供了有洞察力的信息。\n\n"
- "# 3. Salesforce Service Cloud\n\nSalesforce Service Cloud 允许您的客户服务代表和支持代表（用户）管理、跟踪和解决客户的咨询和问题。Service\
  \ Cloud 应用程序使用 `Case` 对象来捕获解决咨询和问题所需的所有详细信息。您的用户可以通过电话和亲自上门为请求手动创建个案，也可以接受来自多个渠道（例如，网络表单、电子邮件、实时网络聊天、在线社区和社交媒体渠道）的个案。您可以通过设置个案分配规则，让您的用户高效地管理这些渠道。Salesforce\
  \ Service Cloud 应用程序还允许您在需要将问题上报给管理层时创建个案升级规则。跟踪公司收到的各种客户咨询甚至可以帮助您建立新的流程。它还将帮助您了解公司内部的任何薄弱点。图\
  \ 3-1 展示了 Service Cloud 中可能发生的内部沟通。简而言之，该应用程序有助于更快地解决客户问题。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig1_HTML.jpg](img/437055_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n内部沟通\n\n## Salesforce 个案管理概述\n\nSalesforce 个案管理允许用户捕获 `Case` 对象的必要详细信息，以管理和成功解决他们的个案。用户可以在\
  \ 29 个标准字段中查看重要的个案详细信息，也可以创建自己的自定义字段。用户可以通过包含 `New`、`Working`、`Escalated` 和 `Closed`\
  \ 等值的下拉字段来跟踪个案的状态。用户还可以访问所有必要的关联对象，例如客户、联系人详细信息和产品信息。授予用户访问客户和联系人详细信息的权限，将使他们对提交个案的客户有全面的了解。他们可以根据提交的个案将优先级设置为\
  \ `High`、`Medium` 或 `Low`，也可以设置页面布局以最好地满足他们自己和公司的需求。\n\n\n\n### 标准案例字段及相关列表简介\n\n\
  Salesforce 通过其`Case`对象提供了许多标准字段，如图 3-2 所示。在决定创建自定义字段之前，我们建议您优先使用现有的标准字段。大多数 Salesforce\
  \ 标准字段都应用了后端自动化。由于每个企业的业务都不同，您很可能需要自定义字段，但既然非得已，何必重复造轮子呢？\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig2_HTML.jpg](img/437055_1_En_3_Fig2_HTML.jpg)\n\
  \n**图 3-2** 案例信息字段\n\n您将在`案例信息`部分找到以下字段（如图 3-2 所示）：\n\n- **父案例**：关联一个已存在且导致创建新案例的案例。\n\
  \n**注意** 如果您使用此功能，务必将相关列表“相关案例”添加到案例页面布局中，以便全面查看附属于父案例的所有案例。\n\n- **案例负责人**：指派主要负责管理该案例的用户。\n\
  \n- **案例编号**：这是一个自动生成的编号，用于在内部和外部引用案例。\n\n**提示** 使用此案例编号，让您的用户和客户在处理案例时能够引用它。可将其应用于自动发送的电子邮件中。\n\
  \n- **状态**：使用此字段跟踪案例的当前状态。可以利用现有值（`新建`、`已升级`和`已关闭`）或添加您自己的状态值。\n\n- **联系人姓名**：关联提交案例的联系人。\n\
  \n- **已升级**：使用此复选框将工作流规则（本章稍后将讨论）应用于自动升级。此外，选中此框后，您会在案例编号旁边看到新添加的红色箭头，表示该案例已被升级。利用此字段在报表和仪表板中关注您最重要的案例。\n\
  \n- **客户名称**：关联联系人后，该字段会自动填充该联系人的客户详细信息。如果该案例属于与关联联系人不同的客户，请用相应的客户信息覆盖此字段。\n\n-\
  \ **优先级**：使用标准值`高`、`中`或`低`为案例分配必要的优先级。利用此字段在报表和仪表板中关注您最重要的案例。\n\n- **类型**：使用此字段跟踪您的团队正在管理的案例类型。利用此字段来帮助确定应该开发或更新哪些常见问题解答。\n\
  \n- **案例原因**：使用此字段跟踪客户联系您的原因。您也可以使用此字段来帮助更新常见问题解答、内部流程等等。\n\n- **案例来源**：使用此字段跟踪案例的来源，无论是来自在线表单、电子邮件、电话还是当面提交。\n\
  \n- **打开日期/时间**：此字段会自动填充案例创建的日期和时间。\n\n- **关闭日期/时间**：此字段会自动填充案例关闭的日期和时间。案例可以通过将状态更改为已关闭状态，或通过许多其他方式（例如，`API`、导入更新、自动化规则等）来关闭。\n\
  \n**注意** Salesforce 报表附带一个`时长`字段，用于跟踪持续时间（以天为单位）。但是，此字段不是可以放在案例布局上的字段。如果您希望用户在案例页面布局上看到案例已打开（或曾打开）的持续时间，可以创建一个公式字段。\n\
  \n- **创建时已关闭**：用户可以创建一个新案例并立即关闭它。发生这种情况时，此字段的复选框将被标记为 true，并可在报表中使用。\n\n在图 3-3 的`联系人信息`下，您将找到以下字段：\n\
  \n- **联系人电话**、**联系人手机**、**联系人传真**和**联系人电子邮件**：这些字段属于关联到该案例的联系人。它们都是用于将一个对象的字段映射到另一个对象的公式字段。由于这些是公式字段，因此它们是锁定字段，无法从`Case`对象更新。相反，您需要转到联系人记录并更新那里的信息。\n\
  \n在图 3-3 的`网络信息`下，您将找到以下字段：\n\n- **网络电子邮件**、**网络公司**、**网络姓名**和**网络电话**：当配置了 Web\
  \ 转案例功能（我们将在本章后面介绍）时，系统将在 Salesforce 中自动创建案例。这些字段将填充来自您 Web 表单的相应数据。\n\n在图 3-3 的`描述信息`下，您将找到以下字段：\n\
  \n- **主题**：当配置了电子邮件转案例功能时，使用此字段作为传入电子邮件的主题行，或者作为案例内容的快速参考。请注意，此字段的数据也会在页面布局的顶部显示。\n\
  \n- **描述**：当配置了电子邮件转案例功能时，使用此字段作为传入电子邮件的正文，或者作为案例的详细描述。\n\n- **内部备注**：在与客户通话时，使用此字段创建案例备注。\n\
  \n- **创建者**：此字段存在于 Salesforce 中的每一条记录上。它会记录谁在什么日期和时间创建了该案例。\n\n- **最后修改者**：此字段也存在于\
  \ Salesforce 中的每一条记录上。它会记录谁在什么日期和时间最后更新或修改了该案例。\n\n### 提示\n\n如果这些字段不够用或不适合您的公司，请不要担心。其中某些字段的默认位置很容易修改。Salesforce\
  \ 允许在`Case`对象上创建多达 500 个自定义字段。您可以创建用于文本、日期和时间、数字、货币、百分比、选择列表、多选选择列表、复选框、电子邮件、电话和\
  \ URL 的字段。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig3_HTML.jpg](img/437055_1_En_3_Fig3_HTML.jpg)\n\
  \n**图 3-3** 更多案例字段\n\n接下来，我们将讨论在`Case`对象上找到的标准相关列表。\n\n图 3-4 显示了标准的`Case`对象相关列表。*相关列表*是您\
  \ Salesforce 组织中与您当前正在查看的对象相连接的另一个对象。您将在`Case`对象上找到的相关列表包括：\n\n- **解决方案**：此相关列表包含在名为`解决方案`的另一个\
  \ Salesforce 对象中创建的文章。解决方案用于存放那些可以帮助您的用户更快关闭案例，或向案例联系人提供信息的内容。此对象与另一个名为`知识`的 Salesforce\
  \ 产品协同工作。解决方案和`知识`是重要的产品，因为它们为您的用户提供了推动案例处理的资源。\n\n- **未完成活动**：这些记录是您的用户创建的未来或未完成的任务或事件。任何尚未完成的任务或事件都会显示在此处。\n\
  \n- **活动历史记录**：这些记录是您的用户已完成的任务、电子邮件、通话记录和事件。\n\n- **案例评论**：这些记录提供与案例相关的信息。您的用户会将重要的案例评论添加到此区域。\n\
  \n- **附件**：这些记录反映与案例相关的外部文档。这可能是当前的客户合同，或者客户提供的关于他们遇到的错误的截图。\n\n- **案例历史记录**：此内容包括对`Case`对象所做的所有字段级别的更改。您可以设置字段跟踪并选择哪些字段最重要（我们将在本书后面介绍）。\n\
  \n\n\n#### 说明\n\nSalesforce 还提供其他相关列表。虽然不在标准页面布局上，但这些列表可以轻松添加到您的页面布局中。一个值得注意的列表是\
  \ `Contact Roles`（联系人角色），它允许您向一个案例记录添加多个联系人。另一个相关列表是 `Emails`（电子邮件），当您启用了“电子邮件转案例”功能时（本章后面会解释），就会用到它。如果在您的电子邮件帐户中正确设置，您的用户就可以留在\
  \ `Salesforce` 内，而无需在两个系统之间来回切换（后续也会介绍）。\n\n### 提示\n\nSalesforce 允许您将不同对象相互关联起来。如果您的\
  \ `Case`（案例）对象需要关联另一个对象的多个记录，您可以创建一个中间对象。例如，如果您想关联一个案例中涉及的多个产品，就可以这样做。创建自定义对象比您想象的要简单。\n\
  \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig4_HTML.jpg](img/437055_1_En_3_Fig4_HTML.jpg)\n\
  \n*图 3-4* 包含标准相关列表的案例布局\n\n## 创建新案例记录\n\n您可以手动输入一个案例，方法是先导航到 `Case`（案例）对象（见图 3-5），然后单击\
  \ `New`（新建）按钮。打开一条记录后，您就可以通过添加联系人姓名、客户名称、优先级、案例来源、类型和案例原因来开始填写案例详情（见图 3-6）。确保在 `Subject`（主题）和\
  \ `Description`（描述）字段中记录客户联系您的原因或解释（图 3-6）。在添加这些详细信息时，如有必要，请使用 `Internal Comments`（内部备注）字段。如果您为\
  \ `Case`（案例）对象创建了自定义字段，请务必培训您的用户如何填写这些详细信息。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig5_HTML.jpg](img/437055_1_En_3_Fig5_HTML.jpg)\n\
  \n*图 3-5* 如果您尚未进入 `Cases`（案例）选项卡，请使用对象标题旁边的向下箭头导航到 `Cases`（案例）选项卡\n\n建议按照以下步骤创建新的案例记录（图\
  \ 3-6 和 3-7）：\n\n1.  输入联系人姓名，然后单击字段旁的放大镜图标，将联系人关联到案例。\n2.  客户名称将自动分配为您在联系人字段中关联的联系人所对应的客户。\n\
  \n### 提示\n\n`Accounts`（客户）和 `contacts`（联系人）可以禁用为必填字段。\n\n1.  单击优先级字段，更改案例的优先级。从提供的值中选择合适的值。\n\
  2.  单击来源字段，选择案例的来源，再选择合适的值。请注意该字段旁的 `*` 符号。这表示它是必填字段。\n3.  单击类型和案例原因字段，并选择合适的值。\n\
  4.  如有必要，此时适当地填写任何自定义字段。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig6_HTML.jpg](img/437055_1_En_3_Fig6_HTML.jpg)\n\
  \n    *图 3-6* 创建案例（步骤 1 至 6）\n\n5.  输入案例的主题。\n6.  输入案例的描述。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig7_HTML.jpg](img/437055_1_En_3_Fig7_HTML.jpg)\n\
  \n    *图 3-7* 创建案例（步骤 7 和 8）\n\n    **注意** `Subject`（主题）和 `Description`（描述）字段用于“电子邮件转案例”功能。\n\
  \n7.  完成后，单击 `Save`（保存）。\n\n### 提示\n\n利用案例的 `Date/Time Opened`（打开日期/时间）和 `Date/Time\
  \ Closed`（关闭日期/时间）字段，生成关于案例处理时间的报告。此外，案例类型和原因字段有助于定义客户和内部常见问题解答。\n\n## 与团队协作处理案例记录\n\
  \n管理和高效关闭案例可能需要您团队中的多人参与。用户可以使用其案例记录中的案例动态，与团队中的其他人快速沟通。他们还可以向有权访问该案例记录的任何 Salesforce\
  \ 用户发送消息。\n\n要向用户提及一条评论，您可以使用 `@` 符号后跟用户名，一旦名称出现在文本区域下方，就点击该超链接名称。您还会看到，每项操作都会记录在案例动态中，以便完整查看案例及其整个过程中的所有情况。案例记录左侧的动态筛选器可帮助您快速导航到案例的动态相关项目。动态详情将按照从底部最旧到顶部最新的顺序显示。这使您可以快速查看关于该案例的最新对话或已完成的工作。图\
  \ 3-8 展示了案例动态的功能。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig8_HTML.jpg](img/437055_1_En_3_Fig8_HTML.jpg)\n\
  \n*图 3-8* 案例动态\n\n要与您的团队协作，请遵循以下步骤：\n\n1.  单击 `Feed`（动态）选项卡访问案例动态。\n2.  利用发布区域与您的团队就案例进行沟通。\n\
  3.  利用案例动态在整个案例处理期间跟踪所有对话。\n4.  案例动态会捕获对案例状态所做的更改。\n5.  案例动态还跟踪诸如 `Log a Call`（记录通话）活动以及其他常规任务等活动（见图\
  \ 3-9）。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig9_HTML.jpg](img/437055_1_En_3_Fig9_HTML.jpg)\n\
  \n    *图 3-9* 利用动态筛选器快速导航至所有通话记录、案例备注、状态更改以及任务和事件\n\n## 案例自动化\n\nSalesforce 提供自动执行某些功能的能力，例如自动将案例分配给队列或特定用户。Salesforce\
  \ 还允许您创建规则，根据特定条件自动回复与案例相关的客户。您还可以根据条件配置案例升级规则，这些规则将自动将案例分配给升级后的案例。伴随这种案例升级，您可以配置在满足此条件时发送的自动通知。您还可以从电子邮件或网络表单中路由案例。您还可以调整一些支持设置，以进一步自定义您的案例自动化。图\
  \ 3-10 展示了一个案例队列。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig10_HTML.jpg](img/437055_1_En_3_Fig10_HTML.jpg)\n\
  \n*图 3-10* 案例队列\n\n\n\n## 创建案例队列\n\n案例可通过多种方式发送到队列。您可以在创建案例时自动将其分配给队列，或在案例生命周期中，由于案例记录的变更而将其发送到队列。您可以将队列视为一个“暂存池”。这个暂存池允许您授予多个用户访问权限，并让他们选择接受新案例。您不必将案例分配给特定所有者，而是可以使用案例分配规则将其分配给队列。在图\
  \ `[3-11]` 到 `[3-14]` 中，您将学习如何在 `Salesforce` 中创建队列。具体步骤如下：\n\n1.  单击 `Salesforce`\
  \ 窗口右上角的设置齿轮图标，导航到 `Setup` 菜单。\n2.  使用搜索区域，输入 `Queue`。点击 `Users` 下的 `Queues`。\n\
  3.  点击 `New` 按钮。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig11_HTML.jpg](img/437055_1_En_3_Fig11_HTML.jpg)\n\
  \n    图 3-11\n    创建案例队列\n\n4.  为队列创建一个面向用户的标签，然后按 `Tab` 键。`Salesforce` 会自动创建队列名称。\n\
  5.  如果您希望在有新案例添加到队列时收到通知，请将电子邮件地址填入 `Queue Email` 字段。\n6.  如果您希望分配给该队列的用户在队列中有新案例时收到电子邮件，请选中\
  \ `Send Email to Members` 复选框。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig12_HTML.jpg](img/437055_1_En_3_Fig12_HTML.jpg)\n\
  \n    图 3-12\n    为队列命名并设置通知选项\n\n7.  选择 `Case` 对象，然后单击箭头将其移至 `Selected Objects`\
  \ 区域。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig13_HTML.jpg](img/437055_1_En_3_Fig13_HTML.jpg)\n\
  \n    图 3-13\n    为队列选择对象\n\n8.  使用搜索区域，在下拉菜单中选择您是要搜索特定用户、公共组、角色，还是角色及其下属。\n\n \
  \   **注意：** 选择 `Roles and Subordinates` 选项将授予特定角色及其所有下级角色对特定队列的访问权限。例如，如果您的 `CEO`\
  \ 位于角色层次结构的顶层，并且您使用此功能授予 `CEO` 访问权限，那么 `CEO` 角色以下的所有人员也将获得访问权限。\n\n9.  选择特定的用户、公共组、角色，或角色及其下属，然后使用向右箭头将其移至\
  \ `Selected Members` 区域。\n10. 点击 `Save`。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig14_HTML.jpg](img/437055_1_En_3_Fig14_HTML.jpg)\n\
  \n    图 3-14\n    选择需要访问此队列的用户、组、角色或角色层次。\n\n### 提示\n\n`Queues` 不仅可用于案例。您可以像设置案例那样，设置线索队列和线索分配规则。\n\
  \n## 创建案例分配规则\n\n现在您已经创建了第一个队列，接下来就可以自动将案例分配给该队列或特定所有者了。您可以根据案例中的特定条件以及与案例相关的记录来创建案例分配规则。例如，您可以创建一条分配规则，将针对特定客户或联系人的所有案例自动分配给特定用户。或者，您可以根据案例来源、案例原因、案例类型或案例记录中的任何其他字段，将案例分配到队列。有些公司会为\
  \ `VIP` 客户或白金客户创建队列，只允许最有经验的用户处理这些案例。图 `[3-15]` 到 `[3-20]` 展示了此过程。分步流程如下：\n\n1.\
  \  单击 `Salesforce` 窗口右上角的设置齿轮图标，导航到 `Setup` 菜单。\n2.  使用搜索区域，输入 `Case Assignment`。点击\
  \ `Service` 下的 `Case Assignment`。\n3.  点击 `New` 开始创建案例分配规则。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig15_HTML.jpg](img/437055_1_En_3_Fig15_HTML.jpg)\n\
  \n    图 3-15\n    访问案例分配规则\n\n4.  为规则命名并点击 `Save`。您可以立即通过勾选 `Active` 复选框来激活此规则，或者暂缓，稍后再激活。\n\
  5.  点击 `Save`。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig16_HTML.jpg](img/437055_1_En_3_Fig16_HTML.jpg)\n\
  \n    图 3-16\n    创建案例分配名称并激活它\n\n    保存规则名称后，页面将返回案例分配区域。点击您刚刚创建的规则名称。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig17_HTML.jpg](img/437055_1_En_3_Fig17_HTML.jpg)\n\
  \n    图 3-17\n    检索您的案例分配规则\n\n6.  点击 `New` 按钮。\n\n    **注意：** 在图 `[3-18]` 中，请注意\
  \ `Modified By` 上方的 `Active` 复选框。这就是您在完成规则后，通过勾选 `Active` 复选框来激活规则的位置。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig18_HTML.jpg](img/437055_1_En_3_Fig18_HTML.jpg)\n\
  \n    图 3-18\n    为案例分配创建规则条件\n\n7.  如果这是您首次创建案例规则分配，请在 `Sort Order` 字段中输入数字 `1`。如果您配置了多条规则，`Sort\
  \ Order` 字段将告知 `Salesforce` 优先运行哪些规则。一旦某条规则运行并分配了案例，系统将不再对该案例运行其他规则。请根据重要性为所有规则设置排序。\n\
  8.  在步骤 2 中，您需要创建规则条件。规则条件告知 `Salesforce`：如果此处输入的条件为真，则将案例分配到指定位置（步骤 9 和 10）。\n\n\
  \    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig19_HTML.jpg](img/437055_1_En_3_Fig19_HTML.jpg)\n\
  \n    图 3-19\n    为案例分配规则设置字段条件\n\n    a.  首先，您需要点击字段列中的 `None`。在此处，您将选择 `Salesforce`\
  \ 应评估该规则的字段。这可以是案例类型、案例原因、案例来源、客户、联系人信息，或案例、客户、联系人中的任何字段条件。\n    b.  选择合适的运算符。例如，如果您希望每个等于特定值的案例类型都自动分配给特定用户，则应选择运算符\
  \ `equals` 并选择那些值。\n    c.  选择或输入案例将自动分配到的适当值或结果。\n    d.  您也可以通过点击 `Add Filter\
  \ Logic` 配置筛选逻辑。这允许您将逻辑从“全部”字段条件（使用 `and`）更改为 `or`。例如，您可以说，如果案例类型是 `Problem` 或案例来源是\
  \ `Email`。标准设置会使该逻辑句子变为：“如果案例类型是 `Problem` 并且案例来源是 `Email`。”\n\n9.  选择将案例分配给特定用户或您在前一部分中设置的队列。\n\
  10. 选择您希望自动发送给用户或队列的电子邮件模板。\n11. 点击 `Save`，或者点击 `Save and New` 来设置另一条案例分配规则。\n\n\
  \    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig20_HTML.jpg](img/437055_1_En_3_Fig20_HTML.jpg)\n\
  \n    图 3-20\n    分配特定用户或队列并向他们发送通知\n\n### 注意\n\n步骤 4 提供的功能不是 `Lightning` 组件，需要在\
  \ `Classic` 中进行设置。\n\n\n\n### 创建案例自动回复规则\n\n案例自动回复规则允许你基于字段级更改，自动与客户进行沟通。例如，如果你希望在案例状态从一个值变为另一个值时向客户发送电子邮件，你可以实现此操作。任何字段值的变化都可以触发此邮件发送或其他自动化操作。图\
  \ 3-21 至 3-26 将引导你逐步创建案例自动回复规则。\n\n1.  点击 Salesforce 窗口右上角的设置齿轮图标，导航至 **设置** 菜单。\n\
  \n2.  使用搜索区域，输入 **Case Auto-Response**。点击 `服务` 下的 `Case Auto-Response Rules`。\n\n\
  3.  点击 `新建` 开始创建案例自动回复规则。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig21_HTML.jpg](img/437055_1_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21\n\n访问案例自动回复规则\n\n4.  为规则命名，然后点击 `保存`。你可以立即选中 `启用` 复选框来激活规则，或者暂不激活，稍后再进行操作。\n\
  \n5.  点击 `保存`。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig22_HTML.jpg](img/437055_1_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22\n\n为你的案例自动回复规则命名\n\n6.  保存规则名称后，页面将返回到案例分配区域。点击你刚刚创建的规则名称。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig23_HTML.jpg](img/437055_1_En_3_Fig23_HTML.jpg)\n\
  \n图 3-23\n\n检索你的案例自动回复规则\n\n7.  点击 `新建` 按钮。\n\n**注** 在图 3-24 中，请注意 `修改者` 字段上方的 `启用`\
  \ 复选框。在这里，你可以在完成规则创建后，通过 `启用` 复选框来激活该规则。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig24_HTML.jpg](img/437055_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24\n\n为案例自动回复规则创建新的规则条件\n\n8.  如果这是你的第一个案例自动回复规则，请在 `排序顺序` 字段中输入数字 `1`。\n\n\
  9.  在第二步中，你需要创建规则条件。规则条件告诉 Salesforce，如果在案例上满足你在此处输入的条件，则发送电子邮件（步骤 9 和 10）。\n\n\
  ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig25_HTML.jpg](img/437055_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25\n\n为你的案例自动回复规则创建条件\n\n1.  要开始此过程，你首先需要点击字段列中的 `无`。在此处，你将选择 Salesforce 应为规则评估的字段。这可以是案例类型、案例原因、案例来源、客户、联系人信息，或案例、客户、联系人中的任何字段条件。\n\
  \n2.  选择合适的运算符。例如，如果你希望每个等于特定值的案例类型都能自动发送邮件，你可以选择 \"等于\" 运算符并选择那些值。\n\n3.  选择或输入案例将自动发送邮件的适当值或结果。\n\
  \n4.  你也可以通过点击 `添加筛选逻辑` 来配置筛选逻辑。这允许你将逻辑从 \"满足所有\" 字段条件（使用 \"且\"）更改为 \"或\"。例如，你可以设置为如果案例类型为“问题”**或**案例来源为“电子邮件”。标准设置会使该逻辑语句变为\
  \ \"如果案例类型为问题**且**案例来源为电子邮件\"。\n\n10.  在第三步中，你需要提供邮件发件人的名称。\n\n11.  在 `电子邮件地址` 字段中输入发件人的电子邮件地址。\n\
  \n12.  提供一个回复地址，以便客户能够回复该邮件。\n\n**注** 你只能使用自己用户邮箱中的一个，或者设置为组织范围邮件的邮箱。\n\n13.  分配你希望为此自动回复规则发送的电子邮件模板。\n\
  \n14.  完成第 1 步到第 4 步后，点击 `保存`。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig26_HTML.jpg](img/437055_1_En_3_Fig26_HTML.jpg)\n\
  \n图 3-26\n\n设置邮件发件人信息及电子邮件模板\n\n\n\n#### 创建案例升级规则\n\n案例升级规则允许你创建自动化流程，用于决定案例何时会被升级以及升级后将执行哪些操作。与你上一节创建的其他规则类似，你可以根据案例的字段级条件来确定其升级时机。一旦满足字段级条件，你就可以设置相应操作，例如发送通知邮件、将案例重新分配给其他用户，以及通知该用户。图\
  \ 3-27 到 3-34 展示了设置过程。具体步骤包括：\n\n1.  点击 Salesforce 窗口右上角的设置齿轮图标，导航至设置菜单。\n\n2. \
  \ 在搜索区域输入 **升级规则（Escalation Rules）**。在“服务（Service）”部分下点击 `升级规则（Escalation Rules）`。\n\
  \n3.  点击 `新建（New）` 以创建升级规则。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig27_HTML.jpg](img/437055_1_En_3_Fig27_HTML.jpg)\n\
  \n图 3-27\n\n导航至案例升级规则\n\n4.  为规则命名并点击 `保存（Save）`。你可以通过选中`激活（Active）`复选框立即激活该规则，或者稍后再激活。\n\
  \n5.  点击 `保存（Save）`。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig28_HTML.jpg](img/437055_1_En_3_Fig28_HTML.jpg)\n\
  \n图 3-28\n\n为你的案例升级规则命名\n\n6.  保存规则名称后，页面将带你返回案例分配区域。点击你刚刚创建的规则名称。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig29_HTML.jpg](img/437055_1_En_3_Fig29_HTML.jpg)\n\
  \n图 3-29\n\n调取你的案例升级规则\n\n7.  点击 `新建（New）` 按钮。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig30_HTML.jpg](img/437055_1_En_3_Fig30_HTML.jpg)\n\
  \n图 3-30\n\n为你的案例升级规则创建条件\n\n**注意** 在图 3-30 中，请注意`激活（Active）`复选框；你将在使用`激活（Active）`复选框完成规则后在此处激活它。\n\
  \n8.  如果这是你的第一个案例升级规则，请在`排序顺序（Sort Order）`字段中输入数字 **1**。如果你配置了许多规则，`排序顺序（Sort Order）`字段会告知\
  \ Salesforce 哪个规则应该先运行。一旦某个规则运行并执行了操作，它将不会对同一个案例运行其他规则。请根据重要程度为你所有的规则指定排序。\n\n9.\
  \  在步骤 2 中，你创建规则条件。规则条件告知 Salesforce，如果你在此处输入的条件在案例上为真，那么它将发送邮件（步骤 9 和 10）。\n\n\
  ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig31_HTML.jpg](img/437055_1_En_3_Fig31_HTML.jpg)\n\
  \n图 3-31\n\n为案例升级规则创建规则条件\n\n    1.  要开始此过程，你首先需要点击字段列中的`无（None）`。在这里，你将选择 Salesforce\
  \ 应为该规则评估的字段。这可以是案例类型、案例原因、案例来源、客户、联系人信息，或者案例、客户或联系人的任何字段条件。\n    2.  选择合适的运算符。例如，如果你希望每个等于特定值的案例类型自动触发邮件，你可以选择“等于（equals）”运算符并选择那些值。\n\
  \    3.  选择或输入案例将自动发送邮件的相应值或结果。\n    4.  你也可以通过点击`添加过滤逻辑（Add Filter Logic）`来配置你的过滤逻辑。这允许你将逻辑从“所有”字段条件（使用“且（and）”）更改为“或（or）”。例如，你可以设置如果案例类型是“问题（Problem）”或案例来源是“邮件（Email）”。标准设置会使该逻辑语句变成“如果案例类型是‘问题（Problem）’且案例来源是‘邮件（Email）’。”\n\
  \n10.  在步骤 3 中，你可以选择为此升级设置一个工作时间。\n\n**注意** 要选择设置工作时间，你需要在 Salesforce 中已创建它。请在设置菜单中搜索\
  \ *business hours* 以获取更多信息。默认情况下，工作时间设置为每周 7 天，每天 24 小时。\n\n11.  在步骤 4 中，你选择如何确定升级时间。\n\
  \    1.  你可以选择在案例创建时评估，这只会在案例创建时评估一次条件。\n    2.  你可以选择在案例创建时评估，并在案例首次修改后禁用。此选项将在案例首次被修改后（通常是在用户开始处理它之后）检查你的案例条件。\n\
  \    3.  你可以选择案例的最后修改时间。这将在每次对案例进行更改时检查其条件。这将允许在案例被修改时应用升级规则。\n\n12.  点击 `保存（Save）`。\n\
  \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig32_HTML.jpg](img/437055_1_En_3_Fig32_HTML.jpg)\n\
  \n图 3-32\n\n选择工作时间以及案例升级规则应何时运行\n\n13.  点击 `新建（New）` 按钮以开始创建你的操作。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig33_HTML.jpg](img/437055_1_En_3_Fig33_HTML.jpg)\n\
  \n图 3-33\n\n创建你的升级规则操作\n\n14.  对于`时长超过（Age Over）`字段，你需要确定匹配条件的案例在升级前可以保持开启状态的小时数。你可以更改下拉菜单以显示单个分钟数，或调整为以\
  \ 30 分钟为增量。\n\n15.  在“选择以下一种或多种操作”下，你可以执行以下操作：\n    1.  选择将案例重新分配给另一个用户或队列。在“自动将案例重新分配给（Auto-reassign\
  \ cases to）”旁边的字段中，选择一个将发送给该用户或属于该队列的用户的邮件模板。\n    2.  选择谁将收到案例已升级的通知，并选择应通知该用户的通知模板。通常，这是管理层中的某个人。\n\
  \    3.  如果你不选择重新分配案例，此时可以通知案例的当前所有者其已升级。\n    4.  在`附加电子邮件（Additional Emails）`字段中，除之前的设置外，选择是否还有其他人员应收到案例升级的通知。\n\
  \n16.  完成操作后，点击 `保存（Save）` 按钮。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig34_HTML.jpg](img/437055_1_En_3_Fig34_HTML.jpg)\n\
  \n图 3-34\n\n在你的案例升级规则上设置操作\n\n### 提示\n\n你可以创建一个包含多项操作的升级规则，例如，如果你希望某个特定案例在满足规则条件两小时后被升级。然后，如果四小时后该案例仍未关闭，并且你想再次升级它，你可以进行相应设置。你所需做的只是再创建一个操作。\n\
  \n\n\n#### 设置电子邮件转案例\n\n`电子邮件转案例`是一项功能，可让您根据发送到特定电子邮件地址的邮件自动创建案例。例如，如果您有一个负责管理产品技术问题的支持小组，您可以公布一个邮箱地址，让客户提交请求，这些请求将自动路由到\
  \ Salesforce 并为您创建案例。图 3-35 至 3-42 将引导您完成此设置过程。\n\n1.  通过点击 Salesforce 窗口右上角的设置齿轮图标，导航至设置菜单。\n\
  2.  使用搜索区域，输入 **电子邮件**。在服务下点击`电子邮件转案例`。\n3.  点击`编辑`按钮。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig35_HTML.jpg](img/437055_1_En_3_Fig35_HTML.jpg)\n\
  \n图 3-35：导航至电子邮件转案例设置\n\n4.  选中`启用电子邮件转案例`和`启用 HTML 电子邮件`复选框。\n5.  点击`保存`按钮。\n\n\
  ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig36_HTML.jpg](img/437055_1_En_3_Fig36_HTML.jpg)\n\
  \n图 3-36：启用电子邮件转案例功能\n\n6.  点击`新建`按钮。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig37_HTML.jpg](img/437055_1_En_3_Fig37_HTML.jpg)\n\
  \n图 3-37：为电子邮件转案例设置创建新的路由地址\n\n7.  输入电子邮件的路由名称。通常，这是电子邮件的名称。\n8.  输入实际的路由电子邮件地址。\n\
  9.  您可以选择保存电子邮件的标头，并设置接受来自哪些发件人的邮件。但是，这些通常包含图片，会占用您组织 15KB 的存储空间。大多数用户不会启用此选项。\n\
  10. 在任务设置下，您可以在案例创建时同时创建一个任务。\n11. 在案例设置下，设置案例的优先级和案例来源。\n12. 点击`保存`或点击`保存并新建`以设置更多电子邮件路由地址。\n\
  \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig38_HTML.jpg](img/437055_1_En_3_Fig38_HTML.jpg)\n\
  \n图 3-38：为电子邮件转案例功能设置路由地址\n\n13. 系统会自动向您在步骤 8 中输入的路由地址发送一封电子邮件。如果您在几小时内没有收到邮件，请检查您的垃圾邮件文件夹或公司可能设置的防火墙，或者点击图\
  \ 3-39 中显示的`重新发送`链接。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig39_HTML.jpg](img/437055_1_En_3_Fig39_HTML.jpg)\n\
  \n图 3-39：如果您没有收到验证邮件，可以使用此`重新发送`链接重新发送邮件\n\n14. 您收到的邮件应类似于图 3-40 中的示例。您需要点击邮件中的链接来验证这是一个有效的电子邮件地址。点击链接后，您将进入另一个\
  \ Salesforce 屏幕；点击`继续`按钮，如图 3-41 所示。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig41_HTML.jpg](img/437055_1_En_3_Fig41_HTML.jpg)\n\
  \n图 3-41：点击`继续`，您将进入 Salesforce 登录页面\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig40_HTML.jpg](img/437055_1_En_3_Fig40_HTML.jpg)\n\
  \n图 3-40：已发送电子邮件验证\n\n15. 最后，您需要在您的电子邮件收件箱中应用一些电子邮件转发规则，将电子邮件转发到 Salesforce 提供的电子邮件服务地址。\n\
  \n创建电子邮件转发规则是利用 Salesforce 支持的按需电子邮件转案例功能的关键。通过将所有电子邮件转发到 Salesforce 提供的电子邮件服务地址，您可以为用户提供与\
  \ Salesforce 的一站式应用体验。当电子邮件发送到 Salesforce 时，客户会收到一封回复，该回复的邮件正文和主题行中包含唯一的案例线索。此案例线索允许回复到同一邮箱的电子邮件根据您的转发规则被发送到\
  \ Salesforce，并关联到现有案例。这使得您的用户在处理支持案例查询时可以停留在 Salesforce 中。图 3-42 展示了一个案例线索。\n\n\
  ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig42_HTML.jpg](img/437055_1_En_3_Fig42_HTML.jpg)\n\
  \n图 3-42：此案例线索允许您的客户邮件关联到相应的案例。\n\n### 注意\n\n`电子邮件转案例`功能有一些限制。首先，您只能接收大小不超过 10MB\
  \ 的附件。其次，此选项每天仅允许处理多达 5,000 封电子邮件。有关解决方法，请参阅设置区域，让 Salesforce 处理退回邮件。最后，如果邮件中不包含案例线索，则会创建一个新案例。\n\
  \n### 提示\n\n如果您的案例查询通常超过 25MB，您可能需要使用`电子邮件转案例`选项。此外，`电子邮件转案例`设置会自动识别联系人和回复并关联到案例。按需功能提供了更自定义的解决方案。它允许进行自定义字段映射，并且其设置相当简单。\n\
  \n\n\n### 设置 Web 到案例\n\nSalesforce 中的 Web 到案例功能允许您将 HTML 代码嵌入到现有的网站或网页表单中。使用过此功能的大多数客户会将\
  \ HTML 代码嵌入到其网站支持相关页面上的“联系我们”表单中。此功能与电子邮件到案例功能类似，允许自动生成的案例进入 Salesforce。请按照图 3-43\
  \ 至图 3-48 所示的步骤操作。\n\n1.  点击 Salesforce 窗口右上角的设置齿轮图标，导航至设置菜单。\n2.  在搜索区域输入 **Web-to-case**。在“服务”下点击“Web\
  \ 到案例”。\n3.  应勾选“启用 Web 到案例”复选框，如图 3-43 所示。\n4.  将默认的“案例来源”选项设置为“Web”或任何其他描述此案例来源的选项。\n\
  5.  附加一个响应模板，希望客户在提交案例后收到。\n6.  “隐藏记录信息”将隐藏所发送电子邮件中的记录信息。\n\n    **注意** 如果要为此创建电子邮件模板，请转到“设置”，搜索\
  \ `Email Template`，然后在“电子邮件”部分下找到 `Email Template`。\n\n7.  添加电子邮件签名（如果您选择在电子邮件模板中创建）。\n\
  8.  点击“保存”。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig43_HTML.jpg](img/437055_1_En_3_Fig43_HTML.jpg)\n\
  \n    图 3-43\n\n    创建 Web 到案例功能\n\n现在您已启用该功能，就可以生成要嵌入到网站的 HTML 代码。图 3-44 至 3-45\
  \ 向您展示如何操作。\n\n1.  在“设置”菜单的左侧，您应该会看到“Web 到案例 HTML 生成器…”。如果没有，您可以搜索 `web-to-case\
  \ HTML`。点击该短语。\n2.  在“可用字段”区域中，选择要包含在网页表单中的字段。\n3.  将字段从“可用字段”移动到“已选字段”。\n4.  在“URL”字段中，输入希望客户在提交网页表单后返回的\
  \ URL。\n5.  “启用垃圾邮件过滤”选项需要创建 Captcha API 密钥（这需要开发人员操作，本书不做解释）。要进行设置，您需要导航到 Salesforce\
  \ Classic。\n6.  点击“生成”按钮。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig44_HTML.jpg](img/437055_1_En_3_Fig44_HTML.jpg)\n\
  \n    图 3-44\n\n    设置 Web 到案例 HTML 生成器\n\n7.  复制此 HTML 代码并将其发送给您的网站管理员。\n8.  完成后点击“完成”。\n\
  \n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig45_HTML.jpg](img/437055_1_En_3_Fig45_HTML.jpg)\n\
  \n    图 3-45\n\n    生成的 HTML\n\n## 总结\n\n借助 Salesforce Service Cloud，您可以根据组织的需求定制体验，或利用购买时附带的标准强大功能。无论选择哪条道路，您都可以确信，设置是最不需要您担心的问题。\n\
  \n"
- "# 4. Lightning 应用程序\n\nAppExchange 市场包含一系列应用程序、Lightning 组件和咨询资源。Salesforce 客户可以为其\
  \ Salesforce 组织安装附加应用程序。您可以在数千个应用中搜索，为业务需求寻找预建的解决方案。该市场也是搜索数千名注册 Salesforce 顾问的地方（如图\
  \ 4-1 所示）。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig1_HTML.jpg](img/437055_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n使用 AppExchange 开辟新道路\n\n## 应用程序\n\n通过安装名为*应用程序*的预建包来提高生产力，这些包为每个角色和行业提供定制解决方案。请访问\
  \ AppExchange 网站 [`appexchange.salesforce.com`](http://appexchange.salesforce.com)。您可以在此处通过多种方式进行排序和筛选，包括按热门度和评分。\n\
  \n要选择正确的应用程序，我们建议您明确自己的业务挑战、预算和时间框架。\n\n### 发现 AppExchange 市场\n\n您应该花时间探索 Salesforce\
  \ 中的商业应用商店，也称为 AppExchange 市场。这里有超过 3,000 个应用和组件可用于扩展 Salesforce 的功能。请按以下步骤操作：\n\
  \n1.  从应用程序启动器中，点击“访问 AppExchange”，如图 4-2 所示。或者，从“设置”中，在“快速查找”区域搜索 `AppExchange\
  \ marketplace`。\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig2_HTML.jpg](img/437055_1_En_4_Fig2_HTML.jpg)\n\
  \n    图 4-2\n\n    从应用程序启动器访问 AppExchange\n\n2.  点击“AppExchange 网站”，如图 4-3 所示。\n\
  \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig3_HTML.jpg](img/437055_1_En_4_Fig3_HTML.jpg)\n\
  \n    图 4-3\n\n    点击“AppExchange 网站”以导航到完整的应用程序和组件数据库\n\n该市场包含供最终用户安装并下载到其 Salesforce\
  \ 组织中的应用程序和组件。此外，您还可以访问关于这些应用程序、组件和顾问的数千条评论。透明度触手可及。\n\n在您的主页上（如图 4-4 所示），可以根据各种类别搜索和筛选应用程序。您会发现各种各样的应用程序！它们范围从点式解决方案到全面的集成和自动化。既有免费的应用，也有付费的应用。好消息是，Salesforce\
  \ 让您轻松找到所需内容。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig4_HTML.jpg](img/437055_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\nAppExchange 主页\n\n#### 选择应用程序\n\n面对众多可用的解决方案，选择正确的应用程序可能让人不知所措。因此，在此决策过程中有一个策略至关重要。\n\
  \n1.  首先，明确您的业务挑战。确定公司的目标和宗旨。一旦确定了这些，就在 Salesforce 市场中搜索并查看一些解决方案选项。\n2.  一旦缩小范围锁定了一些潜在的解决方案，就评估这些解决方案和供应商。考虑易用性、支持选项、总成本、评价、管理便利性以及解决方案匹配度。利用这些信息来帮助做出决定。\n\
  3.  如果可行，请求演示或试用，或者将应用程序安装到您的沙盒环境中进行用户测试和验收。\n\n### 价格\n\n一个重要的因素是成本。Salesforce\
  \ 中有免费的应用，但也有其他需要付费的应用。有些应用会显示总成本，而另一些则需要您联系他们以了解价格。其中一些付款方式可以是按月、按年、按用户或按组织付费。\n\
  \n### 兼容性\n\n务必检查解决方案的兼容性。您可以在应用的“详细信息”部分的“要求”和“其他系统要求”下找到兼容性信息（如图 4-5 所示）。\n\n\
  ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig5_HTML.jpg](img/437055_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n应用详细信息中的“要求”和“其他系统要求”部分\n\n\n\n### 应用首页\n\n应用的首页提供概览、详细信息、评论以及提供商信息（如图\
  \ 4-6 所示）。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig6_HTML.jpg](img/437055_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n应用首页\n\n该页面还包含以下信息：\n\n-   **亮点**：位于应用页面顶部的亮点栏（如图 4-7 所示）展示了应用的关键组件。通常包括\
  \ Lightning 就绪性、组织兼容性和限制。\n\n  ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig7_HTML.jpg](img/437055_1_En_4_Fig7_HTML.jpg)\n\
  \n  图 4-7\n  亮点栏\n\n-   **费用**：费用位于首页左侧。如果应用是免费的，则会显示“免费”。如果应用需要收费，则会显示“付费”。\n\n\
  -   **概览**：点击“概览”选项卡（如图 4-8 所示）可查看应用的简要说明。某些应用会在此处提供其网站的链接或包含视频演示。建议您观看任何视频，以进一步了解应用的功能。您还可以在此区域找到详细的定价信息、发布日期和屏幕截图。\n\
  \n  ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig8_HTML.jpg](img/437055_1_En_4_Fig8_HTML.jpg)\n\
  \n  图 4-8\n  应用的“概览”选项卡\n\n-   **详细信息**：点击“详细信息”选项卡（如图 4-9 所示）可获取更多有见地的细节。通常包括任何技术细节、软件要求、支持的功能列表、数据表和安全相关信息。\n\
  \n要直接联系应用提供商，请查阅页面右上角显示的联系信息。\n\n### 提示\n\n对于需要大量设置的应用，请考虑每个应用可用的支持选项。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig9_HTML.jpg](img/437055_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n“详细信息”选项卡\n\n“详细信息”选项卡底部包含应用公司提供的文档，包括数据表、自定义指南、案例研究和客户评价，如图 4-10 所示。\n\
  \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig10_HTML.jpg](img/437055_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n存储的有关应用的重要信息，包括数据表、指南、案例研究和评价\n\n### 评论\n\n每个应用都使用五星评分方法进行评级，并包含客户书面评论。这些评论也分为正面评论和关键评论。利用此信息帮助判断应用的成功程度。导航至“评论”选项卡的评论部分，阅读客户反馈（如图\
  \ 4-11 所示）。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig11_HTML.jpg](img/437055_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n“评论”选项卡包含正面和关键评论\n\n要撰写评论，用户必须经过身份验证。要撰写评论，请点击“评论亮点”部分中的“撰写评论”，如图 4-12\
  \ 所示。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig12_HTML.jpg](img/437055_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n点击此按钮撰写评论\n\n接下来，为您的评论添加标题。在“评论”部分（如图 4-13 所示）提供评论内容。滚动鼠标悬停在星星上以选择适当的评分。完成后点击“发布评论”。请注意，您的评论可能需要长达一小时才能发布。\n\
  \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig13_HTML.jpg](img/437055_1_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n应用评论中需包含的信息\n\n### 注意\n\n请返回此页面为您已安装的应用撰写正面或关键评论。这将为 Salesforce 社区带来更多价值。\n\
  \n### 提供商\n\n此选项卡包含关于应用提供商的更多详细信息。了解提供商创建的可能与您的业务需求相关的其他应用。其他详细信息包括总部所在地、网站、员工数量和成立年份，如图\
  \ 4-14 所示。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig14_HTML.jpg](img/437055_1_En_4_Fig14_HTML.jpg)\n\
  \n图 4-14\n“提供商”选项卡\n\n## 安装应用\n\n应用可以直接安装到您的生产环境或沙盒环境中。生产环境是您的活跃用户使用 Salesforce\
  \ 处理实时数据的地方。沙盒是您的测试环境。这些可以是用于测试应用程序的生产或开发环境。建议您先在此处安装，以查看它如何与您现有的设置交互。\n\n应用也可以为特定用户组或所有用户安装。\n\
  \n要安装应用，请遵循以下步骤：\n\n1.  做一些研究并选择要安装的应用。\n\n2.  点击“立即获取”按钮，如图 4-15 所示。\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig15_HTML.jpg](img/437055_1_En_4_Fig15_HTML.jpg)\n\
  \n    图 4-15\n    首页上的“立即获取”按钮\n\n3.  使用您的 Salesforce 凭据登录。\n\n4.  选择合适的安装方法，如图\
  \ 4-16 所示。\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig16_HTML.jpg](img/437055_1_En_4_Fig16_HTML.jpg)\n\
  \n    图 4-16\n    选择安装到生产环境还是沙盒\n\n    -   点击“安装到生产环境”以安装到实时生产环境。\n    -   点击“安装到沙盒”以安装到沙盒测试环境。\n\
  \n5.  查看将要安装的应用的包组件、版本、过期时间和订阅成本。查看条款和条件。\n\n6.  选择“我已阅读并同意条款和条件”，如图 4-17 所示。点击“确认并安装”。\n\
  \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig17_HTML.jpg](img/437055_1_En_4_Fig17_HTML.jpg)\n\
  \n    图 4-17\n    安装前的最后一步\n\n7.  确定有权访问此应用的用户。从以下列表中选择适当的选项：仅安装给管理员、所有用户或特定简档。\n\
  \n    **注意**：安装后，您可以向其他用户开放此应用的访问权限。\n\n8.  点击“安装”，如图 4-18 所示。\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig18_HTML.jpg](img/437055_1_En_4_Fig18_HTML.jpg)\n\
  \n    图 4-18\n    选择要安装给哪些用户\n\n9.  点击“完成”，应用完成安装后，您将被重定向到“已安装的包”部分（见图 4-19）。\n\n\
  \    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig19_HTML.jpg](img/437055_1_En_4_Fig19_HTML.jpg)\n\
  \n    图 4-19\n    已安装和未安装包的详细信息\n\n\n\n### 已安装的软件包\n\n已安装的应用会创建一个包含组件和依赖项的软件包。这包括自定义对象、Visualforce\
  \ 页面以及 Apex 类和代码。已安装的应用可以以受管软件包或非受管软件包的形式提供。\n\n-   *受管软件包*对所安装的组件有限制。\n-   *非受管软件包*则更加灵活，允许在已安装的任何组件之上进行开发。\n\
  \n要卸载应用，请导航至“设置”中的“已安装的软件包”区域，然后单击“卸载”。\n\n要查找任何已安装应用的详细信息，包括所有组件和依赖项，请单击软件包名称，如图\
  \ 4-20 所示。随后将显示详细信息，如图 4-21 所示。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig21_HTML.jpg](img/437055_1_En_4_Fig21_HTML.jpg)\n\
  \n图 4-21 — 软件包详情\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig20_HTML.jpg](img/437055_1_En_4_Fig20_HTML.jpg)\n\
  \n图 4-20 — 软件包名称\n\n单击“查看组件”可获取所有已安装内容的完整分类（按类型），如图 4-22 所示。\n\n-   *Visualforce\
  \ 页面*：Visualforce 页面是由 Apex 类和代码构成的自定义页面，用于创建自定义的外观和体验。\n-   *Apex 类*：Apex 类是 Salesforce\
  \ 独有编程语言的一部分，它为开发者和应用构建者提供了创建业务逻辑的能力。\n-   *自定义对象*：用于存储或构建自定义信息。自定义对象可用于将信息链接到标准对象。\n\
  \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig22_HTML.jpg](img/437055_1_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22 — 查看您的软件包组件\n\n## Lightning 组件\n\nLightning 组件是可重复使用的预构建工具和元素容器。您可以将这些组件添加到页面中，以提高最终用户的生产力。如本书前面所述，组件可以轻松拖放到您想要的页面中。Salesforce\
  \ 使得无需开发者和编写代码即可轻松完成此操作。通过在市场中搜索来发现这些工具，如图 4-23 所示。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig23_HTML.jpg](img/437055_1_En_4_Fig23_HTML.jpg)\n\
  \n图 4-23 — Lightning 组件搜索页面\n\n要下载组件，请遵循与应用相同的下载步骤。\n\n## 寻找顾问\n\n顾问是已注册且通常经过认证的\
  \ Salesforce 合作伙伴。他们通过提供自定义的 Salesforce 解决方案和实施来帮助构建 Salesforce 生态系统。顾问通常提供 Salesforce\
  \ 培训、实施解决方案、快速入门包、数据迁移等服务。\n\n您的 Salesforce 客户经理通常会推荐一个 Salesforce 咨询合作伙伴。之后通常会与顾问进行一次发现或范围界定电话会议，并提供包含时间表、可交付成果和成本的报价。\n\
  \n类似于浏览应用，您可以浏览顾问列表，并按服务类型、专长、等级、区域等进行排序。\n\n1.  从页面顶部选择“顾问”选项卡，如图 4-24 所示。\n\n\
  \   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig24_HTML.jpg](img/437055_1_En_4_Fig24_HTML.jpg)\n\
  \n   图 4-24 — 顾问选项卡\n\n2.  选择一个咨询页面（图 4-25）以查看更详细的信息（图 4-26）。\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig26_HTML.jpg](img/437055_1_En_4_Fig26_HTML.jpg)\n\
  \n   图 4-26 — Cloud Creations 顾问详情页面\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig25_HTML.jpg](img/437055_1_En_4_Fig25_HTML.jpg)\n\
  \n   图 4-25 — Cloud Creations 咨询公司\n\n3.  在此页面上查找有关这位潜在顾问的更多详细信息，包括已完成的项目数量、满意度评级、地理重点等（如图\
  \ 4-27 所示）。您还可以在此页面找到顾问的联系信息，以便联系他们获取服务。\n\n4.  联系顾问并请求报价。\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig27_HTML.jpg](img/437055_1_En_4_Fig27_HTML.jpg)\n\
  \n   图 4-27 — 顾问详细信息部分\n\n### 提示\n\n顾问通常会雇佣项目经理、业务分析师、开发人员和专家。按时计费差异很大，通常包括一次范围界定电话会议，以确定为您的企业提供合适的解决方案。您向潜在顾问提供的信息越详细，成本估算就越准确。\n\
  \n## 总结\n\nAppExchange 市场由 Salesforce 生态系统中的应用合作伙伴和顾问组成。这是一个不断增长的市场，预计在不久的将来会发生重大变化。访问\
  \ AppExchange 市场，充分利用您的 Salesforce 设置。\n\n"
- "# 5. Lightning 报表和仪表板\n\nSalesforce 报表和仪表板为您提供了对在 Salesforce 中收集的数据的必要洞察。任何 Salesforce\
  \ 对象中的每个自定义字段和大多数标准字段都可以在 Salesforce 报表中使用。Salesforce 仪表板帮助您以 11 种不同的可视化图表和表格形式显示这些数据。一个报表可以用于多个仪表板组件；但是，一个仪表板组件只能使用一个报表。一个仪表板最多可以显示\
  \ 20 个仪表板组件。图 5-1 显示了在 Lightning 中用户主页面上标配的报表。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig1_HTML.jpg](img/437055_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1 — Salesforce 中按季度划分商机绩效的主屏幕\n\n## 了解报表与报表功能\n\n报表允许您根据自己定义的特定条件查看数据。一旦定义了条件，您就可以对数据进行分组、创建图表以便于查看、进一步筛选数据，并将报表存储到报表文件夹中以备将来使用。在接下来的几个部分中，我们将介绍报表构建器中一些必须了解的功能，然后我们将开始构建您的报表。\n\
  \n### 报表类型\n\n报表类型允许您定义在创建报表时可用的对象和字段。您可以根据对象与相关对象的关系来创建报表类型。这类关系的一个典型例子是客户及其相关的商机。您的商机将是主对象，而客户则是相关对象。别担心，您无需创建报表类型即可开始使用\
  \ Salesforce 报表，因为 Salesforce 开箱即用已为您设置了标准对象。但是，如果您发现报表中缺少某个字段，或者找不到与另一个对象关联的自定义对象，请继续阅读。或者，如果标准报表类型不适合您的业务，您可以自定义自己的报表类型！\n\
  \n\n\n### 创建报表类型\n\n创建报表类型的步骤如下：\n\n1.  点击浏览器右上角的设置齿轮图标，如图 5-2 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig2_HTML.jpg](img/437055_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2：导航至“设置”菜单\n\n2.  在快速查找框中，搜索 `report types`（不要按回车键），并选择黄色高亮的短语 `Report Types`，如图\
  \ 5-3 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig3_HTML.jpg](img/437055_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3：访问报表类型\n\n**提示** Salesforce 对其大部分管理流程都提供了帮助。如果您看到的是“什么是自定义报表类型？”，也可以阅读此内容，然后点击“继续”。您也可以点击“不再显示此页面”来禁用该窗口，如图\
  \ 5-4 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig4_HTML.jpg](img/437055_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4：自定义报表类型帮助页面\n\n3.  点击 `New Custom Report Type`，如图 5-5 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig5_HTML.jpg](img/437055_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5：创建新的自定义报表类型\n\n4.  从下拉字段中选择报表应包含的主对象，如图 5-6 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig6_HTML.jpg](img/437055_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6：创建客户报表类型\n\n5.  为您的报表类型命名。当用户在报表生成器中选择报表类型时，该标签将显示给他们。完成命名后，按 Tab 键，Salesforce\
  \ 将自动创建报表类型名称。\n\n6.  为报表类型输入描述。此描述将对使用该报表类型的用户可见。\n\n7.  选择此报表类型应存储的类别。例如，如果创建的报表类型是机会和联系人报表，则应将其放入\
  \ `Opportunity` 文件夹。如果报表类型是多个对象的组合，您可以选择将其存储在其中一个对象的文件夹中。\n\n8.  选择此报表类型应处于的状态。选择\
  \ `In Development` 单选按钮将向除管理员或拥有委派权限的用户之外的所有用户隐藏此报表类型。选择 `Deployed` 状态将使所有有权访问报表生成器的用户都能看到此报表类型。当您完成并测试了报表类型后，随时可以返回并选择\
  \ `Deployed` 选项。\n\n9.  点击 `Next`。\n\n10.  选择“点击关联另一个对象”，如图 5-7 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig7_HTML.jpg](img/437055_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7：为您的自定义报表类型关联另一个对象\n\n11.  点击 `Select Object` 下拉菜单，为此报表类型选择您的相关对象，如图 5-8\
  \ 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig8_HTML.jpg](img/437055_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8：为您的客户报表类型关联另一个对象\n\n**注意** 如果您没有看到要关联到此对象的对象，这意味着这些对象之间没有连接。要创建连接，您需要在相关对象上创建一个指向主对象的查找字段。在数据填充此报表之前，您记录中的该字段必须填写一个主对象记录。构建自定义对象和字段比您想象的要简单。本书不涉及如何执行此操作，但\
  \ Salesforce 提供了关于此主题的优秀“trailheads”。请访问 [`https://trailhead.salesforce.com`](https://trailhead.salesforce.com)\
  \ 查找您的 trailhead 并进一步学习。\n\n12.  在图 5-9 中，您将在 A 到 B 关系下看到两个选项。选项“每个 'A' 记录必须至少有一个相关的\
  \ 'B' 记录”将仅显示至少有一个 A 与之相关的 B 记录。例如，将显示所有与帐户相关的联系人，但如果您有一个与任何帐户都没有关联的联系人，则不会显示。选项“'A'\
  \ 记录可能有关联的 'B' 记录，也可能没有”将显示所有 B 记录，无论它们是否与您的 A 记录相关。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig9_HTML.jpg](img/437055_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9：为此报表类型选择两个对象之间的关系类型。\n\n13.  点击“点击关联另一个对象”以选择您的下一个对象。\n\n14.  点击 `Select\
  \ Object` 下拉菜单，为此报表类型选择您的下一个相关对象。\n\n15.  在 A 到 B 关系下选择两个单选按钮之一。\n\n16.  如有必要，重复步骤\
  \ 13 到 15 以关联更多对象到此报表。\n\n17.  点击 `Save`，如图 5-10 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig10_HTML.jpg](img/437055_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10：为您的自定义报表类型关联另一个对象\n\n### 注意\n\n如果在创建自定义报表类型后向对象添加了新字段，则必须将这些新字段添加到报表类型中。您可以通过转到“设置”，点击您的报表类型名称，然后在“报表可用字段”下点击\
  \ `Edit Layout` 来完成此操作。如图 5-11 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig11_HTML.jpg](img/437055_1_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11：向现有客户报表类型添加新的自定义字段\n\n### 报表格式\n\nLightning Experience 中的 Salesforce 提供三种报表格式。每种格式允许您以不同方式自定义报表。无论您是使用\
  \ `Tabular` 格式生成呼叫列表，使用 `Summary` 格式按水平分组显示数据，还是使用 `Matrix` 格式按行和列总结数据，Salesforce\
  \ 都有适合您的格式。您还可以使用一个额外的报表格式 `Joined reports`；但是，您需要切换到 Salesforce Classic 才能构建和查看这些类型的报表。每种报表格式都有其优势；让我们进一步探讨。图\
  \ 5-12 显示了您可以在何处对不同报表格式进行调整。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig12_HTML.jpg](img/437055_1_En_5_Fig12_HTML.jpg)\n\
  \n图 5-12：切换报表格式\n\n\n\n#### 表格报表格式\n\n表格格式报表易于与电子表格之类的平面文件进行比较。这种报表格式包含列作为不同的数据点，以及包含实际记录的行。这些报表最适用于创建记录列表，例如通话清单或列出带有总计的记录。这种报表格式无法进行分组，并且除非使用行限制过滤器（见图\
  \ 5-33），否则您无法在图表中显示信息或在仪表板组件中使用它。大多数客户会使用表格报表格式，通过设定的特定条件查看销售总额。例如，如果您想快速生成一份关于团队在一个季度内所产生销售额的报告，可以使用表格报表。图\
  \ 5-13 展示了一个通话清单表格报表的示例。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig13_HTML.jpg](img/437055_1_En_5_Fig13_HTML.jpg)\n\
  \n**图 5-13**\n\n表格报表示例\n\n#### 摘要报表格式\n\n摘要报表格式是 Salesforce 中使用最广泛的报表格式。这种报表格式允许您对数据进行最多三个层级的分组和汇总。在这些分组内，您可以对列进行汇总，获取该特定分组的小计，并在报表末尾获得总计。您可以在此报表中使用公式来进一步定义报表。通过按商机所有者分组，您可以使用这种报表格式来展示销售人员之间的业绩对比。您也可以使用此报表，通过按记录的所有者分组，来确定公司中谁拥有的记录数量最多。或者，您可以构建一个报表，按职务对不同类型的联系人进行分组。这种格式也可以在仪表板和图表中使用和呈现。当您不对报表进行分组时，它将以表格格式显示。图\
  \ 5-14 展示了一份客户用来查看新增业务与现有客户业务量对比的报表。您还可以看到它已按用户分组，以显示每位用户与其他用户的业绩对比情况。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig14_HTML.jpg](img/437055_1_En_5_Fig14_HTML.jpg)\n\
  \n**图 5-14**\n\n摘要报表示例\n\n#### 矩阵报表格式\n\n矩阵报表格式允许您同时按列和行对数据进行分组。这有助于对数据进行交叉分析。与摘要报表格式一样，在矩阵格式中创建的分组里，您可以查看小计、记录计数和总计，也可以按行或列查看，如图\
  \ 5-15 所示。使用这种报表类型，通过按日期分组列、按商机产品分组行，可以展示产品在特定日期范围内的表现情况。或者使用此报表来确定您的用户在某一时间段内的表现。使用此报表来比较您收到的案例来源与案例原因。这种报表类型也可以在仪表板组件和图表中使用。此外，您还可以使用公式进一步计算数据。如果您的分组或条件没有显示任何结果，此格式的报表将降级为摘要格式。\n\
  \n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig15_HTML.jpg](img/437055_1_En_5_Fig15_HTML.jpg)\n\
  \n**图 5-15**\n\n矩阵报表示例\n\n## 报表过滤器\n\n在报表生成器中，有必要了解 Salesforce 提供的报表过滤器的使用方法。您最多可以使用五种过滤器功能来进一步自定义报表。过滤器允许您更细致地查看数据，使其更符合您的报告需求。\n\
  \n### 标准过滤器\n\nSalesforce 报表生成器中的标准过滤器会因某些对象而异。由于您在客户和联系人之间收集的数据与商机或案例不同，您会看到这些标准报表过滤器会根据报表类型而变化。让我们看看每种报表类型及其标准过滤器。\n\
  \n#### 客户、联系人和线索\n\n客户、联系人和线索都共享相似的标准报表过滤器。就像在 Salesforce 中学习的大多数东西一样，如果您了解一个对象的组成部分，这些知识有时可以迁移到其他对象上。对于客户、联系人和线索，您会发现它们具有相似的属性。\n\
  \n*   *所有客户*：此报表过滤器允许您选择是查看所有客户（无论所有者是谁）、仅您拥有的联系人、仅您拥有的客户，还是您团队的客户，如图 5-16 所示。如果您通过角色层级或共享规则设置了安全策略，您的用户将只能看到他们被授权查看的客户、联系人和线索。\n\
  \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig16_HTML.jpg](img/437055_1_En_5_Fig16_HTML.jpg)\n\
  \n    **图 5-16**\n\n    按记录所有权过滤客户\n\n*   *所有线索*：此线索报表过滤器类似；您可以选择查看您拥有的线索、您团队的线索、用户拥有的线索（相对于队列拥有的线索）、队列拥有的线索以及所有线索，如图\
  \ 5-17 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig17_HTML.jpg](img/437055_1_En_5_Fig17_HTML.jpg)\n\
  \n    **图 5-17**\n\n    按记录所有权过滤线索\n\n*   对于客户、联系人和线索，您可以从该报表类型中的任何日期字段中进行选择来过滤，也可以使用\
  \ Salesforce 智能日期。智能日期允许您选择每当运行报表时都会更新为相对时间的日期。例如，您可以从下拉菜单中选择“本周”或“当前日历年”，或在“从”和“至”字段中使用您自己的自定义日期范围，如图\
  \ 5-18 所示。\n\n    **注意** 如果这些智能日期不适用于您的报表，请参阅“字段过滤器”以获取更多思路。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig18_HTML.jpg](img/437055_1_En_5_Fig18_HTML.jpg)\n\
  \n    **图 5-18**\n\n    智能日期过滤器\n\n\n\n#### 商机标准筛选字段\n\n商机的标准筛选字段是其报表类型所特有的，下面我们来了解一下。\n\
  \n- 与客户、联系人和线索类似，商机也有一个标准报表筛选器，允许您选择所有商机（无论归属何人）、您团队的商机以及您个人的商机，如图 5-19 所示。如果您通过角色层级或共享规则设置了安全策略，那么您的用户将只能看到他们有权查看的商机。\n\
  \n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig19_HTML.jpg](img/437055_1_En_5_Fig19_HTML.jpg)\n\
  \n  图 5-19 — 商机归属筛选器\n\n- `商机状态`筛选器允许您查看任何商机，无论其处于已关闭、进行中还是已赢得状态，以及所有状态的商机，如图 5-20\
  \ 所示。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig20_HTML.jpg](img/437055_1_En_5_Fig20_HTML.jpg)\n\
  \n  图 5-20 — 商机状态筛选器\n\n- `商机可能性`允许您根据`可能性`字段（与该阶段关联）进行筛选。您可以选择大于 90% 等选项，以便更清楚地了解您销售管道中最可能成交的商机，如图\
  \ 5-21 所示。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig21_HTML.jpg](img/437055_1_En_5_Fig21_HTML.jpg)\n\
  \n  图 5-21 — 商机可能性筛选器\n\n- `商机日期字段`筛选器的工作原理与客户、联系人和线索的筛选器相同。您可以从该报表类型中选择任何日期字段进行筛选，还可以使用\
  \ Salesforce 智能日期。智能日期允许您选择每次运行报表时会更新为相对时间的日期。例如，您可以从下拉菜单中选择`本周`或`当前日历年`，或者在`从`和`到`字段中使用您自己的自定义日期范围，如图\
  \ 5-22 所示。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig22_HTML.jpg](img/437055_1_En_5_Fig22_HTML.jpg)\n\
  \n  图 5-22 — 商机智能日期筛选器\n\n#### 个案筛选器\n\n个案筛选器与其他对象的标准筛选器有一些相似之处，也有一些是该报表类型独有的。\n\
  \n- 个案的`显示`筛选器允许您查看所有个案、所有个案（无论归属何人）、用户拥有的个案（相对于队列拥有的个案）、队列拥有的个案、您个案团队的个案或基于角色的团队的个案，如图\
  \ 5-23 所示。如果您通过角色层级或共享规则设置了安全策略，那么您的用户将只能看到他们有权查看的个案。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig23_HTML.jpg](img/437055_1_En_5_Fig23_HTML.jpg)\n\
  \n  图 5-23 — 个案归属筛选器\n\n- `单位`筛选器允许您以分钟、小时或天为单位显示个案已开启的时长，如图 5-24 所示。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig24_HTML.jpg](img/437055_1_En_5_Fig24_HTML.jpg)\n\
  \n  图 5-24 — 个案单位筛选器\n\n- 个案`日期字段`筛选器的工作原理与客户、联系人、线索和商机的筛选器相同。您可以从该报表类型中选择任何日期字段进行筛选，还可以使用\
  \ Salesforce 智能日期，如图 5-25 所示。智能日期允许您选择每次运行报表时会更新为相对时间的日期。例如，您可以从下拉菜单中选择`本周`或`当前日历年`，或者在`从`和`到`字段中使用您自己的自定义日期范围。\n\
  \n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig25_HTML.jpg](img/437055_1_En_5_Fig25_HTML.jpg)\n\
  \n  图 5-25 — 个案智能日期筛选器\n\n#### 营销活动\n\n营销活动只有一个标准筛选选项。\n\n- `显示`筛选器允许您按特定营销活动进行筛选，并提供一个查找字段来定位该活动，如图\
  \ 5-26 所示。它还允许您查看所有有效的营销活动、您拥有的营销活动、所有有效的营销活动（无论归属何人）以及所有营销活动。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig26_HTML.jpg](img/437055_1_En_5_Fig26_HTML.jpg)\n\
  \n  图 5-26 — 营销活动归属筛选器\n\n### 字段筛选器\n\n报表生成器中的字段筛选器允许您拖放该报表类型中的任意字段，并使用运算符和值来筛选数据。理解这种字段筛选功能很重要，因为您会在\
  \ Salesforce 中广泛看到相同的功能。您可以在列表视图、工作流规则、流程构建器和 `Apex` 语言中找到它。您需要熟悉的一些运算符包括：`等于`、`不等于`、`小于`、`大于`、`小于或等于`、`大于或等于`、`包含`、`不包含`和`开头是`。如果标准的智能日期筛选器不适用，您也可以在此处进一步自定义智能日期。将您选择的日期字段拖放到筛选字段部分，将运算符设置为`\"\
  等于\"`，并使用类似 `未来 N 天`（将 `N` 替换为您所需的数字）或 `过去 N 个月` 的短语。\n\n1. 从左侧的`字段`部分取出您的字段，并将其拖到`筛选器`部分，如图\
  \ 5-27 所示。\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig27_HTML.jpg](img/437055_1_En_5_Fig27_HTML.jpg)\n\
  \n   图 5-27 — 将字段拖放到字段筛选器部分\n\n2. 为您的筛选器选择合适的运算符，如图 5-28 所示。\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig28_HTML.jpg](img/437055_1_En_5_Fig28_HTML.jpg)\n\
  \n   图 5-28 — 为字段筛选器选择运算符\n\n3. 如果选择的字段筛选器是选项列表字段，您可以点击查找图标。如果字段是其他数据类型，您可以输入所需的值。\n\
  \n4. 仅针对选项列表字段，您需要勾选筛选器应包含的值。\n\n5. 仅针对选项列表字段，点击`插入所选`将这些值添加到您的筛选器中，如图 5-29 所示。\n\
  \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig29_HTML.jpg](img/437055_1_En_5_Fig29_HTML.jpg)\n\
  \n   图 5-29 — 选择选项列表字段的字段值\n\n6. 点击`确定`完成您的字段筛选器，如图 5-30 所示。\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig30_HTML.jpg](img/437055_1_En_5_Fig30_HTML.jpg)\n\
  \n   图 5-30 — 完成您的字段筛选器\n\n> **注意：** 请注意图 5-30 中`确定`按钮旁边的`已锁定`复选框。如果选中此复选框，您可以锁定报表上的筛选器，这样除非用户拥有修改报表的权限，否则无法更改。图\
  \ 5-31 显示了锁定后的状态。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig31_HTML.jpg](img/437055_1_En_5_Fig31_HTML.jpg)\n\
  \n图 5-31 — 已锁定的字段筛选器\n\n\n\n### 筛选逻辑\n\n设置至少一个字段筛选器后，筛选逻辑将允许你对字段的评估方式应用“与”、“或”或“非”条件。你可以根据需要为报表创建包含任意数量字段筛选器的复杂条件。如果使用筛选逻辑，则必须在条件中包含所有字段筛选器。你可以使用括号将逻辑分组，以进一步定义报表。默认的筛选逻辑会在语句中放置`AND`，意味着“1\
  \ AND 2 AND 3”，以此类推。这指示报表仅包含满足你设置的所有三个（或任意数量）条件的记录。\n\n1.  点击“筛选器”旁边的`添加`按钮，然后选择“筛选逻辑”。\n\
  2.  创建你的条件语句。你将使用字段筛选器旁边的数字来定义哪些字段筛选器需要与“与”或“或”语句组合。你使用的语句看起来像“`(1 OR 2) AND 3 AND\
  \ 4`”。另一个例子是“`1 AND 2 AND 3 AND 4 AND (5 OR 6 OR 7)`”。\n3.  点击`确定`完成筛选逻辑，如图 5-32\
  \ 所示。\n\n    **注意** 每次添加新的字段筛选器时，你都应该调整筛选逻辑并确保其正确无误。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig32_HTML.jpg](img/437055_1_En_5_Fig32_HTML.jpg)\n\
  \n    *图 5-32*  \n    *更改筛选逻辑*\n\n### 交叉筛选\n\nSalesforce 中的交叉筛选允许你对与当前报表对象相关的对象应用条件。你可以通过对相关对象应用“包含”或“不包含”条件来使用交叉筛选。使用交叉筛选后，通过该相关交叉筛选进一步定义字段筛选器。一个例子是筛选所有没有跟进活动的商机。或者使用交叉筛选来设置对没有产品的商机进行筛选，以确定哪些商机仍需要完成。使用交叉筛选的另一个例子是确定某个客户或联系人是否与你的销售团队有过任何互动。你可以通过创建一个客户或联系人报表并添加“不包含”活动的交叉筛选逻辑来设置。这将为你提供一份所有需要联系或跟进核查的客户或联系人列表。要进行设置，请先创建至少一个字段筛选器，然后按照以下步骤操作：\n\
  \n1.  点击“筛选器”旁边的`添加`按钮，然后选择“交叉筛选”。\n2.  选择你想要用来关联其他对象的主要对象。\n3.  定义是否希望使用“包含”或选择“不包含”来查看这些相关对象。\n\
  4.  选择你想要查看或不查看的相关对象。\n5.  点击`添加相关对象筛选器`，选择运算符和值，然后点击`确定`，如图 5-33 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig33_HTML.jpg](img/437055_1_En_5_Fig33_HTML.jpg)\n\
  \n    *图 5-33*  \n    *设置交叉筛选*\n\n### 行数限制\n\n行数限制筛选器用于表格报表，允许你在限制返回行数并按字段排序后，在仪表板上以表格或图表形式显示报表。要进行创建，请按以下步骤操作：\n\
  \n1.  点击`添加`按钮并选择“行数限制”，如图 5-34 所示。\n2.  定义行数限制。\n3.  选择按特定字段排序，并选择升序或降序，然后点击`确定`。\n\
  \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig34_HTML.jpg](img/437055_1_En_5_Fig34_HTML.jpg)\n\
  \n    *图 5-34*  \n    *设置行数限制*\n\n## 使用报表生成器\n\n在 Salesforce 中创建报表可以让你分析你和用户正在收集的数据。对于\
  \ Salesforce 报表的新手来说，最好的事情莫过于你无法破坏或损坏你的数据。使用报表所做的只是以更易读的格式显示你当前拥有的数据，而不是显示在单个记录中。所以，不要害怕，大胆开始点击操作吧！\n\
  \n### 创建潜在客户报表\n\n你可以使用潜在客户报表来查看有关潜在客户的部分或全部关键信息。你可以看到有多少潜在客户，哪些潜在客户来源在你的市场团队中有效，正在由用户处理的潜在客户数量与队列中的数量对比，以及更多信息！通过生成潜在客户报表可以解决的众多业务问题之一是，评估哪些潜在客户来源有效，哪些效果不佳。你可以创建一个关于已转化潜在客户的报表，并按潜在客户来源进行分组，如图\
  \ 5-35 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig35_HTML.jpg](img/437055_1_En_5_Fig35_HTML.jpg)\n\
  \n*图 5-35*  \n*潜在客户报表示例*\n\n要创建潜在客户报表，请按以下步骤操作：\n\n1.  导航到“报表”选项卡并点击`报表`，如图 5-36\
  \ 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig36_HTML.jpg](img/437055_1_En_5_Fig36_HTML.jpg)\n\
  \n    *图 5-36*  \n    *导航到报表选项卡*\n\n2.  点击`新建报表`，如图 5-37 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig37_HTML.jpg](img/437055_1_En_5_Fig37_HTML.jpg)\n\
  \n    *图 5-37*  \n    *点击新建报表按钮以创建新报表*\n\n3.  在`快速查找`中，输入**潜在客户**或点击`潜在客户`，然后点击`创建`，如图\
  \ 5-38 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig38_HTML.jpg](img/437055_1_En_5_Fig38_HTML.jpg)\n\
  \n    *图 5-38*  \n    *查找要使用的报表类型*\n\n4.  点击并按住你想要移入报表的字段名称，将其拖放到目标列中。继续拖放报表所需的任意多个字段。完成后，点击`保存`，如图\
  \ 5-39 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig39_HTML.jpg](img/437055_1_En_5_Fig39_HTML.jpg)\n\
  \n    *图 5-39*  \n    *将新字段拖放到报表中*\n\n5.  为报表命名，然后按`Tab`键，Salesforce 会自动在`报表唯一名称`字段中输入一个值。\n\
  6.  输入将显示给用户的描述。\n7.  选择报表应存储的报表文件夹。\n8.  点击`保存`，如图 5-40 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig40_HTML.jpg](img/437055_1_En_5_Fig40_HTML.jpg)\n\
  \n    *图 5-40*  \n    *保存报表*\n\n9.  点击`运行报表`查看数据结果，如图 5-41 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig41_HTML.jpg](img/437055_1_En_5_Fig41_HTML.jpg)\n\
  \n    *图 5-41*  \n    *运行报表以查看结果*\n\n\n\n### 创建联系人与客户报告\n\n您可以创建一份联系人与客户报告，以显示所有联系人详细信息。使用此报告可生成呼叫列表、进行邮件合并、查看新创建的联系人与客户，或满足其他业务需求。企业对企业（B2B）组织若想确定其合作的行业类型，可从客户报告中获益。您可以生成一份报告，显示在每個行业中您所接触的企业数量。这将有助于您确定营销工作的重点方向。图\
  \ 5-42 展示了此报告的外观。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig42_HTML.jpg](img/437055_1_En_5_Fig42_HTML.jpg)\n\
  \n图 5-42 — 客户与联系人报告示例\n\n要创建联系人与客户报告，请执行以下操作：\n\n1.  导航至 `Reports` 选项卡并单击 `Reports`；看到报告文件夹后，单击右上角的\
  \ `New Reports`。\n\n2.  在 `Quick Find` 区域中，输入 `Contact`。或者，单击 `Accounts`，然后单击 `Contacts\
  \ & Accounts`，再单击 `Create`，如图 5-43 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig43_HTML.jpg](img/437055_1_En_5_Fig43_HTML.jpg)\n\
  \n    图 5-43 — 为报告选择报告类型\n\n3.  按住要移入报告的字段名称，将其拖到目标列。根据需要继续拖放其他字段。完成后，单击 `Save`，如图\
  \ 5-44 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig44_HTML.jpg](img/437055_1_En_5_Fig44_HTML.jpg)\n\
  \n    图 5-44 — 将字段拖放到报告中\n\n4.  为报告命名，然后按 `Tab` 键，Salesforce 将自动在 `Report Unique\
  \ Name` 字段中输入一个值。\n\n5.  输入将向用户显示的描述。\n\n6.  选择用于存储报告的文件夹。\n\n7.  单击 `Save`，如图 5-45\
  \ 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig45_HTML.jpg](img/437055_1_En_5_Fig45_HTML.jpg)\n\
  \n    图 5-45 — 保存报告\n\n8.  单击 `Run Report` 查看数据结果，如图 5-46 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig46_HTML.jpg](img/437055_1_En_5_Fig46_HTML.jpg)\n\
  \n    图 5-46 — 运行报告以查看结果\n\n### 创建商机报告\n\n您可以创建商机报告以及含产品的商机报告，以显示贵公司产生的销售额。使用这些报告类型可显示销售管道中的内容、已从管道中移除的内容，以及团队成功赢得的全部销售业绩。大多数企业会生成商机报告，以帮助预测未来可能需要付出的努力。例如，项目管理公司需要预估目前有多少项目，以及未来可能关闭或启动多少项目。能够进行这种预估对于业务运营至关重要。项目管理公司需要能夠预估未来几个月需要多少项目经理或内部支持人员。为此，项目管理公司将查看所有成功概率为\
  \ 90% 或更高的销售商机。图 5-47 展示了此报告的外观。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig47_HTML.jpg](img/437055_1_En_5_Fig47_HTML.jpg)\n\
  \n图 5-47 — 商机报告示例\n\n要创建商机报告，请遵循以下步骤：\n\n1.  导航至 `Reports` 选项卡并单击 `Reports`；看到报告文件夹后，单击右上角的\
  \ `New Reports`。\n\n2.  在 `Quick Find` 区域中，输入 `Opportunity`。或者，单击 `Opportunity`，再单击\
  \ `Create`，如图 5-48 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig48_HTML.jpg](img/437055_1_En_5_Fig48_HTML.jpg)\n\
  \n    图 5-48 — 为报告选择报告类型\n\n3.  单击 `Show` 并选择 `Details`，如图 5-49 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig49_HTML.jpg](img/437055_1_En_5_Fig49_HTML.jpg)\n\
  \n    图 5-49 — 显示报告详细信息\n\n4.  为报告选择适当的筛选条件以显示所需数据，如图 5-50 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig50_HTML.jpg](img/437055_1_En_5_Fig50_HTML.jpg)\n\
  \n    图 5-50 — 为报告设置报告字段筛选条件\n\n5.  按住要移入报告的字段名称，将其拖到目标列。根据需要继续拖放其他字段。完成后，单击 `Save`，如图\
  \ 5-51 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig51_HTML.jpg](img/437055_1_En_5_Fig51_HTML.jpg)\n\
  \n    图 5-51 — 将字段拖放到报告中\n\n6.  为报告命名，然后按 `Tab` 键，Salesforce 将自动在 `Report Unique\
  \ Name` 字段中输入一个值。\n\n7.  输入将向用户显示的描述。\n\n8.  选择用于存储报告的文件夹。\n\n9.  单击 `Save`，如图 5-52\
  \ 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig52_HTML.jpg](img/437055_1_En_5_Fig52_HTML.jpg)\n\
  \n    图 5-52 — 保存报告\n\n10.  单击 `Run Report` 查看数据结果。\n\n### 创建表格、摘要和矩阵报告\n\n表格报告是创建新报告时的默认报告格式。选择报告类型并进入报告生成器后，您可以在所有三种报告格式之间切换。如果从摘要或矩阵报告格式切换到表格格式，建议将已分组的字段移动到某列中；否则，这些字段将会丢失，切换到表格格式后必须重新将它们添加到报告中。从矩阵报告切换到摘要报告时，请注意，如果在矩阵报告中设置了四个分组，也可能会丢失一些分组；摘要报告最多只能处理三个分组。下面我们来看看如何创建表格、摘要和矩阵报告。\n\
  \n1.  导航至 `Reports` 选项卡并单击 `Reports`；看到报告文件夹后，单击右上角的 `New Reports`。\n\n2.  选择您想要的报告类型，然后单击\
  \ `Create`，如图 5-53 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig53_HTML.jpg](img/437055_1_En_5_Fig53_HTML.jpg)\n\
  \n    图 5-53 — 为报告选择报告类型\n\n3.  在报告生成器的 `Preview` 窗格中，选择下拉菜单中显示的 `Tabular Format`，并切换到您想要的报告格式，如图\
  \ 5-54 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig54_HTML.jpg](img/437055_1_En_5_Fig54_HTML.jpg)\n\
  \n    图 5-54 — 更改报告格式\n\n\n\n### 构建表格报表\n\n请按照以下步骤操作：\n\n1.  要构建表格报表，无需更改`Format`下拉菜单。只需根据需要将字段拖放到报表中即可。完成后，点击`Save`，命名报表，然后点击`Run`查看结果，如图\
  \ 5-55 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig55_HTML.jpg](img/437055_1_En_5_Fig55_HTML.jpg)\n\
  \n    图 5-55\n\n    将字段拖放到报表中\n\n2.  您也可以通过点击字段来选择表格报表的排序依据字段。请注意，当您点击字段时，该字段上会添加一个向上或向下的箭头。这表示该字段是按升序还是降序排列，如图\
  \ 5-56 所示。\n\n    **注意** 您可以像这样对所有报表类型进行排序。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig56_HTML.jpg](img/437055_1_En_5_Fig56_HTML.jpg)\n\
  \n    图 5-56\n\n    在报表中按字段排序\n\n### 构建摘要报表\n\n请按照以下步骤操作：\n\n1.  进入报表构建器后，将`Format`更改为\
  \ Summary 格式，如图 5-57 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig57_HTML.jpg](img/437055_1_En_5_Fig57_HTML.jpg)\n\
  \n    图 5-57\n\n    将报表格式更改为摘要报表格式\n\n2.  通过将字段拖放到`\"Drop a field here to create\
  \ a grouping\"`区域来为报表添加分组，如图 5-58 所示。\n\n    **注意** 此处最多可添加三个分组，此功能在矩阵报表格式中也可用。\n\
  \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig58_HTML.jpg](img/437055_1_En_5_Fig58_HTML.jpg)\n\
  \n    图 5-58\n\n    将字段拖放到报表的分组区域\n\n3.  使用字段对报表进行分组后，您可以进一步定义日期数据类型字段的分组方式。例如，如果您按`Close\
  \ Date`字段分组，则可以更改为按`Calendar Month`分组，如图 5-59 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig59_HTML.jpg](img/437055_1_En_5_Fig59_HTML.jpg)\n\
  \n    图 5-59\n\n    定义报表的分组方式\n\n4.  继续构建报表，将字段拖放到您选择的位置。保存并命名报表，然后运行。\n\n### 构建矩阵格式报表\n\
  \n请按照以下步骤操作：\n\n1.  进入报表构建器后，将`Tabular Format`下拉菜单更改为`Matrix`，如图 5-60 所示。\n\n  \
  \  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig60_HTML.jpg](img/437055_1_En_5_Fig60_HTML.jpg)\n\
  \n    图 5-60\n\n    将报表格式切换为矩阵报表格式\n\n2.  请注意，此报表类型有两个分组区域：列级别和行级别。将您选择的字段拖放到任一分组区域中。您可以在列分组级别和行分组级别上各添加两个分组，如图\
  \ 5-61 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig61_HTML.jpg](img/437055_1_En_5_Fig61_HTML.jpg)\n\
  \n    图 5-61\n\n    将字段拖放到报表的分组区域中\n\n3.  继续构建报表，将字段拖放到您想要的位置。保存并命名报表，然后运行。\n\n\
  ### 汇总数据\n\n您可以在报表构建器中对数字、货币或百分比字段数据类型使用汇总功能。汇总功能允许您对行中的数据求和、求行中数据的平均值、求行中数据的最小值或求行中数据的最大值。在机会报表中使用此功能可以查找机会或案例的平均天数。或者使用此功能简单地获取机会中金额字段的总和。在摘要或矩阵报表中使用此功能时，它将在所有分组级别上进行汇总，并给出总计。\n\
  \n1.  进入报表构建器后，点击要汇总的字段旁边的向下箭头，如图 5-62 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig62_HTML.jpg](img/437055_1_En_5_Fig62_HTML.jpg)\n\
  \n    图 5-62\n\n    汇总一个字段\n\n2.  选择求和、求平均值、求最大值或求最小值，然后点击`Apply`，如图 5-63 所示。\n\n\
  \    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig63_HTML.jpg](img/437055_1_En_5_Fig63_HTML.jpg)\n\
  \n    图 5-63\n\n    选择汇总字段的方式\n\n3.  不要忘记保存并运行您的报表。\n\n### 向报表添加公式\n\n您可以向报表添加公式，以计算对象中的货币、数字或百分比字段。公式功能允许您利用字段格式、汇总字段数据、使用基本运算符、使用复杂函数以及使用逻辑语句。\n\
  \n公式的运算符包括加法、减法、乘法、除法和幂运算。可用的函数包括逻辑语句、数学语句或汇总语句。\n\n1.  在左侧窗格中，将`Add Formula`拖入报表，并将其放置在您选择的列位置，如图\
  \ 5-64 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig64_HTML.jpg](img/437055_1_En_5_Fig64_HTML.jpg)\n\
  \n    图 5-64\n\n    向报表添加公式字段\n\n2.  为您的公式命名。\n\n3.  添加描述。\n\n4.  如有必要，调整格式或小数位数。\n\
  \n5.  选择在哪个级别上运行此公式。\n\n6.  使用必要的运算符或函数创建公式。\n\n    **注意** 公式面向高级用户。本书不会涵盖要使用哪些公式的各个方面。但是，Salesforce\
  \ 提供免费支持，并且有很棒的论坛也可以提供帮助。\n\n7.  对于复杂公式，点击`Check Syntax`以确保没有错误。\n\n8.  点击`OK`添加公式，如图\
  \ 5-65 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig65_HTML.jpg](img/437055_1_En_5_Fig65_HTML.jpg)\n\
  \n    图 5-65\n\n    在报表上创建公式字段\n\n9.  公式字段作为报表中的一列出现，如图 5-66 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig66_HTML.jpg](img/437055_1_En_5_Fig66_HTML.jpg)\n\
  \n    图 5-66\n\n    公式字段作为一列显示在您的报表中\n\n\n\n### 导出报告\n\n您可以将 Salesforce 中创建的任何报告数据导出到电子表格，以便在\
  \ Excel 中进行进一步分析。Salesforce 提供两种可导出的格式：Excel 格式 `.xls` 和逗号分隔的 `.csv`。`.xls` 兼容 Excel\
  \ 和大多数电子表格软件。`.csv` 兼容性更广，但格式有限。\n\n1.  打开您要导出的报告；在右侧角落点击 *编辑* 一词旁边的向下箭头，然后选择“导出”，如图\
  \ 5-67 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig67_HTML.jpg](img/437055_1_En_5_Fig67_HTML.jpg)\n\
  \n    图 5-67\n\n    导出报告\n\n2.  选择支持您公司软件的格式，然后选择“导出”，如图 5-68 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig68_HTML.jpg](img/437055_1_En_5_Fig68_HTML.jpg)\n\
  \n    图 5-68\n\n    选择导出格式并导出数据\n\n### 创建报告图表\n\n您可以在 Salesforce 中为报告创建图表。报告图表允许您以图形格式查看数据，便于快速查看。报告和报告图表是一一对应的：一份报告只能使用一个图表。如果您希望查看报告的多种变体，可以克隆报告，或者更好的方法是将它们放入仪表板（如图\
  \ 5-79 所示）。报告图表只能用于摘要或矩阵格式的报告。您可以创建水平柱状图和垂直柱状图、堆叠水平柱状图和垂直柱状图、折线图、环形图、漏斗图和散点图。\n\n\
  1.  转到“报告”选项卡，选择您想要的报告，如图 5-69 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig69_HTML.jpg](img/437055_1_En_5_Fig69_HTML.jpg)\n\
  \n    图 5-69\n\n    检索报告\n\n2.  点击筛选符号旁边的图表符号，如图 5-70 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig70_HTML.jpg](img/437055_1_En_5_Fig70_HTML.jpg)\n\
  \n    图 5-70\n\n    点击图表图标\n\n3.  根据您的报告和数据组合方式，Salesforce 会显示一个推荐图表。如果需要，您可以更改此设置；点击设置齿轮图标，如图\
  \ 5-71 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig71_HTML.jpg](img/437055_1_En_5_Fig71_HTML.jpg)\n\
  \n    图 5-71\n\n    选择图表的设置图标\n\n4.  更改“显示为”部分，以反映您想要查看的报告图表类型，如图 5-72 所示。\n\n \
  \   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig72_HTML.jpg](img/437055_1_En_5_Fig72_HTML.jpg)\n\
  \n    图 5-72\n\n    选择图表类型\n\n5.  在图表编辑器中调整图表属性；添加图表标题，将 *x* 轴更改为另一个字段，添加维度或第二轴等项目，选择是否在报告图表上显示数值，并选择图例应显示在图表右侧还是底部，如图\
  \ 5-73 所示。\n\n    **注意** 某些功能仅适用于特定的报告图表。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig73_HTML.jpg](img/437055_1_En_5_Fig73_HTML.jpg)\n\
  \n    图 5-73\n\n    自定义报告图表属性\n\n配置完成后，不要忘记保存您的工作并查看结果，如图 5-74 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig74_HTML.jpg](img/437055_1_En_5_Fig74_HTML.jpg)\n\
  \n图 5-74\n\n报告图表的最终结果\n\n## 了解仪表板\n\n仪表板是您已创建报告的可视化呈现。仪表板可以表示多个仪表板组件（单个图表和图形）。您可以在多个仪表板组件中显示一份报告；但不能将一个报告信息拆分到多个仪表板组件中。例如，如果您有一份显示每个用户销售额的报告，您可以将这同一份报告显示在两个仪表板组件中，例如饼图和柱状图。您可以创建水平柱状图和垂直柱状图、堆叠水平柱状图和垂直柱状图、折线图、环形图、漏斗图、指标图、仪表图、表格图和散点图。\n\
  \n### 创建仪表板、添加仪表板组件以及修改仪表板\n\n请按照以下步骤操作：\n\n1.  点击“仪表板”选项卡，然后点击“新建仪表板”，如图 5-75 所示。\n\
  \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig75_HTML.jpg](img/437055_1_En_5_Fig75_HTML.jpg)\n\
  \n    图 5-75\n\n    创建新仪表板\n\n2.  为您的仪表板命名。\n\n3.  添加描述。\n\n4.  选择您的仪表板是公共还是私有。\n\
  \n5.  点击“创建”，如图 5-76 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig76_HTML.jpg](img/437055_1_En_5_Fig76_HTML.jpg)\n\
  \n    图 5-76\n\n    命名并创建仪表板\n\n6.  点击右上角的“组件”将您已创建的报告添加到仪表板，如图 5-77 所示。\n\n   \
  \ ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig77_HTML.jpg](img/437055_1_En_5_Fig77_HTML.jpg)\n\
  \n    图 5-77\n\n    向仪表板添加新报告和图表组件\n\n7.  搜索您想要添加到仪表板的报告，如图 5-78 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig78_HTML.jpg](img/437055_1_En_5_Fig78_HTML.jpg)\n\
  \n    图 5-78\n\n    查找仪表板组件的报告\n\n8.  选择您要用来显示数据的图表，并修改任何属性以更好地展示数据。完成后，点击“添加”，如图\
  \ 5-79 所示。\n\n    **注意** 在修改这些属性时，请注意预览报告的变化。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig79_HTML.jpg](img/437055_1_En_5_Fig79_HTML.jpg)\n\
  \n    图 5-79\n\n    在仪表板上为报告创建配套图表\n\n9.  点击仪表板报告并拖拽边角以放大报告，或者点击仪表板并将报告移动到仪表板上的其他位置，如图\
  \ 5-80 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig80_HTML.jpg](img/437055_1_En_5_Fig80_HTML.jpg)\n\
  \n    图 5-80\n\n    修改报告和图表的大小\n\n10. 重复步骤 6 到 9，直到对仪表板满意为止。\n\n11. 完成后点击“保存”以保存您的工作，如图\
  \ 5-81 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig81_HTML.jpg](img/437055_1_En_5_Fig81_HTML.jpg)\n\
  \n    图 5-81\n\n    保存仪表板\n\n\n\n#### 使用动态仪表板\n\n动态仪表板允许每位用户根据其安全性和共享设置，查看自己有权访问的数据。这样，你只需创建一个仪表板，每位用户就都能访问。创建仪表板后，你可以访问其属性进行此项修改，或为其他用户使用另外两种访问方式。你可以将仪表板设置为以“我”的视角查看，这样仪表板读者就能根据你对数据的访问权限，看到仪表板中的数据。你可以选择“指定用户”选项，让用户根据所选用户的访问权限查看数据。最后，你还可以使用“当前登录用户”选项，让用户根据自己的访问权限查看数据。此外，通过取消选中“允许更改仪表板视图（动态仪表板）”，你可以防止用户更改仪表板的查看方式。\n\
  \n当企业希望防止用户看到不应看到的数据时，会选择动态仪表板而非非动态仪表板。例如，一家公司可能有很多销售用户，这些销售用户负责不同的区域。如果你不希望负责加利福尼亚州的销售人员看到纽约州的销售数据，可以使用“当前登录用户”选项。（当然，你必须已设置好安全措施以防止这种情况发生，这部分内容将在第\
  \ 9 章中介绍。）如果你的公司不需要限制用户数据，则可以保持默认设置。\n\n让我们看看如何进行修改：\n\n1.  点击仪表板右上角的设置齿轮图标，如图 5-82\
  \ 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig82_HTML.jpg](img/437055_1_En_5_Fig82_HTML.jpg)\n\
  \n    图 5-82\n    创建动态仪表板\n\n2.  选择你要将仪表板设置为哪种视图。\n\n3.  选择或取消选择用户是否能够更改此设置。\n\n\
  4.  点击“保存”，如图 5-83 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig83_HTML.jpg](img/437055_1_En_5_Fig83_HTML.jpg)\n\
  \n    图 5-83\n    选择仪表板的视图\n\n## 总结\n\n将 Salesforce 作为客户关系管理工具的最大好处之一，就是可以根据收集的数据生成报表。能够计算投资回报率（ROI）或了解销售团队的表现，将对您未来数月乃至数年的业务大有裨益。关于报表和仪表板，最大的优点是您不会因使用它们而弄乱数据。不要害怕随意点击和尝试。您只是在翻译数据，不会搞砸的！\n\
  \n"
- "# 6. 协作\n\nSalesforce 提供了许多协作工具。其中一项有价值的协作工具叫做 Chatter。这个工具及其功能可以在 Salesforce 中大量标准对象和所有自定义对象上找到。它允许您的用户通过内部消息相互沟通。您甚至可以让用户通过内容交付，与彼此及客户共享\
  \ Word 和 PowerPoint 等文件。您需要将 Salesforce 记录共享给另一个 Salesforce 组织吗？您可以使用 Lightning\
  \ Connect 将数据同步到另一个 Salesforce 组织。您可以启用*主题*，让用户就特定主题进行互动。我们也不能忘记 Salesforce 移动应用\
  \ Salesforce，它允许 iPhone 和 Android 用户随时随地使用。图 6-1 展示了 Chatter 对象。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig1_HTML.jpg](img/437055_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\nChatter 工具\n\n## 理解 Chatter\n\nSalesforce Chatter 是一个基本工具，可用于帮助您与同事进行内部协作以及与客户进行外部协作。您可以使用\
  \ Chatter 的“帖子”功能，向其他用户发布消息，或者在记录本身上发布与该记录相关的消息。让您的员工能够向管理团队提出需要回答的问题。或者通过匿名投票收集员工的信息。Chatter\
  \ 内置了许多出色的工具，可以以多种方式使用。让我们进一步了解其中一些工具。\n\n## 侧边栏\n\nChatter 选项卡上的侧边栏让您可以快速访问 Chatter\
  \ 功能（图 6-2）。使用`我关注的`链接，可以快速查看与用户在 Salesforce 中关注的所有记录对应的所有 Chatter 帖子（稍后将详细介绍此功能）。使用`发送给我的`链接，可以查看用户使用`@`符号发给您的任何帖子，或另一位用户在您的个人资料上留下的任何帖子。使用`已添加书签`查看您已添加书签的任何帖子。`公司动态`快速访问链接使用\
  \ Einstein 的人工智能（AI）为您呈现组织中的所有热门主题。`动态流`快速访问链接允许您创建指向记录的快速访问链接。使用此部分可以查看您关注的所有账户、案例、联系人等。`最近群组`允许您创建并查看您最近关注的群组。\n\
  \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig2_HTML.jpg](img/437055_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\nChatter 侧边栏\n\n### 在 Chatter 中关注\n\n关注是 Salesforce 中一个强大的工具。您可以关注从人员到群组再到记录的任何内容。关注可以让您看到您所关注记录的所有相关内容和互动。在\
  \ Chatter 中关注类似于在 Twitter 上关注某人。想看到您的培训讲师在 Salesforce 上发布的所有内容吗？请转到他们的个人资料并点击`+\
  \ 关注`按钮。如果您已为该对象设置了动态流，则可以选择将此记录添加到该动态流，或者只使用`我关注的`。如果您正在查看 Chatter 信息流，请将鼠标悬停在另一位用户的姓名上，然后使用此处的`关注`按钮。在任何记录的顶部都可以找到`关注`按钮，如图\
  \ 6-3 所示。关注会将内容和帖子带入您的 Chatter 信息流，并允许您直接在自己的信息流中进行互动。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig3_HTML.jpg](img/437055_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n在 Chatter 中关注\n\n### 为帖子添加书签\n\n您可以像为网站添加书签一样为帖子添加书签。如果您想保存此帖子以备后用，并让它出现在\
  \ Chatter 的`已添加书签`快速访问列表中，您只需点击帖子右侧向下的箭头，然后点击`添加书签`（图 6-4）。注意，箭头旁边会出现一个带星标的黄色三角形。移除书签的方法相同，只是在下拉菜单中选择`移除书签`即可。\n\
  \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig4_HTML.jpg](img/437055_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n为帖子添加书签\n\n\n\n### 创建流\n\n`Streams`（流）允许您创建可能想要关注的特定记录分组（图 6-5）。当您想要创建一个自定义动态，将来自不同对象的记录分组到一个动态中时，Chatter\
  \ 中的 `Streams` 是最佳选择。\n\n例如，如果您有一个新的营销活动，并且想要创建一个动态来关注受该营销活动影响的记录，则可以创建一个流，显示这些不同对象上的所有\
  \ Chatter 帖子。要创建新流，请单击 Chatter 侧边栏中 `Streams` 旁边的加号。首先，您需要为流命名。接下来，通过先选择对象，再使用搜索栏搜索特定记录，来选择要包含在该流中的对象和记录。`Streams`\
  \ 允许您查看以下标准对象以及所有自定义对象的记录：`Accounts`（客户）、`Cases`（个案）、`Contacts`（联系人）、`Files`（文件）、`Groups`（组）、`Leads`（线索）、`Opportunities`（商机）、`People`（人员）和\
  \ `Topics`（主题）。如果您正在查看一条记录并希望将该特定记录包含到流中，请使用 `+ Follow`（关注）按钮并选择该流。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig5_HTML.jpg](img/437055_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5  \n创建新流\n\n### 创建组\n\nSalesforce 中的 Chatter 用户组为组内用户提供了一个进行协作的中心位置（图 6-6）。大多数组织会为其部门创建组。您可以将组设置为公开、私有或未列出的。公共组动态对客户或\
  \ Chatter 免费用户可见（稍后将详细介绍此功能）。私有组是仅限成员组，要求用户请求加入并在与组交互之前获得批准。未列出的组提供了比私有组更高的隐私性。未列出的组不允许用户请求加入；只能通过邀请加入。此外，未列出的组不会显示在列表视图、动态、用户资料或任何其他地方，除非您是该组的成员或具有修改未列出组的权限（即使具有\
  \ `Modify All Data`（修改所有数据）权限的用户，如果他们不是成员，也无法看到这些组）。\n\n要创建组，请单击 Chatter 侧边栏上 `Groups`（组）旁边的加号。接下来，您需要为组命名。您可以为组添加描述、添加组的相关信息、在“所有者”字段中选择谁管理该组、确定访问类型（公开、私有或未列出）、选择是否考虑让客户加入该组、如果您希望帖子仅来自组的管理员或所有者，则选择\
  \ `Broadcast Only`（仅广播），然后单击 `Save & Next`（保存并下一步）按钮。在下一页上，为您的组上传一张组照片。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig6_HTML.jpg](img/437055_1_En_6_Fig6_HTML.jpg)\n\
  \n图 6-6  \n创建 Chatter 组\n\n### Chatter 动态\n\n通过导航到 Chatter 选项卡，或转到屏幕右上角的用户资料并单击您的姓名，来访问您的\
  \ Chatter 动态（图 6-7）。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig7_HTML.jpg](img/437055_1_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7  \n导航到 Chatter\n\n您的 Chatter 动态包含您关注的所有项目、使用 `@` 符号直接发给您的帖子，或您创建的帖子。在您的\
  \ Chatter 动态中，您可以通过使用侧边栏来控制您看到的内容。\n\n### 在您的动态上创建帖子\n\n要创建帖子，请确保您位于 Chatter 的 `Post`（帖子）选项卡上（图\
  \ 6-8）。您可以在提供的框中开始输入，并使用其提供的任何样式，例如为文本加粗、斜体、下划线、删除线，以及项目符号或编号。您还可以添加图像、标记其他组或用户，以及附加文件。帖子完成后，单击\
  \ `Share`（分享）。帖子有错误？没关系，使用向下箭头（与书签使用的箭头相同）并单击 `Edit`（编辑）或 `Delete`（删除）。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig8_HTML.jpg](img/437055_1_En_6_Fig8_HTML.jpg)\n\
  \n图 6-8  \n在动态上创建帖子\n\n分享您的帖子后，可以看到其他用户点赞、评论和分享您的帖子（图 6-9）。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig9_HTML.jpg](img/437055_1_En_6_Fig9_HTML.jpg)\n\
  \n图 6-9  \n其他用户评论和点赞您的帖子\n\n### 在记录的动态上创建帖子\n\n首先，您需要搜索或找到要发布帖子的记录。接下来，单击该记录的 `Related`（相关）选项卡时右侧出现的\
  \ `Chatter` 一词。单击 `Chatter` 后，您可以在提供的框中开始输入，并使用其提供的任何样式，例如为文本加粗、斜体、下划线、删除线，或项目符号或编号。您还可以添加图像、标记其他组或用户，以及附加文件，如图\
  \ 6-10 所示。帖子完成后，单击 `Share`（分享）。您还可以使用 `Poll`（投票）和 `Questions`（问题）选项（本章后面会介绍）。\n\n\
  ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig10_HTML.jpg](img/437055_1_En_6_Fig10_HTML.jpg)\n\
  \n图 6-10  \n在记录上创建 Chatter 帖子\n\n### 在帖子中创建主题\n\n您可以像在 Twitter 和 Instagram 上一样使用话题标签，在\
  \ Salesforce 中创建热门话题。只需在评论或帖子中任何单词前添加 `#` 符号（中间无空格）。例如，使用 `#learning`（学习）（图 6-11）。\n\
  \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig11_HTML.jpg](img/437055_1_En_6_Fig11_HTML.jpg)\n\
  \n图 6-11  \n使用话题标签创建主题\n\n\n\n### 创建 Chatter 投票\n\n你可以在自己的动态或群组动态中创建最多包含十个选项的 Chatter\
  \ 投票，如图 6-12 所示。观察其他 Chatter 用户对他们的选择进行投票。Salesforce 将统计票数并显示结果。投票用户在提交投票前，不会看到谁投了哪个选项，也不会看到投票结果。继续阅读以了解如何创建\
  \ Chatter 投票。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig12_HTML.jpg](img/437055_1_En_6_Fig12_HTML.jpg)\n\
  \n图 6-12\n\nChatter 投票\n\n要创建 Chatter 投票，请按照以下步骤操作：\n\n1.  导航到 Chatter 对象，或通过导航到\
  \ Chatter 选项卡从记录内创建投票。\n2.  点击记录 Chatter 部分中的 `Poll` 选项卡。图 6-13 显示了如何从记录访问此功能，图\
  \ 6-14 显示了如何从 Chatter 对象访问此功能。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig14_HTML.jpg](img/437055_1_En_6_Fig14_HTML.jpg)\n\
  \n    图 6-14\n\n    从 Chatter 对象访问 Chatter 投票\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig13_HTML.jpg](img/437055_1_En_6_Fig13_HTML.jpg)\n\
  \n    图 6-13\n\n    从记录访问 Chatter 投票\n3.  输入您为 Chatter 用户准备的投票问题。\n4.  输入您为 Chatter\
  \ 用户提供的投票选项。\n5.  如果您需要更多选项，请点击 `Add new choice` 链接。\n6.  完成选项设置后，点击 `Ask`，如图 6-15\
  \ 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig15_HTML.jpg](img/437055_1_En_6_Fig15_HTML.jpg)\n\
  \n    图 6-15\n\n    创建 Chatter 投票\n7.  发布投票后，您可以点击 `View results` 链接查看结果，如图 6-16\
  \ 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig16_HTML.jpg](img/437055_1_En_6_Fig16_HTML.jpg)\n\
  \n    图 6-16\n\n    查看 Chatter 投票结果\n\n### 创建 Chatter 问题\n\n您可以使用 Chatter 提问功能提出对其他用户有益或可能由其他用户解答的问题，如图\
  \ 6-17 所示。确保您处于 Chatter 动态的 `Question` 选项卡，然后发布您的问题。只需等待其他用户回答您的帖子。找到最佳答案后，点击评论中\
  \ `Like` 链接旁边的 `Select as Best` 链接，该答案便会移至您问题下方的帖子顶部，供其他用户查看。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig17_HTML.jpg](img/437055_1_En_6_Fig17_HTML.jpg)\n\
  \n图 6-17\n\n创建 Chatter 问题\n\n## Chatter 通知\n\nChatter 通知可以多种形式呈现。当有人@您时，您可以通过浏览器右上角的铃铛图标立即看到，如图\
  \ 6-18 所示。您可以点击铃铛图标查看最新的@您的帖子或留下的评论。在此处，您可以点击 `Mark all as read` 链接来清除通知窗口，或者点击评论本身以跳转到\
  \ Chatter 中的帖子。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig18_HTML.jpg](img/437055_1_En_6_Fig18_HTML.jpg)\n\
  \n图 6-18\n\n接收 Chatter 通知\n\n您还可以选择接收每日、每周或即时的电子邮件通知。如果您是 Salesforce 移动端（iPhone\
  \ 或 Android）用户，您可以启用通知并将其发送到您的手机上，如图 6-19 所示。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig19_HTML.jpg](img/437055_1_En_6_Fig19_HTML.jpg)\n\
  \n图 6-19\n\nChatter 通知\n\n### 启用 Chatter 电子邮件通知\n\n您可以通过以下步骤为所有用户启用 Chatter 电子邮件通知：\n\
  \n1.  点击右上角的设置齿轮图标，然后从下拉菜单中选择 `Setup`，如图 6-20 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig20_HTML.jpg](img/437055_1_En_6_Fig20_HTML.jpg)\n\
  \n    图 6-20\n\n    导航到设置菜单\n2.  在 `Quick Find` 框中输入 `Email Setting`，然后点击 Chatter\
  \ 下的 `Email Settings`，如图 6-21 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig21_HTML.jpg](img/437055_1_En_6_Fig21_HTML.jpg)\n\
  \n    图 6-21\n\n    点击电子邮件设置\n3.  选择您想要的电子邮件设置，如图 6-22 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig22_HTML.jpg](img/437055_1_En_6_Fig22_HTML.jpg)\n\
  \n    图 6-22\n\n    通用电子邮件设置\n\n    *   `Allow Emails`：为用户启用 Chatter 电子邮件通知。\n \
  \   *   `Allow Email Replies`：允许用户通过回复电子邮件来回应 Chatter 通知。\n    *   `Allow Posts\
  \ via Email`：允许用户使用电子邮件向群组发帖。\n    *   `Allow Attachments via Email`：允许用户在回复和通过电子邮件发帖时使用附件。\n\
  \    *   `Show Salesforce mobile app download badges`：为组织中所有的 Chatter 电子邮件通知添加下载\
  \ Salesforce 移动应用的徽章。\n\n    **注意** Salesforce 中的徽章是一种内部 Chatter 认可技巧，用户可以获取并授予他人。这有助于提高用户接受度，允许用户通过\
  \ `Thanks` 徽章给予认可。`Thanks` 徽章会显示在用户的个人资料中，供所有人查看。\n\n4.  点击 `Save`。\n\n\n\n### 用户的\
  \ Chatter 通知配置\n\n之前的设置将允许您的用户使用 Chatter。现在我们来介绍用户如何选择接收 Chatter 通知。\n\n1.  点击浏览器右上角的个人资料图片，然后点击“设置”，如图\
  \ 6-23 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig23_HTML.jpg](img/437055_1_En_6_Fig23_HTML.jpg)\n\
  \n    图 6-23\n    访问个人资料\n\n2.  在“快速查找”区域，输入**电子邮件通知**，然后在 Chatter 下选择“电子邮件通知”。\n\
  \n3.  选择最符合您需求的选项。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig25_HTML.jpg](img/437055_1_En_6_Fig25_HTML.jpg)\n\
  \n    图 6-25\n    配置您要接收的 Chatter 电子邮件\n\n    *   在“常规”部分，您必须选择**接收电子邮件**才能接收 Chatter\
  \ 电子邮件，如图 6-24 所示。\n\n        ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig24_HTML.jpg](img/437055_1_En_6_Fig24_HTML.jpg)\n\
  \n        图 6-24\n        开启**接收电子邮件**\n\n    *   在“个人”部分，对于“当有人……时给我发邮件”，我们建议选择以下选项，因为如果选中所有选项，用户可能会被过多的电子邮件通知淹没：\n\
  \        *   *在我的个人资料上发布内容*：此选项将使您随时了解您个人资料上发布的任何内容。\n        *   *对我个人资料上的帖子发表评论*：此选项将在您的帖子收到任何评论时通知您。\n\
  \        *   *对我收藏的项目发表评论*：这会让您随时了解任何收藏帖子的最新动态。\n        *   *在帖子中提及我*：这将通知您用户何时使用\
  \ `@` 符号将帖子指向您或在帖子中提及您。\n        *   *在评论中提及我*：这将通知您用户何时使用 `@` 符号将评论指向您或在评论中提及您。\n\
  \n4.  选择个人摘要的频率。您的个人摘要是 Chatter 中近期活动的摘要，会显示在您自己的信息流中。您可以选择每天、每周接收或从不接收，如图 6-26\
  \ 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig26_HTML.jpg](img/437055_1_En_6_Fig26_HTML.jpg)\n\
  \n    图 6-26\n    选择每天、每周或从不接收电子邮件\n\n5.  您还可以设置接收群组 Chatter 通知的频率。我们建议对新群组选择“有限”；如果您想要更高频率，可以为每个单独的群组更改设置，如图\
  \ 6-27 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig27_HTML.jpg](img/437055_1_En_6_Fig27_HTML.jpg)\n\
  \n    图 6-27\n    选择要从 Chatter 接收的内容\n\n6.  您还可以选择接收群组客户问题的频率，如图 6-28 所示。我们也建议这里选择“有限”。如果您选择其他选项，可能会收到超出预期的电子邮件，这可能会导致更多的干扰而非帮助。\n\
  \n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig28_HTML.jpg](img/437055_1_En_6_Fig28_HTML.jpg)\n\
  \n    图 6-28\n    选择要接收哪些客户问题的通知\n\n## 信息流跟踪\n\n与 Chatter 集成的 Salesforce 信息流跟踪允许您查看在\
  \ Chatter 信息流中记录的对记录所做的更改。在对象上启用此选项后，用户可以在 Chatter 信息流中关注对该记录所做的更改。您可以选择哪些对象以及在信息流中跟踪哪些字段。您可以跟踪以下对象上的字段：`User`、`Group`、自定义和外部标准对象、`Account`、`Article\
  \ Type`、`Asset`、`Campaign`、`Case`、`Contact`、`Contract`、`Dashboard`、`Event`、`Lead`、`Opportunity`、`Product`、`Report`、`Solution`\
  \ 和 `Task`。\n\n### 注意\n\nChatter 信息流中也使用了字段级安全性和共享设置来确定用户在信息流中可以看到什么。\n\n### 启用和自定义信息流跟踪\n\
  \n请执行以下步骤：\n\n1.  点击浏览器右上角的设置齿轮图标，然后选择“设置”，如图 6-29 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig29_HTML.jpg](img/437055_1_En_6_Fig29_HTML.jpg)\n\
  \n    图 6-29\n    导航到“设置”菜单\n\n2.  在“快速查找”区域，输入 **Feed Tracking**，然后选择 Chatter 下的“Feed\
  \ Tracking”，如图 6-30 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig30_HTML.jpg](img/437055_1_En_6_Fig30_HTML.jpg)\n\
  \n    图 6-30\n    导航到信息流跟踪\n\n3.  在左侧，点击您要为信息流跟踪配置的对象，如图 6-31 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig31_HTML.jpg](img/437055_1_En_6_Fig31_HTML.jpg)\n\
  \n    图 6-31\n    设置信息流跟踪\n\n4.  在顶部，确保选中“启用信息流跟踪”。\n\n5.  每个对象最多选择 20 个要跟踪的字段。如果您不想在\
  \ Chatter 中跟踪特定字段的更改，则无需在此处选择任何字段。通过选择要跟踪的单个字段，这将捕获在 Chatter 中所做的更改。信息流跟踪的示例请参见图\
  \ 6-32。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig32_HTML.jpg](img/437055_1_En_6_Fig32_HTML.jpg)\n\
  \n    图 6-32\n    信息流跟踪在 Chatter 中的显示方式\n\n    **注意** 您选择的字段越多，Chatter 记录信息流就会变得越混乱。对所选字段的任何更改都会为该记录信息流添加一个新帖子，并将较旧的帖子推至下方。\n\
  \n6.  所有对象都设置完成后，点击“保存”按钮。\n\n## Chatter 个人资料\n\nSalesforce Chatter 个人资料允许您的用户自定义其\
  \ Salesforce 个人资料，这些资料可供其他 Salesforce 用户和 Chatter 免费用户（通常是客户）查看。他们可以添加个人资料图片、编写“关于我”部分、添加联系信息以及添加横幅照片。个人资料是您的用户查看其\
  \ Chatter 信息流、所属群组、在帖子中上传的文件、正在关注的人以及关注他们的人的另一种方式。他们甚至可以从自己的个人资料添加新帖子或对现有帖子发表评论。\n\
  \n要访问您的个人资料，请点击右上角的个人资料图片，然后点击您的姓名，如图 6-33 所示。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig33_HTML.jpg](img/437055_1_En_6_Fig33_HTML.jpg)\n\
  \n图 6-33\n导航到您的个人资料\n\n其他用户可以通过点击您在记录、Chatter 帖子或其他任何地方看到的超链接姓名来访问您的个人资料，如图 6-34\
  \ 所示。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig34_HTML.jpg](img/437055_1_En_6_Fig34_HTML.jpg)\n\
  \n图 6-34\n访问其他用户的个人资料\n\n\n### 上传个人资料照片\n\n要上传个人资料照片，请按以下步骤操作：\n\n1. 进入个人资料页面后，点击相机图标，然后点击`Update\
  \ Photo`（更新照片），如图 6-35 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig35_HTML.jpg](img/437055_1_En_6_Fig35_HTML.jpg)\n\
  \n   图 6-35：上传个人资料照片\n\n   **注意：** 您的照片必须存储在计算机上。照片格式须为 JPEG、GIF 或 PNG，文件大小不得超过\
  \ 16MB。\n\n2. 点击`Upload Image`（上传图片）按钮，从计算机中选择图片，如图 6-36 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig36_HTML.jpg](img/437055_1_En_6_Fig36_HTML.jpg)\n\
  \n   图 6-36：从计算机上传个人资料照片\n\n3. 使用滑块调整照片大小。如果您希望照片在 Salesforce 外部不可见，请勾选“在可公开访问的页面上显示我的照片”复选框，如图\
  \ 6-37 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig37_HTML.jpg](img/437055_1_En_6_Fig37_HTML.jpg)\n\
  \n   图 6-37：修改图片尺寸\n\n4. 完成后，点击`Save`（保存）。\n\n### 编辑个人资料\n\n要编辑个人资料，请按以下步骤操作：\n\n\
  1. 点击浏览器右上角的个人资料照片进入个人资料页面，如图 6-38 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig38_HTML.jpg](img/437055_1_En_6_Fig38_HTML.jpg)\n\
  \n   图 6-38：编辑个人资料\n\n2. 点击浏览器右侧标签下方的`Edit`（编辑）按钮，如图 6-39 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig39_HTML.jpg](img/437055_1_En_6_Fig39_HTML.jpg)\n\
  \n   图 6-39：编辑按钮\n\n3. 您可以像在 Salesforce 中编辑任何字段一样，在此处编辑个人资料中的任意字段。让他人了解您的上级是谁，添加您在公司的职位名称，添加电话号码和手机号码，添加您的办公地点，当然，别忘了在`About\
  \ Me`（关于我）部分向其他用户简单介绍一下自己，如图 6-40 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig40_HTML.jpg](img/437055_1_En_6_Fig40_HTML.jpg)\n\
  \n   图 6-40：编辑个人资料\n\n4. 完成后，点击`Save`（保存）。\n\n### 更新封面照片\n\n要更新封面照片，请按以下步骤操作：\n\n\
  1. 点击`Edit`（编辑）按钮右上方的相机图标，点击“Select an image”（选择图片）按钮，在计算机上找到您的图片，然后点击`Open`（打开），如图\
  \ 6-41 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig41_HTML.jpg](img/437055_1_En_6_Fig41_HTML.jpg)\n\
  \n   图 6-41：上传横幅\n\n   **注意：** 您的照片必须存储在计算机上。照片格式须为 JPEG、GIF 或 PNG。为获得最佳效果，请使用至少\
  \ 1280×300 像素的全景图片。\n\n2. 调整照片以适配指定区域。如果发现照片不合适，可点击“Choose a different photo”（选择其他照片）上传新图片，如图\
  \ 6-42 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig42_HTML.jpg](img/437055_1_En_6_Fig42_HTML.jpg)\n\
  \n   图 6-42：修改横幅尺寸\n\n3. 完成后点击`Save`（保存）。\n\n   用户完成个人资料设置后，页面应如图 6-43 所示。\n\n \
  \  ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig43_HTML.jpg](img/437055_1_En_6_Fig43_HTML.jpg)\n\
  \n   图 6-43：完整的用户个人资料\n\n## 适用于 iPhone 和 Android 用户的 Salesforce 移动应用\n\n适用于 iPhone\
  \ 和 Android 用户的 Salesforce 移动应用包含在每个 Salesforce 许可证中，在大多数情况下，可以立即下载并使用，如图 6-44 所示。用户可从\
  \ App Store 或 Google Play 下载该应用并立即开始使用！Salesforce 可以开箱即用，因为它利用元数据来识别您在桌面环境中构建和配置的内容。但尽管如此，并非所有您自定义的内容都能在移动应用中轻松使用。您可能需要配置的一些更改是“快捷操作”项目，例如创建任务、记录通话、创建新潜在客户或联系人。或者您可能需要配置紧凑型布局，使用户能够看到记录的最重要细节，而非整个页面布局的字段。最后，移动导航功能允许您按用户友好的顺序放置操作和对象。确保\
  \ Salesforce 应用已配置并可供用户使用，这将有助于提高用户的工作效率。如果您的用户经常出差或在办公室外会见客户，Salesforce 移动应用可提供他们在办公室或通话时需要处理的记录。让您的用户能够使用移动应用，将帮助他们在离开办公桌时捕捉必要信息。此外，如果用户不在办公室，需要快速查找客户号码或地址，他们也可以使用移动应用来完成。\n\
  \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig44_HTML.jpg](img/437055_1_En_6_Fig44_HTML.jpg)\n\
  \n图 6-44：Salesforce 移动应用\n\n\n### 移动应用设置快速入门指南\n\nSalesforce 提供了一份关于设置移动应用的快速入门指南。\n\
