  \ Actions` 按钮，如图 6-48 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig48_HTML.jpg](img/437055_1_En_6_Fig48_HTML.jpg)\n\
  *图 6-48：排列全局操作*\n\n8.  使用两个区域之间的箭头，将必要的操作移动到 `Selected Global Actions` 区域，将不需要的操作移动到\
  \ `Available Items` 区域。通过拖放来调整操作显示的先后顺序，如图 6-49 所示。\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig49_HTML.jpg](img/437055_1_En_6_Fig49_HTML.jpg)\n\
  *图 6-49：修改操作顺序*\n\n9.  完成后点击 `Save & Next`。\n10. 点击 `Create Compact Layout` 按钮，如图\
