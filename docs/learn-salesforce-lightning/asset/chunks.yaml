- fmt: "# Creating Case Escalation Rules\n\nCase escalation rules allow you to create\
    \ automation for when a case will get escalated and what actions will take place\
    \ thereafter. Like the other rules that you have created in the previous section,\
    \ you’ll be able to determine when the case gets escalated based on field-level\
    \ criteria of the case. Once the field-level criteria are met, then you can set\
    \ actions such as sending a notification email, reassigning the case to another\
    \ user, and notifying that user. Figures [3-27](#437055_1_En_3_Chapter.xhtml#Fig27)\
    \ through [3-34](#437055_1_En_3_Chapter.xhtml#Fig34) show the setup. The steps\
    \ include the following:\n\n1.  Navigate to the Setup menu by clicking the settings\
    \ cog icon in the upper-right corner of the Salesforce window.\n\n2.  Using your\
    \ search area, enter **Escalation Rules**. Click `Escalation Rules` under Service.\n\
    \n3.  Click `New` to start the escalation rule.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig27_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig27_HTML.jpg)\n\
    \nFigure 3-27\n\nNavigating to the case escalation rules\n\n4.  Name the rule\
    \ and click `Save`. You can activate the rule now by selecting the `Active` check\
    \ box or hold off and activate it later.\n\n5.  Click `Save`.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig28_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig28_HTML.jpg)\n\
    \nFigure 3-28\n\nCreating your name for your case escalation rule\n\n6.  After\
    \ saving the rule name, it will return you to the case assignment area. Click\
    \ the rule name you just created.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig29_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig29_HTML.jpg)\n\
    \nFigure 3-29\n\nRetrieving your case escalation rule\n\n7.  Click the `New` button.\n\
    \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig30_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig30_HTML.jpg)\n\
    \nFigure 3-30\n\nCreating the criteria for your case escalation rule\n\n**Note** In\
    \ Figure [3-30](#437055_1_En_3_Chapter.xhtml#Fig30), notice the `Active` check\
    \ box; this is where you will activate the rule after you have completed it using\
    \ the `Active` check box.\n\n8.  If this is your first case escalation rule, type\
    \ the number **1** into the `Sort Order` field. If you have configured many, the\
    \ `Sort Order` field tells Salesforce which rule to run first. Once a rule runs\
    \ and executes the action, it will not run other rules on the same case. Assign\
    \ the sorting to all your rules according to importance.\n\n9.  In step 2 you\
    \ create the rule criteria. The rule criteria tells Salesforce that if the criteria\
    \ you enter here is true on the case, then it will send the email (steps 9 and\
    \ 10).\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig31_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig31_HTML.jpg)\n\
    \nFigure 3-31\n\nCreating your rule criteria for the case escalation rule\n\n\
    \    1.  To start this process, you’ll first need to click `None` in the field\
    \ column. Here you will select the field that Salesforce should evaluate for the\
    \ rule. This can be the case type, case reason, case organ, account, contact information,\
    \ or any field criteria found in the case, account, or contact.\n\n    2.  Choose\
    \ the appropriate operator. For instance, if you want every case type that equals\
    \ a specific value to automate the email, you would choose the operator “equals”\
    \ and select those values.\n\n    3.  Choose or enter the appropriate value or\
    \ outcome in which the case will autosend the email.\n\n    4.  You can also configure\
    \ your filter logic by clicking `Add Filter Logic`. This allows you to change\
    \ the logic from being “all” the field criteria (using “and”) to “or.” For example,\
    \ you can say if the case type is Problem OR the case origin is Email. The standard\
    \ setup would make that logic sentence be “If the case type is Problem AND the\
    \ case origin is Email.”\n\n10.  In step 3 you can choose a business hour to set\
    \ for this escalation.\n\n**Note** To choose business hours to set, you need to\
    \ have created this in Salesforce. In the Setup menu, search for *business hours*\
    \ for more information. By default, the business hours are set for 24 hours 7\
    \ days a week.\n\n11.  In step 4 you select how escalation times will be determined.\n\
    \    1.  You can select when the case is created, which will evaluate the criteria\
    \ only once when the case is created.\n    2.  You can select when the case is\
    \ created and disable it after the case is first modified. This option will check\
    \ your case’s criteria after the first time the case is modified (usually this\
    \ is after a user has started to handle it).\n    3.  You can select the last\
    \ modification time of the case. This will check the criteria of the case every\
    \ time a change is made to it. This will allow the escalation rule to be applied\
    \ when the case is modified.\n\n12.  Click `Save`.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig32_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig32_HTML.jpg)\n\
    \nFigure 3-32\n\nSelecting the business hours and when the case escalation rule\
    \ should run\n\n13.  Click the `New` button to start the creation of your actions.\n\
    \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig33_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig33_HTML.jpg)\n\
    \nFigure 3-33\n\nCreating your escalation rule action\n\n14.  For the `Age Over`\
    \ field, you determine the number of hours that a case with matching criteria\
    \ can be open before it escalates. You can change the drop-down to show single\
    \ minutes or adjust it for 30-minute increments.\n\n15.  Under “Choose one or\
    \ more of the following actions,” you can do the following:\n    1.  Choose to\
    \ have the case reassigned to another user or a queue. In the field next to “Auto-reassign\
    \ cases to,” choose an email template that will get sent to that user or the users\
    \ belonging to that queue.\n    2.  Choose who will get notified that a case has\
    \ escalated and select the template that should notify the user. Usually, this\
    \ is an individual in management.\n    3.  If you are not choosing to reassign\
    \ the case, you can at this time notify the current owner of the case that it\
    \ has escalated.\n    4.  In the `Additional Emails` field, choose in addition\
    \ to the previous setting if anyone else should receive a notice of the case escalating.\n\
    \n16.  When you have completed your action, click the `Save` button.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig34_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig34_HTML.jpg)\n\
    \nFigure 3-34\n\nSetting up the actions on your case escalation rule\n\n## Tip\n\
    \nYou can create one escalation rule with multiple actions, such as if you want\
    \ a particular case to be escalated after two hours of meeting the rule criteria.\
    \ Then if the case still isn’t closed four hours after that and you want to escalate\
    \ it again, you could set this up. All you would need to do is create another\
    \ action."
  raw: "### Creating Case Escalation Rules\n\nCase escalation rules allow you to create\
    \ automation for when a case will get escalated and what actions will take place\
    \ thereafter. Like the other rules that you have created in the previous section,\
    \ you’ll be able to determine when the case gets escalated based on field-level\
    \ criteria of the case. Once the field-level criteria are met, then you can set\
    \ actions such as sending a notification email, reassigning the case to another\
    \ user, and notifying that user. Figures [3-27](#437055_1_En_3_Chapter.xhtml#Fig27)\
    \ through [3-34](#437055_1_En_3_Chapter.xhtml#Fig34) show the setup. The steps\
    \ include the following:\n\n1.  Navigate to the Setup menu by clicking the settings\
    \ cog icon in the upper-right corner of the Salesforce window.\n\n2.  Using your\
    \ search area, enter **Escalation Rules**. Click Escalation Rules under Service.\n\
    \n3.  Click New to start the escalation rule.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig27_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig27_HTML.jpg)\n\
    \nFigure 3-27\n\nNavigating to the case escalation rules\n\n4.  Name the rule\
    \ and click Save. You can activate the rule now by selecting the Active check\
    \ box or hold off and activate it later.\n\n5.  Click Save.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig28_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig28_HTML.jpg)\n\
    \nFigure 3-28\n\nCreating your name for your case escalation rule\n\n6.  After\
    \ saving the rule name, it will return you to the case assignment area. Click\
    \ the rule name you just created.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig29_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig29_HTML.jpg)\n\
    \nFigure 3-29\n\nRetrieving your case escalation rule\n\n7.  Click the New button.\n\
    \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig30_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig30_HTML.jpg)\n\
    \nFigure 3-30\n\nCreating the criteria for your case escalation rule\n\n**Note** In\
