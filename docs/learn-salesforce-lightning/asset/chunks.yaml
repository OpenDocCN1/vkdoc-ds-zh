  trans: "### 上传个人资料照片\n\n要上传个人资料照片，请按以下步骤操作：\n\n1. 进入个人资料页面后，点击相机图标，然后点击`Update Photo`（更新照片），如图\
    \ 6-35 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig35_HTML.jpg](img/437055_1_En_6_Fig35_HTML.jpg)\n\
    \n   图 6-35：上传个人资料照片\n\n   **注意：** 您的照片必须存储在计算机上。照片格式须为 JPEG、GIF 或 PNG，文件大小不得超过\
    \ 16MB。\n\n2. 点击`Upload Image`（上传图片）按钮，从计算机中选择图片，如图 6-36 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig36_HTML.jpg](img/437055_1_En_6_Fig36_HTML.jpg)\n\
    \n   图 6-36：从计算机上传个人资料照片\n\n3. 使用滑块调整照片大小。如果您希望照片在 Salesforce 外部不可见，请勾选“在可公开访问的页面上显示我的照片”复选框，如图\
    \ 6-37 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig37_HTML.jpg](img/437055_1_En_6_Fig37_HTML.jpg)\n\
    \n   图 6-37：修改图片尺寸\n\n4. 完成后，点击`Save`（保存）。\n\n### 编辑个人资料\n\n要编辑个人资料，请按以下步骤操作：\n\
    \n1. 点击浏览器右上角的个人资料照片进入个人资料页面，如图 6-38 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig38_HTML.jpg](img/437055_1_En_6_Fig38_HTML.jpg)\n\
    \n   图 6-38：编辑个人资料\n\n2. 点击浏览器右侧标签下方的`Edit`（编辑）按钮，如图 6-39 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig39_HTML.jpg](img/437055_1_En_6_Fig39_HTML.jpg)\n\
    \n   图 6-39：编辑按钮\n\n3. 您可以像在 Salesforce 中编辑任何字段一样，在此处编辑个人资料中的任意字段。让他人了解您的上级是谁，添加您在公司的职位名称，添加电话号码和手机号码，添加您的办公地点，当然，别忘了在`About\
    \ Me`（关于我）部分向其他用户简单介绍一下自己，如图 6-40 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig40_HTML.jpg](img/437055_1_En_6_Fig40_HTML.jpg)\n\
    \n   图 6-40：编辑个人资料\n\n4. 完成后，点击`Save`（保存）。\n\n### 更新封面照片\n\n要更新封面照片，请按以下步骤操作：\n\
    \n1. 点击`Edit`（编辑）按钮右上方的相机图标，点击“Select an image”（选择图片）按钮，在计算机上找到您的图片，然后点击`Open`（打开），如图\
    \ 6-41 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig41_HTML.jpg](img/437055_1_En_6_Fig41_HTML.jpg)\n\
    \n   图 6-41：上传横幅\n\n   **注意：** 您的照片必须存储在计算机上。照片格式须为 JPEG、GIF 或 PNG。为获得最佳效果，请使用至少\
    \ 1280×300 像素的全景图片。\n\n2. 调整照片以适配指定区域。如果发现照片不合适，可点击“Choose a different photo”（选择其他照片）上传新图片，如图\
    \ 6-42 所示。\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig42_HTML.jpg](img/437055_1_En_6_Fig42_HTML.jpg)\n\
    \n   图 6-42：修改横幅尺寸\n\n3. 完成后点击`Save`（保存）。\n\n   用户完成个人资料设置后，页面应如图 6-43 所示。\n\n\
    \   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig43_HTML.jpg](img/437055_1_En_6_Fig43_HTML.jpg)\n\
    \n   图 6-43：完整的用户个人资料\n\n## 适用于 iPhone 和 Android 用户的 Salesforce 移动应用\n\n适用于 iPhone\
    \ 和 Android 用户的 Salesforce 移动应用包含在每个 Salesforce 许可证中，在大多数情况下，可以立即下载并使用，如图 6-44\
    \ 所示。用户可从 App Store 或 Google Play 下载该应用并立即开始使用！Salesforce 可以开箱即用，因为它利用元数据来识别您在桌面环境中构建和配置的内容。但尽管如此，并非所有您自定义的内容都能在移动应用中轻松使用。您可能需要配置的一些更改是“快捷操作”项目，例如创建任务、记录通话、创建新潜在客户或联系人。或者您可能需要配置紧凑型布局，使用户能够看到记录的最重要细节，而非整个页面布局的字段。最后，移动导航功能允许您按用户友好的顺序放置操作和对象。确保\
    \ Salesforce 应用已配置并可供用户使用，这将有助于提高用户的工作效率。如果您的用户经常出差或在办公室外会见客户，Salesforce 移动应用可提供他们在办公室或通话时需要处理的记录。让您的用户能够使用移动应用，将帮助他们在离开办公桌时捕捉必要信息。此外，如果用户不在办公室，需要快速查找客户号码或地址，他们也可以使用移动应用来完成。\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig44_HTML.jpg](img/437055_1_En_6_Fig44_HTML.jpg)\n\
    \n图 6-44：Salesforce 移动应用"
- fmt: '### Quick-Start Guide to Setting Up the Mobile App


    Salesforce offers a quick-start guide to setting up the mobile app.


    1.  Click the settings cog icon in the upper-right corner of the browser and click
    `Setup`.

    2.  In the `Quick Find` box, type in `Salesforce Mobile` and select the option
    `Salesforce mobile Quick Start`, as shown in Figure [6-45](#437055_1_En_6_Chapter.xhtml#Fig45).

    3.  Click the button `Launch Quick Start Wizard`.

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig45_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig45_HTML.jpg)

    *Figure 6-45: Launching the quick-start wizard for Salesforce mobile configuration*


    4.  Click the `Let’s Get Started` button, as shown in Figure [6-46](#437055_1_En_6_Chapter.xhtml#Fig46).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig46_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig46_HTML.jpg)

    *Figure 6-46: Getting started with the quick start*


    5.  You can remove or reorder items found on this navigation menu by clicking
    it and using the arrows in the middle or by dragging and dropping them into a
    new place, as shown in Figure [6-47](#437055_1_En_6_Chapter.xhtml#Fig47).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig47_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig47_HTML.jpg)

    *Figure 6-47: Modifying the navigation menu*


    6.  Once you are done with your navigation menu, click `Save & Next` at the lower-right
    corner of your screen.

    7.  Click the `Arrange Global Actions` button, as shown in Figure [6-48](#437055_1_En_6_Chapter.xhtml#Fig48).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig48_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig48_HTML.jpg)

    *Figure 6-48: Arranging the global actions*


    8.  Move actions that are necessary into the `Selected Global Actions` area and
    move ones that aren’t needed into the `Available Items` using the arrows provided
    between these two areas. Reorder what actions appear first by dragging and dropping
    them into place, as shown in Figure [6-49](#437055_1_En_6_Chapter.xhtml#Fig49).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig49_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig49_HTML.jpg)

    *Figure 6-49: Modifying the order of your actions*


    9.  Click `Save & Next` when you are complete.

    10.  Click the `Create Compact Layout` button, as shown in Figure [6-50](#437055_1_En_6_Chapter.xhtml#Fig50).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig50_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig50_HTML.jpg)

    *Figure 6-50: Configuring the contact compact layout*


    **Note:** Through the quick start, you can only create a compact layout for contact
    records. We’ll go over how to make compact layouts for other objects on the next
    page.


    11.  Move fields into the `Compact Layout for Contacts` area that you want displayed
    in your mobile app and move fields to the `Available Fields` section that you
    don’t want to include. Reorder the arrangement of the fields by dragging and dropping
    them into place, as shown in Figure [6-51](#437055_1_En_6_Chapter.xhtml#Fig51).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig51_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig51_HTML.jpg)

    *Figure 6-51: Modifying the order of the fields for your contact compact layout*


    12.  Click `Save & Next` when you are complete.

    13.  In step 4 you can review what you have arranged in this quick start by clicking
    `Navigation Menu`, `Global Actions`, and `Contact Compact Layout` to see what
    you created. Do you see that a change needs to be made? Click the `Edit` button
    to be taken to that edit screen and make the change, as shown in Figure [6-52](#437055_1_En_6_Chapter.xhtml#Fig52).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig52_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig52_HTML.jpg)

    *Figure 6-52: Reviewing what you’ve set up*


    14.  Click `Next` when you are complete.

    15.  If you are ready to invite your users, type in the names in the `To` field
    and customize your subject and message. Click `Send`, as shown in Figure [6-53](#437055_1_En_6_Chapter.xhtml#Fig53).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig53_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig53_HTML.jpg)

    *Figure 6-53: Inviting users to download the Salesforce mobile app*


    16.  Click `Next` when complete and `Finish`.


    ### Creating Compact Layouts


    In step 10 previously, we mentioned that you can create compact layouts for other
    objects as well. Here’s how:


    1.  Click the settings cog icon in the upper-right corner of the browser and click
    `Setup`.

    2.  Select the `Object Manager` tab found at the top next to the home tab.

    3.  Select the object that you want to configure a compact layout for and click
    the hyperlink name of that object, as shown in Figure [6-54](#437055_1_En_6_Chapter.xhtml#Fig54).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig54_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig54_HTML.jpg)

    *Figure 6-54: Navigating to the compact layout for an object*


    4.  On the left side, you’ll see various options and actions that can be made
    within this object. Select `Compact Layouts`, as shown in Figure [6-55](#437055_1_En_6_Chapter.xhtml#Fig55).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig55_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig55_HTML.jpg)

    *Figure 6-55: Selecting compact layouts*


    5.  Create a new compact layout by clicking `New`, as shown in Figure [6-56](#437055_1_En_6_Chapter.xhtml#Fig56).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig56_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig56_HTML.jpg)

    *Figure 6-56: Clicking the `New` button*


    6.  Create a label for your compact layout and hit your `Tab` key to automatically
    create the name. Move the field from the `Available Fields` area to the `Selected
    Fields` area using the arrows in between. Move the order in which a user sees
    the details up and down by using the arrows next to `Selected Fields`, as shown
    in Figure [6-57](#437055_1_En_6_Chapter.xhtml#Fig57).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig57_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig57_HTML.jpg)

    *Figure 6-57: Creating a compact layout*


    7.  Once complete, click `Save`.

    8.  Click the `Compact Layout Assignment` button, as shown in Figure [6-58](#437055_1_En_6_Chapter.xhtml#Fig58).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig58_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig58_HTML.jpg)

    *Figure 6-58: Complete compact layout*


    9.  Click the `Edit Assignment` button, as shown in Figure [6-59](#437055_1_En_6_Chapter.xhtml#Fig59).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig59_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig59_HTML.jpg)

    *Figure 6-59: `Edit Assignment` button*


    10.  Select from the drop-down the compact layout you created, as shown in Figure
    [6-60](#437055_1_En_6_Chapter.xhtml#Fig60).

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig60_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig60_HTML.jpg)

    *Figure 6-60: Selecting the compact layout*


    11.  Click `Save`.


    ## Summary


    As you can see, there are many ways for your users to interact with each other
    and with external customers in Salesforce. Collaboration in a business is key
    to getting sales closed and or projects/tasks moving forward. With the use of
    Chatter and Salesforce mobile app, your users have all the tools available to
    work throughout their day.'
