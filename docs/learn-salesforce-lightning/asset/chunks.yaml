  trans: '

    ### 创建案例自动回复规则


    案例自动回复规则允许你基于字段级更改，自动与客户进行沟通。例如，如果你希望在案例状态从一个值变为另一个值时向客户发送电子邮件，你可以实现此操作。任何字段值的变化都可以触发此邮件发送或其他自动化操作。图
    3-21 至 3-26 将引导你逐步创建案例自动回复规则。


    1.  点击 Salesforce 窗口右上角的设置齿轮图标，导航至 **设置** 菜单。


    2.  使用搜索区域，输入 **Case Auto-Response**。点击 `服务` 下的 `Case Auto-Response Rules`。


    3.  点击 `新建` 开始创建案例自动回复规则。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig21_HTML.jpg](img/437055_1_En_3_Fig21_HTML.jpg)


    图 3-21


    访问案例自动回复规则


    4.  为规则命名，然后点击 `保存`。你可以立即选中 `启用` 复选框来激活规则，或者暂不激活，稍后再进行操作。


    5.  点击 `保存`。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig22_HTML.jpg](img/437055_1_En_3_Fig22_HTML.jpg)


    图 3-22


    为你的案例自动回复规则命名


    6.  保存规则名称后，页面将返回到案例分配区域。点击你刚刚创建的规则名称。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig23_HTML.jpg](img/437055_1_En_3_Fig23_HTML.jpg)


    图 3-23


    检索你的案例自动回复规则


    7.  点击 `新建` 按钮。


    **注** 在图 3-24 中，请注意 `修改者` 字段上方的 `启用` 复选框。在这里，你可以在完成规则创建后，通过 `启用` 复选框来激活该规则。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig24_HTML.jpg](img/437055_1_En_3_Fig24_HTML.jpg)


    图 3-24


    为案例自动回复规则创建新的规则条件


    8.  如果这是你的第一个案例自动回复规则，请在 `排序顺序` 字段中输入数字 `1`。


    9.  在第二步中，你需要创建规则条件。规则条件告诉 Salesforce，如果在案例上满足你在此处输入的条件，则发送电子邮件（步骤 9 和 10）。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig25_HTML.jpg](img/437055_1_En_3_Fig25_HTML.jpg)


    图 3-25


    为你的案例自动回复规则创建条件


    1.  要开始此过程，你首先需要点击字段列中的 `无`。在此处，你将选择 Salesforce 应为规则评估的字段。这可以是案例类型、案例原因、案例来源、客户、联系人信息，或案例、客户、联系人中的任何字段条件。


    2.  选择合适的运算符。例如，如果你希望每个等于特定值的案例类型都能自动发送邮件，你可以选择 "等于" 运算符并选择那些值。


    3.  选择或输入案例将自动发送邮件的适当值或结果。


    4.  你也可以通过点击 `添加筛选逻辑` 来配置筛选逻辑。这允许你将逻辑从 "满足所有" 字段条件（使用 "且"）更改为 "或"。例如，你可以设置为如果案例类型为“问题”**或**案例来源为“电子邮件”。标准设置会使该逻辑语句变为
    "如果案例类型为问题**且**案例来源为电子邮件"。


    10.  在第三步中，你需要提供邮件发件人的名称。


    11.  在 `电子邮件地址` 字段中输入发件人的电子邮件地址。


    12.  提供一个回复地址，以便客户能够回复该邮件。


    **注** 你只能使用自己用户邮箱中的一个，或者设置为组织范围邮件的邮箱。


    13.  分配你希望为此自动回复规则发送的电子邮件模板。


    14.  完成第 1 步到第 4 步后，点击 `保存`。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig26_HTML.jpg](img/437055_1_En_3_Fig26_HTML.jpg)


    图 3-26


    设置邮件发件人信息及电子邮件模板

