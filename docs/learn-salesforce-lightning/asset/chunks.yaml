    \ your report by dragging and dropping fields into places of your choice. Save\
    \ and name the report and run!\n\n##### Building a Matrix Format Report\n\nFollow\
    \ these steps:\n\n1.  Once you are in the report builder, change the Tabular Format\
    \ drop-down to Matrix, as shown in Figure [5-60](#437055_1_En_5_Chapter.xhtml#Fig60).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig60_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig60_HTML.jpg)\n\
    \n    Figure 5-60\n\n    Switching your report format to a Matrix report format\n\
    \n2.  Notice for this report type you have two areas for grouping: at the columns\
    \ level and at the row level. Drag and drop the field of your choice onto either\
    \ of these grouping areas. You can add two groups on the column grouping level\
    \ and on the row grouping level, as shown in Figure [5-61](#437055_1_En_5_Chapter.xhtml#Fig61).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig61_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig61_HTML.jpg)\n\
    \n    Figure 5-61\n\n    Dragging and dropping the field into the grouping sections\
    \ of the report\n\n3.  Continue building your report by dragging and dropping\
    \ fields where you’d like. Save and name the report and run!\n\n#### Summarizing\
    \ Your Data\n\nYou can use the summarize feature on the number, currency, or percent\
    \ field data types in the report builder. The summarize feature allows you to\
    \ sum the data in a row, find the average of data in a row, find the minimum of\
    \ the data in a row, or find the maximum of the data in a row. Use this feature\
    \ in an opportunity report to find the average age of an opportunity or case.\
    \ Or use this feature to simply give you the sum of your amount fields on opportunities.\
    \ When you use this feature in a summary or matrix report, it will summarize on\
    \ all grouping levels and give you the grand total.\n\n1.  Once in your report\
    \ builder, click the down-facing arrow next to the field you want to summarize,\
    \ as shown in Figure [5-62](#437055_1_En_5_Chapter.xhtml#Fig62).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig62_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig62_HTML.jpg)\n\
    \n    Figure 5-62\n\n    Summarizing a field\n\n2.  Choose to sum, find the average,\
    \ find the max, or find the min and click Apply, as shown in Figure [5-63](#437055_1_En_5_Chapter.xhtml#Fig63).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig63_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig63_HTML.jpg)\n\
    \n    Figure 5-63\n\n    Choosing how you want to summarize a field\n\n3.  Don’t\
    \ forget to save and run your report.\n\n#### Adding Formulas to Reports\n\nYou\
    \ can add formulas to your reports to calculate the currency, number, or percent\
    \ fields from an object. The formula feature allows you to leverage your field\
    \ formats, summarize field data, use basic operators, use complex functions, and\
    \ use logic statements.\n\nThe operators for formulas include addition, subtraction,\
    \ multiplication, division, and exponentiation. The functions available include\
    \ logical statements, mathematical statements, or summary statements.\n\n1.  In\
    \ the left pane, drag Add Formula into the report and place it in a column position\
    \ of your choice, as shown in Figure [5-64](#437055_1_En_5_Chapter.xhtml#Fig64).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig64_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig64_HTML.jpg)\n\
    \n    Figure 5-64\n\n    Adding a formula field to your report\n\n2.  Name your\
    \ formula.\n\n3.  Add a description.\n\n4.  Adjust the format or decimal place\
    \ if necessary.\n\n5.  Choose what level to run this formula on.\n\n6.  Create\
    \ your formula using the operators or functions necessary.\n\n    **Note** Formulas\
    \ are for the advanced user. We will not be covering the various aspects of what\
    \ formulas to use in this book. However, Salesforce offers free support, and there\
    \ are great forums that can offer help as well.\n\n7.  Click Check Syntax for\
    \ complex formulas to ensure there are no errors.\n\n8.  Click OK to add the formula,\
    \ as shown in Figure [5-65](#437055_1_En_5_Chapter.xhtml#Fig65).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig65_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig65_HTML.jpg)\n\
    \n    Figure 5-65\n\n    Creating a formula field on your report\n\n9.  The formula\
    \ field appears as a column on the report, as shown in Figure [5-66](#437055_1_En_5_Chapter.xhtml#Fig66).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig66_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig66_HTML.jpg)\n\
    \n    Figure 5-66\n\n    The formula field appears as a column in your report"
  trans: "\n### 构建表格报表\n\n请按照以下步骤操作：\n\n1.  要构建表格报表，无需更改`Format`下拉菜单。只需根据需要将字段拖放到报表中即可。完成后，点击`Save`，命名报表，然后点击`Run`查看结果，如图\
    \ 5-55 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig55_HTML.jpg](img/437055_1_En_5_Fig55_HTML.jpg)\n\
    \n    图 5-55\n\n    将字段拖放到报表中\n\n2.  您也可以通过点击字段来选择表格报表的排序依据字段。请注意，当您点击字段时，该字段上会添加一个向上或向下的箭头。这表示该字段是按升序还是降序排列，如图\
    \ 5-56 所示。\n\n    **注意** 您可以像这样对所有报表类型进行排序。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig56_HTML.jpg](img/437055_1_En_5_Fig56_HTML.jpg)\n\
    \n    图 5-56\n\n    在报表中按字段排序\n\n### 构建摘要报表\n\n请按照以下步骤操作：\n\n1.  进入报表构建器后，将`Format`更改为\
    \ Summary 格式，如图 5-57 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig57_HTML.jpg](img/437055_1_En_5_Fig57_HTML.jpg)\n\
    \n    图 5-57\n\n    将报表格式更改为摘要报表格式\n\n2.  通过将字段拖放到`\"Drop a field here to create\
    \ a grouping\"`区域来为报表添加分组，如图 5-58 所示。\n\n    **注意** 此处最多可添加三个分组，此功能在矩阵报表格式中也可用。\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig58_HTML.jpg](img/437055_1_En_5_Fig58_HTML.jpg)\n\
    \n    图 5-58\n\n    将字段拖放到报表的分组区域\n\n3.  使用字段对报表进行分组后，您可以进一步定义日期数据类型字段的分组方式。例如，如果您按`Close\
    \ Date`字段分组，则可以更改为按`Calendar Month`分组，如图 5-59 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig59_HTML.jpg](img/437055_1_En_5_Fig59_HTML.jpg)\n\
    \n    图 5-59\n\n    定义报表的分组方式\n\n4.  继续构建报表，将字段拖放到您选择的位置。保存并命名报表，然后运行。\n\n###\
    \ 构建矩阵格式报表\n\n请按照以下步骤操作：\n\n1.  进入报表构建器后，将`Tabular Format`下拉菜单更改为`Matrix`，如图 5-60\
    \ 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig60_HTML.jpg](img/437055_1_En_5_Fig60_HTML.jpg)\n\
    \n    图 5-60\n\n    将报表格式切换为矩阵报表格式\n\n2.  请注意，此报表类型有两个分组区域：列级别和行级别。将您选择的字段拖放到任一分组区域中。您可以在列分组级别和行分组级别上各添加两个分组，如图\
    \ 5-61 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig61_HTML.jpg](img/437055_1_En_5_Fig61_HTML.jpg)\n\
    \n    图 5-61\n\n    将字段拖放到报表的分组区域中\n\n3.  继续构建报表，将字段拖放到您想要的位置。保存并命名报表，然后运行。\n\n\
    ### 汇总数据\n\n您可以在报表构建器中对数字、货币或百分比字段数据类型使用汇总功能。汇总功能允许您对行中的数据求和、求行中数据的平均值、求行中数据的最小值或求行中数据的最大值。在机会报表中使用此功能可以查找机会或案例的平均天数。或者使用此功能简单地获取机会中金额字段的总和。在摘要或矩阵报表中使用此功能时，它将在所有分组级别上进行汇总，并给出总计。\n\
    \n1.  进入报表构建器后，点击要汇总的字段旁边的向下箭头，如图 5-62 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig62_HTML.jpg](img/437055_1_En_5_Fig62_HTML.jpg)\n\
    \n    图 5-62\n\n    汇总一个字段\n\n2.  选择求和、求平均值、求最大值或求最小值，然后点击`Apply`，如图 5-63 所示。\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig63_HTML.jpg](img/437055_1_En_5_Fig63_HTML.jpg)\n\
    \n    图 5-63\n\n    选择汇总字段的方式\n\n3.  不要忘记保存并运行您的报表。\n\n### 向报表添加公式\n\n您可以向报表添加公式，以计算对象中的货币、数字或百分比字段。公式功能允许您利用字段格式、汇总字段数据、使用基本运算符、使用复杂函数以及使用逻辑语句。\n\
    \n公式的运算符包括加法、减法、乘法、除法和幂运算。可用的函数包括逻辑语句、数学语句或汇总语句。\n\n1.  在左侧窗格中，将`Add Formula`拖入报表，并将其放置在您选择的列位置，如图\
    \ 5-64 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig64_HTML.jpg](img/437055_1_En_5_Fig64_HTML.jpg)\n\
    \n    图 5-64\n\n    向报表添加公式字段\n\n2.  为您的公式命名。\n\n3.  添加描述。\n\n4.  如有必要，调整格式或小数位数。\n\
    \n5.  选择在哪个级别上运行此公式。\n\n6.  使用必要的运算符或函数创建公式。\n\n    **注意** 公式面向高级用户。本书不会涵盖要使用哪些公式的各个方面。但是，Salesforce\
    \ 提供免费支持，并且有很棒的论坛也可以提供帮助。\n\n7.  对于复杂公式，点击`Check Syntax`以确保没有错误。\n\n8.  点击`OK`添加公式，如图\
    \ 5-65 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig65_HTML.jpg](img/437055_1_En_5_Fig65_HTML.jpg)\n\
    \n    图 5-65\n\n    在报表上创建公式字段\n\n9.  公式字段作为报表中的一列出现，如图 5-66 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig66_HTML.jpg](img/437055_1_En_5_Fig66_HTML.jpg)\n\
    \n    图 5-66\n\n    公式字段作为一列显示在您的报表中\n"
- fmt: "### Exporting Reports\n\nYou can export the data from any report you create\
    \ in Salesforce to a spreadsheet. This allows you to take it into Excel for further\
    \ analysis. Salesforce offers two types of exportable formats: the Excel format\
    \ `.xls` and the comma-delimited `.csv`. `.xls` is compatible with Excel and most\
    \ spreadsheet software. `.csv` is compatible with a wider range of software programs\
    \ and comes with limited formatting.\n\n1. Open your desired report; in the right\
    \ corner click the down-facing arrow next to the word *Edit* and select Export,\
    \ as shown in Figure [5-67](#437055_1_En_5_Chapter.xhtml#Fig67).\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig67_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig67_HTML.jpg)\n\
    \n   Figure 5-67\n\n   Exporting a report\n\n2. Choose the format that supports\
    \ your company software and select Export, as shown in Figure [5-68](#437055_1_En_5_Chapter.xhtml#Fig68).\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig68_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig68_HTML.jpg)\n\
    \n   Figure 5-68\n\n   Selecting the export format and exporting the data\n\n\
    ### Creating Report Charts\n\nYou can create report charts for your reports in\
    \ Salesforce. Report charts allow you to see your data in a graphical format for\
    \ easy and quick review of your data. Reports and report charts have a one-to-one\
    \ ratio: only one chart can be used in one report. Should you want to see several\
    \ variations of your report, you can clone your report or, better yet, put them\
    \ in a dashboard (shown in Figure [5-79](#437055_1_En_5_Chapter.xhtml#Fig79)).\
    \ Report charts can be used only in Summary or Matrix format reports. You can\
    \ create horizontal and vertical bar charts, stacked horizontal and vertical bar\
    \ charts, line charts, donut charts, funnel chart, and scatter charts.\n\n1. Go\
    \ to your Reports tab and select the report of your choice, as shown in Figure\
    \ [5-69](#437055_1_En_5_Chapter.xhtml#Fig69).\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig69_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig69_HTML.jpg)\n\
    \n   Figure 5-69\n\n   Retrieving a report\n\n2. Click the chart symbol next to\
    \ the filter symbol, as shown in Figure [5-70](#437055_1_En_5_Chapter.xhtml#Fig70).\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig70_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig70_HTML.jpg)\n\
    \n   Figure 5-70\n\n   Clicking the chart icon\n\n3. Based on your report and\
    \ how your data is put together, Salesforce will display a recommended report.\
    \ You can change this if needed; click the settings cog icon, as shown in Figure\
    \ [5-71](#437055_1_En_5_Chapter.xhtml#Fig71).\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig71_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig71_HTML.jpg)\n\
    \n   Figure 5-71\n\n   Selecting the Setup icon for the chart\n\n4. Change the\
    \ Display As section to reflect the type of report chart you would like to see,\
    \ as shown in Figure [5-72](#437055_1_En_5_Chapter.xhtml#Fig72).\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig72_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig72_HTML.jpg)\n\
    \n   Figure 5-72\n\n   Choosing the type of chart\n\n5. Adjust the chart attributes\
    \ within the chart editor; add a chart title, change the *x*-axis to another field,\
    \ add items like a dimension or second axis, choose to show the values on the\
    \ report chart or not, and choose if a legend should appear on the right or bottom\
    \ of the chart, as shown in Figure [5-73](#437055_1_En_5_Chapter.xhtml#Fig73).\n\
    \n   **Note** Some features are available only on specific report charts.\n\n\
    \   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig73_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig73_HTML.jpg)\n\
    \n   Figure 5-73\n\n   Customizing your report chart attributes\n\nAfter you have\
    \ configured your report chart, don’t forget to save your work and see your results,\
    \ as in Figure [5-74](#437055_1_En_5_Chapter.xhtml#Fig74).\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig74_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig74_HTML.jpg)\n\
    \nFigure 5-74\n\nFinishing result of a report chart\n\n## Understanding Dashboards\n\
    \nDashboards are visual representations of the reports you have already created.\
    \ Dashboards can represent multiple dashboard components (individual charts and\
    \ graphs). You can display one report in multiple dashboard components; you can’t\
    \ display multiple reports into one dashboard component. For example, if you have\
    \ one report that represents your sales by each user, you can display this one\
    \ report in two dashboard components, such as a pie chart and bar chart. You can\
    \ create horizontal and vertical bar charts, stacked horizontal and vertical bar\
    \ charts, line charts, donut charts, funnel charts, metric charts, gauge charts,\
    \ table charts, and scatter charts.\n\n### Creating a Dashboard, Adding Dashboard\
    \ Components, and Modifying Your Dashboard\n\nFollow these steps:\n\n1. Click\
    \ your Dashboards tab and click New Dashboard, as shown in Figure [5-75](#437055_1_En_5_Chapter.xhtml#Fig75).\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig75_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig75_HTML.jpg)\n\
    \n   Figure 5-75\n\n   Creating a new dashboard\n\n2. Name your dashboard.\n\n\
    3. Add a description.\n\n4. Choose whether your dashboard is a public or private\
    \ dashboard.\n\n5. Click Create, as shown in Figure [5-76](#437055_1_En_5_Chapter.xhtml#Fig76).\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig76_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig76_HTML.jpg)\n\
    \n   Figure 5-76\n\n   Naming and creating your dashboard\n\n6. Click Component\
    \ in the upper-right corner to add a report you’ve already created to the dashboard,\
    \ as shown in Figure [5-77](#437055_1_En_5_Chapter.xhtml#Fig77).\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig77_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig77_HTML.jpg)\n\
    \n   Figure 5-77\n\n   Adding a new report and chart component to your dashboard\n\
    \n7. Search the report you want to add to the dashboard, as shown in Figure [5-78](#437055_1_En_5_Chapter.xhtml#Fig78).\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig78_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig78_HTML.jpg)\n\
    \n   Figure 5-78\n\n   Finding the report for your dashboard component\n\n8. Choose\
    \ the chart you want to display your data in and modify any attributes to better\
    \ display your data. Once finished, click Add, as shown in Figure [5-79](#437055_1_En_5_Chapter.xhtml#Fig79).\n\
    \n   **Note** As you make changes to these attributes, watch the preview of the\
    \ report to see how these changes affect the display.\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig79_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig79_HTML.jpg)\n\
    \n   Figure 5-79\n\n   Creating the chart to go with your report on your dashboard\n\
    \n9. Click the dashboard report and drag the corners out to make your report bigger,\
    \ or click the dashboard and move the report to another location on the dashboard,\
    \ as shown in Figure [5-80](#437055_1_En_5_Chapter.xhtml#Fig80).\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig80_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig80_HTML.jpg)\n\
    \n   Figure 5-80\n\n   Modifying the size of your report and chart\n\n10. Continue\
    \ steps 6 to 9 until you are satisfied with your dashboard.\n\n11. Click Save\
    \ when you complete or to save your work, as shown in Figure [5-81](#437055_1_En_5_Chapter.xhtml#Fig81).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig81_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig81_HTML.jpg)\n\
    \n    Figure 5-81\n\n    Saving your dashboard"
  raw: "#### Exporting Reports\n\nYou can export the data from any report you create\
    \ in Salesforce to a spreadsheet. This allows you to take it into Excel for further\
    \ analysis. Salesforce offers two types of exportable formats: the Excel format\
    \ `.xls` and the comma-delimited `.csv`. XLS is compatible with Excel and most\
    \ spreadsheet software. CSV is compatible with a wider range of software programs\
    \ and comes with limited formatting.\n\n1.  Open your desired report; in the right\
    \ corner click the down-facing arrow next to the word *Edit* and select Export,\
    \ as shown in Figure [5-67](#437055_1_En_5_Chapter.xhtml#Fig67).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig67_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig67_HTML.jpg)\n\
    \n    Figure 5-67\n\n    Exporting a report\n\n2.  Choose the format that supports\
    \ your company software and select Export, as shown in Figure [5-68](#437055_1_En_5_Chapter.xhtml#Fig68).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig68_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig68_HTML.jpg)\n\
    \n    Figure 5-68\n\n    Selecting the export format and exporting the data\n\n\
    #### Creating Report Charts\n\nYou can create report charts for your reports in\
    \ Salesforce. Report charts allow you to see your data in a graphical format for\
    \ easy and quick review of your data. Reports and report charts have a one-to-one\
    \ ratio: only one chart can be used in one report. Should you want to see several\
    \ variations of your report, you can clone your report or, better yet, put them\
    \ in a dashboard (shown in Figure [5-79](#437055_1_En_5_Chapter.xhtml#Fig79)).\
    \ Report charts can be used only in Summary or Matrix format reports. You can\
    \ create horizontal and vertical bar charts, stacked horizontal and vertical bar\
    \ charts, line charts, donut charts, funnel chart, and scatter charts.\n\n1. \
    \ Go to your Reports tab and select the report of your choice, as shown in Figure\
    \ [5-69](#437055_1_En_5_Chapter.xhtml#Fig69).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig69_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig69_HTML.jpg)\n\
    \n    Figure 5-69\n\n    Retrieving a report\n\n2.  Click the chart symbol next\
    \ to the filter symbol, as shown in Figure [5-70](#437055_1_En_5_Chapter.xhtml#Fig70).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig70_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig70_HTML.jpg)\n\
    \n    Figure 5-70\n\n    Clicking the chart icon\n\n3.  Based on your report and\
    \ how your data is put together, Salesforce will display a recommended report.\
    \ You can change this if needed; click the settings cog icon, as shown in Figure\
    \ [5-71](#437055_1_En_5_Chapter.xhtml#Fig71).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig71_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig71_HTML.jpg)\n\
    \n    Figure 5-71\n\n    Selecting the Setup icon for the chart\n\n4.  Change\
    \ the Display As section to reflect the type of report chart you would like to\
    \ see, as shown in Figure [5-72](#437055_1_En_5_Chapter.xhtml#Fig72).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig72_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig72_HTML.jpg)\n\
    \n    Figure 5-72\n\n    Choosing the type of chart\n\n5.  Adjust the chart attributes\
    \ within the chart editor; add a chart title, change the *x*-axis to another field,\
    \ add items like a dimension or second axis, choose to show the values on the\
    \ report chart or not, and choose if a legend should appear on the right or bottom\
    \ of the chart, as shown in Figure [5-73](#437055_1_En_5_Chapter.xhtml#Fig73).\n\
    \n    **Note** Some features are available only on specific report charts.\n\n\
    \    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig73_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig73_HTML.jpg)\n\
    \n    Figure 5-73\n\n    Customizing your report chart attributes\n\nAfter you\
    \ have configured your report chart, don’t forget to save your work and see your\
    \ results, as in Figure [5-74](#437055_1_En_5_Chapter.xhtml#Fig74).\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig74_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig74_HTML.jpg)\n\
    \nFigure 5-74\n\nFinishing result of a report chart\n\n## Understanding Dashboards\n\
    \nDashboards are visual representations of the reports you have already created.\
    \ Dashboards can represent multiple dashboard components (individual charts and\
    \ graphs). You can display one report in multiple dashboard components; you can’t\
    \ display multiple reports into one dashboard component. For example, if you have\
    \ one report that represents your sales by each user, you can display this one\
    \ report in two dashboard components, such as a pie chart and bar chart. You can\
    \ create horizontal and vertical bar charts, stacked horizontal and vertical bar\
    \ charts, line charts, donut charts, funnel charts, metric charts, gauge charts,\
    \ table charts, and scatter charts.\n\n### Creating a Dashboard, Adding Dashboard\
    \ Components, and Modifying Your Dashboard\n\nFollow these steps:\n\n1.  Click\
    \ your Dashboards tab and click New Dashboard, as shown in Figure [5-75](#437055_1_En_5_Chapter.xhtml#Fig75).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig75_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig75_HTML.jpg)\n\
    \n    Figure 5-75\n\n    Creating a new dashboard\n\n2.  Name your dashboard.\n\
    \n3.  Add a description.\n\n4.  Choose whether your dashboard is a public or private\
    \ dashboard.\n\n5.  Click Create, as shown in Figure [5-76](#437055_1_En_5_Chapter.xhtml#Fig76).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig76_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig76_HTML.jpg)\n\
    \n    Figure 5-76\n\n    Naming and creating your dashboard\n\n6.  Click Component\
    \ in the upper-right corner to add a report you’ve already created to the dashboard,\
    \ as shown in Figure [5-77](#437055_1_En_5_Chapter.xhtml#Fig77).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig77_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig77_HTML.jpg)\n\
    \n    Figure 5-77\n\n    Adding a new report and chart component to your dashboard\n\
    \n7.  Search the report you want to add to the dashboard, as shown in Figure [5-78](#437055_1_En_5_Chapter.xhtml#Fig78).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig78_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig78_HTML.jpg)\n\
    \n    Figure 5-78\n\n    Finding the report for your dashboard component\n\n8.\
    \  Choose the chart you want to display your data in and modify any attributes\
    \ to better display your data. Once finished, click Add, as shown in Figure [5-79](#437055_1_En_5_Chapter.xhtml#Fig79).\n\
    \n    **Note** As you make changes to these attributes, watch the preview of the\
    \ report to see how these changes affect the display.\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig79_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig79_HTML.jpg)\n\
    \n    Figure 5-79\n\n    Creating the chart to go with your report on your dashboard\n\
    \n9.  Click the dashboard report and drag the corners out to make your report\
    \ bigger, or click the dashboard and move the report to another location on the\
    \ dashboard, as shown in Figure [5-80](#437055_1_En_5_Chapter.xhtml#Fig80).\n\n\
    \    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig80_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig80_HTML.jpg)\n\
    \n    Figure 5-80\n\n    Modifying the size of your report and chart\n\n10.  Continue\
    \ steps 6 to 9 until you are satisfied with your dashboard.\n\n11.  Click Save\
    \ when you complete or to save your work, as shown in Figure [5-81](#437055_1_En_5_Chapter.xhtml#Fig81).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig81_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig81_HTML.jpg)\n\
    \n    Figure 5-81\n\n    Saving your dashboard"
  trans: "\n### 导出报告\n\n您可以将 Salesforce 中创建的任何报告数据导出到电子表格，以便在 Excel 中进行进一步分析。Salesforce\
    \ 提供两种可导出的格式：Excel 格式 `.xls` 和逗号分隔的 `.csv`。`.xls` 兼容 Excel 和大多数电子表格软件。`.csv` 兼容性更广，但格式有限。\n\
    \n1.  打开您要导出的报告；在右侧角落点击 *编辑* 一词旁边的向下箭头，然后选择“导出”，如图 5-67 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig67_HTML.jpg](img/437055_1_En_5_Fig67_HTML.jpg)\n\
    \n    图 5-67\n\n    导出报告\n\n2.  选择支持您公司软件的格式，然后选择“导出”，如图 5-68 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig68_HTML.jpg](img/437055_1_En_5_Fig68_HTML.jpg)\n\
    \n    图 5-68\n\n    选择导出格式并导出数据\n\n### 创建报告图表\n\n您可以在 Salesforce 中为报告创建图表。报告图表允许您以图形格式查看数据，便于快速查看。报告和报告图表是一一对应的：一份报告只能使用一个图表。如果您希望查看报告的多种变体，可以克隆报告，或者更好的方法是将它们放入仪表板（如图\
    \ 5-79 所示）。报告图表只能用于摘要或矩阵格式的报告。您可以创建水平柱状图和垂直柱状图、堆叠水平柱状图和垂直柱状图、折线图、环形图、漏斗图和散点图。\n\
    \n1.  转到“报告”选项卡，选择您想要的报告，如图 5-69 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig69_HTML.jpg](img/437055_1_En_5_Fig69_HTML.jpg)\n\
    \n    图 5-69\n\n    检索报告\n\n2.  点击筛选符号旁边的图表符号，如图 5-70 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig70_HTML.jpg](img/437055_1_En_5_Fig70_HTML.jpg)\n\
    \n    图 5-70\n\n    点击图表图标\n\n3.  根据您的报告和数据组合方式，Salesforce 会显示一个推荐图表。如果需要，您可以更改此设置；点击设置齿轮图标，如图\
    \ 5-71 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig71_HTML.jpg](img/437055_1_En_5_Fig71_HTML.jpg)\n\
    \n    图 5-71\n\n    选择图表的设置图标\n\n4.  更改“显示为”部分，以反映您想要查看的报告图表类型，如图 5-72 所示。\n\n\
    \    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig72_HTML.jpg](img/437055_1_En_5_Fig72_HTML.jpg)\n\
    \n    图 5-72\n\n    选择图表类型\n\n5.  在图表编辑器中调整图表属性；添加图表标题，将 *x* 轴更改为另一个字段，添加维度或第二轴等项目，选择是否在报告图表上显示数值，并选择图例应显示在图表右侧还是底部，如图\
    \ 5-73 所示。\n\n    **注意** 某些功能仅适用于特定的报告图表。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig73_HTML.jpg](img/437055_1_En_5_Fig73_HTML.jpg)\n\
    \n    图 5-73\n\n    自定义报告图表属性\n\n配置完成后，不要忘记保存您的工作并查看结果，如图 5-74 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig74_HTML.jpg](img/437055_1_En_5_Fig74_HTML.jpg)\n\
    \n图 5-74\n\n报告图表的最终结果\n\n## 了解仪表板\n\n仪表板是您已创建报告的可视化呈现。仪表板可以表示多个仪表板组件（单个图表和图形）。您可以在多个仪表板组件中显示一份报告；但不能将一个报告信息拆分到多个仪表板组件中。例如，如果您有一份显示每个用户销售额的报告，您可以将这同一份报告显示在两个仪表板组件中，例如饼图和柱状图。您可以创建水平柱状图和垂直柱状图、堆叠水平柱状图和垂直柱状图、折线图、环形图、漏斗图、指标图、仪表图、表格图和散点图。\n\
    \n### 创建仪表板、添加仪表板组件以及修改仪表板\n\n请按照以下步骤操作：\n\n1.  点击“仪表板”选项卡，然后点击“新建仪表板”，如图 5-75\
    \ 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig75_HTML.jpg](img/437055_1_En_5_Fig75_HTML.jpg)\n\
    \n    图 5-75\n\n    创建新仪表板\n\n2.  为您的仪表板命名。\n\n3.  添加描述。\n\n4.  选择您的仪表板是公共还是私有。\n\
    \n5.  点击“创建”，如图 5-76 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig76_HTML.jpg](img/437055_1_En_5_Fig76_HTML.jpg)\n\
    \n    图 5-76\n\n    命名并创建仪表板\n\n6.  点击右上角的“组件”将您已创建的报告添加到仪表板，如图 5-77 所示。\n\n \
    \   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig77_HTML.jpg](img/437055_1_En_5_Fig77_HTML.jpg)\n\
    \n    图 5-77\n\n    向仪表板添加新报告和图表组件\n\n7.  搜索您想要添加到仪表板的报告，如图 5-78 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig78_HTML.jpg](img/437055_1_En_5_Fig78_HTML.jpg)\n\
    \n    图 5-78\n\n    查找仪表板组件的报告\n\n8.  选择您要用来显示数据的图表，并修改任何属性以更好地展示数据。完成后，点击“添加”，如图\
    \ 5-79 所示。\n\n    **注意** 在修改这些属性时，请注意预览报告的变化。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig79_HTML.jpg](img/437055_1_En_5_Fig79_HTML.jpg)\n\
    \n    图 5-79\n\n    在仪表板上为报告创建配套图表\n\n9.  点击仪表板报告并拖拽边角以放大报告，或者点击仪表板并将报告移动到仪表板上的其他位置，如图\
    \ 5-80 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig80_HTML.jpg](img/437055_1_En_5_Fig80_HTML.jpg)\n\
    \n    图 5-80\n\n    修改报告和图表的大小\n\n10. 重复步骤 6 到 9，直到对仪表板满意为止。\n\n11. 完成后点击“保存”以保存您的工作，如图\
    \ 5-81 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig81_HTML.jpg](img/437055_1_En_5_Fig81_HTML.jpg)\n\
    \n    图 5-81\n\n    保存仪表板\n"
- fmt: "# Using Dynamic Dashboards\n\nDynamic dashboards allow each user to see the\
    \ data that they have access to based on their security and sharing settings.\
    \ This allows you to create one dashboard that every user can have access to.\
    \ After you have created your dashboard, you can access the properties and make\
    \ this modification or use the other two accesses for users. You can set a dashboard\
    \ to be viewed as `Me`, which allows dashboard readers to see data in the dashboard\
    \ according to your access to the data. You can select the option \"A specified\
    \ user,\" which allows users to see data based on the selected user's access.\
    \ Lastly, you can use \"The logged in user,\" which allows users to see data based\
    \ on their access. Additionally, you can prevent users from changing how the dashboard\
    \ is viewed by deselecting \"Allow Dashboard views to change this (dynamic dashboard).\"\
    \n\nBusinesses choose a dynamic dashboard over a nondynamic one when they are\
    \ trying to prevent users from seeing data that they shouldn't. For instance,\
    \ a business may have many sales users. With these sales users, there are many\
    \ territories. If you don't want the salesperson responsible for California to\
    \ see the sales data for New York, you could use the option \"The logged in user.\"\
    \ (Granted, you must have set up your security to prevent this from happening,\
    \ which is covered in Chapter [9](#437055_1_En_9_Chapter.xhtml).) If having the\
    \ user's data restricted is not an issue for your company, you can leave the settings\
    \ as is.\n\nLet's take a look at how you can modify this:\n\n1.  Click the settings\
    \ cog icon in the right corner of the dashboard, as shown in Figure [5-82](#437055_1_En_5_Chapter.xhtml#Fig82).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig82_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig82_HTML.jpg)\n\
    \n    Figure 5-82\n    Creating a dynamic dashboard\n\n2.  Select what view you\
    \ would like to set the dashboard as.\n\n3.  Select or deselect if the user should\
    \ be able to change this.\n\n4.  Click Save, as shown in Figure [5-83](#437055_1_En_5_Chapter.xhtml#Fig83).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig83_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig83_HTML.jpg)\n\
    \n    Figure 5-83\n    Selecting the view of the dashboard\n\n## Summary\n\nOne\
    \ of the greatest benefits of having Salesforce as your client relationship management\
    \ tool is the reports that can be generated from the data collected. Being able\
    \ to calculate your return on investment (ROI) or how your sales team is doing\
    \ will help you in the months and years of your business to come. The best thing\
    \ about reports and dashboards is that you can't mess your data up using them.\
    \ Don't be afraid to click around and play with them. You are only translating\
    \ data; you can't mess it up!\n\n# 6. Collaborating\n\nSalesforce offers many\
    \ collaboration tools. One valuable collaboration tool offered is called Chatter.\
    \ This tool and its capabilities can be found on a significant number of standard\
    \ objects and all custom objects in Salesforce. It allows your users to communicate\
    \ with each other via internal messaging. You can even allow your users to share\
    \ files such as Word and PowerPoint files with each other and your customers using\
    \ content deliveries. Do you need to share your Salesforce records with another\
    \ Salesforce organization? You can use Lightning Connect and sync data to the\
    \ other Salesforce organization. You can enable *topics*, which allow your users\
    \ to interact on specific topics with each other. We can't forget about the Salesforce\
    \ mobile app, Salesforce, that allows your users to be on-the-go for iPhone and\
    \ Android users. Figure [6-1](#437055_1_En_6_Chapter.xhtml#Fig1) shows the Chatter\
    \ object.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig1_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig1_HTML.jpg)\n\
    \nFigure 6-1\nChatter tool\n\n## Understanding Chatter\n\nSalesforce Chatter is\
    \ an essential tool that can be used to help you collaborate internally with co-workers\
    \ and externally with clients. You can use the Chatter feature post, which allows\
    \ you to post messages to other users or post messages on a record itself about\
    \ that record. Give your employees the ability to post a question that needs an\
    \ answer to your management team. Or collect information from your employees via\
    \ an anonymous poll. Chatter has a number of great built-in tools that can be\
    \ used in various ways. Let's look into some of these tools further.\n\n## Sidebar\n\
    \nThe sidebar on the Chatter tab gives you quick access to Chatter features (Figure\
    \ [6-2](#437055_1_En_6_Chapter.xhtml#Fig2)). Use the `What I Follow` link to quickly\
    \ see all Chatter posts corresponding to all the records that users follow in\
    \ Salesforce (more on this feature in a bit). Use the `To Me` link to see any\
    \ post that a user directed at you using the `@` symbol or any post that was left\
    \ on your profile from another user. Use `Bookmarked` to see any post you have\
    \ bookmarked. The `Company Highlights` quick-access link uses Einstein's artificial\
    \ intelligence (AI) to bring you all the trending topics in your organization.\
    \ The `Streams` quick-access link allows you to create quick-access links to records.\
    \ Use this section to see all accounts, cases, contacts, and more that you follow.\
    \ `Recent Groups` allows you to create and see the latest groups you have followed.\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig2_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig2_HTML.jpg)\n\
    \nFigure 6-2\nChatter sidebar\n\n### Following in Chatter\n\nFollowing is a powerful\
    \ tool available in Salesforce. You can follow anything from people to groups\
    \ to records. Following allows you to see all the relevant content and interactions\
    \ that have happened to the record you choose to follow. Following in Chatter\
    \ is comparable to following someone on Twitter. Want to see everything your training\
    \ instructor is posting on Salesforce? Go to their profile and click the `+ Follow`\
    \ button. If you have a stream set up for that object, you can choose to add this\
    \ record to the stream or to just use `What I Follow`. If you are viewing your\
    \ Chatter feed, hover over the name of another user and use the `Follow` button\
    \ here. Find the `Follow` button at the top of any record, as shown in Figure\
    \ [6-3](#437055_1_En_6_Chapter.xhtml#Fig3). Following brings the content and posts\
    \ into your Chatter feed and allows you to interact right from your feed.\n\n\
    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig3_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig3_HTML.jpg)\n\
    \nFigure 6-3\nFollowing in Chatter\n\n### Bookmarking a Post\n\nYou can bookmark\
    \ a post just like you would bookmark a web site. If you want to save this post\
    \ for later use and have it appear in your `Bookmarked` quick-access list in Chatter,\
    \ all you'll need to do is click the down-facing arrow to the right of the post\
    \ and click `Bookmark` (Figure [6-4](#437055_1_En_6_Chapter.xhtml#Fig4)). Notice\
    \ that a yellow triangle with a star appears next to the arrow. Remove the bookmark\
    \ the same way except choose `Remove Bookmark` in the drop-down.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig4_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig4_HTML.jpg)\n\
    \nFigure 6-4\nBookmarking a post"
