- fmt: "## Duplicating Data Management\n\nAnother great feature in Salesforce is the\
    \ ability to set up duplicate rules. Duplicate rules allow you to create criteria\
    \ that will be checked against any new account, contact, or lead and prevent a\
    \ user from creating a duplicate record. Salesforce comes out of the box with\
    \ the following duplicate rules:\n\n- **Standard Account Duplicate Rule**: Will\
    \ verify if the new account being created matches any of the following combinations\
    \ of account fields to an existing account:\n    1. `Account Name` and `Billing\
    \ Street`\n    2. `Account Name` and `City` and `State`\n    3. `Account Name`\
    \ and `Zip Code`\n    4. `Account Name` and `Phone`\n    5. `Account Website`\
    \ and `Phone`\n    6. `Account Website` and `Billing Street`\n\n- **Standard Contact\
    \ Duplicate Rule**: Will verify if the new contact being created matches any of\
    \ the following combinations of contact fields to an existing contact:\n    1.\
    \ `First Name` and `Last Name` and `Title` and `Account Name`\n    2. `First Name`\
    \ and `Last Name` and `Email`\n    3. `First Name` and `Last Name` and `Phone`\
    \ and `Company Name`\n    4. `First Name` and `Last Name` and `Mailing Street`\
    \ and (`City` or `Zip Code` or `Phone`)\n    5. `First Name` and `Last Name` and\
    \ `Mailing Street` and `Title`\n    6. `First Name` and `Last Name` and `Title`\
    \ and `Email`\n    7. `First Name` and `Last Name` and `Phone`\n\n- **Standard\
    \ Lead Duplicate Rule**: Will verify if the new lead being created matches any\
    \ of the following combinations of lead fields to an existing lead:\n    1. `First\
    \ Name` and `Last Name` and `Title` and `Account Name`\n    2. `First Name` and\
    \ `Last Name` and `Email`\n    3. `First Name` and `Last Name` and `Phone` and\
    \ `Company Name`\n    4. `First Name` and `Last Name` and `Mailing Street` and\
    \ (`City` or `Zip Code` or `Phone`)\n    5. `First Name` and `Last Name` and `Mailing\
    \ Street` and `Title`\n    6. `First Name` and `Last Name` and `Title` and `Email`\n\
    \    7. `First Name` and `Last Name` and `Phone`\n\nIf the standard rules don’t\
    \ work for your company, you can also create your own. For example, perhaps you\
    \ have another combination of fields that would work better for account duplication\
    \ rules. Maybe your business can match an account based on the `Account Name`\
    \ and a custom field you are collecting. To create a new rule, follow these steps:\n\
    \n1. Go to your Setup menu and search for **Duplicate Rules**. Click **Duplicate\
    \ Rules**, as shown in Figure 8-52.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig52_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig52_HTML.jpg)\n\
    \nFigure 8-52 – Selecting Duplicate Rules\n\n2. From the **New Rule** drop-down,\
    \ choose the object, in this example `Account`, as shown in Figure 8-53.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig53_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig53_HTML.jpg)\n\
    \nFigure 8-53 – New account rule\n\n3. Name your duplicate rule.\n\n4. Add a description.\n\
    \n5. Set the record-level security. This option only affects users who have sharing\
    \ rules.\n    - **Enforce sharing rules** means that if your users have limited\
    \ visibility with accounts they don’t own, they won’t be able to see the other\
    \ account that is matching to this newly created account.\n    - **Bypass sharing\
    \ rules** means that you are allowing the user to see the account they don’t own\
    \ if the matching rule is activated.\n\n6. In the **Actions** section, you can\
    \ choose to allow the user to create or edit an account although the duplicate\
    \ rule check was activated. The other option is **Block**, which will prevent\
    \ the user from saving the record. You can also choose to alert them with a message\
    \ from the alert box. The report option includes the duplicated account/contact/lead\
    \ into a list view, as shown in Figure 8-54.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig54_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig54_HTML.jpg)\n\
    \nFigure 8-54 – Duplicate rule, steps 3 to 6\n\n7. You can choose a preexisting\
    \ matching rule you’ve created or you can pick from the drop-down **Create New\
    \ Matching Rule**, as shown in Figure 8-55.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig55_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig55_HTML.jpg)\n\
    \nFigure 8-55 – Creating a new matching rule\n\n8. Click **Save Duplicate Rule**,\
    \ as shown in Figure 8-56.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig56_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig56_HTML.jpg)\n\
    \nFigure 8-56 – Saving your duplicate rule\n\n9. Name your matching rule and hit\
    \ the `Tab` key to have Salesforce create the unique name.\n\n10. Add a description\
    \ to your matching rule.\n\n11. The matching criteria section is where you create\
    \ the rule itself. From the column fields, choose the field that you’ll use as\
    \ part of your matching rule. In this example, you have the `Account Name`. In\
    \ **Matching Method**, you can have the option of `Exact` or for some fields `Fuzzy`.\
    \ The method `Fuzzy` will strip the account name of *Inc* or *Corporation* and\
    \ see if it can match two accounts without these in the name. The `Fuzzy` method\
    \ changes per field; to see a full list of these methods, go to [https://help.salesforce.com/](https://help.salesforce.com/)\
    \ and search *matching methods used with matching rules*.\n\n12. Select **Match\
    \ Blank Fields** to allow your criteria to match the fields if they are blank.\
    \ For example, if the account names are the same for the records and the custom\
    \ field on both is blank and these were both checked, the criteria would match,\
    \ and your user would be alerted. I suggest using exact values and also matching\
    \ blank fields.\n\n13. You can also choose if the filter logic should include\
    \ all the previous fields with the word `AND` or if it should include some but\
    \ not all with the word `OR`.\n\n14. Click **Save**, as shown in Figure 8-57.\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig57_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig57_HTML.jpg)\n\
    \nFigure 8-57 – Creating the matching rule\n\n15. Make sure to activate your matching\
    \ rule by clicking the **Activate** button, as shown in Figure 8-58.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig58_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig58_HTML.jpg)\n\
    \nFigure 8-58 – Activating your matching rule\n\n16. Go back to the duplicate\
    \ rules area (see step 1), click the name of the rule created, and activate the\
    \ duplicate rule, as shown in Figure 8-59.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig59_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig59_HTML.jpg)\n\
    \nFigure 8-59 – Activating your duplicate rule"
  raw: "## Duplicating Data Management\n\nAnother great feature in Salesforce is the\
    \ ability to set up duplicate rules. Duplicate rules allow you to create criteria\
    \ that will be checked against any new account, contact, or lead and prevent a\
    \ user from creating a duplicate record. Salesforce comes out of the box with\
    \ the following duplicate rules:\n\n*   *Standard Account Duplicate* *Rule* :\
    \ Will verify if the new account being created matches any of the following combinations\
    \ of account fields to an existing account:\n    1.  Account Name and Billing\
    \ Street\n\n2.  Account Name and City and State\n\n3.  Account name and Zip code\n\
    \n4.  Account name and Phone\n\n5.  Account Website and Phone\n\n6.  Account Website\
    \ and Billing Street\n\n*   *Standard Contact Duplicate* *Rule* : Will verify\
    \ if the new contact being created matches any of the following combinations of\
    \ contact fields to an existing contact:\n    1.  First Name and Last Name and\
    \ Title and Account Name\n\n2.  First Name and Last Name and Email\n\n3.  First\
    \ Name and Last Name and Phone and Company Name\n\n4.  First Name and Last Name\
    \ and Mailing Street and (City or Zip code or Phone)\n\n5.  First Name and Last\
    \ Name and Mailing Street and Title\n\n6.  First Name and Last Name and Title\
    \ and Email\n\n7.  First Name and Last Name and Phone\n\n*   *Standard Lead Duplicate*\
    \ *Rule* : Will verify if the new lead being created matches any of the following\
    \ combinations of lead fields to an existing lead:\n    1.  First Name and Last\
    \ Name and Title and Account Name\n\n2.  First Name and Last Name and Email\n\n\
    3.  First Name and Last Name and Phone and Company Name\n\n4.  First Name and\
    \ Last Name and Mailing Street and (City or Zip code or Phone)\n\n5.  First Name\
    \ and Last Name and Mailing Street and Title\n\n6.  First Name and Last Name and\
    \ Title and Email\n\n7.  First Name and Last Name and Phone\n\nIf the standard\
    \ rules don’t work for your company, you can also create your own. For example,\
    \ perhaps you have another combination of fields that would work better for account\
    \ duplication rules. Maybe your business can match an account based on the account\
    \ name and a custom field you are collecting. To create a new rule, follow these\
    \ steps:\n\n1.  Go to your Setup menu and search for *Duplicate Rules*. Click\
    \ Duplicate Rules , as shown in Figure [8-52](#437055_1_En_8_Chapter.xhtml#Fig52).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig52_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig52_HTML.jpg)\n\
    \nFigure 8-52\n\nSelecting Duplicate Rules\n\n2.  From the New Rule drop-down,\
    \ choose the object, in this example Account, as shown in Figure [8-53](#437055_1_En_8_Chapter.xhtml#Fig53).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig53_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig53_HTML.jpg)\n\
    \nFigure 8-53\n\nNew account rule\n\n3.  Name your duplicate rule .\n\n4.  Add\
    \ a description.\n\n5.  Set the record-level security . This option only affects\
    \ users who have sharing rules.\n    1.  “Enforce sharing rules” means that if\
    \ your users have limited visibility with accounts they don’t own, they won’t\
    \ be able to see the other account that is matching to this newly created account.\n\
    \n2.  “Bypass sharing rules” means that you are allowing the user to see the account\
    \ they don’t own if the matching rule is activated.\n\n6.  In the Actions section\
    \ , you can choose to allow the user to create or edit an account although the\
    \ duplicate rule check was activated. The other option is Block, which will prevent\
    \ the user from saving the record. You can also choose to alert them with a message\
    \ from the alert box. The report option includes the duplicated account/contact/lead\
    \ into a list view, as shown in Figure [8-54](#437055_1_En_8_Chapter.xhtml#Fig54).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig54_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig54_HTML.jpg)\n\
    \nFigure 8-54\n\nDuplicate rule, steps 3 to 6\n\n7.  You can choose a preexisting\
    \ matching rule you’ve created or you can pick from the drop-down Create New Matching\
    \ Rule, as shown in Figure [8-55](#437055_1_En_8_Chapter.xhtml#Fig55).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig55_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig55_HTML.jpg)\n\
    \nFigure 8-55\n\nCreating a new matching rule\n\n8.  Click Save Duplicate Rule,\
    \ as shown in Figure [8-56](#437055_1_En_8_Chapter.xhtml#Fig56).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig56_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig56_HTML.jpg)\n\
    \nFigure 8-56\n\nSaving your duplicate rule\n\n9.  Name your matching rule and\
    \ hit the Tab key to have Salesforce create the unique name.\n\n10.  Add a description\
    \ to your matching rule.\n\n11.  The matching criteria section is where you create\
    \ the rule itself. From the column fields, choose the field that you’ll use as\
    \ part of your matching rule. In this example, you have the account name. In Matching\
    \ Method, you can have the option of Exact or for some fields Fuzzy. The method\
    \ Fuzzy will strip the account name of *Inc* or *Corporation* and see if it can\
    \ match two accounts without these in the name. The Fuzzy method changes per field;\
    \ to see a full list of these methods, go to [`https://help.salesforce.com/`](https://help.salesforce.com/)\
    \ and search *matching methods used with matching rules*.\n\n12.  Select Match\
    \ Blank Fields to allow your criteria to match the fields if they are blank. For\
    \ example, if the account names are the same for the records and the custom field\
    \ on both is blank and these were both checked, the criteria would match, and\
    \ your user would be alerted. I suggest using exact values and also matching blank\
    \ fields.\n\n13.  You can also choose if the filter logic should include all the\
    \ previous fields with the word AND or if it should include some but not all with\
    \ the word OR.\n\n14.  Click Save, as shown in Figure [8-57](#437055_1_En_8_Chapter.xhtml#Fig57).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig57_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig57_HTML.jpg)\n\
    \nFigure 8-57\n\nCreating the matching rule\n\n15.  Make sure to activate your\
    \ matching rule by clicking the Activate button, as shown in Figure [8-58](#437055_1_En_8_Chapter.xhtml#Fig58).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig58_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig58_HTML.jpg)\n\
    \nFigure 8-58\n\nActivating your matching rule\n\n16.  Go back to the duplicate\
    \ rules area (see step 1), click the name of the rule created, and activate the\
    \ duplicate rule, as shown in Figure [8-59](#437055_1_En_8_Chapter.xhtml#Fig59).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig59_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig59_HTML.jpg)\n\
    \nFigure 8-59\n\nActivating your duplicate rule"
  trans: "\n## 重复数据管理\n\nSalesforce 中的另一个出色功能是设置重复规则。重复规则允许您创建规则，系统将针对任何新客户、联系人或潜在客户检查这些规则，从而防止用户创建重复记录。Salesforce\
    \ 默认提供以下重复规则：\n\n- **标准客户重复规则**：将验证新创建的客户是否与现有客户的以下任意客户字段组合相匹配：\n    1. `Account\
    \ Name` 和 `Billing Street`\n    2. `Account Name` 和 `City` 和 `State`\n    3. `Account\
    \ Name` 和 `Zip Code`\n    4. `Account Name` 和 `Phone`\n    5. `Account Website`\
    \ 和 `Phone`\n    6. `Account Website` 和 `Billing Street`\n\n- **标准联系人重复规则**：将验证新创建的联系人是否与现有联系人的以下任意联系人字段组合相匹配：\n\
    \    1. `First Name` 和 `Last Name` 和 `Title` 和 `Account Name`\n    2. `First Name`\
    \ 和 `Last Name` 和 `Email`\n    3. `First Name` 和 `Last Name` 和 `Phone` 和 `Company\
    \ Name`\n    4. `First Name` 和 `Last Name` 和 `Mailing Street` 和 (`City` 或 `Zip\
    \ Code` 或 `Phone`)\n    5. `First Name` 和 `Last Name` 和 `Mailing Street` 和 `Title`\n\
    \    6. `First Name` 和 `Last Name` 和 `Title` 和 `Email`\n    7. `First Name` 和\
    \ `Last Name` 和 `Phone`\n\n- **标准潜在客户重复规则**：将验证新创建的潜在客户是否与现有潜在客户的以下任意潜在客户字段组合相匹配：\n\
    \    1. `First Name` 和 `Last Name` 和 `Title` 和 `Account Name`\n    2. `First Name`\
    \ 和 `Last Name` 和 `Email`\n    3. `First Name` 和 `Last Name` 和 `Phone` 和 `Company\
    \ Name`\n    4. `First Name` 和 `Last Name` 和 `Mailing Street` 和 (`City` 或 `Zip\
    \ Code` 或 `Phone`)\n    5. `First Name` 和 `Last Name` 和 `Mailing Street` 和 `Title`\n\
    \    6. `First Name` 和 `Last Name` 和 `Title` 和 `Email`\n    7. `First Name` 和\
    \ `Last Name` 和 `Phone`\n\n如果标准规则不适用于贵公司，您也可以创建自己的规则。例如，也许您有另一组更适合客户重复规则的字段组合。您的企业或许可以根据`Account\
    \ Name`和您收集的一个自定义字段来匹配客户。要创建新规则，请按照以下步骤操作：\n\n1.  转到设置菜单，搜索**重复规则**。单击**重复规则**，如图\
    \ 8-52 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig52_HTML.jpg](img/437055_1_En_8_Fig52_HTML.jpg)\n\
    \n图 8-52 – 选择重复规则\n\n2.  从**新规则**下拉菜单中，选择对象，在此示例中为`Account`，如图 8-53 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig53_HTML.jpg](img/437055_1_En_8_Fig53_HTML.jpg)\n\
    \n图 8-53 – 新客户规则\n\n3.  为您的重复规则命名。\n\n4.  添加描述。\n\n5.  设置记录级安全性。此选项仅影响具有共享规则的用户。\n\
    \    - **启用共享规则**意味着，如果您的用户对并非其拥有的客户可见性有限，他们将无法看到与这个新创建客户匹配的其他客户。\n    - **绕过共享规则**意味着，如果匹配规则已激活，您允许用户查看他们不拥有的客户。\n\
    \n6.  在**操作**部分，您可以选择允许用户在重复规则检查被激活的情况下创建或编辑客户。另一个选项是**阻止**，这将阻止用户保存记录。您也可以选择通过提醒框中的消息来提醒他们。报表选项会将重复的客户/联系人/潜在客户包含在列表视图中，如图\
    \ 8-54 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig54_HTML.jpg](img/437055_1_En_8_Fig54_HTML.jpg)\n\
    \n图 8-54 – 重复规则，步骤 3 至 6\n\n7.  您可以选择一个已创建的现有匹配规则，或者从下拉菜单中选择**创建新的匹配规则**，如图 8-55\
    \ 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig55_HTML.jpg](img/437055_1_En_8_Fig55_HTML.jpg)\n\
    \n图 8-55 – 创建新的匹配规则\n\n8.  单击**保存重复规则**，如图 8-56 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig56_HTML.jpg](img/437055_1_En_8_Fig56_HTML.jpg)\n\
    \n图 8-56 – 保存您的重复规则\n\n9.  为您的匹配规则命名，然后按`Tab`键，让 Salesforce 生成唯一名称。\n\n10. 为您的匹配规则添加描述。\n\
    \n11. 匹配条件部分即您创建规则本身的地方。从字段列中，选择您将用作匹配规则一部分的字段。在此示例中，您有`Account Name`。在**匹配方法**中，您可以选择`Exact`，或者对于某些字段，可以选择`Fuzzy`。`Fuzzy`方法会剔除客户名称中的\
    \ *Inc* 或 *Corporation* 等字样，并查看是否能匹配两个名称中不含这些字样的客户。`Fuzzy`方法因字段而异；要查看这些方法的完整列表，请访问[`help.salesforce.com/`](https://help.salesforce.com/)并搜索*与匹配规则一起使用的匹配方法*。\n\
    \n12. 选择**匹配空白字段**，以允许您的条件在字段为空时进行匹配。例如，如果记录中的客户名称相同，并且两者的自定义字段均为空且这两项均已勾选，则条件将匹配，并且您的用户将收到提醒。我建议使用精确值并同时匹配空白字段。\n\
    \n13. 您还可以选择筛选逻辑是应使用`AND`包含所有上述字段，还是应使用`OR`包含部分而非全部字段。\n\n14. 单击**保存**，如图 8-57\
    \ 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig57_HTML.jpg](img/437055_1_En_8_Fig57_HTML.jpg)\n\
    \n图 8-57 – 创建匹配规则\n\n15. 务必通过单击**激活**按钮来激活您的匹配规则，如图 8-58 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig58_HTML.jpg](img/437055_1_En_8_Fig58_HTML.jpg)\n\
    \n图 8-58 – 激活您的匹配规则\n\n16. 返回重复规则区域（参见步骤 1），单击所创建规则的名称，然后激活该重复规则，如图 8-59 所示。\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig59_HTML.jpg](img/437055_1_En_8_Fig59_HTML.jpg)\n\
    \n图 8-59 – 激活您的重复规则\n"
- fmt: "### Mass Deleting Records\n\nSalesforce offers a `Mass Delete Records` option\
    \ for accounts, leads, activities, contacts, cases, solutions, products, and reports.\
    \ This option is especially important because it allows you to clean up your database.\
    \ If you allow or do not maintain your Salesforce CRM and leave records in it\
    \ that mean nothing to you or your employees, you end up with “dirty data.” A\
    \ CRM with dirty data is just about as useless as not having a CRM. Remember,\
    \ your CRM is only as good as the data you have in it. Hence, Salesforce gives\
    \ you a tool to mass delete. For example, say you just went to a conference and\
    \ captured all new leads, so you went ahead and imported them. However, after\
    \ reviewing your import, you realized it was the wrong list and an old one at\
    \ that. You need to delete these! The next couple steps will help you clean your\
    \ database:\n\n1. Go to your Setup menu and search for `Mass Delete Records`.\
    \ Click `Mass Delete Records`, as shown in Figure [8-60](#437055_1_En_8_Chapter.xhtml#Fig60).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig60_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig60_HTML.jpg)\n\
    \n   Figure 8-60 Finding Mass Delete Records\n\n2. Click the option for the objects\
    \ you want to delete the records from. In the previous example, it was Leads,\
    \ as shown in Figure [8-61](#437055_1_En_8_Chapter.xhtml#Fig61).\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig61_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig61_HTML.jpg)\n\
    \n   Figure 8-61 Mass delete record choices\n\n3. Determine the criteria of the\
    \ data that needs to be deleted. In this example, we know the created date was\
    \ yesterday. Or perhaps the lead source was the specific conference. Almost any\
    \ field on the object can be used as the criteria to find the records that need\
    \ to be deleted.\n\n4. In the first column, select the field.\n\n5. In the second\
    \ column, choose the method.\n\n6. In the third column, enter your value.\n\n\
    7. Click Search, as shown in Figure [8-62](#437055_1_En_8_Chapter.xhtml#Fig62).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig62_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig62_HTML.jpg)\n\
    \n   Figure 8-62 Set up the criteria to find the records needing to be deleted\n\
    \n8. Select the records you want to delete or select the box at the top to select\
    \ all the records.\n\n9. Select the box Permanently Delete if you are sure you\
    \ never want to retrieve these again.\n\n   **Note** Deleted records go to your\
    \ recycle bin and will autodelete after 15 days, or if your recycle bin is full,\
    \ the oldest record will be deleted.\n\n10. Click the Delete button when you are\
    \ ready to delete the records, as shown in Figure [8-63](#437055_1_En_8_Chapter.xhtml#Fig63).\n\
    \n    **Note** You can only mass delete 250 records at a time.\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig63_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig63_HTML.jpg)\n\
    \n    Figure 8-63 Mass deleting your records\n\n### Mass Transferring Records\n\
    \nSalesforce offers a tool to help you transfer the ownership of accounts, leads,\
    \ macros, or streaming channel records to another user. This allows you to transfer\
    \ every record a user owns to another and can be based on the criteria of the\
    \ record. This is an important tool if you have an employee who leaves your company\
    \ or if one gets promoted! For example, if an employee is leaving your company\
    \ and owns many accounts that now need to be managed by another employee, you\
    \ can use this tool to transfer those accounts to new users.\n\n1. Go to your\
    \ Setup menu, search for `Mass Transfer Records`, and click the phrase, as shown\
    \ in Figure [8-64](#437055_1_En_8_Chapter.xhtml#Fig64).\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig64_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig64_HTML.jpg)\n\
    \n   Figure 8-64 Searching for Mass Transfer Records in the Setup menu\n\n2. In\
    \ the example presented in the introduction of this section, you need to transfer\
    \ accounts from one departing user to another user. To do this, click the Transfer\
    \ Accounts link, as shown in Figure [8-65](#437055_1_En_8_Chapter.xhtml#Fig65).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig65_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig65_HTML.jpg)\n\
    \n   Figure 8-65 Transfer Account Records screen\n\n3. Using the magnifying glass\
    \ icon, search for the user you want to transfer the ownership of the records\
    \ from.\n\n4. Using the magnifying glass icon, search for the user you want to\
    \ transfer the ownership of the records to.\n\n5. It is a general rule that you\
    \ shouldn’t transfer records that are closed or completed from one user to another.\
    \ We recommend that you keep the history of your business this way. Therefore,\
    \ in Figure [8-66](#437055_1_En_8_Chapter.xhtml#Fig66), you’ll see we only select\
    \ “Transfer open opportunities” and “Transfer open cases.”\n\n6. If you want all\
    \ records that one user owns transferred to the other, you can leave this section\
    \ blank. Otherwise, if you want to transfer only specific records based on the\
    \ criteria of the record, you’ll need to use this section. Notice that you can\
    \ only use the logic `AND`. This means that every set of criteria you build here\
    \ will have been on the record it is a search for. For example, if you set the\
    \ `Type` field to `Customer–Channel` and `Billing State` to `California`, this\
    \ will require that the record has both of these values for it to be available\
    \ to transfer.\n\n   - Find the field that you want to filter from. For example,\
    \ if you use a `Type` field on the account and you only want to transfer specific\
    \ types of accounts to the new user.\n   - Use the appropriate method: equals,\
    \ contains, less than, greater than, and so on. In this example, we only want\
    \ specific types of accounts, so we use “equals.”\n   - Enter the value that the\
    \ criteria should be. In this example, it is the `Type` of accounts that equal\
    \ `Customer–Channel`.\n\n7. Once you have completed your criteria, click the Find\
    \ button to find the records that match the criteria, as shown in Figure [8-66](#437055_1_En_8_Chapter.xhtml#Fig66).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig66_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig66_HTML.jpg)\n\
    \n   Figure 8-66 Setting up the mass transfer of records\n\n8. Use the check box\
    \ found in the headers to select all the records to transfer or single select\
    \ the users with the check box found next to the account name.\n\n9. Once you\
    \ have selected all the records, click the Transfer button, as shown in Figure\
    \ [8-67](#437055_1_En_8_Chapter.xhtml#Fig67).\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig67_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig67_HTML.jpg)\n\
    \n   Figure 8-67 Selecting the records to transfer\n\nOnce complete, you should\
    \ get the record count of the transferred records, as shown in Figure [8-68](#437055_1_En_8_Chapter.xhtml#Fig68).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig68_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig68_HTML.jpg)\n\
    \nFigure 8-68 Record count of transferred records\n\n## Summary\n\nSalesforce\
    \ offers so many tools right at your fingertips. With all the data tools presented,\
    \ you shouldn’t have any issues with dirty data. If you let dirty data get out\
    \ of control, it can become a burden to you and your users. With the proper tools\
    \ at hand, you’ll never have a reason to let it get this way."
