    \ cases for requests via phone and in person or accept cases from multiple channels\
    \ (e.g., web forms, email, real-time web chat, online communities, and social\
    \ media outlets). You can allow your users to efficiently manage these channels\
    \ by setting up case assignment rules. The Salesforce Service Cloud application\
    \ also allows you to create case escalation rules when an issue needs to be escalated\
    \ to management. Tracking the various customer inquiries your company brings in\
    \ could even help you to establish new procedures. It also will help you to understand\
    \ any weak points within your company. Figure [3-1](#437055_1_En_3_Chapter.xhtml#Fig1)\
    \ shows the internal communication that can take place in Service Cloud. In short,\
    \ the application can help to resolve issues with customers faster.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig1_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1\n\nInternal communication\n\n## Overview of Salesforce Case Management\n\
    \nSalesforce case management allows users to capture the necessary details of\
    \ the Case object to manage and successfully resolve their case. Users can see\
    \ important case details in 29 standard fields as well as create their own custom\
    \ fields. They can keep track of the status of a case with a drop-down field with\
    \ values such as New, Working, Escalated, and Closed. Users can also access all\
    \ the necessary connected objects such as the account, contact detail, and product\
    \ information. Giving users access to the account and contact details will allow\
    \ them to get a full view of the customer submitting the case. They can assign\
    \ the case to a High, Medium, or Low priority based on the case submission as\
    \ well as set up their page layout to best fit their needs and the needs of the\
    \ company."
  trans: "\n# 创建线索队列\n\n通过控制线索分配方式来管理工作负载。线索会被分组到这些队列中，供团队成员查看和领取。线索记录在用户领取前会一直保留在队列中。\n\
    \n1. 在 `Setup`中，转到 `Queues`。\n2. 点击如图 2-55 所示的 `New` 按钮。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig55_HTML.jpg](img/437055_1_En_2_Fig55_HTML.jpg)\n\
    \n   图 2-55\n\n   线索队列\n\n3. 输入队列名称。\n4. 若要在线索添加到队列时通知团队成员，请输入队列电子邮件并选择 `Send\
    \ Email to Members`。\n5. 选择 `Lead` 并将其移动到 `Selected Objects`。\n6. 如图 2-56 所示，选择队列成员并将其移动到`Selected\
    \ Members`。您可以通过用户、角色和组来定义选定的成员。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig56_HTML.jpg](img/437055_1_En_2_Fig56_HTML.jpg)\n\
    \n   图 2-56\n\n   将成员添加到队列\n\n7. 点击 `Save`。现在，符合条件的线索记录将被放入队列。队列成员将能够查看这些线索并从中获取。\n\
    \n## 创建营销活动\n\n市场营销专业人员可以使用这个强大的工具来跟踪任何营销举措和努力。跟踪响应率和转化率，最终计算投资回报率 (ROI)。使用这些指标来确认营销工作的有效性。营销活动可以成为改进未来营销工作的有效工具。\n\
    \n按照以下步骤创建营销活动并添加营销活动成员：\n\n1. 在 `Campaign` 选项卡中选择 `New Campaign`，如图 2-57 所示。\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig57_HTML.jpg](img/437055_1_En_2_Fig57_HTML.jpg)\n\
    \n   图 2-57\n\n   营销活动选项卡和列表视图\n\n2. 输入您的营销活动的名称，如图 2-58 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig58_HTML.jpg](img/437055_1_En_2_Fig58_HTML.jpg)\n\
    \n   图 2-58\n\n   营销活动编辑页面\n\n3. 填写营销活动的详细信息。包括活动类型、活动开始日期和结束日期，以及其他重要信息。\n4.\
    \ 选中 `Active` 复选框以使营销活动处于活动和当前状态。\n5. 点击 `Save`。\n\n   营销活动激活后，您需要添加营销活动成员。这将把一切联系起来。营销活动成员是与特定营销活动相关联的线索和联系人。\n\
    \n   请注意，线索和联系人与营销活动是多对一关系。这意味着它们可以与多个营销活动相关联。点击 `Add Leads` 关联线索记录，或点击 `Add Contacts`\
    \ 关联联系人记录（图 2-59）。这些线索和联系人被视为营销活动的成员。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig59_HTML.jpg](img/437055_1_En_2_Fig59_HTML.jpg)\n\
    \n   图 2-59\n\n   将线索和联系人作为营销活动成员添加到营销活动中\n\n6. 选择应作为营销活动成员关联的记录，然后选择 `Add to\
    \ Campaign`，如图 2-60 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig60_HTML.jpg](img/437055_1_En_2_Fig60_HTML.jpg)\n\
    \n   图 2-60\n\n   添加营销活动成员\n\n   营销活动成员提供关于营销活动响应率的报告。Salesforce 使用以下标准值来跟踪这些工作：`Sent`\
    \ 和 `Responded`。\n\n7. 输入此记录应关联的营销活动。\n8. 将成员状态定义为现有状态，或更新成员状态为 `Sent` 或 `Responded`（见图\
    \ 2-61）。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig61_HTML.jpg](img/437055_1_En_2_Fig61_HTML.jpg)\n\
    \n   图 2-61\n\n   关联营销活动和所选营销活动成员应具有的状态的步骤\n\n9. 点击 `Submit`。Salesforce 将生成一条成功消息，如图\
    \ 2-62 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig62_HTML.jpg](img/437055_1_En_2_Fig62_HTML.jpg)\n\
    \n   图 2-62\n\n   营销活动成员成功消息\n\n## 总结\n\nSales Cloud 提供了有效的工具来连接您的销售和营销团队。Sales\
    \ Cloud 为您的 CRM 需求奠定了基础，并为您的机会管道提供了有洞察力的信息。\n\n# 3. Salesforce Service Cloud\n\
    \nSalesforce Service Cloud 允许您的客户服务代表和支持代表（用户）管理、跟踪和解决客户的咨询和问题。Service Cloud 应用程序使用\
    \ `Case` 对象来捕获解决咨询和问题所需的所有详细信息。您的用户可以通过电话和亲自上门为请求手动创建个案，也可以接受来自多个渠道（例如，网络表单、电子邮件、实时网络聊天、在线社区和社交媒体渠道）的个案。您可以通过设置个案分配规则，让您的用户高效地管理这些渠道。Salesforce\
    \ Service Cloud 应用程序还允许您在需要将问题上报给管理层时创建个案升级规则。跟踪公司收到的各种客户咨询甚至可以帮助您建立新的流程。它还将帮助您了解公司内部的任何薄弱点。图\
    \ 3-1 展示了 Service Cloud 中可能发生的内部沟通。简而言之，该应用程序有助于更快地解决客户问题。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig1_HTML.jpg](img/437055_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1\n\n内部沟通\n\n## Salesforce 个案管理概述\n\nSalesforce 个案管理允许用户捕获 `Case` 对象的必要详细信息，以管理和成功解决他们的个案。用户可以在\
    \ 29 个标准字段中查看重要的个案详细信息，也可以创建自己的自定义字段。用户可以通过包含 `New`、`Working`、`Escalated` 和 `Closed`\
    \ 等值的下拉字段来跟踪个案的状态。用户还可以访问所有必要的关联对象，例如客户、联系人详细信息和产品信息。授予用户访问客户和联系人详细信息的权限，将使他们对提交个案的客户有全面的了解。他们可以根据提交的个案将优先级设置为\
    \ `High`、`Medium` 或 `Low`，也可以设置页面布局以最好地满足他们自己和公司的需求。\n"
- fmt: '# Introduction to Standard Case Fields and Related Lists


    Salesforce offers a number of standard fields via its `Case` object that are displayed
    in Figure [3-2](#437055_1_En_3_Chapter.xhtml#Fig2). Before you decide to create
    a custom field, we recommend that you leverage an existing standard field instead.
    The majority of Salesforce standard fields have back-end automation applied to
    them. Because every business is different, you will most likely need custom fields,
    but why re-create the wheel if it’s not necessary?


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig2_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig2_HTML.jpg)


    **Figure 3-2** Case information fields


    You will find the following fields in the `Case Information` section (as shown
    in Figure [3-2](#437055_1_En_3_Chapter.xhtml#Fig2)):


    - **Parent Case**: Attach a case that currently exists and was the reason for
    the new case.


    **Note** If you use this function, it is essential to add the related list "Related
    Cases" to the case layout to get a full view of all the cases attached to a parent
    case.


    - **Case Owner**: Assign the user who is primarily responsible for managing the
    case.


    - **Case Number**: This is an automatically generated number used to reference
    a case both internally and externally.


    **Tip** Use this case number to allow your users and customers to reference it
    when addressing the case. Apply it to automated emails.


    - **Status**: Use this field to track the current status of a case. Utilize the
    existing values (`New`, `Escalated`, and `Closed`) or add your own.


    - **Contact Name**: Attach the point of contact who submitted the case.


    - **Escalated**: Use this check box to apply workflow rules (discussed later in
    the chapter) to automated escalations. Additionally, select this box and see the
    newly added red arrow next to the case number indicating that the case has been
    escalated. Utilize this field in reports and dashboards to keep an eye on your
    most important cases.


    - **Account Name**: After attaching the contact, watch the account get autopopulated
    with the account details of the contact. If the case belongs to an account other
    than the attached contact, overwrite the field with the necessary account.


    - **Priority**: Apply the necessary priority to the case using the standard values
    of `High`, `Medium`, or `Low`. Utilize this field in reports and dashboards to
    keep an eye on your most important cases.


    - **Type**: Use this field to track the types of cases your teams are managing.
    Use this field to help determine what FAQs should be developed or updated.


    - **Case Reason**: Use this field to track the reasons why a client contacted
    you. You can also use this field to help update FAQs, internal process, and so
    much more.


    - **Case Origin**: Use this field to track where your cases are coming from, whether
    it be an online form, email, phone, or in person.


    - **Date/Time Opened**: This field is automatically populated with the date and
    time the case was created.


    - **Date/Time Closed**: This field is automatically populated with the date and
    time the case was closed. Cases can be closed by changing the case status to a
    closed status or via many other ways (e.g., `API`, import update, automation rules,
    etc.).


    **Note** Salesforce reports come with an `Age` field that tracks the duration
    in days. However, this field is not a field that you can put on your case layout.
    You can create a formula field if you would like your users to see the duration
    a case has been (or was open for) on the case page layout.


    - **Closed When Created**: Users are able to create a new case and close it right
    away. When this happens the checkbox is marked true for this field and can be
    used in reports.


    Under `Contact Information` in Figure [3-3](#437055_1_En_3_Chapter.xhtml#Fig3),
    you’ll find the following fields:


    - **Contact Phone**, **Contact Mobile**, **Contact Fax**, and **Contact Email**:
    These fields pertain to the contact attached to the case. They are all formula
    fields that are used to map fields from one object to another. Since these are
    formula fields, they are locked fields that can’t be updated from the `Case` object.
    Instead, you’ll need to go to the contact record and update the information there.


    Under `Web Information` in Figure [3-3](#437055_1_En_3_Chapter.xhtml#Fig3), you’ll
    find the following fields:


    - **Web Email**, **Web Company**, **Web Name**, and **Web Phone**: When the web-to-case
    function is configured (we’ll cover this later in the chapter), cases will be
    automatically created in Salesforce. These fields will be populated with the corresponding
    data from your web form.


    Under `Description Information` in Figure [3-3](#437055_1_En_3_Chapter.xhtml#Fig3),
    you’ll find the following fields:


    - **Subject**: Use this field as the incoming subject line of an email when the
    email-to-case feature is configured or as a quick reference to what the case is
    about. Notice that this field’s data is replicated at the top the page layout
    as well.


    - **Description**: Use this field as the incoming body of an email when the email-to-case
    feature is configured or as a long description of the case.


    - **Internal Comments**: Use this field to create case comments while you are
    on a call with a client.


    - **Created By**: This field is found on every record in Salesforce. It captures
    who and at what date and time the case was created.


    - **Last Modified By**: This field is also found on every record in Salesforce.
    It captures who and at what date and time the case was last updated or modified.


    ### Tip


    Don’t worry if these fields aren’t enough or don’t work for your company. The
    default positions of some of these fields are easily modified. Salesforce allows
    up to 500 custom fields on the `Case` object. You can create fields for text,
    dates and time, numbers, currency, percents, picklists, multiselect picklists,
    check boxes, emails, phones, and URLs.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig3_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig3_HTML.jpg)


    **Figure 3-3** More case fields


    Next, we’ll discuss the standard related list found on the `Case` object.


    Figure [3-4](#437055_1_En_3_Chapter.xhtml#Fig4) shows the standard `Case` object
    related list. A *related list* is another object within your Salesforce organization
    that is connected to the current object you are viewing. The related list you’ll
    find on the `Case` object includes the following:


    - **Solutions**: This related list houses articles created in another Salesforce
    object called `Solutions`. Solutions are used to house content that either can
    be used to help you user close a case faster or can be used to provide information
    to the case contact. This object works with another Salesforce product called
    `Knowledge`. Solutions and `Knowledge` are important products because they provide
    resources to your users that help them move a case forward.


    - **Open Activities**: These records are outstanding or future tasks or events
    that your user created. Any task or event that hasn’t been completed will show
    up here.


    - **Activity History**: These records are tasks, emails, call logs, and events
    that your user has completed.


    - **Case Comments**: These records provide information pertaining to the case.
    Your user will add important case comments to this area.


    - **Attachments**: These records reflect outside documents that pertain to the
    case. This could be current client contracts or screenshots provided by the client
    about an error they are experiencing.


    - **Case History**: This content includes all the field-level changes made to
    the `Case` object. You can set field tracking and choose what fields are most
    important (we’ll cover this later in the book).'
