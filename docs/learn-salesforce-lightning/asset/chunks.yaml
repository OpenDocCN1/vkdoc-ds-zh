  trans: "\n### 如何转化线索\n\n请按照以下步骤了解如何在 Salesforce 中转化线索：\n\n1.  打开一条现有的线索记录。\n2. \
    \ 在线索记录页面，点击如图 2-14 所示的 `Convert` 按钮。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig14_HTML.jpg](img/437055_1_En_2_Fig14_HTML.jpg)\n\
    \n   **图 2-14** 线索记录上的 `Convert` 按钮\n\n3.  在 `Convert Lead` 编辑页面填写相应的详细信息，如图 2-15\
    \ 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig15_HTML.jpg](img/437055_1_En_2_Fig15_HTML.jpg)\n\
    \n   **图 2-15** 转化页面包含转化状态、记录所有者、客户名称和商机名称\n\n4.  输入转化后的状态。`Closed - Converted`\
    \ 是默认的转化状态。\n\n   **注意** 线索状态字段会捕获一个对应已转化或未转化状态的值。请选择适当的线索状态。默认情况下，`Converted`\
    \ 是默认状态。\n\n5.  指定记录所有者。可将其分配给任何 Salesforce 用户。\n6.  输入客户名称。您可以搜索现有的客户，也可以新建一个。如果客户不存在，请点击\
    \ `New Account` 直接创建新的客户记录。如果线索为个人，请将 `Account Name` 字段留空。\n7.  若要在转化时创建商机记录，请键入商机的名称。如果不存在商机，请将此字段留空。\n\
    8.  点击 `Convert` 并查看转化确认页面，如图 2-16 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig16_HTML.jpg](img/437055_1_En_2_Fig16_HTML.jpg)\n\
    \n   **图 2-16** 转化确认页面\n\n---\n\n## 客户和联系人\n\nSalesforce 中的客户可以是一个组织、公司或机构，而联系人则可以是与业务相关的个人。\n\
    \n例如，您可能即将与 Dunder Mifflin Paper Co. 的 Michael Scott 会面，商讨与您的产品或服务相关的潜在商机。在 Salesforce\
    \ 中跟踪有关 Michael Scott 和 Dunder Mifflin Paper Co. 的信息。创建一个名为 Dunder Mifflin Paper\
    \ Co. 的新客户。接着，为 Michael Scott 创建一条联系人记录以关联两者。\n\n### 提示\n\n在创建新记录之前最好先执行搜索，以避免重复。\n\
    \n### 客户\n\n您可以按类型、状态或 Salesforce 中的任何其他标准或自定义字段对客户进行排序。跟踪处于活跃与非活跃状态的客户、特定行业或区域内的客户，等等。\n\
    \n从 `Account` 列表中，您可以识别关键联系人、商机、个案以及相关的备注和附件，以便快速浏览。\n\n### 注意\n\n您可以在客户级别创建汇总字段以汇总特定指标。例如，创建一个汇总字段来聚合所有\
    \ `Closed Won` 商机的总金额。有关汇总字段的更多信息，请参阅第 1 章中的“字段类型”部分。\n\n客户和联系人具有主从关系。这是一种父子关系，其中主对象（`Account`）控制从对象（`Contact`）。请参阅第\
    \ 1 章中的“字段类型”部分，了解有关主从关系的更多信息。\n\n### 创建新客户\n\n客户可以直接在 Salesforce 中创建或导入，无需经过转化。创建客户记录以在客户级别跟踪信息，例如员工数量、客户编号、网站等。\n\
    \n1.  在工具栏中，点击 `Account` 标签旁边的 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figb_HTML.jpg](img/437055_1_En_2_Figb_HTML.jpg)。\n\
    2.  点击 `New Account`。\n3.  填写所有标有星号的必填字段，包括客户名称（图 2-17）。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig17_HTML.jpg](img/437055_1_En_2_Fig17_HTML.jpg)\n\
    \n   **图 2-17** 编辑模式下的客户记录\n\n4.  点击 `Save` 保存客户记录。保存成功后，将出现一条成功消息，如图 2-18 所示。\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig18_HTML.jpg](img/437055_1_En_2_Fig18_HTML.jpg)\n\
    \n   **图 2-18** 客户成功消息\n\n### 联系人\n\n使用联系人记录来捕获个人信息，包括电子邮件地址、电话号码、出生日期等。利用这些信息增进客户关系。创建加密字段以在联系人级别存储安全信息，例如社会安全号码和信用卡信息。\n\
    \n如前所述，客户和联系人具有主从关系。要在两者之间建立关系，请确保在创建联系时输入客户名称。\n\n### 提示\n\n通过客户记录创建联系人，可以快速关联两者。\n\
    \n按照以下步骤从现有客户创建联系人：\n\n1.  在客户记录上，点击如图 2-19 所示的 `New Contact` 按钮。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig19_HTML.jpg](img/437055_1_En_2_Fig19_HTML.jpg)\n\
    \n   **图 2-19** 客户记录上的 `New Contact` 按钮\n\n2.  在编辑页面输入名字，如图 2-20 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig20_HTML.jpg](img/437055_1_En_2_Fig20_HTML.jpg)\n\
    \n   **图 2-20** 新联系人的编辑页面\n\n3.  输入姓氏（这是保存任何联系人记录所必需的）。\n4.  客户名称字段会预填您开始操作的客户记录的名称。填写关于此联系人的任何其他信息。\n\
    5.  点击 `Save` 保存记录，并关联 Michael Scott 与 Dunder Mifflin。保存成功后，将出现一条成功消息，如图 2-21\
    \ 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig21_HTML.jpg](img/437055_1_En_2_Fig21_HTML.jpg)\n\
    \n   **图 2-21** 新联系人成功消息\n\n现在，在客户记录中您可以看到新联系人记录，如图 2-22 所示。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig22_HTML.jpg](img/437055_1_En_2_Fig22_HTML.jpg)\n\
    \n**图 2-22** 一个客户及其相关联系人。点击 `New` 以关联更多联系人。\n\n---\n\n## 列表视图\n\n列表视图让您能够更轻松地排序每个对象中的\
    \ Salesforce 数据。利用列表视图可以调出特定的记录分组。例如，创建一个列表视图，仅查看活跃的客户、热门的线索以及处于谈判阶段的商机等。当满足条件时，记录会自动显示在任何列表视图中。利用\
    \ Salesforce 的导入和批量更新功能对这些列表执行操作。\n\nLightning 中的新用户界面 (UI) 使数据可视化更加容易。将图表添加到您的视图中，并使用新的拖放功能在不同阶段之间移动记录。\n"
- fmt: "### Create a List View\n\nFollow these steps to create a new list view:\n\n\
    1. To create a list view, select the tab of the object desired. For example, select\
    \ the `Accounts` tab to create an `Account List` view.\n2. Select the list view\
    \ controller boxed in red, shown in Figure [2-23](#437055_1_En_2_Chapter.xhtml#Fig23),\
    \ and click `New`.\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig23_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig23_HTML.jpg)\n\
    \   Figure 2-23 – List view controller\n3. Give your list view a name. In this\
    \ example, you’re creating a list view for your gold accounts (Figure [2-24](#437055_1_En_2_Chapter.xhtml#Fig24)).\n\
    \   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig24_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig24_HTML.jpg)\n\
    \   Figure 2-24 – New list view edit page\n4. Select the appropriate level of\
    \ access. If this is a list view that should be visible only to you, select “Only\
    \ I can see this list view.”\n5. Click `Save` and view the new list in Figure\
    \ [2-25](#437055_1_En_2_Chapter.xhtml#Fig25).\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig25_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig25_HTML.jpg)\n\
    \   Figure 2-25 – List view after selecting Save\n6. Apply filters to your list\
    \ views to segment `Salesforce` data, as shown in Figure [2-26](#437055_1_En_2_Chapter.xhtml#Fig26).\n\
    \   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig26_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig26_HTML.jpg)\n\
    \   Figure 2-26 – The filter area in a list view\n7. Apply a filter to your `Salesforce`\
    \ data using the filter section in Figure [2-27](#437055_1_En_2_Chapter.xhtml#Fig27).\
    \ Click `Add Filter`.\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig27_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig27_HTML.jpg)\n\
    \   Figure 2-27 – Use this section to create filter logic\n8. Set the `Field`,\
    \ `Operator`, and `Value` options of the filter, as shown in Figure [2-14](#437055_1_En_2_Chapter.xhtml#Fig14).\
    \ (See the Reports area for more information on operators.)\n   **Example** To\
    \ create a list of only hot leads that I own, I created a filter. The values to\
    \ this filter include “show only lead records where I am the owner” and `Equal\
    \ to Hot` for the `Rating` field.\n9. Click `Done` and `Save`.\n\n### Take Action\
    \ on List Views\n\nRecords can be edited inline in a list view by clicking the\
    \ pencil icon or double-clicking in the field. To save records that have been\
    \ modified in a list view, click `Save` at the bottom of the page (Figure [2-28](#437055_1_En_2_Chapter.xhtml#Fig28)).\n\
    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig28_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig28_HTML.jpg)\n\
    Figure 2-28 – Charts within lists\n\nExperience the enhanced update to list views\
    \ in the Lightning Experience. `Salesforce` introduces a new UI to list views\
    \ with its report charts and kanban functionality. Report charts can be displayed\
    \ as bar graphs and donut charts.\n\n#### Kanban Feature\n\nMake lightning-fast\
    \ changes in `Salesforce` with the new kanban feature. Instantly update the status\
    \ of multiple records within a list view by utilizing the new drag-and-drop feature\
    \ shown in Figure [2-29](#437055_1_En_2_Chapter.xhtml#Fig29). In the kanban view,\
    \ each record is displayed as a widget that can be dragged and dropped across\
    \ the lead status pipeline. This enhanced feature makes it easier to visualize\
    \ and organize your data.\n\n1. To change the default list view from a grid list\
    \ to kanban, click the ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figc_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Figc_HTML.jpg)\
    \ button.\n2. Click `Kanban`.\n3. Drag and drop records to the appropriate column\
    \ to instantly update the status.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig29_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig29_HTML.jpg)\n\
    Figure 2-29 – List view in the kanban view\n\n#### Mass Change Status\n\nTo change\
    \ the status for a group of records at once, create a list view for that set of\
    \ data.\n\n1. Select the records that should be updated either individually or\
    \ for all, as shown in Figure [2-18](#437055_1_En_2_Chapter.xhtml#Fig18).\n2.\
    \ From the list view, click ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figd_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Figd_HTML.jpg).\n\
    3. Next, click `Change Status`. It’s important to know that only the first three\
    \ actions are displayed. Any additional status values are grouped under the arrow.\n\
    4. From the `Change Status` pop-up, select the updated status shown in Figure\
    \ [2-30](#437055_1_En_2_Chapter.xhtml#Fig30). From here, you can change the status\
    \ for a group of records with one click.\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig30_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig30_HTML.jpg)\n\
    \   Figure 2-30 – Steps to change the status for a mass group of records\n5. Click\
    \ `Save` and view updated changes to selected records.\n\n### Create an Email\
    \ Template\n\nStandardize company emails in one central place with ease. Use merge\
    \ fields to populate templates with custom values from a given record. Simply\
    \ create and store on-the-spot email templates directly from an account, contact,\
    \ or opportunity.\n\n1. From a contact record, select `Email`, as shown in Figure\
    \ [2-31](#437055_1_En_2_Chapter.xhtml#Fig31).\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig31_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig31_HTML.jpg)\n\
    \   Figure 2-31 – How to create and save an email template\n2. Type the email\
    \ of the recipient(s).\n3. Type the subject of the email.\n4. Compose the email\
    \ in the body of the text.\n5. Select ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fige_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fige_HTML.jpg)\
    \ to include merge fields.\n6. Click ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figf_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Figf_HTML.jpg)\
    \ to save it as a new template.\n\n### Send an Email\n\nFrom the `Activity` section\
    \ in `Salesforce`, you select the `Email` tab to send an email. Enter the email\
    \ of the recipient and subject, as shown in Figure [2-31](#437055_1_En_2_Chapter.xhtml#Fig31).\n\
    \n1. Click the `Activity` tab from any record.\n2. Type the subject for the email.\n\
    3. Type the body text for the email.\n4. To relate the email to another record\
    \ in `Salesforce`, search and enter the record in the `Related To` section.\n\
    5. Click `Send`.\n\n### Note\n\nTo access stored templates, click ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figg_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Figg_HTML.jpg)\
    \ and select `Insert Template`. Choose from the list of available templates.\n\
    \n## Opportunities\n\nOpportunities allow you to hold key information about any\
    \ potential deal, order, or anything that may generate revenue (Figure [2-32](#437055_1_En_2_Chapter.xhtml#Fig32)).\
    \ Deal tracking is an integral part to any business. Maximize and accelerate sales\
    \ efforts effectively by keeping track of all open deals. Use this powerful tool\
    \ to prevent deals from slipping through the cracks.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig32_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig32_HTML.jpg)\n\
    Figure 2-32 – Opportunity list view"
