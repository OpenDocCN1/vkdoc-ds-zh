    \ *leads* : This report filter for leads is similar; you have the option to see\
    \ the leads you own, your team’s leads, and user-owned leads (compared to queue\
    \ owned), queue-owned leads, and all leads, as shown in Figure [5-17](#437055_1_En_5_Chapter.xhtml#Fig17).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig17_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig17_HTML.jpg)\n\
    \n    Figure 5-17\n\n    Lead filter for the ownership of records\n\n*   For the\
    \ accounts, contacts, and leads, you can choose from any date field within that\
    \ report type to filter from as well as use Salesforce smart dates. Smart dates\
    \ allow you to choose dates that will update to the relative time every time you\
    \ run your report. For instance, you can choose from the drop-down This Week or\
    \ Current Calendar Year or use your own custom date range in the From and To fields,\
    \ as shown in Figure [5-18](#437055_1_En_5_Chapter.xhtml#Fig18).\n\n    **Note**\
    \ If these smart dates don’t work for your report, see “Field Filters” for more\
    \ ideas.\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig18_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig18_HTML.jpg)\n\
    \n    Figure 5-18\n\n    Smart date filters"
  trans: "\n# 表格报表格式\n\n表格格式报表易于与电子表格之类的平面文件进行比较。这种报表格式包含列作为不同的数据点，以及包含实际记录的行。这些报表最适用于创建记录列表，例如通话清单或列出带有总计的记录。这种报表格式无法进行分组，并且除非使用行限制过滤器（见图\
    \ 5-33），否则您无法在图表中显示信息或在仪表板组件中使用它。大多数客户会使用表格报表格式，通过设定的特定条件查看销售总额。例如，如果您想快速生成一份关于团队在一个季度内所产生销售额的报告，可以使用表格报表。图\
    \ 5-13 展示了一个通话清单表格报表的示例。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig13_HTML.jpg](img/437055_1_En_5_Fig13_HTML.jpg)\n\
    \n**图 5-13**\n\n表格报表示例\n\n# 摘要报表格式\n\n摘要报表格式是 Salesforce 中使用最广泛的报表格式。这种报表格式允许您对数据进行最多三个层级的分组和汇总。在这些分组内，您可以对列进行汇总，获取该特定分组的小计，并在报表末尾获得总计。您可以在此报表中使用公式来进一步定义报表。通过按商机所有者分组，您可以使用这种报表格式来展示销售人员之间的业绩对比。您也可以使用此报表，通过按记录的所有者分组，来确定公司中谁拥有的记录数量最多。或者，您可以构建一个报表，按职务对不同类型的联系人进行分组。这种格式也可以在仪表板和图表中使用和呈现。当您不对报表进行分组时，它将以表格格式显示。图\
    \ 5-14 展示了一份客户用来查看新增业务与现有客户业务量对比的报表。您还可以看到它已按用户分组，以显示每位用户与其他用户的业绩对比情况。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig14_HTML.jpg](img/437055_1_En_5_Fig14_HTML.jpg)\n\
    \n**图 5-14**\n\n摘要报表示例\n\n# 矩阵报表格式\n\n矩阵报表格式允许您同时按列和行对数据进行分组。这有助于对数据进行交叉分析。与摘要报表格式一样，在矩阵格式中创建的分组里，您可以查看小计、记录计数和总计，也可以按行或列查看，如图\
    \ 5-15 所示。使用这种报表类型，通过按日期分组列、按商机产品分组行，可以展示产品在特定日期范围内的表现情况。或者使用此报表来确定您的用户在某一时间段内的表现。使用此报表来比较您收到的案例来源与案例原因。这种报表类型也可以在仪表板组件和图表中使用。此外，您还可以使用公式进一步计算数据。如果您的分组或条件没有显示任何结果，此格式的报表将降级为摘要格式。\n\
    \n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig15_HTML.jpg](img/437055_1_En_5_Fig15_HTML.jpg)\n\
    \n**图 5-15**\n\n矩阵报表示例\n\n## 报表过滤器\n\n在报表生成器中，有必要了解 Salesforce 提供的报表过滤器的使用方法。您最多可以使用五种过滤器功能来进一步自定义报表。过滤器允许您更细致地查看数据，使其更符合您的报告需求。\n\
    \n### 标准过滤器\n\nSalesforce 报表生成器中的标准过滤器会因某些对象而异。由于您在客户和联系人之间收集的数据与商机或案例不同，您会看到这些标准报表过滤器会根据报表类型而变化。让我们看看每种报表类型及其标准过滤器。\n\
    \n#### 客户、联系人和线索\n\n客户、联系人和线索都共享相似的标准报表过滤器。就像在 Salesforce 中学习的大多数东西一样，如果您了解一个对象的组成部分，这些知识有时可以迁移到其他对象上。对于客户、联系人和线索，您会发现它们具有相似的属性。\n\
    \n*   *所有客户*：此报表过滤器允许您选择是查看所有客户（无论所有者是谁）、仅您拥有的联系人、仅您拥有的客户，还是您团队的客户，如图 5-16 所示。如果您通过角色层级或共享规则设置了安全策略，您的用户将只能看到他们被授权查看的客户、联系人和线索。\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig16_HTML.jpg](img/437055_1_En_5_Fig16_HTML.jpg)\n\
    \n    **图 5-16**\n\n    按记录所有权过滤客户\n\n*   *所有线索*：此线索报表过滤器类似；您可以选择查看您拥有的线索、您团队的线索、用户拥有的线索（相对于队列拥有的线索）、队列拥有的线索以及所有线索，如图\
    \ 5-17 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig17_HTML.jpg](img/437055_1_En_5_Fig17_HTML.jpg)\n\
    \n    **图 5-17**\n\n    按记录所有权过滤线索\n\n*   对于客户、联系人和线索，您可以从该报表类型中的任何日期字段中进行选择来过滤，也可以使用\
    \ Salesforce 智能日期。智能日期允许您选择每当运行报表时都会更新为相对时间的日期。例如，您可以从下拉菜单中选择“本周”或“当前日历年”，或在“从”和“至”字段中使用您自己的自定义日期范围，如图\
    \ 5-18 所示。\n\n    **注意** 如果这些智能日期不适用于您的报表，请参阅“字段过滤器”以获取更多思路。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig18_HTML.jpg](img/437055_1_En_5_Fig18_HTML.jpg)\n\
    \n    **图 5-18**\n\n    智能日期过滤器\n"
- fmt: "# Opportunities’ Standard Filter Fields\n\nOpportunities’ standard filter\
    \ fields are unique to their report type, so let’s look at them.\n\n- Similar\
    \ to accounts, contacts, and leads, opportunities have a standard report filter\
    \ that allows you to choose all opportunities regardless of who owns them, your\
    \ team’s opportunities, and your opportunities, as shown in Figure [5-19](#437055_1_En_5_Chapter.xhtml#Fig19).\
    \ If you have security set in place with role hierarchies or sharing rules, your\
    \ users will only be able to see the opportunities they are set up to see.\n\n\
    \  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig19_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig19_HTML.jpg)\n\
    \n  Figure 5-19 — Opportunity ownership filter\n\n- The `Opportunity Status` filter\
    \ allows you to see any opportunity whether it is closed, open or won, and all\
    \ opportunities with any status, as shown in Figure [5-20](#437055_1_En_5_Chapter.xhtml#Fig20).\n\
    \n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig20_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig20_HTML.jpg)\n\
    \n  Figure 5-20 — Opportunity status filter\n\n- `Opportunity Probability` allows\
    \ you to filter based on the `Probability` field (which is associated with this\
    \ stage). You can choose options such as greater than 90 percent to get a better\
    \ picture of what is in your pipeline that will most likely close, as shown in\
    \ Figure [5-21](#437055_1_En_5_Chapter.xhtml#Fig21).\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig21_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig21_HTML.jpg)\n\
    \n  Figure 5-21 — Opportunity Probability filter\n\n- The `Opportunity Date Field`\
    \ filter works just like the one for accounts, contacts, and leads. You can choose\
    \ from any date field within that report type to filter from as well as use Salesforce\
    \ smart dates. Smart dates allow you to choose dates that will update to the relative\
    \ time every time you run your report. For instance, you can choose from the drop-down\
    \ `This Week` or `Current Calendar Year` or use your own custom date range in\
    \ the `From` and `To` fields, as shown in Figure [5-22](#437055_1_En_5_Chapter.xhtml#Fig22).\n\
    \n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig22_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig22_HTML.jpg)\n\
    \n  Figure 5-22 — Opportunity smart date filters\n\n## Case Filters\n\nCase filters\
    \ have some similarities to other objects standard filters and some that are unique\
    \ to this report type.\n\n- The `Show` filter on cases allows you to see all your\
    \ cases, all cases regardless of who owns them, user-owned cases (opposed to queue\
    \ owned), queue-owned cases, your case team’s cases, or role-based team’s cases,\
    \ as shown in Figure [5-23](#437055_1_En_5_Chapter.xhtml#Fig23). If you have security\
    \ set in place with role hierarchies or sharing rules, your users will only be\
    \ able to see the cases they are set up to see.\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig23_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig23_HTML.jpg)\n\
    \n  Figure 5-23 — Case ownership filter\n\n- The `Units` filter allows you to\
    \ display the age of how long your case has been open in minutes, hours, or days,\
    \ as shown in Figure [5-24](#437055_1_En_5_Chapter.xhtml#Fig24).\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig24_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig24_HTML.jpg)\n\
    \n  Figure 5-24 — Case units filter\n\n- The case `Date Field` filter works just\
    \ like the one for accounts, contacts, leads, and opportunities. You can choose\
    \ from any date field within that report type to filter from as well use Salesforce\
    \ smart dates, as shown in Figure [5-25](#437055_1_En_5_Chapter.xhtml#Fig25).\
    \ Smart dates allow you to choose dates that will update to the relative time\
    \ every time you run your report. For instance, you can choose from the drop-down\
    \ `This Week` or `Current Calendar Year` or use your own custom date range in\
    \ the `From` and `To` fields.\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig25_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig25_HTML.jpg)\n\
    \n  Figure 5-25 — Case smart date filter\n\n## Campaigns\n\nCampaigns have only\
    \ one option for standard filtering.\n\n- The `Show` filter allows you to filter\
    \ by a specific campaign and provides a lookup field to find it, as shown in Figure\
    \ [5-26](#437055_1_En_5_Chapter.xhtml#Fig26). It also allows you to see all of\
    \ your active campaigns, campaigns you own, all active campaigns regardless of\
    \ who owns them, and all campaigns.\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig26_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig26_HTML.jpg)\n\
    \n  Figure 5-26 — Campaigns’ ownership filter\n\n### Field Filters\n\nField filters\
    \ in the report builder allow you to drag and drop any field found within that\
    \ report type and filter your data using operators and values. This field filtering\
    \ will be important for you to understand because you’ll see this same feature\
    \ used widely throughout Salesforce. You can find this in list views, workflow\
    \ rules, process builders, and the `Apex` language. Some of the operators you’ll\
    \ want to familiarize yourself with are as follows: `equals`, `not equal to`,\
    \ `less than`, `greater than`, `less or equal`, `greater or equal`, `contains`,\
    \ `does not contain`, and `starts with`. Here is also where you can customize\
    \ smart dates further if the standard smart date filters don’t work for you. Drag\
    \ and drop the date field of your choice into the filter field section, set the\
    \ operator to `\"equals\"`, and use a phrase like `Next N Days` (replace `N` with\
    \ your desired number) or `Last N Months`.\n\n1. Take your field from the left-side\
    \ `Fields` section and drag it to the `Filters` section, as shown in Figure [5-27](#437055_1_En_5_Chapter.xhtml#Fig27).\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig27_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig27_HTML.jpg)\n\
    \n   Figure 5-27 — Dragging and dropping a field onto the field filter section\n\
    \n2. Choose the operator appropriate for your filter, as shown in Figure [5-28](#437055_1_En_5_Chapter.xhtml#Fig28).\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig28_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig28_HTML.jpg)\n\
    \n   Figure 5-28 — Selecting an operator for your field filter\n\n3. If the field\
    \ filter chosen is a picklist field, you can click the lookup icon. If the field\
    \ is another data type, you can enter the value necessary.\n\n4. For picklist\
    \ fields only, you’ll check the values that your filter should include.\n\n5.\
    \ For picklist fields only, click `Insert Selected` to add these values to your\
    \ filter, as shown in Figure [5-29](#437055_1_En_5_Chapter.xhtml#Fig29).\n\n \
    \  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig29_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig29_HTML.jpg)\n\
    \n   Figure 5-29 — Selecting the field value of a picklist field\n\n6. Click `OK`\
    \ to finalize your field filter, as shown in Figure [5-30](#437055_1_En_5_Chapter.xhtml#Fig30).\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig30_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig30_HTML.jpg)\n\
    \n   Figure 5-30 — Completing your field filter\n\n> **Note:** Notice the `Locked`\
    \ check box next to the `OK` button in Figure [5-30](#437055_1_En_5_Chapter.xhtml#Fig30).\
    \ This check box, if selected, allows you to lock the filter on your report so\
    \ it can’t be changed unless the user has the permission to modify reports. Figure\
    \ [5-31](#437055_1_En_5_Chapter.xhtml#Fig31) shows how it is locked.\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig31_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig31_HTML.jpg)\n\
    \nFigure 5-31 — Locked field filters"
