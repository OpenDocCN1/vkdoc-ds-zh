    \n    Figure 9-21\n\n    Setting up public groups\n\n3.  Fill in the following\
    \ details, as shown in Figure [9-22](#437055_1_En_9_Chapter.xhtml#Fig22).\n\n\
    \    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig22_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig22_HTML.jpg)\n\
    \n    Figure 9-22\n\n    Adding members to a public group\n\n    *   Enter the\
    \ name of the public group in Label .\n\n    *   Enter the unique API name in\
    \ Group Name.\n\n    *   To add members to a public group, move them from Available\
    \ Members to Selected Members.\n\n4.  Click Save. Now you have a new public group\
    \ with members .\n\n#### Manual Sharing\n\nManual sharing can be used to provide\
    \ individual access to records through a sharing button.\n\nThere are four prerequisites\
    \ needed to give access to another record. These prerequisites require the following:\n\
    \n*   You are the record owner.\n\n*   You are in a role higher than the record\
    \ owner.\n\n*   You have “full access” permission to the record.\n\n*   You are\
    \ a system administrator .\n\n## Summary\n\nIn this chapter, you learned how Salesforce\
    \ approaches security in a multitiered architecture, which supports greater flexibility\
    \ and protection. Be sure to visit [`http://trust.salesforce.com`](http://trust.salesforce.com)\
    \ for transparent access to security threats and advisories.\n\n### Index\n\n\
    ### A, B\n\nAppExchange Marketplace Apps, lightning AppExchange marketplace AppExchange\
    \ Website app launcher choosing right app home page compatibility consultants\
    \ list home page details tab highlights bar information overview tab installation\
    \ details, installed and uninstalled packages home page production/sandbox, choosing\
    \ users selection lightning components package components price provider reviews"
  trans: "\n### 更改共享设置\n\n如需修改组织的默认设置，请导航至`设置`中的`共享设置`。\n\n要控制外部用户的共享设置，必须首先启用外部共享。在`设置`区域的`快速查找`中选择`共享设置`，然后点击`启用外部共享`。\n\
    \n此处可按对象查看内外部用户的访问级别，如图 9-16 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig16_HTML.jpg](img/437055_1_En_9_Fig16_HTML.jpg)\n\
    \n图 9-16\n\n默认组织范围设置\n\n外部用户包括社区用户、访客用户、网站用户、`Chatter`外部用户和门户用户。您可以为内部和外部用户分别设置每个对象的共享设置。\n\
    \n选择`编辑`可将设置更改为以下任一选项：\n\n*   `私有`：此对象中的所有记录均为私有，仅记录所有者、角色或共享规则可见。\n*   `公开只读`：此对象中的所有记录以只读形式可见。\n\
    *   `公开读写`：此对象中的所有记录对所有用户可见且可修改。\n*   `公开读/写/转让`：此对象中的所有记录对所有用户可见、可修改且可转让。\n*\
    \   `由父对象控制`：用户在主从关系的明细对象上拥有相同级别的访问权限。\n\n选择`标准报表可见性`可启用对报表中数据的可见性，这些数据可能因组织范围默认设置而无法访问。\n\
    \n选择`手动用户记录共享`可允许用户手动将记录共享给其他用户。\n\n选择`经理组`可允许用户与其经理组共享记录，如图 9-17 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig17_HTML.jpg](img/437055_1_En_9_Fig17_HTML.jpg)\n\
    \n图 9-17\n\n其他安全设置\n\n## 角色层次结构\n\n一旦通过 OWD 限制了数据，您就可以使用角色层次结构来开放可见性并共享记录访问权限。角色定义了用户或用户组自上而下拥有的访问级别。记录访问权限会沿层次结构向上汇总。\n\
    \n例如，在`销售经理`下创建一个名为`销售代表`的分支，以便销售经理可以访问其下属销售代表的记录，如图 9-18 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig18_HTML.jpg](img/437055_1_En_9_Fig18_HTML.jpg)\n\
    \n图 9-18\n\n理解角色首页\n\n### 备注\n\n在设计角色结构图时，请记住角色层次结构不一定与您的执行组织架构图相同。通常，您是为层级结构中的每一级创建角色，而不是为每个职位创建。\n\
    \n如果某个角色在角色层次结构中位于其他角色之上，则该角色将被授予对该分支下所有记录的相同访问级别。因此，如果访问权限是只读的，则授予相同的记录访问级别。\n\
    \n### 创建新角色\n\n使用角色来定义用户如何查看和共享记录。正确的角色结构取决于组织的文化。\n\n要创建角色，请遵循以下步骤：\n\n1.  在`快速查找`框中搜索`角色`，然后点击导航。\n\
    2.  选择`设置角色`。\n3.  选择`展开全部`以查看`Salesforce`的默认设置。\n4.  在相应分支下点击`添加角色`以在其下方添加一个分支（参见图\
    \ 9-19）。\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig19_HTML.jpg](img/437055_1_En_9_Fig19_HTML.jpg)\n\
    \n    图 9-19\n\n    展开的树形分支视图\n\n5.  填写以下详细信息以成功保存新角色，如图 9-20 所示：\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig20_HTML.jpg](img/437055_1_En_9_Fig20_HTML.jpg)\n\
    \n    图 9-20\n\n    创建新角色的步骤\n\n    1.  `标签`：这是用于命名角色的名称。示例可包括销售副总裁、区域经理等。按`Tab`键可自动填充角色名称。\n\
    \    2.  `角色名称`：这是唯一的 API 名称。此角色需向上级角色汇报。\n\n6.  将用户分配到指定的角色。\n\n通过选择分配，您可以搜索未分配的用户并将其连接到适当的角色。您也可以导航到用户的个人资料并选择`编辑`来分配角色。\n\
    \n### 共享规则\n\n您可以使用共享规则来向可能被排除在数据访问之外的特定角色、组或个人用户授予数据访问权限。共享规则可用于覆盖现有的安全限制。\n\n\
    ### 公共组\n\n可以创建组以简化共享和安全性。这可以包括个人、具有特定角色的用户或其他公共组的成员的组合。\n\n### 创建公共组\n\n在创建共享规则之前，您必须创建一个公共组。请遵循以下步骤创建一个公共组：\n\
    \n1.  在`快速查找`框中搜索`公共组`。\n2.  点击`新建`或将`视图`设置为`全部`以查看现有组的列表（图 9-21）。\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig21_HTML.jpg](img/437055_1_En_9_Fig21_HTML.jpg)\n\
    \n    图 9-21\n\n    设置公共组\n\n3.  填写以下详细信息，如图 9-22 所示。\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig22_HTML.jpg](img/437055_1_En_9_Fig22_HTML.jpg)\n\
    \n    图 9-22\n\n    向公共组添加成员\n\n    *   在`标签`中输入公共组的名称。\n    *   在`组名称`中输入唯一的\
    \ API 名称。\n    *   要将成员添加到公共组，请将其从`可用成员`移动到`已选成员`。\n\n4.  点击`保存`。现在您已拥有一个包含成员的新公共组。\n\
    \n#### 手动共享\n\n手动共享可用于通过共享按钮向个人提供对记录的访问权限。\n\n给予对其他记录的访问权限需要满足四个前提条件。这些前提条件要求：\n\
    \n*   您是记录所有者。\n*   您的角色高于记录所有者。\n*   您对该记录拥有“完全访问”权限。\n*   您是系统管理员。\n\n## 总结\n\
    \n在本章中，您学习了 `Salesforce` 如何在多层架构中处理安全问题，该架构支持更高的灵活性和保护性。请务必访问 [`trust.salesforce.com`](http://trust.salesforce.com)，以透明地了解安全威胁和建议。\n\
    \n### 索引\n\n#### A, B\n\n`AppExchange` 市场 应用程序，lightning `AppExchange` 市场 `AppExchange`\
    \ 网站 应用程序启动器 选择正确的应用程序 主页面 兼容性 顾问列表 主页 详细信息选项卡 亮点栏 信息 概览选项卡 安装详细信息，已安装和未安装的包 主页面\
    \ 生产环境/沙盒，选择用户 应用程序选择 lightning 组件 包组件 价格 提供商 评论\n"
- fmt: "### C\n\nCase automation case assignment rules：访问、创建、名称和激活字段条件设置、检索规则条件、用户发送通知。\
    \  \n案例自动回复规则：访问、命名、检索规则条件、创建、设置电子邮件。  \n案例升级规则：操作设置、营业时间选择、创建、名称创建、导航、检索规则条件、创建。\
    \  \n案例队列：创建、命名和设置通知选项、对象选择、用户、组和角色选择。  \n电子邮件转案例设置：案例线程电子邮件验证导航、重新发送链接、电子邮件路由地址创建、Salesforce\
    \ 登录页面设置、路由地址。  \nWeb 转案例设置：Chatter 动态跟踪（请参见“动态跟踪”）。  \n通知：电子邮件通知、接收消息用户配置窗口。\
    \  \n对象概述：配置文件编辑、流程、头像修改导航、图片更新、用户配置文件侧边栏。  \n协作工具（请参见“Chatter”）。  \n逗号分隔值（CSV）文件。\
    \  \n公司设置：营业时间、公司信息、功能集许可证、组织详细信息、权限集许可证、存储使用量、用户许可证、会计年度。  \n联系人和账户报告：创建、拖放示例、报告选择、运行报告、保存选项。\
    \  \n客户关系管理（CRM）。\n\n### D, E\n\n仪表板：图表创建、动态仪表板修改、命名和创建、报告和图表组件、报告查找、保存选项、选项卡创建。\
    \  \n数据库术语：字段、对象、记录。  \n数据控制工具。  \n数据导出：选择、包含图片、电子邮件频率、导航、设置菜单、对象、搜索、服务选项。  \n\
    数据导入向导：访问账户和联系人、CSV 文件、编辑映射、字段错误消息、导入、映射字段、唯一/外部 ID、CSV 文件、导入数据、潜在客户分配规则、自动化流程、营销活动、CSV\
    \ 文件、电子邮件字段映射、导入、启动、匹配、导航、设置菜单、搜索、源数据准备、快捷方式、搜索“设置”菜单。  \n重复规则：账户、联系人、创建新规则、“操作”部分、添加账户匹配规则、选择、设置记录级安全、潜在客户。\n\
    \n### F, G, H, I, J, K\n\n功能集许可证。  \n动态跟踪：Chatter 导航、设置菜单、步骤、跟踪设置。  \n字段级安全。\n\
    \n### L\n\n潜在客户分配规则。  \n潜在客户管理：转换按钮、确认页面、状态创建、编辑页面、错误消息、潜在客户记录、成功消息、列表视图、潜在客户记录活动部分、Chatter\
    \ 选项卡、详细信息选项卡、重复区域、亮点面板、Lightning 体验、新闻选项卡、工作区工具栏。  \n潜在客户队列。  \n潜在客户报告：拖放、新报告、报告选项卡、运行选项、保存选项、源步骤、类型查找。\
    \  \nLightning 助手：Lightning 体验主页、助手、收藏夹图标、全局搜索栏、帮助和培训、Lightning 操作、通知设置、查看配置文件、导航栏、新闻。\
    \  \n季度绩效：用户添加、多个用户按钮创建、停用、编辑用户信息、必填字段、添加新用户设置。  \nLightning 体验迁移：启用/禁用、Lightning\
    \ 功能迁移助手、预览选项卡、迁移助手就绪状态、开启用户设置。  \nLightning 页面：App Builder、编辑页面、设置下拉菜单、Lightning\
    \ 应用创建、添加选项卡、应用详情、分配用户、启用实用栏、导航选项、Salesforce 账户记录、Lightning 体验、Salesforce Classic。\
    \  \nLightning Process Builder：操作类型、审批操作类型、计划操作选项、时间相关操作、更新记录、可视化设计、主页流程（请参见“流程自动化”）。\
    \  \n列表视图：创建、控制器、编辑页面、过滤器区域、过滤器逻辑、电子邮件模板创建、看板功能、批量更改状态、发送邮件。\n\n### M\n\n批量删除记录：清理数据库、CRM\
    \ 选项。  \n批量转移记录：条件、放大镜图标、已转移记录数、选择、设置菜单、转移账户。  \n矩阵格式报告。  \n移动应用（iPhone 和 Android\
    \ 用户）：紧凑布局完成、创建、编辑分配按钮、导航、新建按钮选择、概述、快速入门指南、操作修改、联系人紧凑布局、全局操作、邀请用户、修改、导航菜单、审核、向导配置。\n\
    \n### N\n\n导航栏。\n\n### O\n\n对象级安全。  \n机会：标准过滤器、所有权、概率、智能日期、状态。  \n机会报告：创建、详情、拖放、示例、字段过滤器、报告类型选择、保存选项。\
    \  \n组织范围内默认值（OWD）：更改共享设置、私有/公开对象。\n\n### P, Q\n\n权限集许可证。  \n流程自动化：添加条件节点、创建条件步骤、操作名称和记录类型、条件、执行操作、字段值、立即操作、命名流程、流程激活、保存选项、主页和流程列表、命名流程、对象选择、记录更改、记录多次、保存选项、设置菜单。\
    \  \n产品：活动动态配置、自动回复规则、事件创建、任务创建、活动时间线创建、机会创建、Web 转潜在客户自动回复规则、Web 转潜在客户表单。  \n\
    配置文件：管理权限、控制台设置、创建自定义应用设置、字段级安全、常规用户权限、主页、对象级安全、页面布局、记录类型设置、标准。  \n公共组。\n\n###\
    \ R\n\n记录级安全。  \n记录所有权。  \n报表构建器：图表、联系人和账户报告、数据汇总、导出数据、公式、潜在客户、机会报告、表格、摘要和矩阵报告、格式调整、矩阵、摘要、表格、主页、类型、自定义报告定义、字段、帮助页面、对象创建、与对象的关系、报告类型、设置菜单。\
    \  \n角色层次结构：创建新角色、主页、手动共享、公共组、共享规则。  \n推广方法。\n\n### S\n\nSales Cloud Lightning：账户、活动时间线、联系人、潜在客户分配规则、潜在客户队列、营销活动创建、列表视图（请参见“列表视图”）、管理（请参见“潜在客户管理”）、机会创建、阶段历史、产品（请参见“产品”）。\
    \  \nSalesforce 案例管理。  \nSalesforce 全局搜索栏。  \nSalesforce Lightning 体验。  \nSalesforce\
    \ Service Cloud：案例自动化（请参见“案例自动化”）、案例记录创建、协作、案例记录、案例动态、动态过滤器、标准案例字段和列表、案例信息字段、案例布局、案例对象、联系人信息、描述信息、网络信息。\
    \  \n侧边栏：人工智能（AI）、Chatter 动态、投票创建、对象问题、记录访问、查看结果、动态创建、群组创建、帖子、书签记录的动态流创建、主题创建。\
    \  \n标准过滤器：账户、营销活动、案例过滤器、所有权、智能日期、单位、交叉过滤器、字段过滤器、完成、拖放、锁定字段过滤器、操作符选择、选择列表字段、潜在客户、逻辑语句、机会行限制、智能日期过滤器。\
    \  \n摘要格式报告。\n\n### T, U, V\n\n表格报告：拖放字段、格式、报告类型选择、排序选项、步骤。\n\n### W, X, Y, Z\n\
    \n工作流规则 *与* 流程构建器。"
