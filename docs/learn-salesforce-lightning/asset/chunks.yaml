  trans: "\n### C\n\n案例自动分配规则：访问、创建、名称和激活字段条件设置、检索规则条件、向用户发送通知。  \n案例自动回复规则：访问、命名、检索规则条件、创建、设置电子邮件。\
    \  \n案例升级规则：操作设置、营业时间选择、创建、名称创建、导航、检索规则条件、创建。  \n案例队列：创建、命名和设置通知选项、对象选择、用户、组和角色选择。\
    \  \n电子邮件转案例设置：案例线程电子邮件验证导航、重新发送链接、电子邮件路由地址创建、Salesforce 登录页面设置、路由地址。  \nWeb 转案例设置：Chatter\
    \ 动态跟踪（请参见“动态跟踪”）。  \n通知：电子邮件通知、接收消息用户配置窗口。  \n对象概述：配置文件编辑、流程、头像修改导航、图片更新、用户配置文件侧边栏。\
    \  \n协作工具（请参见“Chatter”）。  \n逗号分隔值（CSV）文件。  \n公司设置：营业时间、公司信息、功能集许可证、组织详细信息、权限集许可证、存储使用量、用户许可证、会计年度。\
    \  \n联系人和账户报告：创建、拖放示例、报告选择、运行报告、保存选项。  \n客户关系管理（CRM）。\n\n### D, E\n\n仪表板：图表创建、动态仪表板修改、命名和创建、报告和图表组件、报告查找、保存选项、选项卡创建。\
    \  \n数据库术语：字段、对象、记录。  \n数据控制工具。  \n数据导出：选择、包含图片、电子邮件频率、导航、设置菜单、对象、搜索、服务选项。  \n\
    数据导入向导：访问账户和联系人、CSV 文件、编辑映射、字段错误消息、导入、映射字段、唯一/外部 ID、CSV 文件、导入数据、潜在客户分配规则、自动化流程、营销活动、CSV\
    \ 文件、电子邮件字段映射、导入、启动、匹配、导航、设置菜单、搜索、源数据准备、快捷方式、搜索“设置”菜单。  \n重复规则：账户、联系人、创建新规则、“操作”部分、添加账户匹配规则、选择、设置记录级安全、潜在客户。\n\
    \n### F, G, H, I, J, K\n\n功能集许可证。  \n动态跟踪：Chatter 导航、设置菜单、步骤、跟踪设置。  \n字段级安全。\n\
    \n### L\n\n潜在客户分配规则。  \n潜在客户管理：转换按钮、确认页面、状态创建、编辑页面、错误消息、潜在客户记录、成功消息、列表视图、潜在客户记录活动部分、Chatter\
    \ 选项卡、详细信息选项卡、重复区域、亮点面板、Lightning 体验、新闻选项卡、工作区工具栏。  \n潜在客户队列。  \n潜在客户报告：拖放、新报告、报告选项卡、运行选项、保存选项、源步骤、类型查找。\
    \  \nLightning 助手：Lightning 体验主页、助手、收藏夹图标、全局搜索栏、帮助和培训、Lightning 操作、通知设置、查看配置文件、导航栏、新闻。\
    \  \n季度绩效：用户添加、多个用户按钮创建、停用、编辑用户信息、必填字段、添加新用户设置。  \nLightning 体验迁移：启用/禁用、Lightning\
    \ 功能迁移助手、预览选项卡、迁移助手就绪状态、开启用户设置。  \nLightning 页面：App Builder、编辑页面、设置下拉菜单、Lightning\
    \ 应用创建、添加选项卡、应用详情、分配用户、启用实用栏、导航选项、Salesforce 账户记录、Lightning 体验、Salesforce Classic。\
    \  \nLightning Process Builder：操作类型、审批操作类型、计划操作选项、时间相关操作、更新记录、可视化设计、主页流程（请参见“流程自动化”）。\
    \  \n列表视图：创建、控制器、编辑页面、过滤器区域、过滤器逻辑、电子邮件模板创建、看板功能、批量更改状态、发送邮件。\n\n### M\n\n批量删除记录：清理数据库、CRM\
    \ 选项。  \n批量转移记录：条件、放大镜图标、已转移记录数、选择、设置菜单、转移账户。  \n矩阵格式报告。  \n移动应用（iPhone 和 Android\
    \ 用户）：紧凑布局完成、创建、编辑分配按钮、导航、新建按钮选择、概述、快速入门指南、操作修改、联系人紧凑布局、全局操作、邀请用户、修改、导航菜单、审核、向导配置。\n\
    \n### N\n\n导航栏。\n\n### O\n\n对象级安全。  \n机会：标准过滤器、所有权、概率、智能日期、状态。  \n机会报告：创建、详情、拖放、示例、字段过滤器、报告类型选择、保存选项。\
    \  \n组织范围内默认值（OWD）：更改共享设置、私有/公开对象。\n\n### P, Q\n\n权限集许可证。  \n流程自动化：添加条件节点、创建条件步骤、操作名称和记录类型、条件、执行操作、字段值、立即操作、命名流程、流程激活、保存选项、主页和流程列表、命名流程、对象选择、记录更改、记录多次、保存选项、设置菜单。\
    \  \n产品：活动动态配置、自动回复规则、事件创建、任务创建、活动时间线创建、机会创建、Web 转潜在客户自动回复规则、Web 转潜在客户表单。  \n\
    配置文件：管理权限、控制台设置、创建自定义应用设置、字段级安全、常规用户权限、主页、对象级安全、页面布局、记录类型设置、标准。  \n公共组。\n\n###\
    \ R\n\n记录级安全。  \n记录所有权。  \n报表构建器：图表、联系人和账户报告、数据汇总、导出数据、公式、潜在客户、机会报告、表格、摘要和矩阵报告、格式调整、矩阵、摘要、表格、主页、类型、自定义报告定义、字段、帮助页面、对象创建、与对象的关系、报告类型、设置菜单。\
    \  \n角色层次结构：创建新角色、主页、手动共享、公共组、共享规则。  \n推广方法。\n\n### S\n\nSales Cloud Lightning：账户、活动时间线、联系人、潜在客户分配规则、潜在客户队列、营销活动创建、列表视图（请参见“列表视图”）、管理（请参见“潜在客户管理”）、机会创建、阶段历史、产品（请参见“产品”）。\
    \  \nSalesforce 案例管理。  \nSalesforce 全局搜索栏。  \nSalesforce Lightning 体验。  \nSalesforce\
    \ Service Cloud：案例自动化（请参见“案例自动化”）、案例记录创建、协作、案例记录、案例动态、动态过滤器、标准案例字段和列表、案例信息字段、案例布局、案例对象、联系人信息、描述信息、网络信息。\
    \  \n侧边栏：人工智能（AI）、Chatter 动态、投票创建、对象问题、记录访问、查看结果、动态创建、群组创建、帖子、书签记录的动态流创建、主题创建。\
    \  \n标准过滤器：账户、营销活动、案例过滤器、所有权、智能日期、单位、交叉过滤器、字段过滤器、完成、拖放、锁定字段过滤器、操作符选择、选择列表字段、潜在客户、逻辑语句、机会行限制、智能日期过滤器。\
    \  \n摘要格式报告。\n\n### T, U, V\n\n表格报告：拖放字段、格式、报告类型选择、排序选项、步骤。\n\n### W, X, Y, Z\n\
    \n工作流规则 *与* 流程构建器。\n"
