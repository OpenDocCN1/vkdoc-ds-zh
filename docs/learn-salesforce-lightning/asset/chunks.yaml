  trans: "\n### 创建列表视图\n\n请按以下步骤创建新的列表视图：\n\n1.  要创建列表视图，请先选择所需对象的选项卡。例如，选择 `Accounts`\
    \ 选项卡来创建 `Account List` 视图。\n2.  选择图 2-23 中红色框出的列表视图控制器，然后点击 `New`。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig23_HTML.jpg](img/437055_1_En_2_Fig23_HTML.jpg)\n\
    \   图 2-23 – 列表视图控制器\n3.  为你的列表视图命名。在本例中，你正在为你的黄金客户创建一个列表视图（图 2-24）。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig24_HTML.jpg](img/437055_1_En_2_Fig24_HTML.jpg)\n\
    \   图 2-24 – 新建列表视图编辑页面\n4.  选择合适的访问级别。如果这个列表视图只希望你自己可见，请选择“只有我可以看到此列表视图”。\n5.\
    \  点击 `Save`，然后在图 2-25 中查看新的列表。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig25_HTML.jpg](img/437055_1_En_2_Fig25_HTML.jpg)\n\
    \   图 2-25 – 选择保存后的列表视图\n6.  对列表视图应用筛选器以细分 `Salesforce` 数据，如图 2-26 所示。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig26_HTML.jpg](img/437055_1_En_2_Fig26_HTML.jpg)\n\
    \   图 2-26 – 列表视图中的筛选区域\n7.  使用图 2-27 中的筛选部分对您的 `Salesforce` 数据应用筛选器。点击 `Add Filter`。\n\
    \   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig27_HTML.jpg](img/437055_1_En_2_Fig27_HTML.jpg)\n\
    \   图 2-27 – 使用此部分创建筛选逻辑\n8.  设置筛选器的 `Field`、`Operator` 和 `Value` 选项，如图 2-14 所示。（更多关于操作符的信息，请参见报表区域。）\n\
    \   **示例** 为了创建一个仅包含我拥有的热门线索的列表，我创建了一个筛选器。此筛选器的值包括“仅显示我是所有者的线索记录”，并且 `Rating`\
    \ 字段值为 `Equal to Hot`。\n9.  点击 `Done` 和 `Save`。\n\n### 对列表视图执行操作\n\n在列表视图中，可以通过点击铅笔图标或双击字段来内联编辑记录。要保存在列表视图中修改过的记录，请点击页面底部的\
    \ `Save`（图 2-28）。\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig28_HTML.jpg](img/437055_1_En_2_Fig28_HTML.jpg)\n\
    图 2-28 – 列表内的图表\n\n体验 Lightning Experience 中对列表视图的增强更新。`Salesforce` 通过其报表图表和看板功能为列表视图引入了全新的用户界面。报表图表可以显示为条形图和环形图。\n\
    \n#### 看板功能\n\n借助全新的看板功能，在 `Salesforce` 中进行闪电般快速的更改。通过使用图 2-29 中所示的新拖放功能，即时更新列表视图内多个记录的状态。在看板视图中，每个记录都显示为一个小组件，可以在线索状态流程中进行拖放。此增强功能使数据的可视化和组织更加容易。\n\
    \n1.  要将默认的列表视图从网格列表更改为看板，请点击 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figc_HTML.jpg](img/437055_1_En_2_Figc_HTML.jpg)\
    \ 按钮。\n2.  点击 `Kanban`。\n3.  将记录拖放到相应的列以即时更新状态。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig29_HTML.jpg](img/437055_1_En_2_Fig29_HTML.jpg)\n\
    图 2-29 – 看板视图中的列表视图\n\n#### 批量更改状态\n\n要一次更改一组记录的状态，请为那组数据创建一个列表视图。\n\n1.  选择需要更新的记录，可以逐个选择，也可以全选，如图\
    \ 2-18 所示。\n2.  在列表视图中，点击 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figd_HTML.jpg](img/437055_1_En_2_Figd_HTML.jpg)。\n\
    3.  接着，点击 `Change Status`。需要注意的是，只有前三个操作会显示出来。任何额外的状态值都归在箭头下。\n4.  在 `Change Status`\
    \ 弹出窗口中，选择图 2-30 中所示的更新状态。在此处，您可以一键更改一组记录的状态。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig30_HTML.jpg](img/437055_1_En_2_Fig30_HTML.jpg)\n\
    \   图 2-30 – 批量更改一组记录状态的步骤\n5.  点击 `Save` 并查看对所选记录的更新更改。\n\n### 创建电子邮件模板\n\n轻松在一个中心位置标准化公司电子邮件。使用合并字段，从给定的记录中将自定义值填充到模板中。直接从帐户、联系人或商机中创建并存储在即兴的电子邮件模板。\n\
    \n1.  在联系人记录中，选择 `Email`，如图 2-31 所示。\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig31_HTML.jpg](img/437055_1_En_2_Fig31_HTML.jpg)\n\
    \   图 2-31 – 如何创建并保存电子邮件模板\n2.  输入收件人的电子邮件地址。\n3.  输入电子邮件的主题。\n4.  在邮件正文中撰写邮件内容。\n\
    5.  选择 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fige_HTML.jpg](img/437055_1_En_2_Fige_HTML.jpg)\
    \ 以包含合并字段。\n6.  点击 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figf_HTML.jpg](img/437055_1_En_2_Figf_HTML.jpg)\
    \ 将其另存为新模板。\n\n### 发送电子邮件\n\n在 `Salesforce` 的 `Activity` 部分中，选择 `Email` 选项卡即可发送电子邮件。输入收件人的电子邮件地址和主题，如图\
    \ 2-31 所示。\n\n1.  从任意记录中点击 `Activity` 选项卡。\n2.  输入电子邮件的主题。\n3.  输入电子邮件的正文内容。\n\
    4.  要将此电子邮件与 `Salesforce` 中的另一个记录关联，请在 `Related To` 部分中搜索并输入该记录。\n5.  点击 `Send`。\n\
    \n### 注意\n\n要访问存储的模板，请点击 ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figg_HTML.jpg](img/437055_1_En_2_Figg_HTML.jpg)\
    \ 并选择 `Insert Template`。从可用模板列表中进行选择。\n\n## 商机\n\n商机使您能够保存关于任何潜在交易、订单或任何可能产生收入的**关键信息**（图\
    \ 2-32）。交易追踪是任何业务不可或缺的一部分。通过跟踪所有进行中的交易，有效最大化并加速销售工作。使用这个强大的工具，防止交易从缝隙中溜走。\n\n\
    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig32_HTML.jpg](img/437055_1_En_2_Fig32_HTML.jpg)\n\
    图 2-32 – 商机列表视图\n"
- fmt: "### Create a New Opportunity\n\nTrack key information to help close open deals.\
    \ Track samples that were sent, latest touch points, and next steps. Utilize or\
    \ customize the `Stage` field to track where the deal is in the sales pipeline.\
    \ Use the close date to forecast the expected close date of this deal.\n\n1. \
    \ Click the `Opportunities` menu.\n2.  Click `New Opportunity` and fill in the\
    \ required fields found in Figure [2-33](#437055_1_En_2_Chapter.xhtml#Fig33).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig33_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig33_HTML.jpg)\n\
    \n    Figure 2-33\n    Edit page on an opportunity\n\n3.  Type the opportunity\
    \ name.\n4.  Type the expected close date and fill in any additional details about\
    \ the opportunity. It’s recommended to fill in more details about the opportunity.\n\
    5.  Select the stage of the opportunity record.\n6.  Click `Save` to save an opportunity\
    \ record.\n7.  Salesforce relates the account and opportunity records once saved.\n\
    \n### Tip\n\nNot sure what to name the opportunity? Try to keep uniformity in\
    \ your opportunity nomenclature and be specific. For example, `Quantity + Product\
    \ or Service of Interest`.\n\n### Opportunity Stage History\n\nUse the `Stage\
    \ History` area to keep track of changes to the stage. Any changes made to the\
    \ stage, amount, probability, expected revenue, or close date are populated here.\
    \ Select `View all` to see a list view of all the changes, as shown in Figure\
    \ [2-34](#437055_1_En_2_Chapter.xhtml#Fig34).\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig34_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig34_HTML.jpg)\n\
    \nFigure 2-34\nStage History list on an opportunity record\n\n## Products\n\n\
    `Products` represent the product or service offered by your company. Store important\
    \ product information in this object for sales reps to leverage during the sales\
    \ process. The product description and pricing are powerful information for sales\
    \ reps to leverage when out on the field or on a call.\n\nUse products to associate\
    \ with opportunities or quotes. Seamlessly update the opportunity amount to forecast\
    \ potential incoming revenue. Use this information to report on best sellers,\
    \ and so on.\n\n### Create a Product\n\nFollow these steps to create products\
    \ in Salesforce:\n\n1.  Click the `Products` tab (shown in Figure [2-35](#437055_1_En_2_Chapter.xhtml#Fig35)).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig35_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig35_HTML.jpg)\n\
    \n    Figure 2-35\n    Products tab\n\n2.  Click `New` (Figure [2-36](#437055_1_En_2_Chapter.xhtml#Fig36)).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig36_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig36_HTML.jpg)\n\
    \n    Figure 2-36\n    New button on the products list view\n\n3.  Enter the product\
    \ details. Type a descriptive name for the product and provide a description (Figure\
    \ [2-37](#437055_1_En_2_Chapter.xhtml#Fig37)).\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig37_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig37_HTML.jpg)\n\
    \n    Figure 2-37\n    The Create Product edit page includes Product Name, Product\
    \ Code, Description, Product Family, and Active status\n\n4.  Click the `Active`\
    \ check box to activate the product in Salesforce.\n5.  Click `Save`.\n6.  From\
    \ the `Related` tab on the Product record, click `Add Standard Price` (shown in\
    \ Figure [2-38](#437055_1_En_2_Chapter.xhtml#Fig38)).\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig38_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig38_HTML.jpg)\n\
    \n    Figure 2-38\n    Add Standard Price button\n\n7.  Enter the list price of\
    \ the product, as shown in Figure [2-39](#437055_1_En_2_Chapter.xhtml#Fig39),\
    \ and associate it with the standard price book if no other price books are being\
    \ used.\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig39_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig39_HTML.jpg)\n\
    \n    Figure 2-39\n    Price book entry page\n\n8.  Click `Save`. Salesforce creates\
    \ the new pricebook entry record.\n\n### Note\n\nHow are products related with\
    \ pricebooks? Products must be added to a pricebook in order to be available to\
    \ an opportunity. Pricebooks can be used to record multiple pricing on a single\
    \ product. Define prices for wholesalers, distributors, and other customers with\
    \ Pricebooks.\n\n### Opportunity Products\n\nFollow these steps to create opportunity\
    \ products in Salesforce:\n\n1.  From an opportunity record, click the arrow in\
    \ the `Products` list shown in Figure [2-40](#437055_1_En_2_Chapter.xhtml#Fig40).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig40_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig40_HTML.jpg)\n\
    \n    Figure 2-40\n    Products list on an opportunity record\n\n2.  Click `Add\
    \ Products`.\n3.  Select the `+` button next to each product that should be attached.\
    \ See Figure [2-41](#437055_1_En_2_Chapter.xhtml#Fig41).\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig41_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig41_HTML.jpg)\n\
    \n    Figure 2-41\n    Product selection page\n\n4.  Click `Next`.\n5.  Select\
    \ the quantity for this particular opportunity and for each product, as shown\
    \ in Figure [2-42](#437055_1_En_2_Chapter.xhtml#Fig42).\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig42_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig42_HTML.jpg)\n\
    \n    Figure 2-42\n    Opportunity product selection\n\n6.  Update the sales price\
    \ for each product.\n7.  Enter a date or line description if desired.\n8.  Click\
    \ `Save`.\n9.  View new opportunity product records successfully attached to this\
    \ opportunity, as shown in Figure [2-43](#437055_1_En_2_Chapter.xhtml#Fig43).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig43_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig43_HTML.jpg)\n\
    \n    Figure 2-43\n    Opportunity home page with new products attached\n\n####\
    \ Opportunity Record Page\n\nThe product panel to the right in Figure [2-43](#437055_1_En_2_Chapter.xhtml#Fig43)\
    \ displays the products associated to the opportunity. Click ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figh_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Figh_HTML.jpg)\
    \ next to any product record to edit or delete from the opportunity.\n\nThe `Stage`\
    \ workspace at the top of the page in Figure [2-43](#437055_1_En_2_Chapter.xhtml#Fig43)\
    \ is an interactive tool, which can be used to help sales agents move along their\
    \ sales process.\n\n### Activity Timeline\n\nPrioritize your day-to-day tasks\
    \ by setting reminders and assigning tasks in Salesforce. Use activities to create\
    \ a task, create an event, or log a call. In the Lightning Experience, the `Activity\
    \ timeline` replaces the classic `Activity History` and `Open Activities` lists,\
    \ as shown in Figure [2-44](#437055_1_En_2_Chapter.xhtml#Fig44).\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig44_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig44_HTML.jpg)\n\
    \nFigure 2-44\nActivity section within lead record\n\nUse the comments section\
    \ of the `Log a Call` tab to record important call details. Relate the contact\
    \ to another account or opportunity.\n\n### Configuring Activity Feed\n\nYou can\
    \ configure your activity feed by creating new tasks and events."
