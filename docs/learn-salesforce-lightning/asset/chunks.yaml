  trans: "\n# 功能集许可证\n\n功能集许可证在标准用户许可证的基础上增加了附加功能。这些功能可能包括`Data.com`、知识用户、营销用户等。\n\
    \n## 基于使用量的授权（BETA 版）许可证\n\n此功能允许组织在有限时间内使用。这些工具各不相同，但通常是临时提供。\n\n# 会计年度\n\n在\
    \ Salesforce 中，根据您现有的季度和年度会计期间设置会计年度。此信息对于报告和预测目的至关重要。\n\n## 修改会计年度：标准\n\n要修改标准会计年度，请导航至`设置`中的`会计年度`区域，并按照以下步骤操作（见图\
    \ 1-54）：\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig54_HTML.jpg](img/437055_1_En_1_Fig54_HTML.jpg)\n\
    \n图 1-54\n\n修改组织的会计年度\n\n1. 如果贵公司遵循公历年度，请选择**标准自定义年度**。（如果不遵循标准会计年度，请选择**自定义**。）\n\
    2. 选择**会计年度起始月份**。\n3. 设置输入的月份是基于月末还是月初。\n4. 点击**保存**。\n5. 选择**标准**或**自定义会计年度**。\n\
    \n# 营业时间\n\n营业时间定义客户支持团队与 Salesforce 的交互方式。指定支持团队可用于解决案例的时间。Salesforce 将调整时间以与升级规则、里程碑、案例和授权流程同步。请按照以下步骤开始：\n\
    \n1. 在`快速查找`区域中选择`营业时间`。\n2. 点击**新建营业时间**以导航至编辑页面（见图 1-55）。\n\n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig55_HTML.jpg](img/437055_1_En_1_Fig55_HTML.jpg)\n\
    \n   图 1-55\n\n   修改组织的营业时间\n\n3. 为其指定具体名称。\n4. 选择时区。\n5. 指定营业时间。\n6. 点击**启用**以激活这些时间。\n\
    7. 点击**保存**以将这些营业时间设为默认值。\n\n## 本章小结\n\n本章介绍了 Salesforce Lightning 的新智能和复杂性。在本章中，我们涵盖了如何从\
    \ Classic 迁移到 Lightning，并通过设置让您的组织为成功做好准备。下一章将讨论如何在 Lightning 中充分利用 Sales Cloud。\n\
    \n# 2. Sales Cloud Lightning\n\nSales Cloud 使销售和营销专业人员能够以闪电般的速度提高销售效率和收入。通过记录潜在客户、客户、联系人、商机和市场活动，您可以查看从潜在客户到活跃客户的完整客户历程。在\
    \ Sales Cloud Lightning 中，潜在客户被捕获、培育，并无缝转换为活跃客户或潜在客户。销售主管随后可以通过商机跟踪来管理其销售管道，从而有效达成更多交易（图\
    \ 2-1）。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig1_HTML.jpg](img/437055_1_En_2_Fig1_HTML.jpg)\n\
    \n图 2-1\n\nSales Cloud 中`商机`对象上的新看板功能\n\n## 潜在客户管理\n\n在不同的业务模型中，Salesforce 中的潜在客户可以是个人、组织或实体。`潜在客户`对象可以充当存储在\
    \ Salesforce 中所有潜在客户的容器。潜在客户来源多样。因此，最好使用潜在客户区域来跟踪有关潜在客户的重要信息，包括联系信息及备注。\n\n您的潜在客户可能来自多个切入点，并且可能是营销活动的结果。使用`潜在客户`对象来管理和培育正在经历资格认证流程的潜在客户。这包括通过`Web\
    \ 到潜在客户`从您的网站获取的潜在客户、购买的列表、推荐、网络活动等。利用此信息来判断您的最佳潜在客户来自哪些渠道。\n\n例如，为您在最新营销活动中遇到的潜在客户创建一条潜在客户记录。包括有关该潜在客户的重要联系信息、添加备注，并创建跟进任务，以防止潜在客户遗漏。生成报告以查看大部分合格潜在客户的来源。利用此信息将您的营销预算投入到最有效的地方。\n\
    \n## 潜在客户转换\n\n一旦将潜在客户确认为可靠潜在客户，您就可以将其转换为客户、联系人和商机。在 Salesforce 中转换潜在客户时，标准潜在客户字段会填充到新的客户、联系人和商机记录中。\n\
    \n企业潜在客户会创建企业客户、企业联系人和商机。个人客户在转换时会创建个人客户和商机。\n\n### 注意\n\n并非所有业务模型都使用潜在客户。然而，Salesforce\
    \ 中的潜在客户跟踪是一种有用的方法，用于将数据库中未接触的潜在客户与更有前景的潜在客户区分开来。请确定您的业务流程以决定转换的时机。\n"
- fmt: "### Understand the Lead Page\n\nIn the Lightning Experience, the lead record\
    \ contains important information about the lead including contact details, activity\
    \ tracking, campaign history, chatter, and news.\n\nSales leaders can work through\
    \ their most qualified leads faster with the help of `Lead Workspace` toolbar.\
    \ This toolbar makes it easy for reps to take their leads through the lead conversion\
    \ process.\n\nFigure [2-2](#437055_1_En_2_Chapter.xhtml#Fig2) shows a lead record\
    \ in the Lightning Experience. This page layout consolidates key information with\
    \ a highlights panel, an activity section, and the `Lead Workspace` toolbar.\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig2_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig2_HTML.jpg)\n\
    *Figure 2-2 — A lead record page in the Lightning Experience*\n\nThe highlights\
    \ panel, shown in Figure [2-3](#437055_1_En_2_Chapter.xhtml#Fig3), displays key\
    \ information at the top of the page. By default, this includes lead salutation,\
    \ first name, last name, title, company, all phone fields, and email. This feature\
    \ makes it easier for your users to work through leads quickly.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig3_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig3_HTML.jpg)\n\
    *Figure 2-3 — Highlights panel on a lead record*\n\nThe interactive toolbar shown\
    \ in Figure [2-4](#437055_1_En_2_Chapter.xhtml#Fig4) is called the `Lead Workspace`.\
    \ This area helps users follow a series of configurable steps in the conversion\
    \ process, referred to as *sales path*. Encourage users to update the lead status\
    \ as they work to qualify leads.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig4_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig4_HTML.jpg)\n\
    *Figure 2-4 — Lead Workspace toolbar*\n\nUse the `Activity` tab, as shown in Figure\
    \ [2-5](#437055_1_En_2_Chapter.xhtml#Fig5), to log a call, create a new task or\
    \ event, and send email. Create tasks to prevent your leads from slipping through\
    \ the cracks. Any tasks that need to be completed will populate in the `Next Steps`\
    \ area. Activities that have been completed are logged in the `Past Activity`\
    \ section.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig5_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig5_HTML.jpg)\n\
    *Figure 2-5 — Activity section on a lead record*\n\nUse the chatter feature on\
    \ a lead record, shown in Figure [2-6](#437055_1_En_2_Chapter.xhtml#Fig6), as\
    \ a collaboration tool. Use this as your communication vehicle within Salesforce\
    \ to collaborate with each other. Post updates, ask questions, and create polls.\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig6_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig6_HTML.jpg)\n\
    *Figure 2-6 — Chatter tab on a lead record*\n\nThe `Details` tab shown in Figure\
    \ [2-7](#437055_1_En_2_Chapter.xhtml#Fig7) displays information related to the\
    \ lead. This includes any standard and custom fields made visible to the user.\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig7_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig7_HTML.jpg)\n\
    *Figure 2-7 — Details tab on a lead record*\n\nUse the `News` tab shown in Figure\
    \ [2-8](#437055_1_En_2_Chapter.xhtml#Fig8) to find news articles related to your\
    \ lead. You can also sync your organization with Twitter to see up-to-date Twitter\
    \ feeds and related connections.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig8_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig8_HTML.jpg)\n\
    *Figure 2-8 — News section on a lead record*\n\nTo the far right of the page on\
    \ a default lead layout, shown in Figure [2-9](#437055_1_En_2_Chapter.xhtml#Fig9),\
    \ you can identify potential duplicate records. If there are any duplicates found,\
    \ that information will populate this section.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig9_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig9_HTML.jpg)\n\
    *Figure 2-9 — Duplicates area on a lead record*\n\n### Note\n\nThe highlights\
    \ panel can be rearranged to display the most important lead details at the top\
    \ of the page. This makes it easy for end users to leverage key information.\n\
    \n### Create a Lead\n\nFollow these steps to learn how to create a new lead record\
    \ from a list view:\n\n1.  Click the `![../images/437055_1_En_2_Chapter/437055_1_En_2_Figa_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Figa_HTML.jpg)`\
    \ button next to the `Leads` tab and click `New Lead`.\n\n    Alternatively, you\
    \ can click `New` from a `Lead` List view to create a new lead (Figure [2-10](#437055_1_En_2_Chapter.xhtml#Fig10)).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig10_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig10_HTML.jpg)\n\
    \    *Figure 2-10 — New button on a lead from a Lead list view*\n\n2.  Type the\
    \ first name of the lead on the edit page, as shown in Figure [2-11](#437055_1_En_2_Chapter.xhtml#Fig11).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig11_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig11_HTML.jpg)\n\
    \    *Figure 2-11 — Edit page of a lead record. Fill in the appropriate lead details\
    \ here.*\n\n3.  Type the last name of the lead, which is required to save any\
    \ lead record. Type the company name; this is the name of the business the lead\
    \ is associated with.\n\n    **Note** When converted, the first and last names\
    \ will generate the contact's first and last names. The company name is used to\
    \ create an account record and maps to the `Account Name` field.\n\n    `Last\
    \ Name` and `Company Name` are required lead fields. If data is not filled in\
    \ these fields, the record will not be saved. It's ideal to fill out more data\
    \ on a lead record. You should consider adding any additional important information\
    \ about your lead.\n\n4.  Click `Save` to save the record. Click `Save and New`\
    \ to save the current record and be directed to create a new lead.\n\n5.  When\
    \ a lead is created successfully, a success message will display at the top of\
    \ the page, as shown in Figure [2-12](#437055_1_En_2_Chapter.xhtml#Fig12).\n\n\
    \    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig12_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig12_HTML.jpg)\n\
    \    *Figure 2-12 — New lead record success message*\n\nIf the record was not\
    \ properly saved, an error message will be displayed, as shown in Figure [2-13](#437055_1_En_2_Chapter.xhtml#Fig13).\
    \ An error message is displayed at the top of the page.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig13_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig13_HTML.jpg)\n\
    *Figure 2-13 — Error message received after trying to save a record without filling\
    \ in all required fields marked in red*\n\n### Note\n\nRequired fields are marked\
    \ with a red asterisk, as shown in Figure [2-11](#437055_1_En_2_Chapter.xhtml#Fig11).\
    \ These fields must be populated with information in order for the record to be\
    \ saved. If the field does not have an asterisk, it is not required and can be\
    \ left blank, assuming there are no other validation rules in place."
