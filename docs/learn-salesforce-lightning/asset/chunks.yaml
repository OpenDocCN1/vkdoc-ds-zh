    \ need to be deleted.\n\n4.  In the first column, select the field.\n\n5.  In\
    \ the second column, choose the method.\n\n6.  In the third column, enter your\
    \ value.\n\n7.  Click Search, as shown in Figure [8-62](#437055_1_En_8_Chapter.xhtml#Fig62).\n\
    \n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig62_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig62_HTML.jpg)\n\
    \n    Figure 8-62\n\n    Set up the criteria to find the records needing to be\
    \ deleted\n\n8.  Select the records you want to delete or select the box at the\
    \ top to select all the records.\n\n9.  Select the box Permanently Delete if you\
    \ are sure you never want to retrieve these again.\n\n    **Note** Deleted records\
    \ go to your recycle bin and will autodelete after 15 days, or if your recycle\
    \ bin is full, the oldest record will be deleted.\n\n10.  Click the Delete button\
    \ when you are ready to delete the records, as shown in Figure [8-63](#437055_1_En_8_Chapter.xhtml#Fig63).\n\
    \n    **Note** You can only mass delete 250 records at a time.\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig63_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig63_HTML.jpg)\n\
    \n    Figure 8-63\n\n    Mass deleting your records\n\n### Mass Transferring Records\n\
    \nSalesforce offers a tool to help you transfer the ownership of accounts, leads,\
    \ macros, or streaming channel records to another user. This allows you to transfer\
    \ every record a user owns to another and can be based on the criteria of the\
    \ record. This is an important tool if you have an employee who leaves your company\
    \ or if one gets promoted! For example, if an employee is leaving your company\
    \ and owns many accounts that now need to be managed by another employee, you\
    \ can use this tool to transfer those accounts to new users.\n\n1.  Go to your\
    \ Setup menu, search for *Mass Transfer Records*, and click the phrase, we shown\
    \ in Figure [8-64](#437055_1_En_8_Chapter.xhtml#Fig64).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig64_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig64_HTML.jpg)\n\
    \nFigure 8-64\n\nSearching for Mass Transfer Records in the Setup menu\n\n2. \
    \ In the example presented in the introduction of this section, you need to transfer\
    \ accounts from one departing user to another user. To do this, click the Transfer\
    \ Accounts link , as shown in Figure [8-65](#437055_1_En_8_Chapter.xhtml#Fig65).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig65_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig65_HTML.jpg)\n\
    \nFigure 8-65\n\nTransfer Account Records screen\n\n3.  Using the magnifying glass\
    \ icon , search for the user you want to transfer the ownership of the records\
    \ from.\n\n4.  Using the magnifying glass icon, search for the user you want to\
    \ transfer the ownership of the records to.\n\n5.  It is a general rule that you\
    \ shouldn’t transfer records that are closed or completed from one user to another.\
    \ We recommend that you keep the history of your business this way. Therefore,\
    \ in Figure [8-66](#437055_1_En_8_Chapter.xhtml#Fig66), you’ll see we only select\
    \ “Transfer open opportunities” and “Transfer open cases.”\n\n6.  If you want\
    \ all records that one user owns transferred to the other, you can leave this\
    \ section blank. Otherwise, if you want to transfer only specific records based\
    \ on the criteria of the record, you’ll need to use this section. Notice that\
    \ you can only use the logic AND. This means that every set of criteria you build\
    \ here will have been on the record it is a search for. For example, if you set\
    \ the Type field to Customer – Channel and Billing State to California, this will\
    \ require that the record has both of these values for it to be available to transfer.\n\
    \    1.  Find the field that you want to filter from. For example, if you use\
    \ a Type field on the account and you only want to transfer specific types of\
    \ accounts to the new user.\n\n2.  Use the appropriate method: equals, contains,\
    \ less than, greater than, and so on. In this example, we only want specific types\
    \ of accounts, so we use “equals.”\n\n3.  Enter the value that the criteria should\
    \ be. In this example, it is the Type of accounts that equal Customer – Channel.\n\
    \n7.  Once you have completed your criteria , click the Find button to find the\
    \ records that match the criteria, as shown in Figure [8-66](#437055_1_En_8_Chapter.xhtml#Fig66).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig66_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig66_HTML.jpg)\n\
    \nFigure 8-66\n\nSetting up the mass transfer of records\n\n8.  Use the check\
    \ box found in the headers to select all the records to transfer or single select\
    \ the users with the check box found next to the account name .\n\n9.  Once you\
    \ have selected all the records , click the Transfer button, as shown in Figure\
    \ [8-67](#437055_1_En_8_Chapter.xhtml#Fig67).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig67_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig67_HTML.jpg)\n\
    \nFigure 8-67\n\nSelecting the records to transfer\n\nOnce complete, you should\
    \ get the record count of the transferred records , as shown in Figure [8-68](#437055_1_En_8_Chapter.xhtml#Fig68).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig68_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig68_HTML.jpg)\n\
    \nFigure 8-68\n\nRecord count of transferred records\n\n## Summary\n\nSalesforce\
    \ offers so many tools right at your fingertips. With all the data tools presented,\
    \ you shouldn’t have any issues with dirty data. If you let dirty data get out\
    \ of control, it can become a burden to you and your users. With the proper tools\
    \ at hand, you’ll never have a reason to let it get this way."
  trans: "\n### 批量删除记录\n\nSalesforce 为帐户、潜在客户、活动、联系人、个案、解决方案、产品和报告提供了`批量删除记录`选项。该选项尤为重要，因为它能让你清理数据库。如果你允许或不维护\
    \ Salesforce CRM，并将对你或员工毫无意义的记录留在其中，最终就会产生“脏数据”。含有脏数据的 CRM 几乎与没有 CRM 一样无用。请记住，CRM\
    \ 的价值完全取决于其中的数据质量。因此，Salesforce 为你提供了批量删除的工具。例如，假设你刚参加完一场会议，捕获了所有新的潜在客户，于是你直接导入了它们。然而，在审查导入结果后，你发现导入的是错误的列表，而且还是一个旧列表。你需要删除这些记录！接下来的几个步骤将帮你清理数据库：\n\
    \n1.  进入“设置”菜单，搜索 `批量删除记录`。点击 `批量删除记录`，如图 8-60 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig60_HTML.jpg](img/437055_1_En_8_Fig60_HTML.jpg)\n\
    \n    图 8-60 找到“批量删除记录”功能\n\n2.  点击你想要删除记录的对象选项。在前面的例子中，是潜在客户，如图 8-61 所示。\n\n\
    \    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig61_HTML.jpg](img/437055_1_En_8_Fig61_HTML.jpg)\n\
    \n    图 8-61 批量删除记录的选择\n\n3.  确定需要删除数据的具体条件。在这个例子中，我们知道创建日期是昨天。或者潜在客户来源是某次特定的会议。对象上的几乎任何字段都可以用作查找需要删除记录的条件。\n\
    \n4.  在第一列中，选择字段。\n\n5.  在第二列中，选择匹配方式。\n\n6.  在第三列中，输入你的值。\n\n7.  点击“搜索”按钮，如图\
    \ 8-62 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig62_HTML.jpg](img/437055_1_En_8_Fig62_HTML.jpg)\n\
    \n    图 8-62 设置条件以查找需要删除的记录\n\n8.  选择你想要删除的记录，或勾选顶部的复选框以选择所有记录。\n\n9.  如果你确定之后不再需要找回这些记录，请勾选“永久删除”复选框。\n\
    \n    **注意** 已删除的记录会进入回收站，并在 15 天后自动删除，或者如果回收站已满，则删除最早的记录。\n\n10. 准备好删除记录时，点击“删除”按钮，如图\
    \ 8-63 所示。\n\n    **注意** 每次只能批量删除 250 条记录。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig63_HTML.jpg](img/437055_1_En_8_Fig63_HTML.jpg)\n\
    \n    图 8-63 批量删除你的记录\n\n### 批量转移记录\n\nSalesforce 提供了一个工具，可以帮助你将帐户、潜在客户、宏或流媒体频道记录的所有权转移给另一个用户。这允许你将一个用户拥有的所有记录转移给另一个用户，并且可以基于记录的条件进行转移。如果你有员工离职或晋升，这将是一个重要的工具！例如，如果一名员工即将离职，并且他拥有许多需要由另一名员工管理的帐户，你可以使用此工具将这些帐户转移给新用户。\n\
    \n1.  进入“设置”菜单，搜索 `批量转移记录`，然后点击该短语，如图 8-64 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig64_HTML.jpg](img/437055_1_En_8_Fig64_HTML.jpg)\n\
    \n    图 8-64 在“设置”菜单中搜索“批量转移记录”\n\n2.  在本节引言部分的例子中，你需要将帐户从一个离职用户转移给另一个用户。为此，请点击“转出帐户”链接，如图\
    \ 8-65 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig65_HTML.jpg](img/437055_1_En_8_Fig65_HTML.jpg)\n\
    \n    图 8-65 “转出帐户记录”界面\n\n3.  使用放大镜图标，搜索你要从其转出记录所有权的用户。\n\n4.  使用放大镜图标，搜索你要向其转入记录所有权的用户。\n\
    \n5.  通常，你不应将已关闭或已完成的记录从一个用户转移给另一个用户。我们建议你以此方式保留业务历史记录。因此，在图 8-66 中，你将看到我们只选择了“转移未结机会”和“转移未结个案”。\n\
    \n6.  如果你希望一个用户拥有的所有记录都转移给另一个用户，你可以将此部分留空。否则，如果你只想根据记录的条件转移特定记录，则需使用此部分。请注意，你只能使用“并且\
    \ (AND)”逻辑。这意味着你在此处设置的每组条件都将用于搜索记录。例如，如果你将“类型”字段设置为“客户-渠道”，并将“帐单所在州”设置为“加利福尼亚”，那么记录必须同时满足这两个值，才可被转移。\n\
    \    -   找到你要筛选的字段。例如，如果你在帐户上使用“类型”字段，并且只想将特定类型的帐户转移给新用户。\n    -   使用适当的匹配方式：等于、包含、小于、大于等等。在此例中，我们只想要特定类型的帐户，因此使用“等于”。\n\
    \    -   输入条件应满足的值。在此例中，是“类型”等于“客户-渠道”的帐户。\n\n7.  完成条件设置后，点击“查找”按钮以查找符合条件的记录，如图\
    \ 8-66 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig66_HTML.jpg](img/437055_1_En_8_Fig66_HTML.jpg)\n\
    \n    图 8-66 设置批量转移记录\n\n8.  使用表头中的复选框选择所有要转移的记录，或使用帐户名称旁的复选框单个选择用户。\n\n9.  选择所有记录后，点击“转移”按钮，如图\
    \ 8-67 所示。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig67_HTML.jpg](img/437055_1_En_8_Fig67_HTML.jpg)\n\
    \n    图 8-67 选择要转移的记录\n\n完成后，你应该会看到已转移记录的计数，如图 8-68 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig68_HTML.jpg](img/437055_1_En_8_Fig68_HTML.jpg)\n\
    \n图 8-68 已转移记录的计数\n\n## 总结\n\nSalesforce 提供了众多触手可及的工具。有了上述所有数据工具，你应该不会再遇到脏数据的问题。如果你任由脏数据失控，它将成为你和用户的负担。只要手头有合适的工具，你就永远没有理由让其发展到那一步。\n"
- fmt: '# 9. Security Overview


    Salesforce is committed to running the most secure cloud platform. Protecting
    data integrity and privacy is at the forefront of Salesforce’s business model.
    Salesforce approaches security with a multitiered architecture, which supports
    greater flexibility and protection. System administrators have complete control
    over the level of access delivered to end users. You can protect sensitive information
    and manage end user accessibility with `profiles`, `permission sets`, field-level
    security, sharing rules, and more. Visit the Salesforce Trust web site at [`http://trust.salesforce.com`](http://trust.salesforce.com)
    (Figure [9-1](#437055_1_En_9_Chapter.xhtml#Fig1)) for transparent access to security
    threats and advisories.


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig1_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    Salesforce Trust web site


    ## Salesforce Security Model


    Controlling the level of access to your Salesforce organization is vital to ensuring
    client and data protection. While Salesforce is committed to the highest levels
    of data protection, your system administrator should configure the security settings
    to make the system as secure as possible. Design a security plan by considering
    what the primary risks to your data are and then learn about the Salesforce sharing
    architecture and its components to properly configure your security settings.


    Fundamentals Data can be secured and layered at different levels in Salesforce.
    Access is secured in three ways: at the object level, at the field level, and
    at the record level. In database terms, an object is a table. `Objects` hold groupings
    of information that may be related. This includes the records that live in them.
    `Records` are the rows of information that are found within a table.


    `Accounts`, `contacts`, and `opportunities` are just a few examples of standard
    Salesforce objects. Figure [9-2](#437055_1_En_9_Chapter.xhtml#Fig2) shows a list
    view of account records in the account object. Cloud Creations HQ is an example
    of an account record in the `Account` object, as shown in Figure [9-2](#437055_1_En_9_Chapter.xhtml#Fig2).


    Each record stores key pieces of information. These are called `fields`. In database
    terms, fields are the columns found within a table. In Figure [9-2](#437055_1_En_9_Chapter.xhtml#Fig2),
    Account Name, Account Site, and Phone are all examples of fields in an account
    record. Refer to Figure [9-2](#437055_1_En_9_Chapter.xhtml#Fig2) to identify the
    difference between objects, records, and fields.


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig2_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    Identifying objects, records, and fields


    ## Profiles and Permission Sets


    `Profiles` contain a collection of settings for determining what a user or group
    of users can see and do in Salesforce. A `permission set` contains the same collection
    of administrative settings but can be assigned to an individual user or groups
    of users as an extra layer of permission.


    ### Note


    Rather than create countless profiles to assign the appropriate settings and permissions
    for an individual user, it is best practice to assign a `permission set`.


    ### Profiles


    All users must be assigned a `profile`, and profiles can be assigned to multiple
    users. However, users can be assigned only one profile. Typically, profiles are
    assigned to users by their job function. This is usually because those with the
    same job description often require similar levels of access.


    For example, you may have different security requirements for your marketing users,
    service agents, sales reps, and developers. It’s recommended that you create or
    modify profiles to meet their specific requirements.


    #### Profile Home Page


    We suggest familiarizing yourself with the different profile settings on the profile
    home page. This page is broken down into the following permissions and settings.


    ##### Console Settings


    Click `Edit` to control the console settings for each profile (shown in Figure
    [9-3](#437055_1_En_9_Chapter.xhtml#Fig3)).


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig3_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig3_HTML.jpg)


    Figure 9-3


    Console Settings


    ##### Page Layouts


    Page layouts can be configured for each profile. Click `View Assignment` next
    to each desired object to configure a different page layout for a profile (shown
    in Figure [9-4](#437055_1_En_9_Chapter.xhtml#Fig4)).


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig4_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    You can control page layouts for each object at the profile level.


    ##### Field-Level Security


    Once object-level access and record-level access are granted, you can control
    what fields are visible at the profile level. Navigate to the field level and
    click `View` next to the desired object to control the level of access that a
    profile should have to a field. Once you click `View`, you will see a list of
    all fields related to that object and the current field-level permissions. Click
    `Edit` to make changes to the appropriate field (shown in Figure [9-5](#437055_1_En_9_Chapter.xhtml#Fig5)).


    Click `Read Access` to make a field visible. Select `Edit Access` to allow users
    to view and edit a field. Deselect `Read Access` and `Edit Access` to make a field
    hidden.


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig5_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig5_HTML.jpg)


    Figure 9-5


    Field-level security at the account level


    Let’s look at an example. Say Michael Scott Paper Co. uses Salesforce to track
    sales and accounting information. However, the CEO, Michael Scott, does not want
    sales representatives to see sensitive financial information such as credit card
    and Social Security numbers.


    To solve this, create a profile for sales representatives and another profile
    for accounting. For each profile, click `View Assignment` next to the account
    and edit the field security. For the sales representatives profile, deselect `Read
    Access` and `Edit Access` in the Credit Card and Social Security fields. This
    will hide both fields from users assigned to the sales representative profile.
    Log in as a user assigned to the sales representative profile to test your work.


    ##### App and Tab Settings


    Specify what apps are visible and set the default in the `Custom App Settings`
    section of the profile (shown in Figure [9-6](#437055_1_En_9_Chapter.xhtml#Fig6)).


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig6_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig6_HTML.jpg)


    Figure 9-6


    Custom App Settings area in a profile


    ##### Record Type Settings


    Record types can be assigned at the profile level. For objects with record types,
    add the record type next to the appropriate object.


    ##### Administrative and General User Permissions


    Profiles have two types of permissions: Administrative and General, as shown in
    Figures [9-7](#437055_1_En_9_Chapter.xhtml#Fig7) and [9-8](#437055_1_En_9_Chapter.xhtml#Fig8).
    Familiarize yourself with the granular types of permissions so you can better
    administer a secure organization.


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig8_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig8_HTML.jpg)


    Figure 9-8


    General User Permissions section at the profile level


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig7_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig7_HTML.jpg)


    Figure 9-7


    Administrative Permissions section located in a profile'
