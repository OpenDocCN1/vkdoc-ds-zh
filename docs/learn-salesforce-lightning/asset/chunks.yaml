  trans: '

    ### 移动应用设置快速入门指南


    Salesforce 提供了一份关于设置移动应用的快速入门指南。


    1.  点击浏览器右上角的设置齿轮图标，然后点击 `Setup`。

    2.  在 `Quick Find` 框中输入 `Salesforce Mobile`，然后选择 `Salesforce mobile Quick Start`
    选项，如图 6-45 所示。

    3.  点击 `Launch Quick Start Wizard` 按钮。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig45_HTML.jpg](img/437055_1_En_6_Fig45_HTML.jpg)

    *图 6-45：启动 Salesforce 移动配置快速入门向导*


    4.  点击 `Let’s Get Started` 按钮，如图 6-46 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig46_HTML.jpg](img/437055_1_En_6_Fig46_HTML.jpg)

    *图 6-46：开始快速入门*


    5.  您可以通过点击导航菜单上的项目，然后使用中间的箭头，或者通过拖放将其移动到新位置，来移除或重新排列这些项目，如图 6-47 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig47_HTML.jpg](img/437055_1_En_6_Fig47_HTML.jpg)

    *图 6-47：修改导航菜单*


    6.  导航菜单设置完成后，点击屏幕右下角的 `Save & Next`。

    7.  点击 `Arrange Global Actions` 按钮，如图 6-48 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig48_HTML.jpg](img/437055_1_En_6_Fig48_HTML.jpg)

    *图 6-48：排列全局操作*


    8.  使用两个区域之间的箭头，将必要的操作移动到 `Selected Global Actions` 区域，将不需要的操作移动到 `Available Items`
    区域。通过拖放来调整操作显示的先后顺序，如图 6-49 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig49_HTML.jpg](img/437055_1_En_6_Fig49_HTML.jpg)

    *图 6-49：修改操作顺序*


    9.  完成后点击 `Save & Next`。

    10. 点击 `Create Compact Layout` 按钮，如图 6-50 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig50_HTML.jpg](img/437055_1_En_6_Fig50_HTML.jpg)

    *图 6-50：配置联系人紧凑布局*


    **注意：** 通过快速入门，您只能为联系人记录创建紧凑布局。我们将在下一页介绍如何为其他对象创建紧凑布局。


    11. 将您希望在移动应用中显示的字段移动到 `Compact Layout for Contacts` 区域，将不希望包含的字段移动到 `Available
    Fields` 部分。通过拖放来重新排列字段的顺序，如图 6-51 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig51_HTML.jpg](img/437055_1_En_6_Fig51_HTML.jpg)

    *图 6-51：修改联系人紧凑布局的字段顺序*


    12. 完成后点击 `Save & Next`。

    13. 在步骤 4 中，您可以通过依次点击 `Navigation Menu`、`Global Actions` 和 `Contact Compact Layout`
    来回顾您在此快速入门中已配置的内容，查看您创建的项目。是否发现需要修改的地方？点击 `Edit` 按钮即可进入相应的编辑屏幕进行修改，如图 6-52 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig52_HTML.jpg](img/437055_1_En_6_Fig52_HTML.jpg)

    *图 6-52：核查您已完成设置*


    14. 完成后点击 `Next`。

    15. 如果您已准备好邀请用户，请在 `To` 字段中输入用户姓名，并自定义主题和消息。然后点击 `Send`，如图 6-53 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig53_HTML.jpg](img/437055_1_En_6_Fig53_HTML.jpg)

    *图 6-53：邀请用户下载 Salesforce 移动应用*


    16. 完成后依次点击 `Next` 和 `Finish`。


    ### 创建紧凑布局


    在前面的步骤 10 中，我们提到您也可以为其他对象创建紧凑布局。操作方法如下：


    1.  点击浏览器右上角的设置齿轮图标，然后点击 `Setup`。

    2.  选择主页选项卡旁边顶部的 `Object Manager` 选项卡。

    3.  选择您想要为其配置紧凑布局的对象，然后点击该对象的超链接名称，如图 6-54 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig54_HTML.jpg](img/437055_1_En_6_Fig54_HTML.jpg)

    *图 6-54：导航到某个对象的紧凑布局*


    4.  在左侧，您将看到该对象内的各种选项和操作。选择 `Compact Layouts`，如图 6-55 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig55_HTML.jpg](img/437055_1_En_6_Fig55_HTML.jpg)

    *图 6-55：选择紧凑布局*


    5.  点击 `New` 创建一个新的紧凑布局，如图 6-56 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig56_HTML.jpg](img/437055_1_En_6_Fig56_HTML.jpg)

    *图 6-56：点击 `New` 按钮*


    6.  为您的紧凑布局创建一个标签，然后按 `Tab` 键自动生成名称。使用中间的箭头将字段从 `Available Fields` 区域移动到 `Selected
    Fields` 区域。使用 `Selected Fields` 旁边的箭头上下移动字段，以调整用户查看详细信息的顺序，如图 6-57 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig57_HTML.jpg](img/437055_1_En_6_Fig57_HTML.jpg)

    *图 6-57：创建紧凑布局*


    7.  完成后，点击 `Save`。

    8.  点击 `Compact Layout Assignment` 按钮，如图 6-58 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig58_HTML.jpg](img/437055_1_En_6_Fig58_HTML.jpg)

    *图 6-58：完成紧凑布局*


    9.  点击 `Edit Assignment` 按钮，如图 6-59 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig59_HTML.jpg](img/437055_1_En_6_Fig59_HTML.jpg)

    *图 6-59：`Edit Assignment` 按钮*


    10. 从下拉菜单中选择您创建的紧凑布局，如图 6-60 所示。

    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig60_HTML.jpg](img/437055_1_En_6_Fig60_HTML.jpg)

    *图 6-60：选择紧凑布局*


    11. 点击 `Save`。


    ## 总结


    如您所见，在 Salesforce 中，用户有多种方式可以相互协作以及与外部客户互动。企业中的协作是促成销售成交或推动项目/任务前进的关键。通过使用 Chatter
    和 Salesforce 移动应用，用户便拥有了全天候工作所需的所有工具。

