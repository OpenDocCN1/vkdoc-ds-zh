  trans: "\n# 7. 闪电流程生成器\n\n`闪电流程生成器` 是一款功能极为强大的业务流程自动化工具，能够解决众多现实中的业务问题。`流程生成器` 通过其增强的点击式界面，使得在一个地方构建逻辑变得简单。借助\
    \ `流程生成器`，你可以减少或消除为简单流程编写 `Apex` 代码的需求。你可以创建自动化逻辑来更新相关记录、更新字段、创建任务、发送电子邮件等等。点击\
    \ `新建` 开始操作，如图 7-1 所示。\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig1_HTML.jpg](img/437055_1_En_7_Fig1_HTML.jpg)\n\
    \n图 7-1\n\n`流程生成器` 主页。点击 `新建` 开始操作。\n\n## Salesforce 工作流规则与流程生成器\n\nSalesforce\
    \ 提供了多种解决方案来自动化你的业务流程，包括工作流规则和 `流程生成器`。\n\n*工作流规则* 是在记录满足特定条件并被保存时自动执行的操作。通过建立一个系统化的流程，你可以最大限度地减少手动数据录入和处理过程。\n\
    \n`流程生成器` 在 `Salesforce Lightning` 中得到支持，并且能完成工作流规则所能做的一切，甚至更多（出站消息除外）。`流程生成器`\
    \ 的操作可以在记录发生更改或被另一个进程调用时启动。两种自动化类型都支持基于时间的操作。\n\n如果你有一个简单的单一 `if/then` 语句，建议使用工作流规则来自动化你的流程。换句话说，如果你的自动化标准包含简单的逻辑，请使用工作流规则。如果你的自动化需求具有一定的复杂性，那么\
    \ `流程生成器` 是最佳选择。请阅读“操作”部分，以了解每种操作类型的具体功能。\n\n表 7-1 列出了工作流规则与 `流程生成器` 工具之间的差异。\n\
    \n表 7-1\n\n工作流规则和流程生成器中可用的操作\n\n## 流程生成器：操作类型\n\n`流程生成器` 使创建自动化操作变得更加容易，因为它是一个可视化设计器，如图\
    \ 7-2 所示。\n\n以下是可以通过工作流规则或 `流程生成器` 完成的操作：\n\n*   *调用 Apex 类*：`Apex` 是一种用于在 Salesforce\
    \ 中开发复杂流程的编程语言。你可以使用 `流程生成器` 来调用现有的 `Apex` 类。\n*   *创建记录*：使用此操作可以从任何标准或自定义对象创建新记录。可以设置字段值来适当地构建记录。\n\
    \    **提示** 通过流程创建记录时，必填字段仍然有效。确保在`设置字段值`部分为所有必填字段赋值，以便成功创建记录。\n*   *电子邮件警报*：选择现有电子邮件警报，自动向指定收件人发送电子邮件。\n\
    *   *流程*：选择此操作以启动现有的可视化工作流。\n*   *发布到 Chatter*：创建一条消息，并选择更新用户、`Chatter` 群组，或向相关记录发布新的\
    \ `Chatter` 帖子。\n    **注意** 可以使用合并字段来生成 `Chatter` 帖子。\n*   *进程*：使用此操作类型来触发另一个进程。\n\
    \    **注意** 只能启动已激活的进程。\n*   *快速操作*：使用此操作类型来启动一个快速操作。选择“全局操作”来创建记录或记录通话。选择对象来为所选对象定义一个操作。\n\
    *   *提交以进行审批*：选择为给定记录激活默认审批流程或特定审批流程，如图 7-2 所示。通过选择适当的值来控制提交者是谁：`当前用户`、`来自记录的用户字段`\
    \ 或 `特定用户`。可以输入提交备注。\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig2_HTML.jpg](img/437055_1_En_7_Fig2_HTML.jpg)\n\
    \n    图 7-2\n\n    `提交以进行审批` 操作类型\n\n*   *更新记录*：选择更新现有记录或与对应对象相关的记录（如图 7-3 所示）。\n\
    \n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig3_HTML.jpg](img/437055_1_En_7_Fig3_HTML.jpg)\n\
    \n    图 7-3\n\n    在 `流程生成器` 中选择要更新的记录\n\n### 基于时间的操作\n\n当记录满足条件时，操作可以立即执行，也可以按照指定的时间表执行。\n\
    \n为了控制操作何时执行，可以向流程添加时间间隔，如图 7-4 所示。操作可以被触发在指定日期之前或之后运行。\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig4_HTML.jpg](img/437055_1_En_7_Fig4_HTML.jpg)\n\
    \n图 7-4\n\n为基于时间的操作设置时间\n\n#### 示例\n\n举例来说，我们创建一个自动化操作，在客户生日的前一天向所有活跃客户发送一张“生日快乐”贺卡。`计划操作`\
    \ 选项仅在流程的第一个节点以“仅当创建记录时” *或* “当记录被创建或编辑时”启动 *并且* 在标准节点的 `高级` 部分选中了 `是` 复选框时才可用，如图\
    \ 7-5 所示。\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig5_HTML.jpg](img/437055_1_En_7_Fig5_HTML.jpg)\n\
    \n图 7-5\n\n为操作组设置条件\n\n## 使用流程生成器创建流程\n\n按照本节中的步骤创建自动化业务流程。\n\n在这个场景中，你将遇到一个现实中的业务问题。假设销售用户必须手动创建一个项目记录，该记录包含存储在商机级别相同的详细信息。与其创建新记录并复制粘贴详细信息，不如让他们使用工具自动创建新的项目记录。同时，自动将存储在商机记录中的详细信息提取到新项目记录中也很有帮助。\n\
    \n### 注意\n\n在此用例中，项目记录是存储在名为 `项目` 的自定义对象中的记录。\n\n对于所有设置为 `已结束并赢得` 的商机，你希望创建一个新的项目记录，并将\
    \ `项目` 字段 `下一步` 更新为 `安排项目启动会`。\n"
- fmt: "### Note\n\nThis is a use case you can use while managing projects in Salesforce.\
    \ These steps can also be tweaked to create the new policy records most commonly\
    \ used with insurance companies. Those in the financial services industry also\
    \ use this concept to create new financial accounts records when an opportunity\
    \ closes. These are just a few examples. The opportunities to use automation in\
    \ Salesforce are endless!\n\nFollow these steps to create this process:\n\n1.\
    \ From `Setup`, select `Process Automation` in the `Platform Tools` section, as\
    \ shown in Figure [7-6](#437055_1_En_7_Chapter.xhtml#Fig6).\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig6_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig6_HTML.jpg)\n\
    \n   **Figure 7-6** – Process Automation in Setup\n\n2. Next, select `Process\
    \ Builder` to access the `Process Builder` home page.\n\n   All active and inactive\
    \ processes are listed on this page, as shown in Figure [7-7](#437055_1_En_7_Chapter.xhtml#Fig7),\
    \ along with the description of the process, the related object, the process type,\
    \ the last modified date, the status, and the actions.\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig7_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig7_HTML.jpg)\n\
    \n   **Figure 7-7** – Process Builder home page and list of processes\n\n3. Click\
    \ the `New` button to start a new process.\n\n4. Type the process name and press\
    \ `Tab` to generate the API name, as shown in Figure [7-8](#437055_1_En_7_Chapter.xhtml#Fig8).\n\
    \n   **Note** It is not required but recommended to enter a description for each\
    \ process. For organizations with numerous automation processes, it can be challenging\
    \ to find the right process when there are no descriptions.\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig8_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig8_HTML.jpg)\n\
    \n   **Figure 7-8** – Naming your process\n\n5. Determine when the process should\
    \ start. Your options include when “A record changes” and when “It’s invoked by\
    \ another process.”\n\n   **Note** You can break down more complex processes into\
    \ simpler processes. These processes can be reused and invoked by another process,\
    \ as mentioned earlier.\n\n   With the current scenario, you will start the process\
    \ when “A record changes.” Click `Save`, as shown in Figure [7-9](#437055_1_En_7_Chapter.xhtml#Fig9).\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig9_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig9_HTML.jpg)\n\
    \n   **Figure 7-9** – Starting a process when a record changes\n\n6. When you\
    \ first start your process, you must select the object it starts from. Select\
    \ `Add Object`, as highlighted in Figure [7-10](#437055_1_En_7_Chapter.xhtml#Fig10).\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig10_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig10_HTML.jpg)\n\
    \n   **Figure 7-10** – Selecting an object in Process Builder\n\n7. Choose the\
    \ object that the process should be evaluated from, as shown in Figure [7-11](#437055_1_En_7_Chapter.xhtml#Fig11).\
    \ In this example, you will select `Opportunity`.\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig11_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig11_HTML.jpg)\n\
    \n   **Figure 7-11** – Choosing when to start a process\n\n8. Select when the\
    \ process should start, as shown in Figure [7-11](#437055_1_En_7_Chapter.xhtml#Fig11).\n\
    \   - Select “only when a record is created” to only start the process for new\
    \ records.\n   - Select “when a record is created or edited” to start the process\
    \ for new records *and* existing records that are edited upon saving.\n\n9. You\
    \ can click `Yes`, as shown in Figure [7-12](#437055_1_En_7_Chapter.xhtml#Fig12),\
    \ to evaluate the record multiple times (up to five times) in one execution.\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig12_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig12_HTML.jpg)\n\
    \n   **Figure 7-12** – Click Yes to allow the process to evaluate a record multiple\
    \ times in a single transaction\n\n10. Confirm your specification and click ![../images/437055_1_En_7_Chapter/437055_1_En_7_Figa_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Figa_HTML.jpg).\n\
    \n11. Select the `Add Criteria` node shown in Figure [7-13](#437055_1_En_7_Chapter.xhtml#Fig13)\
    \ to set the criteria for this process.\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig13_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig13_HTML.jpg)\n\
    \n    **Figure 7-13** – Adding a criteria node to a process\n\n12. Set the criteria\
    \ that the record should meet in order for the actions to be executed.\n\n   \
    \ In this example, you want to set the criteria for the process to start only\
    \ when opportunity records have a stage marked as `Closed Won`.\n\n### Setting\
    \ the Criteria\n\nFollow these steps to set the criteria for a process:\n\n1.\
    \ Name your criteria, as shown in Figure [7-14](#437055_1_En_7_Chapter.xhtml#Fig14).\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig14_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig14_HTML.jpg)\n\
    \n   **Figure 7-14** – Steps to setting the criteria\n\n2. Find a field and choose\
    \ the appropriate operator to set the criteria.\n\n3. Select the criteria for\
    \ executing the action (shown in Figure [7-15](#437055_1_En_7_Chapter.xhtml#Fig15)).\
    \ You can choose to execute the actions only when the criteria are met, when a\
    \ formula evaluates to be true, or with no criteria; just evaluate the action\
    \ for that object. In this example, select “No Criteria – just execute the actions!”\
    \ to execute the action for all opportunity records.\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig15_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig15_HTML.jpg)\n\
    \n   **Figure 7-15** – Setting the criteria for executing an action\n\n4. Set\
    \ the conditions. Use fields and operator values to set these conditions, as shown\
    \ in Figure [7-16](#437055_1_En_7_Chapter.xhtml#Fig16).\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig16_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig16_HTML.jpg)\n\
    \n   **Figure 7-16** – Setting the conditions to invoke a process\n\n5. Once the\
    \ criteria are all set, click `Save`.\n\n6. Choose what the action should be once\
    \ this criterion is met. Click `Add Action`, as shown in Figure [7-17](#437055_1_En_7_Chapter.xhtml#Fig17).\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig17_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig17_HTML.jpg)\n\
    \n   **Figure 7-17** – Adding an immediate action to a process\n\n7. Define the\
    \ action type.\n\n8. In this scenario, you want to create a new project record.\
    \ Click `Create a Record`.\n\n9. Name the action and choose what type of record\
    \ should be created, as shown in Figure [7-18](#437055_1_En_7_Chapter.xhtml#Fig18).\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig18_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig18_HTML.jpg)\n\
    \n   **Figure 7-18** – Naming the action and choosing the record type\n\n10. Set\
    \ the field values for the new record, as shown in Figure [7-19](#437055_1_En_7_Chapter.xhtml#Fig19).\
    \ In our example, we set all the field values that we want to carry over into\
    \ the new project record.\n\n    **Note** All required fields must be entered\
    \ when choosing this action. If a required field value is not entered, the record\
    \ will not be created.\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig19_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig19_HTML.jpg)\n\
    \n    **Figure 7-19** – Setting the field values when creating a new record\n\n\
    11. Once you confirm that the criteria and actions are correct, click `Save` ![../images/437055_1_En_7_Chapter/437055_1_En_7_Figb_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Figb_HTML.jpg).\n\
    \n12. To make this process active, click `Activate`, as shown in Figure [7-20](#437055_1_En_7_Chapter.xhtml#Fig20).\n\
    \n    **Note** Only one version of the process can be active at a time.\n\n  \
    \  ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig20_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig20_HTML.jpg)\n\
    \n    **Figure 7-20** – Activating a process\n\n13. It is best practice to test\
    \ the process. Create a test record to test this new automated process."
