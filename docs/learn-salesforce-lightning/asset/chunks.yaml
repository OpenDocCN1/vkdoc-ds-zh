    \ Edit the primary contact to establish the point of contact for any technical\
    \ support requests. Make changes to the locale, currency, and newsletters settings\
    \ here (see Figure [1-51](#437055_1_En_1_Chapter.xhtml#Fig51)).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig51_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig51_HTML.jpg)\n\
    \nFigure 1-51\n\nOrganization detail\n\n#### Storage Usage\n\nEach organization\
    \ has storage limits. Storage is divided into two categories: data and file storage.\
    \ To view your storage limits, storage usage, and percentage utilized, navigate\
    \ to your company settings.\n\nClick View next to Used Data Space or Used File\
    \ Space to view your organization’s current storage use.\n\nThe storage usage\
    \ is broken down and shows the percentage of utilization across the two. Information\
    \ is also broken down by object, as shown in Figure [1-52](#437055_1_En_1_Chapter.xhtml#Fig52).\
    \ Use this breakdown to identify which records occupy the most space.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig52_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig52_HTML.jpg)\n\
    \nFigure 1-52\n\nStorage Usage breakdown\n\n#### User Licenses\n\nThis section\
    \ displays the total number of licenses available, the total used, and the remaining\
    \ number of licenses available for each license type. This includes the standard\
    \ Salesforce license, which is the most commonly purchased and assigned (see Figure\
    \ [1-53](#437055_1_En_1_Chapter.xhtml#Fig53)).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig53_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig53_HTML.jpg)\n\
    \nFigure 1-53\n\nUser licenses\n\n#### Permission Set Licenses\n\nPermission set\
    \ licenses entitle users to access features and various tools that are not included\
    \ in their user license. This can include a Service Cloud console user, a CRM\
    \ user, Analytics Cloud accessibility, and more."
  trans: "\n### 停用用户\n\n在 Salesforce 中，你不能删除用户，但可以停用用户以阻止其登录。停用用户会释放一个许可证，该许可证可分配给其他用户（参见图\
    \ 1-42）。当你停用某个用户时，该用户将从所有共享权限和组中移除。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig42_HTML.jpg](img/437055_1_En_1_Fig42_HTML.jpg)\n\
    \n图 1-42 – 用户页面上的 `Active` 复选框\n\n该用户拥有的记录仍可转移至活跃账户。以下是停用步骤：\n\n1. 导航至 `Setup`\
    \ 中的 `User` 部分。\n2. 选择需要停用的用户名称。\n3. 在用户记录页面点击 `Edit`。\n4. 在用户配置文件中取消勾选 `Active`。\n\
    5. 点击 `Save`。\n\n## Lightning 页面\n\nLightning 允许你创建自定义页面，为特定用户组显示和安排关键信息。你可以通过构建清晰易用的页面来提高采用率和用户接受度。通过创建应用程序，你可以最大限度地减少公开信息的类型，使\
    \ Salesforce 组织更易于使用。`App Builder` 是一个新的拖放工具，无需编写代码即可自定义界面（参见图 1-43）。\n\n请按照以下步骤更改\
    \ Lightning 主页：\n\n1. 在主页上，点击 `Edit Page`（此功能可在大多数 Lightning 页面上找到）。参见图 1-43。\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig43_HTML.jpg](img/437055_1_En_1_Fig43_HTML.jpg)\n\
    \n图 1-43 – `Setup` 下拉菜单中的 `Edit Page`\n\n2. 安排你想要用户看到的可用组件。参见图 1-44。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig44_HTML.jpg](img/437055_1_En_1_Fig44_HTML.jpg)\n\
    \n图 1-44 – `Lightning App Builder`\n\n3. 在左侧面板中，从可用的 Lightning 组件中进行选择，并将其拖放到主页上的所需区域。右侧面板将提示所选组件的详细信息。\n\
    \n### 创建新的 Lightning 应用程序\n\n从 `Setup` 中，搜索并选择 `App Manager` 以打开 `Lightning Experience\
    \ App Manager`。点击 `New Lightning App` 以创建一个新应用程序（参见图 1-45）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig45_HTML.jpg](img/437055_1_En_1_Fig45_HTML.jpg)\n\
    \n图 1-45 – 创建新的 Lightning 应用程序\n\n要创建新应用程序，请遵循以下步骤：\n\n1. 填写必填字段（标有星号的字段）。\n \
    \  - 应用程序名称将显示在导航栏中。\n   - 开发人员名称是 API 名称，必须在组织中的其他应用程序中保持唯一。\n\n2. 对于 `App Branding`，上传一张图片（如公司徽标）来自定义页面（参见图\
    \ 1-46）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig46_HTML.jpg](img/437055_1_En_1_Fig46_HTML.jpg)\n\
    \n图 1-46 – 应用程序详细信息\n\n3. 填写完相应字段后，点击 `Next`。\n\n4. 选择导航样式。选择 `Standard` 在顶部显示导航栏，或选择\
    \ `Console` 在新工作区选项卡中打开记录（参见图 1-47）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig47_HTML.jpg](img/437055_1_En_1_Fig47_HTML.jpg)\n\
    \n图 1-47 – 新的 Lightning 应用程序导航选项\n\n5. 点击 `Next`。\n\n6. 点击 `Add` 添加实用程序栏（参见图 1-48）。\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig48_HTML.jpg](img/437055_1_En_1_Fig48_HTML.jpg)\n\
    \n图 1-48 – 为应用程序启用实用程序栏的步骤\n\n7. 选择应在新应用程序中显示的项目。所选项目的顺序将从左到右显示在页面顶部（参见图 1-49）。\n\
    \n> **注意：** 最佳实践是为不同的用户组创建不同的应用程序。创建这些应用程序时，建议只显示与这些用户组相关的项目。如果用户看到过多不必要的信息，可能会感到不知所措和沮丧。\n\
    >\n> 例如，销售应用程序应仅显示与销售相关的项目，如潜在客户、客户、联系人和商机。对于服务代理，他们很可能不需要看到商机。为服务代理创建一个仅显示与服务相关项目（如联系人和案例）的应用程序。\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig49_HTML.jpg](img/437055_1_En_1_Fig49_HTML.jpg)\n\
    \n图 1-49 – 向新应用程序添加选项卡\n\n8. 点击 `Next`。\n\n9. 选择应有权访问此应用程序的配置文件（参见图 1-50）。\n\n\
    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig50_HTML.jpg](img/437055_1_En_1_Fig50_HTML.jpg)\n\
    \n图 1-50 – 向应用程序分配用户\n\n10. 点击 `Save and Finish Now`。你可以在 `App Launcher` 中找到新创建的应用程序。\n\
    \n## 公司设置\n\n公司设置包括可以自定义的设置，例如会计年度、营业时间和节假日时间、语言设置以及其他重要信息。\n\n### 公司信息\n\n在 `Quick\
    \ Find` 区域中搜索并选择 `Company Information`。`Company Information` 部分包含有关组织、许可证可用性和数据使用情况的重要信息。\n\
    \n#### 组织详细信息\n\n组织详细信息显示公司的一般信息。编辑主要联系人以建立任何技术支持请求的联系点。在此处更改区域设置、货币和新闻通讯设置（参见图\
    \ 1-51）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig51_HTML.jpg](img/437055_1_En_1_Fig51_HTML.jpg)\n\
    \n图 1-51 – 组织详细信息\n\n#### 存储使用情况\n\n每个组织都有存储限制。存储分为两类：数据存储和文件存储。要查看存储限制、存储使用情况和已使用百分比，请导航到公司设置。\n\
    \n点击 `Used Data Space` 或 `Used File Space` 旁边的 `View`，查看组织当前的存储使用情况。\n\n存储使用情况会被细分，并显示两者之间的使用百分比。信息也按对象细分，如图\
    \ 1-52 所示。使用此细分来确定哪些记录占用空间最多。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig52_HTML.jpg](img/437055_1_En_1_Fig52_HTML.jpg)\n\
    \n图 1-52 – `Storage Usage` 细分\n\n#### 用户许可证\n\n此部分显示每种许可证类型的可用许可证总数、已使用总数以及剩余可用许可证数量。这包括标准的\
    \ Salesforce 许可证，这是最常购买和分配的许可证（参见图 1-53）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig53_HTML.jpg](img/437055_1_En_1_Fig53_HTML.jpg)\n\
    \n图 1-53 – 用户许可证\n\n#### 权限集许可证\n\n权限集许可证授权用户访问其用户许可证中未包含的功能和各种工具。这可能包括 `Service\
    \ Cloud` 控制台用户、`CRM` 用户、`Analytics Cloud` 访问权限等。\n"
- fmt: "# Feature Set Licenses\n\nFeature set licenses include additional features\
    \ on top of the standard user license. These can include `Data.com`, knowledge\
    \ users, marketing users, and more.\n\n## Usage-Based Entitlements (BETA) Licenses\n\
    \nThis feature is available for a limited amount of time for an organization.\
    \ These tools can vary but are typically made available temporarily.\n\n# Fiscal\
    \ Year\n\nSet the fiscal year in Salesforce with your existing quarterly and annual\
    \ account periods in Salesforce. This information is important to have for reporting\
    \ and forecasting purposes.\n\n## Modify Fiscal Year: Standard\n\nTo modify the\
    \ standard fiscal year, navigate to the `Fiscal Year` section in `Setup` and follow\
    \ these steps (see Figure [1-54](#437055_1_En_1_Chapter.xhtml#Fig54)):\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig54_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig54_HTML.jpg)\n\
    \nFigure 1-54\n\nMaking changes to your organization’s fiscal year\n\n1. If the\
    \ Gregorian calendar year is followed by your company, choose **Standard Custom\
    \ Year**. (Select **Custom** if the standard fiscal year is not followed.)\n2.\
    \ Select **Fiscal Year Start Month**.\n3. Set whether the entered month is based\
    \ on the ending or start of the month.\n4. Click **Save**.\n5. Choose **Standard**\
    \ or **Custom Fiscal Year**.\n\n# Business Hours\n\nBusiness hours define how\
    \ the customer support team interacts with Salesforce. Specify the hours the support\
    \ team is available to resolve cases. Salesforce will adjust the hours to sync\
    \ with escalation rules, milestones, cases, and entitlement processes. Use the\
    \ following steps to get started:\n\n1. Select `Business Hours` in the `Quick\
    \ Find` area.\n2. Click **New Business Hours** to navigate to the edit page (see\
    \ Figure [1-55](#437055_1_En_1_Chapter.xhtml#Fig55)).\n\n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig55_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig55_HTML.jpg)\n\
    \n   Figure 1-55\n\n   Making changes to your organization’s business hours\n\n\
    3. Give it a specific name.\n4. Select the time zone.\n5. Specify the business\
    \ hours.\n6. Click **Active** to activate these hours.\n7. Click **Save** to use\
    \ these business hours as the default.\n\n## Summary\n\nThis chapter served as\
    \ an introduction to the new intelligence and sophistication of Salesforce Lightning.\
    \ In this chapter, we covered how to migrate from Classic to Lightning and prepared\
    \ your organization for success with getting set up. The next chapter will discuss\
    \ how to get the most out of Sales Cloud in Lightning.\n\n# 2. Sales Cloud Lightning\n\
    \nThe Sales Cloud gives sales and marketing professionals the ability to increase\
    \ sales productivity and revenue at lightning speeds. You can see the complete\
    \ customer journey from a prospective lead to an active customer by recording\
    \ leads, accounts, contacts, opportunities, and campaigns. In Sales Cloud Lightning,\
    \ leads are captured, nurtured, and seamlessly converted into active accounts\
    \ or prospects. Sales leaders can then manage their sales pipeline with opportunity\
    \ tracking to effectively close more deals (Figure [2-1](#437055_1_En_2_Chapter.xhtml#Fig1)).\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig1_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig1_HTML.jpg)\n\
    \nFigure 2-1\n\nNew kanban feature on the `Opportunities` object in Sales Cloud\n\
    \n## Lead Management\n\nAcross different business models, a lead in Salesforce\
    \ can be an individual, organization, or entity. The `Lead` object can act as\
    \ a holding bucket of all prospects stored in Salesforce. Leads come from a variety\
    \ of sources. So, it’s a good idea to use the lead area to track important information\
    \ about your leads, including contact information and notes.\n\nYour leads may\
    \ come from various entry points and may be a result of your marketing efforts.\
    \ Use the `Lead` object to manage and nurture your leads as they are being worked\
    \ through the qualification process. This can include leads that come from your\
    \ web site via a `Web to Lead`, purchased lists, referrals, networking events,\
    \ and others. Use this information to tell which channels your best leads come\
    \ from.\n\nFor example, create a lead record for the prospect you met at your\
    \ latest marketing event. Include important contact information about your lead,\
    \ add notes, and create follow-up tasks to prevent leads from slipping through\
    \ the cracks. Generate a report to see where most of your qualified leads come\
    \ from. Use this information to put your marketing dollars in the most effective\
    \ places.\n\n## Lead Conversion\n\nOnce you qualify your lead as a firm prospect,\
    \ you can convert your lead into an account, contact, and opportunity. When you\
    \ convert a lead in Salesforce, standard lead fields populate the new account,\
    \ contact, and opportunity records.\n\nBusiness leads create a business account,\
    \ business contact, and opportunity. Individual customers, when converted, create\
    \ a persons account and opportunity.\n\n### Note\n\nNot all business models use\
    \ leads. However, lead tracking in Salesforce is a useful method for separating\
    \ untouched leads from more promising prospects in the database. Identify your\
    \ business process to determine the point of conversion."
