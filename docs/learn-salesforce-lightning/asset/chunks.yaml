  trans: "\n### 用户的 Chatter 通知配置\n\n之前的设置将允许您的用户使用 Chatter。现在我们来介绍用户如何选择接收 Chatter\
    \ 通知。\n\n1.  点击浏览器右上角的个人资料图片，然后点击“设置”，如图 6-23 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig23_HTML.jpg](img/437055_1_En_6_Fig23_HTML.jpg)\n\
    \n    图 6-23\n    访问个人资料\n\n2.  在“快速查找”区域，输入**电子邮件通知**，然后在 Chatter 下选择“电子邮件通知”。\n\
    \n3.  选择最符合您需求的选项。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig25_HTML.jpg](img/437055_1_En_6_Fig25_HTML.jpg)\n\
    \n    图 6-25\n    配置您要接收的 Chatter 电子邮件\n\n    *   在“常规”部分，您必须选择**接收电子邮件**才能接收\
    \ Chatter 电子邮件，如图 6-24 所示。\n\n        ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig24_HTML.jpg](img/437055_1_En_6_Fig24_HTML.jpg)\n\
    \n        图 6-24\n        开启**接收电子邮件**\n\n    *   在“个人”部分，对于“当有人……时给我发邮件”，我们建议选择以下选项，因为如果选中所有选项，用户可能会被过多的电子邮件通知淹没：\n\
    \        *   *在我的个人资料上发布内容*：此选项将使您随时了解您个人资料上发布的任何内容。\n        *   *对我个人资料上的帖子发表评论*：此选项将在您的帖子收到任何评论时通知您。\n\
    \        *   *对我收藏的项目发表评论*：这会让您随时了解任何收藏帖子的最新动态。\n        *   *在帖子中提及我*：这将通知您用户何时使用\
    \ `@` 符号将帖子指向您或在帖子中提及您。\n        *   *在评论中提及我*：这将通知您用户何时使用 `@` 符号将评论指向您或在评论中提及您。\n\
    \n4.  选择个人摘要的频率。您的个人摘要是 Chatter 中近期活动的摘要，会显示在您自己的信息流中。您可以选择每天、每周接收或从不接收，如图 6-26\
    \ 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig26_HTML.jpg](img/437055_1_En_6_Fig26_HTML.jpg)\n\
    \n    图 6-26\n    选择每天、每周或从不接收电子邮件\n\n5.  您还可以设置接收群组 Chatter 通知的频率。我们建议对新群组选择“有限”；如果您想要更高频率，可以为每个单独的群组更改设置，如图\
    \ 6-27 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig27_HTML.jpg](img/437055_1_En_6_Fig27_HTML.jpg)\n\
    \n    图 6-27\n    选择要从 Chatter 接收的内容\n\n6.  您还可以选择接收群组客户问题的频率，如图 6-28 所示。我们也建议这里选择“有限”。如果您选择其他选项，可能会收到超出预期的电子邮件，这可能会导致更多的干扰而非帮助。\n\
    \n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig28_HTML.jpg](img/437055_1_En_6_Fig28_HTML.jpg)\n\
    \n    图 6-28\n    选择要接收哪些客户问题的通知\n\n## 信息流跟踪\n\n与 Chatter 集成的 Salesforce 信息流跟踪允许您查看在\
    \ Chatter 信息流中记录的对记录所做的更改。在对象上启用此选项后，用户可以在 Chatter 信息流中关注对该记录所做的更改。您可以选择哪些对象以及在信息流中跟踪哪些字段。您可以跟踪以下对象上的字段：`User`、`Group`、自定义和外部标准对象、`Account`、`Article\
    \ Type`、`Asset`、`Campaign`、`Case`、`Contact`、`Contract`、`Dashboard`、`Event`、`Lead`、`Opportunity`、`Product`、`Report`、`Solution`\
    \ 和 `Task`。\n\n### 注意\n\nChatter 信息流中也使用了字段级安全性和共享设置来确定用户在信息流中可以看到什么。\n\n### 启用和自定义信息流跟踪\n\
    \n请执行以下步骤：\n\n1.  点击浏览器右上角的设置齿轮图标，然后选择“设置”，如图 6-29 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig29_HTML.jpg](img/437055_1_En_6_Fig29_HTML.jpg)\n\
    \n    图 6-29\n    导航到“设置”菜单\n\n2.  在“快速查找”区域，输入 **Feed Tracking**，然后选择 Chatter\
    \ 下的“Feed Tracking”，如图 6-30 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig30_HTML.jpg](img/437055_1_En_6_Fig30_HTML.jpg)\n\
    \n    图 6-30\n    导航到信息流跟踪\n\n3.  在左侧，点击您要为信息流跟踪配置的对象，如图 6-31 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig31_HTML.jpg](img/437055_1_En_6_Fig31_HTML.jpg)\n\
    \n    图 6-31\n    设置信息流跟踪\n\n4.  在顶部，确保选中“启用信息流跟踪”。\n\n5.  每个对象最多选择 20 个要跟踪的字段。如果您不想在\
    \ Chatter 中跟踪特定字段的更改，则无需在此处选择任何字段。通过选择要跟踪的单个字段，这将捕获在 Chatter 中所做的更改。信息流跟踪的示例请参见图\
    \ 6-32。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig32_HTML.jpg](img/437055_1_En_6_Fig32_HTML.jpg)\n\
    \n    图 6-32\n    信息流跟踪在 Chatter 中的显示方式\n\n    **注意** 您选择的字段越多，Chatter 记录信息流就会变得越混乱。对所选字段的任何更改都会为该记录信息流添加一个新帖子，并将较旧的帖子推至下方。\n\
    \n6.  所有对象都设置完成后，点击“保存”按钮。\n\n## Chatter 个人资料\n\nSalesforce Chatter 个人资料允许您的用户自定义其\
    \ Salesforce 个人资料，这些资料可供其他 Salesforce 用户和 Chatter 免费用户（通常是客户）查看。他们可以添加个人资料图片、编写“关于我”部分、添加联系信息以及添加横幅照片。个人资料是您的用户查看其\
    \ Chatter 信息流、所属群组、在帖子中上传的文件、正在关注的人以及关注他们的人的另一种方式。他们甚至可以从自己的个人资料添加新帖子或对现有帖子发表评论。\n\
    \n要访问您的个人资料，请点击右上角的个人资料图片，然后点击您的姓名，如图 6-33 所示。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig33_HTML.jpg](img/437055_1_En_6_Fig33_HTML.jpg)\n\
    \n图 6-33\n导航到您的个人资料\n\n其他用户可以通过点击您在记录、Chatter 帖子或其他任何地方看到的超链接姓名来访问您的个人资料，如图 6-34\
    \ 所示。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig34_HTML.jpg](img/437055_1_En_6_Fig34_HTML.jpg)\n\
    \n图 6-34\n访问其他用户的个人资料\n"
- fmt: "### Uploading Your Profile Picture\n\nTo upload your profile picture, follow\
    \ these steps:\n\n1. Once you have reached your profile, you can click the camera\
    \ symbol and click `Update Photo`, as shown in Figure [6-35](#437055_1_En_6_Chapter.xhtml#Fig35).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig35_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig35_HTML.jpg)\n\
    \n   Figure 6-35: Uploading your profile picture\n\n   **Note:** Your photo must\
    \ be stored on your computer. It has to be in JPEG, GIF, or PNG format, and the\
    \ file size must be smaller than 16MB.\n\n2. Click the `Upload Image` button and\
    \ choose the image from your computer location, as shown in Figure [6-36](#437055_1_En_6_Chapter.xhtml#Fig36).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig36_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig36_HTML.jpg)\n\
    \n   Figure 6-36: Uploading your profile picture from your computer\n\n3. Use\
    \ the slide bar to resize your photo. Select the check box “Show my photo on publicly\
    \ accessible pages” if you want your photo disabled outside of Salesforce, as\
    \ shown in Figure [6-37](#437055_1_En_6_Chapter.xhtml#Fig37).\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig37_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig37_HTML.jpg)\n\
    \n   Figure 6-37: Modifying the size of your image\n\n4. Once complete, click\
    \ `Save`.\n\n### Editing Your Profile\n\nTo edit your profile, follow these steps:\n\
    \n1. Go to your profile by clicking your profile picture found in the upper-right\
    \ corner of your browser, as shown in Figure [6-38](#437055_1_En_6_Chapter.xhtml#Fig38).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig38_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig38_HTML.jpg)\n\
    \n   Figure 6-38: Editing your profile\n\n2. Click the word `Edit` found under\
    \ your tabs on the right side of your browser, as shown in Figure [6-39](#437055_1_En_6_Chapter.xhtml#Fig39).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig39_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig39_HTML.jpg)\n\
    \n   Figure 6-39: Edit button\n\n3. You can edit any field here on the profile\
    \ just like any field in Salesforce. Let others know who your manager is, add\
    \ the title that you hold with your company, add a phone number and cell phone\
    \ number, add your office location, and, of course, don’t forget to tell your\
    \ other users a little bit about yourself in the `About Me` section, as shown\
    \ in Figure [6-40](#437055_1_En_6_Chapter.xhtml#Fig40).\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig40_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig40_HTML.jpg)\n\
    \n   Figure 6-40: Editing your profile\n\n4. Once complete, click `Save`.\n\n\
    ### Updating Your Header Photo\n\nTo update your header photo, follow these steps:\n\
    \n1. Click the camera image in the right corner above the `Edit` button, click\
    \ the “Select an image” button, find your image on your computer, and click `Open`,\
    \ as shown in Figure [6-41](#437055_1_En_6_Chapter.xhtml#Fig41).\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig41_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig41_HTML.jpg)\n\
    \n   Figure 6-41: Uploading your banner\n\n   **Note:** Your photo must be stored\
    \ on your computer. It has to be in JPEG, GIF, or PNG format. For the best results,\
    \ use a panoramic image that is at least 1280×300 pixels.\n\n2. Adjust your photo\
    \ to fit the area provided. If you find that the photo won’t work, click “Choose\
    \ a different photo” to upload a new one, as shown in Figure [6-42](#437055_1_En_6_Chapter.xhtml#Fig42).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig42_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig42_HTML.jpg)\n\
    \n   Figure 6-42: Modifying the size of your banner\n\n3. Click `Save` when complete.\n\
    \n   After your user completes their profile, it should look like Figure [6-43](#437055_1_En_6_Chapter.xhtml#Fig43).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig43_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig43_HTML.jpg)\n\
    \n   Figure 6-43: Complete user profile\n\n## Salesforce Mobile App for iPhone\
    \ and Android Users\n\nSalesforce, the mobile app for iPhone and Android users,\
    \ is included in every Salesforce license and, for the most part, can be downloaded\
    \ and used immediately, as shown in Figure [6-44](#437055_1_En_6_Chapter.xhtml#Fig44).\
    \ Users can download the app from the App Store or Google Play and start using\
    \ it today! Salesforce can work out of the box because it uses metadata to see\
    \ what you’ve built and configured in the desktop environment. However, with that\
    \ said, not everything you may have customized will be easy to use on the mobile\
    \ app. Some of the changes you may need to configure are “quick action” items\
    \ such as creating a task, logging a call, and creating a new lead or contact.\
    \ Or you may need to configure compact layouts, which allow your user to see the\
    \ most important detail of a record instead of the whole-page layout of fields.\
    \ Lastly, the mobile navigation allows you to place actions and objects in a user-friendly\
    \ order. Making sure that the Salesforce app is configured and available for your\
    \ users will help your users’ productivity. If you have users who are on the road\
    \ or meeting with clients outside of the office, the Salesforce app provides access\
    \ to the records that they would be working with if they were in office or on\
    \ the phone. Giving your users access to the mobile app will help them to capture\
    \ necessary information when they are away from their desks. Also, if your user\
    \ is out of the office and needs to find a client’s number quickly or an address,\
    \ they can use the mobile app to do that.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig44_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig44_HTML.jpg)\n\
    \nFigure 6-44: Salesforce mobile app"
