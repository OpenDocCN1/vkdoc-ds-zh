    \ others. Use this information to tell which channels your best leads come from.\n\
    \nFor example, create a lead record for the prospect you met at your latest marketing\
    \ event. Include important contact information about your lead, add notes, and\
    \ create follow-up tasks to prevent leads from slipping through the cracks. Generate\
    \ a report to see where most of your qualified leads come from. Use this information\
    \ to put your marketing dollars in the most effective places.\n\n### Lead Conversion\n\
    \nOnce you qualify your lead as a firm prospect, you can convert your lead into\
    \ an account, contact, and opportunity. When you convert a lead in Salesforce,\
    \ standard lead fields populate the new account, contact, and opportunity records.\n\
