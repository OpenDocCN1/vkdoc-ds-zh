    \ for all leads coming from my web site, as shown in Figure [2-53](#437055_1_En_2_Chapter.xhtml#Fig53).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig53_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig53_HTML.jpg)\n\
    \n    Figure 2-53\n\n    Setting the criteria for auto-response rule\n\n8.  Select\
    \ the criteria for this rule to be triggered. This rule will be triggered when\
    \ any lead has the source Web.\n\n9.  Type the name of the sender.\n\n10.  Type\
    \ the email address of the sender.\n\n11.  Select the email template to be used.\n\
    \n12.  Click Save. Now any lead that meets the criteria you set will automatically\
    \ receive an email using the template you chose.\n\n## Create a Lead Assignment\
    \ Rule\n\nAutomate your lead routing process by creating a lead assignment rule\
    \ New leads can automatically be assigned to a user or queue based on the condition\
    \ that is set.\n\n1.  Click Setup.\n\n2.  Search for *Lead Assignment Rules* in\
    \ Quick Find and select it.\n\n3.  Click the New button.\n\n4.  Give the rule\
    \ a name and type it here.\n\n5.  Select Active to activate this rule; only one\
    \ rule can be active at a time.\n\n6.  Click Save.\n\n7.  Select the rule name.\n\
    \n8.  Click the New button in the Rule Entry section, as shown in Figure [2-54](#437055_1_En_2_Chapter.xhtml#Fig54).\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig54_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig54_HTML.jpg)\n\
    \n    Figure 2-54\n\n    List of lead assignment rules\n\n9.  Salesforce will\
    \ evaluate each entry based on the sort order. Set the sort order for this rule.\n\
    \n10.  Set the criteria for this rule by selecting the field, the appropriate\
    \ operator, and the value. In this example, I am creating the rule for all leads\
    \ coming from the state of California.\n\n11.  Determine whether leads that meet\
    \ this criteria should be assigned to a user or queue. Type the name of the user\
    \ or queue.\n\n12.  Click Save."
  trans: "\n### 创建新任务\n\n按以下步骤创建新任务，如图 2-45 所示：\n\n1. 输入任务的主题。\n2. 输入任务截止日期。该截止日期用于在任务即将到期或逾期时发出通知。\n\
    3. 在`相关`部分将任务与`Salesforce`中的其他记录关联。默认情况下，创建任务的人即为`分配给`的人员。只需点击`x`并选择应分配任务的人员，即可更改此设置。\n\
    4. 选择状态。`未开始`、`进行中`、`已完成`、`等待他人`和`已推迟`是标准状态值。\n5. 点击`保存`。成功创建任务记录后会显示一条消息，如图 2-46\
    \ 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig46_HTML.jpg](img/437055_1_En_2_Fig46_HTML.jpg)\n\
    \n   图 2-46 — 任务创建成功消息\n\n6. 任务已保存并记录在`后续步骤`部分。已完成的任务会移至`过往活动`区域并显示，如图 2-47 所示。\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig47_HTML.jpg](img/437055_1_En_2_Fig47_HTML.jpg)\n\
    \n   图 2-47 — 后续步骤部分\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig45_HTML.jpg](img/437055_1_En_2_Fig45_HTML.jpg)\n\
    \n图 2-45 — 创建新任务的步骤\n\n### 创建新事件\n\n追踪与您的线索或联系人相关的任何事件。事件将包含开始日期和结束日期。\n\n按照以下步骤为线索记录创建新事件，并参考图\
    \ 2-48。\n\n1. 选择`新建事件`选项卡，如图 2-46 所示。\n2. 输入事件的主题。\n3. `Salesforce`中的每个事件都必须有开始日期和结束日期。在此处输入这些详细信息。\n\
    4. 如果这是一个全天事件，请选中该复选框。\n5. 如果事件有地点，请在`地点`中输入地点详细信息。此为可选操作。\n6. 如果事件与某个客户相关联，请搜索相关客户以关联两者，如图\
    \ 2-49 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig49_HTML.jpg](img/437055_1_En_2_Fig49_HTML.jpg)\n\
    \n   图 2-49 — 事件页面上的“关联至”和“分配给”字段\n\n7. 任务和事件可以分配给其他`Salesforce`用户。选择应将任务分配给谁，如图\
    \ 2-49 所示。\n8. 点击`保存`。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig48_HTML.jpg](img/437055_1_En_2_Fig48_HTML.jpg)\n\
    \n图 2-48 — 创建新事件的步骤\n\n### 创建网络线索表单\n\n借助网络线索表单，可以从您的网站即时生成`Salesforce`中的线索。例如，在您的网站上创建一个`联系我们`表单，用于在`Salesforce`中创建新的线索记录。创建自定义字段以跟踪来自您网站的特定信息并将其纳入`Salesforce`。\n\
    \n按以下步骤创建网络线索表单：\n\n1. 点击`设置`。\n2. 在`快速查找`部分搜索`web-to-lead`。\n3. 点击`创建网络线索表单`。\n\
    4. 标准和自定义字段会显示在`可用字段`多选选择列表中，如图 2-50 所示。将字段添加到`已选择字段`列，以显示在您的网络线索表单上。\n\n   **注意：**\
    \ 公式字段不可选择。\n\n5. 用户提交网络线索表单后，将被引导至指定的返回 URL。在此处输入返回 URL。请注意，这通常是一个感谢页面。\n6. 选中此复选框以启用`reCaptcha`来防止垃圾邮件。建议启用。\n\
    7. 要使用此功能，请访问 Google `reCaptcha` 网站，点击`获取 reCaptcha` 注册域名。获取后，在此处输入 API 密钥对。\n\
    8. 如果 Google 服务器宕机，请选中此框，以允许所有流量和线索无需`reCaptcha`即可生成。\n\n**注意：** 您可以在 24 小时内最多生成\
    \ 500 个线索。超过此数量的任何额外线索将被放入队列。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig50_HTML.jpg](img/437055_1_En_2_Fig50_HTML.jpg)\n\
    \n图 2-50 — 网络线索设置页面\n\n### 创建网络线索自动回复规则\n\n通过向从您的网站捕获的线索发送自动回复消息，改善您的客户沟通。例如，创建一个自动回复规则，通知客户您已收到他们的提交，并将在\
    \ 24 小时内联系他们。\n\n1. 点击图 2-51 中所示的`新建`按钮。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig51_HTML.jpg](img/437055_1_En_2_Fig51_HTML.jpg)\n\
    \n   图 2-51 — 创建新的网络线索自动回复规则\n\n2. 为图 2-52 中所示的自动回复规则命名。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig52_HTML.jpg](img/437055_1_En_2_Fig52_HTML.jpg)\n\
    \n   图 2-52 — 命名自动回复规则\n\n3. 选择`启用`以激活规则。\n4. 点击`保存`。\n5. 选择已创建的规则。\n6. 点击`规则条目`部分的`新建`。\n\
    7. 确定排序顺序并设置所需条件。在此示例中，我为所有来自我网站的线索创建了一个自动回复规则，如图 2-53 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig53_HTML.jpg](img/437055_1_En_2_Fig53_HTML.jpg)\n\
    \n   图 2-53 — 设置自动回复规则的条件\n\n8. 选择触发此规则的条件。当任何线索的来源为`Web`时，将触发此规则。\n9. 输入发件人姓名。\n\
    10. 输入发件人电子邮件地址。\n11. 选择要使用的电子邮件模板。\n12. 点击`保存`。现在，任何符合您所设置条件的线索将自动收到一封使用您所选模板的电子邮件。\n\
    \n### 创建线索分配规则\n\n通过创建线索分配规则来自动化您的线索路由流程。可以根据设置的条件将新线索自动分配给某个用户或队列。\n\n1. 点击`设置`。\n\
    2. 在`快速查找`中搜索`线索分配规则`并选择它。\n3. 点击`新建`按钮。\n4. 为规则命名并在此处输入。\n5. 选择`启用`以激活此规则；一次只能激活一个规则。\n\
    6. 点击`保存`。\n7. 选择规则名称。\n8. 点击`规则条目`部分的`新建`按钮，如图 2-54 所示。\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig54_HTML.jpg](img/437055_1_En_2_Fig54_HTML.jpg)\n\
    \n   图 2-54 — 线索分配规则列表\n\n9. `Salesforce`将根据排序顺序评估每个条目。为此规则设置排序顺序。\n10. 通过选择字段、适当的运算符和值来设置此规则的条件。在此示例中，我为所有来自加利福尼亚州的线索创建规则。\n\
    11. 确定符合此条件的线索应分配给用户还是队列。输入用户或队列的名称。\n12. 点击`保存`。\n"
- fmt: "# Create a Lead Queue\n\nManage your workload by controlling the way leads\
    \ are assigned. Leads are bucketed into these queues for group members to view\
    \ and accept. Lead records remain in queue until a user accepts.\n\n1. From `Setup`,\
    \ go to `Queues`.\n2. Click the `New` button shown in Figure [2-55](#437055_1_En_2_Chapter.xhtml#Fig55).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig55_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig55_HTML.jpg)\n\
    \n   Figure 2-55\n\n   Lead queue\n\n3. Type the name of the queue.\n4. To notify\
    \ group members that a lead has been added to a queue, enter the queue email and\
    \ select `Send Email to Members`.\n5. Select `Lead` and move to `Selected Objects`.\n\
    6. Choose the queue members as shown in Figure [2-56](#437055_1_En_2_Chapter.xhtml#Fig56)\
    \ and move them to `Selected Members`. You can define the selected members by\
    \ users, roles, and groups.\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig56_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig56_HTML.jpg)\n\
    \n   Figure 2-56\n\n   Adding members to a queue\n\n7. Click `Save`. Now lead\
    \ records will be placed in the queue if they meet the criteria. Queue members\
    \ will have the ability to view those leads and pull from this queue.\n\n## Create\
    \ a Campaign\n\nMarketing professionals can use this powerful tool to track any\
    \ marketing initiatives and efforts. Track the response and conversion rates to\
    \ ultimately calculate return on investment (ROI). Use these metrics to confirm\
    \ the effectiveness of your marketing efforts. Campaigns can be an effective tool\
    \ to improve future marketing efforts.\n\nFollow these steps to create a campaign\
    \ and add campaign members:\n\n1. Select `New Campaign` from the `Campaign` tab,\
    \ as shown in Figure [2-57](#437055_1_En_2_Chapter.xhtml#Fig57).\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig57_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig57_HTML.jpg)\n\
    \n   Figure 2-57\n\n   Campaigns tab and list view\n\n2. Type the name of your\
    \ campaign, as shown in Figure [2-58](#437055_1_En_2_Chapter.xhtml#Fig58).\n\n\
    \   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig58_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig58_HTML.jpg)\n\
    \n   Figure 2-58\n\n   Campaign edit page\n\n3. Fill in the details about your\
    \ campaign. Include the type of campaign, the start date and end date of the campaign,\
    \ and other important information.\n4. Click the `Active` check box to make the\
    \ campaign active and current.\n5. Click `Save`.\n\n   Once the campaign is active,\
    \ you’ll want to add campaign members. This will tie everything together. Campaign\
    \ members are the leads and contacts that you associate to any given campaign.\n\
    \n   Note that a lead and contact have a many-to-one relationship. This means\
    \ that they can be associated to many campaigns. Click `Add Leads` to associate\
    \ lead records or click `Add Contacts` to associate contact records (Figure [2-59](#437055_1_En_2_Chapter.xhtml#Fig59)).\
    \ These leads and contacts are considered campaign members to your campaign.\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig59_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig59_HTML.jpg)\n\
    \n   Figure 2-59\n\n   Adding leads and contacts to your campaigns as campaign\
    \ members\n\n6. Select the records that should be associated as campaign members\
    \ and select `Add to Campaign`, as shown in Figure [2-60](#437055_1_En_2_Chapter.xhtml#Fig60).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig60_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig60_HTML.jpg)\n\
    \n   Figure 2-60\n\n   Adding campaign members\n\n   Campaign members provide\
    \ reporting on the response rates of your campaign. Salesforce tracks these efforts\
    \ by using these standard values: `Sent` and `Responded`.\n\n7. Enter the campaign\
    \ that this record should be associated with.\n8. Define the member status as\
    \ existing or update the member status as `Sent` or `Responded` (see Figure [2-61](#437055_1_En_2_Chapter.xhtml#Fig61)).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig61_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig61_HTML.jpg)\n\
    \n   Figure 2-61\n\n   Steps to associate the campaign and status that the selected\
    \ campaign members should have\n\n9. Click `Submit`. Salesforce will generate\
    \ a success message, as shown in Figure [2-62](#437055_1_En_2_Chapter.xhtml#Fig62).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig62_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig62_HTML.jpg)\n\
    \n   Figure 2-62\n\n   Campaign member success message\n\n## Summary\n\nSales\
    \ Cloud provides effective tools to connect your sales and marketing teams. Sales\
    \ Cloud sets the foundation for your CRM needs and provides insightful information\
    \ into your opportunity pipeline.\n\n# 3. Salesforce Service Cloud\n\nSalesforce\
    \ Service Cloud allows your customer service representatives and support representatives\
    \ (users) to manage, track, and resolve customer inquiries and issues. The Service\
    \ Cloud application uses the `Case` object to capture all the details needed to\
    \ help them to resolve the inquiries and issues. Your users can manually create\
    \ cases for requests via phone and in person or accept cases from multiple channels\
    \ (e.g., web forms, email, real-time web chat, online communities, and social\
    \ media outlets). You can allow your users to efficiently manage these channels\
    \ by setting up case assignment rules. The Salesforce Service Cloud application\
    \ also allows you to create case escalation rules when an issue needs to be escalated\
    \ to management. Tracking the various customer inquiries your company brings in\
    \ could even help you to establish new procedures. It also will help you to understand\
    \ any weak points within your company. Figure [3-1](#437055_1_En_3_Chapter.xhtml#Fig1)\
    \ shows the internal communication that can take place in Service Cloud. In short,\
    \ the application can help to resolve issues with customers faster.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig1_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1\n\nInternal communication\n\n## Overview of Salesforce Case Management\n\
    \nSalesforce case management allows users to capture the necessary details of\
    \ the `Case` object to manage and successfully resolve their case. Users can see\
    \ important case details in 29 standard fields as well as create their own custom\
    \ fields. They can keep track of the status of a case with a drop-down field with\
    \ values such as `New`, `Working`, `Escalated`, and `Closed`. Users can also access\
    \ all the necessary connected objects such as the account, contact detail, and\
    \ product information. Giving users access to the account and contact details\
    \ will allow them to get a full view of the customer submitting the case. They\
    \ can assign the case to a `High`, `Medium`, or `Low` priority based on the case\
    \ submission as well as set up their page layout to best fit their needs and the\
    \ needs of the company."
