    users. However, users can be assigned only one profile. Typically, profiles are
    assigned to users by their job function. This is usually because those with the
    same job description often require similar levels of access.


    For example, you may have different security requirements for your marketing users,
    service agents, sales reps, and developers. It’s recommended that you create or
    modify profiles to meet their specific requirements.


    #### Profile Home Page


    We suggest familiarizing yourself with the different profile settings on the profile
    home page. This page is broken down into the following permissions and settings.


    ##### Console Settings


    Click Edit to control the console settings for each profile (shown in Figure [9-3](#437055_1_En_9_Chapter.xhtml#Fig3)).


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig3_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig3_HTML.jpg)


    Figure 9-3


    Console Settings


    ##### Page Layouts


    Page layouts can be configured for each profile. Click View Assignment next to
    each desired object to configure a different page layout for a profile (shown
    in Figure [9-4](#437055_1_En_9_Chapter.xhtml#Fig4)).


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig4_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    You can control page layouts for each object at the profile level .


    #### Field-Level Security


    Once object-level access and record-level access are granted, you can control
    what fields are visible at the profile level. Navigate to the field level and
    click View next to the desired object to control the level of access that a profile
    should have to a field. Once you click View, you will see a list of all fields
    related to that object and the current field-level permissions. Click Edit to
    make changes to the appropriate field (shown in Figure [9-5](#437055_1_En_9_Chapter.xhtml#Fig5)).


    Click Read Access to make a field visible. Select Edit Access to allow users to
    view and edit a field. Deselect Read Access and Edit Access to make a field hidden.


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig5_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig5_HTML.jpg)


    Figure 9-5


    Field-level security at the account level


    Let’s look at an example. Say Michael Scott Paper Co. uses Salesforce to track
    sales and accounting information. However, the CEO, Michael Scott, does not want
    sales representatives to see sensitive financial information such as credit card
    and Social Security numbers.


    To solve this, create a profile for sales representatives and another profile
    for accounting. For each profile, click View Assignment next to the account and
    edit the field security. For the sales representatives profile , deselect Read
    Access and Edit Access in the Credit Card and Social Security fields. This will
    hide both fields from users assigned to the sales representative profile. Log
    in as a user assigned to the sales representative profile to test your work.


    ##### App and Tab Settings


    Specify what apps are visible and set the default in the Custom App Settings section
    of the profile (shown in Figure [9-6](#437055_1_En_9_Chapter.xhtml#Fig6)).


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig6_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig6_HTML.jpg)


    Figure 9-6


    Custom App Settings area in a profile


    ##### Record Type Settings


    Record types can be assigned at the profile level. For objects with record types,
    add the record type next to the appropriate object.


    ##### Administrative and General User Permissions


    Profiles have two types of permissions: Administrative and General, as shown in
    Figures [9-7](#437055_1_En_9_Chapter.xhtml#Fig7) and [9-8](#437055_1_En_9_Chapter.xhtml#Fig8).
    Familiarize yourself with the granular types of permissions so you can better
    administer a secure organization.


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig8_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig8_HTML.jpg)


    Figure 9-8


    General User Permissions section at the profile level


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig7_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig7_HTML.jpg)


    Figure 9-7


    Administrative Permissions section located in a profile'
  trans: '

    # 9. 安全概览


    Salesforce 致力于运营最安全的云平台。保护数据完整性和隐私是 Salesforce 商业模式的核心。Salesforce 采用多层架构来保障安全，支持更高的灵活性和保护性。系统管理员可以完全控制授予最终用户的访问级别。您可以使用
    `profiles`、`permission sets`、字段级安全性、共享规则等来保护敏感信息并管理最终用户的可访问性。请访问 Salesforce Trust
    网站 [`http://trust.salesforce.com`](http://trust.salesforce.com)（图 9-1），以透明地获取安全威胁和建议。


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig1_HTML.jpg](img/437055_1_En_9_Fig1_HTML.jpg)


    图 9-1


    Salesforce Trust 网站


    ## Salesforce 安全模型


    控制对您 Salesforce 组织的访问级别对于确保客户和数据保护至关重要。虽然 Salesforce 致力于最高级别的数据保护，但您的系统管理员应配置安全设置，以使系统尽可能安全。通过考虑数据的主要风险来设计安全计划，然后了解
    Salesforce 共享架构及其组件，以正确配置您的安全设置。


    基础知识 数据可以在 Salesforce 中的不同级别进行保护和分层。访问权限通过三种方式保护：对象级别、字段级别和记录级别。用数据库术语来说，对象就是一张表。`Objects`
    保存可能相关的信息分组。这包括存在于其中的记录。`Records` 是表中包含的信息行。


    `Accounts`、`contacts` 和 `opportunities` 只是标准 Salesforce 对象的几个示例。图 9-2 显示了 `Account`
    对象中账户记录的列表视图。Cloud Creations HQ 是 `Account` 对象中账户记录的一个示例，如图 9-2 所示。


    每条记录都存储关键信息片段。这些被称为 `fields`。用数据库术语来说，字段是表中的列。在图 9-2 中，账户名称、账户站点和电话都是账户记录中字段的示例。请参阅图
    9-2 来识别对象、记录和字段之间的区别。


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig2_HTML.jpg](img/437055_1_En_9_Fig2_HTML.jpg)


    图 9-2


    识别对象、记录和字段


    ## 简档和权限集


    `Profiles` 包含一组设置，用于确定用户或用户组在 Salesforce 中可以看到和执行的操作。`permission set` 包含相同的管理设置集合，但可以作为额外的权限层分配给单个用户或用户组。


    ### 注意


    最佳实践是为单个用户分配 `permission set`，而不是创建无数个简档来分配适当的设置和权限。


    ### 简档


    所有用户都必须分配一个 `profile`，并且一个简档可以分配给多个用户。但是，一个用户只能被分配一个简档。通常，简档根据用户的工作职能进行分配。这通常是因为具有相同工作描述的用户通常需要相似的访问级别。


    例如，您可能为营销用户、客服人员、销售代表和开发人员设置不同的安全要求。建议您创建或修改简档以满足他们的特定要求。


    #### 简档主页


    我们建议您熟悉简档主页上的不同简档设置。此页面分为以下权限和设置。


    ##### 控制台设置


    点击 `Edit` 以控制每个简档的控制台设置（如图 9-3 所示）。


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig3_HTML.jpg](img/437055_1_En_9_Fig3_HTML.jpg)


    图 9-3


    控制台设置


    ##### 页面布局


    可以为每个简档配置页面布局。点击所需对象旁边的 `View Assignment`，为简档配置不同的页面布局（如图 9-4 所示）。


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig4_HTML.jpg](img/437055_1_En_9_Fig4_HTML.jpg)


    图 9-4


    您可以在简档级别控制每个对象的页面布局。


    ##### 字段级安全性


    一旦授予了对象级访问权限和记录级访问权限，您就可以控制在简档级别哪些字段可见。导航到字段级别，点击所需对象旁边的 `View`，以控制简档应对某个字段拥有的访问级别。点击
    `View` 后，您将看到与该对象相关的所有字段列表以及当前的字段级权限。点击 `Edit` 以更改相应字段（如图 9-5 所示）。


    点击 `Read Access` 可使字段可见。选择 `Edit Access` 以允许用户查看和编辑字段。取消选择 `Read Access` 和 `Edit
    Access` 可使字段隐藏。


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig5_HTML.jpg](img/437055_1_En_9_Fig5_HTML.jpg)


    图 9-5


    账户级别的字段级安全性


    让我们看一个例子。假设 Michael Scott Paper Co. 使用 Salesforce 来跟踪销售和会计信息。但是，CEO Michael Scott
    不希望销售代表看到敏感的财务信息，如信用卡号和社会安全号码。


    为了解决这个问题，为销售代表创建一个简档，为会计部门创建另一个简档。对于每个简档，点击账户旁边的 `View Assignment` 并编辑字段安全性。对于销售代表简档，取消选择信用卡和社会安全号码字段中的
    `Read Access` 和 `Edit Access`。这将从分配给销售代表简档的用户那里隐藏这两个字段。以分配给销售代表简档的用户身份登录以测试您的操作。


    ##### 应用程序和选项卡设置


    在简档的 `Custom App Settings` 部分指定哪些应用程序可见并设置默认值（如图 9-6 所示）。


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig6_HTML.jpg](img/437055_1_En_9_Fig6_HTML.jpg)


    图 9-6


    简档中的自定义应用程序设置区域


    ##### 记录类型设置


    记录类型可以在简档级别分配。对于有记录类型的对象，请在相应对象旁边添加记录类型。


    ##### 管理权限和常规用户权限


    简档有两种权限类型：管理权限和常规权限，如图 9-7 和 9-8 所示。熟悉这些精细的权限类型，以便您能更好地管理一个安全的组织。


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig8_HTML.jpg](img/437055_1_En_9_Fig8_HTML.jpg)


    图 9-8


    简档级别的常规用户权限部分


    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig7_HTML.jpg](img/437055_1_En_9_Fig7_HTML.jpg)


    图 9-7


    位于简档中的管理权限部分

