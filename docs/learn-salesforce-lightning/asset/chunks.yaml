    \ If the field is another data type, you can enter the value necessary.\n\n4.\
    \  For picklist fields only, you’ll check the values that your filter should include.\n\
    \n5.  For picklist fields only, click Insert Selected to add these values to your\
    \ filter, as shown in Figure [5-29](#437055_1_En_5_Chapter.xhtml#Fig29).\n\n \
    \   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig29_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig29_HTML.jpg)\n\
    \n    Figure 5-29\n\n    Selecting the field value of a picklist field\n\n6. \
    \ Click OK to finalize your field filter, as shown in Figure [5-30](#437055_1_En_5_Chapter.xhtml#Fig30).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig30_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig30_HTML.jpg)\n\
    \n    Figure 5-30\n\n    Completing your field filter\n\n### Note\n\nNotice the\
    \ Locked check box next to the OK button in Figure [5-30](#437055_1_En_5_Chapter.xhtml#Fig30).\
    \ This check box, if selected, allows you to lock the filter on your report so\
    \ it can’t be changed unless the user has the permission to modify reports. Figure\
    \ [5-31](#437055_1_En_5_Chapter.xhtml#Fig31) shows how it is locked.\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig31_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig31_HTML.jpg)\n\
    \nFigure 5-31\n\nLocked field filters"
  trans: "\n# 商机标准筛选字段\n\n商机的标准筛选字段是其报表类型所特有的，下面我们来了解一下。\n\n- 与客户、联系人和线索类似，商机也有一个标准报表筛选器，允许您选择所有商机（无论归属何人）、您团队的商机以及您个人的商机，如图\
    \ 5-19 所示。如果您通过角色层级或共享规则设置了安全策略，那么您的用户将只能看到他们有权查看的商机。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig19_HTML.jpg](img/437055_1_En_5_Fig19_HTML.jpg)\n\
    \n  图 5-19 — 商机归属筛选器\n\n- `商机状态`筛选器允许您查看任何商机，无论其处于已关闭、进行中还是已赢得状态，以及所有状态的商机，如图\
    \ 5-20 所示。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig20_HTML.jpg](img/437055_1_En_5_Fig20_HTML.jpg)\n\
    \n  图 5-20 — 商机状态筛选器\n\n- `商机可能性`允许您根据`可能性`字段（与该阶段关联）进行筛选。您可以选择大于 90% 等选项，以便更清楚地了解您销售管道中最可能成交的商机，如图\
    \ 5-21 所示。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig21_HTML.jpg](img/437055_1_En_5_Fig21_HTML.jpg)\n\
    \n  图 5-21 — 商机可能性筛选器\n\n- `商机日期字段`筛选器的工作原理与客户、联系人和线索的筛选器相同。您可以从该报表类型中选择任何日期字段进行筛选，还可以使用\
    \ Salesforce 智能日期。智能日期允许您选择每次运行报表时会更新为相对时间的日期。例如，您可以从下拉菜单中选择`本周`或`当前日历年`，或者在`从`和`到`字段中使用您自己的自定义日期范围，如图\
    \ 5-22 所示。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig22_HTML.jpg](img/437055_1_En_5_Fig22_HTML.jpg)\n\
    \n  图 5-22 — 商机智能日期筛选器\n\n## 个案筛选器\n\n个案筛选器与其他对象的标准筛选器有一些相似之处，也有一些是该报表类型独有的。\n\
    \n- 个案的`显示`筛选器允许您查看所有个案、所有个案（无论归属何人）、用户拥有的个案（相对于队列拥有的个案）、队列拥有的个案、您个案团队的个案或基于角色的团队的个案，如图\
    \ 5-23 所示。如果您通过角色层级或共享规则设置了安全策略，那么您的用户将只能看到他们有权查看的个案。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig23_HTML.jpg](img/437055_1_En_5_Fig23_HTML.jpg)\n\
    \n  图 5-23 — 个案归属筛选器\n\n- `单位`筛选器允许您以分钟、小时或天为单位显示个案已开启的时长，如图 5-24 所示。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig24_HTML.jpg](img/437055_1_En_5_Fig24_HTML.jpg)\n\
    \n  图 5-24 — 个案单位筛选器\n\n- 个案`日期字段`筛选器的工作原理与客户、联系人、线索和商机的筛选器相同。您可以从该报表类型中选择任何日期字段进行筛选，还可以使用\
    \ Salesforce 智能日期，如图 5-25 所示。智能日期允许您选择每次运行报表时会更新为相对时间的日期。例如，您可以从下拉菜单中选择`本周`或`当前日历年`，或者在`从`和`到`字段中使用您自己的自定义日期范围。\n\
    \n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig25_HTML.jpg](img/437055_1_En_5_Fig25_HTML.jpg)\n\
    \n  图 5-25 — 个案智能日期筛选器\n\n## 营销活动\n\n营销活动只有一个标准筛选选项。\n\n- `显示`筛选器允许您按特定营销活动进行筛选，并提供一个查找字段来定位该活动，如图\
    \ 5-26 所示。它还允许您查看所有有效的营销活动、您拥有的营销活动、所有有效的营销活动（无论归属何人）以及所有营销活动。\n\n  ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig26_HTML.jpg](img/437055_1_En_5_Fig26_HTML.jpg)\n\
    \n  图 5-26 — 营销活动归属筛选器\n\n### 字段筛选器\n\n报表生成器中的字段筛选器允许您拖放该报表类型中的任意字段，并使用运算符和值来筛选数据。理解这种字段筛选功能很重要，因为您会在\
    \ Salesforce 中广泛看到相同的功能。您可以在列表视图、工作流规则、流程构建器和 `Apex` 语言中找到它。您需要熟悉的一些运算符包括：`等于`、`不等于`、`小于`、`大于`、`小于或等于`、`大于或等于`、`包含`、`不包含`和`开头是`。如果标准的智能日期筛选器不适用，您也可以在此处进一步自定义智能日期。将您选择的日期字段拖放到筛选字段部分，将运算符设置为`\"\
    等于\"`，并使用类似 `未来 N 天`（将 `N` 替换为您所需的数字）或 `过去 N 个月` 的短语。\n\n1. 从左侧的`字段`部分取出您的字段，并将其拖到`筛选器`部分，如图\
    \ 5-27 所示。\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig27_HTML.jpg](img/437055_1_En_5_Fig27_HTML.jpg)\n\
    \n   图 5-27 — 将字段拖放到字段筛选器部分\n\n2. 为您的筛选器选择合适的运算符，如图 5-28 所示。\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig28_HTML.jpg](img/437055_1_En_5_Fig28_HTML.jpg)\n\
    \n   图 5-28 — 为字段筛选器选择运算符\n\n3. 如果选择的字段筛选器是选项列表字段，您可以点击查找图标。如果字段是其他数据类型，您可以输入所需的值。\n\
    \n4. 仅针对选项列表字段，您需要勾选筛选器应包含的值。\n\n5. 仅针对选项列表字段，点击`插入所选`将这些值添加到您的筛选器中，如图 5-29 所示。\n\
    \n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig29_HTML.jpg](img/437055_1_En_5_Fig29_HTML.jpg)\n\
    \n   图 5-29 — 选择选项列表字段的字段值\n\n6. 点击`确定`完成您的字段筛选器，如图 5-30 所示。\n\n   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig30_HTML.jpg](img/437055_1_En_5_Fig30_HTML.jpg)\n\
    \n   图 5-30 — 完成您的字段筛选器\n\n> **注意：** 请注意图 5-30 中`确定`按钮旁边的`已锁定`复选框。如果选中此复选框，您可以锁定报表上的筛选器，这样除非用户拥有修改报表的权限，否则无法更改。图\
    \ 5-31 显示了锁定后的状态。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig31_HTML.jpg](img/437055_1_En_5_Fig31_HTML.jpg)\n\
    \n图 5-31 — 已锁定的字段筛选器\n"
- fmt: "# Filter Logic\n\nAfter you have set up at least one field filter, filter\
    \ logic will allow you to apply “and,” “or,” or “not” statements on how the fields\
    \ are evaluated. You can create a complex statement of as many field filters that\
    \ are necessary for your report. If you use filter logic, you do have to include\
    \ all your field filters in the statement. You can use parentheses to group logic\
    \ together to further define your report. The default filter logic places `AND`\
    \ into the logic, meaning “1 AND 2 AND 3,” and so on. This tells the report to\
    \ only include records that meet all three of the criteria that you’ve set up\
    \ (or however many you’ve set up) into the report.\n\n1.  Click the `Add` button\
    \ next to Filters and choose Filter Logic.\n2.  Create your statement. You’ll\
    \ use the number next to the field filter to define what field filter needs to\
    \ be placed with an “and” or “or” statement. The statements that you’ll use will\
    \ look like “`(1 OR 2) AND 3 AND 4`.” Another example would be “`1 AND 2 AND 3\
    \ AND 4 AND (5 OR 6 OR 7)`.”\n3.  Click `OK` to complete your filter logic, as\
    \ shown in Figure [5-32](#437055_1_En_5_Chapter.xhtml#Fig32).\n\n    **Note** Every\
    \ time you add a new field filter, you’ll want to adjust your filter logic and\
    \ ensure it is correct.\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig32_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig32_HTML.jpg)\n\
    \n    *Figure 5-32*  \n    *Changing the filter logic*\n\n# Cross Filter\n\nCross\
    \ filters in Salesforce allow you to apply conditions on objects related to the\
    \ current object you are reporting from. You can use cross filters by applying\
    \ “with” or “without” conditions on the related objects. After you use your cross\
    \ filter, further define your field filter via that related cross filter. An example\
    \ of this would be filtering all opportunities without follow-up activities. Or\
    \ use the cross filter to set up filtering on opportunities without products to\
    \ determine what opportunities still need to be completed. Another example of\
    \ using cross filters would be to determine whether an account or contact has\
    \ had any interaction with your sales team. You can set this up by creating an\
    \ account or contact report and adding the cross filter logic of “without” activities.\
    \ This will give you a list of all the accounts or contacts that need to be reached\
    \ out to or checked in on. To set this up, create at least one field filter and\
    \ follow these steps:\n\n1.  Click the `Add` button next to Filters and choose\
    \ Cross Filter.\n2.  Select the primary object that you want to use to relate\
    \ other objects to.\n3.  Define whether you want to see these related objects\
    \ with the word “with” or choose “without.”\n4.  Select the related object you\
    \ would like to see or not see.\n5.  Click the `Add Related Object filter`, select\
    \ the operator along with the value, and click `OK`, as shown in Figure [5-33](#437055_1_En_5_Chapter.xhtml#Fig33).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig33_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig33_HTML.jpg)\n\
    \n    *Figure 5-33*  \n    *Setting up a cross filter*\n\n# Row Limit\n\nRow limit\
    \ filters are used with Tabular reports and allow you to display your report in\
    \ a table or chart on a dashboard if you limit the number of rows it returns and\
    \ sort by a field. To create this, follow these steps:\n\n1.  Click the `Add`\
    \ button and choose Row Limit, as shown in Figure [5-34](#437055_1_En_5_Chapter.xhtml#Fig34).\n\
    2.  Define the row limit.\n3.  Choose to sort by a particular field and whether\
    \ it is ascending or descending and click `OK`.\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig34_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig34_HTML.jpg)\n\
    \n    *Figure 5-34*  \n    *Setting up the row limit*\n\n## Using the Report Builder\n\
    \nCreating reports in Salesforce allows you to analyze the data you and your user\
    \ are collecting. Perhaps the best thing about being a newcomer to the reports\
    \ in Salesforce is that you can’t break or ruin your data. All you are doing with\
    \ reports is displaying the data you currently have in a more readable format,\
    \ instead of in individual records. Don’t be afraid to jump right in and start\
    \ clicking away!\n\n### Creating a Leads Report\n\nYou can use lead reports to\
    \ see some or all key information about your leads. You can see how many leads\
    \ you have, what lead source is working from your marketing team, the number of\
    \ leads that are being handled by a user versus the ones that are in a queue,\
    \ and so much more! One of the many business problems that can be resolved with\
    \ generating lead reports is considering which lead source is working compared\
    \ to ones that are not. You can build a report on converted leads and group the\
    \ report by the lead source, as shown in Figure [5-35](#437055_1_En_5_Chapter.xhtml#Fig35).\n\
    \n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig35_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig35_HTML.jpg)\n\
    \n*Figure 5-35*  \n*Leads report example*\n\nTo create a lead report, follow these\
    \ steps:\n\n1.  Navigate to the Reports tab and click `Reports`, as shown in Figure\
    \ [5-36](#437055_1_En_5_Chapter.xhtml#Fig36).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig36_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig36_HTML.jpg)\n\
    \n    *Figure 5-36*  \n    *Navigating to the Reports tab*\n\n2.  Click `New Report`,\
    \ as shown in Figure [5-37](#437055_1_En_5_Chapter.xhtml#Fig37).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig37_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig37_HTML.jpg)\n\
    \n    *Figure 5-37*  \n    *Click the New Report button to start a new report*\n\
    \n3.  In the `Quick Find`, type **Leads** or click `Leads` and click `Create`,\
    \ as shown in Figure [5-38](#437055_1_En_5_Chapter.xhtml#Fig38).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig38_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig38_HTML.jpg)\n\
    \n    *Figure 5-38*  \n    *Finding the report type to use*\n\n4.  Click and hold\
    \ the name of the field you would like to move into your reports and drag it to\
    \ the column where you would like it to be placed. Continue to drag and drop as\
    \ many fields as necessary for the report. Once finished, click `Save`, as shown\
    \ in Figure [5-39](#437055_1_En_5_Chapter.xhtml#Fig39).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig39_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig39_HTML.jpg)\n\
    \n    *Figure 5-39*  \n    *Dragging and dropping a new field into your report*\n\
    \n5.  Name your report and press your `Tab` key for Salesforce to automatically\
    \ enter a value in the `Report Unique Name` field.\n6.  Enter a description that\
    \ will be displayed to users.\n7.  Select the report folder where your report\
    \ should be stored.\n8.  Click `Save`, as shown in Figure [5-40](#437055_1_En_5_Chapter.xhtml#Fig40).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig40_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig40_HTML.jpg)\n\
    \n    *Figure 5-40*  \n    *Saving your report*\n\n9.  Click `Run Report` to see\
    \ the results of your data, as shown in Figure [5-41](#437055_1_En_5_Chapter.xhtml#Fig41).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig41_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig41_HTML.jpg)\n\
    \n    *Figure 5-41*  \n    *Running your report to see your results*"
