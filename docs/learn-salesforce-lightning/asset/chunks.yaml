  trans: "\n# Lightning 页面\n\nLightning 页面将注意力聚焦于最重要的事项。关键信息会显示在“首屏上方”，即屏幕的上半部分，以便用户更快地查看要点。\n\
    \n此外，布局一致且易于导航。请对比 Classic 中的帐户记录（见图 1-2）与 Lightning 中的同一记录（图 1-3）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig3_HTML.jpg](img/437055_1_En_1_Fig3_HTML.jpg)\n\
    \n图 1-3：Lightning Experience 中的 Salesforce 帐户记录\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig2_HTML.jpg](img/437055_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2：Salesforce Classic 中的 Salesforce 帐户记录\n\n# 迁移到 Lightning Experience\n\n\
    迁移到 Salesforce Lightning Experience 非常简单。以下步骤描述了如何访问迁移助手。迁移助手将检查你的组织对 Lightning\
    \ 的准备情况，并引导你完成一系列步骤，以便为你的组织启用 Lightning。这是你的 Lightning 之旅中一个很好的第一步。\n\n> **注意：**\
    \ 这些步骤并非必需，但强烈建议执行。Salesforce 花了大量时间思考潜在的迁移陷阱，并尝试在迁移助手中解决这些问题。\n\n## 迁移助手\n\n\
    请执行以下步骤：\n\n1. 在 Classic 中，选择 `Setup`（设置）（见图 1-4）。\n   \n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig4_HTML.jpg](img/437055_1_En_1_Fig4_HTML.jpg)\n\
    \   \n   图 1-4：Salesforce Classic 中的“设置”区域\n\n2. 在 `Setup`（设置）菜单中，点击 `Get Started`（开始使用）按钮（见图\
    \ 1-5）。\n   \n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig5_HTML.jpg](img/437055_1_En_1_Fig5_HTML.jpg)\n\
    \   \n   图 1-5：设置中的“开始使用”按钮\n\n3. 在这里，你有三个可用资源来了解更多关于 Lightning Experience 的信息。你可以从图\
    \ 1-6 中的选项中进行选择。\n   \n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig6_HTML.jpg](img/437055_1_En_1_Fig6_HTML.jpg)\n\
    \   \n   图 1-6：Salesforce Lightning 的学习资源\n\n4. 点击 `Next Step`（下一步）开始操作。\n\n###\
    \ 检查准备情况\n\n首先，Salesforce 将请求访问你的组织，以分析你当前的设置（图 1-7）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig7_HTML.jpg](img/437055_1_En_1_Fig7_HTML.jpg)\n\
    \n图 1-7：允许访问 Lightning 准备情况检查\n\n单击 `Allow`（允许）（如图 1-7 所示）后，你必须选择要访问的 Salesforce\
    \ 产品（见图 1-8）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig8_HTML.jpg](img/437055_1_En_1_Fig8_HTML.jpg)\n\
    \n图 1-8：选择要检查 Lightning 准备情况的产品\n\n选择适当的 Salesforce 产品并单击 `Check Readiness`（检查准备情况）。Salesforce\
    \ 将分析你当前的设置，并通过电子邮件发送一份准备情况报告（见图 1-9）。新组织可以跳过此步骤。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig9_HTML.jpg](img/437055_1_En_1_Fig9_HTML.jpg)\n\
    \n图 1-9：Lightning 迁移选项\n\n### 预览\n\n你可以预览你的组织在 Lightning 环境中的运作方式。这是一个很好的功能，可以用来测试你的准备情况报告中可能提出的任何问题。如果在此切换过程中遇到任何问题，你可以当场进行更改。要进行测试，请导航至\
    \ `Preview`（预览）选项卡，然后单击 `Preview`（预览），如图 1-10 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig10_HTML.jpg](img/437055_1_En_1_Fig10_HTML.jpg)\n\
    \n图 1-10：迁移助手中的“预览”选项卡\n\n如图 1-11 所示，你将立即切换到预览模式下的 Lightning。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig11_HTML.jpg](img/437055_1_En_1_Fig11_HTML.jpg)\n\
    \n图 1-11：预览模式下的 Lightning Experience\n\n### 利用功能进行优化\n\n为了获得 Lightning 的完整体验，请查看一些新增的可用功能。这包括用于新闻的新功能、启用活动和笔记的选项等等。导航到此选项卡，并单击\
    \ `Optimize with Features`（利用功能进行优化）来启用/禁用图 1-12 中的 Lightning 功能。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig12_HTML.jpg](img/437055_1_En_1_Fig12_HTML.jpg)\n\
    \n图 1-12：要启用的 Lightning 功能\n\n你可以启用以下选项：\n\n*   单击 `Set Up My Domain`（设置我的域）可以创建一个反映你公司品牌的\
    \ URL。这会将一个子域添加到你的 Salesforce 组织 URL。使用此功能来增强登录和身份验证过程。\n*   单击 `Set Up Shared\
    \ Activities`（设置共享活动）以允许用户将多个联系人关联到单个活动。\n*   启用 `News`（新闻）以显示关于你的帐户及其行业的相关新闻文章。这些信息由你组织中列出的帐户拉取。\n\
    *   启用 `Social Accounts`（社交帐户）、`Contacts`（联系人）和 `Leads`（潜在客户），以允许用户通过同步社交媒体帐户更好地与你的帐户建立联系。\n\
    *   启用 `Notes`（笔记）以使用增强版笔记，该版本包括在编辑模式下自动保存、添加图像的选项以及共享功能。\n\n### 设置用户\n\n你可以控制谁有权访问\
    \ Lightning Experience。你可以选择向用户组、单个用户或所有用户推出此功能。\n\n> **注意：** 标准简档用户默认有权访问 Lightning，而自定义简档用户则没有。单击\
    \ `Learn How`（了解如何操作）以更改这些设置。\n\n导航至图 1-13 中显示的 `Set up Users`（设置用户）选项卡，以微调此体验并选择要切换的用户。\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig13_HTML.jpg](img/437055_1_En_1_Fig13_HTML.jpg)\n\
    \n图 1-13：用户设置\n\n请执行以下步骤来切换用户：\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig14_HTML.jpg](img/437055_1_En_1_Fig14_HTML.jpg)\n\
    \n图 1-14：选择要迁移到 Lightning 的用户\n\n1.  单击 `Switch Users`（切换用户）。\n2.  通过单击用户名旁边的\
    \ `+` 来选择适当的用户（图 1-14）。\n3.  单击 `Save`（保存）。\n\n#### 推出方式\n\n执行最适合你公司的推出策略。对于较大的组织，建议采用分阶段推出的方法。这种方法在迁移大型组织和复杂设置时非常有利。这种方法有几个好处，包括：\n\
    \n*   此方法允许你进行用户验收测试。用它来识别新体验中的任何挑战或问题。你可以在向整个组织推广之前收集用户的反馈并微调更改。\n*   通过将实施工作分解成若干部分来取得进展。这确保了在紧跟新功能和变更的同时，能够取得进展。\n\
    \n建议的推出方式是从新用户开始，然后是试点用户组，最后是所有用户。\n"
- fmt: "#### Turn It On\n\nHurray! The final step! Once your organization is ready\
    \ to make the move to Lightning, select the `Turn It On` tab shown in Figure [1-15](#437055_1_En_1_Chapter.xhtml#Fig15).\
    \ Switch the tab to `Enabled` to finish.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig15_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig15_HTML.jpg)\n\
    \nFigure 1-15\nTurning on Lightning to finish\n\n### Note\n\nWith the right permissions,\
    \ users have the option to toggle between `Classic` and the `Lightning Experience`.\
    \ From the `Classic` interface, select your username and click `Switch to Lightning\
    \ Experience`, as shown in Figure [1-16](#437055_1_En_1_Chapter.xhtml#Fig16).\
    \ From the `Lightning Experience`, click `Switch to Classic`, as shown in Figure\
    \ [1-17](#437055_1_En_1_Chapter.xhtml#Fig17).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig16_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig16_HTML.jpg)\n\
    \nFigure 1-16\nSwitching from Classic to Lightning\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig17_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig17_HTML.jpg)\n\
    \nFigure 1-17\nSwitching from Lightning Experience to Salesforce Classic\n\n##\
    \ Lightning Home Page\n\nThe `Lightning Experience` home page is enhanced with\
    \ new features. The home page can be tailored to give your users everything they\
    \ need to manage their day in one centralized place. Without any configuration,\
    \ `Salesforce` displays the following components: `Quarterly Performance`, `Assistant`,\
    \ `News`, `Today’s Tasks`, `Today’s Events`, `Recent Records`, and `Top Deals`.\
    \ See Figures [1-18](#437055_1_En_1_Chapter.xhtml#Fig18) and [1-19](#437055_1_En_1_Chapter.xhtml#Fig19).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig19_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig19_HTML.jpg)\n\
    \nFigure 1-19\nBottom half of the Lightning home page\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig18_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig18_HTML.jpg)\n\
    \nFigure 1-18\nTop half of the Lightning home page\n\n### Navigation Bar\n\nThe\
    \ navigation bar uses tabs to hold objects, as shown in Figure [1-20](#437055_1_En_1_Chapter.xhtml#Fig20).\
    \ In database terms, an *object* is a table. Objects hold groupings of information\
    \ that may be related. This includes the records that live in them. Records are\
    \ considered the rows that you find within a table. You will hear this terminology\
    \ referenced throughout this book. For more information on objects, records, and\
    \ fields, navigate to Chapter X.\n\nIn Lightning, each tab is actionable.\n\n\
    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig20_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig20_HTML.jpg)\n\
    \nFigure 1-20\nNavigation bar\n\nIn the navigation bar, objects are broken down\
    \ into lists. These lists hold `Salesforce` records in relation to their object.\
    \ One of the neat features of this is that records can be created directly from\
    \ a tab. Each list can be used to see the object’s most recent items. This makes\
    \ it easier for users to create new records on the fly.\n\n### Quarterly Performance\n\
    \nThe `Quarterly Performance` summary is a powerful reporting tool used to show\
    \ sales users’ performance based on a pipeline (see Figure [1-21](#437055_1_En_1_Chapter.xhtml#Fig21)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig21_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig21_HTML.jpg)\n\
    \nFigure 1-21\nQuarterly Performance component located on the home page\n\n`Closed`\
    \ records display the user’s closed opportunities.\n\n`Open (>70%)` displays the\
    \ sum of all records with a probability greater than 70 percent.\n\nIf the user\
    \ is part of a team, the team’s opportunity sums will be showcased on this report.\
    \ Otherwise, the data represented will be the user’s owned opportunities.\n\n\
    #### Setting a Goal\n\nTo set a goal, follow these steps:\n\n1.  Click the pencil\
    \ icon and enter an amount, as shown in Figure [1-22](#437055_1_En_1_Chapter.xhtml#Fig22).\n\
    \n    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig22_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig22_HTML.jpg)\n\
    \n    Figure 1-22\n    Select the pencil icon to edit your quarterly goal\n\n\
    2.  Click `Save`.\n\nThe chart automatically calculates and updates the chart.\
    \ Click ![../images/437055_1_En_1_Chapter/437055_1_En_1_Figa_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Figa_HTML.jpg)\
    \ to refresh the data. Click ![../images/437055_1_En_1_Chapter/437055_1_En_1_Figb_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Figb_HTML.jpg)\
    \ to filter the data by week or day (Figure [1-23](#437055_1_En_1_Chapter.xhtml#Fig23)).\n\
    \nNow your sales users can start their day with a data visualization of their\
    \ sales progress.\n\n### News\n\nThis new feature is a great way to display news\
    \ articles related to your accounts and their industries. Once enabled, as discussed\
    \ in the “Enhanced Features” section, news information can be displayed on your\
    \ home page. When news is accessed from the home page, information is displayed\
    \ based on recently viewed records and tasks and events for those records. See\
    \ Figure [1-23](#437055_1_En_1_Chapter.xhtml#Fig23).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig23_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig23_HTML.jpg)\n\
    \nFigure 1-23\nNews component found on the home page\n\nClick `See More News`\
    \ to navigate to the `News` tab, as shown in Figure [1-24](#437055_1_En_1_Chapter.xhtml#Fig24).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig24_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig24_HTML.jpg)\n\
    \nFigure 1-24\nIndustry news found in the News object\n\nThis tab displays a list\
    \ of news articles titled `Industry News`. Information populated here is related\
    \ to your accounts and their industry.\n\n### Assistant\n\n`Lightning Assistant`\
    \ is helpful in prioritizing an end user’s daily tasks. Tasks that are overdue\
    \ are showcased first on the top right of the page (see Figure [1-25](#437055_1_En_1_Chapter.xhtml#Fig25)).\
    \ The following overdue tasks are tasks that are due today.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig25_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig25_HTML.jpg)\n\
    \nFigure 1-25\nLightning Assistant\n\n#### Global Search\n\nThe Salesforce global\
    \ search bar appears at the top of every page. Use this area to search across\
    \ any object in `Salesforce`. It’s best practice to search for a record before\
    \ creating a new one to avoid duplicate data. Use wildcards and operators for\
    \ greater search results.\n\nUse an asterisk (`*`) to find records that match\
    \ at the middle or end of your search, and use a question mark (`?`) to find records\
    \ that match only one character at the middle or end of your search.\n\nFor example,\
    \ a search for `Ay*` at the end will find and display results for a contact named\
    \ `Ayden`. It will also find and display results for `Andy Young` (Figure [1-26](#437055_1_En_1_Chapter.xhtml#Fig26)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig26_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig26_HTML.jpg)\n\
    \nFigure 1-26\nSearch results for Ay*\n\n#### Favorites List\n\nThe `Favorites`\
    \ icon is a new tool in the Lightning platform. Favorites are customized shortcuts\
    \ to records and items most frequently visited, such as favorite individual records,\
    \ list views, dashboards, and more.\n\nTo make an item a favorite, click the star\
    \ button in Figure [1-27](#437055_1_En_1_Chapter.xhtml#Fig27). This powerful tool\
    \ makes it easy to find your favorite records from different object locations,\
    \ all in one place.\n\nYou can make your top deals, your most frequently visited\
    \ reports, your top leads, and more your favorites!\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig27_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig27_HTML.jpg)\n\
    \nFigure 1-27\nFavorites icon\n\nClick the arrow next to the star to select items\
    \ in your `Favorites` list, as shown in Figure [1-28](#437055_1_En_1_Chapter.xhtml#Fig28).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig28_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig28_HTML.jpg)\n\
    \nFigure 1-28\nList of favorites"
