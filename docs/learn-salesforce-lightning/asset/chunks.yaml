  trans: "\n### 了解潜在客户页面\n\n在 Lightning Experience 中，潜在客户记录包含关于该潜在客户的重要信息，包括联系详情、活动跟踪、营销活动历史、Chatter\
    \ 和新闻。\n\n借助`潜在客户工作区`工具栏，销售主管可以更快地处理最优质的潜在客户。该工具栏使销售代表能够轻松地引导其潜在客户完成潜在客户转化流程。\n\
    \n图 2-2 展示了 Lightning Experience 中的一条潜在客户记录。此页面布局通过一个高亮面板、一个活动区域和`潜在客户工作区`工具栏整合了关键信息。\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig2_HTML.jpg](img/437055_1_En_2_Fig2_HTML.jpg)\n\
    *图 2-2 — Lightning Experience 中的潜在客户记录页面*\n\n如图 2-3 所示的高亮面板在页面顶部显示关键信息。默认情况下，这包括潜在客户的称呼、名、姓、职务、公司、所有电话字段和电子邮件。此功能使您的用户能够更快速地处理潜在客户。\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig3_HTML.jpg](img/437055_1_En_2_Fig3_HTML.jpg)\n\
    *图 2-3 — 潜在客户记录上的高亮面板*\n\n如图 2-4 所示的交互式工具栏称为`潜在客户工作区`。此区域帮助用户遵循转化过程中的一系列可配置步骤，这些步骤被称为*销售路径*。鼓励用户在努力确认潜在客户资格时更新其状态。\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig4_HTML.jpg](img/437055_1_En_2_Fig4_HTML.jpg)\n\
    *图 2-4 — 潜在客户工作区工具栏*\n\n使用`活动`选项卡（如图 2-5 所示）来记录通话、创建新任务或事件以及发送电子邮件。创建任务以防止潜在客户从缝隙中溜走。任何需要完成的任务将填充在`后续步骤`区域。已完成的活动记录在`过往活动`部分。\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig5_HTML.jpg](img/437055_1_En_2_Fig5_HTML.jpg)\n\
    *图 2-5 — 潜在客户记录上的活动区域*\n\n将潜在客户记录上的 Chatter 功能（如图 2-6 所示）用作协作工具。将其作为您在 Salesforce\
    \ 内部的沟通载体，以便相互协作。发布更新、提出问题并创建投票。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig6_HTML.jpg](img/437055_1_En_2_Fig6_HTML.jpg)\n\
    *图 2-6 — 潜在客户记录上的 Chatter 选项卡*\n\n如图 2-7 所示的`详细信息`选项卡显示与潜在客户相关的信息。这包括向用户展示的所有标准和自定义字段。\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig7_HTML.jpg](img/437055_1_En_2_Fig7_HTML.jpg)\n\
    *图 2-7 — 潜在客户记录上的详细信息选项卡*\n\n使用如图 2-8 所示的`新闻`选项卡查找与您的潜在客户相关的新闻文章。您还可以将您的组织与 Twitter\
    \ 同步，以查看最新的 Twitter 信息流和相关连接。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig8_HTML.jpg](img/437055_1_En_2_Fig8_HTML.jpg)\n\
    *图 2-8 — 潜在客户记录上的新闻区域*\n\n在默认潜在客户页面布局的最右侧（如图 2-9 所示），您可以识别潜在的重复记录。如果发现任何重复项，该信息将填充到此区域。\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig9_HTML.jpg](img/437055_1_En_2_Fig9_HTML.jpg)\n\
    *图 2-9 — 潜在客户记录上的重复项区域*\n\n### 注意\n\n可以对高亮面板进行重新排列，以在页面顶部显示最重要的潜在客户详细信息。这使最终用户能够轻松利用关键信息。\n\
    \n### 创建潜在客户\n\n请按照以下步骤学习如何从列表视图创建新的潜在客户记录：\n\n1.  点击`潜在客户`选项卡旁边的`![../images/437055_1_En_2_Chapter/437055_1_En_2_Figa_HTML.jpg](img/437055_1_En_2_Figa_HTML.jpg)`按钮，然后点击`新建潜在客户`。\n\
    \n    或者，您可以从`潜在客户`列表视图中点击`新建`来创建一个新的潜在客户（图 2-10）。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig10_HTML.jpg](img/437055_1_En_2_Fig10_HTML.jpg)\n\
    \    *图 2-10 — 潜在客户列表视图中的新建按钮*\n\n2.  如图 2-11 所示，在编辑页面上键入潜在客户的名。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig11_HTML.jpg](img/437055_1_En_2_Fig11_HTML.jpg)\n\
    \    *图 2-11 — 潜在客户记录的编辑页面。在此处填写适当的潜在客户详细信息。*\n\n3.  键入潜在客户的姓，这是保存任何潜在客户记录所必需的。键入公司名称；这是潜在客户关联的企业名称。\n\
    \n    **注意** 转化时，名和姓将生成联系人的名和姓。公司名称用于创建客户记录，并映射到`客户名称`字段。\n\n    `姓`和`公司名称`是必填的潜在客户字段。如果这些字段未填写数据，记录将无法保存。理想情况下，应在潜在客户记录中填写更多数据。您应考虑添加有关潜在客户的任何其他重要信息。\n\
    \n4.  点击`保存`以保存记录。点击`保存并新建`以保存当前记录并跳转创建新的潜在客户。\n\n5.  成功创建潜在客户后，页面顶部将显示一条成功消息，如图\
    \ 2-12 所示。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig12_HTML.jpg](img/437055_1_En_2_Fig12_HTML.jpg)\n\
    \    *图 2-12 — 新建潜在客户记录成功消息*\n\n如果记录未正确保存，将显示一条错误消息，如图 2-13 所示。错误消息显示在页面顶部。\n\n\
    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig13_HTML.jpg](img/437055_1_En_2_Fig13_HTML.jpg)\n\
    *图 2-13 — 尝试保存记录但未填写所有标记为红色的必填字段后收到的错误消息*\n\n### 注意\n\n必填字段用红色星号标记，如图 2-11 所示。这些字段必须填写信息才能保存记录。如果某个字段没有星号，则它不是必填字段，假设没有其他验证规则，则可以留空。\n"
- fmt: "### How to Convert a Lead\n\nFollow these steps to learn how to convert a\
    \ lead in Salesforce:\n\n1. Open an existing lead record.\n2. From the lead record\
    \ page, click the `Convert` button shown in Figure [2-14](#437055_1_En_2_Chapter.xhtml#Fig14).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig14_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig14_HTML.jpg)\n\
    \n   **Figure 2-14** The `Convert` button on a lead record\n\n3. Fill in the appropriate\
    \ details located on the `Convert Lead` edit page, as shown in Figure [2-15](#437055_1_En_2_Chapter.xhtml#Fig15).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig15_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig15_HTML.jpg)\n\
    \n   **Figure 2-15** Convert page includes converted status, record owner, account\
    \ name, and opportunity name\n\n4. Enter the converted status. `Closed - Converted`\
    \ is the default conversion status.\n\n   **Note** The lead status field captures\
    \ a value that corresponds to a converted or unconverted status. Select the appropriate\
    \ lead status. By default, `Converted` is the default status.\n\n5. Assign the\
    \ record owner. This can be assigned to any Salesforce user.\n6. Type in the account\
    \ name. You can search for an existing account or create a new one. If the account\
    \ does not exist, click `New Account` to create a new account record directly.\
    \ If the lead is an individual, leave the `Account Name` field blank.\n7. To create\
    \ an opportunity record while converting, type the name of the opportunity. Leave\
    \ this field blank if an opportunity does not exist.\n8. Click `Convert` and view\
    \ the conversion confirmation page, as shown in Figure [2-16](#437055_1_En_2_Chapter.xhtml#Fig16).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig16_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig16_HTML.jpg)\n\
    \n   **Figure 2-16** Conversion confirmation page\n\n---\n\n## Accounts and Contacts\n\
    \nAn account in Salesforce can be an organization, company, or institution, while\
    \ a contact can be an individual associated with a business.\n\nFor example, you\
    \ may have an upcoming meeting with Michael Scott at Dunder Mifflin Paper Co.\
    \ in regard to a potential opportunity about your product or services. Track information\
    \ about Michael Scott and Dunder Mifflin Paper Co. in Salesforce. Create a new\
    \ account and call it Dunder Mifflin Paper Co. Next, create a contact record for\
    \ Michael Scott to relate the two.\n\n### Tip\n\nIt’s best practice to search\
    \ for something before creating a new record to avoid duplication.\n\n### Accounts\n\
    \nYou can sort your accounts by type, status, or any other standard or custom\
    \ field in Salesforce. Keep track of accounts that are active versus inactive,\
    \ within a particular industry or territory, and much more.\n\nFrom the `Account`\
    \ list, you can identify key contacts, opportunities, cases, and related notes\
    \ and attachments for an at-a-glance view.\n\n### Note\n\nYou can create roll-up\
    \ summary fields at the account level to summarize specific metrics. For example,\
    \ create a roll-up field to aggregate the total amount for all `Closed Won` opportunities.\
    \ See the section “Field Types” in Chapter [1](#437055_1_En_1_Chapter.xhtml) for\
    \ more information on roll-up fields.\n\nAccounts and contacts have a master-detail\
    \ relationship. This is a parent-child relationship in which the master object\
    \ (`Account`) controls the detail object (`Contact`). See the section “Field Types”\
    \ in Chapter [1](#437055_1_En_1_Chapter.xhtml) to learn more about master-detail\
    \ relationships.\n\n### Create a New Account\n\nAccounts can be created or imported\
    \ directly into Salesforce, without having to be converted. Create an account\
    \ record to track information at the account level, such as employee count, account\
    \ number, web site, etc.\n\n1. From the toolbar, click ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figb_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Figb_HTML.jpg)\
    \ next to the `Account` tab.\n2. Click `New Account`.\n3. Fill in all required\
    \ fields marked with an asterisk, including the account name (Figure [2-17](#437055_1_En_2_Chapter.xhtml#Fig17)).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig17_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig17_HTML.jpg)\n\
    \n   **Figure 2-17** Account record in edit mode\n\n4. Click `Save` to save an\
    \ account record. A success message will appear when properly saved, shown in\
    \ Figure [2-18](#437055_1_En_2_Chapter.xhtml#Fig18).\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig18_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig18_HTML.jpg)\n\
    \n   **Figure 2-18** Account success message\n\n### Contacts\n\nUse the contact\
    \ record to capture individual information, including email addresses, phone numbers,\
    \ birth dates, and more. Use this information to boost client relationships. Create\
    \ encrypted fields to store secure information at the contact level, for example,\
    \ Social Security numbers and credit card information.\n\nAs mentioned earlier,\
    \ accounts and contacts have a master-detail relationship. To create a relationship\
    \ between the two, make sure to enter the account name when creating a contact.\n\
    \n### Tip\n\nCreate the contact from the account record to quickly relate the\
    \ two.\n\nFollow these steps to create a contact from an existing account:\n\n\
    1. From the account record, click the `New Contact` button shown in Figure [2-19](#437055_1_En_2_Chapter.xhtml#Fig19).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig19_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig19_HTML.jpg)\n\
    \n   **Figure 2-19** `New Contact` button on an account record\n\n2. Type the\
    \ first name on the edit page, as shown in Figure [2-20](#437055_1_En_2_Chapter.xhtml#Fig20).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig20_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig20_HTML.jpg)\n\
    \n   **Figure 2-20** Edit page for a new contact\n\n3. Type the last name (this\
    \ is required to save any contact record).\n4. The account name is prefilled with\
    \ the name of the account record you started in. Fill in any additional information\
    \ about the contact.\n5. Click `Save` to save the record and relate Michael Scott\
    \ with Dunder Mifflin. Once properly saved, a success message will appear, as\
    \ shown in Figure [2-21](#437055_1_En_2_Chapter.xhtml#Fig21).\n\n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig21_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig21_HTML.jpg)\n\
    \n   **Figure 2-21** New contact success message\n\nNow, in the account record\
    \ you can see the new contact record, as shown in Figure [2-22](#437055_1_En_2_Chapter.xhtml#Fig22).\n\
    \n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig22_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig22_HTML.jpg)\n\
    \n**Figure 2-22** An account with its related contacts. Click `New` to relate\
    \ more contacts.\n\n---\n\n## List Views\n\nList views make it easier to sort\
    \ Salesforce data within each object. Leverage list views to call on specific\
    \ groupings of records. For example, create a list view to only see active accounts,\
    \ hot leads, and opportunities in the negotiation stage, and so on. Records are\
    \ automatically displayed in any list view when the criteria are met. Take action\
    \ on these lists with Salesforce’s importing and mass updating capabilities.\n\
    \nThe new user interface (UI) in Lightning makes it easier to visualize data.\
    \ Add charts to your views and use the new drag-and-drop feature to move records\
    \ across different stages."
