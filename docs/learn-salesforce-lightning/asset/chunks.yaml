- fmt: "## Object-Level Security\n\nObject-level security is stored at the profile\
    \ level in the `Object Permissions` section. As a starting point, a user must\
    \ have the appropriate level of access to an object to see the object and the\
    \ records inside of it. You can control object-level security in profiles, as\
    \ shown in Figure [9-3](#437055_1_En_9_Chapter.xhtml#Fig3).\n\nThe following are\
    \ different permission types used to set the level of access users have with each\
    \ object:\n\n- **`Read`**: Users can view records.\n- **`Create`**: Users can\
    \ create records.\n- **`Edit`**: Users can read and edit records stored in this\
    \ object.\n- **`Delete`**: Users have permission to read, edit, and delete records.\n\
    - **`View All`**: Users can view all records stored within this object.\n- **`Modify\
    \ All`**: Users can modify all records stored within this object.\n\nSet the `object-level\
    \ security` for standard and custom objects. Define whether a profile should have\
    \ `Read`, `Create`, `Edit`, `Delete`, `View All`, or `Modify All`, as shown in\
    \ Figure [9-9](#437055_1_En_9_Chapter.xhtml#Fig9).\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig9_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig9_HTML.jpg)\n\
    \n**Figure 9-9** — Setting object-level security\n\n## Password Policies, Login\
    \ Hours, and IP Ranges\n\nYou can specify when passwords should expire, password\
    \ requirements, session timeouts, and much more. You can also control the login\
    \ hours and acceptable IP ranges for each profile.\n\n## Assigning a Profile\n\
    \nThere are six different types of standard profiles:\n\n- **`System Administrator`**:\
    \ Assign this profile to a user who needs access to all functionality within license.\
    \ This profile has access to view and modify all data.\n- **`Standard User`**:\
    \ This profile has core platform functionality. They can view, edit, and delete\
    \ records they have access to.\n- **`Solution Manager`**: This is the same functionality\
    \ as a `Standard User` plus additional permissions to manage published solutions.\n\
    - **`Marketing User`**: This is the same functionality as a `Standard User` plus\
    \ permission to import leads, manage campaigns, and manage communication templates.\n\
    - **`Contract Manager`**: This is the same functionality as a `Standard User`\
    \ plus permission to manage and approve contracts.\n- **`Read Only`**: This profile\
    \ can only view records they have access to and run reports and export.\n\n##\
    \ Create a Custom Profile\n\nCreate custom profiles to build a unique set of permissions\
    \ for different groups of users. Follow these steps to create a custom profile:\n\
    \n1. Search for and select `Profiles` from the `Setup` menu (shown in Figure [9-10](#437055_1_En_9_Chapter.xhtml#Fig10)).\n\
    \   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig10_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig10_HTML.jpg)\n\
    \   **Figure 9-10** — Navigating to `Profiles` in Salesforce\n\n2. To create a\
    \ new profile, click `New Profile`, as shown in Figure [9-11](#437055_1_En_9_Chapter.xhtml#Fig11).\n\
    \   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig11_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig11_HTML.jpg)\n\
    \   **Figure 9-11** — `New Profile` button on the Profiles home page\n\n3. To\
    \ create a custom profile, you must clone one from an existing standard profile.\
    \ Choose a standard profile to clone from and click `Clone`.\n\n4. Enter the name\
    \ of the new profile and click `Save`, as shown in Figure [9-12](#437055_1_En_9_Chapter.xhtml#Fig12).\n\
    \   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig12_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig12_HTML.jpg)\n\
    \   **Figure 9-12** — Naming your new custom profile\n\nTo complete changes to\
    \ what this profile has access to see and do, click `Edit` next to the profile\
    \ name. Modify the appropriate permissions to your new profile, as shown in Figure\
    \ [9-13](#437055_1_En_9_Chapter.xhtml#Fig13).\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig13_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig13_HTML.jpg)\n\
    \n**Figure 9-13** — Home page of a profile\n\n> **Note**: All users must have\
    \ an assigned profile, and profiles can be assigned to multiple users. However,\
    \ users can be assigned only one profile.\n>\n> So, what do you do when you need\
    \ to give additional permissions to an individual user?\n>\n> For example, let’s\
    \ say you want to extend the permission `Create Reports` to an individual user.\
    \ Rather than creating a new profile or editing permissions on an existing profile,\
    \ we suggest creating a permission set.\n\n## Permission Sets\n\nPermission sets\
    \ are a collection of permissions and settings that can be assigned to the users\
    \ who need it.\n\nFollow these steps to create a permission set:\n\n1. Search\
    \ `Permission` in `Setup` and click `Permission Set`.\n\n2. Click the `New` button\
    \ to create a new permission set, as shown in Figure [9-14](#437055_1_En_9_Chapter.xhtml#Fig14).\n\
    \   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig14_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig14_HTML.jpg)\n\
    \   **Figure 9-14** — Permission Sets home page\n\n3. Enter the name of your permission\
    \ set in the `Label` field and provide a detailed description, as shown in Figure\
    \ [9-15](#437055_1_En_9_Chapter.xhtml#Fig15).\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig15_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig15_HTML.jpg)\n\
    \   **Figure 9-15** — Steps to create a permission set\n\n4. Choose the type of\
    \ user who will use this permission set.\n\n> **Tip**: It is best practice to\
    \ give your permission set a description. This makes it easier to find when many\
    \ permission sets exist.\n\n## Record-Level Security\n\nRecord-level security\
    \ specifies what records a user has access to view and edit in each object.\n\n\
    ### Record Ownership\n\nEach record in Salesforce must have an owner. This can\
    \ be either a user or a queue. By default, the owner of a record has full access\
    \ capabilities. This means they can view, edit, delete, transfer, and share the\
    \ record.\n\n## Organization-wide Defaults\n\nBy default, your Salesforce organization\
    \ operates in a public sharing model. We refer to this as the *organization-wide\
    \ defaults* (OWDs). This means that all users have access to see and edit all\
    \ data on a per-object basis, provided they have the appropriate object-level\
    \ security. To limit visibility for certain records, consider operating in a private\
    \ sharing model for that object.\n\n### Private or Public?\n\nWhen considering\
    \ to go private or public on an object, consider this: are there any elements\
    \ of your data that should be restricted to any particular user?\n\nIf the answer\
    \ is yes, you should be operating in a private sharing model for that object.\n\
    \nAs shown earlier in Figure [9-2](#437055_1_En_9_Chapter.xhtml#Fig2), the organization-wide\
    \ default has the highest level of restriction. This is the only security component\
    \ that restricts access.\n\nAll other security components are designed to share\
    \ access. Record access can be opened up to specific users or groups of users\
    \ through roles, manual sharing, and sharing rules."
