- fmt: "### Note\n\nSalesforce also offers other related lists. Although not on a\
    \ standard page layout, these can be easily added to your page layout. One that\
    \ is worth noting is `Contact Roles`, which allows you to add multiple contacts\
    \ to one case record. Another is the related list called `Emails`, which is used\
    \ when you have enabled the email-to-case function (explained later in this chapter).\
    \ If set up in your email account properly, your users can stay in `Salesforce`\
    \ and never have to bounce between the two (also covered later).\n\n### Tip\n\n\
    Salesforce allows you to relate objects to one another. Should your `Case` object\
    \ need multiple records of another, you can create a junction object. For instance,\
    \ if you would like to relate multiple products that are involved in one case,\
    \ you can do so. Creating custom objects is simpler than you may think.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig4_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig4_HTML.jpg)\n\
    \n*Figure 3-4* Case layout with standard related lists\n\n## Creating a New Case\
    \ Record\n\nYou can manually enter a case by first navigating to the `Case` object\
    \ (see Figure [3-5](#437055_1_En_3_Chapter.xhtml#Fig5)) and then clicking the\
    \ `New` button. Once a record has opened, you can begin filling in the case details\
    \ by adding the contact name, account name, priority, case origin, type, and case\
    \ reason (see Figure [3-6](#437055_1_En_3_Chapter.xhtml#Fig6)). Make sure to capture\
    \ the client’s explanation or reasoning for reaching out in the `Subject` and\
    \ `Description` fields (Figure [3-6](#437055_1_En_3_Chapter.xhtml#Fig6)). While\
    \ you are adding these details, utilize the `Internal Comments` field if necessary.\
    \ If you have created custom fields for your `Case` object, make sure to train\
    \ your users on filling in these details as well.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig5_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig5_HTML.jpg)\n\
    \n*Figure 3-5* If you are not already on the `Cases` tab, use the down-facing\
    \ arrow next to the object title to navigate to the `Cases` tab\n\nThe following\
    \ steps are recommended to create a new case record (Figures [3-6](#437055_1_En_3_Chapter.xhtml#Fig6)\
    \ and [3-7](#437055_1_En_3_Chapter.xhtml#Fig7)):\n\n1.  Type the contact name\
    \ and click the magnifying glass next to the field to attach a contact to the\
    \ case.\n2.  The account name will automatically be assigned to the account of\
    \ the contact you attached in the contact field.\n\n### Tip\n\n`Accounts` and\
    \ `contacts` can be disabled as required fields.\n\n1.  Change the priority of\
    \ the case by clicking in the field. Select the appropriate value from the provided\
    \ values.\n2.  Select the case origin by clicking into the field and select the\
    \ appropriate value. Notice the `*` next to this field. This means that it is\
    \ required.\n3.  Select the type and case reason by clicking into the field and\
    \ selecting the appropriate value.\n4.  Fill out any custom fields appropriately\
    \ if necessary at this time.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig6_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig6_HTML.jpg)\n\
    \n    *Figure 3-6* Creating a case, steps 1 to 6\n\n5.  Type in the subject of\
    \ the case.\n6.  Type in the description of the case.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig7_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig7_HTML.jpg)\n\
    \n    *Figure 3-7* Creating a case, steps 7 and 8\n\n    **Note** The `Subject`\
    \ and `Description` fields are used in the email-to-case functions.\n\n7.  Once\
    \ complete, click `Save`.\n\n### Tip\n\nUtilize the case `Date/Time Opened` and\
    \ `Date/Time Closed` fields to generate reports about case duration. Also, the\
    \ case type and reason fields can help define client and internal FAQs.\n\n##\
    \ Collaborating with Your Team on a Case Record\n\nManaging and efficiently closing\
    \ cases can take more than one person being involved from your team. Users can\
    \ utilize the case feed found in their case record to quickly communicate with\
    \ others on your team. They can also direct a message to any Salesforce user who\
    \ has access to the case record.\n\nTo mention a comment to a user, you use the\
    \ `@` symbol followed by the user’s name and, once the name populates below the\
    \ text area, click the hyperlinked name. You’ll also see that every action is\
    \ tracked in the case feed for a complete view of the case and what happened throughout\
    \ its duration. The feed filters on the left side of the case record help you\
    \ to quickly navigate to case’s feed-related items. Feed details will display\
    \ from the oldest at the bottom to the newest created at the top. This gives you\
    \ a quick view of the latest conversations or work done on the case. Figure [3-8](#437055_1_En_3_Chapter.xhtml#Fig8)\
    \ shows the functions of the case feed.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig8_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig8_HTML.jpg)\n\
    \n*Figure 3-8* Case feed\n\nTo collaborate with your team, follow these steps:\n\
    \n1.  Access the case feed by clicking the tab `Feed`.\n2.  Utilize the post area\
    \ to communicate with your team on the case.\n3.  Utilize the case feed to track\
    \ all conversations throughout the case duration.\n4.  The case feed captures\
    \ changes made to the case status.\n5.  The case feed also tracks activities such\
    \ as the `Log a Call` activity and other general tasks (see Figure [3-9](#437055_1_En_3_Chapter.xhtml#Fig9)).\n\
    \n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig9_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig9_HTML.jpg)\n\
    \n    *Figure 3-9* Utilizing feed filters to quickly navigate to the all call\
    \ logs, case notes, status changes, and task and events\n\n## Case Automation\n\
    \nSalesforce offers the ability to automate functions such as automatically assigning\
    \ a case to a queue or to a specific user. Salesforce also allows you to create\
    \ rules to auto-respond to your clients related to a case based on specific criteria.\
    \ You can also configure case escalation rules based on criteria that will automatically\
    \ assign the case to an escalated case. Along with this case escalation, you can\
    \ apply automated notifications to be sent when this criterion is met. You can\
    \ also route cases from your email or from a web form. You are also able to adjust\
    \ some support settings that allow you to further customize your case automation.\
    \ Figure [3-10](#437055_1_En_3_Chapter.xhtml#Fig10) shows a case queue.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig10_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig10_HTML.jpg)\n\
    \n*Figure 3-10* Case queue"
