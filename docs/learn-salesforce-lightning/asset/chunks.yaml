- fmt: "# Tabular Report Formats\n\nThe Tabular format reports are easily comparable\
    \ to a flat file like a spreadsheet. This report format contains columns as the\
    \ different data points and rows with your actual records. These reports are best\
    \ used for creating a list of records like a call list or to list records with\
    \ one grand total. This report format can’t be grouped, and you can’t display\
    \ the information in a chart or use it in a dashboard component unless you use\
    \ a row limit filter (see Figure [5-33](#437055_1_En_5_Chapter.xhtml#Fig33)).\
    \ Most clients will use a Tabular report format to see a grand total of their\
    \ sales with specific criteria set. For instance, if you want to run a quick report\
    \ on all the sales your team generated for a quarter, you could use a tabular\
    \ report. Figure [5-13](#437055_1_En_5_Chapter.xhtml#Fig13) shows what a call\
    \ list tabular report would look like.\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig13_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig13_HTML.jpg)\n\
    \nFigure 5-13\n\nTabular report example\n\n# Summary Report Format\n\nThe Summary\
    \ report format is the most widely used report format in Salesforce. This type\
    \ of report format allows you to group and summarize your data for up to three\
    \ levels. Within these groups, you can summarize on the column and obtain the\
    \ subtotal for that particular grouping and at the end of your report the grand\
    \ total. You can use formulas in this report to further define your report. You\
    \ can use this type of report format to show how your sales users are stacked\
    \ against each other by grouping on opportunity owner. You can also use this report\
    \ to determine who in your company holds the highest record count by also grouping\
    \ on users of that record. Or you can build a report to group the different type\
    \ of contacts you have by title. This format can also be used and represented\
    \ on a dashboard and in charts. When you leave your report ungrouped, it will\
    \ display in a Tabular format. Figure [5-14](#437055_1_En_5_Chapter.xhtml#Fig14)\
    \ shows a report that clients would use to see how much new business is coming\
    \ in versus how much business is coming from current clients. You can also see\
    \ that it is grouped by the user to show how each user is stacking up against\
    \ the other.\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig14_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig14_HTML.jpg)\n\
    \nFigure 5-14\n\nSummary report example\n\n# Matrix Report Format\n\nThe Matrix\
    \ report format allows you to group your data by both columns and rows. This allows\
    \ for a cross examination of your data. Just like the Summary report format, on\
    \ the groups you create in the Matrix format you can see subtotals, record counts,\
    \ and grand totals as well as see them by row or column, as shown in Figure [5-15](#437055_1_En_5_Chapter.xhtml#Fig15).\
    \ Use this type of report to show how well products perform over date ranges by\
    \ grouping your columns by date and your rows by opportunity products. Or use\
    \ this report to determine how well your users are performing over time. Use this\
    \ report to compare your incoming case origin against your case reasons. This\
    \ type of report can also be used in dashboard components as well as charts. Additionally,\
    \ you can use formulas to further calculate your data. If your groupings or criteria\
    \ display no results, this format report will be downgraded to Summary format.\n\
    \n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig15_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig15_HTML.jpg)\n\
    \nFigure 5-15\n\nMatrix report example\n\n## Report Filters\n\nWhile in the report\
    \ builder it will be necessary to understand the use of report filters that Salesforce\
    \ has to offer. You can utilize up to five filter features to help customize your\
    \ reports further. Filters allow you to get a closer look at your data and make\
    \ it more specific for your reporting needs.\n\n### Standard Filters\n\nStandard\
    \ filters in the report builder of Salesforce will differ for some objects. Since\
    \ the data you are collecting across accounts and contacts is different from that\
    \ of opportunities or cases, you’ll see these standard report filters change based\
    \ on the report type. Let’s take a look at each report type and their standard\
    \ filters.\n\n#### Accounts, Contacts, and Leads\n\nAccounts, contacts, and leads\
    \ all share similar standard report filters. Like most things to learn in Salesforce,\
    \ if you understand the components of one object, those sometimes will translate\
    \ into other objects. For the accounts, contacts, and leads, you’ll find they\
    \ share similar attributes.\n\n*   *All accounts*: This report filter allows you\
    \ to choose if you see all accounts regardless of the owner, only contacts you\
    \ own, only the accounts you own, or your team’s accounts, as shown in Figure\
    \ [5-16](#437055_1_En_5_Chapter.xhtml#Fig16). If you have security set in place\
    \ with role hierarchies or sharing rules, your users will only be able to see\
    \ the accounts, contacts, and leads they are set up to see.\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig16_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig16_HTML.jpg)\n\
    \n    Figure 5-16\n\n    Account filter for ownership of records\n\n*   *All leads*:\
    \ This report filter for leads is similar; you have the option to see the leads\
    \ you own, your team’s leads, and user-owned leads (compared to queue owned),\
    \ queue-owned leads, and all leads, as shown in Figure [5-17](#437055_1_En_5_Chapter.xhtml#Fig17).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig17_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig17_HTML.jpg)\n\
    \n    Figure 5-17\n\n    Lead filter for the ownership of records\n\n*   For the\
    \ accounts, contacts, and leads, you can choose from any date field within that\
    \ report type to filter from as well as use Salesforce smart dates. Smart dates\
    \ allow you to choose dates that will update to the relative time every time you\
    \ run your report. For instance, you can choose from the drop-down This Week or\
    \ Current Calendar Year or use your own custom date range in the From and To fields,\
    \ as shown in Figure [5-18](#437055_1_En_5_Chapter.xhtml#Fig18).\n\n    **Note**\
    \ If these smart dates don’t work for your report, see “Field Filters” for more\
    \ ideas.\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig18_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig18_HTML.jpg)\n\
    \n    Figure 5-18\n\n    Smart date filters"
