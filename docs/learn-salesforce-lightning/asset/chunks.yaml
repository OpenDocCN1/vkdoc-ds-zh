  trans: "\n# 创建案例升级规则\n\n案例升级规则允许你创建自动化流程，用于决定案例何时会被升级以及升级后将执行哪些操作。与你上一节创建的其他规则类似，你可以根据案例的字段级条件来确定其升级时机。一旦满足字段级条件，你就可以设置相应操作，例如发送通知邮件、将案例重新分配给其他用户，以及通知该用户。图\
    \ 3-27 到 3-34 展示了设置过程。具体步骤包括：\n\n1.  点击 Salesforce 窗口右上角的设置齿轮图标，导航至设置菜单。\n\n2.\
    \  在搜索区域输入 **升级规则（Escalation Rules）**。在“服务（Service）”部分下点击 `升级规则（Escalation Rules）`。\n\
    \n3.  点击 `新建（New）` 以创建升级规则。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig27_HTML.jpg](img/437055_1_En_3_Fig27_HTML.jpg)\n\
    \n图 3-27\n\n导航至案例升级规则\n\n4.  为规则命名并点击 `保存（Save）`。你可以通过选中`激活（Active）`复选框立即激活该规则，或者稍后再激活。\n\
    \n5.  点击 `保存（Save）`。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig28_HTML.jpg](img/437055_1_En_3_Fig28_HTML.jpg)\n\
    \n图 3-28\n\n为你的案例升级规则命名\n\n6.  保存规则名称后，页面将带你返回案例分配区域。点击你刚刚创建的规则名称。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig29_HTML.jpg](img/437055_1_En_3_Fig29_HTML.jpg)\n\
    \n图 3-29\n\n调取你的案例升级规则\n\n7.  点击 `新建（New）` 按钮。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig30_HTML.jpg](img/437055_1_En_3_Fig30_HTML.jpg)\n\
    \n图 3-30\n\n为你的案例升级规则创建条件\n\n**注意** 在图 3-30 中，请注意`激活（Active）`复选框；你将在使用`激活（Active）`复选框完成规则后在此处激活它。\n\
    \n8.  如果这是你的第一个案例升级规则，请在`排序顺序（Sort Order）`字段中输入数字 **1**。如果你配置了许多规则，`排序顺序（Sort\
    \ Order）`字段会告知 Salesforce 哪个规则应该先运行。一旦某个规则运行并执行了操作，它将不会对同一个案例运行其他规则。请根据重要程度为你所有的规则指定排序。\n\
    \n9.  在步骤 2 中，你创建规则条件。规则条件告知 Salesforce，如果你在此处输入的条件在案例上为真，那么它将发送邮件（步骤 9 和 10）。\n\
    \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig31_HTML.jpg](img/437055_1_En_3_Fig31_HTML.jpg)\n\
    \n图 3-31\n\n为案例升级规则创建规则条件\n\n    1.  要开始此过程，你首先需要点击字段列中的`无（None）`。在这里，你将选择 Salesforce\
    \ 应为该规则评估的字段。这可以是案例类型、案例原因、案例来源、客户、联系人信息，或者案例、客户或联系人的任何字段条件。\n    2.  选择合适的运算符。例如，如果你希望每个等于特定值的案例类型自动触发邮件，你可以选择“等于（equals）”运算符并选择那些值。\n\
    \    3.  选择或输入案例将自动发送邮件的相应值或结果。\n    4.  你也可以通过点击`添加过滤逻辑（Add Filter Logic）`来配置你的过滤逻辑。这允许你将逻辑从“所有”字段条件（使用“且（and）”）更改为“或（or）”。例如，你可以设置如果案例类型是“问题（Problem）”或案例来源是“邮件（Email）”。标准设置会使该逻辑语句变成“如果案例类型是‘问题（Problem）’且案例来源是‘邮件（Email）’。”\n\
    \n10.  在步骤 3 中，你可以选择为此升级设置一个工作时间。\n\n**注意** 要选择设置工作时间，你需要在 Salesforce 中已创建它。请在设置菜单中搜索\
    \ *business hours* 以获取更多信息。默认情况下，工作时间设置为每周 7 天，每天 24 小时。\n\n11.  在步骤 4 中，你选择如何确定升级时间。\n\
    \    1.  你可以选择在案例创建时评估，这只会在案例创建时评估一次条件。\n    2.  你可以选择在案例创建时评估，并在案例首次修改后禁用。此选项将在案例首次被修改后（通常是在用户开始处理它之后）检查你的案例条件。\n\
    \    3.  你可以选择案例的最后修改时间。这将在每次对案例进行更改时检查其条件。这将允许在案例被修改时应用升级规则。\n\n12.  点击 `保存（Save）`。\n\
    \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig32_HTML.jpg](img/437055_1_En_3_Fig32_HTML.jpg)\n\
    \n图 3-32\n\n选择工作时间以及案例升级规则应何时运行\n\n13.  点击 `新建（New）` 按钮以开始创建你的操作。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig33_HTML.jpg](img/437055_1_En_3_Fig33_HTML.jpg)\n\
    \n图 3-33\n\n创建你的升级规则操作\n\n14.  对于`时长超过（Age Over）`字段，你需要确定匹配条件的案例在升级前可以保持开启状态的小时数。你可以更改下拉菜单以显示单个分钟数，或调整为以\
    \ 30 分钟为增量。\n\n15.  在“选择以下一种或多种操作”下，你可以执行以下操作：\n    1.  选择将案例重新分配给另一个用户或队列。在“自动将案例重新分配给（Auto-reassign\
    \ cases to）”旁边的字段中，选择一个将发送给该用户或属于该队列的用户的邮件模板。\n    2.  选择谁将收到案例已升级的通知，并选择应通知该用户的通知模板。通常，这是管理层中的某个人。\n\
    \    3.  如果你不选择重新分配案例，此时可以通知案例的当前所有者其已升级。\n    4.  在`附加电子邮件（Additional Emails）`字段中，除之前的设置外，选择是否还有其他人员应收到案例升级的通知。\n\
    \n16.  完成操作后，点击 `保存（Save）` 按钮。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig34_HTML.jpg](img/437055_1_En_3_Fig34_HTML.jpg)\n\
    \n图 3-34\n\n在你的案例升级规则上设置操作\n\n## 提示\n\n你可以创建一个包含多项操作的升级规则，例如，如果你希望某个特定案例在满足规则条件两小时后被升级。然后，如果四小时后该案例仍未关闭，并且你想再次升级它，你可以进行相应设置。你所需做的只是再创建一个操作。\n"
- fmt: '# Setting Up Email-to-Case


    `Email-to-case` is a function that allows you to automatically have a case created
    based on an email being sent to a specific email address. For instance, if you
    have a support group that manages tech questions about your products, you can
    publicize an email and allow clients to submit requests that will automatically
    be routed to Salesforce and create a case for you. Figures [3-35](#437055_1_En_3_Chapter.xhtml#Fig35)
    through [3-42](#437055_1_En_3_Chapter.xhtml#Fig42) will walk you through this
    setup.


    1.  Navigate to the Setup menu by clicking the settings cog icon in the upper-right
    corner of the Salesforce window.

    2.  Using your search area, enter **Email**. Click `Email-to-Case` under Service.

    3.  Click the `Edit` button.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig35_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig35_HTML.jpg)


    Figure 3-35: Navigating to the email-to-case setup


    4.  Select the boxes `Enable Email-to-Case` and `Enable HTML Email`.

    5.  Click the `Save` button.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig36_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig36_HTML.jpg)


    Figure 3-36: Enabling the email-to-case function


    6.  Click the `New` button.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig37_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig37_HTML.jpg)


    Figure 3-37: Creating a new routing address for the email-to-case setup


    7.  Enter the email''s routing name. Usually, this is the name of the email.

    8.  Enter the actual routing email address.

    9.  You can choose to save an email''s header and set who you will accept them
    from. However, because these are usually images, it will take up 15KB of your
    organization''s storage. Most users do not enable this option.

    10.  Under Task Settings, you can create a task along with the case being created
    when it comes in.

    11.  Under Case Setting, set the priority of the case and the case origin.

    12.  Click `Save` or click `Save & New` to set up more email routing addresses.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig38_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig38_HTML.jpg)


    Figure 3-38: Setting up your routing address for the email-to-case function


    13.  An email will be sent automatically to the routing address that you entered
    in step 8. If you don''t receive an email within a couple hours, make sure to
    check your spam or other firewall settings your company may have or click the
    `Resend` link shown in Figure [3-39](#437055_1_En_3_Chapter.xhtml#Fig39).


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig39_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig39_HTML.jpg)


    Figure 3-39: If you don''t receive the verification email, you can use this `Resend`
    link to resend the email


    14.  The email you receive should look like the example in Figure [3-40](#437055_1_En_3_Chapter.xhtml#Fig40).
    You''ll need to click the link within the email to verify that this is a working
    email address. After clicking the link, you''ll be taken to another Salesforce
    screen; click the `Continue` button, as shown in Figure [3-41](#437055_1_En_3_Chapter.xhtml#Fig41).


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig41_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig41_HTML.jpg)


    Figure 3-41: Click `Continue`, and you''ll be taken to the Salesforce login page


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig40_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig40_HTML.jpg)


    Figure 3-40: Email verification sent


    15.  Lastly, you''ll need to apply some email forwarding rules on your email inbox
    to forward emails to the e-mail service address that Salesforce provides.


    Creating the email forwarding rule is what utilizes the on-demand email-to-case
    functions supported by Salesforce. By forwarding all your emails to the email
    service address provided by Salesforce, you can give your users a one-stop application
    with Salesforce. When an email is sent into Salesforce, the client receives a
    reply with a unique case thread found in the body and the subject line of the
    email. This case thread allows an email that comes back into the same email account
    and per your forwarding rules gets sent into Salesforce to be attached to the
    existing case. This allows your users to stay in Salesforce while they address
    support case inquiries. Figure [3-42](#437055_1_En_3_Chapter.xhtml#Fig42) shows
    a case thread.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig42_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig42_HTML.jpg)


    Figure 3-42: This case thread allows your client email to get attached to the
    appropriate case.


    ### Note


    The `email-to-case` function has some limitations. First, you can only receive
    attachments up to 10MB. Second, this option only allows up to 5,000 email messages
    a day. For workarounds, see the Setup area to have Salesforce deal with bounced
    messages. Finally, if the case thread is not included in an email, a new case
    will be created.


    ### Tip


    You would want to use the `email-to-case` option if your case inquiries are generally
    over 25MB. Also, the `email-to-case` setup will automatically identify contacts
    and replies to the case. The on-demand feature allows for a much more custom solution.
    It allows for custom field mapping, and its setup is fairly simple.'
  raw: '### Setting Up Email-to-Case


    Email-to-case is a function that allows you to automatically have a case created
    based on an email being sent to a specific email address. For instance, if you
    have a support group that manages tech questions about your products, you can
    publicize an email and allow clients to submit requests that will automatically
    be routed to Salesforce and create a case for you. Figures [3-35](#437055_1_En_3_Chapter.xhtml#Fig35)
    through [3-42](#437055_1_En_3_Chapter.xhtml#Fig42) will walk you through this
    setup.


    1.  Navigate to the Setup menu by clicking the settings cog icon in the upper-right
    corner of the Salesforce window.


    2.  Using your search area, enter **Email**-. Click Email-to-Case under Service.


    3.  Click the Edit button.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig35_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig35_HTML.jpg)


    Figure 3-35


    Navigating to the email-to-case setup


    4.  Select the boxes Enable Email-to-Case and Enable HTML Email.


    5.  Click the Save button.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig36_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig36_HTML.jpg)


    Figure 3-36


    Enabling the email-to-case function


    6.  Click the New button.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig37_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig37_HTML.jpg)


    Figure 3-37


    Creating a new routing address for the email-to-case setup


    7.  Enter the email’s routing name. Usually, this is the name of the email.


    8.  Enter the actual routing email address.


    9.  You can choose to save an email’s header and set who you will accept them
    from. However, because these are usually images, it will take up 15KB of your
    organization’s storage. Most users do not enable this option.


    10.  Under Task Settings, you can create a task along with the case being created
    when it comes in.


    11.  Under Case Setting, set the priority of the case and the case origin.


    12.  Click Save or click Save & New to set up more email routing addresses.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig38_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig38_HTML.jpg)


    Figure 3-38


    Setting up your routing address for the email-to-case function


    13.  An email will be sent automatically to the routing address that you entered
    in step 8\. If you don’t receive an email within a couple hours, make sure to
    check your spam or other firewall settings your company may have or click the
    Resend link shown in Figure [3-39](#437055_1_En_3_Chapter.xhtml#Fig39).


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig39_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig39_HTML.jpg)


    Figure 3-39


    If you don’t receive the verification email, you can use this Resend link to resend
    the email


    14.  The email you receive should look like the example in Figure [3-40](#437055_1_En_3_Chapter.xhtml#Fig40).
    You’ll need to click the link within the email to verify that this is a working
    email address. After clicking the link, you’ll be taken to another Salesforce
    screen; click the Continue button, as shown in Figure [3-41](#437055_1_En_3_Chapter.xhtml#Fig41).


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig41_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig41_HTML.jpg)


    Figure 3-41


    Click Continue, and you’ll be taken to the Salesforce login page


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig40_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig40_HTML.jpg)


    Figure 3-40


    Email verification sent


    15.  Lastly, you’ll need to apply some email forwarding rules on your email inbox
    to forward emails to the e-mail service address that Salesforce provides.


    Creating the email forwarding rule is what utilizes the on-demand email-to-case
    functions supported by Salesforce. By forwarding all your emails to the email
    service address provided by Salesforce, you can give your users a one-stop application
    with Salesforce. When an email is sent into Salesforce, the client receives a
    reply with a unique case thread found in the body and the subject line of the
    email. This case thread allows an email that comes back into the same email account
    and per your forwarding rules gets sent into Salesforce to be attached to the
    existing case. This allows your users to stay in Salesforce while they address
    support case inquiries. Figure [3-42](#437055_1_En_3_Chapter.xhtml#Fig42) shows
    a case thread.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig42_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig42_HTML.jpg)


    Figure 3-42


    This case thread allows your client email to get attached to the appropriate case.


    ### Note


    The email-to-case function has some limitations. First, you can only receive attachments
    up to 10MB. Second, this option only allows up to 5,000 email messages a day.
    For workarounds, see the Setup area to have Salesforce deal with bounced messages.
    Finally, if the case thread is not included in an email, a new case will be created.


    ### Tip


    You would want to use the email-to-case option if your case inquiries are generally
    over 25MB. Also, the email-to-case setup will automatically identify contacts
    and replies to the case. The on-demand feature allows for a much more custom solution.
    It allows for custom field mapping, and its setup is fairly simple.'
  trans: '

    # 设置电子邮件转案例


    `电子邮件转案例`是一项功能，可让您根据发送到特定电子邮件地址的邮件自动创建案例。例如，如果您有一个负责管理产品技术问题的支持小组，您可以公布一个邮箱地址，让客户提交请求，这些请求将自动路由到
    Salesforce 并为您创建案例。图 3-35 至 3-42 将引导您完成此设置过程。


    1.  通过点击 Salesforce 窗口右上角的设置齿轮图标，导航至设置菜单。

    2.  使用搜索区域，输入 **电子邮件**。在服务下点击`电子邮件转案例`。

    3.  点击`编辑`按钮。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig35_HTML.jpg](img/437055_1_En_3_Fig35_HTML.jpg)


    图 3-35：导航至电子邮件转案例设置


    4.  选中`启用电子邮件转案例`和`启用 HTML 电子邮件`复选框。

    5.  点击`保存`按钮。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig36_HTML.jpg](img/437055_1_En_3_Fig36_HTML.jpg)


    图 3-36：启用电子邮件转案例功能


    6.  点击`新建`按钮。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig37_HTML.jpg](img/437055_1_En_3_Fig37_HTML.jpg)


    图 3-37：为电子邮件转案例设置创建新的路由地址


    7.  输入电子邮件的路由名称。通常，这是电子邮件的名称。

    8.  输入实际的路由电子邮件地址。

    9.  您可以选择保存电子邮件的标头，并设置接受来自哪些发件人的邮件。但是，这些通常包含图片，会占用您组织 15KB 的存储空间。大多数用户不会启用此选项。

    10. 在任务设置下，您可以在案例创建时同时创建一个任务。

    11. 在案例设置下，设置案例的优先级和案例来源。

    12. 点击`保存`或点击`保存并新建`以设置更多电子邮件路由地址。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig38_HTML.jpg](img/437055_1_En_3_Fig38_HTML.jpg)


    图 3-38：为电子邮件转案例功能设置路由地址


    13. 系统会自动向您在步骤 8 中输入的路由地址发送一封电子邮件。如果您在几小时内没有收到邮件，请检查您的垃圾邮件文件夹或公司可能设置的防火墙，或者点击图
    3-39 中显示的`重新发送`链接。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig39_HTML.jpg](img/437055_1_En_3_Fig39_HTML.jpg)


    图 3-39：如果您没有收到验证邮件，可以使用此`重新发送`链接重新发送邮件


    14. 您收到的邮件应类似于图 3-40 中的示例。您需要点击邮件中的链接来验证这是一个有效的电子邮件地址。点击链接后，您将进入另一个 Salesforce
    屏幕；点击`继续`按钮，如图 3-41 所示。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig41_HTML.jpg](img/437055_1_En_3_Fig41_HTML.jpg)


    图 3-41：点击`继续`，您将进入 Salesforce 登录页面


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig40_HTML.jpg](img/437055_1_En_3_Fig40_HTML.jpg)


    图 3-40：已发送电子邮件验证


    15. 最后，您需要在您的电子邮件收件箱中应用一些电子邮件转发规则，将电子邮件转发到 Salesforce 提供的电子邮件服务地址。


    创建电子邮件转发规则是利用 Salesforce 支持的按需电子邮件转案例功能的关键。通过将所有电子邮件转发到 Salesforce 提供的电子邮件服务地址，您可以为用户提供与
    Salesforce 的一站式应用体验。当电子邮件发送到 Salesforce 时，客户会收到一封回复，该回复的邮件正文和主题行中包含唯一的案例线索。此案例线索允许回复到同一邮箱的电子邮件根据您的转发规则被发送到
    Salesforce，并关联到现有案例。这使得您的用户在处理支持案例查询时可以停留在 Salesforce 中。图 3-42 展示了一个案例线索。


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig42_HTML.jpg](img/437055_1_En_3_Fig42_HTML.jpg)


    图 3-42：此案例线索允许您的客户邮件关联到相应的案例。


    ### 注意


    `电子邮件转案例`功能有一些限制。首先，您只能接收大小不超过 10MB 的附件。其次，此选项每天仅允许处理多达 5,000 封电子邮件。有关解决方法，请参阅设置区域，让
    Salesforce 处理退回邮件。最后，如果邮件中不包含案例线索，则会创建一个新案例。


    ### 提示


    如果您的案例查询通常超过 25MB，您可能需要使用`电子邮件转案例`选项。此外，`电子邮件转案例`设置会自动识别联系人和回复并关联到案例。按需功能提供了更自定义的解决方案。它允许进行自定义字段映射，并且其设置相当简单。

