    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig31_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig31_HTML.jpg)\n\
    \nFigure 3-31\n\nCreating your rule criteria for the case escalation rule\n\n\
    1.  To start this process, you’ll first need to click None in the field column.\
    \ Here you will select the field that Salesforce should evaluate for the rule.\
    \ This can be the case type, case reason, case organ, account, contact information,\
    \ or any field criteria found in the case, account, or contact.\n\n2.  Choose\
    \ the appropriate operator. For instance, if you want every case type that equals\
    \ a specific value to automate the email, you would choose the operator “equals”\
    \ and select those values.\n\n3.  Choose or enter the appropriate value or outcome\
    \ in which the case will autosend the email.\n\n4.  You can also configure your\
    \ filter logic by clicking Add Filter Logic. This allows you to change the logic\
    \ from being “all” the field criteria (using “and”) to “or.” For example, you\
