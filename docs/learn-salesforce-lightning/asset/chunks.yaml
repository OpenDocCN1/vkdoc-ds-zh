  trans: "\n## 创建案例队列\n\n案例可通过多种方式发送到队列。您可以在创建案例时自动将其分配给队列，或在案例生命周期中，由于案例记录的变更而将其发送到队列。您可以将队列视为一个“暂存池”。这个暂存池允许您授予多个用户访问权限，并让他们选择接受新案例。您不必将案例分配给特定所有者，而是可以使用案例分配规则将其分配给队列。在图\
    \ `[3-11]` 到 `[3-14]` 中，您将学习如何在 `Salesforce` 中创建队列。具体步骤如下：\n\n1.  单击 `Salesforce`\
    \ 窗口右上角的设置齿轮图标，导航到 `Setup` 菜单。\n2.  使用搜索区域，输入 `Queue`。点击 `Users` 下的 `Queues`。\n\
    3.  点击 `New` 按钮。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig11_HTML.jpg](img/437055_1_En_3_Fig11_HTML.jpg)\n\
    \n    图 3-11\n    创建案例队列\n\n4.  为队列创建一个面向用户的标签，然后按 `Tab` 键。`Salesforce` 会自动创建队列名称。\n\
    5.  如果您希望在有新案例添加到队列时收到通知，请将电子邮件地址填入 `Queue Email` 字段。\n6.  如果您希望分配给该队列的用户在队列中有新案例时收到电子邮件，请选中\
    \ `Send Email to Members` 复选框。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig12_HTML.jpg](img/437055_1_En_3_Fig12_HTML.jpg)\n\
    \n    图 3-12\n    为队列命名并设置通知选项\n\n7.  选择 `Case` 对象，然后单击箭头将其移至 `Selected Objects`\
    \ 区域。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig13_HTML.jpg](img/437055_1_En_3_Fig13_HTML.jpg)\n\
    \n    图 3-13\n    为队列选择对象\n\n8.  使用搜索区域，在下拉菜单中选择您是要搜索特定用户、公共组、角色，还是角色及其下属。\n\n\
    \    **注意：** 选择 `Roles and Subordinates` 选项将授予特定角色及其所有下级角色对特定队列的访问权限。例如，如果您的 `CEO`\
    \ 位于角色层次结构的顶层，并且您使用此功能授予 `CEO` 访问权限，那么 `CEO` 角色以下的所有人员也将获得访问权限。\n\n9.  选择特定的用户、公共组、角色，或角色及其下属，然后使用向右箭头将其移至\
    \ `Selected Members` 区域。\n10. 点击 `Save`。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig14_HTML.jpg](img/437055_1_En_3_Fig14_HTML.jpg)\n\
    \n    图 3-14\n    选择需要访问此队列的用户、组、角色或角色层次。\n\n### 提示\n\n`Queues` 不仅可用于案例。您可以像设置案例那样，设置线索队列和线索分配规则。\n\
    \n## 创建案例分配规则\n\n现在您已经创建了第一个队列，接下来就可以自动将案例分配给该队列或特定所有者了。您可以根据案例中的特定条件以及与案例相关的记录来创建案例分配规则。例如，您可以创建一条分配规则，将针对特定客户或联系人的所有案例自动分配给特定用户。或者，您可以根据案例来源、案例原因、案例类型或案例记录中的任何其他字段，将案例分配到队列。有些公司会为\
    \ `VIP` 客户或白金客户创建队列，只允许最有经验的用户处理这些案例。图 `[3-15]` 到 `[3-20]` 展示了此过程。分步流程如下：\n\n\
    1.  单击 `Salesforce` 窗口右上角的设置齿轮图标，导航到 `Setup` 菜单。\n2.  使用搜索区域，输入 `Case Assignment`。点击\
    \ `Service` 下的 `Case Assignment`。\n3.  点击 `New` 开始创建案例分配规则。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig15_HTML.jpg](img/437055_1_En_3_Fig15_HTML.jpg)\n\
    \n    图 3-15\n    访问案例分配规则\n\n4.  为规则命名并点击 `Save`。您可以立即通过勾选 `Active` 复选框来激活此规则，或者暂缓，稍后再激活。\n\
    5.  点击 `Save`。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig16_HTML.jpg](img/437055_1_En_3_Fig16_HTML.jpg)\n\
    \n    图 3-16\n    创建案例分配名称并激活它\n\n    保存规则名称后，页面将返回案例分配区域。点击您刚刚创建的规则名称。\n\n  \
    \  ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig17_HTML.jpg](img/437055_1_En_3_Fig17_HTML.jpg)\n\
    \n    图 3-17\n    检索您的案例分配规则\n\n6.  点击 `New` 按钮。\n\n    **注意：** 在图 `[3-18]` 中，请注意\
    \ `Modified By` 上方的 `Active` 复选框。这就是您在完成规则后，通过勾选 `Active` 复选框来激活规则的位置。\n\n   \
    \ ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig18_HTML.jpg](img/437055_1_En_3_Fig18_HTML.jpg)\n\
    \n    图 3-18\n    为案例分配创建规则条件\n\n7.  如果这是您首次创建案例规则分配，请在 `Sort Order` 字段中输入数字 `1`。如果您配置了多条规则，`Sort\
    \ Order` 字段将告知 `Salesforce` 优先运行哪些规则。一旦某条规则运行并分配了案例，系统将不再对该案例运行其他规则。请根据重要性为所有规则设置排序。\n\
    8.  在步骤 2 中，您需要创建规则条件。规则条件告知 `Salesforce`：如果此处输入的条件为真，则将案例分配到指定位置（步骤 9 和 10）。\n\
    \n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig19_HTML.jpg](img/437055_1_En_3_Fig19_HTML.jpg)\n\
    \n    图 3-19\n    为案例分配规则设置字段条件\n\n    a.  首先，您需要点击字段列中的 `None`。在此处，您将选择 `Salesforce`\
    \ 应评估该规则的字段。这可以是案例类型、案例原因、案例来源、客户、联系人信息，或案例、客户、联系人中的任何字段条件。\n    b.  选择合适的运算符。例如，如果您希望每个等于特定值的案例类型都自动分配给特定用户，则应选择运算符\
    \ `equals` 并选择那些值。\n    c.  选择或输入案例将自动分配到的适当值或结果。\n    d.  您也可以通过点击 `Add Filter\
    \ Logic` 配置筛选逻辑。这允许您将逻辑从“全部”字段条件（使用 `and`）更改为 `or`。例如，您可以说，如果案例类型是 `Problem` 或案例来源是\
    \ `Email`。标准设置会使该逻辑句子变为：“如果案例类型是 `Problem` 并且案例来源是 `Email`。”\n\n9.  选择将案例分配给特定用户或您在前一部分中设置的队列。\n\
    10. 选择您希望自动发送给用户或队列的电子邮件模板。\n11. 点击 `Save`，或者点击 `Save and New` 来设置另一条案例分配规则。\n\
    \n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig20_HTML.jpg](img/437055_1_En_3_Fig20_HTML.jpg)\n\
    \n    图 3-20\n    分配特定用户或队列并向他们发送通知\n\n### 注意\n\n步骤 4 提供的功能不是 `Lightning` 组件，需要在\
    \ `Classic` 中进行设置。\n"
- fmt: '### Creating Case Auto-Response Rules


    Case auto-response rules allow you automate communication with your client based
    on field-level change. For instance, if you want an email sent to your client
    when the status of the case changes from one value to another, you can do that.
    Any field-level change from a value to another can activate this email send or
    another automation. Figures [3-21](#437055_1_En_3_Chapter.xhtml#Fig21) through
    [3-26](#437055_1_En_3_Chapter.xhtml#Fig26) will walk you through creating case
    auto-response rules.


    1.  Navigate to the Setup menu by clicking the settings cog icon in the upper-right
    corner of the Salesforce window.


    2.  Using your search area, enter **Case Auto-Response**. Click `Case Auto-Response
    Rules` under `Service`.


    3.  Click `New` to start the Case Auto-Response rule.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig21_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig21_HTML.jpg)


    Figure 3-21


    Accessing case auto-response rules


    4.  Name the rule and click `Save`. You can activate the rule now by checking
    the `Active` check box or hold off and activate it later.


    5.  Click `Save`.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig22_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig22_HTML.jpg)


    Figure 3-22


    Naming your case auto-response rule


    6.  After saving the rule name, it will return you to the case assignment area.
    Click the rule name you just created.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig23_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig23_HTML.jpg)


    Figure 3-23


    Retrieving your case auto-response rule


    7.  Click the `New` button.


    **Note** In Figure [3-24](#437055_1_En_3_Chapter.xhtml#Fig24), notice the `Active`
    check box above the `Modified By` field. This is where you can activate the rule
    after you have completed it using the `Active` check box.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig24_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig24_HTML.jpg)


    Figure 3-24


    Creating your new rule criteria for the case auto-response rule


    8.  If this is your first case auto-response rule, type the number `1` into the
    `Sort Order` field.


    9.  In step 2 you create the rule criteria. The rule criteria tells Salesforce
    that if the criteria you enter here is true on the case, then send the email (steps
    9 and 10).


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig25_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig25_HTML.jpg)


    Figure 3-25


    Creating the criteria for your case auto-response rule


    1.  To start this process, you’ll first need to click `None` in the field column.
    Here you will select the field that Salesforce should evaluate for the rule. This
    can be the case type, case reason, case organ, account, contact information, or
    any field criteria found in the case, account, or contact.


    2.  Choose the appropriate operator. For instance, if you want every case type
    that equals a specific value to automate the email, you would choose the operator
    "equals" and select those values.


    3.  Choose or enter the appropriate value or outcome in which the case will auto
    send the email.


    4.  You can also configure your filter logic by clicking `Add Filter Logic`. This
    allows you to change the logic from being "all" the field criteria (using "and")
    to "or." For example, you can say if the case type is Problem OR the case origin
    is Email. The standard setup would make that logic sentence be "If the case type
    is Problem AND the case origin is Email."


    10.  In step 3, you’ll need to provide the name of who the email is coming from.


    11.  Enter the sender’s email address in the `Email Address` field.


    12.  Provide a reply-to address should the client want to respond to the email.


    **Note** You can only use one of your user’s emails or an email that you set up
    as an organization-wide email.


    13.  Assign the email template that you want to be sent for this auto-response
    rule.


    14.  Once steps 1 through 4 are complete, click `Save`.


    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig26_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig26_HTML.jpg)


    Figure 3-26


    Setting up who the email is coming from and your email template'
