- fmt: "### Importing Accounts and Contacts with the Data Import Wizard\n\nThe Salesforce\
    \ Data Import Wizard is a great, easy-to-use tool. It provides videos to help\
    \ walk you through importing and has a great FAQ section. It even gives you a\
    \ step-by-step process for setting up the import. It is important to keep your\
    \ Salesforce data accurate and current. Whether you are importing accounts and\
    \ contacts for the first time or adding new ones to the system, you’ll need to\
    \ know how to do this for data integrity.\n\n1. **Prepare your data for import**.\
    \ Accounts in a standard Salesforce setup require the account name. Along with\
    \ accounts, you can import contacts. Contacts in a standard Salesforce setup will\
    \ require an account name and the last name. Because an account name is required\
    \ for a contact, you can in your CSV file set the account and account details\
    \ in one row and just use the account name for all the contacts related to that\
    \ account for additional contacts. If you populate different account field details\
    \ in the account fields to each contact, the last row of the import for that account\
    \ will reflect in Salesforce. In Figure [8-4](#437055_1_En_8_Chapter.xhtml#Fig4),\
    \ Cloud Creations on row 5 would be the information seen in Salesforce after the\
    \ import is performed.\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig4_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig4_HTML.jpg)\
    \  \n   *Figure 8-4 – Data ready for an import*\n\n2. **Navigate to the Setup\
    \ menu**, as shown in Figure [8-5](#437055_1_En_8_Chapter.xhtml#Fig5).\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig5_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig5_HTML.jpg)\
    \  \n   *Figure 8-5 – Navigating to the Setup menu*\n\n3. In the Quick Find box,\
    \ type `Data import` (don’t hit the `Enter` key; the option will populate as you\
    \ type). Click `Data Import Wizard`, as shown in Figure [8-6](#437055_1_En_8_Chapter.xhtml#Fig6).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig6_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig6_HTML.jpg)\
    \  \n   *Figure 8-6 – Searching for Data Import Wizard*\n\n4. Click the green\
    \ `Launch Wizard!` button, as shown in Figure [8-7](#437055_1_En_8_Chapter.xhtml#Fig7).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig7_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig7_HTML.jpg)\
    \  \n   *Figure 8-7 – Accessing the Data Import Wizard*\n\n5. Under the “What\
    \ kind of data are you importing?” question, click `Accounts and Contacts` on\
    \ the “Standard objects” tab, as shown in Figure [8-8](#437055_1_En_8_Chapter.xhtml#Fig8).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig8_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig8_HTML.jpg)\
    \  \n   *Figure 8-8 – What kind of data are you importing?*\n\n6. Under the “What\
    \ do you want to do?” question, click “add new records” and the following information\
    \ will appear:\n   - **Match contact by**: This allows you to match your CSV data\
    \ to an existing contact, if it already exists in Salesforce, by the full name\
    \ of the contact, email, or any field you have created and made a unique ID or\
    \ external ID. This helps to prevent duplication when importing. You would want\
    \ to choose which you think is the best match. Most commonly an email is used.\n\
    \n   > **Note**  \n   > The unique ID or external ID is an ID or a unique identifier\
    \ that relates only to that record. When transitioning data from another CRM to\
    \ Salesforce, your other CRM will contain its own unique ID. You should create\
    \ a field and mark it as an external ID and import this field to your Salesforce\
    \ instance. This will allow you to make updates to it in the future should you\
    \ forget to include something in your original import. Or, for business use integrations\
    \ to other systems, an external ID is essential to relate the two organizations\
    \ together and make sure that you have only one record being updated. Salesforce\
    \ creates its own unique ID for every record created as well; it is a 15- to 18-character\
    \ alphanumeric ID. You can find this ID for your records in reports; just search\
    \ for the field `ID`, as shown in Figure [8-9](#437055_1_En_8_Chapter.xhtml#Fig9),\
    \ or find it in the URL of your browser, as shown in Figure [8-10](#437055_1_En_8_Chapter.xhtml#Fig10).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig10_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig10_HTML.jpg)\
    \  \n   *Figure 8-10 – Where you can find your record ID in your browser URL*\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig9_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig9_HTML.jpg)\
    \  \n   *Figure 8-9 – How you can search for the ID for your record in reports*\n\
    \n7. **Match Account by**: This allows you to match your CSV data to an existing\
    \ account, if it already exists in Salesforce, by the account name and site (a\
    \ standard web site field on accounts) or any field you have created and made\
    \ a unique ID or external ID, as shown in Figure [8-11](#437055_1_En_8_Chapter.xhtml#Fig11).\n\
    \n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig11_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig11_HTML.jpg)\
    \  \n   *Figure 8-11 – What do you want to do?*\n\n   > **Note**  \n   > You can\
    \ make any of the following data type fields a unique ID or external ID by creating\
    \ or editing the field and selecting the unique or external ID check box: `auto-number`,\
    \ `email`, `number`, or `text`.\n\n8. Salesforce allows for automated processes\
    \ made with workflow rules or the Process Builder to be enabled or disabled. By\
    \ checking the box, you are enabling them to be active during this import. This\
    \ is important to consider if you have created actions that include email and\
    \ tasks because this could bombard your clients or users. For example, you could\
    \ have a workflow rule that can email a contact a welcome email every time a contact\
    \ is created. If you keep this selected, all contacts imported will receive this\
    \ email.\n\n9. You can also assign all contacts imported to an existing campaign.\
    \ If you select this option, you need to include a column in your import containing\
    \ the campaign Salesforce ID.\n\n10. Under the “Where is your data located?” question,\
    \ you can drag and drop a CSV file into the “Drag CSV file here to upload” area,\
    \ as shown in Figure [8-12](#437055_1_En_8_Chapter.xhtml#Fig12). You can also\
    \ click CSV, Outlook CSV, ACT! CSV, or Gmail CSV and then click Choose File. Locate\
    \ the file on your machine and click Open.\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig12_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig12_HTML.jpg)\
    \  \n    *Figure 8-12 – Where is your data located?*\n\n11. Once these steps are\
    \ complete, click the `Next` button at the bottom-right corner of your screen,\
    \ as shown in Figure [8-13](#437055_1_En_8_Chapter.xhtml#Fig13).\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig13_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig13_HTML.jpg)\
    \  \n    *Figure 8-13 – Click the Next button on the screen*"
  raw: "### Importing Accounts and Contacts with the Data Import Wizard\n\nThe Salesforce\
    \ Data Import Wizard is a great, easy-to-use tool. It provides videos to help\
    \ walk you through importing and has great a FAQ section. It even gives you a\
    \ step-by-step process for setting up the import. It is important to keep your\
    \ Salesforce data accurate and current. Whether you are importing accounts and\
    \ contacts for the first time or adding new ones to the system, you’ll need to\
    \ know how to do this for data integrity.\n\n1.  Prepare your data for import\
    \ . Accounts in a standard Salesforce setup require the account name. Along with\
    \ accounts, you can import contacts. Contacts in a standard Salesforce setup will\
    \ require an account name and the last name. Because an account name is required\
    \ for a contact, you can in your CSV file set the account and account details\
    \ in one row and just use the account name for all the contacts related to that\
    \ account for additional contacts. If you populate different account field details\
    \ in the account fields to each contact, the last row of the import for that account\
    \ will reflect in Salesforce. In Figure [8-4](#437055_1_En_8_Chapter.xhtml#Fig4),\
    \ Cloud Creations on row 5 would be the information seen in Salesforce after the\
    \ import is performed.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig4_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig4_HTML.jpg)\n\
    \nFigure 8-4\n\nData ready for an import\n\n2.  Navigate to the Setup menu , as\
    \ shown in Figure [8-5](#437055_1_En_8_Chapter.xhtml#Fig5).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig5_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig5_HTML.jpg)\n\
    \nFigure 8-5\n\nNavigating to the Setup menu\n\n3.  In the Quick Find box, type\
    \ **Data** **import** (don’t hit the Enter key; the option will populate as you\
    \ type). Click Data Import Wizard, as shown in Figure [8-6](#437055_1_En_8_Chapter.xhtml#Fig6).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig6_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig6_HTML.jpg)\n\
    \nFigure 8-6\n\nSearching for Data Import Wizard\n\n4.  Click the green Launch\
    \ Wizard! button, as shown in Figure [8-7](#437055_1_En_8_Chapter.xhtml#Fig7).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig7_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig7_HTML.jpg)\n\
    \nFigure 8-7\n\nAccessing the Data Import Wizard\n\n5.  Under the “What kind of\
    \ data are you importing? question, click Accounts and Contacts on the “Standard\
    \ objects” tab, as shown in Figure [8-8](#437055_1_En_8_Chapter.xhtml#Fig8).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig8_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig8_HTML.jpg)\n\
    \nFigure 8-8\n\nWhat kind of data are you importing?\n\n6.  Under the “What do\
    \ you want to do?” question, click “add new records” and the following information\
    \ will appear:\n    *   *Match contact by*: This allows you to match your CSV\
    \ data to an existing contact, if it already exists in Salesforce, by the full\
    \ name of the contact, email, or any field you have created and made a unique\
    \ ID or external ID . This helps to prevent duplication when importing. You would\
    \ want to choose which you think is the best match. Most commonly an email is\
    \ used.\n\n**Note** The unique ID or external ID is an ID or a unique identifier\
    \ that relates only to that record. When transitioning data from another CRM to\
    \ Salesforce, your other CRM will contain its own unique ID. You should create\
    \ a field and mark it as an external ID and import this field to your Salesforce\
    \ instance. This will allow you to make updates to it in the future should you\
    \ forget to include something in your original import. Or, for business use integrations\
    \ to other systems, an external ID is essential to relate the two organizations\
    \ together and make sure that you have only one record being updated. Salesforce\
    \ creates its own unique ID for every record created as well; it is a 15- to 18-character\
    \ alphanumeric ID. You can find this ID for your records in reports; just search\
    \ for the field ID, as shown in Figure [8-9](#437055_1_En_8_Chapter.xhtml#Fig9),\
    \ or find it in the URL of your browser, as shown in Figure [8-10](#437055_1_En_8_Chapter.xhtml#Fig10).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig10_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig10_HTML.jpg)\n\
    \nFigure 8-10\n\nWhere you can find your record ID in your browser URL\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig9_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig9_HTML.jpg)\n\
    \nFigure 8-9\n\nHow you can search for the ID for your record in reports\n\n7.\
    \  *Match Account by*: This allows you to match your CSV data to an existing account,\
    \ if it already exists in Salesforce, by the account name and site (a standard\
    \ web site field on accounts) or any field you have created and made a unique\
    \ ID or external ID, as shown in Figure [8-11](#437055_1_En_8_Chapter.xhtml#Fig11).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig11_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig11_HTML.jpg)\n\
    \nFigure 8-11\n\nWhat do you want to do?\n\n**Note** You can make any of the following\
    \ data type fields a unique ID or external ID by creating or editing the field\
    \ and selecting the unique or external ID check box: auto-number, email, number,\
    \ or text.\n\n8.  Salesforce allows for automated processes made with workflow\
    \ rules or the Process Builder to be enabled or disabled. By checking the box,\
    \ you are enabling them to be active during this import. This is important to\
    \ consider if you have created actions that include email and tasks because this\
    \ could bombard your clients or users. For example, you could have a workflow\
    \ rule that can email a contact a welcome email every time a contact is created.\
    \ If you keep this selected, all contacts imported will receive this email.\n\n\
    9.  You can also assign all contacts imported to an existing campaign. If you\
    \ select this option, you need to include a column in your import containing the\
    \ campaign Salesforce ID.\n\n10.  Under the “Where is your data located?” question,\
    \ you can drag and drop a CSV file into the “Drag CSV file here to upload” area,\
    \ as shown in Figure [8-12](#437055_1_En_8_Chapter.xhtml#Fig12). You can also\
    \ click CSV, Outlook CSV, ACT! CSV, or Gmail CSV and then click Choose File. Locate\
    \ the file on your machine and click Open.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig12_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig12_HTML.jpg)\n\
    \nFigure 8-12\n\nWhere is your data located?\n\n11.  Once these steps are complete,\
    \ click the Next button at the bottom-right corner of your screen, as shown in\
    \ Figure [8-13](#437055_1_En_8_Chapter.xhtml#Fig13).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig13_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig13_HTML.jpg)\n\
    \nFigure 8-13\n\nClick the Next button on the screen"
  trans: "\n### 使用数据导入向导导入客户和联系人\n\nSalesforce 数据导入向导是一款出色且易于使用的工具。它提供视频来引导您完成导入过程，并设有完善的常见问题解答部分。甚至还为您提供了设置导入的分步流程。保持\
    \ Salesforce 数据的准确性和时效性非常重要。无论您是首次导入客户和联系人，还是向系统中添加新的客户和联系人，都需要了解如何操作以确保数据的完整性。\n\
    \n1. **准备要导入的数据**。标准 Salesforce 设置中的客户需要客户名称。除了客户，您还可以导入联系人。标准 Salesforce 设置中的联系需要客户名称和姓氏。由于联系人的导入需要客户名称，您可以在\
    \ CSV 文件中将客户和客户详细信息放在一行，对于与该客户相关的其他联系人，只需使用该客户名称即可。如果您在每个联系人的客户字段中填写了不同的客户字段详细信息，则导入过程中该客户的最后一行数据将反映在\
    \ Salesforce 中。如图 8-4 所示，第 5 行的 Cloud Creations 是导入后在 Salesforce 中看到的信息。\n\n \
    \  ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig4_HTML.jpg](img/437055_1_En_8_Fig4_HTML.jpg)\
    \  \n   *图 8-4 – 准备导入的数据*\n\n2. **导航至“设置”菜单**，如图 8-5 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig5_HTML.jpg](img/437055_1_En_8_Fig5_HTML.jpg)\
    \  \n   *图 8-5 – 导航至“设置”菜单*\n\n3. 在“快速查找”框中，输入 `Data import`（不要按 `Enter` 键；选项会随您的输入自动填充）。点击\
    \ `Data Import Wizard`，如图 8-6 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig6_HTML.jpg](img/437055_1_En_8_Fig6_HTML.jpg)\
    \  \n   *图 8-6 – 搜索数据导入向导*\n\n4. 点击绿色的 `Launch Wizard!` 按钮，如图 8-7 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig7_HTML.jpg](img/437055_1_En_8_Fig7_HTML.jpg)\
    \  \n   *图 8-7 – 访问数据导入向导*\n\n5. 在“您要导入哪种类型的数据？”问题下，点击“标准对象”选项卡上的 `Accounts and\
    \ Contacts`，如图 8-8 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig8_HTML.jpg](img/437055_1_En_8_Fig8_HTML.jpg)\
    \  \n   *图 8-8 – 您要导入哪种类型的数据？*\n\n6. 在“您想要做什么？”问题下，点击“添加新记录”，将显示以下信息：\n   - **按以下方式匹配联系人**：此选项允许您根据联系人的全名、电子邮件或您已创建并设为唯一\
    \ ID 或外部 ID 的任何字段，将您的 CSV 数据与 Salesforce 中可能已存在的联系人进行匹配。这有助于防止导入时产生重复记录。您需要选择您认为最佳匹配的字段。通常使用电子邮件进行匹配。\n\
    \n   > **注意**  \n   > 唯一 ID 或外部 ID 是仅与该记录相关的标识符。当将数据从其他 CRM 迁移到 Salesforce 时，您的其他\
    \ CRM 会包含其自身的唯一 ID。您应该创建一个字段并将其标记为外部 ID，然后将此字段导入到您的 Salesforce 实例中。这样，如果您在初始导入时忘记包含某些内容，将来可以对其进行更新。或者，对于与其他系统集成的业务用途，外部\
    \ ID 对于关联两个组织并确保只更新一条记录至关重要。Salesforce 也会为创建的每条记录生成唯一的 ID；它是一个 15 到 18 个字符的字母数字\
    \ ID。您可以在报表中找到记录的此 ID；只需搜索 `ID` 字段，如图 8-9 所示，或者在浏览器的 URL 中找到它，如图 8-10 所示。\n\n\
    \   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig10_HTML.jpg](img/437055_1_En_8_Fig10_HTML.jpg)\
    \  \n   *图 8-10 – 在浏览器 URL 中找到您的记录 ID*\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig9_HTML.jpg](img/437055_1_En_8_Fig9_HTML.jpg)\
    \  \n   *图 8-9 – 如何在报表中搜索记录的 ID*\n\n7. **按以下方式匹配客户**：此选项允许您根据客户名称和站点（客户上的标准网站字段）或您已创建并设为唯一\
    \ ID 或外部 ID 的任何字段，将您的 CSV 数据与 Salesforce 中可能已存在的客户进行匹配，如图 8-11 所示。\n\n   ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig11_HTML.jpg](img/437055_1_En_8_Fig11_HTML.jpg)\
    \  \n   *图 8-11 – 您想要做什么？*\n\n   > **注意**  \n   > 您可以通过创建或编辑字段并选中“唯一”或“外部 ID”复选框，将以下任一数据类型字段设为唯一\
    \ ID 或外部 ID：`auto-number`、`email`、`number` 或 `text`。\n\n8. Salesforce 允许启用或禁用通过工作流规则或流程生成器创建的自动化流程。通过选中此框，您可以在此导入期间启用这些流程。如果您创建的自动操作包含电子邮件和任务，这一点很重要，因为这可能会对您的客户或用户造成困扰。例如，您可能有一个工作流规则，每次创建联系人时都会向该联系人发送欢迎邮件。如果您保持此选项处于选中状态，则所有导入的联系人都将收到此电子邮件。\n\
    \n9. 您还可以将所有导入的联系人分配到一个现有的营销活动。如果您选择此选项，则需要在导入文件中包含一列，其中包含该营销活动的 Salesforce ID。\n\
    \n10. 在“您的数据位于何处？”问题下，您可以将 CSV 文件拖放到“将 CSV 文件拖到此处以上传”区域，如图 8-12 所示。您也可以单击 CSV、Outlook\
    \ CSV、ACT! CSV 或 Gmail CSV，然后单击“选择文件”。在您的计算机上找到该文件，然后单击“打开”。\n\n    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig12_HTML.jpg](img/437055_1_En_8_Fig12_HTML.jpg)\
    \  \n    *图 8-12 – 您的数据位于何处？*\n\n11. 完成这些步骤后，单击屏幕右下角的 `Next` 按钮，如图 8-13 所示。\n\n\
    \    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig13_HTML.jpg](img/437055_1_En_8_Fig13_HTML.jpg)\
    \  \n    *图 8-13 – 单击屏幕上的“下一步”按钮*\n"
- fmt: '12. In the `Edit Mapping` field, this is where you choose what column header
    is mapped to what Salesforce field on the accounts or contacts. If you set your
    column headers up correctly, you’ll see that Salesforce will match all your columns
    to the fields in Salesforce, as shown in Figure [8-14](#437055_1_En_8_Chapter.xhtml#Fig14).
    In Figure [8-15](#437055_1_En_8_Chapter.xhtml#Fig15), you’ll see that the headers
    didn’t match the names of the fields. Steps 13 and 14 are additional steps to
    follow should you not match the headers of your columns to the field names they
    are mapping too.


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig15_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig15_HTML.jpg)


    Figure 8-15: Field mapping when you didn’t match your column headers to the field
    names in Salesforce


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig14_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig14_HTML.jpg)


    Figure 8-14: Field mapping when you matched your column headers to the field names
    in Salesforce correctly


    13. If you see a triangle with an exclamation mark inside, this means that there
    is an error with your mapping, as shown in Figure [8-16](#437055_1_En_8_Chapter.xhtml#Fig16).
    Hover over the icon to display the error message. In most cases, it is because
    you have mapped one column to multiple fields.


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig16_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig16_HTML.jpg)


    Figure 8-16: Shows the little triangle symbol


    **Note** If your import requires that two fields be updated with the same information,
    you’ll need to create two columns with the same data in each and map the columns
    to the respective fields. Importing tools can link to only one data point at a
    time.


    14. If you see a field in bold red like Figure [8-15](#437055_1_En_8_Chapter.xhtml#Fig15),
    this means the field still needs to be mapped. To map a field or change a field
    already mapped, click the `Map` or `Change` hyperlink. You can either type in
    the field name or use the scroll bar to find the field. Select the appropriate
    field and click `Map`, as shown in Figure [8-17](#437055_1_En_8_Chapter.xhtml#Fig17).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig17_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig17_HTML.jpg)


    Figure 8-17: Mapping fields using the Data Import Wizard


    **Note** If you don’t create a record owner field in your import, the records
    created will automatically be assigned to the user performing the import. This
    could impact your organization if you have security set up that eliminates users
    from seeing data. For example, if you have a role hierarchy set up that puts you
    at the top of the hierarchy and you are the importing user, users below you may
    not be able to see the records you’ve imported. This ultimately means they can’t
    do their jobs.


    15. Once you have reviewed that all the columns are mapped to the appropriate
    fields, click the `Next` button at the bottom-right corner, as shown in Figure
    [8-18](#437055_1_En_8_Chapter.xhtml#Fig18).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig18_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig18_HTML.jpg)


    Figure 8-18: Click the Next button to continue


    16. The `Review & Start Import` screen summarizes what objects you’re importing
    to, what type of import it is (insert, update, upsert), what CSV you are using
    for your import, how many fields are mapped, and how many are unmapped, as shown
    in Figure [8-19](#437055_1_En_8_Chapter.xhtml#Fig19).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig19_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig19_HTML.jpg)


    Figure 8-19: A review of your import before you click Start Import


    17. Once you have reviewed this information and feel that it is correct, click
    the `Start Import` button, as shown in Figure [8-20](#437055_1_En_8_Chapter.xhtml#Fig20).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig20_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig20_HTML.jpg)


    Figure 8-20: Start Import button


    18. Click the `OK` button on the congratulations page to be taken to the bulk
    data load job request and status page, as shown in Figure [8-21](#437055_1_En_8_Chapter.xhtml#Fig21).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig21_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig21_HTML.jpg)


    Figure 8-21: OK button


    19. If the import is a large import (tens of thousands of rows), the job being
    processed can take up to several hours. If it is a small import, you may find
    that your job will be finished as soon as you click `OK`, as shown in Figure [8-22](#437055_1_En_8_Chapter.xhtml#Fig22).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig22_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig22_HTML.jpg)


    Figure 8-22: Import summary


    20. Salesforce will send you an email when your job is complete and will attach
    an error file to review any errors on your import. Some errors could include a
    data type not matching. Another could be that Salesforce is seeing a blank row,
    as shown in Figure [8-23](#437055_1_En_8_Chapter.xhtml#Fig23).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig23_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig23_HTML.jpg)


    Figure 8-23: Email that is received when the import is complete'
  raw: '12.  In the Edit Mapping field , this is where you choose what column header
    is mapped to what Salesforce field on the accounts or contacts. If you set your
    column headers up correctly, you’ll see that Salesforce will match all your columns
    to the fields in Salesforce, as shown in Figure [8-14](#437055_1_En_8_Chapter.xhtml#Fig14).
    In Figure [8-15](#437055_1_En_8_Chapter.xhtml#Fig15), you’ll see that the headers
    didn’t match the names of the fields. Steps 13 and 14 are additional steps to
    follow should you not match the headers of your columns to the field names they
    are mapping too.


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig15_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig15_HTML.jpg)


    Figure 8-15


    Field mapping when you didn’t match your column headers to the field names in
    Salesforce


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig14_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig14_HTML.jpg)


    Figure 8-14


    Field mapping when you matched your column headers to the field names in Salesforce
    correctly


    13.  If you see a triangle with an exclamation mark inside, this means that there
    is an error with your mapping, as shown in Figure [8-16](#437055_1_En_8_Chapter.xhtml#Fig16).
    Hover over the icon to display the error message . In most cases, it is because
    you have mapped one column to multiple fields.


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig16_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig16_HTML.jpg)


    Figure 8-16


    Shows the little triangle symbol


    **Note** If your import requires that two fields be updated with the same information,
    you’ll need to create two columns with the same data in each and map the columns
    to the respective fields. Importing tools can link to only one data point at a
    time.


    14.  If you see a field in bold red like Figure [8-15](#437055_1_En_8_Chapter.xhtml#Fig15),
    this means the field still needs to be mapped. To map a field or change a field
    already mapped, click the Map or Change hyperlink. You can either type in the
    field name or use the scroll bar to find the field. Select the appropriate field
    and click Map, as shown in Figure [8-17](#437055_1_En_8_Chapter.xhtml#Fig17).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig17_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig17_HTML.jpg)


    Figure 8-17


    Mapping fields using the Data Import Wizard


    **Note** If you don’t create a record owner field in your import, the records
    created will automatically be assigned to the user performing the import. This
    could impact your organization if you have security set up that eliminates users
    from seeing data. For example, if you have a role hierarchy set up that puts you
    at the top of the hierarchy and you are the importing user, users below you may
    not be able to see the records you’ve imported. This ultimately means they can’t
    do their jobs.


    15.  Once you have reviewed that all the columns are mapped to the appropriate
    fields , click the Next button at the bottom-right corner, as shown in Figure
    [8-18](#437055_1_En_8_Chapter.xhtml#Fig18).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig18_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig18_HTML.jpg)


    Figure 8-18


    Click the Next button to continue


    16.  The Review & Start Import screen summarizes what objects you’re importing
    to, what type of import it is (insert, update, upset), what CSV you are using
    for your import, how many fields are mapped, and how many are unmapped, as shown
    in Figure [8-19](#437055_1_En_8_Chapter.xhtml#Fig19).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig19_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig19_HTML.jpg)


    Figure 8-19


    A review of your import before you click Start Import


    17.  Once you have reviewed this information and feel that it is correct, click
    the Start Import button, as shown in Figure [8-20](#437055_1_En_8_Chapter.xhtml#Fig20).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig20_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig20_HTML.jpg)


    Figure 8-20


    Start Import button


    18.  Click the OK button on the congratulations page to be taken to the bulk data
    load job request and status page, as shown in Figure [8-21](#437055_1_En_8_Chapter.xhtml#Fig21).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig21_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig21_HTML.jpg)


    Figure 8-21


    OK button


    19.  If the import is a large import (tens of thousands of rows), the job being
    processed can take up to several hours. If it is a small import, you may find
    that your job will be finished as soon as you click OK, as shown in Figure [8-22](#437055_1_En_8_Chapter.xhtml#Fig22).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig22_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig22_HTML.jpg)


    Figure 8-22


    Import summary


    20.  Salesforce will send you an email when your job is complete and will attach
    an error file to review any errors on your import. Some errors could include a
    data type not matching. Another could be that Salesforce is seeing a blank row,
    as shown in Figure [8-23](#437055_1_En_8_Chapter.xhtml#Fig23).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig23_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig23_HTML.jpg)


    Figure 8-23


    Email that is received when the import is complete'
  trans: '12. 在 `Edit Mapping`（编辑映射）字段中，你可以在此处选择将哪个列标题映射到账户或联系人的哪个 Salesforce 字段。如果正确设置了列标题，你会看到
    Salesforce 会将所有列与 Salesforce 中的字段匹配起来，如图 8-14 所示。在图 8-15 中，你会看到标题与字段名称不匹配。如果你的列标题没有与它们所映射的字段名称匹配，则可以按照步骤
    13 和 14 中的附加步骤进行操作。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig15_HTML.jpg](img/437055_1_En_8_Fig15_HTML.jpg)


    图 8-15：当列标题未与 Salesforce 中的字段名称匹配时的字段映射


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig14_HTML.jpg](img/437055_1_En_8_Fig14_HTML.jpg)


    图 8-14：当列标题与 Salesforce 中的字段名称正确匹配时的字段映射


    13. 如果看到一个带有感叹号的三角形，这意味着映射存在错误，如图 8-16 所示。将鼠标悬停在该图标上即可显示错误消息。大多数情况下，这是因为您将一个列映射到了多个字段。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig16_HTML.jpg](img/437055_1_En_8_Fig16_HTML.jpg)


    图 8-16：显示小三角形符号


    **注意** 如果您的导入需要两个字段同时更新相同的信息，则您需要创建两个列，每个列中包含相同的数据，并将这些列分别映射到各自的字段。导入工具一次只能链接到一个数据点。


    14. 如果看到某个字段以红色粗体显示，如图 8-15 所示，则表示该字段仍需要映射。要映射一个字段或更改已映射的字段，请单击 `Map`（映射）或 `Change`（更改）超链接。您可以输入字段名称，也可以使用滚动条查找字段。选择合适的字段后，单击
    `Map`（映射），如图 8-17 所示。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig17_HTML.jpg](img/437055_1_En_8_Fig17_HTML.jpg)


    图 8-17：使用数据导入向导映射字段


    **注意** 如果您在导入时没有创建记录所有者字段，则创建的记录将自动分配给执行导入的用户。如果您的安全设置阻止用户查看数据，这可能会影响您的组织。例如，如果设置了角色层级，而您位于层级顶端并作为导入用户，那么层级低于您的用户可能无法看到您导入的记录。这最终意味着他们无法完成工作。


    15. 确认所有列都已映射到相应的字段后，单击右下角的 `Next`（下一步）按钮，如图 8-18 所示。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig18_HTML.jpg](img/437055_1_En_8_Fig18_HTML.jpg)


    图 8-18：单击“下一步”按钮继续


    16. `Review & Start Import`（审阅并开始导入）屏幕会汇总您要导入的对象、导入类型（插入、更新、更新插入）、导入所使用的 CSV 文件、已映射的字段数以及未映射的字段数，如图
    8-19 所示。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig19_HTML.jpg](img/437055_1_En_8_Fig19_HTML.jpg)


    图 8-19：单击“开始导入”前的导入审阅


    17. 审阅完这些信息并确认无误后，单击 `Start Import`（开始导入）按钮，如图 8-20 所示。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig20_HTML.jpg](img/437055_1_En_8_Fig20_HTML.jpg)


    图 8-20：开始导入按钮


    18. 在祝贺页面上，单击 `OK`（确定）按钮，您将跳转到批量数据加载请求和状态页面，如图 8-21 所示。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig21_HTML.jpg](img/437055_1_En_8_Fig21_HTML.jpg)


    图 8-21：确定按钮


    19. 如果导入的数据量很大（数万行），则处理作业可能需要长达数小时。如果是小规模导入，您可能会发现单击 `OK`（确定）后作业即完成，如图 8-22 所示。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig22_HTML.jpg](img/437055_1_En_8_Fig22_HTML.jpg)


    图 8-22：导入摘要


    20. 当作业完成时，Salesforce 会向您发送一封电子邮件，并附上一个错误文件以供您查看导入中的任何错误。某些错误可能包括数据类型不匹配。另一种可能的情况是
    Salesforce 检测到一个空行，如图 8-23 所示。


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig23_HTML.jpg](img/437055_1_En_8_Fig23_HTML.jpg)


    图 8-23：导入完成时收到的电子邮件'
- fmt: "# Importing Leads\n\nIdeally, you’ll find that you get to import new leads\
    \ all the time! Whether you get new leads from a conference you attend or a purchased\
    \ list, you’ll want to import them immediately to get your sales team working\
    \ on them! The following steps will show you how to quickly make this happen:\n\
    \n1. Prepare your data for the import. Make sure that all the required fields\
    \ are populated columns in your import. The standard `Salesforce` setup requires\
    \ a last name, a company name, and a lead status.\n\n2. Navigate to the `Setup`\
    \ menu, as shown in Figure [8-24](#437055_1_En_8_Chapter.xhtml#Fig24).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig24_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig24_HTML.jpg)\n\
    \nFigure 8-24  \nNavigating to the Setup area in `Salesforce`\n\n3. In the `Quick\
    \ Find` area, type `Data import` (don’t hit the `Enter` key; the option will populate\
    \ as you type). Click `Data Import Wizard`, as shown in Figure [8-25](#437055_1_En_8_Chapter.xhtml#Fig25).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig25_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig25_HTML.jpg)\n\
    \nFigure 8-25  \nSearching for `Data Import Wizard`\n\n4. Click the green `Launch\
    \ Wizard!` button, as shown in Figure [8-26](#437055_1_En_8_Chapter.xhtml#Fig26).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig26_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig26_HTML.jpg)\n\
    \nFigure 8-26  \nLaunching the Salesforce wizard\n\n5. Under the “What kind of\
    \ data are you importing?” question, click `Leads` on the `Standard objects` tab,\
    \ as shown in Figure [8-27](#437055_1_En_8_Chapter.xhtml#Fig27).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig27_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig27_HTML.jpg)\n\
    \nFigure 8-27  \nWhat kind of data are you importing?\n\n6. Under the “What do\
    \ you want to do?” question, click “Add new records,” and the following information\
    \ will appear:\n   * `Match Lead by`: This allows you to match your CSV data to\
    \ an existing lead contact if it already exists in `Salesforce` by the full name\
    \ of the lead, email, or any field you have created and made a unique ID or external\
    \ ID. This helps to prevent duplication from being imported. You would want to\
    \ choose which you think is the best match. Most commonly email is used.\n   *\
    \ `Assign New Leads to this Source`: This allows you to select what lead source\
    \ all the leads should be assigned to. If you have an import that is not a mixture\
    \ of lead sources, you can use this function. For example, if you just attended\
    \ a conference and you want to show that all these leads came from that conference,\
    \ you would globally assign all the imported leads from this list to that lead\
    \ source. If you have a mixture of sources where your leads came from, you’ll\
    \ want to ignore this.\n   * `Assign all leads using Assignment rules`: This allows\
    \ you to utilize a lead assignment rule you’ve created to auto-assign the owner.\
    \ The drop-down should include all your options that you created in lead assignments.\
    \ If all the leads you are importing need to be assigned to specific users, you\
    \ can ignore this feature. However, if you purchased a list and these leads are\
    \ up for anyone, you may want to let your auto-assignment rules handle who gets\
    \ what.\n   * `Assign leads to campaigns`: This allows you to add all the imported\
    \ leads to a campaign. You’ll just need to make sure to include a column in your\
    \ spreadsheet with that campaign ID. If you want to have all the imported leads\
    \ related to a campaign for an event or a campaign for an email blast, you can\
    \ do this with this function.\n\n7. `Salesforce` allows for automated process\
    \ made with workflow rules or the `Process Builder` to be enabled or disabled.\
    \ By checking the box, you are enabling them to be active during this import.\
    \ This is important to consider if you have created actions that include email\
    \ and tasks as this could bombard your clients or users.\n\n8. Under the “Where\
    \ is your data located?” question, you can drag and drop a CSV file into the “Drag\
    \ CSV file here to upload” area, as shown in Figures [8-28](#437055_1_En_8_Chapter.xhtml#Fig28)\
    \ and [8-29](#437055_1_En_8_Chapter.xhtml#Fig29). You can also click `CSV`, `Outlook\
    \ CSV`, `ACT! CSV`, or `Gmail CSV`. Then click `Choose File`, locate the file\
    \ on your machine, and click `Open`.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig29_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig29_HTML.jpg)\n\
    \nFigure 8-29  \nWhere is your data located?\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig28_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig28_HTML.jpg)\n\
    \nFigure 8-28  \nWhat do you want to do?\n\n9. Once these steps are complete,\
    \ click the `Next` button at the bottom-right corner of your screen, as shown\
    \ in Figure [8-30](#437055_1_En_8_Chapter.xhtml#Fig30).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig30_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig30_HTML.jpg)\n\
    \nFigure 8-30  \n`Next` button\n\n10. In the `Edit Mapping` field, this is where\
    \ you choose what column header is mapped to what `Salesforce` field on the lead.\
    \ If you set your column headers up correctly, you’ll see that `Salesforce` will\
    \ match all your columns to the fields in `Salesforce`, as shown in Figure [8-31](#437055_1_En_8_Chapter.xhtml#Fig31).\
    \ In Figure [8-32](#437055_1_En_8_Chapter.xhtml#Fig32), you’ll see that the headers\
    \ didn’t match the names of the fields. Steps 11 and 12 are additional steps to\
    \ follow if you did not match the headers of your columns to the field names they\
    \ are mapping to.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig32_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig32_HTML.jpg)\n\
    \nFigure 8-32  \nField mapping when you didn’t match your column headers to the\
    \ field names in `Salesforce`\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig31_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig31_HTML.jpg)\n\
    \nFigure 8-31  \nField mapping when you matched your column headers to the field\
    \ names in `Salesforce` correctly\n\n11. If you see a field in bold red, this\
    \ means that the field still needs to be mapped, as shown in Figure [8-33](#437055_1_En_8_Chapter.xhtml#Fig33).\
    \ To map a field or change a field already mapped, click the `Map` or `Change`\
    \ hyperlink. You can either type in the field name or use the scroll bar to find\
    \ the field. Select the appropriate field and click `Map`, as shown in Figure\
    \ [8-34](#437055_1_En_8_Chapter.xhtml#Fig34).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig34_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig34_HTML.jpg)\n\
    \nFigure 8-34  \nSelecting a field\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig33_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig33_HTML.jpg)\n\
    \nFigure 8-33  \nFields shown as unmapped\n\n**Note** If you don’t create a record\
    \ owner field and you don’t choose to use your lead assignment rules in the import,\
    \ the records created will automatically be assigned to the user performing the\
    \ import. This could impact your organization if you have security set up that\
    \ eliminates users from seeing data. For example, if you have a role hierarchy\
    \ set up that puts you at the top of the hierarchy and you are the importing user,\
    \ users below you may not be able to see the records you’ve imported. This ultimately\
    \ means they can’t do their jobs.\n\n12. Once you have reviewed that all the columns\
    \ are mapped to the appropriate fields, click the `Next` button at the bottom-right\
    \ corner, as shown in Figure [8-35](#437055_1_En_8_Chapter.xhtml#Fig35).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig35_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig35_HTML.jpg)\n\
    \nFigure 8-35  \n`Next` button\n\n13. The `Review & Start Import` screen summarizes\
    \ what objects you’re importing to, what type of import it is (`insert`, `update`,\
    \ `upsert`), what CSV you are using for your import, how many fields are mapped,\
    \ and how many are unmapped, as shown in Figure [8-36](#437055_1_En_8_Chapter.xhtml#Fig36)."
