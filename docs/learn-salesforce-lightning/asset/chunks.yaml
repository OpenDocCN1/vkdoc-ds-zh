    \ covered in Chapter [9](#437055_1_En_9_Chapter.xhtml).) If having the user’s\
    \ data restricted is not an issue for your company, you can leave the settings\
    \ as is. Let’s take a look at how you can modify this:\n\n1.  Click the settings\
    \ cog icon in the right corner of the dashboard, as shown in Figure [5-82](#437055_1_En_5_Chapter.xhtml#Fig82).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig82_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig82_HTML.jpg)\n\
    \n    Figure 5-82\n\n    Creating a dynamic dashboard\n\n2.  Select what view\
    \ you would like to set the dashboard as.\n\n3.  Select or deselect if the user\
    \ should be able to change this.\n\n4.  Click Save, as shown in Figure [5-83](#437055_1_En_5_Chapter.xhtml#Fig83).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig83_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig83_HTML.jpg)\n\
    \n    Figure 5-83\n\n    Selecting the view of the dashboard\n\n## Summary\n\n\
    One of the greatest benefits of having Salesforce as your client relationship\
    \ management tool is the reports that can be generated from the data collected.\
    \ Being able to calculate your return on investment (ROI) or how your sales team\
    \ is doing will help you in the months and years of your business to come. The\
    \ best thing about reports and dashboards is that you can’t mess your data up\
    \ using them. Don’t be afraid to click around and play with them. You are only\
    \ translating data; you can’t mess it up!\n\n# 6. Collaborating\n\nSalesforce\
    \ offers many collaboration tools. One valuable collaboration tool offered is\
    \ called Chatter. This tool and its capabilities can be found on a significant\
    \ number of standard objects and all custom objects in Salesforce. It allows your\
    \ users to communicate with each other via internal messaging. You can even allow\
    \ your users to share files such as Word and PowerPoint files with each other\
    \ and your customers using content deliveries. Do you need to share your Salesforce\
    \ records with another Salesforce organization? You can use Lightning Connect\
    \ and sync data to the other Salesforce organization. You can enable *topics*,\
    \ which allow your users to interact on specific topics with each other. We can’t\
    \ forget about the Salesforce mobile app, Salesforce, that allows your users to\
    \ be on-the-go for iPhone and Android users. Figure [6-1](#437055_1_En_6_Chapter.xhtml#Fig1)\
    \ shows the Chatter object .\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig1_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig1_HTML.jpg)\n\
    \nFigure 6-1\n\nChatter tool\n\n## Understanding Chatter\n\nSalesforce Chatter\
    \ is an essential tool that can be used to help you collaborate internally with\
    \ co-workers and externally with clients. You can use the Chatter feature post,\
    \ which allows you to post messages to other users or post messages on a record\
    \ itself about that record. Give your employees the ability to post a question\
    \ that needs an answer to your management team. Or collect information from your\
    \ employees via an anonymous poll. Chatter has a number of great built-in tools\
    \ that can be used in various ways. Let’s look into some of these tools further.\n\
    \n## Sidebar\n\nThe sidebar on the Chatter tab gives you quick access to Chatter\
    \ features (Figure [6-2](#437055_1_En_6_Chapter.xhtml#Fig2)). Use the What I Follow\
    \ link to quickly see all Chatter posts corresponding to all the records that\
    \ users follow in Salesforce (more on this feature in a bit). Use the To Me link\
    \ to see any post that a user directed at you using the `@` symbol or any post\
    \ that was left on your profile from another user. Use Bookmarked to see any post\
    \ you have bookmarked. The Company Highlights quick-access link uses Einstein’s\
    \ artificial intelligence (AI) to bring you all the trending topics in your organization.\
    \ The Streams quick-access link allows you to create quick-access links to records.\
    \ Use this section to see all accounts, cases, contacts, and more that you follow.\
    \ Recent Groups allows you to create and see the latest groups you have followed.\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig2_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig2_HTML.jpg)\n\
    \nFigure 6-2\n\nChatter sidebar\n\n### Following in Chatter\n\nFollowing is a\
    \ powerful tool available in Salesforce. You can follow anything from people to\
    \ groups to records. Following allows you to see all the relevant content and\
    \ interactions that have happened to the record you choose to follow. Following\
    \ in Chatter is comparable to following someone on Twitter. Want to see everything\
    \ your training instructor is posting on Salesforce? Go to their profile and click\
    \ the + Follow button. If you have a stream set up for that object, you can choose\
    \ to add this record to the stream or to just use What I Follow. If you are viewing\
    \ your Chatter feed, hover over the name of another user and use the Follow button\
    \ here. Find the Follow button at the top of any record, as shown in Figure [6-3](#437055_1_En_6_Chapter.xhtml#Fig3).\
    \ Following brings the content and posts into your Chatter feed and allows you\
    \ to interact right from your feed.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig3_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig3_HTML.jpg)\n\
    \nFigure 6-3\n\nFollowing in Chatter\n\n### Bookmarking a Post\n\nYou can bookmark\
    \ a post just like you would bookmark a web site. If you want to save this post\
    \ for later use and have it appear in your Bookmarked quick-access list in Chatter,\
    \ all you’ll need to do is click the down-facing arrow to the right of the post\
    \ and click Bookmark (Figure [6-4](#437055_1_En_6_Chapter.xhtml#Fig4)). Notice\
    \ that a yellow triangle with a star appears next to the arrow. Remove the bookmark\
    \ the same way except choose Remove Bookmark in the drop-down.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig4_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig4_HTML.jpg)\n\
    \nFigure 6-4\n\nBookmarking a post"
  trans: "\n# 使用动态仪表板\n\n动态仪表板允许每位用户根据其安全性和共享设置，查看自己有权访问的数据。这样，你只需创建一个仪表板，每位用户就都能访问。创建仪表板后，你可以访问其属性进行此项修改，或为其他用户使用另外两种访问方式。你可以将仪表板设置为以“我”的视角查看，这样仪表板读者就能根据你对数据的访问权限，看到仪表板中的数据。你可以选择“指定用户”选项，让用户根据所选用户的访问权限查看数据。最后，你还可以使用“当前登录用户”选项，让用户根据自己的访问权限查看数据。此外，通过取消选中“允许更改仪表板视图（动态仪表板）”，你可以防止用户更改仪表板的查看方式。\n\
    \n当企业希望防止用户看到不应看到的数据时，会选择动态仪表板而非非动态仪表板。例如，一家公司可能有很多销售用户，这些销售用户负责不同的区域。如果你不希望负责加利福尼亚州的销售人员看到纽约州的销售数据，可以使用“当前登录用户”选项。（当然，你必须已设置好安全措施以防止这种情况发生，这部分内容将在第\
    \ 9 章中介绍。）如果你的公司不需要限制用户数据，则可以保持默认设置。\n\n让我们看看如何进行修改：\n\n1.  点击仪表板右上角的设置齿轮图标，如图\
    \ 5-82 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig82_HTML.jpg](img/437055_1_En_5_Fig82_HTML.jpg)\n\
    \n    图 5-82\n    创建动态仪表板\n\n2.  选择你要将仪表板设置为哪种视图。\n\n3.  选择或取消选择用户是否能够更改此设置。\n\
    \n4.  点击“保存”，如图 5-83 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig83_HTML.jpg](img/437055_1_En_5_Fig83_HTML.jpg)\n\
    \n    图 5-83\n    选择仪表板的视图\n\n## 总结\n\n将 Salesforce 作为客户关系管理工具的最大好处之一，就是可以根据收集的数据生成报表。能够计算投资回报率（ROI）或了解销售团队的表现，将对您未来数月乃至数年的业务大有裨益。关于报表和仪表板，最大的优点是您不会因使用它们而弄乱数据。不要害怕随意点击和尝试。您只是在翻译数据，不会搞砸的！\n\
    \n# 6. 协作\n\nSalesforce 提供了许多协作工具。其中一项有价值的协作工具叫做 Chatter。这个工具及其功能可以在 Salesforce\
    \ 中大量标准对象和所有自定义对象上找到。它允许您的用户通过内部消息相互沟通。您甚至可以让用户通过内容交付，与彼此及客户共享 Word 和 PowerPoint\
    \ 等文件。您需要将 Salesforce 记录共享给另一个 Salesforce 组织吗？您可以使用 Lightning Connect 将数据同步到另一个\
    \ Salesforce 组织。您可以启用*主题*，让用户就特定主题进行互动。我们也不能忘记 Salesforce 移动应用 Salesforce，它允许\
    \ iPhone 和 Android 用户随时随地使用。图 6-1 展示了 Chatter 对象。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig1_HTML.jpg](img/437055_1_En_6_Fig1_HTML.jpg)\n\
    \n图 6-1\nChatter 工具\n\n## 理解 Chatter\n\nSalesforce Chatter 是一个基本工具，可用于帮助您与同事进行内部协作以及与客户进行外部协作。您可以使用\
    \ Chatter 的“帖子”功能，向其他用户发布消息，或者在记录本身上发布与该记录相关的消息。让您的员工能够向管理团队提出需要回答的问题。或者通过匿名投票收集员工的信息。Chatter\
    \ 内置了许多出色的工具，可以以多种方式使用。让我们进一步了解其中一些工具。\n\n## 侧边栏\n\nChatter 选项卡上的侧边栏让您可以快速访问 Chatter\
    \ 功能（图 6-2）。使用`我关注的`链接，可以快速查看与用户在 Salesforce 中关注的所有记录对应的所有 Chatter 帖子（稍后将详细介绍此功能）。使用`发送给我的`链接，可以查看用户使用`@`符号发给您的任何帖子，或另一位用户在您的个人资料上留下的任何帖子。使用`已添加书签`查看您已添加书签的任何帖子。`公司动态`快速访问链接使用\
    \ Einstein 的人工智能（AI）为您呈现组织中的所有热门主题。`动态流`快速访问链接允许您创建指向记录的快速访问链接。使用此部分可以查看您关注的所有账户、案例、联系人等。`最近群组`允许您创建并查看您最近关注的群组。\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig2_HTML.jpg](img/437055_1_En_6_Fig2_HTML.jpg)\n\
    \n图 6-2\nChatter 侧边栏\n\n### 在 Chatter 中关注\n\n关注是 Salesforce 中一个强大的工具。您可以关注从人员到群组再到记录的任何内容。关注可以让您看到您所关注记录的所有相关内容和互动。在\
    \ Chatter 中关注类似于在 Twitter 上关注某人。想看到您的培训讲师在 Salesforce 上发布的所有内容吗？请转到他们的个人资料并点击`+\
    \ 关注`按钮。如果您已为该对象设置了动态流，则可以选择将此记录添加到该动态流，或者只使用`我关注的`。如果您正在查看 Chatter 信息流，请将鼠标悬停在另一位用户的姓名上，然后使用此处的`关注`按钮。在任何记录的顶部都可以找到`关注`按钮，如图\
    \ 6-3 所示。关注会将内容和帖子带入您的 Chatter 信息流，并允许您直接在自己的信息流中进行互动。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig3_HTML.jpg](img/437055_1_En_6_Fig3_HTML.jpg)\n\
    \n图 6-3\n在 Chatter 中关注\n\n### 为帖子添加书签\n\n您可以像为网站添加书签一样为帖子添加书签。如果您想保存此帖子以备后用，并让它出现在\
    \ Chatter 的`已添加书签`快速访问列表中，您只需点击帖子右侧向下的箭头，然后点击`添加书签`（图 6-4）。注意，箭头旁边会出现一个带星标的黄色三角形。移除书签的方法相同，只是在下拉菜单中选择`移除书签`即可。\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig4_HTML.jpg](img/437055_1_En_6_Fig4_HTML.jpg)\n\
    \n图 6-4\n为帖子添加书签\n"
- fmt: "### Creating a Stream\n\n`Streams` allow you to create groupings of specific\
    \ records that you may want to follow (Figure [6-5](#437055_1_En_6_Chapter.xhtml#Fig5)).\
    \ `Streams` in Chatter are best used when you want to create a custom feed that\
    \ groups records from various objects into one feed.\n\nFor example, if you have\
    \ a new marketing campaign and you want to create a feed that follows records\
    \ affected by the marketing campaign, you can create a stream that shows you all\
    \ the Chatter posts on these various objects. To create a new stream, click the\
    \ plus sign found in your Chatter sidebar next to `Streams`. First, you will need\
    \ to name the stream. Next, choose what objects and records you want to include\
    \ in this stream by first choosing the object and then using the search bar to\
    \ search a specific record. `Streams` allow you to see records from the following\
    \ standard objects, plus all custom objects: `Accounts`, `Cases`, `Contacts`,\
    \ `Files`, `Groups`, `Leads`, `Opportunities`, `People`, and `Topics`. If you\
    \ are viewing a record and want to include the individual record to a stream,\
    \ use the `+ Follow` button and select the stream.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig5_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig5_HTML.jpg)\n\
    \nFigure 6-5  \nCreating a new stream\n\n### Creating Groups\n\nChatter user groups\
    \ in Salesforce provide a central location for users within that group to collaborate\
    \ (Figure [6-6](#437055_1_En_6_Chapter.xhtml#Fig6)). Most organizations will create\
    \ groups for their departments. You can make a group public, private, or unlisted.\
    \ Public group feeds are seen by customers or Chatter-free users (more on this\
    \ feature in a bit). Private groups are member-only groups and require a user\
    \ to request to join and get approved prior to interacting with the group. Unlisted\
    \ groups provide more privacy than private. Unlisted groups don’t allow users\
    \ to request to join; it is by invitation only. Additionally, unlisted groups\
    \ don’t show up in list views, feeds, profiles, or anywhere unless you are a member\
    \ of that group or have the permission to modify unlisted groups (even users with\
    \ `Modify All Data` can’t see these if they aren’t members).\n\nTo create a group,\
    \ click the plus sign next to `Groups` on the Chatter sidebar. Next, you’ll need\
    \ to name the group. You can add a description for the group, add information\
    \ about the group, choose who manages the group in the owner field, determine\
    \ the access type (public, private, or unlisted), select if customers should be\
    \ considered for joining the group, select `Broadcast Only` if you want the posts\
    \ to only come from managers or owners of the group, and click the `Save & Next`\
    \ button. On the next page, upload a group photo for your group.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig6_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig6_HTML.jpg)\n\
    \nFigure 6-6  \nCreating a Chatter group\n\n### Chatter Feed\n\nAccess your Chatter\
    \ feed by navigating to the Chatter tab or by going to your profile found in the\
    \ upper-right corner of the screen and clicking your name (Figure [6-7](#437055_1_En_6_Chapter.xhtml#Fig7)).\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig7_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig7_HTML.jpg)\n\
    \nFigure 6-7  \nNavigating to Chatter\n\nYour Chatter feed contains all the items\
    \ you follow, posts directed at you using the `@` symbol, or posts that you have\
    \ created. In your Chatter feed, you can control what you see by using the sidebar.\n\
    \n### Creating Posts on Your Feed\n\nTo create a post, make sure you are on the\
    \ `Post` tab of Chatter (Figure [6-8](#437055_1_En_6_Chapter.xhtml#Fig8)). You\
    \ can start typing in the box provided and use any of the stylings it provides,\
    \ such as the bolding, italicizing, underlying, strikethrough to your text, and\
    \ bullet points or numbering. You can also add images, tag other groups or users,\
    \ and attach files. Once your post is complete, click `Share`. Make a mistake\
    \ on your post? Not a problem, use the downward-facing arrow (the same as the\
    \ one used to bookmark) and click `Edit` or `Delete`.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig8_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig8_HTML.jpg)\n\
    \nFigure 6-8  \nCreating a post on your feed\n\nAfter you have shared your post,\
    \ watch other users like, comment, and share your post (Figure [6-9](#437055_1_En_6_Chapter.xhtml#Fig9)).\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig9_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig9_HTML.jpg)\n\
    \nFigure 6-9  \nOther users commenting and liking your post\n\n### Creating a\
    \ Post on a Record’s Feed\n\nFirst, you’ll have to search for or find the record\
    \ you want to write your post on. Next, you’ll click the word `Chatter` that appears\
    \ on the right when you are on the `Related` tab of that record. Once you have\
    \ clicked `Chatter`, you can start typing in the box provided and use any of the\
    \ stylings it provides, such as the bolding, italicizing, underlying, strikethrough\
    \ to your text, or bullet point or numbering. You can also add images, tag other\
    \ groups or users, and attach files, as shown in Figure [6-10](#437055_1_En_6_Chapter.xhtml#Fig10).\
    \ Once your post is complete, click `Share`. You can also use the `Poll` and `Questions`\
    \ options (covered later in the chapter).\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig10_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig10_HTML.jpg)\n\
    \nFigure 6-10  \nCreating a Chatter post on record\n\n### Creating Topics in Your\
    \ Post\n\nYou can use hashtags just like on Twitter and Instagram to create trending\
    \ topics in Salesforce. Just add the `#` symbol in front of any word (with no\
    \ space) in comments or in posts. For example, use `#learning` (Figure [6-11](#437055_1_En_6_Chapter.xhtml#Fig11)).\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig11_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig11_HTML.jpg)\n\
    \nFigure 6-11  \nUsing hashtags to create topics"
  raw: '### Creating a Stream


    Streams allow you to create groupings of specific records that you may want to
    follow (Figure [6-5](#437055_1_En_6_Chapter.xhtml#Fig5)). Streams in Chatter are
    best used when you want to create a custom feed that groups records from various
    objects into one feed. For example, if you have a new marketing campaign and you
    want to create a feed that follows records affected by the marketing campaign,
    you can create a stream that shows you all the Chatter posts on these various
    objects. To create a new stream, click the plus sign found in your Chatter sidebar
    next to Streams. First, you will need to name the stream. Next, choose what objects
    and records you want to include in this stream by first choosing the object and
    then using the search bar to search a specific record. Streams allow you to see
    records from the following standard objects, plus all custom objects: Accounts,
    Cases, Contacts, Files, Groups, Leads, Opportunities, People, and Topics. If you
    are viewing a record and want to include the individual record to a stream, use
    the + Follow button and select the stream.


    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig5_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    Creating a new stream


    ### Creating Groups


    Chatter user groups in Salesforce provide a central location for users within
    that group to collaborate (Figure [6-6](#437055_1_En_6_Chapter.xhtml#Fig6)). Most
    organizations will create groups for their departments. You can make a group public,
    private, or unlisted. Public group feeds are seen by customers or Chatter-free
    users (more on this feature in a bit). Private groups are member-only groups and
    require a user to request to join and get approved prior to interacting with the
    group. Unlisted groups provide more privacy than private. Unlisted groups don’t
    allow users to request to join; it is by invitation only. Additionally, unlisted
    groups don’t show up in list views, feeds, profiles, or anywhere unless you are
    a member of that group or have the permission to modify unlisted groups (even
    users with Modify All Data can’t see these if they aren’t members). To create
    a group, click the plus sign next to Groups on the Chatter sidebar. Next, you’ll
    need to name the group. You can add a description for the group, add information
    about the group, choose who manages the group in the owner field, determine the
    access type (public, private, or unlisted), select if customers should be considered
    for joining the group, select Broadcast Only if you want the posts to only come
    from managers or owners of the group, and click the Save & Next button. On the
    next page, upload a group photo for your group.


    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig6_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Creating a Chatter group


    ### Chatter Feed


    Access your Chatter feed by navigating to the Chatter tab or by going to your
    profile found in the upper-right corner of the screen and clicking your name (Figure
    [6-7](#437055_1_En_6_Chapter.xhtml#Fig7)).


    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig7_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Navigating to Chatter


    Your Chatter feed contains all the items you follow, posts directed at you using
    the `@` symbol, or posts that you have created. In your Chatter feed, you can
    control what you see by using the sidebar.


    ### Creating Posts on Your Feed


    To create a post, make sure you are on the Post tab of Chatter (Figure [6-8](#437055_1_En_6_Chapter.xhtml#Fig8)).
    You can start typing in the box provided and use any of the stylings it provides,
    such as the bolding, italicizing, underlying, strikethrough to your text, and
    bullet points or numbering. You can also add images, tag other groups or users,
    and attach files. Once your post is complete, click Share. Make a mistake on your
    post? Not a problem, use the downward-facing arrow (the same as the one used to
    bookmark) and click Edit or Delete.


    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig8_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Creating a post on your feed


    After you have shared your post, watch other users like, comment, and share your
    post (Figure [6-9](#437055_1_En_6_Chapter.xhtml#Fig9)).


    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig9_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Other users commenting and liking your post


    ### Creating a Post on a Record’s Feed


    First, you’ll have to search for or find the record you want to write your post
    on. Next, you’ll click the word Chatter that appears on the right when you are
    on the Related tab of that record. Once you have clicked Chatter, you can start
    typing in the box provided and use any of the stylings it provides, such as the
    bolding, italicizing, underlying, strikethrough to your text, or bullet point
    or numbering. You can also add images, tag other groups or users, and attach files,
    as shown in Figure [6-10](#437055_1_En_6_Chapter.xhtml#Fig10). Once your post
    is complete, click Share. You can also use the Poll and Questions options (covered
    later in the chapter).


    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig10_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Creating a Chatter post on record


    ### Creating Topics in Your Post


    You can use hashtags just like on Twitter and Instagram to create trending topics
    in Salesforce. Just add the `#` symbol in front of any word (with no space) in
    comments or in posts. For example, use #learning (Figure [6-11](#437055_1_En_6_Chapter.xhtml#Fig11)).


    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig11_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig11_HTML.jpg)


    Figure 6-11


    Using hashtags to create topics'
  trans: "\n### 创建流\n\n`Streams`（流）允许您创建可能想要关注的特定记录分组（图 6-5）。当您想要创建一个自定义动态，将来自不同对象的记录分组到一个动态中时，Chatter\
    \ 中的 `Streams` 是最佳选择。\n\n例如，如果您有一个新的营销活动，并且想要创建一个动态来关注受该营销活动影响的记录，则可以创建一个流，显示这些不同对象上的所有\
    \ Chatter 帖子。要创建新流，请单击 Chatter 侧边栏中 `Streams` 旁边的加号。首先，您需要为流命名。接下来，通过先选择对象，再使用搜索栏搜索特定记录，来选择要包含在该流中的对象和记录。`Streams`\
    \ 允许您查看以下标准对象以及所有自定义对象的记录：`Accounts`（客户）、`Cases`（个案）、`Contacts`（联系人）、`Files`（文件）、`Groups`（组）、`Leads`（线索）、`Opportunities`（商机）、`People`（人员）和\
    \ `Topics`（主题）。如果您正在查看一条记录并希望将该特定记录包含到流中，请使用 `+ Follow`（关注）按钮并选择该流。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig5_HTML.jpg](img/437055_1_En_6_Fig5_HTML.jpg)\n\
    \n图 6-5  \n创建新流\n\n### 创建组\n\nSalesforce 中的 Chatter 用户组为组内用户提供了一个进行协作的中心位置（图 6-6）。大多数组织会为其部门创建组。您可以将组设置为公开、私有或未列出的。公共组动态对客户或\
    \ Chatter 免费用户可见（稍后将详细介绍此功能）。私有组是仅限成员组，要求用户请求加入并在与组交互之前获得批准。未列出的组提供了比私有组更高的隐私性。未列出的组不允许用户请求加入；只能通过邀请加入。此外，未列出的组不会显示在列表视图、动态、用户资料或任何其他地方，除非您是该组的成员或具有修改未列出组的权限（即使具有\
    \ `Modify All Data`（修改所有数据）权限的用户，如果他们不是成员，也无法看到这些组）。\n\n要创建组，请单击 Chatter 侧边栏上\
    \ `Groups`（组）旁边的加号。接下来，您需要为组命名。您可以为组添加描述、添加组的相关信息、在“所有者”字段中选择谁管理该组、确定访问类型（公开、私有或未列出）、选择是否考虑让客户加入该组、如果您希望帖子仅来自组的管理员或所有者，则选择\
    \ `Broadcast Only`（仅广播），然后单击 `Save & Next`（保存并下一步）按钮。在下一页上，为您的组上传一张组照片。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig6_HTML.jpg](img/437055_1_En_6_Fig6_HTML.jpg)\n\
    \n图 6-6  \n创建 Chatter 组\n\n### Chatter 动态\n\n通过导航到 Chatter 选项卡，或转到屏幕右上角的用户资料并单击您的姓名，来访问您的\
    \ Chatter 动态（图 6-7）。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig7_HTML.jpg](img/437055_1_En_6_Fig7_HTML.jpg)\n\
    \n图 6-7  \n导航到 Chatter\n\n您的 Chatter 动态包含您关注的所有项目、使用 `@` 符号直接发给您的帖子，或您创建的帖子。在您的\
    \ Chatter 动态中，您可以通过使用侧边栏来控制您看到的内容。\n\n### 在您的动态上创建帖子\n\n要创建帖子，请确保您位于 Chatter 的\
    \ `Post`（帖子）选项卡上（图 6-8）。您可以在提供的框中开始输入，并使用其提供的任何样式，例如为文本加粗、斜体、下划线、删除线，以及项目符号或编号。您还可以添加图像、标记其他组或用户，以及附加文件。帖子完成后，单击\
    \ `Share`（分享）。帖子有错误？没关系，使用向下箭头（与书签使用的箭头相同）并单击 `Edit`（编辑）或 `Delete`（删除）。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig8_HTML.jpg](img/437055_1_En_6_Fig8_HTML.jpg)\n\
    \n图 6-8  \n在动态上创建帖子\n\n分享您的帖子后，可以看到其他用户点赞、评论和分享您的帖子（图 6-9）。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig9_HTML.jpg](img/437055_1_En_6_Fig9_HTML.jpg)\n\
    \n图 6-9  \n其他用户评论和点赞您的帖子\n\n### 在记录的动态上创建帖子\n\n首先，您需要搜索或找到要发布帖子的记录。接下来，单击该记录的\
    \ `Related`（相关）选项卡时右侧出现的 `Chatter` 一词。单击 `Chatter` 后，您可以在提供的框中开始输入，并使用其提供的任何样式，例如为文本加粗、斜体、下划线、删除线，或项目符号或编号。您还可以添加图像、标记其他组或用户，以及附加文件，如图\
    \ 6-10 所示。帖子完成后，单击 `Share`（分享）。您还可以使用 `Poll`（投票）和 `Questions`（问题）选项（本章后面会介绍）。\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig10_HTML.jpg](img/437055_1_En_6_Fig10_HTML.jpg)\n\
    \n图 6-10  \n在记录上创建 Chatter 帖子\n\n### 在帖子中创建主题\n\n您可以像在 Twitter 和 Instagram 上一样使用话题标签，在\
    \ Salesforce 中创建热门话题。只需在评论或帖子中任何单词前添加 `#` 符号（中间无空格）。例如，使用 `#learning`（学习）（图 6-11）。\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig11_HTML.jpg](img/437055_1_En_6_Fig11_HTML.jpg)\n\
    \n图 6-11  \n使用话题标签创建主题\n"
- fmt: "### Creating Chatter Polls\n\nCreate Chatter polls on your feed or on a group\
    \ feed with up to ten possible choices, as shown in Figure [6-12](#437055_1_En_6_Chapter.xhtml#Fig12).\
    \ Watch the other Chatter users vote on their choice. Salesforce will count the\
    \ votes and display the results. The user voting will not see who voted for what\
    \ choice and will not see the results of the Chatter poll until they submit their\
    \ vote. Keep reading to learn how to create a Chatter poll.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig12_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig12_HTML.jpg)\n\
    \nFigure 6-12\n\nChatter poll\n\nTo create a Chatter poll, follow these steps:\n\
    \n1.  Navigate to the Chatter object or create a poll from within a record by\
    \ navigating to the Chatter tab.\n2.  Click the `Poll` tab found within the Chatter\
    \ section of the record. Figure [6-13](#437055_1_En_6_Chapter.xhtml#Fig13) shows\
    \ how to access this from a record, and Figure [6-14](#437055_1_En_6_Chapter.xhtml#Fig14)\
    \ shows how to access this from the Chatter object.\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig14_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig14_HTML.jpg)\n\
    \n    Figure 6-14\n\n    Accessing a Chatter poll from the Chatter object\n\n\
    \    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig13_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig13_HTML.jpg)\n\
    \n    Figure 6-13\n\n    Accessing a Chatter poll from a record\n3.  Enter the\
    \ poll question you have in mind for your Chatter users.\n4.  Enter the choices\
    \ your Chatter users have for the poll.\n5.  If you need more choices, click the\
    \ `Add new choice` link.\n6.  Once finished with your choices, click `Ask`, as\
    \ shown in Figure [6-15](#437055_1_En_6_Chapter.xhtml#Fig15).\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig15_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig15_HTML.jpg)\n\
    \n    Figure 6-15\n\n    Creating a Chatter poll\n7.  Once you have posted your\
    \ poll, you can click the `View results` link to see your results, as shown in\
    \ Figure [6-16](#437055_1_En_6_Chapter.xhtml#Fig16).\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig16_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig16_HTML.jpg)\n\
    \n    Figure 6-16\n\n    Viewing the results of a Chatter poll\n\n### Creating\
    \ Chatter Questions\n\nYou can use Chatter questions to ask questions that may\
    \ be beneficial to other users or that other users may have the answer to, as\
    \ shown in Figure [6-17](#437055_1_En_6_Chapter.xhtml#Fig17). Make sure you are\
    \ on the `Question` tab of your Chatter feed and post your question. Sit and wait\
    \ for other users to answer your post. Once you have found the best answer, click\
    \ the `Select as Best` link next to the `Like` link in the comment posted and\
    \ watch it move to the top of your post under your question for other users to\
    \ see.\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig17_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig17_HTML.jpg)\n\
    \nFigure 6-17\n\nCreating a Chatter question\n\n## Chatter Notifications\n\nChatter\
    \ notifications can come in many forms. You can see immediately when someone directs\
    \ a post at you by the bell icon in the upper-right corner of your browser, as\
    \ shown in Figure [6-18](#437055_1_En_6_Chapter.xhtml#Fig18). You can click the\
    \ bell icon and see what the latest post to you is or what the comment left is.\
    \ From here, you can click the `Mark all as read` link to clear your Notifications\
    \ window, or you can click the comment itself to be taken to the post in Chatter.\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig18_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig18_HTML.jpg)\n\
    \nFigure 6-18\n\nReceiving Chatter notifications\n\nYou can also choose to receive\
    \ daily, weekly, and instantaneous email notifications. If you are a Salesforce\
    \ mobile (iPhone or Android) user, you can enable notifications to be delivered\
    \ to your mobile phone, as shown in Figure [6-19](#437055_1_En_6_Chapter.xhtml#Fig19).\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig19_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig19_HTML.jpg)\n\
    \nFigure 6-19\n\nChatter notifications\n\n### Enabling Chatter Email Notifications\n\
    \nYou can enable Chatter email notifications for all your users by following these\
    \ steps:\n\n1.  Go to settings cog icon in the upper-right corner and choose `Setup`\
    \ from the drop-down, as shown in Figure [6-20](#437055_1_En_6_Chapter.xhtml#Fig20).\n\
    \n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig20_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig20_HTML.jpg)\n\
    \n    Figure 6-20\n\n    Navigating to the Setup menu\n2.  In the `Quick Find`\
    \ box, type `Email Setting` and click `Email Settings` found under Chatter, as\
    \ shown in Figure [6-21](#437055_1_En_6_Chapter.xhtml#Fig21).\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig21_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig21_HTML.jpg)\n\
    \n    Figure 6-21\n\n    Clicking Email Settings\n3.  Select the email setting\
    \ of your choice, as shown in Figure [6-22](#437055_1_En_6_Chapter.xhtml#Fig22).\n\
    \n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig22_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig22_HTML.jpg)\n\
    \n    Figure 6-22\n\n    General email settings\n\n    *   `Allow Emails` turns\
    \ on Chatter email notifications for users.\n    *   `Allow Email Replies` turns\
    \ on the ability for your users to reply from within their email to Chatter notifications.\n\
    \    *   `Allow Posts via Email` allows your users to post to groups using their\
    \ email.\n    *   `Allow Attachments via Email` gives the ability for your users\
    \ to use attachments in their replies and post from email.\n    *   `Show Salesforce\
    \ mobile app download badges` adds badges for downloading the Salesforce mobile\
    \ app to all Chatter email notifications in your organization.\n\n    **Note** Badges\
    \ in Salesforce are an internal Chatter recognition technique that users can earn\
    \ and give. This helps with user adoption by allowing users to give recognition\
    \ with a `Thanks` badge. The `Thanks` badge shows up on the user's profile for\
    \ everyone to see.\n\n4.  Click `Save`."
