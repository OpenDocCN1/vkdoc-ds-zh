  trans: "\n### Lightning 操作\n\n如图 1-29 所示的 **+** 按钮可用于在 `Salesforce` 中快速创建记录。使用此快速创建功能，可直接从主页新建活动、潜在客户、联系人、商机、个案或电话。\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig29_HTML.jpg](img/437055_1_En_1_Fig29_HTML.jpg)\n\
    \n图 1-29\n\nLightning 操作\n\n点击任意可用选项，即可在屏幕右下角立即显示一个快速创建窗口。\n\n在 Lightning Experience\
    \ 中，可以从主页打开多个窗口，以提高用户的工作效率和速度。最多可同时显示三个窗口（见图 1-30）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig30_HTML.jpg](img/437055_1_En_1_Fig30_HTML.jpg)\n\
    \n图 1-30\n\n*实用工具栏*\n\n### 帮助与培训\n\nSalesforce 拥有许多出色的支持资源，包括视频、操作指南以及名为 Trailhead\
    \ 的互动学习工具。从主页点击问号（如图 1-30 所示）即可访问这些资源。每个页面都有一个帮助菜单，其中包含指向实用资源的链接。使用此区域可以记录个案、获取支持、提供反馈以及查看版本说明。\n\
    \nSalesforce 每年提供三个季度的版本更新：春季、夏季和冬季。每个版本提供超过 150 个新功能。此菜单右下角显示的图像（如图 1-31 所示）会告知您的组织当前处于哪个版本。\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig31_HTML.jpg](img/437055_1_En_1_Fig31_HTML.jpg)\n\
    \n图 1-31\n\n帮助与培训\n\n### 设置\n\n设置是 Salesforce 管理员最常使用的区域。在 Lightning 中，设置页面已得到改进！设置区域拥有更符合逻辑且更易于导航的布局。系统管理员和拥有适当权限设置的用户可以访问此区域。从工具栏中选择“设置”即可导航至此（见图\
    \ 1-32）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig32_HTML.jpg](img/437055_1_En_1_Fig32_HTML.jpg)\n\
    \n图 1-32\n\nLightning 设置主页\n\n设置包含以下类别：管理、平台工具和设置。查看设置中的“最近使用的位置”，以无缝地继续任何管理工作。使用“快速查找”可以轻松找到进行自定义工作所需的管理工具。\n\
    \n点击“创建”按钮可快速访问最常用的工具，包括新建对象、工作流、选项卡、模板和用户（见图 1-33）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig33_HTML.jpg](img/437055_1_En_1_Fig33_HTML.jpg)\n\
    \n图 1-33\n\n创建按钮\n\n### 通知\n\n在一个位置查看所有通知，包括批准请求和 Chatter 提及。点击铃铛图标可查看通知列表（见图\
    \ 1-34）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig34_HTML.jpg](img/437055_1_En_1_Fig34_HTML.jpg)\n\
    \n图 1-34\n\n通知区域\n\n### 查看个人资料\n\n使用此部分可以更改个人设置、注销或切换到 Salesforce Classic（见图 1-35）。\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig35_HTML.jpg](img/437055_1_En_1_Fig35_HTML.jpg)\n\
    \n图 1-35\n\n设置区域\n\n## 用户\n\n在 Lightning 中，您可以像在 Classic 中一样轻松地创建 Salesforce 用户。用户通过许可证、用户名和密码以及配置文件进行标识。在\
    \ Lightning 中，您可以创建新用户、停用用户、编辑用户设置等。\n\n### 创建新用户\n\n要分配许可证和记录所有权，您必须首先创建一个用户。每个用户都必须分配一个许可证。要释放许可证，您可以停用某个用户并进行相应分配。在“快速查找”中，搜索并选择位于“管理”部分的“用户”。\n\
    \n导航到用户主页（见图 1-36）以创建单个用户、编辑现有用户的信息、添加多个用户以及重置密码。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig36_HTML.jpg](img/437055_1_En_1_Fig36_HTML.jpg)\n\
    \n图 1-36\n\n用户设置主页\n\n### 创建和编辑用户信息\n\n请按照以下步骤创建新用户：\n\n1.  单击“新建用户”。\n2.  填写所有标红且为必填的字段。这包括姓氏、别名、电子邮件、用户名和昵称（见图\
    \ 1-37）。\n    \n    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig37_HTML.jpg](img/437055_1_En_1_Fig37_HTML.jpg)\n\
    \    \n    图 1-37\n    \n    添加新用户的必填字段\n\n    **注意** 电子邮件地址必须是有效的电子邮件格式，但可用于多个组织。但是，用户名必须是唯一的，并且格式正确的电子邮件地址。\n\
    \    \n    例如，`felicia@cloudcreations.com` 就是一种正确的电子邮件格式。\n\n3.  在“用户许可证”字段中分配适当的许可证。\n\
    4.  使用“配置文件”字段分配配置文件。\n5.  选中“市场营销用户”以使分配的用户有权访问您组织的营销工具。\n6.  选中“离线用户”以使分配的用户获得离线访问权限。\n\
    7.  选中“知识用户”以授予对知识库文章进行更改的权限。\n8.  选中“Force.com Flow 用户”以授予 Force.com 许可用户运行 Flow\
    \ 的能力。\n9.  选中“Service Cloud 用户”以授予对 Service Cloud 的访问权限。\n10.  选中“Site.com 贡献者用户”以允许访问\
    \ Site.com。\n11.  选中“Work.com 用户”以分配 work.com 用户功能许可证。\n12.  选中“Salesforce Classic\
    \ 用户”以启用对 Salesforce Mobile Classic 的访问。\n13.  应用适当的区域设置，例如时区、区域设置和语言（图 1-30）。\n\
    14.  单击“保存”。\n\nSalesforce 会立即向用户发送通知电子邮件以生成新密码。要停止此操作，请取消选择屏幕底部的“生成新密码”。\n\n\
    ### 添加多个用户\n\n您可以通过一次添加多个用户来节省时间。要在用户主页上添加多个用户，请单击“添加多个用户”，如图 1-38 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig38_HTML.jpg](img/437055_1_En_1_Fig38_HTML.jpg)\n\
    \n图 1-38\n\n添加多个用户按钮\n\n下一页将列出每种许可证类型可用的许可证数量，如图 1-39 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig39_HTML.jpg](img/437055_1_En_1_Fig39_HTML.jpg)\n\
    \n图 1-39\n\n可用许可证的细分信息\n\n滚动到页面底部，然后选择您要为所有用户添加的用户许可证，如图 1-40 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig40_HTML.jpg](img/437055_1_En_1_Fig40_HTML.jpg)\n\
    \n图 1-40\n\n为批量用户组选择用户许可证\n\n### 注意\n\n添加多个用户时，这些用户必须具有相同的许可证类型。\n\n一旦您选择了适当的许可证类型，请填写用户的详细信息并单击“保存”，如图\
    \ 1-41 所示。并非所有用户字段在此过程中都可用。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig41_HTML.jpg](img/437055_1_En_1_Fig41_HTML.jpg)\n\
    \n图 1-41\n\n新用户的必填字段\n"
- fmt: "### Deactivate a User\n\nIn Salesforce, you can’t delete a user, but you can\
    \ deactivate a user to prevent them from logging in. Deactivating a user frees\
    \ up a license that can be assigned to another user (see Figure [1-42](#437055_1_En_1_Chapter.xhtml#Fig42)).\
    \ When you deactivate a user, the user is removed from all sharing privileges\
    \ and groups.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig42_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig42_HTML.jpg)\n\
    \nFigure 1-42 – `Active` check box on a user’s page\n\nRecords owned by this user\
    \ can still be transferred to an active account. These are the deactivation steps:\n\
    \n1. Navigate to the `User` section in `Setup`.\n2. Select the name of the user\
    \ that should be deactivated.\n3. Click `Edit` from the user record page.\n4.\
    \ Deselect `Active` from the user profile.\n5. Click `Save`.\n\n## Lightning Pages\n\
    \nLightning allows you to create custom pages to display and arrange key information\
    \ for specific groups of users. You can increase adoption and user acceptance\
    \ by building out clear and easy-to-use pages. By creating apps, you can minimize\
    \ the type of information that is exposed to make the Salesforce organization\
    \ easier to adopt. The `App Builder` is a new drag-and-drop tool to customize\
    \ the interface without code (see Figure [1-43](#437055_1_En_1_Chapter.xhtml#Fig43)).\n\
    \nFollow these steps to make changes to the Lightning home page:\n\n1. From the\
    \ home page, click `Edit Page` (this feature can be found on most Lightning pages).\
    \ See Figure [1-43](#437055_1_En_1_Chapter.xhtml#Fig43).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig43_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig43_HTML.jpg)\n\
    \nFigure 1-43 – `Edit Page` in the Setup drop-down\n\n2. Arrange which components\
    \ you want accessible for your users to see. See Figure [1-44](#437055_1_En_1_Chapter.xhtml#Fig44).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig44_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig44_HTML.jpg)\n\
    \nFigure 1-44 – `Lightning App Builder`\n\n3. In the left panel, choose from the\
    \ available Lightning components and drag and drop to the desired section on the\
    \ home page. The right panel will request details specific to the component chosen.\n\
    \n### Create a New Lightning App\n\nFrom `Setup`, search and select `App Manager`\
    \ to open up the `Lightning Experience App Manager`. Click `New Lightning App`\
    \ to create a new app (see Figure [1-45](#437055_1_En_1_Chapter.xhtml#Fig45)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig45_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig45_HTML.jpg)\n\
    \nFigure 1-45 – Creating a new Lightning app\n\nTo create a new app, follow these\
    \ steps:\n\n1. Fill in the required fields (those marked with an asterisk).\n\
    \   - The app name is what will appear in the navigation bar.\n   - The developer\
    \ name is the API name and must be unique across other apps in your organization.\n\
    \n2. For `App Branding`, upload an image such as a company logo to customize the\
    \ page (see Figure [1-46](#437055_1_En_1_Chapter.xhtml#Fig46)).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig46_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig46_HTML.jpg)\n\
    \nFigure 1-46 – App details\n\n3. Once you fill out the appropriate fields, click\
    \ `Next`.\n\n4. Select the navigation style. Choose `Standard` to display the\
    \ navigation bar at the top or `Console` to open records in a new workspace tab\
    \ (see Figure [1-47](#437055_1_En_1_Chapter.xhtml#Fig47)).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig47_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig47_HTML.jpg)\n\
    \nFigure 1-47 – New Lightning app navigation options\n\n5. Click `Next`.\n\n6.\
    \ Click `Add` to add the utility bar (see Figure [1-48](#437055_1_En_1_Chapter.xhtml#Fig48)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig48_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig48_HTML.jpg)\n\
    \nFigure 1-48 – Steps to enable utility bar for an app\n\n7. Select the items\
    \ that should be displayed in the new app. The order of your selected items will\
    \ display at the top of the page from left to right (see Figure [1-49](#437055_1_En_1_Chapter.xhtml#Fig49)).\n\
    \n> **Note:** It is best practice to create different apps for different groups\
    \ of users. When creating these apps, it’s recommended that you display only the\
    \ items that are relevant to those groups of users. It can be overwhelming and\
    \ frustrating when there is too much unnecessary information for your users.\n\
    >\n> For example, a sales app should show only sales-related items. Leads, accounts,\
    \ contacts, and opportunities are examples. For your service agents, they most\
    \ likely do not need to see opportunities. Create an app for your service agents\
    \ to see only service-related items such as contacts and cases.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig49_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig49_HTML.jpg)\n\
    \nFigure 1-49 – Adding tabs to new app\n\n8. Click `Next`.\n\n9. Select the profiles\
    \ that should have access to this app (see Figure [1-50](#437055_1_En_1_Chapter.xhtml#Fig50)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig50_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig50_HTML.jpg)\n\
    \nFigure 1-50 – Assigning users to an app\n\n10. Click `Save and Finish Now`.\
    \ You can find the newly created app in the `App Launcher`.\n\n## Company Settings\n\
    \nCompany settings are comprised of the settings that can be customized, such\
    \ as fiscal year, business and holiday hours, language settings, and other important\
    \ information.\n\n### Company Information\n\nSearch for and select `Company Information`\
    \ in the `Quick Find` area. The `Company Information` section holds important\
    \ information about the organization, license availability, and data usage.\n\n\
    #### Organization Detail\n\nThe organization detail displays general information\
    \ about the company. Edit the primary contact to establish the point of contact\
    \ for any technical support requests. Make changes to the locale, currency, and\
    \ newsletters settings here (see Figure [1-51](#437055_1_En_1_Chapter.xhtml#Fig51)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig51_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig51_HTML.jpg)\n\
    \nFigure 1-51 – Organization detail\n\n#### Storage Usage\n\nEach organization\
    \ has storage limits. Storage is divided into two categories: data and file storage.\
    \ To view your storage limits, storage usage, and percentage utilized, navigate\
    \ to your company settings.\n\nClick `View` next to `Used Data Space` or `Used\
    \ File Space` to view your organization’s current storage use.\n\nThe storage\
    \ usage is broken down and shows the percentage of utilization across the two.\
    \ Information is also broken down by object, as shown in Figure [1-52](#437055_1_En_1_Chapter.xhtml#Fig52).\
    \ Use this breakdown to identify which records occupy the most space.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig52_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig52_HTML.jpg)\n\
    \nFigure 1-52 – `Storage Usage` breakdown\n\n#### User Licenses\n\nThis section\
    \ displays the total number of licenses available, the total used, and the remaining\
    \ number of licenses available for each license type. This includes the standard\
    \ Salesforce license, which is the most commonly purchased and assigned (see Figure\
    \ [1-53](#437055_1_En_1_Chapter.xhtml#Fig53)).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig53_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig53_HTML.jpg)\n\
    \nFigure 1-53 – User licenses\n\n#### Permission Set Licenses\n\nPermission set\
    \ licenses entitle users to access features and various tools that are not included\
    \ in their user license. This can include a `Service Cloud` console user, a `CRM`\
    \ user, `Analytics Cloud` accessibility, and more."
