  trans: "\n### 创建 Chatter 投票\n\n你可以在自己的动态或群组动态中创建最多包含十个选项的 Chatter 投票，如图 6-12 所示。观察其他\
    \ Chatter 用户对他们的选择进行投票。Salesforce 将统计票数并显示结果。投票用户在提交投票前，不会看到谁投了哪个选项，也不会看到投票结果。继续阅读以了解如何创建\
    \ Chatter 投票。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig12_HTML.jpg](img/437055_1_En_6_Fig12_HTML.jpg)\n\
    \n图 6-12\n\nChatter 投票\n\n要创建 Chatter 投票，请按照以下步骤操作：\n\n1.  导航到 Chatter 对象，或通过导航到\
    \ Chatter 选项卡从记录内创建投票。\n2.  点击记录 Chatter 部分中的 `Poll` 选项卡。图 6-13 显示了如何从记录访问此功能，图\
    \ 6-14 显示了如何从 Chatter 对象访问此功能。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig14_HTML.jpg](img/437055_1_En_6_Fig14_HTML.jpg)\n\
    \n    图 6-14\n\n    从 Chatter 对象访问 Chatter 投票\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig13_HTML.jpg](img/437055_1_En_6_Fig13_HTML.jpg)\n\
    \n    图 6-13\n\n    从记录访问 Chatter 投票\n3.  输入您为 Chatter 用户准备的投票问题。\n4.  输入您为 Chatter\
    \ 用户提供的投票选项。\n5.  如果您需要更多选项，请点击 `Add new choice` 链接。\n6.  完成选项设置后，点击 `Ask`，如图\
    \ 6-15 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig15_HTML.jpg](img/437055_1_En_6_Fig15_HTML.jpg)\n\
    \n    图 6-15\n\n    创建 Chatter 投票\n7.  发布投票后，您可以点击 `View results` 链接查看结果，如图 6-16\
    \ 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig16_HTML.jpg](img/437055_1_En_6_Fig16_HTML.jpg)\n\
    \n    图 6-16\n\n    查看 Chatter 投票结果\n\n### 创建 Chatter 问题\n\n您可以使用 Chatter 提问功能提出对其他用户有益或可能由其他用户解答的问题，如图\
    \ 6-17 所示。确保您处于 Chatter 动态的 `Question` 选项卡，然后发布您的问题。只需等待其他用户回答您的帖子。找到最佳答案后，点击评论中\
    \ `Like` 链接旁边的 `Select as Best` 链接，该答案便会移至您问题下方的帖子顶部，供其他用户查看。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig17_HTML.jpg](img/437055_1_En_6_Fig17_HTML.jpg)\n\
    \n图 6-17\n\n创建 Chatter 问题\n\n## Chatter 通知\n\nChatter 通知可以多种形式呈现。当有人@您时，您可以通过浏览器右上角的铃铛图标立即看到，如图\
    \ 6-18 所示。您可以点击铃铛图标查看最新的@您的帖子或留下的评论。在此处，您可以点击 `Mark all as read` 链接来清除通知窗口，或者点击评论本身以跳转到\
    \ Chatter 中的帖子。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig18_HTML.jpg](img/437055_1_En_6_Fig18_HTML.jpg)\n\
    \n图 6-18\n\n接收 Chatter 通知\n\n您还可以选择接收每日、每周或即时的电子邮件通知。如果您是 Salesforce 移动端（iPhone\
    \ 或 Android）用户，您可以启用通知并将其发送到您的手机上，如图 6-19 所示。\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig19_HTML.jpg](img/437055_1_En_6_Fig19_HTML.jpg)\n\
    \n图 6-19\n\nChatter 通知\n\n### 启用 Chatter 电子邮件通知\n\n您可以通过以下步骤为所有用户启用 Chatter 电子邮件通知：\n\
    \n1.  点击右上角的设置齿轮图标，然后从下拉菜单中选择 `Setup`，如图 6-20 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig20_HTML.jpg](img/437055_1_En_6_Fig20_HTML.jpg)\n\
    \n    图 6-20\n\n    导航到设置菜单\n2.  在 `Quick Find` 框中输入 `Email Setting`，然后点击 Chatter\
    \ 下的 `Email Settings`，如图 6-21 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig21_HTML.jpg](img/437055_1_En_6_Fig21_HTML.jpg)\n\
    \n    图 6-21\n\n    点击电子邮件设置\n3.  选择您想要的电子邮件设置，如图 6-22 所示。\n\n    ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig22_HTML.jpg](img/437055_1_En_6_Fig22_HTML.jpg)\n\
    \n    图 6-22\n\n    通用电子邮件设置\n\n    *   `Allow Emails`：为用户启用 Chatter 电子邮件通知。\n\
    \    *   `Allow Email Replies`：允许用户通过回复电子邮件来回应 Chatter 通知。\n    *   `Allow Posts\
    \ via Email`：允许用户使用电子邮件向群组发帖。\n    *   `Allow Attachments via Email`：允许用户在回复和通过电子邮件发帖时使用附件。\n\
    \    *   `Show Salesforce mobile app download badges`：为组织中所有的 Chatter 电子邮件通知添加下载\
    \ Salesforce 移动应用的徽章。\n\n    **注意** Salesforce 中的徽章是一种内部 Chatter 认可技巧，用户可以获取并授予他人。这有助于提高用户接受度，允许用户通过\
    \ `Thanks` 徽章给予认可。`Thanks` 徽章会显示在用户的个人资料中，供所有人查看。\n\n4.  点击 `Save`。\n"
- fmt: "### User’s Configuration for Chatter Notifications\n\nThe previous settings\
    \ will allow your users to use Chatter. Now we’ll cover how your users can choose\
    \ to receive the Chatter notifications.\n\n1. Click your profile picture at the\
    \ top-right corner of the web browser and click Settings, as shown in Figure [6-23](#437055_1_En_6_Chapter.xhtml#Fig23).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig23_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig23_HTML.jpg)\n\
    \n   Figure 6-23\n\n   Accessing your profile\n\n2. In the Quick Find area, type\
    \ in **Email Notifications** and select Email Notifications under Chatter.\n\n\
    3. Select the options that best fit your needs.\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig25_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig25_HTML.jpg)\n\
    \n   Figure 6-25\n\n   Configuring what Chatter email you receive\n\n   * In the\
    \ General section, you must select **Receive emails** to receive Chatter emails,\
    \ as shown in Figure [6-24](#437055_1_En_6_Chapter.xhtml#Fig24).\n\n     ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig24_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig24_HTML.jpg)\n\
    \n     Figure 6-24\n\n     Turning **Receive emails** on\n\n   * In the Personal\
    \ section, for **Email me when Someone**, we recommend the following be selected\
    \ because your users can become overwhelmed by too many email notices if all of\
    \ them are selected:\n     * *Posts on my profile*: This option will keep you\
    \ up-to-date on any post that is made on your profile.\n     * *Comments on a\
    \ post on my profile*: This option will notify you on any comment that was left\
    \ on your post.\n     * *Comments on an item I bookmarked*: This will keep you\
    \ current with any bookmark post so you know the latest.\n     * *Mentions me\
    \ in a post*: This will let you know any time a user uses the `@` symbol and directs\
    \ a post to you or mentions you in a post.\n     * *Mentions me in a comment*:\
    \ This will let you know any time a user uses the `@` symbol and directs a comment\
    \ or mentions you in a comment.\n\n4. Select the frequency of your personal digest.\
    \ Your personal digest is a summary of the recent activity in Chatter that appears\
    \ on your own feed. You can choose to receive this daily, weekly, or never, as\
    \ shown in Figure [6-26](#437055_1_En_6_Chapter.xhtml#Fig26).\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig26_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig26_HTML.jpg)\n\
    \n   Figure 6-26\n\n   Selecting to receive emails daily, weekly, or never\n\n\
    5. You can also set how often you receive group Chatter notifications. We suggest\
    \ that you select Limited for new groups; you can change your setting for each\
    \ individual group should you want more frequency, as shown in Figure [6-27](#437055_1_En_6_Chapter.xhtml#Fig27).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig27_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig27_HTML.jpg)\n\
    \n   Figure 6-27\n\n   Selecting what to receive from Chatter\n\n6. You can select\
    \ how often you receive group customer questions as well, as shown in Figure [6-28](#437055_1_En_6_Chapter.xhtml#Fig28).\
    \ We suggest Limited as well here. If you choose another option, you may get more\
    \ emails than you want, which can cause more of a distraction than being helpful.\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig28_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig28_HTML.jpg)\n\
    \n   Figure 6-28\n\n   Selecting what customer questions to be notified from\n\
    \n## Feed Tracking\n\nSalesforce feed tracking with Chatter allows you to see\
    \ changes made to records that are recorded in the Chatter feed. Enabling this\
    \ option on an object allows a user to follow the changes made to that record\
    \ in the Chatter feed. You can choose which object and what fields are tracked\
    \ in the feed. You can track fields on the following objects: `User`, `Group`,\
    \ custom and external standard objects, `Account`, `Article Type`, `Asset`, `Campaign`,\
    \ `Case`, `Contact`, `Contract`, `Dashboard`, `Event`, `Lead`, `Opportunity`,\
    \ `Product`, `Report`, `Solution`, and `Task`.\n\n### Note\n\nField-level security\
    \ and sharing settings are used in the Chatter feed to determine what users can\
    \ see in the feed as well.\n\n### Enabling and Customizing Feed Tracking\n\nFollow\
    \ these steps:\n\n1. Click the settings cog icon in the upper-right corner of\
    \ the browser and select Setup, as shown in Figure [6-29](#437055_1_En_6_Chapter.xhtml#Fig29).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig29_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig29_HTML.jpg)\n\
    \n   Figure 6-29\n\n   Navigating to the Setup menu\n\n2. In the Quick Find area,\
    \ type **Feed Tracking** and select Feed Tracking under Chatter, as shown in Figure\
    \ [6-30](#437055_1_En_6_Chapter.xhtml#Fig30).\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig30_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig30_HTML.jpg)\n\
    \n   Figure 6-30\n\n   Navigating to Feed Tracking\n\n3. On the left side, click\
    \ an object you want to configure for feed tracking, as shown in Figure [6-31](#437055_1_En_6_Chapter.xhtml#Fig31).\n\
    \n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig31_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig31_HTML.jpg)\n\
    \n   Figure 6-31\n\n   Setting up feed tracking\n\n4. At the top, make sure to\
    \ select Enable Feed Tracking.\n\n5. Select up to 20 fields to track per object.\
    \ You don’t need to select any fields here if you don’t want to track changes\
    \ to specific fields in Chatter. By selecting individual fields to track, this\
    \ will capture the change that was made in Chatter. See Figure [6-32](#437055_1_En_6_Chapter.xhtml#Fig32)\
    \ for an example of feed tracking.\n\n   ![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig32_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig32_HTML.jpg)\n\
    \n   Figure 6-32\n\n   How feed tracking shows up in Chatter\n\n   **Note** The\
    \ more you select, the more cluttered your Chatter record feeds will become. Any\
    \ field change on the field selection will add a new post to that record feed,\
    \ pushing older posts lower.\n\n6. Once you have set up all the objects as desired,\
    \ click the Save button.\n\n## Chatter Profiles\n\nSalesforce Chatter profiles\
    \ allow your users to customize their Salesforce profile that is seen by other\
    \ Salesforce users and the Chatter-free users (usually customers). They can add\
    \ a profile picture, write an About Me section, add contact information, and add\
    \ a header photo. The profile is another way your users can see their Chatter\
    \ feeds, what groups they are part of, what files they’ve uploaded in posts, who\
    \ they are following, and who is following them. They can even add a new post\
    \ and comment on existing ones from their profiles.\n\nTo access your profile,\
    \ click your profile picture in the upper-right corner and click your name, as\
    \ shown in Figure [6-33](#437055_1_En_6_Chapter.xhtml#Fig33).\n\n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig33_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig33_HTML.jpg)\n\
    \nFigure 6-33\n\nNavigating to your profile\n\nOther users can access your profile\
    \ by clicking your hyperlinked name found on records, in Chatter posts, or anywhere\
    \ else they see your name hyperlinked, as shown in Figure [6-34](#437055_1_En_6_Chapter.xhtml#Fig34).\n\
    \n![../images/437055_1_En_6_Chapter/437055_1_En_6_Fig34_HTML.jpg](images/437055_1_En_6_Chapter/437055_1_En_6_Fig34_HTML.jpg)\n\
    \nFigure 6-34\n\nAccessing other users’ profiles"
