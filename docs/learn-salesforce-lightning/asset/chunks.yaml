    \    1.  You can select when the case is created, which will evaluate the criteria\
    \ only once when the case is created.\n\n2.  You can select when the case is created\
    \ and disable it after the case is first modified. This option will check your\
    \ case’s criteria after the first time the case is modified (usually this is after\
    \ a user has started to handle it).\n\n3.  You can select the last modification\
    \ time of the case. This will check the criteria of the case every time a change\
    \ is made to it. This will allow the escalation rule to be applied when the case\
    \ is modified.\n\n12.  Click Save.\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig32_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig32_HTML.jpg)\n\
    \nFigure 3-32\n\nSelecting the business hours and when the case escalation rule\
    \ should run\n\n13.  Click the New button to start the creation of your actions.\n\
    \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig33_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig33_HTML.jpg)\n\
