    \ follow these steps:\n\n1.  Navigate to the Reports tab and click Reports; once\
    \ you see your report folders, click New Reports in the right corner.\n\n2.  In\
    \ the Quick Find area, type **Opportunity**. Or, click Opportunity and click Create,\
    \ as shown in Figure [5-48](#437055_1_En_5_Chapter.xhtml#Fig48).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig48_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig48_HTML.jpg)\n\
    \n    Figure 5-48\n\n    Selecting the report type for your report\n\n3.  Click\
    \ Show and select Details, as shown in Figure [5-49](#437055_1_En_5_Chapter.xhtml#Fig49).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig49_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig49_HTML.jpg)\n\
    \n    Figure 5-49\n\n    Showing the details on a report\n\n4.  Select the proper\
    \ filters for your report to show the data desired, as shown in Figure [5-50](#437055_1_En_5_Chapter.xhtml#Fig50).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig50_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig50_HTML.jpg)\n\
    \n    Figure 5-50\n\n    Setting up the report field filters for your report\n\
    \n5.  Click and hold the name of the field you would like to move into your reports\
    \ and drag it to the column where you would like it to be placed. Continue to\
    \ drag and drop as many fields as necessary for the report. Once finished, click\
    \ Save, as shown in Figure [5-51](#437055_1_En_5_Chapter.xhtml#Fig51).\n\n   \
    \ ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig51_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig51_HTML.jpg)\n\
    \n    Figure 5-51\n\n    Dragging and dropping a field into your report\n\n6.\
    \  Name your report and press your Tab key for Salesforce to automatically enter\
    \ a value in the Report Unique Name field.\n\n7.  Enter a description that will\
    \ be displayed to users.\n\n8.  Select the report folder where your report should\
    \ be stored.\n\n9.  Click Save, as shown in Figure [5-52](#437055_1_En_5_Chapter.xhtml#Fig52).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig52_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig52_HTML.jpg)\n\
    \n    Figure 5-52\n\n    Saving your report\n\n10.  Click Run Report to see the\
    \ results of your data.\n\n#### Creating Tabular, Summary, and Matrix Reports\n\
    \nTabular reports are the default report selected when creating a new report.\
    \ Once you have chosen your report type and are in the report builder, you can\
    \ switch between all three report formats. If switching from the Summary or Matrix\
    \ report format to Tabular, you’ll want to take the fields you grouped and move\
    \ them to a column; otherwise, you’ll lose them and have to bring them back to\
    \ the report once in Tabular format. When switching from a Matrix report to a\
    \ Summary report, be aware that you may lose groupings here as well if you have\
    \ set up four groupings on the Matrix report; Summary reports can handle only\
    \ up to three groupings. Let’s look at creating Tabular, Summary, and Matrix reports.\n\
    \n1.  Navigate to the Reports tab and click Reports; once you see your report\
    \ folders, click New Reports in the right corner.\n\n2.  Choose the report type\
    \ of your choice and click Create, as shown in Figure [5-53](#437055_1_En_5_Chapter.xhtml#Fig53).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig53_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig53_HTML.jpg)\n\
    \n    Figure 5-53\n\n    Selecting the report type for your report\n\n3.  In the\
    \ Preview pane of the report builder, choose the drop-down that displays Tabular\
    \ Format and switch to the report format of your choice, as shown in Figure [5-54](#437055_1_En_5_Chapter.xhtml#Fig54).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig54_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig54_HTML.jpg)\n\
    \n    Figure 5-54\n\n    Changing report formats"
  trans: "\n### 创建联系人与客户报告\n\n您可以创建一份联系人与客户报告，以显示所有联系人详细信息。使用此报告可生成呼叫列表、进行邮件合并、查看新创建的联系人与客户，或满足其他业务需求。企业对企业（B2B）组织若想确定其合作的行业类型，可从客户报告中获益。您可以生成一份报告，显示在每個行业中您所接触的企业数量。这将有助于您确定营销工作的重点方向。图\
    \ 5-42 展示了此报告的外观。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig42_HTML.jpg](img/437055_1_En_5_Fig42_HTML.jpg)\n\
    \n图 5-42 — 客户与联系人报告示例\n\n要创建联系人与客户报告，请执行以下操作：\n\n1.  导航至 `Reports` 选项卡并单击 `Reports`；看到报告文件夹后，单击右上角的\
    \ `New Reports`。\n\n2.  在 `Quick Find` 区域中，输入 `Contact`。或者，单击 `Accounts`，然后单击\
    \ `Contacts & Accounts`，再单击 `Create`，如图 5-43 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig43_HTML.jpg](img/437055_1_En_5_Fig43_HTML.jpg)\n\
    \n    图 5-43 — 为报告选择报告类型\n\n3.  按住要移入报告的字段名称，将其拖到目标列。根据需要继续拖放其他字段。完成后，单击 `Save`，如图\
    \ 5-44 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig44_HTML.jpg](img/437055_1_En_5_Fig44_HTML.jpg)\n\
    \n    图 5-44 — 将字段拖放到报告中\n\n4.  为报告命名，然后按 `Tab` 键，Salesforce 将自动在 `Report Unique\
    \ Name` 字段中输入一个值。\n\n5.  输入将向用户显示的描述。\n\n6.  选择用于存储报告的文件夹。\n\n7.  单击 `Save`，如图\
    \ 5-45 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig45_HTML.jpg](img/437055_1_En_5_Fig45_HTML.jpg)\n\
    \n    图 5-45 — 保存报告\n\n8.  单击 `Run Report` 查看数据结果，如图 5-46 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig46_HTML.jpg](img/437055_1_En_5_Fig46_HTML.jpg)\n\
    \n    图 5-46 — 运行报告以查看结果\n\n### 创建商机报告\n\n您可以创建商机报告以及含产品的商机报告，以显示贵公司产生的销售额。使用这些报告类型可显示销售管道中的内容、已从管道中移除的内容，以及团队成功赢得的全部销售业绩。大多数企业会生成商机报告，以帮助预测未来可能需要付出的努力。例如，项目管理公司需要预估目前有多少项目，以及未来可能关闭或启动多少项目。能够进行这种预估对于业务运营至关重要。项目管理公司需要能夠预估未来几个月需要多少项目经理或内部支持人员。为此，项目管理公司将查看所有成功概率为\
    \ 90% 或更高的销售商机。图 5-47 展示了此报告的外观。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig47_HTML.jpg](img/437055_1_En_5_Fig47_HTML.jpg)\n\
    \n图 5-47 — 商机报告示例\n\n要创建商机报告，请遵循以下步骤：\n\n1.  导航至 `Reports` 选项卡并单击 `Reports`；看到报告文件夹后，单击右上角的\
    \ `New Reports`。\n\n2.  在 `Quick Find` 区域中，输入 `Opportunity`。或者，单击 `Opportunity`，再单击\
    \ `Create`，如图 5-48 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig48_HTML.jpg](img/437055_1_En_5_Fig48_HTML.jpg)\n\
    \n    图 5-48 — 为报告选择报告类型\n\n3.  单击 `Show` 并选择 `Details`，如图 5-49 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig49_HTML.jpg](img/437055_1_En_5_Fig49_HTML.jpg)\n\
    \n    图 5-49 — 显示报告详细信息\n\n4.  为报告选择适当的筛选条件以显示所需数据，如图 5-50 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig50_HTML.jpg](img/437055_1_En_5_Fig50_HTML.jpg)\n\
    \n    图 5-50 — 为报告设置报告字段筛选条件\n\n5.  按住要移入报告的字段名称，将其拖到目标列。根据需要继续拖放其他字段。完成后，单击 `Save`，如图\
    \ 5-51 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig51_HTML.jpg](img/437055_1_En_5_Fig51_HTML.jpg)\n\
    \n    图 5-51 — 将字段拖放到报告中\n\n6.  为报告命名，然后按 `Tab` 键，Salesforce 将自动在 `Report Unique\
    \ Name` 字段中输入一个值。\n\n7.  输入将向用户显示的描述。\n\n8.  选择用于存储报告的文件夹。\n\n9.  单击 `Save`，如图\
    \ 5-52 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig52_HTML.jpg](img/437055_1_En_5_Fig52_HTML.jpg)\n\
    \n    图 5-52 — 保存报告\n\n10.  单击 `Run Report` 查看数据结果。\n\n### 创建表格、摘要和矩阵报告\n\n表格报告是创建新报告时的默认报告格式。选择报告类型并进入报告生成器后，您可以在所有三种报告格式之间切换。如果从摘要或矩阵报告格式切换到表格格式，建议将已分组的字段移动到某列中；否则，这些字段将会丢失，切换到表格格式后必须重新将它们添加到报告中。从矩阵报告切换到摘要报告时，请注意，如果在矩阵报告中设置了四个分组，也可能会丢失一些分组；摘要报告最多只能处理三个分组。下面我们来看看如何创建表格、摘要和矩阵报告。\n\
    \n1.  导航至 `Reports` 选项卡并单击 `Reports`；看到报告文件夹后，单击右上角的 `New Reports`。\n\n2.  选择您想要的报告类型，然后单击\
    \ `Create`，如图 5-53 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig53_HTML.jpg](img/437055_1_En_5_Fig53_HTML.jpg)\n\
    \n    图 5-53 — 为报告选择报告类型\n\n3.  在报告生成器的 `Preview` 窗格中，选择下拉菜单中显示的 `Tabular Format`，并切换到您想要的报告格式，如图\
    \ 5-54 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig54_HTML.jpg](img/437055_1_En_5_Fig54_HTML.jpg)\n\
    \n    图 5-54 — 更改报告格式\n"
- fmt: "### Building a Tabular Report\n\nFollow these steps:\n\n1.  To build a Tabular\
    \ report, there is no need to change the `Format` drop-down. Just begin dragging\
    \ and dropping your fields as needed for your report. Once finished, click `Save`,\
    \ name your report, and click `Run` to see your results, as shown in Figure [5-55](#437055_1_En_5_Chapter.xhtml#Fig55).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig55_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig55_HTML.jpg)\n\
    \n    Figure 5-55\n\n    Dragging and dropping fields into your report\n\n2. \
    \ You can also choose what field your Tabular report should sort by, by clicking\
    \ that field. Notice that when you click the field, an arrow is added to that\
    \ field facing up or down. This tells you if it is sorting this field in ascending\
    \ or descending order, as shown in Figure [5-56](#437055_1_En_5_Chapter.xhtml#Fig56).\n\
    \n    **Note** You can sort any report type like this.\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig56_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig56_HTML.jpg)\n\
    \n    Figure 5-56\n\n    Sorting by a field in your reports\n\n### Building a\
    \ Summary Report\n\nFollow these steps:\n\n1.  Once you are in the report builder,\
    \ change the `Format` to the Summary format, as shown in Figure [5-57](#437055_1_En_5_Chapter.xhtml#Fig57).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig57_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig57_HTML.jpg)\n\
    \n    Figure 5-57\n\n    Changing your report format to the Summary report format\n\
    \n2.  Add groupings to your report by dragging and dropping a field into the area\
    \ `\"Drop a field here to create a grouping\"`, as shown in Figure [5-58](#437055_1_En_5_Chapter.xhtml#Fig58).\n\
    \n    **Note** You can add up to three groupings here, and this feature is also\
    \ available in the Matrix report format.\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig58_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig58_HTML.jpg)\n\
    \n    Figure 5-58\n\n    Dragging and dropping fields into the grouping section\
    \ of the report\n\n3.  Once you have grouped your report with fields, you can\
    \ further define how these fields are grouped for date data type fields. For instance,\
    \ if you grouped by the `Close Date` field, you can change the grouping to group\
    \ by `Calendar Month`, as shown in Figure [5-59](#437055_1_En_5_Chapter.xhtml#Fig59).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig59_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig59_HTML.jpg)\n\
    \n    Figure 5-59\n\n    Defining how your report is grouped\n\n4.  Continue building\
    \ your report by dragging and dropping fields into places of your choice. Save\
    \ and name the report and run!\n\n### Building a Matrix Format Report\n\nFollow\
    \ these steps:\n\n1.  Once you are in the report builder, change the `Tabular\
    \ Format` drop-down to `Matrix`, as shown in Figure [5-60](#437055_1_En_5_Chapter.xhtml#Fig60).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig60_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig60_HTML.jpg)\n\
    \n    Figure 5-60\n\n    Switching your report format to a Matrix report format\n\
    \n2.  Notice for this report type you have two areas for grouping: at the columns\
    \ level and at the row level. Drag and drop the field of your choice onto either\
    \ of these grouping areas. You can add two groups on the column grouping level\
    \ and on the row grouping level, as shown in Figure [5-61](#437055_1_En_5_Chapter.xhtml#Fig61).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig61_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig61_HTML.jpg)\n\
    \n    Figure 5-61\n\n    Dragging and dropping the field into the grouping sections\
    \ of the report\n\n3.  Continue building your report by dragging and dropping\
    \ fields where you would like. Save and name the report and run!\n\n### Summarizing\
    \ Your Data\n\nYou can use the summarize feature on the number, currency, or percent\
    \ field data types in the report builder. The summarize feature allows you to\
    \ sum the data in a row, find the average of data in a row, find the minimum of\
    \ the data in a row, or find the maximum of the data in a row. Use this feature\
    \ in an opportunity report to find the average age of an opportunity or case.\
    \ Or use this feature to simply give you the sum of your amount fields on opportunities.\
    \ When you use this feature in a summary or matrix report, it will summarize on\
    \ all grouping levels and give you the grand total.\n\n1.  Once in your report\
    \ builder, click the down-facing arrow next to the field you want to summarize,\
    \ as shown in Figure [5-62](#437055_1_En_5_Chapter.xhtml#Fig62).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig62_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig62_HTML.jpg)\n\
    \n    Figure 5-62\n\n    Summarizing a field\n\n2.  Choose to sum, find the average,\
    \ find the max, or find the min and click `Apply`, as shown in Figure [5-63](#437055_1_En_5_Chapter.xhtml#Fig63).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig63_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig63_HTML.jpg)\n\
    \n    Figure 5-63\n\n    Choosing how you want to summarize a field\n\n3.  Don’t\
    \ forget to save and run your report.\n\n### Adding Formulas to Reports\n\nYou\
    \ can add formulas to your reports to calculate the currency, number, or percent\
    \ fields from an object. The formula feature allows you to leverage your field\
    \ formats, summarize field data, use basic operators, use complex functions, and\
    \ use logic statements.\n\nThe operators for formulas include addition, subtraction,\
    \ multiplication, division, and exponentiation. The functions available include\
    \ logical statements, mathematical statements, or summary statements.\n\n1.  In\
    \ the left pane, drag `Add Formula` into the report and place it in a column position\
    \ of your choice, as shown in Figure [5-64](#437055_1_En_5_Chapter.xhtml#Fig64).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig64_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig64_HTML.jpg)\n\
    \n    Figure 5-64\n\n    Adding a formula field to your report\n\n2.  Name your\
    \ formula.\n\n3.  Add a description.\n\n4.  Adjust the format or decimal place\
    \ if necessary.\n\n5.  Choose what level to run this formula on.\n\n6.  Create\
    \ your formula using the operators or functions necessary.\n\n    **Note** Formulas\
    \ are for the advanced user. We will not be covering the various aspects of what\
    \ formulas to use in this book. However, Salesforce offers free support, and there\
    \ are great forums that can offer help as well.\n\n7.  Click `Check Syntax` for\
    \ complex formulas to ensure there are no errors.\n\n8.  Click `OK` to add the\
    \ formula, as shown in Figure [5-65](#437055_1_En_5_Chapter.xhtml#Fig65).\n\n\
    \    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig65_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig65_HTML.jpg)\n\
    \n    Figure 5-65\n\n    Creating a formula field on your report\n\n9.  The formula\
    \ field appears as a column on the report, as shown in Figure [5-66](#437055_1_En_5_Chapter.xhtml#Fig66).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig66_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig66_HTML.jpg)\n\
    \n    Figure 5-66\n\n    The formula field appears as a column in your report"
