  trans: "\n### 说明\n\nSalesforce 还提供其他相关列表。虽然不在标准页面布局上，但这些列表可以轻松添加到您的页面布局中。一个值得注意的列表是\
    \ `Contact Roles`（联系人角色），它允许您向一个案例记录添加多个联系人。另一个相关列表是 `Emails`（电子邮件），当您启用了“电子邮件转案例”功能时（本章后面会解释），就会用到它。如果在您的电子邮件帐户中正确设置，您的用户就可以留在\
    \ `Salesforce` 内，而无需在两个系统之间来回切换（后续也会介绍）。\n\n### 提示\n\nSalesforce 允许您将不同对象相互关联起来。如果您的\
    \ `Case`（案例）对象需要关联另一个对象的多个记录，您可以创建一个中间对象。例如，如果您想关联一个案例中涉及的多个产品，就可以这样做。创建自定义对象比您想象的要简单。\n\
    \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig4_HTML.jpg](img/437055_1_En_3_Fig4_HTML.jpg)\n\
    \n*图 3-4* 包含标准相关列表的案例布局\n\n## 创建新案例记录\n\n您可以手动输入一个案例，方法是先导航到 `Case`（案例）对象（见图 3-5），然后单击\
    \ `New`（新建）按钮。打开一条记录后，您就可以通过添加联系人姓名、客户名称、优先级、案例来源、类型和案例原因来开始填写案例详情（见图 3-6）。确保在\
    \ `Subject`（主题）和 `Description`（描述）字段中记录客户联系您的原因或解释（图 3-6）。在添加这些详细信息时，如有必要，请使用\
    \ `Internal Comments`（内部备注）字段。如果您为 `Case`（案例）对象创建了自定义字段，请务必培训您的用户如何填写这些详细信息。\n\
    \n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig5_HTML.jpg](img/437055_1_En_3_Fig5_HTML.jpg)\n\
    \n*图 3-5* 如果您尚未进入 `Cases`（案例）选项卡，请使用对象标题旁边的向下箭头导航到 `Cases`（案例）选项卡\n\n建议按照以下步骤创建新的案例记录（图\
    \ 3-6 和 3-7）：\n\n1.  输入联系人姓名，然后单击字段旁的放大镜图标，将联系人关联到案例。\n2.  客户名称将自动分配为您在联系人字段中关联的联系人所对应的客户。\n\
    \n### 提示\n\n`Accounts`（客户）和 `contacts`（联系人）可以禁用为必填字段。\n\n1.  单击优先级字段，更改案例的优先级。从提供的值中选择合适的值。\n\
    2.  单击来源字段，选择案例的来源，再选择合适的值。请注意该字段旁的 `*` 符号。这表示它是必填字段。\n3.  单击类型和案例原因字段，并选择合适的值。\n\
    4.  如有必要，此时适当地填写任何自定义字段。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig6_HTML.jpg](img/437055_1_En_3_Fig6_HTML.jpg)\n\
    \n    *图 3-6* 创建案例（步骤 1 至 6）\n\n5.  输入案例的主题。\n6.  输入案例的描述。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig7_HTML.jpg](img/437055_1_En_3_Fig7_HTML.jpg)\n\
    \n    *图 3-7* 创建案例（步骤 7 和 8）\n\n    **注意** `Subject`（主题）和 `Description`（描述）字段用于“电子邮件转案例”功能。\n\
    \n7.  完成后，单击 `Save`（保存）。\n\n### 提示\n\n利用案例的 `Date/Time Opened`（打开日期/时间）和 `Date/Time\
    \ Closed`（关闭日期/时间）字段，生成关于案例处理时间的报告。此外，案例类型和原因字段有助于定义客户和内部常见问题解答。\n\n## 与团队协作处理案例记录\n\
    \n管理和高效关闭案例可能需要您团队中的多人参与。用户可以使用其案例记录中的案例动态，与团队中的其他人快速沟通。他们还可以向有权访问该案例记录的任何 Salesforce\
    \ 用户发送消息。\n\n要向用户提及一条评论，您可以使用 `@` 符号后跟用户名，一旦名称出现在文本区域下方，就点击该超链接名称。您还会看到，每项操作都会记录在案例动态中，以便完整查看案例及其整个过程中的所有情况。案例记录左侧的动态筛选器可帮助您快速导航到案例的动态相关项目。动态详情将按照从底部最旧到顶部最新的顺序显示。这使您可以快速查看关于该案例的最新对话或已完成的工作。图\
    \ 3-8 展示了案例动态的功能。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig8_HTML.jpg](img/437055_1_En_3_Fig8_HTML.jpg)\n\
    \n*图 3-8* 案例动态\n\n要与您的团队协作，请遵循以下步骤：\n\n1.  单击 `Feed`（动态）选项卡访问案例动态。\n2.  利用发布区域与您的团队就案例进行沟通。\n\
    3.  利用案例动态在整个案例处理期间跟踪所有对话。\n4.  案例动态会捕获对案例状态所做的更改。\n5.  案例动态还跟踪诸如 `Log a Call`（记录通话）活动以及其他常规任务等活动（见图\
    \ 3-9）。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig9_HTML.jpg](img/437055_1_En_3_Fig9_HTML.jpg)\n\
    \n    *图 3-9* 利用动态筛选器快速导航至所有通话记录、案例备注、状态更改以及任务和事件\n\n## 案例自动化\n\nSalesforce 提供自动执行某些功能的能力，例如自动将案例分配给队列或特定用户。Salesforce\
    \ 还允许您创建规则，根据特定条件自动回复与案例相关的客户。您还可以根据条件配置案例升级规则，这些规则将自动将案例分配给升级后的案例。伴随这种案例升级，您可以配置在满足此条件时发送的自动通知。您还可以从电子邮件或网络表单中路由案例。您还可以调整一些支持设置，以进一步自定义您的案例自动化。图\
    \ 3-10 展示了一个案例队列。\n\n![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig10_HTML.jpg](img/437055_1_En_3_Fig10_HTML.jpg)\n\
    \n*图 3-10* 案例队列\n"
- fmt: "## Creating Case Queues\n\nA case can be sent to a queue in many ways. You\
    \ can automatically assign a case to a queue when it created or throughout the\
    \ life of the case because a change to the case record can send it to a queue.\
    \ You can think of a queue as a holding tank. This holding tank will allow you\
    \ to give multiple users access to it and give them the option of accepting new\
    \ cases. Instead of assigning a case to a specific owner, you can assign it to\
    \ a queue using the case assignment rules. In Figures `[3-11]` through `[3-14]`,\
    \ you’ll learn how to create a queue in `Salesforce`. The steps are as follows:\n\
    \n1.  Navigate to the `Setup` menu by clicking the settings cog icon in the upper-right\
    \ corner of the `Salesforce` window.\n2.  Using your search area, enter `Queue`.\
    \ Click `Queues` under `Users`.\n3.  Click the `New` button.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig11_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig11_HTML.jpg)\n\
    \n    Figure 3-11\n    Creating a case queue\n\n4.  Create a user-facing label\
    \ for the queue and hit your `Tab` key. `Salesforce` will create the queue name.\n\
    5.  Put an email address in the `Queue Email` field if you want to receive a notification\
    \ that a new case was added to the queue.\n6.  Select the box `Send Email to Members`\
    \ if you want the users assigned to that queue to receive an email when a new\
    \ case arrives in the queue.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig12_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig12_HTML.jpg)\n\
    \n    Figure 3-12\n    Naming your queue and setting notification options\n\n\
    7.  Select the `Case` object and click the arrow to move it to the `Selected Objects`\
    \ section.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig13_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig13_HTML.jpg)\n\
    \n    Figure 3-13\n    Selecting the object for your queue\n\n8.  Using the search\
    \ area, select in the drop-down whether you want to search for a specific user,\
    \ public group, role, or role and subordinates.\n\n    **Note:** Selecting the\
    \ option `Roles and Subordinates` gives access to the specific queue to a specific\
    \ role and all that fall under the role. For instance, if your `CEO` sits at the\
    \ top of your role hierarchy and you give the `CEO` access using this function,\
    \ it gives all below the `CEO` role access as well.\n\n9.  Select the specific\
    \ user, public group, role, or role and subordinates and use the right-facing\
    \ arrow to move it into the `Selected Members` area.\n10. Click `Save`.\n\n  \
    \  ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig14_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig14_HTML.jpg)\n\
    \n    Figure 3-14\n    Select the users, groups, roles, or roles that need to\
    \ have access to this queue.\n\n### Tip\n\n`Queues` can be used for more than\
    \ just cases. You can set up lead queues and set up lead assignment rules just\
    \ like you can on cases.\n\n## Creating Case Assignment Rules\n\nNow that you\
    \ have created your first queue, it’s time to automatically assign cases to that\
    \ queue or to a specific owner. You can create case assignment rules based on\
    \ specific criteria in the case and related records to the case. For instance,\
    \ you can create an assignment rule to automatically assign all cases that came\
    \ in for a specific account or contact to a specific user. Or you can assign a\
    \ case to a queue based on the case origin, case reason, case type, or any other\
    \ field found in the case record. Some companies create queues for `VIP` or platinum\
    \ clients and only allow their most experienced users to handle these cases. Figures\
    \ `[3-15]` through `[3-20]` show you this process. The step-by-step process is\
    \ as follows:\n\n1.  Navigate to the `Setup` menu by clicking the settings cog\
    \ icon in the upper-right corner of the `Salesforce` window.\n2.  Using your search\
    \ area, enter `Case Assignment`. Click `Case Assignment` under `Service`.\n3.\
    \  Click `New` to start the case assignment rule.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig15_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig15_HTML.jpg)\n\
    \n    Figure 3-15\n    Accessing case assignment rules\n\n4.  Name the rule and\
    \ click `Save`. You can activate the rule now by checking the `Active` check box\
    \ or hold off and activate it later.\n5.  Click `Save`.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig16_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig16_HTML.jpg)\n\
    \n    Figure 3-16\n    Creating a case assignment name and activating it\n\n \
    \   After saving the rule name, it will return you to the case assignment area.\
    \ Click the rule name you just created.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig17_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig17_HTML.jpg)\n\
    \n    Figure 3-17\n    Retrieving your case assignment rule\n\n6.  Click the `New`\
    \ button.\n\n    **Note:** In Figure `[3-18]` notice the `Active` box above `Modified\
    \ By`. This is where you will activate the rule after you have completed it using\
    \ the `Active` check box.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig18_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig18_HTML.jpg)\n\
    \n    Figure 3-18\n    Creating the rule criteria for your case assignment\n\n\
    7.  If this is your first case rule assignment, type the number `1` into the `Sort\
    \ Order` field. If you have configured many rules, the `Sort Order` field tells\
    \ `Salesforce` which rules to run first. Once a rule runs and assigns the case,\
    \ it will not run other rules on the same case. Assign the sorting to all your\
    \ rules according to importance.\n8.  In step 2 you create the rule criteria.\
    \ The rule criteria tells `Salesforce` that if the criteria you enter here is\
    \ true, then it assigns the case to the specified location (steps 9 and 10).\n\
    \n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig19_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig19_HTML.jpg)\n\
    \n    Figure 3-19\n    Setting up the field criteria for the case assignment rule\n\
    \n    a.  To start this process, you’ll first need to click `None` in the field\
    \ column. Here you will select the field that `Salesforce` should evaluate for\
    \ the rule. This can be the case type, case reason, case origin, account, contact\
    \ information, or any field criteria found in the case, account, or contact.\n\
    \    b.  Choose the appropriate operator. For instance, if you want every case\
    \ type that equals a specific value to be auto-assigned to specific users, you\
    \ would choose the operator `equals` and select those values.\n    c.  Choose\
    \ or enter the appropriate value or outcome in which the case will auto-assign.\n\
    \    d.  You can also configure your filter logic by clicking `Add Filter Logic`.\
    \ This allows you to change the logic from being `all` the field criteria (using\
    \ `and`) to `or`. For example, you can say if the case type is `Problem` OR the\
    \ case origin is `Email`. The standard setup would make that logic sentence be:\
    \ \"If the case type is `Problem` AND the case origin is `Email`.\"\n\n9.  Choose\
    \ to assign the case to a specific user or to the queue you set up in the previous\
    \ section.\n10. Select an email template that you would like to autosend to the\
    \ user or queue.\n11. Click `Save` or click `Save and New` to set up another case\
    \ assignment.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig20_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig20_HTML.jpg)\n\
    \n    Figure 3-20\n    Assigning the specific user or queue and send them a notification\n\
    \n### Note\n\nStep 4 provides a functionality that is not a `Lightning` component\
    \ and would have to be set up in `Classic`."
