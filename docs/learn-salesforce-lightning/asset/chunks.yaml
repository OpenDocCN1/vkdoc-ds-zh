- fmt: "### Setting Up Web-to-Case\n\nThe web-to-case function in Salesforce allows\
    \ you to embed HTML code into your preexisting web site or web form. The majority\
    \ of clients that have used this function embed the HTML code into a Contact Us\
    \ form found on support-related web pages on their web sites. This function, like\
    \ that of the email-to-case function, allows automatically generated cases to\
    \ make it into Salesforce. Follow the steps shown in Figures [3-43](#437055_1_En_3_Chapter.xhtml#Fig43)\
    \ through 3-48.\n\n1.  Navigate to the Setup menu by clicking the settings cog\
    \ icon in the upper-right corner of the Salesforce window.\n2.  Using your search\
    \ area, enter **Web-to-case**. Click Web-to-Case under Service.\n3.  The check\
    \ box Enable Web-to-Case should be select, as shown in Figure [3-43](#437055_1_En_3_Chapter.xhtml#Fig43).\n\
    4.  Set the default Case Origin option to Web or any other option that describes\
    \ where this case is coming from.\n5.  Attach a response template that you want\
    \ your client to receive upon submitting their case.\n6.  Hide Record Information\
    \ will hide the record information in the email that is sent.\n\n    **Note** If\
    \ you want to create an email template for this, go to Setup, search for `Email\
    \ Template`, and under the Email section you’ll find `Email Template`.\n\n7. \
    \ Add an email signature if you choose to otherwise create it in the email template.\n\
    8.  Click Save.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig43_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig43_HTML.jpg)\n\
    \n    Figure 3-43\n\n    Creating the web-to-case function\n\nNow that you have\
    \ enabled the function, you can generate the HTML code to embed on your web site.\
    \ Figures [3-44](#437055_1_En_3_Chapter.xhtml#Fig44) through [3-45](#437055_1_En_3_Chapter.xhtml#Fig45)\
    \ show you how it’s done.\n\n1.  On the left side in the Setup menu you should\
    \ see Web-to-Case HTML Genera…. If not, you can search for `web-to-case HTML`.\
    \ Click the phrase.\n2.  In the Available Fields area, select fields to be included\
    \ on your web form.\n3.  Move the field from Available Fields to Selected.\n4.\
    \  In the URL field, enter the URL that you want your client to be returned to\
    \ after submitting their web form.\n5.  The Enable Spam Filtering option will\
    \ require the Captcha API key to be created (this requires developer work and\
    \ will not be explained in this book). To set this up, you’ll need to navigate\
    \ to Salesforce Classic.\n6.  Click the Generate button.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig44_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig44_HTML.jpg)\n\
    \n    Figure 3-44\n\n    Setting up the web-to-case HTML generator\n\n7.  Copy\
    \ this HTML code and send it to your web site manager.\n8.  Click Finished when\
    \ done.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig45_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig45_HTML.jpg)\n\
    \n    Figure 3-45\n\n    The HTML that is generated\n\n## Summary\n\nWith Salesforce\
    \ Service Cloud, you can tailor the experience to your organization’s needs or\
    \ utilize the great standard functionalities that come with your purchase. Whichever\
    \ path you choose, you can assure yourself that setup is the least of your worries.\n\
    \n# 4. Lightning Apps\n\nThe AppExchange marketplace comprises a suite of apps,\
    \ Lightning components, and consulting resources. Salesforce customers can install\
    \ add-on applications to their Salesforce organization. You can search across\
    \ thousands of apps to find prebuilt solutions for business needs. The marketplace\
    \ is also the place to search across thousands of registered Salesforce consultants\
    \ (shown in Figure [4-1](#437055_1_En_4_Chapter.xhtml#Fig1)).\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig1_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1\n\nBlaze new trails with the AppExchange\n\n## Apps\n\nIncrease productivity\
    \ by installing prebuilt packages, called *apps*, which provide custom solutions\
    \ for every role and industry. Visit the AppExchange web site at [http://appexchange.salesforce.com](http://appexchange.salesforce.com).\
    \ Here you can sort and filter in numerous ways including by popularity and rating.\n\
    \nTo pick the right app, we recommend identifying your business challenges, budget,\
    \ and time frame.\n\n### Discover the AppExchange Marketplace\n\nYou should take\
    \ the time to explore the business app store in Salesforce, otherwise known as\
    \ the AppExchange marketplace. There are more than 3,000 apps and components that\
    \ can be used to extend the power of Salesforce. Follow these steps:\n\n1.  From\
    \ the App Launcher, click Visit AppExchange, as shown in Figure [4-2](#437055_1_En_4_Chapter.xhtml#Fig2).\
    \ Or, from Setup, search for `AppExchange marketplace` in the Quick Find area.\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig2_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig2_HTML.jpg)\n\
    \n    Figure 4-2\n\n    Visit the AppExchange from the App Launcher\n\n2.  Click\
    \ AppExchange Website, as shown in Figure [4-3](#437055_1_En_4_Chapter.xhtml#Fig3).\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig3_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig3_HTML.jpg)\n\
    \n    Figure 4-3\n\n    Click AppExchange Website to navigate to the complete\
    \ database of apps and components\n\nThis marketplace contains apps and components\
    \ for end users to install and download into their Salesforce organization. In\
    \ addition, you have access to thousands of reviews about these apps, components,\
    \ and consultants. It’s complete transparency at your fingertips.\n\nOn your home\
    \ page, shown in Figure [4-4](#437055_1_En_4_Chapter.xhtml#Fig4), apps can be\
    \ searched and filtered by various categories. You’ll find a wide array of apps!\
    \ They range from point solutions to full-blown integration and automation. There\
    \ are free apps, and there are paid apps. The good news is that Salesforce makes\
    \ it easy to find what you are looking for.\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig4_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4\n\nThe AppExchange home page\n\n#### Choose an App\n\nChoosing the\
    \ right app can seem overwhelming with the number of solutions available. So,\
    \ it’s important to have a strategy in this decision-making process.\n\n1.  Start\
    \ by defining your business challenges. Identify your company goals and objectives.\
    \ Once you’ve determined what they are, search and review a handful of solution\
    \ options in the Salesforce marketplace.\n2.  Once you’ve narrowed down a handful\
    \ of prospective solutions, evaluate the solutions and vendors. Consider the ease\
    \ of use, support options, total cost, reviews, the ease of administration, and\
    \ solution match. Use this information to help make a decision.\n3.  If available,\
    \ request a demo or trial, or install the app into your sandbox for user testing\
    \ and acceptance.\n\n### Price\n\nOne important factor is cost. There are apps\
    \ in Salesforce that are free, but there are others that have a cost associated\
    \ with them. While some apps display their total cost, others require you to contact\
    \ them to find out the price. Some of these payment options can be monthly, annually,\
    \ per user, or per organization.\n\n### Compatibility\n\nMake sure to check the\
    \ compatibility of the solution. You can find the compatibility information in\
    \ the details section of the app under Requirements and Other System Requirements\
    \ (shown in Figure [4-5](#437055_1_En_4_Chapter.xhtml#Fig5)).\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig5_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig5_HTML.jpg)\n\
    \nFigure 4-5\n\nRequirements and Other System Requirements sections in the app\
    \ details"
