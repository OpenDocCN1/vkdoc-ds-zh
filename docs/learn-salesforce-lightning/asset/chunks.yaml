    \  \n\n美国国会图书馆控制号：2017962634  \n\n© Felicia Duarte, Rachelle Hoffman 2018  \n\n\
    本作品受版权保护。出版商保留所有权利，无论涉及材料的全部或部分，特别是翻译、重印、重新使用插图、朗诵、广播、以缩微胶卷或任何其他物理方式复制，以及信息存储与检索的传输或电子改编、计算机软件，或采用目前已知或今后开发的类似或不同方法。\
    \  \n\n本书中可能出现商标名称、标识和图像。我们并未在每次出现商标名称、标识或图像时使用商标符号，而是仅以编辑方式使用这些名称、标识和图像，以维护商标所有者的利益，且无意侵犯商标权。本出版物中使用商品名称、商标、服务标志及类似术语，即使未明确标识为商标，也不应被视为对其是否受所有权保护的立场表达。\
    \  \n\n尽管本书中的建议和信息在出版时被视为真实准确，但作者、编辑和出版商均不对可能存在的任何错误或遗漏承担法律责任。出版商对本书所含内容不作任何明示或暗示的担保。\
    \  \n\n印刷于无酸纸上  \n\n由 Springer Science+Business Media New York 向全球图书贸易发行，地址：233\
    \ Spring Street, 6th Floor, New York, NY 10013。电话：1-800-SPRINGER，传真：(201) 348-4505，电子邮件：`orders-ny@springer-sbm.com`，或访问\
    \ `www.springeronline.com`。  \n\nApress Media, LLC 是一家加利福尼亚州有限责任公司，其唯一成员（所有者）为\
    \ Springer Science + Business Media Finance Inc (SSBM Finance Inc)。SSBM Finance\
    \ Inc 是一家特拉华州公司。  \n\n## 前言\n\n两年前，我们推出了 Salesforce Lightning。这是一项（说实话，现在依然是）大胆的创举。\
    \  \n\n我们推出 Lightning 的使命是彻底重塑 Salesforce，提供全新的现代化用户体验，为客户关系管理（CRM）树立新标准，并全部构建在一个全新、强大且可扩展的企业级应用框架之上。我们希望让\
    \ Salesforce 更易于使用、更直观，并拥有几乎无限的发展潜力。同时，我们希望赋能社区中的每一个人（包括开拓者、管理员、客户、合作伙伴以及我们的员工）发挥最佳水平。\
    \  \n\n自推出 Lightning 以来，我们见证了社区前所未有的热情，这是我在企业软件领域从未见过的景象。令人叹为观止。  \n\nLightning\
    \ 最棒的一点是，它帮助我们更快地创新。每一次发布，我们都在扩展 Lightning 的规模和范围，实现的成果远超我的想象。  \n\n仅在推出两年后，我们就做到了以下几点：\
    \  \n\n*   通过 Sales Cloud Lightning 重新定义了现代销售周期  \n*   通过 Service Cloud Lightning\
    \ 重新构想了现代联络中心  \n*   优化导航，使在 Salesforce 应用之间切换更便捷  \n*   通过无代码框架赋能管理员和开拓者，使他们能够轻松为组织自定义\
    \ Salesforce 用户界面（UI）  \n*   帮助超过 10 万名客户部署 Lightning  \n*   通过来自 DocuSign、Evernote\
    \ 和 FinancialForce 等合作伙伴的 1000 多个可直接拖放到 Salesforce 的 Lightning 就绪应用，激发了生态系统新的创造力和动力\
    \  \n*   创造了以前无法实现的全新产品，例如 Salesforce Einstein（一款面向 CRM 的人工智能产品）和 Lightning Bolt（为\
    \ Community Cloud 提供行业特定门户）  \n*   赋能无数销售人员、服务专员和营销专业人士，让他们能够以更快速、更智能且更符合自身需求的方式进行销售、服务和营销\
    \  \n\n每天，我们的社区都会给我们反馈——有时是积极的，有时是批评性的，但始终是建设性的。每天，我们整个产品团队（包括我在内）都会仔细研究这些反馈，它帮助我们不断进步。正因有了大家，Lightning\
    \ 才成为今天的 Lightning。所以，感谢大家为帮助我们使 Salesforce 和 Lightning 随着每一次发布变得更好而付出的一切。  \n\
    \nLightning 是 Salesforce 的未来。那么，请系好安全带，因为我们才刚刚起步。  \n\n*迈克·罗森鲍姆*  \n\n## 引言\n\n\
    > *“让业务更快运行。”*  \n> ——Cloud Creations  \n\n正如我们公司的标语所言，我们相信您可以借助 Salesforce Lightning“让业务更快运行”。我们撰写本书，旨在以清晰直观的方式提供关于创新的\
    \ Lightning Experience 的培训。作为一家 Salesforce 咨询公司的高管，我们深知其他组织在用户接受新体验方面所面临的挑战。我们希望提供易于理解、带有真实案例的材料，助力管理员和用户取得成功。\
    \  \n\n《学习 Salesforce Lightning》是一本循序渐进的视觉指南，为 Lightning 中包含的新 UI 工具集提供即时且宝贵的解决方案。\
    \  \n\n您将学习以下内容：  \n\n*   浏览 Salesforce Lightning Experience  \n*   从 Salesforce\
    \ Classic 迁移到 Lightning  \n*   进行自定义  \n*   配置动态报告和仪表板  \n*   使用 Process Builder\
    \ 构建逻辑以实现系统自动化  \n*   管理您的数据和安全  \n*   以及更多内容  \n\n本书适合 Salesforce 管理员、业务用户、开发人员和\
    \ IT 人员。我们的目标是帮助您顺利上手市场上最具创新性、速度最快的客户关系管理（CRM）解决方案之一：Salesforce Lightning。  \n\
    \n## 致谢\n\n我要感谢所有帮助完成本书的人。没有他们的努力和支持，我们不可能成功完成这项工作。  \n\n感谢我们的编辑 Susan 和 Rita，感谢她们的努力、时间和耐心。感谢你们给予的这次机会以及所有的帮助。\
    \  \n\n感谢技术审稿人 Phil Weinmeister 的知识和专长。  \n\n感谢 Justin Davis 在整个过程中的支持和指导。  \n\
    \n最重要的是，我想将本书献给我的孩子，Michael Frank 和 Ayden James。不要放弃。总有东西可以学习。  \n\n> ——费莉西亚·杜阿尔特\
    \  \n\n### 关于作者与关于技术审稿人  \n\n### 关于作者  \n\n### 关于技术审稿人  \n\n# 1. 介绍 Salesforce\
    \ Lightning  \n\nSalesforce 目前是用于业务管理的排名第一的客户关系管理（CRM）解决方案。通过提供强大的平台和突破性技术，Salesforce\
    \ 为销售、服务和市场营销部门提供解决方案。Lightning Experience 提供了一个新的用户界面，该界面具有更快的平台、动态功能和增强的美学效果。企业报告称，转向\
    \ Lightning 后，成交率提高、协作增强、生产力提升且报告速度加快（见图 1-1）。  \n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig1_HTML.jpg](img/437055_1_En_1_Fig1_HTML.jpg)\
    \  \n\n图 1-1：Salesforce Lightning Experience\n"
- fmt: "# Lightning Pages\n\nThe Lightning pages focus attention on what matters most.\
    \ Important information is displayed “above the fold,” or positioned at the top\
    \ half of the screen, so users can view key points quicker.\n\nAdditionally, layouts\
    \ are consistent and easy to navigate. See the comparison of an account record\
    \ in Classic (see Figure [1-2](#437055_1_En_1_Chapter.xhtml#Fig2)) versus the\
    \ same record in Lightning (Figure [1-3](#437055_1_En_1_Chapter.xhtml#Fig3)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig3_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3: Salesforce account record in the Lightning Experience\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig2_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2: Salesforce account record in Salesforce Classic\n\n# Migrate to\
    \ Lightning Experience\n\nMigrating to the Salesforce Lightning Experience is\
    \ straightforward. The following steps describe how to access the Migration Assistant.\
    \ The Migration Assistant will check your organization’s readiness for Lightning\
    \ and walk you through a series of steps to enable Lightning for your organization.\
    \ This is a great first step on your Lightning journey.\n\n> **Note:** These steps\
    \ are not required but highly encouraged. Salesforce has spent considerable time\
    \ thinking through potential migration pitfalls and has tried to address them\
    \ within the Migration Assistant.\n\n## Migration Assistant\n\nFollow these steps:\n\
    \n1. In Classic, select `Setup` (see Figure [1-4](#437055_1_En_1_Chapter.xhtml#Fig4)).\n\
    \   \n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig4_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig4_HTML.jpg)\n\
    \   \n   Figure 1-4: Setup area in Salesforce Classic\n\n2. From the `Setup` menu,\
    \ click the `Get Started` button (see Figure [1-5](#437055_1_En_1_Chapter.xhtml#Fig5)).\n\
    \   \n   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig5_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig5_HTML.jpg)\n\
    \   \n   Figure 1-5: Get Started button in Setup\n\n3. From here, you have three\
    \ available resources to learn more about the Lightning Experience. You can select\
    \ from the options in Figure [1-6](#437055_1_En_1_Chapter.xhtml#Fig6).\n   \n\
    \   ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig6_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig6_HTML.jpg)\n\
    \   \n   Figure 1-6: Learning resources for Salesforce Lightning\n\n4. Click `Next\
    \ Step` to get started.\n\n### Check Readiness\n\nTo get started, Salesforce will\
    \ request access to your organization to analyze your current setup (Figure [1-7](#437055_1_En_1_Chapter.xhtml#Fig7)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig7_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig7_HTML.jpg)\n\
    \nFigure 1-7: Allowing access to Lightning Readiness\n\nOnce you click `Allow`,\
    \ shown in Figure [1-7](#437055_1_En_1_Chapter.xhtml#Fig7), you must select which\
    \ Salesforce product you want to access (see Figure [1-8](#437055_1_En_1_Chapter.xhtml#Fig8)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig8_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig8_HTML.jpg)\n\
    \nFigure 1-8: Product selection to check for Lightning Readiness\n\nSelect the\
    \ appropriate Salesforce product and click `Check Readiness`. Salesforce will\
    \ analyze your current setup and email a readiness report (see Figure [1-9](#437055_1_En_1_Chapter.xhtml#Fig9)).\
    \ New organizations can skip this step.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig9_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig9_HTML.jpg)\n\
    \nFigure 1-9: Lightning migration options\n\n### Preview\n\nYou can preview how\
    \ your organization works in the Lightning environment. This is a great feature\
    \ to test any issues that may have been brought up in your readiness report. If\
    \ you encounter any issues in this switch, you can make changes on the spot. To\
    \ test this, navigate to the `Preview` tab and click `Preview`, as shown in Figure\
    \ [1-10](#437055_1_En_1_Chapter.xhtml#Fig10).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig10_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig10_HTML.jpg)\n\
    \nFigure 1-10: Preview tab in the Migration Assistant\n\nAs you can see in Figure\
    \ [1-11](#437055_1_En_1_Chapter.xhtml#Fig11), you are instantly switched to Lightning\
    \ in Preview mode.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig11_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig11_HTML.jpg)\n\
    \nFigure 1-11: Lightning Experience in Preview mode\n\n### Optimize with Features\n\
    \nFor the complete experience of Lightning, take a look at some of the new features\
    \ made available. This includes a new feature for news, options to enable activities\
    \ and notes, and more. Navigate to this tab, and click `Optimize with Features`\
    \ to enable/disable the Lightning features found in Figure [1-12](#437055_1_En_1_Chapter.xhtml#Fig12).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig12_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig12_HTML.jpg)\n\
    \nFigure 1-12: Lightning features to enable\n\nYou can enable the following options:\n\
    \n* Click `Set Up My Domain` to create a URL that is reflective of your company’s\
    \ brand. This will add a subdomain to your Salesforce organization URL. Use this\
    \ feature to increase the login and authentication process.\n* Click `Set Up Shared\
    \ Activities` to allow users to relate multiple contacts to an individual activity.\n\
    * Enable `News` to display relevant news article about your accounts and their\
    \ industries. This information is pulled by accounts listed in your organization.\n\
    * Enable `Social Accounts`, `Contacts`, and `Leads` to allow users to connect\
    \ better with your accounts by syncing social media accounts.\n* Enable `Notes`\
    \ to utilize the enhanced version of notes that includes automatic saving in edit\
    \ mode, an option to add images, and share features.\n\n### Set Up Users\n\nYou\
    \ can control who has access to the Lightning Experience. You can choose to roll\
    \ this out to groups of users, individual users, or all users.\n\n> **Note:**\
    \ Standard profile users have access to Lightning by default, while custom profile\
    \ users do not. Click `Learn How` to change these settings.\n\nNavigate to the\
    \ `Set up Users` tab shown in Figure [1-13](#437055_1_En_1_Chapter.xhtml#Fig13)\
    \ to fine-tune this experience and select which users make the switch.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig13_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig13_HTML.jpg)\n\
    \nFigure 1-13: User setup\n\nFollow these steps to switch users:\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig14_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig14_HTML.jpg)\n\
    \nFigure 1-14: Selecting users to migrate to Lightning\n\n1. Click `Switch Users`.\n\
    2. Select appropriate users by clicking the `+` next to their name (Figure [1-14](#437055_1_En_1_Chapter.xhtml#Fig14)).\n\
    3. Click `Save`.\n\n#### Rollout Approach\n\nExecute a rollout strategy that works\
    \ best for your company. For larger organizations, it is recommended that you\
    \ have a phased rollout approach. This approach is advantageous when migrating\
    \ large organizations and complex setups. There are a few benefits to this approach,\
    \ including the following:\n\n* This approach allows you to conduct user acceptance\
    \ testing. Use this to identify any challenges or issues with the new experience.\
    \ You can collect feedback from your users and fine-tune changes before executing\
    \ to the entire organization.\n* Make progress on your implementation by breaking\
    \ this up into pieces. This ensures that progress is being made while staying\
    \ on top of new features and changes.\n\nThe suggested rollout approach starts\
    \ with new users, a pilot group of users, and lastly all users."
  raw: "## Lightning Pages\n\nThe Lightning pages focus attention on what matters\
