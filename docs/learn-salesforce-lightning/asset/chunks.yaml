    \ Permission in Setup and click Permission Set.\n\n2.  Click the New button to\
    \ create a new permission set, as shown in Figure [9-14](#437055_1_En_9_Chapter.xhtml#Fig14).\n\
    \n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig14_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig14_HTML.jpg)\n\
    \n    Figure 9-14\n\n    Permission Sets home page\n\n3.  Enter the name of your\
    \ permission set in the Label field and provide a detailed description, as shown\
    \ in Figure [9-15](#437055_1_En_9_Chapter.xhtml#Fig15).\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig15_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig15_HTML.jpg)\n\
    \n    Figure 9-15\n\n    Steps to create a permission step\n\n4.  Choose the type\
    \ of user who will use this permission set .\n\n### Tip\n\nIt is best practice\
    \ to give your permission set a description. This makes it easier to find when\
    \ many permission sets exist.\n\n## Record-Level Security\n\nRecord-level security\
    \ specifies what records a user has access to view and edit in each object .\n\
    \n### Record Ownership\n\nEach record in Salesforce must have an owner. This can\
    \ be either a user or a queue. By default, the owner of a record has full access\
    \ capabilities. This means they can view, edit, delete, transfer, and share the\
    \ record.\n\n## Organization-wide Defaults\n\nBy default, your Salesforce organization\
    \ operates in a public sharing model. We refer to this as the *organization-wide\
    \ defaults* (OWDs). This means that all users have access to see and edit all\
    \ data on a per-object basis, provided they have the appropriate object-level\
    \ security. To limit visibility for certain records, consider operating in a private\
    \ sharing model for that object.\n\n### Private or Public?\n\nWhen considering\
    \ to go private or public on an object , consider this: are there any elements\
    \ of your data that should be restricted to any particular user?\n\nIf the answer\
    \ is yes, you should be operating in a private sharing model for that object.\n\
    \nAs shown earlier in Figure [9-2](#437055_1_En_9_Chapter.xhtml#Fig2), the organization-wide\
    \ default has the highest level of restriction. This is the only security component\
    \ that restricts access.\n\nAll other security components are designed to share\
    \ access. Record access can be opened up to specific users or groups of users\
    \ through roles, manual sharing, and sharing rules."
  trans: "\n## 对象级安全\n\n对象级安全存储在配置文件的 `对象权限` 部分。作为起点，用户必须对某个对象拥有适当的访问级别，才能查看该对象及其中的记录。您可以在配置文件中控制对象级安全，如图\
    \ 9-3 所示。\n\n以下是用于设置用户对每个对象访问级别的不同权限类型：\n\n- **`读取`**：用户可以查看记录。\n- **`创建`**：用户可以创建记录。\n\
    - **`编辑`**：用户可以读取和编辑此对象中存储的记录。\n- **`删除`**：用户有权读取、编辑和删除记录。\n- **`查看全部`**：用户可以查看此对象中存储的所有记录。\n\
    - **`修改全部`**：用户可以修改此对象中存储的所有记录。\n\n为标准对象和自定义对象设置 `对象级安全`。定义配置文件应具有 `读取`、`创建`、`编辑`、`删除`、`查看全部`\
    \ 或 `修改全部` 权限，如图 9-9 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig9_HTML.jpg](img/437055_1_En_9_Fig9_HTML.jpg)\n\
    \n**图 9-9** — 设置对象级安全\n\n## 密码策略、登录时段和 IP 范围\n\n您可以指定密码过期时间、密码要求、会话超时等。您还可以控制每个配置文件的登录时段和可接受的\
    \ IP 范围。\n\n## 分配配置文件\n\n共有六种不同类型的标准配置文件：\n\n- **`系统管理员`**：将此配置文件分配给需要访问许可证内所有功能的用户。此配置文件拥有查看和修改所有数据的权限。\n\
    - **`标准用户`**：此配置文件具有核心平台功能。他们可以查看、编辑和删除其有权访问的记录。\n- **`解决方案经理`**：此配置文件拥有与 `标准用户`\
    \ 相同的功能，并增加了管理已发布解决方案的权限。\n- **`营销用户`**：此配置文件拥有与 `标准用户` 相同的功能，并增加了导入潜在客户、管理营销活动和管理沟通模板的权限。\n\
    - **`合同经理`**：此配置文件拥有与 `标准用户` 相同的功能，并增加了管理和审批合同的权限。\n- **`只读`**：此配置文件只能查看其有权访问的记录，并运行报告和导出数据。\n\
    \n## 创建自定义配置文件\n\n创建自定义配置文件，为不同的用户组构建一套独特的权限集。请按照以下步骤创建自定义配置文件：\n\n1. 从 `设置` 菜单中搜索并选择\
    \ `配置文件`（如图 9-10 所示）。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig10_HTML.jpg](img/437055_1_En_9_Fig10_HTML.jpg)\n\
    \   **图 9-10** — 在 Salesforce 中导航到 `配置文件`\n\n2. 要创建新配置文件，请单击 `新建配置文件`，如图 9-11\
    \ 所示。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig11_HTML.jpg](img/437055_1_En_9_Fig11_HTML.jpg)\n\
    \   **图 9-11** — 配置文件主页上的 `新建配置文件` 按钮\n\n3. 要创建自定义配置文件，您必须从现有的标准配置文件克隆一个。选择一个要克隆的标准配置文件，然后单击\
    \ `克隆`。\n\n4. 输入新配置文件的名称，然后单击 `保存`，如图 9-12 所示。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig12_HTML.jpg](img/437055_1_En_9_Fig12_HTML.jpg)\n\
    \   **图 9-12** — 命名您的自定义配置文件\n\n要完成对此配置文件查看和操作权限的更改，请单击配置文件名称旁边的 `编辑`。根据您的新配置文件修改相应的权限，如图\
    \ 9-13 所示。\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig13_HTML.jpg](img/437055_1_En_9_Fig13_HTML.jpg)\n\
    \n**图 9-13** — 配置文件主页\n\n> **注意**：所有用户都必须有一个分配的配置文件，并且配置文件可以分配给多个用户。但是，每个用户只能分配一个配置文件。\n\
    >\n> 那么，当您需要向单个用户授予额外权限时，该怎么办？\n>\n> 例如，假设您想将 `创建报告` 权限扩展到单个用户。我们建议创建权限集，而不是创建新配置文件或编辑现有配置文件上的权限。\n\
    \n## 权限集\n\n权限集是一组权限和设置，可以分配给需要的用户。\n\n请按照以下步骤创建权限集：\n\n1. 在 `设置` 中搜索 `权限`，然后单击\
    \ `权限集`。\n\n2. 单击 `新建` 按钮创建新的权限集，如图 9-14 所示。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig14_HTML.jpg](img/437055_1_En_9_Fig14_HTML.jpg)\n\
    \   **图 9-14** — 权限集主页\n\n3. 在 `标签` 字段中输入权限集名称，并提供详细描述，如图 9-15 所示。\n   ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig15_HTML.jpg](img/437055_1_En_9_Fig15_HTML.jpg)\n\
    \   **图 9-15** — 创建权限集的步骤\n\n4. 选择将使用此权限集的用户类型。\n\n> **提示**：最佳实践是为您的权限集添加描述。当存在多个权限集时，这使其更易于查找。\n\
    \n## 记录级安全\n\n记录级安全指定用户在每个对象中可以查看和编辑哪些记录。\n\n### 记录所有权\n\nSalesforce 中的每条记录都必须有一个所有者。所有者可以是用户或队列。默认情况下，记录所有者拥有完全访问权限。这意味着他们可以查看、编辑、删除、转移和共享记录。\n\
    \n## 组织范围默认值\n\n默认情况下，您的 Salesforce 组织以公共共享模型运行。我们称之为*组织范围默认值*（OWD）。这意味着，只要用户具有适当的对象级安全，他们就可以按对象查看和编辑所有数据。要限制某些记录的可见性，请考虑对该对象使用私有共享模型。\n\
    \n### 私有还是公共？\n\n在考虑对某个对象使用私有还是公共模式时，请思考：您的数据中是否有任何部分应限制给特定用户？\n\n如果答案是肯定的，那么您应该对该对象使用私有共享模型。\n\
    \n如前文图 9-2 所示，组织范围默认值具有最高级别的限制。这是唯一限制访问的安全组件。\n\n所有其他安全组件都旨在共享访问权限。通过角色、手动共享和共享规则，可以将记录访问权限开放给特定用户或用户组。\n"
- fmt: "### Change Sharing Settings\n\nTo modify your organization-wide defaults,\
    \ navigate to `Sharing Settings` in `Setup`.\n\nTo control the sharing settings\
    \ for external users, you must first enable external sharing. Select `Sharing\
    \ Settings` in the `Setup` area’s `Quick Find`, and click `Enable External Sharing`.\n\
    \nFrom here, you can view the level of access both internally and externally by\
    \ object, as shown in Figure [9-16](#437055_1_En_9_Chapter.xhtml#Fig16).\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig16_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig16_HTML.jpg)\n\
    \nFigure 9-16\n\nDefault organization-wide settings\n\nExternal users include\
    \ community users, guest users, web site users, `Chatter` external users, and\
    \ portal users. You can split the sharing settings for each object for internal\
    \ and external users.\n\nSelect `Edit` to change the settings to any of these\
    \ options:\n\n*   `Private`: All records in this object are private and can be\
    \ visible only to the record owner, role, or sharing rule.\n*   `Public Read Only`:\
    \ All records in this object are visible as read-only records.\n*   `Public Read/Write\
    \ Only`: All records in this object are visible and can be modified by all users.\n\
    *   `Public Read/Write/Transfer`: All records in this object are visible and can\
    \ be modified and transferred by all users.\n*   `Controlled by Parent`: Users\
    \ have the same level of access on the detail of a master-detail relationship.\n\
    \nSelect `Standard Report Visibility` to enable visibility to data in reports\
    \ that may not be accessible because of organization-wide defaults.\n\nSelect\
    \ `Manual User Record Sharing` to allow users to manually share a record to additional\
    \ users.\n\nSelect `Manager Groups` to allow users to share records with their\
    \ manager groups, as shown in Figure [9-17](#437055_1_En_9_Chapter.xhtml#Fig17).\n\
    \n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig17_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig17_HTML.jpg)\n\
    \nFigure 9-17\n\nAdditional security settings\n\n## Role Hierarchies\n\nOnce OWDs\
    \ are in place to restrict data, you can use role hierarchies to open up visibility\
    \ and share record access. Roles define the level of access a user or groups of\
    \ users have from the top down. Record access rolls up through the hierarchy.\n\
    \nAs an example, create a branch under `Sales Managers` called `Sales Reps` to\
    \ give sales managers access to the sales reps beneath them, as shown in Figure\
    \ [9-18](#437055_1_En_9_Chapter.xhtml#Fig18).\n\n![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig18_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig18_HTML.jpg)\n\
    \nFigure 9-18\n\nUnderstanding the roles home page\n\n### Note\n\nWhen considering\
    \ your role chart, keep in mind that role hierarchies aren’t necessarily the same\
    \ as your executive organizational chart. Typically you create roles for every\
    \ level in the hierarchy, not for every position.\n\nIf a role sits above someone\
    \ else in the role hierarchy tree, that role is granted the same level of access\
    \ to all records that fall beneath that branch. So if the access is read-only,\
    \ that same level of record access is granted.\n\n### Creating a New Role\n\n\
    Use roles to define how users view and share records. The correct role structure\
    \ depends on your organization’s culture.\n\nTo create a role, follow these steps:\n\
    \n1.  Search for `Roles` in the `Quick Find` box and click to navigate.\n2.  Select\
    \ `Set Up Roles`.\n3.  Select `Expand All` to see `Salesforce`’s default setup.\n\
    4.  Click `Add Role` under the appropriate branch to add a branch below (refer\
    \ to Figure [9-19](#437055_1_En_9_Chapter.xhtml#Fig19)).\n\n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig19_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig19_HTML.jpg)\n\
    \n    Figure 9-19\n\n    Tree branch view expanded\n\n5.  Fill in the following\
    \ details to successfully save a new role, as shown in Figure [9-20](#437055_1_En_9_Chapter.xhtml#Fig20):\n\
    \n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig20_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig20_HTML.jpg)\n\
    \n    Figure 9-20\n\n    Steps to creating a new role\n\n    1.  `Label`: This\
    \ is the name used to title the role. Examples can include VP of Sales, Regional\
    \ Managers, and so on. Press `Tab` to autopopulate the role name.\n    2.  `Role\
    \ Name`: This is the unique API name. This role reports to the name of the role\
    \ above this role.\n\n6.  Assign users to specified roles.\n\nBy selecting to\
    \ assign, you can search for unassigned users to connect them to a proper role.\
    \ You can also navigate to a user’s profile and select `Edit` to assign a role.\n\
    \n### Sharing Rules\n\nYou can use sharing rules to give roles, groups, or individual\
    \ users access to data that they may be excluded from. Sharing rules can be used\
    \ to override the existing security restrictions.\n\n### Public Groups\n\nGroups\
    \ can be created to simplify sharing and security. This can include a combination\
    \ of individuals, users with specific roles, or members of other public groups.\n\
    \n### Creating a Public Group\n\nBefore creating a sharing rule, you must create\
    \ a public group. Follow these steps to create a public group:\n\n1.  Search for\
    \ `Public Groups` in the `Quick Find` box.\n2.  Click `New` or set `View` to `All`\
    \ to see a list of existing groups (Figure [9-21](#437055_1_En_9_Chapter.xhtml#Fig21)).\n\
    \n    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig21_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig21_HTML.jpg)\n\
    \n    Figure 9-21\n\n    Setting up public groups\n\n3.  Fill in the following\
    \ details, as shown in Figure [9-22](#437055_1_En_9_Chapter.xhtml#Fig22).\n\n\
    \    ![../images/437055_1_En_9_Chapter/437055_1_En_9_Fig22_HTML.jpg](images/437055_1_En_9_Chapter/437055_1_En_9_Fig22_HTML.jpg)\n\
    \n    Figure 9-22\n\n    Adding members to a public group\n\n    *   Enter the\
    \ name of the public group in `Label`.\n    *   Enter the unique API name in `Group\
    \ Name`.\n    *   To add members to a public group, move them from `Available\
    \ Members` to `Selected Members`.\n\n4.  Click `Save`. Now you have a new public\
    \ group with members.\n\n#### Manual Sharing\n\nManual sharing can be used to\
    \ provide individual access to records through a sharing button.\n\nThere are\
    \ four prerequisites needed to give access to another record. These prerequisites\
    \ require the following:\n\n*   You are the record owner.\n*   You are in a role\
    \ higher than the record owner.\n*   You have “full access” permission to the\
    \ record.\n*   You are a system administrator.\n\n## Summary\n\nIn this chapter,\
    \ you learned how `Salesforce` approaches security in a multitiered architecture,\
    \ which supports greater flexibility and protection. Be sure to visit [http://trust.salesforce.com](http://trust.salesforce.com)\
    \ for transparent access to security threats and advisories.\n\n### Index\n\n\
    #### A, B\n\n`AppExchange` Marketplace Apps, lightning `AppExchange` marketplace\
    \ `AppExchange` Website app launcher choosing right app home page compatibility\
    \ consultants list home page details tab highlights bar information overview tab\
    \ installation details, installed and uninstalled packages home page production/sandbox,\
    \ choosing users selection lightning components package components price provider\
    \ reviews"
