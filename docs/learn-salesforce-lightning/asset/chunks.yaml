  trans: "\n#### 启用功能\n\n太好了！终于到了最后一步！当你的组织准备好迁移到 Lightning 时，请选择图 1-15 中所示的 `Turn\
    \ It On` 选项卡。将此选项卡切换为 `Enabled` 即可完成。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig15_HTML.jpg](img/437055_1_En_1_Fig15_HTML.jpg)\n\
    \n**图 1-15**\n启用 Lightning 以完成操作\n\n### 注意\n\n拥有相应权限的用户可以选择在 `Classic` 和 `Lightning\
    \ Experience` 之间切换。在 `Classic` 界面中，选择你的用户名并点击 `Switch to Lightning Experience`，如图\
    \ 1-16 所示。在 `Lightning Experience` 界面中，点击 `Switch to Classic`，如图 1-17 所示。\n\n\
    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig16_HTML.jpg](img/437055_1_En_1_Fig16_HTML.jpg)\n\
    \n**图 1-16**\n从 Classic 切换到 Lightning\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig17_HTML.jpg](img/437055_1_En_1_Fig17_HTML.jpg)\n\
    \n**图 1-17**\n从 Lightning Experience 切换到 Salesforce Classic\n\n## Lightning 主页\n\
    \n`Lightning Experience` 主页通过新功能得到了增强。主页可以根据用户需求进行定制，为他们提供在一个集中位置管理工作所需的一切。无需任何配置，`Salesforce`\
    \ 会显示以下组件：`Quarterly Performance`（季度业绩）、`Assistant`（助手）、`News`（资讯）、`Today’s Tasks`（今日任务）、`Today’s\
    \ Events`（今日活动）、`Recent Records`（最近记录）和 `Top Deals`（重点交易）。请参见图 1-18 和图 1-19。\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig19_HTML.jpg](img/437055_1_En_1_Fig19_HTML.jpg)\n\
    \n**图 1-19**\nLightning 主页的下半部分\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig18_HTML.jpg](img/437055_1_En_1_Fig18_HTML.jpg)\n\
    \n**图 1-18**\nLightning 主页的上半部分\n\n### 导航栏\n\n导航栏使用选项卡来存放对象，如图 1-20 所示。用数据库术语来说，*对象*（object）就是一个表。对象存储着可能相关的信息分组，包括其中的记录。记录可以看作是表中的行。你会在本书中反复听到这些术语。有关对象、记录和字段的更多信息，请导航到第\
    \ X 章。\n\n在 Lightning 中，每个选项卡都是可操作的。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig20_HTML.jpg](img/437055_1_En_1_Fig20_HTML.jpg)\n\
    \n**图 1-20**\n导航栏\n\n在导航栏中，对象被分解为列表。这些列表存放与对象相关的 `Salesforce` 记录。其中一个很棒的功能是，可以直接从一个选项卡中创建记录。每个列表都能用来查看该对象最近的项目，这使得用户可以更轻松地即时创建新记录。\n\
    \n### 季度业绩（Quarterly Performance）\n\n`Quarterly Performance`（季度业绩）摘要是一个强大的报告工具，用于根据销售漏斗展示销售用户的业绩（见图\
    \ 1-21）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig21_HTML.jpg](img/437055_1_En_1_Fig21_HTML.jpg)\n\
    \n**图 1-21**\n位于主页上的季度业绩组件\n\n-   `Closed`（已关闭）记录显示用户已赢单的商机。\n-   `Open (>70%)`（进行中，>70%）显示概率大于\
    \ 70% 的所有记录的总和。\n\n如果用户属于某个团队，则此报告将展示团队的商机总额。否则，所显示的数据将是该用户自己拥有的商机。\n\n#### 设定目标\n\
    \n要设定目标，请遵循以下步骤：\n\n1.  点击铅笔图标并输入金额，如图 1-22 所示。\n\n    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig22_HTML.jpg](img/437055_1_En_1_Fig22_HTML.jpg)\n\
    \n    **图 1-22**\n    选择铅笔图标以编辑你的季度目标\n\n2.  点击 `Save`（保存）。\n\n图表会自动计算并更新。点击 ![../images/437055_1_En_1_Chapter/437055_1_En_1_Figa_HTML.jpg](img/437055_1_En_1_Figa_HTML.jpg)\
    \ 可刷新数据。点击 ![../images/437055_1_En_1_Chapter/437055_1_En_1_Figb_HTML.jpg](img/437055_1_En_1_Figb_HTML.jpg)\
    \ 可按周或日筛选数据（图 1-23）。\n\n现在，你的销售用户就可以通过销售进度的数据可视化来开始新的一天了。\n\n### 资讯（News）\n\n\
    这项新功能非常适合展示与你客户及其行业相关的新闻文章。一旦按照“增强功能”部分所述启用，新闻信息便可在主页上显示。当从主页访问新闻时，系统会根据最近查看的记录以及这些记录的任务和事件来显示信息。请参见图\
    \ 1-23。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig23_HTML.jpg](img/437055_1_En_1_Fig23_HTML.jpg)\n\
    \n**图 1-23**\n主页上的资讯组件\n\n点击 `See More News`（查看更多资讯）以导航至 `News`（资讯）选项卡，如图 1-24\
    \ 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig24_HTML.jpg](img/437055_1_En_1_Fig24_HTML.jpg)\n\
    \n**图 1-24**\n在资讯对象中找到的行业新闻\n\n此选项卡显示一个标题为 `Industry News`（行业新闻）的新闻文章列表。此处填充的信息与你的客户及其行业相关。\n\
    \n### 助手（Assistant）\n\n`Lightning Assistant`（Lightning 助手）有助于排列最终用户日常任务的优先级。逾期的任务会首先显示在页面右上角（见图\
    \ 1-25）。紧接着是截止日期为今天的任务。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig25_HTML.jpg](img/437055_1_En_1_Fig25_HTML.jpg)\n\
    \n**图 1-25**\nLightning Assistant\n\n#### 全局搜索\n\nSalesforce 的全局搜索栏出现在每个页面的顶部。使用此区域可以在\
    \ `Salesforce` 中的任何对象上进行搜索。最佳实践是在创建新记录之前先搜索记录，以避免重复数据。使用通配符和运算符可以获得更好的搜索结果。\n\n\
    使用星号（`*`）可以查找搜索词中间或末尾匹配的记录，使用问号（`?`）可以查找搜索词中间或末尾仅匹配一个字符的记录。\n\n例如，在末尾搜索 `Ay*`\
    \ 将找到并显示名为 `Ayden` 的联系人的结果，也会找到并显示 `Andy Young` 的结果（图 1-26）。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig26_HTML.jpg](img/437055_1_En_1_Fig26_HTML.jpg)\n\
    \n**图 1-26**\n搜索 `Ay*` 的结果\n\n#### 收藏夹列表\n\n`Favorites`（收藏夹）图标是 Lightning 平台中的一个新工具。收藏夹是针对最常访问的记录和项目（如单个收藏记录、列表视图、仪表板等）的自定义快捷方式。\n\
    \n要将某项设为收藏，请点击图 1-27 中的星形按钮。这个强大的工具使你可以轻松地从不同对象位置找到你收藏的记录，并集中在一个地方查看。\n\n你可以将你的重点交易、最常访问的报告、最重要的潜在客户等设为收藏！\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig27_HTML.jpg](img/437055_1_En_1_Fig27_HTML.jpg)\n\
    \n**图 1-27**\n收藏夹图标\n\n点击星形旁边的箭头以选择你的 `Favorites`（收藏夹）列表中的项目，如图 1-28 所示。\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig28_HTML.jpg](img/437055_1_En_1_Fig28_HTML.jpg)\n\
    \n**图 1-28**\n收藏夹列表\n"
- fmt: "### Lightning Actions\n\nThe + button shown in Figure [1-29](#437055_1_En_1_Chapter.xhtml#Fig29)\
    \ can be used to quickly create records in `Salesforce`. Use this quick-create\
    \ feature to create a new activity, lead, contact, opportunity, case, or call\
    \ directly from the home page.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig29_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig29_HTML.jpg)\n\
    \nFigure 1-29\n\nLightning actions\n\nClick any of the available options to instantly\
    \ display a quick-create window at the bottom right of the screen.\n\nIn the Lightning\
    \ Experience, multiple windows can be opened from the home page to enhance user\
    \ productivity and speed. Up to three windows can be displayed at once (see Figure\
    \ [1-30](#437055_1_En_1_Chapter.xhtml#Fig30)).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig30_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig30_HTML.jpg)\n\
    \nFigure 1-30\n\n*Utility bar*\n\n### Help and Training\n\nSalesforce has many\
    \ great support resources including videos, walk-throughs, and an interactive\
    \ learning tool called Trailhead. From the home page, click the question mark\
    \ (shown in Figure [1-30](#437055_1_En_1_Chapter.xhtml#Fig30)) to access these\
    \ resources. Each page has a help menu with links to helpful resources. Use this\
    \ area to log a case and get support, give feedback, and view release notes.\n\
    \nSalesforce provides three seasonal releases a year: spring, summer, and winter.\
    \ Each release offers more than 150 new features. The image displayed at the bottom\
    \ right of this menu (shown in Figure [1-31](#437055_1_En_1_Chapter.xhtml#Fig31))\
    \ tells which release your organization is currently in.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig31_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig31_HTML.jpg)\n\
    \nFigure 1-31\n\nHelp and training\n\n### Setup\n\nSetup is an area used most\
    \ frequently by Salesforce administrators. In Lightning, the Setup page has improved!\
    \ The setup area has a more logical and easier-to-navigate layout. System administrators\
    \ and users with the appropriate permission settings can access this area. Select\
    \ Setup from the toolbar to navigate here (see Figure [1-32](#437055_1_En_1_Chapter.xhtml#Fig32)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig32_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig32_HTML.jpg)\n\
    \nFigure 1-32\n\nLightning Setup home page\n\nSetup has these categories: Administration,\
    \ Platform Tools, and Settings. View the Most Recently Used Places in Setup to\
    \ seamlessly continue any admin work. Use the Quick Find to easily find the admin\
    \ tools necessary for custom work.\n\nClick the Create button to quickly access\
    \ the most common tools, including creating new objects, workflows, tabs, templates,\
    \ and users (see Figure [1-33](#437055_1_En_1_Chapter.xhtml#Fig33).)\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig33_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig33_HTML.jpg)\n\
    \nFigure 1-33\n\nCreate button\n\n### Notifications\n\nView all notifications\
    \ in one place, including approval requests and chatter mentions. Click the bell\
    \ icon to see a list of notifications (see Figure [1-34](#437055_1_En_1_Chapter.xhtml#Fig34)).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig34_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig34_HTML.jpg)\n\
    \nFigure 1-34\n\nNotifications area\n\n### View Profile\n\nUse this section to\
    \ make changes to personal settings, log out, or switch to Salesforce Classic\
    \ (see Figure [1-35](#437055_1_En_1_Chapter.xhtml#Fig35)).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig35_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig35_HTML.jpg)\n\
    \nFigure 1-35\n\nSettings area\n\n## Users\n\nIn Lightning you can create Salesforce\
    \ users just as easy as you can in Classic. Users are identified with a license,\
    \ username and password, and profile. In Lightning you can create new users, deactivate\
    \ users, edit user settings, and more.\n\n### Create a New User\n\nTo assign licenses\
    \ and record ownership, you must first create a user. Each user must be assigned\
    \ a license. To free up a license, you can deactivate a user and assign accordingly.\
    \ In Quick Find, search for and select Users, which is located in the Administration\
    \ section.\n\nNavigate to the User home page (see Figure [1-36](#437055_1_En_1_Chapter.xhtml#Fig36))\
    \ to create an individual user, edit information about an existing user, add multiple\
    \ users, and reset passwords.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig36_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig36_HTML.jpg)\n\
    \nFigure 1-36\n\nUser setup home page\n\n### Create and Edit User Information\n\
    \nFollow these steps to create a new user:\n\n1.  Click New User.\n2.  Fill in\
    \ all the required fields marked in red. This includes Last Name, Alias, Email,\
    \ Username, and Nickname (see Figure [1-37](#437055_1_En_1_Chapter.xhtml#Fig37)).\n\
    \    \n    ![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig37_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig37_HTML.jpg)\n\
    \    \n    Figure 1-37\n    \n    Required fields to add a new user\n\n    **Note**\
    \ The email address must be in the form of a valid email address but can be used\
    \ for multiple organizations. However, the username must be a unique username\
    \ and in a correct email format.\n    \n    For example, `felicia@cloudcreations.com`\
    \ is a proper email format.\n\n3.  Assign the appropriate license in the User\
    \ License field.\n4.  Assign a profile using the Profile field.\n5.  Select Marketing\
    \ User to give the assigned user access to your organization’s marketing tools.\n\
    6.  Select Offline User to give the assigned user offline access.\n7.  Select\
    \ Knowledge User to give permission to make changes to Knowledge Base articles.\n\
    8.  Select Force.com Flow User to grant the ability for a Force.com licensed user\
    \ to run flows.\n9.  Select Service Cloud User to grant access to Service Cloud.\n\
    10.  Select Site.com Contributor User to allow access to Site.com.\n11.  Select\
    \ Work.com user to assign a work.com user feature license.\n12.  Select Salesforce\
    \ Classic User to enable access to Salesforce Mobile Classic.\n13.  Apply the\
    \ appropriate locale settings such as time zone, locale, and language (Figure\
    \ [1-30](#437055_1_En_1_Chapter.xhtml#Fig30)).\n14.  Click Save.\n\nSalesforce\
    \ sends a notification email to the user immediately to generate a new password.\
    \ To stop this, deselect “Generate new password” at the bottom of the screen.\n\
    \n### Add Multiple Users\n\nYou can save time by adding multiple users at once.\
    \ To add multiple users on the User home page, click Add Multiple Users, as shown\
    \ in Figure [1-38](#437055_1_En_1_Chapter.xhtml#Fig38).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig38_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig38_HTML.jpg)\n\
    \nFigure 1-38\n\nAdd Multiple Users button\n\nThe next page will break down the\
    \ number of licenses available for each license type, as shown in Figure [1-39](#437055_1_En_1_Chapter.xhtml#Fig39).\n\
    \n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig39_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig39_HTML.jpg)\n\
    \nFigure 1-39\n\nBreakdown of available licenses\n\nScroll to the bottom of the\
    \ page and select the user license that you want to add for all users, as shown\
    \ in Figure [1-40](#437055_1_En_1_Chapter.xhtml#Fig40).\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig40_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig40_HTML.jpg)\n\
    \nFigure 1-40\n\nSelecting the user license for a mass group of users\n\n### Note\n\
    \nWhen adding multiple users, they must be users with the same license type.\n\
    \nOnce you select the appropriate license type, fill in the details for the user\
    \ and click Save, as shown in Figure [1-41](#437055_1_En_1_Chapter.xhtml#Fig41).\
    \ Not all user fields are available in this process.\n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig41_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig41_HTML.jpg)\n\
    \nFigure 1-41\n\nRequired fields for a new user"
