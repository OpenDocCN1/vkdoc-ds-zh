- fmt: "# 7. Lightning Process Builder\n\n`Lightning Process Builder` is an extremely\
    \ powerful business process automation tool that can solve a myriad of real-world\
    \ business issues. `Process Builder` makes it easy to build logic in one place,\
    \ with its enhanced point-and-click interface. With `Process Builder`, you can\
    \ reduce or eliminate the need to build `Apex` code for simple processes. You\
    \ can create automated logic to update related records, update fields, create\
    \ a task, send an email, and much more. Click `New` to get started, as shown in\
    \ Figure [7-1](#437055_1_En_7_Chapter.xhtml#Fig1).\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig1_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig1_HTML.jpg)\n\
    \nFigure 7-1\n\n`Process Builder` home page. Click `New` to get started.\n\n##\
    \ Salesforce Workflow Rules vs. Process Builder\n\nSalesforce has multiple solutions\
    \ to automate your business process, including workflow rules and `Process Builder`.\n\
    \n*Workflow rules* are automated actions that take place when a record meets specified\
    \ criteria and is saved. You can minimize the amount of manual data entry and\
    \ processes by having a systematic process in place.\n\n`Process Builder` is supported\
    \ in `Salesforce Lightning` and does everything a workflow rule can do and more\
    \ (with the exception of outbound messages). A `Process Builder` action can start\
    \ when a record is changed or when invoked by another process. Both automation\
    \ types support time-based actions.\n\nIf you have a simple single `if/then` statement,\
    \ it is suggested that you use a workflow rule to automate your process. In other\
    \ words, if you have criteria for automation that include simple logic, use a\
    \ workflow rule. If there is a level of complexity to your automated requirement,\
    \ `Process Builder` is best suited for this. Read the “Actions” section to learn\
    \ more about what each action type does.\n\nTable [7-1](Table_01_0007_0001.xhtml)\
    \ identifies the differences between workflow rules and the `Process Builder`\
    \ tool.\n\n [Table 7-1](Table_01_0007_0001.xhtml) \n\nActions Available in Workflow\
    \ Rules and Process Builder\n\n## Process Builder: Action Types\n\n`Process Builder`\
    \ makes it easier to create automated actions because it is a visual designer,\
    \ as shown in Figure [7-2](#437055_1_En_7_Chapter.xhtml#Fig2).\n\nThe following\
    \ are the actions that can be completed by a workflow rule or `Process Builder`:\n\
    \n*   *Call on an Apex class*: `Apex` is a programming language used in Salesforce\
    \ to develop complex processes. You can use `Process Builder` to call on an existing\
    \ `Apex` class.\n\n*   *Create a Record*: Use this action to create a new record\
    \ from any standard or custom object. Field values can be set to build the record\
    \ appropriately.\n\n    **Tip** Required fields are still active when a record\
    \ is created via a process. Make sure all required fields are given a value in\
    \ the `Set Field Values` section in order to successfully create a record.\n\n\
    *   *Email Alerts*: Select an existing email alert to automatically send an email\
    \ to designated recipients.\n\n*   *Flows*: Choose this action to launch an existing\
    \ visual workflow.\n\n*   *Post to Chatter*: Create a message and choose to update\
    \ a user, `Chatter` group, or new `Chatter` post to the related record.\n\n  \
    \  **Note** Merge fields can be used to generate the `Chatter` post.\n\n*   *Processes*:\
    \ Use this action type to trigger another process.\n\n    **Note** Only active\
    \ processes can be started.\n\n*   *Quick action*: Use this action type to start\
    \ a quick action. Select “Global actions” to create a record or log a call. Select\
    \ Object to define an action for the selected object.\n\n*   *Submit for Approval*:\
    \ Choose to activate the default approval process or specific approval process\
    \ for the given record, as shown in Figure [7-2](#437055_1_En_7_Chapter.xhtml#Fig2).\
    \ Control who the submitter is by selecting the appropriate value: `Current User`,\
    \ `User Field from a Record`, or `Specific User`. Submission comments can be entered.\n\
    \n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig2_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig2_HTML.jpg)\n\
    \n    Figure 7-2\n\n    `Submit for Approval` action type\n\n*   *Update records*:\
    \ Choose to update the existing record or a record related to the corresponding\
    \ object (shown in Figure [7-3](#437055_1_En_7_Chapter.xhtml#Fig3)).\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig3_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig3_HTML.jpg)\n\
    \n    Figure 7-3\n\n    Selecting a record to update in `Process Builder`\n\n\
    ### Time-Dependent Actions\n\nWhen a record meets the criteria, the action can\
    \ be executed immediately or on a specified schedule.\n\nTo control when the action\
    \ is executed, add a time lapse to the process, as shown in Figure [7-4](#437055_1_En_7_Chapter.xhtml#Fig4).\
    \ Actions can be triggered to run before or after a specified date.\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig4_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig4_HTML.jpg)\n\
    \nFigure 7-4\n\nSetting the time for a time-dependent action\n\n#### Example\n\
    \nAs an example, let’s create an automated action to send a “Happy Birthday” card\
    \ to all active clients one day before birthdate. The `Scheduled Actions` option\
    \ is available only when the first node of the process starts the process with\
    \ “only when a record is created” *or* “when a record is created or edited” is\
    \ selected *and* the `Yes` check box is selected in the criteria node in the `Advanced`\
    \ section, as shown in Figure [7-5](#437055_1_En_7_Chapter.xhtml#Fig5).\n\n![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig5_HTML.jpg](images/437055_1_En_7_Chapter/437055_1_En_7_Fig5_HTML.jpg)\n\
    \nFigure 7-5\n\nSetting the criteria for an action group\n\n## Creating a Process\
    \ Using Process Builder\n\nFollow the steps in this section to create an automated\
    \ business process.\n\nIn this scenario, you will encounter a real-world business\
    \ problem. Say sales users have to manually create a project record with the same\
    \ details stored at the opportunity level. Rather than creating a new record and\
    \ copying and pasting the details, it is beneficial for them to have the tool\
    \ automatically create a new project record. At the same time, it’s beneficial\
    \ to automatically pull the details stored in the opportunity record into the\
    \ new project record.\n\n### Note\n\nIn this use case, project records are records\
    \ stored in a custom object titled `Projects`.\n\nFor all opportunities that are\
    \ set to `Closed Won`, you want to create a new project record and update the\
    \ `Project` field `Next Step` to say `Schedule Project Kickoff`."
