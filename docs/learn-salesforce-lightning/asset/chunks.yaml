    \ configure your activity feed by creating new tasks and events."
  trans: "好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成地道、专业的中文。\n\n\n### 创建新的商机\n\
    \n跟踪关键信息以帮助达成进行中的交易。跟踪已发送的样品、最新的接触点以及后续步骤。利用或自定义`阶段`字段，以跟踪交易在销售渠道中的位置。使用结束日期来预测此交易的预期成交日期。\n\
    \n1.  点击`商机`菜单。\n2.  点击`新建商机`，并填写图 2-33 所示的必填字段。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig33_HTML.jpg](img/437055_1_En_2_Fig33_HTML.jpg)\n\
    \n    图 2-33\n    商机的编辑页面\n\n3.  输入商机名称。\n4.  输入预期的结束日期，并填写有关此商机的任何其他详细信息。建议填写更多关于商机的详细信息。\n\
    5.  选择商机记录的阶段。\n6.  点击`保存`以保存商机记录。\n7.  一旦保存，Salesforce 会将客户与商机关联起来。\n\n### 提示\n\
    \n不确定如何命名商机？请尽量保持商机命名的一致性并使其具体化。例如，`数量 + 感兴趣的产品或服务`。\n\n### 商机阶段历史记录\n\n使用`阶段历史记录`区域来跟踪阶段的变更。对阶段、金额、可能性、预期收入或结束日期所做的任何更改都会显示在此处。选择`查看全部`以查看所有更改的列表视图，如图\
    \ 2-34 所示。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig34_HTML.jpg](img/437055_1_En_2_Fig34_HTML.jpg)\n\
    \n图 2-34\n商机记录上的阶段历史记录列表\n\n## 产品\n\n`产品`代表您公司提供的产品或服务。在此对象中存储重要的产品信息，以便销售代表在销售过程中利用。产品描述和定价是销售代表在出差或通话时可以使用的有力信息。\n\
    \n使用产品来与商机或报价关联。无缝更新商机金额以预测潜在的即将到来的收入。利用此信息来报告畅销产品等。\n\n### 创建产品\n\n请按照以下步骤在 Salesforce\
    \ 中创建产品：\n\n1.  点击`产品`选项卡（如图 2-35 所示）。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig35_HTML.jpg](img/437055_1_En_2_Fig35_HTML.jpg)\n\
    \n    图 2-35\n    产品选项卡\n\n2.  点击`新建`（图 2-36）。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig36_HTML.jpg](img/437055_1_En_2_Fig36_HTML.jpg)\n\
    \n    图 2-36\n    产品列表视图上的新建按钮\n\n3.  输入产品详细信息。为产品输入一个描述性名称，并提供描述（图 2-37）。\n\n\
    \    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig37_HTML.jpg](img/437055_1_En_2_Fig37_HTML.jpg)\n\
    \n    图 2-37\n    创建产品的编辑页面包括产品名称、产品代码、描述、产品系列和启用状态\n\n4.  点击`启用`复选框以在 Salesforce\
    \ 中激活该产品。\n5.  点击`保存`。\n6.  在产品记录的`相关`选项卡中，点击`添加标准价格`（如图 2-38 所示）。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig38_HTML.jpg](img/437055_1_En_2_Fig38_HTML.jpg)\n\
    \n    图 2-38\n    添加标准价格按钮\n\n7.  输入产品的标价，如图 2-39 所示，如果未使用其他价目表，则将其与标准价目表关联。\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig39_HTML.jpg](img/437055_1_En_2_Fig39_HTML.jpg)\n\
    \n    图 2-39\n    价目表条目页面\n\n8.  点击`保存`。Salesforce 将创建新的价目表条目记录。\n\n### 说明\n\n\
    产品如何与价目表关联？必须先将产品添加到价目表，然后才能在商机中使用。价目表可用于记录单个产品的多个定价。使用价目表为批发商、分销商和其他客户定义价格。\n\
    \n### 商机产品\n\n请按照以下步骤在 Salesforce 中创建商机产品：\n\n1.  在商机记录中，点击图 2-40 所示的`产品`列表中的箭头。\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig40_HTML.jpg](img/437055_1_En_2_Fig40_HTML.jpg)\n\
    \n    图 2-40\n    商机记录上的产品列表\n\n2.  点击`添加产品`。\n3.  选择每个应附加的产品旁边的`+`按钮。参见图 2-41。\n\
    \n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig41_HTML.jpg](img/437055_1_En_2_Fig41_HTML.jpg)\n\
    \n    图 2-41\n    产品选择页面\n\n4.  点击`下一步`。\n5.  为此特定商机和每个产品选择数量，如图 2-42 所示。\n\n\
    \    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig42_HTML.jpg](img/437055_1_En_2_Fig42_HTML.jpg)\n\
    \n    图 2-42\n    商机产品选择\n\n6.  更新每个产品的销售价格。\n7.  如果需要，输入日期或行描述。\n8.  点击`保存`。\n\
    9.  查看成功附加到此商机的新的商机产品记录，如图 2-43 所示。\n\n    ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig43_HTML.jpg](img/437055_1_En_2_Fig43_HTML.jpg)\n\
    \n    图 2-43\n    附加了新产品的商机主页\n\n#### 商机记录页面\n\n图 2-43 右侧的产品面板显示了与商机关联的产品。点击任何产品记录旁边的\
    \ ![../images/437055_1_En_2_Chapter/437055_1_En_2_Figh_HTML.jpg](img/437055_1_En_2_Figh_HTML.jpg)\
    \ 可从商机中进行编辑或删除。\n\n图 2-43 页面顶部的`阶段`工作区是一个交互式工具，可用于帮助销售代理推进其销售流程。\n\n### 活动时间线\n\
    \n通过在 Salesforce 中设置提醒和分配任务来确定日常任务的优先级。使用活动来创建任务、创建事件或记录通话。在 Lightning Experience\
    \ 中，`活动时间线`替代了经典的`活动历史记录`和`未完成活动`列表，如图 2-44 所示。\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig44_HTML.jpg](img/437055_1_En_2_Fig44_HTML.jpg)\n\
    \n图 2-44\n潜在客户记录中的活动部分\n\n使用`记录通话`选项卡的评论部分来记录重要的通话详情。将联系人与其他客户或商机关联起来。\n\n###\
    \ 配置活动动态\n\n您可以通过创建新任务和事件来配置您的活动动态。\n"
- fmt: "### Create New Task\n\nFollow these steps to create a new task, as shown in\
    \ Figure [2-45](#437055_1_En_2_Chapter.xhtml#Fig45):\n\n1. Type the subject of\
    \ your task.\n2. Enter the task due date. The due date will be used to notify\
    \ when a task is upcoming or overdue.\n3. Relate the task to another record in\
    \ `Salesforce` in the `Related To` section. By default, whoever is creating the\
    \ task is the `Assigned To` person. Simply change this by clicking the `x` and\
    \ selecting the person the task should be assigned to.\n4. Select a status. `Not\
    \ Started`, `In Progress`, `Completed`, `Waiting on someone else`, and `Deferred`\
    \ are the standard status values.\n5. Click `Save`. A successful task record will\
    \ display a message, as shown in Figure [2-46](#437055_1_En_2_Chapter.xhtml#Fig46).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig46_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig46_HTML.jpg)\n\
    \n   Figure 2-46 — Successful task message\n\n6. The task is saved and recorded\
    \ in the `Next Steps` section. Tasks that have been completed are moved and displayed\
    \ in the `Past Activity` area, as shown in Figure [2-47](#437055_1_En_2_Chapter.xhtml#Fig47).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig47_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig47_HTML.jpg)\n\
    \n   Figure 2-47 — Next Steps section\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig45_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig45_HTML.jpg)\n\
    \nFigure 2-45 — Steps to create a new task\n\n### Create a New Event\n\nKeep track\
    \ of any events that are related to your leads or contacts. An event will have\
    \ a start date and an end date.\n\nFollow the next steps to create a new event\
    \ for a lead record and refer to Figure [2-48](#437055_1_En_2_Chapter.xhtml#Fig48).\n\
    \n1. Select the `New Event` tab, as shown in Figure [2-46](#437055_1_En_2_Chapter.xhtml#Fig46).\n\
    2. Type the subject of the event.\n3. Every event in `Salesforce` must have a\
    \ start date and end date. Enter these details here.\n4. Select the box if this\
    \ is an all-day event.\n5. If the event has a location, enter the location details\
    \ in `Location`. This is optional.\n6. If the event is related to an account,\
    \ search for the related account to associate the two, as shown in Figure [2-49](#437055_1_En_2_Chapter.xhtml#Fig49).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig49_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig49_HTML.jpg)\n\
    \n   Figure 2-49 — Related To and Assigned To fields on the event page\n\n7. Tasks\
    \ and events can be assigned to other `Salesforce` users. Choose who the task\
    \ should be assigned to, as shown in Figure [2-49](#437055_1_En_2_Chapter.xhtml#Fig49).\n\
    8. Click `Save`.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig48_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig48_HTML.jpg)\n\
    \nFigure 2-48 — Steps to create a new event\n\n### Create a Web-to-Lead Form\n\
    \nWith a web-to-lead form, leads can instantly be generated into `Salesforce`\
    \ from your web site. For example, create a `Contact Us` form on your web site\
    \ to create new lead records in `Salesforce`. Create custom fields to track specific\
    \ information from your web site and into `Salesforce`.\n\nFollow these steps\
    \ to create a web-to-lead form:\n\n1. Click `Setup`.\n2. Search for `web-to-lead`\
    \ in the `Quick Find` section.\n3. Click `Create Web-to-Lead Form`.\n4. Standard\
    \ and Custom fields are displayed in the `Available Fields` multiselect picklist,\
    \ as shown in Figure [2-50](#437055_1_En_2_Chapter.xhtml#Fig50). Add the fields\
    \ to the `Selected Fields` column to display on your web-to-lead form.\n\n   **Note:**\
    \ Formula fields are not available to be selected.\n\n5. After users submit a\
    \ web-to-lead form, they are taken to a specified return URL. Type the return\
    \ URL here. Note that this is typically a thank-you page.\n6. Select this check\
    \ box to enable `reCaptcha` to prevent spam. This is recommended.\n7. To use this\
    \ feature, go to the Google `reCaptcha` web site and click `Get reCaptcha` to\
    \ register domain. Once this is attained, enter the API key pair here.\n8. If\
    \ the Google servers are down, select this box to allow all traffic and leads\
    \ to be generated without `reCaptcha`.\n\n**Note:** You can generate up to 500\
    \ leads within 24 hours. Any additional leads exceeding this amount are placed\
    \ in a queue.\n\n![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig50_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig50_HTML.jpg)\n\
    \nFigure 2-50 — Web-to-Lead setup page\n\n### Create a Web-to-Lead Autoresponse\
    \ Rule\n\nImprove your client communication by sending out autoresponse messages\
    \ to leads captured from your web site. As an example, create an autoresponse\
    \ rule notifying the client that you received their submission and will reach\
    \ out within 24 hours.\n\n1. Click the `New` button shown in Figure [2-51](#437055_1_En_2_Chapter.xhtml#Fig51).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig51_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig51_HTML.jpg)\n\
    \n   Figure 2-51 — Create a new web-to-lead auto-response rule\n\n2. Name the\
    \ auto-response rule shown in Figure [2-52](#437055_1_En_2_Chapter.xhtml#Fig52).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig52_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig52_HTML.jpg)\n\
    \n   Figure 2-52 — Naming the auto-response rule\n\n3. Select `Active` to activate\
    \ the rule.\n4. Click `Save`.\n5. Select the created rule.\n6. Click `New` in\
    \ the `Rule Entries` section.\n7. Determine the sort order and set your desired\
    \ criteria. In this example, I’m creating an auto-response rule for all leads\
    \ coming from my web site, as shown in Figure [2-53](#437055_1_En_2_Chapter.xhtml#Fig53).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig53_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig53_HTML.jpg)\n\
    \n   Figure 2-53 — Setting the criteria for auto-response rule\n\n8. Select the\
    \ criteria for this rule to be triggered. This rule will be triggered when any\
    \ lead has the source `Web`.\n9. Type the name of the sender.\n10. Type the email\
    \ address of the sender.\n11. Select the email template to be used.\n12. Click\
    \ `Save`. Now any lead that meets the criteria you set will automatically receive\
    \ an email using the template you chose.\n\n### Create a Lead Assignment Rule\n\
    \nAutomate your lead routing process by creating a lead assignment rule. New leads\
    \ can automatically be assigned to a user or queue based on the condition that\
    \ is set.\n\n1. Click `Setup`.\n2. Search for `Lead Assignment Rules` in `Quick\
    \ Find` and select it.\n3. Click the `New` button.\n4. Give the rule a name and\
    \ type it here.\n5. Select `Active` to activate this rule; only one rule can be\
    \ active at a time.\n6. Click `Save`.\n7. Select the rule name.\n8. Click the\
    \ `New` button in the `Rule Entry` section, as shown in Figure [2-54](#437055_1_En_2_Chapter.xhtml#Fig54).\n\
    \n   ![../images/437055_1_En_2_Chapter/437055_1_En_2_Fig54_HTML.jpg](images/437055_1_En_2_Chapter/437055_1_En_2_Fig54_HTML.jpg)\n\
    \n   Figure 2-54 — List of lead assignment rules\n\n9. `Salesforce` will evaluate\
    \ each entry based on the sort order. Set the sort order for this rule.\n10. Set\
    \ the criteria for this rule by selecting the field, the appropriate operator,\
    \ and the value. In this example, I am creating the rule for all leads coming\
    \ from the state of California.\n11. Determine whether leads that meet this criteria\
    \ should be assigned to a user or queue. Type the name of the user or queue.\n\
    12. Click `Save`."
