    \ will require the Captcha API key to be created (this requires developer work\
    \ and will not be explained in this book). To set this up, you’ll need to navigate\
    \ to Salesforce Classic.\n\n6.  Click the Generate button.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig44_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig44_HTML.jpg)\n\
    \n    Figure 3-44\n\n    Setting up the web-to-case HTML generator\n\n7.  Copy\
    \ this HTML code and send it to your web site manager.\n\n8.  Click Finished when\
    \ done.\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig45_HTML.jpg](images/437055_1_En_3_Chapter/437055_1_En_3_Fig45_HTML.jpg)\n\
    \n    Figure 3-45\n\n    The HTML that is generated\n\n## Summary\n\nWith Salesforce\
    \ Service Cloud, you can tailor the experience to your organization’s needs or\
    \ utilize the great standard functionalities that come with your purchase. Whichever\
    \ path you choose, you can assure yourself that setup is the least of your worries.\n\
    \n# 4. Lightning Apps\n\nThe AppExchange marketplace comprises a suite of apps,\
    \ Lightning components, and consulting resources. Salesforce customers can install\
    \ add-on applications to their Salesforce organization. You can search across\
    \ thousands of apps to find prebuilt solutions for business needs. The marketplace\
    \ is also the place to search across thousands of registered Salesforce consultants\
    \ (shown in Figure [4-1](#437055_1_En_4_Chapter.xhtml#Fig1)).\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig1_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1\n\nBlaze new trails with the AppExchange\n\n## Apps\n\nIncrease productivity\
    \ by installing prebuilt packages, called *apps*, which provide custom solutions\
    \ for every role and industry. Visit the AppExchange web site at [`http://appexchange.salesforce.com`](http://appexchange.salesforce.com)\
    \ . Here you can sort and filter in numerous ways including by popularity and\
    \ rating.\n\nTo pick the right app, we recommend identifying your business challenges,\
    \ budget, and time frame.\n\n### Discover the AppExchange Marketplace\n\nYou should\
    \ take the time to explore the business app store in Salesforce, otherwise known\
    \ as the AppExchange marketplace. There are more than 3,000 apps and components\
    \ that can be used to extend the power of Salesforce. Follow these steps:\n\n\
    1.  From the App Launcher, click Visit AppExchange, as shown in Figure [4-2](#437055_1_En_4_Chapter.xhtml#Fig2).\
    \ Or, from Setup, search for *AppExchange marketplace* in the Quick Find area.\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig2_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig2_HTML.jpg)\n\
    \n    Figure 4-2\n\n    Visit the AppExchange from the App Launcher\n\n2.  Click\
    \ AppExchange Website , as shown in Figure [4-3](#437055_1_En_4_Chapter.xhtml#Fig3).\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig3_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig3_HTML.jpg)\n\
    \n    Figure 4-3\n\n    Click AppExchange Website to navigate to the complete\
    \ database of apps and components\n\nThis marketplace contains apps and components\
    \ for end users to install and download into their Salesforce organization. In\
    \ addition, you have access to thousands of reviews about these apps, components,\
    \ and consultants. It’s complete transparency at your fingertips.\n\nOn your home\
    \ page, shown in Figure [4-4](#437055_1_En_4_Chapter.xhtml#Fig4), apps can be\
    \ searched and filtered by various categories. You’ll find a wide array of apps!\
    \ They range from point solutions to full-blown integration and automation. There\
    \ are free apps, and there are paid apps. The good news is that Salesforce makes\
    \ it easy to find what you are looking for.\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig4_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4\n\nThe AppExchange home page\n\n#### Choose an App\n\nChoosing the\
    \ right app can seem overwhelming with the number of solutions available. So,\
    \ it’s important to have a strategy in this decision-making process.\n\n1.  Start\
    \ by defining your business challenges. Identify your company goals and objectives.\
    \ Once you’ve determined what they are, search and review a handful of solution\
    \ options in the Salesforce marketplace.\n\n2.  Once you’ve narrowed down a handful\
    \ of prospective solutions, evaluate the solutions and vendors. Consider the ease\
    \ of use, support options, total cost, reviews, the ease of administration, and\
    \ solution match. Use this information to help make a decision.\n\n3.  If available,\
    \ request a demo or trial, or install the app into your sandbox for user testing\
    \ and acceptance.\n\n### Price\n\nOne important factor is cost. There are apps\
    \ in Salesforce that are free, but there are others that have a cost associated\
    \ with them. While some apps display their total cost, others require you to contact\
    \ them to find out the price. Some of these payment options can be monthly, annually,\
    \ per user, or per organization.\n\n### Compatibility\n\nMake sure to check the\
    \ compatibility of the solution. You can find the compatibility information in\
    \ the details section of the app under Requirements and Other System Requirements\
    \ (shown in Figure [4-5](#437055_1_En_4_Chapter.xhtml#Fig5)).\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig5_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig5_HTML.jpg)\n\
    \nFigure 4-5\n\nRequirements and Other System Requirements sections in the app\
    \ details"
  trans: "\n### 设置 Web 到案例\n\nSalesforce 中的 Web 到案例功能允许您将 HTML 代码嵌入到现有的网站或网页表单中。使用过此功能的大多数客户会将\
    \ HTML 代码嵌入到其网站支持相关页面上的“联系我们”表单中。此功能与电子邮件到案例功能类似，允许自动生成的案例进入 Salesforce。请按照图 3-43\
    \ 至图 3-48 所示的步骤操作。\n\n1.  点击 Salesforce 窗口右上角的设置齿轮图标，导航至设置菜单。\n2.  在搜索区域输入 **Web-to-case**。在“服务”下点击“Web\
    \ 到案例”。\n3.  应勾选“启用 Web 到案例”复选框，如图 3-43 所示。\n4.  将默认的“案例来源”选项设置为“Web”或任何其他描述此案例来源的选项。\n\
    5.  附加一个响应模板，希望客户在提交案例后收到。\n6.  “隐藏记录信息”将隐藏所发送电子邮件中的记录信息。\n\n    **注意** 如果要为此创建电子邮件模板，请转到“设置”，搜索\
    \ `Email Template`，然后在“电子邮件”部分下找到 `Email Template`。\n\n7.  添加电子邮件签名（如果您选择在电子邮件模板中创建）。\n\
    8.  点击“保存”。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig43_HTML.jpg](img/437055_1_En_3_Fig43_HTML.jpg)\n\
    \n    图 3-43\n\n    创建 Web 到案例功能\n\n现在您已启用该功能，就可以生成要嵌入到网站的 HTML 代码。图 3-44 至 3-45\
    \ 向您展示如何操作。\n\n1.  在“设置”菜单的左侧，您应该会看到“Web 到案例 HTML 生成器…”。如果没有，您可以搜索 `web-to-case\
    \ HTML`。点击该短语。\n2.  在“可用字段”区域中，选择要包含在网页表单中的字段。\n3.  将字段从“可用字段”移动到“已选字段”。\n4. \
    \ 在“URL”字段中，输入希望客户在提交网页表单后返回的 URL。\n5.  “启用垃圾邮件过滤”选项需要创建 Captcha API 密钥（这需要开发人员操作，本书不做解释）。要进行设置，您需要导航到\
    \ Salesforce Classic。\n6.  点击“生成”按钮。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig44_HTML.jpg](img/437055_1_En_3_Fig44_HTML.jpg)\n\
    \n    图 3-44\n\n    设置 Web 到案例 HTML 生成器\n\n7.  复制此 HTML 代码并将其发送给您的网站管理员。\n8. \
    \ 完成后点击“完成”。\n\n    ![../images/437055_1_En_3_Chapter/437055_1_En_3_Fig45_HTML.jpg](img/437055_1_En_3_Fig45_HTML.jpg)\n\
    \n    图 3-45\n\n    生成的 HTML\n\n## 总结\n\n借助 Salesforce Service Cloud，您可以根据组织的需求定制体验，或利用购买时附带的标准强大功能。无论选择哪条道路，您都可以确信，设置是最不需要您担心的问题。\n\
    \n# 4. Lightning 应用程序\n\nAppExchange 市场包含一系列应用程序、Lightning 组件和咨询资源。Salesforce\
    \ 客户可以为其 Salesforce 组织安装附加应用程序。您可以在数千个应用中搜索，为业务需求寻找预建的解决方案。该市场也是搜索数千名注册 Salesforce\
    \ 顾问的地方（如图 4-1 所示）。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig1_HTML.jpg](img/437055_1_En_4_Fig1_HTML.jpg)\n\
    \n图 4-1\n\n使用 AppExchange 开辟新道路\n\n## 应用程序\n\n通过安装名为*应用程序*的预建包来提高生产力，这些包为每个角色和行业提供定制解决方案。请访问\
    \ AppExchange 网站 [`appexchange.salesforce.com`](http://appexchange.salesforce.com)。您可以在此处通过多种方式进行排序和筛选，包括按热门度和评分。\n\
    \n要选择正确的应用程序，我们建议您明确自己的业务挑战、预算和时间框架。\n\n### 发现 AppExchange 市场\n\n您应该花时间探索 Salesforce\
    \ 中的商业应用商店，也称为 AppExchange 市场。这里有超过 3,000 个应用和组件可用于扩展 Salesforce 的功能。请按以下步骤操作：\n\
    \n1.  从应用程序启动器中，点击“访问 AppExchange”，如图 4-2 所示。或者，从“设置”中，在“快速查找”区域搜索 `AppExchange\
    \ marketplace`。\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig2_HTML.jpg](img/437055_1_En_4_Fig2_HTML.jpg)\n\
    \n    图 4-2\n\n    从应用程序启动器访问 AppExchange\n\n2.  点击“AppExchange 网站”，如图 4-3 所示。\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig3_HTML.jpg](img/437055_1_En_4_Fig3_HTML.jpg)\n\
    \n    图 4-3\n\n    点击“AppExchange 网站”以导航到完整的应用程序和组件数据库\n\n该市场包含供最终用户安装并下载到其 Salesforce\
    \ 组织中的应用程序和组件。此外，您还可以访问关于这些应用程序、组件和顾问的数千条评论。透明度触手可及。\n\n在您的主页上（如图 4-4 所示），可以根据各种类别搜索和筛选应用程序。您会发现各种各样的应用程序！它们范围从点式解决方案到全面的集成和自动化。既有免费的应用，也有付费的应用。好消息是，Salesforce\
    \ 让您轻松找到所需内容。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig4_HTML.jpg](img/437055_1_En_4_Fig4_HTML.jpg)\n\
    \n图 4-4\n\nAppExchange 主页\n\n#### 选择应用程序\n\n面对众多可用的解决方案，选择正确的应用程序可能让人不知所措。因此，在此决策过程中有一个策略至关重要。\n\
    \n1.  首先，明确您的业务挑战。确定公司的目标和宗旨。一旦确定了这些，就在 Salesforce 市场中搜索并查看一些解决方案选项。\n2.  一旦缩小范围锁定了一些潜在的解决方案，就评估这些解决方案和供应商。考虑易用性、支持选项、总成本、评价、管理便利性以及解决方案匹配度。利用这些信息来帮助做出决定。\n\
    3.  如果可行，请求演示或试用，或者将应用程序安装到您的沙盒环境中进行用户测试和验收。\n\n### 价格\n\n一个重要的因素是成本。Salesforce\
    \ 中有免费的应用，但也有其他需要付费的应用。有些应用会显示总成本，而另一些则需要您联系他们以了解价格。其中一些付款方式可以是按月、按年、按用户或按组织付费。\n\
    \n### 兼容性\n\n务必检查解决方案的兼容性。您可以在应用的“详细信息”部分的“要求”和“其他系统要求”下找到兼容性信息（如图 4-5 所示）。\n\n\
    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig5_HTML.jpg](img/437055_1_En_4_Fig5_HTML.jpg)\n\
    \n图 4-5\n\n应用详细信息中的“要求”和“其他系统要求”部分\n"
- fmt: "### App Home Page\n\nThe home page of an app provides an overview, details,\
    \ reviews, and provider information (shown in Figure [4-6](#437055_1_En_4_Chapter.xhtml#Fig6)).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig6_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig6_HTML.jpg)\n\
    \nFigure 4-6\n\nHome page of an application\n\nThe page also contains this information:\n\
    \n- **Highlights**: The highlights bar located at the top of the application page,\
    \ shown in Figure [4-7](#437055_1_En_4_Chapter.xhtml#Fig7), displays key components\
    \ of the app. This typically includes Lightning readiness, organization compatibility,\
    \ and limitations.\n\n  ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig7_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig7_HTML.jpg)\n\
    \n  Figure 4-7\n\n  Highlights bar\n\n- **Cost**: The cost is located on the left\
    \ side of the home page. If the app is free, the app will state Free. If there\
    \ is a cost associated with the app, it will state Paid.\n\n- **Overview**: Click\
    \ the Overview tab shown in Figure [4-8](#437055_1_En_4_Chapter.xhtml#Fig8) for\
    \ a brief description of the app. Some apps contain links to their web site or\
    \ include video demos here. It is recommended that you watch any videos for further\
    \ insight into the app’s capabilities. You can also find detailed pricing information,\
    \ the release date, and screenshots in this area.\n\n  ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig8_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig8_HTML.jpg)\n\
    \n  Figure 4-8\n\n  Overview tab for app\n\n- **Details**: Click the Details tab\
    \ shown in Figure [4-9](#437055_1_En_4_Chapter.xhtml#Fig9) to gather more insightful\
    \ details. This typically includes any technical specifics, software requirements,\
    \ a supported feature list, data sheets, and security-related information.\n\n\
    To reach the app provider directly, contact information is displayed at the top-right\
    \ corner of the page.\n\n### Tip\n\nFor an app that requires extensive setup,\
    \ consider the support options available for each app.\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig9_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig9_HTML.jpg)\n\
    \nFigure 4-9\n\nDetails tab\n\nAt the bottom of the Details tab are documents\
    \ including data sheets, customization guides, case studies, and customer testimonials\
    \ provided by the app company, as shown in Figure [4-10](#437055_1_En_4_Chapter.xhtml#Fig10).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig10_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig10_HTML.jpg)\n\
    \nFigure 4-10\n\nImportant information stored about the app including data sheets,\
    \ guides, case studies, and testimonials\n\n### Reviews\n\nEvery app is rated\
    \ using a five-star scoring method and includes written customer reviews. These\
    \ reviews are also split between positive reviews and critical reviews. Use this\
    \ information to help determine the success of the app. Navigate to the reviews\
    \ section on the Reviews tab to read customer feedback (shown in Figure [4-11](#437055_1_En_4_Chapter.xhtml#Fig11)).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig11_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig11_HTML.jpg)\n\
    \nFigure 4-11\n\nThe Reviews tab includes positive and critical reviews\n\nTo\
    \ write a review, a user must be authenticated. To write a review, click Write\
    \ a Review in the Review Highlights section, as shown in Figure [4-12](#437055_1_En_4_Chapter.xhtml#Fig12).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig12_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig12_HTML.jpg)\n\
    \nFigure 4-12\n\nClick this button to write a review\n\nNext, give your review\
    \ a title. Provide comments in the Comments section shown in Figure [4-13](#437055_1_En_4_Chapter.xhtml#Fig13).\
    \ Scroll your mouse over the stars to select the appropriate rating. Click Post\
    \ Review when finished. Note that it may take up to an hour for your review to\
    \ post.\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig13_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig13_HTML.jpg)\n\
    \nFigure 4-13\n\nInformation to include in your app review\n\n### Note\n\nCome\
    \ back to this page to write a positive or critical review of an app you have\
    \ installed. This brings more value to the Salesforce community.\n\n### Provider\n\
    \nThis tab holds more details about the app provider. Find out additional apps\
    \ the provider has created that may be relevant to your business needs. Additional\
    \ details include headquarter location, web site, employee count, and year founded,\
    \ as shown in Figure [4-14](#437055_1_En_4_Chapter.xhtml#Fig14).\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig14_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig14_HTML.jpg)\n\
    \nFigure 4-14\n\nProvider tab\n\n## Install an App\n\nApps can be installed directly\
    \ into your production or sandbox environment. Production environments are where\
    \ your active users are using Salesforce with live data. The sandbox is your testing\
    \ environment. These can be production or development environments used for testing\
    \ applications. It is recommended that you install here first to see how it will\
    \ interact with your existing setup.\n\nAn app can also be installed for a specific\
    \ group of users or all users.\n\nTo install an app, follow these steps:\n\n1.\
    \  Do some research and select the app to be installed.\n\n2.  Click the Get It\
    \ Now button, as shown in Figure [4-15](#437055_1_En_4_Chapter.xhtml#Fig15).\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig15_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig15_HTML.jpg)\n\
    \n    Figure 4-15\n\n    Get It Now button on the home page\n\n3.  Log in using\
    \ your Salesforce credentials.\n\n4.  Select the appropriate installation method,\
    \ as shown in Figure [4-16](#437055_1_En_4_Chapter.xhtml#Fig16).\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig16_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig16_HTML.jpg)\n\
    \n    Figure 4-16\n\n    Choosing to install into production or the sandbox\n\n\
    \    - Click “Install in production” to install into a live, production environment.\n\
    \    - Click Install in Sandbox to install into the sandbox test environment.\n\
    \n5.  Review the package components, version, expiration, and subscription cost\
    \ for the app that will be installed. Review the terms and conditions.\n\n6. \
    \ Select “I have read and agreed to the terms and conditions,” as shown in Figure\
    \ [4-17](#437055_1_En_4_Chapter.xhtml#Fig17). Click Confirm and Install.\n\n \
    \   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig17_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig17_HTML.jpg)\n\
    \n    Figure 4-17\n\n    Last step before installing\n\n7.  Identify the users\
    \ who should have access to this app. Select the appropriate option from the following\
    \ list: Install to Admins Only, All Users, or Specific Profiles.\n\n    **Note**:\
    \ You can open access to this app to other users after the install.\n\n8.  Click\
    \ Install, as shown in Figure [4-18](#437055_1_En_4_Chapter.xhtml#Fig18).\n\n\
    \    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig18_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig18_HTML.jpg)\n\
    \n    Figure 4-18\n\n    Selecting which users to install to\n\n9.  Click Done\
    \ and you will be directed to the Installed Packages section once the app has\
    \ completed installation (see Figure [4-19](#437055_1_En_4_Chapter.xhtml#Fig19)).\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig19_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig19_HTML.jpg)\n\
    \n    Figure 4-19\n\n    Details on installed and uninstalled packages"
  raw: "### App Home Page\n\nThe home page of an app provides an overview, details,\
    \ reviews, and provider information (shown in Figure [4-6](#437055_1_En_4_Chapter.xhtml#Fig6)).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig6_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig6_HTML.jpg)\n\
    \nFigure 4-6\n\nHome page of an application\n\nThe page also contains this information\
    \ :\n\n*   *Highlights*: The highlights bar located at the top of the application\
    \ page, shown in Figure [4-7](#437055_1_En_4_Chapter.xhtml#Fig7), displays key\
    \ components of the app. This typically includes Lightning readiness, organization\
    \ compatibility, and limitations.\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig7_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig7_HTML.jpg)\n\
    \n    Figure 4-7\n\n    Highlights bar\n\n*   *Cost*: The cost is located on the\
    \ left side of the home page. If the app is free, the app will state Free. If\
    \ there is a cost associated with the app, it will state Paid.\n\n*   *Overview*:\
    \ Click the Overview tab shown in Figure [4-8](#437055_1_En_4_Chapter.xhtml#Fig8)\
    \ for a brief description of the app. Some apps contain links to their web site\
    \ or include video demos here. It is recommended that you watch any videos for\
    \ further insight into the app’s capabilities. You can also find detailed pricing\
    \ information, the release date, and screenshots in this area.\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig8_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig8_HTML.jpg)\n\
    \n    Figure 4-8\n\n    Overview tab for app\n\n*   *Details*: Click the Details\
    \ tab shown in Figure [4-9](#437055_1_En_4_Chapter.xhtml#Fig9) to gather more\
    \ insightful details. This typically includes any technical specifics, software\
    \ requirements, a supported feature list, data sheets, and security-related information.\n\
    \nTo reach the app provider directly, contact information is displayed at the\
    \ top-right corner of the page.\n\n### Tip\n\nFor an app that requires extensive\
    \ setup, consider the support options available for each app.\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig9_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig9_HTML.jpg)\n\
    \nFigure 4-9\n\nDetails tab\n\nAt the bottom of the Details tab are documents\
    \ including data sheets, customization guides, case studies, and customer testimonials\
    \ provided by the app company, as shown in Figure [4-10](#437055_1_En_4_Chapter.xhtml#Fig10).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig10_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig10_HTML.jpg)\n\
    \nFigure 4-10\n\nImportant information stored about the app including data sheets,\
    \ guides, case studies, and testimonials\n\n### Reviews\n\nEvery app is rated\
    \ using a five-star scoring method and includes written customer reviews. These\
    \ reviews are also split between positive reviews and critical reviews. Use this\
    \ information to help determine the success of the app. Navigate to the reviews\
    \ section on the Reviews tab to read customer feedback (shown in Figure [4-11](#437055_1_En_4_Chapter.xhtml#Fig11)).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig11_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig11_HTML.jpg)\n\
    \nFigure 4-11\n\nThe Reviews tab includes positive and critical reviews\n\nTo\
    \ write a review, a user must be authenticated. To write a review, click Write\
    \ a Review in the Review Highlights section, as shown in Figure [4-12](#437055_1_En_4_Chapter.xhtml#Fig12).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig12_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig12_HTML.jpg)\n\
    \nFigure 4-12\n\nClick this button to write a review\n\nNext, give your review\
    \ a title. Provide comments in the Comments section shown in Figure [4-13](#437055_1_En_4_Chapter.xhtml#Fig13).\
    \ Scroll your mouse over the stars to select the appropriate rating. Click Post\
    \ Review when finished. Note that it may take up to an hour for your review to\
    \ post.\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig13_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig13_HTML.jpg)\n\
    \nFigure 4-13\n\nInformation to include in your app review\n\n### Note\n\nCome\
    \ back to this page to write a positive or critical review of an app you have\
    \ installed. This brings more value to the Salesforce community.\n\n### Provider\n\
    \nThis tab holds more details about the app provider. Find out additional apps\
    \ the provider has created that may be relevant to your business needs. Additional\
    \ details include headquarter location, web site, employee count, and year founded,\
    \ as shown in Figure [4-14](#437055_1_En_4_Chapter.xhtml#Fig14).\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig14_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig14_HTML.jpg)\n\
    \nFigure 4-14\n\nProvider tab\n\n## Install an App\n\nApps can be installed directly\
    \ into your production or sandbox environment. Production environments are where\
    \ your active users are using Salesforce with live data. The sandbox is your testing\
    \ environment. These can be production or development environments used for testing\
    \ applications. It is recommended that you install here first to see how it will\
    \ interact with your existing setup.\n\nAn app can also be installed for a specific\
    \ group of users or all users.\n\nTo install an app, follow these steps:\n\n1.\
    \  Do some research and select the app to be installed.\n\n2.  Click the Get It\
    \ Now button, as shown in Figure [4-15](#437055_1_En_4_Chapter.xhtml#Fig15).\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig15_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig15_HTML.jpg)\n\
    \n    Figure 4-15\n\n    Get It Now button on the home page\n\n3.  Log in using\
    \ your Salesforce credentials.\n\n4.  Select the appropriate installation method,\
    \ as shown in Figure [4-16](#437055_1_En_4_Chapter.xhtml#Fig16).\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig16_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig16_HTML.jpg)\n\
    \n    Figure 4-16\n\n    Choosing to install into production or the sandbox\n\n\
    \    *   Click “Install in production” to install into a live, production environment.\n\
    \n    *   Click Install in Sandbox to install into the sandbox test environment.\n\
    \n5.  Review the package components, version, expiration, and subscription cost\
    \ for the app that will be installed. Review the terms and conditions.\n\n6. \
    \ Select “I have read and agreed to the terms and conditions,” as shown in Figure\
    \ [4-17](#437055_1_En_4_Chapter.xhtml#Fig17). Click Confirm and Install.\n\n \
    \   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig17_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig17_HTML.jpg)\n\
    \n    Figure 4-17\n\n    Last step before installing\n\n7.  Identify the users\
    \ who should have access to this app. Select the appropriate option from the following\
    \ list: Install to Admins Only, All Users, or Specific Profiles.\n\n    **Note** You\
    \ can open access to this app to other users after the install.\n\n8.  Click Install,\
    \ as shown in Figure [4-18](#437055_1_En_4_Chapter.xhtml#Fig18).\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig18_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig18_HTML.jpg)\n\
    \n    Figure 4-18\n\n    Selecting which users to install to\n\n9.  Click Done\
    \ and you will be directed to the Installed Packages section once the app has\
    \ completed installation (see Figure [4-19](#437055_1_En_4_Chapter.xhtml#Fig19)).\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig19_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig19_HTML.jpg)\n\
    \n    Figure 4-19\n\n    Details on installed and uninstalled packages"
  trans: "\n### 应用首页\n\n应用的首页提供概览、详细信息、评论以及提供商信息（如图 4-6 所示）。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig6_HTML.jpg](img/437055_1_En_4_Fig6_HTML.jpg)\n\
    \n图 4-6\n应用首页\n\n该页面还包含以下信息：\n\n-   **亮点**：位于应用页面顶部的亮点栏（如图 4-7 所示）展示了应用的关键组件。通常包括\
    \ Lightning 就绪性、组织兼容性和限制。\n\n  ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig7_HTML.jpg](img/437055_1_En_4_Fig7_HTML.jpg)\n\
    \n  图 4-7\n  亮点栏\n\n-   **费用**：费用位于首页左侧。如果应用是免费的，则会显示“免费”。如果应用需要收费，则会显示“付费”。\n\
    \n-   **概览**：点击“概览”选项卡（如图 4-8 所示）可查看应用的简要说明。某些应用会在此处提供其网站的链接或包含视频演示。建议您观看任何视频，以进一步了解应用的功能。您还可以在此区域找到详细的定价信息、发布日期和屏幕截图。\n\
    \n  ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig8_HTML.jpg](img/437055_1_En_4_Fig8_HTML.jpg)\n\
    \n  图 4-8\n  应用的“概览”选项卡\n\n-   **详细信息**：点击“详细信息”选项卡（如图 4-9 所示）可获取更多有见地的细节。通常包括任何技术细节、软件要求、支持的功能列表、数据表和安全相关信息。\n\
    \n要直接联系应用提供商，请查阅页面右上角显示的联系信息。\n\n### 提示\n\n对于需要大量设置的应用，请考虑每个应用可用的支持选项。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig9_HTML.jpg](img/437055_1_En_4_Fig9_HTML.jpg)\n\
    \n图 4-9\n“详细信息”选项卡\n\n“详细信息”选项卡底部包含应用公司提供的文档，包括数据表、自定义指南、案例研究和客户评价，如图 4-10 所示。\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig10_HTML.jpg](img/437055_1_En_4_Fig10_HTML.jpg)\n\
    \n图 4-10\n存储的有关应用的重要信息，包括数据表、指南、案例研究和评价\n\n### 评论\n\n每个应用都使用五星评分方法进行评级，并包含客户书面评论。这些评论也分为正面评论和关键评论。利用此信息帮助判断应用的成功程度。导航至“评论”选项卡的评论部分，阅读客户反馈（如图\
    \ 4-11 所示）。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig11_HTML.jpg](img/437055_1_En_4_Fig11_HTML.jpg)\n\
    \n图 4-11\n“评论”选项卡包含正面和关键评论\n\n要撰写评论，用户必须经过身份验证。要撰写评论，请点击“评论亮点”部分中的“撰写评论”，如图 4-12\
    \ 所示。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig12_HTML.jpg](img/437055_1_En_4_Fig12_HTML.jpg)\n\
    \n图 4-12\n点击此按钮撰写评论\n\n接下来，为您的评论添加标题。在“评论”部分（如图 4-13 所示）提供评论内容。滚动鼠标悬停在星星上以选择适当的评分。完成后点击“发布评论”。请注意，您的评论可能需要长达一小时才能发布。\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig13_HTML.jpg](img/437055_1_En_4_Fig13_HTML.jpg)\n\
    \n图 4-13\n应用评论中需包含的信息\n\n### 注意\n\n请返回此页面为您已安装的应用撰写正面或关键评论。这将为 Salesforce 社区带来更多价值。\n\
    \n### 提供商\n\n此选项卡包含关于应用提供商的更多详细信息。了解提供商创建的可能与您的业务需求相关的其他应用。其他详细信息包括总部所在地、网站、员工数量和成立年份，如图\
    \ 4-14 所示。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig14_HTML.jpg](img/437055_1_En_4_Fig14_HTML.jpg)\n\
    \n图 4-14\n“提供商”选项卡\n\n## 安装应用\n\n应用可以直接安装到您的生产环境或沙盒环境中。生产环境是您的活跃用户使用 Salesforce\
    \ 处理实时数据的地方。沙盒是您的测试环境。这些可以是用于测试应用程序的生产或开发环境。建议您先在此处安装，以查看它如何与您现有的设置交互。\n\n应用也可以为特定用户组或所有用户安装。\n\
    \n要安装应用，请遵循以下步骤：\n\n1.  做一些研究并选择要安装的应用。\n\n2.  点击“立即获取”按钮，如图 4-15 所示。\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig15_HTML.jpg](img/437055_1_En_4_Fig15_HTML.jpg)\n\
    \n    图 4-15\n    首页上的“立即获取”按钮\n\n3.  使用您的 Salesforce 凭据登录。\n\n4.  选择合适的安装方法，如图\
    \ 4-16 所示。\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig16_HTML.jpg](img/437055_1_En_4_Fig16_HTML.jpg)\n\
    \n    图 4-16\n    选择安装到生产环境还是沙盒\n\n    -   点击“安装到生产环境”以安装到实时生产环境。\n    -   点击“安装到沙盒”以安装到沙盒测试环境。\n\
    \n5.  查看将要安装的应用的包组件、版本、过期时间和订阅成本。查看条款和条件。\n\n6.  选择“我已阅读并同意条款和条件”，如图 4-17 所示。点击“确认并安装”。\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig17_HTML.jpg](img/437055_1_En_4_Fig17_HTML.jpg)\n\
    \n    图 4-17\n    安装前的最后一步\n\n7.  确定有权访问此应用的用户。从以下列表中选择适当的选项：仅安装给管理员、所有用户或特定简档。\n\
    \n    **注意**：安装后，您可以向其他用户开放此应用的访问权限。\n\n8.  点击“安装”，如图 4-18 所示。\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig18_HTML.jpg](img/437055_1_En_4_Fig18_HTML.jpg)\n\
    \n    图 4-18\n    选择要安装给哪些用户\n\n9.  点击“完成”，应用完成安装后，您将被重定向到“已安装的包”部分（见图 4-19）。\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig19_HTML.jpg](img/437055_1_En_4_Fig19_HTML.jpg)\n\
    \n    图 4-19\n    已安装和未安装包的详细信息\n"
- fmt: "# Installed Packages\n\nInstalled apps create a package of components and\
    \ dependencies. This includes custom objects, Visualforce pages, and Apex classes\
    \ and code. The installed app can come in the form of a managed or unmanaged package.\n\
    \n- A *managed package* contains restrictions to the components installed.\n-\
    \ An *unmanaged package* has more flexibility and allows development on top of\
    \ any components installed.\n\nTo uninstall an app, navigate to the Installed\
    \ Packages area in Setup and click Uninstall.\n\nTo find details on any installed\
    \ apps, including all components and dependencies, click the name of the package,\
    \ as shown in Figure [4-20](#437055_1_En_4_Chapter.xhtml#Fig20). The details will\
    \ appear, as shown in Figure [4-21](#437055_1_En_4_Chapter.xhtml#Fig21).\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig21_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig21_HTML.jpg)\n\
    \nFigure 4-21 — Package details\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig20_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig20_HTML.jpg)\n\
    \nFigure 4-20 — Package name\n\nClick View Components for the complete breakdown,\
    \ by type, of everything installed, as shown in Figure [4-22](#437055_1_En_4_Chapter.xhtml#Fig22).\n\
    \n- *Visualforce page*: A Visualforce page is a custom-built page made up of Apex\
    \ classes and code, used to create a custom look and feel.\n- *Apex class*: An\
    \ Apex class is part of a unique Salesforce programming language that gives developers\
    \ and app builders the capability to create business logic.\n- *Custom object*:\
    \ This is used to store or build custom information. Custom objects can be used\
    \ to link information to standard objects.\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig22_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig22_HTML.jpg)\n\
    \nFigure 4-22 — Viewing your package components\n\n## Lightning Component\n\n\
    Lightning components are reusable containers of prebuilt tools and elements. These\
    \ components can be added to your pages to ramp up the productiveness of your\
    \ end users. As mentioned earlier in the book, components can easily be dragged\
    \ and dropped into your desired page. Salesforce makes this easy to do without\
    \ a developer and without code. Discover these tools by searching through the\
    \ marketplace, as shown in Figure [4-23](#437055_1_En_4_Chapter.xhtml#Fig23).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig23_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig23_HTML.jpg)\n\
    \nFigure 4-23 — Lightning Components search page\n\nTo download a component, follow\
    \ the same steps used to download an app.\n\n## Find a Consultant\n\nConsultants\
    \ are registered and often certified Salesforce partners. They help make up the\
    \ Salesforce ecosystem by providing custom Salesforce solutions and implementations.\
    \ Consultants typically provide Salesforce training, implementation solutions,\
    \ quick-start packages, data migration, and more.\n\nYour Salesforce account executive\
    \ will often recommend a Salesforce consulting partner. Typically a discovery\
    \ or scoping call with a consultant follows, and a quote with timeframe, deliverables,\
    \ and cost is provided.\n\nSimilar to app browsing, browse through a list of consultants\
    \ and sort by the type of service, specialization, tier, territory, and more.\n\
    \n1. Select Consultants from the top of the page, as shown in Figure [4-24](#437055_1_En_4_Chapter.xhtml#Fig24).\n\
    \n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig24_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig24_HTML.jpg)\n\
    \n   Figure 4-24 — Consultants tab\n\n2. Select a consulting page (shown in Figure\
    \ [4-25](#437055_1_En_4_Chapter.xhtml#Fig25)) to view more details (shown in Figure\
    \ [4-26](#437055_1_En_4_Chapter.xhtml#Fig26)).\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig26_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig26_HTML.jpg)\n\
    \n   Figure 4-26 — Cloud Creations consultant detail page\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig25_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig25_HTML.jpg)\n\
    \n   Figure 4-25 — Cloud Creations, consulting company\n\n3. Find more details\
    \ about this prospective consultant, including the number of projects completed,\
    \ satisfactory ratings, geographic focus, and more on this page (shown in Figure\
    \ [4-27](#437055_1_En_4_Chapter.xhtml#Fig27)). You can also find the consultant’s\
    \ contact information here to contact them for services.\n\n4. Contact the consultant\
    \ and request a quote.\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig27_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig27_HTML.jpg)\n\
    \n   Figure 4-27 — Details section on consultant\n\n### Tip\n\nConsultants often\
    \ employ a mix of project managers, business analysts, developers, and specialists.\
    \ Hourly rates vary widely and typically include a scoping call to identify the\
    \ right solution for your business. The more detail you can give your potential\
    \ consultant, the more accurate the cost estimate will be.\n\n## Summary\n\nThe\
    \ AppExchange marketplace consists of the Salesforce ecosystem of app partners\
    \ and consultants. It is a growing market and is expected to make big changes\
    \ in the near future. Visit the AppExchange marketplace to maximize your Salesforce\
    \ setup.\n\n# 5. Lightning Reports and Dashboards\n\nSalesforce reports and dashboards\
    \ give you necessary insight into the data that you have collected in Salesforce.\
    \ Every custom field and the majority of standard fields in any Salesforce object\
    \ can be used in a Salesforce report. Salesforce dashboards help you to display\
    \ this data in 11 different visual charts and tables. One report can be used in\
    \ several dashboard components; however, a dashboard component can use only one\
    \ report. A dashboard can display up to 20 dashboard components. Figure [5-1](#437055_1_En_5_Chapter.xhtml#Fig1)\
    \ shows the report that comes standard on your user’s home page in Lightning.\n\
    \n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig1_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig1_HTML.jpg)\n\
    \nFigure 5-1 — The home screen of opportunity performance by quarter in Salesforce\n\
    \n## Understanding Reports and Report Features\n\nReports allow you to see your\
    \ data based on specific criteria that you define. Once you have defined your\
    \ criteria, you can group your data, create a chart for easy viewing, filter your\
    \ data further, and store the report for later use in report folders. In these\
    \ next couple of sections, we’ll cover some of the functions available in the\
    \ report builder that are necessary to understand, and then we’ll jump into building\
    \ your report.\n\n### Report Types\n\nReport types allow you to define what objects\
    \ and fields are available to you when creating a report. You can create report\
    \ types based on a relationship with an object to a related object. A good example\
    \ of this type of relationship is accounts and their related opportunities. Your\
    \ opportunities would be the primary object, and the account would be the related.\
    \ Don’t worry, you don’t need to create report types to start using Salesforce\
    \ reports because out of the box Salesforce has set up the standard objects for\
    \ you. However, if you find a field missing on a report or you can’t find a custom\
    \ object related to another, you’ll want to continue reading. Or if the standard-use\
    \ report types don’t work for your business, you can customize your own!"
  raw: "## Installed Packages\n\nInstalled apps create a package of components and\
    \ dependencies. This includes custom objects, Visualforce pages, and Apex classes\
    \ and code. The installed app can come in the form of a managed or unmanaged package.\n\
    \n*   A *managed package* contains restrictions to the components installed.\n\
    \n*   An *unmanaged package* has more flexibility and allows development on top\
    \ of any components installed.\n\nTo uninstall an app, navigate to the Installed\
    \ Packages area in Setup and click Uninstall.\n\nTo find details on any installed\
    \ apps, including all components and dependencies, click the name of the package,\
    \ as shown in Figure [4-20](#437055_1_En_4_Chapter.xhtml#Fig20). The details will\
    \ appear, as shown in Figure [4-21](#437055_1_En_4_Chapter.xhtml#Fig21).\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig21_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig21_HTML.jpg)\n\
    \nFigure 4-21\n\nPackage details\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig20_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig20_HTML.jpg)\n\
    \nFigure 4-20\n\nPackage name\n\nClick View Components for the complete breakdown,\
    \ by type, of everything installed, as shown in Figure [4-22](#437055_1_En_4_Chapter.xhtml#Fig22).\n\
    \n*   *Visualforce page*: A Visualforce page is a custom-built page made up of\
    \ Apex classes and code, used to create a custom look and feel.\n\n*   *Apex class*:\
    \ An Apex class is part of a unique Salesforce programming language that gives\
    \ developers and app builders the capability to create business logic.\n\n*  \
    \ *Custom object*: This is used to store or build custom information. Custom objects\
    \ can be used to link information to standard objects.\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig22_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig22_HTML.jpg)\n\
    \nFigure 4-22\n\nViewing your package components\n\n## Lightning Component\n\n\
    Lightning components are reusable containers of prebuilt tools and elements. These\
    \ components can be added to your pages to ramp up the productiveness of your\
    \ end users. As mentioned earlier in the book, components can easily be dragged\
    \ and dropped into your desired page. Salesforce makes this easy to do without\
    \ a developer and without code. Discover these tools by searching through the\
    \ marketplace, as shown in Figure [4-23](#437055_1_En_4_Chapter.xhtml#Fig23).\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig23_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig23_HTML.jpg)\n\
    \nFigure 4-23\n\nLightning Components search page\n\nTo download a component,\
    \ follow the same steps used to download an app.\n\n## Find a Consultant\n\nConsultants\
    \ are registered and often certified Salesforce partners. They help make up the\
    \ Salesforce ecosystem by providing custom Salesforce solutions and implementations.\
    \ Consultants typically provide Salesforce training, implementation solutions,\
    \ quick-start packages, data migration, and more.\n\nYour Salesforce account executive\
    \ will often recommend a Salesforce consulting partner. Typically a discovery\
    \ or scoping call with a consultant follows, and a quote with timeframe, deliverables,\
    \ and cost is provided.\n\nSimilar to app browsing, browse through a list of consultants\
    \ and sort by the type of service, specialization, tier, territory, and more.\n\
    \n1.  Select Consultants from the top of the page, as shown in Figure [4-24](#437055_1_En_4_Chapter.xhtml#Fig24).\n\
    \n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig24_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig24_HTML.jpg)\n\
    \n    Figure 4-24\n\n    Consultants tab\n\n2.  Select a consulting page (shown\
    \ in Figure [4-25](#437055_1_En_4_Chapter.xhtml#Fig25)) to view more details (shown\
    \ in Figure [4-26](#437055_1_En_4_Chapter.xhtml#Fig26)).\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig26_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig26_HTML.jpg)\n\
    \n    Figure 4-26\n\n    Cloud Creations consultant detail page\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig25_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig25_HTML.jpg)\n\
    \n    Figure 4-25\n\n    Cloud Creations, consulting company\n\n3.  Find more\
    \ details about this prospective consultant, including the number of projects\
    \ completed, satisfactory ratings, geographic focus, and more on this page (shown\
    \ in Figure [4-27](#437055_1_En_4_Chapter.xhtml#Fig27)). You can also find the\
    \ consultant’s contact information here to contact them for services.\n\n4.  Contact\
    \ the consultant and request a quote.\n\n    ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig27_HTML.jpg](images/437055_1_En_4_Chapter/437055_1_En_4_Fig27_HTML.jpg)\n\
    \n    Figure 4-27\n\n    Details section on consultant\n\n### Tip\n\nConsultants\
    \ often employ a mix of project managers, business analysts, developers, and specialists.\
    \ Hourly rates vary widely and typically include a scoping call to identify the\
    \ right solution for your business. The more detail you can give your potential\
    \ consultant, the more accurate the cost estimate will be.\n\n## Summary\n\nThe\
    \ AppExchange marketplace consists of the Salesforce ecosystem of app partners\
    \ and consultants. It is a growing market and is expected to make big changes\
    \ in the near future. Visit the AppExchange marketplace to maximize your Salesforce\
    \ setup.\n\n# 5. Lightning Reports and Dashboards\n\nSalesforce reports and dashboards\
    \ give you necessary insight into the data that you have collected in Salesforce.\
    \ Every custom field and the majority of standard fields in any Salesforce object\
    \ can be used in a Salesforce report. Salesforce dashboards help you to display\
    \ this data in 11 different visual charts and tables. One report can be used in\
    \ several dashboard components; however, a dashboard component can use only one\
    \ report. A dashboard can display up to 20 dashboard components. Figure [5-1](#437055_1_En_5_Chapter.xhtml#Fig1)\
    \ shows the report that comes standard on your user’s home page in Lightning .\n\
    \n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig1_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig1_HTML.jpg)\n\
    \nFigure 5-1\n\nThe home screen of opportunity performance by quarter in Salesforce\n\
    \n## Understanding Reports and Report Features\n\nReports allow you to see your\
    \ data based on specific criteria that you define. Once you have defined your\
    \ criteria, you can group your data, create a chart for easy viewing, filter your\
    \ data further, and store the report for later use in report folders. In these\
    \ next couple of sections, we’ll cover some of the functions available in the\
    \ report builder that are necessary to understand, and then we’ll jump into building\
    \ your report.\n\n### Report Types\n\nReport types allow you to define what objects\
    \ and fields are available to you when creating a report. You can create report\
    \ types based on a relationship with an object to a related object. A good example\
    \ of this type of relationship is accounts and their related opportunities. Your\
    \ opportunities would be the primary object, and the account would be the related.\
    \ Don’t worry, you don’t need to create report types to start using Salesforce\
    \ reports because out of the box Salesforce has set up the standard objects for\
    \ you. However, if you find a field missing on a report or you can’t find a custom\
    \ object related to another, you’ll want to continue reading. Or if the standard-use\
    \ report types don’t work for your business, you can customize your own!"
  trans: "\n# 已安装的软件包\n\n已安装的应用会创建一个包含组件和依赖项的软件包。这包括自定义对象、Visualforce 页面以及 Apex 类和代码。已安装的应用可以以受管软件包或非受管软件包的形式提供。\n\
    \n-   *受管软件包*对所安装的组件有限制。\n-   *非受管软件包*则更加灵活，允许在已安装的任何组件之上进行开发。\n\n要卸载应用，请导航至“设置”中的“已安装的软件包”区域，然后单击“卸载”。\n\
    \n要查找任何已安装应用的详细信息，包括所有组件和依赖项，请单击软件包名称，如图 4-20 所示。随后将显示详细信息，如图 4-21 所示。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig21_HTML.jpg](img/437055_1_En_4_Fig21_HTML.jpg)\n\
    \n图 4-21 — 软件包详情\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig20_HTML.jpg](img/437055_1_En_4_Fig20_HTML.jpg)\n\
    \n图 4-20 — 软件包名称\n\n单击“查看组件”可获取所有已安装内容的完整分类（按类型），如图 4-22 所示。\n\n-   *Visualforce\
    \ 页面*：Visualforce 页面是由 Apex 类和代码构成的自定义页面，用于创建自定义的外观和体验。\n-   *Apex 类*：Apex 类是\
    \ Salesforce 独有编程语言的一部分，它为开发者和应用构建者提供了创建业务逻辑的能力。\n-   *自定义对象*：用于存储或构建自定义信息。自定义对象可用于将信息链接到标准对象。\n\
    \n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig22_HTML.jpg](img/437055_1_En_4_Fig22_HTML.jpg)\n\
    \n图 4-22 — 查看您的软件包组件\n\n## Lightning 组件\n\nLightning 组件是可重复使用的预构建工具和元素容器。您可以将这些组件添加到页面中，以提高最终用户的生产力。如本书前面所述，组件可以轻松拖放到您想要的页面中。Salesforce\
    \ 使得无需开发者和编写代码即可轻松完成此操作。通过在市场中搜索来发现这些工具，如图 4-23 所示。\n\n![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig23_HTML.jpg](img/437055_1_En_4_Fig23_HTML.jpg)\n\
    \n图 4-23 — Lightning 组件搜索页面\n\n要下载组件，请遵循与应用相同的下载步骤。\n\n## 寻找顾问\n\n顾问是已注册且通常经过认证的\
    \ Salesforce 合作伙伴。他们通过提供自定义的 Salesforce 解决方案和实施来帮助构建 Salesforce 生态系统。顾问通常提供 Salesforce\
    \ 培训、实施解决方案、快速入门包、数据迁移等服务。\n\n您的 Salesforce 客户经理通常会推荐一个 Salesforce 咨询合作伙伴。之后通常会与顾问进行一次发现或范围界定电话会议，并提供包含时间表、可交付成果和成本的报价。\n\
    \n类似于浏览应用，您可以浏览顾问列表，并按服务类型、专长、等级、区域等进行排序。\n\n1.  从页面顶部选择“顾问”选项卡，如图 4-24 所示。\n\n\
    \   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig24_HTML.jpg](img/437055_1_En_4_Fig24_HTML.jpg)\n\
    \n   图 4-24 — 顾问选项卡\n\n2.  选择一个咨询页面（图 4-25）以查看更详细的信息（图 4-26）。\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig26_HTML.jpg](img/437055_1_En_4_Fig26_HTML.jpg)\n\
    \n   图 4-26 — Cloud Creations 顾问详情页面\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig25_HTML.jpg](img/437055_1_En_4_Fig25_HTML.jpg)\n\
    \n   图 4-25 — Cloud Creations 咨询公司\n\n3.  在此页面上查找有关这位潜在顾问的更多详细信息，包括已完成的项目数量、满意度评级、地理重点等（如图\
    \ 4-27 所示）。您还可以在此页面找到顾问的联系信息，以便联系他们获取服务。\n\n4.  联系顾问并请求报价。\n\n   ![../images/437055_1_En_4_Chapter/437055_1_En_4_Fig27_HTML.jpg](img/437055_1_En_4_Fig27_HTML.jpg)\n\
    \n   图 4-27 — 顾问详细信息部分\n\n### 提示\n\n顾问通常会雇佣项目经理、业务分析师、开发人员和专家。按时计费差异很大，通常包括一次范围界定电话会议，以确定为您的企业提供合适的解决方案。您向潜在顾问提供的信息越详细，成本估算就越准确。\n\
    \n## 总结\n\nAppExchange 市场由 Salesforce 生态系统中的应用合作伙伴和顾问组成。这是一个不断增长的市场，预计在不久的将来会发生重大变化。访问\
    \ AppExchange 市场，充分利用您的 Salesforce 设置。\n\n# 5. Lightning 报表和仪表板\n\nSalesforce\
    \ 报表和仪表板为您提供了对在 Salesforce 中收集的数据的必要洞察。任何 Salesforce 对象中的每个自定义字段和大多数标准字段都可以在 Salesforce\
    \ 报表中使用。Salesforce 仪表板帮助您以 11 种不同的可视化图表和表格形式显示这些数据。一个报表可以用于多个仪表板组件；但是，一个仪表板组件只能使用一个报表。一个仪表板最多可以显示\
    \ 20 个仪表板组件。图 5-1 显示了在 Lightning 中用户主页面上标配的报表。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig1_HTML.jpg](img/437055_1_En_5_Fig1_HTML.jpg)\n\
    \n图 5-1 — Salesforce 中按季度划分商机绩效的主屏幕\n\n## 了解报表与报表功能\n\n报表允许您根据自己定义的特定条件查看数据。一旦定义了条件，您就可以对数据进行分组、创建图表以便于查看、进一步筛选数据，并将报表存储到报表文件夹中以备将来使用。在接下来的几个部分中，我们将介绍报表构建器中一些必须了解的功能，然后我们将开始构建您的报表。\n\
    \n### 报表类型\n\n报表类型允许您定义在创建报表时可用的对象和字段。您可以根据对象与相关对象的关系来创建报表类型。这类关系的一个典型例子是客户及其相关的商机。您的商机将是主对象，而客户则是相关对象。别担心，您无需创建报表类型即可开始使用\
    \ Salesforce 报表，因为 Salesforce 开箱即用已为您设置了标准对象。但是，如果您发现报表中缺少某个字段，或者找不到与另一个对象关联的自定义对象，请继续阅读。或者，如果标准报表类型不适合您的业务，您可以自定义自己的报表类型！\n"
- fmt: '### Creating Report Types


    The process to create report types is as follows:


    1. Click the settings cog icon in the right corner of the browser, as shown in
    Figure [5-2](#437055_1_En_5_Chapter.xhtml#Fig2).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig2_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig2_HTML.jpg)


    Figure 5-2: Navigating to the Setup menu


    2. In the Quick Find box, search for `report types` (do not press Enter) and select
    the yellow highlighted phrase `Report Types`, as shown in Figure [5-3](#437055_1_En_5_Chapter.xhtml#Fig3).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig3_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig3_HTML.jpg)


    Figure 5-3: Accessing the report types


    **Tip** Salesforce offers help on most of its administrative processes. If you
    are seeing "What is a Custom Report Type?" instead, feel free to read this content
    too and then click Continue. You can also click "Don’t show me this page again"
    to disable this window in the future, as shown in Figure [5-4](#437055_1_En_5_Chapter.xhtml#Fig4).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig4_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig4_HTML.jpg)


    Figure 5-4: Custom Report Types help page


    3. Click `New Custom Report Type`, as shown in Figure [5-5](#437055_1_En_5_Chapter.xhtml#Fig5).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig5_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig5_HTML.jpg)


    Figure 5-5: Creating a new custom report type


    4. Select the primary object from the drop-down field that your report should
    have, as shown in Figure [5-6](#437055_1_En_5_Chapter.xhtml#Fig6).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig6_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig6_HTML.jpg)


    Figure 5-6: Creating a customer report type


    5. Label your report type. This label will be displayed to your users when they
    are selecting the report type for the report builder. After you have finished
    your name, hit your Tab key, and Salesforce will automatically create the report
    type name.


    6. Type a description for the report type. This will be visible to users who use
    this report type.


    7. Select the category where this report type should be stored. For example, if
    the report type created was an opportunity and contact report, you should put
    it in the `Opportunity` folder. If the report type was a combination of multiple
    objects, you can choose to store it in one of those object''s folders.


    8. Select what status this report type should be in. Selecting the `In Development`
    radio button will hide this report type for all users except administrators or
    those with delegated permissions. Selecting the `Deployed` status will make this
    report type visible to all users who have access to the report builder. You can
    always come back and select the `Deployed` option when you have finished and tested
    your report type.


    9. Click `Next`.


    10. Select "Click to relate another object," as shown in Figure [5-7](#437055_1_En_5_Chapter.xhtml#Fig7).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig7_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig7_HTML.jpg)


    Figure 5-7: Relating another object for your custom report type


    11. Click the `Select Object` drop-down to choose your related object for this
    report type, as shown in Figure [5-8](#437055_1_En_5_Chapter.xhtml#Fig8).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig8_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig8_HTML.jpg)


    Figure 5-8: Relating another object to your customer report type


    **Note** If you are not seeing the object you want to relate to this object, it
    means that there is no connection between these objects. To create a connection,
    you''ll need to create a lookup field on the related object to the primary object.
    Before data will populate this report, that field on your records will have to
    be filled with a primary object record. Building custom objects and fields is
    simpler than you think. We don''t cover how to do that in this book, but Salesforce
    offers great "trailheads" on this topic. Go to [`https://trailhead.salesforce.com`](https://trailhead.salesforce.com)
    to find your trailhead and further your education.


    12. In Figure [5-9](#437055_1_En_5_Chapter.xhtml#Fig9), you''ll have two choices
    shown under A to B Relationships. The option "each ''A'' record must have at least
    one related ''B'' record" will only show B records where at least one A is related
    to it. For example, all contacts that are related to accounts will show, but if
    you have a contact that has no relation to an account, it won''t show. The option
    "''A" record may or may not have related to ''B'' records" will show all B records
    whether or not they are related to your A record.


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig9_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig9_HTML.jpg)


    Figure 5-9: Choose the type of relationship the two objects have for this report
    type.


    13. Click "Click to relate another object" to select your next object.


    14. Click the `Select Object` drop-down to choose your next related object for
    this report type.


    15. Choose between the two radio buttons under A to B Relationships.


    16. Repeat steps 13 through 15 to relate more objects for this report if necessary.


    17. Click `Save`, as shown in Figure [5-10](#437055_1_En_5_Chapter.xhtml#Fig10).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig10_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig10_HTML.jpg)


    Figure 5-10: Relating another object to your custom report type


    ### Note


    If you add new fields to your objects after creating a custom report type, you''ll
    have to add the new fields to the report type. You can do this by going to Setup,
    clicking your report type name, and clicking `Edit Layout` under "Fields Available
    for reports." This is shown in Figure [5-11](#437055_1_En_5_Chapter.xhtml#Fig11).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig11_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig11_HTML.jpg)


    Figure 5-11: Adding new custom fields to your existing customer report types


    ### Report Formats


    Salesforce in Lightning Experience offers three report formats. Each format allows
    you to customize your report differently. Whether you are using `Tabular` format
    to generate a call list, `Summary` format to show data grouped horizontally, or
    `Matrix` format to summarize your data by both rows and columns, Salesforce has
    the proper format for you. You also have an additional report format, `Joined
    reports`, that you can use; however, you need to switch to Salesforce Classic
    to build and view these types of reports. Each report format has its strengths;
    let''s look into these a little further. Figure [5-12](#437055_1_En_5_Chapter.xhtml#Fig12)
    shows where you can make this adjustment between report formats.


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig12_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig12_HTML.jpg)


    Figure 5-12: Switching report formats'
  raw: '#### Creating Report Types


    The process to create report types is as follows:


    1.  Click the settings cog icon in the right corner of the browser, as shown in
    Figure [5-2](#437055_1_En_5_Chapter.xhtml#Fig2).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig2_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Navigating to the Setup menu


    2.  In the Quick Find box, search for *report types* (do not press Enter) and
    select the yellow highlighted phrase Report Types, as shown in Figure [5-3](#437055_1_En_5_Chapter.xhtml#Fig3).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig3_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Accessing the report types


    **Tip** Salesforce offers help on most of its administrative processes. If you
    are seeing “What is a Custom Report Type?” instead, feel free to read this content
    too and then click Continue. You can also click “Don’t show me this page again”
    to disable this window in the future, as shown in Figure [5-4](#437055_1_En_5_Chapter.xhtml#Fig4).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig4_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Custom Report Types help page


    3.  Click New Custom Report Type, as shown in Figure [5-5](#437055_1_En_5_Chapter.xhtml#Fig5).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig5_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Creating a new custom report type


    4.  Select the primary object from the drop-down field that your report should
    have, as shown in Figure [5-6](#437055_1_En_5_Chapter.xhtml#Fig6).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig6_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Creating a customer report type


    5.  Label your report type. This label will be displayed to your users when they
    are selecting the report type for the report builder. After you have finished
    your name, hit your Tab key, and Salesforce will automatically create the report
    type name.


    6.  Type a description for the report type. This will be visible to users who
    use this report type.


    7.  Select the category where this report type should be stored. For example,
    if the report type created was an opportunity and contact report, you should put
    it in the Opportunity folder. If the report type was a combination of multiple
    objects, you can choose to store it in one of those object’s folders.


    8.  Select what status this report type should be in. Selecting the In Development
    radio button will hide this report type for all users except administrators or
    those with delegated permissions. Selecting the Deployed status will make this
    report type visible to all users who have access to the report builder. You can
    always come back and select the Deployed option when you have finished and tested
    your report type.


    9.  Click Next.


    10.  Select “Click to relate another object,” as shown in Figure [5-7](#437055_1_En_5_Chapter.xhtml#Fig7).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig7_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Relating another object for your custom report type


    11.  Click the Select Object drop-down to choose your related object for this
    report type, as shown in Figure [5-8](#437055_1_En_5_Chapter.xhtml#Fig8).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig8_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    Relating another object to your customer report type


    **Note** If you are not seeing the object you want to relate to this object, it
    means that there is no connection between these objects. To create a connection,
    you’ll need to create a lookup field on the related object to the primary object.
    Before data will populate this report, that field on your records will have to
    be filled with a primary object record. Building custom objects and fields is
    simpler than you think. We don’t cover how to do that in this book, but Salesforce
    offers great “trailheads” on this topic. Go to [`https://trailhead.salesforce.com`](https://trailhead.salesforce.com)
    to find your trailhead and further your education.


    12.  In Figure [5-9](#437055_1_En_5_Chapter.xhtml#Fig9), you’ll have two choices
    shown under A to B Relationships. The option “each ‘A’ record must have at least
    one related ‘B’ record” will only show B records where at least one A is related
    to it. For example, all contacts that are related to accounts will show, but if
    you have a contact that has no relation to an account, it won’t show. The option
    “‘A” record may or may not have related to ‘B’ records” will show all B records
    whether or not they are related to your A record.


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig9_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    Choose the type of relationship the two objects have for this report type.


    13.  Click “Click to relate another object” to select your next object.


    14.  Click the Select Object drop-down to choose your next related object for
    this report type.


    15.  Choose between the two radio buttons under A to B Relationships.


    16.  Repeat steps 13 through 15 to relate more objects for this report if necessary.


    17.  Click Save, as shown in Figure [5-10](#437055_1_En_5_Chapter.xhtml#Fig10).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig10_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Relating another object to your custom report type


    ### Note


    If you add new fields to your objects after creating a custom report type, you’ll
    have to add the new fields to the report type. You can do this by going to Setup,
    clicking your report type name, and clicking Edit Layout under “Fields Available
    for reports.” This is shown in Figure [5-11](#437055_1_En_5_Chapter.xhtml#Fig11).


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig11_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Adding new custom fields to your existing customer report types


    ### Report Formats


    Salesforce in Lightning Experience offers three report formats . Each format allows
    you to customize your report differently. Whether you are using Tabular format
    to generate a call list, Summary format to show data grouped horizontally, or
    Matrix format to summarize your data by both rows and columns, Salesforce has
    the proper format for you. You also have an additional report format, Joined reports,
    that you can use; however, you need to switch to Salesforce Classic to build and
    view these types of reports. Each report format has its strengths; let’s look
    into these a little further. Figure [5-12](#437055_1_En_5_Chapter.xhtml#Fig12)
    shows where you can make this adjustment between report formats.


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig12_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig12_HTML.jpg)


    Figure 5-12


    Switching report formats'
  trans: '

    ### 创建报表类型


    创建报表类型的步骤如下：


    1.  点击浏览器右上角的设置齿轮图标，如图 5-2 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig2_HTML.jpg](img/437055_1_En_5_Fig2_HTML.jpg)


    图 5-2：导航至“设置”菜单


    2.  在快速查找框中，搜索 `report types`（不要按回车键），并选择黄色高亮的短语 `Report Types`，如图 5-3 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig3_HTML.jpg](img/437055_1_En_5_Fig3_HTML.jpg)


    图 5-3：访问报表类型


    **提示** Salesforce 对其大部分管理流程都提供了帮助。如果您看到的是“什么是自定义报表类型？”，也可以阅读此内容，然后点击“继续”。您也可以点击“不再显示此页面”来禁用该窗口，如图
    5-4 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig4_HTML.jpg](img/437055_1_En_5_Fig4_HTML.jpg)


    图 5-4：自定义报表类型帮助页面


    3.  点击 `New Custom Report Type`，如图 5-5 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig5_HTML.jpg](img/437055_1_En_5_Fig5_HTML.jpg)


    图 5-5：创建新的自定义报表类型


    4.  从下拉字段中选择报表应包含的主对象，如图 5-6 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig6_HTML.jpg](img/437055_1_En_5_Fig6_HTML.jpg)


    图 5-6：创建客户报表类型


    5.  为您的报表类型命名。当用户在报表生成器中选择报表类型时，该标签将显示给他们。完成命名后，按 Tab 键，Salesforce 将自动创建报表类型名称。


    6.  为报表类型输入描述。此描述将对使用该报表类型的用户可见。


    7.  选择此报表类型应存储的类别。例如，如果创建的报表类型是机会和联系人报表，则应将其放入 `Opportunity` 文件夹。如果报表类型是多个对象的组合，您可以选择将其存储在其中一个对象的文件夹中。


    8.  选择此报表类型应处于的状态。选择 `In Development` 单选按钮将向除管理员或拥有委派权限的用户之外的所有用户隐藏此报表类型。选择 `Deployed`
    状态将使所有有权访问报表生成器的用户都能看到此报表类型。当您完成并测试了报表类型后，随时可以返回并选择 `Deployed` 选项。


    9.  点击 `Next`。


    10.  选择“点击关联另一个对象”，如图 5-7 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig7_HTML.jpg](img/437055_1_En_5_Fig7_HTML.jpg)


    图 5-7：为您的自定义报表类型关联另一个对象


    11.  点击 `Select Object` 下拉菜单，为此报表类型选择您的相关对象，如图 5-8 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig8_HTML.jpg](img/437055_1_En_5_Fig8_HTML.jpg)


    图 5-8：为您的客户报表类型关联另一个对象


    **注意** 如果您没有看到要关联到此对象的对象，这意味着这些对象之间没有连接。要创建连接，您需要在相关对象上创建一个指向主对象的查找字段。在数据填充此报表之前，您记录中的该字段必须填写一个主对象记录。构建自定义对象和字段比您想象的要简单。本书不涉及如何执行此操作，但
    Salesforce 提供了关于此主题的优秀“trailheads”。请访问 [`https://trailhead.salesforce.com`](https://trailhead.salesforce.com)
    查找您的 trailhead 并进一步学习。


    12.  在图 5-9 中，您将在 A 到 B 关系下看到两个选项。选项“每个 ''A'' 记录必须至少有一个相关的 ''B'' 记录”将仅显示至少有一个
    A 与之相关的 B 记录。例如，将显示所有与帐户相关的联系人，但如果您有一个与任何帐户都没有关联的联系人，则不会显示。选项“''A'' 记录可能有关联的 ''B''
    记录，也可能没有”将显示所有 B 记录，无论它们是否与您的 A 记录相关。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig9_HTML.jpg](img/437055_1_En_5_Fig9_HTML.jpg)


    图 5-9：为此报表类型选择两个对象之间的关系类型。


    13.  点击“点击关联另一个对象”以选择您的下一个对象。


    14.  点击 `Select Object` 下拉菜单，为此报表类型选择您的下一个相关对象。


    15.  在 A 到 B 关系下选择两个单选按钮之一。


    16.  如有必要，重复步骤 13 到 15 以关联更多对象到此报表。


    17.  点击 `Save`，如图 5-10 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig10_HTML.jpg](img/437055_1_En_5_Fig10_HTML.jpg)


    图 5-10：为您的自定义报表类型关联另一个对象


    ### 注意


    如果在创建自定义报表类型后向对象添加了新字段，则必须将这些新字段添加到报表类型中。您可以通过转到“设置”，点击您的报表类型名称，然后在“报表可用字段”下点击
    `Edit Layout` 来完成此操作。如图 5-11 所示。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig11_HTML.jpg](img/437055_1_En_5_Fig11_HTML.jpg)


    图 5-11：向现有客户报表类型添加新的自定义字段


    ### 报表格式


    Lightning Experience 中的 Salesforce 提供三种报表格式。每种格式允许您以不同方式自定义报表。无论您是使用 `Tabular`
    格式生成呼叫列表，使用 `Summary` 格式按水平分组显示数据，还是使用 `Matrix` 格式按行和列总结数据，Salesforce 都有适合您的格式。您还可以使用一个额外的报表格式
    `Joined reports`；但是，您需要切换到 Salesforce Classic 才能构建和查看这些类型的报表。每种报表格式都有其优势；让我们进一步探讨。图
    5-12 显示了您可以在何处对不同报表格式进行调整。


    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig12_HTML.jpg](img/437055_1_En_5_Fig12_HTML.jpg)


    图 5-12：切换报表格式

