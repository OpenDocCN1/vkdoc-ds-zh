    \nFigure 8-25\n\nSearching for Data Import Wizard\n\n4.  Click the green Launch\
    \ Wizard! button , as shown in Figure [8-26](#437055_1_En_8_Chapter.xhtml#Fig26).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig26_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig26_HTML.jpg)\n\
    \nFigure 8-26\n\nLaunching the Salesforce wizard\n\n5.  Under the “What kind of\
    \ data are you importing?” question, click Leads on the “Standard objects” tab,\
    \ as shown in Figure [8-27](#437055_1_En_8_Chapter.xhtml#Fig27).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig27_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig27_HTML.jpg)\n\
    \nFigure 8-27\n\nWhat kind of data are you importing?\n\n6.  Under the “What do\
    \ you want to do?” question, click “Add new records,” and the following information\
    \ will appear:\n    *   *Match Lead by*: This allows you to match your CSV data\
    \ to an existing lead contact if it already exists in Salesforce by the full name\
    \ of the lead, email, or any field you have created and made a unique ID or external\
    \ ID. This helps to prevent duplication from being imported. You would want to\
    \ choose which you think is the best match. Most commonly email is used.\n\n*\
    \   *Assign New Leads to this Source*: This allows you to select what lead source\
    \ all the leads should be assigned to. If you have an import that is not a mixture\
    \ of lead sources, you can use this function. For example, if you just attended\
    \ a conference and you want to show that all these leads came from that conference,\
    \ you would globally assign all the imported leads from this list to that lead\
    \ source. If you have a mixture of sources where your leads came from, you’ll\
    \ want to ignore this.\n\n*   *Assign all leads using Assignment rules*: This\
    \ allows you to utilize a lead assignment rule you’ve created to auto-assign the\
    \ owner. The drop-down should include all your options that you created in lead\
    \ assignments. If all the leads you are importing need to be assigned to specific\
    \ users, you can ignore this feature. However, if you purchased a list and these\
    \ leads are up for anyone, you may want to let your auto-assignment rules handle\
    \ who gets what.\n\n*   *Assign leads to campaigns*: This allows you to add all\
    \ the imported leads to a campaign . You’ll just need to make sure to include\
    \ a column in your spreadsheet with that campaign ID. If you want to have all\
    \ the imported leads related to a campaign for an event or a campaign for an email\
    \ blast, you can do this with this function.\n\n7.  Salesforce allows for automated\
    \ process made with workflow rules or the Process Builder to be enabled to disabled.\
    \ By checking the box, you are enabling them to be active during this import.\
    \ This is important to consider if you have created actions that include email\
    \ and tasks as this could bombard your clients or users.\n\n8.  Under the “Where\
    \ is your data located?” question, you can drag and drop a CSV file into the “Drag\
    \ CSV file here to upload” area, as shown in Figures [8-28](#437055_1_En_8_Chapter.xhtml#Fig28)\
    \ and [8-29](#437055_1_En_8_Chapter.xhtml#Fig29). You can also click CSV, Outlook\
    \ CSV, ACT! CSV, or Gmail CSV. Then click Choose File, locate the file on your\
    \ machine, and click Open.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig29_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig29_HTML.jpg)\n\
    \nFigure 8-29\n\nWhere is your data located?\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig28_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig28_HTML.jpg)\n\
    \nFigure 8-28\n\nWhat do you want to do?\n\n9.  Once these steps are complete,\
    \ click the Next button at the bottom-right corner of your screen, as shown in\
    \ Figure [8-30](#437055_1_En_8_Chapter.xhtml#Fig30).\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig30_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig30_HTML.jpg)\n\
    \nFigure 8-30\n\nNext button\n\n10.  In the Edit Mapping field, this is where\
    \ you choose what column header is mapped to what Salesforce field on the lead.\
    \ If you set your column headers up correctly, you’ll see that Salesforce will\
    \ match all your columns to the fields in Salesforce, as shown in Figure [8-31](#437055_1_En_8_Chapter.xhtml#Fig31).\
    \ In Figure [8-32](#437055_1_En_8_Chapter.xhtml#Fig32), you’ll see that the headers\
    \ didn’t match the names of the fields. Steps 11 and 12 are additional steps to\
    \ follow if you did not match the headers of your columns to the field names they\
    \ are mapping to.\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig32_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig32_HTML.jpg)\n\
    \nFigure 8-32\n\nField mapping when you didn’t match your column headers to the\
    \ field names in Salesforce\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig31_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig31_HTML.jpg)\n\
    \nFigure 8-31\n\nField mapping when you matched your column headers to the field\
    \ names in Salesforce correctly\n\n11.  If you see a field in bold red , this\
    \ means that the field still needs to be mapped, as shown in Figure [8-33](#437055_1_En_8_Chapter.xhtml#Fig33).\
    \ To map a field or change a field already mapped, click the Map or Change hyperlink.\
    \ You can either type in the field name or use the scroll bar to find the field.\
    \ Select the appropriate field and click Map, as shown in Figure [8-34](#437055_1_En_8_Chapter.xhtml#Fig34).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig34_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig34_HTML.jpg)\n\
    \nFigure 8-34\n\nSelecting a field\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig33_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig33_HTML.jpg)\n\
    \nFigure 8-33\n\nFields shown as unmapped\n\n**Note** If you don’t create a record\
    \ owner field and you don’t choose to use your lead assignment rules in the import,\
    \ the records created will automatically be assigned to the user performing the\
    \ import. This could impact your organization if you have security set up that\
    \ eliminates users from seeing data. For example, if you have a role hierarchy\
    \ set up that puts you at the top of the hierarchy and you are the importing user,\
    \ users below you may not be able to see the records you’ve imported. This ultimately\
    \ means they can’t do their jobs.\n\n12.  Once you have reviewed that all the\
    \ columns are mapped to the appropriate fields , click the Next button at the\
    \ bottom-right corner, as shown in Figure [8-35](#437055_1_En_8_Chapter.xhtml#Fig35).\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig35_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig35_HTML.jpg)\n\
    \nFigure 8-35\n\nNext button\n\n13.  The Review & Start Import screen summarizes\
    \ what objects you’re importing to, what type of import it is (insert, update,\
    \ upsert), what CSV you are using for your import , how many fields are mapped,\
    \ and how many are unmapped, as shown in Figure [8-36](#437055_1_En_8_Chapter.xhtml#Fig36)."
  trans: "\n# 导入潜在客户\n\n理想情况下，您会发现需要不断导入新的潜在客户！无论是从参加的会议中获取的新线索，还是从购买的列表中获得，您都希望立即导入它们，以便您的销售团队能够跟进处理！以下步骤将向您展示如何快速完成此操作：\n\
    \n1.  准备要导入的数据。确保导入文件中的所有必填字段都已作为列填充。标准的`Salesforce`设置要求包含姓氏、公司名称和潜在客户状态。\n\n\
    2.  导航至`Setup`菜单，如图 8-24 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig24_HTML.jpg](img/437055_1_En_8_Fig24_HTML.jpg)\n\
    \n图 8-24  \n导航至`Salesforce`中的“设置”区域\n\n3.  在`Quick Find`区域，输入`Data import`（不要按`Enter`键；选项会随您的输入自动填充）。点击`Data\
    \ Import Wizard`，如图 8-25 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig25_HTML.jpg](img/437055_1_En_8_Fig25_HTML.jpg)\n\
    \n图 8-25  \n搜索`Data Import Wizard`\n\n4.  点击绿色的`Launch Wizard!`按钮，如图 8-26 所示。\n\
    \n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig26_HTML.jpg](img/437055_1_En_8_Fig26_HTML.jpg)\n\
    \n图 8-26  \n启动`Salesforce`向导\n\n5.  在“您要导入哪种类型的数据？”问题下，点击`Standard objects`选项卡上的`Leads`，如图\
    \ 8-27 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig27_HTML.jpg](img/437055_1_En_8_Fig27_HTML.jpg)\n\
    \n图 8-27  \n您要导入哪种类型的数据？\n\n6.  在“您想要做什么？”问题下，点击“添加新记录”，将显示以下信息：\n    *   `Match\
    \ Lead by`（匹配依据）：这允许您根据潜在客户的**全名**、**电子邮件**或您创建并设置为唯一 ID 或外部 ID 的任何字段，将 CSV 数据与`Salesforce`中已有的潜在客户或联系人进行匹配。这有助于防止导入重复数据。您应选择您认为最匹配的选项。最常用的是电子邮件。\n\
    \    *   `Assign New Leads to this Source`（将此来源分配给新潜在客户）：这允许您选择所有潜在客户应分配到的**潜在客户来源**。如果您的导入数据来源单一，可以使用此功能。例如，如果您刚参加完一个会议，并希望显示所有这些潜在客户都来自该会议，您可以在此列表中全局分配所有导入的潜在客户到该来源。如果您的潜在客户来源混杂，则应忽略此选项。\n\
    \    *   `Assign all leads using Assignment rules`（使用分配规则分配所有潜在客户）：这允许您利用已创建的潜在客户分配规则来自动分配**所有者**。下拉菜单应包含您在潜在客户分配中创建的所有选项。如果您导入的所有潜在客户都需要分配给特定用户，则可以忽略此功能。但是，如果您购买了列表，这些线索对任何人开放，您可能希望让自动分配规则来处理谁获得哪些线索。\n\
    \    *   `Assign leads to campaigns`（将潜在客户分配给营销活动）：这允许您将所有导入的潜在客户添加到一个**营销活动**中。您只需确保在电子表格中包含一列，其中含有该营销活动的\
    \ ID。如果您希望将所有导入的潜在客户与某个活动或邮件群发营销活动关联起来，可以使用此功能。\n\n7.  `Salesforce`允许启用或禁用通过工作流规则或`Process\
    \ Builder`创建的自动化流程。通过勾选复选框，您可在本次导入期间启用这些自动化流程。如果您创建了包含电子邮件和任务的操作，这一点很重要，因为可能会对您的客户或用户造成干扰。\n\
    \n8.  在“您的数据位于何处？”问题下，您可以将 CSV 文件拖放到“将 CSV 文件拖放到此处以上传”区域，如图 8-28 和 8-29 所示。您也可以点击`CSV`、`Outlook\
    \ CSV`、`ACT! CSV`或`Gmail CSV`。然后点击`Choose File`，在您的计算机上找到该文件，并点击`Open`。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig29_HTML.jpg](img/437055_1_En_8_Fig29_HTML.jpg)\n\
    \n图 8-29  \n您的数据位于何处？\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig28_HTML.jpg](img/437055_1_En_8_Fig28_HTML.jpg)\n\
    \n图 8-28  \n您想要做什么？\n\n9.  完成这些步骤后，点击屏幕右下角的`Next`按钮，如图 8-30 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig30_HTML.jpg](img/437055_1_En_8_Fig30_HTML.jpg)\n\
    \n图 8-30  \n`Next`按钮\n\n10. 在`Edit Mapping`字段中，您可以选择将哪个列标题映射到潜在客户的哪个`Salesforce`字段。如果您的列标题设置正确，您会看到`Salesforce`会将您的所有列与`Salesforce`中的字段自动匹配，如图\
    \ 8-31 所示。在图 8-32 中，您会看到标题与字段名称不匹配。如果您未将列标题与它们映射到的字段名称匹配，则需要执行步骤 11 和 12。\n\n\
    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig32_HTML.jpg](img/437055_1_En_8_Fig32_HTML.jpg)\n\
    \n图 8-32  \n当您未将列标题与`Salesforce`中的字段名称匹配时的字段映射\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig31_HTML.jpg](img/437055_1_En_8_Fig31_HTML.jpg)\n\
    \n图 8-31  \n当您正确地将列标题与`Salesforce`中的字段名称匹配时的字段映射\n\n11. 如果您看到某个字段以粗体红色显示，这意味着该字段仍需映射，如图\
    \ 8-33 所示。要映射字段或更改已映射的字段，请点击`Map`或`Change`超链接。您可以直接输入字段名称，或使用滚动条查找字段。选择合适的字段并点击`Map`，如图\
    \ 8-34 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig34_HTML.jpg](img/437055_1_En_8_Fig34_HTML.jpg)\n\
    \n图 8-34  \n选择字段\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig33_HTML.jpg](img/437055_1_En_8_Fig33_HTML.jpg)\n\
    \n图 8-33  \n显示为未映射的字段\n\n**注** 如果您没有创建记录所有者字段，并且没有选择在导入中使用潜在客户分配规则，则创建的记录将自动分配给执行导入的用户。如果您设置了限制用户查看数据的安全权限，这可能会影响您的组织。例如，如果您设置了角色层级，且您位于层级顶部并执行导入，则层级低于您的用户可能无法看到您导入的记录。这最终意味着他们无法正常工作。\n\
    \n12. 在您确认所有列都已映射到适当字段后，点击右下角的`Next`按钮，如图 8-35 所示。\n\n![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig35_HTML.jpg](img/437055_1_En_8_Fig35_HTML.jpg)\n\
    \n图 8-35  \n`Next`按钮\n\n13. `Review & Start Import`屏幕会汇总您要导入的对象、导入类型（`插入`、`更新`、`更新或插入`）、用于导入的\
    \ CSV 文件、已映射的字段数以及未映射的字段数，如图 8-36 所示。\n"
- fmt: '![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig36_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig36_HTML.jpg)


    **Figure 8-36** – Import review


    14. Once you have reviewed this information and feel that it is correct, click
    the `Start Import` button, as shown in Figure [8-37](#437055_1_En_8_Chapter.xhtml#Fig37).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig37_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig37_HTML.jpg)


    **Figure 8-37** – `Start Import` button


    15. Click the `OK` button on the congratulations page to be taken to the bulk
    data load job request and status page, as shown in Figure [8-38](#437055_1_En_8_Chapter.xhtml#Fig38).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig38_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig38_HTML.jpg)


    **Figure 8-38** – `OK` button


    16. If the import is a large import (tens of thousands of rows), the job being
    processed can take up to several hours. If it is a small import, you may find
    that your job will be finished as soon as you clicked `OK`, as shown in Figure
    [8-39](#437055_1_En_8_Chapter.xhtml#Fig39).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig39_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig39_HTML.jpg)


    **Figure 8-39** – Bulk data load job review


    17. Salesforce will also send you an email when your job is complete and will
    attach an error file to review any errors on your import. Some errors could include
    data type not matching. Another could be that Salesforce is seeing a blank row,
    as shown in Figure [8-40](#437055_1_En_8_Chapter.xhtml#Fig40).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig40_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig40_HTML.jpg)


    **Figure 8-40** – Email confirmation


    ## Scheduling a Data Export


    Salesforce is a cloud-based CRM and development platform that can be accessed
    anywhere you have an Internet connection. If there is a drop in your Internet
    service or you need to work offline for the time being, Salesforce allows you
    to export your data into a `CSV` file. Or, if you’re like us and you like to keep
    a backup of your data, you can do so. You can schedule an export to run monthly
    (free of charge for all Salesforce editions), weekly, or daily (which may have
    a charge depending on the Salesforce edition), and you can have it emailed to
    you. Or you can perform one-time exports.


    1. Navigate to the `Setup` menu, as shown in Figure [8-41](#437055_1_En_8_Chapter.xhtml#Fig41).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig41_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig41_HTML.jpg)


    **Figure 8-41** – Navigating to the `Setup` area


    2. In the `Quick Find` area, type `Data Export` (don''t hit the `Enter` key; the
    option will populate as you type). Click `Data Export`, as shown in Figure [8-42](#437055_1_En_8_Chapter.xhtml#Fig42).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig42_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig42_HTML.jpg)


    **Figure 8-42** – Searching for `Data Export`


    3. To schedule an export, click the `Schedule Export` button, or to create a one-time
    export, click `Export Now`, as shown in Figure [8-43](#437055_1_En_8_Chapter.xhtml#Fig43).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig43_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig43_HTML.jpg)


    **Figure 8-43** – Monthly export service options


    4. To schedule the export, choose what frequency the export should be delivered
    at. For a monthly export, you can choose what day of the month it should be delivered
    on, or the first, second, third, fourth, or last specific day of the week. You
    can also choose when the schedule starts, ends, and what time it should start,
    as shown in Figure [8-44](#437055_1_En_8_Chapter.xhtml#Fig44).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig44_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig44_HTML.jpg)


    **Figure 8-44** – Frequency


    > **Note:** The start time doesn''t ensure that it will be delivered at that time.
    Depending on the amount of data you have, it can take up to several hours to complete.


    5. You can choose to include images, documents, attachments, Salesforce files,
    and CRM content document versions with your export by selecting the boxes at the
    top of the page, as shown in Figure [8-45](#437055_1_En_8_Chapter.xhtml#Fig45).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig45_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig45_HTML.jpg)


    **Figure 8-45** – Choosing what to include


    6. You can also select specific objects to be exported only, or you can choose
    the option at the top-right corner to have all data included, as shown in Figure
    [8-46](#437055_1_En_8_Chapter.xhtml#Fig46).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig46_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig46_HTML.jpg)


    **Figure 8-46** – Objects to export


    7. Once the export is all set, click the `Save` button.


    8. If you have scheduled your export, you should see a yellow box with the time
    your next scheduled export should run, as shown in Figure [8-47](#437055_1_En_8_Chapter.xhtml#Fig47).
    If the export is scheduled for now, there will be a note for who scheduled, what
    time, and in what format the information will be received in, as shown in Figure
    [8-48](#437055_1_En_8_Chapter.xhtml#Fig48).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig48_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig48_HTML.jpg)


    **Figure 8-48** – Export scheduled response


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig47_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig47_HTML.jpg)


    **Figure 8-47** – Export now response


    9. Once the export is ready, Salesforce will email you with a link to the data
    export in the `Setup` menu, as shown in Figure [8-49](#437055_1_En_8_Chapter.xhtml#Fig49).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig49_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig49_HTML.jpg)


    **Figure 8-49** – Email sent from Salesforce that your data export has been received


    10. Here the download hyperlink will need to be clicked to download the file that
    will then need to be stored on a machine, as shown in Figure [8-50](#437055_1_En_8_Chapter.xhtml#Fig50).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig50_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig50_HTML.jpg)


    **Figure 8-50** – In the email received, there will be a link that will direct
    you back in Salesforce to download your file


    11. It will be downloaded to a zip file that will need to be unzipped for your
    use. All objects will be broken out into individual `CSV` files, as shown in Figure
    [8-51](#437055_1_En_8_Chapter.xhtml#Fig51).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig51_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig51_HTML.jpg)


    **Figure 8-51** – Shows all objects broken out into individual `CSV` files'
  raw: '![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig36_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig36_HTML.jpg)


    Figure 8-36


    Import review


    14.  Once you have reviewed this information and feel that it is correct, click
    the Start Import button, as shown in Figure [8-37](#437055_1_En_8_Chapter.xhtml#Fig37).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig37_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig37_HTML.jpg)


    Figure 8-37


    Start Import button


    15.  Click the OK button on the congratulations page to be taken to the bulk data
    load job request and status page, as shown in Figure [8-38](#437055_1_En_8_Chapter.xhtml#Fig38).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig38_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig38_HTML.jpg)


    Figure 8-38


    OK button


    16.  If the import is a large import (tens of thousands of rows), the job being
    processed can take up to several hours. If it is a small import, you may find
    that your job will be finished as soon as you clicked OK, as shown in Figure [8-39](#437055_1_En_8_Chapter.xhtml#Fig39).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig39_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig39_HTML.jpg)


    Figure 8-39


    Bulk data load job review


    17.  Salesforce will also send you an email when your job is complete and will
    attach an error file to review any errors on your import. Some errors could include
    data type not matching. Another could be that Salesforce is seeing a blank row,
    as shown in Figure [8-40](#437055_1_En_8_Chapter.xhtml#Fig40).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig40_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig40_HTML.jpg)


    Figure 8-40


    Email confirmation


    ## Scheduling a Data Export


    Salesforce is a cloud-based CRM and development platform that can be accessed
    anywhere you have an Internet connection. If there is a drop in your Internet
    service or you need to work offline for the time being, Salesforce allows you
    to export your data into a CSV file. Or, if you’re like us and you like to keep
    a backup of your data, you can do so. You can schedule an export to run monthly
    (free of charge for all Salesforce editions), weekly, or daily (which may have
    a charge depending on the Salesforce edition), and you can have it emailed you.
    Or you can perform one-time exports.


    1.  Navigate to the Setup menu , as shown in Figure [8-41](#437055_1_En_8_Chapter.xhtml#Fig41).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig41_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig41_HTML.jpg)


    Figure 8-41


    Navigating to the Setup area


    2.  In the Quick Find area, type **Data Export** (don’t hit the Enter key; the
    option will populate as you type). Click Data Export, as shown in Figure [8-42](#437055_1_En_8_Chapter.xhtml#Fig42).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig42_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig42_HTML.jpg)


    Figure 8-42


    Searching for Data Export


    3.  To schedule an export, click the Schedule Export button, or to create a one-time
    export, click Export Now, as shown in Figure [8-43](#437055_1_En_8_Chapter.xhtml#Fig43).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig43_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig43_HTML.jpg)


    Figure 8-43


    Monthly export service options


    4.  To schedule the export, choose what frequency the export should be delivered
    at. For a monthly export, you can choose what day of the month it should be delivered
    on, or the first, second, third, fourth, or last specific day of the week. You
    can also choose when the schedule starts, ends, and what time it should start,
    as shown in Figure [8-44](#437055_1_En_8_Chapter.xhtml#Fig44).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig44_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig44_HTML.jpg)


    Figure 8-44


    Frequency


    **Note** The start time doesn’t ensure that it will be delivered at that time.
    Depending on the amount of data you have, it can take up to several hours to complete.


    5.  You can choose to include images , documents, attachments, Salesforce files,
    and CRM content document versions with your export by selecting the boxes at the
    top of the page, as shown in Figure [8-45](#437055_1_En_8_Chapter.xhtml#Fig45).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig45_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig45_HTML.jpg)


    Figure 8-45


    Choosing what to include


    6.  You can also select specific objects to be exported only, or you can choose
    the option at the top-right corner to have all data included, as shown in Figure
    [8-46](#437055_1_En_8_Chapter.xhtml#Fig46).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig46_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig46_HTML.jpg)


    Figure 8-46


    Objects to export


    7.  Once the export is all set, click the Save button.


    8.  If you have scheduled your export, you should see a yellow box with the time
    your next scheduled export should run, as shown in Figure [8-47](#437055_1_En_8_Chapter.xhtml#Fig47).
    If the export is scheduled for now, there will be a note for who scheduled, what
    time, and in what format the information will be received in, as shown in Figure
    [8-48](#437055_1_En_8_Chapter.xhtml#Fig48).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig48_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig48_HTML.jpg)


    Figure 8-48


    Export scheduled response


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig47_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig47_HTML.jpg)


    Figure 8-47


    Export now response


    9.  Once the export is ready, Salesforce will email you with a link to the data
    export in the Setup menu, as shown in Figure [8-49](#437055_1_En_8_Chapter.xhtml#Fig49).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig49_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig49_HTML.jpg)


    Figure 8-49


    Email sent from Salesforce that your email has been received


    10.  Here the download hyperlink will need to be clicked to download the file
    that will then need to be stored on a machine, as shown in Figure [8-50](#437055_1_En_8_Chapter.xhtml#Fig50).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig50_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig50_HTML.jpg)


    Figure 8-50


    In the email received, there will be a link that will direct you back in Salesforce
    to download your file


    11.  It will be downloaded to a zip file that will need to be unzipped for your
    use. All objects will be broken out into individual CSV files, as shown in Figure
    [8-51](#437055_1_En_8_Chapter.xhtml#Fig51).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig51_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig51_HTML.jpg)


    Figure 8-51


    Shows all objects broken out into individual CSV files'
