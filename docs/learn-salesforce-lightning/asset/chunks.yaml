    \ 348-4505, email `orders-ny@springer-sbm.com`, or visit `www.springeronline.com`.\
    \  \n\nApress Media, LLC is a California LLC and the sole member (owner) is Springer\
    \ Science + Business Media Finance Inc (SSBM Finance Inc). SSBM Finance Inc is\
    \ a Delaware corporation.  \n\n## Foreword\n\nTwo years ago, we launched Salesforce\
    \ Lightning. It was (and if I’m being honest, still is) an audacious undertaking.\
    \  \n\nOur mission with Lightning was to completely reinvent Salesforce to provide\
    \ a new modern user experience that set a new standard for customer relationship\
    \ management (CRM) and build it all on a new, robust, and scalable enterprise\
    \ application framework. We wanted to make Salesforce easier, more intuitive,\
    \ and virtually limitless in its potential. And we wanted it to empower everyone\
    \ in our community to be their best, including trailblazers, admins, customers,\
    \ partners, and our employees.  \n\nSince launching Lightning, we’ve seen an outpouring\
    \ of enthusiasm from our community, unlike anything I’ve ever seen in enterprise\
    \ software. It’s been awe-inspiring.  \n\nOne of the best things about Lightning\
    \ is that it helps us innovate faster. With each release, we’re expanding the\
    \ scale and scope of Lightning and doing more than I ever thought possible.  \n\
    \nSince launching it just two years ago, we’ve done the following:  \n\n*   Redefined\
    \ the modern selling cycle with Sales Cloud Lightning  \n*   Reimagined the modern\
    \ contact center with Service Cloud Lightning  \n*   Streamlined navigation to\
    \ make it easier to move between Salesforce apps  \n*   Empowered admins and trailblazers\
    \ with a no-code framework so they can easily customize the Salesforce user interface\
    \ (UI) for their organizations  \n*   Helped more than 100,000 customers deploy\
    \ Lightning  \n*   Sparked a new level of creativity and momentum in our ecosystem\
    \ with more than 1,000 new Lightning-ready apps from partners such as DocuSign,\
    \ Evernote, and FinancialForce that can be simply dragged and dropped into Salesforce\
    \  \n*   Created entirely new products that previously weren’t possible, such\
    \ as Salesforce Einstein, an artificial intelligence (AI) offering for CRM, and\
    \ Lightning Bolt, which offers industry-specific portals for our Community Cloud\
    \  \n*   Empowered countless salespeople, service agents, and marketing pros to\
    \ sell, service, and market faster, smarter, and the way they want  \n\nEvery\
    \ day our community gives us feedback—sometimes positive, sometimes critical,\
    \ but always constructive. And every day, our entire product team (me included)\
    \ pores over that feedback, and it helps us get better and better. Lightning is\
    \ what it is today because of you. So, thank you for all you do to help us make\
    \ Salesforce and Lightning better and better with each release.  \n\nLightning\
    \ is the future of Salesforce. So, buckle up because we’re just getting started.\
    \  \n\n*Mike Rosenbaum*  \n\n## Introduction\n\n> *“Do business faster.”*  \n\
    > —Cloud Creations  \n\nJust like our company tagline, we believe you can “do\
    \ business faster” with Salesforce Lightning. We wrote this book to provide training\
    \ on the innovative Lightning Experience in a clear and visual way. As executives\
    \ in a Salesforce consulting company, we understood the challenges that other\
    \ organizations faced when it came to user acceptance of a new experience. We\
    \ wanted to provide material that was easy to follow, with real-life examples,\
    \ so administrators and users are set up for success.  \n\n*Learn Salesforce Lightning*\
    \ is a step-by-step visual guide that offers immediate and valuable solutions\
    \ to the new set of UI tools included in Lightning.  \n\nYou’ll learn to do the\
    \ following:  \n\n*   Navigate the Salesforce Lightning Experience  \n*   Migrate\
    \ from Salesforce Classic to Lightning  \n*   Make customizations  \n*   Configure\
    \ dynamic reports and dashboards  \n*   Build logic to automate the system with\
    \ Process Builder  \n*   Manage your data and security  \n*   And much more  \n\
    \nThis book is for Salesforce administrators, business users, developers, and\
    \ IT members. Our goal is to prepare you to onboard one of the most innovative\
    \ and fastest customer relationship management (CRMs) solutions on the market:\
    \ Salesforce Lightning.  \n\n## Acknowledgments\n\nI wish to thank everyone who\
    \ helped us complete this book. Without their effort and support, we would not\
    \ have been able to bring this to a successful completion.  \n\nThanks to our\
    \ editors, Susan and Rita, for their effort, time, and patience. Thank you for\
    \ this opportunity and all your help.  \n\nThanks to Phil Weinmeister, for his\
    \ knowledge and expertise as our technical reviewer.  \n\nThanks to Justin Davis,\
    \ for his support and guidance throughout this process.  \n\nMost important, I’d\
    \ like to dedicate this book to my children, Michael Frank and Ayden James. Don’t\
    \ give up. There is always something to learn.  \n\n> —Felicia Duarte  \n\n###\
    \ About the Authors and About the Technical Reviewer  \n\n### About the Authors\
    \  \n\n### About the Technical Reviewer  \n\n# 1. Introducing Salesforce Lightning\
    \  \n\nSalesforce is currently the number-one customer relationship management\
    \ (CRM) solution for business management. Delivering a robust platform and groundbreaking\
    \ technology, Salesforce provides solutions for sales, service, and marketing\
    \ departments. The Lightning Experience provides a new user interface that delivers\
    \ a faster platform, dynamic capabilities, and enhanced aesthetics. Businesses\
    \ have reported an increase in win rates, more collaboration, improved productivity,\
    \ and faster reporting following the switch to Lightning (see Figure [1-1](#437055_1_En_1_Chapter.xhtml#Fig1)).\
    \  \n\n![../images/437055_1_En_1_Chapter/437055_1_En_1_Fig1_HTML.jpg](images/437055_1_En_1_Chapter/437055_1_En_1_Fig1_HTML.jpg)\
    \  \n\nFigure 1-1: Salesforce Lightning Experience"
