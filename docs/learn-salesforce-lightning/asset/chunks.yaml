    \ [5-36](#437055_1_En_5_Chapter.xhtml#Fig36).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig36_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig36_HTML.jpg)\n\
    \n    Figure 5-36\n\n    Navigating to the Reports tab\n\n2.  Click New Report,\
    \ as shown in Figure [5-37](#437055_1_En_5_Chapter.xhtml#Fig37).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig37_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig37_HTML.jpg)\n\
    \n    Figure 5-37\n\n    Click the New Report button to start a new report\n\n\
    3.  In the Quick Find, type **Leads** or click Leads and click Create, as shown\
    \ in Figure [5-38](#437055_1_En_5_Chapter.xhtml#Fig38).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig38_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig38_HTML.jpg)\n\
    \n    Figure 5-38\n\n    Finding the report type to use\n\n4.  Click and hold\
    \ the name of the field you would like to move into your reports and drag it to\
    \ the column where you would like it to be placed. Continue to drag and drop as\
    \ many fields as necessary for the report. Once finished, click Save, as shown\
    \ in Figure [5-39](#437055_1_En_5_Chapter.xhtml#Fig39).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig39_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig39_HTML.jpg)\n\
    \n    Figure 5-39\n\n    Dragging and dropping a new field into your report\n\n\
    5.  Name your report and press your Tab key for Salesforce to automatically enter\
    \ a value in the Report Unique Name field.\n\n6.  Enter a description that will\
    \ be displayed to users.\n\n7.  Select the report folder where your report should\
    \ be stored.\n\n8.  Click Save, as shown in Figure [5-40](#437055_1_En_5_Chapter.xhtml#Fig40).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig40_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig40_HTML.jpg)\n\
    \n    Figure 5-40\n\n    Saving your report\n\n9.  Click Run Report to see the\
    \ results of your data, as shown in Figure [5-41](#437055_1_En_5_Chapter.xhtml#Fig41).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig41_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig41_HTML.jpg)\n\
    \n    Figure 5-41\n\n    Running your report to see your results"
  trans: "\n# 筛选逻辑\n\n设置至少一个字段筛选器后，筛选逻辑将允许你对字段的评估方式应用“与”、“或”或“非”条件。你可以根据需要为报表创建包含任意数量字段筛选器的复杂条件。如果使用筛选逻辑，则必须在条件中包含所有字段筛选器。你可以使用括号将逻辑分组，以进一步定义报表。默认的筛选逻辑会在语句中放置`AND`，意味着“1\
    \ AND 2 AND 3”，以此类推。这指示报表仅包含满足你设置的所有三个（或任意数量）条件的记录。\n\n1.  点击“筛选器”旁边的`添加`按钮，然后选择“筛选逻辑”。\n\
    2.  创建你的条件语句。你将使用字段筛选器旁边的数字来定义哪些字段筛选器需要与“与”或“或”语句组合。你使用的语句看起来像“`(1 OR 2) AND 3\
    \ AND 4`”。另一个例子是“`1 AND 2 AND 3 AND 4 AND (5 OR 6 OR 7)`”。\n3.  点击`确定`完成筛选逻辑，如图\
    \ 5-32 所示。\n\n    **注意** 每次添加新的字段筛选器时，你都应该调整筛选逻辑并确保其正确无误。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig32_HTML.jpg](img/437055_1_En_5_Fig32_HTML.jpg)\n\
    \n    *图 5-32*  \n    *更改筛选逻辑*\n\n# 交叉筛选\n\nSalesforce 中的交叉筛选允许你对与当前报表对象相关的对象应用条件。你可以通过对相关对象应用“包含”或“不包含”条件来使用交叉筛选。使用交叉筛选后，通过该相关交叉筛选进一步定义字段筛选器。一个例子是筛选所有没有跟进活动的商机。或者使用交叉筛选来设置对没有产品的商机进行筛选，以确定哪些商机仍需要完成。使用交叉筛选的另一个例子是确定某个客户或联系人是否与你的销售团队有过任何互动。你可以通过创建一个客户或联系人报表并添加“不包含”活动的交叉筛选逻辑来设置。这将为你提供一份所有需要联系或跟进核查的客户或联系人列表。要进行设置，请先创建至少一个字段筛选器，然后按照以下步骤操作：\n\
    \n1.  点击“筛选器”旁边的`添加`按钮，然后选择“交叉筛选”。\n2.  选择你想要用来关联其他对象的主要对象。\n3.  定义是否希望使用“包含”或选择“不包含”来查看这些相关对象。\n\
    4.  选择你想要查看或不查看的相关对象。\n5.  点击`添加相关对象筛选器`，选择运算符和值，然后点击`确定`，如图 5-33 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig33_HTML.jpg](img/437055_1_En_5_Fig33_HTML.jpg)\n\
    \n    *图 5-33*  \n    *设置交叉筛选*\n\n# 行数限制\n\n行数限制筛选器用于表格报表，允许你在限制返回行数并按字段排序后，在仪表板上以表格或图表形式显示报表。要进行创建，请按以下步骤操作：\n\
    \n1.  点击`添加`按钮并选择“行数限制”，如图 5-34 所示。\n2.  定义行数限制。\n3.  选择按特定字段排序，并选择升序或降序，然后点击`确定`。\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig34_HTML.jpg](img/437055_1_En_5_Fig34_HTML.jpg)\n\
    \n    *图 5-34*  \n    *设置行数限制*\n\n## 使用报表生成器\n\n在 Salesforce 中创建报表可以让你分析你和用户正在收集的数据。对于\
    \ Salesforce 报表的新手来说，最好的事情莫过于你无法破坏或损坏你的数据。使用报表所做的只是以更易读的格式显示你当前拥有的数据，而不是显示在单个记录中。所以，不要害怕，大胆开始点击操作吧！\n\
    \n### 创建潜在客户报表\n\n你可以使用潜在客户报表来查看有关潜在客户的部分或全部关键信息。你可以看到有多少潜在客户，哪些潜在客户来源在你的市场团队中有效，正在由用户处理的潜在客户数量与队列中的数量对比，以及更多信息！通过生成潜在客户报表可以解决的众多业务问题之一是，评估哪些潜在客户来源有效，哪些效果不佳。你可以创建一个关于已转化潜在客户的报表，并按潜在客户来源进行分组，如图\
    \ 5-35 所示。\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig35_HTML.jpg](img/437055_1_En_5_Fig35_HTML.jpg)\n\
    \n*图 5-35*  \n*潜在客户报表示例*\n\n要创建潜在客户报表，请按以下步骤操作：\n\n1.  导航到“报表”选项卡并点击`报表`，如图 5-36\
    \ 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig36_HTML.jpg](img/437055_1_En_5_Fig36_HTML.jpg)\n\
    \n    *图 5-36*  \n    *导航到报表选项卡*\n\n2.  点击`新建报表`，如图 5-37 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig37_HTML.jpg](img/437055_1_En_5_Fig37_HTML.jpg)\n\
    \n    *图 5-37*  \n    *点击新建报表按钮以创建新报表*\n\n3.  在`快速查找`中，输入**潜在客户**或点击`潜在客户`，然后点击`创建`，如图\
    \ 5-38 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig38_HTML.jpg](img/437055_1_En_5_Fig38_HTML.jpg)\n\
    \n    *图 5-38*  \n    *查找要使用的报表类型*\n\n4.  点击并按住你想要移入报表的字段名称，将其拖放到目标列中。继续拖放报表所需的任意多个字段。完成后，点击`保存`，如图\
    \ 5-39 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig39_HTML.jpg](img/437055_1_En_5_Fig39_HTML.jpg)\n\
    \n    *图 5-39*  \n    *将新字段拖放到报表中*\n\n5.  为报表命名，然后按`Tab`键，Salesforce 会自动在`报表唯一名称`字段中输入一个值。\n\
    6.  输入将显示给用户的描述。\n7.  选择报表应存储的报表文件夹。\n8.  点击`保存`，如图 5-40 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig40_HTML.jpg](img/437055_1_En_5_Fig40_HTML.jpg)\n\
    \n    *图 5-40*  \n    *保存报表*\n\n9.  点击`运行报表`查看数据结果，如图 5-41 所示。\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig41_HTML.jpg](img/437055_1_En_5_Fig41_HTML.jpg)\n\
    \n    *图 5-41*  \n    *运行报表以查看结果*\n"
- fmt: "### Creating Contacts and Accounts Report\n\nYou can create a contacts and\
    \ accounts report to display all your contact details. Use this report for a call\
    \ list, mail merges, viewing newly created contacts and accounts, or any other\
    \ business needs. Business-to-business (B2B) organizations can benefit from the\
    \ use of account reports if they want to determine the types of industries they\
    \ work with. You can generate a report that shows you how many businesses you\
    \ are engaging with in each industry. This would help you to determine where you\
    \ should focus your marketing efforts. You can see what this report would look\
    \ like in Figure [5-42](#437055_1_En_5_Chapter.xhtml#Fig42).\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig42_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig42_HTML.jpg)\n\
    \nFigure 5-42 — Accounts and contacts report example\n\nTo create a contacts and\
    \ accounts report:\n\n1.  Navigate to the `Reports` tab and click `Reports`; once\
    \ you see your report folders, click `New Reports` in the right corner.\n\n2.\
    \  In the `Quick Find` area, type `Contact`. Or, click `Accounts`, click `Contacts\
    \ & Accounts`, and click `Create`, as shown in Figure [5-43](#437055_1_En_5_Chapter.xhtml#Fig43).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig43_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig43_HTML.jpg)\n\
    \n    Figure 5-43 — Selecting the report type for your report\n\n3.  Click and\
    \ hold the name of the field you want to move into your reports and drag it to\
    \ the column where you would like it to be placed. Continue to drag and drop as\
    \ many fields as necessary for the report. Once finished, click `Save`, as shown\
    \ in Figure [5-44](#437055_1_En_5_Chapter.xhtml#Fig44).\n\n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig44_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig44_HTML.jpg)\n\
    \n    Figure 5-44 — Dragging and dropping a field into your report\n\n4.  Name\
    \ your report and press your `Tab` key for Salesforce to automatically enter a\
    \ value in the `Report Unique Name` field.\n\n5.  Enter a description that will\
    \ be displayed to users.\n\n6.  Select the report folder where your report should\
    \ be stored.\n\n7.  Click `Save`, as shown in Figure [5-45](#437055_1_En_5_Chapter.xhtml#Fig45).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig45_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig45_HTML.jpg)\n\
    \n    Figure 5-45 — Saving your report\n\n8.  Click `Run Report` to see the results\
    \ of your data, as shown in Figure [5-46](#437055_1_En_5_Chapter.xhtml#Fig46).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig46_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig46_HTML.jpg)\n\
    \n    Figure 5-46 — Running your report to see the results\n\n### Creating an\
    \ Opportunity Report\n\nYou can create an opportunity report and opportunity with\
    \ products report to display the sales your company has generated. Use these report\
    \ types to display what is in the pipeline, what has dropped out of the pipeline,\
    \ and all sales that your team has successfully won. Most businesses will generate\
    \ opportunity reports to help project what efforts may be needed in the future.\
    \ For instance, project management companies need to project how many projects\
    \ they have now and how many projects may be closing or starting in the future.\
    \ Being able to project this is necessary to the operations of the business. Project\
    \ management companies need to be able to project how many project managers or\
    \ internal support are going to be needed in the upcoming months. To project this,\
    \ a project management company will look at all sales with a 90 percent or higher\
    \ opportunity probability. Figure [5-47](#437055_1_En_5_Chapter.xhtml#Fig47) shows\
    \ what this report would look like.\n\n![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig47_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig47_HTML.jpg)\n\
    \nFigure 5-47 — Opportunity report example\n\nTo create an opportunity report,\
    \ follow these steps:\n\n1.  Navigate to the `Reports` tab and click `Reports`;\
    \ once you see your report folders, click `New Reports` in the right corner.\n\
    \n2.  In the `Quick Find` area, type `Opportunity`. Or, click `Opportunity` and\
    \ click `Create`, as shown in Figure [5-48](#437055_1_En_5_Chapter.xhtml#Fig48).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig48_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig48_HTML.jpg)\n\
    \n    Figure 5-48 — Selecting the report type for your report\n\n3.  Click `Show`\
    \ and select `Details`, as shown in Figure [5-49](#437055_1_En_5_Chapter.xhtml#Fig49).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig49_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig49_HTML.jpg)\n\
    \n    Figure 5-49 — Showing the details on a report\n\n4.  Select the proper filters\
    \ for your report to show the data desired, as shown in Figure [5-50](#437055_1_En_5_Chapter.xhtml#Fig50).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig50_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig50_HTML.jpg)\n\
    \n    Figure 5-50 — Setting up the report field filters for your report\n\n5.\
    \  Click and hold the name of the field you would like to move into your reports\
    \ and drag it to the column where you would like it to be placed. Continue to\
    \ drag and drop as many fields as necessary for the report. Once finished, click\
    \ `Save`, as shown in Figure [5-51](#437055_1_En_5_Chapter.xhtml#Fig51).\n\n \
    \   ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig51_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig51_HTML.jpg)\n\
    \n    Figure 5-51 — Dragging and dropping a field into your report\n\n6.  Name\
    \ your report and press your `Tab` key for Salesforce to automatically enter a\
    \ value in the `Report Unique Name` field.\n\n7.  Enter a description that will\
    \ be displayed to users.\n\n8.  Select the report folder where your report should\
    \ be stored.\n\n9.  Click `Save`, as shown in Figure [5-52](#437055_1_En_5_Chapter.xhtml#Fig52).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig52_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig52_HTML.jpg)\n\
    \n    Figure 5-52 — Saving your report\n\n10.  Click `Run Report` to see the results\
    \ of your data.\n\n### Creating Tabular, Summary, and Matrix Reports\n\nTabular\
    \ reports are the default report selected when creating a new report. Once you\
    \ have chosen your report type and are in the report builder, you can switch between\
    \ all three report formats. If switching from the Summary or Matrix report format\
    \ to Tabular, you’ll want to take the fields you grouped and move them to a column;\
    \ otherwise, you’ll lose them and have to bring them back to the report once in\
    \ Tabular format. When switching from a Matrix report to a Summary report, be\
    \ aware that you may lose groupings here as well if you have set up four groupings\
    \ on the Matrix report; Summary reports can handle only up to three groupings.\
    \ Let’s look at creating Tabular, Summary, and Matrix reports.\n\n1.  Navigate\
    \ to the `Reports` tab and click `Reports`; once you see your report folders,\
    \ click `New Reports` in the right corner.\n\n2.  Choose the report type of your\
    \ choice and click `Create`, as shown in Figure [5-53](#437055_1_En_5_Chapter.xhtml#Fig53).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig53_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig53_HTML.jpg)\n\
    \n    Figure 5-53 — Selecting the report type for your report\n\n3.  In the `Preview`\
    \ pane of the report builder, choose the drop-down that displays `Tabular Format`\
    \ and switch to the report format of your choice, as shown in Figure [5-54](#437055_1_En_5_Chapter.xhtml#Fig54).\n\
    \n    ![../images/437055_1_En_5_Chapter/437055_1_En_5_Fig54_HTML.jpg](images/437055_1_En_5_Chapter/437055_1_En_5_Fig54_HTML.jpg)\n\
    \n    Figure 5-54 — Changing report formats"
