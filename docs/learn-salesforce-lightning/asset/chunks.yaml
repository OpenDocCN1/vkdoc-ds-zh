  trans: "\n### 注意\n\n这是你在 Salesforce 中管理项目时可以使用的一个用例。这些步骤也可以稍作调整，用于创建保险公司最常用的新保单记录。金融服务行业的人也会在商机结束时，利用这个概念创建新的财务账户记录。这些只是几个例子。在\
    \ Salesforce 中使用自动化的机会是无限的！\n\n请按照以下步骤创建此流程：\n\n1.  在`设置`中，选择`平台工具`部分的`流程自动化`，如图\
    \ 7-6 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig6_HTML.jpg](img/437055_1_En_7_Fig6_HTML.jpg)\n\
    \n   **图 7-6** – 设置中的流程自动化\n\n2.  接着，选择`流程生成器`以访问`流程生成器`主页。\n\n   该页面会列出所有**激活**和**未激活**的流程，如图\
    \ 7-7 所示，同时显示流程描述、相关对象、流程类型、最后修改日期、状态和操作。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig7_HTML.jpg](img/437055_1_En_7_Fig7_HTML.jpg)\n\
    \n   **图 7-7** – 流程生成器主页及流程列表\n\n3.  点击`新建`按钮以启动新流程。\n\n4.  输入流程名称并按`Tab`键生成 API\
    \ 名称，如图 7-8 所示。\n\n   **注意** 并非必须，但建议为每个流程输入描述。对于自动化流程众多的组织来说，若没有描述，可能很难找到正确的流程。\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig8_HTML.jpg](img/437055_1_En_7_Fig8_HTML.jpg)\n\
    \n   **图 7-8** – 为流程命名\n\n5.  确定流程应在何时启动。选项包括“当记录更改时”和“当被其他流程调用时”。\n\n   **注意** 你可以将更复杂的流程分解为更简单的流程。如前所述，这些流程可以被其他流程重复使用和调用。\n\
    \n   在当前场景中，你将在“当记录更改时”启动流程。点击`保存`，如图 7-9 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig9_HTML.jpg](img/437055_1_En_7_Fig9_HTML.jpg)\n\
    \n   **图 7-9** – 当记录更改时启动流程\n\n6.  首次启动流程时，必须选择其启动的对象。选择`添加对象`，如图 7-10 高亮所示。\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig10_HTML.jpg](img/437055_1_En_7_Fig10_HTML.jpg)\n\
    \n   **图 7-10** – 在流程生成器中选择对象\n\n7.  选择流程应评估的对象，如图 7-11 所示。在此示例中，你将选择`商机`。\n\n\
    \   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig11_HTML.jpg](img/437055_1_En_7_Fig11_HTML.jpg)\n\
    \n   **图 7-11** – 选择何时启动流程\n\n8.  选择流程应何时启动，如图 7-11 所示。\n   - 选择“仅当创建记录时”，仅对新记录启动流程。\n\
    \   - 选择“当创建或编辑记录时”，对新记录 *以及* 保存时被编辑的现有记录启动流程。\n\n9.  你可以点击`是`，如图 7-12 所示，允许在一次执行中多次评估该记录（最多五次）。\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig12_HTML.jpg](img/437055_1_En_7_Fig12_HTML.jpg)\n\
    \n   **图 7-12** – 点击“是”以允许流程在单次事务中多次评估记录\n\n10. 确认你的规格后，点击 ![../images/437055_1_En_7_Chapter/437055_1_En_7_Figa_HTML.jpg](img/437055_1_En_7_Figa_HTML.jpg)。\n\
    \n11. 选择图 7-13 中显示的`添加条件`节点，为此流程设置条件。\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig13_HTML.jpg](img/437055_1_En_7_Fig13_HTML.jpg)\n\
    \n    **图 7-13** – 向流程添加条件节点\n\n12. 设置记录为了执行操作而应满足的条件。\n\n    在此示例中，你希望设置条件，使得仅当商机记录的阶段标记为`已赢得`时，流程才启动。\n\
    \n### 设置条件\n\n请按照以下步骤为流程设置条件：\n\n1.  为你的条件命名，如图 7-14 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig14_HTML.jpg](img/437055_1_En_7_Fig14_HTML.jpg)\n\
    \n   **图 7-14** – 设置条件的步骤\n\n2.  查找一个字段并选择合适的运算符来设置条件。\n\n3.  选择执行操作的条件（如图 7-15\
    \ 所示）。你可以选择：仅在满足条件时执行操作、当公式计算结果为真时执行操作，或无条件执行操作。在此示例中，选择“无条件 – 直接执行操作！”以便对所有商机记录执行操作。\n\
    \n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig15_HTML.jpg](img/437055_1_En_7_Fig15_HTML.jpg)\n\
    \n   **图 7-15** – 设置执行操作的条件\n\n4.  设置条件。使用字段和运算符值来设置这些条件，如图 7-16 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig16_HTML.jpg](img/437055_1_En_7_Fig16_HTML.jpg)\n\
    \n   **图 7-16** – 设置调用流程的条件\n\n5.  所有条件设置完毕后，点击`保存`。\n\n6.  选择满足此条件后的操作。点击`添加操作`，如图\
    \ 7-17 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig17_HTML.jpg](img/437055_1_En_7_Fig17_HTML.jpg)\n\
    \n   **图 7-17** – 向流程添加即时操作\n\n7.  定义操作类型。\n\n8.  在此场景中，你想要创建一个新的项目记录。点击`创建记录`。\n\
    \n9.  命名操作并选择应创建的记录类型，如图 7-18 所示。\n\n   ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig18_HTML.jpg](img/437055_1_En_7_Fig18_HTML.jpg)\n\
    \n   **图 7-18** – 命名操作并选择记录类型\n\n10. 设置新记录的字段值，如图 7-19 所示。在我们的示例中，我们设置了所有想要带入新项目记录的字段值。\n\
    \n    **注意** 选择此操作时，必须填写所有必填字段。如果未输入必填字段的值，将不会创建记录。\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig19_HTML.jpg](img/437055_1_En_7_Fig19_HTML.jpg)\n\
    \n    **图 7-19** – 创建新记录时设置字段值\n\n11. 确认条件和操作正确后，点击`保存` ![../images/437055_1_En_7_Chapter/437055_1_En_7_Figb_HTML.jpg](img/437055_1_En_7_Figb_HTML.jpg)。\n\
    \n12. 要使此流程生效，请点击`激活`，如图 7-20 所示。\n\n    **注意** 同一时间只能有一个版本的流程处于激活状态。\n\n    ![../images/437055_1_En_7_Chapter/437055_1_En_7_Fig20_HTML.jpg](img/437055_1_En_7_Fig20_HTML.jpg)\n\
    \n    **图 7-20** – 激活流程\n\n13. 最佳实践是测试该流程。创建一个测试记录来测试这个新的自动化流程。\n"
- fmt: '# Summary


    In this chapter, we reviewed the high-level details of what Process Builder can
    do. You can automate a lot more than you can with just workflow rules. It’s important
    to know that there are countless ways you can build automation into your existing
    setup. Use this chapter as a guide as to what the practical capabilities are with
    Process Builder.


    # 8. Data Management


    Salesforce offers an array of data management tools. Lightning Salesforce offers
    a Data Import Wizard that allows you to update existing records or create new
    records (Figure [8-1](#437055_1_En_8_Chapter.xhtml#Fig1)). The Data Import Wizard
    allows imports, updates, and inserts to be performed using comma-separated value
    (CSV) files, Outlook CSV, ACT! CSV, and Gmail CSV. Salesforce not only supplies
    an importing tool but also provides tools to help you export your data into CSV
    files, mass transfer records from one owner to another based on the criteria of
    the record, and mass delete records based on the criteria of the record. Salesforce
    also provides data control tools that help you control the type of data your users
    are adding to the system. You can create duplication rules to prevent users from
    adding duplicate records. Data management is hugely important for organizations;
    in fact, your Salesforce organization is only as good as the data you collect
    with it. If the data is “dirty,” your reports will be too. Having accurate and
    useful data will allow you to properly analyze your information. This in turn
    will allow you to better the user and client experience.


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig1_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Importing can be easy!


    ## Using the Data Import Wizard


    The Data Import Wizard that Salesforce has provided allows you to import new records
    and update existing records. All you need is a CSV file with column headers that
    match your existing Salesforce fields and your data in the rows of the spreadsheet
    (Figure [8-2](#437055_1_En_8_Chapter.xhtml#Fig2)).


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig2_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    CSV file ready for an import into the Salesforce organization


    You can easily create a CSV file with an Excel spreadsheet. Once you save the
    file, you’ll see under the file name that you create a “save as” type. Select
    the drop-down and change it to “CSV (Comma delimited).” According to your Excel
    version, the verbiage may change. See Figure [8-3](#437055_1_En_8_Chapter.xhtml#Fig3)
    for an example.


    ![../images/437055_1_En_8_Chapter/437055_1_En_8_Fig3_HTML.jpg](images/437055_1_En_8_Chapter/437055_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    How to save an Excel file into a CSV file format


    ## Preparing Your Data for an Import


    To prepare your data for a contact and account import, you must make sure that
    in your CSV file there is a column for all the required fields you may have set
    up or the ones that come standard with Salesforce. You can determine what fields
    are required by editing a record and looking for the fields with a red line next
    to them. You can include any field as a column in this CSV file that is found
    on the object you are importing to. Another important preparation step is to ensure
    that the data being imported matches the data type of the field. It is important
    to prepare your data because if it is incorrect, it will give you an error and
    not import that record. To prevent spending hours on import, follow these tips:


    *   The date data type can be accepted only with this format: `MM/DD/YYYY`.

    *   The date and time data type can be accepted in the following format: `MM/DD/YYYY
    hh:mm:ss`. There are other formats accepted as well.

    *   The number and currency data type will take only numbers (no letters).

    *   The check box data type will accept `TRUE` and `FALSE` values (`TRUE` = selected,
    `FALSE` = deselected).

    *   The email data type fields require that an at (`@`) symbol be present and
    a dot (`.`) with an appropriate suffix be included (`.com`, `.org`, `.gov`, etc.).
    Salesforce doesn’t check for a specific suffix type, but if it sees no suffix
    after the dot, it will typically produce an error.

    *   Picklist data type fields must exactly match what is already included in the
    values for that picklist, or you can at the field level deselect the box “Restrict
    picklist to the values defined in the value set” so that any value will be included
    and imported.

    *   Multiselect picklist values must be separated by a semicolon (for example,
    `blue; red; green`).

    *   The URL data type field will need to include a dot with a suffix (`.com`,
    `.org`, `.gov`, etc.).


    ### Note


    In this import wizard, if the account name is the same as another in your CSV
    file, Salesforce will not create a duplicate. If the account name has one extra
    letter, Salesforce will see this as a new account and create a duplicate.


    Additionally, if you label your column headers with the Salesforce field label,
    the Salesforce import wizard will automatically map your columns to the Salesforce
    fields (we’ll speak about this in step 9).


    *   Try to match all your column headers to the field names for your import. Most
    importing tools will “automap” your column headers to the appropriate fields.'
