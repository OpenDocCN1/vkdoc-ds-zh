  \n图 A-12. 完整的组织层级结构\n\n##### 定义业务伙伴\n\n业务伙伴是指公司与其有业务往来的任何个人、组织、人群或组织团体。\n\n对于类型为“组织”的业务伙伴，SAP\
  \ TM 提供以下角色：\n\n- **通用业务伙伴**：创建业务伙伴时，此角色会自动分配给它。与此业务伙伴相关的通用数据，例如名称和地址（对所有业务角色均有效），都存储在此角色中。\n\
  - **承运方**：此角色分配给作为承运方的业务伙伴。可以为此业务伙伴角色定义标准承运方字母代码或航空公司代码。\n- **供应商**：将此角色分配给作为供应商的业务伙伴。\n\
  - **收货方**：此角色分配给作为客户的业务伙伴。\n- **售达方**：此角色也分配给作为客户的业务伙伴。\n- **组织单位**：此角色代表公司的组织单位。\n\
  \n对于类型为“人员”的业务伙伴，SAP TM 提供以下角色：\n\n- **员工**：此角色分配给作为员工的业务伙伴。然后，可以将此业务伙伴分配到一个组织单位。\n\
  - **互联网用户**：将此角色分配给将要参与招标流程的业务伙伴。\n- **联系人**：将此角色也分配给将要参与招标流程的业务伙伴。\n\n**注意**：如果客户和供应商数据已在\
