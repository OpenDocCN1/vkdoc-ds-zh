  \n\n\n#### 开票（货运结算）\n\n要为客户创建发票，需先生成货运结算单据，然后将其传输至 SAP ERP 系统或其他财务系统。\n\n要为给定场景创建货运结算，以编辑模式打开货运订单（出口），然后从`跟进`菜单中选择`创建货运结算单据`。\n\
