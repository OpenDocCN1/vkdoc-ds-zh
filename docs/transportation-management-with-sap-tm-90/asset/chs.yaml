- '# SAP TM 团队提升与能力建设计划


  `sap tm` 实施方案是第三方物流的一项重大转型项目，需要大量经验丰富且经过培训的 `sap tm` 资源来管理实施、多次推广并提供支持。`sap tm 9.0`
  是迄今为止最新、最全面的版本，于 2012 年第三季度正式发布。如前所述，由于 `sap tm 9.0` 相对较新，具备 `sap tm 9.0` 技能的资源可用性是一个重大挑战。这一挑战可以通过实施提升与能力建设计划来应对。我们认为
  `sap tm` 顾问除了掌握 `sap tm` 技能外，还必须精通货运代理和物流知识。我们提出了一项联合能力发展策略，包含四个成熟度等级，从 `e1`（初学者）到
  `e4`（专家）。此外，建议根据这些资源的成熟度，让他们参与到项目/计划生命周期的不同阶段。以下是组建团队的一些方法：


  -   **类别 1**：吸纳在业务领域工作、精通 IT 且渴望学习新产品技术的内部员工。应提供技术培训。此类资源带来了领域理解力，这是一项重要的资产。凭借这些知识，他们可以更快地掌握
  `sap tm`，并用于流程映射、需求收集和文档编制。

  -   **类别 2**：确定愿意转向 `sap tm` 技术的内部 `it` 资源和有能力的关键用户（使用其他 `sap` 模块），并对其进行 `sap tm`
  培训。

  -   **类别 3**：聘请具有 `sap tm`（及其他 `sap` 模块）使用经验的经验丰富的顾问，并对其进行 `sap tm` 培训。

  -   **类别 4**：直接从市场招聘 `sap tm` 资源以扩充团队。这可以满足您的即时需求。然而，从市场使用现有资源成本可能很高。顾问可以按合同聘用，但这既昂贵又相对风险较大。仅聘用合同工时，也会失去积累知识的机会。


  我们建议为加入项目的员工制定一项能力建设计划。根据他们的背景和类别，个人将接受以下适用的培训：


  -   `e1-a`：为类别 1 资源提供的 `sap` 技术概览与导航。

  -   `e1-b`：为类别 2 资源提供的内部运输领域培训，涵盖特定 `sap tm` 流程（为期一周）。此培训可由来自各职能领域的高级成员进行。

  -   `e2`：为类别 1、2 和 3 内部开展的 `sap tm 9.0` 产品培训。达到 `e2` 级别的受训资源可用作支持或版本管理的后备资源。

  -   `e3`：由 `sap ag` 培训中心或内部被认定为熟练培训师的教员开展的 `sap tm 9.0` 产品培训。培训将持续三到四周，涵盖所有产品特性，并提供
  `sap tm` 功能及集成需求的实践操作。这将需要创建内部环境和场景，用于演示和实践所学内容。`e3` 级别的资源可以参与版本管理。

  -   `e4`：拥有 `e3` 级别认证且具有重大版本（内部或与 `si` 组织合作）版本管理/实施经验的顾问，应承担实施任务，如需求评审、配置、蓝图设计和实现。此类顾问在完成一次实施后，可被归类到
  `e4` 能力级别。


  典型的培训议程可能涵盖以下方面：


  ### 基础——`e1`


  -   物流概览（针对类别 2）

  -   物流流程（针对类别 2）

  -   `sap` 术语（针对类别 1）

  -   `sap` 概览（针对类别 1）

  -   `sap netweaver` 概览（针对类别 1）


  ### 入门——`e2`


  -   `sap tm` 概览

  -   `tm` 架构概览

  -   `sap tm` 术语

  -   主数据

  -   订单管理，包括基于订单的运输需求、基于交货的运输需求和转运订单

  -   费用管理

  -   运输计划

  -   货运单管理

  -   转运与货运结算

  -   完整端到端场景演示


  ### 高级——`e3`


  -   空运流程

  -   标准操作程序

  -   成本分摊

  -   出口/进口处理

  -   服务产品和项目


  ## `tm` 顾问的留任


  由于需求强劲而供应薄弱，`sap tm` 顾问的留任是用户组织面临的一项重大挑战。技能娴熟的资源稀缺，而已获批准且正在进行的实施项目通常提供更高薪酬、奖励和成长机会的工作。考虑到这种情况，组织需要制定一个全面的计划，以确保留住其技能娴熟的
  `sap tm` 顾问。跨模块接触以提升技能是一种解决方案。提名参加不同的培训计划以更新技能、促进工作轮换以及合理化薪酬，是留住优秀 `sap tm` 顾问的其他一些方法。


  ## 总结


  `sap tm` 实施方案是第三方物流的一项重大转型项目，需要大量经验丰富且经过培训的 `sap tm` 资源来管理实施、多次推广并提供支持。然而，由于 `sap
  tm 9.0` 相对较新，能否获得技能娴熟且经验丰富的资源是一个重大挑战。因此，为了早日实现投资回报并确保项目成功，您需要创建一个全面的提升与能力建设计划来应对这一挑战。您应该组建一支兼具物流领域知识和
  `sap tm` 经验的资源团队。此外，完全依靠内部资源并非良策。您需要聘请合格的 `si` 供应商，为各种角色提供经验丰富的资源。同时在设计解决方案时，建议与
  `sap ag` 的运输业务部门合作，并使您的需求与其未来路线图保持一致。


  您的转型计划可能会影响您未来与客户和供应商的合作方式。这必须谨慎处理。下一章将讨论如何管理这种影响。




