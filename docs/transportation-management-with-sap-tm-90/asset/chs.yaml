  \ `已执行`。\n\n### 客户开票与运费结算\n\n在此流程中，财务部门将计算应向客户收取的费用，进行核对，并向客户开具发票。同样，应付账款部门将执行运费单审计，核实承运人收取的费用，并进行运费结算。货代结算和运费结算用户界面是\
  \ SAP TM 中用于执行此流程的界面之一。\n\n#### 计算开票费用\n\n对于给定的场景，要计算费用，请以编辑模式打开货代订单（出口），然后从 `计算费用`\
