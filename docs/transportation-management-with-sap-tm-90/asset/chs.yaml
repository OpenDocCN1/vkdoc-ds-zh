  \n#### 计算开票费用\n\n对于给定的场景，所有货运订单（提货、前置运输、续程运输、交货）以及发货单的费用将由系统自动计算。\n\n然而，我们假设由于某种原因，货运订单（提货）的费用尚未自动计算。要计算费用，请以编辑模式打开货运订单（提货），然后从\
  \ `计算费用` 菜单中选择 `计算费用`。\n\n![A978-1-4302-6026-4_11_Fig245_HTML.jpg](img/A978-1-4302-6026-4_11_Fig245_HTML.jpg)\n\
