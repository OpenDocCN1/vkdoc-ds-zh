- "# 关于作者\n\n\n\n![A978-1-4302-6026-4_BookFrontmatter_Fig1_HTML.jpg](img/A978-1-4302-6026-4_BookFrontmatter_Fig1_HTML.jpg)\
  \  \n**杰扬特·达坦卡尔**拥有 24 年的行业和 SAP 经验。他曾为全球客户提供多项咨询工作。他在财务领域拥有深厚的领域知识，并持有多种专业资质，包括\
  \ SAP 财务与控制认证顾问、SAP 运输单元交付主管，以及 SAP 运输管理物流实践及其他业务部门的推动者。杰扬特还曾担任高级职务，负责大型企业资源规划项目中的业务流程再造交付、系统分析，以及针对客户特定需求进行\
  \ SAP 流程的应用设计。从 SAP 运输管理产品的 6.0 版本到其最新版本，他一直与其紧密合作。杰扬特目前在全球 IT 组织中担任卓越中心负责人。\n\n\
  ![A978-1-4302-6026-4_BookFrontmatter_Fig2_HTML.jpg](img/A978-1-4302-6026-4_BookFrontmatter_Fig2_HTML.jpg)\
  \  \n**泰杰库马尔·潘迪特**在供应链管理、客户关系管理、运输、零售、仓储及相关软件技术等领域拥有超过 20 年的工作经验。他在物流行业拥有多年多样化的一线实践经验，曾担任货运主管、运营经理等关键职位。此外，在过去\
  \ 11 年中，他在构建运输管理、配送管理以及追踪追溯等技术解决方案方面发挥了关键作用。作为物流与运输实践负责人，他在与客户的 C 级高管沟通、了解其组织的需求与挑战方面扮演着关键角色。泰杰库马尔目前是一名顾问，负责设计有助于公司实现增长目标的运营流程及相关技术架构。\n\
  \n## 关于技术审校者\n\n![A978-1-4302-6026-4_BookFrontmatter_Fig3_HTML.jpg](img/A978-1-4302-6026-4_BookFrontmatter_Fig3_HTML.jpg)\
  \  \n**什里坎特·希拉卡尔**是一名资深管理专业人士，拥有领导和管理业务职能以及为大型企业提供技术咨询的经验。他目前正在为一家提供 IT 服务、咨询和业务解决方案的领先科技公司整合分析实践。他曾为财富\
  \ 500 强企业在印度及全球范围内建立、扩展和多元化业务。他还撰写了多本畅销书，并发表了关于技术领域的白皮书。他拥有多项由其本人开发的创新专利。\n\n##\
  \ 引言\n\n全球化在供应链跨越国家和大陆、演变为日新月异的全球网络这一进程中发挥了关键作用。制造商出于生产高性价比、高质量产品的渴望，不断延伸其供需链条，从而给这些网络带来了新的挑战。这一巨大转变导致内部物流功能的逐步淘汰，并向第三方物流提供商（3PL）转移，使制造商能够专注于其核心业务领域。3PL\
  \ 每天都要面对苛刻的客户、不断变化的法规、合规标准，以及自身信息技术（IT）成熟度与客户期望之间的差距。因此，3PL 已开始简化、现代化和标准化其 IT 系统。其目标是构建一个能够满足所有需求的系统架构，同时用一个强大的平台取代大多数现有的复杂且零散的系统。特别是那些处理关键功能领域的应用，如订单管理、运输计划、执行、仓储、财务、计费以及定价和成本核算，亟需关注。因此，运输管理系统（TMS）即使不是最关键，也已成为了关键领域之一。\n\
  \nTMS 的实施至关重要。如果执行得当，一个优秀的 TMS 可以在优化、提高效率、减少错误和增加收入方面为组织带来诸多好处。然而，许多项目因一系列原因未能实现这些目标，这些原因包括产品选择错误、系统过度定制、缺乏标准化流程以及管理层支持不足。为了从\
  \ TMS 中获得最大收益，产品选择流程和实施方法论发挥着重要作用。\n\n本书旨在提供见解，使 SAP 运输管理（SAP TM）之旅更具相关性和成效性。凭借经过验证的评估框架和可靠的建议，本书对高管、售前团队以及实施和推广团队都很有用。此外，它还可以帮助决策者，如首席信息官（CIO）和首席体验官（CXO），完成选择产品、创建业务案例以供管理层审批，以及为组织设计未来路线图等重要任务。本书结合了研究与分析的结果，以及与行业领导者合作所积累的经验知识，有助于加深对\
  \ SAP TM 的理解，并可作为一份分步实施和推广指南。\n\n本书结构如下：\n\n*   运输行业概述：3PL 视角\n*   TMS 的需求：挑战与 IT\
  \ 架构\n*   TMS 产品格局：供应商、产品概述、计划与比较\n*   SAP TM：概述、架构与路线图\n*   TMS 选择框架\n*   SAP TM\
  \ 实施、推广和维护的行业最佳实践\n*   实施 TM 所需的团队组成与技能矩阵，以及如何培养 TM 能力\n*   SAP TM 实施的转型影响\n*  \
  \ 新产品维度：HANA、移动性与分析——它们对运输管理的影响\n*   端到端货运生命周期场景的流程映射\n*   配置和实施 SAP TM 9.0 的分步指南\n\
  \n## 致谢\n\n我们要感谢普尼特·奇达在本书撰写过程中提供的帮助。他在物流行业，尤其是 SAP 运输管理方面的知识和经验，是无价之宝。\n\n\n\n"
