- '# 9. 新维度产品：HANA、移动性和分析——其对运输管理的影响


  在本章中，我们将讨论以下内容：


  - 新`SAP TM`产品/解决方案套件简介

  - 这些产品/解决方案如何帮助尽早获得投资回报


  在贸易发展，进而商业发展的进程中，高效的运输和物流网络至关重要。在这个领域，任何低效都可能导致损失。因此，运输和物流行业的参与者在其运营方面承受着持续的压力，需要更加敏捷，通过更好的预测和分析来降低成本和复杂性，通过更深入地了解供应链执行来提高效率，并促进可持续发展。管理全球网络所带来的复杂性——不断变化的跨境和贸易规则法规、不断演变的供应模式以及日益苛刻的客户——正迫使运输和物流行业的参与者进行创新。


  我们强烈建议运输和物流参与者（如贵公司）投资于能够提供以下益处的解决方案：


  - 访问实时数据；例如，能够访问从资产生成的实时信息，可以动态确定维护需求（预测性维护）。

  - 分析大量数据以产生有意义洞察的能力；例如，承运商可以利用大数据分析来确定运营的潜在路线，从而将与失败路线相关的间接成本降至最低。

  - 集成解决方案，在整个企业内提供单一的数据视图，从而极大地降低成本和复杂性。

  - 跟踪、分析和解读社交网络上与客户对话的能力。


  总之，你需要能够让你访问实时数据，同时对结构化和非结构化数据提供分析能力的集成解决方案。在此，我们推荐来自`SAP TM`产品套件的一些解决方案，它们可以应对这些挑战。我们还相信，一旦你实施了`SAP`，在你的业务格局中引入这些产品/解决方案可以帮助你尽早获得投资回报。


  ## SAP HANA 解决方案


  `SAP HANA`是`SAP`技术战略的核心，其关键应用已支持`SAP HANA`或在其路线图中包含了对`SAP HANA`的支持。运输和物流行业已有一些关键的基于`SAP
  HANA`的解决方案可用。该行业对`SAP HANA`的采用相对较慢。然而，我们相信，随着更多物流组织实施`SAP TM`，并且预测技术变得普遍并被广泛接受，采用率很快就会增加。`SAP
  HANA`使企业能够实时访问交易数据，并快速分析大量数据。我们确信，贵组织可以利用`HANA`的能力来确保优化和按时绩效；改进规划、预测和承运商选择；以及实现更多目标。在以下章节中，我们将考察运输和物流行业内几个特定子行业的关键业务驱动因素，以展示`HANA`如何增加价值。




  ### 车队运营商（陆路运输）


  卡车是陆路运输不可或缺的组成部分。车队运营商的盈利能力，取决于其能否确保最佳运力利用率、准时绩效与车辆可用性，同时降低燃油费用和维护开销。`SAP HANA`
  可通过以下方式为车队运营商提供帮助：


  - **车辆维护**：`SAP HANA` 可帮助车队运营商更好地管理车辆维护。数据模型能够分析从车载计算机收集的信息，以评估车辆的维护需求。基于此分析，车队运营商可以主动进行车辆维护。

  - **实时路线管理**：获取实时信息使运营商能够动态调整路线，以防止因恶劣天气或交通问题导致的意外延误。

  - **运力与燃油管理**：通过使用先进的规划和预测模型，运营商可以确定最佳运营卡车数量以及每趟行程的最短可能路线，从而降低因路线不佳和空车行驶而产生的间接成本。


  ### 铁路运营商


  `SAP HANA` 为车队运营商提供的一些关键优势，例如主动维护、最佳路线规划和运力管理，同样适用于铁路运营商。此外，`SAP HANA` 还能在资产管理和客户管理方面为铁路运营商提供帮助。


  - **资产管理**：从整个铁路网络传感器生成的信息，可以馈入数据模型，以实时确定中断情况。这些数据的洞察有助于主动识别网络问题，从而减少维修开支并确保安全。

  - **客户管理**：在推出新服务产品和促销活动时，铁路运营商可以利用 `SAP HANA` 处理海量数据的能力对客户进行细分，从而帮助他们更精准地定位目标客户。


  ### 航空公司（航空运输）


  航空运输业同样可以显著受益于 `SAP HANA` 的实时数据管理能力。就航空业而言，我们建议将 `HANA` 用于上述所有领域以及以下领域：


  - **预测性维护**：作为维护、维修和大修（MRO）的一部分，航空公司可以充分利用 `HANA` 来预测资产维护需求。

  - **航线盈利与燃油管理**：`HANA` 可用于预测航线的潜力和盈利能力。


  同样，涉及海运的公司也可以从 `SAP HANA` 的能力中受益。


  `SAP TM` 作为用于交易、规划和监控的集成系统，正越来越被运输和物流行业所接受。这实质上意味着，在实施该系统的任何组织内，`SAP TM` 是其生成的大部分数据的来源。因此，我们建议将
  `SAP TM` 与 `SAP HANA` 集成，以进行任何类型的分析。下一个版本的 `SAP TM`（运行于 `SAP HANA` 之上）将内置供应链报告功能，从而增强报告能力和近乎实时的决策。此外，大型全球性铁路货运运营商正在探索实施利用
  `SAP HANA` 强大功能的货运管理解决方案。


  ## 移动性


  您的组织管理供应链中的"移动"功能，负责规划、实施和控制货物、服务及相关信息在起讫点之间的正向与逆向流动。货物可以直接运输，或通过一个或多个转运点，由一种或多种运输方式承运，并且多个机构会在其生命周期的不同阶段处理货物。同样处于移动状态的还有资产，例如卡车、拖车、火车、船舶、集装箱、飞机、物料搬运设备以及执行提货、送货和销售任务的人员。面对如此众多的移动参与者，了解他们在哪里、正在做什么、何时能接受下一个任务、能执行什么、在现场是否遇到困难、表现是否符合预期等等信息至关重要；客户期望您了解他们的货物正在发生什么、已经运输了多远、何时能送达、货物是否完好或受损等等。您需要能够实时了解货物的生命周期、资产使用情况，并能与现场人员进行双向沟通。与以
  SAP 为核心的供应链执行系统集成的移动技术，可以解决其中的大部分挑战。现场使用的移动设备可以捕获与货物相关的数据，并将其与安装了以 SAP 为核心的供应链执行平台的中央服务器共享。这样，这些信息就可以提前用于货物规划。在现场捕获的有关交付、延误和偏差的信息，可以轻松录入系统，用于内部使用，并输出给客户和供应商。通过这种方式，您可以提高生产率，同时降低运营成本并提升客户服务水平。


  可在您的行业部署的移动技术包括：全球定位系统（GPS），用于资产追踪和基于位置的服务；射频识别（RFID），用于定位仓库/码头中的货物；RFID 读写器和扫描仪，用于更快速的扫描、盘点、发货和收货；以及带有业务应用程序的手机，用于查询、更新和双向通信。


  借助各种移动技术，您可以：


  - 简化装载计划、路线规划和调度，以消除代价高昂的货物运输错误

  - 监控驾驶员和车辆性能，并向驾驶员传达动态路线决策，以帮助降低成本

  - 通过路线优化、与驾驶员保持持续实时连接和沟通以及跟踪最后一刻的变化，确保货物准时交付

  - 使用先进的数据采集技术，以数字方式扫描货运数据，将其传输到中央/本地服务器，更新交付信息和付款明细，并将损坏货物的照片传输给保险和理赔部门，从而消除代价高昂的纸质流程

  - 实时了解驾驶员和车辆表现，以确定驾驶员位置、行驶速度及其驾驶模式

  - 跟踪超出正常范围的怠速，准确安排货物装载时间，并为客户部署最合适的卡车

  - 在移动设备上使用包含报告仪表盘和工作流的智能业务应用程序，以改善供应链执行中参与者之间的协作；由于 `SAP TM` 处于该架构的中心，它可以扮演数据中心的角色——所有对数据的更新都可以通过
  `SAP TM` 进行，或直接更新到 SAP 系统中




  ### 社交媒体集成


  随着全球社交网络使用量的增加，社交媒体通过创建双向沟通、实现实时客户反馈与响应，正在开辟新的商业机会。鉴于该行业的规模和范围，必须挖掘社交媒体的潜力，以提升效率并与客户、业务合作伙伴以及大学、研究机构和监管机构等生态系统建立联系。


  社交媒体允许共享与行业相关的信息，例如燃油价格更新、承运商费率、新运输线路、行业新闻、可用货源、旅行建议、投诉、反馈和观点。其中一些提供的信息可直接使用。现代承运商正积极通过
  Facebook 和 Twitter 处理客户问题和投诉。许多第三方物流公司（3PL）在 Twitter 上发布货运详情，以帮助寻找承运商。卡车运输公司则共享设备位置，寻找可运输的货物。大多数使用运输管理系统（`TMS`）的托运人，在处理其他运输线路时，首先会向已建立关系的、相对较小且精选的承运商群体广播招标。托运人和经纪人发布的货源仅对其信任的此类承运商可见。承运商在其网站上发布可用运力和常规线路，因为他们确信只有其信任的托运人或经纪人才能看到。展示您运营状况以及如何与众不同的演示视频，会对客户产生持久的影响。


  社交媒体是对 `TMS` 的补充，而非替代；在达成适当匹配后，订单执行由 `TMS` 管理。与社交媒体的集成对于充分利用 `SAP` 至关重要。领先的第三方物流公司拥有门户网站，为所有合作伙伴和客户提供数据访问权限，同时向其他人提供社交讨论的访问权限。


  `SAP` 作为核心交易系统，可以在社交网络上共享其数据，例如货运或资产的可用性。您可以使用基于 `SAP TM` 构建的用例，通过逻辑获取这些数据；例如，六小时内未找到买家的货运可以被发送到社交媒体进行共享。一家物流公司若使用一个结合社交媒体来匹配报价与可用货运或建议最佳匹配的小型程序，再加上
  `SAP`，其选择将超越有限的合作伙伴基础。


  ## 分析


  该行业正在超越单纯报告历史数据，迈向预测性分析。然而，主要障碍在于数据分散在不同的系统中。在缺乏集成数据的情况下，能够带来效率提升、成本节约和改善客户服务的可行情报就会丧失。实施
  `SAP TM` 的组织将此类数据存储在单一系统中，从而节省了挖掘数据所需的时间。更重要的是，数据的完整性得以保留，从而能够以极少的时间投入支持基于事实的决策。


  `SAP TM` 解决了许多问题，例如：


  *   每条运输线路的运输重量、业务份额或运输分配

  *   每条运输线路的运输货量、业务份额或运输分配

  *   特定关系线路上的集装箱运输数量

  *   每条运输线路、承运商、托运人或收货人的平均运输成本

  *   托运人、承运商或收货人的可靠性（基于来自 `SAP` 的时间数据）

  *   危险品货物运输量占每条运输线路总运输量的百分比


  `SAP TM` 还提供了许多现成的报告：


  *   `SAP TM BW 7.3 Enhancement Package 1`：更侧重于成本和承运商分析

  *   `SAP TM 8.0`：更侧重托运人特定需求

  *   `SAP TM 9.0`：涵盖与收入相关的报告


  然而，考虑到实施 `SAP TM` 数月后其积累的海量数据，组织应为其业务确定关键绩效指标；推导出这些指标的定义（公式）；识别数据元素；并制定一项战略，将相关数据引入工作场所，以监控关键绩效指标，构建“假设”情景，并为组织内各级决策者创建仪表板。


  ## 总结


  一个集成了 `HANA`、移动平台、社交媒体平台和商业智能（`BI`）的 `SAP TM` 平台，可以为您提供对实时信息的访问，同时为您提供分析结构化和非结构化数据的能力。在本章中，我们重点介绍了运输和物流行业的一些优势。了解了这些产品/解决方案的功能和特性后，我们坚信，一旦您实施了
  `SAP`，在您的环境中引入这些产品/解决方案将有助于您早日获得投资回报。


  '
- '# 10. 端到端货运生命周期场景的流程映射


  在本章中，我们将讨论以下内容：


  *   构成货运物流端到端生命周期的顶层流程

  *   在 `SAP TM` 中映射这些流程

  *   在 `SAP TM` 中映射一个端到端货运物流流程场景


  在了解了 `SAP TM` 及其架构之后，让我们来看看货运流程生命周期及其在 `SAP TM` 中的映射，以及它与 `SAP Event Management`（`SAP
  EM`）、`SAP Global Trade Services`（`SAP GTS`）和 `SAP ERP` 的结合。


  ## 设置客户账户


  一旦客户同意财务和服务条款，第三方物流公司（3PL）的信用部门会审查客户的信用记录并设定信用额度。财务部门在系统中建立一个客户账户，包含信用额度，随后设定定价协议。


  财务部门使用财务系统（例如 `SAP FICO`）来设置客户账户和信用额度。然后，客户账户作为业务伙伴或地点（或两者）被传输到 `SAP TM` 中。定价协议在
  `SAP TM` 中作为货运代理协议创建。


  ## 接收货运订舱


  第三方物流公司通过电话、传真、电子邮件、电子数据交换（`EDI`）或门户网站接收来自客户的订舱请求。客户会联系第三方物流公司的当地办事处、集中客服部门或代理/子公司。


  客户联系的所在地的客服代理会向客户收集更多关于货运的信息。通常，这些信息包括运输方式（空运、海运或陆运[公路或铁路]）、货物规模（整箱 [`FCL`] 或拼箱
  [`LCL`]）、货物是否包含危险品或易腐品、货物何时可以启运或何时需要到达目的地、货物的起运地和目的地，以及货物是由客户在第三方物流公司指定的地点（如分公司、中转站、港口、仓库等）自提还是交付。


  来自多个应用程序、客户和模式（电话、传真、电子邮件、`EDI`、门户网站）的订单作为运输需求被接收到 `SAP TM` 中。根据订单需求及设定的业务规则，系统会构建货运单元（`SAP
  TM` 中最小的运输单位），用于合并或拆分运输需求（或两者兼有），以便将货物尺寸正确匹配到运输资源上，例如拖车、集装箱、船舶和铁路货车。


  ## 发送客户订单通知


  客户的订单通知通过电话、传真或电子邮件发送给必要的相关方，例如出口代理和计划部门。


  `SAP TM` 提供个性化对象工作列表（`POWL`），相关方（出口代理、计划部门等）可以通过该列表访问、管理和跟踪与订单相关的任务。




  ## 规划货运路线


  规划部门负责制定货物运往目的地路线。有时，规划部门会安排货物经由客户、分公司再到关口；其他情况下，货物可能直接从客户运往关口、机场或港口。主要目标是以尽可能低的成本将货物从出发地运送到目的地。


  在 SAP TM 中，规划部门可以选择手动或自动规划订单。自动规划时，后台运行的车辆调度与路线规划引擎会自动规划订单的路线。如需手动规划，规划部门应使用 SAP
  TM 提供的运输工作台。在提供选择配置和计划参数后，运输工作台会确定哪些订单将被列入规划范围，以及可用的资源和时间表。此外，在手动规划情况下，规划部门还有以下选项：


  -   交互式规划：选中待规划订单，然后将其拖放到资源/时间表上。

  -   一步式规划：选中待规划订单后，调用车辆调度与路线规划引擎进行规划。

  -   生成运输方案：如需在决策前查看多种路线选择，可使用此选项。


  路线规划完成后，即可选择承运商。SAP TM 提供手动和自动两种方式选择承运商。SAP TM 还具有以下招标选项：


  -   点对点招标：货运询价单按顺序依次发送给每个拟定的承运商。

  -   广播招标：货运询价单同时发送给所有拟定的承运商。


  也可以使用直接招标流程，将订单直接发送给特定承运商，无需询价。


  ## 预订承运商


  规划部门负责安排主干线路的承运商预订。规划部门通过电话、传真、电子邮件或 EDI 与承运商沟通，并预订所需舱位。收到预订请求后，承运商可决定接受、拒绝请求，或接受但需修改。无论哪种情况，承运商都会将决定通知规划部门。


  为了输入预订信息，SAP TM 提供了货运预订用户界面。通过此界面，规划部门可以向承运商请求预订舱位。相关信息可通过传真、电子邮件、EDI 或门户从 SAP TM
  传输给承运商。该界面还允许记录承运商的回复。


  ## 向客户确认订单


  承运商接受预订后，客户将通过电话、传真、电子邮件或 EDI 收到订单确认信息。


  SAP TM 中的货运订单用户界面提供了向客户确认订单的选项。


  ## 安排货物提取


  如果需要提取货物，分公司出口代理会与本地承运商协调安排。提取请求通过电话、传真、电子邮件或 EDI 发送给本地承运商。提取请求包含以下信息：提货和交货地点、提货日期和时间以及是否需要特殊设备。收到承运商（执行提货）的确认后，便将必要文件提供给承运商。


  分公司出口代理可以使用 SAP TM 中的货运订单用户界面发起提货请求。该界面允许用户输入所需信息、生成必要文件，并将信息和文件发送给承运商。此外，还可以记录提货请求的接受与拒绝情况。


  ## 提取货物并运至始发地仓库


  在预先约定的提货日期，承运商携带文件被派往托运人/供应商所在地。在那里，货物被装上卡车，并从托运人/供应商处收集运输文件，例如商业发票、托运人指示信和托运人出口报关单。货物和文件被送达提取请求时指定的分公司或地点。码头工人将货物从承运商的卡车上卸下、办理入库、签署文件、将货物存放在分公司仓库或其他存储地点，并将文件交给出口代理。


  货物执行和跟踪追溯在 SAP TM 中通过货运订单用户界面处理。SAP TM 提供一套关于货物的标准事件，例如“准备装载”、“已装载”、“已发运”和“已到达”，用于跟踪追溯。SAP
  TM 还可以与 SAP EM 集成，以实现更好的跟踪追溯。


  ## 准备货物装运


  分公司出口代理从码头工人处接收文件，并为码头工人创建拣货单，以便其提取货物（整批或部分）进行集拼。任何可能需要执行的特别服务或处理指示也会在拣货单上注明。


  SAP TM 的货运订单用户界面可用于打印各种文档。


  ## 办理出口海关清关（如需要）


  并非每个客户都将此项业务委托给同一家第三方物流。但是，如果获得委托，则需要进行出口合规性检查，包括受限方、禁运国家、已知托运人和违禁商品。信息通过传真、电子邮件、EDI
  或门户网站、使用第三方服务商或提交纸质文件副本的方式提供给海关官员。海关官员处理货物，或予以扣留，或放行。


  可以在 SAP TM 中手动设置订单的海关清关状态。根据设置，SAP TM 可能会在需要时阻止进一步的订单执行。如果 SAP TM 与 SAP GTS 集成，则可以自动设置海关状态。


  ## 准备集拼和文件


  根据出口代理提供的拣货单，码头工人从分公司仓库货架或其他存储地点提取货物，并根据需要进行集拼。如果需要执行任何额外服务，例如包装、收缩包装或熏蒸，这些都会在拣货单上注明。码头工人在拣货单上记录差异、已执行的服务以及收集到的相关文件，必要时添加额外备注。


  可以使用 SAP TM 的货运订单用户界面查看和打印运输指示。


  ## 将集拼货物移交给干线承运商


  干线承运商到达后，货物被装上卡车，文件被签署并交给承运商司机。


  SAP TM 提供使用货运订单用户界面查看和打印装运清单的选项。


  ## 将货物运往关口


  承运商从分公司或其他指定地点出发，前往关口。关口通过电话、传真或电子邮件收到通知。


  SAP TM 通过货运订单用户界面提供一套标准的作状态事件，例如“已发运”和“执行中”。根据货运订单的状态，货运订单的状态会自动更新，从而实现订单跟踪。SAP
  TM 可以与 SAP EM 集成，以实现更增强的跟踪。此外，使用 POWL，人员可以访问和跟踪预计到达的订单。




  ## 将货物运送至集散枢纽


  长途运输承运商将货物和单证文件运送至集散枢纽。码头工人从承运商的卡车上卸下货物、办理货物入库、签署单证、将货物存放在集散枢纽的仓库中，并将单证文件交给集散枢纽代理人。承运商就其提供的服务向第三方物流（3PL）开具发票。


  可以使用 `SAP TM` 货运单用户界面来计算承运商将要开具发票的运费。该界面还可用于将状态更新为“已到达”。根据货运单的状态，转运单的状态会自动更新，从而实现订单跟踪。`SAP
  TM` 可与 `SAP EM` 集成，以实现更加强大的跟踪功能。


  ## 规划出站拼箱


  集散枢纽代理人查看进站拼箱情况，并确定需要规划的出站拼箱，例如必要的设备（集装箱等）。出站拼箱计划基于以下因素：进站拼箱的到达时间、目的地、这些拼箱中货物所需的服务、商品类型、货物是否属于危险品、易腐品或高价值货物，以及货物是否因其运输方式而超尺寸或超重。


  集散枢纽代理人可以使用计划引擎识别可用资源以及可合并的货物。在合并时，计划引擎会考虑各种参数，例如不兼容性、容量以及装卸时长。计划引擎还会检查危险品。计划可以自动或手动完成。


  ## 将货物指派给出站集散枢纽拼箱


  集散枢纽代理人将货物（全部或部分）指派给承运商已确认的运输作业。代理人还会为码头工人创建拣货单文件，以便其能够提取货物进行拼箱操作。需要执行的任何特殊服务或操作说明都将被记录。


  集散枢纽代理人可以使用 `SAP TM` 中的货运订舱用户界面生成一份装运单据交给码头工人，并提供有关实际拼箱操作的说明。


  ## 准备拼箱操作


  码头工人收到集散枢纽代理人的拣货单，根据拣货单从集散枢纽仓库货架上提取货物，并构建拼箱；同时按需执行其他服务，例如包装、裹膜和熏蒸。码头工人在拣货单上记录差异、已执行的服务以及收集到的与这些服务相关的单证文件。码头工人将标注后的拣货单交回给集散枢纽代理人。


  ## 为干线运输创建单证


  集散枢纽代理人创建合适的运输单证，例如分提单、主提单以及货代收据/分舱单总单。集散枢纽代理人将完成的单证发送给相关方，例如，将运输单证交给码头工人，或（通过传真、电子邮件或
  EDI）将文件提供给承运商。


  `SAP TM` 的货运订舱用户界面提供查看和打印舱单及其他文件的选项。


  ## 为拖车运输创建单证并调配至主承运商


  集散枢纽代理人安排拼箱货物（通过拖车）从集散枢纽运往主承运商。拖车承运商可能提取并递送一个或多个拼箱货物。拖车承运商到达后，货物被装上卡车。签署单证文件并交给拖车承运商司机。拖车承运商离开，将拼箱货物运至相应的承运商处。集散枢纽代理人可以将运输作业状态更新为“已提交给承运商”。货物最终交付给主承运商。


  可以使用 `SAP TM` 中的货运订舱用户界面创建货运单。集散枢纽代理人可以使用该界面安排拖车运输并生成必要的文件。


  ## 将货物运至目的地集散枢纽或分公司


  交付给主承运商后，货物被装载到运输工具（飞机、轮船、卡车、火车车厢）上。运输工具启程；出发和到达信息可以通过 EDI 发送给目的地集散枢纽、分公司和转运集散枢纽（如适用）。


  `SAP TM` 中的货运订舱用户界面提供一组标准的状态事件，例如“执行中”和“已确认装机”。一旦货运订舱的状态设置为“已确认装机”（空运）或“已装船”（海运），`SAP
  TM` 将自动创建进口货运订舱和转运单。`SAP TM` 可与 `SAP EM` 集成，以实现更强大的跟踪功能。


  ## 执行进口清关


  一旦货物装上飞机、轮船、卡车或火车车厢，并且该运输工具启程前往国际目的地，目的地进港分公司/集散枢纽以及目的港/边境的海关代理机构会持续收到信息。第三方物流的目的地分公司会告知客户预计到达的货物。进港货物的清关工作可能由负责转运货物的第三方物流执行，也可能不执行，因为每个客户都可以自由指定报关代理，这可以是运输该货物的第三方物流，也可以是其他机构。海关可以选择使用
  X 光、实物查验、单证审核等方式检查货物；关税和税款由第三方物流或客户直接向海关支付。


  `SAP TM` 提供手动更新订单海关状态的选项。此外，`SAP TM` 可与 `SAP GTS` 集成，以实现合规性检查、与海关沟通以及接收海关的状态更新。


  ## 安排从承运商处提货


  如果需要从主承运商处提货，分公司/进港集散枢纽代理人会安排与承运商进行此项操作。为拖车承运商生成一份提货单，用于从主承运商处提取货物。提货单发送给拖车承运商，告知其提货和送货地点，以及搬运货物所需的任何特殊设备。在主承运商所在地，货物被装上卡车。通常，装运单据（通过传真、电子邮件或邮件发送）会从主承运商处收集。拖车承运商将货物和单证文件运送至指定地点。


  货物可以从主承运商处直接运往目的地分公司所在地，也可能在运往分公司之前先停靠在一个集散枢纽。拖车承运商就其提供的服务开具发票。码头工人从拖车承运商的卡车上卸下货物、办理入库、签署单据、将货物存放在仓库，并将单据交给进口代理人。


  分公司代理可以使用 `SAP TM` 中的货运单用户界面或货运订舱用户界面创建一份货运单，用于从主承运商处提取货物并将其运送至目的地分公司或集散枢纽。


  ## 安排货物递送


  一旦货物完成清关，客户可以从分公司提取货物。然而，如果需要送货，分公司代理会安排当地承运商进行此项操作。通过电话、传真、电子邮件或 EDI 向承运商发出送货请求。承运商使用这些相同方式之一确认请求。生成必要的文件并发送给承运商，告知其提货和送货地点以及搬运货物所需的任何特殊设备。


  分公司代理可以使用 `SAP TM` 中的货运单用户界面请求送货。一旦订单被接受，可以生成必要的文件。



