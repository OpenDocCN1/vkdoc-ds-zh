  \n#### 开票（运费结算）\n\n要验证是否已收到承运商的发票，需生成运费结算单据并传输至 SAP ERP 系统或其他财务系统。\n\n我们来看如何为运费订单（提货）创建运费结算单据。为此，以编辑模式打开运费订单（提货），并从`跟进`菜单中选择`创建运费结算`。\n\
