  \ | kg |\n\n##### 在 SAP 中创建费率表\n\n要定义费率表，请在 SAP NetWeaver Business Client 中，点击 **主数据**\
  \ ➤ **费用管理与服务产品目录** ➤ **费率表** ➤ **创建费率表定义**。\n\n不输入费率表模板，直接点击 **继续** 按钮。在 **常规数据**\
  \ 选项卡的 **基础数据** 部分，输入表中的相关数据。\n\n![图 A-125](img/A978-1-4302-6026-4_11_Fig125_HTML.jpg)\n\
  \n**图 A-125.** 创建费率表：常规数据选项卡的基础数据部分\n\n在 **常规数据** 选项卡的 **费用类型设置** 部分，再次输入相关数据。\n\
  \n![图 A-126](img/A978-1-4302-6026-4_11_Fig126_HTML.jpg)\n\n**图 A-126.** 创建费率表：常规数据选项卡的费用类型设置部分\n\
  \n现在，通过点击 **插入** 按钮在标度表中插入一行，并在 **标度表** 部分输入数据。\n\n![图 A-127](img/A978-1-4302-6026-4_11_Fig127_HTML.jpg)\n\
  \n**图 A-127.** 创建费率表 - 标度表部分\n\n输入必要的标度数据后，选择该标度行，然后点击 **生成标度** 按钮。接着，通过点击 **保存**\
  \ 按钮保存数据。\n\n接下来，点击 **编辑** 按钮，并在 **日期与数值** 部分，点击 **插入** 按钮以输入有效期数据。\n\n![图 A-128](img/A978-1-4302-6026-4_11_Fig128_HTML.jpg)\n\
  \n**图 A-128.** 创建费率表：日期与数值部分\n\n在 **日期与数值** 部分的 **费率** 选项卡中，选择一个新行，并输入相关数据。\n\n\
  ![图 A-129](img/A978-1-4302-6026-4_11_Fig129_HTML.jpg)\n\n**图 A-129.** 创建费率表：费率选项卡\n\
  \n在 **日期与数值** 部分的 **计算规则** 选项卡中，再次选择一个新行，并输入数据。\n\n![图 A-130](img/A978-1-4302-6026-4_11_Fig130_HTML.jpg)\n\
  \n**图 A-130.** 创建费率表：计算规则选项卡\n\n现在，点击 **发布** 按钮以发布费率表。\n\n输入必要数据后，点击 **保存** 按钮保存数据。\n\
  \n通过这种方式，定义其余的费率表。\n\n\n\n### 定义计算单\n\n为了计算货运订单/订舱或转运订单产生的费用，需要在系统中定义计算单。\n\n针对给定场景，您需要定义表\
