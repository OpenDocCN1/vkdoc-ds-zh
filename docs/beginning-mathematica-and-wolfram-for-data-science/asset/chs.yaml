  \ 1，右上角三角形表示聚类 2，左上角菱形表示聚类 3。\n\n**图 8-41**\n\n基于前两个特征的鸢尾花数据聚类分类\n\n```\nIn[128]:=\
  \ ListPlot[Pick[testSet,cC[testSet],#]&/@{1,2,3},PlotMarkers->\"OpenMarkers\",GridLines->Automatic,PlotLegends->{Placeholder[Style[\"\
