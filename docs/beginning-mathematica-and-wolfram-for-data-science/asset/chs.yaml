  ### 色调颜色函数与 `List3D`


  `Hue` 颜色函数是一种指令，用于指定根据数值所处的高度为其着色。`Hue` 颜色函数有四个参数：第一个参数用于颜色的色调（色相）；第二个参数标记饱和度；第三个参数标记亮度；第四个参数是不透明度。使用
  `Hue`，可以从前述四个特征中，从图形上充分识别高低区域（见图 5-46）。你可以标记这四个不同的参数。色调参数的取值范围是 0 到 1。


  ![](img/500903_2_En_5_Fig46_HTML.jpg)


  一个三维图，标题为“我的三维图”。它在矩形立方体内绘制了一个带有颜色渐变的网格曲面。


  图 5-46

  带有彩色色调值的 3D 图


  ```

  In[52]:= Plot3D[Sin[0.9(x²+y³)]/0.5,{x,-1,1},{y,-1,1}, FaceGrids-> None,ColorFunction
  -> (Hue[0.5,1,0.6,0.5]&),PlotLabel->Style["My 3D Plot",Italic,"Arial"], Background->Black]

  Out[52]=

  ```


  对于三维散点图（见图 5-47），你可以使用相同的数据来实现。使用 `ListPlot3D`，这些点被连接起来，形成一个由每个点的高度值表示的曲面。使用 `ListPointPlot3D`，则会生成一个三维散点图。


  ![](img/500903_2_En_5_Fig47_HTML.jpg)


  两个三维图。左侧的图标题为“List Plot 3D”，在矩形立方体内绘制了一个波动的颜色渐变网格曲面。右侧的图标题为“List Point Plot 3D”，在方形立方体内绘制了带有离群值的数据点。两个图都带有颜色渐变比例尺。


  图 5-47

  针对随机实数的 `ListPlot3D` 和 `ListPointPlot3D`


  ```

  In[53]:=Row[{ListPlot3D[Table[RandomReal[1,5],{i,5}],ColorFunction->"SunsetColors",Ticks->None,
  PlotLegends-> BarLegend[Automatic,egendMarkerSize->90],ImageSize-> Small,PlotLabel->"ListPlot3D",Filling->Bottom,BoxRatios->
  Automatic] , ListPointPlot3D[Table[RandomReal[1,5],{i,5}], ColorFunction->"Rainbow",
  PlotLegends->BarLegend[Automatic, LegendMarkerSize->90], ImageSize->Small, PlotLabel->"
  ListPointPlot3D",Filling->Bottom,BoxStyle->Thick, BoxRatios->{1,1,1}]},Background->Lighter[Gray,0.80],Frame->True]

  Out[53]=

  ```


  ## 等高线图


  可视化二元函数的一种方法是使用标量场，其中标量 `z = f (x, y)` 被映射到点 `(x, y)`。标量场可以通过其等高线（或等值线）来表征，沿着这些线，`f
  (x, y)` 的值是恒定的。等高线图或等值线的迹线可以使用 `ContourPlot` 命令来完成，如下例所示。


  ```

  In[54]:= ContourPlot[-((Pi*x)/(3+x²+y²)),{x,-5,5},{y,-5,5},ColorFunction->"Temperature",PlotLegends->Automatic,FrameLabel->{x,y}]

  Out[54]=

  ```


  图 5-48 使用 `ColorFunction` 和 `PlotLegends` 选项绘制了一个等高线图。当你使用 `PlotLegends` 时，你可以指定图表应使用的图例类型；在此例中，你使用了自动设置。这会根据每条轮廓线的颜色显示等高线的比例尺；例如，红色表示数值在
  0.8 或以上。当光标经过等高线曲线时，会显示该曲线的数值。要在图形图像中标记等高线曲线的数值，请添加 `ContourLabels` 选项并将其值设置为 true，如图
  5-49 所示。要添加穿过图形的线条，可以使用之前见过的 `GridLines` 命令，或者使用 `Mesh`。`Mesh` 可以与 `MeshFunction`
  或 `MeshStyle` 结合使用。


  ![](img/500903_2_En_5_Fig49_HTML.jpg)


  一个等高线图，带有从 -0.8 到 0.8 的颜色渐变比例尺。原点左侧以明亮色调着色，表示较高数值，而原点右侧以暗色调着色，表示较低数值。两侧都绘制了带有等高线的同心环。


  图 5-49

  在等高线图中添加了等高线


  ![](img/500903_2_En_5_Fig48_HTML.jpg)


  一个等高线图，带有从 -0.8 到 0.8 的颜色渐变比例尺。原点左侧以明亮色调着色，表示较高数值，而原点右侧以暗色调着色，表示较低数值。两侧都绘制了同心环。


  图 5-48

  针对定义的 z 函数的等高线图


  ```

  In[55]:= ContourPlot[-((Pi*x)/(3+x²+y²)), {x,-5,5}, {y,-5,5}, ColorFunction->"DeepSeaColors",
  PlotLegends-> Automatic, FrameLabel->{x,y}, ContourLabels->True, Mesh->{10,10},
  MeshStyle->{White}, MeshFunctions-> {#3&}]

  Out[55]=

  ```


  要将数据绘制成等高线图（见图 5-50），请使用 `ListContourPlot`。`ListContourPlot` 根据以高度值表示的数值数组创建等高线图。


  ![](img/500903_2_En_5_Fig50_HTML.jpg)


  一个等高线图，绘制了同心凸形图案。图的右上角以明亮色调着色，表示较高数值，而图的左下角以暗色调着色，表示较低数值。


  图 5-50

  `ListContourPlot`


  ```

  In[56]:= ListContourPlot[Table[Exp[x]*Sin[y],{x,0,2,.1},{y,0,2,.1}],ContourLines->True,Mesh->Full,ContourLabels->True]

  Out[56]=

  ```


  另一种绘图是 `DensityPlot`（见图 5-51）。`DensityPlot` 的工作方式与 `ContourPlot` 类似。


  ![](img/500903_2_En_5_Fig51_HTML.jpg)


  一个等高线图，以不同色调的圆形斑块绘制密度。这些斑块包含深色和浅色的颜色渐变。


  图 5-51

  密度图


  ```

  In[57]:= DensityPlot[(Sin[2x]*Cos[3y])/5,{x,0,5},{y,0,5}, ColorFunction->"SunsetColors",
  Mesh->Full]

  Out[57]=

  ```


  你可以使用 `ListDensityPlot` 根据数据绘制密度图（见图 5-52）。


  ![](img/500903_2_En_5_Fig52_HTML.jpg)


  一个等高线图，绘制了呈下降凹形趋势的密度，以不同色调着色。这些趋势包含深色和浅色的颜色渐变。颜色渐变比例尺范围从 -0.5 到 2.5。


  图 5-52

  以密度图表示的数据


  ```

  In[58]:= ListDensityPlot[Table[x/3 + Sin[3 x + y²], {x, 0, 5, 0.1}, {y, 0, 5, 0.1}],ColorFunction
  -> "LightTemperatureMap", Mesh -> 10, PlotLegends -> Placed[Automatic, Left]]

  Out[58]=

  ```




  ### 3D 绘图与二维投影


  使用 Wolfram 语言，可以在三维空间中绘制函数，同时将等高线图投影到坐标平面上，如图 5-53 所示。


  ![](img/500903_2_En_5_Fig53_HTML.jpg)


  一个在 XYZ 平面上的三维等高线图。它在图形的顶部和底部绘制了两层颜色渐变层。这些层具有环状和网格状的几何图案。


  图 5-53


  带有沿 xy 平面等高线图的三维绘图


  ```

  In[59]:= Show[Plot3D[(Sin[2 x]*Cos[2 y])/4, {x, 0, 2}, {y, 0, 2},

  PlotStyle -> Directive[Opacity[1]], AxesLabel -> {"X axis", "Y axis", "Z axis"},ColorFunction
  -> "Rainbow", PlotTheme -> "Marketing"],SliceContourPlot3D[(Sin[2 x]*Cos[2 y])/4,
  {z == -0.15,    z == 0.15}, {x, 0, 2}, {y, 0, 2}, {z, -1, 1}, ColorFunction -> "Rainbow",
  Boxed -> False],  ViewPoint -> {1, -1, 1}]

  Out[59]=

  ```


  我们来讨论一下代码中的操作。你首先绘制了一个三维函数（见图 5-53），然后使用命令指令为该函数添加颜色，并定义透明度类型，此处设置为 1。接着，为 x、y 和
  z 轴分别指定了相应的轴名称。`ColorFunction` 选项有助于定义颜色类型的函数；在本例中，它被设置为 `Rainbow`。`PlotTheme` 是一个用于选择不同可视化主题进行绘图的选项。至此，我们继续使用
  `SliceContourPlot3D`，它可以在一个平面或曲面上生成函数的图形。这里我们绘制了当 `z` 等于 ± 0.15 时的图形。这是在 xy 平面上进行的一个切片操作。此时
  `x` 和 `y` 的取值范围是 0 到 2，`z` 的取值范围是 –1 到 1。最后，使用 `Show` 命令将两个图形组合在一起；之所以使用这个命令，是因为仅通过绘制切片等高线图是无法得到函数的三维图形的。


  ## 绘图主题


  可以使用 `PlotTheme` 选项访问预构建的主题。当你添加 `PlotTheme` 选项并紧跟第一个撇号时，会看到自动补全菜单。图 5-54 展示了存在的不同主题。


  ![](img/500903_2_En_5_Fig54_HTML.jpg)


  一个列出弹出菜单的图表截图。它列出了可用的主题及其对应的图形。列表包括：Web、Minimal、Detailed、Business、Marketing、Scientific、Monochrome、Classic
  和 Default。底部是绘制主题和图形的选项。


  图 5-54


  `PlotTheme` 弹出菜单


