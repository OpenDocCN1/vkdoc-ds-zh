  \n```\nIn[43]:=Clear[fisher]\nDeleteObject[ResourceObject[\"Sample Data: Fisher's\
  \ Irises\"]]\n```\n\n## 总结\n\n本章探讨了使用 Wolfram 语言进行数据探索。首先介绍了 Wolfram 数据仓库，其中讲解了如何浏览网站并轻松选择合适的数据类别。接着，本章指导如何从仓库中提取数据，提供了在\
  \ Mathematica 中访问、筛选和观察数据的见解。此外，描述性统计部分让读者了解了表格和网格格式。通过本章的学习，读者将掌握二维和三维数据集的可视化技巧。\n\
  \n"
- "# 8. 使用 Wolfram 语言进行机器学习\n\n本章介绍了梯度下降算法作为线性回归的优化方法；展示了相应的计算过程以及模型学习曲线的概念。随后，你将看到如何在线性回归、逻辑回归和聚类搜索的情况下，使用\
  \ Wolfram 语言中用于机器学习的专用函数，例如 `Predict`、`Classify` 和 `ClusterClassify`。本章展示了这些函数生成的不同对象和结果，以及用于衡量模型的指标。在每种情况下，都解释了使用\
  \ Wolfram 语言正确构建模型所必需的关键部分。本书的这一部分使用了已知数据集的示例，例如 Fisher 鸢尾花数据集、波士顿房价数据集和泰坦尼克号数据集。\n\
  \n\n\n## 梯度下降算法\n\n梯度下降是一种通过迭代过程寻找函数最小值的优化算法。为了构建该过程，我们在线性模型假设下最小化平方误差损失函数，该假设的形式为\
  \ `f(x[j]) = θ[0] + θ[1] * x[j]`，作用于点 `x[j]` 附近。以下表达式给出了损失函数。\n\n![$$ J\\left(\\\
  theta \\right)=\\frac{1}{2\\ast N}{\\sum}_{j=1}^N{\\left(f\\left({x}_j\\right)-{y}_j\\\
  right)}² $$](img/500903_2_En_8_Chapter_TeX_Equa.png)\n\n`J(θ)` 是代价函数，`N` 是观测值的数量，`f(x[j])`\
  \ 是第 `j` 个观测值的预测输出，`y[j]` 是第 `j` 个观测值的实际输出。该算法的迭代过程包括计算系数，直到达到收敛。以下表达式给出了这些系数。\n\
  \n![$$ {\\theta}_0^{i+1}={\\theta}_0^i-\\alpha \\left(\\frac{1}{N}{\\sum}_{j=1}^N\\\
  left({\\theta}_0^i+{\\theta}_1^i\\ast {x}_j-{y}_j\\right)\\right) $$](img/500903_2_En_8_Chapter_TeX_Equb.png)\n\
  \n![$$ {\\theta}_1^{i+1}={\\theta}_1^i-\\alpha \\left(\\frac{1}{N}{\\sum}_{j=1}^N\\\
  left({\\theta}_0^i+{\\theta}_1^i\\ast {x}_j-{y}_j\\right)\\ast {x}_j\\right) $$](img/500903_2_En_8_Chapter_TeX_Equc.png)\n\
  \n这里，`θ[0]^(i+1)` 和 `θ[1]^(i+1)` 表示第 `i+1` 次迭代后更新的参数。`θ[0]^i` 和 `θ[1]^i` 表示它们在第\
  \ `i` 次迭代时的当前值，`α` 是学习率，一个用于更新 `θ[0]` 和 `θ[1]` 的超参数，其作用是在学习过程中最小化误差。同时，`N` 是数据集观测值的总数。`x[j]`\
  \ 和 `y[j]` 分别是数据集中第 `j` 个自变量和因变量的观测值。这些求和项是通过对 `θ[0]` 和 `θ[1]` 求偏导数得到的。关于该方法及其证明的更深入数学内容，请参阅\
  \ Stuart Russell 和 Peter Norvig 所著的 *《人工智能：一种现代方法》*（Prentice Hall，2010 年）。\n\n###\
  \ 获取数据\n\n首先，使用 `RandomReal` 函数定义数据并设置一个种子。这是为了在练习相同示例时保持数据的可复现性。\n\n```\nIn[1]:=\n\
  SeedRandom[888];\nx=RandomReal[{0,1},50];\ny=-1-x+0.6*RandomReal[{0,1},50];\n```\n\
  \n因此，让我们通过图 8-1 中的二维散点图来观察数据。\n\n![](img/500903_2_En_8_Fig1_HTML.jpg)\n\nY 对 X 的散点图显示负相关，最大值约为\
  \ (0.1, -0.6)，最小值约为 (0.9, -1.75)。这些数值是近似值。\n\n**图 8-1** 随机生成数据的二维散点图\n\n```\nIn[4]:=\
  \ ListPlot[Transpose[{x,y}],AxesLabel->{\"X axis\",\"Y axis\"},PlotStyle->Red]\n\
  Out[4]=\n```\n\n### 算法实现\n\n现在，让我们用 Wolfram 语言来实现该算法。算法定义了常量、迭代次数和学习率。然后，创建两个包含初始值零的列表，用于存储每次迭代的系数值。接着，通过一个使用\
  \ `Table` 的循环来计算系数，该循环在达到迭代次数时结束。在本例中，我们设置迭代次数为 250，学习率为 1。\n\n```\nIn[5]:=\nitt=250;(*迭代次数*)\n\
  \\[Alpha]=1;(*学习率*)\n\\[Theta]0=Range@@{0,itt};(* Theta_0 值的数组*)\n\\[Theta]1=Range@@{0,itt};(*\
  \ Theta_1 值的数组*)\nTable[{\\[Theta]0[[i+1]]=\\[Theta]0[[i]]-\\[Alpha]/Length@x* Sum[(\\\
  [Theta]0[[i]]+\\[Theta]1[[i]]* x[[j]]-y[[j]]),{j,1,Length@x}];\n\\[Theta]1[[i+1]]=\\\
  [Theta]1[[i]]-\\[Alpha]/Length@x*Sum[( \\[Theta]0[[i]]+\\[Theta]1[[i]]*x[[j]]- y[[j]])*\
  \ x[[j]],{j,1,Length@x}];},{i,1,itt}];\n```\n\n由于已经确定了系数的计算方法，我们通过构建一个函数并使用最后一次迭代的系数值（这些值位于列表\
  \ `θ[0]` 和 `θ[1]` 的前一个位置）来建立线性调整方程。\n\n```\nIn[10]:= F[X_] := \\[Theta]0[[Length@\\\
  [Theta]0]] + \\[Theta]1[[Length@\\[Theta]1]]*X\n```\n\n为了了解最佳拟合线的形状，我们将 X 变量作为参数传入。这给出了形式\
  \ `F(X) = θ[0] + θ[1] * X`。\n\n```\nIn[11]:= F[X]\nOut[11]= -0.707789-0.923729 X\n\
  ```\n\n观察图 8-2 中该直线如何拟合数据。\n\n![](img/500903_2_En_8_Fig2_HTML.jpg)\n\nY 轴对 X 轴的散点图显示负相关，并有一条从\
  \ (0, -0.2) 到 (1, -1.6) 的递减直线。数据点随机分布在直线周围。\n\n**图 8-2** 数据拟合直线\n\n```\nIn[12]:=\
  \ Show[{Plot[F[X],{X,0,1},PlotStyle->Blue,AxesLabel->{\"X axis\",\"Y axis\"}],ListPlot[Transpose[{x,y}],PlotStyle->Red]}]\n\
  Out[12]=\n```\n\n既然已经构建了线性模型，我们可以对学习率随迭代次数变化以及由函数 `J` 给出的损失值进行图形化比较。但首先，必须声明损失函数\
  \ `J`。对于求和，既可以使用西格玛（`∑`）的特殊符号，也可以写成 `Sum[expr, {i, i[max]}]`。\n\n```\nIn[13]:= \
  \ J[Theta0_, Theta1_] :=  1/(2*Length[x])* Sum[ (Theta0 + (Theta1*x[[i]]) - y[[i]])²,\
  \ {i, 1, Length@x}]\n```\n\n\n\n#### 多个 Alpha 值\n\n在了解了之前构建的过程后，你可以针对不同的 alpha 值重复该过程。下图展示了当重复该过程时，对于学习率\
  \ `α1=1`、`α2=0.1`、`α3=0.01`、`α4=0.001` 和 `α5=0.001`，损失函数与每次迭代的关系图。\n\n```\nIn[14]:=\\\
  [Alpha]1=Transpose[{Range[0,itt],J[\\[Theta]0,\\[Theta]1]}];\nIn[20]:=\\[Alpha]2=Transpose[{Range[0,itt],J[\\\
  [Theta]0,\\[Theta]1]}];\nIn[26]:=\\[Alpha]3=Transpose[{Range[0,itt],J[\\[Theta]0,\\\
  [Theta]1]}];\nIn[32]:=\\[Alpha]4=Transpose[{Range[0,itt],J[\\[Theta]0,\\[Theta]1]}];\n\
  In[38]:=\\[Alpha]5=Transpose[{Range[0,itt],J[\\[Theta]0,\\[Theta]1]}];\n```\n\n\
  使用 `ListLinePlot` 绘制图形，并可视化不同 alpha 值下的学习曲线（见图 8-3）。当改变 alpha 值时，观察调整后的直线如何变化。\n\
  \n![](img/500903_2_En_8_Fig3_HTML.jpg)\n\n一张以损失函数与迭代次数为坐标的图表被称为学习曲线。图中包含 5 条递减曲线，从下到上对应的学习率\
  \ alpha 分别为 1、0.1、0.01、0.001 和 0.0001。其中 3 条曲线是线性的。\n\n**图 8-3** 梯度下降算法的学习曲线\n\n\
  ```\nIn[39]:=ListLinePlot[{\\[Alpha]1,\\[Alpha]2,\\[Alpha]3,\\[Alpha]4,\\[Alpha]5},FrameLabel->{\"\
  Number of Iterations\",\"Loss Function\"},Frame->True,PlotLabel->\"Learning Curve\"\
  ,PlotLegends-> SwatchLegend[{Style[\"\\[Alpha]=1\",#],Style[\"\\[Alpha]=0.1\",#],Style[\"\
  \\[Alpha]=0.01\",#],Style[\"\\[Alpha]=0.001\",#],Style[\"\\[Alpha]=0.0001\",#]},LegendLabel->Style[\"\
  Learning rate\",White],LegendFunction->(Framed[#,RoundingRadius->5,Background->Gray]&)]]&[White]\n\
  Out[39]=\n```\n\n在上图（见图 8-3）中，你可以直观地看到迭代次数与代价的关系，以及它如何随 alpha 值的变化而变化。使用较高的学习率，每一步可以覆盖更大的范围，但存在超过最低点的风险。要判断算法是否有效，你需要观察每次新迭代的损失函数是否在下降。相反的情况则表明算法运行不正确；这可能是由多种因素造成的，例如代码错误或学习率值不正确。如图所示，合适的\
  \ alpha 值对应于 1 到 `10^(-4)` 范围内的较小值。并非必须使用这些精确值，你可以使用该范围内的任何值。根据数据的形式，算法可能会或可能不会在不同的\
  \ alpha 值下收敛，迭代步数也是如此。如果你选择非常小的 alpha 值，算法可能需要很长时间才能收敛，正如你在 alpha 值为 `10^(-3)` 或\
  \ `10^(-4)` 时所看到的那样。\n\n## 线性回归\n\n尽管可以自行构建算法来执行线性回归，但 Wolfram 语言提供了一个专门用于机器学习的函数。对于线性回归问题，有\
  \ `Predict` 函数。`Predict` 函数也可以与不同的算法一起使用，而不仅仅是回归任务算法。\n\n### Predict 函数\n\n`Predict`\
  \ 函数通过使用训练数据创建一个预测函数来帮助你预测数值。它还允许你选择不同的学习算法，其目的是预测数值、视觉、分类值或它们的组合。可供选择的方法包括决策树、梯度提升树、线性回归、神经网络、最近邻、随机森林和高斯过程。每种方法内部都有选项；这些选项取决于用于训练预测函数所选择的算法。让我们来看看线性回归方法。`Predict`\
  \ 的输入数据可以是规则列表、关联或数据集的形式。\n\n### 波士顿数据集\n\n让我们来看第一个示例，从 Wolfram 数据仓库加载波士顿房价数据（见图\
  \ 8-4）。该数据集包含马萨诸塞州波士顿地区的住房信息。如需更深入的信息，请参考 David Harrison 和 Daniel Rubinfeld 在《环境经济与管理杂志》（1978\
  \ 年；5[1]，81–102\\. `https://doi.org/10.1016/0095-0696(78)90006-2`）上发表的论文《享乐主义房价与清洁空气需求》，或\
  \ David Belsley、Edwin Kuh 和 Roy Welsch 合著的《回归诊断：识别有影响力的数据和共线性来源：546》（Wiley-Interscience，2013\
  \ 年）。\n\n![](img/500903_2_En_8_Fig4_HTML.jpg)\n\n一个包含 10 个表头和 20 个字段的表格。表头分别为：CRIM、ZN、INDUS、CHAS、NOX、RM、AGE、DIS、RAD\
  \ 和 TAX。所有字段的 CHAS 值都相同，因为该区域不毗邻查尔斯河。\n\n**图 8-4** 波士顿房价数据集\n\n```\nIn[40]:= bstn=ResourceData[ResourceObject[\"\
  Sample Data: Boston Homes\"]]\nOut[40]=\n```\n\n尝试使用滚动条来完整查看数据集。让我们查看各列的描述，并以 `TableForm`\
  \ 形式显示。\n\n```\nIn[41]:= ResourceData[ResourceObject[\"Sample Data: Boston Homes\"\
  ],\"ColumnDescriptions\"]//TableForm\nOut[41]//TableForm= 城镇人均犯罪率\n占地面积超过 25000\
  \ 平方英尺的住宅用地比例\n每个城镇非零售商业用地的比例\n查尔斯河虚拟变量（1 表示区域毗邻河流，否则为 0）\n氮氧化物浓度（每千万分之一）\n每栋住宅的平均房间数\n\
  1940 年之前建造的自有住房比例\n到波士顿五个就业中心的加权平均距离\n通往放射状高速公路的便利性指数\n每 10000 美元的全额财产税率\n城镇的师生比\n\
  1000(Bk-0.63)²，其中 Bk 是城镇中黑人或非裔美国居民的比例\n人口中较低社会地位者的百分比（百分比）\n自有住房的中位价值（以千美元计）\n```\n\
  \n\n\n### 模型创建\n\n你将创建一个能够通过房屋房间数量预测波士顿地区房价的模型。为此，你需要关注的列是 `RM`（每栋房屋的平均房间数）和 `MEDV`（自住房屋的中位数价值），因为你希望找出房间数量与房价之间是否存在线性关系。根据常识，房间数量最多的房屋面积更大，因此可以容纳更多人，从而推高价格。\n\
  \n观察图 8-5 中 `MEDV` 和 `RM` 的散点图。\n\n![](img/500903_2_En_8_Fig5_HTML.jpg)\n\n`MEDV`\
  \ 与 `RM` 的散点图显示出正相关关系。图中中心位置绘制了一组由空心圆圈表示的点簇。\n\n**图 8-5** – `MEDV` 与 `RM` 的二维散点图\n\
  \n```\nIn[42]:= MEDVvsRM=Transpose[{Normal[bstn[All,\"RM\"]],Normal[bstn[All,\"\
  MEDV\"]]}];\nListPlot[MEDVvsRM,PlotMarkers->\"OpenMarkers\",Frame->True,FrameLabel->{Style[\"\
  RM\",Red],Style[\"MEDV\",Red]},GridLines->All,PlotStyle->Black,ImageSize->Medium]\n\
  Out[43]=\n```\n\n如图 8-5 所示，房价随着平均房间数的增加而上涨。这表明这两个变量之间存在直接的比例关系。根据图中观察到的情况，我们来了解这些变量之间的相关系数值。你可以通过计算值的相关性、分配刻度标签，并使用\
  \ `MatrixPlot` 绘制相关矩阵来展示这一点（见图 8-6）。\n\n![](img/500903_2_En_8_Fig6_HTML.jpg)\n\n\
  一个相关矩阵。`RM` 与 `RM` 以及 `MEDV` 与 `MEDV` 的单元格颜色较深，值为 1。`MEDV` 与 `RM` 以及 `RM` 与 `MEDV`\
  \ 的单元格颜色较浅，值为 0.7。右侧的垂直刻度范围从 0 到 1，增量为 0.2。\n\n**图 8-6** – 矩阵图与相关矩阵的结合\n\n```\n\
  In[44]:=correLat=SetPrecision[Correlation[Transpose[{Normal[bstn[All,\"RM\"]],Normal[bstn[All,\"\
  MEDV\"]]}]],2];\nxTicks={{1,\"RM\"},{2,\"MEDV\"},{1,\"RM\"},{2,\"MEDV\"}};\nyTicks={{1,\"\
  RM\"},{2,\"MEDV\"},{1,\"RM\"},{2,\"MEDV\"}};\npostionsValues={Text[#1,{0.5,1.5}],Text[#1,{1.5,0.5}],Text[#2,{1.5,1.5}],Text[#2,{0.5,0.5}]}&[correLat[[1,1]],correLat[[1,2]]];\n\
  MatrixPlot[correLat,ColorFunction->\"DarkRainbow\",FrameTicks->{  xTicks,yTicks,xTicks,yTicks},Epilog->{White,postionsValues},PlotLegends->BarLegend[{\"\
  DarkRainbow\",{0,1}},4],ImageSize->180]\nOut[48]=\n```\n\n通过观察矩阵图（见图 8-6），可以得出结论：`RM`\
  \ 和 `MEDV` 之间存在极好的线性关系。\n\n现在，让我们随机打乱数据集，并使用 `Thread` 建立一组规则列表，因为要输入到预测函数中的数据必须采用以下格式：`{x\
  \ → y}`——换句话说，即输入值和目标值。\n\n```\nIn[49]:= newData =  RandomSample[Thread[Normal[bstn[All,\
  \ \"RM\"]] -> Normal[bstn[All, \"MEDV\"]]]];\n```\n\n随机采样后，你选择前 354 个元素（70%）作为训练集，剩下的\
  \ 152 个（30%）作为测试集。在分割时，常见的比例包括 70/30（训练/测试）、80/20 和 60/40。其中，训练集用于训练模型，通常占数据的大部分。剩余部分，即测试集，是一个独立的数据集，用于评估模型在未见数据上的性能。选择取决于数据集的大小以及你想要执行的机器学习任务的详细条件等因素。\n\
  \n```\nIn[50]:= {training, test} = {newData[[;; 354]], newData[[355 ;;]]};\n```\n\
  \n你训练模型，该模型是一个以自住房屋平均值（`MEDV`）为目标的预测器。作为方法，你选择线性回归。在训练模型时，训练报告选项的规范包括 `Panel`（面板的动态更新）、`Print`（包含时间、训练示例、最佳方法、当前损失的周期性信息）、`ProgressIndicator`（简单的进度条）、`SimplePanel`（无图表的动态更新面板）和\
  \ `None`。`Panel` 是默认选项（见图 8-7）。\n\n![](img/500903_2_En_8_Fig7_HTML.jpg)\n\n一个预测函数，显示为左方括号、加号、输入类型\
  \ = 数值、方法 = 线性回归的图形函数、右方括号。\n\n**图 8-7** – 训练模型的 `PredictorFunction` 对象\n\n```\n\
  In[51]:=pF=Predict[training,Method->\"LinearRegression\",TrainingProgressReporting->\"\
  Panel\"]\nOut[51]=\n```\n\n输入代码时，根据添加到 `TrainingProgressReporting` 的选项，应该会出现一个进度条和面板报告（见图\
  \ 8-8）。面板显示的时间取决于模型的训练时间。要为训练设置特定时间，可以添加 `TimeGoal` 作为选项，该选项指定模型训练应持续的时间。时间值是 CPU\
  \ 时间的秒数——即不带单位的数字。如果使用时间单位（秒、分钟和小时），则需要使用 `Quantity` 命令，例如 `TimeGoal ➤ Quantity\
  \ [“time magnitude,” #] & / @ {“Second,” “Minute,” “Hour”}`。\n\n![](img/500903_2_En_8_Fig8_HTML.jpg)\n\
  \n预测进度报告的截图显示，已用时间 = 0.752 秒，使用的训练示例 = 283 / 354，当前最佳方法 = 线性回归，标准差 = 6.32，当前损失 =\
  \ 3.27。下方绘制了所用训练示例的标准差。\n\n**图 8-8** – `PredictorFunction` 的进度报告\n\n让我们回到模型。图 8-7\
  \ 显示返回对象是一个预测函数（尝试使用 `Head` 来验证）。当为预测函数分配名称时，可以获取关于模型的附加信息；使用 `Information` 命令（见图\
  \ 8-9）。该信息适用于所有其他表达式，而不仅仅是机器学习目的。\n\n![](img/500903_2_En_8_Fig9_HTML.jpg)\n\n预测器信息报告的截图包括数据类型、标准差、方法、单次评估时间、批量评估速度、损失、模型内存和训练时间。它有一个标准差图，其中一条递增的线穿过点\
  \ (10, 6.36)、(50, 6.42) 和 (250, 6.48)。\n\n**图 8-9** – 训练模型的信息报告\n\n> **注意**  \n\
  > 如果你希望涉及随机数据的结果是固定的，则需要在每次随机操作之前设置种子；这可以确保输出的一致性。\n\n```\nIn[52]:= Information[pF]\n\
  Out[52]=\n```\n\n图 8-9 中的信息面板包括数据类型、均方根（`StandardDeviation`）、方法、批量评估速度、损失、模型内存、训练示例数量和训练时间。面板底部的图形分别是标准差、模型学习曲线以及其他算法的学习曲线。将光标指针悬停在数值参数上会显示置信区间和单位。如果方法名称正确，则会显示线性回归方法的参数。由于你没有在\
  \ `LinearRegression` 方法中选择特定的优化算法，Mathematica 会尝试在所有算法中搜索最佳算法（这可以在所有算法的学习曲线中查看）。你将在后续内容中了解如何访问这些选项。\n\
  \n> **注意**  \n> 预测函数中使用的每种方法都有选项和子选项；如需完全自定义，请使用 Wolfram 语言文档中心。\n\n\n\n表 8-1 列出了可用于模型训练的标准选项，以及它们在\
  \ `PredictorFunction` 训练过程中的定义和可能取值。\n\n**表 8-1** 预测函数最常用选项\n\n| 选项 | 定义 |\n| ---\
  \ | --- |\n| `Method` | 算法。可能取值：`DecisionTree`、`GradientBoostedTrees`、`LinearRegression`、`NearestNeighbors`、`RandomForest`\
  \ 和 `GaussianProcess` |\n| `PerformanceGoal` | 性能优化。可能取值：`DirectTraining`、`Memory`、`Quality`、`Speed`、`TrainingSpeed`、`Automatic`。支持取值组合（`PerformanceGoal\
  \ -> {val1, val2}`） |\n| `RandomSeeding` | 伪随机数生成器的种子。可能取值：`Automatic`、`\"custom\
  \ seed\"`、`Inherited`（先前计算中使用的随机种子） |\n| `TargetDevice` | 指定执行训练或测试过程的设备。可能取值：`CPU`\
  \ 或 `GPU`。如果安装了 GPU，则自动目标设备为 GPU。 |\n| `TimeGoal` | 训练过程所花费的时间 |\n| `TrainingProgressReporting`\
  \ | 进度报告。可能取值：`Panel`、`Print`、`ProgressIndicator`、`SimplePanel`、`None` |\n\n###\
  \ 模型测量\n\n模型构建完成后，必须观察并分析预测函数在测试集上的性能。为此，你需要在 `PredictorMeasurments` 命令内进行操作。预测函数作为参数传入（见图\
  \ 8-10），其后跟测试集以及要添加的一个或多个属性。自最新版本起，最终模型特征预测会直接呈现，而不仅仅是 `PredictorMeasurements` 对象的模型。\n\
  \n![](img/500903_2_En_8_Fig10_HTML.jpg)\n\n预测测量报告包括预测方法、测试样本、标准差基线、R 平方、平均交叉熵、单次评估时间和批量评估速度。实际值与预测值的散点图通过一条递增的虚线显示了正相关性。\n\
  \n**图 8-10** 被测模型的 PredictorMeasurements 对象\n\n```\nIn[53]:= pRM = PredictorMeasurements[pF,\
  \ test]\nOut[53]=\n```\n\n返回的对象称为 `PredictorMeasurementsObject`。你可以从 `PredictorMeasurements`\
  \ 命令中添加属性。你可以为该对象分配一个变量，以便更简单地访问它。自 13 新版本起，输出中会直接给出报告，因此测试集的模型报告被抑制，因为它返回的内容与图\
  \ 8-10 相同。\n\n```\nIn[54]:= pRM[\"Report\"];\n```\n\n图 8-10 中的报告显示了不同的参数，例如标准差和平均交叉熵。它还显示了模型拟合图以及当前值和预测值。该模型适用于大多数情况，但一些异常值仍会影响性能。\n\
  \n为了更好地理解模型的精度，让我们查看图 8-11 中显示的均方根误差 (RMSE) 和 RSquared（决定系数）。要显示相关的不确定性，请使用值为 `True`\
  \ 的 `ComputeUncertainty` 选项。\n\n![](img/500903_2_En_8_Fig11_HTML.jpg)\n\n一个 2 行\
  \ 2 列的表格显示标准差 = 6.8 ± 0.8，R 平方 = 0.45 ± 0.17。\n\n**图 8-11** 线性模型的标准差和 r 平方值\n\n\
  ```\nIn[57]:= Dataset[AssociationMap[pRM[#, ComputeUncertainty -> True] &, {\"StandardDeviation\"\
  , \"RSquared\"}]]\nOut[57]=\n```\n\n这给出了一个略高的 RMSE 值，以及一个不算优秀的 r 平方值。请记住，r 平方值表示模型进行预测的效果如何。这两个值表明，尽管房间数量与价格之间可能存在线性关系，但线性回归并不一定能解释这一点。这些观察结果也是一致的，请记住你之前得到的相关系数值为\
  \ 0.7。\n\n### 模型评估\n\n在模型内部绘制的图形包括模型图和目标变量（`ComparisonPlot`）。要检查方差的分布，请使用 `ResidualHistogram`\
  \ 函数；要检查残差图，请使用 `ResidualPlot`。这些如图 8-12 所示。\n\n![](img/500903_2_En_8_Fig12_HTML.jpg)\n\
  \n3 张图。左图：计数与实际值减预测值的直方图，最高点在 (0, 50)。中图：实际值减预测值与预测值的残差图。有一条位于 0 的线，并绘制了数据点。右图：实际值与预测值的散点图，显示预测呈正相关性。\n\
  \n**图 8-12** ResidualHistogram、ResidualPlot 和 ComparisonPlot\n\n```\nIn[58]:= pRM[#]\
  \ & /@ {\"ResidualHistogram\", \"ResidualPlot\", \"ComparisonPlot\"} /. plot_Graphics\
  \ :> Show[plot, ImageSize -> Small]\nOut[58]=\n```\n\n你可以将 `Properties` 作为参数写入，以找出\
  \ `PredictorMeasurements` 对象的所有属性。这些属性可能因方法而异。\n\n```\nIn[59]:= pRM[\"Properties\"\
  ]\nOut[59]= {BatchEvaluationTime, BestPredictedExamples, ComparisonPlot, EvaluationTime,\
  \ Examples, FractionVarianceUnexplained, GeometricMeanProbabilityDensity, ICEPlots,\
  \ LeastCertainExamples, Likelihood, LogLikelihood, MeanCrossEntropy, MeanDeviation,\
  \ MeanSquare, MostCertainExamples, Perplexity, PredictorFunction, ProbabilityDensities,\
  \ ProbabilityDensityHistogram, Properties, RejectionRate, Report, ResidualHistogram,\
  \ ResidualPlot, Residuals, RSquared, SHAPPlots, SHAPValues, StandardDeviation, StandardDeviationBaseline,\
  \ TotalSquare, WorstPredictedExamples}\n```\n\n如果你对所选择的方法或超参数不满意，可以通过配置超参数的新值来重新训练模型。你可以借助\
  \ `Information` 命令访问当前方法的值，并添加 `Method`（显示用于训练模型的方法）、方法描述（所用方法的描述）和 `MethodOption`（方法选项）等属性。\n\
  \n```\nIn[60]:= Information[pF, \"MethodOption\"]\nOut[60]= Method -> {LinearRegression,\
  \ L1Regularization -> 0, L2Regularization -> 1.*10^-6, OptimizationMethod -> NormalEquation}\n\
  ```\n\n\n\n你会看到诸如 `L1Regularization`、`L2Regularization` 和 `OptimizationMethod` 这样的术语。前两个术语与正则化方法相关，其中\
  \ `L1` 指的是 Lasso 回归的名称，`L2` 指的是 Ridge 回归的名称。正则化用于最小化模型的复杂度并减少方差；它还能提高模型的精度，解决过拟合问题。这是通过在损失函数中添加一个惩罚项来实现的；对于\
  \ `L1`，该惩罚项是系数绝对值之和 ![$$ {\\lambda}_1\\ast {\\sum}_{i=0}^N\\left|{\\theta}_i\\right|\
  \ $$](img/500903_2_En_8_Chapter_TeX_IEq5.png)，而对于 `L2`，其表达式为 ![$$ \\left({\\lambda}_2/2\\\
  right)\\ast {\\sum}_{i=0}^N{\\theta}_i² $$](img/500903_2_En_8_Chapter_TeX_IEq6.png)，其中需要最小化的函数是损失函数\
  \ ![$$ \\left(1/2\\right){\\sum}_{i=0}^N{\\left({y}_i-f\\left(\\theta, {x}_i\\right)\\\
  right)}² $$](img/500903_2_En_8_Chapter_TeX_IEq7.png)。如需更深入的数学知识，请参考 Stuart Russell\
  \ 和 Peter Norvig 所著的《*人工智能：一种现代方法*》（Prentice Hall，2010 年）以及 Gareth James、Trevor\
  \ Hastie、Robert Tibshirani 和 Daniela Witten 所著的《*统计学习导论：基于 R 的应用*》（Springer，2017\
  \ 年）。第三个术语是你想要选择的优化方法；现有的方法包括 `NormalEquation`、`StochasticGradientDescent` 和 `OrthanWiseNewton`。话虽如此，必须强调的是，使用符合\
  \ `L1` 和 `L2` 标准的系数向量被称为弹性网络回归模型。当参数之间存在相关性时，可能会使用弹性网络。更多理论请参考 Trevor Hastie、Robert\
  \ Tibshirani 和 Jerome Friedman 所著的《*统计学习基础：数据挖掘、推断与预测*》（Springer，2009 年）。\n\n###\
  \ 重新训练模型超参数\n\n如下文所述，让我们重新训练模型，但使用以下值：`L1` → 12，`L2` → 100，优化算法 `OptimizationMethod`\
  \ → `StochasticGradientDescent`，`TrainingProgressReporting` → `None`，`PerformanceGoal`\
  \ → `\"Quality\"`，`RandomSeeding` → 10000，`TargetDevice` → `\"CPU\"`。\n\n```\nIn[61]:=\
  \ pF2 = Predict[training, Method -> {\"LinearRegression\", \"L1Regularization\"\
  \ -> 12, \"L2Regularization\" -> 100, \"OptimizationMethod\" -> Automatic}, TrainingProgressReporting\
  \ -> None, PerformanceGoal -> \"Quality\", RandomSeeding -> 10000, TargetDevice\
  \ -> \"CPU\"];\n```\n\n要查看与某个示例相关的属性，请在 `PredictorFunction` 的输入数据后输入属性——例如，`PF2[\"\
  example\", \"Properties\"]`。让我们像之前一样通过显示图表和指标来比较新模型的性能（见图 8-13 和 8-14）。\n\n**注意**\n\
  \n标准差指的是残差的均方根，即均方根误差（RMSE）。\n\n```\nIn[62]:= pRM2=PredictorMeasurements[pF2,test];\n\
  pRM2[#]&/@{\"ResidualHistogram\",\"ResidualPlot\",\"ComparisonPlot\"}/. plot_Graphics:>Show[plot,ImageSize->Small]\n\
  Dataset[AssociationMap[pRM2[#,ComputeUncertainty->True]&,{\"StandardDeviation\"\
  ,\"RSquared\"}]]\nOut[63]=\nOut[64]=\n```\n\n![](img/500903_2_En_8_Fig14_HTML.jpg)\n\
  \n一个包含 2 行 2 列的表格。第 1 行：标准差，6.8 ± 0.7。第 2 行：R 平方，0.44 ± 0.15。\n\n**图 8-14** 标准差和\
  \ R 平方的新值\n\n![](img/500903_2_En_8_Fig13_HTML.jpg)\n\n3 张图。左图：计数相对于实际值减预测值的直方图，最高点在\
  \ (0, 60)。中图：实际值减预测值相对于预测值的残差图。有一条位于 0 的线，并绘制了数据点。右图：实际值相对于预测值的散点图，预测值呈正相关。\n\n\
  **图 8-13** 重新训练模型的图表\n\n观察图表和数据，你会发现模型只是在一定程度上有所下降；这与新的 R 平方值相符。然而，它仍然是一个用于未来预测的糟糕模型。性能不佳可能是由于优化选择以及\
  \ `L1` 和 `L2` 参数导致的。尝试探索不同的 `L1` 和 `L2` 值以寻求潜在的改进。\n\n## 逻辑回归\n\n逻辑回归是一种在统计学中常用，同时也在机器学习中使用的技术。逻辑回归的工作原理是假设响应变量的值只取两个值，0\
  \ 和 1；这也可以解释为假或真的条件。它是一个二元分类器，使用一个函数来预测条件是否满足的概率，具体取决于模型的构建方式。通常，这种模型类型用于分类，因为它可以提供概率和分类结果，因为逻辑回归的值在两个值之间振荡。在逻辑回归中，目标变量是一个包含编码数据的二元变量。更多信息请参考\
  \ Laura Igual、Santi Seguí、Jordi Vitrià、Eloi Puertas、Petia Radeva、Oriol Pujol、Sergio\
  \ Escalera、Francesc Dantí 和 Lluis Garrido 所著的《*数据科学导论：概念、技术与应用的 Python 方法*》（Springer，2017\
  \ 年）。\n\n\n\n## 泰坦尼克号数据集\n\n在以下示例中，你将使用泰坦尼克号数据集，该数据集描述了乘客的生存状况。所使用的变量包括 `class`、`age`、`sex`\
  \ 和 `survival condition`。你可以直接从 `ExampleData` 中将数据加载为数据集（见图 8-15），并枚举数据集的行。\n\n\
  **注意：** 本节使用查询语言构建，以便读者更深入地理解如何在数据集中使用它。\n\n```\nIn[65]:= titanic=Query[AssociationThread[Range[Length@#]->Range[Length@#]]][ExampleData[{\"\
  Dataset\",\"Titanic\"}]]&[ExampleData[{\"Dataset\",\"Titanic\"}]]\nOut[65]=\n```\n\
