  \ Cloud、访问文档（本地或基于 Web）以及在笔记本内搜索的按钮。\n\n**注意** 根据光标所在位置的选定单元格类型（从文本到代码格式），可能会出现不同的按钮。图\
  \ 1-7 显示的是 Wolfram 语言代码输入单元格。图 1-9 显示的是文本显示单元格。\n\n![](img/500903_2_En_1_Fig9_HTML.jpg)\n\
  \n文本单元格的截图，包含以下工具：`bold`、`italic`、`underline` 和 `insert code text`。\n\n**图 1-9**\
  \ 笔记本界面中用于 `bold`、`italic`、`underline` 和 `insert code text` 评估与终止选项的文本单元格选项。\n\n\
  这一重要补充提供了连贯的用户体验，并在 Mathematica 中营造了一个更精简、更高效的程序设计环境。例如，图 1-10 显示了一个带有彩色背景的代码输入单元格。\n\
  \n![](img/500903_2_En_1_Fig10_HTML.jpg)\n\nMathematica 页面的截图。它展示了输入和输出单元格的结构，以及一个包含\
