  \ \"3rd\", \"male\", True, True, All,     Medium],    plotClass[\"1st\", \"2nd\"\
  , \"3rd\", \"female\", True, True, All,     Medium]};\nfalsePlot = {plotClass[\"\
  1st\", \"2nd\", \"3rd\", \"male\", False, True, All,     Medium],    plotClass[\"\
