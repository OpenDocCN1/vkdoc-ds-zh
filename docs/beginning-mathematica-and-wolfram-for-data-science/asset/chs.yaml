  Out[72]=\n```\n\n本示例考察了*泰坦尼克号*乘客的生存状况。它构建了一个模型，用于分类给定的 `class`、`age` 和 `sex` 是否幸存。特征为\
  \ `class`、`age` 和 `sex`；目标为 `survival status`。这些变量是特征，模型随后使用它们来分类某个 `class`、`age`\
  \ 和 `sex` 是否幸存，即目标变量。数据集被划分为 80%的训练集（837 个元素）和 20%的测试集（209 个元素）。要分割数据集，首先进行随机抽样；然后，提取\
  \ ID 的键，并创建一个按训练集和测试集划分的新数据集（见图 8-19）。\n\n![](img/500903_2_En_8_Fig19_HTML.jpg)\n\
  \n一个数据集被分为两行，标记为 train 和 test，包含 4 个表头：`class`、`age`、`sex` 和 `survived`。每行有 10 个字段，值各不相同。\n\
  \n**图 8-19** 按训练集和测试集划分的泰坦尼克号数据集\n\n```\nIn[73]:= BlockRandom[SeedRandom[8888];\n\
  RandomSample[titanic]];\nKeys@Normal@Query[All][%];\n{train,test}={%[[1;;837]],%[[838;;1046]]};\n\
  dataset=Query[{Map[Key,train]},\"Test\"->{Map[Key,test]} |> ][titanic]\nOut[77]=\n\
  ```\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n### 分类函数\n\n`Classify`\
  \ 命令是 Wolfram 语言机器学习方案中使用的另一个超级函数。此函数可用于解决分类问题的任务。该函数接受的数据包括数值、文本、声音和图像数据。此函数的输入数据可以与\
  \ `Predict` 函数的 `{x → y}` 格式相同。但是，也可以将数据作为元素列表、元素关联或数据集输入。在这种情况下，您将其作为数据集引入。\n\n\
  在这种情况下，您通过指定列输入（`class`、`age`、`sex`）指向目标（`survived`），从数据集格式中提取数据。现在，让我们使用以下选项构建分类器函数（参见图\
  \ 8-20）：`Method → {LogisticRegression, L1 → Automatic, L2 → Automatic}`。当选择 `Automatic`\
  \ 时，您让 Mathematica 选择 `L1` 和 `L2` 参数的最佳组合。对于 `OptimizationMethod`，设置 `StochasticGradientDescent`\
  \ 方法。并将性能目标设置为 `Quality`。最后，选择一个值为 100,000 的种子，并将 CPU 单元作为目标设备。逻辑回归的优化方法包括有限内存 Broyden-Fletcher-Goldfarb-Shanno\
  \ 算法、`StochasticGradientDescent` 和牛顿法。这些用于估计逻辑函数的参数。规则构建是使用 `Query` 语言从数据集内的数据完成的。\n\
  \n![](img/500903_2_En_8_Fig20_HTML.jpg)\n\n一个分类器函数，读取左方括号减函数，图形输入类型 = 左花括号名义型、数值型、名义型、右花括号，类别\
  \ = false、true，方法 = 逻辑回归，训练样本数 = 837，右方括号。\n\n**图 8-20** ClassifierFunction 对象\n\
  \n```\nIn[78]:= cF = Classify[Flatten[Values[Normal[Query[\"Train\", All, All, {#class,\
