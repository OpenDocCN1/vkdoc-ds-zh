  \n\n\n### Mathematica 的设计\n\n现在你已经对 Mathematica 的基本格式有了大致了解，可以学习其内部工作原理了。在 Mathematica\
  \ 内部，有两个基本进程：Mathematica 内核和图形界面。Mathematica 内核负责执行编程计算；它是 Wolfram 语言被解释执行的地方，并与每个\
  \ Mathematica 会话相关联。Mathematica 界面允许用户与 Wolfram 语言函数进行交互，同时记录你的工作进度。每个笔记本都包含多个单元格，Mathematica\
  \ 内核接收到的命令在这些单元格中被编写并随后被求值。每个单元格都有一个关联的编号。单元格有两种类型：输入单元格和输出单元格。它们相互关联，并具有以下表达式：`In[n]:=\
  \ 表达式` 和 `Out[n] := 结果` 或（“新表达式”）。求值过程根据哪个单元格先被求值来排序，并按升序继续。当退出内核会话时，所有信息、已执行的计算和存储的变量都会被释放，内核会重新启动，包括单元格表达式。要退出内核会话，请选择\
  \ `Evaluation ➤ Quit Kernel ➤ Local`。\n\n**提示**\n\n要启动一个新的内核会话，请点击 `Evaluation ➤\
  \ Start Kernel ➤ Local`。\n\n首先，尝试输入以下计算。\n\n```\nIn[1] := (11*17) + (4/2)\nOut[1]\
  \ = 189\n```\n\n该计算显示 `In` 和 `Out` 带有一个数字。这个数字是与被求值表达式相关联的编号。\n\n每个表达式被求值后，会出现一个建议栏（见图\
  \ 1-5）。除非用户隐藏，否则 Mathematica 中的建议栏始终可见。建议栏会提供可能应用于生成输出的新命令或函数的建议。如果你不确定下一步该编写什么代码，建议栏有时会很有帮助；如果使用得当，它可能会很有用。\n\
  \n![](img/500903_2_En_1_Fig5_HTML.jpg)\n\nMathematica 中建议栏的截图。它包括质因数分解、除数、名称、二进制形式等。\n\
  \n**图 1-5** 用于更多可能求值的建议栏\n\nMathematica 的输入形式很直观；要在 Mathematica 笔记本中编写内容，只需将光标放在空白区域，光标会指示你位于一个尚未被求值的单元格内。要求值一个单元格，请按下\
  \ `[Shift + Enter]` 键，指示 Mathematica 内核求值所编写的表达式。下一章将介绍使用新工具栏求值表达式的新形式。\n\n要求值整个笔记本，请转到工具栏上的\
  \ `Evaluation` 选项卡，然后选择 `Evaluate Notebook`。如果计算的执行时间超出预期，你执行了错误的代码，或者想要中止计算，Mathematica\
  \ 提供了几种停止计算的方法。要中止计算，请转到 `Evaluation ➤ Abort Evaluation`。或者，在 Windows 中使用键盘快捷键 `[Alt\
  \ + .]`，在 macOS 中使用 `[⌘ + .]`。\n\n当创建一个新笔记本时，默认设置会应用于每个单元格（输入样式）。尽管如此，可以在 Mathematica\
  \ 中使用各种选项编辑偏好设置。要访问它们，请转到 `Edit ➤ Preferences`。在 macOS 上，偏好设置（设置）菜单位于应用程序菜单中，请转到\
  \ `Mathematica ➤ Settings`。\n\n打开后，会弹出一个窗口（见图 1-6），其中包含多个选项卡（`Interface`、`Appearance`、`AI\
  \ Settings` 等）。基本的自定义设置包括缩放、语言设置和其他一般指令。`Appearance` 选项卡与代码语法颜色（即符号、字符串、注释、错误等）相关。`AI\
  \ Settings` 选项卡是与 LLM（大型语言模型）求值器关联的新选项卡。其他选项属于本书未使用的高级设置。请随意浏览每个选项。\n\n![](img/500903_2_En_1_Fig6_HTML.jpg)\n\
  \n偏好设置窗口的截图。它列出了界面下的选项，包括界面、语言、输入辅助和常规设置。\n\n**图 1-6** 偏好设置窗口\n\n稍后，你将学习笔记本界面的深度设置和自定义选项，这些选项允许你定制偏好设置。\n\
  \n## Mathematica 环境\n\n本节将探讨 Mathematica 的用户界面，重点关注笔记本界面以及其他用户体验功能。\n\n\n\n### 笔记本界面\n\
  \nMathematica 始终致力于提升用户体验和工作效率。在 13.1 版本中，引入了一项重大增强——在所有标准笔记本用户界面（UI）中无缝集成了一个默认工具栏（见图\
  \ 1-7）。\n\n![](img/500903_2_En_1_Fig7_HTML.jpg)\n\nMathematica 窗口中工具栏的截图。它包含 `evaluate`、`setting`、`insert\
  \ cell`、`queued cells`、`text field`、`search` 以及其他几个工具。\n\n**图 1-7** 新的 UI 默认工具栏展示了高效代码开发所需的基本工具和功能。工具栏图标可能因\
  \ Mathematica 版本而异。\n\n这个新工具栏（从左到右描述）包含多项新功能，旨在提升用户体验。`Evaluate` 允许用户进行基本和自定义的代码评估。`Abort`\
  \ 让用户取消排队中的单元格并移除选定的单元格；这两个选项如图 1-8 所示。如前所述，这些功能也可以通过键盘访问。\n\n![](img/500903_2_En_1_Fig8_HTML.jpg)\n\
  \n`evaluate` 下拉列表的截图，其中包括 `selected cells`、`initialization cells` 和 `notebook`、评估控制，以及包含\
  \ `abort all cells in the queue` 和 `remove selected cells from the queue` 的 `abort\
  \ evaluation`。\n\n**图 1-8** 笔记本界面中用于代码评估和终止的广泛选项；双箭头形状可隐藏工具栏。\n\n其他选项集成了文本单元格格式化功能，提供诸如单元格样式（标题、副标题等）和单元格背景颜色等样式选项。用户还能受益于便捷的单元格管理功能，例如分组、拆分、合并单元格，以及插入输入/输出单元格，所有这些都简化为简单的按钮。继续查看诸如\
  \ `extend selection`、`convert natural language into Wolfram Language code`、`collapse\
  \ cells`、`insert comment`、`math form input` 和 `LATEX rendering` 等选项，用户还可以使用 `drawing\
